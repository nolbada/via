C(1,"Q",1,"빈칸에 들어갈 말로 알맞은 것은?<br>She always puts on lotion ___ she washes her face.",["since","after"],"after","She always puts on lotion after she washes her face.","그녀는 세수를 한 후에 항상 로션을 바른다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표(POINT 1)를 펴세요.",
 "1) 세수를 하는 일과 로션을 바르는 일 중 어느 것이 먼저일까요?  2) 순서를 나타내는 말(since는 ‘~한 이래로’, after는 ‘~한 후에’)에서 문장 뜻에 맞는 것을 골라요.",
 "세수를 ‘한 후에’ 로션을 바르는 거예요. 두 보기 중 ‘~한 후에’ 쪽이에요.","after = ~한 후에 (순서: 먼저 한 일 + after)");
// ===== UNIT 1 연습문제 A (p.143) =====
const MA=["ⓐ ~할 때, ~하면서","ⓑ ~이기 때문에","ⓒ ~한 이래로"];
C(1,"A",1,"밑줄 친 접속사의 의미를 보기에서 골라 기호를 쓰시오.<br>I was shy <u>as</u> I was not good at dancing.",MA,"ⓑ ~이기 때문에","I was shy as I was not good at dancing.","나는 춤을 잘 못 췄기 때문에 수줍었다.",
 "본책 p.142 아래쪽 ‘하나의 접속사가 다양한 의미로 쓰인다’ 박스에서 as를 보세요.",
 "1) 앞 문장은 ‘나는 수줍었다’, 뒤 문장은 ‘춤을 잘 못 췄다’예요.  2) 두 문장이 ‘때’를 말하는지, ‘이유’를 말하는지 생각해 보세요. 수줍었던 까닭이 뒤에 나와요.",
 "‘춤을 잘 못 춰서 수줍었다’라는 이유예요. 보기 중 이유를 말하는 것을 고르세요. 가운데 보기예요.","as가 이유(~이기 때문에)면 앞뒤가 원인과 결과");
C(1,"A",2,"밑줄 친 접속사의 의미를 보기에서 골라 기호를 쓰시오.<br>I couldn’t finish the food <u>since</u> it was too spicy.",MA,"ⓑ ~이기 때문에","I couldn’t finish the food since it was too spicy.","나는 음식이 너무 매웠기 때문에 다 먹을 수 없었다.",
 "본책 p.142 ‘하나의 접속사가 다양한 의미로 쓰인다’ 박스에서 since를 보세요.",
 "1) couldn’t finish(다 먹을 수 없었다, couldn’t의 원형 can: ~할 수 있다) 뒤에 it was too spicy(너무 매웠다)가 와요.  2) 매웠던 것이 다 못 먹은 까닭인지, 다 못 먹은 때를 말하는지 따져 보세요.",
 "‘너무 매워서 다 못 먹었다’는 이유예요. since가 ‘~한 이래로’가 아니라 이유로 쓰였어요. 가운데 보기예요.","since는 ‘이유(~이기 때문에)’로도 쓰임, 문맥으로 판단");
C(1,"A",3,"밑줄 친 접속사의 의미를 보기에서 골라 기호를 쓰시오.<br>My sister likes winter <u>as</u> she loves snowy days.",MA,"ⓑ ~이기 때문에","My sister likes winter as she loves snowy days.","내 여동생은 눈 오는 날을 아주 좋아하기 때문에 겨울을 좋아한다.",
 "본책 p.142 ‘하나의 접속사가 다양한 의미로 쓰인다’ 박스에서 as 두 가지 뜻을 비교하세요.",
 "1) 여동생이 겨울을 좋아하는 이유가 뒤에 나와 있는지 보세요.  2) loves snowy days(눈 오는 날을 아주 좋아한다)가 겨울을 좋아하는 까닭이 되는지 생각해요.",
 "‘눈 오는 날을 좋아해서 겨울을 좋아한다’라는 이유예요. 가운데 보기예요.","as 뒤가 앞 내용의 까닭이면 ‘~이기 때문에’");
C(1,"A",4,"밑줄 친 접속사의 의미를 보기에서 골라 기호를 쓰시오.<br><u>As</u> I grew up, I became more outgoing.",MA,"ⓐ ~할 때, ~하면서","As I grew up, I became more outgoing.","나는 자라면서 더 외향적으로 되었다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 as(~할 때, ~하면서)를 확인하세요.",
 "1) grew up(자랐다, 원형 grow up: 자라다)과 became(되었다, 원형 become: 되다)이 함께 일어나는 일이에요.  2) 자라는 동안에 점점 변하는 모습이라서 이유보다 ‘함께 진행되는 때’ 느낌이에요.",
 "‘자라면서 더 외향적이 되었다’예요. 보기 중 맨 위(첫 번째) 보기예요.","as: 변화·진행이 함께 일어나면 ‘~하면서’");
C(1,"A",5,"밑줄 친 접속사의 의미를 보기에서 골라 기호를 쓰시오.<br>I have lost a lot of weight <u>since</u> I started playing soccer.",MA,"ⓒ ~한 이래로","I have lost a lot of weight since I started playing soccer.","나는 축구를 하기 시작한 이래로 살이 많이 빠졌다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 since(~한 이래로)를 확인하세요.",
 "1) have lost(have p.p., 지금까지 빠졌다)는 현재완료예요.  2) 축구를 시작한 ‘그때부터 지금까지’ 살이 빠졌다는 뜻이에요. 시작한 시점부터를 나타내는 뜻을 고르세요.",
 "‘시작한 이래로’ 뜻이에요. 보기 중 맨 마지막(세 번째)이에요.","현재완료 + since ~ = ~한 이래로 (시작 시점)");
// ===== B =====
W(1,"B",1,"밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>Karen will call you when <u>she will be ready</u> to go.","she is ready","Karen will call you when she is ready to go.","Karen은 갈 준비가 되면 너에게 전화할 것이다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표 아래 ‘미래의 일이라도 현재시제를 쓴다’ 박스를 보세요.",
 "1) when(~할 때)이 이끄는 부분이 ‘시간’을 나타내는 절이에요.  2) 이 절은 앞으로 일어날 일이어도 will을 쓰지 않아요. 밑줄 부분에서 어떤 말을 빼야 할까요?",
 "will be를 am/is/are 중 주어 she에 맞는 말로 바꿔요. 두 글자 be동사예요.","시간 접속사 절은 미래도 현재시제 (will 빼기)");
W(1,"B",2,"밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>He charged his smartphone before <u>he went out</u> to dinner.","O","He charged his smartphone before he went out to dinner.","그는 저녁 먹으러 나가기 전에 스마트폰을 충전했다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표와 ‘현재시제’ 박스를 보세요.",
 "1) 전체 문장은 charged(충전했다, 원형 charge: 충전하다)로 과거 이야기예요.  2) before(~하기 전에) 뒤도 과거시제로 맞는지, 접속사 뒤에 주어+동사가 있는지 확인해요.",
 "went(원형 go: 가다)는 과거 시제라서 문장 시제와 맞아요. 고칠 곳이 없어요.","과거 문장의 before 절도 과거(went) → O");
W(1,"B",3,"밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>I will wait here until the rain <u>will stop</u>.","stops","I will wait here until the rain stops.","나는 비가 그칠 때까지 여기서 기다릴 것이다.",
 "본책 p.142 ‘시간을 나타내는 접속사가 이끄는 부사절에서는 현재시제를 쓴다’ 박스를 보세요.",
 "1) until(~할 때까지)은 시간을 나타내는 접속사예요.  2) 비가 그치는 건 미래의 일이지만 until 절에서는 will을 쓰지 않아요. 주어 the rain은 하나라는 점도 확인해요.",
 "will을 빼고 stop(그치다)에 주어 the rain(3인칭 하나)에 맞는 s를 붙여요. s로 시작하는 5글자예요.","until 절 미래 → 현재시제 (stops)");
// ===== C =====
const CB=["until","because","while","that"];
C(1,"C",1,"보기에서 알맞은 말을 골라 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>He sweated a lot ___ he was exercising.",CB,"while","He sweated a lot while he was exercising.","그는 운동하는 동안 땀을 많이 흘렸다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 while(~하는 동안)을 보세요.",
 "1) he was exercising(운동하고 있었다)은 ‘진행 중인 일’이에요.  2) 땀을 흘린 일이 운동하는 ‘동안’ 일어난 것인지 생각해 보세요. 이유 접속사나 that은 맞지 않아요.",
 "‘~하는 동안’ 뜻의 접속사예요. w로 시작하는 보기예요.","was + -ing(진행) 앞 → while(~하는 동안)");
C(1,"C",2,"보기에서 알맞은 말을 골라 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>We will not start the meeting ___ they arrive.",CB,"until","We will not start the meeting until they arrive.","우리는 그들이 도착할 때까지 회의를 시작하지 않을 것이다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 until(~할 때까지)을 보세요.",
 "1) will not start(시작하지 않을 것이다)와 they arrive(그들이 도착하다)의 관계를 생각해요.  2) ‘도착할 때까지’ 기다린다는 뜻이 자연스러워요. arrive에 will이 없는 것도 단서예요.",
 "‘~할 때까지’ 뜻의 접속사예요. u로 시작하는 보기예요.","not ~ until = ~할 때까지 하지 않다");
C(1,"C",3,"보기에서 알맞은 말을 골라 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>Minji left early ___ she had to go see a doctor.",CB,"because","Minji left early because she had to go see a doctor.","민지는 병원에 가야 했기 때문에 일찍 떠났다.",
 "본책 p.142 아래 ‘이유·결과를 나타내는 접속사’ 표에서 because(~이기 때문에)를 보세요.",
 "1) 민지가 일찍 떠난 일과 병원에 가야 했던 일 중 어느 쪽이 ‘까닭’일까요?  2) 뒤 문장이 앞 문장의 이유가 되는 접속사를 고르세요.",
 "‘~이기 때문에’ 뜻이에요. b로 시작하는 보기예요.","뒤 절이 까닭이면 because 사용");
C(1,"C",4,"보기에서 알맞은 말을 골라 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>She was so tired ___ she fell asleep at once.",CB,"that","She was so tired that she fell asleep at once.","그녀는 너무 피곤해서 즉시 잠들었다.",
 "본책 p.142 ‘이유·결과를 나타내는 접속사’ 표에서 so + 형용사/부사 + that ...을 보세요.",
 "1) so tired(너무 피곤한)라는 말이 먼저 나와요.  2) so ~ 뒤에 ‘그래서 …하다’라는 결과가 이어질 때 짝으로 쓰는 말이 있어요. 짝을 찾으세요.",
 "so tired 뒤에 붙는 짝이에요. t로 시작하는 네 글자예요.","so + 형용사 + that ... = 너무 ~해서 …하다");
// ===== D =====
W(1,"D",1,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>나는 그 소식을 들은 후에 충격을 받았다. (hear)<br>I was shocked ___ ___ ___ the news.","after I heard","I was shocked after I heard the news.","나는 그 소식을 들은 후에 충격을 받았다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 after(~한 후에)를 보세요.",
 "1) ‘들은 후에’라서 순서를 나타내는 접속사가 맨 앞에 와요.  2) 그 뒤에 주어 I와 hear(듣다)를 써요. 충격받은 건 과거의 일이라 hear도 과거형이 필요해요.",
 "접속사(a로 시작, 5글자) + 주어 I + hear의 과거형(h로 시작, 5글자)이에요.","after + 주어 + 동사 (과거면 heard)");
W(1,"D",2,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>우리는 출발하기 전에 안전벨트를 매야 한다. (leave)<br>We need to fasten our seat belts ___ ___ ___.","before we leave","We need to fasten our seat belts before we leave.","우리는 출발하기 전에 안전벨트를 매야 한다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 before(~하기 전에)를 보세요.",
 "1) ‘출발하기 전에’ → 접속사 + 주어 + 동사 순서예요.  2) 주어는 앞 문장과 같은 we(우리), 동사는 leave(떠나다)예요. 지금 이야기하는 때는 현재라서 시제는 그대로 둬요.",
 "접속사(b로 시작, 6글자) + we + leave예요. 세 칸이 다 채워져요.","before + 주어 + 동사 = ~하기 전에");
W(1,"D",3,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>그가 한국에 돌아올 때 Sarah는 공항에 있을 것이다. (return)<br>Sarah will be at the airport ___ ___ ___ to Korea.","when he returns","Sarah will be at the airport when he returns to Korea.","그가 한국에 돌아올 때 Sarah는 공항에 있을 것이다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표의 when(~할 때)과 ‘현재시제’ 박스를 같이 보세요.",
 "1) ‘돌아올 때’ → 접속사 + 주어 + 동사 순서예요.  2) 돌아오는 건 미래지만 시간 접속사 뒤에서는 will을 쓰지 않아요. 주어 he는 3인칭 한 명이에요.",
 "w로 시작하는 4글자 접속사 + 주어 + return(돌아오다)에 3인칭 한 명의 s를 붙인 동사예요.","when 절은 미래도 현재형 (when he returns)");
W(1,"D",4,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>나는 너무 슬퍼서 하루 종일 울었다. (sad)<br>I was ___ ___ ___ I cried all day.","so sad that","I was so sad that I cried all day.","나는 너무 슬퍼서 하루 종일 울었다.",
 "본책 p.142 ‘이유·결과를 나타내는 접속사’ 표에서 so + 형용사/부사 + that ...을 보세요.",
 "1) ‘너무 슬퍼서 ~했다’라는 원인과 결과의 구조예요.  2) 슬픈 정도를 강조하는 말 + 주어진 형용사 + 연결하는 접속사 순서로 세 칸을 채워요.",
 "첫 칸 s로 시작하는 2글자, 둘째 칸 주어진 말 sad, 셋째 칸 t로 시작하는 4글자예요.","so + 형용사 + that ... (너무 ~해서 …했다)");
// ===== UNIT 2 Quiz (p.144) =====
C(2,"Q",1,"빈칸에 들어갈 말로 알맞은 것은?<br>___ the movie was scary, I sat through it.",["Though","If"],"Though","Though the movie was scary, I sat through it.","그 영화는 무서웠지만, 나는 끝까지 앉아서 보았다.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표를 펴세요.",
 "1) 앞 절 ‘영화가 무서웠다’와 뒤 절 ‘끝까지 봤다’가 서로 어울리는지 반대되는지 보세요.  2) 반대되는 내용을 이을 때 쓰는 접속사와 ‘만약 ~라면’을 말하는 접속사 중에서 고르세요.",
 "무서웠지만 끝까지 봤다는 뜻이에요. ‘비록 ~이지만’ 뜻의 보기예요. T로 시작해요.","though = 비록 ~이지만 (앞뒤가 반대)");
// UNIT 2 A
C(2,"A",1,"( ) 안에서 알맞은 말을 고르시오.<br>(If / Unless) you drink water now, you will be thirsty later.",["If","Unless"],"Unless","Unless you drink water now, you will be thirsty later.","지금 물을 마시지 않으면, 너는 나중에 목마를 것이다.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표의 if와 unless를 비교해 보세요.",
 "1) 뒤 문장은 ‘나중에 목마를 것이다’라는 나쁜 결과예요.  2) 나쁜 결과가 생기려면 앞에서 물을 ‘마시면’일까요, ‘마시지 않으면’일까요?",
 "‘~하지 않으면’ 뜻의 접속사가 와야 해요. U로 시작하는 쪽이에요.","unless = ~하지 않으면 (if ~ not)");
C(2,"A",2,"( ) 안에서 알맞은 말을 고르시오.<br>(Although / If) he studied hard, his grades didn’t improve.",["Although","If"],"Although","Although he studied hard, his grades didn’t improve.","그는 열심히 공부했지만, 그의 성적은 오르지 않았다.",
 "본책 p.144 표에서 though[although]와 if의 뜻을 비교하세요.",
 "1) studied(공부했다, 원형 study: 공부하다)는 과거예요. 이미 있었던 일이라 ‘만약’은 어색해요.  2) ‘열심히 했다’와 ‘성적이 안 올랐다’는 서로 반대되는 내용이에요.",
 "반대되는 내용을 잇는 ‘비록 ~이지만’ 쪽이에요. A로 시작하는 보기예요.","앞뒤가 반대되면 although(비록 ~이지만)");
C(2,"A",3,"( ) 안에서 알맞은 말을 고르시오.<br>Call me (although / if) you need any help.",["although","if"],"if","Call me if you need any help.","도움이 필요하면 나에게 전화해.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표에서 if를 확인하세요.",
 "1) 앞 문장은 ‘나에게 전화해’라는 명령이에요.  2) ‘도움이 필요하다면’이라는 조건을 달아 주는 말이 자연스러워요.",
 "‘~한다면’ 뜻이에요. 두 글자짜리 보기예요.","Call me if ~ : if = ~한다면 (조건 접속사)");
C(2,"A",4,"( ) 안에서 알맞은 말을 고르시오.<br>Sue can’t speak Korean well (if / though) she was born in Korea.",["if","though"],"though","Sue can’t speak Korean well though she was born in Korea.","Sue는 한국에서 태어났지만 한국어를 잘 하지 못한다.",
 "본책 p.144 표에서 though[although](비록 ~이지만)를 확인하세요.",
 "1) 한국에서 태어났다면 보통 한국어를 잘할 것 같아요.  2) 그런데 ‘잘 못한다’고 하니 앞뒤가 반대예요. 반대를 잇는 말을 고르세요.",
 "‘비록 ~이지만’ 뜻이에요. t로 시작하는 보기예요.","앞뒤 내용이 반대 → though");
// B
W(2,"B",1,"밑줄 친 부분을 어법에 맞게 고치시오.<br>I kept studying <u>despite</u> I had a headache.","though","I kept studying though[although] I had a headache.","나는 머리가 아팠지만 계속 공부했다.",
 "본책 p.144 ‘despite와 in spite of는 전치사라서 뒤에 명사(구)가 온다’ 박스를 보세요.",
 "1) despite 뒤에 I had a headache(나는 머리가 아팠다)처럼 주어+동사가 이어져요.  2) despite는 전치사라서 명사만 올 수 있어요. 주어+동사 앞에 올 수 있는 ‘비록 ~이지만’ 접속사로 바꿔야 해요.",
 "t로 시작하는 6글자(또는 a로 시작하는 8글자) 접속사예요. 정답은 둘 중 하나여도 괜찮아요.","despite + 명사(구), though + 주어 + 동사");
W(2,"B",2,"밑줄 친 부분을 어법에 맞게 고치시오.<br>Unless Mr. Park <u>will leave</u> now, he will miss the train.","leaves","Unless Mr. Park leaves now, he will miss the train.","Park 씨가 지금 떠나지 않으면, 그는 기차를 놓칠 것이다.",
 "본책 p.144 ‘조건을 나타내는 접속사가 이끄는 부사절에서는 현재시제를 쓴다’ 박스를 보세요.",
 "1) Unless(~하지 않으면)는 조건을 나타내는 접속사예요.  2) 조건 절은 앞날의 일이어도 will을 쓰지 않아요. 주어 Mr. Park은 한 명이에요.",
 "will을 빼고 leave(떠나다)에 3인칭 한 명에 맞는 s를 붙여요. l로 시작하는 6글자예요.","Unless 절도 미래는 현재형 (leaves)");
W(2,"B",3,"밑줄 친 부분을 어법에 맞게 고치시오.<br><u>Although</u> the cold weather, they went for a walk outside.","Despite","Despite[In spite of] the cold weather, they went for a walk outside.","추운 날씨에도 불구하고 그들은 밖으로 산책을 나갔다.",
 "본책 p.144 ‘despite와 in spite of’ 박스(전치사라서 뒤에 명사(구))를 보세요.",
 "1) the cold weather(추운 날씨)는 주어+동사가 아니라 명사구예요.  2) 접속사 although 뒤에는 절이 와요. 명사구 앞에는 ‘~에도 불구하고’ 뜻의 전치사를 써야 해요.",
 "D로 시작하는 7글자 전치사예요. (I로 시작하는 3단어 표현도 가능해요.)","명사(구) 앞 양보 → despite[in spite of]");
W(2,"B",4,"밑줄 친 부분을 어법에 맞게 고치시오.<br>If you <u>will set</u> the alarm for six, you won’t be late tomorrow.","set","If you set the alarm for six, you won’t be late tomorrow.","여섯 시에 알람을 맞추면 너는 내일 늦지 않을 것이다.",
 "본책 p.144 ‘조건을 나타내는 접속사가 이끄는 부사절’ 현재시제 박스를 보세요.",
 "1) If(~한다면) 절은 조건을 나타내요.  2) 내일의 일이어도 조건 절 안에서는 will을 쓰지 않아요. 주어는 you라서 s도 붙지 않아요.",
 "will만 지우면 돼요. 주어가 you라서 남은 동사 모양은 바꾸지 않아요. s로 시작하는 3글자예요.","if 절은 미래도 현재형 (will 빼기)");
// C
W(2,"C",1,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>If you open the window, you will feel cool.<br>→ Open the window, ___ ___ ___ ___ cool.","and you will feel","Open the window, and you will feel cool.","창문을 열어라, 그러면 시원함을 느낄 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표를 보세요.",
 "1) If ~ (~한다면) 문장을 명령문으로 바꾸는 문제예요.  2) ‘창문을 열면 시원하다’는 좋은 결과가 이어져요. 그럴 땐 and, or 중 어떤 말을 쓸까요?",
 "좋은 결과를 잇는 a로 시작하는 3글자 접속사 + 주어 + 조동사 + 동사원형, 네 칸이에요. 주어와 동사는 If 문장에서 가져와요.","명령문 + and ~ = …해라, 그러면 ~할 것이다");
W(2,"C",2,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>If you don’t arrive on time, you won’t be able to take the test.<br>→ ___ on time, ___ you won’t be able to take the test.","Arrive, or","Arrive on time, or you won’t be able to take the test.","제시간에 도착해라, 그러지 않으면 너는 시험을 볼 수 없을 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표의 ‘명령문 + or ~’를 보세요.",
 "1) If you don’t ~(~하지 않으면)를 명령문으로 바꾸는 문제예요.  2) 첫 칸은 동사 하나로 명령, 둘째 칸은 ‘그러지 않으면’을 뜻하는 말이에요.",
 "첫 칸은 동사원형 하나(문장 맨 앞이라 대문자로 시작), 둘째 칸은 o로 시작하는 두 글자예요.","명령문 + or ~ = …해라, 그러지 않으면 ~");
W(2,"C",3,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>If you ring the bell, a waiter will come to take your order.<br>→ ___ ___ ___, and a waiter will come to take your order.","Ring the bell","Ring the bell, and a waiter will come to take your order.","벨을 눌러라, 그러면 웨이터가 주문을 받으러 올 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표의 ‘명령문 + and ~’ 예문을 보세요.",
 "1) 뒤에 이미 and a waiter will come(그러면 웨이터가 올 것이다)이 있어요.  2) 그러니 빈칸에는 If 절의 내용을 명령문으로 바꾸어 쓰면 돼요. 주어 you와 If는 빼요.",
 "R로 시작하는 4글자 동사원형 + 2단어(무엇을 누르는지)로 세 칸이에요.","If you ~ 문장 = 동사원형으로 시작하는 명령문");
W(2,"C",4,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>Get some rest, or your cold will get worse.<br>→ ___ ___ ___ some rest, your cold will get worse.","Unless you get","Unless you get some rest, your cold will get worse.","휴식을 취하지 않으면 감기가 더 심해질 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표에서 ‘or ~’ 예문 아래의 (= Unless ~) 줄을 보세요.",
 "1) ‘명령문 + or ~’는 ‘…하지 않으면 ~할 것이다’라는 뜻이에요.  2) ‘~하지 않으면’을 한 단어로 하는 접속사 + 주어 + 동사 원형으로 써요. 부정어 not은 쓰지 않아요.",
 "U로 시작하는 6글자 접속사 + 주어 + 명령문의 동사를 그대로 쓴 동사원형, 세 칸이에요.","명령문 + or ~ = Unless + 주어 + 동사");
// D
W(2,"D",1,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>네가 약속을 지키지 않으면, 우리는 실망할 것이다. (keep)<br>___ ___ ___ your promise, we will be disappointed.","Unless you keep","Unless you keep your promise, we will be disappointed.","네가 약속을 지키지 않으면, 우리는 실망할 것이다.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표에서 unless를 보세요.",
 "1) ‘지키지 않으면’이라는 부정의 뜻이에요. 빈칸이 세 칸이라 not이 들어갈 자리가 없어요.  2) not의 뜻을 이미 품고 있는 접속사 + 주어 + keep(지키다)으로 써요.",
 "U로 시작하는 6글자 접속사 + 주어 + 주어진 동사예요. 동사는 현재형 그대로 써요.","~하지 않으면 = Unless + 긍정문");
W(2,"D",2,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>먼저 네 방을 청소해라, 그러면 너는 친구들과 놀러갈 수 있다. (hang out)<br>Clean your room first, ___ ___ ___ ___ ___ with your friends.","and you can hang out","Clean your room first, and you can hang out with your friends.","먼저 네 방을 청소해라, 그러면 너는 친구들과 놀러갈 수 있다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표를 보세요.",
 "1) 앞에 Clean your room first(먼저 방을 청소해라)라는 명령문이 있어요.  2) ‘그러면 놀러갈 수 있다’는 좋은 결과라서 연결하는 말을 고르고, ‘~할 수 있다’는 can을 써요.",
 "다섯 칸이에요. a로 시작하는 3글자 접속사 + 주어 + ‘~할 수 있다’ 조동사 + 주어진 두 단어예요.","명령문, and you can ~ (그러면 ~할 수 있다)");
W(2,"D",3,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>비록 그 팀이 졌지만, 매우 훌륭한 게임이었다. (lose)<br>___ ___ ___ ___, it was a really good game.","Though the team lost","Though[Although] the team lost, it was a really good game.","비록 그 팀이 졌지만, 매우 훌륭한 게임이었다.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표에서 though[although]를 보세요.",
 "1) ‘졌지만 훌륭했다’는 앞뒤가 반대되는 내용이에요.  2) 비록 ~이지만 + the team + lose(지다)의 과거형 순서로 네 칸을 채워요.",
 "T로 시작하는 6글자 접속사 + 주어 두 단어 + l로 시작하는 4글자 동사(원형 lose: 지다, 과거형)예요. A로 시작하는 접속사도 가능해요.","양보 접속사 + 주어 + 동사(과거 lost)");
W(2,"D",4,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>네가 표를 빨리 산다면, 너는 더 좋은 가격에 살 수 있을 것이다. (buy)<br>___ ___ ___ the tickets early, you will get a better price.","If you buy","If you buy the tickets early, you will get a better price.","네가 표를 빨리 산다면, 너는 더 좋은 가격에 살 수 있을 것이다.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표의 if와 현재시제 박스를 보세요.",
 "1) ‘산다면’은 조건을 말해요. 앞날의 일이지만 조건 절이니 will은 쓰지 않아요.  2) 접속사 + 주어 + buy(사다) 세 칸이에요.",
 "i로 시작하는 두 글자 접속사 + 주어 + b로 시작하는 3글자 동사예요.","if 절은 미래도 현재형 (If you buy)");
// ===== UNIT 3 Quiz (p.146) =====
C(3,"Q",1,"that이 들어갈 위치로 알맞은 곳은?<br>ⓐ Jenny said ⓑ she is ⓒ looking for her dog.",["ⓐ","ⓑ","ⓒ"],"ⓑ","Jenny said that she is looking for her dog.","Jenny는 자신이 개를 찾고 있다고 말했다.",
 "본책 p.146 ‘that’ POINT 1 표(주어·목적어·보어)를 보세요.",
 "1) said(말했다, 원형 say: 말하다) 뒤에 ‘무엇을 말했는지’ 내용이 나와요.  2) 그 내용은 she is looking for her dog 전체예요. 내용 덩어리가 시작되는 곳 앞에 접속사가 와요.",
 "said와 she 사이, 두 번째 칸(ⓑ)이에요. 목적어 that절의 시작 자리예요.","that절은 말하는 내용의 앞에 (said that + 주어 + 동사)");
// A
const TA=["ⓐ 접속사","ⓑ 지시대명사","ⓒ 지시형용사"];
C(3,"A",1,"밑줄 친 that의 쓰임을 보기에서 골라 기호를 쓰시오.<br>Look at <u>that</u> man over there.",TA,"ⓒ 지시형용사","Look at that man over there.","저기 있는 저 남자를 봐.",
 "본책 p.146 ‘that은 접속사뿐만 아니라 지시대명사나 지시형용사로도 쓰인다’ 박스를 보세요.",
 "1) that 바로 뒤에 man(남자)이라는 명사가 있어요.  2) 명사를 꾸며 주는 that은 ‘그 ~, 저 ~’라는 뜻이에요.",
 "‘그 ~, 저 ~’처럼 명사 앞에 쓰는 말이에요. 보기 중 세 번째예요.","that + 명사 = 지시형용사 (저 ~)");
C(3,"A",2,"밑줄 친 that의 쓰임을 보기에서 골라 기호를 쓰시오.<br>I think <u>that</u> he resembles his mother.",TA,"ⓐ 접속사","I think that he resembles his mother.","나는 그가 어머니를 닮았다고 생각한다.",
 "본책 p.146 ‘that’ POINT 1 표와 아래 박스를 보세요.",
 "1) that 뒤에 he resembles(그는 닮았다, 원형 resemble: 닮다)처럼 주어+동사가 이어져요.  2) think(생각하다)의 내용을 이끄는 that은 문장을 연결해 주는 말이에요.",
 "that 뒤에 주어+동사가 오면 ‘~라는 것’을 이끄는 말이에요. 보기 중 첫 번째예요.","that + 주어 + 동사 = 접속사 (~라는 것)");
C(3,"A",3,"밑줄 친 that의 쓰임을 보기에서 골라 기호를 쓰시오.<br><u>That</u> was her decision.",TA,"ⓑ 지시대명사","That was her decision.","그것은 그녀의 결정이었다.",
 "본책 p.146 ‘that은 접속사뿐만 아니라 지시대명사나 지시형용사로도 쓰인다’ 박스를 보세요.",
 "1) That 바로 뒤에 was(~였다, 원형 be: ~이다)라는 동사가 와요.  2) 명사도, 주어+동사도 없이 That 혼자 주어 자리에 서 있어요. ‘그것’이라는 뜻이에요.",
 "‘그것’으로 해석되는 말이에요. 보기 중 두 번째예요.","That + be동사 = 지시대명사 (그것)");
// B
const TB=["주어","목적어","보어"];
C(3,"B",1,"밑줄 친 that절의 역할을 고르시오.<br>He thinks <u>that he can go jogging tomorrow</u>.",TB,"목적어","He thinks that he can go jogging tomorrow.","그는 내일 조깅하러 갈 수 있다고 생각한다.",
 "본책 p.146 ‘that’ POINT 1 표(주어/목적어/보어)를 보세요.",
 "1) 문장은 He(주어) + thinks(생각하다) + that절이에요.  2) thinks의 ‘무엇을’ 생각하는지가 that절이니, 동사 뒤에서 ‘~을/를’ 역할을 해요.",
 "동사 thinks의 내용(~을)이 되는 that절이에요. 두 번째 보기예요.","동사 + that절 = 목적어(~라는 것을)");
C(3,"B",2,"밑줄 친 that절의 역할을 고르시오.<br>The fact is <u>that Kevin is always late for school</u>.",TB,"보어","The fact is that Kevin is always late for school.","사실은 Kevin이 항상 학교에 지각한다는 것이다.",
 "본책 p.146 ‘that’ POINT 1 표에서 보어 줄(~라는 것(이다))을 보세요.",
 "1) The fact(그 사실) = that절로, is가 둘을 이어 줘요.  2) be동사 뒤에서 주어를 설명해 주는 that절은 ‘~라는 것이다’라고 해석돼요.",
 "be동사(is) 뒤에서 주어를 설명해 주는 자리예요. 세 번째 보기예요.","be동사 + that절 = 보어(~라는 것이다)");
C(3,"B",3,"밑줄 친 that절의 역할을 고르시오.<br>We all know <u>that the earth goes around the sun</u>.",TB,"목적어","We all know that the earth goes around the sun.","우리는 모두 지구가 태양 주위를 돈다는 것을 안다.",
 "본책 p.146 ‘that’ POINT 1 표에서 목적어 줄을 보세요.",
 "1) 주어는 We all, 동사는 know(알다)예요.  2) ‘무엇을 아는가?’ → 지구가 태양 주위를 돈다는 것이에요. 동사 뒤의 ‘~을’ 자리예요.",
 "know(알다)의 대상이 되는 자리예요. 두 번째 보기예요.","know + that절 = 목적어 (~라는 것을 안다)");
C(3,"B",4,"밑줄 친 that절의 역할을 고르시오.<br><u>That the weather is nice today</u> makes me happy.",TB,"주어","That the weather is nice today makes me happy.","오늘 날씨가 좋다는 것이 나를 행복하게 한다.",
 "본책 p.146 ‘that’ POINT 1 표에서 주어 줄(~라는 것은[이])을 보세요.",
 "1) that절이 문장 맨 앞에 있고, 뒤에 동사 makes(만들다, 원형 make)가 와요.  2) 동사 앞에서 ‘~라는 것이’ 역할을 하는 말이에요.",
 "문장의 맨 앞, 동사 makes의 주인이에요. 첫 번째 보기예요.","문장 맨 앞 That절 = 주어 (~라는 것이)");
C(3,"B",5,"밑줄 친 that절의 역할을 고르시오.<br>It is shocking <u>that Sharon got in a car accident</u>.",TB,"주어","It is shocking that Sharon got in a car accident.","Sharon이 교통사고를 당했다는 것은 충격적이다.",
 "본책 p.146 ‘that절이 주어로 쓰인 경우 가주어 it을 쓴다’ 박스를 보세요.",
 "1) It is shocking에서 It은 무슨 뜻으로 해석되지 않는 ‘가짜 주어’예요.  2) 진짜 주어는 뒤로 보내진 that절이에요.",
 "that절이 It 대신 뒤로 간 ‘진주어’예요. 첫 번째 보기예요.","It(가주어) ~ that절(진주어) → that절은 주어");
// C
W(3,"C",1,"밑줄 친 부분을 어법에 맞게 고치시오.<br>I don’t know if Steve <u>comes</u> or not tomorrow.","will come","I don’t know if Steve will come or not tomorrow.","나는 Steve가 내일 올지 안 올지 모르겠다.",
 "본책 p.146 ‘미래를 나타내는 if 조건절에서는 현재시제, if 명사절에서는 미래시제’ 박스를 보세요.",
 "1) know(알다) 뒤의 if는 ‘~인지 아닌지’를 뜻하는 명사절을 이끌어요.  2) ‘내일’의 일이므로 명사절에서는 미래를 나타내는 will을 써야 해요.",
 "comes 앞에 will을 붙이고 동사는 원형으로 써요. will + c로 시작하는 동사 원형이에요.","if 명사절(~인지) → 미래는 will 사용");
W(3,"C",2,"밑줄 친 부분을 어법에 맞게 고치시오.<br>The police may give you a ticket if you <u>will park</u> here.","park","The police may give you a ticket if you park here.","여기에 주차하면 경찰이 너에게 딱지를 줄 수도 있다.",
 "본책 p.146 ‘if 조건절’ 현재시제 박스(I will stay at home if it rains tomorrow)를 보세요.",
 "1) 이 if는 ‘~한다면’이라는 조건을 나타내요. ‘~인지 아닌지’ 뜻이 아니에요.  2) 조건 절은 앞날의 일이어도 will을 쓰지 않아요.",
 "will을 지우면 돼요. 주어가 you라서 남은 동사 모양은 그대로예요. p로 시작하는 4글자예요.","if 조건절(~한다면)은 현재시제");
W(3,"C",3,"밑줄 친 부분을 어법에 맞게 고치시오.<br>What matters is <u>if</u> I pass the test or not.","whether","What matters is whether I pass the test or not.","중요한 것은 내가 시험에 합격하느냐 마느냐이다.",
 "본책 p.146 if, whether 박스(whether는 주어·목적어·보어, if는 목적어만)를 보세요.",
 "1) What matters(중요한 것, 원형 matter: 중요하다)가 주어이고 is가 동사예요.  2) 그러면 빈칸은 is 뒤 ‘보어’ 자리예요. if가 이끄는 명사절은 목적어로만 쓰여요.",
 "보어 자리에 쓸 수 있는 ‘~인지 아닌지’ 접속사예요. w로 시작하는 7글자예요.","if 명사절은 목적어만, 보어는 whether");
W(3,"C",4,"밑줄 친 부분을 어법에 맞게 고치시오.<br>I’m not sure if he <u>arrives</u> on time later.","will arrive","I’m not sure if he will arrive on time later.","나는 그가 나중에 제시간에 도착할지 확실하지 않다.",
 "본책 p.146 ‘if 조건절은 현재시제, if 명사절은 미래시제’ 박스를 보세요.",
 "1) not sure(확실하지 않은) 뒤의 if는 ‘~인지 아닌지’ 뜻이에요.  2) ‘나중에’ 도착할지를 말하니 미래를 나타내야 해요. 명사절에서는 미래시제를 써요.",
 "arrives 앞에 will을 붙이고 동사는 원형으로 써요. will + a로 시작하는 6글자 동사예요.","확실하지 않다(not sure) + if절 → will");
// D
W(3,"D",1,"우리말과 일치하도록 보기와 ( ) 안에 주어진 말을 바르게 배열하시오. (필요시 형태를 바꿀 것)<br>[보기] know / make sure / say / believe<br>나는 우리가 그 경기에서 이길 수 있다고 믿는다. (we / win / that / game / the / can)<br>I ___.","believe that we can win the game","I believe that we can win the game.","나는 우리가 그 경기에서 이길 수 있다고 믿는다.",
 "본책 p.146 ‘that’ POINT 1 표에서 목적어로 쓰인 that절(I hope that ~)을 보세요.",
 "1) 보기 중 ‘믿다’ 뜻의 동사를 골라요.  2) 동사 뒤에 that + 주어 + 동사의 순서로 이어요. ‘이길 수 있다’는 can + 동사원형이에요.",
 "b로 시작하는 동사 + 주어진 6단어, 모두 7단어예요. that은 동사 바로 뒤에 와요.","동사 + that + 주어 + 동사 (믿는 내용)");
W(3,"D",2,"우리말과 일치하도록 보기와 ( ) 안에 주어진 말을 바르게 배열하시오. (필요시 형태를 바꿀 것)<br>[보기] know / make sure / say / believe<br>모두가 흡연이 건강에 나쁘다는 것을 안다. (smoking / bad / is / for / health / your)<br>Everyone ___.","knows smoking is bad for your health","Everyone knows smoking is bad for your health.","모두가 흡연이 건강에 나쁘다는 것을 안다.",
 "본책 p.146 ‘that절이 목적어로 쓰인 경우 that을 생략할 수 있다’ 박스를 보세요.",
 "1) 보기 중 ‘알다’ 뜻의 동사를 고르고, 주어 Everyone(모두)은 한 명 취급이라 s를 붙여요.  2) 주어진 말 중에 that이 없으니, 목적어 that은 생략해 smoking(흡연)부터 이어요.",
 "k로 시작하는 5글자 동사로 시작하고, 그 뒤에 주어진 6단어가 ‘주어 + 동사 + 형용사 + 전치사구’ 순서로 와요. 모두 7단어예요.","know + (that 생략) + 주어 + 동사");
W(3,"D",3,"우리말과 일치하도록 보기와 ( ) 안에 주어진 말을 바르게 배열하시오. (필요시 형태를 바꿀 것)<br>[보기] know / make sure / say / believe<br>너는 프린터 안에 종이가 있는지를 확실히 해야 한다. (paper / there / in / is / the / printer / that)<br>You have to ___.","make sure that there is paper in the printer","You have to make sure that there is paper in the printer.","너는 프린터 안에 종이가 있는지를 확실히 해야 한다.",
 "본책 p.146 ‘that’ POINT 1 표(that은 명사절을 이끈다)를 보세요.",
 "1) ‘확실히 해야 한다’ → have to(~해야 한다) 뒤에는 동사원형이 와요. 보기 중 ‘확실히 하다’ 뜻을 고르세요.  2) 그 뒤에 that + there is(있다) + 종이 + 장소 순서로 이어요.",
 "m으로 시작하는 2단어 동사로 시작해요. have to 뒤라서 원형 그대로예요. 그 뒤 that + ‘~이 있다’ 2단어 + 무엇이 + 어디에 순서, 모두 9단어예요.","make sure that + 주어 + 동사 (확실히 ~하다)");
W(3,"D",4,"우리말과 일치하도록 보기와 ( ) 안에 주어진 말을 바르게 배열하시오. (필요시 형태를 바꿀 것)<br>[보기] know / make sure / say / believe<br>일기예보는 내일 많은 눈이 올 것이라고 말한다. (there / that / be / lots / will / snow / of)<br>The weather forecast ___ tomorrow.","says that there will be lots of snow","The weather forecast says that there will be lots of snow tomorrow.","일기예보는 내일 많은 눈이 올 것이라고 말한다.",
 "본책 p.146 ‘that’ POINT 1 표에서 목적어로 쓰인 that절을 보세요.",
 "1) 주어 The weather forecast(일기예보)는 3인칭 한 개라서 ‘말한다’ 동사에 s가 붙어요.  2) that 뒤에 ‘~이 있을 것이다’ 3단어 + ‘많은 눈’ 3단어 순서로 이어요.",
 "s로 시작하는 4글자 동사(원형 say: 말하다)로 시작하고, 모두 8단어예요.","say + that + there will be ~ (~가 있을 것이다)");
// ===== 서술형 대비 A (pp.148) =====
W("SW","A",1,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>나는 그가 집에 오면 피자를 주문할 것이다. (will / pizza / when / comes / he / order / home)<br>I ___.","will order pizza when he comes home","I will order pizza when he comes home.","나는 그가 집에 오면 피자를 주문할 것이다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 when을 보세요.",
 "1) 문장 뼈대는 I + will + order(주문하다) + pizza예요.  2) ‘그가 집에 오면’은 시간 접속사 + 주어 + 동사 + 장소 순서예요. 시간 접속사 뒤라서 will은 안 써요.",
 "I 다음에 w로 시작하는 조동사가 먼저 와요. 접속사는 7단어 중 네 번째 자리예요.","will 동사원형 + when + 주어 + 현재형");
W("SW","A",2,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>네가 이전에 여기에 와 봤다는 사실은 놀랍다. (is / that / it / you / been / surprising / have / here)<br>___ before.","It is surprising that you have been here","It is surprising that you have been here before.","네가 이전에 여기에 와 봤다는 사실은 놀랍다.",
 "본책 p.146 ‘that절이 주어로 쓰인 경우 가주어 it’ 박스를 보세요.",
 "1) 진짜 주어가 ‘네가 여기에 와 봤다는 것’이라 길어요. 문장 맨 앞에는 가주어를 써요.  2) ‘놀랍다’ 부분을 먼저 쓰고, 그 뒤에 진주어 that절(that + 주어 + 현재완료 + 장소)을 붙여요.",
 "첫 단어는 대문자 I로 시작하는 두 글자예요. 모두 8단어이고, that은 네 번째 자리예요.","It is 형용사 that 주어 동사 (가주어-진주어)");
W("SW","A",3,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>Belle은 다음 달에 그녀가 좋아하는 밴드가 서울에 온다는 것을 들었다. (favorite / that / band / heard / her)<br>Belle ___ is coming to Seoul next month.","heard that her favorite band","Belle heard that her favorite band is coming to Seoul next month.","Belle은 다음 달에 그녀가 좋아하는 밴드가 서울에 온다는 것을 들었다.",
 "본책 p.146 ‘that’ POINT 1 표에서 목적어로 쓰인 that절을 보세요.",
 "1) Belle 다음에는 동사가 와요. ‘들었다’는 hear(듣다)의 과거형이에요.  2) 들은 내용은 that 뒤에 ‘주어 + 동사(is coming)’로 이어져요. 주어는 ‘그녀가 좋아하는 밴드’ 3단어예요.",
 "h로 시작하는 5글자 과거형 동사(원형 hear: 듣다)가 맨 앞이고, 바로 뒤에 접속사가 와요. 모두 5단어예요.","heard(hear의 과거) + that + 주어 + 동사");
W("SW","A",4,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>나는 그 주제가 너무 어려워서 이해할 수가 없었다. (so / that / couldn’t / it / difficult / understand / I)<br>The subject was ___.","so difficult that I couldn’t understand it","The subject was so difficult that I couldn’t understand it.","나는 그 주제가 너무 어려워서 이해할 수가 없었다.",
 "본책 p.142 ‘이유·결과를 나타내는 접속사’ 표에서 so + 형용사/부사 + that ...을 보세요.",
 "1) was 뒤에 ‘너무 어려운’이 와요. so + 형용사 순서예요.  2) ‘너무 ~해서 …할 수 없었다’의 결과 부분은 that + 주어 + couldn’t(~할 수 없었다, 원형 can: ~할 수 있다) + 동사원형 + 목적어예요.",
 "s로 시작하는 2글자로 시작하고, 모두 7단어예요. 마지막 단어는 ‘그것(그 주제)’을 가리키는 말이에요.","so 형용사 that 주어 동사 (너무 ~해서 …)");
W("SW","A",5,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>네가 내게 이메일 주소를 알려주지 않는다면 나는 너에게 파일들을 보낼 수 없다. (your / you / unless / me / give)<br>I can’t send you the files ___ email address.","unless you give me your","I can’t send you the files unless you give me your email address.","네가 내게 이메일 주소를 알려주지 않는다면 나는 너에게 파일들을 보낼 수 없다.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표에서 unless를 보세요.",
 "1) ‘알려주지 않는다면’은 Unless 하나로 ‘~하지 않으면’이 돼요.  2) 그 뒤에 주어 + 동사 + ‘누구에게’ + ‘누구의’ 순서로 이어서 email address 앞까지 만들어요.",
 "u로 시작하는 접속사로 시작하고, 5개 단어를 모두 써요. 맨 끝은 email address를 꾸미는 말이에요.","unless + 주어 + give 사람 + 물건 (~하지 않으면)");
W("SW","A",6,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그의 나쁜 습관은 그의 손톱을 물어뜯는 것이다. (that / he / his / bites / is / nails)<br>His bad habit ___.","is that he bites his nails","His bad habit is that he bites his nails.","그의 나쁜 습관은 그의 손톱을 물어뜯는 것이다.",
 "본책 p.146 ‘that’ POINT 1 표에서 보어 줄(Her problem is that she is too lazy)을 보세요.",
 "1) 주어는 His bad habit(그의 나쁜 습관)이에요. 다음엔 be동사 is가 와요.  2) ‘~라는 것이다’는 that절이 보어로 와서 that + 주어 + 동사(원형 bite: 물어뜯다) + 목적어로 이어요.",
 "i로 시작하는 2글자 be동사가 맨 앞이고, 두 번째가 접속사예요. 모두 6단어예요.","주어 + is + that절(보어) = ~라는 것이다");
W("SW","A",7,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>아빠가 요리하시는 동안 나는 설거지를 했다. (my / cooking / while / was / father)<br>___, I washed the dishes.","While my father was cooking","While my father was cooking, I washed the dishes.","아빠가 요리하시는 동안 나는 설거지를 했다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 while(~하는 동안)을 보세요.",
 "1) 문장이 접속사로 시작하고 쉼표 뒤에 주절이 와요.  2) ‘요리하시는 동안’은 진행형(was + -ing)이에요. 접속사 + 주어 + 진행형 동사 순서예요.",
 "첫 글자는 대문자 W, 모두 5단어예요. 주어는 2단어예요.","While + 주어 + was -ing (~하는 동안)");
// SW B
W("SW","B",1,"밑줄 친 부분을 어법상 바르게 고쳐 문장을 다시 쓰시오.<br>Unless <u>you don’t find the keys</u>, you won’t be able to open the door.<br>→ Unless ___, you won’t be able to open the door.","you find the keys","Unless you find the keys, you won’t be able to open the door.","열쇠를 찾지 못하면 너는 문을 열 수 없을 것이다.",
 "본책 p.144 ‘Unless는 if ~ not과 비슷하며 이미 부정의 의미를 포함한다’ 박스를 보세요.",
 "1) Unless(~하지 않으면)에는 이미 not의 뜻이 들어 있어요.  2) 그런데 밑줄에 don’t(do not, 하지 않는다)가 또 있어요. 이중 부정이 되니 어떻게 고쳐야 할까요?",
 "부정어 하나만 지우고 나머지는 그대로 써요. 4단어가 돼요.","Unless 뒤에는 not 쓰지 않음");
W("SW","B",2,"밑줄 친 부분을 어법상 바르게 고쳐 문장을 다시 쓰시오.<br><u>Giving Jane some chocolate</u>, and she will be very happy.<br>→ ___, and she will be very happy.","Give Jane some chocolate","Give Jane some chocolate, and she will be very happy.","Jane에게 초콜릿을 좀 줘라, 그러면 그녀는 매우 행복해질 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표를 보세요.",
 "1) ‘…해라, 그러면 ~할 것이다’는 명령문 + and ~ 구조예요.  2) 명령문은 동사원형으로 시작해요. -ing(Giving)로는 명령이 안 돼요.",
 "Giving을 동사원형으로 바꿔요. g로 시작하는 4글자예요.","명령문은 동사원형으로 시작 (-ing로 쓰지 않기)");
W("SW","B",3,"밑줄 친 부분을 어법상 바르게 고쳐 문장을 다시 쓰시오.<br><u>When my mother will arrive</u>, I will have dinner with her.<br>→ ___, I will have dinner with her.","When my mother arrives","When my mother arrives, I will have dinner with her.","어머니가 도착하시면 나는 어머니와 저녁을 먹을 것이다.",
 "본책 p.142 ‘시간을 나타내는 접속사가 이끄는 부사절에서는 현재시제’ 박스를 보세요.",
 "1) When(~할 때)이 이끄는 절은 시간을 나타내요.  2) 어머니가 도착하는 건 미래지만 이 절에서는 will을 쓰지 않아요. 주어 my mother는 3인칭 한 명이에요.",
 "will을 빼고 arrive(도착하다)에 s를 붙여요. a로 시작하는 7글자예요.","when 절은 미래도 현재형 (arrives)");
W("SW","B",4,"밑줄 친 부분을 어법상 바르게 고쳐 문장을 다시 쓰시오.<br>My brother is going to the store <u>because of he needs some milk</u>.<br>→ My brother is going to the store ___.","because he needs some milk","My brother is going to the store because he needs some milk.","내 남동생은 우유가 좀 필요해서 가게에 가고 있다.",
 "본책 p.142 ‘because of 뒤에는 명사(구)를 쓴다’ 박스를 보세요.",
 "1) because of 뒤에는 명사(구)가 와요.  2) 그런데 밑줄 뒤에는 he needs(그는 필요하다, 원형 need: 필요하다)처럼 주어+동사가 있어요. 그럼 접속사 because로 바꿔야 해요.",
 "because of에서 of만 빼요. b로 시작하는 접속사로 시작해요.","because + 절, because of + 명사(구)");
W("SW","B",5,"밑줄 친 부분을 어법상 바르게 고쳐 문장을 다시 쓰시오.<br><u>Despite I was out of breath</u>, I didn’t stop running.<br>→ ___, I didn’t stop running.","Though I was out of breath","Though[Although] I was out of breath, I didn’t stop running.","나는 숨이 찼지만 달리기를 멈추지 않았다.",
 "본책 p.144 ‘despite와 in spite of는 전치사라서 뒤에 명사(구)가 온다’ 박스를 보세요.",
 "1) Despite 뒤에 I was ~처럼 주어+동사가 이어져요.  2) 전치사 Despite는 명사(구)만 받을 수 있어요. ‘비록 ~이지만’ 접속사로 바꾸면 돼요.",
 "T로 시작하는 6글자 접속사(또는 A로 시작하는 8글자)를 쓰고 나머지는 그대로예요.","접속사 + 주어 + 동사 (Though ~)");
W("SW","B",6,"밑줄 친 부분을 어법상 바르게 고쳐 문장을 다시 쓰시오.<br><u>If you believe me or not</u> isn’t important.<br>→ ___ isn’t important.","Whether you believe me or not","Whether you believe me or not isn’t important.","네가 나를 믿든 안 믿든 그것은 중요하지 않다.",
 "본책 p.146 if, whether 박스(if가 이끄는 명사절은 목적어로만 쓰임)를 보세요.",
 "1) ‘믿든 안 믿든’이라는 덩어리가 문장의 주어 자리에 있어요.  2) 주어 자리에는 whether가 이끄는 명사절만 쓸 수 있어요. if로는 안 돼요.",
 "If를 대신해 W로 시작하는 7글자 접속사를 써요. 나머지는 그대로예요.","주어로 쓰는 ‘~인지 아닌지’는 whether");
// SW C pictures
W("SW","C",1,"다음 그림을 보고 주어진 말과 「명령문 + and/or ~」 구문을 이용하여 문장을 완성하시오.<br>(그림: 책상에서 숙제를 하는 사람 → 소파에 앉아 TV를 보는 모습. ◯표시. 주어진 말: can watch TV)<br>Finish your homework first, ___.","and you can watch TV","Finish your homework first, and you can watch TV.","먼저 숙제를 끝내라, 그러면 TV를 볼 수 있다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표를 보세요.",
 "1) 그림에서 숙제를 한 다음에 TV를 보는 즐거운 일이 생겨요(◯ 표시).  2) 좋은 결과가 이어지면 and를 써요. and 뒤에 you + 주어진 말(can watch TV)을 이어요.",
 "첫 단어는 a로 시작하는 3글자, 그다음은 주어, 그 뒤에 주어진 말을 그대로 써요.","좋은 결과 ◯ → 명령문, and you ~");
W("SW","C",2,"다음 그림을 보고 주어진 말과 「명령문 + and/or ~」 구문을 이용하여 문장을 완성하시오.<br>(그림: 러닝머신에서 운동하는 사람 → 힘센 건강한 모습. ◯표시. 주어진 말: will be healthier)<br>Exercise every day, ___.","and you will be healthier","Exercise every day, and you will be healthier.","매일 운동해라, 그러면 너는 더 건강해질 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표의 ‘명령문 + and ~’를 보세요.",
 "1) 매일 운동하면 건강해지는 좋은 결과예요(◯ 표시).  2) 접속사 + 주어 + 주어진 말 will be healthier(더 건강해질 것이다) 순서로 써요.",
 "좋은 결과를 잇는 3글자 접속사 + 주어(듣는 사람) + 주어진 말 순서예요.","명령문, and you will ~ (좋은 결과)");
W("SW","C",3,"다음 그림을 보고 주어진 말과 「명령문 + and/or ~」 구문을 이용하여 문장을 완성하시오.<br>(그림: 우산꽂이 옆에 선 사람(X표시: 우산을 챙기지 않음) → 비에 흠뻑 젖은 모습. 주어진 말: will get wet)<br>Take your umbrella, ___.","or you will get wet","Take your umbrella, or you will get wet.","우산을 가져가라, 그러지 않으면 너는 젖을 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표의 ‘명령문 + or ~’를 보세요.",
 "1) 우산을 챙기지 않으면 비에 젖는 나쁜 결과예요(X 표시).  2) 나쁜 결과가 이어지면 ‘그러지 않으면’을 뜻하는 말을 써요.",
 "o로 시작하는 두 글자 접속사 + 주어 + 주어진 말 순서예요.","나쁜 결과 X → 명령문, or you ~");
W("SW","C",4,"다음 그림을 보고 주어진 말과 「명령문 + and/or ~」 구문을 이용하여 문장을 완성하시오.<br>(그림: 따뜻한 코트를 든 사람(X표시: 입지 않음) → 감기에 걸려 누워 있는 모습. 주어진 말: will catch a cold)<br>Wear a warm coat, ___.","or you will catch a cold","Wear a warm coat, or you will catch a cold.","따뜻한 코트를 입어라, 그러지 않으면 너는 감기에 걸릴 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표의 ‘명령문 + or ~’를 보세요.",
 "1) 코트를 입지 않으면 감기에 걸리는 나쁜 결과예요(X 표시).  2) 그림 3번과 같은 방식이에요. ‘그러지 않으면’ 뜻의 접속사 + you + 주어진 말이에요.",
 "3번과 같은 접속사예요. 그 뒤에 주어 + 주어진 말을 그대로 붙여요.","나쁜 결과 → 명령문, or you will ~");
// SW D passage
const PB=["before","while","until","after"];
const PQ="다음 글을 읽고 보기에서 알맞은 접속사를 골라 문장을 완성하시오.<br>[보기] before / while / until / after<br>This is my favorite pasta recipe. First, boil some pasta in a big pot. (1) ___ the pasta is boiling, cut some garlic, eggplant, and mushrooms. (2) ___ the pasta is done, cook the other ingredients in a large pan using olive oil. Add some salt, pepper flakes, and dried herbs. Then stir the ingredients into the pasta (3) ___ everything is mixed together. Lastly, put the pasta on a plate. (4) ___ you serve it, add some shredded cheese on top.<br>";
C("SW","D",1,PQ+"빈칸 (1)에 알맞은 말은?",PB,"while","While the pasta is boiling, cut some garlic, eggplant, and mushrooms.","파스타가 끓고 있는 동안 마늘, 가지, 버섯을 썰어라.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표를 펴세요. while, before, after, until의 뜻을 확인해요.",
 "1) (1) 뒤에 the pasta is boiling(파스타가 끓고 있다)이 와요.  2) 파스타가 끓는 ‘그동안’ 재료를 써는 거예요. 두 일이 동시에 일어나요.",
 "‘~하는 동안’ 뜻의 접속사예요. w로 시작하는 5글자예요.","동시에 진행되는 두 일 → while");
C("SW","D",2,PQ+"빈칸 (2)에 알맞은 말은?",PB,"after","After the pasta is done, cook the other ingredients in a large pan using olive oil.","파스타가 다 익은 후에 올리브유를 사용해 큰 팬에 다른 재료들을 요리해라.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 before와 after를 비교하세요.",
 "1) 글의 순서를 따라가 보세요. 파스타를 끓이고(First) → 다 익으면 → 다른 재료를 요리해요.  2) ‘파스타가 다 된 뒤에’ 요리하는 순서예요.",
 "‘~한 후에’ 뜻의 접속사예요. a로 시작하는 5글자예요.","먼저 끝난 일 뒤에 하는 일 → after");
C("SW","D",3,PQ+"빈칸 (3)에 알맞은 말은?",PB,"until","Then stir the ingredients into the pasta until everything is mixed together.","그다음 모든 것이 함께 섞일 때까지 재료들을 파스타에 넣고 저어라.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 until(~할 때까지)을 보세요.",
 "1) stir(젓다)는 계속하는 동작이에요.  2) 어디까지 저을까요? everything is mixed together(모든 것이 섞이다) 상태가 될 ‘때까지’ 계속 저어요.",
 "‘~할 때까지’ 뜻의 접속사예요. u로 시작하는 5글자예요.","계속하는 동작 + 끝나는 때 → until");
C("SW","D",4,PQ+"빈칸 (4)에 알맞은 말은?",PB,"before","Before you serve it, add some shredded cheese on top.","그것을 내놓기 전에 위에 잘게 썬 치즈를 좀 올려라.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 before(~하기 전에)를 보세요.",
 "1) Lastly(마지막으로)에서 파스타를 접시에 담았어요.  2) 치즈를 올리는 일은 손님에게 내놓는(serve) 일의 ‘앞에’ 해야 해요.",
 "‘~하기 전에’ 뜻의 접속사예요. b로 시작하는 6글자예요.","나중 일(serve) 앞에 할 일 → before");
// ===== 내신 대비 실전문제 (pp.150-153) =====
C("NS","N",1,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>Joe was able to fall asleep ___ the TV was very loud.",["① if","② that","③ unless","④ although","⑤ because"],"④ although","Joe was able to fall asleep although the TV was very loud.","TV 소리가 매우 컸지만 Joe는 잠들 수 있었다.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표(though[although])를 보세요.",
 "1) ‘잠들 수 있었다’와 ‘TV 소리가 매우 컸다’를 비교해 보세요.  2) 시끄러우면 잠들기 어려운데 잠들었다니 앞뒤가 반대예요. 반대를 잇는 접속사를 찾으세요.",
 "‘비록 ~이지만’ 뜻의 보기예요. 보기 중 네 번째예요.","앞뒤가 반대 → although(비록 ~이지만)");
C("NS","N",2,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>The book is so long ___ I can’t read it in a day.",["① if","② as","③ that","④ since","⑤ before"],"③ that","The book is so long that I can’t read it in a day.","그 책은 너무 길어서 나는 하루 만에 읽을 수 없다.",
 "본책 p.142 ‘이유·결과를 나타내는 접속사’ 표에서 so + 형용사/부사 + that ...을 보세요.",
 "1) 빈칸 앞에 so long(너무 긴)이 있어요.  2) so ~ 다음에는 ‘그래서 …하다’라는 결과를 이끄는 짝이 따라와요.",
 "so long 뒤에 오는 짝이에요. t로 시작하는 보기 ③이에요.","so + 형용사 + that ... (너무 ~해서 …)");
C("NS","N",3,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>I haven’t seen James ___ I was a child.",["① as","② since","③ while","④ unless","⑤ although"],"② since","I haven’t seen James since I was a child.","나는 어렸을 때 이후로 James를 보지 못했다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 since(~한 이래로)를 보세요.",
 "1) haven’t seen(have not seen, 본 적이 없다)은 현재완료예요. 지금까지의 계속을 나타내요.  2) ‘어렸을 때부터 지금까지’ 보지 못했다는 뜻이에요.",
 "현재완료와 짝이 되는 ‘~한 이래로’ 뜻이에요. s로 시작하는 보기 ②예요.","현재완료 + since + 과거 시점");
C("NS","N",4,"[1-4] 빈칸에 들어갈 알맞은 말을 고르시오.<br>It is not surprising ___ he is late again.",["① or","② and","③ that","④ after","⑤ though"],"③ that","It is not surprising that he is late again.","그가 또 늦는 것은 놀랍지 않다.",
 "본책 p.146 ‘that절이 주어로 쓰인 경우 가주어 it을 쓴다’ 박스를 보세요.",
 "1) 문장 맨 앞의 It은 ‘그것’이 아니라 가짜 주어(가주어)예요.  2) 진짜 주어인 ‘그가 또 늦는다는 것’을 이끄는 접속사를 고르세요.",
 "가주어 it과 짝이 되는 진주어 접속사예요. t로 시작하는 보기 ③이에요.","It is ~ that + 주어 + 동사 (가주어-진주어)");
C("NS","N",5,"that이 들어갈 위치로 알맞은 곳은?<br>① They ② didn’t know ③ the concert ④ was ⑤ canceled.",["①","②","③","④","⑤"],"③","They didn’t know that the concert was canceled.","그들은 콘서트가 취소되었다는 것을 몰랐다.",
 "본책 p.146 ‘that’ POINT 1 표에서 목적어로 쓰이는 that절을 보세요.",
 "1) They didn’t know(그들은 몰랐다)에서 ‘무엇을’ 몰랐는지가 뒤에 나와요.  2) 그 내용은 the concert was canceled(콘서트가 취소되었다)예요. 이 덩어리 바로 앞에 that을 넣어요.",
 "know 바로 뒤, the concert 바로 앞 자리예요. 번호는 ③이에요.","know + that + 주어 + 동사 (~라는 것을)");
C("NS","N",6,"빈칸에 들어갈 말이 나머지 넷과 다른 것은?<br>① Call out the dog’s name, ___ it’ll come to you.<br>② Brush your teeth, ___ you will get cavities.<br>③ Hurry, ___ you won’t catch the bus.<br>④ Write down your ideas, ___ you will forget them.<br>⑤ Wear your helmet, ___ you could get hurt.",["①","②","③","④","⑤"],"①","Call out the dog’s name, and it’ll come to you.","개의 이름을 불러라, 그러면 개가 네게 올 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표를 보세요.",
 "1) 각 문장에서 뒤 내용이 ‘좋은 결과’인지 ‘나쁜 결과’인지 하나씩 확인하세요.  2) 좋은 결과는 and, 나쁜 결과는 or예요. 다른 하나를 찾으세요.",
 "①만 뒤에 ‘개가 온다’는 좋은 결과가 나와요. 나머지는 cavities(충치), won’t catch(놓친다), forget(잊는다), get hurt(다친다)처럼 나쁜 결과예요.","좋은 결과 and, 나쁜 결과 or");
W("NS","N",7,"[7-9] 빈칸에 공통으로 들어갈 접속사를 쓰시오.<br>• ___ they are waiting for you, you need to hurry up.<br>• Ryan has lived here ___ he was nine years old.","since","Since they are waiting for you, you need to hurry up. / Ryan has lived here since he was nine years old.","그들이 너를 기다리고 있으니 너는 서둘러야 한다. / Ryan은 아홉 살이었을 때부터 여기에 살아 왔다.",
 "본책 p.142 아래쪽 ‘하나의 접속사가 다양한 의미로 쓰인다’ 박스에서 since를 보세요.",
 "1) 첫 문장은 ‘기다리고 있기 때문에’ 서둘러야 하는 이유예요.  2) 둘째 문장은 has lived(have lived, 살아 왔다)가 현재완료라서 ‘~한 이래로’ 뜻이에요. 두 뜻을 모두 가진 접속사를 찾으세요.",
 "s로 시작하는 5글자 접속사예요. 이유(~이기 때문에)와 시간(~한 이래로)을 둘 다 나타내요.","since: ~이기 때문에 / ~한 이래로");
W("NS","N",8,"[7-9] 빈칸에 공통으로 들어갈 접속사를 쓰시오.<br>• I really like spicy food, ___ my father doesn’t like it at all.<br>• ___ I was doing my homework, Ted called me.","while","I really like spicy food, while my father doesn’t like it at all. / While I was doing my homework, Ted called me.","나는 매운 음식을 정말 좋아하는 반면 아버지는 전혀 좋아하지 않으신다. / 내가 숙제를 하고 있는 동안 Ted가 나에게 전화했다.",
 "본책 p.142 아래쪽 ‘하나의 접속사가 다양한 의미로 쓰인다’ 박스에서 while을 보세요.",
 "1) 첫 문장은 ‘나는 좋아하는데 아버지는 안 좋아하신다’처럼 서로 비교·반대되는 내용이에요.  2) 둘째 문장은 숙제를 하는 ‘동안’이에요. 두 뜻을 모두 가진 접속사를 찾으세요.",
 "w로 시작하는 5글자 접속사예요. 반면에 / ~하는 동안 두 가지 뜻이 있어요.","while: 반면에 / ~하는 동안");
W("NS","N",9,"[7-9] 빈칸에 공통으로 들어갈 접속사를 쓰시오.<br>• I’m not sure ___ he can swim.<br>• ___ I don’t pick up the phone, please leave me a message.","if","I’m not sure if he can swim. / If I don’t pick up the phone, please leave me a message.","나는 그가 수영할 수 있는지 확실하지 않다. / 내가 전화를 받지 않으면 메시지를 남겨 주세요.",
 "본책 p.146 if, whether 박스와 p.144 조건 접속사 표를 같이 보세요.",
 "1) 첫 문장 not sure(확실하지 않은) 뒤는 ‘~인지 아닌지’ 뜻이에요.  2) 둘째 문장은 ‘전화를 안 받으면’이라는 조건이에요. 두 뜻을 모두 가진 두 글자 접속사를 찾으세요.",
 "i로 시작하는 두 글자 접속사예요. 명사절(~인지)과 조건절(~한다면)에 모두 써요.","if: ~인지 아닌지 / ~한다면");
C("NS","N",10,"[10-11] 어법상 옳지 않은 것을 고르시오.<br>① I will take a nap until she calls me.<br>② Let’s play soccer if the rain stops.<br>③ You should leave before he wakes up.<br>④ After the class will end, I will go hiking.<br>⑤ Unless you do some research, you won’t be able to finish the report.",["①","②","③","④","⑤"],"④","After the class ends, I will go hiking.","수업이 끝난 후에 나는 하이킹을 갈 것이다.",
 "본책 p.142 ‘시간을 나타내는 접속사가 이끄는 부사절에서는 현재시제를 쓴다’ 박스를 보세요.",
 "1) 각 보기에서 until, if, before, after, unless 뒤의 절을 살펴보세요.  2) 이 접속사들은 모두 미래도 현재시제로 써요. 절 안에 will이 있는 문장을 찾으세요.",
 "접속사 뒤에 will end(끝날 것이다)가 있는 보기예요. 번호는 ④예요.","시간·조건 절 안에는 will 쓰지 않음");
C("NS","N",11,"[10-11] 어법상 옳지 않은 것을 고르시오.<br>① Bob wants to know if she likes him.<br>② If she is telling the truth is not clear.<br>③ I’m not sure whether it will snow tomorrow.<br>④ Whether you succeed or not is up to you.<br>⑤ The question is whether the project can be completed on time.",["①","②","③","④","⑤"],"②","Whether she is telling the truth is not clear.","그녀가 진실을 말하고 있는지는 분명하지 않다.",
 "본책 p.146 if, whether 박스(whether는 주어·목적어·보어, if는 목적어만)를 보세요.",
 "1) 보기마다 ‘~인지 아닌지’ 절이 문장에서 어떤 역할(주어/목적어/보어)을 하는지 찾아보세요.  2) if가 이끄는 명사절은 목적어로만 쓸 수 있어요. 주어 자리에 if가 있는 문장을 찾으세요.",
 "문장 맨 앞 주어 자리에 If가 쓰인 보기예요. 번호는 ②예요.","if 명사절은 목적어만 (주어는 whether)");
C("NS","N",12,"[12-13] 밑줄 친 부분의 쓰임이 나머지 넷과 다른 것을 고르시오.<br>① It was lucky <u>that</u> we arrived in time.<br>② <u>That</u> Florence lied to you is horrible.<br>③ It is interesting <u>that</u> our teachers are twins.<br>④ <u>That</u> you hate mushrooms is not surprising.<br>⑤ Victoria thinks <u>that</u> she can get a job soon.",["①","②","③","④","⑤"],"⑤","Victoria thinks that she can get a job soon.","Victoria는 곧 일자리를 구할 수 있다고 생각한다.",
 "본책 p.146 ‘that’ POINT 1 표(주어/목적어/보어)와 가주어 박스를 보세요.",
 "1) ①, ③은 가주어 It 뒤의 that절(진주어)이에요.  2) ②, ④는 문장 맨 앞에서 주어 역할을 해요. 이 네 문장은 모두 that절이 ‘주어’예요. 나머지 하나는 어떤 역할일까요?",
 "thinks(생각하다) 뒤에서 ‘~라는 것을’ 역할을 하는, 목적어 that절이에요. 번호는 ⑤예요.","주어(가주어 포함) that절 vs 목적어 that절");
C("NS","N",13,"[12-13] 밑줄 친 부분의 쓰임이 나머지 넷과 다른 것을 고르시오.<br>① <u>If</u> the phone rings, I will answer it.<br>② He wonders <u>if</u> she quit her job recently.<br>③ I’ll let them know <u>if</u> you want to stay here.<br>④ <u>If</u> we travel together, the trip will be more fun.<br>⑤ <u>If</u> you come at 3:00 p.m., I will start cooking at 2:00 p.m.",["①","②","③","④","⑤"],"②","He wonders if she quit her job recently.","그는 그녀가 최근에 일을 그만두었는지 궁금해한다.",
 "본책 p.146 if, whether 박스와 p.144 if(~한다면) 표를 같이 보세요.",
 "1) ①, ③, ④, ⑤의 if는 모두 ‘~한다면’이라는 조건이에요.  2) 나머지 하나는 ‘~인지 아닌지’ 뜻의 명사절이에요. wonders(궁금해하다, 원형 wonder) 같은 동사 뒤를 보세요.",
 "wonders(궁금해하다) 뒤의 목적어 역할을 하는 if절이에요. 번호는 ②예요.","if: ~한다면(조건) vs ~인지 아닌지(명사절)");
W("NS","N",14,"[14-16] 우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>이 전화기는 매우 작아서 내 주머니에 들어갈 수 있다. (so / small / it / fit / can / that)<br>This phone is ___ in my pocket.","so small that it can fit","This phone is so small that it can fit in my pocket.","이 전화기는 매우 작아서 내 주머니에 들어갈 수 있다.",
 "본책 p.142 ‘이유·결과를 나타내는 접속사’ 표에서 so + 형용사/부사 + that ...을 보세요.",
 "1) is 뒤에 ‘매우 작은’이 와요. so + 형용사 순서예요.  2) 그다음 that + 주어 + 동사(‘들어갈 수 있다’ 2단어) 순서로 이어요.",
 "첫 단어는 s로 시작하는 2글자, 세 번째 단어가 접속사예요. 주어진 6단어를 모두 써요.","so + 형용사 + that + 주어 + 동사");
W("NS","N",15,"[14-16] 우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>나는 Ralph가 내게 먼저 메시지를 보낼 때까지 그와 말하지 않을 것이다. (he / until / a message / sends / me)<br>I won’t talk to Ralph ___ first.","until he sends me a message","I won’t talk to Ralph until he sends me a message first.","나는 Ralph가 내게 먼저 메시지를 보낼 때까지 그와 말하지 않을 것이다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 until과 ‘현재시제’ 박스를 보세요.",
 "1) ‘~할 때까지’ 접속사로 시작하고 주어 + 동사가 이어져요.  2) 미래 일이지만 until 절이라 will은 쓰지 않아요. 주어 he에 맞게 sends(원형 send: 보내다)를 쓰고, ‘누구에게’ 다음에 ‘무엇을’ 순서예요.",
 "u로 시작하는 접속사로 시작하고, 맨 끝은 ‘무엇을’(2단어)이에요. 모두 6단어예요.","until + 주어 + 현재형 + 간접목적어 + 직접목적어");
W("NS","N",16,"[14-16] 우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>너는 운동하기 전에 항상 준비운동을 해야 한다. (up / work out / before / you / warm)<br>You should always ___.","warm up before you work out","You should always warm up before you work out.","너는 운동하기 전에 항상 준비운동을 해야 한다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 before(~하기 전에)를 보세요.",
 "1) should always(항상 ~해야 한다) 뒤에는 동사원형이 와요. ‘준비운동을 하다’는 주어진 말 중 2단어예요.  2) 그 뒤에 ‘~하기 전에’ 접속사 + 주어 + ‘운동하다’를 이어요.",
 "w로 시작하는 동사로 시작하고, 접속사는 세 번째 자리예요. 모두 6단어예요.","warm up + before + 주어 + work out");
W("NS","N",17,"그림을 보고 주어진 조건에 맞게 문장을 완성하시오.<br>(그림: 한 남자아이가 더워서 침대에서 잠을 못 이루며 \"It is so hot!\"이라고 말하고 있다.)<br>조건: 「so + 형용사/부사 + that ...」과 fall asleep을 이용할 것 / 빈칸에 총 7단어로 쓸 것<br>It is ___.","so hot that he can’t fall asleep","It is so hot that he can’t fall asleep.","너무 더워서 그는 잠들 수 없다.",
 "본책 p.142 ‘이유·결과를 나타내는 접속사’ 표에서 so + 형용사/부사 + that ...을 보세요.",
 "1) 그림 속 아이는 더워서 잠을 못 자요. 원인은 ‘너무 더움’, 결과는 ‘잠들 수 없음’이에요.  2) so + 형용사 + that + 주어 + can’t + 동사원형 순서로 써요.",
 "s로 시작하는 2글자로 시작하고, 접속사 뒤 주어는 그림 속 남자아이를 가리키는 말이에요. 7단어를 세어 보세요.","so + 형용사 + that + 주어 + can’t + 동사");
W("NS","N",18,"[18-19] 우리말과 일치하도록 보기에서 알맞은 접속사를 골라 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>[보기] when / though<br>나는 비록 뛰었지만, 지하철을 놓쳤다. (run)<br>___, I still missed the subway.","Though I ran","Though I ran, I still missed the subway.","나는 비록 뛰었지만, 지하철을 놓쳤다.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표의 though[although]를 보세요.",
 "1) 뛰었는데도 지하철을 놓쳤으니 앞뒤가 반대예요. 보기 중 반대를 잇는 접속사를 골라요.  2) ‘놓쳤다’(missed)가 과거이니 run(달리다)도 과거형으로 써요.",
 "대문자 T로 시작하는 접속사 + 주어 + r로 시작하는 3글자 동사(원형 run: 달리다, 과거형)예요.","though + 주어 + 과거형 (비록 ~했지만)");
W("NS","N",19,"[18-19] 우리말과 일치하도록 보기에서 알맞은 접속사를 골라 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>[보기] when / though<br>내가 방에 들어갔을 때, 나는 내 고양이가 침대 위에서 자고 있는 것을 봤다. (enter the room)<br>___, I saw my cat sleeping on the bed.","When I entered the room","When I entered the room, I saw my cat sleeping on the bed.","내가 방에 들어갔을 때, 나는 내 고양이가 침대 위에서 자고 있는 것을 봤다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 when(~할 때)을 보세요.",
 "1) ‘들어갔을 때’이니 때를 나타내는 접속사를 고르세요.  2) saw(봤다, 원형 see: 보다)가 과거라서 enter(들어가다)도 과거형으로 써요. 방은 the room이에요.",
 "대문자 W로 시작하는 접속사 + 주어 + -ed가 붙은 과거형 동사 + 2단어, 모두 5단어예요.","when + 주어 + 과거형 (~했을 때)");
M("NS","N",20,"어법상 옳은 것을 모두 고르시오.<br>① The truth is that we don’t want to wake up early.<br>② Clean up your room before I will come back.<br>③ That Martin ate a tomato surprised everyone.<br>④ I can hang out with my friends after I finish my homework.<br>⑤ Unless you turn off the lights in the room, you will be able to fall asleep quickly.",["①","②","③","④","⑤"],["①","③","④"],"① The truth is that we don’t want to wake up early. / ③ That Martin ate a tomato surprised everyone. / ④ I can hang out with my friends after I finish my homework.","① 사실은 우리가 일찍 일어나고 싶지 않다는 것이다. / ③ Martin이 토마토를 먹었다는 것은 모두를 놀라게 했다. / ④ 나는 숙제를 끝낸 후에 친구들과 놀 수 있다.",
 "본책 p.142 시간 접속사 ‘현재시제’ 박스, p.144 unless 박스, p.146 that절 박스를 보세요.",
 "1) ② before 절 안에 will이 있는지 확인해요. 시간 접속사 절에서는 will을 쓰지 않아요.  2) ⑤ Unless(~하지 않으면)로 풀면 ‘불을 끄지 않으면 빨리 잠들 수 있다’가 되어 뜻이 이상해요.",
 "②와 ⑤가 틀렸어요. 나머지 ①, ③, ④가 맞아요. ①은 보어 that절, ③은 주어 that절, ④는 after 절의 현재시제예요.","시간 절 will X, 뜻이 맞는 접속사 선택");
M("NS","N",21,"빈칸에 들어갈 말로 알맞은 것을 모두 고르시오.<br>___ Olivia was waiting for him at the subway station, Frank was riding his bike to get there.",["① When","② Unless","③ If","④ While","⑤ As"],["① When","④ While","⑤ As"],"When[While/As] Olivia was waiting for him at the subway station, Frank was riding his bike to get there.","Olivia가 지하철역에서 그를 기다리고 있을 때, Frank는 그곳에 가려고 자전거를 타고 있었다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표를 펴서 when, while, as의 뜻을 보세요.",
 "1) 두 절 모두 was waiting(기다리고 있었다), was riding(타고 있었다)처럼 진행형이라 같은 시간에 일어나요.  2) ‘~할 때, ~하는 동안’ 뜻의 접속사가 모두 가능해요. 조건 접속사는 뜻이 안 맞아요.",
 "시간 접속사 3개가 정답이에요. 조건을 나타내는 ②, ③은 제외해요.","같은 때 일어나는 일 → when/while/as");
C("NS","N",22,"밑줄 친 부분과 의미가 같은 것은?<br><u>As</u> I was taking a shower, I came up with a brilliant idea.<br>① <u>As</u> he was taking a walk, he saw Gloria.<br>② <u>As</u> she was late to class, Cindy got in trouble.<br>③ <u>As</u> I’m not wearing my glasses, I can’t see that far.<br>④ <u>As</u> Sam was too short, he couldn’t ride the attraction.<br>⑤ <u>As</u> I didn’t have enough money, I couldn’t buy the ice cream.",["①","②","③","④","⑤"],"①","As he was taking a walk, he saw Gloria.","그는 산책을 하고 있을 때 Gloria를 보았다.",
 "본책 p.142 아래쪽 ‘as’ 박스(~할 때 / ~이기 때문에 두 뜻)를 보세요.",
 "1) 문제 문장은 ‘샤워를 하고 있을 때 좋은 생각이 떠올랐다’라는 시간의 as예요.  2) 보기 ①~⑤의 as 뒤가 시간인지 이유인지 하나씩 나눠 보세요. 이유인 것은 ‘~해서’로 풀려요.",
 "②, ③, ④, ⑤는 이유(~이기 때문에)예요. 시간으로 쓰인 as가 정답이고, ①번이에요.","as: ~할 때(시간) vs ~이기 때문에(이유)");
C("NS","N",23,"밑줄 친 부분이 어법상 옳지 않은 것은?<br>① <u>Although it was raining</u>, John decided to go for a run. ② <u>He knew that</u> running would make him feel better. He wondered ③ <u>if his friends would still come</u> to the park ④ <u>despite the weather</u>. ⑤ <u>If they will come</u>, John will be very happy.",["①","②","③","④","⑤"],"⑤","If they come, John will be very happy.","그들이 온다면 John은 매우 행복할 것이다.",
 "본책 p.144 ‘조건을 나타내는 접속사가 이끄는 부사절에서는 현재시제를 쓴다’ 박스를 보세요.",
 "1) 각 밑줄의 접속사가 맞는지 보세요. Although, that, if(명사절), despite(전치사 + 명사구)는 쓰임이 맞아요.  2) 마지막 If는 ‘~한다면’이라는 조건이에요. 조건절 안의 시제를 점검하세요.",
 "⑤ 번이에요. If 절에서 will을 빼고 come만 써야 해요.","if 조건절은 will 쓰지 않음");
C("NS","N",24,"밑줄 친 부분의 쓰임이 같은 것끼리 바르게 짝지어진 것은?<br>ⓐ <u>That</u> the company is moving is bad news for the employees.<br>ⓑ It is touching <u>that</u> she sent me a gift.<br>ⓒ The truth is <u>that</u> Kathy and I have been dating for ten years.<br>ⓓ We hope <u>that</u> the weather will be nice during our trip.",["① ⓐ, ⓑ","② ⓑ, ⓒ","③ ⓐ, ⓑ, ⓒ","④ ⓐ, ⓒ, ⓓ","⑤ ⓑ, ⓒ, ⓓ"],"① ⓐ, ⓑ","ⓐ That the company is moving is bad news for the employees. / ⓑ It is touching that she sent me a gift. (둘 다 주어로 쓰인 that절)","ⓐ 그 회사가 이전한다는 것은 직원들에게 나쁜 소식이다. / ⓑ 그녀가 내게 선물을 보냈다는 것은 감동적이다. (둘 다 주어로 쓰인 that절)",
 "본책 p.146 ‘that’ POINT 1 표(주어/목적어/보어)와 가주어 박스를 보세요.",
 "1) ⓐ는 문장 맨 앞이라 주어, ⓑ는 가주어 It 뒤라 진주어(= 주어)예요.  2) ⓒ는 is 뒤라 보어, ⓓ는 hope(바라다) 뒤라 목적어예요. 같은 쓰임끼리 짝지으세요.",
 "주어로 쓰인 두 개(ⓐ, ⓑ)가 같아요. 번호는 ①이에요.","주어(가주어 포함) / 보어 / 목적어 구별");
C("NS","N",25,"어법상 옳지 않은 것의 개수는?<br>• Let’s knit some mittens before winter will come.<br>• Because heavy traffic, I was late for work.<br>• Unless you eat more vegetables, you will not be able to stay healthy.<br>• That I have to wait for the bus for a long time is annoying.<br>• I like to listen to music when I ride the bus.",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],"② 2개","Let’s knit some mittens before winter comes. / Because of heavy traffic, I was late for work.","겨울이 오기 전에 벙어리장갑을 짜자. / 교통 체증 때문에 나는 출근에 늦었다.",
 "본책 p.142 시간 접속사 ‘현재시제’ 박스와 ‘because of 뒤에는 명사(구)’ 박스를 보세요.",
 "1) 첫째 줄: before(~하기 전에) 절 안에 will이 있어요.  2) 둘째 줄: heavy traffic(교통 체증)은 명사구인데 접속사 Because가 앞에 있어요. 나머지 세 문장은 접속사 뒤 형태가 맞는지 확인하세요.",
 "틀린 것은 첫째 줄과 둘째 줄 두 개예요. 셋째~다섯째는 맞아요. 번호는 ②예요.","시간 절 will X, 명사구 앞 because of");
C("NS","N",26,"빈칸에 들어갈 말이 순서대로 짝지어진 것은?<br>• ___ the restaurant was crowded, we were able to find a table.<br>• ___ our busy schedule, we were able to eat dinner together.",["① Although — Though","② Although — While","③ Though — Despite","④ Despite — In spite of","⑤ In spite of — Although"],"③ Though — Despite","Though the restaurant was crowded, we were able to find a table. / Despite our busy schedule, we were able to eat dinner together.","식당이 붐볐지만 우리는 자리를 찾을 수 있었다. / 바쁜 일정에도 불구하고 우리는 함께 저녁을 먹을 수 있었다.",
 "본책 p.144 ‘despite와 in spite of는 전치사라서 뒤에 명사(구)가 온다’ 박스를 보세요.",
 "1) 첫 빈칸 뒤: the restaurant was crowded(식당이 붐볐다)는 주어+동사 → 접속사가 와요.  2) 둘째 빈칸 뒤: our busy schedule(우리의 바쁜 일정)은 명사구 → 전치사가 와요.",
 "첫째는 ‘비록 ~이지만’ 접속사, 둘째는 ‘~에도 불구하고’ 전치사예요. 번호는 ③이에요.","절 앞 though[although], 명사(구) 앞 despite");
W("NS","N",27,"어법상 틀린 부분을 찾아 바르게 고치시오.<br>A Mom, can you buy me a new laptop?<br>B Why do you need a new laptop?<br>A Although I really like my old laptop, it is too slow.<br>B Hmm… do better than last time on your upcoming test, or I’ll buy you a new laptop.<br>A Really? Okay!","or → and","Hmm… do better than last time on your upcoming test, and I’ll buy you a new laptop.","음… 이번 시험을 저번보다 더 잘 보렴, 그러면 새 노트북을 사 줄게.",
 "본책 p.144 ‘명령문 + and/or ~’ 표를 보세요.",
 "1) 엄마의 말은 ‘시험을 더 잘 봐라, ___ 새 노트북을 사 줄게’예요.  2) 시험을 잘 보는 것은 좋은 일이고 뒤에 좋은 결과(노트북)가 이어져요. 마지막에 A가 ‘Really? Okay!’ 하고 기뻐하는 것도 단서예요.",
 "B의 두 번째 말에 있는 접속사가 틀렸어요. 좋은 결과를 잇는 a로 시작하는 3글자로 바꿔요.","좋은 결과 → 명령문, and ~");
M("NS","N",28,"[28-29] 우리말을 영어로 바르게 옮긴 것을 모두 고르시오.<br>만약 내가 내일 시간이 있다면 나는 영화를 볼 것이다.",["① If I have time tomorrow, I’ll watch a movie.","② If I watch a movie, I’ll have time tomorrow.","③ I’ll watch a movie if I have time tomorrow.","④ I’ll have time tomorrow if I watch a movie.","⑤ If I’ll have time tomorrow, I’ll watch a movie."],["① If I have time tomorrow, I’ll watch a movie.","③ I’ll watch a movie if I have time tomorrow."],"If I have time tomorrow, I’ll watch a movie. / I’ll watch a movie if I have time tomorrow.","내일 시간이 있으면 나는 영화를 볼 것이다.",
 "본책 p.144 ‘조건을 나타내는 접속사가 이끄는 부사절에서는 현재시제를 쓴다’ 박스를 보세요.",
 "1) 조건은 ‘시간이 있다’이고 결과는 ‘영화를 본다’예요. 조건과 결과가 뒤바뀐 보기가 있는지 보세요.  2) if 절 안에서는 내일의 일이어도 will을 쓰지 않아요.",
 "②, ④는 조건과 결과가 뒤집혔고, ⑤는 if 절에 will이 있어요. 나머지 두 개가 정답이에요.","if 절에는 시간 있음(조건), will은 주절에만");
M("NS","N",29,"[28-29] 우리말을 영어로 바르게 옮긴 것을 모두 고르시오.<br>지금 너의 스마트폰을 충전하지 않으면 곧 배터리가 닳을 것이다.",["① If you don’t charge your smartphone now, your battery will run out soon.","② Unless you charge your smartphone now, your battery will run out soon.","③ Charge your smartphone now, and your battery will run out soon.","④ If you charge your smartphone now, your battery will run out soon.","⑤ Charge your smartphone now, or your battery will run out soon."],["① If you don’t charge your smartphone now, your battery will run out soon.","② Unless you charge your smartphone now, your battery will run out soon.","⑤ Charge your smartphone now, or your battery will run out soon."],"If you don’t charge[Unless you charge] your smartphone now, your battery will run out soon. / Charge your smartphone now, or your battery will run out soon.","지금 스마트폰을 충전하지 않으면 곧 배터리가 닳을 것이다.",
 "본책 p.144 unless 박스와 ‘명령문 + and/or ~’ 표를 보세요.",
 "1) ‘충전하지 않으면’ = If ~ not = Unless ~예요.  2) 명령문으로는 ‘충전해라, 그러지 않으면(or) 배터리가 닳을 것이다’로 쓸 수 있어요.",
 "‘~하지 않으면’의 뜻이 나오는 보기 3개가 정답이에요. ③(and)과 ④(if + 긍정)는 뜻이 반대예요.","~하지 않으면 = if not = unless = 명령문, or");
C("NS","N",30,"다음은 Eva와 Nick의 일정표이다. 표의 내용과 일치하지 않는 것을 고르시오.<br>(표) 7:00 p.m. — Eva: do her homework / Nick: exercise<br>9:00 p.m. — Eva: brush her teeth / Nick: take a shower<br>① Eva will brush her teeth after she does her homework.<br>② While Eva is doing her homework, Nick will exercise.<br>③ Nick will exercise before he takes a shower.<br>④ As Eva does her homework, Nick will take a shower.<br>⑤ When Nick takes a shower, Eva will brush her teeth.",["①","②","③","④","⑤"],"④","As Eva does her homework, Nick will exercise.","Eva가 숙제를 하고 있을 때 Nick은 운동할 것이다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표(while, as, when, before, after)를 보세요.",
 "1) 표를 보면 7시에는 Eva가 숙제, Nick이 운동이고 9시에는 Eva가 양치, Nick이 샤워예요.  2) 보기마다 접속사 앞뒤 일이 표의 같은 시각인지, 순서가 맞는지 확인하세요.",
 "같은 시각(7시)의 Nick 일정과 맞지 않는 보기예요. 샤워는 9시 일정이에요. 번호는 ④예요.","같은 시각 = while/as/when, 순서 = before/after");
// ===== 문법정리노트 (p.154) =====
W("GN","G",1,"I will wait ___ they are ready. (나는 그들이 준비될 때까지 기다릴 것이다.)","until","I will wait until they are ready.","나는 그들이 준비될 때까지 기다릴 것이다.",
 "본책 p.142 ‘시간을 나타내는 접속사’ 표에서 ‘~할 때까지’ 줄을 보세요.",
 "1) 우리말 ‘~할 때까지’에 해당하는 시간 접속사를 찾아요.  2) wait(기다리다)처럼 계속하는 동작이 끝나는 때를 말해 줘요.",
 "u로 시작하는 5글자 접속사예요.","I will wait until ~ : until = ~할 때까지");
W("GN","G",2,"Joanne was sad ___ her dog was sick. (Joanne은 그녀의 강아지가 아파서 슬펐다.)","because","Joanne was sad because her dog was sick.","Joanne은 그녀의 강아지가 아파서 슬펐다.",
 "본책 p.142 ‘이유·결과를 나타내는 접속사’ 표에서 ‘~이기 때문에’ 줄을 보세요.",
 "1) 슬펐던 일과 강아지가 아팠던 일 중 어느 쪽이 까닭일까요?  2) 이유를 나타내는 접속사 가운데 본책 표 맨 앞에 나온 대표 접속사를 써요.",
 "b로 시작하는 7글자 접속사예요.","sad because ~ : because = ~이기 때문에 (이유)");
W("GN","G",3,"The room was ___ ___ ___ I couldn’t see anything. (그 방은 너무 어두워서 나는 아무것도 볼 수 없었다.)","so dark that","The room was so dark that I couldn’t see anything.","그 방은 너무 어두워서 나는 아무것도 볼 수 없었다.",
 "본책 p.142 ‘이유·결과를 나타내는 접속사’ 표에서 so + 형용사/부사 + that ...을 보세요.",
 "1) 우리말이 ‘너무 어두워서 ~할 수 없었다’예요.  2) 이 구조는 so + 형용사(dark, 어두운) + that + 주어 + 동사로 써요.",
 "첫 칸 s로 시작하는 2글자, 둘째 칸 ‘어두운’ 형용사(d로 시작하는 4글자), 셋째 칸 t로 시작하는 4글자예요.","so + 형용사 + that ... = 너무 ~해서 ...");
W("GN","G",4,"___ you want to read this book, you can borrow mine. (네가 이 책을 읽고 싶다면 내 책을 빌려도 된다.)","If","If you want to read this book, you can borrow mine.","네가 이 책을 읽고 싶다면 내 책을 빌려도 된다.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표에서 ‘~한다면, ~라면’ 줄을 보세요.",
 "1) 우리말 ‘읽고 싶다면’은 조건이에요.  2) 조건 접속사 중 두 글자짜리 짧은 말을 쓰고, 문장 맨 앞이라 대문자로 써요.",
 "I로 시작하는 두 글자 접속사예요.","If you want ~ : if = ~한다면, ~라면 (조건)");
W("GN","G",5,"___ Gerald was full, he ate some more ice cream. (Gerald는 배가 불렀지만, 아이스크림을 조금 더 먹었다.)","Though","Though[Although] Gerald was full, he ate some more ice cream.","Gerald는 배가 불렀지만, 아이스크림을 조금 더 먹었다.",
 "본책 p.144 ‘조건·양보를 나타내는 접속사’ 표에서 ‘비록 ~이지만’ 줄을 보세요.",
 "1) 배가 불렀는데 아이스크림을 더 먹었다니 앞뒤가 반대예요.  2) 반대되는 내용을 잇는 접속사를 쓰세요. (두 가지 단어 모두 가능해요.)",
 "T로 시작하는 6글자 접속사(또는 A로 시작하는 8글자)예요.","though[although] = 비록 ~이지만");
W("GN","G",6,"Keep working hard, ___ you will achieve your dream. (계속 열심히 해라, 그러면 너는 꿈을 이룰 것이다.)","and","Keep working hard, and you will achieve your dream.","계속 열심히 해라, 그러면 너는 꿈을 이룰 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표에서 ‘…해라, 그러면 ~할 것이다’ 줄을 보세요.",
 "1) 앞은 ‘계속 열심히 해라’라는 명령문이에요.  2) 뒤는 ‘꿈을 이룰 것이다’라는 좋은 결과예요. 좋은 결과가 이어질 때 쓰는 접속사를 고르세요.",
 "a로 시작하는 3글자 접속사예요.","명령문, and ~ = …해라, 그러면 ~");
W("GN","G",7,"Go to bed early, ___ you will be tired tomorrow. (일찍 자라, 그러지 않으면 너는 내일 피곤할 것이다.)","or","Go to bed early, or you will be tired tomorrow.","일찍 자라, 그러지 않으면 너는 내일 피곤할 것이다.",
 "본책 p.144 ‘명령문 + and/or ~’ 표에서 ‘…해라, 그러지 않으면 ~할 것이다’ 줄을 보세요.",
 "1) 앞은 ‘일찍 자라’라는 명령문이에요.  2) 뒤 ‘내일 피곤할 것이다’는 나쁜 결과예요. 나쁜 결과가 이어질 때 쓰는 접속사를 고르세요.",
 "o로 시작하는 두 글자 접속사예요.","명령문, or ~ = …해라, 그러지 않으면 ~");
W("GN","G",8,"___ ___ ___ you feel better soon. (나는 네가 빨리 낫길 바라.)","I hope that","I hope that you feel better soon.","나는 네가 빨리 낫길 바라.",
 "본책 p.146 ‘that’ POINT 1 표에서 목적어 줄(~라는 것을)을 보세요.",
 "1) 빈칸 뒤가 you feel better soon(네가 빨리 낫다)이라는 주어+동사 덩어리예요.  2) ‘나는 ~을 바란다’ 뜻의 동사 hope(바라다)와 그 내용을 이끄는 접속사가 필요해요.",
 "주어(대문자 한 글자) + h로 시작하는 4글자 동사 + t로 시작하는 4글자 접속사, 세 칸이에요.","hope + that + 주어 + 동사 (~라는 것을 바란다)");
W("GN","G",9,"I’ll check whether[___] the door is locked. (내가 그 문이 잠겼는지 확인할게.)","if","I’ll check whether[if] the door is locked.","내가 그 문이 잠겼는지 확인할게.",
 "본책 p.146 ‘if, whether’ POINT 2 표의 목적어 줄을 보세요.",
 "1) whether와 바꿔 쓸 수 있는 말이 [ ] 안에 들어가요.  2) 목적어 자리에서는 ‘~인지 아닌지’ 뜻의 두 접속사 모두 쓸 수 있어요.",
 "i로 시작하는 두 글자 접속사예요.","목적어: whether = if (~인지 아닌지)");

W(1,"A",3,"관계대명사가 들어갈 위치를 고르고 who 또는 which 중 알맞은 말을 쓰시오.<br>The doll ⓐ is on your bed ⓑ is ⓒ pretty.","ⓐ, which","The doll which is on your bed is pretty.","네 침대 위에 있는 인형은 예쁘다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스를 펴서 위치를 먼저 확인하세요.",
 "1) 문장의 큰 동사는 두 번째 is(예쁘다)예요.  2) is on your bed(네 침대 위에 있다)는 doll을 설명하는 말이라서 doll 바로 뒤에 연결 단어가 와요.",
 "위치는 The doll 바로 뒤 칸이에요. 단어는 사물에 쓰는 w로 시작하는 다섯 글자예요.","주어 꾸밈절은 주어 바로 뒤");
W(1,"A",4,"관계대명사가 들어갈 위치를 고르고 who 또는 which 중 알맞은 말을 쓰시오.<br>Ed Sheeran ⓐ is the singer ⓑ I like ⓒ the most.","ⓑ, who","Ed Sheeran is the singer who I like the most.","Ed Sheeran은 내가 가장 좋아하는 가수이다.",
 "본책 p.158 2번 ‘목적격 관계대명사’ 박스를 펴세요.",
 "1) the singer(가수)를 I like the most(내가 가장 좋아한다)가 꾸며 줘요.  2) singer는 사람이라서 어떤 단어를 쓸지 정해요.",
 "singer 바로 뒤, I like 앞의 칸이에요. 사람에게 쓰는 w로 시작하는 세 글자예요.","사람 + who(m) + 주어 + 동사");
W(1,"B",1,"보기에서 알맞은 관계대명사를 골라 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>Did you go to the park ___ Gaudi designed?","which","Did you go to the park which Gaudi designed?","너는 가우디가 설계한 공원에 가 봤니?",
 "본책 p.158 2번 ‘목적격 관계대명사’ 박스를 펴세요.",
 "1) the park(공원)는 사물이에요.  2) Gaudi designed(가우디가 설계했다) 뒤에 목적어가 없어요. 보기 중 사물에 쓰는 것을 골라요.",
 "w로 시작하는 다섯 글자예요. 사람/소유격 말은 아니에요.","사물 + which + 주어 + 동사",["whose","who","whom","which"]);
W(1,"B",2,"보기에서 알맞은 관계대명사를 골라 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>Anyone ___ likes hip hop should listen to this song.","who","Anyone who likes hip hop should listen to this song.","힙합을 좋아하는 사람은 누구든지 이 노래를 들어 봐야 한다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스를 펴세요.",
 "1) Anyone(누구든지)은 사람이에요.  2) likes(원형 like: 좋아하다) 바로 앞이라서 주어 자리예요.",
 "w로 시작하는 세 글자예요.","Anyone(사람) + who + 동사",["whose","who","whom","which"]);
W(1,"B",3,"보기에서 알맞은 관계대명사를 골라 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>Jake is a university student ___ major is economics.","whose","Jake is a university student whose major is economics.","Jake는 전공이 경제학인 대학생이다.",
 "본책 p.158 3번 ‘소유격 관계대명사’ 박스를 펴세요.",
 "1) 빈칸 바로 뒤에 major(전공)라는 명사가 와요.  2) ‘그 학생의 전공’처럼 ‘~의’ 뜻이 필요해요.",
 "w로 시작하는 다섯 글자예요. 뒤에 명사가 오는 말이에요.","관계대명사 + 명사 → whose",["whose","who","whom","which"]);
W(1,"B",4,"보기에서 알맞은 관계대명사를 골라 문장을 완성하시오. (단, 한 번씩만 쓸 것)<br>Van Gogh is the artist ___ I want to paint like.","whom","Van Gogh is the artist whom I want to paint like.","반 고흐는 내가 그처럼 그리고 싶은 화가이다.",
 "본책 p.158 2번 ‘목적격 관계대명사’ 박스를 펴세요.",
 "1) the artist(화가)는 사람이에요.  2) I want to paint like(나는 ~처럼 그리고 싶다) 뒤에 목적어가 빠졌어요.",
 "w로 시작하고 m으로 끝나는 네 글자예요.","사람 목적격 → who(m)",["whose","who","whom","which"]);
W(1,"C",1,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>나는 꿈이 의사가 되는 것인 한 학생을 만났다. (whose / is / dream / student / to / become)<br>I met a ___ a doctor.","student whose dream is to become","I met a student whose dream is to become a doctor.","나는 꿈이 의사가 되는 것인 한 학생을 만났다.",
 "본책 p.158 3번 ‘소유격 관계대명사’ 박스를 펴세요. ‘~의’ 뜻이 있는 관계대명사 뒤에 무엇이 오는지 봐요.",
 "1) 빈칸 앞의 a 뒤에는 꾸밈을 받는 명사(선행사)가 먼저 와요.  2) ‘그 학생의 꿈’처럼 ‘~의’ 뜻이 필요하니 소유격 관계대명사를 써요.  3) ‘꿈이 ~되는 것이다’는 be동사 + to부정사(~하는 것)로 나타내요.",
 "student로 시작해요. whose 바로 뒤에는 명사 한 단어가 오고, become이 맨 끝이에요.","whose + 명사 + is to부정사(~하는 것)",["whose","is","dream","student","to","become"]);
W(1,"C",2,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>네가 들려준 이야기는 믿기 어렵다. (told / you / which / is / me)<br>The story ___ hard to believe.","which you told me is","The story which you told me is hard to believe.","네가 들려준 이야기는 믿기 어렵다.",
 "본책 p.158 2번 ‘목적격 관계대명사’ 박스를 펴세요.",
 "1) The story(이야기) 바로 뒤에 관계대명사를 놓아요.  2) 그다음 관계대명사절은 ‘주어 + 동사’ 순서예요.  3) 이야기가 주어이므로 큰 동사 is는 맨 뒤예요.",
 "which로 시작해서 is로 끝나요. told(원형 tell: 말해 주다) 바로 뒤에는 ‘나에게’가 와요.","관계대명사절 뒤에 큰 동사 is",["told","you","which","is","me"]);
W(1,"C",3,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>나는 무엇이든지 고칠 수 있는 삼촌이 있다. (who / fix / can / an / anything / uncle)<br>I have ___.","an uncle who can fix anything","I have an uncle who can fix anything.","나는 무엇이든지 고칠 수 있는 삼촌이 있다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스를 펴세요.",
 "1) have(가지다) 뒤에는 꾸밈을 받는 명사(선행사)가 먼저 와요.  2) 그 명사가 사람이니 사람에 쓰는 주격 관계대명사를 붙여요.  3) 관계대명사 뒤는 ‘조동사 + 동사원형 + 목적어’ 순서예요.",
 "an으로 시작해서 anything으로 끝나요. 관계대명사는 세 번째 자리예요.","사람 + who + can + 동사원형",["who","fix","can","an","anything","uncle"]);
W(1,"D",1,"( ) 안의 관계대명사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>I found the key. The key was missing. (which)","I found the key which was missing.","I found the key which was missing.","나는 없어졌던 열쇠를 찾았다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스에서 My brother goes to a school. + It is ... 예시를 보세요.",
 "1) 두 번째 문장의 주어 The key는 첫 문장의 the key와 같은 물건이에요.  2) 같은 말은 which로 바꿔서 the key 바로 뒤에 붙여요.",
 "두 번째 문장의 The key를 which로 바꿔 첫 문장 끝에 붙여요. 모두 7단어예요.","같은 명사(주어) → which 로 바꿔 연결");
W(1,"D",2,"( ) 안의 관계대명사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>That’s the song. I heard the song at the coffee shop. (which)","That’s the song which I heard at the coffee shop.","That’s the song which I heard at the coffee shop.","저것이 내가 그 커피숍에서 들은 노래이다.",
 "본책 p.158 2번 ‘목적격 관계대명사’ 박스를 펴세요. 목적어 중복 주의 문장도 꼭 보세요.",
 "1) 두 번째 문장에서 목적어 the song이 which로 바뀌어 앞으로 가요.  2) 원래 있던 the song은 지워야 해요(중복 금지).",
 "That’s the song 뒤에 which를 붙이고, heard(원형 hear: 듣다) 바로 뒤에는 목적어를 다시 쓰지 않아요.","목적어는 which로 바꾸고 원래 자리는 지움");
W(1,"D",3,"( ) 안의 관계대명사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>I know the girl. You met her yesterday. (who)","I know the girl who you met yesterday.","I know the girl who you met yesterday.","나는 네가 어제 만난 소녀를 안다.",
 "본책 p.158 2번 ‘목적격 관계대명사’ 박스를 펴세요.",
 "1) 두 번째 문장의 her(그녀를)는 목적어이고 the girl과 같은 사람이에요.  2) her를 who로 바꿔 the girl 바로 뒤로 보내요.",
 "the girl 바로 뒤에 who를 두고, met(원형 meet: 만나다) 뒤의 her는 빼요. 모두 8단어예요.","목적어 her → who로 바꿔 앞으로");
W(1,"D",4,"( ) 안의 관계대명사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>I have a friend. His parents live in Hong Kong. (whose)","I have a friend whose parents live in Hong Kong.","I have a friend whose parents live in Hong Kong.","나는 부모님이 홍콩에 사시는 친구가 있다.",
 "본책 p.158 3번 ‘소유격 관계대명사’ 박스를 펴세요.",
 "1) 두 번째 문장의 His는 ‘그의’라는 소유격이에요.  2) His 자리를 whose로 바꾸고, 뒤의 명사 parents(부모님)와 함께 a friend 뒤로 보내요.",
 "His 자리에 whose가 들어가고 그 바로 뒤에 명사가 와요. 모두 10단어예요.","His + 명사 → whose + 명사");

C(2,"Q",1,"빈칸에 들어갈 말로 알맞은 것은?<br>The only thing ___ I drink in the morning is soy milk.",["that","what"],"that","The only thing that I drink in the morning is soy milk.","내가 아침에 마시는 유일한 것은 두유이다.",
 "본책 p.160 POINT 1 표에서 선행사에 특별한 수식어(the only 등)가 붙는 경우를 찾아 보세요.",
 "1) 빈칸 앞에 the only thing(유일한 것)이라는 선행사가 있어요.  2) what은 선행사를 포함하고 있어서 앞에 선행사를 쓰지 않아요.",
 "선행사가 the only로 꾸며질 때 쓰는 단어예요. 첫 번째 보기예요.","the only + 명사 → that (what은 선행사 없이)");
C(2,"A",1,"( ) 안에서 알맞은 말을 고르시오.<br>Did you get (what / that) you need for the party?",["what","that"],"what","Did you get what you need for the party?","너는 파티에 필요한 것을 구했니?",
 "본책 p.160 ‘관계대명사 what’ 박스를 펴세요.",
 "1) get(구하다)의 목적어가 ‘네가 필요한 것’이에요.  2) 빈칸 앞에 선행사가 있나요? 없다면 선행사를 포함한 말이 필요해요.",
 "‘~한 것’ 뜻이고, 앞에 꾸밀 명사가 없어요. 첫 번째 보기예요.","선행사 없음 + ‘~한 것’ → what");
C(2,"A",2,"( ) 안에서 알맞은 말을 고르시오.<br>We sat in a park (what / that) was full of people.",["what","that"],"that","We sat in a park that was full of people.","우리는 사람들로 가득 찬 공원에 앉았다.",
 "본책 p.160 ‘관계대명사 that’과 ‘관계대명사 what’ 박스를 비교해 보세요.",
 "1) 빈칸 앞에 a park(공원)라는 선행사가 있어요.  2) 선행사가 있으면 what은 쓸 수 없어요. was(원형 be: 이다) 앞이 주어 자리예요.",
 "선행사를 꾸미는 쪽이에요. 두 번째 보기예요.","선행사 있음 → that (what은 안 됨)");
C(2,"A",3,"( ) 안에서 알맞은 말을 고르시오.<br>Making artwork is (what / that) artists do.",["what","that"],"what","Making artwork is what artists do.","예술 작품을 만드는 것은 예술가들이 하는 일이다.",
 "본책 p.160 ‘관계대명사 what’ 박스에서 ‘보어’로 쓰이는 문장을 보세요.",
 "1) is 뒤에 ‘예술가들이 하는 것’이라는 보어가 와요.  2) 빈칸 앞에는 꾸밀 선행사가 없어요.",
 "‘~한 것’ 뜻의 w로 시작하는 네 글자예요. 첫 번째 보기예요.","is + what + 주어 + 동사 → ~하는 것(보어)");
C(2,"A",4,"( ) 안에서 알맞은 말을 고르시오.<br>I found a store (what / that) sells old movie posters.",["what","that"],"that","I found a store that sells old movie posters.","나는 오래된 영화 포스터를 파는 가게를 발견했다.",
 "본책 p.160 POINT 1과 POINT 2를 비교해 보세요. 앞에 선행사가 있는지가 기준이에요.",
 "1) 빈칸 앞에 a store(가게)가 있어요.  2) sells(원형 sell: 팔다) 앞이라서 주어 역할이 필요해요.",
 "선행사를 꾸미는 t로 시작하는 네 글자예요.","선행사 a store + that + 동사");
C(2,"A",5,"( ) 안에서 알맞은 말을 고르시오.<br>(What / That) you need to do is spend time with your family.",["What","That"],"What","What you need to do is spend time with your family.","네가 해야 할 일은 가족과 시간을 보내는 것이다.",
 "본책 p.160 POINT 2에서 <주어>라고 표시된 예문을 보세요.",
 "1) 문장 맨 앞이라 꾸밀 선행사가 없어요.  2) ‘네가 해야 할 것’이 문장의 주어예요.",
 "‘~하는 것’ 뜻이고 W로 시작해요. 첫 번째 보기예요.","What절 = 주어 (~하는 것)");
C(2,"B",1,"밑줄 친 that의 쓰임을 보기에서 골라 기호를 쓰시오.<br>ⓐ 접속사 ⓑ 주격 관계대명사 ⓒ 목적격 관계대명사<br>I ate a pizza <u>that</u> tasted like heaven.",["ⓐ 접속사","ⓑ 주격 관계대명사","ⓒ 목적격 관계대명사"],"ⓑ 주격 관계대명사","I ate a pizza that tasted like heaven.","나는 천국 같은 맛이 나는 피자를 먹었다.",
 "본책 p.160 ‘다양한 that의 쓰임을 구분할 수 있어야 한다’ 표를 펴세요.",
 "1) that 앞에 a pizza(피자)라는 선행사가 있어요.  2) that 뒤에 tasted(원형 taste: 맛이 나다)가 바로 와서 주어가 없어요.",
 "선행사를 꾸미는 that이고, 뒤에 주어가 없으니 목적격은 아니에요. 가운데 보기예요.","that + 동사(주어 없음) → 주격");
C(2,"B",2,"밑줄 친 that의 쓰임을 보기에서 골라 기호를 쓰시오.<br>ⓐ 접속사 ⓑ 주격 관계대명사 ⓒ 목적격 관계대명사<br>I learned <u>that</u> oil floats on water.",["ⓐ 접속사","ⓑ 주격 관계대명사","ⓒ 목적격 관계대명사"],"ⓐ 접속사","I learned that oil floats on water.","나는 기름이 물 위에 뜬다는 것을 배웠다.",
 "본책 p.160 표에서 ‘관계대명사 that vs 접속사 that’ 부분을 보세요.",
 "1) that 앞에 꾸며 줄 선행사가 있나요?  2) that 뒤의 oil floats on water(기름이 물 위에 뜬다)는 완전한 문장이에요.",
 "선행사가 없고 완전한 문장이 이어져요. 첫 번째 보기예요.","that + 완전한 문장 → 접속사");

W(3,"C",1,"관계부사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>Technology has changed the way. Students learn in this way.","Technology has changed how students learn.","Technology has changed how students learn.","기술은 학생들이 배우는 방식을 바꾸어 놓았다.",
 "본책 p.162 ‘관계부사의 종류’ 표 아래 the way와 how 예문, 그리고 빨간 주의 박스를 보세요.",
 "1) the way(방법)를 꾸미는 관계부사를 p.162 표의 방법 줄에서 찾아요.  2) 그런데 the way와 그 관계부사는 함께 쓰지 않아요. 둘 중 하나만 남겨요.  3) 두 번째 문장의 in this way(이런 방식으로)는 관계부사 안에 들어가서 사라져요.",
 "Technology has changed 뒤에 h로 시작하는 세 글자 관계부사를 쓰고 the way는 지워요. 모두 6단어예요.","the way / how 둘 중 하나만");
W(3,"C",2,"관계부사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>I’m looking for the hotel. I will stay at the hotel in New York.","I’m looking for the hotel where I will stay in New York.","I’m looking for the hotel where I will stay in New York.","나는 뉴욕에서 묵을 호텔을 찾고 있다.",
 "본책 p.162 ‘관계부사’ 박스의 This is the place. + The jazz festival was held at this place. 예시를 보세요.",
 "1) 두 번째 문장의 at the hotel은 ‘장소 앞에 전치사 + 명사’예요.  2) 이것을 관계부사 하나로 바꿔 the hotel 뒤에 붙이고, at the hotel은 지워요.",
 "the hotel 뒤에 w로 시작하는 다섯 글자 관계부사를 붙이고, stay 뒤의 at the hotel은 지워요.","전치사 + 장소 명사 → where");
W(3,"C",3,"관계부사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>It was 1988. The Seoul Olympics were held in that year.","It was 1988 when the Seoul Olympics were held.","It was 1988 when the Seoul Olympics were held.","서울 올림픽이 열렸던 해는 1988년이었다.",
 "본책 p.162 ‘관계부사의 종류’ 표에서 시간 선행사(the year 등)를 보세요.",
 "1) 선행사는 1988이라는 연도(시간)예요.  2) 두 번째 문장의 in that year를 관계부사 하나로 바꿔 1988 뒤에 붙여요.",
 "1988 바로 뒤에 시간의 관계부사(w로 시작하는 네 글자)를 붙이고, 끝의 in that year는 지워요.","in that year → when");
W(3,"C",4,"관계부사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오.<br>I like the way. The hero solved the mystery in that way.","I like how the hero solved the mystery.","I like how the hero solved the mystery.","나는 그 영웅이 수수께끼를 푼 방식이 마음에 든다.",
 "본책 p.162 ‘관계부사의 종류’ 표 아래, the way와 how를 함께 쓰지 않는다는 박스를 보세요.",
 "1) in that way(그런 방식으로)는 방법을 나타내는 관계부사로 바꿔요.  2) the way와 관계부사는 둘 중 하나만 써요.",
 "I like 뒤에 h로 시작하는 세 글자 관계부사를 쓰고 the way는 빼요. 끝의 in that way도 지워요.","the way = how (함께 쓰지 않음)");
W(3,"D",1,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>열심히 일하는 것이 내가 성공한 방법이었다. (I / successful / how / became)<br>Working hard was ___.","how I became successful","Working hard was how I became successful.","열심히 일하는 것이 내가 성공한 방법이었다.",
 "본책 p.162 ‘관계부사의 종류’ 표의 방법(how) 줄을 펴세요.",
 "1) ‘성공한 방법’을 how가 이끄는 절로 만들어요. 앞에 the way는 없어요.  2) how 뒤는 ‘주어 + 동사 + 보어’ 순서예요.",
 "how로 시작해서 successful로 끝나요. became(원형 become: ~이 되다)은 세 번째 자리예요.","how + 주어 + 동사 → ~하는 방법",["I","successful","how","became"]);
W(3,"D",2,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>65세는 대부분의 사람들이 은퇴하는 나이이다. (age / when / the / most / retire / people)<br>Sixty-five is ___.","the age when most people retire","Sixty-five is the age when most people retire.","65세는 대부분의 사람들이 은퇴하는 나이이다.",
 "본책 p.162 ‘관계부사의 종류’ 표에서 시간 선행사 줄을 보세요.",
 "1) 먼저 꾸밈을 받는 명사(선행사) ‘나이’를 the와 함께 써요.  2) 나이는 시간으로 보고 시간의 관계부사를 바로 뒤에 붙여요.  3) 관계부사 뒤는 ‘주어 + 동사’ 순서의 완전한 문장이에요.",
 "the로 시작해서 retire(은퇴하다)로 끝나요. 관계부사는 세 번째 자리예요.","시간 선행사 + when + 주어 + 동사",["age","when","the","most","retire","people"]);
W(3,"D",3,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>너는 오늘 아침에 Eva가 늦은 이유를 알고 있니? (reason / was / the / late / why / Eva)<br>Do you know ___ this morning?","the reason why Eva was late","Do you know the reason why Eva was late this morning?","너는 오늘 아침에 Eva가 늦은 이유를 알고 있니?",
 "본책 p.162 ‘관계부사의 종류’ 표에서 이유 줄을 보세요.",
 "1) 먼저 꾸밈을 받는 명사(선행사) ‘이유’를 the와 함께 써요.  2) 이유를 나타내는 관계부사를 바로 뒤에 놓아요.  3) 마지막은 ‘주어 + 동사 + 보어’ 순서예요(Eva가 늦었다).",
 "the로 시작해서 late로 끝나요. 관계부사는 세 번째 자리예요.","the reason + why + 완전한 문장",["reason","was","the","late","why","Eva"]);
W(3,"D",4,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>나는 네가 Dan의 파티에서 행동한 방식을 믿을 수 없다. (the / you / way / behaved)<br>I can’t believe ___ at Dan’s party.","the way you behaved","I can’t believe the way you behaved at Dan’s party.","나는 네가 Dan의 파티에서 행동한 방식을 믿을 수 없다.",
 "본책 p.162 ‘관계부사’ 박스의 the way와 how를 함께 쓰지 않는다는 부분을 보세요.",
 "1) 주어진 단어에 how가 없어요. 그래서 선행사 the way만 쓰고 how는 생략해요.  2) the way 뒤에 ‘주어 + 동사’가 와요.",
 "the로 시작해요. how 없이 선행사 바로 뒤에 주어가 오고, behaved(원형 behave: 행동하다)가 마지막이에요.","the way + 주어 + 동사 (how 없이)",["the","you","way","behaved"]);

W("SW","A",1,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>Neil Armstrong은 달 위를 걸었던 최초의 사람이었다. (the / that / walked / first / person)<br>Neil Armstrong was ___ on the moon.","the first person that walked","Neil Armstrong was the first person that walked on the moon.","Neil Armstrong은 달 위를 걸었던 최초의 사람이었다.",
 "본책 p.160 ‘관계대명사 that’ 박스에서 선행사가 「the + 서수」일 때를 보세요.",
 "1) ‘최초의 사람’은 the + 서수 + 명사예요.  2) 선행사에 서수가 붙으면 관계대명사는 주로 무엇을 쓰는지 p.160 POINT 1 표에서 확인해요.  3) 관계대명사 뒤에는 주어 없이 바로 동사가 와요(주격).",
 "the로 시작해서 walked(원형 walk: 걷다)로 끝나요. 관계대명사는 네 번째 자리예요.","the + 서수 + 명사 + that",["the","that","walked","first","person"]);
W("SW","A",2,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>너는 네가 성취해 온 것을 자랑스러워해야 한다. (you / accomplished / what / have)<br>You should be proud of ___.","what you have accomplished","You should be proud of what you have accomplished.","너는 네가 성취해 온 것을 자랑스러워해야 한다.",
 "본책 p.160 ‘관계대명사 what’ 박스를 펴세요.",
 "1) ‘네가 성취해 온 것’은 선행사를 포함한 what절이에요.  2) what 뒤는 ‘주어 + 동사’ 순서예요.  3) 동사는 have + 과거분사(완료)예요.",
 "what으로 시작하고 accomplished(원형 accomplish: 성취하다)로 끝나요.","what + 주어 + have p.p. → ~한 것",["you","accomplished","what","have"]);
W("SW","A",3,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>우리는 방이 깨끗하고 편안했던 호텔에 묵었다. (a / whose / hotel / were / clean / rooms)<br>We stayed at ___ and comfortable.","a hotel whose rooms were clean","We stayed at a hotel whose rooms were clean and comfortable.","우리는 방이 깨끗하고 편안했던 호텔에 묵었다.",
 "본책 p.158 3번 ‘소유격 관계대명사’ 박스를 펴세요.",
 "1) 먼저 꾸밈을 받는 명사(선행사) ‘호텔’을 a와 함께 써요.  2) ‘그 호텔의 방들’처럼 ‘~의’ 관계라서 소유격 관계대명사 뒤에 명사가 바로 와요.  3) 방들이 여럿이니 동사도 복수에 맞춘 과거형이에요.",
 "a로 시작해서 clean(깨끗한)으로 끝나요. whose는 세 번째 자리예요.","선행사 + whose + 명사 + 동사",["a","whose","hotel","were","clean","rooms"]);
W("SW","A",4,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>나는 프랑스에서 사람들이 서로 인사하는 방법을 배웠다. (the / each / people / way / greet / other)<br>I learned ___ in France.","the way people greet each other","I learned the way people greet each other in France.","나는 프랑스에서 사람들이 서로 인사하는 방법을 배웠다.",
 "본책 p.162 ‘관계부사’ 박스의 the way와 how를 함께 쓰지 않는다는 부분을 보세요.",
 "1) 주어진 단어에 how가 없으니 선행사 the way만 쓰고 관계부사는 생략해요.  2) 선행사 뒤에는 ‘주어 + 동사’가 와요.  3) ‘서로’는 두 단어로 된 표현이에요.",
 "the로 시작해서 other로 끝나요. 동사 greet(인사하다)는 네 번째 자리예요.","the way people greet = 사람들이 인사하는 방법",["the","each","people","way","greet","other"]);
W("SW","A",5,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>나는 그 가게가 문 닫는 시간을 안다. (time / the / store / when / closes / the)<br>I know ___.","the time when the store closes","I know the time when the store closes.","나는 그 가게가 문 닫는 시간을 안다.",
 "본책 p.162 ‘관계부사의 종류’ 표에서 시간 줄(the time ...)을 보세요.",
 "1) 먼저 꾸밈을 받는 명사(선행사) ‘시간’을 the와 함께 써요.  2) 시간에 쓰는 관계부사를 바로 뒤에 붙여요.  3) 관계부사 뒤는 ‘주어 + 동사’예요. 주어 ‘그 가게’에도 the가 붙어요.",
 "the로 시작해서 closes(문을 닫다)로 끝나요. 관계부사는 세 번째 자리예요.","the time when + 완전한 문장 = ~하는 시간",["time","the","store","when","closes","the"]);
W("SW","A",6,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>나는 빈티지 옷을 살 수 있는 가게를 찾는 중이다. (buy / I / a / where / shop / can)<br>I’m looking for ___ vintage clothes.","a shop where I can buy","I’m looking for a shop where I can buy vintage clothes.","나는 빈티지 옷을 살 수 있는 가게를 찾는 중이다.",
 "본책 p.162 ‘관계부사의 종류’ 표에서 장소 줄을 보세요.",
 "1) 먼저 꾸밈을 받는 명사(선행사) ‘가게’를 a와 함께 써요.  2) 가게는 장소라서 장소의 관계부사를 붙여요.  3) 관계부사 뒤는 ‘주어 + 조동사 + 동사원형’ 순서예요.",
 "a로 시작해서 buy(사다)로 끝나요. 관계부사는 세 번째 자리예요.","장소 + where + 주어 + 동사",["buy","I","a","where","shop","can"]);

W("SW","B",1,"관계사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오. (단, 관계사는 생략하지 말 것)<br>Strawberry is a fruit. Its vitamin C content is high.","Strawberry is a fruit whose vitamin C content is high.","Strawberry is a fruit whose vitamin C content is high.","딸기는 비타민 C 함량이 높은 과일이다.",
 "본책 p.158 3번 ‘소유격 관계대명사’ 박스를 펴세요.",
 "1) 두 번째 문장의 Its(그것의)는 소유격이에요.  2) Its를 whose로 바꿔 뒤의 명사 vitamin C content와 함께 a fruit 뒤에 붙여요.",
 "Its 자리에 w로 시작하는 다섯 글자 소유격 관계대명사를 넣어 a fruit 뒤에 붙여요.","Its + 명사 → whose + 명사");
W("SW","B",2,"관계사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오. (단, 관계사는 생략하지 말 것)<br>Dennis is the chef. He makes the best pasta in town.","Dennis is the chef who[that] makes the best pasta in town.","Dennis is the chef who makes the best pasta in town. / Dennis is the chef that makes the best pasta in town.","Dennis는 마을에서 가장 맛있는 파스타를 만드는 요리사이다.",
 "본책 p.158 1번 ‘주격 관계대명사’ 박스를 펴세요.",
 "1) 두 번째 문장의 He(= the chef)는 주어예요.  2) 사람이라서 who로 바꿔 the chef 바로 뒤에 붙여요.",
 "He 자리에 사람 주격 관계대명사(w로 시작하는 세 글자, 또는 t로 시작하는 네 글자)를 넣어 the chef 뒤에 붙여요.","He → who[that] (주격)");
W("SW","B",3,"관계사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오. (단, 관계사는 생략하지 말 것)<br>Scientists discovered a cave. Humans lived in that cave thousands of years ago.","Scientists discovered a cave where[in which] humans lived thousands of years ago.","Scientists discovered a cave where humans lived thousands of years ago. / Scientists discovered a cave in which humans lived thousands of years ago.","과학자들은 수천 년 전에 인간이 살았던 동굴을 발견했다.",
 "본책 p.162 ‘관계부사는 「전치사 + 관계대명사 which」로 바꿔 쓸 수 있다’ 부분을 보세요.",
 "1) 두 번째 문장의 in that cave는 장소를 나타내는 부사구예요.  2) 이것을 관계부사 하나(또는 in which)로 바꿔 a cave 뒤에 붙여요.",
 "a cave 뒤에 장소의 관계부사(w로 시작하는 다섯 글자)를 붙이고 in that cave는 지워요. 「전치사 + which」로 써도 돼요.","in that cave → where = in which");
W("SW","B",4,"관계사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오. (단, 관계사는 생략하지 말 것)<br>I learned the way. Magicians do this trick in that way.","I learned how magicians do this trick.","I learned how magicians do this trick.","나는 마술사들이 이 마술을 하는 방법을 배웠다.",
 "본책 p.162 ‘관계부사의 종류’ 표 아래 the way와 how 주의 박스를 보세요.",
 "1) in that way(그런 방법으로)는 방법의 관계부사로 바꿔요.  2) 관계사를 생략하지 말라고 했으니 how를 써요. the way는 지워요.",
 "I learned 뒤에 h로 시작하는 세 글자 관계부사를 쓰고, the way와 in that way는 지워요.","the way 빼고 how만 사용");
W("SW","B",5,"관계사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오. (단, 관계사는 생략하지 말 것)<br>Last Saturday was the day. My uncle got married on that day.","Last Saturday was the day when[on which] my uncle got married.","Last Saturday was the day when my uncle got married. / Last Saturday was the day on which my uncle got married.","지난 토요일은 우리 삼촌이 결혼한 날이었다.",
 "본책 p.162 ‘관계부사의 종류’ 표에서 시간 줄을 보세요.",
 "1) on that day(그날에)는 시간을 나타내는 부사구예요.  2) 이것을 시간의 관계부사(또는 on which)로 바꿔 the day 뒤에 붙여요.",
 "the day 뒤에 시간의 관계부사(w로 시작하는 네 글자)를 붙이고, 끝의 on that day는 지워요.","on that day → when = on which");
W("SW","B",6,"관계사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오. (단, 관계사는 생략하지 말 것)<br>Picasso is the painter. I admire this painter the most.","Picasso is the painter who(m)[that] I admire the most.","Picasso is the painter who I admire the most. / Picasso is the painter whom I admire the most. / Picasso is the painter that I admire the most.","피카소는 내가 가장 존경하는 화가이다.",
 "본책 p.158 2번 ‘목적격 관계대명사’ 박스를 펴세요.",
 "1) 두 번째 문장에서 this painter는 admire(존경하다)의 목적어예요.  2) 목적어를 관계대명사로 바꿔 the painter 뒤로 보내고 원래 자리는 지워요.",
 "the painter 뒤에 사람 목적격 관계대명사를 붙이고, admire 뒤의 this painter는 지워요.","목적어 → who(m)/that (원래 자리는 지움)");
W("SW","B",7,"관계사를 이용하여 주어진 두 문장을 한 문장으로 연결하시오. (단, 관계사는 생략하지 말 것)<br>The fun characters are the reason. I love this book for that reason.","The fun characters are the reason why I love this book.","The fun characters are the reason why I love this book.","재미있는 등장인물들이 내가 이 책을 좋아하는 이유이다.",
 "본책 p.162 ‘관계부사의 종류’ 표에서 이유 줄을 보세요.",
 "1) for that reason(그 이유로)은 이유를 나타내는 부사구예요.  2) 이것을 관계부사로 바꿔 the reason 뒤에 붙이고 for that reason은 지워요.",
 "the reason 뒤에 w로 시작하는 세 글자 관계부사를 붙이고, 끝의 for that reason은 지워요.","for that reason → why");
