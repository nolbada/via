C("NS","N",1,"[1-5] 빈칸에 들어갈 알맞은 말을 고르시오.<br>A Were you able to get a ticket to the concert?<br>B Yes. I got the last ___!",["① it","② one","③ some","④ any","⑤ another"],"② one","A Were you able to get a ticket to the concert? B Yes. I got the last one!","A 콘서트 표 구했어? B 응. 마지막 한 장을 구했어!",
 "본책 p.116 POINT 1 ‘one(s)’ 설명(앞에 나온 명사와 같은 종류의 불특정한 사물)을 보세요.",
 "1) 앞에 나온 a ticket(표 한 장)과 같은 종류를 가리켜요.  2) ‘바로 그 표’가 아니라 ‘마지막 남은 표 하나’이고, the last 뒤에 와서 명사 자리를 대신해요.",
 "it은 ‘바로 그 표’라 안 되고, some·any는 the last 뒤에 올 수 없어요. 남은 두 보기 중 단수 명사를 대신하는 쪽이에요.",
 "the last one = 마지막 하나 (같은 종류의 불특정)");
C("NS","N",2,"A Where is the lion? I can’t see ___.<br>B Look behind the big rock!",["① it","② one","③ some","④ any","⑤ another"],"① it","A Where is the lion? I can’t see it. B Look behind the big rock!","A 사자 어디 있어? 안 보여. B 큰 바위 뒤를 봐!",
 "본책 p.116 POINT 1 아래 ‘내신 적중’ 박스(동일한 특정 대상은 it이나 them)를 보세요.",
 "1) A는 the lion(그 사자)이라고 콕 집어 말했어요.  2) 못 찾는 것도 바로 그 사자예요. 같은 종류의 아무 사자가 아니에요.",
 "one·another는 ‘같은 종류의 다른 것’이라 지워요. some·any도 아니에요. 바로 그 사자를 가리키는 두 글자짜리 대명사예요.",
 "the + 명사 → 다시 받을 땐 it (특정)");
C("NS","N",3,"The students exchanged gifts with one ___ on the last day of school.",["① both","② each","③ every","④ other","⑤ another"],"⑤ another","The students exchanged gifts with one another on the last day of school.","학생들은 학기 마지막 날에 서로 선물을 교환했다.",
 "본책 p.118 POINT 2 ‘each, every’ 아래 ● each other, one another 설명을 보세요.",
 "1) 선물을 교환한 학생들은 여러 명(셋 이상)이에요.  2) one 뒤에 와서 ‘서로’라는 뜻을 만드는 짝을 골라요.",
 "both, each, every는 one 뒤에 올 수 없어요. one 뒤에서 ‘서로’가 되는 말은 an과 other가 합쳐진 말이에요.",
 "one another = (셋 이상) 서로");
C("NS","N",4,"Fred and George look alike. ___ of them have red hair and green eyes.",["① Both","② Each","③ Every","④ Other","⑤ Another"],"① Both","Fred and George look alike. Both of them have red hair and green eyes.","Fred와 George는 닮았다. 그들 둘 다 빨간 머리와 초록 눈을 가졌다.",
 "본책 p.118 POINT 3 ‘both, all’ 표와 ● 「both of + 대명사」를 보세요.",
 "1) Fred와 George, 두 사람 이야기예요.  2) 뒤에 of them이 오고 동사가 have(가지다)로 복수형이에요. 복수 취급하는 ‘둘 다’를 골라요.",
 "Each of them은 단수 취급이라 have와 안 맞고, Every는 of와 바로 붙여 쓰지 않아요. 두 사람을 묶는 ‘둘 다’, 대문자 B로 시작해요.",
 "둘 다 + of them → Both (복수 취급)");
C("NS","N",5,"This game is boring. Let’s play ___ one.",["① both","② each","③ every","④ other","⑤ another"],"⑤ another","This game is boring. Let’s play another one.","이 게임은 지루해. 다른 게임을 하자.",
 "본책 p.116 POINT 2 ‘other, another’ 아래 ● 「another + 단수 명사」를 보세요.",
 "1) 빈칸 뒤의 one은 game을 대신하는 단수예요.  2) ‘또 다른 하나의’라는 뜻으로 단수 명사 앞에 오는 말을 골라요.",
 "both는 복수 명사와 쓰고, other는 단수 명사 앞에 혼자 못 와요. ‘지금 것 말고 또 하나’라는 뜻의, an이 붙은 말이에요.",
 "another + one (또 하나의 것)");
C("NS","N",6,"밑줄 친 부분을 생략할 수 있는 것은?<br>① You must love <u>yourself</u>.<br>② She excused <u>herself</u> and left the room.<br>③ He must be proud of <u>himself</u>.<br>④ Be careful not to burn <u>yourself</u> when you cook.<br>⑤ We <u>ourselves</u> have a responsibility toward the environment.",["① You must love yourself.","② She excused herself and left the room.","③ He must be proud of himself.","④ Be careful not to burn yourself when you cook.","⑤ We ourselves have a responsibility toward the environment."],"⑤ We ourselves have a responsibility toward the environment.","We ourselves have a responsibility toward the environment.","우리 스스로가 환경에 대한 책임이 있다.",
 "본책 p.120 POINT 2 ‘재귀 용법’과 POINT 3 ‘강조 용법’의 ‘생략 가능 여부’ 설명을 보세요.",
 "1) 동사나 전치사의 목적어 자리에 있는 재귀대명사는 생략할 수 없어요.  2) 보기마다 밑줄 친 말이 목적어인지, 주어 바로 뒤에서 ‘직접’이라는 뜻을 더하는지 따져 보고 후자를 찾아요.",
 "①~④는 모두 동사나 전치사 뒤 목적어예요. 주어 바로 뒤에 붙은 보기가 답이에요.",
 "주어 바로 뒤 재귀대명사 = 강조 (생략 O)");
C("NS","N",7,"[7-8] 밑줄 친 부분과 쓰임이 같은 것을 고르시오.<br>I haven’t read the story <u>itself</u>, but I’ve heard a lot about it.<br>① You should give yourself a break.<br>② Jessica taught herself how to play guitar.<br>③ The girls dressed themselves for the party.<br>④ I like his movies, but I don’t like the director himself.<br>⑤ The cat cleaned itself when it got back to the house.",["① You should give yourself a break.","② Jessica taught herself how to play guitar.","③ The girls dressed themselves for the party.","④ I like his movies, but I don’t like the director himself.","⑤ The cat cleaned itself when it got back to the house."],"④ I like his movies, but I don’t like the director himself.","I like his movies, but I don’t like the director himself.","나는 그의 영화는 좋아하지만, 감독 본인은 좋아하지 않는다.",
 "본책 p.120 POINT 3 ‘강조 용법’(명사 바로 뒤에 쓰여 ‘그 자체’) 예문을 보세요.",
 "1) 밑줄 친 itself는 the story 바로 뒤에서 ‘이야기 그 자체’라는 뜻을 더해요. 강조 용법이에요.  2) 보기에서 명사 바로 뒤에서 ‘그 사람 본인’이라고 강조하는 문장을 찾아요.",
 "①②③⑤의 재귀대명사는 모두 동사(give, taught, dressed, cleaned) 바로 뒤의 목적어예요. 명사 바로 뒤에 붙은 보기를 찾아요.",
 "명사 바로 뒤 -self = ~ 자체, 본인 (강조)");
C("NS","N",8,"I hurt <u>myself</u> while playing soccer.<br>① My dad built this house himself.<br>② I myself will handle this problem.<br>③ We enjoyed ourselves at the beach.<br>④ I want to speak to Mr. Adams himself.<br>⑤ I myself made some chocolate cookies.",["① My dad built this house himself.","② I myself will handle this problem.","③ We enjoyed ourselves at the beach.","④ I want to speak to Mr. Adams himself.","⑤ I myself made some chocolate cookies."],"③ We enjoyed ourselves at the beach.","We enjoyed ourselves at the beach.","우리는 해변에서 즐거운 시간을 보냈다.",
 "본책 p.120 POINT 2 ‘재귀 용법’의 설명(동사의 목적어 자리에 쓰는 재귀대명사)을 보세요.",
 "1) 문제의 hurt myself는 동사 hurt(다치게 하다)의 목적어로 쓰인 재귀 용법이에요. 빼면 문장이 안 돼요.  2) 보기에서 동사 바로 뒤에 목적어로 쓰여 빼면 안 되는 문장을 찾아요.",
 "①④는 문장 끝, ②⑤는 주어 바로 뒤에 붙은 강조 용법이라 지워요. enjoy oneself(즐거운 시간을 보내다)가 들어 있는 보기예요.",
 "동사의 목적어 재귀대명사 = 생략 X (enjoyed ourselves)");
C("NS","N",9,"어법상 옳지 않은 것은?",["① All the money is gone.","② I took some photos during my trip.","③ Every teacher care about their students.","④ Do you have this T-shirt in another size?","⑤ This coffee and cake go well with each other."],"③ Every teacher care about their students.","Every teacher cares about their students.","모든 선생님은 학생들을 아낀다.",
 "본책 p.118 POINT 2 ‘each, every’ 표의 every + 단수 명사(단수 취급)와 아래 ‘내신 적중’ 박스를 보세요.",
 "1) 주어에 every, all 같은 말이 들어간 문장은 동사의 수 일치를 먼저 확인해요.  2) all + 불가산 명사는 단수, every + 단수 명사도 단수예요. 보기마다 동사가 알맞은지 하나씩 봐요.",
 "①은 all + 불가산 명사라 is가 맞아요. Every teacher로 시작하는 문장의 동사 care(아끼다, 관심을 갖다)에 -s가 있는지 살펴보세요.",
 "every + 단수 명사 + 단수 동사 (cares)");
M("NS","N",10,"빈칸에 들어갈 말로 알맞은 것을 모두 고르시오.<br>___ person has a different personality.",["① All","② Both","③ Each","④ Some","⑤ Every"],["③ Each","⑤ Every"],"Each person has a different personality. / Every person has a different personality.","사람마다 성격이 다르다.",
 "본책 p.118 POINT 2 ‘each, every’ 표의 each + 단수 명사, every + 단수 명사 칸을 보세요.",
 "1) 빈칸 뒤에 person(사람, 단수 명사)과 has(원형 have: 가지다)가 와요.  2) 단수 명사 바로 앞에 올 수 있는 말만 남기고, 복수 명사와 쓰는 말은 지워요.",
 "정답은 두 개예요. All·Both·Some은 단수 명사 person 앞에 쓰지 않아요. ‘각각의’와 ‘모든’의 뜻을 가진 두 말이에요.",
 "each / every + 단수 명사 (단수 취급)");
C("NS","N",11,"[11-12] 빈칸에 들어갈 말이 순서대로 짝지어진 것을 고르시오.<br>• Both my dogs ___ poodles.<br>• Each country ___ its own customs.",["① is — are","② are — is","③ is — has","④ are — has","⑤ are — have"],"④ are — has","Both my dogs are poodles. Each country has its own customs.","내 개 두 마리는 둘 다 푸들이다. 각 나라는 고유한 관습이 있다.",
 "본책 p.118 POINT 2·3 ‘each, every’와 ‘both, all’ 표의 ‘복수 취급 / 단수 취급’ 칸을 보세요.",
 "1) 첫 문장의 주어는 Both my dogs예요. both는 복수 취급하고, 뒤에 ‘푸들들’이 와요.  2) 둘째 문장의 주어는 Each country예요. each + 단수 명사는 단수 취급하고, 뜻은 ‘가지고 있다’예요.",
 "첫 칸은 복수형 be동사, 둘째 칸은 have의 단수형이에요. ①③은 첫 칸에서, ②⑤는 둘째 칸에서 지워요.",
 "both → are(복수) / each → has(단수)");
C("NS","N",12,"Every employee in this company ___ a raise. All of them ___ very hard.",["① deserve — work","② deserve — working","③ deserves — work","④ deserves — works","⑤ deserves — working"],"③ deserves — work","Every employee in this company deserves a raise. All of them work very hard.","이 회사의 모든 직원은 월급 인상을 받을 자격이 있다. 그들 모두 매우 열심히 일한다.",
 "본책 p.118 POINT 2·3 ‘each, every’와 ‘both, all’ 표의 ‘단수·복수 취급’ 칸을 보세요.",
 "1) 첫 문장 주어는 Every employee예요. every + 단수 명사는 단수 취급해서 동사에 -s가 필요해요.  2) 둘째 문장 주어는 All of them으로, 복수 취급해서 동사 원형을 써요. 일하다(work)가 복수 주어와 짝이 돼요.",
 "①②는 첫 칸에 -s가 없어서 지워요. 둘째 칸은 복수 주어 뒤라 -s도 -ing도 붙지 않은 모양이에요.",
 "every + 단수 → deserves / all of them → work");
C("NS","N",13,"우리말을 영어로 바르게 옮긴 것은?<br>그가 사과한 후에 모든 상황이 용서되었다.",["① All was forgiven after he apologized.","② All were forgiven after he apologized.","③ Each was forgiven after he apologized.","④ Every were forgiven after he apologized.","⑤ Every was forgiven after he apologized."],"① All was forgiven after he apologized.","All was forgiven after he apologized.","그가 사과한 후에 모든 상황이 용서되었다.",
 "본책 p.118 POINT 3 ‘both, all’ 아래 ● all이 대명사로 쓰일 때(사물이나 상황은 단수 취급)를 보세요.",
 "1) 한글의 ‘모든 상황’은 사람이 아니라 상황이에요. all 하나만 대명사로 쓰였어요.  2) all이 사람이면 복수, 사물이나 상황이면 단수 취급이에요. Every나 Each는 뒤에 명사가 와야 해요.",
 "③④⑤는 Each·Every 뒤에 명사가 없어서 지워요. 상황을 가리키는 all은 단수라서 be동사는 was예요.",
 "all(상황·사물) → 단수 취급 (was)");
W("NS","N",14,"[14-15] 빈칸에 공통으로 들어갈 말을 쓰시오.<br>• Let’s buy ___ cheese and bread.<br>• There’s pizza in the fridge. Do you want ___?","some","Let’s buy some cheese and bread. / There’s pizza in the fridge. Do you want some?","치즈와 빵을 좀 사자. / 냉장고에 피자가 있어. 좀 먹을래?",
 "본책 p.118 POINT 1 ‘some, any’ 표의 some 칸(긍정문, 권유하는 의문문)을 보세요.",
 "1) 첫 문장은 ‘사자’고 제안하는 긍정문(Let’s)이에요.  2) 둘째 문장은 상대에게 ‘먹을래?’ 하고 권하는 의문문이에요. 두 문장에 모두 쓸 수 있는 말이에요.",
 "s로 시작하는 네 글자예요. 둘째 문장에서는 뒤 명사 없이 대명사로 쓰여요.",
 "긍정문·권유 의문문 → some");
W("NS","N",15,"[14-15] 빈칸에 공통으로 들어갈 말을 쓰시오.<br>• The Mona Lisa is amazing. You have to see it for ___.<br>• Minjae, please behave ___ in front of the guests.","yourself","The Mona Lisa is amazing. You have to see it for yourself. / Minjae, please behave yourself in front of the guests.","모나리자는 대단해. 너는 직접 가서 봐야 해. / 민재야, 손님들 앞에서 예의 바르게 행동하렴.",
 "본책 p.120 POINT 4 ‘재귀대명사를 포함한 관용 표현’ 표의 for oneself 줄을 보세요. 둘째 문장은 POINT 2 재귀 용법(주어와 목적어가 같을 때)으로 풀어요.",
 "1) 첫 문장은 ‘직접, 스스로’라는 뜻의 for oneself예요.  2) 둘째 문장의 behave oneself는 ‘예의 바르게 행동하다’예요. 두 문장 모두 듣는 사람(You, Minjae)에게 하는 말이에요.",
 "you에 -self를 붙인 말이에요. y로 시작하는 여덟 글자예요.",
 "for oneself = 직접 / behave oneself = 예의 바르게 행동하다");
C("NS","N",16,"빈칸에 another가 쓰일 수 없는 것은?",["① I’d like to try ___ ice cream flavor.","② We’ll go to the beach tomorrow if ___ go.","③ The sisters sat next to one ___ on the plane.","④ I don’t like this movie. Can we watch ___ one?","⑤ This door is locked. Is there ___ entrance to the building?"],"② We’ll go to the beach tomorrow if ___ go.","We’ll go to the beach tomorrow if others go.","다른 사람들이 가면 우리는 내일 해변에 갈 것이다.",
 "본책 p.116 POINT 2 ‘other, another’ 아래 ● 「another + 단수 명사」와 본책 p.118 POINT 2의 one another 설명을 보세요.",
 "1) another는 ‘또 하나의 + 단수 명사’나 one another(서로)로 쓰여요.  2) 보기마다 빈칸 뒤가 단수 명사인지, one 뒤인지 확인해요. 동사 go(가다)만 남은 빈칸에는 어떤 말이 맞을까요?",
 "①⑤는 단수 명사 앞, ④는 one 앞, ③은 one another(서로)라 모두 another가 돼요. 빈칸 바로 뒤에 동사 go가 오는 보기를 찾아요.",
 "another는 단수 명사 앞 / 주어 자리엔 others");
W("NS","N",17,"그림을 보고 ( ) 안에 주어진 말을 바르게 배열하시오.<br>(그림: 토끼 세 마리 — 하얀 토끼 한 마리와 검은 토끼 두 마리)<br>(are / white / the / others / is / black / one / and)<br>I have three rabbits. ___.","One is white and the others are black","I have three rabbits. One is white and the others are black.","나는 토끼가 세 마리 있다. 한 마리는 하얗고, 나머지는 검다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표의 ‘one ~ the others’ 줄을 보세요.",
 "1) 그림에서 하얀 토끼는 한 마리, 검은 토끼는 두 마리예요.  2) 하나는 One is …, 나머지 전부는 the others are …로 and로 이어요.",
 "하나를 먼저 말하고(첫 단어는 One), and 뒤에서 나머지 전부를 말해요.",
 "one ~ the others (하나 / 나머지 전부)",["are","white","the","others","is","black","one","and"]);
C("NS","N",18,"어법상 옳지 않은 것의 개수는?<br>• All is welcome to join us for lunch.<br>• Do you know any good restaurants in this neighborhood?<br>• I’m busy today. Can we meet the others time?<br>• There are some birds on the branch.<br>• Each of the cars were painted in a different color.",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],"③ 3개","(옳지 않은 문장) All are welcome to join us for lunch. / Can we meet another time? / Each of the cars was painted in a different color.","(고친 문장) 모두 점심에 함께하는 것을 환영해요. / 우리 다른 시간에 만날 수 있을까요? / 차들은 각각 다른 색으로 칠해졌다.",
 "본책 p.118 POINT 2·3 ‘each, every’, ‘both, all’ 표와 p.116 POINT 2 ‘another’를 함께 보세요.",
 "1) 문장을 하나씩 따져요. 첫 문장은 all이 사람을 가리키는지 확인하고, 둘째·넷째 문장은 any와 some의 쓰임을 봐요.  2) 셋째는 time(단수)에 맞는 말인지, 다섯째는 each of + 복수 명사 뒤 동사의 수를 확인해요.",
 "둘째(any good restaurants)와 넷째(some birds)는 옳은 문장이에요. 나머지 문장들을 다시 따져서 틀린 개수를 세어 보세요.",
 "all(사람) 복수 / another time / each of → 단수");
C("NS","N",19,"빈칸 (A)~(C)에 들어갈 말이 바르게 짝지어진 것은?<br>A Do you have (A) ___ milk?<br>B No, I don’t, but I’ve got (B) ___ juice. Do you want (C) ___?<br>A Yes, please. Thank you.",["① any — any — some","② any — some — any","③ some — some — any","④ some — any — some","⑤ any — some — some"],"⑤ any — some — some","(A) any (B) some (C) some","A 우유 있어? B 아니, 없지만 주스는 좀 있어. 마실래? A 응, 부탁해. 고마워.",
 "본책 p.118 POINT 1 ‘some, any’ 표(긍정문, 권유하는 의문문, 부정문, 의문문)를 펴세요.",
 "1) (A)는 ‘우유 있어?’ 하고 묻는 일반 의문문이에요.  2) (B)는 ‘주스가 있다’는 긍정문이고, (C)는 ‘마실래?’ 하고 권하는 의문문이에요.",
 "(A)는 일반 의문문이라 any예요. 그래서 ③④는 지워요. (B)와 (C)에는 같은 말이 들어가요.",
 "일반 의문 any / 긍정 some / 권유 some");
C("NS","N",20,"밑줄 친 부분의 쓰임이 나머지 넷과 다른 것은?",["① I believe in myself and my abilities.","② I myself saw the thief yesterday.","③ I talk to myself when I need to think.","④ Let me introduce myself.","⑤ I can entertain myself by reading."],"② I myself saw the thief yesterday.","I myself saw the thief yesterday.","나는 어제 직접 그 도둑을 봤다.",
 "본책 p.120 POINT 2 ‘재귀 용법’과 POINT 3 ‘강조 용법’의 차이를 보세요.",
 "1) 재귀 용법은 동사나 전치사의 목적어로 쓰여 빼면 문장이 안 돼요.  2) 강조 용법은 ‘직접’이라는 뜻만 더해서 빼도 문장이 성립해요. 보기마다 myself를 지워 보세요.",
 "나머지 넷은 believe in, talk to, introduce, entertain의 목적어예요. 주어 I 바로 뒤에 붙은 보기가 답이에요.",
 "주어 바로 뒤 myself = 강조 (나머지는 재귀)");
C("NS","N",21,"[21-22] 다음 글을 읽고 질문에 답하시오.<br>Welcome to Star Resort. We pride ① yourselves on having the best resort in the country. All our ② staff member are ready to make your vacation a most memorable one. While you’re here, you’re family. 그러므로 부디 편히 지내도록 하세요. As an all-inclusive resort, ③ all meal is included. You are free to eat at ④ every of the restaurants here. Some are located near the pool, while ⑤ anothers are closer to the beach. And don’t forget to check out our spas, arcade, and gym! We hope you enjoy your stay.<br>위 글의 밑줄 친 ①~⑤를 잘못 고친 것은?",["① yourselves → ourselves","② staff member → staff members","③ all → each","④ every → all","⑤ anothers → another"],"⑤ anothers → another","Some are located near the pool, while the others are closer to the beach.","어떤 곳들은 수영장 근처에 있고, 나머지는 해변에 더 가깝다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표의 ‘some ~ the others’ 줄을 보세요.",
 "1) 글 안의 Some … while ⑤ … 구조를 보세요. 앞에 Some(몇몇)이 있으니 짝이 되는 말이 필요해요.  2) 나머지 보기 ①~④는 ‘We(우리가) 자랑스러워한다’, ‘직원은 여러 명’, ‘식사마다’, ‘식당 중’ 같은 의미를 맞게 고쳤는지 확인해요.",
 "Some ~ 뒤에서 ‘나머지 전부’를 말하려면 the로 시작하는 말이 필요해요. ①~④는 모두 바르게 고친 거예요.",
 "Some ~ the others (몇몇 / 나머지 전부)");
W("NS","N",22,"[21-22] 위 글의 밑줄 친 우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>(그러므로 부디 편히 지내도록 하세요.)<br>So please ___. (oneself, home)","make yourself at home","So please make yourself at home.","그러니 부디 편히 지내세요.",
 "본책 p.120 POINT 4 ‘재귀대명사를 포함한 관용 표현’ 표의 ‘편히 지내다’ 줄을 보세요.",
 "1) ‘편히 지내다’는 make oneself at home이에요.  2) 손님(You)에게 부탁하는 문장(please)이라 oneself를 you에 맞게 바꿔요.",
 "make로 시작해서 at home으로 끝나요. 가운데는 you에 -self를 붙여요.",
 "make oneself at home = 편히 지내다");
W("NS","N",23,"[23-25] 우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>그녀는 고데기에 데었다. (burn)<br>She ___ ___ with a curling iron.","burned herself","She burned herself with a curling iron.","그녀는 고데기에 데었다.",
 "본책 p.120 POINT 2 ‘재귀 용법’ 아래 ● dress, hurt, cut, enjoy, blame 같은 동사 설명을 보세요.",
 "1) ‘데었다’는 ‘자기 자신을 데게 했다’와 같아요. burn(데다) 뒤에 목적어가 필요해요.  2) 과거 이야기이니 burn을 과거형으로 바꾸고, 목적어는 주어 She와 같은 사람이에요.",
 "첫 칸은 burn에 -ed를 붙이고, 둘째 칸은 her에 -self를 붙여요.",
 "burn oneself = 데다 (재귀 용법)");
W("NS","N",24,"[23-25] 우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>우리는 둘 다 하이킹을 좋아한다. (us, like)<br>___ ___ ___ ___ hiking.","Both of us like","Both of us like hiking.","우리는 둘 다 하이킹을 좋아한다.",
 "본책 p.118 POINT 3 ‘both, all’ 아래 ● 「both of + 대명사」 설명을 보세요.",
 "1) ‘우리는 둘 다’가 주어이고, 칸은 네 개예요.  2) both 뒤에 대명사 us가 오면 사이에 of가 필요해요. both는 복수 취급이라 like(좋아하다)는 s 없이 써요.",
 "첫 칸은 B로 시작하는 ‘둘 다’이고, 마지막 칸은 like예요.",
 "both of + us + 복수 동사");
W("NS","N",25,"[23-25] 우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>이 학급의 모든 학생은 다른 목표를 가지고 있다. (have)<br>Every ___ in this class ___ a different goal.","student has","Every student in this class has a different goal.","이 학급의 모든 학생은 서로 다른 목표를 가지고 있다.",
 "본책 p.118 POINT 2 ‘each, every’ 표의 every + 단수 명사(단수 취급)를 보세요.",
 "1) 첫 칸은 every 바로 뒤라서 단수 명사가 와요. ‘학생’을 영어로 쓰되 복수형으로 쓰지 않아요.  2) 둘째 칸은 have(가지다)를 단수 주어에 맞게 바꿔요.",
 "첫 칸은 s 없는 student, 둘째 칸은 have의 단수 현재형이에요.",
 "every + 단수 명사 → has");
C("NS","N",26,"빈칸에 들어갈 말을 보기에서 골라 기호를 순서대로 배열한 것은?<br>• I don’t see ___ convenience stores here. Oh, there’s ___ over there.<br>• ___ of these sweaters are too big for me.<br>• James and Sam are twins, but they are different. ___ is outgoing and ___ is shy.<br>보기 ⓐ some ⓑ any ⓒ each ⓓ both ⓔ one ⓕ the other ⓖ the others",["① ⓐ-ⓔ-ⓒ-ⓔ-ⓕ","② ⓐ-ⓓ-ⓔ-ⓒ-ⓖ","③ ⓑ-ⓐ-ⓒ-ⓔ-ⓖ","④ ⓑ-ⓔ-ⓐ-ⓔ-ⓖ","⑤ ⓑ-ⓔ-ⓓ-ⓔ-ⓕ"],"⑤ ⓑ-ⓔ-ⓓ-ⓔ-ⓕ","I don’t see any convenience stores here. Oh, there’s one over there. / Both of these sweaters are too big for me. / James and Sam are twins, but they are different. One is outgoing and the other is shy.","여기에서는 편의점이 보이지 않는다. 아, 저기 하나 있다. / 이 스웨터는 둘 다 나에게 너무 크다. / James와 Sam은 쌍둥이이지만 서로 다르다. 한 명은 외향적이고 다른 한 명은 수줍음이 많다.",
 "본책 p.116 POINT 1·3과 p.118 POINT 1·3(one(s), some·any, both·all)을 모두 보세요.",
 "1) 첫 칸은 부정문(don’t)에 쓰는 말, 둘째 칸은 앞 명사와 같은 종류의 하나를 가리키는 말이에요.  2) 셋째 칸은 sweaters(복수)와 are가 있어 복수 취급하는 ‘둘 다’이고, 넷째·다섯째는 둘뿐이라 one ~ the other예요.",
 "첫 칸은 부정문용 ⓑ, 마지막 칸은 ⓕ로 끝나는 보기를 찾아보세요.",
 "부정 any / 불특정 one / both(복수) / one ~ the other");
W("NS","N",27,"어법상 틀린 부분을 찾아 바르게 고치시오.<br>In the library, there were three students sitting next to one another. One was reading a book, others was writing a poem, and the third was doing homework.","others → another","In the library, there were three students sitting next to one another. One was reading a book, another was writing a poem, and the third was doing homework.","도서관에 나란히 앉아 있는 학생이 세 명 있었다. 한 명은 책을 읽고 있었고, 다른 한 명은 시를 쓰고 있었으며, 세 번째 학생은 숙제를 하고 있었다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표 아래 ● 설명(셋 중 하나는 one, 또 다른 하나는 another…)을 보세요.",
 "1) 학생은 모두 세 명이고, One … ~ the third의 순서로 이야기해요.  2) 가운데 학생은 ‘또 다른 한 명’이에요. 뒤의 was(원형 be: ~이다)도 단수예요.",
 "others를 an이 붙은 일곱 글자짜리 단수형으로 바꿔요.",
 "셋 나열의 가운데 = another (others X)");
W("NS","N",28,"두 문장의 의미가 같도록 재귀대명사를 이용하여 빈칸에 알맞은 말을 쓰시오.<br>My grandfather lives alone in the countryside.<br>My grandfather lives ___ ___ in the countryside.","by himself","My grandfather lives by himself in the countryside.","우리 할아버지는 시골에서 혼자 사신다.",
 "본책 p.120 POINT 4 ‘재귀대명사를 포함한 관용 표현’ 표의 by oneself(= alone) 줄을 보세요.",
 "1) alone(혼자서)과 같은 뜻을 가진 관용 표현이 필요해요.  2) 두 칸 중 첫 칸은 전치사이고, 둘째 칸에는 주어 My grandfather에 맞는 재귀대명사를 써요.",
 "첫 칸은 b로 시작하는 두 글자, 둘째 칸은 him에 -self를 붙인 말이에요.",
 "by oneself = alone (혼자서)");
C("NS","N",29,"다음은 한 학급의 제2외국어 수업 수강 현황이다. 차트의 내용과 일치하는 것을 고르시오.<br>(차트: What second foreign language are you studying? (Total: 35 students) — Chinese 20명, Japanese 15명)",["① All of them study Chinese.","② One studies Chinese, and the other studies Japanese.","③ One studies Chinese, and another studies Japanese.","④ Some study Chinese, and the other study Japanese.","⑤ Some study Chinese, and the others study Japanese."],"⑤ Some study Chinese, and the others study Japanese.","Some study Chinese, and the others study Japanese.","어떤 학생들은 중국어를 공부하고, 나머지는 일본어를 공부한다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표(some ~ the others, one ~ the other)를 보세요.",
 "1) 전체는 35명이고, 중국어는 20명, 일본어는 15명이에요. 한 명이나 두 명이 아니라 여러 명씩이에요.  2) 여러 명 중 일부와 나머지 전부를 말할 때의 구문을 찾고, 동사의 수도 확인해요.",
 "①②③은 ‘전부’나 ‘한 명’ 이야기라 지워요. ④의 the other는 나머지 ‘한 명’이라 15명과 맞지 않아요.",
 "두 무리로 나뉜 여러 명 → Some ~ the others");
W("NS","N",30,"그림을 보고 주어진 조건에 맞게 문장을 완성하시오.<br>(그림: 갈림길에서 한쪽 길은 영화관으로, 다른 쪽 길은 공원으로 이어진다)<br>조건: 현재시제로 쓸 것 / road, lead to를 이용할 것<br>___ ___ ___ ___ the movie theater, and ___ ___ ___ ___ the park.","One road leads to, the other leads to","One road leads to the movie theater, and the other leads to the park.","한쪽 길은 영화관으로 이어지고, 다른 쪽 길은 공원으로 이어진다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표의 ‘one ~ the other’ 줄을 보세요.",
 "1) 길은 모두 두 갈래예요. 하나는 영화관, 나머지 하나는 공원으로 가요.  2) 앞 문장은 One road로 시작하고, 뒤 문장은 ‘나머지 하나’를 나타내는 말로 시작해요. lead to(~로 이어지다)는 현재시제이고 주어가 단수라 leads예요.",
 "앞 문장은 ‘하나’로 시작하고, 뒤 문장은 ‘나머지 하나’를 뜻하는 the로 시작해요.",
 "one ~ the other, 현재시제 단수 leads");
// ===== 문법정리노트 (p.128) =====
C("GN","G",1,"My dad’s car is old. He needs to buy a new (one / ones).<br>(우리 아빠의 차는 낡았다. 그는 새로운 차를 하나 사야 한다.)",["one","ones"],"one","My dad’s car is old. He needs to buy a new one.","우리 아빠의 차는 낡았다. 그는 새로운 차를 하나 사야 한다.",
 "본책 p.128 문법정리노트 ‘부정대명사 one(s)’ 줄과 본책 p.116 POINT 1을 보세요.",
 "1) 앞에 나온 car(차)와 같은 종류의 새 차 한 대를 말해요.  2) a new 뒤이니 ‘하나’예요. 단수인지 복수인지 정해요.",
 "s가 안 붙은 쪽이에요. o로 시작하는 세 글자예요.",
 "a new + one (단수), ones는 복수");
W("GN","G",2,"We should be kind to ___.<br>(우리는 다른 사람들에게 친절해야 한다.)","others","We should be kind to others.","우리는 다른 사람들에게 친절해야 한다.",
 "본책 p.128 문법정리노트 ‘other(s)’ 줄과 본책 p.116 POINT 2를 보세요.",
 "1) ‘다른 사람들’이라는 뜻의 말이 필요해요.  2) other는 보통 복수로 쓰여 ‘다른 사람들’을 의미해요.",
 "other에 s를 붙인 여섯 글자예요.",
 "others = 다른 사람들 (복수형으로 쓰임)");
W("GN","G",3,"This sandwich is really good. Can I have ___?<br>(이 샌드위치는 정말 맛있다. 또 하나를 더 먹어도 될까?)","another","This sandwich is really good. Can I have another?","이 샌드위치는 정말 맛있다. 또 하나를 더 먹어도 될까?",
 "본책 p.128 문법정리노트 ‘another’ 줄과 본책 p.116 POINT 2를 보세요.",
 "1) 샌드위치가 맛있어서 ‘또 하나’를 더 먹고 싶다는 뜻이에요.  2) an과 other가 합쳐진 말이고 뒤에 명사 없이 대명사로 쓰였어요.",
 "a로 시작하는 일곱 글자예요.",
 "another = 또 하나 (an + other)");
W("GN","G",4,"Would you like to drink ___ ___?<br>(물을 좀 마실래?)","some water","Would you like to drink some water?","물을 좀 마실래?",
 "본책 p.128 문법정리노트 ‘some, any’ 줄(권유문)과 본책 p.118 POINT 1을 보세요.",
 "1) Would you like ~?는 권유하는 말이에요.  2) 권유하는 의문문에는 some을 쓰고, 마실 것은 ‘물’이에요.",
 "첫 칸은 s로 시작하는 네 글자, 둘째 칸은 w로 시작하는 다섯 글자예요.",
 "권유문 → some + 명사 (some water)");
W("GN","G",5,"I don’t have ___ ___ in my pocket.<br>(나는 주머니에 돈이 조금도 없다.)","any money","I don’t have any money in my pocket.","나는 주머니에 돈이 조금도 없다.",
 "본책 p.128 문법정리노트 ‘some, any’ 줄(부정문)과 본책 p.118 POINT 1 표를 보세요.",
 "1) don’t(do not, 원형 do: 하다)가 있어 부정문이에요.  2) 부정문에는 any를 쓰고, 주머니에 없는 것은 ‘돈’이에요.",
 "첫 칸은 a로 시작하는 세 글자, 둘째 칸은 m으로 시작하는 다섯 글자예요.",
 "부정문 → any + 명사 (any money)");
W("GN","G",6,"Every item in this store ___ on sale now.<br>(이 가게의 모든 상품은 지금 세일 중이다.)","is","Every item in this store is on sale now.","이 가게의 모든 상품은 지금 세일 중이다.",
 "본책 p.128 문법정리노트 ‘each, every’ 줄(단수 취급)과 본책 p.118 POINT 2를 보세요.",
 "1) 주어는 Every item(모든 상품)이에요. every 뒤에는 단수 명사가 와요.  2) 단수 취급하니 be동사도 단수에 맞춰요.",
 "단수 주어에 쓰는 be동사 현재형이에요. 두 글자예요.",
 "Every item ~ is (모든 것도 단수 동사)");
W("GN","G",7,"___ ___ ___ ___ were expensive. (그 드레스들은 둘 다 비쌌다.)","Both of the dresses","Both of the dresses were expensive.","그 드레스들은 둘 다 비쌌다.",
 "본책 p.128 문법정리노트 ‘both, all’ 줄과 본책 p.118 POINT 3 표(both (of) + 복수 명사)를 보세요.",
 "1) ‘둘 다’라는 뜻이고, 뒤의 were(원형 be: ~이다)는 복수 동사예요.  2) both (of) + 복수 명사 형태이고, 칸이 네 개이니 of와 the를 모두 넣어요.",
 "Both로 시작해서 of the를 거쳐 dresses로 끝나요.",
 "both of the + 복수 명사 (복수 취급)");
W("GN","G",8,"Ben cut ___ while he was chopping onions.<br>(Ben은 양파를 자르던 중에 손을 베였다.)","himself","Ben cut himself while he was chopping onions.","Ben은 양파를 자르던 중에 손을 베였다.",
 "본책 p.128 문법정리노트 ‘재귀 용법’ 줄과 본책 p.120 POINT 2를 보세요.",
 "1) cut(자르다, 베다)의 주어는 Ben이에요. 벤 곳은 Ben 자신의 손이에요.  2) 주어와 목적어가 같으니 재귀대명사를 써요. Ben은 남자 한 명이에요.",
 "him에 -self를 붙여요. h로 시작하는 일곱 글자예요.",

C(1,"Q",1,"다음 문장으로 알 수 있는 것은?<br>Ruby is taller than Tina. Tina is taller than Mike.",["Ruby is the tallest of the three.","Tina is the tallest of the three."],"Ruby is the tallest of the three.","Ruby is the tallest of the three.","루비는 셋 중에서 가장 키가 크다.",
 "본책 p.130 최상급 비교(POINT 3) 박스를 펴세요.","1) 첫 문장에서 Ruby(루비)와 Tina(티나) 중 누가 더 큰지 봐요.  2) 둘째 문장에서 Tina(티나)와 Mike(마이크) 중 누가 더 큰지 봐요.  3) 셋을 줄 세워 맨 앞에 선 사람을 찾아요.","Ruby는 Tina보다 크고, Tina는 Mike보다 커요. 그러면 가장 큰 사람은 첫 번째 보기에 있어요.","셋 이상 중 가장 ~ → the + 최상급 + of the three");

[["The earth is (very / a lot) bigger than the moon.","a lot","The earth is a lot bigger than the moon.","지구는 달보다 훨씬 더 크다.","본책 p.130 비교급 비교(POINT 2) 아래의 ‘비교급 강조’ 박스를 펴세요.","1) 빈칸 뒤에 bigger(더 큰)가 있고 than(~보다)도 있어요. 비교급이에요.  2) very(매우)가 비교급 앞에 올 수 있는지 박스를 확인해요.","very는 비교급을 꾸밀 수 없어요. 그래서 a로 시작하는 ‘훨씬’ 뜻의 두 단어 표현을 골라요.","비교급 강조 → much, even, far, a lot (very 안 됨)"],
 ["Emma’s hair is longer than (my / mine).","mine","Emma’s hair is longer than mine.","Emma의 머리카락은 내 것보다 더 길다.","본책 p.130 비교급 비교(POINT 2)의 ‘비교가 되는 두 대상은 같은 종류’ 박스를 펴세요.","1) 비교하는 것은 Emma’s hair(Emma의 머리카락)와 ‘나의 머리카락’이에요.  2) 머리카락끼리 비교해야 해요. 「소유격 + 명사」(my hair)를 한 단어로 줄이면 뭘까요?","my hair를 한 단어로 줄인 말이에요. m으로 시작하는 네 글자예요.","비교 대상은 같은 종류 → my hair = mine"],
 ["The singer’s new album is (far / more) popular than his first one.","more","The singer’s new album is more popular than his first one.","그 가수의 새 앨범은 그의 첫 앨범보다 더 인기 있다.","본책 p.130 비교급 비교(POINT 2) 맨 위 ‘비교급 + than’ 표를 펴세요.","1) 뒤에 than(~보다)이 있으니 비교급이 필요해요.  2) popular(인기 있는)처럼 긴 형용사의 비교급은 어떻게 만드는지 떠올려요.","far는 ‘훨씬’이라는 강조 말이라 비교급 자체가 될 수 없어요. 비교급을 만드는 m으로 시작하는 말을 골라요.","popular(긴 형용사) 비교급 → more popular than"],
 ["The play was (very / much) interesting and funny.","very","The play was very interesting and funny.","그 연극은 매우 흥미롭고 재미있었다.","본책 p.130 비교급 비교(POINT 2) 아래 ‘very는 비교급을 강조할 수 없고, 원급을 강조한다’ 박스를 펴세요.","1) interesting(흥미로운)은 비교급일까요, 원급일까요?  2) 문장에 than(~보다)이 있는지 찾아봐요.","than이 없어서 비교급이 아니에요. 원급을 꾸밀 수 있는 v로 시작하는 말을 골라요.","원급 강조 → very, 비교급 강조 → much"],
 ["Playing basketball is more exciting than (to watch / watching) it.","watching","Playing basketball is more exciting than watching it.","농구를 하는 것은 그것을 보는 것보다 더 신난다.","본책 p.130 비교급 비교(POINT 2)의 ‘비교가 되는 두 대상은 같은 종류와 형태’ 박스를 펴세요.","1) 앞의 Playing basketball(농구를 하는 것)은 -ing 모양이에요.  2) than 뒤에도 앞과 같은 형태를 써야 해요.","앞이 -ing(동명사)니까 뒤도 -ing 모양을 골라요. watch(보다)에 ing를 붙인 쪽이에요.","than 앞뒤는 같은 형태 → Playing … than watching"]
].forEach((r,i)=>C(1,"A",i+1,r[0],r[0].match(/\(([^)]*)\)/)[1].split(" / "),r[1],r[2],r[3],r[4],r[5],r[6],r[7]));

W(1,"B",1,"The buses run every ten minutes. The trains run every two hours.<br>The buses run ___ than the trains. (frequently)","more frequently","The buses run more frequently than the trains.","버스는 기차보다 더 자주 운행된다.",
 "본책 p.130 비교급 비교(POINT 2) 맨 위 ‘비교급 + than’ 표를 펴세요.","1) 버스는 10분마다, 기차는 2시간마다 와요. 누가 더 자주 올까요?  2) 뒤에 than(~보다)이 있으니 비교급이에요.  3) frequently(자주)는 -ly로 끝나는 긴 부사예요. 긴 단어는 어떻게 비교급을 만들까요?","앞에 m으로 시작하는 네 글자 말을 붙이고 frequently는 그대로 써요.","긴 부사의 비교급 → more + 원급 + than");
W(1,"B",2,"These days I drink coffee once a day. I also drink black tea once a day.<br>I drink coffee ___ black tea these days. (much)","as much as","I drink coffee as much as black tea these days.","요즘 나는 커피를 홍차만큼 마신다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘as + 원급 + as’ 표를 펴세요.","1) 커피도 하루 한 번, 홍차도 하루 한 번이에요. 양이 같아요.  2) 같은 정도일 때는 「as + 원급 + as」(~만큼 …한)를 써요.  3) 원급은 주어진 much(많이)예요.","세 단어예요. 가운데에 much가 들어가고 양쪽이 같은 두 글자 말이에요.","정도가 같다 → as + 원급 + as");
W(1,"B",3,"I’m 165 cm tall. My mom is 162 cm tall. My dad is 178 cm tall.<br>My dad is ___ of all my family members. (tall)","the tallest","My dad is the tallest of all my family members.","우리 아빠는 우리 가족 중에서 가장 키가 크다.",
 "본책 p.130 최상급 비교(POINT 3)의 ‘the + 최상급 + of’ 표를 펴세요.","1) 나 165, 엄마 162, 아빠 178이에요. 가장 큰 사람은 아빠예요.  2) 빈칸 뒤에 of all my family members(우리 가족 모두 중에서)가 있어요. 셋 이상 중 가장 ~한 것이에요.","the로 시작하고 tall 뒤에 -est를 붙인 두 단어예요.","셋 이상 중 가장 ~ → the + 최상급 (+ of)");

W(1,"C",1,"Today’s air quality is <u>bad</u> than yesterday’s.","worse","Today’s air quality is worse than yesterday’s.","오늘의 대기 질은 어제의 것보다 더 나쁘다.",
 "본책 p.130 맨 아래 ‘불규칙 변화 형태의 비교급과 최상급’ 표에서 bad(나쁜) 줄을 펴세요.","1) than(~보다)이 뒤에 있으니 비교급이 필요해요.  2) bad(나쁜)는 -er을 붙이지 않고 모양이 완전히 바뀌는 단어예요.","표에서 bad - w로 시작하는 단어를 찾아요. 다섯 글자예요.","bad(나쁜) - worse - worst (불규칙)");
W(1,"C",2,"This elephant is the <u>larger</u> animal in the zoo.","largest","This elephant is the largest animal in the zoo.","이 코끼리는 동물원에서 가장 큰 동물이다.",
 "본책 p.130 최상급 비교(POINT 3)의 ‘the + 최상급 + in’ 표를 펴세요.","1) the(그)가 앞에 있고 뒤에 in the zoo(동물원 안에서)가 있어요.  2) ‘동물원에서 가장 큰’이라는 뜻이에요. -er과 -est 중 어느 것일까요?","larger 끝의 -er을 -est로 바꾸는 느낌이에요. l로 시작하는 일곱 글자예요.","the + 최상급 + in → larger를 largest로");
W(1,"C",3,"Usually, dogs can’t jump as <u>highest</u> as cats.","high","Usually, dogs can’t jump as high as cats.","보통 개는 고양이만큼 높이 뛰지 못한다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘as + 원급 + as’ 표를 펴세요.","1) as ~ as(~만큼 …한) 사이에 들어가는 모양을 떠올려요.  2) 이 자리에는 -er이나 -est가 붙은 말이 올 수 있을까요?","as와 as 사이에는 원래 모양(원급)이 와요. 네 글자예요.","as ~ as 사이는 항상 원급 → highest를 high로");
W(1,"C",4,"Lemons are <u>not as sweeter as</u> oranges.","not as sweet as","Lemons are not as sweet as oranges.","레몬은 오렌지만큼 달지 않다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘not + as + 원급 + as’ 표를 펴세요.","1) not as ~ as는 ‘~만큼 …하지 않은’이라는 뜻이에요.  2) 그 사이에 sweeter(더 단)처럼 비교급이 들어가도 될까요?","not as와 as는 그대로 두고, 가운데 단어만 원래 모양(원급)으로 돌려요.","not as + 원급 + as → sweeter를 sweet로");

W(1,"D",1,"그는 주연 배우보다 더 유명해졌다. (popular)<br>He became ___ the main actor.","more popular than","He became more popular than the main actor.","그는 주연 배우보다 더 유명해졌다.",
 "본책 p.130 비교급 비교(POINT 2) 맨 위 ‘비교급 + than’ 표를 펴세요.","1) ‘~보다 더 유명한’이니까 비교급이에요.  2) popular(인기 있는, 유명한)는 긴 형용사예요. 긴 형용사의 비교급은 앞에 무엇을 붙이는지 떠올려요.","m으로 시작하는 네 글자 + popular + than, 세 단어예요.","긴 형용사 비교급 → more + 원급 + than");
W(1,"D",2,"너의 건강이 돈보다 훨씬 더 중요하다. (far, important)<br>Your health is ___ than money.","far more important","Your health is far more important than money.","너의 건강이 돈보다 훨씬 더 중요하다.",
 "본책 p.130 비교급 비교(POINT 2) 아래 ‘비교급을 강조할 때는…’ 박스를 펴세요.","1) ‘훨씬 더 중요한’이니까 비교급 important에 강조 말이 붙어요.  2) important(중요한)는 긴 형용사라서 more를 써요.  3) 강조하는 far(훨씬)는 비교급 바로 앞에 놓아요.","강조 말 far가 맨 앞이에요. important는 긴 단어라 앞에 한 단어가 더 붙어요. 모두 세 단어예요.","비교급 강조 → far + more important");
W(1,"D",3,"오늘은 내 인생 최악의 날이었다. (bad, day)<br>It was ___ of my life.","the worst day","It was the worst day of my life.","오늘은 내 인생 최악의 날이었다.",
 "본책 p.130 맨 아래 ‘불규칙 변화 형태의 비교급과 최상급’ 표의 bad(나쁜) 줄과 최상급(POINT 3) 표를 펴세요.","1) ‘최악의’는 가장 나쁜이에요. bad(나쁜)의 최상급을 써요.  2) 최상급 앞에는 the가 오고, 뒤에 명사 day(날)를 붙여요.","the + w로 시작하는 단어 + day, 세 단어예요.","최상급 앞에는 the → the + worst + 명사");
W(1,"D",4,"양쯔강은 아시아에서 가장 긴 강이다. (long, river)<br>The Yangtze River is ___ Asia.","the longest river in","The Yangtze River is the longest river in Asia.","양쯔강은 아시아에서 가장 긴 강이다.",
 "본책 p.130 최상급 비교(POINT 3)의 ‘the + 최상급 (+ 명사) + in + 장소·범위’ 표를 펴세요.","1) ‘가장 긴 강’이니까 long(긴)의 최상급 + river(강)예요.  2) Asia는 장소를 나타내요. 장소 앞에는 in과 of 중 어느 것을 쓸까요?","long의 최상급 앞에 the, 뒤에 river, 마지막에 장소 앞 전치사까지 네 단어예요.","최상급 + 명사 + in + 장소");
W(1,"D",5,"예나는 세 여자아이 중에서 가장 짧은 머리를 가졌다. (short, hair)<br>Yena has ___ the three girls.","the shortest hair of","Yena has the shortest hair of the three girls.","예나는 세 여자아이 중에서 가장 짧은 머리를 가졌다.",
 "본책 p.130 최상급 비교(POINT 3)의 ‘the + 최상급 + of + 비교 대상이 되는 명사’ 표를 펴세요.","1) ‘가장 짧은 머리’는 short(짧은)의 최상급 + hair(머리카락)예요.  2) 뒤가 the three girls(세 여자아이)처럼 비교 대상 여러 명이에요. in과 of 중 어느 것일까요?","short의 최상급 앞에 the를 붙이고, hair 뒤에 ‘~ 중에서’를 뜻하는 o로 시작하는 말까지 네 단어예요.","비교 대상이 복수 → of the three girls");

[["China is (three / three times) as large as India.","three times","China is three times as large as India.","중국은 인도보다 세 배 더 크다.","본책 p.132 POINT 1 ‘배수사 + as + 원급 + as’ 박스를 펴세요.","1) as large as(~만큼 큰) 앞에 ‘몇 배’라는 말이 필요해요.  2) 배수사는 ‘세 배’처럼 배를 나타내는 말이에요. 숫자만 쓰면 될까요, ‘번·배’ 뜻이 들어가야 할까요?","three 혼자서는 ‘3’일 뿐이에요. ‘세 배’가 되는 두 단어짜리 보기예요.","배수사 + as + 원급 + as → three times as large as"],
 ["The colder it becomes, the (easier / easiest) it is for you to catch a cold.","easier","The colder it becomes, the easier it is for you to catch a cold.","추워질수록 감기에 걸리기가 더 쉬워진다.","본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) 앞 절이 The colder it becomes(더 추워질수록)로 시작해요.  2) 쉼표 뒤에도 같은 모양 the + 비교급이 와야 해요.","최상급(-est)이 아니라 비교급(-er)이에요. easy(쉬운)에서 y가 바뀐 쪽이에요.","the + 비교급 ~, the + 비교급 … (~할수록 더 …)"],
 ["The plane was flying (high and high / higher and higher).","higher and higher","The plane was flying higher and higher.","그 비행기는 점점 더 높이 날고 있었다.","본책 p.132 POINT 2 ‘비교급 + and + 비교급’ 박스를 펴세요.","1) ‘점점 더 높이’라는 뜻이에요.  2) ‘점점 더’는 같은 말을 두 번 쓰는데, 어떤 모양을 두 번 쓸까요?","원급(high)이 아니라 비교급(-er) 모양을 and로 이어요.","점점 더 ~ → 비교급 and 비교급"],

W(2,"B",1,"Nikki’s shoes are five times as expensive as my shoes.<br>Nikki’s shoes are ___ my shoes.","five times more expensive than","Nikki’s shoes are five times more expensive than my shoes.","Nikki의 신발은 내 신발보다 다섯 배 더 비싸다.",
 "본책 p.132 POINT 1 ‘배수사 + as + 원급 + as = 배수사 + 비교급 + than’ 박스를 펴세요.","1) 윗문장은 「배수사 + as + 원급 + as」 모양이에요.  2) 같은 뜻으로 「배수사 + 비교급 + than」으로 바꿔 써요.  3) expensive(비싼)는 긴 형용사라 more를 써요.","five times 다음에 m로 시작하는 말 + expensive + than이에요.","배수사 + 비교급 + than 으로 바꿔 쓰기");
W(2,"B",2,"This new machine is three times as fast as the old one.<br>This new machine is ___ the old one.","three times faster than","This new machine is three times faster than the old one.","이 새 기계는 낡은 것보다 세 배 더 빠르다.",
 "본책 p.132 POINT 1 ‘배수사 + 비교급 + than’ 예문(My bag is two times bigger than yours)을 펴세요.","1) as fast as(~만큼 빠른)를 비교급으로 바꾸는 문제예요.  2) fast(빠른)는 짧은 단어예요. 짧은 단어는 -er을 붙여요.","three times + fast에 -er을 붙인 말 + than이에요.","배수사 + 비교급(짧은 단어는 -er) + than");
W(2,"B",3,"One hundred is twice as large as fifty.<br>One hundred is ___ fifty.","two times larger than","One hundred is two times larger than fifty.","100은 50보다 두 배 더 크다.",
 "본책 p.132 POINT 1 박스 옆의 ‘twice (X)’ 설명을 펴세요.","1) twice(두 배)는 「배수사 + as + 원급 + as」 모양에서만 쓸 수 있어요.  2) 「배수사 + 비교급 + than」에서는 twice 대신 같은 뜻의 두 단어를 써요.","two로 시작하는 두 단어 + larger + than이에요.","twice는 as~as에서만 → 비교급에서는 two times");

W(2,"C",1,"그의 강의는 점점 더 지루해졌다.<br>His lecture became ___.","more and more boring","His lecture became more and more boring.","그의 강의는 점점 더 지루해졌다.",
 "본책 p.132 POINT 2 아래 ‘more + 원급’ 박스(more and more + 원급)를 펴세요.","1) ‘점점 더 지루한’이니까 보기 중 boring(지루한)을 골라요.  2) boring은 긴 형용사라서 -er을 붙이지 않고 more를 써요.","boring은 한 번만 쓰고, 그 앞에 m으로 시작하는 말을 and로 두 번 이어요. 네 단어예요.","more + 원급 형태 → more and more + 원급",["clean","boring","fast"]);
W(2,"C",2,"그녀는 점점 더 빠르게 먹기 시작했다.<br>She started to eat ___.","faster and faster","She started to eat faster and faster.","그녀는 점점 더 빠르게 먹기 시작했다.",
 "본책 p.132 POINT 2 ‘비교급 + and + 비교급’ 박스를 펴세요.","1) ‘점점 더 빠르게’이니까 보기 중 fast(빠르게)를 골라요.  2) fast는 짧은 단어예요. 짧은 단어는 -er을 붙인 모양을 and로 이어요.","fast에 -er을 붙여 같은 말을 두 번 써요. 세 단어예요.","짧은 단어 → 비교급 and 비교급",["clean","boring","fast"]);
W(2,"C",3,"내가 더 높이 올라갈수록 공기가 더 깨끗해졌다.<br>The higher up I went, ___ the air became.","the cleaner","The higher up I went, the cleaner the air became.","내가 더 높이 올라갈수록 공기가 더 깨끗해졌다.",
 "본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) 앞 절이 The higher up I went(더 높이 올라갈수록)예요.  2) 쉼표 뒤에도 the + 비교급이 와요.  3) 보기 중 ‘깨끗한’은 clean이에요.","the 뒤에 clean에 -er을 붙인 말이에요. 두 단어예요.","the + 비교급 ~, the + 비교급 …",["clean","boring","fast"]);

W(2,"D",1,"맘마미아는 세계에서 가장 유명한 뮤지컬들 중 하나이다. (popular, musical)<br>Mamma Mia is ___ in the world.","one of the most popular musicals","Mamma Mia is one of the most popular musicals in the world.","맘마미아는 세계에서 가장 유명한 뮤지컬들 중 하나이다.",
 "본책 p.132 POINT 4 ‘one of the + 최상급 + 복수 명사’ 박스를 펴세요.","1) ‘~들 중 하나’는 one of the로 시작해요.  2) popular(인기 있는)는 긴 형용사라 최상급에 most를 붙여요.  3) 명사 musical(뮤지컬)은 여러 개 중 하나라서 복수로 써요.","one of the로 시작해요. popular 앞에 붙는 말과 musical의 끝 모양(복수)을 꼭 챙겨요. 여섯 단어예요.","one of the + most 원급 + 복수 명사");
W(2,"D",2,"Mr. Wilson은 이 대학에서 가장 훌륭한 교수들 중 한 명이다. (good, professor)<br>Mr. Wilson is ___ at this university.","one of the best professors","Mr. Wilson is one of the best professors at this university.","Mr. Wilson은 이 대학에서 가장 훌륭한 교수들 중 한 명이다.",
 "본책 p.132 POINT 4 박스와 p.130 맨 아래 불규칙 변화 표의 good(좋은) 줄을 펴세요.","1) ‘~들 중 한 명’은 one of the + 최상급 + 복수 명사예요.  2) good(좋은, 훌륭한)은 -est를 붙이지 않는 불규칙 단어예요.  3) professor(교수)는 복수로 써요.","one of the 뒤에 good의 최상급(b로 시작하는 네 글자), 마지막은 professor의 복수형이에요.","good의 최상급은 best → one of the best + 복수");
W(2,"D",3,"그녀는 이 학교에서 가장 똑똑한 학생들 중 한 명이다. (smart, student)<br>She is ___ at this school.","one of the smartest students","She is one of the smartest students at this school.","그녀는 이 학교에서 가장 똑똑한 학생들 중 한 명이다.",
 "본책 p.132 POINT 4 ‘one of the + 최상급 + 복수 명사’ 박스를 펴세요.","1) ‘~들 중 한 명’은 one of the로 시작해요.  2) smart(똑똑한)는 짧은 단어예요. 짧은 단어의 최상급은 뒤에 -est를 붙여요.  3) student(학생)도 복수로 써요.","one of the 뒤에 smart의 최상급, 마지막은 student의 복수형이에요. 다섯 단어예요.","짧은 단어 → one of the + -est + 복수 명사");
W(2,"D",4,"이것은 이 레스토랑에서 가장 맛있는 요리들 중 하나이다. (delicious, dish)<br>This is ___ at this restaurant.","one of the most delicious dishes","This is one of the most delicious dishes at this restaurant.","이것은 이 레스토랑에서 가장 맛있는 요리들 중 하나이다.",
 "본책 p.132 POINT 4 박스의 예문(one of the most beautiful parks)을 펴세요.","1) ‘~들 중 하나’는 one of the + 최상급 + 복수 명사예요.  2) delicious(맛있는)는 긴 형용사라 most를 붙여요.  3) dish(요리)는 -sh로 끝나요. 복수는 어떻게 만들까요?","one of the most delicious 뒤에 dish(요리)의 복수형을 써요. dish는 s만 붙이지 않아요.","-sh로 끝나는 명사 복수는 -es → dishes");

W("SW","A",1,"Jerry is <u>youngest</u> of all my siblings.","the youngest","Jerry is the youngest of all my siblings.","Jerry는 내 모든 형제자매 중에서 가장 어리다.",
 "본책 p.130 최상급 비교(POINT 3)의 ‘the + 최상급 + of’ 표를 펴세요.","1) of all my siblings(내 모든 형제자매 중에서)가 뒤에 있어요. 최상급 문장이에요.  2) 최상급 앞에 꼭 있어야 하는 말이 빠졌는지 봐요.","youngest 앞에 t로 시작하는 세 글자 단어를 붙여요.","최상급 앞에는 항상 the");
W("SW","A",2,"The pain got <u>bad and bad</u>.","worse and worse","The pain got worse and worse.","통증이 점점 더 심해졌다.",
 "본책 p.132 POINT 2 ‘비교급 + and + 비교급’ 박스와 p.130 불규칙 표를 펴세요.","1) ‘점점 더 아파졌다’는 뜻이에요.  2) 원급(bad) 두 번이 아니라 비교급 두 번을 이어야 해요.  3) bad(나쁜)의 비교급은 불규칙이에요.","w로 시작하는 다섯 글자 비교급을 and로 두 번 이어요.","점점 더 ~ → 비교급 and 비교급 (bad → worse)");
W("SW","A",3,"Watching TV is more boring than <u>play soccer</u>.","playing soccer","Watching TV is more boring than playing soccer.","TV를 보는 것은 축구를 하는 것보다 더 지루하다.",
 "본책 p.130 비교급 비교(POINT 2)의 ‘비교가 되는 두 대상은 같은 종류와 형태’ 박스를 펴세요.","1) 앞에 Watching TV(TV를 보는 것)가 -ing 모양이에요.  2) than 뒤에도 같은 형태가 와야 해요.","play 뒤에 -ing를 붙여요. 그 뒤 soccer는 그대로예요.","than 앞뒤는 같은 형태 → Watching … than playing");
W("SW","A",4,"That chair is not <u>as more comfortable as</u> this sofa.","as comfortable as","That chair is not as comfortable as this sofa.","저 의자는 이 소파만큼 편안하지 않다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘not + as + 원급 + as’ 표를 펴세요.","1) not as ~ as(~만큼 …하지 않은)의 모양이에요.  2) 이 안에 more(더)가 들어갈 수 있을까요?","as와 as 사이에는 원급만 와요. 밑줄 안에서 필요 없는 한 단어를 찾아 지워요.","as + 원급 + as 사이에 more는 안 들어감");
W("SW","A",5,"This is one of the most <u>effective way</u> to solve the problem.","effective ways","This is one of the most effective ways to solve the problem.","이것은 그 문제를 푸는 가장 효과적인 방법들 중 하나이다.",
 "본책 p.132 POINT 4 아래 ‘항상 복수 명사와 함께 써야 한다’ 박스를 펴세요.","1) one of the most(가장 ~한 것들 중 하나) 뒤의 명사를 봐요.  2) ‘~들 중 하나’이니까 뒤 명사는 단수일까요, 복수일까요?","way(방법) 끝에 s를 붙여요.","one of the most effective way (X) → ways");
W("SW","A",6,"Dan has worked <u>very longer</u> than Helen at the clothes store.","much[even, far, a lot] longer","Dan has worked much longer than Helen at the clothes store.","Dan은 그 옷 가게에서 Helen보다 훨씬 더 오래 일해 왔다.",
 "본책 p.130 비교급 비교(POINT 2)의 ‘very는 비교급을 강조할 수 없다’ 박스를 펴세요.","1) longer than(~보다 더 오래)은 비교급이에요.  2) very(매우)는 원급만 꾸며요. 비교급을 꾸밀 수 있는 말은 박스에서 찾아봐요.","very 대신 비교급 강조 말을 써요. m으로 시작하는 네 글자 말이 대표적이에요(박스의 even, far, a lot도 정답).","very longer (X) → much[even, far, a lot] longer");
W("SW","A",7,"Mark is sixteen times heavier <u>as</u> his son.","than","Mark is sixteen times heavier than his son.","Mark는 그의 아들보다 열여섯 배 더 무겁다.",
 "본책 p.132 POINT 1 예문 중 My bag is two times bigger …(내 가방은 … 두 배 더 크다) 줄을 펴세요.","1) 앞에 sixteen times heavier(열여섯 배 더 무거운)처럼 비교급(-er)이 있어요.  2) 비교급 뒤에는 어떤 연결 말이 올까요?","t로 시작하는 네 글자 단어예요.","배수사 + 비교급 + than");
W("SW","A",8,"The more we have, <u>more</u> we want.","the more","The more we have, the more we want.","우리는 더 많이 가질수록 더 많이 원한다.",
 "본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) 앞 절이 The more we have(더 많이 가질수록)로 시작해요.  2) 뒤 절도 같은 모양이어야 해요.","more 앞에 t로 시작하는 세 글자 단어를 붙여요.","the + 비교급 ~, the + 비교급 … (뒤에도 the)");
W("SW","A",9,"This content creator is becoming <u>more famous and more famous</u>.","more and more famous","This content creator is becoming more and more famous.","이 콘텐츠 제작자는 점점 더 유명해지고 있다.",
 "본책 p.132 POINT 2 아래 ‘more and more + 원급’ 박스를 펴세요.","1) ‘점점 더 유명한’이라는 뜻이에요.  2) famous(유명한)는 긴 형용사라서 more를 써요. 이때 more를 두 번 쓰고 famous는 몇 번 쓸까요?","famous는 맨 끝에 한 번만 쓰고, 그 앞에 m으로 시작하는 말을 and로 두 번 이어요.","more + 원급 → more and more + 원급");
W("SW","A",10,"Rocks are <u>as not hard as</u> diamonds.","not as hard as","Rocks are not as hard as diamonds.","바위는 다이아몬드만큼 단단하지 않다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘not + as + 원급 + as’ 표를 펴세요.","1) 부정은 not이 as보다 앞에 와요.  2) 순서를 not, as, 원급, as로 맞춰요.","밑줄 친 as not의 순서만 바꿔요. n으로 시작하는 단어가 맨 앞이에요.","부정 → not as + 원급 + as");

W("SW","B",1,"네 방은 내 방보다 더 크다. (room / bigger / mine / than / your / is)","Your room is bigger than mine","Your room is bigger than mine.","네 방은 내 방보다 더 크다.",
 "본책 p.130 비교급 비교(POINT 2)의 ‘비교급 + than’ 표와 ‘소유대명사’ 박스를 펴세요.","1) 주어는 ‘네 방’(your room)이에요.  2) 비교급 bigger(더 큰) 뒤에 than을 붙이고, 마지막에 ‘내 것’을 한 단어(mine)로 써요.","주어 Your room 다음에 동사를 놓고, 마지막 단어는 ‘내 것’이에요.","주어 + be + 비교급 + than + 소유대명사",["room","bigger","mine","than","your","is"]);
W("SW","B",2,"비행기로 여행하는 것은 기차로 여행하는 것보다 훨씬 비싸다. (than / more / traveling / far / expensive)<br>Traveling by plane is ___ by train.","far more expensive than traveling","Traveling by plane is far more expensive than traveling by train.","비행기로 여행하는 것은 기차로 여행하는 것보다 훨씬 더 비싸다.",
 "본책 p.130 비교급 비교(POINT 2) ‘비교급 + than’과 ‘비교급 강조’ 박스를 펴세요.","1) 비교급 more expensive(더 비싼) 앞에 ‘훨씬’을 뜻하는 강조 말이 와요.  2) than 뒤에는 앞(Traveling)과 같은 -ing 모양이 와요.","강조 말 far가 맨 앞이고, 맨 끝은 by train 앞에 올 -ing 단어예요.","far + 비교급 + than + 같은 형태",["than","more","traveling","far","expensive"]);
W("SW","B",3,"기린은 모든 육지 동물들 중에서 가장 키가 크다. (the / of / tallest / all / animals / land)<br>The giraffe is ___.","the tallest of all land animals","The giraffe is the tallest of all land animals.","기린은 모든 육지 동물들 중에서 가장 키가 크다.",
 "본책 p.130 최상급 비교(POINT 3)의 ‘the + 최상급 + of + 비교 대상’ 표를 펴세요.","1) 먼저 the tallest(가장 키가 큰)를 만들어요.  2) 비교 대상 ‘모든 육지 동물들’ 앞에 of를 써요.  3) land animals(육지 동물들)는 ‘land + 명사’ 순서예요.","the tallest로 시작하고, ‘모든’을 뜻하는 all은 of 바로 뒤에 와요.","the + 최상급 + of + all + 복수 명사",["the","of","tallest","all","animals","land"]);
W("SW","B",4,"그녀의 운전 실력은 점점 더 나아져 왔다. (better / have / and / better / gotten)<br>Her driving skills ___.","have gotten better and better","Her driving skills have gotten better and better.","그녀의 운전 실력은 점점 더 나아져 왔다.",
 "본책 p.132 POINT 2 ‘비교급 + and + 비교급’ 박스를 펴세요.","1) 주어 Her driving skills(그녀의 운전 실력)는 복수예요. 그래서 have를 써요.  2) ‘나아져 왔다’는 have gotten(원형 get: 되다)이에요.  3) 뒤에 비교급 and 비교급을 붙여요.","주어 바로 뒤에 have가 오고, 맨 끝 세 단어는 ‘점점 더 나은’이에요.","have + p.p. + 비교급 and 비교급",["better","have","and","better","gotten"]);
W("SW","B",5,"나이아가라 폭포는 세계에서 가장 아름다운 장소들 중 한 곳이다. (the / beautiful / of / most / one / places)<br>Niagara Falls is ___ in the world.","one of the most beautiful places","Niagara Falls is one of the most beautiful places in the world.","나이아가라 폭포는 세계에서 가장 아름다운 장소들 중 한 곳이다.",
 "본책 p.132 POINT 4 ‘one of the + 최상급 + 복수 명사’ 박스를 펴세요.","1) ‘~들 중 하나’는 one of the로 시작해요.  2) beautiful(아름다운)은 긴 형용사라 most를 앞에 붙여요.  3) 마지막은 복수 명사 places(장소들)예요.","one of the로 시작하고, 맨 끝은 복수 명사 places예요. 그 사이 두 단어 순서를 생각해요.","one / of / the / most beautiful / places 순서",["the","beautiful","of","most","one","places"]);
W("SW","B",6,"많은 유기농 식품들은 무기농 식품들보다 두 배 더 비싸다. (twice / as / ones / as / nonorganic / expensive)<br>Many organic foods are ___.","twice as expensive as nonorganic ones","Many organic foods are twice as expensive as nonorganic ones.","많은 유기농 식품들은 무기농 식품들보다 두 배 더 비싸다.",
 "본책 p.132 POINT 1 ‘배수사 + as + 원급 + as’ 박스와 ‘twice’ 설명을 펴세요.","1) ‘두 배’는 twice예요. twice는 「twice + as + 원급 + as」 모양으로만 써요.  2) 원급은 expensive(비싼)이에요.  3) 비교 대상 nonorganic ones(무기농 식품들)는 맨 뒤예요.","twice로 시작해요. as는 두 번 쓰고, 맨 끝 두 단어가 비교 대상이에요.","twice + as + 원급 + as",["twice","as","ones","as","nonorganic","expensive"]);
W("SW","B",7,"네가 더 많이 운동할수록 너의 근육은 더 강해질 것이다. (your / muscles / the / will / stronger / be)<br>The more you exercise, ___.","the stronger your muscles will be","The more you exercise, the stronger your muscles will be.","네가 더 많이 운동할수록 너의 근육은 더 강해질 것이다.",
 "본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) 앞 절이 The more you exercise(더 많이 운동할수록)예요. 뒤 절도 the + 비교급으로 시작해요.  2) 그 다음은 「주어 + 동사」 순서예요. 주어는 ‘너의 근육’, 동사는 ‘~일 것이다’예요.","the + 비교급으로 시작하고, 맨 끝 두 단어가 동사예요.","the + 비교급 + 주어 + 동사",["your","muscles","the","will","stronger","be"]);
// ===== 서술형 대비 C (p.135 표) =====
const TB="(표: 과일 가게 과일들의 평균 정보. 1개 평균 무게 - 딸기 30 g, 사과 200 g, 바나나 170 g, 수박 5,000 g / 평균 당도 - 딸기 10 Brix, 사과 13 Brix, 바나나 26 Brix, 수박 13 Brix. Brix는 당도 단위로 숫자가 높을수록 달다.)<br>";
W("SW","C",1,TB+"Apples are ___ watermelons. (sweet)","as sweet as","Apples are as sweet as watermelons.","사과는 수박만큼 달다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘as + 원급 + as’ 표를 펴세요.","1) 표에서 사과의 당도와 수박의 당도를 찾아봐요.  2) 두 숫자가 같으면 어떤 비교 구문을 쓸까요?","사과 13, 수박 13으로 같아요. 세 단어이고 가운데에 주어진 단어가 와요.","당도 13 = 13 → as sweet as (같으면 as ~ as)");
W("SW","C",2,TB+"Watermelons are ___ the rest of the fruits. (a lot, heavy)","a lot heavier than","Watermelons are a lot heavier than the rest of the fruits.","수박은 나머지 과일들보다 훨씬 더 무겁다.",
 "본책 p.130 비교급 비교(POINT 2)의 ‘비교급 + than’과 ‘비교급 강조’ 박스를 펴세요.","1) 표에서 수박(5,000 g)과 나머지 과일들의 무게를 비교해요.  2) ‘훨씬 더 무거운’이니까 a lot + 비교급 + than이에요.  3) heavy(무거운)는 y를 i로 바꾸고 -er을 붙여요.","a lot 다음에 heavy가 바뀐 h로 시작하는 비교급과 than이에요.","a lot + 비교급 + than (heavy → heavier)");
W("SW","C",3,TB+"Bananas are ___ apples. (light)","lighter than","Bananas are lighter than apples.","바나나는 사과보다 더 가볍다.",
 "본책 p.130 비교급 비교(POINT 2)의 ‘비교급 + than’ 표를 펴세요.","1) 표에서 바나나(170 g)와 사과(200 g)의 무게를 비교해요.  2) 누가 더 가벼운지 보고 light(가벼운)를 비교급으로 바꿔요.","light 뒤에 -er을 붙이고 than을 써요. 두 단어예요.","짧은 형용사 → -er + than");
W("SW","C",4,TB+"Strawberries are ___ watermelons. (much, light)","much lighter than","Strawberries are much lighter than watermelons.","딸기는 수박보다 훨씬 더 가볍다.",
 "본책 p.130 비교급 비교(POINT 2)의 ‘비교급 강조’ 박스를 펴세요.","1) 표에서 딸기(30 g)와 수박(5,000 g)의 무게를 비교해요. 차이가 아주 커요.  2) ‘훨씬 더 가벼운’이니까 강조 말 + 비교급 + than이에요.","much로 시작하는 세 단어예요. 가운데 단어는 light의 비교급이에요.","much + 비교급 + than");
W("SW","C",5,TB+"Bananas are ___ of all the fruits in the store. (sweet)","the sweetest","Bananas are the sweetest of all the fruits in the store.","바나나는 가게의 모든 과일 중에서 가장 달다.",
 "본책 p.130 최상급 비교(POINT 3)의 ‘the + 최상급 + of’ 표를 펴세요.","1) 표에서 당도가 가장 높은 과일을 찾아요. 바나나가 26 Brix예요.  2) 뒤에 of all the fruits(모든 과일 중에서)가 있어요. 최상급을 써요.","the + sweet에 -est를 붙인 말, 두 단어예요.","모든 ~ 중에서 가장 → the + 최상급 + of");
// ===== 서술형 대비 D (p.135 글) =====
const TD="(글: 나는 엄마에 대해 이야기하려고 한다. ①___, 하지만 엄마는 여전히 젊고 아름다워 보인다. ②___. 요리할 때 엄마는 세상에서 가장 멋진 사람이다. 그래서 나도 엄마처럼 요리사가 되고 싶다. 나는 그 목표를 이루려고 요리하는 법을 배우고 있다. ③___, 나의 요리 실력은 더 좋아질 것이다. ④___. 들어 줘서 고마워!)<br>";
W("SW","D",1,TD+"① 그녀는 나보다 세 배 더 나이가 많다 (old, than)<br>___, but she still looks young and beautiful.","She is three times older than me[I am]","She is three times older than me[I am].","그녀는 나보다 세 배 더 나이가 많다.",
 "본책 p.132 POINT 1 ‘배수사 + 비교급 + than’ 예문을 펴세요.","1) ‘세 배 더 나이가 많은’은 배수사 + 비교급 + than이에요.  2) old(나이 든)는 짧은 단어라 -er을 붙여요.  3) than 뒤의 ‘나’는 me도 되고 I am도 돼요.","She is로 시작해요. 배수사 three times 뒤에 old의 비교급, 마지막은 than + ‘나’예요.","세 배 더 나이 많은 → three times older than");
W("SW","D",2,TD+"② 그녀는 한국에서 가장 유명한 요리사들 중 한 명이다 (famous, chef, Korea)<br>___. She is the coolest person in the world when she is cooking.","She is one of the most famous chefs in Korea","She is one of the most famous chefs in Korea.","그녀는 한국에서 가장 유명한 요리사들 중 한 명이다.",
 "본책 p.132 POINT 4 ‘one of the + 최상급 + 복수 명사’ 박스를 펴세요.","1) ‘~들 중 한 명’은 one of the + 최상급 + 복수 명사예요.  2) famous(유명한)는 긴 형용사라 most를 붙여요.  3) 마지막에 장소 in Korea(한국에서)를 써요.","She is one of the로 시작해요. chef는 여러 명 중 하나라 복수형, 끝은 장소 in Korea예요.","one of the + most + 원급 + 복수 명사");
W("SW","D",3,TD+"③ 내가 더 많이 연습할수록 (much, practice)<br>___, the better my cooking skills will be.","The more I practice","The more I practice, the better my cooking skills will be.","내가 더 많이 연습할수록 나의 요리 실력은 더 좋아질 것이다.",
 "본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) 뒤 절이 the better ~로 시작해요. 앞 절도 the + 비교급이에요.  2) much(많이)의 비교급은 불규칙이에요.  3) 그 뒤에 주어 I와 동사 practice(연습하다)를 놓아요.","The 뒤에 much의 비교급(m으로 시작), 그 다음 주어와 동사예요. 네 단어예요.","much(많이)의 비교급 more → The more I practice");
W("SW","D",4,TD+"④ 나는 가장 유명한 요리사가 되고 싶다 (want, be, famous, chef)<br>___ in the world someday.","I want to be the most famous chef","I want to be the most famous chef in the world someday.","나는 언젠가 세계에서 가장 유명한 요리사가 되고 싶다.",
 "본책 p.130 최상급 비교(POINT 3)의 ‘the + 최상급 + 명사 + in’ 표를 펴세요.","1) ‘~하고 싶다’는 want(원하다) + to부정사예요.  2) ‘가장 유명한 요리사’는 the + most + famous + chef예요. 한 명이라서 chef는 단수예요.","I want to be로 시작해요. 그 뒤에 famous의 최상급 + chef, 모두 여덟 단어예요.","want to be + the + 최상급 + 명사");
// ===== 내신 대비 실전문제 (pp.136-139) =====
C("NS","N",1,"빈칸에 들어갈 알맞은 말을 고르시오.<br>My sister is as ___ as Mina.",["① older","② oldest","③ young","④ younger","⑤ youngest"],"③ young","My sister is as young as Mina.","내 여동생은 Mina만큼 어리다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘as + 원급 + as’ 표를 펴세요.","1) as와 as 사이의 빈칸이에요.  2) 이 자리에는 -er, -est가 붙은 말이 올 수 있을까요?","보기 중 -er도 -est도 안 붙은 원래 모양을 찾아요. 세 번째예요.","as ~ as 사이는 원급");
C("NS","N",2,"빈칸에 들어갈 알맞은 말을 고르시오.<br>The Burj Khalifa in Dubai is the ___ building in the world.",["① tall","② taller","③ tallest","④ more tall","⑤ most tall"],"③ tallest","The Burj Khalifa in Dubai is the tallest building in the world.","두바이의 부르즈 할리파는 세계에서 가장 높은 건물이다.",
 "본책 p.130 최상급 비교(POINT 3)의 ‘the + 최상급 + 명사 + in’ 표를 펴세요.","1) 빈칸 앞에 the, 뒤에 in the world(세계에서)가 있어요.  2) tall(높은)은 짧은 단어예요. 짧은 단어의 최상급은 어떻게 만들까요?","끝에 -est가 붙은 보기예요. more, most는 짧은 단어에는 안 써요.","the + 최상급 + in + 장소");
C("NS","N",3,"빈칸에 들어갈 알맞은 말을 고르시오.<br>Monica dances ___ than Olivia.",["① best","② good","③ well","④ better","⑤ as good as"],"④ better","Monica dances better than Olivia.","Monica는 Olivia보다 춤을 더 잘 춘다.",
 "본책 p.130 맨 아래 ‘불규칙 변화 형태의 비교급과 최상급’ 표의 good / well 줄을 펴세요.","1) 뒤에 than(~보다)이 있으니 비교급이에요.  2) dances(춤추다)를 꾸미는 말이라서 well(잘)의 비교급이 필요해요.","표에서 well - b로 시작하는 두 번째 단어(-er 모양이 아닌 불규칙)를 찾아요. 네 번째 보기예요.","well(잘) - better - best");
C("NS","N",4,"빈칸에 들어갈 말로 알맞지 않은 것을 고르시오.<br>Math is ___ harder than English for me.",["① much","② a lot","③ even","④ very","⑤ far"],"④ very","Math is much harder than English for me.","나에게 수학은 영어보다 훨씬 더 어렵다.",
 "본책 p.130 비교급 비교(POINT 2)의 ‘비교급 강조’ 박스를 펴세요.","1) harder than(~보다 더 어려운)은 비교급이에요.  2) 비교급을 꾸미는 말과 그럴 수 없는 말을 가려요.","박스의 ‘very는 비교급을 강조할 수 없다’를 기억해요. 네 번째 보기예요.","빈칸에 못 오는 말: very (비교급 harder 앞은 불가)");
C("NS","N",5,"빈칸에 들어갈 말로 알맞지 않은 것을 고르시오.<br>This book is two times ___ than that book.",["① thinner","② thicker","③ more popular","④ cheaper","⑤ expensive"],"⑤ expensive","This book is two times more popular than that book.","이 책은 저 책보다 두 배 더 인기 있다.",
 "본책 p.132 POINT 1 ‘배수사 + 비교급 + than’ 박스를 펴세요.","1) two times(두 배)와 than(~보다) 사이에는 비교급이 들어가요.  2) 각 보기가 비교급 모양인지 하나씩 살펴요.","thinner(더 얇은), thicker(더 두꺼운), more popular(더 인기 있는), cheaper(더 싼)는 비교급이에요. 원급 모양인 보기를 찾아요.","배수사 + 비교급 + than (원급은 안 됨)");
M("NS","N",6,"주어진 문장과 의미가 같은 것을 모두 고르시오.<br>Nicky is not as weak as Emily.",["① Nicky is as weak as Emily.","② Nicky is weaker than Emily.","③ Nicky is stronger than Emily.","④ Emily is weaker than Nicky.","⑤ Emily is stronger than Nicky."],["③ Nicky is stronger than Emily.","④ Emily is weaker than Nicky."],"Nicky is stronger than Emily. / Emily is weaker than Nicky.","Nicky는 Emily보다 더 강하다. / Emily는 Nicky보다 더 약하다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘not + as + 원급 + as’ 표를 펴세요.","1) not as weak as는 ‘~만큼 약하지 않다’예요.  2) 그러면 Nicky가 더 약할까요, Emily가 더 약할까요?  3) 보기를 하나씩 읽고 같은 뜻인지 확인해요.","Emily가 더 약하다고 말하는 보기가 있고, Nicky가 더 강하다고 말하는 보기가 있어요. 두 개를 골라요.","not as ~ as = 상대가 더 ~하다");
M("NS","N",7,"빈칸에 들어갈 말로 알맞은 것을 모두 고르시오.<br>This is one of the most beautiful ___ in Korea.",["① parks","② glass","③ campus","④ palaces","⑤ buildings"],["① parks","④ palaces","⑤ buildings"],"This is one of the most beautiful parks[palaces, buildings] in Korea.","이곳은 한국에서 가장 아름다운 공원[궁궐, 건물]들 중 하나이다.",
 "본책 p.132 POINT 4 ‘one of the + 최상급 + 복수 명사’ 박스를 펴세요.","1) one of the most beautiful(가장 아름다운 ~들 중 하나) 뒤의 명사 모양이 중요해요.  2) 복수 명사만 올 수 있어요.  3) 각 보기가 진짜 복수형인지 살펴요.","glass(유리)와 campus(캠퍼스)는 단수 명사예요. 나머지 세 개가 정답이에요.","glass(유리), campus(캠퍼스)는 단수라 탈락");
C("NS","N",8,"어법상 옳지 않은 것을 고르시오.<br>① This sofa is softer than our sofa.<br>② Gloria is a lot taller than Nora.<br>③ Francis is not as fast as his brother.<br>④ Andy eats the least in the three people.<br>⑤ The lectures are becoming longer and longer.",["① This sofa is softer than our sofa.","② Gloria is a lot taller than Nora.","③ Francis is not as fast as his brother.","④ Andy eats the least in the three people.","⑤ The lectures are becoming longer and longer."],"④ Andy eats the least in the three people.","Andy eats the least of the three people.","Andy는 세 사람 중에서 가장 적게 먹는다.",
 "본책 p.130 최상급 비교(POINT 3)의 ‘in + 장소·범위를 나타내는 단수 명사’와 ‘of + 비교 대상이 되는 명사’ 표를 펴세요.","1) 각 보기가 원급·비교급·최상급 중 어떤 문장인지 먼저 구분해요.  2) 최상급 문장은 뒤에 in과 of 중 무엇이 오는지 살펴요.","the three people(세 사람)은 장소·범위가 아니라 비교 대상이에요. 네 번째 보기예요.","비교 대상(복수) → of / 장소·범위 → in");
C("NS","N",9,"어법상 옳지 않은 것을 고르시오.<br>① Jacey is as quiet as Cindy.<br>② Your hat looks prettier than mine.<br>③ Henry’s room is the dirtiest in our house.<br>④ This restaurant is larger than the café next to it.<br>⑤ The smartphone is one of the greatest invention in the world.",["① Jacey is as quiet as Cindy.","② Your hat looks prettier than mine.","③ Henry’s room is the dirtiest in our house.","④ This restaurant is larger than the café next to it.","⑤ The smartphone is one of the greatest invention in the world."],"⑤ The smartphone is one of the greatest invention in the world.","The smartphone is one of the greatest inventions in the world.","스마트폰은 세계에서 가장 위대한 발명품들 중 하나이다.",
 "본책 p.132 POINT 4 아래 ‘항상 복수 명사와 함께 써야 한다’ 박스를 펴세요.","1) 보기마다 비교하는 모양(as ~ as, 비교급 + than, the + 최상급)이 맞는지 봐요.  2) ‘~들 중 하나’ 표현이 있는 보기는 뒤 명사 모양을 확인해요.","one of the greatest 뒤의 invention(발명품)이 단수로 되어 있어요. 다섯 번째 보기예요.","one of the greatest invention (X) → inventions");
C("NS","N",10,"우리말을 영어로 바르게 옮긴 것은?<br>그녀는 나이가 들면 들수록 더 지혜로워졌다.",["① Older she got, wiser she became.","② The old she got, the wise she became.","③ The older she got, the wiser she became.","④ The oldest she got, the wisest she became.","⑤ More and more older she got, more and more wiser she became."],"③ The older she got, the wiser she became.","The older she got, the wiser she became.","그녀는 나이가 들면 들수록 더 지혜로워졌다.",
 "본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) ‘~하면 할수록 더 …하다’의 뜻이에요.  2) 두 절 모두 the + 비교급으로 시작해요.  3) 비교급 모양(-er)인지, the가 있는지 보기를 하나씩 확인해요.","the가 앞뒤에 모두 있고 old와 wise가 둘 다 -er 모양인 보기예요. 세 번째예요.","~할수록 더 …: 두 절 모두 맨 앞에 the + -er");
C("NS","N",11,"빈칸에 들어갈 말이 순서대로 짝지어진 것을 고르시오.<br>His mood was getting ___ and ___.",["① bad — bad","② worse — worse","③ worst — worst","④ badder — badder","⑤ baddest — baddest"],"② worse — worse","His mood was getting worse and worse.","그의 기분은 점점 더 나빠지고 있었다.",
 "본책 p.132 POINT 2 ‘비교급 + and + 비교급’ 박스와 p.130 불규칙 표를 펴세요.","1) getting ___ and ___는 ‘점점 더 ~해지는’ 뜻이에요.  2) 같은 비교급을 두 번 써요.  3) bad(나쁜)의 비교급은 불규칙이에요.","w로 시작하는 비교급이 두 번 나온 보기예요. 두 번째예요.","bad(나쁜)의 비교급 worse를 and로 두 번");
C("NS","N",12,"빈칸에 들어갈 말이 순서대로 짝지어진 것을 고르시오.<br>___ you arrive, ___ seats you’ll get.",["① earlier — earliest","② earliest — best","③ The early — the good","④ The earlier — the better","⑤ The earliest — the best"],"④ The earlier — the better","The earlier you arrive, the better seats you’ll get.","더 일찍 도착할수록 더 좋은 자리를 얻게 될 것이다.",
 "본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) ‘더 일찍 ~할수록 더 좋은 ~’의 뜻이에요.  2) 두 빈칸 모두 the + 비교급이에요.  3) good(좋은)의 비교급도 떠올려요.","early(일찍)와 good(좋은)이 둘 다 비교급이고 앞에 the가 있는 보기예요. 네 번째예요.","good(좋은)의 비교급 better → the better seats");
W("NS","N",13,"두 문장을 한 문장으로 연결하시오.<br>The red shoes are $40. The white shoes are $80.<br>The white shoes are ___ the red shoes. (twice, expensive)","twice as expensive as","The white shoes are twice as expensive as the red shoes.","흰 신발은 빨간 신발보다 두 배 더 비싸다.",
 "본책 p.132 POINT 1 ‘배수사 + as + 원급 + as’ 박스와 ‘twice’ 설명을 펴세요.","1) 빨간 신발 40달러, 흰 신발 80달러예요. 흰 신발이 몇 배 비싼가요?  2) 주어진 단어 twice(두 배)는 「twice + as + 원급 + as」 모양으로만 써요.","twice로 시작하는 네 단어예요. twice 뒤는 ‘~만큼’ 짝꿍 모양이고, 비교급으로 바꾸지 않아요.","twice는 as ~ as 짝꿍 (two times는 비교급과도)");
W("NS","N",14,"두 문장을 한 문장으로 연결하시오.<br>This tree is forty years old. That house is also forty years old.<br>This tree is ___ that house. (old)","as old as","This tree is as old as that house.","이 나무는 저 집만큼 오래되었다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘as + 원급 + as’ 표를 펴세요.","1) 나무도 40년, 집도 40년이에요. 나이가 같아요.  2) 같은 정도일 때 쓰는 모양을 떠올려요.","세 단어예요. old는 모양을 바꾸지 않고 가운데에 둬요.","같은 정도 → as + 원급 + as");
C("NS","N",15,"밑줄 친 부분을 잘못 고친 것은?<br>① Mike’s pimples got <u>red</u> and redder. (→ redder)<br>② Marie studies <u>very</u> harder than Jihun. (→ even)<br>③ He has three times as <u>more</u> homework as I do. (→ most)<br>④ The colder the weather gets, the <u>dry</u> the leaves become. (→ drier)<br>⑤ Leonardo da Vinci is one of the most famous <u>artist</u> in the world. (→ artists)",["① red → redder","② very → even","③ more → most","④ dry → drier","⑤ artist → artists"],"③ more → most","He has three times as much homework as I do.","그는 나보다 세 배 더 많은 숙제를 가지고 있다.",
 "본책 p.132 POINT 1 ‘배수사 + as + 원급 + as’ 박스와 p.130 불규칙 표(many / much)를 펴세요.","1) 보기마다 ‘고치기 전 → 고친 말’을 하나씩 따져요.  2) ①은 비교급 and 비교급, ②는 비교급 강조, ④는 the + 비교급, ⑤는 one of the + 복수 명사 규칙을 써요.  3) 남은 하나는 as ~ as 사이 모양이에요.","as ~ as 사이에는 원급이 와요. more(더 많은)의 원급은 much(많은)이고, most(가장 많은)는 최상급이라 틀린 고침이에요. 세 번째 보기예요.","as ~ as 사이는 원급 (as much homework as)");
C("NS","N",16,"표의 내용과 일치하지 않는 것은?<br>(표: Brian 15세 166 cm 61 kg / George 15세 170 cm 65 kg / Eric 16세 174 cm 70 kg)<br>① Brian is as old as George.<br>② Eric is not as tall as Brian.<br>③ George is taller than Brian.<br>④ Brian is younger than Eric.<br>⑤ Eric is the heaviest of the three.",["① Brian is as old as George.","② Eric is not as tall as Brian.","③ George is taller than Brian.","④ Brian is younger than Eric.","⑤ Eric is the heaviest of the three."],"② Eric is not as tall as Brian.","Eric is taller than Brian.","Eric은 Brian보다 키가 더 크다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘not as + 원급 + as’ 표와 비교급·최상급 표를 펴세요.","1) 표에서 세 사람의 나이, 키, 몸무게를 먼저 읽어요.  2) 보기를 하나씩 표와 대 보며 맞는지 확인해요.","키(Height)를 비교하는 보기부터 보세요. not as tall as는 ‘~만큼 크지 않다’는 뜻이라서 Eric이 더 작다는 말이에요.","not as tall as = 더 작다");
W("NS","N",17,"그림을 보고 보기에서 알맞은 말을 골라 빈칸에 올바른 형태로 쓰시오.<br>(그림: Taco 3달러, Hamburger 12달러, Hot Dog 10달러)<br>보기: cheap, expensive<br>The hamburger is ___ than the hot dog. The taco is ___ option.","more expensive / the cheapest","The hamburger is more expensive than the hot dog. The taco is the cheapest option.","햄버거는 핫도그보다 더 비싸다. 타코가 가장 싼 선택이다.",
 "본책 p.130 비교급 비교(POINT 2)와 최상급 비교(POINT 3) 표를 펴세요.","1) 첫 빈칸은 than(~보다)이 뒤에 있으니 비교급이에요.  2) 둘째 빈칸 앞에는 The taco is가 있고 뒤에 option이 있어요. 셋 중 가장 싼 것이니 최상급이에요.  3) 가격 12달러와 10달러, 3달러를 비교해요.","첫 빈칸은 m으로 시작해 expensive가 이어지고, 둘째 빈칸은 the + cheap에 -est를 붙여요.","긴 형용사 more ~ than / 짧은 형용사 the ~est",["cheap","expensive"]);
C("NS","N",18,"어법상 옳은 것의 개수는?<br>• This is oldest building in Seoul.<br>• Sewing is very easier than it looks.<br>• I am getting sleepier and sleepier.<br>• This movie was the least interesting of all.<br>• He exercised two times long than his wife.",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],"② 2개","I am getting sleepier and sleepier. / This movie was the least interesting of all.","나는 점점 더 졸려지고 있다. / 이 영화는 모든 영화 중에서 가장 덜 흥미로웠다.",
 "본책 p.130 최상급·비교급 표와 p.132 POINT 1, 2를 펴세요.","1) 다섯 문장을 하나씩 O, X로 따져요.  2) 첫째는 최상급 앞에 필요한 말, 둘째는 비교급 강조 말, 셋째는 비교급 and 비교급, 넷째는 the least + 원급, 다섯째는 배수사 + 비교급 + than을 확인해요.","첫째는 the가 빠졌고, 둘째는 very를 썼고, 다섯째는 long이 비교급이 아니에요. 이 셋은 틀렸어요. 나머지가 몇 개인지 세어 봐요.","최상급 앞 the / very는 비교급 강조 안 됨 / 배수사 + 비교급");
M("NS","N",19,"우리말을 영어로 잘못 옮긴 것을 모두 고르시오.<br>① 나의 강아지는 나의 앵무새보다 더 똑똑하다. → My parrot is smarter than my dog.<br>② 내 드론은 새만큼 높이 날 수 있다. → My drone can fly as higher as a bird.<br>③ Ian은 Ann보다 피아노를 훨씬 더 잘 친다. → Ian plays the piano very better than Ann.<br>④ 이 씨는 중국에서 가장 흔한 성씨들 중 하나이다. → Li is one of the most common last names in China.<br>⑤ 그녀의 새 곡은 그녀의 이전 곡보다 세 배 더 길다. → Her new song is three times longer than her previous song.",["① 나의 강아지는 나의 앵무새보다 더 똑똑하다. → My parrot is smarter than my dog.","② 내 드론은 새만큼 높이 날 수 있다. → My drone can fly as higher as a bird.","③ Ian은 Ann보다 피아노를 훨씬 더 잘 친다. → Ian plays the piano very better than Ann.","④ 이 씨는 중국에서 가장 흔한 성씨들 중 하나이다. → Li is one of the most common last names in China.","⑤ 그녀의 새 곡은 그녀의 이전 곡보다 세 배 더 길다. → Her new song is three times longer than her previous song."],["① 나의 강아지는 나의 앵무새보다 더 똑똑하다. → My parrot is smarter than my dog.","② 내 드론은 새만큼 높이 날 수 있다. → My drone can fly as higher as a bird.","③ Ian은 Ann보다 피아노를 훨씬 더 잘 친다. → Ian plays the piano very better than Ann."],"①, ②, ③이 잘못된 문장이다. (My dog is smarter than my parrot. / My drone can fly as high as a bird. / Ian plays the piano much better than Ann.)","① 내 강아지는 내 앵무새보다 더 똑똑하다. ② 내 드론은 새만큼 높이 날 수 있다. ③ Ian은 Ann보다 피아노를 훨씬 더 잘 친다.",
 "본책 p.130 원급·비교급 표, p.132 POINT 1, 4를 펴세요.","1) 영어 문장을 한국어로 다시 읽어 봐서 뜻이 같은지 확인해요.  2) ①은 누가 누구보다 더 똑똑한지 방향을 봐요.  3) ②는 as ~ as 사이 모양, ③은 비교급 강조 말을 봐요.","④와 ⑤는 규칙대로 잘 쓴 문장이에요. 나머지를 하나씩 따져서 틀린 것을 모두 골라요.","뜻의 방향 / as~as 사이는 원급 / very는 비교급 강조 안 됨");
W("NS","N",20,"우리말과 일치하도록 (  ) 안의 말을 이용하여 문장을 완성하시오.<br>네가 더 깊이 집중할수록 너는 더 빨리 너의 숙제를 끝낼 것이다. (deep, fast)<br>___ you focus, ___ you will finish your homework.","The deeper, the faster","The deeper you focus, the faster you will finish your homework.","네가 더 깊이 집중할수록 너는 더 빨리 너의 숙제를 끝낼 것이다.",
 "본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) ‘더 ~할수록 더 …하다’의 뜻이에요.  2) 두 빈칸에 the + 비교급을 차례로 써요.  3) deep(깊이)과 fast(빨리)는 둘 다 짧은 단어예요.","첫 칸은 The + deep에 -er, 둘째 칸은 the + fast에 -er을 붙여요.","deep, fast → The deeper ~, the faster ~");
W("NS","N",21,"우리말과 일치하도록 (  ) 안의 말을 이용하여 문장을 완성하시오.<br>우리 삶에서 가장 중요한 것들 중 하나는 사랑이다. (important, thing)<br>___ in our lives is love.","One of the most important things","One of the most important things in our lives is love.","우리 삶에서 가장 중요한 것들 중 하나는 사랑이다.",
 "본책 p.132 POINT 4 ‘one of the + 최상급 + 복수 명사’ 박스를 펴세요.","1) 문장이 ‘~들 중 하나는’으로 시작해요. 대문자로 써야 해요.  2) important(중요한)는 긴 형용사라 most를 붙여요.  3) thing(것)은 복수로 써요.","One of the로 시작해요. important는 긴 단어라 앞에 한 단어가 붙고, thing은 복수형이에요. 여섯 단어예요.","One of the ~ things가 주어 → 동사는 단수 is");
C("NS","N",22,"(A)~(C)에 들어갈 말이 바르게 짝지어진 것은?<br>• Robin’s score is (A) twice / two times higher than Suji’s score.<br>• The Louvre Museum is one of the most famous (B) museum / museums in the world.<br>• Rachel earns (C) much / very more money than her sister.",["① twice — museum — much","② twice — museums — much","③ two times — museums — much","④ two times — museums — very","⑤ two times — museum — very"],"③ two times — museums — much","Robin’s score is two times higher than Suji’s score. / The Louvre Museum is one of the most famous museums in the world. / Rachel earns much more money than her sister.","Robin의 점수는 Suji의 점수보다 두 배 더 높다. / 루브르 박물관은 세계에서 가장 유명한 박물관들 중 하나이다. / Rachel은 그녀의 언니[동생]보다 훨씬 더 많은 돈을 번다.",
 "본책 p.132 POINT 1과 POINT 4, p.130 ‘비교급 강조’ 박스를 펴세요.","1) (A)는 higher than(비교급 + than)이 뒤에 있어요. twice는 as ~ as에서만 쓸 수 있어요.  2) (B)는 one of the most famous 뒤의 명사 모양을 봐요.  3) (C)는 more(더 많이)를 꾸미는 말이에요.","(A)는 two times, (B)는 복수형, (C)는 비교급 강조 말인 much예요. 이 세 개가 함께 있는 보기를 찾아요.","twice는 as~as에서만 / one of the + 복수 / 비교급 강조 much");
C("NS","N",23,"두 문장의 의미가 같을 때 빈칸 ⓐ, ⓑ에 들어갈 말이 순서대로 짝지어진 것은?<br>Your coat is warmer than my jacket.<br>= My jacket is not ⓐ ___ warm ⓑ ___ your coat.",["① as — as","② as — than","③ more — as","④ not as — as","⑤ not as — than"],"① as — as","My jacket is not as warm as your coat.","내 재킷은 너의 코트만큼 따뜻하지 않다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘not + as + 원급 + as’ 표를 펴세요.","1) 윗문장은 ‘너의 코트가 내 재킷보다 더 따뜻하다’예요.  2) 같은 뜻을 ‘내 재킷은 너의 코트만큼 ~하지 않다’로 바꾸고 있어요.  3) 이미 not이 있으니 그 뒤 모양만 채워요.","not 다음 빈칸 ⓐ와 warm 다음 빈칸 ⓑ에 같은 말이 들어가요. 첫 번째 보기예요.","not as + 원급 + as");
C("NS","N",24,"어느 빈칸에도 들어갈 수 없는 것은?<br>• My brother is ___ funnier than me.<br>• You look ___ tall. How tall are you?<br>• They spoke ___ and more loudly.",["① very","② a lot","③ more","④ most","⑤ much"],"④ most","My brother is much[a lot] funnier than me. / You look very tall. How tall are you? / They spoke more and more loudly.","내 남동생[형]은 나보다 훨씬 더 재미있다. / 너는 키가 아주 커 보여. 키가 몇이니? / 그들은 점점 더 큰 소리로 말했다.",
 "본책 p.130 ‘비교급 강조’ 박스와 p.132 POINT 2를 펴세요.","1) 첫째 칸은 funnier(더 재미있는) 앞이라 비교급을 꾸미는 말이 와요.  2) 둘째 칸은 tall(키가 큰)이라 원급을 꾸미는 말이에요.  3) 셋째 칸은 ‘and more loudly’와 짝이 되는 말이에요.","보기를 하나씩 세 칸에 넣어 보세요. 세 칸 어디에도 맞지 않는 보기는 ‘가장 ~한’ 느낌의 말이에요.","very = 원급 강조 / much, a lot = 비교급 강조 / more and more");
W("NS","N",25,"다음 글을 읽고 질문에 답하시오.<br>Jamie and Lily are in the same class. They both like to play badminton. They often play badminton after school together. Lily is the better player in the school. Although Jamie is not as good as Lily, she practices as much as she can. <u>Jamie는 그녀가 더 많이 연습할수록 그녀가 배드민턴을 더 잘 치게 될 것이라고 믿는다.</u> Jamie has already improved a lot. Her serves are most powerful than before!<br>위 글에서 어법상 틀린 부분을 두 곳 찾아 바르게 고치시오.","best / more","Lily is the best player in the school. / Her serves are more powerful than before!","Lily는 학교에서 최고의 선수이다. / 그녀의 서브는 전보다 더 강력하다!",
 "본책 p.130 최상급 비교(POINT 3)와 비교급 비교(POINT 2) 표를 펴세요.","1) ‘in the school(학교에서)’이 뒤에 붙은 문장은 최상급 자리예요.  2) ‘than before(전보다)’가 뒤에 붙은 문장은 비교급 자리예요.  3) 각각 어떤 모양이어야 하는지 따져요.","첫째는 better의 최상급(b로 시작), 둘째는 most를 비교급 만드는 말(m으로 시작)로 바꿔요.","the + 최상급 + in / 비교급 + than");
W("NS","N",26,"위 글의 밑줄 친 우리말과 일치하도록 (  ) 안의 말을 이용하여 문장을 완성하시오.<br>(밑줄 친 말: Jamie는 그녀가 더 많이 연습할수록 그녀가 배드민턴을 더 잘 치게 될 것이라고 믿는다.) (practice, play)<br>Jamie believes that ___ badminton.","the more she practices, the better she will play","Jamie believes that the more she practices, the better she will play badminton.","Jamie는 그녀가 더 많이 연습할수록 그녀가 배드민턴을 더 잘 치게 될 것이라고 믿는다.",
 "본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) ‘더 많이 연습할수록’은 the + 비교급 + 주어 + 동사예요.  2) practice(연습하다)의 주어는 she라서 동사 끝에 s를 붙여요.  3) 뒤 절은 ‘더 잘 치게 될 것이다’이니 well의 비교급과 will play를 써요.","앞 절은 the + 비교급 + she + practice에 s 붙인 말, 쉼표 뒤는 the + well의 비교급 + she + will play예요.","the + 비교급 + 주어 + 동사 (두 번)");
C("NS","N",27,"빈칸에 공통으로 들어갈 말로 알맞은 것은?<br>• These days map applications are ___ useful than paper maps.<br>• The older you get, the ___ knowledge you will gain.",["① a lot","② much","③ very","④ most","⑤ more"],"⑤ more","These days map applications are more useful than paper maps. / The older you get, the more knowledge you will gain.","요즘 지도 앱은 종이 지도보다 더 유용하다. / 나이가 들수록 너는 더 많은 지식을 얻게 될 것이다.",
 "본책 p.130 비교급 비교(POINT 2)와 p.132 POINT 3을 펴세요.","1) 첫 문장은 뒤에 than이 있고 useful(유용한)이 긴 형용사예요.  2) 둘째 문장은 the older you get 뒤에 the + 비교급이 와요. knowledge(지식)는 셀 수 없는 명사예요.","두 문장 모두 ‘더’를 뜻하는 비교급 more가 들어가요. 마지막 보기예요.","긴 형용사 비교급 more / the more + 명사");
W("NS","N",28,"어법상 틀린 부분을 찾아 바르게 고치시오.<br>The dog started to bark loud and loud.","louder and louder","The dog started to bark louder and louder.","그 개는 점점 더 크게 짖기 시작했다.",
 "본책 p.132 POINT 2 ‘비교급 + and + 비교급’ 박스를 펴세요.","1) ‘점점 더 크게’라는 뜻이에요.  2) loud(크게)를 두 번 쓰기만 하면 ‘점점 더’가 될까요?","loud에 -er을 붙인 모양을 and로 이어요. l로 시작하는 두 단어짜리 표현이에요.","loud and loud (X) → louder and louder");
W("NS","N",29,"어법상 틀린 부분을 찾아 바르게 고치시오.<br>This is one of the most popular movie of the year.","movies","This is one of the most popular movies of the year.","이것은 올해의 가장 인기 있는 영화들 중 하나이다.",
 "본책 p.132 POINT 4 아래 ‘항상 복수 명사와 함께 써야 한다’ 박스를 펴세요.","1) one of the most popular(가장 인기 있는 ~들 중 하나) 뒤의 명사를 봐요.  2) 명사 모양이 맞는지 확인해요.","movie 끝에 한 글자를 붙여요.","one of the most popular movie (X) → movies");
W("NS","N",30,"우리말과 일치하도록 주어진 조건에 맞게 문장을 완성하시오.<br>오늘 나는 어제보다 네 배 더 오래 공부했다.<br>조건: study, long, than을 사용할 것(필요시 형태를 바꿀 것), 빈칸에 총 6단어로 쓸 것<br>Today ___ yesterday.","I studied four times longer than","Today I studied four times longer than yesterday.","오늘 나는 어제보다 네 배 더 오래 공부했다.",
 "본책 p.132 POINT 1 ‘배수사 + 비교급 + than’ 박스를 펴세요.","1) ‘네 배 더 오래’는 배수사 + 비교급 + than이에요.  2) ‘공부했다’는 과거 시제예요. study(공부하다)의 과거형을 써요.  3) 빈칸은 6단어: 주어 + 동사 + 배수사(두 단어) + 비교급 + than이에요.","I + study의 과거형(y를 i로) 다음에 배수사 두 단어, 그 뒤에 long의 비교급과 than이에요.","I + 과거형 + 배수사 + 비교급 + than");
C("NS","N",31,"다음 글의 내용을 요약할 때, 빈칸에 들어갈 말이 순서대로 짝지어진 것은?<br>People have different amounts of melanin. People with more melanin will have darker hair colors, like deep brown or black. On the other hand, people with less melanin will have lighter hair colors, such as light brown or blonde. Thus, the amount of melanin we have in our bodies affects the color of our hair.<br>→ ___ melanin you have, ___ your hair is.",["① The less — the darker","② The less — lighter","③ The more — darker","④ The more — the darker","⑤ The more — the lighter"],"④ The more — the darker","The more melanin you have, the darker your hair is.","멜라닌이 더 많을수록 머리카락이 더 어둡다.",
 "본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) 글에서 멜라닌(melanin)이 더 많은 사람은 머리카락 색이 어떤지 읽어요.  2) 요약문은 ‘~할수록 더 …하다’ 모양이라 두 빈칸 모두 the + 비교급이에요.","글에서 more melanin → darker hair라고 했어요. 둘 다 the가 붙은 보기를 찾아요.","the + 비교급 ~, the + 비교급 … (more melanin → darker)");
// ===== 문법정리노트 (p.140) =====
W("GN","G",1,"Sarah can run ___ John.","as fast as","Sarah can run as fast as John.","Sarah는 John만큼 빨리 달릴 수 있다.",
 "본책 p.130 원급 비교(POINT 1)의 ‘as + 원급 + as’ 표를 펴세요.","1) 해석이 ‘John만큼 빨리’예요. 정도가 같은 비교예요.  2) 원급 fast(빨리)를 두 as 사이에 써요.","as로 시작해서 as로 끝나는 세 단어예요.","as fast as = ~만큼 빨리 (fast 그대로)");
W("GN","G",2,"Mina is ___ I am.","younger than","Mina is younger than I am.","Mina는 나보다 어리다.",
 "본책 p.130 비교급 비교(POINT 2)의 ‘비교급 + than’ 표를 펴세요.","1) 해석이 ‘나보다 어리다’예요. 두 대상의 차이를 말해요.  2) young(어린)의 비교급 + than을 써요.","young에 -er을 붙이고 than을 써요. 두 단어예요.","비교급 + than (~보다 더 …한)");
W("GN","G",3,"Sharon earns three times as much as Joy.<br>= Sharon earns three times ___ Joy.","more than","Sharon earns three times more than Joy.","Sharon은 Joy보다 세 배 더 많은 돈을 번다.",
 "본책 p.132 POINT 1 ‘배수사 + as + 원급 + as = 배수사 + 비교급 + than’ 박스를 펴세요.","1) 윗문장은 as much as(~만큼 많이)예요.  2) much(많이)의 비교급과 than으로 바꿔 써요.","much의 비교급은 불규칙이에요. m으로 시작하는 말 + than이에요.","배수사 + 비교급 + than (much → more)");
W("GN","G",4,"The weather is getting ___. (날씨가 점점 더 추워지고 있다.)","colder and colder","The weather is getting colder and colder.","날씨가 점점 더 추워지고 있다.",
 "본책 p.132 POINT 2 ‘비교급 + and + 비교급’ 박스를 펴세요.","1) ‘점점 더 추워지는’이라는 뜻이에요.  2) cold(추운)의 비교급을 두 번 and로 이어요.","cold에 -er을 붙인 말을 두 번 쓰고 가운데에 and를 넣어요.","cold(추운)의 비교급 colder를 and로 두 번");
W("GN","G",5,"___ you laugh, the happier you will be. (네가 더 많이 웃을수록 너는 더 행복해질 것이다.)","The more","The more you laugh, the happier you will be.","네가 더 많이 웃을수록 너는 더 행복해질 것이다.",
 "본책 p.132 POINT 3 ‘the + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사’ 박스를 펴세요.","1) 뒤 절이 the happier(더 행복한)로 시작해요.  2) 앞 절도 the + 비교급으로 시작해요.  3) ‘더 많이 웃을수록’의 ‘더 많이’를 써요.","The + m으로 시작하는 비교급, 두 단어예요.","앞 절 맨 앞도 The + 비교급 (much의 비교급 more)");
W("GN","G",6,"The more you laugh, ___ you will be. (너는 더 행복해질 것이다.)","the happier","The more you laugh, the happier you will be.","네가 더 많이 웃을수록 너는 더 행복해질 것이다.",
 "본책 p.132 POINT 3 박스의 둘째 절 모양을 펴세요.","1) 앞 절이 The more you laugh(더 많이 웃을수록)예요.  2) 뒤 절도 the + 비교급으로 써요.  3) happy(행복한)는 y를 i로 바꾸고 -er을 붙여요.","the + happy가 바뀐 h로 시작하는 비교급, 두 단어예요.","뒤 절도 the + 비교급 (happy → happier)");
W("GN","G",7,"This is one of ___ in the city. (이곳은 이 도시에서 가장 아름다운 공원들 중 하나이다.)","the most beautiful parks","This is one of the most beautiful parks in the city.","이곳은 이 도시에서 가장 아름다운 공원들 중 하나이다.",
 "본책 p.132 POINT 4 ‘one of the + 최상급 + 복수 명사’ 박스를 펴세요.","1) ‘~들 중 하나’는 one of the로 시작해요.  2) beautiful(아름다운)은 긴 형용사라 most를 붙여요.  3) 마지막은 park(공원)의 복수형이에요.","the로 시작하는 네 단어예요. beautiful 앞에 한 단어가 붙고, park는 복수형이에요.","가장 ~한 공원들 중 하나 → the most beautiful parks");
