ex":[["Follow the [[instructions]] on the box.","상자에 적힌 [[설명서]]를 따라라."],["The teacher gave us clear [[instructions]] for the test.","선생님은 시험에 대한 분명한 [[지시]]를 주셨다."],["Read the [[instruction manual]] first.","[[사용 설명서]]를 먼저 읽어라."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"discuss","a":"2","e":"discuss (동) 논의하다 - discussion (명) 논의, 토론\n② explain (동) 설명하다 - explanation (명) 설명","w":"① kind (형) 친절한 - kindness (명) 친절\n③ certain (형) 확실한 - certainty (명) 확실성\n④ happy (형) 행복한 - happiness (명) 행복","m":0,"s":"discuss - discussion","c":["kind - kindness","explain - explanation","certain - certainty","happy - happiness"],"mn":"논의하다","hk":"discuss(논의하다, 동사)가 discussion(논의, 명사)이 되는 관계. explain(설명하다)-explanation(설명)만 동사에서 명사이고 나머지는 형용사에서 명사.","ex":[["We will [[discuss the problem]] after lunch.","우리는 점심 후에 [[그 문제를 논의할]] 것이다.","discuss (동) 논의하다"],["They had [[a long discussion]] about the rules.","그들은 규칙에 대해 [[긴 토론]]을 했다.","discussion (명) 논의, 토론"],["Can you [[explain the rule]] again?","[[그 규칙을 설명해]] 줄래?","explain (동) 설명하다"],["His [[explanation]] was easy to follow.","그의 [[설명]]은 이해하기 쉬웠다.","explanation (명) 설명"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"condition","a":"1","e":"① condition: 상태 (그 중고차는 십 년이 지난 후에도 여전히 훌륭한 상태이다.)","w":"② situation: 상황, 처지\n③ appearance: 겉모습, 외모\n④ design: 디자인, 설계","k":"그 중고차는 십 년이 지난 후에도 여전히 훌륭한 상태이다.","m":0,"s":"The used car is still in excellent ________ even after ten years.","c":["condition","situation","appearance","design"],"mn":"상태","hk":"condition(상태)은 excellent(훌륭한)나 good(좋은) 같은 말과 짝. situation(상황)은 주변 형편, appearance(겉모습)는 겉만 가리켜 오답.","ex":[["The old house is in [[good condition]].","그 오래된 집은 [[좋은 상태]]이다."],["He stayed home because of his [[health condition]].","그는 [[건강 상태]] 때문에 집에 머물렀다."],["The road is in [[poor condition]].","그 도로는 [[나쁜 상태]]이다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"bargained","a":"1","e":"① negotiated: 협상하다 (negotiate의 과거형) (두 회사는 그 땅의 가격을 두고 몇 주 동안 협상했다.) / bargain(협상하다, 흥정하다)의 유의어.","w":"② refused: 거절하다 (refuse의 과거형)\n③ hesitated: 망설이다 (hesitate의 과거형)\n④ argued: 논쟁하다, 말다툼하다 (argue의 과거형)","k":"두 회사는 그 땅의 가격을 두고 몇 주 동안 협상했다.","m":0,"s":"The two companies bargained for several weeks over the price of the land.","h":"bargained","c":["negotiated","refused","hesitated","argued"],"mn":"협상하다, 흥정하다","wb":"bargain","hk":"bargain(협상하다, 흥정하다)은 negotiate(협상하다)와 같은 편. refuse(거절하다), hesitate(망설이다), argue(논쟁하다)는 오답.","ex":[["We [[bargained with the seller]] for an hour.","우리는 한 시간 동안 [[판매자와 흥정했다]]."],["The workers [[bargained for better pay]].","노동자들은 [[더 나은 임금을 위해 협상했다]]."],["She [[bargained over the price]] of the bag.","그녀는 가방 [[가격을 두고 흥정했다]]."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"reform","a":"1","e":"① reform: 개혁하다","w":"② conform: 순응하다, 따르다\n③ inform: 알리다, 통지하다\n④ transform: 변형시키다, 완전히 바꾸다","m":0,"s":"\"개혁하다\"","c":["reform","conform","inform","transform"],"mn":"개혁하다","hk":"reform(개혁하다)은 re-(다시)와 form(형태)이 합쳐져 '형태를 다시 만들다'. conform(순응하다), inform(알리다), transform(변형시키다)은 앞부분이 달라 오답.","ex":[["The government plans to [[reform the school system]].","정부는 [[학교 제도를 개혁할]] 계획이다."],["The new leader promised to [[reform the law]].","새 지도자는 [[법을 개혁하겠다고]] 약속했다."],["They want to [[reform the tax system]].","그들은 [[세금 제도를 개혁하고]] 싶어 한다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"modern","a":"2,4","e":"② ancient: 고대의, 아주 오래된 (우리 학교는 3년 전에 현대적인 건물로 이사했다.) / modern(현대의, 최신의)의 반의어.\n④ old: 오래된, 낡은 / modern(현대의, 최신의)의 반의어.","w":"① quiet: 조용한\n③ empty: 비어 있는","k":"우리 학교는 3년 전에 현대적인 건물로 이사했다.","m":2,"s":"Our school moved into a modern building three years ago.","h":"modern","c":["quiet","ancient","empty","old"],"mn":"현대의, 최신의","hk":"modern(현대의)의 반대편은 ancient(고대의)와 old(오래된). quiet(조용한), empty(비어 있는)는 시대와 무관한 속임수.","ex":[["We live in a [[modern city]].","우리는 [[현대적인 도시]]에서 산다.","modern (형) 현대의, 최신의"],["[[Ancient Rome]] built many roads.","[[고대 로마]]는 많은 길을 만들었다.","ancient (형) 고대의, 아주 오래된"],["He drives [[an old car]].","그는 [[오래된 차]]를 몰고 다닌다.","old (형) 오래된, 낡은"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"coach","a":"coach","e":"coach (명) 코치, 감독 / (동) 지도하다","k":"그 팀은 다섯 경기를 연달아 진 뒤 새 감독을 고용했다.\n그녀는 지역 수영장에서 어린 수영 선수들을 지도하기 위해 주말을 포기한다.","m":0,"s":"The team hired a new c______ after losing five games in a row.\nShe gives up her weekends to c______ young swimmers at the local pool.","mn":"코치, 감독 / 지도하다","hk":"coach(코치)는 명사로 감독, 동사로 지도하다. 문장 앞은 사람을 뜻하는 감독이고, 뒤는 swimmers(수영 선수들)를 가르치는 동작.","ex":[["The soccer team has a new [[coach]].","그 축구팀에는 새 [[감독]]이 있다.","coach (명) 코치, 감독"],["Our [[head coach]] praised the players.","우리 [[수석 코치]]는 선수들을 칭찬했다.","coach (명) 코치, 감독"],["He will [[coach the beginners]] on Saturday.","그는 토요일에 [[초보자들을 지도할]] 것이다.","coach (동) 지도하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"conflict","a":"2","e":"② conflict: (심각한 의견 충돌이나 다툼 / 두 집단의 사람들 사이의 / 서로 다른 의견이나 이해관계를 가진) 갈등, 충돌","w":"① invasion: 침략, 침입\n③ treaty: 조약, 협정\n④ rebellion: 반란, 반항","k":"심각한 의견 충돌이나 다툼 / 두 집단의 사람들 사이의 / 서로 다른 의견이나 이해관계를 가진","m":0,"s":"\"a serious disagreement or struggle between two groups of people who have different opinions or interests\"","c":["invasion","conflict","treaty","rebellion"],"mn":"갈등, 충돌","hk":"conflict(갈등, 충돌)는 두 집단의 의견 다툼. invasion(침략)은 쳐들어가는 행동, rebellion(반란)은 지배에 맞선 저항이라 오답.","ex":[["The two groups were in [[conflict]] over land.","두 집단은 땅을 두고 [[갈등]] 중이었다."],["They tried to [[avoid a conflict]].","그들은 [[충돌을 피하려고]] 했다."],["She tried to [[solve the conflict]] between her friends.","그녀는 친구들 사이의 [[갈등을 해결하려고]] 했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"reception","a":"reception","e":"reception 접수처, 프런트","k":"호텔에서 체크아웃할 때 프런트에 열쇠를 맡겨 주세요.","m":0,"s":"Please leave your key at the r______ when you check out of the hotel.","mn":"접수처, 프런트","hk":"reception(접수처)은 c 다음에 e-p-t-i-o-n 순서. receive(받다)와 달리 v가 아니라 p가 들어감.","ex":[["Please wait at the [[reception desk]].","[[접수처]]에서 기다려 주세요."],["The hotel [[reception]] is open all night.","호텔 [[프런트]]는 밤새 열려 있다."],["She works at the [[reception]] of a big hospital.","그녀는 큰 병원의 [[접수처]]에서 일한다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"affair","a":"1","e":"① affair: (중대한) 사건, 일","w":"② statement: 진술, 성명\n③ effect: 효과, 영향\n④ process: 절차, 과정","m":0,"s":"affair","c":["(중대한) 사건, 일","진술, 성명","효과, 영향","절차, 과정"],"mn":"(중대한) 사건, 일","hk":"affair(중대한 사건, 일)는 current(현재의) affairs(시사 문제)처럼 쓰임. statement(진술), effect(효과), process(과정)는 사건이 아님.","ex":[["The news reports on [[current affairs]].","그 뉴스는 [[시사 문제]]를 보도한다."],["It was a [[strange affair]].","그것은 [[이상한 사건]]이었다."],["He doesn't talk about [[family affairs]].","그는 [[집안 사정]]에 대해 말하지 않는다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"flushed","a":"4","e":"④ blushed: (얼굴이) 붉어지다 (blush의 과거형) (방 안의 모든 사람이 그녀를 쳐다보자 그녀의 얼굴이 붉어졌다.) / flush((얼굴이) 붉어지다, 상기되다)의 유의어.","w":"① trembled: 떨다 (tremble의 과거형)\n② paled: 창백해지다 (pale의 과거형)\n③ shivered: (추위 등으로) 떨다 (shiver의 과거형)","k":"방 안의 모든 사람이 그녀를 쳐다보자 그녀의 얼굴이 붉어졌다.","m":0,"s":"Her face flushed when everyone in the room turned to look at her.","h":"flushed","c":["trembled","paled","shivered","blushed"],"mn":"(얼굴이) 붉어지다, 상기되다","wb":"flush","hk":"flush(얼굴이 붉어지다)는 blush(얼굴이 붉어지다)와 첫 글자만 다른 같은 편. trembled(떨다), paled(창백해지다)는 오답.","ex":[["Her face [[flushed with anger]].","그녀의 얼굴은 [[화가 나서 붉어졌다]]."],["He [[flushed with embarrassment]].","그는 [[창피해서 얼굴이 붉어졌다]]."],["The boy [[flushed red]] when asked.","그 소년은 질문을 받자 [[얼굴이 빨개졌다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"candidates","a":"4","e":"④ candidates: 후보자, 지원자 (candidate의 복수형) (지난주 시장 선거에서 단 두 명의 후보자만이 남았다.)","w":"① supporters: 지지자 (supporter의 복수형)\n② volunteers: 자원봉사자 (volunteer의 복수형)\n③ officials: 공무원, 관계자 (official의 복수형)","k":"지난주 시장 선거에서 단 두 명의 후보자만이 남았다.","m":0,"s":"Only two ________ remained in the race for mayor last week.","c":["supporters","volunteers","officials","candidates"],"mn":"후보자, 지원자","hk":"candidates(후보자들)는 선거 경쟁에 남는 사람. supporters(지지자), volunteers(자원봉사자), officials(공무원)는 경쟁하는 사람이 아니라 오답.","ex":[["Three [[candidates]] ran for class president.","세 명의 [[후보자]]가 반장 선거에 나갔다."],["The company interviewed ten [[job candidates]].","그 회사는 열 명의 [[입사 지원자]]를 면접했다."],["Each [[candidate]] gave a short speech.","각 [[후보자]]는 짧은 연설을 했다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"room","a":"2","e":"①방 / ②공간, 자리 / ③방 / ④방 [②번만 의미가 다름]","k":"①그 호텔 방은 바다가 보이는 아름다운 전망을 갖고 있었다.\n②그 차에는 여행 가방 다섯 개를 넣을 공간이 충분하지 않다.\n③그녀는 친구들이 도착하기 전에 자기 방을 청소했다.\n④그들은 2층에 있는 그 작은 방을 페인트칠했다.","m":0,"c":["The hotel room had a beautiful view of the ocean.","There is not enough room in the car for five suitcases.","She cleaned her room before her friends arrived.","They painted the small room on the second floor."],"hc":"room|room|room|room","mn":"방 / 공간, 자리","hk":"room(방)은 ②번 enough(충분한) room에서만 '공간, 자리'. 나머지 ①③④는 건물 속 방.","ex":[["She cleaned [[her room]] before dinner.","그녀는 저녁 식사 전에 [[자기 방]]을 청소했다.","room (명) 방"],["They share [[a small room]].","그들은 [[작은 방]] 하나를 같이 쓴다.","room (명) 방"],["Please make [[room for me]] on the bench.","벤치에 [[내가 앉을 자리]]를 좀 만들어 줘.","room (명) 공간, 자리"]]}]},{"day":77,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"election","a":"4","e":"④ election: (어떤 때, 행사 / 사람들이 투표를 하는 / 누가 공직을 맡을지 결정하기 위해) 선거","w":"① system: 체계, 시스템\n② labor: 노동, 수고\n③ assessment: 평가","k":"어떤 때, 행사 / 사람들이 투표를 하는 / 누가 공직을 맡을지 결정하기 위해","m":0,"s":"\"an occasion when people vote to decide who will hold an official position\"","c":["system","labor","assessment","election"],"mn":"선거","hk":"election(선거)은 투표로 공직자를 뽑는 때. 동사 elect(선출하다)의 명사. system(체계), labor(노동), assessment(평가)는 오답.","ex":[["The [[election]] will be held in May.","[[선거]]는 5월에 열릴 것이다."],["She won the [[student council election]].","그녀는 [[학생회 선거]]에서 이겼다."],["People vote in the [[presidential election]].","사람들은 [[대통령 선거]]에서 투표한다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"select","a":"2","e":"② choose: 고르다, 선택하다 (선생님은 학교 과학 경시대회에 나갈 다섯 명의 학생을 선발할 것이다.) / select(선택하다, 고르다)의 유의어.","w":"① train: 훈련시키다\n③ transfer: 옮기다, 전학시키다\n④ investigate: 조사하다","k":"선생님은 학교 과학 경시대회에 나갈 다섯 명의 학생을 선발할 것이다.","m":0,"s":"The teacher will select five students for the school science contest.","h":"select","c":["train","choose","transfer","investigate"],"mn":"선택하다, 고르다","hk":"select(선택하다)는 choose(고르다)와 같은 편. train(훈련시키다), transfer(옮기다), investigate(조사하다)는 고른다는 뜻이 없어 오답.","ex":[["Please [[select one answer]].","[[답 하나를 고르세요]]."],["The coach will [[select the team]] today.","코치는 오늘 [[팀을 선발할]] 것이다."],["You can [[select a color]] from the list.","목록에서 [[색을 선택할]] 수 있다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"horizon","a":"2","e":"② horizon: 지평선, 수평선","w":"① orbit: 궤도\n③ surface: 표면, 겉면\n④ gravity: 중력","m":0,"s":"\"지평선, 수평선\"","c":["orbit","horizon","surface","gravity"],"mn":"지평선, 수평선","hk":"horizon(지평선, 수평선)은 horizontal(수평의)과 같은 뿌리로 묶기. orbit(궤도), surface(표면), gravity(중력)는 오답.","ex":[["The sun slowly sank below [[the horizon]].","해가 천천히 [[지평선]] 아래로 졌다."],["A ship appeared on [[the horizon]].","배 한 척이 [[수평선]] 위에 나타났다."],["Dark clouds gathered [[over the horizon]].","먹구름이 [[지평선 너머에]] 모여들었다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"insight","a":"insight","e":"insight 통찰력","k":"20년간의 연구 끝에, 그녀는 아이들이 제2 언어를 어떻게 배우는지에 대한 깊은 통찰력을 제시했다.","m":0,"s":"After twenty years of research, she offered a deep i______ into how children learn a second language.","mn":"통찰력","hk":"insight(통찰력)는 in(안)과 sight(봄)가 붙은 말. 가운데 gh 철자를 빼먹지 말기.","ex":[["Her book gives [[deep insight]] into history.","그녀의 책은 역사에 대한 [[깊은 통찰]]을 준다."],["Thank you for your [[valuable insight]].","당신의 [[소중한 통찰]]에 감사드립니다."],["The test gave us [[insight]] into our mistakes.","그 시험은 우리의 실수에 대한 [[통찰]]을 주었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"gathered","a":"2","e":"② scattered: 흩뿌리다, 흩어지게 하다 (scatter의 과거형) (아이들은 어제 학교 운동장에서 떨어진 낙엽을 모았다.) / gather(모으다, 그러모으다)의 반의어.","w":"① washed: 씻다 (wash의 과거형)\n③ stacked: 쌓다 (stack의 과거형)\n④ counted: 세다 (count의 과거형)","k":"아이들은 어제 학교 운동장에서 떨어진 낙엽을 모았다.","m":0,"s":"The children gathered the fallen leaves in the school yard yesterday.","h":"gathered","c":["washed","scattered","stacked","counted"],"mn":"모으다, 그러모으다","wb":"gather","hk":"gather(모으다)의 반대편은 scatter(흩뿌리다). washed(씻다), stacked(쌓다), counted(세다)는 흩는 행동이 아니라 오답.","ex":[["He [[gathered his books]] and left.","그는 [[책을 모아]] 나갔다.","gather (동) 모으다, 그러모으다"],["The wind [[scattered the papers]].","바람이 [[종이들을 흩뿌렸다]].","scatter (동) 흩뿌리다, 흩어지게 하다"],["She [[scattered seeds]] on the ground.","그녀는 땅에 [[씨앗을 흩뿌렸다]].","scatter (동) 흩뿌리다, 흩어지게 하다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"theory","a":"4","e":"④ theory: 이론 (아인슈타인의 상대성 이론은 전 세계의 물리 수업에서 여전히 가르쳐진다.)","w":"① instinct: 본능\n② complement: 보완물\n③ mechanism: 기계 장치, 메커니즘","k":"아인슈타인의 상대성 이론은 전 세계의 물리 수업에서 여전히 가르쳐진다.","m":0,"s":"Einstein's ________ of relativity is still taught in physics classes around the world.","c":["instinct","complement","mechanism","theory"],"mn":"이론","hk":"theory(이론)는 of relativity(상대성)와 짝을 이루는 말. instinct(본능), complement(보완물), mechanism(기계 장치)은 오답.","ex":[["Darwin's [[theory of evolution]] is famous.","다윈의 [[진화론]]은 유명하다."],["That is only a [[theory]], not a fact.","그것은 사실이 아니라 [[이론]]일 뿐이다."],["In [[theory]], the plan should work.","[[이론상]] 그 계획은 효과가 있을 것이다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"survive","a":"3","e":"survive (동) 살아남다, 생존하다 - survival (명) 생존\n③ apply (동) 지원하다, 적용하다 - application (명) 지원(서), 적용","w":"① anxious (형) 불안한, 걱정하는 - anxiety (명) 불안, 걱정\n② humble (형) 겸손한 - humility (명) 겸손\n④ able (형) ~할 수 있는 - ability (명) 능력","m":0,"s":"survive - survival","c":["anxious - anxiety","humble - humility","apply - application","able - ability"],"mn":"살아남다, 생존하다","hk":"survive(살아남다, 동사)가 survival(생존, 명사)이 되는 관계. apply(적용하다)-application(적용)만 같고 나머지는 형용사에서 명사.","ex":[["Few plants can [[survive]] in the desert.","사막에서 [[살아남을]] 수 있는 식물은 거의 없다.","survive (동) 살아남다, 생존하다"],["Water is important for [[survival]].","물은 [[생존]]에 중요하다.","survival (명) 생존"],["You can [[apply for the job]] online.","온라인으로 [[그 일자리에 지원할]] 수 있다.","apply (동) 지원하다, 적용하다"],["Please fill out the [[application form]].","[[지원서]]를 작성해 주세요.","application (명) 지원(서), 적용"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"settle","a":"settle","e":"settle (동) 정착하다 / (동) (분쟁을) 해결하다","k":"그 가족은 내년 봄에 해안 근처의 조용한 마을에 정착하기를 바란다.\n두 이웃은 울타리를 둘러싼 오랜 분쟁을 해결하기 위해 한 번 더 만났다.","m":0,"s":"The family hopes to s______ in a quiet town near the coast next spring.\nThe two neighbors met once more to s______ the long dispute over the fence.","mn":"정착하다 / 해결하다","hk":"settle(정착하다, 해결하다)은 settle in(자리 잡다)과 settle a dispute(분쟁을 해결하다) 두 짝으로 기억.","ex":[["They plan to [[settle in Canada]].","그들은 [[캐나다에 정착할]] 계획이다.","settle (동) 정착하다"],["My uncle [[settled in Busan]] years ago.","삼촌은 몇 년 전에 [[부산에 정착했다]].","settle (동) 정착하다"],["Let's [[settle the argument]] now.","이제 [[그 논쟁을 해결하자]].","settle (동) (분쟁을) 해결하다"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"allow","a":"1","e":"① permit: 허락하다, 허용하다 (그 도시는 마침내 중앙 광장에서의 거리 공연을 허용하기로 결정했다.) / allow(허락하다, 허용하다)의 유의어.","w":"② forbid: 금지하다\n③ restrict: 제한하다\n④ prevent: 막다, 예방하다","k":"그 도시는 마침내 중앙 광장에서의 거리 공연을 허용하기로 결정했다.","m":0,"s":"The city finally decided to allow street performances in the main square.","h":"allow","c":["permit","forbid","restrict","prevent"],"mn":"허락하다, 허용하다","hk":"allow(허락하다)는 permit(허락하다)과 같은 편. forbid(금지하다), restrict(제한하다), prevent(막다)는 허락과 거리가 먼 뜻이라 오답.","ex":[["Our school does not [[allow phones]].","우리 학교는 [[휴대전화를 허용하지]] 않는다."],["Mom will [[allow me to go]] out.","엄마는 [[내가 나가도록 허락할]] 것이다."],["The teacher will [[allow extra time]] for the test.","선생님은 시험에 [[추가 시간을 허용할]] 것이다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"jealous","a":"2","e":"② jealous: 질투하는, 시기하는","w":"① ambitious: 야심 있는\n③ depressed: 우울한\n④ arrogant: 오만한","m":0,"s":"jealous","c":["야심 있는","질투하는","우울한","오만한"],"mn":"질투하는, 시기하는","hk":"jealous(질투하는)는 jealous of(~을 질투하는) 짝으로 기억. ambitious(야심 있는), depressed(우울한), arrogant(오만한)는 오답.","ex":[["She felt [[jealous of her sister]].","그녀는 [[언니를 질투했다]]."],["He gets [[jealous easily]].","그는 [[쉽게 질투한다]]."],["Don't be [[jealous of others]].","[[다른 사람을 질투하지]] 마라."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"commerce","a":"3","e":"③ commerce: 상업, 무역 (온라인 상업은 사람들이 물건을 사고파는 방식을 바꾸었다.)","w":"① tuition: 등록금\n② profit: 이익, 수익\n④ currency: 통화, 화폐","k":"온라인 상업은 사람들이 물건을 사고파는 방식을 바꾸었다.","m":0,"s":"Online ________ changed the way people buy and sell goods.","c":["tuition","profit","commerce","currency"],"mn":"상업, 무역","hk":"commerce(상업, 무역)는 사고파는 활동. tuition(등록금), profit(이익), currency(화폐)는 활동 이름이 아니라 오답.","ex":[["[[Online commerce]] is growing fast.","[[온라인 상업]]이 빠르게 성장하고 있다."],["The city grew because of [[trade and commerce]].","그 도시는 [[무역과 상업]] 덕분에 성장했다."],["He studied [[international commerce]] at college.","그는 대학에서 [[국제 무역]]을 공부했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"campaign","a":"campaign","e":"campaign 캠페인, (조직적인) 운동","k":"그 도시는 사람들이 플라스틱 병을 재활용하도록 장려하는 조직적인 운동을 시작했다.","m":0,"s":"The city started a c______ to encourage people to recycle plastic bottles.","mn":"캠페인, (조직적인) 운동","hk":"campaign(운동)은 c-a-m-p-a-i-g-n 순서. 끝의 -gn에서 g를 빠뜨리지 않기. camp(야영지)로 시작하는 모양도 기억.","ex":[["The school started a [[recycling campaign]].","학교는 [[재활용 캠페인]]을 시작했다."],["They ran a [[campaign against smoking]].","그들은 [[흡연 반대 운동]]을 벌였다."],["She joined the [[election campaign]].","그녀는 [[선거 운동]]에 참여했다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"vapor","a":"1","e":"① vapor: (기체 / 만들어지는 / 물 같은 액체가 가열될 때) 증기, (특히 물의) 수증기","w":"② structure: 구조, 구조물\n③ mixture: 혼합물\n④ climate: 기후","k":"기체 / 만들어지는 / 물 같은 액체가 가열될 때","m":0,"s":"\"the gas that is formed when a liquid such as water is heated\"","c":["vapor","structure","mixture","climate"],"mn":"증기, (특히 물의) 수증기","hk":"vapor(증기, 수증기)는 액체가 가열될 때 생기는 기체. structure(구조), mixture(혼합물), climate(기후)는 기체가 아님.","ex":[["[[Water vapor]] rose from the pot.","[[수증기]]가 냄비에서 올라왔다."],["The bathroom filled with [[hot vapor]].","욕실이 [[뜨거운 증기]]로 가득 찼다."],["Cold air turns [[vapor into water]].","찬 공기는 [[증기를 물로]] 바꾼다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"flexible","a":"2,3","e":"② rigid: 뻣뻣한, 잘 휘지 않는 (고무는 부러지지 않고 쉽게 구부러지는 유연한 재료이다.) / flexible(유연한, 잘 휘어지는)의 반의어.\n③ stiff: 뻣뻣한, 굳은 / flexible(유연한, 잘 휘어지는)의 반의어.","w":"① slippery: 미끄러운\n④ sticky: 끈적거리는","k":"고무는 부러지지 않고 쉽게 구부러지는 유연한 재료이다.","m":2,"s":"Rubber is a flexible material that bends easily without breaking.","h":"flexible","c":["slippery","rigid","stiff","sticky"],"mn":"유연한, 잘 휘어지는","hk":"flexible(유연한)의 반대편은 rigid(뻣뻣한)와 stiff(뻣뻣한). slippery(미끄러운), sticky(끈적거리는)는 휘는 정도와 무관한 속임수.","ex":[["Yoga makes your body more [[flexible]].","요가는 몸을 더 [[유연하게]] 만든다.","flexible (형) 유연한, 잘 휘어지는"],["The metal frame is [[rigid]] and strong.","그 금속 틀은 [[뻣뻣하고]] 튼튼하다.","rigid (형) 뻣뻣한, 잘 휘지 않는"],["I woke up with [[a stiff neck]].","나는 [[뻣뻣한 목]]으로 잠에서 깼다.","stiff (형) 뻣뻣한, 굳은"]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"address","a":"2","e":"①주소 / ②연설 / ③주소 / ④주소 [②번만 의미가 다름]","k":"①봉투 앞면에 너의 이름과 집 주소를 써라.\n②대통령은 온 국민에게 감동적인 연설을 했다.\n③지도에 있는 주소가 잘못되어서 나는 그 가게를 찾을 수 없었다.\n④그 소포를 서울에 있는 나의 새 주소로 보내 주세요.","m":0,"c":["Write your name and home address on the front of the envelope.","The president gave a moving address to the whole nation.","I could not find the store because the address on the map was wrong.","Please send the package to my new address in Seoul."],"hc":"address|address|address|address","mn":"주소 / 연설","hk":"address(주소)는 ②에서만 '연설'. ①③④는 편지와 소포에 쓰는 주소.","ex":[["What is your home [[address]]?","네 집 [[주소]]가 뭐니?","address (명) 주소"],["Write the [[email address]] here.","여기에 [[이메일 주소]]를 써라.","address (명) 주소"],["The mayor gave [[an address]] to the crowd.","시장은 군중에게 [[연설]]을 했다.","address (명) 연설"]]}]},{"day":78,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"attract","a":"3","e":"③ draw: (관심 등을) 끌다 (복도에 있는 그 화려한 포스터들은 어린 학생들의 많은 관심을 끈다.) / attract((마음·관심을) 끌다, 끌어모으다)의 유의어.","w":"① control: 통제하다, 조절하다\n② lose: 잃다\n④ deserve: ~을 받을 만하다","k":"복도에 있는 그 화려한 포스터들은 어린 학생들의 많은 관심을 끈다.","m":0,"s":"The colorful posters in the hallway attract a lot of attention from young students.","h":"attract","c":["control","lose","draw","deserve"],"mn":"(마음·관심을) 끌다, 끌어모으다","hk":"attract(끌다)는 draw(끌다)와 같은 편이고 draw attention(관심을 끌다)이 대표 짝. control(통제하다), lose(잃다), deserve(~할 만하다)는 오답.","ex":[["The festival will [[attract many tourists]].","축제는 [[많은 관광객을 끌어들일]] 것이다."],["Bright colors [[attract attention]].","밝은 색은 [[관심을 끈다]]."],["Flowers [[attract bees]].","꽃은 [[벌을 끌어들인다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"justice","a":"2","e":"② justice: (사람들에 대한 공정한 대우 / 법에 따른) 정의, 사법","w":"① council: 의회, 위원회\n③ civilization: 문명\n④ government: 정부","k":"사람들에 대한 공정한 대우 / 법에 따른","m":0,"s":"\"the fair treatment of people according to the law\"","c":["council","justice","civilization","government"],"mn":"정의, 사법","hk":"justice(정의)는 법에 따른 공정한 대우. council(의회), civilization(문명), government(정부)는 기관이나 사회라 오답.","ex":[["Everyone deserves [[equal justice]].","모든 사람은 [[평등한 정의]]를 받을 자격이 있다."],["The thief was brought to [[justice]].","도둑은 [[법의 심판]]을 받았다."],["The [[justice system]] must be fair.","[[사법 제도]]는 공정해야 한다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"curiosity","a":"3","e":"③ curiosity: 호기심","w":"① jealousy: 질투, 시기\n② mood: 기분, 분위기\n④ patience: 인내심","m":0,"s":"\"호기심\"","c":["jealousy","mood","curiosity","patience"],"mn":"호기심","hk":"curiosity(호기심)는 형용사 curious(호기심 많은)의 명사. jealousy(질투), mood(기분), patience(인내심)는 오답.","ex":[["Children are full of [[curiosity]].","아이들은 [[호기심]]으로 가득하다."],["Out of [[curiosity]], he opened the box.","[[호기심]]에, 그는 상자를 열었다."],["She showed [[great curiosity]] about space.","그녀는 우주에 [[큰 호기심]]을 보였다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"art","a":"3","e":"③ art: 예술, 미술 (그 박물관은 1920년대 유럽 화가들의 현대 미술 작품을 전시한다.)","w":"① logic: 논리\n② conversation: 대화\n④ literature: 문학","k":"그 박물관은 1920년대 유럽 화가들의 현대 미술 작품을 전시한다.","m":0,"s":"The museum shows modern ________ by European painters from the 1920s.","c":["logic","conversation","art","literature"],"mn":"예술, 미술","hk":"art(예술, 미술)는 modern(현대의) art처럼 전시하는 작품. logic(논리), conversation(대화), literature(문학)는 오답.","ex":[["The museum has [[modern art]].","그 박물관에는 [[현대 미술]]이 있다."],["She is studying [[art]] in Paris.","그녀는 파리에서 [[미술]]을 공부하고 있다."],["This room is full of [[works of art]].","이 방은 [[예술 작품]]으로 가득하다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"gentle","a":"2","e":"② harsh: 거친, 가혹한 (그 간호사는 겁먹은 아이에게 부드러운 목소리로 말했다.) / gentle(부드러운, 온화한)의 반의어.","w":"① patient: 참을성 있는\n③ calm: 차분한, 침착한\n④ polite: 예의 바른","k":"그 간호사는 겁먹은 아이에게 부드러운 목소리로 말했다.","m":0,"s":"The nurse spoke to the frightened child in a gentle voice.","h":"gentle","c":["patient","harsh","calm","polite"],"mn":"부드러운, 온화한","hk":"gentle(부드러운)의 반대편은 harsh(거친). calm(차분한), polite(예의 바른), patient(참을성 있는)는 오히려 같은 편에 가까운 속임수.","ex":[["She has a [[gentle voice]].","그녀는 [[부드러운 목소리]]를 가졌다.","gentle (형) 부드러운, 온화한"],["The farmers survived the [[harsh winter]].","농부들은 [[혹독한 겨울]]을 견뎠다.","harsh (형) 거친, 가혹한"],["His [[harsh words]] hurt her.","그의 [[거친 말]]이 그녀를 아프게 했다.","harsh (형) 거친, 가혹한"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"courageous","a":"4","e":"④ 녀는 그 아이디어의 [[공로]]를 인정받을 자격이 있다.","credit (명) 공로, 인정"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"region","a":"1,2","e":"① zone: 지역, 구역 / region(지역, 지방)의 유의어.\n② area: 지역, 구역 (그 나라의 이 지역은 사과와 배를 재배하는 것으로 잘 알려져 있다.) / region(지역, 지방)의 유의어.","w":"③ village: 마을\n④ capital: 수도","k":"그 나라의 이 지역은 사과와 배를 재배하는 것으로 잘 알려져 있다.","m":2,"s":"This region of the country is well known for growing apples and pears.","h":"region","c":["zone","area","village","capital"],"mn":"지역, 지방","hk":"region(지역)의 같은 편은 zone(구역)과 area(지역). village(마을), capital(수도)은 지역 안의 한 곳이라 오답.","ex":[["This [[region]] gets heavy rain in summer.","이 [[지역]]은 여름에 비가 많이 온다.","region (명) 지역, 지방"],["Slow down in the [[school zone]].","[[어린이 보호 구역]]에서는 속도를 줄여라.","zone (명) 지역, 구역"],["A lot of people live in this [[rural area]].","많은 사람이 이 [[시골 지역]]에 산다.","area (명) 지역, 구역"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"landmark","a":"landmark","e":"landmark 랜드마크, 주요 지형지물","k":"빅벤은 런던에서 가장 유명한 상징적 건축물이며, 매년 수백만 명의 관광객이 그것의 사진을 찍는다.","m":0,"s":"Big Ben is the most famous l______ in London, and millions of tourists take photos of it every year.","mn":"랜드마크, 주요 지형지물","hk":"landmark(랜드마크)는 land(땅)와 mark(표시)가 붙은 합성어. 두 덩어리로 나눠 쓰면 철자 실수 없음.","ex":[["The tower is a famous [[landmark]].","그 탑은 유명한 [[랜드마크]]이다."],["We used a tall tree as a [[landmark]].","우리는 키 큰 나무를 [[길잡이 표지]]로 삼았다."],["Tourists visit every [[historic landmark]].","관광객들은 모든 [[역사적 명소]]를 찾는다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"client","a":"client","e":"client 고객, 의뢰인","k":"그 변호사는 법정 심리가 시작되기 전에 사무실에서 의뢰인을 만났다.","m":0,"s":"The lawyer met his c______ at the office before the court hearing began.","mn":"고객, 의뢰인","hk":"client(의뢰인)는 끝이 -ent. 상점 손님 customer(손님)와 달리 변호사처럼 일을 맡기는 쪽.","ex":[["The designer met a new [[client]] today.","그 디자이너는 오늘 새 [[고객]]을 만났다."],["A good lawyer protects his [[clients]].","좋은 변호사는 자신의 [[의뢰인]]을 보호한다."],["The bank always listens to its [[clients]].","그 은행은 늘 [[고객]]의 말에 귀를 기울인다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"alliance","a":"3","e":"③ alliance: 동맹, 연합 (두 나라는 전쟁 중에 강력한 군사 동맹을 맺었다.)","w":"① settlement: 합의, 정착지\n② conference: 회의, 학회\n④ society: 사회","k":"두 나라는 전쟁 중에 강력한 군사 동맹을 맺었다.","m":0,"s":"The two nations formed a strong military ________ during the war.","c":["settlement","conference","alliance","society"],"mn":"동맹, 연합","hk":"alliance(동맹)는 동사 ally(동맹을 맺다)의 명사. military(군사의) alliance가 짝. settlement(합의), conference(회의), society(사회)는 오답.","ex":[["The two countries signed [[a military alliance]].","두 나라는 [[군사 동맹]]을 맺었다."],["The small countries made [[an alliance]] against the enemy.","작은 나라들은 적에 맞서 [[동맹]]을 맺었다."],["Their [[alliance]] lasted for ten years.","그들의 [[동맹]]은 10년간 지속되었다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"knowledge","a":"2","e":"② knowledge: (사실과 정보 / 한 사람이 얻게 되는 / 공부와 연습을 통해) 지식, 아는 것","w":"① technology: 기술\n③ memory: 기억, 추억\n④ judgment: 판단, 판단력","k":"사실과 정보 / 한 사람이 얻게 되는 / 공부와 연습을 통해","m":0,"s":"\"the facts and information that a person gains through study and practice\"","c":["technology","knowledge","memory","judgment"],"mn":"지식, 아는 것","hk":"knowledge(지식)는 공부와 연습으로 얻는 사실과 정보. 앞의 k는 소리 나지 않아도 꼭 쓰기. memory(기억), judgment(판단)는 오답.","ex":[["Reading builds [[general knowledge]].","독서는 [[일반 상식]]을 쌓아 준다."],["He has [[good knowledge]] of history.","그는 역사에 대한 [[풍부한 지식]]이 있다."],["She shared her [[knowledge]] with us.","그녀는 우리에게 자신의 [[지식]]을 나눠 주었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"hide","a":"2","e":"② expose: 드러내다, 노출시키다 (그 마술사는 탁자 위의 작은 상자를 감추기 위해 검은 천을 사용했다.) / hide(숨기다, 감추다)의 반의어.","w":"① clean: 청소하다, 닦다\n③ decorate: 장식하다\n④ drop: 떨어뜨리다","k":"그 마술사는 탁자 위의 작은 상자를 감추기 위해 검은 천을 사용했다.","m":0,"s":"The magician used a black cloth to hide the small box on the table.","h":"hide","c":["clean","expose","decorate","drop"],"mn":"숨기다, 감추다","hk":"hide(숨기다)의 반대편은 expose(드러내다). 덮으면 hide(숨기다), 벗기면 expose(드러내다). clean(청소하다), decorate(장식하다), drop(떨어뜨리다)는 오답.","ex":[["He tried to [[hide the gift]].","그는 [[선물을 숨기려고]] 했다.","hide (동) 숨기다, 감추다"],["The report will [[expose the truth]].","그 보도는 [[진실을 드러낼]] 것이다.","expose (동) 드러내다, 노출시키다"],["Don't [[expose your skin]] to strong sun.","강한 햇빛에 [[피부를 노출시키지]] 마라.","expose (동) 드러내다, 노출시키다"]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"part","a":"3","e":"①부분 / ②부분 / ③역할, 배역 / ④부분 [③번만 의미가 다름]","k":"①수업 전에 그 이야기의 첫 부분을 읽어 오세요.\n②그 보고서의 마지막 부분은 나의 팀원이 작성했다.\n③그 배우는 새 영화에서 중요한 역할을 맡았다.\n④그 섬의 작은 일부만이 나무로 덮여 있다.","m":0,"c":["Please read the first part of the story before class.","The last part of the report was written by my teammate.","The actor played an important part in the new movie.","Only a small part of the island is covered with trees."],"hc":"part|part|part|part","mn":"부분 / 역할, 배역","hk":"part(부분)는 ③에서만 '역할, 배역'. play a part(역할을 맡다)가 대표 짝. 나머지 ①②④는 전체의 일부.","ex":[["I read the [[first part]] of the book.","나는 그 책의 [[첫 부분]]을 읽었다.","part (명) 부분"],["Cut the cake into four [[parts]].","케이크를 네 [[부분]]으로 잘라라.","part (명) 부분"],["He wants to [[play a part]] in the school play.","그는 학교 연극에서 [[배역을 맡고]] 싶어 한다.","part (명) 역할, 배역"]]}]},{"day":79,"q":[{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"objective","a":"3","e":"③ subjective: 주관적인 (역사가는 객관적인 태도를 유지하고 사건을 일어난 그대로 서술해야 한다.) / objective(객관적인)의 반의어.","w":"① logical: 논리적인\n② honest: 정직한\n④ creative: 창의적인","k":"역사가는 객관적인 태도를 유지하고 사건을 일어난 그대로 서술해야 한다.","m":0,"s":"A historian must stay objective and describe events exactly as they happened.","h":"objective","c":["logical","honest","subjective","creative"],"mn":"객관적인","hk":"objective(객관적인)의 반대편은 subjective(주관적인). 철자 끝이 같고 앞부분만 다름. logical(논리적인), honest(정직한), creative(창의적인)는 오답.","ex":[["A judge must be [[objective]].","판사는 [[객관적이어야]] 한다.","objective (형) 객관적인"],["Taste in music is very [[subjective]].","음악 취향은 매우     for(let d=w*6+1;d<=Math.min(N,w*6+6);d++){
      const x=S.done[d];
      h+='<button class="day'+(x?' done':'')+(!T&&d===nxt?' next':'')+(T&&!T.pre&&d===T.day&&T.isHw&&!x?' today':'')+(T&&!T.pre&&d<=T.day&&!x&&!(d===T.day&&T.isHw)?' late':'')+'" data-day="'+d+'"><b>'+d+'일</b>'+(x?'<span class="stamp">'+x.s+'</span><small>'+dstr(x.t)+'</small>':'')+'</button>';
    }
    h+='</div>';
  }
  h+='<div class="row"><button class="btn" id="bw"'+(wn?'':' disabled')+'>오답노트 ('+wn+')</button><button class="btn" id="bs"'+(sn?'':' disabled')+'>별표 모아 풀기 ('+sn+')</button></div>';
  $.innerHTML=h;
  $.querySelectorAll('.day').forEach(b=>b.onclick=()=>startDay(+b.dataset.day));
  document.getElementById('bw').onclick=()=>startList('wrong');
  document.getElementById('bs').onclick=()=>startList('star');
}
function startDay(d){
  const set=D.sets[d-1];
  const pr=!!S.done[d];let i=0,res=[];
  if(!pr&&S.cur&&S.cur.day===d){i=S.cur.i;res=S.cur.res}
  R={mode:'day',day:d,list:set.q.slice(),i:i,res:res,round:1,prac:pr};
  if(i>=set.q.length){result();return}
  quiz();
}
function startList(m){
  const ids=Object.keys(m==='wrong'?S.wrong:S.star).sort((a,b)=>{const [d1,n1]=a.split('-').map(Number),[d2,n2]=b.split('-').map(Number);return d1-d2||n1-n2});
  const list=ids.map(id=>QS[id]).filter(Boolean);
  if(!list.length){home();return}
  R={mode:m,list:list,i:0,res:[],round:1};
  quiz();
}
function title(){
  if(R.mode==='day')return R.day+'일'+(R.prac?' · 연습':'')+(R.round===2?' · 다시 풀기':'');
  return R.mode==='wrong'?'오답노트':'별표 모음';
}
function quiz(){
  const q=R.list[R.i];
  const multi=q.m>1,sub=q.f==='주관식';
  let h='<div class="top"><button class="sbtn" id="bh">홈</button><div class="t">'+title()+' · '+(R.i+1)+' / '+R.list.length+'</div><button class="sbtn'+(S.star[q.id]?' on':'')+'" id="bst">별표</button></div>';
  h+='<div class="card"><span class="tag">'+esc(q.tn)+'</span><p class="prompt">'+esc(q.p)+'</p>';
  if(sub&&q.s&&q.s.indexOf('\n')>=0){const ss=q.s.split('\n'),kk=(q.k||'').split('\n');h+='<div class="pair">'+ss.map((s,i)=>'<div class="sent"><span class="no">'+(i+1)+'</span><div><div class="en">'+esc(s)+'</div>'+(kk[i]?'<div class="ko">'+esc(kk[i])+'</div>':'')+'</div></div>').join('')+'</div>'}
  else{if(q.s)h+='<div class="stem">'+hl(q.s,q.h)+'</div>';
  if(sub&&q.k)h+='<div class="kr">'+esc(q.k).replace(/\n/g,'<br>')+'</div>';}
  if(sub){h+='<input class="tx" id="tx" type="text" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false"><div id="fbk"></div><button class="btn pri nb" id="ok">확인</button>'}
  else{
    const hs=q.hc?q.hc.split('|'):[];
    q.c.forEach((c,k)=>{h+='<button class="ch" data-k="'+(k+1)+'"><span class="n">'+CN[k]+'</span><span>'+hl(c,hs[k])+'</span></button>'});
    h+='<div id="fbk"></div>';
    if(multi)h+='<button class="btn pri nb" id="ok" disabled>확인</button>';
  }
  h+='</div>';
  $.innerHTML=h;
  window.scrollTo(0,0);
  document.getElementById('bh').onclick=home;
  document.getElementById('bst').onclick=e=>{if(S.star[q.id])delete S.star[q.id];else S.star[q.id]=1;save();e.target.classList.toggle('on',!!S.star[q.id])};
  if(sub){
    const tx=document.getElementById('tx'),ok=document.getElementById('ok');
    const go=()=>{if(!tx.value.trim())return;const n=s=>s.trim().toLowerCase().replace(/\s+/g,' ');const v=n(tx.value);const accept=[q.a].concat(q.al?q.al.split('|'):[]).map(n);const r=accept.indexOf(v)>=0;tx.disabled=true;tx.classList.add(r?'ok':'ng');ok.style.display='none';judged(q,r,q.a)};
    ok.onclick=go;tx.onkeydown=e=>{if(e.key==='Enter')go()};
  } else if(multi){
    const sel=new Set(),ok=document.getElementById('ok');
    $.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const k=+b.dataset.k;if(sel.has(k))sel.delete(k);else sel.add(k);b.classList.toggle('sel',sel.has(k));ok.disabled=!sel.size});
    ok.onclick=()=>{const ans=q.a.split(',').map(Number);const r=ans.length===sel.size&&ans.every(a=>sel.has(a));$.querySelectorAll('.ch').forEach(b=>{const k=+b.dataset.k;b.disabled=true;b.classList.remove('sel');if(ans.indexOf(k)>=0)b.classList.add('ok');else if(sel.has(k))b.classList.add('ng')});ok.style.display='none';judged(q,r)};
  } else {
    $.querySelectorAll('.ch').forEach(b=>b.onclick=()=>{const k=+b.dataset.k,a=+q.a;$.querySelectorAll('.ch').forEach(x=>{x.disabled=true;if(+x.dataset.k===a)x.classList.add('ok')});if(k!==a)b.classList.add('ng');judged(q,k===a)});
  }
  if(sub)document.getElementById('tx').focus();
}
function mk(s){return esc(s).replace(/\[\[(.+?)\]\]/g,'<mark>$1</mark>')}
function card(q,r,showAns){
  let ans;
  if(q.f==='주관식')ans=q.a;
  else ans=q.a.split(',').map(n=>{const c=q.c[+n-1]||'';return CN[+n-1]+(q.t==='POLY'||c.length>34?'':' '+c)}).join(', ');
  let h='<div class="fc '+(r?'ok':'ng')+'"><div class="head"><span>'+(r?'정답':'오답')+'</span><span class="ans">'+esc(ans)+'</span></div><div class="body">';
  h+='<div><h4>정답 풀이</h4>';
  if(q.e){let e=q.e;if(q.t==='REL'){const L=e.split('\n');if(L.length>1&&!/^[①-⑤]/.test(L[0]))L[0]='문제  '+L[0];e=L.join('\n')}h+='<div class="tx2 key">'+esc(e)+'</div>'}
  if(q.w)h+='<div class="tx2 oth">'+esc(q.w)+'</div>';
  if(q.k&&(!q.e||q.e.indexOf(q.k)<0))h+='<h4>해석</h4><div class="tx2">'+esc(q.k)+'</div>';
  h+='</div>';
  h+='<div class="note"><span class="lab">'+(r?'기억 한 줄':'이것만 챙기기')+'</span><p>'+esc(q.hk)+'</p></div>';
  h+='<div><h4>이렇게 쓰여요</h4><div class="exs">';
  q.ex.forEach(e=>{h+='<div class="e">'+(e[2]?'<div class="lb">'+esc(e[2])+'</div>':'')+'<div class="en">'+mk(e[0])+'</div><div class="ko">'+mk(e[1])+'</div></div>'});
  h+='</div></div></div></div>';
  return h;
}
function judged(q,r,showAns){
  if(R.round===1){
    R.res[R.i]=r?1:0;
    if(R.mode==='day'&&!R.prac){S.cur={day:R.day,i:R.i+1,res:R.res.slice()}}if(R.mode==='day'){S.pg=S.pg||{};if(!S.pg[R.day]&&!S.done[R.day]){S.pg[R.day]=1;WN.hw(D.level,R.day,'진행중')}}
    if(R.prac){}else if(r){const w=S.wrong[q.id];if(w){w.s=(w.s||0)+1;if(w.s>=2)delete S.wrong[q.id]}}
    else{S.wrong[q.id]={s:0};if(q.mn)WN.add([{w:q.wb||q.wd,m:q.mn,src:'데일리보카',how:'문제 오답',ask:false,q:'b:'+q.id}])}
    save();
  } else R.res[R.i]=r?1:0;
  let h;
  if(q.hk&&q.ex&&q.ex.length){h=card(q,r,showAns)}
  else{
  h='<div class="fb '+(r?'ok':'ng')+'"><h3>'+(r?'정답':'오답')+(!r&&showAns?' · 정답: '+esc(showAns):'')+'</h3>';
  if(q.e)h+='<div class="x">'+esc(q.e)+'</div>';
  if(q.w)h+='<div class="x" style="margin-top:8px">'+esc(q.w)+'</div>';
  if(q.k&&(!q.e||q.e.indexOf(q.k)<0))h+='<div class="l">해석</div><div class="x">'+esc(q.k)+'</div>';
  h+='</div>';
  }
  h+='<button class="btn pri nb" id="nx">'+(R.i+1>=R.list.length?'결과 보기':'다음')+'</button>';
  document.getElementById('fbk').innerHTML=h;
  document.getElementById('nx').onclick=()=>{R.i++;if(R.i>=R.list.length)result();else quiz()};
  document.getElementById('nx').scrollIntoView({block:'nearest'});
}
function result(){
  const tot=R.list.length,ok=R.res.reduce((a,b)=>a+b,0);
  const wrongQ=R.list.filter((q,i)=>!R.res[i]);
  let h='<h1>'+title()+'</h1><div class="score">'+ok+' / '+tot+'</div>';
  if(R.mode==='day'){
    if(R.round===1){R.first=ok;if(!R.prac&&!S.done[R.day]){S.done[R.day]={s:ok+'/15',t:Date.now(),dt:new Date(Date.now()+324e5).toISOString().slice(0,10)};S.cur=null;save();WN.hw(D.level,R.day,ok+'/15');h+='<div style="text-align:center;font-size:13px;color:#6b7480;margin:-4px 0 10px">기록됨 · 1차 점수</div>'}}
    if(R.round===1&&wrongQ.length){
      h+=wlist(wrongQ)+'<button class="btn pri nb" id="rt">틀린 문제 다시 풀기</button><button class="btn nb" id="hm">홈으로</button>';
      save();$.innerHTML=h;
      document.getElementById('rt').onclick=()=>{R.list=wrongQ;R.i=0;R.res=[];R.round=2;quiz()};
      document.getElementById('hm').onclick=home;return;
    }
    if(!R.prac&&!S.done[R.day]){S.done[R.day]={s:R.first+'/15',t:Date.now(),dt:new Date(Date.now()+324e5).toISOString().slice(0,10)};S.cur=null;
    save();WN.hw(D.level,R.day,R.first+'/15')}
    if(wrongQ.length)h+=wlist(wrongQ);
    h+='<button class="btn pri nb" id="hm">홈으로</button>';
  } else {
    if(wrongQ.length)h+=wlist(wrongQ);
    h+='<button class="btn pri nb" id="hm">홈으로</button>';
  }
  $.innerHTML=h;document.getElementById('hm').onclick=home;
}
function wlist(l){return '<div class="card"><ul class="wl">'+l.map(q=>'<li><b>'+esc(q.wd)+'</b> · '+esc(q.tn)+'</li>').join('')+'</ul></div>'}
(function(){var oh=home,oq=quiz,orr=result,sub=false;
function enter(){if(!sub){try{history.pushState({sub:1},'')}catch(e){return}sub=true}}
home=function(){if(sub){history.back();return}oh()};
quiz=function(){enter();oq.apply(this,arguments)};
result=function(){enter();orr.apply(this,arguments)};
window.addEventListener('popstate',function(){if(sub){sub=false;oh()}});
})();
WN.gate(function(){KEY='dv_'+D.level+'_'+WN.name();try{S=JSON.parse(localStorage.getItem(KEY))||{}}catch(e){S={}}S.done=S.done||{};S.wrong=S.wrong||{};S.star=S.star||{};home();var _q=/[?&]day=(\d+)/.exec(location.search);if(_q){var _d=+_q[1];if(_d>=1&&_d<=N){startDay(_d)}}function nsc(v){v=String(v==null?'':v);if(/^\d+\/\d+$/.test(v))return v;if(/GMT|\d{4}-\d\d-\d\dT/.test(v)){var d=new Date(v);if(!isNaN(d))return(d.getMonth()+1)+'/'+d.getDate()}return v}WN.hwget().then(function(L){var ch=0;Object.keys(S.done).forEach(function(k){var d=S.done[k];if(d&&d.s){var z=nsc(d.s);if(z!==d.s){d.s=z;ch=1}}});L.forEach(function(x){if(x.level===D.level&&x.score&&x.score!=='진행중'&&!S.done[x.day]){S.done[x.day]={s:nsc(x.score),t:Date.now()};ch=1}});if(ch){save();if(!R)home()}})});
</script>
