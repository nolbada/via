57 b","ev":"5~6번 문장","s":[[5,"Even though this planet is as big as Jupiter, it’s much lighter.","비록 이 행성은 목성만큼 크지만, 훨씬 더 가볍다."],[6,"It’s so light that it would float in a huge bathtub of water!","그것은 아주 가벼워서 거대한 욕조 물 위에 뜰 것이다!"]],"w":"5번에서 this planet은 목성만큼 크지만 훨씬 더 가볍다고 했고, 6번의 It's so light에서 it은 그 행성. 물 위에 뜨는 것은 욕조가 아니라 행성.","c":2},"h":"941bd00425"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s because they thought it was hard for giant planets to form around red dwarf stars.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 거대 행성이 적색 왜성 주변에서 형성되기 어렵다고 생각했기 때문이다.","opts":["그것은 천문학자들이 적색 왜성을 찾지 못했기 때문이다.","그것은 거대 행성이 적색 왜성 주변에서 흔하다고 생각했기 때문이다.","그것은 천문학자들이 이 행성을 만들 수 있다고 생각했기 때문이다.","그것은 천문학자들이 거대 행성이 적색 왜성 주변에서 형성되기 어렵다고 생각했기 때문이다."],"r":{"a":"4) 그것은 천문학자들이 거대 행성이 적색 왜성 주변에서 형성되기 어렵다고 생각했기 때문이다.","ev":"8번 문장","s":[[8,"That’s because they thought it was hard for giant planets to form around red dwarf stars.","그들은 거대 행성이 적색 왜성 주변에서 형성되기 어렵다고 생각했기 때문이다."]],"w":"That’s because(그것은 ~ 때문이다) they thought it was hard for giant planets to form(거대 행성이 형성되기 어렵다고 생각했다) around red dwarf stars. 흔하다고 생각했다면 발견이 놀랍지 않았을 것.","c":4},"h":"aee25d9b13"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["TOI-3757 b 안에는 지구가 1,300개 이상 들어갈 수 있다.","TOI-3757 b는 지구보다 작다.","천문학자들은 TOI-3757 b를 텍사스에서 발견했다.","TOI-3757 b는 욕조의 물에 가라앉을 것이다."],"opts":["More than 1,300 Earths could fit inside TOI-3757 b.","TOI-3757 b is smaller than Earth.","Astronomers found TOI-3757 b in Texas.","TOI-3757 b would sink in a bathtub of water."],"r":{"a":"1) More than 1,300 Earths could fit inside TOI-3757 b.","ev":"4번 문장","s":[[4,"In other words, this “marshmallow” is so huge that it could fit more than 1,300 Earths inside!","다시 말해, 이 '마시멜로'는 너무 거대해서 그 안에 지구가 1,300개 이상 들어갈 수 있다!"]],"w":"4번 문장: 이 행성 안에 지구가 1,300개 이상 들어갈 수 있음. 지구보다 작지 않고(3~4번), 발견한 사람들은 애리조나의 천문학자들(1번)이며, 6번에서 욕조 물 위에 뜬다고 했으므로 나머지는 틀림.","c":1},"h":"e5026f05ab"},{"n":9,"t":"sum","q":"Finding TOI-3757 b was a (A) to astronomers, because until now they have found giant planets only (B) from red dwarf stars.","ko":"TOI-3757 b의 발견은 천문학자들에게 (A)였는데, 지금까지는 거대 행성을 적색 왜성에서 (B) 떨어진 곳에서만 찾았기 때문이다.","oko":["(A) 문제 / (B) 가까이","(A) 놀라운 일 / (B) 가까이","(A) 문제 / (B) 멀리","(A) 목표 / (B) 가까이","(A) 놀라운 일 / (B) 멀리"],"opts":["(A) problem / (B) near","(A) surprise / (B) near","(A) problem / (B) far","(A) goal / (B) near","(A) surprise / (B) far"],"r":{"a":"5) (A) surprise / (B) far","ev":"7, 9번 문장","s":[[7,"To discover TOI-3757 b is a surprise to astronomers.","TOI-3757 b를 발견한 것은 천문학자들에게 놀라운 일이다."],[9,"Until now, astronomers have only been able to find giant Jupiter-sized planets far away from red dwarf stars.","지금까지 천문학자들은 적색 왜성에서 멀리 떨어진 곳에서만 목성 크기의 거대 행성을 발견할 수 있었다."]],"w":"7번에서 발견은 천문학자들에게 a surprise(놀라운 일)라고 하고, 9번에서 지금까지는 적색 왜성에서 far away(멀리 떨어진 곳)에서만 거대 행성을 찾았다고 함. 그래서 가까이에서 발견된 이번이 놀라운 것.","c":5},"h":"08b3dfd8b4"},{"n":10,"t":"fill","q":"Astronomers want to find more systems with [A] planets to understand how planets [B].","ko":"천문학자들은 행성이 어떻게 [B]하는지 이해하기 위해 [A] 행성이 있는 행성계를 더 찾고 싶어 한다.","bko":{"giant":"거대한","form":"형성되다","fit":"들어가다","surprise":"놀라운 일","goal":"목표","bathtub":"욕조"},"bank":["giant","form","fit","surprise","goal","bathtub"],"r":{"a":"[A] giant, [B] form","ev":"10번 문장","s":[[10,"Finding more such systems with giant planets is part of their goal to understand how planets form.","이처럼 거대 행성을 가진 행성계를 더 많이 발견하는 것은 행성이 어떻게 형성되는지 이해하려는 그들의 목표의 일부이다."]],"w":"10번 문장: Finding more such systems with giant planets(거대 행성이 있는 행성계를 더 찾는 것)는 how planets form(행성이 어떻게 형성되는지) 이해하려는 목표의 일부. fit(들어가다)은 4번에서 지구가 들어간다는 말에 쓰인 단어.","c":null},"h":"aa158d668a"}]},{"u":9,"id":"rg4-09-2","no":2,"ko":"70년 전 당근이 더 영양이 많았다고?","items":[{"n":1,"t":"tf","q":"A carrot grown today has lower nutrient levels than a carrot from 70 years ago.","ko":"오늘날 재배되는 당근은 70년 전의 당근보다 영양소 수준이 더 낮다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"If you compare a carrot from 70 years ago with one that is grown today, you’ll find that today’s carrot has lower nutrient levels than its ancestor.","70년 전의 당근과 오늘날 재배되는 당근을 비교해 보면, 오늘날의 당근이 그것의 조상보다 더 낮은 영양소 수준을 가지고 있다는 것을 알게 될 것이다."]],"w":"2번 문장에서 today’s carrot has lower nutrient levels than its ancestor(오늘날의 당근이 조상보다 더 낮은 영양소 수준을 가진다)라고 함. 본문과 일치.","c":"T"},"h":"ecee55f5f4"},{"n":2,"t":"tf","q":"The major reason is that farmers now grow food slowly and carefully.","ko":"가장 주요한 이유는 농부들이 이제 식량을 천천히 신중하게 재배한다는 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The major reason is that farmers now focus on growing lots of food quickly.","가장 주요한 이유는 농부들이 이제 많은 식량을 빠르게 재배하는 데 주력한다는 것이다."]],"w":"4번 문장에서 농부들이 now focus on growing lots of food quickly(많은 식량을 빠르게 재배하는 데 주력한다)고 함. 천천히 신중하게라는 말은 반대.","c":"F"},"h":"e20afb483f"},{"n":3,"t":"tf","q":"Farmers should avoid a farming method that takes away minerals.","ko":"농부들은 미네랄을 없애는 농작법을 피해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Also, farmers should avoid a farming method that takes away minerals.","또한 농부들은 미네랄을 없애는 농작법을 피해야 한다."]],"w":"9번 문장에 farmers should avoid a farming method that takes away minerals가 나옴. 본문과 일치.","c":"T"},"h":"e8a464aabd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…today’s carrot has lower nutrient levels than its ancestor.)","ko":"(…오늘날의 당근이 그것의 ( )보다 더 낮은 영양소 수준을 가지고 있다.)","opts":["후손","조상","농부","이웃"],"word":"ancestor","r":{"a":"2) 조상","ev":"2번 문장","s":[[2,"If you compare a carrot from 70 years ago with one that is grown today, you’ll find that today’s carrot has lower nutrient levels than its ancestor.","70년 전의 당근과 오늘날 재배되는 당근을 비교해 보면, 오늘날의 당근이 그것의 조상보다 더 낮은 영양소 수준을 가지고 있다는 것을 알게 될 것이다."]],"w":"2번에서 70년 전의 당근과 오늘날의 당근을 비교하는데, 오늘날 당근의 ancestor는 오래전의 당근. 먼저 있었던 쪽이라 ancestor = 조상.","c":2},"h":"9292c35784"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…when farmers grow too much food in the same soil, it can damage the soil.)","ko":"(…농부들이 같은 토양에서 너무 많은 식량을 재배하면, 그것이 토양을 ( ) 수 있다.)","opts":["비옥하게 하다","옮기다","손상을 주다","쉬게 하다"],"word":"damage","r":{"a":"3) 손상을 주다","ev":"6번 문장","s":[[6,"Another reason is that when farmers grow too much food in the same soil, it can damage the soil.","또 다른 이유는 농부들이 같은 토양에서 너무 많은 식량을 재배하면 그것이 토양을 손상시킬 수 있다는 것이다."]],"w":"6번에서 같은 땅에서 너무 많이 재배하는 것이 토양에 어떤 영향을 주는지를 말하고, 7번에서 식물이 건강하게 자라기 어렵다고 함. 나쁜 영향을 주는 것이라 damage = 손상을 주다. 쉬게 하는 것은 8번의 해결책(rest).","c":3},"h":"e88db1c709"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt means plants can’t get enough nutrients from the soil or make their own nutrients.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 식물들이 토양으로부터 충분한 영양소를 얻을 수 없거나 스스로 영양소를 만들 수 없다는 것을 의미한다.","opts":["영양소 수준이 낮아진 것","토양을 쉬게 하는 것","농부들이 비타민을 먹는 것","농부들이 많은 식량을 빠르게 재배하는 데 주력하는 것"],"r":{"a":"4) 농부들이 많은 식량을 빠르게 재배하는 데 주력하는 것","ev":"4~5번 문장","s":[[4,"The major reason is that farmers now focus on growing lots of food quickly.","가장 주요한 이유는 농부들이 이제 많은 식량을 빠르게 재배하는 데 주력한다는 것이다."],[5,"It means plants can’t get enough nutrients from the soil or make their own nutrients.","그것은 식물들이 토양으로부터 충분한 영양소를 얻을 수 없거나 스스로 영양소를 만들 수 없다는 것을 의미한다."]],"w":"4번에서 농부들이 now focus on growing lots of food quickly(많은 식량을 빠르게 재배하는 데 주력한다)고 하고, 5번 It means ...는 바로 그 내용이 의미하는 바를 설명함. 토양을 쉬게 하는 것은 8번의 해결책.","c":4},"h":"d2a0dda630"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This makes it difficult for the plants to grow healthy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 식물들이 건강하게 자라는 것을 어렵게 만든다.","opts":["이것 때문에 식물들이 건강하게 자라기가 어려워진다.","이것 때문에 식물들이 더 쉽게 자란다.","이것은 식물들이 건강한 이유를 설명한다.","이것 때문에 농부들이 건강하게 일하기 어려워진다."],"r":{"a":"1) 이것 때문에 식물들이 건강하게 자라기가 어려워진다.","ev":"6~7번 문장","s":[[6,"Another reason is that when farmers grow too much food in the same soil, it can damage the soil.","또 다른 이유는 농부들이 같은 토양에서 너무 많은 식량을 재배하면 그것이 토양을 손상시킬 수 있다는 것이다."],[7,"This makes it difficult for the plants to grow healthy.","이것은 식물들이 건강하게 자라는 것을 어렵게 만든다."]],"w":"This는 6번에서 말한 토양 손상. makes it difficult for the plants to grow healthy = 식물이 건강하게 자라기 어렵게 만든다. 농부의 건강 이야기는 없음.","c":1},"h":"18b0c985e8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["식물은 필요한 영양소를 모두 스스로 만들 수 있다.","오늘날의 당근에는 70년 전의 당근보다 영양소가 더 많다.","문제를 해결하려면 농부들이 토양을 쉬게 해야 한다.","해마다 같은 식물만 키우면 토양이 더 좋아진다."],"opts":["Plants can make all the nutrients they need by themselves.","Today’s carrots have more nutrients than carrots from 70 years ago.","Farmers should let the soil rest to fix the problem.","Growing the same plants every year makes the soil better."],"r":{"a":"3) Farmers should let the soil rest to fix the problem.","ev":"8번 문장","s":[[8,"To fix this problem, the first thing to do is to let the soil rest.","이 문제를 해결하기 위해, 가장 먼저 해야 할 일은 토양을 쉬게 하는 것이다."]],"w":"8번 문장: To fix this problem, the first thing to do is to let the soil rest. 5번에서 식물은 스스로 영양소를 만들 수 없다고 했고, 2번에서 오늘날 당근이 영양소가 적다고 했으며, 10번에서 식물 종류를 바꿔야 토양이 좋아진다고 했으므로 나머지는 틀림.","c":3},"h":"9c73ca665c"},{"n":9,"t":"sum","q":"Today’s fruits and vegetables have fewer nutrients because farmers grow food (A) and (B) the soil.","ko":"오늘날의 과일과 채소는 농부들이 식량을 (A) 재배하고 토양을 (B)해서 영양소가 더 적다.","oko":["(A) 천천히 / (B) 보호","(A) 빠르게 / (B) 보호","(A) 천천히 / (B) 손상","(A) 조심스럽게 / (B) 손상","(A) 빠르게 / (B) 손상"],"opts":["(A) slowly / (B) protect","(A) quickly / (B) protect","(A) slowly / (B) damage","(A) carefully / (B) damage","(A) quickly / (B) damage"],"r":{"a":"5) (A) quickly / (B) damage","ev":"4, 6번 문장","s":[[4,"The major reason is that farmers now focus on growing lots of food quickly.","가장 주요한 이유는 농부들이 이제 많은 식량을 빠르게 재배하는 데 주력한다는 것이다."],[6,"Another reason is that when farmers grow too much food in the same soil, it can damage the soil.","또 다른 이유는 농부들이 같은 토양에서 너무 많은 식량을 재배하면 그것이 토양을 손상시킬 수 있다는 것이다."]],"w":"4번에서 농부들이 많은 식량을 quickly(빠르게) 재배하는 데 주력한다고 하고, 6번에서 같은 토양에서 너무 많이 재배하면 토양을 damage(손상)할 수 있다고 함. 천천히, 조심스럽게, 보호는 본문과 반대.","c":5},"h":"673311581c"},{"n":10,"t":"fill","q":"To fix the problem, farmers should let the soil [A], avoid a method that takes away minerals, and [B] the types of plants to grow.","ko":"문제를 해결하기 위해 농부들은 토양을 [A]하게 하고, 미네랄을 없애는 농작법을 피하고, 재배할 식물의 종류를 [B]해야 한다.","bko":{"rest":"쉬다","change":"바꾸다","damage":"손상을 주다","compare":"비교하다","focus":"주력하다","vitamin":"비타민"},"bank":["rest","change","damage","compare","focus","vitamin"],"r":{"a":"[A] rest, [B] change","ev":"8~10번 문장","s":[[8,"To fix this problem, the first thing to do is to let the soil rest.","이 문제를 해결하기 위해, 가장 먼저 해야 할 일은 토양을 쉬게 하는 것이다."],[9,"Also, farmers should avoid a farming method that takes away minerals.","또한 농부들은 미네랄을 없애는 농작법을 피해야 한다."],[10,"Instead, changing the types of plants to grow can make the soil better for the next crops.","대신에, 재배할 식물의 종류를 바꾸는 것은 다음 농작물을 위해 토양을 더 좋게 만들 수 있다."]],"w":"8번: let the soil rest(토양을 쉬게 하다), 9번: avoid a farming method that takes away minerals(미네랄을 없애는 농작법을 피하다), 10번: changing the types of plants(식물의 종류를 바꾸다). damage(손상을 주다)는 6번에서 문제의 원인으로 나온 말이라 해결책에 맞지 않음.","c":null},"h":"a430b0f538"}]},{"u":9,"id":"rg4-09-3","no":3,"ko":"대변으로 환자를 치료한다고?","items":[{"n":1,"t":"tf","q":"The new method puts healthy bacteria from a healthy person’s poo into a sick person’s gut.","ko":"새로운 방법은 건강한 사람의 대변에서 얻은 건강한 박테리아를 아픈 사람의 장에 넣는다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This unusual method involves taking healthy bacteria from a healthy person’s poo and putting them into a sick person’s gut.","이 특이한 방법은 건강한 사람의 대변에서 건강한 박테리아를 가져와 아픈 사람의 장에 넣는 것을 포함한다."]],"w":"3번 문장에 taking healthy bacteria from a healthy person’s poo and putting them into a sick person’s gut이 나옴. 본문과 일치.","c":"T"},"h":"b33d5f8fd6"},{"n":2,"t":"tf","q":"The treatment is mainly for patients who have never had a bone marrow transplant.","ko":"이 치료법은 주로 골수 이식을 한 번도 받지 않은 환자들을 위한 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The treatment is particularly aimed at patients who have had bone marrow transplants.","이 치료법은 특히 골수 이식을 받은 환자들을 대상으로 한다."]],"w":"5번 문장에서 patients who have had bone marrow transplants(골수 이식을 받은 환자들)를 대상으로 한다고 함. 한 번도 받지 않은 환자라는 말은 반대.","c":"F"},"h":"b60a441152"},{"n":3,"t":"tf","q":"Many patients with the side effect stay in the hospital for a long time.","ko":"부작용이 있는 많은 환자들은 오랫동안 병원에 머문다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Many patients with this side effect end up in the hospital for a long time.","이 부작용이 있는 많은 환자들은 결국 오랫동안 병원에 입원하게 된다."]],"w":"8번 문장에 Many patients with this side effect end up in the hospital for a long time이 나옴. 본문과 일치.","c":"T"},"h":"76a82ad8f9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The treatment is particularly aimed at patients who have had bone marrow transplants.)","ko":"(이 치료법은 ( ) 골수 이식을 받은 환자들을 대상으로 한다.)","opts":["거의","가끔","특히","결코"],"word":"particularly","r":{"a":"3) 특히","ev":"5번 문장","s":[[5,"The treatment is particularly aimed at patients who have had bone marrow transplants.","이 치료법은 특히 골수 이식을 받은 환자들을 대상으로 한다."]],"w":"4번까지 치료법의 효과를 말한 뒤, 5번에서 그중 가장 중요한 대상은 골수 이식을 받은 환자들이라고 좁혀 줌. 여러 환자 중에서 콕 집어 말하는 표현이라 particularly = 특히.","c":3},"h":"51e384c8d3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…to make the treatment safe and effective.)","ko":"(…치료법을 안전하고 ( ) 만들기 위해…)","opts":["위험한","효과적인","비싼","낯선"],"word":"effective","r":{"a":"2) 효과적인","ev":"10번 문장","s":[[10,"The scientists have been working hard so that they can make the treatment safe and effective.","과학자들은 그 치료법을 안전하고 효과적으로 만들 수 있도록 열심히 연구해 왔다."]],"w":"10번에서 과학자들이 치료법을 safe and effective하게 만들려고 열심히 연구함. safe(안전한)와 함께 나오는 좋은 뜻이라 effective = 효과적인.","c":2},"h":"8857adecdf"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis can improve a person’s immune system and help fight diseases.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 사람의 면역 체계를 향상시킬 수 있고 질병과 싸우는 것을 도울 수 있다.","opts":["건강한 사람의 대변에서 건강한 박테리아를 꺼내 아픈 사람의 장에 넣는 것","혈액암에 걸리는 것","골수 이식 수술","병원에 입원하는 것"],"r":{"a":"1) 건강한 사람의 대변에서 건강한 박테리아를 꺼내 아픈 사람의 장에 넣는 것","ev":"3~4번 문장","s":[[3,"This unusual method involves taking healthy bacteria from a healthy person’s poo and putting them into a sick person’s gut.","이 특이한 방법은 건강한 사람의 대변에서 건강한 박테리아를 가져와 아픈 사람의 장에 넣는 것을 포함한다."],[4,"This can improve a person’s immune system and help fight diseases.","이것은 사람의 면역 체계를 향상시킬 수 있고 질병과 싸우는 것을 도울 수 있다."]],"w":"3번에서 건강한 박테리아를 건강한 사람의 대변에서 가져와 아픈 사람의 장에 넣는 방법을 설명했고, 4번 This can improve a person’s immune system은 그 방법의 효과를 말함.","c":1},"h":"5033d02a97"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Although a bone marrow transplant is common for some cancers, it can sometimes cause a serious side effect.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 골수 이식이 일부 암에는 흔하지만, 그것은 때때로 심각한 부작용을 일으킬 수 있다.","opts":["골수 이식은 일부 암에서 흔하지만 때로는 심각한 부작용을 일으킬 수 있다.","골수 이식은 모든 암에서 드물고 부작용이 전혀 없다.","골수 이식은 일부 암에서 드물지만 부작용이 없다.","골수 이식은 흔해서 때로는 아무 문제도 일으키지 않는다."],"r":{"a":"1) 골수 이식은 일부 암에서 흔하지만 때로는 심각한 부작용을 일으킬 수 있다.","ev":"6번 문장","s":[[6,"Although a bone marrow transplant is common for some cancers, it can sometimes cause a serious side effect.","비록 골수 이식이 일부 암에는 흔하지만, 그것은 때때로 심각한 부작용을 일으킬 수 있다."]],"w":"Although a bone marrow transplant is common(비록 흔하지만) ... it can sometimes cause a serious side effect(때로는 심각한 부작용을 일으킬 수 있다). Although는 앞뒤가 대조되는 연결어라 흔하지만 부작용도 있다는 뜻.","c":1},"h":"cd9b23dc67"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["새로운 치료법은 이미 모든 병원에서 쓰인다.","대변은 환자의 혈액에 직접 넣는다.","새로운 치료법은 골수 이식을 받은 환자들을 대상으로 한다.","새로운 치료법은 환자의 면역 체계를 약화시킨다."],"opts":["The new treatment is already used in every hospital.","Poo is put directly into the patient’s blood.","The new treatment is aimed at patients who have had bone marrow transplants.","The new treatment makes a patient’s immune system weaker."],"r":{"a":"3) The new treatment is aimed at patients who have had bone marrow transplants.","ev":"5번 문장","s":[[5,"The treatment is particularly aimed at patients who have had bone marrow transplants.","이 치료법은 특히 골수 이식을 받은 환자들을 대상으로 한다."]],"w":"5번 문장: 치료법은 골수 이식을 받은 환자들을 대상으로 함. 10번에서 아직 안전하고 효과적으로 만드는 중이고, 3번에서 장에 넣는다고 했으며, 9번에서 면역 체계를 약화시키지 않는다고 했으므로 나머지는 틀림.","c":3},"h":"29cb686306"},{"n":9,"t":"sum","q":"Healthy bacteria from a healthy person’s poo are put into a sick person’s (A) to improve the (B) system.","ko":"건강한 사람의 대변에서 얻은 건강한 박테리아를 아픈 사람의 (A)에 넣어 (B) 체계를 향상시킨다.","oko":["(A) 피부 / (B) 면역","(A) 피부 / (B) 신경","(A) 장 / (B) 신경","(A) 혈액 / (B) 신경","(A) 장 / (B) 면역"],"opts":["(A) skin / (B) immune","(A) skin / (B) nervous","(A) gut / (B) nervous","(A) blood / (B) nervous","(A) gut / (B) immune"],"r":{"a":"5) (A) gut / (B) immune","ev":"3~4번 문장","s":[[3,"This unusual method involves taking healthy bacteria from a healthy person’s poo and putting them into a sick person’s gut.","이 특이한 방법은 건강한 사람의 대변에서 건강한 박테리아를 가져와 아픈 사람의 장에 넣는 것을 포함한다."],[4,"This can improve a person’s immune system and help fight diseases.","이것은 사람의 면역 체계를 향상시킬 수 있고 질병과 싸우는 것을 도울 수 있다."]],"w":"3번에서 건강한 박테리아를 아픈 사람의 gut(장)에 넣는다고 하고, 4번에서 그것이 immune system(면역 체계)을 향상시킬 수 있다고 함. 피부, 혈액, 신경은 본문에 나오지 않음.","c":5},"h":"54ab7bb6a9"},{"n":10,"t":"fill","q":"If the new treatment works, it could make patients better in a [A] way, without [B] their immune system.","ko":"새 치료법이 효과가 있다면, 환자들의 면역 체계를 [B] 않으면서 [A] 방식으로 환자들을 낫게 할 수 있다.","bko":{"safer":"더 안전한","weakening":"약화시키는 것","serious":"심각한","common":"흔한","unfamiliar":"낯선","unusual":"특이한"},"bank":["safer","weakening","serious","common","unfamiliar","unusual"],"r":{"a":"[A] safer, [B] weakening","ev":"9번 문장","s":[[9,"If this new treatment works, it could make these patients better in a safer way, without weakening their immune system.","이 새로운 치료법이 효과가 있다면, 그것은 환자들의 면역 체계를 약화시키지 않으면서 더 안전한 방식으로 이 환자들을 낫게 할 수 있다."]],"w":"9번 문장: make these patients better in a safer way(더 안전한 방식으로), without weakening their immune system(면역 체계를 약화시키지 않고). serious(심각한), common(흔한), unfamiliar(낯선)는 6~7번에서 부작용을 설명할 때 나온 말이고, unusual(특이한)은 3번에서 방법을 소개한 말.","c":null},"h":"61f241d32e"}]},{"u":10,"id":"rg4-10-1","no":1,"ko":"해변에서 발견된 푸른 돌의 정체는?","items":[{"n":1,"t":"tf","q":"Santos found strange blue-green rocks on Trindade island.","ko":"Santos는 트린다지 섬에서 이상한 청록색 바위들을 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, in 2019, geologist Fernanda Avelar Santos found something unusual there: strange blue-green rocks!","그러나 2019년에 지질학자 Fernanda Avelar Santos가 그곳에서 특이한 것을 발견했는데, 바로 이상한 청록색 바위들이었다!"]],"w":"3번 문장에 Santos가 there(그 섬)에서 strange blue-green rocks를 발견했다고 나옴. 같은 내용이라 T.","c":"T"},"h":"433983be99"},{"n":2,"t":"tf","q":"The rocks were made only from natural rock material.","ko":"그 바위들은 자연적인 암석 물질로만 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"After analysis, she realized these weren’t ordinary rocks, but a mix of natural rock material and plastic trash.","분석 후, 그녀는 이것들이 평범한 바위가 아니라 자연적인 암석 물질과 플라스틱 쓰레기가 섞인 것임을 알게 되었다."]],"w":"5번 문장에서 바위는 자연 암석 물질과 플라스틱 쓰레기가 섞인 것(a mix of natural rock material and plastic trash)이라고 함. 자연 물질로만 됐다는 말은 틀려서 F.","c":"F"},"h":"5a584ba82d"},{"n":3,"t":"tf","q":"Santos said that the plastic rocks will leave a lasting mark in Earth’s geological record.","ko":"Santos는 플라스틱 바위가 지구의 지질학적 기록에 지속적인 흔적을 남길 것이라고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"They will leave a lasting mark in Earth’s geological record.”","그것들은 지구의 지질학적 기록에 지속적인 흔적을 남길 것입니다.”라고 말했다."]],"w":"10번 문장에 They will leave a lasting mark in Earth’s geological record라고 나옴. will leave는 leave(남기다)의 미래 표현. 같은 내용이라 T.","c":"T"},"h":"6633fc1720"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Under the hot sun, this plastic melted and stuck to the beach…)","ko":"뜨거운 태양 아래에서, 이 플라스틱이 녹아 해변에 ( )…","opts":["떠났다","달라붙었다","가라앉았다","사라졌다"],"word":"stuck","r":{"a":"2) 달라붙었다","ev":"7번 문장","s":[[7,"Under the hot sun, this plastic melted and stuck to the beach, forming these unique rocks.","뜨거운 태양 아래에서 이 플라스틱이 녹아 해변에 달라붙었고, 이 독특한 바위들을 만들었다."]],"w":"7번에서 플라스틱이 뜨거운 태양에 녹아 해변에 달라붙어(stuck) 바위를 만들었음. stuck은 stick(달라붙다)의 과거형. 떠나거나 사라졌다면 바위가 생길 수 없음.","c":2},"h":"bbb8e77782"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Santos’s discovery shows human impact on even remote areas.)","ko":"Santos의 발견은 심지어 ( ) 지역에까지 미치는 인간의 영향을 보여 준다.","opts":["가까운","붐비는","외딴","새로운"],"word":"remote","r":{"a":"3) 외딴","ev":"1번, 8번 문장","s":[[1,"There are few places on Earth as remote as Trindade island, needing a three- or four-day boat trip off the coast of Brazil.","브라질 해안에서 3~4일 보트 여행이 필요한 트린다지(Trindade) 섬만큼 외딴 곳은 지구상에 거의 없다."],[8,"Santos’s discovery shows human impact on even remote areas.","Santos의 발견은 심지어 외딴 지역에까지 미치는 인간의 영향력을 보여 준다."]],"w":"1번에서 remote는 트린다지 섬이 사람 거의 없는 외딴 곳이라는 뜻이고, 8번에서도 그런 외딴 지역에까지 인간의 영향이 미친다는 뜻. 가깝거나 붐빈다는 뜻이면 ‘심지어(even)’와 맞지 않음.","c":3},"h":"b1a88fa387"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nShe was curious about them and took some back to her lab.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그녀는 그것들이 궁금해서 몇 개를 자신의 실험실로 가져갔다.","opts":["청록색 바위들","해류들","실험실의 도구들","과학자들"],"r":{"a":"1) 청록색 바위들","ev":"3~4번 문장","s":[[3,"However, in 2019, geologist Fernanda Avelar Santos found something unusual there: strange blue-green rocks!","그러나 2019년에 지질학자 Fernanda Avelar Santos가 그곳에서 특이한 것을 발견했는데, 바로 이상한 청록색 바위들이었다!"],[4,"She was curious about them and took some back to her lab.","그녀는 그것들이 궁금해서 몇 개를 자신의 실험실로 가져갔다."]],"w":"4번 문장 She was curious about them에서 them은 바로 앞 3번의 strange blue-green rocks를 가리킴. 그 바위가 궁금해서 몇 개를 실험실로 가져갔음.","c":1},"h":"8c3102a799"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Santos’s discovery shows human impact on even remote areas.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Santos의 발견은 심지어 외딴 지역에까지 미치는 인간의 영향력을 보여 준다.","opts":["Santos가 외딴 곳을 여행해서 인간이 영향을 받았다.","Santos의 발견은 사람이 사는 곳에서만 영향이 크다는 것을 보여 준다.","Santos의 발견은 인간의 영향이 외딴 지역에까지 미친다는 것을 보여 준다.","Santos의 발견은 외딴 지역에는 인간의 영향이 없다는 것을 보여 준다."],"r":{"a":"3) Santos의 발견은 인간의 영향이 외딴 지역에까지 미친다는 것을 보여 준다.","ev":"8번 문장","s":[[8,"Santos’s discovery shows human impact on even remote areas.","Santos의 발견은 심지어 외딴 지역에까지 미치는 인간의 영향력을 보여 준다."]],"w":"8번은 shows(보여 준다) 뒤의 human impact on even remote areas가 핵심. even(심지어)은 외딴 곳까지도라는 뜻이라 3번. 4번은 정반대이고, 2번은 even remote와 맞지 않음.","c":3},"h":"97fb963d3d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Santos는 2019년에 트린다지 섬에서 바위를 발견했다.","섬에서 플라스틱은 차가운 바다에서 굳었다.","Santos는 바위를 실험실로 가져가지 않았다.","섬에는 많은 사람이 살고 있다."],"opts":["Santos found strange rocks on Trindade island in 2019.","The plastic hardened in the cold sea on the island.","Santos did not take any rocks back to her lab.","Many humans live on the island."],"r":{"a":"1) Santos found strange rocks on Trindade island in 2019.","ev":"2~4번, 7번 문장","s":[[2,"The island is home to rare animals and a place with almost no humans.","그 섬은 희귀 동물들의 서식지이고 사람이 거의 없는 곳이다."],[3,"However, in 2019, geologist Fernanda Avelar Santos found something unusual there: strange blue-green rocks!","그러나 2019년에 지질학자 Fernanda Avelar Santos가 그곳에서 특이한 것을 발견했는데, 바로 이상한 청록색 바위들이었다!"],[4,"She was curious about them and took some back to her lab.","그녀는 그것들이 궁금해서 몇 개를 자신의 실험실로 가져갔다."],[7,"Under the hot sun, this plastic melted and stuck to the beach, forming these unique rocks.","뜨거운 태양 아래에서 이 플라스틱이 녹아 해변에 달라붙었고, 이 독특한 바위들을 만들었다."]],"w":"3번에서 2019년에 Santos가 섬에서 이상한 바위를 발견함. 7번에서 플라스틱은 뜨거운 태양에 녹아 해변에 붙음(차가운 바다 아님). 4번에서 몇 개를 실험실로 가져감. 2번에서 사람이 거의 없는 섬이라 나머지는 모두 본문과 다름.","c":1},"h":"2ba1408f56"},{"n":9,"t":"sum","q":"Ocean currents carried plastic trash to Trindade island, where it (A) in the sun and formed rocks. Santos said these rocks are (B) of human impact.","ko":"해류가 플라스틱 쓰레기를 트린다지 섬으로 실어 날랐고, 그것이 햇볕에 (A) 바위를 만들었다. Santos는 이 바위들이 인간 영향의 (B)라고 말했다.","oko":["(A) 얼었고 / (B) 증거","(A) 사라졌고 / (B) 증거","(A) 녹았고 / (B) 증거","(A) 녹았고 / (B) 비밀","(A) 얼었고 / (B) 비밀"],"opts":["(A) froze / (B) evidence","(A) vanished / (B) evidence","(A) melted / (B) evidence","(A) melted / (B) secret","(A) froze / (B) secret"],"r":{"a":"3) (A) melted / (B) evidence","ev":"6~7번, 9번 문장","s":[[6,"Santos found that ocean currents had carried and piled plastic trash like fishing nets and bottles to the island.","Santos는 해류가 어망과 병 같은 플라스틱 쓰레기를 그 섬으로 실어 나르고 쌓아 놓았다는 것을 알아냈다."],[7,"Under the hot sun, this plastic melted and stuck to the beach, forming these unique rocks.","뜨거운 태양 아래에서 이 플라스틱이 녹아 해변에 달라붙었고, 이 독특한 바위들을 만들었다."],[9,"She said, “These plastic rocks are evidence of how human actions are changing natural processes.","그녀는 “이 플라스틱 바위들은 인간의 행동이 자연적 과정을 어떻게 바꾸고 있는지에 대한 증거입니다."]],"w":"7번에서 플라스틱이 뜨거운 태양 아래 녹았고(melted), 9번에서 바위는 인간 행동이 자연을 바꾼다는 증거(evidence)라고 함. 얼거나(froze) 사라지거나(vanished) 비밀(secret)이라는 말은 나오지 않음.","c":3},"h":"1775544c34"},{"n":10,"t":"fill","q":"Santos realized that the rocks were a mix of natural rock material and [A] trash. Her discovery shows [B] impact on even remote areas.","ko":"Santos는 그 바위들이 자연적인 암석 물질과 [A] 쓰레기가 섞인 것임을 알게 되었다. 그녀의 발견은 심지어 외딴 지역에까지 미치는 [B]의 영향을 보여 준다.","bko":{"plastic":"플라스틱","human":"인간의","lab":"실험실","sun":"태양","boat":"보트","coast":"해안"},"bank":["plastic","human","lab","sun","boat","coast"],"r":{"a":"[A] plastic, [B] human","ev":"5번, 8번 문장","s":[[5,"After analysis, she realized these weren’t ordinary rocks, but a mix of natural rock material and plastic trash.","분석 후, 그녀는 이것들이 평범한 바위가 아니라 자연적인 암석 물질과 플라스틱 쓰레기가 섞인 것임을 알게 되었다."],[8,"Santos’s discovery shows human impact on even remote areas.","Santos의 발견은 심지어 외딴 지역에까지 미치는 인간의 영향력을 보여 준다."]],"c":null,"w":"5번에서 바위는 natural rock material(자연 암석 물질)과 plastic trash(플라스틱 쓰레기)가 섞인 것이고, 8번에서 Santos의 발견은 human impact(인간의 영향)가 외딴 지역에까지 미친다는 것을 보여 줌. lab, sun, boat, coast도 본문 단어지만 이 자리에는 맞지 않음."},"h":"9b3fe7b4da"}]},{"u":10,"id":"rg4-10-2","no":2,"ko":"화성에서 들은 소리는 어떻게 다를까?","items":[{"n":1,"t":"tf","q":"The speed of sound on Earth is about 343 meters per second.","ko":"지구에서 소리의 속도는 초당 약 343미터이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"On Earth, sound travels at a speed of 343 meters per second.","지구에서는 소리가 초당 343미터의 속도로 이동한다."]],"w":"5번 문장에 On Earth, sound travels at a speed of 343 meters per second라고 나옴. travels는 travel(이동하다)의 형태. 같은 내용이라 T.","c":"T"},"h":"874f8f5795"},{"n":2,"t":"tf","q":"Sound travels faster on Mars than on Earth.","ko":"소리는 지구에서보다 화성에서 더 빨리 이동한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번, 6번 문장","s":[[4,"Scientists found that the speed of sound on Mars is slower than on Earth.","과학자들은 화성에서 소리의 속도가 지구에서보다 느리다는 것을 발견했다."],[6,"On Mars, it travels at around 240 meters per second.","화성에서는 초당 약 240미터의 속도로 이동한다."]],"w":"4번 문장에서 화성의 소리 속도가 지구보다 느리다고 하고, 6번에서 화성은 약 240미터로 지구(343미터)보다 느림. 빠르다는 진술은 반대라서 F.","c":"F"},"h":"ec3cd8592d"},{"n":3,"t":"tf","q":"The violin sound would be heard before the double bass on Mars.","ko":"화성에서는 바이올린 소리가 더블 베이스 소리보다 먼저 들릴 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"If an orchestra played on Mars, you would hear the violins first and the double bass later.","만약 오케스트라가 화성에서 연주한다면, 여러분은 바이올린 소리를 먼저 듣고 더블 베이스 소리를 나중에 들을 것이다."]],"w":"10번 문장에 you would hear the violins first and the double bass later라고 나옴. hear는 듣다. 높은 음이 먼저 들리므로 T.","c":"T"},"h":"5a3c3df211"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Mars’ thin atmosphere of mostly carbon dioxide doesn’t carry sound very well.)","ko":"이산화탄소로 이루어진 화성의 ( ) 대기는 소리를 잘 전달하지 못한다.","opts":["희박한","두꺼운","따뜻한","무거운"],"word":"thin","r":{"a":"1) 희박한","ev":"7번 문장","s":[[7,"This is because Mars’ thin atmosphere of mostly carbon dioxide doesn’t carry sound very well.","이는 대부분 이산화탄소로 이루어진 화성의 희박한 대기가 소리를 잘 전달하지 못하기 때문이다."]],"w":"7번에서 화성의 thin atmosphere가 소리를 잘 전달하지 못한다고 함. 대기가 얇고 희박해서 소리를 못 전하는 것이라 ‘희박한’. 두껍거나 무거우면 오히려 소리를 잘 전할 것임.","c":1},"h":"c473848ed5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They also found that higher-pitched sounds can be heard slightly faster on Mars.)","ko":"그들은 또한 더 높은 음조의 소리가 화성에서 ( ) 더 빨리 들릴 수 있다는 것을 발견했다.","opts":["아주 많이","절대 안","천천히","약간, 조금"],"word":"slightly","r":{"a":"4) 약간, 조금","ev":"9번 문장","s":[[9,"They also found that higher-pitched sounds can be heard slightly faster on Mars.","그들은 또한 화성에서 더 높은 음조의 소리가 좀 더 빨리 들릴 수 있다는 것을 발견했다."]],"w":"9번에서 높은 음이 faster(더 빨리) 들린다고 하는데, 10번 예시에서 바이올린이 ‘먼저’ 들릴 뿐 큰 차이는 아니라서 slightly는 ‘약간’. 아주 많이라면 둘의 차이가 크다는 뜻이라 맞지 않음.","c":4},"h":"9170970dfe"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis means they wouldn’t be able to create harmony as they do on Earth.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 그들이 지구에서처럼 화음을 만들어 낼 수 없을 것이라는 것을 의미한다.","opts":["오케스트라 악기들의 모양","화성에 소리가 전달되지 않는다는 것","바이올린 소리가 더블 베이스보다 먼저 들린다는 것","로버가 소리를 녹음한 일"],"r":{"a":"3) 바이올린 소리가 더블 베이스보다 먼저 들린다는 것","ev":"10~11번 문장","s":[[10,"If an orchestra played on Mars, you would hear the violins first and the double bass later.","만약 오케스트라가 화성에서 연주한다면, 여러분은 바이올린 소리를 먼저 듣고 더블 베이스 소리를 나중에 들을 것이다."],[11,"This means they wouldn’t be able to create harmony as they do on Earth.","이것은 그들이 지구에서처럼 화음을 만들어 낼 수 없을 것이라는 것을 의미한다."]],"w":"11번은 This means(이것은 ~를 의미한다)로 시작함. 바로 앞 10번에서 바이올린이 먼저, 더블 베이스가 나중에 들린다고 했고, 그래서 화음을 만들 수 없다는 뜻. This는 그 내용을 가리킴. 소리가 아예 전달되지 않는다는 말은 본문에 없음.","c":3},"h":"b9ffb5b7ec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If someone spoke next to you, their voice would sound so quiet.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 누군가가 여러분 옆에서 말을 한다면, 그들의 목소리는 매우 조용하게 들릴 것이다.","opts":["누군가 화성에서 말을 하면 그 목소리는 매우 시끄러울 것이다.","누군가 화성에서 여러분 옆에서 말한다면 그 목소리는 매우 작게 들릴 것이다.","화성에서는 아무도 말할 수 없다.","여러분이 말을 하면 화성에서 메아리가 들릴 것이다."],"r":{"a":"2) 누군가 화성에서 여러분 옆에서 말한다면 그 목소리는 매우 작게 들릴 것이다.","ev":"7~8번 문장","s":[[7,"This is because Mars’ thin atmosphere of mostly carbon dioxide doesn’t carry sound very well.","이는 대부분 이산화탄소로 이루어진 화성의 희박한 대기가 소리를 잘 전달하지 못하기 때문이다."],[8,"If someone spoke next to you, their voice would sound so quiet.","만약 누군가가 여러분 옆에서 말을 한다면, 그들의 목소리는 매우 조용하게 들릴 것이다."]],"w":"8번 문장은 If someone spoke next to you(만약 누군가 옆에서 말한다면), their voice would sound so quiet(목소리가 매우 조용하게 들릴 것이다)라는 가정. 7번에서 희박한 대기가 소리를 잘 전달하지 못한다고 했으므로 작게 들리는 것. 시끄럽다는 반대임.","c":2},"h":"c8c815bb55"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["화성의 대기는 지구보다 두꺼워서 소리가 느리다.","화성에서 소리의 속도는 초당 약 240미터이다.","화성에서는 낮은 음이 높은 음보다 먼저 들린다.","퍼서비어런스 로버는 지구에서 소리를 녹음했다."],"opts":["Mars has a thicker atmosphere than Earth, so sound is slow.","On Mars, sound travels at around 240 meters per second.","On Mars, low sounds are heard before high sounds.","The Perseverance rover recorded sounds on Earth."],"r":{"a":"2) On Mars, sound travels at around 240 meters per second.","ev":"1번, 6~7번, 9번 문장","s":[[1,"NASA’s space robot called the Perseverance rover has recorded sounds on Mars since its landing in February 2021.","NASA의 우주 로봇인 퍼서비어런스 로버(Perseverance rover)는 2021년 2월 상륙한 이후로 화성에서 소리를 녹음해 왔다."],[6,"On Mars, it travels at around 240 meters per second.","화성에서는 초당 약 240미터의 속도로 이동한다."],[7,"This is because Mars’ thin atmosphere of mostly carbon dioxide doesn’t carry sound very well.","이는 대부분 이산화탄소로 이루어진 화성의 희박한 대기가 소리를 잘 전달하지 못하기 때문이다."],[9,"They also found that higher-pitched sounds can be heard slightly faster on Mars.","그들은 또한 화성에서 더 높은 음조의 소리가 좀 더 빨리 들릴 수 있다는 것을 발견했다."]],"w":"6번에서 화성의 소리는 초당 약 240미터로 이동함. 7번에서 화성 대기는 thin(희박)하다고 했으므로 대기가 두껍다는 말은 틀림. 9번에서 높은 음이 더 빨리 들린다고 했으므로 낮은 음이 먼저라는 말도 틀림. 1번에서 로버는 화성에서 녹음했으므로 지구에서 녹음했다는 말도 틀림.","c":2},"h":"fa59270765"},{"n":9,"t":"sum","q":"Sound travels (A) on Mars than on Earth because of Mars’ thin atmosphere, and higher-pitched sounds can be heard (B).","ko":"화성의 희박한 대기 때문에 소리는 지구보다 화성에서 (A) 이동하고, 더 높은 음조의 소리는 (B) 들릴 수 있다.","oko":["(A) 더 빨리 / (B) 더 빨리","(A) 더 느리게 / (B) 더 느리게","(A) 더 느리게 / (B) 더 빨리","(A) 더 빨리 / (B) 더 느리게","(A) 똑같이 / (B) 더 빨리"],"opts":["(A) faster / (B) faster","(A) slower / (B) slower","(A) slower / (B) faster","(A) faster / (B) slower","(A) equally / (B) faster"],"r":{"a":"3) (A) slower / (B) faster","ev":"4번, 6번, 9번 문장","s":[[4,"Scientists found that the speed of sound on Mars is slower than on Earth.","과학자들은 화성에서 소리의 속도가 지구에서보다 느리다는 것을 발견했다."],[6,"On Mars, it travels at around 240 meters per second.","화성에서는 초당 약 240미터의 속도로 이동한다."],[9,"They also found that higher-pitched sounds can be heard slightly faster on Mars.","그들은 또한 화성에서 더 높은 음조의 소리가 좀 더 빨리 들릴 수 있다는 것을 발견했다."]],"w":"4번에서 화성의 소리가 지구보다 느리다(slower)고 했고, 9번에서 높은 음은 화성에서 약간 더 빨리(faster) 들린다고 함. 두 내용이 서로 다른 방향이라 (A)는 slower, (B)는 faster.","c":3},"h":"128bbc409e"},{"n":10,"t":"fill","q":"Scientists analyzed the [A] from Mars. The rover’s recordings help scientists learn about the planet’s [B] and environment.","ko":"과학자들은 화성에서 온 [A]를 분석했다. 로버의 녹음은 과학자들이 그 행성의 [B]와 환경을 배우는 데 도움이 된다.","bko":{"recordings":"녹음된 것","atmosphere":"대기","harmony":"화음","violins":"바이올린들","landing":"상륙, 착륙","speed":"속도"},"bank":["recordings","atmosphere","harmony","violins","landing","speed"],"r":{"a":"[A] recordings, [B] atmosphere","ev":"2번, 12번 문장","s":[[2,"Scientists analyzed some of these recordings.","과학자들은 이 녹음된 것 중 일부를 분석했다."],[12,"Measuring the speed of sound can give scientists a better way to learn about Mars’ atmosphere and environment.","소리의 속도를 측정하는 것은 과학자들에게 화성의 대기와 환경에 대해 배울 수 있는 더 나은 방법을 제공할 수 있다."]],"w":"2번에서 과학자들이 some of these recordings(녹음된 것 중 일부)를 분석했고, 12번에서 소리 속도를 재면 화성의 atmosphere and environment(대기와 환경)를 배울 수 있다고 함. harmony, violins, landing, speed도 본문 단어지만 이 자리에는 맞지 않음.","c":null},"h":"805c924c3d"}]},{"u":10,"id":"rg4-10-3","no":3,"ko":"평생 빨래로 모은 돈, 어디에 썼을까?","items":[{"n":1,"t":"tf","q":"The banker asked McCarty to divide the coins.","ko":"은행가는 McCarty에게 동전을 나누어 달라고 요청했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The banker gave her 10 coins, each worth 10 percent of her savings, and asked her to divide the coins.","그 은행가는 그녀에게 각각 그녀의 저축액의 10퍼센트만큼 가치가 있는 동전 10개를 주었고, 그녀에게 그 동전들을 나누어 달라고 요청했다."]],"w":"3번 문장에 The banker gave her 10 coins and asked her to divide the coins라고 나옴. gave는 give(주다), asked는 ask(요청하다)의 과거형. 같은 내용이라 T.","c":"T"},"h":"a15d0fc3c3"},{"n":2,"t":"tf","q":"McCarty gave three coins to her church.","ko":"McCarty는 교회에 동전 세 개를 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"McCarty distributed one coin to her church, three coins to her cousins, and the remaining six to the University of Southern Mississippi.","McCarty는 동전 한 개를 그녀의 교회에, 동전 세 개를 그녀의 사촌들에게, 그리고 나머지 여섯 개는 남미시시피 대학에 분배했다."]],"w":"4번 문장에서 교회에는 one coin(한 개)을, 세 개는 사촌들(her cousins)에게 줌. 숫자가 바뀌어서 F.","c":"F"},"h":"67895bd1f4"},{"n":3,"t":"tf","q":"The group’s symbol is a tree with six coins.","ko":"그 그룹의 상징은 동전 여섯 개가 달린 나무이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"The group’s symbol is a tree with six coins at the end of its branches.","그 그룹의 상징은 나뭇가지 끝에 여섯 개의 동전이 달린 한 그루의 나무이다."]],"w":"10번 문장에 The group’s symbol is a tree with six coins at the end of its branches라고 나옴. 같은 내용이라 T.","c":"T"},"h":"864f1d9372"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (McCarty distributed one coin to her church, three coins to her cousins, and the remaining six to the University of Southern Mississippi.)","ko":"McCarty는 동전 한 개를 교회에, 세 개를 사촌들에게, 그리고 남은 여섯 개는 남미시시피 대학에 ( ).","opts":["모으다","숨기다","분배했다","빌려 주다"],"word":"distributed","r":{"a":"3) 분배했다","ev":"4번 문장","s":[[4,"McCarty distributed one coin to her church, three coins to her cousins, and the remaining six to the University of Southern Mississippi.","McCarty는 동전 한 개를 그녀의 교회에, 동전 세 개를 그녀의 사촌들에게, 그리고 나머지 여섯 개는 남미시시피 대학에 분배했다."]],"w":"4번에서 McCarty는 동전 10개를 교회(1), 사촌들(3), 대학(6)에 나누어 주었음. distributed는 distribute(분배하다)의 과거형. 모으거나 숨기거나 빌려 준 것이 아니라 나누어 준 것.","c":3},"h":"deb00c00b1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It symbolizes McCarty’s generous contribution to the university.)","ko":"그것은 McCarty가 대학에 한 ( ) 기여를 상징한다.","opts":["너그러운","화난","가난한","짧은"],"word":"generous","r":{"a":"1) 너그러운","ev":"5번, 11번 문장","s":[[5,"She donated $150,000 to the university for African American students who couldn’t afford college fees.","그녀는 대학 학비를 낼 형편이 안 되는 아프리카계 미국인 학생들을 위해 15만 달러를 그 대학에 기부했다."],[11,"It symbolizes McCarty’s generous contribution to the university.","그것은 McCarty가 그 대학에 한 너그러운 기여를 상징한다."]],"w":"11번의 generous contribution은 5번에서 15만 달러를 학비 낼 형편이 안 되는 학생들을 위해 기부한 일을 가리킴. 많은 돈을 선뜻 내놓은 것이라 ‘너그러운’. 화나거나 가난하거나 짧다는 뜻은 맞지 않음.","c":1},"h":"099350b6ff"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey can have the chance that I didn’t have,” said McCarty.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 제가 가지지 못했던 기회를 가질 수 있어요.”라고 McCarty는 말했다.","opts":["은행가와 사촌들","동전 여섯 개","대학 학비를 낼 형편이 안 되는 학생들","McCarty Legacy Society 회원들"],"r":{"a":"3) 대학 학비를 낼 형편이 안 되는 학생들","ev":"5번, 8번 문장","s":[[5,"She donated $150,000 to the university for African American students who couldn’t afford college fees.","그녀는 대학 학비를 낼 형편이 안 되는 아프리카계 미국인 학생들을 위해 15만 달러를 그 대학에 기부했다."],[8,"They can have the chance that I didn’t have,” said McCarty.","그들은 제가 가지지 못했던 기회를 가질 수 있어요.”라고 McCarty는 말했다."]],"w":"8번 They can have the chance that I didn’t have에서 They는 바로 앞 6번의 them(교육받기를 원하는 대상)이고, 5번의 African American students who couldn’t afford college fees를 가리킴. 그 학생들이 McCarty가 갖지 못한 기회를 갖게 됨.","c":3},"h":"9990dd9f2b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"I had to work hard all my life.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"저는 제 평생 일해야만 했거든요.","opts":["McCarty는 일하는 것을 좋아해서 평생 일했다.","McCarty는 평생 열심히 일해야만 했다.","McCarty는 평생 한 번도 일하지 않았다.","McCarty는 일을 하는 학생들을 도왔다."],"r":{"a":"2) McCarty는 평생 열심히 일해야만 했다.","ev":"7번 문장","s":[[7,"I had to work hard all my life.","저는 제 평생 일해야만 했거든요."]],"w":"7번의 had to work hard all my life는 평생 열심히 일해야 했다는 뜻. had to는 have to(~해야 한다)의 과거형이라 ‘어쩔 수 없이 해야 했던’ 일. 좋아서 한 것이 아님. 이 문장은 학생들은 자기처럼 고생하지 않고 공부했으면 하는 마음(6번, 8번)으로 이어짐.","c":2},"h":"0cb87d33a0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["McCarty는 저축액의 전부를 교회에 기부했다.","McCarty는 15만 달러를 기부해 학비를 낼 형편이 안 되는 학생들을 도왔다.","McCarty Legacy Society의 상징은 동전 열 개가 달린 나무이다.","McCarty는 대학에서 교육을 받았다."],"opts":["McCarty gave all her savings to her church.","McCarty donated $150,000 to help students who couldn’t afford college.","The symbol of the McCarty Legacy Society is a tree with ten coins.","McCarty received an education at a university."],"r":{"a":"2) McCarty donated $150,000 to help students who could  것은?","sko":"그것이 무거우면 무거울수록, 그곳으로 올려 보내는 데 비용이 더 많이 든다.","opts":["우주로 보내는 물건이 가벼울수록 비용이 더 든다.","우주로 보내는 물건이 무거울수록 비용이 더 든다.","우주로 보내는 비용은 무게와 관계없다.","무거운 물건은 우주로 보낼 수 없다."],"r":{"a":"2) 우주로 보내는 물건이 무거울수록 비용이 더 든다.","ev":"9~10번 문장","s":[[9,"Everything we send to space, like satellites or building materials, needs to be light.","위성이나 건축 자재와 같이 우리가 우주로 보내는 모든 것은 가벼워야 한다."],[10,"The heavier it is, the more it costs to send up there.","그것이 무거우면 무거울수록, 그곳으로 올려 보내는 데 비용이 더 많이 든다."]],"w":"10번은 the heavier, the more 구조로 ‘무거울수록 더 많이 든다’는 뜻. 9번에서 우주로 보내는 것은 가벼워야 한다고 한 이유이기도 함. 가벼울수록 비용이 든다는 것은 반대.","c":2},"h":"8987aa67f3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["StarCrete는 영국 과학자들이 발명했다.","StarCrete의 가장 큰 장점은 오직 내구력이다.","StarCrete는 무거워서 우주 임무에 좋다.","StarCrete는 접착제를 따로 구매해야 한다."],"opts":["StarCrete was invented by scientists in the U.K.","The only good thing about StarCrete is its strength.","StarCrete is great for space missions because it is heavy.","StarCrete needs to be bought with a separate glue."],"r":{"a":"1) StarCrete was invented by scientists in the U.K.","ev":"3번, 6번, 8번, 11번 문장","s":[[3,"That’s why scientists in the U.K. invented “StarCrete.”","그것이 영국의 과학자들이 ‘스타크리트(StarCrete)’를 발명한 이유이다."],[6,"StarCrete is unique because it uses starch as a glue.","스타크리트는 접착제로 전분을 사용하기 때문에 독특하다."],[8,"But the best thing about StarCrete isn’t just its strength.","하지만 스타크리트의 가장 좋은 점은 단지 그것의 내구력이 아니다."],[11,"That’s why StarCrete is great for space missions.","그것이 스타크리트가 우주 임무에 아주 좋은 이유이다."]],"w":"3번에서 영국의 과학자들이 StarCrete를 발명함. 8번에서 가장 좋은 점은 단지 내구력만이 아니라고 함. 11번에서 가벼워서 우주 임무에 좋다고 함. 6번에서 전분이 접착제 역할을 하므로 나머지는 모두 본문과 다름.","c":1},"h":"9fa3b6baf6"},{"n":9,"t":"sum","q":"StarCrete is made from (A) and is very light, so it can make space missions simpler and (B).","ko":"StarCrete는 (A)로 만들어지고 매우 가벼워서 우주 임무를 더 단순하고 (B) 만들 수 있다.","oko":["(A) 돌과 물 / (B) 비싸게","(A) 감자 전분 등 / (B) 저렴하게","(A) 감자 전분 등 / (B) 위험하게","(A) 금속 / (B) 저렴하게","(A) 돌과 물 / (B) 위험하게"],"opts":["(A) stones and water / (B) more expensive","(A) potato starch and more / (B) cheaper","(A) potato starch and more / (B) more dangerous","(A) metal / (B) cheaper","(A) stones and water / (B) more dangerous"],"r":{"a":"2) (A) potato starch and more / (B) cheaper","ev":"4번, 13번 문장","s":[[4,"It’s concrete made from a special combination of space dust, salt, and potato starch.","그것은 우주 먼지, 소금, 그리고 감자 전분의 특별한 조합으로 만들어진 콘크리트이다."],[13,"Since StarCrete won’t need any additional technology or equipment, astronauts’ missions could be simpler and cheaper.","스타크리트는 추가적인 기술이나 장비를 필요로 하지 않을 것이기 때문에, 우주 비행사의 임무는 더 단순해지고 비용이 더 적게 들 수 있다."]],"w":"4번에서 StarCrete는 우주 먼지, 소금, 감자 전분으로 만들고, 13번에서 임무가 simpler and cheaper(더 단순하고 저렴)해진다고 함. 돌, 물, 금속은 나오지 않고 비싸거나 위험하다는 말도 없음.","c":2},"h":"df96cc5613"},{"n":10,"t":"fill","q":"The [A] StarCrete is, the less it costs to send it up. A small amount of dried [B] can make a lot of StarCrete.","ko":"StarCrete가 [A]수록 우주로 올려 보내는 비용이 덜 든다. 적은 양의 말린 [B]로 많은 StarCrete를 만들 수 있다.","bko":{"lighter":"더 가벼운","potatoes":"감자","heavier":"더 무거운","salt":"소금","bricks":"벽돌","glue":"접착제"},"bank":["lighter","potatoes","heavier","salt","bricks","glue"],"r":{"a":"[A] lighter, [B] potatoes","ev":"10번, 12번 문장","s":[[10,"The heavier it is, the more it costs to send up there.","그것이 무거우면 무거울수록, 그곳으로 올려 보내는 데 비용이 더 많이 든다."],[12,"Just 25 kilograms of dried potatoes could be used to produce about 500 kilograms of StarCrete!","단 25킬로그램의 말린 감자가 약 5백 킬로그램의 스타크리트를 만드는 데 사용될 수 있다!"]],"w":"10번에서 무거울수록(heavier) 비용이 더 든다고 했으니, 비용이 덜 들려면 더 가벼워야(lighter) 함. 12번에서 25kg의 dried potatoes(말린 감자)로 약 500kg의 StarCrete를 만들 수 있음. heavier, salt, bricks, glue도 본문에 나오는 말이지만 이 자리에는 맞지 않음.","c":null},"h":"2d36bd4423"}]},{"u":11,"id":"rg4-11-2","no":2,"ko":"호주 지폐에서 영국 여왕이 사라진다고?","items":[{"n":1,"t":"tf","q":"Countries such as Canada, Australia, and New Zealand were once ruled by Britain.","ko":"캐나다, 호주, 뉴질랜드 같은 나라들은 한때 영국의 지배를 받았다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"A long time ago, countries such as Canada, Australia, and New Zealand were ruled by Britain.","오래전에, 캐나다, 호주, 그리고 뉴질랜드와 같은 나라들은 영국의 지배를 받았다."]],"w":"4번 문장에 A long time ago, countries such as Canada, Australia, and New Zealand were ruled by Britain이라고 나옴. were ruled는 rule(지배하다)의 수동형. 같은 내용이라 T.","c":"T"},"h":"818f5dfae3"},{"n":2,"t":"tf","q":"Queen Elizabeth II passed away in 2022 and her daughter became the British king.","ko":"엘리자베스 2세 여왕은 2022년에 서거했고 그녀의 딸이 영국의 왕이 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"However, there’s a movement in Australia to change this tradition, especially after Queen Elizabeth II passed away in 2022.","그러나, 호주에서는 특히 2022년에 엘리자베스 2세 여왕이 서거한 후 이 전통을 바꾸려는 움직임이 있다."],[7,"Following her death, her son, King Charles III, became the British king.","그녀의 서거 이후, 아들인 찰스 3세가 영국의 왕이 되었다."]],"w":"6번에서 여왕이 2022년에 서거했고, 7번에서 왕이 된 사람은 her son, King Charles III(아들 찰스 3세). 딸이 아니라서 F.","c":"F"},"h":"8c60ecbb15"},{"n":3,"t":"tf","q":"Australia has decided not to replace the Queen’s image with King Charles III’s on its 5-dollar note.","ko":"호주는 5달러 지폐의 여왕 그림을 찰스 3세의 그림으로 대체하지 않기로 결정했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Despite this change, Australia has decided not to replace the Queen’s image with King Charles III’s on its 5-dollar note.","이 변화에도 불구하고, 호주는 5달러짜리 지폐의 여왕의 그림을 찰스 3세의 그림으로 대체하지 않기로 결정했다."]],"w":"8번 문장에 Australia has decided not to replace the Queen’s image with King Charles III’s라고 나옴. has decided는 decide(결정하다)의 현재완료. 같은 내용이라 T.","c":"T"},"h":"7f5951c59b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The new design will better represent Australia’s history and heritage.)","ko":"새로운 디자인은 호주의 역사와 유산을 더 잘 ( ) 것이다.","opts":["가리다","나타내다","잊다","바꾸다"],"word":"represent","r":{"a":"2) 나타내다","ev":"2번 문장","s":[[2,"The new design will better represent Australia’s history and heritage.","새로운 디자인은 호주의 역사와 유산을 더 잘 나타낼 것이다."]],"w":"2번에서 새 디자인이 호주의 역사와 유산을 ‘더 잘 보여 준다’는 흐름. represent는 ‘나타내다, 대표하다’. 가리거나 잊는 것은 목적과 반대.","c":2},"h":"4cbb4b7755"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But it could be a chance for Australia to be more independent and show its own identity.)","ko":"하지만 그것은 호주가 더 ( )이 되고 그것만의 독자성을 보여 주는 기회일 수도 있다.","opts":["의존하는","화난","독립적인","가난한"],"word":"independent","r":{"a":"3) 독립적인","ev":"10번 문장","s":[[10,"But it could be a chance for Australia to be more independent and show its own identity.","하지만 그것은 호주가 더 독립적이 되고 그것만의 독자성을 보여 주는 기회일 수도 있다."]],"w":"10번에서 영국 여왕 그림 중심이던 것에서 벗어나 호주만의 독자성을 보이는 기회라는 흐름. independent는 ‘독립적인’이고, 반대말은 dependent(의존하는).","c":3},"h":"ac31666df7"},{"n":6,"t":"ref","q":"What does the underlined \"this tradition\" refer to?\nHowever, there’s a movement in Australia to change this tradition, especially after Queen Elizabeth II passed away in 2022.","ko":"밑줄 친 this tradition이 가리키는 것은?","sko":"그러나, 호주에서는 특히 2022년에 엘리자베스 2세 여왕이 서거한 후 이 전통을 바꾸려는 움직임이 있다.","opts":["여왕이 서거한 후 왕이 바뀌는 일","영국 왕실의 이미지를 화폐에 넣는 일","호주가 영국의 지배를 받은 일","5달러 지폐를 새로 만드는 일"],"r":{"a":"2) 영국 왕실의 이미지를 화폐에 넣는 일","ev":"5~6번 문장","s":[[5,"So, these countries have honored the British monarchy by putting their image on money.","그래서, 이 나라들은 영국 왕실의 이미지를 화폐에 넣음으로써 그들을 예우해 왔다."],[6,"However, there’s a movement in Australia to change this tradition, especially after Queen Elizabeth II passed away in 2022.","그러나, 호주에서는 특히 2022년에 엘리자베스 2세 여왕이 서거한 후 이 전통을 바꾸려는 움직임이 있다."]],"w":"6번 However 앞의 5번에서 영국의 지배를 받은 나라들이 영국 왕실의 이미지를 화폐에 넣어 예우해 왔다고 함. this tradition은 그 오래된 관행을 가리킴. 왕이 바뀌는 일은 7번에서 따로 나옴.","c":2},"h":"cb86410bcf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Queen Elizabeth’s image has been on Australian money since 1953, so a new money design will be a big change.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"1953년 이후 엘리자베스 여왕의 초상화가 호주 화폐에 계속 있었기 때문에, 새로운 화폐 디자인은 큰 변화가 될 것이다.","opts":["여왕의 그림이 오랫동안 화폐에 있었기 때문에, 디자인이 바뀌면 큰 변화가 될 것이다.","여왕의 그림이 1953년에 처음으로 만들어졌다.","호주는 1953년부터 새 화폐 디자인을 써 왔다.","새 디자인은 큰 변화가 아닐 것이다."],"r":{"a":"1) 여왕의 그림이 오랫동안 화폐에 있었기 때문에, 디자인이 바뀌면 큰 변화가 될 것이다.","ev":"9번 문장","s":[[9,"Queen Elizabeth’s image has been on Australian money since 1953, so a new money design will be a big change.","1953년 이후 엘리자베스 여왕의 초상화가 호주 화폐에 계속 있었기 때문에, 새로운 화폐 디자인은 큰 변화가 될 것이다."]],"w":"9번은 since 1953(1953년 이후로 쭉) 여왕 그림이 있었기 때문에(so) 새 디자인은 큰 변화라는 뜻. has been은 쭉 있어 왔다는 현재완료. 새 디자인을 1953년부터 썼다는 말은 반대이고, 큰 변화가 아니라는 말도 반대임.","c":1},"h":"2c019f5cd5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["엘리자베스 2세 여왕은 2022년 이전에 서거했다.","호주는 찰스 3세의 그림을 지폐에 넣기로 했다.","여왕의 그림은 1953년부터 호주 화폐에 있었다.","호주 지폐의 새 디자인은 호주의 역사와 유산을 덜 나타낼 것이다."],"opts":["Queen Elizabeth II passed away before 2022.","Australia decided to put King Charles III’s image on the note.","The Queen’s image has been on Australian money since 1953.","The new note design will show less of Australia’s history and heritage."],"r":{"a":"3) The Queen’s image has been on Australian money since 1953.","ev":"2번, 6번, 8~9번 문장","s":[[2,"The new design will better represent Australia’s history and heritage.","새로운 디자인은 호주의 역사와 유산을 더 잘 나타낼 것이다."],[6,"However, there’s a movement in Australia to change this tradition, especially after Queen Elizabeth II passed away in 2022.","그러나, 호주에서는 특히 2022년에 엘리자베스 2세 여왕이 서거한 후 이 전통을 바꾸려는 움직임이 있다."],[8,"Despite this change, Australia has decided not to replace the Queen’s image with King Charles III’s on its 5-dollar note.","이 변화에도 불구하고, 호주는 5달러짜리 지폐의 여왕의 그림을 찰스 3세의 그림으로 대체하지 않기로 결정했다."],[9,"Queen Elizabeth’s image has been on Australian money since 1953, so a new money design will be a big change.","1953년 이후 엘리자베스 여왕의 초상화가 호주 화폐에 계속 있었기 때문에, 새로운 화폐 디자인은 큰 변화가 될 것이다."]],"w":"9번에서 1953년 이후로 계속 호주 화폐에 있었음. 6번에서 여왕은 2022년에 서거함. 8번에서 찰스 3세 그림으로 대체하지 않기로 함. 2번에서 새 디자인은 호주의 역사와 유산을 더 잘 나타낸다고 했으므로 나머지는 모두 본문과 다름.","c":3},"h":"108628e78c"},{"n":9,"t":"sum","q":"Australia will replace the Queen’s image from its 5-dollar note, which could be a chance to be more (A) and show its own (B).","ko":"호주는 5달러 지폐에서 여왕의 그림을 교체할 것인데, 그것은 더 (A)이 되고 호주만의 (B)을 보여 줄 기회일 수 있다.","oko":["(A) 의존적 / (B) 역사","(A) 독립적 / (B) 독자성","(A) 의존적 / (B) 독자성","(A) 독립적 / (B) 가격","(A) 유명 / (B) 가격"],"opts":["(A) dependent / (B) history","(A) independent / (B) identity","(A) dependent / (B) identity","(A) independent / (B) price","(A) famous / (B) price"],"r":{"a":"2) (A) independent / (B) identity","ev":"1번, 10번 문장","s":[[1,"Australia will replace the image of Queen Elizabeth II from its 5-dollar note, said the country’s central bank.","호주 중앙은행은 호주가 5달러짜리 지폐에서 엘리자베스 2세 여왕의 그림을 교체할 것이라고 말했다."],[10,"But it could be a chance for Australia to be more independent and show its own identity.","하지만 그것은 호주가 더 독립적이 되고 그것만의 독자성을 보여 주는 기회일 수도 있다."]],"w":"1번에서 여왕 그림을 교체한다고 했고, 10번에서 더 independent(독립적)가 되고 its own identity(독자성)를 보일 기회라고 함. dependent는 반대이고, price(가격)나 famous는 나오지 않음.","c":2},"h":"6ec0116e83"},{"n":10,"t":"fill","q":"Countries such as Canada, Australia, and New Zealand were [A] by Britain, so they honored the British [B] by putting their image on money.","ko":"캐나다, 호주, 뉴질랜드 같은 나라들은 영국에 의해 [A], 그래서 영국 [B]의 이미지를 화폐에 넣어 예우했다.","bko":{"ruled":"지배받았다","monarchy":"왕실","replaced":"교체되었다","design":"디자인","decided":"결정되었다","movement":"움직임"},"bank":["ruled","monarchy","replaced","design","decided","movement"],"r":{"a":"[A] ruled, [B] monarchy","ev":"4~5번 문장","s":[[4,"A long time ago, countries such as Canada, Australia, and New Zealand were ruled by Britain.","오래전에, 캐나다, 호주, 그리고 뉴질랜드와 같은 나라들은 영국의 지배를 받았다."],[5,"So, these countries have honored the British monarchy by putting their image on money.","그래서, 이 나라들은 영국 왕실의 이미지를 화폐에 넣음으로써 그들을 예우해 왔다."]],"w":"4번에서 이 나라들이 were ruled by Britain(영국의 지배를 받았다), 5번에서 the British monarchy(영국 왕실)를 예우하려고 화폐에 이미지를 넣었다고 함. replaced, design, decided, movement도 본문 단어지만 이 자리에는 맞지 않음.","c":null},"h":"6e5b3d1823"}]},{"u":11,"id":"rg4-11-3","no":3,"ko":"구멍 난 오존층, 지금은 어떨까?","items":[{"n":1,"t":"tf","q":"The ozone layer protects us from the sun’s harmful rays.","ko":"오존층은 태양의 해로운 광선으로부터 우리를 보호한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It protects us from the sun’s harmful rays, which can cause skin cancer and damage crops.","그것은 태양의 해로운 광선으로부터 우리를 보호해 주는데, 그것은 피부암을 유발하고 농작물에 피해를 줄 수 있다."]],"w":"2번 문장에 It protects us from the sun’s harmful rays라고 나옴. protect A from B는 A를 B로부터 보호하다. 같은 내용이라 T.","c":"T"},"h":"34831d318b"},{"n":2,"t":"tf","q":"The Montreal Protocol was signed in 1980.","ko":"몬트리올 의정서는 1980년에 서명되었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번, 8번 문장","s":[[5,"In 1987, countries around the world signed the Montreal Protocol.","1987년, 전 세계의 국가들은 몬트리올 의정서에 서명했다."],[8,"It is expected to be as healthy as it was in 1980 by the year 2066.","그것은 2066년쯤에는 1980년이었을 때만큼 건강할 것으로 예상된다."]],"w":"5번 문장에서 몬트리올 의정서는 1987년에 서명되었음. 1980은 8번에서 오존층이 2066년쯤 회복될 건강 수준의 기준 연도라 서명 연도와 다름. 그래서 F.","c":"F"},"h":"82325a9119"},{"n":3,"t":"tf","q":"Healing the ozone hole has been saving two million people from skin cancer every year.","ko":"오존 구멍을 치유하는 것은 매년 2백만 명의 사람들을 피부암으로부터 구하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The director of the UN Environment Program said that healing the ozone hole has been saving two million people from skin cancer every year.","유엔 환경 계획의 책임자는 오존 구멍을 치유하는 것이 매년 2백만 명의 사람들을 피부암으로부터 구하고 있다고 말했다."]],"w":"11번 문장의 that healing the ozone hole has been saving two million people from skin cancer every year와 같은 내용. 책임자가 한 말이라 T.","c":"T"},"h":"a7941861aa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This layer was destroyed by pollution, but now it’s healing slowly.)","ko":"이 층은 오염으로 ( ) 그러나 지금은 천천히 회복되고 있다.","opts":["파괴되었다","보호되었다","측정되었다","팔렸다"],"word":"destroyed","r":{"a":"1) 파괴되었다","ev":"3번 문장","s":[[3,"This layer was destroyed by pollution, but now it’s healing slowly.","이 층은 오염으로 파괴되었지만, 지금은 천천히 회복되고 있다."]],"w":"3번에서 오염 때문에 ‘파괴되었다’가 but 뒤의 ‘회복되고 있다’와 반대로 연결됨. destroyed는 destroy(파괴하다)의 수동 표현. 보호되었다면 회복될 필요가 없음.","c":1},"h":"76952f7ecc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It’s an agreement whose terms include stopping the use of chemicals damaging the ozone layer.)","ko":"그것은 오존층에 손상을 주는 화학물질의 사용을 중단하는 것을 포함하는 ( )이 있는 협약이다.","opts":["조건","취미","질문","가격"],"word":"terms","r":{"a":"1) 조건","ev":"5~6번 문장","s":[[5,"In 1987, countries around the world signed the Montreal Protocol.","1987년, 전 세계의 국가들은 몬트리올 의정서에 서명했다."],[6,"It’s an agreement whose terms include stopping the use of chemicals damaging the ozone layer.","그것은 오존층에 손상을 주는 화학물질의 사용을 중단하는 것을 포함하는 조건이 있는 협약이다."]],"w":"6번의 an agreement(협약)의 terms는 협약에 포함된 ‘조건’. 이어서 include stopping the use of chemicals(화학물질 사용 중단)가 그 조건의 내용임.","c":1},"h":"3a7492e8be"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is expected to be as healthy as it was in 1980 by the year 2066.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 2066년쯤에는 1980년이었을 때만큼 건강할 것으로 예상된다.","opts":["몬트리올 의정서","오존층","유엔 보고서","남극 대륙"],"r":{"a":"2) 오존층","ev":"7~8번 문장","s":[[7,"Because of that, the ozone layer is getting healthier, but it takes time.","그것 때문에, 오존층은 점점 건강해지고 있지만, 시간이 걸린다."],[8,"It is expected to be as healthy as it was in 1980 by the year 2066.","그것은 2066년쯤에는 1980년이었을 때만큼 건강할 것으로 예상된다."]],"w":"8번은 7번에서 getting healthier(더 건강해지고 있다)고 한 the ozone layer에 이어서, 2066년쯤이면 1980년만큼 건강할 것으로 예상된다는 내용. 건강해지는 것은 오존층이라 It은 오존층. 협약이나 보고서가 건강해지는 것이 아님.","c":2},"h":"9cff42e2e8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because of that, the ozone layer is getting healthier, but it takes time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것 때문에, 오존층은 점점 건강해지고 있지만, 시간이 걸린다.","opts":["협약 때문에 오존층이 더 건강해지고 있지만, 회복에는 시간이 걸린다.","협약 때문에 오존층이 하루 만에 회복되었다.","협약이 있어도 오존층은 점점 나빠지고 있다.","오존층이 건강해지는 것은 시간이 걸리지 않는다."],"r":{"a":"1) 협약 때문에 오존층이 더 건강해지고 있지만, 회복에는 시간이 걸린다.","ev":"6~7번 문장","s":[[6,"It’s an agreement whose terms include stopping the use of chemicals damaging the ozone layer.","그것은 오존층에 손상을 주는 화학물질의 사용을 중단하는 것을 포함하는 조건이 있는 협약이다."],[7,"Because of that, the ozone layer is getting healthier, but it takes time.","그것 때문에, 오존층은 점점 건강해지고 있지만, 시간이 걸린다."]],"w":"7번의 Because of that(그것 때문에)은 6번의 협약 내용을 가리키고, getting healthier는 점점 건강해지는 중. but it takes time은 ‘하지만 시간이 걸린다’. 하루 만에 회복되었다거나 시간이 걸리지 않는다는 말은 반대임.","c":1},"h":"6c033884a2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["오존층은 지구 표면 아래에 있다.","오존층은 오염으로 파괴되었지만 지금은 천천히 회복되고 있다.","과학자들은 몬트리올 의정서가 실패했다고 말한다.","오존층은 이미 1980년만큼 건강해졌다."],"opts":["The ozone layer is below the Earth’s surface.","The ozone layer was destroyed by pollution but is slowly healing now.","Scientists say the Montreal Protocol failed.","The ozone layer is already as healthy as it was in 1980."],"r":{"a":"2) The ozone layer was destroyed by pollution but is slowly healing now.","ev":"1번, 3번, 8~9번 문장","s":[[1,"The ozone layer is a blanket of gas high above the Earth’s surface.","오존층은 지구 표면 위 높은 곳에 가스로 덮여 있는 것이다."],[3,"This layer was destroyed by pollution, but now it’s healing slowly.","이 층은 오염으로 파괴되었지만, 지금은 천천히 회복되고 있다."],[8,"It is expected to be as healthy as it was in 1980 by the year 2066.","그것은 2066년쯤에는 1980년이었을 때만큼 건강할 것으로 예상된다."],[9,"Scientists say this agreement is one of the biggest environmental victories for humans.","과학자들은 이 협약이 인류에게 가장 큰 환경적 승리 중 하나라고 말한다."]],"w":"3번에서 오염으로 파괴되었지만 지금은 천천히 회복 중임. 1번에서 오존층은 지구 표면 위 높은 곳에 있고, 9번에서 과학자들은 이 협약을 큰 환경적 승리라고 하며, 8번에서 1980년 수준은 2066년쯤에 예상되는 일이라 나머지는 모두 본문과 다름.","c":2},"h":"f91875d10b"},{"n":9,"t":"sum","q":"The ozone layer is (A) slowly because countries signed an agreement to stop using (B) chemicals.","ko":"오존층은 국가들이 (B) 화학물질의 사용을 멈추기로 한 협약을 맺었기 때문에 천천히 (A) 있다.","oko":["(A) 파괴되고 / (B) 안전한","(A) 회복되고 / (B) 안전한","(A) 파괴되고 / (B) 해로운","(A) 회복되고 / (B) 해로운","(A) 팔리고 / (B) 해로운"],"opts":["(A) destroyed / (B) safe","(A) healing / (B) safe","(A) destroyed / (B) harmful","(A) healing / (B) harmful","(A) sold / (B) harmful"],"r":{"a":"4) (A) healing / (B) harmful","ev":"3번, 5~6번 문장","s":[[3,"This layer was destroyed by pollution, but now it’s healing slowly.","이 층은 오염으로 파괴되었지만, 지금은 천천히 회복되고 있다."],[5,"In 1987, countries around the world signed the Montreal Protocol.","1987년, 전 세계의 국가들은 몬트리올 의정서에 서명했다."],[6,"It’s an agreement whose terms include stopping the use of chemicals damaging the ozone layer.","그것은 오존층에 손상을 주는 화학물질의 사용을 중단하는 것을 포함하는 조건이 있는 협약이다."]],"w":"3번에서 오존층이 천천히 healing(회복)되고 있고, 5~6번에서 오존층을 손상시키는 해로운(harmful) 화학물질 사용을 멈추는 협약을 맺었다고 함. destroyed는 이미 지나간 일이고, safe(안전한) 화학물질을 멈출 이유는 없음.","c":4},"h":"5b802cf944"},{"n":10,"t":"fill","q":"Scientists say the Montreal Protocol is one of the biggest environmental [A] for humans, and it shows what is possible when everyone works [B].","ko":"과학자들은 몬트리올 의정서가 인류의 가장 큰 환경적 [A] 중 하나라고 말하며, 이는 모두가 [B] 일할 때 무엇이 가능한지를 보여 준다.","bko":{"victories":"승리들","together":"함께","skin":"피부","layer":"층","pollution":"오염","surface":"표면"},"bank":["victories","together","skin","layer","pollution","surface"],"r":{"a":"[A] victories, [B] together","ev":"9~10번 문장","s":[[9,"Scientists say this agreement is one of the biggest environmental victories for humans.","과학자들은 이 협약이 인류에게 가장 큰 환경적 승리 중 하나라고 말한다."],[10,"Healing the ozone layer shows what’s possible when everyone works together to help our planet.","오존층을 치유하는 것은 모두가 지구를 돕기 위해 함께 할 때 무엇이 가능한지를 보여 준다."]],"w":"9번에서 이 협약은 one of the biggest environmental victories(가장 큰 환경적 승리 중 하나)이고, 10번에서 everyone works together(모두가 함께 일할 때) 무엇이 가능한지 보여 준다고 함. skin, layer, pollution, surface는 이 자리에 맞지 않음.","c":null},"h":"1b06dcaea1"}]},{"u":12,"id":"rg4-12-1","no":1,"ko":"바다에 뚫린 거대한 구멍, 블루 홀","items":[{"n":1,"t":"tf","q":"The deepest blue hole is about 300 meters deep.","ko":"가장 깊은 블루 홀은 약 300미터 깊이이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The deepest one is about 300 meters deep!","가장 깊은 것은 약 300미터 깊이이다!"]],"w":"3번 문장에 The deepest one is about 300 meters deep이라고 나옴. deepest는 deep(깊은)의 최상급. 같은 내용이라 T.","c":"T"},"h":"57a5b9ce6d"},{"n":2,"t":"tf","q":"Submarines are usually sent down into blue holes.","ko":"잠수함은 보통 블루 홀 안으로 내려보내진다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Since submarines cannot be sent down, explorers must enter the blue holes.","잠수함이 내려보내질 수 없기 때문에, 반드시 탐험가들이 블루 홀로 들어가야 한다."]],"w":"8번에서 Since submarines cannot be sent down(잠수함을 내려보낼 수 없다)이라고 함. 그래서 탐험가들이 직접 들어가야 함. 내려보낸다는 말은 반대라서 F.","c":"F"},"h":"e5edfd1be4"},{"n":3,"t":"tf","q":"More than 100 divers have died in one of the blue holes.","ko":"한 블루 홀에서 100명 이상의 잠수부가 죽었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"For example, in one of the blue holes, more than 100 divers have died.","예를 들면, 블루 홀 중 한 곳에서는 100명 이상의 잠수부들이 죽었다."]],"w":"10번 문장에 in one of the blue holes, more than 100 divers have died라고 나옴. have died는 die(죽다)의 현재완료. 같은 내용이라 T.","c":"T"},"h":"90b8bde76f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists once discovered two dead smalltooth sawfish there, which are an endangered species.)","ko":"과학자들은 한때 ( ) 종인 작은 이빨 톱상어 두 마리의 사체를 거기서 발견했다.","opts":["흔한","멸종 위기에 처한","큰","재미있는"],"word":"endangered","r":{"a":"2) 멸종 위기에 처한","ev":"5번 문장","s":[[5,"Scientists once discovered two dead smalltooth sawfish there, which are an endangered species.","과학자들은 한때 멸종 위기종인 작은 이빨 톱상어 두 마리의 사체를 거기서 발견했다."]],"w":"5번에서 톱상어 사체를 발견했고 which are an endangered species라고 함. 죽은 상어가 의미 있는 발견이라는 점에서 개체 수가 적은 ‘멸종 위기에 처한’ 종. 흔하다면 특별한 발견이 아님.","c":2},"h":"7e1e4060ee"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Therefore, proper training and equipment are necessary to carry out research in a blue hole.)","ko":"그러므로, 블루 홀에서 연구를 수행하기 위해 적절한 훈련과 장비는 ( )이다.","opts":["쓸모없는","위험한","값싼","필수적인"],"word":"necessary","r":{"a":"4) 필수적인","ev":"10~11번 문장","s":[[10,"For example, in one of the blue holes, more than 100 divers have died.","예를 들면, 블루 홀 중 한 곳에서는 100명 이상의 잠수부들이 죽었다."],[11,"Therefore, proper training and equipment are necessary to carry out research in a blue hole.","그러므로, 블루 홀에서 연구를 수행하기 위해 적절한 훈련과 장비는 필수적이다."]],"w":"10번에서 100명 이상의 잠수부가 죽을 만큼 위험하다고 했고, 11번에서 그러므로 훈련과 장비가 ‘꼭 필요하다(필수적이다)’는 흐름. necessary는 ‘필수적인’. 쓸모없다면 Therefore로 이어지지 않음.","c":4},"h":"10c4e859d5"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat can be extremely dangerous.","ko":"밑줄 친 That이 가리키는 것은?","sko":"그것은 극도로 위험할 수 있다.","opts":["블루 홀이 바다에 있다는 사실","블루 홀이 300미터 깊이라는 것","탐험가들이 블루 홀에 들어가야 한다는 것","해수면이 낮았던 것"],"r":{"a":"3) 탐험가들이 블루 홀에 들어가야 한다는 것","ev":"8~9번 문장","s":[[8,"Since submarines cannot be sent down, explorers must enter the blue holes.","잠수함이 내려보내질 수 없기 때문에, 반드시 탐험가들이 블루 홀로 들어가야 한다."],[9,"That can be extremely dangerous.","그것은 극도로 위험할 수 있다."]],"w":"9번 That can be extremely dangerous는 바로 앞 8번의 explorers must enter the blue holes(탐험가들이 블루 홀에 들어가야 한다)를 가리킴. 그것이 극도로 위험하다는 말. 10번의 잠수부 사망 예시도 이 내용을 뒷받침함.","c":3},"h":"3a16259444"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The unique environment makes these underwater caves one of the least studied natural wonders today.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 독특한 환경은 이 수중 동굴들을 오늘날 연구가 가장 덜 된 경이로운 자연경관 중 하나로 만든다.","opts":["이 수중 동굴들은 가장 많이 연구된 자연경관이다.","독특한 환경 때문에 이 수중 동굴들은 오늘날 연구가 가장 덜 된 자연경관 중 하나이다.","수중 동굴들은 독특하지 않아서 연구되지 않았다.","수중 동굴의 환경은 오늘날 모두 연구가 끝났다."],"r":{"a":"2) 독특한 환경 때문에 이 수중 동굴들은 오늘날 연구가 가장 덜 된 자연경관 중 하나이다.","ev":"12번 문장","s":[[12,"The unique environment makes these underwater caves one of the least studied natural wonders today.","그 독특한 환경은 이 수중 동굴들을 오늘날 연구가 가장 덜 된 경이로운 자연경관 중 하나로 만든다."]],"w":"12번은 The unique environment makes A B(독특한 환경이 A를 B로 만든다) 구조. B는 one of the least studied natural wonders(가장 덜 연구된 자연경관 중 하나). least studied는 ‘가장 덜 연구된’이라 가장 많이 연구되었다는 것은 반대.","c":2},"h":"abc85744d6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["과학자들은 블루 홀에서 두 마리의 죽은 작은 이빨 톱상어를 발견했다.","블루 홀은 땅 위에 있는 높은 산이다.","잠수함이 블루 홀에서 연구를 한다.","블루 홀에서는 아무도 죽지 않았다."],"opts":["Scientists found two dead smalltooth sawfish in a blue hole.","Blue holes are high mountains on land.","Submarines do research in blue holes.","No one has died in blue holes."],"r":{"a":"1) Scientists found two dead smalltooth sawfish in a blue hole.","ev":"2번, 5번, 8번, 10번 문장","s":[[2,"Blue holes are underwater caves that look like deep, dark circles in the sea.","블루 홀은 바다에 있는 깊고 어두운 원형처럼 보이는 수중 동굴이다."],[5,"Scientists once discovered two dead smalltooth sawfish there, which are an endangered species.","과학자들은 한때 멸종 위기종인 작은 이빨 톱상어 두 마리의 사체를 거기서 발견했다."],[8,"Since submarines cannot be sent down, explorers must enter the blue holes.","잠수함이 내려보내질 수 없기 때문에, 반드시 탐험가들이 블루 홀로 들어가야 한다."],[10,"For example, in one of the blue holes, more than 100 divers have died.","예를 들면, 블루 홀 중 한 곳에서는 100명 이상의 잠수부들이 죽었다."]],"w":"5번에서 죽은 작은 이빨 톱상어 두 마리를 발견함. 2번에서 블루 홀은 바다의 수중 동굴이고, 8번에서 잠수함을 보낼 수 없고, 10번에서 100명 이상의 잠수부가 죽었으므로 나머지는 모두 본문과 다름.","c":1},"h":"e0b6cfd18e"},{"n":9,"t":"sum","q":"Blue holes have a lot of sea life and show how the sea has (A), but they are (B) to explore, so proper training is needed.","ko":"블루 홀에는 해양 생물이 많고 바다가 어떻게 (A)했는지 보여 주지만, 탐험하기에 (B)해서 적절한 훈련이 필요하다.","oko":["(A) 변화 / (B) 쉬워","(A) 변화 / (B) 위험해","(A) 변화 / (B) 지루해","(A) 같은 상태 / (B) 위험해","(A) 같은 상태 / (B) 쉬워"],"opts":["(A) changed / (B) easy","(A) changed / (B) dangerous","(A) changed / (B) boring","(A) stayed the same / (B) dangerous","(A) stayed the same / (B) easy"],"r":{"a":"2) (A) changed / (B) dangerous","ev":"4번, 6번, 9번, 11번 문장","s":[[4,"Scientists are really interested in blue holes because they are full of different kinds of sea life.","블루 홀은 다양한 종류의 해양 생물로 가득하기 때문에 과학자들은 그것들에 정말로 관심이 많다."],[6,"In addition, the holes show how the sea and marine life have changed over time.","게다가, 그 구멍들은 바다와 해양 생물이 시간이 지나면서 어떻게 변해 왔는지를 보여 준다."],[9,"That can be extremely dangerous.","그것은 극도로 위험할 수 있다."],[11,"Therefore, proper training and equipment are necessary to carry out research in a blue hole.","그러므로, 블루 홀에서 연구를 수행하기 위해 적절한 훈련과 장비는 필수적이다."]],"w":"6번에서 구멍들은 바다와 해양 생물이 시간이 지나면서 changed(변해 왔는지)를 보여 주고, 9번에서 들어가는 것이 extremely dangerous(극도로 위험)하며, 11번에서 그래서 적절한 훈련과 장비가 필수라고 함. easy나 boring이라는 말은 없음.","c":2},"h":"8e92d2009d"},{"n":10,"t":"fill","q":"Blue hole elicopter down to the ground.","라이다는 헬리콥터에서 땅을 향해 레이저 광선을 보내서 작동한다."],[5,"Lidar is really helpful because it can see through trees and make clear pictures of what’s below.","라이다는 나무들을 관통해서 볼 수 있고 아래에 있는 것의 선명한 그림들을 만들어 낼 수 있기 때문에 정말로 유용하다."],[8,"Before Lidar, ancient sites took years to dig up.","라이다 이전에는 고대 유적지는 파내는 데만 수년이 걸렸다."],[10,"In the U.K., an archaeologist used Lidar data to find Roman roads hidden for centuries.","영국에서는, 한 고고학자가 라이다 자료를 사용하여 수 세기 동안 숨겨진 로마의 도로를 찾았다."]],"w":"8번에서 라이다 이전에는 고대 유적지를 파내는 데 수년이 걸렸음. 2번에서 레이저는 헬리콥터에서 땅으로 보내고, 5번에서 나무를 관통해 볼 수 있고, 10번에서 영국에서 찾은 것은 로마의 도로이므로 나머지는 모두 본문과 다름.","c":2},"h":"3c06a375ba"},{"n":9,"t":"sum","q":"Lidar sends (A) to make 3D maps, so archaeologists can find (B) sites without digging up everything.","ko":"라이다는 3D 지도를 만들기 위해 (A)을 보내고, 그래서 고고학자들은 모든 것을 파내지 않고도 (B) 유적지를 찾을 수 있다.","oko":["(A) 소리 / (B) 숨겨진","(A) 레이저 광선 / (B) 숨겨진","(A) 레이저 광선 / (B) 현대의","(A) 소리 / (B) 현대의","(A) 물 / (B) 숨겨진"],"opts":["(A) sounds / (B) hidden","(A) laser beams / (B) hidden","(A) laser beams / (B) modern","(A) sounds / (B) modern","(A) water / (B) hidden"],"r":{"a":"2) (A) laser beams / (B) hidden","ev":"2번, 4번, 6~7번 문장","s":[[2,"Lidar works by sending laser beams from a helicopter down to the ground.","라이다는 헬리콥터에서 땅을 향해 레이저 광선을 보내서 작동한다."],[4,"This creates detailed 3D maps fast.","이것은 상세한 3D 지도를 빠르게 만들어 낸다."],[6,"This way, scientists and explorers can discover new things about our world and history without digging up everything.","이 방식으로 과학자들과 탐험가들은 모든 것을 파내지 않고도 우리의 세계와 역사에 대한 새로운 것을 발견할 수 있다."],[7,"In archaeology, Lidar helps to find ancient buildings and roads hidden under forests or deep in the jungle.","고고학에서 라이다는 숲 아래나 정글 깊숙이 숨겨진 고대의 건물과 도로를 찾는 데 도움을 준다."]],"w":"2번에서 라이다는 laser beams를 보내 작동하고, 4번에서 3D 지도를 만들고, 6~7번에서 파내지 않고도 숲 아래 hidden(숨겨진) 고대 건물과 도로를 찾는다고 함. 소리나 물을 보낸다는 말은 없고, 고고학 유적은 현대의 것이 아님.","c":2},"h":"57462fea95"},{"n":10,"t":"fill","q":"Before Lidar, ancient sites took [A] to dig up, but now 3D maps for the places can b 에 시험되었다’. 이제는 인간에게도 효과가 있다고 알게 됨. 같은 내용이라 T.","c":"T"},"h":"6445313046"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Normal cells are supposed to grow, divide, and eventually die…)","ko":"정상 세포들은 자라서 분열하며 ( ) 죽게 되어 있다…","opts":["갑자기","결국","거의 안","빨리"],"word":"eventually","r":{"a":"2) 결국","ev":"3번 문장","s":[[3,"Normal cells are supposed to grow, divide, and eventually die, but aging cells, like zombies, don’t follow this rule.","정상 세포들은 자라서 분열하며 결국에는 죽게 되어 있지만, 노화 세포들은 좀비처럼 이 규칙을 따르지 않는다."]],"w":"3번에서 정상 세포가 grow(자라다), divide(분열하다) 뒤에 마지막으로 die(죽다)한다는 순서. eventually는 ‘결국’. 4번에서 노화 세포는 대신에 죽지 않는다고 하니, 정상 세포는 ‘결국 죽는다’는 대조임.","c":2},"h":"966d0b5dfc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They want to find out exactly where these cells are, what they’re doing, and how they can remove them effectively.)","ko":"그들은 이 세포들이 ( ) 어디에 있는지, 무엇을 하는지, 그리고 그것들을 어떻게 효과적으로 제거할 수 있는지를 알아내길 원한다.","opts":["위험하게","대충","정확히","느리게"],"word":"exactly","r":{"a":"3) 정확히","ev":"10번 문장","s":[[10,"They want to find out exactly where these cells are, what they’re doing, and how they can remove them effectively.","그들은 이 세포들이 정확히 어디에 있는지, 그것들이 무엇을 하는지와 그들이 그것들을 어떻게 효과적으로 제거할 수 있는지를 알아내길 원한다."]],"w":"10번에서 연구원들이 세포가 ‘정확히’ 어디에 있는지 알고 싶어 한다는 문맥. 9번에서 몸 전체의 지도를 만들고 있다는 말과도 이어짐. exactly는 ‘정확히’이고, 대충이면 지도를 만들 필요가 없음.","c":3},"h":"a3832168e9"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBefore, this method was only tested on mice, but now they know it does work on humans, too.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이전에는, 이 방법이 쥐들에게만 실험되었지만, 이제 그들은 그것이 인간에게도 정말 효과가 있다는 것을 안다.","opts":["쥐","이 방법(노화 세포를 약으로 제거하는 것)","병원","노인"],"r":{"a":"2) 이 방법(노화 세포를 약으로 제거하는 것)","ev":"7~8번 문장","s":[[7,"Scientists in a U.S. clinic did an experiment with elderly people and discovered that we can actually remove these aging cells with medicine.","미국의 한 병원의 과학자들이 노인들을 대상으로 실험을 하여 우리가 실제로 이 노화 세포들을 약물로 제거할 수 있다는 것을 발견했다."],[8,"Before, this method was only tested on mice, but now they know it does work on humans, too.","이전에는, 이 방법이 쥐들에게만 실험되었지만, 이제 그들은 그것이 인간에게도 정말 효과가 있다는 것을 안다."]],"w":"8번에서 this method(이 방법)는 7번에서 발견한 약으로 노화 세포를 제거하는 방법. 이전에는 쥐에게만 실험했는데 이제는 it(그 방법)이 인간에게도 효과가 있음을 안다는 흐름. 쥐나 노인 자체가 효과가 있다는 뜻이 아님.","c":2},"h":"ee2b1ba49a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Their goal is to help us stay healthier as we get older by understanding and managing these zombie cells better.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들의 목표는 이 좀비 세포들을 더 잘 이해하고 관리함으로써 우리가 나이 들수록 건강을 더 잘 유지하도록 돕는 것이다.","opts":["그들의 목표는 좀비 세포를 없애서 우리가 젊어지게 하는 것이다.","그들의 목표는 좀비 세포를 더 잘 이해하고 관리하여 나이 들수록 더 건강하게 지내도록 돕는 것이다.","그들의 목표는 좀비 세포를 만들어 나이 든 사람에게 주는 것이다.","그들의 목표는 좀비 세포의 이름을 새로 짓는 것이다."],"r":{"a":"2) 그들의 목표는 좀비 세포를 더 잘 이해하고 관리하여 나이 들수록 더 건강하게 지내도록 돕는 것이다.","ev":"11번 문장","s":[[11,"Their goal is to help us stay healthier as we get older by understanding and managing these zombie cells better.","그들의 목표는 이 좀비 세포들을 더 잘 이해하고 관리함으로써 우리가 나이 들수록 건강을 더 잘 유지하도록 돕는 것이다."]],"w":"11번의 Their goal is to help us stay healthier는 ‘우리가 더 건강하게 지내도록 돕는 것’이고, by understanding and managing(이해하고 관리함으로써)이 방법. 젊어지게 한다는 말은 없고, 세포를 만들어 주는 것은 반대임.","c":2},"h":"c8c48b720b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["노화 세포는 정상 세포처럼 결국에는 죽는다.","과학자들은 노인들을 대상으로 한 실험에서 약으로 노화 세포를 제거할 수 있음을 발견했다.","연구원들은 뇌 안은 제외하고 몸을 지도로 만들고 있다.","좀비 세포는 나이가 들수록 줄어든다."],"opts":["Aging cells eventually die just like normal cells.","Scientists found that medicine can remove aging cells in an experiment with elderly people.","Researchers are mapping the body, not including the brain.","Zombie cells decrease as we get older."],"r":{"a":"2) Scientists found that medicine can remove aging cells in an experiment with elderly people.","ev":"3번, 6~7번, 9번 문장","s":[[3,"Normal cells are supposed to grow, divide, and eventually die, but aging cells, like zombies, don’t follow this rule.","정상 세포들은 자라서 분열하며 결국에는 죽게 되어 있지만, 노화 세포들은 좀비처럼 이 규칙을 따르지 않는다."],[6,"As we get older, these zombie cells increase and might become one of the reasons why we age.","우리가 나이 들수록, 이 좀비 세포들은 증가하고 우리가 늙게 되는 이유 중 하나가 될지도 모른다."],[7,"Scientists in a U.S. clinic did an experiment with elderly people and discovered that we can actually remove these aging cells with medicine.","미국의 한 병원의 과학자들이 노인들을 대상으로 실험을 하여 우리가 실제로 이 노화 세포들을 약물로 제거할 수 있다는 것을 발견했다."],[9,"Recently, researchers are mapping these zombie cells throughout the body, including in the brain.","최근에 연구원들은 뇌 안을 포함하여 몸 전체에 걸쳐 이 좀비 세포들의 지도를 만들고 있다."]],"w":"7번에서 노인들을 대상으로 한 실험에서 약으로 노화 세포를 제거할 수 있음을 발견함. 3~4번에서 노화 세포는 죽지 않고, 9번에서 뇌 안을 포함하여 지도를 만들고, 6번에서 나이가 들수록 증가하므로 나머지는 모두 본문과 다름.","c":2},"h":"d3c9b752aa"},{"n":9,"t":"sum","q":"Aging cells stop (A) but don’t die, and scientists are trying to (B) them better to help us stay healthy.","ko":"노화 세포는 (A)을 멈추지만 죽지는 않으며, 과학자들은 우리가 건강을 유지하도록 돕기 위해 그것들을 더 잘 (B)하려고 한다.","oko":["(A) 분열 / (B) 이해하고 관리","(A) 분열 / (B) 만들고 늘리","(A) 성장 / (B) 만들고 늘리","(A) 성장 / (B) 이해하고 관리","(A) 이동 / (B) 만들고 늘리"],"opts":["(A) dividing / (B) understand and manage","(A) dividing / (B) make and increase","(A) growing / (B) make and increase","(A) growing / (B) understand and manage","(A) moving / (B) make and increase"],"r":{"a":"1) (A) dividing / (B) understand and manage","ev":"4번, 11번 문장","s":[[4,"Instead, they stop dividing but don’t die.","대신에 그것들은 분열하는 것을 멈추지만 죽지는 않는다."],[11,"Their goal is to help us stay healthier as we get older by understanding and managing these zombie cells better.","그들의 목표는 이 좀비 세포들을 더 잘 이해하고 관리함으로써 우리가 나이 들수록 건강을 더 잘 유지하도록 돕는 것이다."]],"w":"4번에서 노화 세포는 dividing(분열)을 멈추지만 죽지 않고, 11번에서 연구의 목표는 이 세포들을 이해하고 관리(understand and manage)하는 것이라고 함. 키우거나 늘리려는 것이 아니고, 5번에서 이동은 계속하는 일이라 ‘멈추는 것’은 아님.","c":1},"h":"35e4a91696"},{"n":10,"t":"fill","q":"Scientists in a U.S. clinic found that we can [A] aging cells with medicine, and they did the experiment with elderly [B].","ko":"미국 병원의 과학자들은 약으로 노화 세포를 [A] 수 있다는 것을 발견했고, 노인 [B]을 대상으로 실험했다.","bk
