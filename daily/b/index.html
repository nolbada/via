<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1f2a24;--sub:#6b766f;--line:#dfe4de;--pri:#2f7d5b;--priInk:#fff;--ok:#2f7d5b;--okBg:#e4f3ea;--ng:#c0392b;--ngBg:#fbe9e6;--hi:#fff3cf;--star:#d9a400}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d231f;--ink:#e8eee9;--sub:#97a39b;--line:#2f3832;--pri:#4fb98a;--priInk:#0e1612;--ok:#58c28f;--okBg:#183024;--ng:#ec7a6c;--ngBg:#3a1f1b;--hi:#3a3216;--star:#f0c030}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif;line-height:1.55}
#app{max-width:680px;margin:0 auto;padding:16px 16px 56px}
h1{font-size:22px;margin:8px 0 0}
.subt{color:var(--sub);margin:2px 0 14px;font-size:14px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:600}
.btn.pri{background:var(--pri);color:var(--priInk);border-color:var(--pri)}
.btn:disabled{opacity:.45}
.row{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.row .btn{flex:1;min-width:130px}
.prog{font-size:14px;color:var(--sub);margin:4px 0 10px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:12px}.bar i{display:block;height:100%;background:var(--pri)}
.wk{margin:14px 0 4px;font-size:13px;color:var(--sub);font-weight:600}
.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.day{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 2px;min-height:62px;text-align:center;font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:2px}
.day b{font-size:13px}
.day.done{border-color:var(--pri);background:var(--okBg)}
.hwc{margin:2px 0 12px;font-size:14px;line-height:1.5}.hwc .late{color:var(--ng);font-weight:700;margin-left:6px}.day.today{border:2px solid var(--pri);box-shadow:0 0 0 3px var(--okBg)}.day.late{border-color:var(--ng)}
.day.next{border:2px solid var(--pri);box-shadow:0 0 0 3px var(--okBg)}
.stamp{width:34px;height:34px;border-radius:50%;border:2px solid var(--pri);color:var(--pri);font-weight:700;font-size:12px;display:flex;align-items:center;justify-content:center;transform:rotate(-8deg)}
.day small{color:var(--sub);font-size:10px;line-height:1.1}
.top{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.top .t{flex:1;font-size:14px;color:var(--sub)}
.sbtn{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:6px 12px;font-size:14px}
.sbtn.on{color:var(--star);border-color:var(--star);font-weight:700}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin:8px 0}
.tag{display:inline-block;font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:1px 9px;margin-bottom:8px}
.prompt{font-weight:700;margin:0 0 10px}
.stem{font-size:17px;margin:0 0 12px;padding:10px 12px;background:var(--bg);border-radius:10px;word-break:keep-all;overflow-wrap:anywhere}
.kr{font-size:15px;line-height:1.6;color:var(--sub,#667);margin:-4px 0 12px;padding:0 4px;word-break:keep-all}
u{text-decoration:underline;text-decoration-skip-ink:none;-webkit-text-decoration-skip:none;text-underline-offset:3px;text-decoration-thickness:2px}
.ch{display:flex;gap:8px;width:100%;text-align:left;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:12px;margin:7px 0;font-size:16px;align-items:flex-start}
.ch .n{font-weight:700;color:var(--sub);min-width:20px}
.ch.sel{border-color:var(--pri);background:var(--okBg)}
.ch.ok{border-color:var(--ok);background:var(--okBg)}
.ch.ng{border-color:var(--ng);background:var(--ngBg)}
.ch:disabled{opacity:1;color:inherit}
input.tx{width:100%;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--card);color:var(--ink)}
input.tx.ok{border-color:var(--ok);background:var(--okBg)}input.tx.ng{border-color:var(--ng);background:var(--ngBg)}
.fb{margin-top:12px;padding:12px;border-radius:12px;font-size:15px}
.fb.ok{background:var(--okBg)}.fb.ng{background:var(--ngBg)}
.fb h3{margin:0 0 6px;font-size:16px}
.fb .x{white-space:pre-wrap;margin:6px 0 0}
.fb .l{font-size:12px;color:var(--sub);margin-top:8px}
.nb{width:100%;margin-top:12px}
.score{font-size:40px;font-weight:800;margin:8px 0}
.wl{margin:0;padding:0;list-style:none}
.wl li{padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.empty{color:var(--sub);text-align:center;padding:28px 0}

:root{--note:#fff6cf;--noteLine:#e8cf6a;--noteInk:#4a3d08;--chip:#eef1ec;--mk:#ffe680}
@media (prefers-color-scheme:dark){:root{--note:#3a3216;--noteLine:#7a6620;--noteInk:#f1e2a0;--chip:#27302a;--mk:#6b5a14}}
.pair{display:flex;flex-direction:column;gap:14px;margin:0 0 14px}
.sent{display:grid;grid-template-columns:26px 1fr;gap:10px;align-items:start;padding:12px;background:var(--bg);border-radius:12px}
.sent .no{width:24px;height:24px;border-radius:50%;background:var(--pri);color:var(--priInk);font-size:13px;font-weight:700;display:grid;place-items:center;margin-top:2px}
.sent .en{font-size:17px;overflow-wrap:anywhere}
.sent .ko{font-size:14px;color:var(--sub);margin-top:4px;word-break:keep-all}
.fc{margin-top:12px;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--card)}
.fc .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;padding:11px 14px;font-weight:700}
.fc.ok .head{background:var(--okBg);color:var(--ok)}
.fc.ng .head{background:var(--ngBg);color:var(--ng)}
.fc .head .ans{margin-left:auto;font-size:16px;color:var(--ink);word-break:keep-all;overflow-wrap:anywhere;text-align:right}
.fc .body{padding:4px 14px 14px;display:flex;flex-direction:column;gap:14px}
.fc h4{margin:12px 0 6px;font-size:12px;letter-spacing:.06em;color:var(--sub);font-weight:700}
.fc .tx2{white-space:pre-wrap;font-size:15px;word-break:keep-all;overflow-wrap:anywhere}
.fc .tx2.key{background:var(--okBg);border-radius:8px;padding:8px 10px;font-weight:600}
.fc .tx2.oth{margin-top:8px;color:var(--ink)}
.fc .note{background:var(--note);color:var(--noteInk);border:1px solid var(--noteLine);border-radius:6px 14px 14px 14px;padding:12px 14px;box-shadow:3px 3px 0 var(--noteLine)}
.fc .note .lab{display:block;font-size:12px;font-weight:700;letter-spacing:.08em;margin-bottom:4px}
.fc .note p{margin:0;font-size:16px;font-weight:600;word-break:keep-all;overflow-wrap:anywhere}
.fc.ok .note{box-shadow:none;background:var(--chip);border-color:var(--line);color:var(--ink)}
.fc.ok .note p{font-weight:500;font-size:15px}
.fc .exs{display:flex;flex-direction:column;gap:10px}
.fc .exs .e{padding-left:12px;border-left:3px solid var(--line)}
.fc .exs .lb{font-size:12px;font-weight:700;color:var(--pri);margin-bottom:2px;word-break:keep-all}
.fc .exs .en{font-size:16px;overflow-wrap:anywhere}
.fc .exs .ko{font-size:14px;color:var(--sub);word-break:keep-all}
.fc mark{background:linear-gradient(transparent 50%,var(--mk) 50%);color:inherit;font-weight:700}

<div id="app"></div>
<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  var TM=/[?&]t=1(&|$)/.test(W.location.search);if(TM)W.TEACHER_MODE=true;
  var URL_=TM?'https://script.google.com/macros/s/AKfycbz0OolJAHbhYzjWxOkRY851Sn1-ZKL3JOYf4eWancUEotJsm4-z6aWzcm-71I9CIWyR/exec':(W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec'),PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){if(TM)return'신유정'+((/[?&]c=([AB])(&|$)/.exec(W.location.search)||[])[1]||'');return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },hwget:function(){var n=name();if(!n)return Promise.resolve([]);return post({act:'hwget',name:n,pin:PIN}).then(function(r){return(r&&r.ok&&r.hw)||[]},function(){return[]})},gate:gate,flush:flush,name:name};
  flush();
})(window);

const D={"level":"B","sets":[{"day":1,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"bold","a":"4","e":"④ brave: 용감한 (안전한 직장을 그만두고 자기 회사를 차린 것은 대담한 결정이었다.) / bold(대담한, 용감한)의 유의어.","w":"① cautious: 조심스러운\n② modest: 겸손한\n③ stubborn: 고집 센","k":"안전한 직장을 그만두고 자기 회사를 차린 것은 대담한 결정이었다.","m":0,"s":"It was a bold decision to leave a safe job and start his own company.","h":"bold","c":["cautious","modest","stubborn","brave"],"mn":"대담한, 용감한","hk":"bold(대담한)는 brave(용감한)와 같은 편. 반대편은 cautious(조심스러운), modest(겸손한)는 성격이 다른 속임수.","ex":[["She made [[a bold move]] and spoke first.","그녀는 [[대담한 행동]]으로 먼저 말을 꺼냈다."],["It was [[a bold plan]] to cross the sea alone.","혼자 바다를 건너는 것은 [[대담한 계획]]이었다."],["The team made [[a bold decision]] to change the game plan.","팀은 경기 계획을 바꾸는 [[대담한 결정]]을 했다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"habitat","a":"2","e":"② habitat: 서식지","w":"① continent: 대륙\n③ habit: 습관, 버릇\n④ terrain: 지형","m":0,"s":"habitat","c":["대륙","서식지","습관, 버릇","지형"],"mn":"서식지","hk":"habitat(서식지)은 동물이 사는 곳, habit(습관)은 몸에 밴 행동. 철자가 비슷한 habit(습관)에 속지 않기.","ex":[["Forests are [[the habitat]] of many animals.","숲은 많은 동물의 [[서식지]]이다."],["Pandas lose their [[natural habitat]] when trees are cut.","나무가 베이면 판다는 [[자연 서식지]]를 잃는다."],["We must [[protect the habitat]] of sea turtles.","우리는 바다거북의 [[서식지를 보호해야]] 한다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"scholarship","a":"1","e":"① scholarship: (학생에게 주어지는 일정 액수의 돈 / 그 학생이 공부를 계속할 수 있도록) 장학금","w":"② fee: 요금, 수수료\n③ refund: 환불\n④ tuition: 등록금","k":"학생에게 주어지는 일정 액수의 돈 / 그 학생이 공부를 계속할 수 있도록","m":0,"s":"\"an amount of money that is given to a student so that he or she can continue studying\"","c":["scholarship","fee","refund","tuition"],"mn":"장학금","hk":"scholarship(장학금)은 공부를 계속하라고 학생에게 주는 돈. fee(요금), tuition(등록금)은 학생이 내는 돈이라 속임수.","ex":[["She won [[a scholarship]] to study in Canada.","그녀는 캐나다에서 공부할 [[장학금]]을 받았다."],["He plans to [[apply for a scholarship]] this fall.","그는 올가을 [[장학금을 신청할]] 계획이다."],["[[A full scholarship]] covers all school costs.","[[전액 장학금]]은 모든 학비를 해결해 준다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"expedition","a":"3","e":"③ expedition: 원정, 탐험, 탐험대 (남극으로의 원정은 거의 여섯 달이 걸렸다.)","w":"① reception: 접수처, 프런트\n② election: 선거\n④ exhibition: 전시회","k":"남극으로의 원정은 거의 여섯 달이 걸렸다.","m":0,"s":"The ________ to the South Pole lasted almost six months.","c":["reception","election","expedition","exhibition"],"mn":"원정, 탐험, 탐험대","hk":"expedition(원정, 탐험)은 멀리 떠나는 탐험대. 철자가 비슷한 exhibition(전시회), election(선거)과 구분.","ex":[["They joined [[a mountain expedition]] last summer.","그들은 지난여름 [[산악 원정]]에 참가했다."],["[[The expedition]] reached the top after ten days.","[[원정대]]는 열흘 만에 정상에 닿았다."],["She led [[a research expedition]] to the jungle.","그녀는 정글로 가는 [[연구 탐험대]]를 이끌었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"reduce","a":"1,4","e":"① increase: 늘리다, 인상하다\n④ raise: 올리다 (그 회사는 지난달 제품의 가격을 낮추기로 결정했다.) / reduce(줄이다, 낮추다)의 반의어.","w":"② maintain: 유지하다\n③ measure: 측정하다","k":"그 회사는 지난달 제품의 가격을 낮추기로 결정했다.","m":2,"s":"The company decided to reduce the price of its products last month.","h":"reduce","c":["increase","maintain","measure","raise"],"mn":"줄이다, 낮추다","hk":"reduce(줄이다)의 반대는 increase(늘리다)와 raise(올리다). maintain(유지하다)은 그대로 두는 속임수.","ex":[["We must [[reduce the cost]] of the trip.","우리는 여행 [[비용을 줄여야]] 한다.","reduce (동) 줄이다, 낮추다"],["The population will [[increase quickly]].","인구는 [[빠르게 늘어날]] 것이다.","increase (동) 늘리다, 인상하다"],["The store will [[raise prices]] next week.","그 가게는 다음 주에 [[가격을 올릴]] 것이다.","raise (동) 올리다"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"debt","a":"debt","e":"debt 빚, 부채","k":"직장을 잃은 뒤, 그는 은행에 큰 빚을 져서 그것을 갚을 수 없었다.","m":0,"s":"After losing his job, he was deep in d______ to the bank and could not pay it back.","mn":"빚, 부채","hk":"debt(빚)는 b가 소리 나지 않는 글자. 소리 나는 대로 det로 쓰기 쉬우니 b 챙기기.","ex":[["He is [[in debt]] to the bank.","그는 은행에 [[빚을 지고 있다]]."],["She worked hard to [[pay off the debt]].","그녀는 [[빚을 갚으려고]] 열심히 일했다."],["[[A large debt]] made life hard for the family.","[[큰 빚]] 때문에 그 가족의 삶이 힘들었다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"observe","a":"2","e":"② watch: 지켜보다 (과학자들은 보고서를 쓰기 전에 수년 동안 야생 동물의 행동을 관찰한다.) / observe(관찰하다, 지켜보다)의 유의어.","w":"① imagine: 상상하다\n③ ignore: 무시하다\n④ describe: 묘사하다","k":"과학자들은 보고서를 쓰기 전에 수년 동안 야생 동물의 행동을 관찰한다.","m":0,"s":"Scientists observe the behavior of wild animals for years before they write a report.","h":"observe","c":["imagine","watch","ignore","describe"],"mn":"관찰하다, 지켜보다","hk":"observe(관찰하다)는 watch(지켜보다)와 같은 편. ignore(무시하다)는 지켜보지 않는 쪽, imagine(상상하다)도 속임수.","ex":[["We [[observed the birds]] from a quiet spot.","우리는 조용한 곳에서 [[새들을 관찰했다]]."],["Doctors [[observe patients]] closely after surgery.","의사들은 수술 후 [[환자를 면밀히 관찰한다]]."],["Children [[observe adults]] and learn from them.","아이들은 [[어른을 지켜보며]] 그들에게서 배운다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"stereotype","a":"1","e":"① stereotype: (사람들이 가지고 있는 고정된 생각 / 특정 집단의 모든 구성원이 어떠하다는 것에 대해 / 그런데 종종 사실이 아닌) 고정관념","w":"② insight: 통찰력\n③ tradition: 전통\n④ theory: 이론","k":"사람들이 가지고 있는 고정된 생각 / 특정 집단의 모든 구성원이 어떠하다는 것에 대해 / 그런데 종종 사실이 아닌","m":0,"s":"\"a fixed idea that people have about what all members of a certain group are like, which is often not true\"","c":["stereotype","insight","tradition","theory"],"mn":"고정관념","hk":"stereotype(고정관념)은 집단 전체를 한 가지로 보는, 종종 사실 아닌 생각. tradition(전통), theory(이론)와 구분.","ex":[["That idea is [[a stereotype]] about teenagers.","그 생각은 십대에 대한 [[고정관념]]이다."],["We should [[break stereotypes]].","우리는 [[고정관념을 깨야]] 한다."],["[[Gender stereotypes]] can limit what kids dream about.","[[성별 고정관념]]은 아이들이 꿈꾸는 것을 제한할 수 있다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"rough","a":"3","e":"③ smooth: 매끄러운, 부드러운 (그 오래된 돌담은 맨손으로 만졌을 때 거칠게 느껴졌다.) / rough(거친, 울퉁불퉁한)의 반의어.","w":"① sharp: 날카로운\n② solid: 단단한\n④ steep: 가파른","k":"그 오래된 돌담은 맨손으로 만졌을 때 거칠게 느껴졌다.","m":0,"s":"The old stone wall felt rough when I touched it with my bare hand.","h":"rough","c":["sharp","solid","smooth","steep"],"mn":"거친, 울퉁불퉁한","hk":"rough(거친)의 반대는 smooth(매끄러운). sharp(날카로운), solid(단단한), steep(가파른)은 반대가 아닌 속임수.","ex":[["They drove along [[a rough road]].","그들은 [[울퉁불퉁한 길]]을 따라 달렸다.","rough (형) 거친, 울퉁불퉁한"],["The baby has [[smooth skin]].","그 아기는 [[매끄러운 피부]]를 가졌다.","smooth (형) 매끄러운, 부드러운"],["She rubbed the table until it felt [[smooth]].","그녀는 탁자가 [[매끄럽게]] 느껴질 때까지 문질렀다.","smooth (형) 매끄러운, 부드러운"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"create","a":"3","e":"create (동) 창조하다, 만들다 - creative (형) 창의적인\n③ rely (동) 믿다, 의지하다 - reliable (형) 믿을 만한","w":"① reality (명) 현실, 사실 - real (형) 진짜의\n② strategy (명) 전략, 방법 - strategic (형) 전략적인\n④ victory (명) 승리 - victorious (형) 승리한","m":0,"s":"create - creative","c":["reality - real","strategy - strategic","rely - reliable","victory - victorious"],"mn":"창조하다, 만들다","hk":"create(창조하다)→creative(창의적인)처럼 동사에서 형용사로. 정답 rely(믿다)→reliable(믿을 만한)도 같은 방향.","ex":[["Artists [[create]] new things every day.","예술가들은 매일 새로운 것을 [[만든다]].","create (동) 창조하다, 만들다"],["She is a girl with [[creative ideas]].","그녀는 [[창의적인 생각]]이 많은 소녀이다.","creative (형) 창의적인"],["You can [[rely on]] your friends.","너는 친구들에게 [[의지할]] 수 있다.","rely (동) 믿다, 의지하다"],["He is [[a reliable friend]].","그는 [[믿을 만한 친구]]이다.","reliable (형) 믿을 만한"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"conscience","a":"2","e":"② conscience: 양심","w":"① justice: 정의, 사법\n③ intent: 의도\n④ logic: 논리","m":0,"s":"\"양심\"","c":["justice","conscience","intent","logic"],"mn":"양심","hk":"conscience(양심)은 clear conscience(거리낌 없는 양심)처럼 쓰는 말. justice(정의), logic(논리)는 속임수.","ex":[["He has [[a clear conscience]] about the test.","그는 그 시험에 대해 [[양심에 거리낌이 없다]]."],["My [[conscience]] told me to tell the truth.","내 [[양심]]이 사실대로 말하라고 했다."],["You should [[follow your conscience]] when you choose.","너는 선택할 때 [[양심을 따라야]] 한다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"gravity","a":"gravity","e":"gravity 중력","k":"아이작 뉴턴은 사과가 왜 땅으로 떨어지는지 설명했다: 바로 중력이라는 힘 때문이다.","m":0,"s":"Isaac Newton explained why an apple falls to the ground: the force of g______.","mn":"중력","al":"gravitation","hk":"gravity(중력)는 gravy(고기 육즙 소스)와 철자가 비슷해 가운데 글자를 빼먹기 쉬움. 끝까지 쓰기.","ex":[["[[The force of gravity]] pulls things down.","[[중력의 힘]]은 물건을 아래로 끌어당긴다."],["[[Earth's gravity]] keeps us on the ground.","[[지구의 중력]]이 우리를 땅 위에 있게 한다."],["The moon has [[less gravity]] than Earth.","달은 지구보다 [[중력이 약하다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"disregarded","a":"4","e":"④ disregarded: 무시하다 (disregard의 과거형) (그는 경고를 무시하고 폭풍 속으로 계속 차를 몰았다.)","w":"① reviewed: 검토하다 (review의 과거형)\n② regretted: 후회하다 (regret의 과거형)\n③ recorded: 기록하다 (record의 과거형)","k":"그는 경고를 무시하고 폭풍 속으로 계속 차를 몰았다.","m":0,"s":"He ________ the warning and kept driving into the storm.","c":["reviewed","regretted","recorded","disregarded"],"mn":"무시하다","hk":"disregarded(무시했다)는 disregard(무시하다)의 과거형. reviewed(검토했다), regretted(후회했다), recorded(기록했다)는 모양만 닮은 속임수.","ex":[["He [[disregarded the rule]] and was punished.","그는 [[규칙을 무시해서]] 벌을 받았다."],["They [[disregarded his advice]] and went on.","그들은 [[그의 충고를 무시하고]] 계속 나아갔다."],["The driver [[disregarded the red light]].","그 운전자는 [[빨간불을 무시했다]]."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"industry","a":"industry","e":"industry (명) 산업 / (명) 근면함, 성실함","k":"조선 산업은 금융 위기 이후 급격한 쇠퇴를 겪었다.\n그의 성공은 운이 아니라 여러 해 동안의 조용한 근면함에서 나왔다.","m":0,"s":"The shipbuilding i______ suffered a sharp decline after the financial crisis.\nHis success came not from luck but from years of quiet i______.","mn":"산업 / 근면함, 성실함","hk":"industry(산업, 근면함)는 두 얼굴. 공장 쪽은 산업, 성실하게 일하는 쪽은 근면함. industrious(근면한)는 근면함 쪽.","ex":[["[[The car industry]] employs many workers.","[[자동차 산업]]은 많은 노동자를 고용한다.","industry (명) 산업"],["[[The tourism industry]] grew fast this year.","올해 [[관광 산업]]이 빠르게 성장했다.","industry (명) 산업"],["Her success came from [[years of industry]].","그녀의 성공은 [[수년간의 근면함]]에서 나왔다.","industry (명) 근면함, 성실함"]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"sentence","a":"4","e":"①문장 / ②문장 / ③문장 / ④판결, 형벌 [④번만 의미가 다름]","k":"①방금 배운 단어를 사용해서 완전한 문장을 써라.\n②그 문단의 첫 문장은 너무 길어서 이해하기 어렵다.\n③각 문장에서 주어와 동사에 밑줄을 그어라.\n④판사는 그에게 그 범죄에 대해 5년 형을 선고했다.","m":0,"c":["Write a complete sentence using the word you just learned.","The first sentence of the paragraph is too long to understand.","Underline the subject and the verb in each sentence.","The judge gave him a five-year sentence for the crime."],"hc":"sentence|sentence|sentence|sentence","mn":"문장 / 판결, 형벌","hk":"sentence(문장)는 글의 단위, 판결 쪽 sentence(형벌)는 판사가 내리는 벌. ④번만 다른 뜻.","ex":[["Read [[the first sentence]] aloud.","[[첫 문장]]을 소리 내어 읽어라.","sentence (명) 문장"],["He wrote [[a short sentence]] on the board.","그는 칠판에 [[짧은 문장]]을 썼다.","sentence (명) 문장"],["The judge gave her [[a light sentence]].","판사는 그녀에게 [[가벼운 형벌]]을 내렸다.","sentence (명) 판결, 형벌"]]}]},{"day":2,"q":[{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"manuscript","a":"manuscript","e":"manuscript 원고","k":"그 편집자는 원고를 인쇄소에 보내기 전에 신중하게 검토했다.","m":0,"s":"The editor reviewed the m______ carefully before sending it to the printer.","mn":"원고","hk":"manuscript(원고)는 손으로 쓴 글에서 온 말. 뒤쪽 script(대본, 글씨)를 정확히 붙여 쓰기.","ex":[["The writer sent [[the manuscript]] to a publisher.","작가는 [[원고]]를 출판사에 보냈다."],["[[A handwritten manuscript]] was found in the attic.","다락방에서 [[손으로 쓴 원고]]가 발견되었다."],["She is still [[revising her manuscript]].","그녀는 아직도 [[원고를 고치고]] 있다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"priority","a":"3","e":"③ priority: 우선순위","w":"① policy: 정책, 방침\n② target: 목표, 대상\n④ schedule: 일정, 스케줄","m":0,"s":"\"우선순위\"","c":["policy","target","priority","schedule"],"mn":"우선순위","hk":"priority(우선순위)는 prior(앞선)에서 나온 말로 '먼저'가 핵심. schedule(일정), target(목표), policy(정책)는 속임수.","ex":[["Safety is [[our top priority]].","안전이 [[우리의 최우선 과제]]이다."],["Health should be [[a high priority]].","건강은 [[높은 우선순위]]여야 한다."],["Let's [[set our priorities]] before we start.","시작하기 전에 [[우선순위를 정하자]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"sway","a":"4","e":"④ sway: 흔들리다, 흔들다 (폭풍이 오기 전 강한 바람 속에서 키 큰 나무들이 흔들리기 시작했다.)","w":"① sink: 가라앉다\n② slide: 미끄러지다\n③ spin: 빙빙 돌다","k":"폭풍이 오기 전 강한 바람 속에서 키 큰 나무들이 흔들리기 시작했다.","m":0,"s":"The tall trees began to ________ in the strong wind before the storm.","c":["sink","slide","spin","sway"],"mn":"흔들리다, 흔들다","hk":"sway(흔들리다)는 바람에 천천히 좌우로 흔들림. spin(빙빙 돌다), slide(미끄러지다), sink(가라앉다)는 움직임이 다른 속임수.","ex":[["The trees [[sway in the wind]].","나무들이 [[바람에 흔들린다]]."],["The boat [[swayed gently]] on the waves.","배가 파도 위에서 [[부드럽게 흔들렸다]]."],["She [[swayed to the music]].","그녀는 [[음악에 맞춰 몸을 흔들었다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"enthusiastic","a":"1","e":"enthusiastic (형) 열정적인 - enthusiasm (명) 열정\n① complex (형) 복잡한 - complexity (명) 복잡성","w":"② exist (동) 존재하다, 살아가다 - existence (명) 존재\n③ suspend (동) 미루다, 중지하다 - suspension (명) 정지, 연기\n④ announce (동) 알리다, 발표하다 - announcement (명) 안내, 발표","m":0,"s":"enthusiastic - enthusiasm","c":["complex - complexity","exist - existence","suspend - suspension","announce - announcement"],"mn":"열정적인","hk":"enthusiastic(열정적인)→enthusiasm(열정)처럼 형용사에서 명사로. complex(복잡한)→complexity(복잡성)가 같은 방향, 나머지는 동사에서 명사.","ex":[["The fans gave [[an enthusiastic welcome]].","팬들은 [[열정적인 환영]]을 보냈다.","enthusiastic (형) 열정적인"],["She started the project with [[great enthusiasm]].","그녀는 [[큰 열정]]으로 그 프로젝트를 시작했다.","enthusiasm (명) 열정"],["This is [[a complex problem]].","이것은 [[복잡한 문제]]이다.","complex (형) 복잡한"],["Nobody understood [[the complexity]] of the plan.","아무도 그 계획의 [[복잡성]]을 이해하지 못했다.","complexity (명) 복잡성"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"insight","a":"4","e":"④ insight: 통찰력","w":"① 상상력: imagination\n② 기억력: memory\n③ 호기심: curiosity","m":0,"s":"insight","c":["상상력","기억력","호기심","통찰력"],"mn":"통찰력","hk":"insight(통찰력)는 in(안쪽)+sight(봄)으로 속을 꿰뚫어 보는 힘. imagination(상상력), curiosity(호기심), memory(기억력)는 속임수.","ex":[["Her book gives [[deep insight]] into history.","그녀의 책은 역사에 대한 [[깊은 통찰]]을 준다."],["Reading gives me [[new insights]].","독서는 내게 [[새로운 통찰]]을 준다."],["She is a woman of [[great insight]].","그녀는 [[뛰어난 통찰력]]을 가진 사람이다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"refund","a":"4","e":"④ refund: (당신에게 돌려지는 돈 / 당신이 반품할 때 / 당신이 산 어떤 것을) 환불 (구입한 물건을 반품할 때 돌려받는 돈)","w":"① fee: 요금, 수수료\n② currency: 통화, 화폐\n③ credit: 신용, 외상","k":"당신에게 돌려지는 돈 / 당신이 반품할 때 / 당신이 산 어떤 것을","m":0,"s":"\"money that is given back to you when you return something you have bought\"","c":["fee","currency","credit","refund"],"mn":"환불 (구입한 물건을 반품할 때 돌려받는 돈)","hk":"refund(환불)는 산 물건을 반품할 때 돌려받는 돈. fee(요금), credit(신용), currency(통화)는 돈 말이지만 돌려받는 돈은 아님.","ex":[["You can get [[a full refund]] if you return it.","반품하면 [[전액 환불]]을 받을 수 있다."],["I asked for [[a refund]] because it was broken.","부서져 있어서 나는 [[환불]]을 요청했다."],["The store will [[refund your money]] in a week.","가게는 일주일 안에 [[돈을 환불해]] 줄 것이다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"abolish","a":"4","e":"④ get rid of: 없애다, 제거하다 (새 정부는 1년 안에 그 불공평한 세금을 폐지하겠다고 약속했다.) / abolish(없애다, 폐지하다)의 유의어.","w":"① enforce: (법을) 집행하다\n② pass: (법안을) 통과시키다\n③ carry out: 시행하다, 수행하다","k":"새 정부는 1년 안에 그 불공평한 세금을 폐지하겠다고 약속했다.","m":0,"s":"The new government promised to abolish the unfair tax within a year.","h":"abolish","c":["enforce","pass","carry out","get rid of"],"mn":"없애다, 폐지하다","hk":"abolish(폐지하다)는 get rid of(없애다)와 같은 편. enforce(집행하다), carry out(시행하다), pass(통과시키다)는 법을 살리는 정반대 속임수.","ex":[["Many countries [[abolished slavery]] long ago.","많은 나라가 오래전에 [[노예제를 폐지했다]]."],["The school decided to [[abolish the rule]].","학교는 [[그 규칙을 없애기로]] 했다."],["Some people want to [[abolish nuclear weapons]].","어떤 사람들은 [[핵무기를 없애고]] 싶어 한다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"remove","a":"1,2","e":"① keep: 그대로 두다, 유지하다\n② add: 더하다, 넣다 (그 요리사는 조리법에서 소금을 빼기로 결정했다.) / remove(제거하다, 없애다)의 반의어.","w":"③ take away: 치우다, 없애다\n④ clear: 치우다, 없애다","k":"그 요리사는 조리법에서 소금을 빼기로 결정했다.","m":2,"s":"The chef decided to remove the salt from the recipe.","h":"remove","c":["keep","add","take away","clear"],"mn":"제거하다, 없애다","hk":"remove(제거하다)의 반대는 keep(유지하다)과 add(더하다). take away(치우다), clear(치우다)는 같은 편이라 속임수.","ex":[["Please [[remove your shoes]] at the door.","문 앞에서 [[신발을 벗어]] 주세요.","remove (동) 제거하다, 없애다"],["Let's [[keep the old name]] of the club.","동아리의 [[옛 이름을 그대로 두자]].","keep (동) 그대로 두다, 유지하다"],["Please [[add some salt]] to the soup.","수프에 [[소금을 좀 넣어]] 주세요.","add (동) 더하다, 넣다"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"horizon","a":"horizon","e":"horizon 지평선, 수평선","k":"선원들은 해가 수평선 아래로 천천히 사라지는 것을 지켜보았다.","m":0,"s":"The sailors watched the sun slowly disappear below the h______.","mn":"지평선, 수평선","hk":"horizon(지평선)은 가운데 z를 s로 쓰기 쉬움. hor-i-z-on으로 끊어 쓰기. 하늘(sky)과 땅이 만나는 선.","ex":[["The sun sank below [[the horizon]].","해가 [[수평선]] 아래로 가라앉았다."],["A ship appeared [[on the horizon]].","배 한 척이 [[수평선 위에]] 나타났다."],["She stared at [[the distant horizon]].","그녀는 [[먼 수평선]]을 바라보았다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"joint","a":"joint","e":"joint (명) 관절, 연결 부위 / (형) 공동의","k":"운동선수가 너무 무리하게 훈련하면 무릎 관절이 쉽게 붓는다.\n두 나라는 몇 달간의 비밀 회담 끝에 공동 성명에 서명했다.","m":0,"s":"The knee j______ swells easily when an athlete trains too hard.\nThe two nations signed a j______ statement after months of secret talks.","mn":"관절, 연결 부위 / 공동의","hk":"joint(관절, 공동의)는 뼈가 이어지는 곳이자 함께 이어진 것이라는 한 뿌리. join(합치다)과 연결해 기억.","ex":[["My [[knee joint]] hurts after running.","달리고 나면 내 [[무릎 관절]]이 아프다.","joint (명) 관절, 연결 부위"],["[[The elbow joint]] lets your arm bend.","[[팔꿈치 관절]] 덕분에 팔이 굽혀진다.","joint (명) 관절, 연결 부위"],["The two schools held [[a joint concert]].","두 학교는 [[공동 공연]]을 열었다.","joint (형) 공동의"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"witness","a":"1","e":"① witness: (범죄나 사고가 일어나는 것을 본 사람 / 그리고 그것을 설명할 수 있는) 목격자 (범죄나 사고가 일어나는 것을 보고 그것을 설명할 수 있는 사람)","w":"② judge: 판사, 심판\n③ consumer: 소비자\n④ client: 고객, 의뢰인","k":"범죄나 사고가 일어나는 것을 본 사람 / 그리고 그것을 설명할 수 있는","m":0,"s":"\"a person who saw a crime or an accident happen and can describe it\"","c":["witness","judge","consumer","client"],"mn":"목격자 (범죄나 사고가 일어나는 것을 보고 그것을 설명할 수 있는 사람)","hk":"witness(목격자)는 사고나 범죄를 직접 본 사람. judge(판사), client(고객), consumer(소비자)는 헷갈리는 속임수.","ex":[["She was [[a witness]] to the accident.","그녀는 그 사고의 [[목격자]]였다."],["The police asked [[the witness]] a few questions.","경찰은 [[목격자]]에게 몇 가지 질문을 했다."],["Many people [[witnessed the fire]].","많은 사람이 [[화재를 목격했다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"strategy","a":"1","e":"① plan: 계획 (우리 팀은 토론 대회에서 이기기 위한 새로운 전략을 생각해냈다.) / strategy(전략, 계획)의 유의어.","w":"② habit: 습관\n③ goal: 목표\n④ result: 결과","k":"우리 팀은 토론 대회에서 이기기 위한 새로운 전략을 생각해냈다.","m":0,"s":"Our team came up with a new strategy to win the debate contest.","h":"strategy","c":["plan","habit","goal","result"],"mn":"전략, 계획","hk":"strategy(전략)는 plan(계획)과 같은 편, 목표를 이루는 큰 계획. goal(목표), result(결과), habit(습관)은 속임수.","ex":[["We need [[a new strategy]].","우리는 [[새로운 전략]]이 필요하다."],["[[A good strategy]] helps you win the game.","[[좋은 전략]]은 경기에서 이기게 해 준다."],["The company changed its [[sales strategy]].","회사는 [[판매 전략]]을 바꿨다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"decrease","a":"1","e":"① increase: 늘어나다, 증가하다 (우리 학교의 학생 수는 매년 계속 감소하고 있다.) / decrease(감소하다, 줄다)의 반의어.","w":"② fall: 떨어지다, 줄어들다\n③ remain: 그대로 있다, 남다\n④ shrink: 줄어들다","k":"우리 학교의 학생 수는 매년 계속 감소하고 있다.","m":0,"s":"The number igure]].","링컨은 [[유명한 역사적 인물]]이다.","figure (명) 인물, 인사"],["He is [[a public figure]].","그는 [[공인]]이다.","figure (명) 인물, 인사"]]}]},{"day":3,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"wealthy","a":"2","e":"② rich: 부유한, 돈이 많은 (그 마을에서 오직 몇몇 부유한 가문만이 그렇게 큰 집을 감당할 수 있었다.) / wealthy(부유한, 재산이 많은)의 유의어.","w":"① generous: 너그러운, 관대한\n③ greedy: 탐욕스러운, 욕심 많은\n④ thrifty: 검소한, 절약하는","k":"그 마을에서 오직 몇몇 부유한 가문만이 그렇게 큰 집을 감당할 수 있었다.","m":0,"s":"Only a few wealthy families in the town could afford such a large house.","h":"wealthy","c":["generous","rich","greedy","thrifty"],"mn":"부유한, 재산이 많은","hk":"wealthy(부유한)는 rich(부유한)와 같은 편. generous(너그러운), thrifty(검소한), greedy(탐욕스러운)는 성격 말이라 속임수.","ex":[["[[A wealthy family]] owns the hotel.","[[부유한 가문]]이 그 호텔을 소유하고 있다."],["He became [[wealthy and famous]].","그는 [[부유하고 유명해졌다]]."],["[[A wealthy businessman]] gave money to the school.","[[부유한 사업가]]가 학교에 돈을 기부했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"deadline","a":"deadline","e":"deadline 마감 기한","k":"나는 마감 기한 전에 보고서를 끝내려고 밤을 새웠다.","m":0,"s":"I stayed up all night to finish my report before the d______.","mn":"마감 기한","hk":"deadline(마감 기한)은 dead(죽은)+line(선)을 이어 쓴 합성어. 두 단어를 붙여 쓰고 중간에 띄우지 않기.","ex":[["Today is [[the deadline]] for the essay.","오늘이 에세이 [[마감 기한]]이다."],["I [[met the deadline]] by working late.","나는 늦게까지 일해서 [[기한을 맞췄다]]."],["He [[missed the deadline]] again.","그는 또 [[마감을 놓쳤다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"include","a":"1","e":"① leave out: 빼다, 제외하다 (그 여행 요금은 아침 식사와 보트 타기를 포함할 것이다.) / include(포함하다)의 반의어.","w":"② involve: 포함하다, 수반하다\n③ contain: 담고 있다, 포함하다\n④ cover: (범위가) 포함하다, 다루다","k":"그 여행 요금은 아침 식사와 보트 타기를 포함할 것이다.","m":0,"s":"The tour price will include breakfast and a boat ride.","h":"include","c":["leave out","involve","contain","cover"],"mn":"포함하다","hk":"include(포함하다)의 반대는 leave out(빼다). involve(수반하다), contain(담고 있다), cover(포함하다)는 같은 편이라 속임수." 가)는 일부라 속임수.","ex":[["The school changed [[its curriculum]] this year.","학교는 올해 [[교육 과정]]을 바꿨다."],["[[The math curriculum]] is hard for me.","[[수학 교육 과정]]은 내게 어렵다."],["English is part of [[the school curriculum]].","영어는 [[학교 교육 과정]]의 일부이다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"company","a":"4","e":"①회사 / ②회사 / ③회사 / ④함께 있음, 동행 [④번만 의미가 다름]","k":"①그 회사는 다음 달에 새 엔지니어 열 명을 채용할 것이다.\n②그녀의 아버지는 큰 소프트웨어 회사에서 일한다.\n③그는 대학을 졸업하자마자 자기 회사를 차렸다.\n④나는 다른 누구보다 그녀와 함께 있는 것이 좋다.","m":0,"c":["The company will hire ten new engineers next month.","Her father works for a large software company.","He started his own company right after college.","I enjoy her company more than anyone else's."],"hc":"company|company|company|company","mn":"회사 / 함께 있음, 동행","hk":"company(회사)는 ①②③에서 회사, ④번 company(함께 있음, 동행)만 다른 뜻. enjoy her company(그녀와 함께함)처럼 쓰임.","ex":[["She works for [[a software company]].","그녀는 [[소프트웨어 회사]]에서 일한다.","company (명) 회사"],["[[The company]] opened a new office.","[[그 회사]]는 새 사무실을 열었다.","company (명) 회사"],["I enjoy [[your company]].","나는 [[너와 함께 있는 것]]이 즐겁다.","company (명) 함께 있음, 동행"]]}]},{"day":4,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"texture","a":"2","e":"② texture: 질감, 감촉","w":"① pattern: 패턴, 무늬\n③ style: 방식, 스타일\n④ tone: 어조, 말투","m":0,"s":"\"질감, 감촉\"","c":["pattern","texture","style","tone"],"mn":"질감, 감촉","hk":"texture(질감, 감촉)은 만졌을 때의 느낌. soft(부드러운), rough(거친)로 설명. pattern(무늬), style(방식), tone(어조)은 속임수.","ex":[["The cake has [[a soft texture]].","그 케이크는 [[부드러운 질감]]을 가졌다."],["I like [[the texture]] of this cloth.","나는 이 천의 [[감촉]]이 좋다."],["The wall has [[a rough texture]].","그 벽은 [[거친 질감]]을 가졌다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"attractive","a":"2,4","e":"② pretty: 예쁜\n④ charming: 매력적인 (새로 생긴 그 카페에는 아주 매력적인 정원이 있어서, 사람들이 하루 종일 그곳에서 사진을 찍는다.) / attractive(매력적인, 마음을 끄는)의 유의어.","w":"① polite: 공손한, 예의 바른\n③ confident: 자신감 있는","k":"새로 생긴 그 카페에는 아주 매력적인 정원이 있어서, 사람들이 하루 종일 그곳에서 사진을 찍는다.","m":2,"s":"The new café has a very attractive garden, so people take pictures there all day.","h":"attractive","c":["polite","pretty","confident","charming"],"mn":"매력적인, 마음을 끄는","hk":"attractive(매력적인)는 pretty(예쁜), charming(매력적인)과 같은 편. polite(공손한), confident(자신감 있는)는 속임수.","ex":[["She has [[an attractive smile]].","그녀는 [[매력적인 미소]]를 가졌다."],["They offered [[an attractive price]].","그들은 [[매력적인 가격]]을 제시했다."],["He found the idea [[very attractive]].","그는 그 생각이 [[아주 매력적이라고]] 느꼈다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"extend","a":"3","e":"③ extend: 늘리다, 연장하다 (그들은 회의 시간을 30분 연장할 것이다.)","w":"① arrange: 배열하다, 마련하다\n② conclude: 결론짓다, 끝내다\n④ settle: 결정하다, 정하다","k":"그들은 회의 시간을 30분 연장할 것이다.","m":0,"s":"They will ________ the meeting time by thirty minutes.","c":["arrange","conclude","extend","settle"],"mn":"늘리다, 연장하다","hk":"extend(늘리다)는 길이나 기간을 바깥으로 뻗음. conclude(끝내다)는 반대로 마무리, arrange(마련하다), settle(결정하다)는 속임수.","ex":[["The school will [[extend the deadline]].","학교는 [[기한을 연장할]] 것이다."],["She [[extended her stay]] by two days.","그녀는 이틀 더 [[체류를 연장했다]]."],["They want to [[extend the road]] to the lake.","그들은 호수까지 [[도로를 연장하고]] 싶어 한다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"improve","a":"1","e":"improve (동) 향상시키다, 나아지다 - improvement (명) 개선, 향상\n① resist (동) 저항하다, 견디다 - resistance (명) 저항","w":"② honest (형) 정직한 - honesty (명) 정직\n③ similar (형) 비슷한 - similarity (명) 유사점, 비슷함\n④ weak (형) 약한 - weakness (명) 약점, 약함","m":0,"s":"improve - improvement","c":["resist - resistance","honest - honesty","similar - similarity","weak - weakness"],"mn":"향상시키다, 나아지다","hk":"improve(향상시키다)→improvement(향상)처럼 동사에서 명사로. resist(저항하다)→resistance(저항)가 같은 방향, 나머지는 형용사에서 명사.","ex":[["I want to [[improve my English]].","나는 [[영어 실력을 향상시키고]] 싶다.","improve (동) 향상시키다, 나아지다"],["There is [[a big improvement]] in his grades.","그의 성적에 [[큰 향상]]이 있다.","improvement (명) 개선, 향상"],["Try to [[resist the temptation]].","[[유혹을 뿌리쳐]] 봐라.","resist (동) 저항하다, 견디다"],["The army met [[strong resistance]].","군대는 [[강한 저항]]에 부딪혔다.","resistance (명) 저항"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"stationery","a":"stationery","e":"stationery 문구류, 문구\n※ supplies도 ‘용품’을 뜻하지만, ‘문구점’은 stationery shop으로 굳어진 표현이라 supplies를 쓸 수 없다.","k":"나는 펜, 공책, 봉투를 사려고 문구점에 갔다.","m":0,"s":"I went to the s______ shop to buy pens, notebooks, and envelopes.","hk":"stationery(문구류)는 stationary(정지한)와 철자가 한 글자 달라 헷갈림. 문구점은 stationery shop(문구점)으로 굳은 표현.","ex":[["I bought pens at [[the stationery store]].","나는 [[문구점]]에서 펜을 샀다."],["[[School stationery]] is on sale.","[[학용품]]이 할인 중이다."],["Pencils and erasers are [[basic stationery]].","연필과 지우개는 [[기본 문구류]]이다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"monument","a":"3","e":"③ monument: (사람들이 세우는 건물이나 조각상 / 중요한 인물이나 사건이 잊히지 않도록) 기념물, 유적","w":"① landmark: 랜드마크, 주요 지표\n② gallery: 미술관, 화랑\n④ symbol: 상징","k":"사람들이 세우는 건물이나 조각상 / 중요한 인물이나 사건이 잊히지 않도록","m":0,"s":"\"a building or statue that people put up so that an important person or event is not forgotten\"","c":["landmark","gallery","monument","symbol"],"mn":"기념물, 유적","hk":"monument(기념물)은 중요한 사람이나 사건을 잊지 않으려 세운 건물·조각상. landmark(랜드마크), symbol(상징), gallery(미술관)는 속임수.","ex":[["The city built [[a monument]] to the heroes.","도시는 영웅들을 위한 [[기념물]]을 세웠다."],["We visited [[a national monument]].","우리는 [[국가 기념물]]을 방문했다."],["[[An ancient monument]] stands on the hill.","[[고대 유적]]이 언덕 위에 서 있다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"public","a":"4","e":"④ private: 사적인, 개인의 (우리 집 근처 공원은 그 마을 모든 사람에게 속한 공공 장소이다.) / public(공적인, 공공의)의 반의어.","w":"① common: 흔한, 공통의\n② social: 사회적인\n③ official: 공식적인","k":"우리 집 근처 공원은 그 마을 모든 사람에게 속한 공공 장소이다.","m":0,"s":"The park near my house is a public space that belongs to everyone in the town.","h":"public","c":["common","social","official","private"],"mn":"공적인, 공공의","hk":"public(공공의)의 반대는 private(사적인). common(흔한), social(사회적인), official(공식적인)은 비슷해 보이는 속임수.","ex":[["[[A public library]] is free for everyone.","[[공공 도서관]]은 누구에게나 무료이다.","public (형) 공적인, 공공의"],["This is [[a private room]].","이곳은 [[개인실]]이다.","private (형) 사적인, 개인의"],["Please respect [[my private life]].","[[내 사생활]]을 존중해 주세요.","private (형) 사적인, 개인의"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"bark","a":"bark","e":"bark (명) 나무껍질 / (동) 짖다","k":"그 나무의 두꺼운 껍질은 벌레들이 속의 목질부에 닿지 못하게 막아 준다.\n그 경비견들은 밤에 문 가까이 오는 누구에게나 사납게 짖는다.","m":0,"s":"The thick b______ of the tree keeps insects from reaching the wood inside.\nThe guard dogs b______ fiercely at anyone who comes near the gate at night.","mn":"나무껍질 / 짖다","hk":"bark(나무껍질, 짖다)는 같은 철자의 두 단어. tree(나무) 얘기면 껍질, dog(개) 얘기면 짖다.","ex":[["The [[bark]] of the old oak is thick.","오래된 참나무의 [[껍질]]은 두껍다.","bark (명) 나무껍질"],["Some animals eat [[tree bark]] in winter.","어떤 동물은 겨울에 [[나무껍질]]을 먹는다.","bark (명) 나무껍질"],["The dog began to [[bark loudly]].","개가 [[크게 짖기]] 시작했다.","bark (동) 짖다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"privacy","a":"1","e":"① privacy: 사생활, 프라이버시 (소셜 미디어 사용자들은 항상 자신의 사생활에 대해 조심해야 한다.)","w":"② liberty: 자유, 해방\n③ knowledge: 지식, 아는 것\n④ unity: 통합, 단결","k":"소셜 미디어 사용자들은 항상 자신의 사생활에 대해 조심해야 한다.","m":0,"s":"Social media users should always be careful about their ________.","c":["privacy","liberty","knowledge","unity"],"mn":"사생활, 프라이버시","hk":"privacy(사생활)는 private(사적인)의 명사형. 남에게 보이고 싶지 않은 영역이고, liberty(자유), unity(단결), knowledge(지식)는 속임수.","ex":[["Everyone has [[the right to privacy]].","모든 사람은 [[사생활의 권리]]를 가진다."],["Please respect [[my privacy]].","[[내 사생활]]을 존중해 주세요."],["Cameras in rooms can [[invade privacy]].","방 안 카메라는 [[사생활을 침해할]] 수 있다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"hollow","a":"4","e":"④ hollow: 속이 빈","w":"① 평평한(flat)\n② 둥근(round)\n③ 유연한(flexible)","m":0,"s":"hollow","c":["평평한","둥근","유연한","속이 빈"],"mn":"속이 빈","hk":"hollow(속이 빈)는 안이 텅 빈 상태. flat(평평한), round(둥근), flexible(유연한)은 겉모양·성질을 말하는 속임수.","ex":[["[[A hollow tree]] was home to owls.","[[속이 빈 나무]]가 올빼미의 집이었다."],["Bamboo is [[hollow inside]].","대나무는 [[속이 비어]] 있다."],["He heard [[a hollow sound]] when he knocked.","그는 두드릴 때 [[텅 빈 소리]]를 들었다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"drag","a":"3","e":"③ pull: 끌다, 당기다 (그는 무거운 여행 가방을 바닥으로 끌어서 문까지 가야 했다.) / drag(끌다, 끌어당기다)의 유의어.","w":"① lift: 들어 올리다\n② push: 밀다\n④ press: 누르다","k":"그는 무거운 여행 가방을 바닥을 가로질러 문까지 끌고 가야 했다.","m":0,"s":"He had to drag the heavy suitcase across the floor to the door.","h":"drag","c":["lift","push","pull","press"],"mn":"끌다, 끌어당기다","hk":"drag(끌다)는 pull(끌다)과 같은 편, 무거운 것을 바닥 위로 질질 끌어당김. push(밀다)는 반대 방향, lift(들어 올리다)는 속임수.","ex":[["She [[dragged a chair]] to the window.","그녀는 창가로 [[의자를 끌고]] 갔다."],["The kids [[dragged the sled]] up the hill.","아이들은 언덕 위로 [[썰매를 끌어]] 올렸다."],["The tow truck began to [[drag the car]].","견인차가 [[차를 끌기]] 시작했다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"jealous","a":"2","e":"② jealous: (화가 나거나 언짢은 기분이 드는 / 다른 누군가가 어떤 것을 가지고 있기 때문에 / 당신이 원하는) 질투하는, 시기하는","w":"① depressed: 우울한\n③ sensitive: 세심한, 예민한\n④ relieved: 안도하는","k":"화가 나거나 언짢은 기분이 드는 / 다른 누군가가 어떤 것을 가지고 있기 때문에 / 당신이 원하는","m":0,"s":"\"feeling angry or unhappy because someone else has something that you want\"","c":["depressed","jealous","sensitive","relieved"],"mn":"질투하는, 시기하는","hk":"jealous(질투하는)는 남이 가진 것을 내가 원해서 속상한 마음. jealous of(~을 질투하는)로 자주 씀. depressed(우울한)는 다른 감정.","ex":[["She felt [[jealous of]] her friend.","그녀는 친구를 [[질투했다]]."],["He became [[jealous]] when his brother won.","형이 이기자 그는 [[질투심을 느꼈다]]."],["He gave me [[a jealous look]].","그는 나에게 [[질투 어린 눈길]]을 보냈다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"lead","a":"4","e":"④ follow: 따르다, 뒤따르다 (좋은 주장은 경기가 잘 풀리지 않을 때에도 팀을 이끌어야 한다.) / lead(이끌다, 안내하다)의 반의어.","w":"① guide: 안내하다\n② direct: 지휘하다, 감독하다\n③ command: 명령하다","k":"좋은 주장은 경기가 잘 풀리지 않을 때에도 팀을 이끌어야 한다.","m":0,"s":"A good captain must lead the team even when the game is going badly.","h":"lead","c":["guide","direct","command","follow"],"mn":"이끌다, 안내하다","hk":"lead(이끌다)의 반대는 follow(따르다). guide(안내하다), direct(지휘하다), command(명령하다)는 같은 편이라 속임수.","ex":[["Our guide will [[lead the way]].","안내원이 [[길을 안내할]] 것이다.","lead (동) 이끌다, 안내하다"],["Please [[follow me]].","[[저를 따라오세요]].","follow (동) 따르다, 뒤따르다"],["Always [[follow the rules]].","항상 [[규칙을 따라라]].","follow (동) 따르다, 뒤따르다"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"tide","a":"tide","e":"tide 조수, 밀물과 썰물","k":"우리는 해변에서 조수가 바뀌기를 기다렸다.","m":0,"s":"We waited on the beach for the t______ to change.","mn":"조수, 밀물과 썰물","hk":"tide(조수)는 바닷물이 들고 나는 현상. high tide(만조)와 low tide(간조)로 외우고, 소리가 같은 tied(묶인)와 구분.","ex":[["We walked on the beach at [[low tide]].","우리는 [[썰물 때]] 해변을 걸었다."],["[[The tide]] comes in twice a day.","[[조수]]는 하루에 두 번 들어온다."],["The boats left at [[high tide]].","배들은 [[밀물 때]] 떠났다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"order","a":"4","e":"①주문 / ②주문(품) / ③주문 / ④순서 [④번만 의미가 다름]","k":"①웨이터는 우리의 주문을 받아 적고 주방으로 서둘러 갔다.\n②내 주문품은 가게가 약속했던 것보다 이틀 늦게 도착했다.\n③그녀는 사무용 의자 200개를 대량 주문했다.\n④목록에 있는 이름들은 알파벳 순서로 나온다.","m":0,"c":["The waiter wrote down our order and hurried to the kitchen.","My order arrived two days later than the shop had promised.","She placed a large order for two hundred office chairs.","The names on the list appear in alphabetical order."],"hc":"order|order|order|order","mn":"주문 / 순서","hk":"order(주문)는 ①②③에서 주문이고, ④번 in alphabetical order(알파벳 순으로)만 순서 뜻.","ex":[["I placed [[an online order]] yesterday.","나는 어제 [[온라인 주문]]을 했다.","order (명) 주문"],["Can I take [[your order]]?","[[주문]]을 받아도 될까요?","order (명) 주문"],["Put the cards [[in order]].","카드를 [[순서대로]] 놓아라.","order (명) 순서"]]}]},{"day":5,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"democracy
