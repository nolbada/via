<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>브릭스 중학독해 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<header><p style="margin:0 0 6px"><a href="../" style="font-weight:700;color:inherit">← 클래스 활동</a></p><h1>브릭스 중학독해 1 Exit Test</h1><p class="sub">Reading별 10문항</p></header>

<script>
var P=[{"u":1,"id":"rg2-01-1","no":1,"ko":"수달 떼를 만난 산책길, 무슨 일이?","items":[{"n":1,"t":"tf","q":"Steve saw about 20 furry animals near the water while he was walking.","ko":"Steve는 걷고 있는 동안 물 근처에서 털로 덮인 약 스무 마리의 동물들을 보았다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"While he was walking, he saw about 20 furry animals near the water.","그가 걷고 있는 동안, 그는 물 근처에서 털로 덮인 약 스무 마리의 동물들을 보았다."]],"w":"3번 문장에 While he was walking, he saw about 20 furry animals near the water가 그대로 나옴. saw는 see(보다)의 과거형이고, 그 동물들이 수달(4번)이었음.","c":"T"},"h":"0cdba98f75"},{"n":2,"t":"tf","q":"Steve accidentally stepped on an otter while he was jogging.","ko":"Steve는 조깅하는 동안 실수로 수달을 밟았다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Suddenly, a jogger ran by, and he accidentally stepped on an otter.","갑자기, 조깅하는 사람 한 명이 달려 지나갔는데, 그는 수달 한 마리를 실수로 밟았다."]],"w":"6번 문장에서 수달을 실수로 밟은 사람은 지나가던 조깅하는 사람(a jogger)임. Steve는 그때 걷는 중이었고 수달 근처에 가까이 다가가 있었을 뿐. 밟은 사람이 바뀐 진술이라 F.","c":"F"},"h":"f96986ff0c"},{"n":3,"t":"tf","q":"The otters began biting Steve because they thought he was a danger.","ko":"수달들은 Steve를 위험한 존재라고 생각해서 그를 물기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The otters thought Steve was a danger too, so they ran toward him and started biting his ankles and legs.","수달들은 Steve도 위험한 존재라고 생각해서, 그를 향해 달려들었고 그의 발목과 다리를 물기 시작했다."]],"w":"8번 문장에 The otters thought Steve was a danger too, so they ran toward him and started biting…이 있음. thought는 think(생각하다)의 과거형. 위험하다고 생각한 것이 원인, 물기 시작한 것이 결과라 T.","c":"T"},"h":"107ba2e3b6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... a jogger ran by, and he accidentally stepped on an otter.)","ko":"... 조깅하는 사람이 달려 지나갔는데, 그는 수달 한 마리를 (밑줄 친 말) 밟았다.","opts":["일부러","실수로","천천히","조용히"],"word":"accidentally","r":{"a":"2) 실수로","ev":"6번 문장","s":[[6,"Suddenly, a jogger ran by, and he accidentally stepped on an otter.","갑자기, 조깅하는 사람 한 명이 달려 지나갔는데, 그는 수달 한 마리를 실수로 밟았다."]],"w":"6번에서 조깅하던 사람은 수달을 보지 못하고 밟았고, 그래서 7번에서 다른 수달들이 화가 남. accidentally는 일부러가 아니라 '실수로, 우연히'. 일부러라면 반대 뜻.","c":2},"h":"fccca90f47"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... he saw about 20 furry animals near the water.)","ko":"... 그는 물 근처에서 (밑줄 친 말) 약 스무 마리의 동물들을 보았다.","opts":["매끈한","차가운","털로 덮인","작은"],"word":"furry","r":{"a":"3) 털로 덮인","ev":"3~4번 문장","s":[[3,"While he was walking, he saw about 20 furry animals near the water.","그가 걷고 있는 동안, 그는 물 근처에서 털로 덮인 약 스무 마리의 동물들을 보았다."],[4,"They were otters!","그것들은 수달이었다!"]],"w":"3번에서 본 동물이 4번에서 otters(수달)라고 밝혀짐. 수달은 털이 있는 동물이라 furry는 '털로 덮인'. 매끈하다는 털이 없다는 느낌이라 반대 방향.","c":3},"h":"65637a330a"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSteve tried to stop them, but he couldn’t.","ko":"밑줄 친 them이 가리키는 것은?","sko":"Steve는 그것들을 막으려고 했지만, 그럴 수 없었다.","opts":["화가 난 수달들","조깅하는 사람","Steve의 발목","나무에 앉은 새들"],"r":{"a":"1) 화가 난 수달들","ev":"8~9번 문장","s":[[8,"The otters thought Steve was a danger too, so they ran toward him and started biting his ankles and legs.","수달들은 Steve도 위험한 존재라고 생각해서, 그를 향해 달려들었고 그의 발목과 다리를 물기 시작했다."],[9,"Steve tried to stop them, but he couldn’t.","Steve는 그것들을 막으려고 했지만, 그럴 수 없었다."]],"w":"8번에서 수달들이 Steve를 향해 달려들어 발목과 다리를 물기 시작했음. 9번에서 Steve가 막으려고 한 대상 them은 그 수달들. 조깅하는 사람은 6번에서 이미 지나갔음.","c":1},"h":"85bbe21990"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Steve learned a lesson that day: always be careful around wild animals, even if they look cute.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Steve는 그날 교훈을 얻었다: 야생 동물이 귀여워 보일지라도, 야생 동물 주변에서는 항상 조심하라.","opts":["귀여워 보이는 야생 동물은 위험하지 않으니 가까이 가도 된다.","야생 동물을 만나면 귀여워 보여도 무조건 사진부터 찍어야 한다.","귀여운 동물이 아니라 무섭게 생긴 야생 동물만 조심하면 된다.","야생 동물은 귀여워 보여도 위험할 수 있으니 항상 조심해야 한다."],"r":{"a":"4) 야생 동물은 귀여워 보여도 위험할 수 있으니 항상 조심해야 한다.","ev":"12번 문장","s":[[12,"Steve learned a lesson that day: always be careful around wild animals, even if they look cute.","Steve는 그날 교훈을 얻었다: 야생 동물이 귀여워 보일지라도, 야생 동물 주변에서는 항상 조심하라."]],"w":"12번은 콜론(:) 뒤가 교훈. even if they look cute는 '귀여워 보일지라도'. 귀여워도 조심하라는 뜻이라 4번. 1번과 3번은 정반대 생각이고 사진 이야기는 본문에 없음.","c":4},"h":"a6a5ae5a89"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Steve는 서울의 한 공원에서 산책을 했다.","Steve는 수달들로부터 도망치려고 나무에 올라갔다.","Steve가 다가가자 수달들은 곧바로 물속으로 도망쳤다.","Steve는 조깅하는 사람이 돌아올 때까지 나무 위에 있었다."],"opts":["Steve took a walk in a park in Seoul.","Steve climbed a tree to get away from the otters.","The otters swam away as soon as Steve got close.","Steve stayed in the tree until the jogger came back."],"r":{"a":"2) Steve climbed a tree to get away from the otters.","ev":"1번, 5번, 8번, 10~11번 문장","s":[[1,"In a park in Singapore, a man named Steve went for a morning walk.","싱가포르의 한 공원에서, Steve라는 이름의 한 남자가 아침 산책을 하러 갔다."],[5,"He stopped for a moment and got close to look at the cute animals.","그는 잠시 멈추고 그 귀여운 동물들을 보려고 가까이 다가갔다."],[8,"The otters thought Steve was a danger too, so they ran toward him and started biting his ankles and legs.","수달들은 Steve도 위험한 존재라고 생각해서, 그를 향해 달려들었고 그의 발목과 다리를 물기 시작했다."],[10,"At last, Steve climbed a tree to get away from the angry otters.","마침내, Steve는 화가 난 수달들로부터 도망치려고 나무에 올라갔다."],[11,"He stayed there until the otters calmed down and went back to the water.","그는 수달들이 진정하고 물로 돌아갈 때까지 그곳에 머물렀다."]],"w":"10번에서 Steve가 수달들로부터 도망치려고 나무에 올라갔다고 함. 공원은 서울이 아니라 싱가포르(1번). 수달들은 도망치지 않고 오히려 Steve에게 달려들었음(8번). 나무 위에 있던 것은 수달들이 진정할 때까지(11번)이고 조깅하는 사람은 나오지 않음.","c":2},"h":"d6c732aa12"},{"n":9,"t":"sum","q":"Steve climbed a tree to escape the angry otters. He learned that wild animals can be (A) even if they look cute, so we should be (B) around them.","ko":"Steve는 화가 난 수달들을 피해 나무에 올라갔다. 그는 야생 동물이 귀여워 보여도 (A)할 수 있으니 그들 주변에서는 (B)해야 한다는 것을 배웠다.","oko":["(A) 위험한 / (B) 부주의한","(A) 해롭지 않은 / (B) 조심하는","(A) 위험한 / (B) 조심하는","(A) 해롭지 않은 / (B) 부주의한","(A) 다정한 / (B) 조용한"],"opts":["(A) dangerous / (B) careless","(A) harmless / (B) careful","(A) dangerous / (B) careful","(A) harmless / (B) careless","(A) friendly / (B) quiet"],"r":{"a":"3) (A) dangerous / (B) careful","ev":"10번, 12번 문장","s":[[10,"At last, Steve climbed a tree to get away from the angry otters.","마침내, Steve는 화가 난 수달들로부터 도망치려고 나무에 올라갔다."],[12,"Steve learned a lesson that day: always be careful around wild animals, even if they look cute.","Steve는 그날 교훈을 얻었다: 야생 동물이 귀여워 보일지라도, 야생 동물 주변에서는 항상 조심하라."]],"w":"10번에서 Steve는 화난 수달들을 피해 나무에 올라갔으니 귀여운 수달도 위험했음(dangerous). 12번에서 always be careful(항상 조심하라)이라고 했으니 (B)는 careful. harmless, careless, friendly는 모두 본문과 반대.","c":3},"h":"69c002f119"},{"n":10,"t":"fill","q":"A jogger accidentally [A] on an otter, and the other otters got angry and [B].","ko":"조깅하는 사람이 수달 한 마리를 실수로 [A] 다른 수달들은 화가 나고 [B].","bko":{"stepped":"밟았다","scared":"겁먹은","jogger":"조깅하는 사람","calmed":"진정했다","water":"물","ankle":"발목"},"bank":["stepped","scared","jogger","calmed","water","ankle"],"r":{"a":"[A] stepped, [B] scared","ev":"6~7번 문장","s":[[6,"Suddenly, a jogger ran by, and he accidentally stepped on an otter.","갑자기, 조깅하는 사람 한 명이 달려 지나갔는데, 그는 수달 한 마리를 실수로 밟았다."],[7,"The other otters got angry and scared.","다른 수달들은 화가 났고 겁을 먹었다."]],"w":"6번에서 조깅하는 사람이 수달을 실수로 밟았고(stepped on = 밟았다, step(밟다)의 과거형), 7번에서 다른 수달들이 화가 나고 겁을 먹었음(angry and scared). calmed(진정했다)는 11번의 나중 일이고, jogger(조깅하는 사람)·water(물)·ankle(발목)은 이름을 나타내는 말이라 빈칸 자리에 맞지 않음.","c":null},"h":"ecdb6b6e2a"}]},{"u":1,"id":"rg2-01-2","no":2,"ko":"사람들이 순무를 던지는 이상한 축제","items":[{"n":1,"t":"tf","q":"The Jarramplas Festival takes place in Piornal, Spain, every January.","ko":"Jarramplas 축제는 매년 1월에 스페인의 Piornal에서 열린다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Every year on January 19th and 20th, the Jarramplas Festival takes place in Piornal, Spain.","매년 1월 19일과 20일에, 스페인의 Piornal에서는 Jarramplas 축제가 열린다."]],"w":"1번 문장에 매년 1월 19일과 20일에 스페인 Piornal에서 축제가 열린다(takes place)고 나옴. 같은 내용이라 T.","c":"T"},"h":"bc24a5df28"},{"n":2,"t":"tf","q":"The people in town throw turnips at the farmers during the festival.","ko":"마을 사람들은 축제 기간에 농부들에게 순무를 던진다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"During this festival, everyone in town chases and throws turnips at two monsters.","이 축제 기간 동안, 마을의 모든 사람들은 몬스터 두 마리를 쫓아다니며 순무를 던진다."]],"w":"2번 문장에서 마을 사람들이 순무를 던지는 대상은 농부가 아니라 몬스터 두 마리임. 농부가 순무를 던진 것은 옛 이야기 속(10번)이고 그 대상은 도둑. 받는 쪽이 바뀐 진술이라 F.","c":"F"},"h":"b64b346c04"},{"n":3,"t":"tf","q":"The festival is based on a local story about a thief.","ko":"그 축제는 도둑에 관한 현지의 이야기에 바탕을 두고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7~8번 문장","s":[[7,"The festival is based on a local story.","그 축제는 현지의 이야기에 바탕을 두고 있다."],[8,"The monsters act as the thief named el Jarrampla.","몬스터들은 el Jarrampla라는 이름의 도둑 역할을 한다."]],"w":"7번에서 축제가 현지 이야기에 바탕을 둔다고 하고, 8번에서 몬스터가 el Jarrampla라는 도둑 역할을 한다고 함. 그 이야기가 도둑 이야기이므로 T.","c":"T"},"h":"499f8edb46"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They wear costumes decorated with lots of colorful pieces of cloth.)","ko":"그들은 화려한 천 조각들로 (밑줄 친 말) 의상을 입는다.","opts":["찢어진","더러운","장식된","오래된"],"word":"decorated","r":{"a":"3) 장식된","ev":"5번 문장","s":[[5,"They wear costumes decorated with lots of colorful pieces of cloth.","그들은 많은 수의 화려한 천 조각들로 장식된 의상을 입는다."]],"w":"5번에서 의상에 colorful pieces of cloth(화려한 천 조각들)가 붙어 있다는 내용. decorated with는 '~으로 장식된'. 찢어지거나 더럽다는 말은 없음.","c":3},"h":"adaffa2b2c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But people in Piornal think playing el Jarrampla is a big honor.)","ko":"하지만 Piornal 사람들은 el Jarrampla 역할을 하는 것이 큰 (밑줄 친 말)이라고 생각한다.","opts":["걱정","실수","비밀","영광"],"word":"honor","r":{"a":"4) 영광","ev":"12~13번 문장","s":[[12,"But people in Piornal think playing el Jarrampla is a big honor.","하지만 Piornal 사람들은 el Jarrampla 역할을 하는 것이 큰 영광이라고 생각한다."],[13,"So, over 2,000 people are on a waiting list!","그래서, 2,000명이 넘는 사람들이 대기자 명단에 이름을 올려놓았다!"]],"w":"12번의 But 뒤는 11번의 멍(bruises)과 반대로 좋은 점을 말함. 그래서 13번처럼 2,000명이 넘게 대기자 명단에 오름. honor는 영광. 걱정이나 실수라면 사람들이 줄 서지 않을 것.","c":4},"h":"8d41159f03"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nTo chase him away, the farmers threw turnips at him.","ko":"밑줄 친 him이 가리키는 것은?","sko":"그를 쫓아내기 위해, 농부들은 그에게 순무를 던졌다.","opts":["도둑 el Jarrampla","농부 한 명","축제를 구경하는 마을 사람","도둑이 훔친 동물"],"r":{"a":"1) 도둑 el Jarrampla","ev":"8~10번 문장","s":[[8,"The monsters act as the thief named el Jarrampla.","몬스터들은 el Jarrampla라는 이름의 도둑 역할을 한다."],[9,"In the story, the thief stole animals from the farmers.","그 이야기에서, 도둑은 농부들에게서 동물을 훔쳤다."],[10,"To chase him away, the farmers threw turnips at him.","그를 쫓아내기 위해, 농부들은 그에게 순무를 던졌다."]],"w":"9번에서 농부들의 동물을 훔친 것이 도둑(the thief)이고, 8번에서 그 도둑의 이름이 el Jarrampla. 10번의 him은 농부들이 쫓아내려는 그 도둑. 농부들이 던지는 주체이므로 농부는 아님.","c":1},"h":"930099de5a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But people in Piornal think playing el Jarrampla is a big honor.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 Piornal 사람들은 el Jarrampla 역할을 하는 것이 큰 영광이라고 생각한다.","opts":["Piornal 사람들은 el Jarrampla 역할이 힘들어서 아무도 하고 싶어 하지 않는다고 생각한다.","Piornal 사람들은 el Jarrampla 역할을 맡는 것이 매우 자랑스러운 일이라고 생각한다.","Piornal 사람들은 el Jarrampla 역할을 맡으면 큰 상을 받는다고 생각한다.","Piornal 사람들은 el Jarrampla 이야기를 믿지 않는다고 생각한다."],"r":{"a":"2) Piornal 사람들은 el Jarrampla 역할을 맡는 것이 매우 자랑스러운 일이라고 생각한다.","ev":"11~13번 문장","s":[[11,"The two monsters might have a few bruises in the end.","두 몬스터는 결국 멍이 좀 들지도 모른다."],[12,"But people in Piornal think playing el Jarrampla is a big honor.","하지만 Piornal 사람들은 el Jarrampla 역할을 하는 것이 큰 영광이라고 생각한다."],[13,"So, over 2,000 people are on a waiting list!","그래서, 2,000명이 넘는 사람들이 대기자 명단에 이름을 올려놓았다!"]],"w":"12번 playing el Jarrampla is a big honor는 '역할을 하는 것이 큰 영광'. 11번에서 멍이 들 수 있다고 했어도(But) 자랑스럽게 여겨 13번처럼 2,000명이 넘게 줄을 섬. 아무도 하기 싫다는 말과 정반대이고 상을 받는다는 내용은 없음.","c":2},"h":"8a24522882"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["두 몬스터는 다른 나라에서 온 사람들이 맡는다.","몬스터들은 따뜻하게 지내려고 특별한 옷을 입는다.","이야기 속에서 농부들이 도둑에게서 동물을 훔쳤다.","2,000명이 넘는 사람들이 몬스터 역할을 하려고 대기하고 있다."],"opts":["The two monsters are played by people from other countries.","The monsters wear special clothes to stay warm.","In the story, the farmers stole animals from the thief.","More than 2,000 ":"8번 문장","s":[[8,"Then, when you look at a specific color, the program follows your eyes and plays the right sound for you!","그다음, 여러분이 특정한 색을 볼 때, 그 프로그램은 여러분의 눈을 따라가서 알맞은 소리를 연주해 준다!"]],"w":"8번에서 아무 색이나가 아니라 어떤 한 가지 색을 보면 그 색에 맞는 소리가 남. specific은 '특정한'. 화려한이나 평범한은 색의 종류가 정해졌다는 뜻이 아님.","c":3},"h":"d6693c1405"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (His friend wasn’t able to move his arms because of his injuries.)","ko":"그의 친구는 (밑줄 친 말) 때문에 팔을 움직일 수 없었다.","opts":["공연","부상","기억","소음"],"word":"injuries","r":{"a":"2) 부상","ev":"4~5번 문장","s":[[4,"In 2010, his musician friend had a bad motorcycle accident.","2010년에, 그의 음악가 친구가 심각한 오토바이 사고를 당했다."],[5,"His friend wasn’t able to move his arms because of his injuries.","그의 친구는 부상 때문에 팔을 움직일 수 없었다."]],"w":"4번에서 친구가 심각한 오토바이 사고를 당했고, 5번에서 그 때문에 팔을 움직일 수 없었음. 그러니 injuries는 사고로 생긴 '부상'. 공연이나 소음으로는 팔을 못 움직이는 이유가 되지 않음.","c":2},"h":"77dfdfa787"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIt doesn’t matter even if they can’t move their bodies well.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그들이 몸을 잘 움직이지 못하더라도 문제가 되지 않는다.","opts":["악기들","컴퓨터 과학자들","음악가 친구들","모든 사람들"],"r":{"a":"4) 모든 사람들","ev":"11~12번 문장","s":[[11,"However, this amazing software can bring the joy of music to everyone.","하지만, 이 놀라운 소프트웨어는 모든 사람에게 음악의 즐거움을 가져다줄 수 있다."],[12,"It doesn’t matter even if they can’t move their bodies well.","그들이 몸을 잘 움직이지 못하더라도 문제가 되지 않는다."]],"w":"11번에서 이 소프트웨어가 음악의 즐거움을 everyone(모든 사람)에게 줄 수 있다고 했고, 12번의 they는 그 사람들. 몸을 잘 못 움직이는 사람들도 포함해서 모두라는 뜻. 악기와 컴퓨터 과학자는 11번에 나오지 않음.","c":4},"h":"8246b44b55"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It takes time and practice to play music well.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"음악을 잘 연주하려면 시간과 연습이 필요하다.","opts":["음악을 잘 연주하려면 시간과 연습이 필요하다.","음악을 잘 연주하려면 값비싼 악기가 필요하다.","음악은 연습하지 않아도 금방 잘 연주할 수 있다.","음악 연주는 시간이 오래 걸려서 아무도 연습하지 않는다."],"r":{"a":"1) 음악을 잘 연주하려면 시간과 연습이 필요하다.","ev":"9~10번 문장","s":[[9,"EyeHarp is just like other instruments.","EyeHarp는 다른 악기들과 똑같다."],[10,"It takes time and practice to play music well.","음악을 잘 연주하려면 시간과 연습이 필요하다."]],"w":"10번 It takes time and practice to play music well은 '잘 연주하려면 시간과 연습이 든다'. 9번에서 EyeHarp도 다른 악기와 똑같다고 했으니 같은 이야기. 악기 값이나 연습이 필요 없다는 말은 없음.","c":1},"h":"3227ae89f7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Zacharias는 음악가가 아니라 컴퓨터 과학자이다.","EyeHarp는 손으로만 연주할 수 있다.","Zacharias의 친구는 2010년에 오토바이 사고를 당했다.","몸을 잘 움직이는 사람만 EyeHarp를 쓸 수 있다."],"opts":["Zacharias is not a musician but a computer scientist.","EyeHarp can be played only with the hands.","Zacharias’s friend had a motorcycle accident in 2010.","Only people who can move their bodies well can use EyeHarp."],"r":{"a":"3) Zacharias’s friend had a motorcycle accident in 2010.","ev":"3~4번, 8번, 12번 문장","s":[[3,"Zacharias is a musician and computer scientist.","Zacharias는 음악가이자 컴퓨터 과학자이다."],[4,"In 2010, his musician friend had a bad motorcycle accident.","2010년에, 그의 음악가 친구가 심각한 오토바이 사고를 당했다."],[8,"Then, when you look at a specific color, the program follows your eyes and plays the right sound for you!","그다음, 여러분이 특정한 색을 볼 때, 그 프로그램은 여러분의 눈을 따라가서 알맞은 소리를 연주해 준다!"],[12,"It doesn’t matter even if they can’t move their bodies well.","그들이 몸을 잘 움직이지 못하더라도 문제가 되지 않는다."]],"w":"4번에서 2010년에 친구가 오토바이 사고를 당했다고 함. Zacharias는 음악가이자 컴퓨터 과학자(3번), EyeHarp는 눈으로 연주(8번), 몸을 잘 못 움직여도 쓸 수 있음(12번)이라 나머지는 본문과 다름.","c":3},"h":"f7a79b86f7"},{"n":9,"t":"sum","q":"EyeHarp can bring the (A) of music to everyone, even if they can’t (B) their bodies well.","ko":"EyeHarp는 몸을 잘 (B) 수 없는 사람이라도 모든 사람에게 음악의 (A)을 가져다줄 수 있다.","oko":["(A) 즐거움 / (B) 숨길","(A) 비용 / (B) 움직일","(A) 두려움 / (B) 멈출","(A) 비용 / (B) 부술","(A) 즐거움 / (B) 움직일"],"opts":["(A) joy / (B) hide","(A) cost / (B) move","(A) fear / (B) stop","(A) cost / (B) break","(A) joy / (B) move"],"r":{"a":"5) (A) joy / (B) move","ev":"11~12번 문장","s":[[11,"However, this amazing software can bring the joy of music to everyone.","하지만, 이 놀라운 소프트웨어는 모든 사람에게 음악의 즐거움을 가져다줄 수 있다."],[12,"It doesn’t matter even if they can’t move their bodies well.","그들이 몸을 잘 움직이지 못하더라도 문제가 되지 않는다."]],"w":"11번에서 음악의 즐거움(the joy of music)을 모두에게 가져다준다고 하고, 12번에서 몸을 잘 움직이지(move) 못하더라도 문제없다고 함. 그래서 joy와 move. cost, fear, hide, stop, break는 본문에 나오지 않는 말임.","c":5},"h":"fab9819cd9"},{"n":10,"t":"fill","q":"EyeHarp shows a colorful [A] on your screen, and it [B] your eyes to play the right sound.","ko":"EyeHarp는 화면에 다채로운 [A]을 보여 주고, 알맞은 소리를 연주하려고 여러분의 눈을 [B].","bko":{"circle":"원","follows":"따라간다","hands":"손","injuries":"부상","practice":"연습","music":"음악"},"bank":["circle","follows","hands","injuries","practice","music"],"r":{"a":"[A] circle, [B] follows","ev":"7~8번 문장","s":[[7,"Here is how EyeHarp works: First, it shows a colorful circle with music scales on your computer screen.","EyeHarp의 작동법은 다음과 같다: 먼저, 그것은 여러분의 컴퓨터 화면에 음계가 있는 다채로운 원을 보여 준다."],[8,"Then, when you look at a specific color, the program follows your eyes and plays the right sound for you!","그다음, 여러분이 특정한 색을 볼 때, 그 프로그램은 여러분의 눈을 따라가서 알맞은 소리를 연주해 준다!"]],"w":"7번에서 화면에 보이는 것은 a colorful circle(다채로운 원)이고, 8번에서 프로그램이 follows your eyes(눈을 따라간다). hands(손)는 눈 대신 손으로 한다는 틀린 내용이 되고, injuries(부상)·practice(연습)·music(음악)은 빈칸 문장에 말이 되지 않음.","c":null},"h":"b687b2cbbe"}]},{"u":2,"id":"rg2-02-1","no":1,"ko":"아침 식탁의 와플이 신발을 바꿨다고?","items":[{"n":1,"t":"tf","q":"Bill Bowerman was a running coach at a college in the U.S.","ko":"Bill Bowerman은 미국의 한 대학교의 달리기 코치였다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Bill Bowerman was a running coach at a college in the U.S.","Bill Bowerman은 미국에 있는 한 대학교의 달리기 코치였다."]],"w":"1번 문장에 Bill Bowerman was a running coach at a college in the U.S.가 그대로 나옴. 같은 내용이라 T.","c":"T"},"h":"90410df253"},{"n":2,"t":"tf","q":"Phil Knight was a very fast runner.","ko":"Phil Knight는 매우 빠른 달리기 선수였다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Phil wasn’t a fast runner.","Phil은 달리기가 빠르지 않았다."]],"w":"5번 문장에서 Phil wasn’t a fast runner(빠른 선수가 아니었다)라고 함. 그래서 6번에서 신발이 그를 더 빠르게 도와줘야 했음. 반대로 말한 진술이라 F.","c":"F"},"h":"86696891f5"},{"n":3,"t":"tf","q":"Bill got the idea for a new shoe bottom from his wife’s waffle iron.","ko":"Bill은 아내의 와플 팬에서 새 신발 밑창에 대한 아이디어를 얻었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7~9번 문장","s":[[7,"One day, while Bill was having breakfast, he noticed his wife’s waffle iron.","어느 날, Bill이 아침을 먹는 중에 그는 아내의 와플 팬을 발견했다."],[8,"The iron had a special pattern.","그 팬은 특별한 무늬를 가지고 있었다."],[9,"It gave him a great idea!","그것은 그에게 좋은 아이디어를 주었다!"]],"w":"7번에서 아내의 와플 팬을 발견했고, 8번에서 그 팬의 특별한 무늬를 말하고, 9번에서 그것이 좋은 아이디어를 줬다고 함. 아이디어의 내용은 10번의 와플 모양 밑창이라 T.","c":"T"},"h":"b1e70ccf78"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... make small changes to improve them.)","ko":"... 그것을 (밑줄 친 말) 위해 작은 변화를 주다.","opts":["개선하다","부수다","빌리다","잊다"],"word":"improve","r":{"a":"1) 개선하다","ev":"2~3번 문장","s":[[2,"He always wanted to make better shoes for running.","그는 항상 달리기에 좋은 신발을 만들고 싶어 했다."],[3,"So he used to take apart shoes and make small changes to improve them.","그래서 그는 신발을 개선하기 위해 그것을 분해하거나 작은 변화를 주곤 했다."]],"w":"2번에서 Bill은 더 좋은 신발을 만들고 싶어 했고, 3번에서 신발을 분해하고 작은 변화를 줌. 목적이 improve이므로 '더 좋게 만들다 = 개선하다'. 부수는 것이 목적일 수는 없음.","c":1},"h":"eef9181455"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... he noticed his wife’s waffle iron.)","ko":"... 그는 아내의 와플 팬을 (밑줄 친 말).","opts":["잃어버렸다","알아차렸다","빌려줬다","씻었다"],"word":"noticed","r":{"a":"2) 알아차렸다","ev":"7~9번 문장","s":[[7,"One day, while Bill was having breakfast, he noticed his wife’s waffle iron.","어느 날, Bill이 아침을 먹는 중에 그는 아내의 와플 팬을 발견했다."],[8,"The iron had a special pattern.","그 팬은 특별한 무늬를 가지고 있었다."],[9,"It gave him a great idea!","그것은 그에게 좋은 아이디어를 주었다!"]],"w":"7번에서 아침을 먹다가 와플 팬이 눈에 들어왔고 8~9번에서 팬의 무늬가 좋은 아이디어를 줌. 그래서 noticed는 '알아차렸다, 눈에 띄었다'. 잃어버리거나 빌려줬다면 아이디어가 떠오르지 않았을 것.","c":2},"h":"6df760e755"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nIt gave him a great idea!","ko":"밑줄 친 him이 가리키는 것은?","sko":"그것은 그에게 좋은 아이디어를 주었다!","opts":["Phil Knight","Bill의 아내","Bill Bowerman","달리기 선수"],"r":{"a":"3) Bill Bowerman","ev":"7~9번 문장","s":[[7,"One day, while Bill was having breakfast, he noticed his wife’s waffle iron.","어느 날, Bill이 아침을 먹는 중에 그는 아내의 와플 팬을 발견했다."],[8,"The iron had a special pattern.","그 팬은 특별한 무늬를 가지고 있었다."],[9,"It gave him a great idea!","그것은 그에게 좋은 아이디어를 주었다!"]],"w":"7번에서 와플 팬을 발견한 사람이 Bill이고, 8번에서 팬의 무늬가 나오고, 9번에서 그 무늬가 him에게 아이디어를 줬음. 그 him은 팬을 본 Bill. 6번의 him과 달리 이번에는 Phil이 아님.","c":3},"h":"6a5cfb94fa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So if any shoes could help him run faster, they were considered good ones.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 어떤 신발이라도 그를 더 빨리 달리도록 도울 수 있다면, 그것은 좋은 신발로 여겨졌다.","opts":["값이 싼 신발이면 어떤 것이든 좋은 신발로 여겨졌다.","Phil은 빨리 달리지 못해서 어떤 신발도 좋은 신발이 아니었다.","Phil을 더 빨리 달리게 도와주는 신발이면 좋은 신발로 여겨졌다.","좋은 신발을 신으면 누구나 Phil처럼 빨리 달릴 수 있었다."],"r":{"a":"3) Phil을 더 빨리 달리게 도와주는 신발이면 좋은 신발로 여겨졌다.","ev":"5~6번 문장","s":[[5,"Phil wasn’t a fast runner.","Phil은 달리기가 빠르지 않았다."],[6,"So if any shoes could help him run faster, they were considered good ones.","그래서 어떤 신발이라도 그를 더 빨리 달리도록 도울 수 있다면, 그것은 좋은 신발로 여겨졌다."]],"w":"6번 if any shoes could help him run faster는 '신발이 그(Phil)를 더 빨리 달리게 도울 수 있다면'. 그러면 good ones(좋은 신발)로 여겨졌다는 뜻. 가격 이야기는 없고, 어떤 신발도 소용없다는 말도 아님.","c":3},"h":"0563c9e9aa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Bill은 신발 회사에서 일했다.","Bill은 아내의 와플 팬을 보고 와플 모양 신발을 만들었지만 처음부터 잘 되었다.","Bill은 와플 신발 이후 다른 신발 만들기를 멈췄다.","Phil Knight는 Bill이 신발 아이디어를 시험하는 것을 함께했다."],"opts":["Bill worked at a shoe company.","Bill made waffle shoes from his wife’s waffle iron, and they worked well from the start.","Bill stopped making shoes after the waffle shoes.","Phil Knight tested shoe ideas with Bill."],"r":{"a":"4) Phil Knight tested shoe ideas with Bill.","ev":"1번, 4번, 10~11번 문장","s":[[1,"Bill Bowerman was a running coach at a college in the U.S.","Bill Bowerman은 미국에 있는 한 대학교의 달리기 코치였다."],[4,"He often tested his new shoe ideas with his friend, Phil Knight.","그는 종종 자신의 친구인 Phil Knight와 함께 자신의 신발에 대한 새로운 아이디어를 실험했다."],[10,"He decided to make a shoe bottom that looked like a waffle.","그는 와플처럼 생긴 신발 밑창을 만들기로 결심했다."],[11,"At first, it didn’t work well, but he kept trying and finally succeeded.","처음에는 잘되지 않았지만, 그는 계속 시도했고 마침내 성공했다."]],"w":"4번에서 Bill이 새 신발 아이디어를 친구 Phil과 시험했다고 함. Bill은 신발 회사가 아니라 대학의 코치(1번)였고, 와플 신발은 처음에는 잘 되지 않았다가(11번) 성공했으며, 신발 만들기를 멈췄다는 말은 없음.","c":4},"h":"1dd29ef2ec"},{"n":9,"t":"sum","q":"Bill made a shoe bottom that looked (A) a waffle, and the new shoes made runners much (B).","ko":"Bill은 와플 (A) 생긴 신발 밑창을 만들었고, 새 신발은 달리기 선수들을 훨씬 더 (B)게 만들었다.","oko":["(A) ~처럼 / (B) 느리","(A) ~ 대신 / (B) 빠르","(A) ~처럼 / (B) 피곤하","(A) ~에 반대하여 / (B) 느리","(A) ~처럼 / (B) 빠르"],"opts":["(A) like / (B) slower","(A) instead of / (B) faster","(A) like / (B) tired","(A) against / (B) slower","(A) like / (B) faster"],"r":{"a":"5) (A) like / (B) faster","ev":"10번, 12번 문장","s":[[10,"He decided to make a shoe bottom that looked like a waffle.","그는 와플처럼 생긴 신발 밑창을 만들기로 결심했다."],[12,"The new waffle shoes made runners much faster.","새로운 와플 신발은 달리기 선수들을 훨씬 더 빠르게 만들었다."]],"w":"10번 a shoe bottom that looked like a waffle(와플처럼 생긴 신발 밑창)에서 (A)는 like. 12번 made runners much faster(선수들을 훨씬 더 빠르게 만들었다)에서 (B)는 faster. slower와 tired는 반대 결과이고 instead of, against는 와플 모양이라는 뜻과 맞지 않음.","c":5},"h":"d3233e556b"},{"n":10,"t":"fill","q":"At first, the waffle shoe bottom didn’t [A] well, but Bill kept trying and finally [B].","ko":"처음에는 와플 신발 밑창이 잘 [A] 않았지만, Bill은 계속 시도했고 마침내 [B].","bko":{"work":"작동하다, 잘 되다","succeeded":"성공했다","pattern":"무늬","breakfast":"아침 식사","runner":"달리기 선수","idea":"아이디어"},"bank":["work","succeeded","pattern","breakfast","runner","idea"],"r":{"a":"[A] work, [B] succeeded","ev":"11번 문장","s":[[11,"At first, it didn’t work well, but he kept trying and finally succeeded.","처음에는 잘되지 않았지만, 그는 계속 시도했고 마침내 성공했다."]],"w":"11번에서 처음에는 didn’t work well(잘 되지 않았다)이었지만 but 뒤에서 kept trying(계속 시도했다)하고 finally succeeded(마침내 성공했다). pattern(무늬)·breakfast(아침 식사)·runner(달리기 선수)·idea(아이디어)는 이름을 나타내는 말이라 ‘~하다’ 자리인 두 빈칸에 맞지 않음.","c":null},"h":"5dd56197ad"}]},{"u":2,"id":"rg2-02-2","no":2,"ko":"'친환경'이라는 말, 그대로 믿어도 될까?","items":[{"n":1,"t":"tf","q":"Greenwashing means that companies pretend to be eco-friendly to sell more products.","ko":"greenwashing은 기업들이 더 많은 제품을 팔기 위해 친환경적인 척하는 것을 뜻한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"We use this word when companies pretend to be eco-friendly to sell more products.","우리는 기업들이 더 많은 제품을 팔기 위해 친환경적인 척할 때 이 단어를 사용한다."]],"w":"3번 문장에 We use this word when companies pretend to be eco-friendly to sell more products가 있음. 같은 내용이라 T.","c":"T"},"h":"31bccf2ece"},{"n":2,"t":"tf","q":"A car company always tells the truth when it says its cars don’t pollute much.","ko":"자동차 회사가 자기 차가 오염을 많이 일으키지 않는다고 말하면 그것은 항상 사실이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"For example, a car company might say that their cars don’t pollute much, but it may not be true.","예를 들어, 한 자동차 회사는 그들의 차가 오염을 많이 일으키지 않는다고 말할지도 모르지만, 그것은 사실이 아닐지도 모른다."]],"w":"4번에서 자동차 회사가 차가 오염을 많이 일으키지 않는다고 말해도 it may not be true(사실이 아닐지도 모른다)라고 함. always(항상)와 반대라 F.","c":"F"},"h":"43153c9c31"},{"n":3,"t":"tf","q":"Looking at product labels can help you check if a product is good for the Earth.","ko":"제품 라벨을 보면 그 제품이 지구에 좋은지 확인하는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8~9번 문장","s":[[8,"Look at the labels or read the product descriptions.","라벨을 보거나 제품의 설명서를 읽어 보라."],[9,"This will help you see if a product is really good for the Earth.","이것은 제품이 정말로 지구에 좋은지 확인하는 데 도움이 될 것이다."]],"w":"8번에서 라벨을 보거나 설명서를 읽으라고 하고, 9번에서 This will help you see if a product is really good for the Earth라고 함. 라벨 보기가 확인에 도움이 되니 T.","c":"T"},"h":"e046c613dd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (We use this word when companies pretend to be eco-friendly...)","ko":"우리는 기업들이 친환경적인 (밑줄 친 말) 때 이 단어를 사용한다 ...","opts":["~인 척하다","~을 숨기다","~을 사다","~을 잊다"],"word":"pretend","r":{"a":"1) ~인 척하다","ev":"3~4번 문장","s":[[3,"We use this word when companies pretend to be eco-friendly to sell more products.","우리는 기업들이 더 많은 제품을 팔기 위해 친환경적인 척할 때 이 단어를 사용한다."],[4,"For example, a car company might say that their cars don’t pollute much, but it may not be true.","예를 들어, 한 자동차 회사는 그들의 차가 오염을 많이 일으키지 않는다고 말할지도 모르지만, 그것은 사실이 아닐지도 모른다."]],"w":"3번에서 회사들이 실제와 달리 친환경적인 모습을 보이려는 것이 greenwashing. 4번에서도 차가 오염을 안 일으킨다는 말이 사실이 아닐 수 있다고 함. 그래서 pretend to be는 '~인 척하다'.","c":1},"h":"a4da9fd1fc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You can also research the company online.)","ko":"여러분은 또한 온라인으로 그 회사를 (밑줄 친 말) 수 있다.","opts":["광고하다","조사하다","비난하다","만들다"],"word":"research","r":{"a":"2) 조사하다","ev":"7번, 10번 문장","s":[[7,"But there are ways to find out.","하지만 알아낼 방법들이 있다."],[10,"You can also research the company online.","여러분은 또한 온라인으로 그 회사를 조사해 볼 수 있다."]],"w":"7번 알아낼 방법들이 있다고 한 뒤, 8번과 10번에서 구체적인 방법을 말함. 10번의 research the company online은 회사에 대해 알아보는 것이라 '조사하다'. 광고하거나 만드는 것은 확인 방법이 아님.","c":2},"h":"6bb194a31e"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis will help you see if a product is really good for the Earth.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 제품이 정말로 지구에 좋은지 확인하는 데 도움이 될 것이다.","opts":["회사가 친환경인 척하는 것","자동차 회사가 하는 광고","온라인에서 새 제품을 사는 것","라벨을 보거나 제품 설명서를 읽는 것"],"r":{"a":"4) 라벨을 보거나 제품 설명서를 읽는 것","ev":"8~9번 문장","s":[[8,"Look at the labels or read the product descriptions.","라벨을 보거나 제품의 설명서를 읽어 보라."],[9,"This will help you see if a product is really good for the Earth.","이것은 제품이 정말로 지구에 좋은지 확인하는 데 도움이 될 것이다."]],"w":"9번 This will help you see if a product is really good for the Earth에서 This는 바로 앞 8번의 Look at the labels or read the product descriptions(라벨을 보거나 설명서를 읽는 것). 척하는 것은 도움이 되는 방법이 아니라 문제 쪽 이야기.","c":4},"h":"8f6ecfcb17"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It can be hard to tell if a company is really helping the environment or not.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어떤 회사가 정말로 환경을 돕고 있는지 아닌지 구별하기는 어려울 수 있다.","opts":["회사가 환경을 돕는지 알 수 있는 방법은 전혀 없다.","환경을 돕는 회사는 대부분 광고를 하지 않는다.","회사가 정말 환경을 돕고 있는지 아닌지 구별하기 어려울 수 있다.","환경을 돕는 일은 어려워서 회사들은 하지 않는다."],"r":{"a":"3) 회사가 정말 환경을 돕고 있는지 아닌지 구별하기 어려울 수 있다.","ev":"6~7번 문장","s":[[6,"It can be hard to tell if a company is really helping the environment or not.","어떤 회사가 정말로 환경을 돕고 있는지 아닌지 구별하기는 어려울 수 있다."],[7,"But there are ways to find out.","하지만 알아낼 방법들이 있다."]],"w":"6번 It can be hard to tell if a company is really helping the environment or not은 '정말 환경을 돕는지 구별하기 어려울 수 있다'. 바로 뒤 7번에서 But there are ways to find out이라고 하므로 방법이 전혀 없다는 1번은 틀림.","c":3},"h":"92e037740d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["greenwashing은 지구에 도움이 되는 좋은 행동을 뜻한다.","패션 회사의 옷은 항상 지구에 좋다.","회사가 친환경적인지 알려면 제품에서 라벨을 찾을 수 없다.","회사에 대해 온라인으로 조사해 볼 수 있다."],"opts":["Greenwashing means a good action that helps the Earth.","Clothes from fashion companies are always good for the Earth.","We cannot find labels on products to check if a company is eco-friendly.","We can research a company online."],"r":{"a":"4) We can research a company online.","ev":"3번, 5번, 8번, 10번 문장","s":[[3,"We use this word when companies pretend to be eco-friendly to sell more products.","우리는 기업들이 더 많은 제품을 팔기 위해 친환경적인 척할 때 이 단어를 사용한다."],[5,"Similarly, fashion companies might say their clothes are good for the Earth, but they’re not always.","마찬가지로, 패션 회사들이 그들의 옷이 지구에 좋다고 말할지도 모르지만, 항상 그렇지는 않다."],[8,"Look at the labels or read the product descriptions.","라벨을 보거나 제품의 설명서를 읽어 보라."],[10,"You can also research the company online.","여러분은 또한 온라인으로 그 회사를 조사해 볼 수 있다."]],"w":"10번에서 온라인으로 회사를 조사해 볼 수 있다고 함. greenwashing은 친환경인 척하는 것(3번), 패션 회사 옷은 항상 좋은 것은 아니고(5번), 라벨을 보라고 했으므로(8번) 나머지는 본문과 다름.","c":4},"h":"f3f3b2c27d"},{"n":9,"t":"sum","q":"Companies might say their products are (A) for the Earth, but that may not be (B).","ko":"회사들은 자기 제품이 지구에 (A) 것이라고 말할지도 모르지만, 그것은 (B) 것이 아닐지도 모른다.","oko":["(A) 나쁜 / (B) 사실인","(A) 좋은 / (B) 사실인","(A) 좋은 / (B) 웃긴","(A) 나쁜 / (B) 새로운","(A) 싼 / (B) 사실인"],"opts":["(A) bad / (B) true","(A) good / (B) true","(A) good / (B) funny","(A) bad / (B) new","(A) cheap / (B) true"],"r":{"a":"2) (A) good / (B) true","ev":"4~5번 문장","s":[[4,"For example, a car company might say that their cars don’t pollute much, but it may not be true.","예를 들어, 한 자동차 회사는 그들의 차가 오염을 많이 일으키지 않는다고 말할지도 모르지만, 그것은 사실이 아닐지도 모른다."],[5,"Similarly, fashion companies might say their clothes are good for the Earth, but they’re not always.","마찬가지로, 패션 회사들이 그들의 옷이 지구에 좋다고 말할지도 모르지만, 항상 그렇지는 않다."]],"w":"4번에서 자동차 회사가 차가 오염을 적게 일으킨다고 말해도 it may not be true라 했고, 5번에서 패션 회사가 옷이 good for the Earth라고 해도 항상 그렇지는 않다고 함. 그래서 (A)는 good, (B)는 true. 나머지 단어는 본문 뜻과 맞지 않음.","c":2},"h":"5063dde65d"},{"n":10,"t":"fill","q":"We need to be [A] shoppers and choose things that are actually [B] for the environment.","ko":"우리는 [A] 쇼핑객이 되어 환경에 실제로 [B] 것을 선택해야 한다.","bko":{"smart":"현명한","good":"좋은","pretend":"~인 척하다","pollute":"오염시키다","forget":"잊다","tell":"구별하다"},"bank":["smart","good","pretend","pollute","forget","tell"],"r":{"a":"[A] smart, [B] good","ev":"11~12번 문장","s":[[11,"Don’t forget: We need to be smart shoppers.","잊지 마라: 우리는 현명한 쇼핑객이 되어야 한다."],[12,"It’s important to choose things that are actually good for the environment.","환경에 실제로 좋은 것을 선택하는 것이 중요하다."]],"w":"11번에서 We need to be smart shoppers(현명한 쇼핑객이 되어야 한다), 12번에서 choose things that are actually good for the environment(환경에 실제로 좋은 것을 고르는 것이 중요하다). pretend(~인 척하다)·pollute(오염시키다)·forget(잊다)·tell(구별하다)은 동작을 나타내는 말이라 ‘어떤 쇼핑객’, ‘어떤 것’을 꾸미는 빈칸에 맞지 않음.","c":null},"h":"e815c8c16a"}]},{"u":2,"id":"rg2-02-3","no":3,"ko":"도로 공사에 쓰이는 뜻밖의 재료","items":[{"n":1,"t":"tf","q":"People in Wales started using recycled diapers to fix the roads.","ko":"웨일스 사람들은 도로를 고치는 데 재활용된 기저귀를 사용하기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"To help with this problem, people started using recycled diapers to fix the roads in Wales.","이 문제를 돕기 위해, 사람들은 웨일스의 도로를 보수하는 데 재활용된 기저귀를 사용하기 시작했습니다."]],"w":"5번 문장에서 people started using recycled diapers to fix the roads in Wales라고 함. 같은 내용이라 T.","c":"T"},"h":"a581ed5c6a"},{"n":2,"t":"tf","q":"The diapers are added to bitumen first, and then they are cut into small pieces.","ko":"기저귀는 먼저 역청에 더해지고, 그다음 작은 조각으로 잘린다.","r":{"a":"F (본문과 다른 내용)","ev":"8번, 10번 문장","s":[[8,"First, the diapers are cut into small pieces and washed.","먼저, 기저귀는 작은 조각들로 잘려지고 세척됩니다."],[10,"Finally, these pieces are added to a sticky material called bitumen.","마침내, 이 조각들은 역청이라고 불리는 끈적거리는 물질에 더해집니다."]],"w":"8번에서 먼저 작은 조각으로 자르고 씻고(First), 10번 Finally(마지막으로)에서 역청에 더함. 순서가 거꾸로 된 진술이라 F.","c":"F"},"h":"55116b9520"},{"n":3,"t":"tf","q":"Diapers can take 500 years to break down.","ko":"기저귀는 분해되는 데 500년이 걸릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Diapers can take 500 years to break down.","기저귀는 분해되는 데 500년이 걸릴 수 있습니다."]],"w":"4번 문장에 Diapers can take 500 years to break down이 그대로 나옴. 오래 걸리는 쓰레기여서 버려지는 수를 줄이는 것이 중요(5~6번).","c":"T"},"h":"87d1d203e1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... people started using recycled diapers to fix the roads in Wales.)","ko":"... 사람들은 웨일스의 도로를 고치는 데 (밑줄 친 말) 기저귀를 사용하기 시작했다.","opts":["재활용된","찢어진","오래된","수입된"],"word":"recycled","r":{"a":"1) 재활용된","ev":"4~6번 문장","s":[[4,"Diapers can take 500 years to break down.","기저귀는 분해되는 데 500년이 걸릴 수 있습니다."],[5,"To help with this problem, people started using recycled diapers to fix the roads in Wales.","이 문제를 돕기 위해, 사람들은 웨일스의 도로를 보수하는 데 재활용된 기저귀를 사용하기 시작했습니다."],[6,"This creative idea is reducing the number of diapers thrown away.","이 창의적인 생각은 버려지는 기저귀의 수를 줄여 주고 있습니다."]],"w":"4번에서 기저귀는 분해되는 데 500년이 걸리는 문제였고, 5번에서 그 문제를 돕기 위해 버려진 기저귀를 도로에 다시 썼음. 6번 버려지는 수를 줄인다는 결과와 이어져 recycled는 '재활용된'.","c":1},"h":"9ffd9463a4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Finally, these pieces are added to a sticky material called bitumen.)","ko":"마침내, 이 조각들은 역청이라고 불리는 (밑줄 친 말) 물질에 더해진다.","opts":["딱딱한","부드러운","차가운","끈적거리는"],"word":"sticky","r":{"a":"4) 끈적거리는","ev":"9~11번 문장","s":[[9,"Then, they go through various steps until they turn into small, soft pieces.","그다음, 그것들은 작고 부드러운 조각이 될 때까지 여러 단계를 거칩니다."],[10,"Finally, these pieces are added to a sticky material called bitumen.","마침내, 이 조각들은 역청이라고 불리는 끈적거리는 물질에 더해집니다."],[11,"This last step keeps the asphalt from falling apart.","이 마지막 단계가 아스팔트가 부서지지 못하게 막아 줍니다."]],"w":"10번의 sticky material이 11번에서 아스팔트가 부서지지 않게 붙잡아 주는 재료. 붙잡아 주려면 끈적거려야 함. 9번의 soft(부드러운)는 조각의 상태이고 sticky와는 다른 말.","c":4},"h":"49f565f436"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThen, they go through various steps until they turn into small, soft pieces.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그다음, 그것들은 작고 부드러운 조각이 될 때까지 여러 단계를 거칩니다.","opts":["도로 공사를 하는 사람들","역청","잘려서 세척된 기저귀들","웨일스의 아이들"],"r":{"a":"3) 잘려서 세척된 기저귀들","ev":"8~9번 문장","s":[[8,"First, the diapers are cut into small pieces and washed.","먼저, 기저귀는 작은 조각들로 잘려지고 세척됩니다."],[9,"Then, they go through various steps until they turn into small, soft pieces.","그다음, 그것들은 작고 부드러운 조각이 될 때까지 여러 단계를 거칩니다."]],"w":"8번에서 기저귀가 작은 조각으로 잘리고 세척됨(the diapers are cut ... and washed). 9번의 they는 그 기저귀들이 여러 단계를 거쳐 작고 부드러운 조각이 되는 것. 역청은 10번에서 처음 나옴.","c":3},"h":"200089638a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This last step keeps the asphalt from falling apart.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 마지막 단계가 아스팔트가 부서지지 못하게 막아 줍니다.","opts":["이 마지막 단계에서 아스팔트가 더 많이 만들어진다.","이 마지막 단계는 아스팔트가 부서지는 것을 막아 준다.","이 마지막 단계에서는 아스팔트가 일부러 부서지게 된다.","이 마지막 단계가 끝나야 도로 공사가 시작된다."],"r":{"a":"2) 이 마지막 단계는 아스팔트가 부서지는 것을 막아 준다.","ev":"10~11번 문장","s":[[10,"Finally, these pieces are added to a sticky material called bitumen.","마침내, 이 조각들은 역청이라고 불리는 끈적거리는 물질에 더해집니다."],[11,"This last step keeps the asphalt from falling apart.","이 마지막 단계가 아스팔트가 부서지지 못하게 막아 줍니다."]],"w":"11번 keeps the asphalt from falling apart는 'keep A from v-ing = A가 ~하지 못하게 막다'라서 아스팔트가 부서지지 않게 막아 준다는 뜻. 10번에서 끈적한 역청에 조각을 더하는 단계의 효과. 부서지게 한다는 말과는 반대.","c":2},"h":"afb00b2553"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["영국에서는 매년 약 40만 개의 기저귀가 버려진다.","기저귀는 분해되는 데 5년밖에 걸리지 않는다.","이미 많은 나라가 도로 공사에 기저귀를 사용하고 있다.","지금은 영국만이 이 아이디어를 시험하고 있다."],"opts":["About 400,000 diapers are thrown away each year in the U.K.","Diapers take only five years to break down.","Many countries are already using diapers for roads.","Only the U.K. is testing this idea for now."],"r":{"a":"4) Only the U.K. is testing this idea for now.","ev":"3~4번, 12번 문장","s":[[3,"In the U.K., about three billion diapers are thrown away each year, and this creates 400,000 tons of waste.","영국에서는, 매년 약 30억 개의 기저귀가 버려지고, 이것은 40만 톤의 쓰레기를 만들어 냅니다."],[4,"Diapers can take 500 years to break down.","기저귀는 분해되는 데 500년이 걸릴 수 있습니다."],[12,"For now, only the U.K. is testing this idea.","지금은, 영국만이 이 아이디어를 시험하고 있습니다."]],"w":"12번에서 For now, only the U.K. is testing this idea라고 함. 3번에서 버려지는 기저귀는 약 30억 개(40만은 쓰레기 톤 수), 4번에서 분해에는 500년, 12번에서 아직 영국만이라 나머지는 본문과 다름.","c":4},"h":"360edccb47"},{"n":9,"t":"sum","q":"People in Wales use (A) diapers to fix roads, and this idea is (B) the number of diapers thrown away.","ko":"웨일스 사람들은 도로를 고치는 데 (A) 기저귀를 사용하고, 이 생각은 버려지는 기저귀의 수를 (B) 있다.","oko":["(A) 새 / (B) 늘리고","(A) 재활용된 / (B) 늘리고","(A) 재활용된 / (B) 줄이고","(A) 값싼 / (B) 줄이고","(A) 씻은 / (B) 숨기고"],"opts":["(A) new / (B) increasing","(A) recycled / (B) increasing","(A) recycled / (B) reducing","(A) cheap / (B) reducing","(A) washed / (B) hiding"],"r":{"a":"3) (A) recycled / (B) reducing","ev":"5~6번 문장","s":[[5,"To help with this problem, people started using recycled diapers to fix the roads in Wales.","이 문제를 돕기 위해, 사람들은 웨일스의 도로를 보수하는 데 재활용된 기저귀를 사용하기 시작했습니다."],[6,"This creative idea is reducing the number of diapers thrown away.","이 창의적인 생각은 버려지는 기저귀의 수를 줄여 주고 있습니다."]],"w":"5번에서 recycled diapers(재활용된 기저귀)로 도로를 고친다고 하고, 6번에서 이 생각이 버려지는 기저귀의 수를 줄이고 있다(reducing)고 함. new나 increasing은 반대이고, cheap과 hiding은 본문에 없음.","c":3},"h":"abe1046fe5"},{"n":10,"t":"fill","q":"First, the diapers are cut into small pieces and [A], and finally the pieces are added to a sticky material called [B].","ko":"먼저 기저귀는 작은 조각으로 잘려 [A], 마지막으로 그 조각들은 [B]라고 불리는 끈적한 물질에 더해진다.","bko":{"washed":"세척된","bitumen":"역청","various":"여러 가지의","until":"~할 때까지","through":"~을 통해","finally":"마침내"},"bank":["washed","bitumen","various","until","through","finally"],"r":{"a":"[A] washed, [B] bitumen","ev":"8번, 10번 문장","s":[[8,"First, the diapers are cut into small pieces and washed.","먼저, 기저귀는 작은 조각들로 잘려지고 세척됩니다."],[10,"Finally, these pieces are added to a sticky material called bitumen.","마침내, 이 조각들은 역청이라고 불리는 끈적거리는 물질에 더해집니다."]],"w":"8번에서 기저귀는 작은 조각으로 잘리고 washed(세척됨), 10번에서 sticky material called bitumen(역청이라고 불리는 끈적한 물질)에 더해짐. various·until·through·finally는 설명하는 말·연결하는 말이라 이름이나 ‘~된’ 자리인 두 빈칸에 맞지 않음.","c":null},"h":"6866ad7075"}]},{"u":3,"id":"rg2-03-1","no":1,"ko":"이집트 조각상의 코는 왜 사라졌을까?","items":[{"n":1,"t":"tf","q":"Many ancient Egyptian statues in museums are missing their noses.","ko":"박물관에 있는 많은 고대 이집트 조각상은 코가 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Interestingly, many of them are missing their noses.","흥미롭게도, 그것들 중 많은 것은 코가 없다."]],"w":"2번 문장에 many of them are missing their noses가 나옴. them은 1번의 박물관에 있는 고대 이집트 조각상들. 같은 내용이라 T.","c":"T"},"h":"7b0ed85cb8"},{"n":2,"t":"tf","q":"Statues inside buildings never have broken noses.","ko":"건물 안의 조각상들은 코가 부러진 적이 전혀 없다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Even statues inside buildings have broken noses.","건물 안의 조각상들조차 코가 부러져 있다."]],"w":"5번 문장에서 Even statues inside buildings have broken noses(건물 안의 조각상들조차 코가 부러져 있다)라고 함. never(전혀 없다)와 반대라 F.","c":"F"},"h":"056d742e9b"},{"n":3,"t":"tf","q":"Ancient Egyptians believed that a person’s soul would move into a statue after death.","ko":"고대 이집트인들은 사람의 영혼이 죽음 이후 조각상 안으로 옮겨 갈 것이라고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"They believed that a person’s soul would move into a statue after death.","그들은 사람의 영혼이 죽음 이후 조각상 안으로 옮겨 갈 것이라고 믿었다."]],"w":"8번 문장에 They believed that a person’s soul would move into a statue after death가 그대로 나옴. believed는 believe(믿다)의 과거형. 같은 내용이라 T.","c":"T"},"h":"ee86965e3a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (There might be another reason for this mystery.)","ko":"이 (밑줄 친 말)에는 또 다른 이유가 있을지도 모른다.","opts":["선물","도움","수수께끼","경기"],"word":"mystery","r":{"a":"3) 수수께끼","ev":"2번, 5~6번 문장","s":[[2,"Interestingly, many of them are missing their noses.","흥미롭게도, 그것들 중 많은 것은 코가 없다."],[5,"Even statues inside buildings have broken noses.","건물 안의 조각상들조차 코가 부러져 있다."],[6,"There might be another reason for this mystery.","이 미스터리에는 또 다른 이유가 있을지도 모른다."]],"w":"2번과 5번에서 조각상의 코가 왜 없는지 알 수 없다는 문제가 나오고, 6번에서 이 mystery에 또 다른 이유가 있을지도 모른다고 함. 이유를 찾아야 하는 풀리지 않는 일이므로 mystery는 '수수께끼'.","c":3},"h":"1271fc0d3d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If someone wanted to remove the soul, they needed to destroy the statue.)","ko":"만약 누군가 영혼을 제거하기를 원했다면, 그들은 조각상을 (밑줄 친 말) 했다.","opts":["만들다","파괴하다","숨기다","그리다"],"word":"destroy","r":{"a":"2) 파괴하다","ev":"8~9번 문장","s":[[8,"They believed that a person’s soul would move into a statue after death.","그들은 사람의 영혼이 죽음 이후 조각상 안으로 옮겨 갈 것이라고 믿었다."],[9,"If someone wanted to remove the soul, they needed to destroy the statue.","만약 누군가 영혼을 제거하기를 원했다면, 그들은 조각상을 파괴해야 했다."]],"w":"8번에서 영혼이 조각상 안으로 옮겨 간다고 믿었음. 그러니 9번에서 영혼을 없애려면 조각상을 destroy해야 했다는 것은 '파괴하다'. 만들거나 그리면 영혼이 사라지지 않음.","c":2},"h":"209d0ffb4f"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey believed that a person’s soul would move into a statue after death.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 사람의 영혼이 죽음 이후 조각상 안으로 옮겨 갈 것이라고 믿었다.","opts":["파라오들","현대의 과학자들","박물관 방문객들","고대 이집트 사람들"],"r":{"a":"4) 고대 이집트 사람들","ev":"7~8번 문장","s":[[7,"In ancient Egypt, people made statues for the dead.","고대 이집트에서, 사람들은 죽은 자들을 위해 조각상을 만들었다."],[8,"They believed that a person’s soul would move into a statue after death.","그들은 사람의 영혼이 죽음 이후 조각상 안으로 옮겨 갈 것이라고 믿었다."]],"w":"7번에서 In ancient Egypt, people made statues for the dead라고 했으므로 8번 They는 그 고대 이집트 사람들. 영혼이 조각상으로 옮겨 간다고 믿은 것은 당시 이집트인들의 생각이지 현대의 과학자나 방문객이 아님.","c":4},"h":"03e956e4c2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If someone wanted to remove the soul, they needed to destroy the statue.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 누군가 영혼을 제거하기를 원했다면, 그들은 조각상을 파괴해야 했다.","opts":["누군가 조각상을 만들고 싶다면 영혼을 먼저 제거해야 했다.","영혼을 없애고 싶은 사람은 조각상을 파괴해야 했다.","조각상을 파괴하면 영혼이 더 강해진다고 믿었다.","영혼을 제거하려면 파라오의 허락이 필요했다."],"r":{"a":"2) 영혼을 없애고 싶은 사람은 조각상을 파괴해야 했다.","ev":"8~9번 문장","s":[[8,"They believed that a person’s soul would move into a statue after death.","그들은 사람의 영혼이 죽음 이후 조각상 안으로 옮겨 갈 것이라고 믿었다."],[9,"If someone wanted to remove the soul, they needed to destroy the statue.","만약 누군가 영혼을 제거하기를 원했다면, 그들은 조각상을 파괴해야 했다."]],"w":"8번에서 영혼은 조각상 안으로 옮겨 간다고 믿었으므로, 9번은 '영혼을 없애려면(If) 조각상을 파괴해야 했다'. 선지 1은 순서가 거꾸로이고, 영혼이 강해진다거나 파라오의 허락이 필요하다는 말은 없음.","c":2},"h":"9af7d2436a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["박물관에 있는 고대 이집트 조각상들은 모두 코가 온전하다.","이집트인들은 조각상을 죽은 사람이 아니라 살아 있는 사람을 위해 만들었다.","이집트인들은 코가 생명의 원천이라고 믿었다.","코가 부러진 조각상은 건물 밖에서만 발견된다."],"opts":["All ancient Egyptian statues in museums still have their noses.","Egyptians made statues for the living, not for the dead.","Egyptians believed the nose was the source of life.","Broken noses are found only on statues outside buildings."],"r":{"a":"3) Egyptians believed the nose was the source of life.","ev":"2번, 5번, 7번, 11번 문장","s":[[2,"Interestingly, many of them are missing their noses.","흥미롭게도, 그것들 중 많은 것은 코가 없다."],[5,"Even statues inside buildings have broken noses.","건물 안의 조각상들조차 코가 부러져 있다."],[7,"In ancient Egypt, people made statues for the dead.","고대 이집트에서, 사람들은 죽은 자들을 위해 조각상을 만들었다."],[11,"Egyptians believed the nose was the source of life.","이집트인들은 코가 생명의 원천이라고 믿었다."]],"w":"11번에서 Egyptians believed the nose was the source of life(코가 생명의 원천이라고 믿었다)라고 함. 많은 조각상이 코가 없고(2번), 건물 안 조각상도 코가 부러져 있고(5번), 조각상은 살아 있는 사람이 아니라 죽은 사람을 위해 만들었으므로(7번) 나머지는 본문과 다름.","c":3},"h":"8a2d308da8"},{"n":9,"t":"sum","q":"People who wanted to steal treasure from pharaoh’s tombs broke the statue’s (A) to destroy the (B) forever.","ko":"파라오의 무덤에서 보물을 훔치고 싶은 사람들은 영원히 (B)을(를) 파괴하기 위해 조각상의 (A)을(를) 부러뜨렸다.","oko":["(A) 팔 / (B) 영혼","(A) 코 / (B) 보물","(A) 머리 / (B) 무덤","(A) 코 / (B) 영혼","(A) 눈 / (B) 파라오"],"opts":["(A) arm / (B) soul","(A) nose / (B) treasure","(A) head / (B) tomb","(A) nose / (B) soul","(A) eye / (B) pharaoh"],"r":{"a":"4) (A) nose / (B) soul","ev":"12~13번 문장","s":[[12,"So, when people wanted to steal treasure from pharaoh’s tombs, they always did one thing first.","그래서, 사람들이 파라오의 무덤에서 보물을 훔치고 싶을 때, 그들은 항상 제일 먼저 한 가지를 했다."],[13,"They broke the statue’s nose to destroy the soul forever!","그들은 영혼을 영원히 파괴하기 위해 조각상의 코를 부러뜨렸다!"]],"w":"13번에서 They broke the statue’s nose to destroy the soul forever. 그래서 (A)는 nose(코), (B)는 soul(영혼). 11번에서 코가 생명의 원천이라 믿었기 때문. arm, head, eye는 부러뜨린 곳이 아니고, treasure·tomb·pharaoh는 파괴하려는 대상이 아님.","c":4},"h":"75b89d7aa7"},{"n":10,"t":"fill","q":"Some people thought that the broken noses were just because of [A], but this doesn’t [B] everything.","ko":"몇몇 사람들은 부러진 코가 단지 [A] 때문이라고 생각했지만, 이것은 모든 것을 [B] 못한다.","bko":{"corrosion":"침식, 부식","explain":"설명하다","believed":"믿었다","ancient":"고대의","inside":"~ 안의","forever":"영원히"},"bank":["corrosion","explain","believed","ancient","inside","forever"],"r":{"a":"[A] corrosion, [B] explain","ev":"3~4번 문장","s":[[3,"Some people thought that the broken noses were just because of corrosion.","몇몇 사람들은 그 부러진 코가 단지 침식 작용 때문이라고 생각했다."],[4,"However, this doesn’t explain everything.","하지만, 이것은 모든 것을 설명하지는 못한다."]],"w":"3번에서 몇몇 사람들은 코가 부러진 것이 단지 because of corrosion(침식 때문)이라고 생각했고, 4번에서 this doesn’t explain everything(이것은 모든 것을 설명하지는 못한다)이라고 반박함. believed(믿었다)·ancient(고대의)·inside(~ 안의)·forever(영원히)는 이 빈칸 자리에 말이 되지 않음.","c":null},"h":"546453f858"}]},{"u":3,"id":"rg2-03-2","no":2,"ko":"지루할 줄 알았던 여행길에서 생긴 일","items":[{"n":1,"t":"tf","q":"Sophia thought the trip to South Dakota would be boring.","ko":"Sophia는 사우스다코타로의 여행이 지루할 것이라고 생각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Sophia thought this trip would be boring because people say South Dakota is one of the most boring states in America.","Sophia는 사람들이 사우스다코타가 미국에서 가장 지루한 주 중 하나라고 말하기 때문에 이 여행이 지루할 것이라고 생각했다."]],"w":"2번 문장에 Sophia thought this trip would be boring because…이 나옴. thought는 think(생각하다)의 과거형. 사우스다코타가 가장 지루한 주 중 하나라고들 해서 그렇게 생각했음. 같은 내용이라 T.","c":"T"},"h":"c031f015de"},{"n":2,"t":"tf","q":"Sophia showed Tony pictures of her own trip to Florida.","ko":"Sophia는 Tony에게 자신의 플로리다 여행 사진들을 보여 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"She showed him pictures of her friend Ally’s exciting trip to Florida.","그녀는 그에게 자신의 친구 Ally의 플로리다로의 흥미로운 여행 사진들을 보여 주었다."]],"w":"5번 문장에서 Sophia가 보여 준 것은 자신의 여행이 아니라 친구 Ally의 플로리다 여행 사진들(her friend Ally’s exciting trip to Florida). 누구의 여행인지 바꾼 진술이라 F.","c":"F"},"h":"59f7185d96"},{"n":3,"t":"tf","q":"Sophia and Tony saw a large group of bison while they waited.","ko":"Sophia와 Tony는 기다리는 동안 큰 들소 무리를 보았다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"As they waited, they saw a large group of bison passing by.","그들은 기다리는 동안, 큰 들소 무리가 지나가는 것을 보았다."]],"w":"9번 문장에 As they waited, they saw a large group of bison passing by가 나옴. saw는 see(보다)의 과거형. As they waited는 '기다리는 동안'이라 같은 내용이라 T.","c":"T"},"h":"7e33199201"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Sophia thought this trip would be boring ...)","ko":"Sophia는 이 여행이 (밑줄 친 말) 것이라고 생각했다 ...","opts":["지루한","신나는","무서운","빠른"],"word":"boring","r":{"a":"1) 지루한","ev":"2~3번 문장","s":[[2,"Sophia thought this trip would be boring because people say South Dakota is one of the most boring states in America.","Sophia는 사람들이 사우스다코타가 미국에서 가장 지루한 주 중 하나라고 말하기 때문에 이 여행이 지루할 것이라고 생각했다."],[3,"On the way, she spent most of the time on her phone.","가는 도중에, 그녀는 대부분의 시간을 자신의 휴대전화를 하며 보냈다."]],"w":"2번에서 사우스다코타는 가장 지루한 주 중 하나라고들 해서 Sophia는 여행이 boring할 것이라 생각했고, 3번에서 대부분의 시간을 휴대전화로 보냄. 신나는 여행을 기대했다면 휴대전화만 보지 않았을 것이라 boring은 '지루한'.","c":1},"h":"3134010ce4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Sophia was surprised and said, “Wow! I didn’t expect to see that!”)","ko":"Sophia는 (밑줄 친 말) 말했다. “와! 나는 저런 걸 볼 거라고 예상하지 못했어!”","opts":["지루한","화난","놀란","슬픈"],"word":"surprised","r":{"a":"3) 놀란","ev":"9~10번 문장","s":[[9,"As they waited, they saw a large group of bison passing by.","그들은 기다리는 동안, 큰 들소 무리가 지나가는 것을 보았다."],[10,"Sophia was surprised and said, “Wow! I didn’t expect to see that!”","Sophia는 놀라서 말했다. “와! 나는 저런 걸 볼 거라고 예상하지 못했어!”"]],"w":"9번에서 갑자기 들소 무리가 지나가는 것을 보고, 10번에서 Wow!와 I didn’t expect to see that(저런 걸 볼 거라고 예상하지 못했다)이라고 말함. 예상하지 못한 광경을 본 감정이므로 surprised는 '놀란'.","c":3},"h":"7b1cd5528e"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nShe showed him pictures of her friend Ally’s exciting trip to Florida.","ko":"밑줄 친 him이 가리키는 것은?","sko":"그녀는 그에게 자신의 친구 Ally의 플로리다로의 흥미로운 여행 사진들을 보여 주었다.","opts":["아빠","Tony","Ally","Sophia"],"r":{"a":"2) Tony","ev":"4~5번 문장","s":[[4,"Her brother, Tony, saw this and asked, “What’s so interesting on your phone?”","그녀의 오빠 Tony가 이 모습을 보고 “네 휴대전화에는 뭐가 그렇게 재미있는 게 있어?”라고 물었다."],[5,"She showed him pictures of her friend Ally’s exciting trip to Florida.","그녀는 그에게 자신의 친구 Ally의 플로리다로의 흥미로운 여행 사진들을 보여 주었다."]],"w":"4번에서 Sophia의 오빠 Tony가 휴대전화에 뭐가 재미있냐고 물었고, 5번에서 Sophia(She)가 그에게 사진을 보여 줌. 그러므로 him은 질문한 Tony. Ally는 사진 속 여행의 주인공(친구)이고 Sophia는 She로 따로 나옴.","c":2},"h":"f862057443"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Sophia was surprised and said, “Wow! I didn’t expect to see that!”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Sophia는 놀라서 말했다. “와! 나는 저런 걸 볼 거라고 예상하지 못했어!”","opts":["Sophia는 들소 떼가 올 것을 미리 알고 있었다.","Sophia는 들소 떼가 무서워서 소리를 질렀다.","Sophia는 사진을 찍기 싫어서 놀랐다.","Sophia는 들소 떼를 볼 거라고 예상하지 못해서 놀랐다."],"r":{"a":"4) Sophia는 들소 떼를 볼 거라고 예상하지 못해서 놀랐다.","ev":"9~11번 문장","s":[[9,"As they waited, they saw a large group of bison passing by.","그들은 ,"리듬을 유지하도록 돕는 유전자는 몇 개뿐이다.","리듬 감각은 춤추는 데에만 중요하다."],"opts":["Our dancing skills have nothing to do with our genes.","A team of scientists recently discovered special genes.","Only a few genes help us keep rhythm.","A sense of rhythm is important only for dancing."],"r":{"a":"2) A team of scientists recently discovered special genes.","ev":"3~4번, 6~7번, 10번 문장","s":[[3,"A team of scientists found a reason for this.","과학자로 이루어진 한 팀이 이것에 대한 이유를 찾아냈다."],[4,"They recently discovered special genes.","그들은 최근에 특별한 유전자들을 발견했다."],[6,"This means our dancing skills actually come from our genes!","이는 우리의 춤추는 솜씨가 사실은 우리의 유전자에서 나온다는 것을 의미한다!"],[7,"In fact, there are hundreds of genes that help us keep rhythm.","사실, 우리에게는 리듬을 유지하도록 도와주는 수백 개의 유전자가 있다."],[10,"However, our sense of rhythm isn’t only important for dancing.","하지만, 우리의 리듬 감각은 춤추는 데에만 중요한 것이 아니다."]],"w":"3~4번에서 과학자 팀이 최근에 특별한 유전자들을 발견했다고 함. 춤 솜씨는 유전자에서 나오고(6번), 리듬을 돕는 유전자는 수백 개이고(7번), 리듬 감각은 춤에만 중요한 것이 아니라서(10번) 나머지는 본문과 다름.","c":2},"h":"c7a9f4acae"},{"n":9,"t":"sum","q":"Our sense of rhythm is important not only for (A) but also linked to everyday activities like (B).","ko":"우리의 리듬 감각은 (A)에만 중요한 것이 아니라 (B) 같은 일상적인 활동과도 연관되어 있다.","oko":["(A) 노래 부르기 / (B) 잠자기","(A) 먹기 / (B) 걷기","(A) 춤추기 / (B) 잠자기","(A) 노래 부르기 / (B) 걷기","(A) 춤추기 / (B) 걷기"],"opts":["(A) singing / (B) sleeping","(A) eating / (B) walking","(A) dancing / (B) sleeping","(A) singing / (B) walking","(A) dancing / (B) walking"],"r":{"a":"5) (A) dancing / (B) walking","ev":"10~11번 문장","s":[[10,"However, our sense of rhythm isn’t only important for dancing.","하지만, 우리의 리듬 감각은 춤추는 데에만 중요한 것이 아니다."],[11,"It’s also linked to everyday activities — like walking and breathing.","그것은 또한 걷기와 숨 쉬기 같은 일상적인 활동과도 연관되어 있다."]],"w":"10번에서 리듬 감각이 dancing(춤추기)에만 중요한 것이 아니라고 하고, 11번에서 walking and breathing(걷기와 숨 쉬기) 같은 일상 활동과 연관된다고 함. 그래서 (A) dancing, (B) walking. singing, eating, sleeping은 본문에 나오지 않음.","c":5},"h":"810bd230c3"},{"n":10,"t":"fill","q":"These genes help us dance and [A] along with music, and there are hundreds of [B] that help us keep rhythm.","ko":"이 유전자들은 우리가 음악에 맞춰 춤추고 박수를 [A] 도와주며, 리듬을 유지하게 돕는 수백 개의 [B]가 있다.","bko":{"clap":"박수를 치다","genes":"유전자","musical":"음악적인","natural":"타고난","everyday":"일상적인","linked":"연관된"},"bank":["clap","genes","musical","natural","everyday","linked"],"r":{"a":"[A] clap, [B] genes","ev":"5번, 7번 문장","s":[[5,"These genes help us dance and clap along with music.","이 유전자들은 우리가 음악에 맞춰 춤추고 박수를 치는 데 도움을 준다."],[7,"In fact, there are hundreds of genes that help us keep rhythm.","사실, 우리에게는 리듬을 유지하도록 도와주는 수백 개의 유전자가 있다."]],"w":"5번에서 이 유전자들이 춤추고 박수 치는 것(dance and clap along with music)을 도와준다고 하고, 7번에서 리듬을 유지하게 돕는 hundreds of genes(수백 개의 유전자)가 있다고 함. musical(음악적인)·natural(타고난)·everyday(일상적인)·linked(연관된)는 ‘~하고 박수를 [동사]’, ‘수백 개의 [명사]’ 자리에 맞지 않는 말임.","c":null},"h":"37c8188599"}]},{"u":4,"id":"rg2-04-1","no":1,"ko":"눈이 안 보여도 매일 도움받는 비결은?","items":[{"n":1,"t":"tf","q":"Brian Fischler has been blind since he was born.","ko":"Brian Fischler는 태어날 때부터 앞을 못 봤다.","r":{"a":"F (본문과 다른 내용)","ev":"1~2번 문장","s":[[1,"Brian Fischler is blind.","Brian Fischler는 시각장애인이다."],[2,"He lost most of his sight when he was 13.","그는 13살 때 시력의 대부분을 잃었다."]],"w":"2번에서 Brian은 13살 때 시력의 대부분을 잃었다고 함. 태어날 때부터가 아니라 13살 때부터임.","c":"F"},"h":"106af7831c"},{"n":2,"t":"tf","q":"Brian can only tell if it’s light or dark outside now.","ko":"Brian은 지금 밖이 밝은지 어두운지만 알 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Now, he can only tell if it’s light or dark outside.","이제, 그는 오직 밖이 밝은지 어두운지만 알 수 있다."]],"w":"3번 문장 그대로. 지금은 밝은지 어두운지만 구별할 수 있다고 함.","c":"T"},"h":"a374fe66b8"},{"n":3,"t":"tf","q":"Be My Eyes does not need volunteers anymore because AI is being added.","ko":"AI가 추가되기 때문에 Be My Eyes는 더 이상 자원봉사자가 필요 없다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"It’s adding a new function, artificial intelligence (AI).","그것은 새로운 기능인 인공 지능(AI)을 추가하고 있다."],[11,"AI can do some things better than humans, but the volunteers are still important.","인공 지능은 인간보다 어떤
