ording = 녹음(된 것)이에요.","c":1},"h":"b3a375b954"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nBut that’s how your voice sounds to other people.","ko":"밑줄 친 \"that\"이(가) 가리키는 것은?","sko":"그러나 그것이 당신의 목소리가 다른 사람들에게 들리는 방식이다.","opts":["당신이 처음 들은 그 소리가 어떠했는지","당신이 놀란 이유","다른 사람들이 말하는 내용","당신이 기억하는 첫 번째 시간"],"r":{"a":"1) 당신이 처음 들은 그 소리가 어떠했는지","ev":"2~3번 문장","s":[[2,"You were probably surprised by how it sounded.","당신은 아마 그것이 들리는 방식에 놀랐을 것이다."],[3,"But that’s how your voice sounds to other people.","그러나 그것이 당신의 목소리가 다른 사람들에게 들리는 방식이다."]],"w":"3번의 that은 바로 앞 2번 문장의 how it sounded(그것이 들린 방식)를 가리켜요. 처음 들은 그 소리가 바로 다른 사람들에게 들리는 당신의 목소리라는 뜻이에요.","c":1,"k":"that = 당신이 처음 들은 그 소리가 어떠했는지"},"pron":"that","h":"f216a5ae0d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"On the other hand, when you hear a recording of your voice, the sound waves are traveling only through the air.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"반면에, 당신이 자신의 목소리가 녹음된 것을 들을 때는 그 음파가 오직 공기 중으로만 이동하고 있다.","opts":["반면에, 담아 둔 목소리를 들을 때는 음파가 오직 머리뼈를 통해서만 이동한다.","반면에, 담아 둔 목소리를 들을 때는 음파가 공기와 머리뼈 둘 다를 통해 이동한다.","반면에, 담아 둔 목소리를 들을 때는 음파가 이동하지 않는다.","반면에, 담아 둔 목소리를 들을 때는 음파가 오직 공기를 통해서만 이동한다."],"r":{"a":"4) 반면에, 담아 둔 목소리를 들을 때는 음파가 오직 공기를 통해서만 이동한다.","ev":"9번 문장","s":[[9,"On the other hand, when you hear a recording of your voice, the sound waves are traveling only through the air.","반면에, 당신이 자신의 목소리가 녹음된 것을 들을 때는 그 음파가 오직 공기 중으로만 이동하고 있다."]],"w":"only through the air는 오직 공기를 통해서만이라는 뜻이에요. 머리뼈는 내가 직접 말할 때만 해당돼요(7번).","c":4},"h":"a12aea2cda"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["음파는 어떤 것을 통해서도 이동할 수 없다.","소리는 파동으로 이동한다.","소리는 오직 직선으로만 움직인다.","음파는 오직 음악에 의해서만 만들어진다."],"opts":["Sound waves cannot move through anything.","Sound travels in waves.","Sound moves only in a straight line.","Sound waves are made only by music."],"r":{"a":"2) Sound travels in waves. (소리는 파동으로 이동한다.)","ev":"4번 문장","s":[[4,"The reason is that sound travels in waves.","그 이유는 소리가 파동을 통해 이동하기 때문이다."]],"w":"4번에서 소리는 파동(waves)으로 이동한다고 해요. 나머지는 본문에 없거나 본문과 반대되는 내용이에요.","c":2},"h":"5c1d3c5c00"},{"n":9,"t":"sum","q":"When another person (A), the sound waves travel through the (B).","ko":"다른 사람이 (A) 때, 음파는 (B)을(를) 통해 이동한다.","oko":["(A) 말할 / (B) 공기","(A) 말할 / (B) 뼈","(A) 잘 / (B) 공기","(A) 잘 / (B) 물","(A) 달릴 / (B) 뼈"],"opts":["(A) speaks / (B) air","(A) speaks / (B) bones","(A) sleeps / (B) air","(A) sleeps / (B) water","(A) runs / (B) bones"],"r":{"a":"1) (A) speaks / (B) air ((A) 말할 / (B) 공기)","ev":"5번 문장","s":[[5,"When another person speaks, the sound waves travel through the air.","다른 사람이 말을 할 때, 그 음파는 공기를 통해서 이동한다."]],"w":"5번에서 다른 사람이 말할 때(speaks) 음파는 공기(air)를 통해서 이동한다고 해요.","c":1},"h":"cda9bf7b49"},{"n":10,"t":"fill","q":"You were probably [A] by how it [B].","ko":"당신은 아마 그것이 [B] 방식에 [A].","bank":["surprised","sounded","bones","waves","ears","travel"],"bko":{"surprised":"놀랐다","sounded":"들렸다(sound의 과거)","bones":"뼈","waves":"파동","ears":"귀","travel":"이동하다"},"r":{"a":"[A] surprised (놀랐다), [B] sounded (들렸다(sound의 과거))","ev":"2번 문장","s":[[2,"You were probably surprised by how it sounded.","당신은 아마 그것이 들리는 방식에 놀랐을 것이다."]],"w":"2번 문장에서 당신은 그것이 들린(sounded) 방식에 아마 놀랐을(surprised) 것이라고 해요. 나머지 단어는 were probably 뒤나 how it 뒤에 들어가면 말이 안 돼요.","c":null},"h":"46dd245e7c"}]},{"u":6,"id":"rj2-06-3","no":3,"ko":"키가 줄어들고 있다고?","items":[{"n":1,"t":"tf","q":"You are actually taller in the morning than you are in the evening.","ko":"당신은 실제로 저녁보다 아침에 키가 더 크다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It may sound strange, but you’re actually taller in the morning than you are in the evening.","이상하게 들릴 수도 있지만, 당신은 실제로 저녁보다 아침에 키가 더 크다."]],"w":"3번 문장에 you’re actually taller in the morning than you are in the evening이라고 나와요.","c":"T"},"h":"9edcad5819"},{"n":2,"t":"tf","q":"Your spine contains 33 large bones that are not connected to each other.","ko":"당신의 척추에는 서로 연결되지 않은 33개의 큰 뼈가 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"This is because your spine contains 33 small bones that are connected by discs.","이것은 당신의 척추에 디스크들로 연결된 33개의 작은 뼈가 있기 때문이다."]],"w":"4번 문장에서 척추에는 디스크들로 연결된(connected) 33개의 작은(small) 뼈가 있다고 해요. 크고 연결되지 않았다는 말은 반대예요.","c":"F"},"h":"ee522eab29"},{"n":3,"t":"tf","q":"The discs get thinner while you sleep, so you lose more height.","ko":"당신이 자는 동안 디스크들은 더 얇아지고, 그래서 당신은 키를 더 잃는다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The discs get thicker, and you gain back your lost height.","디스크들은 더 두꺼워지고, 당신은 잃어버렸던 키를 되찾는다."]],"w":"11번 문장에서 자는 동안 디스크들은 더 두꺼워지고(thicker) 잃은 키를 되찾는다고 해요. 더 얇아지고 키를 더 잃는다는 말은 반대예요.","c":"F"},"h":"d35f3f74e4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They squeeze the discs and make them flatter.)","ko":"그것들은 디스크들을 ( ) 더 납작하게 만든다.","opts":["늘린다","짓누른다","자른다","씻는다"],"word":"squeeze","r":{"a":"2) 짓누른다","ev":"8번 문장","s":[[8,"They squeeze the discs and make them flatter.","그것들은 디스크들을 짓눌러 더 납작하게 만든다."]],"w":"뼈들이 디스크를 눌러서 디스크가 더 납작해지는 장면이에요. squeeze = 짓누르다예요.","c":2},"h":"8cc5fc06ca"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (During the day, gravity pulls the bones of your spine downward.)","ko":"낮 동안에는 ( )이 당신의 척추의 뼈들을 아래로 잡아당긴다.","opts":["빛","바람","중력","소리"],"word":"gravity","r":{"a":"3) 중력","ev":"7번 문장","s":[[7,"During the day, gravity pulls the bones of your spine downward.","낮 동안에는 중력이 당신의 척추의 뼈들을 아래로 잡아당긴다."]],"w":"뼈를 아래로 잡아당기는 힘이에요. 지구가 물체를 끌어당기는 이 힘이 gravity = 중력이에요.","c":3},"h":"b7dd078ebd"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey allow your spine to easily move in many directions.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 당신의 척추가 여러 방향으로 쉽게 움직이게 해 준다.","opts":["디스크들","척추의 뼈들","여러 방향들","액체들"],"r":{"a":"1) 디스크들","ev":"5~6번 문장","s":[[5,"These discs are soft and contain liquid.","이러한 디스크들은 무르고 액체를 함유하고 있다."],[6,"They allow your spine to easily move in many directions.","그것들은 당신의 척추가 여러 방향으로 쉽게 움직이게 해 준다."]],"w":"6번의 They는 바로 앞 5번 문장의 These discs(이러한 디스크들)를 가리켜요. 디스크 덕분에 척추가 여러 방향으로 쉽게 움직여요.","c":1,"k":"They = 디스크들"},"pron":"They","h":"07787d73bb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, you become up to one centimeter shorter.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로 당신은 (최고) 1센티미터까지 더 작아지게 된다.","opts":["그 결과, 당신은 최대 1센티미터까지 더 작아진다.","그 결과, 당신은 최소 1센티미터 더 커진다.","그 결과, 당신은 정확히 1센티미터 더 작아진다.","그 결과, 당신은 1미터까지 더 작아진다."],"r":{"a":"1) 그 결과, 당신은 최대 1센티미터까지 더 작아진다.","ev":"9번 문장","s":[[9,"As a result, you become up to one centimeter shorter.","결과적으로 당신은 (최고) 1센티미터까지 더 작아지게 된다."]],"w":"as a result는 '그 결과'이고 up to one centimeter는 '최대 1센티미터까지'예요. shorter는 '더 작은(키가 줄어든)'이라는 뜻이에요.","c":1},"h":"e917a67ed2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["누우면 뼈들이 디스크들을 더 세게 잡아당긴다.","자려고 누우면 뼈들이 디스크들에 가하던 압력이 멈춘다.","자려고 누우면 디스크들이 사라진다.","누우면 뼈가 약해진다."],"opts":["Your bones pull harder on the discs when you lie down.","When you lie down to sleep, your bones stop putting pressure on the discs.","The discs disappear when you lie down to sleep.","Your bones become weak when you lie down."],"r":{"a":"2) When you lie down to sleep, your bones stop putting pressure on the discs. (자려고 누우면 뼈들이 디스크들에 가하던 압력이 멈춘다.)","ev":"10번 문장","s":[[10,"When you lie down to sleep, however, gravity no longer causes the bones to squeeze the discs.","그러나 당신이 자려고 누울 때, 중력은 더 이상 뼈들이 디스크들을 짓누르게 만들지 않는다."]],"w":"10번에서 자려고 누우면 더 이상 뼈들이 디스크들을 짓누르지 않는다고 해요. 즉 뼈들이 디스크들에 가하던 압력이 멈춘다는 뜻이에요. 나머지는 본문과 반대되거나 본문에 없는 내용이에요.","c":2},"h":"e18584c6a3"},{"n":9,"t":"sum","q":"Surprisingly, your (A) depends on what (B) of day you measure yourself.","ko":"놀랍게도, 당신의 (A)은(는) 하루 중 어느 (B)에 자신을 측정하는지에 따라 다르다.","oko":["(A) 대답 / (B) 시간","(A) 대답 / (B) 색깔","(A) 이름 / (B) 시간","(A) 이름 / (B) 색깔","(A) 모양 / (B) 시간"],"opts":["(A) answer / (B) time","(A) answer / (B) color","(A) name / (B) time","(A) name / (B) color","(A) shape / (B) time"],"r":{"a":"1) (A) answer / (B) time ((A) 대답 / (B) 시간)","ev":"1~2번 문장","s":[[1,"How tall are you?","당신은 키가 얼마나 큰가?"],[2,"Surprisingly, your answer depends on what time of day you measure yourself.","놀랍게도, 당신의 대답은 하루 중 몇 시에 자신을 측정하는지에 따라 다르다."]],"w":"1~2번에서 '키가 얼마나 크냐'는 질문에 대한 대답(answer)이 하루 중 몇 시(time)에 재는지에 따라 달라진다고 해요.","c":1},"h":"47f21714e4"},{"n":10,"t":"fill","q":"These discs are [A] and contain [B].","ko":"이러한 디스크들은 [A] 상태이며 [B]을(를) 함유하고 있다.","bank":["soft","liquid","easily","move","during","downward"],"bko":{"soft":"무른","liquid":"액체","easily":"쉽게","move":"움직이다","during":"~ 동안","downward":"아래로"},"r":{"a":"[A] soft (무른), [B] liquid (액체)","ev":"5번 문장","s":[[5,"These discs are soft and contain liquid.","이러한 디스크들은 무르고 액체를 함유하고 있다."]],"w":"5번 문장에서 디스크들은 무르고(soft) 액체(liquid)를 함유하고 있다고 해요. 나머지 단어는 are 뒤나 contain 뒤에 들어가면 말이 안 돼요.","c":null},"h":"903d5fc52f"}]},{"u":6,"id":"rj2-06-4","no":4,"ko":"맛을 느끼려면 협력이 필요해","items":[{"n":1,"t":"tf","q":"The scent of food goes into your nose and stimulates the nerve cells in it.","ko":"음식의 냄새는 당신의 코로 들어가 그 안의 신경 세포들이 반응하도록 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When you eat something, the scent of the food goes into your nose and stimulates the nerve cells in it.","당신이 무언가를 먹을 때, 음식의 냄새는 당신의 코로 가서 그것 안에 있는 신경 세포들을 자극한다."]],"w":"6번 문장에 the scent of the food goes into your nose and stimulates the nerve cells in it이 그대로 나와요.","c":"T"},"h":"948447737f"},{"n":2,"t":"tf","q":"When your nose is stuffed, the scent easily reaches the nerve cells.","ko":"당신의 코가 막혔을 때, 냄새는 신경 세포에 쉽게 도달한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"However, when your nose is stuffed, the scent cannot reach the nerve cells because of the mucus.","그러나 당신의 코가 막혔을 때, (코에서 나오는) 점액 때문에 냄새가 신경 세포에 도달하지 못한다."]],"w":"8번 문장에서 코가 막히면 점액 때문에 냄새가 신경 세포에 도달하지 못한다(cannot reach)고 해요. 쉽게 도달한다는 말은 반대예요.","c":"F"},"h":"41d99388e7"},{"n":3,"t":"tf","q":"A stuffed nose makes it hard to taste food well.","ko":"코가 막히면 음식 맛을 잘 느끼기 어렵다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"When you have a stuffed nose, you cannot taste well.","당신이 코가 막혔을 때, 당신은 맛을 잘 느낄 수 없다."]],"w":"1번 문장에서 코가 막혔을 때는 맛을 잘 느낄 수 없다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"339a7fe5e4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When you eat something, the scent of the food goes into your nose and stimulates the nerve cells in it.)","ko":"당신이 무언가를 먹을 때, 음식의 냄새는 당신의 코로 가서 그것 안에 있는 신경 세포들을 ( ).","opts":["막는다","자극한다","씻는다","숨긴다"],"word":"stimulates","r":{"a":"2) 자극한다","ev":"6~7번 문장","s":[[6,"When you eat something, the scent of the food goes into your nose and stimulates the nerve cells in it.","당신이 무언가를 먹을 때, 음식의 냄새는 당신의 코로 가서 그것 안에 있는 신경 세포들을 자극한다."],[7,"Then these send information about the taste to the brain.","그러면 이것들은 맛에 관한 정보를 뇌로 보낸다."]],"w":"냄새가 신경 세포에 닿으면 그 세포가 반응해서 맛 정보를 뇌로 보내요(7번). 그래서 stimulate = 자극하다예요.","c":2},"h":"c5801f6a01"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The taste buds on your tongue only recognize basic tastes, such as sweet, sour, bitter, and salty.)","ko":"당신 혀의 미뢰는 오직 단맛, 신맛, 쓴맛, 그리고 짠맛과 같은 기본적인 맛만 ( ).","opts":["만들다","잊다","인식하다","섞다"],"word":"recognize","r":{"a":"3) 인식하다","ev":"4번 문장","s":[[4,"The taste buds on your tongue only recognize basic tastes, such as sweet, sour, bitter, and salty.","당신 혀의 미뢰는 오직 단맛, 신맛, 쓴맛, 그리고 짠맛과 같은 기본적인 맛만 인식할 수 있다."]],"w":"미뢰가 단맛·신맛·쓴맛·짠맛을 알아차린다는 내용이에요. recognize = 인식하다예요.","c":3},"h":"684f6baa6d"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt does not because we don’t use our sense of smell when tasting bitter flavors!","ko":"밑줄 친 \"It\"이(가) 가리키는 것은?","sko":"우리가 쓴 맛을 맛볼 때 우리의 후각을 이용하지 않기 때문에 그것은 아니다!","opts":["코를 잡는 것","쓴 약을 먹는 것","냄새를 맡는 것","혀로 맛을 보는 것"],"r":{"a":"1) 코를 잡는 것","ev":"10~11번 문장","s":[[10,"Then, does holding your nose work when you want to avoid tasting bitter medicine?","그러면, 당신이 쓴 약 맛을 느끼는 것을 피하고 싶을 때 당신의 코를 잡는 것이 효과가 있을까?"],[11,"It does not because we don’t use our sense of smell when tasting bitter flavors!","우리가 쓴 맛을 맛볼 때 우리의 후각을 이용하지 않기 때문에 그것은 아니다!"]],"w":"11번의 It은 바로 앞 10번 문장의 holding your nose(코를 잡는 것)를 가리켜요. 코를 잡아도 쓴맛은 후각을 쓰지 않아서 소용이 없다는 뜻이에요.","c":1,"k":"It = 코를 잡는 것"},"pron":"It","h":"b3395b73bf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The rest of the taste comes from smelling.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"맛의 나머지는 냄새를 맡는 것에서 온다.","opts":["맛의 나머지는 냄새를 맡는 것에서 나온다.","맛의 나머지는 혀에서 나온다.","맛의 전부는 코로 느껴진다.","냄새는 맛과 아무 상관이 없다."],"r":{"a":"1) 맛의 나머지는 냄새를 맡는 것에서 나온다.","ev":"5번 문장","s":[[5,"The rest of the taste comes from smelling.","맛의 나머지는 냄새를 맡는 것에서 온다."]],"w":"the rest of the taste는 '맛의 나머지'이고 comes from smelling은 '냄새를 맡는 것에서 나온다'는 뜻이에요. 혀는 기본적인 맛만 알아봐요(4번).","c":1},"h":"7d5c2554f6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["당신의 귀는 당신이 맛을 느끼는 것을 돕는다.","당신의 코는 당신이 맛을 느끼는 것을 돕는다.","당신의 손은 당신이 맛을 느끼는 것을 돕는다.","오직 당신의 혀만 당신이 맛을 느끼는 것을 돕는다."],"opts":["Your ears help you taste.","Your nose helps you taste.","Your hands help you taste.","Only your tongue helps you taste."],"r":{"a":"2) Your nose helps you taste. (당신의 코는 당신이 맛을 느끼는 것을 돕는다.)","ev":"3번 문장","s":[[3,"It is because your nose helps you taste.","그것은 당신의 코가 당신이 맛을 느끼는 것을 돕기 때문이다."]],"w":"3번에서 코(nose)가 맛을 느끼는 것을 돕는다고 해요. 혀만 돕는다는 말은 아니에요(5번에서 나머지 맛은 냄새에서 온다고 해요).","c":2},"h":"eec5f28b2d"},{"n":9,"t":"sum","q":"The nerve cells send (A) about the taste to the (B).","ko":"신경 세포들은 맛에 관한 (A)을(를) (B)(으)로 보낸다.","oko":["(A) 정보 / (B) 뇌","(A) 정보 / (B) 입","(A) 물 / (B) 뇌","(A) 소리 / (B) 위","(A) 물 / (B) 입"],"opts":["(A) information / (B) brain","(A) information / (B) mouth","(A) water / (B) brain","(A) sound / (B) stomach","(A) water / (B) mouth"],"r":{"a":"1) (A) information / (B) brain ((A) 정보 / (B) 뇌)","ev":"7번 문장","s":[[7,"Then these send information about the taste to the brain.","그러면 이것들은 맛에 관한 정보를 뇌로 보낸다."]],"w":"7번에서 신경 세포들이 맛에 관한 정보(information)를 뇌(brain)로 보낸다고 해요.","c":1},"h":"77bcfd4581"},{"n":10,"t":"fill","q":"So you [A] taste the food [B].","ko":"그래서 당신은 음식 맛을 [B] 느낄 수 [A].","bank":["cannot","well","tongue","sweet","nerve","medicine"],"bko":{"cannot":"없다(can의 부정)","well":"잘","tongue":"혀","sweet":"단","nerve":"신경","medicine":"약"},"r":{"a":"[A] cannot (없다(can의 부정)), [B] well (잘)","ev":"9번 문장","s":[[9,"So you cannot taste the food well.","그래서 당신은 음식 맛을 잘 느낄 수 없다."]],"w":"9번 문장은 So you cannot taste the food well.이에요. 코가 막히면 음식 맛을 잘(well) 느낄 수 없다(cannot)는 뜻이에요. 나머지 단어는 taste 앞이나 the food 뒤에 들어가면 말이 안 돼요.","c":null},"h":"7d2c0c2b7e"}]},{"u":7,"id":"rj2-07-1","no":1,"ko":"닻이 걸렸다!","items":[{"n":1,"t":"tf","q":"The cheaper item is still over the buyer's budget.","ko":"그 더 저렴한 물건도 여전히 구매자의 예산을 초과한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The cheaper item is still over your budget.","그 더 저렴한 물건도 여전히 당신의 예산을 초과한다."]],"w":"3번 문장에서 더 저렴한 물건도 여전히 예산(your budget)을 넘는다고 해요. 그래서 맞는 내용이에요.","c":"T"},"h":"88309e7197"},{"n":2,"t":"tf","q":"People usually rely the most on the information they find last.","ko":"사람들은 보통 그들이 마지막으로 찾은 정보에 가장 많이 의존한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"They usually rely the most on the information that they find first ―the “anchor.”","그들은 보통 그들이 처음 찾은 정보인 ‘닻’에 가장 많이 의존한다."]],"w":"7번 문장에서 사람들이 가장 많이 의존하는 정보는 처음(first) 찾은 정보예요. 마지막이라는 말은 반대예요.","c":"F"},"h":"6d84c4568a"},{"n":3,"t":"tf","q":"Customers see the expensive dishes first, so the other dishes look cheap.","ko":"고객들은 비싼 요리를 먼저 보고, 그래서 나머지 요리들이 싸 보인다.","r":{"a":"T (본문과 맞는 내용)","ev":"12~13번 문장","s":[[12,"Customers see these items first.","고객들은 이 상품들을 먼저 본다."],[13,"So, the other dishes seem cheap even if they really aren’t.","그래서 나머지 요리들은 비록 실제로 그렇지 않더라도 저렴해 보인다."]],"w":"12번에서 손님은 비싼 요리를 먼저 보고, 13번 So(그래서) 뒤에서 나머지 요리가 싸 보인다고 해요.","c":"T"},"h":"9e12eb3a0f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then you see an item that is similar but cheaper.)","ko":"그런 다음 당신은 ( ) 더 싼 물건을 발견한다.","opts":["다른","오래된","비슷한","무거운"],"word":"similar","r":{"a":"3) 비슷한","ev":"2번 문장","s":[[2,"Then you see an item that is similar but cheaper.","그런 다음 당신은 비슷하지만 더 싼 물건을 발견한다."]],"w":"2번 문장은 앞서 본 비싼 물건과 '비슷하지만' 더 싼 물건을 봤다는 뜻이에요. similar = 비슷한.","c":3},"h":"1c7e38042a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The anchoring effect happens because of the way people process information.)","ko":"닻 내림 효과는 사람들이 정보를 ( ) 방식 때문에 발생한다.","opts":["숨기다","처리하다","바꾸다","팔다"],"word":"process","r":{"a":"2) 처리하다","ev":"6번 문장","s":[[6,"The anchoring effect happens because of the way people process information.","그 닻 내림 효과는 사람들이 정보를 처리하는 방식 때문에 발생한다."]],"w":"6번 문장은 효과가 생기는 이유를 말해요. 사람들이 정보를 받아들여 '처리하는' 방식 때문이에요. process = 처리하다.","c":2},"h":"d5112db7f9"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThat is because it can change the way customers think.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것은 고객이 생각하는 방식을 바꿀 수 있기 때문이다.","opts":["예산","닻 내림 효과","비싼 요리","메뉴"],"r":{"a":"2) 닻 내림 효과","ev":"9~10번 문장","s":[[9,"The anchoring effect can be a powerful tool for selling products.","닻 내림 효과는 제품을 판매하는 강력한 도구가 될 수 있다."],[10,"That is because it can change the way customers think.","그것은 닻 내림 효과가 고객이 생각하는 방식을 바꿀 수 있기 때문이다."]],"w":"9번에서 닻 내림 효과가 판매의 강력한 도구라고 했고, 10번은 그 이유를 말해요. 고객의 생각을 바꿀 수 있는 것은 The anchoring effect예요.","c":2,"k":"it = 닻 내림 효과"},"pron":"it","h":"84c2edc5bd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Once they have an anchor, they compare other things to it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"일단 그들이 닻을 갖게 되면, 그들은 다른 것들을 그것과 비교한다.","opts":["닻이 생기면 사람들은 다른 것들을 더는 보지 않는다.","사람들은 다른 것들을 먼저 비교하고 나서 닻을 고른다.","닻은 다른 것들과 비교해서는 안 되는 정보이다.","닻이 생기면 사람들은 다른 것들을 그 닻과 비교한다."],"r":{"a":"4) 닻이 생기면 사람들은 다른 것들을 그 닻과 비교한다.","ev":"8번 문장","s":[[8,"Once they have an anchor, they compare other things to it.","일단 그들이 닻을 갖게 되면, 그들은 다른 것들을 그것과 비교한다."]],"w":"Once는 '일단 ~하면'이에요. 닻(처음 찾은 정보)이 생기면 다른 것들을 it, 즉 그 닻과 비교한다는 뜻이에요.","c":4},"h":"a04902dc00"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["식당들은 가장 싼 요리를 메뉴 맨 위에 놓는다.","닻 내림 효과는 식당에서만 작용한다.","많은 식당들은 비싼 요리 몇 가지를 메뉴 맨 위에 놓는다.","식당들은 메뉴를 절대 바꾸지 않는다."],"opts":["Restaurants put the cheapest dishes at the top of their menu.","The anchoring effect works only in restaurants.","Many restaurants put a few expensive dishes at the top of their menu.","Restaurants never change their menu."],"r":{"a":"3) Many restaurants put a few expensive dishes at the top of their menu. (많은 식당들은 비싼 요리 몇 가지를 메뉴 맨 위에 놓는다.)","ev":"9, 11번 문장","s":[[9,"The anchoring effect can be a powerful tool for selling products.","닻 내림 효과는 제품을 판매하는 강력한 도구가 될 수 있다."],[11,"For example, many restaurants place a few expensive dishes at the top of their menu.","예를 들어, 많은 식당들은 메뉴의 맨 위에 몇 가지 값비싼 요리를 놓는다."]],"w":"11번에서 많은 식당들이 비싼 요리 몇 가지를 메뉴 맨 위에 놓는다고 해요. 닻 내림 효과는 제품 판매에 쓰이는 강력한 도구(9번)예요.","c":3},"h":"ec44238818"},{"n":9,"t":"sum","q":"The anchoring effect can be a powerful (A) for selling (B).","ko":"닻 내림 효과는 (B)을(를) 판매하기 위한 강력한 (A)이(가) 될 수 있다.","oko":["(A) 도구 / (B) 제품","(A) 도구 / (B) 규칙","(A) 비밀 / (B) 제품","(A) 게임 / (B) 친구","(A) 비밀 / (B) 규칙"],"opts":["(A) tool / (B) products","(A) tool / (B) rules","(A) secret / (B) products","(A) game / (B) friends","(A) secret / (B) rules"],"r":{"a":"1) (A) tool / (B) products ((A) 도구 / (B) 제품)","ev":"9번 문장","s":[[9,"The anchoring effect can be a powerful tool for selling products.","닻 내림 효과는 제품을 판매하는 강력한 도구가 될 수 있다."]],"w":"9번에서 닻 내림 효과는 제품(products)을 판매하는 강력한 도구(tool)가 될 수 있다고 해요.","c":1},"h":"138c45e851"},{"n":10,"t":"fill","q":"But it [A] like a good [B].","ko":"하지만 그것은 좋은 [B]처럼 [A].","bank":["seems","deal","dishes","customers","items","compare"],"bko":{"seems":"~처럼 보인다","deal":"거래","dishes":"요리들","customers":"고객들","items":"물건들","compare":"비교하다"},"r":{"a":"[A] seems (~처럼 보인다), [B] deal (거래)","ev":"4번 문장","s":[[4,"But it seems like a good deal.","하지만 그것이 좋은 거래처럼 보인다."]],"w":"4번 문장은 But it seems like a good deal.이에요. 그것이 좋은 거래(deal)처럼 보인다(seems)는 뜻이에요. 복수 명사나 compare는 빈칸에 들어가면 문법이 맞지 않아요.","c":null},"h":"f1953e0ff8"}]},{"u":7,"id":"rj2-07-2","no":2,"ko":"친구 따라 물건을 산다고?","items":[{"n":1,"t":"tf","q":"The term \"bandwagon effect\" comes from American parades.","ko":"‘편승 효과’라는 용어는 미국의 거리 행진에서 유래한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The term comes from American parades.","그 용어는 미국의 거리 행진들에서 유래한다."]],"w":"3번 문장에 The term comes from American parades라고 그대로 나와요.","c":"T"},"h":"abf36a23a9"},{"n":2,"t":"tf","q":"When people heard the music, they stayed away from the bandwagon.","ko":"사람들은 음악 소리를 들었을 때 악대차를 멀리했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"When people heard the music, they followed the bandwagon.","사람들이 그 음악 소리를 들었을 때, 그들은 악대차를 따라갔다."]],"w":"5번 문장에서 사람들은 음악을 듣고 악대차를 따라갔어요(followed the bandwagon). 멀리했다는 말은 반대예요.","c":"F"},"h":"067e7aeb01"},{"n":3,"t":"tf","q":"The writer says people should buy things only when they need them.","ko":"필자는 사람들이 필요할 때만 물건을 사야 한다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Make sure you buy items only when you need them!","반드시 오직 당신이 그것들이 필요할 때만 물건을 사도록 해라!"]],"w":"12번 문장 Make sure you buy items only when you need them!에서 필요할 때만 사라고 해요.","c":"T"},"h":"ac9dac28e7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Soon, more and more people gathered, and they formed a big crowd.)","ko":"곧, 점점 더 많은 사람들이 ( ) 그들은 큰 무리를 형성했다.","opts":["떠났다","모였다","잠들었다","싸웠다"],"word":"gathered","r":{"a":"2) 모였다","ev":"6번 문장","s":[[6,"Soon, more and more people gathered, and they formed a big crowd.","곧, 점점 더 많은 사람들이 모였고, 그들은 큰 무리를 형성했다."]],"w":"6번에서 사람들이 점점 더 많아져 '큰 무리'를 이뤘어요. 그러니 gather는 '모이다'예요.","c":2},"h":"6dc744e9ac"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These days, the term “bandwagon effect” is used to describe the act of people doing something just because others are doing it.)","ko":"요즘에는, ‘편승 효과’라는 용어는 단지 다른 사람들이 그것을 하고 있기 때문에 사람들이 무언가를 하는 행위를 ( ) 데 사용된다.","opts":["묘사하다","숨기다","따라가다","팔다"],"word":"describe","r":{"a":"1) 묘사하다","ev":"8번 문장","s":[[8,"These days, the term “bandwagon effect” is used to describe the act of people doing something just because others are doing it.","요즘에는, ‘편승 효과’라는 용어는 단지 다른 사람들이 그것을 하고 있기 때문에 사람들이 무언가를 하는 행위를 묘사하는 데 사용된다."]],"w":"8번은 편승 효과라는 말이 어떤 행동을 '가리키는 데' 쓰인다는 뜻이에요. describe = 묘사하다, 설명하다.","c":1},"h":"d6b14d43dc"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBut most of them did not know why they had joined the crowd.","ko":"밑줄 친 \"them\"이(가) 가리키는 것은?","sko":"그러나 그들 중 대부분은 그들이 왜 무리에 합류했는지 몰랐다.","opts":["악대차들","악단 단원들","무리를 이룬 사람들","거리 행진들"],"r":{"a":"3) 무리를 이룬 사람들","ev":"6~7번 문장","s":[[6,"Soon, more and more people gathered, and they formed a big crowd.","곧, 점점 더 많은 사람들이 모였고, 그들은 큰 무리를 형성했다."],[7,"But most of them did not know why they had joined the crowd.","그러나 그들 중 대부분은 그들이 왜 무리에 합류했는지 몰랐다."]],"w":"7번의 them은 바로 앞 6번 문장에서 점점 더 많이 모여 큰 무리를 이룬 사람들을 가리켜요. 그 사람들 대부분이 왜 합류했는지 몰랐다는 뜻이에요.","c":3,"k":"them = 무리를 이룬 사람들"},"pron":"them","h":"558d195ee3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the past, bandwagons would carry a band.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"과거에, 악대차는 악단을 실어 나르곤 했다.","opts":["과거에 악대차는 악단을 실어 나르곤 했다.","과거에 악대차는 악단을 실어 나를 수 없었다.","미래에 악대차는 악단을 실어 나를 것이다.","과거에 악단은 악대차를 만들곤 했다."],"r":{"a":"1) 과거에 악대차는 악단을 실어 나르곤 했다.","ev":"4번 문장","s":[[4,"In the past, bandwagons would carry a band.","과거에, 악대차는 악단을 실어 나르곤 했다."]],"w":"In the past는 '과거에'이고 would carry는 '~하곤 했다'라는 과거의 습관을 나타내요. bandwagon(악대차)이 band(악단)를 실어 날랐다는 뜻이에요.","c":1},"h":"72c2882dd4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["어떤 광고들은 편승 효과를 이용한다.","편승 효과를 이용하는 광고는 하나도 없다.","광고는 사람들이 물건을 사지 못하게 하려고 한다.","광고는 행진에서만 사용된다."],"opts":["Some advertisements use the bandwagon effect.","No advertisements use the bandwagon effect.","Advertisements try to stop people from buying things.","Advertisements are used only in parades."],"r":{"a":"1) Some advertisements use the bandwagon effect. (어떤 광고들은 편승 효과를 이용한다.)","ev":"10번 문장","s":[[10,"Advertisements that say things like “Ten bottles are sold every second” also use this effect.","“매초에 열 병씩 팔립니다”와 같은 것들을 말하는 광고들 또한 이 효과를 이용한다."]],"w":"10번에서 “Ten bottles are sold every second”처럼 말하는 광고들도 이 효과를 이용한다고 해요.","c":1},"h":"7031e49b0a"},{"n":9,"t":"sum","q":"We can (A) this in our (B) lives.","ko":"우리는 우리의 (B) 생활에서 이것을 (A) 수 있다.","oko":["(A) 볼 / (B) 일상","(A) 볼 / (B) 비밀","(A) 잃을 / (B) 일상","(A) 잃을 / (B) 비밀","(A) 숨길 / (B) 주간"],"opts":["(A) see / (B) daily","(A) see / (B) secret","(A) lose / (B) daily","(A) lose / (B) secret","(A) hide / (B) weekly"],"r":{"a":"1) (A) see / (B) daily ((A) 볼 / (B) 일상)","ev":"9번 문장","s":[[9,"We can see this in our daily lives.","우리는 우리의 일상생활에서 이것을 볼 수 있다."]],"w":"9번에서 우리는 우리의 일상(daily) 생활에서 이것을 볼(see) 수 있다고 해요.","c":1},"h":"a448f6cfcf"},{"n":10,"t":"fill","q":"When a [A] becomes [B], do you buy it even if you do not need it?","ko":"어떤 [A]이(가) [B] 상태가 되면, 당신은 필요하지 않아도 그것을 사는가?","bank":["product","popular","ask","joined","soon","carry"],"bko":{"product":"상품","popular":"인기 있는","ask":"부탁하다","joined":"합류했다(join의 과거)","soon":"곧","carry":"싣다"},"r":{"a":"[A] product (상품), [B] popular (인기 있는)","ev":"1번 문장","s":[[1,"When a product becomes popular, do you buy it even if you do not need it?","어떤 상품이 인기 있어지면, 당신은 그것이 필요 없음에도 불구하고 그것을 사는가?"]],"w":"1번 문장은 When a product becomes popular, ...예요. 상품(product)이 인기 있는(popular) 상태가 되면이라는 뜻이에요. 나머지 단어는 a 뒤나 becomes 뒤에 들어가면 말이 안 돼요.","c":null},"h":"18d9eeaae1"}]},{"u":7,"id":"rj2-07-3","no":3,"ko":"나도 모르게 따라 하게 돼!","items":[{"n":1,"t":"tf","q":"A TV advertisement may show a model taking a bite of a hamburger.","ko":"TV 광고는 햄버거를 한 입 먹는 모델을 보여줄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The advertisement may show the model taking a bite of the hamburger.","그 광고는 햄버거를 한 입 먹는 모델을 보여줄 수 있다."]],"w":"8번 문장에서 광고가 햄버거를 한 입 먹는 모델을 보여줄 수 있다고 해요.","c":"T"},"h":"5ca9296a24"},{"n":2,"t":"tf","q":"People who watch the advertisement can never copy the model.","ko":"광고를 보는 사람들은 결코 모델을 따라 할 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Due to mirror neurons, people who watch the advertisement may start to copy the model.","거울 뉴런 때문에 광고를 본 사람들은 그 모델을 따라 하기 시작할지도 모른다."]],"w":"9번에서 거울 뉴런 때문에 광고를 본 사람들은 모델을 따라 하기 시작할 수 있다고 해요. never(결코 ~ 않는다)는 반대예요.","c":"F"},"h":"cc244737f0"},{"n":3,"t":"tf","q":"Marketing experts try to use the effect of mirror neurons.","ko":"마케팅 전문가들은 거울 뉴런의 효과를 사용하려고 노력한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"This can even cause you to copy what you have seen.","이것은 심지어 당신으로 하여금 당신이 본 것을 따라 하게 할 수도 있다."],[6,"Marketing experts try to use this effect.","마케팅 전문가들은 이 효과를 사용하려고 노력한다."]],"w":"5번에서 거울 뉴런 때문에 본 것을 따라 하게 된다고 하고, 6번에서 마케팅 전문가들이 이 효과(this effect)를 이용하려 한다고 해요.","c":"T"},"h":"ef3bf78743"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Without even noticing it, they might imitate the model’s emotions and facial expressions.)","ko":"그들은 그것을 알아채지도 못하고 모델의 감정과 표정을 ( ) 수도 있다.","opts":["무시하다","숨기다","모방하다","설명하다"],"word":"imitate","r":{"a":"3) 모방하다","ev":"10번 문장","s":[[10,"Without even noticing it, they might imitate the model’s emotions and facial expressions.","그들은 그것을 알아채지도 못하고 모델의 감정과 표정을 모방할 수도 있다."]],"w":"10번은 알아채지도 못한 채 모델의 감정과 표정을 '따라 한다'는 내용이에요. imitate = 모방하다, 따라 하다.","c":3},"h":"fdeab6ce12"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When you see someone doing something, your brain’s mirror neurons react as if you were actually doing it yourself.)","ko":"당신이 누군가가 무언가를 하는 것을 볼 때, 당신의 뇌 속 거울 뉴런이 당신이 실제로 그것을 직접 하고 있는 것처럼 ( ).","opts":["거절하다","기억하다","사라지다","반응하다"],"word":"react","r":{"a":"4) 반응하다","ev":"4번 문장","s":[[4,"When you see someone doing something, your brain’s mirror neurons react as if you were actually doing it yourself.","당신이 누군가가 무언가를 하는 것을 볼 때, 당신의 뇌 속 거울 뉴런이 당신이 실제로 그것을 직접 하고 있는 것처럼 반응한다."]],"w":"4번은 남이 하는 것을 볼 때 거울 뉴런이 마치 직접 하는 것처럼 '반응한다'는 뜻이에요. react = 반응하다.","c":4},"h":"722572a857"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nDid it make you feel like the person in it?","ko":"밑줄 친 \"it\"이(가) 가리키는 것은?","sko":"그것이 당신을 그 안의 사람처럼 느끼게 했는가?","opts":["TV 광고","당신의 관심","광고 속의 사람","뇌의 거울 뉴런"],"r":{"a":"1) TV 광고","ev":"1~2번 문장","s":[[1,"Have you ever seen a TV advertisement that really grabbed your attention?","당신은 정말로 당신의 관심을 붙잡는 TV 광고를 본 적이 있는가?"],[2,"Did it make you feel like the person in it?","그것이 당신을 TV 광고 속의 사람처럼 느끼게 했는가?"]],"w":"2번의 it은 바로 앞 1번 문장의 a TV advertisement(TV 광고)를 가리켜요. 관심을 붙잡은 그 광고가 당신을 광고 속 사람처럼 느끼게 했는지 묻는 문장이에요.","c":1,"k":"it = TV 광고"},"pron":"it","h":"81aa9a56b8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, the advertisement makes them want the real thing!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로, 광고는 그들이 실제인 것을 원하게 만든다!","opts":["그 결과 광고는 시청자가 실제 물건을 잊게 만든다.","그 결과 시청자는 광고를 보지 않게 된다.","그 결과 광고는 모델이 실제 물건을 원하게 만든다.","그 결과 광고는 시청자가 실제 물건을 원하게 만든다."],"r":{"a":"4) 그 결과 광고는 시청자가 실제 물건을 원하게 만든다.","ev":"12번 문장","s":[[12,"As a result, the advertisement makes them want the real thing!","결과적으로, 광고는 그들이 실제인 것을 원하게 만든다!"]],"w":"As a result는 '결과적으로'이고, makes them want는 '그들이 원하게 만든다'예요. them은 앞 문장의 시청자들이에요. 광고를 본 시청자가 진짜 물건을 원하게 된다는 뜻이에요.","c":4},"h":"c066ce49d8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["거울 뉴런은 뇌 바깥에 있다.","뇌의 거울 뉴런은 당신에게 영향을 줄 수 있다.","거울 뉴런은 당신이 본 것을 잊게 만든다.","거울 뉴런은 당신이 잠을 잘 때만 작동한다."],"opts":["Mirror neurons are found outside the brain.","Mirror neurons in the brain can influence you.","Mirror neurons make you forget what you see.","Mirror neurons work only when you are sleeping."],"r":{"a":"2) Mirror neurons in the brain can influence you. (뇌의 거울 뉴런은 당신에게 영향을 줄 수 있다.)","ev":"3번 문장","s":[[3,"If so, you might have been influenced by mirror neurons in the brain.","만약 그렇다면, 당신은 뇌의 거울 뉴런에 의해 영향을 받았을지도 모른다."]],"w":"3번에서 당신은 뇌의 거울 뉴런(mirror neurons)에 의해 영향을 받았을지도 모른다고 해요. 나머지는 본문에 없는 내용이에요.","c":2},"h":"61ed746200"},{"n":9,"t":"sum","q":"This can even (A) you to copy what you have (B).","ko":"이것은 심지어 당신이 (B) 것을 따라 하게 (A) 수도 있다.","oko":["(A) 만들 / (B) 본","(A) 만들 / (B) 들은","(A) 막을 / (B) 본","(A) 막을 / (B) 들은","(A) 원할 / (B) 잊은"],"opts":["(A) cause / (B) seen","(A) cause / (B) heard","(A) stop / (B) seen","(A) stop / (B) heard","(A) want / (B) forgotten"],"r":{"a":"1) (A) cause / (B) seen ((A) 만들 / (B) 본)","ev":"5번 문장","s":[[5,"This can even cause you to copy what you have seen.","이것은 심지어 당신으로 하여금 당신이 본 것을 따라 하게 할 수도 있다."]],"w":"5번에서 이것은 당신이 본(seen) 것을 따라 하게 만들(cause) 수도 있다고 해요.","c":1},"h":"a39a7f1533"},{"n":10,"t":"fill","q":"[A] may feel like they have [B] the hamburger.","ko":"[A]은(는) 햄버거를 [B] 것처럼 느낄 수 있다.","bank":["viewers","bitten","show","real","watch","noticing"],"bko":{"viewers":"시청자들","bitten":"베어 문(bite의 과거분사)","show":"보여주다","real":"실제의","watch":"지켜보다","noticing":"알아채는 것"},"r":{"a":"[A] viewers (시청자들), [B] bitten (베어 문(bite의 과거분사))","ev":"11번 문장","s":[[11,"Viewers may feel like they have bitten the hamburger.","시청자들은 아마 그들이 햄버거를 베어 물은 것처럼 느낄 것이다."]],"w":"11번 문장은 Viewers may feel like they have bitten the hamburger.예요. 시청자들(viewers)이 햄버거를 베어 문(bitten) 것처럼 느낄 수 있다는 뜻이에요.","c":null},"h":"0f27b7c488"}]},{"u":7,"id":"rj2-07-4","no":4,"ko":"지글거리는 스테이크","items":[{"n":1,"t":"tf","q":"In the open kitchen, the chef puts a piece of meat on the hot grill.","ko":"개방된 주방에서 요리사는 고기 한 점을 뜨거운 석쇠 위에 놓는다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"There is an open kitchen, so you can see the chef cooking.","개방된 주방이 있어서, 당신은 요리사가 요리하고 있는 것을 볼 수 있다."],[5,"He puts a piece of meat on the hot grill.","그는 고기 한 점을 뜨거운 석쇠 위에 놓는다."]],"w":"4번에서 개방된 주방에서 요리사가 요리하는 것을 볼 수 있고, 5번에서 그가 뜨거운 석쇠 위에 고기 한 점을 놓는다고 해요.","c":"T"},"h":"3db2ba801a"},{"n":2,"t":"tf","q":"Many restaurants think tasty food is enough to attract customers.","ko":"많은 식당들은 맛있는 음식이 고객을 모으기에 충분하다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Many restaurants know that tasty food is not enough to attract customers.","많은 식당들이 맛있는 음식이 고객을 끌기에 충분하지 않다는 것을 안다."]],"w":"8번에서 많은 식당은 맛있는 음식이 고객을 끌기에 충분하지 않다(not enough)는 것을 안다고 해요. 충분하다는 말은 반대예요.","c":"F"},"h":"6307580a99"},{"n":3,"t":"tf","q":"The writer says you should pay attention only to the taste of the food.","ko":"필자는 음식의 맛에만 주목해야 한다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"12~13번 문장","s":[[12,"So when you visit your favorite restaurant, do not just taste the food.","그러므로 당신이 매우 좋아하는 식당에 방문할 때, 단지 음식만 맛보지 마라."],[13,"Pay attention to how the restaurant satisfies your other senses.","그 식당이 당신의 다른 감각들을 만족시키는 방법에 주목하라."]],"w":"12번에서 음식만 맛보지 말라고 하고, 13번에서 식당이 다른 감각들을 어떻게 만족시키는지 주목하라고 해요. 맛에만이라는 말은 반대예요.","c":"F"},"h":"ddb4de5927"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many restaurants know that tasty food is not enough to attract customers.)","ko":"많은 식당들이 맛있는 음식이 고객을 ( ) 충분하지 않다는 것을 안다.","opts":["쫓다","끌다","속이다","돕다"],"word":"attract","r":{"a":"2) 끌다","ev":"8번 문장","s":[[8,"Many restaurants know that tasty food is not enough to attract customers.","많은 식당들이 맛있는 음식이 고객을 끌기에 충분하지 않다는 것을 안다."]],"w":"8번은 맛있는 음식만으로는 고객을 '끌기에' 부족하다는 뜻이에요. 그래서 식당들이 모습, 냄새, 소리를 이용해 더 많은 고객을 얻어요(10번). attract = 끌다.","c":2},"h":"b11f437166"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Pay attention to how the restaurant satisfies your other senses.)","ko":"그 식당이 당신의 다른 감각들을 ( ) 방법에 주목하라.","opts":["실망시키다","닫다","바꾸다","만족시키다"],"word":"satisfies","r":{"a":"4) 만족시키다","ev":"13번 문장","s":[[13,"Pay attention to how the restaurant satisfies your other senses.","그 식당이 당신의 다른 감각들을 만족시키는 방법에 주목하라."]],"w":"13번은 식당이 음식 맛 말고 다른 감각들을 어떻게 '만족시키는지' 보라는 뜻이에요. satisfy = 만족시키다.","c":4},"h":"53cca8cbd5"},{"n":6,"t":"ref","q":"What does the underlined \"these\" refer to?\nSo restaurants use these to get more customers.","ko":"밑줄 친 \"these\"이(가) 가리키는 것은?","sko":"그래서 식당들은 더 많은 고객들을 얻기 위해 이것들을 이용한다.","opts":["음식의 모습, 냄새, 소리","더 많은 고객들","식당들","고기의 종류들"],"r":{"a":"1) 음식의 모습, 냄새, 소리","ev":"9~10번 문장","s":[[9,"The sights, smells, and sounds of the food all affect a customer’s experience.","음식의 모습, 냄새, 그리고 소리 모두가 고객의 경험에 영향을 미친다."],[10,"So restaurants use these to get more customers.","그래서 식당들은 더 많은 고객들을 얻기 위해 이것들을 이용한다."]],"w":"10번의 these는 바로 앞 9번 문장의 The sights, smells, and sounds of the food(음식의 모습, 냄새, 소리)를 가리켜요. 식당들은 이것들을 이용해 더 많은 고객을 얻어요.","c":1,"k":"these = 음식의 모습, 냄새, 소리"},"pron":"these","h":"eacccfd2b2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Keep your eyes, ears, and nose open for a sizzling experience!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"지글거리는 (음식) 경험을 위해 당신의 눈과 귀와 코를 열어 두어라!","opts":["식당 안에서는 눈과 귀와 코를 막아라.","눈과 코는 쓰되 귀는 닫아라.","지글거리는 경험을 위해 눈과 귀와 코를 열어 두어라.","음식 맛에만 집중하고 다른 감각은 잊어라."],"r":{"a":"3) 지글거리는 경험을 위해 눈과 귀와 코를 열어 두어라.","ev":"14번 문장","s":[[14,"Keep your eyes, ears, and nose open for a sizzling experience!","지글거리는 (음식) 경험을 위해 당신의 눈과 귀와 코를 열어 두어라!"]],"w":"Keep + 목적어 + open은 '~을 열어 둔 상태로 두어라'예요. 눈, 귀, 코로 느끼는 경험까지 즐기라는 뜻이에요.","c":3},"h":"eb4dacebb7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["전체 경험이 좋으면 고객은 음식을 덜 즐긴다.","전체 경험이 좋으면 고객은 음식을 더욱 더 즐긴다.","고객은 음식이 쌀 때만 그것을 즐긴다.","고객은 경험에 대해 전혀 신경 쓰지 않는다."],"opts":["Customers enjoy the food less when the entire experience is good.","Customers enjoy the food even more when the entire experience is good.","Customers enjoy the food only when it is cheap.","Customers never care about the experience."],"r":{"a":"2) Customers enjoy the food even more when the entire experience is good. (전체 경험이 좋으면 고객은 음식을 더욱 더 즐긴다.)","ev":"11번 문장","s":[[11,"If the entire experience is good, customers enjoy the food even more!","만약 전체적인 경험이 좋다면, 고객들은 음식을 더욱 더 즐긴다!"]],"w":"11번에서 전체적인 경험이 좋으면 고객들이 음식을 더욱 더(even more) 즐긴다고 해요.","c":2},"h":"b91f7f8b63"},{"n":9,"t":"sum","q":"It (A) a sizzling sound and (B) brown.","ko":"그것은 지글거리는 소리를 (A) 갈색이 (B).","oko":["(A) 내고 / (B) 된다","(A) 내고 / (B) 떨어진다","(A) 가져가고 / (B) 된다","(A) 가져가고 / (B) 떨어진다","(A) 듣고 / (B) 떨어진다"],"opts":["(A) makes / (B) turns","(A) makes / (B) falls","(A) takes / (B) turns","(A) takes / (B) falls","(A) hears / (B) falls"],"r":{"a":"1) (A) makes / (B) turns ((A) 내고 / (B) 된다)","ev":"6번 문장","s":[[6,"It makes a sizzling sound and turns brown.","그것은 지글거리는 소리를 내고 갈색이 된다."]],"w":"6번에서 고기가 지글거리는 소리를 내고(makes) 갈색이 된다(turns brown)고 해요.","c":1},"h":"0123bf2866"},{"n":10,"t":"fill","q":"You [A] your [B] steak restaurant.","ko":"당신은 당신의 [B] 스테이크 식당에 [A].","bank":["enter","favorite","closes","lives","puts","pays"],"bko":{"enter":"들어간다","favorite":"매우 좋아하는","closes":"닫는다","lives":"산다","puts":"놓는다","pays":"지불한다"},"r":{"a":"[A] enter (들어간다), [B] favorite (매우 좋아하는)","ev":"2번 문장","s":[[2,"You enter your favorite steak restaurant.","당신은 당신이 매우 좋아하는 스테이크 식당에 들어간다."]],"w":"2번 문장은 You enter your favorite steak restaurant.예요. 당신이 매우 좋아하는(favorite) 스테이크 식당에 들어간다(enter)는 뜻이에요.","c":null},"h":"0739648496"}]},{"u":8,"id":"rj2-08-1","no":1,"ko":"스카치테이프가 자동차와 관계가 있다고?","items":[{"n":1,"t":"tf","q":"Car painters glued paper over the parts that had to stay the original color.","ko":"자동차 도장공들은 원래의 색으로 유지되어야 하는 부분 위에 종이를 붙였다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Next, they glued paper over the parts of the car that had to stay the original color.","다음으로, 그들은 차에서 원래의 색으로 유지되어야 하는 부분들 위에 종이를 붙였다."]],"w":"4번 문장에 they glued paper over the parts of the car that had to stay the original color라고 나와요.","c":"T"},"h":"5c4c1bd2e6"},{"n":2,"t":"tf","q":"Drew invented the first clear tape in the 1920s.","ko":"Drew는 1920년대에 최초의 투명 테이프를 발명했다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"In 1930, he invented the first clear tape.","그는 1930년에 최초의 투명한 테이프를 발명했다."]],"w":"12번 문장에서 Drew가 최초의 투명 테이프를 발명한 때는 1930년이에요. 1920년대는 두 색 자동차가 인기였던 때예요(1번).","c":"F"},"h":"092e862bf9"},{"n":3,"t":"tf","q":"Drew was not satisfied even though the paper tape was a great success.","ko":"종이테이프가 대단한 성공이었지만 Drew는 흡족해하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"It was a great success, but Drew wasn’t satisfied.","그것은 대단한 성공이었지만, Drew는 만족하지 않았다."]],"w":"10번 문장 It was a great success, but Drew wasn’t satisfied와 같은 내용이에요.","c":"T"},"h":"31f22e04de"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So a man named Richard Gurley Drew decided to find a solution.)","ko":"그래서 Richard Gurley Drew라는 이름의 한 남자는 ( )을 찾기로 결심했다.","opts":["문제","실험","해결책","포장"],"word":"solution","r":{"a":"3) 해결책","ev":"8번 문장","s":[[8,"So a man named Richard Gurley Drew decided to find a solution.","그래서 Richard Gurley Drew라는 이름의 한 남자는 해결책을 찾기로 결심했다."]],"w":"7번에서 접착제를 제거하기 어렵다는 문제가 생겼고, 8번에서 Drew가 그 문제를 풀 '해결책'을 찾기로 했어요. solution = 해결책.","c":3},"h":"afcf5a2989"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It was a great success, but Drew wasn’t satisfied.)","ko":"그것은 대단한 성공이었지만, Drew는 ( ) 않았다.","opts":["화난","만족한","피곤한","놀란"],"word":"satisfied","r":{"a":"2) 만족한","ev":"10번 문장","s":[[10,"It was a great success, but Drew wasn’t satisfied.","그것은 대단한 성공이었지만, Drew는 만족하지 않았다."]],"w":"10번은 but(하지만)으로 이어져서, 성공했는데도 Drew는 만족하지 않았다는 뜻이에요. 그래서 셀로판 실험을 계속해요(11번). satisfied = 만족한.","c":2},"h":"1493a21b38"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nUnfortunately, this made life difficult for car painters.","ko":"밑줄 친 \"this\"이(가) 가리키는 것은?","sko":"안타깝게도, 이것은 자동차 도장공들의 삶을 힘들게 만들었다.","opts":["자동차 도장공들의 삶","두 가지 색의 페인트가 칠해진 자동차가 인기 있었던 것","1920년대에 나온 새로운 페인트","종이를 붙이는 접착제"],"r":{"a":"2) 두 가지 색의 페인트가 칠해진 자동차가 인기 있었던 것","ev":"1~2번 문장","s":[[1,"In the 1920s, cars with two different colors of paint were popular.","1920년대에는 두 가지 다른 색의 페인트가 칠해진 자동차들이 인기 있었다."],[2,"Unfortunately, this made life difficult for car painters.","안타깝게도, 이것은 자동차 도장공들의 삶을 힘들게 만들었다."]],"w":"2번의 this는 바로 앞 1번 문장 내용, 즉 두 가지 색의 페인트가 칠해진 자동차가 인기 있었던 것을 가리켜요. 그 때문에 도장공들의 일이 힘들어졌다는 뜻이에요.","c":2,"k":"this = 두 가지 색의 페인트가 칠해진 자동차가 인기 있었던 것"},"pron":"this","h":"1805b40761"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, it was nearly impossible to completely remove the glue from the cars.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 차에서 접착제를 완전히 제거하는 것이 거의 불가능했다.","opts":["접착제를 차에서 완전히 없애는 것은 거의 불가능했다.","접착제를 차에서 완전히 없애는 것은 아주 쉬웠다.","접착제를 차에 완전히 붙이는 것은 거의 불가능했다.","차에서 접착제는 거의 저절로 떨어졌다."],"r":{"a":"1) 접착제를 차에서 완전히 없애는 것은 거의 불가능했다.","ev":"7번 문장","s":[[7,"However, it was nearly impossible to completely remove the glue from the cars.","그러나 차에서 접착제를 완전히 제거하는 것이 거의 불가능했다."]],"w":"nearly impossible은 '거의 불가능한'이고 completely remove the glue는 '접착제를 완전히 제거하다'예요. 그래서 접착제를 다 없애기가 거의 불가능했다는 뜻이에요.","c":1},"h":"ed5300f682"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Drew는 얇고 투명한 플라스틱 물질인 셀로판으로 실험했다.","셀로판은 자동차를 만드는 데 쓰이는 무거운 금속이다.","Drew는 자동차를 칠하려고 셀로판을 사용했다.","Drew는 종이테이프 이후에 발명을 그만두었다."],"opts":["Drew experimented with cellophane, a thin, clear plastic material.","Cellophane is a heavy metal used for building cars.","Drew used cellophane to paint cars.","Drew stopped inventing after the paper tape."],"r":{"a":"1) Drew experimented with cellophane, a thin, clear plastic material. (Drew는 얇고 투명한 플라스틱 물질인 셀로판으로 실험했다.)","ev":"11번 문장","s":[[11,"He began experimenting with cellophane, a new thin, clear plastic material used for packaging.","그는 셀로판, 즉 포장에 쓰이는 새로운 얇고 투명한 플라스틱 물질을 가지고 실험하기 시작했다."]],"w":"11번에서 Drew는 포장에 쓰이는 새로운 얇고 투명한 플라스틱 물질인 셀로판으로 실험하기 시작했다고 해요.","c":1},"h":"73711a3515"},{"n":9,"t":"sum","q":"Today we (A) his invention as “(B) tape.”","ko":"오늘날 우리는 그의 발명품을 ‘(B) 테이프’라고 (A).","oko":["(A) 알고 있다 / (B) 스카치","(A) 알고 있다 / (B) 드루","(A) 판다 / (B) 스카치","(A) 판다 / (B) 드루","(A) 칠한다 / (B) 종이"],"opts":["(A) know / (B) Scotch","(A) know / (B) Drew","(A) sell / (B) Scotch","(A) sell / (B) Drew","(A) paint / (B) paper"],"r":{"a":"1) (A) know / (B) Scotch ((A) 알고 있다 / (B) 스카치)","ev":"13번 문장","s":[[13,"Today we know his invention as “Scotch tape.”","오늘날 우리는 그의 발명품을 ‘스카치테이프’라고 알고 있다."]],"w":"13번에서 오늘날 우리는 그의 발명품을 ‘스카치(Scotch) 테이프’라고 알고 있다(know)고 해요.","c":1},"h":"d647b37b78"},{"n":10,"t":"fill","q":"Two years [A], he invented paper tape that could be removed [B] and easily.","ko":"2년 [A], 그는 [B] 그리고 쉽게 제거될 수 있는 종이테이프를 발명했다.","bank":["later","cleanly","cellophane","success","packaging","original"],"bko":{"later":"후에","cleanly":"깨끗하게","cellophane":"셀로판","success":"성공","packaging":"포장","original":"원래의"},"r":{"a":"[A] later (후에), [B] cleanly (깨끗하게)","ev":"9번 문장","s":[[9,"Two years later, he invented paper tape that could be removed cleanly and easily.","2년 후에, 그는 깨끗하고 쉽게 제거될 수 있는 종이테이프를 발명했다."]],"w":"9번 문장은 Two years later, he invented paper tape that could be removed cleanly and easily.예요. 2년 후에(later), 깨끗하고(cleanly) 쉽게 제거되는 테이프를 발명했다는 뜻이에요.","c":null},"h":"d0f359479f"}]},{"u":8,"id":"rj2-08-2","no":2,"ko":"날씨 아래에 있다는 것은?","items":[{"n":1,"t":"tf","q":"One popular theory says that the idiom came from the language of sailors.","ko":"한 인기 있는 이론은 그 관용어가 선원들의 언어에서 왔다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"One popular theory suggests that it came from the language of sailors.","한 인기 있는 이론은 그것이 선원들의 언어로부터 왔다고 시사한다."]],"w":"4번 문장 One popular theory suggests that it came from the language of sailors와 같은 내용이에요.","c":"T"},"h":"2a4dbfda4d"},{"n":2,"t":"tf","q":"At first, the idiom was used for every type of illness.","ko":"처음에 그 관용어는 모든 종류의 질병에 사용되었다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"At first, the idiom was only used to talk about seasickness.","처음에 그 관용어는 단지 뱃멀미에 대해 말할 때만 사용되었다."]],"w":"9번에서 처음에는 뱃멀미(seasickness)에 대해 말할 때만 사용되었다고 해요. 모든 종류의 병에 쓰인 것은 오늘날이에요(11번).","c":"F"},"h":"aba279cb03"},{"n":3,"t":"tf","q":"When the weather was bad, the sea would be rough.","ko":"날씨가 나쁠 때 바다는 거칠었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"When the weather was bad, the sea would be rough.","날씨가 나쁠 때, 바다는 거칠었다."]],"w":"5번 문장 그대로예요. 나쁜 날씨 때문에 바다가 거칠어졌고, 그래서 배가 많이 움직였어요(6번).","c":"T"},"h":"4916830737"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (There are several common theories about the origin of this idiom.)","ko":"이 관용어의 ( )에 대한 몇 가지 일반적인 이론이 있다.","opts":["결과","의미","기원","비밀"],"word":"origin","r":{"a":"3) 기원","ev":"3번 문장","s":[[3,"There are several common theories about the origin of this idiom.","이 관용어의 기원에 대한 몇 가지 일반적인 이론이 있다."]],"w":"3번은 이 관용어가 어디서 시작되었는지에 대한 이론들이에요. 4번부터 그 이론이 나와요. origin = 기원, 유래.","c":3},"h":"2e2b798775"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That meant they were literally under the bad weather taking place above deck.)","ko":"그것은 그들이 ( ) 갑판 위에서 일어나는 나쁜 날씨 아래에 있다는 것을 의미했다.","opts":["문자 그대로","거의","가끔","아마도"],"word":"literally","r":{"a":"1) 문자 그대로","ev":"8번 문장","s":[[8,"That meant they were literally under the bad weather taking place above deck.","그것은 그들이 문자 그대로 갑판 위에서 일어나는 나쁜 날씨 아래에 있다는 것을 의미했다."]],"w":"선원들은 갑판 아래에 있었고 나쁜 날씨는 갑판 위에 있었으니, 정말로 말 그대로 날씨 아래에 있었던 거예요. literally = 문자 그대로.","c":1},"h":"70ac4dee8b"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThis made the boat move a lot, which often made sailors ill.","ko":"밑줄 친 \"which\"이(가) 가리키는 것은?","sko":"이것은 배를 많이 움직이게 만들었고, 이것은 종종 선원들을 아프게 했다.","opts":["선원들","배가 많이 움직인 것","거친 바다에서 쉬는 것","갑판 아래"],"r":{"a":"2) 배가 많이 움직인 것","ev":"5~6번 문장","s":[[5,"When the weather was bad, the sea would be rough.","날씨가 나쁠 때, 바다는 거칠었다."],[6,"This made the boat move a lot, which often made sailors ill.","이것은 배를 많이 움직이게 만들었고, 이것은 종종 선원들을 아프게 했다."]],"w":"which는 콤마 앞 내용 전체를 가리켜요. 나쁜 날씨로 바다가 거칠어져(5번) 배가 많이 움직인 것이 선원들을 아프게 했어요(6번).","c":2},"pron":"which","h":"7f36d28b19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As time went on, it took on a wider meaning.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시간이 지나면서, 그것은 더 넓은 의미를 가지게 되었다.","opts":["시간이 지나면서 그 말은 뜻을 완전히 잃었다.","시간이 지나면서 그 말은 더 좁은 뜻을 가지게 되었다.","시간이 멈추자 그 말은 새로운 뜻을 가졌다.","시간이 지나면서 그 말은 더 넓은 뜻을 가지게 되었다."],"r":{"a":"4) 시간이 지나면서 그 말은 더 넓은 뜻을 가지게 되었다.","ev":"10번 문장","s":[[10,"As time went on, it took on a wider meaning.","시간이 지나면서, 그것은 더 넓은 의미를 가지게 되었다."]],"w":"As time went on은 '시간이 지나면서', took on a wider meaning은 '더 넓은 의미를 가지게 되었다'예요. 뱃멀미에서 모든 병으로 넓어진 것을 말해요(9번, 11번).","c":4},"h":"9f39e61fa4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아픈 선원들은 쉬려고 갑판 위로 갔다.","아픈 선원들은 쉬면서 나아지려고 갑판 아래로 갔다.","아픈 선원들은 갑판에서 계속 일했다.","아픈 선원들은 바다로 뛰어들었다."],"opts":["Sick sailors went above deck to rest.","Sick sailors went below deck to rest and get better.","Sick sailors kept working on the deck.","Sick sailors jumped into the sea."],"r":{"a":"2) Sick sailors went below deck to rest and get better. (아픈 선원들은 쉬면서 나아지려고 갑판 아래로 갔다.)","ev":"7번 문장","s":[[7,"They had to go below deck to rest and get better.","그들은 휴식을 취하고 나아지기 위해 갑판 아래로 가야만 했다."]],"w":"7번에서 선원들은 휴식을 취하고 나아지기 위해 갑판 아래(below deck)로 가야 했다고 해요.","c":2},"h":"35aa6e73c1"},{"n":9,"t":"sum","q":"(A), “under the weather” can be used for (B) type of illness.","ko":"(A), ‘날씨 아래에 있는’은 (B) 종류의 질병에 사용될 수 있다.","oko":["(A) 오늘날 / (B) 모든","(A) 오늘날 / (B) 한 가지","(A) 한때 / (B) 모든","(A) 한때 / (B) 한 가지","(A) 절대 ~않다 / (B) 한 가지"],"opts":["(A) Today / (B) any","(A) Today / (B) one","(A) Once / (B) any","(A) Once / (B) one","(A) Never / (B) one"],"r":{"a":"1) (A) Today / (B) any ((A) 오늘날 / (B) 모든)","ev":"11번 문장","s":[[11,"Today, “under the weather” can be used for any type of illness.","오늘날, ‘날씨 아래에 있는’은 모든 종류의 질병에 사용될 수 있다."]],"w":"11번에서 오늘날(Today) ‘under the weather’는 모든(any) 종류의 질병에 사용될 수 있다고 해요.","c":1},"h":"dad92a517c"},{"n":10,"t":"fill","q":"If you are feeling a [A] unwell, you may [B] that you’re “under the weather.”","ko":"만약 당신이 [A] 아프다고 느낀다면, 당신은 ‘날씨 아래에 있는’이라고 [B] 수도 있다.","bank":["bit","say","rough","below","theory","sailors"],"bko":{"bit":"조금","say":"말하다","rough":"거친","below":"아래에","theory":"이론","sailors":"선원들"},"r":{"a":"[A] bit (조금), [B] say (말하다)","ev":"1번 문장","s":[[1,"If you are feeling a bit unwell, you may say that you’re “under the weather.”","만약 당신이 조금 아프다면, 당신은 ‘날씨 아래에 있는(under the weather)’이라고 말할지도 모른다."]],"w":"1번 문장에서 조금(a bit) 아프다면 ‘under the weather’라고 말할지도(may say) 모른다고 해요. 나머지 단어는 a 뒤나 may 뒤에 들어가면 말이 안 돼요.","c":null},"h":"e27a760548"}]},{"u":8,"id":"rj2-08-3","no":3,"ko":"달을 닮은 빵","items":[{"n":1,"t":"tf","q":"One night, an Austrian baker heard strange sounds under his bakery.","ko":"어느 날 밤, 한 오스트리아인 제빵사가 자신의 빵집 아래에서 이상한 소리를 들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"One night, an Austrian baker heard strange sounds beneath his bakery.","어느 날 밤, 한 오스트리아인 제빵사가 자신의 빵집 아래에서 이상한 소리를 들었다."]],"w":"7번 문장에서 오스트리아인 제빵사가 빵집 아래에서 이상한 소리를 들었다고 해요.","c":"T"},"h":"093b892414"},{"n":2,"t":"tf","q":"The kipfel was brought to Germany, where it became the croissant.","ko":"킵펠은 독일로 들여져 왔고, 그곳에서 크루아상이 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"Nearly 100 years later, the kipfel was brought to France, where it became the croissant.","거의 100년이 지난 후, 킵펠은 프랑스로 들여져 왔고, 그곳에서 그것은 크루아상이 되었다."]],"w":"13번 문장에서 킵펠이 들여져 와서 크루아상이 된 곳은 독일이 아니라 프랑스(France)예요.","c":"F"},"h":"061f0d82a9"},{"n":3,"t":"tf","q":"Many people think the croissant comes from Austria.","ko":"많은 사람들은 크루아상이 오스트리아에서 비롯되었다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"1~2번 문장","s":[[1,"Many people assume that the croissant comes from France.","많은 사람들이 크루아상이 프랑스에서 비롯되었다고 생각한다."],[2,"However, it is actually based on a type of Austrian bread, the kipfel.","그러나, 그것은 사실 킵펠(kipfel)이라는 일종의 오스트리아 빵에 기반을 두고 있다."]],"w":"1번에서 많은 사람들은 크루아상이 프랑스에서 왔다고 생각해요. 오스트리아 빵에 기반을 둔 것은 2번의 사실이에요.","c":"F"},"h":"23319a09d9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... after Austria defeated the Ottoman Empire in a battle.)","ko":"오스트리아가 전투에서 오스만 제국을 ( ) 후 ...","opts":["도왔다","패배시켰다","방문했다","발견했다"],"word":"defeated","r":{"a":"2) 패배시켰다","ev":"4번 문장","s":[[4,"According to legend, the kipfel was created in 1683 after Austria defeated the Ottoman Empire in a battle.","전설에 따르면, 킵펠은 오스트리아가 전쟁에서 오스만 제국을 패배시킨 후 1683년에 만들어졌다."]],"w":"4번은 오스트리아가 전투에서 오스만 제국을 이긴 뒤라는 뜻이에요. 그래서 오스트리아가 이기고 나서 킵펠이 만들어졌어요. defeat = 패배시키다.","c":2},"h":"06f69022ba"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He quickly alerted the Austrian soldiers.)","ko":"그는 재빨리 오스트리아 병사들에게 ( ).","opts":["초대했다","따라갔다","가르쳤다","알렸다"],"word":"alerted","r":{"a":"4) 알렸다","ev":"9번 문장","s":[[9,"He quickly alerted the Austrian soldiers.","그는 재빨리 오스트리아 병사들에게 알렸다."]],"w":"8번에서 굴을 파는 것을 알아챈 제빵사가 병사들에게 재빨리 '알렸어요'. 그래서 굴이 파괴되었어요(10번). alert = 알리다.","c":4},"h":"f33e34b502"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was shaped like the moon on the Ottoman Empire’s flag.","ko":"밑줄 친 \"It\"이(가) 가리키는 것은?","sko":"그것은 오스만 제국의 국기에 있는 달처럼 생겼었다.","opts":["도시","굴","제빵사가 만든 빵","깃발"],"r":{"a":"3) 제빵사가 만든 빵","ev":"11~12번 문장","s":[[11,"To celebrate, he made some special bread.","(이를) 기념하기 위해, 그는 어떤 특별한 빵을 만들었다."],[12,"It was shaped like the moon on the Ottoman Empire’s flag.","그것은 오스만 제국의 국기에 있는 달처럼 생겼었다."]],"w":"12번의 It은 바로 앞 11번 문장의 some special bread(제빵사가 만든 빵)를 가리켜요. 그 빵은 오스만 제국 국기의 달 모양을 닮았어요.","c":3,"k":"It = 제빵사가 만든 빵"},"pron":"It","h":"7497e962c8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Luckily, the city was protected by tall walls.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다행히, 그 도시는 높은 벽으로 보호되고 있었다.","opts":["운 좋게도 그 도시는 높은 벽으로 보호되고 있었다.","불행히도 그 도시는 벽이 없어서 위험했다.","그 도시가 스스로 높은 벽을 파괴했다.","다행히 그 도시의 벽은 낮아서 쉽게 열렸다."],"r":{"a":"1) 운 좋게도 그 도시는 높은 벽으로 보호되고 있었다.","ev":"6번 문장","s":[[6,"Luckily, the city was protected by tall walls.","다행히, 그 도시는 높은 벽으로 보호되고 있었다."]],"w":"Luckily는 '다행히', was protected by tall walls는 '높은 벽으로 보호되고 있었다'예요. 앞 문장에서 오스만 제국이 도시를 둘러쌌는데, 높은 벽 덕분에 지킬 수 있었다는 뜻이에요.","c":1},"h":"a8f74d1c18"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오스만 제국은 이미 비엔나 도시를 차지했었다.","오스만 제국은 비엔나 도시를 둘러쌌었다.","오스만 제국은 비엔나 도시의 손님이었다.","오스만 제국은 비엔나 근처에 온 적이 없다."],"opts":["The Ottomans had already won the city of Vienna.","The Ottomans had surrounded the city of Vienna.","The Ottomans were guests in the city of Vienna.","The Ottomans had never come near Vienna."],"r":{"a":"2) The Ottomans had surrounded the city of Vienna. (오스만 제국은 비엔나 도시를 둘러쌌었다.)","ev":"5번 문장","s":[[5,"The Ottomans had surrounded the city of Vienna.","오스만 제국 사람들이 비엔나 도시를 둘러쌌었다."]],"w":"5번에서 오스만 제국 사람들이 비엔나 도시를 둘러쌌었다(had surrounded)고 해요.","c":2},"h":"df2931e5e0"},{"n":9,"t":"sum","q":"To (A), he made some (B) bread.","ko":"(A)하기 위해, 그는 어떤 (B) 빵을 만들었다.","oko":["(A) 기념 / (B) 특별한","(A) 기념 / (B) 오래된","(A) 휴식 / (B) 특별한","(A) 탈출 / (B) 오래된","(A) 휴식 / (B) 나쁜"],"opts":["(A) celebrate / (B) special","(A) celebrate / (B) old","(A) rest / (B) special","(A) escape / (B) old","(A) rest / (B) bad"],"r":{"a":"1) (A) celebrate / (B) special ((A) 기념 / (B) 특별한)","ev":"11번 문장","s":[[11,"To celebrate, he made some special bread.","(이를) 기념하기 위해, 그는 어떤 특별한 빵을 만들었다."]],"w":"11번에서 기념하기(celebrate) 위해 그는 특별한(special) 빵을 만들었다고 해요.","c":1},"h":"88f12276be"},{"n":10,"t":"fill","q":"He [A] the Ottomans were [B] a tunnel under the city walls!","ko":"그는 오스만 제국 사람들이 도시의 벽 아래에서 굴을 [B] 있다는 것을 [A]!","bank":["realized","digging","carried","protected","strange","beneath"],"bko":{"realized":"알아챘다","digging":"파고(dig의 -ing형)","carried":"나르고 다녔다","protected":"보호했다","strange":"이상한","beneath":"~ 아래에"},"r":{"a":"[A] realized (알아챘다), [B] digging (파고(dig의 -ing형))","ev":"8번 문장","s":[[8,"He realized the Ottomans were digging a tunnel under the city walls!","그는 오스만 제국 사람들이 도시의 벽 아래에 굴을 파고 있다는 것을 알아챘다!"]],"w":"8번 문장은 He realized the Ottomans were digging a tunnel under the city walls!예요. 그는 오스만 사람들이 굴을 파고(digging) 있다는 것을 알아챘다(realized)는 뜻이에요.","c":null},"h":"bf94a6c0c2"}]},{"u":8,"id":"rj2-08-4","no":4,"ko":"오른손 좀 확인해 보겠습니다~","items":[{"n":1,"t":"tf","q":"Some experts think shaking hands was a way of checking for weapons.","ko":"일부 전문가들은 악수가 무기를 확인하는 방법이었다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"So some experts think shaking hands was a way of checking for weapons.","그래서 일부 전문가들은 악수가 무기를 확인하는 방법이었다고 생각한다."]],"w":"7번 문장 So some experts think shaking hands was a way of checking for weapons와 같은 내용이에요.","c":"T"},"h":"f0d17d7e79"},{"n":2,"t":"tf","q":"It is believed that people started shaking hands in modern times.","ko":"사람들이 현대에 악수를 하기 시작했다고 믿어진다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It is believed that it started in ancient times.","그것은 고대에 시작되었다고 믿어진다."]],"w":"4번에서 악수는 고대(ancient times)에 시작되었다고 믿어져요. 현대라는 말은 반대예요.","c":"F"},"h":"9cc7f2f5ee"},{"n":3,"t":"tf","q":"Moving a person’s hand up and down could reveal a weapon hidden in the sleeve.","ko":"사람의 손을 위아래로 움직이면 소매에 숨긴 무기가 발각될 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"Also, people sometimes hid weapons in their sleeves.","또한, 사람들은 때때로 자신의 소매 속에 무기를 숨겼다."],[10,"If someone did this, moving the person’s hand up and down would reveal the weapon.","만약 누군가 이렇게 했다면, 그 사람의 손을 위 아래로 움직이는 것은 무기를 드러나게 했을 것이다."]],"w":"9번에서 사람들은 소매에 무기를 숨기기도 했고, 10번에서 손을 위아래로 움직이면 무기가 드러났다고 해요.","c":"T"},"h":"e8099232de"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If someone did this, moving the person’s hand up and down would reveal the weapon.)","ko":"만약 누군가 이렇게 했다면, 그 사람의 손을 위 아래로 움직이는 것은 무기를 ( ) 것이다.","opts":["만들다","잊다","드러내다","붙잡다"],"word":"reveal","r":{"a":"3) 드러내다","ev":"10번 문장","s":[[10,"If someone did this, moving the person’s hand up and down would reveal the weapon.","만약 누군가 이렇게 했다면, 그 사람의 손을 위 아래로 움직이는 것은 무기를 드러나게 했을 것이다."]],"w":"10번은 소매 속에 숨긴 무기가 손을 흔들면 겉으로 나온다는 뜻이에요. reveal = 드러내 보이다.","c":3},"h":"63cee3711b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Since people usually carried weapons in their right hands, ...)","ko":"사람들은 보통 무기를 오른손에 ( ) 때문에, ...","opts":["팔았다","들고 다녔다","버렸다","빌렸다"],"word":"carried","r":{"a":"2) 들고 다녔다","ev":"11번 문장","s":[[11,"Since people usually carried weapons in their right hands, it was common to always use the right hand in a handshake.","사람들은 보통 무기를 오른손에 들었기 때문에, 악수를 할 때 항상 오른손을 사용하는 것이 일반적이었다."]],"w":"11번은 사람들이 무기를 오른손에 들고 다녔다는 뜻이에요. 그래서 악수할 때 항상 오른손을 썼어요. carry = 들고 다니다.","c":2},"h":"5a14275155"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nToday this seems perfectly normal.","ko":"밑줄 친 \"this\"이(가) 가리키는 것은?","sko":"오늘날 이것은 지극히 평범해 보인다.","opts":["두 사람이 만나면 악수하는 것","무기를 숨기는 것","그림을 그리는 것","오른손을 다치는 것"],"r":{"a":"1) 두 사람이 만나면 악수하는 것","ev":"1~2번 문장","s":[[1,"When two people meet, they often shake hands.","두 사람이 만나면 그들은 종종 악수를 한다."],[2,"Today this seems perfectly normal.","오늘날 이것은 지극히 평범해 보인다."]],"w":"2번의 this는 바로 앞 1번 문장 내용, 즉 두 사람이 만나면 악수를 하는 것을 가리켜요. 오늘날에는 악수가 아주 평범해 보인다는 뜻이에요.","c":1,"k":"this = 두 사람이 만나면 악수하는 것"},"pron":"this","h":"a6b2da3372"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Eventually, this became a gesture of peace between two people who were meeting.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결국 이것은 만나고 있는 두 사람 사이에 평화의 제스처가 되었다.","opts":["결국 이것은 만나는 두 사람 사이의 평화의 몸짓이 되었다.","결국 이것은 두 사람이 싸우기 시작하는 신호가 되었다.","처음부터 이것은 서로 무기를 겨누는 몸짓이었다.","결국 이것은 만나지 않는 사람들 사이의 약속이 되었다."],"r":{"a":"1) 결국 이것은 만나는 두 사람 사이의 평화의 몸짓이 되었다.","ev":"12번 문장","s":[[12,"Eventually, this became a gesture of peace between two people who were meeting.","결국 이것은 만나고 있는 두 사람 사이에 평화의 제스처가 되었다."]],"w":"Eventually는 '결국'이고, became a gesture of peace는 '평화의 몸짓이 되었다'예요. who were meeting은 만나고 있는 두 사람을 말해요.","c":1},"h":"8749b30870"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["옛 그림들은 춤추는 사람들을 보여준다.","옛 그림들 중 다수가 병사들을 보여준다.","옛 그림들 중 다수가 농부들을 보여준다.","옛 그림 중에 사람을 보여주는 것은 하나도 없다."],"opts":["Old paintings show people dancing.","Many of the old paintings show soldiers.","Many of the old paintings show farmers.","No old paintings show people."],"r":{"a":"2) Many of the old paintings show soldiers. (옛 그림들 중 다수가 병사들을 보여준다.)","ev":"5~6번 문장","s":[[5,"Paintings from as early as the fifth century BC show people shaking hands.","기원전 5세기경의 그림들은 악수하고 있는 사람들을 보여준다."],[6,"Many of these paintings show soldiers.","이러한 그림들 중 다수가 병사들을 보여준다."]],"w":"6번에서 이러한 그림들(5번의 악수하는 사람들을 보여주는 그림들) 중 다수가 병사들을 보여준다고 해요.","c":2},"h":"d19684a2d5"},{"n":9,"t":"sum","q":"When (A) people meet, they (B) shake hands.","ko":"(A) 사람이 만나면 그들은 (B) 악수를 한다.","oko":["(A) 두 / (B) 종종","(A) 두 / (B) 드물게","(A) 열 / (B) 종종","(A) 열 / (B) 드물게","(A) 몇몇 / (B) 항상"],"opts":["(A) two / (B) often","(A) two / (B) rarely","(A) ten / (B) often","(A) ten / (B) rarely","(A) few / (B) always"],"r":{"a":"1) (A) two / (B) often ((A) 두 / (B) 종종)","ev":"1번 문장","s":[[1,"When two people meet, they often shake hands.","두 사람이 만나면 그들은 종종 악수를 한다."]],"w":"1번에서 두(two) 사람이 만나면 그들은 종종(often) 악수를 한다고 해요.","c":1},"h":"f5f82f6064"},{"n":10,"t":"fill","q":"Paintings from as [A] as the fifth [B] BC show people shaking hands.","ko":"기원전 5[B]경만큼 [A] 때의 그림들은 악수하고 있는 사람들을 보여준다.","bank":["early","century","soldiers","sleeves","weapons","grab"],"bko":{"early":"이른","century":"세기","soldiers":"병사들","sleeves":"소매","weapons":"무기들","grab":"잡다"},"r":{"a":"[A] early (이른), [B] century (세기)","ev":"5번 문장","s":[[5,"Paintings from as early as the fifth century BC show people shaking hands.","기원전 5세기경의 그림들은 악수하고 있는 사람들을 보여준다."]],"w":"5번 문장은 Paintings from as early as the fifth century BC show people shaking hands.예요. as early as는 '일찍이 ~만큼 이른'이고 fifth century는 '5세기'예요.","c":null},"h":"c81b75f060"}]},{"u":9,"id":"rj2-09-1","no":1,"ko":"세상에 이런 규칙이!","items":[{"n":1,"t":"tf","q":"Baseball has been popular for over 150 years.","ko":"야구는 150년이 넘도록 인기를 끌어 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Baseball has been popular for more than 150 years.","야구는 150년이 넘는 기간 동안 인기가 있어왔다."]],"w":"4번 문장에 has been popular for more than 150 years가 있어요. 150년이 넘는 기간 동안 인기가 있었다는 내용과 맞아요.","c":"T"},"h":"2ca469d5d7"},{"n":2,"t":"tf","q":"In the 19th century, batters could not choose the kind of pitch.","ko":"19세기에 타자들은 투구의 종류를 고를 수 없었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"For example, batters could request the kind of pitch they wanted.","예를 들어, 타자들은 그들이 원하는 투구의 종류를 요청할 수 있었다."]],"w":"6번 문장에서 타자들이 원하는 투구의 종류를 요청할 수 있었다(could request)고 해요. 고를 수 없었다는 말은 반대예요.","c":"F"},"h":"a870ba8ca4"},{"n":3,"t":"tf","q":"In the past, umpires sometimes asked spectators for help.","ko":"과거에 심판들은 때때로 관중들에게 도움을 구했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"But in the past they would sometimes ask spectators for help in making decisions.","하지만 과거에는 때때로 관중들에게 결정을 내리는 데 도움을 요청하기도 했다."]],"w":"10번 문장에 But in the past they would sometimes ask spectators for help가 있어요. 과거 심판이 관중에게 도움을 요청했다는 내용과 맞아요.","c":"T"},"h":"cf67776bd1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Today, they play a neutral role by enforcing the rules.)","ko":"오늘날, 그들은 규칙을 시행함으로써 ( ) 역할을 한다.","opts":["편을 드는","중립적인","위험한","화려한"],"word":"neutral","r":{"a":"2) 중립적인","ev":"9번 문장","s":[[9,"Today, they play a neutral role by enforcing the rules.","오늘날, 그들은 규칙을 시행함으로써 중립적인 역할을 한다."]],"w":"9번에서 심판은 규칙을 시행하는 역할을 해요. 10번의 과거(관중에게 도움을 청함)와 대비되어, 어느 편도 들지 않는 '중립적인' 역할이라는 뜻이에요.","c":2},"h":"22ca272013"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For example, batters could request the kind of pitch they wanted.)","ko":"예를 들어, 타자들은 그들이 원하는 투구의 종류를 ( ) 수 있었다.","opts":["요청하다","피하다","거절하다","던지다"],"word":"request","r":{"a":"1) 요청하다","ev":"6~7번 문장","s":[[6,"For example, batters could request the kind of pitch they wanted.","예를 들어, 타자들은 그들이 원하는 투구의 종류를 요청할 수 있었다."],[7,"They would ask the pitchers to throw the ball either high or low.","그들은 투수들에게 높거나 낮게 공을 던지도록 요청했었다."]],"w":"6번의 request 뒤에 7번에서 They would ask the pitchers(투수들에게 요청했다)가 이어져요. request = 요청하다.","c":1},"h":"aaa2a519ec"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThen a player from the other team tries to hit it with a bat.","ko":"밑줄 친 \"it\"이(가) 가리키는 것은?","sko":"그리고 다른 팀의 선수가 방망이로 그것을 치려고 한다.","opts":["작은 공","방망이","다른 팀의 선수","야구 경기"],"r":{"a":"1) 작은 공","ev":"2~3번 문장","s":[[2,"A player from one team throws a small ball.","한 팀의 선수가 작은 공을 던진다."],[3,"Then a player from the other team tries to hit it with a bat.","그리고 다른 팀의 선수가 방망이로 그것을 치려고 한다."]],"w":"3번의 it은 바로 앞 2번 문장의 a small ball(작은 공)을 가리켜요. 다른 팀의 선수가 그 공을 방망이로 치려고 해요.","c":1,"k":"it = 작은 공"},"pron":"it","h":"885a16deb9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That doesn’t sound very fair, does it?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 매우 공정하게 들리지 않는다, 그렇지 않은가?","opts":["그것은 모두에게 아주 공정한 방식이다.","그것은 공정하다고 보기 어렵다.","그것은 너무 쉬워서 재미가 없다.","그것은 아무도 들어 본 적 없는 이야기이다."],"r":{"a":"2) 그것은 공정하다고 보기 어렵다.","ev":"11번 문장","s":[[11,"That doesn’t sound very fair, does it?","그것은 매우 공정하게 들리지 않는다, 그렇지 않은가?"]],"w":"doesn't sound very fair는 '별로 공정하게 들리지 않는다'는 뜻이고, does it은 동의를 구하는 말투예요. 10번(관중에게 도움을 청한 것)이 공정하지 않다는 필자의 생각이에요.","c":2},"h":"31c9b3c575"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["19세기의 규칙은 모두 오늘날의 규칙과 같았다.","19세기의 일부 규칙은 오늘날의 규칙과 매우 달랐다.","야구의 규칙은 한 번도 달랐던 적이 없다.","19세기에는 야구를 하지 않았다."],"opts":["All of the rules in the 19th century were the same as today’s rules.","Some of the rules in the 19th century were very different from today’s rules.","The rules of baseball were never different.","Baseball was not played in the 19th century."],"r":{"a":"2) Some of the rules in the 19th century were very different from today’s rules. (19세기의 일부 규칙은 오늘날의 규칙과 매우 달랐다.)","ev":"5번 문장","s":[[5,"However, some of the rules in the 19th century were very different from the rules of today.","하지만 19세기의 규칙들 중 일부는 오늘날의 규칙들과 매우 달랐다."]],"w":"5번에서 19세기의 규칙들 중 일부는 오늘날의 규칙들과 매우 달랐다고 해요.","c":2},"h":"cb8c929e34"},{"n":9,"t":"sum","q":"The game of baseball is played by (A) teams of (B) players.","ko":"야구 경기는 (B)명의 선수로 이루어진 (A)개 팀에 의해 진행된다.","oko":["(A) 두 / (B) 9","(A) 두 / (B) 11","(A) 세 / (B) 9","(A) 세 / (B) 11","(A) 네 / (B) 5"],"opts":["(A) two / (B) nine","(A) two / (B) eleven","(A) three / (B) nine","(A) three / (B) eleven","(A) four / (B) five"],"r":{"a":"1) (A) two / (B) nine ((A) 두 / (B) 9)","ev":"1번 문장","s":[[1,"The game of baseball is played by two teams of nine players.","야구 경기는 9명의 선수로 이루어진 두 팀에 의해 진행된다."]],"w":"1번에서 야구 경기는 9명(nine)의 선수로 이루어진 두(two) 팀에 의해 진행된다고 해요.","c":1},"h":"5fc8829a47"},{"n":10,"t":"fill","q":"[A], these rules were later [B].","ko":"[A], 이 규칙들은 나중에 [B].","bank":["Fortunately","changed","umpires","spectators","pitch","enforcing"],"bko":{"Fortunately":"다행히도","changed":"바뀌었다","umpires":"심판들","spectators":"관중들","pitch":"투구","enforcing":"시행하는"},"r":{"a":"[A] Fortunatel he Europeans arrived.","마오리족은 유럽인들이 (뉴질랜드에) 도착하기 전에 뉴질랜드에서 살았다."]],"w":"5번 문장에 The Maori lived in New Zealand before the Europeans arrived가 있어요. 유럽인보다 먼저 살았다는 내용과 맞아요.","c":"T"},"h":"746532d3d7"},{"n":2,"t":"tf","q":"In the past, the haka was performed to scare the enemy after a battle.","ko":"과거에 하카는 전투 후에 적을 두렵게 만들기 위해 추어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"In the past, the dance was performed to scare the enemy before a battle.","과거에 이 춤은 전투 전에 적을 겁주기 위해 추어졌다."]],"w":"7번 문장은 전투 전에(before a battle) 적을 겁주기 위해 췄다고 해요. 전투 후라는 말은 틀려요.","c":"F"},"h":"442ead5bf6"},{"n":3,"t":"tf","q":"Today the haka can be seen at weddings and funerals.","ko":"오늘날 하카는 결혼식과 장례식에서 볼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Today you can see the haka at many events, including weddings and funerals.","오늘날 당신은 결혼식과 장례식을 포함한 많은 행사에서 하카 춤을 볼 수 있다."]],"w":"12번 문장에서 오늘날 결혼식과 장례식을 포함한 많은 행사에서 하카를 볼 수 있다고 해요.","c":"T"},"h":"f06cd38794"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the past, the dance was performed to scare the enemy before a battle.)","ko":"과거에 이 춤은 전투 전에 적을 ( ) 위해 추어졌다.","opts":["도와주다","환영하다","겁주다","가르치다"],"word":"scare","r":{"a":"3) 겁주다","ev":"7번 문장","s":[[7,"In the past, the dance was performed to scare the enemy before a battle.","과거에 이 춤은 전투 전에 적을 겁주기 위해 추어졌다."]],"w":"전투 전에 적에게 하는 일이므로 '겁주다'가 알맞아요. 8번에서는 전쟁의 신에게 도움을 구한다고 해서 7번의 목적과 구분돼요.","c":3},"h":"cc5433b649"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The haka is a tradition of the Maori.)","ko":"하카 춤은 마오리족의 ( )이다.","opts":["전통","경기","무기","노래"],"word":"tradition","r":{"a":"1) 전통","ev":"4번 문장","s":[[4,"The haka is a tradition of the Maori.","하카 춤은 마오리족의 전통이다."]],"w":"4번은 하카 춤이 마오리족의 '전통'이라는 뜻이에요. 오래전부터 이어져 온 것이니 tradition = 전통이에요.","c":1},"h":"3ae0092e4b"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was also used to ask the war god for help.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 또한 전쟁의 신에게 도움을 구하는 데 사용되었다.","opts":["전쟁 ],[4,"On the other hand, the viola can be 45 centimeters long.","반면, 비올라는 45센티미터 길이가 될 수 있다."]],"w":"3번에서 바이올린은 대부분 약 35센티미터이고, 4번에서 비올라는 45센티미터까지 될 수 있다고 해요. 항상 더 짧다는 말은 틀려요.","c":"F"},"h":"ea6f9d41f6"},{"n":3,"t":"tf","q":"Violin bows are lighter than viola bows.","ko":"바이올린 활은 비올라 활보다 더 가볍다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Violin bows are lighter than bows for violas.","바이올린 활은 비올라의 활보다 더 가볍다."]],"w":"10번 문장에 Violin bows are lighter than bows for violas가 있어요. 바이올린 활이 더 가볍다는 내용과 맞아요.","c":"T"},"h":"97a51ecbc9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The viola produces a deeper sound than the violin.)","ko":"비올라는 바이올린보다 더 깊은 소리를 ( ).","opts":["만들어 내다","숨기다","줄이다","빌리다"],"word":"produces","r":{"a":"1) 만들어 내다","ev":"7번 문장","s":[[7,"The viola produces a deeper sound than the violin, but not as deep as the cello.","비올라는 바이올린보다 더 깊은 소리를 내지만, 첼로만큼 깊지는 않다."]],"w":"비올라가 소리를 '내는' 내용이에요. 소리를 만들어 낸다는 뜻이므로 produce = 만들어 내다예요.","c":1},"h":"24a6e1cdc7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most violins are around 35 centimeters long.)","ko":"대부분의 바이올린은 ( ) 35센티미터 길이이다.","opts":["정확히","최대","약","최소"],"word":"around","r":{"a":"3) 약","ev":"3번 문장","s":[[3,"Most violins are around 35 centimeters long.","대부분의 바이올린은 약 35센티미터 길이이다."]],"w":"3번은 바이올린 길이가 '약' 35센티미터라는 뜻이에요. around 뒤에 숫자가 오면 '대략, 약'이에요. 4번에서 비올라는 45센티미터까지 될 수 있다고 비교해요.","c":3},"h":"9d56743b81"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHowever, on a viola bow, it has a round shape.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그러나 비올라 활에서 그것은 둥근 모양이다.","opts":["바이올린","비올라","첼로","프로그(손에 잡히는 활의 부분)"],"r":{"a":"4) 프로그(손에 잡히는 활의 부분)","ev":"11~13번 문장","s":[[11,"Furthermore, the part of the bow that is held in the hand, known as the “frog,” is also different.","더욱이, ‘프로그’로 알려진 손에 잡히는 활의 부분도 다르다."],[12,"On a violin bow, the frog is pointy.","바이올린 활에서 프로그는 뾰족하다."],[13,"However, on a viola bow, it has a round shape.","그러나 비올라 활에서 그것은 둥근 모양이다."]],"w":"11번에서 손에 잡히는 활의 부분을 frog라고 한다고 했고, 12번에서 그 모양을 바이올린 활과 설명해요. 13번의 it은 비올라 활의 frog예요.","c":4},"h":"0ce9cd31eb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That places the viola in the middle of the stringed instrument family.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 비올라를 현악기군의 중간에 위치시킨다.","opts":["그 때문에 비올라는 현악기 중 가장 낮은 소리를 내는 악기가 된다.","그 때문에 비올라는 현악기군에 속하지 못한다.","그 때문에 비올라는 현악기 중 가장 높은 소리를 내는 악기가 된다.","그 때문에 비올라는 현악기군에서 중간쯤의 소리를 낸다."],"r":{"a":"4) 그 때문에 비올라는 현악기군에서 중간쯤의 소리를 낸다.","ev":"7~8번 문장","s":[[7,"The viola produces a deeper sound than the violin, but not as deep as the cello.","비올라는 바이올린보다 더 깊은 소리를 내지만, 첼로만큼 깊지는 않다."],[8,"That places the viola in the middle of the stringed instrument family.","그것은 비올라를 현악기군의 중간에 위치시킨다."]],"w":"in the middle of는 '~의 중간에'라는 뜻이에요. 7번에서 비올라는 바이올린보다 깊지만 첼로만큼은 깊지 않으니 현악기군의 중간 위치예요.","c":4},"h":"db90c72d98"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["바이올린과 비올라는 소리가 완전히 똑같다.","바이올린과 비올라의 소리는 서로 다르다.","비올라는 모든 악기 중에서 가장 시끄러운 악기이다.","두 악기 모두 첼로와 같은 소리를 낸다."],"opts":["The violin and the viola sound exactly the same.","The sounds of the violin and the viola are different.","The viola is the loudest instrument of all.","Both instruments make the same sound as the cello."],"r":{"a":"2) The sounds of the violin and the viola are different. (바이올린과 비올라의 소리는 서로 다르다.)","ev":"5번 문장","s":[[5,"The sounds of the two instruments are also different.","두 악기의 소리도 다르다."]],"w":"5번에서 두 악기의 소리도 다르다고 해요. 나머지는 본문에 없거나 본문과 반대되는 내용이에요.","c":2},"h":"edb7a5c183"},{"n":9,"t":"sum","q":"The violin has a very (A) (B).","ko":"바이올린은 매우 (A) (B)을(를) 가지고 있다.","oko":["(A) 높은 / (B) 음조","(A) 높은 / (B) 색깔","(A) 낮은 / (B) 음조","(A) 낮은 / (B) 색깔","(A) 무거운 / (B) 음조"],"opts":["(A) high / (B) pitch","(A) high / (B) color","(A) low / (B) pitch","(A) low / (B) color","(A) heavy / (B) pitch"],"r":{"a":"1) (A) high / (B) pitch ((A) 높은 / (B) 음조)","ev":"6번 문장","s":[[6,"The violin has a very high pitch.","바이올린은 매
