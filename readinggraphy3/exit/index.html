쉬움)이었음.","c":"T"},"h":"bad99fc115"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They wanted their ice cream to look unique…)","ko":"그들은 자신들의 아이스크림이 ___ 보이기를 원했다.","opts":["독특한","평범한","차가운","달콤한"],"word":"unique","r":{"a":"1) 독특한","ev":"2번 문장","s":[[2,"They wanted their ice cream to look unique, so they created these fancy designs by using special metal molds.","그들은 자신들의 아이스크림이 독특해 보이기를 원했고, 그래서 특별한 금속 틀을 사용하여 이런 멋진 디자인을 만들었다."]],"w":"독특한 모양(칠면조, 꽃, 유명한 사람의 머리)으로 아이스크림을 만들려고 특별한 틀을 썼다는 흐름. unique = 독특한. 평범한은 반대 뜻.","c":1},"h":"7732569532"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…it took a lot of time and effort to shape the ice cream.)","ko":"…아이스크림의 모양을 만드는 데 많은 시간과 ___이 들었다.","opts":["속도","노력","재료","기술"],"word":"effort","r":{"a":"2) 노력","ev":"4번 문장","s":[[4,"The ingredients for the ice cream were expensive, and it took a lot of time and effort to shape the ice cream.","아이스크림의 재료는 비쌌고, 아이스크림의 모양을 만드는 데 많은 시간과 노력이 들었다."]],"w":"모양을 만들기 어려워서 많은 시간과 effort가 필요했다는 내용. effort = 노력. 재료(ingredients)는 앞 문장에서 따로 나옴.","c":2},"h":"2ce821038c"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nEveryone loved them because they were easier to eat and clean up.","ko":"밑줄 친 them이 가리키는 것은?","sko":"모든 사람이 그것들을 아주 좋아했는데, 먹고 치우기가 더 쉬웠기 때문이다.","opts":["부유한 사람들","냉장고들","아이스크림콘과 바","금속 틀들"],"r":{"a":"3) 아이스크림콘과 바","ev":"7~8번 문장","s":[[7,"But in the early 20th century, ice cream cones and bars were introduced.","하지만 20세기 초에, 아이스크림콘과 바가 도입되었다."],[8,"Everyone loved them because they were easier to eat and clean up.","모든 사람이 그것들을 아주 좋아했는데, 먹고 치우기가 더 쉬웠기 때문이다."]],"w":"7번에서 아이스크림콘과 바가 도입되었고, 8번의 them은 그것들을 가리킴. 먹고 치우기 쉽다는 설명도 콘과 바에 맞는 말.","c":3},"h":"aee6d56027"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In other words, there was no need to make fancy-shaped ice cream anymore.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다시 말해, 더 이상 멋진 모양의 아이스크림을 만들 필요가 없었다.","opts":["멋진 모양의 아이스크림이 이전보다 더 인기를 얻게 되었다.","더 이상 아이스크림을 만들어서는 안 되었다.","더 이상 아이스크림을 팔 필요가 없었다.","멋진 모양의 아이스크림을 만들어야 할 이유가 더 이상 없었다."],"r":{"a":"4) 멋진 모양의 아이스크림을 만들어야 할 이유가 더 이상 없었다.","ev":"8~10번 문장","s":[[8,"Everyone loved them because they were easier to eat and clean up.","모든 사람이 그것들을 아주 좋아했는데, 먹고 치우기가 더 쉬웠기 때문이다."],[9,"Also, new fridge technology made ice cream easier to store and cheaper.","또한, 새로운 냉장고 기술은 아이스크림을 저장하기 더 쉽고 더 저렴하게 만들었다."],[10,"In other words, there was no need to make fancy-shaped ice cream anymore.","다시 말해, 더 이상 멋진 모양의 아이스크림을 만들 필요가 없었다."]],"w":"there was no need to ~는 ‘~할 필요가 없었다’. 콘과 바가 쉽고 싸졌으니 비싼 모양 아이스크림을 만들 필요가 사라졌다는 뜻.","c":4},"h":"e99a763d19"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["아이스크림은 플라스틱 틀로 모양을 만들었다.","아이스크림콘과 바는 20세기 초에 도입되었다.","틀로 찍어 낸 아이스크림은 만들기가 쉽고 저렴했다.","새로운 냉장고 기술은 아이스크림 저장을 더 어렵게 만들었다."],"opts":["Ice cream was shaped by plastic molds.","Ice cream cones and bars were introduced in the early 20th century.","Molded ice creams were easy and cheap to make.","New fridge technology made ice cream harder to store."],"r":{"a":"2) Ice cream cones and bars were introduced in the early 20th century.","ev":"2번, 4번, 7번, 9번 문장","s":[[2,"They wanted their ice cream to look unique, so they created these fancy designs by using special metal molds.","그들은 자신들의 아이스크림이 독특해 보이기를 원했고, 그래서 특별한 금속 틀을 사용하여 이런 멋진 디자인을 만들었다."],[4,"The ingredients for the ice cream were expensive, and it took a lot of time and effort to shape the ice cream.","아이스크림의 재료는 비쌌고, 아이스크림의 모양을 만드는 데 많은 시간과 노력이 들었다."],[7,"But in the early 20th century, ice cream cones and bars were introduced.","하지만 20세기 초에, 아이스크림콘과 바가 도입되었다."],[9,"Also, new fridge technology made ice cream easier to store and cheaper.","또한, 새로운 냉장고 기술은 아이스크림을 저장하기 더 쉽고 더 저렴하게 만들었다."]],"w":"7번 But in the early 20th century, ice cream cones and bars were introduced와 일치. 2번은 금속 틀, 4번은 재료가 비싸고 만들기 어려웠음, 9번은 저장이 더 쉬워졌다고 함.","c":2},"h":"0f0dc15a4f"},{"n":9,"t":"sum","q":"Ice cream cones and bars were (A) to eat and clean up, and new fridge technology made ice cream easier to store and (B).","ko":"아이스크림콘과 바는 먹고 치우기가 (A), 새 냉장고 기술은 아이스크림을 저장하기 더 쉽고 (B) 만들었다.","oko":["(A) 더 어려웠고 / (B) 더 저렴하게","(A) 더 쉬웠고 / (B) 더 비싸게","(A) 더 어려웠고 / (B) 더 비싸게","(A) 더 빨랐고 / (B) 더 무겁게","(A) 더 쉬웠고 / (B) 더 저렴하게"],"opts":["(A) harder / (B) cheaper","(A) easier / (B) more expensive","(A) harder / (B) more expensive","(A) faster / (B) heavier","(A) easier / (B) cheaper"],"r":{"a":"5) (A) easier / (B) cheaper","ev":"8~9번 문장","s":[[8,"Everyone loved them because they were easier to eat and clean up.","모든 사람이 그것들을 아주 좋아했는데, 먹고 치우기가 더 쉬웠기 때문이다."],[9,"Also, new fridge technology made ice cream easier to store and cheaper.","또한, 새로운 냉장고 기술은 아이스크림을 저장하기 더 쉽고 더 저렴하게 만들었다."]],"w":"8번 easier to eat and clean up, 9번 easier to store and cheaper. 그래서 (A) easier, (B) cheaper.","c":5},"h":"13f4dd4b57"},{"n":10,"t":"fill","q":"Molded ice cream needed [A] ingredients and a lot of effort to [B] it, so mainly wealthy people enjoyed it.","ko":"틀로 찍어 낸 아이스크림은 [A] 재료와 많은 노력이 필요했고 모양을 [B] 데도 힘이 들어서 주로 부유한 사람들이 즐겼다.","bank":["expensive","shape","cheaper","melting","introduced","wealthy"],"bko":{"expensive":"비싼","shape":"모양을 만들다","cheaper":"더 저렴한","melting":"녹는 것","wealthy":"부유한","introduced":"도입했다"},"r":{"a":"[A] expensive, [B] shape","ev":"4~6번 문장","s":[[4,"The ingredients for the ice cream were expensive, and it took a lot of time and effort to shape the ice cream.","아이스크림의 재료는 비쌌고, 아이스크림의 모양을 만드는 데 많은 시간과 노력이 들었다."],[5,"Keeping it from melting was also not easy.","그것이 녹지 않게 하는 것도 쉽지 않았다."],[6,"So, these desserts were mainly enjoyed by wealthy people at expensive restaurants and dinner parties.","그래서, 이 디저트는 주로 비싼 식당과 저녁 파티에서 부유한 사람들이 즐겼다."]],"w":"4번 ingredients were expensive, it took a lot of time and effort to shape the ice cream에서 가져옴. cheaper는 20세기 초의 이야기(9번)라서 ‘부유한 사람들만 즐겼다’와 맞지 않고, 나머지 단어는 두 빈칸에 말이 되지 않음.","c":null},"h":"27768dbc30"}]},{"u":9,"id":"rg3-09-1","no":1,"ko":"침이 맛을 바꾼다고? 브로콜리의 비밀","items":[{"n":1,"t":"tf","q":"Saliva is 99 percent water, but it has a big effect on how things taste.","ko":"침은 99퍼센트가 물이지만 음식이 어떤 맛이 나는지에 큰 영향을 미친다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Though it is 99 percent water, it has a big effect on how things taste.","비록 99퍼센트가 물이지만, 침은 음식이 어떤 맛이 나는지에 큰 영향을 미친다."]],"w":"2번 문장 Though it is 99 percent water, it has a big effect on how things taste와 일치. Though(비록 ~이지만) 앞뒤가 대조됨.","c":"T"},"h":"69d005d87c"},{"n":2,"t":"tf","q":"When rats were fed bitter food, their saliva did not change.","ko":"쥐들에게 쓴 음식을 먹였을 때 쥐들의 침은 변하지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In an experiment, when rats were fed bitter food, their saliva changed, and they started to accept the taste.","한 실험에서, 쥐들에게 쓴 음식을 먹였을 때 쥐들의 침이 변했고, 쥐들은 그 맛을 받아들이기 시작했다."]],"w":"5번에서 쓴 음식을 먹은 쥐들의 침이 changed(변했다)고 함. 변하지 않았다는 말은 반대.","c":"F"},"h":"c49ea4983b"},{"n":3,"t":"tf","q":"Researchers hope to make healthy foods taste better by studying saliva and food.","ko":"연구자들은 침과 음식을 연구해서 건강에 좋은 음식이 더 맛있어지게 만들기를 바란다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Researchers hope to make healthy foods taste better by studying these interactions between saliva and food.","연구자들은 침과 음식 사이의 이러한 상호작용을 연구함으로써 건강에 좋은 음식이 더 맛있어지게 만들기를 바란다."]],"w":"9번 문장 Researchers hope to make healthy foods taste better by studying these interactions between saliva and food와 일치.","c":"T"},"h":"816358aea0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It mixes with food and allows us to taste sweet, salty, or sour flavors.)","ko":"침은 음식과 섞여서 우리가 단맛, 짠맛, 신맛을 느끼는 것을 ___.","opts":["막는다","가능하게 해 준다","요구한다","잊게 한다"],"word":"allows","r":{"a":"2) 가능하게 해 준다","ev":"3번 문장","s":[[3,"It mixes with food and allows us to taste sweet, salty, or sour flavors.","침은 음식과 섞여서 우리가 단맛, 짠맛, 또는 신맛을 느낄 수 있게 해 준다."]],"w":"allow A to v는 ‘A가 ~하게 해 준다’. 침이 음식과 섞여서 우리가 맛을 느낄 수 있게 해 준다는 뜻.","c":2},"h":"e38e08618e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…when rats were fed bitter food, their saliva changed…)","ko":"쥐들에게 ___ 음식을 먹였을 때, 쥐들의 침이 변했다.","opts":["달콤한","짠","쓴","신"],"word":"bitter","r":{"a":"3) 쓴","ev":"3번, 5번 문장","s":[[3,"It mixes with food and allows us to taste sweet, salty, or sour flavors.","침은 음식과 섞여서 우리가 단맛, 짠맛, 또는 신맛을 느낄 수 있게 해 준다."],[5,"In an experiment, when rats were fed bitter food, their saliva changed, and they started to accept the taste.","한 실험에서, 쥐들에게 쓴 음식을 먹였을 때 쥐들의 침이 변했고, 쥐들은 그 맛을 받아들이기 시작했다."]],"w":"3번에 단맛(sweet)·짠맛(salty)·신맛(sour)이 따로 나오므로 bitter는 그 세 가지가 아닌 ‘쓴’. 쓴 음식을 먹은 쥐의 침이 변했고(5번), 쥐들은 그 맛을 받아들이기 시작했다.","c":3},"h":"d29aeefbad"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIn an experiment, when rats were fed bitter food, their saliva changed, and they started to accept the taste.","ko":"밑줄 친 they가 가리키는 것은?","sko":"한 실험에서, 쥐들에게 쓴 음식을 먹였을 때 쥐들의 침이 변했고, 쥐들은 그 맛을 받아들이기 시작했다.","opts":["연구자들","쓴 음식들","침들","쥐들"],"r":{"a":"4) 쥐들","ev":"5~6번 문장","s":[[5,"In an experiment, when rats were fed bitter food, their saliva changed, and they started to accept the taste.","한 실험에서, 쥐들에게 쓴 음식을 먹였을 때 쥐들의 침이 변했고, 쥐들은 그 맛을 받아들이기 시작했다."],[6,"Of course, rats aren’t people.","물론, 쥐는 사람이 아니다."]],"w":"their saliva의 their는 쥐들(rats)이고, and they started to accept the taste의 they도 같은 쥐들. 6번에서도 rats aren’t people이라고 이어짐.","c":4},"h":"9b5059ee32"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For example, if you eat broccoli all the time, broccoli won’t taste bad to you!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"예를 들어, 브로콜리를 항상 먹는다면, 브로콜리는 여러분에게 맛이 나쁘지 않을 것이다!","opts":["브로콜리를 늘 먹으면, 그 맛이 나쁘게 느껴지지 않을 것이다.","브로콜리를 한 번만 먹어도 평생 맛이 나쁘지 않을 것이다.","브로콜리를 항상 먹으면 침이 나오지 않을 것이다.","브로콜리는 먹을수록 맛이 더 나빠질 것이다."],"r":{"a":"1) 브로콜리를 늘 먹으면, 그 맛이 나쁘게 느껴지지 않을 것이다.","ev":"7~8번 문장","s":[[7,"But researchers think our saliva works in a similar way.","하지만 연구자들은 우리의 침도 비슷한 방식으로 작용한다고 생각한다."],[8,"For example, if you eat broccoli all the time, broccoli won’t taste bad to you!","예를 들어, 브로콜리를 항상 먹는다면, 브로콜리는 여러분에게 맛이 나쁘지 않을 것이다!"]],"w":"all the time은 ‘항상’, won’t taste bad는 ‘맛이 나쁘지 않을 것이다’. 7번의 연구자들 생각(침이 비슷하게 작용)에 대한 예시임.","c":1},"h":"4d96044504"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["침은 대부분 기름으로 이루어져 있다.","우리가 무엇을 먹든 침은 항상 똑같다.","한 실험에서 쥐들이 쓴 음식의 맛을 받아들이기 시작했다.","연구자들은 쥐와 사람이 똑같다고 말한다."],"opts":["Saliva is mostly made of oil.","Saliva stays the same no matter what we eat.","In an experiment, rats started to accept the taste of bitter food.","Researchers say rats are the same as people."],"r":{"a":"3) In an experiment, rats started to accept the taste of bitter food.","ev":"2번, 4~7번 문장","s":[[2,"Though it is 99 percent water, it has a big effect on how things taste.","비록 99퍼센트가 물이지만, 침은 음식이 어떤 맛이 나는지에 큰 영향을 미친다."],[4,"Moreover, saliva changes depending on what we eat.","게다가, 침은 우리가 먹는 것에 따라 변한다."],[5,"In an experiment, when rats were fed bitter food, their saliva changed, and they started to accept the taste.","한 실험에서, 쥐들에게 쓴 음식을 먹였을 때 쥐들의 침이 변했고, 쥐들은 그 맛을 받아들이기 시작했다."],[6,"Of course, rats aren’t people.","물론, 쥐는 사람이 아니다."],[7,"But researchers think our saliva works in a similar way.","하지만 연구자들은 우리의 침도 비슷한 방식으로 작용한다고 생각한다."]],"w":"5번 쥐들이 쓴 음식의 맛을 받아들이기 시작했다는 내용이 일치. 2번 침은 99%가 물, 4번 침은 먹는 것에 따라 변함, 6번 쥐는 사람이 아님.","c":3},"h":"348c68ab59"},{"n":9,"t":"sum","q":"When rats were fed bitter food, their saliva (A), and they started to (B) the taste.","ko":"쥐들에게 쓴 음식을 먹였을 때 쥐들의 침이 (A), 쥐들은 그 맛을 (B) 시작했다.","oko":["(A) 그대로였고 / (B) 받아들이기","(A) 변했고 / (B) 거부하기","(A) 변했고 / (B) 받아들이기","(A) 사라졌고 / (B) 받아들이기","(A) 그대로였고 / (B) 거부하기"],"opts":["(A) stayed the same / (B) accept","(A) changed / (B) refuse","(A) changed / (B) accept","(A) disappeared / (B) accept","(A) stayed the same / (B) refuse"],"r":{"a":"3) (A) changed / (B) accept","ev":"5번 문장","s":[[5,"In an experiment, when rats were fed bitter food, their saliva changed, and they started to accept the taste.","한 실험에서, 쥐들에게 쓴 음식을 먹였을 때 쥐들의 침이 변했고, 쥐들은 그 맛을 받아들이기 시작했다."]],"w":"5번 문장 their saliva changed, and they started to accept the taste. 침은 변했고(changed) 맛을 받아들였다(accept).","c":3},"h":"b1b5895fff"},{"n":10,"t":"fill","q":"Saliva [A] with food and allows us to taste, and it [B] depending on what we eat.","ko":"침은 음식과 [A] 우리가 맛을 느끼게 해 주고, 우리가 먹는 것에 따라 [B].","bank":["mixes","changes","tastes","accepts","encourages","studies"],"bko":{"mixes":"섞이다","changes":"변하다","tastes":"맛이 나다","accepts":"받아들이다","studies":"연구하다","encourages":"장려하다"},"r":{"a":"[A] mixes, [B] changes","ev":"3~4번 문장","s":[[3,"It mixes with food and allows us to taste sweet, salty, or sour flavors.","침은 음식과 섞여서 우리가 단맛, 짠맛, 또는 신맛을 느낄 수 있게 해 준다."],[4,"Moreover, saliva changes depending on what we eat.","게다가, 침은 우리가 먹는 것에 따라 변한다."]],"w":"3번 It mixes with food and allows us to taste, 4번 saliva changes depending on what we eat에서 가져옴. accepts는 5번에서 쥐가 맛을 받아들인다는 말이라 침이 주어인 이 문장에 맞지 않고, 나머지 단어도 두 빈칸에 말이 되지 않음.","c":null},"h":"8f340d75ea"}]},{"u":9,"id":"rg3-09-2","no":2,"ko":"번개를 레이저로 길들일 수 있을까?","items":[{"n":1,"t":"tf","q":"Metal lightning rods only work for small areas, not large places like airports.","ko":"금속 피뢰침은 공항 같은 넓은 곳이 아니라 좁은 지역에서만 작동한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"We still use metal lightning rods on buildings today, but they only work for small areas, not large places like airports.","우리는 오늘날에도 건물에 금속 피뢰침을 사용하지만, 그것은 공항 같은 넓은 곳이 아니라 좁은 지역에서만 작동한다."]],"w":"3번 문장 they only work for small areas, not large places like airports와 일치. 이것이 새 아이디어가 필요한 이유(4번).","c":"T"},"h":"bd3642147f"},{"n":2,"t":"tf","q":"Scientists have tested the laser lightning rod only inside a lab.","ko":"과학자들은 레이저 피뢰침을 실험실 안에서만 실험해 왔다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"Before, some studies said lasers might change the path of lightning, but they only tested this inside a lab.","이전에, 일부 연구들은 레이저가 번개의 경로를 바꿀지도 모른다고 말했지만, 그들은 이것을 실험실 안에서만 실험했다."],[7,"Recently, they tried this idea outside, and the laser lightning rod actually changed the path of some lightning strikes!","최근에, 그들은 이 아이디어를 밖에서 시도했고, 레이저 피뢰침은 실제로 일부 번개의 경로를 바꾸었다!"]],"w":"6번에서 이전 연구들은 실험실 안에서만 실험했지만, 7번에서 최근에는 밖에서 시도해 일부 번개의 경로를 바꿨다고 함.","c":"F"},"h":"bd2b37e732"},{"n":3,"t":"tf","q":"Scientists hope to make the laser device cheaper.","ko":"과학자들은 레이저 장치를 더 저렴하게 만들기를 바란다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"In addition, they hope to make the laser device cheaper.","또한, 그들은 레이저 장치를 더 저렴하게 만들기를 바란다."]],"w":"9번 문장 they hope to make the laser device cheaper와 일치.","c":"T"},"h":"e1b9369f36"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Now, scientists are trying to use lasers instead.)","ko":"이제, 과학자들은 ___ 레이저를 사용하려고 노력하고 있다.","opts":["대신에","함께","갑자기","다시"],"word":"instead","r":{"a":"1) 대신에","ev":"1~2번 문장","s":[[1,"Benjamin Franklin invented the lightning rod to protect people from lightning.","벤저민 프랭클린은 사람들을 번개로부터 보호하기 위해 피뢰침을 발명했다."],[2,"Now, scientists are trying to use lasers instead.","이제, 과학자들은 대신 레이저를 사용하려고 노력하고 있다."]],"w":"1번에서 프랭클린이 피뢰침(금속)을 발명했고, 2번에서 과학자들은 레이저를 쓰려고 함. 금속 피뢰침 ‘대신에’ 레이저를 쓰려는 것이므로 instead = 대신에.","c":1},"h":"82a0213929"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…scientists want to guide lightning across broad areas with lasers.)","ko":"…과학자들은 레이저로 넓은 지역에 걸쳐 번개를 ___ 싶어 한다.","opts":["막고","만들고","유도하고","측정하고"],"word":"guide","r":{"a":"3) 유도하고","ev":"8번 문장","s":[[8,"Next, scientists want to guide lightning across broad areas with lasers.","다음으로, 과학자들은 레이저로 넓은 지역에 걸쳐 번개를 유도하고 싶어 한다."]],"w":"레이저를 큰 움직이는 피뢰침처럼 써서(5번) 번개가 가는 길을 바꾸는 것이 목표. guide = 이끌다, 유도하다.","c":3},"h":"22b2607d18"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nBefore, some studies said lasers might change the path of lightning, but they only tested this inside a lab.","ko":"밑줄 친 this가 가리키는 것은?","sko":"이전에, 일부 연구들은 레이저가 번개의 경로를 바꿀지도 모른다고 말했지만, 그들은 이것을 실험실 안에서만 실험했다.","opts":["레이저가 번개의 경로를 바꿀 수 있다는 것","금속 피뢰침이 건물에 쓰인다는 것","번개가 공항에 떨어진다는 것","레이저 장치가 비싸다는 것"],"r":{"a":"1) 레이저가 번개의 경로를 바꿀 수 있다는 것","ev":"6번 문장","s":[[6,"Before, some studies said lasers might change the path of lightning, but they only tested this inside a lab.","이전에, 일부 연구들은 레이저가 번개의 경로를 바꿀지도 모른다고 말했지만, 그들은 이것을 실험실 안에서만 실험했다."]],"w":"but 앞에서 lasers might change the path of lightning이라고 했고, 그 아이디어를 실험실 안에서만 실험했다는 뜻. this = 레이저가 번개의 경로를 바꿀 수 있다는 것.","c":1},"h":"1db206193b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why scientists have a new idea to keep us safe from lightning.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 과학자들이 번개로부터 우리를 안전하게 지켜 줄 새로운 아이디어를 가지고 있는 이유이다.","opts":["과학자들이 번개로부터 안전해서 새로운 아이디어를 낸다.","그래서 과학자들은 번개를 안전하게 보관하려고 한다.","새로운 아이디어 덕분에 번개가 안전해졌다.","그래서 과학자들은 우리를 번개로부터 안전하게 지킬 새로운 아이디어를 가지고 있다."],"r":{"a":"4) 그래서 과학자들은 우리를 번개로부터 안전하게 지킬 새로운 아이디어를 가지고 있다.","ev":"3~4번 문장","s":[[3,"We still use metal lightning rods on buildings today, but they only work for small areas, not large places like airports.","우리는 오늘날에도 건물에 금속 피뢰침을 사용하지만, 그것은 공항 같은 넓은 곳이 아니라 좁은 지역에서만 작동한다."],[4,"That’s why scientists have a new idea to keep us safe from lightning.","그것이 과학자들이 번개로부터 우리를 안전하게 지켜 줄 새로운 아이디어를 가지고 있는 이유이다."]],"w":"keep us safe from lightning은 ‘우리를 번개로부터 안전하게 지키다’. That’s why는 앞 3번(금속 피뢰침의 한계)이 이유라는 뜻.","c":4},"h":"0e3c5cd336"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["금속 피뢰침은 공항 같은 넓은 곳에서 잘 작동한다.","레이저 피뢰침은 밖에서 일부 번개의 경로를 바꾸었다.","벤저민 프랭클린은 레이저 장치를 발명했다.","과학자들은 이미 레이저 장치를 아주 저렴하게 만들었다."],"opts":["Metal lightning rods work well in large places like airports.","The laser lightning rod changed the path of some lightning strikes outside.","Benjamin Franklin invented the laser device.","Scientists have already made the laser device very cheap."],"r":{"a":"2) The laser lightning rod changed the path of some lightning strikes outside.","ev":"1번, 3번, 7번, 9번 문장","s":[[1,"Benjamin Franklin invented the lightning rod to protect people from lightning.","벤저민 프랭클린은 사람들을 번개로부터 보호하기 위해 피뢰침을 발명했다."],[3,"We still use metal lightning rods on buildings today, but they only work for small areas, not large places like airports.","우리는 오늘날에도 건물에 금속 피뢰침을 사용하지만, 그것은 공항 같은 넓은 곳이 아니라 좁은 지역에서만 작동한다."],[7,"Recently, they tried this idea outside, and the laser lightning rod actually changed the path of some lightning strikes!","최근에, 그들은 이 아이디어를 밖에서 시도했고, 레이저 피뢰침은 실제로 일부 번개의 경로를 바꾸었다!"],[9,"In addition, they hope to make the laser device cheaper.","또한, 그들은 레이저 장치를 더 저렴하게 만들기를 바란다."]],"w":"7번이 일치. 3번 금속 피뢰침은 넓은 곳에서 안 되고, 1번 프랭클린이 발명한 것은 피뢰침이며, 9번 장치를 더 저렴하게 만들기를 ‘바라는’ 중임.","c":2},"h":"6243779e62"},{"n":9,"t":"sum","q":"Scientists tested a (A) lightning rod outside, and it actually (B) the path of some lightning strikes.","ko":"과학자들은 (A) 피뢰침을 밖에서 실험했고, 그것은 실제로 일부 번개의 경로를 (B).","oko":["(A) 금속 / (B) 바꾸었다","(A) 레이저 / (B) 막았다","(A) 금속 / (B) 막았다","(A) 레이저 / (B) 멈췄다","(A) 레이저 / (B) 바꾸었다"],"opts":["(A) metal / (B) changed","(A) laser / (B) blocked","(A) metal / (B) blocked","(A) laser / (B) stopped","(A) laser / (B) changed"],"r":{"a":"5) (A) laser / (B) changed","ev":"5~7번 문장","s":[[5,"Scientists decided to test if a laser beam pointed at the sky could work like a big, movable lightning rod.","과학자들은 하늘을 향한 레이저 빔이 거대하고 움직일 수 있는 피뢰침처럼 작동할 수 있는지 실험해 보기로 결정했다."],[6,"Before, some studies said lasers might change the path of lightning, but they only tested this inside a lab.","이전에, 일부 연구들은 레이저가 번개의 경로를 바꿀지도 모른다고 말했지만, 그들은 이것을 실험실 안에서만 실험했다."],[7,"Recently, they tried this idea outside, and the laser lightning rod actually changed the path of some lightning strikes!","최근에, 그들은 이 아이디어를 밖에서 시도했고, 레이저 피뢰침은 실제로 일부 번개의 경로를 바꾸었다!"]],"w":"5번에서 레이저 빔을 피뢰침처럼 실험하기로 했고, 7번 the laser lightning rod actually changed the path of some lightning strikes. (A) laser, (B) changed.","c":5},"h":"5da317f1f1"},{"n":10,"t":"fill","q":"Scientists want to guide lightning across [A] areas with lasers, and they also hope to make the laser device [B].","ko":"과학자들은 레이저로 [A] 지역에 걸쳐 번개를 유도하고 싶어 하고, 레이저 장치도 [B] 만들기를 바란다.","bank":["broad","cheaper","instead","inside","recently","airport"],"bko":{"broad":"넓은","cheaper":"더 저렴한","instead":"대신에","inside":"안에","recently":"최근에","airport":"공항"},"r":{"a":"[A] broad, [B] cheaper","ev":"8~9번 문장","s":[[8,"Next, scientists want to guide lightning across broad areas with lasers.","다음으로, 과학자들은 레이저로 넓은 지역에 걸쳐 번개를 유도하고 싶어 한다."],[9,"In addition, they hope to make the laser device cheaper.","또한, 그들은 레이저 장치를 더 저렴하게 만들기를 바란다."]],"w":"8번 guide lightning across broad areas, 9번 make the laser device cheaper에서 가져옴. instead, inside, recently, airport는 두 빈칸에 넣으면 말이 되지 않음.","c":null},"h":"f8f3aae59f"}]},{"u":9,"id":"rg3-09-3","no":3,"ko":"영국 빵집의 최고 손님은 사람이 아니었다?","items":[{"n":1,"t":"tf","q":"In the Middle Ages, people ate about 1.3 kilograms of bread a day.","ko":"중세 시대에 사람들은 하루에 약 1.3킬로그램의 빵을 먹었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In the Middle Ages, people ate a lot of bread — about 1.3 kilograms a day.","중세 시대에, 사람들은 하루에 약 1.3킬로그램의 많은 빵을 먹었다."]],"w":"2번 문장 In the Middle Ages, people ate a lot of bread — about 1.3 kilograms a day와 일치.","c":"T"},"h":"f6c3f1eca2"},{"n":2,"t":"tf","q":"Horse bread was the same as the white bread people ate.","ko":"horse bread는 사람들이 먹던 하얀 빵과 같았다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"They were fed a flat, brown bread called horse bread, which was different from the white bread people ate.","말들은 horse bread라고 불리는 납작한 갈색 빵을 먹었는데, 그것은 사람들이 먹던 하얀 빵과는 달랐다."]],"w":"4번에서 horse bread는 flat, brown bread이고 사람들이 먹던 white bread와 다르다(different from)고 함.","c":"F"},"h":"f651b7fe43"},{"n":3,"t":"tf","q":"Horse bread was cheap and easy to carry.","ko":"horse bread는 값싸고 나르기 쉬웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It was cheap, easy to carry and also good for the horses.","그것은 싸고, 나르기 쉬웠으며, 말들에게도 좋았다."]],"w":"6번 문장 It was cheap, easy to carry and also good for the horses와 일치.","c":"T"},"h":"6a4defde35"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…by using leftovers from the bakery.)","ko":"…빵집에서 나온 ___을 이용해서.","opts":["새 재료","남은 음식","빈 그릇","비싼 밀가루"],"word":"leftovers","r":{"a":"2) 남은 음식","ev":"5~6번 문장","s":[[5,"This special horse bread was made for working horses by using leftovers from the bakery.","이 특별한 horse bread는 빵집의 남은 음식을 이용해서 일하는 말들을 위해 만들어졌다."],[6,"It was cheap, easy to carry and also good for the horses.","그것은 싸고, 나르기 쉬웠으며, 말들에게도 좋았다."]],"w":"horse bread를 만든 재료가 빵집에서 나온 것인데, 6번에서 값이 싸다고 함. ‘남은 음식’으로 만들었으니 값이 쌌다는 흐름.","c":2},"h":"fa26ae1001"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…they replaced horses for carrying people or heavy things.)","ko":"…철도는 사람이나 무거운 물건을 나르는 일에서 말을 ___.","opts":["도왔다","막았다","대신했다","만들었다"],"word":"replaced","r":{"a":"3) 대신했다","ev":"9~10번 문장","s":[[9,"However, when the first railways opened in England in 1830, they replaced horses for carrying people or heavy things.","하지만 1830년 영국에서 첫 철도가 개통되었을 때, 철도는 사람이나 무거운 물건을 나르는 일에서 말을 대신했다."],[10,"So, horses didn’t need to work as much and finally stopped eating horse bread.","그래서 말들은 그만큼 일할 필요가 없어졌고 마침내 horse bread를 먹는 것을 멈췄다."]],"w":"9번에서 철도가 말을 replace했고, 10번에서 말이 그만큼 일할 필요가 없게 되었다고 함. replace = 대신하다, 대체하다.","c":3},"h":"1090a1d581"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen they had to carry people and things across the country, their owners didn’t have to feed them huge amounts of grain and grass.","ko":"밑줄 친 them이 가리키는 것은?","sko":"말들이 사람과 물건을 싣고 전국을 가로질러 가야 할 때, 말의 주인들은 말들에게 엄청난 양의 곡물과 풀을 먹일 필요가 없었다.","opts":["말들","사람들과 물건들","곡물과 풀","제빵사들"],"r":{"a":"1) 말들","ev":"7~8번 문장","s":[[7,"It provided them with the energy needed for their hard work.","그것은 말들에게 힘든 일에 필요한 에너지를 제공해 주었다."],[8,"When they had to carry people and things across the country, their owners didn’t have to feed them huge amounts of grain and grass.","말들이 사람과 물건을 싣고 전국을 가로질러 가야 할 때, 말의 주인들은 말들에게 엄청난 양의 곡물과 풀을 먹일 필요가 없었다."]],"w":"8번의 they는 말들이고, their owners는 말의 주인들. 주인이 먹이는 대상 them도 말들임. 7번에서 horse bread가 말들에게 에너지를 주었다는 내용과 이어짐.","c":1},"h":"2a44e8422f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, horses didn’t need to work as much and finally stopped eating horse bread.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 말들은 그만큼 일할 필요가 없어졌고 마침내 horse bread를 먹는 것을 멈췄다.","opts":["말들이 일을 더 열심히 하게 되어서 horse bread를 더 많이 먹었다.","말들이 horse bread를 먹지 않아서 일을 덜 하게 되었다.","말들은 일을 덜 하게 되었지만 horse bread를 계속 먹었다.","말들은 그만큼 일할 필요가 없어졌고 결국 horse bread를 먹지 않게 되었다."],"r":{"a":"4) 말들은 그만큼 일할 필요가 없어졌고 결국 horse bread를 먹지 않게 되었다.","ev":"9~10번 문장","s":[[9,"However, when the first railways opened in England in 1830, they replaced horses for carrying people or heavy things.","하지만 1830년 영국에서 첫 철도가 개통되었을 때, 철도는 사람이나 무거운 물건을 나르는 일에서 말을 대신했다."],[10,"So, horses didn’t need to work as much and finally stopped eating horse bread.","그래서 말들은 그만큼 일할 필요가 없어졌고 마침내 horse bread를 먹는 것을 멈췄다."]],"w":"9번에서 철도가 말을 대신했으므로 말은 일이 줄었고(didn’t need to work as much), 그 결과(So) horse bread를 먹는 것을 멈췄음. 일이 줄어서 안 먹게 된 것이지 안 먹어서 일이 준 것이 아님.","c":4},"h":"e0eba8cfff"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["중세 시대에 말은 사람보다 빵을 더 적게 먹었다.","horse bread는 사람들이 먹던 하얀 빵으로 만들어졌다.","horse bread는 빵집의 남은 음식으로 만들어졌다.","영국에서 첫 철도는 1930년에 개통되었다."],"opts":["In the Middle Ages, horses ate less bread than people.","Horse bread was made from the white bread people ate.","Horse bread was made by using leftovers from the bakery.","The first railways in England opened in 1930."],"r":{"a":"3) Horse bread was made by using leftovers from the bakery.","ev":"2~5번, 9번 문장","s":[[2,"In the Middle Ages, people ate a lot of bread — about 1.3 kilograms a day.","중세 시대에, 사람들은 하루에 약 1.3킬로그램의 많은 빵을 먹었다."],[3,"But horses ate even more!","하지만 말들은 훨씬 더 많이 먹었다!"],[4,"They were fed a flat, brown bread called horse bread, which was different from the white bread people ate.","말들은 horse bread라고 불리는 납작한 갈색 빵을 먹었는데, 그것은 사람들이 먹던 하얀 빵과는 달랐다."],[5,"This special horse bread was made for working horses by using leftovers from the bakery.","이 특별한 horse bread는 빵집의 남은 음식을 이용해서 일하는 말들을 위해 만들어졌다."],[9,"However, when the first railways opened in England in 1830, they replaced horses for carrying people or heavy things.","하지만 1830년 영국에서 첫 철도가 개통되었을 때, 철도는 사람이나 무거운 물건을 나르는 일에서 말을 대신했다."]],"w":"5번 horse bread was made … by using leftovers from the bakery와 일치. 3번에서 말이 더 많이 먹었고, 4번에서 horse bread는 하얀 빵과 다르며, 9번 철도는 1830년에 개통됨.","c":3},"h":"4d3b1d3820"},{"n":9,"t":"sum","q":"Horse bread gave horses (A) for hard work, so owners didn’t have to feed them huge amounts of (B).","ko":"horse bread는 말들에게 힘든 일을 위한 (A)를 주었고, 그래서 주인들은 말들에게 엄청난 양의 (B)를 먹일 필요가 없었다.","oko":["(A) 에너지 / (B) 하얀 빵","(A) 물 / (B) 곡물과 풀","(A) 에너지 / (B) 곡물과 풀","(A) 휴식 / (B) 하얀 빵","(A) 잠 / (B) 빵"],"opts":["(A) energy / (B) white bread","(A) water / (B) grain and grass","(A) energy / (B) grain and grass","(A) rest / (B) white bread","(A) sleep / (B) bread"],"r":{"a":"3) (A) energy / (B) grain and grass","ev":"7~8번 문장","s":[[7,"It provided them with the energy needed for their hard work.","그것은 말들에게 힘든 일에 필요한 에너지를 제공해 주었다."],[8,"When they had to carry people and things across the country, their owners didn’t have to feed them huge amounts of grain and grass.","말들이 사람과 물건을 싣고 전국을 가로질러 가야 할 때, 말의 주인들은 말들에게 엄청난 양의 곡물과 풀을 먹일 필요가 없었다."]],"w":"7번 horse bread가 힘든 일에 필요한 에너지(energy)를 제공했고, 8번 주인들이 곡물과 풀(grain and grass)을 엄청나게 먹일 필요가 없었음.","c":3},"h":"a16b9964b7"},{"n":10,"t":"fill","q":"When the first [A] opened in England in 1830, horses didn’t need to work as much and stopped eating horse [B].","ko":"1830년 영국에서 첫 [A]가 개통되자, 말들은 그만큼 일할 필요가 없어졌고 horse [B]를 먹는 것을 멈췄다.","bank":["railways","bread","across","huge","customers","energy"],"bko":{"railways":"철도","bread":"빵","across":"가로질러","huge":"엄청난","customers":"고객","energy":"에너지"},"r":{"a":"[A] railways, [B] bread","ev":"9~10번 문장","s":[[9,"However, when the first railways opened in England in 1830, they replaced horses for carrying people or heavy things.","하지만 1830년 영국에서 첫 철도가 개통되었을 때, 철도는 사람이나 무거운 물건을 나르는 일에서 말을 대신했다."],[10,"So, horses didn’t need to work as much and finally stopped eating horse bread.","그래서 말들은 그만큼 일할 필요가 없어졌고 마침내 horse bread를 먹는 것을 멈췄다."]],"w":"9번 when the first railways opened in England in 1830, 10번 stopped eating horse bread에서 가져옴. across, huge, customers, energy는 두 빈칸에 넣으면 말이 되지 않음.","c":null},"h":"c8e54f85d6"}]},{"u":10,"id":"rg3-10-1","no":1,"ko":"갈등이 생기면 나는 거북이? 상어? 올빼미?","items":[{"n":1,"t":"tf","q":"Turtles run away from problems.","ko":"거북이들은 문제를 피해 도망간다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장에 Turtles run away from problems가 그대로 나옴. run away from은 '~에서 도망치다'.","c":"T","ev":"4번 문장","s":[[4,"Turtles run away from problems.","거북이들은 문제를 피해 도망간다."]]},"h":"442678c93d"},{"n":2,"t":"tf","q":"Teddy bears give up their relationships to keep their goals.","ko":"곰 인형들은 자신의 목표를 지키기 위해 관계를 포기한다.","r":{"a":"F (본문과 다른 내용)","w":"7번에서 곰 인형은 관계를 지키려고 자기 목표를 포기함(give up their goals to keep their relationships). 목표와 관계가 서로 바뀐 진술이라 F.","c":"F","ev":"7번 문장","s":[[7,"Teddy bears give up their goals to keep their relationships.","곰 인형들은 관계를 지키기 위해 자신의 목표를 포기한다."]]},"h":"d833050586"},{"n":3,"t":"tf","q":"Johnson found five styles that people use to deal with conflicts.","ko":"존슨은 사람들이 갈등을 다루는 데 사용하는 다섯 가지 방식을 찾아냈다(분류했다).","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장 He categorized five styles that people use to deal with conflicts with others와 같은 내용. categorize는 '분류하다'.","c":"T","ev":"3번 문장","s":[[3,"He categorized five styles that people use to deal with conflicts with others.","그는 사람들이 다른 사람들과의 갈등을 다루기 위해 사용하는 다섯 가지 방식을 분류했다."]]},"h":"e606853329"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Foxes can sacrifice some of their goals or persuade others to give up some of theirs.)","ko":"여우들은 자신의 목표 일부를 희생하거나 다른 사람들이 그들의 목표 일부를 포기하도록 ( ) 수 있다.","opts":["무시하다","비교하다","설득하다","도와주다"],"word":"persuade","r":{"a":"3) 설득하다","w":"8번에서 persuade others to give up은 남이 목표 일부를 포기하도록 '설득하다'. 여우는 서로 조금씩 양보하는 유형이라 무시하거나 비교한다는 뜻이 아님.","c":3,"ev":"8번 문장","s":[[8,"Foxes can sacrifice some of their goals or persuade others to give up some of theirs.","여우들은 자신의 목표 일부를 희생하거나 다른 사람들이 그들의 목표 일부를 포기하도록 설득할 수 있다."]]},"h":"fe92b89992"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (How people handle conflicts can make the relationship last longer and be more satisfying.)","ko":"사람들이 갈등을 어떻게 다루는지는 관계가 더 오래 지속되고 더 ( ) 만들 수 있다.","opts":["지루한","만족스러운","위험한","느린"],"word":"satisfying","r":{"a":"2) 만족스러운","w":"12번에서 갈등을 잘 다루면 관계가 더 오래가고 더 '만족스러워'진다는 흐름. 지루하거나 위험하다는 내용은 없음.","c":2,"ev":"12번 문장","s":[[12,"How people handle conflicts can make the relationship last longer and be more satisfying.","사람들이 갈등을 어떻게 다루는지는 관계가 더 오래 지속되고 더 만족스러워지게 만들 수 있다."]]},"h":"5b8f62a0c6"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey try to find a solution everyone is happy with, even if it takes time.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 비록 시간이 걸리더라도 모두가 만족하는 해결책을 찾으려고 노력한다.","opts":["거북이들","여우들","상어들","올빼미들"],"r":{"a":"4) 올빼미들","w":"10번 They는 바로 앞 9번의 주어 Owls(올빼미들). 9번에서 올빼미는 해결책에 이르려고 함께 일한다고 했고 10번이 그 이어지는 설명임.","c":4,"ev":"9~10번 문장","s":[[9,"Owls work together to reach solutions.","올빼미들은 해결책에 이르기 위해 함께 일한다."],[10,"They try to find a solution everyone is happy with, even if it takes time.","그들은 비록 시간이 걸리더라도 모두가 만족하는 해결책을 찾으려고 노력한다."]]},"h":"be9f634c68"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Foxes can sacrifice some of their goals or persuade others to give up some of theirs.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"여우들은 자신의 목표 일부를 희생하거나 다른 사람들이 그들의 목표 일부를 포기하도록 설득할 수 있다.","opts":["여우들은 자기 목표를 모두 지키고 남의 목표는 모두 빼앗는다.","여우들은 남에게 선물을 주는 대신 자기 목표 일부를 포기한다.","여우들은 자기 목표 일부를 포기하거나 남이 목표 일부를 포기하도록 설득할 수 있다.","여우들은 다른 사람을 도우려고 자기 목표를 모두 버린다."],"r":{"a":"3) 여우들은 자기 목표 일부를 포기하거나 남이 목표 일부를 포기하도록 설득할 수 있다.","w":"8번의 or 앞은 자기 목표 일부를 희생하는 것, or 뒤는 남이 목표 일부를 포기하게 설득하는 것. 모두 지키거나(1), 선물(2), 전부 버림(4)은 본문에 없음. sacrifice는 '희생하다'.","c":3,"ev":"8번 문장","s":[[8,"Foxes can sacrifice some of their goals or persuade others to give up some of theirs.","여우들은 자신의 목표 일부를 희생하거나 다른 사람들이 그들의 목표 일부를 포기하도록 설득할 수 있다."]]},"h":"6c3966769b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["거북이들은 무슨 일이 있어도 이기려고 한다.","곰 인형들은 자신의 목표를 절대 포기하지 않는다.","상어들은 다른 사람들의 요구에 신경 쓰지 않는다.","올빼미들은 시간이 걸리면 해결책 찾기를 멈춘다."],"opts":["Turtles try to win at any cost.","Teddy bears never give up their goals.","Sharks do not care about other people's needs.","Owls stop looking for a solution if it takes time."],"r":{"a":"3) Sharks do not care about other people's needs.","w":"6번에서 상어는 무슨 일이 있어도 이기려 하고 남의 요구에 신경 쓰지 않음. 이기려는 건 상어(거북이는 도망, 4번), 곰 인형은 목표를 포기(7번), 올빼미는 시간이 걸려도 계속 찾음(10번).","c":3,"ev":"4, 6~7, 10번 문장","s":[[4,"Turtles run away from problems.","거북이들은 문제를 피해 도망간다."],[6,"Sharks want to win at any cost and don’t care about others’ needs.","상어들은 무슨 일이 있어도 이기기를 원하고 다른 사람들의 요구에는 신경 쓰지 않는다."],[7,"Teddy bears give up their goals to keep their relationships.","곰 인형들은 관계를 지키기 위해 자신의 목표를 포기한다."],[10,"They try to find a solution everyone is happy with, even if it takes time.","그들은 비록 시간이 걸리더라도 모두가 만족하는 해결책을 찾으려고 노력한다."]]},"h":"c4f006106b"},{"n":9,"t":"sum","q":"People handle conflicts in different ways, so understanding each person's (A) is important for a better (B).","ko":"사람들은 갈등을 서로 다른 방식으로 다루므로, 각 사람의 (A)을 이해하는 것이 더 나은 (B)를 위해 중요하다.","opts":["(A) goal / (B) turtle","(A) style / (B) relationship","(A) problem / (B) winner","(A) shark / (B) solution","(A) time / (B) animal"],"oko":["(A) 목표 / (B) 거북이","(A) 방식 / (B) 관계","(A) 문제 / (B) 승자","(A) 상어 / (B) 해결책","(A) 시간 / (B) 동물"],"r":{"a":"2) (A) style / (B) relationship","w":"11~13번: 사람마다 독특한 갈등 해결 방식이 있고(11), 그것이 관계에 영향을 주므로(12) 각자의 방식(style)을 이해하는 것이 중요하다(13). 그래서 (A) style, (B) relationship.","c":2,"ev":"11~13번 문장","s":[[11,"Everyone has their unique ways of solving conflicts, and these styles can influence their relationships.","모든 사람은 갈등을 해결하는 자신만의 독특한 방법이 있고, 이 방식들은 그들의 관계에 영향을 줄 수 있다."],[12,"How people handle conflicts can make the relationship last longer and be more satisfying.","사람들이 갈등을 어떻게 다루는지는 관계가 더 오래 지속되고 더 만족스러워지게 만들 수 있다."],[13,"That’s why understanding each person’s style is important.","그것이 각자의 방식을 이해하는 것이 중요한 이유이다."]]},"h":"5cde3dc495"},{"n":10,"t":"fill","q":"Turtles run away from [A], but owls try to find a [B] that everyone is happy with.","ko":"거북이들은 [A]에서 도망치지만, 올빼미들은 모두가 만족하는 [B]을 찾으려고 노력한다.","bank":["problems","solution","goals","relationship","time","winner"],"bko":{"problems":"문제들","solution":"해결책","goals":"목표들","relationship":"관계","time":"시간","winner":"승자"},"r":{"a":"[A] problems, [B] solution","w":"4번 Turtles run away from problems(문제에서 도망친다), 10번 올빼미는 모두가 만족하는 solution(해결책)을 찾는다. goals, relationship은 거북이가 포기하는 것이고 time은 even if 뒤에 나오는 말이라 오답.","c":null,"ev":"4, 10번 문장","s":[[4,"Turtles run away from problems.","거북이들은 문제를 피해 도망간다."],[10,"They try to find a solution everyone is happy with, even if it takes time.","그들은 비록 시간이 걸리더라도 모두가 만족하는 해결책을 찾으려고 노력한다."]]},"h":"c8f0bdf38c"}]},{"u":10,"id":"rg3-10-2","no":2,"ko":"밤하늘의 별이 점점 사라지는 이유","items":[{"n":1,"t":"tf","q":"Satellites mess up astronomers' pictures of the night sky.","ko":"인공위성들은 천문학자들의 밤하늘 사진을 엉망으로 만든다.","r":{"a":"T (본문과 맞는 내용)","w":"5번 문장 They mess up astronomers' pictures of the night sky에서 They는 4번의 satellites. mess up은 '엉망으로 만들다'.","c":"T","ev":"5번 문장","s":[[5,"They mess up astronomers’ pictures of the night sky.","그것들은 천문학자들의 밤하늘 사진을 엉망으로 만든다."]]},"h":"f2f756fbab"},{"n":2,"t":"tf","q":"The average night sky got darker by 9.6% per year from 2011 to 2022.","ko":"2011년부터 2022년까지 평균 밤하늘은 해마다 9.6%씩 더 어두워졌다.","r":{"a":"F (본문과 다른 내용)","w":"9번에서 평균 밤하늘은 해마다 9.6%씩 '밝아졌다(brighter)'. darker로 바꾼 반대 진술이라 F.","c":"F","ev":"9번 문장","s":[[9,"Researchers found that the average night sky got brighter by 9.6% per year from 2011 to 2022.","연구원들은 2011년부터 2022년까지 평균 밤하늘이 해마다 9.6%씩 밝아졌다는 것을 알아냈다."]]},"h":"a62e55b959"},{"n":3,"t":"tf","q":"More cities around the world are using lights, causing light pollution.","ko":"전 세계에서 더 많은 도시들이 불빛을 사용하면서 빛공해를 일으키고 있다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장 more cities are using lights, causing light pollution과 같은 내용. causing은 '~하면서(일으키면서)'.","c":"T","ev":"2번 문장","s":[[2,"All around the world, more cities are using lights, causing light pollution.","전 세계적으로, 더 많은 도시들이 빛공해를 일으키면서 불빛을 사용하고 있다."]]},"h":"d66daa1e28"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But what worries astronomers is that the brightness from these satellites adds to light pollution from city lights.)","ko":"하지만 천문학자들을 걱정하게 하는 것은 이 인공위성들의 ( )가 도시 불빛들로 인한 빛공해에 더해진다는 것이다.","opts":["어둠","밝기","크기","거리"],"word":"brightness","r":{"a":"2) 밝기","w":"7번에서 위성의 brightness가 도시 불빛의 빛공해에 더해진다고 했고, 바로 8번에서 그래서 밤하늘이 더 '밝아진다(brighter)'고 함. 그러니 brightness는 밝기. 어둠은 반대 뜻.","c":2,"ev":"7번 문장","s":[[7,"But what worries astronomers is that the brightness from these satellites adds to light pollution from city lights.","하지만 천문학자들을 걱정하게 하는 것은 이 인공위성들의 밝기가 도시 불빛들로 인한 빛공해에 더해진다는 것이다."]]},"h":"4f88ded862"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Researchers found that the average night sky got brighter by 9.6% per year from 2011 to 2022.)","ko":"연구원들은 2011년부터 2022년까지 ( ) 밤하늘이 해마다 9.6%씩 밝아졌다는 것을 알아냈다.","opts":["가장 큰","가끔 있는","특별한","평균의"],"word":"average","r":{"a":"4) 평균의","w":"9번은 11년 동안의 변화를 해마다 9.6%씩이라고 평균을 내어 말한 것. 그래서 average는 평균의. 가끔 있다거나 특별하다는 뜻이 아님.","c":4,"ev":"9번 문장","s":[[9,"Researchers found that the average night sky got brighter by 9.6% per year from 2011 to 2022.","연구원들은 2011년부터 2022년까지 평균 밤하늘이 해마다 9.6%씩 밝아졌다는 것을 알아냈다."]]},"h":"5a556f007f"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey gave an example to explain the result.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 그 결과를 설명하기 위해 한 예를 들었다.","opts":["천문학자들","인공위성들","연구원들","아이들"],"r":{"a":"3) 연구원들","w":"10번 They는 바로 앞 9번의 주어 Researchers(연구원들). 9번의 연구 결과(the result)를 설명하려고 연구원들이 11번의 예를 든 것. 천문학자들이나 위성이 예를 든 것이 아님.","c":3,"ev":"9~10번 문장","s":[[9,"Researchers found that the average night sky got brighter by 9.6% per year from 2011 to 2022.","연구원들은 2011년부터 2022년까지 평균 밤하늘이 해마다 9.6%씩 밝아졌다는 것을 알아냈다."],[10,"They gave an example to explain the result.","그들은 그 결과를 설명하기 위해 한 예를 들었다."]]},"h":"a2542d5180"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This makes the night sky brighter, and makes it even harder to see the stars.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 밤하늘을 더 밝게 만들고 별을 보는 것을 훨씬 더 어렵게 만든다.","opts":["이것은 밤하늘을 어둡게 만들어 별이 더 잘 보이게 한다.","이것은 밤하늘을 더 밝게 만들지만 별은 더 잘 보이게 한다.","이것은 별을 더 많이 만들어 밤하늘을 아름답게 한다.","이것은 밤하늘을 더 밝게 하고 별을 보기 훨씬 더 힘들게 한다."],"r":{"a":"4) 이것은 밤하늘을 더 밝게 하고 별을 보기 훨씬 더 힘들게 한다.","w":"8번 makes A brighter(A를 더 밝게 만들다), makes it harder to see(보는 것을 어렵게 만들다). 앞 7번에서 위성의 밝기가 빛공해에 더해진다고 했으니 별이 더 안 보이는 것이 맞음. 별이 더 잘 보인다는 선지는 반대.","c":4,"ev":"8번 문장","s":[[8,"This makes the night sky brighter, and makes it even harder to see the stars.","이것은 밤하늘을 더 밝게 만들고 별을 보는 것을 훨씬 더 어렵게 만든다."]]},"h":"44fb586953"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["빛공해는 작은 문제가 되고 있다.","밤하늘은 2011년 이후 해마다 더 어두워졌다.","지구 근처의 인공위성들은 천문학자들이 새로운 발견을 하기 어렵게 만든다.","지금 250개의 별을 보는 아이는 18년 후에 500개의 별을 볼 것이다."],"opts":["Light pollution is becoming a small problem.","The night sky has become darker every year since 2011.","Satellites near Earth make it hard for astronomers to make new discoveries.","A child who sees 250 stars now will see 500 stars 18 years later."],"r":{"a":"3) Satellites near Earth make it hard for astronomers to make new discoveries.","w":"4~6번에서 위성 때문에 천문학자들이 새 발견을 하기 어렵다고 함. 빛공해는 '큰 문제'(3번), 밤하늘은 해마다 '밝아짐'(9번), 250개 보던 아이는 18년 후 '100개'(11번)라서 나머지는 모두 본문과 다름.","c":3,"ev":"3~6, 9, 11번 문장","s":[[3,"It is becoming a big problem.","그것은 큰 문제가 되고 있다."],[4,"Another cause of light pollution is that there are too many satellites near Earth.","빛공해의 또 다른 원인은 지구 근처에 인공위성들이 너무 많이 있다는 것이다."],[5,"They mess up astronomers’ pictures of the night sky.","그것들은 천문학자들의 밤하늘 사진을 엉망으로 만든다."],[6,"Because of this, it’s hard for them to make new discoveries about space.","이 때문에, 그들이 우주에 관한 새로운 발견을 하는 것은 어렵다."],[9,"Researchers found that the average night sky got brighter by 9.6% per year from 2011 to 2022.","연구원들은 2011년부터 2022년까지 평균 밤하늘이 해마다 9.6%씩 밝아졌다는 것을 알아냈다."],[11,"If a child is born in a place where they can see 250 stars at night, that child will only see 100 stars 18 years later.","만약 아이가 250개의 별을 볼 수 있는 곳에서 태어난다면, 그 아이는 18년 후에 오직 100개의 별만을 볼 수 있을 것이다."]]},"h":"3fec8fc198"},{"n":9,"t":"sum","q":"Satellites near Earth (A) astronomers' pictures, and they make the night sky (B).","ko":"지구 근처의 인공위성들은 천문학자들의 사진을 (A)하고, 밤하늘을 (B)하게 만든다.","opts":["(A) improve / (B) darker","(A) mess up / (B) darker","(A) save / (B) brighter","(A) share / (B) lower","(A) mess up / (B) brighter"],"oko":["(A) 좋게 하다 / (B) 더 어둡게","(A) 엉망으로 만들다 / (B) 더 어둡게","(A) 구하다 / (B) 더 밝게","(A) 나누다 / (B) 더 낮게","(A) 엉망으로 만들다 / (B) 더 밝게"],"r":{"a":"5) (A) mess up / (B) brighter","w":"5번에서 위성은 천문학자들의 사진을 엉망으로 만들고(mess up), 7~8번에서 위성의 밝기가 더해져 밤하늘이 더 밝아진다(brighter). (A)가 맞는 2번은 (B)가 darker라 오답, 나머지는 (A)부터 틀림.","c":5,"ev":"4~5, 7~8번 문장","s":[[4,"Another cause of light pollution is that there are too many satellites near Earth.","빛공해의 또 다른 원인은 지구 근처에 인공위성들이 너무 많이 있다는 것이다."],[5,"They mess up astronomers’ pictures of the night sky.","그것들은 천문학자들의 밤하늘 사진을 엉망으로 만든다."],[7,"But what worries astronomers is that the brightness from these satellites adds to light pollution from city lights.","하지만 천문학자들을 걱정하게 하는 것은 이 인공위성들의 밝기가 도시 불빛들로 인한 빛공해에 더해진다는 것이다."],[8,"This makes the night sky brighter, and makes it even harder to see the stars.","이것은 밤하늘을 더 밝게 만들고 별을 보는 것을 훨씬 더 어렵게 만든다."]]},"h":"36662c852b"},{"n":10,"t":"fill","q":"A child born where they can see [A] stars at night will see only [B] stars 18 years later.","ko":"밤에 [A]개의 별을 볼 수 있는 곳에서 태어난 아이는 18년 후에 오직 [B]개의 별만 볼 수 있을 것이다.","bank":["250","100","18","9.6","60","300"],"bko":{"250":"250(개)","100":"100(개)","18":"18(년)","9.6":"9.6(퍼센트)","60":"60","300":"300"},"r":{"a":"[A] 250, [B] 100","w":"11번 문장: 250개의 별이 보이는 곳에서 태어난 아이는 18년 뒤 100개의 별만 본다. 18은 몇 년 후인지, 9.6은 해마다 밝아지는 비율(9번)이라 별의 개수가 아님.","c":null,"ev":"11번 문장","s":[[11,"If a child is born in a place where they can see 250 stars at night, that child will only see 100 stars 18 years later.","만약 아이가 250개의 별을 볼 수 있는 곳에서 태어난다면, 그 아이는 18년 후에 오직 100개의 별만을 볼 수 있을 것이다."]]},"h":"db52fa9062"}]},{"u":10,"id":"rg3-10-3","no":3,"ko":"호수 위에 태양 전지판을 띄운다고?","items":[{"n":1,"t":"tf","q":"Solar panels are used to turn sunlight into electricity.","ko":"태양 전지판은 햇빛을 전기로 바꾸는 데 사용된다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장에 그대로 나옴. turn A into B는 'A를 B로 바꾸다'.","c":"T","ev":"1번 문장","s":[[1,"Solar panels are used to turn sunlight into electricity.","태양 전지판은 햇빛을 전기로 바꾸는 데 사용된다."]]},"h":"60bbbac535"},{"n":2,"t":"tf","q":"Most solar panels are on water.","ko":"대부분의 태양 전지판은 물 위에 있다.","r":{"a":"F (본문과 다른 내용)","w":"2번에서 Most of them are on land(대부분은 육지에 있다)라고 함. 물 위에 설치하려는 건 최근의 새로운 시도라서 F.","c":"F","ev":"2번 문장","s":[[2,"Most of them are on land, but recently, people are trying to put floating solar panels on water.","그것들의 대부분은 육지에 있지만, 최근에 사람들은 물 위에 뜨는 태양 전지판을 설치하려고 노력하고 있다."]]},"h":"3be85bf06a"},{"n":3,"t":"tf","q":"Too many solar panels could harm the plants and animals in the water.","ko":"너무 많은 태양 전지판은 물속의 식물과 동물들을 해칠 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"10번 문장과 같은 내용. harm은 '해치다', could는 '~할 수도 있다'.","c":"T","ev":"10번 문장","s":[[10,"Too many solar panels could harm the plants and animals in the water.","너무 많은 태양 전지판은 물속의 식물과 동물들을 해칠 수 있다."]]},"h":"312181a193"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They are expensive, but some benefits make solar panels a good idea.)","ko":"그것들은 비싸지만, 몇 가지 ( )들이 태양 전지판을 좋은 아이디어로 만든다.","opts":["문제점","이점","비용","위험"],"word":"benefits","r":{"a":"2) 이점","w":"5번은 but을 기준으로 앞은 비싸다(단점), 뒤는 benefits 때문에 좋은 아이디어라는 흐름. 그래서 benefits는 이점(혜택). 비용이나 문제점이면 좋은 아이디어가 되지 못함.","c":2,"ev":"5번 문장","s":[[5,"They are expensive, but some benefits make solar panels a good idea.","그것들은 비싸지만, 몇 가지 혜택들이 태양 전지판을 좋은 아이디어로 만든다."]]},"h":"7f0631f543"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The scientists say it's important to study how these panels will affect each lake's water.)","ko":"과학자들은 이 전지판들이 각 호수의 물에 어떻게 ( ) 것인지 연구하는 것이 중요하다고 말한다.","opts":["팔다","찾다","영향을 미치다","잊다"],"word":"affect","r":{"a":"3) 영향을 미치다","w":"앞 10번에서 전지판이 물속 생물을 해칠 수 있다고 했으니, 11번은 전지판이 호수 물에 어떤 영향을 줄지 연구하자는 내용. affect는 영향을 미치다.","c":3,"ev":"11번 문장","s":[[11,"The scientists say it’s important to study how these panels will affect each lake’s water.","과학자들은 이 전지판들이 각 호수의 물에 어떻게 영향을 미칠지 연구하는 것이 중요하다고 말한다."]]},"h":"56817e1bab"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are placed on floating platforms fixed to the bottom of lakes.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 호수 밑바닥에 고정된, 물 위에 뜨는 플랫폼에 설치된다.","opts":["육지의 태양 전지판들","호수들","물 위에 뜨는 태양 전지판들","과학자들"],"r":{"a":"3) 물 위에 뜨는 태양 전지판들","w":"3번 They는 바로 앞 2번에서 소개된 floating solar panels(물 위에 뜨는 태양 전지판). 육지 전지판은 2번의 Most of them이지만 3번은 floating platforms 위에 설치된다는 내용이라 물 위의 전지판.","c":3,"ev":"2~3번 문장","s":[[2,"Most of them are on land, but recently, people are trying to put floating solar panels on water.","그것들의 대부분은 육지에 있지만, 최근에 사람들은 물 위에 뜨는 태양 전지판을 설치하려고 노력하고 있다."],[3,"They are placed on floating platforms fixed to the bottom of lakes.","그것들은 호수 밑바닥에 고정된, 물 위에 뜨는 플랫폼에 설치된다."]]},"h":"0fb1d98d37"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They are expensive, but some benefits make solar panels a good idea.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것들은 비싸지만, 몇 가지 혜택들이 태양 전지판을 좋은 아이디어로 만든다.","opts":["비싸기 때문에 태양 전지판은 나쁜 생각이다.","몇 가지 혜택 때문에 태양 전지판은 가격이 싸다.","혜택은 없지만 값이 싸서 태양 전지판은 좋은 생각이다.","값은 비싸지만 몇 가지 혜택이 있어서 태양 전지판은 좋은 생각이다."],"r":{"a":"4) 값은 비싸지만 몇 가지 혜택이 있어서 태양 전지판은 좋은 생각이다.","w":"but은 '하지만'. 앞: 비싸다, 뒤: 혜택들이 좋은 아이디어로 만든다. 4번에서 비용이 더 든다고 했으므로 싸다는 선지는 오답이고, 혜택은 6~8번에서 나옴.","c":4,"ev":"5번 문장","s":[[5,"They are expensive, but some benefits make solar panels a good idea.","그것들은 비싸지만, 몇 가지 혜택들이 태양 전지판을 좋은 아이디어로 만든다."]]},"h":"7fdb9c4542"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["물 위에 뜨는 태양 전지판은 육지 전지판보다 약 25% 더 비용이 든다.","대부분의 태양 전지판은 이미 물 위에 있다.","물 위에 뜨는 태양 전지판은 육지 전지판보다 비용이 덜 든다.","과학자들은 물 위에 뜨는 태양 전지판을 연구할 필요가 없다고 말한다."],"opts":["Floating solar panels cost about 25% more than land panels.","Most solar panels are already on water.","Floating solar panels cost less than land panels.","Scientists say there is no need to study floating solar panels."],"r":{"a":"1) Floating solar panels cost about 25% more than land panels.","w":"4번에서 물 위 전지판은 육지 전지판보다 약 25% 더 비쌈. 대부분은 육지(2번), 더 비싸니 덜 든다는 선지는 오답, 과학자들은 연구가 중요하다고 함(11번).","c":1,"ev":"2, 4, 11번 문장","s":[[2,"Most of them are on land, but recently, people are trying to put floating solar panels on water.","그것들의 대부분은 육지에 있지만, 최근에 사람들은 물 위에 뜨는 태양 전지판을 설치하려고 노력하고 있다."],[4,"They cost about 25% more than land panels.","그것들은 육지 전지판들보다 약 25퍼센트 더 비용이 든다."],[11,"The scientists say it’s important to study how these panels will affect each lake’s water.","과학자들은 이 전지판들이 각 호수의 물에 어떻게 영향을 미칠지 연구하는 것이 중요하다고 말한다."]]},"h":"f3dc4a3a98"},{"n":9,"t":"sum","q":"Floating solar panels have good points, but too many of them could (A) plants and animals, so scientists need to (B) the effects.","ko":"물 위에 뜨는 태양 전지판은 좋은 점이 있지만, 너무 많으면 식물과 동물을 (A)할 수 있어서 과학자들은 그 영향을 (B)해야 한다.","opts":["(A) help / (B) sell","(A) harm / (B) sell","(A) help / (B) study","(A) harm / (B) forget","(A) harm / (B) study"],"oko":["(A) 돕다 / (B) 팔다","(A) 해치다 / (B) 팔다","(A) 돕다 / (B) 연구하다","(A) 해치다 / (B) 잊다","(A) 해치다 / (B) 연구하다"],"r":{"a":"5) (A) harm / (B) study","w":"10번에서 너무 많은 전지판은 식물과 동물을 해칠(harm) 수 있고, 11번에서 과학자들은 영향을 연구하는(study) 것이 중요하다고 말함. 하나라도 틀린 선지는 오답.","c":5,"ev":"10~11번 문장","s":[[10,"Too many solar panels could harm the plants and animals in the water.","너무 많은 태양 전지판은 물속의 식물과 동물들을 해칠 수 있다."],[11,"The scientists say it’s important to study how these panels will affect each lake’s water.","과학자들은 이 전지판들이 각 호수의 물에 어떻게 영향을 미칠지 연구하는 것이 중요하다고 말한다."]]},"h":"3f2e4ad822"},{"n":10,"t":"fill","q":"If 30% of lakes are covered with floating solar panels, they could make [A] times as much energy as current solar power and save the water that [B] people would use in a year.","ko":"호수의 30%가 물 위에 뜨는 태양 전지판으로 덮이면, 현재 태양열 에너지의 [A]배 에너지를 만들고 [B]명이 일 년 동안 사용할 물을 절약할 수 있다.","bank":["10","300,000","25","30","18","100"],"bko":{"10":"10(배)","300,000":"30만(명)","25":"25(퍼센트)","30":"30(퍼센트)","18":"18","100":"100"},"r":{"a":"[A] 10, [B] 300,000","w":"6번: 호수의 30%에 설치하면 현재 모든 태양열의 10배 에너지, 8번: 30%만 덮어도 300,000명이 일 년에 쓸 물을 절약. 25는 비용이 더 드는 비율(4번), 30은 이미 문장에 있는 호수 비율.","c":null,"ev":"6, 8번 문장","s":[[6,"By putting these solar panels on 30% of lakes, they could make 10 times as much energy as all current solar power.","호수의 30퍼센트에 이 태양 전지판들을 설치함으로써, 그것들은 현재의 모든 태양열 에너지보다 10배 더 많은 에너지를 만들어 낼 수 있다."],[8,"Covering just 30% of lakes with solar panels could save as much water as 300,000 people would use in a year.","고작 호수의 30퍼센트만 태양 전지판으로 덮어도 30만 명의 사람들이 일 년에 사용할 만큼의 물을 절약할 수 있다."]]},"h":"5087a4a4f8"}]},{"u":11,"id":"rg3-11-1","no":1,"ko":"2,000년 넘게 버티는 로마 콘크리트의 비밀","items":[{"n":1,"t":"tf","q":"Roman concrete buildings have survived for over 2,000 years.","ko":"로마의 콘크리트 건물들은 2,000년 이상 견뎌 왔다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장 Their concrete buildings have survived for over 2,000 years와 같은 내용. survive는 '살아남다, 견뎌 내다'.","c":"T","ev":"2번 문장","s":[[2,"Their concrete buildings have survived for over 2,000 years.","그들의 콘크리트 건물들은 2,000년 이상 견뎌 왔다."]]},"h":"939fc8b83e"},{"n":2,"t":"tf","q":"Researchers have never tried to figure out the mystery of Roman concrete.","ko":"연구원들은 로마 콘크리트의 미스터리를 알아내려고 한 적이 한 번도 없다.","r":{"a":"F (본문과 다른 내용)","w":"3번에서 연구원들은 수년 동안 그 미스터리를 알아내려고 노력해 왔다(have tried). never(한 번도 ~않다)가 들어간 반대 진술이라 F.","c":"F","ev":"3번 문장","s":[[3,"For many years, researchers have tried to figure out the mystery of strong Roman concrete.","수년 동안, 연구원들은 튼튼한 로마 콘크리트의 미스터리를 알아내기 위해 노력해 왔다."]]},"h":"2bee2c33a5"},{"n":3,"t":"tf","q":"Researchers found small white chunks called lime clasts in Roman concrete.","ko":"연구원들은 로마 콘크리트에서 석회 쇄설암이라고 불리는 작고 하얀 덩어리들을 발견했다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장과 같은 내용. noticed(알아차렸다)를 found(발견했다)로 바꿔 쓴 것.","c":"T","ev":"6번 문장","s":[[6,"Researchers noticed small white chunks called “lime clasts” in Roman concrete.","연구원들은 로마 콘크리트에서 ‘석회 쇄설암’이라고 불리는 작고 하얀 덩어리들을 발견했다."]]},"h":"10e5ed175d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The ancient Romans were great engineers and builders, so they created many impressive structures.)","ko":"고대 로마인들은 훌륭한 기술자이자 건축가여서 ( ) 건축물들을 많이 만들었다.","opts":["지루한","위험한","인상적인","평범한"],"word":"impressive","r":{"a":"3) 인상적인","w":"1번에서 로마인들이 great engineers(훌륭한 기술자)여서 만든 건축물이라고 했고, 2번에서 2,000년을 버텼다고 함. 그래서 impressive는 인상적인(감명 깊은). 지루하거나 평범하면 앞의 great와 어울리지 않음.","c":3,"ev":"1번 문장","s":[[1,"The ancient Romans were great engineers and builders, so they created many impressive structures.","고대 로마인들은 훌륭한 기술자이자 건축가여서 인상적인 건축물들을 많이 만들었다."]]},"h":"aec0bfdf65"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They fill tiny cracks and repair damage.)","ko":"그것들은 작은 틈을 메우고 손상을 ( ).","opts":["부수다","수리하다","던지다","씻다"],"word":"repair","r":{"a":"2) 수리하다","w":"10번에서 석회 쇄설암이 틈을 메우고(fill) 손상을 repair한다고 함. 11번에서 틈이 커지기 전에 '고친다(fixes)'고 같은 뜻으로 다시 말함. 그래서 repair는 수리하다.","c":2,"ev":"10번 문장","s":[[10,"They fill tiny cracks and repair damage.","그것들은 작은 틈을 메우고 손상을 복구한다."]]},"h":"250ed5a8b7"},{"n":6,"t":"ref","q":"What does the underlined \"These\" refer to?\nThese were formed from high-temperature reactions.","ko":"밑줄 친 These가 가리키는 것은?","sko":"이것들은 고온 반응으로부터 형성되었다.","opts":["로마인들","연구원들","콘크리트 건물들","석회 쇄설암이라는 작고 하얀 덩어리들"],"r":{"a":"4) 석회 쇄설암이라는 작고 하얀 덩어리들","w":"7번 These는 바로 앞 6번에서 소개된 small white chunks called lime clasts(석회 쇄설암). 고온 반응으로 형성된 것은 이 덩어리들이고, 사람이나 건물이 형성되었다는 말은 아님.","c":4,"ev":"6~7번 문장","s":[[6,"Researchers noticed small white chunks called “lime clasts” in Roman concrete.","연구원들은 로마 콘크리트에서 ‘석회 쇄설암’이라고 불리는 작고 하얀 덩어리들을 발견했다."],[7,"These were formed from high-temperature reactions.","이것들은 고온 반응으로부터 형성되었다."]]},"h":"3e8fd49ff9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In fact, this hot mixing process was what gave the ancient concrete a “self-healing ability.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사실, 이 고온 혼합 과정은 고대 콘크리트에 ‘자가 치유 능력’을 준 것이었다.","opts":["이 혼합 과정은 콘크리트의 자가 치유 능력을 없애 버렸다.","자가 치유 능력 덕분에 로마인들이 고온 혼합 과정을 생각해 냈다.","사실, 이 뜨거운 혼합 과정이 고대 콘크리트에 자가 치유 능력을 갖게 해 준 것이었다.","이 혼합 과정은 콘크리트의 자가 치유 능력과 아무 관계가 없었다."],"r":{"a":"3) 사실, 이 뜨거운 혼합 과정이 고대 콘크리트에 자가 치유 능력을 갖게 해 준 것이었다.","w":"8번의 what gave A B는 'A에게 B를 준 것'. 고온 혼합 과정(5번)이 자가 치유 능력을 준 원인이다. 능력을 없앴다(1), 능력이 과정의 원인이다(2), 관계없다(4)는 모두 본문과 반대.","c":3,"ev":"8번 문장","s":[[8,"In fact, this hot mixing process was what gave the ancient concrete a “self-healing ability.”","사실, 이 고온 혼합 과정은 고대 콘크리트에 ‘자가 치유 능력’을 준 것이었다."]]},"h":"53d5fd0ee3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["로마인들은 석회, 화산재, 물을 고온에서 섞었다.","연구원들은 로마 콘크리트에 비밀이 없다고 생각한다.","석회 쇄설암은 물을 만나면 틈을 더 크게 만든다.","로마 콘크리트 건물들은 겨우 200년 동안만 좋은 상태로 있었다."],"opts":["Romans mixed lime, volcanic ash, and water at high temperatures.","Researchers think Roman concrete has no secret.","Lime clasts make cracks bigger when they meet water.","Roman concrete buildings stayed in good condition for only 200 years."],"r":{"a":"1) Romans mixed lime, volcanic ash, and water at high temperatures.","w":"5번에서 로마인들은 석회, 화산재, 물을 고온에서 섞음. 연구원들은 비밀(자가 치유 콘크리트)을 찾았다고 믿고(4번), 석회 쇄설암은 틈을 메우고(10번), 건물은 2,000년 이상 버텼음(2번).","c":1,"ev":"2, 4~5, 10~11번 문장","s":[[2,"Their concrete buildings have survived for over 2,000 years.","그들의 콘크리트 건물들은 2,000년 이상 견뎌 왔다."],[4,"Now, they believe they have finally found the secret: self-healing concrete!","이제, 그들은 마침내 비밀을 발견했다고 믿는다: 바로 자가 치유 콘크리트다!"],[5,"To make their concrete, Romans mixed lime, volcanic ash, and water at high temperatures.","그들의 콘크리트를 만들기 위해, 로마인들은 석회, 화산재, 그리고 물을 고온에서 섞었다."],[10,"They fill tiny cracks and repair damage.","그것들은 작은 틈을 메우고 손상을 복구한다."],[11,"This reaction happens naturally and quickly fixes the cracks before they get bigger.","이 반응은 자연스럽게 일어나며 갈라진 틈이 더 커지기 전에 그것들을 빠르게 수리한다."]]},"h":"46e35e1f1d"},{"n":9,"t":"sum","q":"Self-healing concrete explains why ancient Roman buildings are still in good (A), and researchers hope it can (B) modern concrete.","ko":"자가 치유 콘크리트는 고대 로마 건물들이 오늘날에도 좋은 (A)인 이유를 설명해 주며, 연구원들은 그것이 현대 콘크리트를 (B)하는 데 도움이 되기를 바란다.","opts":["(A) condition / (B) damage","(A) shape / (B) hide","(A) weather / (B) improve","(A) price / (B) sell","(A) condition / (B) improve"],"oko":["(A) 상태 / (B) 손상시키다","(A) 모양 / (B) 숨기다","(A) 날씨 / (B) 개선하다","(A) 가격 / (B) 팔다","(A) 상태 / (B) 개선하다"],"r":{"a":"5) (A) condition / (B) improve","w":"12번: 로마 건물들이 오늘날에도 좋은 상태(good condition)인 이유를 설명, 13번: 연구원들은 발견이 현대 콘크리트를 개선(improve)하는 데 도움이 되기를 바람. (A)와 (B)가 둘 다 맞는 것은 5번뿐.","c":5,"ev":"12~13번 문장","s":[[12,"This explains why ancient Roman buildings remain in good condition today.","이것은 고대 로마의 건물들이 왜 오늘날에도 좋은 상태를 유지하는지 설명해 준다."],[13,"Researchers hope their findings could help improve modern concrete.","연구원들은 그들의 발견이 현대의 콘크리트를 개선하는 데 도움이 될 수 있기를 바란다."]]},"h":"cfbab51047"},{"n":10,"t":"fill","q":"When lime clasts come into contact with [A], they act like [B] and fill tiny cracks.","ko":"석회 쇄설암이 [A]과 접촉할 때, 그것들은 [B]처럼 작용하며 작은 틈을 메운다.","bank":["water","glue","ash","lime","heat","paint"],"bko":{"water":"물","glue":"풀, 접착제","ash":"재","lime":"석회","heat":"열","paint":"페인트"},"r":{"a":"[A] water, [B] glue","w":"9번: 석회 쇄설암이 물(water)과 접촉하면 풀(glue)처럼 작용하고, 10번에서 작은 틈을 메움. ash와 lime은 콘크리트 재료(5번)이고 heat는 만들 때 필요한 조건이라 여기 빈칸과 다름.","c":null,"ev":"9~10번 문장","s":[[9,"When lime clasts come into contact with water, they act like glue.","석회 쇄설암이 물과 접촉할 때, 그것들은 풀처럼 작용한다."],[10,"They fill tiny cracks and repair damage.","그것들은 작은 틈을 메우고 손상을 복구한다."]]},"h":"e6c854eeff"}]},{"u":11,"id":"rg3-11-2","no":2,"ko":"바게트 한 개에도 국가 비상이 걸린 이유","items":[{"n":1,"t":"tf","q":"Six billion baguettes are sold in France every year.","ko":"프랑스에서는 매년 60억 개의 바게트가 팔린다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장 six billion baguettes are sold in France every year와 같은 내용. sold는 sell(팔다)의 과거분사.","c":"T","ev":"3번 문장","s":[[3,"It’s surprising to know that six billion baguettes are sold in France every year!","프랑스에서 매년 60억 개의 바게트가 팔린다는 사실은 놀랍다!"]]},"h":"c37e7e444d"},{"n":2,"t":"tf","q":"Most of the small bakeries that closed were in big cities.","ko":"문을 닫은 소규모 빵집들 대부분은 대도시에 있었다.","r":{"a":"F (본문과 다른 내용)","w":"7번에서 문을 닫은 작은 빵집 대부분은 시골 지역(the countryside)에 있었음. 대도시로 바꾼 진술이라 F.","c":"F","ev":"7번 문장","s":[[7,"Most of these small bakeries that closed were in the countryside.","문을 닫은 이러한 소규모 빵집 대부분은 시골 지역에 있었다."]]},"h":"07606047c1"},{"n":3,"t":"tf","q":"Early in the morning, people buy fresh baguettes from bakeries in France.","ko":"프랑스에서는 아침 일찍 사람들이 빵집에서 신선한 바게트를 산다.","r":{"a":"T (본문과 맞는 내용)","w":"4번에서 아침 일찍 사람들이 빵집에서 신선한 바게트를 사는 모습을 쉽게 볼 수 있다고 함. buying은 buy(사다)에서 온 말.","c":"T","ev":"4번 문장","s":[[4,"Early in the morning, you can easily see people buying fresh baguettes from bakeries.","아침 일찍, 당신은 사람들이 빵집에서 신선한 바게트를 사는 모습을 쉽게 볼 수 있다."]]},"h":"851cf8818d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the past, there were many traditional bakeries in France and each of them had unique baguette-baking skills.)","ko":"과거에는 프랑스에 전통 빵집이 많이 있었고 각각 ( ) 바게트 제빵 기술을 가지고 있었다.","opts":["평범한","값비싼","독특한, 고유의","오래된"],"word":"unique","r":{"a":"3) 독특한, 고유의","w":"5번은 빵집마다 each of them(각각)이 unique skills를 가졌다는 내용. 빵집마다 다른 '고유의' 기술이라는 뜻이라 평범한은 반대. 6번의 however로 이 빵집들이 사라지는 문제가 시작됨.","c":3,"ev":"5번 문장","s":[[5,"In the past, there were many traditional bakeries in France and each of them had unique baguette-baking skills.","과거에는 프랑스에 전통 빵집이 많이 있었고 각각 고유의 바게트 제빵 기술을 가지고 있었다."]]},"h":"3945f0939f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most of these small bakeries that closed were in the countryside.)","ko":"문을 닫은 이러한 소규모 빵집 대부분은 ( )에 있었다.","opts":["시골 지역","바다","도시","공항"],"word":"countryside","r":{"a":"1) 시골 지역","w":"7번은 문을 닫은 작은 빵집 대부분이 어디에 있었는지 말하는 문장이고, in the countryside는 '시골 지역에'라는 뜻이다. 바다, 도시, 공항은 본문에 나오지 않는다.","c":1,"ev":"7번 문장","s":[[7,"Most of these small bakeries that closed were in the countryside.","문을 닫은 이러한 소규모 빵집 대부분은 시골 지역에 있었다."]]},"h":"51137b2b24"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey added the traditional know-how and culture of baguette bread to their list of “Intangible Cultural Heritage.”","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 바게트 빵의 전통적인 제조 기술과 문화를 ‘무형문화유산’ 목록에 추가했다.","opts":["프랑스 사람들","유네스코","작은 빵집들","대형 슈퍼마켓들"],"r":{"a":"2) 유네스코","w":"10번 They는 바로 앞 9번의 주어 UNESCO(유네스코). 9번에서 유네스코가 전통 제빵 방식을 보호하려고 했고, 10번이 그 구체적인 일(무형문화유산 목록에 추가)임. 빵집이나 슈퍼마켓이 목록에 추가한 것은 아님.","c":2,"ev":"9~10번 문장","s":[[9,"UNESCO tried to protect the traditional baguette-baking methods for the future.","유네스코는 미래를 위해 바게트의 전통 제빵 방식을 보호하려고 노력했다."],[10,"They added the traditional know-how and culture of baguette bread to their list of “Intangible Cultural Heritage.”","그들은 바게트 빵의 전통적인 제조 기술과 문화를 ‘무형문화유산’ 목록에 추가했다."]]},"h":"938859b85a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Small bakeries found it hard to stay open because of big supermarkets and stores.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"작은 빵집들은 대형 슈퍼마켓과 상점들 때문에 영업을 유지하기 어렵다는 것을 깨달았다.","opts":["큰 슈퍼마켓들이 작은 빵집들을 도와서 문을 열어 둘 수 있었다.","작은 빵집들은 문을 열어 두는 것이 쉽다는 것을 알게 되었다.","작은 빵집들은 큰 상점들과 합쳐져 큰 빵집이 되었다.","작은 빵집들은 대형 슈퍼마켓과 상점들 때문에 문을 열어 두기가 어렵다고 느꼈다."],"r":{"a":"4) 작은 빵집들은 대형 슈퍼마켓과 상점들 때문에 문을 열어 두기가 어렵다고 느꼈다.","w":"8번의 found it hard to stay open은 '문을 열어 두기가 어렵다고 느꼈다(깨달았다)'. because of 뒤의 big supermarkets and stores가 어려움의 원인. 도움이 되었다(1)거나 쉽다(2)는 반대 뜻이고, 합쳐졌다(3)는 내용은 없음.","c":4,"ev":"8번 문장","s":[[8,"Small bakeries found it hard to stay open because of big supermarkets and stores.","작은 빵집들은 대형 슈퍼마켓과 상점들 때문에 영업을 유지하기 어렵다는 것을 깨달았다."]]},"h":"fe8f72d41a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["프랑스 사람들은 바게트를 거의 먹지 않는다.","프랑스는 1970년 이후 매년 400개의 새 빵집을 얻었다.","1970년 이후, 프랑스는 매년 400개의 전통 빵집을 잃었다.","유네스코는 바게트 제빵 방식을 보호하려고 하지 않았다."],"opts":["French people rarely eat baguettes.","France has gained 400 new bakeries each year since 1970.","Since 1970, France has lost 400 traditional bakeries each year.","UNESCO did not try to protect baguette-baking methods."],"r":{"a":"3) Since 1970, France has lost 400 traditional bakeries each year.","w":"6번에서 1970년 이후 매년 400개의 전통 빵집을 잃었다고 함. 바게트는 식사 때마다 먹을 만큼 흔하고(2번), 유네스코는 전통 제빵 방식을 보호하려고 했음(9번).","c":3,"ev":"2, 6, 9번 문장","s":[[2,"It is very common for the French to eat this bread during every meal.","프랑스 사람들이 식사 때마다 이 빵을 먹는 것은 매우 흔하다."],[6,"However, since 1970, France has lost 400 traditional bakeries each year.","그러나, 1970년 이후로, 프랑스는 매년 400개의 전통 빵집을 잃었다."],[9,"UNESCO tried to protect the traditional baguette-baking methods for the future.","유네스코는 미래를 위해 바게트의 전통 제빵 방식을 보호하려고 노력했다."]]},"h":"6f01d39abd"},{"n":9,"t":"sum","q":"Since 1970, France has (A) many small traditional bakeries, mostly in the (B), because of big supermarkets and stores.","ko":"1970년 이후, 프랑스는 대형 슈퍼마켓과 상점들 때문에 주로 (B)에 있는 많은 작은 전통 빵집들을 (A)했다.","opts":["(A) gained / (B) countryside","(A) lost / (B) city","(A) opened / (B) airport","(A) sold / (B) station","(A) lost / (B) countryside"],"oko":["(A) 얻었다 / (B) 시골 지역","(A) 잃었다 / (B) 도시","(A) 열었다 / (B) 공항","(A) 팔았다 / (B) 역","(A) 잃었다 / (B) 시골 지역"],"r":{"a":"5) (A) lost / (B) countryside","w":"6번: 1970년 이후 매년 전통 빵집을 잃었다(lost), 7번: 문을 닫은 빵집 대부분은 시골 지역(countryside), 8번: 원인은 대형 슈퍼마켓과 상점들. (A)lost와 (B)countryside를 모두 만족하는 것은 5번뿐.","c":5,"ev":"6~8번 문장","s":[[6,"However, since 1970, France has lost 400 traditional bakeries each year.","그러나, 1970년 이후로, 프랑스는 매년 400개의 전통 빵집을 잃었다."],[7,"Most of these small bakeries that closed were in the countryside.","문을 닫은 이러한 소규모 빵집 대부분은 시골 지역에 있었다."],[8,"Small bakeries found it hard to stay open because of big supermarkets and stores.","작은 빵집들은 대형 슈퍼마켓과 상점들 때문에 영업을 유지하기 어렵다는 것을 깨달았다."]]},"h":"7702c65d72"},{"n":10,"t":"fill","q":"UNESCO tried to [A] the traditional baguette-baking methods and added them to its list of Intangible Cultural [B].","ko":"유네스코는 전통적인 바게트 제빵 방식을 [A]하려고 노력했고 그것들을 무형문화 [B] 목록에 추가했다.","bank":["protect","Heritage","lose","price","bread","supermarket"],"bko":{"protect":"보호하다","Heritage":"유산","lose":"잃다","price":"가격","bread":"빵","supermarket":"슈퍼마켓"},"r":{"a":"[A] protect, [B] Heritage","w":"9번 UNESCO tried to protect(보호하려고 노력했다), 10번에서 Intangible Cultural Heritage(무형문화유산) 목록에 추가함. lose, price, supermarket은 빵집이 어려워진 이유 쪽 단어이고 bread는 목록 이름이 아님.","c":null,"ev":"9~10번 문장","s":[[9,"UNESCO tried to protect the traditional baguette-baking methods for the future.","유네스코는 미래를 위해 바게트의 전통 제빵 방식을 보호하려고 노력했다."],[10,"They added the traditional know-how and culture of baguette bread to their list of “Intangible Cultural Heritage.”","그들은 바게트 빵의 전통적인 제조 기술과 문화를 ‘무형문화유산’ 목록에 추가했다."]]},"h":"3ed1746edc"}]},{"u":11,"id":"rg3-11-3","no":3,"ko":"극장에 팝콘이 없던 시절이 있었다고?","items":[{"n":1,"t":"tf","q":"Before 1927, movie theaters were luxurious places for only high-class customers.","ko":"1927년 이전에 영화관은 상류층 손님만을 위한 호화로운 장소였다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장과 같은 내용. luxurious는 '호화로운', high-class는 '상류층의'.","c":"T","ev":"2번 문장","s":[[2,"This was because movie theaters were luxurious places for only high-class customers before 1927.","이것은 1927년 이전에 영화관이 상류층 손님만을 위한 호화로운 장소였기 때문이었다."]]},"h":"5af0b07ac7"},{"n":2,"t":"tf","q":"The theater owners wanted people to make noise while they were eating popcorn.","ko":"극장 소유주들은 사람들이 팝콘을 먹는 동안 소음을 내기를 원했다.","r":{"a":"F (본문과 다른 내용)","w":"3번에서 극장 소유주들은 사람들이 팝콘을 먹으며 소음을 내는 것을 원하지 않았음(didn't want). 반대로 쓴 진술이라 F.","c":"F","ev":"3번 문장","s":[[3,"The theater owners didn’t want people to make noise while they were eating popcorn at the movies.","극장 소유주들은 사람들이 영화관에서 팝콘을 먹는 동안 소음을 내는 것을 원하지 않았다."]]},"h":"ef0e6547e2"},{"n":3,"t":"tf","q":"During the Great Depression, going to a movie was cheaper than other activities.","ko":"대공황 동안 영화를 보러 가는 것은 다른 활동들보다 더 저렴했다.","r":{"a":"T (본문과 맞는 내용)","w":"7번 문장 going to a movie was cheaper than other activities와 같은 내용. cheaper는 cheap(저렴한)의 비교급.","c":"T","ev":"7번 문장","s":[[7,"At that time, going to a movie was cheaper than other activities.","그 당시, 영화를 보러 가는 것은 다른 활동들보다 더 저렴했다."]]},"h":"293326c191"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This was because movie theaters were luxurious places for only high-class customers before 1927.)","ko":"이것은 1927년 이전에 영화관이 상류층 손님만을 위한 ( ) 장소였기 때문이었다.","opts":["좁은","오래된","호화로운","위험한"],"word":"luxurious","r":{"a":"3) 호화로운","w":"2번에서 영화관은 high-class(상류층) 손님만을 위한 곳이었음. 그래서 luxurious는 호화로운. 5~8번에서 돈이 적은 사람들이 갈 만큼 싸졌다는 것과 대조됨.","c":3,"ev":"2번 문장","s":[[2,"This was because movie theaters were luxurious places for only high-class customers before 1927.","이것은 1927년 이전에 영화관이 상류층 손님만을 위한 호화로운 장소였기 때문이었다."]]},"h":"910109a6fe"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As more and more people went to movie theaters, owners finally started selling popcorn.)","ko":"점점 더 많은 사람들이 영화관에 가면서, 영화관 ( )은 마침내 팝콘을 팔기 시작했다.","opts":["영화 팬들","주인(소유주)들","배우들","직원들"],"word":"owners","r":{"a":"2) 주인(소유주)들","w":"9번의 owners는 3번의 The theater owners(극장 소유주들)와 같은 사람들. 처음에 팝콘을 망설이던 주인들이 마침내 팔기 시작했다는 이야기라서 주인(소유주)들. 영화 팬들은 12번의 moviegoers.","c":2,"ev":"9번 문장","s":[[9,"As more and more people went to movie theaters, owners finally started selling popcorn.","점점 더 많은 사람들이 영화관에 가면서, 영화관 주인들은 마침내 팝콘을 팔기 시작했다."]]},"h":"2dd051da2a"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey needed a place to have fun with less money, and that was the theater.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 더 적은 돈으로 즐길 장소가 필요했는데, 그것이 바로 극장이었다.","opts":["극장 소유주들","영화배우들","상류층 손님들","직장을 잃고 힘든 시간을 보낸 많은 사람들"],"r":{"a":"4) 직장을 잃고 힘든 시간을 보낸 많은 사람들","w":"6번 They는 바로 앞 5번의 many people(많은 사람들) 중 대공황 때 직장을 잃고 힘든 시간을 보낸 사람들. 이들이 적은 돈으로 즐길 곳(극장)을 필요로 했음. 상류층 손님은 1927년 이전 이야기(2번).","c":4,"ev":"5~6번 문장","s":[[5,"However, during the Great Depression, many people lost their jobs and had a hard time.","그러나, 대공황 동안, 많은 사람들이 직장을 잃었고 힘든 시간을 보냈다."],[6,"They needed a place to have fun with less money, and that was the theater.","그들은 더 적은 돈으로 즐길 장소가 필요했는데, 그것이 바로 극장이었다."]]},"h":"fc310b121e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This was because movie theaters were luxurious places for only high-class customers before 1927.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 1927년 이전에 영화관이 상류층 손님만을 위한 호화로운 장소였기 때문이었다.","opts":["이것은 1927년에 영화관이 처음 생겼기 때문이었다.","이것은 영화관이 모든 사람을 위한 값싼 곳이었기 때문이었다.","이것은 1927년 이전에 영화관이 상류층 손님만을 위한 호화로운 곳이었기 때문이었다.","이것은 상류층 손님들이 영화관에 오지 않았기 때문이었다."],"r":{"a":"3) 이것은 1927년 이전에 영화관이 상류층 손님만을 위한 호화로운 곳이었기 때문이었다.","w":"This was because ~는 '이것은 ~ 때문이었다'. 앞의 '팝콘이 항상 허용되지는 않았다'(1번)는 일의 이유가 1927년 이전 영화관이 상류층만을 위한 호화로운 곳이었기 때문이라는 것. 영화관이 처음 생겼다(1)는 말은 없고, 값싼 곳(2)은 반대이며, 상류층이 오지 않았다(4)도 반대.","c":3,"ev":"2번 문장","s":[[2,"This was because movie theaters were luxurious places for only high-class customers before 1927.","이것은 1927년 이전에 영화관이 상류층 손님만을 위한 호화로운 장소였기 때문이었다."]]},"h":"ccdd5983d6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["영화관은 1927년 이전에 로비에서 팝콘을 팔았다.","점점 더 많은 사람들이 극장에 가자 주인들은 마침내 팝콘을 팔기 시작했다.","영화를 보러 가는 것이 더 비쌌기 때문에 영화관은 인기 있어졌다.","팝콘은 오늘날 영화관에 중요하지 않다."],"opts":["Movie theaters sold popcorn in the lobby before 1927.","Owners finally started selling popcorn when more and more people went to theaters.","Movie theaters became popular because going to a movie was more expensive.","Popcorn is not important to movie theaters today."],"r":{"a":"2) Owners finally started selling popcorn when more and more people went to theaters.","w":"9번에서 점점 더 많은 사람들이 극장에 가자 주인들이 마침내 팝콘을 팔기 시작했음. 1927년 이전에는 팝콘이 허용되지 않았고(1~2번), 영화는 더 저렴해서 인기가 생겼으며(7~8번), 오늘날 팝콘은 큰 수입원임(11번).","c":2,"ev":"1, 7, 9, 11번 문장","s":[[1,"Did you know that popcorn was not always allowed in American movie theaters?","당신은 미국 영화관에서 팝콘이 항상 허용되지는 않았다는 것을 알고 있었는가?"],[7,"At that time, going to a movie was cheaper than other activities.","그 당시, 영화를 보러 가는 것은 다른 활동들보다 더 저렴했다."],[9,"As more and more people went to movie theaters, owners finally started selling popcorn.","점점 더 많은 사람들이 영화관에 가면서, 영화관 주인들은 마침내 팝콘을 팔기 시작했다."],[11,"Today, for most movie theaters, popcorn is a big part of making money.","오늘날, 대부분의 영화관에서 팝콘은 돈을 버는 데 큰 부분을 차지한다."]]},"h":"40368ee67c"},{"n":9,"t":"sum","q":"During the Great Depression, people needed a (A) place to have fun, so movie theaters became (B).","ko":"대공황 동안, 사람들은 즐길 (A) 장소가 필요해서 영화관은 (B)해졌다.","opts":["(A) expensive / (B) popular","(A) cheap / (B) quiet","(A) noisy / (B) empty","(A) far / (B) closed","(A) cheap / (B) popular"],"oko":["(A) 비싼 / (B) 인기 있는","(A) 저렴한 / (B) 조용한","(A) 시끄러운 / (B) 텅 빈","(A) 먼 / (B) 문 닫은","(A) 저렴한 / (B) 인기 있는"],"r":{"a":"5) (A) cheap / (B) popular","w":"5~7번: 대공황으로 직장을 잃은 사람들이 적은 돈으로 즐길 곳이 필요했고, 영화가 다른 활동보다 저렴했음(cheaper). 8번: 그 결과 극장은 인기 있는(popular) 장소가 됨. (A)cheap과 (B)popular가 둘 다 맞는 것은 5번뿐.","c":5,"ev":"5~8번 문장","s":[[5,"However, during the Great Depression, many people lost their jobs and had a hard time.","그러나, 대공황 동안, 많은 사람들이 직장을 잃었고 힘든 시간을 보냈다."],[6,"They needed a place to have fun with less money, and that was the theater.","그들은 더 적은 돈으로 즐길 장소가 필요했는데, 그것이 바로 극장이었다."],[7,"At that time, going to a movie was cheaper than other activities.","그 당시, 영화를 보러 가는 것은 다른 활동들보다 더 저렴했다."],[8,"As a result, movie theaters became popular places!","결과적으로, 영화관은 인기 있는 장소가 되었다!"]]},"h":"fb39194c3a"},{"n":10,"t":"fill","q":"As more people went to theaters, owners started [A] popcorn, and today popcorn is a big part of making [B].","ko":"더 많은 사람들이 극장에 가면서, 주인들은 팝콘을 [A] 시작했고, 오늘날 팝콘은 [B]을 버는 데 큰 부분이다.","bank":["selling","money","noise","jobs","snack","lobby"],"bko":{"selling":"팔기","money":"돈","noise":"소음","jobs":"직장","snack":"간식","lobby":"로비"},"r":{"a":"[A] selling, [B] money","w":"9번 owners finally started selling popcorn(팝콘을 팔기 시작했다), 11번 popcorn is a big part of making money(돈을 버는 데 큰 부분). noise와 jobs는 3번, 5번의 다른 이야기이고 snack, lobby는 문장 뜻이 맞지 않음.","c":null,"ev":"9, 11번 문장","s":[[9,"As more and more people went to movie theaters, owners finally started selling popcorn.","점점 더 많은 사람들이 영화관에 가면서, 영화관 주인들은 마침내 팝콘을 팔기 시작했다."],[11,"Today, for most movie theaters, popcorn is a big part of making money.","오늘날, 대부분의 영화관에서 팝콘은 돈을 버는 데 큰 부분을 차지한다."]]},"h":"c9660c9671"}]},{"u":12,"id":"rg3-12-1","no":1,"ko":"인터넷은 구름이 아니라 바닷속을 달린다","items":[{"n":1,"t":"tf","q":"More than 95 percent of international data is sent by the undersea cables.","ko":"국제 데이터의 95퍼센트 이상이 해저 케이블들에 의해 전송된다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장 More than 95 percent of international data is sent by them과 같은 내용. 여기서 them은 1번의 big cables under the sea.","c":"T","ev":"1~2번 문장","s":[[1,"Data doesn’t just float in the cloud; it travels through big cables under the sea.","데이터는 그저 구름 속에 떠다니는 것이 아니다; 그것은 바다 아래의 큰 케이블들을 통해 이동한다."],[2,"More than 95 percent of international data is sent by them.","국제 데이터의 95퍼센트 이상이 그것들에 의해 전송된다."]]},"h":"3d2ee4411b"},{"n":2,"t":"tf","q":"Using satellites for the internet is faster than using undersea cables.","ko":"인터넷에 인공위성을 사용하는 것이 해저 케이블을 사용하는 것보다 더 빠르다.","r":{"a":"F (본문과 다른 내용)","w":"9번에서 인공위성은 지연(delays)이 있을 수 있고, 10번에서 해저 케이블이 거의 빛만큼 빠르다고 함. 빠르기가 반대로 쓰인 진술이라 F.","c":"F","ev":"9~10번 문장","s":[[9,"Using satellites can have delays.","인공위성을 사용하는 것은 지연이 있을 수 있다."],[10,"But, the undersea cables are very fast because they use optical fibers that send data almost as fast as light!","하지만, 해저 케이블들은 거의 빛만큼 빠르게 데이터를 전송하는 광섬유를 사용하기 때문에 매우 빠르다!"]]},"h":"80bc24854a"},{"n":3,"t":"tf","q":"Workers use special ships to place cables.","ko":"작업자들은 케이블을 설치하기 위해 특별한 배를 사용한다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장 Workers use special ships to place cables와 같은 내용. place는 '놓다, 설치하다'.","c":"T","ev":"6번 문장","s":[[6,"Workers use special ships to place cables and must choose the best path for the cables, avoiding fishing areas or military zones.","작업자들은 케이블을 설치하기 위해 특별한 배를 사용하며, 어업 구역이나 군사 지역을 피해 케이블을 위한 최적의 경로를 선택해야 한다."]]},"h":"2cffff4478"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Workers use special ships to place cables and must choose the best path for the cables, avoiding fishing areas or military zones.)","ko":"작업자들은 케이블을 설치하기 위해 특별한 배를 사용하며, 어업 구역이나 군사 지역을 ( ) 케이블을 위한 최적의 경로를 선택해야 한다.","opts":["따르다","청소하다","피하다","팔다"],"word":"avoiding","r":{"a":"3) 피하다","w":"6번에서 케이블은 어업 구역이나 군사 지역을 '피해서' 놓아야 최적의 길이 됨. 그래서 avoid는 피하다. 앞의 best path(최적의 경로)와 연결해 읽으면 이해됨.","c":3,"ev":"6번 문장","s":[[6,"Workers use special ships to place cables and must choose the best path for the cables, avoiding fishing areas or military zones.","작업자들은 케이블을 설치하기 위해 특별한 배를 사용하며, 어업 구역이나 군사 지역을 피해 케이블을 위한 최적의 경로를 선택해야 한다."]]},"h":"2a3b6d0a0b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, if your internet is slow sometimes, just be more patient.)","ko":"그러니, 여러분의 인터넷이 가끔 느리다면, 좀 더 ( ).","opts":["화난","게으른","바쁜","인내심 있는"],"word":"patient","r":{"a":"4) 인내심 있는","w":"12번은 인터넷이 가끔 느릴 때 어떻게 하라는 당부이고, 13번 이유는 작업자들이 최선을 다하고 있다는 것. 그래서 patient는 참을성 있는(인내심 있는). 화내거나 게으른 것은 문맥에 맞지 않음.","c":4,"ev":"12~13번 문장","s":[[12,"So, if your internet is slow sometimes, just be more patient.","그러니, 여러분의 인터넷이 가끔 느리다면, 좀 더 인내심을 가져라."],[13,"The workers are doing their best.","작업자들은 최선을 다하고 있다."]]},"h":"98b2f7446c"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nMore than 95 percent of international data is sent by them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"국제 데이터의 95퍼센트 이상이 그것들에 의해 전송된다.","opts":["구름들","인공위성들","바다 아래의 큰 케이블들","작업자들"],"r":{"a":"3) 바다 아래의 큰 케이블들","w":"2번의 them은 바로 앞 1번에서 데이터가 이동한다고 한 big cables under the sea(바다 아래의 큰 케이블들). 위성은 8~9번에서야 나오고, 데이터를 전송하는 것은 케이블임.","c":3,"ev":"1~2번 문장","s":[[1,"Data doesn’t just float in the cloud; it travels through big cables under the sea.","데이터는 그저 구름 속에 떠다니는 것이 아니다; 그것은 바다 아래의 큰 케이블들을 통해 이동한다."],[2,"More than 95 percent of international data is sent by them.","국제 데이터의 95퍼센트 이상이 그것들에 의해 전송된다."]]},"h":"a3c6269ecf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They are hundreds of thousands of miles long and lie 8,000 meters below the ocean's surface — almost as deep as Mount Everest is tall.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것들은 길이가 수십만 마일이고 바다 표면 아래 8,000미터에 놓여 있는데, 이는 에베레스트산의 높이와 거의 같은 깊이이다.","opts":["그것들은 에베레스트산 꼭대기에 놓여 있다.","그것들은 길이가 수십만 마일이고, 에베레스트산 높이쯤 되는 깊이의 바닷속에 있다.","그것들은 길이가 8,000미터이고 바다 위에 떠 있다.","그것들은 에베레스트산보다 훨씬 더 깊은 곳에 있다."],"r":{"a":"2) 그것들은 길이가 수십만 마일이고, 에베레스트산 높이쯤 되는 깊이의 바닷속에 있다.","w":"3번은 케이블의 길이(수십만 마일)와 위치(해수면 아래 8,000미터)를 말하고, 대시(—) 뒤에서 그 깊이를 에베레스트산의 높이에 거의 같다고 비유함. 산꼭대기(1), 길이가 8,000미터이고 떠 있음(3), 훨씬 더 깊음(4)은 본문과 다름.","c":2,"ev":"3번 문장","s":[[3,"They are hundreds of thousands of miles long and lie 8,000 meters below the ocean’s surface — almost as deep as Mount Everest is tall.","그것들은 길이가 수십만 마일이고 바다 표면 아래 8,000미터에 놓여 있는데, 이는 에베레스트산의 높이와 거의 같은 깊이이다."]]},"h":"711a2e3eb5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["케이블들은 깊은 물속에서 가장 안전하다.","대부분의 국제 데이터는 인공위성으로 전송된다.","케이블을 놓는 데는 며칠밖에 걸리지 않는다.","작업자들은 어업 구역과 군사 지역 근처에 케이블을 설치한다."],"opts":["The cables are safest in deep water.","Most international data is sent by satellites.","Laying the cables takes only a few days.","Workers place cables near fishing areas and military zones."],"r":{"a":"1) The cables are safest in deep water.","w":"4번에서 케이블은 깊은 물속에서 가장 안전하다고 함. 국제 데이터의 95% 이상은 케이블로 전송되고(2번), 설치는 바다에서 몇 달이 걸리며(7번), 어업·군사 구역은 피함(6번).","c":1,"ev":"2, 4, 6~7번 문장","s":[[2,"More than 95 percent of international data is sent by them.","국제 데이터의 95퍼센트 이상이 그것들에 의해 전송된다."],[4,"The cables are safest in deep water.","케이블들은 깊은 물속에서 가장 안전하다."],[6,"Workers use special ships to place cables and must choose the best path for the cables, avoiding fishing areas or military zones.","작업자들은 케이블을 설치하기 위해 특별한 배를 사용하며, 어업 구역이나 군사 지역을 피해 케이블을 위한 최적의 경로를 선택해야 한다."],[7,"This work can take months at sea.","이 작업은 바다에서 몇 달이 걸릴 수 있다."]]},"h":"0a8af08a01"},{"n":9,"t":"sum","q":"Satellites can have (A), but undersea cables are very (B) because they use optical fibers.","ko":"인공위성은 (A)이 있을 수 있지만, 해저 케이블은 광섬유를 사용하기 때문에 매우 (B).","opts":["(A) delays / (B) slow","(A) benefits / (B) slow","(A) delays / (B) expensive","(A) speed / (B) cheap","(A) delays / (B) fast"],"oko":["(A) 지연 / (B) 느리다","(A) 이점 / (B) 느리다","(A) 지연 / (B) 비싸다","(A) 속도 / (B) 싸다","(A) 지연 / (B) 빠르다"],"r":{"a":"5) (A) delays / (B) fast","w":"9번에서 인공위성은 지연(delays)이 있을 수 있고, 10번에서 해저 케이블은 광섬유를 사용해 거의 빛만큼 빠르다(very fast)고 함. (A)와 (B)가 모두 맞는 것은 5번뿐.","c":5,"ev":"9~10번 문장","s":[[9,"Using satellites can have delays.","인공위성을 사용하는 것은 지연이 있을 수 있다."],[10,"But, the undersea cables are very fast because they use optical fibers that send data almost as fast as light!","하지만, 해저 케이블들은 거의 빛만큼 빠르게 데이터를 전송하는 광섬유를 사용하기 때문에 매우 빠르다!"]]},"h":"7904abb104"},{"n":10,"t":"fill","q":"Laying cables is [A] work, and workers use special [B] to place them.","ko":"케이블을 놓는 것은 [A] 작업이고, 작업자들은 케이블을 설치하기 위해 특별한 [B]을 사용한다.","bank":["hard","ships","delays","satellites","cables","water"],"bko":{"hard":"힘든","ships":"배들","delays":"지연","satellites":"인공위성들","cables":"케이블들","water":"물"},"r":{"a":"[A] hard, [B] ships","w":"5번 Laying these cables is hard work(힘든 작업), 6번 Workers use special ships(특별한 배를 사용). delays, satellites는 8~9번의 인공위성 이야기이고, cables는 설치하는 대상이며, water는 설치 작업에 쓰는 도구가 아니라서 오답.","c":null,"ev":"5~6번 문장","s":[[5,"Laying these cables is hard work.","이 케이블들을 놓는 것은 힘든 작업이다."],[6,"Workers use special ships to place cables and must choose the best path for the cables, avoiding fishing areas or military zones.","작업자들은 케이블을 설치하기 위해 특별한 배를 사용하며, 어업 구역이나 군사 지역을 피해 케이블을 위한 최적의 경로를 선택해야 한다."]]},"h":"2a308ae725"}]},{"u":12,"id":"rg3-12-2","no":2,"ko":"돼지의 심장이 사람 몸에서 뛰었다","items":[{"n":1,"t":"tf","q":"David Bennett was the person who received the new heart.","ko":"데이비드 베넷은 새 심장을 받은 사람이었다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장과 같은 내용. who received the new heart는 the person을 꾸며 '새 심장을 받은 사람'이라는 뜻.","c":"T","ev":"2번 문장","s":[[2,"David Bennett was the person who received the new heart.","데이비드 베넷은 그 새 심장을 받은 사람이었다."]]},"h":"d0d96fad00"},{"n":2,"t":"tf","q":"David could receive a human heart transplant because his heart was strong.","ko":"데이비드는 심장이 튼튼했기 때문에 인간의 심장 이식을 받을 수 있었다.","r":{"a":"F (본문과 다른 내용)","w":"3번에서 데이비드의 심장은 너무 약해서(so weak) 인간 심장 이식을 받을 수 없었음. strong과 could로 반대로 쓴 진술이라 F.","c":"F","ev":"3번 문장","s":[[3,"His heart was so weak that he couldn’t receive a human heart transplant.","그의 심장은 너무 약해서 그는 인간의 심장 이식을 받을 수 없었다."]]},"h":"7407877ef2"},{"n":3,"t":"tf","q":"In the past, doctors tried to use animal hearts, but they didn't succeed.","ko":"과거에 의사들은 동물의 심장을 사용하려고 노력했지만 성공하지 못했다.","r":{"a":"T (본문과 맞는 내용)","w":"5번 문장과 같은 내용. didn't succeed는 '성공하지 못했다'.","c":"T","ev":"5번 문장","s":[[5,"In the past, doctors tried to use animal hearts but they didn’t succeed.","과거에, 의사들은 동물의 심장을 사용하려고 노력했지만 성공하지 못했다."]]},"h":"556fb15a4f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Doctors at the University of Maryland Medical Center achieved something amazing — they transplanted a pig's heart into a person for the first time!)","ko":"메릴랜드 대학 의료 센터의 의사들은 놀라운 일을 ( ) — 그들은 처음으로 돼지의 심장을 사람에게 이식했다!","opts":["잃었다","이루어 냈다","숨겼다","망쳤다"],"word":"achieved","r":{"a":"2) 이루어 냈다","w":"1번에서 something amazing(놀라운 일) 뒤에 대시(—)로 처음으로 돼지 심장을 사람에게 이식한 일이 설명됨. 그래서 achieved는 이루어 냈다(해냈다). 잃거나 망쳤다면 amazing과 어울리지 않음.","c":2,"ev":"1번 문장","s":[[1,"Doctors at the University of Maryland Medical Center achieved something amazing — they transplanted a pig’s heart into a person for the first time!","메릴랜드 대학 의료 센터의 의사들은 놀라운 일을 해냈다 — 그들은 처음으로 돼지의 심장을 사람에게 이식했다!"]]},"h":"44228509e8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Despite this result, the experiment gave doctors valuable information.)","ko":"이 결과에도 불구하고, 그 실험은 의사들에게 ( ) 정보를 주었다.","opts":["쓸모없는","위험한","귀중한","오래된"],"word":"valuable","r":{"a":"3) 귀중한","w":"10번은 Despite(~에도 불구하고)로 앞의 나쁜 결과(8~9번)와 대조하는 문장. 그래서 실험
