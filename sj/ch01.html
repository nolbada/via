<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  if(/[?&]t=1(&|$)/.test(W.location.search)){W.TEACHER_MODE=true;W.WN={add:function(){return Promise.resolve(false)},hw:function(){return Promise.resolve(false)},gate:function(cb){cb()},flush:function(){return Promise.resolve(false)},name:function(){return'선생님'}};return}
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){

const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

try{ looked=JSON.parse(localStorage.getItem("sj_looked2")||"{}"); missed=JSON.parse(localStorage.getItem("sj_missed")||"{}"); }catch(e){}
function save(){ try{ localStorage.setItem("sj_looked2",JSON.stringify(looked)); localStorage.setItem("sj_missed",JSON.stringify(missed)); }catch(e){} }
function words(s,sid){
  return s.split(/([A-Za-zé][A-Za-zé'’-]*)/).map((t,i)=> i%2
    ? '<span class="w'+(activeKey===sid+":"+i?" on":"")+'" data-k="'+sid+":"+i+'" data-w="'+esc(t)+'">'+esc(t)+'</span>'
    : esc(t)).join("");
}
function card(x){
  return '<section class="card"><div class="top"><span class="num">'+x.id+'</span><span class="src">'+esc(x.tag)+'</span></div>'
    +'<div class="sent">'+words(x.en,x.id)+'</div></section>';
}
function render(){
  ["S","B","R","W"].forEach(k=>$("#tab"+k).setAttribute("aria-selected",tab===k.toLowerCase()));
  const keys=Object.keys(looked);
  $("#wc").textContent=keys.length;
  let h="";
  if(tab!=="w"){
    h+=(tab==="s"?SENT:tab==="b"?SENT2:REV).map(card).join("");
  } else {
    if(!keys.length) h='<div class="empty">아직 찾아본 단어가 없습니다.</div>';
    else h='<div class="wl">'+keys.sort((a,b)=>looked[b].c-looked[a].c||a.localeCompare(b)).map(k=>{
      const v=looked[k];
      return '<div class="wl-row"><span class="wl-w">'+esc(k)+'</span><span class="wl-c">'+v.c+'회</span>'
        +'<span class="wl-m'+(v.x?"":" miss")+'">'+(v.x?esc(v.x)+' <span class="wl-b">('+esc(v.m)+')</span>':"뜻 자료 없음")+'</span></div>';
    }).join("")+'</div>';
  }
  $("#main").innerHTML=h;
}
function showNote(word,key){
  const lower=word.toLowerCase();
  const sid=key.split(":")[0];
  const e=(OVR[sid]&&OVR[sid][lower])||DICT[lower];
  const nm=$("#nm");
  $("#nw").textContent=word;
  if(e){
    $("#nf").textContent=e.f||"";
    nm.textContent=e.c; nm.classList.remove("miss");
    $("#nb").textContent="("+e.b+" · "+e.m+")";
    if(!looked[e.b]) looked[e.b]={c:0,x:e.c,m:e.m};
    looked[e.b].c++; looked[e.b].x=e.c;
    if(window.WN)WN.add([{w:e.b,m:e.c,src:"천일문S",how:"터치",ask:true}]);
  } else {
    $("#nf").textContent="";
    nm.textContent="단어 자료에 없음";
    nm.classList.add("miss");
    $("#nb").textContent="";
    missed[lower]=1;
  }
  $("#note").classList.add("show");
  activeKey=key; save();
}
function hideNote(){ $("#note").classList.remove("show"); activeKey=null; }
document.addEventListener("click",e=>{
  const w=e.target.closest(".w");
  if(w){
    const k=w.dataset.k;
    if(activeKey===k){ hideNote(); render(); return; }
    showNote(w.dataset.w,k); render();
  }
});
$("#nx").onclick=()=>{ hideNote(); render(); };
["S","B","R","W"].forEach(k=>{ $("#tab"+k).onclick=()=>{ tab=k.toLowerCase(); hideNote(); render(); }; });
let tx=null;
$("#main").addEventListener("touchstart",e=>{ tx=e.touches[0].clientX; },{passive:true});
$("#main").addEventListener("touchend",e=>{
  if(tx===null||tab==="w") return;
  const dx=e.changedTouches[0].clientX-tx; tx=null;
  if(Math.abs(dx)<70) return;
  const pg=["s","b","r"], n=pg.indexOf(tab)+(dx<0?1:-1);
  if(n>=0&&n<pg.length){ tab=pg[n]; hideNote(); render(); window.scrollTo(0,0); }
},{passive:true});
render();
</script>
