 헤엄친다. (어느 자리에 들어갈지 고르는 문제예요.)", "ex": ["lay eggs = 알을 낳다", "hatched(원형 hatch) = 부화했다", "stream = 개울"]}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "관계부사 when, where", "type": "mc", "ans": "②", "concept": ["086"], "gap": "", "words": [["mall", "쇼핑몰"], ["meet", "만나다(과거 met)"], ["friend", "친구"]], "h1": "윗문장의 where we had met our friends와 같은 뜻이 되도록 where 대신 쓸 두 단어 말을 찾으세요.", "h2": "관계부사는 「전치사 + which」로 바꿔 쓸 수 있어요. 장소의 where와 짝인 전치사로 '쇼핑몰에서'에 어울리는 것을 고르세요.", "why": "장소의 관계부사 where는 「장소 전치사 + which」로 바꿀 수 있어요. 쇼핑몰에서 만났으니 at which(~에서)가 맞아요.", "opts": [{"n": "①", "en": "of which", "ko": "of which(~의)", "ok": false, "why": "'~의'라는 소유 뜻이에요. 장소 where와 맞지 않아요."}, {"n": "②", "en": "at which", "ko": "at which(~에서)", "ok": true, "why": "where = at which라서 맞아요."}, {"n": "③", "en": "for which", "ko": "for which(~을 위한)", "ok": false, "why": "이유 why를 바꿀 때 써요. 장소와 맞지 않아요."}, {"n": "④", "en": "in that", "ko": "in that(~라는 점에서)", "ok": false, "why": "'~라는 점에서'라는 다른 표현이에요. where를 바꿔 쓸 수 없어요."}, {"n": "⑤", "en": "on that", "ko": "on that(그것 위에서)", "ok": false, "why": "관계대명사 that 앞에는 전치사를 붙일 수 없어요."}], "pencil": "where는 「장소 전치사 + ___」로 바꿔 쓸 수 있다", "pencilKey": "which", "page": 132, "sec": "s2", "k": "pick", "tr": "우리는 친구들을 만났던 쇼핑몰에 갔다. = 우리는 ___ 친구들을 만났던 쇼핑몰에 갔다. (두 문장은 같은 뜻이에요.)", "ex": ["mall = 쇼핑몰"]}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "통합형", "type": "mc", "ans": "③", "concept": ["086", "086-H1", "094"], "gap": "", "words": [["please", "기쁘게 하다"], ["parents", "부모님"], ["apartment", "아파트"], ["couple", "부부"], ["neat", "깔끔한"], ["manager", "관리자"], ["provide", "제공하다"], ["return", "반품하다"]], "h1": "세 빈칸을 따로 풀어요. 첫 번째는 '부모님을 기쁘게 하는 ~', 두 번째는 문장 끝이 live in으로 끝나요, 세 번째는 앞말이 reasons예요. 각각 무엇이 필요한지 보세요.", "h2": "첫 번째는 방법의 말, 두 번째는 뒤에 전치사 in이 남아 있어서 관계대명사가 필요해요, 세 번째는 이유예요. 세 칸에 순서대로 맞는 보기를 찾으세요.", "why": "첫 번째는 '부모님을 기쁘게 하는 방법'이라 how, 두 번째는 문장 끝에 in이 남아 있어서 관계대명사 which, 세 번째는 앞말이 reasons(이유)라서 why예요.", "opts": [{"n": "①", "en": "when - how - why", "ko": "when - how - why(때 - 방법 - 이유)", "
