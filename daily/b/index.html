,"나는 [[여름 방학]]을 해변에서 보냈다."],["She will [[take a vacation]] in May.","그녀는 5월에 [[휴가를 낼]] 것이다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"valid","a":"3","e":"valid (형) 유효한, 타당한 - validate (동) 입증하다, 인증하다\n③ authentic (형) 진짜의, 진품인 - authenticate (동) 진위를 확인하다, 인증하다","w":"① substance (명) 본질, 핵심 - substantiate (동) 실증하다, 입증하다\n② example (명) 예, 보기 - exemplify (동) 예를 들다, 전형을 보이다\n④ stimulus (명) 자극 - stimulate (동) 자극하다, 활성화하다","m":0,"s":"valid - validate","c":["substance - substantiate","example - exemplify","authentic - authenticate","stimulus - stimulate"],"mn":"유효한, 타당한","hk":"valid(유효한, 형용사)→validate(입증하다, 동사)는 형용사에서 동사 방향. authentic(진짜의)→authenticate(진위를 확인하다)가 같고 나머지는 명사 출발.","ex":[["You need [[a valid ticket]].","[[유효한 표]]가 필요하다.","valid (형) 유효한, 타당한"],["Tests can [[validate the results]].","시험은 [[결과를 입증할]] 수 있다.","validate (동) 입증하다, 인증하다"],["This is [[an authentic painting]].","이것은 [[진품 그림]]이다.","authentic (형) 진짜의, 진품인"],["Experts will [[authenticate the signature]].","전문가들이 [[서명의 진위를 확인할]] 것이다.","authenticate (동) 진위를 확인하다, 인증하다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"curtail","a":"3","e":"③ curtail: 축소하다, 줄이다 (그 시는 줄어든 예산 때문에 심야 버스 운행을 축소해야 했다.)","w":"① expand: 확장하다, 늘리다\n② supplant: 대신하다, 대체하다\n④ bolster: 강화하다, 북돋우다","k":"그 시는 줄어든 예산 때문에 심야 버스 운행을 축소해야 했다.","m":0,"s":"The city had to ________ its late-night bus service because of the smaller budget.","c":["expand","supplant","curtail","bolster"],"mn":"축소하다, 줄이다","hk":"curtail(축소하다)은 양이나 기간을 줄이는 것. expand(확장하다)·bolster(강화하다)는 늘리는 반대 방향, supplant(대신하다)는 자리를 바꾸는 뜻.","ex":[["The city will [[curtail spending]] next year.","시는 내년에 [[지출을 줄일]] 것이다."],["Rain forced them to [[curtail the trip]].","비 때문에 그들은 [[여행을 줄여야]] 했다."],["Doctors advised him to [[curtail his work hours]].","의사는 그에게 [[근무 시간을 줄이라고]] 권했다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"infrastructure","a":"1","e":"① infrastructure: 기반 시설","w":"② machinery: 기계류, 기계장치\n③ installation: 설치, 설치물\n④ framework: 체계, 틀","m":0,"s":"\"기반 시설\"","c":["infrastructure","machinery","installation","framework"],"mn":"기반 시설","hk":"infrastructure(기반 시설)는 도로·전기·다리처럼 사회를 받치는 시설. machinery(기계류)·installation(설치)·framework(체계)는 다른 뜻.","ex":[["The city needs [[better infrastructure]].","그 도시는 [[더 나은 기반 시설]]이 필요하다."],["The storm damaged [[the transport infrastructure]].","폭풍이 [[교통 기반 시설]]을 훼손했다."],["The country spent money on [[energy infrastructure]].","그 나라는 [[에너지 기반 시설]]에 돈을 썼다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"majestic","a":"1,2","e":"① magnificent: 장엄한, 웅장한\n② grand: 웅장한, 장엄한 (그 장엄한 산들이 고요한 계곡 위로 높이 솟아 있었다.) / majestic(장엄한, 위풍당당한)의 유의어.","w":"③ symmetrical: 대칭적인\n④ arid: 건조한, 메마른","k":"그 장엄한 산들이 고요한 계곡 위로 높이 솟아 있었다.","m":2,"s":"The majestic mountains rose high above the quiet valley.","h":"majestic","c":["magnificent","grand","symmetrical","arid"],"mn":"장엄한, 위풍당당한","hk":"majestic(장엄한)의 같은 편은 magnificent(장엄한)·grand(웅장한). symmetrical(대칭적인)·arid(건조한)는 위엄의 뜻이 없음.","ex":[["[[A majestic eagle]] flew over the cliff.","[[위풍당당한 독수리]] 한 마리가 절벽 위를 날았다."],["We admired [[the majestic view]].","우리는 [[장엄한 경치]]에 감탄했다."],["The palace has [[a majestic gate]].","그 궁전에는 [[웅장한 문]]이 있다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"stroke","a":"stroke","e":"stroke (명) 뇌졸중 / (동) 쓰다듬다","k":"그 노인 환자는 심각한 뇌졸중을 겪고 오른팔을 쓰지 못하게 되었다.\n고양이가 안절부절못할 때마다, 그녀는 고양이가 진정될 때까지 그 털을 부드럽게 쓰다듬는다.","m":0,"s":"The elderly patient suffered a severe s______ and lost the use of his right arm.\nWhenever the cat grows restless, she will gently s______ its fur until it calms down.","mn":"뇌졸중 / 쓰다듬다","hk":"stroke(뇌졸중, 명사)와 stroke(쓰다듬다, 동사)는 철자가 같은 두 뜻. 문장에서 품사로 구분.","ex":[["He had [[a stroke]] last year.","그는 작년에 [[뇌졸중]]을 앓았다.","stroke (명) 뇌졸중"],["[[A stroke]] can happen suddenly to older people.","[[뇌졸중]]은 노인에게 갑자기 올 수 있다.","stroke (명) 뇌졸중"],["She likes to [[stroke her dog]].","그녀는 [[개를 쓰다듬는]] 것을 좋아한다.","stroke (동) 쓰다듬다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"verdict","a":"4","e":"④ verdict: (공식적인 결정 / 배심원단이나 판사가 내리는 / 재판이 끝날 때) 판결, 평결 (배심원단이나 판사가 재판이 끝날 때 내리는 공식적인 결정)","w":"① injunction: 금지 명령\n② statute: 법령, 성문법\n③ litigation: 소송","k":"공식적인 결정 / 배심원단이나 판사가 내리는 / 재판이 끝날 때","m":0,"s":"\"the official decision that a jury or a judge gives at the end of a trial\"","c":["injunction","statute","litigation","verdict"],"mn":"판결, 평결 (배심원단이나 판사가 재판이 끝날 때 내리는 공식적인 결정)","hk":"verdict(판결)는 재판이 끝날 때 배심원단이나 판사가 내리는 공식 결정. injunction(금지 명령)·statute(법령)·litigation(소송)은 재판 결과가 아님.","ex":[["The jury [[reached a verdict]].","배심원단은 [[평결에 이르렀다]]."],["The judge [[announced the verdict]].","판사는 [[판결을 발표했다]]."],["The [[guilty verdict]] shocked the town.","[[유죄 평결]]은 마을을 충격에 빠뜨렸다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"chaotic","a":"3","e":"③ orderly: 질서 있는, 정돈된 (그 거리 시장은 축제 첫날 아침에 완전히 혼란스러웠다.) / chaotic(혼란스러운, 무질서한)의 반의어.","w":"① turbulent: 격동의, 혼란스러운\n② mundane: 평범한, 일상적인\n④ sequential: 순차적인, 연속적인","k":"그 거리 시장은 축제 첫날 아침에 완전히 혼란스러웠다.","m":0,"s":"The street market was completely chaotic on the opening morning of the festival.","h":"chaotic","c":["turbulent","mundane","orderly","sequential"],"mn":"혼란스러운, 무질서한","hk":"chaotic(혼란스러운)의 반대편은 orderly(질서 있는). turbulent(격동의)는 같은 편, mundane(평범한)·sequential(순차적인)은 반의어 짝이 아님.","ex":[["The classroom became [[chaotic]] without the teacher.","선생님이 없자 교실은 [[혼란스러워졌다]].","chaotic (형) 혼란스러운, 무질서한"],["It was [[a chaotic scene]] at the station.","역은 [[혼란스러운 장면]]이었다.","chaotic (형) 혼란스러운, 무질서한"],["The students formed [[an orderly line]].","학생들은 [[질서 있는 줄]]을 만들었다.","orderly (형) 질서 있는, 정돈된"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"perpetuate","a":"3","e":"③ perpetuate: 영속시키다, 지속시키다 (같은 거짓 이야기를 반복하는 것은 이미 많은 사람을 상처 입힌 이미지를 지속시키는 데 도움이 될 뿐이다.)","w":"① reinstate: 복원하다, 복직시키다\n② revert: 되돌아가다, 복귀하다\n④ erase: 지우다, 없애다","k":"같은 거짓 이야기를 반복하는 것은 이미 많은 사람을 상처 입힌 이미지를 지속시키는 데 도움이 될 뿐이다.","m":0,"s":"Repeating the same false story only helps to ________ an image that has already hurt many people.","c":["reinstate","revert","perpetuate","erase"],"mn":"영속시키다, 지속시키다","hk":"perpetuate(영속시키다)는 perpetual(끝없는)과 한 가족으로 계속 이어가는 것. reinstate(복원하다)·revert(되돌아가다)·erase(지우다)는 다른 뜻.","ex":[["Stories like this [[perpetuate stereotypes]].","이런 이야기는 [[고정관념을 지속시킨다]]."],["The law may [[perpetuate unfairness]].","그 법은 [[불공평을 지속시킬]] 수 있다."],["We should not [[perpetuate the myth]].","우리는 [[그 통념을 영속시켜서는]] 안 된다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"translation","a":"translation","e":"translation 번역, 번역본","k":"그 소설의 영어 번역본은 원작보다 30년 뒤에 출간되었다.","m":0,"s":"The English t______ of the novel was published thirty years after the original.","mn":"번역, 번역본","hk":"translation(번역)은 translate(번역하다)에서 철자를 가져오기. trans로 시작해 tion으로 끝.","ex":[["I read [[the English translation]].","나는 [[영어 번역본]]을 읽었다."],["[[Machine translation]] is fast but not perfect.","[[기계 번역]]은 빠르지만 완벽하지 않다."],["Poems sometimes lose meaning [[in translation]].","시는 때때로 [[번역 과정에서]] 의미를 잃는다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"stuff","a":"4","e":"①물건, 것들 / ②용품, 물건 / ③물건, 것들 / ④쑤셔 넣다 [④번만 의미가 다름]","k":"①네 물건들을 부엌 식탁 여기저기에 두지 마라.\n②손님들이 도착하기 전에 청소용품을 좀 사야 한다.\n③그 상자는 할아버지의 작업장에서 나온 오래된 물건들로 가득 차 있었다.\n④그녀는 겨울옷 전부를 작은 가방 하나에 쑤셔 넣어야 했다.","m":0,"c":["Don't leave your stuff all over the kitchen table.","I need to buy some cleaning stuff before the guests arrive.","The box was full of old stuff from my grandfather's workshop.","She had to stuff all her winter clothes into one small bag."],"hc":"stuff|stuff|stuff|stuff","mn":"물건, 것들 / 쑤셔 넣다","hk":"stuff(물건, 명사)는 물건을 뭉뚱그려 부르는 말이고 stuff(쑤셔 넣다, 동사)는 구겨 넣는 동작이라 ④만 뜻이 다름. 앞의 세 문장은 모두 물건.","ex":[["I left [[my stuff]] at school.","나는 학교에 [[내 물건]]을 두고 왔다.","stuff (명) 물건, 것들"],["The attic is full of [[old stuff]].","다락방에는 [[오래된 물건]]이 가득하다.","stuff (명) 물건, 것들"],["He tried to [[stuff the clothes]] into a small bag.","그는 작은 가방에 [[옷을 쑤셔 넣으려]] 했다.","stuff (동) 쑤셔 넣다"]]}]},{"day":51,"q":[{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"tenacity","a":"2","e":"② tenacity: 끈기, 집요함","w":"① prudence: 신중함\n③ generosity: 관대함, 너그러움\n④ humility: 겸손함","m":0,"s":"tenacity","c":["신중함","끈기, 집요함","관대함","겸손함"],"mn":"끈기, 집요함","hk":"tenacity(끈기)는 포기하지 않고 끝까지 버티는 힘, 같은 편은 persistence(끈기). prudence(신중함)는 조심성, humility(겸손함)는 낮추는 태도라 오답.","ex":[["He fought for his dream [[with great tenacity]].","그는 [[대단한 끈기로]] 자신의 꿈을 위해 싸웠다."],["The team [[showed tenacity]] in the final game.","그 팀은 결승전에서 [[끈기를 보여 주었다]]."],["Her [[tenacity and hard work]] paid off.","그녀의 [[끈기와 노력]]이 결실을 맺었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"revenge","a":"4","e":"④ forgiveness: 용서 (그는 자기 가족의 사업을 망친 그 남자에게 복수할 계획을 세우며 여러 해를 보냈다.) / revenge(복수, 앙갚음)의 반의어.","w":"① hostility: 적의, 적대감\n② loathing: 혐오\n③ indignation: 분개, 분노","k":"그는 자기 가족의 사업을 망친 그 남자에게 복수할 계획을 세우며 여러 해를 보냈다.","m":0,"s":"He spent years planning revenge on the man who destroyed his family business.","h":"revenge","c":["hostility","loathing","indignation","forgiveness"],"mn":"복수, 앙갚음","hk":"revenge(복수)의 반대편은 forgiveness(용서). hostility(적의)·loathing(혐오)·indignation(분개)은 모두 화난 감정이라 같은 편, 반의어 아님.","ex":[["He swore to [[take revenge]] on the thief.","그는 도둑에게 [[복수하겠다고]] 맹세했다.","revenge (명) 복수, 앙갚음"],["She gave up [[a desire for revenge]] and moved on.","그녀는 [[복수하려는 마음]]을 버리고 앞으로 나아갔다.","revenge (명) 복수, 앙갚음"],["He [[asked for her forgiveness]] after the mistake.","그는 실수를 한 뒤 [[그녀의 용서를 구했다]].","forgiveness (명) 용서"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"rigor","a":"2","e":"rigor (명) 엄격함, 철저함 - rigorous (형) 엄격한, 철저한\n② cognition (명) 인지, 인식 능력 - cognitive (형) 인지적인","w":"① tolerate (동) 용인하다, 참다 - tolerable (형) 견딜 만한\n③ mourn (동) 애도하다, 슬퍼하다 - mournful (형) 슬픔에 잠긴, 애절한\n④ resent (동) 분개하다, 억울해하다 - resentful (형) 분개한, 억울해하는","m":0,"s":"rigor - rigorous","c":["tolerate - tolerable","cognition - cognitive","mourn - mournful","resent - resentful"],"mn":"엄격함, 철저함","hk":"rigor(엄격함)-rigorous(엄격한)는 명사에서 형용사로 가는 관계. cognition(인지)-cognitive(인지적인)가 같은 방향, tolerate(용인하다) 등은 동사 출발이라 오답.","ex":[["The scientist worked with [[great rigor]].","그 과학자는 [[대단한 철저함으로]] 일했다.","rigor (명) 엄격함, 철저함"],["The army gave the new soldiers [[rigorous training]].","군대는 신병들에게 [[엄격한 훈련]]을 시켰다.","rigorous (형) 엄격한, 철저한"],["Sleep is important for [[human cognition]].","잠은 [[인간의 인지 능력]]에 중요하다.","cognition (명) 인지, 인식 능력"],["Reading helps [[cognitive development]] in children.","독서는 아이들의 [[인지 발달]]에 도움이 된다.","cognitive (형) 인지적인"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"harness","a":"1","e":"① harness: 이용하다, 활용하다 (기술자들은 전기를 생산하기 위해 바다 파도의 에너지를 활용하려고 애쓰고 있다.)","w":"② sequester: 격리하다, 가두다\n③ garner: 모으다, 획득하다\n④ salvage: 회수하다, 구조하다","k":"기술자들은 전기를 생산하기 위해 바다 파도의 에너지를 활용하려고 애쓰고 있다.","m":0,"s":"Engineers are trying to ________ the energy of ocean waves to produce electricity.","c":["harness","sequester","garner","salvage"],"mn":"이용하다, 활용하다","hk":"harness(이용하다)는 파도·바람 같은 자연의 힘을 끌어다 쓰는 느낌. harness the energy(에너지를 이용하다)가 대표 짝, sequester(격리하다)는 오답.","ex":[["Farms can [[harness the wind]] to make power.","농장은 전력을 만들기 위해 [[바람을 이용할]] 수 있다."],["The city plans to [[harness solar energy]] for its buses.","그 도시는 버스에 쓰려고 [[태양 에너지를 활용할]] 계획이다."],["Good teachers [[harness students' curiosity]] to make lessons fun.","좋은 교사는 수업을 재미있게 하려고 [[학생들의 호기심을 활용한다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"journey","a":"journey","e":"journey 여정, 여행","k":"사막을 가로지르는 그들의 여정은 2주가 넘게 걸렸다.","m":0,"s":"Their j______ across the desert took more than two weeks.","mn":"여정, 여행","hk":"journey(여정)는 jour(철자)로 시작해 ney(철자)로 끝남. trip(여행)보다 길고 먼 여정의 느낌을 주는 단어.","ex":[["Their [[long journey]] ended at a small village.","그들의 [[긴 여정]]은 작은 마을에서 끝났다."],["We [[went on a journey]] across the country by train.","우리는 기차로 전국을 가로지르는 [[여행을 떠났다]]."],["[[The journey home]] took three hours.","[[집으로 가는 여정]]은 세 시간이 걸렸다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"peak","a":"3","e":"③ summit: 정상, 산꼭대기 (등반가들이 그 산의 정상에 도달하는 데 이틀이 더 걸렸다.) / peak(정상, 꼭대기)의 유의어.","w":"① undergrowth: 하층 식생, 덤불\n② basin: 분지, 유역\n④ ridge: 산등성이, 능선","k":"등반가들이 그 산의 정상에 도달하는 데 이틀이 더 걸렸다.","m":0,"s":"It took the climbers two more days to reach the peak of the mountain.","h":"peak","c":["undergrowth","basin","summit","ridge"],"mn":"정상, 꼭대기","hk":"peak(정상)의 같은 편은 summit(정상). ridge(능선)는 산등성이 길, basin(분지)은 움푹한 땅, undergrowth(덤불)는 풀숲이라 오답.","ex":[["They finally reached [[the peak]] at noon.","그들은 정오에 마침내 [[정상]]에 도착했다."],["[[The highest peak]] in the area is covered in snow.","그 지역의 [[가장 높은 봉우리]]는 눈으로 덮여 있다."],["We took a photo from [[the peak of the hill]].","우리는 [[언덕 꼭대기]]에서 사진을 찍었다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"protagonist","a":"1","e":"① protagonist: (이야기, 연극, 또는 영화의 주된 인물 / 그를 중심으로 대부분의 사건이 일어나는) 주인공 (이야기, 연극, 영화에서 대부분의 사건이 그를 중심으로 일어나는 주요 인물)","w":"② correspondent: 특파원, 통신원\n③ columnist: 칼럼니스트, 신문 논평가\n④ narrator: 서술자, 화자","k":"이야기, 연극, 또는 영화의 주된 인물 / 그를 중심으로 대부분의 사건이 일어나는","m":0,"s":"\"the main character in a story, a play, or a film, around whom most of the events happen\"","c":["protagonist","correspondent","columnist","narrator"],"mn":"주인공 (이야기, 연극, 영화에서 대부분의 사건이 그를 중심으로 일어나는 주요 인물)","hk":"protagonist(주인공)는 사건의 중심 인물. narrator(서술자)는 이야기를 전하는 사람, correspondent(특파원)와 columnist(칼럼니스트)는 기자·글쓴이라 오답.","ex":[["He was chosen to [[play the protagonist]] in the school play.","그는 학교 연극에서 [[주인공을 맡도록]] 뽑혔다."],["[[The protagonist of the story]] must solve a mystery.","[[그 이야기의 주인공]]은 수수께끼를 풀어야 한다."],["Readers cheered for [[the brave protagonist]].","독자들은 [[그 용감한 주인공]]을 응원했다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"retail","a":"4","e":"④ wholesale: 도매의 (그 회사는 이 신발을 약 50달러의 소매가에 판매한다.) / retail(소매의)의 반의어.","w":"① fiscal: 재정의, 회계의\n② monetary: 통화의, 금융의\n③ budgetary: 예산의","k":"그 회사는 이 신발을 약 50달러의 소매가에 판매한다.","m":0,"s":"The company sells these shoes at a retail price of about fifty dollars.","h":"retail","c":["fiscal","monetary","budgetary","wholesale"],"mn":"소매의","hk":"retail(소매의)은 낱개로 파는 쪽, 반대편은 wholesale(도매의)로 한꺼번에 대량 판매. fiscal(재정의)·monetary(통화의)는 돈 관련일 뿐 반의어 아님.","ex":[["[[The retail price]] is higher than the factory price.","[[소매가]]는 공장 가격보다 높다.","retail (형) 소매의"],["She works in [[retail sales]] at a department store.","그녀는 백화점에서 [[소매 판매]] 일을 한다.","retail (형) 소매의"],["We buy rice at [[wholesale prices]] to save money.","우리는 돈을 아끼려고 [[도매 가격]]으로 쌀을 산다.","wholesale (형) 도매의"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"sack","a":"sack","e":"sack (명) 자루, 부대 / (동) 해고하다","k":"그 농부는 무거운 쌀 자루를 트럭 뒤에 실어 올렸다.\n그 관리자는 안전 규칙을 무시하는 직원은 누구든 해고하겠다고 경고했다.","m":0,"s":"The farmer lifted a heavy s______ of rice onto the back of the truck.\nThe manager warned that he would s______ any worker who ignored the safety rules.","mn":"자루, 부대 / 해고하다","hk":"sack(자루, 해고하다)은 명사 자루와 동사 해고하다를 한 단어로. a sack of rice(쌀 자루), sack a worker(직원을 해고하다)로 묶기.","ex":[["He carried [[a sack of potatoes]] into the kitchen.","그는 [[감자 한 자루]]를 부엌으로 날랐다.","sack (명) 자루, 부대"],["The shop keeps flour in [[a large sack]].","그 가게는 밀가루를 [[큰 자루]]에 보관한다.","sack (명) 자루, 부대"],["The boss decided to [[sack the manager]] after the mistake.","사장은 실수를 한 뒤 [[그 관리자를 해고하기로]] 했다.","sack (동) 해고하다"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"threshold","a":"4","e":"④ threshold: 임계점, 문턱","w":"① benchmark: 기준점, 척도\n② yardstick: 기준, 잣대\n③ parameter: 매개변수, 한도","m":0,"s":"\"임계점, 문턱\"","c":["benchmark","yardstick","parameter","threshold"],"mn":"임계점, 문턱","hk":"threshold(임계점)는 넘으면 상황이 바뀌는 경계선, 현관 문턱도 같은 단어. benchmark(기준점)·yardstick(잣대)는 비교용 기준이라 오답.","ex":[["She has a high [[pain threshold]].","그녀는 [[통증 임계점]]이 높다."],["He stopped at [[the threshold]] and looked inside.","그는 [[문턱]]에서 멈춰 안을 들여다봤다."],["We are on [[the threshold of a new era]].","우리는 [[새로운 시대의 문턱]]에 서 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"rebellion","a":"3,4","e":"③ revolt: 반란 (불공평한 세금이 결국 가난한 농부들 사이에서 반란을 일으켰다.) / rebellion(반란, 반역)의 유의어.\n④ uprising: 봉기, 민중 혁명","w":"① conquest: 정복\n② regime: 정권, 체제","k":"불공평한 세금이 결국 가난한 농부들 사이에서 반란을 일으켰다.","m":2,"s":"The unfair taxes finally caused a rebellion among the poor farmers.","h":"rebellion","c":["conquest","regime","revolt","uprising"],"mn":"반란, 반역","hk":"rebellion(반란)의 같은 편은 revolt(반란)·uprising(봉기). conquest(정복)는 밖에서 쳐들어가 차지함, regime(정권)은 다스리는 체제라 오답.","ex":[["The soldiers led [[a rebellion against the king]].","병사들은 [[왕에 맞선 반란]]을 이끌었다."],["The leaders of [[the armed rebellion]] were arrested.","[[무장 반란]]의 지도자들은 체포되었다."],["The students [[rose in rebellion]] against the strict rules.","학생들은 엄격한 규칙에 맞서 [[반란을 일으켰다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"hibernate","a":"2","e":"② hibernate: (겨울을 잠자며 보내다 / 깊고 활동이 없는 상태로 / 일부 동물들이 그러하듯이) 동면하다 (일부 동물들이 그러하듯 깊고 활동하지 않는 상태로 잠을 자며 겨울을 나다)","w":"① spawn: 산란하다\n③ ingest: 섭취하다, 받아들이다\n④ photosynthesize: 광합성하다","k":"겨울을 잠자며 보내다 / 깊고 활동이 없는 상태로 / 일부 동물들이 그러하듯이","m":0,"s":"\"to spend the winter sleeping in a deep, inactive state, as some animals do\"","c":["spawn","hibernate","ingest","photosynthesize"],"mn":"동면하다 (일부 동물들이 그러하듯 깊고 활동하지 않는 상태로 잠을 자며 겨울을 나다)","hk":"hibernate(동면하다)는 겨울 내내 깊이 잠드는 것. 알을 낳는 spawn(산란하다), 먹는 ingest(섭취하다), 빛으로 양분 만드는 photosynthesize(광합성하다)는 오답.","ex":[["Bears [[hibernate in winter]] to save energy.","곰은 에너지를 아끼려고 [[겨울에 동면한다]]."],["Some animals [[hibernate in caves]].","어떤 동물들은 [[동굴에서 동면한다]]."],["The hedgehog [[began to hibernate]] after the first snow.","고슴도치는 첫눈이 온 뒤 [[동면하기 시작했다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"wield","a":"4","e":"④ wield: (권력을) 행사하다, 휘두르다 (그 늙은 왕은 여전히 의회에 대해 막대한 권력을 행사한다.)","w":"① relinquish: 포기하다, 내놓다\n② govern: 통치하다, 지배하다\n③ ratify: 비준하다, 승인하다","k":"그 늙은 왕은 여전히 의회에 대해 막대한 권력을 행사한다.","m":0,"s":"The old king continues to ________ enormous power over the council.","c":["relinquish","govern","ratify","wield"],"mn":"(권력을) 행사하다, 휘두르다","hk":"wield(휘두르다)는 칼이나 권력 같은 힘을 손에 쥐고 쓰는 느낌. wield power(권력을 행사하다)가 대표 짝, relinquish(포기하다)는 내려놓는 반대 방향.","ex":[["The mayor [[wields great power]] in the city.","그 시장은 도시에서 [[큰 권력을 행사한다]]."],["The knight [[wielded a heavy sword]] in battle.","그 기사는 전투에서 [[무거운 검을 휘둘렀다]]."],["Social media can [[wield strong influence]] over teens.","소셜 미디어는 십 대에게 [[강한 영향력을 행사할]] 수 있다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"protein","a":"protein","e":"protein 단백질","k":"콩과 달걀은 값싼 단백질 공급원이다.","m":0,"s":"Beans and eggs are cheap sources of p______.","mn":"단백질","hk":"protein(단백질)은 pro(철자)+tein(철자)로 나눠 기억하고, ei(철자) 순서가 헷갈리는 포인트. 콩·달걀에 든 영양소.","ex":[["Fish is [[a good source of protein]].","생선은 [[좋은 단백질 공급원]]이다."],["Athletes eat [[high-protein foods]] after training.","운동선수들은 훈련 후 [[고단백 음식]]을 먹는다."],["Our bodies need [[protein to build muscle]].","우리 몸에는 [[근육을 만들 단백질]]이 필요하다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"nature","a":"2","e":"①천성, 성품 / ②자연 / ③천성, 성품 / ④천성, 본성 [②번만 의미가 다름]","k":"①친절함은 그가 어린아이였을 때부터 그의 천성의 일부였다.\n②아이들은 숲속을 천천히 걸으며 자연에 대해 배운다.\n③그의 온화한 성품은 그를 반의 모든 사람에게 인기 있게 만들었다.\n④작은 문제로 불평하는 것은 그녀의 천성이 아니다.","m":0,"c":["Kindness has been part of his nature ever since he was a little child.","Children learn about nature by walking slowly through the woods.","His gentle nature made him popular with everyone in the class.","It is not in her nature to complain about small problems."],"hc":"nature|nature|nature|nature","mn":"천성, 성품 / 자연","hk":"nature(천성, 성품)는 사람의 타고난 기질이라는 뜻이 공통이고, 숲에서 배우는 nature(자연)만 뜻이 다름. human nature(인간 본성)는 천성 쪽.","ex":[["It is [[part of his nature]] to help others.","남을 돕는 것은 [[그의 천성의 일부]]이다.","nature (명) 천성, 성품"],["She has [[a kind nature]] and many friends.","그녀는 [[친절한 성품]]을 지녀 친구가 많다.","nature (명) 천성, 성품"],["We went hiking to enjoy [[the beauty of nature]].","우리는 [[자연의 아름다움]]을 즐기러 하이킹을 갔다.","nature (명) 자연"]]}]},{"day":52,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"opponent","a":"3","e":"③ opponent: (당신과 겨루는 사람 / 경기나 시합이나 논쟁에서) 상대, 적수","w":"① backer: 후원자\n② companion: 동반자, 동료\n④ supporter: 지지자, 응원자","k":"당신과 겨루는 사람 / 경기나 시합이나 논쟁에서","m":0,"s":"\"a person who competes against you in a game, contest, or argument\"","c":["backer","companion","opponent","supporter"],"mn":"상대, 적수","hk":"opponent(상대)는 경기·논쟁에서 맞서는 사람. backer(후원자)·supporter(지지자)·companion(동반자)은 곁에서 돕는 반대쪽이라 오답.","ex":[["The player shook hands with [[his opponent]].","그 선수는 [[상대]]와 악수했다."],["The boxer faced [[a strong opponent]] in the final.","그 권투 선수는 결승에서 [[강한 상대]]와 맞붙었다."],["The team beat [[a tough opponent]] last night.","그 팀은 어젯밤 [[만만찮은 상대]]를 이겼다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"profound","a":"2","e":"② profound: 깊은, 심오한","w":"① 얕은, 피상적인(superficial)\n③ 뚜렷한, 명백한(evident)\n④ 좁은, 편협한(narrow)","m":0,"s":"profound","c":["얕은, 피상적인","깊은, 심오한","뚜렷한, 명백한","좁은, 편협한"],"mn":"깊은, 심오한","hk":"profound(깊은)는 겉이 아니라 속까지 닿는 깊이, profound impact(깊은 영향)가 대표 짝. 반대편은 superficial(얕은).","ex":[["The book had [[a profound effect]] on her life.","그 책은 그녀의 삶에 [[깊은 영향]]을 주었다."],["He asked [[a profound question]] about life.","그는 삶에 대해 [[심오한 질문]]을 했다."],["I feel [[profound sadness]] about the news.","나는 그 소식에 [[깊은 슬픔]]을 느낀다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"immune","a":"3,4","e":"③ susceptible: (영향을) 받기 쉬운, 민감한 (이 사무실에서 연말 마감의 압박에 영향을 받지 않는 사람은 아무도 없다.) / immune((영향을) 받지 않는, 면역이 된)의 반의어.\n④ vulnerable: 취약한, 상처받기 쉬운","w":"① resistant: 저항력이 있는(유의어 함정)\n② protected: 보호받는(유의어 함정)","k":"이 사무실에서 연말 마감의 압박에 영향을 받지 않는 사람은 아무도 없다.","m":2,"s":"Nobody in this office is immune to the pressure of the year-end deadline.","h":"immune","c":["resistant","protected","susceptible","vulnerable"],"mn":"(영향을) 받지 않는, 면역이 된","hk":"immune(영향을 받지 않는)의 반대편은 susceptible(받기 쉬운)·vulnerable(취약한). resistant(저항력 있는)·protected(보호받는)는 같은 편이라 속임수.","ex":[["Some people are [[immune to the disease]].","어떤 사람들은 [[그 병에 면역이 되어]] 있다.","immune (형) (영향을) 받지 않는, 면역이 된"],["Young children are [[susceptible to colds]].","어린아이들은 [[감기에 걸리기 쉽다]].","susceptible (형) (영향을) 받기 쉬운, 민감한"],["The old bridge is [[vulnerable to storms]].","그 오래된 다리는 [[폭풍에 취약하다]].","vulnerable (형) 취약한, 상처받기 쉬운"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"hasten","a":"3","e":"③ hasten: 앞당기다, 재촉하다 (해수 온도의 상승은 극지방 만년설이 녹는 것을 앞당길 것으로 예상된다.)","w":"① slow: 늦추다, 둔화시키다\n② stall: 지연시키다, 멈추게 하다\n④ reverse: 뒤집다, 역전시키다","k":"해수 온도의 상승은 극지방 만년설이 녹는 것을 앞당길 것으로 예상된다.","m":0,"s":"Rising ocean temperatures are expected to ________ the melting of the polar ice caps.","c":["slow","stall","hasten","reverse"],"mn":"앞당기다, 재촉하다","hk":"hasten(앞당기다)은 haste(서두름)에서 온 말로 일을 더 빨리 일어나게 함. slow(늦추다)·stall(지연시키다)은 반대 방향, reverse(뒤집다)도 빨라지게 하는 뜻이 아님.","ex":[["Stress can [[hasten aging]].","스트레스는 [[노화를 앞당길]] 수 있다."],["The bad news [[hastened his decision]] to leave.","그 나쁜 소식은 떠나겠다는 [[그의 결정을 앞당겼다]]."],["Heavy rain may [[hasten the end]] of the festival.","폭우는 축제의 [[끝을 앞당길]] 수 있다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"abundance","a":"abundance","e":"abundance 풍부함, 많음","k":"그 지역은 많은 산악 하천 덕분에 풍부한 담수를 누린다.","m":0,"s":"The region enjoys an a______ of fresh water thanks to its many mountain rivers.","mn":"풍부함, 많음","hk":"abundance(풍부함)는 끝이 ance(철자)인 명사, 형용사 abundant(풍부한)는 ant(철자)로 끝나는 차이를 철자로 구분.","ex":[["The farm has [[an abundance of fruit]].","그 농장에는 [[풍부한 과일]]이 있다."],["Wild animals live here [[in abundance]].","이곳에는 야생 동물이 [[풍부하게]] 산다."],["The park is known for [[its abundance of wildlife]].","그 공원은 [[풍부한 야생 동물]]로 유명하다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"architect","a":"2","e":"② architect: 건축가, 설계자","w":"① carpenter: 목수\n③ athlete: 운동선수\n④ professor: 교수","m":0,"s":"\"건축가, 설계자\"","c":["carpenter","architect","athlete","professor"],"mn":"건축가, 설계자","hk":"architect(건축가)는 건물을 설계하는 사람, 직접 나무로 만드는 carpenter(목수)와 구분. athlete(운동선수)·professor(교수)는 전혀 다른 직업.","ex":[["We need to [[hire an architect]] for the new house.","우리는 새 집을 위해 [[건축가를 고용해야]] 한다."],["She wants to become [[an architect]] when she grows up.","그녀는 자라서 [[건축가]]가 되고 싶어 한다."],["[[The architect of the bridge]] won a prize.","[[그 다리의 설계자]]가 상을 받았다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"reserved","a":"reserved","e":"※ reticent도 정답으로 인정한다. (reserved / reticent 모두 ‘말수가 적은’)","k":"그는 매우 내성적인 사람이어서 가장 친한 친구들조차 그의 감정에 대해 거의 알지 못한다.","m":0,"s":"He is such a r______ person that even his closest friends know very little about his feelings.","al":"reticent","hk":"reserved(내성적인)는 속마음을 잘 드러내지 않고 말수가 적은 성격. reticent(말수가 적은)도 정답, 철자는 reserve(남겨 두다)에 d(철자)가 붙은 모양.","ex":[["He is [[a quiet and reserved person]].","그는 [[조용하고 내성적인 사람]]이다."],["Her [[reserved manner]] made it hard to know her.","그녀의 [[말수 적은 태도]] 때문에 그녀를 알기 어려웠다."],["Our neighbors are [[reserved but friendly]].","우리 이웃은 [[내성적이지만 다정하다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"explore","a":"3","e":"explore (동) 탐험하다, 탐구하다 - exploration (명) 탐험, 탐구\n③ invent (동) 발명하다 - invention (명) 발명, 발명품","w":"① violent (형) 폭력적인 - violence (명) 폭력\n② lonely (형) 외로운 - loneliness (명) 외로움\n④ silent (형) 조용한, 침묵하는 - silence (명) 침묵, 고요","m":0,"s":"explore - exploration","c":["violent - violence","lonely - loneliness","invent - invention","silent - silence"],"mn":"탐험하다, 탐구하다","hk":"explore(탐험하다)-exploration(탐험)은 동사에서 명사로 가는 관계. invent(발명하다)-invention(발명)이 같은 방향, violent(폭력적인) 등은 형용사 출발.","ex":[["Children love to [[explore the forest]].","아이들은 [[숲을 탐험하는]] 것을 아주 좋아한다.","explore (동) 탐험하다, 탐구하다"],["[[Space exploration]] costs a lot of money.","[[우주 탐사]]에는 많은 돈이 든다.","exploration (명) 탐험, 탐구"],["Who [[invented the telephone]]?","누가 [[전화기를 발명했을까]]?","invent (동) 발명하다"],["The wheel was [[a great invention]].","바퀴는 [[위대한 발명품]]이었다.","invention (명) 발명, 발명품"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"tighten","a":"4","e":"④ loosen: 느슨하게 하다, 풀다 (책을 올려놓기 전에 선반의 나사를 단단히 조여 주세요.) / tighten(조이다, 단단히 죄다)의 반의어.","w":"① clamp: 꽉 죄다, 고정하다(유의어 함정)\n② bind: 묶다, 동여매다(유의어 함정)\n③ stiffen: 뻣뻣하게 하다(유의어 함정)","k":"책을 올려놓기 전에 선반의 나사를 단단히 조여 주세요.","m":0,"s":"Please tighten the screws on the shelf before you put any books on it.","h":"tighten","c":["clamp","bind","stiffen","loosen"],"mn":"조이다, 단단히 죄다","hk":"tighten(조이다)의 반대편은 loosen(느슨하게 하다). clamp(꽉 죄다)·bind(묶다)·stiffen(뻣뻣하게 하다)은 조이는 쪽이라 같은 편, 속임수 보기.","ex":[["She [[tightened the screws]] on the chair.","그녀는 의자의 [[나사를 조였다]].","tighten (동) 조이다, 단단히 죄다"],["He [[tightened his belt]] and kept walking.","그는 [[허리띠를 조이고]] 계속 걸었다.","tighten (동) 조이다, 단단히 죄다"],["She [[loosened her tie]] after the long meeting.","그녀는 긴 회의 뒤에 [[넥타이를 느슨하게 풀었다]].","loosen (동) 느슨하게 하다, 풀다"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"hazard","a":"2","e":"② risk: 위험, 위험 요소 (오래된 건물의 결함 있는 전기 배선은 심각한 화재 위험 요소이다.) / hazard(위험, 위험 요소)의 유의어.","w":"① trouble: 문제, 골칫거리\n③ flaw: 결함, 흠\n④ drawback: 단점, 문제점","k":"오래된 건물의 결함 있는 전기 배선은 심각한 화재 위험 요소이다.","m":0,"s":"Faulty electrical wiring in an old building is a serious fire hazard.","h":"hazard","c":["trouble","risk","flaw","drawback"],"mn":"위험, 위험 요소","hk":"hazard(위험 요소)의 같은 편은 risk(위험). fire hazard(화재 위험 요소)가 대표 짝. trouble(문제)·flaw(결함)·drawback(단점)은 위험이 아니라 문제점.","ex":[["Wet floors are [[a safety hazard]].","젖은 바닥은 [[안전상의 위험 요소]]이다."],["Smoking is [[a health hazard]].","흡연은 [[건강 위험 요소]]이다."],["Loose wires can [[pose a hazard]] to children.","헐거운 전선은 아이들에게 [[위험이 될]] 수 있다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"withdrawn","a":"1","e":"① withdrawn: 내성적인, 위축된 (그 사고 이후로 그는 조용하고 내성적으로 변했고, 좀처럼 단체 대화에 끼지 않는다.)","w":"② tidy: 깔끔한, 단정한\n③ stingy: 인색한, 쩨쩨한\n④ boastful: 자랑하기 좋아하는","k":"그 사고 이후로 그는 조용하고 내성적으로 변했고, 좀처럼 단체 대화에 끼지 않는다.","m":0,"s":"Ever since the accident, he has become quiet and ________, and he hardly ever joins group conversations.","c":["withdrawn","tidy","stingy","boastful"],"mn":"내성적인, 위축된","hk":"withdrawn(위축된)은 withdraw(물러나다)에서 온 말로 사람들에게서 물러선 상태. tidy(깔끔한)·stingy(인색한)·boastful(자랑하는)은 속임수 보기.","ex":[["After moving, the boy became [[quiet and withdrawn]].","이사한 뒤 그 소년은 [[조용하고 위축되었다]]."],["He looked [[tired and withdrawn]] at breakfast.","그는 아침 식사 때 [[지치고 위축돼]] 보였다."],["[[A withdrawn child]] may need extra help at school.","[[내성적인 아이]]는 학교에서 추가 도움이 필요할 수 있다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"thaw","a":"1","e":"① thaw: (다시 부드러워지거나 액체가 되다 / 얼어 있던 뒤에) (언 것이) 녹다, 해동되다","w":"② solidify: 굳어지다, 고체가 되다\n③ swell: 붓다, 부풀다\n④ float: 뜨다, 떠다니다","k":"다시 부드러워지거나 액체가 되다 / 얼어 있던 뒤에","m":0,"s":"\"to become soft or liquid again after having been frozen\"","c":["thaw","solidify","swell","float"],"mn":"(언 것이) 녹다, 해동되다","hk":"thaw((언 것이) 녹다)는 얼었던 것이 다시 풀리는 것. solidify(굳어지다)는 반대 방향이고 swell(붓다)·float(뜨다)는 얼음과 무관.","ex":[["The snow began to [[thaw in spring]].","눈은 [[봄에 녹기]] 시작했다."],["Frozen meat must [[thaw before cooking]].","냉동 고기는 [[요리하기 전에 해동되어야]] 한다."],["The river ice [[thawed in the warm sun]].","강의 얼음은 [[따뜻한 햇볕에 녹았다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"demand","a":"2,3","e":"② request: 요청하다, 요구하다 (화가 난 고객들은 결함이 있는 제품에 대해 전액 환불을 요구하기 시작했다.) / demand(요구하다, 강력히 요청하다)의 유의어.\n③ claim: 요구하다, 청구하다","w":"① refuse: 거절하다\n④ offer: 제공하다, 제의하다","k":"화가 난 고객들은 결함이 있는 제품에 대해 전액 환불을 요구하기 시작했다.","m":2,"s":"Angry customers began to demand a full refund for the defective product.","h":"demand","c":["refuse","request","claim","offer"],"mn":"요구하다, 강력히 요청하다","hk":"demand(요구하다)의 같은 편은 request(요청하다)·claim(요구하다).
