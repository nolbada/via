<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>그래머인사이드 L1 정답</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211f;--sub:#5b6b67;--line:#dbe3e0;--a:#a21caf;--soft:#f8e1fb}
@media (prefers-color-scheme:dark){:root{--bg:#10171a;--card:#182125;--ink:#e8eeec;--sub:#9db0ab;--line:#2a3639;--a:#d946ef;--soft:#3a1140}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{font-size:13px;color:var(--sub);margin:0 0 20px}
.ch{border:3px solid var(--a);background:var(--soft);border-radius:16px;padding:4px 12px 12px;margin:0 0 14px}
.ch h2{display:flex;align-items:baseline;justify-content:space-between;gap:10px;font-size:16px;font-weight:900;letter-spacing:.06em;color:#fff;background:var(--a);border-radius:12px;padding:10px 14px;margin:8px 0 10px}
.ch h2 span{font-size:13px;font-weight:700;letter-spacing:0;opacity:.95}
.un{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.un a{display:flex;align-items:center;justify-content:center;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px 0;color:var(--ink);text-decoration:none;font-size:20px;font-weight:800}
.un a:active{background:var(--line)}
</style>
</head>
<body>
<main>
<h1>그래머인사이드 L1 정답</h1>
<p class="sub">교사용</p>
<section class="ch"><h2>CHAPTER 01</h2><div class="un"><a href="https://nolbada.github.io/via/grammar-inside/l1-u01-key/">01</a></div></section>
</main>
</body>
</html>
