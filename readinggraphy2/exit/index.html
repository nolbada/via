opts":["왕위에 앉히다","그림을 그리다","돌려주다","부수다"],"word":"crown","r":{"ev":"4번 문장","w":"4번에서 돌은 새 왕을 정하는 의식(3번)에서 쓰였음. crown은 왕관을 씌워 왕위에 앉히다. 돌려주다(return)는 9번에 나오는 다른 단어.","c":1,"s":[[4,"Originally, the Stone of Destiny was used to crown Scottish kings.","원래, 운명의 돌은 스코틀랜드 왕들을 왕위에 앉히는 데 사용되었다."]],"a":"1) 왕위에 앉히다"},"h":"75e924bfa5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the British government officially returned the stone to Scotland.)","ko":"(영국 정부는 ... 그 돌을 스코틀랜드에 돌려주었다.)","opts":["우연히","몰래","공식적으로","천천히"],"word":"officially","r":{"ev":"9번 문장","w":"9번에서 영국 정부(government)가 돌을 돌려주었다는 내용. 정부가 하는 일이므로 officially = 공식적으로. 몰래(secretly)는 맞지 않음.","c":3,"s":[[9,"Finally, in 1996, the British government officially returned the stone to Scotland.","마침내, 1996년에 영국 정부는 공식적으로 그 돌을 스코틀랜드에 돌려주었다."]],"a":"3) 공식적으로"},"h":"59d1f6b8b6"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe wanted to show off his power and control over the Scottish people.","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 자신의 권력과 스코틀랜드 사람들에 대한 통제력을 과시하고 싶어 했다.","opts":["스코틀랜드의 왕","영국 왕 에드워드 1세","영국 정부","스코틀랜드 사람"],"r":{"ev":"5~6번 문장","w":"5번에서 영국 왕 에드워드 1세가 돌을 가져갔고, 6번 He는 그 왕. 권력을 과시하고 싶어 돌을 가져간 사람.","c":2,"s":[[5,"However, in 1296, an English king named Edward I took the stone from Scotland.","하지만, 1296년에 영국의 왕인 에드워드 1세가 스코틀랜드에서 그 돌을 가져갔다."],[6,"He wanted to show off his power and control over the Scottish people.","그는 자신의 권력과 스코틀랜드 사람들에 대한 통제력을 과시하고 싶어 했다."]],"a":"2) 영국 왕 에드워드 1세"},"h":"6b0db5649f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They felt like a missing part of their history was finally back!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 자신들의 역사 중 잃어버린 부분이 마침내 돌아온 것처럼 느꼈다!","opts":["그들은 자신들의 역사가 완전히 사라졌다고 느꼈다.","그들은 새로운 역사를 만들 수 있다고 느꼈다.","그들은 역사 시간에 빠진 부분을 배웠다고 느꼈다.","잃어버렸던 역사의 한 부분이 마침내 돌아온 것 같았다."],"r":{"ev":"10~11번 문장","w":"10번에서 스코틀랜드 사람들이 행복했고, 11번은 그 이유. 오래 빼앗겼던 돌이 돌아와서 역사의 빠진 조각이 돌아온 느낌이라는 뜻.","c":4,"s":[[10,"The Scottish people were happy.","스코틀랜드 사람들은 행복했다."],[11,"They felt like a missing part of their history was finally back!","그들은 자신들의 역사 중 잃어버린 부분이 마침내 돌아온 것처럼 느꼈다!"]],"a":"4) 잃어버렸던 역사의 한 부분이 마침내 돌아온 것 같았다."},"h":"0028f729e0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["스코틀랜드 사람들은 돌을 되찾고 싶어 하지 않았다.","1996년에 영국 정부는 돌을 스코틀랜드에 돌려주었다.","돌은 처음부터 영국 왕들을 위해 사용되었다.","돌은 현재 영국 런던에 있다."],"opts":["The Scottish people did not want the stone back.","In 1996, the British government returned the stone to Scotland.","The stone was used for English kings from the beginning.","The stone is now in London, England."],"r":{"ev":"4번, 8~9번, 12번 문장","w":"9번에서 1996년에 영국 정부가 돌을 스코틀랜드에 돌려줌. 8번 스코틀랜드 사람들은 되찾길 원함, 4번 원래 스코틀랜드 왕들에게 쓰임, 12번 지금은 에든버러 성에 있음이라 나머지는 틀림.","c":2,"s":[[4,"Originally, the Stone of Destiny was used to crown Scottish kings.","원래, 운명의 돌은 스코틀랜드 왕들을 왕위에 앉히는 데 사용되었다."],[8,"So, the Scottish people wanted the Stone of Destiny back for a long time.","그래서, 스코틀랜드 사람들은 오랫동안 운명의 돌을 되찾기를 원했다."],[9,"Finally, in 1996, the British government officially returned the stone to Scotland.","마침내, 1996년에 영국 정부는 공식적으로 그 돌을 스코틀랜드에 돌려주었다."],[12,"Now, you can see the stone at Edinburgh Castle in Scotland.","이제, 여러분은 스코틀랜드의 에든버러 성에서 그 돌을 볼 수 있다."]],"a":"2) In 1996, the British government returned the stone to Scotland."},"h":"15161743fe"},{"n":9,"t":"sum","q":"The English king took the stone from Scotland to show his (A), but in 1996 the stone was (B) to Scotland.","ko":"영국 왕은 자신의 (A)을 보여 주려고 스코틀랜드에서 돌을 가져갔지만, 1996년에 돌은 스코틀랜드로 (B).","oko":["(A) 슬픔 / (B) 돌려졌다","(A) 권력 / (B) 사라졌다","(A) 권력 / (B) 돌려졌다","(A) 행복 / (B) 돌려졌다","(A) 권력 / (B) 숨겨졌다"],"opts":["(A) sadness / (B) returned","(A) power / (B) lost","(A) power / (B) returned","(A) happiness / (B) returned","(A) power / (B) hidden"],"r":{"ev":"6번, 9번 문장","w":"6번에서 영국 왕은 show off his power(권력 과시)하고 싶어 했고, 9번에서 1996년에 돌이 스코틀랜드에 returned(돌려졌다). 슬픔은 스코틀랜드 사람들의 감정(7번)이라 (A)가 아님.","c":3,"s":[[6,"He wanted to show off his power and control over the Scottish people.","그는 자신의 권력과 스코틀랜드 사람들에 대한 통제력을 과시하고 싶어 했다."],[9,"Finally, in 1996, the British government officially returned the stone to Scotland.","마침내, 1996년에 영국 정부는 공식적으로 그 돌을 스코틀랜드에 돌려주었다."]],"a":"3) (A) power / (B) returned"},"h":"ee80fde05d"},{"n":10,"t":"fill","q":"Now, you can see the stone at [A] Castle in [B].","ko":"이제 여러분은 [B]의 [A] 성에서 그 돌을 볼 수 있다.","bank":["Edinburgh","Scotland","London","England","Wales","Windsor"],"bko":{"Edinburgh":"에든버러","Scotland":"스코틀랜드","London":"런던","England":"잉글랜드","Wales":"웨일스","Windsor":"윈저"},"r":{"a":"[A] Edinburgh, [B] Scotland","ev":"12번 문장","w":"12번 문장 you can see the stone at Edinburgh Castle in Scotland. 돌은 영국(잉글랜드)으로 가져갔다가(5번) 지금은 스코틀랜드로 돌아와 있으므로 London, England가 아님.","c":null,"s":[[12,"Now, you can see the stone at Edinburgh Castle in Scotland.","이제, 여러분은 스코틀랜드의 에든버러 성에서 그 돌을 볼 수 있다."]]},"h":"8a128d828b"}]},{"u":8,"id":"rg2-08-1","no":1,"ko":"방학에 새로운 도전? 음식을 구하는 자원봉사","items":[{"n":1,"t":"tf","q":"412 Food Rescue gives the food to people who really need it.","ko":"412 Food Rescue는 그 음식을 정말로 필요로 하는 사람들에게 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","w":"8번 문장 Then, we give this food to people who really need it. 모은 음식을 필요한 사람들에게 전해 준다.","c":"T","s":[[8,"Then, we give this food to people who really need it.","그 후, 우리는 이 음식을 정말로 필요로 하는 사람들에게 전해 줘요."]]},"h":"f43a9541ea"},{"n":2,"t":"tf","q":"412 Food Rescue collects leftover food only from farms.","ko":"412 Food Rescue는 오직 농장에서만 남은 음식을 수거한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번 문장에서 stores, restaurants, and farms 같은 곳(places like)에서 모은다고 함. 농장 하나만이 아니라 가게, 식당, 농장 모두.","c":"F","s":[[7,"At 412 Food Rescue, we collect leftover food from places like stores, restaurants, and farms.","412 Food Rescue에서 우리는 가게, 식당, 그리고 농장과 같은 곳에서 남은 음식을 수거해요."]]},"h":"54d29911b0"},{"n":3,"t":"tf","q":"412 Food Rescue is a group of people working together to prevent food waste.","ko":"412 Food Rescue는 음식물 쓰레기를 막기 위해 함께 일하는 사람들의 단체이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번 문장 We’re a group of people working together to prevent food waste. 그대로 나옴.","c":"T","s":[[5,"We’re a group of people working together to prevent food waste.","우리는 음식물 쓰레기를 막기 위해 함께 일하는 한 단체의 사람들이에요."]]},"h":"af2407dd3b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...working together to prevent food waste.)","ko":"(음식물 쓰레기를 ... 위해 함께 일하는)","opts":["막다","만들다","팔다","모으다"],"word":"prevent","r":{"ev":"5번 문장","w":"5번에서 음식물 쓰레기(food waste)를 prevent하려고 일하는 단체. 쓰레기가 생기지 않게 막는다는 뜻이므로 prevent = 막다, 예방하다. 모으다(collect)는 7번의 다른 단어.","c":1,"s":[[5,"We’re a group of people working together to prevent food waste.","우리는 음식물 쓰레기를 막기 위해 함께 일하는 한 단체의 사람들이에요."]],"a":"1) 막다"},"h":"71739a3a72"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...we collect leftover food from places like stores, restaurants, and farms.)","ko":"(... 가게, 식당, 농장 같은 곳에서 ... 음식을 수거한다.)","opts":["신선한","남은","비싼","맛있는"],"word":"leftover","r":{"ev":"7번 문장","w":"7번에서 가게·식당·농장에서 모으는 음식이고, 8번에서 필요한 사람에게 전해 줌. 먹고 남거나 팔고 남은 음식이라는 뜻이므로 leftover = 남은.","c":2,"s":[[7,"At 412 Food Rescue, we collect leftover food from places like stores, restaurants, and farms.","412 Food Rescue에서 우리는 가게, 식당, 그리고 농장과 같은 곳에서 남은 음식을 수거해요."]],"a":"2) 남은"},"h":"d97f5f7308"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey deliver the food for us.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 우리를 위해 음식을 배달해 준다.","opts":["가게와 식당들","농부들","배고픈 사람들","자원봉사자들"],"r":{"ev":"9~10번 문장","w":"9번에서 our amazing volunteers 없이는 이 일을 할 수 없다고 하고, 10번 They가 바로 그 자원봉사자들. 음식을 배달해 주는 사람들.","c":4,"s":[[9,"But without our amazing volunteers, we can’t do this work.","하지만 우리의 놀라운 자원봉사자들 없이는, 우리는 이 일을 할 수 없어요."],[10,"They deliver the food for us.","그들은 우리를 위해 음식을 배달해 줘요."]],"a":"4) 자원봉사자들"},"h":"d966b707f8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Our goal is to make sure food goes to people who are hungry.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리의 목표는 배고픈 사람들에게 음식이 제대로 전달되게 하는 것이죠.","opts":["우리의 목표는 배고픈 사람들에게 음식을 파는 것이다.","우리의 목표는 음식을 더 맛있게 만드는 것이다.","우리의 목표는 음식이 배고픈 사람들에게 확실히 전달되게 하는 것이다.","우리의 목표는 배고픈 사람들이 직접 음식을 만들게 하는 것이다."],"r":{"ev":"6번 문장","w":"make sure는 ‘확실히 ~하게 하다’. 음식이 배고픈 사람들에게 꼭 가게 하는 것이 목표. 음식을 판다거나 맛있게 만든다는 말은 본문에 없음.","c":3,"s":[[6,"Our goal is to make sure food goes to people who are hungry.","우리의 목표는 배고픈 사람들에게 음식이 제대로 전달되게 하는 것이죠."]],"a":"3) 우리의 목표는 음식이 배고픈 사람들에게 확실히 전달되게 하는 것이다."},"h":"6bbb65d2ba"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["412 Food Rescue는 남은 음식을 가게와 농장에 나눠 준다.","자원봉사자들은 412 Food Rescue를 위해 음식을 배달한다.","412 Food Rescue는 남은 음식을 팔아서 돈을 번다.","자원봉사자들은 배고픈 사람들을 위해 음식을 요리한다."],"opts":["412 Food Rescue gives leftover food to stores and farms.","Volunteers deliver the food for 412 Food Rescue.","412 Food Rescue sells leftover food to people.","Volunteers cook the food for hungry people."],"r":{"ev":"7~8번, 10번 문장","w":"10번에서 자원봉사자들이 우리를 위해 음식을 배달한다(deliver)고 함. 7~8번에서 음식은 가게·농장에서 모아 필요한 사람에게 주므로 첫째 선지는 거꾸로이고, 파는 것이나 요리하는 것은 본문에 없음.","c":2,"s":[[7,"At 412 Food Rescue, we collect leftover food from places like stores, restaurants, and farms.","412 Food Rescue에서 우리는 가게, 식당, 그리고 농장과 같은 곳에서 남은 음식을 수거해요."],[8,"Then, we give this food to people who really need it.","그 후, 우리는 이 음식을 정말로 필요로 하는 사람들에게 전해 줘요."],[10,"They deliver the food for us.","그들은 우리를 위해 음식을 배달해 줘요."]],"a":"2) Volunteers deliver the food for 412 Food Rescue."},"h":"41ae57e4bc"},{"n":9,"t":"sum","q":"412 Food Rescue (A) leftover food and gives it to people in need, and (B) help deliver the food.","ko":"412 Food Rescue는 남은 음식을 (A)하여 도움이 필요한 사람들에게 주고, (B)이 음식을 배달하는 것을 돕는다.","oko":["(A) 낭비하고 / (B) 자원봉사자들","(A) 팔고 / (B) 농장들","(A) 수거하여 / (B) 자원봉사자들","(A) 수거하여 / (B) 가게들","(A) 버리고 / (B) 자원봉사자들"],"opts":["(A) wastes / (B) volunteers","(A) sells / (B) farms","(A) collects / (B) volunteers","(A) collects / (B) stores","(A) throws away / (B) volunteers"],"r":{"ev":"7~8번, 10번 문장","w":"7번 collect leftover food(남은 음식을 수거), 8번 give this food to people who really need it, 10번 volunteers deliver the food. 이 단체는 쓰레기를 막는 곳이라 wastes, throws away는 반대.","c":3,"s":[[7,"At 412 Food Rescue, we collect leftover food from places like stores, restaurants, and farms.","412 Food Rescue에서 우리는 가게, 식당, 그리고 농장과 같은 곳에서 남은 음식을 수거해요."],[8,"Then, we give this food to people who really need it.","그 후, 우리는 이 음식을 정말로 필요로 하는 사람들에게 전해 줘요."],[10,"They deliver the food for us.","그들은 우리를 위해 음식을 배달해 줘요."]],"a":"3) (A) collects / (B) volunteers"},"h":"92caa892eb"},{"n":10,"t":"fill","q":"412 Food Rescue wants to prevent food [A], and its goal is to make sure food goes to people who are [B].","ko":"412 Food Rescue는 음식 [A]를 막으려 하고, 목표는 음식이 [B] 사람들에게 가게 하는 것이다.","bank":["waste","hungry","summer","volunteers","farms","leftover"],"bko":{"waste":"쓰레기, 낭비","hungry":"배고픈","summer":"여름","volunteers":"자원봉사자들","farms":"농장들","leftover":"남은"},"r":{"a":"[A] waste, [B] hungry","ev":"5~6번 문장","w":"5번 prevent food waste(음식 쓰레기를 막다), 6번 food goes to people who are hungry(배고픈 사람들에게 음식이 가다). leftover(남은)는 7번에서 수거하는 음식의 모양이고, volunteers(자원봉사자들)와 farms(농장들)는 이 문장의 뜻과 맞지 않음.","c":null,"s":[[5,"We’re a group of people working together to prevent food waste.","우리는 음식물 쓰레기를 막기 위해 함께 일하는 한 단체의 사람들이에요."],[6,"Our goal is to make sure food goes to people who are hungry.","우리의 목표는 배고픈 사람들에게 음식이 제대로 전달되게 하는 것이죠."]]},"h":"33951fbaaf"}]},{"u":8,"id":"rg2-08-2","no":2,"ko":"하늘에서 초콜릿 눈이? 스위스 마을의 달콤한 사건","items":[{"n":1,"t":"tf","q":"Cocoa powder began to fall from the sky like snow in Olten.","ko":"코코아 가루가 Olten에서 눈처럼 하늘에서 떨어지기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에서 Cocoa powder began to fall from the sky like snow라고 나옴. 떨어진 것은 진짜 눈이 아니라 코코아 가루.","c":"T","s":[[2,"Cocoa powder — the main ingredient in chocolate — began to fall from the sky like snow!","초콜릿의 주재료인 코코아 가루가 눈처럼 하늘에서 떨어지기 시작한 것이다!"]]},"h":"937ae72343"},{"n":2,"t":"tf","q":"The factory said that the chocolate snow was very harmful.","ko":"공장은 초콜릿 눈이 매우 해롭다고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","w":"8번 문장에서 공장은 this chocolate snow wasn’t harmful at all(전혀 해롭지 않다)이라고 말함. 해롭다는 것과 반대.","c":"F","s":[[8,"The factory told everyone that this chocolate snow wasn’t harmful at all.","그 공장은 모두에게 이 초콜릿 눈은 전혀 해롭지 않다고 말했다."]]},"h":"e48b166df8"},{"n":3,"t":"tf","q":"A strong wind helped spread the cocoa powder all over the town.","ko":"강한 바람이 코코아 가루를 마을 곳곳에 퍼뜨리는 것을 도왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장 a strong wind was blowing, so it spread the cocoa powder all over the town. 바람 때문에 마을 곳곳으로 퍼짐.","c":"T","s":[[6,"On that day, a strong wind was blowing, so it spread the cocoa powder all over the town.","그날, 강한 바람이 불고 있었기에 그것이 마을 곳곳에 코코아 가루를 퍼뜨렸다."]]},"h":"dab12beb48"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...a strong wind was blowing, so it spread the cocoa powder all over the town.)","ko":"(... 강한 바람이 불고 있어서 그것이 코코아 가루를 마을 곳곳에 ... .)","opts":["퍼뜨렸다","모았다","먹었다","숨겼다"],"word":"spread","r":{"ev":"6번 문장","w":"6번에서 바람이 코코아 가루를 all over the town(마을 곳곳)에 날렸다는 내용. 그 결과 7번처럼 자동차·집·거리가 뒤덮임. spread = 퍼뜨리다.","c":1,"s":[[6,"On that day, a strong wind was blowing, so it spread the cocoa powder all over the town.","그날, 강한 바람이 불고 있었기에 그것이 마을 곳곳에 코코아 가루를 퍼뜨렸다."]],"a":"1) 퍼뜨렸다"},"h":"18c0e9f22b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The factory told everyone that this chocolate snow wasn’t harmful at all.)","ko":"(그 공장은 이 초콜릿 눈이 전혀 ...하지 않다고 모두에게 말했다.)","opts":["즐거운","해로운","맛있는","시끄러운"],"word":"harmful","r":{"ev":"8번 문장","w":"8번에서 공장이 사람들을 안심시키려 한 말. 초콜릿 눈이 wasn’t harmful at all = 몸에 해롭지 않다. harmful = 해로운.","c":2,"s":[[8,"The factory told everyone that this chocolate snow wasn’t harmful at all.","그 공장은 모두에게 이 초콜릿 눈은 전혀 해롭지 않다고 말했다."]],"a":"2) 해로운"},"h":"d862d89622"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat’s why cocoa flew out of the factory into the sky.","ko":"밑줄 친 That이 가리키는 것은?","sko":"그것이 코코아가 공장 밖으로 나와 하늘로 날아가게 된 이유이다.","opts":["마을에 눈이 내린 것","강한 바람이 분 것","공장의 공기 시스템에 문제가 있었던 것","마을 사람들이 이 일을 좋아한 것"],"r":{"ev":"4~5번 문장","w":"That’s why 앞에는 원인이 온다. 바로 앞 4번 The factory had a problem with its air system이 코코아가 하늘로 날아간 이유.","c":3,"s":[[4,"The factory had a problem with its air system.","그 공장은 공기 시스템에 문제가 있었다."],[5,"That’s why cocoa flew out of the factory into the sky.","그것이 코코아가 공장 밖으로 나와 하늘로 날아가게 된 이유이다."]],"a":"3) 공장의 공기 시스템에 문제가 있었던 것"},"h":"79a596ef0a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They fixed the air system and offered to clean up the cocoa powder.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 공기 시스템을 수리했고 코코아 가루를 청소해 주겠다고 했다.","opts":["그들은 공기 시스템을 고치지 않고 코코아 가루를 그대로 두었다.","그들은 공기 시스템을 고쳤지만, 코코아 가루는 치우지 않겠다고 했다.","그들은 코코아 가루만 치우고 공기 시스템은 고치지 않았다.","그들은 공기 시스템을 고쳤고, 코코아 가루를 청소해 주겠다고 제안했다."],"r":{"ev":"9번 문장","w":"fixed는 고쳤다, offered to clean up은 청소해 주겠다고 제안했다는 뜻. 두 가지를 모두 한 것이 정답이고 나머지는 하나를 빼먹거나 반대로 말함.","c":4,"s":[[9,"They fixed the air system and offered to clean up the cocoa powder.","그들은 공기 시스템을 수리했고 코코아 가루를 청소해 주겠다고 했다."]],"a":"4) 그들은 공기 시스템을 고쳤고, 코코아 가루를 청소해 주겠다고 제안했다."},"h":"2a72933fb5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["공장은 코코아 눈이 해롭다고 경고했다.","공장의 공기 시스템 문제 때문에 코코아가 공장 밖으로 날아갔다.","비가 와서 코코아 가루가 마을 곳곳에 퍼졌다.","마을 사람들은 초콜릿 눈에 화를 냈다."],"opts":["The factory warned that the chocolate snow was harmful.","A problem with the air system sent cocoa out of the factory.","Rain spread the cocoa powder all over the town.","The people in the town were angry about the chocolate snow."],"r":{"ev":"4~6번, 8번, 10번 문장","w":"4~5번에서 공기 시스템 문제 때문에 코코아가 공장 밖으로 날아갔다고 함. 8번 해롭지 않다고 말함, 6번 강한 바람이 퍼뜨림(비가 아님), 10번 사람들은 좋아함이라서 나머지는 틀림.","c":2,"s":[[4,"The factory had a problem with its air system.","그 공장은 공기 시스템에 문제가 있었다."],[5,"That’s why cocoa flew out of the factory into the sky.","그것이 코코아가 공장 밖으로 나와 하늘로 날아가게 된 이유이다."],[6,"On that day, a strong wind was blowing, so it spread the cocoa powder all over the town.","그날, 강한 바람이 불고 있었기에 그것이 마을 곳곳에 코코아 가루를 퍼뜨렸다."],[8,"The factory told everyone that this chocolate snow wasn’t harmful at all.","그 공장은 모두에게 이 초콜릿 눈은 전혀 해롭지 않다고 말했다."],[10,"But the people in the town loved this happening.","그러나 마을 사람들은 이 일을 매우 좋아했다."]],"a":"2) A problem with the air system sent cocoa out of the factory."},"h":"6a23b7d137"},{"n":9,"t":"sum","q":"A problem with the factory’s (A) system made cocoa powder fly into the sky, and the people in the town (B) the chocolate snow.","ko":"공장의 (A) 시스템 문제 때문에 코코아 가루가 하늘로 날아갔고, 마을 사람들은 초콜릿 눈을 (B).","oko":["(A) 물 / (B) 좋아했다","(A) 공기 / (B) 싫어했다","(A) 공기 / (B) 좋아했다","(A) 난방 / (B) 무서워했다","(A) 공기 / (B) 무서워했다"],"opts":["(A) water / (B) loved","(A) air / (B) hated","(A) air / (B) loved","(A) heating / (B) feared","(A) air / (B) feared"],"r":{"ev":"4~5번, 10번 문장","w":"4~5번에서 air system 문제로 코코아가 날아갔고, 10번에서 마을 사람들은 이 일을 loved(좋아했다). 11번 ‘꿈은 이루어진다’도 좋아한 모습을 보여 줌.","c":3,"s":[[4,"The factory had a problem with its air system.","그 공장은 공기 시스템에 문제가 있었다."],[5,"That’s why cocoa flew out of the factory into the sky.","그것이 코코아가 공장 밖으로 나와 하늘로 날아가게 된 이유이다."],[10,"But the people in the town loved this happening.","그러나 마을 사람들은 이 일을 매우 좋아했다."]],"a":"3) (A) air / (B) loved"},"h":"40e8b669c6"},{"n":10,"t":"fill","q":"They fixed the air system and offered to [A] up the cocoa powder, and one person said, “Dreams come [B]!”","ko":"그들은 공기 시스템을 고쳤고 코코아 가루를 [A]해 주겠다고 했으며, 한 사람은 “꿈은 [B]!”라고 말했다.","bank":["clean","true","cover","spread","fall","real"],"bko":{"clean":"청소하다","true":"사실이 되는","cover":"덮다","spread":"퍼뜨리다","fall":"떨어지다","real":"진짜의"},"r":{"a":"[A] clean, [B] true","ev":"9번, 11번 문장","w":"9번 offered to clean up the cocoa powder(코코아 가루를 청소해 주겠다), 11번 Dreams come true!(꿈은 이루어진다). come true는 한 덩어리 표현이라 real(진짜의)이 아님. cover(덮다), spread(퍼뜨리다)는 7번과 6번의 단어로 ‘청소’와 반대 뜻.","c":null,"s":[[9,"They fixed the air system and offered to clean up the cocoa powder.","그들은 공기 시스템을 수리했고 코코아 가루를 청소해 주겠다고 했다."],[11,"One person even said, “Chocolate snowflakes falling from the sky! Dreams come true!”","한 사람은 심지어 “하늘에서 떨어지는 초콜릿 눈송이라니! 꿈은 이루어지네요!”라고 말했다."]]},"h":"9a0d0d7c41"}]},{"u":8,"id":"rg2-08-3","no":3,"ko":"달에만 있는 줄 알았다고? 지구의 숨은 구덩이","items":[{"n":1,"t":"tf","q":"The Earth has a thick atmosphere that protects it from space rocks.","ko":"지구는 운석으로부터 지구를 보호해 주는 두꺼운 대기를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장 The Earth has a thick atmosphere that protects it from space rocks. 그대로 나옴.","c":"T","s":[[3,"The Earth has a thick atmosphere that protects it from space rocks.","지구는 운석으로부터 스스로를 보호해 주는 두꺼운 대기를 가지고 있다."]]},"h":"f0759c6d46"},{"n":2,"t":"tf","q":"The Moon has weather and plants that help erase craters.","ko":"달에는 구덩이를 지우는 것을 돕는 날씨와 식물이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","w":"6번에서 구덩이를 지우는 것은 지구의 비·바람·식물이고, 7번에서 달에는 날씨나 식물이 없다(doesn’t have weather or plants)고 함.","c":"F","s":[[6,"Additionally, on Earth, things like rain, wind, and even plants help to slowly erase craters.","게다가, 지구에서는 비, 바람, 그리고 심지어 식물과 같은 것들이 운석 구덩이를 서서히 지우는 것을 돕는다."],[7,"But the Moon doesn’t have weather or plants.","하지만 달에는 날씨나 식물이 존재하지 않는다."]]},"h":"9888f357ce"},{"n":3,"t":"tf","q":"In 2022, scientists found huge craters in Wyoming, U.S.","ko":"2022년에 과학자들은 미국 와이오밍주에서 거대한 운석 구덩이들을 찾았다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","w":"9번 문장 In 2022, scientists found huge craters in Wyoming, U.S. 그대로 나옴.","c":"T","s":[[9,"In 2022, scientists found huge craters in Wyoming, U.S.","2022년에 과학자들은 미국 와이오밍주에서 거대한 운석 구덩이들을 찾았다."]]},"h":"a30a457351"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...things like rain, wind, and even plants help to slowly erase craters.)","ko":"(... 비, 바람, 심지어 식물이 구덩이를 서서히 ... 것을 돕는다.)","opts":["지우다","만들다","던지다","세다"],"word":"erase","r":{"ev":"6~7번 문장","w":"6번에서 지구에는 비·바람·식물이 있어 구덩이가 서서히 없어지고, 7번에서 달에는 그런 것이 없어서 구덩이가 남음(8번). erase = 지우다, 없애다.","c":1,"s":[[6,"Additionally, on Earth, things like rain, wind, and even plants help to slowly erase craters.","게다가, 지구에서는 비, 바람, 그리고 심지어 식물과 같은 것들이 운석 구덩이를 서서히 지우는 것을 돕는다."],[7,"But the Moon doesn’t have weather or plants.","하지만 달에는 날씨나 식물이 존재하지 않는다."]],"a":"1) 지우다"},"h":"ec49ef6668"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The Earth has a thick atmosphere that protects it from space rocks.)","ko":"(지구는 운석으로부터 지구를 보호하는 두꺼운 ...를 가지고 있다.)","opts":["바다","대기","화산","공룡"],"word":"atmosphere","r":{"ev":"3~4번 문장","w":"3번에서 지구는 atmosphere 덕분에 운석에서 보호되고, 4번에서 달에는 atmosphere가 없어 운석이 더 자주 부딪힘(5번). 지구를 둘러싼 공기층 = 대기.","c":2,"s":[[3,"The Earth has a thick atmosphere that protects it from space rocks.","지구는 운석으로부터 스스로를 보호해 주는 두꺼운 대기를 가지고 있다."],[4,"The Moon, on the other hand, doesn’t have an atmosphere.","반면에, 달에는 대기가 없다."]],"a":"2) 대기"},"h":"6e30eb996a"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis means space rocks can hit the Moon more often.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 운석들이 달에 더 자주 충돌할 수 있다는 것을 의미한다.","opts":["지구에 두꺼운 대기가 있다는 것","달에 날씨가 있다는 것","운석이 지구에 떨어진 것","달에는 대기가 없다는 것"],"r":{"ev":"4~5번 문장","w":"5번 This는 바로 앞 4번의 내용(달에는 대기가 없다)을 가리킴. 대기가 없으니 운석을 막아 주지 못해 더 자주 부딪힌다는 흐름.","c":4,"s":[[4,"The Moon, on the other hand, doesn’t have an atmosphere.","반면에, 달에는 대기가 없다."],[5,"This means space rocks can hit the Moon more often.","이는 운석들이 달에 더 자주 충돌할 수 있다는 것을 의미한다."]],"a":"4) 달에는 대기가 없다는 것"},"h":"42a10ce2a2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When a space rock makes a crater, it stays there for a very long time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"운석 하나가 운석 구덩이를 만들면, 그것은 아주 오랜 시간 동안 그곳에 그대로 있다.","opts":["운석이 구덩이를 만들면, 그 운석은 곧바로 사라진다.","운석이 구덩이를 만들면, 구덩이는 오래지 않아 지워진다.","운석이 구덩이를 만들면, 그 구덩이는 아주 오랫동안 그대로 남아 있다.","운석이 구덩이를 만들면, 구덩이는 점점 더 커진다."],"r":{"ev":"7~8번 문장","w":"7번에서 달에는 날씨나 식물이 없다고 했고, 8번은 그 결과: 구덩이가 아주 오래 남아 있다(stays there for a very long time, stay = 그대로 있다). 지워지거나 커진다는 말은 없음.","c":3,"s":[[7,"But the Moon doesn’t have weather or plants.","하지만 달에는 날씨나 식물이 존재하지 않는다."],[8,"When a space rock makes a crater, it stays there for a very long time.","운석 하나가 운석 구덩이를 만들면, 그것은 아주 오랜 시간 동안 그곳에 그대로 있다."]],"a":"3) 운석이 구덩이를 만들면, 그 구덩이는 아주 오랫동안 그대로 남아 있다."},"h":"bd74ac1311"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["와이오밍의 구덩이들은 공룡보다 더 젊다.","달의 구덩이들은 비와 바람에 의해 지워진다.","달에는 대기가 없어서 운석이 더 자주 충돌할 수 있다.","구덩이는 달에만 있고 지구에는 없다."],"opts":["The craters in Wyoming are younger than dinosaurs.","Craters on the Moon are erased by rain and wind.","The Moon has no atmosphere, so space rocks can hit it more often.","Only the Moon has craters."],"r":{"ev":"1번, 4~5번, 7번, 10~11번 문장","w":"4~5번에서 달에는 대기가 없어서 운석이 더 자주 충돌할 수 있다고 함. 11번 와이오밍 구덩이는 공룡보다 오래됨, 7번 달에는 날씨가 없음, 1번 지구에도 구덩이가 있음이라 나머지는 틀림.","c":3,"s":[[1,"Some people may believe that only the Moon has craters, but actually, the Earth has them as well.","몇몇 사람들은 달에만 운석 구덩이들이 있다고 믿을지도 모르지만, 사실 지구에도 있다."],[4,"The Moon, on the other hand, doesn’t have an atmosphere.","반면에, 달에는 대기가 없다."],[5,"This means space rocks can hit the Moon more often.","이는 운석들이 달에 더 자주 충돌할 수 있다는 것을 의미한다."],[7,"But the Moon doesn’t have weather or plants.","하지만 달에는 날씨나 식물이 존재하지 않는다."],[10,"The surprising fact is that these craters are about 280 million years old.","놀라운 사실은 이 운석 구덩이들이 약 2억 8천만 년이나 되었다는 것이다."],[11,"That’s older than dinosaurs!","그것은 공룡보다 더 오래된 것이다!"]],"a":"3) The Moon has no atmosphere, so space rocks can hit it more often."},"h":"44e374a079"},{"n":9,"t":"sum","q":"The Earth has a thick (A) that protects it from space rocks, and weather and plants erase craters, so the Moon has (B) craters than the Earth.","ko":"지구에는 운석으로부터 보호해 주는 두꺼운 (A)이 있고 날씨와 식물이 구덩이를 지워서, 달에는 지구보다 구덩이가 (B).","oko":["(A) 바다 / (B) 더 많다","(A) 대기 / (B) 더 적다","(A) 대기 / (B) 더 많다","(A) 우주 / (B) 더 적다","(A) 대기 / (B) 더 크다"],"opts":["(A) ocean / (B) more","(A) atmosphere / (B) fewer","(A) atmosphere / (B) more","(A) space / (B) fewer","(A) atmosphere / (B) bigger"],"r":{"ev":"3번, 6~7번 문장","w":"3번 지구에는 thick atmosphere(두꺼운 대기)가 있어 운석을 막아 주고, 6번 날씨와 식물이 구덩이를 지움, 7번 달에는 날씨·식물이 없음. 그래서 달에는 구덩이가 more(더 많다). fewer(더 적은)는 2번 질문(달이 더 많은 것 같다)과 반대.","c":3,"s":[[3,"The Earth has a thick atmosphere that protects it from space rocks.","지구는 운석으로부터 스스로를 보호해 주는 두꺼운 대기를 가지고 있다."],[6,"Additionally, on Earth, things like rain, wind, and even plants help to slowly erase craters.","게다가, 지구에서는 비, 바람, 그리고 심지어 식물과 같은 것들이 운석 구덩이를 서서히 지우는 것을 돕는다."],[7,"But the Moon doesn’t have weather or plants.","하지만 달에는 날씨나 식물이 존재하지 않는다."]],"a":"3) (A) atmosphere / (B) more"},"h":"c716568ee2"},{"n":10,"t":"fill","q":"Scientists found craters in Wyoming that are about 280 million [A] old, which is older than [B].","ko":"과학자들은 약 2억 8천만 [A] 된 와이오밍의 구덩이들을 찾았는데, 그것은 [B]보다 더 오래되었다.","bank":["years","dinosaurs","days","atmosphere","craters","plants"],"bko":{"years":"년, 해","dinosaurs":"공룡","days":"날, 일","atmosphere":"대기","craters":"운석 구덩이","plants":"식물"},"r":{"a":"[A] years, [B] dinosaurs","ev":"10~11번 문장","w":"10번 about 280 million years old, 11번 That’s older than dinosaurs! days는 나이의 단위로 맞지 않고, atmosphere·plants·craters는 비교 대상이 아님.","c":null,"s":[[10,"The surprising fact is that these craters are about 280 million years old.","놀라운 사실은 이 운석 구덩이들이 약 2억 8천만 년이나 되었다는 것이다."],[11,"That’s older than dinosaurs!","그것은 공룡보다 더 오래된 것이다!"]]},"h":"cf34a0bf04"}]},{"u":9,"id":"rg2-09-1","no":1,"ko":"리우에는 강이 없다? 이름에 숨은 작은 오해","items":[{"n":1,"t":"tf","q":"In Portuguese, Rio means “river” and Janeiro means “January.”","ko":"포르투갈어로, Rio는 ‘강’을 의미하고 Janeiro는 ‘1월’을 의미한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장 In Portuguese, Rio means “river” and Janeiro means “January.” 그대로 나옴.","c":"T","s":[[3,"In Portuguese, Rio means “river” and Janeiro means “January.”","포르투갈어로, Rio는 ‘강’을 의미하고, Janeiro는 ‘1월’을 의미한다."]]},"h":"9ae4714696"},{"n":2,"t":"tf","q":"People from Portugal arrived at a wide bay in 1882.","ko":"포르투갈에서 온 사람들은 1882년에 넓은 만에 도착했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번 문장에서 포르투갈 사람들이 넓은 만에 도착한 때는 1502년 1월 1일. 1882년은 11번에서 브라질이 독립한 해.","c":"F","s":[[7,"On January 1, 1502, people from Portugal arrived at a wide bay.","1502년 1월 1일에 포르투갈에서 온 사람들은 넓은 만에 도착했다."]]},"h":"bd4e099b34"},{"n":3,"t":"tf","q":"Brazil was ruled by Portugal for over 300 years.","ko":"브라질은 300년 넘게 포르투갈의 지배를 받았다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","w":"10번 문장 Since then, Brazil was ruled by Portugal for over 300 years. 그대로 나옴.","c":"T","s":[[10,"Since then, Brazil was ruled by Portugal for over 300 years.","그 이후로, 브라질은 300년 이상 포르투갈의 지배를 받았다."]]},"h":"33dfac53e9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...people from Portugal arrived at a wide bay.)","ko":"(포르투갈에서 온 사람들은 넓은 만에 ... .)","opts":["떠났다","싸웠다","도착했다","잠들었다"],"word":"arrived","r":{"ev":"7번 문장","w":"7번에서 사람들이 포르투갈에서 와서 넓은 만에 arrived. 그다음 8번에서 그곳을 강이라고 생각하는 것으로 보아 그곳에 와 닿은 것. arrive at = ~에 도착하다.","c":3,"s":[[7,"On January 1, 1502, people from Portugal arrived at a wide bay.","1502년 1월 1일에 포르투갈에서 온 사람들은 넓은 만에 도착했다."]],"a":"3) 도착했다"},"h":"bd0456c3ac"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It’s famous for its beautiful nature, exciting culture, and history.)","ko":"(그곳은 아름다운 자연, 흥미진진한 문화와 역사로 ...하다.)","opts":["유명한","위험한","조용한","새로운"],"word":"famous","r":{"ev":"2번 문장","w":"2번에서 아름다운 자연과 흥미진진한 문화, 역사를 자랑하는 도시라고 소개. be famous for = ~로 유명하다. 위험하거나 조용하다는 내용은 없음.","c":1,"s":[[2,"It’s famous for its beautiful nature, exciting culture, and history.","그곳은 아름다운 자연, 흥미진진한 문화와 역사로 유명하다."]],"a":"1) 유명한"},"h":"926810c58b"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThey thought it was a river by mistake!","ko":"밑줄 친 it이 가리키는 것은?","sko":"그들은 실수로 그것이 강이라고 생각했다!","opts":["1월","도시 Rio de Janeiro","포르투갈","넓은 만"],"r":{"ev":"7~8번 문장","w":"7번에서 포르투갈 사람들이 도착한 곳은 a wide bay(넓은 만). 8번 it은 그 만이고, 그들은 그 넓은 만을 실수로 강이라고 생각함.","c":4,"s":[[7,"On January 1, 1502, people from Portugal arrived at a wide bay.","1502년 1월 1일에 포르투갈에서 온 사람들은 넓은 만에 도착했다."],[8,"They thought it was a river by mistake!","그들은 실수로 그것이 강이라고 생각했다!"]],"a":"4) 넓은 만"},"h":"c5561dd6cd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since then, Brazil was ruled by Portugal for over 300 years.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 이후로, 브라질은 300년 이상 포르투갈의 지배를 받았다.","opts":["그때부터 브라질은 300년이 넘도록 포르투갈의 지배를 받았다.","그때부터 브라질은 300년 동안 포르투갈을 지배했다.","그때부터 포르투갈은 300년이 넘도록 브라질의 지배를 받았다.","그때부터 브라질은 포르투갈의 지배를 한 번도 받지 않았다."],"r":{"ev":"10번 문장","w":"was ruled by Portugal은 수동태(rule 지배하다)로 ‘포르투갈에 의해 지배받았다’. 지배한 쪽은 포르투갈, 받은 쪽은 브라질. 주어와 목적을 거꾸로 쓴 선지에 주의.","c":1,"s":[[10,"Since then, Brazil was ruled by Portugal for over 300 years.","그 이후로, 브라질은 300년 이상 포르투갈의 지배를 받았다."]],"a":"1) 그때부터 브라질은 300년이 넘도록 포르투갈의 지배를 받았다."},"h":"2464208fdf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Rio de Janeiro는 포르투갈에 있는 도시이다.","Rio de Janeiro에는 큰 강이 흐른다.","포르투갈 사람들은 1월이어서 그곳을 ‘Rio de Janeiro’라고 부르기로 했다.","브라질은 독립한 뒤에 도시 이름을 바꾸었다."],"opts":["Rio de Janeiro is a city in Portugal.","A big river flows through Rio de Janeiro.","The Portuguese decided to call the place “Rio de Janeiro” because it was January.","Brazil changed the name of the city after it became independent."],"r":{"ev":"1번, 5번, 9번, 11번 문장","w":"9번 Since it was January, they decided to call the place “Rio de Janeiro”. 1번 브라질의 도시, 5번 강이 없음, 11번 독립한 뒤에도 이름이 그대로라서 나머지는 틀림.","c":3,"s":[[1,"Rio de Janeiro is a city in Brazil, South America.","Rio de Janeiro는 남아메리카의 브라질에 있는 도시이다."],[5,"But there isn’t actually a river in Rio de Janeiro!","그러나 Rio de Janeiro에는 사실 강이 없다!"],[9,"Since it was January, they decided to call the place “Rio de Janeiro” in Portuguese.","1월이었기 때문에, 그들은 그곳을 포르투갈어로 ‘Rio de Janeiro’라고 부르기로 결정했다."],[11,"It became independent in 1882, but Rio de Janeiro’s name stayed the same.","그곳은 1882년에 독립했지만, Rio de Janeiro의 이름은 그대로 남게 되었다."]],"a":"3) The Portuguese decided to call the place “Rio de Janeiro” because it was January."},"h":"8f330863b5"},{"n":9,"t":"sum","q":"The Portuguese thought a wide (A) was a river, and since it was (B), they named the place Rio de Janeiro.","ko":"포르투갈 사람들은 넓은 (A)을 강이라고 생각했고, (B)이었기 때문에 그곳을 Rio de Janeiro라고 이름 붙였다.","oko":["(A) 만 / (B) 여름","(A) 도시 / (B) 1월","(A) 만 / (B) 1월","(A) 강 / (B) 1월","(A) 만 / (B) 1882년"],"opts":["(A) bay / (B) summer","(A) city / (B) January","(A) bay / (B) January","(A) river / (B) January","(A) bay / (B) 1882"],"r":{"ev":"7~9번 문장","w":"7~8번에서 넓은 만(a wide bay)을 강으로 착각했고, 9번에서 Since it was January라서 ‘Rio de Janeiro’로 부르기로 함. 강(river)은 착각한 대상이지 실제 모습이 아님.","c":3,"s":[[7,"On January 1, 1502, people from Portugal arrived at a wide bay.","1502년 1월 1일에 포르투갈에서 온 사람들은 넓은 만에 도착했다."],[8,"They thought it was a river by mistake!","그들은 실수로 그것이 강이라고 생각했다!"],[9,"Since it was January, they decided to call the place “Rio de Janeiro” in Portuguese.","1월이었기 때문에, 그들은 그곳을 포르투갈어로 ‘Rio de Janeiro’라고 부르기로 결정했다."]],"a":"3) (A) bay / (B) January"},"h":"5072ce45d4"},{"n":10,"t":"fill","q":"Brazil was [A] by Portugal for over 300 years, and it became [B] in 1882.","ko":"브라질은 300년 넘게 포르투갈에 의해 [A], 1882년에 [B]했다.","bank":["ruled","independent","famous","arrived","named","wide"],"bko":{"ruled":"지배받은","independent":"독립한","famous":"유명한","arrived":"도착한","named":"이름 붙여진","wide":"넓은"},"r":{"a":"[A] ruled, [B] independent","ev":"10~11번 문장","w":"10번 Brazil was ruled by Portugal, 11번 It became independent in 1882. named는 도시 이름에, arrived는 사람들의 도착에 쓰인 말이라 브라질의 역사와 맞지 않음.","c":null,"s":[[10,"Since then, Brazil was ruled by Portugal for over 300 years.","그 이후로, 브라질은 300년 이상 포르투갈의 지배를 받았다."],[11,"It became independent in 1882, but Rio de Janeiro’s name stayed the same.","그곳은 1882년에 독립했지만, Rio de Janeiro의 이름은 그대로 남게 되었다."]]},"h":"e203fc491a"}]},{"u":9,"id":"rg2-09-2","no":2,"ko":"얼음산 옆 호수 위의 호텔, 에너지가 남는다고?","items":[{"n":1,"t":"tf","q":"Svart Hotel will be near a big ice mountain called Svartisen glacier.","ko":"Svart 호텔은 Svartisen 빙하라고 불리는 큰 얼음산 근처에 있을 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번 문장 You can find the hotel near a big ice mountain called Svartisen glacier. 그대로 나옴.","c":"T","s":[[5,"You can find the hotel near a big ice mountain called Svartisen glacier.","여러분은 그 호텔을 Svartisen 빙하라고 불리는 큰 얼음산 근처에서 찾을 수 있어요."]]},"h":"f3868f95f8"},{"n":2,"t":"tf","q":"Svart Hotel will be built on the ground, not on tall poles.","ko":"Svart 호텔은 높은 기둥이 아니라 땅 위에 지어질 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","w":"6번 문장에서 호텔은 on tall poles above a lake(호수 위의 높은 기둥 위)에 지어진다고 함. 땅 위에 짓는 것이 아님.","c":"F","s":[[6,"It will be built on tall poles above a lake.","그것은 호수 위의 높은 기둥 위에 지어질 거예요."]]},"h":"a7483f76cb"},{"n":3,"t":"tf","q":"At Svart Hotel, you can see the aurora lights, especially in winter.","ko":"Svart 호텔에서는 특히 겨울에 오로라 빛을 볼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","w":"12번 문장 especially in winter, see the amazing aurora lights! 겨울에 특히 볼 수 있음.","c":"T","s":[[12,"Plus, you can enjoy the beautiful view of the ice mountain and, especially in winter, see the amazing aurora lights!","게다가, 여러분은 얼음산의 아름다운 경치를 즐길 수 있고, 특히 겨울에는 놀라운 오로라 빛을 볼 수 있어요!"]]},"h":"29800f5cf7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They work really hard to protect the environment.)","ko":"(그들은 환경을 ...하기 위해 정말 열심히 노력한다.)","opts":["보호하다","파괴하다","사용하다","팔다"],"word":"protect","r":{"ev":"2번 문장","w":"2번에서 노르웨이가 환경을 위해 열심히 일한다는 내용. 1번의 take care of(돌보다) our planet과 같은 방향이라 protect = 보호하다. 파괴하다는 반대 뜻.","c":1,"s":[[2,"They work really hard to protect the environment.","그들은 환경을 보호하기 위해 정말 열심히 노력해요."]],"a":"1) 보호하다"},"h":"b6100f3ded"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This way, it won’t harm the land or water.)","ko":"(이렇게 하면, 그것은 땅이나 물을 ... 않을 것이다.)","opts":["도와주다","청소하다","해를 끼치다","지키다"],"word":"harm","r":{"ev":"6~7번 문장","w":"7번에서 기둥 위에 지어서(6번) 땅과 물에 won’t harm. 친환경 호텔이니 땅과 물을 해치지 않는다는 뜻이라 harm = 해를 끼치다.","c":3,"s":[[6,"It will be built on tall poles above a lake.","그것은 호수 위의 높은 기둥 위에 지어질 거예요."],[7,"This way, it won’t harm the land or water.","이렇게 하면, 그것은 땅이나 물을 손상시키지 않을 거예요."]],"a":"3) 해를 끼치다"},"h":"33b5043496"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis way, it won’t harm the land or water.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이렇게 하면, 그것은 땅이나 물을 손상시키지 않을 것이다.","opts":["빙하","호텔","호수","기둥"],"r":{"ev":"6~7번 문장","w":"6번 It will be built on tall poles above a lake에서 It은 호텔. 7번 it도 같은 호텔로, 호텔이 기둥 위에 지어져서 땅과 물을 해치지 않는다는 뜻.","c":2,"s":[[6,"It will be built on tall poles above a lake.","그것은 호수 위의 높은 기둥 위에 지어질 거예요."],[7,"This way, it won’t harm the land or water.","이렇게 하면, 그것은 땅이나 물을 손상시키지 않을 거예요."]],"a":"2) 호텔"},"h":"b0b95c44d4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This hotel makes more energy than it uses!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 호텔은 사용하는 것보다 더 많은 에너지를 만든다!","opts":["이 호텔은 사용한 에너지만큼만 만든다.","이 호텔은 에너지를 만들지 못한다.","이 호텔은 만드는 에너지보다 더 많이 쓴다.","이 호텔은 사용하는 것보다 더 많은 에너지를 만든다."],"r":{"ev":"4번 문장","w":"more energy than it uses는 ‘쓰는 것보다 더 많은 에너지’. 만드는 에너지가 쓰는 에너지보다 많다는 뜻. 반대로 읽은 선지에 주의.","c":4,"s":[[4,"This hotel makes more energy than it uses!","이 호텔은 사용하는 것보다 더 많은 에너지를 만들어요!"]],"a":"4) 이 호텔은 사용하는 것보다 더 많은 에너지를 만든다."},"h":"3cf9e6f230"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Svart 호텔은 호수 바닥에 지어질 것이다.","Svart 호텔은 에너지를 전혀 만들지 못한다.","Svart 호텔은 스스로 물을 깨끗하게 할 수 있을 것이다.","Svart 호텔은 얼음산에서 멀리 떨어져 있다."],"opts":["Svart Hotel will be built at the bottom of a lake.","Svart Hotel cannot make any energy.","Svart Hotel will be able to clean water by itself.","Svart Hotel is far away from the ice mountain."],"r":{"ev":"4~6번, 9번 문장","w":"9번에서 호텔은 스스로 물을 깨끗하게 하고 쓰레기를 재활용할 수 있다고 함. 6번 호수 위 기둥, 4번 에너지를 더 많이 만듦, 5번 얼음산 근처라서 나머지는 틀림.","c":3,"s":[[4,"This hotel makes more energy than it uses!","이 호텔은 사용하는 것보다 더 많은 에너지를 만들어요!"],[5,"You can find the hotel near a big ice mountain called Svartisen glacier.","여러분은 그 호텔을 Svartisen 빙하라고 불리는 큰 얼음산 근처에서 찾을 수 있어요."],[6,"It will be built on tall poles above a lake.","그것은 호수 위의 높은 기둥 위에 지어질 거예요."],[9,"It will also be able to clean water and recycle waste by itself.","그것은 또한 스스로 물을 깨끗하게 하고 쓰레기를 재활용할 수 있을 거예요."]],"a":"3) Svart Hotel will be able to clean water by itself."},"h":"060e6ce7a5"},{"n":9,"t":"sum","q":"Svart Hotel will use (A) to get energy, and it will clean water and recycle (B) by itself.","ko":"Svart 호텔은 에너지를 얻기 위해 (A)을 사용하고, 스스로 물을 깨끗하게 하고 (B)를 재활용할 것이다.","oko":["(A) 햇빛 / (B) 쓰레기","(A) 바람 / (B) 얼음","(A) 햇빛 / (B) 얼음","(A) 바람 / (B) 쓰레기","(A) 비 / (B) 기둥"],"opts":["(A) sunlight / (B) waste","(A) wind / (B) ice","(A) sunlight / (B) ice","(A) wind / (B) waste","(A) rain / (B) poles"],"r":{"ev":"8~9번 문장","w":"8번 sunlight로 에너지를 얻고, 9번 clean water and recycle waste by itself. wind와 rain은 에너지원으로 나오지 않고, ice와 poles는 재활용 대상이 아님.","c":1,"s":[[8,"The hotel will use sunlight to get energy.","그 호텔은 에너지를 얻기 위해 햇빛을 사용할 거예요."],[9,"It will also be able to clean water and recycle waste by itself.","그것은 또한 스스로 물을 깨끗하게 하고 쓰레기를 재활용할 수 있을 거예요."]],"a":"1) (A) sunlight / (B) waste"},"h":"a6ffa2b5df"},{"n":10,"t":"fill","q":"When you stay at this hotel, you can learn how to [A] our planet, and enjoy the beautiful view of the ice [B].","ko":"이 호텔에 머무르면 지구를 [A]하는 방법을 배울 수 있고, 얼음 [B]의 아름다운 경치를 즐길 수 있다.","bank":["protect","mountain","harm","lake","build","winter"],"bko":{"protect":"보호하다","mountain":"산","harm":"해를 끼치다","lake":"호수","build":"짓다","winter":"겨울"},"r":{"a":"[A] protect, [B] mountain","ev":"11~12번 문장","w":"11번 learn how to protect our planet(지구를 보호하는 방법을 배우다), 12번 the beautiful view of the ice mountain(얼음산의 아름다운 경치). harm(해를 끼치다)은 지구를 보호하는 것과 반대이고, lake(호수)와 winter(겨울)는 12번의 다른 부분에 쓰인 말.","c":null,"s":[[11,"When you stay at this hotel, you can learn how to protect our planet.","이 호텔에 머무르게 되면, 여러분은 우리 지구를 보호하는 방법에 대해 배울 수 있어요."],[12,"Plus, you can enjoy the beautiful view of the ice mountain and, especially in winter, see the amazing aurora lights!","게다가, 여러분은 얼음산의 아름다운 경치를 즐길 수 있고, 특히 겨울에는 놀라운 오로라 빛을 볼 수 있어요!"]]},"h":"25aec57046"}]},{"u":9,"id":"rg2-09-3","no":3,"ko":"고래 콧물을 모으는 로봇? 동물을 지키는 드론","items":[{"n":1,"t":"tf","q":"SnotBot is there to collect snot when a whale blows it into the air.","ko":"SnotBot은 고래가 콧물을 공기 중으로 내뿜을 때 그것을 수집하려고 그곳에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","w":"4번 문장 When a whale blows snot out into the air, SnotBot is there to collect it. 그대로 나옴.","c":"T","s":[[4,"When a whale blows snot out into the air, SnotBot is there to collect it.","고래가 공기 중으로 콧물을 내뿜을 때, SnotBot은 그것을 수집하기 위해 그곳에 있다."]]},"h":"b033375901"},{"n":2,"t":"tf","q":"In the South Atlantic, a drone is busy counting whales.","ko":"남대서양에서는 한 드론이 고래를 세느라 바쁘다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","w":"9번 문장에서 남대서양의 드론이 세는 것은 whales(고래)가 아니라 penguins(펭귄)의 수.","c":"F","s":[[9,"Far away in the South Atlantic, a different drone is busy counting the number of penguins.","남대서양의 멀리 떨어진 곳에서, 다른 드론은 펭귄의 수를 세느라 바쁘다."]]},"h":"28b9c21117"},{"n":3,"t":"tf","q":"A drone in Brazil takes pictures of monkeys hidden deep in the jungle.","ko":"브라질의 한 드론은 정글 깊은 곳에 숨어 있는 원숭이들의 사진을 찍는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6~7번 문장","w":"6~7번 문장 In Brazil, another drone ~ takes pictures of monkeys hidden deep in the jungle. 그대로 나옴.","c":"T","s":[[6,"In Brazil, another drone has a very important job.","브라질에서는, 또 다른 드론이 매우 중요한 일을 맡고 있다."],[7,"It takes pictures of monkeys hidden deep in the jungle.","그것은 정글 속 깊은 곳에 숨어 있는 원숭이들의 사진을 찍는다."]]},"h":"9d516df80b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...SnotBot is there to collect it.)","ko":"(... SnotBot은 그것을 ...하기 위해 그곳에 있다.)","opts":["던지다","수집하다","그리다","숨기다"],"word":"collect","r":{"ev":"4~5번 문장","w":"4번에서 SnotBot이 고래의 콧물을 collect하고, 5번에서 그 콧물이 고래의 건강을 알아보는 데 도움이 됨. collect = 모으다, 수집하다.","c":2,"s":[[4,"When a whale blows snot out into the air, SnotBot is there to collect it.","고래가 공기 중으로 콧물을 내뿜을 때, SnotBot은 그것을 수집하기 위해 그곳에 있다."],[5,"The snot helps scientists learn about the whale’s health.","콧물은 과학자들이 고래의 건강에 대해 알아보는 데 도움이 된다."]],"a":"2) 수집하다"},"h":"d51e9d8de1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...monkeys hidden deep in the jungle.)","ko":"(정글 속 깊은 곳에 ... 원숭이들)","opts":["큰","화난","숨어 있는","빠른"],"word":"hidden","r":{"ev":"7~8번 문장","w":"7번 monkeys hidden deep in the jungle, 8번에서 그래서 원숭이를 찾기 어려웠음(드론 덕에 쉬워짐). hidden = 숨겨진, 숨어 있는.","c":3,"s":[[7,"It takes pictures of monkeys hidden deep in the jungle.","그것은 정글 속 깊은 곳에 숨어 있는 원숭이들의 사진을 찍는다."],[8,"This makes finding these monkeys much easier for scientists.","이는 과학자들이 이 원숭이들을 찾는 것을 훨씬 더 쉽게 해 준다."]],"a":"3) 숨어 있는"},"h":"edd57cc922"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes finding these monkeys much easier for scientists.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 과학자들이 이 원숭이들을 찾는 것을 훨씬 더 쉽게 해 준다.","opts":["고래가 콧물을 내뿜는 것","펭귄의 수가 줄어드는 것","과학자들이 정글에서 사는 것","드론이 숨어 있는 원숭이들의 사진을 찍는 것"],"r":{"ev":"7~8번 문장","w":"8번 This는 바로 앞 7번의 내용(드론이 정글 속에 숨어 있는 원숭이들의 사진을 찍는 것). 그 덕분에 원숭이를 찾기가 쉬워짐.","c":4,"s":[[7,"It takes pictures of monkeys hidden deep in the jungle.","그것은 정글 속 깊은 곳에 숨어 있는 원숭이들의 사진을 찍는다."],[8,"This makes finding these monkeys much easier for scientists.","이는 과학자들이 이 원숭이들을 찾는 것을 훨씬 더 쉽게 해 준다."]],"a":"4) 드론이 숨어 있는 원숭이들의 사진을 찍는 것"},"h":"cf6d7aa4ce"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This drone helps us know how many penguins are left there.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 드론은 우리에게 얼마나 많은 펭귄이 남아 있는지 알게 해 준다.","opts":["이 드론은 그곳에 펭귄이 몇 마리 남아 있는지 알게 도와준다.","이 드론은 펭귄들이 그곳을 떠나도록 도와준다.","이 드론은 펭귄에게 먹이를 얼마나 줄지 알려 준다.","이 드론은 펭귄이 몇 살인지 알려 준다."],"r":{"ev":"9~10번 문장","w":"how many penguins are left there는 ‘그곳에 펭귄이 몇 마리 남아 있는지’. 9번에서 드론이 펭귄 수를 세고 있으니, 그 결과 남은 수를 알게 되는 것. 떠나게 하거나 먹이·나이는 본문에 없음.","c":1,"s":[[9,"Far away in the South Atlantic, a different drone is busy counting the number of penguins.","남대서양의 멀리 떨어진 곳에서, 다른 드론은 펭귄의 수를 세느라 바쁘다."],[10,"This drone helps us know how many penguins are left there.","이 드론은 우리에게 얼마나 많은 펭귄이 남아 있는지 알게 해 준다."]],"a":"1) 이 드론은 그곳에 펭귄이 몇 마리 남아 있는지 알게 도와준다."},"h":"5c07af0b2a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["SnotBot은 원숭이 사진을 찍는 드론이다.","남대서양의 드론은 고래의 수를 센다.","SnotBo
