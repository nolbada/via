7"},{"n":9,"t":"sum","q":"Moss balls on glaciers (A) because of the sun, and scientists are still looking for the (B) of their group movement.","ko":"빙하 위의 이끼 공들은 태양 때문에 (A), 과학자들은 이들의 집단 움직임의 (B)를 여전히 찾고 있다.","oko":["(A) 사라진다 / (B) 이유","(A) 얼어붙는다 / (B) 결과","(A) 움직인다 / (B) 이유","(A) 움직인다 / (B) 결과","(A) 사라진다 / (B) 크기"],"opts":["(A) disappear / (B) reason","(A) freeze / (B) result","(A) move / (B) reason","(A) move / (B) result","(A) disappear / (B) size"],"r":{"a":"3) (A) move / (B) reason","ev":"5번, 9~10번 문장","s":[[5,"They wanted to know what makes them move, and it turns out that they move because of the sun.","그들은 무엇이 그것들을 움직이게 만드는지 알고 싶었고, 태양 때문에 그것들이 움직이는 것으로 밝혀졌어요."],[9,"The moss balls moved together, and even changed direction together, like a herd of animals!","그 이끼 공들은 함께 움직였고, 심지어 동물 떼처럼 방향도 함께 바꿨어요!"],[10,"Scientists are still trying to find out why they move this way, but haven’t found a clear answer yet.","과학자들은 왜 그것들이 이 방식으로 움직이는지 알아내려고 여전히 노력하고 있지만, 아직 분명한 답을 찾지 못했어요."]],"w":"5번에서 이끼 공은 태양 때문에 움직이고(move), 9번에서 함께 움직이는 것이 이상한 점인데 10번에서 그 이유(reason)를 아직 못 찾았다고 함. 결과(result)를 찾는 게 아니라 ‘왜 그런지’를 찾는 중임.","c":3},"h":"a6a2f97794"},{"n":10,"t":"fill","q":"The moss balls can survive on glaciers for [A] years or more, and scientists call their movement a mousy mossy [B].","ko":"이끼 공들은 빙하 위에서 [A]년 또는 그 이상 살아남을 수 있으며, 과학자들은 그들의 움직임을 쥐를 닮은 이끼의 [B]라고 부른다.","bank":["six","mystery","summer","herd","direction","answer"],"bko":{"six":"여섯","mystery":"미스터리, 수수께끼","summer":"여름","herd":"(동물) 떼","direction":"방향","answer":"답"},"r":{"a":"[A] six, [B] mystery","ev":"7번, 11번 문장","s":[[7,"Scientists also found that the moss balls can survive on glaciers for six years or more.","과학자들은 이끼 공들이 빙하 위에서 6년 또는 그 이상 살아남을 수 있다는 것도 알아냈어요."],[11,"It’s a mousy mossy mystery.","그것은 쥐를 닮은, 이끼로 뒤덮인 미스터리예요."]],"w":"7번에서 이끼 공은 빙하 위에서 six years or more 살아남음. 11번 마지막 문장이 a mousy mossy mystery. summer, herd, direction은 본문에 나오지만 빈칸 자리에 맞지 않고, answer는 10번에 나오지만 11번의 표현은 mystery임.","c":null},"h":"fe479f4970"}]},{"u":4,"id":"rg3-04-2","no":2,"ko":"한 명만 아픈데, 쌍둥이 둘 다 아프다고?","items":[{"n":1,"t":"tf","q":"Megan has stomach pain, back pain, and has lost weight like her sister.","ko":"Megan은 그녀의 자매처럼 복부 통증, 허리 통증이 있고 살이 빠졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Megan has stomach pain, back pain, and has lost weight just like her sister.","Megan은 복부 통증과 허리 통증이 있고 살이 빠졌는데, 꼭 그녀의 자매처럼 그렇다."]],"w":"4번 문장에 Megan has stomach pain, back pain, and has lost weight just like her sister가 있음. 자매처럼 같은 증상을 겪는다는 내용과 일치.","c":"T"},"h":"55ef47b448"},{"n":2,"t":"tf","q":"The doctors found a serious problem in Megan’s body after many tests.","ko":"의사들은 많은 검사 후에 Megan의 몸에서 심각한 문제를 찾았다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The doctors did many tests on Megan, but they found nothing wrong with her.","의사들은 Megan에게 많은 검사를 했지만, 그녀에게서 아무런 이상을 찾지 못했다."]],"w":"5번 문장에서 의사들은 많은 검사를 했지만 found nothing wrong with her(아무 이상도 찾지 못함). 심각한 문제를 찾았다는 것은 반대 내용.","c":"F"},"h":"4c9f8764c8"},{"n":3,"t":"tf","q":"Scientists know exactly why sympathy pain happens.","ko":"과학자들은 공감고통이 왜 일어나는지 정확히 안다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"We don’t know why this pain happens.","우리는 왜 이 통증이 일어나는지 알지 못한다."]],"w":"11번 문장에서 We don’t know why this pain happens(왜 이 통증이 일어나는지 알지 못한다)라고 함. 정확히 안다는 진술은 틀림.","c":"F"},"h":"47fa115cea"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 2017, Sophie got a rare type of kidney cancer.)","ko":"2017년에, Sophie는 ( ) 종류의 신장암에 걸렸다.","opts":["흔한","드문","위험한","가벼운"],"word":"rare","r":{"a":"2) 드문","ev":"2~3번 문장","s":[[2,"In 2017, Sophie got a rare type of kidney cancer.","2017년에, Sophie는 희귀한 종류의 신장암에 걸렸다."],[3,"Megan has never had this sickness before, but surprisingly, she has the same feelings as Sophie!","Megan은 이전에 이 질병에 걸린 적이 한 번도 없지만, 놀랍게도 그녀는 Sophie와 같은 느낌을 느낀다!"]],"w":"2번의 a rare type of kidney cancer는 ‘희귀한 종류의 신장암’. rare는 드문, 희귀한. 흔한(common)은 정반대 뜻이고, 3번에서 쌍둥이 Megan도 걸린 적이 없다고 해서 흔한 병이 아님을 알 수 있음.","c":2},"h":"9decf5ebc8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It looks like Megan is experiencing “sympathy pain.”)","ko":"Megan은 ‘공감고통’을 ( ) 것처럼 보인다.","opts":["경험하고 있는","설명하고 있는","피하고 있는","만들고 있는"],"word":"experiencing","r":{"a":"1) 경험하고 있는","ev":"7~8번 문장","s":[[7,"How do we explain this?","우리는 이것을 어떻게 설명해야 할까?"],[8,"It looks like Megan is experiencing “sympathy pain.”","Megan은 ‘공감고통’을 경험하고 있는 것처럼 보인다."]],"w":"7번에서 이 이상한 일을 어떻게 설명할까 묻고, 8번에서 Megan이 공감고통을 ‘겪고 있다’고 답함. experience는 경험하다. 설명하다는 7번의 explain이라서 다름.","c":1},"h":"48e068376f"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis can happen when close friends or family have a hard time.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 가까운 친구들이나 가족이 힘든 시간을 보낼 때 일어날 수 있다.","opts":["Megan이 다치는 일","자신이 다치지 않아도 다른 사람과 같은 고통을 느끼는 일","의사들이 검사를 하는 일","가까운 친구들이 힘든 시간을 보내는 일"],"r":{"a":"2) 자신이 다치지 않아도 다른 사람과 같은 고통을 느끼는 일","ev":"9~10번 문장","s":[[9,"Sometimes, people can feel the same pain as others, even if they aren’t hurt.","때때로, 사람들은 자신이 다치지 않았더라도 다른 사람들과 같은 고통을 느낄 수 있다."],[10,"This can happen when close friends or family have a hard time.","이것은 가까운 친구들이나 가족이 힘든 시간을 보낼 때 일어날 수 있다."]],"w":"9번에서 사람들은 다치지 않았더라도 다른 사람과 같은 고통을 느낄 수 있다고 함. 10번의 This는 바로 그 일이고, 그 일이 when 이하(가까운 사람이 힘든 때)에 생길 수 있다는 뜻. 힘든 시간을 보내는 일은 ‘언제’에 해당하는 when절이라 This가 아님.","c":2},"h":"76a5c38ae2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s strange that these twins feel sick at the same time when only one of them is really sick.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들 중 한 명만 실제로 아픈데도 이 쌍둥이가 동시에 아픔을 느낀다는 것은 이상하다.","opts":["쌍둥이가 동시에 아픈 것은 두 사람 모두 실제로 아프기 때문이다.","쌍둥이가 서로 다른 시간에 아픈 것은 이상하다.","쌍둥이 중 한 명만 실제로 아픈데 둘이 동시에 아픔을 느끼는 것은 이상하다.","쌍둥이 중 한 명이 아프면 다른 한 명이 병원에 가는 것은 이상하다."],"r":{"a":"3) 쌍둥이 중 한 명만 실제로 아픈데 둘이 동시에 아픔을 느끼는 것은 이상하다.","ev":"6번 문장","s":[[6,"It’s strange that these twins feel sick at the same time when only one of them is really sick.","그들 중 한 명만 실제로 아픈데도 이 쌍둥이가 동시에 아픔을 느낀다는 것은 이상하다."]],"w":"6번의 when only one of them is really sick은 ‘한 명만 실제로 아픈데’, feel sick at the same time은 ‘동시에 아픔을 느끼는’. It’s strange that…은 ‘…라는 것은 이상하다’. 두 사람 모두 실제로 아픈 것이 아니라서 1번은 틀림.","c":3},"h":"c239900c16"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Megan은 Sophie와 같은 신장암에 걸린 적이 있다.","Sophie와 Megan은 잉글랜드 출신의 쌍둥이 자매이다.","의사들은 Megan의 몸에서 심각한 문제를 찾았다.","Sophie는 2017년에 희귀한 종류의 신장암에 걸렸다."],"opts":["Megan has had the same kidney cancer as Sophie.","Sophie and Megan are twin sisters from England.","The doctors found a serious problem in Megan’s body.","Sophie got a rare type of kidney cancer in 2017."],"r":{"a":"4) Sophie got a rare type of kidney cancer in 2017.","ev":"1~3번, 5번 문장","s":[[1,"Sophie and Megan are twin sisters from Scotland.","Sophie와 Megan은 스코틀랜드 출신의 쌍둥이 자매이다."],[2,"In 2017, Sophie got a rare type of kidney cancer.","2017년에, Sophie는 희귀한 종류의 신장암에 걸렸다."],[3,"Megan has never had this sickness before, but surprisingly, she has the same feelings as Sophie!","Megan은 이전에 이 질병에 걸린 적이 한 번도 없지만, 놀랍게도 그녀는 Sophie와 같은 느낌을 느낀다!"],[5,"The doctors did many tests on Megan, but they found nothing wrong with her.","의사들은 Megan에게 많은 검사를 했지만, 그녀에게서 아무런 이상을 찾지 못했다."]],"w":"2번에서 Sophie는 2017년에 희귀한 신장암에 걸림. Megan은 이 병에 걸린 적이 없고(3번), 두 사람은 스코틀랜드 출신(1번)이며, 의사들은 Megan에게서 이상을 찾지 못함(5번)이라 나머지는 모두 본문과 다름.","c":4},"h":"0494bdc835"},{"n":9,"t":"sum","q":"Megan feels the same pain as her sister Sophie even though she is not (A). This is called sympathy pain, and it seems that the twins have a special (B).","ko":"Megan은 (A) 않았는데도 자매 Sophie와 같은 통증을 느낀다. 이것은 공감고통이라 불리며, 쌍둥이는 특별한 (B)를 가진 것 같다.","oko":["(A) 화난 / (B) 문제","(A) 화난 / (B) 관계","(A) 다친 / (B) 문제","(A) 나은 / (B) 습관","(A) 다친 / (B) 관계"],"opts":["(A) angry / (B) problem","(A) angry / (B) connection","(A) hurt / (B) problem","(A) cured / (B) habit","(A) hurt / (B) connection"],"r":{"a":"5) (A) hurt / (B) connection","ev":"8~9번, 12번 문장","s":[[8,"It looks like Megan is experiencing “sympathy pain.”","Megan은 ‘공감고통’을 경험하고 있는 것처럼 보인다."],[9,"Sometimes, people can feel the same pain as others, even if they aren’t hurt.","때때로, 사람들은 자신이 다치지 않았더라도 다른 사람들과 같은 고통을 느낄 수 있다."],[12,"But, it seems clear that Megan and Sophie have a special connection.","그러나, Megan과 Sophie가 특별한 관계임은 분명한 것 같다."]],"w":"9번에서 공감고통은 자신이 다치지(hurt) 않았더라도 남과 같은 고통을 느끼는 것이고, 12번에서 Megan과 Sophie는 특별한 관계(connection)라고 함. problem, habit은 본문에서 쌍둥이 사이의 결론으로 나오지 않음.","c":5},"h":"7178e051e1"},{"n":10,"t":"fill","q":"Sophie got a rare type of kidney [A] in 2017, but the doctors found nothing [B] with Megan.","ko":"Sophie는 2017년에 희귀한 종류의 신장 [A]에 걸렸지만, 의사들은 Megan에게서 아무 [B] 것도 찾지 못했다.","bank":["cancer","wrong","twins","hurt","weight","connection"],"bko":{"cancer":"암","wrong":"잘못된, 이상한","twins":"쌍둥이","weight":"체중","connection":"관계, 연결","hurt":"다친, 아픈"},"r":{"a":"[A] cancer, [B] wrong","ev":"2번, 5번 문장","s":[[2,"In 2017, Sophie got a rare type of kidney cancer.","2017년에, Sophie는 희귀한 종류의 신장암에 걸렸다."],[5,"The doctors did many tests on Megan, but they found nothing wrong with her.","의사들은 Megan에게 많은 검사를 했지만, 그녀에게서 아무런 이상을 찾지 못했다."]],"w":"2번에서 Sophie는 a rare type of kidney cancer에 걸림. 5번에서 의사들은 found nothing wrong with her. twins, hurt, weight, connection도 본문 단어이지만 빈칸 문장에는 맞지 않음.","c":null},"h":"bc935df0ca"}]},{"u":4,"id":"rg3-04-3","no":3,"ko":"토끼는 안 들어갔는데 왜 Bunny Chow일까?","items":[{"n":1,"t":"tf","q":"Bunny Chow is a bread bowl filled with curry.","ko":"Bunny Chow는 카레로 채워진 빵 그릇이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It’s actually a bread bowl filled with curry and is a popular fast food from South Africa.","그것은 사실 카레로 채워진 빵 그릇이며, 남아프리카 공화국의 인기 있는 패스트푸드이다."]],"w":"2번 문장에 It’s actually a bread bowl filled with curry가 있음. 카레로 채운 빵 그릇이라는 내용과 일치.","c":"T"},"h":"bf3fbf5416"},{"n":2,"t":"tf","q":"Bunny Chow started in a city called Cape Town.","ko":"Bunny Chow는 Cape Town이라는 도시에서 시작되었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"This tasty dish started in a city called Durban among the Indian South Africans.","이 맛있는 요리는 Durban이라는 도시에서 남아 .","opts":["바늘들","현미경들","아주 작은 예술품들","Wigan의 손가락들"],"r":{"a":"3) 아주 작은 예술품들","ev":"4~5번 문장","s":[[4,"Making these tiny artworks is a big challenge.","이 아주 작은 예술품을 만드는 것은 큰 도전입니다."],[5,"First, the artist has to use a microscope to see them clearly, and use really small tools made from needles.","먼저, 예술가는 그것들을 뚜렷하게 보기 위해 현미경을 사용해야 하고, 바늘로 만든 정말 작은 도구들을 사용해야 합니다."]],"w":"4번에서 these tiny artworks를 만드는 것이 큰 도전이라고 했고, 5번은 그 도전의 방법. 현미경으로 뚜렷하게 보려는 대상 them은 아주 작은 예술품들. 현미경(microscope)은 보는 도구라서 them이 아님.","c":3},"h":"9e77e5377c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He reminds us that our world is in trouble, and we need to make changes to protect the variety of life on Earth.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 우리에게 세계가 곤경에 처해 있고, 지구상의 다양한 생명체를 보호하기 위해 우리가 변화를 만들어야 한다는 것을 상기시킵니다.","opts":["그는 지구의 생명체가 너무 많아서 더 줄여야 한다고 말한다.","그는 세계가 안전하므로 변화를 만들 필요가 없다고 말한다.","그는 우리가 작은 예술품을 더 많이 만들어야 한다고 말한다.","그는 세계가 곤경에 처해 있어서 다양한 생명체를 보호하려면 변화가 필요하다고 상기시킨다."],"r":{"a":"4) 그는 세계가 곤경에 처해 있어서 다양한 생명체를 보호하려면 변화가 필요하다고 상기시킨다.","ev":"8번 문장","s":[[8,"He reminds us that our world is in trouble, and we need to make changes to protect the variety of life on Earth.","그는 우리에게 세계가 곤경에 처해 있고, 지구상의 다양한 생명체를 보호하기 위해 우리가 변화를 만들어야 한다는 것을 상기시킵니다."]],"w":"8번의 our world is in trouble은 세계가 곤경에 처했다는 뜻이고, we need to make changes to protect the variety of life는 다양한 생명체를 보호하기 위해 변화를 만들어야 한다는 뜻. 생명체를 줄이자거나 변화가 필요 없다는 말이 아님.","c":4},"h":"1e588aee36"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Wigan은 모나리자와 피노키오의 큰 조각품을 만든다.","그의 작품은 가장 작은 것들조차 큰 영향을 미칠 수 있다고 생각하게 한다.","그의 조각품들은 너무 커서 바늘구멍에 놓일 수 없다.","Wigan은 망원경을 사용해 조각품을 칠한다."],"opts":["Wigan makes large sculptures of the Mona Lisa and Pinocchio.","His tiny work makes people think that even the smallest things can have a big impact.","The sculptures are too big to be placed in the eye of a needle.","Wigan uses a telescope to paint his sculptures."],"r":{"a":"2) His tiny work makes people think that even the smallest things can have a big impact.","ev":"1번, 3번, 5~6번, 9번 문장","s":[[1,"Willard Wigan is an artist who makes small sculptures of famous paintings and characters like the Mona Lisa and Pinocchio.","Willard Wigan은 모나리자와 피노키오 같은 유명한 그림과 캐릭터의 작은 조각품을 만드는 예술가입니다."],[3,"These sculptures are so small that they can be placed even in the eye of a needle!","이 조각품들은 너무 작아서 심지어 바늘구멍 안에도 놓일 수 있습니다!"],[5,"First, the artist has to use a microscope to see them clearly, and use really small tools made from needles.","먼저, 예술가는 그것들을 뚜렷하게 보기 위해 현미경을 사용해야 하고, 바늘로 만든 정말 작은 도구들을 사용해야 합니다."],[6,"Then, he paints his sculptures by using an eyelash and must work between heartbeats because even the pulse in his fingers can cause problems.","그다음, 그는 속눈썹을 사용해 조각품을 칠하며, 심지어 손가락의 맥박도 문제를 일으킬 수 있기 때문에 심장 박동 사이에 작업해야 합니다."],[9,"His tiny work makes people think that even the smallest things can have a big impact.","그의 아주 작은 작품은 사람들이 가장 작은 것들조차 큰 영향을 미칠 수 있다고 생각하게 합니다."]],"w":"9번에서 그의 아주 작은 작품은 가장 작은 것들조차 큰 영향을 미칠 수 있다고 생각하게 함. 조각품은 작고(1번), 바늘구멍에도 놓일 수 있으며(3번), 칠하는 도구는 속눈썹(6번)이라서 나머지는 모두 본문과 다름.","c":2},"h":"9f147326f7"},{"n":9,"t":"sum","q":"Wigan’s small artwork has an important message: small things (A) in a disappearing world, so we need to make (B) to protect life on Earth.","ko":"Wigan의 작은 예술품에는 중요한 메시지가 있다: 사라지고 있는 세계에서 작은 것들은 (A), 그래서 우리는 지구의 생명을 보호하기 위해 (B)을(를) 만들어야 한다.","oko":["(A) 사라진다 / (B) 변화","(A) 중요하다 / (B) 문제","(A) 중요하다 / (B) 변화","(A) 자란다 / (B) 실수","(A) 사라진다 / (B) 도구"],"opts":["(A) disappear / (B) changes","(A) matter / (B) problems","(A) matter / (B) changes","(A) grow / (B) mistakes","(A) disappear / (B) tools"],"r":{"a":"3) (A) matter / (B) changes","ev":"7~8번 문장","s":[[7,"Wigan’s small artwork has an important message: “Small things matter in a disappearing world.”","Wigan의 작은 예술품에는 중요한 메시지가 담겨 있습니다: “사라지고 있는 세계에서 작은 것들은 중요합니다.”"],[8,"He reminds us that our world is in trouble, and we need to make changes to protect the variety of life on Earth.","그는 우리에게 세계가 곤경에 처해 있고, 지구상의 다양한 생명체를 보호하기 위해 우리가 변화를 만들어야 한다는 것을 상기시킵니다."]],"w":"7번의 메시지는 Small things matter(작은 것들은 중요하다)이고, 8번에서 지구의 다양한 생명체를 보호하려면 we need to make changes(변화를 만들어야 한다)고 함. problems나 mistakes는 본문의 요구와 맞지 않음.","c":3},"h":"193379acf1"},{"n":10,"t":"fill","q":"To see his tiny artworks clearly, Wigan uses a [A], and he paints them with an [B].","ko":"자신의 아주 작은 예술품을 뚜렷하게 보기 위해 Wigan은 [A]을(를) 사용하고, 그것들을 [B](으)로 칠한다.","bank":["microscope","eyelash","needle","pulse","heartbeat","challenge"],"bko":{"microscope":"현미경","eyelash":"속눈썹","needle":"바늘","pulse":"맥박","heartbeat":"심장 박동","challenge":"도전"},"r":{"a":"[A] microscope, [B] eyelash","ev":"5~6번 문장","s":[[5,"First, the artist has to use a microscope to see them clearly, and use really small tools made from needles.","먼저, 예술가는 그것들을 뚜렷하게 보기 위해 현미경을 사용해야 하고, 바늘로 만든 정말 작은 도구들을 사용해야 합니다."],[6,"Then, he paints his sculptures by using an eyelash and must work between heartbeats because even the pulse in his fingers can cause problems.","그다음, 그는 속눈썹을 사용해 조각품을 칠하며, 심지어 손가락의 맥박도 문제를 일으킬 수 있기 때문에 심장 박동 사이에 작업해야 합니다."]],"w":"5번에서 뚜렷하게 보려고 a microscope를 사용하고, 6번에서 he paints his sculptures by using an eyelash. needle은 도구를 만드는 재료(5번), pulse와 heartbeat는 작업 시간을 가르는 것(6번)이라 알맞지 않음.","c":null},"h":"96ba83ae43"}]},{"u":5,"id":"rg3-05-2","no":2,"ko":"서랍 속에서 잠자고 있는 전자 제품의 비밀","items":[{"n":1,"t":"tf","q":"A study shows that many households in Europe put broken electronic items in a drawer.","ko":"한 연구는 유럽의 많은 가정이 고장 난 전자 제품을 서랍에 넣는다고 보여 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"When your electronic item stops working, do you put it in a drawer?","여러분의 전자 제품이 작동을 멈추면, 그것을 서랍 안에 넣나요?"],[2,"A study shows that many households in Europe do this too.","한 연구에 따르면 유럽의 많은 가정도 이렇게 한다고 해요."]],"w":"1번에서 전자 제품이 멈추면 서랍에 넣느냐고 묻고, 2번에서 한 연구가 유럽의 많은 가정도 이렇게 한다고 보여 줌. 일치.","c":"T"},"h":"aed083f10f"},{"n":2,"t":"tf","q":"Out of 74 electronic items in a household, 30 aren’t used anymore.","ko":"한 가정의 전자 제품 74개 중 30개는 더 이상 사용되지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Out of 74 electronic items in a household, 13 aren’t used anymore.","가정에 있는 74개의 전자 제품 중에서 13개는 더 이상 사용되지 않아요."]],"w":"3번 문장에서 더 이상 사용되지 않는 것은 30개가 아니라 13개(13 aren’t used anymore)임.","c":"F"},"h":"5317b19398"},{"n":3,"t":"tf","q":"E-waste includes anything with plugs, cords, and electronic parts.","ko":"e-폐기물은 플러그, 코드, 전자 부품이 있는 어떤 것이든 포함한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Whatever the reason is, e-waste includes anything with plugs, cords, and electronic parts.","이유가 무엇이든, e-폐기물은 플러그와 코드, 그리고 전자 부품이 있는 어떤 것이든 포함해요."]],"w":"7번 문장에 e-waste includes anything with plugs, cords, and electronic parts가 그대로 있음. 일치.","c":"T"},"h":"3f153f5514"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It has valuable metals like gold, silver, and copper.)","ko":"그것은 금, 은, 구리 같은 ( ) 금속을 가지고 있다.","opts":["귀중한","가벼운","오래된","값싼"],"word":"valuable","r":{"a":"1) 귀중한","ev":"8~9번 문장","s":[[8,"But, e-waste is more than regular trash.","하지만, e-폐기물은 일반적인 쓰레기 그 이상이에요."],[9,"It has valuable metals like gold, silver, and copper.","그것은 금과 은, 그리고 구리와 같은 귀중한 금속을 가지고 있어요."]],"w":"8번에서 e-폐기물이 일반 쓰레기 그 이상이라고 한 이유가 9번의 gold, silver, copper. 금, 은, 구리처럼 가치가 큰 금속이므로 valuable은 귀중한. 값싼 것이라면 쓰레기 그 이상이라고 할 수 없음.","c":1},"h":"e16687bac1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These can be reused to make batteries for electric cars and solar panels.)","ko":"이것들은 전기 자동차 배터리와 태양 전지판을 만드는 데 ( ) 수 있다.","opts":["버려지다","팔리다","재사용되다","고장 나다"],"word":"reused","r":{"a":"3) 재사용되다","ev":"10~11번 문장","s":[[10,"These can be reused to make batteries for electric cars and solar panels.","이것들은 전기 자동차 배터리와 태양 전지판을 만드는 데 재사용될 수 있어요."],[11,"So, if you have any e-waste in your house, take it to a local recycling center.","그러니까, 만약 여러분의 집에 어떠한 e-폐기물이라도 있다면, 그것을 지역 재활용 센터에 가져가세요."]],"w":"10번에서 금속들이 배터리와 태양 전지판을 만드는 데 다시 쓰일 수 있다고 함. re-(다시) + use(쓰다)라서 reused는 재사용되다. 11번에서 재활용 센터에 가져가라고 하므로 버려진다는 뜻이 아님.","c":3},"h":"d6a473f002"},{"n":6,"t":"ref","q":"What does the underlined \"These\" refer to?\nThese can be reused to make batteries for electric cars and solar panels.","ko":"밑줄 친 These가 가리키는 것은?","sko":"이것들은 전기 자동차 배터리와 태양 전지판을 만드는 데 재사용될 수 있어요.","opts":["전자 제품의 플러그들","귀중한 금속들","전기 자동차들","지역 재활용 센터들"],"r":{"a":"2) 귀중한 금속들","ev":"9~10번 문장","s":[[9,"It has valuable metals like gold, silver, and copper.","그것은 금과 은, 그리고 구리와 같은 귀중한 금속을 가지고 있어요."],[10,"These can be reused to make batteries for electric cars and solar panels.","이것들은 전기 자동차 배터리와 태양 전지판을 만드는 데 재사용될 수 있어요."]],"w":"9번에서 e-폐기물에는 gold, silver, copper 같은 valuable metals가 있다고 함. 10번의 These는 바로 그 금속들이고, 그것들로 배터리와 태양 전지판을 만듦. 전기 자동차는 만든 배터리가 쓰이는 곳이라 These가 아님.","c":2},"h":"ffca631712"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For example, they think “I might use it again,” or “I don’t know how to throw it away.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"예를 들어, 그들은 ‘나는 그것을 다시 사용할지도 몰라.’ 또는 ‘나는 그것을 어떻게 버려야 할지 몰라.’라고 생각해요.","opts":["사람들은 e-폐기물을 팔아서 돈을 벌 수 있다고 생각한다.","사람들은 e-폐기물이 다시는 쓸 수 없는 쓰레기라고 생각한다.","사람들은 e-폐기물을 버리는 방법을 모두 잘 알고 있다.","사람들은 다시 쓸지도 모른다고 생각하거나 어떻게 버릴지 몰라서 e-폐기물을 보관한다."],"r":{"a":"4) 사람들은 다시 쓸지도 모른다고 생각하거나 어떻게 버릴지 몰라서 e-폐기물을 보관한다.","ev":"5~6번 문장","s":[[5,"People keep e-waste for various reasons.","사람들은 다양한 이유로 e-폐기물을 보관해요."],[6,"For example, they think “I might use it again,” or “I don’t know how to throw it away.”","예를 들어, 그들은 ‘나는 그것을 다시 사용할지도 몰라.’ 또는 ‘나는 그것을 어떻게 버려야 할지 몰라.’라고 생각해요."]],"w":"5번에서 사람들은 다양한 이유로 e-폐기물을 보관한다고 하고, 6번이 그 예시(For example). I might use it again은 다시 쓸지도 모른다, I don’t know how to throw it away는 어떻게 버려야 할지 모른다는 뜻.","c":4},"h":"4b8c14f5c3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["한 가정의 전자 제품 대부분은 더 이상 사용되지 않는다.","e-폐기물에는 가치 있는 부분이 전혀 없다.","e-폐기물 속의 금, 은, 구리는 태양 전지판을 만드는 데 재사용될 수 있다.","사람들은 오직 한 가지 이유로 e-폐기물을 보관한다."],"opts":["Most electronic items in a household are not used anymore.","E-waste has no valuable parts.","Gold, silver, and copper in e-waste can be reused to make solar panels.","People keep e-waste for only one reason."],"r":{"a":"3) Gold, silver, and copper in e-waste can be reused to make solar panels.","ev":"3번, 5번, 9~10번 문장","s":[[3,"Out of 74 electronic items in a household, 13 aren’t used anymore.","가정에 있는 74개의 전자 제품 중에서 13개는 더 이상 사용되지 않아요."],[5,"People keep e-waste for various reasons.","사람들은 다양한 이유로 e-폐기물을 보관해요."],[9,"It has valuable metals like gold, silver, and copper.","그것은 금과 은, 그리고 구리와 같은 귀중한 금속을 가지고 있어요."],[10,"These can be reused to make batteries for electric cars and solar panels.","이것들은 전기 자동차 배터리와 태양 전지판을 만드는 데 재사용될 수 있어요."]],"w":"9~10번에서 e-폐기물의 금, 은, 구리는 전기차 배터리와 태양 전지판을 만드는 데 재사용될 수 있음. 74개 중 13개만 안 쓰이고(3번), 귀중한 금속이 있으며(9번), 보관 이유는 다양하므로(5번) 나머지는 모두 본문과 다름.","c":3},"h":"ab6b2dd529"},{"n":9,"t":"sum","q":"E-waste is more than regular trash, so if you have any, take it to a local (A) center to help the (B).","ko":"e-폐기물은 일반 쓰레기 그 이상이므로, 집에 있다면 지구를 돕기 위해 지역 (A) 센터에 가져가라.","oko":["(A) 쇼핑 / (B) 지구","(A) 수리 / (B) 공장","(A) 재활용 / (B) 서랍","(A) 쇼핑 / (B) 도시","(A) 재활용 / (B) 지구"],"opts":["(A) shopping / (B) Earth","(A) repair / (B) factory","(A) recycling / (B) drawer","(A) shopping / (B) city","(A) recycling / (B) Earth"],"r":{"a":"5) (A) recycling / (B) Earth","ev":"8번, 11~12번 문장","s":[[8,"But, e-waste is more than regular trash.","하지만, e-폐기물은 일반적인 쓰레기 그 이상이에요."],[11,"So, if you have any e-waste in your house, take it to a local recycling center.","그러니까, 만약 여러분의 집에 어떠한 e-폐기물이라도 있다면, 그것을 지역 재활용 센터에 가져가세요."],[12,"By doing this, you’ll help the Earth and make a better future for everyone!","이렇게 함으로써, 여러분은 지구를 돕고 모두에게 더 나은 미래를 만들 거예요!"]],"w":"8번에서 e-폐기물은 일반 쓰레기 그 이상이라 하고, 11번에서 지역 recycling center에 가져가라고 하며, 12번에서 그렇게 하면 지구(the Earth)를 돕는다고 함. 서랍은 문제의 출발점일 뿐 돕는 대상이 아님.","c":5},"h":"7deeee6945"},{"n":10,"t":"fill","q":"E-waste has valuable [A] like gold, silver, and copper, and they can be reused to make [B] for electric cars.","ko":"e-폐기물에는 금, 은, 구리 같은 귀중한 [A]이(가) 있고, 그것들은 전기 자동차의 [B]을(를) 만드는 데 재사용될 수 있다.","bank":["metals","batteries","study","center","drawer","households"],"bko":{"metals":"금속","batteries":"배터리","study":"연구","center":"센터","drawer":"서랍","households":"가정"},"r":{"a":"[A] metals, [B] batteries","ev":"9~10번 문장","s":[[9,"It has valuable metals like gold, silver, and copper.","그것은 금과 은, 그리고 구리와 같은 귀중한 금속을 가지고 있어요."],[10,"These can be reused to make batteries for electric cars and solar panels.","이것들은 전기 자동차 배터리와 태양 전지판을 만드는 데 재사용될 수 있어요."]],"w":"9번에서 e-waste has valuable metals like gold, silver, and copper, 10번에서 그 금속들로 make batteries for electric cars. study는 2번, center는 11번, drawer는 1번, households는 2~3번에 나오는 단어라 이 빈칸에는 맞지 않음.","c":null},"h":"94c5019112"}]},{"u":5,"id":"rg3-05-3","no":3,"ko":"마법처럼 꺼진 산불, 영웅은 염소?","items":[{"n":1,"t":"tf","q":"The fire stopped because the goats had eaten most of the dry plants in the area.","ko":"염소들이 그 지역의 마른 식물 대부분을 먹어 치웠기 때문에 불이 멈췄다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The goats had eaten most of the dry plants in the area, so the fire had nothing to burn and stopped.","염소들이 그 지역의 마른 풀을 대부분 먹어 치워서, 불은 태울 것이 없어 멈췄다."]],"w":"5번 문장에 The goats had eaten most of the dry plants in the area, so the fire had nothing to burn and stopped가 있음. 일치.","c":"T"},"h":"70e1b28b08"},{"n":2,"t":"tf","q":"Every day, the goats ate dry plants covering an area as large as ten football fields.","ko":"매일 염소들은 축구 경기장 열 개만큼 넓은 지역을 뒤덮은 마른 식물들을 먹었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Every day, the goats ate dry plants covering an area as large as two football fields.","매일, 염소들은 축구 경기장 두 개만큼 넓은 지역을 뒤덮은 마른 식물들을 먹어 치웠다."]],"w":"8번 문장에서 염소들이 먹은 지역의 크기는 as large as two football fields(축구 경기장 두 개만큼)임. 열 개가 아님.","c":"F"},"h":"c06e5ecc0c"},{"n":3,"t":"tf","q":"Goats use less water than firefighters.","ko":"염소는 소방관들보다 물을 더 적게 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Plus, goats use less water than firefighters.","게다가, 염소는 소방관들보다 물을 더 적게 사용한다."]],"w":"11번 문장에 goats use less water than firefighters가 그대로 있음. 일치.","c":"T"},"h":"faf50838d9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…because goats are great at eating plants, including the poisonous ones.)","ko":"…염소는 ( ) 것들을 포함해 식물을 먹는 데 능숙하기 때문에","opts":["독성이 있는","맛있는","키가 큰","오래된"],"word":"poisonous","r":{"a":"1) 독성이 있는","ev":"7번 문장","s":[[7,"A few weeks before the fire, the city had let the goats out to remove weeds because goats are great at eating plants, including the poisonous ones.","불이 나기 몇 주 전, 도시는 염소가 독성이 있는 것들을 포함해 식물을 먹는 데 능숙하기 때문에 잡초를 없애려고 염소들을 밖으로 내보냈다."]],"w":"7번에서 염소는 plants, including the poisonous ones(독성이 있는 것들을 포함해)을 잘 먹는다고 함. 염소가 아주 잘 먹는다는 점을 강조하려고 독초까지 든 것이므로 poisonous는 독성이 있는.","c":1},"h":"584dc6f72c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That created a space with no plants and prevented the fire from spreading.)","ko":"그것은 식물이 없는 공간을 만들었고 불이 번지는 것을 ( ).","opts":["더 키웠다","막았다","불렀다","도왔다"],"word":"prevented","r":{"a":"2) 막았다","ev":"9번 문장","s":[[9,"That created a space with no plants and prevented the fire from spreading.","그것은 식물이 없는 공간을 만들었고 불이 번지는 것을 막았다."]],"w":"9번에서 식물이 없는 공간이 생겼으므로 불이 번질 수 없었음. prevent A from spreading은 A가 번지는 것을 막다. 더 키우거나 도운 것이 아니라 반대 뜻.","c":2},"h":"7c302872a2"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat created a space with no plants and prevented the fire from spreading.","ko":"밑줄 친 That이 가리키는 것은?","sko":"그것은 식물이 없는 공간을 만들었고 불이 번지는 것을 막았다.","opts":["아파트 건물","거대한 들불","염소들이 매일 마른 식물을 먹어 치운 일","도시가 염소들을 내보낸 일"],"r":{"a":"3) 염소들이 매일 마른 식물을 먹어 치운 일","ev":"8~9번 문장","s":[[8,"Every day, the goats ate dry plants covering an area as large as two football fields.","매일, 염소들은 축구 경기장 두 개만큼 넓은 지역을 뒤덮은 마른 식물들을 먹어 치웠다."],[9,"That created a space with no plants and prevented the fire from spreading.","그것은 식물이 없는 공간을 만들었고 불이 번지는 것을 막았다."]],"w":"8번에서 염소들이 매일 축구장 두 개 넓이의 마른 식물을 먹어 치움. 9번의 That은 바로 그 일이고, 그 결과 식물 없는 공간이 생겼음. 도시가 염소를 내보낸 일은 7번이고 그 일은 공간을 만든 것이 아님.","c":3},"h":"e064ebf08e"},{"n":7,"t": rs.","게다가, 염소는 소방관들보다 물을 더 적게 사용한다."]],"w":"7번에서 불이 나기 몇 주 전에 도시가 잡초를 없애려고 염소들을 내보냄. 불을 멈춘 것은 염소들(4~5번)이고, 염소들은 넓은 지역을 먹었으며(8번), 염소가 소방관보다 물을 적게 쓰므로(11번) 나머지는 모두 본문과 다름.","c":2},"h":"adbba59104"},{"n":9,"t":"sum","q":"The goats ate the dry plants and made a space with no (A), so the fire could not (B) and stopped.","ko":"염소들이 마른 식물을 먹어 (A)이(가) 없는 공간을 만들어서, 불은 (B) 수 없었고 멈췄다.","oko":["(A) 물 / (B) 번지다","(A) 염소 / (B) 시작하다","(A) 사람 / (B) 타다","(A) 물 / (B) 멈추다","(A) 식물 / (B) 번지다"],"opts":["(A) water / (B) spread","(A) goats / (B) start","(A) people / (B) burn","(A) water / (B) stop","(A) plants / (B) spread"],"r":{"a":"5) (A) plants / (B) spread","ev":"5번, 9번 문장","s":[[5,"The goats had eaten most of the dry plants in the area, so the fire had nothing to burn and stopped.","염소들이 그 지역의 마른 풀을 대부분 먹어 치워서, 불은 태울 것이 없어 멈췄다."],[9,"That created a space with no plants and prevented the fire from spreading.","그것은 식물이 없는 공간을 만들었고 불이 번지는 것을 막았다."]],"w":"9번에서 염소들이 식물이 없는 공간(a space with no plants)을 만들었고 불이 번지는(spreading) 것을 막았다고 함. 불은 이미 시작된 상태이므로 start가 아니고, 물이나 사람은 이 설명에 나오지 않음.","c":5},"h":"b4df134597"},{"n":10,"t":"fill","q":"Goats are not only [A] friendly for removing weeds but also effective in fire prevention, and they use less [B] than firefighters.","ko":"염소는 잡초를 없애는 데 [A] 친화적일 뿐만 아니라 화재 예방에도 효과적이며, 소방관들보다 [B]을(를) 더 적게 사용한다.","bank":["environmentally","water","poisonous","football","apartment","goats"],"bko":{"environmentally":"환경적으로","water":"물","poisonous":"독성이 있는","football":"축구","apartment":"아파트","goats":"염소들"},"r":{"a":"[A] environmentally, [B] water","ev":"10~11번 문장","s":[[10,"Goats are not only environmentally friendly for removing weeds but also effective in fire prevention.","염소는 잡초를 없애는 데 환경친화적일 뿐만 아니라 화재 예방에도 효과적이다."],[11,"Plus, goats use less water than firefighters.","게다가, 염소는 소방관들보다 물을 더 적게 사용한다."]],"w":"10번에서 Goats are not only environmentally friendly for removing weeds but also effective in fire prevention, 11번에서 goats use less water than firefighters. poison 생각한다.","oko":["(A) 쪽으로 / (B) 에너지","(A) 쪽으로 / (B) 먹이","(A) 멀리 / (B) 먹이","(A) 멀리 / (B) 시간","(A) 멀리 / (B) 에너지"],"opts":["(A) toward / (B) energy","(A) toward / (B) food","(A) away / (B) food","(A) away / (B) time","(A) away / (B) energy"],"r":{"a":"5) (A) away / (B) energy","ev":"3번, 10~11번 문장","s":[[3,"While most birds fly away from them, shearwaters fly straight into them!","대부분의 새가 폭풍으로부터 멀리 날아가는 반면, 슴새들은 폭풍 속으로 곧장 날아간다!"],[10,"Meanwhile, other shearwaters head straight into the storm’s center.","한편, 다른 슴새들은 폭풍의 중심으로 곧장 향한다."],[11,"Scientists think shearwaters might do this to save energy and avoid dangers near the land, like flying things that could hurt them.","과학자들은 슴새들이 에너지를 아끼고, 육지 근처의 날아다니는 물체처럼 자신들을 다치게 할 수 있는 위험을 피하려고 이렇게 하는 것일지도 모른다고 생각한다."]],"w":"3번에서 대부분의 새는 폭풍으로부터 멀리(away) 날아가는 반면 슴새는 곧장 날아들고, 11번에서 슴새가 에너지(energy)를 아끼고 위험을 피하려고 이렇게 할지도 모른다고 함. 먹이나 시간은 본문에 나오지 않음.","c":5},"h":"cf472b9626"},{"n":10,"t":"fill","q":"To learn more about shearwater behavior, scientists [A] their flight paths for 11 years, and flying into a storm’s center is a smart [B].","ko":"슴새의 행동에 대해 더 알아보기 위해 과학자들은 11년간 그것들의 비행경로를 [A], 폭풍의 중심으로 날아가는 것은 현명한 [B]이다.","bank":["tracked","trick","stayed","headed","edge","center"],"bko":{"tracked":"추적했다","trick":"요령, 비결","stayed":"머물렀다","headed":"향했다","edge":"가장자리","center":"중심"},"r":{"a":"[A] tracked, [B] trick","ev":"7번, 12번 문장","s":[[7,"To learn more about shearwater behavior, scientists tracked their flight paths during storms for 11 years.","슴새의 행동에 대해 더 알아보기 위해, 과학자들은 11년 동안 폭풍 중 그것들의 비행경로를 추적했다."],[12,"Flying into a storm’s center is a smart trick that only shearwaters seem to know!","폭풍의 중심으로 날아가는 것은 슴새들만 아는 것 같은 현명한 요령이다!"]],"w":"7번에서 과학자들은 슴새의 비행경로를 11년 동안 tracked했고, 12번에서 폭풍의 중심으로 날아가는 것은 a smart trick이라고 함. stayed는 5번, headed는 10번에 나오지만 ‘경로를 11년간 추적했다’ 자리에 맞지 않고, edge와 center는 장소를 뜻해 smart 뒤에 맞지 않음.","c":null},"h":"4018b84ba6"}]},{"u":6,"id":"rg3-06-2","no":2,"ko":"신발 끈을 못 묶던 소년이 나이키를 움직였다","items":[{"n":1,"t":"tf","q":"Nike invited ated는 좌절한. 행복하거나 자랑스러운 감정이면 편지를 쓸 이유가 없음.","c":1},"h":"e135d87907"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He was able to be independent and go to college away from home.)","ko":"그는 ( ) 수 있었고 집에서 멀리 떨어진 대학에 갈 수 있었다.","opts":["의존하는","독립적인","외로운","게으른"],"word":"independent","r":{"a":"2) 독립적인","ev":"10~11번 문장","s":[[10,"These shoes helped Matthew achieve his dream.","이 신발들은 Matthew가 그의 꿈을 이루도록 도왔다."],[11,"He was able to be independent and go to college away from home.","그는 독립적일 수 있었고 집에서 멀리 떨어진 대학에 갈 수 있었다."]],"w":"11번에서 independent 뒤에 집에서 멀리 떨어진 대학에 간다는 내용이 이어짐. 남에게 기대지 않고 스스로 하는 상태이므로 독립적인. 10번에서 신발이 꿈을 이루도록 도왔다고 해서 긍정적인 변화임.","c":2},"h":"60653252e9"},{"n":6,"t":"ref","q":"What does the underlined \"such shoes\" refer to?\nSurprisingly, Nike invited him to design such shoes.","ko":"밑줄 친 such shoes가 가리키는 것은?","sko":"놀랍게도, 나이키는 그러한 신발을 디자인해 달라고 그를 초대했다.","opts":["끈이 많이 달린 신발","운동 경기를 위한 비싼 신발","장애가 있는 사람들이 쉽게 신을 수 있는 신발","Matthew가 이미 가지고 있던 신발"],"r":{"a":"3) 장애가 있는 사람들이 쉽게 신을 수 있는 신발","ev":"4~5번 문장","s":[[4,"So, he wrote an open letter to the shoe company Nike, and asked for shoes that people with disabilities could easily put on.","그래서 그는 신발 회사 나이키에 공개편지를 썼고, 장애가 있는 사람들이 쉽게 신을 수 있는 신발을 요청했다."],[5,"Surprisingly, Nike invited him to design such shoes.","놀랍게도, 나이키는 그러한 신발을 디자인해 달라고 그를 초대했다."]],"w":"4번에서 Matthew가 나이키에 shoes that people with disabilities could easily put on을 요청함. 5번의 such shoes는 바로 그런 신발. 끈이 많은 신발은 오히려 Matthew가 못 묶던 것이라 반대.","c":3},"h":"2571f85121"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This allows the foot to slide in and out easily.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 발이 쉽게 미끄러져 들어가고 나올 수 있게 해 준다.","opts":["이것은 신발 끈을 더 쉽게 묶을 수 있게 해 준다.","이것은 발이 신발 안에서 빠르게 달릴 수 있게 해 준다.","이것은 발을 단단히 고정해서 신발이 벗겨지지 않게 한다.","이것은 발이 신발 안으로 쉽게 들어가고 밖으로 쉽게 나올 수 있게 해 준다."],"r":{"a":"4) 이것은 발이 신발 안으로 쉽게 들어가고 밖으로 쉽게 나올 수 있게 해 준다.","ev":"8~9번 문장","s":[[8,"The back of the shoe opens with the zipper.","신발의 뒷부분은 지퍼로 열린다."],[9,"This allows the foot to slide in and out easily.","이것은 발이 쉽게 미끄러져 들어가고 나올 수 있게 해 준다."]],"w":"8번에서 신발의 뒷부분이 지퍼로 열린다고 했고, 9번의 allows the foot to slide in and out easily는 발이 안팎으로 쉽게 미끄러져 드나들게 해 준다는 뜻. 신발 끈이나 달리기는 본문에 나오지 않음.","c":4},"h":"2993be8195"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Matthew는 10살에 신발 끈 묶는 법을 배웠다.","Matthew는 집에서 멀리 떨어진 대학에 갈 수 있었다.","FlyEase에는 끈이 있고 지퍼는 없다.","나이키는 Matthew를 위해 신발을 디자인하는 것을 거절했다."],"opts":["Matthew learned to tie his shoes when he was 10.","Matthew was able to go to college away from home.","The Nike FlyEase has laces and no zipper.","Nike refused to design shoes for Matthew."],"r":{"a":"2) Matthew was able to go to college away from home.","ev":"3번, 5번, 7번, 11번 문장","s":[[3,"By 16, he still couldn’t tie his shoes, and felt frustrated about it.","16세가 되어서도 그는 여전히 신발 끈을 묶지 못했고, 그것에 대해 좌절감을 느꼈다."],[5,"Surprisingly, Nike invited him to design such shoes.","놀랍게도, 나이키는 그러한 신발을 디자인해 달라고 그를 초대했다."],[7,"This shoe, with a zipper and Velcro strap, is easy to put on and take off.","지퍼와 벨크로 끈이 있는 이 신발은 신고 벗기에 쉽다."],[11,"He was able to be independent and go to college away from home.","그는 독립적일 수 있었고 집에서 멀리 떨어진 대학에 갈 수 있었다."]],"w":"11번에서 Matthew는 독립적일 수 있었고 집에서 멀리 떨어진 대학에 갈 수 있었음. 16세에도 못 묶었고(3번), 나이키는 그를 초대했고(5번), FlyEase에는 지퍼와 벨크로 끈이 있으므로(7번) 나머지는 모두 본문과 다름.","c":2},"h":"e0acafb9ee"},{"n":9,"t":"sum","q":"Matthew felt (A) because he couldn’t tie his shoes, so he wrote to Nike, and now he wants everyone to know that anyone can make a (B).","ko":"Matthew는 신발 끈을 묶지 못해서 (A)을(를) 느꼈고, 그래서 나이키에 편지를 썼으며, 이제 그는 누구나 (B)을(를) 만들 수 있다는 것을 모두가 알기를 원한다.","oko":["(A) 자랑스러움 / (B) 변화","(A) 좌절감 / (B) 실수","(A) 자랑스러움 / (B) 실수","(A) 신남 / (B) 신발","(A) 좌절감 / (B) 변화"],"opts":["(A) proud / (B) difference","(A) frustrated / (B) mistake","(A) proud / (B) mistake","(A) excited / (B) shoe","(A) frustrated / (B) difference"],"r":{"a":"5) (A) frustrated / (B) difference","ev":"3~4번, 12번 문장","s":[[3,"By 16, he still couldn’t tie his shoes, and felt frustrated about it.","16세가 되어서도 그는 여전히 신발 끈을 묶지 못했고, 그것에 대해 좌절감을 느꼈다."],[4,"So, he wrote an open letter to the shoe company Nike, and asked for shoes that people with disabilities could easily put on.","그래서 그는 신발 회사 나이키에 공개편지를 썼고, 장애가 있는 사람들이 쉽게 신을 수 있는 신발을 요청했다."],[12,"He wants people to know that anyone can speak up and make a difference, just as he did.","그는 꼭 자신이 그랬던 것처럼, 누구나 거리낌 없이 말하며 변화를 만들 수 있다는 것을 사람들이 알기를 원한다."]],"w":"3번에서 신발 끈을 못 묶어 frustrated(좌절감)를 느꼈고, 4번에서 So 나이키에 편지를 씀. 12번에서 누구나 speak up하면 make a difference(변화를 만들다)할 수 있다고 함. 자랑스러움이나 신남은 이 상황과 맞지 않음.","c":5},"h":"75c03c810b"},{"n":10,"t":"fill","q":"After three years of working together, Matthew and Nike [A] the Nike FlyEase in 2015, and this shoe has a [B] and Velcro strap.","ko":"3년간 함께 작업한 후, Matthew와 나이키는 2015년에 나이키 FlyEase를 [A], 이 신발에는 [B]와 벨크로 끈이 있다.","bank":["released","zipper","tied","wrote","college","dream"],"bko":{"released":"출시했다","zipper":"지퍼","tied":"묶었다","wrote":"썼다","college":"대학","dream":"꿈"},"r":{"a":"[A] released, [B] zipper","ev":"6~7번 문장","s":[[6,"After three years of working together, they released The Nike FlyEase in 2015.","3년간 함께 작업한 후, 그들은 2015년에 나이키 FlyEase를 출시했다."],[7,"This shoe, with a zipper and Velcro strap, is easy to put on and take off.","지퍼와 벨크로 끈이 있는 이 신발은 신고 벗기에 쉽다."]],"w":"6번에서 they released The Nike FlyEase in 2015, 7번에서 This shoe, with a zipper and Velcro strap. tied와 wrote는 2~4번의 Matthew의 일이고, college와 dream은 10~11번 단어라 빈칸에 맞지 않음.","c":null},"h":"23f154772f"}]},{"u":6,"id":"rg3-06-3","no":3,"ko":"굴이 강을 청소한다고? 뉴욕의 수중 청소부","items":[{"n":1,"t":"tf","q":"New York City has put over 11 million young oysters in the Hudson River.","ko":"뉴욕시는 허드슨 강에 어린 굴을 1,100만 마리 이상 넣었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The city has put over 11 million young oysters in the river, and these small shellfish are making the water cleaner.","뉴욕시는 강에 어린 굴을 1,100만 마리 이상 넣었고, 이 작은 조개류들은 물을 더 깨끗하게 만들고 있다."]],"w":"5번 문장에 The city has put over 11 million young oysters in the river가 있음. 일치.","c":"T"},"h":"25996dfd2c"},{"n":2,"t":"tf","q":"Oysters take in water, filter out harmful things, and leave them at the top of the river.","ko":"굴은 물을 빨아들이고, 해로운 것들을 걸러 내어, 강의 꼭대기에 남겨 둔다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"They take in water, filter out harmful things, and leave them at the bottom of the river.","그것들은 물을 빨아들이고, 해로운 것들을 걸러 내어, 강바닥에 남겨 둔다."]],"w":"8번 문장에서 걸러 낸 해로운 것들을 남겨 두는 곳은 at the bottom of the river(강바닥)임. 꼭대기(top)가 아님.","c":"F"},"h":"79ae68f5aa"},{"n":3,"t":"tf","q":"Many sea animals have returned to the area because the ecosystem is getting healthier.","ko":"생태계가 점점 더 건강해지고 있어서 많은 해양 동물들이 그 지역으로 돌아왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Because of the reefs, the ecosystem is getting healthier, and many sea animals have returned to the area.","암초 덕분에, 생태계는 점점 더 건강해지고 있고, 많은 해양 동물들이 그 지역으로 돌아왔다."]],"w":"12번 문장에 the ecosystem is getting healthier, and many sea animals have returned to the area가 있음. 생태계가 건강해지고 해양 동물이 돌아왔다는 내용과 일치.","c":"T"},"h":"a8d78d806f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They take in water, filter out harmful things, and leave them at the bottom of the river.)","ko":"그것들은 물을 빨아들이고, ( ) 것들을 걸러 내어, 강바닥에 남겨 둔다.","opts":["해로운","귀한","맛있는","깨끗한"],"word":"harmful","r":{"a":"1) 해로운","ev":"8~9번 문장","s":[[8,"They take in water, filter out harmful things, and leave them at the bottom of the river.","그것들은 물을 빨아들이고, 해로운 것들을 걸러 내어, 강바닥에 남겨 둔다."],[9,"As a result, the water becomes less polluted!","그 결과, 물은 덜 오염된다!"]],"w":"8번에서 굴이 걸러 내어 강바닥에 남기는 것이 harmful things이고, 그 결과 9번에서 물이 덜 오염됨. 걸러 내서 치우는 것이므로 harmful은 해로운. 귀하거나 깨끗한 것이라면 걸러 낼 이유가 없음.","c":1},"h":"59e8aaf64d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These oyster reefs provide places where lots of plants and animals can live.)","ko":"이러한 굴 암초는 많은 식물과 동물이 살 수 있는 장소를 ( ).","opts":["없애다","제공하다","찾다","사다"],"word":"provide","r":{"a":"2) 제공하다","ev":"10~11번 문장","s":[[10,"In addition, oysters make reefs or underwater homes.","게다가, 굴은 암초 또는 수중 서식지를 만든다."],[11,"These oyster reefs provide places where lots of plants and animals can live.","이러한 굴 암초는 많은 식물과 동물이 살 수 있는 장소를 제공한다."]],"w":"10번에서 굴이 암초(수중 집)를 만든다고 하고, 11번에서 그 암초가 식물과 동물이 살 장소를 provide함. 살 곳을 내준다는 뜻이므로 제공하다. 없애는 것이 아님.","c":2},"h":"2d6296de40"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey take in water, filter out harmful things, and leave them at the bottom of the river.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것들은 물을 빨아들이고, 해로운 것들을 걸러 내어, 강바닥에 남겨 둔다.","opts":["굴들","강물","해로운 것들","강바닥의 조개껍데기들"],"r":{"a":"3) 해로운 것들","ev":"7~8번 문장","s":[[7,"Oysters have a special way of cleaning up.","굴은 특별한 청소 방법을 가지고 있다."],[8,"They take in water, filter out harmful things, and leave them at the bottom of the river.","그것들은 물을 빨아들이고, 해로운 것들을 걸러 내어, 강바닥에 남겨 둔다."]],"w":"8번의 They는 굴이고, 굴이 한 일: 물을 빨아들임, 해로운 것들을 걸러 냄, 그것들(them)을 강바닥에 남김. 걸러 낸 대상이 harmful things라서 them은 해로운 것들. 굴이 자기 자신을 남기는 것이 아님.","c":3},"h":"349e92c403"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because of the reefs, the ecosystem is getting healthier, and many sea animals have returned to the area.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"암초 덕분에, 생태계는 점점 더 건강해지고 있고, 많은 해양 동물들이 그 지역으로 돌아왔다.","opts":["암초 때문에 생태계가 나빠져서 많은 해양 동물이 떠났다.","암초가 없어서 생태계가 점점 더 건강해지고 있다.","많은 해양 동물이 암초를 만들려고 그 지역으로 돌아왔다.","암초 덕분에 생태계가 점점 더 건강해지고 있고 많은 해양 동물이 그 지역으로 돌아왔다."],"r":{"a":"4) 암초 덕분에 생태계가 점점 더 건강해지고 있고 많은 해양 동물이 그 지역으로 돌아왔다.","ev":"12번 문장","s":[[12,"Because of the reefs, the ecosystem is getting healthier, and many sea animals have returned to the area.","암초 덕분에, 생태계는 점점 더 건강해지고 있고, 많은 해양 동물들이 그 지역으로 돌아왔다."]],"w":"12번의 Because of the reefs는 암초 덕분에(때문에), is getting healthier는 점점 더 건강해지고 있다, have returned to the area는 그 지역으로 돌아왔다는 뜻. 암초는 굴이 만든 것이고(10번) 생태계를 좋게 만듦.","c":4},"h":"3f8761c56a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["굴은 물을 더 오염되게 만든다.","굴은 강의 식물과 동물을 먹어 없앤다.","굴은 식물과 동물이 살 수 있는 암초를 만든다.","뉴욕시는 강에 굴을 아주 조금만 넣었다."],"opts":["Oysters make the water more polluted.","Oysters eat the plants and animals in the river.","Oysters make reefs that provide places for plants and animals to live.","New York City put only a few oysters in the river."],"r":{"a":"3) Oysters make reefs that provide places for plants and animals to live.","ev":"5번, 9~11번 문장","s":[[5,"The city has put over 11 million young oysters in the river, and these small shellfish are making the water cleaner.","뉴욕시는 강에 어린 굴을 1,100만 마리 이상 넣었고, 이 작은 조개류들은 물을 더 깨끗하게 만들고 있다."],[9,"As a result, the water becomes less polluted!","그 결과, 물은 덜 오염된다!"],[10,"In addition, oysters make reefs or underwater homes.","게다가, 굴은 암초 또는 수중 서식지를 만든다."],[11,"These oyster reefs provide places where lots of plants and animals can live.","이러한 굴 암초는 많은 식물과 동물이 살 수 있는 장소를 제공한다."]],"w":"10~11번에서 굴은 암초를 만들고, 그 암초가 많은 식물과 동물이 살 수 있는 장소를 제공함. 물은 덜 오염되고(9번), 굴을 먹는 이야기는 없으며, 굴은 1,100만 마리 이상 넣었으므로(5번) 나머지는 모두 본문과 다름.","c":3},"h":"f2b0bde461"},{"n":9,"t":"sum","q":"Oysters make the water (A) by filtering it, and their reefs help sea (B) return to the area.","ko":"굴은 물을 걸러서 물을 더 (A) 만들고, 굴의 암초는 해양 (B)이(가) 그 지역으로 돌아오도록 돕는다.","oko":["(A) 더러운 / (B) 동물","(A) 더 깨끗한 / (B) 도시","(A) 더 따뜻한 / (B) 동물","(A) 더러운 / (B) 도시","(A) 더 깨끗한 / (B) 동물"],"opts":["(A) dirtier / (B) animals","(A) cleaner / (B) cities","(A) warmer / (B) animals","(A) dirtier / (B) cities","(A) cleaner / (B) animals"],"r":{"a":"5) (A) cleaner / (B) animals","ev":"8~9번, 12번 문장","s":[[8,"They take in water, filter out harmful things, and leave them at the bottom of the river.","그것들은 물을 빨아들이고, 해로운 것들을 걸러 내어, 강바닥에 남겨 둔다."],[9,"As a result, the water becomes less polluted!","그 결과, 물은 덜 오염된다!"],[12,"Because of the reefs, the ecosystem is getting healthier, and many sea animals have returned to the area.","암초 덕분에, 생태계는 점점 더 건강해지고 있고, 많은 해양 동물들이 그 지역으로 돌아왔다."]],"w":"8~9번에서 굴이 해로운 것을 걸러 내서 물이 덜 오염됨(더 깨끗해짐). 12번에서 암초 덕분에 many sea animals가 그 지역으로 돌아옴. dirtier는 반대 뜻이고, 도시와 따뜻함은 본문에 나오지 않음.","c":5},"h":"b4e78c0849"},{"n":10,"t":"fill","q":"New York City has put over 11 million young [A] in the river, and these small shellfish are making the water [B].","ko":"뉴욕시는 강에 어린 [A]을(를) 1,100만 마리 이상 넣었고, 이 작은 조개류들은 물을 더 [B] 만들고 있다.","bank":["oysters","cleaner","reefs","bottom","seafood","ecosystem"],"bko":{"oysters":"굴","cleaner":"더 깨끗한","reefs":"암초","bottom":"바닥","seafood":"해산물","ecosystem":"생태계"},"r":{"a":"[A] oysters, [B] cleaner","ev":"5번 문장","s":[[5,"The city has put over 11 million young oysters in the river, and these small shellfish are making the water cleaner.","뉴욕시는 강에 어린 굴을 1,100만 마리 이상 넣었고, 이 작은 조개류들은 물을 더 깨끗하게 만들고 있다."]],"w":"5번에서 The city has put over 11 million young oysters in the river, and these small shellfish are making the water cleaner. reefs는 10번, bottom은 8번, seafood는 1번, ecosystem은 12번에 나오는 단어이지만 이 빈칸 문장에는 맞지 않음.","c":null},"h":"69021ff420"}]},{"u":7,"id":"rg3-07-1","no":1,"ko":"세상을 구한 영웅은 작은 쥐였다?","items":[{"n":1,"t":"tf","q":"Magawa learned to find bombs by using his great sense of smell.","ko":"Magawa는 뛰어난 후각을 사용해 폭탄을 찾는 것을 배웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"After he was born in Tanzania, he learned to find bombs by using his great sense of smell.","그는 탄자니아에서 태어난 후, 그의 뛰어난 후각을 사용하여 폭탄을 찾는 것을 배웠다."]],"w":"2번 문장에 learned to find bombs by using his great sense of smell이 그대로 나옴. 후각(냄새 맡는 감각)으로 폭탄을 찾는 법을 배웠다는 내용과 일치.","c":"T"},"h":"18c07830d4"},{"n":2,"t":"tf","q":"Magawa began his work in Tanzania.","ko":"Magawa는 탄자니아에서 일을 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"He began his work after moving to Cambodia.","그는 캄보디아로 이주한 후 그의 일을 시작했다."]],"w":"일은 캄보디아로 이주한 후에 시작했다(3번: after moving to Cambodia). 탄자니아는 일을 시작한 곳이 아니라 태어난 곳이다.","c":"F"},"h":"ea83847d1e"},{"n":3,"t":"tf","q":"Magawa was given a gold medal to thank him for his work.","ko":"Magawa는 그의 일에 감사하는 뜻으로 금메달을 받았다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"To thank him for this, he was given a gold medal.","이것에 대해 그에게 감사하기 위해, 그에게 금메달이 주어졌다."]],"w":"8번 문장 To thank him for this, he was given a gold medal. 감사하려고 금메달을 주었다는 내용과 일치.","c":"T"},"h":"c7bc300496"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He helped clear more than 225,000 square meters of land.)","ko":"그는 225,000제곱미터 이상의 땅을 ___는 것을 도왔다.","opts":["측정하다","치우다","표시하다","빌리다"],"word":"clear","r":{"a":"2) 치우다","ev":"5번 문장","s":[[5,"He helped clear more than 225,000 square meters of land.","그는 225,000제곱미터 이상의 땅을 치우는 것을 도왔다."]],"w":"땅을 clear한다는 것은 위험한 지뢰와 장애물을 ‘치운다’는 뜻. 4번에서 지뢰가 남아 있다고 했으니 그것을 치우는 일임.","c":2},"h":"0619488f44"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…he left a “lasting legacy” because he saved so many lives.)","ko":"…그는 많은 목숨을 구했기 때문에 ‘___ 유산’을 남겼다.","opts":["갑작스러운","위험한","오래 지속되는","특별한"],"word":"lasting","r":{"a":"3) 오래 지속되는","ev":"10번 문장","s":[[10,"The people who trained him said that he left a “lasting legacy” because he saved so many lives.","그를 훈련시킨 사람들은 그가 매우 많은 목숨을 구했기 때문에 ‘오래 남을 유산’을 남겼다고 말했다."]],"w":"lasting은 오래 이어지는 뜻. 많은 목숨을 구한 업적이 오래 남는다는 흐름이라 ‘오래 지속되는’이 알맞음.","c":3},"h":"b15b59f1a1"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat’s equal to 40 soccer fields!","ko":"밑줄 친 That이 가리키는 것은?","sko":"그것은 축구장 40개와 같은 크기이다!","opts":["찾아낸 지뢰의 개수","Magawa가 일한 햇수","Magawa가 받은 금메달","Magawa가 치운 땅의 넓이"],"r":{"a":"4) Magawa가 치운 땅의 넓이","ev":"5~6번 문장","s":[[5,"He helped clear more than 225,000 square meters of land.","그는 225,000제곱미터 이상의 땅을 치우는 것을 도왔다."],[6,"That’s equal to 40 soccer fields!","그것은 축구장 40개와 같은 크기이다!"]],"w":"6번의 That 바로 앞 5번 문장에 225,000제곱미터 이상의 땅이 나옴. 그 넓이가 축구장 40개와 같다는 말.","c":4},"h":"dd96f63213"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The people who trained him said that he left a “lasting legacy” because he saved so many lives.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그를 훈련시킨 사람들은 그가 매우 많은 목숨을 구했기 때문에 ‘오래 남을 유산’을 남겼다고 말했다.","opts":["Magawa를 훈련시킨 사람들은, 그가 많은 목숨을 구해서 오래 남을 업적을 남겼다고 말했다.","Magawa를 훈련시킨 사람들은, 훈련이 너무 힘들어서 오래 기억될 것이라고 말했다.","Magawa를 훈련시킨 사람들이 많은 목숨을 구해서 오래 남을 업적을 남겼다.","Magawa를 훈련시킨 사람들은, 그가 유산을 받아서 많은 목숨을 구했다고 말했다."],"r":{"a":"1) Magawa를 훈련시킨 사람들은, 그가 많은 목숨을 구해서 오래 남을 업적을 남겼다고 말했다.","ev":"10번 문장","s":[[10,"The people who trained him said that he left a “lasting legacy” because he saved so many lives.","그를 훈련시킨 사람들은 그가 매우 많은 목숨을 구했기 때문에 ‘오래 남을 유산’을 남겼다고 말했다."]],"w":"who trained him은 ‘그를 훈련시킨’ 사람들. 목숨을 구한 것은 사람들이 아니라 Magawa이고, 그것이 ‘오래 남을 유산’의 이유(because)임.","c":1},"h":"225c22404b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["Magawa는 캄보디아에서 태어났다.","Magawa는 지뢰를 100개보다 적게 찾았다.","Magawa는 은퇴한 후 8살에 죽었다.","Magawa는 은메달을 받았다."],"opts":["Magawa was born in Cambodia.","Magawa found fewer than 100 landmines.","Magawa died at the age of 8 after he retired.","Magawa was given a silver medal."],"r":{"a":"3) Magawa died at the age of 8 after he retired.","ev":"2번, 7~9번 문장","s":[[2,"After he was born in Tanzania, he learned to find bombs by using his great sense of smell.","그는 탄자니아에서 태어난 후, 그의 뛰어난 후각을 사용하여 폭탄을 찾는 것을 배웠다."],[7,"During his work, he found more than 100 landmines and other hidden dangers.","일하는 동안, 그는 100개가 넘는 지뢰와 다른 숨겨진 위험물들을 찾아냈다."],[8,"To thank him for this, he was given a gold medal.","이것에 대해 그에게 감사하기 위해, 그에게 금메달이 주어졌다."],[9,"Unfortunately, Magawa died at the age of 8 after retiring from work.","안타깝게도, Magawa는 일에서 은퇴한 후 8살의 나이에 죽었다."]],"w":"9번: 은퇴한 후 8살에 죽었음(③). 태어난 곳은 탄자니아(2번), 지뢰는 100개 이상(7번), 받은 메달은 금메달(8번)이라 나머지는 틀림.","c":3},"h":"4ee0ab301d"},{"n":9,"t":"sum","q":"Magawa used his great sense of (A) to find bombs, and he was given a (B) medal to thank him.","ko":"Magawa는 뛰어난 (A)를 사용해 폭탄을 찾았고, 감사의 뜻으로 (B) 메달을 받았다.","oko":["(A) 시각 / (B) 금","(A) 후각 / (B) 은","(A) 청각 / (B) 은","(A) 후각 / (B) 금","(A) 미각 / (B) 금"],"opts":["(A) sight / (B) gold","(A) smell / (B) silver","(A) hearing / (B) silver","(A) smell / (B) gold","(A) taste / (B) gold"],"r":{"a":"4) (A) smell / (B) gold","ev":"2번, 8번 문장","s":[[2,"After he was born in Tanzania, he learned to find bombs by using his great sense of smell.","그는 탄자니아에서 태어난 후, 그의 뛰어난 후각을 사용하여 폭탄을 찾는 것을 배웠다."],[8,"To thank him for this, he was given a gold medal.","이것에 대해 그에게 감사하기 위해, 그에게 금메달이 주어졌다."]],"w":"2번에서 great sense of smell(후각), 8번에서 gold medal(금메달). 후각+금이 모두 맞는 선택지는 4)뿐임.","c":4},"h":"d8be590ed3"},{"n":10,"t":"fill","q":"In Cambodia, many years of [A] left behind dangerous landmines, and Magawa found more than 100 landmines and other [B] dangers.","ko":"캄보디아에서는 수년간의 [A]가 위험한 지뢰를 남겼고, Magawa는 100개 넘는 지뢰와 다른 [B] 위험물을 찾았다.","bank":["conflict","hidden","smell","lasting","brave","medal"],"bko":{"conflict":"전투, 갈등","hidden":"숨겨진","smell":"후각, 냄새","lasting":"오래 지속되는","brave":"용감한","medal":"메달"},"r":{"a":"[A] conflict, [B] hidden","ev":"4번, 7번 문장","s":[[4,"In Cambodia, many years of conflict have left behind dangerous landmines.","캄보디아에서는 수년간의 전투가 위험한 지뢰들을 남겼다."],[7,"During his work, he found more than 100 landmines and other hidden dangers.","일하는 동안, 그는 100개가 넘는 지뢰와 다른 숨겨진 위험물들을 찾아냈다."]],"w":"4번 many years of conflict(수년간의 전투)가 지뢰를 남겼고, 7번 other hidden dangers(다른 숨겨진 위험물)를 찾았음. brave, lasting은 10~11번에서 쓰인 말이라 여기에는 맞지 않음.","c":null},"h":"e8dc968793"}]},{"u":7,"id":"rg3-07-2","no":2,"ko":"프렌치프라이는 프랑스 음식이 아니다?","items":[{"n":1,"t":"tf","q":"The average American eats nearly 14 kilograms of French fries each year.","ko":"평균적인 미국인은 매년 거의 14킬로그램의 감자튀김을 먹는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In fact, the average American eats nearly 14 kilograms of French fries each year.","사실, 평균적인 미국인은 매년 거의 14킬로그램의 감자튀김을 먹는다."]],"w":"2번 문장 the average American eats nearly 14 kilograms of French fries each year와 일치.","c":"T"},"h":"7091dc6a64"},{"n":2,"t":"tf","q":"In the winter of 1680, it was easy for people in Namur to catch fish.","ko":"1680년 겨울에 Namur 사람들은 물고기를 쉽게 잡을 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"However, in 1680, a very cold winter caused the local river to freeze, so it was difficult to catch fish.","하지만 1680년에, 아주 추운 겨울이 그 지역의 강을 얼게 해서 물고기를 잡기가 어려웠다."]],"w":"6번에서 아주 추운 겨울에 강이 얼어서 물고기를 잡기가 어려웠다(difficult)고 함. easy는 반대.","c":"F"},"h":"d9fdca1d4d"},{"n":3,"t":"tf","q":"The name “French fries” comes from the place where they were invented.","ko":"‘French fries’라는 이름은 그것이 발명된 장소에서 나왔다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"The name actually comes from how they are prepared, not where they were invented.","그 이름은 사실 그것이 어디에서 발명되었는지가 아니라, 어떻게 준비되는지에서 나온다."]],"w":"10번에서 이름은 how they are prepared(어떻게 준비되는지)에서 왔고, not where they were invented(발명된 곳이 아님)라고 함.","c":"F"},"h":"137cfa8f4e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…but Belgium claims that they invented them.)","ko":"…하지만 벨기에는 자신들이 그것을 발명했다고 ___.","opts":["거절하다","주장하다","숨기다","부러워하다"],"word":"claims","r":{"a":"2) 주장하다","ev":"4번 문장","s":[[4,"You might think “French fries” come from France, but Belgium claims that they invented them.","여러분은 ‘French fries’가 프랑스에서 왔다고 생각할지도 모르지만, 벨기에는 자신들이 그것을 발명했다고 주장한다."]],"w":"앞에서 사람들은 프랑스 기원이라 생각하지만, but 뒤에서 벨기에는 자기들이 발명했다고 내세움. claim = 주장하다. 8번에서도 벨기에 이야기가 이 주장을 뒷받침한다고 함.","c":2},"h":"d2aacf7673"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The name actually comes from how they are prepared…)","ko":"그 이름은 사실 그것이 어떻게 ___는지에서 나온다.","opts":["팔리는","발견되는","조리되는","보관되는"],"word":"prepared","r":{"a":"3) 조리되는","ev":"10~11번 문장","s":[[10,"The name actually comes from how they are prepared, not where they were invented.","그 이름은 사실 그것이 어디에서 발명되었는지가 아니라, 어떻게 준비되는지에서 나온다."],[11,"“Frenching” means cutting food into thin pieces to cook well.","‘Frenching’은 잘 익히기 위해 음식을 얇은 조각으로 자르는 것을 의미한다."]],"w":"10번 how they are prepared에 이어 11번에서 얇게 썰어 잘 익힌다(cook well)고 설명함. prepared = 조리되는(만들어지는).","c":3},"h":"e16db4b117"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey decided to fry potatoes instead of fish, and that’s how French fries were first created.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 물고기 대신 감자를 튀기기로 결정했고, 그렇게 해서 감자튀김이 처음 만들어졌다.","opts":["벨기에 Namur의 사람들","프랑스 사람들","미국 사람들","얼어붙은 강의 물고기들"],"r":{"a":"1) 벨기에 Namur의 사람들","ev":"5~7번 문장","s":[[5,"In Namur, a city in Belgium, people enjoyed eating fried fish.","벨기에의 도시인 Namur에서, 사람들은 튀긴 생선을 즐겨 먹었다."],[6,"However, in 1680, a very cold winter caused the local river to freeze, so it was difficult to catch fish.","하지만 1680년에, 아주 추운 겨울이 그 지역의 강을 얼게 해서 물고기를 잡기가 어려웠다."],[7,"They decided to fry potatoes instead of fish, and that’s how French fries were first created.","그들은 물고기 대신 감자를 튀기기로 결정했고, 그렇게 해서 감자튀김이 처음 만들어졌다."]],"w":"5번에서 Namur 사람들이 튀긴 생선을 즐겼고, 6번에서 물고기를 못 잡게 되자 7번에서 그들이 감자를 튀기기로 함. They = Namur 사람들.","c":1},"h":"730905eeda"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The name actually comes from how they are prepared, not where they were invented.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 이름은 사실 그것이 어디에서 발명되었는지가 아니라, 어떻게 준비되는지에서 나온다.","opts":["이름은 감자튀김이 발명된 나라인 프랑스에서 나왔다.","이름은 감자튀김이 발명된 곳과 만드는 방법에서 모두 나왔다.","이름은 감자튀김을 가장 많이 먹는 곳에서 나왔다.","이름은 발명된 곳이 아니라 만드는 방법에서 나왔다."],"r":{"a":"4) 이름은 발명된 곳이 아니라 만드는 방법에서 나왔다.","ev":"10번 문장","s":[[10,"The name actually comes from how they are prepared, not where they were invented.","그 이름은 사실 그것이 어디에서 발명되었는지가 아니라, 어떻게 준비되는지에서 나온다."]],"w":"not where they were invented는 ‘발명된 곳이 아니다’. 따라서 만드는 방법에서만 나왔다는 4번이 정답. 2번은 발명된 곳도 포함해서 틀림.","c":4},"h":"3648eddfab"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["벨기에는 감자튀김이 프랑스에서 발명되었다고 주장한다.","1680년의 아주 추운 겨울 때문에 Namur에서 물고기를 잡기가 어려웠다.","Frenching은 음식을 두꺼운 조각으로 자르는 것을 뜻한다.","평균적인 미국인은 일 년에 감자튀김을 한 번만 먹는다."],"opts":["Belgium claims that French fries were invented in France.","A very cold winter made it difficult to catch fish in Namur in 1680.","Frenching means cutting food into thick pieces.","The average American eats French fries only once a year."],"r":{"a":"2) A very cold winter made it difficult to catch fish in Namur in 1680.","ev":"2번, 4번, 6번, 11번 문장","s":[[2,"In fact, the average American eats nearly 14 kilograms of French fries each year.","사실, 평균적인 미국인은 매년 거의 14킬로그램의 감자튀김을 먹는다."],[4,"You might think “French fries” come from France, but Belgium claims that they invented them.","여러분은 ‘French fries’가 프랑스에서 왔다고 생각할지도 모르지만, 벨기에는 자신들이 그것을 발명했다고 주장한다."],[6,"However, in 1680, a very cold winter caused the local river to freeze, so it was difficult to catch fish.","하지만 1680년에, 아주 추운 겨울이 그 지역의 강을 얼게 해서 물고기를 잡기가 어려웠다."],[11,"“Frenching” means cutting food into thin pieces to cook well.","‘Frenching’은 잘 익히기 위해 음식을 얇은 조각으로 자르는 것을 의미한다."]],"w":"6번이 그대로 일치. 4번에서 벨기에는 자기들이 발명했다고 주장하고, 11번 Frenching은 얇은(thin) 조각, 2번 미국인은 매년 약 14킬로그램을 먹음.","c":2},"h":"48f73e72a0"},{"n":9,"t":"sum","q":"In Namur, people enjoyed fried (A), but a very cold winter froze the river, so they decided to fry (B) instead.","ko":"Namur 사람들은 튀긴 (A)를 즐겨 먹었지만, 아주 추운 겨울에 강이 얼어서 대신 (B)를 튀기기로 했다.","oko":["(A) 감자 / (B) 생선","(A) 생선 / (B) 생선","(A) 감자 / (B) 감자","(A) 고기 / (B) 감자","(A) 생선 / (B) 감자"],"opts":["(A) potatoes / (B) fish","(A) fish / (B) fish","(A) potatoes / (B) potatoes","(A) meat / (B) potatoes","(A) fish / (B) potatoes"],"r":{"a":"5) (A) fish / (B) potatoes","ev":"5~7번 문장","s":[[5,"In Namur, a city in Belgium, people enjoyed eating fried fish.","벨기에의 도시인 Namur에서, 사람들은 튀긴 생선을 즐겨 먹었다."],[6,"However, in 1680, a very cold winter caused the local river to freeze, so it was difficult to catch fish.","하지만 1680년에, 아주 추운 겨울이 그 지역의 강을 얼게 해서 물고기를 잡기가 어려웠다."],[7,"They decided to fry potatoes instead of fish, and that’s how French fries were first created.","그들은 물고기 대신 감자를 튀기기로 결정했고, 그렇게 해서 감자튀김이 처음 만들어졌다."]],"w":"5번 fried fish(튀긴 생선), 7번 fry potatoes instead of fish(생선 대신 감자). 그래서 (A) fish, (B) potatoes.","c":5},"h":"07a822995f"},{"n":10,"t":"fill","q":"The name “French fries” comes from how they are [A], and “Frenching” means [B] food into thin pieces.","ko":"‘French fries’라는 이름은 그것이 어떻게 [A]되는지에서 나오고, ‘Frenching’은 음식을 얇은 조각으로 [B] 것을 뜻한다.","bank":["prepared","cutting","claimed","frozen","supports","catch"],"bko":{"prepared":"준비된, 조리된","cutting":"자르는 것","claimed":"주장했다","frozen":"얼어붙은","supports":"뒷받침한다","catch":"잡다"},"r":{"a":"[A] prepared, [B] cutting","ev":"10~11번 문장","s":[[10,"The name actually comes from how they are prepared, not where they were invented.","그 이름은 사실 그것이 어디에서 발명되었는지가 아니라, 어떻게 준비되는지에서 나온다."],[11,"“Frenching” means cutting food into thin pieces to cook well.","‘Frenching’은 잘 익히기 위해 음식을 얇은 조각으로 자르는 것을 의미한다."]],"w":"10번 how they are prepared, 11번 Frenching means cutting food into thin pieces에서 가져옴. claimed, frozen, supports, catch는 이 빈칸에 넣으면 말이 되지 않음.","c":null},"h":"cace1c4670"}]},{"u":7,"id":"rg3-07-3","no":3,"ko":"우리 부모님은 왜 내 노래가 소음이래?","items":[{"n":1,"t":"tf","q":"People often start to develop their musical taste when they are around 13 or 14 years old.","ko":"사람들은 보통 13살이나 14살 즈음에 자신만의 음악 취향을 발전시키기 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"People often start to develop their musical taste when they’re around 13 or 14 years old.","사람들은 보통 13살이나 14살 즈음에 자신만의 음악 취향을 발전시키기 시작한다."]],"w":"4번 문장 People often start to develop their musical taste when they’re around 13 or 14 years old와 일치.","c":"T"},"h":"0365ef73b0"},{"n":2,"t":"tf","q":"Teenagers have less time than older people to find new music.","ko":"십 대들은 나이 든 사람들보다 새로운 음악을 찾을 시간이 적다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"First, teenagers have more time to find new music and make special memories with the songs.","먼저, 십 대들은 새로운 음악을 찾고 노래와 함께 특별한 추억을 만들 시간이 더 많다."],[8,"But as people get older, they usually get busier, and they will just listen to the music they know and love from the past.","하지만 나이가 들수록 사람들은 보통 더 바빠지고, 과거부터 알고 사랑해 온 음악만 듣게 될 것이다."]],"w":"7번에서 십 대들은 새 음악을 찾을 시간이 더 많다(more time)고 함. 8번에서 나이 든 사람들이 더 바빠진다고 하니 시간이 적은 쪽은 나이 든 사람들임.","c":"F"},"h":"2253f5d6ce"},{"n":3,"t":"tf","q":"Some scientists think our brains change with age.","ko":"일부 과학자들은 우리의 뇌가 나이에 따라 변한다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Some scientists think our brains change with age.","일부 과학자들은 우리의 뇌가 나이에 따라 변한다고 생각한다."]],"w":"9번 문장 Some scientists think our brains change with age와 그대로 일치.","c":"T"},"h":"9341a241f0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (People often start to develop their musical taste…)","ko":"사람들은 보통 자신의 음악 취향을 ___ 시작한다.","opts":["발전시키기","잃기","바꾸기","비교하기"],"word":"develop","r":{"a":"1) 발전시키기","ev":"4번 문장","s":[[4,"People often start to develop their musical taste when they’re around 13 or 14 years old.","사람들은 보통 13살이나 14살 즈음에 자신만의 음악 취향을 발전시키기 시작한다."]],"w":"13~14세쯤 처음 자기 취향이 생기기 시작한다는 내용. develop = 발전시키다(키워 가다). 5번에서 20대에는 취향을 안다고 이어짐.","c":1},"h":"989bc4f1ab"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…newer and less familiar songs might all “sound the same.”)","ko":"…더 새롭고 덜 ___ 노래들이 모두 ‘똑같이 들릴’ 수 있다.","opts":["낯선","익숙한","시끄러운","오래된"],"word":"familiar","r":{"a":"2) 익숙한","ev":"8번, 11번 문장","s":[[8,"But as people get older, they usually get busier, and they will just listen to the music they know and love from the past.","하지만 나이가 들수록 사람들은 보통 더 바빠지고, 과거부터 알고 사랑해 온 음악만 듣게 될 것이다."],[11,"So to older people, newer and less familiar songs might all “sound the same.”","그래서 나이 든 사람들에게는 더 새롭고 덜 익숙한 노래들이 모두 ‘똑같이 들릴’ 수 있다."]],"w":"8번에서 나이 든 사람들은 알고 사랑하는 노래만 듣는다고 했으니, 그 반대인 새 노래는 less familiar(덜 익숙한)임. familiar = 익숙한.","c":2},"h":"79a64e5616"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes it harder to tell the difference between chords, rhythms, and melodies.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 화음, 리듬, 멜로디 사이의 차이를 구별하는 것을 더 어렵게 만든다.","opts":["십 대들이 새로운 음악을 찾는 것","사람들이 더 바빠지는 것","우리의 뇌가 나이에 따라 변하는 것","부모님이 소음을 싫어하는 것"],"r":{"a":"3) 우리의 뇌가 나이에 따라 변하는 것","ev":"9~10번 문장","s":[[9,"Some scientists think our brains change with age.","일부 과학자들은 우리의 뇌가 나이에 따라 변한다고 생각한다."],[10,"This makes it harder to tell the difference between chords, rhythms, and melodies.","이것은 화음, 리듬, 멜로디 사이의 차이를 구별하는 것을 더 어렵게 만든다."]],"w":"10번 바로 앞 9번에서 과학자들이 뇌가 나이에 따라 변한다고 생각함. 그 변화가 차이를 구별하기 어렵게 만든다는 흐름.","c":3},"h":"1b1bbb9d7f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So to older people, newer and less familiar songs might all “sound the same.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 나이 든 사람들에게는 더 새롭고 덜 익숙한 노래들이 모두 ‘똑같이 들릴’ 수 있다.","opts":["나이 든 사람들은 새로운 노래를 아주 좋아해서 모든 노래를 똑같이 즐긴다.","나이 든 사람들에게는 오래전부터 알던 노래들이 모두 똑같이 들린다.","나이 든 사람들이 새 노래를 만들어서 모든 노래가 똑같이 들린다.","나이 든 사람들에게는 더 새롭고 덜 익숙한 노래들이 구별 없이 들릴 수 있다."],"r":{"a":"4) 나이 든 사람들에게는 더 새롭고 덜 익숙한 노래들이 구별 없이 들릴 수 있다.","ev":"10~11번 문장","s":[[10,"This makes it harder to tell the difference between chords, rhythms, and melodies.","이것은 화음, 리듬, 멜로디 사이의 차이를 구별하는 것을 더 어렵게 만든다."],[11,"So to older people, newer and less familiar songs might all “sound the same.”","그래서 나이 든 사람들에게는 더 새롭고 덜 익숙한 노래들이 모두 ‘똑같이 들릴’ 수 있다."]],"w":"10번에서 차이를 구별하기 어렵다고 했으므로 새롭고 낯선 노래가 구별 없이 똑같게 들린다는 뜻. 오래전부터 아는 노래는 오히려 좋아하는 노래(8번)임.","c":4},"h":"9f97483579"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["대부분의 사람들은 20대 이후에도 음악 취향이 크게 바뀐다.","십 대들은 새로운 음악을 찾을 시간이 더 많다.","나이 든 사람들은 새롭고 덜 익숙한 노래를 가장 좋아한다.","음악 취향이 다른 부모님은 어딘가 문제가 있다."],"opts":["Most people greatly change their music taste after their 20s.","Teenagers have more time to find new music.","Older people like newer and less familiar songs the most.","Parents who dislike their children’s music have something wrong with them."],"r":{"a":"2) Teenagers have more time to find new music.","ev":"5번, 7번, 11~12번 문장","s":[[5,"In their 20s, they usually know what kinds of music they like, and they don’t change much after that.","20대가 되면 그들은 보통 자신이 어떤 종류의 음악을 좋아하는지 알고, 그 이후로는 많이 변하지 않는다."],[7,"First, teenagers have more time to find new music and make special memories with the songs.","먼저, 십 대들은 새로운 음악을 찾고 노래와 함께 특별한 추억을 만들 시간이 더 많다."],[11,"So to older people, newer and less familiar songs might all “sound the same.”","그래서 나이 든 사람들에게는 더 새롭고 덜 익숙한 노래들이 모두 ‘똑같이 들릴’ 수 있다."],[12,"There’s nothing wrong with your parents.","여러분의 부모님에게는 아무 문제가 없다."]],"w":"7번 teenagers have more time to find new music과 일치. 5번 20대 이후에는 많이 변하지 않고, 11번 새 노래는 똑같이 들릴 뿐이며, 12번 부모님에게는 아무 문제가 없음.","c":2},"h":"504f365322"},{"n":9,"t":"sum","q":"People start to develop their musical taste when they are (A), but as they get older, they usually listen to (B) music.","ko":"사람들은 (A) 때 음악 취향을 발전시키기 시작하지만, 나이가 들면 보통 (B) 음악을 듣는다.","oko":["(A) 어린이 / (B) 새로운","(A) 십 대 / (B) 익숙한","(A) 십 대 / (B) 새로운","(A) 어른 / (B) 익숙한","(A) 어린이 / (B) 익숙한"],"opts":["(A) children / (B) new","(A) teenagers / (B) familiar","(A) teenagers / (B) new","(A) adults / (B) familiar","(A) children / (B) familiar"],"r":{"a":"2) (A) teenagers / (B) familiar","ev":"4번, 7~8번 문장","s":[[4,"People often start to develop their musical taste when they’re around 13 or 14 years old.","사람들은 보통 13살이나 14살 즈음에 자신만의 음악 취향을 발전시키기 시작한다."],[7,"First, teenagers have more time to find new music and make special memories with the songs.","먼저, 십 대들은 새로운 음악을 찾고 노래와 함께 특별한 추억을 만들 시간이 더 많다."],[8,"But as people get older, they usually get busier, and they will just listen to the music they know and love from the past.","하지만 나이가 들수록 사람들은 보통 더 바빠지고, 과거부터 알고 사랑해 온 음악만 듣게 될 것이다."]],"w":"4번 13~14세 즈음 취향이 생기기 시작(십 대, 7번 teenagers), 8번 나이가 들면 알고 사랑하는 음악만 들음(익숙한 음악).","c":2},"h":"694b56be4a"},{"n":10,"t":"fill","q":"Some scientists think our brains [A] with age, which makes it harder to tell the [B] between chords, rhythms, and melodies.","ko":"일부 과학자들은 우리의 뇌가 나이에 따라 [A]한다고 생각하고, 그것이 화음, 리듬, 멜로디 사이의 [B]를 구별하기 어렵게 만든다.","bank":["change","difference","listen","familiar","noise","memories"],"bko":{"change":"변하다","difference":"차이","familiar":"익숙한","noise":"소음","memories":"추억","listen":"듣다"},"r":{"a":"[A] change, [B] difference","ev":"9~10번 문장","s":[[9,"Some scientists think our brains change with age.","일부 과학자들은 우리의 뇌가 나이에 따라 변한다고 생각한다."],[10,"This makes it harder to tell the difference between chords, rhythms, and melodies.","이것은 화음, 리듬, 멜로디 사이의 차이를 구별하는 것을 더 어렵게 만든다."]],"w":"9번 our brains change with age, 10번 tell the difference between chords, rhythms, and melodies에서 가져옴. listen, familiar, noise, memories는 두 빈칸 어디에도 말이 되지 않음.","c":null},"h":"a13499f1ff"}]},{"u":8,"id":"rg3-08-1","no":1,"ko":"50년 만에 달에 가는데, 옷부터 새로 바꾼다?","items":[{"n":1,"t":"tf","q":"The new spacesuits are lighter and more flexible than the old ones.","ko":"새 우주복은 이전 것들보다 더 가볍고 더 유연하다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Also, they are lighter and more flexible than the old ones.","또한, 그것들은 이전 것들보다 더 가볍고 더 유연하다."]],"w":"7번 문장 they are lighter and more flexible than the old ones와 일치. they는 새 우주복.","c":"T"},"h":"f55de330ef"},{"n":2,"t":"tf","q":"The old spacesuits could be worn by at least 90% of American men and women.","ko":"이전 우주복은 최소 90퍼센트의 미국 남성과 여성이 입을 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"The old suits were hard to move in and didn’t fit everyone.","이전의 우주복은 안에서 움직이기 힘들었고 모두에게 맞지는 않았다."],[6,"On the other hand, the new spacesuits can be worn by at least 90% of American men and women.","반면에, 새 우주복은 최소 90퍼센트의 미국 남성과 여성이 입을 수 있다."]],"w":"최소 90%가 입을 수 있는 것은 새 우주복(6번). 이전 우주복은 모두에게 맞지 않았다(5번 didn’t fit everyone).","c":"F"},"h":"778a5057be"},{"n":3,"t":"tf","q":"The helmet has a video camera and lights for better viewing.","ko":"헬멧에는 더 잘 보기 위한 비디오카메라와 조명이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"The helmet has a video camera and lights for better viewing.","헬멧에는 더 잘 보기 위한 비디오카메라와 조명이 있다."]],"w":"9번 문장 The helmet has a video camera and lights for better viewing과 그대로 일치.","c":"T"},"h":"ad8e9a6ab1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Also, they are lighter and more flexible than the old ones.)","ko":"또한, 그것들은 이전 것들보다 더 가볍고 더 ___.","opts":["무거운","유연한","값비싼","위험한"],"word":"flexible","r":{"a":"2) 유연한","ev":"7~8번 문장","s":[[7,"Also, they are lighter and more flexible than the old ones.","또한, 그것들은 이전 것들보다 더 가볍고 더 유연하다."],[8,"So, astronauts can move more easily and study the Moon better.","그래서, 우주 비행사들은 더 쉽게 움직일 수 있고 달을 더 잘 연구할 수 있다."]],"w":"더 가볍고 flexible하다는 말 뒤에 8번에서 So 더 쉽게 움직일 수 있다고 이어짐. 움직임이 쉬워지는 성질이므로 flexible = 유연한(신축성 있는).","c":2},"h":"fa208d48ea"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…to reflect heat and protect astronauts from extreme temperatures.)","ko":"…열을 ___ 우주 비행사를 극심한 온도로부터 보호하기 위해.","opts":["흡수하다","만들어내다","전달하다","반사하다"],"word":"reflect","r":{"a":"4) 반사하다","ev":"11번 문장","s":[[11,"However, the actual spacesuit will still be white, just like the old one, to reflect heat and protect astronauts from extreme temperatures.","하지만, 실제 우주복은 열을 반사하고 우주 비행사를 극심한 온도로부터 보호하기 위해 이전 것처럼 여전히 흰색일 것이다."]],"w":"흰색은 열을 튕겨 내서 우주 비행사를 극심한 온도로부터 보호함. reflect = 반사하다.","c":4},"h":"0844efef0f"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAlso, they are lighter and more flexible than the old ones.","ko":"밑줄 친 they가 가리키는 것은?","sko":"또한, 그것들은 이전 것들보다 더 가볍고 더 유연하다.","opts":["우주 비행사들","이전의 우주복들","새 우주복들","90퍼센트의 미국인들"],"r":{"a":"3) 새 우주복들","ev":"6~7번 문장","s":[[6,"On the other hand, the new spacesuits can be worn by at least 90% of American men and women.","반면에, 새 우주복은 최소 90퍼센트의 미국 남성과 여성이 입을 수 있다."],[7,"Also, they are lighter and more flexible than the old ones.","또한, 그것들은 이전 것들보다 더 가볍고 더 유연하다."]],"w":"6번에서 the new spacesuits가 최소 90%가 입을 수 있다고 했고, 7번 Also로 새 우주복의 또 다른 장점이 이어짐. they = 새 우주복. than the old ones와 비교하는 대상이기도 함.","c":3},"h":"b5115fee7d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The old suits were hard to move in and didn’t fit everyone.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이전의 우주복은 안에서 움직이기 힘들었고 모두에게 맞지는 않았다.","opts":["이전 우주복은 입고 움직이기 불편했고 모든 사람에게 맞지 않았다.","이전 우주복은 움직이기 쉬웠지만 모든 사람에게 비쌌다.","이전 우주복은 모든 사람에게 꼭 맞았지만 무거웠다.","이전 우주복은 움직이기 힘들어서 아무도 입지 못했다."],"r":{"a":"1) 이전 우주복은 입고 움직이기 불편했고 모든 사람에게 맞지 않았다.","ev":"5번 문장","s":[[5,"The old suits were hard to move in and didn’t fit everyone.","이전의 우주복은 안에서 움직이기 힘들었고 모두에게 맞지는 않았다."]],"w":"hard to move in은 ‘안에서 움직이기 힘든’, didn’t fit everyone은 ‘모두에게 맞지는 않는’. 선택지 4)는 ‘아무도 입지 못했다’인데, 본문은 ‘모두에게는 맞지 않았다’(일부는 입을 수 있었다)라서 틀림.","c":1},"h":"739ef0f7ce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["사람들이 달을 방문한 지 50년이 채 되지 않았다.","새 우주복은 40년 만의 첫 재설계이다.","실제 새 우주복은 검은색이다.","다음 임무에서 우주 비행사들은 이전 우주복을 입을 것이다."],"opts":["It has been less than 50 years since people visited the Moon.","The new spacesuits are the first redesign in 40 years.","The actual new spacesuit will be black.","Astronauts will wear the old suits on the next mission."],"r":{"a":"2) The new spacesuits are the first redesign in 40 years.","ev":"1번, 3번, 4번, 10~11번 문장","s":[[1,"It has been more than 50 years since people last visited the Moon.","사람들이 마지막으로 달을 방문한 지 50년이 넘었다."],[3,"This time, they will wear new spacesuits!","이번에는, 그들이 새로운 우주복을 입을 것이다!"],[4,"These new suits are the first redesign in 40 years.","이 새 우주복은 40년 만의 첫 재설계이다."],[10,"The new design appears black to keep some of its secrets.","새 디자인은 비밀 일부를 지키기 위해 검은색으로 보인다."],[11,"However, the actual spacesuit will still be white, just like the old one, to reflect heat and protect astronauts from extreme temperatures.","하지만, 실제 우주복은 열을 반사하고 우주 비행사를 극심한 온도로부터 보호하기 위해 이전 것처럼 여전히 흰색일 것이다."]],"w":"4번이 그대로 일치. 1번은 50년이 넘었고, 10번은 검은색으로 ‘보이는’ 것이며 11번에서 실제는 흰색이고, 3번에서 새 우주복을 입는다고 함.","c":2},"h":"91aca6967b"},{"n":9,"t":"sum","q":"The old suits were (A) to move in, but the new suits are lighter and more (B), so astronauts can move more easily.","ko":"이전 우주복은 입고 움직이기 (A), 새 우주복은 더 가볍고 더 (B), 그래서 우주 비행사들이 더 쉽게 움직일 수 있다.","oko":["(A) 쉬웠고 / (B) 유연하다","(A) 힘들었고 / (B) 무겁다","(A) 힘들었고 / (B) 유연하다","(A) 쉬웠고 / (B) 무겁다","(A) 편안했고 / (B) 비싸다"],"opts":["(A) easy / (B) flexible","(A) hard / (B) heavy","(A) hard / (B) flexible","(A) easy / (B) heavy","(A) comfortable / (B) expensive"],"r":{"a":"3) (A) hard / (B) flexible","ev":"5번, 7~8번 문장","s":[[5,"The old suits were hard to move in and didn’t fit everyone.","이전의 우주복은 안에서 움직이기 힘들었고 모두에게 맞지는 않았다."],[7,"Also, they are lighter and more flexible than the old ones.","또한, 그것들은 이전 것들보다 더 가볍고 더 유연하다."],[8,"So, astronauts can move more easily and study the Moon better.","그래서, 우주 비행사들은 더 쉽게 움직일 수 있고 달을 더 잘 연구할 수 있다."]],"w":"5번 hard to move in(움직이기 힘듦), 7번 lighter and more flexible(더 가볍고 유연), 8번 그래서 더 쉽게 움직임. (A) hard, (B) flexible.","c":3},"h":"9f1516d743"},{"n":10,"t":"fill","q":"The helmet has a video camera and lights for better [A], and the actual spacesuit will still be [B] to reflect heat.","ko":"헬멧에는 더 잘 [A] 위한 비디오카메라와 조명이 있고, 실제 우주복은 열을 반사하기 위해 여전히 [B]색일 것이다.","bank":["viewing","white","flexible","secrets","heat","actual"],"bko":{"viewing":"보기, 시야","white":"흰","flexible":"유연한","secrets":"비밀","heat":"열","actual":"실제의"},"r":{"a":"[A] viewing, [B] white","ev":"9번, 11번 문장","s":[[9,"The helmet has a video camera and lights for better viewing.","헬멧에는 더 잘 보기 위한 비디오카메라와 조명이 있다."],[11,"However, the actual spacesuit will still be white, just like the old one, to reflect heat and protect astronauts from extreme temperatures.","하지만, 실제 우주복은 열을 반사하고 우주 비행사를 극심한 온도로부터 보호하기 위해 이전 것처럼 여전히 흰색일 것이다."]],"w":"9번 for better viewing, 11번 the actual spacesuit will still be white에서 가져옴. 10번의 black은 ‘검은색으로 보인다’일 뿐 실제 색은 흰색이라는 것이 11번의 내용이고, 나머지 단어는 빈칸에 말이 되지 않음.","c":null},"h":"261b4911bd"}]},{"u":8,"id":"rg3-08-2","no":2,"ko":"말 없이도 산 너머까지 전해지는 언어?","items":[{"n":1,"t":"tf","q":"A whistle’s sound can travel much farther than regular talking or shouting.","ko":"휘파람 소리는 일반적인 말하기나 외침보다 훨씬 더 멀리 이동할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"This is because a whistle’s sound can travel much farther than regular talking or shouting.","이는 휘파람 소리가 일반적인 말하기나 외침보다 훨씬 더 멀리 이동할 수 있기 때문이다."]],"w":"2번 문장에 a whistle’s sound can travel much farther than regular talking or shouting이 그대로 있음. 그래서 숲이나 산에서 휘파람을 언어로 쓴다(1번).","c":"T"},"h":"7356bf9b16"},{"n":2,"t":"tf","q":"In Silbo Gomero, four whistles replace the vowels and two whistles replace the consonants.","ko":"Silbo Gomero에서는 네 가지 휘파람이 모음을 대신하고 두 가지 휘파람이 자음을 대신한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Two whistles replace the five Spanish vowels, and there are four whistles for consonants.","두 가지 휘파람이 다섯 개의 스페인어 모음을 대신하고, 자음을 위한 휘파람은 네 가지이다."]],"w":"5번에서 두 가지 휘파람이 모음(five Spanish vowels)을, 네 가지 휘파람이 자음을 대신한다고 함. 숫자가 서로 바뀌었음.","c":"F"},"h":"b5e12067db"},{"n":3,"t":"tf","q":"The Hmong people use different tones of whistles to carry different messages.","ko":"Hmong 사람들은 서로 다른 메시지를 전달하기 위해 휘파람의 서로 다른 음을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"They use different tones of whistles to carry different messages.","그들은 서로 다른 메시지를 전달하기 위해 휘파람의 서로 다른 음을 사용한다."]],"w":"8번 문장 They use different tones of whistles to carry different messages와 일치. They는 7번의 Hmong 사람들.","c":"T"},"h":"330722de10"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…much farther than regular talking or shouting.)","ko":"…___ 말하기나 외침보다 훨씬 더 멀리.","opts":["갑작스러운","일반적인","특별한","조용한"],"word":"regular","r":{"a":"2) 일반적인","ev":"2번 문장","s":[[2,"This is because a whistle’s sound can travel much farther than regular talking or shouting.","이는 휘파람 소리가 일반적인 말하기나 외침보다 훨씬 더 멀리 이동할 수 있기 때문이다."]],"w":"휘파람 소리를 보통의 말하기·외침과 비교하는 문장. regular talking은 ‘평소에 하는 일반적인 말하기’. regular = 일반적인.","c":2},"h":"5a2bb67564"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The language replaces each vowel or consonant with a whistling sound.)","ko":"그 언어는 각각의 모음이나 자음을 휘파람 소리로 ___.","opts":["더한다","지운다","대신한다","따라 한다"],"word":"replaces","r":{"a":"3) 대신한다","ev":"4~5번 문장","s":[[4,"The language replaces each vowel or consonant with a whistling sound.","그 언어는 각각의 모음이나 자음을 휘파람 소리로 대신한다."],[5,"Two whistles replace the five Spanish vowels, and there are four whistles for consonants.","두 가지 휘파람이 다섯 개의 스페인어 모음을 대신하고, 자음을 위한 휘파람은 네 가지이다."]],"w":"4번 replace each vowel or consonant with a whistling sound 다음 5번에서 두 가지 휘파람이 다섯 개의 모음을 replace한다고 설명함. 글자 소리 대신 휘파람 소리를 쓴다는 뜻이므로 replace = 대신하다.","c":3},"h":"d0f75602a7"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey use different tones of whistles to carry different messages.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 서로 다른 메시지를 전달하기 위해 휘파람의 서로 다른 음을 사용한다.","opts":["스페인 카나리아 제도 사람들","휘파람 소리들","동남아시아의 숲들","Hmong 사람들"],"r":{"a":"4) Hmong 사람들","ev":"7~8번 문장","s":[[7,"In East and Southeast Asia, the Hmong people also communicate in whistles.","동아시아와 동남아시아에서는 Hmong 사람들도 휘파람으로 의사소통한다."],[8,"They use different tones of whistles to carry different messages.","그들은 서로 다른 메시지를 전달하기 위해 휘파람의 서로 다른 음을 사용한다."]],"w":"8번 바로 앞 7번에서 Hmong 사람들이 휘파람으로 의사소통한다고 함. They = Hmong 사람들.","c":4},"h":"6e73bcf4f8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It shows that people can understand each other without using spoken words.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 사람들이 구어를 사용하지 않고도 서로를 이해할 수 있다는 것을 보여준다.","opts":["사람들은 말을 쓰지 않고도 서로를 이해할 수 있다.","사람들은 말을 해야만 서로를 이해할 수 있다.","휘파람은 말보다 항상 더 이해하기 쉽다.","사람들은 말을 쓰면 휘파람보다 멀리 이해된다."],"r":{"a":"1) 사람들은 말을 쓰지 않고도 서로를 이해할 수 있다.","ev":"10~11번 문장","s":[[10,"Whistling is an interesting way to communicate.","휘파람을 부는 것은 의사소통하는 흥미로운 방법이다."],[11,"It shows that people can understand each other without using spoken words.","그것은 사람들이 구어를 사용하지 않고도 서로를 이해할 수 있다는 것을 보여준다."]],"w":"without using spoken words는 ‘구어를 사용하지 않고’. 10번에서 휘파람이 의사소통의 방법이라고 했으니, 말 없이도 서로를 이해할 수 있다는 뜻.","c":1},"h":"61c7d74b9a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["휘파람을 언어로 쓰는 문화권은 80개보다 적다.","Silbo Gomero는 자음을 다섯 가지 휘파람으로 나타낸다.","Hmong 사람들은 남아메리카에 산다.","Silbo Gomero는 스페인의 라고메라섬에서 쓰인다."],"opts":["Fewer than 80 cultures use whistles as a language.","Silbo Gomero uses five whistles for consonants.","The Hmong people live in South America.","Silbo Gomero is used on La Gomera, a Spanish island."],"r":{"a":"4) Silbo Gomero is used on La Gomera, a Spanish island.","ev":"1번, 3번, 5번, 7번 문장","s":[[1,"More than 80 different cultures use whistles as a language, especially those in places like forests or mountains.","80개가 넘는 다양한 문화권이 휘파람을 언어로 사용하는데, 특히 숲이나 산 같은 곳에 사는 문화권이 그렇다."],[3,"On La Gomera in Spain’s Canary Islands, some people use a whistle language named Silbo Gomero for communication.","스페인 카나리아 제도의 라고메라섬에서는 일부 사람들이 의사소통을 위해 Silbo Gomero라는 이름의 휘파람 언어를 사용한다."],[5,"Two whistles replace the five Spanish vowels, and there are four whistles for consonants.","두 가지 휘파람이 다섯 개의 스페인어 모음을 대신하고, 자음을 위한 휘파람은 네 가지이다."],[7,"In East and Southeast Asia, the Hmong people also communicate in whistles.","동아시아와 동남아시아에서는 Hmong 사람들도 휘파람으로 의사소통한다."]],"w":"3번이 일치. 1번은 80개가 넘음, 5번은 자음 휘파람이 네 가지, 7번은 Hmong이 동아시아·동남아시아에 산다고 함.","c":4},"h":"551dbbe3f3"},{"n":9,"t":"sum","q":"In Silbo Gomero, (A) whistles replace the five Spanish vowels, and there are (B) whistles for consonants.","ko":"Silbo Gomero에서는 (A) 가지 휘파람이 다섯 개의 스페인어 모음을 대신하고, 자음을 위한 휘파람은 (B) 가지이다.","oko":["(A) 네 / (B) 두","(A) 다섯 / (B) 네","(A) 두 / (B) 다섯","(A) 세 / (B) 네","(A) 두 / (B) 네"],"opts":["(A) four / (B) two","(A) five / (B) four","(A) two / (B) five","(A) three / (B) four","(A) two / (B) four"],"r":{"a":"5) (A) two / (B) four","ev":"3~5번 문장","s":[[3,"On La Gomera in Spain’s Canary Islands, some people use a whistle language named Silbo Gomero for communication.","스페인 카나리아 제도의 라고메라섬에서는 일부 사람들이 의사소통을 위해 Silbo Gomero라는 이름의 휘파람 언어를 사용한다."],[4,"The language replaces each vowel or consonant with a whistling sound.","그 언어는 각각의 모음이나 자음을 휘파람 소리로 대신한다."],[5,"Two whistles replace the five Spanish vowels, and there are four whistles for consonants.","두 가지 휘파람이 다섯 개의 스페인어 모음을 대신하고, 자음을 위한 휘파람은 네 가지이다."]],"w":"5번 문장 Two whistles replace the five Spanish vowels, and there are four whistles for consonants. 모음은 두 가지, 자음은 네 가지.","c":5},"h":"6e8559f247"},{"n":10,"t":"fill","q":"The Hmong people use different [A] of whistles to carry different messages, so the same [B] can have different meanings.","ko":"Hmong 사람들은 서로 다른 메시지를 전달하기 위해 휘파람의 서로 다른 [A]을 사용하고, 그래서 같은 [B]가 서로 다른 의미를 가질 수 있다.","bank":["tones","word","vowel","consonant","shouting","culture"],"bko":{"tones":"음, 음색","word":"단어","vowel":"모음","consonant":"자음","shouting":"외침","culture":"문화"},"r":{"a":"[A] tones, [B] word","ev":"8~9번 문장","s":[[8,"They use different tones of whistles to carry different messages.","그들은 서로 다른 메시지를 전달하기 위해 휘파람의 서로 다른 음을 사용한다."],[9,"So the same word can have different meanings.","그래서 같은 단어가 서로 다른 의미를 가질 수 있다."]],"w":"8번 different tones of whistles, 9번 the same word can have different meanings에서 가져옴. vowel, consonant는 5번 Silbo Gomero 설명에 나오는 말이고, shouting, culture는 이 빈칸에 말이 되지 않음.","c":null},"h":"c0706010c4"}]},{"u":8,"id":"rg3-08-3","no":3,"ko":"19세기 아이스크림은 왜 칠면조 모양이었을까?","items":[{"n":1,"t":"tf","q":"In the late 19th century, people made ice cream in fun shapes like turkeys and flowers.","ko":"19세기 후반에 사람들은 칠면조나 꽃 같은 재미있는 모양으로 아이스크림을 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In the late 19th century, people made ice cream in fun shapes like turkeys, flowers, and even famous people’s heads!","19세기 후반에, 사람들은 칠면조, 꽃, 심지어 유명한 사람들의 머리와 같은 재미있는 모양으로 아이스크림을 만들었다!"]],"w":"1번 문장 In the late 19th century, people made ice cream in fun shapes like turkeys, flowers…와 일치.","c":"T"},"h":"4919b7f471"},{"n":2,"t":"tf","q":"In the late 19th century, molded ice creams were enjoyed by everybody.","ko":"19세기 후반에 틀로 찍어 낸 아이스크림은 모든 사람이 즐겼다.","r":{"a":"F (본문과 다른 내용)","ev":"3번, 6번 문장","s":[[3,"However, molded ice creams weren’t for everybody.","하지만, 틀로 찍어 낸 아이스크림은 모든 사람을 위한 것은 아니었다."],[6,"So, these desserts were mainly enjoyed by wealthy people at expensive restaurants and dinner parties.","그래서, 이 디저트는 주로 비싼 식당과 저녁 파티에서 부유한 사람들이 즐겼다."]],"w":"3번에서 틀 아이스크림은 모든 사람을 위한 것이 아니었다고 하고, 6번에서 주로 부유한 사람들이 즐겼다고 함.","c":"F"},"h":"6bf34b9331"},{"n":3,"t":"tf","q":"Ice cream cones and bars were easier to eat and clean up.","ko":"아이스크림콘과 바는 먹고 치우기가 더 쉬웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Everyone loved them because they were easier to eat and clean up.","모든 사람이 그것들을 아주 좋아했는데, 먹고 치우기가 더 쉬웠기 때문이다."]],"w":"8번에서 모두가 콘과 바를 좋아한 이유가 easier to eat and clean up(먹고 치우기가 더
