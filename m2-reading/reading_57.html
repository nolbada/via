<style>

.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "I goes camping with Dad for the first time.", "ko": "나는 처음으로 아빠와 캠핑을 갔다.", "ok": false, "foot": [], "fixes": [{"wrong": "goes", "right": "went", "partial": false, "at": [1], "point": "시제: 과거에 있었던 일이므로 과거시제 went 사용", "topic": "시제", "memo": "과거에 있었던 일이므로 과거시제 went 사용"}]}, {"n": 2, "tag": null, "en": "“We’re going to spend the day under nature’s roof. So, we should to understand nature with a special key,” Dad said.", "ko": "“우리는 자연의 지붕 아래에서 하루를 보낼 거야. 그래서 우리는 특별한 열쇠로 자연을 이해해야 해.” 아빠가 말씀하셨다.", "ok": false, "foot": [], "fixes": [{"wrong": "to understand", "right": "understand", "partial": false, "at": [12], "point": "조동사 should 뒤에는 동사원형 사용 (to부정사 불가)", "topic": "어법", "memo": "조동사 should 뒤에는 동사원형 사용 (to부정사 불가)"}]}, {"n": 3, "tag": null, "en": "“What’s a key?” I asked.", "ko": "“그 열쇠가 뭐예요?” 내가 물었다.", "ok": false, "foot": [], "fixes": [{"wrong": "a", "right": "the", "partial": false, "at": [1], "point": "관사: 앞에서 언급된 특정 대상을 가리킬 때 정관사 the 사용", "topic": "관사", "memo": "앞에서 언급된 특정 대상을 가리킬 때 정관사 the 사용"}]}, {"n": 4, "tag": null, "en": "“Science, Minho,” Dad answered with a big smiling.", "ko": "“과학이란다, 민호야.” 아빠가 환하게 웃으며 대답하셨다.", "ok": false, "foot": [], "fixes": [{"wrong": "smiling", "right": "smile", "partial": false, "at": [7], "point": "어휘/품사: 전치사 with 뒤에는 명사 smile 사용", "topic": "어휘/품사", "memo": "전치사 with 뒤에는 명사 smile 사용"}]}, {"n": 5, "tag": null, "en": "We pull the tent out of its bag, and Dad looks around.", "ko": "우리는 가방에서 텐트를 꺼냈고, 아빠는 주위를 둘러보셨다.", "ok": false, "foot": [], "fixes": [{"wrong": "pull", "right": "pulled", "partial": false, "at": [1], "point": "시제: 과거에 일어난 일이므로 과거시제 pulled 사용", "topic": "시제", "memo": "과거에 일어난 일이므로 과거시제 pulled 사용"}, {"wrong": "looks", "right": "looked", "partial": false, "at": [10], "point": "시제: and로 연결된 두 절의 시제를 과거로 통일 (looked)", "topic": "시제", "memo": "and로 연결된 두 절의 시제를 과거로 통일 (looked)"}]}, {"n": 6, "tag": null, "en": "“What are you doing, Dad?”", "ko": "“아빠, 뭐 하세요?”", "ok": true, "foot": [], "fixes": []}, {"n": 7, "tag": null, "en": "“I’m look for a place for the tent.”", "ko": "“텐트를 칠 장소를 찾고 있단다.”", "ok": false, "foot": [], "fixes": [{"wrong": "look", "right": "looking", "partial": false, "at": [1], "point": "현재진행형: be동사(am) + v-ing 사용", "topic": "현재진행형", "memo": "be동사(am) + v-ing 사용"}]}, {"n": 8, "tag": null, "en": "“It’s going to be very hotly in the afternoon,” I said.", "ko": "“오후에는 매우 더울 거예요.”라고 내가 말했다.", "ok": false, "foot": [], "fixes": [{"wrong": "hotly", "right": "hot", "partial": false, "at": [5], "point": "be동사의 보어 자리에는 형용사 사용 (부사 hotly는 불가)", "topic": "어법", "memo": "be동사의 보어 자리에는 형용사 사용 (부사 hotly는 불가)"}]}, {"n": 9, "tag": null, "en": "“Right. We will be back from the lake about 4 hour later. Let’s to think about the movement of the sun to set up the tent.”", "ko": "“맞아. 우리는 약 4시간 후에 호수에서 돌아올 거란다. 텐트를 세우기 위해서 태양의 움직임에 대해 생각해 보자.”", "ok": false, "foot": ["1movement 움직임"], "fixes": [{"wrong": "4 hour", "right": "4 hours", "partial": false, "at": [9], "point": "수량 표현: 숫자(4) 뒤에는 복수형 명사 hours 사용", "topic": "수량 표현", "memo": "숫자(4) 뒤에는 복수형 명사 hours 사용"}, {"wrong": "to think", "right": "think", "partial": false, "at": [13], "point": "Let's 뒤에는 동사원형 사용 (to부정사 불가)", "topic": "어법", "memo": "Let's 뒤에는 동사원형 사용 (to부정사 불가)"}]}, {"n": 10, "tag": null, "en": "Q1. Which is the more better place to set up the tent?", "ko": "Q1. 텐트를 세우기에 더 좋은 장소는 어디인가요?", "ok": false, "foot": [], "fixes": [{"wrong": "more better", "right": "better", "partial": false, "at": [4], "point": "비교급: better는 이미 비교급이므로 more와 중복 사용 불가", "topic": "비교급", "memo": "better는 이미 비교급이므로 more와 중복 사용 불가"}]}, {"n": 11, "tag": null, "en": "I said, “The sun moves from east to west, so the shadow move from west to east. If we put the tent here, the tent will being in the tree’s shadow then.”", "ko": "나는 말했다. “태양은 동쪽에서 서쪽으로 움직여요, 그래서 그림자는 서쪽에서 동쪽으로 움직이죠. 만약 우리가 텐트를 여기에 치면, 텐트는 그때 나무 그림자 속에 있을 거예요.”", "ok": false, "foot": ["1shadow 그림자"], "fixes": [{"wrong": "move", "right": "moves", "partial": false, "at": [12], "point": "수일치: 주어 the shadow(단수)에 맞춰 동사 moves 사용", "topic": "수일치", "memo": "주어 the shadow(단수)에 맞춰 동사 moves 사용"}, {"wrong": "being", "right": "be", "partial": false, "at": [26], "point": "조동사 will 뒤에는 동사원형 사용 (be)", "topic": "어법", "memo": "조동사 will 뒤에는 동사원형 사용 (be)"}]}, {"n": 12, "tag": null, "en": "Dad said, “Correct! You open the window into nature with the first key.”", "ko": "아빠가 말씀하셨다. “정확해! 너는 첫 번째 열쇠로 자연으로 들어가는 창문을 열었구나.”", "ok": false, "foot": [], "fixes": [{"wrong": "open", "right": "opened", "partial": false, "at": [4], "point": "시제: 과거에 일어난 일이므로 과거시제 opened 사용", "topic": "시제", "memo": "과거에 일어난 일이므로 과거시제 opened 사용"}]}, {"n": 13, "tag": null, "en": "After we set up the tent, we went to the lake. I saw Dad skips stones across the water. He was very well at it.", "ko": "우리는 텐트를 세운 후에, 호수로 갔다. 나는 아빠가 물을 가로질러서 물수제비 뜨는 것을 보았다. 아빠는 그것을 정말 잘하셨다.", "ok": false, "foot": ["1skip (돌로) 물수제비를 뜨다"], "fixes": [{"wrong": "skips", "right": "skipping", "partial": false, "at": [14], "point": "지각동사: saw + 목적어 + 현재분사(v-ing) 형태 사용 (skipping)", "topic": "지각동사", "memo": "saw + 목적어 + 현재분사(v-ing) 형태 사용 (skipping)"}, {"wrong": "well", "right": "good", "partial": false, "at": [22], "point": "be동사의 보어 자리에는 형용사 good 사용 (well은 부사)", "topic": "어법", "memo": "be동사의 보어 자리에는 형용사 good 사용 (well은 부사)"}]}, {"n": 14, "tag": null, "en": "“How does you do that, Dad?”", "ko": "“그거 어떻게 하셨어요, 아빠?”", "ok": false, "foot": [], "fixes": [{"wrong": "does", "right": "did", "partial": false, "at": [1], "point": "시제: 과거 상황을 묻는 질문이므로 조동사 did 사용", "topic": "시제", "memo": "과거 상황을 묻는 질문이므로 조동사 did 사용"}]}, {"n": 15, "tag": null, "en": "“Most stones sinks in water. But if you throw a stone with the right speed and at the right angle, it can skip and go far. The shape of the stone is important, too. Can you choose a better stone and finding a better angle?”", "ko": "“대부분의 돌은 물에 가라앉지. 하지만 네가 돌을 적절한 속도와 각도로 던지면, 돌은 튕기면서 멀리 갈 수 있어. 돌의 모양도 중요하단다. 더 좋은 돌을 고르고 더 나은 각도를 찾을 수 있겠니?”", "ok": false, "foot": ["1angle 각도"], "fixes": ite, we got ready for a barbecue. I was very exciting.", "ko": "캠핑장으로 돌아와서, 우리는 바비큐 준비를 했다. 나는 정말 신이 났다.", "ok": false, "foot": ["1campsite 야영지, 캠핑장"], "fixes": [{"wrong": "exciting", "right": "excited", "partial": false, "at": [13], "point": "감정형용사: 감정을 느끼는 주어(사람)에는 -ed형 excited 사용", "topic": "감정형용사", "memo": "감정을 느끼는 주어(사람)에는 -ed형 excited 사용"}]}, {"n": 21, "tag": null, "en": "“Look, Minho. If you make enough spaces for air, you will get a good fire. What is the goodest way to pile up the wood?”", "ko": "“봐, 민호야. 공기가 들어갈 충분한 공간을 만들면, 너는 불을 잘 붙일 수 있을 거야. 나무를 쌓는 가장 좋은 방법은 뭘까?”", "ok": false, "foot": ["1pile up 쌓아 올리다"], "fixes": [{"wrong": "spaces", "right": "space", "partial": false, "at": [6], "point": "명사의 수: 이 문맥의 space(공간)는 셀 수 없는 명사로 단수형 사용", "topic": "명사의 수", "memo": "이 문맥의 space(공간)는 셀 수 없는 명사로 단수형 사용"}, {"wrong": "goodest", "right": "best", "partial": false, "at": [18], "point": "최상급 불규칙 변화: good의 최상급은 best (goodest 아님)", "topic": "최상급 불규칙 변화", "memo": "good의 최상급은 best (goodest 아님)"}]}, {"n": 22, "tag": null, "en": "I tried many patterns and finally making the best pattern.", "ko": "나는 여러 가지 모양을 시도해 보고 마침내 가장 좋은 모양을 만들었다.", "ok": false, "foot": [], "fixes": [{"wrong": "making", "right": "made", "partial": false, "at": [6], "point": "병렬구조: and로 연결된 두 과거동사(tried, made)의 형태 일치", "topic": "병렬구조", "memo": "and로 연결된 두 과거동사(tried, made)의 형태 일치"}]}, {"n": 23, "tag": null, "en": "“Dad, how about this?”", "ko": "“아빠, 이건 어때요?”", "ok": true, "foot": [], "fixes": []}, {"n": 24, "tag": null, "en": "Q3. What is the best way to piling up the wood?", "ko": "Q3. 나무를 쌓는 가장 좋은 방법은 무엇인가요?", "ok": false, "foot": [], "fixes": [{"wrong": "piling", "right": "pile", "partial": false, "at": [7], "point": "to부정사: to 뒤에는 동사원형 사용", "topic": "to부정사", "memo": "to 뒤에는 동사원형 사용"}]}, {"n": 25, "tag": null, "en": "“Yes, the criss-cross pattern make more room for air. Well done.”", "ko": "“그래, 십자형의 모양이 공기를 위한 보다 많은 공간을 만든단다. 잘했어.”", "ok": false, "foot": ["1criss-cross 십자 모양의, 엇갈린"], "fixes": [{" ot in the afternoon,” I said.", "“오후에는 매우 더울 거예요.”라고 내가 말했다.", 0], ["“Right. We will be back from the lake about 4 hours later. Let’s think about the movement of the sun to set up the tent.”", "“맞아. 우리는 약 4시간 후에 호수에서 돌아올 거란다. 텐트를 세우기 위해서 태양의 움직임에 대해 생각해 보자.”", 0], ["Q1. Which is the better place to set up the tent?", "Q1. 텐트를 세우기에 더 좋은 장소는 어디인가요?", 0], ["I said, “The sun moves from east to west, so the shadow moves from west to east. If we put the tent here, the tent will be in the tree’s shadow then.”", "나는 말했다. “태양은 동쪽에서 서쪽으로 움직여요, 그래서 그림자는 서쪽에서 동쪽으로 움직이죠. 만약 우리가 텐트를 여기에 치면, 텐트는 그때 나무 그림자 속에 있을 거예요.”", 0], ["Dad said, “Correct! You opened the window into nature with the first key.”", "아빠가 말씀하셨다. “정확해! 너는 첫 번째 열쇠로 자연으로 들어가는 창문을 열었구나.”", 0], ["After we set up the tent, we went to the lake. I saw Dad skipping stones across the water. He was very good at it.", "우리는 텐트를 세운 후에, 호수로 갔다. 나는 아빠가 물을 가로질러서 물수제비 뜨는 것을 보았다. 아빠는 그것을 정말 잘하셨다.", 0], ["“How did you do that, Dad?”", "“그거 어떻게 하셨어요, 아빠?”", 0], ["“Most stones sink in water. But if you throw a stone with the right speed and at the right angle, it can skip and go far. The shape of the stone is important, too. Can you choose a better stone and find a better angle?”", "“대부분의 돌은 물에 가라앉지. 하지만 네가 돌을 적절한 속도와 각도로 던지면, 돌은 튕기면서 멀리 갈 수 있어. 돌의 모양도 중요하단다. 더 좋은 돌을 고르고 더 나은 각도를 찾을 수 있겠니?”", 0], ["Q2. Which is the better angle to skip stones?", "Q2. 물수제비를 뜨기에 더 좋은 각도는 어느 것인가요?", 0], ["I said, “I will choose this flat stone and throw it at about an angle of 20 degrees.”", "나는 “이 납작한 돌을 골라서 약 20도 각도로 던져 볼게요.”라고 말했다.", 0], ["“Great choice!” Dad answered.", "“좋은 선택이야!” 아빠가 대답하셨다.", 0], ["We enjoyed skipping stones and swimming all afternoon.", "우리는 오후 내내 물수제비 뜨기와 수영을 즐겼다.", 0], ["Back at the campsite, we got ready for a barbecue. I was very excited.", "캠핑장으로 돌아와서, 우리는 바비큐 준비를 했다. 나는 정말 신이 났다.", 0], ["“Look, Minho. If you make enough space for air, you will get a good fire. What is the best way to pile up the wood?”", "“봐, 민호야. 공기가 들어갈 충분한 공간을 만들면, 너는 불을 잘 붙일 수 있을 거야. 나무를 쌓는 가장 좋은 방법은 뭘까?”", 0], ["I tried many patterns and finally made the best pattern.", "나는 여러 가지 모양을 시도해 보고 마침내 가장 좋은 모양을 만들었다.", 0], ["“Dad, how about this?”", "“아빠, 이건 어때요?”", 0], ["Q3. What is the best way to pile up the wood?", "Q3. 나무를 쌓는 가장 좋은 방법은 무엇인가요?", 0], ["“Yes, the criss-cross pattern makes more room for air. Well done.”", "“그래, 십자형의 모양이 공기를 위한 보다 많은 공간을 만든단다. 잘했어.”", 0], ["At night, we watched hundreds of stars shining in the sky. Nature was full of surprises and science helped me understand them.", "밤에 우리는 하늘에서 수백 개의 별들이 빛나는 것을 보았다. 자연은 놀라움으로 가득 차 있었고 과학은 내가 그것들을 이해하는 데 도움을 주었다.", 0], ["“Dad, science is everywhere.”", "“아빠, 과학은 어디에나 있어요.”", 0], ["Dad looked at me with a big smile.", "아빠는 환한 미소로 나를 바라보셨다.", 0]];var RNUM=57;var TITLE_EN="Science Is the Key";var PASS_EN=["Science Is the Key", "I went camping with Dad for the first time. “We’re going to spend the day under nature’s roof. So, we should understand nature with a special key,” Dad said. “What’s the key?” I asked. “Science, Minho,” Dad answered with a big smile. We pulled the tent out of its bag, and Dad looked around. “What are you doing, Dad?” “I’m looking for a place for the tent.” “It’s going to be very hot in the afternoon,” I said. “Right. We will be back from the lake about 4 hours later. Let’s think about the movement of the sun to set up the tent.” Q1. Which is the better place to set up the tent? I said, “The sun moves from east to west, so the shadow moves from west to east. If we put the tent here, the tent will be in the tree’s shadow then.” Dad said, “Correct! You opened the window into nature with the first key.” After we set up the tent, we went to the lake. I saw Dad skipping stones across the water. He was very good at it. “How did you do that, Dad?” “Most stones sink in water. But if you throw a stone with the right speed and at the right angle, it can skip and go far. The shape of the stone is important, too. Can you choose a better stone and find a better angle?” Q2. Which is the better angle to skip stones? I said, “I will choose this flat stone and throw it at about an angle of 20 degrees.” “Great choice!” Dad answered. We enjoyed skipping stones and swimming all afternoon. Back at the campsite, we got ready for a barbecue. I was very excited. “Look, Minho. If you make enough space for air, you will get a good fire. What is the best way to pile up the wood?” I tried many patterns and finally made the best pattern. “Dad, how about this?” Q3. What is the best way to pile up the wood? “Yes, the criss-cross pattern makes more room for air. Well done.” At night, we watched hundreds of stars shining in the sky. Nature was full of surprises and science helped me understand them. “Dad, science is everywhere.” Dad looked at me with a big smile."];var PASS_KO=["과학은 열쇠이다", "나는 처음으로 아빠와 캠핑을 갔다. “우리는 자연의 지붕 아래에서 하루를 보낼 거야. 그래서 우리는 특별한 열쇠로 자연을 이해해야 해.” 아빠가 말씀하셨다. “그 열쇠가 뭐예요?” 내가 물었다. “과학이란다, 민호야.” 아빠가 환하게 웃으며 대답하셨다. 우리는 가방에서 텐트를 꺼냈고, 아빠는 주위를 둘러보셨다. “아빠, 뭐 하세요?” “텐트를 칠 장소를 찾고 있단다.” “오후에는 매우 더울 거예요.”라고 내가 말했다. “맞아. 우리는 약 4시간 후에 호수에서 돌아올 거란다. 텐트를 세우기 위해서 태양의 움직임에 대해 생각해 보자.” Q1. 텐트를 세우기에 더 좋은 장소는 어디인가요? 나는 말했다. “태양은 동쪽에서 서쪽으로 움직여요, 그래서 그림자는 서쪽에서 동쪽으로 움직이죠. 만약 우리가 텐트를 여기에 치면, 텐트는 그때 나무 그림자 속에 있을 거예요.” 아빠가 말씀하셨다. “정확해! 너는 첫 번째 열쇠로 자연으로 들어가는 창문을 열었구나.” 우리는 텐트를 세운 후에, 호수로 갔다. 나는 아빠가 물을 가로질러서 물수제비 뜨는 것을 보았다. 아빠는 그것을 정말 잘하셨다. “그거 어떻게 하셨어요, 아빠?” “대부분의 돌은 물에 가라앉지. 하지만 네가 돌을 적절한 속도와 각도로 던지면, 돌은 튕기면서 멀리 갈 수 있어. 돌의 모양도 중요하단다. 더 좋은 돌을 고르고 더 나은 각도를 찾을 수 있겠니?” Q2. 물수제비를 뜨기에 더 좋은 각도는 어느 것인가요? 나는 “이 납작한 돌을 골라서 약 20도 각도로 던져 볼게요.”라고 말했다. “좋은 선택이야!” 아빠가 대답하셨다. 우리는 오후 내내 물수제비 뜨기와 수영을 즐겼다. 캠핑장으로 돌아와서, 우리는 바비큐 준비를 했다. 나는 정말 신이 났다. “봐, 민호야. 공기가 들어갈 충분한 공간을 만들면, 너는 불을 잘 붙일 수 있을 거야. 나무를 쌓는 가장 좋은 방법은 뭘까?” 나는 여러 가지 모양을 시도해 보고 마침내 가장 좋은 모양을 만들었다. “아빠, 이건 어때요?” Q3. 나무를 쌓는 가장 좋은 방법은 무엇인가요? “그래, 십자형의 모양이 공기를 위한 보다 많은 공간을 만든단다. 잘했어.” 밤에 우리는 하늘에서 수백 개의 별들이 빛나는 것을 보았다. 자연은 놀라움으로 가득 차 있었고 과학은 내가 그것들을 이해하는 데 도움을 주었다. “아빠, 과학은 어디에나 있어요.” 아빠는 환한 미소로 나를 바라보셨다."];var DG=[{"dlg": [["M", "Here we are at the campsite, Kate.", "캠핑장에 도착했다, Kate."], ["W", "I really like it here, Dad.", "여기 정말 마음에 들어요, 아빠."], ["M", "I’m happy that you like it. Look, here are some rules we have to follow. Let’s see.", "네가 마음에 든다니 기쁘구나. 봐, 여기 우리가 지켜야 할 규칙들이 있어. 어디 보자."], ["W", "Okay. What are the rules?", "네. 규칙이 뭐예요?"], ["M", "First, we have to take our trash home. We should take care of nature.", "첫째, 우리는 쓰레기를 집으로 가져가야 해. 우리는 자연을 보살펴야 하거든."], ["W", "I see.", "알겠어요."], ["M", "And one more, we have to be quiet after 10 p.m. Some people go to sleep early.", "그리고 하나 더, 밤 10시 이후에는 조용히 해야 해. 일찍 잠자리에 드는 사람들도 있거든."], ["W", "Okay, Dad.", "알겠어요, 아빠."]], "qs": [{"n": 1, "q": "위 대화의 내용과 일치하지 않는 것은?", "o": ["Kate is satisfied with the campsite.", "Kate’s dad tells her about the rules they have to follow.", "Kate and her dad must bring their trash back home.", "People can make loud noises after 10 p.m. at the campsite.", "There are campers who go to bed early at night."], "a": 3, "ans": "People can make loud noises after 10 p.m. at the campsite.", "evs": [["M: And one more, we have to be quiet after 10 p.m. Some people go to sleep early.", "그리고 하나 더, 밤 10시 이후에는 조용히 해야 해. 일찍 잠자리에 드는 사람들도 있거든."]], "ev": ["M: And one more, we have to be quiet after 10 p.m. Some people go to sleep early.", "그리고 하나 더, 밤 10시 이후에는 조용히 해야 해. 일찍 잠자리에 드는 사람들도 있거든."], "memo": ["M: And one more, we have to be quiet after 10 p.m. Some people go to sleep early.  (그리고 하나 더, 밤 10시 이후에는 조용히 해야 해. 일찍 잠자리에 드는 사람들도 있거든.)"]}]}, {"dlg": [["M", "Kate, do you know anything about the science camp this year?", "Kate, 올해 과학 캠프에 대해 아는 거 있니?"], ["W", "Yeah. It’s from September 10th to 12th on the school field.", "응. 9월 10일부터 12일까지 학교 운동장에서 열려."], ["M", "Are there any special programs at the camp?", "캠프에 특별한 프로그램이 있니?"], ["W", "Yes. There’s a special talk about life in the sea.", "응. 바다 생물에 관한 특별 강연이 있어."], ["M", "Oh, I’m really curious about that.", "오, 그거 정말 궁금하다."], ["W", "Me, too. Are you going to go to the camp?", "나도 그래. 너 캠프에 갈 거니?"], ["M", "Yes, I am.", "응, 갈 거야."], ["W", "Great. I’ll see you there.", "좋아. 거기서 보자."]], "qs": [{"n": 2, "q": "위 대화의 내용과 일치하지 않는 것은?", "o": ["과학 캠프는 9월 10일부터 12일까지 3일 동안 진행된다.", "과학 캠프는 학교 운동장에서 열린다.", "캠프에는 바다 생물에 관한 특별 강연이 포함되어 있다.", "남자와 여자 모두 바다 생물에 관한 강연에 관심이 있다.", "남자는 이번 과학 캠프에 참가하지 않을 것이다."], "a": 4, "ans": "남자는 이번 과학 캠프에 참가하지 않을 것이다.", "evs": [["W: Me, too. Are you going to go to the camp?", "나도 그래. 너 캠프에 갈 거니?"], ["M: Yes, I am.", "응, 갈 거야."]], "ev": ["W: Me, too. Are you going to go to the camp?", "나도 그래. 너 캠프에 갈 거니?"], "memo": ["W: Me, too. Are you going to go to the camp?  (나도 그래. 너 캠프에 갈 거니?)", "M: Yes, I am.  (응, 갈 거야.)"]}]}, {"dlg": [["M", "Mom, can I go out and play soccer with my friends?", "엄마, 나가서 친구들이랑 축구해도 돼요?"], ["W", "Sure. But remember, grandma is coming over for dinner tonight.", "그럼. 하지만 기억하렴, 오늘 밤에 할머니가 저녁 드시러 오셔."], ["M", "Yes, Mom. When should I come home?", "네, 엄마. 언제 집에 와야 해요?"], ["W", "You have to come home by 6:00 p.m.", "저녁 6시까지는 집에 와야 해."], ["M", "I see. I’ll come home by then.", "알겠어요. 그때까지 집에 올게요."]], "qs": [{"n": 3, "q": "위 대화를 요약한 문장의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?", "o": ["basketball - grandma", "soccer - uncle", "soccer - grandma", "tennis - grandpa", "baseball - aunt"], "a": 2, "ans": "soccer - grandma", "evs": [["The boy wants to play soccer with his friends, but he has to come home by 6:00 p.m. because his grandma is coming over for dinner.", "소년은 친구들과 축구를 하고 싶어 하지만, 할머니가 저녁 드시러 오시기 때문에 저녁 6시까지 집에 와야 한다."]], "ev": ["The boy wants to play soccer with his friends, but he has to come home by 6:00 p.m. because his grandma is coming over for dinner.", "소년은 친구들과 축구를 하고 싶어 하지만, 할머니가 저녁 드시러 오시기 때문에 저녁 6시까지 집에 와야 한다."], "memo": ["The boy wants to play soccer with his friends, but he has to come home by 6:00 p.m. because his grandma is coming over for dinner.  (소년은 친구들과 축구를 하고 싶어 하지만, 할머니가 저녁 드시러 오시기 때문에 저녁 6시까지 집에 와야 한다.)"], "sum": "The boy wants to play (A) with his friends, but he has to come nt asks Mr. Kim about the due date for the science report. She has to turn it in by Thursday.", "학생은 김 선생님께 과학 보고서 마감일을 묻는다. 그녀는 목요일까지 보고서를 제출해야 한다."], "memo": ["The student asks Mr. Kim about the due date for the science report. She has to turn it in by Thursday.  (학생은 김 선생님께 과학 보고서 마감일을 묻는다. 그녀는 목요일까지 보고서를 제출해야 한다.)"], "sum": "The student asks Mr. Kim about the due date for the (A) report. She has to turn it in by (B).", "lab": "완성된 요약문 : ", "why": "학생이 'When is the due date for the science report?'라고 묻고, 김 선생님이 'You have to turn it in by Thursday.'라고 답함."}]}];var BG=[{"pp": [["Science Is the Key", "과학은 열쇠이다"], ["I went camping with Dad for the first time.", "나는 처음으로 아빠와 캠핑을 갔다."], ["“We’re going to spend the day under nature’s roof. So, we should understand nature with a special key,” Dad said.", "“우리는 자연의 지붕 아래에서 하루를 보낼 거야. 그래서 우리는 특별한 열쇠로 자연을 이해해야 해.” 아빠가 말씀하셨다."], ["“What’s the key?” I asked.", "“그 열쇠가 뭐예요?” 내가 물었다."], ["“Science, Minho,” Dad answered with a big smile.", "“과학이란다, 민호야.” 아빠가 환하게 웃으며 대답하셨다."], ["We pulled the tent out of its bag, and Dad looked around.", "우리는 가방에서 텐트를 꺼냈고, 아빠는 주위를 둘러보셨다."], ["“What are you doing, Dad?”", "“아빠, 뭐 하세요?”"], ["“I’m looking for a place for the tent.”", "“텐트를 칠 장소를 찾고 있단다.”"], ["“It’s going to be very hot in the afternoon,” I said.", "“오후에는 매우 더울 거예요.”라고 내가 말했다."], ["“Right. We will be back from the lake about 4 hours later. Let’s think about the movement of the sun to set up the tent.”", "“맞아. 우리는 약 4시간 후에 호수에서 돌아올 거란다. 텐트를 세우기 위해서 태양의 움직임에 대해 생각해 보자.”"], ["Q1. Which is the better place to set up the tent?", "Q1. 텐트를 세우기에 더 좋은 장소는 어디인가요?"], ["I said, “The sun moves from east to west, so the shadow moves from west to east. If we put the tent here, the tent will be in the tree’s shadow then.”", "나는 말했다. “태양은 동쪽에서 서쪽으로 움직여요, 그래서 그림자는 서쪽에서 동쪽으로 움직이죠. 만약 우리가 텐트를 여기에 치면, 텐트는 그때 나무 그림자 속에 있을 거예요.”"]], "qs": [{"n": 6, "q": "윗글의 내용과 일치하지 않는 것은?", "o": ["아빠는 텐트 칠 장소를 찾고 있었다.", "오후에는 날씨가 매우 더울 것이다.", "민호와 아빠는 약 4시간 후에 호수에서 돌아올 것 function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
