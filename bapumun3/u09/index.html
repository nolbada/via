opts": [], "pencil": "능동태 주어는 수동태에서 ___ 뒤로 간다", "pencilKey": "by", "page": 93, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "유형 01·02 능동태와 수동태 / 수동태의 여러 가지 형태", "type": "write", "ans": "food will be made by robots", "concept": ["075", "074"], "gap": "", "words": [["make", "만들다"], ["robot", "로봇"], ["future", "미래"]], "h1": "밑줄 친 부분이 수동태로 바뀌어야 해요. 능동 문장 'robots will make food'에서 목적어와 주어의 자리를 서로 바꿔 보세요.", "h2": "will이 있는 문장은 「will be + 과거분사」로 써요. food가 주어 자리로 가고 robots는 by 뒤로 가요.", "why": "음식이 만들어지는 쪽이라서 수동태예요. 미래 수동태 will be made(원형 make 만들다) 뒤에 by robots를 붙여요.", "opts": [], "pencil": "미래 수동태는 will be + ___", "pencilKey": "과거분사", "page": 93, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "유형 01·02 능동태와 수동태 / 수동태의 여러 가지 형태", "type": "write", "ans": "Their presents are being wrapped by the clerk.", "concept": ["075-4", "075", "015"], "gap": "", "words": [["wrap", "포장하다"], ["present", "선물"], ["clerk", "점원"]], "h1": "점원이 지금 선물을 포장하고 있는 문장이에요(현재진행형). 선물이 주어가 되는 문장으로 바꿔 보세요.", "h2": "진행형 수동태는 「be동사 + being + 과거분사」예요. Their presents는 여러 개이고 현재라서 be동사는 are예요.", "why": "선물은 포장되는 쪽이라서 수동태예요. 현재진행형이고 복수라서 are being wrapped(원형 wrap 포장하다) by the clerk가 돼요.", "opts": [], "pencil": "진행형 수동태는 be동사 + ___ + 과거분사", "pencilKey": "being", "page": 93, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "유형 01·02 능동태와 수동태 / 수동태의 여러 가지 형태", "type": "write", "ans": "Halloween has been celebrated by many children.", "concept": ["075-4", "075", "054"], "gap": "", "words": [["celebrate", "기념하다"], ["Halloween", "핼러윈"]], "h1": "조건이 두 개예요. 수동태로 쓰고, 현재완료 시제로 써야 해요. 핼러윈이 주어가 돼요.", "h2": "완료형 수동태는 「have[has] + been + 과거분사」예요. Halloween은 하나라서 have가 아니라 has를 써요.", "why": "핼러윈이 기념되는 쪽이라서 수동태이고, 현재완료라서 has been celebrated(원형 celebrate 기념하다) by many children이 돼요.", "opts": [], "pencil": "단수 주어의 완료형 수동태는 has + ___ + 과거분사", "pencilKey": "been", "page": 93, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "유형 01·02 능동태와 수동태 / 수동태의 여러 가지 형태", "type": "write", "ans":  03 수동태로 쓰지 않는 동사", "type": "write", "ans": "바꿀 수 있는 문장: (2), (5) / 바꿀 수 없는 문장: (1), (3), (4)", "concept": ["075-H1", "074"], "gap": "", "words": [["fit", "잘 맞다"], ["resemble", "닮다"], ["occur", "일어나다"], ["hacker", "해커"], ["password", "비밀번호"]], "h1": "수동태로 바꾸려면 목적어가 있는 동사여야 해요. 각 문장에서 동사 뒤에 목적어가 있는지 보세요.", "h2": "fit(잘 맞다)·resemble(닮다) 같은 상태를 나타내는 동사와 목적어가 없는 동사는 수동태로 쓰지 않아요. 각 문장의 동사가 어느 쪽인지 보세요.", "why": "(2)는 Starry Night(별이 빛나는 밤), (5)는 your password(너의 비밀번호)라는 목적어가 있어서 수동태로 바꿀 수 있어요. (1) fit, (3) resemble, (4) occur는 수동태로 쓰지 않아요.", "opts": [], "pencil": "상태를 나타내는 동사와 목적어 없는 동사는 수동태가 ___", "pencilKey": "안 된다", "page": 93, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "유형 01·02 능동태와 수동태 / 수동태의 여러 가지 형태", "type": "mc", "ans": "③", "concept": ["075-4", "075", "075-H1"], "gap": "", "words": [["put out", "끄다"], ["adopt", "입양하다"], ["prepare", "준비하다"], ["firefighter", "소방관"]], "h1": "어법상 옳은 문장을 하나 고르는 문제예요. 보기마다 조동사, 완료, 진행 모양에서 be가 빠졌거나 이상한 곳이 없는지 확인하세요.", "h2": "조동사 뒤에는 be, have[has] 뒤에는 been, 진행 중이면 being이 와요. ②는 put out(끄다)을 한 덩어리 동사로 봐야 하는 점도 떠올려 보세요.", "why": "③ was being eaten(원형 eat 먹다)은 생선이 먹히고 있는 중이라는 뜻의 진행형 수동태라서 맞아요. 나머지는 be, been, being이 빠지거나 틀렸어요.", "opts": [{"n": "①", "en": "Tickets can bought online.", "ko": "표는 온라인으로 살 수 있다.", "ok": false, "why": "can 뒤에 be가 빠졌어요. can be bought(원형 buy 사다)여야 해요."}, {"n": "②", "en": "The firefighters were put out the fire.", "ko": "소방관들이 불을 껐다.", "ok": false, "why": "소방관들은 불을 끄는 쪽이라서 능동 put out(원형 put out 끄다)이어야 해요."}, {"n": "③", "en": "The fish was being eaten by the cat.", "ko": "그 물고기는 고양이에게 먹히고 있었다.", "ok": true, "why": "과거진행형 수동태 was being + 과거분사라서 맞아요."}, {"n": "④", "en": "The dog has adopted by Mary.", "ko": "그 개는 메리에게 입양되었다.", "ok": false, "why": "has 뒤에 been이 빠졌어요. has been adopted(원형 adopt 입양하다)여야 해요."}, {"n": "⑤", "en": "Dinner will be preparing by the host.", "ko": "저녁은 주인이 준비할 것이다.", "ok": false, "why": "will be 뒤에는 -ing가 아니라 과거분사 prepared가 와야 해요."}], "pencil": "조동사 뒤 be, 완료 been, 진행 ___ 를 구분한다", "pencilKey": "being", "page": 94, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "유형 01·02 능동태와 수동태 / 수동태의 여러 가지 형태", "type": "mc", "ans": "④", "concept": ["075-4", "075", "053"], "gap": "", "words": [["make", "만들다(과거분사 made)"], ["goods", "상품"], ["decision", "결정"]], "h1": "make가 어떤 모양으로 쓰였는지 비교하는 문제예요. 각 문장에서 주어가 동작을 받는지 하는지 보세요.", "h2": "다섯 문장 중 네 문장은 be동사가 있는 수동태라서 과거분사 made가 와요. 주어가 직접 하는 문장은 다른 모양이 와요.", "why": "④ The car has been making은 차가 소리를 내고 있는 능동 진행이에요. 나머지는 모두 수동태라서 made(원형 make 만들다)를 써요.", "opts": [{"n": "①", "en": "A decision should be made right away.", "ko": "결정은 당장 내려져야 한다.", "ok": false, "why": "should be + 과거분사 made라서 수동태예요."}, {"n": "②", "en": "A birthday cake was being made by John.", "ko": "생일 케이크는 존이 만들고 있는 중이었다.", "ok": false, "why": "was being + made라서 수동태예요."}, {"n": "③", "en": "The goods were not made in France.", "ko": "그 상품들은 프랑스에서 만들어지지 않았다.", "ok": false, "why": "were not + made라서 수동태예요."}, {"n": "④", "en": "The car has been making a strange sound.", "ko": "그 차는 이상한 소리를 내고 있다.", "ok": true, "why": "차가 소리를 내는 쪽이라서 능동 현재완료진행형 making이에요. 다른 넷과 달라요."}, {"n": "⑤", "en": "His book will be made into a movie.", "ko": "그의 책은 영화로 만들어질 것이다.", "ok": false, "why": "will be + made라서 수동태예요."}], "pencil": "수동태의 made는 be동사 뒤의 ___ 이다", "pencilKey": "과거분사", "page": 94, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "유형 01·02 능동태와 수동태 / 수동태의 여러 가지 형태", "type": "mc", "ans": "②", "concept": ["075", "074", "053"], "gap": "", "words": [["shut", "닫다"], ["mosquito", "모기"], ["bite", "물다(과거 bit, 과거분사 bitten)"], ["dark", "어둠"]], "h1": "'어두워진 후에는 창문을 닫아라, 그렇지 않으면'이라는 말 뒤에 이어질 내용을 보세요. 모기는 물고 너는 물리는 쪽이에요.", "h2": "앞으로 일어날 일이라서 미래 수동태 「will be + 과거분사」예요. bite - bit - bitten에서 과거분사는 어느 쪽일까요?", "why": "창문을 안 닫으면 앞으로 모기에게 물릴 거라서 미래 수동태예요. will be bitten(원형 bite 물다)이 맞아요.", "opts": [{"n": "①", "en": "will be bit", "ko": "물릴 것이다", "ok": false, "why": "bite의 과거분사는 bit가 아니라 bitten이에요. bit는 과거형이라 틀려요."}, {"n": "②", "en": "will be bitten", "ko": "물릴 것이다", "ok": true, "why": "will be + 과거분사 bitten이라서 맞아요."}, {"n": "③", "en": "were bitten", "ko": "물렸다", "ok": false, "why": "과거형이라서 '~하지 않으면 물릴 것이다'는 미래 뜻과 안 맞아요."}, {"n": "④", "en": "have been bit", "ko": "물려 왔다", "ok": false, "why": "현재완료인데다 bit도 과거분사가 아니라서 틀려요."}, {"n": "⑤", "en": "will being bitten", "ko": "물리는 중일 것이다", "ok": false, "why": "will 뒤에 being을 쓸 수 없어요. will be여야 해요."}], "pencil": "bite - bit - ___ 로 변한다", "pencilKey": "bitten", "page": 94, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "유형 01·02 능동태와 수동태 / 수동태의 여러 가지 형태", "type": "mc", "ans": "⑤", "concept": ["073", "074", "075"], "gap": "", "words": [["eyeglasses", "안경"], ["frame", "테"], ["add", "덧붙이다"], ["arm", "안경다리"]], "h1": "글의 마지막 문장에서 arms(안경다리)가 어떻게 되었는지 뜻을 보세요. 안경다리가 직접 무언가를 했는지 받았는지 생각해 보세요.", "h2": "안경다리는 나중에 덧붙여진 쪽이에요. 그러면 수동태가 필요하고, 주어가 복수이고 과거라서 be동사도 맞춰야 해요.", "why": "⑤ added는 '안경다리가 덧붙여졌다'는 뜻이라서 수동태 were added(원형 add 덧붙이다)로 고쳐야 해요.", "opts": [{"n": "①", "en": "Until", "ko": "~까지", "ok": false, "why": "'~까지'라는 뜻의 전치사라서 문제가 없어요. 뒤의 the 18th century와 자연스럽게 이어져요."}, {"n": "②", "en": "had", "ko": "가지고 있었다", "ok": false, "why": "과거에 안경에 다리가 없었다는 뜻이라서 능동 had(원형 have 가지다)가 맞아요."}, {"n": "③", "en": "held", "ko": "잡았다", "ok": false, "why": "사람들이 테를 잡은 거라서 능동 held(원형 hold 잡다)가 맞아요."}, {"n": "④", "en": "with one hand", "ko": "한 손으로", "ok": false, "why": "전치사 with를 쓴 알맞은 표현이에요."}, {"n": "⑤", "en": "added", "ko": "덧붙여졌다", "ok": true, "why": "안경다리는 덧붙여진 쪽이고 복수라서 were added(원형 add 덧붙이다)여야 해요. added만 쓰면 어색해요."}], "pencil": "동작을 받는 복수 주어의 과거 수동태는 ___ + 과거분사", "pencilKey": "were", "page": 94, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "유형 01·02 능동태와 수동태 / 수동태의 여러 가지 형태", "type": "mc", "ans": "③", "concept": ["075-4", "075", "054"], "gap": "", "words": [["hit", "치다(과거 hit, 과거분사 hit)"], ["injure", "다치게 하다"], ["treat", "치료하다"], ["hospital", "병원"], ["luckily", "다행히"]], "h1": "대화의 뜻을 먼저 읽어 보세요. 짐은 차에 치였고, 다행히 크게 다치지 않았고, 지금은 치료를 받는 중이에요. 빈칸 세 개를 각각 풀어 보세요.", "h2": "첫 번째는 '차에 치였다'가 하는 쪽인지 당하는 쪽인지, 두 번째는 luckily(다행히)가 어떤 뜻을 만드는지, 세 번째는 is now 뒤에 어떤 모양이 와야 '~받는 중'이 되는지 차례로 보세요.", "why": "Jim은 차에 치인 쪽이라서 was hit. 다행히 다치지 않았으니 wasn't injured(원형 injure 다치게 하다). 지금 치료받는 중이니 being treated(원형 treat 치료하다)예요.", "opts": [{"n": "①", "en": "hit - was injured - treated", "ko": "쳤다 - 다쳤다 - 치료했다", "ok": false, "why": "짐이 차에 치인 쪽인데 hit은 능동이라서 틀려요. 또 '다치지 않았다'가 되어야 해요."}, {"n": "②", "en": "was hit - was injured - been treated", "ko": "치였다 - 다쳤다 - 치료되어 왔다", "ok": false, "why": "luckily와 어울리게 다치지 않았다가 되어야 해요. 또 is 뒤에 been treated는 안 돼요."}, {"n": "③", "en": "was hit - wasn't injured - being treated", "ko": "치였다 - 다치지 않았다 - 치료받는 중이다", "ok": true, "why": "세 빈칸 모두 뜻과 모양이 맞아요."}, {"n": "④", "en": "has hit - wasn't injured - be treated", "ko": "쳐 왔다 - 다치지 않았다 - 치료되다", "ok": false, "why": "첫 빈칸이 능동이고, is 뒤에 be가 와서 틀려요."}, {"n": "⑤", "en": "was hit - didn't be injured - be treated", "ko": "치였다 - 다치지 않았다(틀린 모양) - 치료되다", "ok": false, "why": "didn't 뒤에 be injured는 맞지 않고 is be treated도 틀려요."}], "pencil": "지금 하고 있는 중인 수동태는 be동사 + ___ + 과거분사", "pencilKey": "being", "page": 94, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "유형 01·02 능동태와 수동태 / 수동태의 여러 가지 형태", "type": "mc", "ans": "③", "concept": ["075", "074", "073"], "gap": "", "words": [["reflect", "비추다"], ["accept", "받아들이다"], ["spend", "쓰다(과거분사 spent)"], ["heat", "데우다"], ["respect", "존경하다"]], "h1": "어색한 문장을 찾는 문제예요. 수동태에서 be가 빠진 문장이 없는지 하나씩 확인하세요.", "h2": "조동사 will 뒤에는 동사원형이 와요. 수동태에서는 동사원형 자리에 어떤 단어가 꼭 필요한지 보기마다 확인해 보세요.", "why": "③은 will 뒤에 be가 빠졌어요. 돈은 쓰여지는 쪽이라서 will be spent(원형 spend 쓰다)가 되어야 해요.", "opts": [{"n": "①", "en": "His image was reflected in the mirror.", "ko": "그의 모습은 거울에 비쳤다.", "ok": false, "why": "모습은 비춰지는 쪽이라서 was reflected(원형 reflect 비추다)가 맞아요."}, {"n": "②", "en": "Their request wasn't accepted.", "ko": "그들의 요청은 받아들여지지 않았다.", "ok": false, "why": "요청은 받아들여지는 쪽이고 부정 수동태라서 맞아요."}, {"n": "③", "en": "The money will spent on the homeless.", "ko": "그 돈은 노숙자들을 위해 쓰일 것이다.", "ok": true, "why": "will 뒤에 function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
