<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩튜터 주니어 3 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"rj3-01-1","no":1,"ko":"프랑스의 급식은 어떨까?","items":[{"n":1,"t":"tf","q":"A school lunch in France begins with a vegetable dish such as salad.","ko":"프랑스의 학교 점심은 샐러드 같은 채소 요리로 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"French school lunches begin with a vegetable dish, such as salad.","프랑스 학교 점심은 샐러드와 같은 채소 요리로 시작한다."]],"w":"3번 문장에 French school lunches begin with a vegetable dish, such as salad가 있음. begin with는 ‘~로 시작하다’라서 본문과 일치.","c":"T"},"h":"3640407b89"},{"n":2,"t":"tf","q":"Fried food can be served every day in French school lunches.","ko":"프랑스 학교 점심에서 튀긴 음식은 매일 제공될 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"For example, fried food can only be served a few times each month.","예를 들어, 튀긴 음식은 단지 한 달에 몇 번만 제공될 수 있다."]],"w":"9번 문장에서 튀긴 음식은 only a few times each month(한 달에 몇 번만) 제공될 수 있다고 함. 매일 나온다는 말은 본문과 반대.","c":"F"},"h":"5b1591a270"},{"n":3,"t":"tf","q":"Vending machines have been banned in French schools to limit children’s access to unhealthy snacks.","ko":"프랑스 학교에서는 아이들이 건강에 좋지 않은 간식에 접근하는 것을 제한하기 위해 자동판매기가 금지되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"In order to limit children’s access to unhealthy snacks and soft drinks, vending machines have been banned.","어린이들이 건강에 좋지 않은 간식과 탄산음료에 접근하는 것을 제한하기 위해, 자동판매기는 금지되었다."]],"w":"12번 문장에서 아이들의 접근을 제한하려고(In order to limit children’s access) 자동판매기가 금지되었다고 함. 본문과 일치.","c":"T"},"h":"32186f07f9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In order to limit children’s access to unhealthy snacks and soft drinks, vending machines have been banned.)","ko":"(어린이들이 건강에 좋지 않은 간식과 탄산음료에 접근하는 것을) limit하기 위해, 자동판매기는 금지되었다.","opts":["늘리다","제한하다","도와주다","설명하다"],"word":"limit","r":{"a":"2) 제한하다","ev":"12번 문장","s":[[12,"In order to limit children’s access to unhealthy snacks and soft drinks, vending machines have been banned.","어린이들이 건강에 좋지 않은 간식과 탄산음료에 접근하는 것을 제한하기 위해, 자동판매기는 금지되었다."]],"w":"12번 문장에서 접근을 줄이려고 자동판매기를 금지했으니 limit는 ‘제한하다’. 늘리다는 반대 뜻.","c":2},"h":"721984af2e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Even ketchup is rarely served because of its high sugar content.)","ko":"심지어 케첩은 높은 설탕 content 때문에 좀처럼 제공되지 않는다.","opts":["가격","맛","크기","함유량"],"word":"content","r":{"a":"4) 함유량","ev":"11번 문장","s":[[11,"Even ketchup is rarely served because of its high sugar content.","심지어 케첩은 높은 설탕 함유량 때문에 좀처럼 제공되지 않는다."]],"w":"11번 문장에서 high sugar content는 설탕이 많이 ‘들어 있는 정도’, 즉 ‘함유량’. 케첩이 안 나오는 이유가 설탕이 많이 들어서라는 흐름.","c":4},"h":"4e4c46d9c1"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThis program might be strict, but it provides students with healthy meals and encourages them to develop healthy eating habits.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이 프로그램은 엄격할 수도 있지만, 그것은 학생들에게 건강한 식사를 제공하고 그들이 건강한 식습관을 기르도록 장려한다.","opts":["건강한 식사들","프로그램의 규칙들","학생들","학부모들"],"r":{"a":"3) 학생들","ev":"13번 문장","s":[[13,"This program might be strict, but it provides students with healthy meals and encourages them to develop healthy eating habits.","이 프로그램은 엄격할 수도 있지만, 그것은 학생들에게 건강한 식사를 제공하고 그들이 건강한 식습관을 기르도록 장려한다."]],"w":"encourage + 목적어 + to + 동사원형은 ‘~가 …하도록 장려하다’. 식습관을 기르는 사람은 앞에 나온 students(학생들).","c":3},"h":"a3c70f7eaa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In order to limit children’s access to unhealthy snacks and soft drinks, vending machines have been banned.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어린이들이 건강에 좋지 않은 간식과 탄산음료에 접근하는 것을 제한하기 위해, 자동판매기는 금지되었다.","opts":["자동판매기가 있어서 아이들이 간식을 더 쉽게 사게 되었다.","아이들이 직접 자동판매기를 없애 달라고 요청했다.","자동판매기에서는 건강한 간식만 팔게 되었다.","아이들이 건강에 나쁜 간식과 탄산음료를 쉽게 구하지 못하도록 자동판매기를 금지했다."],"r":{"a":"4) 아이들이 건강에 나쁜 간식과 탄산음료를 쉽게 구하지 못하도록 자동판매기를 금지했다.","ev":"12번 문장","s":[[12,"In order to limit children’s access to unhealthy snacks and soft drinks, vending machines have been banned.","어린이들이 건강에 좋지 않은 간식과 탄산음료에 접근하는 것을 제한하기 위해, 자동판매기는 금지되었다."]],"w":"In order to ~는 목적, have been banned는 ‘금지되었다’. 아이들이 나쁜 간식을 구하기 어렵게 하려고 자동판매기 자체를 금지한 것. 건강한 간식만 판다는 말은 없음.","c":4},"h":"9717c4f72e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["프랑스 학교에서는 아이들이 자동판매기에서 탄산음료를 살 수 있다.","프랑스 학교 점심은 항상 파이로 끝난다.","프랑스의 건강한 학교 점심은 네 가지 코스로 이루어져 있다.","프랑스 학교 점심은 치즈로 시작한다."],"opts":["Children in France can buy soft drinks from vending machines at school.","French school lunches always end with a pie.","Healthy school lunches in France have four courses.","French school lunches begin with cheese."],"r":{"a":"3) Healthy school lunches in France have four courses.","ev":"2번 문장","s":[[2,"In France, the government is addressing this issue by serving healthy school lunches with four courses.","프랑스에서 정부는 건강한 학교 점심을 네 가지 코스로 제공함으로써 이 문제를 다루고 있다."]],"w":"2번 문장에 healthy school lunches with four courses(네 가지 코스의 건강한 학교 점심)가 있음. 자동판매기는 금지(12번), 디저트는 보통 과일(6번), 점심은 채소 요리로 시작(3번)이라 나머지는 틀림.","c":3},"h":"a67aac1042"},{"n":9,"t":"sum","q":"To fight childhood obesity, French schools serve (A) lunches, and the program (B) healthy eating habits in students.","ko":"아동 비만에 맞서기 위해 프랑스 학교는 (A) 점심을 제공하고, 이 프로그램은 학생들에게 건강한 식습관을 (B).","oko":["(A) 달콤한 / (B) 장려한다","(A) 건강한 / (B) 무시한다","(A) 달콤한 / (B) 무시한다","(A) 튀긴 / (B) 장려한다","(A) 건강한 / (B) 장려한다"],"opts":["(A) sweet / (B) encourages","(A) healthy / (B) ignores","(A) sweet / (B) ignores","(A) fried / (B) encourages","(A) healthy / (B) encourages"],"r":{"a":"5) (A) healthy / (B) encourages","ev":"1~2번, 13번 문장","s":[[1,"Childhood obesity is becoming a serious problem around the world.","아동 비만은 전 세계에서 심각한 문제가 되고 있다."],[2,"In France, the government is addressing this issue by serving healthy school lunches with four courses.","프랑스에서 정부는 건강한 학교 점심을 네 가지 코스로 제공함으로써 이 문제를 다루고 있다."],[13,"This program might be strict, but it provides students with healthy meals and encourages them to develop healthy eating habits.","이 프로그램은 엄격할 수도 있지만, 그것은 학생들에게 건강한 식사를 제공하고 그들이 건강한 식습관을 기르도록 장려한다."]],"w":"2번에서 healthy school lunches(건강한 점심)를 제공하고, 13번에서 encourages them to develop healthy eating habits(건강한 식습관을 기르도록 장려)라고 함. 그래서 healthy와 encourages.","c":5},"h":"ebb4bd3c1d"},{"n":10,"t":"fill","q":"In French school lunches, unhealthy foods are [A] or only served sometimes, and even ketchup is rarely served because of its high sugar [B].","ko":"프랑스 학교 점심에서 건강에 좋지 않은 음식은 [A]되거나 가끔만 제공되고, 케첩조차 높은 설탕 [B] 때문에 좀처럼 제공되지 않는다.","bank":["banned","content","strict","healthy","courses","fresh"],"bko":{"banned":"금지된","content":"함유량","strict":"엄격한","healthy":"건강한","courses":"코스","fresh":"신선한"},"r":{"a":"[A] banned, [B] content","ev":"8번, 11번 문장","s":[[8,"Unhealthy foods are banned or only served occasionally.","건강에 좋지 않은 음식은 금지되거나 단지 가끔 제공된다."],[11,"Even ketchup is rarely served because of its high sugar content.","심지어 케첩은 높은 설탕 함유량 때문에 좀처럼 제공되지 않는다."]],"w":"8번 Unhealthy foods are banned or only served occasionally, 11번 because of its high sugar content에서 가져옴. strict, healthy, fresh, courses는 해당 자리에 뜻이 맞지 않음.","c":null},"h":"948b78c53d"}]},{"u":1,"id":"rj3-01-2","no":2,"ko":"응원이 필요해!","items":[{"n":1,"t":"tf","q":"Peptoc was created by two teachers in California.","ko":"Peptoc은 캘리포니아의 두 선생님이 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Peptoc is a project created by two teachers in California who were inspired by the pure joy of their students.","Peptoc은 학생들의 순수한 기쁨에 영감을 받은 캘리포니아의 두 선생님이 만든 프로젝트이다."]],"w":"2번 문장에 a project created by two teachers in California가 있음. 본문과 일치.","c":"T"},"h":"5ed24e461c"},{"n":2,"t":"tf","q":"If you want to hear kids laughing happily, you should press 3.","ko":"아이들이 행복하게 웃는 소리를 듣고 싶으면 3번을 눌러야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"And if you want to hear kids laughing happily, press 4.","그리고 아이들이 행복하게 웃고 있는 것을 듣고 싶다면, 4번을 눌러라."]],"w":"9번 문장에서 아이들이 행복하게 웃는 소리를 들으려면 4번을 누른다고 함. 3번은 응원 연설(pep talk)이라 본문과 다름.","c":"F"},"h":"c2820645c7"},{"n":3,"t":"tf","q":"People learned about Peptoc quickly through social media.","ko":"사람들은 소셜 미디어를 통해 Peptoc에 대해 빠르게 알게 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"People quickly learned about Peptoc "q":"Which is the best meaning of the sentence?\n\"They decided to use the kids’ words to cheer people up.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 사람들을 격려하기 위해 아이들의 말을 사용하기로 결정했다.","opts":["아이들이 선생님들을 격려하기 위해 말을 하기로 했다.","두 선생님이 아이들의 말을 이용해 사람들에게 힘을 주기로 했다.","선생님들이 아이들을 격려하는 연설을 하기로 했다.","사람들이 아이들의 말을 따라 하기로 했다."],"r":{"a":"2) 두 선생님이 아이들의 말을 이용해 사람들에게 힘을 주기로 했다.","ev":"3번 문장","s":[[3,"They decided to use the kids’ words to cheer people up.","그들은 사람들을 격려하기 위해 아이들의 말을 사용하기로 결정했다."]],"w":"They는 2번의 두 선생님, to cheer people up은 ‘사람들을 격려하기 위해’. 선생님이 아이들의 말을 사용해 사람들을 격려하기로 한 것.","c":2},"h":"3913127155"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["Peptoc에 전화한 사람은 번호를 골라 아이들의 메시지를 들을 수 있다.","Peptoc은 캘리포니아의 학생들이 시작했다.","메시지는 두 선생님이 직접 녹음했다.","사람들은 TV 뉴스를 통해 Peptoc을 알게 되었다."],"opts":["Callers to Peptoc can pick a number and listen to messages from children.","Peptoc was started by students in California.","The messages were recorded by the two teachers.","People learned about Peptoc through TV news."],"r":{"a":"1) Callers to Peptoc can pick a number and listen to messages from children.","ev":"2번, 4~5번, 10번 문장","s":[[2,"Peptoc is a project created by two teachers in California who were inspired by the pure joy of their students.","Peptoc은 학생들의 순수한 기쁨에 영감을 받은 캘리포니아의 두 선생님이 만든 프로젝트이다."],[4,"The kids came up with various supportive messages and recorded them.","아이들은 다양한 힘을 주는 메시지를 생각해 내고 그것들을 녹음했다."],[5,"When you call Peptoc, you can pick a number and listen to a message from the children.","Peptoc에 전화를 걸면 당신은 번호를 선택해 아이들의 메시지를 들을 수 있다."],[10,"People quickly learned about Peptoc through social media.","사람들은 소셜 미디어를 통해 Peptoc에 대해 빠르게 알게 되었다."]],"w":"5번 문장에서 전화하면 번호를 골라 아이들의 메시지를 들을 수 있다고 함. 만든 사람은 두 선생님(2번), 녹음은 아이들(4번), 알려진 방법은 소셜 미디어(10번)라 나머지는 틀림.","c":1},"h":"cde303377f"},{"n":9,"t":"sum","q":"Peptoc uses the kids’ (A) messages to (B) people who call.","ko":"Peptoc은 아이들의 (A) 메시지를 사용해 전화하는 사람들을 (B).","oko":["(A) 슬픈 / (B) 격려한다","(A) 힘을 주는 / (B) 귀찮게 한다","(A) 힘을 주는 / (B) 격려한다","(A) 지루한 / (B) 귀찮게 한다","(A) 웃기는 / (B) 가르친다"],"opts":["(A) sad / (B) cheer up","(A) supportive / (B) bother","(A) supportive / (B) cheer up","(A) boring / (B) bother","(A) funny / (B) teach"],"r":{"a":"3) (A) supportive / (B) cheer up","ev":"3~4번 문장","s":[[3,"They decided to use the kids’ words to cheer people up.","그들은 사람들을 격려하기 위해 아이들의 말을 사용하기로 결정했다."],[4,"The kids came up with various supportive messages and recorded them.","아이들은 다양한 힘을 주는 메시지를 생각해 내고 그것들을 녹음했다."]],"w":"3번에서 사람들을 격려하려고(to cheer people up) 아이들의 말을 사용하기로 했고, 4번에서 아이들이 만든 것이 supportive messages(힘을 주는 메시지)임.","c":3},"h":"4a8f42c80c"},{"n":10,"t":"fill","q":"Two days after the project started, Peptoc got [A] than 700 calls per hour, and the kids learned about the [B] of kind words.","ko":"프로젝트가 시작된 지 이틀 후, Peptoc은 시간당 700통보다 [A] 전화를 받았고, 아이들은 친절한 말의 [B]에 대해 배웠다.","bank":["more","power","early","group","voice","lonely"],"bko":{"more":"더 많은","power":"힘","early":"이른","group":"모임","voice":"목소리","lonely":"외로운"},"r":{"a":"[A] more, [B] power","ev":"11~12번 문장","s":[[11,"Two days after the project started, it was getting more than 700 calls per hour.","프로젝트가 시작된 지 이틀 후, 그것은 시간당 700통이 넘는 전화를 받았다."],[12,"Countless people have received joy from the kids’ messages, and the kids have learned about the power of kind words.","셀 수 없이 많은 사람들이 아이들의 메시지로부터 기쁨을 받았고, 아이들은 친절한 말의 힘에 대해 배우게 되었다."]],"w":"11번 more than 700 calls per hour, 12번 learned about the power of kind words에서 가져옴. 나머지는 해당 자리에서 뜻이 맞지 않음.","c":null},"h":"a372eda1b6"}]},{"u":1,"id":"rj3-01-3","no":3,"ko":"100년 동안의 비밀 이야기","items":[{"n":1,"t":"tf","q":"The time capsule will not be opened until the year 2114.","ko":"타임캡슐은 2114년이 될 때까지 열리지 않을 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Throughout the next 100 years, famous and well-respected authors will add an unread manuscript to a time capsule, which won’t be opened until 2114!","앞으로 100년 동안, 유명하고 존경받는 작가들이 읽지 않은 원고를 타임캡슐에 추가할 것인데, 그 타임캡슐은 2114년까지 열리지 않을 것이다!"]],"w":"2번 문장에 a time capsule, which won’t be opened until 2114가 있음. 본문과 일치.","c":"T"},"h":"a050f7302b"},{"n":2,"t":"tf","q":"The Future Library Trust decides the length and genre of each manuscript.","ko":"미래 도서관 단체가 각 원고의 길이와 장르를 정한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The length and genre of the work are up to them.","작품의 길이와 장르는 그들에게 달려 있다."]],"w":"5번 문장에서 작품의 길이와 장르는 작가들에게 달려 있다(up to them)고 함. 단체가 정한다는 말은 본문과 다름.","c":"F"},"h":"b1bb2e4d32"},{"n":3,"t":"tf","q":"The trees near the library will provide paper for the manuscripts.","ko":"도서관 근처의 나무들이 원고를 위한 종이를 제공할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The library has a forest nearby, and its trees will provide paper for the manuscripts when they are eventually printed out.","도서관 근처에 숲이 있는데, 그 숲의 나무들은 원고가 마침내 인쇄될 때 종이를 제공할 것이다."]],"w":"8번 문장에 its trees will provide paper for the manuscripts가 있음. 본문과 일치.","c":"T"},"h":"bf81778882"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When the writers submit the manuscripts, they only reveal the title.)","ko":"작가들이 원고를 제출할 때, 그들은 제목만 reveal한다.","opts":["숨기다","밝히다","바꾸다","잊다"],"word":"reveal","r":{"a":"2) 밝히다","ev":"4번 문장","s":[[4,"When the writers submit the manuscripts, they only reveal the title.","그 작가들이 원고를 제출할 때, 그들은 제목만 밝힌다."]],"w":"4번 문장은 작가가 원고 내용은 비밀로 하고 제목만 알린다는 흐름이라 reveal은 ‘밝히다, 드러내다’. 숨기다는 반대 뜻.","c":2},"h":"18010ac7f2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The Future Library Trust is inviting different outstanding writers to participate in the project annually.)","ko":"미래 도서관 단체는 매년 다양한 outstanding 작가들을 프로젝트에 참여하도록 초대하고 있다.","opts":["평범한","낯선","아직 유명하지 않은","뛰어난"],"word":"outstanding","r":{"a":"4) 뛰어난","ev":"3번 문장","s":[[3,"The Future Library Trust is inviting different outstanding writers to participate in the project annually.","미래 도서관 단체는 매년 다양한 우수한 작가들을 이 프로젝트에 참여하도록 초대하고 있다."]],"w":"3번 문장은 단체가 초대하는 작가들을 말하고, 2번에서 작가들이 famous and well-respected(유명하고 존경받는)라고 했으니 outstanding은 ‘뛰어난’.","c":4},"h":"73a72415c3"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThe only rule is that they cannot share their manuscripts with anyone, not even family members or editors.","ko":"밑줄 친 they가 가리키는 것은?","sko":"유일한 규칙은 그들이 원고를 누구와도, 심지어 가족 구성원이나 편집자에게조차 공유할 수 없다는 것이다.","opts":["직원들","편집자들","작가들","독자들"],"r":{"a":"3) 작가들","ev":"4번, 6번 문장","s":[[4,"When the writers submit the manuscripts, they only reveal the title.","그 작가들이 원고를 제출할 때, 그들은 제목만 밝힌다."],[6,"The only rule is that they cannot share their manuscripts with anyone, not even family members or editors.","유일한 규칙은 그들이 원고를 누구와도, 심지어 가족 구성원이나 편집자에게조차 공유할 수 없다는 것이다."]],"w":"공유하면 안 되는 원고(their manuscripts)를 가진 사람은 4번에서 원고를 제출하는 writers(작가들). 가족이나 편집자는 ‘공유하면 안 되는 대상’이에요.","c":3},"h":"de598c8dcc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The hope is that in 100 years our society will still exist and still enjoy reading.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"바라는 바는 100년 후에 우리 사회가 여전히 존재하고 책을 읽는 것을 즐기는 것이다.","opts":["100년 뒤에도 우리 사회가 계속 있고 독서를 즐기기를 바란다.","100년 뒤에는 우리 사회가 독서를 즐기지 않게 될 것이다.","100년 뒤 사회가 더 많은 책을 쓰기를 바란다.","100년 안에 도서관이 더 많이 생기기를 바란다."],"r":{"a":"1) 100년 뒤에도 우리 사회가 계속 있고 독서를 즐기기를 바란다.","ev":"9번 문장","s":[[9,"The hope is that in 100 years our society will still exist and still enjoy reading.","바라는 바는 100년 후에 우리 사회가 여전히 존재하고 책을 읽는 것을 즐기는 것이다."]],"w":"The hope is that ~은 ‘바라는 바는 ~이다’. still exist and still enjoy reading은 100년 뒤에도 사회가 존재하고 독서를 즐긴다는 뜻이라 1번이 맞음.","c":1},"h":"a43da42623"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["이 프로젝트에는 유명한 작가 한 명만 참여한다.","작가들은 원고를 제출할 때 제목만 밝힌다.","작가들은 원고를 편집자에게 보여 줘도 된다.","타임캡슐은 2024년에 열릴 것이다."],"opts":["Only one famous author will join the project.","The writers only reveal the title when they submit their manuscripts.","Writers may show their manuscripts to their editors.","The time capsule will be opened in 2024."],"r":{"a":"2) The writers only reveal the title when they submit their manuscripts.","ev":"2~4번, 6번 문장","s":[[2,"Throughout the next 100 years, famous and well-respected authors will add an unread manuscript to a time capsule, which won’t be opened until 2114!","앞으로 100년 동안, 유명하고 존경받는 작가들이 읽지 않은 원고를 타임캡슐에 추가할 것인데, 그 타임캡슐은 2114년까지 열리지 않을 것이다!"],[3,"The Future Library Trust is inviting different outstanding writers to participate in the project annually.","미래 도서관 단체는 매년 다양한 우수한 작가들을 이 프로젝트에 참여하도록 초대하고 있다."],[4,"When the writers submit the manuscripts, they only reveal the title.","그 작가들이 원고를 제출할 때, 그들은 제목만 밝힌다."],[6,"The only rule is that they cannot share their manuscripts with anyone, not even family members or editors.","유일한 규칙은 그들이 원고를 누구와도, 심지어 가족 구성원이나 편집자에게조차 공유할 수 없다는 것이다."]],"w":"4번 문장에 they only reveal the title이 있음. 작가는 여러 명(2~3번), 편집자에게도 공유 불가(6번), 타임캡슐은 2114년에 열림(2번)이라 나머지는 틀림.","c":2},"h":"8cc43f80da"},{"n":9,"t":"sum","q":"A library in Norway is putting writers’ (A) in a time capsule that will be (B) in 2114.","ko":"노르웨이의 한 도서관은 작가들의 (A)을 2114년에 (B) 타임캡슐에 넣고 있다.","oko":["(A) 편지 / (B) 열릴","(A) 원고 / (B) 인쇄될","(A) 원고 / (B) 열릴","(A) 사진 / (B) 지어질","(A) 편지 / (B) 닫힐"],"opts":["(A) letters / (B) opened","(A) manuscripts / (B) printed","(A) manuscripts / (B) opened","(A) photos / (B) built","(A) letters / (B) closed"],"r":{"a":"3) (A) manuscripts / (B) opened","ev":"1~2번 문장","s":[[1,"A library in Norway is working on a fascinating century-long project.","노르웨이의 한 도서관이 한 세기 동안 지속되는 흥미로운 프로젝트를 진행하고 있다."],[2,"Throughout the next 100 years, famous and well-respected authors will add an unread manuscript to a time capsule, which won’t be opened until 2114!","앞으로 100년 동안, 유명하고 존경받는 작가들이 읽지 않은 원고를 타임캡슐에 추가할 것인데, 그 타임캡슐은 2114년까지 열리지 않을 것이다!"]],"w":"2번 문장에서 작가들이 unread manuscript(읽지 않은 원고)를 타임캡슐에 넣고, 그 캡슐은 2114년에 열린다(be opened)고 함.","c":3},"h":"5ae8398129"},{"n":10,"t":"fill","q":"The library’s [A] will provide paper for the manuscripts, and people hope that society will still [B] reading in 100 years.","ko":"도서관의 [A]이 원고를 위한 종이를 제공할 것이고, 사람들은 100년 뒤에도 사회가 여전히 독서를 [B] 바란다.","bank":["trees","enjoy","capsule","secret","public","rule"],"bko":{"trees":"나무들","enjoy":"즐기다","capsule":"캡슐","secret":"비밀의","public":"공공의","rule":"규칙"},"r":{"a":"[A] trees, [B] enjoy","ev":"8~9번 문장","s":[[8,"The library has a forest nearby, and its trees will provide paper for the manuscripts when they are eventually printed out.","도서관 근처에 숲이 있는데, 그 숲의 나무들은 원고가 마침내 인쇄될 때 종이를 제공할 것이다."],[9,"The hope is that in 100 years our society will still exist and still enjoy reading.","바라는 바는 100년 후에 우리 사회가 여전히 존재하고 책을 읽는 것을 즐기는 것이다."]],"w":"8번 its trees will provide paper, 9번 will still enjoy reading에서 가져옴. capsule, secret, public, rule은 해당 자리에 뜻이나 문법이 맞지 않음.","c":null},"h":"ecb3f0c6d0"}]},{"u":1,"id":"rj3-01-4","no":4,"ko":"당신은 혼자가 아니에요","items":[{"n":1,"t":"tf","q":"Some national governments are working to make their citizens happier.","ko":"일부 중앙 정부는 시민들을 더 행복하게 만들기 위해 애쓰고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In fact, some national governments are working to make their citizens happier.","사실, 일부 중앙 정부는 그들의 시민들을 더 행복하게 만들기 위해 애쓰고 있다."]],"w":"2번 문장에 some national governments are working to make their citizens happier가 있음. 본문과 일치.","c":"T"},"h":"a1eec03409"},{"n":2,"t":"tf","q":"The UK has an official ministry of happiness like Bhutan and India.","ko":"영국은 부탄과 인도처럼 공식 행복 부처를 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"The United Arab Emirates, Bhutan, and India, for example, have official ministries of happiness.","예를 들어, 아랍에미리트와 부탄, 인도는 공식 행복 부처가 있다."],[4,"In the UK, on the other hand, the government is taking a slightly different approach.","반면에, 영국에서는 정부가 약간 다른 접근 방식을 취하고 있다."]],"w":"3번 문장에서 공식 행복 부처가 있는 나라는 아랍에미리트, 부탄, 인도이고, 4번 문장에서 영국은 약간 다른 접근 방식을 취한다고 함. 영국이 행복 부처를 가졌다는 말은 없음.","c":"F"},"h":"1ba029c5fa"},{"n":3,"t":"tf","q":"About 200,000 elderly people in the UK haven’t talked to any friends or relatives for more than a month.","ko":"영국의 약 200,000명의 노인들은 한 달 이상 어떤 친구나 친척과도 이야기하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"According to a study, about 200,000 elderly people in the UK haven’t spoken to any friends or relatives in more than a month.","한 연구에 따르면, 영국의 약 200,000명의 노인들이 한 달 이상 어떤 친구나 친척과도 말한 적이 없다."]],"w":"9번 문장에 about 200,000 elderly people in the UK haven’t spoken to any friends or relatives in more than a month가 있음. 본문과 일치.","c":"T"},"h":"4499dc93df"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Rather than promoting happiness, it is fighting unhappiness.)","ko":"행복을 promoting하기보다는, 그것은 불행과 맞서 싸우고 있다.","opts":["막다","고취하다","잊다","줄이다"],"word":"promoting","r":{"a":"2) 고취하다","ev":"5번 문장","s":[[5,"Rather than promoting happiness, it is fighting unhappiness.","행복을 고취하는 대신에, 그것은 불행과 맞서 싸우고 있다."]],"w":"5번은 다른 나라들이 행복을 높이는 쪽인 것과 대조해서 영국은 불행과 싸운다는 문장. 그래서 promote는 ‘고취하다, 촉진하다’.","c":2},"h":"71d7505124"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Because our high-tech society leads to less face-to-face contact, it threatens everyone.)","ko":"우리의 최첨단 사회가 더 적은 맞대면에 이르기 때문에, 그것은 모든 사람을 threatens한다.","opts":["돕다","웃게 하다","위협하다","가르치다"],"word":"threatens","r":{"a":"3) 위협하다","ev":"11번 문장","s":[[11,"Because our high-tech society leads to less face-to-face contact, it threatens everyone.","우리의 최첨단 사회가 더 적은 맞대면에 이르기 때문에, 그것은 모든 사람을 위협한다."]],"w":"11번 문장에서 대면 접촉이 줄면 외로움이 커지니 모든 사람에게 좋지 않은 영향을 준다는 흐름. threaten은 ‘위협하다’.","c":3},"h":"dcba26c1b7"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nIn 2018, the prime minister noted that loneliness affects millions of British people. So she appointed the first minister for loneliness.","ko":"밑줄 친 she가 가리키는 것은?","sko":"2018년에 수상은 외로움이 수백만 명의 영국인들에게 영향을 미치는 것에 주목했다. 그래서 그녀는 초대 외로움 담당 장관을 임명했다.","opts":["외로움 담당 장관","노인","연구자","수상"],"r":{"a":"4) 수상","ev":"6~7번 문장","s":[[6,"In 2018, the prime minister noted that loneliness affects millions of British people.","2018년에 수상은 외로움이 수백만 명의 영국인들에게 영향을 미치는 것에 주목했다."],[7,"So she appointed the first minister for loneliness.","그래서 그녀는 초대 외로움 담당 장관을 임명했다."]],"w":"장관을 임명한 사람이 she이고, 앞 문장에서 외로움에 주목한 사람은 the prime minister(수상). 외로움 담당 장관은 임명된 사람이라 she가 아님.","c":4},"h":"34f82265dc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The job of the minister for loneliness is to find ways to reach out to lonely people.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"외로움 담당 장관의 일은 외로운 사람들에게 접근하는 방법을 찾는 것이다.","opts":["장관의 일은 외로운 사람들에게 다가갈 방법을 찾는 것이다.","장관의 일은 외로운 사람들을 병원에 보내는 것이다.","장관의 일은 외로움에 대한 연구 결과를 발표하는 것이다.","장관의 일은 외로운 사람들에게서 벗어날 방법을 찾는 것이다."],"r":{"a":"1) 장관의 일은 외로운 사람들에게 다가갈 방법을 찾는 것이다.","ev":"8번 문장","s":[[8,"The job of the minister for loneliness is to find ways to reach out to lonely people.","외로움 담당 장관의 일은 외로운 사람들에게 접근하는 방법을 찾는 것이다."]],"w":"to find ways는 ‘방법을 찾는 것’, to reach out to lonely people은 ‘외로운 사람들에게 다가갈’. 병원, 연구 발표, 벗어나기는 본문에 없음.","c":1},"h":"0f036f7137"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["행복은 영국에서만 중요한 목표이다.","영국 정부는 행복을 높이는 대신 불행과 싸우고 있다.","영국에서 외로움은 노인에게만 영향을 미친다.","부탄에는 외로움 담당 장관이 있다."],"opts":["Happiness is an important goal only in the UK.","The British government is fighting unhappiness rather than promoting happiness.","Loneliness affects only elderly people in the UK.","Bhutan has a minister for loneliness."],"r":{"a":"2) The British government is fighting unhappiness rather than promoting happiness.","ev":"1번, 3번, 5번, 10번 문장","s":[[1,"Happiness is a common goal around the world.","행복은 세계적으로 공통의 목표이다."],[3,"The United Arab Emirates, Bhutan, and India, for example, have official ministries of happiness.","예를 들어, 아랍에미리트와 부탄, 인도는 공식 행복 부처가 있다."],[5,"Rather than promoting happiness, it is fighting unhappiness.","행복을 고취하는 대신에, 그것은 불행과 맞서 싸우고 있다."],[10,"Of course, loneliness doesn’t only affect older people.","물론, 외로움이 노인들에게만 영향을 미치는 것은 아니다."]],"w":"5번 문장에 Rather than promoting happiness, it is fighting unhappiness가 있음. 행복은 세계적인 목표(1번), 외로움은 노인만의 문제가 아님(10번), 부탄은 행복 부처가 있음(3번)이라 나머지는 틀림.","c":2},"h":"2c86aef5f3"},{"n":9,"t":"sum","q":"In 2018, the British prime minister noticed that (A) affects millions of people, so she (B) the first minister for loneliness.","ko":"2018년에 영국 수상은 (A)이 수백만 명에게 영향을 준다는 것을 알아차렸고, 그래서 초대 외로움 담당 장관을 (B).","oko":["(A) 행복 / (B) 임명했다","(A) 외로움 / (B) 해고했다","(A) 행복 / (B) 해고했다","(A) 기술 / (B) 임명했다","(A) 외로움 / (B) 임명했다"],"opts":["(A) happiness / (B) appointed","(A) loneliness / (B) fired","(A) happiness / (B) fired","(A) technology / (B) appointed","(A) loneliness / (B) appointed"],"r":{"a":"5) (A) loneliness / (B) appointed","ev":"6~7번 문장","s":[[6,"In 2018, the prime minister noted that loneliness affects millions of British people.","2018년에 수상은 외로움이 수백만 명의 영국인들에게 영향을 미치는 것에 주목했다."],[7,"So she appointed the first minister for loneliness.","그래서 그녀는 초대 외로움 담당 장관을 임명했다."]],"w":"6번에서 수상이 loneliness(외로움)가 수백만 영국인에게 영향을 미친다고 했고, 7번에서 so she appointed(그래서 임명했다)라고 함.","c":5},"h":"5c89ab36f1"},{"n":10,"t":"fill","q":"According to a study, about 200,000 [A] people in the UK haven’t spoken to friends or relatives for more than a month, and loneliness [B] everyone.","ko":"한 연구에 따르면, 영국의 약 200,000명의 [A] 사람들이 한 달 이상 친구나 친척과 이야기하지 않았고, 외로움은 모든 사람을 [B].","bank":["elderly","threatens","slightly","approach","ministry","contact"],"bko":{"elderly":"나이가 지긋한","threatens":"위협한다","slightly":"약간","approach":"접근 방식","ministry":"(정부의) 부처","contact":"접촉"},"r":{"a":"[A] elderly, [B] threatens","ev":"9번, 11번 문장","s":[[9,"According to a study, about 200,000 elderly people in the UK haven’t spoken to any friends or relatives in more than a month.","한 연구에 따르면, 영국의 약 200,000명의 노인들이 한 달 이상 어떤 친구나 친척과도 말한 적이 없다."],[11,"Because our high-tech society leads to less face-to-face contact, it threatens everyone.","우리의 최첨단 사회가 더 적은 맞대면에 이르기 때문에, 그것은 모든 사람을 위협한다."]],"w":"9번 about 200,000 elderly people, 11번 it threatens everyone에서 가져옴. slightly, approach, ministry, contact는 해당 자리에 문법이나 뜻이 맞지 않음.","c":null},"h":"ba70f5e8e2"}]},{"u":2,"id":"rj3-02-1","no":1,"ko":"이게 무슨 느낌이지?","items":[{"n":1,"t":"tf","q":"Stress, including extreme sadness, can activate the fight-or-flight response.","ko":"극심한 슬픔을 포함한 스트레스는 투쟁-도피 반응을 작동시킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This response is activated by stress, including extreme sadness.","이 반응은 극심한 슬픔을 포함한 스트레스에 의해 활성화된다."]],"w":"3번 문장에 This response is activated by stress, including extreme sadness가 있음. 본문과 일치.","c":"T"},"h":"8e4bcb0b98"},{"n":2,"t":"tf","q":"You can actually feel your throat opening wide.","ko":"당신은 목구멍이 크게 벌어지는 것을 실제로 느낄 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"You don’t actually feel this happen, but you can sense a change in the throat’s muscles.","당신은 실제로 이런 일이 발생한다고 느끼지 않지만, 목구멍의 근육에 변화를 느낄 수 있다."]],"w":"8번 문장에서 이런 일이 일어나는 것을 실제로는 느끼지 못하고(You don’t actually feel this happen), 근육의 변화만 느낄 수 있다고 함. 본문과 반대.","c":"F"},"h":"387b854f81"},{"n":3,"t":"tf","q":"Your brain sends a message to your throat to open wide.","ko":"당신의 뇌는 목구멍에 크게 벌리라는 메시지를 보낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Your brain sends a message to your throat, telling it to open wide.","당신의 뇌는 목구멍으로 메시지를 보내서 크게 벌리라고 말한다."]],"w":"6번 문장에 Your brain sends a message to your throat, telling it to open wide가 있음. 본문과 일치.","c":"T"},"h":"343ef0271c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Your brain thinks you might need to fight or run away soon, so it wants to deliver oxygen to your muscles.)","ko":"뇌는 곧 싸우거나 도망쳐야 할지도 모른다고 생각해서, 근육에 산소를 deliver하고 싶어 한다.","opts":["빼앗다","막다","전달하다","만들다"],"word":"deliver","r":{"a":"3) 전달하다","ev":"4번 문장","s":[[4,"Your brain thinks you might need to fight or run away soon, so it wants to deliver oxygen to your muscles.","당신의 뇌는 당신이 곧 싸우거나 도망쳐야 할지도 모른다고 생각해서, 그것은 당신의 근육에 산소를 전달하고 싶어 한다."]],"w":"4번 문장은 싸우거나 도망칠 때 근육에 산소가 필요하다는 흐름이라 deliver는 ‘전달하다’. 5번에서 그 산소를 몸 안으로 들여오는 이야기가 이어짐.","c":3},"h":"a151a95e5f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You don’t actually feel this happen, but you can sense a change in the throat’s muscles.)","ko":"당신은 이런 일이 일어나는 것을 실제로 느끼지 못하지만, 목구멍 근육의 변화를 sense할 수 있다.","opts":["지우다","느끼다","믿다","피하다"],"word":"sense","r":{"a":"2) 느끼다","ev":"8번 문장","s":[[8,"You don’t actually feel this happen, but you can sense a change in the throat’s muscles.","당신은 실제로 이런 일이 발생한다고 느끼지 않지만, 목구멍의 근육에 변화를 느낄 수 있다."]],"w":"8번 문장에서 but 앞은 ‘느끼지 못한다’, but 뒤는 ‘근육의 변화를 알아챌 수 있다’는 대조. sense는 ‘느끼다, 감지하다’.","c":2},"h":"f9aeffc387"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nTo do this, it must first bring oxygen into your body.","ko":"밑줄 친 this가 가리키는 것은?","sko":"이것을 하기 위해서 그것(뇌)은 먼저 당신의 몸으로 산소를 공급해야 한다.","opts":["스트레스를 받는 것","울음을 참는 것","목구멍을 크게 벌리는 것","산소를 근육에 전달하는 것"],"r":{"a":"4) 산소를 근육에 전달하는 것","ev":"4~5번 문장","s":[[4,"Your brain thinks you might need to fight or run away soon, so it wants to deliver oxygen to your muscles.","당신의 뇌는 당신이 곧 싸우거나 도망쳐야 할지도 모른다고 생각해서, 그것은 당신의 근육에 산소를 전달하고 싶어 한다."],[5,"To do this, it must first bring oxygen into your body.","이것을 하기 위해서 그것(뇌)은 먼저 당신의 몸으로 산소를 공급해야 한다."]],"w":"5번 바로 앞 4번에서 뇌가 근육에 산소를 전달하고 싶어 한다(deliver oxygen to your muscles)고 했고, 그것을 하려면 먼저 산소를 몸 안으로 가져와야 한다는 흐름.","c":4},"h":"9f2a6adf62"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is what causes the lump-like sensation.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것이 그 덩어리 같은 느낌을 일으키는 것이다.","opts":["목구멍 근육의 변화가 덩어리 같은 느낌의 원인이다.","목구멍에 실제로 덩어리가 생겼다는 증거이다.","덩어리 같은 느낌 때문에 목구멍 근육이 변한다.","덩어리를 없애 주는 방법이다."],"r":{"a":"1) 목구멍 근육의 변화가 덩어리 같은 느낌의 원인이다.","ev":"8~9번 문장","s":[[8,"You don’t actually feel this happen, but you can sense a change in the throat’s muscles.","당신은 실제로 이런 일이 발생한다고 느끼지 않지만, 목구멍의 근육에 변화를 느낄 수 있다."],[9,"This is what causes the lump-like sensation.","이것이 그 덩어리 같은 느낌을 일으키는 것이다."]],"w":"This는 8번의 목구멍 근육의 변화. what causes ~는 ‘~를 일으키는 것’이라 근육의 변화가 느낌의 원인. 원인과 결과가 거꾸로이면 틀림.","c":1},"h":"34d77a971d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["목구멍의 덩어리는 실제로 있는 물체이다.","투쟁-도피 반응은 행복할 때만 일어난다.","뇌는 더 많은 산소를 들이려고 목구멍을 크게 벌리게 한다.","뇌는 근육이 아니라 위에 산소를 보내고 싶어 한다."],"opts":["The lump in your throat is a real object.","The fight-or-flight response happens only when you are happy.","The brain makes your throat open wide to let in more oxygen.","The brain wants to send oxygen to your stomach, not your muscles."],"r":{"a":"3) The brain makes your throat open wide to let in more oxygen.","ev":"3~4번, 6~7번, 11번 문장","s":[[3,"This response is activated by stress, including extreme sadness.","이 반응은 극심한 슬픔을 포함한 스트레스에 의해 활성화된다."],[4,"Your brain thinks you might need to fight or run away soon, so it wants to deliver oxygen to your muscles.","당신의 뇌는 당신이 곧 싸우거나 도망쳐야 할지도 모른다고 생각해서, 그것은 당신의 근육에 산소를 전달하고 싶어 한다."],[6,"Your brain sends a message to your throat, telling it to open wide.","당신의 뇌는 목구멍으로 메시지를 보내서 크게 벌리라고 말한다."],[7,"This will allow more oxygen to enter.","이것은 더 많은 산소가 들어가도록 한다."],[11,"There isn’t anything in your throat.","당신의 목구멍에는 아무것도 없다."]],"w":"6~7번에서 뇌가 목구멍을 크게 벌리라고 해서 더 많은 산소가 들어온다고 함. 덩어리는 실제로 없고(11번), 반응은 스트레스로 작동하며(3번), 산소는 근육에 보내려 함(4번)이라 나머지는 틀림.","c":3},"h":"38b7b78771"},{"n":9,"t":"sum","q":"Before you cry, your brain wants to send (A) to your muscles, so your throat (B) wide.","ko":"울기 전에 뇌는 근육에 (A)을 보내고 싶어 해서 목구멍이 크게 (B).","oko":["(A) 산소 / (B) 닫힌다","(A) 물 / (B) 벌어진다","(A) 음식 / (B) 닫힌다","(A) 음식 / (B) 벌어진다","(A) 산소 / (B) 벌어진다"],"opts":["(A) oxygen / (B) closes","(A) water / (B) opens","(A) food / (B) closes","(A) food / (B) opens","(A) oxygen / (B) opens"],"r":{"a":"5) (A) oxygen / (B) opens","ev":"4번, 6번 문장","s":[[4,"Your brain thinks you might need to fight or run away soon, so it wants to deliver oxygen to your muscles.","당신의 뇌는 당신이 곧 싸우거나 도망쳐야 할지도 모른다고 생각해서, 그것은 당신의 근육에 산소를 전달하고 싶어 한다."],[6,"Your brain sends a message to your throat, telling it to open wide.","당신의 뇌는 목구멍으로 메시지를 보내서 크게 벌리라고 말한다."]],"w":"4번에서 뇌는 근육에 oxygen을 전달하고 싶어 하고, 6번에서 목구멍에 open wide하라고 메시지를 보냄.","c":5},"h":"e18c70e59e"},{"n":10,"t":"fill","q":"You can [A] a change in your throat’s muscles, and this is what [B] the lump-like feeling.","ko":"당신은 목구멍 근육의 변화를 [A]할 수 있고, 이것이 덩어리 같은 느낌을 [B] 것이다.","bank":["sense","causes","enter","worry","oxygen","sadness"],"bko":{"sense":"느끼다","causes":"일으키다","enter":"들어가다","worry":"걱정하다","oxygen":"산소","sadness":"슬픔"},"r":{"a":"[A] sense, [B] causes","ev":"8~9번 문장","s":[[8,"You don’t actually feel this happen, but you can sense a change in the throat’s muscles.","당신은 실제로 이런 일이 발생한다고 느끼지 않지만, 목구멍의 근육에 변화를 느낄 수 있다."],[9,"This is what causes the lump-like sensation.","이것이 그 덩어리 같은 느낌을 일으키는 것이다."]],"w":"8번 you can sense a change in the throat’s muscles, 9번 This is what causes the lump-like sensation에서 가져옴. enter, worry, oxygen, sadness는 해당 자리에 뜻과 문법이 맞지 않음.","c":null},"h":"79146063ba"}]},{"u":2,"id":"rj3-02-2","no":2,"ko":"아기들에게 더 많은 것은?","items":[{"n":1,"t":"tf","q":"When you were born, you had fewer bones than you have now.","ko":"당신은 태어났을 때 지금보다 더 적은 뼈를 가지고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"However, when you were born, you had a lot more bones!","하지만, 당신은 태어났을 때, 훨씬 더 많은 뼈를 가지고 있었다!"]],"w":"3번 문장에서 태어났을 때는 a lot more bones(훨씬 더 많은 뼈)를 가지고 있었다고 함. 본문과 반대.","c":"F"},"h":"e63aafeafa"},{"n":2,"t":"tf","q":"As a baby grows, some bones join together and become one bone.","ko":"아기가 자라면서 몇몇 뼈들은 합쳐져 하나의 뼈가 된다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"As a baby grows, some bones join together and become one bone.","아기가 자라면서, 몇몇 뼈들은 합쳐져 하나의 뼈가 된다."]],"w":"6번 문장에 As a baby grows, some bones join together and become one bone이 있음. 본문과 일치.","c":"T"},"h":"a3eb5cc372"},{"n":3,"t":"tf","q":"The joining of bones does not happen in places other than the skull.","ko":"뼈가 합쳐지는 일은 두개골 이외의 곳에서는 일어나지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"This also happens in other places, such as the spine.","이것은 또한 척추 같은 다른 장소들에서도 일어난다."]],"w":"10번 문장에서 이런 일은 척추 같은 다른 곳에서도 일어난다(also happens in other places, such as the spine)고 함. 본문과 다름.","c":"F"},"h":"d799f8e923"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Because of these changes, the number of bones continues decreasing until you have about 206.)","ko":"이러한 변화들 때문에, 뼈의 개수는 당신이 약 206개를 가질 때까지 계속 decreasing한다.","opts":["늘어나다","줄어들다","멈추다","나타나다"],"word":"decreasing","r":{"a":"2) 줄어들다","ev":"11번 문장","s":[[11,"Because of these changes, the number of bones continues decreasing until you have about 206.","이러한 변화들 때문에, 뼈의 개수는 당신이 약 206개를 가질 때까지 계속 줄어든다."]],"w":"11번 문장에서 300개 정도에서 206개가 될 때까지라고 했으니 뼈의 수가 ‘줄어든다’는 뜻. 13번에도 the number has decreased가 나옴.","c":2},"h":"ecf5b4e59e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A newborn baby has about 300 bones.)","ko":"newborn 아기는 약 300개의 뼈를 가지고 있다.","opts":["건강한","울고 있는","갓 태어난","귀여운"],"word":"newborn","r":{"a":"3) 갓 태어난","ev":"4번 문장","s":[[4,"A newborn baby has about 300 bones.","갓난아기는 약 300개의 뼈를 가지고 있다."]],"w":"3번에서 태어났을 때(when you were born) 더 많은 뼈를 가졌다고 하고, 4번에서 newborn baby가 300개라고 함. newborn은 ‘갓 태어난’.","c":3},"h":"0f0afd4a8b"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nFor example, a baby’s skull has many bones. This protects the baby’s head when it gets pressed and squeezed during childbirth.","ko":"밑줄 친 This가 가리키는 것은?","sko":"예를 들어, 아기의 두개골은 많은 뼈를 가지고 있다. 이것은 아기의 머리가 출산 동안 눌려지고 밀어 넣어질 때 그것을 보호한다.","opts":["두개골이 하나로 자라는 것","뼈가 206개인 것","아기가 태어나는 것","아기의 두개골에 뼈가 많은 것"],"r":{"a":"4) 아기의 두개골에 뼈가 많은 것","ev":"7~8번 문장","s":[[7,"For example, a baby’s skull has many bones.","예를 들어, 아기의 두개골은 많은 뼈를 가지고 있다."],[8,"This protects the baby’s head when it gets pressed and squeezed during childbirth.","이것은 아기의 머리가 출산 동안 눌려지고 밀어 넣어질 때 그것을 보호한다."]],"w":"This는 바로 앞 문장 7번의 ‘아기의 두개골에 뼈가 많은 것’. 뼈가 많은 덕분에 출산 때 눌리고 밀려도 머리를 보호할 수 있음.","c":4},"h":"5f32acb87c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Surprisingly, the more you grow, the fewer bones you have.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"놀랍게도, 당신이 더 자랄수록, 당신은 더 적은 수의 뼈를 가진다.","opts":["자랄수록 뼈의 수가 더 적어진다.","자랄수록 뼈의 수가 더 많아진다.","뼈가 적을수록 더 많이 자란다.","뼈가 많을수록 키가 덜 자란다."],"r":{"a":"1) 자랄수록 뼈의 수가 더 적어진다.","ev":"5번 문장","s":[[5,"Surprisingly, the more you grow, the fewer bones you have.","놀랍게도, 당신이 더 자랄수록, 당신은 더 적은 수의 뼈를 가진다."]],"w":"the + 비교급 ~, the + 비교급 …은 ‘~할수록 더 …하다’. 더 자랄수록(the more you grow) 더 적은 뼈(the fewer bones)를 가진다는 뜻. 2~4번의 300개 → 206개와도 맞음.","c":1},"h":"1313254cbd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["뼈의 수는 약 206개가 될 때까지 계속 늘어난다.","사람은 태어날 때 약 206개의 뼈를 가지고 있다.","어떤 뼈들이 합쳐지기 때문에 뼈의 수가 줄어든다.","뼈가 합쳐지는 일은 두개골에서만 일어난다."],"opts":["The number of bones keeps increasing until you have about 206.","People are born with about 206 bones.","The number of bones decreases because some bones join together.","The joining of bones happens only in the skull."],"r":{"a":"3) The number of bones decreases because some bones join together.","ev":"4번, 6번, 10~11번 문장","s":[[4,"A newborn baby has about 300 bones.","갓난아기는 약 300개의 뼈를 가지고 있다."],[6,"As a baby grows, some bones join together and become one bone.","아기가 자라면서, 몇몇 뼈들은 합쳐져 하나의 뼈가 된다."],[10,"This also happens in other places, such as the spine.","이것은 또한 척추 같은 다른 장소들에서도 일어난다."],[11,"Because of these changes, the number of bones continues decreasing until you have about 206.","이러한 변화들 때문에, 뼈의 개수는 당신이 약 206개를 가질 때까지 계속 줄어든다."]],"w":"6번에서 뼈가 합쳐져 하나가 되고 11번에서 그 변화 때문에 뼈의 수가 계속 줄어든다고 함. 늘어나지 않고(11번), 태어날 때는 약 300개이며(4번), 척추 같은 다른 곳에서도 일어남(10번)이라 나머지는 틀림.","c":3},"h":"71e3ee10e1"},{"n":9,"t":"sum","q":"Although the (A) of bones decreases as you grow, your bones become (B).","ko":"자랄수록 뼈의 (A)는 줄어들지만, 뼈는 (B) 된다.","oko":["(A) 크기 / (B) 더 강하게","(A) 수 / (B) 더 약하게","(A) 색 / (B) 더 약하게","(A) 수 / (B) 더 강하게","(A) 수 / (B) 더 짧게"],"opts":["(A) size / (B) stronger","(A) number / (B) weaker","(A) color / (B) weaker","(A) number / (B) stronger","(A) number / (B) shorter"],"r":{"a":"4) (A) number / (B) stronger","ev":"11번, 13번 문장","s":[[11,"Because of these changes, the number of bones continues decreasing until you have about 206.","이러한 변화들 때문에, 뼈의 개수는 당신이 약 206개를 가질 때까지 계속 줄어든다."],[13,"Even though the number has decreased, your bones have surely gotten stronger!","비록 개수는 감소했을지라도, 당신의 뼈는 확실히 더 강해졌다!"]],"w":"11번에서 the number of bones(뼈의 수)가 계속 줄어든다고 하고, 13번에서 Even though the number has decreased, your bones have surely gotten stronger(뼈는 더 강해졌다)라고 함.","c":4},"h":"4cc2cece36"},{"n":10,"t":"fill","q":"A newborn baby has about 300 bones, but as the baby grows, some bones [A] together and become [B] bone.","ko":"갓난아기는 약 300개의 뼈를 가지고 있지만, 아기가 자라면서 몇몇 뼈들이 함께 [A]하여 [B] 뼈가 된다.","bank":["join","one","spine","stronger","many","protect"],"bko":{"join":"합쳐지다","one":"하나의","spine":"척추","stronger":"더 강한","many":"많은","protect":"보호하다"},"r":{"a":"[A] join, [B] one","ev":"4번, 6번 문장","s":[[4,"A newborn baby has about 300 bones.","갓난아기는 약 300개의 뼈를 가지고 있다."],[6,"As a baby grows, some bones join together and become one bone.","아기가 자라면서, 몇몇 뼈들은 합쳐져 하나의 뼈가 된다."]],"w":"4번 about 300 bones, 6번 some bones join together and become one bone에서 가져옴. spine, stronger, many, protect는 해당 자리에 뜻이나 문법이 맞지 않음.","c":null},"h":"43838f6b5c"}]},{"u":2,"id":"rj3-02-3","no":3,"ko":"내 미모의 비결은 새우","items":[{"n":1,"t":"tf","q":"Flamingos are born with gray feathers.","ko":"홍학은 회색 깃털을 가지고 태어난다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"However, they are born with gray feathers.","하지만, 그들은 회색 깃털을 가지고 태어난다."]],"w":"2번 문장에 they are born with gray feathers가 있음. 본문과 일치.","c":"T"},"h":"723ea54199"},{"n":2,"t":"tf","q":"The color of an adult flamingo has nothing to do with the food it eats.","ko":"다 자란 홍학의 색은 그것이 먹는 먹이와 아무 관계가 없다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Adult flamingos are pink, orange, or white depending on the type of food that they eat.","다 자란 홍학은 그들이 먹는 먹이의 종류에 따라 분홍색이나 주황색, 흰색이다."]],"w":"4번 문장에서 다 자란 홍학의 색은 먹는 먹이의 종류에 따라(depending on the type of food) 달라진다고 함. 본문과 반대.","c":"F"},"h":"60d7a2d223"},{"n":3,"t":"tf","q":"Flamingos near the sea can be more colorful than flamingos near lakes.","ko":"바다 근처의 홍학은 호수 근처의 홍학보다 더 색채가 풍부할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"So you can see more colorful flamingos near the sea than near lakes.","그래서 당신은 호수 근처에서보다 바다 근처에서 더 색채가 풍부한 홍학을 볼 수 있다."]],"w":"9번 문장에 you can see more colorful flamingos near the sea than near lakes가 있음. 본문과 일치.","c":"T"},"h":"335289b5c8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Because of their beautiful feathers, flamingos are one of the most recognizable birds on Earth.)","ko":"아름다운 깃털 때문에 홍학은 지구에서 가장 recognizable한 새들 중 하나이다.","opts":["위험한","쉽게 알아볼 수 있는","흔하지 않은","조용한"],"word":"recognizable","r":{"a":"2) 쉽게 알아볼 수 있는","ev":"1번 문장","s":[[1,"Because of their beautiful feathers, flamingos are one of the most recognizable birds on Earth.","홍학은 아름다운 깃털 때문에 지구에서 가장 눈에 띄는 새들 중 하나이다."]],"w":"1번 문장은 아름다운 깃털 때문에 홍학이 눈에 띈다는 흐름이라 recognizable은 ‘쉽게 알아볼 수 있는’.","c":2},"h":"a7f468a2fb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (this pigment becomes a pink or orange color and then gets stored in the flamingos’ legs, bills, and feathers)","ko":"이 색소는 분홍색이나 주황색이 되고 그러고 나서 홍학의 다리와 부리, 깃털 속에 stored된다.","opts":["버려진","씻겨진","저장된","색칠된"],"word":"stored","r":{"a":"3) 저장된","ev":"7번 문장","s":[[7,"After flamingos eat these foods, this pigment becomes a pink or orange color and then gets stored in the flamingos’ legs, bills, and feathers.","홍학이 이 먹이들을 먹고 나면, 이 색소는 분홍색이나 주황색이 되고 그러고 나서 홍학의 다리와 부리, 깃털 속에 저장된다."]],"w":"7번 문장은 색소가 다리, 부리, 깃털 속에 ‘남아 있게 된다’는 흐름. gets stored는 ‘저장된다’.","c":3},"h":"68d1a8004a"},{"n":6,"t":"ref","q":"What does the underlined \"These foods\" refer to?\nThese foods contain a special pigment that gives plants and animals their color.","ko":"밑줄 친 These foods가 가리키는 것은?","sko":"이 먹이들은 동식물에 색을 주는 특별한 색소를 함유한다.","opts":["홍학의 깃털과 부리","호수 근처의 작은 곤충들","당근과 수박","새우와 해초 같은 작은 바다 생물과 식물"],"r":{"a":"4) 새우와 해초 같은 작은 바다 생물과 식물","ev":"5~6번 문장","s":[[5,"Some of their favorite foods are small sea creatures and plants such as shrimp and seaweed.","그들이 가장 좋아하는 먹이 중 몇몇은 새우와 해초 같은 작은 바다 생물과 식물이다."],[6,"These foods contain a special pigment that gives plants and animals their color.","이 먹이들은 동식물에 색을 주는 특별한 색소를 함유한다."]],"w":"These foods는 바로 앞 5번에서 홍학이 좋아하는 먹이로 말한 small sea creatures and plants such as shrimp and seaweed. 당근과 수박은 10번에서 ‘다른’ 먹이로 따로 나옴.","c":4},"h":"f07a884d43"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The more of these sea creatures and plants flamingos eat, the pinker or more orange they become.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"홍학이 더 많은 이런 바다 생물과 식물들을 먹을수록, 그들은 더 진한 분홍색이나 주황색이 된다.","opts":["이런 바다 생물과 식물을 많이 먹을수록 더 진한 분홍색이나 주황색이 된다.","이런 바다 생물과 식물을 많이 먹을수록 점점 하얗게 변한다.","더 분홍색일수록 이런 바다 생물과 식물을 더 많이 먹는다.","이런 바다 생물과 식물을 적게 먹을수록 더 주황색이 된다."],"r":{"a":"1) 이런 바다 생물과 식물을 많이 먹을수록 더 진한 분홍색이나 주황색이 된다.","ev":"8번 문장","s":[[8,"The more of these sea creatures and plants flamingos eat, the pinker or more orange they become.","홍학이 더 많은 이런 바다 생물과 식물들을 먹을수록, 그들은 더 진한 분홍색이나 주황색이 된다."]],"w":"the + 비교급 ~, the + 비교급 …은 ‘~할수록 더 …하다’. 많이 먹는 것이 원인이고 더 진한 색이 결과임. 3번은 원인과 결과가 거꾸로이고 2번과 4번은 본문과 반대.","c":1},"h":"fc96fffc9f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["홍학은 분홍색으로 태어나서 회색으로 변한다.","홍학은 먹는 먹이에서 얻은 색소로 분홍색이나 주황색이 된다.","호수 근처의 홍학이 바다 근처의 홍학보다 더 색이 진하다.","사람이 당근을 먹으면 피부색이 바뀐다."],"opts":["Flamingos are born pink and then turn gray.","Flamingos become pink or orange because of the pigment in the food they eat.","Flamingos near lakes are more colorful than flamingos near the sea.","People change their skin color when they eat carrots."],"r":{"a":"2) Flamingos become pink or orange because of the pigment in the food they eat.","ev":"2번, 4번, 7번, 9번, 11번 문장","s":[[2,"However, they are born with gray feathers.","하지만, 그들은 회색 깃털을 가지고 태어난다."],[4,"Adult flamingos are pink, orange, or white depending on the type of food that they eat.","다 자란 홍학은 그들이 먹는 먹이의 종류에 따라 분홍색이나 주황색, 흰색이다."],[7,"After flamingos eat these foods, this pigment becomes a pink or orange color and then gets stored in the flamingos’ legs, bills, and feathers.","홍학이 이 먹이들을 먹고 나면, 이 색소는 분홍색이나 주황색이 되고 그러고 나서 홍학의 다리와 부리, 깃털 속에 저장된다."],[9,"So you can see more colorful flamingos near the sea than near lakes.","그래서 당신은 호수 근처에서보다 바다 근처에서 더 색채가 풍부한 홍학을 볼 수 있다."],[11,"However, people do not eat enough of them to change their skin color.","하지만, 사람들은 피부색을 바꿀 정도로 그것들의 충분한 양을 먹지는 않는다."]],"w":"7번에서 먹이의 색소가 분홍색이나 주황색이 되어 몸에 저장된다고 함. 회색으로 태어나고(2번), 바다 근처 홍학이 더 색이 진하며(9번), 사람은 피부색을 바꿀 만큼 먹지 않음(11번)이라 나머지는 틀림.","c":2},"h":"a38db07eef"},{"n":9,"t":"sum","q":"Flamingos eat foods that contain a special (A), and it is (B) in their legs, bills, and feathers.","ko":"홍학은 특별한 (A)을 함유한 먹이를 먹고, 그것은 다리와 부리, 깃털에 (B).","oko":["(A) 비타민 / (B) 저장된다","(A) 색소 / (B) 사라진다","(A) 설탕 / (B) 사라진다","(A) 비타민 / (B) 사라진다","(A) 색소 / (B) 저장된다"],"opts":["(A) vitamin / (B) stored","(A) pigment / (B) lost","(A) sugar / (B) lost","(A) vitamin / (B) lost","(A) pigment / (B) stored"],"r":{"a":"5) (A) pigment / (B) stored","ev":"6~7번 문장","s":[[6,"These foods contain a special pigment that gives plants and animals their color.","이 먹이들은 동식물에 색을 주는 특별한 색소를 함유한다."],[7,"After flamingos eat these foods, this pigment becomes a pink or orange color and then gets stored in the flamingos’ legs, bills, and feathers.","홍학이 이 먹이들을 먹고 나면, 이 색소는 분홍색이나 주황색이 되고 그러고 나서 홍학의 다리와 부리, 깃털 속에 저장된다."]],"w":"6번에서 먹이가 special pigment(특별한 색소)를 함유한다고 하고, 7번에서 그 색소가 다리, 부리, 깃털에 stored(저장된다)라고 함.","c":5},"h":"87f29bbe53"},{"n":10,"t":"fill","q":"Foods like carrots and watermelons also [A] this pigment, but people do not eat [B] of them to change their skin color.","ko":"당근과 수박 같은 음식도 이 색소를 [A]하지만, 사람들은 피부색을 바꿀 만큼 그것들을 [B] 먹지 않는다.","bank":["contain","enough","gray","lakes","relief","adult"],"bko":{"contain":"함유하다","enough":"충분한 양","gray":"회색","lakes":"호수","relief":"안심","adult":"다 자란"},"r":{"a":"[A] contain, [B] enough","ev":"10~11번 문장","s":[[10,"Many other foods that people eat, like carrots and watermelons, also contain this pigment.","당근과 수박 같은 사람들이 ord? (When you see bodyguards, you’ll notice that they often wear dark sunglasses.)","ko":"경호원들을 보면 당신은 그들이 종종 어두운 선글라스를 쓰고 있다는 것을 notice할 것이다.","opts":["잊어버리다","알아차리다","무시하다","설명하다"],"word":"notice","r":{"a":"2) 알아차리다","ev":"1번 문장","s":[[1,"When you see bodyguards, you’ll notice that they often wear dark sunglasses.","경호원들을 보면 당신은 그들이 종종 어두운 선글라스를 쓰고 있다는 것을 알아차릴 것이다."]],"w":"1번 문장은 경호원을 보면 그들이 선글라스를 쓰고 있다는 사실이 눈에 들어온다는 흐름. notice는 ‘알아차리다’.","c":2},"h":"97b6d727f7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That’s probably why human eyes evolved to have large white parts.)","ko":"그것이 아마 사람의 눈이 큰 흰자위를 갖도록 evolved한 이유일 것이다.","opts":["숨었다","화났다","진화했다","도망쳤다"],"word":"evolved","r":{"a":"3) 진화했다","ev":"11번 문장","s":[[11,"That’s probably why human eyes evolved to have large white parts.","그것이 아마 사람의 눈이 진화하여 큰 흰자위를 갖게 된 이유일 것이다."]],"w":"11번은 협력하기 쉬우려고 사람의 눈이 큰 흰자위를 갖게 되었다는 결론. 오랜 시간에 걸쳐 변해 왔다는 뜻이라 evolve는 ‘진화하다’.","c":3},"h":"e8a86ef2f3"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is because the white parts of other primates’ eyes are so small that we can’t easily see their eye movements.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 다른 영장류의 눈의 흰자위가 매우 작아서 우리가 그들의 눈 움직임을 쉽게 볼 수 없기 때문이다.","opts":["사람의 눈의 흰자위가 큰 것","경호원이 어두운 선글라스를 쓰는 것","우리가 침팬지의 눈 움직임을 쉽게 보는 것","침팬지가 경호원이라면 선글라스가 필요 없을 것이라는 것"],"r":{"a":"4) 침팬지가 경호원이라면 선글라스가 필요 없을 것이라는 것","ev":"5~6번 문장","s":[[5,"However, if chimpanzees were bodyguards, they wouldn’t need sunglasses!","그러나 만약 침팬지가 경호원이라면, 그들은 선글라스가 필요 없을 것이다!"],[6,"This is because the white parts of other primates’ eyes are so small that we can’t easily see their eye movements.","이는 다른 영장류의 눈의 흰자위가 매우 작아서 우리가 그들의 눈 움직임을 쉽게 볼 수 없기 때문이다."]],"w":"This is because 뒤에 이유가 오고, 이유는 영장류의 흰자위가 작아 눈 움직임이 안 보인다는 것. 그 결과가 바로 앞 5번의 ‘침팬지는 선글라스가 필요 없을 것이다’.","c":4},"h":"a0827559e0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This allows us to see where a person’s eyes are pointed.\"","ko":"이 문장의 의미로
