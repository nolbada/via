[["___ is difficult. 영어 문법을 배우는 것은 어렵다.","Learning English grammar","Learning English grammar is difficult.","영어 문법을 배우는 것은 어렵다.","본책 p.74 POINT 1 ‘주어 역할’ 의 첫 예문을 보세요.","1) 빈칸은 문장의 주어 자리예요.  2) ‘영어 문법을 배우는 것은’ 을 동사 learn(배우다)을 이용해 나타내요.","L로 시작하는 단어와 English grammar로 이루어진 세 단어예요.","주어 동명사(구) = ~하는 것은"],
 ["Tina’s hobby is ___. Tina의 취미는 만화를 그리는 것이다.","drawing cartoons","Tina’s hobby is drawing cartoons.","Tina의 취미는 만화를 그리는 것이다.","본책 p.74 POINT 3 ‘보어 역할’ 을 보세요.","1) is 뒤에서 취미가 무엇인지 설명해요.  2) ‘그리는 것’ 을 동사 draw(그리다)에서 만들어요.","d로 시작하는 -ing 한 단어와 cartoons예요.","Tina’s hobby is drawing: 보어 자리 v-ing"],
 ["Jonathan ___ my question. Jonathan은 내 질문에 대답하는 것을 피했다.","avoided answering","Jonathan avoided answering my question.","Jonathan은 내 질문에 대답하는 것을 피했다.","본책 p.76 POINT 1 ‘동명사만을 목적어로 취하는 동사’ 를 보세요.","1) 첫 칸은 ‘피했다’ 를 과거형으로, 둘째 칸은 ‘대답하는 것’ 이에요.  2) avoid(피하다)는 뒤에 동명사가 와요.","avoided + a로 시작하는 -ing 한 단어(answer + ing)예요.","avoid + v-ing"],
 ["I hope ___ Hawaii someday. 나는 언젠가 하와이를 방문하기를 희망한다.","to visit","I hope to visit Hawaii someday.","나는 언젠가 하와이를 방문하기를 희망한다.","본책 p.76 POINT 2 ‘to부정사만을 목적어로 취하는 동사’ 를 보세요.","1) hope(희망하다)는 to부정사만 목적어로 받아요.  2) ‘방문하다’ 는 visit이에요.","to v로 시작하는 두 단어예요.","hope + to V"],
 ["Hazel likes ___ to K-pop music. (= listening)","to listen","Hazel likes to listen to K-pop music.","Hazel은 K-pop 음악을 듣는 것을 좋아한다.","본책 p.76 POINT 3 의미 차이가 없는 경우의 예문(listening(= to listen))을 보세요.","1) like는 동명사와 to부정사 둘 다 받아요.  2) 윗줄에서는 listening을 썼으니, 이 줄에서는 to부정사로 바꿔 써요.","to l로 시작하는 두 단어예요.","like + v-ing = like + to V"],
 ["Don’t forget ___ Joy. Joy에게 전화할 것을 잊지 말아라.","to call","Don’t forget to call Joy.","Joy에게 전화할 것을 잊지 말아라.","본책 p.76 POINT 4 표의 forget 부분을 보세요.","1) 앞으로 전화해야 해요. 아직 하지 않은 일이에요.  2) ‘(미래에) ~할 것을 잊다’ 에 쓰는 모양을 표에서 찾아요.","to c로 시작하는 두 단어예요.","Don’t forget to V = 잊지 말고 ~해라"],
 ["___ Joy at 7:00 p.m. 7시에 Joy를 만날 것을 기억해라.","Remember to meet","Remember to meet Joy at 7:00 p.m.","7시에 Joy를 만날 것을 기억해라.","본책 p.76 POINT 4 표의 remember 부분을 보세요.","1) 7시는 앞으로 올 시간이에요. 앞으로 할 일을 기억하라는 말이에요.  2) 문장 맨 앞이라 대문자로 시작하고, ‘(미래에) ~할 것을 기억하다’ 모양을 써요.","R로 시작하는 세 단어예요. 첫 단어 뒤에 meet(만나다)을 -ing가 아닌 모양으로 이어요.","Remember to V! = 잊지 말고 ~해라 (앞으로 할 일)"],
 ["My brother ___ the bike. 내 남동생은 자전거를 고치려고 해 봤다.","tried fixing","My brother tried fixing the bike.","내 남동생은 자전거를 고치려고 해 봤다.","본책 p.76 POINT 4 표의 try 부분을 보세요.","1) 해석이 ‘(시험 삼아) 해 봤다’ 뜻이에요.  2) 시험 삼아 해 보는 뜻일 때 try 뒤에 쓰는 모양을 표에서 찾아요. fix는 ‘고치다’예요.","t로 시작하는 두 단어예요. tried 뒤에 f로 시작하는 -ing 한 단어가 와요.","tried fixing = (시험 삼아) 고쳐 봤다"],
 ["My brother ___ the bike. 내 남동생은 자전거를 고치려고 노력했다.","tried to fix","My brother tried to fix the bike.","내 남동생은 자전거를 고치려고 노력했다.","본책 p.76 POINT 4 표의 try 부분을 보세요.","1) 해석이 ‘~하려고 노력했다’ 예요.  2) 이 뜻일 때 try 뒤에 쓰는 모양을 표에서 찾아요.","t로 시작하는 세 단어예요. tried 뒤에 fix(고치다)를 -ing가 아닌 두 단어 모양으로 이어요.","tried to fix = 고치려고 노력했다"]
].forEach((r,i)=>W("GN","G",i+1,r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));

W("BC","A",1,"우리말과 일치하도록 ( ) 안의 말을 올바른 형태로 쓰세요.<br>노래하는 소녀 → a ___ girl (sing)","singing","a singing girl","노래하는 소녀",

 "1) 소녀가 노래를 ‘하는’ 쪽이에요. 스스로 하는 동작이니까 능동이에요.  2) 능동·진행의 뜻이면 현재분사(v-ing)와 과거분사(p.p.) 중 어느 쪽일까요?",
 "sing(노래하다) 뒤에 -ing를 붙여요. s로 시작하는 7글자예요.",

 "본책 p.86 ‘분사란?’ 박스에서 수동·완료의 뜻을 가진 분사를 확인하세요.",
 "1) 프로젝트가 ‘끝난’ 상태예요. 이미 다 끝났다는 완료의 뜻이에요.  2) 수동·완료의 뜻이면 현재분사와 과거분사 중 어느 쪽일까요?",
 "finish(끝내다) 뒤에 -ed를 붙여요. f로 시작하는 8글자예요.",

W("BC","A",3,"우리말과 일치하도록 ( ) 안의 말을 올바른 형태로 쓰세요.<br>춤추는 커플 → a ___ couple (dance)","dancing","a dancing couple","춤추는 커플",
 "본책 p.86 ‘분사란?’ 박스에서 능동·진행의 분사 모양을 확인하세요.",
 "1) 커플이 직접 춤을 ‘추는’ 중이에요. 능동이에요.  2) dance(춤추다)처럼 e로 끝나는 동사는 -ing를 붙일 때 e를 어떻게 할까요?",

W("BC","A",4,"우리말과 일치하도록 ( ) 안의 말을 올바른 형태로 쓰세요.<br>깨진 창문 → a ___ window (break)","broken","a broken window","깨진 창문",
 "본책 p.86 ‘분사란?’ 박스를 보세요. 과거분사는 -ed 또는 불규칙 변화라고 나와 있어요(p.88 표에도 있어요).",
 "1) 창문은 스스로 깨는 게 아니라 ‘깨진’ 거예요. 수동이에요.  2) break(깨다)는 break - broke - ___ 로 변하는 불규칙 동사예요. 세 번째 칸이 과거분사예요.",

W("BC","A",5,"우리말과 일치하도록 ( ) 안의 말을 올바른 형태로 쓰세요.<br>숨겨진 보물 → ___ treasure (hide)","hidden","hidden treasure","숨겨진 보물",
 "본책 p.86 ‘분사란?’ 박스에서 수동의 뜻을 가진 분사를 확인하세요.",

SA(1,"I received an email <u>offered</u> me a job.","offering","I received an email offering me a job.","나는 나에게 일자리를 제안하는 이메일을 받았다.",

W("SW","C",2,"다음 그림을 보고 ( ) 안의 말을 이용하여 지시대로 우리말을 영작하세요. (그림: 남자가 여자를 보며 웃고 손을 내미는 모습) (while, smile at)<br>그는 그녀에게 웃으면서, 그의 손을 내밀었다.<br>부사절로: ___ her, he held out his hand.<br>분사구문으로: ___ her, he held out his hand.","While he was smiling[While he smiled] at / Smiling at","While he was smiling at her, he held out his hand. (While he smiled at her도 정답) / Smiling at her, he held out his hand.","그는 그녀에게 웃으면서, 그의 손을 내밀었다.",
 "본책 p.90 POINT 1의 ‘부사절의 동사가 진행형인 경우’ 박스와 POINT 2 동시동작 줄을 보세요.",
 "1) 동시에 일어나는 두 동작이에요. 부사절은 While + he + was + -ing 순서가 자연스러워요(과거 진행). While he smiled at처럼 과거형으로 써도 돼요.  2) 분사구문은 While, he, was를 지우고 현재분사만 남겨요.",
 "부사절: While he was s______ at(7글자 분사). 분사구문: S______ at. smile의 e는 빼요.",
 "While he was smiling(웃는 동안) → Smiling");
W("SW","C",3,"다음 그림을 보고 ( ) 안의 말을 이용하여 지시대로 우리말을 영작하세요. (그림: 여행 가방을 끌고 기차를 놓칠까 봐 급히 달려가는 모습) (since, want, miss)<br>나는 기차를 놓치고 싶지 않았기 때문에, 서둘러 집을 나왔다.<br>부사절로: ___ the train, I left my house quickly.<br>분사구문으로: ___ the train, I left my house quickly.","Since I didn’t want to miss / Not wanting to miss","Since I didn’t want to miss the train, I left my house quickly. / Not wanting to miss the train, I left my house quickly.","나는 기차를 놓치고 싶지 않았기 때문에, 서둘러 집을 나왔다.",

 "1) ‘놓치고 싶지 않았기 때문에’는 이유 + 부정이에요. 부사절은 Since I didn’t want to miss, 처럼 쓰고 want 뒤에 to를 붙여요.  2) 분사구문은 Since와 I를 지우고 not을 분사 앞에 둬요.",

 "스스로 하는 동작 → crying boy");

 "본책 p.88 POINT 3 ‘감정을 나타내는 분사’ 박스를 보세요.",

C("NS","N",9,"밑줄 친 부분과 바꿔 쓸 수 있는 것을 고르세요.<br><u>Having no more work to do</u>, I went outside to play.",["① Since I had no more work to do","② After I have no more work to do","③ Before I had no more work to do","④ When I have no more work to do","⑤ As I am having no more work to do"],"① Since I had no more work to do","Since I had no more work to do, I went outside to play.","더 할 일이 없었기 때문에, 나는 놀러 밖에 나갔다.",
 "본책 p.90 POINT 2 ‘분사구문의 의미’ 표를 보고, 시제를 맞추는 규칙(POINT 1 ③)도 보세요.",
 "1) 할 일이 없는 것이 밖에 나가 논 이유예요.  2) 주절이 went(원형 go: 가다, 과거)이니 부사절도 과거여야 해요. 현재 시제 보기는 모두 제외해요.",
 "②, ④, ⑤는 현재 시제라 빼요. Before(~ 전에)도 뜻이 안 맞아요.",
 "분사구문 이유 → Since/Because + 과거(주절과 같게)");
C("NS","N",10,"밑줄 친 부분과 바꿔 쓸 수 있는 것을 고르세요.<br><u>Listening to his joke</u>, I started to laugh out loud.",["① When I am listening to his joke","② While I listened to his joke","③ Before I was listening to his joke","④ As she listened to his joke","⑤ After she listened to his joke"],"② While I listened to his joke","While I listened to his joke, I started to laugh out loud.","그의 농담을 들으면서, 나는 크게 웃기 시작했다.",
 "본책 p.90 POINT 2 ‘분사구문의 의미’ 표와 POINT 1 분사구문 만드는 방법을 보세요.",
 "1) 농담을 듣는 일과 웃기 시작한 일이 동시에 일어나요(~하면서, ~하는 동안).  2) 주어는 주절과 같은 I이고, 주절이 과거(started)라서 부사절도 과거여야 해요.",
 "주어가 she인 보기와 현재 시제 보기는 제외해요. before·after도 의미가 안 맞아요.",
 "동시동작 → While + 같은 주어 + 과거");
C("NS","N",11,"밑줄 친 부분과 바꿔 쓸 수 있는 것을 고르세요.<br><u>Strolling down the street</u>, Sara and her friends saw something strange.",["① As she was strolling down the street","② While she was strolling down the street","③ While they were strolling down the street","④ Since they were strolled down the street","⑤ When they were strolled down the street"],"③ While they were strolling down the street","While they were strolling down the street, Sara and her friends saw something strange.","길을 거닐다가, Sara와 그녀의 친구들은 이상한 것을 봤다.",
 "본책 p.90 POINT 1 분사구문 만드는 방법에서 ‘주어가 같으면 생략’ 규칙을 보세요.",
 "1) 주절의 주어는 Sara and her friends(여러 명)이에요. 부사절 주어도 같은 사람들을 가리켜요. 단수 she와 복수 they 중 어느 쪽일까요?  2) strolling(거닐다)은 능동이라 were strolled(수동)는 안 돼요.",
 "she가 주어인 ①②는 빼요. were strolled(수동)인 ④⑤도 빼요.",
 "주절 주어가 복수 → 부사절 주어 they");
C("NS","N",12,"대화가 가장 자연스러운 것은?",["① A How about going to a movie tonight?<br>B I want to stay home. I’m quite <u>tiring</u>.","② A Have you heard the <u>shocked</u> news about the actor?<br>B I have. That’s why I unfollowed him on social media.","③ A Do you know Dylan? He’s so funny.<br>B Yes, he always makes the most <u>amused</u> jokes.","④ A I think I have to cancel my plans with Jack today.<br>B Oh, no. He’s going to be <u>disappointed</u>.","⑤ A How was the book you read yesterday?<br>B The story was <u>fascinated</u>!"],"④ A I think I have to cancel my plans with Jack today.<br>B Oh, no. He’s going to be <u>disappointed</u>.","A: I think I have to cancel my plans with Jack today. B: Oh, no. He’s going to be disappointed.","A: 오늘 Jack과의 약속을 취소해야 할 것 같아. B: 아, 안 돼. 그는 실망할 거야.",
 "본책 p.88 POINT 3 ‘감정을 나타내는 분사’ 박스를 펴세요.",
 "1) 보기마다 밑줄 친 분사가 사람의 감정인지 사물의 특징인지 따져요.  2) 사람이 느끼면 -ed, 사물·사건이 일으키면 -ing예요.  3) I, news, jokes, story, He에 각각 어울리는 쪽을 확인해요.",
 "I는 tired, news는 shocking, jokes는 amusing, story는 fascinating이 맞아요. 이 넷은 틀렸어요.",
 "사람이 느끼면 p.p. / 사물이 일으키면 v-ing");
W("NS","N",13,"분사를 이용하여 주어진 두 문장을 한 문장으로 연결하세요.<br>The man is my teacher. / The man is crossing the road.<br>→ The man ___.","crossing the road is my teacher","The man crossing the road is my teacher.","길을 건너고 있는 남자는 나의 선생님이다.",
 "본책 p.88 POINT 2 ‘분사의 역할’에서 분사가 다른 어구와 함께 명사 뒤에서 꾸미는 예를 보세요.",
 "1) 두 문장의 공통 명사는 The man이에요.  2) ‘The man is crossing the road’를 ‘길을 건너고 있는’ 꾸미는 말로 바꿔 The man 바로 뒤에 붙여요.  3) 그 뒤에 나머지 문장 is my teacher를 이어요.",
 "순서는 crossing → the road → is → my teacher예요. c로 시작해요.",
 "공통 명사 + 분사구 + 나머지 문장");
C("NS","N",14,"밑줄 친 부분의 쓰임이 나머지 넷과 다른 것을 고르세요.",["① I know the guy <u>wearing</u> the blue T-shirt.","② There is a <u>smoking</u> room in the station.","③ I have to buy a new pair of <u>dancing</u> shoes.","④ Mom poured a cup of milk into the <u>frying</u> pan.","⑤ We took two <u>sleeping</u> bags on the camping trip."],"① I know the guy <u>wearing</u> the blue T-shirt.","I know the guy wearing the blue T-shirt.","나는 파란색 티셔츠를 입고 있는 그 남자를 안다.",
 "본책 p.86 ‘현재분사 vs. 동명사’ 표와 p.88 POINT 1 아래 비교 표를 보세요.",
 "1) 밑줄 친 말이 명사를 ‘~하고 있는’으로 꾸미면 현재분사, ‘~하기 위한’ 용도면 동명사예요.  2) smoking room(흡연실), dancing shoes(춤추는 용 신발), frying pan(프라이팬), sleeping bag(침낭)은 모두 용도예요.  3) 하나만 지금 ‘입고 있는’ 진행의 뜻이에요.",
 "②~⑤는 모두 ‘명사 + for v-ing’(~하기 위한)로 바꿀 수 있어요. 바꿀 수 없는 하나를 찾아요.",
 "용도(~하기 위한) = 동명사 / 진행 = 현재분사");
C("NS","N",15,"밑줄 친 부분의 쓰임이 나머지 넷과 다른 것을 고르세요.",["① Look at the dog <u>swimming</u> in the pool.","② I went to the <u>swimming</u> pool yesterday.","③ There are people <u>swimming</u> in the river.","④ The shark got close to the <u>swimming</u> girl.","⑤ The boy <u>swimming</u> with his friends looks happy."],"② I went to the <u>swimming</u> pool yesterday.","I went to the swimming pool yesterday.","나는 어제 수영장에 갔다.",
 "본책 p.86 ‘현재분사 vs. 동명사’ 표와 p.88 POINT 1 비교 표를 보세요.",
 "1) 각 swimming이 꾸미는 명사를 찾아요(dog, pool, people, girl, boy).  2) ‘헤엄치고 있는’ 뜻이면 현재분사, ‘수영하기 위한’ 용도면 동명사예요.",
 "dog, people, girl, boy는 지금 헤엄치고 있는 사람·동물이에요. ‘수영하기 위한 곳’인 명사를 찾아요.",
 "swimming pool = a pool for swimming (동명사)");
W("NS","N",16,"우리말과 일치하도록 주어진 조건에 맞게 영작하세요.<br>그것은 만족스러운 식사였다.<br>(조건: 과거시제로 쓸 것 / it, satisfy, meal을 이용할 것 / 총 5단어의 완전한 문장)","It was a satisfying meal.","It was a satisfying meal.","그것은 만족스러운 식사였다.",
 "본책 p.88 POINT 3 ‘감정을 나타내는 분사’ 박스에서 satisfying — satisfied 줄을 보세요.",
 "1) It(그것)을 주어로, 과거 be동사를 써서 ‘It was ~’로 시작해요.  2) 5단어이니 관사 a가 필요해요.  3) 식사가 만족을 ‘일으키는’ 쪽이니 satisfy를 어떤 분사로 쓸지 정해요.",
 "순서는 It → was → a → satisfying → meal이에요.",
 "사물이 감정을 일으킴 → satisfying meal");
C("NS","N",17,"빈칸 (A)~(C)에 들어갈 말이 바르게 짝지어진 것은?<br>• (A) ___ chicken is my favorite food.<br>• My uncle often told me (B) ___ stories.<br>• Everyone cried because of the (C) ___ story.",["① Fried / interested / moving","② Fried / interesting / moving","③ Fried / interesting / moved","④ Frying / interesting / moving","⑤ Frying / interested / moved"],"② Fried / interesting / moving","Fried chicken is my favorite food. / My uncle often told me interesting stories. / Everyone cried because of the moving story.","프라이드치킨은 내가 가장 좋아하는 음식이다. / 삼촌은 종종 나에게 흥미로운 이야기들을 해 주셨다. / 모두가 그 감동적인 이야기 때문에 울었다.",
 "본책 p.88 POINT 1 표와 POINT 3 ‘감정을 나타내는 분사’ 박스를 보세요.",
 "1) (A) 치킨은 ‘튀겨진’ 수동이에요.  2) (B) stories(이야기)는 흥미를 일으키는 쪽이에요.  3) (C) story도 사람을 감동하게 하는 쪽이에요. 세 칸을 각각 정해요.",
 "(A)는 -ed 모양이고, (B)와 (C)는 -ing 모양이에요.",
 "수동 = p.p. / 이야기가 감정을 일으킴 = v-ing");
C("NS","N",18,"밑줄 친 부분을 분사구문으로 잘못 바꾼 것은?",["① <u>While he was sitting at his desk</u>, Ron read a book. → Sitting at his desk","② <u>Since she was in a hurry</u>, Monica took a taxi. → Being in a hurry","③ <u>Because Jerry didn’t eat breakfast</u>, he was hungry. → Eating not breakfast","④ <u>Before you leave</u>, please turn off the TV. → Before leaving","⑤ <u>As she left the stage</u>, the singer waved at me. → Leaving the stage"],"③ <u>Because Jerry didn’t eat breakfast</u>, he was hungry. → Eating not breakfast","Not eating breakfast, he was hungry.","아침을 먹지 않아서, 그는 배가 고팠다.",
 "본책 p.90 POINT 1 분사구문 만드는 방법 중 ‘분사구문의 부정’과 진행형 박스를 보세요.",
 "1) 보기마다 접속사·주어를 지우고 동사를 -ing로 바꾸는 과정이 맞는지 확인해요.  2) 진행형(was sitting)은 현재분사만, be동사(was)는 being으로 바뀌어요.  3) 부정문이 있는 보기는 not 위치를 확인해요.",
 "①②④⑤는 바르게 바뀌었어요. 부정문이 들어간 보기에서 not의 자리를 확인해요.",
 "부정 분사구문 → Not + v-ing");
W("NS","N",19,"밑줄 친 부분을 분사구문으로 바꿔 쓰세요.<br>As he walked around his neighborhood, he ran into his friend.<br>→ ___, he ran into his friend.","Walking around his neighborhood","Walking around his neighborhood, he ran into his friend.","동네를 돌아다니다가, 그는 친구와 마주쳤다.",
 "본책 p.90 POINT 1 ‘분사구문의 형태와 만드는 방법’ ①②③을 보세요.",
 "1) As는 접속사라 지워요.  2) 부사절 주어 he와 주절 주어 he가 같으니 주어도 지워요.  3) walked(원형 walk: 걷다)를 현재분사로 바꾸고 뒤의 말은 그대로 둬요.",
 "W로 시작하는 7글자 분사 + around his neighborhood예요.",
 "접속사·주어 생략 + 동사 → v-ing");
W("NS","N",20,"밑줄 친 부분을 분사구문으로 바꿔 쓰세요.<br>Because she was excited, Liz shouted out loud.<br>→ ___, Liz shouted out loud.","Being excited","Being excited, Liz shouted out loud.","신이 나서, Liz는 큰 소리로 외쳤다.",
 "본책 p.90 POINT 2 ‘분사구문의 의미’에서 being을 쓰는 설명(Being upset)을 보세요.",
 "1) Because는 접속사라 지워요.  2) she와 Liz는 같은 사람이라 주어도 지워요.  3) was(be동사)는 being으로 바꾸고 excited(신이 난)는 그대로 둬요.",
 "B로 시작하는 5글자 + excited예요.",
 "be동사 → Being (+ 형용사·분사)");
M("NS","N",21,"밑줄 친 부분이 어법상 옳은 것을 모두 고르세요.",["① The store remains <u>closed</u>.","② I am <u>interested</u> in drawing pictures.","③ His vacation plan sounds <u>bored</u> to me.","④ The ending of the movie was <u>inspired</u>.","⑤ The <u>shining</u> stars in the sky were beautiful."],["① The store remains <u>closed</u>.","② I am <u>interested</u> in drawing pictures.","⑤ The <u>shining</u> stars in the sky were beautiful."],"The store remains closed. / I am interested in drawing pictures. / The shining stars in the sky were beautiful.","그 가게는 닫힌 채로 있다. / 나는 그림 그리는 데 관심이 있다. / 하늘에서 빛나는 별들이 아름다웠다.",
 "본책 p.88 POINT 1, POINT 2(보어 역할), POINT 3 ‘감정을 나타내는 분사’를 보세요.",
 "1) 보기마다 꾸미거나 설명하는 말을 찾고 능동인지 수동인지, 일으키는지 느끼는지 따져요.  2) store는 ‘닫힌’ 수동, stars는 ‘빛나는’ 능동이에요.  3) plan(계획)과 ending(결말)이 감정을 일으키는지 느끼는지도 확인해요.",
 "③과 ④는 사물이 감정을 ‘일으키는’ 경우인데 -ed로 틀리게 썼어요. 나머지 세 개가 정답이에요.",
 "일으킴 = v-ing / 느낌 = p.p.");
C("NS","N",22,"[22-23] 다음 글을 읽고 질문에 답하세요.<br>Julia has a cute hamster ⓐ<u>named</u> Fuzzy. Fuzzy lives in a cage ⓑ<u>filling</u> with ⓒ<u>shredded</u> paper. One day, Julia opened the cage to play with Fuzzy. She noticed that his food bowl was empty. So Julia went to get Fuzzy some food. When she returned, Fuzzy was gone! She was so ⓓ<u>shocked</u>. Julia looked everywhere for him in her room. (A) While she was looking in her closet, she finally found Fuzzy in the laundry basket. She was so ⓔ<u>relieved</u>. She picked him up and put him back in his cage.<br>위 글의 밑줄 친 ⓐ~ⓔ 중 어법상 틀린 것은?",["① ⓐ","② ⓑ","③ ⓒ","④ ⓓ","⑤ ⓔ"],"② ⓑ","Fuzzy lives in a cage filled with shredded paper.","Fuzzy는 잘게 자른 종이로 채워진 우리에서 산다.",
 "본책 p.88 POINT 1 표와 POINT 2 ‘분사의 역할’, POINT 3 ‘감정을 나타내는 분사’를 보세요.",
 "1) ⓐ named, ⓑ filling, ⓒ shredded는 각각 cage, paper 같은 명사를 꾸며요. 능동인지 수동인지 따져요.  2) ⓓ shocked, ⓔ relieved는 Julia의 감정이에요.  3) 우리(cage)는 종이로 ‘채워진’ 걸까요, 스스로 ‘채우는’ 걸까요?",
 "ⓐ named(이름 지어진), ⓒ shredded(잘게 잘린)는 수동으로 맞고, ⓓ ⓔ는 Julia가 느끼는 감정이라 맞아요. cage ___ with ~에서 with(~로)가 힌트예요.",
 "be filled with ~ (~로 채워진)");
W("NS","N",23,"위 글의 밑줄 친 (A)를 분사구문으로 바꿔 쓰세요. (단, 접속사를 포함할 것)<br>(A) While she was looking in her closet, she finally found Fuzzy in the laundry basket.<br>→ ___, she finally found Fuzzy in the laundry basket.","While looking in her closet","While looking in her closet, she finally found Fuzzy in the laundry basket.","그녀가 옷장 안을 찾아보는 동안, 그녀는 마침내 빨래 바구니에서 Fuzzy를 발견했다.",
 "본책 p.90 POINT 1의 ‘부사절의 동사가 진행형인 경우’ 박스와 ‘분사구문의 의미를 명확히 하기 위해 접속사를 생략하지 않는 경우’ 박스를 보세요.",
 "1) 문제에서 접속사를 포함하라고 했으니 While은 남겨요.  2) 부사절 주어 she와 주절 주어 she가 같으니 주어를 지워요.  3) was looking은 was를 지우고 현재분사만 남겨요.",
 "While 뒤에 l로 시작하는 7글자 분사 looking이 와요. 그 뒤는 in her closet이에요.",
 "접속사 유지 + 진행형 → While v-ing");
W("NS","N",24,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하세요. (lose, watch)<br>그는 그의 잃어버린 시계를 찾기 위해 노력하는 중이다.<br>He is trying to find ___.","his lost watch","He is trying to find his lost watch.","그는 그의 잃어버린 시계를 찾으려고 노력하는 중이다.",
 "본책 p.88 POINT 1 표에서 수동·완료의 과거분사를 보세요.",
 "1) find(찾다)의 목적어를 만들어요. 소유격 his(그의) 다음에 ‘잃어버린 시계’ 순서예요.  2) 시계는 ‘잃어버려진’ 수동이에요. lose(잃어버리다)는 lose - lost - lost로 변해요.",
 "순서는 his → lost → watch예요. 분사는 l로 시작하는 4글자예요.",
 "소유격 + p.p. + 명사 (his lost watch)");
W("NS","N",25,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하세요. (wear, contact lenses)<br>나는 콘택트렌즈를 끼지 않고 있었기 때문에, Mike를 알아보지 못했다.<br>___, I didn’t know it was Mike.","Not wearing contact lenses","Not wearing contact lenses, I didn’t know it was Mike.","콘택트렌즈를 끼고 있지 않았기 때문에, 나는 그것이 Mike라는 것을 알아보지 못했다.",
 "본책 p.90 POINT 1 ‘분사구문의 부정’(Not knowing the password…)을 보세요.",
 "1) ‘끼지 않고 있었기 때문에’는 이유 + 부정이에요.  2) 접속사와 주어를 지운 분사구문이니 not을 분사 앞에 둬요.  3) wear(착용하다)를 -ing로 바꿔요.",
 "순서는 Not → wearing → contact lenses예요.",
 "이유 + 부정 → Not wearing(끼지 않아서)");
W("NS","N",26,"어법상 틀린 부분을 두 곳 찾아 바르게 고치세요.<br>Laura went to the art gallery yesterday. She was fascinating by all the beautiful works of art. Admired the paintings, she saw a man taking pictures in the gallery. But the gallery banned all photography, so Laura was very annoyed.","fascinating → fascinated / Admired → Admiring","She was fascinated by all the beautiful works of art. Admiring the paintings, she saw a man taking pictures in the gallery.","그녀는 모든 아름다운 예술 작품들에 매료되었다. 그림들에 감탄하다가, 그녀는 갤러리 안에서 사진을 찍고 있는 남자를 보았다.",
 "본책 p.88 POINT 3 ‘감정을 나타내는 분사’와 p.90 POINT 1 분사구문 만드는 방법을 보세요.",
 "1) 둘째 문장: She(Laura)가 매료됨을 ‘느끼는’ 쪽이에요. 뒤의 by(~에 의해)도 수동이에요.  2) 셋째 문장: ‘그림들을 감탄하다가’ 하는 분사구문이에요. Laura가 직접 하는 능동이에요.",
 "첫째는 fascinating을 -ed 모양으로, 둘째는 Admired를 -ing 모양으로 고쳐요.",
 "감정을 느끼면 p.p. / 분사구문 능동은 v-ing");
W("NS","N",27,"보기에서 가장 알맞은 접속사를 골라 밑줄 친 부분을 부사절로 바꿔 쓰세요.<br>보기: when / before / since<br>Having a lot of things to do, Harry had no time to relax.<br>→ ___, Harry had no time to relax.","Since he had a lot of things to do","Since he had a lot of things to do, Harry had no time to relax.","할 일이 많았기 때문에, Harry는 쉴 시간이 없었다.",
 "본책 p.90 POINT 2 ‘분사구문의 의미’ 표의 ‘이유, 원인’ 줄을 보세요.",
 "1) 할 일이 많은 것이 쉴 시간이 없는 이유예요.  2) 접속사는 이유의 뜻인 보기를 골라요.  3) 부사절 주어는 주절 주어 Harry를 대신하는 he이고, 주절이 had(원형 have: 가지다, 과거)라서 시제는 과거예요.",
 "Since로 시작해요. 그 뒤는 he + had + a lot of things to do 순서예요.",
 "이유 → since + 주어 + 과거 동사");
C("NS","N",28,"대화의 밑줄 친 부분의 쓰임이 나머지 넷과 다른 것은?<br>A Do you know the girl ① <u>wearing</u> the red dress?<br>B Do you mean the tall girl ② <u>playing</u> the flute?<br>A No, the girl ③ <u>singing</u> on stage. Her performance is so ④ <u>touching</u>.<br>B Yes, she is a friend of mine. Her hobby is ⑤ <u>singing</u> songs.",["① wearing the red dress","② playing the flute","③ singing on stage","④ touching","⑤ singing songs"],"⑤ singing songs","Her hobby is singing songs.","그녀의 취미는 노래 부르는 것이다.",
 "본책 p.86 ‘현재분사 vs. 동명사’ 표(be동사 뒤에 쓰일 때)와 p.88 POINT 2를 보세요.",
 "1) ①②③은 girl 뒤에서 ‘~하고 있는’으로 꾸며요.  2) ④는 performance(공연)가 감동을 ‘일으키는’ 보어 역할이에요.  3) ⑤는 Her hobby is 뒤에서 ‘취미 = 노래 부르는 것’인지 확인해요.",
 "①②③은 girl을 꾸미는 ‘~하고 있는’, ④는 공연이 ‘감동을 주는’ 뜻이에요. 남은 하나만 ‘~하는 것’이에요.",
 "be동사 + v-ing (주어 = ~하는 것) → 동명사");
W("NS","N",29,"밑줄 친 ⓐ~ⓔ를 알맞은 형태로 바꿔 쓰세요.<br>Tony was worried about being late for school. He ran to the bus stop to catch the bus on time. He was very ⓐ<u>tire</u>, so he leaned against the bus stop. After a while, he noticed that everyone was staring at his feet and smiling. He wondered what was so ⓑ<u>amuse</u>. ⓒ<u>Look</u> down, he was ⓓ<u>surprise</u> to see two bunny slippers. Tony was so ⓔ<u>embarrass</u>! Unfortunately, it was too late to go back home, so Tony had to wear the slippers to school.","ⓐ tired ⓑ amusing ⓒ Looking ⓓ surprised ⓔ embarrassed","He was very tired. / what was so amusing / Looking down, he was surprised to see two bunny slippers. / Tony was so embarrassed!","그는 매우 피곤했다. / 무엇이 그렇게 재미있는지 / 아래를 보다가, 그는 토끼 슬리퍼 두 켤레를 보고 놀랐다. / Tony는 매우 당황했다!",
 "본책 p.88 POINT 3 ‘감정을 나타내는 분사’ 박스와 p.90 POINT 1 분사구문 만드는 방법을 보세요.",
 "1) ⓐ ⓓ ⓔ는 주어 He, Tony가 감정을 ‘느끼는’ 쪽이에요.  2) ⓑ는 what(무엇)이 재미를 ‘일으키는’ 쪽이에요.  3) ⓒ는 Look down 뒤에 쉼표와 주어 he가 이어지는 분사구문 자리예요.",
 "ⓐ ⓓ ⓔ는 -ed 모양, ⓑ는 -ing 모양, ⓒ는 -ing 모양이에요. 각각 t, a, L, s, e로 시작해요.",
 "느낌 = p.p. / 일으킴 = v-ing / 분사구문 = v-ing");
W("NS","N",30,"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰세요.<br>After she worked out, she took a shower.<br>→ ___, she took a shower.","After working out","After working out, she took a shower.","운동한 후에, 그녀는 샤워를 했다.",
 "본책 p.90 POINT 1 분사구문 만드는 방법과 ‘접속사를 생략하지 않는 경우’ 박스를 보세요.",
 "1) ‘~한 후에’의 접속사 After는 문장의 뜻을 분명히 하려고 남겨 둘 수 있어요.  2) 부사절 주어 she와 주절 주어 she가 같으니 부사절 주어를 지워요.  3) worked(원형 work: 운동하다·일하다)를 현재분사로 바꿔요. work out(운동하다)은 한 덩어리예요.",
 "After 뒤에 w로 시작하는 7글자 분사 working이 오고, 그 뒤에 out이 붙어요.",
 "접속사 유지 + v-ing (After working out)");

W("GN","G",3,"쓰임 — 명사 수식(분사 + 명사)<br>I saw a ___ on the street. 나는 길에서 울고 있는 소년을 봤다.","crying boy","I saw a crying boy on the street.","나는 길에서 울고 있는 소년을 봤다.",
 "본책 p.88 POINT 2 ‘분사의 역할’ 첫 예문(분사 단독 → 명사 앞에서 수식)을 보세요.",
 "1) 한글 뜻 ‘울고 있는 소년’을 분사 + 명사 순서로 영어로 바꿔요.  2) 분사 하나만 쓰였으니 명사 앞에서 꾸며요.",
 "cry(울다)는 y를 그대로 두고 -ing를 붙여요. 첫 단어는 c로 시작하는 6글자, 둘째는 boy예요.",

W("GN","G",4,"쓰임 — 명사 수식(명사 + 분사 + 수식어구)<br>They have a ___ Whiskers. 그들은 Whiskers라는 이름의 고양이를 가지고 있다.","cat named","They have a cat named Whiskers.","그들은 Whiskers라는 이름의 고양이를 가지고 있다.",
 "본책 p.88 POINT 2 ‘분사의 역할’ 둘째 예문(다른 어구가 함께 쓰일 경우 → 명사 뒤에서 수식)을 보세요.",
 "1) ‘Whiskers라는 이름의 고양이’에서 고양이가 먼저, 그 뒤에 분사가 와요.  2) 고양이는 ‘이름 지어진’ 수동이에요. name(이름 짓다)의 과거분사를 써요.",

W("GN","G",5,"쓰임 — 주격 보어(주어 + 동사 + 분사)<br>The ___ ___ ___. 공기가 상쾌했다.","air was refreshing","The air was refreshing.","공기가 상쾌했다.",

 "1) 문장은 ‘주어 + 동사 + 분사’ 순서예요. 주어는 air(공기)예요.  2) 동사는 과거(‘상쾌했다’)이니 be동사 과거형을 써요. 공기가 기분을 ‘상쾌하게 해 주는’ 쪽이에요.",

W("GN","G",6,"쓰임 — 목적격 보어(주어 + 동사 + 목적어 + 분사)<br>I saw my brother ___ ___ ___. 나는 내 남동생이 그의 방에 들어가는 것을 봤다.","entering his room","I saw my brother entering his room.","나는 내 남동생이 그의 방에 들어가는 것을 봤다.",
 "본책 p.88 POINT 2 ‘분사의 역할’ 아래쪽 <목적격 보어> 예문을 보세요.",
 "1) saw(원형 see: 보다) 뒤 목적어 my brother 다음에 분사가 와서 목적어의 동작을 설명해요.  2) 남동생이 ‘들어가는’ 능동·진행의 뜻이에요.",
 "enter(들어가다) 뒤에 -ing를 붙이고 his room이 이어져요. e로 시작하는 8글자예요.",

W("GN","G",7,"분사구문 — 형태: 접속사·주어 생략, 동사원형 + -ing<br>___, James felt proud. 상을 받았을 때, James는 자랑스러웠다.","Receiving the award","Receiving the award, James felt proud.","상을 받았을 때, James는 자랑스러웠다.",
 "본책 p.90 POINT 1 ‘분사구문의 형태와 만드는 방법’ 그림(부사절 → 분사구문)을 보세요.",
 "1) 아래 괄호에 원래 문장 When he received the award가 있어요.  2) When과 he를 지우고 received(원형 receive: 받다)를 현재분사로 바꾸면 돼요.",
 "R로 시작하는 9글자 분사 + the award예요.",

 "본책 p.90 POINT 2 ‘분사구문의 의미’ 표 아래 <시간> 예문을 보세요.",
