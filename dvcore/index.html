/* 결과 화면: 틀린 단어마다 카드 한 장 — 관계어 지도(비슷한 뜻 왼쪽 · 반대 뜻 오른쪽 · 관계없음 아래 따로) */
function rvChip(x,side,st,pos){
  var tag=st=='ok'?'맞힘':st=='miss'?'놓침':st=='bad'?'잘못 고름':'';
  var b=el('button','mw '+side+' '+st,'<span class="mwh"><span>'+esc(x[0])+'</span>'+SPKSVG+'</span><em>'+esc(x[1])+'</em>'+(tag?'<i>'+tag+'</i>':''));
  b.type='button';b.setAttribute('aria-label',x[0]+' 발음 듣기');b.onclick=function(){sayWord(x[0],pos)};return b;
}
function rvLines(map){
  var svg=map.querySelector('svg'),mc=map.querySelector('.mc');if(!svg||!mc)return;
  var m=map.getBoundingClientRect();if(!m.width)return;
  svg.setAttribute('width',m.width);svg.setAttribute('height',m.height);svg.setAttribute('viewBox','0 0 '+m.width+' '+m.height);
  var c=mc.getBoundingClientRect(),sx=c.left-m.left+c.width/2,sy=c.bottom-m.top-4,h='';
  [].forEach.call(map.querySelectorAll('.mw.l,.mw.r'),function(b){
    var r=b.getBoundingClientRect(),left=b.classList.contains('l'),ex=(left?r.right:r.left)-m.left,ey=r.top-m.top+r.height/2;
    h+='<path class="ln '+(left?'ls':'ra')+(b.classList.contains('miss')?' miss':'')+(b.classList.contains('bad')?' bad':'')+'" d="M'+sx+' '+sy+' Q'+sx+' '+ey+' '+ex+' '+ey+'"/>';
  });
  svg.innerHTML=h;
}
function rvRedraw(){[].forEach.call(document.querySelectorAll('#testv .map'),rvLines)}
function rvCard(it){
  var w=iw(it),k=w.kan[it.ki],syn=kind(k)=='syn',c=el('div','card'),rel={},ok=itemOK(it);
  (syn?k.syn:k.ant).forEach(function(x){rel[x[0]+'|'+x[1]]=1});
  function st(x){var key=x[0]+'|'+x[1],sel=!!it.sel[key];return rel[key]?(sel?'ok':'miss'):(sel?'bad':'')}
  c.appendChild(el('div','no','DAY '+pad2(it.di+1)+' · '+w.n));
  var v=el('div','res '+(ok?'ok':'no2'),ok?'정답':'오답');v.style.cssText='font-size:calc(20px*var(--fs));margin:4px 0 0';c.appendChild(v);
  var map=el('div','map');map.appendChild(document.createElementNS('http://www.w3.org/2000/svg','svg'));
  var mc=el('div','mc','<div class="mch"><span>'+esc(w.h)+'</span></div><div class="ms">'+tags(k)+esc(k.sense.replace(/^[❶❷❸❹❺❻]+\s*/,''))+'</div>');
  var sp=el('button','spk2',SPKSVG);sp.type='button';sp.setAttribute('aria-label','발음 듣기');sp.onclick=function(){speak(w)};mc.firstChild.appendChild(sp);
  map.appendChild(mc);
  var cols=el('div','mcols');
  [['l','＝ 비슷한 뜻',k.syn,syn],['r','↔ 반대 뜻',k.ant,!syn]].forEach(function(d){
    var col=el('div','mcol '+d[0],'<div class="mh">'+d[1]+(d[3]?'<u>이번 문제</u>':'')+'</div>');
    if(!d[2].length)col.appendChild(el('div','mnone','없음'));

    k.dis.forEach(function(x){rows.appendChild(rvChip(x,'d',st(x),k.pos))});
    dz.appendChild(rows);map.appendChild(dz);
  }

  return c;
}
function retryBad(bad){
  var items=shuf(bad.map(function(it){var w=iw(it),k=w.kan[it.ki];return{di:it.di,wi:it.wi,ki:it.ki,o:opts(k,w.h,it.ki,String(Math.random())),sel:{}}}),'r'+Math.random());
  if(T&&T.tm)clearInterval(T.tm);
  T={mode:'P',inst:false,retry:true,only:false,scope:T.scope,items:items,i:0,done:false,armed:false};

}
function rvShow(tv,E,head,good,bad){
  var n=T.items.length,X=!E&&!T.inst;
  tv.appendChild(el('div','top','<b>'+(E?'시험 결과':'연습 결과')+'</b><span id="rvc"></span>'));

  function fullBtn(){var b=el('button','sub2','처음부터 전체 풀기 (리셋)');b.type='button';b.onclick=function(){sdel(pKey());startPractice(false,T.scope,false)};return b}
  var badW={};bad.forEach(function(it){badW[iw(it).h+'|'+it.di]=1});var rightW={};good.forEach(function(it){var kk=iw(it).h+'|'+it.di;if(!badW[kk])rightW[kk]=it.di});
  var rn=Object.keys(rightW).length;

    var gc=el('div','rvchips ok');good.forEach(function(it){gc.appendChild(el('button','',esc(iw(it).h)))});ce.appendChild(gc)}

  function upd(){
    var i=cur(),last=sl.length-1;

  P.onclick=function(){jump(cur()-1)};N.onclick=function(){jump(cur()+1)};
  dk.addEventListener('scroll',function(){clearTimeout(dk._t);dk._t=setTimeout(upd,60)});

  upd();rvRedraw();setTimeout(rvRedraw,120);
}
function submitT(){ if(!T||T.done)return;if(T.mode=='P'&&!T.only&&T.scope=='day')sdel(T.inst?pKeyI():pKey());
