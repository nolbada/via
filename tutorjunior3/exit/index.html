중요하다)에서 가져옴. avoid, instead, because, nearly는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"6f9330ea6f"}]},{"u":3,"id":"rj3-03-4","no":4,"ko":"아름다운 파란 일몰","items":[{"n":1,"t":"tf","q":"Earth and Mars share the same sun.","ko":"지구와 화성의 태양은 똑같은 하나의 태양이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Although Earth and Mars are different planets, they share the same sun.","비록 지구와 화성은 다른 행성이지만, 그들은 같은 태양을 공유한다."]],"w":"3번 문장에서 지구와 화성이 다른 행성이지만 같은 태양을 공유한다(they share the same sun)고 해요.","c":"T"},"h":"702fbe439a"},{"n":2,"t":"tf","q":"Sunsets on Mars look red and orange.","ko":"화성의 일몰은 빨간색과 주황색으로 보인다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"But sunsets on Mars look very different —they are blue.","하지만 화성의 일몰은 매우 다르게 보인다. 그것은 파란색이다."]],"w":"2번 문장에서 화성의 일몰은 아주 다르게 보이며 파란색이라고 해요. 빨간색과 주황색은 지구의 일몰이에요(1번).","c":"F"},"h":"6f9b68dc0d"},{"n":3,"t":"tf","q":"On Earth, the particles in the air are small.","ko":"지구에서는 공기 중의 입자가 작다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"On Earth, the particles in the air are small.","지구에서는 공기 중의 입자가 작다."]],"w":"9번 문장에 On Earth, the particles in the air are small이 그대로 있어요.","c":"T"},"h":"e94f978daa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Although Earth and Mars are different planets, they share the same sun.)","ko":"비록 지구와 화성은 다른 행성이지만, 그들은 같은 태양을 ( ).","opts":["가린다","떠난다","공유한다","잃는다"],"word":"share","r":{"a":"3) 공유한다","ev":"3번 문장","s":[[3,"Although Earth and Mars are different planets, they share the same sun.","비록 지구와 화성은 다른 행성이지만, 그들은 같은 태양을 공유한다."]],"w":"3번에서 지구와 화성은 서로 다른 행성이지만 하나의 같은 태양을 함께 가져요. share는 '공유하다'예요.","c":3},"h":"3d85e4ee98"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (By the time the light reaches our eyes, blue light is spread everywhere...)","ko":"빛이 우리 눈에 ( ) 무렵에는 푸른 빛은 사방으로 퍼진다.","opts":["떠날","도달할","가릴","만들"],"word":"reaches","r":{"a":"2) 도달할","ev":"6, 10번 문장","s":[[6,"When light travels from the sun to our eyes, it passes through the air in the atmosphere.","빛이 태양에서 우리 눈까지 이동할 때, 이것은 대기 중의 공기를 통과한다."],[10,"By the time the light reaches our eyes, blue light is spread everywhere, and only red light is left.","빛이 우리 눈에 도달할 무렵에는 푸른 빛은 사방으로 퍼지고 붉은 빛만 남겨진다."]],"w":"6번에서 빛은 태양에서 우리 눈까지 이동해요. 10번의 reaches our eyes는 그 빛이 눈에 '도달하다'라는 뜻이에요.","c":2},"h":"e2a8e824bb"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen light travels from the sun to our eyes, it passes through the air in the atmosphere.","ko":"밑줄 친 it이 가리키는 것은?","sko":"빛이 태양에서 우리 눈까지 이동할 때, 이것은 대기 중의 공기를 통과한다.","opts":["태양","우리 눈","대기","빛"],"r":{"a":"4) 빛","ev":"6번 문장","s":[[6,"When light travels from the sun to our eyes, it passes through the air in the atmosphere.","빛이 태양에서 우리 눈까지 이동할 때, 이것은 대기 중의 공기를 통과한다."]],"w":"공기를 통과하는 것은 태양 자체가 아니라 태양에서 우리 눈까지 이동하는 빛(light)이에요. it은 앞의 light를 받아요.","c":4},"h":"6440136a9e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So why are the colors of their sunsets different?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그렇다면 왜 그들의 일몰 색깔은 다를까?","opts":["지구와 화성의 일몰 색이 왜 다른지 묻고 있다.","지구와 화성의 일몰 색이 같다고 말하고 있다.","화성에는 일몰이 없다고 말하고 있다.","일몰 색이 다른 것은 신기한 일이 아니라고 말하고 있다."],"r":{"a":"1) 지구와 화성의 일몰 색이 왜 다른지 묻고 있다.","ev":"4번 문장","s":[[4,"So why are the colors of their sunsets different?","그렇다면 왜 그들의 일몰 색깔은 다를까?"]],"w":"4번 문장 So why are the colors of their sunsets different?은 ‘그렇다면 왜 그들의 일몰 색깔은 다를까?’라는 질문. 지구와 화성의 일몰 색이 다른 이유를 묻는 것.","c":1},"h":"ac97b092c2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["일몰 색이 다른 이유는 두 행성이 서로 다른 태양을 가지고 있기 때문이다.","일몰 색의 차이는 대기에서 비롯된다.","화성의 일몰은 지구처럼 빨간색과 주황색이다.","지구에서 빛은 공기를 전혀 통과하지 않는다."],"opts":["The sunset colors are different because the two planets have different suns.","The difference in sunset colors comes from the atmospheres.","Sunsets on Mars are red and orange like those on Earth.","On Earth, light does not pass through any air."],"r":{"a":"2) The difference in sunset colors comes from the atmospheres. (일몰 색의 차이는 대기에서 비롯된다.)","ev":"5번 문장","s":[[5,"The answer lies in their atmospheres.","정답은 그것들의 대기에 있다."]],"w":"5번 문장 The answer lies in their atmospheres(정답은 그것들의 대기에 있다)와 같은 내용. 두 행성은 같은 태양을 공유하고(3번), 화성의 일몰은 파란색이며(2번), 빛은 대기의 공기를 통과한다(6번).","c":2},"h":"89752955ff"},{"n":9,"t":"sum","q":"On Mars, the air is (A) with (B) particles.","ko":"화성에서는 공기가 (B) 입자로 (A) 있다.","oko":["(A) 가득 차 / (B) 설탕","(A) 비어 / (B) 먼지","(A) 가득 차 / (B) 먼지","(A) 비어 / (B) 설탕","(A) 피곤해 / (B) 먼지"],"opts":["(A) filled / (B) sugar","(A) empty / (B) dust","(A) filled / (B) dust","(A) empty / (B) sugar","(A) tired / (B) dust"],"r":{"a":"3) (A) filled / (B) dust","ev":"11~12번 문장","s":[[11,"Mars has a different kind of air.","화성은 공기의 종류가 다르다."],[12,"It’s filled with larger dust particles.","그것은 더 큰 먼지 입자로 가득 차 있다."]],"w":"11번 Mars has a different kind of air(화성은 공기의 종류가 다르다), 12번 It’s filled with larger dust particles(그것은 더 큰 먼지 입자로 가득 차 있다)에서 가져옴. 그래서 filled와 dust.","c":3},"h":"c41dab5b02"},{"n":10,"t":"fill","q":"These [A] particles make red light spread out, so only blue light can be [B] during a sunset.","ko":"이 [A] 입자들은 붉은 빛을 퍼지게 만들고, 그래서 일몰 시에는 푸른 빛만 [B] 수 있다.","bank":["bigger","seen","everywhere","because","during","although"],"bko":{"bigger":"더 큰","seen":"보인(see의 과거분사)","everywhere":"사방에","because":"~때문에","during":"~동안","although":"비록 ~이지만"},"r":{"a":"[A] bigger (더 큰), [B] seen (보인(see의 과거분사))","ev":"13번 문장","s":[[13,"These bigger particles make red light spread out, so only blue light can be seen during a sunset.","이 더 큰 입자들은 붉은 빛을 퍼지게 만들고, 그래서 일몰 시에는 푸른 빛만 볼 수 있다."]],"w":"13번 These bigger particles make red light spread out, so only blue light can be seen during a sunset(이 더 큰 입자들은 붉은 빛을 퍼지게 만들고, 그래서 일몰 시에는 푸른 빛만 볼 수 있다)에서 가져옴. everywhere, because, during, although는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"90e574c917"}]},{"u":4,"id":"rj3-04-1","no":1,"ko":"마네킹 대신에 사람을!","items":[{"n":1,"t":"tf","q":"In the past, clothes were displayed only on mannequins.","ko":"과거에는 옷이 마네킹에만 전시되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Clothes were displayed only on mannequins.","옷은 마네킹에만 전시되었다."]],"w":"3번 문장에 Clothes were displayed only on mannequins가 그대로 있어요.","c":"T"},"h":"7bc8a8822f"},{"n":2,"t":"tf","q":"Photographers were welcome at the first fashion parades.","ko":"사진작가들은 최초의 패션 퍼레이드에 환영받았다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Photographers weren’t allowed to attend.","사진작가들은 참석하도록 허용되지 않았다."]],"w":"10번 문장에서 사진작가들은 참석하도록 허용되지 않았다(weren't allowed to attend)고 해요. 환영받았다는 말은 반대예요.","c":"F"},"h":"1622f4aac5"},{"n":3,"t":"tf","q":"After World War II, fashion shows became exciting events with larger audiences.","ko":"제2차 세계대전 이후 패션쇼는 더 많은 관객이 있는 흥미로운 행사가 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12~13번 문장","s":[[12,"After World War II, fashion shows began to change.","제2차 세계대전 이후, 패션쇼는 변하기 시작했다."],[13,"Soon they became exciting events with larger audiences.","곧 그것들은 더 많은 관객이 있는 흥미로운 행사가 되었다."]],"w":"12~13번 문장에서 2차 대전 이후 패션쇼가 변하기 시작했고 곧 더 많은 관객이 있는 흥미로운 행사가 되었다고 해요.","c":"T"},"h":"78257fac36"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So he organized events called fashion parades...)","ko":"그래서 그는 패션 퍼레이드라고 불리는 행사를 ( ).","opts":["취소했다","준비했다","방문했다","구경했다"],"word":"organized","r":{"a":"2) 준비했다","ev":"7번 문장","s":[[7,"So he organized events called fashion parades, where models wearing his clothes walked past an audience.","그래서 그는 패션 퍼레이드라고 불리는 행사를 준비했는데, 그곳에서 그의 옷을 입은 모델들이 관객들을 지나서 걸어 돌아다녔다."]],"w":"7번에서 Worth가 fashion parades라는 행사를 직접 만들어 열었어요. organize는 행사를 '준비하다, 조직하다'예요.","c":2},"h":"38e0e89e9e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, there was no music, no fancy stage designs, and no special effects.)","ko":"하지만, 음악도, ( ) 무대 디자인도, 특수 효과도 없었다.","opts":["소박한","화려한","오래된","위험한"],"word":"fancy","r":{"a":"2) 화려한","ev":"8번 문장","s":[[8,"However, there was no music, no fancy stage designs, and no special effects.","하지만, 음악도, 화려한 무대 디자인도, 특수 효과도 없었다."]],"w":"8번에서 처음의 패션 퍼레이드에는 음악도, fancy한 무대 디자인도, 특수 효과도 없었어요. 무대를 꾸미는 말이므로 fancy는 '화려한'이라는 뜻이에요.","c":2},"h":"ed1e75c445"},{"n":6,"t":"ref","q":"What does the underlined \"his\" refer to?\nAn English designer named Charles Frederick Worth decided to show his clothes on real people.","ko":"밑줄 친 his가 가리키는 것은?","sko":"Charles Frederick Worth라는 이름의 영국 디자이너는 실제 사람들에게 그의 옷을 입혀 보여 주기로 결정했다.","opts":["실제 사람들","Charles Frederick Worth","마네킹들","관객들"],"r":{"a":"2) Charles Frederick Worth","ev":"6번 문장","s":[[6,"An English designer named Charles Frederick Worth decided to show his clothes on real people.","Charles Frederick Worth라는 이름의 영국 디자이너는 실제 사람들에게 그의 옷을 입혀 보여 주기로 결정했다."]],"w":"6번 문장 An English designer named Charles Frederick Worth decided to show his clothes…에서 his(그의)는 같은 문장의 주어인 디자이너 Charles Frederick Worth를 가리킴.","c":2,"k":"his = Charles Frederick Worth"},"pron":"his","h":"0f27794f39"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So there was no way to know how the clothes would look on an actual person.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 옷이 실제 사람에게 어떻게 보일지 알 방법이 없었다.","opts":["그래서 옷이 실제 사람에게 어떻게 보일지 알 방법이 없었다.","그래서 사람들은 옷이 어떻게 보이는지 곧바로 알 수 있었다.","그래서 마네킹이 사람보다 옷을 더 잘 입는다는 것을 알았다.","그래서 옷은 실제 사람에게만 어울린다는 것을 알았다."],"r":{"a":"1) 그래서 옷이 실제 사람에게 어떻게 보일지 알 방법이 없었다.","ev":"3~4번 문장","s":[[3,"Clothes were displayed only on mannequins.","옷은 마네킹에만 전시되었다."],[4,"So there was no way to know how the clothes would look on an actual person.","그래서 옷이 실제 사람에게 어떻게 보일지 알 방법이 없었다."]],"w":"no way to know는 '알 방법이 없다'예요. 옷이 마네킹에만 전시되었으니(3번) 실제 사람에게 어떻게 보일지는 알 수 없었다는 뜻이에요.","c":1},"h":"646767e399"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Charles Frederick Worth는 프랑스 디자이너였다.","초기 패션 퍼레이드에는 음악과 특수 효과가 있었다.","패션쇼는 1960년대 파리에서 시작되었다.","초기 패션 퍼레이드는 상점에서 온 구매자들이 있는 작은 모임이었다."],"opts":["Charles Frederick Worth was a French designer.","Early fashion parades had music and special effects.","Fashion shows started in Paris in the 1960s.","Early fashion parades were small gatherings with buyers from stores."],"r":{"a":"4) Early fashion parades were small gatherings with buyers from stores.","ev":"5~6, 8~9번 문장","s":[[5,"That changed in Paris in the 1860s.","그것은 1860년대 파리에서 변했다."],[6,"An English designer named Charles Frederick Worth decided to show his clothes on real people.","Charles Frederick Worth라는 이름의 영국 디자이너는 실제 사람들에게 그의 옷을 입혀 보여 주기로 결정했다."],[8,"However, there was no music, no fancy stage designs, and no special effects.","하지만, 음악도, 화려한 무대 디자인도, 특수 효과도 없었다."],[9,"Instead, they were small, private gatherings, with only buyers from stores in the audience.","대신에 그것들은 상점에서 온 구매자들만 관객에 있는 작고 개인적인 모임이었다."]],"w":"9번에서 초기 패션 퍼레이드는 상점에서 온 구매자들만 관객으로 있는 작은 모임이었어요. Worth는 영국 디자이너이고(6번), 시기는 1860년대이며(5번), 음악도 특수 효과도 없었어요(8번).","c":4},"h":"fd04e97965"},{"n":9,"t":"sum","q":"The designers didn’t want anyone to (A) their (B).","ko":"디자이너들은 누군가 자신들의 (B)을(를) (A) 것을 원하지 않았다.","oko":["(A) 씻는 / (B) 아이디어","(A) 훔치는 / (B) 신발","(A) 훔치는 / (B) 아이디어","(A) 씻는 / (B) 신발","(A) 먹는 / (B) 아이디어"],"opts":["(A) wash / (B) ideas","(A) steal / (B) shoes","(A) steal / (B) ideas","(A) wash / (B) shoes","(A) eat / (B) ideas"],"r":{"a":"3) (A) steal / (B) ideas","ev":"11번 문장","s":[[11,"This was because the designers didn’t want anyone to steal their ideas.","이것은 그 디자이너들이 누군가 자신들의 아이디어를 훔치는 것을 원하지 않았기 때문이다."]],"w":"11번 the designers didn’t want anyone to steal their ideas(디자이너들은 누군가 자신들의 아이디어를 훔치는 것을 원하지 않았다)에서 가져옴. 그래서 steal과 ideas.","c":3},"h":"6cd36d13aa"},{"n":10,"t":"fill","q":"People have been [A] in fashion for [B].","ko":"사람들은 [B] 동안 패션에 [A] 상태로 지내 왔다.","bank":["interested","centuries","attend","instead","soon","allow"],"bko":{"interested":"관심이 있는","centuries":"수 세기","attend":"참석하다","instead":"대신에","soon":"곧","allow":"허락하다"},"r":{"a":"[A] interested (관심이 있는), [B] centuries (수 세기)","ev":"1번 문장","s":[[1,"People have been interested in fashion for centuries.","사람들은 수 세기 동안 패션에 관심을 가져왔다."]],"w":"1번 People have been interested in fashion for centuries(사람들은 수 세기 동안 패션에 관심을 가져왔다)에서 가져옴. attend, instead, soon, allow는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"cab88a98a5"}]},{"u":4,"id":"rj3-04-2","no":2,"ko":"널 꼭 지켜줄게","items":[{"n":1,"t":"tf","q":"The Monuments Men included museum directors and historians.","ko":"모뉴먼츠 맨에는 박물관장과 역사가들이 포함되어 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They were museum directors, historians, artists, and architects.","그들은 박물관장과 역사가, 예술가, 건축가들이었다."]],"w":"4번 문장에서 그들은 박물관장과 역사가, 예술가, 건축가들이었다고 해요.","c":"T"},"h":"44973dabcb"},{"n":2,"t":"tf","q":"The members had received basic military training before they entered war zones.","ko":"구성원들은 전쟁 지역에 들어가기 전에 기본적인 군사 훈련을 받았었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Although they had never received basic military training, they entered dangerous war zones and performed their duties.","비록 그들은 결코 기본적인 군사 훈련을 받은 적이 없었지만, 위험한 전쟁 지역들에 들어가서 그들의 임무를 수행했다."]],"w":"5번 문장에서 그들은 기본적인 군사 훈련을 받은 적이 없었다(had never received)고 해요.","c":"F"},"h":"ebef49107f"},{"n":3,"t":"tf","q":"Many of the members continued to preserve important works after returning from the war.","ko":"많은 구성원들은 전쟁에서 돌아온 후에도 중요한 작품들을 계속 지켰다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Even after returning from the war, many of the members continued to preserve important works.","심지어 전쟁에서 돌아온 후에도, 구성원 중 많은 이들이 중요한 작품들을 계속 지켰다."]],"w":"10번 문장에서 전쟁에서 돌아온 후에도 구성원 중 많은 이들이 중요한 작품들을 계속 지켰다고 해요.","c":"T"},"h":"d61ca477ca"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It was World War II, and many European cities were being destroyed.)","ko":"제2차 세계대전 때였고, 많은 유럽의 도시들이 ( ) 있었다.","opts":["건설되고","파괴되고","보호되고","방문되고"],"word":"destroyed","r":{"a":"2) 파괴되고","ev":"1~2번 문장","s":[[1,"It was World War II, and many European cities were being destroyed.","제2차 세계대전 때였고, 많은 유럽의 도시들이 파괴되고 있었다."],[2,"Many buildings and artwork that had great artistic and historic value were being destroyed, too.","훌륭한 예술적, 역사적 가치를 지닌 많은 건축물과 예술품 또한 파괴되고 있었다."]],"w":"1번의 many European cities were being destroyed에서 전쟁 때문에 도시가 부서지고 있었어요. 2번에서 건물과 예술품도(too) 같은 일을 겪어요. destroy는 '파괴하다'예요.","c":2},"h":"b6ef72bcad"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, their belief was strong.)","ko":"하지만, 그들의 ( )은 확고했다.","opts":["신념","건강","기억","계획"],"word":"belief","r":{"a":"1) 신념","ev":"6~7번 문장","s":[[6,"Many group members were hurt and others were even killed.","많은 단체 구성원들이 다쳤고 다른 이들은 심지어 죽었다."],[7,"However, their belief was strong.","하지만, 그들의 신념은 확고했다."]],"w":"6번에서 많은 구성원이 다치거나 죽었는데도 7번에서 However로 그들의 belief는 strong했다고 해요. 어려운 일에도 흔들리지 않는 마음, '신념'이에요.","c":1},"h":"d5bb3cc63c"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\n“Cultural assets are the evidence that we have existed and developed,” a group member said. He continued, “If these things are destroyed, it will be like we never existed.”","ko":"밑줄 친 He가 가리키는 것은?","sko":"“문화재는 우리가 존재해 왔고 발전해 왔다는 증거이다.”라고 한 단체 구성원이 말했다. 그는 계속해서 “만약 이러한 것들이 파괴된다면, 그것은 우리가 결코 존재하지 않았던 것과 같을 것이다.”라고 말했다.","opts":["적군의 지휘관","한 단체 구성원","역사가들","전쟁에서 다친 시민"],"r":{"a":"2) 한 단체 구성원","ev":"8~9번 문장","s":[[8,"“Cultural assets are the evidence that we have existed and developed,” a group member said.","“문화재는 우리가 존재해 왔고 발전해 왔다는 증거이다.”라고 한 단체 구성원이 말했다."],[9,"He continued, “If these things are destroyed, it will be like we never existed.”","그는 계속해서 “만약 이러한 것들이 파괴된다면, 그것은 우리가 결코 존재하지 않았던 것과 같을 것이다.”라고 말했다."]],"w":"8번 문장에서 a group member said(한 단체 구성원이 말했다)라고 했고, 9번 He continued(그는 계속해서 말했다)의 He는 그 구성원을 가리킴.","c":2,"k":"He = 한 단체 구성원"},"pron":"He","h":"890d633d1c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"“Cultural assets are the evidence that we have existed and developed,” a group member said.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"“문화재는 우리가 존재해 왔고 발전해 왔다는 증거이다.”라고 한 단체 구성원이 말했다.","opts":["문화재는 우리가 존재해 왔고 발전해 왔다는 증거라고 말했다.","문화재는 새로 만들어야 한다고 말했다.","문화재는 전쟁에서 이겼다는 증거라고 말했다.","문화재가 우리를 발전시킨 적은 없다고 말했다."],"r":{"a":"1) 문화재는 우리가 존재해 왔고 발전해 왔다는 증거라고 말했다.","ev":"8번 문장","s":[[8,"“Cultural assets are the evidence that we have existed and developed,” a group member said.","“문화재는 우리가 존재해 왔고 발전해 왔다는 증거이다.”라고 한 단체 구성원이 말했다."]],"w":"8번 문장 Cultural assets are the evidence that we have existed and developed(문화재는 우리가 존재해 왔고 발전해 왔다는 증거이다)라고 한 단체 구성원이 말했음.","c":1},"h":"7b6d115e91"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 단체는 100명보다 적은 사람들로 이루어졌다.","모뉴먼츠 맨은 문화적 가치가 큰 많은 물품을 구했다.","모뉴먼츠 맨은 모두 훈련받은 군인들이었다.","구성원들은 전쟁이 끝나자 일을 그만두었다."],"opts":["The group had fewer than 100 members.","The Monuments Men saved many items of great cultural value.","The Monuments Men were all trained soldiers.","The members stopped their work when the war ended."],"r":{"a":"2) The Monuments Men saved many items of great cultural value. (모뉴먼츠 맨은 문화적 가치가 큰 많은 물품을 구했다.)","ev":"11번 문장","s":[[11,"Thanks to the Monuments Men, many items of great cultural value were saved.","모뉴먼츠 맨 덕분에, 훌륭한 문화적 가치를 가진 많은 물품들이 구해졌다."]],"w":"11번 문장 many items of great cultural value were saved(문화적 가치가 큰 많은 물품들이 구해졌다)와 같은 내용. 단체는 300명 이상이었고(3번), 기본적인 군사 훈련을 받은 적이 없었으며(5번), 전쟁에서 돌아온 후에도 일을 계속했다(10번).","c":2},"h":"03fa77247c"},{"n":9,"t":"sum","q":"In dangerous war zones, many Monuments Men were (A) and others were even (B).","ko":"위험한 전쟁 지역에서 많은 모뉴먼츠 맨이 (A) 다른 이들은 심지어 (B).","oko":["(A) 다쳤고 / (B) 초대받았다","(A) 부유했고 / (B) 죽었다","(A) 다쳤고 / (B) 죽었다","(A) 부유했고 / (B) 초대받았다","(A) 다쳤고 / (B) 결혼했다"],"opts":["(A) hurt / (B) invited","(A) rich / (B) killed","(A) hurt / (B) killed","(A) rich / (B) invited","(A) hurt / (B) married"],"r":{"a":"3) (A) hurt / (B) killed","ev":"6번 문장","s":[[6,"Many group members were hurt and others were even killed.","많은 단체 구성원들이 다쳤고 다른 이들은 심지어 죽었다."]],"w":"6번 Many group members were hurt and others were even killed(많은 구성원들이 다쳤고 다른 이들은 심지어 죽었다)에서 가져옴. 그래서 hurt와 killed.","c":3},"h":"07270c3ba5"},{"n":10,"t":"fill","q":"So, the Monuments Men, a group of more than 300 people, was [A] to [B] these items.","ko":"그래서, 300명 이상의 사람들의 단체인 모뉴먼츠 맨은 이 물품들을 [B] 위해 [A].","bank":["formed","protect","training","duties","military","evidence"],"bko":{"formed":"결성된(form의 과거분사)","protect":"보호하다","training":"훈련","duties":"임무들","military":"군사의","evidence":"증거"},"r":{"a":"[A] formed (결성된(form의 과거분사)), [B] protect (보호하다)","ev":"3번 문장","s":[[3,"So, the Monuments Men, a group of more than 300 people, was formed to protect these items.","그래서, 300명 이상의 사람들의 단체인 모뉴먼츠 맨이 이러한 물품들을 보호하기 위해 결성되었다."]],"w":"3번 the Monuments Men, a group of more than 300 people, was formed to protect these items(300명 이상의 단체인 모뉴먼츠 맨이 이 물품들을 보호하기 위해 결성되었다)에서 가져옴. training, duties, military, evidence는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"cc963b6c1e"}]},{"u":4,"id":"rj3-04-3","no":3,"ko":"바다 위 패셔니스타","items":[{"n":1,"t":"tf","q":"The Guernsey sweater is also known as a fisherman’s sweater.","ko":"건지 스웨터는 어부의 스웨터로도 알려져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"The Guernsey sweater, also known as a fisherman’s sweater, is a good fashion choice for winter.","어부의 스웨터라고도 알려진 건지(Guernsey) 스웨터는 겨울에 좋은 패션 선택이다."]],"w":"1번 문장에서 건지 스웨터가 어부의 스웨터라고도 알려져 있다(also known as a fisherman’s sweater)고 해요.","c":"T"},"h":"7fb51a4a9b"},{"n":2,"t":"tf","q":"Guernsey sweaters were made by machines.","ko":"건지 스웨터는 기계로 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Local fishermen wore these sweaters, which were hand-knitted.","현지 어부들은 이 스웨터들을 입었는데, 그것들은 손으로 짜였다."]],"w":"5번 문장에서 이 스웨터들은 손으로 짜였다(hand-knitted)고 해요. 기계로 만들었다는 말은 아니에요.","c":"F"},"h":"9941db5051"},{"n":3,"t":"tf","q":"Traditionally, each family had its own unique pattern on the sweater.","ko":"전통적으로, 각 일가는 스웨터에 자신들만의 독특한 무늬를 지녔다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Traditionally, each family had its own unique pattern.","전통적으로, 각 일가는 그들 자신만의 독특한 무늬를 지녔다."]],"w":"10번 문장에서 전통적으로 각 일가가 자신만의 독특한 무늬를 지녔다고 해요.","c":"T"},"h":"88e8e95879"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The Guernsey sweater was perfect for them because it was waterproof thanks to its coated wool.)","ko":"건지 스웨터는 코팅된 양털 덕분에 ( )였기 때문에 그들에게 안성맞춤이었다.","opts":["물이 스며들지 않는","가벼운","비싼","낡은"],"word":"waterproof","r":{"a":"1) 물이 스며들지 않는","ev":"7~8번 문장","s":[[7,"They also had to be protected from the cold water splashing across their boats.","그들은 또한 그들의 배 사방으로 튀는 차가운 물로부터 보호되어야 했다."],[8,"The Guernsey sweater was perfect for them because it was waterproof thanks to its coated wool.","건지 스웨터는 그것의 코팅된 양털 덕분에 방수되었기 때문에 그들에게 안성맞춤이었다."]],"w":"7번에서 어부들은 배 사방으로 튀는 차가운 물로부터 보호되어야 했어요. 8번의 waterproof는 코팅된 양털 덕분에 물이 스며들지 않는다는 뜻의 '방수의'예요.","c":1},"h":"0dbc699b47"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fishing was more dangerous in the past.)","ko":"어업은 과거에 더 ( ) 일이었다.","opts":["쉬운","위험한","지루한","조용한"],"word":"dangerous","r":{"a":"2) 위험한","ev":"12번 문장","s":[[12,"Fishing was more dangerous in the past.","어업은 과거에 더 위험했다."]],"w":"12번에서 과거의 어업이 더 dangerous했다고 해요. 그래서 13번처럼 시신이 해변으로 밀려오는 일도 있었어요. dangerous는 '위험한'이에요.","c":2},"h":"58c4f06242"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSince the fishermen worked on boats year round, they needed clothes that were both warm and comfortable.","ko":"밑줄 친 they가 가리키는 것은?","sko":"어부들은 일 년 내내 배에서 일했기 때문에, 그들은 따뜻하고도 편한 옷이 필요했다.","opts":["스웨터들","배들","어부들","각 일가들"],"r":{"a":"3) 어부들","ev":"6번 문장","s":[[6,"Since the fishermen worked on boats year round, they needed clothes that were both warm and comfortable.","어부들은 일 년 내내 배에서 일했기 때문에, 그들은 따뜻하고도 편한 옷이 필요했다."]],"w":"6번 문장 Since the fishermen worked on boats year round, they needed clothes…에서 they는 같은 문장의 앞부분 주어인 the fishermen(어부들)을 가리킴.","c":3,"k":"they = 어부들"},"pron":"they","h":"94491ec098"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They also had to be protected from the cold water splashing across their boats.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 또한 그들의 배 사방으로 튀는 차가운 물로부터 보호되어야 했다.","opts":["그들은 차가운 물을 배 위로 던져야 했다.","그들은 배를 차가운 물에서 지켜야 했다.","그들은 배 사방으로 튀는 차가운 물로부터 보호되어야 했다.","그들은 보호받기 위해 배를 떠나야 했다."],"r":{"a":"3) 그들은 배 사방으로 튀는 차가운 물로부터 보호되어야 했다.","ev":"7번 문장","s":[[7,"They also had to be protected from the cold water splashing across their boats.","그들은 또한 그들의 배 사방으로 튀는 차가운 물로부터 보호되어야 했다."]],"w":"had to be protected는 '보호되어야 했다'(수동)예요. 보호받는 것은 배가 아니라 어부들이고, 막아야 할 것은 배 사방으로 튀는 차가운 물이에요.","c":3},"h":"6089705947"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["어부들은 겨울에만 배에서 일했다.","건지 스웨터는 파리에서 처음 만들어졌다.","어부의 시신이 해변으로 밀려오면 스웨터가 사람들이 그의 신원을 확인하는 것을 도울 수 있었다.","어부들은 배에서 건지 스웨터를 입지 않았다."],"opts":["Fishermen worked on boats only in winter.","The Guernsey sweater was invented in Paris.","A fisherman’s sweater could help people identify him if his body washed onto the shore.","Fishermen did not wear Guernsey sweaters on boats."],"r":{"a":"3) A fisherman’s sweater could help people identify him if his body washed onto the shore. (어부의 시신이 해변으로 밀려오면 스웨터가 사람들이 그의 신원을 확인하는 것을 도울 수 있었다.)","ev":"13번 문장","s":[[13,"If a fisherman’s dead body washed onto the shore, his sweater would help people identify him.","만약 어부의 시체가 해변으로 밀려왔다면, 그의 스웨터가 사람들이 그의 신원을 확인하는 것을 도울 것이었다."]],"w":"13번 문장 his sweater would help people identify him(그의 스웨터가 사람들이 그의 신원을 확인하는 것을 도울 것이었다)과 같은 내용. 어부들은 일 년 내내 일했고(6번), 스웨터는 건지섬 이름에서 왔고(4번), 어부들이 입었다(5번)고 했으니 나머지는 틀림.","c":3},"h":"70b58f3ef1"},{"n":9,"t":"sum","q":"The sweater got its (A) from the British (B) of Guernsey.","ko":"그 스웨터는 영국의 건지 (B)에서 그것의 (A)을(를) 얻었다.","oko":["(A) 이름 / (B) 호수","(A) 가격 / (B) 섬","(A) 이름 / (B) 섬","(A) 가격 / (B) 호수","(A) 냄새 / (B) 섬"],"opts":["(A) name / (B) lake","(A) price / (B) island","(A) name / (B) island","(A) price / (B) lake","(A) smell / (B) island"],"r":{"a":"3) (A) name / (B) island","ev":"4번 문장","s":[[4,"It got its name from the British island of Guernsey.","그것은 영국의 건지섬으로부터 그것의 이름을 얻었다."]],"w":"4번 It got its name from the British island of Guernsey(그것은 영국의 건지섬으로부터 이름을 얻었다)에서 가져옴. 그래서 name과 island.","c":3},"h":"d25e0575e8"},{"n":10,"t":"fill","q":"The sweater played [A] [B], too.","ko":"그 스웨터는 [A] [B]도 했다.","bank":["another","role","traditiona d to the audience and walked away!","그 후에, 그는 청중에게 고개 숙여 인사하고 걸어나가 버렸다!"]],"w":"3번에서 피아니스트는 연주(4분 33초)가 끝난 뒤 청중에게 bowed하고 걸어나갔어요. 공연 후에 하는 행동으로, 고개를 숙여 '인사하다'예요.","c":2},"h":"b3e4239aa1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, others were impressed because they understood what Cage wanted to tell them.)","ko":"하지만, 다른 사람들은 Cage가 그들에게 말하기 원했던 것을 이해했기 때문에 ( ).","opts":["감명 받았다","화가 났다","지루했다","겁먹었다"],"word":"impressed","r":{"a":"1) 감명 받았다","ev":"7~8번 문장","s":[[7,"To some people, it seemed something had gone wrong.","어떤 사람들에게는, 무언가 잘못된 것처럼 보였다."],[8,"However, others were impressed because they understood what Cage wanted to tell them.","하지만, 다른 사람들은 Cage가 그들에게 말하기 원했던 것을 이해했기 때문에 감명 받았다."]],"w":"7번에서 일부는 뭔가 잘못된 것 같다고 느꼈지만, 8번의 However 뒤 다른 사람들은 Cage의 뜻을 이해했어요. 그래서 impressed는 '감명 받았다'예요.","c":1},"h":"3c8845d3a8"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nHe wanted the audience to hear these sounds. By having the musician play nothing, he let them do so.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그는 청중이 이러한 소리들을 듣기를 원했다. 음악가가 아무것도 연주하지 않게 함으로써, 그는 그들이 그렇게 하게 했다.","opts":["음악가들","소리들","작곡가","청중"],"r":{"a":"4) 청중","ev":"10~11번 문장","s":[[10,"He wanted the audience to hear these sounds.","그는 청중이 이러한 소리들을 듣기를 원했다."],[11,"By having the musician play nothing, he let them do so.","음악가가 아무것도 연주하지 않게 함으로써, 그는 그들이 그렇게 하게 했다."]],"w":"10번 문장에서 He wanted the audience to hear these sounds(그는 청중이 이 소리들을 듣기를 원했다)라고 했고, 11번 he let them do so의 them은 그 청중을 가리킴.","c":4,"k":"them = 청중"},"pron":"them","h":"5a0cce39cc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Nowadays 4ʹ33ʹʹ is famous for challenging the way people think about music.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘날 <4분 33초>는 사람들이 음악에 대해 생각하는 방식에 도전하는 것으로 유명하다.","opts":["오늘날 <4분 33초>는 사람들이 음악을 쉽게 외울 수 있어서 유명하다.","오늘날 <4분 33초>는 사람들이 음악을 생각하지 못하게 해서 유명하다.","오늘날 <4분 33초>는 사람들이 음악에 대해 생각하는 방식에 도전해서 유명하다.","오늘날 <4분 33초>는 사람들의 생각을 그대로 따라서 유명하다."],"r":{"a":" / (B) never","(A) discover / (B) please","(A) forget / (B) never","(A) lose / (B) please"],"r":{"a":"3) (A) discover / (B) please","ev":"10번 문장","s":[[10,"If you discover the phrase’s true origin, please spill the beans!","만약 당신이 이 문구의 실제 기원을 발견한다면, 제발 콩을 쏟아라!"]],"w":"10번 If you discover the phrase’s true origin, please spill the beans!(이 문구의 실제 기원을 발견한다면, 제발 콩을 쏟아라!)에서 가져옴. 그래서 discover와 please.","c":3},"h":"3917c8bce5"},{"n":10,"t":"fill","q":"Have you ever [A] information that was supposed to be kept [B]?","ko":"당신은 [B](으)로 유지되어야 할 정보를 [A] 적이 있는가?","bank":["revealed","secret","remember","vote","refers","floor"],"bko":{"revealed":"공개했다(reveal의 과거분사)","secret":"비밀","remember":"기억하다","vote":"투표하다","refers":"가리키다(refer의 3인칭 단수형)","floor":"바닥"},"r":{"a":"[A] revealed (공개했다(reveal의 과거분사)), [B] secret (비밀)","ev":"1번 문장","s":[[1,"Have you ever revealed information that was supposed to be kept secret?","비밀로 유지되어야 할 정보를 공개한 적이 있는가?"]],"w":"1번 Have you ever revealed information that was supposed to be kept secret?(비밀로 유지되어야 할 정보를 공개한 적이 있는가?)에서 가져옴. remember, vote, refers, floor는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"2fa536ecaf"}]},{"u":5,"id":"rj3-05-2","no":2,"ko":"있을 때 잘해","items":[{"n":1,"t":"tf","q":"Kairos has long hair on the front of his head.","ko":"카이로스는 머리 앞쪽에 긴 머리카락이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"He has long hair on the front of his head, yet the back of his head is completely bald.","그는 그의 머리 앞쪽에 긴 머리카락을 가지고 있지만, 그의 머리 뒤쪽은 완전히 대머리이다."]],"w":"4번 문장에서 머리 앞쪽에는 긴 머리카락이 있고 뒤쪽은 대머리라고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"bf29613523"},{"n":2,"t":"tf","q":"Kairos has wings on his hands.","ko":"카이로스는 손에 날개가 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"You may also notice that he has wings on his feet.","당신은 또한 그가 그의 발에 날개들을 가진 것을 알아챌지도 모른다."]],"w":"7번 문장에서 날개는 손이 아니라 발(feet)에 있어요. 그래서 틀린 진술이에요.","c":"F"},"h":"c52ca398c7"},{"n":3,"t":"tf","q":"Kairos’s appearance teaches you to grab an opportunity right away.","ko":"카이로스의 모습은 기회를 즉시 잡으라고 가르쳐 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"His appearance teaches you what to do when an opportunity is in front of you.","그의 외모는 기회가 당신의 앞에 있을 때 무엇을 해야 할지 당신에게 가르쳐 준다."],[10,"You need to grab it right away.","당신은 그것을 즉시 잡을 필요가 있다."]],"w":"9번에서 그의 외모가 기회가 눈앞에 있을 때 무엇을 해야 할지 가르쳐 주고, 10번에서 그것을 즉시 잡을 필요가 있다고 해요.","c":"T"},"h":"3491ffc1f3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He has long hair on the front of his head, yet the back of his head is completely bald.)","ko":"그는 머리 앞쪽에 긴 머리카락을 가지고 있지만, 머리 뒤쪽은 완전히 ( ).","opts":["털이 많은","대머리인","곱슬거리는","검은색인"],"word":"bald","r":{"a":"2) 대머리인","ev":"4번 문장","s":[[4,"He has long hair on the front of his head, yet the back of his head is completely bald.","그는 그의 머리 앞쪽에 긴 머리카락을 가지고 있지만, 그의 머리 뒤쪽은 완전히 대머리이다."]],"w":"yet(하지만)으로 앞쪽의 긴 머리카락과 반대되는 말이 이어져요. 5~6번에서 지나가면 붙잡을 것이 없다고 하므로 bald는 머리카락이 없는 ‘대머리의’예요.","c":2},"h":"81fcb1c930"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, once he passes, there is nothing to hold on to.)","ko":"하지만, 일단 그가 지나가면, ( ) 것이 아무것도 없다.","opts":["던질","놓아 줄","붙잡을","세울"],"word":"hold on to","r":{"a":"3) 붙잡을","ev":"5~6번 문장","s":[[5,"So, when he approaches, you can easily catch him by grabbing his long hair.","그러므로, 그가 다가올 때, 당신은 그의 긴 머리카락을 붙잡음으로써 쉽게 그를 잡을 수 있다."],[6,"However, once he passes, there is nothing to hold on to.","하지만, 일단 그가 지나가면, 붙잡을 것이 아무것도 없다."]],"w":"5번에서 다가올 때는 긴 앞머리를 잡을 수 있다고 했어요. 6번은 지나가고 나면 그것이 없다는 말이라 hold on to는 ‘~을 꼭 붙잡다’예요.","c":3},"h":"389fcfb24b"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nYou can see a man with an unusual hairstyle. That is Kairos, the god of opportunity in Greek myths.","ko":"밑줄 친 That이 가리키는 것은?","sko":"당신은 특이한 머리 모양을 가진 한 남자를 볼 수 있다. 그것은 그리스 신화 속 기회의 신인 카이로스이다.","opts":["그림","특이한 머리 모양을 가진 남자","기회","그리스 신화"],"r":{"a":"2) 특이한 머리 모양을 가진 남자","ev":"2~3번 문장","s":[[2,"You can see a man with an unusual hairstyle.","당신은 특이한 머리 모양을 가진 한 남자를 볼 수 있다."],[3,"That is Kairos, the god of opportunity in Greek myths.","그것은 그리스 신화 속 기회의 신인 카이로스이다."]],"w":"2번 문장에서 특이한 머리 모양을 가진 남자를 볼 수 있다고 했고, 3번 That is Kairos…의 That(그것)은 그 남자를 가리킴.","c":2,"k":"That = 특이한 머리 모양을 가진 남자"},"pron":"That","h":"99bdda611e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This may seem difficult or dangerous.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 어렵거나 위험하게 보일지도 모른다.","opts":["이것은 쉽고 안전하게 보일 것이다.","이것은 어렵고 위험하다고 증명되었다.","이것은 어렵거나 위험하게 보일지도 모른다.","이것은 어렵지도 위험하지도 않을 것이다."],"r":{"a":"3) 이것은 어렵거나 위험하게 보일지도 모른다.","ev":"11번 문장","s":[[11,"This may seem difficult or dangerous.","이것은 어렵거나 위험하게 보일지도 모른다."]],"w":"may는 '~일지도 모른다', seem difficult or dangerous는 '어렵거나 위험하게 보이다'예요. This는 10번의 '기회를 즉시 잡는 것'을 가리켜요.","c":3},"h":"4f12f4c2b2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["카이로스는 머리 뒤쪽에 머리카락이 많다.","카이로스의 날개는 그가 매우 빠르게 오간다는 뜻이다.","카이로스는 지나간 뒤에도 사람들 곁에 오래 머문다.","카이로스는 그리스 신화에서 불의 신이다."],"opts":["Kairos has a lot of hair on the back of his head.","The wings mean that Kairos comes and goes very quickly.","Kairos stays with people for a long time after he passes.","Kairos is the god of fire in Greek myths."],"r":{"a":"2) The wings mean that Kairos comes and goes very quickly. (카이로스의 날개는 그가 매우 빠르게 오간다는 뜻이다.)","ev":"7~8번 문장","s":[[7,"You may also notice that he has wings on his feet.","당신은 또한 그가 그의 발에 날개들을 가진 것을 알아챌지도 모른다."],[8,"This means he comes and goes very quickly.","이는 그가 매우 빠르게 오간다는 것을 의미한다."]],"w":"8번 문장 This means he comes and goes very quickly(이는 그가 매우 빠르게 오간다는 것을 의미한다)와 같은 내용. 뒤쪽은 대머리이고(4번), 지나가면 붙잡을 것이 없으며(6번), 기회의 신이다(3번).","c":2},"h":"2c0da12bc0"},{"n":9,"t":"sum","q":"If you are (A) and (B) even for a moment, an opportunity will pass you by.","ko":"당신이 (A) 잠깐이라도 (B) 기회는 당신을 지나쳐 갈 것이다.","oko":["(A) 배고프고 / (B) 망설이면","(A) 두려워하고 / (B) 서두르면","(A) 두려워하고 / (B) 망설이면","(A) 배고프고 / (B) 서두르면","(A) 키가 크고 / (B) 망설이면"],"opts":["(A) hungry / (B) hesitate","(A) afraid / (B) hurry","(A) afraid / (B) hesitate","(A) hungry / (B) hurry","(A) tall / (B) hesitate"],"r":{"a":"3) (A) afraid / (B) hesitate","ev":"12번 문장","s":[[12,"However, if you are afraid and hesitate even for a moment, it will pass you by and fly away.","하지만, 만약 당신이 두려워하고 잠깐이라도 망설인다면, 그것은 당신을 지나서 날아가 버릴 것이다."]],"w":"12번 if you are afraid and hesitate even for a moment, it will pass you by(두려워하고 잠깐이라도 망설인다면 그것은 당신을 지나쳐 갈 것이다)에서 가져옴. 그래서 afraid와 hesitate.","c":3},"h":"b22537bda8"},{"n":10,"t":"fill","q":"So, when he [A], you can easily [B] him by grabbing his long hair.","ko":"그러므로, 그가 [A] 때, 당신은 그의 긴 머리카락을 움켜쥠으로써 쉽게 그를 [B] 수 있다.","bank":["approaches","catch","completely","unusual","front","once"],"bko":{"approaches":"다가오다(approach의 3인칭 단수형)","catch":"잡다","completely":"완전히","unusual":"특이한","front":"앞쪽","once":"일단"},"r":{"a":"[A] approaches (다가오다(approach의 3인칭 단수형)), [B] catch (잡다)","ev":"5번 문장","s":[[5,"So, when he approaches, you can easily catch him by grabbing his long hair.","그러므로, 그가 다가올 때, 당신은 그의 긴 머리카락을 붙잡음으로써 쉽게 그를 잡을 수 있다."]],"w":"5번 So, when he approaches, you can easily catch him by grabbing his long hair(그가 다가올 때, 긴 머리카락을 붙잡아 쉽게 그를 잡을 수 있다)에서 가져옴. completely, unusual, front, once는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"c9b7769db9"}]},{"u":5,"id":"rj3-05-3","no":3,"ko":"바닐라 비하인드 스토리","items":[{"n":1,"t":"tf","q":"Vanilla fruit only grew in and around Mexico.","ko":"바닐라 열매는 멕시코와 그 주변에서만 자랐다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"This was because vanilla fruit only grew in and around Mexico.","이는 바닐라 열매가 멕시코와 그 주변에서만 자랐기 때문이었다."]],"w":"2번 문장에 vanilla fruit only grew in and around Mexico라고 나와요. 본문과 같은 내용이에요.","c":"T"},"h":"7807278a2f"},{"n":2,"t":"tf","q":"The farmer’s vanilla plants grew a lot of fruit.","ko":"농장주의 바닐라 식물들은 많은 열매를 맺었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"However, they never grew any fruit.","하지만, 그것들은 결코 어떤 열매도 맺지 않았다."]],"w":"8번 문장에서 그 식물들은 결코 어떤 열매도 맺지 않았다(never grew any fruit)고 해요. 많이 맺었다는 말은 반대예요.","c":"F"},"h":"3e2794b63a"},{"n":3,"t":"tf","q":"The farmer noticed a fruit on one of the plants one day.","ko":"어느 날 농장주는 식물들 중 한 그루에서 열매 하나를 알아챘다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"One day, the farmer noticed a fruit on one of the plants.","어느 날, 그 농장주는 식물들 중 한 그루에서 열매 하나를 알아챘다."]],"w":"9번 문장에 One day, the farmer noticed a fruit on one of the plants라고 그대로 나와요.","c":"T"},"h":"bc86734159"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many people brought vanilla plants to their own countries, but no insects pollinated them.)","ko":"많은 사람들이 바닐라 식물을 자신의 나라로 들여왔지만, 어떤 곤충도 그것들을 ( ) 않았다.","opts":["먹지","수분시키지","옮겨 심지","죽이지"],"word":"pollinated","r":{"a":"2) 수분시키지","ev":"3~4번 문장","s":[[3,"Many people brought vanilla plants to their own countries, but no insects pollinated them.","많은 사람들이 바닐라 식물을 자신의 나라로 들여왔지만, 어떤 곤충도 그것들을 수분시키지 않았다."],[4,"Scientists tried to find a solution to this problem, but they all failed.","과학자들은 이 문제에 대한 해결책을 찾으려고 노력했지만, 그들은 모두 실패했다."]],"w":"3번에서 식물을 들여왔지만 곤충이 pollinated하지 않았다고 해요. 4번에서 이것이 문제가 되어 해결책을 찾으려 했고, 5번에서 ‘수분시키는 방법’을 발명해요. pollinate = 수분시키다예요.","c":2},"h":"ec64097e60"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Amazed, the farmer made Albius share the method with others.)","ko":"( ) 농장주는 Albius가 그 방법을 다른 사람들과 공유하도록 했다.","opts":["놀란","화가 난","지친","부끄러운"],"word":"Amazed","r":{"a":"1) 놀란","ev":"10~11번 문장","s":[[10,"Albius proudly explained that he had pollinated it using his thumb and a stick.","Albius는 그가 그의 엄지손가락과 막대기를 사용하여 그것을 수분시켰었다고 자랑스럽게 설명했다."],[11,"Amazed, the farmer made Albius share the method with others.","농장주는 놀라워하며, Albius가 그 방법을 다른 사람들과 공유하도록 했다."]],"w":"10번에서 열매가 맺힌 이유가 Albius의 방법임을 알게 돼요. 그래서 농장주는 놀라서(Amazed) 그 방법을 다른 사람들과 공유하게 했어요.","c":1},"h":"9e65a5172e"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nScientists tried to find a solution to this problem, but they all failed.","ko":"밑줄 친 they가 가리키는 것은?","sko":"과학자들은 이 문제에 대한 해결책을 찾으려고 노력했지만, 그들은 모두 실패했다.","opts":["곤충들","과학자들","사람들","식물들"],"r":{"a":"2) 과학자들","ev":"4번 문장","s":[[4,"Scientists tried to find a solution to this problem, but they all failed.","과학자들은 이 문제에 대한 해결책을 찾으려고 노력했지만, 그들은 모두 실패했다."]],"w":"4번 문장 Scientists tried to find a solution…, but they all failed에서 they는 같은 문장의 앞부분 주어인 Scientists(과학자들)를 가리킴.","c":2,"k":"they = 과학자들"},"pron":"they","h":"9be5637f15"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without Albius, delicious chocolate, ice cream, and cola would be too expensive to buy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Albius가 없었다면, 맛있는 초콜릿과 아이스크림, 콜라는 너무 비싸서 살 수 없을 것이다.","opts":["Albius 덕분에 초콜릿, 아이스크림, 콜라가 더 비싸졌다.","Albius가 없어도 초콜릿, 아이스크림, 콜라는 싸게 살 수 있다.","초콜릿, 아이스크림, 콜라가 맛있어서 Albius가 사 먹었다.","Albius가 없었다면 초콜릿, 아이스크림, 콜라는 너무 비싸서 살 수 없을 것이다."],"r":{"a":"4) Albius가 없었다면 초콜릿, 아이스크림, 콜라는 너무 비싸서 살 수 없을 것이다.","ev":"13번 문장","s":[[13,"Without Albius, delicious chocolate, ice cream, and cola would be too expensive to buy.","만약 Albius가 없었다면, 맛있는 초콜릿과 아이스크림, 콜라는 너무 비싸서 살 수 없을 것이다."]],"w":"Without Albius는 ‘Albius가 없었다면’이고, too expensive to buy는 ‘너무 비싸서 살 수 없다’예요. 즉 Albius의 방법 덕분에 바닐라가 싸졌다는 뜻이에요.","c":4},"h":"b22af268f9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["바닐라는 처음부터 전 세계에서 자랐다.","과학자들은 바닐라 식물의 문제를 쉽게 해결했다.","Albius의 방법 덕분에 바닐라는 세계적으로 흔해졌다.","농장주는 다른 사람들이 그 방법을 알기를 원하지 않았다."],"opts":["Vanilla grew all over the world from the beginning.","Scientists easily solved the problem with vanilla plants.","Vanilla became common around the world thanks to Albius’s method.","The farmer did not want others to know the method."],"r":{"a":"3) Vanilla became common around the world thanks to Albius’s method. (Albius의 방법 덕분에 바닐라는 세계적으로 흔해졌다.)","ev":"12번 문장","s":[[12,"Eventually, thanks to Albius’s method, vanilla became common around the world.","결국, Albius의 방법 덕분에, 바닐라는 세계적으로 흔해졌다."]],"w":"12번 문장 thanks to Albius’s method, vanilla became common around the world(Albius의 방법 덕분에 바닐라는 세계적으로 흔해졌다)와 같은 내용. 바닐라는 멕시코 주변에서만 자랐고(2번), 과학자들은 모두 실패했으며(4번), 농장주는 방법을 공유하게 했다(11번).","c":3},"h":"83a8f8c6d3"},{"n":9,"t":"sum","q":"Vanilla was once one of the (A) and most expensive (B).","ko":"바닐라는 한때 가장 (A) 가장 비싼 (B) 중 하나였다.","oko":["(A) 희귀하고 / (B) 장난감","(A) 가장 싸고 / (B) 장난감","(A) 희귀하고 / (B) 향신료","(A) 키가 가장 크고 / (B) 향신료","(A) 가장 싸고 / (B) 향신료"],"opts":["(A) rarest / (B) toys","(A) cheapest / (B) toys","(A) rarest / (B) spices","(A) tallest / (B) spices","(A) cheapest / (B) spices"],"r":{"a":"3) (A) rarest / (B) spices","ev":"1번 문장","s":[[1,"Vanilla was once one of the rarest and most expensive spices.","바닐라는 한때 가장 희귀하고 비싼 향신료 중 하나였다."]],"w":"1번 Vanilla was once one of the rarest and most expensive spices(바닐라는 한때 가장 희귀하고 비싼 향신료 중 하나였다)에서 가져옴. 그래서 rarest와 spices.","c":3},"h":"92ee238657"},{"n":10,"t":"fill","q":"The boy was a [A] on a farm on an [B] near Africa.","ko":"그 소년은 아프리카 근처의 [B]에 있는 농장의 [A]였다.","bank":["slave","island","eventually","proudly","never","owned"],"bko":{"slave":"노예","island":"섬","eventually":"결국","proudly":"자랑스럽게","never":"결코 ~않다","owned":"소유했다(own의 과거형)"},"r":{"a":"[A] slave (노예), [B] island (섬)","ev":"6번 문장","s":[[6,"The boy was a slave on a farm on an island near Africa.","그 소년은 아프리카 근처의 한 섬에 있는 농장의 노예였다."]],"w":"6번 The boy was a slave on a farm on an island near Africa(그 소년은 아프리카 근처의 한 섬에 있는 농장의 노예였다)에서 가져옴. eventually, proudly, never, owned는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"59ab0e16ca"}]},{"u":5,"id":"rj3-05-4","no":4,"ko":"구기 종목 삼 형제","items":[{"n":1,"t":"tf","q":"The teams could use as many players as they wanted in a game.","ko":"팀들은 한 경기에 원하는 만큼 많은 선수들을 쓸 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The teams could use as many players as they wanted in a game.","팀들은 그들이 원하는 만큼의 많은 선수들을 한 경기에 쓸 수 있었다."]],"w":"3번 문장에 as many players as they wanted in a game이 그대로 나와요. 선수 수에 제한이 없었다는 내용과 같아요.","c":"T"},"h":"167d3b532c"},{"n":2,"t":"tf","q":"The type of football that allowed the players to carry the ball with their hands later became soccer.","ko":"선수들이 손으로 공을 나르는 것을 허용한 풋볼 방식은 나중에 축구가 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"One type allowed the players to carry the ball with their hands.","한 방식은 선수들이 그들의 손으로 공을 나르는 것을 허용했다."],[8,"This sport later became rugby.","이 운동 경기는 나중에 럭비가 되었다."]],"w":"7번에서 손으로 공을 나르는 방식이 8번에서 나중에 럭비가 되었다고 해요. 축구가 된 것은 공을 차는 다른 방식(9번)이에요.","c":"F"},"h":"0966f0ac3a"},{"n":3,"t":"tf","q":"Both types of football were introduced to North America.","ko":"두 가지 풋볼 방식 모두 북아메리카에 소개되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Both were introduced to North America, but North Americans enjoyed the rugby-type game more.","두 가지 모두 북아메리카에 소개되었지만, 북아메리카 사람들은 럭비 형태의 경기를 더 즐겼다."]],"w":"10번 문장에 Both were introduced to North America라고 나와요. 두 방식 모두 들어갔지만 럭비 형태가 더 즐겨졌어요.","c":"T"},"h":"83da09b446"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the early 19th century, football was divided into two major categories in British public schools.)","ko":"19세기 초에, 풋볼은 영국 사립 학교들에서 두 가지 주요 범주로 ( ).","opts":["나뉘었다","합쳐졌다","금지되었다","옮겨졌다"],"word":"divided","r":{"a":"1) 나뉘었다","ev":"6~7번, 9번 문장","s":[[6,"In the early 19th century, football was divided into two major categories in British public schools.","19세기 초에, 풋볼은 영국 사립 학교들에서 두 가지 주요 범주로 나뉘었다."],[7,"One type allowed the players to carry the ball with their hands.","한 방식은 선수들이 그들의 손으로 공을 나르는 것을 허용했다."],[9,"In the other type, which became soccer, players kicked the ball.","다른 방식에서, 그것은 축구가 되었는데, 선수들은 공을 찼다."]],"w":"6번에서 풋볼이 두 가지 주요 범주로 나뉘었고, 7번 One type과 9번 the other type으로 두 방식이 설명돼요. be divided into = ~로 나뉘다예요.","c":1},"h":"1e5119b759"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The three sports originated from the same game, but each one developed in its own way.)","ko":"그 세 가지 운동 경기는 같은 경기로부터 ( ) 각각은 그것 자신의 방식으로 발전했다.","opts":["끝났지만","사라졌지만","비롯되었지만","옮겨졌지만"],"word":"originated","r":{"a":"3) 비롯되었지만","ev":"4번, 12번 문장","s":[[4,"This game eventually became a sport called “football.”","이 경기는 결국 ‘풋볼’이라고 불리는 운동 경기가 되었다."],[12,"The three sports originated from the same game, but each one developed in its own way.","그 세 가지 운동 경기는 같은 경기로부터 비롯되었지만, 각각은 그것 자신의 방식으로 발전했다."]],"w":"4번에서 하나의 경기가 풋볼이 되었고, 12번에서 세 운동이 같은 경기에서 출발했다고 정리해요. originate from = ~에서 비롯되다예요.","c":3},"h":"eecdeaffc5"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nBoth were introduced to North America, but North Americans enjoyed the rugby-type game more. As time went by, they changed some of the rules, and the game became what is called “American football” today.","ko":"밑줄 친 they가 가리키는 것은?","sko":"두 가지 모두 북아메리카에 소개되었지만, 북아메리카 사람들은 럭비 형태의 경기를 더 즐겼다. 시간이 지남에 따라, 그들은 몇몇 규칙들을 바꾸었고, 그 경기는 오늘날 ‘미식축구’로 불리는 것이 되었다.","opts":["럭비 선수들","영국 사람들","북아메리카 사람들","학교 선생님들"],"r":{"a":"3) 북아메리카 사람들","ev":"10~11번 문장","s":[[10,"Both were introduced to North America, but North Americans enjoyed the rugby-type game more.","두 가지 모두 북아메리카에 소개되었지만, 북아메리카 사람들은 럭비 형태의 경기를 더 즐겼다."],[11,"As time went by, they changed some of the rules, and the game became what is called “American football” today.","시간이 지남에 따라, 그들은 몇몇 규칙들을 바꾸었고, 그 경기는 오늘날 ‘미식축구’로 불리는 것이 되었다."]],"w":"10번 문장의 주어가 North Americans(북아메리카 사람들)이고, 11번 As time went by, they changed some of the rules의 they는 그 사람들을 가리킴.","c":3,"k":"they = 북아메리카 사람들"},"pron":"they","h":"9bdf515fd4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This game eventually became a sport called “football.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 경기는 결국 ‘풋볼’이라고 불리는 운동 경기가 되었다.","opts":["이 경기는 결국 ‘풋볼’이라고 불리는 운동 경기가 되었다.","이 경기는 ‘풋볼’ 때문에 사라지게 되었다.","‘풋볼’은 이 경기와 전혀 관계없이 새로 만들어졌다.","이 경기는 처음부터 ‘풋볼’이라는 이름을 가지고 있었다."],"r":{"a":"1) 이 경기는 결국 ‘풋볼’이라고 불리는 운동 경기가 되었다.","ev":"4번 문장","s":[[4,"This game eventually became a sport called “football.”","이 경기는 결국 ‘풋볼’이라고 불리는 운동 경기가 되었다."]],"w":"4번 문장 eventually became a sport called “football”은 ‘결국 ‘풋볼’이라고 불리는 운동 경기가 되었다’는 뜻. eventually는 ‘결국’이라서 처음부터 그 이름이었다는 말과는 다름.","c":1},"h":"bf624389b2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["19세기 초에 영국 학교에는 풋볼 방식이 한 가지뿐이었다.","오래전에 많은 영국 마을의 사람들이 공을 가지고 경기를 했다.","모든 마을이 풋볼을 똑같은 방식으로 했다.","럭비는 북아메리카에서 발명되었다."],"opts":["In the early 19th century, there was only one type of football in British schools.","People in many British towns played a game with a ball long ago.","Every town played football in exactly the same way.","Rugby was invented in North America."],"r":{"a":"2) People in many British towns played a game with a ball long ago. (오래전에 많은 영국 마을의 사람들이 공을 가지고 경기를 했다.)","ev":"1번 문장","s":[[1,"Long ago, people in many British towns played a game with a ball.","오래전에, 많은 영국 마을들의 사람들은 공을 가지고 경기를 했다."]],"w":"1번 문장 people in many British towns played a game with a ball(많은 영국 마을의 사람들은 공을 가지고 경기를 했다)과 같은 내용. 풋볼은 두 가지 범주로 나뉘었고(6번), 각 지역이 자기 방식으로 발달시켰으며(5번), 럭비는 영국 학교에서 나왔다(7~8번).","c":2},"h":"6d07bb26f3"},{"n":9,"t":"sum","q":"The goal was to (A) or carry the ball to a (B) place.","ko":"목표는 공을 (B) 곳까지 (A) 나르는 것이었다.","oko":["(A) 차거나 / (B) 졸린","(A) 먹거나 / (B) 특정한","(A) 차거나 / (B) 특정한","(A) 먹거나 / (B) 졸린","(A) 마시거나 / (B) 특정한"],"opts":["(A) kick / (B) sleepy","(A) eat / (B) particular","(A) kick / (B) particular","(A) eat / (B) sleepy","(A) drink / (B) particular"],"r":{"a":"3) (A) kick / (B) particular","ev":"2번 문장","s":[[2,"The goal was to kick or carry the ball to a particular place.","목표는 공을 특정한 곳까지 차거나 나르는 것이었다."]],"w":"2번 The goal was to kick or carry the ball to a particular place(목표는 공을 특정한 곳까지 차거나 나르는 것이었다)에서 가져옴. 그래서 kick과 particular.","c":3},"h":"9749207462"},{"n":10,"t":"fill","q":"Each [A] developed their own [B] of the sport.","ko":"각 [A]은(는) 그 운동 경기의 그들 자신의 [B]을(를) 발달시켰다.","bank":["community","form","eventually","introduced","later","enjoyed"],"bko":{"community":"지역 사회","form":"방식","eventually":"결국","introduced":"소개되었다(introduce의 과거형)","later":"나중에","enjoyed":"즐겼다(enjoy의 과거형)"},"r":{"a":"[A] community (지역 사회), [B] form (방식)","ev":"5번 문장","s":[[5,"Each community developed their own form of the sport.","각 지역 사회는 그 운동 경기의 그들 자신의 방식을 발달시켰다."]],"w":"5번 Each community developed their own form of the sport(각 지역 사회는 그 운동 경기의 그들 자신의 방식을 발달시켰다)에서 가져옴. eventually, introduced, later, enjoyed는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"2841a9f1ea"}]},{"u":6,"id":"rj3-06-1","no":1,"ko":"내 말이 들리나요?","items":[{"n":1,"t":"tf","q":"Humans cannot hear the sounds that plants make with their own ears.","ko":"사람들은 식물이 내는 소리를 자신들의 귀로 들을 수 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They discovered that plants make sounds that humans cannot hear with their own ears.","그들은 사람들이 자신들의 귀로 들을 수 없는 소리를 식물들이 낸다는 것을 발견했다."]],"w":"4번 문장에서 식물이 사람들이 자신의 귀로 들을 수 없는 소리를 낸다는 것을 발견했다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"584d83e4c3"},{"n":2,"t":"tf","q":"Plants made a lot of noise when they had plenty of water.","ko":"식물들은 물을 많이 가지고 있을 때 많은 소리를 냈다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"When the plants had plenty of water, they hardly made any noise.","식물들이 많은 물을 가지고 있을 때, 그것들은 거의 어떤 소리도 내지 않았다."]],"w":"6번 문장에서 물이 많을 때는 거의 어떤 소리도 내지 않았다(hardly made any noise)고 해요. 반대예요.","c":"F"},"h":"080c404122"},{"n":3,"t":"tf","q":"Scientists have known only recently that plants respond to sound.","ko":"과학자들은 식물이 소리에 대응한다는 것을 최근에서야 알게 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"For a long time, scientists have known that plants respond to sound.","오랫동안, 과학자들은 식물들이 소리에 반응한다는 것을 알았다."]],"w":"1번 문장에서 과학자들은 오랫동안(for a long time) 식물이 소리에 반응한다는 것을 알아 왔다고 해요. 최근에 밝혀진 것은 식물이 스스로 소리를 낸다는 것(2번)이에요.","c":"F"},"h":"718202c883"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (What is more, the researchers noticed some patterns in the sounds, which resembled clicking or popping noises.)","ko":"게다가, 연구원들은 소리에서 몇 가지 패턴을 알아냈는데, 그것은 딸깍거리는 소리나 펑 하는 소리와 ( ).","opts":["달랐다","비슷했다","섞여 있었다","사라졌다"],"word":"resembled","r":{"a":"2) 비슷했다","ev":"5번 문장","s":[[5,"What is more, the researchers noticed some patterns in the sounds, which resembled clicking or popping noises.","게다가, 연구원들은 소리에서 몇 가지 패턴을 알아냈는데, 그것은 딸깍거리는 소리나 펑 하는 소리와 비슷했다."]],"w":"5번에서 패턴을 설명하는 which 뒤의 말이에요. 패턴이 딸깍거리거나 펑 하는 소리와 같은 종류라는 뜻이라 resemble = 닮다, 비슷하다예요.","c":2},"h":"47a2d2c766"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For a long time, scientists have known that plants respond to sound.)","ko":"오랫동안, 과학자들은 식물들이 소리에 ( ) 것을 알았다.","opts":["반응한다는","저항한다는","복종한다는","숨는다는"],"word":"respond","r":{"a":"1) 반응한다는","ev":"1~2번 문장","s":[[1,"For a long time, scientists have known that plants respond to sound.","오랫동안, 과학자들은 식물들이 소리에 반응한다는 것을 알았다."],[2,"However, recent discoveries have shown that plants also make sounds of their own.","하지만, 최근의 발견은 식물들이 또한 그것들 자신의 소리를 낸다는 것을 보여주었다."]],"w":"1번은 오래전부터 알던 내용이고, 2번에서는 However로 식물이 스스로 소리도 낸다는 새 발견이 이어져요. 식물이 소리에 ‘반응한다’는 뜻이라 respond to = ~에 반응하다예요.","c":1},"h":"1de3c52896"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nHowever, recent discoveries have shown that plants also make sounds of their own.","ko":"밑줄 친 their가 가리키는 것은?","sko":"하지만, 최근의 발견은 식물들이 또한 그것들 자신의 소리를 낸다는 것을 보여주었다.","opts":["과학자들","식물들","최근의 발견들","마이크"],"r":{"a":"2) 식물들","ev":"2번 문장","s":[[2,"However, recent discoveries have shown that plants also make sounds of their own.","하지만, 최근의 발견은 식물들이 또한 그것들 자신의 소리를 낸다는 것을 보여주었다."]],"w":"2번 문장에서 their own sounds는 ‘그것들 자신의 소리’예요. 소리를 내는 것은 plants(식물들)이므로 their는 식물들을 가리켜요.","c":2,"k":"their = 식물들"},"pron":"their","h":"8bdd9a6ec9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Researchers hope to continue studying what plants say so that they can help people who work with plants, such as farmers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"연구원들은 농부들처럼 식물들과 함께 일하는 사람들을 도울 수 있도록 식물들이 말하는 것을 계속 연구하기를 희망한다.","opts":["연구원들은 농부 같은 사람들을 도울 수 있도록 식물이 말하는 것을 계속 연구하기를 바란다.","연구원들은 식물이 말하는 것에 대한 연구를 곧 그만두기를 바란다.","농부들은 식물에게 말을 걸어 연구원들을 돕고 싶어 한다.","연구원들은 식물과 일하는 사람들이 연구를 계속하기를 바란다."],"r":{"a":"1) 연구원들은 농부 같은 사람들을 도울 수 있도록 식물이 말하는 것을 계속 연구하기를 바란다.","ev":"10번 문장","s":[[10,"Researchers hope to continue studying what plants say so that they can help people who work with plants, such as farmers.","연구원들은 농부들처럼 식물들과 함께 일하는 사람들을 도울 수 있도록 식물들이 말하는 것을 계속 연구하기를 희망한다."]],"w":"hope to continue studying은 ‘계속 연구하기를 희망한다’이고 so that they can help people은 ‘사람들을 도울 수 있도록’이에요. 연구하는 쪽은 연구원이고, 돕는 대상이 농부 같은 사람들이에요.","c":1},"h":"fc7af3d993"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["식물은 항상 똑같은 소리를 낸다.","식물은 물을 많이 가지고 있을 때 더 많은 소리를 낸다.","사람들은 식물이 내는 모든 소리를 들을 수 있다.","연구원들은 토마토 주변의 소리를 듣기 위해 마이크를 사용했다."],"opts":["Plants make the same sounds all the time.","Plants make more sounds when they have plenty of water.","Humans can hear all the sounds that plants make.","Researchers used microphones to listen to the sounds around tomatoes."],"r":{"a":"4) Researchers used microphones to listen to the sounds around tomatoes. (연구원들은 토마토 주변의 소리를 듣기 위해 마이크를 사용했다.)","ev":"3번, 6~8번 문장","s":[[3,"Researchers used microphones to listen to the sounds around tomatoes.","연구원들은 토마토 주변의 소리를 듣기 위해 마이크를 사용했다."],[6,"When the plants had plenty of water, they hardly made any noise.","식물들이 많은 물을 가지고 있을 때, 그것들은 거의 어떤 소리도 내지 않았다."],[7,"However, as their soil became drier, they made more sounds.","그러나, 그것들의 토양이 더 건조해질 때 그것들은 더 많은 소리를 냈다."],[8,"They also made more sounds when one of their stems was cut off.","그것들은 또한 줄기 중 하나가 잘려 나가면 더 많은 소리를 냈다."]],"w":"3번에서 연구원들이 토마토 주변의 소리를 듣기 위해 마이크를 썼어요. 식물은 상황에 따라 내는 소리가 달라지고(6~8번), 물이 많으면 거의 소리를 내지 않아요(6번).","c":4},"h":"a33884a9fb"},{"n":9,"t":"sum","q":"Plants made more sounds when one of their (A) was (B) off.","ko":"식물들은 그것들의 (A) 중 하나가 (B) 나가면 더 많은 소리를 냈다.","oko":["(A) 잎 / (B) 날려","(A) 줄기 / (B) 씻겨","(A) 뿌리 / (B) 잘려","(A) 줄기 / (B) 잘려","(A) 잎 / (B) 씻겨"],"opts":["(A) leaves / (B) blown","(A) stems / (B) washed","(A) roots / (B) cut","(A) stems / (B) cut","(A) leaves / (B) washed"],"r":{"a":"4) (A) stems / (B) cut ((A) 줄기 / (B) 잘려)","ev":"8번 문장","s":[[8,"They also made more sounds when one of their stems was cut off.","그것들은 또한 줄기 중 하나가 잘려 나가면 더 많은 소리를 냈다."]],"w":"8번 문장에서 줄기(stems) 중 하나가 잘려 나갔을(cut off) 때 더 많은 소리를 냈다고 해요. 잎·뿌리는 본문에 나오지 않고, 씻겨 나가거나 날려 나간다는 말도 없어요.","c":4},"h":"b97ee3c18d"},{"n":10,"t":"fill","q":"In other [A], the plants made sounds when they were [B].","ko":"다시 [A]해서, 식물들은 그것들이 [B] 때 소리를 냈다.","bank":["words","stressed","noise","patterns","microphones","tomatoes"],"bko":{"words":"말","stressed":"스트레스를 받은","noise":"소음","patterns":"패턴","microphones":"마이크","tomatoes":"토마토"},"r":{"a":"[A] words (말), [B] stressed (스트레스를 받은)","ev":"9번 문장","s":[[9,"In other words, the plants made sounds when they were stressed.","다시 말해서, 식물들은 그것들이 스트레스를 받았을 때 소리를 냈다."]],"w":"9번 In other words, the plants made sounds when they were stressed에서 가져왔어요. In other words는 ‘다시 말해서’라는 뜻이고, were 뒤에는 형용사 stressed가 와요. 나머지는 모두 명사라 [B] 자리에 들어갈 수 없어요.","c":null},"h":"a1be6e129b"}]},{"u":6,"id":"rj3-06-2","no":2,"ko":"루시퍼를 만나러 가볼까요?","items":[{"n":1,"t":"tf","q":"Darvaza is a village in Turkmenistan’s Karakum Desert.","ko":"다르바자는 투르크메니스탄의 카라쿰 사막에 있는 마을이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Actually, it is called the “door to hell,” but it’s just a famous tourist attraction in Darvaza, a village in Turkmenistan’s Karakum Desert.","실제로, 그것은 ‘지옥으로 가는 문’이라고 불리지만, 그것은 투르크메니스탄의 카라쿰 사막에 있는 마을인 다르바자에 있는 그저 한 유명한 관광 명소이다."]],"w":"3번 문장에서 Darvaza는 투르크메니스탄의 카라쿰 사막에 있는 마을(a village in Turkmenistan’s Karakum Desert)이라고 해요.","c":"T"},"h":"7af8775b12"},{"n":2,"t":"tf","q":"The scientists decided to burn off the gas to make a tourist attraction.","ko":"과학자들은 관광 명소를 만들기 위해 가스를 태워 없애기로 결정했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"In order to protect people in the area, the scientists decided to burn off the gas.","그 지역의 사람들을 보호하기 위해, 과학자들은 그 가스를 태워 없애기로 결정했다."]],"w":"7번 문장에서 과학자들이 가스를 태우기로 한 것은 그 지역의 사람들을 보호하기 위해서예요. 관광 명소를 만들려는 것이 아니에요.","c":"F"},"h":"19f37c1674"},{"n":3,"t":"tf","q":"No one knows when the huge fire will stop.","ko":"아무도 그 거대한 불길이 언제 멈출지 알지 못한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"No one knows when this huge fire will stop.","언제 이 거대한 불길이 멈출 것인지 아무도 알지 못한다."]],"w":"10번 문장에 No one knows when this huge fire will stop이 그대로 나와요.","c":"T"},"h":"5e17058d55"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, the ground around the site soon collapsed, creating a huge hole.)","ko":"그러나, 그 장소 주변의 땅이 곧 ( ), 거대한 구덩이를 만들어 냈다.","opts":["솟아올랐다","얼어붙었다","무너졌다","사라졌다"],"word":"collapsed","r":{"a":"3) 무너졌다","ev":"4~5번 문장","s":[[4,"In 1971, scientists started digging for natural gas in this area.","1971년에, 과학자들은 이 지역에서 천연가스를 찾아 땅을 파기 시작했다."],[5,"However, the ground around the site soon collapsed, creating a huge hole.","그러나, 곧 그 장소 주변의 땅이 무너졌고 한 거대한 구덩이를 생성했다."]],"w":"4번에서 땅을 파던 장소의 주변이 어떻게 되었는지 5번에 나와요. 그 결과 거대한 구덩이가 생겼으니 땅이 ‘무너졌다’는 뜻이에요. collapse = 무너지다.","c":3},"h":"b3cc44e9b2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then poisonous gas began escaping through the hole.)","ko":"그러고 나서 그 구덩이를 통해 ( ) 가스가 새어 나오기 시작했다.","opts":["달콤한","투명한","뜨거운","유독한"],"word":"poisonous","r":{"a":"4) 유독한","ev":"6~7번 문장","s":[[6,"Then poisonous gas began escaping through the hole.","그러고 나서 그 구덩이를 통해 유독 가스가 새어 나오기 시작했다."],[7,"In order to protect people in the area, the scientists decided to burn off the gas.","그 지역의 사람들을 보호하기 위해, 과학자들은 그 가스를 태워 없애기로 결정했다."]],"w":"7번에서 사람들을 보호하기 위해 그 가스를 태우기로 했어요. 그러니 가스는 사람에게 해로운 ‘유독성의’ 가스예요. poisonous = 유독한.","c":4},"h":"a147fede8c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nMaybe you should visit the door to hell before it stops burning.","ko":"밑줄 친 it이 가리키는 것은?","sko":"아마 당신은 그것이 불타는 것을 멈추기 전에 지옥으로 가는 문을 방문해야 할 것이다.","opts":["지옥으로 가는 문","다르바자 마을","천연가스","과학자들"],"r":{"a":"1) 지옥으로 가는 문","ev":"11번 문장","s":[[11,"Maybe you should visit the door to hell before it stops burning.","아마 당신은 그것이 불타는 것을 멈추기 전에 지옥으로 가는 문을 방문해야 할 것이다."]],"w":"11번 문장은 ‘it(그것)이 불타는 것을 멈추기 전에 지옥으로 가는 문을 방문하라’는 뜻이에요. 불타는 것은 지옥으로 가는 문(구덩이)이므로 it은 그것을 가리켜요.","c":1,"k":"it = 지옥으로 가는 문"},"pron":"it","h":"fe0a38ea06"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even more than 40 years later, however, the hole is still burning.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 심지어 40년 이상이 지난 후에도, 그 구덩이는 여전히 불타고 있다.","opts":["40년이 지나자 구덩이의 불은 드디어 꺼졌다.","40년이 넘게 지난 지금도 구덩이는 여전히 불타고 있다.","40년이 안 되어 구덩이의 불이 약해졌다.","구덩이는 40년 후에야 불타기 시작했다."],"r":{"a":"2) 40년이 넘게 지난 지금도 구덩이는 여전히 불타고 있다.","ev":"9번 문장","s":[[9,"Even more than 40 years later, however, the hole is still burning.","하지만, 심지어 40년 이상이 지난 후에도, 그 구덩이는 여전히 불타고 있다."]],"w":"Even more than 40 years later는 ‘40년 이상이 지난 후에도’이고 still burning은 ‘여전히 불타고 있다’예요. 8번의 ‘며칠’ 예상과 정반대의 결과예요.","c":2},"h":"a7cda2476c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["구덩이는 전쟁으로 마을이 파괴되어 생겼다.","그 구덩이는 큰 도시 한가운데에 있다.","과학자들은 그것이 단 며칠만 걸릴 것이라고 생각했다.","사람들은 불이 언제 멈출지 정확히 알고 있다."],"opts":["The hole appeared because a war destroyed the village.","The hole is in the middle of a big city.","The scientists thought it would take only a few days.","People already know exactly when the fire will stop."],"r":{"a":"3) The scientists thought it would take only a few days. (과학자들은 그것이 단 며칠만 걸릴 것이라고 생각했다.)","ev":"3번, 5번, 8번, 10번 문장","s":[[3,"Actually, it is called the “door to hell,” but it’s just a famous tourist attraction in Darvaza, a village in Turkmenistan’s Karakum Desert.","실제로, 그것은 ‘지옥으로 가는 문’이라고 불리지만, 그것은 투르크메니스탄의 카라쿰 사막에 있는 마을인 다르바자에 있는 그저 한 유명한 관광 명소이다."],[5,"However, the ground around the site soon collapsed, creating a huge hole.","그러나, 곧 그 장소 주변의 땅이 무너졌고 한 거대한 구덩이를 생성했다."],[8,"They thought that it would take only a few days.","그들은 그것이 단 며칠만 걸릴 것이라고 생각했다."],[10,"No one knows when this huge fire will stop.","언제 이 거대한 불길이 멈출 것인지 아무도 알지 못한다."]],"w":"8번에서 과학자들은 단 며칠만 걸릴 것이라고 생각했어요. 구덩이는 땅이 무너져 생겼고(5번), 사막에 있는 마을 근처이며(3번), 불이 언제 멈출지 아무도 몰라요(10번).","c":3},"h":"f8c47a66f1"},{"n":9,"t":"sum","q":"The (A) of the burning hole is about 70 meters, and its (B) is about 30 meters.","ko":"그 불타오르는 구덩이의 (A)은(는) 약 70m이고 (B)은(는) 약 30m이다.","oko":["(A) 깊이 / (B) 너비","(A) 너비 / (B) 무게","(A) 너비 / (B) 깊이","(A) 나이 / (B) 깊이","(A) 열기 / (B) 너비"],"opts":["(A) depth / (B) width","(A) width / (B) weight","(A) width / (B) depth","(A) age / (B) depth","(A) heat / (B) width"],"r":{"a":"3) (A) width / (B) depth ((A) 너비 / (B) 깊이)","ev":"1번 문장","s":[[1,"Imagine a burning hole that is about 70 meters wide and 30 meters deep!","너비가 약 70m이고 깊이가 30m인 불타오르는 구덩이를 상상해 보라!"]],"w":"1번 문장에서 구덩이는 너비가 약 70m(70 meters wide)이고 깊이가 30m(30 meters deep)라고 해요. 너비가 70m, 깊이가 30m예요. 순서를 바꾼 보기와 무게·나이·열기는 본문과 달라요.","c":3},"h":"807d8c08d1"},{"n":10,"t":"fill","q":"In 1971, scientists started [A] for natural gas in this [B].","ko":"1971년에, 과학자들은 이 [B]에서 천연가스를 찾아 [A] 시작했다.","bank":["digging","area","escaping","tourist","famous","huge"],"bko":{"digging":"땅을 파기","area":"지역","escaping":"빠져나가기","tourist":"관광객","famous":"유명한","huge":"거대한"},"r":{"a":"[A] digging (땅을 파기), [B] area (지역)","ev":"4번 문장","s":[[4,"In 1971, scientists started digging for natural gas in this area.","1971년에, 과학자들은 이 지역에서 천연가스를 찾아 땅을 파기 시작했다."]],"w":"4번 In 1971, scientists started digging for natural gas in this area에서 가져왔어요. started 뒤에는 -ing형 digging이, this 뒤에는 명사 area가 와요. 나머지는 동사 과거형이나 형용사라 자리에 맞지 않아요.","c":null},"h":"cdf9923ee7"}]},{"u":6,"id":"rj3-06-3","no":3,"ko":"깜깜할수록 잘 보입니다","items":[{"n":1,"t":"tf","q":"Moonlight produces rainbows just as sunlight does.","ko":"햇빛이 무지개를 만들어 내는 것처럼 달빛도 무지개를 만들어 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Just as sunlight produces rainbows, moonlight produces rainbows, too.","마치 햇빛이 무지개를 만들어 내는 것처럼, 달빛 또한 무지개를 만들어 낸다."]],"w":"3번 문장에 Just as sunlight produces rainbows, moonlight produces rainbows, too.가 나와요. 본문과 같은 내용이에요.","c":"T"},"h":"5d590e0e80"},{"n":2,"t":"tf","q":"Moonbows look more colorful than rainbows to human eyes.","ko":"달무지개는 사람의 눈에 무지개보다 더 화려한 색으로 보인다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"However, because moonlight is weaker than sunlight, moonbows look white instead of colored to human eyes.","하지만, 달빛은 햇빛보다 더 약하기 때문에, 달무지개는 사람의 눈에 유채색 대신 하얀색으로 보인다."]],"w":"6번 문장에서 달빛이 더 약해서 달무지개는 색이 있는 대신 하얗게 보인다고 해요. 더 화려하다는 말은 반대예요.","c":"F"},"h":"76692b4365"},{"n":3,"t":"tf","q":"A moonbow needs a bright moon that is low and almost full.","ko":"달무지개에는 낮게 떠 있고 거의 보름달에 가까운 밝은 달이 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Second, there must be a bright moon that is low and almost full.","둘째, 낮게 떠 있고 거의 보름달에 가까운 밝은 달이 있어야 한다."]],"w":"9번 문장에 there must be a bright moon that is low and almost full이 그대로 나와요.","c":"T"},"h":"d4a61ee654"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A rainbow in a bright blue sky is a beautiful sight.)","ko":"밝고 푸른 하늘에 있는 무지개는 아름다운 ( )이다.","opts":["소리","냄새","맛","광경"],"word":"sight","r":{"a":"4) 광경","ev":"1번 문장","s":[[1,"A rainbow in a bright blue sky is a beautiful sight.","밝고 푸른 하늘에 있는 무지개는 아름다운 광경이다."]],"w":"밝고 푸른 하늘의 무지개를 보고 ‘아름답다’고 말하는 문장이에요. 눈으로 보는 모습이라 sight = 광경이에요.","c":4},"h":"9a7c4c2157"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The basic principle of a moonbow is just like that of a rainbow.)","ko":"달무지개의 기본 ( )은 무지개의 그것과 똑같다.","opts":["법칙","이름","색깔","역사"],"word":"principle","r":{"a":"1) 법칙","ev":"5번 문장","s":[[5,"The basic principle of a moonbow is just like that of a rainbow.","달무지개의 기본 법칙은 무지개의 그것과 똑같다."]],"w":"5번은 달무지개가 생기는 방식(기본 법칙)이 보통 무지개와 똑같다는 말이에요. 그래서 principle = 법칙이에요.","c":1},"h":"4e6e8e3200"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nFirst, the air needs to have enough moisture in it, like when or right after it rains, or when you are near a waterfall or the sea.","ko":"밑줄 친 it이 가리키는 것은?","sko":"첫째, 비가 올 때나 온 직후, 또는 당신이 폭포나 바다 근처에 있을 때와 같이, 공기가 그 안에 충분한 수분을 가지고 있을 필요가 있다.","opts":["공기","수분","폭포","바다"],"r":{"a":"1) 공기","ev":"8번 문장","s":[[8,"First, the air needs to have enough moisture in it, like when or right after it rains, or when you are near a waterfall or the sea.","첫째, 비가 올 때나 온 직후, 또는 당신이 폭포나 바다 근처에 있을 때와 같이, 공기가 그 안에 충분한 수분을 가지고 있을 필요가 있다."]],"w":"8번 문장 the air needs to have enough moisture in it에서 it은 앞에 나온 the air(공기)예요. 수분이 들어 있어야 하는 것은 공기예요.","c":1,"k":"it = 공기"},"pron":"it","h":"0b04138382"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But did you know there are also rainbows at night?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그런데 당신은 밤에도 무지개가 있다는 것을 알고 있었는가?","opts":["밤에는 무지개가 절대 생기지 않는다는 것을 알고 있었는가?","밤에도 무지개가 있다는 것을 알고 있었는가?","무지개가 밤보다 낮에 더 크다는 것을 알고 있었는가?","밤하늘의 별이 무지개를 만든다는 것을 알고 있었는가?"],"r":{"a":"2) 밤에도 무지개가 있다는 것을 알고 있었는가?","ev":"2번 문장","s":[[2,"But did you know there are also rainbows at night?","그런데 당신은 밤에도 무지개가 있다는 것을 알고 있었는가?"]],"w":"did you know there are also rainbows at night?은 ‘밤에도 무지개가 있다는 것을 알고 있었는가?’라는 뜻이에요. also는 ‘~도’라는 뜻이라 낮의 무지개 외에 밤에도 있다는 말이에요.","c":2},"h":"51d9107189"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["달의 무지개는 ‘태양무지개’로 알려져 있다.","달무지개는 낮에만 볼 수 있다.","달의 무지개는 ‘달무지개’로 알려져 있다.","달무지개는 태양의 빛으로 만들어진다."],"opts":["Lunar rainbows are known as sunbows.","Moonbows can be seen only in the daytime.","Lunar rainbows are known as moonbows.","Moonbows are made by the light of the sun."],"r":{"a":"3) Lunar rainbows are known as moonbows. (달의 무지개는 ‘달무지개’로 알려져 있다.)","ev":"3~4번 문장","s":[[3,"Just as sunlight produces rainbows, moonlight produces rainbows, too.","마치 햇빛이 무지개를 만들어 내는 것처럼, 달빛 또한 무지개를 만들어 낸다."],[4,"These lunar rainbows are known as “moonbows.”","이 달의 무지개는 ‘달무지개’로 알려져 있다."]],"w":"4번에서 달의 무지개(lunar rainbows)는 ‘달무지개(moonbows)’로 알려져 있다고 해요. 달무지개는 달빛이 만들고(3번), 밤에 볼 수 있어요.","c":3},"h":"22304b9a86"},{"n":9,"t":"sum","q":"Moonbows require many (A), so they are much (B) common than rainbows.","ko":"달무지개는 많은 (A)을(를) 필요로 해서 무지개보다 훨씬 (B) 흔하다.","oko":["(A) 색깔 / (B) 더","(A) 조건 / (B) 더","(A) 무지개 / (B) 덜","(A) 태양 / (B) 덜","(A) 조건 / (B) 덜"],"opts":["(A) colors / (B) more","(A) conditions / (B) more","(A) rainbows / (B) less","(A) suns / (B) less","(A) conditions / (B) less"],"r":{"a":"5) (A) conditions / (B) less","ev":"12~13번 문장","s":[[12,"Because of all these requirements, moonbows are much less common than rainbows.","이 모든 요건들 때문에, 달무지개는 무지개보다 훨씬 덜 흔하다."],[13,"That is why we do not see them often.","그것이 우리가 그것들을 자주 보지 못하는 이유이다."]],"w":"12번에서 이 모든 요건(requirements = 조건) 때문에 달무지개는 무지개보다 훨씬 덜(less) 흔하다고 하고, 13번에서 그래서 자주 못 본다고 해요. ‘더(more) 흔하다’는 반대예요.","c":5},"h":"34e7d34ada"},{"n":10,"t":"fill","q":"Also, a [A] sky is necessary. Finally, the moon must be [B] the viewer.","ko":"또한, [A] 하늘이 필요하다. 마지막으로, 달은 보는 사람 [B] 있어야 한다.","bank":["dark","behind","often","moisture","rains","enough"],"bko":{"dark":"어두운","behind":"뒤에","often":"자주","moisture":"수분, 습기","rains":"비가 온다(rain의 3인칭 단수 현재)","enough":"충분한"},"r":{"a":"[A] dark (어두운), [B] behind (뒤에)","ev":"10~11번 문장","s":[[10,"Also, a dark sky is necessary.","또한, 어두운 하늘이 필요하다."],[11,"Finally, the moon must be behind the viewer.","마지막으로, 달은 보는 사람 뒤에 있어야 한다."]],"w":"10번 a dark sky is necessary, 11번 the moon must be behind the viewer에서 가져왔어요. [A]는 sky를 꾸미는 형용사 자리, [B]는 the viewer 앞의 전치사 자리예요. 나머지는 이 자리에 문법상 들어갈 수 없어요.","c":null},"h":"a43e2acba0"}]},{"u":6,"id":"rj3-06-4","no":4,"ko":"세계 지도를 바꾸는 바닷속 화산","items":[{"n":1,"t":"tf","q":"Surtsey is a volcanic island near Iceland.","ko":"Surtsey는 아이슬란드 근처의 화산섬이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"One example is Surtsey, a volcanic island near Iceland.","한 가지 예는 아이슬란드 근처의 화산섬인 Surtsey이다."]],"w":"3번 문장에 Surtsey, a volcanic island near Iceland라고 나와요. 본문과 같은 내용이에요.","c":"T"},"h":"71dc8cb769"},{"n":2,"t":"tf","q":"The eruption of Surtsey lasted for less than a year.","ko":"Surtsey의 분출은 1년이 채 안 되게 계속되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The eruption lasted for more than three years, and the island grew to a size of 2.7 km2.","그 분출은 3년 이상 계속되었고, 그 섬은 2.7km2의 크기까지 커졌다."]],"w":"7번 문장에서 분출은 3년 이상(more than three years) 계속되었다고 해요. 1년이 안 된다는 말은 틀려요.","c":"F"},"h":"7b6da3706f"},{"n":3,"t":"tf","q":"Surtsey was named after the god of the sea in Nordic myths.","ko":"Surtsey는 북유럽 신화의 바다의 신의 이름을 따서 이름 지어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"It was named after the god of fire in Nordic myths, Surtr.","그것은 Surtr라는 북유럽 신화의 불의 신의 이름을 따서 이름 지어졌다."]],"w":"8번 문장에서 Surtsey는 북유럽 신화의 ‘불의 신’ Surtr의 이름을 따서 지어졌다고 해요. 바다의 신이 아니에요.","c":"F"},"h":"508fe5017a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He saw hot lava coming up to the surface of the water.)","ko":"그는 뜨거운 용암이 물의 ( )으로 솟아 나오고 있는 것을 보았다.","opts":["깊이","바닥","구석","표면"],"word":"surface","r":{"a":"4) 표면","ev":"5~6번 문장","s":[[5,"He saw hot lava coming up to the surface of the water.","그는 뜨거운 용암이 수면으로 솟아 나오고 있는 것을 보았다."],[6,"This formed a small island in the sea.","이것은 바다에 작은 섬을 형성했다."]],"w":"5번에서 용암이 물속에서 위로 솟아 나오고, 6번에서 그것이 바다에 작은 섬을 만들어요. 섬이 되려면 물 위로 나와야 하니 surface = 표면, 수면이에요.","c":4},"h":"010b67ddd8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…how plants and animals from other places settle on new land.)","ko":"…다른 곳으로부터 온 식물들과 동물들이 새로운 땅에 ( )하는 방법…","opts":["해결","정착","떠남","사라짐"],"word":"settle","r":{"a":"2) 정착","ev":"11번 문장","s":[[11,"Also, it has been protected since its birth because it allows scientists to observe how plants and animals from other places settle on new land.","또한, 그것은 과학자들이 다른 곳으로부터 온 식물들과 동물들이 새로운 땅에 정착하는 방법을 관찰하도록 허락하기 때문에 그것의 출현 이래로 보호되어 왔다."]],"w":"11번은 다른 곳에서 온 식물과 동물이 새로 생긴 땅에서 어떻게 되는지를 관찰한다는 내용이에요. 새 땅에 자리 잡는다는 뜻이라 settle = 정착하다예요(‘해결하다’ 뜻이 아니에요).","c":2},"h":"a0ed19f1a1"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBecause of the island’s great scientific value, UNESCO named it a World Heritage Site in 2008.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그 섬의 대단한 과학적 가치 때문에, 유네스코는 그것을 2008년에 세계 문화유산으로 지정했다.","opts":["그 섬","유네스코","과학적 가치","세계 문화유산"],"r":{"a":"1) 그 섬","ev":"12번 문장","s":[[12,"Because of the island’s great scientific value, UNESCO named it a World Heritage Site in 2008.","그 섬의 대단한 과학적 가치 때문에, 유네스코는 그것을 2008년에 세계 문화유산으로 지정했다."]],"w":"12번 문장은 ‘그 섬의 대단한 과학적 가치 때문에 유네스코가 it을 세계 문화유산으로 지정했다’는 뜻이에요. 지정된 것은 앞에 나온 the island(그 섬)예요.","c":1,"k":"it = 그 섬"},"pron":"it","h":"27f0d12cfd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This formed a small island in the sea.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 바다에 작은 섬을 형성했다.","opts":["이것이 바다에 작은 섬을 만들어 냈다.","이것은 바다에 있던 작은 섬을 없애 버렸다.","바다에서 작은 섬이 이것을 만들어 냈다.","이것은 작은 섬에서 바다를 바라본 것이다."],"r":{"a":"1) 이것이 바다에 작은 섬을 만들어 냈다.","ev":"6번 문장","s":[[6,"This formed a small island in the sea.","이것은 바다에 작은 섬을 형성했다."]],"w":"formed는 ‘형성했다, 만들었다’이므로 This formed a small island in the sea는 ‘이것이 바다에 작은 섬을 만들어 냈다’는 뜻이에요. 섬이 이것을 만든 것이 아니라 이것이 섬을 만든 거예요.","c":1},"h":"ae4dff0d6e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["어부는 1999년에 처음 그곳에서 화산 활동을 보았다.","Surtsey는 100km2가 넘는 큰 섬이다.","지구는 발달을 모두 마쳐서 더 이상 변하지 않는다.","Surtsey는 섬이 어떻게 형성되고 발달하는지에 관한 정보를 제공해 왔다."],"opts":["A fisherman first saw volcanic activity there in 1999.","Surtsey is a big island of more than 100 km2.","Earth has finished developing, so it does not change anymore.","Surtsey has provided information on how islands form and develop."],"r":{"a":"4) Surtsey has provided information on how islands form and develop. (Surtsey는 섬이 어떻게 형성되고 발달하는지에 관한 정보를 제공해 왔다.)","ev":"1번, 4번, 7번, 10번 문장","s":[[1,"Did you know Earth is still developing?","당신은 지구가 여전히 발달하고 있다는 것을 알고 있었는가?"],[4,"A fisherman first saw volcanic activity there on November 14, 1963.","1963년 11월 14일에 한 어부가 처음으로 그곳에서의 화산 활동을 보았다."],[7,"The eruption lasted for more than three years, and the island grew to a size of 2.7 km2.","그 분출은 3년 이상 계속되었고, 그 섬은 2.7km2의 크기까지 커졌다."],[10,"It has provided information on how islands form and develop.","그것은 어떻게 섬이 형성되고 발달하는지에 관한 정보를 제공해 왔다."]],"w":"10번에서 Surtsey는 섬이 어떻게 형성되고 발달하는지에 관한 정보를 제공해 왔다고 해요. 어부가 본 것은 1963년이고(4번), 섬의 크기는 2.7km2이며(7번), 지구는 여전히 발달하고 있어요(1번).","c":4},"h":"d162ab4656"},{"n":9,"t":"sum","q":"Since its birth, Surtsey has been a place of (A) for (B).","ko":"Surtsey는 생겨난 때부터 (B)에게 (A)의 장소가 되어 왔다.","oko":["(A) 연구 / (B) 농부들","(A) 휴식 / (B) 과학자들","(A) 휴식 / (B) 관광객들","(A) 낚시 / (B) 과학자들","(A) 연구 / (B) 과학자들"],"opts":["(A) study / (B) farmers","(A) rest / (B) scientists","(A) rest / (B) tourists","(A) fishing / (B) scientists","(A) study / (B) scientists"],"r":{"a":"5) (A) study / (B) scientists ((A) 연구 / (B) 과학자들)","ev":"9번 문장","s":[[9,"From the start, Surtsey has been a place of study for scientists.","처음부터, Surtsey는 과학자들을 위한 연구 장소가 되어 왔다."]],"w":"9번 문장에서 Surtsey는 처음부터 과학자들을 위한 연구 장소(a place of study for scientists)가 되어 왔다고 해요. 나머지는 본문에 나오지 않는 내용이에요.","c":5},"h":"fc3f499034"},{"n":10,"t":"fill","q":"Every day, earthquakes and [A] are creating new land or changing the existing [B].","ko":"매일, 지진과 [A]이(가) 새로운 땅을 만들거나 기존의 [B]을(를) 바꾸고 있다.","bank":["volcanoes","landscape","volcanic","small","protected","named"],"bko":{"volcanoes":"화산들","landscape":"풍경, 지형","volcanic":"화산의","small":"작은","protected":"보호된","named":"이름 지어진"},"r":{"a":"[A] volcanoes (화산들), [B] landscape (풍경, 지형)","ev":"2번 문장","s":[[2,"Every day, earthquakes and volcanoes are creating new land or changing the existing landscape.","매일, 지진과 화산이 새로운 땅을 만들거나 기존의 풍경을 바꾸고 있다."]],"w":"2번 earthquakes and volcanoes are creating new land or changing the existing landscape에서 가져왔어요. [A]는 earthquakes와 함께 주어가 되는 명사, [B]는 the existing 뒤의 명사 자리예요. 나머지는 형용사나 분사라 명사 자리에 들어갈 수 없어요.","c":null},"h":"41edc1120f"}]},{"u":7,"id":"rj3-07-1","no":1,"ko":"귀여운 건 못 참지!","items":[{"n":1,"t":"tf","q":"We may cry tears of joy when our brain is balancing our feelings.","ko":"우리는 우리의 뇌가 우리의 감정의 균형을 잡고 있을 때 기쁨의 눈물을 흘릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"This is what is happening when we cry tears of joy or burst into nervous laughter.","이것은 우리가 기쁨의 눈물을 흘리거나 긴장의 웃음을 터뜨릴 때 일어나는 일이다."],[10,"It’s simply our brain balancing our feelings.","그저 우리의 뇌가 우리의 감정의 균형을 잡아주는 것이다."]],"w":"9번에서 기쁨의 눈물을 흘리거나 긴장의 웃음을 터뜨릴 때 일어나는 일이라고 했고, 10번에서 그것은 우리 뇌가 감정의 균형을 잡아 주는 것이라고 해요.","c":"T"},"h":"03981bfc41"},{"n":2,"t":"tf","q":"Cute aggression is harmful, so we should stop feeling it.","ko":"귀여운
