A("RT","RT",8,"c",{q:"다음 중 밑줄 친 부분이 올바른 것은?",opts:["① It <u>were</u> a great trip.","② He <u>are</u> a good swimmer.","③ We <u>was</u> full after lunch.","④ His parents <u>is</u> proud of him.","⑤ Susan and Tom <u>are</u> scientists."],ans:"⑤ Susan and Tom <u>are</u> scientists.",full:"Susan and Tom are scientists.",ko:"수잔과 톰은 과학자이다.",

 h:["본책 p.28 A ‘일반동사 현재형의 부정문’, p.30 A·B 의문문 표를 펴세요.","1) 다섯 문장을 하나씩 확인해요.  2) does not 뒤에는 동사원형이 와야 해요. 나머지 문장은 do/did 뒤 동사 모양, 3인칭 단수 -s 를 확인해요.","틀린 문장은 한 개뿐이에요. 맞는 문장은 5 − 1 개예요."],pen:"does not + 동사원형 (has X) → 틀린 것 1개"});
A("RT","RT",28,"w",{q:"Does he <u>walks</u> fast?<br>(O / X)",ans:"X, walk",full:"Does he walk fast?",ko:"그는 빨리 걷니?",
 h:[P4A,"1) 문장에 Does 가 있어요.  2) Does + 주어 + 동사원형? 이라서 walks 의 -s 는 필요 없어요.","X 라고 쓰고, 바르게 고친 동사는 w 로 시작하는 원형이에요."],pen:"Does + 주어 + 동사원형 (walks X)"});
A("RT","RT",29,"w",{q:"I didn’t <u>took</u> my medicine this morning.<br>(O / X)",ans:"X, take",full:"I didn’t take my medicine this morning.",ko:"나는 오늘 아침에 약을 먹지 않았다.",
 h:[P3B,"1) 문장에 didn’t 가 있어요.  2) didn’t + 동사원형이라서 과거형 took 을 쓰면 안 돼요.","X 라고 쓰고, 바르게 고친 동사는 t 로 시작하는 원형이에요."],pen:"didn’t + 동사원형 (took X)"});
A("RT","RT",30,"w",{q:"My mom <u>fixs</u> everything in our house.<br>(O / X)",ans:"X, fixes",full:"My mom fixes everything in our house.",ko:"우리 엄마는 집안의 모든 것을 고치신다.",
 h:[P12,"1) My mom은 3인칭 단수, 현재 이야기예요.  2) 표에서 -x로 끝나는 동사는 + -es 예요.","X 라고 쓰고, 바르게 고친 동사는 f 로 시작해서 -es 로 끝나요."],pen:"fix(-x로 끝남) → fixes (+ -es)"});
A("RT","RT",31,"w",{q:"My sister and I went to a nice restaurant last weekend. We eat lots of delicious food there. (틀린 부분 1개)",ans:"We eat → We ate",full:"My sister and I went to a nice restaurant last weekend. We ate lots of delicious food there.",ko:"내 여동생과 나는 지난 주말에 멋진 식당에 갔다. 우리는 그곳에서 맛있는 음식을 많이 먹었다.",
 h:["본책 p.26 A-1 ‘일반동사의 과거형’ 설명과 A-2 ‘불규칙 변화’ 줄을 보세요.","1) 첫 문장 went(갔다)와 last weekend(지난 주말)로 보아 이야기 전체가 과거예요.  2) 현재형으로 쓴 동사를 찾아 과거형으로 바꿔요.","eat(먹다)는 불규칙 변화예요. 바꾼 동사는 a 로 시작하는 세 글자예요."],pen:"last weekend(과거) → eat → ate"});
A("RT","RT",32,"w",{q:"I doesn’t get letters often. But yesterday, I find a letter in my mailbox. It was from my friend Jessica. (틀린 부분 2개)",ans:"I doesn’t → I don’t / I find → I found",full:"I don’t get letters often. But yesterday, I found a letter in my mailbox. It was from my friend Jessica.",ko:"나는 편지를 자주 받지 않는다. 하지만 어제 나는 우편함에서 편지 한 통을 발견했다. 그것은 내 친구 제시카에게서 온 것이었다.",
 h:["본책 p.28 A 표와 p.26 A-2 ‘불규칙 변화’ 줄을 보세요.","1) 첫 문장: 주어 I는 1인칭인데 doesn’t 를 썼어요.  2) 둘째 문장: yesterday(어제)가 있는데 동사 find 가 현재형이에요.","첫째는 d 로 시작하는 don’t, 둘째는 f 로 시작하는 find 의 과거형이에요."],pen:"I(1인칭) → don’t / yesterday(과거) → find → found"});
A("RT","RT",33,"w",{q:"A: Do you have a blog, Dave?<br>B: Yes, I do. I writes my blog every day. Yesterday I spent five hours on it.<br>A: Five hours?<br>B: Yes. I go to bed very late. And I didn’t do my homework. (틀린 부분 2개)",ans:"I writes → I write / I go → I went",full:"A: Do you have a blog, Dave? B: Yes, I do. I write my blog every day. Yesterday I spent five hours on it. A: Five hours? B: Yes. I went to bed very late. And I didn’t do my homework.",ko:"A: 데이브, 너 블로그 있니? B: 응, 있어. 나는 매일 블로그를 써. 어제는 그것에 다섯 시간을 썼어. A: 다섯 시간? B: 응. 나는 아주 늦게 잠자리에 들었어. 그리고 숙제도 하지 않았어.",
 h:["본책 p.24 A-1 ‘일반동사의 현재형’ 설명과 p.26 A-2 ‘불규칙 변화’ 줄을 보세요.","1) 첫째: every day(매일) 이야기인데 주어 I(1인칭)에 -s 를 붙였어요.  2) 둘째: 잠자리에 든 것은 Yesterday(어제)의 일이에요(과거).","첫째는 w 로 시작하는 동사원형, 둘째는 w 로 시작하는 go 의 과거형이에요."],pen:"I(1인칭) 현재 → write / 어제 일(과거) → go → went"});

[["They ___ my phone number.","know","They know my phone number.","그들은 내 전화번호를 안다.","They(복수) → 동사원형 know","본책 p.24 A-1 ‘일반동사의 현재형’ 설명을 보세요.","1) 주어 They는 복수예요.  2) 복수 주어 뒤에는 동사원형을 써요.","k 로 시작하는 동사원형이에요. 첫 글자 k 는 소리 나지 않아요."],
 ["My sister ___ brown eyes.","has","My sister has brown eyes.","내 여동생은 갈색 눈을 가지고 있다.","My sister(3인칭 단수) + have → has","본책 p.24 A-2 ‘일반동사의 3인칭 단수 현재형 만드는 법’ 표를 펴세요.","1) My sister는 한 명(3인칭 단수)이에요.  2) 표의 ‘불규칙 변화’ 줄을 보세요.","h 로 시작하는 세 글자예요."],
 ["Mary ___ for the test last night.","studied","Mary studied for the test last night.","Mary는 어젯밤에 시험공부를 했다.","last night(과거) + study(자음+y) → studied","본책 p.26 A-2 ‘일반동사의 과거형 만드는 법’ 표를 펴세요.","1) last night(어젯밤) → 과거  2) study는 ‘자음 + y’로 끝나요. y를 i로 고치고 + -ed","s 로 시작해서 -ied 로 끝나요."],
 ["He ___ the paper with scissors.","cut","He cut the paper with scissors.","그는 가위로 종이를 잘랐다.","cut은 현재형 = 과거형","본책 p.26 A-2 표의 ‘현재형과 과거형이 같은 동사’ 줄을 보세요.","1) ‘잘랐다’는 과거예요.  2) 표에서 현재형과 과거형이 같은 모양인 동사 중에 ‘자르다’가 있어요.","c 로 시작하는 세 글자예요."],
 ["She ___ keep her promises.","doesn’t / does not","She doesn’t keep her promises. / She does not keep her promises.","그녀는 약속을 지키지 않는다.","She(3인칭 단수) 현재 부정 → doesn’t[does not] + 동사원형","본책 p.28 A ‘일반동사 현재형의 부정문’ 표를 펴세요.","1) She는 3인칭 단수이고 현재 이야기예요.  2) 뒤에 동사원형 keep(지키다)이 있어요.","does 로 시작하는 말이에요."],
 ["We ___ eat breakfast this morning.","didn’t / did not","We didn’t eat breakfast this morning. / We did not eat breakfast this morning.","우리는 오늘 아침에 아침을 먹지 않았다.","this morning(과거) 부정 → didn’t[did not] + 동사원형","본책 p.28 B ‘일반동사 과거형의 부정문’ 표를 펴세요.","1) this morning(오늘 아침)이고 뒤에 동사원형 eat(먹다)이 있어요.  2) 모든 인칭에 쓰는 과거 부정이에요.","d 로 시작하는 말이고 -id 가 들어 있어요."],
 ["A: ___ Lucy go to middle school?<br>B: Yes, she does.","Does","A: Does Lucy go to middle school? B: Yes, she does.","A: Lucy는 중학교에 다니니? B: 응, 맞아.","Lucy(3인칭 단수) 현재 의문 → Does + 주어 + 동사원형?","본책 p.30 A ‘일반동사 현재형의 의문문’ 표를 펴세요.","1) Lucy는 한 명(3인칭 단수)이고 뒤에 동사원형 go 가 있어요.  2) 3인칭 단수 의문문은 Do가 아니라 Does 로 시작해요.","D 로 시작하고 -oes 로 끝나요."],
 ["A: Does Lucy go to middle school?<br>B: Yes, she ___.","does","A: Does Lucy go to middle school? B: Yes, she does.","A: Lucy는 중학교에 다니니? B: 응, 맞아.","질문 Does ~? → 대답 Yes, she does.","본책 p.30 A ‘일반동사 현재형의 의문문’ 표의 ‘긍정의 대답’ 칸을 보세요.","1) 질문이 Does Lucy ~? 이에요.  2) 긍정의 대답: Yes, 주어 + does.","d 로 시작하고 -oes 로 끝나요."],
 ["A: ___ we make a mistake?<br>B: No, we didn’t.","Did","A: Did we make a mistake? B: No, we didn’t.","A: 우리가 실수했니? B: 아니, 안 했어.","대답 didn’t(과거) → Did + 주어 + 동사원형","본책 p.30 B ‘일반동사 과거형의 의문문’ 표를 펴세요.","1) 대답이 No, we didn’t 라서 과거 질문이에요.  2) Did + 주어 + 동사원형?","D 로 시작하는 세 글자예요."]
].forEach((r,i)=>A("LR","LR",i+1,"w",{q:r[0],ans:r[1],full:r[2],ko:r[3],h:[r[5],r[6],r[7]],pen:r[4]}));

A(1,"CU",1,"c",{q:"___ you play the piano well?",opts:["Are","Can","May"],ans:"Can",full:"Can you play the piano well?",ko:"너는 피아노를 잘 칠 수 있니?",
 h:["본책 p.40 A ‘can’ 의 1 ‘~할 수 있다(능력, 가능)’ 를 펴세요.","1) 뒤에 play(연주하다)가 있어요. 피아노를 칠 수 있는지 능력을 묻는 말이에요.  2) 조동사 뒤에는 동사원형이 와요. Are 뒤에는 동사원형이 올 수 없어요.","능력을 나타내는 조동사로, C로 시작하는 세 글자예요."],
 pen:"play the piano(능력) 질문 → Can you ~?"});
A(1,"CU",2,"c",{q:"I ___ be late. The traffic is bad.",opts:["can’t","may","am able to"],ans:"may",full:"I may be late. The traffic is bad.",ko:"나는 늦을지도 모른다. 길이 막힌다.",
 h:["본책 p.40 B ‘may’ 의 1 ‘~일지도 모른다(추측)’ 를 펴세요.","1) The traffic is bad(길이 막혀요) → 늦을 수도 있다는 추측이에요.  2) 빈칸 뒤에 be 가 바로 오니 조동사가 들어가야 해요. am able to 는 be 앞에 쓰지 않아요.","추측을 나타내는 조동사로, m으로 시작하는 세 글자예요."],
 pen:"길이 막힘 → 늦을지도(추측) → may be"});
const MN=["~할 수 있다","~해도 좋다","~일지도 모른다"];
[["Ryan <u>can</u> run very fast.",0,"라이언은 매우 빨리 달릴 수 있다.","can + run(달리다) → 능력",
  "1) can 이 쓰인 문장이에요.  2) run very fast(매우 빨리 달린다) → 달리는 능력을 말해요.","can 의 1번 뜻, 능력이에요."],
 ["She <u>may</u> be in the kitchen.",2,"그녀는 부엌에 있을지도 모른다.","may be(~일지도) → 추측",
  "1) may 가 쓰인 문장이에요.  2) 허락해 주는 말이 아니라, 그녀가 부엌에 있을 수도 있다고 짐작해요.","may 의 1번 뜻, 추측이에요."],
 ["<u>Can</u> I borrow your notebook?",1,"내가 너의 공책을 빌려도 될까?","Can I ~? (허락 묻기) → 해도 좋다",
  "1) Can I ~? 는 ‘제가 ~해도 돼요?’ 하고 허락을 구하는 말이에요.  2) borrow(빌리다)는 허락을 받아야 하는 일이에요.","can 의 2번 뜻, 허가예요."],
 ["<u>May</u> I use the bathroom?",1,"제가 화장실을 써도 될까요?","May I ~? (정중한 허락 묻기) → 해도 좋다",
  "1) May I ~? 는 정중하게 허락을 구하는 말이에요.  2) 화장실을 써도 되는지 묻고 있어요.","may 의 2번 뜻, 허가예요."],
 ["<u>Can</u> you go to the concert tonight?",0,"너는 오늘 밤 콘서트에 갈 수 있니?","Can you ~? (할 수 있니) → 가능",
  "1) Can you ~? 는 ‘너 ~할 수 있니?’ 하고 가능한지 묻는 말이에요.  2) 오늘 밤 갈 수 있는 상황인지 묻고 있어요.","can 의 1번 뜻, 가능이에요."],
 ["Alice <u>may</u> live in San Francisco.",2,"앨리스는 샌프란시스코에 살지도 모른다.","may live(~일지도) → 추측",
  "1) may 가 쓰인 문장이에요.  2) 앨리스가 사는 곳을 확실히 모르고 짐작해서 말해요.","may 의 1번 뜻, 추측이에요."]
].forEach((r,i)=>A(1,"S1",i+1,"c",{q:r[0],opts:MN,ans:MN[r[1]],full:r[0].replace(/<\/?u>/g,"")+" → "+MN[r[1]],ko:r[2],
 h:["본책 p.40 A ‘can’ 과 B ‘may’ 의 뜻(1, 2)을 보세요.",r[4],r[5]],pen:r[3]}));
[["It’s too noisy outside. I ___. (sleep)","can’t sleep","It’s too noisy outside. I can’t sleep.","밖이 너무 시끄럽다. 나는 잘 수 없다.","too noisy(너무 시끄럽다) → 잠 못 잔다 → can’t + 동사원형",
  "본책 p.40 A ‘can’ 의 1 ‘~할 수 있다’ 와 부정형 can’t[cannot] 를 보세요.","1) too noisy(너무 시끄러운)이면 잘 수 있을까요, 없을까요?  2) 할 수 없다는 부정형 + sleep(자다)","c로 시작하는 줄임말 + sleep 이에요."],
 ["I’m thirsty. ___ I ___ some water? (have)","Can, have","I’m thirsty. Can I have some water?","목말라요. 물 좀 마셔도 될까요?","thirsty + 물 달라고 허락 구하기 → Can I + 동사원형",
  "본책 p.40 A ‘can’ 의 2 ‘~해도 좋다(허가)’ 를 보세요.","1) 목이 마르니(thirsty) 물을 마셔도 되는지 허락을 구해요.  2) 허락을 구하는 질문은 조동사가 주어 I 앞에 나와요.","첫 칸은 C로 시작하는 조동사, 둘째 칸은 have 예요."],
 ["Brian is smart. He ___ difficult math problems. (solve)","can solve","Brian is smart. He can solve difficult math problems.","브라이언은 똑똑하다. 그는 어려운 수학 문제를 풀 수 있다.","smart(똑똑) → 능력 → can + solve",
  "본책 p.40 A ‘can’ 의 1 ‘~할 수 있다(능력, 가능)’ 를 보세요.","1) Brian is smart(똑똑해요) → 어려운 문제도 풀 수 있어요.  2) 능력을 나타내는 조동사 뒤에 동사원형 solve(풀다)를 써요.","c로 시작하는 조동사 + solve 예요."],
 ["Sue is a great painter. She ___ beautiful pictures. (draw)","can draw","Sue is a great painter. She can draw beautiful pictures.","수는 훌륭한 화가이다. 그녀는 아름다운 그림을 그릴 수 있다.","great painter(훌륭한 화가) → 능력 → can + draw",
  "본책 p.40 A ‘can’ 의 1 ‘~할 수 있다(능력, 가능)’ 를 보세요.","1) a great painter(훌륭한 화가) → 아름다운 그림을 그릴 수 있어요.  2) 주어가 She 여도 can 은 모양이 변하지 않아요.","c로 시작하는 조동사 + draw 예요."]
].forEach((r,i)=>A(1,"S2",i+1,"w",{q:r[0],ans:r[1],full:r[2],ko:r[3],h:[r[5],r[6],r[7]],pen:r[4]}));
[["I can’t find my umbrella. It ___ in the car.","may be","I can’t find my umbrella. It may be in the car.","내 우산을 못 찾겠다. 그것은 차 안에 있을지도 모른다.","못 찾음 → 차 안에 있을지도(추측) → may be",
  "본책 p.40 B ‘may’ 의 1 ‘~일지도 모른다(추측)’ 를 보세요.","1) 우산을 못 찾아서 ‘차 안에 있을 수도 있다’고 짐작해요.  2) 보기에서 be(~이다/있다)를 고르고, may 뒤에 동사원형을 써요.","m으로 시작하는 조동사 + be 예요."],
 ["Christine is sick. She ___ to school today.","may not come","Christine is sick. She may not come to school today.","크리스틴은 아프다. 그녀는 오늘 학교에 오지 않을지도 모른다.","sick(아픔) → 안 올지도 → may not + come",
  "본책 p.40 B ‘may’ 의 1 ‘~일지도 모른다(추측)’ 예문 He may not know… 를 보세요.","1) sick(아픈) → 학교에 못 올 수도 있어요.  2) ‘~하지 않을지도 모른다’ 는 may 뒤에 not 을 붙여요.  3) 보기에서 come(오다)을 써요.","m으로 시작하는 조동사 + not + come 이에요."],
 ["A: ___ I ___ your ticket?<br>B: Sure. Here you are.","May, see","A: May I see your ticket? B: Sure. Here you are.","A: 표를 좀 봐도 될까요? B: 물론이죠. 여기 있어요.","표를 보여 달라는 정중한 질문 → May I + see",
  "본책 p.40 B ‘may’ 의 2 ‘~해도 좋다(허가, can보다 정중한 표현)’ 를 보세요.","1) 대답이 Sure. Here you are.(물론이죠. 여기 있어요.) → 허락을 구하는 질문이에요.  2) 보기에는 can 이 없으니 정중한 조동사를 써요.","첫 칸은 M으로 시작하는 조동사, 둘째 칸은 see 예요."]
].forEach((r,i)=>A(1,"S3",i+1,"w",{q:r[0],bank:["be","see","come"],ans:r[1],full:r[2],ko:r[3],h:[r[5],r[6],r[7]],pen:r[4]}));
[["나는 토요일에 너를 방문할 수 없다. (visit)<br>→ I ___ you on Saturday.","can’t visit / cannot visit","I can’t visit you on Saturday. / I cannot visit you on Saturday.","나는 토요일에 너를 방문할 수 없다.","‘~할 수 없다’ → can’t + 동사원형",
  "본책 p.40 A ‘can’ 의 1 과 I can’t[cannot] write… 예문을 보세요.","1) ‘방문할 수 없다’ 는 능력·가능의 부정이에요.  2) 조동사 뒤에는 동사원형 visit(방문하다)을 써요.","c로 시작하는 부정형 + visit 이에요."],
 ["제가 이 컴퓨터를 사용해도 될까요? (I, use)<br>→ ___ this computer?","May I use / Can I use","May I use this computer? / Can I use this computer?","제가 이 컴퓨터를 사용해도 될까요?","‘~해도 될까요?’ → May[Can] I + use",
  "본책 p.40 A ‘can’ 의 2 와 B ‘may’ 의 2 ‘~해도 좋다(허가)’ 를 보세요.","1) ‘사용해도 될까요?’ 는 허락을 구하는 질문이에요.  2) 조동사가 I 앞에 오고, I 뒤에 동사원형 use(사용하다)를 써요.","M 또는 C로 시작하는 조동사 + I + use 예요."],
 ["Tom은 맨 위 선반에 닿을 수 없었다. (reach)<br>→ Tom ___ the top shelf.","couldn’t reach","Tom couldn’t reach the top shelf.","톰은 맨 위 선반에 닿을 수 없었다.","‘~할 수 없었다’(과거) → couldn’t + 동사원형",
  "본책 p.40 can 설명 아래 ‘can의 과거형은 could이고, 과거 부정형은 couldn’t[could not]이다.’ 를 보세요.","1) ‘닿을 수 없었다’ 는 과거 이야기예요.  2) can 의 과거 부정형을 쓰고 동사원형 reach(닿다)를 이어요.","c로 시작하는 과거 부정 줄임말 + reach 예요."],
 ["나는 그 무거운 상자들을 들 수 있다. (lift)<br>→ I ___ the heavy boxes.","am able to lift","I am able to lift the heavy boxes.","나는 그 무거운 상자들을 들 수 있다.","‘~할 수 있다’ → be able to(= can) + 동사원형",
  "본책 p.40 can 설명 아래 ‘be able to는 can(~할 수 있다)과 같은 의미를 나타내며…’ 를 보세요.","1) ‘들 수 있다’ 는 능력이에요.  2) can 이나 be able to 둘 다 같은 뜻이에요. 주어 I 에 맞는 be동사를 써요.","be able to 로 쓰면 a로 시작하는 be동사로 시작하고, 마지막은 lift(들다)예요."]
].forEach((r,i)=>A(1,"S4",i+1,"w",{q:r[0],ans:r[1],full:r[2],ko:r[3],h:[r[4+1],r[4+2],r[4+3]],pen:r[4]}));

A(2,"CU",1,"c",{q:"My computer doesn’t work. I ___ to fix it.",opts:["must","have","should"],ans:"have",full:"My computer doesn’t work. I have to fix it.",ko:"내 컴퓨터가 작동하지 않는다. 나는 그것을 고쳐야 한다.",
 h:["본책 p.42 B ‘have to’ 를 펴세요.","1) 빈칸 뒤에 to 가 있어요.  2) must, should 는 뒤에 바로 동사원형이 오니 to 를 붙이지 않아요.","주어가 I 이니 h로 시작하는 네 글자 낱말이에요."],
 pen:"___ + to 모양 → have to (I 주어)"});
A(2,"CU",2,"c",{q:"You ___ eat fast food. It’s bad for you.",opts:["must","have to","shouldn’t"],ans:"shouldn’t",full:"You shouldn’t eat fast food. It’s bad for you.",ko:"너는 패스트푸드를 먹지 말아야 한다. 그것은 너에게 나쁘다.",
 h:["본책 p.42 C ‘should’ 를 펴세요.","1) It’s bad for you(너에게 나빠요) → 먹지 않는 게 좋다는 충고예요.  2) must, have to 는 ‘~해야 한다’ 라서 뜻이 반대예요.","부정형(~하지 말아야 한다)이고 s로 시작해요."],
 pen:"몸에 나쁨 → 하지 말라는 충고 → shouldn’t"});
A(2,"CU",3,"c",{q:"This book ___ be Jane’s. It has her name on it.",opts:["must","must not","shouldn’t"],ans:"must",full:"This book must be Jane’s. It has her name on it.",ko:"이 책은 제인의 것임에 틀림없다. 그 위에 그녀의 이름이 있다.",
 h:["본책 p.42 A ‘must’ 의 2 ‘~임에 틀림없다(강한 추측)’ 를 펴세요.","1) It has her name on it(그 위에 그녀 이름이 있어요) → 제인의 책이라고 거의 확신해요.  2) 그래서 ‘~임에 틀림없다’ 를 써요.","m으로 시작하고 not 이 붙지 않은 쪽이에요."],
 pen:"이름이 적혀 있음 → ~임에 틀림없다 → must be"});
A(2,"CU",4,"c",{q:"She has enough time. She ___ run.",opts:["has to","don’t have to","doesn’t have to"],ans:"doesn’t have to",full:"She has enough time. She doesn’t have to run.",ko:"그녀는 시간이 충분하다. 그녀는 뛸 필요가 없다.",
 h:["본책 p.42 B ‘have to’ 를 펴세요. 부정형 설명이 있어요.","1) enough time(충분한 시간) → 뛸 필요가 없어요.  2) 주어 She 는 3인칭 단수예요. 부정형은 don’t / doesn’t 중 어느 쪽일까요?","d로 시작하는 단어 중 3인칭 단수용(-es 모양)이에요."],
 pen:"시간 충분 → ~할 필요 없다 + She → doesn’t have to"});
[["They should ___ the rules.",["follow","followed"],"follow","그들은 그 규칙을 따라야 한다.","should 뒤 → 동사원형 follow",
  "1) should 는 조동사예요.  2) 조동사 뒤에는 항상 동사원형을 써요.","동사원형이에요. -ed 가 안 붙은 쪽이에요."],
 ["You must ___ late again.",["not be","be not"],"not be","너는 다시는 늦어서는 안 된다.","must + not + 동사원형 → must not be",
  "1) 조동사의 부정은 조동사 바로 뒤에 not 을 붙여요.  2) must not 다음에 동사원형 be 가 와요.","not 이 먼저 나오는 쪽이에요."],
 ["Susan ___ come home by 7:00 p.m.",["have to","has to"],"has to","수잔은 오후 7시까지 집에 와야 한다.","Susan(3인칭 단수) → has to",
  "1) Susan 은 한 명, 3인칭 단수예요.  2) 3인칭 단수일 때는 have to 대신 has to 를 써요.","h로 시작하고 s가 들어 있는 쪽이에요."],
 ["You ___ wait for me.",["don’t have to","have not to"],"don’t have to","너는 나를 기다릴 필요가 없다.","‘~할 필요가 없다’ → don’t have to",
  "1) 부정형은 don’t/doesn’t have to 라고 책에 나와요.  2) have not to 라는 말은 없어요.","d로 시작하는 쪽이에요."],
 ["He ___ be at the mall. I just saw him at school!",["must","cannot"],"cannot","그는 쇼핑몰에 있을 리가 없다. 나는 방금 학교에서 그를 봤다!","방금 학교에서 봄 → ~일 리가 없다 → cannot",
  "1) I just saw him at school!(방금 학교에서 봤어요) → 쇼핑몰에 있을 리가 없어요.  2) ‘~일 리가 없다’ 는 must not 이 아니라 can’t[cannot] 를 써요.","c로 시작하는 쪽이에요."],
 ["You ___ tell this to anyone. It’s a secret.",["must not","don’t have to"],"must not","너는 이것을 누구에게도 말해서는 안 된다. 그것은 비밀이다.","It’s a secret → 말하면 안 됨(강한 금지) → must not",
  "1) It’s a secret(비밀이에요) → 말하면 안 돼요.  2) ‘~해서는 안 된다(강한 금지)’ 는 must not, ‘~할 필요가 없다’ 와 달라요.","m으로 시작하는 쪽이에요."]
].forEach((r,i)=>A(2,"S1",i+1,"c",{q:r[0],opts:r[1],ans:r[2],full:r[0].replace("___",r[2]),ko:r[3],
 h:["본책 p.42 A ‘must’, B ‘have to’, C ‘should’ 의 설명을 보세요.",r[5],r[6]],pen:r[4]}));
[["We ___ take vitamins every day.","have to","We have to take vitamins every day.","우리는 매일 비타민을 먹어야 한다.","We(복수) + 해야 한다 → have to"],
 ["Dad ___ work this weekend.","has to","Dad has to work this weekend.","아빠는 이번 주말에 일해야 한다.","Dad(3인칭 단수) + 해야 한다 → has to"],
 ["You ___ be careful with scissors.","have to","You have to be careful with scissors.","너는 가위를 조심해야 한다.","You + 해야 한다 → have to"],
 ["She ___ leave early tomorrow.","has to","She has to leave early tomorrow.","그녀는 내일 일찍 떠나야 한다.","She(3인칭 단수) + 해야 한다 → has to"],
 ["Kevin ___ buy a new T-shirt.","has to","Kevin has to buy a new T-shirt.","케빈은 새 티셔츠를 사야 한다.","Kevin(3인칭 단수) + 해야 한다 → has to"]
].forEach((r,i)=>{const sg=r[1]=="has to";A(2,"S2",i+1,"w",{q:r[0],ans:r[1],full:r[2],ko:r[3],
 h:["본책 p.42 B ‘have to’ 를 펴세요. 주어가 3인칭 단수일 때의 설명이 있어요.",sg?"1) 주어 "+r[0].split(" ")[0]+" 는 한 명, 3인칭 단수예요.  2) 3인칭 단수일 때는 have to 대신 다른 모양을 써요.":"1) 주어 "+r[0].split(" ")[0]+" 는 3인칭 단수가 아니에요.  2) 3인칭 단수가 아니면 기본 모양을 써요.",sg?"h로 시작하는 세 글자 낱말 + to 예요.":"h로 시작하는 네 글자 낱말 + to 예요."],pen:r[4]})});
[["The floor is slippery. You ___. (run)","must not run","The floor is slippery. You must not run.","바닥이 미끄럽다. 너는 뛰면 안 된다.","slippery(미끄러움) → 뛰면 안 됨 → must not + run",
  "1) slippery(미끄러운) 바닥에서는 뛰면 안 돼요.  2) 강한 금지 ‘~해서는 안 된다’ 는 must not + 동사원형이에요.","m으로 시작하는 두 낱말 + run 이에요."],
 ["You can delete that email. You ___ it. (keep)","don’t have to keep","You can delete that email. You don’t have to keep it.","너는 그 이메일을 지워도 된다. 너는 그것을 보관할 필요가 없다.","지워도 됨 → 보관할 필요 없음 → don’t have to keep",
  "1) You can delete(지워도 돼요) → 보관해야 할 의무가 없어요.  2) ‘~할 필요가 없다’ 는 don’t/doesn’t have to 예요. 주어는 You 예요.","d로 시작하는 세 낱말 + keep 이에요."],
 ["The light is red. You ___ the street. (cross)","must not cross","The light is red. You must not cross the street.","신호등이 빨간불이다. 너는 길을 건너면 안 된다.","빨간불 → 건너면 안 됨 → must not + cross",
  "1) The light is red(빨간불이에요) → 건너면 안 돼요.  2) 강한 금지는 must not + 동사원형이에요.","m으로 시작하는 두 낱말 + cross 예요."],
 ["Emily doesn’t have a class tomorrow. She ___ early. (get up)","doesn’t have to get up","Emily doesn’t have a class tomorrow. She doesn’t have to get up early.","에밀리는 내일 수업이 없다. 그녀는 일찍 일어날 필요가 없다.","수업 없음 → 일찍 일어날 필요 없음 → doesn’t have to + get up",
  "1) 수업이 없으니 일찍 일어날 필요가 없어요. ‘금지’ 가 아니에요.  2) 주어 She 는 3인칭 단수이니 부정형은 doesn’t have to 예요.","d로 시작하는 세 낱말 + get up 이에요."]
].forEach((r,i)=>A(2,"S3",i+1,"w",{q:r[0],ans:r[1],full:r[2],ko:r[3],
 h:["본책 p.42 A ‘must’ 의 1(must not)과 B ‘have to’ 의 부정형 설명을 보세요.",r[5],r[6]],pen:r[4]}));
[["Tim은 그녀에게 미안하다고 말해야 한다. (say)<br>→ Tim ___ sorry to her.","should say","Tim should say sorry to her.","팀은 그녀에게 미안하다고 말해야 한다.","‘~해야 한다’(충고) → should + say",
  "본책 p.42 C ‘should’ 를 보세요.","1) ‘말해야 한다’ 는 충고예요. 보기에서 ‘~해야 한다’ 를 골라요.  2) 조동사 뒤에 동사원형 say(말하다)를 써요.","s로 시작하는 보기 + say 예요. 부정형이 아니에요."],
 ["너는 시간을 낭비해서는 안 된다. (waste)<br>→ You ___ your time.","should not waste","You should not waste your time.","너는 시간을 낭비해서는 안 된다.","‘~하지 말아야 한다’ → should not + waste",
  "본책 p.42 C ‘should’ 의 You shouldn’t[should not] believe him. 을 보세요.","1) ‘낭비해서는 안 된다’ 는 부정이에요. 보기에서 부정형을 골라요.  2) 그 뒤에 동사원형 waste(낭비하다)를 써요.","s로 시작하는 두 낱말 + waste 예요."],
 ["그는 나를 도와줄 필요가 없다. (help)<br>→ He ___ me.","doesn’t have to help","He doesn’t have to help me.","그는 나를 도와줄 필요가 없다.","‘~할 필요가 없다’ + He → doesn’t have to + help",
  "본책 p.42 B ‘have to’ 의 부정형 설명을 보세요.","1) ‘도와줄 필요가 없다’ 는 필요가 없다는 뜻이에요.  2) He 는 3인칭 단수이니 보기에서 doesn’t 로 시작하는 말을 골라 help(돕다)를 이어요.","d로 시작하는 세 낱말 + help 예요."]
].forEach((r,i)=>A(2,"S4",i+1,"w",{q:r[0],bank:["should","doesn’t have to","should not"],ans:r[1],full:r[2],ko:r[3],
 h:[r[5],r[6],r[7]],pen:r[4]}));
// ---------- GRAMMAR FOR WRITING ----------
[["Paul은 행복한 것이 틀림없다. (be, happy)<br>→ Paul ___.","must be happy","Paul must be happy.","폴은 행복한 것이 틀림없다.","‘~임에 틀림없다’ → must + be",
  "본책 p.42 A ‘must’ 의 2 ‘~임에 틀림없다(강한 추측)’ 를 보세요.","1) ‘행복한 것이 틀림없다’ 는 강한 추측이에요.  2) 조동사 뒤에 동사원형 be 를 써요. 주어가 Paul 이어도 must 는 변하지 않아요.","m으로 시작하는 조동사 + be + happy 예요."],
 ["제가 당신의 우산을 빌려도 될까요? (I, borrow)<br>→ ___ your umbrella?","Can I borrow / May I borrow","Can I borrow your umbrella? / May I borrow your umbrella?","제가 당신의 우산을 빌려도 될까요?","‘~해도 될까요?’ → Can[May] I + borrow",
  "본책 p.40 A ‘can’ 의 2 와 B ‘may’ 의 2 ‘~해도 좋다(허가)’ 를 보세요.","1) ‘빌려도 될까요?’ 는 허락을 구하는 질문이에요.  2) 조동사 + I + 동사원형 borrow(빌리다) 순서예요.","C 또는 M으로 시작하는 조동사 + I + borrow 예요."],
 ["너는 그 질문에 대답할 수 있니? (you, answer)<br>→ ___ the question?","Can you answer / Are you able to answer","Can you answer the question? / Are you able to answer the question?","너는 그 질문에 대답할 수 있니?","‘~할 수 있니?’ → Can you ~? / Are you able to ~?",
  "본책 p.40 A ‘can’ 의 1 과 아래 be able to 설명을 보세요.","1) ‘대답할 수 있니?’ 는 능력을 묻는 질문이에요.  2) can 으로 쓰거나 be able to 로 써도 돼요. 질문이면 조동사나 be동사가 you 앞에 나와요.","C로 시작하는 Can you + answer, 또는 A로 시작하는 Are you able to + answer 예요."],
 ["그녀는 회의에 늦을지도 모른다. (be late)<br>→ She ___ for the meeting.","may be late","She may be late for the meeting.","그녀는 회의에 늦을지도 모른다.","‘~일지도 모른다’ → may + be late",
  "본책 p.40 B ‘may’ 의 1 ‘~일지도 모른다(추측)’ 를 보세요.","1) ‘늦을지도 모른다’ 는 추측이에요.  2) 조동사 뒤에는 동사원형을 써요. be late 에서 동사원형은 be 예요.","m으로 시작하는 조동사 + be late 예요."],
 ["너는 밤에 소음을 내서는 안 된다. (make noise)<br>→ You ___ at night.","must not make noise / should not make noise","You must not make noise at night. / You should not make noise at night.","너는 밤에 소음을 내서는 안 된다.","‘~해서는 안 된다’ → must not / should not + make",
  "본책 p.42 A ‘must’ 의 1 ‘must not(강한 금지)’ 와 C ‘should’ 의 부정형을 보세요.","1) ‘내서는 안 된다’ 는 금지예요.  2) must not 이나 should not 둘 중 하나 + 동사원형 make noise 를 써요.","m 또는 s로 시작하는 부정형 + make noise 예요."],
 ["너는 안전벨트를 매야 한다. (wear a seat belt)<br>→ You ___.","should wear a seat belt / must wear a seat belt / have to wear a seat belt","You should wear a seat belt. / You must wear a seat belt. / You have to wear a seat belt.","너는 안전벨트를 매야 한다.","‘~해야 한다’ → should / must / have to + wear",
  "본책 p.42 A ‘must’, B ‘have to’, C ‘should’ 를 보세요.","1) ‘매야 한다’ 는 의무나 충고예요.  2) must, have to, should 중 하나를 쓰고 동사원형 wear(착용하다)를 이어요.","세 가지 중 하나 + wear a seat belt 예요."],
 ["우리는 팁을 남길 필요가 없다. (leave a tip)<br>→ We ___.","don’t have to leave a tip","We don’t have to leave a tip.","우리는 팁을 남길 필요가 없다.","‘~할 필요가 없다’ → don’t have to + leave",
  "본책 p.42 B ‘have to’ 의 부정형 설명을 보세요.","1) ‘남길 필요가 없다’ 는 필요가 없다는 뜻이에요.  2) 주어 We 는 복수이니 don’t have to + 동사원형 leave a tip 을 써요.","d로 시작하는 세 낱말 + leave a tip 이에요."]
].forEach((r,i)=>A("GW","A",i+1,"w",{q:r[0],ans:r[1],full:r[2],ko:r[3],h:[r[5],r[6],r[7]],pen:r[4]}));
[["너는 첼로를 연주할 수 있니? (you, play, can, the cello)<br>→ ___?","Can you play the cello","Can you play the cello?","너는 첼로를 연주할 수 있니?","질문 : Can + 주어 + 동사원형 ~?",
  "본책 p.40 A ‘can’ 의 예문 Can you cook spaghetti? 를 보세요.","1) ‘~할 수 있니?’ 질문이라 can 이 맨 앞에 나와요.  2) can + you + 동사원형 play + the cello 순서예요.","첫 낱말은 대문자 C 로 시작해요."],
 ["Jessica가 거짓말쟁이일 리가 없다. (can’t, a liar, be)<br>→ Jessica ___.","can’t be a liar","Jessica can’t be a liar.","제시카가 거짓말쟁이일 리가 없다.","‘~일 리가 없다’ → can’t + be",
  "본책 p.42 A ‘must’ 의 cf. ‘~일 리가 없다’ 는 can’t[cannot] 를 쓴다 를 보세요.","1) ‘~일 리가 없다’ 는 can’t 를 써요.  2) can’t + 동사원형 be + a liar 순서예요.","c로 시작하는 can’t 로 시작해요."],
 ["제가 이 신발을 신어봐도 되나요? (I, try on, may, these shoes)<br>→ ___?","May I try on these shoes","May I try on these shoes?","제가 이 신발을 신어봐도 되나요?","허락 질문 : May + I + 동사원형",
  "본책 p.40 B ‘may’ 의 2 예문 May I speak to Lily now? 를 보세요.","1) ‘신어봐도 되나요?’ 는 허락을 구하는 질문이에요.  2) may + I + try on + these shoes 순서예요.","첫 낱말은 대문자 M 으로 시작해요."],
 ["Nancy는 수화를 사용할 수 있다. (able, to, is, use)<br>→ Nancy ___ sign language.","is able to use","Nancy is able to use sign language.","낸시는 수화를 사용할 수 있다.","‘~할 수 있다’ → is able to + 동사원형",
  "본책 p.40 can 설명 아래 be able to 예문 Steve is able to speak… 를 보세요.","1) 주어 Nancy 는 3인칭 단수예요.  2) be able to 에서 be동사가 주어에 맞게 바뀌고, 뒤에 동사원형 use 가 와요.","i로 시작하는 be동사 + able to + use 예요."],
 ["너는 남동생과 싸워서는 안 된다. (fight with, should, your brother, not)<br>→ You ___.","should not fight with your brother","You should not fight with your brother.","너는 남동생과 싸워서는 안 된다.","‘~하지 말아야 한다’ → should + not + 동사원형",
  "본책 p.42 C ‘should’ 의 You shouldn’t[should not] believe him. 을 보세요.","1) 부정은 조동사 바로 뒤에 not 을 붙여요.  2) should + not + fight with + your brother 순서예요.","s로 시작하는 should 로 시작해요."],
 ["나는 오늘 Gary에게 전화해야 한다. (have, I, Gary, call, to)<br>→ ___ today.","I have to call Gary","I have to call Gary today.","나는 오늘 게리에게 전화해야 한다.","‘~해야 한다’ → have to + 동사원형",
  "본책 p.42 B ‘have to’ 를 보세요.","1) ‘~해야 한다’ 는 have to 예요. 주어가 I 이니 have 를 써요.  2) I + have to + 동사원형 call + Gary 순서예요.","첫 낱말은 대문자 I 예요."]
].forEach((r,i)=>A("GW","B",i+1,"w",{q:r[0],ans:r[1],full:r[2],ko:r[3],h:[r[5],r[6],r[7]],pen:r[4]}));
[["A: I don’t have enough money for that book!<br>B: It’s okay. I ___ it for you. (buy)","can buy","A: I don’t have enough money for that book! B: It’s okay. I can buy it for you.","A: 나는 저 책을 살 돈이 충분하지 않아! B: 괜찮아. 내가 너 대신 살 수 있어.","돈이 모자람 → 내가 살 수 있다 → can + buy",
  "본책 p.40 A ‘can’ 의 1 ‘~할 수 있다(능력, 가능)’ 를 보세요.","1) A가 돈이 부족하다고 해요. B는 대신 살 수 있다고 말해요.  2) 보기 중 ‘~할 수 있다’ 를 고르고, 한 번씩만 써야 해요.","c로 시작하는 조동사 + buy 예요."],
 ["A: ___ the window? (I, open)<br>B: Yes, of course.","May I open","A: May I open the window? B: Yes, of course.","A: 창문을 열어도 될까요? B: 네, 물론이죠.","허락 질문 → May + I + open",
  "본책 p.40 B ‘may’ 의 2 예문 May I speak to Lily now? 를 보세요.","1) 대답이 Yes, of course. → 허락을 구하는 질문이에요.  2) 보기에 can 은 이미 1번에 썼어요(한 번씩만). 정중한 조동사를 써요.","M으로 시작하는 조동사 + I + open 이에요."],
 ["A: Do you know that boy?<br>B: He ___ Helen’s brother. He looks like her. (be)","must be","A: Do you know that boy? B: He must be Helen’s brother. He looks like her.","A: 저 남자아이를 아니? B: 그는 헬렌의 오빠(남동생)임에 틀림없어. 그는 그녀를 닮았어.","그녀를 닮음 → ~임에 틀림없다 → must + be",
  "본책 p.42 A ‘must’ 의 2 ‘~임에 틀림없다(강한 추측)’ 를 보세요.","1) He looks like her(그녀를 닮았어요) → 그녀의 가족임에 틀림없어요.  2) 강한 추측의 조동사 + 동사원형 be 를 써요.","m으로 시작하는 조동사 + be 예요."],
 ["A: The air is bad these days.<br>B: Yes. ___ a mask. (you, wear)","You have to wear","A: The air is bad these days. B: Yes. You have to wear a mask.","A: 요즘 공기가 나빠. B: 응. 너는 마스크를 써야 해.","공기가 나쁨 → 써야 한다 → have to + wear",
  "본책 p.42 B ‘have to’ 를 보세요.","1) 공기가 나쁘니 마스크를 써야 해요.  2) 남은 보기는 have to 하나예요. 주어 you 에 맞춰 문장 맨 앞부터 써요.","Y로 시작하는 You + h로 시작하는 두 낱말 + wear 예요."]
].forEach((r,i)=>A("GW","C",i+1,"w",{q:r[0],bank:["must","can","have to","may"],ans:r[1],full:r[2],ko:r[3],h:[r[5],r[6],r[7]],pen:r[4]}));
[["(그림 1: 초록 동그라미 안에 강아지와 함께 있는 사람)<br>You ___. (can)","can bring your pets","You can bring your pets.","너는 반려동물을 데려와도 된다.","초록 표시(해도 됨) + can → can bring your pets",
  "본책 p.40 A ‘can’ 의 2 ‘~해도 좋다(허가)’ 를 보세요.","1) 그림 1은 초록 동그라미예요. 강아지와 함께 있는 모습 → 데려와도 된다는 뜻이에요.  2) ( ) 안의 can 뒤에 동사원형 bring 을 써요.","조동사는 ( ) 안에 있어요. 그 뒤에 b로 시작하는 동사 + your pets 예요."],
 ["(그림 2: 빨간 동그라미 안에 자전거를 타는 사람, 금지 표시)<br>You ___. (must)","must not ride a bike","You must not ride a bike.","너는 자전거를 타서는 안 된다.","빨간 금지 표시 + must → must not ride a bike",
  "본책 p.42 A ‘must’ 의 1 ‘must not(강한 금지)’ 를 보세요.","1) 그림 2는 빨간 동그라미에 사선이에요. 자전거를 타면 안 된다는 뜻이에요.  2) must 를 쓰되 금지이니 not 을 붙이고 동사원형 ride 를 써요.","m으로 시작하는 두 낱말 + r로 시작하는 동사 + a bike 예요."],
 ["(그림 3: 초록 동그라미 안에 쓰레기통에 쓰레기를 버리는 사람)<br>You ___. (have to)","have to put trash in the bin","You have to put trash in the bin.","너는 쓰레기를 쓰레기통에 버려야 한다.","초록 표시(해야 함) + have to → have to put trash in the bin",
  "본책 p.42 B ‘have to’ 를 보세요.","1) 그림 3은 쓰레기를 쓰레기통에 넣는 모습이에요. 해야 하는 일이에요.  2) have to 뒤에 동사원형 put 을 써요.","조동사는 ( ) 안에 있어요. 그 뒤에 p로 시작하는 동사 + trash in the bin 이에요."],
 ["(그림 4: 빨간 동그라미 안에 꽃을 꺾는 손, 금지 표시)<br>You ___. (should)","shouldn’t pick the flowers / should not pick the flowers","You shouldn’t pick the flowers. / You should not pick the flowers.","너는 꽃을 꺾어서는 안 된다.","빨간 금지 표시 + should → should not pick",
  "본책 p.42 C ‘should’ 의 You shouldn’t[should not] believe him. 을 보세요.","1) 그림 4는 빨간 동그라미에 사선이에요. 꽃을 꺾으면 안 된다는 뜻이에요.  2) should 를 쓰되 금지이니 not 을 붙이고 동사원형 pick 을 써요.","s로 시작하는 조동사 + not(또는 줄임말) + p로 시작하는 동사 + the flowers 예요."]
].forEach((r,i)=>A("GW","D",i+1,"w",{q:r[0],bank:["ride a bike","bring your pets","put trash in the bin","pick the flowers"],ans:r[1],full:r[2],ko:r[3],h:[r[5],r[6],r[7]],pen:r[4]}));

const R=(n,o)=>A("RT","RT",n,o.kind||"c",o);
R(1,{q:"You <u>may</u> go home now.",opts:["① are","② do","③ can","④ must","⑤ should"],ans:"③ can",full:"You may go home now.",ko:"너는 지금 집에 가도 좋다.",
 h:["본책 p.40 B ‘may’ 의 2 ‘~해도 좋다(허가)’ 를 펴세요.","1) You may go home now = 지금 집에 가도 좋다(허락).  2) 허락의 뜻을 가진 조동사를 보기에서 찾아요. A ‘can’ 의 2 도 같은 뜻이에요.","c로 시작하는 세 글자예요."],
 pen:"may(허가) = can(허가)"});
R(2,{q:"You <u>must</u> come to class on time.",opts:["① can","② could","③ may","④ have to","⑤ are able to"],ans:"④ have to",full:"You must come to class on time.",ko:"너는 수업에 제시간에 와야 한다.",
 h:["본책 p.42 B ‘have to’ 를 펴세요.","1) must 는 ‘~해야 한다(의무)’ 예요.  2) ‘must(~해야 한다)와 같은 의미’ 라고 책에 나온 말을 찾아요.","h로 시작하고 to 가 붙어요."],
 pen:"must(의무) = have to"});
R(3,{q:"Andrew <u>can</u> do magic tricks.",opts:["① may","② must","③ should","④ has to","⑤ is able to"],ans:"⑤ is able to",full:"Andrew can do magic tricks.",ko:"앤드루는 마술을 할 수 있다.",
 h:["본책 p.40 A ‘can’ 설명 아래 ‘be able to는 can(~할 수 있다)과 같은 의미’ 를 보세요.","1) can 은 여기서 ‘~할 수 있다(능력)’ 예요.  2) 주어 Andrew 는 3인칭 단수예요. be동사가 주어에 맞게 쓰인 보기를 찾아요.","i로 시작해요."],
 pen:"can(능력) = be able to"});
R(4,{q:"A: ___ I use the bathroom?<br>B: Sure. It’s over there.",opts:["① Am","② Do","③ Can","④ Must","⑤ Should"],ans:"③ Can",full:"A: Can I use the bathroom? B: Sure. It’s over there.",ko:"A: 제가 화장실을 써도 될까요? B: 물론이죠. 저쪽에 있어요.",
 h:["본책 p.40 A ‘can’ 의 2 ‘~해도 좋다(허가)’ 를 펴세요.","1) 대답이 Sure(물론이죠) → 허락을 구하는 질문이에요.  2) 뒤에 동사원형 use 가 오니 조동사가 와야 해요. 허락을 구하는 조동사는?","C 로 시작하는 세 글자예요."],
 pen:"Sure(허락 대답) → Can I ~?"});
R(5,{q:"This computer doesn’t work now. It ___ have a problem.",opts:["① can’t","② has to","③ may","④ is able to","⑤ shouldn’t"],ans:"③ may",full:"This computer doesn’t work now. It may have a problem.",ko:"이 컴퓨터가 지금 작동하지 않는다. 그것에 문제가 있을지도 모른다.",
 h:["본책 p.40 B ‘may’ 의 1 ‘~일지도 모른다(추측)’ 를 펴세요.","1) 컴퓨터가 작동하지 않으니 ‘문제가 있을지도 모른다’ 는 추측이에요.  2) 뒤에 동사원형 have 가 있으니 has to, is able to 처럼 to 가 붙은 말은 맞지 않아요.","m으로 시작하는 세 글자예요."],
 pen:"작동 안 함 → 문제 있을지도 → may"});
R(6,{q:"•We ___ protect the earth.<br>•Joe always talks about baseball. He ___ like baseball.",opts:["① can","② may","③ must","④ have to","⑤ is able to"],ans:"③ must",full:"We must protect the earth. / Joe always talks about baseball. He must like baseball.",ko:"우리는 지구를 보호해야 한다. / 조는 항상 야구 이야기를 한다. 그는 야구를 매우 좋아하는 것임에 틀림없다.",
 h:["본책 p.42 A ‘must’ 의 1 과 2 를 펴세요.","1) 첫 문장은 ‘보호해야 한다(의무)’, 둘째 문장은 ‘좋아하는 것임에 틀림없다(강한 추측)’ 예요.  2) 두 뜻을 모두 가진 조동사를 찾아요.","m으로 시작하는 네 글자예요."],
 pen:"must = ~해야 한다(의무) / ~임에 틀림없다(추측)"});
R(7,{kind:"w",q:"Jason’s team won the game. He ___ be happy.",ans:"must",full:"Jason’s team won the game. He must be happy.",ko:"제이슨의 팀이 경기를 이겼다. 그는 행복할 것이 틀림없다.",
 h:["본책 p.42 A ‘must’ 의 2 ‘~임에 틀림없다(강한 추측)’ 를 펴세요.","1) 팀이 경기를 이겼으니 행복한 것이 거의 확실해요.  2) ‘~임에 틀림없다’ 에 쓰는 조동사 + 동사원형 be 예요.","m으로 시작하는 네 글자예요."],
 pen:"이겼음 → 행복함이 틀림없다 → must be"});
R(8,{kind:"w",q:"Jenna hurt her leg. She ___ walk very well.",ans:"can’t / cannot",full:"Jenna hurt her leg. She can’t walk very well. / Jenna hurt her leg. She cannot walk very well.",ko:"제나는 다리를 다쳤다. 그녀는 잘 걸을 수 없다.",
 h:["본책 p.40 A ‘can’ 의 1 과 부정형 can’t[cannot] 를 펴세요.","1) 다리를 다쳤으니 잘 걸을 수 없어요.  2) ‘~할 수 없다’ 는 can 의 부정형이에요.","c로 시작하는 줄임말이에요(붙여 써도 돼요)."],
 pen:"다리 다침 → ~할 수 없다 → can’t"});
R(9,{kind:"w",q:"You should be careful of the dog. He ___ bite you.",ans:"may",full:"You should be careful of the dog. He may bite you.",ko:"너는 그 개를 조심해야 한다. 그가 너를 물지도 모른다.",
 h:["본책 p.40 B ‘may’ 의 1 ‘~일지도 모른다(추측)’ 를 펴세요.","1) 개를 조심하라는 이유는 ‘물지도 모르기’ 때문이에요.  2) ‘~일지도 모른다’ 에 쓰는 조동사 + 동사원형 bite 예요.","m으로 시작하는 세 글자예요."],
 pen:"조심해야 함 → 물지도 모른다 → may bite"});
R(10,{q:"밑줄 친 부분의 의미가 나머지 넷과 <u>다른</u> 것을 고르시오.",opts:["① <u>Can</u> you make Korean food?","② <u>Can</u> I stay in your house?","③ <u>Can</u> they get here by 2:00 p.m.?","④ He <u>can</u> play tennis very well.","⑤ I <u>can</u> find the information on the internet."],ans:"② <u>Can</u> I stay in your house?",full:"② Can I stay in your house?",ko:"② 제가 당신의 집에 머물러도 될까요? (나머지는 ‘~할 수 있다’ 뜻이고 ②만 ‘~해도 좋다(허가)’ 뜻이다.)",
 h:["본책 p.40 A ‘can’ 의 1 ‘~할 수 있다’ 와 2 ‘~해도 좋다(허가)’ 를 펴세요.","1) 밑줄 친 말은 모두 can 이에요.  2) 보기마다 ‘할 수 있다(능력, 가능)’ 인지 ‘해도 된다(허락)’ 인지 따져 봐요.","I 가 주어이고 허락을 구하는 질문 하나가 다른 뜻이에요."],
 pen:"Can I ~? 허락 → 나머지는 능력·가능"});
R(11,{q:"밑줄 친 부분의 의미가 나머지 넷과 <u>다른</u> 것을 고르시오.",opts:["① He <u>must</u> listen to his father.","② I <u>must</u> clean my room. It’s a mess.","③ You <u>must</u> go to bed now. It’s late.","④ This book <u>must</u> be interesting. Everybody likes it.","⑤ You <u>must</u> bring your passport."],ans:"④ This book <u>must</u> be interesting. Everybody likes it.",full:"④ This book must be interesting. Everybody likes it.",ko:"④ 이 책은 재미있음에 틀림없다. 모든 사람이 그것을 좋아한다. (나머지는 ‘~해야 한다(의무)’ 뜻이고 ④만 ‘~임에 틀림없다(강한 추측)’ 뜻이다.)",
 h:["본책 p.42 A ‘must’ 의 1 ‘~해야 한다(의무)’ 와 2 ‘~임에 틀림없다(강한 추측)’ 를 펴세요.","1) 밑줄 친 말은 모두 must 예요.  2) 보기마다 ‘해야 한다’ 인지 ‘틀림없다’ 인지 따져 봐요. 뒤에 동사 하나가 아니라 ‘상태’ 가 나오는 문장이 있어요.","This book 이 주어이고 be 가 따라오는 문장이에요."],
 pen:"This book must be ~ (추측) ↔ 나머지는 의무"});
R(12,{q:"밑줄 친 부분의 의미가 나머지 넷과 <u>다른</u> 것을 고르시오.",opts:["① They <u>may</u> be busy.","② He <u>may</u> call you tonight.","③ Tony <u>may</u> have the key.","④ You <u>may</u> take a break.","⑤ Judy <u>may</u> be with her friends."],ans:"④ You <u>may</u> take a break.",full:"④ You may take a break.",ko:"④ 너는 쉬어도 좋다. (나머지는 ‘~일지도 모른다(추측)’ 뜻이고 ④만 ‘~해도 좋다(허가)’ 뜻이다.)",
 h:["본책 p.40 B ‘may’ 의 1 ‘~일지도 모른다(추측)’ 와 2 ‘~해도 좋다(허가)’ 를 펴세요.","1) 밑줄 친 말은 모두 may 예요.  2) 보기마다 ‘일지도 모른다(짐작)’ 인지 ‘해도 좋다(허락)’ 인지 따져 봐요.","주어가 You 이고 쉬어도 좋다고 허락해 주는 문장이에요."],
 pen:"You may take ~ (허락) ↔ 나머지는 추측"});
R(13,{q:"다음 중 밑줄 친 부분이 <u>잘못된</u> 것은?",opts:["① You <u>can watch</u> TV after dinner.","② Peter <u>may join</u> our tennis club.","③ Sam <u>have to read</u> the report again.","④ I <u>must save</u> money for the future.","⑤ You <u>should wait</u> in line here."],ans:"③ Sam <u>have to read</u> the report again.",full:"Sam has to read the report again.",ko:"샘은 그 보고서를 다시 읽어야 한다. (주어가 3인칭 단수이므로 has to 를 쓴다.)",
 h:["본책 p.42 B ‘have to’ 를 펴세요. ‘주어가 3인칭 단수일 때는 has to를 쓴다’ 가 있어요.","1) 보기마다 주어와 조동사를 살펴봐요.  2) can, may, must, should 는 모양이 안 변해요. have to 만 주어에 따라 바뀌어요.","주어가 3인칭 단수인 문장의 조동사를 확인해 보세요."],
 pen:"Sam(3인칭 단수) → have to → has to"});
R(14,{q:"다음 중 대화가 자연스럽지 <u>않은</u> 것은?",opts:["① A: May I see your picture? B: Yes. You may see it.","② A: Do we have to pay now? B: No, you can pay later.","③ A: Can I borrow your bike? B: Sorry, you can’t.","④ A: Should I watch that movie? B: Yes, you should. It’s great.","⑤ A: Must I wear a suit today? B: No, you must not. You can wear jeans."],ans:"⑤ A: Must I wear a suit today? B: No, you must not. You can wear jeans.",full:"A: Must I wear a suit today? B: No, you don’t have to. You can wear jeans.",ko:"A: 제가 오늘 정장을 입어야 하나요? B: 아니요, 입을 필요 없어요. 청바지를 입어도 돼요. (must not 은 ‘~해서는 안 된다’ 라서 어색하고, don’t have to 가 알맞다.)",
 h:["본책 p.42 A ‘must’ 의 1 must not(강한 금지)과 B ‘have to’ 의 don’t have to(~할 필요가 없다)를 펴세요.","1) 각 대화의 질문과 대답이 이어지는지 확인해요.  2) 마지막 대답이 ‘청바지를 입어도 돼요’ 이니 정장을 입을 필요가 없다는 뜻이어야 해요.","질문이 Must I ~? 인 대화를 보세요."],
 pen:"입을 필요 없음 → don’t have to (must not X)"});
R(15,{kind:"w",q:"You ___ throw trash on the street.",bank:["must not","can’t","don’t have to"],ans:"must not",full:"You must not throw trash on the street.",ko:"너는 길에 쓰레기를 버려서는 안 된다.",
 h:["본책 p.42 A ‘must’ 의 1 ‘must not은 ~해서는 안 된다(강한 금지)’ 를 펴세요.","1) 길에 쓰레기를 버리면 안 돼요 → 금지예요.  2) 보기 세 개 중 ‘~해서는 안 된다’ 를 골라요.","m으로 시작하는 두 낱말이에요."],
 pen:"버리면 안 됨(금지) → must not"});
R(16,{kind:"w",q:"You ___ buy a ticket. The concert is free.",bank:["must not","can’t","don’t have to"],ans:"don’t have to",full:"You don’t have to buy a ticket. The concert is free.",ko:"너는 표를 살 필요가 없다. 그 콘서트는 무료이다.",
 h:["본책 p.42 B ‘have to’ 의 부정형 ‘don’t/doesn’t have to는 ~할 필요가 없다’ 를 펴세요.","1) The concert is free(무료예요) → 표를 살 필요가 없어요.  2) 보기 세 개 중 ‘~할 필요가 없다’ 를 골라요.","d로 시작하는 세 낱말이에요."],
 pen:"무료 → 살 필요 없음 → don’t have to"});
R(17,{kind:"w",q:"Mr. Smith ___ see you now. He is in a meeting.",bank:["must not","can’t","don’t have to"],ans:"can’t",full:"Mr. Smith can’t see you now. He is in a meeting.",ko:"스미스 씨는 지금 당신을 만날 수 없다. 그는 회의 중이다.",
 h:["본책 p.40 A ‘can’ 의 1 과 부정형 can’t[cannot] 를 펴세요.","1) He is in a meeting(회의 중이에요) → 지금 만날 수 없어요.  2) 보기 세 개 중 ‘~할 수 없다’ 를 골라요.","c로 시작하는 줄임말이에요."],
 pen:"회의 중 → ~할 수 없다 → can’t"});
R(18,{q:"빈칸에 들어갈 말로 알맞지 <u>않은</u> 것은?<br>A: I didn’t eat anything today.<br>B: Oh, really? ___.",opts:["① You must be very hungry.","② You can’t be very hungry.","③ You should eat some food.","④ You have to eat some food.","⑤ I can cook some food for you."],ans:"② You can’t be very hungry.",full:"A: I didn’t eat anything today. B: Oh, really? You must be very hungry.",ko:"A: 나는 오늘 아무것도 먹지 않았어. B: 아, 정말? 너는 매우 배고픈 것이 틀림없어. (②는 ‘매우 배고플 리가 없다’ 라서 문맥에 맞지 않는다.)",
 h:["본책 p.42 A ‘must’ 의 cf. ‘~일 리가 없다’ 는 can’t[cannot] 를 쓴다 를 펴세요.","1) A가 오늘 아무것도 먹지 않았다고 해요 → 배고픈 것이 당연해요.  2) 보기마다 이 상황과 이어지는지 따져 봐요. ‘~일 리가 없다’ 가 들어간 보기가 어색해요.","can’t 가 들어간 보기를 보세요."],
 pen:"안 먹음 → 배고픈 게 당연 → can’t be (X)"});
R(19,{q:"다음 우리말을 영어로 바르게 옮긴 것은?<br>나는 시험을 통과하지 못할지도 모른다.",opts:["① I can’t pass the exam.","② I may not pass the exam.","③ I must not pass the exam.","④ I shouldn’t pass the exam.","⑤ I don’t have to pass the exam."],ans:"② I may not pass the exam.",full:"I may not pass the exam.",ko:"나는 시험을 통과하지 못할지도 모른다.",
 h:["본책 p.40 B ‘may’ 의 1 ‘~일지도 모른다(추측)’ 와 예문 He may not know the password. 를 펴세요.","1) ‘못할지도 모른다’ 는 추측이에요. ‘~하지 않을지도 모른다’ 는 부정 추측이에요.  2) 보기마다 뜻을 비교해 봐요. 금지·불필요·불가능과 달라요.","I 로 시작하고, m 으로 시작하는 조동사 + not 이에요."],
 pen:"~하지 못할지도 → may not + 동사원형"});
R(20,{kind:"w",q:"그는 그의 어머니를 돌봐드려야 한다. (밑줄 친 부분을 바르게 고치기)<br>He <u>have to take care of</u> his mother.",ans:"has to take care of / must take care of / should take care of",full:"He has to take care of his mother. / He must take care of his mother. / He should take care of his mother.",ko:"그는 그의 어머니를 돌봐드려야 한다.",
 h:["본책 p.42 B ‘have to’ 의 ‘주어가 3인칭 단수일 때는 has to를 쓴다’ 를 펴세요.","1) 주어 He 는 3인칭 단수예요.  2) have to 를 주어에 맞게 고치거나, 같은 뜻의 must, should 로 바꿔도 돼요.","h로 시작하는 세 글자 낱말로 고쳐요. 나머지 take care of 는 그대로예요."],
 pen:"He(3인칭 단수) → have to → has to"});
R(21,{kind:"w",q:"우리는 달걀을 살 필요가 없다. (밑줄 친 부분을 바르게 고치기)<br>We <u>must not buy</u> eggs.",ans:"don’t have to buy",full:"We don’t have to buy eggs.",ko:"우리는 달걀을 살 필요가 없다.",
 h:["본책 p.42 B ‘have to’ 의 부정형 ‘don’t/doesn’t have to는 ~할 필요가 없다’ 를 펴세요.","1) 우리말은 ‘살 필요가 없다’ 예요.  2) must not 은 ‘~해서는 안 된다(금지)’ 라서 뜻이 달라요. 필요 없음을 나타내는 말로 바꿔요.","d로 시작하는 세 낱말 + buy 예요."],
 pen:"살 필요 없다 → must not (X) → don’t have to"});
R(22,{kind:"w",q:"나는 10월에 유럽에 갈지도 모른다. (밑줄 친 부분을 바르게 고치기)<br>I <u>should go</u> to Europe in October.",ans:"may go",full:"I may go to Europe in October.",ko:"나는 10월에 유럽에 갈지도 모른다.",
 h:["본책 p.40 B ‘may’ 의 1 ‘~일지도 모른다(추측)’ 를 펴세요.","1) 우리말 ‘갈지도 모른다’ 는 추측이에요.  2) should 는 ‘~해야 한다(충고)’ 라서 뜻이 달라요. 추측의 조동사로 바꿔요.","m으로 시작하는 세 글자 조동사 + go 예요."],
 pen:"갈지도 모른다(추측) → should (X) → may go"});
R(23,{kind:"w",q:"우리는 우리의 개를 찾을 수 없었다. (can, find)<br>We ___ our dog.",ans:"couldn’t find / could not find",full:"We couldn’t find our dog. / We could not find our dog.",ko:"우리는 우리의 개를 찾을 수 없었다.",
 h:["본책 p.40 can 설명 아래 ‘can의 과거형은 could이고, 과거 부정형은 couldn’t[could not]이다’ 를 펴세요.","1) ‘찾을 수 없었다’ 는 과거 이야기예요.  2) can 의 과거 부정형 + 동사원형 find 를 써요.","c로 시작하는 과거 부정형 + find 예요."],
 pen:"찾을 수 없었다(과거) → couldn’t + find"});
R(24,{kind:"w",q:"그 식당은 훌륭한 것이 틀림없다. 그곳은 항상 붐빈다. (must, great)<br>The restaurant ___. It’s always busy.",ans:"must be great",full:"The restaurant must be great. It’s always busy.",ko:"그 식당은 훌륭한 것이 틀림없다. 그곳은 항상 붐빈다.",
 h:["본책 p.42 A ‘must’ 의 2 ‘~임에 틀림없다(강한 추측)’ 를 펴세요.","1) It’s always busy(항상 붐벼요) → 훌륭한 식당이 틀림없어요.  2) must 뒤에 동사원형이 와야 하니, 그 자리에 be 를 써요.","m으로 시작하는 네 글자 조동사 + be + great 예요."],
 pen:"항상 붐빔 → 훌륭함이 틀림없다 → must be"});
R(25,{kind:"w",q:"우리는 물을 낭비해서는 안 된다.<br>(조건: should, waste, water를 이용할 것 / 4단어로 쓸 것)<br>→ ___.",ans:"We shouldn’t waste water",full:"We shouldn’t waste water.",ko:"우리는 물을 낭비해서는 안 된다.",
 h:["본책 p.42 C ‘should’ 의 You shouldn’t[should not] believe him. 을 펴세요.","1) 주어는 We, ‘낭비해서는 안 된다’ 는 should 의 부정이에요.  2) 4단어가 되려면 should not 이 아니라 줄임말 shouldn’t 를 써요.","We + s로 시작하는 줄임말 + waste + water 이에요."],
 pen:"4단어 조건 → We shouldn’t waste water"});
R(26,{kind:"w",q:"(어법상 옳은 것을 모두 고르면?)<br>① May I leave early today?<br>② You should not enter the room.<br>③ You may cooks dinner tonight.<br>④ She can able to pass the test.<br>⑤ You must don’t be late for the class.",ans:"①, ②",full:"① May I leave early today? / ② You should not enter the room.",ko:"① 제가 오늘 일찍 떠나도 될까요? ② 너는 그 방에 들어가면 안 된다. (③ cooks → cook, ④ can able to → can 또는 is able to, ⑤ must don’t → must not 으로 고쳐야 한다.)",
 h:["본책 p.40 설명 윗줄 ‘뒤에 항상 동사원형을 쓴다’ 와 can 설명 아래 be able to, p.42 B·C 의 부정형을 펴세요.","1) 보기마다 조동사 뒤에 동사원형이 오는지 살펴요.  2) can 과 be able to 를 같이 쓰지 않아요. 부정은 조동사 뒤에 not 이에요.","틀린 보기가 세 개예요. 맞는 보기는 두 개예요."],
 pen:"조동사 + 동사원형 / 부정은 조동사 + not"});
R(27,{q:"(어법상 옳은 것으로 바르게 짝지어진 것은?)<br>a. You should take a taxi.<br>b. He doesn’t able to move the table.<br>c. My wallet must be in my bag.<br>d. Mr. Reese may be angry with us.<br>e. She doesn’t have to cleaning her room.",opts:["① a, b, c","② a, c, d","③ a, c, e","④ b, d, e","⑤ c, d, e"],ans:"② a, c, d",full:"a. You should take a taxi. c. My wallet must be in my bag. d. Mr. Reese may be angry with us.",ko:"a. 너는 택시를 타야 한다. c. 내 지갑은 내 가방 안에 있음에 틀림없다. d. 리스 씨는 우리에게 화가 났을지도 모른다. (b 는 isn’t able to, e 는 clean 으로 고쳐야 한다.)",
 h:["본책 p.40 A be able to 의 부정형 ‘be not able to’, p.42 B ‘have to’ 의 부정형을 펴세요.","1) a~e 를 하나씩 보고 조동사 뒤가 동사원형인지 살펴요.  2) be able to 의 부정은 be not able to, don’t/doesn’t have to 뒤에도 동사원형이에요.","틀린 문장은 두 개예요. 나머지 세 문장을 모두 묶은 보기를 고르세요."],
 pen:"b : be not able to / e : have to + 동사원형"});
R(28,{q:"(어법상 옳은 것의 개수는?)<br>•I can arrive on time.<br>•Claire and Sue has to study all night.<br>•This dress may not be comfortable.<br>•The birthday cake don’t have to be big.<br>•Can your brother drive a car?",opts:["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],ans:"③ 3개",full:"I can arrive on time. / This dress may not be comfortable. / Can your brother drive a car?",ko:"나는 제시간에 도착할 수 있다. / 이 드레스는 편하지 않을지도 모른다. / 네 남자 형제는 차를 운전할 수 있니? (Claire and Sue have to, The birthday cake doesn’t have to 로 고쳐야 한다.)",
 h:["본책 p.42 B ‘have to’ 의 ‘주어가 3인칭 단수일 때는 has to’ 와 부정형 don’t/doesn’t have to 를 펴세요.","1) 다섯 문장을 하나씩 확인해요.  2) 주어가 Claire and Sue 는 두 사람(복수), The birthday cake 는 한 개(3인칭 단수)예요. have to 가 주어와 맞는지 봐요.","틀린 문장은 두 개예요. 5 에서 2 를 빼요."],
 pen:"복수 → have to / 3인칭 단수 → has to, doesn’t"});
R(29,{kind:"w",q:"You <u>can</u> take a seat.<br>(O / X)",ans:"O",full:"You can take a seat.",ko:"너는 앉아도 좋다.",

R(30,{kind:"w",q:"Sam may <u>come not</u> to the party.<br>(O / X)",ans:"X, not come",full:"Sam may not come to the party.",ko:"샘은 파티에 오지 않을지도 모른다.",

R(31,{kind:"w",q:"She <u>doesn’t has to</u> explain the rule.<br>(O / X)",ans:"X, doesn’t have to",full:"She doesn’t have to explain the rule.",ko:"그녀는 그 규칙을 설명할 필요가 없다.",
 h:["본책 p.42 B ‘have to’ 의 부정형 ‘don’t/doesn’t have to’ 를 펴세요.","1) 주어 She 는 3인칭 단수라 doesn’t 를 써요.  2) doesn’t 뒤에는 동사원형이 와요. has 는 동사원형이 아니에요.","X 로 쓰고, doesn’t 뒤를 have 로 고쳐요."],

R(32,{kind:"w",q:"In the library, you must are quiet. And you cannot use your phone. (1개)",ans:"must are → must be",full:"In the library, you must be quiet. And you cannot use your phone.",ko:"도서관에서는 너는 조용히 해야 한다. 그리고 너는 휴대폰을 사용해서는 안 된다.",
 h:["본책 p.40 윗줄 ‘조동사는 … 뒤에 항상 동사원형을 쓴다’ 를 펴세요.","1) must 는 조동사예요.  2) 조동사 바로 뒤의 are 는 동사원형이 아니에요. are 의 동사원형으로 고쳐요.","b로 시작하는 두 글자 낱말이에요."],

R(33,{kind:"w",q:"You should say not bad things about Jamie. It may hurt his feelings. You have to say sorry to him. (1개)",ans:"should say not → should not say",full:"You should not say bad things about Jamie. It may hurt his feelings. You have to say sorry to him.",ko:"너는 제이미에 대해 나쁜 말을 해서는 안 된다. 그것은 그의 기분을 상하게 할지도 모른다. 너는 그에게 미안하다고 말해야 한다.",

 pen:"부정은 조동사 + not + 동사원형"});
R(34,{kind:"w",q:"A: Amy didn’t come to school today. She may is sick.<br>B: Oh, I should call her. Do you know her phone number?<br>A: No, I don’t. But Sarah must knows it. They are best friends. (2개)",ans:"may is → may be, must knows → must know",full:"A: Amy didn’t come to school today. She may be sick. B: Oh, I should call her. Do you know her phone number? A: No, I don’t. But Sarah must know it. They are best friends.",ko:"A: 에이미가 오늘 학교에 오지 않았어. 그녀는 아픈 것일지도 몰라. B: 아, 내가 그녀에게 전화해야겠다. 너는 그녀의 전화번호를 아니? A: 아니, 몰라. 하지만 세라는 그것을 알고 있음에 틀림없어. 그들은 가장 친한 친구야.",
 h:["본책 p.40 윗줄 ‘조동사는 … 뒤에 항상 동사원형을 쓴다’ 를 펴세요.","1) may, must 는 조동사예요.  2) may 뒤의 is, must 뒤의 knows 는 동사원형이 아니에요. 각각 원형으로 고쳐요.","is 의 원형은 b로 시작하는 be, knows 의 원형은 k로 시작하는 know 예요."],
 pen:"조동사 + 동사원형 (is → be, knows → know)"});

[["___ you cook spaghetti?","Can","Can you cook spaghetti?","너는 스파게티를 요리할 수 있니?","Unit 01 - A","cook(요리하다) 질문 → Can you ~?",

 ["The rumor ___ be true.","may","The rumor may be true.","그 소문은 사실일지도 모른다.","Unit 01 - B","사실일지도(추측) → may be",
  "‘~일지도 모른다’ 는 추측이에요.","m으로 시작하는 세 글자예요."],

 ["You ___ drive fast in the school zone.","must not / should not","You must not drive fast in the school zone. / You should not drive fast in the school zone.","너는 스쿨존에서 빨리 운전하면 안 된다.","Unit 02 - A","스쿨존 + 금지 → must not",
  "‘~하면 안 된다’ 는 금지예요. 조동사 + not 이에요.","m 또는 s로 시작하는 조동사 + not 이에요."],
 ["Kate reads books all the time. She ___ love books.","must","Kate reads books all the time. She must love books.","Kate는 항상 책을 읽는다. 그녀는 책을 매우 좋아하는 것임에 틀림없다.","Unit 02 - A","항상 책을 읽음 → 틀림없다 → must",
  "‘~임에 틀림없다’ 는 강한 추측이에요.","m으로 시작하는 네 글자예요."],
 ["Nancy ___ clean the classroom.","has to / must / should","Nancy has to clean the classroom. / Nancy must clean the classroom. / Nancy should clean the classroom.","Nancy는 교실을 청소해야 한다.","Unit 02 - B","Nancy(3인칭 단수) + 해야 한다 → has to",
  "‘~해야 한다’ 예요. 주어 Nancy 는 3인칭 단수이니 have to 대신 다른 모양을 써요.","h로 시작하는 두 낱말이에요. 다른 조동사로 써도 돼요."],

  "‘~할 필요가 없다’ 는 have to 의 부정형이에요.","d로 시작하는 세 낱말이에요."],

A(1,"CU",1,"c",{q:"Tommy ___ to school now.",opts:["went","going","is going"],ans:"is going",full:"Tommy is going to school now.",ko:"토미는 지금 학교에 가고 있다.",
 h:[P1A+"1 ‘현재진행형’ 설명을 펴세요.","1) now(지금) → 지금 하고 있는 일이에요.  2) 현재진행형은 「be동사 + v-ing」 모양이에요.","be동사(i로 시작)와 going 이 함께 있는 보기를 골라요."],
 pen:"now(지금) → be동사 + v-ing (is going)"});

 pen:"진행형 부정 : be동사 + not + v-ing"});
[["I ___ ice cream.",["eating","am eating"],"am eating","I am eating ice cream.","나는 아이스크림을 먹고 있다.","1) 주어 I 뒤에는 be동사가 필요해요.  2) eating(먹고 있는)만 있으면 be동사가 빠져요.","be동사(am)가 들어 있는 쪽이에요.","I + 진행 중 → am + v-ing"],
 ["We’re ___ for Stephanie.",["wait","waiting"],"waiting","We’re waiting for Stephanie.","우리는 스테파니를 기다리고 있다.","1) We’re = We are(우리는 ~이다)  2) be동사 뒤 → 「v-ing」 모양이에요.","wait(기다리다)에 -ing를 붙인 모양이에요.","We’re(= We are) + v-ing → waiting"],
 ["They’re ___ now.",["not working","working not"],"not working","They’re not working now.","그들은 지금 일하고 있지 않다.","1) They’re = They are  2) 부정문은 be동사 + not + v-ing 순서예요.","not이 working(일하고 있는)보다 앞에 와요.","be동사 + not + v-ing → are not working"],
 ["Are you ___ taekwondo?",["learn","learning"],"learning","Are you learning taekwondo?","너는 태권도를 배우고 있니?","1) Are you ~? → 진행형의 의문문이에요.  2) 의문문은 「be동사 + 주어 + v-ing?」","learn(배우다)에 -ing를 붙인 모양이에요.","Are you + v-ing? → learning"],
 ["Kevin is ___ on the stage.",["dances","dancing"],"dancing","Kevin is dancing on the stage.","케빈은 무대 위에서 춤추고 있다.","1) is 뒤에는 v-ing  2) dance(춤추다)는 -e로 끝나서 e를 빼고 -ing를 붙여요(표의 ‘-e로 끝나는 동사’).","e를 빼고 ing를 붙인 모양이에요.","is + v-ing (dance → dancing)"],
 ["My sister ___ in Paris now.",["is staying","was staying"],"is staying","My sister is staying in Paris now.","내 여동생은 지금 파리에 머무르고 있다.","1) now(지금) → 현재  2) 현재진행형은 be동사의 현재형(am, are, is) + v-ing","My sister는 한 명이라 be동사는 is예요.","now(현재) + 한 명 → is + v-ing"]
].forEach((r,i)=>A(1,"S1",i+1,"c",{q:r[0],opts:r[1],ans:r[2],full:r[3],ko:r[4],h:[(i==2||i==3)?"본책 p.52 B ‘진행형의 부정문과 의문문’을 펴세요.":"본책 p.52 A ‘현재진행형과 과거진행형’ 설명과 ‘v-ing 만드는 법’ 표를 펴세요.",r[5],r[6]],pen:r[7]}));
[["You ___ on my chair. (sit)","are sitting","You are sitting on my chair.","너는 내 의자에 앉아 있다.","1) 현재진행형 = be동사 + v-ing  2) sit는 <단모음 + 단자음>으로 끝나서 자음 t를 한 번 더 써요. You 뒤 be동사는?","두 칸: be동사(a로 시작) + sit에 tt를 쓴 v-ing.","sit → sitting (자음 한 번 더)  + You → are"],
 ["You don’t have to be so serious. I ___. (joke)","am joking","You don’t have to be so serious. I am joking.","너무 진지할 필요 없어. 나는 농담하고 있어.","1) 지금 진행 중인 일 → 현재진행형  2) joke는 -e로 끝나서 e를 빼고 -ing를 붙여요.","두 칸: am + jok로 시작하는 v-ing(e 없음).","joke → joking (e 빼고)  + I → am"],
 ["The baby ___. He must be hungry. (cry)","is crying","The baby is crying. He must be hungry.","아기가 울고 있다. 배고픈 게 틀림없다.","1) 아기는 한 명 → be동사는 is  2) cry에는 그냥 -ing를 붙여요(대부분의 동사).","두 칸: is + cry에 ing를 붙인 말.","The baby(한 명) → is + crying"],
 ["Let’s go out. It ___ now. (not/rain)","isn’t raining","Let’s go out. It isn’t raining now.","나가자. 지금은 비가 오고 있지 않다.","1) not이 있으니 부정문, 줄임말로 써요.  2) 「be동사 + not + v-ing」에서 is not의 줄임말은?","두 칸: i로 시작하는 줄임말 + rain에 ing를 붙인 말.","It(하나) 부정 → isn’t + raining"],
 ["Those flowers ___. They are fresh. (not/die)","aren’t dying","Those flowers aren’t dying. They are fresh.","저 꽃들은 죽어 가고 있지 않다. 신선하다.","1) Those flowers는 여럿 → be동사는 are  2) not이 있으니 줄임말, die는 -ie로 끝나서 ie를 y로 고치고 -ing(표의 ‘-ie로 끝나는 동사’).","두 칸: a로 시작하는 줄임말 + d로 시작하는 v-ing(y로 끝나지 않고 ying).","die → dying  + 복수 부정 → aren’t"]
].forEach((r,i)=>A(1,"S2",i+1,"w",{q:r[0],ans:r[1],full:r[2],ko:r[3],h:["본책 p.52 A ‘v-ing 만드는 법’ 표를 펴세요.",r[4],r[5]],pen:r[6]}));
[["We ___ the Olympic Games last night.","were watching","We were watching the Olympic Games last night.","우리는 어젯밤에 올림픽 경기를 보고 있었다.","1) last night(어젯밤) → 과거  2) 과거진행형은 「was/were + v-ing」, We는 여럿이에요.","두 칸: w로 시작하는 be동사 + watch에 ing를 붙인 말.","We(복수) + last night(과거) → were + v-ing"],
 ["I ___ in the park this morning.","was running","I was running in the park this morning.","나는 오늘 아침에 공원에서 달리고 있었다.","1) this morning(오늘 아침, 지난 시점) → 과거  2) 주어가 I이면 과거 be동사는 was예요. run은 <단모음 + 단자음>이라 n을 한 번 더 써요.","두 칸: w로 시작하는 be동사 + run에 nn을 쓴 v-ing.","I + 과거 → was + running (n 한 번 더)"],
 ["They ___ in the library yesterday.","were studying","They were studying in the library yesterday.","그들은 어제 도서관에서 공부하고 있었다.","1) yesterday(어제) → 과거  2) They는 여럿 → were + v-ing","두 칸: w로 시작하는 be동사 + study에 ing를 붙인 말(y 그대로).","They(복수) + yesterday(과거) → were + studying"],

A("RT","RT",16,"c",{q:"다음 우리말을 영어로 바르게 옮긴 것은? (나는 Tom에게 문자 메시지를 보내고 있었다.)<br>① I send a text message to Tom. ② I sent a text message to Tom. ③ I will send a text message to Tom. ④ I am sending a text message to Tom. ⑤ I was sending a text message to Tom.",opts:["① I send a text message to Tom.","② I sent a text message to Tom.","③ I will send a text message to Tom.","④ I am sending a text message to Tom.","⑤ I was sending a text message to Tom."],ans:"⑤ I was sending a text message to Tom.",full:"I was sending a text message to Tom.",ko:"나는 Tom에게 문자 메시지를 보내고 있었다.",

A("RT","RT",17,"c",{q:"다음 중 대화가 자연스럽지 않은 것은?<br>① A: Will you help me? B: Yes, I will.<br>② A: Is he going to the mall? B: No, he isn’t.<br>③ A: Are you reading my letter? B: No, I won’t.<br>④ A: Are you going to buy that book? B: Yes, I am.<br>⑤ A: Were they holding hands? B: Yes, they were.",opts:["① A: Will you help me? B: Yes, I will.","② A: Is he going to the mall? B: No, he isn’t.","③ A: Are you reading my letter? B: No, I won’t.","④ A: Are you going to buy that book? B: Yes, I am.","⑤ A: Were they holding hands? B: Yes, they were."],ans:"③ A: Are you reading my letter? B: No, I won’t.",full:"A: Are you reading my letter? B: No, I’m not.",ko:"A: 너 내 편지를 읽고 있니? B: 아니, 안 읽고 있어.",

A("RT","RT",18,"w",{q:"Mike and I ⓐ <u>are travel</u> in Mexico now. We ⓑ <u>going to visit</u> the National Museum tomorrow. We are excited. (밑줄 친 ⓐ, ⓑ를 바르게 고치시오.)",ans:"ⓐ are traveling ⓑ are going to visit",full:"Mike and I are traveling in Mexico now. We are going to visit the National Museum tomorrow. We are excited.",ko:"Mike와 나는 지금 멕시코를 여행하고 있다. 우리는 내일 국립박물관을 방문할 예정이다. 우리는 신이 난다.",
 h:["본책 p.52 A ‘현재진행형’, p.54 B ‘be going to’를 펴세요.","1) ⓐ now(지금) → are 뒤에 v-ing가 와야 해요.  2) ⓑ tomorrow(내일) → going to 앞에 be동사가 빠졌어요.","ⓐ는 travel에 -ing를 붙이고, ⓑ는 We 뒤 be동사 a로 시작하는 말을 넣어요."],
 pen:"are + v-ing / We + going to → are going to"});
A("RT","RT",19,"w",{q:"I ⓐ <u>will am</u> a famous singer in the future. I am practicing hard. I ⓑ <u>not will</u> give up my dream. (밑줄 친 ⓐ, ⓑ를 바르게 고치시오.)",ans:"ⓐ will be ⓑ won’t / will not",full:"I will be a famous singer in the future. I am practicing hard. I won’t give up my dream. / I will not give up my dream.",ko:"나는 미래에 유명한 가수가 될 것이다. 나는 열심히 연습하고 있다. 나는 내 꿈을 포기하지 않을 것이다.",
 h:["본책 p.54 A ‘will + 동사원형’, ‘will의 부정문’을 펴세요.","1) ⓐ will 뒤에는 동사원형이 와야 해요. am은 원형이 아니에요.  2) ⓑ will의 부정문은 won’t[will not] 이고, not이 will 앞에 오지 않아요.","ⓐ는 be동사의 원형(b로 시작), ⓑ는 w로 시작하는 줄임말(will not도 가능)이에요."],
 pen:"will + 동사원형 (am 아님 → be) / 부정 : won’t[will not]"});
A("RT","RT",20,"w",{q:"Danny는 신발을 신고 있는 중이다. (put on his shoes)<br>→ Danny ___.",ans:"is putting on his shoes",full:"Danny is putting on his shoes.",ko:"Danny는 신발을 신고 있는 중이다.",

 pen:"Danny(한 명) + 진행 중 → is + putting (t 한 번 더)"});
A("RT","RT",21,"w",{q:"그들은 오늘 아침에 산책을 하고 있었다. (take a walk)<br>→ They ___ this morning.",ans:"were taking a walk",full:"They were taking a walk this morning.",ko:"그들은 오늘 아침에 산책을 하고 있었다.",

A("RT","RT",25,"w",{q:"다음 중 어법상 옳은 것을 모두 고르면?<br>① Andy won’t change his opinion.<br>② Are you going to the bank?<br>③ Will Jina likes your plan?<br>④ It is going not to be sunny soon.<br>⑤ We’re going to miss you.",ans:"①, ②, ⑤",full:"① Andy won’t change his opinion. ② Are you going to the bank? ⑤ We’re going to miss you.",ko:"① 앤디는 자기 의견을 바꾸지 않을 것이다. ② 너는 은행에 가고 있니? ⑤ 우리는 너를 그리워할 것이다.",
 h:["본책 p.54 A ‘will의 의문문’, B ‘be going to의 부정문’을 펴세요.","1) 보기를 하나씩 규칙에 대 보세요.  2) ③ Will 뒤에는 동사원형, ④ be going to의 부정문은 be not going to 순서예요. 이 둘은 틀려요.","맞는 것은 3개예요. 틀린 ③, ④를 빼고 남은 번호를 쓰세요."],

A("RT","RT",26,"c",{q:"다음 문장이 어법상 옳으면 O, 틀리면 X의 철자를 선택할 때, 순서대로 만들어지는 단어는?<br>(O: b / o / s / r, X: h / e / a / t)<br>They’ll take care of their baby.<br>I’m not call Peter now.<br>The movie is going to end soon.<br>My sister and I was talking.<br>① host ② hear ③ boat ④ best ⑤ bear",opts:["① host","② hear","③ boat","④ best","⑤ bear"],ans:"④ best",full:"They’ll take care of their baby. (O: b) / I’m not calling Peter now. (X: e) / The movie is going to end soon. (O: s) / My sister and I were talking. (X: t)",ko:"그들은 자기 아기를 돌볼 것이다. / 나는 지금 피터에게 전화하고 있지 않다. / 영화가 곧 끝날 것이다. / 내 여동생과 나는 이야기하고 있었다.",

 pen:"O, X, O, X → b, e, s, t"});
A("RT","RT",27,"c",{q:"다음 중 어법상 옳은 것의 개수는?<br>• I was knowing the answer.<br>• Will you explain your idea to Philip?<br>• They were dancing on the stage.<br>• She won’t cries in front of people.<br>• Is Ben and Lily going to play the game?<br>① 1개 ② 2개 ③ 3개 ④ 4개 ⑤ 5개",opts:["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],ans:"② 2개",full:"Will you explain your idea to Philip? / They were dancing on the stage.",ko:"너는 필립에게 네 생각을 설명할 거니? / 그들은 무대에서 춤을 추고 있었다.",
 h:["본책 p.52 PLUS ‘진행형을 쓰지 않는 동사’, p.54 A·B를 펴세요.","1) know(알다)는 진행형으로 쓰지 않아요.  2) won’t 뒤에는 동사원형, Ben and Lily는 복수라 Are를 써요. 이 세 문장은 틀려요.","맞는 문장은 위에서 2번째, 3번째예요."],

A("RT","RT",28,"w",{q:"<u>Will</u> you going to stay in Korea? (O / X, 틀리면 바르게 고치시오)",ans:"X, Are",full:"Are you going to stay in Korea?",ko:"너는 한국에 머무를 예정이니?",

 pen:"will과 going to는 함께 아님 → Are you going to ~?"});
A("RT","RT",29,"w",{q:"Tony and Mickey <u>was having</u> dinner at that time. (O / X, 틀리면 바르게 고치시오)",ans:"X, were having",full:"Tony and Mickey were having dinner at that time.",ko:"토니와 미키는 그때 저녁을 먹고 있었다.",

 pen:"A and B(복수) + 과거진행 → were + v-ing"});
A("RT","RT",30,"w",{q:"I’m <u>going not to</u> invite Jack to my party. (O / X, 틀리면 바르게 고치시오)",ans:"X, not going to",full:"I’m not going to invite Jack to my party.",ko:"나는 Jack을 내 파티에 초대하지 않을 것이다.",
 h:["본책 p.54 B ‘be going to의 부정문’을 펴세요.","1) 부정문 순서를 확인해요.  2) 「be not going to + 동사원형」 — not은 going to 앞에 와요.","X이고, going not to 를 not going to 순서로 바꿔요."],
 pen:"부정 : be + not + going to (going not 아님)"});
A("RT","RT",31,"w",{q:"Jenna is sleep now. She will gets up in an hour. (틀린 부분 2개를 바르게 고치시오)",ans:"is sleeping, will get up",full:"Jenna is sleeping now. She will get up in an hour.",ko:"Jenna는 지금 자고 있다. 그녀는 한 시간 뒤에 일어날 것이다.",
 h:["본책 p.52 A ‘현재진행형’, p.54 A ‘will + 동사원형’을 펴세요.","1) 첫 문장 now(지금) → is 뒤에 v-ing  2) 둘째 문장 will 뒤에는 동사원형이에요.","첫째는 sleep에 ing를 붙이고, 둘째는 gets에서 s를 빼요."],
 pen:"is + v-ing (sleep → sleeping) / will + 동사원형 (gets → get)"});
A("RT","RT",32,"w",{q:"A: Did you watch K-pop Idol last night?<br>B: No, I didn’t. I am studying for an exam.<br>A: It was really interesting. I will show you the video. (틀린 부분 1개를 바르게 고치시오)",ans:"am studying → was studying",full:"A: Did you watch K-pop Idol last night? B: No, I didn’t. I was studying for an exam. A: It was really interesting. I will show you the video.",ko:"A: 어젯밤에 K-pop Idol 봤니? B: 아니, 안 봤어. 나는 시험 공부를 하고 있었어. A: 정말 재미있었어. 내가 영상을 보여 줄게.",
 h:["본책 p.52 A ‘과거진행형’을 펴세요.","1) 질문이 last night(어젯밤) → 과거 이야기  2) 과거에 진행 중이던 일은 「was/were + v-ing」예요. B의 am studying은 현재예요.","am을 w로 시작하는 be동사로 바꿔요."],
 pen:"last night(과거) + 하고 있었다 → was + v-ing"});
A("RT","RT",33,"w",{q:"A: Are you going to go to the airport?<br>B: Yes, I met Eric there this afternoon. His plane are going to arrive at 3:00 p.m.<br>A: Is he going to travel in Korea?<br>B: No, he is going not to travel. He will study Korean at a university. (틀린 부분 3개를 바르게 고치시오)",ans:"met → will meet[am going to meet] / are going to → is going to / is going not to → isn’t[is not] going to",full:"A: Are you going to go to the airport? B: Yes, I will meet Eric there this afternoon. His plane is going to arrive at 3:00 p.m. A: Is he going to travel in Korea? B: No, he isn’t going to travel. He will study Korean at a university.",ko:"A: 너 공항에 갈 거니? B: 응, 나는 오늘 오후에 거기서 에릭을 만날 거야. 그의 비행기는 오후 3시에 도착할 예정이야. A: 그는 한국을 여행할 예정이니? B: 아니, 그는 여행하지 않을 거야. 그는 대학에서 한국어를 공부할 거야.",
 h:["본책 p.54 A ‘will’, B ‘be going to’ 부정문을 펴세요.","1) this afternoon은 앞으로 올 때 → met(과거) 대신 미래  2) His plane은 한 개(3인칭 단수) → are 대신 is  3) be going to의 부정문은 be not going to","세 군데: met → will meet(또는 am going to meet), are → is, going not to → not going to."],
 pen:"미래 → will/be going to / His plane → is / is not going to"});

 U3B,"1) keep(유지하다)은 목적격 보어로 형용사를 써요.  2) 보기 중 형용사가 아닌 것(-ly 꼴)을 찾아요.","-ly로 끝나요.","keep + 목적어 + 형용사 → quietly는 안 됨 (quiet)");
C("RT","RT",5,"(알맞지 않은 것) My mom ___ me to go to bed early.",["① told","② wanted","③ made","④ ordered","⑤ advised"],"③ made","My mom made me to go to bed early. (X) → My mom made me go to bed early. (O)","우리 엄마는 나에게 일찍 자라고 하셨다. (made는 동사원형 사용)",
 U3F,"1) 빈칸 뒤에 me to go(to부정사)가 와요.  2) 목적격 보어로 to부정사를 쓰는 동사(want, tell, order, advise 등)가 아닌 것을 찾아요. make는 동사원형을 써요.","m으로 시작하는 네 글자예요.","to부정사 보어 → tell/want/order/advise (make는 동사원형)");
W("RT","RT",6,"Susan sent him a fan letter.<br>→ Susan sent ___ ___ ___ ___ ___.","a fan letter to him","Susan sent a fan letter to him.","수잰은 그에게 팬레터를 보냈다.",
 U2B,"1) him(간접목적어)을 뒤로 보내요.  2) 「동사 + 직접목적어 + 전치사 + 간접목적어」 순서예요. send(보내다)는 어떤 전치사를 쓰나요?","다섯 칸: a / fan / letter / 전치사(t로 시작) / him 순서예요.","send + 직접목적어 + to + 사람");
W("RT","RT",7,"I’ll get you some napkins.<br>→ I’ll get ___ ___ ___ ___.","some napkins for you","I’ll get some napkins for you.","내가 너에게 냅킨을 좀 가져다줄게.",
 U2B,"1) you(간접목적어)를 뒤로 보내요.  2) get은 표에서 make, cook, buy, get 등과 같은 줄이에요. 어떤 전치사를 쓰나요?","네 칸: some / napkins / 전치사(f로 시작) / you 순서예요.","get + 직접목적어 + for + 사람");
C("RT","RT",8,"밑줄 친 부분의 쓰임이 나머지 넷과 다른 것은?",["① The news <u>made</u> him sad.","② Mike <u>made</u> his dream real.","③ My uncle <u>made</u> us a bookshelf.","④ His joke <u>made</u> people laugh.","⑤ The game <u>made</u> him a national hero."],"③ My uncle <u>made</u> us a bookshelf.","My uncle made us a bookshelf.","우리 삼촌은 우리에게 책장을 만들어 주셨다.",
 "본책 p.66 A ‘수여동사 + 간접목적어 + 직접목적어’와 p.68 목적격 보어 설명을 함께 보세요.","1) ①②④⑤는 「made + 목적어 + 보어(sad, real, laugh, a national hero)」예요. 목적어의 상태를 설명해요.  2) 하나는 ‘~에게 …을 만들어 주었다’ 뜻의 수여동사예요. 목적어가 두 개(us, a bookshelf) 나란히 있는 문장을 찾아요.","보기를 하나씩 읽으며 목적어가 두 개인 문장을 찾아요.","made + 목적어 두 개 → 수여동사 (나머지는 목적어 + 보어)");
C("RT","RT",9,"(to를 쓸 수 없는 것) 빈칸에 알맞은 것은?",["① I passed the ball ___ Sam.","② Dad told me ___ come early.","③ I want you ___ visit my blog.","④ Peter lent an umbrella ___ me.","⑤ Linda cooked chicken soup ___ me."],"⑤ Linda cooked chicken soup ___ me.","Linda cooked chicken soup for me. (to가 아니라 for)","린다는 나에게 닭고기 수프를 요리해 주었다.",
 RTP,"1) ①④는 간접목적어 앞에 to를 쓰는 동사(pass, lend)예요.  2) ②③은 목적격 보어 to부정사의 to예요.  3) 나머지 하나는 표에서 for를 쓰는 동사예요.","cook(요리하다)이 들어 있어요.","cook + 직접목적어 + for + 사람 (to 불가)");
C("RT","RT",10,"빈칸에 공통으로 들어갈 말은?<br>• Matt showed his book ___ me.<br>• My teacher advised me ___ keep a diary every day.",["① to","② for","③ of","④ about","⑤ with"],"① to","Matt showed his book to me. / My teacher advised me to keep a diary every day.","맷은 나에게 그의 책을 보여 주었다. / 선생님은 나에게 매일 일기를 쓰라고 충고하셨다.",
 RTP,"1) 첫 문장: show는 간접목적어 앞에 어떤 전치사를 쓰나요?  2) 둘째 문장: advise는 목적격 보어로 to부정사를 써요. 두 문장 모두에 들어가는 한 글자 말을 찾아요.","t로 시작하는 두 글자예요.","show + 직접목적어 + to / advise + 목적어 + to부정사");
C("RT","RT",11,"빈칸에 들어갈 말이 바르게 짝지어진 것은?<br>• Mary’s voice (A) nice.<br>• I (B) a Christmas card to him.<br>• He (C) us to be honest.",["① hears – made – let","② hears – sent – told","③ sounds – sent – told","④ sounds – sent – let","⑤ sounds – made – told"],"③ sounds – sent – told","Mary’s voice sounds nice. / I sent a Christmas card to him. / He told us to be honest.","메리의 목소리는 듣기 좋다. / 나는 그에게 크리스마스 카드를 보냈다. / 그는 우리에게 정직하라고 말했다.",
 "본책 p.64 C ‘sound + 형용사’, p.66 B 표, p.68 C(to부정사)를 차례로 보세요.","1) (A) 목소리는 귀로 듣고, 뒤에 형용사 nice가 와요.  2) (B) a Christmas card to him → 전치사 to를 쓰는 동사(send 등)  3) (C) us to be honest → 목적격 보어로 to부정사를 쓰는 동사","(A)는 s로 시작해요.","(A) 감각동사 sound (B) send + to (C) tell + to부정사");
W("RT","RT",12,"A: Your shirt looks nice.<br>B: Thanks. My sister ___ me. (give, it)","gave it to","A: Your shirt looks nice. B: Thanks. My sister gave it to me.","A: 네 셔츠 멋져 보여. B: 고마워. 우리 언니가 나에게 그것을 줬어.",
 RTP,"1) 빈칸 뒤에 me가 있어요. 주어진 말은 give(주다), it(그것)이에요.  2) it이 직접목적어이고 me가 간접목적어라서 「직접목적어 + 전치사 + 간접목적어」 순서예요. give의 과거형은 불규칙이에요.","세 단어예요: g로 시작하는 과거형 / it / t로 시작하는 전치사.","gave(과거) + it + to + me");
W("RT","RT",13,"A: The boys are talking too loudly.<br>B: Yeah. I ___ quiet. (want, them, be)","want them to be","A: The boys are talking too loudly. B: Yeah. I want them to be quiet.","A: 그 남자아이들이 너무 크게 떠들고 있어. B: 맞아. 나는 그들이 조용하길 바라.",
 U3C,"1) ‘~가 …하기를 원한다’ → want는 목적격 보어로 to부정사를 써요.  2) 주어가 I라서 want에 s는 안 붙고, them은 목적어, be는 to 뒤에 써요.","네 단어: want / them / to / be 순서예요.","want + 목적어(them) + to부정사");
C("RT","RT",14,"(밑줄 친 부분이 잘못된 것)",["① You look <u>tired</u> today.","② Computers make work <u>easy</u>.","③ I found the song <u>beautifully</u>.","④ He always keeps his desk <u>clean</u>.","⑤ Everybody felt <u>happy</u> at the party."],"③ I found the song <u>beautifully</u>.","I found the song beautifully. (X) → I found the song beautiful. (O)","나는 그 노래가 아름답다고 생각했다. (beautiful 사용)",
 U3B,"1) look, feel 뒤와 make, keep, find의 목적어 뒤에는 형용사가 와요.  2) 밑줄 친 말 중에 형용사가 아닌 것을 찾아요.","-ly로 끝나요.","find + 목적어 + 형용사 → beautifully는 안 됨");
C("RT","RT",15,"(밑줄 친 부분이 잘못된 것)",["① I bought <u>a watch for him</u>.","② Jay asked <u>her a question</u>.","③ Kevin gave <u>me his game CDs</u>.","④ My friend sent <u>a package to me</u>.","⑤ Mom made <u>hot chocolate to me</u>."],"⑤ Mom made <u>hot chocolate to me</u>.","Mom made hot chocolate to me. (X) → Mom made hot chocolate for me. (O)","엄마는 나에게 핫초코를 만들어 주셨다. (for 사용)",
 RTP,"1) 밑줄 친 곳에서 쓴 전치사가 동사와 맞는지 표에서 확인해요.  2) buy, make는 for, send, give는 to, ask는 of를 써요.","make(만들다)와 어울리는 전치사가 아니에요.","make + 직접목적어 + for + 사람 (to는 틀림)");
C("RT","RT",16,"(대화가 자연스럽지 않은 것)",["① A: Did they name their baby?<br>B: Yes. They named him Jamie.","② A: Is your dad a teacher?<br>B: Yes. He teaches students math.","③ A: Did you buy this scarf?<br>B: No. Mom made it for me.","④ A: This cake tastes good. Can I have some more?<br>B: Of course.","⑤ A: I’m going to travel around Europe this summer.<br>B: Your plan sounds interestingly."],"⑤ A: I’m going to travel around Europe this summer.<br>B: Your plan sounds interestingly.","B: Your plan sounds interestingly. (X) → B: Your plan sounds interesting. (O)","A: 나는 이번 여름에 유럽을 여행할 거야. B: 네 계획은 흥미롭게 들려. (interesting 사용)",
 "본책 p.64 C ‘sound + 형용사: ~하게 들리다’를 보세요.","1) 대화마다 동사 뒤의 말이 맞는지 하나씩 확인해요.  2) 감각동사(tastes, sounds) 뒤에는 형용사가 와야 해요. 형용사가 아닌 말이 있는 대화를 찾아요.","B의 마지막 말이 -ly로 끝나요.","sound + 형용사 → interestingly는 안 됨");
C("RT","RT",17,"나는 Jack에게 내 비밀을 이야기했다.",["① I told my secret Jack.","② I told Jack my secret.","③ I told my secret for Jack.","④ I told to Jack my secret.","⑤ I told Jack to my secret."],"② I told Jack my secret.","I told Jack my secret.","나는 Jack에게 내 비밀을 이야기했다.",
 U2A,"1) tell(이야기하다)은 수여동사예요.  2) 「수여동사 + 간접목적어(~에게) + 직접목적어(…을)」 순서이거나, 「직접목적어 + to + 간접목적어」 순서예요.","사람(Jack) 다음에 물건(my secret)이 와요.","told + 간접목적어(Jack) + 직접목적어(my secret)");
C("RT","RT",18,"우리는 Tony가 늦을 것이라고 예상했다.",["① We expected Tony late.","② We expected Tony be late.","③ We expected Tony to be late.","④ We expected Tony being late.","⑤ We expected Tony to being late."],"③ We expected Tony to be late.","We expected Tony to be late.","우리는 Tony가 늦을 것이라고 예상했다.",
 U3C,"1) expected는 expect(예상하다)의 과거형이에요.  2) expect는 목적격 보어로 to부정사(to + 동사원형)를 써요.","Tony 뒤에 to + 동사원형이 와요.","expect + 목적어 + to + 동사원형");
W("RT","RT",19,"이 약은 쓴 맛이 난다. (bitter)<br>→ This medicine ___.","tastes bitter","This medicine tastes bitter.","이 약은 쓴 맛이 난다.",
 RE,"1) ‘맛이 난다’ → taste  2) 주어 This medicine은 하나, 현재라서 s를 붙여요. 뒤에 형용사 bitter(쓴)","첫 단어는 t로 시작하는 여섯 글자, 둘째 칸은 주어진 형용사 그대로예요.","This medicine(하나) + 맛 → tastes + 형용사");
W("RT","RT",20,"그 마을은 평화로워 보인다. (peaceful)<br>→ The village ___.","looks peaceful","The village looks peaceful.","그 마을은 평화로워 보인다.",
 RA,"1) ‘보인다’ → look  2) 주어 The village는 하나, 현재라서 s를 붙여요. 뒤에 형용사 peaceful(평화로운)","첫 단어는 l로 시작하는 다섯 글자, 둘째 칸은 주어진 형용사 그대로예요.","The village(하나) + 보인다 → looks + 형용사");
W("RT","RT",21,"그녀는 나에게 책들을 옮겨달라고 부탁했다. (me, asked, to, her books, carry)<br>→ She ___.","asked me to carry her books","She asked me to carry her books.","그녀는 나에게 책들을 옮겨달라고 부탁했다.",
 U3C,"1) 주어 She 다음에 동사 asked  2) ask는 「목적어 + to부정사」를 써요. 목적어는 me, to부정사는 to carry her books예요.","asked → me → to → carry → her books 순서로 놓아요.","asked + 목적어(me) + to부정사");
W("RT","RT",22,"Matt는 우편함이 빈 것을 발견했다. (the mailbox, found, empty)<br>→ Matt ___.","found the mailbox empty","Matt found the mailbox empty.","Matt는 우편함이 빈 것을 발견했다.",
 U3B,"1) 주어 Matt 다음에 동사 found  2) 목적어 the mailbox 다음에 목적격 보어(형용사) empty(빈)가 와요.","found → the mailbox → empty 순서로 놓아요.","found + 목적어 + 형용사(보어)");
W("RT","RT",23,"내가 너희에게 쿠키를 좀 만들어 줄게. (for, make, you, some cookies)<br>→ I’ll ___.","make some cookies for you","I’ll make some cookies for you.","내가 너희에게 쿠키를 좀 만들어 줄게.",
 RTP,"1) I’ll 다음에 동사원형 make  2) 주어진 말에 for가 있으니 「직접목적어(some cookies) + for + 사람(you)」 순서예요.","make → some cookies → for → you 순서로 놓아요.","make + 직접목적어 + for + 사람");
W("RT","RT",24,"그는 내가 그의 전화기를 쓰는 걸 허락했다.<br>(조건: allow, use, his phone을 이용할 것 / 7단어)<br>→ ___.","He allowed me to use his phone","He allowed me to use his phone.","그는 내가 그의 전화기를 쓰는 걸 허락했다.",
 U3C,"1) 주어 He, 동사는 allow(허락하다)의 과거형  2) allow는 목적격 보어로 to부정사를 써요. ‘내가’는 목적어 me예요.","He → allowed → me → to → use → his phone 순서이고, 모두 7단어예요.","allowed + 목적어(me) + to부정사");
W("RT","RT",25,"(어법상 옳은 것을 모두 고르면?)<br>① Mom told me eat breakfast.<br>② I want him to fix my bike.<br>③ His plan sounds very nicely.<br>④ My best friend called me a liar.<br>⑤ Someone sent Julia flowers.","②, ④, ⑤","② I want him to fix my bike. / ④ My best friend called me a liar. / ⑤ Someone sent Julia flowers.","② 나는 그가 내 자전거를 고쳐 주기를 원한다. / ④ 내 가장 친한 친구는 나를 거짓말쟁이라고 불렀다. / ⑤ 누군가 줄리아에게 꽃을 보냈다.",
 "본책 p.64(감각동사), p.66 A(수여동사), p.68 A·C(목적격 보어)를 차례로 보세요.","1) 문장마다 동사를 보고 뒤에 맞는 형태가 왔는지 확인해요.  2) tell + 목적어 뒤에는 to부정사, sound 뒤에는 형용사가 와야 해요. 이걸 어긴 문장은 틀린 문장이에요.","옳은 문장은 세 개예요. 틀린 것은 ①(to 빠짐)과 ③(형용사 자리에 -ly)이에요.","① tell + to부정사 필요 ③ sound + 형용사 필요 → 나머지가 정답");
C("RT","RT",26,"(어법상 옳은 것으로 바르게 짝지어진 것은?)<br>a. My hands feel dry in the winter.<br>b. The TV show made him popular.<br>c. He teaches Hangeul for Emma.<br>d. Jane saw Mom cook noodles.<br>e. My boss ordered me finish the work today.",["① b, e","② a, b, c","③ a, b, d","④ b, d, e","⑤ a, b, c, e"],"③ a, b, d","a. My hands feel dry in the winter. / b. The TV show made him popular. / d. Jane saw Mom cook noodles.","a. 내 손은 겨울에 건조하게 느껴진다. / b. 그 TV 쇼는 그를 유명하게 만들었다. / d. 제인은 엄마가 국수를 요리하시는 것을 보았다.",
 "본책 p.64 B, p.66 B 표, p.68 B·C와 cf. 설명을 차례로 보세요.","1) a: feel + 형용사  b: make + 목적어 + 형용사  c: teach는 for/to 중 무엇?  d: see + 목적어 + 동사원형  e: order + 목적어 + 보어는?  2) c와 e에서 틀린 곳을 찾아요.","틀린 것은 c(전치사)와 e(to 빠짐)예요.","c: teach는 to / e: order + to부정사 → 둘은 틀림");
C("RT","RT",27,"(어법상 옳은 것의 개수는?)<br>• I didn’t expect my brother to help me.<br>• My fashion blog made me famous.<br>• I showed to my grandmother the painting.<br>• The baby looks like an angel.<br>• Neil bought a ring for his girlfriend.",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"],"④ 4개","옳은 문장은 4개: expect ... to help / made me famous / looks like an angel / bought a ring for ...","옳은 문장 4개: 내 동생이 나를 도울 거라고 예상하지 않았다 / 내 패션 블로그가 나를 유명하게 만들었다 / 그 아기는 천사처럼 보인다 / 닐은 여자 친구에게 반지를 사 주었다.",
 "본책 p.64 A cf.(look like), p.66 A·B, p.68 B·C를 차례로 보세요.","1) 다섯 문장을 하나씩 확인해요.  2) expect는 to부정사, make는 형용사 보어, look 뒤 명사에는 like, buy는 for예요. showed to ~ the painting처럼 순서가 어긋난 문장이 있는지 찾아요.","틀린 문장은 단 하나(세 번째)예요.","show + 간접목적어 + 직접목적어 순서가 틀린 문장 1개 → 나머지 4개가 옳음");

 pen:"날씨 → It is(It’s) + rainy and windy"});
A("GW","A",2,"w",{q:"이 거리는 깨끗하다. (street)<br>→ ___ is clean.",ans:"This street",full:"This street is clean.",ko:"이 거리는 깨끗하다.",
 h:["본책 p.92 A-1 ‘this는 가까운 대상, 이 (~)’를 보세요.","1) ‘이 (~)’ + street(거리, 하나)  2) 문장 맨 앞이라 대문자로 시작해요.","두 단어이고 대문자 T로 시작하는 말 + s로 시작하는 말이에요."],
 pen:"이 ~(가까운 것, 하나) → This + 단수명사"});
A("GW","A",3,"w",{q:"너는 너 자신을 사랑해야 한다. (should, love)<br>→ ___.",ans:"You should love yourself",full:"You should love yourself.",ko:"너는 너 자신을 사랑해야 한다.",
 h:["본책 p.90 B-1 ‘재귀대명사의 쓰임’을 보세요.","1) 사랑하는 사람도 you, 사랑받는 사람도 you → 목적어가 주어와 같아요.  2) should 뒤에는 동사원형 love(원형 love 사랑하다)를 써요.","네 단어이고 Y로 시작하며, 마지막 단어는 y로 시작하고 -self로 끝나요."],
 pen:"목적어 = 주어(you) → love yourself"});
A("GW","A",4,"w",{q:"나는 그에게서 어떤 소식도 듣지 못했다. (news)<br>→ I didn’t hear ___ from him.",ans:"any news",full:"I didn’t hear any news from him.",ko:"나는 그에게서 어떤 소식도 듣지 못했다.",
 h:["본책 p.94 B-2 ‘any’를 보세요.","1) didn’t hear → 부정문  2) ‘어떤 ~도’는 부정문에 쓰는 말 + news(소식)를 이어요.","두 단어이고 a로 시작하는 말 + n으로 시작하는 말이에요."],
 pen:"didn’t(부정문) + ‘어떤 ~도’ → any news"});
A("GW","A",5,"w",{q:"우리는 Cindy의 생일 파티를 위한 약간의 계획을 짰다. (make, plans)<br>→ ___ for Cindy’s birthday party.",ans:"We made some plans",full:"We made some plans for Cindy’s birthday party.",ko:"우리는 Cindy의 생일 파티를 위한 약간의 계획을 짰다.",
 h:["본책 p.94 B-1 ‘some’을 보세요.","1) 긍정문이고 ‘약간의’  2) make(만들다)의 과거형을 써요. made가 과거형이에요.","세 단어이고 We로 시작해요. 마지막 단어는 p로 시작해요."],
 pen:"긍정문 + 약간의 계획 → We made some plans"});
A("GW","A",6,"w",{q:"나는 포크를 떨어뜨렸다. 나는 새것이 필요하다. (new)<br>→ I dropped my fork. I need a ___.",ans:"new one",full:"I dropped my fork. I need a new one.",ko:"나는 포크를 떨어뜨렸다. 나는 새것이 필요하다.",
 h:["본책 p.94 A-1 ‘one’을 보세요.","1) ‘새 포크 하나’ = 같은 종류의 다른 하나  2) a 뒤에서 fork를 대신하는 말이에요. 앞에 형용사 new를 붙여요.","두 단어이고 n으로 시작하는 말 + o로 시작하는 말이에요."],
 pen:"a new + 같은 종류 하나(fork) → new one"});
A("GW","A",7,"w",{q:"선생님은 우리에게 편지를 써 주셨다. (write)<br>→ The teacher ___ a letter.",ans:"wrote us",full:"The teacher wrote us a letter.",ko:"선생님은 우리에게 편지를 써 주셨다.",
 h:["본책 p.90 A ‘인칭대명사’ 표에서 ‘목적격’ 칸을 보세요.","1) 편지를 쓴 때는 과거  2) ‘우리에게’는 동사 뒤 목적어 자리 → we의 목적격이에요. write(쓰다)의 과거형은 불규칙이에요.","두 단어이고 w로 시작하는 과거형 + u로 시작하는 말이에요."],
 pen:"과거 write → wrote + 목적격(we → us)"});
A("GW","B",1,"w",{q:"저 사람들은 내 사촌들이다. (cousins, those, my, are)<br>→ ___.",ans:"Those are my cousins",full:"Those are my cousins.",ko:"저 사람들은 내 사촌들이다.",
 h:["본책 p.92 A-4 ‘that의 복수형은 those’를 보세요.","1) ‘저 사람들’ = 복수 → 문장 맨 앞에 와요.  2) 그 다음 be동사, ‘내’ + 복수 명사 순서예요.","네 단어이고 Those로 시작해서 cousins로 끝나요."],
 pen:"저 사람들(복수) → Those + are + my cousins"});
A("GW","B",2,"w",{q:"나는 이 장난감들을 Ronda에게 줄 것이다. (give, toys, I, to Ronda, will, these)<br>→ ___.",ans:"I will give these toys to Ronda",full:"I will give these toys to Ronda.",ko:"나는 이 장난감들을 Ronda에게 줄 것이다.",
 h:["본책 p.92 A-2 ‘this의 복수형은 these’를 보세요.","1) 주어 I → will + 동사원형 give(원형 give 주다) 순서  2) ‘이 장난감들’은 these + toys, 받는 사람은 to Ronda","일곱 단어이고 I로 시작해서 Ronda로 끝나요."],
 pen:"I will give + these toys(복수) + to Ronda"});
A("GW","B",3,"w",{q:"이곳은 어둡다. (is, it, here, dark)<br>→ ___.",ans:"It is dark here",full:"It is dark here.",ko:"이곳은 어둡다.",

A("GW","B",4,"w",{q:"케이크를 좀 드시겠어요? (have, will, cake, you, some)<br>→ ___?",ans:"Will you have some cake",full:"Will you have some cake?",ko:"케이크를 좀 드시겠어요?",
 h:["본책 p.94 B-1 ‘Will you have some dessert?’ 예문을 보세요.","1) 권유하는 의문문 → Will이 맨 앞  2) 그 다음 주어 you, 동사원형 have(원형 have 먹다), some + 명사 순서예요.","다섯 단어이고 Will로 시작해서 cake로 끝나요."],
 pen:"권유 → Will you have some + 명사?"});
A("GW","B",5,"w",{q:"우리는 우리 자신의 사진을 찍었다. (took, we, of, ourselves, a picture)<br>→ ___.",ans:"We took a picture of ourselves",full:"We took a picture of ourselves.",ko:"우리는 우리 자신의 사진을 찍었다.",
 h:["본책 p.90 B-1 ‘재귀대명사의 쓰임’을 보세요.","1) 주어 We, 사진 찍힌 사람도 우리 → 목적어가 주어와 같아요.  2) took(원형 take 찍다) a picture of 뒤에 재귀대명사를 써요.","여섯 단어이고 We로 시작해서 ourselves로 끝나요."],

A("GW","B",6,"w",{q:"이것이 내 이메일 주소야. 내가 네 것을 알 수 있을까? (get, can, yours, I)<br>→ This is my email address. ___?",ans:"Can I get yours",full:"This is my email address. Can I get yours?",ko:"이것이 내 이메일 주소야. 내가 네 것을 알 수 있을까?",
 h:["본책 p.90 A ‘인칭대명사와 재귀대명사’ 표의 ‘소유대명사’ 칸을 보세요.","1) ‘네 것’ = 너의 이메일 주소 → yours  2) 허락을 묻는 Can이 맨 앞에 오고, 그 다음 주어 I, 동사원형 get(원형 get 얻다) 순서예요.","네 단어이고 Can으로 시작해서 yours로 끝나요."],

A("GW","C",1,"w",{q:"A: Can I see your ID card?<br>B: I’m sorry. I ___ today.<br>(바꿀 말: I didn’t bring <u>my ID card</u> today.)",ans:"didn’t bring it",full:"A: Can I see your ID card? B: I’m sorry. I didn’t bring it today.",ko:"A: 네 신분증을 볼 수 있을까? B: 미안해요. 오늘 신분증을 안 가져왔어요.",
 h:["본책 p.94 A-1 아래 ‘cf. it은 앞에 나온 명사와 동일한 것’을 보세요.","1) my ID card = 상대가 말한 바로 그 신분증  2) 같은 것을 다시 가리키는 말로 바꿔요. 문장은 그대로 didn’t bring 뒤만 바뀌어요.","세 단어이고 didn’t bring 뒤에 i로 시작하는 두 글자가 와요."],
 pen:"your ID card(바로 그것) → it"});
A("GW","C",2,"w",{q:"A: Did you buy new shoes?<br>B: Yes, my ___ anymore.<br>(바꿀 말: My old <u>shoes</u> don’t fit anymore.)",ans:"old ones don’t fit",full:"A: Did you buy new shoes? B: Yes, my old ones don’t fit anymore.",ko:"A: 새 신발을 샀니? B: 응, 내 예전 신발은 더는 맞지 않아.",
 h:["본책 p.94 A-2 ‘one의 복수형은 ones’를 보세요.","1) shoes는 복수 → 같은 종류의 복수를 대신하는 말이에요.  2) old(예전의)는 그대로 쓰고 shoes만 바꿔요.","네 단어이고 old로 시작해서 fit으로 끝나요."],

A("GW","C",3,"w",{q:"A: Did you take your umbrella?<br>B: No. I should ___.<br>(바꿀 말: I should borrow <u>an umbrella</u>.)",ans:"borrow one",full:"A: Did you take your umbrella? B: No. I should borrow one.",ko:"A: 너 우산 가져왔니? B: 아니. 하나 빌려야겠어.",
 h:["본책 p.94 A-1 ‘one’을 보세요.","1) an umbrella = 내 우산이 아니라 아무 우산 하나(불특정)  2) 같은 종류의 불특정한 하나를 대신하는 말로 바꿔요.","두 단어이고 b로 시작하는 동사 + o로 시작하는 말이에요."],

A("GW","D",1,"w",{q:"(그림: 해변을 혼자 걷고 있는 남자아이)<br>Dan walked along the beach ___.",bank:BKD,ans:"by himself",full:"Dan walked along the beach by himself.",ko:"Dan은 해변을 따라 혼자 걸었다.",
 h:["본책 p.90 B-3 ‘재귀대명사를 이용한 관용 표현’을 보세요.","1) 그림 속 남자아이는 혼자예요 → ‘혼자’ 뜻의 표현  2) 주어 Dan(남자 한 명)에 맞는 재귀대명사로 바꿔요.","두 단어이고 b로 시작해요. 둘째 단어는 h로 시작하고 -self로 끝나요."],

A("GW","D",2,"w",{q:"(그림: 계단 아래에 넘어져 울고 있는 여자아이)<br>The little girl fell down the stairs and ___.",bank:BKD,ans:"hurt herself",full:"The little girl fell down the stairs and hurt herself.",ko:"그 어린 소녀는 계단에서 넘어져서 다쳤다.",

 pen:"넘어져 다침 + 여자아이 → hurt herself"});
A("GW","D",3,"w",{q:"(그림: 식당 뷔페에서 음식을 마음껏 먹는 남자와 여자)<br>Philip and Karen ___ to the food at the buffet.",bank:BKD,ans:"helped themselves",full:"Philip and Karen helped themselves to the food at the buffet.",ko:"Philip과 Karen은 뷔페에서 음식을 마음껏 먹었다.",
 h:["본책 p.90 B-3 ‘재귀대명사를 이용한 관용 표현’을 보세요.","1) 뷔페 음식을 ‘마음껏 먹다’  2) 과거로 쓰므로 help(원형 help 돕다)에 -ed를 붙이고, 주어 Philip and Karen(둘)에 맞는 복수 재귀대명사를 써요.","두 단어이고 h로 시작해요. 둘째 단어는 t로 시작하고 -selves로 끝나요."],
 pen:"마음껏 먹다 + 둘(복수) → helped themselves"});
A("GW","D",4,"w",{q:"(그림: 호텔 방에서 편하게 쉬고 있는 가족)<br>The hotel was wonderful. We ___.",bank:BKD,ans:"made ourselves at home",full:"The hotel was wonderful. We made ourselves at home.",ko:"그 호텔은 훌륭했다. 우리는 편히 쉬었다.",
 h:["본책 p.90 B-3 ‘재귀대명사를 이용한 관용 표현’을 보세요.","1) 호텔이 훌륭해서 ‘편히 쉬었다’  2) 과거로 쓰므로 make(원형 make 만들다)의 과거형을 써요. 주어 We에 맞는 재귀대명사를 써요.","네 단어이고 m으로 시작해서 home으로 끝나요."],

A("RT","RT",1,"c",{q:"A: Do you know Jane?<br>B: No, I don’t know ___.",opts:["① she","② her","③ hers","④ it","⑤ them"],ans:"② her",full:"A: Do you know Jane? B: No, I don’t know her.",ko:"A: 너 Jane을 아니? B: 아니, 나는 그녀를 몰라.",

A("RT","RT",2,"c",{q:"___ cookies taste good.",opts:["① It","② This","③ These","④ That","⑤ They"],ans:"③ These",full:"These cookies taste good.",ko:"이 쿠키들은 맛이 좋다.",

 pen:"cookies(복수) + 이 ~ → These"});
A("RT","RT",3,"c",{q:"A: Do you have a laptop?<br>B: Yes, I have a good ___.",opts:["① it","② one","③ ones","④ some","⑤ any"],ans:"② one",full:"A: Do you have a laptop? B: Yes, I have a good one.",ko:"A: 너는 노트북이 있니? B: 응, 좋은 노트북이 하나 있어.",
 h:["본책 p.94 A-1 ‘one’을 보세요.","1) a good 뒤에서 앞에 나온 laptop과 같은 종류를 대신해요.  2) a가 붙어 있으니 단수예요.","o로 시작하는 세 글자예요."],
 pen:"a good + 같은 종류 하나(laptop) 대신 → one"});
A("RT","RT",4,"c",{q:"I don’t have ___ time today.",opts:["① it","② one","③ ones","④ some","⑤ any"],ans:"⑤ any",full:"I don’t have any time today.",ko:"나는 오늘 시간이 조금도 없다.",
 h:["본책 p.94 B-2 ‘any’를 보세요.","1) don’t have → 부정문  2) time(시간)은 셀 수 없는 명사지만 some·any는 둘 다 쓸 수 있어요. 부정문에 쓰는 말을 골라요.","a로 시작하는 세 글자예요."],
 pen:"부정문(don’t have) + 조금도 → any"});
A("RT","RT",5,"c",{q:"다음 중 밑줄 친 부분이 올바른 것을 고르시오.",opts:["① <u>These tomato</u> looks good.","② The children washed <u>their hands</u>.","③ I know <u>hers email address</u>.","④ Tom went for a walk <u>by itself</u>.","⑤ The boy is playing with <u>its dog</u>."],ans:"② The children washed <u>their hands</u>.",full:"The children washed their hands.",ko:"아이들은 그들의 손을 씻었다.",

A("RT","RT",6,"c",{q:"다음 중 밑줄 친 부분이 올바른 것을 고르시오.",opts:["① <u>It is</u> Friday today.","② He left <u>him wallet</u> on the bus.","③ <u>That is</u> 50 km from here to Busan.","④ That woman is <u>ours English teacher</u>.","⑤ We enjoyed <u>themselves</u> on the beach."],ans:"① <u>It is</u> Friday today.",full:"It is Friday today.",ko:"오늘은 금요일이다.",

A("RT","RT",31,"w",{q:"어법상 틀린 부분을 찾아 바르게 고치시오. (1개)<br>My sister bought a pair of black boots. She bought purple one, too. She must be rich!",ans:"purple one → purple ones",full:"My sister bought a pair of black boots. She bought purple ones, too. She must be rich!",ko:"내 여동생은 검은 부츠 한 켤레를 샀다. 그녀는 보라색 부츠도 샀다. 그녀는 부자임이 틀림없다!",

A("RT","RT",33,"w",{q:"어법상 틀린 부분을 찾아 바르게 고치시오. (2개)<br>A: Do you want some pasta and salad?<br>B: Yes, please. I didn’t eat some food this morning.<br>A: You must be hungry. Help oneself.<br>B: Thank you.",ans:"some food → any food, Help oneself → Help yourself",full:"A: Do you want some pasta and salad? B: Yes, please. I didn’t eat any food this morning. A: You must be hungry. Help yourself. B: Thank you.",ko:"A: 파스타와 샐러드를 좀 먹을래? B: 응, 부탁해. 나는 오늘 아침에 아무것도 안 먹었어. A: 배고프겠다. 마음껏 먹어. B: 고마워.",
