k{background:var(--okbg);font-weight:700}.ol{flex:none;min-width:1.4em}.og{color:var(--muted);font-weight:400}.fl{display:grid;gap:2px}.fr{display:flex;gap:8px;font-size:14px;padding:3px 6px;border-radius:6px}.fr.bad{background:var(--badbg);color:var(--bad);font-weight:700}.fk{flex:none;min-width:2.4em;font-weight:700;color:var(--muted)}.fr.bad .fk{color:var(--bad)}.fz{margin:0;font-size:14px}.bq .lb{margin-top:2px}
.back{display:inline-flex;align-items:center;font:inherit;font-size:14px;padding:7px 14px;margin:14px 0 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.do p.wl2{flex-wrap:wrap;align-items:baseline}.do p.wl2 .bl{flex:1 1 100%;margin-top:6px}.wl2 .mlab{color:var(--ink);font-size:14px}.dt.wt{background:var(--ci);color:#fff}.hint{font-size:12px;font-weight:500;color:var(--muted);margin-top:2px}.wrote{display:flex;align-items:center;gap:6px;margin-top:8px;font-size:14px;font-weight:700;cursor:pointer}.wrote input{width:20px;height:20px}
.evs.sm mark{background:var(--hl);color:#1b2130;font-weight:700;padding:1px 3px}
.u2{text-decoration:underline;text-decoration-color:var(--ul);text-decoration-thickness:3px;text-underline-offset:4px;font-weight:700}.evs.sm mark.circ{background:none;border:2px solid var(--ci);border-radius:999px;padding:0 6px}.evs.sm mark.ulm{background:var(--hl);border-bottom:3px solid var(--ul)}.arw{margin:8px 0 0;font-weight:700}.arw mark{background:var(--hl);color:#1b2130;padding:1px 4px;border-radius:3px}.arr{color:var(--ar);font-size:18px}.arn{font-size:12px;color:var(--muted);font-weight:500}
.hlb{display:grid;gap:6px}.lb2{font-size:12px;font-weight:800;color:var(--muted)}.hlb .evs mark{background:var(--hl);color:#1b2130;padding:1px 3px;font-weight:700}.wbig{margin:0}.wbig .wl{font-size:12px;margin-bottom:4px}.wln{font-weight:700;padding:2px 0}details.rd{font-size:13px;color:var(--muted)}details.rd summary{cursor:pointer;padding:6px 0}
.wlc{font-size:12px;font-weight:800;color:var(--accent);margin:2px 0}.wans{color:var(--ink);background:var(--okbg);border-radius:6px;padding:4px 6px}.wlc2{color:var(--accent);white-space:nowrap}
.wcf{font-weight:600;font-size:14px;color:var(--muted)}

.ain{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin-bottom:10px}

.cb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.cb:disabled{cursor:default}
.tr{display:flex;align-items:center;gap:10px;margin-bottom:8px}.tr:last-child{margin-bottom:0}

<script>
var KEY="bricks4";
var META={"secs":{"1":"Chapter 1","2":"Chapter 2","3":"Chapter 3","4":"Chapter 4","5":"Chapter 5","6":"Chapter 6","7":"Chapter 7","8":"Chapter 8","9":"Chapter 9","10":"Chapter 10"},"labs":{"b4-01-1":"Reading 1","b4-01-2":"Reading 2","b4-01-3":"Reading 3","b4-01-4":"Reading 4","b4-02-1":"Reading 1","b4-02-2":"Reading 2","b4-02-3":"Reading 3","b4-02-4":"Reading 4","b4-03-1":"Reading 1","b4-03-2":"Reading 2","b4-03-3":"Reading 3","b4-03-4":"Reading 4","b4-04-1":"Reading 1","b4-04-2":"Reading 2","b4-04-3":"Reading 3","b4-04-4":"Reading 4","b4-05-1":"Reading 1","b4-05-2":"Reading 2","b4-05-3":"Reading 3","b4-05-4":"Reading 4","b4-06-1":"Reading 1","b4-06-2":"Reading 2","b4-06-3":"Reading 3","b4-06-4":"Reading 4","b4-07-1":"Reading 1","b4-07-2":"Reading 2","b4-07-3":"Reading 3","b4-07-4":"Reading 4","b4-08-1":"Reading 1","b4-08-2":"Reading 2","b4-08-3":"Reading 3","b4-08-4":"Reading 4","b4-09-1":"Reading 1","b4-09-2":"Reading 2","b4-09-3":"Reading 3","b4-09-4":"Reading 4","b4-10-1":"Reading 1","b4-10-2":"Reading 2","b4-10-3":"Reading 3","b4-10-4":"Reading 4"}};
var LEGACY=["b1done"];
var TAGS={hl:"형광펜",ul:"밑줄",ci:"동그라미",sl:"슬래시",ar:"화살표",me:"여백 메모",an:"반의어"};
function localStorage_get(){try{var v=localStorage.getItem(KEY+"unit");if(v&&U[v])return v}catch(e){}return Object.keys(U)[0]}
var unit=localStorage_get();var P=U[unit];
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var cur=-1;
var done={};
try{done=JSON.parse(store.get(KEY+"done")||"{}")||{}}catch(e){done={}}
(function(){
  var ids={};Object.keys(U).forEach(function(k){U[k].forEach(function(r){ids[r.id]=1})});
  var moved=false;
  LEGACY.forEach(function(lk){var old={};try{old=JSON.parse(store.get(lk)||"{}")||{}}catch(e){old={}}
    Object.keys(old).forEach(function(k){var m=k.replace(/^o-/,"").match(/^(.*)-([sgq])\d+$/);if(!m||!ids[m[1]])return;
      if(done[k]==null){done[k]=old[k];moved=true}
      if(old[k]&&m[2]!=="s"&&k.indexOf("o-")!==0&&done["o-"+k]==null){done["o-"+k]=true;moved=true}})});
  if(moved)store.set(KEY+"done",JSON.stringify(done));
  var m=/[?&]r=([^&]+)/.exec(location.search);
  if(m){var id=decodeURIComponent(m[1]);Object.keys(U).forEach(function(k){U[k].forEach(function(p,i){if(p.id===id){unit=k;cur=i}})})}
})();
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function swatch(k){var s=el("span","sw "+k);if(k==="an")s.textContent="↔";s.setAttribute("aria-hidden","true");return s}
function secName(k){return (META.secs&&META.secs[k])||k}
function readName(p){return (META.labs&&META.labs[p.id])||String(p.no)}
var qbtns=[];
function allOpened(p){return true}
function examReady(p){return true}
function syncQ(){qbtns.forEach(function(b){b.disabled=!allOpened(P[cur])})}
function stepCard(p,s,i,kind){
  var key=p.id+"-"+kind+i;
  var c=el("div","step"+(done[key]?" done":""));
  var top=el("div","top");
  var cb=el("input","chk");cb.type="checkbox";cb.id="c-"+key;cb.checked=!!done[key];
  cb.setAttribute("aria-label",(i+1)+"번 완료");
  cb.addEventListener("change",function(){done[key]=cb.checked;c.classList.toggle("done",cb.checked);store.set(KEY+"done",JSON.stringify(done));progress()});
  top.appendChild(cb);
  var b=el("div","body");
  var tg=el("div","tags");

    hp=el("div","panel help");hp.hidden=true;var ul=el("ul");
    s.help.forEach(function(h){var li=el("li");li.appendChild(el("span","w",h[0]));li.appendChild(document.createTextNode("  "+h[1]));ul.appendChild(li)});
    hp.appendChild(ul);

  }
  ab=el("button","btn",s.opts?"근거":"확인");ab.type="button";ab.setAttribute("aria-expanded","false");acts.appendChild(ab);
  ap=el("div","panel ans");ap.hidden=true;

    if(s.ev&&s.ev.length){ap.appendChild(el("div","lb","근거 본문"));s.ev.forEach(function(n){var x=(p.S||{})[n];if(!x)return;var d=el("div","evs");var e=el("div","en");e.appendChild(el("span","sn",n+"번"));e.appendChild(document.createTextNode(x[0]));d.appendChild(e);d.appendChild(el("div","ko",x[1]));ap.appendChild(d)})}
    ap.appendChild(el("div","lb","선지별 설명"));
    s.opts.forEach(function(o){var d=el("div","opt");d.appendChild(el("div","en",o[0]+"  "+o[1]));d.appendChild(el("div","ko",o[2]));d.appendChild(el("div","nt",o[3]));ap.appendChild(d)});
  }else{
    s.ans.split("\n").forEach(function(l){var d=el("div",null,l);ap.appendChild(d)});
  }
  if(s.write&&s.write.length){var wb=el("div","wr");wb.appendChild(el("div","wl","책에 쓸 것"));s.write.forEach(function(l){wb.appendChild(el("div",null,l))});if(s.opts)ap.appendChild(wb);else ap.insertBefore(wb,ap.firstChild)}

  var m=el("div","meta");var st=el("strong",null,p.ko);m.appendChild(st);var pc=el("span",null,"");pc.id="pc";m.appendChild(pc);v.appendChild(m);
  var bar=el("div","bar");var bi=el("i");bi.id="pb";bar.appendChild(bi);v.appendChild(bar);
  var BI=bookInputs(p);
  if(BI.length)v.appendChild(inputSection(p,BI));
  if(BI.length&&!bkState(p).sub){v.appendChild(el("div","lockcard","책 문제 답을 제출하면 핵심 질문이 열려요"))}
  else{
    v.appendChild(el("div","sec","핵심 질문"));
    (p.core||[]).forEach(function(c,i){v.appendChild(coreCard(p,c,i))});
    if(p.g){v.appendChild(el("div","sec","문법 한 가지"));v.appendChild(gramCard(p))}
  }
  var bks=el("div");bks.id="bks";v.appendChild(bks);
  var xg=el("div","xg");xg.id="xg";v.appendChild(xg);
  progress();
}
render();
window.addEventListener("popstate",function(){if(cur>=0){cur=-1;render();window.scrollTo(0,0)}});
</script>
</body>
</html>
