 light snack.","카프레제 꼬치는 열량이 낮아서 저는 가벼운 간식으로 그것들을 자주 먹어요.",0],["Mina","미나",1],["Hi, I'm Mina from Korea, and I'm baking tofu chips.","안녕하세요, 저는 한국에서 온 미나이고, 두부칩을 굽고 있어요.",1],["Unlike other chips, my tofu chips are healthy.","다른 칩들과는 다르게, 제 두부칩은 건강에 좋아요.",0],["Why?","왜냐고요?",0],["I don't fry my chips but bake them.","저는 칩을 튀기지 않고 굽거든요.",0],["I don't use any flour, either.","저는 밀가루도 사용하지 않아요.",0],["I use only tofu.","두부만 사용해요.",0],["Eat the tofu chips with honey or garlic powder.","두부칩을 꿀이나 마늘 가루와 같이 먹어 보세요.",0],["They'll taste good.","맛이 좋을 거예요.",0],["Miguel","Miguel",1],["Hello, everyone.","안녕하세요, 여러분.",1],["I'm Miguel from Brazil.","저는 브라질에서 온 Miguel입니다.",0],["I'm making an acai bowl right now.","저는 지금 아사이 볼을 만들고 있어요.",0],["It's a thick acai berry smoothie in a bowl.","그것은 그릇에 담긴 걸쭉한 아사이베리 스무디예요.",0],["You can add other healthy foods like nuts and bananas, and it'll taste really good.","여러분은 견과류와 바나나 같은 건강에 좋은 다른 식품을 추가할 수 있는데, 그러면 맛이 아주 좋을 거예요.",0],["Acai berries are a superfood, and people all over the world enjoy them.","아사이베리는 슈퍼 푸드이고 전 세계 사람들이 그것을 즐겨 먹어요.",0],["Bella","Bella",1],["Miguel","Miguel",1]];var RNUM=14;var TITLE_EN="Healthy and Yummy Snacks for You";var PASS_EN=["Healthy and Yummy Snacks for You","Show Host","Hello, everyone! Welcome to Teens' Kitchen. Today, we have three teen chefs on the show. They're making healthy and delicious snacks, and they will tell us about them.","Bella","Ciao, I'm Bella from Italy. I'm making caprese skewers. Anyone can make these. You just need mozzarella cheese, cherry tomatoes, and basil leaves. Just put them on skewers, and they'll become healthy snacks. Caprese skewers are low in calories, so I often eat them as a light snack.","Mina","Hi, I'm Mina from Korea, and I'm baking tofu chips. Unlike other chips, my tofu chips are healthy. Why? I don't fry my chips but bake them. I don't use any flour, either. I use only tofu. Eat the tofu chips with honey or garlic powder. They'll taste good.","Miguel","Hello, everyone. I'm Miguel from Brazil. I'm making an acai bowl right now. It's a thick acai berry smoothie in a bowl. You can add other healthy foods like nuts and bananas, and it'll taste really good. Acai berries are a superfood, and people all over the world enjoy them.","Bella","Miguel"];var PASS_KO=["여러분을 위한 건강하고 맛있는 간식","프로그램 진행자","안녕하세요, 여러분! Teens' Kitchen에 오신 것을 환영합니다. 오늘 세 명의 십 대 요리사들이 쇼에 나옵니다. 그들은 건강하고 맛있는 간식들을 만들고 있고, 우리에게 그것들에 대해 이야기해 줄 것입니다.","Bella","안녕하세요, 저는 이탈리아에서 온 Bella입니다. 저는 카프레제 꼬치를 만들고 있어요. 누구나 이것을 만들 수 있어요. 모차렐라치즈, 방울토마토, 그리고 바질 잎만 있으면 돼요. 그것들을 꼬치에 꽂기만 하면, 건강한 간식이 될 거예요. 카프레제 꼬치는 열량이 낮아서 저는 가벼운 간식으로 그것들을 자주 먹어요.","미나","안녕하세요, 저는 한국에서 온 미나이고, 두부칩을 굽고 있어요. 다른 칩들과는 다르게, 제 두부칩은 건강에 좋아요. 왜냐고요? 저는 칩을 튀기지 않고 굽거든요. 저는 밀가루도 사용하지 않아요. 두부만 사용해요. 두부칩을 꿀이나 마늘 가루와 같이 먹어 보세요. 맛이 좋을 거예요.","Miguel","안녕하세요, 여러분. 저는 브라질에서 온 Miguel입니다. 저는 지금 아사이 볼을 만들고 있어요. 그것은 그릇에 담긴 걸쭉한 아사이베리 스무디예요. 여러분은 견과류와 바나나 같은 건강에 좋은 다른 식품을 추가할 수 있는데, 그러면 맛이 아주 좋을 거예요. 아사이베리는 슈퍼 푸드이고 전 세계 사람들이 그것을 즐겨 먹어요.","Bella","Miguel"];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["배드민턴의 효과","운동 계획 세우기","운동 시간의 중요성","운동 수업 등록하기","초급자를 위한 운동들"],"a":3,"ans":"운동 수업 등록하기","evs":[["Yes, I'd like to take some badminton lessons.","네, 저는 배드민턴 수업을 좀 듣고 싶어요."],["OK. How often do you want to take lessons?","좋아요. 수업을 얼마나 자주 듣고 싶으신가요?"]],"ev":["Yes, I'd like to take some badminton lessons.","네, 저는 배드민턴 수업을 좀 듣고 싶어요."],"ow":["오답 ✕ — 대화에서 'Yes, I'd like to take some badminton lessons.'(네, 배드민턴 수업을 듣고 싶어요)라고 했지만, 배드민턴이 어떤 효과가 있는지는 전혀 말하지 않았어요. 효과 이야기가 없으니 틀려요.","오답 ✕ — 'How often do you want to take lessons?'(수업을 얼마나 자주 듣고 싶나요?)라는 질문은 있지만, 운동 계획을 세우는 것이 대화의 중심은 아니에요. 수업에 등록하러 온 상황이 더 정확해요.","오답 ✕ — 'I can only come after 5 p.m.'(5시 이후에만 올 수 있어요)처럼 시간 이야기는 나오지만, 운동 시간이 왜 중요한지를 말하는 대화는 아니에요. 너무 엉뚱하게 넓힌 보기예요.","정답 ○ — 'I'd like to take some badminton lessons.'(배드민턴 수업을 듣고 싶어요)와 'Then why don't you take Mr. Kim's class?'(그러면 김 선생님 수업을 들어 보세요)에서 보듯, 수업을 고르고 등록하는 내용이므로 '운동 수업 등록하기'가 알맞아요.","오답 ✕ — 'Are you a beginner?' 'Yes, I am.'(초보자인가요? 네)이라는 말은 있지만, 초급자에게 맞는 여러 운동을 소개하지는 않아요. 배드민턴 수업 하나만 다뤄요."],"memo":["정답: ④ 운동 수업 등록하기 (배드민턴 수업을 듣고 싶어서 온 대화)","근거: I'd like to take some badminton lessons.(배드민턴 수업을 듣고 싶어요.)","함정: ①은 효과 이야기가 없고, ⑤는 운동 소개가 아니라서 ✕"],"why":"배드민턴 수업을 듣고 싶어서 등록하러 온 대화이다."},{"n":2,"q":"위 대화의 내용과 일치하지 않은 것은?","o":["The girl is not good at badminton.","The girl can't take lessons at 4 p.m.","The man recommends Mr. Kim's class.","The girl wants to take badminton lessons.","Mr. Kim's class starts after 6 p.m. once a week."],"a":4,"ans":"Mr. Kim's class starts after 6 p.m. once a week.","evs":[["Two times a week, but I can only come after 5 p.m.","일주일에 두 번이요, 하지만 저는 오후 5시 이후에만 올 수 있어요."],["Then why don't you take Mr. Kim's class? His class meets at 6 p.m. on Mondays and Thursdays.","그러면 김 선생님의 수업을 들어 보는 게 어때요? 그분의 수업은 월요일과 목요일 오후 6시에 있어요."]],"ev":["Two times a week, but I can only come after 5 p.m.","일주일에 두 번이요, 하지만 저는 오후 5시 이후에만 올 수 있어요."],"ow":["오답 ✕ — 대화에서 'Are you a beginner?' 'Yes, I am.'(초보자인가요? 네)이라고 했으니 소녀는 배드민턴을 잘하지 못하는 초보자가 맞아요. 그래서 일치하는 내용이라 답이 될 수 없어요.","오답 ✕ — 소녀는 'I can only come after 5 p.m.'(5시 이후에만 올 수 있어요)라고 했으니 오후 4시에는 수업을 들을 수 없어요. 대화와 일치하므로 답이 아니에요.","오답 ✕ — 남자는 'Then why don't you take Mr. Kim's class?'(그러면 김 선생님 수업을 들어 보는 게 어때요?)라고 권했어요. 김 선생님 수업을 추천한 것이 맞으므로 일치해요.","오답 ✕ — 소녀가 'I'd like to take some badminton lessons.'(배드민턴 수업을 듣고 싶어요)라고 말했으니 일치하는 내용이에요.","정답 ○ — 'His class meets at 6 p.m. on Mondays and Thursdays.'(그 수업은 월요일과 목요일 오후 6시에 있어요)라고 했으니 일주일에 두 번이에요. '일주일에 한 번'이라고 한 이 보기가 대화와 달라서 일치하지 않는 것이에요."],"memo":["정답: ⑤ 김 선생님 수업은 일주일에 한 번이 아니라 두 번 (월·목 오후 6시)","근거: His class meets at 6 p.m. on Mondays and Thursdays.(월요일과 목요일 오후 6시에 수업이 있어요.)","함정: ②는 5시 이후에만 올 수 있어서 4시는 불가능하니 일치(○)"],"why":"김 선생님 수업은 월·목, 즉 일주일에 두 번이라 '한 번'은 틀린 설명이다."}],"dlg":[["M","Can I help you?","도와드릴까요?"],["G","Yes, I'd like to take some badminton lessons.","네, 저는 배드민턴 수업을 좀 듣고 싶어요."],["M","Are you a beginner?","초보자이신가요?"],["G","Yes, I am.","네, 맞아요."],["M","OK. How often do you want to t week.","evs":[["I'm playing VR tennis.","나는 VR 테니스를 치고 있어."],["I play twice a week.","나는 일주일에 두 번 쳐."]],"ev":["I'm playing VR tennis.","나는 VR 테니스를 치고 있어."],"ow":["오답 ✕ — 미나는 'I'm playing VR tennis.'(나는 VR 테니스를 치고 있어)라고 했어요. 밖에서 하는 진짜 테니스가 아니라 가상현실(VR) 테니스예요.","정답 ○ — 'I play twice a week.'(나는 일주일에 두 번 쳐)라고 했고 VR 테니스를 친다고 했으므로, 미나는 일주일에 두 번 VR 테니스를 쳐요.","오답 ✕ — 'How often do you play?'(얼마나 자주 치니?)라는 질문에 'I play twice a week.'(일주일에 두 번)라고 답했어요. 매일(every day)이 아니에요.","오답 ✕ — 대화에는 선생님에게 배운다는 말이 전혀 없어요. 미나는 단지 VR 테니스를 치고 있다고만 했어요.","오답 ✕ — 상대가 'That's awesome!'(멋지다!)이라고 했고 미나는 일주일에 두 번이나 치고 있어요. 좋아하지 않는다는 근거는 없어요."],"memo":["정답: ② Mina plays VR tennis twice a week. (일주일에 두 번)","근거: I play twice a week.(나는 일주일에 두 번 쳐.)","함정: ③ 매일이 아니라 twice a week라서 ✕"],"why":"미나는 일주일에 두 번 VR 테니스를 친다."}],"dlg":[["A","What are you doing here, Mina?","여기서 뭐 하고 있니, 미나야?"],["B","I'm playing VR tennis.","나는 VR 테니스를 치고 있어."],["A","That's awesome! How often do you play?","멋지다! 얼마나 자주 치니?"],["B","I play twice a week.","나는 일주일에 두 번 쳐."]]},{"qs":[{"n":5,"q":"위 대화의 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["once - busy","twice - busy","once - tired","every day - busy","twice - tired"],"a":0,"ans":"once - busy","evs":[["I play once a week.","나는 일주일에 한 번 해."],["I can't. I'm too busy.","그럴 수 없어. 나는 너무 바빠."]],"ev":["I play once a week.","나는 일주일에 한 번 해."],"ow":["정답 ○ — 지수는 'I play once a week.'(일주일에 한 번 해)라고 했고 'I'm too busy.'(너무 바빠)라고 이유를 말했어요. (A)에는 once, (B)에는 busy가 들어가요.","오답 ✕ — 지수는 'I play once a week.'(일주일에 한 번)라고 했어요. twice(두 번)는 횟수가 달라서 (A)가 틀려요.","오답 ✕ — (A) once는 맞지만, 지수가 못 하는 이유는 'I'm too busy.'(너무 바빠)예요. tired(피곤한)라는 말은 대화에 없어서 (B)가 틀려요.","오답 ✕ — 'I play once a week.'(일주일에 한 번)이라고 했으니 every day(매일)는 사실과 정반대예요.","오답 ✕ — 횟수는 once인데 twice라고 했고, 이유도 busy인데 tired라고 해서 둘 다 틀려요."],"memo":["정답: ① once - busy (일주일에 한 번, 너무 바빠서)","근거: I play once a week. / I'm too busy.(나는 일주일에 한 번 해. / 나는 너무 바빠.)","함정: tired(피곤한)는 대화에 나오지 않아서 ✕"],"why":"지수는 너무 바빠서 농구를 일주일에 한 번만 한다.","sum":"Jisu plays basketball only (A) 들은 건강하고 맛있는 간식들을 만들고 있고, 우리에게 그것들에 대해 이야기해 줄 것입니다."]]},{"qs":[{"n":7,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Caprese skewers are a light snack.","Tofu chips need some flour and tofu.","We can enjoy tofu chips with garlic powder.","Bella and Mina are from different countries.","We can make caprese skewers with three ingredients."],"a":1,"ans":"Tofu chips need some flour and tofu.","evs":[["Caprese skewers are low in calories, so I often eat them as a light snack.","카프레제 꼬치는 열량이 낮아서 저는 가벼운 간식으로 그것들을 자주 먹어요."],["I don't use any flour, either.","저는 밀가루도 사용하지 않아요."],["I use only tofu.","두부만 사용해요."],["Eat the tofu chips with honey or garlic powder.","두부칩을 꿀이나 마늘 가루와 같이 먹어 보세요."]],"ev":["Caprese skewers are low in calories, so I often eat them as a light snack.","카프레제 꼬치는 열량이 낮아서 저는 가벼운 간식으로 그것들을 자주 먹어요."],"ow":["오답 ✕ — 본문에 'Caprese skewers are low in calories, so I often eat them as a light snack.'(카프레제 꼬치는 열량이 낮아서 가벼운 간식으로 자주 먹어요)라고 했으므로 맞는 설명이에요.","정답 ○ — Mina는 'I don't use any flour, either. I use only tofu.'(밀가루도 사용하지 않아요. 두부만 사용해요)라고 했어요. 두부칩에 밀가루가 필요하다는 이 보기는 본문과 달라서 일치하지 않아요.","오답 ✕ — 'Eat the tofu chips with honey or garlic powder.'(두부칩을 꿀이나 마늘 가루와 같이 먹어 보세요)라고 했으니 마늘 가루와 함께 먹을 수 있다는 말은 맞아요.","오답 ✕ — Bella는 'I'm Bella from Italy.', Mina는 'I'm Mina from Korea'라고 했으니 서로 다른 나라 출신이 맞아요.","오답 ✕ — 'You just need mozzarella cheese, cherry tomatoes, and basil leaves.'(모차렐라치즈, 방울토마토, 바질 잎만 있으면 돼요)에서 재료가 세 가지임을 알 수 있어요."],"memo":["정답: ② 두부칩에 밀가루가 필요하다는 말은 ✕ (두부만 사용)","근거: I don't use any flour, either. I use only tofu.(밀가루도 사용하지 않아요. 두부만 사용해요.)","함정: ④ Bella는 이탈리아, Mina는 한국이라 다른 나라 출신이 맞아서 ○"],"why":"Mina의 두부칩은 밀가루 없이 두부만 사용하므로 '밀가루가 필요하다'는 틀린 말이다."},{"n":8,"q":"위 글의 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["bakes - tofu","fries - tofu","bakes - flour","fries - flour","bakes - honey"],"a":0,"ans":"bakes - tofu","evs":[["I don't fry my chips but bake them.","저는 칩을 튀기지 않고 굽거든요."],["I don't use any flour, either.","저는 밀가루도 사용하지 않아요."],["I use only tofu.","두부만 사용해요."]],"ev":["I don't fry my chips but bake them.","저는 칩을 튀기지 않고 굽거든요."],"ow":["정답 ○ — Mina는 'I don't fry my chips but bake them.'(칩을 튀기지 않고 굽는다)와 'I use only tofu.'(두부만 사용한다)라고 했어요. (A)는 bakes, (B)는 tofu예요.","오답 ✕ — 본문에 'I don't fry my chips but bake them.'(튀기지 않고 굽는다)라고 했는데 이 보기는 fries(튀긴다)라서 (A)가 틀려요.","오답 ✕ — (A) bakes는 맞아요. 하지만 'I don't use any flour, either.'(밀가루도 사용하지 않아요)라고 했으므로 (B) flour는 틀려요.","오답 ✕ — 'I don't fry my chips but bake them.'(튀기지 않고 굽는다)와 'I don't use any flour'(밀가루를 쓰지 않는다)에 모두 어긋나서 (A), (B)가 둘 다 틀려요.","오답 ✕ — (A) bakes는 맞지만, 'I use only tofu.'(두부만 사용해요)라고 했어요. 꿀(honey)은 'Eat the tofu chips with honey or garlic powder.'처럼 곁들여 먹는 것이라서 재료가 아니에요."],"memo":["정답: ① bakes - tofu (굽고, 두부만 사용)","근거: I don't fry my chips but bake them. I use only tofu.(튀기지 않고 굽는다. 두부만 사용한다.)","함정: honey(꿀)는 재료가 아니라 곁들여 먹는 것이라 ⑤는 ✕"],"why":"Mina의 두부칩은 튀기지 않고 굽고 두부만 쓰기 때문에 건강하다.","sum":"Mina's tofu chips are healthy because she (A)________ them instead of frying and uses only (B)________.","lab":"완성된 요약문 : "}],"pp":[["Bella","Bella"],["Ciao, I'm Bella from Italy.","안녕하세요, 저는 이탈리아에서 온 Bella입니다."],["I'm making caprese skewers.","저는 카프레제 꼬치를 만들고 있어요."],["Anyone can make these.","누구나 이것을 만들 수 있어요."],["You just need mozzarella cheese, cherry tomatoes, and basil leaves.","모차렐라치즈, 방울토마토, 그리고 바질 잎만 있으면 돼요."],["Just put them on skewers, and they'll become healthy snacks.","그것들을 꼬치에 꽂기만 하면, 건강한 간식이 될 거예요."],["Caprese skewers are low in calories, so I often eat them as a light snack.","카프레제 꼬치는 열량이 낮아서 저는 가벼운 간식으로 그것들을 자주 먹어요."],["Mina","미나"],["Hi, I'm Mina from Korea, and I'm baking tofu chips.","안녕하세요, 저는 한국에서 온 미나이고, 두부칩을 굽고 있어요."],["Unlike other chips, my tofu chips are healthy.","다른 칩들과는 다르게, 제 두부칩은 건강에 좋아요."],["Why?","왜냐고요?"],["I don't fry my chips but bake them.","저는 칩을 튀기지 않고 굽거든요."],["I don't use any flour, either.","저는 밀가루도 사용하지 않아요."],["I use only tofu.","두부만 사용해요."],["Eat the tofu chips with honey or garlic powder.","두부칩을 꿀이나 마늘 가루와 같이 먹어 보세요."],["They'll taste good.","맛이 좋을 거예요."]]},{"qs":[{"n":9,"q":"윗글의 제목으로 알맞은 것은?","o":["My Favorite Snack","What is Superfood?","Traditional Brazilian Food","Acai Bowl: A Healthy Snack","What is Acai Berry Good for?"],"a":3,"ans":"Acai Bowl: A Healthy Snack","evs":[["I'm making an acai bowl right now.","저는 지금 아사이 볼을 만들고 있어요."],["It's a thick acai berry smoothie in a bowl.","그것은 그릇에 담긴 걸쭉한 아사이베리 스무디예요."],["You can add other healthy foods like nuts and bananas, and it'll taste really good.","여러분은 견과류와 바나나 같은 건강에 좋은 다른 식품을 추가할 수 있는데, 그러면 맛이 아주 좋을 거예요."]],"ev":["I'm making an acai bowl right now.","저는 지금 아사이 볼을 만들고 있어요."],"ow":["오답 ✕ — 이 글은 Miguel이 아사이 볼을 만드는 이야기이지, 자기가 가장 좋아하는 간식을 고르는 이야기가 아니에요. 'I'm making an acai bowl right now.'(지금 아사이 볼을 만들고 있어요)가 핵심이에요.","오답 ✕ — 'Acai berries are a superfood'(아사이베리는 슈퍼 푸드예요)라는 말은 한 문장 나오지만, 슈퍼푸드가 무엇인지 설명하는 글은 아니에요. 너무 좁은 보기예요.","오답 ✕ — Miguel이 브라질 출신이라고 했지만 브라질 전통 음식 전체를 소개하는 글이 아니고, 아사이 볼 하나를 만드는 이야기예요.","정답 ○ — 'It's a thick acai berry smoothie in a bowl.'(그릇에 담긴 걸쭉한 아사이베리 스무디예요)와 'other healthy foods like nuts and bananas'(견과류와 바나나 같은 건강한 식품)에서 건강한 간식인 아사이 볼을 소개하는 글이므로 제목으로 알맞아요.","오답 ✕ — 아사이베리가 어디에 좋은지(효능)를 설명하는 부분은 없어요. 'a superfood'라고만 했고, 글의 중심은 아사이 볼 만들기예요."],"memo":["정답: ④ Acai Bowl: A Healthy Snack (건강한 간식, 아사이 볼)","근거: I'm making an acai bowl right now.(저는 지금 아사이 볼을 만들고 있어요.)","함정: ⑤는 아사이베리의 효능 설명이 본문에 없어서 ✕"],"why":"브라질 출신 Miguel이 건강한 간식인 아사이 볼을 소개하는 글이다."},{"n":10,"q":"윗글의 내용과 일치하는 것은?","o":["Miguel's acai bowl is a thick acai berry smoothie in a bowl.","Miguel's acai bowl is made by frying acai berries.","Only people in Brazil enjoy acai berries.","Miguel's acai bowl cannot have any other foods.","Acai berries are not a superfood."],"a":0,"ans":"Miguel's acai bowl is a thick acai berry smoothie in a bowl.","evs":[["I'm making an acai bowl right now.","저는 지금 아사이 볼을 만들고 있어요."],["It's a thick acai berry smoothie in a bowl.","그것은 그릇에 담긴 걸쭉한 아사이베리 스무디예요."],["You can add other healthy foods like nuts and bananas, and it'll taste really good.","여러분은 견과류와 바나나 같은 건강에 좋은 다른 식품을 추  +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}

var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;

document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});

 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
