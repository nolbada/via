<style>

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Welcome to the School Heroes Awards! I'm the student president, Eunho Choi.","ko":"학교 영웅상 시상식에 오신 것을 환영합니다! 저는 학생회장 최은호입니다.","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"During the school day, we see our friends and teachers most of the times.","ko":"학교생활을 하는 동안에, 우리는 대부분의 시간을 우리의 친구들과 선생님들을 보며 보냅니다.","ok":false,"foot":[],"fixes":[{"wrong":"times","right":"time","partial":false,"at":[13],"point":"관용 표현: most of the time(대부분의 경우)은 단수 time 사용","topic":"관용 표현","memo":"most of the time(대부분의 경우)은 단수 time 사용"}]},{"n":3,"tag":null,"en":"But there are other people who play roles behind of the scenes! Today, we have awards to present to three of these hero.","ko":"하지만 보이지 않는 곳에서 역할을 하는 다른 분들이 계십니다! 오늘, 우리는 이 영웅들 중 세 분께 상을 드리려고 합니다.","ok":false,"foot":[],"fixes":[{"wrong":"of the","right":"the","partial":false,"at":[9],"point":"기본전치사: behind 뒤에는 of 없이 바로 명사구","topic":"기본전치사","memo":"behind 뒤에는 of 없이 바로 명사구"},{"wrong":"hero","right":"heroes","partial":false,"at":[22],"point":"지시형용사와 복수명사: these 뒤에는 복수명사 heroes 사용","topic":"지시형용사와 복수명사","memo":"these 뒤에는 복수명사 heroes 사용"}]},{"n":4,"tag":null,"en":"Drum roll, please! The first winner is the facilities manager, Mr. Kim!","ko":"드럼 롤 부탁드립니다! 첫 번째 수상자는 시설 관리자이신 김 선생님입니다!","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"He take care of our school buildings. Do you remember last summer?","ko":"그분은 우리 학교 건물을 관리하십니다. 지난여름을 기억하시나요?","ok":false,"foot":[],"fixes":[{"wrong":"take","right":"takes","partial":false,"at":[1],"point":"3인칭 단수 현재형: 주어 He에는 takes 사용","topic":"3인칭 단수 현재형","memo":"주어 He에는 takes 사용"}]},{"n":6,"tag":null,"en":"Some air conditioners broke down, and it became very heat. However, Mr. Kim came right away and fix them.","ko":"에어컨 몇 대가 고장 나서 정말 더웠었죠. 하지만 김 선생님이 바로 오셔서 그것들을 고쳐 주셨습니다.","ok":false,"foot":[],"fixes":[{"wrong":"heat","right":"hot","partial":false,"at":[9],"point":"형용사와 명사의 품사: became 뒤 보어 자리에는 형용사 hot 사용","topic":"형용사와 명사의 품사","memo":"became 뒤 보어 자리에는 형용사 hot 사용"},  대가 고장 나서 정말 더웠었죠.",0],["However, Mr. Kim came right away and fixed them.","하지만 김 선생님이 바로 오셔서 그것들을 고쳐 주셨습니다.",0],["He works hard to make our school a great place for studying.","그분은 우리 학교를 공부하기에 좋은 곳으로 만들기 위해 열심히 일하십니다.",0],["\"I love working for our students.","\"저는 우리 학생들을 위해 일하는 것이 정말 좋습니다.",1],["If you have a question about the school facilities, feel free to ask me!\"","만약 학교 시설에 대해 궁금한 점이 있다면, 주저하지 말고 저에게 물어보세요!\"",0],["- Mr. Kim","- 김 선생님",1],["The next award goes to … the leader of the cafeteria staff, Ms. Lee!","다음 상은… 급식실 직원 리더이신 이 선생님께 드립니다!",1],["Many students say our school lunches are the best.","많은 학생들이 우리 학교 점심이 최고라고 말합니다.",0],["Ms. Lee prepares fresh and delicious meals for us every day.","이 선생님은 매일 우리에게 신선하고 맛있는 식사를 준비해 주십니다.",0],["At lunchtime, she serves us food with a big smile.","점심시간에는 환하게 미소 지으며 우리에게 음식을 나눠 주십니다.",0],["After the students leave the cafeteria, she washes the dishes and cleans the cafeteria.","학생들이 급식실을 떠난 후에는, 설거지를 하시고 급식실을 청소하십니다.",0],["\"I'm happy when students enjoy their lunches.","\"학생들이 점심을 맛있게 먹을 때 저는 행복합니다.",1],["I'm proud to serve delicious and healthy food.\"","맛있고 건강한 음식을 제공할 수 있어서 자랑스럽습니다.\"",0],["- Ms. Lee","- 이 선생님",1]];var RNUM=21;var TITLE_EN="The School Heroes Awards";var PASS_EN=["The School Heroes Awards","Welcome to the School Heroes Awards! I'm the student president, Eunho Choi. During the school day, we see our friends and teachers most of the time. But there are other people who play roles behind the scenes! Today, we have awards to present to three of these heroes.","Drum roll, please! The first winner is the facilities manager, Mr. Kim! He takes care of our school buildings. Do you remember last summer? Some air conditioners broke down, and it became very hot. However, Mr. Kim came right away and fixed them. He works hard to make our school a great place for studying.","\"I love working for our students. If you have a question about the school facilities, feel free to ask me!\"","- Mr. Kim","The next award goes to … the leader of the cafeteria staff, Ms. Lee! Many students say our school lunches are the best. Ms. Lee prepares fresh and delicious meals for us every day. At lunchtime, she serves us food with a big smile. After the students leave the cafeteria, she washes the dishes and cleans the cafeteria.","\"I'm happy when students enjoy their lunches. I'm proud to serve delicious and healthy food.\"","- Ms. Lee"];var PASS_KO=["학교 영웅상","학교 영웅상 시상식에 오신 것을 환영합니다! 저는 학생회장 최은호입니다. 학교생활을 하는 동안에, 우리는 대부분의 시간을 우리의 친구들과 선생님들을 보며 보냅니다. 하지만 보이지 않는 곳에서 역할을 하는 다른 분들이 계십니다! 오늘, 우리는 이 영웅들 중 세 분께 상을 드리려고 합니다.","드럼 롤 부탁드립니다! 첫 번째 수상자는 시설 관리자이신 김 선생님입니다! 그분은 우리 학교 건물을 관리하십니다. 지난여름을 기억하시나요? 에어컨 몇 대가 고장 나서 정말 더웠었죠. 하지만 김 선생님이 바로 오셔서 그것들을 고쳐 주셨습니다. 그분은 우리 학교를 공부하기에 좋은 곳으로 만들기 위해 열심히 일하십니다.","\"저는 우리 학생들을 위해 일하는 것이 정말 좋습니다. 만약 학교 시설에 대해 궁금한 점이 있다면, 주저하지 말고 저에게 물어보세요!\"","- 김 선생님","다음 상은… 급식실 직원 리더이신 이 선생님께 드립니다! 많은 학생들이 우리 학교 점심이 최고라고 말합니다. 이 선생님은 매일 우리에게 신선하고 맛있는 식사를 준비해 주십니다. 점심시간에는 환하게 미소 지으며 우리에게 음식을 나눠 주십니다. 학생들이 급식실을 떠난 후에는, 설거지를 하시고 급식실을 청소하십니다.","\"학생들이 점심을 맛있게 먹을 때 저는 행복합니다. 맛있고 건강한 음식을 제공할 수 있어서 자랑스럽습니다.\"","- 이 선생님"];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["Minji's idea for reusing old clothes","volunteer work at the school festival","various activities at the school festival","how to make key rings with old clothes","preparation for Minji's school festival booth"],"a":4,"ans":"preparation for Minji's school festival booth","evs":[["Hi, Jeongho. Yes, I am. I'm looking forward to running my booth.","안녕, 정호야. 응, 다 됐어. 내 부스를 운영하는 게 정말 기대돼."],["They can make their own key rings. They just need to bring some old clothes.","자기만의 열쇠고리를 만들 수 있어. 헌 옷만 좀 가져오면 돼."],["Oh, really? Actually, I need two people who can work with me.","오, 정말? 사실 나랑 같이 일할 수 있는 사람이 두 명 필요해."]],"ev":["Hi, Jeongho. Yes, I am. I'm looking forward to running my booth.","안녕, 정호야. 응, 다 됐어. 내 부스를 운영하는 게 정말 기대돼."],"ow":["오답 ✕ — 'They can make their own key rings. They just need to bring some old clothes.'(자기만의 열쇠고리를 만들 수 있어. 헌 옷만 좀 가져오면 돼.)에서 헌 옷 재활용은 부스 활동의 일부일 뿐이고, 대화의 중심은 부스 준비와 도움 요청이다.","오답 ✕ — 정호가 'I can give you a hand.'(내가 도와줄 수 있어.)라며 돕겠다고 하지만, 축제 자원봉사 전체가 아니라 민지의 부스를 돕는 이야기이다.","오답 ✕ — 축제의 여러 활동을 소개하는 대화가 아니다. 민지의 부스 하나에 대해서만 이야기한다.","오답 ✕ — 'They can make their own key rings.'(자기만의 열쇠고리를 만들 수 있어.)라는 말은 있지만 열쇠고리를 만드는 방법을 설명하지는 않는다.","정답 ○ — 민지가 'I'm looking forward to running my booth.'(내 부스를 운영하는 게 정말 기대돼.)라고 하고, 'I need two people who can work with me.'(나랑 같이 일할 수 있는 사람이 두 명 필요해.)라며 함께할 사람을 구한다. 부스 준비에 관한 대화이다."],"memo":["주제: 민지의 학교 축제 부스 준비","근거: Actually, I need two people who can work with me.(사실 나랑 같이 일할 수 있는 사람이 두 명 필요해.)","함정: 헌 옷 재활용·열쇠고리는 부스 활동의 일부일 뿐이다."],"why":"민지의 축제 부스를 준비하고 함께할 사람을 구하는 대화."},{"n":2,"q":"위 대화를 읽고 답할 수 없는 질문은?","o":["What can students make at Minji's booth?","What do students need to bring to the booth?","How many people does Minji need for her booth?","Where can students find Minji's booth?","Who will Minji ask to join them?"],"a":3,"ans":"Where can students find Minji's booth?","evs":[["They can make their own key rings. They just need to bring some old clothes.","자기만의 열쇠고리를 만들 수 있어. 헌 옷만 좀 가져오면 돼."],["Oh, really? Actually, I need two people who can work with me.","오, 정말? 사실 나랑 같이 일할 수 있는 사람이 두 명 필요해."],["I'll do it. And maybe Mingyu will join us, too.","내가 할게. 그리고 아마 민규도 함께할 거야."],["That sounds perfect. I'll ask him!","그거 완벽하다. 내가 민규에게 물어볼게!"]],"ev":["They can make their own key rings. They just need to bring some old clothes.","자기만의 열쇠고리를 만들 수 있어. 헌 옷만 좀 가져오면 돼."],"ow":["오답 ✕ — 'They can make their own key rings.'(자기만의 열쇠고리를 만들 수 있어.)에서 학생들은 열쇠고리를 만들 수 있다. 답할 수 있는 질문이다.","오답 ✕ — 'They just need to bring some old clothes.'(헌 옷만 좀 가져오면 돼.)에서 헌 옷을 가져와야 함을 알 수 있다. 답할 수 있다.","오답 ✕ — 'I need two people who can work with me.'(나랑 같이 일할 수 있는 사람이 두 명 필요해.)에서 두 명이 필요함을 알 수 있다. 답할 수 있다.","정답 ○ — 대화에는 민지의 부스가 어디에 있는지 말해 주는 문장이 없다. 그래서 읽고 답할 수 없는 질문이다.","오답 ✕ — 'maybe Mingyu will join us'(아마 민규도 함께할 거야)와 'I'll ask him!'(내가 민규에게 물어볼게!)에서 민지가 민규에게 물어볼 것임을 알 수 있다. 답할 수 있다."],"memo":["부스의 위치는 대화에 나오지 않는다.","근거: 위치에 대한 문장 없음 (가장 가까운 문장: I'm looking forward to running my booth.)","함정: 만들 것(열쇠고리)·준비물(헌 옷)·인원(두 명)·민규는 모두 대화에 나온다."],"why":"부스 위치는 대화에 나오지 않으므로 ④."}],"dlg":[["B","Hi, Minji. Are you ready for the school festival?","안녕, 민지야. 학교 축제 준비는 다 됐어?"],["G","Hi, Jeongho. Yes, I am. I'm looking forward to running my booth.","안녕, 정호야. 응, 다 됐어. 내 부스를 운영하는 게 정말 기대돼."],["B","Oh, what can students do at your booth?","오, 네 부스에서 학생들은 뭘 할 수 있어?"],["G","They can make their own key rings. They just need to bring some old clothes.","자기만의 열쇠고리를 만들 수 있어. 헌 옷만 좀 가져오면 돼."],["B","That's a great idea. Do you need any help? I can give you a hand.","좋은 생각이다. 도움이 필요하니? 내가 도와줄 수 있어."],["G","Oh, really? Actually, I need two people who can work with me.","오, 정말? 사실 나랑 같이 일할 수 있는 사람이 두 명 필요해."],["B","I'll do it. And maybe Mingyu will join us, too.","내가 할게. 그리고 아마 민규도 함께할 거야."],["G","That sounds perfect. I'll ask him!","그거 완벽하다. 내가 민규에게 물어볼게!"]]},{"qs":[{"n":3,"q":"What will the girl do next?","o":["Play the balloon game alone","Call Taemin and ask him","Finish her homework first","Look at a sign","Go home early"],"a":1,"ans":"Call Taemin and ask him","evs":[["Wait, maybe Taemin will want to join us.","잠깐, 아마 태민이도 우리랑 같이하고 싶어 할 거야."],["You're right. He likes all kinds of games. I'll call him and ask him.","네 말이 맞아. 그는 모든 종류의 게임을 좋아하잖아. 내가 전화해서 물어볼게."]],"ev":["Wait, maybe Taemin will want to join us.","잠깐, 아마 태민이도 우리랑 같이하고 싶어 할 거야."],"ow":["오답 ✕ — 남자아이가 'maybe Taemin will want to join us'(아마 태민이도 우리랑 같이하고 싶어 할 거야)라고 하자 여자아이도 동의한다. 혼자 하겠다는 말은 없다.","정답 ○ — 여자아이가 'I'll call him and ask him.'(내가 전화해서 물어볼게.)라고 말하므로 태민이에게 전화해서 함께할지 물어볼 것이다.","오답 ✕ — 숙제를 먼저 끝내자는 말은 대화에 없다. 둘은 'looking forward to playing some games'(게임을 하는 게 기대돼)라고 했다.","오답 ✕ — 표지판을 보라는 말은 없다. 'This balloon game looks fun.'(이 풍선 게임 재미있어 보인다.)이 나올 뿐이다.","오답 ✕ — 집에 일찍 간다는 말은 없다. 둘은 게임을 하려고 한다."],"memo":["여자아이는 태민이에게 전화해서 물어볼 것이다.","근거: I'll call him and ask him.(내가 전화해서 물어볼게.)","함정: 태민이를 기다리자는 것이지 게임을 포기하는 것이 아니다."],"why":"태민이도 같이 하자고 전화해서 물어볼 것이다."}],"dlg":[["B","I'm looking forward to playing some games today.","나는 오늘 게임을 하는 게 정말 기대돼."],["G","Me too. This balloon game looks fun. Why don't we try it?","나도. 이 풍선 게임 재미있어 보인다. 우리 이거 해 보는 게 어때?"],["B","Wait, maybe Taemin will want to join us.","잠깐, 아마 태민이도 우리랑 같이하고 싶어 할 거야."],["G","You're right. He likes all kinds of games. I'll call him and ask him.","네 말이 맞아. 그는 모든 종류의 게임을 좋아하잖아. 내가 전화해서 물어볼게."],["B","All right.","좋아."]]},{"qs":[{"n":4,"q":"윗글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["robot - tteokbokki","snack - cake","snack - tteokbokki","photo - cake","dance - tteokbokki"],"a":2,"ans":"snack - tteokbokki","evs":[["How about eating some food at the snack booth over there?","저기 있는 분식 부스에서 음식을 좀 먹는 게 어때?"],["Oh, that tteokbokki looks delicious. Let's go!","오, 저 떡볶이 맛있어 보인다. 가자!"]],"ev":["How about eating some food at the snack booth over there?","저기 있는 분식 부스에서 음식을 좀 먹는 게 어때?"],"ow":["오답 ✕ — tteokbokki는 맞지만 'the snack booth'(분식 부스)에서 먹자고 했으므로 robot(로봇) 부스가 아니다.","오답 ✕ — snack booth는 맞지만 여자아이가 'that tteokbokki looks delicious'(저 떡볶이 맛있어 보인다)라고 했으므로 먹을 것은 케이크(cake)가 아니라 떡볶이이다.","정답 ○ — 'How about eating some food at the snack booth over there?'(저기 있는 분식 부스에서 음식을 좀 먹는 게 어때?)와 'Oh, that tteokbokki looks delicious. Let's go!'(오, 저 떡볶이 맛있어 보인다. 가자!)에서 (A) snack, (B) tteokbokki이다.","오답 ✕ — photo(사진) 부스 이야기는 없고 cake(케이크)도 나오지 않는다.","오답 ✕ — 'dance'(춤) 부스에 간다는 말은 없다. 둘은 snack booth로 간다."],"memo":["(A) snack, (B) tteokbokki","근거: How about eating some food at the snack booth over there?(저기 있는 분식 부스에서 음식을 좀 먹는 게 어때?)","함정: 다른 부스(로봇·사진·춤)는 대화에 나오지 않는다."],"why":"분식 부스에서 떡볶이를 먹으러 간다.","sum":"The two friends go to the (A) booth to eat (B) at the school festival.","lab":"완성된 요약문 : "}],"dlg":[["G","I'm excited about the school festival.","나는 학교 축제가 정말 신나."],["B","Me too. I'm looking forward to trying many things today.","나도. 나는 오늘 많은 것을 해 보는 게 정말 기대돼."],["G","What should we do first?","우리 먼저 뭘 할까?"],["B","How about eating some food at the snack booth over there?","저기 있는 분식 부스에서 음식을 좀 먹는 게 어때?"],["G","Oh, that tteokbokki looks delicious. Let's go!","오, 저 떡볶이 맛있어 보인다. 가자!"]]},{"qs":[{"n":5,"q":"윗글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["gifts - writer","advice - singer","advice - writer","books - teacher","gifts - singer"],"a":2,"ans":"advice - writer","evs":[["I was not sure about my dream of becoming a writer. But you gave me good advice and cheered me up.","저는 작가가 되겠다는 제 꿈에 확신이 없었어요. 하지만 선생님께서 좋은 조언을 해 주시고 저를 격려해 주셨어요."]],"ev":["I was not sure about my dream of becoming a writer. But you gave me good advice and cheered me up.","저는 작가가 되겠다는 제 꿈에 확신이 없었어요. 하지만 선생님께서 좋은 조언을 해 주시고 저를 격려해 주셨어요."],"ow":["오답 ✕ — writer는 맞지만 'you gave me good advice'(선생님께서 좋은 조언을 해 주셨어요)라고 했으므로 선물(gifts)이 아니라 조언(advice)이다.","오답 ✕ — advice는 맞지만 지예의 꿈은 'becoming a writer'(작가가 되는 것)이므로 singer(가수)가 아니다.","정답 ○ — 'I was not sure about my dream of becoming a writer. But you gave me good advice and cheered me up.'(저는 작가가 되겠다는 제 꿈에 확신이 없었어요. 하지만 선생님께서 좋은 조언을 해 주시고 저를 격려해 주셨어요.)에서 (A) advice, (B) writer이다.","오답 ✕ — 책(books)을 받았다는 말은 없고, 꿈은 teacher(선생님)가 아니라 작가이다.","오답 ✕ — 선물(gifts)도 가수(singer)도 편지에 나오지 않는다."],"memo":["(A) advice, (B) writer","근거: But you gave me good advice and cheered me up.(하지만 선생님께서 좋은 조언을 해 주시고 저를 격려해 주셨어요.)","함정: 선물을 받은 것이 아니라 '조언'을 받았다."],"why":"지예는 작가라는 꿈에 대한 선생님의 조언에 감사했다.","sum":"Jiye thanks Mr. Yoon because he gave her good (A) about her dream of becoming a (B).","lab":"완성된 요약문 : "}],"dlg":[["B","Good afternoon! I'm Hojin from VBS.","안녕하세요! 저는 VBS의 호진입니다."],["B","Today, I'll read a thank-you letter from Jiye to her homeroom teacher, Mr. Yoon.","오늘은 지예가 담임 선생님이신 윤 선생님께 보낸 감사 편지를 읽어 드릴게요."],["B","“Dear Mr. Yoon, it's me, Jiye. I'd like to say thank you.","“윤 선생님께, 저 지예예요. 감사하다는 말씀을 드리고 싶어요."],["B","I was not sure about my dream of becoming a writer. But you gave me good advice and cheered me up.","저는 작가가 되겠다는 제 꿈에 확신이 없었어요. 하지만 선생님께서 좋은 조언을 해 주시고 저를 격려해 주셨어요."],["B","I think my dream can come true, and I'm looking forward to achieving it. Maybe I will be famous someday, and it will be all thanks to you!”","저는 제 꿈이 이루어질 수 있다고 생각하고, 그 꿈을 이루는 것이 정말 기대돼요. 아마 저는 언젠가 유명해질 텐데, 그건 모두 선생님 덕분일 거예요!”"],["B","What a nice story. Good luck, Jiye. I'll be back after this song!","정말 멋진 이야기네요. 행운을 빌어요, 지예 학생. 이 노래 듣고 다시 돌아올게요!"]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["Eunho Choi is a facilities manager.","Awards are given to three heroes.","The heroes work only in front of students.","The awards are for the best students.","Students only see their friends and teachers at school."],"a":1,"ans":"Awards are given to three heroes.","evs":[["I'm the student president, Eunho Choi.","저는 학생회장 최은호입니다."],["But there are other people who play roles behind the scenes!","하지만 보이지 않는 곳에서 역할을 하는 다른 분들이 계십니다!"],["Today, we have awards to present to three of these heroes.","오늘, 우리는 이 영웅들 중 세 분께 상을 드리려고 합니다."]],"ev":["I'm the student president, Eunho Choi.","저는 학생회장 최은호입니다."],"ow":["오답 ✕ — 'I'm the student president, Eunho Choi.'(저는 학생회장 최은호입니다.)라고 했으므로 시설 관리자가 아니라 학생회장이다. 시설 관리자는 첫 번째 수상자 김 선생님이다.","정답 ○ — 'Today, we have awards to present to three of these heroes.'(오늘, 우리는 이 영웅들 중 세 분께 상을 드리려고 합니다.)라고 했으므로 세 명의 영웅에게 상을 준다.","오답 ✕ — 'there are other people who play roles behind the scenes'(보이지 않는 곳에서 역할을 하는 다른 분들이 계십니다)라고 했으므로 학생들 앞이 아니라 보이지 않는 곳에서 일하는 분들이다.","오답 ✕ — 상은 학생이 아니라 보이지 않는 곳에서 일하는 영웅들에게 주는 상이다.","오답 ✕ — 'we see our friends and teachers most of the time'(우리는 대부분의 시간을 우리의 친구들과 선생님들을 보며 보냅니다)이지만, 그 외에도 보이지 않는 곳의 다른 분들이 있다고 했으므로 '오직'이라는 말은 틀리다."],"memo":["상은 세 명의 영웅에게 수여된다.","근거: Today, we have awards to present to three of these heroes.(오늘, 우리는 이 영웅들 중 세 분께 상을 드리려고 합니다.)","함정: 영웅들은 '보이지 않는 곳에서' 역할을 하는 분들이다."],"why":"학교 영웅 세 분께 상을 드리는 시상식이다."}],"pp":[["Welcome to the School Heroes Awards!","학교 영웅상 시상식에 오신 것을 환영합니다!"],["I'm the student president, Eunho Choi.","저는 학생회장 최은호입니다."],["During the school day, we see our friends and teachers most of the time.","학교생활을 하는 동안에, 우리는 대부분의 시간을 우리의 친구들과 선생님들을 보며 보냅니다."],["But there are other people who play roles behind the scenes!","하지만 보이지 않는 곳에서 역할을 하는 다른 분들이 계십니다!"],["Today, we have awards to present to three of these heroes.","오늘, 우리는 이 영웅들 중 세 분께 상을 드리려고 합니다."],["Drum roll, please!","드럼 롤 부탁드립니다!"]]},{"qs":[{"n":7,"q":"윗글의 제목으로 알맞은 것은?","o":["Many Different Dream Jobs","Let's Look for Old School Facilities","Club Activities to Make Our School Better","Mr. Kim: A Hero for Great School Facilities","Why Did Mr. Kim Become a Facilities Manager?"],"a":3,"ans":"Mr. Kim: A Hero for Great School Facilities","evs":[["He takes care of our school buildings.","그분은 우리 학교 건물을 관리하십니다."],["However, Mr. Kim came right away and fixed them.","하지만 김 선생님이 바로 오셔서 그것들을 고쳐 주셨습니다."],["He works hard to make our school a great place for studying.","그분은 우리 학교를 공부하기에 좋은 곳으로 만들기 위해 열심히 일하십니다."]],"ev":["He takes care of our school buildings.","그분은 우리 학교 건물을 관리하십니다."],"ow":["오답 ✕ — 직업이나 꿈에 대한 글이 아니다. 김 선생님이 'He takes care of our school buildings.'(그분은 우리 학교 건물을 관리하십니다.)라는 이야기이다.","오답 ✕ — 낡은 시설을 찾아보자는 내용은 없다. 김 선생님이 에어컨을 고쳐 준 이야기이다.","오답 ✕ — 동아리 활동은 나오지 않는다.","정답 ○ — 'He works hard to make our school a great place for studying.'(그분은 우리 학교를 공부하기에 좋은 곳으로 만들기 위해 열심히 일하십니다.)와 'Mr. Kim came right away and fixed them.'(김 선생님이 바로 오셔서 그것들을 고쳐 주셨습니다.)에서 학교 시설을 책임지는 영웅임을 알 수 있다.","오답 ✕ — 김 선생님이 왜 시설 관리자가 되었는지는 글에 나오지 않는다."],"memo":["제목: Mr. Kim: A Hero for Great School Facilities","근거: He works hard to make our school a great place for studying.(그분은 우리 학교를 공부하기에 좋은 곳으로 만들기 위해 열심히 일하십니다.)","함정: 되게 된 이유(⑤)는 글에 없다."],"why":"학교 시설을 책임지는 김 선생님을 소개하는 글."},{"n":8,"q":"윗글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["broke - studying","fixed - playing","fixed - studying","ignored - studying","fixed - sleeping"],"a":2,"ans":"fixed - studying","evs":[["Some air conditioners broke down, and it became very hot.","에어컨 몇 대가 고장 나서 정말 더웠었죠."],["However, Mr. Kim came right away and  +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
