rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Do you ever mix up people with similarly names?", "ko": "여러분은 비슷한 이름을 가진 사람들을 혼동하곤 하나요?", "ok": false, "foot": [], "fixes": [{"wrong": "similarly", "right": "similar", "partial": false, "at": [7], "point": "형용사 vs 부사: 명사(names)를 꾸미는 자리이므로 형용사 similar 사용 (부사 similarly 아님)", "topic": "형용사 vs 부사", "memo": "명사(names)를 꾸미는 자리이므로 형용사 similar 사용 (부사 similarly 아님)"}]}, {"n": 2, "tag": null, "en": "In the late 19th century, there were two French painter which had similar names: Manet and Monet.", "ko": "19세기 후반에 비슷한 이름을 가진 프랑스 화가 두 명이 있었어요. 마네와 모네입니다.", "ok": false, "foot": [], "fixes": [{"wrong": "painter", "right": "painters", "partial": false, "at": [9], "point": "수일치: two와 함께 복수명사 painters 사용 (painter 아님)", "topic": "수일치", "memo": "two와 함께 복수명사 painters 사용 (painter 아님)"}, {"wrong": "which", "right": "who", "partial": false, "at": [10], "point": "관계대명사: 선행사가 사람(painters)이므로 who 사용 (which 아님)", "topic": "관계대명사", "memo": "선행사가 사람(painters)이므로 who 사용 (which 아님)"}]}, {"n": 3, "tag": null, "en": "One day, Manet heard people at an exhibit.", "ko": "어느 날, 마네는 전시회에서 사람들의 말을 들었어요.", "ok": true, "foot": ["1exhibit 전시회"], "fixes": []}, {"n": 4, "tag": null, "en": "They was praising a painter.", "ko": "그들은 한 화가를 칭찬하고 있었어요.", "ok": false, "foot": ["1praising 칭찬하다"], "fixes": [{"wrong": "was", "right": "were", "partial": false, "at": [1], "point": "수일치: 주어 They(복수)에 맞춰 be동사 were 사용", "topic": "수일치", "memo": "주어 They(복수)에 맞춰 be동사 were 사용"}]}, {"n": 5, "tag": null, "en": "He thought they were talking about he.", "ko": "그는 그들이 자신에 대해서 말하고 있다고 생각했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "he", "right": "him", "partial": false, "at": [6], "point": "대명사의 격: 전치사(about) 뒤에는 목적격 him 사용", "topic": "대명사의 격", "memo": "전치사(about) 뒤에는 목적격 him 사용"}]}, {"n": 6, "tag": null, "en": "He felt happy, but they were actual talking about Monet!", "ko": "그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요!", "ok": false, "foot": [], "fixes": [{"wrong": "actual", "right": "actually", "partial": false, "at": [6], "point": "부사 자리: 동사(were talking)를 꾸미는 자리이므로 actually 사용 (actual은 형용사)", "topic": "부사 자리", "memo": "동사(were talking)를 꾸미는 자리이므로 actually 사용 (actual은 형용사)"}]}, {"n": 7, "tag": null, "en": "This realization made Manet felt upset, and he shouted, “Who is this Monet who name sounds just like mine?”", "ko": "이 사실을 깨닫자, 마네는 기분이 상해서 외쳤어요. \"꼭 내 이름처럼 들리는 이름을 가진 이 모네라는 사람은 누구야?\"", "ok": false, "foot": [], "fixes": [{"wrong": "felt", "right": "feel", "partial": false, "at": [4], "point": "사역동사: make + 목적어(Manet) + 동사원형(feel) 사용 (felt 과거형 아님)", "topic": "사역동사", "memo": "make + 목적어(Manet) + 동사원형(feel) 사용 (felt 과거형 아님)"}, {"wrong": "who", "right": "whose", "partial": false, "at": [13], "point": "관계대명사: 뒤에 명사(name)가 오므로 소유격 관계대명사 whose 사용 (who 아님)", "topic": "관계대명사", "memo": "뒤에 명사(name)가 오므로 소유격 관계대명사 whose 사용 (who 아님)"}]}, {"n": 8, "tag": null, "en": "Even today, their similar names still cause people confuse Manet with Monet.", "ko": "오늘날까지도, 비슷한 이름 때문에 사람들은 여전히 마네와 모네를 혼동해요.", "ok": false, "foot": [], "fixes": [{"wrong": "confuse", "right": "to confuse", "partial": false, "at": [8], "point": "5형식: cause + 목적어 + to부정사(to confuse) 사용 (동사원형 confuse 아님)", "topic": "5형식", "memo": "cause + 목적어 + to부정사(to confuse) 사용 (동사원형 confuse 아님)"}]}, {"n": 9, "tag": null, "en": "So, what is the differences among them?", "ko": "그렇다면, 그들 사이의 차이점은 무엇일까요?", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [2], "point": "수일치: 주어 differences(복수)에 맞춰 동사 are 사용 (is 아님)", "topic": "수일치", "memo": "주어 differences(복수)에 맞춰 동사 are 사용 (is 아님)"}, {"wrong": "among", "right": "between", "partial": false, "at": [5], "point": "어휘: 둘 사이를 나타낼 때는 between 사용 (among은 셋 이상일 때)", "topic": "어휘", "memo": "둘 사이를 나타낼 때는 between 사용 (among은 셋 이상일 때)"}]}, {"n": 10, "tag": null, "en": "First, the focus of their paintings are different.", "ko": "첫째, 그들의 그림의 초점이 달라요.", "ok": false, "foot": [], "fixes": [{"wrong": "are", "right": "is", "partial": false, "at": [6], "point": "수일치: 문장의 주어는 the focus(단수) — of their paintings는 수식어구이므로 동사는 is", "topic": "수일치", "memo": "문장의 주어는 the focus(단수) — of their paintings는 수식어구이므로 동사는 is"}]}, {"n": 11, "tag": null, "en": "Manet focused on people.", "ko": "마네는 사람들에게 초점을 맞추었어요.", "ok": true, "foot": [], "fixes": []}, {"n": 12, "tag": null, "en": "He painted people in every day life.", "ko": "그는 일상 속 사람들을 그렸습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "every day", "right": "everyday", "partial": false, "at": [4], "point": "어휘: '일상의'라는 뜻의 형용사는 everyday(붙여쓰기)로 사용 (every day는 '매일'이라는 뜻의 부사구)", "topic": "어휘", "memo": "'일상의'라는 뜻의 형용사는 everyday(붙여쓰기)로 사용 (every day는 '매일'이라는 뜻의 부사구)"}]}, {"n": 13, "tag": null, "en": "For example, in his painting Boating, Manet paints a man and a woman on an boat.", "ko": "예를 들어, 그의 그림인 ‘뱃놀이(Boating)’에서, 마네는 배에 탄 남자와 여자를 그렸어요.", "ok": false, "foot": [], "fixes": [{"wrong": "paints", "right": "painted", "partial": false, "at": [7], "point": "시제: 글 전체가 과거 시제이므로 painted 사용 (paints 아님)", "topic": "시제", "memo": "글 전체가 과거 시제이므로 painted 사용 (paints 아님)"}, {"wrong": "an", "right": "a", "partial": false, "at": [14], "point": "관사: boat는 자음 발음[b]으로 시작하므로 부정관사 a 사용 (an 아님)", "topic": "관사", "memo": "boat는 자음 발음[b]으로 시작하므로 부정관사 a 사용 (an 아님)"}]}, {"n": 14, "tag": null, "en": "Unlike Manet, Monet liked painting landscapes and to paint gardens.", "ko": "마네와 달리, 모네는 풍경화와 정원을 그리는 것을 좋아했어요.", "ok": false, "foot": ["1landscapes 풍경화"], "fixes": [{"wrong": "liked painting landscapes and to paint gardens", "right": "liked to paint landscapes and gardens", "partial": false, "at": [3], "point": "병렬구조: to paint 뒤에 landscapes와 gardens를 병렬로 연결 (paint의 형태를 painting과 to paint로 섞어 쓰지 않음)", "topic": "병렬구조", "memo": "to paint 뒤에 landscapes와 gardens를 병렬로 연결 (paint의 형태를 painting과 to paint로 섞어 쓰지 않음)"}]}, {"n": 15, "tag": null, "en": "He enjoyed to watch nature in different seasons and times of day.", "ko": "그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요.", "ok": false, "foot": [], "fixes": [{"wrong": "to watch", "right": "watching", "partial": false, "at": [2], "point": "동명사 vs to부정사: enjoy는 동명사(watching)를 목적어로 취함 (to부정사 아님)", "topic": "동명사 vs to부정사", "memo": "enjoy는 동명사(watching)를 목적어로 취함 (to부정사 아님)"}]}, {"n": 16, "tag": null, "en": "He painted the same subjects much times.", "ko": "그는 같은 주제를 여러 번 그렸어요.", "ok": false, "foot": [], "fixes": [{"wrong": "subjects", "right": "subject", "partial": false, "at": [4], "point": "어휘/논리: 앞뒤 문맥상 하나의 동일한 주제(단수 subject)를 반복해서 그렸다는 의미", "topic": "어휘/논리", "memo": "앞뒤 문맥상 하나의 동일한 주제(단수 subject)를 반복해서 그렸다는 의미"}, {"wrong": "much", "right": "many", "partial": false, "at": [5], "point": "가산명사 수식: times(횟수)는 much가 아닌 many로 수식", "topic": "가산명사 수식", "memo": "times(횟수)는 much가 아닌 many로 수식"}]}, {"n": 17, "tag": null, "en": "He have created about 250 different paintings of water lilies for his series Water Lilies.", "ko": "그는 그의 연작인 ‘수련(Water Lilies)’을 위해 약 250점의 다양한 수련 그림을 그려왔습니다.", "ok": false, "foot": ["1series 연작"], "fixes": [{"wrong": "have", "right": "has", "partial": false, "at": [1], "point": "현재완료 수일치: 주어 He(3인칭 단수)에 맞춰 has + p.p. 사용 (have 아님)", "topic": "현재완료 수일치", "memo": "주어 He(3인칭 단수)에 맞춰 has + p.p. 사용 (have 아님)"}]}, {"n": 18, "tag": null, "en": "Manet and Monet also different in their use of color.", "ko": "마네와 모네는 또한 색 사용에서도 달라요.", "ok": false, "foot": [], "fixes": [{"wrong": "different", "right": "differ", "partial": false, "at": [4], "point": "품사: 문장의 동사 자리이므로 동사 differ 사용 (different는 형용사)", "topic": "품사", "memo": "문장의 동사 자리이므로 동사 differ 사용 (different는 형용사)"}]}, {"n": 19, "tag": null, "en": "Manet was a mastery in the use of black.", "ko": "마네는 검은색 사용의 대가였어요.", "ok": false, "foot": [], "fixes": [{"wrong": "mastery", "right": "master", "partial": false, "at": [3], "point": "어휘: '~에 능숙한 사람'은 명사 master 사용 (mastery는 '숙달, 통달'이라는 별개의 뜻)", "topic": "어휘", "memo": "'~에 능숙한 사람'은 명사 master 사용 (mastery는 '숙달, 통달'이라는 별개의 뜻)"}]}, {"n": 20, "tag": null, "en": "His painting Masked Ball at the Opera is the good example.", "ko": "그의 그림인 ‘오페라 하우스의 가면무도회(Masked Ball at the Opera)’가 좋은 예입니다.", "ok": false, "foot": [], "fixes": [{"wrong": "the", "right": "a", "partial": false, "at": [8], "point": "관사: 여러 예시 중 하나이므로 부정관사 a 사용 (the 아님)", "topic": "관사", "memo": "여러 예시 중 하나이므로 부정관사 a 사용 (the 아님)"}]}, {"n": 21, "tag": null, "en": "However, in Monet’s paintings, black was not use.", "ko": "그러나 모네의 그림에서는 검은색이 사용되지 않았어요.", "ok": false, "foot": [], "fixes": [{"wrong": "use", "right": "used", "partial": false, "at": [7], "point": "수동태: be동사(was) + 과거분사(used) 형태로 사용 (동사원형 use 아님)", "topic": "수동태", "memo": "be동사(was) + 과거분사(used) 형태로 사용 (동사원형 use 아님)"}]}, {"n": 22, "tag": null, "en": "Dark brown were used instead.", "ko": "대신에 짙은 갈색이 사용되었습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [2], "point": "수일치: 주어 Dark brown(단수 취급)에 맞춰 was 사용 (were 아님)", "topic": "수일치", "memo": "주어 Dark brown(단수 취급)에 맞춰 was 사용 (were 아님)"}]}, {"n": 23, "tag": null, "en": "Monet also used lot of light colors in his paintings.", "ko": "모네는 또한 그의 그림에서 연한 색을 많이 사용했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "lot of", "right": "a lot of", "partial": false, "at": [3], "point": "어휘: '많은'이라는 뜻의 표현은 a lot of (a 없이 lot of는 쓰지 않음)", "topic": "어휘", "memo": "'많은'이라는 뜻의 표현은 a lot of (a 없이 lot of는 쓰지 않음)"}]}, {"n": 24, "tag": null, "en": "You will see them if you look at paintings same as Waterloo Bridge, London, at Sunset or Waves Breaking.", "ko": "‘해 질 녘 런던 워털루 다리(Waterloo Bridge, London, at Sunset)’나 ‘부서지는 파도(Waves Breaking)’ 같은 그림을 보면 그것들을 보게 될 거예요.", "ok": false, "foot": [], "fixes": [{"wrong": "same as", "right": "such as", "partial": false, "at": [9], "point": "어휘: '~와 같은'의 뜻으로 예를 들 때는 such as 사용 (same as와 구별)", "topic": "어휘", "memo": "'~와 같은'의 뜻으로 예를 들 때는 such as 사용 (same as와 구별)"}]}, {"n": 25, "tag": null, "en": "The names Manet and Monet sound similar, but their painting styles are the most different.", "ko": "마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요.", "ok": false, "foot": [], "fixes": [{"wro h painters who had similar names: Manet and Monet.", "19세기 후반에 비슷한 이름을 가진 프랑스 화가 두 명이 있었어요. 마네와 모네입니다.", 0], ["One day, Manet heard people at an exhibit.", "어느 날, 마네는 전시회에서 사람들의 말을 들었어요.", 0], ["They were praising a painter.", "그들은 한 화가를 칭찬하고 있었어요.", 0], ["He thought they were talking about him.", "그는 그들이 자신에 대해서 말하고 있다고 생각했어요.", 0], ["He felt happy, but they were actually talking about Monet!", "그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요!", 0], ["This realization made Manet feel upset, and he shouted, “Who is this Monet whose name sounds just like mine?”", "이 사실을 깨닫자, 마네는 기분이 상해서 외쳤어요. \"꼭 내 이름처럼 들리는 이름을 가진 이 모네라는 사람은 누구야?\"", 0], ["Even today, their similar names still cause people to confuse Manet with Monet.", "오늘날까지도, 비슷한 이름 때문에 사람들은 여전히 마네와 모네를 혼동해요.", 0], ["So, what are the differences between them?", "그렇다면, 그들 사이의 차이점은 무엇일까요?", 0], ["First, the focus of their paintings is different.", "첫째, 그들의 그림의 초점이 달라요.", 0], ["Manet focused on people.", "마네는 사람들에게 초점을 맞추었어요.", 0], ["He painted people in everyday life.", "그는 일상 속 사람들을 그렸습니다.", 0], ["For example, in his painting Boating, Manet painted a man and a woman on a boat.", "예를 들어, 그의 그림인 ‘뱃놀이(Boating)’에서, 마네는 배에 탄 남자와 여자를 그렸어요.", 0], ["Unlike Manet, Monet liked to paint landscapes and gardens.", "마네와 달리, 모네는 풍경화와 정원을 그리는 것을 좋아했어요.", 0], ["He enjoyed watching nature in different seasons and times of day.", "그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요.", 0], ["He painted the same subject many times.", "그는 같은 주제를 여러 번 그렸어요.", 0], ["He has created about 250 different paintings of water lilies for his series Water Lilies.", "그는 그의 연작인 ‘수련(Water Lilies)’을 위해 약 250점의 다양한 수련 그림을 그려왔습니다.", 0], ["Manet and Monet also differ in their use of color.", "마네와 모네는 또한 색 사용에서도 달라요.", 0], ["Manet was a master in the use of black.", "마네는 검은색 사용의 대가였어요.", 0], ["His painting Masked Ball at the Opera is a good example.", "그의 그림인 ‘오페라 하우스의 가면무도회(Masked Ball at the Opera)’가 좋은 예입니다.", 0], ["However, in Monet’s paintings, black was not used.", "그러나 모네의 그림에서는 검은색이 사용되지 않았어요.", 0], ["Dark brown was used instead.", "대신에 짙은 갈색이 사용되었습니다.", 0], ["Monet also used a lot of light colors in his paintings.", "모네는 또한 그의 그림에서 연한 색을 많이 사용했어요.", 0], ["You will see them if you look at paintings such as Waterloo Bridge, London, at Sunset or Waves Breaking.", "‘해 질 녘 런던 워털루 다리(Waterloo Bridge, London, at Sunset)’나 ‘부서지는 파도(Waves Breaking)’ 같은 그림을 보면 그것들을 보게 될 거예요.", 0], ["The names Manet and Monet sound similar, but their painting styles are very different.", "마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요.", 0], ["Do you see dark colors and people in the painting? It's probably Manet.", "그림에서 어두운 색상과 사람들이 보이나요? 아마도 마네일 거예요.", 0], ["Do you see light colors and gardens? It’s probably Monet.", "연한 색과 정원이 보이나요? 아마도 모네일 거예요.", 0], ["If you remember these questions, you will have an easy way to tell them apart.", "이러한 질문들을 기억하면, 여러분은 그들을 쉽게 구별할 수 있는 방법을 갖게 될 거예요.", 0]];var RNUM=26;var TITLE_EN="Manet and Monet";var PASS_EN=["Manet and Monet", "Do you ever mix up people with similar names? In the late 19th century, there were two French painters who had similar names: Manet and Monet. One day, Manet heard people at an exhibit. They were praising a painter. He thought they were talking about him. He felt happy, but they were actually talking about Monet! This realization made Manet feel upset, and he shouted, “Who is this Monet whose name sounds just like mine?” Even today, their similar names still cause people to confuse Manet with Monet. So, what are the differences between them? First, the focus of their paintings is different. Manet focused on people. He painted people in everyday life. For example, in his painting Boating, Manet painted a man and a woman on a boat. Unlike Manet, Monet liked to paint landscapes and gardens. He enjoyed watching nature in different seasons and times of day. He painted the same subject many times. He has created about 250 different paintings of water lilies for his series Water Lilies. Manet and Monet also differ in their use of color. Manet was a master in the use of black. His painting Masked Ball at the Opera is a good example. However, in Monet’s paintings, black was not used. Dark brown was used instead. Monet also used a lot of light colors in his paintings. You will see them if you look at paintings such as Waterloo Bridge, London, at Sunset or Waves Breaking. The names Manet and Monet sound similar, but their painting styles are very different. Do you see dark colors and people in the painting? It's probably Manet. Do you see light colors and gardens? It’s probably Monet. If you remember these questions, you will have an easy way to tell them apart."];var PASS_KO=["마네와 모네", "여러분은 비슷한 이름을 가진 사람들을 혼동하곤 하나요? 19세기 후반에 비슷한 이름을 가진 프랑스 화가 두 명이 있었어요. 마네와 모네입니다. 어느 날, 마네는 전시회에서 사람들의 말을 들었어요. 그들은 한 화가를 칭찬하고 있었어요. 그는 그들이 자신에 대해서 말하고 있다고 생각했어요. 그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요! 이 사실을 깨닫자, 마네는 기분이 상해서 외쳤어요. \"꼭 내 이름처럼 들리는 이름을 가진 이 모네라는 사람은 누구야?\" 오늘날까지도, 비슷한 이름 때문에 사람들은 여전히 마네와 모네를 혼동해요. 그렇다면, 그들 사이의 차이점은 무엇일까요? 첫째, 그들의 그림의 초점이 달라요. 마네는 사람들에게 초점을 맞추었어요. 그는 일상 속 사람들을 그렸습니다. 예를 들어, 그의 그림인 ‘뱃놀이(Boating)’에서, 마네는 배에 탄 남자와 여자를 그렸어요. 마네와 달리, 모네는 풍경화와 정원을 그리는 것을 좋아했어요. 그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요. 그는 같은 주제를 여러 번 그렸어요. 그는 그의 연작인 ‘수련(Water Lilies)’을 위해 약 250점의 다양한 수련 그림을 그려왔습니다. 마네와 모네는 또한 색 사용에서도 달라요. 마네는 검은색 사용의 대가였어요. 그의 그림인 ‘오페라 하우스의 가면무도회(Masked Ball at the Opera)’가 좋은 예입니다. 그러나 모네의 그림에서는 검은색이 사용되지 않았어요. 대신에 짙은 갈색이 사용되었습니다. 모네는 또한 그의 그림에서 연한 색을 많이 사용했어요. ‘해 질 녘 런던 워털루 다리(Waterloo Bridge, London, at Sunset)’나 ‘부서지는 파도(Waves Breaking)’ 같은 그림을 보면 그것들을 보게 될 거예요. 마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요. 그림에서 어두운 색상과 사람들이 보이나요? 아마도 마네일 거예요. 연한 색과 정원이 보이나요? 아마도 모네일 거예요. 이러한 질문들을 기억하면, 여러분은 그들을 쉽게 구별할 수 있는 방법을 갖게 될 거예요."];var DG=[{"dlg": [["G", "Henry, do you have any plans for this Sunday?", "Henry, 이번 일요일에 무슨 계획 있어?"], ["B", "Oh, you mean July 9. Nothing special.", "아, 7월 9일 말하는 거지. 특별한 건 없어."], ["G", "Do you want to go to The New Kids’ concert with me? It’s a must-see.", "나랑 The N
