.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "Dr. Jang", "en": "Hello, everyone! I’m Dr. Jang. I’m so happy to have about 400 teenager hear for my live stream.", "ko": "안녕하세요, 여러분! 저는 장 박사입니다. 여기 제 라이브 방송에 약 400명의 십대들이 함께해 주셔서 정말 기쁩니다.", "ok": false, "foot": [], "fixes": [{"wrong": "teenager", "right": "teenagers", "partial": false, "at": [12], "point": "어법: 수사(400) 뒤에는 복수명사 teenagers 사용", "topic": "어법", "memo": "수사(400) 뒤에는 복수명사 teenagers 사용"}, {"wrong": "hear", "right": "here", "partial": false, "at": [13], "point": "어휘: 장소를 나타내는 부사 here 사용(hear는 ‘듣다’라는 동사)", "topic": "어휘", "memo": "장소를 나타내는 부사 here 사용(hear는 ‘듣다’라는 동사)"}]}, {"n": 2, "tag": null, "en": "Today, we will talk with sleep. Ready? Let’s go!", "ko": "오늘 우리는 수면에 대해 이야기할 거예요. 준비됐나요? 시작합시다!", "ok": false, "foot": [], "fixes": [{"wrong": "with", "right": "about", "partial": false, "at": [4], "point": "어휘/전치사: 주제를 언급할 때는 talk about 사용(with는 ‘~와 함께’라는 뜻이므로 문맥상 부적절)", "topic": "어휘/전치사", "memo": "주제를 언급할 때는 talk about 사용(with는 ‘~와 함께’라는 뜻이므로 문맥상 부적절)"}]}, {"n": 3, "tag": null, "en": "Sleep is such important that you can’t live without it.", "ko": "수면은 매우 중요해서 잠을 자지 않고는 살 수가 없습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "such", "right": "so", "partial": false, "at": [2], "point": "어법: 형용사를 바로 수식할 때는 so, 뒤에 명사가 있을 때는 such 사용(so + 형용사 + that ~)", "topic": "어법", "memo": "형용사를 바로 수식할 때는 so, 뒤에 명사가 있을 때는 such 사용(so + 형용사 + that ~)"}]}, {"n": 4, "tag": null, "en": "When you sleep, your body repairs your cells and muscles.", "ko": "잠을 잘 때, 여러분의 몸은 여러분의 세포와 근육을 회복시킵니다.", "ok": true, "foot": ["1cell 세포", "2muscle 근육"], "fixes": []}, {"n": 5, "tag": null, "en": "So, if you doesn’t get enough sleep, you can get sick.", "ko": "그래서 만약 여러분이 충분한 수면을 취하지 않는다면, 아플 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "doesn’t", "right": "don’t", "partial": false, "at": [3], "point": "어법: 접속사 if가 이끄는 조건절의 주어 you에는 don’t 사용", "topic": "어법", "memo": "접속사 if가 이끄는 조건절의 주어 you에는 don’t 사용"}]}, {"n": 6, "tag": null, "en": "Sleep is important for your physically health.", "ko": "수면은 신체 건강에 중요합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "physically", "right": "physical", "partial": false, "at": [5], "point": "어휘/어법: 명사 health를 수식하는 형용사 physical 사용(부사 physically 아님)", "topic": "어휘/어법", "memo": "명사 health를 수식하는 형용사 physical 사용(부사 physically 아님)"}]}, {"n": 7, "tag": null, "en": "And it is also important for your memories.", "ko": "또한 수면은 여러분의 기억력에도 중요합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "memories", "right": "memory", "partial": false, "at": [7], "point": "어휘: ‘기억력’이라는 의미의 memory는 이 문맥에서 셀 수 없는 명사로 단수형 사용", "topic": "어휘", "memo": "‘기억력’이라는 의미의 memory는 이 문맥에서 셀 수 없는 명사로 단수형 사용"}]}, {"n": 8, "tag": null, "en": "While you sleep, your brain clears memories that is not needed.", "ko": "잠을 자는 동안, 여러분의 뇌는 필요 없는 기억들을 정리합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [8], "point": "주격 관계대명사: 선행사 memories(복수)에 맞춰 관계대명사절의 동사 are 사용", "topic": "주격 관계대명사", "memo": "선행사 memories(복수)에 맞춰 관계대명사절의 동사 are 사용"}]}, {"n": 9, "tag": null, "en": "This makes space for new memories.", "ko": "이것이 새로운 기억들을 위한 공간을 만듭니다.", "ok": true, "foot": [], "fixes": []}, {"n": 10, "tag": null, "en": "Imagine to keep every detail of your experiences in your memory.", "ko": "여러분의 경험의 모든 세부사항을 기억한다고 상상해 보세요.", "ok": false, "foot": ["1detail 세부사항"], "fixes": [{"wrong": "to keep", "right": "keeping", "partial": false, "at": [1], "point": "동명사: imagine은 동명사를 목적어로 취함(imagine + v-ing)", "topic": "동명사", "memo": "imagine은 동명사를 목적어로 취함(imagine + v-ing)"}]}, {"n": 11, "tag": null, "en": "It would be like a room with necessary items everywhere.", "ko": "그것은 마치 불필요한 물건들이 가득한 방과 같을 겁니다.", "ok": false, "foot": [], "fixes": [{"wrong": "necessary", "right": "unnecessary", "partial": false, "at": [7], "point": "어휘: 문맥상 ‘불필요한’이라는 의미의 unnecessary 사용(necessary는 반대 의미)", "topic": "어휘", "memo": "문맥상 ‘불필요한’이라는 의미의 unnecessary 사용(necessary는 반대 의미)"}]}, {"n": 12, "tag": "sweetdream", "en": "During sleep, the brain work like a cleaner.", "ko": "잠자는 동안, 뇌는 청소부처럼 작동해요.", "ok": false, "foot": [], "fixes": [{"wrong": "work", "right": "works", "partial": false, "at": [4], "point": "수일치: 주어 the brain(3인칭 단수)에 맞춰 동사 works 사용", "topic": "수일치", "memo": "주어 the brain(3인칭 단수)에 맞춰 동사 works 사용"}]}, {"n": 13, "tag": "Dr. Jang", "en": "Sweetdream make a good point. Yes, unnecessary memories is cleaned up by your brain while you sleep.", "ko": "Sweetdream이 좋은 말을 했습니다. 맞습니다, 잠을 자는 동안 뇌는 불필요한 기억들을 정리합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "make", "right": "made", "partial": false, "at": [1], "point": "시제: 과거 상황을 설명하므로 과거형 made 사용", "topic": "시제", "memo": "과거 상황을 설명하므로 과거형 made 사용"}, {"wrong": "is cleaned up", "right": "are cleaned up", "partial": false, "at": [8], "point": "수동태·수일치: 주어 memories(복수)에 맞춰 be동사 are + p.p. 사용", "topic": "수동태·수일치", "memo": "주어 memories(복수)에 맞춰 be동사 are + p.p. 사용"}]}, {"n": 14, "tag": null, "en": "Now, let’s looking at some questions. Here’s an interesting one.", "ko": "이제 몇 가지 질문을 살펴봅시다. 여기 흥미로운 질문이 하나 있네요.", "ok": false, "foot": [], "fixes": [{"wrong": "looking", "right": "look", "partial": false, "at": [2], "point": "어법: Let's 뒤에는 동사원형 look 사용", "topic": "어법", "memo": "Let's 뒤에는 동사원형 look 사용"}]}, {"n": 15, "tag": "sleepy", "en": "I have so many homework on weekdays that I can’t sleeping enough.", "ko": "저는 평일에는 숙제가 너무 많아서 충분히 잘 수가 없어요.", "ok": false, "foot": [], "fixes": [{"wrong": "many", "right": "much", "partial": false, "at": [3], "point": "어휘/어법: homework는 셀 수 없는 명사이므로 many가 아닌 much 사용", "topic": "어휘/어법", "memo": "homework는 셀 수 없는 명사이므로 many가 아닌 much 사용"}, {"wrong": "sleeping", "right": "sleep", "partial": false, "at": [10], "point": "조동사 can 뒤에는 동사원형 sleep 사용", "topic": "어법", "memo": "조동사 can 뒤에는 동사원형 sleep 사용"}]}, {"n": 16, "tag": null, "en": "So, I sleep most on weekends. Is this okay?", "ko": "그래서 주말에는 더 많이 잡니다. 이래도 괜찮은가요?", "ok": false, "foot": [], "fixes": [{"wrong": "most", "right": "more", "partial": false, "at": [3], "point": "비교급: 평일과 주말, 두 가지를 비교하는 문맥이므로 비교급 more 사용(최상급 most는 셋 이상을 비교할 때 사용)", "topic": "비교급", "memo": "평일과 주말, 두 가지를 비교하는 문맥이므로 비교급 more 사용(최상급 most는 셋 이상을 비교할 때 사용)"}]}, {"n": 17, "tag": "Dr. Jang", "en": "Try to sleep a lot for weekends may help.", "ko": "주말 동안 많이 자려고 노력하는 것은 도움이 될 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "Try", "right": "Trying", "partial": false, "at": [0], "point": "동명사: 문장의 주어 자리이므로 동명사 Trying 사용", "topic": "동명사", "memo": "문장의 주어 자리이므로 동명사 Trying 사용"}, {"wrong": "for", "right": "during", "partial": false, "at": [5], "point": "어휘/전치사: 특정 기간을 나타낼 때는 during weekends 사용(for는 기간의 길이를 나타낼 때 사용)", "topic": "어휘/전치사", "memo": "특정 기간을 나타낼 때는 during weekends 사용(for는 기간의 길이를 나타낼 때 사용)"}]}, {"n": 18, "tag": null, "en": "But you should try to keep a regularly sleep schedule.", "ko": "하지만 규칙적인 수면 습관을 유지하려고 노력해야 합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "regularly", "right": "regular", "partial": false, "at": [7], "point": "어휘/어법: 명사 schedule을 수식하는 형용사 regular 사용(부사 regularly 아님)", "topic": "어휘/어법", "memo": "명사 schedule을 수식하는 형용사 regular 사용(부사 regularly 아님)"}]}, {"n": 19, "tag": null, "en": "Changing sleep patterns too much may lead to healthy problems.", "ko": "수면 패턴을 너무 자주 바꾸는 것은 건강 문제로 이어질 수 있습니다.", "ok": false, "foot": ["1pattern 패턴, 양상"], "fixes": [{"wrong": "too much", "right": "too often", "partial": false, "at": [3], "point": "어휘: 빈도를 나타낼 때는 too often 사용(too much는 양을 나타냄)", "topic": "어휘", "memo": "빈도를 나타낼 때는 too often 사용(too much는 양을 나타냄)"}, {"wrong": "healthy", "right": "health", "partial": false, "at": [8], "point": "어휘: health problems(건강 문제)는 명사 health가 명사를 수식하는 형태이며 형용사 healthy는 부적절", "topic": "어휘", "memo": "health problems(건강 문제)는 명사 health가 명사를 수식하는 형태이며 형용사 healthy는 부적절"}]}];var PP=[["Hello, everyone! I’m Dr. Jang. I’m so happy to have about 400 teenagers here for my live stream.", "안녕하세요, 여러분! 저는 장 박사입니다. 여기 제 라이브 방송에 약 400명의 십대들이 함께해 주셔서 정말 기쁩니다.", 0], ["Today, we will talk about sleep. Ready? Let’s go!", "오늘 우리는 수면에 대해 이야기할 거예요. 준비됐나요? 시작합시다!", 0], ["Sleep is so important that you can’t live without it.", "수면은 매우 중요해서 잠을 자지 않고는 살 수가 없습니다.", 0], ["When you sleep, your body repairs your cells and muscles.", "잠을 잘 때, 여러분의 몸은 여러분의 세포와 근육을 회복시킵니다.", 0], ["So, if you don’t get enough sleep, you can get sick.", "그래서 만약 여러분이 충분한 수면을 취하지 않는다면, 아플 수 있습니다.", 0], ["Sleep is important for your physical health.", "수면은 신체 건강에 중요합니다.", 0], ["And it is also important for your memory.", "또한 수면은 여러분의 기억력에도 중요합니다.", 0], ["While you sleep, your brain clears memories that are not needed.", "잠을 자는 동안, 여러분의 뇌는 필요 없는 기억들을 정리합니다.", 0], ["This makes space for new memories.", "이것이 새로운 기억들을 위한 공간을 만듭니다.", 0], ["Imagine keeping every detail of your experiences in your memory.", "여러분의 경험의 모든 세부사항을 기억한다고 상상해 보세요.", 0], ["It would be like a room with unnecessary items everywhere.", "그것은 마치 불필요한 물건들이 가득한 방과 같을 겁니다.", 0], ["During sleep, the brain works like a cleaner.", "잠자는 동안, 뇌는 청소부처럼 작동해요.", 0], ["Sweetdream made a good point. Yes, unnecessary memories are cleaned up by your brain while you sleep.", "Sweetdream이 좋은 말을 했습니다. 맞습니다, 잠을 자는 동안 뇌는 불필요한 기억들을 정리합니다.", 0], ["Now, let’s look at some questions. Here’s an interesting one.", "이제 몇 가지 질문을 살펴봅시다. 여기 흥미로운 질문이 하나 있네요.", 0], ["I have so much homework on weekdays that I can’t sleep enough.", "저는 평일에는 숙제가 너무 많아서 충분히 잘 수가 없어요.", 0], ["So, I sleep more on weekends. Is this okay?", "그래서 주말에는 더 많이 잡니다. 이래도 괜찮은가요?", 0], ["Trying to sleep a lot during weekends may help.", "주말 동안 많이 자려고 노력하는 것은 도움이 될 수 있습니다.", 0], ["But you should try to keep a regular sleep schedule.", "하지만 규칙적인 수면 습관을 유지하려고 노력해야 합니다.", 0], ["Changing sleep patterns too often may lead to health problems.", "수면 패턴을 너무 자주 바꾸는 것은 건강 문제로 이어질 수 있습니다.", 0]];var RNUM=31;var TITLE_EN="Sleep Matters for Teenagers";var PASS_EN=["Sleep Matters for Teenagers", "Hello, everyone! I’m Dr. Jang. I’m so happy to have about 400 teenagers here for my live stream. Today, we will talk about sleep. Ready? Let’s go! Sleep is so important th  }

function sHtml(q,lock){

function oxSummary(p){

 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});

  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){

 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;

  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
