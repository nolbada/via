<style>

.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Last summer, I visit my uncle in Alaska. Can you guess the time in the picture?","ko":"지난 여름, 나는 알래스카에 계신 삼촌을 방문했어. 사진 속 시간을 추측할 수 있겠니?","ok":false,"foot":[],"fixes":[{"wrong":"visit","right":"visited","partial":false,"at":[3],"point":"동사의 과거형: Last summer(과거)이므로 visited (visit 아님)","topic":"동사의 과거형","memo":"Last summer(과거)이므로 visited (visit 아님)"}]},{"n":2,"tag":null,"en":"It was actual 9 p.m. My uncle said, \"The sun don't set from May to July. So Alaska is 'The Land of the Midnight Sun.'\"","ko":"사실은 오후 9시였어. 나의 삼촌은 말씀하셨어. \"태양이 5월부터 7월까지 지지 않는단다. 그래서 알래스카는 '한밤중의 태양의 땅'이라고 하지.\"","ok":false,"foot":[],"fixes":[{"wrong":"actual","right":"actually","partial":false,"at":[2],"point":"형용사와 부사: 동사 was를 꾸미는 부사 actually 사용","topic":"형용사와 부사","memo":"동사 was를 꾸미는 부사 actually 사용"},{"wrong":"don't","right":"doesn't","partial":false,"at":[10],"point":"do 부정문: 주어 The sun(3인칭 단수)에는 doesn't 사용","topic":"do 부정문","memo":"주어 The sun(3인칭 단수)에는 doesn't 사용"}]},{"n":3,"tag":null,"en":"One day, my uncle took I and my cousin, Jimmy, to the Alaska State Fair. Jimmy signed up for the wood cutting game.","ko":"어느 날, 삼촌이 나와 나의 사촌, Jimmy를 알래스카주 축제에 데려가셨어. Jimmy는 나무 자르기 게임을 신청했어.","ok":false,"foot":[],"fixes":[{"wrong":"I","right":"me","partial":false,"at":[5],"point":"인칭대명사의 목적격: 동사 뒤 목적어는 목적격 me 사용","topic":"인칭대명사의 목적격","memo":"동사 뒤 목적어는 목적격 me 사용"}]},{"n":4,"tag":null,"en":"People started cut the wood fast. I cheered for him, but he didn't got the prize.","ko":"사람들은 나무를 빠르게 자르기 시작했어. 나는 Jimmy를 응원했지만, 그는 상을 타진 못 했어.","ok":false,"foot":[],"fixes":[{"wrong":"cut","right":"cutting","partial":false,"at":[2],"point":"동명사: start 뒤 목적어는 -ing 또는 to부정사: cutting","topic":"동명사","memo":"start 뒤 목적어는 -ing 또는 to부정사: cutting"},{"wrong":"got","right":"get","partial":false,"at":[13],"point":"do 부정문: didn't 뒤에는 동사원형 get 사용","topic":"do 부정문","memo":"didn't 뒤에는 동사원형 get 사용"}]},{"n":5,"tag":null,"en":"\"It was hard. The wood was wet,\" Jimmy said.","ko":"\"그건 어려웠어. 나무가 젖어 있었거든.\" Jim ":"hour","right":"hours","partial":false,"at":[5],"point":"명사의 복수형: 20 뒤에는 복수명사 hours 사용","topic":"명사의 복수형","memo":"20 뒤에는 복수명사 hours 사용"},{"wrong":"more sweeter","right":"sweeter","partial":false,"at":[17],"point":"비교급: sweet의 비교급은 sweeter (more와 중복 불가)","topic":"비교급","memo":"sweet의 비교급은 sweeter (more와 중복 불가)"}]},{"n":12,"tag":null,"en":"When we left the fair in 10 p.m., it was not so dark. It was an fun day.","ko":"우리가 밤 10시에 축제를 떠났을 때, 그렇게 어둡지 않았어. 재밌는 하루였어.","ok":false,"foot":[],"fixes":[{"wrong":"in","right":"at","partial":false,"at":[5],"point":"기본전치사: '~시에'는 전치사 at 사용","topic":"기본전치사","memo":"'~시에'는 전치사 at 사용"},{"wrong":"an","right":"a","partial":false,"at":[15],"point":"관사 a/an: fun은 자음 소리라 a fun day 사용","topic":"관사 a/an","memo":"fun은 자음 소리라 a fun day 사용"}]}];var PP=[["Last summer, I visited my uncle in Alaska.","지난 여름, 나는 알래스카에 계신 삼촌을 방문했어.",1],["Can you guess the time in the picture?","사진 속 시간을 추측할 수 있겠니?",0],["It was actually 9 p.m. My uncle said, \"The sun doesn't set from May to July.","사실은 오후 9시였어. 나의 삼촌은 말씀하셨어. \"태양이 5월부터 7월까지 지지 않는단다.",0],["So Alaska is 'The Land of the Midnight Sun.'\"","그래서 알래스카는 '한밤중의 태양의 땅'이라고 하지.\"",0],["One day, my uncle took me and my cousin, Jimmy, to the Alaska State Fair.","어느 날, 삼촌이 나와 나의 사촌, Jimmy를 알래스카주 축제에 데려가셨어.",1],["Jimmy signed up for the wood cutting game.","Jimmy는 나무 자르기 게임을 신청했어.",0],["People started cutting the wood fast.","사람들은 나무를 빠르게 자르기 시작했어.",0],["I cheered for him, but he didn't get the prize.","나는 Jimmy를 응원했지만, 그는 상을 타진 못 했어.",0],["\"It was hard.","\"그건 어려웠어.",0],["The wood was wet,\" Jimmy said.","나무가 젖어 있었거든.\" Jimmy가 말했어.",0],["We got hungry, so we went to the food court.","우리는 배가 고파져서 푸드 코트에 갔어.",1],["We had salmon sandwiches.","우리는 연어 샌드위치를 먹었지.",0],["They were very new to me.","연어 샌드위치는 나에게 매우 새로웠어.",0],["At home, I usually put ham and cheese in sandwiches, not salmon.","나는 집에서 주로 연어가 아닌, 햄과 치즈를 샌드위치에 넣어.",0],["They were tasty because the salmon was so fresh.","연어가 매우 신선했기 때문에 연어 샌드위치는 맛있었어.",0],["W  어려웠어. 나무가 젖어 있었거든.\" Jimmy가 말했어.","우리는 배가 고파져서 푸드 코트에 갔어. 우리는 연어 샌드위치를 먹었지. 연어 샌드위치는 나에게 매우 새로웠어. 나는 집에서 주로 연어가 아닌, 햄과 치즈를 샌드위치에 넣어. 연어가 매우 신선했기 때문에 연어 샌드위치는 맛있었어.","우리는 그러고 나서 거대 채소 대회에 갔어. 모든 채소들은 거대했어! 나의 삼촌은 그의 호박을 가지고 대회에 참가했어. 그것은 돼지보다 더 컸어! \"농작물들은 여름 동안 하루에 약 20시간의 햇빛을 받지. 그래서 농작물들이 더 크고 더 달게 자라는 거야.\"라고 삼촌이 말했어.","우리가 밤 10시에 축제를 떠났을 때, 그렇게 어둡지 않았어. 재밌는 하루였어."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["The man is looking for a flower store.","The ice cream store is next to the flower store.","The woman is going to buy ice cream.","The man should turn left to get to the store.","The woman does not know where the store is."],"a":1,"ans":"The ice cream store is next to the flower store.","evs":[["W: Turn right and go straight. It's next to the flower store.","오른쪽으로 돌아서 쭉 가세요. 꽃집 옆에 있어요."],["M: Where is the ice cream store?","아이스크림 가게가 어디에 있나요?"]],"ev":["W: Turn right and go straight. It's next to the flower store.","오른쪽으로 돌아서 쭉 가세요. 꽃집 옆에 있어요."],"ow":["오답 ✕ — 남자는 'Where is the ice cream store?'(아이스크림 가게가 어디에 있나요?)라고 물었다. 꽃집이 아니라 아이스크림 가게를 찾고 있으므로 틀림.","정답 ○ — 여자가 'It's next to the flower store.'(꽃집 옆에 있어요.)라고 했으므로 아이스크림 가게가 꽃집 옆에 있다는 보기가 일치한다.","오답 ✕ — 여자는 길을 알려 주는 사람이다. 'Turn right and go straight.'(오른쪽으로 돌아서 쭉 가세요.)라고 했을 뿐 아이스크림을 산다는 말은 없다.","오답 ✕ — 여자는 'Turn right and go straight.'(오른쪽으로 돌아서 쭉 가세요.)라고 했는데 이 보기는 왼쪽(left)이라고 해서 틀림.","오답 ✕ — 여자는 'Turn right and go straight. It's next to the flower store.'(오른쪽으로 돌아서 쭉 가세요. 꽃집 옆에 있어요.)라고 자세히 알려 줬으므로 위치를 안다. 그래서 틀림."],"memo":["정답 ②: 아이스크림 가게는 꽃집 옆에 있다.","근거: It's next to the flower store.(꽃집 옆에 있어요.)","함정: ④는 왼쪽이 아니라 오른쪽(right)으로 돌라고 해서 ✕"],"why":"아이스크림 가게는 오른쪽으로 돌아 쭉 가면 나오는 꽃집 옆에 있다."}],"dlg":[["M","Where is the ice cream store?","아이스크림 가게가 어디에 있나요?"],["W","Turn right and go straight. It's next to the flower store.","오른쪽으로 돌아서 쭉 가세요. 꽃집 옆에 있어요."],["M","Thanks.","고맙습니다."],["W","No problem.","별말씀을요."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하는 것은?","o":["Lucy is going to watch movies with her friends.","The ma
