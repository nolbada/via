 위해 회갈색으로 변한다.", "ok": false, "foot": [], "fixes": [{"wrong": "for", "right": "to", "partial": false, "at": [5], "point": "숙어 표현: \"~에 따라\"는 according to 사용", "topic": "숙어 표현", "memo": "\"~에 따라\"는 according to 사용"}]}, {"n": 6, "tag": null, "en": "In winter, they turn white to camouflage themself in the snow.", "ko": "겨울에, 그들은 자신들을 눈 속에 위장하기 위해 흰색으로 변한다.", "ok": false, "foot": [], "fixes": [{"wrong": "themself", "right": "themselves", "partial": false, "at": [7], "point": "재귀대명사: 주어 they의 재귀대명사는 themselves 사용", "topic": "재귀대명사", "memo": "주어 they의 재귀대명사는 themselves 사용"}]}, {"n": 7, "tag": null, "en": "Changing colors makes them nearly invisibly to predators like wild dogs and eagles.", "ko": "색을 바꾸는 것은 그들을 들개와 독수리 같은 포식 동물들에게 거의 보이지 않게 만든다.", "ok": false, "foot": [], "fixes": [{"wrong": "invisibly", "right": "invisible", "partial": false, "at": [5], "point": "형용사와 부사: makes them 뒤 보어 자리에는 형용사 invisible 사용", "topic": "형용사와 부사", "memo": "makes them 뒤 보어 자리에는 형용사 invisible 사용"}]}, {"n": 8, "tag": null, "en": "Did you know?", "ko": "알고 있었나요?", "ok": true, "foot": [], "fixes": []}, {"n": 9, "tag": null, "en": "Mountain hares have really big foots. Thanks to them, mountain hares can hop in deeply snow and escape from predators.", "ko": "고산토끼는 정말 큰 발을 가지고 있다. 그것들 덕분에, 고산토끼는 깊은 눈 속에서 깡충깡충 뛰어 포식 동물로부터 도망칠 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "foots", "right": "feet", "partial": false, "at": [5], "point": "불규칙 복수형: foot의 복수형은 feet", "topic": "불규칙 복수형", "memo": "foot의 복수형은 feet"}, {"wrong": "deeply", "right": "deep", "partial": false, "at": [14], "point": "형용사와 부사: 명사 snow를 꾸미는 형용사 deep 사용", "topic": "형용사와 부사", "memo": "명사 snow를 꾸미는 형용사 deep 사용"}]}, {"n": 10, "tag": "문어", "en": "Look closely at a rock under the sea. If it move, it might be an octopus.", "ko": "바닷속 바위를 자세히 보아라. 만약 그것이 움직인다면, 그것은 문어일지도 모른다.", "ok": false, "foot": [], "fixes": [{"wrong": "move", "right": "moves", "partial": false, "at": [10], "point": "3인칭 단수 현재형: 주어 it(3인칭 단수)는 동사에 -s: moves (move plete", "right": "completely", "partial": false, "at": [4], "point": "형용사와 부사: 동사 fool을 꾸미는 부사 completely 사용", "topic": "형용사와 부사", "memo": "동사 fool을 꾸미는 부사 completely 사용"}]}, {"n": 16, "tag": null, "en": "Did you know?", "ko": "알고 있었나요?", "ok": true, "foot": [], "fixes": []}, {"n": 17, "tag": null, "en": "Octopuses can spread ink. It creates a dark cloud who blocks the view of predators.", "ko": "문어는 먹물을 퍼뜨릴 수 있다. 그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다.", "ok": false, "foot": [], "fixes": [{"wrong": "who", "right": "that", "partial": false, "at": [9], "point": "관계대명사: 사물(cloud)이 선행사이면 that/which 사용", "topic": "관계대명사", "memo": "사물(cloud)이 선행사이면 that/which 사용"}]}, {"n": 18, "tag": null, "en": "This gives them enough time to escape.", "ko": "이는 그들에게 도망칠 충분한 시간을 준다.", "ok": true, "foot": [], "fixes": []}];var PP=[["Are you good at hide and seek?", "당신은 숨바꼭질을 잘하는가?", 1], ["Some animals which live in the wild are very good at camouflage.", "야생에서 사는 몇몇 동물들은 위장을 매우 잘한다.", 0], ["You can see them in the air, on land, and in the sea.", "당신은 그들을 하늘에서, 땅에서, 그리고 바다에서 볼 수 있다.", 0], ["Their special looks or abilities keep them safe from predators.", "그들의 특별한 생김새나 능력은 그들을 포식 동물로부터 안전하게 지킨다.", 0], ["Let me guide you through the world of animal camouflage.", "내가 당신을 동물 위장의 세계로 안내하겠다.", 0], ["Mountain Hare", "고산토끼", 1], ["Mountain hares are like rabbits, but they are bigger and have longer legs.", "고산토끼는 토끼와 비슷하지만, 그들은 (몸이) 더 크고 더 긴 다리를 가지고 있다.", 1], ["They are very stylish animals.", "그들은 매우 멋진 동물이다.", 0], ["Mountain hares change colors according to season.", "고산토끼는 계절에 따라 색을 바꾼다.", 0], ["In summer, they turn gray-brown to match the rocks and grass.", "여름에, 그들은 바위와 풀에 맞추기 위해 회갈색으로 변한다.", 0], ["In winter, they turn white to camouflage themselves in the snow.", "겨울에, 그들은 자신들을 눈 속에 위장하기 위해 흰색으로 변한다.", 0], ["Changing colors makes them nearly invisible to predators like wild dogs and eagles.", "색을 바꾸는 것은 그들을 들개와 독수리 같은 포식 동물들에게 거의 보이지 않게 만든다.", 0], ["Did you know?", "알고 있었나요?", 1], ["Mountain hares have really big feet.", "고산토끼는 정말 큰 발을 가지고 있다.", 1], ["Thanks to them, mountain hares can hop in deep snow and escape from predators.", "그것들 덕분에, 고산토끼는 깊은 눈 속에서 깡충깡충 뛰어 포식 동물로부터 도망칠 수 있다.", 0], ["Octopus", "문어", 1], ["Look closely at a rock under the sea.", "바닷속 바위를 자세히 보아라.", 1], ["If it moves, it might be an octopus.", "만약 그것이 움직인다면, 그것은 문어일지도 모른다.", 0], ["Octopuses are sea animals with rounded bodies and eight long arms.", "문어는 둥근 몸과 여덟 개의 긴 팔을 가진 해양 동물이다.", 0], ["When octopuses feel danger, they use their special camouflage skill.", "문어는 위험을 느낄 때, 그들의 특별한 위장 기술을 사용한다.", 0], ["Octopuses can change colors and patterns to match their surroundings.", "문어는 그들의 주변 환경에 맞추기 위해 색과 무늬를 바꿀 수 있다.", 0], ["If they're near sea plants, they look like sea plants.", "만약 그들이 해초 가까이에 있으면, 그들은 해초처럼 보인다.", 0], ["If they're near coral reefs, they look like coral reefs.", "만약 그들이 산호초 가까이에 있으면, 그들은 산호초처럼 보인다.", 0], ["They can also stick shells on their bodies to look like a rock.", "그들은 또한 바위처럼 보이기 위해 조개껍데기를 그들의 몸에 붙일 수 있다.", 0], ["This can fool predators completely.", "이는 포식 동물을 완전히 속일 수 있다.", 0], ["Did you know?", "알고 있었나요?", 1], ["Octopuses can spread ink.", "문어는 먹물을 퍼뜨릴 수 있다.", 1], ["It creates a dark cloud that blocks the view of predators.", "그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다.", 0], ["This gives them enough time to escape.", "이는 그들에게 도망칠 충분한 시간을 준다.", 0]];var RNUM=25;var TITLE_EN="Can You Spot Them?";var PASS_EN=["Can You Spot Them?", "Are you good at hide and seek? Some animals which live in the wild are very good at camouflage. You can see them in the air, on land, and in the sea. Their special looks or abilities keep them safe from predators. Let me guide you through the world of animal camouflage.", "Mountain Hare", "Mountain hares are like rabbits, but they are bigger and have longer legs. They are very stylish animals. Mountain hares change colors according to season. In summer, they turn gray-brown to match the rocks and grass. In winter, they turn white to camouflage themselves in the snow. Changing colors makes them nearly invisible to predators like wild dogs and eagles.", "Did you know?", "Mountain hares have really big feet. Thanks to them, mountain hares can hop in deep snow and escape from predators.", "Octopus", "Look closely at a rock under the sea. If it moves, it might be an octopus. Octopuses are sea animals with rounded bodies and eight long arms. When octopuses feel danger, they use their special camouflage skill. Octopuses can change colors and patterns to match their surroundings. If they're near sea plants, they look like sea plants. If they're near coral reefs, they look like coral reefs. They can also stick shells on their bodies to look like a rock. This can fool predators completely.", "Did you know?", "Octopuses can spread ink. It creates a dark cloud that blocks the view of predators. This gives them enough time to escape."];var PASS_KO=["그들을 발견할 수 있니?", "당신은 숨바꼭질을 잘하는가? 야생에서 사는 몇몇 동물들은 위장을 매우 잘한다. 당신은 그들을 하늘에서, 땅에서, 그리고 바다에서 볼 수 있다. 그들의 특별한 생김새나 능력은 그들을 포식 동물로부터 안전하게 지킨다. 내가 당신을 동물 위장의 세계로 안내하겠다.", "고산토끼", "고산토끼는 토끼와 비슷하지만, 그들은 (몸이) 더 크고 더 긴 다리를 가지고 있다. 그들은 매우 멋진 동물이다. 고산토끼는 계절에 따라 색을 바꾼다. 여름에, 그들은 바위와 풀에 맞추기 위해 회갈색으로 변한다. 겨울에, 그들은 자신들을 눈 속에 위장하기 위해 흰색으로 변한다. 색을 바꾸는 것은 그들을 들개와 독수리 같은 포식 동물들에게 거의 보이지 않게 만든다.", "알고 있었나요?", "고산토끼는 정말 큰 발을 가지고 있다. 그것들 덕분에, 고산토끼는 깊은 눈 속에서 깡충깡충 뛰어 포식 동물로부터 도망칠 수 있다.", "문어", "바닷속 바위를 자세히 보아라. 만약 그것이 움직인다면, 그것은 문어일지도 모른다. 문어는 둥근 몸과 여덟 개의 긴 팔을 가진 해양 동물이다. 문어는 위험을 느낄 때, 그들의 특별한 위장 기술을 사용한다. 문어는 그들의 주변 환경에 맞추기 위해 색과 무늬를 바꿀 수 있다. 만약 그들이 해초 가까이에 있으면, 그들은 해초처럼 보인다. 만약 그들이 산호초 가까이에 있으면, 그들은 산호초처럼 보인다. 그들은 또한 바위처럼 보이기 위해 조개껍데기를 그들의 몸에 붙일 수 있다. 이는 포식 동물을 완전히 속일 수 있다.", "알고 있었나요?", "문어는 먹물을 퍼뜨릴 수 있다. 그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다. 이는 그들에게 도망칠 충분한 시간을 준다."];
