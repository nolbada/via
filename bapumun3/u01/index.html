: "③", "en": "upset", "ko": "속상한", "ok": false, "why": "형용사라서 맞아요. '나를 속상하게 했다'예요."}, {"n": "④", "en": "bored", "ko": "지루한", "ok": false, "why": "형용사라서 맞아요. '나를 지루하게 했다'예요."}, {"n": "⑤", "en": "gladly", "ko": "기꺼이", "ok": true, "why": "부사라서 올 수 없어요. 그래서 알맞지 않은 것이에요."}], "pencil": "make 뒤 목적어 다음에는 부사를 쓸 수 ___", "pencilKey": "없어요", "page": 9, "sec": "s1"}, {"id": "S1-03", "step": 1, "no": 3, "qtype": "유형 01 목적격보어가 명사/형용사/전치사구인 경우", "type": "mc", "ans": "③", "concept": ["030", "030-H1"], "gap": "", "words": [["call", "부르다"], ["wise", "현명한"], ["clean", "깨끗한"], ["cleanly", "깨끗하게"], ["depressed", "우울한"], ["leave", "~한 채로 두다"]], "h1": "어색한 문장을 찾는 문제예요. 각 문장에서 동사 바로 뒤 목적어 다음에 온 말이 어떤 품사인지 하나씩 보세요.", "h2": "5형식 문장에서 목적어 뒤 설명하는 말에는 명사나 형용사가 와요. 부사는 올 수 없어요. -ly로 끝나는 말을 찾아보세요.", "why": "keep(~한 상태로 유지하다)의 목적어 뒤에는 형용사가 와야 해요. cleanly(깨끗하게)는 부사라서 clean(깨끗한)으로 고쳐야 해요.", "opts": [{"n": "①", "en": "We call him John.", "ko": "우리는 그를 John이라고 부른다.", "ok": false, "why": "call(부르다) 뒤에 명사가 와서 맞아요."}, {"n": "②", "en": "I found him very wise.", "ko": "나는 그가 매우 현명하다고 생각했다.", "ok": false, "why": "형용사 wise(현명한)가 와서 맞아요."}, {"n": "③", "en": "Keep your hands cleanly.", "ko": "네 손을 깨끗하게 유지해라.", "ok": true, "why": "cleanly(깨끗하게)는 부사라서 틀려요. clean이어야 해요."}, {"n": "④", "en": "I made my mom depressed.", "ko": "나는 엄마를 우울하게 만들었다.", "ok": false, "why": "형용사 depressed(우울한)가 와서 맞아요."}, {"n": "⑤", "en": "He often leaves the door open.", "ko": "그는 자주 문을 열어 둔다.", "ok": false, "why": "형용사 open(열린)이 와서 맞아요."}], "pencil": "keep, make 뒤 설명하는 말에는 부사 말고 ___를 써요", "pencilKey": "형용사", "page": 9, "sec": "s1"}, {"id": "S1-04", "step": 1, "no": 4, "qtype": "유형 01 목적격보어가 명사/형용사/전치사구인 경우", "type": "write", "ans": "fascinating", "concept": ["030", "068-2"], "gap": "", "words": [["find", "~라고 생각하다"], ["fascinate", "대단히 흥미롭게 하다"], ["fascinating", "대단히 흥미로운"], ["subject", "주제"]], "h1": "우리말은 '그 주제가 대단히 흥미롭다는 것을 알았다'예요. 괄호 안 fascinate(대단히 흥미롭게 하다)를 어떤 품사로 바꿔야 할지 정하세요.", "h2": "find(~라고 생각하다) 뒤 the subject를 설명하는 자리예요. 주제가 '흥미롭게 만드는 쪽'이라서 -ing 모양의 형용사가 알맞아요.", "why": "find의 목적어 the subject는 흥미를 주는 쪽이에요. 그래서 -ing 모양의 형용사 fascinating(대단히 흥미로운)을 써요.", "opts": [], "pencil": "주제가 흥미를 '주는' 것이면 ___ 모양을 써요", "pencilKey": "-ing", "page": 9, "sec": "s1"}, {"id": "S1-05", "step": 1, "no": 5, "qtype": "유형 01 목적격보어가 명사/형용사/전치사구인 경우", "type": "write", "ans": "leader", "concept": ["030", "030-H1"], "gap": "", "words": [["elect", "선출하다"], ["lead", "이끌다"], ["leader", "지도자"]], "h1": "We elected him our new lead. 밑줄 친 lead(이끌다)는 him을 설명하는 말이에요. '새로운 무엇'이라고 말하는 자리일까요?", "h2": "elect(선출하다) 뒤에는 '그가 무엇이 되었는지'를 나타내는 명사가 와요. lead는 동사라서 '이끄는 사람'을 뜻하는 명사 모양으로 바꿔야 해요.", "why": "elect(선출하다)는 목적어 뒤에 명사를 써서 '~로 뽑다'가 돼요. lead(이끌다)는 동사라서 명사 leader(지도자)로 고쳐요.", "opts": [], "pencil": "elect 뒤 설명하는 말은 ___(명사)로 써요", "pencilKey": "사람을 뜻하는 명사", "page": 9, "sec": "s1"}, {"id": "S1-06", "step": 1, "no": 6, "qtype": "유형 01 목적격보어가 명사/형용사/전치사구인 경우", "type": "mc", "ans": "③", "concept": ["029-2", "030"], "gap": "", "words": [["call", "부르다"], ["lawyer", "변호사"], ["elect", "선출하다"], ["consider", "~라고 생각하다"], ["present", "선물"]], "h1": "문장의 형식이 '다른' 하나를 찾아요. 각 문장에서 동사 뒤에 온 두 말이 서로 같은 대상인지(=) 확인하세요.", "h2": "5형식은 목적어와 뒤의 말이 같은 사람이에요(예: He called me a baby에서 me = a baby). 4형식은 '~에게 …을'이라서 두 말이 서로 달라요(예: She gave me a book에서 me와 a book은 달라요).", "why": "I sent him a present.는 '그에게 선물을 보냈다'라서 him과 a present가 서로 다른 4형식이에요. 나머지는 5형식이에요.", "opts": [{"n": "①", "en": "He called me a baby.", "ko": "그는 나를 아기라고 불렀다.", "ok": false, "why": "me = a baby 관계라서 5형식이에요."}, {"n": "②", "en": "He made me a lawyer.", "ko": "그는 나를 변호사로 만들었다.", "ok": false, "why": "me = a lawyer 관계라서 5형식이에요."}, {"n": "③", "en": "I sent him a present.", "ko": "나는 그에게 선물을 보냈다.", "ok": true, "why": "him과 a present가 서로 다른 4형식이에요. 그래서 정답이에요."}, {"n": "④", "en": "They elected me president.", "ko": "그들은 나를 회장으로 뽑았다.", "ok": false, "why": "me = president 관계라서 5형식이에요."}, {"n": "⑤", "en": "We considered her a strong woman.", "ko": "우리는 그녀를 강한 여성이라고 생각했다.", "ok": false, "why": "her = a strong woman 관계라서 5형식이에요."}], "pencil": "4형식은 두 말이 서로 ___, 5형식은 같아요", "pencilKey": "달라요", "page": 9, "sec": "s1"}, {"id": "S1-07", "step": 1, "no": 7, "qtype": "유형 01 목적격보어가 명사/형용사/전치사구인 경우", "type": "mc", "ans": "③", "concept": ["030"], "gap": "", "words": [["get", "~하게 하다"], ["trouble", "곤경"], ["in trouble", "곤경에 처한"]], "h1": "He got me ___ big trouble. '나를 큰 곤경에 처하게 했다'는 뜻이에요. '~에 처한 상태'를 말할 때 어울리는 전치사를 떠올려 보세요.", "h2": "'곤경에 빠진 상태'는 in trouble이라고 해요. 목적어(me) 뒤에서 상태를 말해 주는 전치사구예요.", "why": "get(~하게 하다) + 목적어 + in trouble은 '~을 곤경에 처하게 하다'예요. 상태를 나타내는 전치사구는 in을 써요.", "opts": [{"n": "①", "en": "at", "ko": "~에", "ok": false, "why": "at trouble이라는 표현은 없어요."}, {"n": "②", "en": "for", "ko": "~을 위해", "ok": false, "why": "for trouble은 '곤경을 위해'가 돼 뜻이 어색해요."}, {"n": "③", "en": "in", "ko": "~에(처한)", "ok": true, "why": "in trouble(곤경에 처한)이 자연스러워서 맞아요."}, {"n": "④", "en": "on", "ko": "~위에", "ok": false, "why": "on trouble이라는 표현은 쓰지 않아요."}, {"n": "⑤", "en": "with", "ko": "~와 함께", "ok": false, "why": "with trouble은 '곤경과 함께'라서 문장 뜻이 안 맞아요."}], "pencil": "in trouble은 '___에 처한'이라는 뜻이에요", "pencilKey": "곤경", "page": 9, "sec": "s1"}, {"id": "S1-08", "step": 1, "no": 8, "qtype": "유형 01 목적격보어가 명사/형용사/전치사구인 경우", "type": "write", "ans": "in", "concept": ["030"], "gap": "", "words": [["stay", "~한 상태로 있다"], ["healthy", "건강한"], ["keep", "유지하다"], ["shape", "몸 상태"]], "h1": "Exercise keeps me ___ good shape. '건강한 상태로'라는 뜻을 만들어 줄 말이 무엇인지 생각해 보세요.", "h2": "'~한 상태로'를 나타내는 전치사구가 keep(유지하다) 뒤에서 목적어의 상태를 말해 줘요. '좋은 몸 상태 안에 있는'이라는 느낌의 전치사를 떠올려 보세요.", "why": "keep(유지하다) + 목적어 + in good shape는 '~을 건강한 상태로 유지시키다'예요. 상태를 말하는 전치사 in이 들어가요.", "opts": [], "pencil": "'좋은 몸 상태로'는 ___ good shape예요", "pencilKey": "in", "page": 9, "sec": "s1"}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 01 목적격보어가 명사/형용사/전치사구인 경우", "type": "write", "ans": "in → at", "concept": ["030"], "gap": "", "words": [["make oneself at home", "편안히 지내다"], ["sit down", "앉다"], ["invite", "초대하다"]], "h1": "make yourself in home에서 '자기 집에 있는 것처럼 편히  "why": "my laptop은 훔침을 '당하는' 쪽이에요. 그래서 과거분사 stolen(도난당한)을 써요.", "opts": [], "pencil": "목적어가 당하는 쪽이면 ___ 모양을 써요", "pencilKey": "과거분사", "page": 11, "sec": "s1"}, {"id": "S1-22", "step": 1, "no": 22, "qtype": "유형 04 목적격보어가 현재분사/과거분사인 경우", "type": "mc", "ans": "③", "concept": ["031-3", "030-H1"], "gap": "", "words": [["wound", "다치게 하다"], ["cut", "자르다"], ["wait", "기다리다"], ["touch", "만지다"], ["sit", "앉다"]], "h1": "밑줄 친 부분이 어색한 것을 찾아요. 각 문장에서 목적어가 그 행동을 직접 하는지(능동), 당하는지(수동) 따져 보세요.", "h2": "능동이면 -ing, 수동이면 과거분사예요. 각 문장의 목적어(him, my hair, her, a hand, a man)가 직접 하는지 당하는지 하나씩 따져 보세요.", "why": "Don't leave her waited에서 her는 직접 기다리는 쪽(능동)이라서 현재분사 waiting이어야 해요.", "opts": [{"n": "①", "en": "I found him wounded.", "ko": "나는 그가 다쳐 있는 것을 발견했다.", "ok": false, "why": "him은 다침을 당한 쪽이라 과거분사 wounded가 맞아요."}, {"n": "②", "en": "I must get my hair cut.", "ko": "나는 머리를 잘라야 한다.", "ok": false, "why": "머리는 잘리는 쪽이라 과거분사 cut이 맞아요."}, {"n": "③", "en": "Don't leave her waited in the rain.", "ko": "그녀를 빗속에서 기다리게 두지 마라.", "ok": true, "why": "her는 기다리는 쪽이라 waiting이어야 해요. 그래서 정답이에요."}, {"n": "④", "en": "He felt a hand touching his shoulder.", "ko": "그는 손이 자기 어깨를 만지는 것을 느꼈다.", "ok": false, "why": "손이 직접 만지는 쪽이라 touching이 맞아요."}, {"n": "⑤", "en": "I saw a man sitting alone on the grass.", "ko": "나는 한 남자가 풀밭에 혼자 앉아 있는 것을 봤다.", "ok": false, "why": "남자가 직접 앉아 있는 쪽이라 sitting이 맞아요."}], "pencil": "목적어가 직접 하면 ___, 당하면 과거분사", "pencilKey": "-ing", "page": 11, "sec": "s1"}, {"id": "S1-23", "step": 1, "no": 23, "qtype": "유형 04 목적격보어가 현재분사/과거분사인 경우", "type": "write", "ans": "He had his car washed.", "concept": ["031-3", "031-2"], "gap": "", "words": [["have", "~하게 하다"], ["car", "차"], ["wash", "씻다"], ["washed", "씻겨진"]], "h1": "(car, had, washed, his, he) 차는 직접 씻는 걸까요, 씻김을 당하는 걸까요?", "h2": "'have + 목적어 + 과거분사'는 '~되도록 하다'라는 뜻이에요. 목적어가 당하는 쪽일 때 써요.", "why": "'He(주어) had(동사) his car(목적어) washed(과거분사)' 순서예요. 뜻은 '그는 자기 차를 세차시켰다'예요.", "opts": [], "pencil": "have + 목적어 + ___(수동일 때)", "pencilKey": "과거분사", "page": 11, "sec": "s1"}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 04 목적격보어가 현재분사/과거분사인 경우", "type": "mc", "ans": "④", "concept": ["031", "031-3"], "gap": "", "words": [["listen to", "~을 듣다"], ["play", "연주하다"], ["sleep", "자다"], ["find", "발견하다"], ["sofa", "소파"]], "h1": "두 빈칸을 따로 풀어요. 첫째는 song이 연주를 '당하는' 쪽인지, 둘째는 her가 직접 자고 있는 쪽인지 보세요.", "h2": "능동이면 동사원형 또는 -ing, 수동이면 과거분사예요. 노래는 연주를 당하고, 그녀는 직접 자고 있어요.", "why": "the song은 연주되는 쪽이라 과거분사 played, her는 자는 쪽이라 sleeping이에요.", "opts": [{"n": "①", "en": "play – sleep", "ko": "연주하다 - 자다", "ok": false, "why": "첫째는 노래가 연주를 당하므로 과거분사 played여야 해요."}, {"n": "②", "en": "play – slept", "ko": "연주하다 - 잤다", "ok": false, "why": "두 곳 모두 알맞지 않아요."}, {"n": "③", "en": "played – slept", "ko": "연주된 - 잤다", "ok": false, "why": "둘째에 과거형 slept를 쓸 수 없어요."}, {"n": "④", "en": "played – sleeping", "ko": "연주된 - 자고 있는", "ok": true, "why": "첫째는 수동이라 played, 둘째는 능동이라 sleeping이라 모두 맞아요."}, {"n": "⑤", "en": "playing – sleeping", "ko": "연주하는 - 자고 있는", "ok": false, "why": "첫째는 노래가 직접 연주하는 게 아니라서 playing이 틀려요."}], "pencil": "목적어가 당하면 ___, 직접 하면 -ing", "pencilKey": "과거분사", "page": 11, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 04 목적격보어가 현재분사/과거분사인 경우", "type": "mc", "ans": "①", "concept": ["031", "031-3"], "gap": "", "words": [["hear", "듣다"], ["call", "부르다"], ["name", "이름"], ["called", "불린"]], "h1": "I heard my name (call). 내 이름은 부르는 쪽일까요, 불리는 쪽일까요?", "h2": "지각동사 hear 뒤에서 목적어가 어떤 일을 '당하면' 과거분사를 써요.", "why": "my name(내 이름)은 불리는 쪽이에요. 그래서 과거분사 called(불린)가 맞아요.", "opts": [{"n": "①", "en": "called", "ko": "불린", "ok": true, "why": "수동 관계라서 과거분사가 맞아요."}, {"n": "②", "en": "calling", "ko": "부르는", "ok": false, "why": "이름이 직접 부르는 게 아니라서 틀려요."}, {"n": "③", "en": "calls", "ko": "부른다", "ok": false, "why": "동사 모양이라 보어 자리에 쓸 수 없어요."}, {"n": "④", "en": "be called", "ko": "불리다", "ok": false, "why": "be 동사원형은 보어 자리에 쓰지 않아요."}, {"n": "⑤", "en": "to call", "ko": "부르도록", "ok": false, "why": "지각동사 뒤에는 to부정사를 쓰지 않아요."}], "pencil": "hear + 목적어 + ___(수동일 때)", "pencilKey": "과거분사", "page": 11, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "목적격보어가 명사/형용사/전치사구인 경우", "type": "mc", "ans": "④", "concept": ["030", "030-H1"], "gap": "", "words": [["make", "만들다"], ["tired", "피곤한"], ["leave", "~한 채로 두다"], ["drawer", "서랍"], ["excite", "흥분시키다"], ["exciting", "흥미진진한"]], "h1": "어색한 문장을 찾아요. 각 문장에서 동사 뒤 목적어 다음에 온 말이 어떤 품사인지 하나씩 보세요.", "h2": "find(~라고 생각하다)는 목적어 뒤에서 '어떤 느낌인지, 어떤 상태인지'를 형용사로 말해요. 동사 그대로의 모양이 온 곳이 있는지 보세요.", "why": "find(~라고 생각하다) 뒤에는 형용사를 써요. excite(흥분시키다)는 동사라서 '영화가 흥미진진하다'는 뜻의 exciting으로 써야 해요.", "opts": [{"n": "①", "en": "It made me tired.", "ko": "그것은 나를 피곤하게 했다.", "ok": false, "why": "형용사 tired(피곤한)가 와서 맞아요."}, {"n": "②", "en": "I left the drawer open.", "ko": "나는 서랍을 열어 둔 채로 뒀다.", "ok": false, "why": "형용사 open(열린)이 와서 맞아요."}, {"n": "③", "en": "Let's keep it a secret.", "ko": "그것을 비밀로 하자.", "ok": false, "why": "명사 a secret(비밀)이 와서 맞아요."}, {"n": "④", "en": "I found the movie excite.", "ko": "나는 그 영화가 흥미진진하다고 생각했다.", "ok": true, "why": "excite는 동사 모양이라 틀려요. exciting이어야 해요."}, {"n": "⑤", "en": "My mother wanted me to be a teacher.", "ko": "엄마는 내가 선생님이 되기를 원하셨다.", "ok": false, "why": "want + 목적어 + to부정사라서 맞아요."}], "pencil": "find 뒤 설명하는 말에는 동사 모양이 아니라 ___를 써요", "pencilKey": "형용사", "page": 12, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "목적격보어가 명사/형용사/전치사구인 경우", "type": "mc", "ans": "③", "concept": ["030", "030-H1"], "gap": "", "words": [["find", "~라고 생각하다"], ["easy", "쉬운"], ["easily", "쉽게"], ["angry", "화난"], ["angrily", "화나서"], ["anger", "화"]], "h1": "빈칸 두 개가 모두 목적어(it, us) 뒤 설명하는 자리예요. 두 자리에 들어갈 말의 품사를 먼저 정하세요.", "h2": "목적어를 설명하는 자리에는 형용사가 와요. 부사나 명사는 어울리지 않아요. 두 빈칸이 모두 형용사인 보기를 고르세요.", "why": "find(~라고 생각하다)와 make(만들다) 뒤에는 형용사가 와요. easy(쉬운), angry(화난)가 짝이에요.", "opts": [{"n": "①", "en": "easily – angry", "ko": "쉽게 - 화난", "ok": false, "why": "첫째 easily(쉽게)가 부사라서 틀려요."}, {"n": "②", "en": "easily – angrily", "ko": "쉽게 - 화나서", "ok": false, "why": "둘 다 부사라서 틀려요."}, {"n": "③", "en": "easy – angry", "ko": "쉬운 - 화난", "ok": true, "why": "둘 다 형용사라서 맞아요."}, {"n": "④", "en": "easy – angrily", "ko": "쉬운 - 화나서", "ok": false, "why": "둘째 angrily(화나서)가 부사라서 틀려요."}, {"n": "⑤", "en": "easy – anger", "ko": "쉬운 - 화", "ok": false, "why": "둘째 anger(화)는 명사라서 '우리 = 화'가 돼 틀려요."}], "pencil": "find, make 뒤 설명하는 말은 부사가 아니라 ___", "pencilKey": "형용사", "page": 12, "sec": "s2"}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "통합형", "type": "mc", "ans": "①", "concept": ["029-2", "030"], "gap": "", "words": [["buy", "사 주다"], ["shirt", "셔츠"], ["feel", "느끼다"], ["shake", "흔들리다"], ["tell", "말하다"]], "h1": "형식이 '다른' 하나를 찾아요. 동사 뒤에 온 두 말이 서로 같은 대상인지(=)를 확인해 보세요.", "h2": "4형식은 '~에게 …을'이라서 사람과 물건이 따로예요. 5형식은 목적어와 뒤의 말이 이어져 '목적어가 ~하다/~이다'가 돼요.", "why": "He bought me a shirt.는 '나에게 셔츠를 사 주었다'라서 me와 a shirt가 따로인 4형식이에요. 나머지는 5형식이에요.", "opts": [{"n": "①", "en": "He bought me a shirt.", "ko": "그는 나에게 셔츠를 사 주었다.", "ok": true, "why": "me와 a shirt가 따로라서 4형식이에요. 그래서 정답이에요."}, {"n": "②", "en": "I found the story true.", "ko": "나는 그 이야기가 사실이라고 생각했다.", "ok": false, "why": "the story = true 관계라서 5형식이에요."}, {"n": "③", "en": "I felt the ground shake.", "ko": "나는 땅이 흔들리는 것을 느꼈다.", "ok": false, "why": "the ground가 흔들리는 관계라서 5형식이에요."}, {"n": "④", "en": "She made him a singer.", "ko": "그녀는 그를 가수로 만들었다.", "ok": false, "why": "him = a singer 관계라서 5형식이에요."}, {"n": "⑤", "en": "They told me not to watch TV.", "ko": "그들은 내게 TV를 보지 말라고 말했다.", "ok": false, "why": "me가 TV를 보지 않을 대상이라 5형식이에요."}], "pencil": "4형식은 사람과 물건이 따로이고 5형식은 목적어가 ___", "pencilKey": "설명하는 말과 이어져요", "page": 12, "sec": "s2"}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "목적격보어가 to부정사/동사원형인 경우", "type": "mc", "ans": "②", "concept": ["030-H1", "031-2"], "gap": "", "words": [["ask", "부탁하다"], ["make", "~하게 시키다"], ["open", "열다"], ["brother", "형제"]], "h1": "빈칸 두 개를 따로 풀어요. 첫째는 ask(부탁하다) 뒤, 둘째는 make(~하게 시키다) 뒤예요.", "h2": "ask는 목적어 뒤에 to부정사를 쓰고, make는 사역동사라서 동사원형을 써요. 이 두 짝을 찾으세요.", "why": "asked(원형 ask 부탁하다) + 목적어 + to open, made(원형 make 시키다) + 목적어 + open이에요.", "opts": [{"n": "①", "en": "open – to open", "ko": "열다 - 열도록", "ok": false, "why": "순서가 반대예요. ask 뒤에는 to부정사가 와야 해요."}, {"n": "②", "en": "to open – open", "ko": "열도록 - 열다", "ok": true, "why": "ask 뒤는 to부정사, make 뒤는 동사원형이라서 맞아요."}, {"n": "③", "en": "opening – open", "ko": "여는 - 열다", "ok": false, "why": "ask 뒤에 -ing를 쓸 수 없어서 틀려요."}, {"n": "④", "en": "open – opening", "ko": "열다 - 여는", "ok": false, "why": "둘 다 틀려요. ask 뒤에는 to부정사, make 뒤에는 동사원형이에요."}, {"n": "⑤", "en": "to open – to open", "ko": "열도록 - 열도록", "ok": false, "why": "make 뒤에 to부정사를 쓸 수 없어서 틀려요."}], "pencil": "ask 뒤에는 to부정사, make 뒤에는 ___", "pencilKey": "동사원형", "page": 12, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "목적격보어가 to부정사/동사원형인 경우", "type": "mc", "ans": "①", "concept": ["030-H1", "031-2"], "gap": "", "words": [["let", "~하게 해 주다"], ["allow", "허락하다"], ["leave", "떠나다"], ["country", "나라"]], "h1": "두 문장이 같은 뜻이에요. let(~하게 해 주다)과 allow(허락하다)는 뒤에 오는 모양이 달라요.", "h2": "let은 동사원형을 쓰고, allow는 목적어 뒤에 to부정사를 써요. 빈칸은 allow 쪽이에요.", "why": "allowed(원형 allow 허락하다) + 목적어 + to부정사예요. 그래서 to leave(떠나도록)가 맞아요.", "opts": [{"n": "①", "en": "to leave", "ko": "떠나도록", "ok": true, "why": "allow 뒤에 쓰는 to부정사라서 맞아요."}, {"n": "②", "en": "leave", "ko": "떠나다", "ok": false, "why": "let일 때는 맞지만 allow 뒤에는 쓸 수 없어요."}, {"n": "③", "en": "leaving", "ko": "떠나는", "ok": false, "why": "allow 뒤에 -ing를 쓸 수 없어요."}, {"n": "④", "en": "left", "ko": "떠난", "ok": false, "why": "과거형이라 목적격 보어 자리에 쓸 수 없어요."}, {"n": "⑤", "en": "to leaving", "ko": "떠나는 것으로", "ok": false, "why": "to 뒤에는 동사원형이 와야 해요."}], "pencil": "allow + 목적어 + ___", "pencilKey": "to부정사", "page": 12, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "통합형", "type": "mc", "ans": "⑤", "concept": ["031", "030-H1", "031-2"], "gap": "", "words": [["see", "보다"], ["cry", "울다"], ["sleep", "자다"], ["allow", "허락하다"], ["let", "~하게 해 주다"], ["swim", "수영하다"]], "h1": "옳은 문장을 찾아요. 각 문장의 동사(see, find, allow, have, let)를 보고 그 뒤에 어떤 모양이 와야 하는지 정해 보세요.", "h2": "지각동사(see 보다)는 동사원형이나 -ing, 사역동사(have, let)는 동사원형, allow(허락하다)는 to부정사를 써요. 이 규칙에 맞는 문장을 찾으세요.", "why": "let(~하게 해 주다) + 목적어 + 동사원형이라서 Please let me know...가 맞아요. 나머지는 모양이 틀려요.", "opts": [{"n": "①", "en": "I saw him cried.", "ko": "나는 그가 우는 것을 봤다.", "ok": false, "why": "지각동사 뒤에는 cry 또는 crying이어야 해요. 과거형 cried는 틀려요."}, {"n": "②", "en": "I found them to sleep in class.", "ko": "나는 그들이 수업 중에 자는 것을 발견했다.", "ok": false, "why": "find 뒤에는 to부정사를 쓰지 않고 sleeping을 써요."}, {"n": "③", "en": "Mom allowed me go to the movies.", "ko": "엄마는 내가 영화 보러 가는 것을 허락하셨다.", "ok": false, "why": "allow 뒤에는 to go여야 해요."}, {"n": "④", "en": "I had the woman to swim in the river.", "ko": "나는 그 여자가 강에서 수영하게 했다.", "ok": false, "why": "have 뒤에는 swim(동사원형)이어야 해요."}, {"n": "⑤", "en": "Please let me know your e-mail address.", "ko": "당신의 이메일 주소를 알려 주세요.", "ok": true, "why": "let + 목적어 + 동사원형이라서 맞아요."}], "pencil": "let, have, make 뒤에는 ___을 써요", "pencilKey": "동사원형", "page": 12, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "목적격보어가 to부정사/동사원형인 경우", "type": "mc", "ans": "⑤", "concept": ["030-H1", "023"], "gap": "", "words": [["advise", "충고하다"], ["stop", "그만두다"], ["play", "하다"], ["game", "게임"]], "h1": "'너는 게임을 그만두는 게 좋겠다'를 advise(충고하다)로 바꾼 문장이에요. 빈칸 앞에 not이 이미 있어요.", "h2": "advise는 목적어 뒤에 to부정사를 써요. to부정사를 부정할 때는 'not + to + 동사원형' 순서예요.", "why": "advise(충고하다) + 목적어 + not to + 동사원형이에요. 그래서 not to play가 맞아요.", "opts": [{"n": "①", "en": "play", "ko": "하다", "ok": false, "why": "advise 뒤에는 to부정사가 필요해요. to가 없어서 틀려요."}, {"n": "②", "en": "plays", "ko": "한다", "ok": false, "why": "3인칭 동사 모양이라 틀려요."}, {"n": "③", "en": "played", "ko": "했다", "ok": false, "why": "과거형이라 틀려요."}, {"n": "④", "en": "playing", "ko": "하는 것", "ok": false, "why": "advise 뒤에 -ing를 쓰지 않아요."}, {"n": "⑤", "en": "to play", "ko": "하도록", "ok": true, "why": "not 뒤에 to play가 와서 'not to play'가 돼 맞아요."}], "pencil": "to부정사의 부정은 ___ to + 동사원형", "pencilKey": "not", "page": 12, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "목적격보어가 to부정사/동사원형인 경우", "type": "write", "ans": "read → to read", "concept": ["030-H1"], "gap": "", "words": [["ask", "부탁하다"], ["read", "읽다"], ["story", "이야기"]], "h1": "My teacher asked me read stories for class. ask(부탁하다) 뒤 me 다음에 오는 모양이 맞는지 보세요.", "h2": "ask는 목적어 뒤에 정해진 모양을 써요. read를 그 모양에 맞게 바꿔 보세요.", "why": "ask(부탁하다) + 목적어 + to부정사예요. 그래서 read를 to read(읽으라고)로 고쳐요.", "opts": [], "pencil": "ask + 목적어 뒤에는 ___를 써요", "pencilKey": "to부정사", "page": 13, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "목적격보어가 to부정사/동사원형인 경우", "type": "write", "ans": "play[playing]", "concept": ["031"], "gap": "", "words": [["see", "보다"], ["boy", "소년"], ["garden", "정원"]], "h1": "'나는 그 소년이 정원에서 노는 것을 보았다'예요. see(보다)는 어떤 종류의 동사인지 먼저 떠올리세요.", "h2": "see 같은 지각동사 뒤에서 목적어가 직접 하는 행동은 동사원형이나 -ing로 써요. 괄호 안에 쓸 말은 play(놀다)를 바꾼 모양이에요.", "why": "saw(원형 see 보다) + 목적어 + 동사원형 또는 -ing예요. 그래서 play 또는 playing이 모두 맞아요.", "opts": [], "pencil": "지각동사 + 목적어 + 동사원형 또는 ___", "pencilKey": "-ing", "page": 13, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "목적격보어가 to부정사/동사원형인 경우", "type": "write", "ans": "you to do", "concept": ["030-H1"], "gap": "", "words": [["want", "원하다"], ["do your best", "최선을 다하다"]], "h1": "I just want ___ your best. (do) 3단어로 써야 해요. '내가 원하는 것'이 아니라 '네가 하기를 원한다'예요.", "h2": "want(원하다)는 '목적어 + to부정사' 순서예요. 목적어로 쓸 말과 to부정사 모양을 각각 생각해 보세요. 모두 3단어예요.", "why": "want + 목적어 + to부정사이므로 you to do(네가 하기를)가 3단어로 맞아요.", "opts": [], "pencil": "want + ___ + to부정사", "pencilKey": "목적어", "page": 13, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "목적격보어가 현재분사/과거분사인 경우", "type": "write", "ans": "closing → closed", "concept": ["031-3", "030-H1"], "gap": "", "words": [["get", "~되게 하다"], ["close", "닫다"], ["closed", "닫힌"], ["door", "문"]], "h1": "She got the door closing. 문은 스스로 닫는 쪽일까요, 닫힘을 당하는 쪽일까요?", "h2": "get + 목적어 + 과거분사는 '~되게 하다'예요. 목적어가 당하는 쪽이면 과거분사를 써요.", "why": "the door는 닫힘을 당하는 쪽이에요. 그래서 closing(닫는)을 closed(닫힌)로 고쳐요.", "opts": [], "pencil": "목적어가 당하는 쪽이면 ___를 써요", "pencilKey": "과거분사", "page": 13, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "목적격보어가 현재분사/과거분사인 경우", "type": "write", "ans": "He kept me waiting for an hour.", "concept": ["030-H1", "031-3"], "gap": "", "words": [["keep", "~하게 하다"], ["wait", "기다리다"], ["hour", "시간"]], "h1": "(me, hour, he, for, wait, an, kept) '그는 나를 한 시간 동안 기다리게 했다'예요. wait(기다리다)의 모양을 바꿔야 해요.", "h2": "keep + 목적어 + 분사는 '~가 계속 …하게 두다'예요. 목적어(me)가 직접 기다리는 쪽인지 당하는 쪽인지에 따라 분사 모양이 정해져요.", "why": "'He(주어) kept(동사) me(목적어) waiting(보어) for an hour' 순서예요. 내가 기다리는 쪽이라 -ing를 써요.", "opts": [], "pencil": "keep + 목적어 + ___(기다리는 쪽일 때)", "pencilKey": "-ing", "page": 13, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "목적격보어가 현재분사/과거분사인 경우", "type": "write", "ans": "(1) I had my computer repaired. (2) He saw her take[taking] a walk.", "concept": ["031-3", "031"], "gap": "", "words": [["have", "~하게 하다"], ["repair", "수리하다"], ["repaired", "수리된"], ["take a walk", "산책하다"]], "h1": "(1)은 '컴퓨터의 수리를 맡겼다', (2)는 '그가 그녀가 산책하는 것을 보았다'예요. 목적어가 직접 하는지 당하는지 각각 따져 보세요.", "h2": "(1) 컴퓨터는 직접 고치는 쪽일까요, 수리를 받는 쪽일까요? (2) 그녀는 직접 산책하는 쪽일까요, 당하는 쪽일까요? 목적어에 따라 알맞은 모양을 고르세요.", "why": "(1) had(원형 have 시키다) + my computer + repaired, (2) saw(원형 see 보다) + her + take 또는 taking이에요.", "opts": [], "pencil": "수동이면 과거분사, 지각동사 능동이면 동사원형 또는 ___", "pencilKey": "-ing", "page": 13, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "목적격보어가 현재분사/과거분사인 경우", "type": "write", "ans": "washed", "concept": ["031-3", "031-2"], "gap": "", "words": [["have", "~하게 시키다"], ["wash", "씻기다"], ["washed", "씻겨진"], ["dog", "개"]], "h1": "My father had me wash the dog. = My father had the dog ___ by me. 개는 씻기는 쪽이에요.", "h2": "둘째 문장은 목적어가 the dog로 바뀌었어요. 목적어가 당하는 쪽이면 과거분사를 써요. by me(나에 의해)도 힌트예요.", "why": "the dog는 씻김을 당하는 쪽이에요. 그래서 have the dog washed(원형 wash 씻기다의 과거분사) by me가 돼요.", "opts": [], "pencil": "have + 목적어 + ___ + by ~", "pencilKey": "과거분사", "page": 13, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "목적격보어가 현재분사/과거분사인 경우", "type": "write", "ans": "cried → cry[crying]", "concept": ["031"], "gap": "", "words": [["hear", "듣다"], ["baby", "아기"], ["cry", "울다"]], "h1": "She heard her baby cried. 아기는 직접 우는 쪽이에요. hear(듣다) 뒤에 올 수 있는 모양을 떠올려 보세요.", "h2": "지각동사 뒤에서 목적어가 직접 하는 행동은 동사원형이나 -ing예요. 과거형 cried(원형 cry 울다)는 쓸 수 없어요.", "why": "heard(원형 hear 듣다) + 목적어 + 동사원형 또는 -ing예요. 그래서 cried를 cry 또는 crying으로 고쳐요.", "opts": [], "pencil": "지각동사 뒤에는 과거형이 아니라 ___ 또는 -ing", "pencilKey": "동사원형", "page": 13, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "목적격보어가 명사/형용사/전치사구인 경우", "type": "mc", "ans": "②", "concept": ["030", "030-H1"], "gap": "", "words": [["keep", "~하게 유지하다"], ["leave", "~한 채로 두다"], ["alone", "혼자인"], ["comfortably", "편안하게"], ["thoughtfully", "생각 깊게"]], "h1": "옳은 문장을 찾는 문제예요. 각 문장에서 목적어 뒤에 온 말이 형용사인지 부사인지 -ly로 끝나는 말부터 확인하세요.", "h2": "5형식 문장에서 목적어를 설명하는 말에는 부사를 쓸 수 없어요. 각 문장의 설명하는 말이 형용사인지 부사인지 하나씩 가려 보세요.", "why": "leave(~한 채로 두다) + 목적어 + 형용사예요. alone(혼자인)은 형용사라서 맞아요. 나머지는 부사가 와서 틀려요.", "opts": [{"n": "①", "en": "I keep my room cleanly.", "ko": "나는 내 방을 깨끗하게 유지한다.", "ok": false, "why": "cleanly는 부사예요. clean(깨끗한)이어야 해요."}, {"n": "②", "en": "Please don't leave me alone.", "ko": "나를 혼자 두지 마세요.", "ok": true, "why": "형용사 alone(혼자인)이 와서 맞아요."}, {"n": "③", "en": "His letter made her sadly.", "ko": "그의 편지는 그녀를 슬프게 했다.", "ok": false, "why": "sadly는 부사예요. sad(슬픈)여야 해요."}, {"n": "④", "en": "I found the man very thoughtfully.", "ko": "나는 그 남자가 매우 생각이 깊다고 생각했다.", "ok": false, "why": "thoughtfully는 부사예요. thoughtful(생각 깊은)이어야 해요."}, {"n": "⑤", "en": "The Internet has made our lives comfortably.", "ko": "인터넷은 우리 삶을 편안하게 만들었다.", "ok": false, "why": "comfortably는 부사예요. comfortable(편안한)이어야 해요."}], "pencil": "목적어 뒤 설명하는 말에는 부사 말고 ___", "pencilKey": "형용사", "page": 14, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "목적격보어가 명사/형용사/전치사구인 경우", "type": "mc", "ans": "⑤", "concept": ["029-2", "030"], "gap": "", "words": [["make", "~로 만들다"], ["lawyer", "변호사"], ["famous", "유명한"], ["study hard", "열심히 공부하다"], ["desk", "책상"]], "h1": "His parents made him ___. 빈칸에 보기를 하나씩 넣었을 때 him과 뒤의 말이 같은 대상인지 따로인 물건인지 보세요.", "h2": "5형식은 '그는 ~이다/~하다'가 성립해요. 4형식은 '그에게 …을 만들어 주다'예요. 나머지 넷과 다른 한 개를 찾으세요.", "why": "made him a desk는 '그에게 책상을 만들어 주었다'라서 him과 a desk가 따로인 4형식이에요. 나머지는 5형식이에요.", "opts": [{"n": "①", "en": "a lawyer", "ko": "변호사", "ok": false, "why": "him = a lawyer 관계라 5형식이에요."}, {"n": "②", "en": "famous", "ko": "유명한", "ok": false, "why": "him이 유명해진 상태라 5형식이에요."}, {"n": "③", "en": "a good man", "ko": "좋은 사람", "ok": false, "why": "him = a good man 관계라 5형식이에요."}, {"n": "④", "en": "study hard", "ko": "열심히 공부하다", "ok": false, "why": "him이 열심히 공부하게 하는 5형식이에요."}, {"n": "⑤", "en": "a desk", "ko": "책상", "ok": true, "why": "him과 다른 물건이라 4형식이에요. 그래서 정답이에요."}], "pencil": "4형식은 사람과 물건이 따로예요. 5형식은 ___", "pencilKey": "목적어와 같은 관계예요", "page": 14, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "목적격보어가 명사/형용사/전치사구인 경우", "type": "mc", "ans": "②, ⑤", "concept": ["030", "029-2"], "gap": "", "words": [["success", "성공"], ["make", "만들다"], ["keep", "유지하다"], ["difficult", "어려운"], ["fresh", "신선한"]], "h1": "His success made her happy.의 happy는 목적어 her를 설명하는 '목적격 보어'예요. 보기에서 밑줄 친 말도 같은 역할인지 보세요.", "h2": "밑줄 친 말이 목적어를 설명하면 5형식의 목적격 보어예요. 직접목적어(~을)나 장소·시간을 말하는 말(부사구)은 역할이 달라요.", "why": "②의 difficult(어려운)와 ⑤의 fresh(신선한)는 목적어를 설명하는 목적격 보어예요. ①은 직접목적어, ③ ④는 부사 쪽이에요.", "opts": [{"n": "①", "en": "She will make him a bag.", "ko": "그녀는 그에게 가방을 만들어 줄 것이다.", "ok": false, "why": "a bag은 직접목적어(~을)예요. 4형식이라 역할이 달라요."}, {"n": "②", "en": "He found Chinese difficult.", "ko": "그는 중국어가 어렵다고 생각했다.", "ok": true, "why": "difficult가 Chinese를 설명하는 목적격 보어라서 맞아요."}, {"n": "③", "en": "I won't keep you long.", "ko": "나는 당신을 오래 붙잡지 않겠다.", "ok": false, "why": "long은 '오래'라는 부사라서 목적격 보어가 아니에요."}, {"n": "④", "en": "I found the coin in the drawer.", "ko": "나는 서랍 안에서 동전을 찾았다.", "ok": false, "why": "in the drawer는 장소를 말하는 부사구라서 목적격 보어가 아니에요."}, {"n": "⑤", "en": "It keeps fruit and meat fresh.", "ko": "그것은 과일과 고기를 신선하게 유지한다.", "ok": true, "why": "fresh가 fruit and meat를 설명하는 목적격 보어라서 맞아요."}], "pencil": "목적어를 설명하는 말이 ___예요", "pencilKey": "목적격 보어", "page": 14, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "통합형", "type": "mc", "ans": "③", "concept": ["030-H1", "031-2", "031-3"], "gap": "", "words": [["surprising", "놀라운"], ["surprised", "놀란"], ["let", "~하게 해 주다"], ["elect", "선출하다"], ["join", "가입하다"], ["bored", "지루해하는"]], "h1": "옳은 문장을 찾아요. 각 문장의 동사(make, let, elect, want, find)를 보고 뒤에 올 모양을 정해 보세요.", "h2": "let은 동사원형, want는 to부정사를 써요. -ing와 p.p.는 목적어가 '느끼는' 쪽인지 '주는' 쪽인지로 골라요. 동사마다 알맞은 모양을 하나씩 대조해 보세요.", "why": "elect(선출하다) + 목적어 + 명사예요. We elected him a leader...는 맞는 문장이에요. 나머지는 모양이 틀려요.", "opts": [{"n": "①", "en": "He made his parents surprising.", "ko": "그는 부모님을 놀라게 했다.", "ok": false, "why": "부모님은 놀람을 느끼는 쪽이라 surprised(놀란)여야 해요."}, {"n": "②", "en": "I will let him going to the rock concert.", "ko": "나는 그가 록 콘서트에 가게 해 줄 것이다.", "ok": false, "why": "let 뒤에는 동사원형 go여야 해요."}, {"n": "③", "en": "We elected him a leader of our team.", "ko": "우리는 그를 우리 팀의 리더로 뽑았다.", "ok": true, "why": "elect + 목적어 + 명사라서 맞아요."}, {"n": "④", "en": "I want Jane joined our club.", "ko": "나는 Jane이 우리 동아리에 가입하기를 원한다.", "ok": false, "why": "want 뒤에는 to join이어야 해요."}, {"n": "⑤", "en": "I found the book very bored.", "ko": "나는 그 책이 매우 지루하다고 생각했다.", "ok": false, "why": "책은 지루함을 주는 쪽이라 boring(지루한)이어야 해요."}], "pencil": "elect 뒤 설명하는 말은 ___", "pencilKey": "명사", "page": 14, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "목적격보어가 명사/형용사/전치사구인 경우", "type": "mc", "ans": "③", "concept": ["030", "030-H1", "028-2"], "gap": "", "words": [["find", "~라고 생각하다"], ["coach", "코치"], ["funny", "웃기는"], ["quiet", "조용한"], ["prudently", "신중하게"], ["friendly", "친절한"], ["handsome", "잘생긴"]], "h1": "They found their coach ___. 목적어 their coach를 설명하는 자리예요. 보기 중 품사가 다른 하나를 찾으세요.", "h2": "이 자리에는 형용사가 와요. -ly로 끝나지만 부사가 아닌 말도 있어요(friendly 친절한). 진짜 부사를 찾으세요.", "why": "find 뒤에는 형용사가 와야 해요. prudently(신중하게)는 부사라서 올 수 없어요.", "opts": [{"n": "①", "en": "funny", "ko": "웃기는", "ok": false, "why": "형용사라서 맞아요."}, {"n": "②", "en": "quiet", "ko": "조용한", "ok": false, "why": "형용사라서 맞아요."}, {"n": "③", "en": "prudently", "ko": "신중하게", "ok": true, "why": "부사라서 쓸 수 없어요. 그래서 정답이에요."}, {"n": "④", "en": "friendly", "ko": "친절한", "ok": false, "why": "-ly로 끝나지만 형용사예요. 그래서 맞아요."}, {"n": "⑤", "en": "handsome", "ko": "잘생긴", "ok": false, "why": "형용사라서 맞아요."}], "pencil": "friendly, lovely는 -ly로 끝나지만 ___예요", "pencilKey": "형용사", "page": 14, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "통합형", "type": "mc", "ans": "③, ⑤", "concept": ["031", "030-H1"], "gap": "", "words": [["watch", "지켜보다"], ["hunter", "사냥꾼"], ["slope", "경사면"], ["go up", "오르다"]], "h1": "'나는 사냥꾼들이 경사면을 오르는 것을 보았다'를 두 개 고르는 문제예요. watch(지켜보다) 뒤에 올 수 있는 모양을 떠올리세요.", "h2": "watch는 지각동사예요. 목적어가 직접 하는 행동은 동사원형이나 -ing로 써요. to부정사, 과거형, is going은 안 돼요.", "why": "watch(지켜보다) 뒤 목적격 보어는 동사원형 go 또는 -ing형 going이에요. 그래서 ③과 ⑤가 맞아요.", "opts": [{"n": "①", "en": "I watched the hunters to go up the slope.", "ko": "나는 사냥꾼들이 경사면을 오르도록 지켜봤다.", "ok": false, "why": "지각동사 뒤에는 to부정사를 쓰지 않아요."}, {"n": "②", "en": "I watched the hunters is going up the slope.", "ko": "나는 사냥꾼들이 경사면을 오르고 있다 지켜봤다.", "ok": false, "why": "동사 is가 또 나와서 틀려요."}, {"n": "③", "en": "I watched the hunters going up the slope.", "ko": "나는 사냥꾼들이 경사면을 오르는 것을 지켜봤다.", "ok": true, "why": "-ing를 써서 맞아요."}, {"n": "④", "en": "I watched the hunters went up the slope.", "ko": "나는 사냥꾼들이 경사면을 올랐다 지켜봤다.", "ok": false, "why": "과거형 went(원형 go 가다)는 쓸 수 없어요."}, {"n": "⑤", "en": "I watched the hunters go up the slope.", "ko": "나는 사냥꾼들이 경사면을 오르는 것을 지켜봤다.", "ok": true, "why": "동사원형을 써서 맞아요."}], "pencil": "지각동사 뒤 목적격 보어는 동사원형 또는 ___", "pencilKey": "-ing", "page": 14, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "목적격보어가 to부정사/동사원형인 경우", "type": "mc", "ans": "⑤", "concept": ["031-2", "030-H1"], "gap": "", "words": [["use", "사용하다"], ["smartphone", "스마트폰"], ["let", "~하게 해 주다"], ["allow", "허락하다"]], "h1": "Kate ___ the students use their smartphones. use는 to 없는 동사원형이에요. 이 모양과 어울리지 않는 동사를 찾으세요.", "h2": "let, have, make는 사역동사라서 동사원형을 써요. see(보다)도 지각동사라 동사원형이 가능해요. 보기를 하나씩 넣어 동사원형과 어울리지 않는 것을 찾아보세요.", "why": "allow(허락하다)는 목적어 뒤에 to부정사를 써서 allowed the students to use가 돼야 해요. 동사원형 use와는 안 맞아요.", "opts": [{"n": "①", "en": "let", "ko": "~하게 해 줬다", "ok": false, "why": "let + 목적어 + 동사원형이라서 맞아요."}, {"n": "②", "en": "saw", "ko": "봤다(원형 see)", "ok": false, "why": "지각동사 + 목적어 + 동사원형이라서 맞아요."}, {"n": "③", "en": "had", "ko": "시켰다(원형 have)", "ok": false, "why": "have + 목적어 + 동사원형이라서 맞아요."}, {"n": "④", "en": "made", "ko": "시켰다(원형 make)", "ok": false, "why": "make + 목적어 + 동사원형이라서 맞아요."}, {"n": "⑤", "en": "allowed", "ko": "허락했다(원형 allow)", "ok": true, "why": "allow는 to부정사를 써야 해서 틀려요. 그래서 정답이에요."}], "pencil": "allow 뒤에는 동사원형이 아니라 ___", "pencilKey": "to부정사", "page": 14, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "통합형", "type": "write", "ans": "sadly → sad, to cry → cry", "concept": ["030-H1", "031-2"], "gap": "", "words": [["make", "~하게 만들다"], ["sad", "슬픈"], ["sadly", "슬프게"], ["cry out", "소리 내어 울다"]], "h1": "I heard a song. It made me very sadly and finally it made me to cry out loudly. made me 뒤에 오는 말 두 곳을 각각 살펴보세요.", "h2": "make(만들다)는 목적어 뒤에 정해진 모양을 써요. made me 뒤 두 곳이 그 모양에 맞는지 하나씩 확인해 보세요.", "why": "made(원형 make 만들다) + me + 형용사 sad, made + me + 동사원형 cry예요. 그래서 sadly를 sad로, to cry를 cry로 고쳐요.", "opts": [], "pencil": "make 뒤에는 부사와 ___를 쓰지 않아요", "pencilKey": "to부정사", "page": 15, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "통합형", "type": "write", "ans": "brush, to brush", "concept": ["031-2", "030-H1"], "gap": "", "words": [["have", "~하게 시키다"], ["get", "~하게 만들다"], ["brush", "닦다"], ["bedtime", "잠잘 시간"]], "h1": "My mom had me ___ my teeth. (brush) = My mom got me ___ my teeth. have와 get 뒤의 모양이 서로 달라요.", "h2": "have(사역동사)는 목적어 뒤에 동사원형을 써요. get은 사역동사가 아니에요. 두 번째 빈칸에는 어떤 모양이 어울릴지 생각해 보세요.", "why": "had(원형 have 시키다) + me + brush(동사원형), got(원형 get 만들다) + me + to brush(to부정사)예요.", "opts": [], "pencil": "have 뒤에는 동사원형, get 뒤에는 ___", "pencilKey": "to부정사", "page": 15, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "목적격보어가 to부정사/동사원형인 경우", "type": "write", "ans": "me not to listen", "concept": ["030-H1", "023"], "gap": "", "words": [["tell", "말하다"], ["listen to", "~을 듣다"], ["study", "공부하다"]], "h1": "나의 형은 내게 공부할 때는 음악을 듣지 말라고 말한다. tell(말하다) 뒤에 '나에게 ~하지 말라고'를 어떤 순서로 쓸지 생각하세요.", "h2": "tell + 목적어 + to부정사예요. '~하지 말라고'를 만들 때 not이 놓이는 자리를 떠올려 보세요. 빈칸은 4개예요.", "why": "tells(원형 tell 말하다) + me + not to listen이에요. 빈칸 순서대로 me, not, to, listen이 들어가요.", "opts": [], "pencil": "tell + 목적어 + not ___", "pencilKey": "to + 동사원형", "page": 15, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "통합형", "type": "write", "ans": "to move → move, safety → safe", "concept": ["030-H1", "031-2", "028"], "gap": "", "words": [["wing", "날개"], ["let", "~하게 해 주다"], ["help", "돕다"], ["keep", "유지하다"], ["safety", "안전"], ["safe", "안전한"]], "h1": "The wings will let people to move freely. ... To keep flying safety, ... 두 곳이 어색해요. 첫째는 let(~하게 해 주다) 뒤, 둘째는 keep flying 뒤예요.", "h2": "let은 동사원형을 써요. keep flying safety에서 safety(안전)는 명사라서 '안전하게 나는 상태'라는 자리에 맞는 모양으로 바꿔야 해요.", "why": "let(~하게 해 주다) + 목적어 + 동사원형이라서 to move는 move로 써요. keep(유지하다) 뒤 상태를 말하는 자리에는 형용사 safe(안전한)가 와요.", "opts": [], "pencil": "let 뒤에는 to가 없고, keep 뒤 상태는 ___", "pencilKey": "형용사", "page": 15, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "목적격보어가 현재분사/과거분사인 경우", "type": "write", "ans": "Ted tried to get his album released.", "concept": ["031-3", "030-H1"], "gap": "", "words": [["try", "노력하다"], ["get", "~하게 만들다"], ["album", "앨범"], ["release", "발매하다"], ["released", "발매된"]], "h1": "Ted는 그의 앨범을 발매시키려고 노력했다. (get, album, release) '~하려고 노력하다'를 먼저 만들어 보세요.", "h2": "'노력하다'는 try + to부정사예요. get + 목적어 뒤에서는 앨범이 직접 하는지 당하는지에 따라 모양이 달라져요.", "why": "tried(원형 try 노력하다) to get his album released예요. album은 발매되는 쪽이라 과거분사 released를 써요.", "opts": [], "pencil": "get + 목적어 + ___(수동일 때)", "pencilKey": "과거분사", "page": 15, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "목적격보어가 현재분사/과거분사인 경우", "type": "write", "ans": "lived → living", "concept": ["031", "030-H1"], "gap": "", "words": [["find", "발견하다"], ["old man", "노인"], ["alone", "혼자"], ["cave", "동굴"]], "h1": "I found an old man lived alone in the cave. 동사가 두 개 이어져서 어색해요. 노인은 직접 사는 쪽이에요.", "h2": "find 뒤 목적어와 그 행동이 능동인지 수동인지에 따라 모양이 달라져요. lived(원형 live 살다)를 알맞게 바꿔 보세요.", "why": "find(발견하다)의 목적어 an old man은 직접 사는 쪽이에요. 그래서 lived를 -ing형 living으로 고쳐요.", "opts": [], "pencil": "목적어가 직접 하는 행동을 이어 말할 때는 ___", "pencilKey": "-ing", "page": 15, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "목적격보어가 현재분사/과거분사인 경우", "type": "write", "ans": "Caren felt her hair touched by someone.", "concept": ["031-3", "031"], "gap": "", "words": [["feel", "느끼다"], ["hair", "머리카락"], ["touch", "만지다"], ["touched", "만져진"], ["someone", "누군가"]], "h1": "Caren은 그녀의 머리카락이 누군가에 의해 만져지는 것을 느꼈다. 머리카락은 만지는 쪽인지 만져지는 쪽인지 보세요.", "h2": "feel(느끼다) 뒤에서 목적어가 당하는 일이면 과거분사를 써요. by someone(누군가에 의해)도 힌트예요.", "why": "felt(원형 feel 느끼다) + her hair + touched예요. 머리카락은 만져지는 쪽이라 과거분사를 써요.", "opts": [], "pencil": "feel + 목적어 + ___(당하는 쪽일 때)", "pencilKey": "과거분사", "page": 15, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "통합형", "type": "write", "ans": "I found the history movie (was) interesting. And the movie made me (become) interested in history.", "concept": ["030", "030-H1", "068-2"], "gap": "", "words": [["find", "~라고 생각하다"], ["make", "~하게 만들다"], ["interesting", "흥미로운"], ["interested", "흥미를 느끼는"], ["history", "역사"]], "h1": "앞 문장은 영화가 '흥미롭다', 뒤 문장은 영화가 나를 '흥미를 느끼게 했다'예요. 영화와 나 중 누가 흥미를 주고 누가 느끼는지 나누세요.", "h2": "주는 쪽에는 -ing, 느끼는 쪽에는 -ed를 써요. 각 문장에서 영화와 나 중 어느 쪽이 주고 어느 쪽이 느끼는지 판단해 보세요.", "why": "I found the history movie interesting. / the movie made me interested in history예요. 영화는 흥미를 주고 나는 흥미를 느끼는 쪽이에요.", "opts": [], "pencil": "주는 쪽은 -ing, 느끼는 쪽은 ___", "pencilKey": "-ed", "page": 15, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "통합형", "type": "write", "ans": "② angrily → angry, ③ study → to study", "concept": ["030-H1", "030"], "gap": "", "words": [["confuse", "혼란스럽게 하다"], ["angry", "화난"], ["tell", "말하다"], ["help", "돕다"], ["watch", "지켜보다"]], "h1": "① ~ ⑤를 하나씩 봐요. 동사(make, tell, help, watch) 뒤에 올 모양이 맞는지 확인하고, 틀린 것은 모두 찾아 고쳐야 해요.", "h2": "make 뒤 설명하는 말은 형용사, tell 뒤는 to부정사, help 뒤는 동사원형 또는 to부정사, 지각동사 watch 뒤는 -ing 또는 동사원형이에요. 틀린 곳이 두 군데 있어요.", "why": "②는 made(원형 make 만들다) 뒤에 부사 angrily(화나서)가 와서 angry(화난)로, ③은 told(원형 tell 말하다) 뒤에 study(공부하다)가 와서 to study로 고쳐요.", "opts": [], "pencil": "make 뒤는 형용사, tell 뒤는 ___", "pencilKey": "to부정사", "page": 16, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "통합형", "type": "mc", "ans": "③", "concept": ["030-H1", "031", "031-2"], "gap": "", "words": [["puzzle", "퍼즐"], ["embarrassed", "당황한"], ["each other", "서로"], ["bring", "가져오다"], ["dance", "춤추다"], ["set the table", "상을 차리다"]], "h1": "다섯 문장을 하나씩 읽고 맞는지 틀린지 표시한 다음, 맞는 문장이 몇 개인지 세어 보세요.", "h2": "4번째는 see(보다) 뒤 모양이 맞는지, 5번째는 get(~하게 만들다) 뒤 모양이 맞는지가 핵심이에요. help는 동사원형과 to부정사 모두 가능해요.", "why": "맞는 문장은 1, 2, 3번째 세 개예요. 4번째는 to dance가 아니라 dance나 dancing이어야 하고, 5번째는 set이 아니라 to set이어야 해요.", "opts": [{"n": "①", "en": "1개", "ko": "맞는 문장이 1개", "ok": false, "why": "맞는 문장이 하나뿐이라면 1~3번째 중 두 개를 틀리게 본 거예요. 세 개가 맞아요."}, {"n": "②", "en": "2개", "ko": "맞는 문장이 2개", "ok": false, "why": "맞는 문장이 두 개라면 1~3번째 중 하나를 틀리게 본 거예요. 다시 세어 보세요."}, {"n": "③", "en": "3개", "ko": "맞는 문장이 3개", "ok": true, "why": "1번째(make + 형용사), 2번째(help + to부정사), 3번째(let + 동사원형)가 맞아서 3개예요."}, {"n": "④", "en": "4개", "ko": "맞는 문장이 4개", "ok": false, "why": "4번째 문장 to dance는 틀려서 4개가 될 수 없어요."}, {"n": "⑤", "en": "5개", "ko": "맞는 문장이 5개", "ok": false, "why": "4번째와 5번째 문장이 틀려서 5개가 될 수 없어요."}], "pencil": "틀린 문장: see + to부정사, get + ___", "pencilKey": "동사원형", "page": 16, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "통합형", "type": "write", "ans": "Mom[My mom] made me clean my room and told my sister to do her homework.", "concept": ["031-2", "030-H1"], "gap": "", "words": [["make", "~하게 시키다"], ["tell", "말하다"], ["clean", "청소하다"], ["homework", "숙제"]], "h1": "(make, tell) 두 문장을 and로 이어요. make 뒤와 tell 뒤의 모양이 다르다는 점에 주의하세요. 시제는 과거예요.", "h2": "made(원형 make 시키다) 뒤에는 동사원형, told(원형 tell 말하다) 뒤에는 to부정사를 써요.", "why": "Mom made me clean my room(make + 목적어 + 동사원형) and told my sister to do her homework(tell + 목적어 + to부정사)예요.", "opts": [], "pencil": "make 뒤에는 동사원형, tell 뒤에는 ___", "pencilKey": "to부정사", "page": 16, "sec": "s4"}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "통합형", "type": "write", "ans": "to having my room lock → to have my room locked", "concept": ["030-H1", "031-3"], "gap": "", "words": [["advise", "충고하다"], ["tour guide", "관광 가이드"], ["lock", "잠그다"], ["locked", "잠긴"]], "h1": "The tour guide advised me to having my room lock. advise(충고하다) 뒤와 have 뒤의 모양을 따로 살펴보세요.", "h2": "to 뒤에는 동사원형이 와요. 또 방은 잠기는 쪽(수동)이라서 lock(잠그다)의 모양도 바뀌어요.", "why": "advise 뒤 to부정사 to have(가지다, 시키다)로 고치고, my room은 잠김을 당하는 쪽이라서 과거분사 locked로 고쳐요.", "opts": [], "pencil": "to 뒤에는 ___, 당하는 쪽에는 과거분사", "pencilKey": "동사원형", "page": 16, "sec": "s4"}, {"id": "S4-05", "step": 4, "no": 5, "qtype": "통합형", "type": "write", "ans": "The news made them surprised. But it didn't sound surprising to me.", "concept": ["030", "068-2"], "gap": "", "words": [["surprise", "놀라게 하다"], ["surprised", "놀란"], ["surprising", "놀라운"], ["sound", "~하게 들리다"]], "h1": "그 소식은 그들을 놀라게 만들었다. 그러나 그것은 내게는 놀랍게 들리지 않았다. 놀라는 사람은 누구이고, 놀라움을 주는 것은 무엇인지 나눠 보세요.", "h2": "느끼는 쪽에는 -ed, 주는 쪽에는 -ing를 써요. 각 문장에서 사람과 소식 중 누가 느끼는 쪽인지 판단하고, sound(~하게 들리다) 뒤에 올 품사를 생각해 보세요.", "why": "made(원형 make 만들다) + them(놀람을 느끼는 사람) + surprised, 그리고 sound(~하게 들리다) + surprising(소식이 놀라운)이에요.", "opts": [], "pencil": "느끼는 쪽은 -ed, 주는 쪽은 ___", "pencilKey": "-ing", "page": 16, "sec": "s4"}, {"id": "S4-06", "step": 4, "no": 6, "qtype": "통합형", "type": "write", "ans": "(1) He[John] kept Jane[her] waiting (for two hours). (2) He[John] made Jane[her] (feel) miserable.", "concept": ["030-H1", "030"], "gap": "", "words": [["keep", "~하게 하다"], ["wait", "기다리다"], ["make", "~하게 만들다"], ["miserable", "비    var labs=d.opts.map(function(o){return o.n});
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[];
   h+='<div class="choices'+(labs.length===2?' two':'')+'">'+labs.map(function(l){return '<button class="ch" style="'+(multi&&sel.indexOf(l)>=0?'background:var(--soft);border-color:var(--a)':'')+'" onclick="'+(multi?'tog':'pick')+'(\''+d.id+'\',\''+l+'\')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+=multi?'<div class="meter">정답이 두 개예요. 모두 누른 뒤 확인을 눌러요</div><button class="btn p" onclick="confirmMulti(\''+d.id+'\')">확인</button>':'<div class="meter">책의 답을 골라 누르면 바로 확인돼요</div>';
  }else{
   h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div>';
   h+='<button class="btn p" onclick="showW(\''+d.id+'\')">정답 확인</button>';
  }
 }else{
  h+=answerView(d,r);
 }
 h+='</div>';
 h+='<div class="nav">'+(st.idx>0?'<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>':'')+'<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button></div>';
 app.innerHTML=h;
}
function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
