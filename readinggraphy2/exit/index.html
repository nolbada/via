<!doctype html>
<html lang="ko" translate="no">
<head>

<title>리딩그라피 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>

<script>
var P=[{"u":1,"id":"rg2-01-1","no":1,"ko":"수달 떼를 만난 산책길, 무슨 일이?","items":[{"n":1,"t":"tf","q":"Steve saw about 20 furry animals near the water while he was walking.","ko":"Steve는 걷고 있는 동안 물 근처에서 털로 덮인 약 스무 마리의 동물들을 보았다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"While he was walking, he saw about 20 furry animals near the water.","그가 걷고 있는 동안, 그는 물 근처에서 털로 덮인 약 스무 마리의 동물들을 보았다."]],"w":"3번 문장에 While he was walking, he saw about 20 furry animals near the water가 그대로 나옴. saw는 see(보다)의 과거형이고, 그 동물들이 수달(4번)이었음.","c":"T"},"h":"0cdba98f75"},{"n":2,"t":"tf","q":"Steve accidentally stepped on an otter while he was jogging.","ko":"Steve는 조깅하는 동안 실수로 수달을 밟았다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Suddenly, a jogger ran by, and he accidentally stepped on an otter.","갑자기, 조깅하는 사람 한 명이 달려 지나갔는데, 그는 수달 한 마리를 실수로 밟았다."]],"w":"6번 문장에서 수달을 실수로 밟은 사람은 지나가던 조깅하는 사람(a jogger)임. Steve는 그때 걷는 중이었고 수달 근처에 가까이 다가가 있었을 뿐. 밟은 사람이 바뀐 진술이라 F.","c":"F"},"h":"f96986ff0c"},{"n":3,"t":"tf","q":"The otters began biting Steve because they thought he was a danger.","ko":"수달들은 Steve를 위험한 존재라고 생각해서 그를 물기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The otters thought Steve was a danger too, so they ran toward him and started biting his ankles and legs.","수달들은 Steve도 위험한 존재라고 생각해서, 그를 향해 달려들었고 그의 발목과 다리를 물기 시작했다."]],"w":"8번 문장에 The otters thought Steve was a danger too, so they ran toward him and started biting…이 있음. thought는 think(생각하다)의 과거형. 위험하다고 생각한 것이 원인, 물기 시작한 것이 결과라 T.","c":"T"},"h":"107ba2e3b6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... a jogger ran by, and he accidentally stepped on an otter.)","ko":"... 조깅하는 사람이 달려 지나갔는데, 그는 수달 한 마리를 (밑줄 친 말) 밟았다.","opts":["일부러","실수로","천천히","조용히"],"word":"accidentally","r":{"a":"2) 실수로","ev":"6번 문장","s":[[6,"Suddenly, a jogger ran by, and he accidentally stepped on an otter.","갑자기, 조깅하는 사람 한 명이 달려 지나갔는데, 그는 수달 한 마리를 실수로 밟았다."]],"w":"6번에서 조깅하던 사람은 수달을 보지 못하고 밟았고, 그래서 7번에서 다른 수달들이 화가 남. accidentally는 일부러가 아니라 '실수로, 우연히'. 일부러라면 반대 뜻.","c":2},"h":"fccca90f47"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... he saw about 20 furry animals near the water.)","ko":"... 그는 물 근처에서 (밑줄 친 말) 약 스무 마리의 동물들을 보았다.","opts":["매끈한","차가운","털로 덮인","작은"],"word":"furry","r":{"a":"3) 털로 덮인","ev":"3~4번 문장","s":[[3,"While he was walking, he saw about 20 furry animals near the water.","그가 걷고 있는 동안, 그는 물 근처에서 털로 덮인 약 스무 마리의 동물들을 보았다."],[4,"They were otters!","그것들은 수달이었다!"]],"w":"3번에서 본 동물이 4번에서 otters(수달)라고 밝혀짐. 수달은 털이 있는 동물이라 furry는 '털로 덮인'. 매끈하다는 털이 없다는 느낌이라 반대 방향.","c":3},"h":"65637a330a"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSteve tried to stop them, but he couldn’t.","ko":"밑줄 친 them이 가리키는 것은?","sko":"Steve는 그것들을 막으려고 했지만, 그럴 수 없었다.","opts":["화가 난 수달들","조깅하는 사람","Steve의 발목","나무에 앉은 새들"],"r":{"a":"1) 화가 난 수달들","ev":"8~9번 문장","s":[[8,"The otters thought Steve was a danger too, so they ran toward him and started biting his ankles and legs.","수달들은 Steve도 위험한 존재라고 생각해서, 그를 향해 달려들었고 그의 발목과 다리를 물기 시작했다."],[9,"Steve tried to stop them, but he couldn’t.","Steve는 그것들을 막으려고 했지만, 그럴 수 없었다."]],"w":"8번에서 수달들이 Steve를 향해 달려들어 발목과 다리를 물기 시작했음. 9번에서 Steve가 막으려고 한 대상 them은 그 수달들. 조깅하는 사람은 6번에서 이미 지나갔음.","c":1},"h":"85bbe21990"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Steve learned a lesson that day: always be careful around wild animals, even if they look cute.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Steve는 그날 교훈을 얻었다: 야생 동물이 귀여워 보일지라도, 야생 동물 주변에서는 항상 조심하라.","opts":["귀여워 보이는 야생 동물은 위험하지 않으니 가까이 가도 된다.","야생 동물을 만나면 귀여워 보여도 무조건 사진부터 찍어야 한다.","귀여운 동물이 아니라 무섭게 생긴 야생 동물만 조심하면 된다.","야생 동물은 귀여워 보여도 위험할 수 있으니 항상 조심해야 한다."],"r":{"a":"4) 야생 동물은 귀여워 보여도 위험할 수 있으니 항상 조심해야 한다.","ev":"12번 문장","s":[[12,"Steve learned a lesson that day: always be careful around wild animals, even if they look cute.","Steve는 그날 교훈을 얻었다: 야생 동물이 귀여워 보일지라도, 야생 동물 주변에서는 항상 조심하라."]],"w":"12번은 콜론(:) 뒤가 교훈. even if they look cute는 '귀여워 보일지라도'. 귀여워도 조심하라는 뜻이라 4번. 1번과 3번은 정반대 생각이고 사진 이야기는 본문에 없음.","c":4},"h":"a6a5ae5a89"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Steve는 서울의 한 공원에서 산책을 했다.","Steve는 수달들로부터 도망치려고 나무에 올라갔다.","Steve가 다가가자 수달들은 곧바로 물속으로 도망쳤다.","Steve는 조깅하는 사람이 돌아올 때까지 나무 위에 있었다."],"opts":["Steve took a walk in a park in Seoul.","Steve climbed a tree to get away from the otters.","The otters swam away as soon as Steve got close.","Steve stayed in the tree until the jogger came back."],"r":{"a":"2) Steve climbed a tree to get away from the otters.","ev":"1번, 5번, 8번, 10~11번 문장","s":[[1,"In a park in Singapore, a man named Steve went for a morning walk.","싱가포르의 한 공원에서, Steve라는 이름의 한 남자가 아침 산책을 하러 갔다."],[5,"He stopped for a moment and got close to look at the cute animals.","그는 잠시 멈추고 그 귀여운 동물들을 보려고 가까이 다가갔다."],[8,"The otters thought Steve was a danger too, so they ran toward him and started biting his ankles and legs.","수달들은 Steve도 위험한 존재라고 생각해서, 그를 향해 달려들었고 그의 발목과 다리를 물기 시작했다."],[10,"At last, Steve climbed a tree to get away from the angry otters.","마침내, Steve는 화가 난 수달들로부터 도망치려고 나무에 올라갔다."],[11,"He stayed there until the otters calmed down and went back to the water.","그는 수달들이 진정하고 물로 돌아갈 때까지 그곳에 머물렀다."]],"w":"10번에서 Steve가 수달들로부터 도망치려고 나무에 올라갔다고 함. 공원은 서울이 아니라 싱가포르(1번). 수달들은 도망치지 않고 오히려 Steve에게 달려들었음(8번). 나무 위에 있던 것은 수달들이 진정할 때까지(11번)이고 조깅하는 사람은 나오지 않음.","c":2},"h":"d6c732aa12"},{"n":9,"t":"sum","q":"The other otters got (A) and (B).","ko":"다른 수달들은 (A) 상태였고, 또 (B) 상태였다.","opts":["(A) angry / (B) scared","(A) happy / (B) scared","(A) angry / (B) sleepy","(A) happy / (B) sleepy","(A) quiet / (B) friendly"],"oko":["(A) 화가 난 / (B) 겁을 먹은","(A) 행복한 / (B) 겁을 먹은","(A) 화가 난 / (B) 졸린","(A) 행복한 / (B) 졸린","(A) 조용한 / (B) 다정한"],"r":{"a":"1) (A) angry / (B) scared ((A) 화가 난 / (B) 겁을 먹은)","ev":"7번 문장","s":[[7,"The other otters got angry and scared.","다른 수달들은 화가 났고 겁을 먹었다."]],"w":"7번에서 다른 수달들이 화가 나고 겁을 먹었음(The other otters got angry and scared). happy·sleepy·quiet·friendly는 본문과 맞지 않음.","c":1},"h":"2e62035326"},{"n":10,"t":"fill","q":"He stayed there until the otters [A] down and [B] back to the water.","ko":"그는 수달들이 [A] 물로 다시 [B] 때까지 그곳에 머물렀다.","bank":["tree","calmed","lesson","went","danger","ankle"],"bko":{"tree":"나무","calmed":"진정했다(calm의 과거)","lesson":"교훈","went":"갔다(go의 과거)","danger":"위험","ankle":"발목"},"r":{"a":"[A] calmed (진정했다(calm의 과거)), [B] went (갔다(go의 과거))","ev":"11번 문장","s":[[11,"He stayed there until the otters calmed down and went back to the water.","그는 수달들이 진정하고 물로 돌아갈 때까지 그곳에 머물렀다."]],"w":"11번에서 Steve는 수달들이 진정하고(calmed down) 물로 돌아갈 때까지(went back to the water) 그곳에 머물렀음. calmed는 calm(진정하다)의 과거형, went는 go(가다)의 과거형. tree·lesson·danger·ankle은 이름을 나타내는 말이라 down 앞이나 back 앞 빈칸에 들어갈 수 없음.","c":null},"h":"699bc9111b"}]},{"u":1,"id":"rg2-01-2","no":2,"ko":"사람들이 순무를 던지는 이상한 축제","items":[{"n":1,"t":"tf","q":"The Jarramplas Festival takes place in Piornal, Spain, every January.","ko":"Jarramplas 축제는 매년 1월에 스페인의 Piornal에서 열린다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Every year on January 19th and 20th, the Jarramplas Festival takes place in Piornal, Spain.","매년 1월 19일과 20일에, 스페인의 Piornal에서는 Jarramplas 축제가 열린다."]],"w":"1번 문장에 매년 1월 19일과 20일에 스페인 Piornal에서 축제가 열린다(takes place)고 나옴. 같은 내용이라 T.","c":"T"},"h":"bc24a5df28"},{"n":2,"t":"tf","q":"The people in town throw turnips at the farmers during the festival.","ko":"마을 사람들은 축제 기간에 농부들에게 순무를 던진다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"During this festival, everyone in town chases and throws turnips at two monsters.","이 축제 기간 동안, 마을의 모든 사람들은 몬스터 두 마리를 쫓아다니며 순무를 던진다."]],"w":"2번 문장에서 마을 사람들이 순무를 던지는 대상은 농부가 아니라 몬스터 두 마리임. 농부가 순무를 던진 것은 옛 이야기 속(10번)이고 그 대상은 도둑. 받는 쪽이 바뀐 진술이라 F.","c":"F"},"h":"b64b346c04"},{"n":3,"t":"tf","q":"The festival is based on a local story about a thief.","ko":"그 축제는 도둑에 관한 현지의 이야기에 바탕을 두고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7~8번 문장","s":[[7,"The festival is based on a local story.","그 축제는 현지의 이야기에 바탕을 두고 있다."],[8,"The monsters act as the thief named el Jarrampla.","몬스터들은 el Jarrampla라는 이름의 도둑 역할을 한다."]],"w":"7번에서 축제가 현지 이야기에 바탕을 둔다고 하고, 8번에서 몬스터가 el Jarrampla라는 도둑 역할을 한다고 함. 그 이야기가 도둑 이야기이므로 T.","c":"T"},"h":"499f8edb46"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They wear costumes decorated with lots of colorful pieces of cloth.)","ko":"그들은 화려한 천 조각들로 (밑줄 친 말) 의상을 입는다.","opts":["찢어진","더러운","장식된","오래된"],"word":"decorated","r":{"a":"3) 장식된","ev":"5번 문장","s":[[5,"They wear costumes decorated with lots of colorful pieces of cloth.","그들은 많은 수의 화려한 천 조각들로 장식된 의상을 입는다."]],"w":"5번에서 의상에 colorful pieces of cloth(화려한 천 조각들)가 붙어 있다는 내용. decorated with는 '~으로 장식된'. 찢어지거나 더럽다는 말은 없음.","c":3},"h":"adaffa2b2c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But people in Piornal think playing el Jarrampla is a big honor.)","ko":"하지만 Piornal 사람들은 el Jarrampla 역할을 하는 것이 큰 (밑줄 친 말)이라고 생각한다.","opts":["걱정","실수","비밀","영광"],"word":"honor","r":{"a":"4) 영광","ev":"12~13번 문장","s":[[12,"But people in Piornal think playing el Jarrampla is a big honor.","하지만 Piornal 사람들은 el Jarrampla 역할을 하는 것이 큰 영광이라고 생각한다."],[13,"So, over 2,000 people are on a waiting list!","그래서, 2,000명이 넘는 사람들이 대기자 명단에 이름을 올려놓았다!"]],"w":"12번의 But 뒤는 11번의 멍(bruises)과 반대로 좋은 점을 말함. 그래서 13번처럼 2,000명이 넘게 대기자 명단에 오름. honor는 영광. 걱정이나 실수라면 사람들이 줄 서지 않을 것.","c":4},"h":"8d41159f03"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nUnderneath these costumes, they wear special protection to avoid getting hurt.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이 의상 안에, 그들은 다치지 않기 위해 특별한 보호 장치를 착용한다.","pron":"they","opts":["의상을 입은 두 사람","순무를 던지는 마을 사람들","도둑에게 동물을 잃은 농부들","축제를 구경하러 온 관광객들"],"r":{"a":"1) 의상을 입은 두 사람","ev":"6번 문장","s":[[6,"Underneath these costumes, they wear special protection to avoid getting hurt.","이 의상 안에, 그들은 다치지 않기 위해 특별한 보호 장치를 착용한다."]],"w":"6번의 these costumes(이 의상들) 안에 입는 것이므로 they는 의상을 입은 사람들. 순무를 던지는 쪽이 아니라 순무를 맞는 쪽이 다치지 않으려고 보호 장치를 착용함.","c":1,"k":"they = 의상을 입은 두 사람"},"h":"930099de5a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The two monsters might have a few bruises in the end.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"두 몬스터는 결국 멍이 좀 들지도 모른다.","opts":["축제가 끝날 때쯤 두 몬스터의 몸에 멍이 조금 생길 수도 있다.","두 몬스터는 축제가 끝나면 큰 상을 받는다.","두 몬스터는 절대로 다치지 않는다.","두 몬스터는 축제 중에 지쳐서 쓰러진다."],"r":{"a":"1) 축제가 끝날 때쯤 두 몬스터의 몸에 멍이 조금 생길 수도 있다.","ev":"11번 문장","s":[[11,"The two monsters might have a few bruises in the end.","두 몬스터는 결국 멍이 좀 들지도 모른다."]],"w":"11번의 a few bruises(약간의 멍)는 크게 다치는 것이 아니라 가벼운 멍이 들 수 있다는 뜻. might는 ~일지도 모른다는 약한 추측. 상을 받는다·쓰러진다는 내용은 본문에 없고, 절대로 다치지 않는다는 might have bruises와 반대.","c":1},"h":"349ab43e73"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["두 몬스터는 다른 나라에서 온 사람들이 맡는다.","몬스터들은 따뜻하게 지내려고 특별한 옷을 입는다.","이야기 속에서 농부들이 도둑에게 동물을 주었다.","2,000명이 넘는 사람들이 몬스터 역할을 하려고 대기하고 있다."],"opts":["The two monsters are played by people from other countries.","The monsters wear special clothes to stay warm.","In the story, the farmers gave animals to the thief.","More than 2,000 people are waiting to play the monster."],"r":{"a":"4) More than 2,000 people are waiting to play the monster. (2,000명이 넘는 사람들이 몬스터 역할을 하려고 대기하고 있다.)","ev":"4번, 6번, 9번, 12~13번 문장","s":[[4,"Two people from the village act as the monsters.","마을의 두 사람이 몬스터 역할을 한다."],[6,"Underneath these costumes, they wear special protection to avoid getting hurt.","이 의상 안에, 그들은 다치지 않기 위해 특별한 보호 장치를 착용한다."],[9,"In the story, the thief stole animals from the farmers.","그 이야기에서, 도둑은 농부들에게서 동물을 훔쳤다."],[12,"But people in Piornal think playing el Jarrampla is a big honor.","하지만 Piornal 사람들은 el Jarrampla 역할을 하는 것이 큰 영광이라고 생각한다."],[13,"So, over 2,000 people are on a waiting list!","그래서, 2,000명이 넘는 사람들이 대기자 명단에 이름을 올려놓았다!"]],"w":"13번에서 2,000명이 넘는 사람이 대기자 명단에 있음. 몬스터는 마을 사람(4번)이고, 보호 장치는 다치지 않으려는 것(6번), 동물을 훔친 쪽은 농부가 아니라 도둑(9번)이라 나머지는 본문과 다름.","c":4},"h":"cfa3f2150c"},{"n":9,"t":"sum","q":"In the local story, the thief (A) animals from the farmers, and the farmers wanted to (B) him away.","ko":"현지 이야기에서 도둑은 농부들에게서 동물을 (A), 농부들은 그를 멀리 (B) 싶어 했다.","opts":["(A) stole / (B) chase","(A) stole / (B) welcome","(A) bought / (B) chase","(A) sold / (B) welcome","(A) fed / (B) chase"],"oko":["(A) 훔쳤다 / (B) 쫓아내고","(A) 훔쳤다 / (B) 환영하고","(A) 샀다 / (B) 쫓아내고","(A) 팔았다 / (B) 환영하고","(A) 먹였다 / (B) 쫓아내고"],"r":{"a":"1) (A) stole / (B) chase ((A) 훔쳤다 / (B) 쫓아내고)","ev":"9~10번 문장","s":[[9,"In the story, the thief stole animals from the farmers.","그 이야기에서, 도둑은 농부들에게서 동물을 훔쳤다."],[10,"To chase him away, the farmers threw turnips at him.","그를 쫓아내기 위해, 농부들은 그에게 순무를 던졌다."]],"w":"9번에서 도둑은 농부들에게서 동물을 훔쳤음(stole은 steal의 과거형). 10번에서 농부들은 그를 쫓아내기 위해(To chase him away) 순무를 던졌음. bought·sold·fed는 훔쳤다는 내용과 다르고, welcome(환영하다)은 쫓아냈다는 내용과 반대.","c":1},"h":"8d47c7634b"},{"n":10,"t":"fill","q":"Two people from the [A] [B] as the monsters.","ko":"[A]에서 온 두 사람이 몬스터를 [B].","bank":["village","quickly","act","very","too","also"],"bko":{"village":"마을","quickly":"빠르게","act":"연기한다","very":"매우","too":"너무","also":"또한"},"r":{"a":"[A] village (마을), [B] act (연기한다)","ev":"4번 문장","s":[[4,"Two people from the village act as the monsters.","마을의 두 사람이 몬스터 역할을 한다."]],"w":"4번에서 마을의 두 사람이 몬스터 역할을 함(Two people from the village act as the monsters). act는 연기하다. quickly·very·too·also는 부사라 장소를 나타내는 [A] 자리와 동사 자리 모두에 맞지 않음.","c":null},"h":"34c892cd06"}]},{"u":1,"id":"rg2-01-3","no":3,"ko":"눈만으로 연주하는 하프?","items":[{"n":1,"t":"tf","q":"Zacharias is a musician and computer scientist.","ko":"Zacharias는 음악가이자 컴퓨터 과학자이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Zacharias is a musician and computer scientist.","Zacharias는 음악가이자 컴퓨터 과학자이다."]],"w":"3번 문장에 Zacharias is a musician and computer scientist가 그대로 나옴. 같은 내용이라 T.","c":"T"},"h":"a15335341f"},{"n":2,"t":"tf","q":"Zacharias’s friend couldn’t move his legs because of a motorcycle accident.","ko":"Zacharias의 친구는 오토바이 사고 때문에 다리를 움직일 수 없었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"His friend wasn’t able to move his arms because of his injuries.","그의 친구는 부상 때문에 팔을 움직일 수 없었다."]],"w":"5번 문장에서 친구가 움직일 수 없었던 것은 다리가 아니라 팔(arms)임. 신체 부위를 바꾼 진술이라 F.","c":"F"},"h":"572072e068"},{"n":3,"t":"tf","q":"EyeHarp follows your eyes and plays the sound of the color you look at.","ko":"EyeHarp는 여러분의 눈을 따라가서 여러분이 보는 색의 소리를 연주한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Then, when you look at a specific color, the program follows your eyes and plays the right sound for you!","그다음, 여러분이 특정한 색을 볼 때, 그 프로그램은 여러분의 눈을 따라가서 알맞은 소리를 연주해 준다!"]],"w":"8번 문장에서 특정한 색을 보면 프로그램이 눈을 따라가서 알맞은 소리를 연주해 준다고 함. 같은 내용이라 T.","c":"T"},"h":"bcfad1be2d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... when you look at a specific color, the program follows your eyes ...)","ko":"... 여러분이 (밑줄 친 말) 색을 볼 때, 그 프로그램은 여러분의 눈을 따라간다 ...","opts":["흐릿한","화려한","특정한","평범한"],"word":"specific","r":{"a":"3) 특정한","ev":"8번 문장","s":[[8,"Then, when you look at a specific color, the program follows your eyes and plays the right sound for you!","그다음, 여러분이 특정한 색을 볼 때, 그 프로그램은 여러분의 눈을 따라가서 알맞은 소리를 연주해 준다!"]],"w":"8번에서 아무 색이나가 아니라 어떤 한 가지 색을 보면 그 색에 맞는 소리가 남. specific은 '특정한'. 화려한이나 평범한은 색의 종류가 정해졌다는 뜻이 아님.","c":3},"h":"d6693c1405"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (His friend wasn’t able to move his arms because of his injuries.)","ko":"그의 친구는 (밑줄 친 말) 때문에 팔을 움직일 수 없었다.","opts":["공연","부상","기억","소음"],"word":"injuries","r":{"a":"2) 부상","ev":"4~5번 문장","s":[[4,"In 2010, his musician friend had a bad motorcycle accident.","2010년에, 그의 음악가 친구가 심각한 오토바이 사고를 당했다."],[5,"His friend wasn’t able to move his arms because of his injuries.","그의 친구는 부상 때문에 팔을 움직일 수 없었다."]],"w":"4번에서 친구가 심각한 오토바이 사고를 당했고, 5번에서 그 때문에 팔을 움직일 수 없었음. 그러니 injuries는 사고로 생긴 '부상'. 공연이나 소음으로는 팔을 못 움직이는 이유가 되지 않음.","c":2},"h":"77dfdfa787"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nSo, Zacharias decided to create EyeHarp for him.","ko":"밑줄 친 him이 가리키는 것은?","sko":"그래서, Zacharias는 그를 위해 EyeHarp를 만들기로 결심했다.","pron":"him","opts":["Zacharias","Zacharias의 친구","EyeHarp","컴퓨터 과학자"],"r":{"a":"2) Zacharias의 친구","ev":"5~6번 문장","s":[[5,"His friend wasn’t able to move his arms because of his injuries.","그의 친구는 부상 때문에 팔을 움직일 수 없었다."],[6,"So, Zacharias decided to create EyeHarp for him.","그래서, Zacharias는 그를 위해 EyeHarp를 만들기로 결심했다."]],"w":"6번에서 Zacharias가 만든 것이므로 for him의 him은 Zacharias 자신이 아닌 다른 사람. 5번에서 팔을 움직일 수 없었던 Zacharias의 친구가 him.","c":2,"k":"him = Zacharias의 친구"},"h":"6719a78a97"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It takes time and practice to play music well.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"음악을 잘 연주하려면 시간과 연습이 필요하다.","opts":["음악을 잘 연주하려면 시간과 연습이 필요하다.","음악을 잘 연주하려면 값비싼 악기가 필요하다.","음악은 연습하지 않아도 금방 잘 연주할 수 있다.","음악 연주는 시간이 오래 걸려서 아무도 연습하지 않는다."],"r":{"a":"1) 음악을 잘 연주하려면 시간과 연습이 필요하다.","ev":"9~10번 문장","s":[[9,"EyeHarp is just like other instruments.","EyeHarp는 다른 악기들과 똑같다."],[10,"It takes time and practice to play music well.","음악을 잘 연주하려면 시간과 연습이 필요하다."]],"w":"10번 It takes time and practice to play music well은 '잘 연주하려면 시간과 연습이 든다'. 9번에서 EyeHarp도 다른 악기와 똑같다고 했으니 같은 이야기. 악기 값이나 연습이 필요 없다는 말은 없음.","c":1},"h":"3227ae89f7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Zacharias is not a musician but a computer scientist.","EyeHarp can be played only with the hands.","EyeHarp is a software program.","Only people who can move their bodies well can use EyeHarp."],"oko":["Zacharias는 음악가가 아니라 컴퓨터 과학자이다.","EyeHarp는 손으로만 연주할 수 있다.","EyeHarp는 소프트웨어 프로그램이다.","몸을 잘 움직이는 사람만 EyeHarp를 쓸 수 있다."],"r":{"a":"3) EyeHarp is a software program. (EyeHarp는 소프트웨어 프로그램이다.)","ev":"2번, 3번, 12번 문장","s":[[2,"Thanks to the software program, EyeHarp, this is now possible.","EyeHarp라는 소프트웨어 프로그램 덕분에, 이제 이것이 가능하다."],[3,"Zacharias is a musician and computer scientist.","Zacharias는 음악가이자 컴퓨터 과학자이다."],[12,"It doesn’t matter even if they can’t move their bodies well.","그들이 몸을 잘 움직이지 못하더라도 문제가 되지 않는다."]],"w":"2번에서 EyeHarp는 소프트웨어 프로그램(the software program, EyeHarp)이라고 함. Zacharias는 음악가이자 컴퓨터 과학자(3번), EyeHarp는 눈으로 연주하는 프로그램(1~2번)이며, 몸을 잘 움직이지 못해도 상관없음(12번).","c":3},"h":"f7a79b86f7"},{"n":9,"t":"sum","q":"This (A) software can bring the (B) of music to everyone.","ko":"이 (A) 소프트웨어는 모든 사람에게 음악의 (B)을(를) 가져다줄 수 있다.","opts":["(A) amazing / (B) joy","(A) amazing / (B) fear","(A) dangerous / (B) joy","(A) boring / (B) fear","(A) dangerous / (B) cost"],"oko":["(A) 놀라운 / (B) 즐거움","(A) 놀라운 / (B) 두려움","(A) 위험한 / (B) 즐거움","(A) 지루한 / (B) 두려움","(A) 위험한 / (B) 비용"],"r":{"a":"1) (A) amazing / (B) joy ((A) 놀라운 / (B) 즐거움)","ev":"11번 문장","s":[[11,"However, this amazing software can bring the joy of music to everyone.","하지만, 이 놀라운 소프트웨어는 모든 사람에게 음악의 즐거움을 가져다줄 수 있다."]],"w":"11번에서 this amazing software(이 놀라운 소프트웨어)가 모든 사람에게 음악의 즐거움(the joy of music)을 가져다줄 수 있다고 함. dangerous·boring은 amazing과 반대이고, fear·cost는 즐거움이 아님.","c":1},"h":"8fd0217d74"},{"n":10,"t":"fill","q":"Here is how EyeHarp works: First, it shows a colorful [A] with music [B] on your computer screen.","ko":"EyeHarp의 작동법은 다음과 같다: 먼저, 그것은 여러분의 컴퓨터 화면에 음악 [B]이(가) 있는 다채로운 [A]을(를) 보여 준다.","bank":["circle","hands","scales","quiet","moved","possible"],"bko":{"circle":"원","hands":"손","scales":"음계(scale의 복수)","quiet":"조용한","moved":"움직였다","possible":"가능한"},"r":{"a":"[A] circle (원), [B] scales (음계(scale의 복수))","ev":"7번 문장","s":[[7,"Here is how EyeHarp works: First, it shows a colorful circle with music scales on your computer screen.","EyeHarp의 작동법은 다음과 같다: 먼저, 그것은 여러분의 컴퓨터 화면에 음계가 있는 다채로운 원을 보여 준다."]],"w":"7번에서 EyeHarp는 화면에 음계가 있는 다채로운 원을 보여 줌(a colorful circle with music scales). a colorful 뒤에는 단수 명사 circle이 오고, music 뒤에는 scales(scale의 복수형, 음계). hands는 복수형이라 a colorful 뒤에 올 수 없고, quiet·moved·possible은 이름을 나타내는 말이 아니라 빈칸에 맞지 않음.","c":null},"h":"967ebbaff4"}]},{"u":2,"id":"rg2-02-1","no":1,"ko":"아침 식탁의 와플이 신발을 바꿨다고?","items":[{"n":1,"t":"tf","q":"Bill Bowerman was a running coach at a college in the U.S.","ko":"Bill Bowerman은 미국의 한 대학교의 달리기 코치였다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Bill Bowerman was a running coach at a college in the U.S.","Bill Bowerman은 미국에 있는 한 대학교의 달리기 코치였다."]],"w":"1번 문장에 Bill Bowerman was a running coach at a college in the U.S.가 그대로 나옴. 같은 내용이라 T.","c":"T"},"h":"90410df253"},{"n":2,"t":"tf","q":"Phil Knight was a very fast runner.","ko":"Phil Knight는 매우 빠른 달리기 선수였다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Phil wasn’t a fast runner.","Phil은 달리기가 빠르지 않았다."]],"w":"5번 문장에서 Phil wasn’t a fast runner(빠른 선수가 아니었다)라고 함. 그래서 6번에서 신발이 그를 더 빠르게 도와줘야 했음. 반대로 말한 진술이라 F.","c":"F"},"h":"86696891f5"},{"n":3,"t":"tf","q":"Bill got the idea for a new shoe bottom from his wife’s waffle iron.","ko":"Bill은 아내의 와플 팬에서 새 신발 밑창에 대한 아이디어를 얻었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7~9번 문장","s":[[7,"One day, while Bill was having breakfast, he noticed his wife’s waffle iron.","어느 날, Bill이 아침을 먹는 중에 그는 아내의 와플 팬을 발견했다."],[8,"The iron had a special pattern.","그 팬은 특별한 무늬를 가지고 있었다."],[9,"It gave him a great idea!","그것은 그에게 좋은 아이디어를 주었다!"]],"w":"7번에서 아내의 와플 팬을 발견했고, 8번에서 그 팬의 특별한 무늬를 말하고, 9번에서 그것이 좋은 아이디어를 줬다고 함. 아이디어의 내용은 10번의 와플 모양 밑창이라 T.","c":"T"},"h":"b1e70ccf78"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... make small changes to improve them.)","ko":"... 그것을 (밑줄 친 말) 위해 작은 변화를 주다.","opts":["개선하다","부수다","빌리다","잊다"],"word":"improve","r":{"a":"1) 개선하다","ev":"2~3번 문장","s":[[2,"He always wanted to make better shoes for running.","그는 항상 달리기에 좋은 신발을 만들고 싶어 했다."],[3,"So he used to take apart shoes and make small changes to improve them.","그래서 그는 신발을 개선하기 위해 그것을 분해하거나 작은 변화를 주곤 했다."]],"w":"2번에서 Bill은 더 좋은 신발을 만들고 싶어 했고, 3번에서 신발을 분해하고 작은 변화를 줌. 목적이 improve이므로 '더 좋게 만들다 = 개선하다'. 부수는 것이 목적일 수는 없음.","c":1},"h":"eef9181455"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... he noticed his wife’s waffle iron.)","ko":"... 그는 아내의 와플 팬을 (밑줄 친 말).","opts":["잃어버렸다","알아차렸다","빌려줬다","씻었다"],"word":"noticed","r":{"a":"2) 알아차렸다","ev":"7~9번 문장","s":[[7,"One day, while Bill was having breakfast, he noticed his wife’s waffle iron.","어느 날, Bill이 아침을 먹는 중에 그는 아내의 와플 팬을 발견했다."],[8,"The iron had a special pattern.","그 팬은 특별한 무늬를 가지고 있었다."],[9,"It gave him a great idea!","그것은 그에게 좋은 아이디어를 주었다!"]],"w":"7번에서 아침을 먹다가 와플 팬이 눈에 들어왔고 8~9번에서 팬의 무늬가 좋은 아이디어를 줌. 그래서 noticed는 '알아차렸다, 눈에 띄었다'. 잃어버리거나 빌려줬다면 아이디어가 떠오르지 않았을 것.","c":2},"h":"6df760e755"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSo if any shoes could help him run faster, they were considered good ones.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그래서 어떤 신발이라도 그를 더 빨리 달리도록 도울 수 있다면, 그것은 좋은 신발로 여겨졌다.","pron":"they","opts":["어떤 신발들","달리기 선수들","Bill과 Phil","대학교 코치들"],"r":{"a":"1) 어떤 신발들","ev":"6번 문장","s":[[6,"So if any shoes could help him run faster, they were considered good ones.","그래서 어떤 신발이라도 그를 더 빨리 달리도록 도울 수 있다면, 그것은 좋은 신발로 여겨졌다."]],"w":"6번에서 if any shoes could help him run faster(어떤 신발이든 그를 더 빨리 달리게 도와준다면)라고 했고, 그런 신발이 good ones(좋은 신발)로 여겨졌음. they = shoes.","c":1,"k":"they = 어떤 신발들"},"h":"ed4de08cec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"At first, it didn’t work well, but he kept trying and finally succeeded.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"처음에는 잘되지 않았지만, 그는 계속 시도했고 마침내 성공했다.","opts":["처음에는 잘 안 됐지만 포기하지 않고 계속 시도해서 마침내 성공했다.","처음부터 잘 되어서 곧바로 다른 일을 시작했다.","잘 안 되자 바로 포기하고 와플 팬을 버렸다.","처음에는 성공했지만 나중에는 계속 실패했다."],"r":{"a":"1) 처음에는 잘 안 됐지만 포기하지 않고 계속 시도해서 마침내 성공했다.","ev":"11번 문장","s":[[11,"At first, it didn’t work well, but he kept trying and finally succeeded.","처음에는 잘되지 않았지만, 그는 계속 시도했고 마침내 성공했다."]],"w":"11번의 At first, it didn’t work well(처음에는 잘 안 됐다), but he kept trying and finally succeeded(계속 시도해서 마침내 성공했다). kept는 keep의 과거형이고 succeeded는 succeed(성공하다)의 과거형.","c":1},"h":"7b511f58ad"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Bill은 신발 회사에서 일했다.","Bill은 아내의 와플 팬을 보고 와플 모양 신발을 만들었지만 처음부터 잘 되었다.","Bill은 와플 신발 이후 다른 신발 만들기를 멈췄다.","Phil Knight는 Bill이 신발 아이디어를 시험하는 것을 함께했다."],"opts":["Bill worked at a shoe company.","Bill made waffle shoes from his wife’s waffle iron, and they worked well from the start.","Bill stopped making shoes after the waffle shoes.","Phil Knight tested shoe ideas with Bill."],"r":{"a":"4) Phil Knight tested shoe ideas with Bill.","ev":"1번, 4번, 10~11번 문장","s":[[1,"Bill Bowerman was a running coach at a college in the U.S.","Bill Bowerman은 미국에 있는 한 대학교의 달리기 코치였다."],[4,"He often tested his new shoe ideas with his friend, Phil Knight.","그는 종종 자신의 친구인 Phil Knight와 함께 자신의 신발에 대한 새로운 아이디어를 실험했다."],[10,"He decided to make a shoe bottom that looked like a waffle.","그는 와플처럼 생긴 신발 밑창을 만들기로 결심했다."],[11,"At first, it didn’t work well, but he kept trying and finally succeeded.","처음에는 잘되지 않았지만, 그는 계속 시도했고 마침내 성공했다."]],"w":"4번에서 Bill이 새 신발 아이디어를 친구 Phil과 시험했다고 함. Bill은 신발 회사가 아니라 대학의 코치(1번)였고, 와플 신발은 처음에는 잘 되지 않았다가(11번) 성공했으며, 신발 만들기를 멈췄다는 말은 없음.","c":4},"h":"1dd29ef2ec"},{"n":9,"t":"sum","q":"Bill always (A) to make (B) shoes for running.","ko":"Bill은 항상 달리기에 (B) 신발을 만드는 것을 (A).","opts":["(A) wanted / (B) better","(A) wanted / (B) worse","(A) forgot / (B) better","(A) forgot / (B) worse","(A) hated / (B) slower"],"oko":["(A) 원했다 / (B) 더 좋은","(A) 원했다 / (B) 더 나쁜","(A) 잊었다 / (B) 더 좋은","(A) 잊었다 / (B) 더 나쁜","(A) 싫어했다 / (B) 더 느린"],"r":{"a":"1) (A) wanted / (B) better ((A) 원했다 / (B) 더 좋은)","ev":"2번 문장","s":[[2,"He always wanted to make better shoes for running.","그는 항상 달리기에 좋은 신발을 만들고 싶어 했다."]],"w":"2번에서 Bill은 항상 달리기에 더 좋은 신발을 만들고 싶어 했음(He always wanted to make better shoes for running). wanted는 want(원하다)의 과거형. forgot·hated나 worse·slower는 본문과 맞지 않음.","c":1},"h":"4e9cea39c1"},{"n":10,"t":"fill","q":"Even [A], many shoes [B] this design.","ko":"[A]에도, 많은 신발이 이 디자인을 [B].","bank":["coach","today","pattern","use","bottom","college"],"bko":{"coach":"코치","today":"오늘날","pattern":"무늬","use":"사용한다","bottom":"밑창","college":"대학교"},"r":{"a":"[A] today (오늘날), [B] use (사용한다)","ev":"13번 문장","s":[[13,"Even today, many shoes use this design.","오늘날에도, 많은 신발이 이 디자인을 사용한다."]],"w":"13번에서 오늘날에도 많은 신발이 이 디자인을 사용함(Even today, many shoes use this design). today는 오늘날, use는 사용하다. coach·pattern·bottom·college는 이름을 나타내는 말이라 동사 자리에 올 수 없음.","c":null},"h":"9f82bab2de"}]},{"u":2,"id":"rg2-02-2","no":2,"ko":"'친환경'이라는 말, 그대로 믿어도 될까?","items":[{"n":1,"t":"tf","q":"Greenwashing means that companies pretend to be eco-friendly to sell more products.","ko":"greenwashing은 기업들이 더 많은 제품을 팔기 위해 친환경적인 척하는 것을 뜻한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"We use this word when companies pretend to be eco-friendly to sell more products.","우리는 기업들이 더 많은 제품을 팔기 위해 친환경적인 척할 때 이 단어를 사용한다."]],"w":"3번 문장에 We use this word when companies pretend to be eco-friendly to sell more products가 있음. 같은 내용이라 T.","c":"T"},"h":"31bccf2ece"},{"n":2,"t":"tf","q":"A car company always tells the truth when it says its cars don’t pollute much.","ko":"자동차 회사가 자기 차가 오염을 많이 일으키지 않는다고 말하면 그것은 항상 사실이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"For example, a car company might say that their cars don’t pollute much, but it may not be true.","예를 들어, 한 자동차 회사는 그들의 차가 오염을 많이 일으키지 않는다고 말할지도 모르지만, 그것은 사실이 아닐지도 모른다."]],"w":"4번에서 자동차 회사가 차가 오염을 많이 일으키지 않는다고 말해도 it may not be true(사실이 아닐지도 모른다)라고 함. always(항상)와 반대라 F.","c":"F"},"h":"43153c9c31"},{"n":3,"t":"tf","q":"Looking at product labels can help you check if a product is good for the Earth.","ko":"제품 라벨을 보면 그 제품이 지구에 좋은지 확인하는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8~9번 문장","s":[[8,"Look at the labels or read the product descriptions.","라벨을 보거나 제품의 설명서를 읽어 보라."],[9,"This will help you see if a product is really good for the Earth.","이것은 제품이 정말로 지구에 좋은지 확인하는 데 도움이 될 것이다."]],"w":"8번에서 라벨을 보거나 설명서를 읽으라고 하고, 9번에서 This will help you see if a product is really good for the Earth라고 함. 라벨 보기가 확인에 도움이 되니 T.","c":"T"},"h":"e046c613dd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (We use this word when companies pretend to be eco-friendly...)","ko":"우리는 기업들이 친환경적인 (밑줄 친 말) 때 이 단어를 사용한다 ...","opts":["~인 척하다","~을 숨기다","~을 사다","~을 잊다"],"word":"pretend","r":{"a":"1) ~인 척하다","ev":"3~4번 문장","s":[[3,"We use this word when companies pretend to be eco-friendly to sell more products.","우리는 기업들이 더 많은 제품을 팔기 위해 친환경적인 척할 때 이 단어를 사용한다."],[4,"For example, a car company might say that their cars don’t pollute much, but it may not be true.","예를 들어, 한 자동차 회사는 그들의 차가 오염을 많이 일으키지 않는다고 말할지도 모르지만, 그것은 사실이 아닐지도 모른다."]],"w":"3번에서 회사들이 실제와 달리 친환경적인 모습을 보이려는 것이 greenwashing. 4번에서도 차가 오염을 안 일으킨다는 말이 사실이 아닐 수 있다고 함. 그래서 pretend to be는 '~인 척하다'.","c":1},"h":"a4da9fd1fc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You can also research the company online.)","ko":"여러분은 또한 온라인으로 그 회사를 (밑줄 친 말) 수 있다.","opts":["광고하다","조사하다","비난하다","만들다"],"word":"research","r":{"a":"2) 조사하다","ev":"7번, 10번 문장","s":[[7,"But there are ways to find out.","하지만 알아낼 방법들이 있다."],[10,"You can also research the company online.","여러분은 또한 온라인으로 그 회사를 조사해 볼 수 있다."]],"w":"7번 알아낼 방법들이 있다고 한 뒤, 8번과 10번에서 구체적인 방법을 말함. 10번의 research the company online은 회사에 대해 알아보는 것이라 '조사하다'. 광고하거나 만드는 것은 확인 방법이 아님.","c":2},"h":"6bb194a31e"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt may sound like a nice word, but it’s actually not.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 좋은 단어처럼 들릴지도 모르지만, 실제로는 그렇지 않다.","pron":"It","opts":["greenwashing이라는 단어","친환경 제품","자동차 회사","제품의 라벨"],"r":{"a":"1) greenwashing이라는 단어","ev":"1~2번 문장","s":[[1,"Do you know the word “greenwashing”?","여러분은 ‘greenwashing’이라는 단어를 알고 있나요?"],[2,"It may sound like a nice word, but it’s actually not.","그것은 좋은 단어처럼 들릴지도 모르지만, 실제로는 그렇지 않다."]],"w":"2번에서 It은 a nice word(좋은 단어)처럼 들린다고 했으니 단어를 가리킴. 1번에서 물어본 단어 greenwashing이 바로 그 단어.","c":1,"k":"It = greenwashing이라는 단어"},"h":"d92a0cbcb7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It can be hard to tell if a company is really helping the environment or not.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어떤 회사가 정말로 환경을 돕고 있는지 아닌지 구별하기는 어려울 수 있다.","opts":["회사가 환경을 돕는지 알 수 있는 방법은 전혀 없다.","환경을 돕는 회사는 대부분 광고를 하지 않는다.","회사가 정말 환경을 돕고 있는지 아닌지 구별하기 어려울 수 있다.","환경을 돕는 일은 어려워서 회사들은 하지 않는다."],"r":{"a":"3) 회사가 정말 환경을 돕고 있는지 아닌지 구별하기 어려울 수 있다.","ev":"6~7번 문장","s":[[6,"It can be hard to tell if a company is really helping the environment or not.","어떤 회사가 정말로 환경을 돕고 있는지 아닌지 구별하기는 어려울 수 있다."],[7,"But there are ways to find out.","하지만 알아낼 방법들이 있다."]],"w":"6번 It can be hard to tell if a company is really helping the environment or not은 '정말 환경을 돕는지 구별하기 어려울 수 있다'. 바로 뒤 7번에서 But there are ways to find out이라고 하므로 방법이 전혀 없다는 1번은 틀림.","c":3},"h":"92e037740d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Greenwashing means a good action that helps the Earth.","Fashion companies’ clothes may not always be good for the Earth.","We cannot find labels on products to check if a company is eco-friendly.","Only fashion companies pretend to be eco-friendly."],"oko":["greenwashing은 지구에 도움이 되는 좋은 행동을 뜻한다.","패션 회사의 옷이 항상 지구에 좋은 것은 아닐 수 있다.","회사가 친환경적인지 알려면 제품에서 라벨을 찾을 수 없다.","패션 회사만 친환경적인 척한다."],"r":{"a":"2) Fashion companies’ clothes may not always be good for the Earth. (패션 회사의 옷이 항상 지구에 좋은 것은 아닐 수 있다.)","ev":"3번, 4번, 5번, 8번 문장","s":[[3,"We use this word when companies pretend to be eco-friendly to sell more products.","우리는 기업들이 더 많은 제품을 팔기 위해 친환경적인 척할 때 이 단어를 사용한다."],[4,"For example, a car company might say that their cars don’t pollute much, but it may not be true.","예를 들어, 한 자동차 회사는 그들의 차가 오염을 많이 일으키지 않는다고 말할지도 모르지만, 그것은 사실이 아닐지도 모른다."],[5,"Similarly, fashion companies might say their clothes are good for the Earth, but they’re not always.","마찬가지로, 패션 회사들이 그들의 옷이 지구에 좋다고 말할지도 모르지만, 항상 그렇지는 않다."],[8,"Look at the labels or read the product descriptions.","라벨을 보거나 제품의 설명서를 읽어 보라."]],"w":"5번에서 패션 회사들의 옷이 항상 지구에 좋은 것은 아니라고 함(they’re not always). greenwashing은 친환경인 척하는 것이지 좋은 행동이 아님(3번). 라벨을 보면 확인에 도움이 됨(8번). 자동차 회사도 비슷한 말을 하므로 패션 회사만 그런 것은 아님(4번).","c":2},"h":"29f35fcd65"},{"n":9,"t":"sum","q":"It is (A) to (B) things that are actually good for the environment.","ko":"환경에 실제로 좋은 것을 (B) 것이 (A).","opts":["(A) important / (B) choose","(A) important / (B) pollute","(A) useless / (B) choose","(A) useless / (B) pollute","(A) easy / (B) ignore"],"oko":["(A) 중요하다 / (B) 선택하는","(A) 중요하다 / (B) 오염시키는","(A) 쓸모없다 / (B) 선택하는","(A) 쓸모없다 / (B) 오염시키는","(A) 쉽다 / (B) 무시하는"],"r":{"a":"1) (A) important / (B) choose ((A) 중요하다 / (B) 선택하는)","ev":"12번 문장","s":[[12,"It’s important to choose things that are actually good for the environment.","환경에 실제로 좋은 것을 선택하는 것이 중요하다."]],"w":"12번에서 환경에 실제로 좋은 것을 선택하는 것이 중요하다고 함(It’s important to choose things that are actually good for the environment). 쓸모없다·쉽다나 pollute(오염시키다)·ignore(무시하다)는 본문과 맞지 않음.","c":1},"h":"b978b0087a"},{"n":10,"t":"fill","q":"Don’t [A]: We need to be [B] shoppers.","ko":"[A] 마라: 우리는 [B] 쇼핑객이 되어야 한다.","bank":["forget","smart","label","Earth","because","through"],"bko":{"forget":"잊다","smart":"현명한","label":"라벨","Earth":"지구","because":"~ 때문에","through":"~을 통해"},"r":{"a":"[A] forget (잊다), [B] smart (현명한)","ev":"11번 문장","s":[[11,"Don’t forget: We need to be smart shoppers.","잊지 마라: 우리는 현명한 쇼핑객이 되어야 한다."]],"w":"11번에서 잊지 마라(Don’t forget), 우리는 현명한 쇼핑객이 되어야 한다(smart shoppers)고 함. forget은 잊다, smart는 현명한. label·Earth는 이름을 나타내는 말이고 because·through는 연결해 주는 말이라 두 빈칸 모두에 맞지 않음.","c":null},"h":"a5df76fc6d"}]},{"u":2,"id":"rg2-02-3","no":3,"ko":"도로 공사에 쓰이는 뜻밖의 재료","items":[{"n":1,"t":"tf","q":"People in Wales started using recycled diapers to fix the roads.","ko":"웨일스 사람들은 도로를 고치는 데 재활용된 기저귀를 사용하기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"To help with this problem, people started using recycled diapers to fix the roads in Wales.","이 문제를 돕기 위해, 사람들은 웨일스의 도로를 보수하는 데 재활용된 기저귀를 사용하기 시작했습니다."]],"w":"5번 문장에서 people started using recycled diapers to fix the roads in Wales라고 함. 같은 내용이라 T.","c":"T"},"h":"a581ed5c6a"},{"n":2,"t":"tf","q":"The diapers are added to bitumen first, and then they are cut into small pieces.","ko":"기저귀는 먼저 역청에 더해지고, 그다음 작은 조각으로 잘린다.","r":{"a":"F (본문과 다른 내용)","ev":"8번, 10번 문장","s":[[8,"First, the diapers are cut into small pieces and washed.","먼저, 기저귀는 작은 조각들로 잘려지고 세척됩니다."],[10,"Finally, these pieces are added to a sticky material called bitumen.","마침내, 이 조각들은 역청이라고 불리는 끈적거리는 물질에 더해집니다."]],"w":"8번에서 먼저 작은 조각으로 자르고 씻고(First), 10번 Finally(마지막으로)에서 역청에 더함. 순서가 거꾸로 된 진술이라 F.","c":"F"},"h":"55116b9520"},{"n":3,"t":"tf","q":"Diapers can take 500 years to break down.","ko":"기저귀는 분해되는 데 500년이 걸릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Diapers can take 500 years to break down.","기저귀는 분해되는 데 500년이 걸릴 수 있습니다."]],"w":"4번 문장에 Diapers can take 500 years to break down이 그대로 나옴. 오래 걸리는 쓰레기여서 버려지는 수를 줄이는 것이 중요(5~6번).","c":"T"},"h":"87d1d203e1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... people started using recycled diapers to fix the roads in Wales.)","ko":"... 사람들은 웨일스의 도로를 고치는 데 (밑줄 친 말) 기저귀를 사용하기 시작했다.","opts":["재활용된","찢어진","오래된","수입된"],"word":"recycled","r":{"a":"1) 재활용된","ev":"4~6번 문장","s":[[4,"Diapers can take 500 years to break down.","기저귀는 분해되는 데 500년이 걸릴 수 있습니다."],[5,"To help with this problem, people started using recycled diapers to fix the roads in Wales.","이 문제를 돕기 위해, 사람들은 웨일스의 도로를 보수하는 데 재활용된 기저귀를 사용하기 시작했습니다."],[6,"This creative idea is reducing the number of diapers thrown away.","이 창의적인 생각은 버려지는 기저귀의 수를 줄여 주고 있습니다."]],"w":"4번에서 기저귀는 분해되는 데 500년이 걸리는 문제였고, 5번에서 그 문제를 돕기 위해 버려진 기저귀를 도로에 다시 썼음. 6번 버려지는 수를 줄인다는 결과와 이어져 recycled는 '재활용된'.","c":1},"h":"9ffd9463a4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Finally, these pieces are added to a sticky material called bitumen.)","ko":"마침내, 이 조각들은 역청이라고 불리는 (밑줄 친 말) 물질에 더해진다.","opts":["딱딱한","부드러운","차가운","끈적거리는"],"word":"sticky","r":{"a":"4) 끈적거리는","ev":"9~11번 문장","s":[[9,"Then, they go through various steps until they turn into small, soft pieces.","그다음, 그것들은 작고 부드러운 조각이 될 때까지 여러 단계를 거칩니다."],[10,"Finally, these pieces are added to a sticky material called bitumen.","마침내, 이 조각들은 역청이라고 불리는 끈적거리는 물질에 더해집니다."],[11,"This last step keeps the asphalt from falling apart.","이 마지막 단계가 아스팔트가 부서지지 못하게 막아 줍니다."]],"w":"10번의 sticky material이 11번에서 아스팔트가 부서지지 않게 붙잡아 주는 재료. 붙잡아 주려면 끈적거려야 함. 9번의 soft(부드러운)는 조각의 상태이고 sticky와는 다른 말.","c":4},"h":"49f565f436"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nIn the U.K., about three billion diapers are thrown away each year, and this creates 400,000 tons of waste.","ko":"밑줄 친 \"this\"가 가리키는 것은?","sko":"영국에서는, 매년 약 30억 개의 기저귀가 버려지고, 이것은 40만 톤의 쓰레기를 만들어 냅니다.","pron":"this","opts":["매년 약 30억 개의 기저귀가 버려지는 것","웨일스의 도로 공사","도로를 고치는 사람들","기저귀가 500년 동안 분해되는 것"],"r":{"a":"1) 매년 약 30억 개의 기저귀가 버려지는 것","ev":"3번 문장","s":[[3,"In the U.K., about three billion diapers are thrown away each year, and this creates 400,000 tons of waste.","영국에서는, 매년 약 30억 개의 기저귀가 버려지고, 이것은 40만 톤의 쓰레기를 만들어 냅니다."]],"w":"3번에서 and this creates 400,000 tons of waste라고 했고, 그 앞의 내용이 about three billion diapers are thrown away each year(매년 약 30억 개의 기저귀가 버려짐). 그래서 this는 기저귀가 많이 버려지는 일.","c":1,"k":"this = 매년 약 30억 개의 기저귀가 버려지는 것"},"h":"a966a55abb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This last step keeps the asphalt from falling apart.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 마지막 단계가 아스팔트가 부서지지 못하게 막아 줍니다.","opts":["이 마지막 단계에서 아스팔트가 더 많이 만들어진다.","이 마지막 단계는 아스팔트가 부서지는 것을 막아 준다.","이 마지막 단계에서는 아스팔트가 일부러 부서지게 된다.","이 마지막 단계가 끝나야 도로 공사가 시작된다."],"r":{"a":"2) 이 마지막 단계는 아스팔트가 부서지는 것을 막아 준다.","ev":"10~11번 문장","s":[[10,"Finally, these pieces are added to a sticky material called bitumen.","마침내, 이 조각들은 역청이라고 불리는 끈적거리는 물질에 더해집니다."],[11,"This last step keeps the asphalt from falling apart.","이 마지막 단계가 아스팔트가 부서지지 못하게 막아 줍니다."]],"w":"11번 keeps the asphalt from falling apart는 'keep A from v-ing = A가 ~하지 못하게 막다'라서 아스팔트가 부서지지 않게 막아 준다는 뜻. 10번에서 끈적한 역청에 조각을 더하는 단계의 효과. 부서지게 한다는 말과는 반대.","c":2},"h":"afb00b2553"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["영국에서는 매년 약 40만 개의 기저귀가 버려진다.","기저귀는 분해되는 데 5년밖에 걸리지 않는다.","이미 많은 나라가 도로 공사에 기저귀를 사용하고 있다.","지금은 영국만이 이 아이디어를 시험하고 있다."],"opts":["About 400,000 diapers are thrown away each year in the U.K.","Diapers take only five years to break down.","Many countries are already using diapers for roads.","Only the U.K. is testing this idea for now."],"r":{"a":"4) Only the U.K. is testing this idea for now.","ev":"3~4번, 12번 문장","s":[[3,"In the U.K., about three billion diapers are thrown away each year, and this creates 400,000 tons of waste.","영국에서는, 매년 약 30억 개의 기저귀가 버려지고, 이것은 40만 톤의 쓰레기를 만들어 냅니다."],[4,"Diapers can take 500 years to break down.","기저귀는 분해되는 데 500년이 걸릴 수 있습니다."],[12,"For now, only the U.K. is testing this idea.","지금은, 영국만이 이 아이디어를 시험하고 있습니다."]],"w":"12번에서 For now, only the U.K. is testing this idea라고 함. 3번에서 버려지는 기저귀는 약 30억 개(40만은 쓰레기 톤 수), 4번에서 분해에는 500년, 12번에서 아직 영국만이라 나머지는 본문과 다름.","c":4},"h":"360edccb47"},{"n":9,"t":"sum","q":"This (A) idea is (B) the number of diapers thrown away.","ko":"이 (A) 생각은 버려지는 기저귀의 수를 (B) 있다.","opts":["(A) creative / (B) reducing","(A) creative / (B) increasing","(A) boring / (B) reducing","(A) boring / (B) increasing","(A) dangerous / (B) hiding"],"oko":["(A) 창의적인 / (B) 줄이고","(A) 창의적인 / (B) 늘리고","(A) 지루한 / (B) 줄이고","(A) 지루한 / (B) 늘리고","(A) 위험한 / (B) 숨기고"],"r":{"a":"1) (A) creative / (B) reducing ((A) 창의적인 / (B) 줄이고)","ev":"6번 문장","s":[[6,"This creative idea is reducing the number of diapers thrown away.","이 창의적인 생각은 버려지는 기저귀의 수를 줄여 주고 있습니다."]],"w":"6번에서 이 창의적인 생각이 버려지는 기저귀의 수를 줄이고 있다고 함(This creative idea is reducing the number of diapers thrown away). increasing(늘리다)과 hiding(숨기다)은 본문과 반대이거나 없는 내용이고, boring·dangerous도 본문과 맞지 않음.","c":1},"h":"65bd5e1431"},{"n":10,"t":"fill","q":"It might [A] to the whole [B] one day!","ko":"언젠가 그것은 전 [B]에 [A]!","bank":["spread","world","quiet","soft","small","various"],"bko":{"spread":"퍼지다","world":"세계","quiet":"조용한","soft":"부드러운","small":"작은","various":"여러 가지의"},"r":{"a":"[A] spread (퍼지다), [B] world (세계)","ev":"14번 문장","s":[[14,"It might spread to the whole world one day!","언젠가 이것은 전 세계로 퍼질지도 모릅니다!"]],"w":"14번에서 언젠가 전 세계로 퍼질지도 모른다고 함(It might spread to the whole world one day). spread는 퍼지다, world는 세계. quiet·soft·small·various는 꾸며 주는 말이라 might 뒤의 동사 자리와 whole 뒤의 이름 자리에 올 수 없음.","c":null},"h":"7f3979d524"}]},{"u":3,"id":"rg2-03-1","no":1,"ko":"이집트 조각상의 코는 왜 사라졌을까?","items":[{"n":1,"t":"tf","q":"Many ancient Egyptian statues in museums are missing their noses.","ko":"박물관에 있는 많은 고대 이집트 조각상은 코가 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Interestingly, many of them are missing their noses.","흥미롭게도, 그것들 중 많은 것은 코가 없다."]],"w":"2번 문장에 many of them are missing their noses가 나옴. them은 1번의 박물관에 있는 고대 이집트 조각상들. 같은 내용이라 T.","c":"T"},"h":"7b0ed85cb8"},{"n":2,"t":"tf","q":"Statues inside buildings never have broken noses.","ko":"건물 안의 조각상들은 코가 부러진 적이 전혀 없다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Even statues inside buildings have broken noses.","건물 안의 조각상들조차 코가 부러져 있다."]],"w":"5번 문장에서 Even statues inside buildings have broken noses(건물 안의 조각상들조차 코가 부러져 있다)라고 함. never(전혀 없다)와 반대라 F.","c":"F"},"h":"056d742e9b"},{"n":3,"t":"tf","q":"Ancient Egyptians believed that a person’s soul would move into a statue after death.","ko":"고대 이집트인들은 사람의 영혼이 죽음 이후 조각상 안으로 옮겨 갈 것이라고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"They believed that a person’s soul would move into a statue after death.","그들은 사람의 영혼이 죽음 이후 조각상 안으로 옮겨 갈 것이라고 믿었다."]],"w":"8번 문장에 They believed that a person’s soul would move into a statue after death가 그대로 나옴. believed는 believe(믿다)의 과거형. 같은 내용이라 T.","c":"T"},"h":"ee86965e3a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (There might be another reason for this mystery.)","ko":"이 (밑줄 친 말)에는 또 다른 이유가 있을지도 모른다.","opts":["선물","도움","수수께끼","경기"],"word":"mystery","r":{"a":"3) 수수께끼","ev":"2번, 5~6번 문장","s":[[2,"Interestingly, many of them are missing their noses.","흥미롭게도, 그것들 중 많은 것은 코가 없다."],[5,"Even statues inside buildings have broken noses.","건물 안의 조각상들조차 코가 부러져 있다."],[6,"There might be another reason for this mystery.","이 미스터리에는 또 다른 이유가 있을지도 모른다."]],"w":"2번과 5번에서 조각상의 코가 왜 없는지 알 수 없다는 문제가 나오고, 6번에서 이 mystery에 또 다른 이유가 있을지도 모른다고 함. 이유를 찾아야 하는 풀리지 않는 일이므로 mystery는 '수수께끼'.","c":3},"h":"1271fc0d3d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If someone wanted to remove the soul, they needed to destroy the statue.)","ko":"만약 누군가 영혼을 제거하기를 원했다면, 그들은 조각상을 (밑줄 친 말) 했다.","opts":["만들다","파괴하다","숨기다","그리다"],"word":"destroy","r":{"a":"2) 파괴하다","ev":"8~9번 문장","s":[[8,"They believed that a person’s soul would move into a statue after death.","그들은 사람의 영혼이 죽음 이후 조각상 안으로 옮겨 갈 것이라고 믿었다."],[9,"If someone wanted to remove the soul, they needed to destroy the statue.","만약 누군가 영혼을 제거하기를 원했다면, 그들은 조각상을 파괴해야 했다."]],"w":"8번에서 영혼이 조각상 안으로 옮겨 간다고 믿었음. 그러니 9번에서 영혼을 없애려면 조각상을 destroy해야 했다는 것은 '파괴하다'. 만들거나 그리면 영혼이 사라지지 않음.","c":2},"h":"209d0ffb4f"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSo, when people wanted to steal treasure from pharaoh’s tombs, they always did one thing first.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그래서, 사람들이 파라오의 무덤에서 보물을 훔치고 싶을 때, 그들은 항상 제일 먼저 한 가지를 했다.","pron":"they","opts":["보물을 훔치고 싶어 한 사람들","파라오들","이집트의 조각가들","박물관 직원들"],"r":{"a":"1) 보물을 훔치고 싶어 한 사람들","ev":"12번 문장","s":[[12,"So, when people wanted to steal treasure from pharaoh’s tombs, they always did one thing first.","그래서, 사람들이 파라오의 무덤에서 보물을 훔치고 싶을 때, 그들은 항상 제일 먼저 한 가지를 했다."]],"w":"12번에서 when people wanted to steal treasure(사람들이 보물을 훔치고 싶을 때), they always did one thing first(그들은 제일 먼저 한 가지를 했다). 같은 문장에서 주어 people을 가리키므로 they = 보물을 훔치고 싶어 한 사람들.","c":1,"k":"they = 보물을 훔치고 싶어 한 사람들"},"h":"a9bfc4b5c6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Then, why did they only break the nose?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그렇다면, 왜 그들은 코만 부러뜨렸을까?","opts":["그렇다면 사람들은 왜 코만 부러뜨렸을까?","그렇다면 사람들은 어떻게 코를 다시 붙였을까?","그렇다면 코를 부러뜨린 사람은 누구였을까?","그렇다면 박물관은 왜 조각상의 코를 고쳤을까?"],"r":{"a":"1) 그렇다면 사람들은 왜 코만 부러뜨렸을까?","ev":"10번 문장","s":[[10,"Then, why did they only break the nose?","그렇다면, 왜 그들은 코만 부러뜨렸을까?"]],"w":"10번의 why did they only break the nose?는 왜 코만 부러뜨렸느냐는 질문. did는 과거 의문문을 만드는 말이고 break는 부러뜨리다. 코를 다시 붙이거나 누가 부러뜨렸는지, 박물관이 고쳤는지는 묻고 있지 않음.","c":1},"h":"e1352ded40"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["박물관에 있는 고대 이집트 조각상들은 모두 코가 온전하다.","이집트인들은 코가 부러지면 영혼이 안전하게 지켜진다고 믿었다.","이집트인들은 코가 생명의 원천이라고 믿었다.","코가 부러진 조각상은 건물 밖에서만 발견된다."],"opts":["All ancient Egyptian statues in museums still have their noses.","Egyptians believed that a broken nose kept the soul safe.","Egyptians believed the nose was the source of life.","Broken noses are found only on statues outside buildings."],"r":{"a":"3) Egyptians believed the nose was the source of life.","ev":"2번, 5번, 7번, 11번 문장","s":[[2,"Interestingly, many of them are missing their noses.","흥미롭게도, 그것들 중 많은 것은 코가 없다."],[5,"Even statues inside buildings have broken noses.","건물 안의 조각상들조차 코가 부러져 있다."],[7,"In ancient Egypt, people made statues for the dead.","고대 이집트에서, 사람들은 죽은 자들을 위해 조각상을 만들었다."],[11,"Egyptians believed the nose was the source of life.","이집트인들은 코가 생명의 원천이라고 믿었다."]],"w":"11번에서 Egyptians believed the nose was the source of life(코가 생명의 원천이라고 믿었다)라고 함. 많은 조각상이 코가 없고(2번), 건물 안 조각상도 코가 부러져 있고(5번), 조각상은 살아 있는 사람이 아니라 죽은 사람을 위해 만들었으므로(7번) 나머지는 본문과 다름.","c":3},"h":"8a2d308da8"},{"n":9,"t":"sum","q":"In ancient Egypt, people (A) statues for the (B).","ko":"고대 이집트에서 사람들은 (B)을(를) 위해 조각상을 (A).","opts":["(A) made / (B) dead","(A) made / (B) rich","(A) sold / (B) dead","(A) sold / (B) rich","(A) broke / (B) young"],"oko":["(A) 만들었다 / (B) 죽은 사람들","(A) 만들었다 / (B) 부자들","(A) 팔았다 / (B) 죽은 사람들","(A) 팔았다 / (B) 부자들","(A) 부러뜨렸다 / (B) 젊은 사람들"],"r":{"a":"1) (A) made / (B) dead ((A) 만들었다 / (B) 죽은 사람들)","ev":"7번 문장","s":[[7,"In ancient Egypt, people made statues for the dead.","고대 이집트에서, 사람들은 죽은 자들을 위해 조각상을 만들었다."]],"w":"7번에서 고대 이집트 사람들은 죽은 자들을 위해 조각상을 만들었음(people made statues for the dead). made는 make(만들다)의 과거형, the dead는 죽은 사람들. sold·broke나 rich·young은 본문과 맞지 않음.","c":1},"h":"6a83d18c62"},{"n":10,"t":"fill","q":"Some people thought that the broken noses were just because of [A]. However, this doesn’t [B] everything.","ko":"몇몇 사람들은 그 부러진 코가 단지 [A] 때문이라고 생각했다. 하지만, 이것은 모든 것을 [B] 못한다.","bko":{"corrosion":"부식","explain":"설명하다","believed":"믿었다","ancient":"고대의","inside":"~ 안의","forever":"영원히"},"bank":["corrosion","explain","believed","ancient","inside","forever"],"r":{"a":"[A] corrosion (부식), [B] explain (설명하다)","ev":"3~4번 문장","s":[[3,"Some people thought that the broken noses were just because of corrosion.","몇몇 사람들은 그 부러진 코가 단지 부식 때문이라고 생각했다."],[4,"However, this doesn’t explain everything.","하지만, 이것은 모든 것을 설명하지는 못한다."]],"w":"3번에서 몇몇 사람들은 코가 부러진 것이 단지 because of corrosion(침식 때문)이라고 생각했고, 4번에서 this doesn’t explain everything(이것은 모든 것을 설명하지는 못한다)이라고 반박함. believed(믿었다)·ancient(고대의)·inside(~ 안의)·forever(영원히)는 이 빈칸 자리에 말이 되지 않음.","c":null},"h":"546453f858"}]},{"u":3,"id":"rg2-03-2","no":2,"ko":"지루할 줄 알았던 여행길에서 생긴 일","items":[{"n":1,"t":"tf","q":"Sophia thought the trip to South Dakota would be boring.","ko":"Sophia는 사우스다코타로의 여행이 지루할 것이라고 생각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Sophia thought this trip would be boring because people say South Dakota is one of the most boring states in America.","Sophia는 사람들이 사우스다코타가 미국에서 가장 지루한 주 중 하나라고 말하기 때문에 이 여행이 지루할 것이라고 생각했다."]],"w":"2번 문장에 Sophia thought this trip would be boring because…이 나옴. thought는 think(생각하다)의 과거형. 사우스다코타가 가장 지루한 주 중 하나라고들 해서 그렇게 생각했음. 같은 내용이라 T.","c":"T"},"h":"c031f015de"},{"n":2,"t":"tf","q":"Sophia showed Tony pictures of her own trip to Florida.","ko":"Sophia는 Tony에게 자신의 플로리다 여행 사진들을 보여 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"She showed him pictures of her friend Ally’s exciting trip to Florida.","그녀는 그에게 자신의 친구 Ally의 플로리다로의 흥미로운 여행 사진들을 보여 주었다."]],"w":"5번 문장에서 Sophia가 보여 준 것은 자신의 여행이 아니라 친구 Ally의 플로리다 여행 사진들(her friend Ally’s exciting trip to Florida). 누구의 여행인지 바꾼 진술이라 F.","c":"F"},"h":"59f7185d96"},{"n":3,"t":"tf","q":"Sophia and Tony saw a large group of bison while they waited.","ko":"Sophia와 Tony는 기다리는 동안 큰 들소 무리를 보았다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"As they waited, they saw a large group of bison passing by.","그들은 기다리는 동안, 큰 들소 무리가 지나가는 것을 보았다."]],"w":"9번 문장에 As they waited, they saw a large group of bison passing by가 나옴. saw는 see(보다)의 과거형. As they waited는 '기다리는 동안'이라 같은 내용이라 T.","c":"T"},"h":"7e33199201"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Sophia thought this trip would be boring ...)","ko":"Sophia는 이 여행이 (밑줄 친 말) 것이라고 생각했다 ...","opts":["지루한","신나는","무서운","빠른"],"word":"boring","r":{"a":"1) 지루한","ev":"2~3번 문장","s":[[2,"Sophia thought this trip would be boring because people say South Dakota is one of the most boring states in America.","Sophia는 사람들이 사우스다코타가 미국에서 가장 지루한 주 중 하나라고 말하기 때문에 이 여행이 지루할 것이라고 생각했다."],[3,"On the way, she spent most of the time on her phone.","가는 도중에, 그녀는 대부분의 시간을 자신의 휴대전화를 보며 보냈다."]],"w":"2번에서 사우스다코타는 가장 지루한 주 중 하나라고들 해서 Sophia는 여행이 boring할 것이라 생각했고, 3번에서 대부분의 시간을 휴대전화로 보냄. 신나는 여행을 기대했다면 휴대전화만 보지 않았을 것이라 boring은 '지루한'.","c":1},"h":"3134010ce4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Sophia was surprised and said, “Wow! I didn’t expect to see that!”)","ko":"Sophia는 (밑줄 친 말) 말했다. “와! 나는 저런 걸 볼 거라고 예상하지 못했어!”","opts":["지루한","화난","놀란","슬픈"],"word":"surprised","r":{"a":"3) 놀란","ev":"9~10번 문장","s":[[9,"As they waited, they saw a large group of bison passing by.","그들은 기다리는 동안, 큰 들소 무리가 지나가는 것을 보았다."],[10,"Sophia was surprised and said, “Wow! I didn’t expect to see that!”","Sophia는 놀라서 말했다. “와! 나는 저런 걸 볼 거라고 예상하지 못했어!”"]],"w":"9번에서 갑자기 들소 무리가 지나가는 것을 보고, 10번에서 Wow!와 I didn’t expect to see that(저런 걸 볼 거라고 예상하지 못했다)이라고 말함. 예상하지 못한 광경을 본 감정이므로 surprised는 '놀란'.","c":3},"h":"7b1cd5528e"},{"n":6,"t":"ref","q":"What does the underlined \"I\" refer to?\nTheir dad stopped the car and said, “Stay safe in the car while I fix the tire.”","ko":"밑줄 친 I가 가리키는 것은?","sko":"그들의 아빠는 차를 세우고 “내가 타이어를 고치는 동안 차 안에 안전하게 있으렴.”이라고 말했다.","pron":"I","opts":["Sophia","Tony","그들의 아빠","Ally"],"r":{"a":"3) 그들의 아빠","ev":"8번 문장","s":[[8,"Their dad stopped the car and said, “Stay safe in the car while I fix the tire.”","그들의 아빠는 차를 세우고 “내가 타이어를 고치는 동안 차 안에 안전하게 있으렴.”이라고 말했다."]],"w":"8번에서 Their dad stopped the car and said(그들의 아빠가 차를 세우고 말했다)라고 했고, 따옴표 안의 I는 말하는 사람인 아빠. 타이어를 고치는 사람이 아빠.","c":3,"k":"I = 그들의 아빠"},"h":"271435688b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Just then, their car got a flat tire.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"바로 그때, 그들의 차는 타이어에 펑크가 났다.","opts":["그때 마침 그들의 차 타이어에 펑크가 났다.","그때 마침 그들의 차가 다른 차와 부딪쳤다.","그때 마침 그들의 차에 기름이 다 떨어졌다.","그때 마침 그들의 차가 목적지에 도착했다."],"r":{"a":"1) 그때 마침 그들의 차 타이어에 펑크가 났다.","ev":"7번 문장","s":[[7,"Just then, their car got a flat tire.","바로 그때, 그들의 차는 타이어에 펑크가 났다."]],"w":"7번의 Just then(바로 그때), their car got a flat tire(차 타이어에 펑크가 났다). got은 get의 과거형이고 flat tire는 바람이 빠진 타이어. 충돌, 기름 부족, 도착은 본문에 없는 내용.","c":1},"h":"f19207d593"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Sophia was excited about the trip from the beginning.","Tony spent most of the time on his phone on the way.","Sophia spent most of the time on her phone on the way.","Their dad let them get out of the car to look at the bison."],"oko":["Sophia는 여행 처음부터 신이 나 있었다.","Tony는 가는 길에 휴대전화만 보며 시간을 보냈다.","Sophia는 가는 길에 대부분의 시간을 자신의 휴대전화를 보며 보냈다.","아빠는 들소를 보라고 아이들을 차 밖으로 내보냈다."],"r":{"a":"3) Sophia spent most of the time on her phone on the way. (Sophia는 가는 길에 대부분의 시간을 자신의 휴대전화를 보며 보냈다.)","ev":"2번, 3번, 8번 문장","s":[[2,"Sophia thought this trip would be boring because people say South Dakota is one of the most boring states in America.","Sophia는 사람들이 사우스다코타가 미국에서 가장 지루한 주 중 하나라고 말하기 때문에 이 여행이 지루할 것이라고 생각했다."],[3,"On the way, she spent most of the time on her phone.","가는 도중에, 그녀는 대부분의 시간을 자신의 휴대전화를 보며 보냈다."],[8,"Their dad stopped the car and said, “Stay safe in the car while I fix the tire.”","그들의 아빠는 차를 세우고 “내가 타이어를 고치는 동안 차 안에 안전하게 있으렴.”이라고 말했다."]],"w":"3번에서 Sophia가 가는 도중 대부분의 시간을 휴대전화를 보며 보냈음(spent는 spend의 과거형). 여행이 지루할 것이라고 생각했으므로 처음부터 신난 것은 아님(2번). 휴대전화를 한 사람은 Tony가 아니라 Sophia. 아빠는 차 안에 안전하게 있으라고 했음(8번).","c":3},"h":"94b803de5a"},{"n":9,"t":"sum","q":"Tony said, “Our trip is (A) into a real (B) now!”","ko":"Tony는 “이제 우리 여행이 진정한 (B)(으)로 (A) 있어!”라고 말했다.","opts":["(A) turning / (B) adventure","(A) turning / (B) problem","(A) running / (B) adventure","(A) running / (B) problem","(A) falling / (B) lesson"],"oko":["(A) 바뀌고 / (B) 모험","(A) 바뀌고 / (B) 문제","(A) 달려가고 / (B) 모험","(A) 달려가고 / (B) 문제","(A) 떨어지고 / (B) 교훈"],"r":{"a":"1) (A) turning / (B) adventure ((A) 바뀌고 / (B) 모험)","ev":"12번 문장","s":[[12,"Tony smiled and said, “See! Our trip is turning into a real adventure now!”","Tony는 미소를 지으며 말했다. “봐! 이제 우리의 여행이 진정한 모험으로 바뀌고 있어!”"]],"w":"12번에서 Tony는 이제 여행이 진정한 모험으로 바뀌고 있다고 말함(turning into a real adventure). turn into는 ~로 바뀌다. running·falling이나 problem·lesson은 본문과 맞지 않음.","c":1},"h":"8d2b58eb08"},{"n":10,"t":"fill","q":"Her [A], Tony, saw this and asked, “What’s so [B] on your phone?”","ko":"그녀의 [A] Tony가 이 모습을 보고 “네 휴대전화에는 뭐가 그렇게 [B] 게 있어?”라고 물었다.","bank":["brother","trip","interesting","bison","state","tire"],"bko":{"brother":"남자 형제","trip":"여행","interesting":"재미있는","bison":"들소","state":"주(州)","tire":"타이어"},"r":{"a":"[A] brother (남자 형제), [B] interesting (재미있는)","ev":"4번 문장","s":[[4,"Her brother, Tony, saw this and asked, “What’s so interesting on your phone?”","그녀의 오빠 Tony가 이 모습을 보고 “네 휴대전화에는 뭐가 그렇게 재미있는 게 있어?”라고 물었다."]],"w":"4번에서 그녀의 남자 형제 Tony가 이 모습을 보고, 휴대전화에 뭐가 그렇게 재미있는지 물었음(Her brother, Tony … What’s so interesting on your phone?). brother는 남자 형제, interesting은 재미있는. trip·bison·state·tire는 이름을 나타내는 말이라 so 뒤의 형용사 자리에 맞지 않음.","c":null},"h":"dc1e5e196c"}]},{"u":3,"id":"rg2-03-3","no":3,"ko":"춤 실력은 유전자 때문일까?","items":[{"n":1,"t":"tf","q":"Some people naturally dance better than others.","ko":"어떤 사람들은 타고나기를 다른 사람들보다 춤을 더 잘 춘다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Some people naturally dance better than others.","어떤 사람들은 타고나기를 다른 사람들보다 춤을 더 잘 춘다."]],"w":"2번 문장에 Some people naturally dance better than others가 그대로 나옴. 같은 내용이라 T.","c":"T"},"h":"d257846379"},{"n":2,"t":"tf","q":"A team of scientists found that our dancing skills have nothing to do with our genes.","ko":"과학자 팀은 우리의 춤 솜씨가 유전자와 전혀 관계가 없다는 것을 발견했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"This means our dancing skills actually come from our genes!","이는 우리의 춤추는 솜씨가 사실은 우리의 유전자에서 나온다는 것을 의미한다!"]],"w":"6번 문장에서 This means our dancing skills actually come from our genes(춤 솜씨는 사실 유전자에서 나온다)라고 함. 유전자와 관계가 없다는 진술은 반대라 F.","c":"F"},"h":"2485a907d8"},{"n":3,"t":"tf","q":"Our sense of rhythm is also linked to everyday activities like walking and breathing.","ko":"우리의 리듬 감각은 걷기와 숨 쉬기 같은 일상적인 활동과도 연관되어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"It’s also linked to everyday activities — like walking and breathing.","그것은 또한 걷기와 숨 쉬기 같은 일상적인 활동과도 연관되어 있다."]],"w":"11번 문장에 It’s also linked to everyday activities — like walking and breathing이 있음. It은 10번의 our sense of rhythm. 같은 내용이라 T.","c":"T"},"h":"9e641336e5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They recently discovered special genes.)","ko":"그들은 (밑줄 친 말) 특별한 유전자들을 발견했다.","opts":["오랫동안","가끔","최근에","절대"],"word":"recently","r":{"a":"3) 최근에","ev":"3~4번 문장","s":[[3,"A team of scientists found a reason for this.","과학자로 이루어진 한 팀이 이것에 대한 이유를 찾아냈다."],[4,"They recently discovered special genes.","그들은 최근에 특별한 유전자들을 발견했다."]],"w":"3번에서 과학자 팀이 이유를 찾았고, 4번에서 그들이 특별한 유전자를 발견했다고 함. 지금 막 알려진 새 발견을 말하는 것이라 recently는 '최근에'. 오랫동안이나 절대는 새로운 발견이라는 흐름과 맞지 않음.","c":3},"h":"a30fb10dd2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It’s also linked to everyday activities — like walking and breathing.)","ko":"그것은 또한 걷기와 숨 쉬기 같은 일상적인 활동과 (밑줄 친 말).","opts":["~와 싸운","~와 연관된","~와 무관한","~을 방해하는"],"word":"linked","r":{"a":"2) ~와 연관된","ev":"10~11번 문장","s":[[10,"However, our sense of rhythm isn’t only important for dancing.","하지만, 우리의 리듬 감각은 춤추는 데에만 중요한 것이 아니다."],[11,"It’s also linked to everyday activities — like walking and breathing.","그것은 또한 걷기와 숨 쉬기 같은 일상적인 활동과도 연관되어 있다."]],"w":"10번에서 리듬 감각이 춤에만 중요한 것은 아니라고 하고(However), 11번에서 또한(also) 일상 활동과 linked라고 이어 말함. 춤 말고도 관련된 것을 더하는 말이라 '연관된'. 무관하다면 also로 이어질 수 없음.","c":2},"h":"84dad7816a"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen we tap our foot, clap our hands, or dance to music, it can show our natural sense of rhythm.","ko":"밑줄 친 it이 가리키는 것은?","sko":"우리가 발을 가볍게 두드리거나, 박수를 치거나, 음악에 맞춰 춤을 출 때, 그것은 우리의 자연스러운 리듬 감각을 보여 줄 수 있다.","pron":"it","opts":["발을 두드리거나 박수를 치거나 춤을 추는 행동","음악","과학자들의 연구","우리의 유전자"],"r":{"a":"1) 발을 두드리거나 박수를 치거나 춤을 추는 행동","ev":"8번 문장","s":[[8,"When we tap our foot, clap our hands, or dance to music, it can show our natural sense of rhythm.","우리가 발을 가볍게 두드리거나, 박수를 치거나, 음악에 맞춰 춤을 출 때, 그것은 우리의 자연스러운 리듬 감각을 보여 줄 수 있다."]],"w":"8번에서 When we tap our foot, clap our hands, or dance to music(발을 두드리거나 박수를 치거나 춤을 출 때), it can show our natural sense of rhythm(그것은 우리의 리듬 감각을 보여 줄 수 있다). it은 앞에 나온 그런 행동들을 가리킴.","c":1,"k":"it = 발을 두드리거나 박수를 치거나 춤을 추는 행동"},"h":"3e5a1be63f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, our sense of rhythm isn’t only important for dancing.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 우리의 리듬 감각은 춤추는 데에만 중요한 것이 아니다.","opts":["리듬 감각은 춤추는 일에만 중요한 것이 아니다.","리듬 감각은 춤추는 일에만 중요하다.","리듬 감각이 있으면 춤을 출 필요가 없다.","춤을 잘 추는 사람에게는 리듬 감각이 필요 없다."],"r":{"a":"1) 리듬 감각은 춤추는 일에만 중요한 것이 아니다.","ev":"10번 문장","s":[[10,"However, our sense of rhythm isn’t only important for dancing.","하지만, 우리의 리듬 감각은 춤추는 데에만 중요한 것이 아니다."]],"w":"10번의 isn’t only important for dancing은 춤추는 데에만 중요한 것이 아니라는 뜻. not only A는 A뿐만이 아니라는 말이라 춤 말고도 중요하다는 의미. 두 번째 보기는 only의 뜻을 놓친 반대 해석.","c":1},"h":"1620e0e8eb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Our dancing skills have nothing to do with our genes.","There are hundreds of genes that help us keep rhythm.","Only a few genes help us keep rhythm.","A sense of rhythm is important only for dancing."],"oko":["우리의 춤 솜씨는 유전자와 아무 관계가 없다.","리듬을 유지하도록 돕는 유전자는 수백 개가 있다.","리듬을 유지하도록 돕는 유전자는 몇 개뿐이다.","리듬 감각은 춤추는 데에만 중요하다."],"r":{"a":"2) There are hundreds of genes that help us keep rhythm. (리듬을 유지하도록 돕는 유전자는 수백 개가 있다.)","ev":"6번, 7번, 10번 문장","s":[[6,"This means our dancing skills actually come from our genes!","이는 우리의 춤추는 솜씨가 사실은 우리의 유전자에서 나온다는 것을 의미한다!"],[7,"In fact, there are hundreds of genes that help us keep rhythm.","사실, 우리에게는 리듬을 유지하도록 도와주는 수백 개의 유전자가 있다."],[10,"However, our sense of rhythm isn’t only important for dancing.","하지만, 우리의 리듬 감각은 춤추는 데에만 중요한 것이 아니다."]],"w":"7번에서 리듬을 유지하도록 돕는 유전자가 수백 개 있다고 함(there are hundreds of genes). 몇 개뿐이라는 보기는 반대. 춤 솜씨는 유전자에서 나옴(6번)이고, 리듬 감각은 춤에만 중요한 것이 아님(10번).","c":2},"h":"c7a9f4acae"},{"n":9,"t":"sum","q":"Do you (A) dancing to music or moving to a (B)?","ko":"여러분은 음악에 맞춰 춤추거나 (B)에 맞춰 움직이는 것을 (A)?","opts":["(A) enjoy / (B) beat","(A) enjoy / (B) wall","(A) hate / (B) beat","(A) hate / (B) wall","(A) forget / (B) rule"],"oko":["(A) 즐기나요 / (B) 박자","(A) 즐기나요 / (B) 벽","(A) 싫어하나요 / (B) 박자","(A) 싫어하나요 / (B) 벽","(A) 잊었나요 / (B) 규칙"],"r":{"a":"1) (A) enjoy / (B) beat ((A) 즐기나요 / (B) 박자)","ev":"1번 문장","s":[[1,"Do you enjoy dancing to music or moving to a beat?","여러분은 음악에 맞춰 춤추거나 리듬에 맞춰 움직이는 것을 즐기나요?"]],"w":"1번에서 음악에 맞춰 춤추거나 박자에 맞춰 움직이는 것을 즐기느냐고 물음(Do you enjoy dancing to music or moving to a beat?). beat는 박자. hate·forget이나 wall·rule은 본문과 맞지 않음.","c":1},"h":"80f46b3029"},{"n":10,"t":"fill","q":"This sense of rhythm [A] us [B].","ko":"이 리듬 감각이 우리를 [B] [A].","bank":["makes","genes","musical","skills","foot","hands"],"bko":{"makes":"만들어 준다","genes":"유전자들","musical":"음악적으로(음악적인)","skills":"솜씨들","foot":"발","hands":"손"},"r":{"a":"[A] makes (만들어 준다), [B] musical (음악적으로(음악적인))","ev":"9번 문장","s":[[9,"This sense of rhythm makes us musical.","이 리듬 감각이 우리를 음악적으로 만들어 준다."]],"w":"9번에서 이 리듬 감각이 우리를 음악적으로 만들어 준다고 함(This sense of rhythm makes us musical). makes는 make(만들다)의 3인칭 단수형이고 musical은 음악적인. genes·skills·foot·hands는 이름을 나타내는 말
