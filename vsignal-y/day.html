<!doctype html>
<html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>V시그널 Y단계 - 오늘의 7문장</title>
<style>
:root{--bg:#f4f6f8;--sf:#fff;--fg:#14202b;--mu:#566474;--ln:#d9e0e7;--ac:#0f766e;--acbg:#ccfbf1;--ok:#15803d;--okbg:#e3f4e8;--warn:#b45309;--warnbg:#fef3c7;--del:#9f1239;--delbg:#fde8ec;--new:#166534;--newbg:#dcf5e3}
@media(prefers-color-scheme:dark){:root{--bg:#0e141b;--sf:#17212b;--fg:#e6ebf0;--mu:#9aa8b6;--ln:#2a3744;--ac:#2dd4bf;--acbg:#0f3a36;--ok:#4ade80;--okbg:#15301f;--warn:#fbbf24;--warnbg:#46330a;--del:#fda4af;--delbg:#4a1d28;--new:#86efac;--newbg:#15301f}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:20px;margin:6px 0 2px}.sub{color:var(--mu);font-size:14px;margin:0 0 14px}
.card{background:var(--sf);border:1px solid var(--ln);border-radius:14px;padding:14px;margin-bottom:12px}
.day{font-weight:700;margin:0 0 8px;display:flex;justify-content:space-between}.day span{color:var(--mu);font-weight:400;font-size:13px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{min-width:52px;height:46px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);color:var(--fg);font-size:15px;font-weight:700;cursor:pointer;padding:0 8px}
.chip small{display:block;font-size:10px;font-weight:400;color:var(--mu);line-height:1}
.chip.done{background:var(--okbg);border-color:var(--ok)}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.back{background:none;border:none;color:var(--mu);font-size:15px;cursor:pointer;padding:8px 0}
.lab{font-size:12px;font-weight:700;color:var(--mu);margin:0 0 4px;display:flex;gap:6px;align-items:center}
.pill{display:inline-block;padding:1px 9px;border-radius:99px;font-size:12px;font-weight:700}
.p-key{background:var(--warnbg);color:var(--warn)}.p-nat{background:var(--newbg);color:var(--new)}
.sent{font-size:20px;line-height:2.1;font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Malgun Gothic",sans-serif}
.t{border:none;background:none;color:inherit;font:inherit;padding:2px 1px;border-radius:6px;cursor:pointer}
span.t{cursor:default}
.t.pick{background:var(--acbg);outline:2px solid var(--ac)}
.t.hit{background:var(--delbg);color:var(--del);text-decoration:line-through;text-decoration-thickness:1.5px}
.t.hit.pick{outline:2px solid var(--ok)}
.t.keep{border-bottom:3px solid var(--ac);border-radius:0;font-weight:700}
.t.new{background:var(--newbg);color:var(--new);font-weight:700}
.q{font-size:15px;font-weight:700;margin:0 0 6px}
.btn{display:block;width:100%;height:50px;border:none;border-radius:12px;background:var(--ac);color:#fff;font-size:17px;font-weight:700;cursor:pointer;margin-top:14px}
.btn.alt{background:var(--sf);color:var(--fg);border:1.5px solid var(--ln)}
.arrow{text-align:center;color:var(--mu);font-size:13px;margin:6px 0}
.badge{display:inline-block;padding:3px 12px;border-radius:8px;background:var(--ac);color:#fff;font-size:14px;font-weight:700}
.cnt{font-size:13px;color:var(--mu);margin-left:8px}
.note{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border-left:4px solid var(--ac);font-size:15px;line-height:1.6}
.nl{font-size:12px;font-weight:700;color:var(--ac);margin-bottom:2px}
.mt{display:flex;gap:10px}.mt>div{flex:1;display:flex;flex-direction:column;gap:8px}
.mb{padding:10px;border-radius:10px;border:2px solid var(--ln);background:var(--sf);color:var(--fg);font:16px 'Segoe UI',system-ui,'Malgun Gothic',sans-serif;cursor:pointer;text-align:left}
.mb.sel{border-color:var(--ac);background:var(--acbg)}.mb.ok{border-color:var(--ok);background:var(--okbg);color:var(--ok);font-weight:700}
.opt{display:block;width:100%;text-align:left;padding:10px 12px;margin-top:8px;border-radius:10px;border:2px solid var(--ln);background:var(--sf);color:var(--fg);cursor:pointer;font-size:14px}.opt b{display:block;font-size:16px}.opt span{color:var(--mu)}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.no{border-color:var(--warn);background:var(--warnbg)}
.msg{margin-top:10px;font-size:14px;color:var(--mu)}
.leg{font-size:12px;color:var(--mu);margin-top:8px}
.nt{padding:14px}.nh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.sec{font-size:13px;font-weight:700;color:var(--ac);margin:14px 0 6px;border-bottom:1.5px solid var(--ln);padding-bottom:3px}.src{color:var(--mu);font-weight:400;font-size:11px;margin-left:4px}
.chg{font-size:15px;margin:5px 0;line-height:1.7;font-family:'Segoe UI',system-ui,'Malgun Gothic',sans-serif}.chg s{background:var(--delbg);color:var(--del);padding:1px 4px;border-radius:4px}.chg u{text-decoration:none;background:var(--newbg);color:var(--new);font-weight:700;padding:1px 4px;border-radius:4px}
.cn{display:inline-block;width:20px;height:20px;border-radius:50%;background:var(--ac);color:#fff;font-size:12px;text-align:center;line-height:20px;margin-right:6px}.cc{font-size:12px;font-weight:700;color:var(--mu);margin-right:4px}
.ex{display:flex;gap:8px;align-items:flex-start;margin:7px 0;font-size:15px;line-height:1.75}.ex>span:last-child{flex:1}
mark{background:#fde68a;color:#14202b;padding:0 2px;border-radius:3px}
@media(prefers-color-scheme:dark){mark{background:#7a5a08;color:#fff}}
.bd{flex:none;min-width:64px;white-space:nowrap;text-align:center;padding:2px 6px;border-radius:6px;font-size:12px;font-weight:700;margin-top:3px;color:#fff}
.b0{background:#64748b}.b1{background:#0f766e}.b2{background:#15803d}.b3{background:#1d4ed8}.b4{background:#7c3aed}.b5{background:#b45309}.b6{background:#be185d}.b7{background:#475569}
.hint{font-size:13px;color:var(--mu);margin:0 0 10px}
.stamp{text-align:center}.stp{border:3px double var(--ac);border-radius:12px;padding:14px;color:var(--ac)}.stt{font-size:18px;font-weight:800}.std{font-size:22px;font-weight:800;margin:4px 0}
</style><style>
.wrd{display:inline;font-family:'Segoe UI',system-ui,'Malgun Gothic',sans-serif;font-size:20px;line-height:2.3}
.gp{display:inline-block;width:20px;height:34px;vertical-align:middle;border:none;background:none;cursor:pointer;color:var(--ln);font-size:20px;padding:0;border-radius:6px}
.gp:before{content:"\00b7"}.gp.on{color:var(--ac);font-weight:700}.gp.on:before{content:"/"}
.gp.ok{color:var(--ok);background:var(--okbg)}.gp.ok:before{content:"/"}
.gp.miss{color:var(--warn);background:var(--warnbg)}.gp.miss:before{content:"/"}
.gp.ex{color:var(--del);background:var(--delbg)}.gp.ex:before{content:"/";text-decoration:line-through}
.sn{display:flex;gap:6px;margin:6px 0 10px;flex-wrap:wrap}
.sb{flex:1;min-width:40px;height:44px;border-radius:10px;border:1.5px solid var(--ln);background:var(--sf);color:var(--fg);font-weight:700;font-size:15px;cursor:pointer}
.sb.done{background:var(--okbg);border-color:var(--ok)}.sb.cur{outline:2px solid var(--ac)}
.rw{padding:8px 0;border-bottom:1px solid var(--ln)}.rw:last-child{border:none}
.re{font-size:18px;font-family:'Segoe UI',system-ui,sans-serif;font-weight:600}.rk{font-size:15px;color:var(--mu);margin-top:2px}
.nat{margin-top:12px;padding:10px 12px;border-radius:10px;background:var(--acbg);font-size:16px;line-height:1.7}
.nat b{display:block;font-size:12px;color:var(--ac);margin-bottom:2px}
.step{font-size:13px;color:var(--mu);margin:8px 0}
.ctl{font-size:12px;color:var(--mu);margin-top:8px}
.dis{opacity:.4}
.nav{position:sticky;top:0;z-index:5;background:var(--bg,#fff);padding:6px 0}
.sc{margin-bottom:14px;scroll-margin-top:64px}
.ck{margin:3px 0 2px 44px;font-size:14px;color:var(--mu)}
.vw{background:none;border:none;font:inherit;color:inherit;padding:0 2px;border-radius:6px;cursor:pointer}
span.vw{cursor:default}
.vw.on{background:var(--acbg);text-decoration:underline;text-decoration-thickness:2px}
.vw.vok{text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--ok);background:var(--okbg)}
.vw.vms{text-decoration:underline;text-decoration-thickness:3px;text-decoration-color:var(--warn);background:var(--warnbg)}
.vw.vex{text-decoration:line-through;text-decoration-color:var(--del);background:var(--delbg)}
.cfn{margin-top:16px;padding-top:6px;border-top:2px solid var(--ln)}.cfc{margin-bottom:14px}.cfc .cfo{margin-top:8px}
.dn2{margin:12px 0;padding:10px 12px;border:1px solid var(--ln);border-radius:10px;font-size:14px;line-height:1.6}.dn2 summary{font-weight:700;font-size:13px;color:var(--mu);cursor:pointer}.dn2 ul{margin:8px 0 0;padding-left:18px}.dn2 li{margin:6px 0}.sft{border-bottom:2px dotted var(--mu)!important;color:var(--mu);opacity:.75}.dd{list-style:none;margin-left:-18px;padding-top:6px;border-top:1px solid var(--ln);color:var(--mu)}.dk{font-size:11px;padding:1px 6px;border-radius:6px;background:var(--acbg);color:var(--ac);font-weight:700}.sec2{font-weight:700;font-size:13px;color:var(--mu);margin:8px 0 4px}.fm{margin:14px 0 18px;padding:12px 14px;border:2px solid var(--ac);border-radius:12px;background:var(--sf)}
.fm>b{display:block;font-size:13px;color:var(--ac);margin-bottom:6px}
.fr{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-top:1px solid var(--ln);font-size:15px;line-height:1.6}.fr:first-of-type{border:none}
.fr i{font-style:normal;flex:none;min-width:58px;text-align:center;padding:2px 6px;border-radius:6px;background:var(--acbg);color:var(--ac);font-size:12px;font-weight:700}
.fr em{font-style:normal;color:var(--mu)}
.fmh{font-size:12px;color:var(--mu);margin-top:6px}
.wlstrip{display:block;margin:0 0 12px;padding:11px 14px;border:2px solid #e0a100;border-radius:12px;background:#fff4d6;color:#5b3d00;font-size:15px;font-weight:800;text-decoration:none}
.nbtn{display:block;text-align:center;margin-top:12px;padding:12px;border-radius:12px;background:var(--ac);color:#fff;font-weight:800;text-decoration:none}.tgl{display:block;width:100%;margin-top:10px;padding:11px;border:1px solid var(--ln);border-radius:12px;background:var(--sf);color:var(--fg);font:inherit;font-weight:700;cursor:pointer}.scr{text-align:center;margin-top:10px}.scb{font-size:22px;font-weight:800}.scb.ok{color:var(--ac)}.scb.no{color:#b45309}.scl{font-size:14px;margin-top:2px}.scl.perf{font-size:26px;font-weight:800;color:var(--ac)}.tdy{text-align:left;margin-top:14px;border-top:1px dashed var(--ln,#ccc);padding-top:10px}.tdh{font-size:15px;font-weight:800;margin-bottom:8px}.tdi{margin:0 0 16px;padding-bottom:12px;border-bottom:1px solid var(--ln,#ddd)}.tdn{font-size:12px;font-weight:700;color:var(--mu);margin-bottom:4px}.scl.sm{font-size:12px;color:var(--mu)}.wbox{margin-top:16px;padding:12px 14px;border:1px solid var(--ln);border-radius:12px;text-align:left}.wt{font-weight:800;font-size:15px;margin-bottom:4px}.wsub,.wnone{font-size:13px;color:var(--mu);margin:2px 0 8px}.wrow{display:flex;gap:10px;padding:10px 0;border-top:1px solid var(--ln)}.wn{flex:none;font-weight:800;color:var(--ac);min-width:34px}.wen{font-size:15px;line-height:1.6;font-weight:600}.wko{font-size:14px;line-height:1.6;color:var(--mu);margin-top:2px}.wwhy{font-size:12px;color:var(--mu);margin-top:2px}
</style></head><body><div class="wrap" id="app"></div>
<script>
const DAYS=[{"d":1,"s":[{"id":"1-1","n":1,"en":"We should avoid spending too much time / on platforms / that keep us distracted.","ko":"우리는 너무 많은 시간을 보내는 것을 피해야 한다 / 플랫폼에서 / 우리를 산만하게 하는","nat":"우리는 계속 주의를 흩뜨리는 플랫폼에서 너무 많은 시간을 보내는 것을 피해야 한다."},{"id":"1-2","n":2,"en":"Try to avoid eating foods / that contain too much sugar and unhealthy fat.","ko":"음식을 먹는 것을 피하려고 노력해라 / 너무 많은 설탕과 건강하지 않은 지방을 포함하는","nat":"설탕과 건강에 해로운 지방이 너무 많이 들어 있는 음식은 먹지 않도록 노력해 봐라."},{"id":"1-3","n":3,"en":"I handed in my writing assignment / right before the deadline / because I had to fix the beginning part / after my teacher said / it lacked a clear topic sentence.","ko":"나는 글쓰기 과제를 제출했다 / 마감 바로 직전에 / 왜냐하면 나는 시작 부분을 고쳐야 했기 때문이다 / 선생님이 말씀하신 후에 / 그것이 명확한 주제문이 부족하다고","nat":"선생님이 시작 부분에 명확한 주제문이 없다고 말한 뒤 그 부분을 고쳐야 했기 때문에, 나는 글쓰기 과제를 마감 직전에야 제출했다."},{"id":"1-4","n":4,"en":"Although we had less time than other groups, / I handed in my group project on time / because we planned well / and divided the tasks from the beginning.","ko":"비록 우리가 다른 그룹들보다 시간이 적었지만, / 나는 그룹 프로젝트를 제시간에 제출했다 / 왜냐하면 우리가 잘 계획했기 때문이다 / 그리고 처음부터 과제를 나누었기 때문이다","nat":"우리는 다른 모둠보다 시간이 적었지만, 계획을 잘 세우고 처음부터 할 일을 나눈 덕분에 내 모둠 과제를 제시간에 제출했다."},{"id":"1-5","n":5,"en":"This app runs well / on smartphones / that offer enough storage space.","ko":"이 앱은 잘 작동한다 / 스마트폰에서 / 충분한 저장 공간을 제공하는","nat":"이 앱은 저장 공간이 충분한 스마트폰에서 잘 작동한다."},{"id":"1-6","n":6,"en":"My uncle runs a bakery / that sells fresh bread / made with simple ingredients.","ko":"우리 삼촌은 빵집을 운영한다 / 신선한 빵을 파는 / 단순한 재료로 만든","nat":"삼촌은 소박한 재료로 만든 신선한 빵을 파는 빵집을 운영한다."},{"id":"1-7","n":7,"en":"The program, / which is run by a non-profit group, / supports young people / who need emotional care.","ko":"그 프로그램은, / 비영리 단체에 의해 운영되는, / 젊은 사람들을 지원한다 / 정서적 돌봄이 필요한","nat":"비영리 단체가 운영하는 이 프로그램은 정서적 돌봄이 필요한 젊은이들을 지원한다."}]},{"d":2,"s":[{"id":"2-1","n":1,"en":"My friend lent me his upgraded tablet, / which had a larger screen and better performance than mine.","ko":"내 친구는 그의 업그레이드된 태블릿을 빌려주었다, / 내 것보다 더 큰 화면과 더 나은 성능을 가진","nat":"내 친구는 나에게 자신의 업그레이드된 태블릿을 빌려주었는데, 그 태블릿은 내 것보다 화면이 더 크고 성능도 더 좋았다."},{"id":"2-2","n":2,"en":"It was a biography of a famous inventor / that he lent me / for my research.","ko":"그것은 유명한 발명가의 전기였다 / 그가 나에게 빌려준 / 내 연구를 위해","nat":"그가 내 연구를 위해 나에게 빌려준 것은 유명한 발명가의 전기였다."},{"id":"2-3","n":3,"en":"She remained calm / although several students raised their voices / during the class discussion / about how to organize the school festival.","ko":"그녀는 침착한 상태를 유지했다 / 비록 몇몇 학생들이 목소리를 높였지만 / 수업 토론 중에 / 학교 축제를 어떻게 조직할지에 대한","nat":"학교 축제를 어떻게 준비할지에 대한 수업 토론 중에 몇몇 학생이 목소리를 높였지만, 그녀는 침착함을 유지했다."},{"id":"2-4","n":4,"en":"He remained helpful to his teammates, / who often didn't know / how to divide the tasks / for their environmental research project.","ko":"그는 팀원들에게 도움이 되는 사람으로 남았다, / 그런데 그들은 종종 몰랐다 / 과제를 어떻게 나눌지를 / 그들의 환경 연구 프로젝트를 위한","nat":"그는 팀원들에게 계속 도움이 되었는데, 팀원들은 환경 연구 프로젝트에서 할 일을 어떻게 나눠야 할지 종종 몰랐다."},{"id":"2-5","n":5,"en":"I didn't react to what he said / because I knew / he was only trying to embarrass me / in front of others.","ko":"나는 그가 말한 것에 반응하지 않았다 / 왜냐하면 나는 알고 있었기 때문이다 / 그가 단지 나를 당황하게 하려고 했다는 것을 / 다른 사람들 앞에서","nat":"그가 다른 사람들 앞에서 나를 당황시키려는 것일 뿐이라는 걸 알았기 때문에, 나는 그가 한 말에 반응하지 않았다."},{"id":"2-6","n":6,"en":"The kids reacted to the video / when they saw their names / in the credits.","ko":"아이들은 비디오에 반응했다 / 그들이 자신들의 이름을 봤을 때 / 영상 크레딧에 [제작진.출연진 명단에]","nat":"아이들은 크레딧에서 자기 이름을 보자 그 영상에 반응했다."},{"id":"2-7","n":7,"en":"We reacted to what was announced yesterday / with both surprise and confusion.","ko":"우리는 어제 발표된 것에 반응했다 / 놀라움과 혼란 둘 다로","nat":"우리는 어제 발표된 내용에 놀라움과 혼란을 동시에 느끼며 반응했다."}]},{"d":3,"s":[{"id":"3-1","n":1,"en":"My little brother looked nervous / when the teacher asked him / to present his project.","ko":"내 남동생은 긴장해 보였다 / 선생님이 그에게 요청했을 때 / 그의 프로젝트를 발표하라고","nat":"내 남동생은 선생님이 프로젝트를 발표해 보라고 하자 긴장한 듯 보였다."},{"id":"3-2","n":2,"en":"The student looked more tired than usual / when he finally finished his project.","ko":"그 학생은 평소보다 더 피곤해 보였다 / 그가 마침내 그의 프로젝트를 끝냈을 때","nat":"그 학생은 마침내 프로젝트를 끝냈을 때 평소보다 더 피곤해 보였다."},{"id":"3-3","n":3,"en":"The teacher explained the rules so clearly / that no student had any questions afterward.","ko":"선생님께 규칙을 너무나 명확하게 설명해서 / 그 후 어떤 학생도 질문이 없었다","nat":"선생님이 규칙을 아주 명확하게 설명해서 그 뒤로 질문이 있는 학생이 한 명도 없었다."},{"id":"3-4","n":4,"en":"What the guide explained to the visitors was / how to read the museum map.","ko":"가이드가 방문객들에게 설명한 것은 / 박물관 지도를 읽는 방법이었다","nat":"가이드가 방문객들에게 설명한 것은 박물관 지도를 보는 방법이었다."},{"id":"3-5","n":5,"en":"The librarian explained to the new student / how to find books / when she asked for help / although the library was very busy that morning.","ko":"사서는 새 학생에게 설명했다 / 책을 찾는 방법을 / 그녀가 도움을 요청했을 때 / 비록 그날 아침 도서관이 매우 바빴지만","nat":"그날 아침 도서관이 매우 붐볐지만, 사서는 새로 온 학생이 도움을 요청하자 책을 찾는 방법을 설명해 주었다."},{"id":"3-6","n":6,"en":"It was only she / who replied / when the teacher asked the question.","ko":"오직 그녀만이었다 / 대답한 것은 / 선생님이 질문을 했을 때","nat":"선생님이 질문했을 때 대답한 사람은 그녀뿐이었다."},{"id":"3-7","n":7,"en":"Moved by the kind and thoughtful words / written inside the card, / he replied to the invitation / with gratitude.","ko":"친절하고 사려 깊은 말들에 감동받아 / 카드 안에 쓰여진, / 그는 초대장에 답했다 / 감사함으로","nat":"카드 안에 적힌 친절하고 사려 깊은 말에 감동받아, 그는 감사한 마음으로 초대에 답했다."}]},{"d":4,"s":[{"id":"4-1","n":1,"en":"The cat lay on the warm floor yesterday / even though the couch was free / and much softer.","ko":"고양이는 어제 따뜻한 바닥에 누워 있었다 / 비록 소파가 비어있었고 / 훨씬 더 부드러웠는데도","nat":"소파가 비어 있고 훨씬 더 푹신했는데도 그 고양이는 어제 따뜻한 바닥에 누워 있었다."},{"id":"4-2","n":2,"en":"A book is lying on the desk, / which suggests / that someone is using it / to save their spot.","ko":"책 한 권이 책상 위에 놓여 있다, / 이것은 암시한다 / 누군가가 그것을 사용하고 있다는 것을 / 자신의 자리를 지키기 위해","nat":"책 한 권이 책상 위에 놓여 있는데, 이는 누군가가 자기 자리를 맡아 두려고 그 책을 이용하고 있음을 보여 준다."},{"id":"4-3","n":3,"en":"I laid the cards on the table, / explaining each rule carefully / to help everyone understand the game.","ko":"나는 카드들을 테이블 위에 놓았다, / 각 규칙을 신중하게 설명하면서 / 모든 사람이 게임을 이해하도록 돕기 위해","nat":"나는 탁자 위에 카드를 올려놓고, 모두가 게임을 이해할 수 있도록 각 규칙을 신중하게 설명했다."},{"id":"4-4","n":4,"en":"The eggs / that are laid by our hen each morning / are stored in our refrigerator.","ko":"달걀들은 / 우리 암탉에 의해 매일 아침 낳아지는 / 우리 냉장고에 보관된다","nat":"우리 암탉이 매일 아침 낳는 달걀은 냉장고에 보관된다."},{"id":"4-5","n":5,"en":"He strongly opposed the new dress code / that required all students / to wear neckties.","ko":"그는 새로운 복장 규정에 강력히 반대했다 / 모든 학생들에게 요구하는 / 넥타이를 착용하라고","nat":"그는 모든 학생에게 넥타이 착용을 요구하는 새 복장 규정에 강하게 반대했다."},{"id":"4-6","n":6,"en":"My friend opposed canceling the school festival, / arguing that it was an event / everyone was looking forward to.","ko":"내 친구는 학교 축제 취소에 반대했다, / 그것이 행사라고 주장하면서 / 모든 사람이 기대하고 있는","nat":"내 친구는 학교 축제를 취소하는 것에 반대하며, 그 축제는 모두가 기대하던 행사라고 주장했다."},{"id":"4-7","n":7,"en":"Many students opposed the notice / about canceling the school trip / when they saw it posted / on the school bulletin board, / saying it was one of the most anticipated events of the year.","ko":"많은 학생들이 공지에 반대했다 / 학교 여행을 취소하는 것에 관한 / 그들이 그것이 게시된 것을 봤을 때 / 학교 게시판에, / 그것이 올해 가장 기대되는 행사 중 하나라고 말하면서","nat":"많은 학생들은 학교 게시판에 붙은 학교 여행 취소 공지를 보고, 올해 가장 기대되던 행사 중 하나라며 반대했다."}]},{"d":5,"s":[{"id":"5-1","n":1,"en":"We considered him a great leader / because of how he handled the basketball tournament.","ko":"우리는 그를 훌륭한 리더로 여겼다 / 그가 농구 시합을 처한 방식으로 인해","nat":"우리는 그가 농구 대회를 이끈 방식 때문에 그를 훌륭한 지도자로 여겼다."},{"id":"5-2","n":2,"en":"They considered moving to the countryside, / hoping for more peace and better health.","ko":"그들은 시골로 이사하는 것을 고려했다, / 더 많은 평화와 더 나은 건강을 바라면서","nat":"그들은 더 많은 평온과 더 나은 건강을 바라며 시골로 이사하는 것을 고려했다."},{"id":"5-3","n":3,"en":"The article addresses the problem of plastic waste / caused by food deliveries, / which has become a major environmental issue / in many urban areas.","ko":"그 기사는 플라스틱 쓰레기 문제를 다룬다 / 음식 배달에 의해 발생된 / 그리고 그것은 주요 환경 문제가 되어왔다 / 많은 도시 지역에서","nat":"그 기사는 음식 배달로 인해 생기는 플라스틱 쓰레기 문제를 다루는데, 이 문제는 많은 도시 지역에서 주요한 환경 문제가 되었다."},{"id":"5-4","n":4,"en":"A guest speaker addressed the students / on the topic of first aid / to raise awareness / of how to respond to emergencies.","ko":"초청 강연자가 학생들에게 연설했다 / 응급처치 주제로 / 인식을 높이기 위해 / 응급 상황에 대응하는 방법에 대한","nat":"초청 연사가 비상 상황에 대처하는 방법에 대한 인식을 높이기 위해 응급처치를 주제로 학생들에게 강연했다."},{"id":"5-5","n":5,"en":"After several sleepless nights / caused by loud music upstairs, / she addressed the issue / by leaving a polite note.","ko":"며칠간의 잠 못 이루는 밤들 후에 / 위층의 시끄러운 음악으로 인해 발생된, / 그녀는 그 문제를 해결했다 / 정중한 쪽지를 남김으로써","nat":"위층의 시끄러운 음악 때문에 여러 밤을 잠 못 이룬 뒤, 그녀는 정중한 쪽지를 남기는 것으로 그 문제에 대응했다."},{"id":"5-6","n":6,"en":"She feels like going for a walk / in the park / after dinner, / especially when the sunset paints the sky / with beautiful colors.","ko":"그녀는 산책하고 싶어한다 / 공원에서 / 저녁 식사 후에, / 특히 노을이 하늘을 칠할 때 / 아름다운 색깔로","nat":"그녀는 저녁 식사 후에 공원으로 산책을 가고 싶어 하는데, 특히 노을이 하늘을 아름다운 빛깔로 물들일 때 그렇다."},{"id":"5-7","n":7,"en":"I feel like listening to soft music / before bed, / especially when the rain taps gently on the window / and fills the room / with a quiet rhythm.","ko":"나는 부드러운 음악을 듣고 싶어한다 / 잠자리에 들기 전에, / 특히 비가 부드럽게 창문을 두드릴 때 / 그리고 방을 채울 때 / 조용한 리듬으로","nat":"나는 자기 전에 부드러운 음악을 듣고 싶은데, 특히 비가 창문을 살살 두드리며 방을 고요한 리듬으로 채울 때 그렇다."}]},{"d":6,"s":[{"id":"6-1","n":1,"en":"Our class discussed different ways / to reduce plastic waste at school, / such as bringing reusable containers / and avoiding single-use items.","ko":"우리 반은 다른[다양한] 방법들을 논의했다 / 학교에서 플라스틱 쓰레기를 줄이는, / 재사용 가능한 용기를 가져오는 것과 같은 / 그리고 일회용품을 피하는 (것과 같은)","nat":"우리 반은 재사용 용기를 가져오고 일회용품을 쓰지 않는 것처럼, 학교에서 플라스틱 쓰레기를 줄일 다양한 방법을 토론했다."},{"id":"6-2","n":2,"en":"We discussed the causes of global warming / that were shown in the video / about climate change.","ko":"우리는 지구온난화의 원인들을 논의했다 / 비디오에서 보여진 / 기후 변화에 관한","nat":"우리는 기후 변화에 관한 영상에서 소개된 지구온난화의 원인들을 토론했다."},{"id":"6-3","n":3,"en":"She found / that drinking warm milk before bed / helps her sleep better, / especially during stressful periods.","ko":"그녀는 알게 되었다 / 자기 전에 따뜻한 우유를 마시는 것이 / 그녀가 더 잘 자도록 돕는다는 것을 / 특히 스트레스 많은 기간 동안","nat":"그녀는 자기 전에 따뜻한 우유를 마시면, 특히 스트레스가 많은 시기에 잠을 더 잘 잔다는 것을 알게 되었다."},{"id":"6-4","n":4,"en":"They found the movie too long / for kids to enjoy fully, / since it moved very slowly.","ko":"그들은 그 영화가 너무 길다고 생각했다 / 아이들이 완전히 즐기기에는, / 그것이 매우 느리게 진행되었기 때문에","nat":"그 영화는 매우 느리게 전개되어서, 그들은 아이들이 온전히 즐기기에는 너무 길다고 느꼈다."},{"id":"6-5","n":5,"en":"Over time, / my friend found the math problems / less confusing and more fun.","ko":"시간이 지나면서, / 내 친구는 수학 문제들을 여겼다 / 덜 혼란스럽고 더 재미있게","nat":"시간이 지나면서 내 친구는 수학 문제가 덜 헷갈리고 더 재미있다고 느꼈다."},{"id":"6-6","n":6,"en":"The strawberries taste so fresh and sweet / that many customers keep coming back for more.","ko":"딸기는 너무나 신선하고 달콤한 맛이 나서 / 많은 손님들이 계속 더 찾으러 돌아온다","nat":"그 딸기는 아주 신선하고 달아서 많은 손님이 더 사러 계속 다시 찾아온다."},{"id":"6-7","n":7,"en":"The chef tastes the soup carefully / before serving it to the customers / to make sure / that the seasoning is balanced / and the temperature is just right.","ko":"요리사는 수프를 신중하게 맛본다 / 그것을 고객들에게 제공하기 전에 / 확실히 하기 위해 / 양념이 균형 잡혀 있고 / 온도가 적당하다는 것을","nat":"요리사는 손님에게 내기 전에 수프를 조심스럽게 맛보며 간이 잘 맞는지, 온도가 딱 알맞은지 확인한다."}]},{"d":7,"s":[{"id":"7-1","n":1,"en":"The way you act / in difficult moments / counts more than anything you say.","ko":"당신이 행동하는 방식은 / 어려운 순간들에 / 당신이 말하는 어떤 것보다 더 중요하다","nat":"어려운 순간에 네가 어떻게 행동하는지는 네가 하는 어떤 말보다 더 중요하다."},{"id":"7-2","n":2,"en":"My parents count honesty / as more important than getting good grades / because they believe / it shapes a person's true character.","ko":"내 부모님은 정직을 여긴다 / 좋은 성적을 받는 것보다 더 중요하게 / 왜냐하면 그들은 믿기 때문이다 / 그것이 한 사람의 진정한 성격을 만든다고","nat":"부모님은 정직이 사람의 진정한 인격을 형성한다고 믿기 때문에, 좋은 성적을 받는 것보다 정직을 더 중요하게 여긴다."},{"id":"7-3","n":3,"en":"You can count on me / when you need help, / although I may not always have the perfect solution / that works the way you want.","ko":"당신은 나에게 의지할 수 있다 / 당신이 도움이 필요할 때, / 비록 내가 항상 완벽한 해결책을 가지고 있지는 않을지라도 / 당신이 원하는 방식으로 작동하는","nat":"비록 네가 원하는 방식대로 통하는 완벽한 해결책이 내게 항상 있지는 않을 수도 있지만, 도움이 필요할 때 너는 나에게 의지해도 된다."},{"id":"7-4","n":4,"en":"I answered all the questions / on the social studies test / by applying what I learned in class.","ko":"나는 모든 문제들에 답했다 / 사회 시험의 / 내가 수업에서 배운 것을 적용함으로써","nat":"나는 수업에서 배운 것을 적용해서 사회 시험의 모든 문제에 답했다."},{"id":"7-5","n":5,"en":"She answered my email / with helpful information / that helped my group finish the project on time / and earn the highest score.","ko":"그녀는 내 이메일에 답했다 / 도움이 되는 정보로 / 내 그룹이 프로젝트를 제시간에 끝내는데 도움이 된 / 그리고 최고 점수를 받게 한","nat":"그녀는 우리 모둠이 프로젝트를 제시간에 끝내고 최고 점수를 받는 데 도움이 된 유용한 정보를 담아 내 이메일에 답장했다."},{"id":"7-6","n":6,"en":"Her mentor advised her / to read different types of books / because reading widely helps develop better thinking skills.","ko":"그녀의 멘토는 그녀에게 조언했다 / 다양한 종류의 책을 읽으라고 / 왜냐하면 폭넓게 읽는 것이 더 나은 사고 능력을 기르는데 도움이 되기 때문이다","nat":"그녀의 멘토는 폭넓게 읽는 것이 더 나은 사고력을 기르는 데 도움이 된다며 다양한 종류의 책을 읽으라고 조언했다."},{"id":"7-7","n":7,"en":"My parents advised me / to choose friends wisely, / since the people we spend time with / shape who we become.","ko":"내 부모님은 나에게 조언했다 / 친구들을 현명하게 선택하라고, / 우리가 함께 시간을 보내는 사람들이 / 우리가 어떤 사람이 되는지를 만들기 때문에","nat":"부모님은 우리가 함께 시간을 보내는 사람들이 우리가 어떤 사람이 될지를 만들어 가기 때문에 친구를 현명하게 고르라고 조언했다."}]},{"d":8,"s":[{"id":"8-1","n":1,"en":"She plans to graduate from university next spring / after four years of study / and then work at a marketing company / that specializes in social media marketing.","ko":"그녀는 내년 봄에 대학교를 졸업할 계획이다 / 4년간의 공부 후에 / 그리고 마케팅 회사에서 일할 (계획이다) / 소셜 미디어[SNS] 마케팅을 전문으로 하는","nat":"그녀는 내년 봄에 4년간의 공부를 마치고 대학을 졸업한 뒤, 소셜 미디어 마케팅을 전문으로 하는 마케팅 회사에서 일할 계획이다."},{"id":"8-2","n":2,"en":"Although the program was difficult, / he finally graduated from nursing school / with excellent grades last month / and immediately received a job offer / from the local hospital in his hometown.","ko":"프로그램이 어려웠지만, / 그는 마침내 간호학교를 졸업했다 / 지난 달 우수한 성적으로 / 그리고 즉시 취업 제안을 받았다 / 그의 고향의 지역 병원으로부터","nat":"그 과정은 어려웠지만, 그는 지난달 우수한 성적으로 간호학교를 마침내 졸업했고 곧바로 고향의 지역 병원에서 일자리 제안을 받았다."},{"id":"8-3","n":3,"en":"The quiet playground, / covered with untouched snow, / looked like a scene / from a winter movie.","ko":"조용한 놀이터가, / 손대지 않은 눈으로 덮인, / 장면처럼 보였다 / 겨울 영화의","nat":"손길이 닿지 않은 눈으로 덮인 조용한 놀이터는 겨울 영화의 한 장면처럼 보였다."},{"id":"8-4","n":4,"en":"Covered with golden autumn leaves, / the street near my school / looked especially beautiful that morning.","ko":"황금빛 가을 잎으로 덮인, / 우리 학교 근처의 거리가 / 그날 아침 특히 아름다워 보였다","nat":"황금빛 낙엽으로 덮여 있어서, 우리 학교 근처 거리는 그날 아침 유난히 아름다워 보였다."},{"id":"8-5","n":5,"en":"The coach ordered the players / to run faster, / knowing that their current speed would not be enough / to beat their rivals.","ko":"코치는 선수들에게 지시했다 / 더 빨리 뛰라고, / 그들의 현재 속도가 충분하지 않을 것임을 알았기 때문에 / 라이벌들을 이기기에","nat":"코치는 선수들의 현재 속도로는 라이벌을 이기기에 충분하지 않을 것임을 알고 선수들에게 더 빨리 달리라고 지시했다."},{"id":"8-6","n":6,"en":"Our team leader ordered us / to finish the poster by Friday / and prepare our part carefully / so that the presentation would go smoothly.","ko":"우리 팀 리더는 우리에게 지시했다 / 금요일까지 포스터를 완성하라고 / 그리고 우리 부분을 신중히 준비하라고 / 발표가 순조롭게 진행되도록","nat":"우리 팀장은 발표가 순조롭게 진행되도록 금요일까지 포스터를 끝내고 각자 맡은 부분을 신중하게 준비하라고 지시했다."},{"id":"8-7","n":7,"en":"The PE teacher ordered the students / to line up quickly, / raising her voice / as some students were still chatting loudly.","ko":"체육 선생님은 학생들에게 지시했다 / 빨리 줄을 서라고, / 그녀의 목소리를 높이며 / 몇몇 학생들이 여전히 크게 떠들고 있었기 때문에","nat":"일부 학생들이 아직도 크게 떠들고 있어서, 체육 선생님은 목소리를 높이며 학생들에게 빨리 줄을 서라고 지시했다."}]},{"d":9,"s":[{"id":"9-1","n":1,"en":"Although many people think it's easy, / it requires patience and love / to take care of pets properly / and give them a good life.","ko":"많은 사람들이 쉽다고 생각하지만, / 인내와 사랑이 필요하다 / 애완동물을 제대로 돌보는 것은 / 그리고 그들에게 좋은 삶을 주는 것은","nat":"많은 사람이 쉽다고 생각하지만, 반려동물을 제대로 돌보고 좋은 삶을 주려면 인내와 사랑이 필요하다."},{"id":"9-2","n":2,"en":"Taking care of the environment / starts with small actions / such as planting trees and reducing waste, / and these simple habits / can inspire others / to do the same.","ko":"환경을 돌보는 것은 / 작은 행동들로 시작한다 / 나무 심기와 쓰레기 줄이기 같은, / 그리고 이런 간단한 습관들이 / 다른 사람들에게 영감을 줄 수 있다 / 같은 일을 하도록","nat":"환경을 돌보는 일은 나무 심기와 쓰레기 줄이기 같은 작은 행동에서 시작되며, 이런 단순한 습관은 다른 사람들도 똑같이 하도록 영감을 줄 수 있다."},{"id":"9-3","n":3,"en":"My aunt looks after homeless dogs / at the animal shelter / so that they can find new homes, / and many families have adopted dogs / thanks to her.","ko":"우리 이모[고모]는 유기견들을 돌본다 / 동물 보호소에서 / 그들이 새로운 집을 찾을 수 있도록, / 그리고 많은 가족들이 개들을 입양했다 / 그녀 덕분에","nat":"이모는 동물 보호소에서 집 없는 개들이 새 가정을 찾을 수 있도록 돌보고 있으며, 이모 덕분에 많은 가족이 개를 입양했다."},{"id":"9-4","n":4,"en":"Even though his friends invited him many times, / he delayed going to the movies / to fully focus on his final exam / next Monday.","ko":"친구들이 그를 여러 번 초대했음에도 불구하고, / 그는 영화 보러 가는 것을 미뤘다 / 기말고사에 완전히 집중하기 위해 / 다음 주 월요일의","nat":"친구들이 여러 번 초대했는데도 그는 다음 주 월요일 기말시험에 온전히 집중하려고 영화 보러 가는 것을 미뤘다."},{"id":"9-5","n":5,"en":"She delayed doing her homework / to watch a live stream / by her favorite YouTuber, / and she ended up staying awake until midnight / to complete it.","ko":"그녀는 그녀의 숙제하는 것을 미뤘다 / 실시간 방송을 보기 위해 / 그녀의 가장 좋아하는 유튜버의, / 그리고 결국 자정까지 깨어있게 되었다 / 그것을 완성하기 위해","nat":"그녀는 가장 좋아하는 유튜버의 라이브 방송을 보려고 숙제를 미뤘고, 결국 숙제를 끝내느라 자정까지 깨어 있게 되었다."},{"id":"9-6","n":6,"en":"Using charts and examples, / the teacher informed the parents / of the exam results / during the parent meeting / to help them understand their children's progress.","ko":"차트와 예시들을 사용하여, / 선생님은 학부모들에게 알렸다 / 시험 결과를 / 학부모 회의 동안 / 그들이 자녀들의 향상을 이해할 수 있도록","nat":"선생님은 학부모 면담에서 도표와 예시를 활용해 학부모들에게 시험 결과를 알렸고, 학부모들이 자녀의 학업 성취 과정을 이해하도록 도우려 했다."},{"id":"9-7","n":7,"en":"Because the library extended its hours / during finals week, / the librarian informed the students / of the new schedule / to make sure everyone knew.","ko":"도서관이 시간을 연장했기 때문에 / 기말고사 주간 동안, / 사서가 학생들에게 알렸다 / 새로운 일정을 / 모든 사람이 알 수 있도록","nat":"도서관이 기말고사 주간에 운영 시간을 연장했기 때문에, 사서는 모두가 알 수 있도록 학생들에게 새 일정을 알렸다."}]},{"d":10,"s":[{"id":"10-1","n":1,"en":"They applied the theory / to a science experiment, / which later became the basis / for their final research presentation.","ko":"그들은 이론을 적용했다 / 과학 실험에, / 그리고 이것은 나중에 기초가 되었다 / 그들의 최종 연구 발표의","nat":"그들은 그 이론을 과학 실험에 적용했고, 이 실험은 나중에 최종 연구 발표의 토대가 되었다."},{"id":"10-2","n":2,"en":"When she applied what she learned at school / to real situations, / she discovered / that learning becomes meaningful / only if you use it outside the classroom.","ko":"그녀가 학교에서 배운 것을 적용했을 때 / 실제 상황에, / 그녀는 발견했다 / 배움은 의미 있게 된다는 것을 / 당신이 그것을 교실 밖에서 사용할 때에야","nat":"그녀는 학교에서 배운 것을 실제 상황에 적용해 보고, 배움은 교실 밖에서 사용할 때에만 의미가 있다는 것을 알게 되었다."},{"id":"10-3","n":3,"en":"She applied for the exchange program / even though her parents were worried / about her being so far from home.","ko":"그녀는 교환학생 프로그램에 지원했다 / 부모님이 걱정했음에도 불구하고 / 그녀가 집에서 너무 멀리 있는 것에 대해","nat":"그녀는 부모님이 집에서 그렇게 멀리 떨어져 있는 것을 걱정했는데도 교환 프로그램에 지원했다."},{"id":"10-4","n":4,"en":"My mom is always busy / preparing nutritious meals for our family, / making sure we eat healthy food every day.","ko":"우리 엄마는 항상 바쁘시다 / 우리 가족을 위해 영양가 있는 식사를 준비하시느라 / 우리가 매일 건강한 음식을 먹도록 확실히 하시면서","nat":"엄마는 우리 가족을 위해 영양가 있는 식사를 준비하느라 늘 바쁘며, 우리가 매일 건강한 음식을 먹도록 챙기신다."},{"id":"10-5","n":5,"en":"They were busy / preparing for the school festival, / which was scheduled / to take place on Friday.","ko":"그들은 바빴다 / 학교 축제를 준비하느라, / 그리고 그것은 예정되어 있었다 / 금요일에 열리도록","nat":"그들은 금요일에 열릴 예정인 학교 축제를 준비하느라 바빴다."},{"id":"10-6","n":6,"en":"This morning, I listened to the weather forecast / on the radio / to check if I should take an umbrella / before leaving for school.","ko":"오늘 아침, 나는 일기예보를 들었다 / 라디오에서 / 우산을 가져가야 하는지 확인하기 위해 / 학교에 가기 전에","nat":"오늘 아침 나는 학교로 출발하기 전에 우산을 챙겨야 하는지 확인하려고 라디오로 일기예보를 들었다."},{"id":"10-7","n":7,"en":"During lunch break, / my friends and I listen to new music releases, / sharing our favorite songs / and discovering new artists together.","ko":"점심시간 동안 / 내 친구들과 나는 새로운 음악 발매곡들을 듣는다 / 우리가 좋아하는 노래들을 공유하면서 / 그리고 새로운 아티스트들을 함께 발견하면서","nat":"점심시간에 친구들과 나는 신곡을 들으며 가장 좋아하는 노래를 서로 나누고 새로운 아티스트도 함께 발견한다."}]},{"d":11,"s":[{"id":"11-1","n":1,"en":"A warning sign appeared on the screen, / flashing red / and saying it was unsafe to continue.","ko":"경고 신호가 화면에 나타났다, / 빨갛게 깜빡이면서 / 그리고 계속하는 것이 위험하다고 말하면서","nat":"화면에 경고 표시가 나타나 빨간색으로 깜박이며 계속하는 것은 안전하지 않다고 알렸다."},{"id":"11-2","n":2,"en":"The student appeared nervous / before his first presentation, / which made the teacher give him a moment to relax.","ko":"그 학생은 긴장해 보였다 / 그의 첫 발표 전에 / 그래서 선생님은 그에게 긴장을 풀 시간을 주었다","nat":"그 학생이 첫 발표를 앞두고 긴장해 보여서, 선생님은 그에게 긴장을 풀 시간을 잠시 주었다."},{"id":"11-3","n":3,"en":"The coach forgave the player / for missing practice, / understanding that taking care of his health / was more important / than one training session.","ko":"코치는 그 선수를 용서했다 / 연습을 빠진 것에 대해 / 이해하면서 그의 건강을 돌보는 것이 / 더 중요하다는 것을 / 한 번의 훈련보다","nat":"코치는 선수가 연습에 빠진 것을 용서했고, 건강을 돌보는 일이 훈련 한 번보다 더 중요하다는 점을 이해했다."},{"id":"11-4","n":4,"en":"She forgave her friend / for breaking the promise, / which helped repair their friendship.","ko":"그녀는 친구를 용서했다 / 약속을 어긴 것에 대해, / 그리고 이것은 그들의 우정을 회복하는 데 도움이 되었다","nat":"그녀는 약속을 어긴 친구를 용서했고, 그것이 두 사람의 우정을 회복하는 데 도움이 되었다."},{"id":"11-5","n":5,"en":"The school band, / which consists of students / from different grades, / performs at various school events / throughout the year.","ko":"학교 밴드는, / 학생들로 구성되어 있는 / 다른 학년의, / 다양한 학교 행사에서 공연한다 / 일년 내내","nat":"여러 학년의 학생들로 이루어진 학교 밴드는 일 년 내내 다양한 학교 행사에서 공연한다."},{"id":"11-6","n":6,"en":"Our classroom jobs chart, / which consists of names on the left / and duties on the right, / helps everyone know their weekly responsibilities.","ko":"우리 교실 업무 차트는[1인1역 표는], / 왼쪽에 이름들로 구성되어 있는 / 그리고 오른쪽에 임무들(로 구성되어 있는), / 모든 사람이 그들의 주간 책임을 알도록 도와준다","nat":"왼쪽에 이름, 오른쪽에 맡은 일이 적힌 우리 교실 역할표는 모두가 자신의 주간 책임을 알 수 있게 도와준다."},{"id":"11-7","n":7,"en":"The solar system, / which is made up of the sun and eight planets / that move around it, / is held together by gravity.","ko":"태양계는, / 태양과 8개의 행성들로 이루어져 있는 / 그 주위를 도는, / 중력에 의해 결합되어 있다","nat":"태양계는 태양과 그 주위를 도는 여덟 개의 행성으로 이루어져 있으며, 중력에 의해 하나로 묶여 있다."}]},{"d":12,"s":[{"id":"12-1","n":1,"en":"He didn't mention the reason / for being late to class, / although it affected the group project presentation.","ko":"그는 이유를 언급하지 않았다 / 수업에 늦은 것에 대한, / 그것이 그룹 프로젝트 발표에 영향을 미쳤음에도 불구하고","nat":"그는 수업에 늦은 이유를 말하지 않았지만, 그 지각은 조별 과제 발표에 영향을 주었다."},{"id":"12-2","n":2,"en":"I mentioned the pajama party at lunch, / and she said she'd come / if her parents let her go.","ko":"나는 점심시간에 파자마 파티를 언급했다, / 그리고 그녀는 올 것이라고 말했다 / 부모님이 허락하신다면","nat":"점심시간에 내가 파자마 파티 이야기를 꺼내자, 그녀는 부모님이 보내 주신다면 오겠다고 말했다."},{"id":"12-3","n":3,"en":"Although many people think / they need to give expensive gifts, / a simple 'thank you' / that comes from the heart / will do / because true feelings matter more than money.","ko":"많은 사람들이 생각하지만 / 비싼 선물을 줘야 한다고, / 간단한 '고마워'가 / 마음에서 우러나는 / 충분할 것이다 / 진실한 감정이 돈보다 더 중요하기 때문에","nat":"많은 사람이 비싼 선물을 해야 한다고 생각하지만, 진심이 돈보다 더 중요하므로 마음에서 우러나온 간단한 '고맙다'는 말이면 충분하다."},{"id":"12-4","n":4,"en":"Since this old laptop / that my brother gave me / will do for basic school work / during the semester, / I don't need to ask my parents / to buy me an expensive new computer.","ko":"이 오래된 노트북이 / 형이 나에게 준 / 기본적인 학교 과제에는 충분할 것이므로 / 학기 동안, / 나는 부모님께 요청할 필요가 없다 / 나에게 비싼 새 컴퓨터를 사달라고","nat":"남자 형제가 준 이 오래된 노트북이 학기 동안 기본적인 학교 과제에는 충분할 것이므로, 나는 부모님께 비싼 새 컴퓨터를 사 달라고 할 필요가 없다."},{"id":"12-5","n":5,"en":"The reason he decided to put the meeting off / was that several team members were absent.","ko":"그가 회의를 연기하기로 결정한 이유는 / 몇몇 팀원들이 결석했기 때문이었다","nat":"그가 회의를 미루기로 한 이유는 팀원 여러 명이 결석했기 때문이었다."},{"id":"12-6","n":6,"en":"We planned to go hiking on Saturday, / but since the trail was too wet, / we decided to put it off.","ko":"우리는 토요일에 하이킹을 갈 계획이었다, / 하지만 산길이 너무 젖었기 때문에, / 우리는 그것을 연기하기로 결정했다.","nat":"우리는 토요일에 하이킹을 가기로 했지만, 길이 너무 젖어 있어서 미루기로 했다."},{"id":"12-7","n":7,"en":"I had to put off the assignment / because I suddenly got a terrible headache, / which made it impossible / to concentrate.","ko":"나는 과제를 연기해야 했다 / 내가 갑자기 심한 두통이 생겼기 때문에, / 그리고 이것은 불가능하게 만들었다 / 집중하는 것을","nat":"갑자기 심한 두통이 생겨 집중할 수 없었기 때문에 나는 과제를 미뤄야 했다."}]},{"d":13,"s":[{"id":"13-1","n":1,"en":"She practiced reading English aloud / in front of a mirror every day, / carefully listening to her own voice / to improve her pronunciation.","ko":"그녀는 영어 낭독을 연습했다 / 매일 거울 앞에서, / 자신의 목소리를 주의 깊게 들으면서 / 그녀의 발음을 개선하기 위해","nat":"그녀는 발음을 향상시키려고 매일 거울 앞에서 영어를 소리 내어 읽는 연습을 하며 자신의 목소리를 주의 깊게 들었다."},{"id":"13-2","n":2,"en":"Because he wanted to perform well on stage, / he practiced playing the guitar carefully, / focusing on the difficult parts of the songs.","ko":"그는 무대에서 잘 연주하고 싶었기 때문에, / 그는 기타 연주를 신중히 연습했다, / 노래의 어려운 부분들에 집중하면서","nat":"그는 무대에서 잘 공연하고 싶어서 노래의 어려운 부분에 집중하며 기타 연주를 꼼꼼히 연습했다."},{"id":"13-3","n":3,"en":"Our teacher came up with a fun way / to study history, / which helped us understand the past more deeply / and relate it to the present.","ko":"우리 선생님은 재미있는 방법을 생각해내셨다 / 역사를 공부하는, / 그리고 이것은 우리가 과거를 더 깊이 이해하는 데 도움이 되었다 / 그리고 그것을 현재와 연관시키는 데 (도움이 되었다)","nat":"우리 선생님은 역사를 공부하는 재미있는 방법을 생각해 냈고, 덕분에 우리는 과거를 더 깊이 이해하고 현재와 연결 지을 수 있었다."},{"id":"13-4","n":4,"en":"By coming up with a plan / to reduce school waste / through recycling and reusing items, / she helped create a cleaner environment.","ko":"계획을 세움으로써 / 학교 쓰레기를 줄이는 / 재활용과 물건 재사용을 통해, / 그녀는 더 깨끗한 환경을 만드는 데 도움을 주었다","nat":"그녀는 재활용과 물건 재사용으로 학교 쓰레기를 줄이는 계획을 생각해 내어 더 깨끗한 환경을 만드는 데 기여했다."},{"id":"13-5","n":5,"en":"He came up with an idea / to save money for a new bike / by saving part of his allowance every week, / which helped him reach his goal / faster than expected.","ko":"그는 아이디어를 생각해냈다 / 새 자전거를 위해 돈을 모을 / 매주 용돈의 일부를 저축함으로써, / 그리고 이것은 그가 목표를 달성하는 데 도움이 되었다 / 예상보다 빨리","nat":"그는 매주 용돈 일부를 저축해서 새 자전거 살 돈을 모으는 아이디어를 떠올렸고, 덕분에 예상보다 빨리 목표를 이뤘다."},{"id":"13-6","n":6,"en":"In an effort to support their community, / the students filled the box with old books / in order to donate them / to the local library.","ko":"지역사회를 지원하기 위한 노력으로, / 학생들은 오래된 책들로 상자를 채웠다 / 그것들을 기부하기 위해 / 지역 도서관에","nat":"학생들은 지역 사회를 돕기 위한 노력으로 상자를 오래된 책들로 채워 지역 도서관에 기부했다."},{"id":"13-7","n":7,"en":"The streets were filled with people / as the festival reached its peak / on Saturday evening.","ko":"거리는 사람들로 가득 찼다 / 축제가 절정에 달했을 때 / 토요일 저녁에","nat":"토요일 저녁 축제가 절정에 이르면서 거리는 사람들로 가득 찼다."}]},{"d":14,"s":[{"id":"14-1","n":1,"en":"Any application / that doesn't include a valid student ID number / will not be accepted / by the office.","ko":"어떤 지원서든 / 유효한 학생 ID 번호를 포함하지 않는 / 받아들여지지 않을 것이다 / 행정실에","nat":"유효한 학번이 없는 지원서는 어떤 것도 사무실에서 접수되지 않을 것이다."},{"id":"14-2","n":2,"en":"The final schedule for the trip / includes both group activities and free time / at the amusement park, / followed by lunch at the food court.","ko":"여행의 최종 일정은 / 단체 활동과 자유 시간을 모두 포함한다 / 놀이공원에서, / 이어서 푸드코트에서 점심 식사를 한다","nat":"여행의 최종 일정에는 놀이공원에서의 단체 활동과 자유 시간이 모두 포함되며, 그 뒤에 푸드코트에서 점심을 먹는다."},{"id":"14-3","n":3,"en":"The festival concluded / with a powerful K-pop dance performance / that not only showcased the students' talent / but also highlighted their effort and teamwork.","ko":"축제는 끝났다 / 강렬한 K-pop 댄스 공연으로 / 학생들의 재능을 보여줬을 뿐만 아니라 / 그들의 노력과 팀워크도 부각시킨","nat":"축제는 학생들의 재능뿐 아니라 노력과 팀워크까지 돋보이게 한 강렬한 케이팝 댄스 공연으로 마무리되었다."},{"id":"14-4","n":4,"en":"Our project was concluded successfully / and showed / how well we worked as a team.","ko":"우리 프로젝트는 성공적으로 끝났다 / 그리고 보여주었다 / 우리가 팀으로 얼마나 잘 협력했는지를","nat":"우리 프로젝트는 성공적으로 마무리되었고, 우리가 팀으로서 얼마나 잘 협력했는지를 보여주었다."},{"id":"14-5","n":5,"en":"The case not only protects your phone / from getting wet in the rain / but also guards it / against accidental drops.","ko":"케이스는 너의 휴대폰을 보호할 뿐만 아니라 / 비에 젖는 것으로부터 / 또한 그것을 지켜준다 / 실수로 떨어뜨릴 때도","nat":"그 케이스는 비에 젖지 않게 휴대폰을 보호할 뿐 아니라 실수로 떨어뜨리는 상황에서도 휴대폰을 지켜준다."},{"id":"14-6","n":6,"en":"Sunscreen not only protects your skin from the sun / but also helps keep it healthy.","ko":"자외선 차단제는 태양으로부터 피부를 보호할 뿐만 아니라 / 그것을 건강하게 유지하는 데 도움을 주기도 한다","nat":"자외선 차단제는 햇빛으로부터 피부를 보호할 뿐 아니라 피부를 건강하게 유지하는 데도 도움이 된다."},{"id":"14-7","n":7,"en":"A helmet protects your head / from injuries / by absorbing the impact / in unexpected accidents.","ko":"헬멧은 머리를 보호한다 / 부상으로부터 / 충격을 흡수함으로써 / 예상치 못한 사고에서","nat":"헬멧은 예기치 못한 사고에서 충격을 흡수하여 머리를 부상으로부터 보호한다."}]},{"d":15,"s":[{"id":"15-1","n":1,"en":"The train leaves Daejeon at 7 a.m. / and, with no unnecessary stops along the way, / reaches central Seoul / in under an hour.","ko":"기차는 오전 7시에 대전을 떠난다 / 그리고, 도중에 불필요한 정차 없이, / 서울 중심가에 도착한다 / 한 시간 안에","nat":"그 열차는 오전 7시에 대전을 출발해 가는 길에 불필요한 정차 없이 한 시간 안에 서울 중심부에 도착한다."},{"id":"15-2","n":2,"en":"After checking the weather forecast, / my parents chose to leave for Busan by train / instead of driving.","ko":"일기예보를 확인한 후, / 부모님은 기차로 부산으로 떠나기로 선택하셨다 / 운전하는 대신에","nat":"일기예보를 확인한 뒤, 부모님은 운전하는 대신 기차로 부산에 가기로 하셨다."},{"id":"15-3","n":3,"en":"The strong wind left the garden so messy / that we didn't even know where to start / cleaning the areas / that were full of debris.","ko":"강한 바람이 정원을 너무 지저분하게 만들어서 / 우리가 어디서부터 시작해야 할지조차 몰랐다 / 그 지역들을 청소하는 것을 / 잔해로 가득 찬","nat":"강한 바람 때문에 정원이 너무 지저분해져서, 우리는 잔해로 가득한 곳들을 어디서부터 청소해야 할지조차 몰랐다."},{"id":"15-4","n":4,"en":"She couldn't help crying / because the music and lines made the ending feel so touching.","ko":"그녀는 울지 않을 수 없었다 / 음악과 대사가 결말을 너무 감동적으로 느끼게 했기 때문에","nat":"음악과 대사 때문에 결말이 너무 감동적으로 느껴져서 그녀는 울지 않을 수 없었다."},{"id":"15-5","n":5,"en":"I couldn't help feeling nervous, / even though I had gone over the questions many times / before the interview.","ko":"나는 긴장하지 않을 수 없었다, / 비록 내가 그 질문들을 여러 번 검토했었지만 / 면접 전에","nat":"면접 전에 질문들을 여러 번 살펴보았는데도 나는 긴장하지 않을 수 없었다."},{"id":"15-6","n":6,"en":"He came across his childhood teacher / while browsing through books, / and was moved / that she still remembered his name.","ko":"그는 어린 시절 선생님을 우연히 만났다 / 책들을 둘러보던 중에, / 그리고 감동받았다 / 그녀가 여전히 그의 이름을 기억하고 있다는 것에","nat":"그는 책을 훑어보다가 어린 시절 선생님을 우연히 만났고, 선생님이 아직도 자신의 이름을 기억하는 것에 감동했다."},{"id":"15-7","n":7,"en":"I came across an article about climate change, / which not only explained the issue clearly / but also made me rethink my daily habits.","ko":"나는 기후 변화에 관한 기사를 우연히 발견했다, / 그리고 그것은 그 문제를 명확하게 설명할 뿐만 아니라 / 내 일상 습관을 다시 생각하게 만들었다","nat":"나는 기후 변화에 관한 기사를 우연히 읽었는데, 그 기사는 문제를 명확하게 설명해 주었을 뿐 아니라 내 일상 습관을 다시 생각하게 만들었다."}]},{"d":16,"s":[{"id":"16-1","n":1,"en":"She described the man to the police officer, / recalling every detail she could remember / about what happened.","ko":"그녀는 경찰관에게 그 남자를 묘사했다 / 그녀가 기억할 수 있는 모든 세부사항을 떠올리면서 / 일어난 일에 대한","nat":"그녀는 일어난 일에 대해 기억나는 모든 세부 사항을 떠올리며 경찰관에게 그 남자를 설명했다."},{"id":"16-2","n":2,"en":"I described my lost phone to the staff, / including every detail I could remember, / such as the cracked screen, the green case, and even the wallpaper photo of my dog.","ko":"나는 직원에게 분실한 휴대폰을 묘사했다, / 내가 기억할 수 있는 모든 세부사항을 포함하여, / 깨진 화면, 초록색 케이스, 심지어 내 강아지의 배경화면 사진까지","nat":"나는 금이 간 화면, 초록색 케이스, 심지어 우리 개 사진으로 된 배경화면까지, 기억나는 모든 세부 사항을 직원에게 말하며 잃어버린 휴대폰을 설명했다."},{"id":"16-3","n":3,"en":"She turned down the job offer, / explaining / that she wasn't ready to leave her family / and move to another country.","ko":"그녀는 취업 제안을 거절했다, / 설명하면서 / 그녀가 가족을 떠날 준비가 되지 않았다고 / 다른 나라로 이주할 (준비가 되지 않았다고)","nat":"그녀는 가족을 떠나 다른 나라로 이사할 준비가 되지 않았다고 설명하며 그 일자리 제안을 거절했다."},{"id":"16-4","n":4,"en":"Could you please turn down the volume on the TV / so I can concentrate on my homework?","ko":"TV 볼륨을 줄여주시겠어요 / 내가 숙제에 집중할 수 있도록","nat":"내가 숙제에 집중할 수 있게 TV 소리를 좀 줄여 줄 수 있겠니?"},{"id":"16-5","n":5,"en":"The background music was making it difficult / to have a conversation, / so I politely asked the staff / to turn it down.","ko":"배경 음악이 어렵게 만들고 있었다 / 대화하는 것을 / 그래서 나는 직원에게 정중하게 요청했다 / 그것을 줄여달라고","nat":"배경 음악 때문에 대화하기 어려워서, 나는 직원에게 소리를 줄여 달라고 정중하게 부탁했다."},{"id":"16-6","n":6,"en":"This photo, / taken by my dad on the last day of our vacation, / always reminds me of / how peaceful and happy I felt on Jeju Island.","ko":"이 사진은, / 우리 휴가의 마지막 날 아빠가 찍은, / 항상 나에게 상기시켜준다 / 내가 제주도에서 얼마나 평화롭고 행복하게 느꼈는지를","nat":"휴가 마지막 날 아빠가 찍어 주신 이 사진을 볼 때마다 제주도에서 얼마나 평화롭고 행복했는지가 떠오른다."},{"id":"16-7","n":7,"en":"The smell of cookies, spreading through the hallway, / reminds me / not only of my grandmother's kitchen / but also of the quiet evenings we spent baking together.","ko":"쿠키 냄새가, 복도를 통해 퍼지는, / 나에게 상기시켜준다 / 할머니의 부엌뿐만 아니라 / 또한 우리가 함께 베이킹하며 보낸 조용한 저녁들도","nat":"복도에 퍼지는 쿠키 냄새는 할머니의 부엌뿐 아니라 함께 베이킹하며 보낸 조용한 저녁들도 떠올리게 한다."}]},{"d":17,"s":[{"id":"17-1","n":1,"en":"Being a good friend involves understanding / that just quietly listening can mean more / than offering advice.","ko":"좋은 친구가 되는 것은 이해하는 것을 포함한다 / 그냥 조용히 듣는 것이 더 의미가 있을 수 있다는 것을 / 조언을 제공하는 것보다","nat":"좋은 친구가 되려면 그저 조용히 들어주는 것이 조언을 해주는 것보다 더 큰 의미일 수 있다는 점을 이해해야 한다."},{"id":"17-2","n":2,"en":"Cleaning the house involves various household tasks / that must be done regularly, / including dusting, sweeping, and mopping.","ko":"집 청소는 다양한 가사 일을 포함한다 / 정기적으로 해야 하는, / 먼지 닦기, 쓸기, 그리고 걸레질을 포함하여","nat":"집을 청소하는 데에는 먼지 털기, 쓸기, 걸레질하기를 포함해 규칙적으로 해야 하는 다양한 집안일이 따른다."},{"id":"17-3","n":3,"en":"Over time, animals evolve / to survive harsh conditions / that require special changes to their bodies.","ko":"시간이 지나면서, 동물들은 진화한다 / 혹독한 환경에서 생존하기 위해 / 그들의 몸에 특별한 변화를 요구하는","nat":"시간이 지나면서 동물들은 몸에 특별한 변화가 필요한 혹독한 환경에서 살아남기 위해 진화한다."},{"id":"17-4","n":4,"en":"The game, which began with basic features, / has evolved significantly over time / to include better graphics and more challenging levels.","ko":"그 게임은, 기본적인 기능들로 시작했던, / 시간이 지나면서 상당히 발전해왔다 / 더 나은 그래픽과 더 도전적인 레벨들을 포함하도록","nat":"기본적인 기능으로 시작한 그 게임은 시간이 지나면서 크게 발전하여 더 나은 그래픽과 더 도전적인 레벨까지 갖추게 되었다."},{"id":"17-5","n":5,"en":"It is important for students / to participate in group projects / because working together teaches them cooperation skills / they will need later.","ko":"학생들에게는 중요하다 / 그룹 프로젝트에 참여하는 것이 / 함께 일하는 것이 그들에게 협력 기술을 가르치기 때문에 / 나중에 필요할","nat":"함께 작업하면 나중에 필요할 협동 기술을 배울 수 있으므로 학생들이 그룹 프로젝트에 참여하는 것은 중요하다."},{"id":"17-6","n":6,"en":"Participating in cultural events teaches students new perspectives, / which makes them more open-minded about the world.","ko":"문화 행사에 참여하는 것은 학생들에게 새로운 관점을 가르친다, / 그리고 그것은 그들을 세상에 대해 더 열린 마음을 갖게 만든다","nat":"문화 행사에 참여하면 학생들이 새로운 관점을 배우게 되고, 그 덕분에 세상에 대해 더 열린 마음을 갖게 된다."},{"id":"17-7","n":7,"en":"One of my classmates participated in the school singing contest last week / to challenge herself / and gain more confidence.","ko":"내 반 친구 중 한 명이 지난 주 학교 노래 경연대회에 참가했다 / 스스로에게 도전하기 위해 / 그리고 더 많은 자신감을 얻기 위해","nat":"내 반 친구 한 명이 자신에게 도전하고 자신감을 더 키우기 위해 지난주 학교 노래 대회에 참가했다."}]},{"d":18,"s":[{"id":"18-1","n":1,"en":"The loud construction noise outside the classroom, / which started just before the test began, / caused us discomfort / and made it almost impossible to focus.","ko":"교실 밖의 시끄러운 공사 소음이, / 시험이 시작되기 직전에 시작된, / 우리에게 불편함을 일으켰다 / 그리고 집중하는 것을 거의 불가능하게 만들었다","nat":"시험이 시작되기 직전에 교실 밖에서 시작된 시끄러운 공사 소음 때문에 우리는 불편했고 집중하기가 거의 불가능했다."},{"id":"18-2","n":2,"en":"The loud thunder at midnight / caused the little boy so much fear / that he ran to his parents' room in tears.","ko":"한밤중의 시끄러운 천둥이 / 어린 소년에게 너무 많은 두려움을 일으켜서 / 그는 눈물을 흘리며 부모님 방으로 뛰어갔다","nat":"한밤중의 요란한 천둥소리에 어린 소년은 너무 무서워서 울면서 부모님 방으로 달려갔다."},{"id":"18-3","n":3,"en":"The bad weather caused the baseball game to be canceled / just minutes before the match, / leaving many people disappointed.","ko":"나쁜 날씨가 야구 경기를 취소되게 만들었다 / 경기 몇 분 전에, / 많은 사람들을 실망시키며","nat":"궂은 날씨 때문에 경기를 불과 몇 분 앞두고 야구 경기가 취소되어 많은 사람들이 실망했다."},{"id":"18-4","n":4,"en":"My parents called off the trip to the amusement park on Sunday / because of the heavy rain, / and they decided to go next weekend instead.","ko":"우리 부모님은 일요일 놀이공원 여행을 취소했다 / 폭우 때문에, / 그리고 그들은 대신 다음 주말에 가기로 결정했다","nat":"부모님은 폭우 때문에 일요일에 가려던 놀이공원 여행을 취소하고 대신 다음 주말에 가기로 했다."},{"id":"18-5","n":5,"en":"I called off my plan / to join the school speech contest / because my schedule was so full / that I couldn't find time / to prepare properly.","ko":"나는 계획을 취소했다 / 학교 연설 대회에 참가하려던 / 내 일정이 너무 꽉 차서 / 시간을 찾을 수 없었기 때문에 / 제대로 준비할","nat":"일정이 너무 빡빡해서 제대로 준비할 시간을 낼 수 없었기 때문에 나는 학교 말하기 대회에 참가하려던 계획을 취소했다."},{"id":"18-6","n":6,"en":"I was really surprised at the ending of the movie I watched last night / because it completely changed / the meaning of the whole story.","ko":"나는 내가 어젯밤에 본 영화의 결말에 정말 놀랐다 / 왜냐하면 그것이 완전히 바꿨기 때문에 / 전체 이야기의 의미를","nat":"어젯밤에 본 영화의 결말이 전체 이야기의 의미를 완전히 바꿔 놓아서 나는 정말 놀랐다."},{"id":"18-7","n":7,"en":"She was surprised at the number of people at the concert, / which was much larger / than she had expected / for such a new band.","ko":"그녀는 콘서트의 사람 수에 놀랐다 / 그리고 그것은 훨씬 더 많았다 / 그녀가 예상했던 것보다 / 신인 밴드 치고는","nat":"그녀는 신생 밴드치고는 예상보다 훨씬 많은 콘서트 관객 수에 놀랐다."}]},{"d":19,"s":[{"id":"19-1","n":1,"en":"After reading several articles about climate change, / she suggested a topic related to environmental issues / to the teacher / for their group project.","ko":"기후 변화에 관한 여러 기사를 읽은 후, / 그녀는 환경 문제와 관련된 주제를 제안했다 / 선생님께 / 그들의 그룹 프로젝트를 위해","nat":"기후 변화에 관한 기사를 여러 편 읽은 뒤, 그녀는 모둠 프로젝트를 위해 환경 문제와 관련된 주제를 선생님께 제안했다."},{"id":"19-2","n":2,"en":"He suggested wearing a thick, waterproof jacket, / which would be helpful / in case of unexpected rain or cold winds / during the mountain hike.","ko":"그는 두껍고 방수되는 재킷을 입기를 제안했다, / 그리고 그것은 도움이 될 것이다 / 예상치 못한 비나 차가운 바람의 경우에 / 산행 동안","nat":"그는 두껍고 방수가 되는 재킷을 입자고 제안했는데, 산행 중에 갑자기 비가 오거나 찬바람이 불 때 도움이 될 것이기 때문이다."},{"id":"19-3","n":3,"en":"The doctor suggested / that she should get more rest / not only to recover faster from the flu / but also to stay healthy in the long run.","ko":"의사는 제안했다 / 그녀가 더 많은 휴식을 취해야 한다고 / 독감에서 더 빨리 회복하기 위해서뿐만 아니라 / 장기적으로 건강하게 지내기 위해서도","nat":"의사는 독감에서 더 빨리 회복할 뿐 아니라 장기적으로 건강을 유지하려면 그녀가 더 많이 쉬어야 한다고 권했다."},{"id":"19-4","n":4,"en":"Ice cream tends to sell more on weekends / when families gather at parks for picnics, / especially as temperatures rise.","ko":"아이스크림은 주말에 더 많이 팔리는 경향이 있다 / 가족들이 피크닉을 위해 공원에 모일 때, / 특히 기온이 오를 때","nat":"아이스크림은 가족들이 소풍하러 공원에 모이는 주말에, 특히 기온이 오를 때 더 많이 팔리는 경향이 있다."},{"id":"19-5","n":5,"en":"These toys are a big hit with kids / and sell very quickly at most stores / during the holiday season.","ko":"이 장난감들은 아이들에게 큰 인기다 / 그리고 대부분의 상점에서 매우 빨리 팔린다 / 휴일 시즌 동안","nat":"이 장난감들은 아이들에게 큰 인기를 끌어 연말연시에는 대부분의 가게에서 아주 빨리 팔린다."},{"id":"19-6","n":6,"en":"He thanked his dad / for driving such a long distance / just to drop him off at the concert.","ko":"그는 아빠에게 감사했다 / 그런 먼 거리를 운전해주신 것에 대해 / 단지 콘서트에서 내려주기 위해","nat":"그는 단지 자신을 콘서트장에 내려 주려고 그렇게 먼 거리를 운전해 준 아빠에게 고마워했다."},{"id":"19-7","n":7,"en":"During lunch break, / she thanked her classmate / for lending her the science notes, / saying they really helped her understand / what she missed.","ko":"점심시간 동안, / 그녀는 반 친구에게 감사했다 / 과학 노트를 빌려준 것에 대해, / 그것들이 정말로 그녀가 이해하는 데 도움이 되었다고 말하면서 / 그녀가 놓친 것을","nat":"점심시간에 그녀는 반 친구가 과학 필기를 빌려 준 것에 고마워하며, 그 덕분에 놓친 내용을 이해하는 데 정말 도움이 되었다고 말했다."}]},{"d":20,"s":[{"id":"20-1","n":1,"en":"My mom quietly offered me a warm blanket, / reminding me not to stay up too late.","ko":"우리 엄마는 조용히 따뜻한 담요를 건네주었다, / 나에게 너무 늦게까지 깨어있지 말라고 상기시키면서","nat":"엄마는 조용히 따뜻한 담요를 건네주면서 너무 늦게까지 깨어 있지 말라고 일러 주었다."},{"id":"20-2","n":2,"en":"The hotel offered us a comfortable room with a nice view / at a reasonable price, / so we decided to book an extra night.","ko":"호텔은 우리에게 좋은 전망을 가진 편안한 방을 제공했다 / 합리적인 가격에, / 그래서 우리는 하룻밤 더 예약하기로 결정했다","nat":"그 호텔이 전망 좋은 편안한 방을 적당한 가격에 제공해 줘서 우리는 하룻밤을 더 예약하기로 했다."},{"id":"20-3","n":3,"en":"To help me study before the quiz, / my friend offered me not only a highlighter / but also her notes.","ko":"내가 퀴즈 전에 공부하는 것을 돕기 위해, / 내 친구는 나에게 형광펜뿐만 아니라 / 그녀의 노트도 제공했다","nat":"퀴즈 전에 내가 공부하는 것을 도우려고 친구는 형광펜뿐 아니라 자기 필기까지 내게 건네주었다."},{"id":"20-4","n":4,"en":"She fell down / while running in the hallway / and dropped all her books, / which made her feel embarrassed.","ko":"그녀는 넘어졌다 / 복도에서 뛰어가던 중에 / 그리고 모든 책을 떨어뜨렸다, / 그리고 그것은 그녀를 당황스럽게 만들었다","nat":"그녀는 복도에서 뛰다가 넘어져 책을 전부 떨어뜨렸고, 그 일로 당황했다."},{"id":"20-5","n":5,"en":"The girl fell down during P.E. class / and scraped her knee on the rough playground, / leaving dirt marks on her school uniform.","ko":"그 소녀는 체육 시간에 넘어졌다 / 그리고 거친 운동장에서 무릎을 긁었다, / 그래서 교복에 흙 자국을 남겼다","nat":"그 소녀는 체육 시간에 넘어져 거친 운동장에서 무릎이 까졌고, 교복에는 흙 자국이 남았다."},{"id":"20-6","n":6,"en":"My little sister is interested in drawing cute animals / and decorating each page with colorful stickers / she got as birthday gifts.","ko":"내 여동생은 귀여운 동물들을 그리는 것에 관심이 있다 / 그리고 각 페이지를 닻채로운 스티커로 장식하는 것에 / 그녀가 생일 선물로 받은","nat":"내 여동생은 귀여운 동물을 그리고, 생일 선물로 받은 알록달록한 스티커로 각 페이지를 꾸미는 것에 관심이 많다."},{"id":"20-7","n":7,"en":"He is really interested in making short videos with his friends / and posting them on their group chat, / which always leads to everyone sharing funny comments.","ko":"그는 친구들과 짧은 비디오를 만드는 것에 정말 관심이 있다 / 그리고 그것들을 그룹 채팅에 올리는 것에 (관심이 있다), / 그리고 그것은 항상 모든 사람이 재미있는 댓글을 공유하게 만든다","nat":"그는 친구들과 짧은 영상을 만들어 단체 채팅방에 올리는 것에 정말 관심이 많고, 그러면 항상 모두가 재미있는 댓글을 주고받게 된다."}]},{"d":21,"s":[{"id":"21-1","n":1,"en":"She tore her jeans / while climbing the fence, / which not only left a scratch on her knee / but also ruined her favorite pair.","ko":"그녀는 청바지를 찢었다 / 울타리를 오르던 중에, / 그리고 그것은 무릎에 긁힌 자국을 남겼을 뿐만 아니라 / 그녀가 가장 좋아하는 청바지를 망쳤다","nat":"그녀는 울타리를 오르다가 청바지를 찢었고, 그 바람에 무릎에 긁힌 자국이 났을 뿐 아니라 가장 아끼던 바지도 못 쓰게 되었다."},{"id":"21-2","n":2,"en":"I tore the wrapping paper so fast / that I missed the handwritten note / taped on the inside.","ko":"나는 포장지를 너무 빨리 찢어서 / 나는 손으로 쓴 쪽지를 놓쳤다 / 안쪽에 테이프로 붙어있던","nat":"나는 포장지를 너무 빨리 뜯어서 안쪽에 붙어 있던 손글씨 쪽지를 보지 못했다."},{"id":"21-3","n":3,"en":"At the party, / they helped themselves to sandwiches, / which were placed on a table near the drinks.","ko":"파티에서, / 그들은 샌드위치를 마음껏 먹었다, / 그리고 그것들은 음료수 근처 테이블에 놓여 있었다","nat":"파티에서 그들은 음료 근처 탁자에 놓인 샌드위치를 마음껏 집어 먹었다."},{"id":"21-4","n":4,"en":"She helped herself to some fruit on the table, / placing a few pieces on a small napkin / she held in her hand.","ko":"그녀는 테이블 위의 과일을 마음껏 먹었다, / 몇 조각을 작은 냅킨 위에 올려놓으면서 / 그녀가 그녀의 손에 들고 있던","nat":"그녀는 탁자 위의 과일을 몇 조각 집어 손에 든 작은 냅킨 위에 올려놓았다."},{"id":"21-5","n":5,"en":"I spent most of my weekend / reading comic books / since the rainy weather made it hard / to do anything outside.","ko":"나는 주말 대부분을 보냈다 / 만화책을 읽으면서 / 비오는 날씨가 어렵게 만들었기 때문에 / 밖에서 무엇이든 하는 것을","nat":"비 오는 날씨 때문에 밖에서 뭔가를 하기 어려워서 나는 주말 대부분을 만화책을 읽으며 보냈다."},{"id":"21-6","n":6,"en":"He spent five dollars / buying snacks at the convenience store, / grabbing a few energy bars and a bottle of iced tea / before heading back to the library.","ko":"그는 5달러를 썼다 / 편의점에서 간식을 사는 데, / 몇 개의 에너지바와 아이스 커피 한 병을 집으면서 / 도서관으로 돌아가기 전에","nat":"그는 편의점에서 에너지바 몇 개와 아이스커피 한 병을 집어 들며 간식 값으로 5달러를 쓴 뒤 도서관으로 돌아갔다."},{"id":"21-7","n":7,"en":"The students spent some time / wiping the desks and picking up trash / to help their teacher after the event.","ko":"학생들은 시간을 보냈다 / 책상을 닦고 쓰레기를 줍는 데 / 행사 후 선생님을 돕기 위해","nat":"학생들은 행사가 끝난 뒤 선생님을 돕기 위해 한동안 책상을 닦고 쓰레기를 주웠다."}]},{"d":22,"s":[{"id":"22-1","n":1,"en":"He always greeted his neighbors politely every morning, / especially those / whom he often saw on his way out.","ko":"그는 항상 매일 아침 이웃들에게 정중하게 인사했다, / 특히 그런 사람들에게 / 그가 나갈 때 자주 마주치는","nat":"그는 매일 아침 이웃들에게 공손하게 인사했는데, 특히 나가는 길에 자주 마주치던 이웃들에게 그랬다."},{"id":"22-2","n":2,"en":"The teacher greeted her students warmly every morning, / which made students feel comfortable / speaking up in class.","ko":"선생님은 매일 아침 학생들에게 따뜻하게 인사했다, / 그리고 그것은 학생들이 편안하게 느끼게 만들었다 / 수업에서 의견을 내는 것을","nat":"선생님이 매일 아침 학생들에게 따뜻하게 인사해 주어서 학생들은 수업 시간에 편하게 말할 수 있었다."},{"id":"22-3","n":3,"en":"I took off my bag / and hung it on the hook / to keep it from getting dirty on the floor.","ko":"나는 가방을 벗었다 / 그리고 그것을 고리에 걸었다 / 바닥에서 더러워지지 않게 하기 위해","nat":"나는 가방을 벗어 고리에 걸어서 바닥에서 더러워지지 않게 했다."},{"id":"22-4","n":4,"en":"He had his gloves on / during the walk, / but he took them off / before stepping into the house.","ko":"그는 장갑을 끼고 있었다 / 산책하는 동안, / 하지만 그는 장갑을 벗었다 / 집에 들어가기 전에","nat":"그는 산책하는 동안 장갑을 끼고 있었지만 집에 들어서기 전에 벗었다."},{"id":"22-5","n":5,"en":"The plane took off on time / even though the morning fog made passengers worry / about cancellation.","ko":"비행기는 정시에 이륙했다 / 아침 안개가 승객들을 걱정하게 만들었음에도 불구하고 / 취소에 대해","nat":"아침 안개 때문에 승객들이 결항을 걱정했는데도 비행기는 제시간에 이륙했다."},{"id":"22-6","n":6,"en":"She has always viewed her dog / as a loyal friend / rather than a simple house pet.","ko":"그녀는 항상 그녀의 개를 여겨왔다 / 충실한 친구로 / 단순한 애완동물보다는","nat":"그녀는 자기 개를 단순한 애완동물이 아니라 충실한 친구로 여겨 왔다."},{"id":"22-7","n":7,"en":"Some kids view English cartoons / as a useful way / to improve their listening skills / and understand cultural expressions.","ko":"몇몇 아이들은 영어 만화를 여긴다 / 유용한 방법으로 / 그들의 듣기 실력을 향상시키는 / 그리고 문화적 표현을 이해하는","nat":"일부 아이들은 영어 만화를 듣기 실력을 높이고 문화적 표현을 이해하는 유용한 방법으로 여긴다."}]},{"d":23,"s":[{"id":"23-1","n":1,"en":"The team elected Jisoo the new captain / because everyone thought / that she had the right skills and attitude / to lead them well.","ko":"팀은 지수를 새 주장으로 선출했다 / 모든 사람이 생각했기 때문에 / 그녀가 올바른 기술과 태도를 가지고 있다고 / 그들을 잘 이끌 수 있는","nat":"모두가 지수에게 팀을 잘 이끌 능력과 태도가 있다고 생각해서 팀은 지수를 새 주장으로 뽑았다."},{"id":"23-2","n":2,"en":"The students elected Jiwon the best speaker in the debate, / impressed not only by her logic / but also by her calm confidence.","ko":"학생들은 지원이를 토론에서 최고의 연설가로 선출했다, / 그녀의 논리뿐만 아니라 / 그녀의 차분한 자신감에도 감명받아서","nat":"학생들은 지원의 논리뿐 아니라 침착한 자신감에도 감명을 받아 지원을 토론 최고의 연설자로 뽑았다."},{"id":"23-3","n":3,"en":"Do you mind turning down the sound / during the movie, / especially during scenes / where the background music is too loud?","ko":"소리를 줄이는 것을 꺼리시나요 / 영화를 보는 동안, / 특히 장면들에서 / 배경음악이 너무 큰?","nat":"영화를 보는 동안, 특히 배경음악이 너무 큰 장면에서는 소리를 좀 줄여 줄 수 있니?"},{"id":"23-4","n":4,"en":"Do you mind showing me / how to save this file / with a different name / so that I can find it easily later?","ko":"나에게 보여주는 것을 꺼리시나요 / 이 파일을 저장하는 방법을 / 다른 이름으로 / 제가 나중에 쉽게 찾을 수 있도록?","nat":"나중에 쉽게 찾을 수 있도록 이 파일을 다른 이름으로 저장하는 방법을 알려 줄 수 있니?"},{"id":"23-5","n":5,"en":"VIP stands for Very Important Person, / which means / that these people receive special treatment / wherever they go.","ko":"VIP는 Very Important Person의 줄임말이다, / 그리고 이것은 의미한다 / 이 사람들이 특별한 대우를 받는다는 것을 / 그들이 가는 어디에서든지","nat":"VIP는 Very Important Person의 약자로, 이런 사람들은 어디를 가든 특별한 대우를 받는다는 뜻이다."},{"id":"23-6","n":6,"en":"In this chart, / the red line stands for temperature / recorded each month / throughout the year, / clearly showing / how it rises during summer / and drops in winter.","ko":"이 차트에서, / 빨간 선은 온도를 나타낸다 / 매달 기록된 / 일 년 내내, / 명확히 보여주면서 / 그것이 여름 동안 어떻게 올라가는지를 / 그리고 겨울에 떨어지는지를","nat":"이 차트에서 빨간 선은 일 년 동안 매달 기록된 기온을 나타내며, 기온이 여름에 오르고 겨울에 떨어지는 모습을 분명하게 보여 준다."},{"id":"23-7","n":7,"en":"They stand for peace, / trusting that their actions will speak louder than words.","ko":"그들은 평화를 지지한다, / 그들의 행동이 말보다 더 크게 말할 것이라고 믿으면서","nat":"그들은 말보다 행동이 더 큰 울림을 줄 것이라고 믿으며 평화를 지지한다."}]},{"d":24,"s":[{"id":"24-1","n":1,"en":"She corrected her answer / by carefully checking / how her steps differed from those / shown on the board.","ko":"그녀는 그녀의 답을 수정했다 / 신중히 확인함으로써 / 그녀의 단계들이 그것들과 어떻게 다른지를 / 칠판에 보여진 (그것들과)","nat":"그녀는 자신의 풀이 단계가 칠판에 나온 단계와 어떻게 다른지 꼼꼼히 확인해서 답을 고쳤다."},{"id":"24-2","n":2,"en":"We corrected the report / before turning it in / to make sure / all the facts were accurate.","ko":"우리는 보고서를 수정했다 / 그것을 제출하기 전에 / 확실히 하기 위해 / 모든 사실들이 정확한지","nat":"우리는 모든 내용이 정확한지 확실히 하려고 보고서를 제출하기 전에 수정했다."},{"id":"24-3","n":3,"en":"They collected empty bottles / after the event, / and separated them into different bins / for proper recycling.","ko":"그들은 빈 병들을 수집했다 / 행사 후에, / 그리고 그것들을 다른 통들로 분류했다 / 적절한 재활용을 위해","nat":"그들은 행사가 끝난 뒤 빈 병을 모아 제대로 재활용되도록 서로 다른 통에 나누어 담았다."},{"id":"24-4","n":4,"en":"My little brother collects toy cars / as a hobby / and displays his favorites / on the top shelf / where everyone can see them.","ko":"내 남동생은 장난감 자동차를 수집한다 / 취미로 / 그리고 그의 좋아하는 것들을 전시한다 / 맨 위 선반에 / 모든 사람이 볼 수 있는 곳에","nat":"내 남동생은 취미로 장난감 자동차를 모으고, 가장 좋아하는 것들은 모두가 볼 수 있는 맨 위 선반에 진열한다."},{"id":"24-5","n":5,"en":"We made use of a translation app / to ask questions / about the ingredients / used in each dish.","ko":"우리는 번역 앱을 활용했다 / 질문하기 위해 / 재료들에 대해 / 각 요리에 사용된","nat":"우리는 번역 앱을 활용해 각 요리에 들어간 재료에 대해 질문했다."},{"id":"24-6","n":6,"en":"He made use of the school gym / during the weekend, / spending several hours / practicing different types of shooting drills.","ko":"그는 학교 체육관을 활용했다 / 주말 동안, / 몇 시간을 보내면서 / 다양한 종류의 슈팅 연습을 하며","nat":"그는 주말 동안 학교 체육관을 이용해 여러 종류의 슈팅 훈련을 하며 몇 시간을 보냈다."},{"id":"24-7","n":7,"en":"She made use of a timer / to limit distractions / while studying for her final exams.","ko":"그녀는 타이머를 활용했다 / 방해요소들을 제한하기 위해 / 그녀의 기말고사를 위해 공부하는 동안","nat":"그녀는 기말고사를 공부하는 동안 방해 요소를 줄이려고 타이머를 활용했다."}]},{"d":25,"s":[{"id":"25-1","n":1,"en":"After my computer broke down / for the third time this month, / I finally decided to replace it.","ko":"내 컴퓨터가 고장 난 후 / 이번 달 세 번째로, / 나는 마침내 그것을 교체하기로 결정했다","nat":"이번 달 들어 컴퓨터가 세 번째로 고장 나자, 나는 마침내 컴퓨터를 바꾸기로 결심했다."},{"id":"25-2","n":2,"en":"Although the goal was clear, / the group's plan broke down / because the members failed to work together effectively.","ko":"목표가 명확했음에도 불구하고, / 그룹의 계획은 실패했다 / 구성원들이 효과적으로 함께 일하는데 실패했기 때문에","nat":"목표는 분명했지만, 구성원들이 효과적으로 협력하지 못해서 그 모둠의 계획은 무너졌다."},{"id":"25-3","n":3,"en":"After losing his dog, / the boy broke down / and didn't say anything / for the rest of the night.","ko":"그의 개를 잃은 후, / 그 소년은 (감정적으로) 무너졌다 / 그리고 아무 말도 하지 않았다 / 그날 밤 나머지 시간 동안","nat":"개를 잃은 뒤 소년은 무너져 내렸고, 그날 밤이 끝날 때까지 아무 말도 하지 않았다."},{"id":"25-4","n":4,"en":"What once felt fresh / has become something / they're tired of / because it plays everywhere they go.","ko":"한때 신선하게 느껴졌던 것이 / 무언가가 되었다 / 그들이 지겨워하는 / 그들이 가는 곳마다 나오기 때문에","nat":"한때는 신선하게 느껴졌던 것이 이제는 그들이 가는 곳마다 흘러나와서 싫증 나는 것이 되어 버렸다."},{"id":"25-5","n":5,"en":"She's tired of doing the same thing day after day, / so she decided / to try something different and exciting.","ko":"그녀는 매일매일 같은 일을 하는 것에 지쳤다, / 그래서 그녀는 결정했다 / 다르고 흥미진진한 것을 시도하기로","nat":"그녀는 날마다 똑같은 일을 하는 데 싫증이 나서, 색다르고 신나는 일을 해 보기로 마음먹었다."},{"id":"25-6","n":6,"en":"After comparing her old phone / with the new one, which had a much better camera, / she finally made her choice.","ko":"그녀의 오래된 전화기를 비교한 후 / 새 것과, 훨씬 더 좋은 카메라를 가진, / 그녀는 마침내 선택했다","nat":"그녀는 낡은 휴대폰을 카메라가 훨씬 더 좋은 새 휴대폰과 비교해 본 끝에 마침내 선택을 내렸다."},{"id":"25-7","n":7,"en":"We shared our opinions / after comparing our current uniforms / with the new ones / shown on the school website.","ko":"우리는 우리의 의견을 나누었다 / 우리의 현재 교복을 비교한 후 / 새 것들과 / 학교 웹사이트에 보여진","nat":"우리는 지금 입는 교복을 학교 웹사이트에 나와 있는 새 교복과 비교해 본 뒤 의견을 나누었다."}]},{"d":26,"s":[{"id":"26-1","n":1,"en":"By keeping my winter clothes / in a box / over the summer, / I could keep the closet / neat and tidy.","ko":"내 겨울 옷들을 보관함으로써 / 상자에 / 여름 동안, / 나는 옷장을 유지할 수 있었다 / 깔끔하고 정돈되게","nat":"여름 동안 겨울옷을 상자에 넣어 두었더니 옷장을 깔끔하고 단정하게 유지할 수 있었다."},{"id":"26-2","n":2,"en":"Although his hands were slightly shaking, / he kept calm / and delivered his speech / with a steady voice.","ko":"그의 손이 약간 떨렸음에도 불구하고, / 그는 침착함을 유지했다 / 그리고 그의 연설을 했다 / 안정된 목소리로","nat":"손이 약간 떨리고 있었지만 그는 침착함을 잃지 않고 차분한 목소리로 연설을 해냈다."},{"id":"26-3","n":3,"en":"Though her schedule was quite full, / she kept it flexible / just in case something urgent happened.","ko":"비록 그녀의 일정이 꽤 꽉 찼지만 / 그녀는 그것을 유연하게 유지했다 / 만일 긴급한 일이 생길 경우를 대비해서","nat":"그녀의 일정은 꽤 빡빡했지만, 혹시 급한 일이 생길 때를 대비해 일정을 유연하게 해 두었다."},{"id":"26-4","n":4,"en":"She wants to marry someone / who treats animals with love / and sees them as part of the family.","ko":"그녀는 누군가와 결혼하고 싶어한다 / 동물들을 사랑으로 대하고 / 그들을 가족의 일부로 여기는","nat":"그녀는 동물을 사랑으로 대하고 가족의 일부로 여기는 사람과 결혼하고 싶어 한다."},{"id":"26-5","n":5,"en":"He doesn't want to marry too early, / especially when he still has many goals / he wants to achieve on his own.","ko":"그는 너무 일찍 결혼하고 싶어하지 않는다, / 특히 그가 아직 많은 목표를 가지고 있을 때 / 그가 혼자서 달성하고 싶어하는","nat":"그는 너무 일찍 결혼하고 싶지 않다. 특히 아직 혼자 힘으로 이루고 싶은 목표가 많을 때는 더욱 그렇다."},{"id":"26-6","n":6,"en":"My grandparents brought up my father / in the countryside, / teaching him / to appreciate nature / and live with fewer material needs.","ko":"나의 조부모님들은 아버지를 키우셨다 / 시골에서 / 그에게 가르치시면서 / 자연을 소중히 여기고 / 더 적은 물질적 필요로 사는 법을","nat":"나의 조부모님은 시골에서 아버지를 키우시며 자연의 고마움을 알고 물질적인 욕심을 줄여 살아가도록 가르치셨다."},{"id":"26-7","n":7,"en":"By bringing up an interesting topic / at the right moment, / he helped the team develop new ideas / that moved the project forward.","ko":"흥미로운 주제를 꺼냄으로써 / 적절한 순간에, / 그는 팀이 새로운 아이디어를 개발하는 것을 도왔다 / 프로젝트를 앞으로 나아가게 하는","nat":"그는 적절한 순간에 흥미로운 화제를 꺼내서, 팀이 프로젝트를 앞으로 나아가게 할 새로운 아이디어를 발전시키도록 도왔다."}]},{"d":27,"s":[{"id":"27-1","n":1,"en":"As he gets older, / my baby brother resembles my dad more and more, / especially in his face / and the way he smiles.","ko":"그가 나이를 먹으면서, / 내 남동생은 점점 더 아빠를 닮는다 , / 특히 그의 얼굴에서 / 그리고 그가 웃는 방식에서","nat":"내 어린 남동생은 자랄수록 점점 더 아빠를 닮아 가는데, 특히 얼굴과 웃는 모습이 그렇다."},{"id":"27-2","n":2,"en":"His drawing resembles the picture in our art book / not only in the shapes and colors / but also in the overall balance and detail.","ko":"그의 그림은 우리 미술 책의 그림을 닮았다 / 모양과 색깔에서뿐만 아니라 / 전체적인 균형과 세부 사항에서도","nat":"그의 그림은 모양과 색깔뿐만 아니라 전체적인 균형과 세부 묘사까지 우리 미술 교과서에 있는 그림과 닮았다."},{"id":"27-3","n":3,"en":"She takes after her mom / not only in her friendly behavior in class / but also in the way she encourages others.","ko":"그녀는 엄마를 닮았다 / 수업 시간의 친근한 행동에서뿐만 아니라 / 또한 그녀가 다른 사람들을 격려하는 방식에서도","nat":"그녀는 수업 시간의 다정한 행동뿐만 아니라 다른 사람들을 격려하는 방식까지 엄마를 닮았다."},{"id":"27-4","n":4,"en":"Climate scientists simulate complex weather patterns / using advanced computer models, / which help them understand / how climate change affects local weather and temperature.","ko":"기후 과학자들은 복잡한 날씨 패턴을 재현한다 / 고급 컴퓨터 모델을 사용하여, / 그리고 그것은 그들이 이해하도록 도와준다 / 기후 변화가 지역 날씨와 온도에 어떤 영향을 미치는지","nat":"기후 과학자들은 첨단 컴퓨터 모델로 복잡한 기상 패턴을 모의 실험하는데, 이 모델은 기후 변화가 지역의 날씨와 기온에 어떤 영향을 미치는지 이해하는 데 도움이 된다."},{"id":"27-5","n":5,"en":"The advanced computer program simulates a realistic driving experience / with different traffic situations, / which helps students learn proper driving skills.","ko":"고급 컴퓨터 프로그램은 현실적인 운전 경험을 재현한다 / 다양한 교통 상황과 함께, / 그리고 그것은 학생들이 적절한 운전 기술을 배우는 것을 도와준다","nat":"그 첨단 컴퓨터 프로그램은 다양한 교통 상황이 담긴 현실적인 운전 경험을 모의로 보여 주며, 학생들이 올바른 운전 기술을 배우는 데 도움을 준다."},{"id":"27-6","n":6,"en":"Regular exercise stimulates blood circulation / throughout the body, / which helps prevent heart problems / and allows people to stay healthy longer.","ko":"규칙적인 운동은 혈액 순환을 자극한다 / 몸 전체에, / 그리고 그것은 심장 문제를 예방하는 것을 도와주고 / 사람들이 더 오래 건강하게 지낼 수 있게 한다","nat":"규칙적인 운동은 온몸의 혈액 순환을 촉진하고, 이는 심장 문제를 예방하며 사람들이 더 오래 건강하게 지내도록 해 준다."},{"id":"27-7","n":7,"en":"Spicy food stimulates sensitive nerve endings / in your mouth, / which triggers immediate reactions / like sweating.","ko":"매운 음식은 민감한 신경 말단을 자극한다 / 입 안의, / 그리고 그것은 즉각적인 반응을 유발한다 / 땀을 흘리는 것과 같은","nat":"매운 음식은 입안의 민감한 신경 말단을 자극하고, 이 자극이 땀이 나는 것과 같은 즉각적인 반응을 일으킨다."}]},{"d":28,"s":[{"id":"28-1","n":1,"en":"My parents usually expect me to go to bed on time, / but they allow me to stay up late on Saturday / since there's no school the next day.","ko":"내 부모님은 보통 내가 제시간에 잠자리에 들기를 기대하신다 / 하지만 그들은 내가 토요일에 늦게까지 깨어있는 것 허락하신다 / 왜냐하면 다음 날 학교가 없기 때문에","nat":"부모님은 보통 내가 제시간에 잠자리에 들기를 바라시지만, 다음 날 학교에 가지 않으므로 토요일에는 늦게까지 깨어 있도록 허락해 주신다."},{"id":"28-2","n":2,"en":"Although some students request additional books for projects, / the librarian doesn't allow more than three books per visit / because of the current policy.","ko":"몇몇 학생들이 프로젝트를 위해 추가 책들을 요청함에도 불구하고, / 사서는 방문당 세 권 이상을 허락하지 않는다 / 현재 정책 때문에","nat":"일부 학생들이 프로젝트를 위해 책을 더 요청하기도 하지만, 사서는 현재의 정책 때문에 한 번 방문에 세 권을 넘는 책은 허용하지 않는다."},{"id":"28-3","n":3,"en":"To make sure / everyone was prepared, / the teacher announced the test date to the class / a week in advance.","ko":"확실히 하기 위해 / 모든 사람이 준비되었는지, / 선생님은 시험 날짜를 학급에 발표하셨다 / 일주일 전에","nat":"모두가 준비할 수 있도록 선생님은 일주일 전에 미리 학급에 시험 날짜를 알렸다."},{"id":"28-4","n":4,"en":"She took a deep breath / after opening the envelope, / looked at the crowd, / and announced the winner with a smile / that showed both pride and joy.","ko":"그녀는 깊은 숨을 쉬었다 / 봉투를 연 후, / 군중을 보았다, / 그리고 미소를 지으며 우승자를 발표했다 / 자부심과 기쁨을 모두 보여주는","nat":"그녀는 봉투를 열고 숨을 깊이 들이쉰 뒤 군중을 바라보며, 자부심과 기쁨이 함께 묻어나는 미소로 우승자를 발표했다."},{"id":"28-5","n":5,"en":"He looked up at the stars / and carefully connected the dots / in his mind / to form the Big Dipper.","ko":"그는 별들을 올려다보았다 / 그리고 신중히 점들을 연결했다 / 그의 마음속에서 / 북두칠성을 만들기 위해","nat":"그는 별들을 올려다보며 북두칠성 모양을 만들려고 마음속으로 별들을 하나하나 조심스럽게 이어 보았다."},{"id":"28-6","n":6,"en":"I looked up the word / in the dictionary / to ensure / that my understanding of its meaning / was completely accurate.","ko":"나는 그 단어를 찾아보았다 / 사전에서 / 확실히 하기 위해 / 그것의 의미에 대한 내 이해가 / 완전히 정확한지.","nat":"나는 그 단어의 뜻을 내가 완전히 정확하게 이해하고 있는지 확인하려고 사전에서 찾아보았다."},{"id":"28-7","n":7,"en":"Wanting to avoid mistakes / on her first try, / she looked up / how to cook pasta / on a popular cooking website.","ko":"실수를 피하고 싶어서 / 첫 번째 시도에서, / 그녀는 찾아보았다 / 파스타 요리하는 방법을 / 인기 있는 요리 웹사이트에서","nat":"그녀는 처음 해 보는 요리에서 실수하지 않으려고 인기 있는 요리 웹사이트에서 파스타 만드는 법을 찾아보았다."}]},{"d":29,"s":[{"id":"29-1","n":1,"en":"What matters most / during a disagreement / is whether you can express your thoughts / without hurting others.","ko":"가장 중요한 것은 / 의견 충돌 중에 / 당신이 당신의 생각을 표현할 수 있는지이다 / 다른 사람들을 다치게 하지 않고","nat":"의견이 맞지 않을 때 가장 중요한 것은 다른 사람에게 상처를 주지 않고 자기 생각을 표현할 수 있느냐이다."},{"id":"29-2","n":2,"en":"Though promises may be easy to make, / what matters is / that you carry them out.","ko":"약속은 하기가 쉬울 수 있지만, / 중요한 것은 / 당신이 그것들을 이행하는 것이다","nat":"약속은 하기 쉬울지 몰라도, 중요한 것은 그 약속을 실제로 지키는 것이다."},{"id":"29-3","n":3,"en":"Does it matter to the teacher / if I make a few changes to the report / before handing it in / tomorrow morning?","ko":"선생님께 문제가 될까요 / 만약 제가 보고서에 몇 가지 변경을 한다면 / 그것을 제출하기 전에 / 내일 아침에","nat":"내일 아침에 제출하기 전에 내가 보고서를 몇 군데 고치면 선생님께서 신경 쓰실까?"},{"id":"29-4","n":4,"en":"I finally figured out / how the machine works, / and later helped others learn / how to use it.","ko":"나는 마침내 알아냈다 / 그 기계가 어떻게 작동하는지를 / 그리고 나중에 다른 사람들이 배우도록 도와줬다 / 그것을 사용하는 방법을","nat":"나는 마침내 그 기계가 어떻게 작동하는지 알아냈고, 나중에는 다른 사람들이 사용법을 배우도록 도와주었다."},{"id":"29-5","n":5,"en":"We should figure out / what to bring for the trip / ahead of time / to make sure / we don't forget anything important.","ko":"우리는 알아내야 한다 / 여행에 무엇을 가져갈지를 / 미리 / 확실히 하기 위해 / 우리가 중요한 것을 잊지 않도록","nat":"우리는 중요한 것을 하나도 빠뜨리지 않도록 여행에 무엇을 가져갈지 미리 정해 두어야 한다."},{"id":"29-6","n":6,"en":"She was more satisfied / with her seat near the window / than with the seat she had last week.","ko":"그녀는 더 만족했다 / 창가 근처 자리에 / 그녀가 지난주에 가졌던[앉았던] 자리보다","nat":"그녀는 지난주에 앉았던 자리보다 창가 근처의 자리에 더 만족했다."},{"id":"29-7","n":7,"en":"He wasn't satisfied / with his score on the final exam / even though it was higher / than what he got on the midterm.","ko":"그는 만족하지 않았다 / 기말고사 점수에 / 비록 그것이 더 높았음에도 / 중간고사에서 받은 것보다","nat":"그는 기말고사 점수가 중간고사에서 받은 점수보다 높았는데도 그 점수에 만족하지 못했다."}]},{"d":30,"s":[{"id":"30-1","n":1,"en":"Although trailers can sometimes be misleading, / they expect the movie to deliver the kind of fun and energy / the preview promised.","ko":"비록 예고편들이 때때로 오해를 일으킬 수 있지만 / 그들은 영화가 그런 종류의 재미와 에너지를 제공하기를 기대한다 / 예고편이 약속했던","nat":"예고편이 때로는 오해를 불러일으키기도 하지만, 사람들은 영화가 예고편에서 약속했던 만큼의 재미와 에너지를 주기를 기대한다."},{"id":"30-2","n":2,"en":"My teacher not only expects me / to ask more questions in class, / but also encourages me / to express my opinions confidently.","ko":"우리 선생님은 나에게 기대할 뿐만 아니라 / 수업시간에 더 많은 질문을 하기를 / 또한 나를 격려한다 / 내 의견을 자신 있게 표현하도록","nat":"선생님은 내가 수업 시간에 질문을 더 많이 하기를 바라실 뿐만 아니라, 내 의견을 자신 있게 말하도록 격려해 주시기도 한다."},{"id":"30-3","n":3,"en":"It's worth copying good English sentences by hand, / not just to improve your skills, / but also to shape your ideas and values.","ko":"좋은 영어 문장을 손으로 베껴 쓸 가치가 있다, / 단지 너의 실력을 향상시키기 위해서뿐만 아니라, / 또한 너의 생각과 가치관을 형성하기 위해서도","nat":"좋은 영어 문장을 손으로 베껴 써 볼 만한 가치가 있는데, 이는 실력을 키우기 위해서일 뿐만 아니라 생각과 가치관을 만들어 가기 위해서이기도 하다."},{"id":"30-4","n":4,"en":"For more efficient time use, / it's worth organizing your study tasks / by importance / before you begin.","ko":"더 효율적인 시간 사용을 위해, / 학습 과제들을 정리할 가치가 있다 / 중요도별로 / 시작하기 전에","nat":"시간을 더 효율적으로 쓰려면, 시작하기 전에 공부할 과제를 중요도에 따라 정리해 볼 만하다."},{"id":"30-5","n":5,"en":"I took his joke for a real story / since he looked so sincere / and even gave details / that sounded believable.","ko":"나는 그의 농담을 실제 이야기로 받아들였다 / 그가 너무 진지해 보였기 때문에 / 그리고 심지어 세부 사항까지 제공했기 때문에 / 믿을 만하게 들리는","nat":"그가 아주 진지해 보였고 믿을 만하게 들리는 세부 내용까지 말했기 때문에, 나는 그의 농담을 진짜 이야기로 받아들였다."},{"id":"30-6","n":6,"en":"She took the salt for sugar, / which completely changed the flavor of the dessert / she was trying to make.","ko":"그녀는 소금을 설탕으로 착각했다, / 그리고 이것이 디저트의 맛을 완전히 바꾸어 놓았다 / 그녀가 만들려고 했던","nat":"그녀는 소금을 설탕으로 착각했고, 그 바람에 만들려던 디저트의 맛이 완전히 달라졌다."},{"id":"30-7","n":7,"en":"Because our bags looked identical, / she took mine for hers / and didn't notice the mix-up / until she needed her wallet / on the way home.","ko":"우리 가방들이 똑같아 보였기 때문에, / 그녀는 내 것을 자신의 것으로 착각했다 / 그리고 뒤바뀐 것을 알아차리지 못했다 / 그녀가 지갑이 필요할 때까지 / 집에 가는 길에","nat":"우리 가방이 똑같이 생겨서 그녀는 내 가방을 자기 것으로 착각했고, 집에 가는 길에 지갑이 필요해지고서야 가방이 바뀐 것을 알아차렸다."}]},{"d":31,"s":[{"id":"31-1","n":1,"en":"She enjoys playing the piano in the evening, / which allows her / to relax and refresh her mind.","ko":"그녀는 저녁에 피아노 치는 것을 즐긴다, / 그리고 이것은 그녀가 할 수 있게 해준다 / 긴장을 풀고 마음을 상쾌하게 하도록","nat":"그녀는 저녁에 피아노 치는 것을 즐기는데, 그러면 긴장이 풀리고 마음이 상쾌해진다."},{"id":"31-2","n":2,"en":"She enjoys taking pictures of her cat sleeping on the sofa / to capture its cuteness / and share those moments on Instagram.","ko":"그녀는 소파에서 자고 있는 고양이 사진 찍는 것을 즐긴다 / 그것의 귀여움을 포착하기 위해 / 그리고 그런 순간들을 인스타그램에 공유하기 위해","nat":"그녀는 고양이의 귀여움을 담고 그 순간을 인스타그램에 공유하려고 소파에서 자는 고양이 사진을 찍는 것을 즐긴다."},{"id":"31-3","n":3,"en":"That app is widely known to teenagers / for exciting games / that are both fun and easy to play.","ko":"그 앱은 청소년들에게 널리 알려져 있다 / 흥미진진한 게임으로 / 재미있고 하기 쉬운","nat":"그 앱은 재미있고 하기도 쉬운 신나는 게임으로 십 대들 사이에 널리 알려져 있다."},{"id":"31-4","n":4,"en":"The singer is known to teenagers / for her powerful voice / and the way she expresses feelings through music.","ko":"그 가수는 청소년들에게 알려져 있다 / 그녀의 강력한 목소리와 / 그녀가 음악을 통해 감정을 표현하는 방식으로","nat":"그 가수는 힘 있는 목소리와 음악으로 감정을 표현하는 방식 덕분에 십 대들 사이에 알려져 있다."},{"id":"31-5","n":5,"en":"The dog is known to the neighbors / for being incredibly friendly, / often wagging its tail / at anyone who passes by the gate.","ko":"그 개는 이웃들에게 알려져 있다 / 믿을 수 없을 정도로 친근한 것으로, / 종종 꼬리를 흔들기때문에 / 문 앞을 지나가는 누구에게든","nat":"그 개는 대문 옆을 지나가는 누구에게나 자주 꼬리를 흔들 만큼 엄청나게 다정하다고 이웃들에게 알려져 있다."},{"id":"31-6","n":6,"en":"Not sleeping enough / can result in feeling sleepy / and making it hard / to concentrate in class.","ko":"충분히 잠을 자지 않는 것은 / 졸린 느낌을 초래할 수 있다 / 그리고 어렵게 만드는 것을 / 수업에 집중하기를","nat":"잠을 충분히 자지 않으면 졸리고 수업 시간에 집중하기 어려워질 수 있다."},{"id":"31-7","n":7,"en":"Regular intake of foods / that are high in fat and sugar / can result in various health problems, / including obesity and high blood pressure.","ko":"음식의 정기적인 섭취는 / 지방과 설탕이 많이 함유된 / 다양한 건강 문제를 초래할 수 있다, / 비만과 고혈압을 포함한","nat":"지방과 당분이 많은 음식을 꾸준히 먹으면 비만과 고혈압을 비롯한 여러 가지 건강 문제가 생길 수 있다."}]},{"d":32,"s":[{"id":"32-1","n":1,"en":"The company is expanding / not only its products / but also its customer support systems / in foreign markets.","ko":"그 회사는 확장하고 있다 / 제품뿐만 아니라 / 고객 지원 시스템도 / 해외 시장에서","nat":"그 회사는 해외 시장에서 제품뿐만 아니라 고객 지원 체계도 넓혀 가고 있다."},{"id":"32-2","n":2,"en":"The balloon kept expanding / as I blew air into it, / and in the end, / it suddenly burst.","ko":"풍선은 계속 팽창했다 / 내가 그 속에 공기를 불어넣자, / 그리고 결국, / 갑자기 터졌다","nat":"내가 공기를 불어넣자 풍선은 계속 부풀었고, 결국 갑자기 터져 버렸다."},{"id":"32-3","n":3,"en":"She expended so much money on snacks / at the convenience store / that she didn't have enough left for lunch.","ko":"그녀가 간식에 너무 많은 돈을 써서 / 편의점에서 / 그녀는 점심을 위해 충분히 남지 않았다","nat":"그녀는 편의점에서 간식에 돈을 너무 많이 써서 점심값이 충분히 남지 않았다."},{"id":"32-4","n":4,"en":"Because I had expended so much of my study time / on mobile games, / I couldn't answer the questions.","ko":"내가 너무 많은 공부 시간을 소비했기 때문에 / 모바일 게임에, / 나는 문제들에 답할 수 없었다","nat":"나는 공부 시간을 모바일 게임에 너무 많이 써 버려서 문제들에 답하지 못했다."},{"id":"32-5","n":5,"en":"Mom warned me of the hot stove, / and that's when I realized / it was still very hot.","ko":"엄마는 나에게 뜨거운 스토브에 대해 경고했다, / 그때 나는 깨달았다 / 그것이 여전히 매우 뜨겁다는 것을","nat":"엄마가 뜨거운 스토브를 조심하라고 경고했고, 그제야 나는 그것이 아직도 아주 뜨겁다는 것을 깨달았다."},{"id":"32-6","n":6,"en":"The sign warned people of the wet floor, / but some shoppers who missed it / almost slipped.","ko":"표지판은 사람들에게 젖은 바닥에 대해 경고했다, / 하지만 그것을 놓친 일부 쇼핑객들은 / 거의 미끄러질 뻔했다","nat":"표지판이 젖은 바닥을 조심하라고 알렸지만, 그것을 보지 못한 몇몇 쇼핑객들은 미끄러질 뻔했다."},{"id":"32-7","n":7,"en":"He warned me / that the dog might bark loudly / if I got too close, / so I stayed behind the gate.","ko":"그는 나에게 경고했다 / 개가 크게 짖을 수도 있다고 / 내가 너무 가까이 가면, / 그래서 나는 문 뒤에 머물렀다","nat":"그는 내가 너무 가까이 가면 개가 크게 짖을지도 모른다고 경고했고, 그래서 나는 대문 뒤에 머물렀다."}]},{"d":33,"s":[{"id":"33-1","n":1,"en":"She promised to finish the project by Friday, / which impressed her teammates / who knew how busy she already was.","ko":"그녀는 금요일까지 프로젝트를 끝내겠다고 약속했다, / 그리고 이것은 그녀의 팀원들을 감동 시켰다 / 그녀가 이미 얼마나 바쁜지 알고 있던","nat":"그녀는 금요일까지 그 프로젝트를 끝내겠다고 약속했는데, 그녀가 이미 얼마나 바쁜지 아는 팀원들은 그 약속에 깊은 인상을 받았다."},{"id":"33-2","n":2,"en":"He promised his friend a window seat next to him, / just like they always did on class trips.","ko":"그는 친구에게 자신 옆의 창가 자리를 약속했다, / 그들이 수학여행에서 항상 그랬던 것처럼","nat":"그는 학급 여행 때 늘 그랬던 것처럼 친구에게 자기 옆 창가 자리를 약속했다."},{"id":"33-3","n":3,"en":"We promised / that we would not talk loudly in class / after the teacher told us to be quiet again.","ko":"우리는 약속했다 / 우리가 수업 시간에 큰 소리로 이야기하지 않겠다고 / 선생님이 다시 조용히 하라고 말씀하신 후에","nat":"우리는 선생님이 다시 조용히 하라고 말한 뒤 수업 시간에 크게 떠들지 않겠다고 약속했다."},{"id":"33-4","n":4,"en":"The city, located along the southern coast, / is especially known for its beautiful beaches / with clean sand and clear water.","ko":"그 도시는, 남쪽 해안을 따라 위치한, / 특히 아름다운 해변으로 유명하다 / 깨끗한 모래와 맑은 물을 가진","nat":"남쪽 해안을 따라 자리한 그 도시는 깨끗한 모래와 맑은 물을 갖춘 아름다운 해변으로 특히 유명하다."},{"id":"33-5","n":5,"en":"Known for its spicy chicken / that is both crispy and juicy, / this restaurant continues to attract long lines of customers / even on weekdays.","ko":"매콤한 치킨으로 유명한 / 바삭하면서도 촉촉한, / 이 식당은 계속해서 긴 줄의 손님들을 끌어모은다 / 심지어 평일에도","nat":"바삭하면서도 촉촉한 매운 치킨으로 유명한 이 식당에는 평일에도 손님들이 길게 줄을 서서 계속 몰린다."},{"id":"33-6","n":6,"en":"In many teenagers, / difficulty focusing in class / may result from a combination / of late-night phone use / and irregular sleeping hours.","ko":"많은 십대들에게서, / 수업 시간에 집중하기 어려운 것은 / 조합에서 비롯될 수 있다 / 늦은 밤 핸드폰 사용과 / 불규칙한 수면 시간의","nat":"많은 십대들이 수업 중에 집중하기 어려운 것은 늦은 밤의 휴대폰 사용과 불규칙한 수면 시간이 합쳐진 탓일 수 있다."},{"id":"33-7","n":7,"en":"High scores can result from study habits / that help students review / what they learned each day.","ko":"높은 점수는 공부 습관에서 비롯될 수 있다 / 학생들이 복습하는데 도움이 되는 / 매일 그들이 배운 것을","nat":"높은 점수는 학생들이 매일 배운 것을 복습하도록 돕는 공부 습관에서 나올 수 있다."}]},{"d":34,"s":[{"id":"34-1","n":1,"en":"He can't bear the sound of loud music / coming from the next room, / which often disrupts his sleep.","ko":"그는 시끄러운 음악 소리를 견딜 수 없다 / 옆방에서 나오는, / 그리고 이것은 종종 그의 잠을 방해한다","nat":"그는 옆방에서 들려오는 시끄러운 음악 소리를 참을 수 없는데, 그 소리는 종종 그의 잠을 방해한다."},{"id":"34-2","n":2,"en":"Bear in mind / that the test starts at 9 a.m., / and late students may not be allowed to enter the classroom.","ko":"명심하라 / 시험이 오전 9시에 시작한다는 것을, / 그리고 늦은 학생들은 교실에 들어가는 것이 허락되지 않을 것이라는 것을","nat":"시험은 오전 9시에 시작되고 늦은 학생은 교실에 들어가지 못할 수도 있다는 점을 명심해라."},{"id":"34-3","n":3,"en":"I was born on Christmas, / which makes it almost impossible for people / to forget my birthday.","ko":"나는 크리스마스에 태어났다, / 그리고 이것은 사람들이 거의 불가능하게 만든다 / 내 생일을 잊는 것을","nat":"나는 크리스마스에 태어났는데, 그래서 사람들이 내 생일을 잊기가 거의 불가능하다."},{"id":"34-4","n":4,"en":"As soon as he noticed the teacher walking in, / he stopped talking / and opened his textbook.","ko":"그가 선생님이 들어오시는 것을 알아차리자마자, / 그는 말하는 것을 멈췄다 / 그리고 그의 교과서를 펼쳤다","nat":"그는 선생님이 걸어 들어오는 것을 알아차리자마자 말을 멈추고 교과서를 폈다."},{"id":"34-5","n":5,"en":"Even though we wanted to stay longer, / we stopped playing / when we saw the streetlights light up.","ko":"우리가 더 오래 있고 싶었지만, / 우리는 놀기를 멈췄다 / 가로등이 켜지는 것을 봤을 때","nat":"우리는 더 오래 머물고 싶었지만 가로등이 켜지는 것을 보고 놀기를 멈췄다."},{"id":"34-6","n":6,"en":"We apologized to our parents / for the mess we made / by leaving our toys all over the floor.","ko":"우리는 부모님께 사과했다 / 우리가 만든 어수선한 상황에 대해 / 우리의 장난감들을 바닥 곳곳에 두고 간 것으로","nat":"우리는 장난감을 바닥 곳곳에 두어 어질러 놓은 것에 대해 부모님께 사과했다."},{"id":"34-7","n":7,"en":"They apologized to the coach / for being late / and promised to be on time next time.","ko":"그들은 코치에게 사과했다 / 늦은 것에 대해 / 그리고 다음번에는 시간에 맞춰 오겠다고 약속했다","nat":"그들은 늦은 것에 대해 코치님께 사과하고 다음번에는 제시간에 오겠다고 약속했다."}]},{"d":35,"s":[{"id":"35-1","n":1,"en":"Most visitors stay on the ground / and take pictures / as the balloons rise into the morning sky.","ko":"대부분의 방문객들은 땅에 머물러 있다 / 그리고 사진을 찍는다 / 풍선들이 아침 하늘로 올라갈 때","nat":"대부분의 방문객은 땅 위에 머물며 풍선들이 아침 하늘로 떠오를 때 사진을 찍는다."},{"id":"35-2","n":2,"en":"After three days of heavy rainfall, / the water level rose so much / that the river overflowed its banks.","ko":"3일간의 폭우 후에, / 수위가 너무 많이 올라서 / 강이 제방을 넘쳤다","nat":"사흘 동안 폭우가 내린 뒤 수위가 크게 올라 강이 둑을 넘쳤다."},{"id":"35-3","n":3,"en":"She raised her hand during the review session / because she didn't fully understand some parts of the lesson.","ko":"그녀는 복습 시간에 손을 들었다
