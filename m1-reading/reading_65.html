ts","Who is your favorite artist? What does she or he look like? Some artists painted self-portraits. Why did they paint themselves? Let’s find out.","Vincent van Gogh was a Dutch artist. He was not famous in his lifetime. When he was 33, he moved to Paris. He wanted to paint people, but models were too expensive. He thought, “I don’t have money for a model. What can I do?” So, Van Gogh started to paint himself. He painted 36 self-portraits. They are all different. Look at these two paintings. One is brighter than the other. Which one do you like?","Frida Kahlo was a Mexican artist. When she was six years old, she was very sick. Her right leg became weaker than her left leg. But she thought, “I will get well. I will help sick people like me.” When she was 18, she was in a terrible bus accident. She stayed in the hospital for a long time. Kahlo said to herself, “I look weak. But I am stronger than anyone.” So, Kahlo started to paint herself. She painted 55 self-portraits in her lifetime. Look at her paintings. Does she look strong?","Van Gogh and Kahlo painted themselves for different reasons. But their paintings have one thing in common. They touch the hearts of many people."];var PASS_KO=["위대한 화가들의 얼굴","당신이 가장 좋아하는 화가는 누구인가? 그녀나 그는 어떻게 생겼는가? 몇몇 화가들은 자화상을 그렸다. 그들은 왜 그들 자신을 그렸을까? 알아보자.","빈센트 반 고흐는 네덜란드의 화가였다. 그는 그의 일생 동안 유명하지 않았다. 그가 33살이었을 때, 그는 파리로 이주했다. 그는 사람들을 그리고 싶었지만, 모델들은 너무 비쌌다. 그는 “나는 모델을 쓸 돈이 없어. 내가 무엇을 할 수 있을까?”라고 생각했다. 그래서, 반 고흐는 그 자신을 그리기 시작했다. 그는 36점의 자화상을 그렸다. 그것들은 모두 다르다. 이 두 그림을 보아라. 한 그림이 다른 그림보다 더 밝다. 당신은 어느 것이 마음에 드는가?","프리다 칼로는 멕시코의 화가였다. 그녀가 여섯 살 때, 그녀는 매우 아팠다. 그녀의 오른쪽 다리가 그녀의 왼쪽 다리보다 더 약해졌다. 하지만 그녀는 “나는 나아질 거야. 나는 나처럼 아픈 사람들을 도울 거야.”라고 생각했다. 그녀가 열여덟 살이었을 때, 그녀는 끔찍한 버스 사고를 당했다. 그녀는 오랫동안 병원에 머물렀다. 칼로는 “나는 약해 보여. 하지만 나는 누구보다 더 강해.”라고 그녀 자신에게 말했다. 그래서, 칼로는 그녀 자신을 그리기 시작했다. 그녀는 그녀의 일생 동안 55점의 자화상을 그렸다. 그녀의 그림들을 보아라. 그녀는 강해 보이는가?","반 고흐와 칼로는 다른 이유로 그들 자신을 그렸다. 하지만 그들의 그림은 한 가지 공통점이 있다. 그것들은 많은 사람들의 마음을 감동시킨다."];var DG=[{"dlg":[["Jiho","Look at this p
