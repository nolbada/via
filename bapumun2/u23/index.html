, "박물관"], ["visited", "방문했다(원형 visit 방문하다)"], ["beautiful", "아름다운"]], "h1": "'지금까지 방문한 것 중 가장 아름다운 박물관'을 말하는 문장이에요. 뒤에 I have ever visited(내가 지금까지 방문한)가 이어져요. 빈칸에는 어떤 모양이 필요한가요?", "h2": "틀은 「the + 최상급 + 명사 + (that) + 주어 + have ever + 과거분사」예요. beautiful(아름다운)은 긴 단어예요.", "why": "beautiful은 긴 단어라서 최상급이 most beautiful이고 앞에 the를 붙여요. 그래서 the most beautiful museum이에요.", "opts": [], "pencil": "지금까지 ~한 것 중 가장 …한: the + ___ + 명사", "pencilKey": "최상급", "page": 233, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "유형 02·04 비교급 / 최상급을 이용한 다양한 표현", "type": "write", "ans": "one of the laziest animals", "concept": ["036"], "gap": "", "words": [["koala", "코알라"], ["lazy", "게으른"], ["animal", "동물"]], "h1": "'세계에서 가장 게으른 동물들 중 하나'를 만들어요. one of 뒤에 오는 틀을 떠올리며 괄호 안 lazy(게으른)와 animal(동물)을 알맞은 모양으로 바꾸세요.", "h2": "틀은 「one of the + 최상급 + 복수 명사」예요. lazy는 -y로 끝나므로 y를 i로 바꾸고, animal은 복수형으로 만들어요.", "why": "one of the laziest animals(가장 게으른 동물들 중 하나)가 돼요. lazy는 y를 i로 바꿔 laziest, animal은 복수 animals로 써요.", "opts": [], "pencil": "one of the + 최상급 + ___", "pencilKey": "복수 명사", "page": 233, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "유형 01·03 비교급 / 최상급 비교", "type": "mc", "ans": "⑤", "concept": ["034"], "gap": "", "words": [["temple", "절"], ["predicted", "예상했다(원형 predict 예상하다)"], ["spend", "쓰다"]], "h1": "어색한 문장 하나를 찾아요. 문장마다 비교급 또는 최상급이 쓰였으니 비교 대상과 모양을 하나씩 확인하세요.", "h2": "than(~보다)이 있는 문장에는 비교급이 와야 해요. 보기 중에서 than 앞의 단어가 원래 모양 그대로인 문장이 있는지 찾아보세요.", "why": "⑤는 than이 있는데 easy(쉬운)가 원급 그대로예요. 비교급 easier(더 쉬운)로 고쳐야 해요.", "opts": [{"n": "①", "en": "This is the oldest temple in Korea.", "ko": "이곳은 한국에서 가장 오래된 절이다.", "ok": false, "why": "the + 최상급 + in + 장소가 알맞아요."}, {"n": "②", "en": "I am the youngest in my whole family.", "ko": "나는 온 가족 중에서 가장 어리다.", "ok": false, "why": "the + 최상급 + in + 집단이 알맞아요."}, {"n": "③", "en": "Coffee is more popular than tea in Korea.", "ko": "한국에서 커피는 차보다 더 인기 있다.", "ok": false, "why": "more + 원급 + than이 알맞아요."}, {"n": "④", "en": "He lived far longer than doctors predicted.", "ko": "그는 의사들이 예상한 것보다 훨씬 더 오래 살았다.", "ok": false, "why": "far가 비교급 longer를 알맞게 강조해요."}, {"n": "⑤", "en": "It's easy to spend money than to make it.", "ko": "돈을 버는 것보다 쓰는 것이 쉽다.(어색한 문장)", "ok": true, "why": "than이 있으니 easy를 easier로 고쳐야 해요."}], "pencil": "than 앞에는 원급이 아니라 ___ 이 온다", "pencilKey": "비교급", "page": 234, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "유형 01·03 비교급 / 최상급 비교", "type": "mc", "ans": "④", "concept": ["033", "034"], "gap": "not as 원급 as 문장을 반대 뜻의 비교급 문장으로 바꿔 쓰는 방법(A isn't as fast as B 는 B is faster than A 와 같은 뜻)", "words": [["difficult", "어려운"], ["harder", "더 단단한(원형 hard 단단한)"], ["weaker", "더 약한(원형 weak 약한)"], ["motorcycle", "오토바이"]], "h1": "각 보기는 같은 뜻이라고 짝지어 놓은 두 문장이에요. 뜻이 서로 다른 짝을 찾으려면 두 문장에서 누가 더 ~한지 각각 정리하세요.", "h2": "isn't as ~ as는 덜하다는 뜻이고, 반대말 형용사를 쓴 문장은 방향이 뒤집혀요. 방향이 같은지 확인하세요.", "why": "자전거가 오토바이만큼 빠르지 않다는 말은 오토바이가 더 빠르다는 뜻이에요. 그런데 '오토바이는 자전거만큼 느리다'는 둘이 똑같이 느리다는 뜻이라서 달라요.", "opts": [{"n": "①", "en": "His bag is bigger than mine. = My bag is smaller than his.", "ko": "그의 가방은 내 것보다 더 크다. = 내 가방은 그의 것보다 더 작다.", "ok": false, "why": "같은 사실을 반대로 말한 같은 뜻이에요."}, {"n": "②", "en": "It is more difficult than you think. = It is not as easy as you think.", "ko": "그것은 네 생각보다 더 어렵다. = 그것은 네 생각만큼 쉽지 않다.", "ok": false, "why": "같은 뜻이에요."}, {"n": "③", "en": "Diamonds are much harder than gold. = Gold is much weaker than diamonds.", "ko": "다이아몬드는 금보다 훨씬 더 단단하다. = 금은 다이아몬드보다 훨씬 더 약하다.", "ok": false, "why": "같은 사실을 반대로 말한 같은 뜻이에요."}, {"n": "④", "en": "A bike isn't as fast as a motorcycle. = A motorcycle is as slow as a bike.", "ko": "자전거는 오토바이만큼 빠르지 않다. = 오토바이는 자전거만큼 느리다.", "ok": true, "why": "뒤 문장은 둘이 똑같이 느리다는 뜻이라서 앞 문장과 달라요."}, {"n": "⑤", "en": "I've been here longer than you. = You haven't been here as long as me.", "ko": "나는 너보다 여기에 더 오래 있었다. = 너는 나만큼 오래 여기에 있지 않았다.", "ok": false, "why": "같은 뜻이에요."}], "pencil": "A가 B만큼 ~하지 않다는 B가 A보다 ___ 다는 뜻이다", "pencilKey": "더 ~하", "page": 234, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "유형 01·03 비교급 / 최상급 비교", "type": "mc", "ans": "②, ⑤", "concept": ["034", "036"], "gap": "", "words": [["height", "높이"], ["Mt. Halla", "한라산"], ["Mt. Seorak", "설악산"], ["Mt. Baekdu", "백두산"], ["lowest", "가장 낮은(원형 low 낮은)"]], "h1": "표를 보고 한라산 1,947m, 설악산 1,708m, 백두산 2,750m를 높은 순서로 정리하세요. 일치하지 않는 것을 모두 고르는 문제라서 답이 두 개예요.", "h2": "보기마다 높은지 낮은지를 표와 비교하세요. isn't as low as(~만큼 낮지 않다)처럼 부정이 섞인 보기는 한 번 더 따져 보세요.", "why": "한라산은 백두산보다 낮으므로 '백두산만큼 낮지 않다'는 틀려요. 설악산은 셋 중 가장 낮아서 '다른 둘보다 높다'도 틀려요.", "opts": [{"n": "①", "en": "Mt. Halla is higher than Mt. Seorak.", "ko": "한라산은 설악산보다 더 높다.", "ok": false, "why": "1,947m가 1,708m보다 높아서 표와 맞아요."}, {"n": "②", "en": "Mt. Halla isn't as low as Mt. Baekdu.", "ko": "한라산은 백두산만큼 낮지 않다.", "ok": true, "why": "한라산이 백두산보다 낮아서 표와 맞지 않아요."}, {"n": "③", "en": "Mt. Seorak is the lowest of the three.", "ko": "설악산은 셋 중에서 가장 낮다.", "ok": false, "why": "1,708m가 가장 낮아서 표와 맞아요."}, {"n": "④", "en": "Mt. Baekdu is the highest of the three.", "ko": "백두산은 셋 중에서 가장 높다.", "ok": false, "why": "2,750m가 가장 높아서 표와 맞아요."}, {"n": "⑤", "en": "Mt. Seorak is higher than the other two.", "ko": "설악산은 다른 두 산보다 더 높다.", "ok": true, "why": "설악산이 가장 낮아서 표와 맞지 않아요."}], "pencil": "가장 낮은 산이 다른 두 산보다 ___ 다고 하면 틀리다", "pencilKey": "높", "page": 234, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "유형 01·03 비교급 / 최상급 비교", "type": "mc", "ans": "③", "concept": ["034"], "gap": "", "words": [["usually", "보통"], ["usual", "보통의, 평소의"], ["exam", "시험"], ["tomorrow", "내일"]], "h1": "글의 흐름을 따라 읽어 보세요. 보통은 10시에 자지만 오늘은 12시까지 공부한다고 해요. 그러면 오늘 자는 시각은 평소와 비교해서 어떤가요?", "h2": "평소와 비교하는 문장이라서 비교급이 필요해요. 비교급 뒤에는 비교 대상 앞에 쓰는 단어가 와요.", "why": "오늘은 평소보다 더 늦게 자요. 그래서 비교급 later(더 늦게)와 than(~보다)을 함께 써서 later than usual(평소보다 늦게)이 돼요.", "opts": [{"n": "①", "en": "late", "ko": "늦게", "ok": false, "why": "원급이라서 평소와 비교하는 뜻이 되지 않아요."}, {"n": "②", "en": "later", "ko": "더 늦게", "ok": false, "why": "비교급이지만 비교 대상 앞의 than이 없어요."}, {"n": "③", "en": "later than", "ko": "~보다 더 늦게", "ok": true, "why": "비교급 + than이라서 알맞아요."}, {"n": "④", "en": "the latest", "ko": "가장 늦게", "ok": false, "why": "최상급이라서 평소와 비교하는 뜻이 되지 않아요."}, {"n": "⑤", "en": "as late as", "ko": "~만큼 늦게", "ok": false, "why": "같은 정도라는 뜻이라서 오늘의 상황과 달라요."}], "pencil": "~보다 더 늦게: later ___ + 비교 대상", "pencilKey": "than", "page": 234, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "유형 02·04 비교급 / 최상급을 이용한 다양한 표현", "type": "mc", "ans": "④", "concept": ["034-H1", "036"], "gap": "", "words": [["sweater", "스웨터"], ["got", "~해졌다(원형 get ~해지다)"], ["pumpkin", "호박"], ["biggest", "가장 큰(원형 big 큰)"]], "h1": "두 문장의 빈칸을 각각 정해요. 첫 문장은 and로 이어진 틀이고 둘째 문장은 '지금까지 본 것 중 가장 ~한' 틀이에요.", "h2": "and로 이어서 '점점 더'를 말할 때는 비교급이 와요. '지금까지 본 것 중 가장'에는 최상급이 와요. big은 끝 자음을 한 번 더 써요.", "why": "첫 문장은 smaller and smaller(점점 더 작은), 둘째 문장은 the biggest pumpkin I've ever seen(내가 본 가장 큰 호박)이에요.", "opts": [{"n": "①", "en": "small - bigger", "ko": "작은 - 더 큰", "ok": false, "why": "첫 칸은 smaller and smaller 틀이라 비교급이 필요하고, 둘째 칸은 최상급이어야 해요."}, {"n": "②", "en": "smaller - big", "ko": "더 작은 - 큰", "ok": false, "why": "둘째 칸은 최상급이어야 해서 원급 big은 틀려요."}, {"n": "③", "en": "smallest - big", "ko": "가장 작은 - 큰", "ok": false, "why": "두 칸 모두 틀려요."}, {"n": "④", "en": "smaller - biggest", "ko": "더 작은 - 가장 큰", "ok": true, "why": "첫 칸은 비교급, 둘째 칸은 최상급이라서 알맞아요."}, {"n": "⑤", "en": "smallest - biggest", "ko": "가장 작은 - 가장 큰", "ok": false, "why": "첫 칸은 '점점 더' 틀이라 비교급이 필요해요."}], "pencil": "지금까지 ~한 것 중 가장 …한: the + ___ + 명사", "pencilKey": "최상급", "page": 235, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "유형 05 통합형", "type": "mc", "ans": "④", "concept": ["034", "034-H1", "035"], "gap": "", "words": [["voice", "목소리"], ["holiday", "휴일"], ["louder", "더 큰(원형 loud 큰 소리의)"], ["colder", "더 추운(원형 cold 추운)"], ["subjects", "과목들(원형 subject 과목)"]], "h1": "ⓐ~ⓔ를 하나씩 읽고 어색한 문장에 표시한 뒤 개수를 세어 보세요. 배수 표현, 점점 더, ~할수록 더 틀이 섞여 있어요.", "h2": "배수 표현은 as ~ as 틀이나 비교급 + than 틀로 써요. '점점 더'는 more and more를 겹쳐 쓰지 않고, ~할수록 더는 두 칸 모두 비교급이어야 해요.", "why": "ⓐ는 twice as big as, ⓑ는 louder and louder, ⓓ는 The higher ~, the colder ...로 고쳐야 해서 모두 3개가 어색해요.", "opts": [{"n": "①", "en": "없음", "ko": "없다", "ok": false, "why": "어색한 문장이 3개 있어서 오답이에요."}, {"n": "②", "en": "1개", "ko": "한 개", "ok": false, "why": "어색한 문장이 3개라서 오답이에요."}, {"n": "③", "en": "2개", "ko": "두 개", "ok": false, "why": "어색한 문장이 3개라서 오답이에요."}, {"n": "④", "en": "3개", "ko": "세 개", "ok": true, "why": "ⓐ, ⓑ, ⓓ 세 개가 어색해서 알맞아요."}, {"n": "⑤", "en": "4개", "ko": "네 개", "ok": false, "why": "어색한 문장이 3개라서 오답이에요."}], "pencil": "점점 더 + 짧은 단어: 비교급 and ___", "pencilKey": "비교급", "page": 235, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "유형 02·04 비교급 / 최상급을 이용한 다양한 표현", "type": "mc", "ans": "③", "concept": ["034-H1", "035", "036"], "gap": "", "words": [["pets", "애완동물들(원형 pet 애완동물)"], ["painter", "화가"], ["drive", "운전하다"], ["air", "공기"]], "h1": "밑줄 친 부분을 고친 것이 맞는지 하나씩 확인하는 문제예요. '잘못 고쳐 쓴 것'을 찾아야 해요. 배수 비교 문장을 특히 살펴보세요.", "h2": "배수 표현 + 비교급 + than 틀에서는 비교급이 필요해요. 최상급으로 고친 보기가 있는지 확인하세요.", "why": "three times heavy than은 비교급 heavier(더 무거운)로 고쳐야 해요. 최상급 heaviest(가장 무거운)로 고치면 than과 맞지 않아요.", "opts": [{"n": "①", "en": "More or more people keep pets. (and)", "ko": "점점 더 많은 사람들이 애완동물을 기른다. (and로 고침)", "ok": false, "why": "or를 and로 고쳐 알맞아요."}, {"n": "②", "en": "It was the beautiful song I've ever heard. (most beautiful)", "ko": "그것은 내가 지금까지 들은 가장 아름다운 노래였다. (most beautiful로 고침)", "ok": false, "why": "the + 최상급이라서 알맞게 고쳤어요."}, {"n": "③", "en": "The box is three times heavy than the chair. (heaviest)", "ko": "그 상자는 의자보다 세 배 더 무겁다. (heaviest로 고침)", "ok": true, "why": "than과 함께 쓰려면 비교급 heavier로 고쳐야 해서 잘못 고쳤어요."}, {"n": "④", "en": "Vincent van Gogh is one of the greatest painter in art history. (painters)", "ko": "빈센트 반 고흐는 미술사에서 가장 위대한 화가들 중 한 명이다. (painters로 고침)", "ok": false, "why": "one of the 최상급 뒤에는 복수 명사가 와서 알맞게 고쳤어요."}, {"n": "⑤", "en": "The less you drive your car, cleaner the air gets. (the cleaner)", "ko": "차를 덜 운전할수록 공기가 더 깨끗해진다. (the cleaner로 고침)", "ok": false, "why": "The less ~, the cleaner ... 틀이 알맞게 고쳐졌어요."}], "pencil": "배수 + ___ + than 의 가운데에는 비교급이 온다", "pencilKey": "비교급", "page": 235, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "유형 03 최상급 비교", "type": "write", "ans": "(1) the busiest man in (2) the most difficult problem of", "concept": ["036"], "gap": "", "words": [["busy", "바쁜"], ["company", "회사"], ["difficult", "어려운"], ["problem", "문제"]], "h1": "'가장 ~한'을 만드는 최상급 문장이에요. (1)은 범위가 my company(우리 회사)이고 (2)는 범위가 all(모든 것)이에요. 범위에 따라 전치사가 달라요.", "h2": "busy는 -y로 끝나서 y를 i로 바꿔요. difficult는 긴 단어라서 앞에 한 단어를 붙여요. 장소·집단이면 in, 복수 대상이면 of를 써요.", "why": "(1) the busiest man in my company(우리 회사에서 가장 바쁜 사람), (2) the most difficult problem of all(모든 것 중에서 가장 어려운 문제)이 돼요.", "opts": [], "pencil": "집단 범위는 in, 복수 범위는 ___", "pencilKey": "of", "page": 235, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "유형 01 비교급 비교", "type": "write", "ans": "tastes better than the soup", "concept": ["034"], "gap": "", "words": [["soup", "수프"], ["spaghetti", "스파게티"], ["tastes", "맛이 난다(원형 taste 맛이 나다)"]], "h1": "두 문장을 비교하는 한 문장으로 바꿔요. 스파게티가 수프보다 더 맛있다는 내용이에요. 빈칸에는 동사, 비교급, 비교 대상 앞의 말이 순서대로 들어가요.", "h2": "비교급 뒤에는 비교 대상을 이어 주는 than이 와요. 주어가 3인칭 단수라서 동사 끝 모양도 확인하세요.", "why": "The spaghetti tastes better than the soup(스파게티는 수프보다 더 맛있다)로 써요. 주어가 3인칭 단수라서 동사 tastes(원형 taste 맛이 나다)에 s가 붙어요.", "opts": [], "pencil": "비교급 + ___ + 비교 대상", "pencilKey": "than", "page": 235, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "유형 03 최상급 비교", "type": "write", "ans": "the shortest tail of", "concept": ["036"], "gap": "", "words": [["cat", "고양이"], ["tail", "꼬리"], ["short", "짧은"]], "h1": "그림에서 고양이가 세 동물 중에서 가장 짧은 꼬리를 갖고 있어요. 최상급 문장이라서 the와 범위를 알려 주는 전치사가 필요해요.", "h2": "범위가 the three(셋)처럼 복수일 때 쓰는 전치사가 있어요. 빈칸에는 the + 최상급, 명사, 전치사가 순서대로 들어가요.", "why": "짧은 꼬리 중에서 가장 짧은 것이라서 the shortest tail이고, 범위가 셋(복수)이라서 of를 써요. 그래서 the shortest tail of the three예요.", "opts": [], "pencil": "복수 범위 앞의 전치사는 ___", "pencilKey": "of", "page": 235, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype"  }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
