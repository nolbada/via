rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":"Host","en":"Welcome to the Paran Quiz Show! I'm your host, Suji. Today, we have two finalist, Namjun from Class 2 and Sara from Class 5. Namjun and Sara, how are you today?","ko":"파란 퀴즈 쇼에 오신 것을 환영합니다! 저는 진행자인 수지입니다. 오늘 두 명의 결승 진출자인 2반의 남준이와 5반의 Sara가 나와 있습니다. 남준과 Sara, 오늘 어떤가요?","ok":false,"foot":["1finalist 결승 진출자"],"fixes":[{"wrong":"finalist","right":"finalists","partial":false,"at":[14],"point":"가산명사 수일치: two 뒤에는 복수형 finalists 사용","topic":"가산명사 수일치","memo":"two 뒤에는 복수형 finalists 사용"}]},{"n":2,"tag":"Namjun & Sara","en":"I'm nervous, but I'll do my best. I'm exciting!","ko":"저는 긴장되지만, 최선을 다하겠습니다. 저는 신이 나요!","ok":false,"foot":[],"fixes":[{"wrong":"exciting","right":"excited","partial":false,"at":[8],"point":"감정형용사: 주어가 사람이고 감정을 느낄 때는 -ed형 excited 사용","topic":"감정형용사","memo":"주어가 사람이고 감정을 느낄 때는 -ed형 excited 사용"}]},{"n":3,"tag":"Host","en":"The winner will receive a Fast Pass for lunch. Today's topic is amazing facts about the world. I'm going ask you three questions. Are you ready answer them?","ko":"우승자는 점심 패스트 패스(줄을 서지 않고 먼저 갈 수 있는 표)를 받게 됩니다. 오늘의 주제는 세상에 관한 놀라운 사실들이에요. 여러분에게 세 문제를 낼 거예요. 답할 준비가 됐나요?","ok":false,"foot":["1Fast Pass (급식실에서) 줄을 서지 않고 먼저 갈 수 있는 표"],"fixes":[{"wrong":"going ask","right":"going to ask","partial":false,"at":[18],"point":"be going to: be동사+going 뒤에는 반드시 to+동사원형 사용 (going to ask)","topic":"be going to","memo":"be동사+going 뒤에는 반드시 to+동사원형 사용 (going to ask)"},{"wrong":"ready answer","right":"ready to answer","partial":false,"at":[25],"point":"to부정사의 부사적 용법: 형용사 ready 뒤에서 목적을 나타낼 때는 to+동사원형 (ready to answer)","topic":"to부정사의 부사적 용법","memo":"형용사 ready 뒤에서 목적을 나타낼 때는 to+동사원형 (ready to answer)"}]},{"n":4,"tag":"Namjun & Sara","en":"Yes, I'm ready!","ko":"네, 준비됐습니다!","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":"Host","en":"Here is the first question. What is the large desert in the world?","ko":"첫 번째 문제입니다. 세계에서 가장 큰 사막은 무엇일까요?","ok":false,"foot":[],"fixes":[{"wrong":"large","right":"largest","partial":false,"at":[8],"point ot":[],"fixes":[{"wrong":"large","right":"larger","partial":false,"at":[13],"point":"비교급: than 앞에는 비교급 larger 사용","topic":"비교급","memo":"than 앞에는 비교급 larger 사용"}]},{"n":11,"tag":"Host","en":"Thank you, Joe. Let's moving on to the next question. What is tallest mountain in the world?","ko":"고마워요, Joe. 다음 문제로 넘어갑시다. 세계에서 가장 높은 산은 무엇일까요?","ok":false,"foot":[],"fixes":[{"wrong":"moving","right":"move","partial":false,"at":[4],"point":"Let's+동사원형: Let's 뒤에는 동사 원형 move 사용","topic":"Let's+동사원형","memo":"Let's 뒤에는 동사 원형 move 사용"},{"wrong":"tallest mountain","right":"the tallest mountain","partial":false,"at":[12],"point":"최상급 앞에는 정관사 the 사용: the tallest","topic":"최상급 앞에는 정관사 the 사용","memo":"the tallest"}]},{"n":12,"tag":"Namjun & Sara","en":"It's Mount Everest. Its Mauna Kea in Hawaii.","ko":"그것은 에베레스트산입니다. 그것은 하와이섬에 있는 마우나케아산입니다.","ok":false,"foot":[],"fixes":[{"wrong":"Its","right":"It's","partial":false,"at":[3],"point":"it's(it is의 축약형) vs its(소유격) 구별: 여기서는 '그것은 ~이다'라는 뜻이므로 it's 사용","topic":"it's(it is의 축약형) vs its(소유격) 구별","memo":"여기서는 '그것은 ~이다'라는 뜻이므로 it's 사용"}]},{"n":13,"tag":"Host","en":"Well, it's a difficultly question. Hey Joe, what is the tallest mountain on Earth?","ko":"음, 그것은 어려운 문제입니다. 이봐요 Joe, 지구에서 가장 높은 산은 무엇인가요?","ok":false,"foot":[],"fixes":[{"wrong":"difficultly","right":"difficult","partial":false,"at":[3],"point":"부사 vs 형용사: 명사 question을 꾸미므로 형용사 difficult 사용","topic":"부사 vs 형용사","memo":"명사 question을 꾸미므로 형용사 difficult 사용"}]},{"n":14,"tag":"AI Joe","en":"Mount Everest is the tallest mountain above sea level, so it looks as taller as Mauna Kea. Mauna Kea begins below sea level. So from the bottom to the top, Mauna Kea is tall than Mount Everest.","ko":"에베레스트산은 해수면 위에서 가장 높은 산이어서 마우나케아산만큼 높아 보여요. 마우나케아산은 해수면 아래에서 시작됩니다. 따라서 맨 아래에서 꼭대기까지, 마우나케아산이 에베레스트산보다 더 높습니다.","ok":false,"foot":[],"fixes":[{"wrong":"as taller as","right":"as tall as","partial":false,"at":[12],"point":"원급 비교: as와 as 사이에는 원급 (형용사 원래 형태) tall 사용, 비교급 X","topic":"원급 비교","memo":"as와 as 사이에는 function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);

  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];

 });

function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}

  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
