<script>
var D=[{"n":1,"tag":null,"en":"Do you know animals also leaves their homes and travel? Many animals travel for difference reasons.","ko":"동물들도 자신의 집을 떠나 여행한다는 것을 알고 있는가? 많은 동물이 다양한 이유로 여행한다.","ok":false,"foot":[],"fixes":[{"wrong":"leaves","right":"leave","partial":false,"at":[5],"point":"주어와 동사의 수일치: 복수 주어 animals는 leave (leaves 아님)","topic":"주어와 동사의 수일치","memo":"복수 주어 animals는 leave (leaves 아님)"},{"wrong":"difference","right":"different","partial":false,"at":[14],"point":"품사 혼동: 명사 수식은 형용사 different 사용","topic":"품사 혼동","memo":"명사 수식은 형용사 different 사용"}]},{"n":2,"tag":null,"en":"Let's find out more!","ko":"더 알아보도록 하자!","ok":true,"foot":[],"fixes":[]},{"n":3,"tag":"아프리카 과일박쥐","en":"From October to December, millions of fruit bat fly to Zambia's Kasanka National Park. These bats come from all over Africa.","ko":"10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다. 이 박쥐들은 아프리카의 전 지역에서 온다.","ok":false,"foot":[],"fixes":[{"wrong":"bat","right":"bats","partial":false,"at":[7],"point":"명사의 복수형: millions of 뒤에는 복수명사 bats 사용","topic":"명사의 복수형","memo":"millions of 뒤에는 복수명사 bats 사용"}]},{"n":4,"tag":null,"en":"Who do they travel to the park? They go there to eat wildly fruit.","ko":"왜 그들이 그 공원으로 여행을 하는 것일까? 그들은 야생 과일을 먹기 위해 그곳에 간다.","ok":false,"foot":[],"fixes":[{"wrong":"Who","right":"Why","partial":false,"at":[0],"point":"의문사: 이유를 묻을 때는 Why 사용","topic":"의문사","memo":"이유를 묻을 때는 Why 사용"},{"wrong":"wildly","right":"wild","partial":false,"at":[12],"point":"형용사와 부사: 명사 fruit 수식은 형용사 wild 사용","topic":"형용사와 부사","memo":"명사 fruit 수식은 형용사 wild 사용"}]},{"n":5,"tag":null,"en":"They are big eaters. They eats more than their weight in a night.","ko":"그들은 대식가이다. 그들은 하룻밤에 자신의 몸무게보다 더 많은 양을 먹는다.","ok":false,"foot":[],"fixes":[{"wrong":"eats","right":"eat","partial":false,"at":[5],"point":"일반동사의 현재형: 복수 주어 They는 eat (eats 아님)","topic":"일반동사의 현재형","memo":"복수 주어 They는 eat (eats 아님)"}]},{"n":6,"tag":"크리스마스섬 붉은게","en":"On Christmas Island, red crabs live in forests, not in the water.","ko":"크리스마스섬에서 붉은게는 물속이 아니라 숲에서 산다.","ok":true,"foot":[],"fixes":[]},{"n":7,"tag":null,"en":"However, when the rainy season begins on October, millions of red crabs march toward the ocean to laying eggs.","ko":"하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다.","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"in","partial":false,"at":[6],"point":"기본전치사: '~월에'는 전치사 in 사용","topic":"기본전치사","memo":"'~월에'는 전치사 in 사용"},{"wrong":"laying","right":"lay","partial":false,"at":[17],"point":"to부정사: to 뒤에는 동사원형 lay 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 lay 사용"}]},{"n":8,"tag":null,"en":"During these period, they are all over the place, and the whole island turns redly.","ko":"이 기간 동안에는 그들이 모든 곳에 걸쳐 있어서 섬 전체가 붉게 변한다.","ok":false,"foot":[],"fixes":[{"wrong":"these","right":"this","partial":false,"at":[1],"point":"지시형용사: 단수명사 period에는 this 사용","topic":"지시형용사","memo":"단수명사 period에는 this 사용"},{"wrong":"redly","right":"red","partial":false,"at":[14],"point":"형용사와 부사: turns 뒤 보어는 형용사 red 사용","topic":"형용사와 부사","memo":"turns 뒤 보어는 형용사 red 사용"}]},{"n":9,"tag":null,"en":"People close some roads and build bridges to protect them. With their help, the crabs move to the ocean safe.","ko":"사람들은 그들을 보호하기 위해 일부 도로를 폐쇄하고 다리를 놓는다. 사람들의 도움으로 게들은 바다로 안전하게 이동한다.","ok":false,"foot":[],"fixes":[{"wrong":"safe","right":"safely","partial":false,"at":[19],"point":"형용사와 부사: 동사 move 수식은 부사 safely 사용","topic":"형용사와 부사","memo":"동사 move 수식은 부사 safely 사용"}]},{"n":10,"tag":null,"en":"Golden Jellyfish in Jellyfish Lake, Palau","ko":"팔라우의 젤리피시 호수에 사는 황금해파리","ok":true,"foot":[],"fixes":[]},{"n":11,"tag":null,"en":"Jellyfish Lake in Palau is home to golden jellyfish. Every day, they moves across the lake and then swim back.","ko":"팔라우의 젤리피시 호수는 황금해파리의 집이다. 매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다.","ok":false,"foot":[],"fixes":[{"wrong":"moves","right":"move","partial":false,"at":[12],"point":"일반동사의 현재형: 복수 주어 they는 move (moves 아님)","topic":"일반동사의 현재형","memo":"복수 주어 they는 move (moves 아님)"}]},{"n":12,"tag":null,"en":"Why do they travel every day? They follow the sun to get energies from it.","ko":"왜 그들은 매일 여행을 할까? 그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다.","ok":false,"foot":[],"fixes":[{"wrong":"energies","right":"energy","partial":false,"at":[12],"point":"셀 수 없는 명사: energy는 셀 수 없는 명사","topic":"셀 수 없는 명사","memo":"energy는 셀 수 없는 명사"}]},{"n":13,"tag":null,"en":"When the sun rises in the morning, the jellyfish begin to swimming toward the sun.","ko":"아침에 태양이 뜨면, 황금해파리들은 태양 쪽으로 헤엄치기 시작한다.","ok":false,"foot":[],"fixes":[{"wrong":"swimming","right":"swim","partial":false,"at":[11],"point":"to부정사: to 뒤에는 동사원형 swim 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 swim 사용"}]},{"n":14,"tag":null,"en":"In the afternoon, they travel back and wait for the next morning.","ko":"오후에는 다시 돌아와 다음 날 아침을 기다린다.","ok":true,"foot":[],"fixes":[]}];var PP=[["Do you know animals also leave their homes and travel?","동물들도 자신의 집을 떠나 여행한다는 것을 알고 있는가?",1],["Many animals travel for different reasons.","많은 동물이 다양한 이유로 여행한다.",0],["Let's find out more!","더 알아보도록 하자!",0],["Fruit Bats in Africa","아프리카에 사는 과일박쥐",1],["From October to December, millions of fruit bats fly to Zambia's Kasanka National Park.","10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다.",1],["These bats come from all over Africa.","이 박쥐들은 아프리카의 전 지역에서 온다.",0],["Why do they travel to the park?","왜 그들이 그 공원으로 여행을 하는 것일까?",0],["They go there to eat wild fruit.","그들은 야생 과일을 먹기 위해 그곳에 간다.",0],["They are big eaters.","그들은 대식가이다.",0],["They eat more than their weight in a night.","그들은 하룻밤에 자신의 몸무게보다 더 많은 양을 먹는다.",0],["Red Crabs on Christmas Island","크리스마스섬의 붉은게",1],["On Christmas Island, red crabs live in forests, not in the water.","크리스마스섬에서 붉은게는 물속이 아니라 숲에서 산다.",1],["However, when the rainy season begins in October, millions of red crabs march toward the ocean to lay eggs.","하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다.",0],["During this period, they are all over the place, and the whole island turns red.","이 기간 동안에는 그들이 모든 곳에 걸쳐 있어서 섬 전체가 붉게 변한다.",0],["People close some roads and build bridges to protect them.","사람들은 그들을 보호하기 위해 일부 도로를 폐쇄하고 다리를 놓는다.",0],["With their help, the crabs move to the ocean safely.","사람들의 도움으로 게들은 바다로 안전하게 이동한다.",0],["Golden Jellyfish in Jellyfish Lake, Palau","팔라우의 젤리피시 호수에 사는 황금해파리",1],["Jellyfish Lake in Palau is home to golden jellyfish.","팔라우의 젤리피시 호수는 황금해파리의 집이다.",1],["Every day, they move across the lake and then swim back.","매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다.",0],["Why do they travel every day?","왜 그들은 매일 여행을 할까?",0],["They follow the sun to get energy from it.","그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다.",0],["When the sun rises in the morning, the jellyfish begin to swim toward the sun.","아침에 태양이 뜨면, 황금해파리들은 태양 쪽으로 헤엄치기 시작한다.",0],["In the afternoon, they travel back and wait for the next morning.","오후에는 다시 돌아와 다음 날 아침을 기다린다.",0]];var RNUM=68;var TITLE_EN="Why Do Animals Travel?";var PASS_EN=["Why Do Animals Travel?","Do you know animals also leave their homes and travel? Many animals travel for different reasons. Let's find out more!","Fruit Bats in Africa","From October to December, millions of fruit bats fly to Zambia's Kasanka National Park. These bats come from all over Africa. Why do they travel to the park? They go there to eat wild fruit. They are big eaters. They eat more than their weight in a night.","Red Crabs on Christmas Island","On Christmas Island, red crabs live in forests, not in the water. However, when the rainy season begins in October, millions of red crabs march toward the ocean to lay eggs. During this period, they are all over the place, and the whole island turns red. People close some roads and build bridges to protect them. With their help, the crabs move to the ocean safely.","Golden Jellyfish in Jellyfish Lake, Palau","Jellyfish Lake in Palau is home to golden jellyfish. Every day, they move across the lake and then swim back. Why do they travel every day? They follow the sun to get energy from it. When the sun rises in the morning, the jellyfish begin to swim toward the sun. In the afternoon, they travel back and wait for the next morning."];var PASS_KO=["왜 동물들이 여행을 할까?","동물들도 자신의 집을 떠나 여행한다는 것을 알고 있는가? 많은 동물이 다양한 이유로 여행한다. 더 알아보도록 하자!","아프리카에 사는 과일박쥐","10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다. 이 박쥐들은 아프리카의 전 지역에서 온다. 왜 그들이 그 공원으로 여행을 하는 것일까? 그들은 야생 과일을 먹기 위해 그곳에 간다. 그들은 대식가이다. 그들은 하룻밤에 자신의 몸무게보다 더 많은 양을 먹는다.","크리스마스섬의 붉은게","크리스마스섬에서 붉은게는 물속이 아니라 숲에서 산다. 하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다. 이 기간 동안에는 그들이 모든 곳에 걸쳐 있어서 섬 전체가 붉게 변한다. 사람들은 그들을 보호하기 위해 일부 도로를 폐쇄하고 다리를 놓는다. 사람들의 도움으로 게들은 바다로 안전하게 이동한다.","팔라우의 젤리피시 호수에 사는 황금해파리","팔라우의 젤리피시 호수는 황금해파리의 집이다. 매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다. 왜 그들은 매일 여행을 할까? 그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다. 아침에 태양이 뜨면, 황금해파리들은 태양 쪽으로 헤엄치기 시작한다. 오후에는 다시 돌아와 다음 날 아침을 기다린다."];var DG=[{"qs":[{"n":1,"q":"Why can't the girl hear songs of mice?","o":["동영상의 볼륨이 너무 낮기 때문에","쥐들이 이미 짝을 발견했기 때문에","쥐들은 노래를 부를 수 없기 때문에","쥐들이 노래를 부르고 있지 않기 때문에","인간들은 쥐들의 노래를 듣지 못하기 때문에"],"a":4,"ans":"인간들은 쥐들의 노래를 듣지 못하기 때문에","evs":[["B: Humans can't hear their songs.","사람은 쥐의 노래를 들을 수 없어."],["G: Are they singing? I can't hear anything.","쥐들이 노래하고 있어? 아무 소리도 안 들리는데."]],"ev":["B: Humans can't hear their songs.","사람은 쥐의 노래를 들을 수 없어."],"ow":["오답 ✕ — 소녀가 'I can't hear anything.'(아무 소리도 안 들리는데.)이라고 한 이유는 볼륨이 아니라 소년의 'Humans can't hear their songs.'(사람은 쥐의 노래를 들을 수 없어.)이다. 볼륨에 대한 말은 없어서 틀림.","오답 ✕ — 'They sing to find a partner.'(짝을 찾으려고 노래해.)라고 했을 뿐, 쥐들이 이미 짝을 찾았다는 말은 없어서 틀림.","오답 ✕ — 소년이 'mice can sing like birds'(쥐가 새처럼 노래할 수 있다)라고 했으므로 쥐들은 노래를 부를 수 있다. 틀림.","오답 ✕ — 쥐들은 'They sing to find a partner.'(짝을 찾으려고 노래해.)라고 했으므로 노래를 부르고 있다. 들리지 않는 것은 사람의 귀 때문이라서 틀림.","정답 ○ — 소년이 'Humans can't hear their songs.'(사람은 쥐의 노래를 들을 수 없어.)라고 했으므로 사람인 소녀에게는 쥐의 노래가 들리지 않음."],"memo":["정답 ⑤: 인간은 쥐들의 노래를 듣지 못하기 때문이다.","근거: Humans can't hear their songs.(사람은 쥐의 노래를 들을 수 없어.)","함정: ④ 쥐들은 노래하고 있지만 사람 귀에 안 들릴 뿐이다. ✕"],"why":"사람은 쥐의 노래를 들을 수 없어서 소녀에게 소리가 안 들린다."},{"n":2,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["partner - hear","partner - see","friend - hear","food - hear","food - see"],"a":0,"ans":"partner - hear","evs":[["B: They sing to find a partner.","짝을 찾으려고 노래해."],["B: Humans can't hear their songs.","사람은 쥐의 노래를 들을 수 없어."]],"ev":["B: They sing to find a partner.","짝을 찾으려고 노래해."],"ow":["정답 ○ — 'They sing to find a partner.'(짝을 찾으려고 노래해.)이므로 (A)는 partner, 'Humans can't hear their songs.'(사람은 쥐의 노래를 들을 수 없어.)이므로 (B)는 hear가 맞음.","오답 ✕ — (A) partner는 맞지만, 사람이 못 하는 것은 보는 것(see)이 아니라 듣는 것이다. 'Humans can't hear their songs.'(사람은 쥐의 노래를 들을 수 없어.)라서 틀림.","오답 ✕ — (B) hear는 맞지만, 쥐들이 노래하는 목적은 'to find a partner'(짝을 찾으려고)이지 친구(friend)가 아니라서 틀림.","오답 ✕ — (B) hear는 맞지만, 쥐들이 노래하는 이유는 먹이(food)가 아니라 'to find a partner'(짝을 찾으려고)이므로 틀림.","오답 ✕ — 쥐들은 먹이를 찾으려고 노래하지 않고(To find a partner), 사람이 못 하는 것도 보기(see)가 아니라 듣기(hear)라서 둘 다 틀림."],"memo":["정답 ①: partner - hear","근거: They sing to find a partner.(짝을 찾으려고 노래해.) / Humans can't hear their songs.","함정: see(보다)와 hear(듣다)를 구분하자. 노래는 '듣는' 것 ✕"],"why":"쥐는 짝(partner)을 찾으려고 노래하지만 사람은 그 노래를 듣지(hear) 못한다.","sum":"Mice sing to find a (A)______, but humans can't (B)______ their songs.","lab":"완성된 요약문 : "}],"dlg":[["B","Hey, look at this video! Did you know that mice can sing like birds?","야, 이 영상 봐! 쥐가 새처럼 노래할 수 있다는 거 알고 있었어?"],["G","Are they singing? I can't hear anything.","쥐들이 노래하고 있어? 아무 소리도 안 들리는데."],["B","Humans can't hear their songs.","사람은 쥐의 노래를 들을 수 없어."],["G","How interesting! Why do they sing?","흥미롭다! 쥐들은 왜 노래해?"],["B","They sing to find a partner.","짝을 찾으려고 노래해."]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["The boy is looking at a video of a fox.","The boy thinks the fox in the video is cute.","The girl says that foxes can make many sounds.","Foxes can create laughing sounds.","The boy is not interested in the sounds of foxes."],"a":4,"ans":"The boy is not interested in the sounds of foxes.","evs":[["B: I'm watching a video of a fox. A woman is playing with the fox, and it's so cute!","여우 영상을 보고 있어. 한 여자가 여우와 놀고 있는데, 정말 귀여워!"],["B: Wow, that's amazing! I want to hear all those sounds.","와, 대단하다! 나는 그 소리들을 모두 듣고 싶어."]],"ev":["B: I'm watching a video of a fox. A woman is playing with the fox, and it's so cute!","여우 영상을 보고 있어. 한 여자가 여우와 놀고 있는데, 정말 귀여워!"],"ow":["오답 ✕ — 이 보기는 일치한다. 소년이 'I'm watching a video of a fox.'(여우 영상을 보고 있어.)라고 했다. 불일치 문제의 답이 아님.","오답 ✕ — 이 보기는 일치한다. 소년이 'it's so cute!'(정말 귀여워!)라고 했다. 불일치 문제의 답이 아님.","오답 ✕ — 이 보기는 일치한다. 소녀가 'foxes can make around 40 different sounds'(여우가 약 40가지의 다른 소리를 낼 수 있다)라고 했다. 불일치 문제의 답이 아님.","오답 ✕ — 이 보기는 일치한다. 소녀가 'They can even make laughing sounds.'(심지어 웃음소리도 낼 수 있어.)라고 했다. 불일치 문제의 답이 아님.","정답 ○ — 소년은 'I want to hear all those sounds.'(나는 그 소리들을 모두 듣고 싶어.)라고 했으므로 여우 소리에 관심이 많다. 관심이 없다는 보기는 대화와 일치하지 않음."],"memo":["정답 ⑤: 소년은 여우 소리에 관심이 있다. (not interested는 ✕)","근거: I want to hear all those sounds.(나는 그 소리들을 모두 듣고 싶어.)","함정: ③④는 소녀의 말(40가지 소리, 웃음소리)과 일치해서 오답"],"why":"소년은 여우의 여러 소리를 모두 듣고 싶어 할 만큼 관심이 있다."},{"n":4,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["40 - laughing","14 - laughing","40 - crying","4 - barking","400 - singing"],"a":0,"ans":"40 - laughing","evs":[["G: Did you know that foxes can make around 40 different sounds?","여우가 약 40가지의 다른 소리를 낼 수 있다는 거 알았니?"],["G: They can even make laughing sounds.","심지어 웃음소리도 낼 수 있어."]],"ev":["G: Did you know that foxes can make around 40 different sounds?","여우가 약 40가지의 다른 소리를 낼 수 있다는 거 알았니?"],"ow":["정답 ○ — 'foxes can make around 40 different sounds'(약 40가지의 소리)이고 'They can even make laughing sounds'(웃음소리도 낸다)이므로 맞음.","오답 ✕ — laughing은 맞지만, 'around 40 different sounds'(약 40가지)라고 했으므로 14는 틀림.","오답 ✕ — 40은 맞지만, 'They can even make laughing sounds'(웃음소리도 낼 수 있다)라고 했지 우는(crying) 소리가 아님.","오답 ✕ — 'around 40 different sounds'이므로 4가 아니고, 대화에 짖는(barking) 소리 언급은 없음.","오답 ✕ — 'around 40'이지 400이 아니며, 노래하는(singing) 소리가 아니라 laughing sounds임."],"memo":["정답 ①: 40 - laughing","근거: around 40 different sounds(약 40가지 소리) / laughing sounds(웃음소리)","함정: 숫자 40과 laughing을 정확히 기억"],"why":"여우는 약 40가지 소리를 내며 웃음소리도 낼 수 있다.","sum":"The girl says foxes can make around (A)______ different sounds, and they can even make (B)______ sounds.","lab":"완성된 요약문 : "}],"dlg":[["G","What are you watching?","뭘 보고 있니?"],["B","I'm watching a video of a fox. A woman is playing with the fox, and it's so cute!","여우 영상을 보고 있어. 한 여자가 여우와 놀고 있는데, 정말 귀여워!"],["G","Did you know that foxes can make around 40 different sounds?","여우가 약 40가지의 다른 소리를 낼 수 있다는 거 알았니?"],["B","Oh, I didn't know that.","아, 그건 몰랐어."],["G","They can even make laughing sounds.","심지어 웃음소리도 낼 수 있어."],["B","Wow, that's amazing! I want to hear all those sounds.","와, 대단하다! 나는 그 소리들을 모두 듣고 싶어."]]},{"qs":[{"n":5,"q":"What does the girl know about gray whales?","o":["쇠고래는 세상에서 가장 짧은 여행을 한다.","쇠고래는 한 곳에서 머물며 먹이를 구한다.","쇠고래는 이동할 때 잠을 자지 않는다.","쇠고래는 새끼를 낳기 위해 여행한다.","쇠고래는 이빨을 이용해 먹는다."],"a":3,"ans":"쇠고래는 새끼를 낳기 위해 여행한다.","evs":[["G: Gray whales make the longest journey in the world! They swim more than 8,000 kilometers every year.","쇠고래는 세상에서 가장 긴 여행을 해! 해마다 8,000킬로미터가 넘게 헤엄쳐."],["G: They travel to get food and give birth to their babies.","먹이를 구하고 새끼를 낳기 위해 여행해."]],"ev":["G: Gray whales make the longest journey in the world! They swim more than 8,000 kilometers every year.","쇠고래는 세상에서 가장 긴 여행을 해! 해마다 8,000킬로미터가 넘게 헤엄쳐."],"ow":["오답 ✕ — 소녀는 'Gray whales make the longest journey in the world!'(쇠고래는 세상에서 가장 긴 여행을 해!)라고 했는데, 이 보기는 가장 짧은 여행이라서 틀림.","오답 ✕ — 쇠고래는 해마다 8,000킬로미터가 넘게 헤엄친다고 했으므로 한 곳에 머물지 않는다. 틀림.","오답 ✕ — 이동할 때 잠을 자지 않는다는 말은 대화에 없다. 소녀가 말한 것은 'They don't have any teeth.'(이빨이 하나도 없어.)이다.","정답 ○ — 'They travel to get food and give birth to their babies.'(먹이를 구하고 새끼를 낳기 위해 여행해.)라고 했으므로 새끼를 낳기 위해 여행한다는 것이 맞음.","오답 ✕ — 소녀는 'They don't have any teeth.'(이빨이 하나도 없어.)라고 했으므로 이빨을 이용해 먹는다는 보기는 틀림."],"memo":["정답 ④: 쇠고래는 새끼를 낳기 위해 여행한다.","근거: They travel to get food and give birth to their babies.(먹이를 구하고 새끼를 낳기 위해 여행해.)","함정: ⑤ 쇠고래는 이빨이 없다(don't have any teeth) ✕"],"why":"쇠고래는 먹이를 구하고 새끼를 낳기 위해 먼 길을 여행한다."}],"dlg":[["G","I am reading a book on gray whales for the science project.","나는 과학 프로젝트를 위해 쇠고래에 관한 책을 읽고 있어."],["B","What did you learn from the book?","책에서 뭘 배웠니?"],["G","Gray whales make the longest journey in the world! They swim more than 8,000 kilometers every year.","쇠고래는 세상에서 가장 긴 여행을 해! 해마다 8,000킬로미터가 넘게 헤엄쳐."],["B","Why do they travel such a long way?","그들은 왜 그렇게 먼 길을 여행해?"],["G","They travel to get food and give birth to their babies.","먹이를 구하고 새끼를 낳기 위해 여행해."],["B","I see. What else did you learn about gray whales?","그렇구나. 쇠고래에 대해 또 뭘 배웠니?"],["G","They don't have any teeth.","쇠고래는 이빨이 하나도 없어."],["B","I can't believe it! Then, how do they eat? I want to read that book, too.","믿을 수 없어! 그럼 어떻게 먹는 거야? 나도 그 책을 읽고 싶어."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["사람들과 달리, 대부분의 동물들은 집을 거의 떠나지 않는다.","집을 떠나는 동물들의 대부분은 동일한 이유를 갖고 있다.","특정 기간이 되면, 수백만 마리의 과일박쥐들이 잠비아의 국립공원으로 온다.","과일박쥐들은 아프리카의 일부 나라에서부터 이동해 온다.","과일박쥐들은 하룻밤에 그들의 몸무게보다 적게 먹는다."],"a":2,"ans":"특정 기간이 되면, 수백만 마리의 과일박쥐들이 잠비아의 국립공원으로 온다.","evs":[["From October to December, millions of fruit bats fly to Zambia's Kasanka National Park.","10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다."],["These bats come from all over Africa.","이 박쥐들은 아프리카의 전 지역에서 온다."]],"ev":["From October to December, millions of fruit bats fly to Zambia's Kasanka National Park.","10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다."],"ow":["오답 ✕ — 본문은 'Do you know animals also leave their homes and travel?'(동물들도 자신의 집을 떠나 여행한다는 것을 알고 있는가?)로 시작한다. 동물들이 집을 떠나 여행한다는 내용이라 이 보기는 틀림.","오답 ✕ — 'Many animals travel for different reasons.'(많은 동물이 다양한 이유로 여행한다.)라고 했는데, 이 보기는 동일한 이유라고 해서 틀림.","정답 ○ — 'From October to December, millions of fruit bats fly to Zambia's Kasanka National Park.'(10월부터 12월 사이에 수백만 마리의 과일박쥐가 카산카 국립공원으로 날아간다.)라고 했으므로 맞음.","오답 ✕ — 'These bats come from all over Africa.'(이 박쥐들은 아프리카의 전 지역에서 온다.)라고 했는데, 이 보기는 일부 나라에서만 온다고 해서 틀림.","오답 ✕ — 'They eat more than their weight in a night.'(그들은 하룻밤에 자신의 몸무게보다 더 많이 먹는다.)라고 했는데, 이 보기는 적게 먹는다고 해서 틀림."],"memo":["정답 ③: 특정 기간(10~12월)에 수백만 마리의 과일박쥐가 잠비아의 국립공원으로 온다.","근거: From October to December, millions of fruit bats fly to Zambia's Kasanka National Park.","함정: ⑤ more than(~보다 많이)과 less than(~보다 적게)을 구별하자 ✕"],"why":"과일박쥐는 10월부터 12월 사이에 잠비아의 국립공원으로 날아온다."},{"n":7,"q":"윗글의 첫 번째 단락의 제목으로 알맞은 것은?","o":["매월 반복되는 과일박쥐들의 대이동","잠비아의 카산카 국립공원의 야생동물들","아프리카 잠비아에서만 맛볼 수 있는 과일","대식가인 과일박쥐와 먹이를 위한 그들의 이동","과일박쥐 생태계 보존을 위한 잠비아 정부의 노력"],"a":3,"ans":"대식가인 과일박쥐와 먹이를 위한 그들의 이동","evs":[["They go there to eat wild fruit.","그들은 야생 과일을 먹기 위해 그곳에 간다."],["They are big eaters.","그들은 대식가이다."]],"ev":["They go there to eat wild fruit.","그들은 야생 과일을 먹기 위해 그곳에 간다."],"ow":["오답 ✕ — 'From October to December'(10월부터 12월 사이)라는 정해진 기간에 이동한다고 했지, 매월 반복된다는 말은 없다. 먹이라는 핵심도 빠져서 틀림.","오답 ✕ — 카산카 국립공원이 나오지만 그곳의 야생동물들을 소개하는 글이 아니다. 박쥐가 'to eat wild fruit'(야생 과일을 먹으려고) 온다는 내용이라 틀림.","오답 ✕ — 'wild fruit'(야생 과일)은 박쥐가 먹으러 가는 것이다. 잠비아에서만 맛볼 수 있는 과일을 소개하는 글이 아니라서 틀림.","정답 ○ — 'They are big eaters.'(그들은 대식가이다.)와 'They go there to eat wild fruit.'(그들은 야생 과일을 먹기 위해 그곳에 간다.)이므로 대식가인 과일박쥐가 먹이를 위해 이동한다는 제목이 알맞음.","오답 ✕ — 잠비아 정부의 노력이나 생태계 보존에 대한 내용은 본문에 없다. 가장 가까운 문장은 'They go there to eat wild fruit.'뿐이라 틀림."],"memo":["정답 ④: 대식가인 과일박쥐와 먹이를 위한 그들의 이동","근거: They are big eaters.(그들은 대식가이다.) / They go there to eat wild fruit.","함정: 정부의 노력·생태계 보존은 본문에 없다. ✕"],"why":"과일박쥐는 대식가여서 야생 과일을 먹으러 이동한다."},{"n":8,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["ocean - sun","forest - sun","ocean - moon","forest - moon","lake - sun"],"a":0,"ans":"ocean - sun","evs":[["However, when the rainy season begins in October, millions of red crabs march toward the ocean to lay eggs.","하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다."],["They follow the sun to get energy from it.","그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다."]],"ev":["However, when the rainy season begins in October, millions of red crabs march toward the ocean to lay eggs.","하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다."],"ow":["정답 ○ — 붉은게는 'march toward the ocean to lay eggs'(알을 낳기 위해 바다 쪽으로 행진한다)이므로 (A)는 ocean, 황금해파리는 'They follow the sun to get energy from it.'(에너지를 얻기 위해 태양을 따라간다.)이므로 (B)는 sun이 맞음.","오답 ✕ — (B) sun은 맞지만, 붉은게는 'red crabs live in forests'(숲에서 산다)일 뿐 알을 낳으러 가는 곳은 'toward the ocean'(바다 쪽)이라서 (A) forest는 틀림.","오답 ✕ — (A) ocean은 맞지만, 해파리는 'follow the sun'(태양을 따라간다)이라고 했으므로 달(moon)이 아니라서 틀림.","오답 ✕ — 붉은게가 알을 낳으러 가는 곳은 숲이 아니라 바다(ocean)이고, 해파리가 따라가는 것은 달이 아니라 태양(sun)이라서 둘 다 틀림.","오답 ✕ — (B) sun은 맞지만, 붉은게는 호수가 아니라 'march toward the ocean'(바다 쪽으로 행진한다)이라고 했다. 호수(lake)는 황금해파리가 사는 곳이라서 틀림."],"memo":["정답 ①: ocean - sun","근거: red crabs march toward the ocean to lay eggs / They follow the sun to get energy from it.","함정: 붉은게는 숲에 '살지만' 알은 바다에서 낳으러 간다. ✕"],"why":"붉은게는 알을 낳으러 바다로, 황금해파리는 에너지를 얻으러 태양을 따라간다.","sum":"Red crabs march toward the (A)______ to lay eggs, and golden jellyfish follow the (B)______ to get energy.","lab":"완성된 요약문 : "},{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["Animals never leave their homes.","Fruit bats travel to enjoy the wild fruit.","Fruit bats move during the hot summer.","A lot of red crabs move to the sea to avoid the rainy season.","Golden jellyfish leave their home and return every week."],"a":1,"ans":"Fruit bats travel to enjoy the wild fruit.","evs":[["They go there to eat wild fruit.","그들은 야생 과일을 먹기 위해 그곳에 간다."],["Every day, they move across the lake and then swim back.","매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다."]],"ev":["They go there to eat wild fruit.","그들은 야생 과일을 먹기 위해 그곳에 간다."],"ow":["오답 ✕ — 'Do you know animals also leave their homes and travel?'(동물들도 자신의 집을 떠나 여행한다는 것을 알고 있는가?)라고 했으므로 동물들은 집을 떠난다. 틀림.","정답 ○ — 과일박쥐는 'They go there to eat wild fruit.'(그들은 야생 과일을 먹기 위해 그곳에 간다.)라고 했으므로 야생 과일을 먹으러 여행한다는 것이 맞음.","오답 ✕ — 박쥐는 'From October to December'(10월부터 12월 사이)에 이동한다고만 했고, 더운 여름이라는 언급은 본문에 없어서 틀림.","오답 ✕ — 붉은게는 'when the rainy season begins in October'(10월에 우기가 시작되면) 바다로 가며 'to lay eggs'(알을 낳기 위해)이다. 우기를 피하려고 이동하는 것이 아니라서 틀림.","오답 ✕ — 황금해파리는 'Every day, they move across the lake and then swim back.'(매일 호수를 가로질러 이동한 뒤 다시 헤엄쳐 돌아온다.)라고 했는데, 이 보기는 매주라서 틀림."],"memo":["정답 ②: l to the park?","왜 그들이 그 공원으로 여행을 하는 것일까?"],["They go there to eat wild fruit.","그들은 야생 과일을 먹기 위해 그곳에 간다."],["They are big eaters.","그들은 대식가이다."],["They eat more than their weight in a night.","그들은 하룻밤에 자신의 몸무게보다 더 많은 양을 먹는다."],["Red Crabs on Christmas Island","크리스마스섬의 붉은게"],["On Christmas Island, red crabs live in forests, not in the water.","크리스마스섬에서 붉은게는 물속이 아니라 숲에서 산다."],["However, when the rainy season begins in October, millions of red crabs march toward the ocean to lay eggs.","하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다."],["During this period, they are all over the place, and the whole island turns red.","이 기간 동안에는 그들이 모든 곳에 걸쳐 있어서 섬 전체가 붉게 변한다."],["People close some roads and build bridges to protect them.","사람들은 그들을 보호하기 위해 일부 도로를 폐쇄하고 다리를 놓는다."],["With their help, the crabs move to the ocean safely.","사람들의 도움으로 게들은 바다로 안전하게 이동한다."],["Golden Jellyfish in Jellyfish Lake, Palau","팔라우의 젤리피시 호수에 사는 황금해파리"],["Jellyfish Lake in Palau is home to golden jellyfish.","팔라우의 젤리피시 호수는 황금해파리의 집이다."],["Every day, they move across the lake and then swim back.","매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다."],["Why do they travel every day?","왜 그들은 매일 여행을 할까?"],["They follow the sun to get energy from it.","그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다."],["When the sun rises in the morning, the jellyfish begin to swim toward the sun.","아침에 태양이 뜨면, 황금해파리들은 태양 쪽으로 헤엄치기 시작한다."],["In the afternoon, they travel back and wait for the next morning.","오후에는 다시 돌아와 다음 날 아침을 기다린다."]]}];
