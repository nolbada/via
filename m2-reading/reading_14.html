<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 14</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}
.sec{margin:26px 0 8px;font-weight:700;color:var(--pri);font-size:15px;border-left:4px solid var(--pri);padding-left:8px}
.sent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:10px;align-items:flex-start}.n{min-width:24px;color:var(--mut);font-size:13px;padding-top:3px}
.txt{font-size:18px;line-height:2}
.wd{cursor:pointer;border-radius:5px;padding:1px 2px;margin:0 1px;-webkit-tap-highlight-color:transparent}
.wd:hover{background:#eef3f8}.wd.on{background:var(--sel);box-shadow:inset 0 -2px 0 var(--selb)}
.locked .wd{cursor:default}.locked .wd:hover{background:none}
.wd.hit{background:var(--okbg);box-shadow:inset 0 -2px 0 var(--ok)}.wd.miss{background:var(--badbg);box-shadow:inset 0 -2px 0 var(--bad)}.wd.x{text-decoration:line-through;color:var(--mut)}
.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}
.note{margin:10px 0 0 34px;padding:10px 12px;border-radius:8px;font-size:14.5px}
.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Texting is the mainly way of communication for much people these days, especially for teenagers.","ko":"문자 메시지는 요즘 많은 사람들, 특히 십 대들의 주요 의사소통 수단이다.","ok":false,"foot":[],"fixes":[{"wrong":"mainly","right":"main","partial":false,"at":[3],"point":"형용사와 부사: 명사 way 앞에는 형용사 main 사용","topic":"형용사와 부사","memo":"명사 way 앞에는 형용사 main 사용"},{"wrong":"much","right":"many","partial":false,"at":[8],"point":"수량 형용사: people 앞에는 many 사용","topic":"수량 형용사","memo":"people 앞에는 many 사용"}]},{"n":2,"tag":null,"en":"Do you want to know how you can communicate more good through texting? Here are some useful tips.","ko":"문자 메시지를 통해 어떻게 의사소통을 더 잘할 수 있는지 알고 싶은가? 여기 몇 가지 유용한 팁이 있다.","ok":false,"foot":[],"fixes":[{"wrong":"more good","right":"better","partial":false,"at":[9],"point":"비교급: good의 비교급은 better","topic":"비교급","memo":"good의 비교급은 better"}]},{"n":3,"tag":null,"en":"1. You need to know who you are talking to.","ko":"1. 당신이 누구와 이야기하고 있는지 알아야 한다.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"Henry just sended the following text message to his mother.","ko":"Henry는 방금 엄마에게 다음과 같은 문자 메시지를 보냈다.","ok":false,"foot":[],"fixes":[{"wrong":"sended","right":"sent","partial":false,"at":[2],"point":"불규칙 과거형: send의 과거형은 sent (sended 아님)","topic":"불규칙 과거형","memo":"send의 과거형은 sent (sended 아님)"}]},{"n":5,"tag":null,"en":"- Mom, I want you to wait just a few longer. BRT.","ko":"- 엄마, 조금만 더 기다려 주세요. BRT.","ok":false,"foot":[],"fixes":[{"wrong":"few","right":"little","partial":false,"at":[9],"point":"수량 형용사: a little longer: 셀 수 없는 시간에는 a little 사용","topic":"수량 형용사","memo":"a little longer: 셀 수 없는 시간에는 a little 사용"}]},{"n":6,"tag":null,"en":"Do you think Henry's mother correct understood BRT? Probably not.","ko":"당신은 Henry의 엄마가 BRT를 정확히 이해했다고 생각하는가? 아마도 그렇지 않을 것이다.","ok":false,"foot":[],"fixes":[{"wrong":"correct","right":"correctly","partial":false,"at":[5],"point":"형용사와 부사: 동사 understood를 꾸밀 때는 부사 correctly 사용","topic":"형용사와 부사","memo":"동사 understood를 꾸밀 때는 부사 correctly 사용"}]},{"n":7,"tag":null,"en":"You can use expression like BRT (be right there), JK (just kidding), or LOL (laughing out loud) when you text your friends.","ko":"친구들에게 문자 메시지를 보낼 때 BRT(곧 갈게), JK(농담이야), 또는 LOL(소리 내어 웃음) 같은 표현들을 사용할 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"expression","right":"expressions","partial":false,"at":[3],"point":"명사의 복수형: 관사 없는 일반 의미는 복수 expressions 사용","topic":"명사의 복수형","memo":"관사 없는 일반 의미는 복수 expressions 사용"}]},{"n":8,"tag":null,"en":"However, be carefully with such expressions when you text your teachers or parents.","ko":"하지만 선생님이나 부모님께 문자 메시지를 보낼 때는 그런 표현을 쓰는 것에 주의해라.","ok":false,"foot":[],"fixes":[{"wrong":"carefully","right":"careful","partial":false,"at":[2],"point":"형용사와 부사: be 뒤 보어 자리에는 형용사 careful 사용","topic":"형용사와 부사","memo":"be 뒤 보어 자리에는 형용사 careful 사용"}]},{"n":9,"tag":null,"en":"You need to understand that some of them may not knows the meanings of such expressions.","ko":"그들 중 일부는 이런 표현의 의미를 모를 수도 있다는 것을 이해해야 한다.","ok":false,"foot":[],"fixes":[{"wrong":"knows","right":"know","partial":false,"at":[10],"point":"조동사: 조동사 may not 뒤 동사원형: know (knows 아님)","topic":"조동사","memo":"조동사 may not 뒤 동사원형: know (knows 아님)"}]},{"n":10,"tag":null,"en":"2. You need to understand that people uses emojis differently.","ko":"2. 당신은 사람들이 이모지를 다르게 사용한다는 점을 이해해야 한다.","ok":false,"foot":[],"fixes":[{"wrong":"uses","right":"use","partial":false,"at":[7],"point":"be동사/일반동사 수일치: people은 복수 취급, use 사용","topic":"be동사/일반동사 수일치","memo":"people은 복수 취급, use 사용"}]},{"n":11,"tag":null,"en":"Yesterday, Jisu gave a birthday gift to her little brother Jihoo. Later, she got the following text message.","ko":"어제 지수는 남동생 지후에게 생일 선물을 주었다. 이후에, 그녀는 다음과 같은 문자 메시지를 받았다.","ok":true,"foot":[],"fixes":[]},{"n":12,"tag":null,"en":"- I loved you gift. Thanks a lot. ","ko":"- 선물이 아주 마음에 들었어. 정말 고마워. ","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[3],"point":"인칭대명사의 격: 명사 앞 소유격 your 사용","topic":"인칭대명사의 격","memo":"명사 앞 소유격 your 사용"}]},{"n":13,"tag":null,"en":"\"Only one smiling faces ()? I guess he didn't liked my gift,\" Jisu thought.","ko":"\"웃는 얼굴()이 하나뿐이네? 내 선물이 마음에 안 들었나 봐.\"라고 지수는 생각했다.","ok":false,"foot":[],"fixes":[{"wrong":"faces","right":"face","partial":false,"at":[3],"point":"명사의 복수형: one 뒤에는 단수명사 face 사용","topic":"명사의 복수형","memo":"one 뒤에는 단수명사 face 사용"},{"wrong":"liked","right":"like","partial":false,"at":[9],"point":"과거 부정문: didn't 뒤에는 동사원형 like 사용","topic":"과거 부정문","memo":"didn't 뒤에는 동사원형 like 사용"}]},{"n":14,"tag":null,"en":"When we talk with someone, we use not only words but also facial expressions and body language. In texting, we use emojis instead.","ko":"우리는 누군가와 대화할 때, 말뿐만 아니라 얼굴 표정과 몸짓 언어도 사용한다. 문자 메시지를 보낼 때, 우리는 대신 이모지를 사용한다.","ok":true,"foot":[],"fixes":[]},{"n":15,"tag":null,"en":"Sometimes, a little emoji like  can speak louder than much words. The problem is that not everybody use emojis in the same way.","ko":"때때로  같은 작은 이모지가 많은 말보다 더 큰 의미를 말할 수 있다. 문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다.","ok":false,"foot":[],"fixes":[{"wrong":"much","right":"many","partial":false,"at":[10],"point":"수량 형용사: words(복수) 앞에는 many 사용","topic":"수량 형용사","memo":"words(복수) 앞에는 many 사용"},{"wrong":"use","right":"uses","partial":false,"at":[18],"point":"주어와 동사의 수일치: everybody는 단수 취급: uses (use 아님)","topic":"주어와 동사의 수일치","memo":"everybody는 단수 취급: uses (use 아님)"}]},{"n":16,"tag":null,"en":"Some people like to use them a lot, and some doesn't. In addition, the same emojis can mean different thing to different people.","ko":"어떤 사람들은 이모지를 많이 사용하는 것을 좋아하고, 어떤 사람들은 그렇지 않다. 게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"doesn't","right":"don't","partial":false,"at":[10],"point":"do/does: 복수 주어 some은 don't (doesn't 아님)","topic":"do/does","memo":"복수 주어 some은 don't (doesn't 아님)"},{"wrong":"thing","right":"things","partial":false,"at":[19],"point":"명사의 복수형: different 뒤 복수명사 things 사용","topic":"명사의 복수형","memo":"different 뒤 복수명사 things 사용"}]}];var PP=[["Texting is the main way 로  같은 작은 이모지가 많은 말보다 더 큰 의미를 말할 수 있다.",0],["The problem is that not everybody uses emojis in the same way.","문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다.",0],["Some people like to use them a lot, and some don't.","어떤 사람들은 이모지를 많이 사용하는 것을 좋아하고, 어떤 사람들은 그렇지 않다.",0],["In addition, the same emojis can mean different things to different people.","게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다.",0]];var RNUM=14;var TITLE_EN="Text Better, Communicate Better!";var PASS_EN=["Text Better, Communicate Better!","Texting is the main way of communication for many people these days, especially for teenagers. Do you want to know how you can communicate better through texting? Here are some useful tips.","1. You need to know who you are talking to.","Henry just sent the following text message to his mother.","- Mom, I want you to wait just a little longer. BRT.","Do you think Henry's mother correctly understood BRT? Probably not.","You can use expressions like BRT (be right there), JK (just kidding), or LOL (laughing out loud) when you text your friends. However, be careful with such expressions when you text your teachers or parents. You need to understand that some of them may not know the meanings of such expressions.","2. You need to understand that people use emojis differently.","Yesterday, Jisu gave a birthday gift to her little brother Jihoo. Later, she got the following text message.","- I loved your gift. Thanks a lot. ","\"Only one smiling face ()? I guess he didn't like my gift,\" Jisu thought.","When we talk with someone, we use not only words but also facial expressions and body language. In texting, we use emojis instead. Sometimes, a little emoji like  can speak louder than many words. The problem is that not everybody uses emojis in the same way. Some people like to use them a lot, and some don't. In addition, the same emojis can mean different things to different people."];var PASS_KO=["문자 메시지를 더 잘 쓸수록, 의사소통을 더 잘할 수 있어요!","문자 메시지는 요즘 많은 사람들, 특히 십 대들의 주요 의사소통 수단이다. 문자 메시지를 통해 어떻게 의사소통을 더 잘할 수 있는지 알고 싶은가? 여기 몇 가지 유용한 팁이 있다.","1. 당신이 누구와 이야기하고 있는지 알아야 한다.","Henry는 방금 엄마에게 다음과 같은 문자 메시지를 보냈다.","- 엄마, 조금만 더 기다려 주세요. BRT.","당신은 Henry의 엄마가 BRT를 정확히 이해했다고 생각하는가? 아마도 그렇지 않을 것이다.","친구들에게 문자 메시지를 보낼 때 BRT(곧 갈게), JK(농담이야), 또는 LOL(소리 내어 웃음) 같은 표현들을 사용할 수 있다. 하지만 선생님이나 부모님께 문자 메시지를 보낼 때는 그런 표현을 쓰는 것에 주의해라. 그들 중 일부는 이런 표현의 의미를 모를 수도 있다는 것을 이해해야 한다.","2. 당신은 사람들이 이모지를 다르게 사용한다는 점을 이해해야 한다.","어제 지수는 남동생 지후에게 생일 선물을 주었다. 이후에, 그녀는 다음과 같은 문자 메시지를 받았다.","- 선물이 아주 마음에 들었어. 정말 고마워. ","\"웃는 얼굴()이 하나뿐이네? 내 선물이 마음에 안 들었나 봐.\"라고 지수는 생각했다.","우리는 누군가와 대화할 때, 말뿐만 아니라 얼굴 표정과 몸짓 언어도 사용한다. 문자 메시지를 보낼 때, 우리는 대신 이모지를 사용한다. 때때로  같은 작은 이모지가 많은 말보다 더 큰 의미를 말할 수 있다. 문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다. 어떤 사람들은 이모지를 많이 사용하는 것을 좋아하고, 어떤 사람들은 그렇지 않다. 게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["소녀는 요리의 이름을 철자로 말해 주었다.","소년은 요리 이름의 철자를 알려 주었다.","두 사람은 불고기를 만드는 방법을 이야기한다.","소녀는 불고기를 좋아하지 않는다.","소년은 요리의 가격을 말해 주었다."],"a":1,"ans":"소년은 요리 이름의 철자를 알려 주었다.","evs":[["G: Bul … How do you spell it?","불… 철자가 어떻게 되니?"],["B: It's b-u-l-g-o-g-i. Bulgogi.","b-u-l-g-o-g-i야. 불고기."]],"ev":["G: Bul … How do you spell it?","불… 철자가 어떻게 되니?"],"ow":["오답 ✕ — 철자를 물어본 사람이 소녀('How do you spell it?')이고, 철자를 말해 준 사람은 소년이다.","정답 ○ — 소녀가 'How do you spell it?'(철자가 어떻게 되니?)이라고 묻자 소년이 'It's b-u-l-g-o-g-i.'(b-u-l-g-o-g-i야.)라고 철자를 알려 주었다.","오답 ✕ — 소녀는 'What's the name of the dish?'(그 요리의 이름이 뭐야?)라고 이름을 물었을 뿐 만드는 방법은 묻지 않았다.","오답 ✕ — 소녀가 불고기를 좋아하는지 싫어하는지는 대화에 나오지 않는다.","오답 ✕ — 가격에 대한 말은 대화에 없다. 소년은 'It's bulgogi.'(불고기야.)라고 이름만 말했다."],"memo":["정답 ②: 소년은 요리 이름의 철자를 알려 주었다.","근거: It's b-u-l-g-o-g-i.(b-u-l-g-o-g-i야.)","함정: ① 철자를 물어본 사람은 소녀이다. ✕"],"why":"소녀가 철자를 묻자 소년이 불고기의 철자를 알려 주었다."}],"dlg":[["G","What's the name of the dish?","그 요리의 이름이 뭐야?"],["B","It's bulgogi.","불고기야."],["G","Bul … How do you spell it?","불… 철자가 어떻게 되니?"],["B","It's b-u-l-g-o-g-i. Bulgogi.","b-u-l-g-o-g-i야. 불고기."]]},{"qs":[{"n":2,"q":"여자가 공항 근처에서 묵을 곳을 찾는 이유로 알맞은 것은?","o":["내일 이른 아침에 비행기를 타야 해서","공항에서 일하게 되어서","호텔 직원에게 철자를 알려 주려고","오늘 밤 비행기가 취소되어서","공항 근처에 사는 친구를 만나려고"],"a":0,"ans":"내일 이른 아침에 비행기를 타야 해서","evs":[["I'm looking for a place to stay near the airport. I have an early morning flight tomorrow.","저는 공항 근처에서 묵을 곳을 찾고 있어요. 내일 이른 아침 비행기가 있거든요."]],"ev":["I'm looking for a place to stay near the airport. I have an early morning flight tomorrow.","저는 공항 근처에서 묵을 곳을 찾고 있어요. 내일 이른 아침 비행기가 있거든요."],"ow":["정답 ○ — 여자가 'I have an early morning flight tomorrow.'(내일 이른 아침 비행기가 있어요.)라고 이유를 말했다.","오답 ✕ — 'I'm looking for a place to stay near the airport.'(공항 근처에서 묵을 곳을 찾고 있어요.)라고 했을 뿐 공항에서 일한다는 말은 없다.","오답 ✕ — 철자를 묻는 'Can you please spell it for me?'(철자를 말씀해 주시겠어요?)는 호텔 이름을 모르기 때문이지 숙소를 찾는 이유가 아니다.","오답 ✕ — 비행기가 취소되었다는 말은 없고 'I have an early morning flight tomorrow.'(내일 이른 아침 비행기가 있어요.)라고 했다.","오답 ✕ — 친구를 만난다는 말은 없다. 이유는 이른 아침 비행기 때문이다."],"memo":["정답 ①: 내일 이른 아침에 비행기를 타야 해서","근거: I have an early morning flight tomorrow.(내일 이른 아침 비행기가 있어요.)","함정: ④ 비행기가 취소된 것이 아니라 일찍 출발하는 것이다. ✕"],"why":"이른 아침 비행기를 타야 해서 공항 근처 호텔을 찾는다."}],"dlg":[["W","I'm looking for a place to stay near the airport. I have an early morning flight tomorrow.","저는 공항 근처에서 묵을 곳을 찾고 있어요. 내일 이른 아침 비행기가 있거든요."],["M","I see. The closest hotel to the airport will be the Miraero.","알겠습니다. 공항에서 가장 가까운 호텔은 미래로 호텔일 것입니다."],["W","Excuse me? Can you please spell it for me?","네? 그 철자를 말씀해 주시겠어요?"],["M","Here. I'll write it for you.","여기요. 제가 적어 드릴게요."]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하는 것은?","o":["소년은 여자에게 탑승구 번호를 다시 말해 달라고 했다.","여자는 소년에게 13번 탑승구를 찾아 주겠다고 했다.","소년은 10시 이후에 탑승구에 가도 된다.","여자는 소년에게 작별 인사를 했다.","소년은 약국이 어디 있는지 물었다."],"a":0,"ans":"소년은 여자에게 탑승구 번호를 다시 말해 달라고 했다.","evs":[["B: Can you please say the gate number again?","탑승구 번호를 다시 말씀해 주시겠어요?"],["W: Sure. I said, “gate 13.” You need to be there by 10.","물론이죠. 제가 '13번 탑승구'라고 했어요. 10시까지 거기에 가 있어야 해요."]],"ev":["B: Can you please say the gate number again?","탑승구 번호를 다시 말씀해 주시겠어요?"],"ow":["정답 ○ — 소년이 'Can you please say the gate number again?'(탑승구 번호를 다시 말씀해 주시겠어요?)라고 부탁했다.","오답 ✕ — 여자는 'Just go to gate 13 by 10:00.'(10시까지 13번 탑승구로 가기만 하면 돼요.)라고 안내했을 뿐 찾아 주겠다고 하지 않았다.","오답 ✕ — 여자가 'You need to be there by 10.'(10시까지 거기에 가 있어야 해요.)라고 했으므로 10시 이후가 아니라 10시까지 가야 한다.","오답 ✕ — 작별 인사를 하는 장면이 아니다. 'You're all set.'(준비가 다 되었어요.)라며 탑승 안내를 해 준다.","오답 ✕ — 약국에 대한 말은 대화에 없다. 소년이 묻는 것은 탑승구 번호이다."],"memo":["정답 ①: 소년은 탑승구 번호를 다시 말해 달라고 했다.","근거: Can you please say the gate number again?(탑승구 번호를 다시 말씀해 주시겠어요?)","함정: ③ 10시 '이후'가 아니라 10시 '까지'이다. ✕"],"why":"소년이 탑승구 번호를 다시 물었고 여자는 10시까지 13번 탑승구로 가라고 했다."}],"dlg":[["W","You're all set. Just go to gate 13 by 10:00.","준비가 다 되었어요. 10시까지 13번 탑승구로 가기만 하면 돼요."],["B","Can you please say the gate number again?","탑승구 번호를 다시 말씀해 주시겠어요?"],["W","Sure. I said, “gate 13.” You need to be there by 10.","물론이죠. 제가 '13번 탑승구'라고 했어요. 10시까지 거기에 가 있어야 해요."],["B","Got it. Thank you very much.","알겠습니다. 정말 감사합니다."]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["Emma는 기차역에서 우연히 지한을 만났다.","Emma는 오타와에서 오는 삼촌을 기다리고 있다.","지한은 오타와를 어떻게 발음하는지 다시 묻는다.","Emma의 삼촌은 다음 달에 서울에서 결혼식을 올린다.","Emma는 삼촌의 결혼식에 참석하지 못하고 문자로 축하할 것이다."],"a":4,"ans":"Emma는 삼촌의 결혼식에 참석하지 못하고 문자로 축하할 것이다.","evs":[["G: Well, my parents will, but I don't think I can.","음, 부모님은 가시겠지만 나는 갈 수 없을 것 같아."],["G: Yeah. I guess I'll just have to text him and say congratulations.","응. 그냥 삼촌께 문자를 보내서 축하한다고 말해야 할 것 같아."]],"ev":["G: Well, my parents will, but I don't think I can.","음, 부모님은 가시겠지만 나는 갈 수 없을 것 같아."],"ow":["오답 ✕ — 대화는 'I didn't expect to see you here at the airport.'(여기 공항에서 너를 볼 줄은 몰랐어.)로 시작하므로 기차역이 아니라 공항에서 만났다.","오답 ✕ — 엠마는 'My parents and I just said goodbye to Uncle Ted.'(부모님과 나는 방금 테드 삼촌께 작별 인사를 했어.)라고 했으므로 삼촌을 기다리는 것이 아니라 배웅한 것이다.","오답 ✕ — 지한은 'How do you spell it?'(철자가 어떻게 되니?)이라고 했으므로 발음이 아니라 철자를 물었다.","오답 ✕ — 'he is getting married there next month'(삼촌은 다음 달에 거기서 결혼하셔)에서 there는 오타와이므로 서울이 아니다.","정답 ○ — 엠마가 'I don't think I can.'(나는 갈 수 없을 것 같아.)이라고 했고 'I'll just have to text him and say congratulations.'(삼촌께 문자를 보내 축하한다고 말해야 할 것 같아.)라고 했으므로 맞다."],"memo":["정답 ⑤: 엠마는 결혼식에 못 가고 문자로 축하할 것이다.","근거: I'll just have to text him and say congratulations.(삼촌께 문자를 보내서 축하한다고 말해야겠어.)","함정: ③ 발음이 아니라 철자(spell)를 물었다. ✕"],"why":"엠마는 삼촌의 결혼식에 갈 수 없어서 문자로 축하하려 한다."},{"n":5,"q":"다음 대화를 읽고 답할 수 없는 질문은?","o":["Whom does Jihan meet at the airport?","Why is Emma at the airport?","What is the capital of Canada?","When is Uncle Ted getting married?","How long did Uncle Ted stay in Seoul?"],"a":4,"ans":"How long did Uncle Ted stay in Seoul?","evs":[["G: My parents and I just said goodbye to Uncle Ted.","부모님과 나는 방금 테드 삼촌께 작별 인사를 했어."],["G: It's the capital of Canada. Anyway, he is getting married there next month.","캐나다의 수도야. 어쨌든 삼촌은 다음 달에 거기서 결혼하셔."]],"ev":["G: My parents and I just said goodbye to Uncle Ted.","부모님과 나는 방금 테드 삼촌께 작별 인사를 했어."],"ow":["오답 ✕ — 'Hi, Emma. I didn't expect to see you here at the airport.'(안녕, 엠마. 여기 공항에서 너를 볼 줄은 몰랐어.)라고 했으므로 지한이 만난 사람은 엠마라고 답할 수 있다.","오답 ✕ — 'My parents and I just said goodbye to Uncle Ted.'(부모님과 나는 방금 테드 삼촌께 작별 인사를 했어.)라고 했으므로 엠마가 공항에 온 이유를 알 수 있다.","오답 ✕ — 'It's the capital of Canada.'(캐나다의 수도야.)라고 했으므로 캐나다의 수도가 오타와임을 알 수 있다.","오답 ✕ — 'he is getting married there next month'(삼촌은 다음 달에 거기서 결혼하셔)이므로 결혼 시기를 알 수 있다.","정답 ○ — 'He was visiting us'(삼촌이 우리를 방문했었다)라고만 했을 뿐 얼마나 오래 머물렀는지는 대화에 나오지 않는다."],"memo":["정답 ⑤: 삼촌이 얼마나 오래 머물렀는지는 답할 수 없다.","근거: He was visiting us(삼촌이 우리를 방문했었어) - 기간은 언급 없음","함정: ④ next month로 답할 수 있다. ✕"],"why":"삼촌이 머문 기간은 대화에 나오지 않는다."}],"dlg":[["B","Hi, Emma. I didn't expect to see you here at the airport.","안녕, 엠마. 여기 공항에서 너를 볼 줄은 몰랐어."],["G","Hi, Jihan. My parents and I just said goodbye to Uncle Ted. He was visiting us, but he is going back to Ottawa just now.","안녕, 지한아. 부모님과 나는 방금 테드 삼촌께 작별 인사를 했어. 삼촌이 우리를 방문했었는데, 지금 막 오타와로 돌아가셔."],["B","Excuse me? He is going back to where?","뭐라고? 어디로 돌아가신다고?"],["G","Ottawa.","오타와."],["B","A . . . ra . . . How do you spell it?","오... 라... 철자가 어떻게 되니?"],["G","O-t-t-a-w-a. It's the capital of Canada. Anyway, he is getting married there next month.","O-t-t-a-w-a야. 캐나다의 수도야. 어쨌든 삼촌은 다음 달에 거기서 결혼하셔."],["B","Really? Are you going to go to his wedding?","정말? 너는 삼촌의 결혼식에 갈 거니?"],["G","Well, my parents will, but I don't think I can.","음, 부모님은 가시겠지만 나는 갈 수 없을 것 같아."],["B","That's too bad.","안됐다."],["G","Yeah. I guess I'll just have to text him and say congratulations.","응. 그냥 삼촌께 문자를 보내서 축하한다고 말해야 할 것 같아."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Henry sent a text message to his mom.","Perhaps Henry's mom did not understand BRT.","BRT means “Be Right There.”","You can use expressions like JK or LOL in text messages to your friends.","All teachers and parents understand expressions like JK or LOL."],"a":4,"ans":"All teachers and parents understand expressions like JK or LOL.","evs":[["Henry just sent the following text message to his mother.","Henry는 방금 엄마에게 다음과 같은 문자 메시지를 보냈다."],["You need to understand that some of them may not know the meanings of such expressions.","그들 중 일부는 이런 표현의 의미를 모를 수도 있다는 것을 이해해야 한다."]],"ev":["Henry just sent the following text message to his mother.","Henry는 방금 엄마에게 다음과 같은 문자 메시지를 보냈다."],"ow":["오답 ✕ — 'Henry just sent the following text message to his mother.'(Henry는 방금 엄마에게 문자 메시지를 보냈다.)이므로 일치한다.","오답 ✕ — 'Do you think Henry's mother correctly understood BRT? Probably not.'(Henry의 엄마가 BRT를 정확히 이해했다고 생각하는가? 아마도 그렇지 않을 것이다.)이므로 일치한다.","오답 ✕ — 'BRT (be right there)'(BRT는 곧 갈게)라고 했으므로 일치한다.","오답 ✕ — 'You can use expressions like BRT, JK, or LOL when you text your friends.'(친구들에게 문자를 보낼 때 BRT, JK, LOL 같은 표현을 쓸 수 있다.)이므로 일치한다.","정답(일치하지 않는 것) ○ — 'some of them may not know the meanings of such expressions'(그들 중 일부는 이런 표현의 의미를 모를 수도 있다)라고 했으므로 모든 선생님과 부모님이 이해한다는 말은 틀리다."],"memo":["정답 ⑤: 모든 선생님과 부모님이 JK, LOL을 이해한다 (✕).","근거: some of them may not know the meanings of such expressions.(그들 중 일부는 이런 표현의 의미를 모를 수도 있다.)","함정: 'all(모두)'이 들어간 보기는 의심하기. 불일치 문제이니 틀린 것을 고른다."],"why":"모든 선생님과 부모님이 줄임 표현을 안다는 것은 본문과 다르다."},{"n":7,"q":"윗글의 첫 번째 팁(1.)의 요지로 알맞은 것은?","o":["문자를 보낼 때는 받는 사람이 누구인지 생각해서 표현을 골라야 한다.","친구에게도 줄임말을 쓰면 안 된다.","부모님께는 문자를 보내지 말아야 한다.","문자는 짧게 쓸수록 좋다.","줄임말은 선생님만 이해할 수 있다."],"a":0,"ans":"문자를 보낼 때는 받는 사람이 누구인지 생각해서 표현을 골라야 한다.","evs":[["You need to know who you are talking to.","당신이 누구와 이야기하고 있는지 알아야 한다."],["However, be careful with such expressions when you text your teachers or parents.","하지만 선생님이나 부모님께 문자 메시지를 보낼 때는 그런 표현을 쓰는 것에 주의해라."]],"ev":["You need to know who you are talking to.","당신이 누구와 이야기하고 있는지 알아야 한다."],"ow":["정답 ○ — 'You need to know who you are talking to.'(당신이 누구와 이야기하고 있는지 알아야 한다.)라고 했으므로 받는 사람에 맞게 표현을 골라야 한다.","오답 ✕ — 'You can use expressions like BRT, JK, or LOL when you text your friends.'(친구들에게는 BRT, JK, LOL 같은 표현을 쓸 수 있다.)라고 했으므로 친구에게는 써도 된다.","오답 ✕ — 부모님께 문자를 보내지 말라는 것이 아니라 'be careful with such expressions'(그런 표현을 쓰는 것에 주의해라)라고 했다.","오답 ✕ — 문자의 길이에 대한 말은 없다. 핵심은 받는 사람이 누구인지 알고 표현을 고르는 것이다.","오답 ✕ — 'some of them may not know the meanings'(그들 중 일부는 의미를 모를 수도 있다)라고 했고, 줄임말은 친구들이 쓰는 표현이므로 선생님만 이해한다는 말은 틀리다."],"memo":["정답 ①: 받는 사람에 맞게 표현을 골라 쓰기","근거: You need to know who you are talking to.(당신이 누구와 이야기하고 있는지 알아야 한다.)","함정: ② 친구에게는 BRT, JK, LOL을 써도 된다. ✕"],"why":"받는 사람이 누구인지 알고, 선생님이나 부모님께는 줄임 표현을 조심해야 한다."}],"pp":[["Texting is the main way of communication for many people these days, especially for teenagers.","문자 메시지는 요즘 많은 사람들, 특히 십 대들의 주요 의사소통 수단이다."],["Do you want to know how you can communicate better through texting?","문자 메시지를 통해 어떻게 의사소통을 더 잘할 수 있는지 알고 싶은가?"],["Here are some useful tips.","여기 몇 가지 유용한 팁이 있다."],["1. You need to know who you are talking to.","1. 당신이 누구와 이야기하고 있는지 알아야 한다."],["Henry just sent the following text message to his mother.","Henry는 방금 엄마에게 다음과 같은 문자 메시지를 보냈다."],["- Mom, I want you to wait just a little longer.","- 엄마, 조금만 더 기다려 주세요."],["BRT.","BRT."],["Do you think Henry's mother correctly understood BRT?","당신은 Henry의 엄마가 BRT를 정확히 이해했다고 생각하는가?"],["Probably not.","아마도 그렇지 않을 것이다."],["You can use expressions like BRT (be right there), JK (just kidding), or LOL (laughing out loud) when you text your friends.","친구들에게 문자 메시지를 보낼 때 BRT(곧 갈게), JK(농담이야), 또는 LOL(소리 내어 웃음) 같은 표현들을 사용할 수 있다."],["However, be careful with such expressions when you text your teachers or parents.","하지만 선생님이나 부모님께 문자 메시지를 보낼 때는 그런 표현을 쓰는 것에 주의해라."],["You need to understand that some of them may not know the meanings of such expressions.","그들 중 일부는 이런 표현의 의미를 모를 수도 있다는 것을 이해해야 한다."]]},{"qs":[{"n":8,"q":"윗글의 제목으로 알맞은 것은?","o":["How Did Emojis Start?","Advantages of Using Emojis","Expressing Emotions through Emojis","Emojis: Clear and Easy to Understand","Do We All Use Emojis the Same Way?"],"a":4,"ans":"Do We All Use Emojis the Same Way?","evs":[["The problem is that not everybody uses emojis in the same way.","문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다."],["In addition, the same emojis can mean different things to different people.","게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다."]],"ev":["The problem is that not everybody uses emojis in the same way.","문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다."],"ow":["오답 ✕ — 이모지가 어떻게 시작되었는지는 글에 나오지 않는다. 글은 'not everybody uses emojis in the same way'(모든 사람이 이모지를 같은 방식으로 쓰는 것은 아니다)를 말한다.","오답 ✕ — 이모지의 장점을 나열한 글이 아니다. 'The problem is'(문제는 ~이다)라며 사람마다 다르게 쓰는 문제점을 말한다.","오답 ✕ — 'a little emoji can speak louder than many words'(작은 이모지가 많은 말보다 더 큰 의미를 말할 수 있다)는 나오지만 글 전체의 중심은 감정 표현이 아니라 쓰는 방식의 차이이다.","오답 ✕ — 'the same emojis can mean different things to different people'(같은 이모지도 사람마다 다른 것을 의미할 수 있다)라고 했으므로 분명하고 이해하기 쉽다는 말은 본문과 반대이다.","정답 ○ — 'not everybody uses emojis in the same way'(모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니다)이므로 'Do We All Use Emojis the Same Way?'가 제목으로 알맞다."],"memo":["정답 ⑤: Do We All Use Emojis the Same Way?","근거: not everybody uses emojis in the same way.(모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니다.)","함정: ④ 이모지는 '분명'하지 않고 사람마다 다르게 이해한다. ✕"],"why":"사람마다 이모지를 쓰는 방식과 뜻이 다르다는 내용이다."},{"n":9,"q":"지수의 이야기와 일치하는 것은?","o":["지수는 어제 남동생 지후에게 생일 선물을 주었다.","지수는 어제 엄마에게서 생일 선물을 받았다.","지후는 선물이 마음에 들지 않는다는 문자를 보냈다.","지후의 문자에는 웃는 얼굴 이모지가 여러 개 있었다.","지수는 문자를 받고 매우 기뻐했다."],"a":0,"ans":"지수는 어제 남동생 지후에게 생일 선물을 주었다.","evs":[["Yesterday, Jisu gave a birthday gift to her little brother Jihoo.","어제 지수는 남동생 지후에게 생일 선물을 주었다."],["I guess he didn't like my gift,\" Jisu thought.","내 선물이 마음에 안 들었나 봐.\"라고 지수는 생각했다."]],"ev":["Yesterday, Jisu gave a birthday gift to her little brother Jihoo.","어제 지수는 남동생 지후에게 생일 선물을 주었다."],"ow":["정답 ○ — 'Jisu gave a birthday gift to her little brother Jihoo.'(지수는 남동생 지후에게 생일 선물을 주었다.)와 같다.","오답 ✕ — 선물을 받은 사람은 지후이다. 지수는 선물을 준 사람이다.","오답 ✕ — 지후의 문자는 'I loved your gift. Thanks a lot.'(선물이 아주 마음에 들었어. 정말 고마워.)이므로 마음에 든다는 내용이다.","오답 ✕ — 지수는 'Only one smiling face'(웃는 얼굴이 하나뿐이네)라고 했으므로 이모지는 하나뿐이었다.","오답 ✕ — 지수는 'I guess he didn't like my gift,' Jisu thought.(내 선물이 마음에 안 들었나 봐.)라며 걱정했으므로 기뻐한 것이 아니다."],"memo":["정답 ①: 지수는 남동생 지후에게 생일 선물을 주었다.","근거: Jisu gave a birthday gift to her little brother Jihoo.(지수는 남동생 지후에게 생일 선물을 주었다.)","함정: ⑤ 지수는 이모지가 하나뿐이라 오해하고 걱정했다. ✕"],"why":"지후는 선물이 마음에 들었는데 지수는 웃는 얼굴이 하나뿐이라 오해했다."},{"n":10,"q":"다음은 윗글의 두 번째 팁을 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["emojis - meanings","words - sounds","texts - lengths","gifts - prices","faces - colors"],"a":0,"ans":"emojis - meanings","evs":[["The problem is that not everybody uses emojis in the same way.","문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다."],["In addition, the same emojis can mean different things to different people.","게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다."]],"ev":["The problem is that not everybody uses emojis in the same way.","문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다."],"ow":["정답 ○ — 'not everybody uses emojis in the same way'(모든 사람이 이모지를 같은 방식으로 쓰는 것은 아니다)와 'the same emojis can mean different things'(같은 이모지도 다른 것을 의미할 수 있다)이므로 emojis - meanings이다.","오답 ✕ — 'words'(말)는 emojis를 대신하는 것이 아니라 비교 대상이고, sounds(소리)는 본문에 나오지 않는다.","오답 ✕ — 문자의 길이(lengths)는 본문에 나오지 않는다. 사람마다 다른 것은 이모지의 의미이다.","오답 ✕ — 선물(gifts)은 지수의 이야기에 나오지만 이모지 사용의 차이와는 상관이 없고, prices(가격)도 나오지 않는다.","오답 ✕ — 'smiling face'(웃는 얼굴)가 나오지만 사람마다 다른 것은 얼굴이 아니라 이모지의 의미이고, colors(색깔)는 나오지 않는다."],"memo":["정답 ①: emojis - meanings","근거: the same emojis can mean different things to different people.(같은 이모지도 사람마다 다른 것을 의미할 수 있다.)","함정: ⑤ 얼굴 이모지가 나와도 색깔 이야기는 없다. ✕"],"why":"이모지를 쓰는 방식과 그 의미는 사람마다 다르다.","sum":"Not everybody uses (A) in the same way, and the same ones can have different (B) to different people.","lab":"완성된 요약문 : "}],"pp":[["2. You need to understand that people use emojis differently.","2. 당신은 사람들이 이모지를 다르게 사용한다는 점을 이해해야 한다."],["Yesterday, Jisu gave a birthday gift to her little brother Jihoo.","어제 지수는 남동생 지후에게 생일 선물을 주었다."],["Later, she got the following text message.","이후에, 그녀는 다음과 같은 문자 메시지를 받았다."],["- I loved your gift.","- 선물이 아주 마음에 들었어."],["Thanks a lot. ","정말 고마워. "],["\"Only one smiling face ()?","\"웃는 얼굴()이 하나뿐이네?"],["I guess he didn't like my gift,\" Jisu thought.","내 선물이 마음에 안 들었나 봐.\"라고 지수는 생각했다."],["When we talk with someone, we use not only words but also facial expressions and body language.","우리는 누군가와 대화할 때, 말뿐만 아니라 얼굴 표정과 몸짓 언어도 사용한다."],["In texting, we use emojis instead.","문자 메시지를 보낼 때, 우리는 대신 이모지를 사용한다."],["Sometimes, a little emoji like  can speak louder than many words.","때때로  같은 작은 이모지가 많은 말보다 더 큰 의미를 말할 수 있다."],["The problem is that not everybody uses emojis in the same way.","문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다."],["Some people like to use them a lot, and some don't.","어떤 사람들은 이모지를 많이 사용하는 것을 좋아하고, 어떤 사람들은 그렇지 않다."],["In addition, the same emojis can mean different things to different people.","게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다."]]}];
var BK='m2-find-r'+RNUM+'-best';
var secs=[],cur=null;
D.forEach(function(it,i){if(it.tag||!cur){cur={name:it.tag||'',items:[]};secs.push(cur)}cur.items.push(i)});
var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){

var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}

  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
