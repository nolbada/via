자 던지기는 1900년대 초에 미국 해군 사관학교에서 일어났다고 해요.","c":"T"},"h":"9ac5ebd083"},{"n":2,"t":"tf","q":"The students wore the same hats before and after they graduated.","ko":"학생들은 졸업하기 전과 후에 같은 모자를 썼다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"Students at the school wore a special hat.","그 학교의 학생들은 특별한 모자를 썼다."],[6,"Once they graduated, however, they had to wear different hats to show their new position as officers.","그러나 일단 그들이 졸업을 하면, 그들은 장교로서 그들의 새로운 지위를 보여주기 위해 다른 모자를 써야 했다."]],"w":"5번에서 학생들은 특별한 모자를 썼고, 6번에서 졸업하면 장교로서 다른 모자를 써야 했다고 해요. 같은 모자가 아니에요.","c":"F"},"h":"25b587518b"},{"n":3,"t":"tf","q":"Today, caps are tossed only in the United States.","ko":"오늘날 모자 날리기는 미국에서만 볼 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Today, you can see caps tossed at graduation ceremonies all around the world.","오늘날, 당신은 전 세계의 졸업식에서 모자가 던져지는 것을 볼 수 있다."]],"w":"10번에서 오늘날 전 세계의 졸업식에서 모자가 던져지는 것을 볼 수 있다고 해요. 미국에서만이라는 말은 틀려요.","c":"F"},"h":"a2923633b0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (..., they had to wear different hats to show their new position as officers.)","ko":"... 장교로서 그들의 새로운 ( )를 보여주기 위해 다른 모자를 써야 했다.","opts":["자세","점수","지위","거리"],"word":"position","r":{"a":"3) 지위","ev":"6번 문장","s":[[6,"Once they graduated, however, they had to wear different hats to show their new position as officers.","그러나 일단 그들이 졸업을 하면, 그들은 장교로서 그들의 새로운 지위를 보여주기 위해 다른 모자를 써야 했다."]],"w":"6번은 졸업한 뒤 장교가 되어 다른 모자를 쓴다는 내용이에요. 모자로 보여주는 것은 장교라는 새로운 지위예요.","c":3},"h":"7713645131"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Today, you can see caps tossed at graduation ceremonies all around the world.)","ko":"오늘날, 당신은 전 세계의 졸업식에서 모자가 ( ) 것을 볼 수 있다.","opts":["던져지는","씻기는","팔리는","만들어지는"],"word":"tossed","r":{"a":"1) 던져지는","ev":"2번, 10번 문장","s":[[2,"Many of the graduates throw their graduation caps high into the air.","많은 졸업생이 졸업 모자를 허공에 높이 던진다."],[10,"Today, you can see caps tossed at graduation ceremonies all around the world.","오늘날, 당신은 전 세계의 졸업식에서 모자가 던져지는 것을 볼 수 있다."]],"w":"2번에서 졸업생들이 모자를 허공에 던진다고 해요. 10번의 tossed는 그 모자가 던져지는 모습을 말해요.","c":1},"h":"1adee305fa"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey no longer needed their old hats.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 더 이상 예전의 모자가 필요하지 않았다.","opts":["그 학교의 학생들","사관학교의 선생님들","졸업식에 온 부모님들","구경하던 대중"],"r":{"a":"1) 그 학교의 학생들","ev":"5~7번 문장","s":[[5,"Students at the school wore a special hat.","그 학교의 학생들은 특별한 모자를 썼다."],[6,"Once they graduated, however, they had to wear different hats to show their new position as officers.","그러나 일단 그들이 졸업을 하면, 그들은 장교로서 그들의 새로운 지위를 보여주기 위해 다른 모자를 써야 했다."],[7,"They no longer needed their old hats.","그들은 더 이상 예전의 모자가 필요하지 않았다."]],"w":"7번의 They는 5~6번에 나온 students at the school(그 학교의 학생들)이에요. 졸업한 학생들이 장교 모자를 써야 해서 예전 모자가 필요 없어졌다는 뜻이에요.","c":1,"k":"They = 그 학교의 학생들"},"pron":"They","h":"a75e874207"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Over time, this fun tradition spread to other schools.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시간이 흐르면서, 이 재미있는 전통은 다른 학교들로 퍼졌다.","opts":["하루 만에 이 전통은 다른 나라에서 사라졌다.","이 전통은 다른 학교에서 시작되어 이 학교로 왔다.","시간이 흐르면서, 이 전통은 점점 재미없어졌다.","시간이 흐르면서, 이 재미있는 전통은 다른 학교들로 퍼졌다."],"r":{"a":"4) 시간이 흐르면서, 이 재미있는 전통은 다른 학교들로 퍼졌다.","ev":"9번 문장","s":[[9,"Over time, this fun tradition spread to other schools.","시간이 흐르면서, 이 재미있는 전통은 다른 학교들로 퍼졌다."]],"w":"over time은 시간이 흐르면서이고, spread to other schools는 다른 학교들로 퍼졌다는 뜻이에요.","c":4},"h":"861e74f27e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["해군 사관학교 학생들은 매일 다른 모자를 썼다.","몇몇 졸업식에는 흥미로운 전통이 있다.","모자 던지기는 1800년대에 유럽에서 시작되었다.","이 전통은 한 학교에만 남아 있었다."],"opts":["Students at the Naval Academy wore different hats every day.","There is an interesting tradition at some graduation ceremonies.","The graduation cap toss began in Europe in the 1800s.","The tradition stayed only at one school."],"r":{"a":"2) There is an interesting tradition at some graduation ceremonies. (몇몇 졸업식에는 흥미로운 전통이 있다.)","ev":"1번 문장","s":[[1,"There is an interesting tradition at some graduation ceremonies.","몇몇 졸업식에는 흥미로운 전통이 있다."]],"w":"1번 There is an interesting tradition at some graduation ceremonies(몇몇 졸업식에는 흥미로운 전통이 있다)와 같아요. 모자는 졸업 전후로 바뀌었고, 모자 던지기는 1900년대 초 미국에서 시작되었으며, 다른 학교로 퍼졌어요.","c":2},"h":"6dc98e75dc"},{"n":9,"t":"sum","q":"Students at the school (A) a (B) hat.","ko":"그 학교의 학생들은 (B) 모자를 (A).","oko":["(A) 썼다 / (B) 특별한","(A) 썼다 / (B) 우스운","(A) 팔았다 / (B) 특별한","(A) 잃어버렸다 / (B) 우스운","(A) 팔았다 / (B) 무거운"],"opts":["(A) wore / (B) special","(A) wore / (B) funny","(A) sold / (B) special","(A) lost / (B) funny","(A) sold / (B) heavy"],"r":{"a":"1) (A) wore / (B) special ((A) 썼다 / (B) 특별한)","ev":"5번 문장","s":[[5,"Students at the school wore a special hat.","그 학교의 학생들은 특별한 모자를 썼다."]],"w":"5번 Students at the school wore a special hat(그 학교의 학생들은 특별한 모자를 썼다)에서 가져왔어요. wear의 과거형은 wore예요. sold, lost, funny, heavy는 본문에 나오지 않아요.","c":1},"h":"51e72d9262"},{"n":10,"t":"fill","q":"Many of the graduates throw their graduation caps [A] into the [B].","ko":"많은 졸업생이 졸업 모자를 [B]에 [A] 던진다.","bank":["high","air","special","different","old","fun"],"bko":{"high":"높이","air":"허공","special":"특별한","different":"다른","old":"오래된","fun":"재미있는"},"r":{"a":"[A] high (높이), [B] air (허공)","ev":"2번 문장","s":[[2,"Many of the graduates throw their graduation caps high into the air.","많은 졸업생이 졸업 모자를 허공에 높이 던진다."]],"w":"2번 Many of the graduates throw their graduation caps high into the air(많은 졸업생이 졸업 모자를 허공에 높이 던진다)에서 가져왔어요. high는 '높이', air는 '허공'이에요. special, different, old, fun은 이 자리에 들어가면 말이 되지 않아요.","c":null},"h":"701600f85b"}]},{"u":4,"id":"rj1-04-3","no":3,"ko":"아~ 향긋한 커피콩 볶는 냄새","items":[{"n":1,"t":"tf","q":"A shepherd's goats ate some red berries from a strange bush.","ko":"양치기의 염소들은 이상한 관목에서 열린 빨간 열매를 먹었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"One day, a shepherd’s goats ate some red berries from a strange bush.","어느 날, 한 양치기의 염소들이 이상한 관목에 달린 어떤 빨간 열매들을 먹었다."]],"w":"4번에서 양치기의 염소들이 이상한 관목에 달린 빨간 열매를 먹었다고 해요.","c":"T"},"h":"df0a5ccc21"},{"n":2,"t":"tf","q":"The monks thought the red berries were a gift from heaven.","ko":"수도사들은 빨간 열매가 하늘의 선물이라고 생각했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"When the shepherd told some monks the story, they thought that the berries came from the devil.","양치기가 몇몇 수도사들에게 그 이야기를 말했을 때, 그들은 그 열매들이 악마에게서 왔다고 생각했다."]],"w":"7번에서 수도사들은 열매가 악마에게서 왔다고 생각했다고 해요. 하늘의 선물이라는 말은 틀려요.","c":"F"},"h":"e637ea3a01"},{"n":3,"t":"tf","q":"The smell of the burning beans was wonderful.","ko":"불이 붙은 콩의 냄새는 아주 좋았다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"But when the coffee beans inside the berries began to burn, the smell was wonderful.","그러나 열매들 안의 커피콩들이 타기 시작했을 때, 냄새가 정말 좋았다."]],"w":"9번에서 열매 안의 커피콩이 타기 시작했을 때 냄새가 정말 좋았다고 해요.","c":"T"},"h":"7fd5b3c976"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (..., and the caffeine inside them made the goats excited.)","ko":"... 그것들 안에 있는 카페인이 염소들을 ( ) 만들었기 때문이었다.","opts":["졸린","화난","흥분된","외로운"],"word":"excited","r":{"a":"3) 흥분된","ev":"5~6번 문장","s":[[5,"Later, they began to run around and jump up and down.","나중에, 그것들은 뛰어다니고 펄쩍펄쩍 뛰기 시작했다."],[6,"This was because the seeds of the berries were coffee beans, and the caffeine inside them made the goats excited.","이것은 그 열매들의 씨앗들이 커피콩들이었고, 그것들 안에 있는 카페인이 염소들을 흥분되게 만들었기 때문이었다."]],"w":"5번에서 염소들이 뛰어다니고 펄쩍펄쩍 뛰었고, 6번에서 카페인 때문이라고 해요. excited는 흥분된이에요.","c":3},"h":"797108f0fd"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But when the coffee beans inside the berries began to burn, the smell was wonderful.)","ko":"그러나 열매들 안의 커피콩들이 ( ) 시작했을 때, 냄새가 정말 좋았다.","opts":["타기","얼기","자라기","썩기"],"word":"burn","r":{"a":"1) 타기","ev":"8~9번 문장","s":[[8,"They threw the berries into a fire.","그들은 그 열매들을 불 속으로 던졌다."],[9,"But when the coffee beans inside the berries began to burn, the smell was wonderful.","그러나 열매들 안의 커피콩들이 타기 시작했을 때, 냄새가 정말 좋았다."]],"w":"8번에서 수도사들이 열매를 불 속으로 던졌어요. 그래서 9번에서 열매 안의 콩이 타기 시작했다는 뜻이에요. burn은 타다예요.","c":1},"h":"e83a3f4703"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nLater, they began to run around and jump up and down.","ko":"밑줄 친 they가 가리키는 것은?","sko":"나중에, 그것들은 뛰어다니고 펄쩍펄쩍 뛰기 시작했다.","opts":["염소들","양치기","수도사들","열매들"],"r":{"a":"1) 염소들","ev":"4~5번 문장","s":[[4,"One day, a shepherd’s goats ate some red berries from a strange bush.","어느 날, 한 양치기의 염소들이 이상한 관목에 달린 어떤 빨간 열매들을 먹었다."],[5,"Later, they began to run around and jump up and down.","나중에, 그것들은 뛰어다니고 펄쩍펄쩍 뛰기 시작했다."]],"w":"5번의 they는 4번의 a shepherd’s goats(양치기의 염소들)를 가리켜요. 빨간 열매를 먹은 염소들이 나중에 뛰어다니기 시작했다는 뜻이에요.","c":1,"k":"they = 염소들"},"pron":"they","h":"ab64e620eb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since then, people have enjoyed drinking coffee.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그때 이후로, 사람들은 커피 마시는 것을 즐겨 왔다.","opts":["그때까지는 사람들이 커피를 마시는 것을 즐겼다.","그때 이후로 사람들은 커피 마시는 것을 즐겨 왔다.","그때 이후로 사람들은 커피 마시는 것을 그만두었다.","그때 이후로 사람들은 커피콩을 키우는 것을 즐겨 왔다."],"r":{"a":"2) 그때 이후로 사람들은 커피 마시는 것을 즐겨 왔다.","ev":"11번 문장","s":[[11,"Since then, people have enjoyed drinking coffee.","그때 이후로, 사람들은 커피 마시는 것을 즐겨 왔다."]],"w":"Since then은 그때 이후로이고, have enjoyed drinking coffee는 커피 마시는 것을 즐겨 왔다는 뜻이에요.","c":2},"h":"b4f217c2ae"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["염소들은 빨간 열매를 먹는 것을 거부했다.","수도사들은 열매를 정원에 심었다.","수도사들은 콩들로 검은색 음료를 만들었다.","양치기는 수도사들에게 열매를 키우는 법을 가르쳐 주었다."],"opts":["The goats refused to eat the red berries.","The monks planted the berries in a garden.","The monks made a black drink from the beans.","The shepherd taught the monks how to grow the berries."],"r":{"a":"3) The monks made a black drink from the beans. (수도사들은 콩들로 검은색 음료를 만들었다.)","ev":"10번 문장","s":[[10,"So, the monks made a black drink from the burned beans.","그래서, 그 수도사들은 탄 콩들로 검은색 음료를 만들었다."]],"w":"10번 the monks made a black drink from the burned beans(수도사들은 탄 콩들로 검은색 음료를 만들었다)와 같아요. 염소들은 열매를 먹었고, 수도사들은 열매를 불에 던졌으며, 양치기가 열매 키우는 법을 가르쳐 주지는 않았어요.","c":3},"h":"84c7492306"},{"n":9,"t":"sum","q":"No one is (A), but here is one story from (B).","ko":"아무도 (A) 못하지만, 여기에 (B)에서 유래한 한 이야기가 있다.","oko":["(A) 확신하지 / (B) 에티오피아","(A) 확신하지 / (B) 이탈리아","(A) 준비되지 / (B) 에티오피아","(A) 준비되지 / (B) 이탈리아","(A) 화나지 / (B) 브라질"],"opts":["(A) sure / (B) Ethiopia","(A) sure / (B) Italy","(A) ready / (B) Ethiopia","(A) ready / (B) Italy","(A) angry / (B) Brazil"],"r":{"a":"1) (A) sure / (B) Ethiopia ((A) 확신하지 / (B) 에티오피아)","ev":"3번 문장","s":[[3,"No one is sure, but here is one story from Ethiopia.","아무도 확신하지 못하지만, 여기에 에티오피아에서 유래한 한 이야기가 있다."]],"w":"3번 No one is sure, but here is one story from Ethiopia(아무도 확신하지 못하지만, 여기에 에티오피아에서 유래한 한 이야기가 있다)에서 가져왔어요. 이야기가 나온 곳은 에티오피아이고, 이탈리아와 브라질은 본문에 나오지 않아요.","c":1},"h":"3c1d6adaa2"},{"n":10,"t":"fill","q":"Coffee is [A] all around the [B].","ko":"커피는 전 [B]에서 [A].","bank":["popular","world","hungry","lonely","goats","monks"],"bko":{"popular":"인기가 있다","world":"세계","hungry":"배고프다","lonely":"외롭다","goats":"염소들","monks":"수도사들"},"r":{"a":"[A] popular (인기가 있다), [B] world (세계)","ev":"1번 문장","s":[[1,"Coffee is popular all around the world.","커피는 전 세계에서 인기가 있다."]],"w":"1번 Coffee is popular all around the world(커피는 전 세계에서 인기가 있다)에서 가져왔어요. all around the world는 ‘전 세계에서’라는 표현이에요. hungry, lonely는 커피의 상태로 어울리지 않고, goats, monks는 the 뒤에 와도 장소의 범위가 되지 못해요.","c":null},"h":"00ecbf32c4"}]},{"u":4,"id":"rj1-04-4","no":4,"ko":"시저의 비밀 메시지","items":[{"n":1,"t":"tf","q":"Julius Caesar often fought wars.","ko":"줄리어스 시저는 자주 전쟁을 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Julius Caesar, the famous Roman leader, often fought wars.","유명한 로마의 지도자인 줄리어스 시저는 자주 전쟁을 했다."]],"w":"1번에서 줄리어스 시저는 자주 전쟁을 했다고 해요.","c":"T"},"h":"1ff4b44a66"},{"n":2,"t":"tf","q":"In Caesar's code, the letter A became B.","ko":"시저의 암호에서 글자 A는 B가 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"For example, the letter A became D.","예를 들어, 글자 A는 D가 되었다."]],"w":"8번에서 글자 A는 D가 되었다고 해요. 세 자리 뒤 글자이므로 B가 아니에요.","c":"F"},"h":"bb5b550182"},{"n":3,"t":"tf","q":"Caesar's clever idea helped him and his soldiers win many wars.","ko":"시저의 영리한 아이디어는 그와 군인들이 많은 전쟁에서 이기도록 도왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"In the end, this clever idea helped them win many wars.","결국, 이 영리한 아이디어는 그들이 많은 전쟁에서 승리하는 것을 도왔다."]],"w":"13번에서 결국 이 영리한 아이디어가 그들이 많은 전쟁에서 승리하는 것을 도왔다고 해요.","c":"T"},"h":"e1cce99985"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He had to secretly communicate with his soldiers on the battlefield.)","ko":"그는 전쟁터에서 그의 군인들과 ( ) 연락해야 했다.","opts":["크게","자주","몰래","빨리"],"word":"secretly","r":{"a":"3) 몰래","ev":"2번 문장","s":[[2,"He had to secretly communicate with his soldiers on the battlefield.","그는 전쟁터에서 그의 군인들과 몰래 연락해야 했다."]],"w":"2번에서 시저는 전쟁터에서 군인들과 몰래 연락해야 했고, 그래서 3~4번에서 자신만의 방법인 암호를 발명했어요. secretly는 몰래예요.","c":3},"h":"44bc730376"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Caesar and his soldiers used this system to safely exchange messages about their strategy.)","ko":"시저와 그의 군인들은 그들의 전략에 관한 메시지를 안전하게 ( ) 위해 이 체계를 사용했다.","opts":["숨기기","잃기","지우기","주고받기"],"word":"exchange","r":{"a":"4) 주고받기","ev":"12번 문장","s":[[12,"Caesar and his soldiers used this system to safely exchange messages about their strategy.","시저와 그의 군인들은 그들의 전략에 관한 메시지를 안전하게 주고받기 위해 이 체계를 사용했다."]],"w":"12번은 암호 체계를 사용해서 메시지를 안전하게 주고받는 이야기예요. exchange messages는 메시지를 주고받다예요.","c":4},"h":"88679a4b14"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe just changed the letters of the alphabet!","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 그저 알파벳의 글자들을 바꿨다!","opts":["줄리어스 시저","시저의 군인들","적군의 장군","알파벳을 만든 사람"],"r":{"a":"1) 줄리어스 시저","ev":"4~6번 문장","s":[[4,"He invented a code called the “Caesar cipher.”","그는 ‘시저 암호’라고 불리는 암호를 발명했다."],[5,"It was simple.","그것은 단순했다."],[6,"He just changed the letters of the alphabet!","그는 그저 알파벳의 글자들을 바꿨다!"]],"w":"6번의 He는 4번의 He invented a code(그는 암호를 발명했다)에 나오는 Julius Caesar(줄리어스 시저)예요. 시저가 알파벳의 글자들을 바꿔서 암호를 만들었다는 뜻이에요.","c":1,"k":"He = 줄리어스 시저"},"pron":"He","h":"fe33a67542"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Toward the end of the alphabet, the code had to start over.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"알파벳의 끝 쪽으로 가면, 암호는 다시 시작해야 했다.","opts":["알파벳의 끝 쪽으로 가면, 암호는 그만두어야 했다.","알파벳의 끝 쪽으로 가면, 암호는 다시 시작해야 했다.","알파벳의 처음 쪽으로 가면, 암호는 끝나야 했다.","알파벳의 끝 쪽에서는 암호가 더 어려워졌다."],"r":{"a":"2) 알파벳의 끝 쪽으로 가면, 암호는 다시 시작해야 했다.","ev":"10~11번 문장","s":[[10,"Toward the end of the alphabet, the code had to start over.","알파벳의 끝 쪽으로 가면, 암호는 다시 시작해야 했다."],[11,"So X, Y, and Z became A, B, and C.","따라서 X, Y, Z는 A, B, C가 되었다."]],"w":"toward the end of the alphabet은 알파벳의 끝 쪽으로 가면이고, start over는 다시 시작하다예요. 11번에서 X, Y, Z가 A, B, C가 되는 것이 그 예예요.","c":2},"h":"4d086d812e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["시저는 겨울에만 전쟁을 했다.","시저의 군인들은 그의 메시지를 읽을 수 없었다.","시저의 암호는 단순했다.","암호는 Z에서 끝나서 더 이상 글자가 없었다."],"opts":["Caesar fought wars only in the winter.","Caesar's soldiers could not read his messages.","Caesar’s code was simple.","The code stopped at Z and had no more letters."],"r":{"a":"3) Caesar’s code was simple. (시저의 암호는 단순했다.)","ev":"4~5번 문장","s":[[4,"He invented a code called the “Caesar cipher.”","그는 ‘시저 암호’라고 불리는 암호를 발명했다."],[5,"It was simple.","그것은 단순했다."]],"w":"4번에서 시저가 암호를 발명했고, 5번 It was simple(그것은 단순했다)이라고 했어요. 시저는 겨울에만 싸우지 않았고, 군인들은 메시지를 읽을 수 있었으며, 11번에서 Z 다음은 다시 A로 이어졌어요.","c":3},"h":"2a7c96445a"},{"n":9,"t":"sum","q":"He had his own (A) of (B) this.","ko":"그는 이것을 (B) 자신만의 (A)을(를) 가지고 있었다.","oko":["(A) 방법 / (B) 하는","(A) 방법 / (B) 잃는","(A) 게임 / (B) 하는","(A) 게임 / (B) 잃는","(A) 여행 / (B) 숨기는"],"opts":["(A) way / (B) doing","(A) way / (B) losing","(A) game / (B) doing","(A) game / (B) losing","(A) trip / (B) hiding"],"r":{"a":"1) (A) way / (B) doing ((A) 방법 / (B) 하는)","ev":"3번 문장","s":[[3,"He had his own way of doing this.","그는 이것을 하는 자신만의 방법을 가지고 있었다."]],"w":"3번 He had his own way of doing this(그는 이것을 하는 자신만의 방법을 가지고 있었다)에서 가져왔어요. way of doing은 ‘~하는 방법’이라는 표현이에요. game, trip, losing, hiding은 이 자리에 어울리지 않아요.","c":1 춤을 '추다'예요.","c":2},"h":"45a3fd2edc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But there was a belief about the cure.)","ko":"그러나 ( )에 대한 믿음이 있었다.","opts":["실수","질문","결과","치료법"],"word":"cure","r":{"a":"4) 치료법","ev":"9~10번 문장","s":[[9,"But there was a belief about the cure.","그러나 치료법에 대한 믿음이 있었다."],[10,"They believed victims would return to normal if they danced fast.","그들은 그 희생자들이 빠르게 춤을 추면 정상으로 돌아올 수 있다고 믿었다."]],"w":"9번 뒤 10번에서 물린 사람이 빠르게 춤을 추면 정상으로 돌아온다고 믿었다고 해요. 그러니 cure는 병이나 상처를 고치는 '치료법'이에요.","c":4},"h":"3e7c22e576"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey thought a bite from a tarantula made people go wild.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 타란툴라에 물린 상처가 사람들을 미쳐 날뛰게 만든다고 생각했다.","opts":["그 당시 사람들","타란툴라(늑대거미)","춤추는 사람들","Taranto의 시장"],"r":{"a":"1) 그 당시 사람들","ev":"7~8번 문장","s":[[7,"At the time, people didn’t know much about tarantulas.","그 당시, 사람들은 타란툴라에 대해 많이 알지 못했다."],[8,"They thought a bite from a tarantula made people go wild.","그들은 타란툴라에 물린 상처가 사람들을 미쳐 날뛰게 만든다고 생각했다."]],"w":"8번의 They는 7번의 people(그 당시 사람들)이에요. 타란툴라에 대해 잘 몰랐던 사람들이 타란툴라에 물리면 미쳐 날뛴다고 생각했다는 뜻이에요.","c":1,"k":"They = 그 당시 사람들"},"pron":"They","h":"1b0b5d5646"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There is an interesting story behind the dance.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 춤 뒤에는 흥미로운 이야기가 있다.","opts":["그 춤은 이야기 때문에 금지되었다.","그 춤 뒤에는 흥미로운 이야기가 있다.","그 춤은 이야기를 싫어하는 사람들이 만들었다.","그 이야기는 춤을 추는 방법을 설명한다."],"r":{"a":"2) 그 춤 뒤에는 흥미로운 이야기가 있다.","ev":"3번 문장","s":[[3,"There is an interesting story behind the dance.","그 춤 뒤에는 흥미로운 이야기가 있다."]],"w":"3번 There is an interesting story behind the dance(그 춤 뒤에는 흥미로운 이야기가 있다)에서 behind the dance는 ‘그 춤의 배경에’라는 뜻이에요. 춤이 금지되었다는 말이나 춤 추는 법을 설명한다는 말은 없어요.","c":2},"h":"32f38ef232"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["타란텔라는 스페인 북부에서 온 민속춤이다.","타란텔라는 이탈리아 남부에서 온 민속춤이다.","옛날 사람들은 타란툴라에 대해 아주 잘 알고 있었다.","타란텔라는 어린이들만 추는 춤이다."],"opts":["The tarantella is a folk dance from northern Spain.","The tarantella is a folk dance from southern Italy.","People long ago knew a lot about tarantulas.","The tarantella is danced only by children."],"r":{"a":"2) The tarantella is a folk dance from southern Italy. (타란텔라는 이탈리아 남부에서 온 민속춤이다.)","ev":"1번 문장","s":[[1,"The tarantella is a folk dance from southern Italy.","타란텔라는 이탈리아 남부에서 온 민속춤이다."]],"w":"1번 The tarantella is a folk dance from southern Italy(타란텔라는 이탈리아 남부에서 온 민속춤이다)와 같아요. 스페인 북부가 아니라 이탈리아 남부이고, 옛날 사람들은 타란툴라를 잘 몰랐으며, 어린이만 추는 춤이라는 말은 없어요.","c":2},"h":"b9e2e321bd"},{"n":9,"t":"sum","q":"They believed victims would (A) to (B) if they danced fast.","ko":"그들은 희생자들이 빠르게 춤을 추면 (B)(으)로 (A) 수 있다고 믿었다.","oko":["(A) 돌아올 / (B) 정상","(A) 돌아올 / (B) 학교","(A) 달릴 / (B) 정상","(A) 달릴 / (B) 학교","(A) 머무를 / (B) 침대"],"opts":["(A) return / (B) normal","(A) return / (B) school","(A) run / (B) normal","(A) run / (B) school","(A) stay / (B) bed"],"r":{"a":"1) (A) return / (B) normal ((A) 돌아올 / (B) 정상)","ev":"10번 문장","s":[[10,"They believed victims would return to normal if they danced fast.","그들은 그 희생자들이 빠르게 춤을 추면 정상으로 돌아올 수 있다고 믿었다."]],"w":"10번 They believed victims would return to normal if they danced fast(그들은 희생자들이 빠르게 춤을 추면 정상으로 돌아올 수 있다고 믿었다)에서 가져왔어요. return to normal은 ‘정상으로 돌아오다’라는 표현이에요. school, bed는 본문에 나오지 않아요.","c":1},"h":"1b8f7d474c"},{"n":10,"t":"fill","q":"Long ago, the area was [A] to wolf spiders [B] tarantulas.","ko":"오래전에, 그 지역은 타란툴라라 [B] 늑대거미들의 [A]였다.","bank":["home","called","hairy","tired","quiet","fast"],"bko":{"home":"서식지","called":"불리는","hairy":"털이 많은","tired":"피곤한","quiet":"조용한","fast":"빠른"},"r":{"a":"[A] home, [B] called","ev":"5번 문장","s":[[5,"Long ago, the area was home to wolf spiders called tarantulas.","오래전에, 그 지역은 타란툴라라 불리는 늑대거미의 서식지였다."]],"w":"5번 Long ago, the area was home to wolf spiders called tarantulas(오래전에, 그 지역은 타란툴라라 불리는 늑대거미의 서식지였다)에서 가져왔어요. home to는 ‘~의 서식지’라는 뜻이고, called는 ‘~라고 불리는’이라는 뜻으로 spiders를 꾸며 줘요. hairy, tired, quiet, fast는 이 자리에 어울리지 않아요.","c":null},"h":"a827f87c35"}]},{"u":5,"id":"rj1-05-3","no":3,"ko":"죽은 영혼을 위한 첼로 연주","items":[{"n":1,"t":"tf","q":"A bomb killed 22 people in a bakery.","ko":"폭탄이 빵집에서 22명의 사람들을 죽였다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It killed 22 people in a bakery.","그것은 빵집 안에 있던 22명의 사람들을 죽였다."]],"w":"3번 문장에 It killed 22 people in a bakery가 있어요. 여기서 It은 2번의 폭탄이에요.","c":"T"},"h":"4d4bc3c048"},{"n":2,"t":"tf","q":"There was a terrible war in Bosnia in 1982.","ko":"1982년에 보스니아에서 끔찍한 전쟁이 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"In 1992, there was a terrible war in Bosnia.","1992년에, 보스니아에서 끔찍한 전쟁이 있었다."]],"w":"1번 문장에서 전쟁은 1992년이에요. 1982년이 아니에요.","c":"F"},"h":"27bc691f88"},{"n":3,"t":"tf","q":"Smailovic was wearing a black suit and a white shirt.","ko":"Smailovic은 검은색 정장과 흰색 셔츠를 입고 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"He was wearing a black suit and a white shirt.","그는 검은색 정장과 흰색 셔츠를 입고 있었다."]],"w":"6번 문장에 He was wearing a black suit and a white shirt가 있어요.","c":"T"},"h":"cbd2e851bd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day, a bomb blew up in Sarajevo.)","ko":"어느 날, 사라예보에서 폭탄이 ( ).","opts":["터졌다","멈췄다","떨어졌다","사라졌다"],"word":"blew up","r":{"a":"1) 터졌다","ev":"2~3번 문장","s":[[2,"One day, a bomb blew up in Sarajevo.","어느 날, 사라예보에서 폭탄이 터졌다."],[3,"It killed 22 people in a bakery.","그것은 빵집 안에 있던 22명의 사람들을 죽였다."]],"w":"폭탄이 22명을 죽일 정도의 사건이 되려면 터져야 해요. 3번에서 It killed 22 people이라고 했으니 blew up은 '터졌다'예요.","c":1},"h":"b4a9d856ff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Every day, people gathered to listen to the music.)","ko":"매일, 사람들은 음악을 듣기 위해 ( ).","opts":["흩어졌다","도망쳤다","모였다","잠들었다"],"word":"gathered","r":{"a":"3) 모였다","ev":"10번 문장","s":[[10,"Every day, people gathered to listen to the music.","매일, 사람들은 음악을 듣기 위해 모였다."]],"w":"10번은 사람들이 음악을 들으러 온다는 내용이에요. 듣기 위해(to listen) 간 곳에 사람들이 gathered했으니 '모였다'예요.","c":3},"h":"c51f993d7a"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe started playing his cello.","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 그의 첼로를 연주하기 시작했다.","opts":["베드란 스마일로비치","빵집 주인","사라예보의 군인","폭탄을 만든 사람"],"r":{"a":"1) 베드란 스마일로비치","ev":"5~7번 문장","s":[[5,"The day after the bombing, a cellist, Vedran Smailovic, went to the square near the bakery.","폭격 다음 날, 첼로 연주자인 Vedran Smailovic은 그 빵집 근처의 광장으로 갔다."],[6,"He was wearing a black suit and a white shirt.","그는 검은색 정장과 흰색 셔츠를 입고 있었다."],[7,"He started playing his cello.","그는 그의 첼로를 연주하기 시작했다."]],"w":"7번의 He는 5번의 a cellist, Vedran Smailovic(첼로 연주자 Vedran Smailovic)을 가리켜요. 검은 정장을 입은 그 사람이 첼로를 연주하기 시작했다는 뜻이에요.","c":1,"k":"He = 베드란 스마일로비치"},"pron":"He","h":"442ecd365f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He did this to remember each of the 22 dead people.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 22명의 죽은 사람들 각각을 기억하기 위해 이것을 했다.","opts":["그는 죽은 22명 중 한 명만 기억하려고 이것을 했다.","그는 죽은 22명 각각을 기억하려고 이것을 했다.","그는 22명을 구하려고 이것을 했다.","그는 22명에게 돈을 주려고 이것을 했다."],"r":{"a":"2) 그는 죽은 22명 각각을 기억하려고 이것을 했다.","ev":"9번 문장","s":[[9,"He did this to remember each of the 22 dead people.","그는 22명의 죽은 사람들 각각을 기억하기 위해 이것을 했다."]],"w":"each of the 22 dead people은 '죽은 22명 각각'이에요. to remember는 '기억하기 위해'라서 구하거나 돈을 준다는 말은 9번과 달라요.","c":2},"h":"43e910c044"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Smailovic은 폭격 다음 날 다른 도시로 갔다.","Smailovic은 빨간 정장과 파란 셔츠를 입고 있었다.","Smailovic은 폭격 다음 날 빵집 근처 광장으로 갔다.","Smailovic은 하루 뒤에 음악을 그만두었다."],"opts":["Smailovic went to a different city the day after the bombing.","Smailovic was wearing a red suit and a blue shirt.","Smailovic went to the square near the bakery the day after the bombing.","Smailovic stopped his music after one day."],"r":{"a":"3) Smailovic went to the square near the bakery the day after the bombing.","ev":"5번 문장","s":[[5,"The day after the bombing, a cellist, Vedran Smailovic, went to the square near the bakery.","폭격 다음 날, 첼로 연주자인 Vedran Smailovic은 그 빵집 근처의 광장으로 갔다."]],"w":"5번 a cellist, Vedran Smailovic, went to the square near the bakery(첼로 연주자 Vedran Smailovic은 그 빵집 근처의 광장으로 갔다)가 폭격 다음 날(The day after the bombing)이라고 했어요. 다른 도시로 가지 않았고, 정장 색도 다르며, 그는 22일 동안 연주했어요.","c":3},"h":"ab8a6879ea"},{"n":9,"t":"sum","q":"But this (A) brought something (B).","ko":"하지만 이 (A)은(는) (B) 것을 가져왔다.","oko":["(A) 비극 / (B) 아름다운","(A) 비극 / (B) 끔찍한","(A) 음악 / (B) 아름다운","(A) 음악 / (B) 끔찍한","(A) 광장 / (B) 조용한"],"opts":["(A) tragedy / (B) beautiful","(A) tragedy / (B) terrible","(A) music / (B) beautiful","(A) music / (B) terrible","(A) square / (B) quiet"],"r":{"a":"1) (A) tragedy / (B) beautiful ((A) 비극 / (B) 아름다운)","ev":"4번 문장","s":[[4,"But this tragedy brought something beautiful.","하지만 이 비극은 아름다운 어떤 것을 가져왔다."]],"w":"4번 But this tragedy brought something beautiful(하지만 이 비극은 아름다운 어떤 것을 가져왔다)에서 가져왔어요. tragedy는 ‘비극’이에요. 비극이 가져온 것은 terrible(끔찍한)이 아니라 beautiful(아름다운) 것이었어요.","c":1},"h":"535330bf92"},{"n":10,"t":"fill","q":"Smailovic’s music [A] Bosnians, and he became a [B] of peace.","ko":"Smailovic의 음악은 보스니아 사람들을 [A]. 그리고 그는 평화의 [B]이(가) 되었다.","bank":["comforted","symbol","wore","killed","bakery","bomb"],"bko":{"comforted":"위로했다","symbol":"상징","wore":"입었다","killed":"죽였다","bakery":"빵집","bomb":"폭탄"},"r":{"a":"[A] comforted (위로했다), [B] symbol (상징)","ev":"11번 문장","s":[[11,"Smailovic’s music comforted Bosnians, and he became a symbol of peace.","Smailovic의 음악은 보스니아 사람들을 위로했고, 그는 평화의 상징이 되었다."]],"w":"11번 Smailovic’s music comforted Bosnians, and he became a symbol of peace(Smailovic의 음악은 보스니아 사람들을 위로했고, 그는 평화의 상징이 되었다)에서 가져왔어요. comfort의 과거형은 comforted예요. wore, killed는 peace와 어울리지 않고, bakery, bomb은 ‘평화의 ~’가 될 수 없어요.","c":null},"h":"4897a2374b"}]},{"u":5,"id":"rj1-05-4","no":4,"ko":"고흐의 서명에 이런 비밀이!","items":[{"n":1,"t":"tf","q":"Vincent van Gogh is one of the most famous artists in the world.","ko":"빈센트 반 고흐는 세계에서 가장 유명한 예술가들 중 한 명이다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Vincent van Gogh is one of the most famous artists in the world.","빈센트 반 고흐는 세계에서 가장 유명한 예술가들 중 한 명이다."]],"w":"1번 문장에 one of the most famous artists in the world가 그대로 있어요. 'one of the 최상급 + 복수 명사'는 '가장 ~한 …들 중 하나'예요.","c":"T"},"h":"dc32bf4090"},{"n":2,"t":"tf","q":"Van Gogh always signed his full name on his paintings.","ko":"고흐는 그의 그림에 항상 그의 이름 전체를 서명했다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"He never signed his full name.","그는 절대 그의 이름 전체를 서명하지 않았다."]],"w":"3번 문장에서 He never signed his full name이라고 해요. never는 '절대 ~ 않다'라서 항상 이름 전체를 서명했다는 말과 반대예요.","c":"F"},"h":"a212a874db"},{"n":3,"t":"tf","q":"For Sunflowers, Van Gogh signed the flower vase in the center.","ko":"<해바라기>에서 고흐는 중앙에 있는 꽃병에 서명했다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Interestingly, for his painting Sunflowers, he signed the flower vase in the center.","흥미롭게도, 그의 그림 <해바라기>에서, 그는 중앙에 있는 꽃병에 서명했다."]],"w":"12번 문장에 he signed the flower vase in the center가 그대로 있어요. 보통은 구석에 서명했지만(11번) 이 그림은 달랐어요.","c":"T"},"h":"40da70af1a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He signed his name in the corner of a painting only if he was satisfied with it.)","ko":"그는 그림에 ( ) 때만 그것의 구석에 그의 이름을 서명했다.","opts":["부끄러운","피곤한","만족한","놀란"],"word":"satisfied","r":{"a":"3) 만족한","ev":"11번 문장","s":[[11,"He signed his name in the corner of a painting only if he was satisfied with it.","그는 그림에 만족해야만 그것의 구석에 그의 이름을 서명했다."]],"w":"11번은 고흐가 서명하는 조건을 말해요. 서명은 자기 그림에 만족했을 때만 한다는 흐름이니 satisfied는 '만족한'이에요.","c":3},"h":"ccb9f8fe0d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Plus, he did not sign every painting.)","ko":"( ), 그는 모든 그림에 서명하지는 않았다.","opts":["그러나","그러므로","예를 들어","게다가"],"word":"Plus","r":{"a":"4) 게다가","ev":"10번 문장","s":[[10,"Plus, he did not sign every painting.","게다가, 그는 모든 그림에 서명하지는 않았다."]],"w":"9번까지는 Vincent만 서명한 이유를 말했고, 10번은 서명에 관한 다른 사실을 덧붙여요. 그래서 Plus는 '게다가'예요.","c":4},"h":"7f13b7c483"},{"n":6,"t":"ref","q":"What does the underlined \"These\" refer to?\nThese are different from the Dutch pronunciation.","ko":"밑줄 친 These가 가리키는 것은?","sko":"이것들은 네덜란드어 발음과 다르다.","opts":["고흐의 그림들","“Van Goff”와 “Van Go”라는 발음들","고흐의 서명들","네덜란드 사람들"],"r":{"a":"2) “Van Goff”와 “Van Go”라는 발음들","ev":"7~8번 문장","s":[[7,"People sometimes said “Van Goff ” or “Van Go.”","사람들은 때때로 “반 고프” 또는 “반 고”라고 말했다."],[8,"These are different from the Dutch pronunciation.","이것들은 네덜란드어 발음과 다르다."]],"w":"7번에서 사람들이 “Van Goff” 또는 “Van Go”라고 말했다고 해요. 8번의 These는 그 발음들이고, 그것들이 네덜란드어 발음과 다르다는 뜻이에요.","c":2},"h":"f0479fd443"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"No one is sure why he did this.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아무도 왜 그가 이것을 했는지 확실히 알지 못한다.","opts":["그가 왜 이렇게 했는지 모두가 알고 있다.","아무도 그가 그렇게 했다는 사실을 모른다.","그가 왜 이렇게 했는지 아무도 확실히 알지 못한다.","그가 이렇게 한 것은 아무에게도 도움이 되지 않았다."],"r":{"a":"3) 그가 왜 이렇게 했는지 아무도 확실히 알지 못한다.","ev":"5번 문장","s":[[5,"No one is sure why he did this.","아무도 왜 그가 이것(‘빈센트’라고 서명하는 것)을 했는지 확실히 알지 못한다."]],"w":"No one is sure why ~는 '왜 ~했는지 아무도 확실히 모른다'예요. 5번 앞 4번에서 Vincent라고 서명한 사실은 알려져 있고, 이유만 모른다는 뜻이에요.","c":3},"h":"14c1e1b1d9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고흐는 모든 그림의 구석에 이름 전체를 서명했다.","어떤 사람들은 그의 성이 발음하기 어려웠다고 생각한다.","고흐는 모든 그림에 날짜와 함께 서명했다.","고흐는 꽃을 그린 적이 한 번도 없다."],"opts":["Van Gogh signed his full name in the corner of every painting.","Some people think his last name was hard to pronounce.","Van Gogh signed all his paintings with the date.","Van Gogh never painted flowers."],"r":{"a":"2) Some people think his last name was hard to pronounce. (어떤 사람들은 그의 성이 발음하기 어려웠다고 생각한다.)","ev":"6번 문장","s":[[6,"However, some people think it was because his last name was hard to pronounce.","그러나 어떤 사람들은 그것이 그의 성이 발음하기에 어려웠기 때문이었다고 생각한다."]],"w":"6번 some people think it was because his last name was hard to pronounce(어떤 사람들은 그의 성이 발음하기에 어려웠기 때문이라고 생각한다)와 같아요. 나머지는 본문에 없는 내용이거나, 그림 <해바라기>를 그렸다는 본문과 달라요.","c":2},"h":"645ab561e9"},{"n":9,"t":"sum","q":"So he just signed his (A) (B) name.","ko":"그래서 그는 그의 (A) (B)만 서명했다.","oko":["(A) 흔한 / (B) 이름(성 제외)","(A) 흔한 / (B) 성","(A) 드문 / (B) 이름(성 제외)","(A) 드문 / (B) 성","(A) 우스운 / (B) 이름 전체"],"opts":["(A) common / (B) first","(A) common / (B) last","(A) rare / (B) first","(A) rare / (B) last","(A) funny / (B) full"],"r":{"a":"1) (A) common / (B) first ((A) 흔한 / (B) 이름(성 제외))","ev":"9번 문장","s":[[9,"So he just signed his common first name.","그래서 그는 그의 (성을 뺀) 흔한 이름만 서명했다."]],"w":"9번 So he just signed his common first name(그래서 그는 그의 흔한 이름만 서명했다)에서 가져왔어요. first name은 성을 뺀 이름이고 last name은 성이에요. 발음하기 어려웠던 것은 성(last name)이어서 last는 맞지 않아요.","c":1},"h":"e10f1b97ac"},{"n":10,"t":"fill","q":"This [A] us his special love and [B] for the painting.","ko":"이것은 우리에게 그 그림에 대한 그의 특별한 사랑과 [B]을(를) [A].","bank":["shows","pride","signs","pronounces","corner","habit"],"bko":{"shows":"보여준다","pride":"자부심","signs":"서명한다","pronounces":"발음한다","corner":"구석","habit":"습관"},"r":{"a":"[A] shows (보여준다), [B] pride (자부심)","ev":"13번 문장","s":[[13,"This shows us his special love and pride for the painting.","이것은 우리에게 그 그림에 대한 그의 특별한 사랑과 자부심을 보여준다."]],"w":"13번 This shows us his special love and pride for the painting(이것은 우리에게 그 그림에 대한 그의 특별한 사랑과 자부심을 보여준다)에서 가져왔어요. This(앞 내용)가 주어이고 3인칭 단수라서 동사에 s가 붙은 shows가 와요. signs, pronounces는 뜻이 맞지 않고, corner, habit은 love와 함께 쓰이지 않아요.","c":null},"h":"3af78104a2"}]},{"u":6,"id":"rj1-06-1","no":1,"ko":"무엇이든 할 수 있어!","items":[{"n":1,"t":"tf","q":"John McFall lost his right leg in a motorcycle accident when he was 19.","ko":"John McFall은 19살 때 오토바이 사고로 오른쪽 다리를 잃었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Sadly, when he was 19, he lost his right leg in a motorcycle accident.","애석하게도, 그가 19살이었을 때, 그는 오토바이 사고로 오른쪽 다리를 잃었다."]],"w":"2번 문장에 when he was 19, he lost his right leg in a motorcycle accident가 그대로 있어요.","c":"T"},"h":"a42f52a899"},{"n":2,"t":"tf","q":"John McFall did not like sports when he was young.","ko":"John McFall은 어렸을 때 스포츠를 좋아하지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Ever since he was young, John McFall loved sports.","John McFall은 어렸을 때부터 스포츠를 좋아했다."]],"w":"1번 문장에서 Ever since he was young, John McFall loved sports라고 해요. 어렸을 때부터 스포츠를 좋아했다는 뜻이라 반대예요.","c":"F"},"h":"e8d3294c83"},{"n":3,"t":"tf","q":"McFall became the world’s first parastronaut.","ko":"McFall은 세계 최초의 신체적 장애가 있는 우주비행사가 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"He became the world’s first parastronaut.","그는 세계 최초의 신체적 장애가 있는 우주비행사가 되었다."]],"w":"9번 문장에 He became the world’s first parastronaut가 그대로 있어요.","c":"T"},"h":"91693da693"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When McFall recovered, he used a prosthetic leg…)","ko":"McFall이 ( ) 그는 의족을 사용했다.","opts":["화가 났을","회복되었을","도착했을","잊었을"],"word":"recovered","r":{"a":"2) 회복되었을","ev":"3~4번 문장","s":[[3,"However, he did not let this tragic event stop him.","하지만, 그는 이 비극적인 사건이 그를 멈추게 하지 않았다."],[4,"When McFall recovered, he used a prosthetic leg and trained to become a professional sprinter.","McFall이 회복되었을 때, 그는 의족을 사용했고 프로 단거리 선수가 되기 위해 훈련했다."]],"w":"3번에서 사고에 멈추지 않았다고 하고, 4번에서 When McFall recovered 뒤에 의족을 쓰고 훈련했어요. 몸이 나은 뒤의 이야기니 '회복되었을'이에요.","c":2},"h":"88fe52bae4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Eventually, he earned medals in events such as the Paralympics.)","ko":"( ), 그는 세계 장애인 올림픽과 같은 경기에서 메달을 땄다.","opts":["결국","가끔","먼저","갑자기"],"word":"Eventually","r":{"a":"1) 결국","ev":"4~6번 문장","s":[[4,"When McFall recovered, he used a prosthetic leg and trained to become a professional sprinter.","McFall이 회복되었을 때, 그는 의족을 사용했고 프로 단거리 선수가 되기 위해 훈련했다."],[5,"He began entering competitions for disabled athletes.","그는 장애가 있는 운동선수들을 위한 대회에 참가하기 시작했다."],[6,"Eventually, he earned medals in events such as the Paralympics.","마침내, 그는 세계 장애인 올림픽과 같은 경기에서 메달을 땄다."]],"w":"4~5번에서 훈련하고 대회에 나가기 시작했고, 6번에서 마침내 메달을 땄어요. 오랜 노력 끝에 얻은 결과라서 Eventually는 '결국'이에요.","c":1},"h":"4624c91d0e"},{"n":6,"t":"ref","q":"What does the underlined \"doing so\" refer to?\nBy doing so, we can make our dreams come true.","ko":"밑줄 친 doing so가 가리키는 것은?","sko":"그렇게 함으로써, 우리는 우리의 꿈을 이룰 수 있다.","opts":["  나머지 단어는 이 자리에 들어가면 말이 안 돼요.","c":null},"h":"fca7e43959"}]},{"u":6,"id":"rj1-06-4","no":4,"ko":"컵의 무게가 달라진다고?","items":[{"n":1,"t":"tf","q":"The psychologist held up a cup of water.","ko":"심리학자는 물 한 잔이 든 컵을 들어 올렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"She held up a cup of water.","그녀는 물 한 잔을 들어 올렸다."]],"w":"2번 문장에 She held up a cup of water가 그대로 있어요. hold up은 '들어 올리다'예요.","c":"T"},"h":"caa60a96eb"},{"n":2,"t":"tf","q":"The audience guessed the weight of the cup correctly.","ko":"청중은 컵의 무게를 정확히 맞혔다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The audience made a few guesses, but she just shook her head.","청중은 몇 개의 추측을 했지만, 그녀는 그저 고개를 저었다."]],"w":"4번 문장에서 청중이 몇 가지 추측을 했지만 그녀는 고개를 저었다고 해요. shook her head는 아니라는 뜻이라 맞히지 못한 거예요.","c":"F"},"h":"8fabb60f9c"},{"n":3,"t":"tf","q":"The psychologist asked the audience how long they plan to hold onto their cup.","ko":"심리학자는 청중에게 그들의 컵을 얼마나 오래 잡고 있을 계획인지 물었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"So, how long do you plan to hold onto your cup?”","그래서 당신은 당신의 컵을 얼마나 오래 잡고 있을 계획입니까?”"]],"w":"12번 문장에서 So, how long do you plan to hold onto your cup?이라고 물어요. 컵은 스트레스를 비유해요.","c":"T"},"h":"d66c12ce3d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She asked the audience how much it weighed.)","ko":"그녀는 청중에게 그것이 얼마나 ( ) 물었다.","opts":["값이 얼마였는지","무게가 나갔는지","얼마나 컸는지","어디에 있었는지"],"word":"weighed","r":{"a":"2) 무게가 나갔는지","ev":"3~4번 문장","s":[[3,"She asked the audience how much it weighed.","그녀는 청중에게 그것의 무게가 얼마나 나가는지 물었다."],[4,"The audience made a few guesses, but she just shook her head.","청중은 몇 개의 추측을 했지만, 그녀는 그저 고개를 저었다."]],"w":"3번은 컵의 무게를 묻는 문장이에요. 4번에서 청중이 추측을 했으니 how much it weighed는 '얼마나 무게가 나가는지'예요.","c":2},"h":"13ee071bba"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (After an hour, however, my arm will be sore.)","ko":"그러나, 한 시간 후에 제 팔은 ( ) 것입니다.","opts":["아픈","강한","가벼운","차가운"],"word":"sore","r":{"a":"1) 아픈","ev":"6~7번 문장","s":[[6,"After a couple of minutes, the cup will still be light.","몇 분 후에, 컵은 여전히 가벼울 것입니다."],[7,"After an hour, however, my arm will be sore.","그러나, 한 시간 후에 제 팔은 아플 것입니다."]],"w":"6번에서 몇 분 후에는 컵이 가볍다고 했고, 7번은 however로 반대 상황을 말해요. 오래 들고 있으면 팔이 아프니 sore는 '아픈'이에요.","c":1},"h":"febbd88404"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\n“To me,” she said, “the weight of the cup depends on how long I hold it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그녀가 말했다. “제게는, 컵의 무게는 제가 그것을 얼마나 오래 들고 있느냐에 달려 있습니다.","opts":["컵","컵의 무게","청중","연설"],"pron":"it","r":{"a":"1) 컵","ev":"5번 문장","s":[[5,"“To me,” she said, “the weight of the cup depends on how long I hold it.","그녀가 말했다. “제게는, 컵의 무게는 제가 그것을 얼마나 오래 들고 있느냐에 달려 있습니다."]],"w":"5번 문장 how long I hold it에서 it은 그녀가 들고 있는 컵이에요. 컵을 얼마나 오래 드느냐에 따라 무게가 달라진다는 말이에요.","c":1,"k":"it = 컵"},"h":"0792ac4b35"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Our stress is like the cup of water.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리의 스트레스는 이 한 잔의 물과 같습니다.","opts":["스트레스는 물 한 잔을 마시면 풀린다.","스트레스는 물 한 잔보다 훨씬 무겁다.","스트레스는 컵 속의 물과 관계가 없다.","우리의 스트레스는 물 한 잔이 든 컵과 같다."],"r":{"a":"4) 우리의 스트레스는 물 한 잔이 든 컵과 같다.","ev":"9번 문장","s":[[9,"Our stress is like the cup of water.","우리의 스트레스는 이 한 잔의 물과 같습니다."]],"w":"be like는 '~와 같다'예요. 9번은 스트레스를 컵에 비유해요. 컵은 오래 들수록 팔이 약해지듯, 스트레스도 오래 생각할수록 힘들어진다는 뜻이에요.","c":4},"h":"5ec789228e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["몇 분 후에 컵은 무거울 것이다.","몇 분 후에도 컵은 여전히 가벼울 것이다.","그녀는 몇 분 후에 컵을 내려놓을 것이다.","몇 분 후에 컵은 비어 있을 것이다."],"opts":["The cup will be heavy after a couple of minutes.","The cup will still be light after a couple of minutes.","She will put the cup down after a couple of minutes.","The cup will be empty after a couple of minutes."],"r":{"a":"2) The cup will still be light after a couple of minutes. (몇 분 후에도 컵은 여전히 가벼울 것이다.)","ev":"6번 문장","s":[[6,"After a couple of minutes, the cup will still be light.","몇 분 후에, 컵은 여전히 가벼울 것입니다."]],"w":"6번 문장에서 After a couple of minutes, the cup will still be light라고 해요.","c":2},"h":"325efe48c1"},{"n":9,"t":"sum","q":"Thinking about stress for a (A) time does not bother us, but thinking about it (B) makes us lose strength.","ko":"스트레스를 (A) 시간 동안 생각하는 것은 우리를 괴롭히지 않지만, (B) 생각하는 것은 우리의 힘을 잃게 한다.","oko":["(A) 긴 / (B) 몇 분 동안","(A) 짧은 / (B) 몇 분 동안","(A) 긴 / (B) 온종일","(A) 짧은 / (B) 한 번","(A) 짧은 / (B) 온종일"],"opts":["(A) long / (B) for a few minutes","(A) short / (B) for a few minutes","(A) long / (B) all day","(A) short / (B) once","(A) short / (B) all day"],"r":{"a":"5) (A) short / (B) all day","ev":"10~11번 문장","s":[[10,"If we think about it for a few minutes, it doesn’t bother us.","만약 우리가 몇 분 동안 그것에 대해 생각한다면, 그것은 우리를 괴롭히지 않습니다."],[11,"But if we think about our stress all day, we will become weak.","그러나 만약 우리가 스트레스에 대해 온종일 생각한다면, 우리는 약해질 것입니다."]],"w":"10번에서 몇 분 동안 생각하면 괴롭지 않다고 했으니 (A)는 짧은(short), 11번에서 온종일(all day) 생각하면 약해진다고 했으니 (B)는 all day예요.","c":5},"h":"8e8a69c75f"},{"n":10,"t":"fill","q":"After a day, my arm will be so [A] that I won’t be able to [B] it.","ko":"하루 후에, 제 팔은 너무 [A] 저는 그것을 [B] 수 없을 것입니다.","bank":["weak","move","audience","hour","cup","water"],"bko":{"weak":"약한","move":"움직이다","audience":"청중","hour":"시간","cup":"컵","water":"물"},"r":{"a":"[A] weak (약한), [B] move (움직이다)","ev":"8번 문장","s":[[8,"After a day, my arm will be so weak that I won’t be able to move it.","하루 후에, 제 팔은 너무 약해져서 저는 그것(팔)을 움직일 수 없을 것입니다."]],"w":"8번 문장에서 가져왔어요. so weak that은 '너무 약해서 ~'이고, able to 뒤에는 동사원형 move(움직이다)가 와요. 나머지 단어는 이 자리에 들어가면 말이 안 돼요.","c":null},"h":"b5c5a3af04"}]},{"u":7,"id":"rj1-07-1","no":1,"ko":"나도 이런 형제자매가 있었으면!","items":[{"n":1,"t":"tf","q":"Termites live together in huge groups.","ko":"흰개미는 크게 무리 지어 함께 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Termites live together in huge groups.","흰개미는 크게 무리 지어 함께 산다."]],"w":"9번 문장에 Termites live together in huge groups가 그대로 있어요. 흰개미는 큰 무리를 지어 함께 산다는 내용과 일치해요.","c":"T"},"h":"0a70018a09"},{"n":2,"t":"tf","q":"Adult male elephants live together with females and their young.","ko":"어른 수컷 코끼리는 암컷과 그것들의 새끼와 함께 산다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Adult male elephants live alone.","어른 수컷 코끼리는 혼자 산다."]],"w":"4번 문장에서 어른 수컷 코끼리는 혼자 산다(live alone)고 해요. 함께 산다는 말은 반대예요. 함께 사는 쪽은 암컷과 새끼예요.","c":"F"},"h":"c1badf932a"},{"n":3,"t":"tf","q":"Female elephants and their young stay together as a family for life.","ko":"암컷 코끼리와 그것들의 새끼는 평생 한 가족으로 함께 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"But females and their young stay together as a family for life.","하지만 암컷과 그것들의 새끼는 평생 한 가족으로 함께 산다."]],"w":"5번 문장에 females and their young stay together as a family for life가 그대로 있어요. 평생 한 가족으로 함께 산다는 내용과 일치해요.","c":"T"},"h":"e93b20694b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The older sisters in the herd look after their siblings.)","ko":"무리에서 나이가 더 많은 암컷 코끼리들은 자신의 동생들을 ( ).","opts":["돌본다","찾아본다","닮았다","뒤쫓는다"],"word":"look after","r":{"a":"1) 돌본다","ev":"6번 문장","s":[[6,"The older sisters in the herd look after their siblings.","무리에서 나이가 더 많은 암컷 코끼리들은 자신의 동생들을 돌본다."]],"w":"6번 문장에서 언니 코끼리들이 동생들을 위해 하는 일이에요. 7번에서 어린 코끼리들을 안전하게 지킨다고 이어지니 look after = 돌보다예요.","c":1},"h":"1589f1fd0f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (After that, the older siblings must raise the younger ones.)","ko":"그 이후에는 나이가 더 많은 형제자매가 동생들을 ( ) 한다.","opts":["들어올린다","던져 버린다","가르친다","키운다"],"word":"raise","r":{"a":"4) 키운다","ev":"11~12번 문장","s":[[11,"After that, the older siblings must raise the younger ones.","그 이후에는 나이가 더 많은 형제자매가 동생들을 돌봐야 한다."],[12,"They make sure the younger termites are clean and have enough food.","그들은 더 어린 흰개미들이 깨끗하고 충분한 먹이를 가지도록 한다."]],"w":"부모가 떠난 뒤(11번) 형제자매가 동생들을 어떻게 하는지 말하는 문장이에요. 12번에서 동생들이 깨끗하고 먹이를 충분히 갖게 해 준다고 하니 raise는 '키우다'예요.","c":4},"h":"c23827fb95"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is rare in the animal world.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 동물 세계에서는 드물다.","opts":["코끼리가 혼자 사는 것","사람이 형제자매와 관계를 쌓는 것","동물이 새끼를 낳는 것","흰개미가 무리 지어 사는 것"],"pron":"This","r":{"a":"2) 사람이 형제자매와 관계를 쌓는 것","ev":"1~2번 문장","s":[[1,"Humans often build relationships with their siblings.","사람들은 흔히 자신의 형제자매와 관계를 쌓는다."],[2,"This is rare in the animal world.","이것은 동물 세계에서는 드물다."]],"w":"2번의 This는 바로 앞 1번의 '사람들이 흔히 형제자매와 관계를 쌓는 것'이에요. 그것이 동물 세계에서는 드물다는 말이에요.","c":2,"k":"This = 사람이 형제자매와 관계를 쌓는 것"},"h":"f892ac5927"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is good practice for being mothers themselves.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그들 스스로 엄마가 되기 위한 좋은 연습이다.","opts":["이것은 그들이 직접 엄마가 되었을 때를 준비하는 좋은 연습이다.","이것은 엄마 코끼리들이 서로 돕는 좋은 연습이다.","이것은 어린 코끼리들이 혼자 사는 좋은 연습이다.","이것은 엄마가 되기에는 좋지 않은 연습이다."],"r":{"a":"1) 이것은 그들이 직접 엄마가 되었을 때를 준비하는 좋은 연습이다.","ev":"8번 문장","s":[[8,"This is good practice for being mothers themselves.","이것은 그들 스스로 엄마가 되기 위한 좋은 연습이다."]],"w":"This는 7번의 '어린 코끼리들을 안전하게 지키는 일'이에요. 그 일이 언니들이 나중에 엄마가 되기 위한 연습이 된다는 뜻이에요.","c":1},"h":"db9f80a8d3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["더 어린 흰개미들이 더 나이 많은 흰개미들을 가르친다.","나이가 더 많은 흰개미들은 더 어린 흰개미들이 깨끗하고 충분한 먹이를 가지도록 한다.","나이가 더 많은 흰개미들은 더 어린 흰개미들을 먹이 없이 내버려 둔다.","더 어린 흰개미들은 더 나이 많은 흰개미들과 멀리 떨어져 산다."],"opts":["The younger termites teach the older ones.","The older termites make sure the younger ones are clean and have enough food.","The older termites leave the younger ones without food.","The younger termites live far away from the older ones."],"r":{"a":"2) The older termites make sure the younger ones are clean and have enough food. (나이가 더 많은 흰개미들은 더 어린 흰개미들이 깨끗하고 충분한 먹이를 가지도록 한다.)","ev":"12번 문장","s":[[12,"They make sure the younger termites are clean and have enough food.","그들은 더 어린 흰개미들이 깨끗하고 충분한 먹이를 가지도록 한다."]],"w":"12번 문장에서 They make sure the younger termites are clean and have enough food라고 해요. 여기서 They는 나이가 더 많은 형제자매들이에요.","c":2},"h":"fee9815f3f"},{"n":9,"t":"sum","q":"In the case of subterranean termites, the termite (A) stick around only while their (B) are very young.","ko":"지중 흰개미의 경우, 흰개미 (A)은(는) 자신의 (B)이(가) 매우 어릴 때만 곁에 머문다.","oko":["(A) 부모 / (B) 알","(A) 수컷 / (B) 새끼","(A) 부모 / (B) 새끼","(A) 수컷 / (B) 친구","(A) 부모 / (B) 친구"],"opts":["(A) parents / (B) eggs","(A) males / (B) babies","(A) parents / (B) babies","(A) males / (B) friends","(A) parents / (B) friends"],"r":{"a":"3) (A) parents / (B) babies ((A) 부모 / (B) 새끼)","ev":"10번 문장","s":[[10,"In the case of subterranean termite, the termite parents stick around only while their babies are very young.","지중 흰개미의 경우, 흰개미 부모들은 자신의 새끼들이 매우 어릴 때만 같이 산다."]],"w":"10번 문장에서 흰개미 부모들(the termite parents)은 자신의 새끼들(their babies)이 매우 어릴 때만 곁에 있다고 해요.","c":3},"h":"e6e37b02e4"},{"n":10,"t":"fill","q":"They [A] the younger elephants [B].","ko":"그들은 더 어린 코끼리들을 [B] 상태로 [A].","bank":["keep","safe","sisters","herd","termites","mothers"],"bko":{"keep":"지키다","safe":"안전한","sisters":"언니들","herd":"무리","termites":"흰개미들","mothers":"엄마들"},"r":{"a":"[A] keep (지키다), [B] safe (안전한)","ev":"7번 문장","s":[[7,"They keep the younger elephants safe.","그들은 더 어린 코끼리들을 안전하게 유지한다."]],"w":"7번 문장에서 가져왔어요. 'keep + 대상 + 형용사'는 '~을 …한 상태로 유지하다(지키다)'예요. 그래서 keep과 safe(안전한)가 들어가요.","c":null},"h":"8b20d47065"}]},{"u":7,"id":"rj1-07-2","no":2,"ko":"귀 쫑긋~ 사막여우","items":[{"n":1,"t":"tf","q":"A fennec fox is bigger than other foxes.","ko":"사막여우는 다른 여우들보다 크다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It is not as big as other foxes and has a small face.","그것은 다른 여우들만큼 크지 않고 작은 얼굴을 가지고 있다."]],"w":"3번 문장에서 사막여우는 다른 여우들만큼 크지 않다(not as big as)고 해요. 더 크다는 말은 반대예요.","c":"F"},"h":"3d95cac359"},{"n":2,"t":"tf","q":"The fennec fox's large ears keep it from getting hot.","ko":"사막여우의 큰 귀는 그것이 더워지는 것을 막는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Luckily, its large ears keep it from getting hot.","다행히도, 그것의 큰 귀는 그것이 더워지는 것을 막는다."]],"w":"7번 문장에 its large ears keep it from getting hot이 그대로 있어요. 큰 귀가 더워지는 것을 막아 준다는 내용과 일치해요.","c":"T"},"h":"92ba22051b"},{"n":3,"t":"tf","q":"The arctic fox lives in hot areas and has large ears.","ko":"북극여우는 더운 지역에 살고 큰 귀를 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"10, 12번 문장","s":[[10,"On the other hand, the arctic fox lives in cold areas.","반면에, 북극여우는 추운 지역에 산다."],[12,"So it has small ears, and these help the fox stay warm.","그래서 그것은 작은 귀를 가지고 있는데, 이것들은 그 여우가 따뜻하게 유지하는 것을 돕는다."]],"w":"10번에서 북극여우는 추운 지역(cold areas)에 살고, 12번에서 작은 귀를 가진다고 해요. 더운 지역과 큰 귀는 둘 다 틀렸어요.","c":"F"},"h":"0bd40ce43d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The many blood vessels inside its ears release heat.)","ko":"그것의 귀 안에 있는 많은 혈관들이 열을 ( ).","opts":["모은다","방출한다","빌려준다","흡수한다"],"word":"release","r":{"a":"2) 방출한다","ev":"8번 문장","s":[[8,"The many blood vessels inside its ears release heat.","그것의 귀 안에 있는 많은 혈관들이 열을 방출한다."]],"w":"8번 문장은 귀 속 혈관이 열을 몸 밖으로 내보내 시원하게 한다는 뜻이에요. 9번에서 체온을 조절할 수 있다고 이어져서 release = 방출하다예요.","c":2},"h":"d725516416"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It must save its heat in cold weather.)","ko":"그것은 추운 날씨에서 자신의 열을 ( ) 한다.","opts":["구하다","잃다","아끼다","나누다"],"word":"save","r":{"a":"3) 아끼다","ev":"11~12번 문장","s":[[11,"It must save its heat in cold weather.","그것은 추운 날씨에서 자신의 열을 아껴야 한다."],[12,"So it has small ears, and these help the fox stay warm.","그래서 그것은 작은 귀를 가지고 있는데, 이것들은 그 여우가 따뜻하게 유지하는 것을 돕는다."]],"w":"북극여우는 추운 곳에 살아서 열을 잃지 않아야 해요. 12번에서 작은 귀가 따뜻하게 유지하도록 돕는다고 하니 save = 아끼다예요.","c":3},"h":"6a2b44349c"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is called a fennec fox.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 사막여우라고 불린다.","opts":["이 여우","북극여우","박쥐","다른 여우들"],"pron":"It","r":{"a":"1) 이 여우","ev":"1~2번 문장","s":[[1,"This fox looks cute, doesn’t it?","이 여우는 귀여워 보인다, 그렇지 않은가?"],[2,"It is called a fennec fox.","그것은 사막여우라고 불린다."]],"w":"1번에서 '이 여우'를 말하고, 2번의 It은 바로 그 여우예요. 이 여우의 이름이 fennec fox(사막여우)라는 말이에요.","c":1,"k":"It = 이 여우"},"h":"db7e8d6e23"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There is an interesting secret about its large ears.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것의 큰 귀에 관한 흥미로운 비밀이 있다.","opts":["그것의 큰 귀에는 비밀이 전혀 없다.","그것의 큰 귀에는 흥미로운 비밀이 있다.","그것은 큰 귀 때문에 비밀을 잘 지킨다.","그것의 작은 귀에 관한 이야기가 있다."],"r":{"a":"2) 그것의 큰 귀에는 흥미로운 비밀이 있다.","ev":"5번 문장","s":[[5,"There is an interesting secret about its large ears.","그것의 큰 귀에 관한 흥미로운 비밀이 있다."]],"w":"There is an interesting secret about its large ears는 '그것의 큰 귀에 관한 흥미로운 비밀이 있다'는 뜻이에요.","c":2},"h":"802312926e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사막여우는 작고 둥근 귀를 가지고 있다.","사막여우는 얼굴이 크다.","사막여우는 커다란 박쥐 같은 귀를 가지고 있다.","사막여우는 박쥐처럼 날개가 있다."],"opts":["The fennec fox has small round ears.","The fennec fox has a big face.","The fennec fox has large, bat-like ears.","The fennec fox has wings like a bat."],"r":{"a":"3) The fennec fox has large, bat-like ears. (사막여우는 커다란 박쥐 같은 귀를 가지고 있다.)","ev":"3~4번 문장","s":[[3,"It is not as big as other foxes and has a small face.","그것은 다른 여우들만큼 크지 않고 작은 얼굴을 가지고 있다."],[4,"But it has large, bat-like ears.","그러나 그것은 커다란 박쥐 같은 귀를 가지고 있다."]],"w":"4번 문장에서 it has large, bat-like ears라고 해요. 3번에서 얼굴은 작다고 했어요.","c":3},"h":"485dba626a"},{"n":9,"t":"sum","q":"The fennec fox lives in the (A), so it has to find ways to stay (B).","ko":"사막여우는 (A)에 살아서, (B) 지내기 위한 방법을 찾아야 한다.","oko":["(A) 숲 / (B) 따뜻하게","(A) 사막 / (B) 따뜻하게","(A) 숲 / (B) 시원하게","(A) 사막 / (B) 시원하게","(A) 바다 / (B) 뜨겁게"],"opts":["(A) forest / (B) warm","(A) desert / (B) warm","(A) forest / (B) cool","(A) desert / (B) cool","(A) ocean / (B) hot"],"r":{"a":"4) (A) desert / (B) cool ((A) 사막 / (B) 시원하게)","ev":"6번 문장","s":[[6,"The fennec fox lives in the desert, so it has to find ways to stay cool.","사막여우는 사막에 살아서, 그것은 시원하게 유지하기 위한 방법들을 찾아야 한다."]],"w":"6번 문장에서 사막여우는 사막(desert)에 살아서 시원하게(cool) 지낼 방법을 찾아야 한다고 해요.","c":4},"h":"cafdcf259b"},{"n":10,"t":"fill","q":"This means that the fennec fox can [A] its own body [B].","ko":"이것은 사막여우가 자신의 [B]을(를) [A]할 수 있다는 것을 의미한다.","bank":["control","temperature","foxes","secret","ears","vessels"],"bko":{"control":"조절하다","temperature":"온도, 체온","foxes":"여우들","secret":"비밀","ears":"귀들","vessels":"혈관들"},"r":{"a":"[A] control (조절하다), [B] temperature (온도, 체온)","ev":"9번 문장","s":[[9,"This means that the fennec fox can control its own body temperature.","이것은 사막여우가 자신의 체온을 조절할 수 있다는 것을 의미한다."]],"w":"9번 문장 This means that the fennec fox can control its own body temperature에서 가져왔어요. 나머지 단어는 'can ~ its own body' 자리에 넣으면 뜻이 맞지 않아요.","c":null},"h":"329e368b13"}]},{"u":7,"id":"rj1-07-3","no":3,"ko":"때밀이는 나한테 맡겨줘!","items":[{"n":1,"t":"tf","q":"The cleaner wrasse eats dead skin and harmful creatures found on larger fish.","ko":"청소 놀래기는 더 큰 물고기에게서 발견되는 각질과 해로운 생물들을 먹는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It eats dead skin and harmful creatures found on larger fish.","그것은 더 큰 물고기에게서 발견되는 각질과 해로운 생물들을 먹는다."]],"w":"2번 문장에 It eats dead skin and harmful creatures found on larger fish가 그대로 있어요. 놀래기가 큰 물고기의 각질과 해로운 생물을 먹는다는 내용과 일치해요.","c":"T"},"h":"4c58eaa54e"},{"n":2,"t":"tf","q":"Fish that want to be cleaned close their mouths.","ko":"청소되기를 원하는 물고기들은 입을 다문다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"They stay still with their mouths open.","그들은 입을 벌린 채로 가만히 있는다."]],"w":"7번 문장에서 물고기들은 입을 벌린 채로(with their mouths open) 가만히 있어요. 입을 다문다는 말은 반대예요.","c":"F"},"h":"eeae345a12"},{"n":3,"t":"tf","q":"The fish protect the cleaner wrasse from predators.","ko":"물고기들은 청소 놀래기를 포식자들로부터 보호한다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"In fact, they protect it from predators.","사실 그들은 그것을 포식자들로부터 보호해 준다."]],"w":"13번 문장에 they protect it from predators가 있어요. 여기서 they는 청소받는 물고기들, it은 놀래기라서 일치해요.","c":"T"},"h":"58c101eac4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The wrasse attracts fish by moving the back of its body up and down.)","ko":"청소 놀래기는 자신의 몸의 뒤편을 위아래로 움직여서 ( ).","opts":["쫓아낸다","관심을 끈다","해친다","청소한다"],"word":"attracts","r":{"a":"2) 관심을 끈다","ev":"5~6번 문장","s":[[5,"The wrasse attracts fish by moving the back of its body up and down.","청소 놀래기는 자신의 몸의 뒤편을 위아래로 움직여 물고기들의 관심을 끈다."],[6,"Fish that want to be e passage?","ko":"글의 내용과 같은 것은?","oko":["청소 놀래기는 자신이 청소하는 물고기보다 크다.","청소되기를 원하는 물고기들은 자신의 차례를 위해 줄을 서서 기다린다.","청소되기를 원하는 물고기들은 서로 싸운다.","청소 놀래기는 다른 물고기들에게서 아무것도 받지 못한다."],"opts":["The wrasse is bigger than the fish it cleans.","Fish that want to be cleaned wait in line for their turn.","Fish that want to be cleaned fight each other.","The wrasse receives nothing from the other fish."],"r":{"a":"2) Fish that want to be cleaned wait in line for their turn. (청소되기를 원하는 물고기들은 자신의 차례를 위해 줄을 서서 기다린다.)","ev":"6번 문장","s":[[6,"Fish that want to be cleaned wait in line for their turn.","청소되기를 원하는 물고기들은 자신의 차례를 위해 줄을 서서 기다린다."]],"w":"6번 문장에서 Fish that want to be cleaned wait in line for their turn이라고 해요.","c":2},"h":"e3a055e2c9"},{"n":9,"t":"sum","q":"The wrasse (A) its fins to (B) the fish that it is there.","ko":"청소 놀래기는 물고기들에게 자신이 거기에 있다는 것을 (B) 위해 지느러미를 (A).","oko":["(A) 닫는다 / (B) 상기시키기","(A) 진동시킨다 / (B) 잊게 하기","(A) 진동시킨다 / (B) 상기시키기","(A) 자른다 / (B) 잊게 하기","(A) 닫는다 / (B) 공격하기"],"opts":["(A) closes / (B) remind","(A) vibrates / (B) forget","(A) vibrates / (B) remind","(A) cuts / (B) forget","(A) closes / (B) attack"],"r":{"a":"3) (A) vibrates / (B) remind ((A) 진동시킨다 / (B) 상기시키기)","ev":"9번 문장","s":[[9,"It vibrates its fins to remind the fish that it’s there.","그것은 물고기들에게 자신이 거기에 있다는 것을 알려 주기 위해 지느러미를 진동시킨다."]],"w":"9번 문장에서 청소 놀래기는 자신이 거기에 있다는 것을 상기시키기(remind) 위해 지느러미를 진동시킨다(vibrates)고 해요.","c":3},"h":"b57804ed90"},{"n":10,"t":"fill","q":"The wrasse [A] a free [B], and the other fish get cleaned.","ko":"청소 놀래기는 공짜 [B]을(를) [A], 그리고 다른 물고기들은 깨끗하게 된다.","bank":["gets","meal","down","still","actually","otherwise"],"bko":{"gets":"얻는다","meal":"식사","down":"아래로","still":"가만히","actually":"실제로","otherwise":"그렇지 않으면"},"r":{"a":"[A] gets (얻는다), [B] meal (식사)","ev":"4번 문장","s":[[4,"The wrasse gets a free meal, and the other fish get cleaned.","청소 놀래기는 공짜 식사를 얻고, 다른 물고기들은 깨끗하게 된다."]],"w":"4번 문장에서 가져왔어요. 주어 The wrasse 다음에는 동사 gets(얻는다)가, a free 뒤에는 명사 meal(식사)이 와요. 나머지 단어는 이 자리에 들어가면 말이 안 돼요. 이어지니 decrease = 줄이다예요.","c":3},"h":"92ad4c4dc6"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is a state like death.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 죽음과 같은 상태이다.","opts":["물곰의 몸 크기","물곰의 이름","물곰이 발견되는 장소","휴면 생활"],"r":{"a":"4) 휴면 생활","ev":"11~12번 문장","s":[[11,"Water bears can enter cryptobiosis.","물곰들은 휴면 생활에 들어갈 수 있다."],[12,"This is a state like death.","이것은 죽음과 같은 상태이다."]],"w":"11번에서 물곰이 들어갈 수 있다고 한 것은 휴면 생활(cryptobiosis)이고, 12번의 This가 그것을 가리켜 죽음과 같은 상태라고 설명해요.","c":4},"h":"d082e42f05"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So they do not freeze to death.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 그것들은 얼어 죽지 않는다.","opts":["그래서 그것들은 얼어 죽지 않는다.","그래서 그것들은 죽은 채로 얼음 속에 갇힌다.","그래서 그것들은 죽을 때까지 얼려진다.","그래서 그것들은 얼지 못해서 죽는다."],"r":{"a":"1) 그래서 그것들은 얼어 죽지 않는다.","ev":"14번 문장","s":[[14,"So they do not freeze to death.","그래서 그것들은 얼어 죽지 않는다."]],"w":"freeze to death는 '얼어 죽다'예요. do not이 붙어서 '얼어 죽지 않는다'가 되고, 앞 문장에서 몸속 물을 거의 없앤 것이 그 이유예요.","c":1},"h":"548094a466"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["물곰들은 따뜻한 물에서만 살 수 있다.","물곰들은 추운 장소에서만 발견된다.","물곰들은 아주 뜨겁고 아주 추운 장소들에서도 발견된다.","물곰들은 우주에서만 발견된다."],"opts":["Water bears can live only in warm water.","Water bears are found only in cold places.","Water bears are found in very hot and very cold places.","Water bears are found only in space."],"r":{"a":"3) Water bears are found in very hot and very cold places. (물곰들은 아주 뜨겁고 아주 추운 장소들에서도 발견된다.)","ev":"8번 문장","s":[[8,"They are also found in places as hot as 150 °C and as cold as ‒273 °C.","그것들은 섭씨 150도만큼 뜨겁고 섭씨 영하 273도만큼 추운 장소들에서도 발견된다."]],"w":"8번 문장에서 물곰들은 섭씨 150도만큼 뜨겁고 영하 273도만큼 추운 장소들에서도 발견된다고 해요.","c":3},"h":"6206ec40cf"},{"n":9,"t":"sum","q":"The tardigrade is one of the (A) animals on earth, but it is also one of the (B) animals.","ko":"완보류는 지구상에서 가장 (A) 동물 중 하나이지만, 가장 (B) 동물 중 하나이기도 하다.","oko":["(A) 약한 / (B) 작은","(A) 강한 / (B) 큰","(A) 강한 / (B) 작은","(A) 큰 / (B) 강한","(A) 약  of the sentence?\n\"It caused some parts of her skin to be dark and other parts to be very light.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 그녀의 피부의 어떤 부분들은 어둡고 다른 부분들은 매우 밝게 만들었다.","opts":["그것 때문에 그녀의 피부 전체가 어두워졌다.","그것 때문에 그녀의 피부 일부는 어둡고 다른 일부는 매우 밝아졌다.","그것 때문에 그녀의 피부는 햇빛에 닿으면 아팠다.","그것 때문에 그녀의 피부 전체가 매우 밝아졌다."],"r":{"a":"2) 그것 때문에 그녀의 피부 일부는 어둡고 다른 일부는 매우 밝아졌다.","ev":"3번 문장","s":[[3,"It caused some parts of her skin to be dark and other parts to be very light.","그것은 그녀의 피부의 어떤 부분들은 어둡고 다른 부분들은 매우 밝게 만들었다."]],"w":"some parts ... dark and other parts ... very light는 '어떤 부분은 어둡고 다른 부분은 매우 밝다'는 뜻이에요.","c":2},"h":"94e279b12d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Winnie의 피부 문제는 병원에서 완치되었다.","Winnie는 놀림을 받은 뒤 모델 일을 그만두었다.","Winnie는 TV 모델 경연 대회에 참가하도록 선발되었다.","Winnie는 프랑스의 학교에서 모델이 되는 법을 배웠다."],"opts":["Winnie's skin problem was cured at a hospital.","Winnie quit modeling after she was teased.","Winnie was chosen to compete in a modeling contest on TV.","Winnie learned to be a model at a school in France."],"r":{"a":"3) Winnie was chosen to compete in a modeling contest on TV. (Winnie는 TV 모델 경연 대회에 참가하도록 선발되었다.)","ev":"9번 문장","s":[[9,"Finally, she was chosen to compete in a modeling contest on TV.","결국 그녀는 TV 모델 경연 대회에 참가하도록 선발되었다."]],"w":"9번 문장에서 she was chosen to compete in a modeling contest on TV라고 해요.","c":3},"h":"40fe44b5df"},{"n":9,"t":"sum","q":"Winnie began (A) hundreds of photos of herself (B).","ko":"Winnie는 자신의 사진 수백 장을 (B) (A) 시작했다.","oko":["(A) 지우기 / (B) 인터넷에","(A) 올리기 / (B) 학교에서","(A) 올리기 / (B) 인터넷에","(A) 팔기 / (B) 학교에서","(A) 지우기 / (B) 집에서"],"opts":["(A) deleting / (B) online","(A) posting / (B) at school","(A) posting / (B) online","(A) selling / (B) at school","(A) deleting / (B) at home"],"r":{"a":"3) (A) posting / (B) online ((A) 올리기 / (B) 인터넷에)","ev":"8번 문장","s":[[8,"Then, she began posting hundreds of photos of herself online.","그런 다음, 그녀는 자신의 사진 수백 장을 인터넷에 올리기 시작했다."]],"w":"8번 문장에서 she began postin 된'이 알맞아요.","c":1},"h":"a26617fd10"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But, for safety reasons, hot drinks are served by a waiter.)","ko":"그렇지만 안전상의 이유로 뜨거운 음료는 종업원에 의해 ( ) 것이다.","opts":["씻기는","제공되는","버려지는","주문되는"],"word":"served","r":{"a":"2) 제공되는","ev":"13번 문장","s":[[13,"But, for safety reasons, hot drinks are served by a waiter.","그렇지만 안전상의 이유로 뜨거운 음료는 종업원에 의해 제공된다."]],"w":"종업원(waiter)이 뜨거운 음료를 손님에게 가져다준다는 내용이에요. are served는 '제공된다'라는 뜻이에요.","c":2},"h":"3b60913dcf"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt’s a restaurant chain.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 레스토랑 체인점이다.","opts":["롤러코스터 레스토랑","터치스크린 기기","작은 선로","손님들의 테이블"],"r":{"a":"1) 롤러코스터 레스토랑","ev":"2~3번 문장","s":[[2,"Then you should check out Rollercoaster Restaurant.","그렇다면 당신은 롤러코스터 레스토랑에 가 봐야 한다."],[3,"It’s a restaurant chain.","그것은 레스토랑 체인점이다."]],"w":"2번에서 가 봐야 한다고 소개한 곳이 Rollercoaster Restaurant이고, 3번에서 그곳이 레스토랑 체인점이라고 설명해요.","c":1},"h":"d3ebb107b0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The tracks are up to nine meters tall, and the food travels as fast as 20 kilometers per hour.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 선로들은 (최고) 9미터까지 높고, 음식은 시속 20킬로미터만큼 빠르게 이동한다.","opts":["선로는 최소 9미터이고, 음식은 시속 2킬로미터로 이동한다.","선로는 땅속 9미터에 있고, 음식은 20킬로미터를 걸어간다.","선로의 높이는 최고 9미터까지이고, 음식은 시속 20킬로미터만큼 빠르게 이동한다.","선로는 9개이고, 음식은 20분 만에 도착한다."],"r":{"a":"3) 선로의 높이는 최고 9미터까지이고, 음식은 시속 20킬로미터만큼 빠르게 이동한다.","ev":"8번 문장","s":[[8,"The tracks are up to nine meters tall, and the food travels as fast as 20 kilometers per hour.","그 선로들은 (최고) 9미터까지 높고, 음식은 시속 20킬로미터만큼 빠르게 이동한다."]],"w":"up to는 '~까지'이고 tall은 '높은'이에요. as fast as 20 kilometers per hour는 '시속 20킬로미터만큼 빠르게'예요.","c":3},"h":"33a4b99525"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["손님들은 주방에서 음식을 직접 가져온다.","음식은 로봇이 각 테이블로 가져다준다.","손님들은 종이에 써서 음식을 주문한다.","음식은 작은 롤러코스터 선로 위로 테이블에 도착한다."],"opts":["Guests pick up their food from a kitchen by themse 화 속 우주선이 서로 쏠 때 시끄러운 소리를 들을 수 있다고 해요. 영화에서는 조용하지 않아요. 실제로는 불가능하다는 말은 3번에 나와요.","c":"F"},"h":"76ea9e5f51"},{"n":3,"t":"tf","q":"Astronauts use radios in their helmets when they go outside the spaceship.","ko":"우주 비행사들은 우주선 밖으로 나갈 때 헬멧 안의 무전기를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"When they go outside the spaceship, they use radios in their helmets.","그들이 우주선 밖으로 갈 때, 그들은 그들의 헬멧 안에 있는 무전기를 사용한다."]],"w":"9번 문장에 When they go outside the spaceship, they use radios in their helmets가 그대로 있어요.","c":"T"},"h":"703aa93f0d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Interestingly, this would be impossible.)","ko":"흥미롭게도, 이것은 ( ) 것이다.","opts":["가능한","불가능한","위험한","시끄러운"],"word":"impossible","r":{"a":"2) 불가능한","ev":"3~4번 문장","s":[[3,"Interestingly, this would be impossible.","흥미롭게도, 이것은 불가능할 것이다."],[4,"This is because there is no air in space!","이것은 우주에 공기가 없기 때문이다!"]],"w":"3번 this는 우주에서 큰 소리를 듣는 것이에요. 4번에서 우주에는 공기가 없어서 소리가 안 난다고 하니 impossible은 '불가능한'이에요.","c":2},"h":"3ceb253511"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These sound waves move through the air until they reach our ears.)","ko":"이 음파들은 그것들이 우리의 귀에 ( ) 때까지 공기를 통해 이동한다.","opts":["떠나다","피하다","도달하다","만들다"],"word":"reach","r":{"a":"3) 도달하다","ev":"6번 문장","s":[[6,"These sound waves move through the air until they reach our ears.","이 음파들은 그것들이 우리의 귀에 도달할 때까지 공기를 통해 이동한다."]],"w":"음파가 공기를 지나 우리 귀까지 간다는 말이에요. reach는 '~에 도달하다'예요.","c":3},"h":"f0fc3c4f7c"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is because there is no air in space!","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 우주에 공기가 없기 때문이다!","opts":["영화 속 우주선이 빠르게 움직이는 것","우주 비행사가 무전기를 사용하는 것","우주에서 큰 소리를 들을 수 없다는 것","공상 과학 영화가 인기 있는 것"],"pron":"This","r":{"a":"3) 우주에서 큰 소리를 들을 수 없다는 것","ev":"3~4번 문장","s":[[3,"Interestingly, this would be impossible.","흥미롭게도, 이것은 불가능할 것이다."],[4,"This is because there is no air in space!","이것은 우주에 공기가 없기 때문이다!"]],"w":"3번에서 우주선들이 서로 쏠 때 큰 소리를 듣는 것은 불가능하다고 했고, 4번의 This는 그 내용이에요. 우주에 공기가 없기 때문이라는 말이에요.","c":3,"k":"This = 우주에서 큰 소리를 들을 수 없다는 것"},"h":"e5ad7c7262"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In other words, without air, there is no sound.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다시 말해서, 공기 없이는 소리가 없다.","opts":["다시 말해서, 공기가 없으면 소리가 없다.","다시 말해서, 소리가 없으면 공기도 없다.","그러나 공기가 있으면 소리가 없다.","예를 들어, 공기는 소리보다 더 빠르다."],"r":{"a":"1) 다시 말해서, 공기가 없으면 소리가 없다.","ev":"6~7번 문장","s":[[6,"These sound waves move through the air until they reach our ears.","이 음파들은 그것들이 우리의 귀에 도달할 때까지 공기를 통해 이동한다."],[7,"In other words, without air, there is no sound.","다시 말해서, 공기 없이는 소리가 없다."]],"w":"without air는 '공기 없이'이고 there is no sound는 '소리가 없다'예요. 공기가 원인이고 소리가 결과라서 순서를 바꾸면 안 돼요.","c":1},"h":"09dbb18ee5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["전파는 이동하기 위해 공기가 필요하다.","우주선 안에는 공기가 없다.","전파는 공기 없이도 이동할 수 있다.","음파는 공기 없이도 이동할 수 있다."],"opts":["Radio waves need air to move.","There is no air in the spaceship.","Radio waves can move without air.","Sound waves can move without air."],"r":{"a":"3) Radio waves can move without air. (전파는 공기 없이도 이동할 수 있다.)","ev":"6~7번, 10~11번 문장","s":[[6,"These sound waves move through the air until they reach our ears.","이 음파들은 그것들이 우리의 귀에 도달할 때까지 공기를 통해 이동한다."],[7,"In other words, without air, there is no sound.","다시 말해서, 공기 없이는 소리가 없다."],[10,"Unlike sound waves, radio waves do not need air to move.","음파와는 달리, 전파는 이동하기 위해 공기를 필요로 하지 않는다."],[11,"And inside the spaceship, there is air.","그리고 우주선 안에는 공기가 있다."]],"w":"10번에서 전파는 이동하기 위해 공기가 필요 없다고 해요. 우주선 안에는 공기가 있고(11번), 음파는 공기를 통해 이동해서 공기가 없으면 소리가 없어요(6~7번).","c":3},"h":"e66021094a"},{"n":9,"t":"sum","q":"So the astronauts can (A) each other talk when they are (B).","ko":"그래서 우주 비행사들은 (B)에 있을 때 서로가 이야기하는 것을 (A) 수 있다.","oko":["(A) 볼 / (B) 밖","(A) 들을 / (B) 밖","(A) 들을 / (B) 안","(A) 냄새 맡을 / (B) 안","(A) 냄새 맡을 / (B) 밖"],"opts":["(A) see / (B) outside","(A) hear / (B) outside","(A) hear / (B) inside",  aurora in some areas가 있어요.","c":"T"},"h":"4889c7d190"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These explosions are more powerful than the biggest nuclear bomb.)","ko":"이러한 폭발들은 가장 큰 핵폭탄보다 더 ( ).","opts":["약한","강력한","느린","작은"],"word":"powerful","r":{"a":"2) 강력한","ev":"5번 문장","s":[[5,"These explosions are more powerful than the biggest nuclear bomb.","이러한 폭발들은 가장 큰 핵폭탄보다 더 강력하다."]],"w":"가장 큰 핵폭탄보다 더 ~하다는 비교예요. 폭발의 세기가 더 크다는 말이니 powerful은 '강력한'이에요.","c":2},"h":"51737991c8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They only disturb satellites and communication systems.)","ko":"그것들은 단지 인공위성이나 통신 시스템만을 ( ).","opts":["돕다","만들다","방해하다","찾다"],"word":"disturb","r":{"a":"3) 방해하다","ev":"9번 문장","s":[[9,"They only disturb satellites and communication systems.","그것들은 단지 인공위성이나 통신 시스템만을 방해한다."]],"w":"태양 폭풍이 인공위성과 통신에 하는 일을 말해요. 8번에서 우리가 느끼지 못한다고 했고 9번은 오직 이것들을 방해한다는 말이라서 disturb는 '방해하다'예요.","c":3},"h":"8c22a2c316"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhen they occur, Earth is sometimes affected.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그것들이 발생할 때, 지구는 때때로 영향을 받는다.","opts":["지구의 층들","태양에서의 폭발들","비와 눈","인공위성들"],"r":{"a":"2) 태양에서의 폭발들","ev":"5~6번 문장","s":[[5,"These explosions are more powerful than the biggest nuclear bomb.","이러한 폭발들은 가장 큰 핵폭탄보다 더 강력하다."],[6,"When they occur, Earth is sometimes affected.","그것들이 발생할 때, 지구는 때때로 영향을 받는다."]],"w":"6번 they는 바로 앞 5번의 These explosions예요. 태양에서의 폭발이 일어날 때 지구가 때때로 영향을 받는다는 뜻이에요.","c":2},"h":"9c4f2cd447"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, thanks to a unique layer around Earth, solar storms cannot hit Earth directly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나, 지구 주위의 독특한 층 덕분에, 태양 폭풍은 지구에 직접 타격을 가하지 못한다.","opts":["하지만 지구 주위의 독특한 층 덕분에 태양 폭풍은 지구를 직접 타격하지 못한다.","하지만 지구 주위의 층 때문에 태양 폭풍이 지구를 더 세게 때린다.","하지만 태양 폭풍은 지구 주위의 층을 직접 만든다.","하지만 지구에는 독특한 층이 없어서 태양 폭풍이 직접 닿는다."],"r":{"a":"1) 하지만 지구 주위의 독특한 층 덕분에 태양 폭풍은 지구를 직접 타격하지 못한다.","ev":"7번 문장","s":[[7,"However, thanks to a unique layer around Earth, solar storms cannot hit Earth directly.","그러나, 지구 주위의 독특한 층 덕분에, 태양 폭풍은 지구에 직접 타격을 가하지 못한다."]],"w":"thanks to ~는 '~ 덕분에'예요. 지구 주위의 독특한 층이 보호해 주어서 태양 폭풍이 직접 타격을 가하지 못한다는 뜻이에요.","c":1},"h":"9b7514be41"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["폭풍은 항상 바람 때문에 생긴다.","사람들은 ‘폭풍’이라는 단어를 들으면 아마 비나 눈을 떠올릴 것이다.","사람들은 ‘폭풍’이라는 단어를 들어도 비를 절대 떠올리지 않는다.","‘폭풍’이라는 단어는 태양 폭풍만을 의미한다."],"opts":["A storm is always caused by the wind.","People probably think of rain or snow when they hear the word storm.","People never think of rain when they hear the word storm.","The word storm only means a solar storm."],"r":{"a":"2) People probably think of rain or snow when they hear the word storm. (사람들은 ‘폭풍’이라는 단어를 들으면 아마 비나 눈을 떠올릴 것이다.)","ev":"1번 문장","s":[[1,"When you hear the word “storm,” you probably think of rain or snow.","당신은 ‘폭풍’이라는 단어를 들으면 아마 비나 눈을 떠올릴 것이다."]],"w":"1번 문장에서 ‘폭풍’이라는 단어를 들으면 아마 비나 눈을 떠올릴 것이라고 해요.","c":2},"h":"484f404405"},{"n":9,"t":"sum","q":"Some solar storms even have a (A) (B).","ko":"어떤 태양 폭풍들은 심지어 (A) (B)을(를) 주기도 한다.","oko":["(A) 부정적인 / (B) 폭탄","(A) 긍정적인 / (B) 폭탄","(A) 긍정적인 / (B) 영향","(A) 부정적인 / (B) 층","(A) 조용한 / (B) 영향"],"opts":["(A) negative / (B) bomb","(A) positive / (B) bomb","(A) positive / (B) effect","(A) negative / (B) layer","(A) quiet / (B) effect"],"r":{"a":"3) (A) positive / (B) effect ((A) 긍정적인 / (B) 영향)","ev":"10번 문장","s":[[10,"Some solar storms even have a positive effect.","어떤 태양 폭풍들은 심지어 긍정적인 영향을 주기도 한다."]],"w":"10번 문장에서 어떤 태양 폭풍들은 긍정적인(positive) 영향(effect)을 주기도 한다고 해요.","c":3},"h":"7cb46bfece"},{"n":10,"t":"fill","q":"Solar storms [A] with an explosion on the [B].","ko":"태양 폭풍은 [B]에서의 폭발로 [A].","bank":["start","sun","hit","unique","regular","directly"],"bko":{"start":"시작한다","sun":"태양","unique":"독특한","regular":"일반적인","directly":"직접","hit":"타격을 가하다"},"r":{"a":"[A] start (시작한다), [B] sun (태양)","ev":"4번 문장","s":[[4,"Solar storms start
