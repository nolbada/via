ia, people wrap chicken fried rice with a thin omelet. The name of this special omelet is Nasi Goreng Pattaya. It is also popular in Indonesia and Singapore.","Do you feel hungry now? How about trying an omelet?"];var PASS_KO=["전 세계의 오믈렛","저는 껍데기가 있지만, 게는 아니에요.","저는 노랗고 하얗지만, 데이지 꽃은 아니에요.","저는 올리브보다 더 크지만, 아보카도보다 더 작아요.","저는 무엇일까요?","여러분은 정답을 알고 있나요? 네, 그것은 달걀입니다. 전 세계에는 많은 다양한 달걀 요리가 있습니다. 여러분이 가장 좋아하는 달걀 요리는 무엇인가요? 오믈렛은 어떤가요?","오믈렛은 인기 있는 달걀 요리입니다. 여러분은 그것을 쉽게 만들 수 있습니다. 여러분은 달걀 몇 개를 휘저어 섞고 그것들을 기름에 부칩니다. 그게 다입니다. 여러분은 더 맛있는 오믈렛을 원하나요? 그저 치즈, 채소, 또는 고기를 더해 보세요. 그것은 더 맛있을 것입니다!","오믈렛에 관한 재미있는 이야기가 하나 있습니다. 어느 날, 나폴레옹과 그의 군대가 베시에르 마을 근처에 머물렀습니다. 나폴레옹은 마을에서 만든 오믈렛을 먹어 보았고, 그는 그것을 매우 즐겼습니다. 그는 다음 날 그의 군대를 위해 거대한 오믈렛을 요청했습니다. 오늘날, 베시에르 사람들은 매년 그들의 오믈렛 축제를 위해 거대한 오믈렛을 만듭니다.","전 세계의 사람들은 그들 자신만의 오믈렛 조리법을 가지고 있습니다. Tortilla de Patata(토르티야 데 파타타)는 스페인 오믈렛입니다. 스페인어로 patata는 ‘감자’를 의미합니다. 여러분은 이 오믈렛을 위해 달걀과 감자가 필요합니다. 말레이시아에서 사람들은 닭고기 볶음밥을 얇은 오믈렛으로 감쌉니다. 이 특별한 오믈렛의 이름은 Nasi Goreng Pattaya(나시 고렝 파타야)입니다. 그것은 인도네시아와 싱가포르에서도 인기가 있습니다.","여러분은 지금 배가 고프다고 느끼나요? 오믈렛을 먹어 보는 건 어떤가요?"];var DLG=[["Server","Hello, are you ready to order?","안녕하세요, 주문하시겠어요?"],["Minji","Well, I’d like bibimbap. How about you, Alex?","음, 저는 비빔밥을 먹을게요. 너는 어때, Alex?"],["Alex","Um, I can’t decide. What is bibimbap?","음, 못 정하겠어. 비빔밥이 뭐야?"],["Minji","Bibimbap is a rice dish with various vegetables.","비빔밥은 여러 가지 야채가 들어간 밥 요리야."],["Alex","Well, I don’t like vegetables.","음, 나는 야채를 안 좋아해."],["Server","Then would you like bulgogi? It’s Korean beef barbecue.","그러면 불고기는 어떠세요? 한국식 소고기 바비큐예요."],["Alex","Oh, is it spicy?","아, 그거 매워요?"],["Server","No, it’s not spicy.","아니요, 맵지 않아요."],["Alex","Okay, I’ll try it!","좋아요, 그걸 먹어 볼게요!"],["Minji","Do you want some gimbap, too?","김밥도 좀 먹을래?"],["Alex","No, thanks. Just bulgogi for me.","아니, 괜찮아. 나는 불고기만 먹을래."],["Server","So, one bibimbap and one bulgogi, right?","그럼 비빔밥 하나와 불고기 하나 맞으시죠?"],["Minji","Right. Thank you.","맞아요. 감사합니다."]];var BQ=[{"n":1,"q":"Minji는 무엇을 먹고 싶어 하나요?","o":["
