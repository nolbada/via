<style>
:root{--bg:#f4f6f8;--card:#ffffff;--ink:#14202b;--sub:#566474;--line:#d9e0e7;--g1:#14303f;--g2:#6c1c44}

a.app.g2{border-left-color:var(--g2)}
a.app:active{background:var(--line)}
h2{font-size:14px;color:var(--sub);font-weight:700;margin:26px 0 8px;letter-spacing:.02em}
a.app.mid{border-left-color:#0f766e}
a.app.hi{border-left-color:#c2410c}
a.app span{font-size:13px;font-weight:400;color:var(--sub)}
