s and better nutrition, experts estimate that genes may determine about half of how long we live.","이는 부분적으로 의학의 발전과 더 나은 영양 섭취 덕분이지만, 전문가들은 유전자가 우리가 얼마나 오래 사는지의 약 절반을 결정할 수 있다고 추정한다."]],"w":"2번 문장에서 전문가들은 유전자가 우리가 얼마나 오래 사는지의 약 절반을 결정할 수 있다고 추정해요. 진술문과 같은 내용이에요.","c":"T"},"h":"9f2bb62d5a"},{"n":2,"t":"tf","q":"The first longevity gene was identified in humans in 1998.","ko":"최초의 장수 유전자는 1998년에 인간에게서 확인되었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In 1998, the first longevity gene was identified in fruit flies, with studies showing that flies carrying the gene lived 35 percent longer than those without it.","1998년에 초파리에서 최초의 장수 유전자가 확인되었는데, 연구에 따르면 그 유전자를 지닌 파리들은 그렇지 않은 파리들보다 35퍼센트 더 오래 살았다."]],"w":"4번 문장에서 1998년에 최초의 장수 유전자가 확인된 곳은 인간이 아니라 초파리(fruit flies)예요. 인간에게서 비슷한 유전자를 확인한 것은 2010년이에요(6번).","c":"F"},"h":"bca69faac9"},{"n":3,"t":"tf","q":"The FOXO3 gene exists only in people who are over 100 years old.","ko":"FOXO3 유전자는 100세가 넘은 사람들에게만 존재한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"While everyone has this gene, certain variants of it have been found in long-lived individuals worldwide, especially those over 100 years old.","모든 사람이 이 유전자를 가지고 있지만, 전 세계적으로 장수하는 사람들, 특히 100세가 넘은 사람들에게서 이 유전자의 특정 변이체가 발견되었다."]],"w":"7번 문장에서 모든 사람이 이 유전자를 가지고 있고(everyone has this gene), 장수하는 사람들에게서 발견된 것은 이 유전자의 특정 변이체예요.","c":"F"},"h":"954d3773f6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These flies also exhibited remarkable resilience to environmental stressors…)","ko":"이 파리들은 또한 환경적 스트레스 요인에 대해 놀라운 회복력을 보였다. (exhibit은 보이다)","word":"exhibited","opts":["숨겼다","보였다","잃었다","피했다"],"r":{"a":"2) 보였다","ev":"5번 문장","s":[[5,"These flies also exhibited remarkable resilience to environmental stressors, such as extreme heat and food scarcity.","이 파리들은 또한 극심한 더위와 식량 부족과 같은 환경적 스트레스 요인에 대해 놀라운 회복력을 보였다."]],"w":"5번에서 장수 유전자를 가진 파리가 극심한 더위와 식량 부족을 견디는 놀라운 회복력을 겉으로 드러냈다는 말이에요. exhibit = 보이다, 나타내다예요.","c":2},"h":"6cbdd116d3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…therapies that foster healthy aging and reduce the impact of age-related diseases.)","ko":"…건강한 노화를 촉진하고 노화 관련 질병의 영향을 줄이는 치료법… (foster는 촉진하다)","word":"foster","opts":["방해하다","멈추다","촉진하다","의심하다"],"r":{"a":"3) 촉진하다","ev":"10번 문장","s":[[10,"This discovery offers hope for the development of therapies that foster healthy aging and reduce the impact of age-related diseases.","이 발견은 건강한 노화를 촉진하고 노화 관련 질병의 영향을 줄이는 치료법 개발에 대한 희망을 제공한다."]],"w":"10번의 치료법은 and로 이어진 두 가지 일을 해요. 질병의 영향을 줄이는(reduce) 일과 함께 건강한 노화를 돕는(foster) 일이에요. foster = 촉진하다예요.","c":3},"h":"56023eb49b"},{"n":6,"t":"ref","q":"What does the underlined \"Their\" refer to?\nTheir presence has also been associated with increased resistance to heart disease, stroke, and cancer.","ko":"밑줄 친 Their가 가리키는 것은?","sko":"그것들의 존재는 또한 심장병, 뇌졸중, 암에 대한 저항력 증가와 관련이 있다.","opts":["독일 연구자들","심하게 손상된 세포들","면역 체계","인간 유전자 변이체들"],"r":{"a":"4) 인간 유전자 변이체들","ev":"8~9번 문장","s":[[8,"These human gene variants trigger the release of a protein that promotes cell health by eliminating severely damaged cells and repairing less damaged ones, which strengthens the immune system.","이러한 인간 유전자 변이체는 심하게 손상된 세포를 제거하고 덜 손상된 세포를 복구함으로써 세포 건강을 증진하는 단백질의 방출을 유발하며, 이는 면역 체계를 강화한다."],[9,"Their presence has also been associated with increased resistance to heart disease, stroke, and cancer.","그것들의 존재는 또한 심장병, 뇌졸중, 암에 대한 저항력 증가와 관련이 있다."]],"w":"9번의 Their presence(그것들의 존재)는 8번의 These human gene variants를 받아요. 변이체가 존재하면 심장병·뇌졸중·암에 대한 저항력이 늘어난다는 말이에요.","c":4},"h":"3e9f2560cc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The average global lifespan has doubled in the past century, with people now expected to live over 70 years.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"지난 세기 동안 전 세계 평균 수명은 두 배로 늘어났으며, 이제 사람들은 70년 넘게 살 것으로 예상된다.","opts":["지난 100년 동안 전 세계 평균 수명이 두 배가 되어, 이제 사람들은 70년 넘게 살 것으로 기대된다.","전 세계 평균 수명이 지난 100년간 절반으로 줄어, 이제 70년을 넘기기 어렵다.","지난 100년 동안 평균 수명은 그대로이고, 70년을 넘겨 사는 사람은 거의 없다.","앞으로 100년 뒤에는 평균 수명이 70년의 두 배가 될 것으로 예상된다."],"r":{"a":"1) 지난 100년 동안 전 세계 평균 수명이 두 배가 되어, 이제 사람들은 70년 넘게 살 것으로 기대된다.","ev":"1번 문장","s":[[1,"The average global lifespan has doubled in the past century, with people now expected to live over 70 years.","지난 세기 동안 전 세계 평균 수명은 두 배로 늘어났으며, 이제 사람들은 70년 넘게 살 것으로 예상된다."]],"w":"has doubled in the past century는 '지난 100년 동안 두 배가 되었다'는 뜻이고, 지금 사람들은 70년 넘게 살 것으로 예상된다는 말이에요. 줄었다거나 그대로라는 말, 미래의 일이라는 말은 본문과 달라요.","c":1},"h":"bc9fbf8b03"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 단백질은 면역 체계를 약하게 만든다.","독일 연구자들은 2010년에 초파리에서 최초의 장수 유전자를 찾았다.","그 단백질은 심하게 손상된 세포를 없애고 덜 손상된 세포를 고친다.","의학 발전과 더 나은 영양이 수명 증가를 모두 설명한다."],"opts":["The protein weakens the immune system.","German researchers found the first longevity gene in fruit flies in 2010.","The protein removes severely damaged cells and repairs less damaged ones.","Medical advances and better nutrition explain all of the increase in lifespan."],"r":{"a":"3) The protein removes severely damaged cells and repairs less damaged ones.","ev":"8번 문장","s":[[8,"These human gene variants trigger the release of a protein that promotes cell health by eliminating severely damaged cells and repairing less damaged ones, which strengthens the immune system.","이러한 인간 유전자 변이체는 심하게 손상된 세포를 제거하고 덜 손상된 세포를 복구함으로써 세포 건강을 증진하는 단백질의 방출을 유발하며, 이는 면역 체계를 강화한다."]],"w":"8번에서 변이체가 내보내는 단백질은 심하게 손상된 세포를 제거하고 덜 손상된 세포를 복구하며, 그 결과 면역 체계가 강화돼요. 초파리 유전자는 1998년(4번), 독일 연구자들은 2010년에 인간에게서 확인했고(6번), 수명 증가는 의학·영양이 부분적인 이유(2번)예요.","c":3},"h":"447c318ca6"},{"n":9,"t":"sum","q":"Medical advances and better nutrition have (A) human lifespans, but experts say (B) may determine about half of how long we live.","ko":"의학 발전과 더 나은 영양 섭취가 인간의 수명을 (A)했지만, 전문가들은 (B)이/가 우리가 얼마나 오래 사는지의 약 절반을 결정할 수 있다고 말한다.","oko":["(A) 줄였다 / (B) 의학","(A) 줄였다 / (B) 유전자","(A) 늘렸다 / (B) 의학","(A) 늘렸다 / (B) 스트레스","(A) 늘렸다 / (B) 유전자"],"opts":["(A) shortened / (B) medicine","(A) shortened / (B) genes","(A) lengthened / (B) medicine","(A) lengthened / (B) stress","(A) lengthened / (B) genes"],"r":{"a":"5) (A) lengthened / (B) genes","ev":"1~2번 문장","s":[[1,"The average global lifespan has doubled in the past century, with people now expected to live over 70 years.","지난 세기 동안 전 세계 평균 수명은 두 배로 늘어났으며, 이제 사람들은 70년 넘게 살 것으로 예상된다."],[2,"While this is attributed in part to medical advances and better nutrition, experts estimate that genes may determine about half of how long we live.","이는 부분적으로 의학의 발전과 더 나은 영양 섭취 덕분이지만, 전문가들은 유전자가 우리가 얼마나 오래 사는지의 약 절반을 결정할 수 있다고 추정한다."]],"w":"1번에서 수명이 두 배로 늘었고, 2번에서 이것이 부분적으로 의학과 영양 덕분이지만 전문가들은 유전자가 약 절반을 결정할 수 있다고 추정해요. 의학이나 스트레스가 절반을 결정한다는 말은 없어요.","c":5},"h":"dc9a6022ad"},{"n":10,"t":"fill","q":"This discovery offers hope for therapies that [A] healthy aging and [B] the impact of age-related diseases.","ko":"이 발견은 건강한 노화를 [A]하고 노화 관련 질병의 영향을 [B]하는 치료법에 대한 희망을 제공한다.","bank":["foster","reduce","increase","damage","ignore","lose"],"bko":{"foster":"촉진하다","reduce":"줄이다","increase":"늘리다","damage":"손상하다","ignore":"무시하다","lose":"잃다"},"r":{"a":"[A] foster, [B] reduce","ev":"10번 문장","s":[[10,"This discovery offers hope for the development of therapies that foster healthy aging and reduce the impact of age-related diseases.","이 발견은 건강한 노화를 촉진하고 노화 관련 질병의 영향을 줄이는 치료법 개발에 대한 희망을 제공한다."]],"w":"10번 문장에서 가져왔어요. 치료법이 하는 일은 건강한 노화는 촉진하고(foster) 질병의 영향은 줄이는(reduce) 것이에요. 반대로 질병의 영향을 늘리거나(increase), 건강한 노화를 손상하거나 무시하는 치료법은 '희망'이 될 수 없어요.","c":null},"h":"901da227fe"}]},{"u":3,"id":"ms4-03-3","no":3,"ko":"파리 올림픽 마스코트의 정체","items":[{"n":1,"t":"tf","q":"Paris chose an animal as its Olympic mascot, just like other host cities often did.","ko":"파리는 다른 개최 도시들이 종종 그랬듯이 동물을 올림픽 마스코트로 골랐다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"However, Paris, the host of the 2024 Olympics, selected a hat as the mascot for the Games!","그러나 2024년 올림픽 개최지인 파리는 대회의 마스코트로 모자를 선택했다!"]],"w":"2번 문장 However 뒤에서 파리는 동물이 아니라 모자(a hat)를 마스코트로 골랐다고 해요. 동물을 고르는 것은 1번에 나온 다른 도시들의 이야기예요.","c":"F"},"h":"60f04795e1"},{"n":2,"t":"tf","q":"The mascot Phryge has lively eyes, a friendly smile, and colorful athletic shoes.","ko":"마스코트 프리주는 생기 있는 눈, 친근한 미소, 화려한 운동화를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The mascot, Phryge, is a cone-shaped character with lively eyes, a friendly smile, and colorful athletic shoes.","마스코트인 프리주(Phryge)는 생기 있는 눈, 친근한 미소, 그리고 화려한 운동화를 신은 원뿔 모양의 캐릭터이다."]],"w":"3번 문장에서 프리주는 생기 있는 눈, 친근한 미소, 화려한 운동화를 가진 원뿔 모양 캐릭터라고 해요. 진술문과 같은 내용이에요.","c":"T"},"h":"748ede4329"},{"n":3,"t":"tf","q":"The Olympic Phryge wears a visible prosthetic leg.","ko":"올림픽 프리주는 눈에 띄는 의족을 착용하고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Paris 2024 actually features two Phryges: the Olympic Phryge and the Paralympic Phryge, with the latter wearing a visible prosthetic leg.","2024 파리 올림픽은 사실 두 개의 프리주 캐릭터를 특징으로 하는데, 올림픽 프리주와 패럴림픽 프리주이며, 후자는 눈에 띄는 의족을 착용하고 있다."]],"w":"6번 문장에서 눈에 띄는 의족을 착용한 것은 후자(the latter), 즉 패럴림픽 프리주예요. 올림픽 프리주가 아니에요.","c":"F"},"h":"58f00c5bc4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It depicts the iconic Phrygian cap…)","ko":"그것은 상징적인 프리기아 모자를 묘사한다. (depict는 묘사하다)","word":"depicts","opts":["비판한다","묘사한다","숨긴다","팔아 치운다"],"r":{"a":"2) 묘사한다","ev":"4번 문장","s":[[4,"It depicts the iconic Phrygian cap, which is a soft, cone-shaped hat that has been a powerful symbol of freedom in French history since the Revolution.","그것은 (프랑스) 혁명 이후 프랑스 역사에서 자유의 강력한 상징이 되어 온 부드러운 원뿔 모양의 모자인 프리기아 모자를 묘사한다."]],"w":"4번에서 프리주(마스코트)가 프리기아 모자를 본뜬 모습을 보여 준다는 말이에요. depict = 그려 내다, 묘사하다예요.","c":2},"h":"ba961b30eb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…promote a world where differences are embraced and valued.)","ko":"…차이가 포용되고 가치 있게 여겨지는 세상을 장려한다. (embrace는 포용하다)","word":"embraced","opts":["포용되는","감춰지는","무시되는","금지되는"],"r":{"a":"1) 포용되는","ev":"8번 문장","s":[[8,"The Paralympic Phryge serves as a powerful reminder that the Games celebrate all athletes and promote a world where differences are embraced and valued.","패럴림픽 프리주는 올림픽이 모든 선수를 기념하고 차이가 포용되고 가치 있게 여겨지는 세상을 장려한다는 강력히 상기시키는 역할을 한다."]],"w":"8번에서 and valued(가치 있게 여겨지는)와 짝을 이루는 말이에요. 차이를 감추거나 무시하는 세상이 아니라 받아들이는 세상이라서 embraced = 포용되는이에요.","c":1},"h":"d791019741"},{"n":6,"t":"ref","q":"What does the underlined \"This inclusive design choice\" refer to?\nThis inclusive design choice reflects the Olympic spirit that no one should be excluded based on race, gender, or ability.","ko":"밑줄 친 This inclusive design choice가 가리키는 것은?","sko":"이러한 포용적인 디자인 선택은 인종, 성별, 또는 능력에 근거하여 누구도 배제되어서는 안 된다는 올림픽 정신을 반영한다.","opts":["프리주가 원뿔 모양인 것","프리주가 화려한 운동화를 신은 것","올림픽 마스코트로 동물을 고르는 것","패럴림픽 프리주가 눈에 띄는 의족을 착용한 것"],"r":{"a":"4) 패럴림픽 프리주가 눈에 띄는 의족을 착용한 것","ev":"6~7번 문장","s":[[6,"Paris 2024 actually features two Phryges: the Olympic Phryge and the Paralympic Phryge, with the latter wearing a visible prosthetic leg.","2024 파리 올림픽은 사실 두 개의 프리주 캐릭터를 특징으로 하는데, 올림픽 프리주와 패럴림픽 프리주이며, 후자는 눈에 띄는 의족을 착용하고 있다."],[7,"This inclusive design choice reflects the Olympic spirit that no one should be excluded based on race, gender, or ability.","이러한 포용적인 디자인 선택은 인종, 성별, 또는 능력에 근거하여 누구도 배제되어서는 안 된다는 올림픽 정신을 반영한다."]],"w":"7번의 This inclusive design choice는 바로 앞 6번의 내용, 즉 패럴림픽 프리주가 의족을 착용한 디자인을 받아요. 그 디자인이 누구도 배제하지 않는 올림픽 정신을 반영한다는 말이에요.","c":4},"h":"5f162d0222"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The red cap once worn by revolutionaries in the streets has now taken its place on the Olympic stage before a global audience.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"한때 혁명가들이 거리에서 쓰고 다니던 붉은 모자는 이제 전 세계인의 시선이 모이는 올림픽 무대에서 자신의 자리를 차지하게 되었다.","opts":["거리에서 혁명가들이 쓰던 붉은 모자가 올림픽 때문에 사용이 금지되었다.","올림픽 무대에서 쓰던 붉은 모자를 혁명가들이 거리에서 쓰기 시작했다.","한때 거리에서 혁명가들이 쓰던 붉은 모자가 이제 전 세계가 지켜보는 올림픽 무대에 자리 잡았다.","혁명가들이 올림픽을 보는 관객을 위해 붉은 모자를 새로 만들었다."],"r":{"a":"3) 한때 거리에서 혁명가들이 쓰던 붉은 모자가 이제 전 세계가 지켜보는 올림픽 무대에 자리 잡았다.","ev":"9번 문장","s":[[9,"The red cap once worn by revolutionaries in the streets has now taken its place on the Olympic stage before a global audience.","한때 혁명가들이 거리에서 쓰고 다니던 붉은 모자는 이제 전 세계인의 시선이 모이는 올림픽 무대에서 자신의 자리를 차지하게 되었다."]],"w":"once worn by revolutionaries in the streets는 '한때 거리에서 혁명가들이 쓰던'이고, has now taken its place on the Olympic stage는 '이제 올림픽 무대에 자리 잡았다'예요. 순서가 거꾸로이거나 금지되었다는 말은 본문에 없어요.","c":3},"h":"650c3c17b9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["개최 도시들은 종종 자신의 도시나 나라를 상징하는 동물을 골라 왔다.","개최 도시들은 1968년 이후 대부분 모자를 마스코트로 골라 왔다.","2024 파리 올림픽의 마스코트는 올림픽 프리주 하나뿐이다.","사람들은 인종, 성별, 능력을 이유로 배제될 수 있다."],"opts":["Host cities have often chosen animals that symbolize their city or country.","Host cities have mostly picked hats as their mascots since 1968.","Paris 2024 has only one mascot, the Olympic Phryge.","People can be excluded based on their race, gender, or ability."],"r":{"a":"1) Host cities have often chosen animals that symbolize their city or country.","ev":"1번 문장","s":[[1,"Since 1968, cities hosting the Olympic Games have introduced mascots to represent them, often choosing animals that symbolize the host city or country in a fun and engaging way.","1968년부터 올림픽 개최 도시들은 자신들을 대표하기 위해 마스코트를 도입해 왔으며, 종종 재미있고 흥미로운 방식으로 개최 도시나 국가를 상징하는 동물을 선택했다."]],"w":"1번에서 개최 도시들은 종종 도시나 국가를 상징하는 동물을 골랐다고 해요. 모자는 파리가 처음 고른 특별한 선택이고(2번), 프리주는 두 개이며(6번), 올림픽 정신은 누구도 배제하면 안 된다는 것이에요(7번).","c":1},"h":"a09183f42d"},{"n":9,"t":"sum","q":"The Phryge mascot is based on a cap that stands for (A) in French history, and its inclusive design shows that (B) should be left out of the Games.","ko":"프리주 마스코트는 프랑스 역사에서 (A)을/를 상징하는 모자에 바탕을 두고 있고, 포용적인 디자인은 (B)이/가 올림픽에서 제외되어서는 안 된다는 점을 보여 준다.","oko":["(A) 군사력 / (B) 아무도","(A) 자유 / (B) 모든 선수","(A) 자유 / (B) 아무도","(A) 부 / (B) 우승자만","(A) 전통 / (B) 장애를 가진 선수들"],"opts":["(A) military power / (B) no one","(A) freedom / (B) every athlete","(A) freedom / (B) no one","(A) wealth / (B) only champions","(A) tradition / (B) disabled athletes"],"r":{"a":"3) (A) freedom / (B) no one","ev":"4~5번 문장","s":[[4,"It depicts the iconic Phrygian cap, which is a soft, cone-shaped hat that has been a powerful symbol of freedom in French history since the Revolution.","그것은 (프랑스) 혁명 이후 프랑스 역사에서 자유의 강력한 상징이 되어 온 부드러운 원뿔 모양의 모자인 프리기아 모자를 묘사한다."],[5,"This red cap was worn by revolutionaries during many critical moments in French history and represents liberty, equality, and fraternity—the core values of the French Republic.","이 붉은 모자는 프랑스 역사의 많은 중대한 순간 동안 혁명가들에 의해 착용되었으며, 프랑스 공화국의 핵심 가치인 자유, 평등, 박애를 나타낸다."]],"w":"4번에서 프리기아 모자는 프랑스 역사에서 자유의 상징이고, 5번에서 자유·평등·박애를 나타내요. 포용적인 디자인(7번)은 누구도 배제되어서는 안 된다는 뜻이에요. 모든 선수나 장애를 가진 선수가 제외되어야 한다는 말은 반대예요.","c":3},"h":"71225c9a3b"},{"n":10,"t":"fill","q":"The ideals of [A] and equality that revolutionaries once fought for became [B] into the spirit of the Games.","ko":"혁명가들이 한때 쟁취하고자 했던 [A]와 평등의 이상은 올림픽 정신 속에 [B] 상태가 되었다.","bank":["liberty","woven","prosthetic","excluded","embraced","critical"],"bko":{"liberty":"자유","woven":"스며든","prosthetic":"의족의, 보철의","excluded":"배제된","embraced":"포용된","critical":"중대한"},"r":{"a":"[A] liberty, [B] woven","ev":"10번 문장","s":[[10,"And the ideals of liberty and equality they once fought for became woven into the spirit of the Games, helping define the atmosphere of Paris 2024.","그리고 그들이 한때 쟁취하고자 했던 자유와 평등의 이상은 올림픽 정신 속에 스며들어, 2024년 파리의 분위기를 만들어 냈다."]],"w":"10번 문장에서 가져왔어요. of 뒤에는 평등과 짝을 이루는 명사 liberty(자유)가 오고, became 뒤에는 'woven into'(~ 속에 스며든)가 와요. prosthetic·excluded·critical은 이 문장의 뜻과 맞지 않고, embraced는 'embraced into'로 쓰이지 않아요.","c":null},"h":"54af3f5010"}]},{"u":3,"id":"ms4-03-4","no":4,"ko":"Even the Camera Giant Forgot to Run","items":[{"n":1,"t":"tf","q":"The Red Queen scene appears in Lewis Carroll’s novel Alice Through the Looking-Glass.","ko":"붉은 여왕이 나오는 장면은 루이스 캐럴의 소설 <거울 나라의 앨리스>에 나온다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In Lewis Carroll’s novel Alice Through the Looking-Glass, there is a famous scene involving the Red Queen.","루이스 캐럴의 소설 <거울 나라의 앨리스> 에는 붉은 여왕이 등장하는 유명한 장면이 있다."]],"w":"1번 문장에서 루이스 캐럴의 소설 Alice Through the Looking-Glass에 붉은 여왕이 등장하는 유명한 장면이 있다고 해요.","c":"T"},"h":"8a5b8e25b9"},{"n":2,"t":"tf","q":"According to the passage, a company that is already successful does not need to upgrade its goods and services.","ko":"글에 따르면, 이미 성공한 기업은 상품과 서비스를 업그레이드할 필요가 없다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In other words, a company that does not try to adapt to changing market conditions by upgrading its goods and services, regardless of how successful it is, will eventually fail.","다시 말해, 아무리 성공적이라 할지라도, 상품과 서비스를 업그레이드함으로써 변화하는 시장 상황에 적응하려고 노력하지 않는 기업은 결국 실패할 것이다."]],"w":"5번 문장에서 아무리 성공적이라도(regardless of how successful it is), 상품과 서비스를 업그레이드해 변화에 적응하려 하지 않는 기업은 결국 실패한다고 해요.","c":"F"},"h":"4a89ffa6f8"},{"n":3,"t":"tf","q":"Other companies soon developed and released their own digital cameras.","ko":"다른 회사들은 곧 자신들의 디지털카메라를 개발하고 출시했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"On the other hand, other companies soon developed and released their own digital cameras.","반면에, 다른 회사들은 곧 그들만의 디지털카메라를 개발하고 출시했다."]],"w":"10번 문장에서 다른 회사들이 곧 그들만의 디지털카메라를 개발하고 출시했다고 해요. 코닥이 출시하지 않은 것과 대비되는 내용이에요.","c":"T"},"h":"a92bf50e09"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…Kodak, a company that was founded in 1888 and dominated the camera industry as well as the film industry for years.)","ko":"…1888년에 설립되어 수년 동안 필름 산업뿐만 아니라 카메라 산업도 지배한 회사… (dominate는 지배하다)","word":"dominated","opts":["지배했다","포기했다","광고했다","수리했다"],"r":{"a":"1) 지배했다","ev":"7번 문장","s":[[7,"A famous example of the Red Queen effect is Kodak, a company that was founded in 1888 and dominated the camera industry as well as the film industry for years.","붉은 여왕 효과의 유명한 예는 코닥인데, 이 회사는 1888년에 설립되어 수년 동안 필름 산업뿐만 아니라 카메라 산업도 지배했다."]],"w":"7번에서 코닥은 오랫동안 카메라와 필름 산업에서 가장 힘이 센 회사였어요. 그래서 dominate = 지배하다예요.","c":1},"h":"0e5f3db018"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These new products gained tremendous popularity among the public…)","ko":"이 새로운 제품들은 대중들 사이에서 엄청난 인기를 얻었고… (tremendous는 엄청난)","word":"tremendous","opts":["사소한","불확실한","엄청난","오래된"],"r":{"a":"3) 엄청난","ev":"11번 문장","s":[[11,"These new products gained tremendous popularity among the public, to such an extent that digital cameras came to dominate the camera market.","이 새로운 제품들은 대중들 사이에서 엄청난 인기를 얻었고, 디지털카메라가 카메라 시장을 지배하게 될 정도였다."]],"w":"11번에서 인기가 아주 커서 디지털카메라가 카메라 시장을 지배하게 될 정도였다고 해요. 그래서 tremendous popularity = 엄청난 인기예요.","c":3},"h":"82b875c402"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAs a result, Kodak’s misguided decision led it to declare bankruptcy in 2012.","ko":"밑줄 친 it이 가리키는 것은?","sko":"결과적으로, 코닥의 잘못된 결정은 2012년에 코닥이 파산을 선언하게 했다.","opts":["필름 산업","코닥","디지털카메라","다른 경쟁 회사들"],"r":{"a":"2) 코닥","ev":"12번 문장","s":[[12,"As a result, Kodak’s misguided decision led it to declare bankruptcy in 2012.","결과적으로, 코닥의 잘못된 결정은 2012년에 코닥이 파산을 선언하게 했다."]],"w":"「led + 목적어 + to부정사」에서 it은 파산을 선언하게 된 대상이에요. 잘못된 결정을 한 Kodak이므로 it = Kodak이에요.","c":2},"h":"ebdd2ed7b8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When Alice expresses surprise about remaining in the same spot while running her fastest, the Red Queen tells her that she must run twice as fast to get somewhere else.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"앨리스가 전력 질주를 하는 동안에도 같은 장소에 머물러 있는 것에 대해 놀라움을 표현할 때, 붉은 여왕은 다른 곳으로 가기 위해서는 두 배로 빨리 달려야 한다고 그녀에게 말한다.","opts":["앨리스는 붉은 여왕보다 두 배로 빨리 달려서 다른 곳에 도착한다.","붉은 여왕은 앨리스에게 같은 장소에 머물려면 천천히 달리라고 말한다.","앨리스는 제자리에 있는 것이 놀랍지 않다며 여왕에게 달리는 법을 가르친다.","앨리스가 전력으로 달리는데도 제자리라는 데 놀라자, 붉은 여왕은 다른 곳에 가려면 두 배로 빨리 달려야 한다고 말한다."],"r":{"a":"4) 앨리스가 전력으로 달리는데도 제자리라는 데 놀라자, 붉은 여왕은 다른 곳에 가려면 두 배로 빨리 달려야 한다고 말한다.","ev":"2번 문장","s":[[2,"When Alice expresses surprise about remaining in the same spot while running her fastest, the Red Queen tells her that she must run twice as fast to get somewhere else.","앨리스가 전력 질주를 하는 동안에도 같은 장소에 머물러 있는 것에 대해 놀라움을 표현할 때, 붉은 여왕은 다른 곳으로 가기 위해서는 두 배로 빨리 달려야 한다고 그녀에게 말한다."]],"w":"앨리스는 가장 빨리 달리는데도 같은 곳에 있어서 놀라요(surprise). 여왕은 다른 곳에 가려면 twice as fast, 즉 두 배로 빨리 달리라고 말해요.","c":4},"h":"804493c33b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["한때 성공한 기업은 적응할 필요가 전혀 없다.","의욕 넘치는 경쟁자들은 제품을 계속 개선한다.","코닥의 임원들은 디지털카메라를 시장에 출시하기로 결정했다.","다른 회사들은 자신들의 디지털카메라를 출시하기를 거부했다."],"opts":["A company that was successful once never needs to adapt.","Highly motivated competitors keep improving their products.","Kodak’s executives decided to release the digital camera to the market.","Other companies refused to release their own digital cameras."],"r":{"a":"2) Highly motivated competitors keep improving their products.","ev":"5~6번 문장","s":[[5,"In other words, a company that does not try to adapt to changing market conditions by upgrading its goods and services, regardless of how successful it is, will eventually fail.","다시 말해, 아무리 성공적이라 할지라도, 상품과 서비스를 업그레이드함으로써 변화하는 시장 상황에 적응하려고 노력하지 않는 기업은 결국 실패할 것이다."],[6,"This is because there are highly motivated competitors that are constantly improving their products.","이는 끊임없이 제품을 개선하는 의욕 넘치는 경쟁자들이 있기 때문이다."]],"w":"6번에서 의욕 넘치는 경쟁자들이 끊임없이 제품을 개선한다고 해요. 한때 성공한 기업도 적응하지 않으면 실패하고(5번), 코닥은 출시하지 않기로 했으며(9번), 다른 회사들은 출시했어요(10번).","c":2},"h":"430b49566b"},{"n":9,"t":"sum","q":"Kodak decided not to (A) its digital camera because it feared lower film sales, but other companies did, and Kodak finally went into (B).","ko":"코닥은 필름 판매가 줄까 봐 디지털카메라를 (A)하지 않기로 했지만 다른 회사들은 그렇게 했고, 코닥은 결국 (B)에 이르렀다.","oko":["(A) 출시 / (B) 성공","(A) 베끼기 / (B) 파산","(A) 파괴 / (B) 명성","(A) 출시 / (B) 파산","(A) 할인 / (B) 성장"],"opts":["(A) release / (B) success","(A) copy / (B) bankruptcy","(A) destroy / (B) fame","(A) release / (B) bankruptcy","(A) discount / (B) growth"],"r":{"a":"4) (A) release / (B) bankruptcy","ev":"9번, 12번 문장","s":[[9,"However, Kodak’s executives were concerned that digital cameras might reduce its film sales, so they ultimately decided not to release its invention to the market.","그러나, 코닥의 임원들은 디지털카메라가 필름 판매를 줄일지도 모른다고 우려했고, 그래서 그들은 결국 그 발명품을 시장에 출시하지 않기로 결정했다."],[12,"As a result, Kodak’s misguided decision led it to declare bankruptcy in 2012.","결과적으로, 코닥의 잘못된 결정은 2012년에 코닥이 파산을 선언하게 했다."]],"w":"9번에서 코닥은 디지털카메라가 필름 판매를 줄일까 봐 시장에 출시(release)하지 않기로 했어요. 12번에서 그 잘못된 결정은 2012년 파산(bankruptcy)으로 이어졌어요. 성공이나 명성, 성장은 본문과 반대예요.","c":4},"h":"910337b2e1"},{"n":10,"t":"fill","q":"In the business world, the Red Queen effect means that companies must [A] improve just to survive and make even [B] improvements to achieve further success.","ko":"비즈니스 세계에서 붉은 여왕 효과는 기업이 단지 살아남기 위해서도 [A] 개선해야 하고, 더 큰 성공을 위해서는 훨씬 더 [B] 개선을 해야 한다는 뜻이다.","bank":["constantly","greater","occasionally","smaller","never","hardly"],"bko":{"constantly":"끊임없이","greater":"더 큰","occasionally":"가끔","smaller":"더 작은","never":"결코 ~않는","hardly":"거의 ~않는"},"r":{"a":"[A] constantly, [B] greater","ev":"4번 문장","s":[[4,"In the business world, the Red Queen effect is a phenomenon in which companies must constantly improve just to survive, and they must make even greater improvements to achieve further success.","비즈니스 세계에서, 붉은 여왕 효과는 기업들이 단지 생존하기 위해서 끊임없이 개선해야 하며, 더 큰 성공을 거두기 위해서는 훨씬 더 큰 개선을 해야 한다는 현상이다."]],"w":"4번 문장에서 가져왔어요. 기업은 살아남으려고도 끊임없이(constantly) 개선해야 하고, 성공을 더 이루려면 훨씬 더 큰(greater) 개선을 해야 해요. occasionally·never·hardly는 '계속 개선'과 맞지 않고, smaller는 '더 큰 성공을 위한 개선'과 맞지 않아요.","c":null},"h":"a2f66db1e5"}]},{"u":4,"id":"ms4-04-1","no":1,"ko":"쉿, 근데 다 알잖아~","items":[{"n":1,"t":"tf","q":"The expression “elephant in the room” refers to a serious problem that everyone knows about but no one wants to discuss.","ko":"‘방 안의 코끼리’라는 표현은 모두가 알지만 아무도 이야기하고 싶어 하지 않는 심각한 문제를 가리킨다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The expression “elephant in the room” is used to refer to a serious problem that everyone is aware of but no one wants to talk about because it makes them uncomfortable.","“방 안의 코끼리”라는 표현은 모두가 알고 있지만 그것이 그들을 불편하게 만들기 때문에 아무도 이야기하고 싶어 하지 않는 심각한 문제를 가리키는 데 사용된다."]],"w":"5번 문장에서 모두가 알고 있지만 아무도 이야기하고 싶어 하지 않는 심각한 문제라고 풀이해요. 그대로 일치해요.","c":"T"},"h":"f42eba5cd1"},{"n":2,"t":"tf","q":"According to the passage, ignoring the elephant usually builds more trust in leadership.","ko":"글에 따르면, 코끼리를 무시하는 것은 보통 리더십에 대한 신뢰를 더 쌓는다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"When this happens, some managers choose to take the easy path, that is, ignoring the elephant.","이런 일이 발생할 때, 어떤 관리자들은 쉬운 길, 즉 코끼리를 무시하는 것을 선택한다."],[8,"But it often causes adverse consequences, such as leading to low employee morale and a lack of trust in leadership.","그러나 그것은 종종 낮은 직원 사기와 리더십에 대한 신뢰 부족으로 이어지는 것과 같은 부정적인 결과들을 초래한다."]],"w":"7번에서 코끼리를 무시하는 것은 관리자들이 고르는 쉬운 길이에요. 8번에서 그 결과로 낮은 직원 사기와 리더십에 대한 신뢰 부족이 생긴다고 해요. 신뢰가 쌓이는 것이 아니라 부족해져요.","c":"F"},"h":"af8abe1402"},{"n":3,"t":"tf","q":"The first step in dealing with the elephant is to gather opinions.","ko":"코끼리를 다루는 첫 번째 단계는 의견을 모으는 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"The first step is to acknowledge the issue and raise it with staff members to create an atmosphere in which people feel free to talk openly without fear of criticism.","첫 번째 단계는 사람들이 비판의 두려움 없이 솔직하게 이야기할 수 있는 자유를 느끼는 분위기를 조성하기 위해 그 문제를 인정하고 직원들에게 그것을 제기하는 것이다."],[11,"Next, gather opinions.","다음으로, 의견을 모아라."]],"w":"첫 번째 단계는 10번에서 문제를 인정하고 직원들에게 제기하는 것이에요. 의견을 모으는 것은 11번에서 Next(다음으로)라고 했으니 두 번째 단계예요.","c":"F"},"h":"76d59c2695"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The first step is to acknowledge the issue and raise it with staff members.)","ko":"첫 번째 단계는 그 문제를 인정하고 직원들에게 제기하는 것이다. (acknowledge는 인정하다)","opts":["운반하다","인정하다","반대하다","피하다"],"word":"acknowledge","r":{"a":"2) 인정하다","ev":"10번 문장","s":[[10,"The first step is to acknowledge the issue and raise it with staff members to create an atmosphere in which people feel free to talk openly without fear of criticism.","첫 번째 단계는 사람들이 비판의 두려움 없이 솔직하게 이야기할 수 있는 자유를 느끼는 분위기를 조성하기 위해 그 문제를 인정하고 직원들에게 그것을 제기하는 것이다."]],"w":"10번에서 첫 단계는 문제를 acknowledge한 뒤 직원들에게 꺼내 놓는 것이에요. 문제를 피하거나 반대하면 꺼내 놓을 수 없어요. acknowledge = 인정하다.","c":2},"h":"6fbbe3e4a8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But it often causes adverse consequences, such as leading to low employee morale…)","ko":"그러나 그것은 종종 낮은 직원 사기로 이어지는 것과 같은 부정적인 결과들을 초래한다.","opts":["즉각적인","예상된","부정적인","다양한"],"word":"adverse","r":{"a":"3) 부정적인","ev":"8번 문장","s":[[8,"But it often causes adverse consequences, such as leading to low employee morale and a lack of trust in leadership.","그러나 그것은 종종 낮은 직원 사기와 리더십에 대한 신뢰 부족으로 이어지는 것과 같은 부정적인 결과들을 초래한다."]],"w":"8번의 adverse consequences 뒤에 low employee morale(낮은 직원 사기), a lack of trust(신뢰 부족)가 예로 나와요. 모두 나쁜 결과라서 adverse = 부정적인, 해로운이에요.","c":3},"h":"38967e02ee"},{"n":6,"t":"ref","q":"What does the underlined “their” refer to?\nAffected individuals need to know that their voices are being heard when it comes to finding a resolution.","ko":"밑줄 친 their가 가리키는 것은?","sko":"영향을 받는 개인들은 해결책을 찾는 데 있어 그들의 목소리가 경청되고 있다는 것을 알 필요가 있다.","opts":["어떤 관리자들","주요 고객들","리더십을 맡은 사람들","영향을 받는 개인들"],"r":{"a":"4) 영향을 받는 개인들","ev":"12번 문장","s":[[12,"Affected individuals need to know that their voices are being heard when it comes to finding a resolution.","영향을 받는 개인들은 해결책을 찾는 데 있어 그들의 목소리가 경청되고 있다는 것을 알 필요가 있다."]],"w":"12번의 주어 Affected individuals(영향을 받는 개인들)가 need to know의 주어이고, know의 목적어 안의 their voices도 그 사람들의 목소리예요. 자기 목소리가 경청되고 있음을 알아야 하는 사람들이에요.","c":4},"h":"413f72b714"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“Instead, it is best to deal with the elephant as soon as it makes an appearance.”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"대신에, 코끼리가 나타나자마자 그것을 다루는 것이 최선이다.","opts":["문제가 커진 뒤에 한꺼번에 다루는 것이 가장 낫다.","문제가 모습을 드러내자마자 바로 다루는 것이 가장 좋다.","코끼리가 나타나면 그 자리를 피하는 것이 가장 좋다.","문제가 저절로 사라질 때까지 기다리는 것이 가장 좋다."],"r":{"a":"2) 문제가 모습을 드러내자마자 바로 다루는 것이 가장 좋다.","ev":"9번 문장","s":[[9,"Instead, it is best to deal with the elephant as soon as it makes an appearance.","대신에, 코끼리가 나타나자마자 그것을 다루는 것이 최선이다."]],"w":"as soon as는 ‘~하자마자’, makes an appearance는 ‘나타나다’예요. 문제가 나타나는 즉시 다루라는 뜻이라 ②가 맞아요. 7번의 무시하기와 반대 방향의 권고예요.","c":2},"h":"40d88eaee1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["‘방 안의 코끼리’는 직원들을 겁주는 진짜 동물이다.","첫 번째 단계는 일정을 넣은 세부 계획을 세우는 것이다.","마지막 단계에서는 해결책이 어떻게 실행될지 자세히 설명한다.","직원들의 목소리는 이미 들리고 있으니 의견 수집은 건너뛰어도 된다."],"opts":["The elephant in the room is a real animal that scares employees.","The first step is to make a detailed plan with a timeline.","In the last step, the manager explains in detail how the solution will be carried out.","Gathering opinions can be skipped because staff voices are already heard."],"r":{"a":"3) In the last step, the manager explains in detail how the solution will be carried out.","ev":"10번, 13번 문장","s":[[10,"The first step is to acknowledge the issue and raise it with staff members to create an atmosphere in which people feel free to talk openly without fear of criticism.","첫 번째 단계는 사람들이 비판의 두려움 없이 솔직하게 이야기할 수 있는 자유를 느끼는 분위기를 조성하기 위해 그 문제를 인정하고 직원들에게 그것을 제기하는 것이다."],[13,"Finally, instill confidence by providing a detailed explanation of how the solution will be implemented, making sure to specify the timeline, the intended outcome, and the role of staff members.","마지막으로, 일정, 의도된 결과, 그리고 직원들의 역할을 분명히 명시하면서, 해결책이 어떻게 실행될지에 대한 자세한 설명을 제공함으로써 신뢰를 심어주어라."]],"w":"13번에서 마지막으로 해결책이 어떻게 실행될지 자세히 설명하라고 해요(③). ①은 4번에서 진짜 코끼리가 아니라고 했고, ②의 일정은 첫 단계(10번)가 아니라 마지막 단계(13번)에서 밝히는 내용이에요. ④는 11~12번에서 의견을 모아 목소리가 들리고 있다는 것을 알리라고 했으니 틀려요.","c":3},"h":"e7699e5460"},{"n":9,"t":"sum","q":"A problem that everyone knows about but no one mentions should not be (A) . Managers should (B) it as soon as it appears.","ko":"모두가 알지만 아무도 말하지 않는 문제는 (A)해서는 안 된다. 관리자들은 그것이 나타나자마자 (B)해야 한다.","oko":["(A) 논의된 / (B) 피해야","(A) 무시된 / (B) 숨겨야","(A) 설명된 / (B) 마주해야","(A) 잊혀진 / (B) 피해야","(A) 무시된 / (B) 마주해야"],"opts":["(A) discussed / (B) avoid","(A) ignored / (B) hide","(A) explained / (B) face","(A) forgotten / (B) avoid","(A) ignored / (B) face"],"r":{"a":"5) (A) ignored / (B) face","ev":"8~9번 문장","s":[[8,"But it often causes adverse consequences, such as leading to low employee morale and a lack of trust in leadership.","그러나 그것은 종종 낮은 직원 사기와 리더십에 대한 신뢰 부족으로 이어지는 것과 같은 부정적인 결과들을 초래한다."],[9,"Instead, it is best to deal with the elephant as soon as it makes an appearance.","대신에, 코끼리가 나타나자마자 그것을 다루는 것이 최선이다."]],"w":"8번에서 무시하면 나쁜 결과가 생긴다고 했으니 (A)는 ignored(무시된)예요. 9번에서 나타나자마자 다루라고 했으니 (B)는 face(마주하다)예요. 다른 보기는 (A)나 (B)가 글과 맞지 않아요.","c":5},"h":"2782345b06"},{"n":10,"t":"fill","q":"First, [A] the issue and raise it with staff. Next, gather [B] from them. Finally, explain how the solution will be carried out.","ko":"먼저 그 문제를 [A]하고 직원들에게 제기한다. 다음으로, 그들로부터 [B]을 모은다. 마지막으로 해결책이 어떻게 실행될지 설명한다.","bank":["acknowledge","opinions","ignore","atmosphere","confidence","resolution"],"bko":{"acknowledge":"인정하다","opinions":"의견","ignore":"무시하다","atmosphere":"분위기","confidence":"신뢰","resolution":"해결책"},"r":{"a":"[A] acknowledge, [B] opinions","ev":"10~11번 문장","s":[[10,"The first step is to acknowledge the issue and raise it with staff members to create an atmosphere in which people feel free to talk openly without fear of criticism.","첫 번째 단계는 사람들이 비판의 두려움 없이 솔직하게 이야기할 수 있는 자유를 느끼는 분위기를 조성하기 위해 그 문제를 인정하고 직원들에게 그것을 제기하는 것이다."],[11,"Next, gather opinions.","다음으로, 의견을 모아라."]],"w":"10번의 acknowledge the issue and raise it, 11번의 gather opinions에서 가져왔어요. ignore는 문제를 꺼내 놓는 것과 반대이고, atmosphere·confidence·resolution은 gather의 목적어(의견)로 맞지 않아요.","c":null},"h":"ef48e6c02b"}]},{"u":4,"id":"ms4-04-2","no":2,"ko":"따로 또 같이, 선집의 매력","items":[{"n":1,"t":"tf","q":"The word “anthology” comes from a Greek word that means “flower-gathering.”","ko":"‘anthology’라는 말은 ‘꽃 모으기’를 뜻하는 그리스어에서 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The term comes from the Greek word anthológos, which means “flower-gathering,” a metaphorical reference to the gathering of small poetry verses like flowers in a bouquet.","이 용어는 “꽃 모으기”를 의미하는 그리스어 anthológos에서 유래했는데, 이는 꽃다발 속의 꽃처럼 짧은 시구들을 모으는 것을 은유적으로 가리키는 것이다."]],"w":"4번 문장에서 그리스어 anthológos가 ‘꽃 모으기’를 뜻한다고 해요. 그대로 일치해요.","c":"T"},"h":"27c7dbb788"},{"n":2,"t":"tf","q":"At first, the term “anthology” was used in both the literary world and broadcast media.","ko":"처음에 ‘anthology’라는 용어는 문학계와 방송 매체 모두에서 쓰였다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"It was used only in the literary world to describe a group of written works published together in a single volume.","그것은 문학계에서만 단일 권으로 함께 출판된 글 모음을 묘사하는 데 사용되었다."],[6,"Now, however, it applies to fields such as the visual arts and broadcast media.","그러나 이제 그것은 시각 예술과 방송 매체와 같은 분야에 적용된다."]],"w":"5번에서 처음에는 문학계에서만(only) 쓰였다고 해요. 6번에서 ‘이제’ 시각 예술과 방송 매체까지 넓어졌다고 했으니 처음부터 두 곳에서 쓰인 것이 아니에요.","c":"F"},"h":"a76185f795"},{"n":3,"t":"tf","q":"Directors hesitate to try unusual styles in anthology series because viewers might not return.","ko":"감독들은 시청자가 돌아오지 않을 수 있어서 선집 시리즈에서 독특한 스타일을 시도하기를 망설인다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"They can take greater risks because they know that viewers who do not care for one episode may come back for another one.","그들은 한 에피소드를 좋아하지 않는 시청자들이 다른 에피소드를 위해 돌아올 수 있다는 것을 알기 때문에 더 큰 위험을 감수할 수 있다."],[12,"As a result, directors can try out different storytelling and filming techniques in each episode, and they are free to experiment with unusual styles.","그 결과, 감독들은 각 에피소드에서 색다른 스토리텔링과 촬영 기법을 시도해 볼 수 있고, 독특한 스타일을 자유롭게 실험할 수 있다."]],"w":"11번에서 한 에피소드가 마음에 안 들어도 시청자가 다른 에피소드를 보러 돌아올 수 있다고 알기 때문에 더 큰 위험을 감수할 수 있어요. 12번에서 독특한 스타일을 자유롭게 실험한다고 해요. 망설이는 것이 아니에요.","c":"F"},"h":"241013137d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (a voyage to a literal star in space)","ko":"우주에 있는 실제 별로의 여행 (literal은 문자 그대로의)","opts":["실제의","상상 속의","거대한","차가운"],"word":"literal","r":{"a":"1) 실제의","ev":"2번 문장","s":[[2,"Each person might take a dramatically different approach depending on their interpretation of the topic, focusing alternately on a girl dreaming of pop stardom, a voyage to a literal star in space, or the discovery of a mysterious star-shaped object.","각 사람은 주제에 대한 자신의 해석에 따라 극적으로 다른 접근 방식을 취할 수 있는데, 팝 스타를 꿈꾸는 소녀, 우주에 있는 실제 별로의 여행, 또는 신비한 별 모양 물체의 발견에 번갈아 초점을 맞출 수 있다."]],"w":"2번에서 literal star in space는 팝 스타(pop star)와 달리 우주에 진짜로 있는 별이에요. 그래서 literal = 문자 그대로의, 실제의예요.","c":1},"h":"6a68e3c666"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If the diverse works created by the members of this group were brought together…)","ko":"이 그룹의 구성원들이 만든 다양한 작품들이 합쳐진다면…","opts":["비슷한","오래된","짧은","다양한"],"word":"diverse","r":{"a":"4) 다양한","ev":"2~3번 문장","s":[[2,"Each person might take a dramatically different approach depending on their interpretation of the topic, focusing alternately on a girl dreaming of pop stardom, a voyage to a literal star in space, or the discovery of a mysterious star-shaped object.","각 사람은 주제에 대한 자신의 해석에 따라 극적으로 다른 접근 방식을 취할 수 있는데, 팝 스타를 꿈꾸는 소녀, 우주에 있는 실제 별로의 여행, 또는 신비한 별 모양 물체의 발견에 번갈아 초점을 맞출 수 있다."],[3,"If the diverse works created by the members of this group were brought together into a collection, it would be called an anthology.","만약 이 그룹의 구성원들이 만든 다양한 작품들이 하나의 모음집으로 합쳐진다면, 그것은 선집이라고 불릴 것이다."]],"w":"2번에서 별이라는 같은 주제로도 소녀, 우주 여행, 별 모양 물체처럼 서로 다른 작품이 나와요. 그래서 3번의 diverse works는 ‘다양한 작품들’이에요.","c":4},"h":"4085a11d78"},{"n":6,"t":"ref","q":"What does the underlined “It” refer to?\nIt was used only in the literary world to describe a group of written works published together in a single volume.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 문학계에서만 단일 권으로 함께 출판된 글 모음을 묘사하는 데 사용되었다.","opts":["별이라는 주제","‘선집’이라는 용어","텔레비전 시리즈","그리스의 시인"],"r":{"a":"2) ‘선집’이라는 용어","ev":"4~5번 문장","s":[[4,"The term comes from the Greek word anthológos, which means “flower-gathering,” a metaphorical reference to the gathering of small poetry verses like flowers in a bouquet.","이 용어는 “꽃 모으기”를 의미하는 그리스어 anthológos에서 유래했는데, 이는 꽃다발 속의 꽃처럼 짧은 시구들을 모으는 것을 은유적으로 가리키는 것이다."],[5,"It was used only in the literary world to describe a group of written works published together in a single volume.","그것은 문학계에서만 단일 권으로 함께 출판된 글 모음을 묘사하는 데 사용되었다."]],"w":"4번의 주어 The term(이 용어)이 5번에서 It으로 이어져요. 처음에는 문학계에서만 쓰였다는 것은 ‘선집’이라는 용어의 이야기예요.","c":2},"h":"a95fb8d316"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“With such variety, an anthology series usually attracts a wide audience.”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러한 다양성으로, 선집 시리즈는 보통 폭넓은 시청자를 끌어들인다.","opts":["그런 다양성 때문에, 선집 시리즈는 보통 시청자 수가 크게 줄어든다.","그런 다양성 때문에, 선집 시리즈는 보통 한 가지 취향의 시청자만 끌어들인다.","그런 다양성으로, 선집 시리즈는 보통 폭넓은 시청자를 끌어들인다.","그런 다양성이 없어서, 선집 시리즈는 한 장르만 다룬다."],"r":{"a":"3) 그런 다양성으로, 선집 시리즈는 보통 폭넓은 시청자를 끌어들인다.","ev":"8~9번 문장","s":[[8,"In some cases, the episodes might be from different genres—one might be a comedy, the next a thriller, and so on.","어떤 경우에는, 에피소드들이 다른 장르일 수도 있는데, 하나는 코미디, 다음은 스릴러 등등일 수 있다."],[9,"With such variety, an anthology series usually attracts a wide audience.","그러한 다양성으로, 선집 시리즈는 보통 폭넓은 시청자를 끌어들인다."]],"w":"attract는 ‘끌어들이다’, wide audience는 ‘폭넓은 시청자’예요. 8번의 장르가 다양하기 때문에 다양한 시청자를 끌어들인다는 뜻이에요.","c":3},"h":"b0ef0857f8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["‘선집’이라는 용어는 처음에 텔레비전 시리즈를 위해 쓰였다.","선집 시리즈의 모든 에피소드는 같은 이야기와 같은 등장인물을 다룬다.","감독들은 자유가 제한되어 선집 시리즈를 피한다.","텔레비전 선집 시리즈의 에피소드들은 공통된 주제로 연결된다."],"opts":["The term “anthology” was first used for television series.","Every episode of an anthology series tells the same story with the same characters.","Directors avoid anthology series because their freedom is limited.","The episodes of an anthology television series are connected by a common theme."],"r":{"a":"4) The episodes of an anthology television series are connected by a common theme.","ev":"7번 문장","s":[[7,"In media, one of the most interesting features of an anthology television series is that each episode presents a distinctive story and unique characters that are all connected by a common theme.","미디어에서, 텔레비전 선집 시리즈의 가장 흥미로운 특징 중 하나는 각 에피소드가 공통된 주제로 모두 연결된 독특한 이야기와 고유한 등장인물들을 제시한다는 것이다."]],"w":"7번에서 각 에피소드는 독특한 이야기와 고유한 등장인물을 보여 주지만 모두 공통된 주제로 연결된다고 해요. ①은 5번에서 처음에는 문학계에서만 쓰였고, ②는 에피소드마다 이야기가 다르며, ③은 10번에서 감독들이 창작 자유를 좋아한다고 해서 틀려요.","c":4},"h":"89ebf214ef"},{"n":9,"t":"sum","q":"An anthology gathers (A) works around a shared idea, and anthology television series give directors the (B) to try new styles.","ko":"선집은 공통된 생각 주위에 (A) 작품들을 모으고, 텔레비전 선집 시리즈는 감독들에게 새로운 스타일을 시도할 (B)을 준다.","oko":["(A) 비슷한 / (B) 압박","(A) 다양한 / (B) 의무","(A) 하나뿐인 / (B) 자유","(A) 오래된 / (B) 두려움","(A) 다양한 / (B) 자유"],"opts":["(A) similar / (B) pressure","(A) diverse / (B) duty","(A) single / (B) freedom","(A) old / (B) fear","(A) diverse / (B) freedom"],"r":{"a":"5) (A) diverse / (B) freedom","ev":"3번, 10번, 12번 문장","s":[[3,"If the diverse works created by the members of this group were brought together into a collection, it would be called an anthology.","만약 이 그룹의 구성원들이 만든 다양한 작품들이 하나의 모음집으로 합쳐진다면, 그것은 선집이라고 불릴 것이다."],[10,"Also, many directors like the creative freedom this type of series provides.","또한, 많은 감독은 이런 유형의 시리즈가 제공하는 창의적 자유를 좋아한다."],[12,"As a result, directors can try out different storytelling and filming techniques in each episode, and they are free to experiment with unusual styles.","그 결과, 감독들은 각 에피소드에서 색다른 스토리텔링과 촬영 기법을 시도해 볼 수 있고, 독특한 스타일을 자유롭게 실험할 수 있다."]],"w":"3번에서 선집은 다양한(diverse) 작품들을 모은 것이고, 10번과 12번에서 감독들은 창작의 자유(freedom)를 누리며 독특한 스타일을 실험해요. 다른 보기는 (A)나 (B) 중 하나가 글과 맞지 않아요.","c":5},"h":"4035707f33"},{"n":10,"t":"fill","q":"An anthology series usually attracts a wide [A], since its episodes can differ in genre and offer great [B].","ko":"선집 시리즈는 에피소드의 장르가 다를 수 있고 큰 [B]을 제공하기 때문에 보통 폭넓은 [A]를 끌어들인다.","bank":["audience","variety","genres","theme","directors","risks"],"bko":{"audience":"시청자","variety":"다양성","genres":"장르들","theme":"주제","directors":"감독들","risks":"위험들"},"r":{"a":"[A] audience, [B] variety","ev":"8~9번 문장","s":[[8,"In some cases, the episodes might be from different genres—one might be a comedy, the next a thriller, and so on.","어떤 경우에는, 에피소드들이 다른 장르일 수도 있는데, 하나는 코미디, 다음은 스릴러 등등일 수 있다."],[9,"With such variety, an anthology series usually attracts a wide audience.","그러한 다양성으로, 선집 시리즈는 보통 폭넓은 시청자를 끌어들인다."]],"w":"8번에서 에피소드가 다른 장르일 수 있고, 9번에서 그런 다양성(variety)으로 폭넓은 시청자(audience)를 끌어들인다고 해요. 두 낱말을 서로 바꾸면 뜻이 통하지 않고, 나머지는 문장 흐름과 맞지 않아요.","c":null},"h":"fbc30031e0"}]},{"u":4,"id":"ms4-04-3","no":3,"ko":"어둠 속에서도 세상을 꿰뚫어 보는 눈","items":[{"n":1,"t":"tf","q":"LiDAR measures how long each laser pulse takes to bounce back.","ko":"LiDAR는 각 레이저 펄스가 되돌아오는 데 걸리는 시간을 측정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It does this by emitting rapid pulses of laser light and timing how long each pulse takes to bounce back.","그것은 레이저 빛의 빠른 펄스를 방출하고 각 펄스가 되돌아오는 데 걸리는 시간을 측정함으로써 이것을 수행한다."]],"w":"2번 문장에서 레이저 빛의 펄스를 쏘고 각 펄스가 되돌아오는 데 걸리는 시간을 잰다고 해요. 그대로 일치해요.","c":"T"},"h":"13cc6a18a9"},{"n":2,"t":"tf","q":"LiDAR sensors work well only in bright sunlight.","ko":"LiDAR 센서는 밝은 햇빛 아래에서만 잘 작동한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"LiDAR sensors operate as effectively in bright sunlight as in total darkness, and in large, cluttered, or constantly changing environments.","LiDAR 센서들은 완전한 어둠 속에서만큼이나 밝은 햇빛 아래에서도, 그리고 크고 어수선하거나 끊임없이 변화하는 환경에서도 효과적으로 작동한다."]],"w":"6번에서 LiDAR 센서는 완전한 어둠 속에서만큼이나 밝은 햇빛 아래에서도 효과적으로 작동한다고 해요. 햇빛에서만 잘 된다는 말은 틀려요.","c":"F"},"h":"301bc36448"},{"n":3,"t":"tf","q":"Airborne LiDAR can detect the shape of the ground even through leaf cover.","ko":"항공 LiDAR는 잎 덮개를 통과해서도 지면의 윤곽을 감지할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Airborne LiDAR maps landscapes from above, detecting contours through leaf cover and supporting practical work in forestry, flood-risk modeling, and archaeology, where hidden patterns can appear after the “noise” of plants is digitally removed.","항공 LiDAR는 상공에서 지형을 지도로 나타내며, 잎 덮개를 투과하여 윤곽을 감지하고, 임업, 홍수 위험 모델링, 고고학 분야의 실무를 지원하는데, 그 분야들에서는 식물의 ‘노이즈’가 디지털 방식으로 제거된 후 숨겨진 패턴이 드러날 수 있다."]],"w":"9번에서 항공 LiDAR가 상공에서 지형을 지도로 나타내며 잎 덮개를 통해 윤곽을 감지한다고 해요. 일치해요.","c":"T"},"h":"ed7933d6bf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…in large, cluttered, or constantly changing environments.)","ko":"크고, 어수선하거나, 끊임없이 변화하는 환경에서도…","opts":["텅 빈","어수선한","밝은","차가운"],"word":"cluttered","r":{"a":"2) 어수선한","ev":"6번 문장","s":[[6,"LiDAR sensors operate as effectively in bright sunlight as in total darkness, and in large, cluttered, or constantly changing environments.","LiDAR 센서들은 완전한 어둠 속에서만큼이나 밝은 햇빛 아래에서도, 그리고 크고 어수선하거나 끊임없이 변화하는 환경에서도 효과적으로 작동한다."]],"w":"6번에서 cluttered는 large(큰), constantly changing(끊임없이 변하는)과 나란히 나오는, 다루기 까다로운 환경이에요. 물건이 많이 널려 있어 정돈되지 않은 모습이라 cluttered = 어수선한이에요.","c":2},"h":"5ae9eeb349"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In recent years, LiDAR has also been deployed on autonomous vehicles…)","ko":"최근 몇 년 동안, LiDAR는 또한 자율 주행 차량에 배치되었다.","opts":["수리된","금지된","배치된","수출된"],"word":"deployed","r":{"a":"3) 배치된","ev":"10번 문장","s":[[10,"In recent years, LiDAR has also been deployed on autonomous vehicles to scan for objects and estimate distances in real time.","최근 몇 년 동안, LiDAR는 또한 물체를 탐색하고 실시간으로 거리를 추정하기 위해 자율 주행 차량에 배치되었다."]],"w":"10번에서 LiDAR를 자율 주행 차량에 달아 물체를 탐색하고 거리를 재요. 쓰이도록 자리 잡아 둔다는 뜻이라 deploy = 배치하다예요.","c":3},"h":"4887bd1e2f"},{"n":6,"t":"ref","q":"What does the underlined “their” refer to?\nPerformance can drop in heavy rain, fog, or snow because the laser pulses can scatter before reaching their target.","ko":"밑줄 친 their가 가리키는 것은?","sko":"레이저 펄스가 목표물에 도달하기 전에 흩어질 수 있기 때문에 폭우, 안개, 또는 눈 속에서는 성능이 떨어질 수 있다.","opts":["레이저 펄스들","폭우와 안개","연구자들","스마트폰 센서들"],"r":{"a":"1) 레이저 펄스들","ev":"13번 문장","s":[[13,"Performance can drop in heavy rain, fog, or snow because the laser pulses can scatter before reaching their target.","레이저 펄스가 목표물에 도달하기 전에 흩어질 수 있기 때문에 폭우, 안개, 또는 눈 속에서는 성능이 떨어질 수 있다."]],"w":"reaching의 주체는 바로 앞의 the laser pulses(레이저 펄스들)이고, their target은 그 펄스들이 도달하려는 목표물이에요. 그래서 their = 레이저 펄스들이에요.","c":1},"h":"23d8410846"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“Still, LiDAR is not without drawbacks.”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래도, LiDAR에 결점이 없는 것은 아니다.","opts":["그래도 LiDAR는 아무 결점도 없는 완벽한 기술이다.","그래도 LiDAR는 결점 때문에 더는 쓰이지 않는다.","그래도 LiDAR는 결점을 모두 해결했다.","그래도 LiDAR에 결점이 없는 것은 아니다."],"r":{"a":"4) 그래도 LiDAR에 결점이 없는 것은 아니다.","ev":"12번 문장","s":[[12,"Still, LiDAR is not without drawbacks.","여전히, LiDAR에 결점이 없는 것은 아니다."]],"w":"not without drawbacks는 ‘결점이 없지 않다’, 즉 ‘결점이 있다’는 이중 부정이에요. 12번 뒤 13~14번에서 실제로 약점이 나와요.","c":4},"h":"3c03c2f1ce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["LiDAR는 레이저가 발명되기 전에 만들어졌다.","LiDAR는 스마트폰에 쓰일 수 없다.","LiDAR의 성능은 폭우, 안개, 눈 속에서 떨어질 수 있다.","LiDAR는 최근에서야 대기 연구에 쓰이기 시작했다."],"opts":["LiDAR was invented before lasers existed.","LiDAR cannot be used in smartphones.","LiDAR performance can drop in heavy rain, fog, or snow.","LiDAR was used for atmospheric research only recently."],"r":{"a":"3) LiDAR performance can drop in heavy rain, fog, or snow.","ev":"4번, 7번, 11번, 13번 문장","s":[[4,"The idea for LiDAR was developed in the United States in the 1960s, soon after lasers were invented.","LiDAR에 대한 아이디어는 레이저가 발명된 직후인 1960년대 미국에서 개발되었다."],[7,"Initially, it was used for tracking targets and studying the atmosphere.","처음에, 그것은 목표물을 추적하고 대기를 연구하는 데 사용되었다."],[11,"Some smartphones also contain LiDAR sensors that improve camera functions such as focusing or depth effects.","일부 스마트폰 또한 초점이나 깊이 효과와 같은 카메라 기능을 향상하는 LiDAR 센서를 포함한다."],[13,"Performance can drop in heavy rain, fog, or snow because the laser pulses can scatter before reaching their target.","레이저 펄스가 목표물에 도달하기 전에 흩어질 수 있기 때문에 폭우, 안개, 또는 눈 속에서는 성능이 떨어질 수 있다."]],"w":"13번에서 폭우, 안개, 눈에서 성능이 떨어질 수 있다고 해요. ①은 4번에서 레이저가 발명된 직후에 개발됐다고 했고, ②는 11번에서 일부 스마트폰에 LiDAR 센서가 있다고 했으며, ④는 7번에서 처음(Initially)부터 대기 연구에 쓰였다고 해서 틀려요.","c":3},"h":"35b2d15133"},{"n":9,"t":"sum","q":"LiDAR sends laser (A) and measures their return time to build 3D images, and it works reliably in many (B).","ko":"LiDAR는 레이저 (A)을 쏘고 되돌아오는 시간을 재서 3D 이미지를 만들며, 많은 (B)에서 믿을 만하게 작동한다.","oko":["(A) 사진 / (B) 환경","(A) 소리 / (B) 계절","(A) 펄스 / (B) 가격","(A) 카메라 / (B) 색깔","(A) 펄스 / (B) 환경"],"opts":["(A) photographs / (B) conditions","(A) sounds / (B) seasons","(A) pulses / (B) prices","(A) cameras / (B) colors","(A) pulses / (B) conditions"],"r":{"a":"5) (A) pulses / (B) conditions","ev":"2번, 3번, 5번, 6번 문장","s":[[2,"It does this by emitting rapid pulses of laser light and timing how long each pulse takes to bounce back.","그것은 레이저 빛의 빠른 펄스를 방출하고 각 펄스가 되돌아오는 데 걸리는 시간을 측정함으로써 이것을 수행한다."],[3,"From these measurements, LiDAR (Light Detection and Ranging) builds a dense cloud of points that renders detailed 3D images of a place and the objects inside it.","이러한 측정값들로부터, LiDAR(라이다, 빛 탐지 및 거리 측정)는 장소와 그 안의 물체들에 대한 상세한 3D 이미지를 만드는 빽빽한 점들의 구름을 구축한다."],[5,"Its main strength is its reliability across conditions that challenge ordinary cameras.","그것의 주요 강점은 일반 카메라를 애먹이는 조건 전반에 걸친 신뢰성이다."],[6,"LiDAR sensors operate as effectively in bright sunlight as in total darkness, and in large, cluttered, or constantly changing environments.","LiDAR 센서들은 완전한 어둠 속에서만큼이나 밝은 햇빛 아래에서도, 그리고 크고 어수선하거나 끊임없이 변화하는 환경에서도 효과적으로 작동한다."]],"w":"2~3번에서 레이저 빛의 펄스(pulses)를 쏘고 되돌아오는 시간으로 3D 이미지를 만들어요. 5~6번에서 밝은 햇빛, 어둠, 어수선하거나 변하는 환경 등 여러 조건(conditions)에서 믿을 만하다고 해요. 다른 보기는 글과 맞지 않아요.","c":5},"h":"2daf29a0f3"},{"n":10,"t":"fill","q":"As LiDAR becomes smaller and [A], researchers expect it to [B] smarter navigation, precise mapping, and 3D perception.","ko":"LiDAR가 더 작아지고 [A]해짐에 따라, 연구자들은 그것이 더 스마트한 내비게이션, 정밀한 지도 제작, 3차원 인식을 [B]하기를 기대한다.","bank":["cheaper","enable","huge","scan","estimate","track"],"bko":{"cheaper":"더 저렴한","enable":"가능하게 하다","huge":"방대한","scan":"탐색하다","estimate":"추정하다","track":"추적하다"},"r":{"a":"[A] cheaper, [B] enable","ev":"15번 문장","s":[[15,"As LiDAR becomes smaller and cheaper, researchers expect it to enable smarter navigation, precise mapping, and 3D perception.","LiDAR가 더 작아지고 저렴해짐에 따라, 연구자들은 그것이 더 스마트한 내비게이션, 정밀한 지도 제작, 그리고 3차원 인식을 가능하게 하기를 기대한다."]],"w":"15번에서 smaller and cheaper(더 작고 저렴해짐), expect it to enable(가능하게 하기를 기대한다)로 나와요. huge는 14번의 데이터양 설명이라 smaller와 어울리지 않고, scan·estimate·track은 뒤의 navigation, mapping, perception과 이어지는 동사로 맞지 않아요.","c":null},"h":"3c0ede19e9"}]},{"u":4,"id":"ms4-04-4","no":4,"ko":"Once Trapped, Now Wrapped","items":[{"n":1,"t":"tf","q":"Over 650,000 marine animals are killed by ghost gear each year.","ko":"매년 65만 마리 이상의 해양 동물이 유령 장비로 인해 죽임을 당한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Over 650,000 marine animals are killed by this form of pollution each year.","매년 65만 마리 이상의 해양 동물이 이러한 형태의 오염으로 인해 죽임을 당한다."]],"w":"2번에서 this form of pollution(유령 장비라는 오염의 한 형태)으로 해마다 65만 마리 이상의 해양 동물이 죽는다고 해요. 일치해요.","c":"T"},"h":"f0d82d7f62"},{"n":2,"t":"tf","q":"Bureo turns old nets into NetPlus at a facility in Argentina.","ko":"Bureo는 아르헨티나에 있는 시설에서 낡은 그물을 NetPlus로 바꾼다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"The processed materials are then transported to a facility in Chile.","가공된 재료들은 그다음에 칠레에 있는 시설로 운송된다."],[9,"There, they are transformed into NetPlus, the 100 percent recycled plastic that is used to make Bureo merchandise.","그곳에서, 그것들은 Bureo 상품을 만드는 데 사용되는 100% 재활용 플라스틱인 NetPlus로 변형된다."]],"w":"8번에서 가공된 재료는 칠레(Chile)에 있는 시설로 운송되고, 9번에서 거기서 NetPlus로 바뀐다고 해요. 아르헨티나가 아니에요.","c":"F"},"h":"9084c5026d"},{"n":3,"t":"tf","q":"Bureo was founded by three surfers.","ko":"Bureo는 세 명의 서퍼에 의해 설립되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Founded by three surfers—Ben Kneppers, David Stover, and Kevin Ahearn—Bureo produces skateboards, sunglasses, and clothing from recycled fishing gear.","세 명의 서퍼 Ben Kneppers, David Stover, Kevin Ahearn에 의해 설립된 Bureo는 재활용된 낚시 장비로 스케이트보드, 선글라스, 그리고 의류를 생산한다."]],"w":"6번에서 Bureo는 세 명의 서퍼 Ben Kneppers, David Stover, Kevin Ahearn에 의해 설립되었다고 해요. 일치해요.","c":"T"},"h":"d91c252070"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…local workers are employed to sort and sanitize them.)","ko":"현지 노동자들이 그것들을 분류하고 세척하기 위해 고용된다.","opts":["운반하다","세척하다","판매하다","폐기하다"],"word":"sanitize","r":{"a":"2) 세척하다","ev":"7번 문장","s":[[7,"The production process goes as follows: initially, the old nets are purchased directly from fishers in countries throughout Central and South America, and local workers are employed to sort and sanitize them.","생산 과정은 다음과 같은데, 처음에, 낡은 그물들은 중남미 전역의 국가들에 있는 어부들로부터 직접 구매되며, 현지 노동자들이 그것들을 분류하고 세척하기 위해 고용된다."]],"w":"7번에서 어부들에게서 산 낡은 그물을 분류(sort)하고 sanitize해요. 그 뒤 8번에서 가공된 재료(processed materials)로 운송되니, 그물을 깨끗이 처리하는 단계예요. sanitize = 세척하다.","c":2},"h":"8f53e4432e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…a company called Bureo has developed an innovative solution.)","ko":"Bureo라고 불리는 회사는 혁신적인 해결책을 개발했다.","opts":["오래된","위험한","혁신적인","불필요한"],"word":"innovative","r":{"a":"3) 혁신적인","ev":"5번 문장","s":[[5,"To help address this ecological crisis, a company called Bureo has developed an innovative solution.","이러한 생태학적 위기를 해결하는 것을 돕기 위해, Bureo라고 불리는 회사는 혁신적인 해결책을 개발했다."]],"w":"5번은 생태학적 위기를 해결하려고 Bureo가 새로 개발한 해결책이에요. 새로운 방법으로 문제를 푼다는 뜻이라 innovative = 혁신적인이에요.","c":3},"h":"97ca7129f3"},{"n":6,"t":"ref","q":"What does the underlined “There” refer to?\nThere, they are transformed into NetPlus, the 100 percent recycled plastic that is used to make Bureo merchandise.","ko":"밑줄 친 There가 가리키는 곳은?","sko":"그곳에서, 그것들은 Bureo 상품을 만드는 데 사용되는 100% 재활용 플라스틱인 NetPlus로 변형된다.","opts":["칠레에 있는 시설","중남미의 어촌","바닷속 그물 안","Bureo의 스케이트보드 가게"],"r":{"a":"1) 칠레에 있는 시설","ev":"8~9번 문장","s":[[8,"The processed materials are then transported to a facility in Chile.","가공된 재료들은 그다음에 칠레에 있는 시설로 운송된다."],[9,"There, they are transformed into NetPlus, the 100 percent recycled plastic that is used to make Bureo merchandise.","그곳에서, 그것들은 Bureo 상품을 만드는 데 사용되는 100% 재활용 플라스틱인 NetPlus로 변형된다."]],"w":"There는 바로 앞 8번에서 가공된 재료가 운송된 곳, 즉 칠레에 있는 시설(a facility in Chile)이에요. 그 시설에서 NetPlus가 만들어져요.","c":1},"h":"4fd34eddc6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“It goes without saying that many marine animals have been saved from mortal danger!”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"많은 해양 동물이 치명적인 위험으로부터 구해졌다는 것은 말할 필요도 없다!","opts":["많은 해양 동물이 구조될 수 없다는 것은 말할 필요도 없다.","해양 동물을 구하는 일은 말로만 가능하다.","해양 동물이 치명적인 위험에 빠졌다는 이야기는 하지 않아도 된다.","많은 해양 동물이 치명적인 위험에서 구해졌다는 것은 말할 필요도 없다."],"r":{"a":"4) 많은 해양 동물이 치명적인 위험에서 구해졌다는 것은 말할 필요도 없다.","ev":"10~11번 문장","s":[[10,"Thanks to Bureo’s efforts, over 6,000 tonnes of abandoned fishing nets have been transformed into eco-friendly products since 2015.","Bureo의 노력 덕분에, 2015년 이후로 6,000 톤 이상의 버려진 그물들이 친환경 제품으로 바뀌었다."],[11,"It goes without saying that many marine animals have been saved from mortal danger!","많은 해양 동물이 치명적인 위험으로부터 구해졌다는 것은 말할 필요도 없다!"]],"w":"It goes without saying that ~은 ‘~은 말할 필요도 없다’예요. have been saved는 ‘구해졌다’는 현재완료 수동이고, 10번에서 6,000톤이 넘는 그물이 친환경 제품이 되었으니 많은 동물이 구해졌다는 뜻이에요.","c":4},"h":"ac0289dbca"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Bureo는 중남미의 어부들에게 낡은 그물을 판매한다.","Bureo의 제품은 100% 재활용 플라스틱인 NetPlus로 만든다.","모든 유령 장비는 해양 동물에게 똑같이 해가 없다.","Bureo는 2015년 이후 600톤보다 적은 그물을 재활용했다."],"opts":["Bureo sells old nets to fishers in Central and South America.","Bureo’s merchandise is made from NetPlus, which is 100 percent recycled plastic.","All ghost gear is equally harmless to sea animals.","Bureo has recycled fewer than 600 tonnes of nets since 2015."],"r":{"a":"2) Bureo’s merchandise is made from NetPlus, which is 100 percent recycled plastic.","ev":"3번, 7번, 9번, 10번 문장","s":[[3,"Among various types of ghost gear, discarded fishing nets are particularly dangerous.","다양한 종류의 유령 장비 중에서, 버려진 그물은 특히 위험하다."],[7,"The production process goes as follows: initially, the old nets are purchased directly from fishers in countries throughout Central and South America, and local workers are employed to sort and sanitize them.","생산 과정은 다음과 같은데, 처음에, 낡은 그물들은 중남미 전역의 국가들에 있는 어부들로부터 직접 구매되며, 현지 노동자들이 그것들을 분류하고 세척하기 위해 고용된다."],[9,"There, they are transformed into NetPlus, the 100 percent recycled plastic that is used to make Bureo merchandise.","그곳에서, 그것들은 Bureo 상품을 만드는 데 사용되는 100% 재활용 플라스틱인 NetPlus로 변형된다."],[10,"Thanks to Bureo’s efforts, over 6,000 tonnes of abandoned fishing nets have been transformed into eco-friendly products since 2015.","Bureo의 노력 덕분에, 2015년 이후로 6,000 톤 이상의 버려진 그물들이 친환경 제품으로 바뀌었다."]],"w":"9번에서 NetPlus는 Bureo 상품을 만드는 데 쓰이는 100% 재활용 플라스틱이라고 해요. ①은 7번에서 Bureo가 어부들에게서 그물을 사요. ③은 3번에서 버려진 그물이 특히 위험하다고 하고, ④는 10번에서 6,000톤이 넘는다고 해서 틀려요.","c":2},"h":"68c05d2e1f"},{"n":9,"t":"sum","q":"Bureo (A) discarded fishing nets from fishers and turns them into NetPlus, a recycled plastic used for (B) products.","ko":"Bureo는 어부들에게서 버려진 그물을 (A)하고 이를 재활용 플라스틱인 NetPlus로 바꿔 (B) 제품을 만든다.","oko":["(A) 판매 / (B) 해로운","(A) 태워 없애 / (B) 친환경","(A) 구매 / (B) 해로운","(A) 판매 / (B) 친환경","(A) 구매 / (B) 친환경"],"opts":["(A) sells / (B) harmful","(A) burns / (B) eco-friendly","(A) buys / (B) harmful","(A) sells / (B) eco-friendly","(A) buys / (B) eco-friendly"],"r":{"a":"5) (A) buys / (B) eco-friendly","ev":"7번, 9번, 10번 문장","s":[[7,"The production process goes as follows: initially, the old nets are purchased directly from fishers in countries throughout Central and South America, and local workers are employed to sort and sanitize them.","생산 과정은 다음과 같은데, 처음에, 낡은 그물들은 중남미 전역의 국가들에 있는 어부들로부터 직접 구매되며, 현지 노동자들이 그것들을 분류하고 세척하기 위해 고용된다."],[9,"There, they are transformed into NetPlus, the 100 percent recycled plastic that is used to make Bureo merchandise.","그곳에서, 그것들은 Bureo 상품을 만드는 데 사용되는 100% 재활용 플라스틱인 NetPlus로 변형된다."],[10,"Thanks to Bureo’s efforts, over 6,000 tonnes of abandoned fishing nets have been transformed into eco-friendly products since 2015.","Bureo의 노력 덕분에, 2015년 이후로 6,000 톤 이상의 버려진 그물들이 친환경 제품으로 바뀌었다."]],"w":"7번에서 낡은 그물은 어부들에게서 직접 구매(buy)되고, 9번에서 NetPlus로 변형되어 10번에서 친환경(eco-friendly) 제품이 돼요. 판매하거나 태워 없애거나 해로운 제품이라는 말은 글에 없어요.","c":5},"h":"2178b28390"},{"n":10,"t":"fill","q":"Ghost gear [A] many lives in the ocean, but Bureo turns old nets into [B] products.","ko":"유령 장비는 바다의 많은 생명을 [A]하지만, Bureo는 낡은 그물을 [B] 제품으로 바꾼다.","bank":["threatens","eco-friendly","protects","harmful","purchases","sanitize"],"bko":{"threatens":"위협한다","eco-friendly":"친환경적인","protects":"보호한다","harmful":"해로운","purchases":"구매한다","sanitize":"세척하다"},"r":{"a":"[A] threatens, [B] eco-friendly","ev":"1번, 10번 문장","s":[[1,"Abandoned fishing equipment—also known as ghost gear—threatens many lives in the ocean.","버려진 낚시 장비, 즉 유령 장비라고도 불리는 장비는 바다의 많은 생명을 위협한다."],[10,"Thanks to Bureo’s efforts, over 6,000 tonnes of abandoned fishing nets have been transformed into eco-friendly products since 2015.","Bureo의 노력 덕분에, 2015년 이후로 6,000 톤 이상의 버려진 그물들이 친환경 제품으로 바뀌었다."]],"w":"1번의 ghost gear threatens many lives, 10번의 eco-friendly products에서 가져왔어요. protects는 유령 장비의 해를 거꾸로 말하고, harmful은 Bureo의 제품이 친환경이라는 10번과 반대예요. purchases·sanitize는 이 빈칸 문장에 알맞지 않아요.","c":null},"h":"046492da55"}]},{"u":5,"id":"ms4-05-1","no":1,"ko":"웃는 게 웃는 게 아니야","items":[{"n":1,"t":"tf","q":"People with Chronic Laughter Syndrome laugh only when something funny happens.","ko":"만성 웃음 증후군 환자는 웃긴 일이 생길 때만 웃는다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Chronic Laughter Syndrome, medically referred to as Pseudobulbar Affect (PBA), is a neurological condition characterized by uncontrollable episodes of laughter without appropriate stimuli or context.","의학적으로 감정실금이라고 불리는 만성 웃음 증후군은 적절한 자극이나 맥락 없이 통제할 수 없는 웃음 발작이 특징인 신경학적 질환이다."]],"w":"3번 문장에서 이 병의 웃음은 적절한 자극이나 맥락이 없는데도 통제할 수 없이 터지는 발작이라고 해요. 웃긴 일이 있을 때만 웃는다는 말은 반대예요.","c":"F"},"h":"b4c0244230"},{"n":2,"t":"tf","q":"Patients may change rapidly between laughter and crying.","ko":"환자들은 웃음과 울음 사이를 빠르게 오갈 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"These episodes are often exaggerated in intensity and duration, with patients frequently reporting rapid transitions between laughter and crying.","이러한 발작은 종종 강도와 지속 시간이 과장되어 나타나며, 환자들은 웃음과 울음 사이의 급격한 전환을 자주 보고한다."]],"w":"4번 문장에서 환자들이 웃음과 울음 사이의 급격한 전환(rapid transitions)을 자주 보고한다고 해요.","c":"T"},"h":"4a2dc5f507"},{"n":3,"t":"tf","q":"Experts have found the exact cause of PBA.","ko":"전문가들은 PBA의 정확한 원인을 밝혀냈다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"While the exact cause of PBA is still unknown, experts believe the disorder represents a disruption in emotional regulation that stems from damage to the neural pathways between the cerebral cortex and cerebellum.","PBA의 정확한 원인은 아직 알려지지 않았지만, 전문가들은 이 장애가 대뇌 피질과 소뇌 사이의 신경 경로 손상에서 기인하는 감정 조절의 붕괴를 나타낸다고 믿는다."]],"w":"6번 문장에서 PBA의 정확한 원인은 아직 알려지지 않았다(still unknown)고 하고, 전문가들은 신경 경로 손상 때문이라고 '믿을' 뿐이에요.","c":"F"},"h":"5e048ef5c2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These episodes are often exaggerated in intensity and duration, ...)","ko":"이러한 발작은 종종 강도와 지속 시간이 과장되어 나타나며, ... (exaggerate는 과장하다)","opts":["사라진","예측된","과장된","줄어든"],"word":"exaggerated","r":{"a":"3) 과장된","ev":"4번 문장","s":[[4,"These episodes are often exaggerated in intensity and duration, with patients frequently reporting rapid transitions between laughter and crying.","이러한 발작은 종종 강도와 지속 시간이 과장되어 나타나며, 환자들은 웃음과 울음 사이의 급격한 전환을 자주 보고한다."]],"w":"4번 문장은 발작의 세기와 지속 시간이 실제보다 크게 나타난다는 내용이에요. exaggerate = 과장하다, exaggerated = 과장된.","c":3},"h":"ec11b8101e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (..., clinicians were able to prescribe a medication specifically designed to help manage the condition.)","ko":"... 임상의들은 이 질환을 관리하는 데 도움이 되도록 특별히 고안된 약물을 처방할 수 있게 되었다.","opts":["처방하다","발견하다","거부하다","광고하다"],"word":"prescribe","r":{"a":"1) 처방하다","ev":"9번 문장","s":[[9,"However, with the FDA approval of Nuedexta in 2010, clinicians were able to prescribe a medication specifically designed to help manage the condition.","그러나, 2010년 뉴덱스타가 FDA 승인을 받으면서, 임상의들은 이 질환을 관리하는 데 도움이 되도록 특별히 고안된 약물을 처방할 수 있게 되었다."]],"w":"9번 문장에서 의사들이 이 병을 위해 특별히 만든 약(a medication)을 환자에게 줄 수 있게 되었다는 뜻이에요. prescribe = 처방하다.","c":1},"h":"5fb434c787"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis led to a reported 50 percent reduction in episodes, improving patients’ quality of life and social functioning.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 보고된 바에 따르면 발작을 50퍼센트 감소시켜 환자의 삶의 질과 사회적 기능을 향상시켰다.","opts":["환자들이 사회적 상황을 피하는 것","과거에 치료 옵션이 제한적이었던 것","2010년에 뉴덱스타가 승인되어 처방할 수 있게 된 것","발작의 강도와 지속 시간이 과장되는 것"],"r":{"a":"3) 2010년에 뉴덱스타가 승인되어 처방할 수 있게 된 것","ev":"9~10번 문장","s":[[9,"However, with the FDA approval of Nuedexta in 2010, clinicians were able to prescribe a medication specifically designed to help manage the condition.","그러나, 2010년 뉴덱스타가 FDA 승인을 받으면서, 임상의들은 이 질환을 관리하는 데 도움이 되도록 특별히 고안된 약물을 처방할 수 있게 되었다."],[10,"This led to a reported 50 percent reduction in episodes, improving patients’ quality of life and social functioning.","이는 보고된 바에 따르면 발작을 50퍼센트 감소시켜 환자의 삶의 질과 사회적 기능을 향상시켰다."]],"w":"This는 바로 앞 9번 문장의 내용, 즉 2010년 FDA 승인으로 이 병을 위한 약을 처방할 수 있게 된 일을 가리켜요. 그 결과 발작이 줄었다는 흐름이에요.","c":3},"h":"c4b5501088"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The saying “Laughter is the best medicine” doesn’t hold true for everyone.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"“웃음이 최고의 명약이다”라는 속담이 모든 사람에게 적용되는 것은 아니다.","opts":["웃음은 누구에게도 약이 되지 못한다.","웃음이 건강에 좋다는 것이 의학적으로 증명되었다.","모든 사람은 같은 방식으로 웃음에서 도움을 얻는다.","웃음이 최고의 약이라는 말이 모든 사람에게 맞는 것은 아니다."],"r":{"a":"4) 웃음이 최고의 약이라는 말이 모든 사람에게 맞는 것은 아니다.","ev":"1번 문장","s":[[1,"The saying “Laughter is the best medicine” doesn’t hold true for everyone.","“웃음이 최고의 명약이다”라는 속담이 모든 사람에게 적용되는 것은 아니다."]],"w":"doesn't hold true for everyone은 '모든 사람에게 들어맞지는 않는다'는 부분 부정이에요. 어떤 사람에게는 맞고 어떤 사람에게는 맞지 않는다는 뜻이라, '누구에게도' 아니라는 말과는 달라요.","c":4},"h":"15bc00b920"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["뉴덱스타는 2010년 이전부터 PBA 환자에게 쓸 수 있었다.","PBA 환자는 웃긴 상황에서만 웃는다.","PBA는 뇌졸중을 겪었거나 치매가 있는 환자에게 가장 흔하다.","의사들은 2010년 이후 PBA를 완전히 치료해 왔다."],"opts":["Nuedexta was available for PBA patients before 2010.","PBA patients laugh only in funny situations.","PBA is most common in patients who have had a stroke or have dementia.","Doctors have completely cured PBA since 2010."],"r":{"a":"3) PBA is most common in patients who have had a stroke or have dementia.","ev":"7번 문장","s":[[7,"The condition is most common in patients who have suffered a stroke or in those experiencing cognitive decline due to dementia.","이 질환은 뇌졸중을 겪은 환자나 치매로 인한 인지 기능 저하를 겪는 환자에게서 가장 흔하다."]],"w":"7번 문장에서 이 질환은 뇌졸중을 겪은 환자나 치매로 인지 기능이 떨어진 환자에게서 가장 흔하다고 해요. 뉴덱스타는 2010년에 승인되었고(9번), 약은 발작을 50퍼센트 줄였을 뿐 완전히 고친 것이 아니에요(10번).","c":3},"h":"00a900f2b6"},{"n":9,"t":"sum","q":"For people with PBA, laughter becomes a (A) rather than a pleasure, but a drug approved in 2010 has (B) their episodes.","ko":"PBA 환자에게 웃음은 즐거움이 아니라 (A)가 되지만, 2010년에 승인된 약은 발작을 (B)했다.","oko":["(A) 선물 / (B) 줄였다","(A) 선물 / (B) 늘렸다","(A) 문제 / (B) 늘렸다","(A) 문제 / (B) 일으켰다","(A) 문제 / (B) 줄였다"],"opts":["(A) gift / (B) reduced","(A) gift / (B) increased","(A) problem / (B) increased","(A) problem / (B) caused","(A) problem / (B) reduced"],"r":{"a":"5) (A) problem / (B) reduced","ev":"2·10번 문장","s":[[2,"For those with Chronic Laughter Syndrome, laughter can be a source of distress and social difficulty rather than healing.","만성 웃음 증후군을 앓는 사람들에게 웃음은 치유라기보다는 고통과 사회적 어려움의 원인이 될 수 있다."],[10,"This led to a reported 50 percent reduction in episodes, improving patients’ quality of life and social functioning.","이는 보고된 바에 따르면 발작을 50퍼센트 감소시켜 환자의 삶의 질과 사회적 기능을 향상시켰다."]],"w":"2번에서 웃음은 치유가 아니라 고통과 사회적 어려움의 원인이 된다고 하니 (A)는 problem이에요. 10번에서 약이 발작을 50퍼센트 줄였으니(reduction) (B)는 reduced예요.","c":5},"h":"2c83b20cb8"},{"n":10,"t":"fill","q":"Patients with PBA have [A] bursts of laughter and avoid social situations; before 2010, treatment options were highly [B] because no medicine was designed for the condition.","ko":"PBA 환자는 [A] 웃음 폭발을 겪어 사회적 상황을 피하며, 2010년 이전에는 이 질환을 위해 만든 약이 없어 치료 옵션이 매우 [B]했다.","bank":["uncontrollable","limited","effective","approved","cerebral","targeted"],"bko":{"uncontrollable":"통제할 수 없는","limited":"제한된","effective":"효과적인","approved":"승인된","cerebral":"대뇌의","targeted":"표적의"},"r":{"a":"[A] uncontrollable, [B] limited","ev":"3·5·8번 문장","s":[[3,"Chronic Laughter Syndrome, medically referred to as Pseudobulbar Affect (PBA), is a neurological condition characterized by uncontrollable episodes of laughter without appropriate stimuli or context.","의학적으로 감정실금이라고 불리는 만성 웃음 증후군은 적절한 자극이나 맥락 없이 통제할 수 없는 웃음 발작이 특징인 신경학적 질환이다."],[5,"Individuals experiencing the syndrome often face emotional distress and isolation, as they avoid social situations due to their condition.","이 증후군을 겪는 개인들은 자신의 상태로 인해 사회적 상황을 피하기 때문에 종종 정서적 고통과 고립에 직면한다."],[8,"In the past, treatment options for PBA were highly limited due to its lack of targeted therapies.","과거에는 표적 치료법이 부재하여 PBA에 대한 치료 옵션이 매우 제한적이었다."]],"w":"3번의 uncontrollable episodes of laughter, 5번의 사회적 상황 회피, 8번의 treatment options were highly limited에서 가져왔어요. effective는 약이 없던 시절의 치료 옵션과 맞지 않고, approved·cerebral·targeted는 두 빈칸의 뜻에 어울리지 않아요.","c":null},"h":"90b9f56951"}]},{"u":5,"id":"ms4-05-2","no":2,"ko":"피자가 친절하고 사장님이 맛있어요!","items":[{"n":1,"t":"tf","q":"Speakers are expected to be truthful and to stay relevant in conversation.","ko":"화자들은 대화에서 진실하고 관련성을 유지할 것으로 기대된다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Speakers are expected to provide appropriate amounts of information (Quantity), be truthful (Quality), stay relevant (Relation), and communicate clearly (Manner).","화자들은 적절한 양의 정보를 제공하고(Quantity), 진실하며(Quality), 관련성을 유지하고(Relation), 명확하게 의사소통할 것(Manner)으로 기대된다."]],"w":"2번 문장에서 화자들은 진실하고(Quality) 관련성을 유지할(Relation) 것으로 기대된다고 해요.","c":"T"},"h":"8fab87cf18"},{"n":2,"t":"tf","q":"Communication always fails when a conversational maxim is intentionally violated.","ko":"대화의 규율이 의도적으로 위반되면 의사소통은 항상 실패한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It may seem that conversation succeeds only when these maxims are followed, yet in everyday life communication often remains effective even when a maxim is intentionally violated.","대화는 이러한 규율들이 지켜질 때만 성공하는 것처럼 보일 수 있지만, 일상생활에서 의사소통은 규율이 의도적으로 위반될 때조차도 종종 효과적으로 이루어진다."]],"w":"4번 문장에서 일상생활의 의사소통은 규율이 의도적으로 위반될 때조차 종종 효과적으로 이루어진다고 해요. '항상 실패한다'는 반대예요.","c":"F"},"h":"1e14ef30e9"},{"n":3,"t":"tf","q":"In the fast-food example, the child infers the speaker’s intention.","ko":"패스트푸드 예에서 아이가 화자의 의도를 추론한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Both speakers share the intention of preventing the child from recognizing the word, and the listener infers this intention.","두 화자 모두 아이가 그 단어를 알아차리는 것을 막으려는 의도를 공유하고 있으며, 청자는 이 의도를 추론한다."]],"w":"9번 문장에서 의도를 추론하는 사람은 아이가 아니라 듣는 사람(the listener)이에요. 두 화자는 오히려 아이가 그 단어를 알아차리지 못하게 하려고 해요.","c":"F"},"h":"d43cf98b62"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (..., yet in everyday life communication often remains effective even when a maxim is intentionally violated.)","ko":"... 일상생활에서 의사소통은 규율이 의도적으로 위반될 때조차도 종종 효과적으로 이루어진다.","opts":["위반된","허락된","설명된","반복된"],"word":"violated","r":{"a":"1) 위반된","ev":"4번 문장","s":[[4,"It may seem that conversation succeeds only when these maxims are followed, yet in everyday life communication often remains effective even when a maxim is intentionally violated.","대화는 이러한 규율들이 지켜질 때만 성공하는 것처럼 보일 수 있지만, 일상생활에서 의사소통은 규율이 의도적으로 위반될 때조차도 종종 효과적으로 이루어진다."]],"w":"yet 뒤에서 규율을 일부러 '어긴' 경우에도 의사소통이 된다고 말해요. violate = 위반하다, violated = 위반된.","c":1},"h":"53c7eb2f5e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Conversation, therefore, is not a rigid system that rewards rule-following alone, ...)","ko":"그러므로 대화는 규칙 준수만을 보상하는 경직된 체계가 아니라, ...","opts":["융통성 있는","복잡한","경직된","새로운"],"word":"rigid","r":{"a":"3) 경직된","ev":"16번 문장","s":[[16,"Conversation, therefore, is not a rigid system that rewards rule-following alone, but a cooperative activity grounded in shared context and interpretation.","그러므로 대화는 규칙 준수만을 보상하는 경직된 체계가 아니라, 공유된 맥락과 해석에 기반을 둔 협력적인 활동이다."]],"w":"not a rigid system but a cooperative activity에서 rigid는 협력적이고 유연한 활동과 반대되는 '딱딱하고 경직된'이라는 뜻이에요.","c":3},"h":"c27dd8a030"},{"n":6,"t":"ref","q":"What does the underlined \"This response\" refer to?\nThis response does not directly answer the question.","ko":"밑줄 친 This response가 가리키는 것은?","sko":"이 응답은 질문에 직접적으로 대답하지 않는다.","opts":["아내가 “지금 몇 시예요?”라고 한 질문","패스트푸드 식당 이름을 철자로 말한 대답","남편이 “당신 알람이 아직 울리지 않았어.”라고 한 대답","아이가 단어를 알아차리지 못한 것"],"r":{"a":"3) 남편이 “당신 알람이 아직 울리지 않았어.”라고 한 대답","ev":"10~11번 문장","s":[[10,"A similar pattern appears when a wife, just waking up, asks, “What time is it?” and her husband replies, “Your alarm hasn’t gone off yet.”","아내가 막 잠에서 깨어 “지금 몇 시예요?”라고 묻고 남편이 “당신 알람이 아직 울리지 않았어.”라고 대답할 때도 비슷한 양상이 나타난다."],[11,"This response does not directly answer the question.","이 응답은 질문에 직접적으로 대답하지 않는다."]],"w":"This response는 바로 앞 10번 문장에서 남편이 한 대답 “Your alarm hasn’t gone off yet.”이에요. 질문이 아니라 대답이고, 식당 이름 철자 예는 앞 단락(6번)의 이야기예요.","c":3},"h":"125e798ca7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In such cases, meaning does not arise from strict obedience to conversational rules.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러한 경우들에서, 의미는 대화 규칙에 대한 엄격한 준수에서 생겨나지 않는다.","opts":["그러한 경우에 의미는 대화 규칙을 엄격히 따를 때 생겨난다.","그러한 경우에 대화 규칙은 의미를 이해하는 데 가장 중요하다.","그러한 경우에 의미는 대화 규칙을 가르치는 데서 생겨난다.","그러한 경우에 의미는 대화 규칙을 엄격히 지키는 데서 비롯되지 않는다."],"r":{"a":"4) 그러한 경우에 의미는 대화 규칙을 엄격히 지키는 데서 비롯되지 않는다.","ev":"14번 문장","s":[[14,"In such cases, meaning does not arise from strict obedience to conversational rules.","그러한 경우들에서, 의미는 대화 규칙에 대한 엄격한 준수에서 생겨나지 않는다."]],"w":"does not arise from은 '~에서 생겨나지 않는다'예요. strict obedience to rules(규칙의 엄격한 준수)가 의미의 원천이 아니라는 뜻이에요.","c":4},"h":"fd59353057"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Grice의 규율은 규율이 위반될 때마다 왜 의사소통이 무너지는지 설명한다.","남편의 대답은 아내에게 아직 이른 아침이라는 것을 알려 준다.","아내가 시간을 추정하려면 정확한 시간을 알아야 한다.","단어를 철자로 말하는 것은 명확하고 간결한 말하기 방식이다."],"opts":["Grice’s maxims explain why communication breaks down whenever they are violated.","The husband’s reply tells the wife that it is still early in the morning.","The wife needs to know the exact time to estimate it.","Spelling out a word is a clear and concise way of speaking."],"r":{"a":"2) The husband’s reply tells the wife that it is still early in the morning.","ev":"12~13번 문장","s":[[12,"However, the husband is actively signaling that it is still early in the morning.","하지만, 남편은 아직 아침 이른 시간이라는 신호를 적극적으로 보내고 있는 것이다."],[13,"Even without knowing the exact time, the wife can infer a reasonable estimate based on their shared knowledge of when her alarm usually rings.","정확한 시간을 알지 못하더라도, 아내는 그녀의 알람이 보통 언제 울리는지에 대한 그들의 공유된 지식에 근거하여 합리적인 추정을 추론할 수 있다."]],"w":"12번에서 남편은 아직 아침 이른 시간이라는 신호를 보내고 있어요. 13번에서 아내는 정확한 시간을 몰라도 추정할 수 있고(③ 오답), 철자로 말한 대답은 명확하지도 간결하지도 않으며(7번, ④ 오답), 규율이 위반되어도 의사소통은 단절되지 않아요(8번, ① 오답).","c":2},"h":"9b6b22fdd7"},{"n":9,"t":"sum","q":"Communication can succeed even when a conversational (A) is broken, as long as listeners (B) the speaker’s intention.","ko":"대화의 (A)가 깨져도, 청자가 화자의 의도를 (B)하기만 하면 의사소통은 성공할 수 있다.","oko":["(A) 규칙 / (B) 무시한다","(A) 규칙 / (B) 거부한다","(A) 주제 / (B) 추론한다","(A) 언어 / (B) 숨긴다","(A) 규칙 / (B) 추론한다"],"opts":["(A) rule / (B) ignore","(A) rule / (B) reject","(A) topic / (B) infer","(A) language / (B) hide","(A) rule / (B) infer"],"r":{"a":"5) (A) rule / (B) infer","ev":"4·15번 문장","s":[[4,"It may seem that conversation succeeds only when these maxims are followed, yet in everyday life communication often remains effective even when a maxim is intentionally violated.","대화는 이러한 규율들이 지켜질 때만 성공하는 것처럼 보일 수 있지만, 일상생활에서 의사소통은 규율이 의도적으로 위반될 때조차도 종종 효과적으로 이루어진다."],[15,"Instead, communication succeeds when listeners recognize that a rule has been intentionally violated and infer the speaker’s underlying intention.","대신, 청자들이 규칙이 의도적으로 위반되었다는 것을 인식하고 화자의 기저에 깔린 의도를 추론할 때 의사소통은 성공한다."]],"w":"4번에서 대화 규율이 의도적으로 위반되어도 의사소통이 효과적일 수 있다고 하고, 15번에서 청자가 위반을 알아차리고 화자의 의도를 추론할 때 성공한다고 해요. 그래서 (A)는 rule, (B)는 infer예요.","c":5},"h":"784c38becd"},{"n":10,"t":"fill","q":"Conversation is not a [A] system that rewards rule-following alone, but a [B] activity grounded in shared context.","ko":"대화는 규칙 준수만을 보상하는 [A] 체계가 아니라, 공유된 맥락에 기반한 [B] 활동이다.","bank":["rigid","cooperative","violated","spelled","nearby","clearly"],"bko":{"rigid":"경직된","cooperative":"협력적인","violated":"위반된","spelled":"철자로 쓴","nearby":"근처의","clearly":"명확하게"},"r":{"a":"[A] rigid, [B] cooperative","ev":"16번 문장","s":[[16,"Conversation, therefore, is not a rigid system that rewards rule-following alone, but a cooperative activity grounded in shared context and interpretation.","그러므로 대화는 규칙 준수만을 보상하는 경직된 체계가 아니라, 공유된 맥락과 해석에 기반을 둔 협력적인 활동이다."]],"w":"16번 문장의 'a rigid system'과 'a cooperative activity'에서 가져왔어요. violated·spelled·nearby·clearly는 체계나 활동을 꾸미는 말로 뜻이 맞지 않아요.","c":null},"h":"eba1d108d7"}]},{"u":5,"id":"ms4-05-3","no":3,"ko":"터치도 하이, 테크도 하이~","items":[{"n":1,"t":"tf","q":"In a high-touch classroom, teachers and students interact personally.","ko":"하이터치 교실에서는 교사와 학생이 개인적으로 상호작용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This exemplifies a high-touch learning environment—one that emphasizes personal interaction and emotional engagement between students and teachers.","이것은 하이터치(high-touch) 학습 환경의 전형적인 예인데, 이는 학생과 교사 간의 개인적인 상호작용과 정서적 관여를 강조하는 환경이다."]],"w":"3번 문장에서 하이터치 학습 환경은 학생과 교사 사이의 개인적인 상호작용(personal interaction)과 정서적 관여를 강조한다고 해요.","c":"T"},"h":"0283e062fe"},{"n":2,"t":"tf","q":"High-tech education focuses on face-to-face communication.","ko":"하이테크 교육은 대면 의사소통에 초점을 맞춘다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"While high tech prioritizes efficiency through the use of digital platforms that provide easy and instant access to information, an excessive reliance on devices may result in social isolation and decreased engagement for students.","하이테크는 정보에 쉽고 즉각적인 접근을 제공하는 디지털 플랫폼의 사용을 통해 효율성을 우선시하지만, 기기에 대한 과도한 의존은 학생들에게 사회적 고립과 참여도 감소를 초래할 수 있다."],[6,"On the other hand, high-touch classrooms counteract this by immersing students in hands-on activities that promote collaboration and face-to-face communication.","반면에, 하이터치 교실은 협력과 대면 의사소통을 촉진하는 체험 활동에 학생들을 몰입시킴으로써 이에 대응한다."]],"w":"5번 문장에서 하이테크는 디지털 플랫폼을 통한 효율성을 우선시해요. 대면(face-to-face) 의사소통을 촉진하는 쪽은 6번의 하이터치 교실이에요.","c":"F"},"h":"398137ba55"},{"n":3,"t":"tf","q":"Technology teaches basic skills while students lead the class discussions.","ko":"기술이 기초 기술을 가르치는 동안 학생들이 학급 토론을 이끈다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"This would allow students to learn basic skills through technology, while freeing up teachers to focus on guiding problem-solving activities and leading classroom discussions.","이것은 학생들이 기술을 통해 기초 기술을 배우게 하는 한편, 교사들이 문제 해결 활동을 지도하고 학급 토론을 주도하는 데 집중할 수 있도록 시간을 마련해 줄 것이다."]],"w":"9번 문장에서 학급 토론을 이끄는 쪽은 학생이 아니라 교사예요. 기술이 기초 기술 학습을 돕는 동안 교사들이 문제 해결 활동 지도와 토론 주도에 집중해요.","c":"F"},"h":"aabac220eb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (..., high-touch classrooms counteract this by immersing students in hands-on activities...)","ko":"... 하이터치 교실은 체험 활동에 학생들을 몰입시킴으로써 이에 대응한다.","opts":["따라 한다","대응한다","무시한다","악화시킨다"],"word":"counteract","r":{"a":"2) 대응한다","ev":"6번 문장","s":[[6,"On the other hand, high-touch classrooms counteract this by immersing students in hands-on activities that promote collaboration and face-to-face communication.","반면에, 하이터치 교실은 협력과 대면 의사소통을 촉진하는 체험 활동에 학생들을 몰입시킴으로써 이에 대응한다."]],"w":"this는 5번의 문제(고립과 참여도 감소)예요. 하이터치 교실은 그 문제에 맞서 해결하려는 활동을 하니 counteract = 대응하다, 맞서다예요.","c":2},"h":"25281b2713"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A high-touch, high-tech classroom could also offer a more personalized and comprehensive educational experience, ...)","ko":"하이터치 및 하이테크 교실은 또한 더 개인화되고 포괄적인 교육 경험을 제공할 수 있다.","opts":["제한된","일시적인","포괄적인","값비싼"],"word":"comprehensive","r":{"a":"3) 포괄적인","ev":"10번 문장","s":[[10,"A high-touch, high-tech classroom could also offer a more personalized and comprehensive educational experience, with technology adapting to each student’s progress and teachers responding to emotional needs.","하이터치 및 하이테크 교실은 또한 기술이 각 학생의 진척도에 적응하고 교사가 정서적 필요에 부응함으로써, 더 개인화되고 포괄적인 교육 경험을 제공할 수 있다."]],"w":"personalized(개인화된)와 함께 쓰여 여러 면을 두루 아우르는 교육 경험을 뜻해요. comprehensive = 포괄적인.","c":3},"h":"c593194cf1"},{"n":6,"t":"ref","q":"What does the underlined \"these classrooms\" refer to?\nIn these classrooms, teachers play a crucial role in fostering interpersonal connections, ...","ko":"밑줄 친 these classrooms가 가리키는 것은?","sko":"이러한 교실에서, 교사는 대인 관계를 조성하는 데 중요한 역할을 하며, ...","opts":["하이터치 교실","기기에 지나치게 의존하는 교실","학생이 혼자 공부하는 교실","교사가 없는 교실"],"r":{"a":"1) 하이터치 교실","ev":"6~7번 문장","s":[[6,"On the other hand, high-touch classrooms counteract this by immersing students in hands-on activities that promote collaboration and face-to-face communication.","반면에, 하이터치 교실은 협력과 대면 의사소통을 촉진하는 체험 활동에 학생들을 몰입시킴으로써 이에 대응한다."],[7,"In these classrooms, teachers play a crucial role in fostering interpersonal connections, using real-time interactions to gauge student understanding and adjust their instruction accordingly.","이러한 교실에서, 교사는 대인 관계를 조성하는 데 중요한 역할을 하며, 학생의 이해도를 측정하기 위해 실시간 상호작용을 사용하고 그에 따라 수업을 조정한다."]],"w":"these classrooms는 바로 앞 6번의 high-touch classrooms(하이터치 교실)를 받는 말이에요. 7번은 그 교실에서 교사가 하는 일을 설명해요.","c":1},"h":"52d12fc483"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"According to experts, the ideal educational approach would be to combine high-touch and high-tech strategies.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"전문가들에 따르면, 이상적인 교육 접근 방식은 하이터치와 하이테크 전략을 결합하는 것이다.","opts":["전문가들은 하이터치 전략만 쓰는 것이 이상적이라고 말한다.","전문가들은 하이테크 전략을 하이터치로 바꿔야 한다고 말한다.","전문가들은 두 전략 중 비용이 낮은 쪽을 고르라고 말한다.","전문가들은 하이터치와 하이테크를 결합하는 것이 이상적이라고 말한다."],"r":{"a":"4) 전문가들은 하이터치와 하이테크를 결합하는 것이 이상적이라고 말한다.","ev":"8번 문장","s":[[8,"According to experts, the ideal educational approach would be to combine high-touch and high-tech strategies.","전문가들에 따르면, 이상적인 교육 접근 방식은 하이터치와 하이테크 전략을 결합하는 것이다."]],"w":"combine A and B는 'A와 B를 결합하다'예요. 한쪽만 쓰거나 한쪽을 다른 쪽으로 바꾸는 것이 아니라 둘을 합치는 방식이 이상적이라는 뜻이에요.","c":4},"h":"2cfcf792c8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["교사가 사고를 자극하는 질문을 하면 학생들은 흥미를 잃는다.","하이터치 교실은 주로 디지털 기기에 의존한다.","결합된 교실에서 기술은 각 학생의 진척도에 맞출 수 있다.","하이테크 플랫폼은 하이터치보다 개인적 상호작용을 더 쉽게 만든다."],"opts":["Students lose interest when teachers ask thought-provoking questions.","High-touch classrooms depend mainly on digital devices.","In a combined classroom, technology can adapt to each student’s progress.","High-tech platforms make personal interaction easier than high touch."],"r":{"a":"3) In a combined classroom, technology can adapt to each student’s progress.","ev":"10번 문장","s":[[10,"A high-touch, high-tech classroom could also offer a more personalized and comprehensive educational experience, with technology adapting to each student’s progress and teachers responding to emotional needs.","하이터치 및 하이테크 교실은 또한 기술이 각 학생의 진척도에 적응하고 교사가 정서적 필요에 부응함으로써, 더 개인화되고 포괄적인 교육 경험을 제공할 수 있다."]],"w":"10번 문장에서 하이터치와 하이테크를 결합한 교실은 기술이 각 학생의 진척도에 적응한다고 해요. 교사의 질문은 학생의 생각에 도전하는 것이고(2번), 하이터치 교실은 체험 활동 중심이며(6번), 개인적 상호작용을 강조하는 쪽은 하이터치예요(3번).","c":3},"h":"880dcd47e6"},{"n":9,"t":"sum","q":"In a combined classroom, students learn basic skills through (A), and teachers can focus on guiding (B).","ko":"결합된 교실에서 학생들은 (A)를 통해 기초 기술을 배우고, 교사들은 (B)를 지도하는 데 집중할 수 있다.","oko":["(A) 교사 / (B) 토론","(A) 기술 / (B) 기기","(A) 실험 / (B) 시험","(A) 기술 / (B) 토론","(A) 교사 / (B) 기술"],"opts":["(A) teachers / (B) discussions","(A) technology / (B) devices","(A) experiments / (B) tests","(A) technology / (B) discussions","(A) teachers / (B) technology"],"r":{"a":"4) (A) technology / (B) discussions","ev":"9번 문장","s":[[9,"This would allow students to learn basic skills through technology, while freeing up teachers to focus on guiding problem-solving activities and leading classroom discussions.","이것은 학생들이 기술을 통해 기초 기술을 배우게 하는 한편, 교사들이 문제 해결 활동을 지도하고 학급 토론을 주도하는 데 집중할 수 있도록 시간을 마련해 줄 것이다."]],"w":"9번 문장에서 학생들은 기술(technology)을 통해 기초 기술을 배우고, 그동안 교사들은 문제 해결 활동과 학급 토론(discussions)을 지도하는 데 집중해요.","c":4},"h":"a85ae40830"},{"n":10,"t":"fill","q":"High tech prioritizes [A] through digital platforms, but depending on devices too much may leave students in social [B].","ko":"하이테크는 디지털 플랫폼으로 [A]을 우선시하지만, 기기에 지나치게 의존하면
