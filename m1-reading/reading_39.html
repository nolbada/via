var D=[{"n":1,"tag":null,"en":"During the summer vacation, William traveled around Korea with him family. This is his food diary.","ko":"여름 방학 동안, William은 가족과 함께 한국 여기저기를 여행했다. 이것은 그의 음식 일기이다.","ok":false,"foot":[],"fixes":[{"wrong":"him","right":"his","partial":false,"at":[9],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 his 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 his 사용"}]},{"n":2,"tag":"7월 25일 · 담양","en":"We went to Damyang and visited Jungnogwon, an famous bamboo garden. We enjoyed walking in the garden.","ko":"우리는 담양에 갔고 유명한 대나무 정원인 죽녹원을 방문했다. 우리는 정원에서 걷는 것을 즐겼다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[7],"point":"관사 a/an: famous는 자음 소리라 a famous 사용","topic":"관사 a/an","memo":"famous는 자음 소리라 a famous 사용"}]},{"n":3,"tag":null,"en":"After we looked around, we eated two local dishes, daetongbap and tteokgalbi. Daetongbap is rice in a bamboo bowl.","ko":"주변을 둘러본 후에, 우리는 두 가지 지역 음식인 대통밥과 떡갈비를 먹었다. 대통밥은 대나무 그릇에 담긴 밥이다.","ok":false,"foot":[],"fixes":[{"wrong":"eated","right":"ate","partial":false,"at":[5],"point":"불규칙 과거형: eat의 과거형은 eated가 아니라 ate","topic":"불규칙 과거형","memo":"eat의 과거형은 eated가 아니라 ate"}]},{"n":4,"tag":null,"en":"I loved it unique bamboo smell. Tteokgalbi, a Korean beef dish, was softly and sweet.","ko":"나는 그것의 독특한 대나무 향이 매우 좋았다. 한국의 소고기 요리인 떡갈비는 부드럽고 달콤했다.","ok":false,"foot":[],"fixes":[{"wrong":"it","right":"its","partial":false,"at":[2],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 its 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 its 사용"},{"wrong":"softly","right":"soft","partial":false,"at":[12],"point":"형용사와 부사: be동사 뒤 보어는 형용사 soft 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어는 형용사 soft 사용"}]},{"n":5,"tag":null,"en":"The dishes really went well together.","ko":"그 요리들은 함께 정말 잘 어울렸다.","ok":true,"foot":[],"fixes":[]},{"n":6,"tag":"7월 30일 · 통영","en":"We visited Tongyeong and went up the mountain with cable car. Seeing the blue ocean and the green islands were fantastic!","ko":"우리는 통영을 방문했고 케이블카를 타고 산에 올라갔다. 파란 바다와 녹색의 섬들을 보는 것은 환상적이었다!","ok":fals  was so soft!","둘째로, 고기가 아주 부드러웠다!",0],["I had it with a special fish sauce, and the sauce was great, too.","나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다.",0],["Later, I learned about the meaning of dombe.","나중에 나는 돔베의 의미에 대해 배웠다.",0],["It means a cutting board in Jeju's language.","그것은 제주 말로 도마를 의미한다.",0]];var RNUM=39;var TITLE_EN="My Korean Food Diary";var PASS_EN=["My Korean Food Diary","During the summer vacation, William traveled around Korea with his family. This is his food diary.","July 25","We went to Damyang and visited Jungnogwon, a famous bamboo garden. We enjoyed walking in the garden. After we looked around, we ate two local dishes, daetongbap and tteokgalbi. Daetongbap is rice in a bamboo bowl. I loved its unique bamboo smell. Tteokgalbi, a Korean beef dish, was soft and sweet. The dishes really went well together.","July 30","We visited Tongyeong and went up the mountain by cable car. Seeing the blue ocean and the green islands was fantastic! Near the sea, we found a local restaurant and ate chungmugimbap. It wasn't like other types of gimbap. There was only rice inside the seaweed. Kimchi and spicy squid were on the side. It was spicy but really delicious. I heard about the history of this food. Chungmu is an old name for Tongyeong. Long ago, fishermen in this town started to eat chungmugimbap because it did not go bad quickly.","August 2","Jeju-do is a beautiful island in Korea. We went there on a very hot day, and we became tired. However, we got our energy back thanks to dombegogi. It surprised me in two ways. First, it was pork on a cutting board, not on a plate. Second, the meat was so soft! I had it with a special fish sauce, and the sauce was great, too. Later, I learned about the meaning of dombe. It means a cutting board in Jeju's language."];var PASS_KO=["나의 한국 음식 일기","여름 방학 동안, William은 가족과 함께 한국 여기저기를 여행했다. 이것은 그의 음식 일기이다.","7월 25일","우리는 담양에 갔고 유명한 대나무 정원인 죽녹원을 방문했다. 우리는 정원에서 걷는 것을 즐겼다. 주변을 둘러본 후에, 우리는 두 가지 지역 음식인 대통밥과 떡갈비를 먹었다. 대통밥은 대나무 그릇에 담긴 밥이다. 나는 그것의 독특한 대나무 향이 매우 좋았다. 한국의 소고기 요리인 떡갈비는 부드럽고 달콤했다. 그 요리들은 함께 정말 잘 어울렸다.","7월 30일","우리는 통영을 방문했고 케이블카를 타고 산에 올라갔다. 파란 바다와 녹색의 섬들을 보는 것은 환상적이었다! 바다 근처에서 우리는 현지 식당을 찾았고 충무김밥을 먹었다. 그것은 다른 종류의 김밥과는 달랐다. 김 안에는 오직 밥만 있었다. 김치와 매운 오징어가 옆에 있었다. 그것은 매웠지만 정말 맛있었다. 나는 이 음식의 역사에 관해 들었다. 충무는 통영의 옛 이름이다. 오래전에, 이 마을의 어부들은 이 음식이 빨리 상하지 않았기 때문에 충무김밥을 먹기 시작했다.","8월 2일","제주도는 한국의 아름다운 섬이다. 우리는 매우 더운 날에 거기에 갔고 피곤해졌다. 그러나 돔베고기 덕분에 우리는 기운을 되찾았다. 그것은 두 가지 면으로 나를 놀라게 했다. 첫째로, 그것은 접시 위가 아닌 도마 위의 돼지고기였다. 둘째로, 고기가 아주 부드러웠다! 나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다. 나중에 나는 돔베의 의미에 대해 배웠다. 그것은 제주 말로 도마를 의미한다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["How to cook Vietnamese rice noodle soup","Jane's great trip to Vietnam and its local food","The history of famous Vietnamese places","Jane's plan for her next trip abroad","Differences between Vietnam and Korea"],"a":1,"ans":"Jane's great trip to Vietnam and its local food","evs":[["B: Jane, how was your trip to Vietnam?","Jane, 베트남 여행은 어땠니?"],["G: It was great. I enjoyed the beautiful nature and ate famous local foods.","아주 좋았어. 아름다운 자연을 즐겼고 유명한 현지 음식들을 먹었어."]],"ev":["B: Jane, how was your trip to Vietnam?","Jane, 베트남 여행은 어땠니?"],"ow":["오답 ✕ — 'I ate rice noodle soup.'(쌀국수를 먹었어.)라고 음식이 나오지만 요리하는 방법은 없다. 맛과 재료만 말해서 틀림.","정답 ○ — 'Jane, how was your trip to Vietnam?'(베트남 여행은 어땠니?)에 'It was great.'(아주 좋았어.)라고 하고 자연과 현지 음식을 말하므로 베트남 여행과 음식 이야기이다.","오답 ✕ — 베트남의 유명한 장소의 역사는 나오지 않는다. 'the beautiful nature'(아름다운 자연)를 즐겼다고만 한다.","오답 ✕ — 'How was your trip to Vietnam?'은 이미 다녀온 여행을 묻는 말이다. 다음 여행 계획은 대화에 없다.","오답 ✕ — 베트남과 한국을 비교하는 말은 전혀 없다. Jane은 베트남에서 즐긴 것만 이야기한다."],"memo":["정답 ②: Jane의 즐거웠던 베트남 여행과 현지 음식","근거: It was great. I enjoyed the beautiful nature and ate famous local foods.(아주 좋았어. 아름다운 자연을 즐겼고 유명한 현지 음식들을 먹었어.)","함정: ① 쌀국수는 먹었지만 만드는 방법은 없어서 ✕"],"why":"Jane이 베트남 여행에서 자연과 현지 음식을 즐겼다고 말하는 대화이다."},{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Vietnam has beautiful nature.","Jane had a great time in Vietnam.","Jane enjoyed well-known Vietnamese dishes.","Rice noodle soup in Vietnam has a lot of vegetables in it.","Jane had rice noodle soup without meat and it was delicious."],"a":4,"ans":"Jane had rice noodle soup without meat and it was delicious.","evs":[["G: I ate rice noodle soup. It had a lot of vegetables and meat. It was tasty.","쌀국수를 먹었어. 채소와 고기가 많이 들어 있었어. 맛있었어."],["G: It was great. I enjoyed the beautiful nature and ate famous local foods.","아주 좋았어. 아름다운 자연을 즐겼고 유명한 현지 음식들을 먹었어."]],"ev":["G: I ate rice noodle soup. It had a lot of vegetables and meat. It was tasty.","쌀국수를 먹었어. 채소와 고기가 많이 들어 있었어. 맛있었어."],"ow":["오답 ✕ — 지문과 일치한다. 'I enjoyed the beautiful nature'(아름다운 자연을 즐겼어)라고 했으므로 베트남에는 아름다운 자연이 있다.","오답 ✕ — 지문과 일치한다. 'It was great.'(아주 좋았어.)라고 했으므로 Jane은 즐거운 시간을 보냈다.","오답 ✕ — 지문과 일치한다. 'ate famous local foods'(유명한 현지 음식을 먹었어)라고 했다.","오답 ✕ — 지문과 일치한다. 'It had a lot of vegetables and meat.'(채소와 고기가 많이 들어 있었어.)라고 했다.","정답 ○ — 'It had a lot of vegetables and meat.'(채소와 고기가 많이 들어 있었어.)라고 했으므로 고기가 없었다는 말은 지문과 다르다."],"memo":["정답 ⑤: 쌀국수에는 고기도 들어 있었다(고기 없이 먹은 것이 아님).","근거: It had a lot of vegetables and meat.(채소와 고기가 많이 들어 있었어.)","함정: ④는 채소가 많이 들어 있다는 말이 맞아서 ✕"],"why":"쌀국수에는 채소와 고기가 모두 많이 들어 있었다."}],"dlg":[["B","Jane, how was your trip to Vietnam?","Jane, 베트남 여행은 어땠니?"],["G","It was great. I enjoyed the beautiful nature and ate famous local foods.","아주 좋았어. 아름다운 자연을 즐겼고 유명한 현지 음식들을 먹었어."],["B","What did you eat?","무엇을 먹었니?"],["G","I ate rice noodle soup. It had a lot of vegetables and meat. It was tasty.","쌀국수를 먹었어. 채소와 고기가 많이 들어 있었어. 맛있었어."]]},{"qs":[{"n":3,"q":"위 대화의 주제로 알맞은 것은?","o":["한국의 전통 명절들","수리취떡을 만드는 법","한국 전통 떡 비교하기","지수의 채널의 인기 비결","단오날 아빠와 함께 한 일"],"a":4,"ans":"단오날 아빠와 함께 한 일","evs":[["Today is a traditional Korean holiday, Dano. So I'm making surichwitteok with my dad now.","오늘은 한국의 전통 명절인 단오예요. 그래서 지금 아빠와 함께 수리취떡을 만들고 있어요."],["It's finally ready! It looks delicious.","드디어 다 됐어요! 맛있어 보여요."]],"ev":["Today is a traditional Korean holiday, Dano. So I'm making surichwitteok with my dad now.","오늘은 한국의 전통 명절인 단오예요. 그래서 지금 아빠와 함께 수리취떡을 만들고 있어요."],"ow":["오답 ✕ — 'a traditional Korean holiday, Dano'(한국의 전통 명절인 단오)라고 단오 하나만 나온다. 여러 명절을 이야기하지 않아서 틀림.","오답 ✕ — 'I'm making surichwitteok with my dad now.'(아빠와 수리취떡을 만들고 있어요)는 있지만 만드는 방법(재료와 순서)을 설명하지 않는다.","오답 ✕ — 'It's rice cake with a wheel pattern.'(수레바퀴 무늬가 있는 떡이에요.)만 말하고 다른 떡과 비교하지 않는다.","오답 ✕ — 'Welcome to Jisu's channel!'(지수의 채널에 오신 것을 환영합니다!)은 인사일 뿐 채널의 인기 비결은 나오지 않는다.","정답 ○ — 'Today is ... Dano. So I'm making surichwitteok with my dad now.'(오늘은 단오예요. 그래서 아빠와 수리취떡을 만들고 있어요.)이므로 단오날 아빠와 한 일이 주제이다."],"memo":["정답 ⑤: 단오날 아빠와 함께 한 일(수리취떡 만들기)","근거: So I'm making surichwitteok with my dad now.(그래서 지금 아빠와 함께 수리취떡을 만들고 있어요.)","함정: ②는 만드는 법을 설명하는 게 아니라 만든 일을 말해서 ✕"],"why":"단오날에 아빠와 수리취떡을 만든 일을 소개하는 말이다."}],"dlg":[["B","Welcome to Jisu's channel! Today is a traditional Korean holiday, Dano. So I'm making surichwitteok with my dad now. It's rice cake with a wheel pattern. It's finally ready! It looks delicious. Would you like some?","지수의 채널에 오신 것을 환영합니다! 오늘은 한국의 전통 명절인 단오예요. 그래서 지금 아빠와 함께 수리취떡을 만들고 있어요. 수레바퀴 무늬가 있는 떡이에요. 드디어 다 됐어요! 맛있어 보여요. 좀 드실래요?"]]},{"qs":[{"n":4,"q":"위 대화의 내용을 요약한 아래 문장의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["baking - cookies","baking - cakes","dancing - cookies","swimming - candies","baking - candies"],"a":0,"ans":"baking - cookies","evs":[["I went to a baking class on Saturday.","나는 토요일에 제빵 수업에 갔어."],["I made apple pies and chocolate cookies.","나는 사과 파이와 초콜릿 쿠키를 만들었어."]],"ev":["I went to a baking class on Saturday.","나는 토요일에 제빵 수업에 갔어."],"ow":["정답 ○ — \"I went to a baking class on Saturday.\"(토요일에 제빵 수업에 갔어.)와 \"I made apple pies and chocolate cookies.\"(사과 파이와 초콜릿 쿠키를 만들었어.)에 맞으므로 baking - cookies이다.","오답 ✕ — 수업은 baking이 맞지만 \"chocolate cookies\"(초콜릿 쿠키)를 만들었다고 했지 cakes(케이크)는 나오지 않아서 틀림.","오답 ✕ — \"I went to a baking class\"(제빵 수업에 갔어.)라고 했는데 dancing(춤) 수업은 아니라서 틀림.","오답 ✕ — 수업은 baking class이고 만든 것도 \"chocolate cookies\"인데 swimming, candies는 지문에 없어서 틀림.","오답 ✕ — 수업은 baking이 맞지만 \"chocolate cookies\"(초콜릿 쿠키)를 만들었다고 했지 candies(사탕)는 나오지 않아서 틀림."],"memo":["정답: baking - cookies (제빵 수업, 초콜릿 쿠키)","근거: I went to a baking class on Saturday. / I made apple pies and chocolate cookies.","②⑤는 baking은 맞지만 cakes, candies가 없어서 ✕"],"why":"Jason은 토요일 제빵 수업에서 사과 파이와 초콜릿 쿠키를 만들었다.","sum":"Jason went to a (A) class on Saturday and made apple pies and chocolate (B).","lab":"완성된 요약문 : "}],"dlg":[["Mina","How was your weekend, Jason?","주말은 어땠어, Jason?"],["Jason","It was good. I went to a baking class on Saturday.","좋았어. 나는 토요일에 제빵 수업에 갔어."],["Mina","Oh, what did you make?","오, 뭘 만들었니?"],["Jason","I made apple pies and chocolate cookies.","나는 사과 파이와 초콜릿 쿠키를 만들었어."],["Mina","Sounds delicious!","맛있겠다!"],["Jason","I brought some of them with me. Would you like some, Mina?","그중 몇 개를 가져왔어. 좀 먹을래, Mina?"],["Mina","Sure. Wow, they're so good.","그래. 와, 정말 맛있다."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["The girl is cooking a kebab.","The man asks if the girl wants a drink.","The girl orders a sandwich.","The girl does not want any drink.","The girl orders apple juice."],"a":1,"ans":"The man asks if the girl wants a drink.","evs":[["M: Would you like a drink?","음료도 드시겠어요?"],["G: Sure. Orange juice, please.","네. 오렌지 주스 주세요."]],"ev":["M: Would you like a drink?","음료도 드시겠어요?"],"ow":["오답 ✕ — 'Yes, I'll have a kebab.'(네, 케밥 하나 주세요.)라고 했으니 여자아이는 케밥을 주문하는 중이다. 직접 만드는 것이 아니라서 틀림.","정답 ○ — 남자가 'Would you like a drink?'(음료도 드시겠어요?)라고 물었으므로 음료를 원하는지 묻는 것이 맞다.","오답 ✕ — 여자아이는 'I'll have a kebab.'(케밥 하나 주세요.)라고 했다. 샌드위치가 아니라 케밥이라서 틀림.","오답 ✕ — 'Sure. Orange juice, please.'(네. 오렌지 주스 주세요.)라고 했으므로 음료를 원한다. 원하지 않는다는 보기는 틀림.","오답 ✕ — 'Orange juice, please.'(오렌지 주스 주세요.)라고 했다. 사과 주스가 아니라 오렌지 주스라서 틀림."],"memo":["정답 ②: 남자는 여자아이에게 음료를 원하는지 묻는다.","근거: Would you like a drink?(음료도 드시겠어요?)","함정: ⑤는 오렌지 주스를 주문해서 사과 주스가 아니라서 ✕"],"why":"식당에서 케밥과 오렌지 주스를 주문하는 대화이다."}],"dlg":[["M","Hello. Are you ready to order?","안녕하세요. 주문하시겠어요?"],["G","Yes, I'll have a kebab.","네, 케밥 하나 주세요."],["M","Would you like a drink?","음료도 드시겠어요?"],["G","Sure. Orange juice, please.","네. 오렌지 주스 주세요."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["William could eat daetongbap in Damyang.","Tteokgalbi was too hard and difficult for chewing.","The fishermen in Tongyeong stopped eating chungmugimbap long ago.","Dombegogi is soft beef on a cutting board.","Dombe means \"delicious food\" in Jeju's language."],"a":0,"ans":"William could eat daetongbap in Damyang.","evs":[["After we looked around, we ate two local dishes, daetongbap and tteokgalbi.","주변을 둘러본 후에, 우리는 두 가지 지역 음식인 대통밥과 떡갈비를 먹었다."],["Daetongbap is rice in a bamboo bowl.","대통밥은 대나무 그릇에 담긴 밥이다."]],"ev":["After we looked around, we ate two local dishes, daetongbap and tteokgalbi.","주변을 둘러본 후에, 우리는 두 가지 지역 음식인 대통밥과 떡갈비를 먹었다."],"ow":["정답 ○ — 'we went to Damyang'(담양에 갔다)과 'we ate two local dishes, daetongbap and tteokgalbi'(대통밥과 떡갈비를 먹었다)이므로 William은 담양에서 대통밥을 먹었다.","오답 ✕ — 'Tteokgalbi, a Korean beef dish, was soft and sweet.'(떡갈비는 부드럽고 달콤했다.)라고 했는데 이 보기는 너무 딱딱했다고 해서 틀림.","오답 ✕ — 'fishermen in this town started to eat chungmugimbap'(어부들이 충무김밥을 먹기 시작했다)고만 했고 그만두었다는 말은 없다.","오답 ✕ — 돔베고기는 'it was pork on a cutting board'(도마 위의 돼지고기)이다. 소고기가 아니라서 틀림.","오답 ✕ — 'It means a cutting board in Jeju's language.'(제주 말로 도마를 의미한다.)라고 했다. '맛있는 음식'이 아니라서 틀림."],"memo":["정답 ①: William은 담양에서 대통밥을 먹었다.","근거: we ate two local dishes, daetongbap and tteokgalbi(대통밥과 떡갈비를 먹었다)","함정: ④ 돔베고기는 소고기가 아니라 돼지고기라서 ✕"],"why":"담양에서 대통밥과 떡갈비를 먹었다는 점을 확인하는 문제이다."}],"pp":[["During the summer vacation, William traveled around Korea with his family.","여름 방학 동안, William은 가족과 함께 한국 여기저기를 여행했다."],["This is his food diary.","이것은 그의 음식 일기이다."],["July 25","7월 25일"],["We went to Damyang and visited Jungnogwon, a famous bamboo garden.","우리는 담양에 갔고 유명한 대나무 정원인 죽녹원을 방문했다."],["We enjoyed walking in the garden.","우리는 정원에서 걷는 것을 즐겼다."],["After we looked around, we ate two local dishes, daetongbap and tteokgalbi.","주변을 둘러본 후에, 우리는 두 가지 지역 음식인 대통밥과 떡갈비를 먹었다."],["Daetongbap is rice in a bamboo bowl.","대통밥은 대나무 그릇에 담긴 밥이다."],["I loved its unique bamboo smell.","나는 그것의 독특한 대나무 향이 매우 좋았다."],["Tteokgalbi, a Korean beef dish, was soft and sweet.","한국의 소고기 요리인 떡갈비는 부드럽고 달콤했다."],["The dishes really went well together.","그 요리들은 함께 정말 잘 어울렸다."]]},{"qs":[{"n":7,"q":"윗글의 내용과 일치하는 것은?","o":["충무는 통영의 옛 이름이다.","충무김밥에는 밥이 들어 있지 않았다.","우리는 산 근처에서 지역 식당을 발견했다.","어부들은 충무김밥이 만들기 쉬워서 먹기 시작했다.","우리는 통영을 방문하여 차를 타고 산에 올라갔다."],"a":0,"ans":"충무는 통영의 옛 이름이다.","evs":[["Chungmu is an old name for Tongyeong.","충무는 통영의 옛 이름이다."],["Near the sea, we found a local restaurant and ate chungmugimbap.","바다 근처에서 우리는 현지 식당을 찾았고 충무김밥을 먹었다."]],"ev":["Chungmu is an old name for Tongyeong.","충무는 통영의 옛 이름이다."],"ow":["정답 ○ — 'Chungmu is an old name for Tongyeong.'(충무는 통영의 옛 이름이다.)라고 직접 말했다.","오답 ✕ — 'There was only rice inside the seaweed.'(김 안에는 오직 밥만 있었다.)라고 했다. 밥이 없었던 것이 아니라 밥만 있었다.","오답 ✕ — 식당은 'Near the sea'(바다 근처)에서 찾았다. 산 근처가 아니라서 틀림.","오답 ✕ — 어부들은 'it did not go bad quickly'(빨리 상하지 않았기 때문에) 먹기 시작했다. 만들기 쉬워서가 아니라서 틀림.","오답 ✕ — 'went up the mountain by cable car'(케이블카를 타고 산에 올라갔다)이다. 차가 아니라 케이블카라서 틀림."],"memo":["정답 ①: 충무는 통영의 옛 이름이다.","근거: Chungmu is an old name for Tongyeong.(충무는 통영의 옛 이름이다.)","함정: ⑤ 차가 아니라 케이블카를 타고 올라가서 ✕"],"why":"충무는 통영의 옛 이름이라는 내용을 확인하는 문제이다."},{"n":8,"q":"윗글의 내용을 요약한 아래 문장의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["rice - go bad","squid - go bad","rice - taste spicy","vegetables - get cold","kimchi - cost much"],"a":0,"ans":"rice - go bad","evs":[["There was only rice inside the seaweed.","김 안에는 오직 밥만 있었다."],["Long ago, fishermen in this town started to eat chungmugimbap because it did not go bad quickly.","오래전에, 이 마을의 어부들은 이 음식이 빨리 상하지 않았기 때문에 충무김밥을 먹기 시작했다."]],"ev":["There was only rice inside the seaweed.","김 안에는 오직 밥만 있었다."],"ow":["정답 ○ — 'There was only rice inside the seaweed.'(김 안에는 오직 밥만 있었다.)이고, 'it did not go bad quickly'(빨리 상하지 않았다)이므로 rice - go bad가 맞다.","오답 ✕ — (B)는 맞지만 (A)가 틀렸다. 오징어는 'Kimchi and spicy squid were on the side.'(옆에 있었다)라고 했으니 김 안이 아니라 곁들이 음식이다.","오답 ✕ — (A) rice는 맞지만 (B)가 틀렸다. 어부들이 먹기 시작한 이유는 'did not go bad quickly'(빨리 상하지 않아서)이고, 맵기와는 관계가 없다.","오답 ✕ — 김 안에는 채소가 아니라 'only rice'(오직 밥)만 있었다. 또 식는지에 대한 이유도 지문에 없다.","오답 ✕ — 김치는 'on the side'(옆에)에 있었다. 김 안이 아니며, 값이 많이 든다는 말도 지문에 없다."],"memo":["정답 ①: rice - go bad","근거: There was only rice inside the seaweed.(김 안에는 오직 밥만 있었다.)","함정: ②는 오징어가 김 안이 아니라 옆에 있어서 ✕"],"why":"충무김밥은 밥만 들어 있고 빨리 상하지 않아서 어부들이 먹기 시작했다.","sum":"Chungmugimbap has only (A) ______ inside the seaweed, and fishermen started to eat it because it did not (B) ______ quickly.","lab":"완성된 요약문 : "}],"pp":[["July 30","7월 30일"],["We visited Tongyeong and went up the mountain by cable car.","우리는 통영을 방문했고 케이블카를 타고 산에 올라갔다."],["Seeing the blue ocean and the green islands was fantastic!","파란 바다와 녹색의 섬들을 보는 것은 환상적이었다!"],["Near the sea, we found a local restaurant and ate chungmugimbap.","바다 근처에서 우리는 현지 식당을 찾았고 충무김밥을 먹었다."],["It wasn't like other types of gimbap.","그것은 다른 종류의 김밥과는 달랐다."],["There was only rice inside the seaweed.","김 안에는 오직 밥만 있었다."],["Kimchi and spicy squid were on the side.","김치와 매운 오징어가 옆에 있었다."],["It was spicy but really delicious.","그것은 매웠지만 정말 맛있었다."],["I heard about the history of this food.","나는 이 음식의 역사에 관해 들었다."],["Chungmu is an old name for Tongyeong.","충무는 통영의 옛 이름이다."],["Long ago, fishermen in this town started to eat chungmugimbap because it did not go bad quickly.","오래전에, 이 마을의 어부들은 이 음식이 빨리 상하지 않았기 때문에 충무김밥을 먹기 시작했다."]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["The family went to Jeju-do on a cold day.","Dombegogi was beef on a plate.","The meat of dombegogi was very hard.","They ate dombegogi with a special fish sauce.","Dombe means a plate in Jeju's language."],"a":3,"ans":"They ate dombegogi with a special fish sauce.","evs":[["I had it with a special fish sauce, and the sauce was great, too.","나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다."],["First, it was pork on a cutting board, not on a plate.","첫째로, 그것은 접시 위가 아닌 도마 위의 돼지고기였다."]],"ev":["I had it with a special fish sauce, and the sauce was great, too.","나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다."],"ow":["오답 ✕ — 'We went there on a very hot day'(매우 더운 날에 갔다)라고 했는데 이 보기는 추운 날이라고 해서 틀림.","오답 ✕ — 'it was pork on a cutting board, not on a plate'(접시 위가 아닌 도마 위의 돼지고기)였다. 소고기도, 접시도 아니라서 틀림.","오답 ✕ — 'Second, the meat was so soft!'(고기가 아주 부드러웠다!)라고 했는데 이 보기는 딱딱했다고 해서 틀림.","정답 ○ — 'I had it with a special fish sauce'(나는 그것을 특별한 생선 소스와 함께 먹었다)고 했으므로 지문과 같다.","오답 ✕ — 'It means a cutting board in Jeju's language.'(제주 말로 도마를 의미한다.)라고 했다. 접시가 아니라 도마라서 틀림."],"memo":["정답 ④: 돔베고기는 특별한 생선 소스와 함께 먹었다.","근거: I had it with a special fish sauce(나는 그것을 특별한 생선 소스와 함께 먹었다)","함정: ⑤ 돔베는 접시가 아니라 도마를 뜻해서 ✕"],"why":"제주도에서 도마 위의 돼지고기(돔베고기)를 생선 소스와 먹었다."}],"pp":[["August 2","8월 2일"],["Jeju-do is a beautiful island in Korea.","제주도는 한국의 아름다운 섬이다."],["We went there on a very hot day, and we became tired.","우리는 매우 더운 날에 거기에 갔고 피곤해졌다."],["However, we got our energy back thanks to dombegogi.","그러나 돔베고기 덕분에 우리는 기운을 되찾았다."],["It surprised me in two ways.","그것은 두 가지 면으로 나를 놀라게 했다."],["First, it was pork on a cutting board, not on a plate.","첫째로, 그것은 접시 위가 아닌 도마 위의 돼지고기였다."],["Second, the meat was so soft!","둘째로, 고기가 아주 부드러웠다!"],["I had it with a special fish sauce, and the sauce was great, too.","나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다."],["Later, I learned about the meaning of dombe.","나중에 나는 돔베의 의미에 대해 배웠다."],["It means a cutting board in Jeju's language.","그것은 제주 말로 도마를 의미한다."]]},{"qs":[{"n":10,"q":"윗글의 주제로 알맞은 것은?","o":["serving food in different plates and boards","famous tourist spots for foreigners in Korea","stories behind local Korean food names","local dishes in different parts of Korea","recipes for making local Korean food"],"a":3,"ans":"local dishes in different parts of Korea","evs":[["This is his food diary.","이것은 그의 음식 일기이다."],["Near the sea, we found a local restaurant and ate chungmugimbap.","바다 근처에서 우리는 현지 식당을 찾았고 충무김밥을 먹었다."],["However, we got our energy back thanks to dombegogi.","그러나 돔베고기 덕분에 우리는 기운을 되찾았다."]],"ev":["This is var BK='m-find-r'+RNUM+'-best';
var secs=[],cur=null;
D.forEach(function(it,i){if(it.tag||!cur){cur={name:it.tag||'',items:[]};secs.push(cur)}cur.items.push(i)});
var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}

 return h;
}

 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}

 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}

function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';

function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});

 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}

var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}

document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
