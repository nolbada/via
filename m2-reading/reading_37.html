eam of 28 men in August 1914.", "그는 1914년 8월에 28명의 팀원들로 구성된 팀과 함께 남극 대륙으로 향했다.", 0], ["On January 20, 1915, Shackleton's team was crossing the sea near Antarctica.", "1915년 1월 20일, Shackleton의 팀은 남극 대륙 근처 바다를 건너고 있었다.", 0], ["Suddenly, the ship hit thick ice and got stuck.", "갑자기 배가 두꺼운 얼음에 부딪혔고 갇혀버렸다.", 0], ["The men had to wait until the winter passed.", "사람들은 겨울이 지나갈 때까지 기다려야 했다.", 0], ["Nine long months passed and the ice started melting.", "아홉 달이라는 긴 시간이 지나고 얼음이 녹기 시작했다.", 0], ["But, the ship was broken into pieces by the ice.", "하지만 얼음이 배를 산산조각 냈다.", 0], ["The ship started sinking.", "배는 가라앉기 시작했다.", 0], ["I ordered my men, \"Give up the ship. She's going down!\"", "나는 팀원들에게 명령했다. \"그 배를 포기해라. 배가 가라앉고 있다!\"", 0], ["The ship has sunk under the water today.", "오늘 배가 물속에 가라앉아 버렸다.", 0], ["We lost our home and we had to make a camp on the ice.", "우리는 집을 잃었고 얼음 위에 캠프를 만들어야 했다.", 0], ["All I can do is to keep strong for my men.", "내가 할 수 있는 전부는 내 팀원들을 위해 강하게 버티는 것이다.", 0], ["My dream to go to Antarctica is broken, but I've set a new goal.", "남극 대륙으로 가려던 나의 꿈은 깨졌지만, 나는 새로운 목표 하나를 세웠다.", 0], ["I'll make my men return home safely.", "나는 내 팀원들이 안전하게 집으로 돌아갈 수 있도록 할 것이다.", 0], ["I had my men get on the three lifeboats to go to Elephant Island.", "Elephant Island에 가기 위해 나는 팀원들을 세 척의 구명보트에 타도록 했다.", 0], ["We got to the island today.", "우리는 오늘 그 섬에 도착했다.", 0], ["It took us 7 days on the sea to get to the island.", "그 섬에 도착하는 데 우리는 바다 위에서 7일을 보냈다.", 0], ["And after 497 days, we finally stood on land again.", "그리고 497일이 지난 후에야 우리는 마침내 땅 위에 다시 섰다.", 0], ["But, there is no help on this island.", "하지만 이 섬에서는 어떤 도움도 얻을 수 없다.", 0], ["There is little food to eat and the weather is so cold.", "먹을 음식도 거의 없고 날씨는 매우 춥다.", 0], ["We can get help in South Georgia.", "우리는 South Georgia에서 도움을 받을 수 있다.", 0], ["The island is 1,300 kilometers away and a sea of death is in front of us.", "그 섬은 1,300 킬로미터나 떨어져 있고 죽음의 바다가 우리 앞에 있다.", 0], ["But I should do this for my men.", "하지만 나의 팀원들을 위해 나는 이것을 해야 한다.", 0], ["I set out for South Georgia today.", "나는 오늘 South Georgia를 향해 떠난다.", 0], ["Shackleton and five of his men fought against big waves and strong winds for 16 days.", "Shackleton과 그의 팀원 다섯 명은 16일 동안 큰 파도와 강한 바람에 맞서 싸웠다.", 0], ["Finally, they made it to South Georgia.", "마침내 그들은 South Georgia에 이르렀다.", 0], ["They got help from there and went back to Elephant Island.", "그들은 그곳에서 도움을 받아 Elephant Island로 돌아갔다.", 0], ["When the men on the island saw the ship, they all shouted for joy.", "섬에 있던 팀원들이 배를 보았을 때, 모두 기뻐서 외쳤다.", 0], ["Not a single life was lost!", "단 한 명의 생명도 잃지 않았다!", 0], ["Everyone was saved.", "모든 사람이 구조되었다.", 0]];var RNUM=37;var TITLE_EN="Great Failure";var PASS_EN=["Great Failure", "Ernest Shackleton was one of many people who explored new lands in the early 1900s. He headed for Antarctica with a team of 28 men in August 1914. On January 20, 1915, Shackleton's team was crossing the sea near Antarctica. Suddenly, the ship hit thick ice and got stuck. The men had to wait until the winter passed.", "Nine long months passed and the ice started melting. But, the ship was broken into pieces by the ice. The ship started sinking. I ordered my men, \"Give up the ship. She's going down!\"", "The ship has sunk under the water today. We lost our home and we had to make a camp on the ice. All I can do is to keep strong for my men. My dream to go to Antarctica is broken, but I've set a new goal. I'll make my men return home safely.", "I had my men get on the three lifeboats to go to Elephant Island. We got to the island today. It took us 7 days on the sea to get to the island. And after 497 days, we finally stood on land again. But, there is no help on this island. There is little food to eat and the weather is so cold.", "We can get help in South Georgia. The island is 1,300 kilometers away and a sea of death is in front of us. But I should do this for my men. I set out for South Georgia today.", "Shackleton and five of his men fought against big waves and strong winds for 16 days. Finally, they made it to South Georgia. They got help from there and went back to Elephant Island. When the men on the island saw the ship, they all shouted for joy. Not a single life was lost! Everyone was saved."];var PASS_KO=["위대한 실패", "Ernest Shackleton은 1900년대 초에 새로운 땅을 탐험한 많은 사람들 중 한 명이었다. 그는 1914년 8월에 28명의 팀원들로 구성된 팀과 함께 남극 대륙으로 향했다. 1915년 1월 20일, Shackleton의 팀은 남극 대륙 근처 바다를 건너고 있었다. 갑자기 배가 두꺼운 얼음에 부딪혔고 갇혀버렸다. 사람들은 겨울이 지나갈 때까지 기다려야 했다.", "아홉 달이라는 긴 시간이 지나고 얼음이 녹기 시작했다. 하지만 얼음이 배를 산산조각 냈다. 배는 가라앉기 시작했다. 나는 팀원들에게 명령했다. \"그 배를 포기해라. 배가 가라앉고 있다!\"", "오늘 배가 물속에 가라앉아 버렸다. 우리는 집을 잃었고 얼음 위에 캠프를 만들어야 했다. 내가 할 수 있는 전부는 내 팀원들을 위해 강하게 버티는 것이다. 남극 대륙으로 가려던 나의 꿈은 깨졌지만, 나는 새로운 목표 하나를 세웠다. 나는 내 팀원들이 안전하게 집으로 돌아갈 수 있도록 할 것이다.", "Elephant Island에 가기 위해 나는 팀원들을 세 척의 구명보트에 타도록 했다. 우리는 오늘 그 섬에 도착했다. 그 섬에 도착하는 데 우리는 바다 위에서 7일을 보냈다. 그리고 497일이 지난 후에야 우리는 마침내 땅 위에 다시 섰다. 하지만 이 섬에서는 어떤 도움도 얻을 수 없다. 먹을 음식도 거의 없고 날씨는 매우 춥다.", "우리는 South Georgia에서 도움을 받을 수 있다. 그 섬은 1,300 킬로미터나 떨어져 있고 죽음의 바다가 우리 앞에 있다. 하지만 나의 팀원들을 위해 나는 이것을 해야 한다. 나는 오늘 South Georgia를 향해 떠난다.", "Shackleton과 그의 팀원 다섯 명은 16일 동안 큰 파도와 강한 바람에 맞서 싸웠다. 마침내 그들은 South Georgia에 이르렀다. 그들은 그곳에서 도움을 받아 Elephant Island로 돌아갔다. 섬에 있던 팀원들이 배를 보았을 때, 모두 기뻐서 외쳤다. 단 한 명의 생명도 잃지 않았다! 모든 사람이 구조되었다."];var DG=[{"dlg": [["W", "How did you do in the piano contest?", "피아노 대회는 어떻게 됐니?"], ["M", "I didn't do very well.", "잘 못했어."], ["W", "You practiced a lot. What happened?", "너 연습 많이 했잖아. 무슨 일이 있었니?"], ["M", "I made too many mistakes.", "실수를 너무 많이 했어."], ["W", "Don't worry. You'll do better next time.", "걱정하지 마. 다음번엔 더 잘할 거야."]], "qs": [{"n": 1, "q": "위 대화의 주제로 알맞은 것은?", "o": ["the man's plan to join a piano contest", "the man's poor result in a piano contest", "the man's reason for not entering the contest", "the woman's advice on how to practice piano", "the woman's mistake during a piano performance"], "a": 1, "ans": "the man's poor result in a piano contest", "evs": [["M: I didn't do very well.", "잘 못했어."], ["M: I made t
