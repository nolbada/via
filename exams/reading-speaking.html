"fx":[{"w":"play","r":"playing","at":2,"t":"동명사","m":"How about 뒤에는 동명사 playing 사용"}]},{"n":19,"en":"\"Well, Larry is NOT an snake. Look!","ko":"\"글쎄, Larry는 뱀이 아니야. 봐!","fx":[{"w":"an","r":"a","at":4,"t":"관사 a/an","m":"snake는 자음 소리이므로 a 사용"}]},{"n":20,"en":"These website says iguanas like dark places. Let's make the room darkly,\" Jenny says.","ko":"이 웹사이트에 따르면 이구아나는 어두운 곳을 좋아한대. 교실을 어둡게 해 보자.\"라고 Jenny가 말한다.","fx":[{"w":"These","r":"This","at":0,"t":"지시형용사","m":"단수명사 website 앞에는 This 사용"},{"w":"darkly","r":"dark","at":11,"t":"형용사와 부사","m":"make의 목적보어 자리에는 형용사 dark 사용"}]},{"n":21,"en":"So, we turn off the lights and closes the curtains. We wait, but nothing happens.","ko":"그래서, 우리는 불을 끄고 커튼을 닫는다. 우리는 기다리지만, 아무 일도 일어나지 않는다.","fx":[{"w":"closes","r":"close","at":7,"t":"병렬구조","m":"we turn off와 병렬이므로 close 사용"}]},{"n":22,"en":"\"Larry must be hungry because he ate nothing today,\" I say. Mike says, \"I have an banana.","ko":"\"Larry는 오늘 아무것도 안 먹었으니 배가 고플 거야.\"라고 내가 말한다. Mike가 말한다. \"나는 바나나가 하나 있어.","fx":[{"w":"an","r":"a","at":15,"t":"관사 a/an","m":"banana는 자음 소리이므로 a 사용"}]},{"n":23,"en":"It's Larry's favorite snack. Let's put them next to the cage.\"","ko":"그건 Larry가 가장 좋아하는 간식이지. 그것을 케이지 옆에 놓아두자.\"","fx":[{"w":"them","r":"it","at":6,"t":"대명사의 수 일치","m":"banana를 가리키므로 단수 대명사 it 사용"}]},{"n":24,"en":"We wait quiet. A little later, we hear little footsteps.","ko":"우리는 조용히 기다린다. 잠시 후, 우리는 작은 발소리를 듣는다.","fx":[{"w":"quiet","r":"quietly","at":2,"t":"형용사와 부사","m":"동사 wait를 꾸미는 부사 quietly 사용"}]},{"n":25,"en":"It is Larry! We find him under the locker who is at the back of the classroom.","ko":"Larry다! 우리는 교실 뒤편에 있는 사물함 아래에서 그를 발견한다.","fx":[{"w":"who","r":"which","at":9,"t":"관계대명사","m":"사물 locker에는 관계대명사 which 사용"}]},{"n":27,"en":"We all shouts for joy! And I am the most happiest one.","ko":"우리는 모두 기뻐서 소리친다! 그리고 내가 가장 행복한 사람이다.","fx":[{"w":"shouts","r":"shout","at":2,"t":"주어와 동사의 수일치","m":"주어 We에는 shout 사용"},{"w":"most happiest","r":"happiest","at":9,"t":"최상급","m":"happiest가 이미 최상급이므로 most 불필요"}]}]},{"no":"18","t":"Let's Learn First Aid","q":[{"n":1,"en":"Accident can happen anytime, anywhere. However, knowing first aid can stop situations from getting worse.","ko":"사고는 언제 어디서든 일어날 수 있다. 하지만 응급 처치를 알면 상황이 더 나빠지는 것을 막을 수 있다.","fx":[{"w":"Accident","r":"Accidents","at":0,"t":"명사의 복수형","m":"일반적 사고는 복수 Accidents 사용"}]},{"n":2,"en":"If you have basic first aid skill, you can help yourself and others who are on need.","ko":"만약 여러분이 기본적인 응급 처치법을 알고 있다면 여러분 자신과 도움이 필요한 다른 사람들을 도울 수 있다.","fx":[{"w":"skill","r":"skills","at":6,"t":"명사의 복수형","m":"기술 여러 개는 복수 skills 사용"},{"w":"on","r":"in","at":15,"t":"기본전치사","m":"'도움이 필요한'은 in need 사용"}]},{"n":3,"en":"This morning, Katie was making a apple pie for her family. When she opened the oven, a delicious smell filled the kitchen.","ko":"오늘 아침 Katie는 식구들을 위해 애플파이를 만들고 있었다. 그녀가 오븐을 열었을 때 맛있는 냄새가 부엌을 가득 채웠다.","fx":[{"w":"a","r":"an","at":5,"t":"관사 a/an","m":"모음 소리 a 앞에는 an apple 사용"}]},{"n":4,"en":"In excitement, she grabbed the pan with she bare hands. \"Ouch!\"","ko":"흥분한 나머지 그녀는 맨손으로 팬을 잡았다. \"아야!\"","fx":[{"w":"she","r":"her","at":7,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 her 사용"}]},{"n":5,"en":"Her fingers that touched the hot pan turned redly and started to hurting.","ko":"뜨거운 팬에 닿은 그녀의 손가락들은 붉어졌고 아프기 시작했다.","fx":[{"w":"redly","r":"red","at":8,"t":"형용사와 부사","m":"turn 뒤 보어는 형용사 red 사용"},{"w":"hurting","r":"hurt","at":12,"t":"to부정사","m":"to 뒤에는 동사원형 hurt 사용"}]},{"n":6,"en":"1. Cool the burn under run water for more than 10 minute.","ko":"1. 데인 곳을 10분 이상 동안 흐르는 물 아래에서 식혀라.","fx":[{"w":"run","r":"running","at":5,"t":"현재분사","m":"'흐르는 물'은 현재분사 running 사용"},{"w":"minute","r":"minutes","at":11,"t":"명사의 복수형","m":"10 뒤에는 복수명사 minutes 사용"}]},{"n":7,"en":"2. Do not use ice. It can damages the skin.","ko":"2. 얼음을 사용하지 마라. 그것은 피부를 손상시킬 수 있다.","fx":[{"w":"damages","r":"damage","at":7,"t":"조동사","m":"can 뒤에는 동사원형 damage 사용"}]},{"n":8,"en":"One sunny afternoons, Yunho and his classmates was watering the plants in the school garden.","ko":"어느 맑은 날 오후, 윤호와 그의 반 친구들은 학교 정원에서 화초에 물을 주고 있었다.","fx":[{"w":"afternoons","r":"afternoon","at":2,"t":"명사의 단수형","m":"One 뒤에는 단수명사 afternoon 사용"},{"w":"was","r":"were","at":7,"t":"be동사의 수일치","m":"복수 주어에는 were 사용"}]},{"n":10,"en":"The students ran and screamed, and the peacefully garden turned into chaos. \"Ouch!\"","ko":"학생들은 뛰어다니며 소리쳤고, 고요했던 정원은 아수라장으로 바뀌었다. \"아야!\"","fx":[{"w":"peacefully","r":"peaceful","at":7,"t":"형용사와 부사","m":"명사 garden 앞에는 형용사 peaceful 사용"}]},{"n":11,"en":"A bee stung Yunho on the forehead. He tried to removing the stinger with him fingers, but he could not.","ko":"벌 한 마리가 윤호의 이마를 쏘았다. 그는 손가락으로 벌침을 제거하려고 했지만 할 수 없었다.","fx":[{"w":"removing","r":"remove","at":10,"t":"to부정사","m":"tried to 뒤에는 동사원형 remove 사용"},{"w":"him","r":"his","at":14,"t":"인칭대명사의 소유격","m":"명사 fingers 앞에는 소유격 his 사용"}]},{"n":13,"en":"1. Look for something that looks like an black dot. That is the stinger.","ko":"1. 검은 점처럼 보이는 것을 찾아라. 그것이 벌침이다.","fx":[{"w":"an","r":"a","at":7,"t":"관사 a/an","m":"자음 소리 b 앞에는 a black 사용"}]},{"n":14,"en":"2. Remove them with a flat object like a student ID cards.","ko":"2. 학생증과 같이 납작한 물건으로 그것을 제거하라.","fx":[{"w":"them","r":"it","at":2,"t":"인칭대명사","m":"stinger(단수)를 가리키므로 it 사용"},{"w":"cards","r":"card","at":11,"t":"명사의 복수형","m":"a 뒤에는 단수명사 card 사용"}]},{"n":15,"en":"3. Wash the area of soap and cool water.","ko":"3. 쏘인 곳을 비누와 찬물로 씻어라.","fx":[{"w":"of","r":"with","at":4,"t":"기본전치사","m":"'~로 씻다'는 with soap 사용"}]}]},{"no":"19","t":"Now One Foot, Now the Other","q":[{"n":1,"en":"Bobby got him name from his grandfather, Bob. Bob was his most good friend.","ko":"Bobby는 할아버지인 Bob을 따라 이름 지어졌다. Bob은 그의 가장 친한 친구였다.","fx":[{"w":"him","r":"his","at":2,"t":"인칭대명사의 소유격","m":"명사 name 앞에는 소유격 his 사용"},{"w":"most good","r":"best","at":11,"t":"최상급","m":"good의 최상급은 best 사용"}]},{"n":3,"en":"\"Hold me hands, Bobby,\" Bob said.","ko":"\"내 손을 잡아, Bobby.\" Bob이 말했다.","fx":[{"w":"me","r":"my","at":1,"t":"인칭대명사의 소유격","m":"명사 hands 앞에는 소유격 my 사용"}]},{"n":4,"en":"\"Now one feet, now the other.\"","ko":"\"자, 한 발, 이제 다른 발.\"","fx":[{"w":"feet","r":"foot","at":2,"t":"불규칙 복수형","m":"one 뒤에는 단수 foot 사용"}]},{"n":5,"en":"Bob and Bobby often played with old wooden blocks. They slowly piled the blocks one by one to building a tower.","ko":"Bob과 Bobby는 종종 오래된 나무 블록을 가지고 놀았다. 그들은 탑을 만들기 위해 블록을 하나씩 천천히 쌓았다.","fx":[{"w":"building","r":"build","at":18,"t":"to부정사","m":"목적 to 뒤는 동사원형: to build"}]},{"n":6,"en":"\"There is one more blocks to put,\" Bob said.","ko":"\"이제 쌓을 블록이 하나 더 있어.\" Bob이 말했다.","fx":[{"w":"blocks","r":"block","at":4,"t":"명사의 단수형","m":"one more 뒤에는 단수명사 block 사용"}]},{"n":8,"en":"Bobby careful put the elephant block on the top. But Bob sneezed, and the tower falled.","ko":"Bobby는 코끼리 블록을 조심스럽게 꼭대기에 놓았다. 그런데 Bob이 재채기를 했고, 탑이 무너졌다.","fx":[{"w":"careful","r":"carefully","at":1,"t":"형용사와 부사","m":"동사 put을 꾸미는 부사 carefully 사용"},{"w":"falled","r":"fell","at":15,"t":"불규칙 과거형","m":"fall의 과거형은 fell"}]},{"n":9,"en":"Bobby laughed and laughed. Bobby said, \"You always sneezes when the elephant block appears.\"","ko":"Bobby는 웃고 또 웃었다. Bobby가 말했다. \"할아버지는 코끼리 블록이 나오면 항상 재채기를 하시네요.\"","fx":[{"w":"sneezes","r":"sneeze","at":8,"t":"일반동사의 수일치","m":"주어 You에는 -s 없음: sneeze"}]},{"n":10,"en":"Time passed. One day, Bobby's dad looked very sadly.","ko":"시간이 흘렀다. 어느 날, Bobby의 아빠는 매우 슬퍼 보였다.","fx":[{"w":"sadly","r":"sad","at":8,"t":"형용사와 부사","m":"look 뒤 보어 자리에는 형용사 sad 사용"}]},{"n":11,"en":"He told to Bobby, \"Bob fell ill. He is in an hospital which is far from here.\"","ko":"아빠는 Bobby에게 말했다. \"할아버지께서 편찮으셔. 할아버지는 여기서 멀리 떨어진 병원에 계셔.\"","fx":[{"w":"to Bobby","r":"Bobby","at":2,"t":"4형식 동사 tell","m":"tell 뒤에는 to 없이 사람 목적어 사용"},{"w":"an","r":"a","at":10,"t":"관사 a/an","m":"자음 소리 hospital 앞에는 a 사용"}]},{"n":13,"en":"\"You can't, Bobby,\" Mom told him. \"He can't move his arms and legs, and he can't talks.","ko":"\"그럴 수 없어, Bobby.\" 엄마가 그에게 말했다. \"할아버지는 팔과 다리를 못 움직이시고, 말씀도 못하셔.","fx":[{"w":"talks","r":"talk","at":16,"t":"조동사","m":"can't 뒤에는 동사원형 talk 사용"}]},{"n":14, he most good.","ko":"다음 상은… 급식실 직원 리더이신 이 선생님께 드립니다! 많은 학생들이 우리 학교 점심이 최고라고 말합니다.","fx":[{"w":"at","r":"to","at":4,"t":"기본전치사","m":"\"~에게 돌아가다\"는 go to 사용"},{"w":"most good","r":"best","at":22,"t":"최상급","m":"good의 최상급은 the best 사용"}]},{"n":11,"en":"Ms. Lee prepares fresh and delicious meals for us every days. At lunchtime, she serve us food with a big smile.","ko":"이 선생님은 매일 우리에게 신선하고 맛있는 식사를 준비해 주십니다. 점심시간에는 환하게 미소 지으며 우리에게 음식을 나눠 주십니다.","fx":[{"w":"days","r":"day","at":10,"t":"every 뒤 단수명사","m":"every 뒤에는 단수명사 day 사용"},{"w":"serve","r":"serves","at":14,"t":"3인칭 단수 현재형","m":"주어 she는 3인칭 단수: serves"}]},{"n":12,"en":"After the students leaves the cafeteria, she washes the dishes and cleans the cafeteria.","ko":"학생들이 급식실을 떠난 후에는, 설거지를 하시고 급식실을 청소하십니다.","fx":[{"w":"leaves","r":"leave","at":3,"t":"수일치","m":"주어 students(복수)에는 leave 사용"}]},{"n":13,"en":"\"I'm happy when students enjoys their lunches. I'm proud to serve delicious and healthily food.\"","ko":"\"학생들이 점심을 맛있게 먹을 때 저는 행복합니다. 맛있고 건강한 음식을 제공할 수 있어서 자랑스럽습니다.\"","fx":[{"w":"enjoys","r":"enjoy","at":4,"t":"일반동사의 수일치","m":"주어 students는 복수: enjoy"},{"w":"healthily","r":"healthy","at":13,"t":"형용사와 부사","m":"명사 food를 꾸미는 형용사 healthy 사용"}]}]},{"no":"22","t":"The Curious Story of the Chocolate Menu","q":[{"n":1,"en":"Student 1: You know what? Next week, our lunch is going to being all chocolate!","ko":"Student 1: 그거 알아? 다음 주에 우리 점심이 전부 초콜릿으로 나온대!","fx":[{"w":"being","r":"be","at":12,"t":"be going to","m":"to 뒤에는 동사원형 be 사용"}]},{"n":3,"en":"Grong: Well, everyone are talking about the chocolate menu. But don't the news sound strange?","ko":"Grong: 음, 모두가 초콜릿 메뉴에 대해 이야기하고 있군. 그런데 그 뉴스 좀 이상하지 않아?","fx":[{"w":"are","r":"is","at":3,"t":"주어와 동사의 수일치","m":"everyone은 단수 취급하므로 is 사용"},{"w":"don't","r":"doesn't","at":10,"t":"일반동사의 의문문","m":"단수 주어 news에는 doesn't 사용"}]},{"n":5,"en":"Acky: Yes, Grong. You is a school news reporter.","ko":"Acky: 맞아, Grong. 너는 학교 뉴스 기자잖아.","fx":[{"w":"is","r":"are","at":4,"t":"be동사의 현재형","m":"주어 You는 are (is 아님)"}]},{"n":6,"en":"You have to write a truly story about this.","ko":"넌 이 뉴스에 관한 진짜 이야기를 써야 해.","fx":[{"w":"truly","r":"true","at":5,"t":"형용사와 부사","m":"명사 story 앞에는 형용사 true 사용"}]},{"n":7,"en":"Grong: News that causes strongly feelings can be fake. Why don't we look into it together, Acky?","ko":"Grong: 강한 감정을 불러일으키는 뉴스는 가짜일 수 있어. Acky, 우리 같이 조사해 보는 게 어때?","fx":[{"w":"strongly","r":"strong","at":4,"t":"형용사와 부사","m":"명사 feelings 앞에는 형용사 strong 사용"}]},{"n":8,"en":"Acky: That's an good idea.","ko":"Acky: 그거 좋은 생각이야.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"good은 자음 소리로 시작하므로 a 사용"}]},{"n":9,"en":"Acky: Let's see. Where did these rumor start?","ko":"Acky: 어디 보자. 이 소문은 어디서 시작된 걸까?","fx":[{"w":"these","r":"this","at":5,"t":"지시형용사","m":"단수명사 rumor에는 this 사용"}]},{"n":10,"en":"Grong: This type of news usually have an online source. We need to search online with us smartphones!","ko":"Grong: 이런 종류의 뉴스는 주로 온라인 출처가 있어. 우리는 스마트폰으로 온라인에서 검색해 볼 필요가 있어!","fx":[{"w":"have","r":"has","at":6,"t":"주어와 동사의 수일치","m":"단수 주어 This type에는 has 사용"},{"w":"us","r":"our","at":16,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 our 사용"}]},{"n":11,"en":"Look, here are much photos of chocolate burgers and fries.","ko":"이것 봐, 여기 초콜릿 버거랑 튀김 사진이 잔뜩 있어.","fx":[{"w":"much","r":"many","at":3,"t":"수량 형용사 many/much","m":"셀 수 있는 복수명사 photos 앞에는 many 사용"}]},{"n":12,"en":"They come from the social media sites that are popular among us school students!","ko":"그것들은 우리 학교 학생들 사이에 인기 있는 소셜 미디어 사이트에서 나왔어!","fx":[{"w":"us","r":"our","at":11,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 our 사용"}]},{"n":13,"en":"Acky: Exactly. We need to be carefully about news on social media—it's not always reliable!","ko":"Acky: 맞아. 우리는 소셜 미디어 뉴스를 조심할 필요가 있어. 항상 믿을 수 있는 건 아니거든!","fx":[{"w":"carefully","r":"careful","at":6,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 careful 사용"}]},{"n":14,"en":"By the way, is those photos real? Fake news often copy images.","ko":"그런데, 저 사진들 진짜일까? 가짜 뉴스는 종종 이미지를 복사해.","fx":[{"w":"is","r":"are","at":3,"t":"be동사의 의문문","m":"주어 those photos 복수: are (is 아님)"},{"w":"copy","r":"copies","at":10,"t":"주어와 동사의 수일치","m":"단수 주어 Fake news에는 copies 사용"}]},{"n":15,"en":"Grong: Let's check them out. We can upload the images to an reverse image search engine and find they original source.","ko":"Grong: 확인해 보자. 사진을 역 이미지 검색 엔진에 올려 본래의 출처를 알아낼 수 있어.","fx":[{"w":"an","r":"a","at":11,"t":"관사 a/an","m":"reverse는 자음 소리로 시작하므로 a 사용"},{"w":"they","r":"their","at":18,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 their 사용"}]}]},{"no":"23","t":"Unique Rules Around the World","q":[{"n":1,"en":"Every country have its own culture. Culture shows way of living and thinking.","ko":"모든 나라는 고유의 문화를 가지고 있다. 문화는 삶과 사고의 방식을 보여 준다.","fx":[{"w":"have","r":"has","at":2,"t":"주어와 동사의 수일치","m":"Every country(단수)는 has (have 아님)"},{"w":"way","r":"ways","at":8,"t":"명사의 복수형","m":"여러 방식이므로 복수형 ways 사용"}]},{"n":3,"en":"Here are some unique and interest rules from around the world.","ko":"여기 세계의 독특하고 흥미로운 규칙들이 있다.","fx":[{"w":"interest","r":"interesting","at":5,"t":"품사 구별","m":"명사 rules를 꾸미는 형용사 interesting 사용"}]},{"n":4,"en":"In Switzerland, people real care about animals. Swiss law say that people cannot have just one hamster or one parrot in home.","ko":"스위스에서, 사람들은 동물을 정말로 아낀다. 스위스 법은 사람들이 집에서 햄스터나 앵무새를 한 마리만 키울 수 없다고 말한다.","fx":[{"w":"real","r":"really","at":3,"t":"형용사와 부사","m":"동사 care를 꾸미는 부사 really 사용"},{"w":"say","r":"says","at":9,"t":"3인칭 단수 현재형","m":"주어 Swiss law(단수)에는 says 사용"},{"w":"in","r":"at","at":20,"t":"기본전치사","m":"'집에'는 at home 사용"}]},{"n":5,"en":"They must have at least two. These pets feels lonely when they are alone.","ko":"최소 두 마리를 키워야 한다. 이런 동물들은 혼자 있으면 외로움을 느낀다.","fx":[{"w":"feels","r":"feel","at":8,"t":"주어와 동사의 수일치","m":"These pets(복수)는 feel (feels 아님)"}]},{"n":6,"en":"They need a friend that can be with they. Also, people who have dogs or cats must spends enough times with their pets.","ko":"이들은 함께 있을 수 있는 친구가 필요하다. 또한, 강아지나 고양이를 키우는 사람들은 충분한 시간을 반려동물과 함께 보내야 한다.","fx":[{"w":"they","r":"them","at":8,"t":"인칭대명사의 목적격","m":"전치사 with 뒤에는 목적격 them 사용"},{"w":"spends","r":"spend","at":17,"t":"조동사 뒤 동사원형","m":"조동사 must 뒤에는 동사원형 spend 사용"},{"w":"times","r":"time","at":19,"t":"셀 수 없는 명사","m":"'충분한 시간'의 time은 셀 수 없음"}]},{"n":7,"en":"Those who have dogs must take them outside for exercise too. Pets are very happily in Switzerland.","ko":"강아지를 키우는 사람들은 강아지를 운동시키기 위해 밖으로 데리고 나가야 한다. 스위스의 반려동물들은 정말 행복하다.","fx":[{"w":"happily","r":"happy","at":14,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 happy 사용"}]},{"n":9,"en":"Singapore is an very clean city. Here, people cannot eating or drink on buses or the subway.","ko":"싱가포르는 매우 깨끗한 도시이다. 이곳에서, 사람들은 버스나 지하철에서 먹거나 마실 수 없다.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"very는 자음 소리로 시작하므로 a 사용"},{"w":"eating","r":"eat","at":9,"t":"조동사 부정문","m":"cannot 뒤에는 동사원형 eat 사용"}]},{"n":10,"en":"They also cannot sell or import chewing gum. This actions can make the city dirty and messy.","ko":"사람들은 또한 껌을 팔거나 수입할 수도 없다. 이런 행동들은 도시를 더럽고 지저분하게 만들 수 있다.","fx":[{"w":"This","r":"Those","at":8,"t":"지시형용사","m":"복수명사 actions 앞에는 Those 사용"}]},{"n":11,"en":"People who breaks the rules must pay a fine. On Singapore, everyone know where to eat and where to throw away their trash.","ko":"규칙을 어기는 사람들은 벌금을 내야 한다. 싱가포르에서는 모두가 어디에서 먹고 어디에 자신의 쓰레기를 버려야 하는지 알고 있다.","fx":[{"w":"breaks","r":"break","at":2,"t":"관계사절 동사 수일치","m":"선행사 People(복수)는 break (breaks 아님)"},{"w":"On","r":"In","at":9,"t":"기본전치사","m":"'싱가포르에서'는 In Singapore 사용"},{"w":"know","r":"knows","at":12,"t":"3인칭 단수 현재형","m":"주어 everyone(단수)에는 knows 사용"}]},{"n":14,"en":"In France, childs can't have ketchup in school cafeterias. This sounds surprising, but there's a good reason.","ko":"프랑스에서는 어린이들이 학교 식당에서 케첩을 먹을 수 없다. 이는 놀라운 일처럼 들리지만, 타당한 이유가 있다.","fx":[{"w":"childs","r":"children","at":2,"t":"불규칙 복수형","m":"child의 복수형은 children"}]},{"n":15,"en":"France is famous of its delicious food. French people are very proud of their food.","ko":"프랑스는 맛있는 음식으로 유명하다. 프랑스 사람들은 자신들의 음식을 매우 자랑스러워한다.","fx":[{"w":"of","r":"for","at":3,"t":"기본전치사","m":"'~로 유명한'은 famous for 사용"}]},{"n":16,"en":"They believe that ketchup hides the really taste of their food.","ko":"그들은 케첩이 음식의 진짜 맛을 숨긴다고 믿는다.","fx":[{"w":"really","r":"real","at":6,"t":"형용사와 부사","m":"명사 taste 앞에는 형용사 real 사용"}]},{"n":18,"en":"That way, French children can learn to loving their food culture.","ko":"그런 방법으로, 프랑스 어린이들은 음식 문화를 사랑하는 법을 배울 수 있다.","fx":[{"w":"loving","r":"love","at":7,"t":"to부정사","m":"to 뒤에는 동사원형 love 사용"}]},{"n":19,"en":"Which rule is most surprising? Maybe some rules sound strange to your, but they show different lifestyles around the world.","ko":"어떤 규칙이 가장 놀라운가? 일부 규칙은 이상하게 들릴 수도 있지만, 그것들은 전 세계의 다양한 생활방식을 보여 준다.","fx":[{"w":"your","r":"you","at":11,"t":"인칭대명사의 목적격","m":"전치사 to 뒤에는 목적격 you 사용"}]},{"n":20,"en":"Understanding different rules from different country helps us live together more happily.","ko":"다른 나라의 다른 규칙을 이해하는 것은 우리가 더 행복하게 더불어 살아가는 데 도움을 준다.","fx":[{"w":"country","r":"countries","at":5,"t":"명사의 복수형","m":"different 뒤에는 복수명사 countries 사용"}]}]},{"no":"24","t":"Necessity Is the Mother of Invention","q":[{"n":1,"en":"Mt. Tambora, a volcano in Indonesia, was exploded in 1815. The explosion created a huge cloud of ash, so crops failed around the world.","ko":"1815년 인도네시아의 화산인 탐보라산이 폭발했다. 이 폭발은 거대한 재 구름을 만들었고, 그래서 전 세계적으로 농작물이 자라지 못했다.","fx":[{"w":"was exploded","r":"exploded","at":6,"t":"능동태와 수동태","m":"explode는 자동사: exploded (was exploded 아님)"}]},{"n":2,"en":"As a result, people didn't had enough food to eat. Surprisingly, this maked traveling difficult.","ko":"그 결과, 사람들은 먹을 음식이 충분하지 않았다. 놀랍게도, 이로 인해 이동이 어려워졌다.","fx":[{"w":"had","r":"have","at":5,"t":"did not 뒤 동사원형","m":"didn't 뒤에는 동사원형: have (had 아님)"},{"w":"maked","r":"made","at":12,"t":"불규칙 과거형","m":"make의 과거형은 made (maked 아님)"}]},{"n":3,"en":"Why? In those days, people rided horses, but many horses were killed for food.","ko":"왜일까? 당시, 사람들은 말을 탔는데, 많은 말들이 식용으로 죽임을 당했다.","fx":[{"w":"rided","r":"rode","at":5,"t":"불규칙 과거형","m":"ride의 과거형은 rode (rided 아님)"}]},{"n":4,"en":"People needed a new way to traveling, and Karl von Drais invented the first bicycle in Germany in 1817. Drais's bicycle had two wooden wheels but no pedals.","ko":"사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다. Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다.","fx":[{"w":"traveling","r":"travel","at":6,"t":"to부정사","m":"way to 뒤에는 동사원형: to travel (traveling 아님)"}]},{"n":5,"en":"How did it move without pedals? Well, riders simply pushed the bicycle forward with their foots.","ko":"페달 없이 어떻게 움직였을까? 음, 타는 사람들이 단순히 발로 자전거를 앞으로 밀었다.","fx":[{"w":"foots","r":"feet","at":15,"t":"불규칙 복수형","m":"foot의 복수형은 feet"}]},{"n":6,"en":"The present-day bicycle is the result of much inventors' work on the 19th century.","ko":"오늘날의 자전거는 19세기 많은 발명가들의 노력의 결과이다.","fx":[{"w":"much","r":"many","at":7,"t":"수량 형용사 many/much","m":"복수명사 inventors 앞에는 many 사용"},{"w":"on","r":"in","at":10,"t":"기본전치사","m":"'~세기에'는 in the 19th century"}]},{"n":7,"en":"Whiteout was invented by Bette Graham. In 1956, Graham were working at a bank in Texas, USA.","ko":"수정액은 Bette Graham에 의해 발명되었다. 1956년 Graham은 미국 텍사스의 한 은행에서 일하고 있었다.","fx":[{"w":"were","r":"was","at":9,"t":"be동사의 수일치","m":"단수 주어 Graham에는 was 사용"}]},{"n":8,"en":"At that time, people had to retype the whole pages when they made even an small mistake.","ko":"그 당시, 사람들은 작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다.","fx":[{"w":"pages","r":"page","at":9,"t":"명사의 단수형","m":"the whole 뒤에는 단수명사 page 사용"},{"w":"an","r":"a","at":14,"t":"관사 a/an","m":"자음 소리 small 앞에는 a 사용"}]},{"n":10,"en":"One day, Graham saw some window painters. When them made a mistake, they corrected it by simply painting over it.","ko":"어느 날 Graham은 창문을 칠하는 페인트공들을 보았다. 그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다.","fx":[{"w":"them","r":"they","at":8,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 they 사용"}]},{"n":11,"en":"The next days, she made her own white paint and used it to corrects her typing mistakes. Surprisingly, nobody noticed!","ko":"그다음 날 그녀는 자신만의 흰색 페인트를 만들어 오타를 수정하는 데 사용했다. 놀랍게도, 아무도 알아차리지 못했다!","fx":[{"w":"days","r":"day","at":2,"t":"명사의 단수형","m":"'다음 날'은 단수 the next day"},{"w":"corrects","r":"correct","at":13,"t":"to부정사","m":"to 뒤에는 동사원형 correct 사용"}]},{"n":13,"en":"The first webcam was invented to watch a coffee pots.","ko":"최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다.","fx":[{"w":"pots","r":"pot","at":9,"t":"명사의 단수형","m":"a 뒤에는 단수명사 pot 사용"}]},{"n":15,"en":"To work more good, they needed lots of coffee. However, there was only one coffee machine in the building.","ko":"일을 더 잘하기 위해, 그들은 많은 양의 커피가 필요했다. 하지만 건물에는 커피 머신이 한 대뿐이었다.","fx":[{"w":"more good","r":"better","at":2,"t":"비교급","m":"good의 비교급은 better"}]},{"n":16,"en":"So, they had to makes many disappointed trips to the empty coffee pot.","ko":"그래서 그들은 비어 있는 커피포트로 실망스러운 발걸음을 많이 해야 했다.","fx":[{"w":"makes","r":"make","at":4,"t":"to부정사","m":"to 뒤에는 동사원형 make 사용"},{"w":"disappointed","r":"disappointing","at":6,"t":"현재분사와 과거분사","m":"trips가 실망을 주므로 disappointing 사용"}]}]},{"no":"25","t":"Can You Spot Them?","q":[{"n":1,"en":"Is you good at hide and seek? Some animals which lives in the wild are very good at camouflage.","ko":"당신은 숨바꼭질을 잘하는가? 야생에서 사는 몇몇 동물들은 위장을 매우 잘한다.","fx":[{"w":"Is","r":"Are","at":0,"t":"be동사의 의문문","m":"주어 you에는 Are: Are (Is 아님)"},{"w":"lives","r":"live","at":10,"t":"관계절 동사 수일치","m":"선행사 animals(복수)이므로 live (lives 아님)"}]},{"n":2,"en":"You can see them in the air, on land, and in the sea. Their special looks or abilities keeps them safe from predators.","ko":"당신은 그들을 하늘에서, 땅에서, 그리고 바다에서 볼 수 있다. 그들의 특별한 생김새나 능력은 그들을 포식 동물로부터 안전하게 지킨다.","fx":[{"w":"keeps","r":"keep","at":18,"t":"일반동사 수일치","m":"주어 looks or abilities(복수)는 keep (keeps 아님)"}]},{"n":4,"en":"Mountain hares are like rabbits, but they are more big and have longer leg. They are very stylish animals.","ko":"고산토끼는 토끼와 비슷하지만, 그들은 (몸이) 더 크고 더 긴 다리를 가지고 있다. 그들은 매우 멋진 동물이다.","fx":[{"w":"more big","r":"bigger","at":8,"t":"비교급","m":"짧은 형용사 big은 bigger로 비교급 만듦"},{"w":"leg","r":"legs","at":13,"t":"명사의 복수형","m":"다리는 여러 개이므로 복수 legs 사용"}]},{"n":5,"en":"Mountain hares change colors according for season. In summer, they turn gray-brown to match the rocks and grass.","ko":"고산토끼는 계절에 따라 색을 바꾼다. 여름에, 그들은 바위와 풀에 맞추기 위해 회갈색으로 변한다.","fx":[{"w":"for","r":"to","at":5,"t":"숙어 표현","m":"\"~에 따라\"는 according to 사용"}]},{"n":6,"en":"In winter, they turn white to camouflage themself in the snow.","ko":"겨울에, 그들은 자신들을 눈 속에 위장하기 위해 흰색으로 변한다.","fx":[{"w":"themself","r":"themselves","at":7,"t":"재귀대명사","m":"주어 they의 재귀대명사는 themselves 사용"}]},{"n":7,"en":"Changing colors makes them nearly invisibly to predators like wild dogs and eagles.","ko":"색을 바꾸는 것은 그들을 들개와 독수리 같은 포식 동물들에게 거의 보이지 않게 만든다.","fx":[{"w":"invisibly","r":"invisible","at":5,"t":"형용사와 부사","m":"makes them 뒤 보어 자리에는 형용사 invisible 사용"}]},{"n":9,"en":"Mountain hares have really big foots. Thanks to them, mountain hares can hop in deeply snow and escape from predators.","ko":"고산토끼는 정말 큰 발을 가지고 있다. 그것들 덕분에, 고산토끼는 깊은 눈 속에서 깡충깡충 뛰어 포식 동물로부터 도망칠 수 있다.","fx":[{"w":"foots","r":"feet","at":5,"t":"불규칙 복수형","m":"foot의 복수형은 feet"},{"w":"deeply","r":"deep","at":14,"t":"형용사와 부사","m":"명사 snow를 꾸미는 형용사 deep 사용"}]},{"n":10,"en":"Look closely at a rock under the sea. If it move, it might be an octopus.","ko":"바닷속 바위를 자세히 보아라. 만약 그것이 움직인다면, 그것은 문어일지도 모른다.","fx":[{"w":"move","r":"moves","at":10,"t":"3인칭 단수 현재형","m":"주어 it(3인칭 단수)는 동사에 -s: moves (move 아님)"}]},{"n":11,"en":"Octopuses is sea animals with rounded bodies and eight long arms.","ko":"문어는 둥근 몸과 여덟 개의 긴 팔을 가진 해양 동물이다.","fx":[{"w":"is","r":"are","at":1,"t":"be동사의 수일치","m":"주어 Octopuses(복수)는 are (is 아님)"}]},{"n":12,"en":"When octopuses feel danger, they use they special camouflage skill.","ko":"문어는 위험을 느낄 때, 그들의 특별한 위장 기술을 사용한다.","fx":[{"w":"they","r":"their","at":6,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 their 사용"}]},{"n":13,"en":"Octopuses can changes colors and patterns to match their surroundings. If they're near sea plants, they looks like sea plants.","ko":"문어는 그들의 주변 환경에 맞추기 위해 색과 무늬를 바꿀 수 있다. 만약 그들이 해초 가까이에 있으면, 그들은 해초처럼 보인다.","fx":[{"w":"changes","r":"change","at":2,"t":"조동사 + 동사원형","m":"조동사 can 뒤에는 동사원형 change 사용"},{"w":"looks","r":"look","at":16,"t":"일반동사의 현재형","m":"주어 they에는 동사원형 look 사용"}]},{"n":14,"en":"If they're near coral reefs, they look like coral reefs. They can also stick shells on their bodies to look like an rock.","ko":"만약 그들이 산호초 가까이에 있으면, 그들은 산호초처럼 보인다. 그들은 또한 바위처럼 보이기 위해 조개껍데기를 그들의 몸에 붙일 수 있다.","fx":[{"w":"an","r":"a","at":21,"t":"관사 a/an","m":"자음 소리로 시작하는 rock 앞에는 a 사용"}]},{"n":15,"en":"This can fool predators complete.","ko":"이는 포식 동물을 완전히 속일 수 있다.","fx":[{"w":"complete","r":"completely","at":4,"t":"형용사와 부사","m":"동사 fool을 꾸미는 부사 completely 사용"}]},{"n":17,"en":"Octopuses can spread ink. It creates a dark cloud who blocks the view of predators.","ko":"문어는 먹물을 퍼뜨릴 수 있다. 그것은 포식 동물의 시야를 가리는 먹구름을 만들어 낸다.","fx":[{"w":"who","r":"that","at":9,"t":"관계대명사","m":"사물(cloud)이 선행사이면 that/which 사용"}]}]},{"no":"26","t":"Manet and Monet","q":[{"n":2,"en":"On the late 19th century, there were two French painter who had similar names: Manet and Monet.","ko":"19세기 후반에 비슷한 이름을 가진 프랑스 화가 두 명이 있었어요. 마네와 모네입니다.","fx":[{"w":"On","r":"In","at":0,"t":"기본전치사","m":"'~세기에'는 전치사 In 사용"},{"w":"painter","r":"painters","at":9,"t":"명사의 복수형","m":"two 뒤에는 복수명사 painters 사용"}]},{"n":3,"en":"One day, Manet heared people at an exhibit. They was praising a painter.","ko":"어느 날, 마네는 전시회에서 사람들의 말을 들었어요. 그들은 한 화가를 칭찬하고 있었어요.","fx":[{"w":"heared","r":"heard","at":3,"t":"불규칙 과거형","m":"hear의 과거형은 heard (heared 아님)"},{"w":"was","r":"were","at":9,"t":"be동사의 과거형","m":"복수 주어 They에는 were 사용"}]},{"n":4,"en":"He thought they were talking about him. He feeled happy, but they were actually talking about Monet!","ko":"그는 그들이 자신에 대해서 말하고 있다고 생각했어요. 그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요!","fx":[{"w":"feeled","r":"felt","at":8,"t":"불규칙 과거형","m":"feel의 과거형은 felt (feeled 아님)"}]},{"n":5,"en":"When Manet realized this, he got upsetting and shouted, \"Who is this Monet whose name sounds just like my?\"","ko":"마네가 이것을 깨달았을 때, 그는 기분이 상해서 외쳤어요. \"꼭 내 이름처럼 들리는 이름의 이 모네라는 사람은 누구야?\"","fx":[{"w":"upsetting","r":"upset","at":6,"t":"감정 분사형용사","m":"'화가 난' 감정은 과거분사 upset 사용"},{"w":"my","r":"mine","at":18,"t":"소유대명사","m":"like 뒤에 명사 없이 쓰는 소유대명사 mine 사용"}]},{"n":6,"en":"Even today, many people still confuses Manet with Monet. So, what are the differences between them?","ko":"오늘날까지도, 많은 사람들은 여전히 마네와 모네를 혼동해요. 그렇다면, 그들 사이의 차이점은 무엇일까요?","fx":[{"w":"confuses","r":"confuse","at":5,"t":"주어와 동사의 수일치","m":"many people(복수)는 confuse (confuses 아님)"}]},{"n":7,"en":"First, the focus of their paintings is differently. Manet focused on people.","ko":"첫째, 그들의 그림의 초점이 달라요. 마네는 사람들에게 초점을 맞추었어요.","fx":[{"w":"differently","r":"different","at":7,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 different 사용"}]},{"n":8,"en":"He painted people in everyday life. For example, in him painting Boating, Manet painted a man and an woman on a boat.","ko":"그는 일상 속 사람들을 그렸습니다. 예를 들어, 그의 그림인 '뱃놀이(Boating)'에서, 마네는 배에 탄 남자와 여자를 그렸어요.","fx":[{"w":"him","r":"his","at":9,"t":"인칭대명사의 소유격","m":"명사 painting 앞에는 소유격 his 사용"},{"w":"an","r":"a","at":17,"t":"관사 a/an","m":"자음 소리 woman 앞에는 a 사용"}]},{"n":9,"en":"Unlike Manet, Monet liked to painting landscapes and gardens. He enjoyed watching nature in different seasons and times of day.","ko":"마네와 달리, 모네는 풍경과 정원을 그리는 것을 좋아했어요. 그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요.","fx":[{"w":"painting","r":"paint","at":5,"t":"to부정사","m":"like to 뒤에는 동사원형: paint (painting 아님)"}]},{"n":10,"en":"He painted the same subject many times. He created about 250 different painting of water lilies for him series Water Lilies.","ko":"그는 같은 주제를 여러 번 그렸어요. 모네는 그의 연작인 '수련(Water Lilies)'을 위해 약 250점의 다양한 수련 그림을 그렸습니다.","fx":[{"w":"painting","r":"paintings","at":12,"t":"명사의 복수형","m":"250 뒤에는 복수명사 paintings 사용"},{"w":"him","r":"his","at":17,"t":"인칭대명사의 소유격","m":"명사 series 앞에는 소유격 his 사용"}]},{"n":11,"en":"Manet and Monet also differ on their use of color. Manet was a master in the use of black.","ko":"마네와 모네는 또한 색 사용에서도 달라요. 마네는 검은색 사용의 대가였어요.","fx":[{"w":"on","r":"in","at":5,"t":"기본전치사","m":"'~에서 다르다'는 differ in 사용"}]},{"n":12,"en":"His painting Masked Ball at the Opera is a good examples.","ko":"그의 그림인 '오페라 하우스의 가면무도회(Masked Ball at the Opera)'가 좋은 예입니다.","fx":[{"w":"examples","r":"example","at":10,"t":"명사의 단수형","m":"a 뒤에는 단수명사 example 사용"}]},{"n":13,"en":"However, in Monet's paintings, black was not use. Dark brown was used instead.","ko":"그러나 모네의 그림에서는 검은색이 사용되지 않았어요. 대신에 짙은 갈색이 사용되었습니다.","fx":[{"w":"use","r":"used","at":7,"t":"수동태","m":"수동태는 be동사 + 과거분사 used 사용"}]},{"n":14,"en":"Monet also used a lots of light colors in his paintings.","ko":"모네는 또한 그의 그림에서 연한 색을 많이 사용했어요.","fx":[{"w":"lots","r":"lot","at":4,"t":"수량 표현","m":"'많은'은 a lot of 사용 (lots 아님)"}]},{"n":16,"en":"The name Manet and Monet sound similar, but their painting styles are very different.","ko":"마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요.","fx":[{"w":"name","r":"names","at":1,"t":"명사의 복수형","m":"Manet and Monet 두 이름이므로 names 사용"}]},{"n":18,"en":"Does you see light colors and gardens? It's probably Monet.","ko":"연한 색과 정원이 보이나요? 그것은 아마도 모네일 거예요.","fx":[{"w":"Does","r":"Do","at":0,"t":"do/does 의문문","m":"주어 you에는 Do 사용"}]},{"n":19,"en":"If you remember these questions, you can easy tell them apart.","ko":"이러한 질문들을 기억하면, 여러분은 그들을 쉽게 구별할 수 있어요.","fx":[{"w":"easy","r":"easily","at":7,"t":"형용사와 부사","m":"동사 tell을 꾸미는 부사 easily 사용"}]}]},{"no":"27","t":"CREATIVE MINDS OF TEENS","q":[{"n":2,"en":"Today, we will meets some teen inventor at the Invention Fair and hear about their work. Hi, Thomas.","ko":"오늘은 발명품 박람회에서 몇몇 십 대 발명가들을 만나 그들의 작품에 대해 들어보겠습니다. 안녕하세요, Thomas.","fx":[{"w":"meets","r":"meet","at":3,"t":"조동사 뒤 동사원형","m":"조동사 will 뒤에는 동사원형 meet 사용"},{"w":"inventor","r":"inventors","at":6,"t":"명사의 복수형","m":"some 뒤에는 복수명사 inventors 사용"}]},{"n":3,"en":"Can you tell I about your invention?","ko":"당신의 발명품에 대해 이야기해 줄 수 있어요?","fx":[{"w":"I","r":"me","at":3,"t":"인칭대명사의 목적격","m":"동사 tell 뒤에는 목적격 me 사용"}]},{"n":5,"en":"Ted: That sounds interestingly. Can you tell us more about it?","ko":"Ted: 흥미롭게 들리네요. 그것에 관해 좀 더 말해 줄 수 있어요?","fx":[{"w":"interestingly","r":"interesting","at":3,"t":"형용사와 부사","m":"감각동사 sound 뒤 보어에는 형용사 interesting 사용"}]},{"n":6,"en":"Thomas: Sure. I love ride a bike.","ko":"Thomas: 물론이죠. 저는 자전거 타는 것을 좋아해요.","fx":[{"w":"ride","r":"riding","at":4,"t":"동명사","m":"love 뒤 목적어: riding (ride 아님)"}]},{"n":7,"en":"I have ridden bikes since about 10 years.","ko":"저는 대략 10년 동안 자전거를 탔어요.","fx":[{"w":"since","r":"for","at":4,"t":"전치사 for/since","m":"기간(10 years)에는 for 사용, since는 시점 앞"}]},{"n":8,"en":"My phone often ran out of battery during long ride, so me made this charger with a small fan.","ko":"장거리를 타는 동안에 제 휴대 전화 배터리를 자주 다 써 버렸고, 그래서 작은 팬이 달린 이 충전기를 만들었어요.","fx":[{"w":"ride","r":"rides","at":9,"t":"명사의 복수형","m":"반복되는 여러 번의 rides이므로 복수 사용"},{"w":"me","r":"I","at":11,"t":"인칭대명사의 주격","m":"동사 made의 주어 자리에는 주격 I 사용"}]},{"n":9,"en":"When you ride a bike with these small fan, the wind turn the fan and makes power. Your phone is charged by this power.","ko":"이 작은 팬을 갖고 자전거를 타면, 바람이 그 팬을 돌리고 전력을 만들어 내요. 당신의 휴대 전화는 이 전력에 의해 충전돼요.","fx":[{"w":"these","r":"this","at":6,"t":"지시형용사 this/these","m":"단수명사 fan이므로 this 사용"},{"w":"turn","r":"turns","at":11,"t":"3인칭 단수 현재형","m":"주어 the wind(단수)에는 turns 사용"}]},{"n":10,"en":"Ted: Wow, that's an great idea. I'd like to get this phone charger for my bike.","ko":"Ted: 와, 훌륭한 아이디어입니다. 제 자전거에 이 휴대 전화 충전기를 달고 싶네요.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"great는 자음 소리로 시작하므로 a 사용"}]},{"n":11,"en":"Ted: Let's meet another inventors. Hi, Kelly.","ko":"Ted: 또 다른 발명가를 만나 봅시다. 안녕하세요, Kelly.","fx":[{"w":"inventors","r":"inventor","at":4,"t":"수량 한정사 another","m":"another 뒤에는 단수명사 inventor 사용"}]},{"n":12,"en":"Who is your invention?","ko":"당신의 발명품은 무엇인가요?","fx":[{"w":"Who","r":"What","at":0,"t":"의문사","m":"사물(invention)을 묻는 의문사는 What 사용"}]},{"n":13,"en":"Kelly: I made the Sitbag. It is an bag, but it can also turns into a chair.","ko":"Kelly: 저는 Sitbag을 만들었어요. 이건 가방이지만, 의자로 바뀔 수 있어요.","fx":[{"w":"an","r":"a","at":7,"t":"관사 a/an","m":"bag은 자음 소리로 시작하므로 a 사용"},{"w":"turns","r":"turn","at":13,"t":"조동사 뒤 동사원형","m":"조동사 can 뒤에는 동사원형 turn 사용"}]},{"n":14,"en":"My grandmother fell and hurt her leg last years. Since then, she have had trouble walking.","ko":"작년에 우리 할머니께서 넘어지셔서 다리를 다치셨거든요. 그때 이후로, 할머니는 걷는 데 어려움을 겪어 오셨어요.","fx":[{"w":"years","r":"year","at":8,"t":"명사의 단수/복수","m":"last 뒤에는 단수명사 year 사용"},{"w":"have","r":"has","at":12,"t":"현재완료","m":"주어 she에는 has had 사용"}]},{"n":15,"en":"So, she often need to rest, but there are not much benches on the streets. The Sitbag is designed for elderly people like she.","ko":"그래서 할머니는 자주 쉬어야 하는데, 길거리에 벤치가 많지 않아요. Sitbag은 할머니 같은 어르신들을 위해 설계되었어요.","fx":[{"w":"need","r":"needs","at":3,"t":"3인칭 단수 현재형","m":"주어 she에는 needs 사용"},{"w":"much","r":"many","at":10,"t":"수량 형용사 many/much","m":"복수명사 benches 앞에는 many 사용"},{"w":"she","r":"her","at":23,"t":"인칭대명사의 목적격","m":"전치사 like 뒤에는 목적격 her 사용"}]},{"n":16,"en":"Ted: That's so thoughtful, Kelly. It will is really helpful for the elderly.","ko":"Ted: 정말 사려 깊네요, Kelly. 그것은 어르신들께 정말 유용할 거예요.","fx":[{"w":"is","r":"be","at":7,"t":"조동사 뒤 동사원형","m":"will 뒤에는 동사원형 be (is 아님)"}]}]},{"no":"28","t":"Festivals for Our Animal Friends","q":[{"n":1,"en":"Some animals has been our friends for thousands of years. They have help and protected us.","ko":"어떤 동물들은 수천 년 동안 우리의 친구였다. 그들은 우리를 돕고 보호해 왔다.","fx":[{"w":"has","r":"have","at":2,"t":"현재완료","m":"복수 주어 animals: have been (has 아님)"},{"w":"help","r":"helped","at":12,"t":"현재완료","m":"have 뒤 과거분사: helped (help 아님)"}]},{"n":2,"en":"To celebrate this animal friends, people in Ireland and Nepal hold special festivals every years.","ko":"이러한 동물 친구들을 기념하기 위해 아일랜드와 네팔의 사람들은 매년 특별한 축제를 연다.","fx":[{"w":"this","r":"these","at":2,"t":"지시형용사 this/these","m":"복수명사 friends 앞에는 these 사용"},{"w":"years","r":"year","at":14,"t":"every + 단수명사","m":"every 뒤에는 단수명사 year 사용"}]},{"n":5,"en":"There is one story about the festival's begin.","ko":"그 축제의 시작에 대한 한 가지 일화가 있다.","fx":[{"w":"begin","r":"beginning","at":7,"t":"명사와 동사의 품사","m":"소유격 뒤에는 명사 beginning 사용"}]},{"n":6,"en":"When the English army was attacking Ireland on the 17th century, they came across a group of wild goat in a field.","ko":"17세기에 영국 군대가 아일랜드를 공격하고 있었을 때, 그들은 들판에서 야생 염소 떼와 마주쳤다.","fx":[{"w":"on","r":"in","at":7,"t":"기본전치사","m":"\"~세기에\"는 전치사 in 사용"},{"w":"goat","r":"goats","at":18,"t":"a group of + 복수명사","m":"a group of 뒤에는 복수명사 goats 사용"}]},{"n":7,"en":"Much of the goats ran away to the mountains, but one goats ran toward the village.","ko":"대부분의 염소는 산으로 도망을 갔지만 염소 한 마리는 마을 쪽으로 달렸다.","fx":[{"w":"Much","r":"Most","at":0,"t":"수량 형용사 most/much","m":"셀 수 있는 goats 앞에는 Most of 사용"},{"w":"goats","r":"goat","at":11,"t":"one + 단수명사","m":"one 뒤에는 단수명사 goat 사용"}]},{"n":8,"en":"When the villagers saw the tired and scared goat, they realized that danger were coming.","ko":"마을 사람들은 지치고 겁에 질린 염소를 보았을 때 위험이 다가오고 있다는 것을 깨달았다.","fx":[{"w":"were","r":"was","at":13,"t":"be동사의 과거형","m":"단수 주어 danger: was (were 아님)"}]},{"n":9,"en":"Thanks to the goat, the villagers were able to prepare and protect themself.","ko":"그 염소 덕분에 마을 사람들은 (공격에) 대비하고 자신들을 보호할 수 있었다.","fx":[{"w":"themself","r":"themselves","at":12,"t":"재귀대명사","m":"주어 the villagers의 재귀대명사는 themselves 사용"}]},{"n":11,"en":"At the festival, people crowns a goat to show thanks to it. They also give it a lot of food and take good care of it.","ko":"축제에서 사람들은 염소에게 감사를 표하기 위해 왕관을 씌워 준다. 그들은 또한 염소에게 많은 먹이를 주고 잘 돌봐준다.","fx":[{"w":"crowns","r":"crown","at":4,"t":"일반동사 현재형","m":"복수 주어 people: crown (crowns 아님)"}]},{"n":13,"en":"People say, \"Every dog have its day.\" In Nepal, this saying are literally true.","ko":"사람들은 \"모든 개는 자신들의 날이 있다.\"라고 한다. 네팔에서 이 격언은 문자 그대로 사실이다.","fx":[{"w":"have","r":"has","at":4,"t":"3인칭 단수 현재형","m":"Every dog(단수): has (have 아님)"},{"w":"are","r":"is","at":11,"t":"be동사의 현재형","m":"단수 주어 saying: is (are 아님)"}]},{"n":15,"en":"The Nepalese believe that dogs are helper of the god of death and guide souls at heaven.","ko":"네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다.","fx":[{"w":"helper","r":"helpers","at":6,"t":"명사의 복수형","m":"dogs를 설명하므로 복수 helpers 사용"},{"w":"at","r":"to","at":15,"t":"기본전치사","m":"\"천국으로\"는 방향 전치사 to 사용"}]},{"n":16,"en":"Because this belief, Nepal has a specially day to celebrate dogs. This dog festival usually take place in October or November.","ko":"이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다. 이 개 축제는 보통 10월이나 11월에 열린다.","fx":[{"w":"this","r":"of this","at":1,"t":"접속사와 전치사","m":"뒤에 명사구(this belief)가 오면 Because of 사용"},{"w":"specially","r":"special","at":6,"t":"형용사와 부사","m":"명사 day를 꾸미는 형용사 special 사용"},{"w":"take","r":"takes","at":15,"t":"3인칭 단수 현재형","m":"단수 주어 festival: takes (take 아님)"}]},{"n":18,"en":"They also put an red mark on dogs' foreheads to wish them good lucks. They even bow to dogs to showing them love and thanks.","ko":"그들은 또한 개에게 행운을 빌어 주기 위해 그것의 이마에 빨간색 마크를 찍는다. 그들은 심지어 개에게 사랑과 감사를 표하기 위해 고개 숙여 인사하기도 한다.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"자음 소리로 시작하는 red 앞에는 a 사용"},{"w":"lucks","r":"luck","at":13,"t":"셀 수 없는 명사","m":"luck은 셀 수 없는 명사라서 lucks 쓰지 않음"},{"w":"showing","r":"show","at":20,"t":"to부정사","m":"to 뒤에는 동사원형: show (showing 아님)"}]}]},{"no":"29","t":"Wonderful Inventions by Chance","q":[{"n":2,"en":"In America, there was an famous cook, Ms. Wakefield. One day in 1938, she wanted to baking chocolate cookies.","ko":"미국에 Wakefield 씨라는 한 유명한 요리사가 있었다. 1938년 어느 날, 그녀는 초콜릿 쿠키를 굽고 싶었다.","fx":[{"w":"an","r":"a","at":4,"t":"관사 a/an","m":"famous는 자음 소리로 시작하므로 a famous"},{"w":"baking","r":"bake","at":16,"t":"to부정사","m":"to 뒤에는 동사원형: bake (baking 아님)"}]},{"n":3,"en":"However, she didn't had enough time to melt chocolate. \"Aha!\"","ko":"그러나 그녀는 초콜릿을 녹일 충분한 시간이 없었다. \"아하!\"","fx":[{"w":"had","r":"have","at":3,"t":"일반동사의 부정문","m":"didn't 뒤에는 동사원형 have 사용"}]},{"n":4,"en":"So, she cut a chocolate bar into small chips. Then, she mixed them with her dough and putted the cookie dough into the oven.","ko":"그래서 그녀는 초콜릿 바를 작은 조각들로 잘랐다. 그런 다음, 그녀는 그것들을 반죽과 섞었고, 그 쿠키 반죽을 오븐에 넣었다.","fx":[{"w":"putted","r":"put","at":17,"t":"불규칙 과거형","m":"put의 과거형은 put (putted 아님)"}]},{"n":5,"en":"When Ms. Wakefield opened the oven, she found that the chips was not melted into the dough. \"Oh, no!\"","ko":"Wakefield 씨가 오븐을 열었을 때, 그녀는 그 조각들이 반죽에 녹아들지 않은 것을 발견했다. \"아, 안 돼!\"","fx":[{"w":"was","r":"were","at":11,"t":"be동사의 수일치","m":"복수 주어 the chips에는 were 사용"}]},{"n":6,"en":"Although the chips remained in the cookies, she was not disappointed. Her new cookies were so deliciously.","ko":"비록 그 조각들이 쿠키에 남아 있었지만, 그녀는 실망하지 않았다. 그녀의 새 쿠키들은 정말 맛있었다.","fx":[{"w":"deliciously","r":"delicious","at":16,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 delicious 사용"}]},{"n":9,"en":"On 1903, an French scientist, Mr. Bénédictus, was experimenting with liquid plastic in a glass flask.","ko":"1903년에 프랑스의 과학자인 Bénédictus 씨는 유리 플라스크 안에 있는 액체 플라스틱으로 실험을 하고 있었다.","fx":[{"w":"On","r":"In","at":0,"t":"기본전치사","m":"연도 앞에는 전치사 in 사용"},{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"French는 자음 소리로 시작하므로 a French"}]},{"n":10,"en":"He accidentally hit the glass flask, and it falled on the floor. \"Oops!\"","ko":"그가 실수로 유리 플라스크를 쳐서 그것이 바닥에 떨어졌다. \"이런!\"","fx":[{"w":"falled","r":"fell","at":8,"t":"불규칙 과거형","m":"fall의 과거형은 fell (falled 아님)"}]},{"n":11,"en":"Although the glass flask was broken into piece, they still held together in the shape of the flask! How could this happens?","ko":"비록 유리 플라스크는 깨져서 조각났지만, 그것들은 플라스크 모양으로 여전히 함께 붙어 있었다! 어떻게 이런 일이 일어날 수 있었을까?","fx":[{"w":"piece","r":"pieces","at":7,"t":"명사의 복수형","m":"'조각조각'은 복수 pieces 사용"},{"w":"happens","r":"happen","at":21,"t":"조동사","m":"조동사 could 뒤에는 동사원형 happen 사용"}]},{"n":12,"en":"The secret was the liquid plastic in the flask. This finding led to him invention of safety glass.","ko":"비밀은 플라스크 안에 있는 액체 플라스틱이었다. 이 발견이 안전유리의 발명으로 이어졌다.","fx":[{"w":"him","r":"his","at":13,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 his 사용"}]},{"n":13,"en":"These days, we can finds safety glass everywhere. For example, it is used for car windows.","ko":"요즘 우리는 어디서나 안전유리를 찾을 수 있다. 예를 들어, 그것은 자동차 창문에 사용된다.","fx":[{"w":"finds","r":"find","at":4,"t":"조동사","m":"조동사 can 뒤에는 동사원형: find (finds 아님)"}]},{"n":14,"en":"If there is a car accident, people are safer from sharply pieces of glass.","ko":"만약 자동차 사고가 난다면 사람들은 날카로운 유리 조각들로부터 더 안전하다.","fx":[{"w":"sharply","r":"sharp","at":10,"t":"형용사와 부사","m":"명사 pieces를 꾸미는 형용사 sharp 사용"}]},{"n":16,"en":"Can you clean your clothes without waters? The answer is \"yes.\"","ko":"물 없이 옷을 세탁할 수 있을까? 정답은 '그렇다.'이다.","fx":[{"w":"waters","r":"water","at":6,"t":"셀 수 없는 명사","m":"water는 셀 수 없는 명사라 복수형 불가"}]},{"n":17,"en":"Dry cleaning use oil to clean clothes. There's a interesting story about dry cleaning.","ko":"드라이클리닝은 옷을 세탁하기 위해 기름을 사용한다. 드라이클리닝에 관한 흥미로운 이야기가 있다.","fx":[{"w":"use","r":"uses","at":2,"t":"3인칭 단수 현재형","m":"주어 Dry cleaning(단수)에는 uses 사용"},{"w":"a","r":"an","at":8,"t":"관사 a/an","m":"interesting은 모음 소리로 시작하므로 an"}]},{"n":18,"en":"In the 1800s, a factory workers in France spilled lamp oil on a tablecloth.","ko":"1800년대에 프랑스에서 한 공장 노동자가 테이블보에 등유를 쏟았다.","fx":[{"w":"workers","r":"worker","at":5,"t":"명사의 단수형","m":"a 뒤에는 단수명사 worker 사용"}]},{"n":20,"en":"The dirty spot on the tablecloth were cleaned by the lamp oil! His discovery led to a new way of cleaning clothes.","ko":"테이블보 위의 더러운 얼룩이 등유에 의해 깨끗해졌다! 그의 발견은 옷을 세탁하는 새로운 방법으로 이어졌다.","fx":[{"w":"were","r":"was","at":6,"t":"수동태","m":"주어 The dirty spot(단수)에는 was 사용"}]},{"n":21,"en":"Now, dry cleaning is widely used around the worlds.","ko":"이제 드라이클리닝은 전 세계적으로 널리 사용된다.","fx":[{"w":"worlds","r":"world","at":8,"t":"명사의 단수형","m":"'세계 곳곳에'는 the world 사용"}]},{"n":22,"en":"This wonderful inventions came by chance. When things go wrong, don't being disappointed.","ko":"이 훌륭한 발명품들은 우연히 나왔다. 일이 잘못될 때 실망하지 마라.","fx":[{"w":"This","r":"These","at":0,"t":"지시형용사","m":"복수명사 inventions 앞에는 These 사용"},{"w":"being","r":"be","at":11,"t":"부정 명령문","m":"Don't 뒤에는 동사원형 be 사용"}]}]},{"no":"30","t":"Colors in Soccer","q":[{"n":1,"en":"Soccer are a popular sport all over the world. It is also quite simply.","ko":"축구는 전 세계에서 인기 있는 운동입니다. 그것은 꽤 단순하기도 하죠.","fx":[{"w":"are","r":"is","at":1,"t":"be동사의 수일치","m":"주어 Soccer(단수)는 is (are 아님)"},{"w":"simply","r":"simple","at":13,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 simple 사용"}]},{"n":2,"en":"You just need an ball, a small open space, and the desire to kicking! Oh, don't forget one more thing.","ko":"여러분은 공, 작은 열린 공간, 그리고 (공을) 찰 욕구만이 필요해요! 아, 한 가지 더 잊지 마세요.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"자음 소리 ball 앞에는 a 사용"},{"w":"kicking","r":"kick","at":13,"t":"to부정사","m":"to 뒤에는 동사원형 kick 사용"}]},{"n":3,"en":"You need to understand the important of colors!","ko":"여러분은 색깔의 중요성을 이해해야 해요!","fx":[{"w":"important","r":"importance","at":5,"t":"품사","m":"관사 the 뒤에는 명사 importance 사용"}]},{"n":4,"en":"Soccer balls today come on various colors, but black and white balls is quite common.","ko":"오늘날 축구공은 다양한 색깔로 나오지만, 검고 흰 축구공이 상당히 흔합니다.","fx":[{"w":"on","r":"in","at":4,"t":"기본전치사","m":"'~색으로 나오다'는 come in 사용"},{"w":"is","r":"are","at":12,"t":"be동사의 수일치","m":"복수 주어 balls에는 are 사용"}]},{"n":5,"en":"Have you heard about the origin of this popular design? Black and white balls comes out during the 1970 World Cup on Mexico.","ko":"여러분은 이 인기 있는 디자인의 기원에 대해 들어 본 적 있나요? 검고 흰 축구공은 1970년 멕시코 월드컵 동안에 나왔습니다.","fx":[{"w":"comes","r":"came","at":14,"t":"일반동사의 과거형","m":"과거 이야기이므로 came 사용"},{"w":"on","r":"in","at":21,"t":"기본전치사","m":"'멕시코에서(나라 안)'는 in Mexico 사용"}]},{"n":6,"en":"People could spotted them easily on their black and white TVs. Isn't that smart?","ko":"사람들은 그들의 흑백 TV에서 그것들을 쉽게 발견할 수 있었어요. 그것은 똑똑하지 않나요?","fx":[{"w":"spotted","r":"spot","at":2,"t":"조동사 뒤 동사원형","m":"조동사 could 뒤에는 동사원형: spot (spotted 아님)"}]},{"n":8,"en":"Players on each team wears uniforms with their own colors. Uniform colors have the power to unite the team under the same spirit.","ko":"각 팀의 선수들은 자신들만의 색깔이 있는 유니폼을 입습니다. 유니폼 색깔은 팀을 같은 정신 아래 결속시키는 힘을 가졌습니다.","fx":[{"w":"wears","r":"wear","at":4,"t":"주어와 동사의 수일치","m":"주어 Players(복수)는 wear (wears 아님)"}]},{"n":9,"en":"They are also usefully on the field. Players can spot each other and make quickly decisions thanks for their team's unique colors.","ko":"그것들은 또한 경기장에서 유용합니다. 선수들은 그들의 팀의 고유한 색깔 덕분에 서로를 알아보고 빠른 결정을 내릴 수 있습니다.","fx":[{"w":"usefully","r":"useful","at":3,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 useful 사용"},{"w":"quickly","r":"quick","at":14,"t":"형용사와 부사","m":"명사 decisions를 꾸미는 말은 형용사 quick 사용"},{"w":"for","r":"to","at":17,"t":"관용 표현","m":"'~덕분에'는 thanks to 사용"}]},{"n":11,"en":"Among several color, black has been their favorite. Black looks powerful, and it sends an strong \"Don't argue with me!\" messages.","ko":"몇몇의 색깔 중에서, 검은색은 그들이 가장 좋아하는 것입니다. 검은색은 강력해 보이고 \"나와 논쟁하지 마시오!\"라는 강한 메시지를 전합니다.","fx":[{"w":"color","r":"colors","at":2,"t":"명사의 복수형","m":"several 뒤에는 복수명사 colors 사용"},{"w":"an","r":"a","at":14,"t":"관사 a/an","m":"자음 소리 strong 앞에는 a 사용"},{"w":"messages","r":"message","at":20,"t":"명사의 단수형","m":"a strong 뒤에는 단수명사 message 사용"}]},{"n":13,"en":"Yellow cards say, \"Be careful with that fouls!\" Red cards mean \"You're out!\"","ko":"옐로카드는 \"그러한 반칙들을 조심하시오!\"라고 말합니다. 레드카드는 \"당신은 퇴장입니다!\"를 의미합니다.","fx":[{"w":"that","r":"those","at":6,"t":"지시형용사","m":"복수명사 fouls 앞에는 those 사용"}]},{"n":14,"en":"All players from different country clearly understand the meaning of these card.","ko":"다양한 나라 출신의 모든 선수들은 이 카드들의 의미를 분명하게 이해합니다.","fx":[{"w":"country","r":"countries","at":4,"t":"명사의 복수형","m":"different 뒤에는 복수명사 countries 사용"},{"w":"card","r":"cards","at":11,"t":"지시형용사","m":"these 뒤에는 복수명사 cards 사용"}]},{"n":16,"en":"It will be more funnier!","ko":"그것은 더 재미있을 것입니다!","fx":[{"w":"funnier","r":"fun","at":4,"t":"비교급","m":"more와 -er를 함께 쓰지 않고 more fun 사용"}]}]},{"no":"31","t":"Sleep Matters for Teenagers","q":[{"n":2,"en":"I'm so happily to have about 400 teenager here for my live stream.","ko":"여기 제 라이브 방송에 약 400명의 십대들이 함께해 주셔서 정말 기쁩니다.","fx":[{"w":"happily","r":"happy","at":2,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 happy 사용"},{"w":"teenager","r":"teenagers","at":7,"t":"명사의 복수형","m":"숫자 400 뒤에는 복수명사 teenagers 사용"}]},{"n":3,"en":"Today, we will talks about sleep. Ready?","ko":"오늘 우리는 수면에 대해 이야기할 거예요. 준비됐나요?","fx":[{"w":"talks","r":"talk","at":3,"t":"조동사","m":"조동사 will 뒤는 동사원형: talk (talks 아님)"}]},{"n":5,"en":"Sleep is such important that you can't live without it. When you sleep, your body repair your cells and muscles.","ko":"수면은 매우 중요해서 잠을 자지 않고는 살 수가 없습니다. 잠을 잘 때, 여러분의 몸은 여러분의 세포와 근육을 회복시킵니다.","fx":[{"w":"such","r":"so","at":2,"t":"so ~ that 구문","m":"형용사 앞에는 so ~ that 사용"},{"w":"repair","r":"repairs","at":15,"t":"3인칭 단수 현재형","m":"주어 your body는 단수: repairs (repair 아님)"}]},{"n":7,"en":"Sleep is important for your physically health. And it is also important for you memory.","ko":"수면은 신체 건강에 중요합니다. 또한 수면은 여러분의 기억력에도 중요합니다.","fx":[{"w":"physically","r":"physical","at":5,"t":"형용사와 부사","m":"명사 health 앞에는 형용사 physical 사용"},{"w":"you","r":"your","at":13,"t":"인칭대명사의 소유격","m":"memory 앞에는 소유격 your 사용"}]},{"n":8,"en":"While you sleep, your brain clears memories that are not need. This make space for new memories.","ko":"잠을 자는 동안, 여러분의 뇌는 필요 없는 기억들을 정리합니다. 이것이 새로운 기억들을 위한 공간을 만듭니다.","fx":[{"w":"need","r":"needed","at":10,"t":"수동태","m":"수동태는 be + 과거분사 needed 사용"},{"w":"make","r":"makes","at":12,"t":"3인칭 단수 현재형","m":"주어 This는 단수: makes (make 아님)"}]},{"n":9,"en":"Imagine keeping every details of your experiences in your memory. It would be like an room with unnecessary items everywhere.","ko":"여러분의 경험의 모든 세부사항을 기억한다고 상상해 보세요. 그것은 마치 불필요한 물건들이 가득한 방과 같을 겁니다.","fx":[{"w":"details","r":"detail","at":3,"t":"every + 단수명사","m":"every 뒤에는 단수명사 detail 사용"},{"w":"an","r":"a","at":14,"t":"관사 a/an","m":"자음 소리 room 앞에는 a 사용"}]},{"n":10,"en":"sweetdream: During sleep, the brain work like a cleaner.","ko":"sweetdream: 잠자는 동안, 뇌는 청소부처럼 작동해요.","fx":[{"w":"work","r":"works","at":5,"t":"3인칭 단수 현재형","m":"주어 the brain은 단수: works (work 아님)"}]},{"n":11,"en":"Sweetdream made a good point. Yes, unnecessary memories are cleaned up by your brain during you sleep.","ko":"Sweetdream이 좋은 말을 했습니다. 맞습니다, 잠을 자는 동안 뇌는 불필요한 기억들을 정리합니다.","fx":[{"w":"during","r":"while","at":14,"t":"접속사와 전치사","m":"뒤에 절이 오므로 접속사 while 사용"}]},{"n":12,"en":"Now, let's look at some questions. Here's a interesting one.","ko":"이제 몇 가지 질문을 살펴봅시다. 여기 흥미로운 질문이 하나 있네요.","fx":[{"w":"a","r":"an","at":7,"t":"관사 a/an","m":"모음 소리 interesting 앞에는 an 사용"}]},{"n":13,"en":"sleepy: I have so many homework in weekdays that I can't sleep enough. So, I sleeps more on weekends.","ko":"sleepy: 저는 평일에는 숙제가 너무 많아서 충분히 잘 수가 없어요. 그래서 주말에는 더 많이 잡니다.","fx":[{"w":"many","r":"much","at":4,"t":"수량 형용사 many/much","m":"셀 수 없는 homework에는 much 사용"},{"w":"in","r":"on","at":6,"t":"기본전치사","m":"요일·주중 앞에는 전치사 on 사용"},{"w":"sleeps","r":"sleep","at":15,"t":"일반동사의 현재형","m":"주어 I에는 sleep 사용"}]},{"n":15,"en":"Try to sleep a lot during weekends may help. But you should try to keep a regular sleep schedule.","ko":"주말 동안 많이 자려고 노력하는 것은 도움이 될 수 있습니다. 하지만 규칙적인 수면 습관을 유지하려고 노력해야 합니다.","fx":[{"w":"Try","r":"Trying","at":0,"t":"동명사","m":"주어 자리에는 동명사 Trying 사용"}]},{"n":16,"en":"Changing sleep patterns too often may lead for health problems.","ko":"수면 패턴을 너무 자주 바꾸는 것은 건강 문제로 이어질 수 있습니다.","fx":[{"w":"for","r":"to","at":7,"t":"기본전치사","m":"'~로 이어지다'는 lead to 사용"}]}]},{"no":"32","t":"VLOG IN GANGNEUNG","q":[{"n":2,"en":"I is here to meet my friend Rebecca and she brother Paul. Oh, there they are!","ko":"친구 Rebecca와 그녀의 남동생 Paul을 만나러 여기 왔어요. 아, 저기 있네요!","fx":[{"w":"is","r":"am","at":1,"t":"be동사의 긍정문","m":"주어 I에는 am 사용"},{"w":"she","r":"her","at":9,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 her 사용"}]},{"n":3,"en":"Rebecca: It's so well to see you again! I'm exciting to look around Gangneung together.","ko":"Rebecca: 다시 만나서 정말 반가워! 같이 강릉을 구경할 생각에 신나.","fx":[{"w":"well","r":"good","at":3,"t":"형용사와 부사","m":"It's 뒤 보어 자리에는 형용사 good 사용"},{"w":"exciting","r":"excited","at":9,"t":"분사형용사","m":"'신이 난'은 excited 사용"}]},{"n":4,"en":"Eunji: We are at Jeongdongjin. We are ride a rail bike before we have lunch.","ko":"은지: 우리는 정동진에 있어요. 우리는 점심을 먹기 전에 레일 바이크를 타고 있어요.","fx":[{"w":"ride","r":"riding","at":7,"t":"현재진행형","m":"be동사 뒤 진행형: riding (ride 아님)"}]},{"n":5,"en":"The rail run along the beach, so the view is nice.","ko":"철로가 해변을 따라 달려서 경치가 정말 좋아요.","fx":[{"w":"run","r":"runs","at":2,"t":"3인칭 단수 현재형","m":"주어 The rail(3인칭 단수): runs (run 아님)"}]},{"n":7,"en":"Paul: It's beautifully. The rail bike is also powered for electricity.","ko":"Paul: 아름다워. 이 레일 바이크는 전기로도 움직인대.","fx":[{"w":"beautifully","r":"beautiful","at":2,"t":"형용사와 부사","m":"It's 뒤 보어 자리에는 형용사 beautiful 사용"},{"w":"for","r":"by","at":9,"t":"기본전치사","m":"수동태의 수단은 by 사용"}]},{"n":9,"en":"Eunji: Wow, it's getting more fast.","ko":"은지: 우와, 점점 빨라지고 있어.","fx":[{"w":"more fast","r":"faster","at":4,"t":"비교급","m":"fast의 비교급은 faster 사용"}]},{"n":10,"en":"Eunji: We are now at the Gangneung Central Market. This is an traditional market that sells much kinds of delicious food.","ko":"은지: 지금 우리는 강릉 중앙시장에 있어요. 여기는 다양한 맛있는 음식을 파는 전통 시장이에요.","fx":[{"w":"an","r":"a","at":11,"t":"관사 a/an","m":"traditional은 자음 소리로 시작하므로 a 사용"},{"w":"much","r":"many","at":16,"t":"수량 형용사 many/much","m":"셀 수 있는 복수명사 kinds 앞에는 many 사용"}]},{"n":11,"en":"Us ordered ongsimi and makguksu. Ongsimi is hot soup with potato balls and makguksu are cold buckwheat noodles.","ko":"우리는 옹심이랑 막국수를 주문했어요. 옹심이는 감자 옹심이가 들어간 뜨거운 국물 요리고, 막국수는 차가운 메밀국수예요.","fx":[{"w":"Us","r":"We","at":0,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 We 사용"},{"w":"are","r":"is","at":14,"t":"주어와 동사의 수일치","m":"단수 주어 makguksu에는 is 사용"}]},{"n":13,"en":"Paul: I prefer ongsimi. The potato balls is chewy and delicious.","ko":"Paul: 나는 옹심이가 더 좋아. 감자 옹심이가 쫄깃하고 맛있어.","fx":[{"w":"is","r":"are","at":7,"t":"주어와 동사의 수일치","m":"복수 주어 balls에는 are 사용"}]},{"n":14,"en":"They also looks cute.","ko":"그리고 모양도 귀여워.","fx":[{"w":"looks","r":"look","at":2,"t":"주어와 동사의 수일치","m":"주어 They(복수): look (looks 아님)"}]},{"n":15,"en":"Rebecca: I like makguksu. The noodles is spicy and tasty.","ko":"Rebecca: 나는 막국수가 좋아. 면이 매콤하고 맛있어.","fx":[{"w":"is","r":"are","at":6,"t":"주어와 동사의 수일치","m":"주어 The noodles(복수): are (is 아님)"}]},{"n":16,"en":"Eunji: Do you want to try sundubu ice cream of dessert? Sundubu is soft tofus.","ko":"은지: 디저트로 순두부 아이스크림 먹어 볼래? 순두부는 부드러운 두부야.","fx":[{"w":"of","r":"for","at":9,"t":"기본전치사","m":"'디저트로'는 for dessert 사용"},{"w":"tofus","r":"tofu","at":14,"t":"셀 수 없는 명사","m":"tofu는 셀 수 없는 명사라 tofu 사용"}]},{"n":18,"en":"Eunji: Yes. I believe it was invented with people in the Gangneung area.","ko":"은지: 맞아. 강릉 지역 사람들이 발명한 것이라고 생각해.","fx":[{"w":"with","r":"by","at":7,"t":"기본전치사","m":"수동태의 행위자는 by 사용"}]},{"n":19,"en":"Rebecca: I'm such excited to try it!","ko":"Rebecca: 먹어 볼 생각에 정말 신나!","fx":[{"w":"such","r":"so","at":2,"t":"부사 so/such","m":"형용사 excited 앞에는 so 사용"}]}]},{"no":"33","t":"Data Saved Thousands of Lives","q":[{"n":1,"en":"You may knows Florence Nightingale as an nurse who helped sick people. But did you also knew that she was good at math?","ko":"여러분은 Florence Nightingale을 아픈 사람들을 도운 간호사라고 알고 있을지 모른다. 그러나 여러분은 그녀가 수학 또한 잘했다는 것을 알고 있었는가?","fx":[{"w":"knows","r":"know","at":2,"t":"조동사 뒤 동사원형","m":"조동사 may 뒤에는 동사원형 know 사용"},{"w":"an","r":"a","at":6,"t":"관사 a/an","m":"nurse는 자음 소리로 시작하므로 a 사용"},{"w":"knew","r":"know","at":16,"t":"did 뒤 동사원형","m":"did 뒤에는 동사원형 know 사용"}]},{"n":2,"en":"When she was young, Nightingale liked playing with number. She enjoyed counting travel time and distance on family trips.","ko":"Nightingale은 어릴 때 숫자를 가지고 노는 것을 좋아했다. 그녀는 가족 여행에서 여행 시간과 거리를 세는 것을 즐겼다.","fx":[{"w":"number","r":"numbers","at":8,"t":"가산명사 복수형","m":"여러 숫자이므로 복수 numbers 사용"}]},{"n":3,"en":"Then she gathered the numbers and record them as data. Nightingale knew that data was important.","ko":"그러고 나서 그녀는 그 숫자들을 모으고 그것들을 데이터로 기록했다. Nightingale은 데이터가 중요하다는 것을 알았다.","fx":[{"w":"record","r":"recorded","at":6,"t":"시제","m":"과거 서술이므로 recorded (record 아님)"}]},{"n":5,"en":"During the Crimean War, Nightingale went at the battlefield to help sick soldier. The hospital was more worse than she thought.","ko":"크림전쟁 동안 Nightingale은 아픈 군인들을 돕기 위해 전쟁터에 갔다. 병원은 그녀가 생각했던 것보다 훨씬 더 형편없었다.","fx":[{"w":"at","r":"to","at":6,"t":"기본전치사","m":"went 뒤 방향은 전치사 to 사용"},{"w":"soldier","r":"soldiers","at":12,"t":"명사의 복수형","m":"여러 병사이므로 복수 soldiers 사용"},{"w":"more","r":"much","at":16,"t":"비교급","m":"worse가 이미 비교급이라 more 없이 much worse 사용"}]},{"n":6,"en":"It was dirty, messy, and full with bugs! Nightingale knew that dirty hospitals could be bad for the soldiers.","ko":"그것은 더럽고, 지저분하고, 벌레로 가득 차 있었다! Nightingale은 더러운 병원이 군인들에게 안 좋을 수 있다는 것을 알았다.","fx":[{"w":"with","r":"of","at":6,"t":"기본전치사","m":"\"~로 가득 찬\"은 full of 사용"}]},{"n":7,"en":"Much soldiers got sick and died in the dirty hospital than in battle. She wanted to change that.","ko":"전투에서보다 더러운 병원에서 더 많은 군인들이 아프고 죽었다. 그녀는 그것을 변화시키고 싶었다.","fx":[{"w":"Much","r":"More","at":0,"t":"수량 형용사 many/much","m":"셀 수 있는 soldiers 앞에는 many의 비교급 More 사용"}]},{"n":8,"en":"She asked England to make the hospital much cleaner and more safer. However, the leaders of England didn't understand.","ko":"그녀는 병원을 훨씬 더 깨끗하고 더 안전하게 만들어달라고 영국에 요청했다. 그러나 영국의 지도자들은 이해하지 못했다.","fx":[{"w":"more safer","r":"safer","at":10,"t":"비교급","m":"safer는 이미 비교급이므로 more 없이 safer 사용"}]},{"n":9,"en":"To help they see the problem, she collected data about the number of wounded and dead soldiers.","ko":"그들이 문제를 이해하도록 돕기 위해, 그녀는 부상을 입고 죽은 군인들의 숫자에 대한 데이터를 수집했다.","fx":[{"w":"they","r":"them","at":2,"t":"인칭대명사의 목적격","m":"동사 help 뒤에는 목적격 them 사용"}]},{"n":11,"en":"To solving this problem, Nightingale created a simple picture. It is called Nightingale's rose diagram.","ko":"문제를 해결하기 위해 Nightingale은 간단한 그림을 만들었다. 그것은 Nightingale의 로즈 다이어그램이라고 불린다.","fx":[{"w":"solving","r":"solve","at":1,"t":"to부정사","m":"목적의 to부정사: To solve (To solving 아님)"}]},{"n":12,"en":"The diagram looked like a rose with twelve petal. Each petal showed a month, and larger petals meant more deaths.","ko":"그 다이어그램은 12개의 꽃잎이 있는 장미처럼 보였다. 각 꽃잎은 한 달을 나타내고, 더 큰 꽃잎은 더 많은 죽음을 의미했다.","fx":[{"w":"petal","r":"petals","at":8,"t":"수사 뒤 복수명사","m":"twelve 뒤에는 복수명사 petals 사용"}]},{"n":13,"en":"In the rose diagram, three different colors was used by Nightingale: blue, red, and black.","ko":"로즈 다이어그램에서 Nightingale에 의해 세 개의 다른 색깔이 사용되었다: 파란색, 빨간색, 그리고 검은색이다.","fx":[{"w":"was","r":"were","at":7,"t":"수동태","m":"복수 주어 colors이므로 were used (was 아님)"}]},{"n":14,"en":"Blue is for disease, red are for battle wounds, and black is for other causes. Surprisingly, the blue part was the most large!","ko":"파란색은 질병, 빨간색은 전투 부상, 그리고 검은색은 다른 원인을 나타낸다. 놀랍게도, 파란색 부분이 가장 컸다!","fx":[{"w":"are","r":"is","at":5,"t":"주어와 동사의 수일치","m":"단수 주어 red는 is (are 아님)"},{"w":"most large","r":"largest","at":21,"t":"최상급","m":"large의 최상급은 the largest 사용"}]},{"n":15,"en":"Nightingale used this diagram to show her data simple and clearly. She was very smart and creative.","ko":"Nightingale은 그녀의 데이터를 간단하고 분명히 보여 주기 위해 이 다이어그램을 사용했다. 그녀는 매우 똑똑하고 창의적이었다.","fx":[{"w":"simple","r":"simply","at":8,"t":"형용사와 부사","m":"동사 show를 꾸미는 말은 부사 simply 사용"}]}]},{"no":"34","t":"Be a Smart Shopper","q":[{"n":1,"en":"Do you think you are an smart shopper? Well, you may think you are, but hold on!","ko":"여러분은 자신이 현명한 구매자라고 생각하나요? 글쎄요, 여러분은 그렇다고 생각할 수도 있지만, 잠깐만요!","fx":[{"w":"an","r":"a","at":5,"t":"관사 a/an","m":"자음 소리 s 앞에는 a smart 사용"}]},{"n":2,"en":"There are various marketing strategies which influences your decisions. Learning about them will make you a smartest shopper.","ko":"여러분의 결정에 영향을 미치는 다양한 마케팅 전략들이 있어요. 그것들에 대해 배우는 것이 여러분을 더 현명한 구매자로 만들 거예요.","fx":[{"w":"influences","r":"influence","at":6,"t":"주어-동사 수일치","m":"strategies(복수)를 받는 which는 influence (influences 아님)"},{"w":"smartest","r":"smarter","at":16,"t":"비교급","m":"a 뒤에는 비교급 smarter 사용 (최상급은 the)"}]},{"n":3,"en":"Junho: What? The sale end in two hours?","ko":"준호: 뭐라고? 세일이 두 시간 후에 끝난다고?","fx":[{"w":"end","r":"ends","at":4,"t":"3인칭 단수 현재형","m":"주어 The sale(3인칭 단수)은 ends (end 아님)"}]},{"n":4,"en":"If I don't buy the sneakers now, I will have to buy it at a highest price.","ko":"지금 운동화를 사지 않으면, 더 비싼 가격에 그것을 사야 할 거야.","fx":[{"w":"it","r":"them","at":12,"t":"인칭대명사","m":"sneakers(복수)를 가리키므로 them 사용"},{"w":"highest","r":"higher","at":15,"t":"비교급","m":"a 뒤에는 비교급 higher 사용"}]},{"n":5,"en":"Stop, Junho! You're buying the sneakers just because of you don't want to miss the sale.","ko":"멈춰, 준호야! 너는 단지 세일을 놓치고 싶지 않아서 운동화를 사고 있는 거야.","fx":[{"w":"of you","r":"you","at":8,"t":"접속사 because","m":"뒤에 절이 오면 because, because of 아님"}]},{"n":7,"en":"If people can buy a product only for a limited times, they often feel \"hungry\" of it and want to buy it.","ko":"만약 사람들이 한정된 시간 동안만 제품을 살 수 있다면, 그들은 종종 그 제품에 대해 '배고프다'고 느끼고 그것을 사고 싶어 해.","fx":[{"w":"times","r":"time","at":10,"t":"명사의 단수형","m":"a 뒤에는 단수명사 time 사용"},{"w":"of","r":"for","at":15,"t":"기본전치사","m":"'~을 갈망하는'은 hungry for 사용"}]},{"n":8,"en":"About missing the sale, don't worry, Junho. You'll soon see a similarly sale again.","ko":"세일을 놓치는 것에 대해서는 걱정하지 마, 준호야. 너는 곧 비슷한 세일을 다시 보게 될 거야.","fx":[{"w":"similarly","r":"similar","at":11,"t":"형용사와 부사","m":"명사 sale 앞에는 형용사 similar 사용"}]},{"n":9,"en":"Yuna: That's the hottest dress on social media now. Lots people are wearing it.","ko":"유나: 저건 지금 소셜 미디어에서 가장 인기 있는 원피스야. 많은 사람들이 이것을 입고 있어.","fx":[{"w":"people","r":"of people","at":10,"t":"수량 표현","m":"'많은'은 Lots of 사용 (of 필요)"}]},{"n":11,"en":"Wait, Yuna! You only wants the dress because you saw them again and again on social media.","ko":"잠깐, 유나야! 너는 소셜 미디어에서 그 원피스를 계속 봤기 때문에 그것을 원하는 것뿐이야.","fx":[{"w":"wants","r":"want","at":4,"t":"동사의 수일치","m":"주어 You에는 want 사용"},{"w":"them","r":"it","at":10,"t":"인칭대명사","m":"dress(단수)를 가리키므로 it 사용"}]},{"n":12,"en":"It isn't just you. There are a lot of people who fall for an viral marketing strategy.","ko":"너뿐만이 아니야. 바이럴 마케팅 전략에 속는 사람들이 많아.","fx":[{"w":"an","r":"a","at":13,"t":"관사 a/an","m":"자음 소리 v 앞에는 a viral 사용"}]},{"n":14,"en":"Informations about a product can spreads quickly and widely on the Internet, just like a \"virus.\"","ko":"제품에 대한 정보는 '바이러스'처럼 인터넷에서 빠르게 널리 퍼질 수 있어.","fx":[{"w":"Informations","r":"Information","at":0,"t":"셀 수 없는 명사","m":"information은 셀 수 없으므로 Information 사용"},{"w":"spreads","r":"spread","at":5,"t":"조동사","m":"can 뒤에는 동사원형 spread 사용"}]},{"n":15,"en":"If a product becomes hot on social media, people natural want to have it.","ko":"만약 어떤 제품이 소셜 미디어에서 인기를 끌게 되면, 사람들은 자연스럽게 그것을 갖고 싶어 해.","fx":[{"w":"natural","r":"naturally","at":9,"t":"형용사와 부사","m":"동사 want 수식은 부사 naturally 사용"}]},{"n":16,"en":"Yuna, just remember that a popular product aren't always right for you.","ko":"유나야, 인기 있는 제품이 항상 너에게 적합한 것은 아니라는 것을 기억하렴.","fx":[{"w":"aren't","r":"isn't","at":7,"t":"be동사의 수일치","m":"주어 product(단수)에는 isn't 사용"}]}]},{"no":"35","t":"See You in London!","q":[{"n":1,"en":"I can't wait to tell you about my trip to London. The flight taked 15 hours from Incheon.","ko":"런던으로 다녀온 나의 여행에 대해 너에게 어서 말해 주고 싶다. 비행은 인천에서부터 15시간이 걸렸다.","fx":[{"w":"taked","r":"took","at":13,"t":"불규칙 과거형","m":"take의 과거형은 took (taked 아님)"}]},{"n":2,"en":"When I met my friend Amelia at the airport, I was so excitedly. I have known her for I was 10 years old.","ko":"내가 내 친구 Amelia를 공항에서 만났을 때, 나는 매우 신이 났다. 내가 10살이었을 때부터 나는 그녀와 알고 지냈다.","fx":[{"w":"excitedly","r":"excited","at":12,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 excited 사용"},{"w":"for","r":"since","at":17,"t":"접속사 since","m":"'~한 이후로'는 접속사 since 사용"}]},{"n":3,"en":"She took me to many places in London. Come with I on my amazing trip!","ko":"그녀는 나를 런던의 많은 곳에 데려가 주었다. 나의 굉장한 여행에 나와 함께 가 봐!","fx":[{"w":"I","r":"me","at":10,"t":"인칭대명사의 목적격","m":"전치사 with 뒤에는 목적격 me 사용"}]},{"n":4,"en":"We got on the famous red bus and the first stop were Buckingham Palace. The King and his family lives there.","ko":"우리는 유명한 빨간색 버스에 올라탔고 첫 번째 정류장은 버킹엄 궁전이었다. 왕과 그의 가족이 그곳에 산다.","fx":[{"w":"were","r":"was","at":11,"t":"be동사의 수일치","m":"주어 stop(단수)에는 was 사용"},{"w":"lives","r":"live","at":19,"t":"주어와 동사의 수일치","m":"The King and his family(복수)에는 live 사용"}]},{"n":6,"en":"We took pictures near they, but they didn't smile or move. They were like statues!","ko":"우리는 그들 근처에서 사진을 찍었지만, 그들은 웃거나 움직이지 않았다. 그들은 조각상들 같았다!","fx":[{"w":"they","r":"them","at":4,"t":"인칭대명사의 목적격","m":"전치사 near 뒤에는 목적격 them 사용"}]},{"n":7,"en":"Next, we went to Camden Market. These market is known for its food from around the world.","ko":"다음으로, 우리는 캠던 마켓에 갔다. 이 시장은 세계 곳곳의 음식으로 알려져 있다.","fx":[{"w":"These","r":"This","at":6,"t":"지시형용사","m":"단수명사 market 앞에는 This 사용"}]},{"n":8,"en":"Amelia told me try the fish and chips. I thought, \"What strange!","ko":"Amelia는 나에게 피시앤칩스를 먹어 보라고 말했다. 나는 생각했다, \"이상하네!","fx":[{"w":"try","r":"to try","at":3,"t":"to부정사","m":"tell + 목적어 + to V: to try (try 아님)"},{"w":"What","r":"How","at":10,"t":"감탄문","m":"형용사 strange 앞에는 How 사용"}]},{"n":9,"en":"I have ate fish many times. But I've never tried it with potato chips.\"","ko":"나는 생선을 여러 번 먹어 봤어. 하지만 나는 감자칩과 함께 먹어 본 적은 없어.\"","fx":[{"w":"ate","r":"eaten","at":2,"t":"현재완료","m":"have 뒤에는 과거분사 eaten (ate 아님)"}]},{"n":10,"en":"But when the food came out, I found out that they calls French fries \"chips\" on London!","ko":"그러나 음식이 나왔을 때, 나는 그들이 런던에서 프렌치프라이(감자튀김)를 '칩스'라고 부른다는 것을 알게 되었다!","fx":[{"w":"calls","r":"call","at":11,"t":"주어와 동사의 수일치","m":"주어 they에는 call 사용"},{"w":"on","r":"in","at":15,"t":"기본전치사","m":"'런던에서'는 전치사 in 사용"}]},{"n":11,"en":"After an yummy British meal, we walked around the market. We saw the famous red phone booth and took more pictures.","ko":"맛있는 영국 음식을 먹은 후, 우리는 시장을 돌아다녔다. 우리는 유명한 빨간색 공중전화 부스를 보았고 더 많은 사진을 찍었다.","fx":[{"w":"an","r":"a","at":1,"t":"관사 a/an","m":"yummy는 자음 소리이므로 a 사용"}]},{"n":12,"en":"Then I bought a prettily plate for my mom. What a fun day!","ko":"그러고 나서 나는 엄마를 위해 예쁜 접시를 하나 샀다. 정말 재밌는 하루였다!","fx":[{"w":"prettily","r":"pretty","at":4,"t":"형용사와 부사","m":"명사 plate 앞에는 형용사 pretty 사용"}]}]},{"no":"36","t":"Do You Have Popcorn Brain?","q":[{"n":1,"en":"Imagine this—you are do your homework at your desk. Suddenly, you remember that your mom asked you call her.","ko":"이런 상상을 해 보세요. 당신은 책상에서 숙제를 하고 있어요. 갑자기 엄마가 당신에게 전화하라고 요청했던 것이 기억나요.","fx":[{"w":"do","r":"doing","at":3,"t":"현재진행형","m":"be동사 뒤 진행형은 -ing: doing (do 아님)"},{"w":"call","r":"to call","at":17,"t":"to부정사","m":"ask+목적어 뒤 to부정사: to call (call 아님)"}]},{"n":2,"en":"When you pick up your smartphone, a message pops up. It is for an new video from your favorite channel.","ko":"당신이 스마트폰을 집어 들 때, 메시지가 하나 떠요. 그것은 당신이 가장 좋아하는 채널의 새 영상에 대한 것이에요.","fx":[{"w":"an","r":"a","at":13,"t":"관사 a/an","m":"new는 자음 소리로 시작하므로 a 사용"}]},{"n":3,"en":"You watch the video and keep watching much other short videos. Then, you hear another sound.","ko":"당신은 그 영상을 시청하고 다른 많은 짧은 영상들을 계속 시청해요. 그러자 또 다른 소리가 들려요.","fx":[{"w":"much","r":"many","at":7,"t":"수량 형용사 many/much","m":"복수명사 videos 앞에는 many 사용"}]},{"n":4,"en":"There is a sale on the shoes that you real want. You were going to ask your mom to buy them for you.","ko":"당신이 정말 갖고 싶은 신발이 할인 판매 중이에요. 당신은 엄마에게 그것을 사 달라고 부탁하려고 했었죠.","fx":[{"w":"real","r":"really","at":9,"t":"형용사와 부사","m":"동사 want를 꾸미는 말은 부사 really 사용"}]},{"n":5,"en":"Wait, you forgot to call her two hour ago! If this story feels like your, you may have \"popcorn brain.\"","ko":"잠깐, 두 시간 전에 엄마에게 전화하는 것을 잊었네요! 만약 이 이야기가 당신의 이야기처럼 느껴진다면, 당신은 ‘팝콘 브레인’을 가지고 있을지도 몰라요.","fx":[{"w":"hour","r":"hours","at":7,"t":"명사의 복수형","m":"two 뒤에는 복수명사 hours 사용"},{"w":"your","r":"yours","at":14,"t":"소유대명사","m":"뒤에 명사가 없으므로 소유대명사 yours 사용"}]},{"n":6,"en":"It is easy to experience popcorn brain when you does many things in the same time on your smartphone.","ko":"당신이 스마트폰으로 동시에 많은 일을 할 때 팝콘 브레인을 경험하기 쉬워요.","fx":[{"w":"does","r":"do","at":9,"t":"일반동사의 수일치","m":"주어 you에는 do: do (does 아님)"},{"w":"in","r":"at","at":12,"t":"기본전치사","m":"at the same time: at (in 아님)"}]},{"n":7,"en":"You keep moving down the screen and clicking, and many thoughts pop up quick, like popcorn in an pan!","ko":"당신이 계속 화면을 아래로 내리고 클릭하면, 마치 팬에 있는 팝콘처럼 많은 생각들이 빠르게 튀어나와요!","fx":[{"w":"quick","r":"quickly","at":13,"t":"형용사와 부사","m":"동사 pop up을 꾸미는 말은 부사 quickly 사용"},{"w":"an","r":"a","at":17,"t":"관사 a/an","m":"pan은 자음 소리로 시작하므로 a 사용"}]},{"n":9,"en":"More importantly, people with popcorn brain have trouble paying attentions. They cannot concentrate on one thing for a long time.","ko":"더 중요한 것은, 팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪어요. 그들은 한 가지 일에 오랜 시간 동안 집중할 수 없어요.","fx":[{"w":"attentions","r":"attention","at":9,"t":"셀 수 없는 명사","m":"attention은 셀 수 없는 명사라 복수형 불가"}]},{"n":10,"en":"In a study, people was able to focus on one thing for 2.5 minutes in 2004. Nowadays, people can only concentrate for 47 second.","ko":"한 연구에서, 2004년에는 사람들이 한 가지 일에 2분 30초 동안 집중할 수 있었어요. 요즘에는 사람들이 단지 47초 동안만 집중할 수 있어요.","fx":[{"w":"was","r":"were","at":4,"t":"be동사의 수일치","m":"주어 people(복수)에는 were 사용"},{"w":"second","r":"seconds","at":23,"t":"명사의 복수형","m":"47 뒤에는 복수명사 seconds 사용"}]}]},{"no":"37","t":"Great Failure","q":[{"n":1,"en":"In the early 1900s, many people explored newly lands. Ernest Shackleton was one of they.","ko":"1900년대 초, 많은 사람들이 새로운 땅을 탐험했다. Ernest Shackleton은 그들 중 한 명이었다.","fx":[{"w":"newly","r":"new","at":7,"t":"형용사와 부사","m":"명사 lands 앞에는 형용사 new 사용"},{"w":"they","r":"them","at":14,"t":"인칭대명사의 격","m":"전치사 of 뒤에는 목적격 them 사용"}]},{"n":2,"en":"He headed for Antarctica with a team of 28 man in August 1914.","ko":"그는 1914년 8월에 28명의 팀원들로 구성된 팀과 함께 남극 대륙으로 향했다.","fx":[{"w":"man","r":"men","at":9,"t":"불규칙 복수형","m":"28 뒤에는 복수 men 사용"}]},{"n":3,"en":"On January 20, 1915, Shackleton's team was crossing the sea near Antarctica. Suddenly, the ship hit thick ice and got stucked.","ko":"1915년 1월 20일, Shackleton의 팀은 남극 대륙 근처 바다를 건너고 있었다. 갑자기 배가 두꺼운 얼음에 부딪혔고 갇혀버렸다.","fx":[{"w":"stucked","r":"stuck","at":20,"t":"불규칙 과거분사","m":"get stuck: stuck은 stucked가 아님"}]},{"n":5,"en":"Nine long months passed and the ice started melt. But, the ice broke the ship into pieces.","ko":"아홉 달이라는 긴 시간이 지나고 얼음이 녹기 시작했다. 하지만 얼음이 배를 산산조각 냈다.","fx":[{"w":"melt","r":"melting","at":8,"t":"동명사/to부정사","m":"start 뒤에는 melting 또는 to melt 사용"}]},{"n":6,"en":"The ship started sinking. I ordered me men, \"Give up the ship.","ko":"배는 가라앉기 시작했다. 나는 팀원들에게 명령했다. \"그 배를 포기해라.","fx":[{"w":"me","r":"my","at":6,"t":"인칭대명사의 격","m":"명사 앞 소유격 my 사용"}]},{"n":8,"en":"The ship has sank under the water today. We lost our home and we had to made a camp on the ice.","ko":"오늘 배가 물속에 가라앉아 버렸다. 우리는 집을 잃었고 얼음 위에 캠프를 만들어야 했다.","fx":[{"w":"sank","r":"sunk","at":3,"t":"현재완료","m":"has 뒤에는 과거분사 sunk 사용"},{"w":"made","r":"make","at":16,"t":"to부정사","m":"to 뒤 동사원형: make (made 아님)"}]},{"n":9,"en":"All I can do is to keep strongly for my men. My dream to go to Antarctica is broken, but I've set a new goal.","ko":"내가 할 수 있는 전부는 내 팀원들을 위해 강하게 버티는 것이다. 남극 대륙으로 가려던 나의 꿈은 깨졌지만, 나는 새로운 목표 하나를 세웠다.","fx":[{"w":"strongly","r":"strong","at":7,"t":"형용사와 부사","m":"keep 뒤 보어 자리에는 형용사 strong 사용"}]},{"n":10,"en":"I'll make my men to return home safely.","ko":"나는 내 팀원들이 안전하게 집으로 돌아갈 수 있도록 할 것이다.","fx":[{"w":"to return","r":"return","at":4,"t":"사역동사","m":"make 뒤 목적보어는 원형 return 사용"}]},{"n":11,"en":"I had my men get on the three lifeboat to go at Elephant Island. We got to the island today.","ko":"Elephant Island에 가기 위해 나는 팀원들을 세 척의 구명보트에 타도록 했다. 우리는 오늘 그 섬에 도착했다.","fx":[{"w":"lifeboat","r":"lifeboats","at":8,"t":"명사의 복수형","m":"three 뒤에는 복수 lifeboats 사용"},{"w":"at","r":"to","at":11,"t":"기본전치사","m":"'~로 가다'는 go to 사용"}]},{"n":12,"en":"It took we 7 days on the sea to get to the island. And after 497 days, we finally standed on land again.","ko":"그 섬에 도착하는 데 우리는 바다 위에서 7일을 보냈다. 그리고 497일이 지난 후에야 우리는 마침내 땅 위에 다시 섰다.","fx":[{"w":"we","r":"us","at":2,"t":"인칭대명사의 격","m":"동사 took 뒤에는 목적격 us 사용"},{"w":"standed","r":"stood","at":19,"t":"불규칙 과거형","m":"stand의 과거형은 stood (standed 아님)"}]},{"n":13,"en":"But, there is no help on this island. There is few food to eat and the weather is so cold.","ko":"하지만 이 섬에서는 어떤 도움도 얻을 수 없다. 먹을 음식도 거의 없고 날씨는 매우 춥다.","fx":[{"w":"few","r":"little","at":10,"t":"수량 형용사","m":"셀 수 없는 food 앞에는 little 사용"}]},{"n":14,"en":"We can get help in South Georgia. The island is 1,300 kilometer away and a sea of death is in front for us.","ko":"우리는 South Georgia에서 도움을 받을 수 있다. 그 섬은 1,300 킬로미터나 떨어져 있고 죽음의 바다가 우리 앞에 있다.","fx":[{"w":"kilometer","r":"kilometers","at":11,"t":"명사의 복수형","m":"1,300 뒤에는 복수 kilometers 사용"},{"w":"for","r":"of","at":21,"t":"기본전치사","m":"'~ 앞에'는 in front of 사용"}]}]},{"no":"38","t":"I, Robot Robbie","q":[{"n":2,"en":"Gloria counted aloud and began to searching around the house. The eight-year-old girl were playing hide and seek with Robbie.","ko":"Gloria는 큰 소리로 숫자를 세고 집 주위를 찾아보기 시작했다. 이 8살짜리 여자아이는 Robbie와 숨바꼭질을 하고 있었다.","fx":[{"w":"searching","r":"search","at":6,"t":"to부정사","m":"began to 뒤에는 동사원형 search 사용"},{"w":"were","r":"was","at":13,"t":"be동사 수일치·과거","m":"주어 girl(단수)의 과거형은 was: was playing (were 아님)"}]},{"n":3,"en":"Robbie was a robot who came to her house two years ago. He was her most good friend.","ko":"Robbie는 2년 전에 그녀의 집에 온 로봇이었다. 그는 그녀의 가장 친한 친구였다.","fx":[{"w":"most good","r":"best","at":15,"t":"최상급","m":"good의 최상급은 best 사용"}]},{"n":4,"en":"Robbie was faster and more better at hiding, but he always let her to win. In return, Gloria told he his favorite story, Cinderella.","ko":"Robbie는 더 빠르고 더 잘 숨었지만, 그는 항상 그녀가 이기도록 해 줬다. 보답으로 Gloria는 그가 가장 좋아하는 이야기인 <신데렐라>를 들려주었다.","fx":[{"w":"more better","r":"better","at":4,"t":"비교급","m":"better는 이미 비교급이라 more 불필요"},{"w":"to win","r":"win","at":13,"t":"동사 let","m":"let 뒤에는 동사원형 win 사용"},{"w":"he","r":"him","at":19,"t":"인칭대명사의 목적격","m":"동사 told 뒤에는 목적격 him 사용"}]},{"n":5,"en":"Robbie's metal eyes blinks with joy.","ko":"Robbie의 금속으로 된 눈은 기쁨으로 깜빡였다.","fx":[{"w":"blinks","r":"blinked","at":3,"t":"시제","m":"과거 이야기이므로 과거형 blinked 사용"}]},{"n":7,"en":"She did not likes Robbie. She felt that a robot should not takes care of a child.","ko":"그녀는 Robbie를 좋아하지 않았다. 그녀는 로봇이 아이를 돌봐서는 안 된다고 생각했다.","fx":[{"w":"likes","r":"like","at":3,"t":"do 부정문","m":"did not 뒤에는 동사원형 like 사용"},{"w":"takes","r":"take","at":12,"t":"조동사","m":"조동사 should 뒤에는 동사원형: take (takes 아님)"}]},{"n":8,"en":"She said to she husband, \"Gloria plays only with Robbie. She does not plays with other children.\"","ko":"그녀는 남편에게 \"Gloria는 Robbie하고만 놀아요. 그 애는 다른 아이들하고는 놀지 않아요.\"라고 말했다.","fx":[{"w":"she","r":"her","at":3,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 her 사용"},{"w":"plays","r":"play","at":13,"t":"do 부정문","m":"does not 뒤에는 동사원형: play (plays 아님)"}]},{"n":9,"en":"Mr. Weston did not agree with her. He thought that Robbie was a greatly help to Gloria and the family.","ko":"Weston 씨는 그녀의 생각에 동의하지 않았다. 그는 Robbie가 Gloria와 가족에게 큰 도움이 된다고 생각했다.","fx":[{"w":"greatly","r":"great","at":13,"t":"형용사와 부사","m":"명사 help 앞에는 형용사 great 사용"}]},{"n":10,"en":"After a long talk, however, they decided returning Robbie to the factory.","ko":"하지만 긴 대화 후에 그들은 Robbie를 공장에 돌려보내기로 결정했다.","fx":[{"w":"returning","r":"to return","at":7,"t":"to부정사","m":"decide는 to부정사를 목적어로: to return (returning 아님)"}]},{"n":11,"en":"When Gloria found that Robbie was gone, she cried, \"He is a persons just like you and me, and he is my friend! Bring him back!\"","ko":"Gloria는 Robbie가 사라진 것을 알게 되었을 때, \"그는 엄마 아빠와 저랑 똑같은 사람이고, 그는 제 친구예요! 그를 다시 데려와요!\"라고 울부짖었다.","fx":[{"w":"persons","r":"person","at":12,"t":"명사의 복수형","m":"a 뒤에는 단수명사 person 사용"}]},{"n":12,"en":"Gloria's smile was gone. Even an new pet and a trip to New York did not help.","ko":"Gloria의 미소는 사라졌다. 새로운 반려동물도 뉴욕으로의 여행도 소용없었다.","fx":[{"w":"an","r":"a","at":5,"t":"관사 a/an","m":"new는 자음 소리라 a new pet 사용"}]},{"n":14,"en":"In the end, her parents took Gloria to the factory. Mrs. Weston pointed to the robot workers and said, \"Look at they, Gloria.","ko":"결국, 그녀의 부모는 Gloria를 공장에 데려갔다. Weston 부인은 일하는 로봇을 가리키며 \"저들을 봐, Gloria.","fx":[{"w":"they","r":"them","at":21,"t":"인칭대명사의 목적격","m":"전치사 at 뒤에는 목적격 them 사용"}]},{"n":16,"en":"She was searching to Robbie.","ko":"그녀는 Robbie를 찾고 있었다.","fx":[{"w":"to","r":"for","at":3,"t":"기본전치사","m":"'~를 찾다'는 search for 사용"}]},{"n":17,"en":"\"There he is!\" She shouted with joyful.","ko":"\"저기에 있다!\" 그녀는 기뻐서 소리쳤다.","fx":[{"w":"joyful","r":"joy","at":6,"t":"품사 혼동","m":"전치사 with 뒤에는 명사 joy 사용"}]},{"n":18,"en":"She was such happy that she ran toward him. At that moment, a hugely machine was rushing toward her.","ko":"그녀는 너무 행복해서 그에게 달려갔다. 그 순간 거대한 기계가 그녀에게로 돌진하고 있었다.","fx":[{"w":"such","r":"so","at":2,"t":"so와 such","m":"형용사 앞에는 so 사용 (such 아님)"},{"w":"hugely","r":"huge","at":13,"t":"형용사와 부사","m":"명사 machine을 꾸미는 형용사 huge 사용"}]},{"n":20,"en":"Gloria hugged Robbie tightly. This time, even Mrs. Weston could not separated them.","ko":"Gloria는 Robbie를 꼭 껴안았다. 이번에는 Weston 부인조차도 그들을 갈라놓을 수 없었다.","fx":[{"w":"separated","r":"separate","at":11,"t":"조동사","m":"조동사 could not 뒤에는 동사원형: separate (separated 아님)"}]},{"n":21,"en":"Gloria's parents changed they minds about Robbie and brought him back home. Finally, the two friend lived together happily.","ko":"Gloria의 부모는 Robbie에 대한 그들의 마음을 바꿨고 그를 집에 다시 데려왔다. 결국, 두 친구는 함께 행복하게 살았다.","fx":[{"w":"they","r":"their","at":3,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 their 사용"},{"w":"friend","r":"friends","at":15,"t":"명사의 복수형","m":"two 뒤에는 복수명사 friends 사용"}]}]},{"no":"39","t":"Hula, More than Just a Dance","q":[{"n":2,"en":"Aloha mean \"hello\" or \"goodbye\" in the Hawaiian language. I'm Malia, and I'm you hula teacher for today.","ko":"'알로하'는 하와이어로 '안녕하세요' 또는 '안녕히 가세요'라는 뜻이에요. 저는 Malia이고 오늘 당신의 훌라 선생님이에요.","fx":[{"w":"mean","r":"means","at":1,"t":"3인칭 단수 현재형","m":"3인칭 단수 주어 Aloha에는 means 사용"},{"w":"you","r":"your","at":13,"t":"인칭대명사의 격","m":"명사 앞 소유격 your 사용"}]},{"n":4,"en":"Before we start our lesson, I want tell you about it.","ko":"수업을 시작하기 전에 그것에 대해 말씀드리고 싶어요.","fx":[{"w":"tell","r":"to tell","at":7,"t":"to부정사","m":"want 뒤에는 to tell 사용"}]},{"n":5,"en":"Hula is an traditional dance from Hawaii, and it has been a part of Hawaiian life since a long time.","ko":"훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 traditional 앞에는 a 사용"},{"w":"since","r":"for","at":16,"t":"기본전치사","m":"기간 a long time 앞에는 for 사용"}]},{"n":6,"en":"The early Hawaiians didn't have a writing systems, so them used hula to tell stories.","ko":"초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요.","fx":[{"w":"systems","r":"system","at":7,"t":"명사의 복수형","m":"a 뒤에는 단수명사 system 사용"},{"w":"them","r":"they","at":9,"t":"인칭대명사의 격","m":"주어 자리에는 주격 they 사용"}]},{"n":7,"en":"Hula is a language through body movements, and it has pass down stories from one generation to the next.","ko":"훌라는 몸의 움직임을 통한 언어로, 한 세대에서 다음 세대로 이야기를 전해 왔습니다.","fx":[{"w":"pass","r":"passed","at":10,"t":"현재완료","m":"현재완료는 has + 과거분사: has passed (pass 아님)"}]},{"n":9,"en":"You tell a story with your hands, foot, and hips. Oh, you need to take off your shoes and socks!","ko":"당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요. 아, 신발과 양말을 벗어야 해요!","fx":[{"w":"foot","r":"feet","at":7,"t":"불규칙 복수형","m":"foot의 복수형은 feet"}]},{"n":11,"en":"Let's starts with the hand gestures. Every gestures in hula has a meaning.","ko":"손동작부터 시작할게요. 훌라의 모든 동작에는 의미가 있어요.","fx":[{"w":"starts","r":"start","at":1,"t":"Let's 제안문","m":"Let's 뒤에는 동사원형 start 사용"},{"w":"gestures","r":"gesture","at":7,"t":"every + 단수명사","m":"Every 뒤에는 단수명사 gesture 사용"}]},{"n":12,"en":"Wave yours fingers while you move your arms up and down. This gesture is called ua at the Hawaiian language, and it mean \"rain.\"","ko":"팔을 위아래로 움직이면서 손가락을 흔들어 보세요. 이 동작은 하와이어로 'ua'라고 불리고, '비'를 뜻해요.","fx":[{"w":"yours","r":"your","at":1,"t":"인칭대명사의 격","m":"명사 앞 소유격 your 사용 (yours 아님)"},{"w":"at","r":"in","at":16,"t":"기본전치사","m":"'~어로'는 in the Hawaiian language"},{"w":"mean","r":"means","at":22,"t":"3인칭 단수 현재형","m":"주어 it에는 means 사용"}]},{"n":13,"en":"What about the sun? Hawaiians makes a circle with their arms above their heads.","ko":"태양은 어떨까요? 하와이 사람들은 팔을 머리 위로 올려 원을 만들어요.","fx":[{"w":"makes","r":"make","at":5,"t":"주어와 동사의 수일치","m":"주어 Hawaiians(복수)는 동사원형: make (makes 아님)"}]},{"n":14,"en":"That's ka lā, the \"sun.\" These gestures are so simple that you can easy remember them.","ko":"그것이 '태양'인 'ka lā'입니다. 이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요.","fx":[{"w":"easy","r":"easily","at":13,"t":"형용사와 부사","m":"동사 remember를 꾸밀 때는 부사 easily 사용"}]},{"n":15,"en":"Next, bend your knees a few and step from side to side. While you step to the side, move your hips natural.","ko":"다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요. 옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요.","fx":[{"w":"few","r":"little","at":5,"t":"수량 형용사","m":"'조금'은 a little 사용 (a few는 가산명사용)"},{"w":"natural","r":"naturally","at":21,"t":"형용사와 부사","m":"동사 move를 꾸밀 때는 부사 naturally 사용"}]},{"n":16,"en":"Now move your hands with your hips and foots!","ko":"이제 엉덩이와 발과 함께 손을 움직이세요!","fx":[{"w":"foots","r":"feet","at":8,"t":"불규칙 복수형","m":"foot의 복수형은 feet"}]},{"n":18,"en":"Remember that hula are not just a dance. Hula is a language and a way of storytelling, so it is importantly to Hawaiians.","ko":"훌라는 단순한 춤이 아니라는 것을 기억하세요. 훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다.","fx":[{"w":"are","r":"is","at":3,"t":"be동사 수일치","m":"단수 주어 hula에는 is 사용"},{"w":"importantly","r":"important","at":20,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 important 사용"}]},{"n":19,"en":"As an hula teacher, I always tries to continue the history and culture of Hawaii. If you want to learn more, come to my next class.","ko":"훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력합니다. 더 배우고 싶으시다면 제 다음 수업에 오세요.","fx":[{"w":"an","r":"a","at":1,"t":"관사 a/an","m":"자음 소리 hula 앞에는 a 사용"},{"w":"tries","r":"try","at":6,"t":"3인칭 단수 현재형","m":"주어 I에는 try (3인칭 아님)"}]},{"n":20,"en":"Everyone are welcome. Aloha!","ko":"모두 환영해요. 알로하!","fx":[{"w":"are","r":"is","at":1,"t":"be동사 수일치","m":"Everyone은 단수 취급, is 사용"}]}]},{"no":"40","t":"I Love Humpback Whales","q":[{"n":2,"en":"I'm work at a whale research center in the Cook Islands. I thinks humpback whales are the more amazing animals in the ocean.","ko":"저는 쿡 제도에 있는 고래 연구소에서 일하고 있어요. 저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요.","fx":[{"w":"work","r":"working","at":1,"t":"현재진행형","m":"현재진행형은 be + -ing: working (work 아님)"},{"w":"thinks","r":"think","at":12,"t":"3인칭 단수 현재형","m":"주어 I에는 think 사용"},{"w":"more","r":"most","at":17,"t":"최상급","m":"the ~ in the ocean은 최상급 most 사용"}]},{"n":4,"en":"Final, the humpback whales are back! They have traveled about 6,500 km from the Southern Ocean to give birth.","ko":"마침내, 혹등고래들이 돌아왔다! 그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다.","fx":[{"w"
