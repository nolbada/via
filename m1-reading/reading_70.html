rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"I has a shell, but I'm not a crab.","ko":"저는 껍데기가 있지만, 게는 아니에요.","ok":false,"foot":[],"fixes":[{"wrong":"has","right":"have","partial":false,"at":[1],"point":"일반동사의 현재형: 주어 I에는 have (has 아님)","topic":"일반동사의 현재형","memo":"주어 I에는 have (has 아님)"}]},{"n":2,"tag":null,"en":"I'm yellow and white, but I'm not a daisy.","ko":"저는 노랗고 하얗지만, 데이지 꽃은 아니에요.","ok":true,"foot":[],"fixes":[]},{"n":3,"tag":null,"en":"I'm more big than an olive, but I'm smaller than an avocado.","ko":"저는 올리브보다 더 크지만, 아보카도보다 더 작아요.","ok":false,"foot":[],"fixes":[{"wrong":"more big","right":"bigger","partial":false,"at":[1],"point":"비교급: big의 비교급은 bigger","topic":"비교급","memo":"big의 비교급은 bigger"}]},{"n":4,"tag":null,"en":"What am I?","ko":"저는 무엇일까요?","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"Do you know the answer? Yes, it are an egg.","ko":"여러분은 정답을 알고 있나요? 네, 그것은 달걀입니다.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[7],"point":"be동사의 현재형: 주어 it은 is (are 아님)","topic":"be동사의 현재형","memo":"주어 it은 is (are 아님)"}]},{"n":6,"tag":null,"en":"There are much different egg dishes around the world. Who is your favorite egg dish?","ko":"전 세계에는 많은 다양한 달걀 요리가 있습니다. 여러분이 가장 좋아하는 달걀 요리는 무엇인가요?","ok":false,"foot":[],"fixes":[{"wrong":"much","right":"many","partial":false,"at":[2],"point":"수량 형용사 many/much: 복수명사 dishes 앞에는 many 사용","topic":"수량 형용사 many/much","memo":"복수명사 dishes 앞에는 many 사용"},{"wrong":"Who","right":"What","partial":false,"at":[9],"point":"의문사: 사물을 묻는 의문사 What 사용","topic":"의문사","memo":"사물을 묻는 의문사 What 사용"}]},{"n":7,"tag":null,"en":"How about an omelet?","ko":"오믈렛은 어떤가요?","ok":true,"foot":[],"fixes":[]},{"n":8,"tag":null,"en":"The omelet is a popularly egg dish. You can makes it easily.","ko":"오믈렛은 인기 있는 달걀 요리입니다. 여러분은 그것을 쉽게 만들 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"popularly","right":"popular","partial":false,"at":[4],"point":"형용사와 부사: 명사 egg 앞에는 형용사 popular 사용","topic":"형용사와 부사","memo":"명사 egg 앞에는 형용사 popular 사용"},{"wro omelet?"];var PASS_KO=["전 세계의 오믈렛","저는 껍데기가 있지만, 게는 아니에요.","저는 노랗고 하얗지만, 데이지 꽃은 아니에요.","저는 올리브보다 더 크지만, 아보카도보다 더 작아요.","저는 무엇일까요?","여러분은 정답을 알고 있나요? 네, 그것은 달걀입니다. 전 세계에는 많은 다양한 달걀 요리가 있습니다. 여러분이 가장 좋아하는 달걀 요리는 무엇인가요? 오믈렛은 어떤가요?","오믈렛은 인기 있는 달걀 요리입니다. 여러분은 그것을 쉽게 만들 수 있습니다. 여러분은 달걀 몇 개를 휘저어 섞고 그것들을 기름에 부칩니다. 그게 다입니다. 여러분은 더 맛있는 오믈렛을 원하나요? 그저 치즈, 채소, 또는 고기를 더해 보세요. 그것은 더 맛있을 것입니다!","오믈렛에 관한 재미있는 이야기가 하나 있습니다. 어느 날, 나폴레옹과 그의 군대가 베시에르 마을 근처에 머물렀습니다. 나폴레옹은 마을에서 만든 오믈렛을 먹어 보았고, 그는 그것을 매우 즐겼습니다. 그는 다음 날 그의 군대를 위해 거대한 오믈렛을 요청했습니다. 오늘날, 베시에르 사람들은 매년 그들의 오믈렛 축제를 위해 거대한 오믈렛을 만듭니다.","전 세계의 사람들은 그들 자신만의 오믈렛 조리법을 가지고 있습니다. Tortilla de Patata(토르티야 데 파타타)는 스페인 오믈렛입니다. 스페인어로 patata는 '감자'를 의미합니다. 여러분은 이 오믈렛을 위해 달걀과 감자가 필요합니다. 말레이시아에서 사람들은 닭고기 볶음밥을 얇은 오믈렛으로 감쌉니다. 이 특별한 오믈렛의 이름은 Nasi Goreng Pattaya(나시 고렝 파타야)입니다. 그것은 인도네시아와 싱가포르에서도 인기가 있습니다.","여러분은 지금 배가 고프다고 느끼나요? 오믈렛을 먹어 보는 건 어떤가요?"];var DG=[{"qs":[{"n":1,"q":"대화의 내용과 일치하는 것은?","o":["손님은 소고기 카레를 주문한다.","손님은 처음에 피자를 먹고 싶다고 말한다.","점원은 치킨 카레와 소고기 카레 중 무엇을 원하는지 묻는다.","손님은 카레 대신 샐러드를 주문한다.","점원은 주문을 받기 전에 계산서를 건넨다."],"a":2,"ans":"점원은 치킨 카레와 소고기 카레 중 무엇을 원하는지 묻는다.","evs":[["Server: Do you want chicken curry or beef curry?","치킨 카레와 소고기 카레 중 어느 쪽으로 하시겠어요?"],["Customer: Chicken curry, please.","치킨 카레로 주세요."]],"ev":["Server: Do you want chicken curry or beef curry?","치킨 카레와 소고기 카레 중 어느 쪽으로 하시겠어요?"],"ow":["오답 ✕ — 손님은 'Chicken curry, please.'(치킨 카레로 주세요.)라고 했으므로 소고기 카레가 아니라 치킨 카레를 주문한다. 틀림.","오답 ✕ — 손님은 'Yes, I'd like some curry.'(네, 카레를 먹고 싶어요.)라고 했을 뿐 피자는 나오지 않아 틀림.","정답 ○ — 점원이 'Do you want chicken curry or beef curry?'(치킨 카레와 소고기 카레 중 어느 쪽으로 하시겠어요?)라고 물었으므로 일치함.","오답 ✕ — 손님이 원한 것은 'some curry'(카레)이고 샐러드는 나오지 않아 틀림.","오답 ✕ — 점원은 'may I take your order?'(주문하시겠어요?)라고 먼저 물었을 뿐 계산서를 건네는 내용은 없어서 틀림."],"memo":["정답 ③: 점원은 치킨 카레와 소고기 카레 중 무엇을 원하는지 묻는다.","근거: Do you want chicken curry or beef curry?(치킨 카레와 소고기 카레 중 어느 쪽으로 하시겠어요?)","함정: ① 손님의 선택은 beef가 아니라 chicken ✕"],"why":"점원이 치킨 카레와 소고기 카레 중 선택을 묻고 손님은 치킨 카레를 고른다."}],"dlg":[["Server","Hello, may I t
