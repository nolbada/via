: [13], "point": "형용사와 부사: be동사 뒤 보어는 형용사 soft 사용", "topic": "형용사와 부사", "memo": "be동사 뒤 보어는 형용사 soft 사용"}, {"wrong": "they", "right": "them", "partial": false, "at": [23], "point": "인칭대명사의 목적격: 동사 add 뒤에는 목적격 them 사용", "topic": "인칭대명사의 목적격", "memo": "동사 add 뒤에는 목적격 them 사용"}]}, {"n": 7, "tag": null, "en": "Q. How does you make sounds?", "ko": "질문: 어떻게 소리를 만드나요?", "ok": false, "foot": [], "fixes": [{"wrong": "does", "right": "do", "partial": false, "at": [2], "point": "do/does 의문문: 주어 you에는 조동사 do 사용", "topic": "do/does 의문문", "memo": "주어 you에는 조동사 do 사용"}]}, {"n": 8, "tag": null, "en": "I use all kinds of everyday objects in fun and creatively ways. For example, I fry bacon to create rain sounds.", "ko": "저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다. 예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요.", "ok": false, "foot": [], "fixes": [{"wrong": "creatively", "right": "creative", "partial": false, "at": [10], "point": "형용사와 부사: 명사 ways 앞에는 형용사 creative 사용", "topic": "형용사와 부사", "memo": "명사 ways 앞에는 형용사 creative 사용"}]}, {"n": 9, "tag": null, "en": "For the sounds of ice skating, I move a pair of scissor across an desk.", "ko": "얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요.", "ok": false, "foot": [], "fixes": [{"wrong": "scissor", "right": "scissors", "partial": false, "at": [11], "point": "명사의 복수형: a pair of 뒤에는 복수명사 scissors 사용", "topic": "명사의 복수형", "memo": "a pair of 뒤에는 복수명사 scissors 사용"}, {"wrong": "an", "right": "a", "partial": false, "at": [13], "point": "관사 a/an: 자음 소리 d 앞에는 a desk 사용", "topic": "관사 a/an", "memo": "자음 소리 d 앞에는 a desk 사용"}]}, {"n": 10, "tag": null, "en": "To make the sounds of an horse walking, I hit two coconut shell together.", "ko": "말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [5], "point": "관사 a/an: 자음 소리 h 앞에는 a horse 사용", "topic": "관사 a/an", "memo": "자음 소리 h 앞에는 a horse 사용"}, {"wrong": "shell", "right": "shells", "partial": false, "at": [12], "point": "명사의 복수형: two 뒤에는 복수명사 shells 사용", "topic": "명사의 복수형", "memo": "two 뒤에는 복수명사 shells 사용"}]}, {"n": 11, "tag": null, "en": "Q. How interesting!", "ko": "질문: 정말 흥미롭네요!", "ok": true, "foot": [], "fixes": []}, {"n": 12, "tag": null, "en": "What can we do to becomes a Foley artist?", "ko": "우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?", "ok": false, "foot": [], "fixes": [{"wrong": "becomes", "right": "become", "partial": false, "at": [5], "point": "to부정사: to 뒤에는 동사원형 become 사용", "topic": "to부정사", "memo": "to 뒤에는 동사원형 become 사용"}]}, {"n": 13, "tag": null, "en": "You can just start by play with sounds. You don't have to use special tool to make different sounds.", "ko": "여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요. 다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.", "ok": false, "foot": [], "fixes": [{"wrong": "play", "right": "playing", "partial": false, "at": [5], "point": "동명사: 전치사 by 뒤에는 동명사 playing 사용", "topic": "동명사", "memo": "전치사 by 뒤에는 동명사 playing 사용"}, {"wrong": "tool", "right": "tools", "partial": false, "at": [14], "point": "명사의 복수형: 관사 없이는 복수형 tools 사용", "topic": "명사의 복수형", "memo": "관사 없이는 복수형 tools 사용"}]}, {"n": 14, "tag": null, "en": "Just try with everyday objects. Hit you desk with a pen and then with a pencil.", "ko": "그냥 일상적인 물건들로 시도해 보세요. 책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요.", "ok": false, "foot": [], "fixes": [{"wrong": "you", "right": "your", "partial": false, "at": [6], "point": "인칭대명사의 소유격: 명사 desk 앞에는 소유격 your 사용", "topic": "인칭대명사의 소유격", "memo": "명사 desk 앞에는 소유격 your 사용"}]}, {"n": 15, "tag": null, "en": "The two sounds are not the same. You should pay more attention for every sound around you.", "ko": "이 두 가지 소리는 같지 않아요. 여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "for", "right": "to", "partial": false, "at": [12], "point": "기본전치사: '~에 주의하다'는 pay attention to 사용", "topic": "기본전치사", "memo": "'~에 주의하다'는 pay attention to 사용"}]}, {"n": 16, "tag": null, "en": "Then, you can find new ways of create sounds.", "ko": "그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.", "ok": false, "foot": [], "fixes" 추가해야 해요.", 0], ["Q.", "질문:", 1], ["How do you make sounds?", "어떻게 소리를 만드나요?", 0], ["I use all kinds of everyday objects in fun and creative ways.", "저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다.", 1], ["For example, I fry bacon to create rain sounds.", "예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요.", 0], ["For the sounds of ice skating, I move a pair of scissors across a desk.", "얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요.", 0], ["To make the sounds of a horse walking, I hit two coconut shells together.", "말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.", 0], ["Q.", "질문:", 1], ["How interesting!", "정말 흥미롭네요!", 0], ["What can we do to become a Foley artist?", "우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?", 0], ["You can just start by playing with sounds.", "여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요.", 1], ["You don't have to use special tools to make different sounds.", "다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.", 0], ["Just try with everyday objects.", "그냥 일상적인 물건들로 시도해 보세요.", 0], ["Hit your desk with a pen and then with a pencil.", "책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요.", 0], ["The two sounds are not the same.", "이 두 가지 소리는 같지 않아요.", 0], ["You should pay more attention to every sound around you.", "여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다.", 0], ["Then, you can find new ways of creating sounds.", "그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.", 0], ["Q.", "질문:", 1], ["It sounds like an interesting job.", "흥미로운 직업 같아요.", 0], ["Thank you for the interview, Ms. Han.", "인터뷰해 주셔서 감사합니다, Han 선생님.", 0], ["Thank you for having me.", "저를 인터뷰해 주셔서 감사합니다.", 1]];var RNUM=77;var TITLE_EN="Behind Movie Sounds";var PASS_EN=["Behind Movie Sounds", "Interview with Emma Han", "When you watch a movie, what do you pay attention to? The story, the actors, or the music? What about the sounds? Last week, I had a short interview with Emma Han, a famous Foley artist.", "Q. Hello, Ms. Han. Can you tell me about your job?", "Sure! Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes. Let's say there's a rainy scene. The actual sounds of rain are too soft, so we have to make rain sounds and add them to the scene.", "Q. How do you make sounds?", "I use all kinds of everyday objects in fun and creative ways. For example, I fry bacon to create rain sounds. For the sounds of ice skating, I move a pair of scissors across a desk. To make the sounds of a horse walking, I hit two coconut shells together.", "Q. How interesting! What can we do to become a Foley artist?", "You can just start by playing with sounds. You don't have to use special tools to make different sounds. Just try with everyday objects. Hit your desk with a pen and then with a pencil. The two sounds are not the same. You should pay more attention to every sound around you. Then, you can find new ways of creating sounds.", "Q. It sounds like an interesting job. Thank you for the interview, Ms. Han.", "Thank you for having me."];var PASS_KO=["영화 음향의 뒤에서", "Emma Han과의 인터뷰", "당신은 영화를 볼 때 무엇에 주목하나요? 줄거리, 배우, 아니면 음악? 소리는 어떤가요? 지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다.", "질문: 안녕하세요, Han 선생님. 당신의 직업에 관해 말해 주시겠어요?", "그러죠! 폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요. 비 오는 장면이 있다고 가정해 봅시다. 실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요.", "질문: 어떻게 소리를 만드나요?", "저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다. 예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요. 얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요. 말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.", "질문: 정말 흥미롭네요! 우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?", "여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요. 다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요. 그냥 일상적인 물건들로 시도해 보세요. 책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요. 이 두 가지 소리는 같지 않아요. 여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다. 그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.", "질문: 흥미로운 직업 같아요. 인터뷰해 주셔서 감사합니다, Han 선생님.", "저를 인터뷰해 주셔서 감사합니다."];

무 부드러워서 빗소리를 만들어 추가해요.)라고 했으므로 실제 빗소리의 볼륨을 키운다는 말은 없어서 틀림.", "정답 ○ — 'To make the sounds of a horse walking, I hit two coconut shells together.'(말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.)라고 했으므로 Han 씨가 코코넛 껍질로 소리를 낸다는 보기가 맞음.", "오답 ✕ — 'You can just start by playing with sounds.'(그저 소리를 가지고 노는 것으로 시작할 수 있어요.)라고 했는데, 이 보기는 특이한 소리를 먼저 공부하라고 해서 틀림."], "memo": ["정답 ④: Han 씨는 코코넛 껍질로 소리를 만든다(말이 걷는 소리).", "근거: I hit two coconut shells together.(코코넛 껍질 두 개를 맞부딪치죠.)", "함정: ⑤ 공부가 아니라 소리를 가지고 놀며 시작하라고 했어서 ✕"], "why": "말이 걷는 소리를 코코넛 껍질 두 개를 맞부딪쳐서 만든다.", "ko": ["나는 유명한 미술 감독인 한 씨를 인터뷰했다.", "실제 소리가 영화에 가장 좋은 소리이다.", "한 씨는 비 오는 장면에서 실제 빗소리의 볼륨을 키운다.", "한 씨는 소리를 만들 때 코코넛 껍데기를 사용한다.", "폴리 아티스트가 되려면 먼저 특이한 소리를 공부해야 한다."]}, {"n": 10, "q": "Ms. Han이 폴리 아티스트가 되고 싶은 사람에게 한 조언으로 알맞은 것은?", "o": ["You must buy special tools.", "You can start by playing with sounds using everyday objects.", "You should only focus on watching many movies.", "You should not pay attention to the sounds around you.", "A pen and a pencil make the same sound, so you need only one."], "a": 1, "ans": "You can start by playing with sounds using everyday objects.", "ko": ["특별한 도구를 반드시 사야 한다.", "일상적인 물건으로 소리를 내며 놀아 보는 것으로 시작하면 된다.", "영화를 많이 보는 것에만 집중해야 한다.", "주변의 소리는 신경 쓰지 말아야 한다.", "펜과 연필은 같은 소리가 나니 하나만 쓰면 된다."], "ow": ["오답 ✕ — 'You don't have to use special tools to make different sounds.'(다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.)라고 했으므로 반드시 사야 한다는 보기는 반대로 말해서 틀림.", "정답 ○ — 'You can just start by playing with sounds.'(그저 소리를 가지고 노는 것으로 시작할 수 있어요.)와 'Just try with everyday objects.'(그냥 일상적인 물건들로 시도해 보세요.)라고 했으므로 맞다.", "오답 ✕ — 영화를 많이 보라는 말은 글에 없다. 조언은 소리를 가지고 놀아 보라는 것이라서 틀림.", "오답 ✕ — 'You should pay more attention to every sound around you.'(주변의 모든 소리에 더 많이 귀를 기울여야 해요.)라고 했으므로 신경 쓰지 말라는 보기는 반대로 말해서 틀림.", "오답 ✕ — 'Hit your desk with a pen and then with a pencil. The two sounds are not the same.'(책상을 펜으로 치고, 그다음에 연필로 쳐 보세요. 두 소리는 같지 않아요.)라고 했으므로 같은 소리가 난다는 보기는 틀림."], "memo": ["정답 ②: You can start by playing with sounds using everyday objects.(일상적인 물건으로 소리를 내며 놀아 보는 것으로 시작하면 된다.)", "근거: You can just start by playing with sounds.(그저 소리를 가지고 노는 것으로 시작할 수 있어요.)", "함정: ⑤ A pen and a pencil make the same sound(펜과 연필은 같은 소리가 난다) ✕ 본문은 The two sounds are not the same.(두 소리는 같지 않다.)이다."], "evs": [["You can just start by playing with sounds.", "여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요."], ["You don't have to use special tools to make different sounds.", "다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요."]], "ev": ["You can just start by playing with sounds.", "여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요."], "why": "특별한 도구 없이 일상 물건으로 소리를 가지고 놀며 시작하라는 조언이다."}], "pp": [["Interview with Emma Han", "Emma Han과의 인터뷰"], ["When you watch a movie, what do you pay attention to?", "당신은 영화를 볼 때 무엇에 주목하나요?"], ["The story, the actors, or the music?", "줄거리, 배우, 아니면 음악?"], ["What about the sounds?", "소리는 어떤가요?"], ["Last week, I had a short interview with Emma Han, a famous Foley artist.", "지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다."], ["Q.", "질문:"], ["Hello, Ms. Han.", "안녕하세요, Han 선생님."], ["Can you tell me about your job?", "당신의 직업에 관해 말해 주시겠어요?"], ["Sure!", "그러죠!"], ["Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes.", "폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요."], ["Let's say there's a rainy scene.", "비 오는 장면이 있다고 가정해 봅시다."], ["The actual sounds of rain are too soft, so we have to make rain sounds and add them to the scene.", "실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요."], ["Q.", "질문:"], ["How do you make sounds?", "어떻게 소리를 만드나요?"], ["I use all kinds of everyday objects in fun and creative ways.", "저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다."], ["For example, I fry bacon to create rain sounds.", "예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요."], ["For the sounds of ice skating, I move a pair of scissors across a desk.", "얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요."], ["To make the sounds of a horse walking, I hit two coconut shells together.", "말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠."], ["Q.", "질문:"], ["How interesting!", "정말 흥미롭네요!"], ["What can we do to become a Foley artist?", "우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?"], ["You can just start by playing with sounds.", "여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요."], ["You don't have to use special tools to make different sounds.", "다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요."], ["Just try with everyday objects.", "그냥 일상적인 물건들로 시도해 보세요."], ["Hit your desk with a pen and then with a pencil.", "책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요."], ["The two sounds are not the same.", "이 두 가지 소리는 같지 않아요."], ["You should pay more attention to every sound around you.", "여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다."], ["Then, you can find new ways of creating sounds.", "그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요."], ["Q.", "질문:"], ["It sounds like an interesting job.", "흥미로운 직업 같아요."], ["Thank you for the interview, Ms. Han.", "인터뷰해 주셔서 감사합니다, Han 선생님."], ["Thank you for having me.", "저를 인터뷰해 주셔서 감사합니다."]]}];

function neg(s){return esc(s).replace(/(일치하지 않는|알 수 없는|않은|않는|틀린|잘못된|어색한|다른)/g,'<span class="neg">$1</span>')}
function reasonHtml(t){t=t.replace(/^(오답|정답)\s*[○✕]\s*—\s*/,'').replace(/\s*✕/g,'');return esc(t).replace(/'(.+?)'(?=\()/g,'<mark lang="en">$1</mark>')}
function qById(n){for(var i=0;i<QL.length;i++)if(QL[i].n===n)return QL[i]}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name||(secs.length>1?'도입':''))+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  if(done[si])h+=resultTop(S,si);
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=stepQHtml();
 document.getElementById('app').innerHTML=h;relayUp();persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function aDone(){return secs.every(function(S,si){return done[si]})}
function allAdv(){return QL.every(function(q){return qst[q.n]&&qst[q.n].adv})}
function relayUp(){var st=[aDone(),allAdv()],nm=['본문 오류 찾기','본문 '+QL.length+'문제'],f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 if(lock&&!it.ok){h='<div class="sent locked fixd" id="s'+i+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt" lang="en">'+diffHtml(it)+'</div></div><div class="gl kr">'+esc(it.ko)+'</div>';if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');return h+noteHtml(i)+'</div>'}
 h+='<div class="sent'+(lock?' locked':'')+'" id="s'+i+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt" lang="en">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongWords(i){var it=D[i],sp=span(it),toks=it.en.split(/\s+/),r=[];for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))r.push(t)}r.sort(function(a,b){return a-b});return r.map(function(t){return toks[t].replace(/^[^\w]+|[^\w]+$/g,'')})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function fixedHtml(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0001'+f.right+'\u0002');return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0001'+f.right+'\u0002'+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return esc(tk.join(' ').replace(/ ?\u0000/g,'')).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>')}
function diffHtml(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   var R=f.right?'\u0001'+f.right+'\u0002':'';
   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0003'+f.wrong+'\u0004'+R);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0003'+f.wrong+'\u0004'+(R?' '+R:'')+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return esc(tk.join(' ').replace(/ ?\u0000/g,'')).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>').replace(/\u0003/g,'<del>').replace(/\u0004/g,'</del>')}
function noteHtml(i){
 var it=D[i],wp=wrongPicks(i);
 if(it.ok){return '<div class="ac s1"><div class="ac-top fine"><b>맞는 문장</b><span class="ac-a">어법 오류 없음</span>'+(wp?'<span class="ac-x">틀리게 고른 곳 : <span lang="en">'+esc(wrongWords(i).join(', '))+'</span></span>':'')+'</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 var h='<div class="ac s1"><div class="ac-top'+(all?' g':'')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+'</b>'+(wp?'<span class="ac-x">틀리게 고른 곳 : <span lang="en">'+esc(wrongWords(i).join(', '))+'</span></span>':'')+'</div>';
 it.fixes.forEach(function(f,k){var ok=foundFix(i,k);
  h+='<div class="fc '+(ok?'f':'m')+'"><div><span class="tg2">'+(ok?'찾음':'놓침')+'</span>'+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr" lang="en">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt" lang="en">'+esc(f.right)+'</span></div><div class="fcb">'+pointHtml(f)+(f.gl?f.gl.map(function(g){return '<div class="fgl">'+esc(g)+'</div>'}).join(''):'')+'</div></div>'});
 return h+'<div style="height:12px"></div></div>';
}
function critHtml(f){var w=f.wrong.split(/\s+/),r=f.right.split(/\s+/);
 if(f.alt&&f.alt.length)return '<div class="crit">빠진 말 문제 : 빠진 자리 양옆 어느 단어를 눌러도 정답으로 인정</div>';
 if(w.length==2&&r.length==2&&w.slice().sort().join()==r.slice().sort().join()&&w.join()!=r.join())return '<div class="crit">어순 문제 : 옮겨진 말과 짝이 되는 단어, 어느 쪽을 눌러도 정답으로 인정</div>';return ''}
function pointHtml(f){var p=f.point,ix=p.indexOf(':');return (ix>0&&ix<24?'<b>'+esc(p.slice(0,ix))+'</b> : '+esc(p.slice(ix+1).trim()):'<b>'+esc(f.topic)+'</b> : '+esc(p))+critHtml(f)}
function resultTop(S,si){
 var tot=0,fo=0,ch='';
 S.items.forEach(function(i){var it=D[i],f=0,w=wrongPicks(i);it.fixes.forEach(function(x,k){tot++;if(foundFix(i,k)){fo++;f++}});
  var miss=it.fixes.length-f;
  if(miss||w)ch+='<button type="button" class="rchip'+(miss?' m':'')+'" data-jump="s'+i+'">'+String(it.n).padStart(2,'0')+'번 '+(miss?'놓침':'')+(miss&&w?' · ':'')+(w?'틀리게 고름':'')+'</button>'});
 return '<div class="rsum"><b>결과</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(ch?'<div class="rchips">'+ch+'</div>':'')+'</div>';
}
function rightCard(q){
 var h='<div class="ac"><div class="ac-top g"><b>정답</b><span class="ac-a">'+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<div class="ac-k">'+esc(q.ko[q.a])+'</div>':'')+'</div>';
 h+='<div class="ac-sec">본문 근거</div><div class="pass">';
 q.evs.forEach(function(e){h+='<div class="pl1"><div class="e" lang="en"><mark>'+esc(e[0])+'</mark></div><div class="k">'+esc(e[1])+'</div></div>'});
 h+='</div><div class="ac-sec">왜 정답일까</div><div class="oc g"><div class="why">'+reasonHtml(q.ow[q.a])+'</div></div>';
 h+='<div class="nx"><button type="button" data-next="'+q.n+'">다음 문제</button></div></div>';
 return h;
}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 return '<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
}
function load(){try{var v=localStorage.getItem(BK);return v==null?null:+v}catch(e){return null}}
function save(n){try{var b=load();if(b==null||n>b)localStorage.setItem(BK,n)}catch(e){}}
function ppHtml(pp){
 return '<div class="dlg"><div class="who">'+en(TITLE_EN)+' &middot; '+en(pp[0][0])+'</div><div class="ln"><div class="en" lang="en">'+esc(pp.slice(1).map(function(p){return p[0]}).join(' '))+'</div></div></div>';
}
function qVisible(i){if(!aDone())return false;for(var j=0;j<i;j++){var s=qst[QL[j].n];if(!(s&&s.adv))return false}return true}
function stepQHtml(){
 if(!aDone())return '';
 if(!qgo)return '<div class="gobar"><button type="button" data-go="1">문제 풀러 가기</button></div>';
 var h='<div class="stage">2 · 본문 '+QL.length+'문제</div>',lastG=null;
 for(var i=0;i<QL.length;i++){
  if(!qVisible(i))break;
  var q=QL[i];
  if(q.g!==lastG){if(q.g.pp)h+=ppHtml(q.g.pp);lastG=q.g}
  h+=qCard(i);
 }
 if(allAdv())h+=resultHtml();
 return h;
}
function optText(q,j){return q.ko?en(q.o[j]):esc(q.o[j])}
function doneRow(q){return '<div class="qd" id="q'+q.n+'"><span class="qn">'+q.dn+'</span><span>정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<span class="qk">'+esc(q.ko[q.a])+'</span>':'')+'</div>'}
function postHtml(q,st){var n=q.note;
 return '<div class="post"><div class="ph">노트에 쓰기 &middot; 요약문 완성</div><div class="pl" lang="en">'+esc(n.en)+'</div><div class="pk">'+esc(n.ko)+'</div><div class="pw">'+n.words.map(function(w){return '<span lang="en">'+esc(w[0])+'</span> = '+esc(w[1])}).join(' &nbsp;&middot;&nbsp; ')+'</div>'+(st.wrote?'<div class="pd">작성 완료</div>':'<button type="button" data-wrote="'+q.n+'">노트에 썼어요</button>')+'</div>';
}
function qCard(i){
 var q=QL[i],st=qst[q.n]||(qst[q.n]={w:[],ok:0,adv:0,t0:Date.now(),t1:0,wrote:0});
 if(st.adv&&!q.note&&!st.w.length)return doneRow(q);
 var h='<div class="q" id="q'+q.n+'"><div class="qt"><span class="lbl">'+LABEL+'</span><span class="qn">'+q.dn+'</span>'+neg(q.q)+'</div>';
 if(q.sum)h+='<div class="sumbox" lang="en">'+esc(q.sum)+'</div>';
 if(!st.w.length){
  q.o.forEach(function(t,j){
   h+='<div class="opt'+(st.ok&&j===q.a?' good':'')+'"'+(st.ok?'':' data-q="'+q.n+'" data-o="'+j+'"')+'><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>';
  });
  if(st.ok&&q.note)h+=postHtml(q,st);
  h+='</div>';
  if(st.ok&&!q.note&&!st.adv)h+=rightCard(q);
  return h;
 }
 return h+'</div>'+wrongCard(q,st);
}
function wrongCard(q,st){
 var h='<div class="ac"><div class="ac-top"><b>오답</b><span class="ac-a">정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<div class="ac-k">'+esc(q.ko[q.a])+'</div>':'')+'</div>';
 var isEv=function(t){return q.evs.some(function(e){return t===e[0]||(t.length>8&&t.indexOf(e[0])>=0)})};
 if(q.g.pp){
  h+='<div class="ac-sec">본문</div><div class="pass">';
  q.g.pp.forEach(function(p,ix){if(ix===0)return;h+='<div class="pl1"><div class="e" lang="en">'+(isEv(p[0])?'<mark>'+esc(p[0])+'</mark>':esc(p[0]))+'</div><div class="k">'+esc(p[1])+'</div></div>'});
  h+='</div>';
 } else {
  h+='<div class="ac-sec">본문 근거</div><div class="pass">';
  q.evs.forEach(function(e){h+='<div class="pl1"><div class="e" lang="en"><mark>'+esc(e[0])+'</mark></div><div class="k">'+esc(e[1])+'</div></div>'});
  h+='</div>';
 }
 h+='<div class="ac-sec">보기 풀이</div>';
 q.o.forEach(function(t,j){var isA=j===q.a,isW=st.w.indexOf(j)>=0;
  h+='<div class="oc'+(isA?' g':isW?' r':'')+'"><div class="oh"><span class="cn">'+CN[j]+'</span><div class="ot">'+(q.ko?en(t):esc(t))+(q.ko?'<div class="okr">'+esc(q.ko[j])+'</div>':'')+'</div>'+(isA?'<span class="tg">정답</span>':isW?'<span class="tg">내가 고름</span>':'')+'</div><div class="why">'+reasonHtml(q.ow[j])+'</div></div>';
 });
 var tr=(q.memo||[]).filter(function(l){return /^함정/.test(l)})[0];
 if(tr)h+='<div class="trap"><b>함정</b> '+esc(tr.replace(/^함정\s*:\s*/,'').replace(/\s*✕/g,''))+'</div>';
 if(!st.ok){
  h+='<div class="fix"><div class="fh">고쳐 보기</div>';
  q.o.forEach(function(t,j){var xx=st.w.indexOf(j)>=0;h+='<div class="opt'+(xx?' xx':'')+'" data-q="'+q.n+'" data-o="'+j+'"><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>'});
  h+='</div>';
 } else {
  h+='<div class="fixed">정답 '+CN[q.a]+'</div>';
  if(q.note)h+=postHtml(q,st);
  else if(!st.adv)h+='<div class="nx"><button type="button" data-next="'+q.n+'">다음 문제</button></div>';
 }
 return h+'</div>';
}
function fcount(){return QL.filter(function(q){var s=qst[q.n];return s&&s.ok&&!s.w.length}).length}
function fastInfo(){
 var s1=[];secs.forEach(function(S,si){if(s1t[si]!=null&&s1t[si]<1500*S.items.length)s1.push(S.name||('구간 '+(si+1)))});
 var q2=[];QL.forEach(function(q){var s=qst[q.n];if(s&&s.t1&&s.t1-s.t0<2500)q2.push(q.dn)});
 return{s1:s1,q2:q2};
}
function resultHtml(){
 var f=fcount(),fx=QL.reduce(function(a,q){return a+qst[q.n].w.length},0),fi=fastInfo();
 var h='<div class="stage">완료</div><div class="res"><div class="rl">처음에 맞힌 문제</div><div class="rpct">'+f+'<small> / '+QL.length+'</small></div>';
 h+='<table class="rtb">'+QL.map(function(q){var s=qst[q.n];return '<tr><td>'+q.dn+'번</td><td>'+(s.w.length?'틀림':'처음에 맞힘')+'</td></tr>'}).join('')+'</table>';

 if(TEACH){

 }
 h+='<div style="margin-top:14px"><a href="./" style="display:inline-block;background:var(--pri);color:#fff;text-decoration:none;font-weight:700;padding:9px 20px;border-radius:8px">M1 Reading 목록으로</a></div>';

function lognote(q){var n=q.note;wlog('s','2단계 · 요약문 완성',[{n:q.dn,a:'정답 '+CN[q.a]+' '+q.ans,m:[n.en,n.ko].concat(n.words.map(function(w){return w[0]+' = '+w[1]}))}])}
function pickOpt(n,j){var q=qById(n),st=qst[n];if(!st||st.ok)return;if(!st.t1)st.t1=Date.now();
 if(j===q.a){st.ok=1;if(q.note)lognote(q);}
 else if(st.w.indexOf(j)<0){st.w.push(j);st.ok=1;if(q.note)lognote(q)}
 var y=window.scrollY;render();window.scrollTo(0,y);
}
function advQ(n){var st=qst[n];if(!st||st.adv)return;st.adv=1;if(allAdv()){tmFlush();TM.done=1}
 render();var ix=QL.indexOf(qById(n)),nx=ix<QL.length-1?QL[ix+1]:null,el=nx?document.getElementById('q'+nx.n):document.querySelector('.res');
 if(el){var ty=el.getBoundingClientRect().top+window.pageYOffset-8;window.scrollTo(0,ty);setTimeout(function(){window.scrollTo(0,el.getBoundingClientRect().top+window.pageYOffset-8)},60)}
}
document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){var sb=+b.dataset.sub;s1t[sb]=Date.now()-mark;mark=Date.now();done[sb]=true;render();
  var fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
