ridge that is completely surrounded by water.)","ko":"스코틀랜드에는 완전히 물로 둘러싸인 외로운 다리가 있다. (surround는 둘러싸다)","opts":["연결된","가라앉은","둘러싸인","가려진"],"word":"surrounded","r":{"a":"3) 둘러싸인","ev":"1번 문장","s":[[1,"In Scotland, there’s a lonely bridge that is completely surrounded by water.","스코틀랜드에는, 완전히 물로 둘러싸인 외로운 다리가 있다."]],"w":"1번 문장은 다리 주변이 온통 물이라는 말이에요. be surrounded by = ~로 둘러싸이다. ‘가라앉은’은 다리가 물에 잠긴다는 뜻이라 맞지 않아요.","c":3},"h":"59de0ba502"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (At high tide, water from the nearby sea covers the land around the bridge.)","ko":"밀물 때, 근처 바다의 물이 그 다리 주변의 땅을 덮는다.","opts":["먼","근처의","깊은","차가운"],"word":"nearby","r":{"a":"2) 근처의","ev":"6번 문장","s":[[6,"At high tide, water from the nearby sea covers the land around the bridge.","밀물 때, 근처 바다의 물이 그 다리 주변의 땅을 덮는다."]],"w":"밀물 때 바닷물이 다리 주변 땅까지 올라와 덮으니, 바다가 다리 가까이에 있다는 뜻이에요. nearby = 근처의.","c":2},"h":"53ec1e8369"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is often called the “Bridge to Nowhere.”","ko":"밑줄 친 It이 가리키는 것은?","opts":["스코틀랜드","근처 바다","사진작가","Belhaven 다리"],"sko":"그것은 종종 ‘어디로도 이어지지 않는 다리’라고 불린다.","r":{"a":"4) Belhaven 다리","ev":"2~3번 문장","s":[[2,"It is the Belhaven Bridge.","그것은 Belhaven 다리이다."],[3,"It is often called the “Bridge to Nowhere.”","그것은 종종 ‘어디로도 이어지지 않는 다리’라고 불린다."]],"w":"2번 문장에서 It is the Belhaven Bridge.라고 한 다리를 3번에서 다시 It으로 받았어요. 별명이 붙은 것은 Belhaven 다리예요.","c":4},"h":"d6bd8ab6e1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You just have to wait for the right time!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["당신은 그저 알맞은 때를 기다려야 한다.","당신은 알맞은 때가 되기 전에 서둘러 떠나야 한다.","당신은 때를 기다리지 말고 다리를 건너야 한다.","당신은 알맞은 때를 기다릴 필요가 전혀 없다."],"sko":"당신은 그저 적절한 때를 기다려야만 한다!","r":{"a":"1) 당신은 그저 알맞은 때를 기다려야 한다.","ev":"5번 문장","s":[[5,"You just have to wait for the right time!","당신은 그저 적절한 때를 기다려야만 한다!"]],"w":"have to wait for = 기다려야 한다, the right time = 알맞은 때. 바로 앞 4번에서 다리가 어딘가로 이어지는데, 그러려면 알맞은 때(썰물 때)를 기다려야 한다는 말이에요.","c":1},"h":"bf373c8254"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The bridge is in England.","The bridge always has water all around it.","At low tide, people can use the bridge to get to a beach.","People can use the bridge only at high tide."],"oko":["그 다리는 잉글랜드에 있다.","그 다리는 항상 주변이 온통 물이다.","썰물 때 사람들은 해변에 가기 위해 그 다리를 이용할 수 있다.","사람들은 밀물 때만 그 다리를 이용할 수 있다."],"r":{"a":"3) At low tide, people can use the bridge to get to a beach.","ev":"8번 문장","s":[[8,"However, at low tide, people can use the bridge to cross a stream and get to a beach.","하지만, 썰물 때, 사람들은 개울을 건너고 해변에 가기 위해 그 다리를 이용할 수 있다."]],"w":"8번에서 썰물 때 사람들이 해변에 가기 위해 다리를 이용한다고 해요. 다리는 스코틀랜드에 있고(1번), 밀물 때만 물이 땅을 덮으며(6번), 이용하는 때는 썰물 때예요.","c":3},"h":"19328672ff"},{"n":9,"t":"sum","q":"At high tide, water (A) the land around the Belhaven Bridge, but at low tide people can (B) the bridge to get to a beach.","ko":"밀물 때 물은 Belhaven 다리 주변의 땅을 (A), 썰물 때 사람들은 해변에 가기 위해 그 다리를 (B) 수 있다.","opts":["(A) covers / (B) avoid","(A) leaves / (B) use","(A) lifts / (B) build","(A) dries / (B) destroy","(A) covers / (B) use"],"oko":["(A) 덮는다 / (B) 피한다","(A) 떠난다 / (B) 이용한다","(A) 들어 올린다 / (B) 짓는다","(A) 말린다 / (B) 부순다","(A) 덮는다 / (B) 이용한다"],"r":{"a":"5) (A) covers / (B) use","ev":"6번, 8번 문장","s":[[6,"At high tide, water from the nearby sea covers the land around the bridge.","밀물 때, 근처 바다의 물이 그 다리 주변의 땅을 덮는다."],[8,"However, at low tide, people can use the bridge to cross a stream and get to a beach.","하지만, 썰물 때, 사람들은 개울을 건너고 해변에 가기 위해 그 다리를 이용할 수 있다."]],"w":"6번에서 밀물 때 물이 땅을 덮고(covers), 8번에서 썰물 때 사람들이 다리를 이용해요(use). 그래서 (A) covers, (B) use예요.","c":5},"h":"b7fdde4353"},{"n":10,"t":"fill","q":"The Belhaven Bridge looks [A] from the rest of the world at high tide, and it is a [B] spot for photographers.","ko":"밀물 때 Belhaven 다리는 나머지 세상에서 [A] 것처럼 보이고, 사진작가들에게 [B] 장소이다.","bank":["separated","popular","completely","often","cross","wait"],"bko":{"separated":"따로 떨어진","popular":"인기 있는","completely":"완전히","often":"종종","cross":"건너다","wait":"기다리다"},"r":{"a":"[A] separated, [B] popular","ev":"7번, 9번 문장","s":[[7,"The bridge looks like it’s separated from the rest of the world.","그 다리는 나머지 세상에서 따로 떨어져 있는 것처럼 보인다."],[9,"The bridge is a popular spot for photographers.","그 다리는 사진작가들에게 인기 있는 장소이다."]],"w":"7번에서 다리가 나머지 세상에서 separated(따로 떨어진) 것처럼 보인다고 하고, 9번에서 사진작가들에게 popular(인기 있는) 장소라고 해요.","c":null},"h":"a891f707d1"}]},{"u":5,"id":"hs2-05-2","no":2,"ko":"어머니는 위대하다","items":[{"n":1,"t":"tf","q":"After laying eggs, the mother frog swallowed them.","ko":"알을 낳은 후, 어미 개구리는 그것들을 삼켰다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"After laying eggs, the mother frog would swallow them.","알을 낳은 후, 어미 개구리는 그것들을 삼키곤 했다."]],"w":"4번 문장에서 알을 낳은 후 어미 개구리가 그것들(알)을 삼키곤 했다(would swallow them)고 해요. 그래서 맞는 내용이에요.","c":"T"},"h":"bebf5f51db"},{"n":2,"t":"tf","q":"The tadpoles stayed in the mother’s stomach for two weeks.","ko":"올챙이들은 어미의 배 속에 2주 동안 머물렀다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"She kept the tadpoles in her stomach for six more weeks.","그녀는 올챙이들을 그녀의 배 속에 6주 동안 더 품었다."]],"w":"5번 문장에서 올챙이들을 배 속에 six more weeks(6주 더) 품었다고 해요. 2주가 아니에요.","c":"F"},"h":"5dd4b6b87f"},{"n":3,"t":"tf","q":"Kangaroos are famous for keeping their young in their stomachs.","ko":"캥거루는 새끼를 배 속에 품는 것으로 유명하다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Kangaroos are famous for keeping their young in their pouches.","캥거루는 그것들의 새끼를 새끼주머니에 품는 것으로 유명하다."]],"w":"1번 문장에서 캥거루가 새끼를 품는 곳은 stomachs(배 속)가 아니라 pouches(새끼주머니)예요. 배 속에 품은 것은 위부화개구리예요(2번).","c":"F"},"h":"5d5a74d0f5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (After laying eggs, the mother frog would swallow them.)","ko":"알을 낳은 후, 어미 개구리는 그것들을 삼키곤 했다.","opts":["토하다","숨기다","삼키다","던지다"],"word":"swallow","r":{"a":"3) 삼키다","ev":"4번 문장","s":[[4,"After laying eggs, the mother frog would swallow them.","알을 낳은 후, 어미 개구리는 그것들을 삼키곤 했다."]],"w":"어미가 알을 낳은 뒤 그 알을 배 속으로 넣었다는 흐름이에요(5번에서 배 속에 품음). swallow = 삼키다. 7번의 vomit(토하다)과 반대 동작이에요.","c":3},"h":"949b877266"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The tadpoles stayed safe there as they developed.)","ko":"올챙이들은 그곳에서 성장하면서 안전한 상태를 유지했다.","opts":["성장했다","사라졌다","잠들었다","도망쳤다"],"word":"developed","r":{"a":"1) 성장했다","ev":"6번 문장","s":[[6,"The tadpoles stayed safe there as they developed.","올챙이들은 그곳에서 성장하면서 안전한 상태를 유지했다."]],"w":"올챙이들이 배 속에 있다가 7번에서 새끼 개구리로 나와요. 그래서 developed는 ‘성장했다’예요(develop = 성장하다).","c":1},"h":"05e2413abd"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAfter laying eggs, the mother frog would swallow them.","ko":"밑줄 친 them이 가리키는 것은?","opts":["캥거루의 새끼주머니","어미 개구리의 알","캥거루의 새끼들","6주의 시간"],"sko":"알을 낳은 후, 어미 개구리는 그것들을 삼키곤 했다.","r":{"a":"2) 어미 개구리의 알","ev":"4번 문장","s":[[4,"After laying eggs, the mother frog would swallow them.","알을 낳은 후, 어미 개구리는 그것들을 삼키곤 했다."]],"w":"문장 앞부분의 After laying eggs(알을 낳은 후)에서 eggs가 나와요. 어미가 알을 낳고 그 알을 삼켰다는 뜻이라 them = 알이에요.","c":2},"h":"b05e017467"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Similarly, there was once an animal that kept its children in its stomach!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["비슷하게, 새끼들을 배 속에서 먹이로 삼은 동물이 지금도 많이 있다.","비슷하게, 그 동물은 새끼들을 새끼주머니에 품었다.","비슷하게, 새끼들이 어미의 배 속에서 먹이를 찾았다.","비슷하게, 한때 새끼들을 배 속에 품은 동물이 있었다."],"sko":"비슷하게, 새끼들을 배 속에 품었던 동물이 한때 있었다!","r":{"a":"4) 비슷하게, 한때 새끼들을 배 속에 품은 동물이 있었다.","ev":"2번 문장","s":[[2,"Similarly, there was once an animal that kept its children in its stomach!","비슷하게, 새끼들을 배 속에 품었던 동물이 한때 있었다!"]],"w":"there was once an animal = 한때 ~한 동물이 있었다, that kept its children in its stomach = 새끼들을 배 속에 품은. 지금도 있다는 말이 아니라 과거에 있었다는 말이에요. 새끼주머니는 1번 캥거루 이야기예요.","c":4},"h":"eedccc4107"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The mother frog ate a lot while she kept the tadpoles.","The gastric-brooding frog still lives in many places today.","The tadpoles were safe in the mother’s stomach as they grew.","The tadpoles stayed in the stomach for only one day."],"oko":["어미 개구리는 올챙이들을 품는 동안 많이 먹었다.","위부화개구리는 오늘날에도 많은 곳에 산다.","올챙이들은 자라는 동안 어미의 배 속에서 안전했다.","올챙이들은 배 속에 하루만 머물렀다."],"r":{"a":"3) The tadpoles were safe in the mother’s stomach as they grew.","ev":"6번 문장","s":[[6,"The tadpoles stayed safe there as they developed.","올챙이들은 그곳에서 성장하면서 안전한 상태를 유지했다."]],"w":"6번에서 올챙이들은 성장하면서 배 속에서 안전했어요. 어미는 그 기간에 아무것도 먹지 않았고(9번), 위부화개구리는 지금 멸종됐고(3번), 올챙이들은 6주 동안 머물렀어요(5번).","c":3},"h":"024b8908bd"},{"n":9,"t":"sum","q":"The mother gastric-brooding frog kept the tadpoles in her (A) for six weeks. She did not (B) during that time, so the tadpoles were protected.","ko":"어미 위부화개구리는 올챙이들을 6주 동안 (A)에 품었다. 어미는 그동안 (B)하지 않아서 올챙이들이 보호받았다.","opts":["(A) pouch / (B) eat","(A) stomach / (B) sleep","(A) mouth / (B) swim","(A) eggs / (B) eat","(A) stomach / (B) eat"],"oko":["(A) 새끼주머니 / (B) 먹다","(A) 배 속 / (B) 잠자다","(A) 입 / (B) 헤엄치다","(A) 알 / (B) 먹다","(A) 배 속 / (B) 먹다"],"r":{"a":"5) (A) stomach / (B) eat","ev":"5번, 9번, 10번 문장","s":[[5,"She kept the tadpoles in her stomach for six more weeks.","그녀는 올챙이들을 그녀의 배 속에 6주 동안 더 품었다."],[9,"The mother didn’t eat anything during those six weeks!","그 6주 동안 어미가 아무것도 먹지 않았다!"],[10,"This protected the tadpoles from the digestion process.","이것은 올챙이들을 소화 과정으로부터 보호했다."]],"w":"5번에서 올챙이들을 배 속(stomach)에 품었고, 9번에서 어미가 6주 동안 아무것도 먹지(eat) 않았어요. 10번에서 그 덕에 올챙이들이 소화 과정으로부터 보호받았어요.","c":5},"h":"21a85734f2"},{"n":10,"t":"fill","q":"The gastric-brooding frog is now [A], and the female frogs were truly [B] mothers.","ko":"위부화개구리는 지금은 [A] 동물이고, 암컷 개구리들은 정말로 [B] 어머니였다.","bank":["extinct","unique","possible","swallow","vomit","develop"],"bko":{"extinct":"멸종된","unique":"유일무이한","possible":"가능한","swallow":"삼키다","vomit":"토하다","develop":"성장하다"},"r":{"a":"[A] extinct, [B] unique","ev":"3번, 11번 문장","s":[[3,"This was the gastric-brooding frog, an animal that is now extinct.","이것은 지금은 멸종된 동물인 위부화개구리였다."],[11,"Female gastric-brooding frogs were truly unique mothers.","암컷 위부화개구리는 정말로 유일무이한 어머니였다."]],"w":"3번에서 위부화개구리는 지금 extinct(멸종된) 동물이라고 하고, 11번에서 암컷은 truly unique(정말로 유일무이한) mothers였다고 해요.","c":null},"h":"14c462c8dc"}]},{"u":5,"id":"hs2-05-3","no":3,"ko":"플라스틱을 먹어 해치워요","items":[{"n":1,"t":"tf","q":"Gilbert is a 3D printed robotic fish.","ko":"Gilbert는 3D로 인쇄된 로봇 물고기이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Gilbert is a 3D printed robotic fish.","Gilbert는 3D로 인쇄된 로봇 물고기이다."]],"w":"4번 문장에 Gilbert is a 3D printed robotic fish.가 그대로 있어요. 진짜 물고기가 아니라 로봇 물고기예요.","c":"T"},"h":"3d41091c2b"},{"n":2,"t":"tf","q":"Gilbert gets sick when it eats plastic.","ko":"Gilbert는 플라스틱을 먹으면 병에 걸린다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"It eats plastic in the ocean, but it never gets sick!","그것은 바닷속의 플라스틱을 먹지만, 절대 병에 걸리지 않는다."]],"w":"2번 문장에서 Gilbert는 바닷속의 플라스틱을 먹지만 it never gets sick(절대 병에 걸리지 않는다)이라고 해요.","c":"F"},"h":"5c40c2256c"},{"n":3,"t":"tf","q":"Anyone with a 3D printer can make a plastic-eating fish.","ko":"3D 프린터를 가진 누구나 플라스틱을 먹는 물고기를 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Anyone with a 3D printer can make their own plastic-eating fish and help our planet!","3D 프린터를 가진 누구나 그들 자신만의 플라스틱을 먹는 물고기를 만들 수 있고 우리 행성을 도울 수 있다!"]],"w":"12번 문장에서 3D 프린터를 가진 누구나 자신만의 플라스틱을 먹는 물고기를 만들 수 있다고 해요.","c":"T"},"h":"7d1df8a97e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (There is a special fish that is used to reduce water pollution.)","ko":"수질 오염을 줄이기 위해 사용되는 특별한 물고기가 있다.","opts":["늘리다","줄이다","만들다","옮기다"],"word":"reduce","r":{"a":"2) 줄이다","ev":"1번 문장","s":[[1,"There is a special fish that is used to reduce water pollution.","수질 오염을 줄이기 위해 사용되는 특별한 물고기가 있다."]],"w":"물고기가 바다의 플라스틱을 먹어서 오염을 어떻게 하려는 것인지 생각해 보세요. 오염을 없애려는 물고기이니 reduce = 줄이다예요.","c":2},"h":"cf072dd6ed"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then, the water is released.)","ko":"그러고 나서, 물이 내보내진다.","opts":["더럽혀진다","멈춰진다","숨겨진다","내보내진다"],"word":"released","r":{"a":"4) 내보내진다","ev":"9번 문장","s":[[9,"Then, the water is released.","그러고 나서, 물이 내보내진다."]],"w":"8번에서 아가미가 열린 뒤 물이 어떻게 되는지를 말하는 문장이에요. 10번에서 플라스틱만 배 안에 남는다고 했으니 물은 밖으로 나가요. release = 내보내다.","c":4},"h":"6cbd2da676"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nOnce Gilbert is full, its mouth closes and its gills open.","ko":"밑줄 친 its가 가리키는 것은?","opts":["플라스틱","3D 프린터","Gilbert","수질 오염"],"sko":"Gilbert가 가득 차면, 그것의 입이 닫히고 아가미가 열린다.","r":{"a":"3) Gilbert","ev":"8번 문장","s":[[8,"Once Gilbert is full, its mouth closes and its gills open.","Gilbert가 가득 차면, 그것의 입이 닫히고 아가미가 열린다."]],"w":"문장 앞부분에서 가득 찬(full) 것은 Gilbert이고, 입과 아가미를 가진 것도 Gilbert예요. its = Gilbert의.","c":3},"h":"390f09ed96"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But the plastic stays inside its belly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["하지만 플라스틱은 그것의 배 안에 남아 있다.","하지만 플라스틱은 물과 함께 밖으로 나간다.","하지만 플라스틱은 그것의 배 밖에 붙어 있다.","하지만 플라스틱은 곧바로 녹아 없어진다."],"sko":"하지만 플라스틱은 그것의 배 안에 남아있다.","r":{"a":"1) 하지만 플라스틱은 그것의 배 안에 남아 있다.","ev":"10번 문장","s":[[10,"But the plastic stays inside its belly.","하지만 플라스틱은 그것의 배 안에 남아있다."]],"w":"stays inside its belly = 배 안에 남아 있다. 9번에서 물만 내보내지고, But 뒤에서 플라스틱은 그대로 남는다고 말해요.","c":1},"h":"8a671af3e1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Gilbert throws the plastic back into the water.","Gilbert’s design is free for anyone to use.","Gilbert is a real fish that lives in the ocean.","Gilbert’s design costs a lot of money to use."],"oko":["Gilbert는 플라스틱을 다시 물속으로 던진다.","Gilbert의 디자인은 누구나 무료로 사용할 수 있다.","Gilbert는 바다에 사는 진짜 물고기이다.","Gilbert의 디자인은 사용하는 데 많은 돈이 든다."],"r":{"a":"2) Gilbert’s design is free for anyone to use.","ev":"11번 문장","s":[[11,"Gilbert’s design is free to use.","Gilbert의 디자인은 무료로 사용할 수 있다."]],"w":"11번에서 Gilbert의 디자인은 무료로 사용할 수 있다고 해요. 플라스틱은 배 안에 남고(10번), Gilbert는 로봇 물고기이며(4번), 비용이 많이 든다는 말은 없어요.","c":2},"h":"0a7f1abf20"},{"n":9,"t":"sum","q":"Gilbert (A) plastic in the water, lets the (B) out, and keeps the plastic inside its belly.","ko":"Gilbert는 물속의 플라스틱을 (A)하고, (B)을 내보내며, 플라스틱은 배 안에 남겨 둔다.","opts":["(A) drops / (B) plastic","(A) collects / (B) plastic","(A) avoids / (B) water","(A) makes / (B) water","(A) collects / (B) water"],"oko":["(A) 떨어뜨린다 / (B) 플라스틱","(A) 모은다 / (B) 플라스틱","(A) 피한다 / (B) 물","(A) 만든다 / (B) 물","(A) 모은다 / (B) 물"],"r":{"a":"5) (A) collects / (B) water","ev":"6번, 9번, 10번 문장","s":[[6,"As Gilbert swims, it opens its mouth wide and collects plastic in the water.","Gilbert는 헤엄치면서, 입을 크게 벌리고 물속의 플라스틱을 모은다."],[9,"Then, the water is released.","그러고 나서, 물이 내보내진다."],[10,"But the plastic stays inside its belly.","하지만 플라스틱은 그것의 배 안에 남아있다."]],"w":"6번에서 Gilbert는 물속의 플라스틱을 모아요(collects). 9번에서 물이 내보내지고(water is released), 10번에서 플라스틱은 배 안에 남아요.","c":5},"h":"d4918b2cb0"},{"n":10,"t":"fill","q":"Gilbert uses [A] to detect small pieces of plastic waste, and its design is [B] to use.","ko":"Gilbert는 작은 플라스틱 쓰레기 조각들을 감지하기 위해 [A]를 사용하고, 그것의 디자인은 [B] 사용할 수 있다.","bank":["sensors","free","belly","planet","pollution","robotic"],"bko":{"sensors":"감지기","free":"무료의","belly":"배","planet":"행성","pollution":"오염","robotic":"로봇의"},"r":{"a":"[A] sensors, [B] free","ev":"5번, 11번 문장","s":[[5,"It uses sensors to easily detect small pieces of plastic waste.","그것은 작은 플라스틱 쓰레기 조각들을 쉽게 감지하기 위해 감지기를 사용한다."],[11,"Gilbert’s design is free to use.","Gilbert의 디자인은 무료로 사용할 수 있다."]],"w":"5번에서 Gilbert는 sensors(감지기)를 사용해 작은 플라스틱 조각을 감지하고, 11번에서 디자인은 free(무료로) 사용할 수 있다고 해요.","c":null},"h":"437bd02b76"}]},{"u":6,"id":"hs2-06-1","no":1,"ko":"주사위를 굴려보자","items":[{"n":1,"t":"tf","q":"The Royal Game of Ur was made about 4,500 years ago.","ko":"우르의 로열 게임은 약 4,500년 전에 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에서 They were made about 4,500 years ago라고 해요. 4,500년 전에 만들어졌다는 내용과 일치해요.","c":"T","s":[[2,"They were made about 4,500 years ago for the Royal Game of Ur.","그것들은 약 4,500년 전에 우르의 로열 게임을 위해 만들어졌다."]]},"h":"6dd58d9d2d"},{"n":2,"t":"tf","q":"Players rolled round balls to move their pieces.","ko":"참가자들은 말을 옮기기 위해 둥근 공을 굴렸다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","w":"6번 문장에서 굴린 것은 피라미드 모양의 주사위(pyramid-shaped dice)예요. 둥근 공은 나오지 않아요.","c":"F","s":[[6,"They rolled pyramid-shaped dice.","그들은 피라미드 모양의 주사위를 굴렸다."]]},"h":"227b1ac87d"},{"n":3,"t":"tf","q":"Each square on the board had a different meaning.","ko":"판의 각각의 칸은 다른 의미를 가지고 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","w":"11번 문장에 Each square had a different meaning이 그대로 있어요.","c":"T","s":[[11,"Each square had a different meaning.","각각의 칸은 다른 의미를 가지고 있었다."]]},"h":"0f701e3d0e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (if a piece landed on a certain square, ...)","ko":"만약 말이 특정 칸에 도착했으면, ...","opts":["떠났다","부서졌다","도착했다","팔렸다"],"word":"landed","r":{"a":"3) 도착했다","ev":"12번 문장","w":"12번에서 말이 특정 칸 위에 놓이는 상황이에요. land는 '도착하다'라는 뜻이라 말이 칸에 도착했다는 뜻이에요.","c":3,"s":[[12,"So if a piece landed on a certain square, it meant the player would have good fortune.","그래서 만약 말이 특정 칸에 도착했으면, 그것은 그 참가자가 행운을 얻을 것이라는 것을 의미했다."]]},"h":"130bdf7081"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The game was more than just entertainment.)","ko":"그 게임은 단순한 오락 이상이었다.","opts":["교육","오락","시험","운동"],"word":"entertainment","r":{"a":"2) 오락","ev":"9번 문장","w":"9번은 게임이 단순한 entertainment(오락) 이상이었다는 말이고, 10번에서 미래를 알려 준다는 다른 쓰임이 나와요.","c":2,"s":[[9,"The game was more than just entertainment.","그 게임은 단순한 오락 이상이었다."]]},"h":"ff6eaf7a0b"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey were made about 4,500 years ago for the Royal Game of Ur.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 약 4,500년 전에 우르의 로열 게임을 위해 만들어졌다.","opts":["수메르 사람들","로열 게임의 참가자들","우르 도시의 건물들","두 개의 게임판"],"r":{"a":"4) 두 개의 게임판","ev":"1~2번 문장","w":"1번에서 발견된 것은 two game boards예요. 2번의 They는 이 두 개의 게임판이고, 로열 게임을 위해 만들어졌다고 해요.","c":4,"s":[[1,"In 1928, two game boards were found at the site of the Sumerian city of Ur.","1928년에, 우르라는 수메르 도시가 있던 자리에서 두 개의 게임판이 발견되었다."],[2,"They were made about 4,500 years ago for the Royal Game of Ur.","그것들은 약 4,500년 전에 우르의 로열 게임을 위해 만들어졌다."]]},"h":"2d702f42d5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The game was more than just entertainment.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 게임은 단순한 오락 이상이었다.","opts":["그 게임은 단순한 오락 이상의 의미를 가졌다.","그 게임은 오락으로만 쓰였다.","그 게임은 오락보다 덜 중요했다.","그 게임은 오락이 되기에 너무 어려웠다."],"r":{"a":"1) 그 게임은 단순한 오락 이상의 의미를 가졌다.","ev":"9~10번 문장","w":"more than just ~는 '단순한 ~ 이상'이에요. 10번에서 사람들이 미래를 알려 준다고 생각했다고 하니, 오락 말고 다른 의미도 있었다는 뜻이에요.","c":1,"s":[[9,"The game was more than just entertainment.","그 게임은 단순한 오락 이상이었다."],[10,"People thought the game told the future.","사람들은 그 게임이 미래를 알려 준다고 생각했다."]]},"h":"df634af3b6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["2개의 게임판이 1982년에 발견되었다.","각 참가자는 두 개의 말을 가졌다.","사람들은 오늘날에도 그 게임을 한다.","그 게임은 약 450년 전에 만들어졌다."],"opts":["Two game boards were found in 1982.","Each player had two pieces.","People still play the game today.","The game was made about 450 years ago."],"r":{"a":"3) People still play the game today.","ev":"13번 문장","w":"13번에서 그 게임은 오늘날에도 여전히 진행된다고 해요. 게임판은 1928년(1번)에 발견되었고, 말은 일곱 개씩(5번)이며, 약 4,500년 전(2번)에 만들어졌어요.","c":3,"s":[[13,"The game is still played today!","그 게임은 오늘날에도 여전히 진행된다!"]]},"h":"04a8e9d434"},{"n":9,"t":"sum","q":"The Royal Game of Ur was one of the (A) board games, and people thought it could (B) the future.","ko":"우르의 로열 게임은 가장 (A) 보드게임들 중 하나였고, 사람들은 그 게임이 미래를 (B) 수 있다고 생각했다.","oko":["(A) 가장 새로운 / (B) 알려 줄","(A) 가장 오래된 / (B) 숨길","(A) 가장 작은 / (B) 바꿀","(A) 가장 쉬운 / (B) 잊을","(A) 가장 오래된 / (B) 알려 줄"],"opts":["(A) newest / (B) tell","(A) oldest / (B) hide","(A) smallest / (B) change","(A) easiest / (B) forget","(A) oldest / (B) tell"],"r":{"a":"5) (A) oldest / (B) tell","ev":"3번, 10번 문장","w":"3번에서 가장 오래된(oldest) 보드게임들 중 하나라고 하고, 10번에서 사람들은 그 게임이 미래를 알려 준다(told the future)고 생각했어요.","c":5,"s":[[3,"It is one of the oldest board games!","그것은 가장 오래된 보드게임들 중 하나이다!"],[10,"People thought the game told the future.","사람들은 그 게임이 미래를 알려 준다고 생각했다."]]},"h":"b2cb0652bc"},{"n":10,"t":"fill","q":"Each player had seven [A] and moved them to the [B] of the board to win.","ko":"각 참가자는 일곱 개의 [A]을(를) 가졌고, 이기려면 그것들을 판의 [B]까지 옮겼다.","bank":["pieces","end","players","future","meaning","fortune"],"bko":{"pieces":"말","end":"끝","players":"참가자","future":"미래","meaning":"의미","fortune":"운"},"r":{"a":"[A] pieces, [B] end","ev":"5번, 8번 문장","w":"5번에서 각 참가자가 일곱 개의 말(pieces)을 가졌고, 8번에서 이기려면 모든 말을 판의 끝(end)까지 옮겨야 했어요.","c":null,"s":[[5,"Two players had seven pieces each.","두 명의 참가자는 각각 일곱 개의 말을 가졌다."],[8,"To win, players had to move all their pieces to the end of the board.","이기기 위해서, 참가자들은 모든 말을 판의 끝까지 옮겨야 했다."]]},"h":"aae8a10188"}]},{"u":6,"id":"hs2-06-2","no":2,"ko":"토마토는 억울해","items":[{"n":1,"t":"tf","q":"Wealthy Europeans in the 1700s got sick after eating tomatoes.","ko":"1700년대에 부유한 유럽인들은 토마토를 먹은 후 병에 걸렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장에 In the 1700s, wealthy Europeans got sick ... after eating tomatoes라고 나와요.","c":"T","s":[[3,"In the 1700s, wealthy Europeans got sick and sometimes died after eating tomatoes.","1700년대에, 부유한 유럽인들이 토마토를 먹은 후에 병에 걸리고 때때로 사망했다."]]},"h":"c36c26ab2c"},{"n":2,"t":"tf","q":"Today, tomatoes are known as a dangerous food.","ko":"오늘날 토마토는 위험한 음식으로 알려져 있다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","w":"1번 문장에서 오늘날 토마토는 슈퍼푸드(superfood)로 알려져 있다고 해요. 위험한 음식은 과거의 오해였어요.","c":"F","s":[[1,"Today, tomatoes are known as a superfood.","오늘날, 토마토는 슈퍼푸드로 알려져 있다."]]},"h":"f505c61f60"},{"n":3,"t":"tf","q":"People began eating pizza in Italy.","ko":"사람들은 이탈리아에서 피자를 먹기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","w":"11번 문장에 In Italy, people began eating pizza가 있어요.","c":"T","s":[[11,"In Italy, people began eating pizza, and they liked it!","이탈리아에서, 사람들은 피자를 먹기 시작했고, 그들은 그것을 좋아했다!"]]},"h":"18d7cd4dd6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They blamed the fruit!)","ko":"그들은 그 과일을 탓했다!","opts":["칭찬했다","탓했다","숨겼다","팔았다"],"word":"blamed","r":{"a":"2) 탓했다","ev":"3~4번 문장","w":"3번에서 토마토를 먹은 후 사람들이 병에 걸렸고, 4번에서 그 과일을 blame했어요. 5번에서 ‘토마토가 문제가 아니었다’고 하니 blame은 ‘탓하다’예요.","c":2,"s":[[3,"In the 1700s, wealthy Europeans got sick and sometimes died after eating tomatoes.","1700년대에, 부유한 유럽인들이 토마토를 먹은 후에 병에 걸리고 때때로 사망했다."],[4,"They blamed the fruit!","그들은 그 과일을 탓했다!"]]},"h":"754162ea47"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (they realized tomatoes weren’t dangerous)","ko":"그들은 토마토가 위험하지 않다는 것을 깨달았다","opts":["잊었다","거절했다","걱정했다","깨달았다"],"word":"realized","r":{"a":"4) 깨달았다","ev":"10번 문장","w":"과학을 더 배우면서(As people learned more about science) 알게 된 것이므로 realize는 ‘깨닫다’예요.","c":4,"s":[[10,"As people learned more about science, they realized tomatoes weren’t dangerous.","사람들이 과학에 대해 더 많이 배우면서, 그들은 토마토가 위험하지 않다는 것을 깨달았다."]]},"h":"759ee8683a"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nPewter has poisonous lead in it.","ko":"밑줄 친 it가 가리키는 것은?","sko":"백랍은 그것 안에 독성이 있는 납이 있다.","opts":["유럽인들","토마토의 산","백랍","과일"],"r":{"a":"3) 백랍","ev":"6~7번 문장","w":"7번은 Pewter has poisonous lead in it이에요. 납이 들어 있는 곳은 문장의 주어인 Pewter(백랍)이므로 it은 백랍이에요.","c":3,"s":[[6,"At that time, wealthy people ate food from pewter plates.","그 당시에, 부유한 사람들은 백랍 접시로부터 음식을 먹었다."],[7,"Pewter has poisonous lead in it.","백랍은 그것 안에 독성이 있는 납이 있다."]]},"h":"a6f9ec88f1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But tomatoes were not the problem.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 토마토가 문제가 아니었다.","opts":["문제의 원인은 토마토가 아니었다.","토마토가 유일한 문제였다.","토마토가 큰 문제를 해결했다.","그 문제는 아직 해결되지 않았다."],"r":{"a":"1) 문제의 원인은 토마토가 아니었다.","ev":"5번 문장","w":"were not the problem은 ‘문제가 아니었다’예요. 4번에서 토마토를 탓했지만, 진짜 원인은 접시의 납이었다는 말이에요.","c":1,"s":[[5,"But tomatoes were not the problem.","하지만 토마토가 문제가 아니었다."]]},"h":"75ba0f6c99"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["부유한 사람들은 은 접시로 음식을 먹었다.","토마토 안에 납이 들어 있어서 병에 걸렸다.","이탈리아 사람들은 토마토를 먹지 않게 되었다.","토마토는 전 세계적으로 인기 있어졌다."],"opts":["Wealthy people ate food from silver plates.","The lead in tomatoes made people sick.","People in Italy stopped eating tomatoes.","Tomatoes became popular around the world."],"r":{"a":"4) Tomatoes became popular around the world.","ev":"12번 문장","w":"12번에서 토마토는 전 세계적으로 인기 있어졌다고 해요. 6번에서 접시는 백랍이고, 납은 백랍에 있으며(7번), 이탈리아 사람들은 피자를 먹기 시작했어요(11번).","c":4,"s":[[12,"Soon, tomatoes became popular around the world.","머지않아, 토마토는 전 세계적으로 인기 있어졌다."]]},"h":"577e5921e0"},{"n":9,"t":"sum","q":"People got sick not because of tomatoes but because of the lead in their (A) plates, and later they learned that tomatoes were (B).","ko":"사람들은 토마토 때문이 아니라 그들의 (A) 접시 속 납 때문에 병에 걸렸고, 나중에 토마토가 (B)하다는 것을 알게 되었다.","oko":["(A) 유리 / (B) 안전","(A) 백랍 / (B) 위험","(A) 나무 / (B) 위험","(A) 유리 / (B) 위험","(A) 백랍 / (B) 안전"],"opts":["(A) glass / (B) safe","(A) pewter / (B) dangerous","(A) wooden / (B) dangerous","(A) glass / (B) dangerous","(A) pewter / (B) safe"],"r":{"a":"5) (A) pewter / (B) safe","ev":"6번, 7번, 10번 문장","w":"6~7번에서 부유한 사람들이 먹은 백랍(pewter) 접시에 독성이 있는 납이 있었고, 10번에서 토마토가 위험하지 않다(safe)는 것을 깨달았어요.","c":5,"s":[[6,"At that time, wealthy people ate food from pewter plates.","그 당시에, 부유한 사람들은 백랍 접시로부터 음식을 먹었다."],[7,"Pewter has poisonous lead in it.","백랍은 그것 안에 독성이 있는 납이 있다."],[10,"As people learned more about science, they realized tomatoes weren’t dangerous.","사람들이 과학에 대해 더 많이 배우면서, 그들은 토마토가 위험하지 않다는 것을 깨달았다."]]},"h":"7556546e86"},{"n":10,"t":"fill","q":"The [A] in tomatoes made lead come out of the plates, and soon tomatoes became [B] around the world.","ko":"토마토의 [A]이(가) 접시에서 납이 나오게 했고, 머지않아 토마토는 전 세계적으로 [B]해졌다.","bank":["acid","popular","lead","sick","pizza","plates"],"bko":{"acid":"산","popular":"인기 있는","lead":"납","sick":"병에 걸린","pizza":"피자","plates":"접시"},"r":{"a":"[A] acid, [B] popular","ev":"8번, 12번 문장","w":"8번에서 토마토의 산(acid)이 접시에서 납이 나오게 했고, 12번에서 토마토는 전 세계적으로 인기 있어졌어요(popular).","c":null,"s":[[8,"The acid in tomatoes made lead come out of the plates.","토마토의 산은 접시에서 납이 나오게 했다."],[12,"Soon, tomatoes became popular around the world.","머지않아, 토마토는 전 세계적으로 인기 있어졌다."]]},"h":"53dd7085aa"}]},{"u":6,"id":"hs2-06-3","no":3,"ko":"똑똑! 존경합니다, 선생님~","items":[{"n":1,"t":"tf","q":"Students in German universities knock on their desks at the end of class.","ko":"독일 대학의 학생들은 수업의 끝 무렵에 책상을 두드린다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","w":"1번 문장에 students gently knock on their desks at the end of class가 그대로 나와요.","c":"T","s":[[1,"In universities in Germany, students gently knock on their desks at the end of class.","독일의 대학들에서는, 수업의 끝 무렵에 학생들이 책상을 약하게 두드린다."]]},"h":"ec5654766b"},{"n":2,"t":"tf","q":"German students clap loudly for their teachers.","ko":"독일 학생들은 선생님들을 위해 크게 박수를 친다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","w":"6번에서 학생들은 선생님들을 위해 박수를 치지 않았다(didn’t clap)고 해요. 박수 대신 책상을 두드려요.","c":"F","s":[[6,"So students didn’t clap for their teachers.","그래서 학생들은 그들의 선생님들을 위해 박수를 치지 않았다."]]},"h":"f1163c6830"},{"n":3,"t":"tf","q":"German students knock on their desks to say thanks for the lecture.","ko":"독일 학생들은 강의에 대한 감사를 말하기 위해 책상을 두드린다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에서 They do this to say “Thanks for the great lecture, Teacher.”라고 해요. 두드리는 것은 강의에 감사하다고 말하는 행동이에요.","c":"T","s":[[2,"They do this to say “Thanks for the great lecture, Teacher.”","그들은 “선생님, 좋은 강의 감사합니다”라고 말하기 위해 이렇게 한다."]]},"h":"072df519c6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (students gently knock on their desks)","ko":"학생들은 책상을 약하게 두드린다","opts":["큰 소리로","약하게","화가 나서","빠르게"],"word":"gently","r":{"a":"2) 약하게","ev":"1번 문장","w":"gently는 ‘약하게, 부드럽게’예요. 학생들이 책상을 두드리는 방식을 말해 줘요.","c":2,"s":[[1,"In universities in Germany, students gently knock on their desks at the end of class.","독일의 대학들에서는, 수업의 끝 무렵에 학생들이 책상을 약하게 두드린다."]]},"h":"7a90a56259"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (they started knocking on their desks to show greater respect)","ko":"그들은 더 큰 존경을 보여 주려고 책상을 두드리기 시작했다","opts":["두려움","실망","피곤함","존경"],"word":"respect","r":{"a":"4) 존경","ev":"7번 문장","w":"2번에서 선생님께 감사를 전하는 행동이고, 7번에서 더 큰 respect를 보여 준다고 하니 ‘존경’이에요.","c":4,"s":[[7,"Instead, they started knocking on their desks to show greater respect.","대신에, 그들은 더 큰 존경을 보여주기 위해 그들의 책상을 두드리기 시작했다."]]},"h":"0757d07e37"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nThey do this to say “Thanks for the great lecture, Teacher.”","ko":"밑줄 친 this가 가리키는 것은?","sko":"그들은 “선생님, 좋은 강의 감사합니다”라고 말하기 위해 이렇게 한다.","opts":["수업을 끝내는 것","선생님에게 질문하는 것","수업의 끝 무렵에 책상을 약하게 두드리는 것","강의를 녹음하는 것"],"r":{"a":"3) 수업의 끝 무렵에 책상을 약하게 두드리는 것","ev":"1~2번 문장","w":"2번의 this는 바로 앞 1번의 gently knock on their desks at the end of class를 대신해요.","c":3,"s":[[1,"In universities in Germany, students gently knock on their desks at the end of class.","독일의 대학들에서는, 수업의 끝 무렵에 학생들이 책상을 약하게 두드린다."],[2,"They do this to say “Thanks for the great lecture, Teacher.”","그들은 “선생님, 좋은 강의 감사합니다”라고 말하기 위해 이렇게 한다."]]},"h":"961703805b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Back then, they were considered less important than teachers in society.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 당시에, 그들은 사회에서 선생님들보다 덜 중요하다고 여겨졌다.","opts":["그들은 사회에서 선생님들보다 덜 중요하게 여겨졌다.","그들은 사회에서 선생님들보다 더 중요하게 여겨졌다.","그들은 선생님들과 똑같이 중요하게 여겨졌다.","그들은 선생님들을 덜 중요하게 여겼다."],"r":{"a":"1) 그들은 사회에서 선생님들보다 덜 중요하게 여겨졌다.","ev":"4~5번 문장","w":"less important than ~은 ‘~보다 덜 중요한’이고 were considered는 ‘여겨졌다’예요. 여겨진 쪽은 4번의 배우들과 음악가들이에요.","c":1,"s":[[4,"In the past, clapping was used to cheer for actors and musicians.","과거에, 박수는 배우들과 음악가들을 응원하기 위해 사용되었다."],[5,"Back then, they were considered less important than teachers in society.","그 당시에, 그들은 사회에서 선생님들보다 덜 중요하다고 여겨졌다."]]},"h":"dfca005615"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["학생들은 수업이 시작될 때 책상을 두드린다.","과거에 박수는 배우들과 음악가들을 응원하기 위해 사용되었다.","배우들은 사회에서 선생님들보다 더 중요하게 여겨졌다.","학생들은 필기를 하면서 두 손으로 박수를 친다."],"opts":["Students knock on their desks at the start of class.","In the past, clapping was used to cheer for actors and musicians.","Actors were considered more important than teachers in society.","Students clap with both hands while they take notes."],"r":{"a":"2) In the past, clapping was used to cheer for actors and musicians.","ev":"4번 문장","w":"4번에서 과거에 박수는 배우들과 음악가들을 응원하는 데 쓰였다고 해요. 두드림은 수업의 끝(1번)이고, 배우들은 선생님보다 덜 중요했으며(5번), 필기 때문에 두 손으로 박수를 칠 수 없어요(9번).","c":2,"s":[[4,"In the past, clapping was used to cheer for actors and musicians.","과거에, 박수는 배우들과 음악가들을 응원하기 위해 사용되었다."]]},"h":"ba706ac972"},{"n":9,"t":"sum","q":"Students don’t (A) for their teachers. Instead, they (B) on their desks to show respect.","ko":"학생들은 선생님들을 위해 (A)하지 않는다. 대신에 존경을 보여 주려고 책상을 (B)한다.","oko":["(A) 응원 / (B) 글씨 쓰기","(A) 두드리기 / (B) 박수 치기","(A) 박수 치기 / (B) 잠자기","(A) 응원 / (B) 말하기","(A) 박수 치기 / (B) 두드리기"],"opts":["(A) cheer / (B) write","(A) knock / (B) clap","(A) clap / (B) sleep","(A) cheer / (B) talk","(A) clap / (B) knock"],"r":{"a":"5) (A) clap / (B) knock","ev":"6번, 7번 문장","w":"6번에서 학생들은 선생님을 위해 박수를 치지 않았고(didn’t clap), 7번에서 대신 책상을 두드리기(knock) 시작했어요.","c":5,"s":[[6,"So students didn’t clap for their teachers.","그래서 학생들은 그들의 선생님들을 위해 박수를 치지 않았다."],[7,"Instead, they started knocking on their desks to show greater respect.","대신에, 그들은 더 큰 존경을 보여주기 위해 그들의 책상을 두드리기 시작했다."]]},"h":"e65ca421b4"},{"n":10,"t":"fill","q":"Students need only [A] hand to knock, so knocking is [B] than clapping for them.","ko":"학생들은 두드리는 데 [A] 손만 필요해서, 그들에게는 두드리는 것이 박수를 치는 것보다 [B].","bank":["easier","one","both","notes","desks","respect"],"bko":{"easier":"더 쉬운","one":"한 개의","both":"두 개 모두의","notes":"필기","desks":"책상","respect":"존경"},"r":{"a":"[A] one, [B] easier","ev":"8~10번 문장","w":"8번에서 두드리는 것이 박수 치는 것보다 더 쉽다(easier)고 하고, 10번에서 두드리는 데는 한(one) 손만 필요하다고 해요.","c":null,"s":[[8,"Also, knocking is easier for students than clapping.","또한, 학생들에게는 두드리는 것이 박수를 치는 것보다 더 쉽다."],[9,"They need to take notes, so they can’t clap with both hands.","그들은 필기를 해야 해서, 두 손으로 박수를 칠 수 없다."],[10,"To knock, they just need one hand!","두드리기 위해서는, 그들은 한 손만 필요하다!"]]},"h":"5593acb64b"}]},{"u":7,"id":"hs2-07-1","no":1,"ko":"왜 잠이 안 오지?","items":[{"n":1,"t":"tf","q":"Diego could not fall asleep after watching some videos.","ko":"Diego는 몇 개의 동영상을 본 후에 잠들 수 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"Diego: I didn’t sleep well.","나는 잘 못 잤어."],[4,"I couldn’t fall asleep after watching some videos.","몇 개의 동영상을 본 후에 잠들 수 없었어."]],"w":"4번 문장에 I couldn’t fall asleep after watching some videos가 그대로 나와요. 동영상을 본 뒤 잠들 수 없었다는 내용과 일치해요.","c":"T"},"h":"e5a183bff2"},{"n":2,"t":"tf","q":"Ari says that blue light comes only from the sun.","ko":"Ari는 블루라이트가 태양에서만 나온다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"Ari: It is a type of light that comes from the sun.","그것은 태양에서 나오는 빛의 한 종류야."],[8,"It also comes from electronic devices like smartphones and computers.","그것은 스마트폰과 컴퓨터와 같은 전자기기들에서도 나와."]],"w":"7번에서 태양에서 나온다고 했지만, 8번에서 also(또한) 스마트폰과 컴퓨터 같은 전자기기에서도 나온다고 해요. 태양에서'만' 나오는 것이 아니에요.","c":"F"},"h":"a6a57e092c"},{"n":3,"t":"tf","q":"Diego decides to try not to look at screens before bed.","ko":"Diego는 자기 전에 화면을 보지 않기 위해 노력하기로 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"16번 문장","s":[[16,"Diego: Oh, I’ll try not to look at screens before bed, then!","아, 그러면, 나는 자기 전에 화면을 보지 않기 위해 노력해야겠다!"]],"w":"16번에서 Diego가 I’ll try not to look at screens before bed라고 말해요. 자기 전에 화면을 보지 않으려고 노력하겠다는 뜻이에요.","c":"T"},"h":"83a257bb99"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (During the day, blue light helps you stay awake.)","ko":"낮 동안에, 블루라이트는 네가 깨어 있는 상태를 유지하도록 도와준다.","opts":["졸린","배고픈","깨어 있는","행복한"],"word":"awake","r":{"a":"3) 깨어 있는","ev":"9번 문장","s":[[9,"During the day, blue light helps you stay awake.","낮 동안에, 블루라이트는 네가 깨어 있는 상태를 유지하도록 도와줘."]],"w":"블루라이트는 낮 동안 도움을 준다는 내용이에요. stay awake는 잠들지 않고 깨어 있는 상태를 유지한다는 뜻이고, 그래서 awake = 깨어 있는이에요.","c":3},"h":"b54124c72f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It can prevent you from falling asleep.)","ko":"그것은 네가 잠드는 것을 막을 수 있다.","opts":["돕다","시작하다","즐기다","막다"],"word":"prevent","r":{"a":"4) 막다","ev":"13번 문장","s":[[13,"Ari: It can prevent you from falling asleep.","그것은 네가 잠드는 것을 막을 수 있어."]],"w":"12번에서 왜 건강에 안 좋은지 물었고, 13번이 그 이유예요. 블루라이트가 잠드는 것을 막는다는 뜻이어서 prevent(막다)가 알맞아요.","c":4},"h":"7f219c1de5"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt makes our bodies produce less melatonin.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 우리 몸이 더 적은 양의 멜라토닌을 생산하게 한다.","opts":["멜라토닌","블루라이트","태양","잠"],"r":{"a":"2) 블루라이트","ev":"10번, 13~14번 문장","s":[[10,"But getting too much blue light at night is not good for your health.","하지만 밤에 블루라이트를 너무 많이 받는 것은 건강에 안 좋아."],[13,"Ari: It can prevent you from falling asleep.","그것은 네가 잠드는 것을 막을 수 있어."],[14,"It makes our bodies produce less melatonin.","그것은 우리 몸이 더 적은 양의 멜라토닌을 생산하게 해."]],"w":"10번에서 blue light가 건강에 안 좋다고 했고, 13번의 It도 같은 블루라이트예요. 14번의 It도 이어서 블루라이트를 가리켜요. 멜라토닌은 14번 문장에서 생산되는 대상이에요.","c":2},"h":"4c1115f2c1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But getting too much blue light at night is not good for your health.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 밤에 블루라이트를 너무 많이 받는 것은 건강에 안 좋다.","opts":["밤에 블루라이트를 너무 많이 받는 것은 건강에 안 좋다.","밤에 블루라이트를 받는 것은 건강에 매우 좋다.","낮에 블루라이트를 너무 많이 받는 것은 건강에 안 좋다.","블루라이트를 전혀 받지 않으면 건강에 안 좋다."],"r":{"a":"1) 밤에 블루라이트를 너무 많이 받는 것은 건강에 안 좋다.","ev":"10번 문장","s":[[10,"But getting too much blue light at night is not good for your health.","하지만 밤에 블루라이트를 너무 많이 받는 것은 건강에 안 좋아."]],"w":"too much는 너무 많이, at night은 밤에, not good for your health는 건강에 안 좋다는 뜻이에요. 낮이 아니라 밤이고, 건강에 안 좋다는 내용이에요.","c":1},"h":"36971090d2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["블루라이트는 스마트폰과 컴퓨터에서만 나온다.","블루라이트는 낮 동안 졸리게 만든다.","멜라토닌은 우리가 수면을 위해 필요한 호르몬이다.","Diego가 Ari에게 블루라이트를 설명해 준다."],"opts":["Blue light comes only from smartphones and computers.","Blue light makes us sleepy during the day.","Melatonin is a hormone that we need for sleep.","Diego explains blue light to Ari."],"r":{"a":"3) Melatonin is a hormone that we need for sleep.","ev":"15번 문장","s":[[15,"Melatonin is the hormone we need for sleep.","멜라토닌은 우리가 수면을 위해 필요한 호르몬이야."]],"w":"15번 문장에서 멜라토닌은 우리가 수면을 위해 필요한 호르몬이라고 해요. 블루라이트는 전자기기에서도 나오고(7~8번), 낮에는 깨어 있게 도우며(9번), 블루라이트를 설명하는 사람은 Ari예요.","c":3},"h":"838f69981e"},{"n":9,"t":"sum","q":"During the day, blue light helps us stay (A). But at night, too much blue light can (B) us from falling asleep.","ko":"낮에 블루라이트는 우리가 (A) 상태를 유지하도록 돕는다. 하지만 밤에 너무 많은 블루라이트는 우리가 잠드는 것을 (B) 수 있다.","oko":["(A) 졸린 / (B) 막다","(A) 깨어 있는 / (B) 돕다","(A) 배고픈 / (B) 허락하다","(A) 졸린 / (B) 돕다","(A) 깨어 있는 / (B) 막다"],"opts":["(A) sleepy / (B) prevent","(A) awake / (B) help","(A) hungry / (B) allow","(A) sleepy / (B) help","(A) awake / (B) prevent"],"r":{"a":"5) (A) awake / (B) prevent","ev":"9~10번, 13번 문장","s":[[9,"During the day, blue light helps you stay awake.","낮 동안에, 블루라이트는 네가 깨어 있는 상태를 유지하도록 도와줘."],[10,"But getting too much blue light at night is not good for your health.","하지만 밤에 블루라이트를 너무 많이 받는 것은 건강에 안 좋아."],[13,"Ari: It can prevent you from falling asleep.","그것은 네가 잠드는 것을 막을 수 있어."]],"w":"9번에서 낮에는 깨어 있게(awake) 도와요. 10번과 13번에서 밤에 너무 많이 받으면 잠드는 것을 막을(prevent) 수 있다고 해요.","c":5},"h":"a9dcc48d2a"},{"n":10,"t":"fill","q":"Blue light makes our bodies produce [A] melatonin. Melatonin is the [B] we need for sleep.","ko":"블루라이트는 우리 몸이 [A] 멜라토닌을 생산하게 한다. 멜라토닌은 우리가 수면을 위해 필요한 [B]이다.","bank":["less","hormone","device","awake","health","bed"],"bko":{"less":"더 적은","hormone":"호르몬","device":"기기","awake":"깨어 있는","health":"건강","bed":"침대"},"r":{"a":"[A] less, [B] hormone","ev":"14~15번 문장","s":[[14,"It makes our bodies produce less melatonin.","그것은 우리 몸이 더 적은 양의 멜라토닌을 생산하게 해."],[15,"Melatonin is the hormone we need for sleep.","멜라토닌은 우리가 수면을 위해 필요한 호르몬이야."]],"w":"14번에서 블루라이트는 멜라토닌을 더 적게(less) 만들게 하고, 15번에서 멜라토닌은 수면에 필요한 호르몬(hormone)이라고 해요.","c":null},"h":"35780e2110"}]},{"u":7,"id":"hs2-07-2","no":2,"ko":"황금빛 축제","items":[{"n":1,"t":"tf","q":"People use lemons and oranges to decorate buildings at the festival.","ko":"축제에서 사람들은 건물을 장식하기 위해 레몬과 오렌지를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"People use lemons and oranges to decorate buildings and make parade floats.","사람들은 건물을 장식하고 퍼레이드 장식 차량을 만들기 위해 레몬과 오렌지를 사용한다."]],"w":"5번 문장에 People use lemons and oranges to decorate buildings가 그대로 있어요. 레몬과 오렌지로 건물을 장식한다는 내용과 일치해요.","c":"T"},"h":"d376c0e007"},{"n":2,"t":"tf","q":"The festival has the same theme every year.","ko":"축제는 매년 같은 주제를 가진다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Each year, it has a different theme.","매년, 그것은 다른 주제를 가진다."]],"w":"3번 문장에서 Each year, it has a different theme(매년 다른 주제를 가진다)이라고 해요. 같은 주제라는 말은 반대예요.","c":"F"},"h":"f83b6914fe"},{"n":3,"t":"tf","q":"People sell some of the lemons and oranges after the festival.","ko":"사람들은 축제가 끝난 뒤 레몬과 오렌지 중 일부를 판다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~11번 문장","s":[[9,"When it ends, people sort the lemons and oranges.","그것이 끝나면, 사람들은 레몬과 오렌지를 분류한다."],[10,"They do this to find the ones to sell.","그들은 팔 것들을 찾기 위해 이것을 한다."],[11,"You can get them at a Sunday market!","당신은 일요일 시장에서 그것들을 살 수 있다!"]],"w":"9번에서 축제가 끝나면 레몬과 오렌지를 분류하고, 10번에서 팔 것(to sell)을 찾기 위해서라고 해요. 11번에서 일요일 시장에서 살 수 있다고 해요.","c":"T"},"h":"c9b1cdf99c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (At night, all the creations are illuminated!)","ko":"밑줄 친 단어의 뜻은? (밤에는, 모든 창작품이 ...!)","opts":["팔린","분류된","불이 켜진","사라진"],"word":"illuminated","r":{"a":"3) 불이 켜진","ev":"7번 문장","s":[[7,"At night, all the creations are illuminated!","밤에는, 모든 창작품에 불이 켜진다!"]],"w":"낮에 만든 건물 장식과 퍼레이드 장식 차량 같은 창작품들이 밤에 어떻게 되는지를 말하는 문장이에요. illuminate는 불을 켜다라는 뜻이라 are illuminated는 '불이 켜진다'예요.","c":3},"h":"05885bd217"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When it ends, people sort the lemons and oranges.)","ko":"밑줄 친 단어의 뜻은? (그것이 끝나면, 사람들은 레몬과 오렌지를 ...)","opts":["분류하다","장식하다","던지다","그리다"],"word":"sort","r":{"a":"1) 분류하다","ev":"9~10번 문장","s":[[9,"When it ends, people sort the lemons and oranges.","그것이 끝나면, 사람들은 레몬과 오렌지를 분류한다."],[10,"They do this to find the ones to sell.","그들은 팔 것들을 찾기 위해 이것을 한다."]],"w":"9번에서 축제가 끝나면 레몬과 오렌지를 sort하는데, 10번에서 그 이유가 팔 것들을 찾기 위해서라고 해요. 그래서 sort는 종류별로 나누어 고른다는 뜻의 분류하다예요.","c":1},"h":"c530fc9595"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nYou can get them at a Sunday market!","ko":"밑줄 친 them이 가리키는 것은?","sko":"당신은 일요일 시장에서 그것들을 살 수 있다!","opts":["퍼레이드 장식 차량","축제를 보러 온 사람들","프랑스의 마을들","팔기 위해 고른 레몬과 오렌지"],"r":{"a":"4) 팔기 위해 고른 레몬과 오렌지","ev":"10~11번 문장","s":[[10,"They do this to find the ones to sell.","그들은 팔 것들을 찾기 위해 이것을 한다."],[11,"You can get them at a Sunday market!","당신은 일요일 시장에서 그것들을 살 수 있다!"]],"w":"11번의 them은 바로 앞 10번의 the ones to sell(팔 것들)이에요. 이것은 축제가 끝난 뒤 분류한 레몬과 오렌지 중 팔기 위해 고른 것들이에요.","c":4},"h":"edd85caecd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you think lemons are just used to make lemonade, the Menton Lemon Festival may change your mind.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 레몬이 그저 레모네이드를 만드는 데 사용된다고 생각한다면, 망통 레몬 축제가 당신의 생각을 바꿀지도 모른다.","opts":["레모네이드를 만들려면 망통 레몬 축제에서 레몬을 사야 한다.","레몬이 레모네이드에만 쓰인다고 생각한다면, 망통 레몬 축제가 생각을 바꿔 줄지도 모른다.","레몬을 좋아하지 않는다면, 망통 레몬 축제에 가지 않는 것이 좋다.","레몬이 레모네이드 맛이 난다고 생각한다면, 축제에서 맛볼 수 있다."],"r":{"a":"2) 레몬이 레모네이드에만 쓰인다고 생각한다면, 망통 레몬 축제가 생각을 바꿔 줄지도 모른다.","ev":"1번 문장","s":[[1,"If you think lemons are just used to make lemonade, the Menton Lemon Festival may change your mind.","만약 레몬이 그저 레모네이드를 만드는 데 사용된다고 생각한다면, 망통 레몬 축제가 당신의 생각을 바꿀지도 모른다."]],"w":"If절은 '레몬이 그저 레모네이드 만드는 데만 쓰인다고 생각한다면'이고, may change your mind는 '생각을 바꿀지도 모른다'예요. 다른 선지는 축제에서 레몬을 사거나 맛본다는 내용인데 문장에 없어요.","c":2},"h":"fffb5b12f8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["축제는 매년 7월에 망통에서 열린다.","사람들은 건물을 장식할 때 레몬만 사용한다.","그 행사는 140톤이 넘는 과일을 사용한다.","축제는 단 이틀 동안만 계속된다."],"opts":["The festival is held in Menton every July.","People use only lemons to decorate buildings.","The event uses over 140 tons of fruit.","The festival runs for only two days."],"r":{"a":"3) The event uses over 140 tons of fruit.","ev":"6번 문장","s":[[2,"The French town of Menton holds the festival every February.","망통이라는 프랑스 마을은 매년 2월에 축제를 연다."],[5,"People use lemons and oranges to decorate buildings and make parade floats.","사람들은 건물을 장식하고 퍼레이드 장식 차량을 만들기 위해 레몬과 오렌지를 사용한다."],[6,"The event uses over 140 tons of fruit.","그 행사는 140톤이 넘는 과일을 사용한다."],[8,"The festival runs for 20 days.","축제는 20일 동안 계속된다."]],"w":"6번 문장에서 행사는 140톤이 넘는 과일을 사용한다고 해요. 축제는 7월이 아니라 2월에 열리고(2번), 레몬만이 아니라 레몬과 오렌지를 쓰며(5번), 20일 동안 계속돼요(8번).","c":3},"h":"29b3c13900"},{"n":9,"t":"sum","q":"The Menton Lemon Festival has a different (A) every year, and people (B) buildings with lemons and oranges.","ko":"망통 레몬 축제는 매년 다른 (A)를 가지고, 사람들은 레몬과 오렌지로 건물을 (B).","oko":["(A) 주제 / (B) 팔다","(A) 달 / (B) 장식하다","(A) 주제 / (B) 분류하다","(A) 가격 / (B) 먹다","(A) 주제 / (B) 장식하다"],"opts":["(A) theme / (B) sell","(A) month / (B) decorate","(A) theme / (B) sort","(A) price / (B) eat","(A) theme / (B) decorate"],"r":{"a":"5) (A) theme / (B) decorate","ev":"3번, 5번 문장","s":[[3,"Each year, it has a different theme.","매년, 그것은 다른 주제를 가진다."],[5,"People use lemons and oranges to decorate buildings and make parade floats.","사람들은 건물을 장식하고 퍼레이드 장식 차량을 만들기 위해 레몬과 오렌지를 사용한다."]],"w":"3번에서 매년 다른 주제(theme)를 가진다고 하고, 5번에서 레몬과 오렌지로 건물을 장식한다(decorate)고 해요. 월(month)은 매년 2월로 같아요(2번).","c":5},"h":"7cc663efd3"},{"n":10,"t":"fill","q":"When the festival ends, people [A] the lemons and oranges to find the ones to [B].","ko":"축제가 끝나면, 사람들은 [B]할 것들을 찾기 위해 레몬과 오렌지를 [A]한다.","bank":["sort","sell","theme","festival","creation","fruit"],"bko":{"sort":"분류하다","sell":"팔다","theme":"주제","festival":"축제","creation":"창작품","fruit":"과일"},"r":{"a":"[A] sort, [B] sell","ev":"9~10번 문장","s":[[9,"When it ends, people sort the lemons and oranges.","그것이 끝나면, 사람들은 레몬과 오렌지를 분류한다."],[10,"They do this to find the ones to sell.","그들은 팔 것들을 찾기 위해 이것을 한다."]],"w":"9번 When it ends, people sort the lemons and oranges, 10번 to find the ones to sell에서 가져왔어요. theme(주제), festival(축제), creation(창작품), fruit(과일)은 명사라서 동사가 들어갈 자리에 맞지 않아요.","c":null},"h":"99544567f0"}]},{"u":7,"id":"hs2-07-3","no":3,"ko":"힘을 합쳐요!","items":[{"n":1,"t":"tf","q":"UI stands for User Interface.","ko":"UI는 사용자 인터페이스를 의미한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"UI stands for User Interface.","UI는 사용자 인터페이스를 의미한다."]],"w":"5번 문장에 UI stands for User Interface가 그대로 있어요. UI는 사용자 인터페이스라는 뜻이에요.","c":"T"},"h":"564435c9d8"},{"n":2,"t":"tf","q":"UX designers work on the colors and images of an app.","ko":"UX 디자이너들은 앱의 색상과 이미지를 작업한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번, 8번 문장","s":[[6,"UI designers work on the visual details of an app, like its colors and images.","UI 디자이너들은 색상과 이미지와 같은 앱의 시각적인 세부 사항들을 작업한다."],[8,"UX designers make the app’s functions easy to use.","UX 디자이너들은 앱의 기능들을 사용하기 쉽게 만든다."]],"w":"색상과 이미지 같은 시각적인 세부 사항은 UI 디자이너들이 작업해요(6번). UX 디자이너들은 앱의 기능들을 사용하기 쉽게 만들어요(8번).","c":"F"},"h":"152cab7709"},{"n":3,"t":"tf","q":"In a shopping app, a clear menu helps users find the items quickly.","ko":"쇼핑 앱에서, 알아보기 쉬운 메뉴는 사용자가 물품들을 빠르게 찾을 수 있도록 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"For example, in a shopping app, a clear menu helps users find the items quickly.","예를 들어, 쇼핑 앱에서, 알아보기 쉬운 메뉴는 사용자가 물품들을 빠르게 찾을 수 있도록 돕는다."]],"w":"9번 문장 For example, in a shopping app, a clear menu helps users find the items quickly와 같은 내용이에요.","c":"T"},"h":"bbb68677ad"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For example, in a shopping app, a clear menu helps users find the items quickly.)","ko":"밑줄 친 단어의 뜻은? (예를 들어, 쇼핑 앱에서, ... 메뉴는 사용자가 물품들을 빠르게 찾을 수 있도록 돕는다.)","opts":["시끄러운","알아보기 쉬운","비싼","어려운"],"word":"clear","r":{"a":"2) 알아보기 쉬운","ev":"9번 문장","s":[[9,"For example, in a shopping app, a clear menu helps users find the items quickly.","예를 들어, 쇼핑 앱에서, 알아보기 쉬운 메뉴는 사용자가 물품들을 빠르게 찾을 수 있도록 돕는다."]],"w":"메뉴가 사용자가 물품을 빠르게 찾도록 도와준다는 내용이에요. 그래서 clear는 알아보기 쉬운, 분명한이라는 뜻이 알맞아요.","c":2},"h":"1c4dc88a9f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (UI designers work on the visual details of an app, like its colors and images.)","ko":"밑줄 친 단어의 뜻은? (UI 디자이너들은 색상과 이미지와 같은 앱의 ... 세부 사항들을 작업한다.)","opts":["소리의","재미있는","시각적인","오래된"],"word":"visual","r":{"a":"3) 시각적인","ev":"6번 문장","s":[[6,"UI designers work on the visual details of an app, like its colors and images.","UI 디자이너들은 색상과 이미지와 같은 앱의 시각적인 세부 사항들을 작업한다."]],"w":"like its colors and images(색상과 이미지와 같은)가 visual details의 예예요. 색상과 이미지는 눈으로 보는 것이라서 visual은 시각적인이에요.","c":3},"h":"8fb06ed7a3"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is because a great app should look good and be easy to use.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 훌륭한 앱은 보기 좋고 사용하기 쉬워야 하기 때문이다.","opts":["앱이 사랑받는 것","UI 디자이너가 색상을 고르는 것","쇼핑 앱에 메뉴가 있는 것","UI와 UX 디자이너가 협력자로서 일해야 한다는 것"],"r":{"a":"4) UI와 UX 디자이너가 협력자로서 일해야 한다는 것","ev":"10~11번 문장","s":[[10,"UI and UX designers should work as partners.","UI와 UX 디자이너는 협력자로서 일해야 한다."],[11,"This is because a great app should look good and be easy to use.","이것은 훌륭한 앱은 보기 좋고 사용하기 쉬워야 하기 때문이다."]],"w":"This is because ~는 바로 앞 10번 내용의 이유를 말해요. 그래서 This는 UI와 UX 디자이너가 협력자로서 일해야 한다는 것이에요.","c":4},"h":"93f0f59076"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"An app will not be loved without both of them!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"앱은 그들 둘 다 없이는 사랑받지 않을 것이다!","opts":["앱은 그 둘 모두 없이는 사랑받지 못할 것이다.","앱은 그 둘 중 하나만 있어도 사랑받는다.","앱은 그 둘 모두 있어도 사랑받지 못할 것이다.","앱이 사랑받으면 그 둘은 필요 없어진다."],"r":{"a":"1) 앱은 그 둘 모두 없이는 사랑받지 못할 것이다.","ev":"12번 문장","s":[[12,"An app will not be loved without both of them!","앱은 그들 둘 다 없이는 사랑받지 않을 것이다!"]],"w":"will not be loved는 사랑받지 못할 것이다, without both of them은 그 둘 모두 없이는이라는 뜻이에요. 둘 다 필요하다는 10~11번 내용과 이어져요.","c":1},"h":"1254b145c3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["앱의 아이콘들이 지루해 보인다.","UI 디자이너들이 앱의 기능들을 사용하기 쉽게 만든다.","앱에서 검색하는 것은 빠르고 간단하다.","당신은 물건을 사려고 앱을 사용하고 있다."],"opts":["The icons of the app look boring.","UI designers make the app’s functions easy to use.","Searching in the app is quick and simple.","You are using the app to buy things."],"r":{"a":"3) Searching in the app is quick and simple.","ev":"1~3번 문장","s":[[1,"You’re using an app to do research for your homework.","당신은 숙제를 위한 조사를 하기 위해 앱을 사용하고 있다."],[2,"The icons look so cute.","아이콘들이 매우 귀여워 보인다."],[3,"And searching is quick and simple.","그리고 검색하는 것은 빠르고 간단하다."]],"w":"3번 문장에서 검색하는 것이 빠르고 간단하다고 해요. 아이콘은 귀엽게 보이고(2번), 숙제를 위해 조사하는 중이며(1번), 기능을 쉽게 만드는 일은 UX 디자이너가 해요(8번).","c":3},"h":"4a7c7f42bc"},{"n":9,"t":"sum","q":"UI designers work on the (A) details of an app, and UX designers make its functions (B) to use.","ko":"UI 디자이너들은 앱의 (A) 세부 사항을 작업하고, UX 디자이너들은 앱의 기능들을 사용하기 (B) 만든다.","oko":["(A) 시각적인 / (B) 어려운","(A) 소리의 / (B) 쉬운","(A) 웃기는 / (B) 쉬운","(A) 오래된 / (B) 어려운","(A) 시각적인 / (B) 쉬운"],"opts":["(A) visual / (B) hard","(A) sound / (B) easy","(A) funny / (B) easy","(A) old / (B) hard","(A) visual / (B) easy"],"r":{"a":"5) (A) visual / (B) easy","ev":"6번, 8번 문장","s":[[6,"UI designers work on the visual details of an app, like its colors and images.","UI 디자이너들은 색상과 이미지와 같은 앱의 시각적인 세부 사항들을 작업한다."],[8,"UX designers make the app’s functions easy to use.","UX 디자이너들은 앱의 기능들을 사용하기 쉽게 만든다."]],"w":"6번에서 UI 디자이너는 시각적인(visual) 세부 사항을 작업하고, 8번에서 UX 디자이너는 기능들을 사용하기 쉽게(easy) 만들어요.","c":5},"h":"599364c1df"},{"n":10,"t":"fill","q":"UI and UX designers should [A] as [B].","ko":"UI와 UX 디자이너는 [B]로서 [A]해야 한다.","bank":["work","partners","icons","menu","colors","items"],"bko":{"work":"일하다","partners":"협력자들","icons":"아이콘들","menu":"메뉴","colors":"색상들","items":"물품들"},"r":{"a":"[A] work, [B] partners","ev":"10번 문장","s":[[10,"UI and UX designers should work as partners.","UI와 UX 디자이너는 협력자로서 일해야 한다."]],"w":"10번 UI and UX designers should work as partners에서 가져왔어요. should 뒤에는 동사 work가 오고, as 뒤에는 '~으로서'에 맞는 명사 partners가 와요. icons, menu, colors, items는 이 문장의 뜻에 맞지 않아요.","c":null},"h":"20d929b782"}]},{"u":8,"id":"hs2-08-1","no":1,"ko":"꽈당! 푸하하!","items":[{"n":1,"t":"tf","q":"In the cartoon Tom and Jerry, Tom steps on a rake.","ko":"만화 <톰과 제리>에서 톰은 갈퀴를 밟는다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In the cartoon Tom and Jerry, Tom steps on a rake.","만화 <톰과 제리>에서, 톰은 갈퀴를 밟는다."]],"w":"1번 문장에 Tom steps on a rake가 그대로 있어요. 톰이 갈퀴를 밟는다는 내용과 일치해요.","c":"T"},"h":"fab4fe3e63"},{"n":2,"t":"tf","q":"Actors in slapstick comedy talk a lot to make people laugh.","ko":"슬랩스틱 코미디의 배우들은 사람들을 웃기려고 말을 많이 한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Actors don’t talk.","배우들은 말을 하지 않는다."]],"w":"6번 문장에서 배우들은 말을 하지 않는다(Actors don't talk)고 해요. 말을 많이 한다는 것은 반대예요.","c":"F"},"h":"d13bdf2557"},{"n":3,"t":"tf","q":"The monkeys help Charlie Chaplin keep his balance on the rope.","ko":"원숭이들은 찰리 채플린이 줄 위에서 균형을 유지하도록 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"12~13번 문장","s":[[12,"They climb all over his body.","그것들은 그의 온몸을 기어오른다."],[13,"He struggles to keep his balance.","그는 그의 균형을 유지하기 위해 애쓴다."]],"w":"12번에서 원숭이들은 채플린의 온몸을 기어올라요. 그래서 13번에서 채플린은 균형을 유지하려고 애쓰는 거예요. 원숭이들이 돕는다는 말은 본문에 없어요.","c":"F"},"h":"ddb167d86a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He struggles to keep his balance.)","ko":"그는 그의 균형을 유지하기 위해 애쓴다.","opts":["포기한다","즐긴다","애쓴다","도와준다"],"word":"struggles","r":{"a":"3) 애쓴다","ev":"13번 문장","s":[[13,"He struggles to keep his balance.","그는 그의 균형을 유지하기 위해 애쓴다."]],"w":"원숭이들이 온몸을 기어오르는 상황(12번)에서 균형을 유지하기 위해 힘쓰는 거예요. struggle = 애쓰다.","c":3},"h":"0c6765dcf7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (And the monkeys remove his pants!)","ko":"그리고 원숭이들은 그의 바지를 벗긴다!","opts":["입힌다","벗긴다","빌린다","씻는다"],"word":"remove","r":{"a":"2) 벗긴다","ev":"14번 문장","s":[[14,"And the monkeys remove his pants!","그리고 원숭이들은 그의 바지를 벗긴다!"]],"w":"원숭이들이 바지를 벗겨서 모두가 웃음을 멈추지 못해요(15번). remove his pants = 그의 바지를 벗기다.","c":2},"h":"0b3ca32c65"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey climb all over his body.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 그의 온몸을 기어오른다.","opts":["찰리 채플린","관객들","서커스 단원들","원숭이들"],"r":{"a":"4) 원숭이들","ev":"11~12번 문장","s":[[11,"A bunch of monkeys join him on the rope.","많은 struggles","(A) scary / (B) enjoys","(A) boring / (B) falls"],"r":{"a":"3) (A) physical / (B) struggles","ev":"6~7번, 12~13번 문장","s":[[6,"Actors don’t talk.","배우들은 말을 하지 않는다."],[7,"They make humorous faces and use dramatic actions.","그들은 재미있는 표정을 짓고 과장된 동작을 사용한다."],[12,"They climb all over his body.","그것들은 그의 온몸을 기어오른다."],[13,"He struggles to keep his balance.","그는 그의 균형을 유지하기 위해 애쓴다."]],"w":"배우들은 말을 하지 않고(6번) 신체적인 동작을 써요(7번에서 재미있는 표정과 과장된 동작). 채플린은 원숭이들이 기어오르는 동안(12번) 균형을 유지하려고 애써요(13번).","c":3},"h":"b628584d02"},{"n":10,"t":"fill","q":"The monkeys [A] Charlie Chaplin's pants, and we can't [B] laughing.","ko":"원숭이들은 찰리 채플린의 바지를 [A], 우리는 웃는 것을 [B] 수가 없다.","bank":["remove","stop","join","climb","talk","fall"],"bko":{"remove":"벗기다","stop":"멈추다","join":"합류하다","climb":"기어오르다","fall":"넘어지다","talk":"말하다"},"r":{"a":"[A] remove, [B] stop","ev":"14~15번 문장","s":[[14,"And the monkeys remove his pants!","그리고 원숭이들은 그의 바지를 벗긴다!"],[15,"We can’t stop laughing!","우리는 웃는 것을 멈출 수가 없다!"]],"w":"14번 the monkeys remove his pants, 15번 We can't stop laughing에서 가져왔어요. join, climb은 11~12번 원숭이의 행동이지만 바지와는 이어지지 않아요.","c":null},"h":"06f50f820e"}]},{"u":8,"id":"hs2-08-2","no":2,"ko":"황금알을 낳는 거위","items":[{"n":1,"t":"tf","q":"The paper microscope was used to find harmful bacteria in drinking water.","ko":"종이 현미경은 식수에서 해로운 박테리아를 찾는 데 사용되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"It was even used to find harmful bacteria in drinking water.","그것은 심지어 식수에서 해로운 박테리아를 찾기 위해 사용되었다."]],"w":"10번 문장에 종이 현미경이 식수에서 해로운 박테리아를 찾는 데 쓰였다는 말이 그대로 있어요.","c":"T"},"h":"1e737f4e1c"},{"n":2,"t":"tf","q":"A paper microscope is heavy and costs a lot to make.","ko":"종이 현미경은 무겁고 만드는 데 많은 돈이 든다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"A paper microscope costs only $1 to make and is very light.","종이현미경은 만드는 데 겨우 1달러가 들고 아주 가볍다."]],"w":"9번 문장에서 종이 현미경은 만드는 데 겨우 1달러가 들고 아주 가볍다고 해요. 무겁고 비싼 것은 보통의 현미경이에요(6번).","c":"F"},"h":"7f5c81b61e"},{"n":3,"t":"tf","q":"The goose in the story looked golden on the outside.","ko":"이야기 속 거위는 겉으로 황금색으로 보였다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"The goose seemed normal from the outside, but it laid golden eggs!","그 거위는 겉으로는 평범해 보였지만, 그것은 황금알을 낳았다!"]],"w":"13번 문장에서 거위는 겉으로는 평범해 보였지만(seemed normal) 황금알을 낳았어요. 거위가 황금색으로 보인 것이 아니에요.","c":"F"},"h":"7041c80a58"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 2022, the inventors of a paper microscope won the award.)","ko":"2022년에 종이 현미경의 발명가들이 그 상을 탔다.","opts":["수리공들","판매원들","발명가들","관객들"],"word":"inventors","r":{"a":"3) 발명가들","ev":"3번 문장","s":[[3,"In 2022, the inventors of a paper microscope won the award.","2022년에, 종이 현미경의 발명가들이 그 상을 탔다."]],"w":"종이 현미경을 만들어 낸 사람들이 상을 탔어요. 6~8번에서 대학 연구자들이 종이 현미경을 만들었으니 inventor = 발명가예요.","c":3},"h":"be0c877100"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It might sound silly.)","ko":"그것은 우스꽝스럽게 들릴 수도 있다.","opts":["위험한","우스꽝스러운","당연한","슬픈"],"word":"silly","r":{"a":"2) 우스꽝스러운","ev":"3~5번 문장","s":[[3,"In 2022, the inventors of a paper microscope won the award.","2022년에, 종이 현미경의 발명가들이 그 상을 탔다."],[4,"Wait, what?","잠깐, 뭐라고?"],[5,"It might sound silly.","그것은 우스꽝스럽게 들릴 수도 있다."]],"w":"종이로 만든 현미경이 상을 탔다고 하니 '잠깐, 뭐라고?'(4번) 하고 놀라게 돼요. 그래서 그런 말이 우스꽝스럽게(silly) 들릴 수 있다는 거예요.","c":2},"h":"b76724a425"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey saw that even technicians had a hard time using them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그들은 기술자들조차 그것들을 사용하는 데 어려움을 겪는 것을 보았다.","opts":["보통의 현미경들","두 명의 대학 연구자","기술자들","박테리아들"],"r":{"a":"1) 보통의 현미경들","ev":"6~7번 문장","s":[[6,"But two university researchers thought normal microscopes were too heavy and expensive.","하지만 두 명의 대학 연구자는 보통의 현미경은 너무 무겁고 비싸다고 생각했다."],[7,"They saw that even technicians had a hard time using them.","그들은 기술자들조차 그것들을 사용하는 데어려움을 겪는 것을 보았다."]],"w":"6번에서 보통의 현미경이 무겁고 비싸다고 했고, 7번에서 기술자들조차 그것들(them)을 쓰기 어려워했어요. 기술자들은 쓰는 사람이고, them은 쓰이는 물건이에요.","c":1},"h":"00fb296c36"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is given for research that may seem unimportant but actually is helpful.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 중요하지 않아 보일 수도 있지만 실제로는 유용한 연구에 수여된다.","opts":["그 상은 중요해 보이는 연구에만 수여된다.","그 상은 유용하지만 비싼 연구에 수여된다.","그 상은 중요하지 않아 보여서 아무에게도 수여되지 않는다.","그 상은 중요하지 않아 보여도 실제로는 유용한 연구에 수여된다."],"r":{"a":"4) 그 상은 중요하지 않아 보여도 실제로는 유용한 연구에 수여된다.","ev":"2번 문장","s":[[2,"It is given for research that may seem unimportant but actually is helpful.","그것은 중요하지 않아 보일 수도 있지만 실제로는 유용한 연구에 수여된다."]],"w":"that 이하가 research를 꾸며 줘요. may seem unimportant but actually is helpful은 '중요하지 않아 보여도 실제로는 유용한'이라는 뜻이에요.","c":4},"h":"747f00e155"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["연구자들은 보통의 현미경이 너무 가볍고 싸다고 생각했다.","그 상은 특별한 알을 낳는 거위 이야기에서 이름을 얻었다.","기술자들은 보통의 현미경을 쉽게 사용했다.","그 상은 모두가 중요하다고 생각하는 연구에 수여된다."],"opts":["The researchers thought normal microscopes were too light and cheap.","The award got its name from a story of a goose that lays special eggs.","Technicians found it easy to use normal microscopes.","The award is given for research that everyone thinks is important."],"r":{"a":"2) The award got its name from a story of a goose that lays special eggs.","ev":"12번 문장","s":[[12,"The award got its name from a story of a goose that lays special eggs.","그 상은 특별한 알을 낳는한 거위의 이야기에서 이름을 얻었다."]],"w":"12번에서 상의 이름이 특별한 알을 낳는 거위 이야기에서 나왔다고 해요. 보통의 현미경은 무겁고 비싸고(6번), 기술자들은 쓰기 어려워했고(7번), 상은 중요하지 않아 보이는 연구에 주어져요(2번).","c":2},"h":"485356e17e"},{"n":9,"t":"sum","q":"The Golden Goose Award is given to research that seems (A) but is actually helpful. A paper microscope is an example because it is (B) to make and very light.","ko":"황금거위상은 (A) 보이지만 실제로는 유용한 연구에 수여된다. 종이 현미경은 만드는 데 (B) 아주 가볍기 때문에 그 예이다.","oko":["(A) 중요하지 않아 / (B) 비싸고","(A) 중요해 / (B) 싸고","(A) 위험해 / (B) 무겁고","(A) 중요하지 않아 / (B) 싸고","(A) 중요해 / (B) 무겁고"],"opts":["(A) unimportant / (B) expensive","(A) important / (B) cheap","(A) dangerous / (B) heavy","(A) unimportant / (B) cheap","(A) important / (B) heavy"],"r":{"a":"4) (A) unimportant / (B) cheap","ev":"2번, 9번 문장","s":[[2,"It is given for research that may seem unimportant but actually is helpful.","그것은 중요하지 않아 보일 수도 있지만 실제로는 유용한 연구에 수여된다."],[9,"A paper microscope costs only $1 to make and is very light.","종이현미경은 만드는 데 겨우 1달러가 들고 아주 가볍다."]],"w":"2번에서 중요하지 않아 보여도(unimportant) 유용한 연구에 주는 상이에요. 9번에서 종이 현미경은 만드는 데 겨우 1달러(cheap)이고 아주 가벼워요.","c":4},"h":"e3464a7c8f"},{"n":10,"t":"fill","q":"Researchers thought normal microscopes were too [A] and expensive, so they made one with [B].","ko":"연구자들은 보통의 현미경이 너무 [A] 비싸다고 생각해서 [B]로 현미경을 만들었다.","bank":["heavy","paper","light","cheap","water","golden"],"bko":{"heavy":"무거운","paper":"종이","cheap":"싼","water":"물","golden":"황금의","light":"가벼운"},"r":{"a":"[A] heavy, [B] paper","ev":"6~8번 문장","s":[[6,"But two university researchers thought normal microscopes were too heavy and expensive.","하지만 두 명의 대학 연구자는 보통의 현미경은 너무 무겁고 비싸다고 생각했다."],[7,"They saw that even technicians had a hard time using them.","그들은 기술자들조차 그것들을 사용하는 데어려움을 겪는 것을 보았다."],[8,"So they made a microscope with paper.","그래서 그들은 종이로 현미경을 만들었다."]],"w":"6번 normal microscopes were too heavy and expensive, 8번 they made a microscope with paper에서 가져왔어요. light는 6번에서 보통의 현미경이 무겁다고 한 것과 반대이고, cheap은 expensive와 반대 뜻이라 어울리지 않아요.","c":null},"h":"cd52f782e7"}]},{"u":8,"id":"hs2-08-3","no":3,"ko":"어어, 계속 움직이네?","items":[{"n":1,"t":"tf","q":"Slinky Dog in Toy Story came from a real-life toy.","ko":"<토이 스토리>의 슬링키 도그는 실제 장난감에서 유래했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"Do you know the character Slinky Dog from the movie Toy Story?","영화 <토이 스토리>에 나오는 캐릭터 슬링키 도그를 아는가?"],[2,"Well, he came from a real-life toy!","자, 그는 실제 장난감에서 유래했다!"]],"w":"1번에서 영화 <토이 스토리>의 슬링키 도그를 말하고, 2번에서 he came from a real-life toy라고 해요. 실제 장난감에서 왔다는 내용과 일치해요.","c":"T"},"h":"539f4cdd3e"},{"n":2,"t":"tf","q":"The spring fell to the floor and stopped moving.","ko":"스프링은 바닥에 떨어져서 움직임을 멈췄다.","r":{"a":"F (본문과 다른 내용)","ev":"5~7번 문장","s":[[5,"The spring did not just fall to the floor.","스프링은 그저 바닥으로 떨어지기만 하지 않았다."],[6,"It flipped over and over.","그것은 뒤집히고 또 뒤집혔다."],[7,"And it kept moving.","그리고 그것은 계속해서 움직였다."]],"w":"5번에서 스프링은 그냥 바닥으로 떨어지기만 하지 않았고, 6~7번에서 뒤집히고 또 뒤집히며 계속 움직였어요. 멈췄다는 것은 반대예요.","c":"F"},"h":"1c1c6bbdfa"},{"n":3,"t":"tf","q":"The Slinky was not popular with children.","ko":"슬링키는 아이들에게 인기가 없었다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"This invention became a big hit with children.","이 발명품은 아이들에게 큰 인기 상품이 되었다."]],"w":"12번 문장에서 이 발명품은 아이들에게 큰 인기 상품(big hit)이 되었다고 해요. 인기가 없었다는 것은 반대예요.","c":"F"},"h":"5b3bcdb429"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Richard James accidentally dropped a long spring.)","ko":"Richard James는 우연히 긴 스프링을 떨어뜨렸다.","opts":["일부러","우연히","천천히","조용히"],"word":"accidentally","r":{"a":"2) 우연히","ev":"3~4번 문장","s":[[3,"In 1943, engineer Richard James accidentally dropped a long spring.","1943년에, 엔지니어 RichardJames는 우연히 긴 스프링을 떨어뜨렸다."],[4,"He couldn’t believe his eyes!","그는 그의 눈을 믿을 수 없었다!"]],"w":"스프링이 떨어지는 모습을 보고 James는 눈을 믿을 수 없을 만큼 놀랐어요(4번). 계획한 일이 아니라 우연히 일어난 일이에요.","c":2},"h":"76fc8e3515"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (She suggested the name Slinky.)","ko":"그녀는 슬링키라는 이름을 제안했다.","opts":["거절했다","숨겼다","잊었다","제안했다"],"word":"suggested","r":{"a":"4) 제안했다","ev":"11번 문장","s":[[11,"She suggested the name Slinky because this word means “to move in a graceful way.”","그녀는 슬링키라는 이름을 제안했는데 이 단어가 ‘우아하게 움직이는’이라는 뜻이기 때문이다."]],"w":"James가 장난감 생각을 말하자(10번) 아내가 이름을 슬링키로 하자고 의견을 냈어요. suggest = 제안하다.","c":4},"h":"f16d7308c5"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAnd it kept moving.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그리고 그것은 계속해서 움직였다.","opts":["Richard James","바닥","긴 스프링","슬링키 도그"],"r":{"a":"3) 긴 스프링","ev":"5~7번 문장","s":[[5,"The spring did not just fall to the floor.","스프링은 그저 바닥으로 떨어지기만 하지 않았다."],[6,"It flipped over and over.","그것은 뒤집히고 또 뒤집혔다."],[7,"And it kept moving.","그리고 그것은 계속해서 움직였다."]],"w":"5번의 The spring
