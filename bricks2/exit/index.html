<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>브릭스 중학독해 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"b2-01-1","no":1,"ko":"다리 둘 달린 당근, 먹어도 될까?","items":[{"n":1,"t":"tf","q":"Many people think ugly vegetables are not fresh or tasty because of how they look.","ko":"많은 사람들은 못난이 채소가 생김새 때문에 신선하지 않거나 맛이 없다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Many people think they’re not fresh or tasty because of how they look.","많은 사람들은 생김새 때문에 그것들이 신선하지 않거나 맛이 없다고 생각한다."]],"w":"4번 문장에 Many people think they’re not fresh or tasty because of how they look가 그대로 나옴. 생김새 때문에 맛없다고 생각한다는 내용과 일치.","c":"T"},"h":"5d9177bdac"},{"n":2,"t":"tf","q":"Rotting vegetables help stop climate change.","ko":"썩는 채소는 기후 변화를 막는 데 도움이 된다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"When vegetables rot, they release a greenhouse gas that causes climate change.","채소가 썩을 때, 그것들은 기후 변화를 일으키는 온실가스를 내뿜는다."]],"w":"8번 문장에서 채소가 썩을 때 기후 변화를 일으키는 온실가스를 내뿜는다고 함. 막는 게 아니라 일으키므로 반대 내용.","c":"F"},"h":"599160c3a3"},{"n":3,"t":"tf","q":"Online stores want people to learn that appearance does not change taste or nutrients.","ko":"온라인 상점은 사람들이 겉모습이 맛이나 영양소를 바꾸지 않는다는 것을 알기를 원한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"They want people to try them and see that appearance doesn’t affect taste or nutrients.","그들은 사람들이 그것들을 먹어 보고 겉모습이 맛이나 영양소에 영향을 주지 않는다는 것을 알기를 원한다."]],"w":"10번 문장에서 They want people to try them and see that appearance doesn’t affect taste or nutrients라고 함. 같은 뜻이라 맞는 내용.","c":"T"},"h":"e3e60e871e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When vegetables rot, they release a greenhouse gas that causes climate change.)","ko":"(채소가 썩을 때, 그것들은 기후 변화를 일으키는 온실가스를 ( ).)","opts":["흡수하다","내뿜다","모으다","판매하다"],"word":"release","r":{"a":"2) 내뿜다","ev":"8번 문장","s":[[8,"When vegetables rot, they release a greenhouse gas that causes climate change.","채소가 썩을 때, 그것들은 기후 변화를 일으키는 온실가스를 내뿜는다."]],"w":"8번에서 썩은 채소가 온실가스를 어떻게 한다는 말인지 보면, 기후 변화를 ‘일으키는’ 가스가 밖으로 나오는 것임. release = 내뿜다, 방출하다. 흡수하다는 반대 방향.","c":2},"h":"387d256314"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So stores refuse to sell them, and tons of food go to waste.)","ko":"(그래서 가게들은 그것들을 팔기를 ( )하고, 엄청난 양의 음식이 버려진다.)","opts":["허락하다","서두르다","부탁하다","거부하다"],"word":"refuse","r":{"a":"4) 거부하다","ev":"5번 문장","s":[[5,"So stores refuse to sell them, and tons of food go to waste.","그래서 가게들은 그것들을 팔기를 거부하고, 엄청난 양의 음식이 버려진다."]],"w":"5번에서 가게들이 못난이 채소를 팔지 않아서 음식이 버려짐. refuse to sell = 팔기를 거부하다. 허락하다는 뜻이 반대라 팔았다면 음식이 버려지지 않음.","c":4},"h":"a131eec878"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSo stores refuse to sell them, and tons of food go to waste.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그래서 가게들은 그것들을 팔기를 거부하고, 엄청난 양의 음식이 버려진다.","opts":["가게들","농부들","못난이 채소들","온실가스"],"r":{"a":"3) 못난이 채소들","ev":"3번, 5번 문장","s":[[3,"These are called “ugly” vegetables.","이런 것들은 ‘못난이’ 채소라고 불린다."],[5,"So stores refuse to sell them, and tons of food go to waste.","그래서 가게들은 그것들을 팔기를 거부하고, 엄청난 양의 음식이 버려진다."]],"w":"3번에서 다리 둘 당근, 혹투성이 호박 같은 것들을 ugly vegetables(못난이 채소)라고 부름. 5번의 가게들이 팔기를 거부하는 대상 them이 바로 이 못난이 채소.","c":3},"h":"1372762dc1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This means farmers lose time, money, and valuable crops.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 농부들이 시간, 돈, 그리고 소중한 농작물을 잃는다는 뜻이다.","opts":["농부들이 농작물을 더 많이 얻게 된다는 뜻이다.","가게들이 시간과 돈을 잃게 된다는 뜻이다.","농부들이 시간, 돈, 그리고 소중한 농작물을 잃게 된다는 뜻이다.","농작물이 더 빨리 자라게 된다는 뜻이다."],"r":{"a":"3) 농부들이 시간, 돈, 그리고 소중한 농작물을 잃게 된다는 뜻이다.","ev":"6번 문장","s":[[6,"This means farmers lose time, money, and valuable crops.","이것은 농부들이 시간, 돈, 그리고 소중한 농작물을 잃는다는 뜻이다."]],"w":"This means는 5번의 가게들이 팔기를 거부한 결과를 받음. 잃는 사람은 가게가 아니라 farmers(농부들)이고, lose는 ‘잃다’라서 ‘더 얻는다’는 반대 뜻.","c":3},"h":"b303e966e2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["못난이 채소는 다른 채소보다 맛이 없다.","온라인 상점은 못난이 채소를 더 비싼 가격에 판다.","썩은 채소는 환경을 보호하는 데 도움이 된다.","가게들이 못난이 채소를 팔기를 거부하면 농부들이 손해를 본다."],"opts":["Ugly vegetables taste worse than other vegetables.","Online stores sell ugly vegetables at higher prices.","Rotting vegetables help protect the environment.","Farmers lose money when stores refuse to sell ugly vegetables."],"r":{"a":"4) 가게들이 못난이 채소를 팔기를 거부하면 농부들이 손해를 본다.","ev":"5~6번 문장","s":[[5,"So stores refuse to sell them, and tons of food go to waste.","그래서 가게들은 그것들을 팔기를 거부하고, 엄청난 양의 음식이 버려진다."],[6,"This means farmers lose time, money, and valuable crops.","이것은 농부들이 시간, 돈, 그리고 소중한 농작물을 잃는다는 뜻이다."]],"w":"5번에서 가게들이 팔기를 거부하고, 6번에서 그 결과 농부들이 시간과 돈을 잃는다고 함. ①은 10번과 반대, ②는 9번의 lower prices와 반대, ③은 8번(온실가스를 내뿜음)과 반대.","c":4},"h":"f852c9e798"},{"n":9,"t":"sum","q":"Because stores refuse to sell ugly vegetables, a lot of food is (A), and this (B) the environment.","ko":"가게들이 못난이 채소를 팔기를 거부해서 많은 음식이 (A)되고, 이것은 환경을 (B).","oko":["(A) 절약된다 / (B) 돕는다","(A) 팔린다 / (B) 해친다","(A) 버려진다 / (B) 해친다","(A) 버려진다 / (B) 돕는다","(A) 절약된다 / (B) 해친다"],"opts":["(A) saved / (B) helps","(A) sold / (B) harms","(A) wasted / (B) harms","(A) wasted / (B) helps","(A) saved / (B) harms"],"r":{"a":"3) (A) wasted / (B) harms","ev":"5번, 7번 문장","s":[[5,"So stores refuse to sell them, and tons of food go to waste.","그래서 가게들은 그것들을 팔기를 거부하고, 엄청난 양의 음식이 버려진다."],[7,"This food waste also harms the environment.","이 음식물 낭비는 환경에도 해를 끼친다."]],"w":"5번에서 tons of food go to waste(엄청난 양의 음식이 버려진다), 7번에서 This food waste also harms the environment(이 낭비가 환경을 해친다)라고 함. 그래서 wasted와 harms.","c":3},"h":"9da93a0f37"},{"n":10,"t":"fill","q":"Some online stores sell ugly vegetables at [A] prices so that people can [B] farmers and the environment.","ko":"일부 온라인 상점은 못난이 채소를 [A] 가격에 팔아서 사람들이 농부와 환경을 [B] 수 있게 한다.","bko":{"lower":"더 낮은","support":"돕다","rot":"썩다","tasty":"맛있는","waste":"낭비하다","appearance":"겉모습"},"bank":["lower","support","rot","tasty","waste","appearance"],"r":{"a":"[A] lower, [B] support","ev":"9번, 11번 문장","s":[[9,"To fix these problems, some online stores now sell ugly vegetables at lower prices.","이런 문제들을 해결하기 위해, 일부 온라인 상점은 이제 못난이 채소를 더 낮은 가격에 판다."],[11,"By buying these vegetables, people can support farmers, save money, and help the environment.","이런 채소들을 사면, 사람들은 농부들을 돕고, 돈을 아끼고, 환경을 도울 수 있다."]],"w":"9번에서 온라인 상점이 못난이 채소를 at lower prices(더 낮은 가격에) 팔고, 11번에서 사람들이 이 채소를 사면 support farmers(농부를 돕는다)라고 함. 나머지 단어는 가격이나 ‘돕는다’는 뜻에 맞지 않음.","c":null},"h":"67d2eacee4"}]},{"u":1,"id":"b2-01-2","no":2,"ko":"우유가 치즈로 변한 놀라운 사건","items":[{"n":1,"t":"tf","q":"Everyone knows exactly where cheese first came from.","ko":"모든 사람이 치즈가 처음에 어디에서 왔는지 정확히 안다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Cheese is a food enjoyed worldwide, but no one knows exactly where it first came from.","치즈는 전 세계에서 즐기는 음식이지만, 그것이 처음에 정확히 어디에서 왔는지는 아무도 모른다."]],"w":"1번 문장에서 no one knows exactly where it first came from(아무도 정확히 모른다)이라고 함. 모두가 안다는 말은 반대.","c":"F"},"h":"2471599436"},{"n":2,"t":"tf","q":"According to one story, early nomads found cheese by accident.","ko":"한 이야기에 따르면, 초기 유목민들은 우연히 치즈를 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"One story says that early nomads discovered it by accident.","한 이야기에 따르면 초기 유목민들이 우연히 그것을 발견했다."]],"w":"2번 문장에 One story says that early nomads discovered it by accident가 나옴. found는 discovered와 같은 뜻이라 맞는 내용.","c":"T"},"h":"4eade3c998"},{"n":3,"t":"tf","q":"The heat from the sun probably made the process happen faster.","ko":"태양의 열이 아마 그 과정을 더 빠르게 만들었을 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"And the heat from the sun probably made this process happen faster.","그리고 태양의 열이 아마 이 과정을 더 빠르게 만들었을 것이다."]],"w":"9번 문장에 the heat from the sun probably made this process happen faster가 나옴. 같은 내용이라 맞음.","c":"T"},"h":"7fa9222aaa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The milk was no longer liquid, but thick and soft lumps.)","ko":"(우유는 더 이상 액체가 아니라, 걸쭉하고 부드러운 ( )가 되어 있었다.)","opts":["덩어리","거품","가루","얼음"],"word":"lumps","r":{"a":"1) 덩어리","ev":"5번 문장","s":[[5,"The milk was no longer liquid, but thick and soft lumps.","우유는 더 이상 액체가 아니라, 걸쭉하고 부드러운 덩어리가 되어 있었다."]],"w":"5번에서 우유가 액체가 아니라 thick and soft(걸쭉하고 부드러운) 무엇이 되었다는 말임. lumps = 덩어리. 가루나 거품은 걸쭉하고 부드럽다는 설명과 맞지 않음.","c":1},"h":"e50d305164"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The nomads found that the cheese tasted good and lasted longer than milk.)","ko":"(유목민들은 치즈가 맛이 좋고 우유보다 더 ( )다는 것을 알게 되었다.)","opts":["더 빨리 상했다","더 달았다","더 오래갔다","더 무거웠다"],"word":"lasted","r":{"a":"3) 더 오래갔다","ev":"10번 문장","s":[[10,"The nomads found that the cheese tasted good and lasted longer than milk.","유목민들은 치즈가 맛이 좋고 우유보다 더 오래간다는 것을 알게 되었다."]],"w":"10번은 치즈의 좋은 점을 말하는 문장임. tasted good(맛이 좋았다)과 이어져 lasted longer than milk는 우유보다 더 오래갔다(오래 보관됐다)는 뜻. 더 빨리 상했다는 좋은 점이 아님.","c":3},"h":"b5b2685b1e"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt had turned into cheese!","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 치즈로 변해 있었다!","opts":["동물의 위","우유","유목민들","태양열"],"r":{"a":"2) 우유","ev":"5번, 6번 문장","s":[[5,"The milk was no longer liquid, but thick and soft lumps.","우유는 더 이상 액체가 아니라, 걸쭉하고 부드러운 덩어리가 되어 있었다."],[6,"It had turned into cheese!","그것은 치즈로 변해 있었다!"]],"w":"바로 앞 5번에서 The milk가 더 이상 액체가 아니라 걸쭉한 덩어리가 되었다고 함. 6번의 It은 그 우유가 치즈로 변했다는 뜻.","c":2},"h":"5ef3e81388"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Most likely, the milk changed due to a natural enzyme in the animal stomachs.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아마도 우유는 동물의 위에 들어 있는 천연 효소 때문에 변했을 것이다.","opts":["우유가 변한 이유는 전혀 알 수 없다.","유목민들이 우유에 효소를 일부러 넣었다.","우유가 햇볕 때문에만 변했을 것이다.","동물의 위 속 천연 효소가 우유를 변하게 했을 가능성이 크다."],"r":{"a":"4) 동물의 위 속 천연 효소가 우유를 변하게 했을 가능성이 크다.","ev":"8번 문장","s":[[8,"Most likely, the milk changed due to a natural enzyme in the animal stomachs.","아마도 우유는 동물의 위에 들어 있는 천연 효소 때문에 변했을 것이다."]],"w":"Most likely는 ‘아마도, 가능성이 가장 크다’는 뜻이고 due to는 ‘~ 때문에’. 효소는 동물의 위에 원래 들어 있는 것(natural)이라 유목민들이 넣은 게 아님. 햇볕은 9번에서 과정을 더 빠르게 한 두 번째 이유임.","c":4},"h":"267a04ddd9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["유목민들은 여행하는 동안 일부러 치즈를 만들었다.","우유는 추운 날씨 때문에 치즈로 변했다.","초기 유목민들은 동물의 위로 만든 자루에 우유를 담아 다녔다.","치즈는 우유보다 더 빨리 상했다."],"opts":["The nomads made cheese on purpose during their journey.","The milk turned into cheese because of the cold weather.","Early nomads carried milk in bags made from animal stomachs.","Cheese went bad faster than milk."],"r":{"a":"3) 초기 유목민들은 동물의 위로 만든 자루에 우유를 담아 다녔다.","ev":"3번 문장","s":[[3,"While they traveled under the hot sun, they carried milk in bags made from animal stomachs.","그들은 뜨거운 태양 아래를 이동하는 동안, 동물의 위로 만든 자루에 우유를 담아 가지고 다녔다."]],"w":"3번에서 carried milk in bags made from animal stomachs라고 함. ①은 2번의 by accident(우연히)와 반대, ②는 3번의 hot sun(뜨거운 태양), ④는 10번의 lasted longer than milk와 반대.","c":3},"h":"a429bd5f7a"},{"n":9,"t":"sum","q":"The milk in the bags turned into cheese because of a natural (A) in the animal stomachs and the (B) from the sun.","ko":"자루 속 우유는 동물의 위에 있는 천연 (A)와 태양에서 오는 (B) 때문에 치즈로 변했다.","oko":["(A) 물 / (B) 열","(A) 효소 / (B) 추위","(A) 소금 / (B) 추위","(A) 효소 / (B) 바람","(A) 효소 / (B) 열"],"opts":["(A) water / (B) heat","(A) enzyme / (B) cold","(A) salt / (B) cold","(A) enzyme / (B) wind","(A) enzyme / (B) heat"],"r":{"a":"5) (A) enzyme / (B) heat","ev":"8번, 9번 문장","s":[[8,"Most likely, the milk changed due to a natural enzyme in the animal stomachs.","아마도 우유는 동물의 위에 들어 있는 천연 효소 때문에 변했을 것이다."],[9,"And the heat from the sun probably made this process happen faster.","그리고 태양의 열이 아마 이 과정을 더 빠르게 만들었을 것이다."]],"w":"8번에서 원인 하나는 동물 위 속의 natural enzyme(천연 효소), 9번에서 다른 하나는 the heat from the sun(태양의 열). 둘 다 맞는 것은 (A) enzyme, (B) heat.","c":5},"h":"0b85bc1627"},{"n":10,"t":"fill","q":"People began making cheese on [A] after the lucky [B], and it became one of our favorite foods.","ko":"사람들은 운 좋은 [B] 뒤에 일부러([A]) 치즈를 만들기 시작했고, 그것은 우리가 가장 좋아하는 음식 중 하나가 되었다.","bko":{"purpose":"목적, 의도","discovery":"발견","enzyme":"효소","liquid":"액체","lumps":"덩어리","stomachs":"위"},"bank":["purpose","discovery","enzyme","liquid","lumps","stomachs"],"r":{"a":"[A] purpose, [B] discovery","ev":"11번, 12번 문장","s":[[11,"Soon, people everywhere began making cheese on purpose.","곧, 사람들은 어디서나 일부러 치즈를 만들기 시작했다."],[12,"This lucky discovery gave us one of our favorite foods.","이 운 좋은 발견이 우리에게 가장 좋아하는 음식 중 하나를 주었다."]],"w":"11번에서 people began making cheese on purpose(일부러 만들기 시작했다), 12번에서 This lucky discovery gave us one of our favorite foods라고 함. 나머지 단어는 우유가 변하는 이야기에 쓰인 말이라 이 빈칸 뜻에 맞지 않음.","c":null},"h":"5d99a89fd0"}]},{"u":1,"id":"b2-01-3","no":3,"ko":"동물을 죽이지 않고 만드는 고기","items":[{"n":1,"t":"tf","q":"Scientists make lab-grown meat by killing many animals.","ko":"과학자들은 많은 동물을 죽여서 배양육을 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"There is a way to make meat without killing animals.","동물을 죽이지 않고 고기를 만드는 방법이 있다."]],"w":"1번 문장에서 배양육은 make meat without killing animals(동물을 죽이지 않고 고기를 만드는 방법)라고 함. 많은 동물을 죽인다는 것은 반대 내용.","c":"F"},"h":"063b64f430"},{"n":2,"t":"tf","q":"Lab-grown meat is hard to make in large amounts because the cells need very controlled conditions.","ko":"세포가 매우 통제된 조건을 필요로 하기 때문에 배양육을 대량으로 만들기는 어렵다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"It is also challenging to make large amounts, as the cells need very controlled conditions to grow.","세포가 자라려면 매우 통제된 조건이 필요하기 때문에, 대량으로 만드는 것도 어렵다."]],"w":"11번 문장에 It is also challenging to make large amounts, as the cells need very controlled conditions to grow가 나옴. challenging은 hard와 같은 뜻이라 맞는 내용.","c":"T"},"h":"8d8e01561e"},{"n":3,"t":"tf","q":"The combined muscle pieces are made into products such as burger patties or chicken nuggets.","ko":"합쳐진 근육 조각들은 햄버거 패티나 치킨 너겟 같은 제품으로 만들어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Then, the combined pieces are processed into meat products such as burger patties or chicken nuggets.","그런 다음, 합쳐진 조각들은 햄버거 패티나 치킨 너겟 같은 고기 제품으로 가공된다."]],"w":"7번 문장에 the combined pieces are processed into meat products such as burger patties or chicken nuggets가 나옴. processed into는 ‘~로 가공되다’라서 made into와 같은 뜻.","c":"T"},"h":"423f5ec2d4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is also challenging to make large amounts, as the cells need very controlled conditions to grow.)","ko":"(세포가 자라려면 매우 ( ) 조건이 필요하기 때문에, 대량으로 만드는 것도 어렵다.)","opts":["자유로운","따뜻한","위험한","통제된"],"word":"controlled","r":{"a":"4) 통제된","ev":"11번 문장","s":[[11,"It is also challenging to make large amounts, as the cells need very controlled conditions to grow.","세포가 자라려면 매우 통제된 조건이 필요하기 때문에, 대량으로 만드는 것도 어렵다."]],"w":"11번에서 세포가 자라려면 아주 ‘정해진 대로 맞춰진’ 조건이 필요해서 대량으로 만들기 어렵다고 함. controlled conditions = 통제된(조절된) 조건. 자유로운은 반대 뜻이라 어렵다는 이유가 되지 않음.","c":4},"h":"77f8210c04"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In addition, some people feel uneasy about eating meat grown in a lab.)","ko":"(게다가, 일부 사람들은 실험실에서 키운 고기를 먹는 것을 ( )하게 느낀다.)","opts":["불편한","행복한","자랑스러운","궁금한"],"word":"uneasy","r":{"a":"1) 불편한","ev":"12번 문장","s":[[12,"In addition, some people feel uneasy about eating meat grown in a lab.","게다가, 일부 사람들은 실험실에서 키운 고기를 먹는 것을 꺼림칙하게 느낀다."]],"w":"12번은 In addition(게다가)으로 세 번째 문제를 덧붙이는 문장임. 문제이므로 좋은 감정이 아니라 불편하고 꺼림칙한 마음. uneasy = 불편한. 행복한, 자랑스러운은 문제가 될 수 없음.","c":1},"h":"21101f0b05"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nScientists collect these pieces of muscle and combine them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"과학자들은 이 근육 조각들을 모아서 합친다.","opts":["과학자들","근육 조각들","햄버거 패티","영양분"],"r":{"a":"2) 근육 조각들","ev":"6번 문장","s":[[6,"Scientists collect these pieces of muscle and combine them.","과학자들은 이 근육 조각들을 모아서 합친다."]],"w":"6번에서 과학자들이 모으고(collect) 합치는(combine) 대상이 these pieces of muscle(이 근육 조각들)임. them은 그 근육 조각들. 과학자들은 합치는 주체이고 패티는 7번에서 그 뒤에 만들어짐.","c":2},"h":"9c0d9fcff4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Their efforts could one day make lab-grown meat a common food on our tables.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들의 노력은 언젠가 배양육을 우리 식탁 위의 흔한 음식으로 만들 수도 있다.","opts":["과학자들의 노력은 배양육을 사라지게 만들 것이다.","배양육은 이미 모든 식탁에서 흔한 음식이다.","과학자와 기업들의 노력 덕분에 언젠가 배양육이 흔한 음식이 될 수도 있다.","사람들은 노력하지 않아도 배양육을 곧 먹게 될 것이다."],"r":{"a":"3) 과학자와 기업들의 노력 덕분에 언젠가 배양육이 흔한 음식이 될 수도 있다.","ev":"13~14번 문장","s":[[13,"Even so, many scientists and companies are working to improve the process.","그래도 많은 과학자와 기업들이 그 과정을 개선하려고 노력하고 있다."],[14,"Their efforts could one day make lab-grown meat a common food on our tables.","그들의 노력은 언젠가 배양육을 우리 식탁 위의 흔한 음식으로 만들 수도 있다."]],"w":"Their efforts는 13번의 과학자와 기업들의 노력이고, one day는 ‘언젠가’, could는 ‘~할 수도 있다’. 지금 이미 흔하다는 뜻이 아님.","c":3},"h":"9678072d68"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["과학자들은 동물 전체를 탱크에 넣는다.","배양육은 이미 우리 식탁 위의 흔한 음식이다.","모든 사람이 배양육을 먹는 것을 편안하게 느낀다.","장비와 영양분에 돈이 많이 들어서 배양육 생산은 비싸다."],"opts":["Scientists put whole animals in a tank.","Lab-grown meat is already a common food on our tables.","Everyone feels comfortable about eating lab-grown meat.","Lab-grown meat production is expensive because the equipment and nutrients cost a lot."],"r":{"a":"4) 장비와 영양분에 돈이 많이 들어서 배양육 생산은 비싸다.","ev":"10번 문장","s":[[10,"The production process is expensive because the equipment and nutrients cost a lot.","장비와 영양분에 돈이 많이 들기 때문에 생산 과정은 비싸다."]],"w":"10번에서 The production process is expensive because the equipment and nutrients cost a lot라고 함. ①은 3번의 a few cells(세포 몇 개)와, ②는 14번의 one day(언젠가)와, ③은 12번의 uneasy(불편한)와 어긋남.","c":4},"h":"ac06058fb5"},{"n":9,"t":"sum","q":"Making lab-grown meat costs a lot because of the (A) and nutrients, and some people feel (B) about eating it.","ko":"배양육을 만드는 데는 (A)와 영양분 때문에 돈이 많이 들고, 일부 사람들은 그것을 먹는 것에 대해 (B)고 느낀다.","oko":["(A) 장비 / (B) 자랑스럽다","(A) 동물 / (B) 불편하다","(A) 장비 / (B) 궁금하다","(A) 탱크 / (B) 행복하다","(A) 장비 / (B) 불편하다"],"opts":["(A) equipment / (B) proud","(A) animals / (B) uneasy","(A) equipment / (B) curious","(A) tank / (B) happy","(A) equipment / (B) uneasy"],"r":{"a":"5) (A) equipment / (B) uneasy","ev":"10번, 12번 문장","s":[[10,"The production process is expensive because the equipment and nutrients cost a lot.","장비와 영양분에 돈이 많이 들기 때문에 생산 과정은 비싸다."],[12,"In addition, some people feel uneasy about eating meat grown in a lab.","게다가, 일부 사람들은 실험실에서 키운 고기를 먹는 것을 꺼림칙하게 느낀다."]],"w":"10번에서 the equipment and nutrients cost a lot(장비와 영양분에 돈이 많이 든다), 12번에서 some people feel uneasy about eating meat grown in a lab이라고 함. 그래서 equipment와 uneasy.","c":5},"h":"bf7be68041"},{"n":10,"t":"fill","q":"Scientists take a few [A] from an animal, and after a few weeks the cells become [B].","ko":"과학자들은 동물에게서 [A] 몇 개를 얻고, 몇 주 뒤에 그 세포는 [B]이 된다.","bko":{"cells":"세포","muscle":"근육","nuggets":"너겟","tank":"탱크","equipment":"장비","future":"미래"},"bank":["cells","muscle","nuggets","tank","equipment","future"],"r":{"a":"[A] cells, [B] muscle","ev":"3번, 5번 문장","s":[[3,"Scientists take a few cells from an animal and put them in a special tank.","과학자들은 동물에게서 세포 몇 개를 얻어 특별한 탱크에 넣는다."],[5,"After a few weeks, they become muscle.","몇 주 뒤에 그것들은 근육이 된다."]],"w":"3번에서 Scientists take a few cells from an animal(동물에게서 세포 몇 개를 얻는다), 5번에서 After a few weeks, they become muscle(몇 주 뒤 근육이 된다)이라고 함. nuggets는 7번의 최종 제품이라 세포가 곧바로 되는 것이 아님.","c":null},"h":"5d43621c11"}]},{"u":1,"id":"b2-01-4","no":4,"ko":"샌드위치가 우주 음식을 바꾼 이유","items":[{"n":1,"t":"tf","q":"In 1965, astronaut John Young brought a sandwich to space.","ko":"1965년에 우주비행사 존 영은 샌드위치를 우주로 가져갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In 1965, astronaut John Young brought a sandwich to space.","1965년에 우주비행사 존 영은 샌드위치 하나를 우주로 가져갔다."]],"w":"1번 문장 In 1965, astronaut John Young brought a sandwich to space가 그대로 나옴. 같은 내용이라 맞음.","c":"T"},"h":"5c63780f7a"},{"n":2,"t":"tf","q":"Crumbs sink to the floor in space.","ko":"우주에서 빵 부스러기는 바닥으로 가라앉는다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Without gravity, crumbs float through the air.","중력이 없으면, 빵 부스러기는 공중에 떠다닌다."]],"w":"4번 문장에서 중력이 없으면 crumbs float through the air(공중에 떠다닌다)고 함. 바닥으로 가라앉는다는 것은 반대 내용.","c":"F"},"h":"f71a55339b"},{"n":3,"t":"tf","q":"Salt and pepper are made into liquids and put in small bottles.","ko":"소금과 후추는 액체로 만들어져 작은 병에 담긴다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Salt and pepper are made into liquids and put in small bottles.","소금과 후추는 액체로 만들어져 작은 병에 담긴다."]],"w":"9번 문장에 Salt and pepper are made into liquids and put in small bottles가 그대로 나옴. 같은 내용이라 맞음.","c":"T"},"h":"d42b66f5b2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This incident helped NASA realize the danger of crumbs.)","ko":"(이 ( )은 NASA가 빵 부스러기의 위험을 깨닫는 데 도움이 되었다.)","opts":["실수","사건","발명","휴식"],"word":"incident","r":{"a":"2) 사건","ev":"3번 문장","s":[[3,"This incident helped NASA realize the danger of crumbs.","이 사건은 NASA가 빵 부스러기의 위험을 깨닫는 데 도움이 되었다."]],"w":"3번의 This incident는 바로 앞 1~2번에서 일어난 일(샌드위치를 한 입 먹자 부스러기가 사방으로 날아간 일)을 가리킴. incident = 사건. 발명이나 휴식이 NASA에게 위험을 깨닫게 한 것은 아님.","c":2},"h":"6779806736"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Foods such as rice and pasta are dried and packaged in sealed bags.)","ko":"(쌀과 파스타 같은 음식은 말려서 ( ) 봉지에 포장된다.)","opts":["열린","젖은","밀봉된","무거운"],"word":"sealed","r":{"a":"3) 밀봉된","ev":"7번 문장","s":[[7,"Foods such as rice and pasta are dried and packaged in sealed bags.","쌀과 파스타 같은 음식은 말려서 밀봉된 봉지에 포장된다."]],"w":"7번은 부스러기가 새어 나가지 않게 음식을 포장하는 방법임. sealed bags = 입구를 막아 닫은(밀봉된) 봉지. 열린 봉지라면 부스러기를 막을 수 없음.","c":3},"h":"534dac77bc"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAnd instead of bread, astronauts eat tortillas because they’re soft and don’t make crumbs.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그리고 빵 대신에, 우주비행사들은 부드럽고 부스러기를 만들지 않기 때문에 토르티야를 먹는다.","opts":["빵","우주비행사들","토르티야","빵 부스러기"],"r":{"a":"3) 토르티야","ev":"10번 문장","s":[[10,"And instead of bread, astronauts eat tortillas because they’re soft and don’t make crumbs.","그리고 빵 대신에, 우주비행사들은 부드럽고 부스러기를 만들지 않기 때문에 토르티야를 먹는다."]],"w":"because 뒤의 they’re soft and don’t make crumbs는 우주비행사들이 빵 대신 토르티야를 먹는 이유임. 부드럽고 부스러기를 만들지 않는 것은 tortillas. 빵은 대신 먹지 않는 것이라 아님.","c":3},"h":"19279e132f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why modern space food is made to stay in one piece.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 현대의 우주 음식은 한 덩어리를 유지하도록 만들어진다.","opts":["앞에서 말한 부스러기 문제 때문에 현대의 우주 음식은 한 덩어리로 유지되게 만들어진다.","우주 음식은 맛을 좋게 하려고 한 조각으로 만든다.","현대의 우주 음식은 쉽게 부서지도록 만들어진다.","우주비행사들은 음식을 한 조각만 먹도록 정해져 있다."],"r":{"a":"1) 앞에서 말한 부스러기 문제 때문에 현대의 우주 음식은 한 덩어리로 유지되게 만들어진다.","ev":"3번, 6번 문장","s":[[3,"This incident helped NASA realize the danger of crumbs.","이 사건은 NASA가 빵 부스러기의 위험을 깨닫는 데 도움이 되었다."],[6,"That’s why modern space food is made to stay in one piece.","그래서 현대의 우주 음식은 한 덩어리를 유지하도록 만들어진다."]],"w":"That’s why는 ‘그래서’라는 뜻으로 앞 내용이 이유임. 앞(3~5번)에서 부스러기가 위험하다고 했으므로 부서지지 않게 한 덩어리로 만든 것. 맛이나 먹는 양 이야기는 없음.","c":1},"h":"d3d373d5ff"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["우주비행사들은 빵이 부드러워서 빵을 먹는다.","우주에서 빵 부스러기는 바닥으로 빠르게 떨어진다.","샌드위치는 아무 문제 없이 먹혔다.","존 영이 한 입 베어 물자 빵 부스러기가 사방으로 날아갔다."],"opts":["Astronauts eat bread because it is soft.","Crumbs in space fall quickly to the floor.","The sandwich was eaten without any problem.","Crumbs flew everywhere after John Young took one bite."],"r":{"a":"4) 존 영이 한 입 베어 물자 빵 부스러기가 사방으로 날아갔다.","ev":"2번 문장","s":[[2,"After taking one bite, crumbs flew everywhere.","한 입 베어 물자, 빵 부스러기가 사방으로 날아갔다."]],"w":"2번에서 After taking one bite, crumbs flew everywhere라고 함. ①은 10번에서 빵 대신 토르티야를 먹는다는 내용과 반대, ②는 4번에서 공중에 떠다닌다는 내용과 반대, ③은 문제가 생겨 NASA가 위험을 깨달았다는 3번과 반대.","c":4},"h":"6631a89099"},{"n":9,"t":"sum","q":"The sandwich incident helped NASA realize that crumbs can cause (A) problems by getting into (B).","ko":"샌드위치 사건은 NASA가 빵 부스러기가 (B)에 들어가 (A) 문제를 일으킬 수 있다는 것을 깨닫는 데 도움이 되었다.","oko":["(A) 재미있는 / (B) 기계","(A) 심각한 / (B) 기계","(A) 심각한 / (B) 빵","(A) 작은 / (B) 병","(A) 재미있는 / (B) 물"],"opts":["(A) funny / (B) machines","(A) serious / (B) machines","(A) serious / (B) bread","(A) small / (B) bottles","(A) funny / (B) water"],"r":{"a":"2) (A) serious / (B) machines","ev":"3번, 5번 문장","s":[[3,"This incident helped NASA realize the danger of crumbs.","이 사건은 NASA가 빵 부스러기의 위험을 깨닫는 데 도움이 되었다."],[5,"These tiny pieces can get into machines or an astronaut’s nose and cause serious problems.","이 작은 조각들은 기계나 우주비행사의 코 안으로 들어가 심각한 문제를 일으킬 수 있다."]],"w":"3번에서 사건이 NASA가 danger of crumbs(부스러기의 위험)를 깨닫게 했고, 5번에서 부스러기가 machines or an astronaut’s nose에 들어가 serious problems(심각한 문제)를 일으킬 수 있다고 함.","c":2},"h":"08e90a461e"},{"n":10,"t":"fill","q":"Rice and pasta are [A] and packaged in sealed bags, and astronauts add [B] to them before eating.","ko":"쌀과 파스타는 [A] 밀봉된 봉지에 포장되고, 우주비행사들은 먹기 전에 거기에 [B]을 넣는다.","bko":{"dried":"말린","water":"물","gravity":"중력","bottles":"병","nose":"코","sandwich":"샌드위치"},"bank":["dried","water","gravity","bottles","nose","sandwich"],"r":{"a":"[A] dried, [B] water","ev":"7번, 8번 문장","s":[[7,"Foods such as rice and pasta are dried and packaged in sealed bags.","쌀과 파스타 같은 음식은 말려서 밀봉된 봉지에 포장된다."],[8,"Astronauts add water to them before eating.","우주비행사들은 먹기 전에 거기에 물을 넣는다."]],"w":"7번에서 rice and pasta are dried and packaged in sealed bags(말려서 포장된다), 8번에서 Astronauts add water to them before eating(먹기 전에 물을 넣는다)이라고 함. 나머지 단어는 이 빈칸 문장의 뜻에 맞지 않음.","c":null},"h":"279aad567d"}]},{"u":2,"id":"b2-02-1","no":1,"ko":"중국이 판다를 다른 나라에 보내는 이유","items":[{"n":1,"t":"tf","q":"Pandas are rare and live only in China.","ko":"판다는 희귀하고 중국에서만 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Pandas are rare and live only in China.","판다는 희귀하고 중국에서만 산다."]],"w":"2번 문장 Pandas are rare and live only in China가 그대로 나옴. 같은 내용이라 맞음.","c":"T"},"h":"4d91171c2e"},{"n":2,"t":"tf","q":"Pandas take a long time to win people’s hearts in a new country.","ko":"판다는 새로운 나라에서 사람들의 마음을 얻는 데 오랜 시간이 걸린다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"When pandas arrive in a new country, they quickly win people’s hearts.","판다가 새로운 나라에 도착하면, 그들은 금세 사람들의 마음을 얻는다."]],"w":"5번 문장에서 they quickly win people’s hearts(금세 마음을 얻는다)라고 함. 오랜 시간이 걸린다는 것은 반대 내용.","c":"F"},"h":"05e3c9dc45"},{"n":3,"t":"tf","q":"Learning about pandas can also help people learn about China and its culture.","ko":"판다에 대해 배우는 것은 사람들이 중국과 그 문화에 대해 배우는 데도 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"As people learn more about pandas, they can also learn more about China and its culture.","사람들은 판다에 대해 더 많이 알게 되면서, 중국과 그 문화에 대해서도 더 많이 알게 될 수 있다."]],"w":"7번 문장에 As people learn more about pandas, they can also learn more about China and its culture가 나옴. 같은 내용이라 맞음.","c":"T"},"h":"646c57ca8b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Pandas are rare and live only in China.)","ko":"(판다는 ( )하고 중국에서만 산다.)","opts":["흔한","드문","큰","위험한"],"word":"rare","r":{"a":"2) 드문","ev":"2번 문장","s":[[2,"Pandas are rare and live only in China.","판다는 희귀하고 중국에서만 산다."]],"w":"2번에서 판다는 중국에서만 산다고 함. 다른 곳에는 거의 없으니 ‘드물다’는 뜻이 맞음. rare = 드문, 희귀한. 흔한은 반대 뜻.","c":2},"h":"c20c502c5c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Many people fall in love with these gentle animals.)","ko":"(많은 사람들이 이 ( ) 동물들과 사랑에 빠진다.)","opts":["사나운","빠른","무거운","온순한"],"word":"gentle","r":{"a":"4) 온순한","ev":"6번 문장","s":[[6,"Many people fall in love with these gentle animals.","많은 사람들이 이 온순한 동물들과 사랑에 빠진다."]],"w":"6번에서 사람들이 이 동물들과 사랑에 빠진다고 함. 사랑에 빠질 만한 모습은 순하고 얌전한 것. gentle = 온순한. 사나운 동물이라면 사랑에 빠지기 어려움.","c":4},"h":"8111977700"},{"n":6,"t":"ref","q":"What does the underlined \"the country\" refer to?\nSo the country sends them to zoos in other nations as a sign of friendship.","ko":"밑줄 친 the country가 가리키는 것은?","sko":"그래서 중국은 우정의 표시로 판다를 다른 나라의 동물원에 보낸다.","opts":["다른 나라들","동물원","중국","판다"],"r":{"a":"3) 중국","ev":"2번, 3번 문장","s":[[2,"Pandas are rare and live only in China.","판다는 희귀하고 중국에서만 산다."],[3,"So the country sends them to zoos in other nations as a sign of friendship.","그래서 중국은 우정의 표시로 판다를 다른 나라의 동물원에 보낸다."]],"w":"2번에서 판다가 live only in China(중국에서만 산다)고 했고, 3번의 So 뒤에서 판다를 다른 나라에 보내는 the country가 바로 그 중국. other nations(다른 나라들)는 보내는 곳임.","c":3},"h":"cb30ac217d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Panda diplomacy also lets countries work closely with China.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"판다 외교는 또한 나라들이 중국과 긴밀하게 협력하게 해 준다.","opts":["판다 외교 덕분에 나라들이 중국과 가깝게 협력할 수 있게 된다.","판다 외교는 나라들이 중국과 일하지 못하게 막는다.","판다 외교는 나라들이 중국을 멀리하게 만든다.","판다 외교 때문에 중국에서만 판다를 키우게 된다."],"r":{"a":"1) 판다 외교 덕분에 나라들이 중국과 가깝게 협력할 수 있게 된다.","ev":"9번 문장","s":[[9,"Panda diplomacy also lets countries work closely with China.","판다 외교는 또한 나라들이 중국과 긴밀하게 협력하게 해 준다."]],"w":"lets countries work closely with China는 ‘나라들이 중국과 긴밀하게 협력하게 해 준다’는 뜻. also는 7~8번 효과에 이은 또 하나의 효과라는 뜻. 막는다·멀리한다는 반대 내용이고, 판다는 3번처럼 다른 나라로 보내짐.","c":1},"h":"1bc502554d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["판다는 야생에서 여러 나라에 살고 있다.","판다는 새로운 나라에서 사람들의 마음을 얻는 데 오랜 시간이 걸린다.","중국은 판다를 다른 나라 동물원에 판다.","다른 나라의 동물원들은 판다를 돌보기 위해 중국 전문가들과 협력한다."],"opts":["Pandas live in the wild in many countries.","Pandas take a long time to win hearts in new countries.","China sells pandas to zoos in other nations.","Zoos in other countries work with Chinese experts to care for pandas."],"r":{"a":"4) 다른 나라의 동물원들은 판다를 돌보기 위해 중국 전문가들과 협력한다.","ev":"10번 문장","s":[[10,"Zoos in other countries work with Chinese experts to care for the pandas.","다른 나라의 동물원들은 판다를 돌보기 위해 중국 전문가들과 협력한다."]],"w":"10번에서 Zoos in other countries work with Chinese experts to care for the pandas라고 함. ①은 2번(중국에서만 산다), ②는 5번(금세), ③은 3번(우정의 표시로 보낸다, 파는 게 아님)과 어긋남.","c":4},"h":"67d75c16da"},{"n":9,"t":"sum","q":"As people learn more about pandas, they can also learn more about (A), and this helps them see the country in a more (B) way.","ko":"사람들은 판다에 대해 더 많이 알게 되면서 (A)에 대해서도 더 알게 되고, 이것은 사람들이 그 나라를 더 (B) 시각으로 보도록 돕는다.","oko":["(A) 동물원 / (B) 부정적인","(A) 중국 / (B) 부정적인","(A) 중국 / (B) 긍정적인","(A) 판다 / (B) 부정적인","(A) 동물원 / (B) 긍정적인"],"opts":["(A) zoos / (B) negative","(A) China / (B) negative","(A) China / (B) positive","(A) pandas / (B) negative","(A) zoos / (B) positive"],"r":{"a":"3) (A) China / (B) positive","ev":"7번, 8번 문장","s":[[7,"As people learn more about pandas, they can also learn more about China and its culture.","사람들은 판다에 대해 더 많이 알게 되면서, 중국과 그 문화에 대해서도 더 많이 알게 될 수 있다."],[8,"This helps them see the country in a more positive way.","이것은 사람들이 그 나라를 더 긍정적인 시각으로 보도록 돕는다."]],"w":"7번에서 판다에 대해 알면 about China and its culture도 더 알게 되고, 8번에서 그 나라를 in a more positive way(더 긍정적인 시각)로 보게 된다고 함. 그래서 China와 positive.","c":3},"h":"0d8d8efd48"},{"n":10,"t":"fill","q":"Panda diplomacy lets countries [A] closely with China, and by working together, they [B] trust and understanding.","ko":"판다 외교는 나라들이 중국과 긴밀하게 [A] 하고, 함께 일함으로써 그들은 신뢰와 이해를 [B].","bko":{"work":"일하다, 협력하다","build":"쌓다","rare":"드문","hearts":"마음","friendship":"우정","experts":"전문가들"},"bank":["work","build","rare","hearts","friendship","experts"],"r":{"a":"[A] work, [B] build","ev":"9번, 11번 문장","s":[[9,"Panda diplomacy also lets countries work closely with China.","판다 외교는 또한 나라들이 중국과 긴밀하게 협력하게 해 준다."],[11,"By working together, they build trust and understanding between their countries.","함께 일함으로써, 그들은 나라 사이의 신뢰와 이해를 쌓는다."]],"w":"9번에서 lets countries work closely with China(중국과 긴밀하게 협력하게 해 준다), 11번에서 By working together, they build trust and understanding(함께 일해 신뢰와 이해를 쌓는다)이라고 함. 나머지는 명사나 형용사라서 빈칸 자리에 들어갈 수 없음.","c":null},"h":"1d2186f027"}]},{"u":2,"id":"b2-02-2","no":2,"ko":"죽음 앞에서 코끼리는 어떻게 행동할까?","items":[{"n":1,"t":"tf","q":"When a herd member dies, elephants often stay beside the body for days.","ko":"무리의 일원이 죽으면 코끼리들은 흔히 며칠 동안 시신 곁에 머문다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When a herd member dies, elephants often stay beside the body for days.","무리의 일원이 죽으면, 코끼리들은 흔히 며칠 동안 시신 곁에 머문다."]],"w":"3번 문장에 When a herd member dies, elephants often stay beside the body for days가 그대로 나옴. 같은 내용이라 맞음.","c":"T"},"h":"dcd20eec0f"},{"n":2,"t":"tf","q":"A year later, the elephants in Kenya did not stop at the bones.","ko":"1년 뒤에, 케냐의 코끼리들은 뼈 앞에 멈춰 서지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Even a year later, they stopped and touched the bones gently with their trunks.","1년이 지난 뒤에도, 그들은 멈춰 서서 코로 뼈를 부드럽게 만졌다."]],"w":"7번 문장에서 Even a year later, they stopped and touched the bones gently(1년 뒤에도 멈춰 서서 뼈를 만졌다)라고 함. 멈춰 서지 않았다는 것은 반대 내용.","c":"F"},"h":"da39e504fb"},{"n":3,"t":"tf","q":"Elephants stop to smell and touch the bones of every kind of animal.","ko":"코끼리들은 모든 종류의 동물의 뼈 앞에 멈춰 서서 냄새를 맡고 만진다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"They stop to smell and touch them, while ignoring other animal bones.","그들은 멈춰 서서 그것들의 냄새를 맡고 만지지만, 다른 동물의 뼈는 무시한다."]],"w":"9번 문장에서 코끼리는 알지 못하는 코끼리의 뼈는 냄새 맡고 만지지만, 다른 동물의 뼈는 ignoring(무시한다)이라고 함. 모든 동물의 뼈라는 것은 틀림.","c":"F"},"h":"6ce0f26718"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Even a year later, they stopped and touched the bones gently with their trunks.)","ko":"(1년이 지난 뒤에도, 그들은 멈춰 서서 코로 뼈를 ( ) 만졌다.)","opts":["거칠게","빠르게","부드럽게","크게"],"word":"gently","r":{"a":"3) 부드럽게","ev":"7번 문장","s":[[7,"Even a year later, they stopped and touched the bones gently with their trunks.","1년이 지난 뒤에도, 그들은 멈춰 서서 코로 뼈를 부드럽게 만졌다."]],"w":"7번은 1년 뒤에도 코끼리들이 코로 뼈를 어떻게 만졌는지 말하는 문장임. 코로 뼈를 만지는 모습이니 조심스럽게, 부드럽게 만진 것. gently = 부드럽게. 거칠게는 반대 뜻.","c":3},"h":"be519db5d3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This suggests they can recognize death within their species.)","ko":"(이것은 그들이 자기 종 안에서 죽음을 ( ) 수 있음을 보여 준다.)","opts":["알아보다","잊어버리다","두려워하다","만들어 내다"],"word":"recognize","r":{"a":"1) 알아보다","ev":"10번 문장","s":[[10,"This suggests they can recognize death within their species.","이것은 그들이 자기 종 안에서 죽음을 알아볼 수 있음을 보여 준다."]],"w":"10번은 8~9번(알지 못하는 코끼리의 뼈에만 반응)을 근거로 한 결론임. 같은 종의 뼈를 구별해 ‘알아보는’ 것. recognize = 알아보다. 잊어버린다면 반응하지 못함.","c":1},"h":"3130eae1d6"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHowever, their behavior shows that they respond to it with deep emotions.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만 그들의 행동은 그들이 깊은 감정으로 그것에 반응한다는 것을 보여 준다.","opts":["뼈","죽음","행동","감정"],"r":{"a":"2) 죽음","ev":"11번, 12번 문장","s":[[11,"We can’t be sure how elephants understand death.","우리는 코끼리들이 죽음을 어떻게 이해하는지 확실히 알 수 없다."],[12,"However, their behavior shows that they respond to it with deep emotions.","하지만 그들의 행동은 그들이 깊은 감정으로 죽음에 반응한다는 것을 보여 준다."]],"w":"바로 앞 11번에서 코끼리들이 죽음을 어떻게 이해하는지는 알 수 없다고 함. 12번의 it은 그 death(죽음). 코끼리들이 죽음에 깊은 감정으로 반응한다는 뜻.","c":2},"h":"85c9817749"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It seems as if they are trying to bury it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 마치 시신을 묻으려고 하는 것처럼 보인다.","opts":["코끼리들이 시신을 정말로 땅에 묻었다.","코끼리들이 시신을 먹으려는 것처럼 보인다.","연구자들이 시신을 묻으려고 했다.","코끼리들이 시신을 묻으려는 것처럼 보인다."],"r":{"a":"4) 코끼리들이 시신을 묻으려는 것처럼 보인다.","ev":"4~5번 문장","s":[[4,"Sometimes they cover the body with leaves or dirt.","때로는 그들이 시신을 나뭇잎이나 흙으로 덮는다."],[5,"It seems as if they are trying to bury it.","그것은 마치 시신을 묻으려고 하는 것처럼 보인다."]],"w":"It seems as if ~는 ‘마치 ~인 것처럼 보인다’로 확실하지 않은 모습을 말함. 4번에서 시신을 나뭇잎이나 흙으로 덮는 행동을 보고 묻으려는 것 같다고 한 것. 정말 묻었다고 한 것이 아님.","c":4},"h":"c249327a83"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["코끼리들은 죽은 무리의 일원 곁에 절대 머물지 않는다.","코끼리들은 모든 동물의 뼈에 반응한다.","케냐의 연구자들은 코끼리들이 가족이 죽은 장소로 돌아오는 것을 보았다.","코끼리들은 죽음을 인간과 똑같이 이해한다."],"opts":["Elephants never stay beside a dead herd member.","Elephants react to the bones of every animal.","Researchers in Kenya saw elephants return to the place where a family member had died.","Elephants understand death exactly the same way humans do."],"r":{"a":"3) 케냐의 연구자들은 코끼리들이 가족이 죽은 장소로 돌아오는 것을 보았다.","ev":"6번 문장","s":[[6,"In Kenya, researchers saw elephants return to the place where a family member had died.","케냐에서, 연구자들은 코끼리들이 가족 구성원이 죽었던 장소로 돌아오는 것을 보았다."]],"w":"6번에서 In Kenya, researchers saw elephants return to the place where a family member had died라고 함. ①은 3번(며칠 동안 곁에 머문다), ②는 9번(다른 동물 뼈는 무시), ④는 11번(어떻게 이해하는지 확실히 알 수 없다)과 어긋남.","c":3},"h":"d3743eb1c7"},{"n":9,"t":"sum","q":"Elephants react to the bones of elephants they never knew, but they (A) other animal bones, so they seem to recognize (B) within their species.","ko":"코끼리들은 알지 못하는 코끼리의 뼈에는 반응하지만 다른 동물의 뼈는 (A)하므로, 자기 종 안에서 (B)을 알아보는 것 같다.","oko":["(A) 만진다 / (B) 먹이","(A) 무시한다 / (B) 먹이","(A) 만진다 / (B) 죽음","(A) 무시한다 / (B) 죽음","(A) 무시한다 / (B) 위험"],"opts":["(A) touch / (B) food","(A) ignore / (B) food","(A) touch / (B) death","(A) ignore / (B) death","(A) ignore / (B) danger"],"r":{"a":"4) (A) ignore / (B) death","ev":"8번, 9번, 10번 문장","s":[[8,"But elephants also react to the bones of elephants they never knew.","그러나 코끼리들은 자신들이 알지 못했던 코끼리의 뼈에도 반응한다."],[9,"They stop to smell and touch them, while ignoring other animal bones.","그들은 멈춰 서서 그것들의 냄새를 맡고 만지지만, 다른 동물의 뼈는 무시한다."],[10,"This suggests they can recognize death within their species.","이것은 그들이 자기 종 안에서 죽음을 알아볼 수 있음을 보여 준다."]],"w":"9번에서 다른 동물의 뼈는 ignoring(무시한다)이라고 하고, 10번에서 they can recognize death within their species(자기 종 안에서 죽음을 알아본다)라고 함. 그래서 ignore와 death.","c":4},"h":"daaf1b4499"},{"n":10,"t":"fill","q":"Researchers in Kenya saw elephants [A] to the place where a family member had died, and even a year later they gently touched the [B].","ko":"케냐의 연구자들은 코끼리들이 가족 구성원이 죽었던 장소로 [A]하는 것을 보았고, 1년 뒤에도 그들은 [B]를 부드럽게 만졌다.","bko":{"return":"돌아오다","bones":"뼈","bury":"묻다","smell":"냄새를 맡다","death":"죽음","species":"(생물의) 종"},"bank":["return","bones","bury","smell","death","species"],"r":{"a":"[A] return, [B] bones","ev":"6번, 7번 문장","s":[[6,"In Kenya, researchers saw elephants return to the place where a family member had died.","케냐에서, 연구자들은 코끼리들이 가족 구성원이 죽었던 장소로 돌아오는 것을 보았다."],[7,"Even a year later, they stopped and touched the bones gently with their trunks.","1년이 지난 뒤에도, 그들은 멈춰 서서 코로 뼈를 부드럽게 만졌다."]],"w":"6번에서 researchers saw elephants return to the place where a family member had died(가족이 죽은 장소로 돌아오는 것을 보았다), 7번에서 touched the bones gently(뼈를 부드럽게 만졌다)라고 함. bury는 5번에서 ‘묻으려는 것처럼 보인다’고만 한 말이라 이 문장에 맞지 않음.","c":null},"h":"98a004881f"}]},{"u":2,"id":"b2-02-3","no":3,"ko":"고양이 눈은 왜 밤에 빛날까?","items":[{"n":1,"t":"tf","q":"The tapetum lucidum lies behind the retina.","ko":"휘판은 망막 뒤에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It lies behind the retina, which senses light.","그것은 빛 flected his car’s headlights."],"r":{"a":"4) 퍼시 쇼는 고양이의 눈이 자동차 전조등을 반사할 때 그 빛을 알아차렸다.","ev":"10번 문장","s":[[10,"In the 1930s, inventor Percy Shaw noticed this glow when a cat’s eyes reflected his car’s headlights on a foggy road.","1930년대에, 발명가 퍼시 쇼는 안개 낀 도로에서 고양이의 눈이 자신의 자동차 전조등을 반사할 때 이 빛을 알아차렸다."]],"w":"10번에서 Percy Shaw noticed this glow when a cat’s eyes reflected his car’s headlights라고 함. ①은 3번(망막 뒤), ③은 10번(1930년대), ②는 어두운 밤 이야기인 1번과 어긋남.","c":4},"h":"e6ea543e91"},{"n":9,"t":"sum","q":"The tapetum lucidum (A) light back through the retina, so cats use the same light twice and (B) better in the dark.","ko":"휘판은 빛을 망막을 통해 다시 (A)하므로, 고양이는 같은 빛을 두 번 사용하여 어둠 속에서 더 잘 (B).","oko":["(A) 흡수한다 / (B) 숨는다","(A) 반사한다 / (B) 숨는다","(A) 막는다 / (B) 본다","(A) 반사한다 / (B) 본다","(A) 흡수한다 / (B) 본다"],"opts":["(A) absorbs / (B) hide","(A) reflects / (B) hide","(A) blocks / (B) see","(A) reflects / (B) see","(A) absorbs / (B) see"],"r":{"a":"4) (A) reflects / (B) see","ev":"4번, 5번 문장","s":[[4,"When light enters the eye, the tapetum lucidum reflects it back through the retina.","빛이 눈에 들어오면, 휘판은 그것을 망막을 통해 다시 반사한다."],[5,"This lets the cat use the same light twice, so it sees better in the dark.","이것은 고양이가 같은 빛을 두 번 사용하게 해 주므로, 고양이는 어둠 속에서 더 잘 본다."]],"w":"4번에서 the tapetum lucidum reflects it back(휘판이 빛을 다시 반사한다), 5번에서 it sees better in the dark(어둠 속에서 더 잘 본다)라고 함. 그래서 reflects와 see.","c":4},"h":"8b15fbfab3"},{"n":10,"t":"fill","q":"Road reflectors, inspired by cats’ eyes, are small glass [A] that [B] headlights back, helping drivers see more safely.","ko":"고양이 눈에서 영감을 얻은 도로 반사 장치는 전조등 빛을 다시 [B]하는 작은 유리 [A]이며, 운전자들이 더 안전하게 볼 수 있도록 돕는다.","bko":{"bumps":"돌기","reflect":"반사하다","retina":"망막","foggy":"안개 낀","tapetum":"휘판","twice":"두 번"},"bank":["bumps","reflect","retina","foggy","tapetum","twice"],"r":{"a":"[A] bumps, [B] reflect","ev":"11번, 12번 문장","s":[[11,"It inspired him to create “cat’s eye” road reflectors.","그것은 그가 ‘고양이 눈’ 도로 반사 장치를 만들도록 영감을 주었다."],[12,"These small glass bumps reflect headlights back, helping drivers see more safely at night.","이 작은 유리 돌기들은 전조등 빛을 다시 반사하여, 운전자들이 밤에 더 안전하게 볼 수 있도록 돕는다."]],"w":"12번에서 These small glass bumps reflect headlights back(이 작은 유리 돌기들은 전조등 빛을 다시 반사한다)이라고 함. 11번에서 이 장치가 고양이 눈에서 영감을 얻었다고 함. 나머지는 눈의 구조나 날씨를 나타내는 말이라 이 문장 뜻에 맞지 않음.","c":null},"h":"8eaef21723"}]},{"u":2,"id":"b2-02-4","no":4,"ko":"얼어붙어도 다시 살아나는 개구리","items":[{"n":1,"t":"tf","q":"In winter, many animals move to warmer places to escape the cold.","ko":"겨울에 많은 동물들은 추위를 피하기 위해 더 따뜻한 곳으로 이동한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In winter, many animals hide or move to warmer places to escape the cold.","겨울에 많은 동물들은 추위를 피하기 위해 숨거나 더 따뜻한 곳으로 이동한다."]],"w":"1번 문장에 many animals hide or move to warmer places to escape the cold가 나옴. 더 따뜻한 곳으로 이동한다는 내용이 포함되어 맞음.","c":"T"},"h":"65558b695b"},{"n":2,"t":"tf","q":"A frozen wood frog’s heart keeps beating.","ko":"얼어 있는 송장 개구리의 심장은 계속 뛴다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Its heart stops and it does not breathe.","심장이 멈추고 숨도 쉬지 않는다."]],"w":"4번 문장에서 Its heart stops and it does not breathe(심장이 멈추고 숨도 쉬지 않는다)라고 함. 계속 뛴다는 것은 반대 내용.","c":"F"},"h":"e04172bd91"},{"n":3,"t":"tf","q":"Special chemicals stop ice crystals from forming inside the frog’s cells.","ko":"특별한 화학 물질은 개구리의 세포 안에 얼음 결정이 생기는 것을 막는다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"These chemicals act like antifreeze and prevent ice crystals from forming inside the frog’s cells.","이 화학 물질은 부동액처럼 작용하여 개구리의 세포 안에 얼음 결정이 생기는 것을 막는다."]],"w":"9번 문장에 These chemicals … prevent ice crystals from forming inside the frog’s cells가 나옴. prevent는 stop과 같은 뜻이라 맞는 내용.","c":"T"},"h":"92f84b91f2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For weeks, it lies stiff like an ice cube, looking completely dead.)","ko":"(몇 주 동안, 그것은 얼음 덩어리처럼 ( ) 누워 있어서, 완전히 죽은 것처럼 보인다.)","opts":["부드러운","뻣뻣한","따뜻한","빠른"],"word":"stiff","r":{"a":"2) 뻣뻣한","ev":"5번 문장","s":[[5,"For weeks, it lies stiff like an ice cube, looking completely dead.","몇 주 동안, 그것은 얼음 덩어리처럼 뻣뻣하게 누워 있어서, 완전히 죽은 것처럼 보인다."]],"w":"5번에서 개구리가 얼음 덩어리처럼 누워 있어서 죽은 것처럼 보인다고 함. 얼어 움직이지 않는 모습이라 stiff = 뻣뻣한. 부드럽거나 따뜻하면 죽은 것처럼 보이지 않음.","c":2},"h":"611c813550"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These chemicals act like antifreeze and prevent ice crystals from forming inside the frog’s cells.)","ko":"(이 화학 물질은 부동액처럼 작용하여 개구리의 세포 안에 얼음 결정이 생기는 것을 ( ).)","opts":["막다","돕다","만들다","녹이다"],"word":"prevent","r":{"a":"1) 막다","ev":"9번 문장","s":[[9,"These chemicals act like antifreeze and prevent ice crystals from forming inside the frog’s cells.","이 화학 물질은 부동액처럼 작용하여 개구리의 세포 안에 얼음 결정이 생기는 것을 막는다."]],"w":"부동액은 얼지 않게 하는 물질임. 그래서 얼음 결정이 생기는 것을 ‘막는다’. prevent A from -ing = A가 ~하지 못하게 막다. 돕거나 만든다면 얼음이 생기게 되어 반대가 됨.","c":1},"h":"99da07c562"},{"n":6,"t":"ref","q":"What does the underlined \"This protection\" refer to?\nThis protection keeps the cells from being damaged and allows the frog to live.","ko":"밑줄 친 This protection이 가리키는 것은?","sko":"이 보호 작용은 세포가 손상되지 않게 지켜 주고 개구리가 살 수 있게 해 준다.","opts":["봄이 오는 것","개구리가 숨는 것","화학 물질이 세포 안에 얼음 결정이 생기는 것을 막아 주는 작용","개구리의 심장이 멈추는 것"],"r":{"a":"3) 화학 물질이 세포 안에 얼음 결정이 생기는 것을 막아 주는 작용","ev":"9번, 10번 문장","s":[[9,"These chemicals act like antifreeze and prevent ice crystals from forming inside the frog’s cells.","이 화학 물질은 부동액처럼 작용하여 개구리의 세포 안에 얼음 결정이 생기는 것을 막는다."],[10,"This protection keeps the cells from being damaged and allows the frog to live.","이 보호 작용은 세포가 손상되지 않게 지켜 주고 개구리가 살 수 있게 해 준다."]],"w":"10번의 This protection은 바로 앞 9번 내용. 화학 물질이 부동액처럼 얼음 결정이 세포 안에 생기는 것을 막는 보호 작용이라, 그 결과 세포가 손상되지 않고 개구리가 살 수 있게 됨.","c":3},"h":"2aedc86d83"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"With this clever trick, the wood frog can survive the deep freeze that would kill most animals.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 영리한 방법 덕분에, 송장 개구리는 대부분의 동물을 죽게 할 심한 혹한을 견디고 살아남을 수 있다.","opts":["송장 개구리는 대부분의 동물을 죽이는 혹한을 만들어 낸다.","대부분의 동물은 이 방법으로 혹한에서 살아남는다.","송장 개구리는 이 방법을 써도 혹한에서 죽는다.","이 영리한 방법 덕분에 송장 개구리는 대부분의 동물이 죽는 혹한에서도 살아남을 수 있다."],"r":{"a":"4) 이 영리한 방법 덕분에 송장 개구리는 대부분의 동물이 죽는 혹한에서도 살아남을 수 있다.","ev":"11번 문장","s":[[11,"With this clever trick, the wood frog can survive the deep freeze that would kill most animals.","이 영리한 방법 덕분에, 송장 개구리는 대부분의 동물을 죽게 할 심한 혹한을 견디고 살아남을 수 있다."]],"w":"that would kill most animals는 the deep freeze를 꾸미는 말로 ‘대부분의 동물을 죽일 혹한’이라는 뜻. 그런 혹한을 이 방법으로 송장 개구리가 견딘다는 것. 대부분의 동물이 이 방법을 쓰는 것은 아님.","c":4},"h":"eec4ee9cb9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 일치하는 것은?","oko":["송장 개구리는 겨울에 더 따뜻한 곳으로 이동한다.","봄이 오면 얼어 있던 송장 개구리는 천천히 녹아 다시 살아난다.","송장 개구리는 겨울이 끝난 뒤에 몸을 화학 물질로 채운다.","얼어 있는 송장 개구리는 계속 숨을 쉰다."],"opts":["Wood frogs move to warmer places in winter.","In spring, the frozen wood frog slowly melts and comes back to life.","Wood frogs fill their bodies with chemicals after winter ends.","A frozen wood frog keeps breathing."],"r":{"a":"2) 봄이 오면 얼어 있던 송장 개구리는 천천히 녹아 다시 살아난다.","ev":"6번 문장","s":[[6,"Then spring arrives, and the frozen frog slowly melts and comes back to life!","그러다 봄이 오면, 얼어 있던 개구리는 천천히 녹아 다시 살아난다!"]],"w":"6번에서 Then spring arrives, and the frozen frog slowly melts and comes back to life라고 함. ①은 2번(다른 동물들과 다른 방법), ③은 8번 Before winter(겨울이 오기 전), ④는 4번 it does not breathe와 어긋남.","c":2},"h":"cd2036d74e"},{"n":9,"t":"sum","q":"The wood frog (A) solid in winter and looks (B), but it comes back to life in spring.","ko":"송장 개구리는 겨울에 단단하게 (A)고 (B) 것처럼 보이지만, 봄에는 다시 살아난다.","oko":["(A) 녹는다 / (B) 죽은","(A) 언다 / (B) 살아 있는","(A) 숨는다 / (B) 살아 있는","(A) 녹는다 / (B) 살아 있는","(A) 언다 / (B) 죽은"],"opts":["(A) melts / (B) dead","(A) freezes / (B) alive","(A) hides / (B) alive","(A) melts / (B) alive","(A) freezes / (B) dead"],"r":{"a":"5) (A) freezes / (B) dead","ev":"3번, 5번 문장","s":[[3,"It freezes solid!","그것은 단단하게 얼어 버린다!"],[5,"For weeks, it lies stiff like an ice cube, looking completely dead.","몇 주 동안, 그것은 얼음 덩어리처럼 뻣뻣하게 누워 있어서, 완전히 죽은 것처럼 보인다."]],"w":"3번에서 It freezes solid(단단하게 언다), 5번에서 looking completely dead(완전히 죽은 것처럼 보인다)라고 함. 그래서 freezes와 dead.","c":5},"h":"8420c92065"},{"n":10,"t":"fill","q":"Before winter, the wood frog fills its body with special [A] that protect its [B] from being damaged.","ko":"겨울이 오기 전에, 송장 개구리는 몸속을 특별한 [A]로 채우고, 그것들은 개구리의 [B]가 손상되지 않게 보호한다.","bko":{"chemicals":"화학 물질","cells":"세포","spring":"봄","survivors":"생존자","weeks":"몇 주","cube":"정육면체, 덩어리"},"bank":["chemicals","cells","spring","survivors","weeks","cube"],"r":{"a":"[A] chemicals, [B] cells","ev":"8번, 10번 문장","s":[[8,"Before winter, the wood frog fills its body with special chemicals.","겨울이 오기 전에, 송장 개구리는 몸속을 특별한 화학 물질로 채운다."],[10,"This protection keeps the cells from being damaged and allows the frog to live.","이 보호 작용은 세포가 손상되지 않게 지켜 주고 개구리가 살 수 있게 해 준다."]],"w":"8번에서 the wood frog fills its body with special chemicals(몸속을 특별한 화학 물질로 채운다), 10번에서 This protection keeps the cells from being damaged(세포가 손상되지 않게 지켜 준다)라고 함. 나머지 단어는 시간이나 모습을 나타내는 말이라 뜻에 맞지 않음.","c":null},"h":"767b7b5e22"}]},{"u":3,"id":"b2-03-1","no":1,"ko":"하늘을 나는 듯했던 무용수, 발레의 규칙을 깨다","items":[{"n":1,"t":"tf","q":"Audiences were amazed by Nijinsky's high jumps and fast spins.","ko":"관객들은 니진스키의 높은 점프와 빠른 회전에 감탄했다.","r":{"a":"T (본문과 맞는 내용)","s":[[3,"Audiences were amazed by his high jumps and fast spins.","관객들은 그의 높은 점프와 빠른 회전에 감탄했다."]],"w":"3번 문장에 Audiences were amazed by his high jumps and fast spins가 그대로 나옴. 관객이 높은 점프와 빠른 회전에 감탄했다는 내용과 일치.","c":"T","ev":"3번 문장"},"h":"affe47f204"},{"n":2,"t":"tf","q":"Nijinsky was only a dancer and never created new ballets.","ko":"니진스키는 오직 무용수일 뿐 새로운 발레를 만든 적이 없다.","r":{"a":"F (본문과 다른 내용)","s":[[5,"Nijinsky was not just a dancer, though.","하지만 니진스키는 단지 무용수만은 아니었다."],[6,"He was also a choreographer who created new kinds of ballet.","그는 또한 새로운 종류의 발레를 만든 안무가이기도 했다."]],"w":"5번에서 단지 무용수만은 아니었다(not just a dancer)고 했고, 6번에서 새로운 종류의 발레를 만든 안무가(choreographer)라고 함. 새 발레를 만든 적이 없다는 말은 반대.","c":"F","ev":"5~6번 문장"},"h":"0170ae841c"},{"n":3,"t":"tf","q":"The Rite of Spring followed all the rules of traditional ballet.","ko":"〈봄의 제전〉은 전통 발레의 모든 규칙을 따랐다.","r":{"a":"F (본문과 다른 내용)","s":[[9,"But this piece broke all the rules.","하지만 이 작품은 모든 규칙을 깼다."]],"w":"9번 문장에서 this piece broke all the rules, 즉 이 작품은 모든 규칙을 깼다고 함. 규칙을 따랐다는 말은 반대.","c":"F","ev":"9번 문장"},"h":"eebbc7d23e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The dancers moved with heavy steps and rough, sudden movements.)","ko":"무용수들은 무거운 걸음과 거칠고 ( ) 동작으로 움직였다.","opts":["느린","갑작스러운","우아한","조용한"],"word":"sudden","r":{"a":"2) 갑작스러운","s":[[10,"The dancers moved with heavy steps and rough, sudden movements.","무용수들은 무거운 걸음과 거칠고 갑작스러운 동작으로 움직였다."]],"w":"10번 문장에서 〈봄의 제전〉의 동작은 거칠고 sudden했다고 함. 8번의 부드럽고 우아한 동작과 반대 분위기라서 '갑작스러운'이 맞음. 느린, 우아한, 조용한은 이 장면과 어울리지 않음.","c":2,"ev":"10번 문장"},"h":"801caca2a5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, his bold ideas later helped shape modern ballet.)","ko":"그러나 그의 ( ) 생각은 나중에 현대 발레를 만드는 데 도움이 되었다.","opts":["조용한","오래된","느린","대담한"],"word":"bold","r":{"a":"4) 대담한","s":[[13,"Many people did not understand Nijinsky's style at the time.","당시 많은 사람들은 니진스키의 스타일을 이해하지 못했다."],[14,"However, his bold ideas later helped shape modern ballet.","그러나 그의 대담한 생각은 나중에 현대 발레를 만드는 데 도움이 되었다."]],"w":"13번에서 사람들이 이해하지 못한 스타일이었고, 14번에서 However로 뒤집으며 그 생각이 현대 발레에 도움이 됐다고 함. 규칙을 깬 용감한 생각이므로 '대담한'. 조용한, 오래된, 느린은 어울리지 않음.","c":4,"ev":"13~14번 문장"},"h":"71abc25598"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was something people had never seen before.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 사람들이 전에 본 적 없는 것이었다.","opts":["전통 발레","니진스키의 높은 점프","〈봄의 제전〉 작품","부드러운 음악"],"r":{"a":"3) 〈봄의 제전〉 작품","s":[[9,"But this piece broke all the rules.","하지만 이 작품은 모든 규칙을 깼다."],[12,"It was something people had never seen before.","그것은 사람들이 전에 본 적 없는 것이었다."]],"w":"7번에서 소개한 작품이 〈봄의 제전〉이고, 9번 this piece가 같은 작품이며 12번의 It도 그 작품을 가리킴. 전통 발레는 사람들이 이미 본 것이라 맞지 않음.","c":3,"ev":"9번, 12번 문장"},"h":"9557c7ba49"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But this piece broke all the rules.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 이 작품은 모든 규칙을 깼다.","opts":["이 작품은 기존 발레의 규칙을 하나도 따르지 않았다.","이 작품은 발레의 규칙을 엄격하게 지켰다.","이 작품은 새 규칙을 만드는 데 큰 도움이 되었다.","이 작품은 규칙이 너무 많아 공연되지 못했다."],"r":{"a":"1) 이 작품은 기존 발레의 규칙을 하나도 따르지 않았다.","s":[[8,"In traditional ballet, dancers moved gracefully to smooth, soft music.","전통 발레에서 무용수들은 부드럽고 잔잔한 음악에 맞춰 우아하게 움직였다."],[9,"But this piece broke all the rules.","하지만 이 작품은 모든 규칙을 깼다."]],"w":"8번에서 전통 발레는 우아하고 부드러웠다고 했고, 9번의 broke all the rules는 그 규칙을 모두 깼다는 뜻. 규칙을 지켰다거나 공연되지 못했다는 말은 본문에 없음.","c":1,"ev":"8~9번 문장"},"h":"b0691f3630"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Nijinsky was a famous ballet dancer from France.","Nijinsky became well known in the early 1900s for his great skill.","His most famous work used soft and smooth music.","Most people understood Nijinsky's style right away."],"oko":["니진스키는 프랑스 출신의 유명한 발레 무용수였다.","니진스키는 1900년대 초에 뛰어난 실력으로 유명해졌다.","니진스키의 가장 유명한 작품은 부드러운 음악을 사용했다.","대부분의 사람들은 니진스키의 스타일을 바로 이해했다."],"r":{"a":"2) Nijinsky became well known in the early 1900s for his great skill.","s":[[1,"Vaslav Nijinsky was a famous ballet dancer from Russia.","바슬라프 니진스키는 러시아 출신의 유명한 발레 무용수였다."],[2,"He became well known in the early 1900s for his great skill.","그는 뛰어난 실력으로 1900년대 초에 유명해졌다."],[11,"The music was loud and full of strange rhythms.","음악은 시끄럽고 낯선 리듬으로 가득했다."],[13,"Many people did not understand Nijinsky's style at the time.","당시 많은 사람들은 니진스키의 스타일을 이해하지 못했다."]],"w":"2번 문장과 일치. 1번에서 러시아 출신이므로 프랑스는 틀림. 11번에서 음악은 시끄럽고 낯선 리듬이라 부드러운 음악은 틀림. 13번에서 당시 많은 사람들이 이해하지 못했으므로 마지막 선지도 틀림.","c":2,"ev":"1~2번, 11번, 13번 문장"},"h":"7dbb5c9c98"},{"n":9,"t":"sum","q":"Nijinsky's style was (A) by many people at the time, but his bold ideas later helped (B) modern ballet.","ko":"니진스키의 스타일은 당시 많은 사람들에게 (A) 되었지만, 그의 대담한 생각은 나중에 현대 발레를 (B) 데 도움이 되었다.","opts":["(A) praised / (B) shape","(A) misunderstood / (B) stop","(A) misunderstood / (B) shape","(A) praised / (B) stop","(A) copied / (B) shape"],"oko":["(A) 칭찬받게 / (B) 만드는","(A) 이해받지 못하게 / (B) 멈추는","(A) 이해받지 못하게 / (B) 만드는","(A) 칭찬받게 / (B) 멈추는","(A) 모방되게 / (B) 만드는"],"r":{"a":"3) (A) misunderstood / (B) shape","s":[[13,"Many people did not understand Nijinsky's style at the time.","당시 많은 사람들은 니진스키의 스타일을 이해하지 못했다."],[14,"However, his bold ideas later helped shape modern ballet.","그러나 그의 대담한 생각은 나중에 현대 발레를 만드는 데 도움이 되었다."]],"w":"13번에서 많은 사람들이 스타일을 이해하지 못했고(misunderstand = 잘못 이해하다), 14번에서 대담한 생각이 현대 발레를 만드는(shape) 데 도움이 됐다고 함. praised(칭찬받은), stop(멈추다), copied(베낀)는 본문에 없음.","c":3,"ev":"13~14번 문장"},"h":"bd27df3b3b"},{"n":10,"t":"fill","q":"Traditional ballet dancers moved [A] to soft music, but in The Rite of Spring, dancers moved with [B] steps instead of smooth ones.","ko":"전통 발레 무용수들은 부드러운 음악에 맞춰 [A] 움직였지만, 〈봄의 제전〉에서는 무용수들이 부드러운 걸음 대신 [B] 걸음으로 움직였다.","bank":["gracefully","heavy","audiences","rhythms","skill","jumps"],"bko":{"gracefully":"우아하게","heavy":"무거운","audiences":"관객들","rhythms":"리듬","skill":"실력","jumps":"점프"},"r":{"a":"[A] gracefully, [B] heavy","s":[[8,"In traditional ballet, dancers moved gracefully to smooth, soft music.","전통 발레에서 무용수들은 부드럽고 잔잔한 음악에 맞춰 우아하게 움직였다."],[10,"The dancers moved with heavy steps and rough, sudden movements.","무용수들은 무거운 걸음과 거칠고 갑작스러운 동작으로 움직였다."]],"w":"8번 dancers moved gracefully to smooth, soft music과 10번 The dancers moved with heavy steps에서 가져옴. audiences, rhythms, skill, jumps는 명사라서 ‘움직였다’를 꾸미는 [A]나 ‘걸음’을 꾸미는 [B] 자리에 들어갈 수 없음.","c":null,"ev":"8번, 10번 문장"},"h":"7624616af1"}]},{"u":3,"id":"b2-03-2","no":2,"ko":"소리를 듣지 못한 작곡가는 왜 피아노 다리를 잘랐을까?","items":[{"n":1,"t":"tf","q":"Beethoven was completely deaf when he wrote his Ninth Symphony.","ko":"베토벤은 제9번 교향곡을 쓸 때 완전히 귀가 들리지 않았다.","r":{"a":"T (본문과 맞는 내용)","s":[[2,"Ludwig van Beethoven faced this challenge when he wrote his Ninth Symphony.","루트비히 판 베토벤은 제9번 교향곡을 작곡할 때 이런 어려움에 직면했다."],[3,"At that time, he was completely deaf.","그때 그는 완전히 귀가 들리지 않는 상태였다."]],"w":"2번에서 제9번 교향곡을 쓸 때 어려움에 직면했다고 하고, 3번에서 그때 완전히 귀가 들리지 않았다(completely deaf)고 함. 내용이 일치.","c":"T","ev":"2~3번 문장"},"h":"d7364dc56e"},{"n":2,"t":"tf","q":"Beethoven stopped writing music because he lost his hearing.","ko":"베토벤은 청력을 잃었기 때문에 작곡을 그만두었다.","r":{"a":"F (본문과 다른 내용)","s":[[4,"But instead of giving up, he found a way to feel the music.","그러나 그는 포기하는 대신 음악을 느낄 방법을 찾아냈다."],[7,"Despite his hearing loss, Beethoven created a symphony that changed music history.","청력을 잃었음에도 불구하고, 베토벤은 음악의 역사를 바꾼 교향곡을 만들어 냈다."]],"w":"4번에서 포기하는 대신(instead of giving up) 음악을 느낄 방법을 찾았고, 7번에서 청력을 잃었음에도 교향곡을 만들었다고 함. 작곡을 그만두었다는 말은 반대.","c":"F","ev":"4번, 7번 문장"},"h":"2499ee967f"},{"n":3,"t":"tf","q":"Today, the Ninth Symphony is still performed around the world.","ko":"오늘날에도 제9번 교향곡은 전 세계에서 연주되고 있다.","r":{"a":"T (본문과 맞는 내용)","s":[[12,"Today, the Ninth Symphony is performed across the world, and is still considered one of Beethoven's greatest works.","오늘날 제9번 교향곡은 전 세계에서 연주되고 있으며, 여전히 베토벤의 가장 위대한 작품 중 하나로 여겨진다."]],"w":"12번 문장에 Today, the Ninth Symphony is performed across the world가 나옴. 오늘날 전 세계에서 연주된다는 내용과 일치.","c":"T","ev":"12번 문장"},"h":"5e671b70fc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Ludwig van Beethoven faced this challenge when he wrote his Ninth Symphony.)","ko":"루트비히 판 베토벤은 제9번 교향곡을 작곡할 때 이런 ( )에 직면했다.","opts":["선물","어려움","기회","약속"],"word":"challenge","r":{"a":"2) 어려움","s":[[1,"What would it be like if you couldn't hear music at all?","음악을 전혀 들을 수 없다면 어떤 느낌일까?"],[2,"Ludwig van Beethoven faced this challenge when he wrote his Ninth Symphony.","루트비히 판 베토벤은 제9번 교향곡을 작곡할 때 이런 어려움에 직면했다."]],"w":"1번에서 음악을 전혀 들을 수 없다면 어떨까 하고 묻고, 2번의 this challenge가 그 상황을 가리킴. 듣지 못하는 일은 '어려움'. 선물, 기회, 약속은 문맥과 맞지 않음.","c":2,"ev":"1~2번 문장"},"h":"9aaa34d75e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This way, he could feel the sound through vibrations from the floor.)","ko":"이렇게 하면 그는 바닥에서 오는 ( )을 통해 소리를 느낄 수 있었다.","opts":["속도","소음","진동","거리"],"word":"vibrations","r":{"a":"3) 진동","s":[[5,"He cut off the legs of his piano and placed it on the floor.","그는 피아노의 다리를 잘라 내고 피아노를 바닥에 놓았다."],[6,"This way, he could feel the sound through vibrations from the floor.","이렇게 하면 그는 바닥에서 오는 진동을 통해 소리를 느낄 수 있었다."]],"w":"5번에서 피아노를 바닥에 놓았고, 6번에서 귀가 아닌 바닥에서 오는 vibrations로 소리를 느꼈다고 함. 바닥을 타고 전해지는 떨림이므로 '진동'. 소음이나 속도는 느낄 수 있는 방법이 되지 못함.","c":3,"ev":"5~6번 문장"},"h":"a508c0a492"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHe cut off the legs of his piano and placed it on the floor.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그는 피아노의 다리를 잘라 내고 그것을 바닥에 놓았다.","opts":["음악","피아노의 다리","바닥","피아노"],"r":{"a":"4) 피아노","s":[[5,"He cut off the legs of his piano and placed it on the floor.","그는 피아노의 다리를 잘라 내고 피아노를 바닥에 놓았다."]],"w":"5번에서 다리를 잘라 낸 것은 his piano의 다리이고, 바닥에 놓은 것은 다리가 아니라 다리를 자른 피아노 자체. 그래서 it은 피아노.","c":4,"ev":"5번 문장"},"h":"08cba09d78"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Despite his hearing loss, Beethoven created a symphony that changed music history.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"청력을 잃었음에도 불구하고, 베토벤은 음악의 역사를 바꾼 교향곡을 만들어 냈다.","opts":["베토벤은 귀가 들리지 않았지만 음악의 역사를 바꾼 교향곡을 만들었다.","베토벤은 귀가 들리지 않아서 음악의 역사를 바꿀 수 없었다.","베토벤은 청력을 되찾은 뒤에 교향곡을 만들었다.","베토벤은 교향곡을 만든 뒤에 청력을 잃었다."],"r":{"a":"1) 베토벤은 귀가 들리지 않았지만 음악의 역사를 바꾼 교향곡을 만들었다.","s":[[7,"Despite his hearing loss, Beethoven created a symphony that changed music history.","청력을 잃었음에도 불구하고, 베토벤은 음악의 역사를 바꾼 교향곡을 만들어 냈다."]],"w":"Despite는 '~에도 불구하고'라는 뜻이라, 청력을 잃은 상황에서도 해냈다는 내용. 못 했다는 말(2번)이나 청력 회복(3번), 순서가 반대인 말(4번)은 본문에 없음.","c":1,"ev":"7번 문장"},"h":"1a36c9ebca"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Beethoven wrote the Ninth Symphony after he could hear again.","Beethoven put his piano on the floor to feel the sound.","The Ninth Symphony has no singing in it.","The Ninth Symphony is no longer played today."],"oko":["베토벤은 다시 귀가 들리게 된 뒤에 제9번 교향곡을 썼다.","베토벤은 소리를 느끼려고 피아노를 바닥에 놓았다.","제9번 교향곡에는 노래가 전혀 들어 있지 않다.","제9번 교향곡은 오늘날에는 더 이상 연주되지 않는다."],"r":{"a":"2) Beethoven put his piano on the floor to feel the sound.","s":[[3,"At that time, he was completely deaf.","그때 그는 완전히 귀가 들리지 않는 상태였다."],[5,"He cut off the legs of his piano and placed it on the floor.","그는 피아노의 다리를 잘라 내고 피아노를 바닥에 놓았다."],[10,"It's also the first symphony to include singing.","그것은 또한 노래를 포함한 최초의 교향곡이기도 하다."],[12,"Today, the Ninth Symphony is performed across the world, and is still considered one of Beethoven's greatest works.","오늘날 제9번 교향곡은 전 세계에서 연주되고 있으며, 여전히 베토벤의 가장 위대한 작품 중 하나로 여겨진다."]],"w":"5번 문장과 일치. 3번에서 쓸 때 귀가 완전히 안 들렸으므로 첫 선지는 틀림. 10번에서 노래를 포함한 최초의 교향곡이라 했으므로 세 번째도 틀림. 12번에서 오늘날에도 연주된다고 했으므로 네 번째도 틀림.","c":2,"ev":"3번, 5번, 10번, 12번 문장"},"h":"4c950cb0d7"},{"n":9,"t":"sum","q":"Beethoven (A) the legs of his piano and placed it on the floor, so he could (B) the sound through vibrations.","ko":"베토벤은 피아노의 다리를 (A) 피아노를 바닥에 놓았고, 그래서 진동을 통해 소리를 (B) 수 있었다.","opts":["(A) lifted / (B) hear","(A) painted / (B) feel","(A) cut off / (B) hear","(A) lifted / (B) feel","(A) cut off / (B) feel"],"oko":["(A) 들어 올려 / (B) 들을","(A) 색칠해 / (B) 느낄","(A) 잘라 내고 / (B) 들을","(A) 들어 올려 / (B) 느낄","(A) 잘라 내고 / (B) 느낄"],"r":{"a":"5) (A) cut off / (B) feel","s":[[5,"He cut off the legs of his piano and placed it on the floor.","그는 피아노의 다리를 잘라 내고 피아노를 바닥에 놓았다."],[6,"This way, he could feel the sound through vibrations from the floor.","이렇게 하면 그는 바닥에서 오는 진동을 통해 소리를 느낄 수 있었다."]],"w":"5번에서 피아노의 다리를 잘라 냈고(cut off), 6번에서 바닥의 진동으로 소리를 느꼈다(feel)고 함. 귀가 들리지 않았으니 hear(듣다)는 맞지 않고, lifted(들어 올린), painted(색칠한)도 본문에 없음.","c":5,"ev":"5~6번 문장"},"h":"a5e35b5c93"},{"n":10,"t":"fill","q":"The Ninth Symphony is nearly [A] as long as most symphonies of its time, and it is the first symphony to [B] singing.","ko":"제9번 교향곡은 당시 대부분의 교향곡보다 거의 [A] 길고, 노래를 [B] 최초의 교향곡이다.","bank":["twice","include","choir","hearing","floor","famous"],"bko":{"twice":"두 배","include":"포함하다","choir":"합창단","hearing":"청력","floor":"바닥","famous":"유명한"},"r":{"a":"[A] twice, [B] include","s":[[9,"That's nearly twice as long as most symphonies of the time.","이는 당시 대부분의 교향곡보다 거의 두 배나 긴 것이다."],[10,"It's also the first symphony to include singing.","그것은 또한 노래를 포함한 최초의 교향곡이기도 하다."]],"w":"9번 That's nearly twice as long as most symphonies of the time과 10번 the first symphony to include singing에서 가져옴. choir, hearing, floor, famous는 명사·형용사라서 ‘두 배 길다’ 자리나 ‘노래를 포함하다’ 자리에 들어갈 수 없음.","c":null,"ev":"9~10번 문장"},"h":"7131385a69"}]},{"u":3,"id":"b2-03-3","no":3,"ko":"푸른빛 비밀을 품은 고려의 그릇","items":[{"n":1,"t":"tf","q":"Goryeo celadon was mainly made during the Goryeo Dynasty.","ko":"고려청자는 주로 고려 시대에 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","s":[[3,"It was mainly made between the late 10th and 14th centuries, during the Goryeo Dynasty.","그것은 주로 고려 시대인 10세기 말에서 14세기 사이에 만들어졌다."]],"w":"3번 문장에 It was mainly made between the late 10th and 14th centuries, during the Goryeo Dynasty가 나옴. 고려 시대에 주로 만들어졌다는 내용과 일치.","c":"T","ev":"3번 문장"},"h":"d97597ed56"},{"n":2,"t":"tf","q":"In the sanggam technique, potters drew patterns on the clay with paint.","ko":"상감 기법에서 도공들은 물감으로 점토에 무늬를 그렸다.","r":{"a":"F (본문과 다른 내용)","s":[[10,"Instead of drawing, potters carved patterns into the clay.","도공들은 그림을 그리는 대신 무늬를 점토에 새겼다."]],"w":"10번 문장에서 Instead of drawing, 즉 그리는 대신 무늬를 점토에 새겼다(carved)고 함. 물감으로 그렸다는 말은 반대.","c":"F","ev":"10번 문장"},"h":"03bebd66a6"},{"n":3,"t":"tf","q":"Goryeo celadon remains an important part of Korean tradition and culture.","ko":"고려청자는 여전히 한국 전통과 문화의 중요한 부분으로 남아 있다.","r":{"a":"T (본문과 맞는 내용)","s":[[14,"It remains an important part of Korean tradition and culture.","그것은 지금도 한국 전통과 문화의 중요한 한 부분으로 남아 있다."]],"w":"14번 문장에 It remains an important part of Korean tradition and culture가 나옴. remain(남아 있다)은 지금도 그렇다는 뜻이라 내용과 일치.","c":"T","ev":"14번 문장"},"h":"2fe8290141"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Goryeo potters mastered this technique and created a beautiful color.)","ko":"고려의 도공들은 이 기술을 ( ) 아름다운 색을 만들어 냈다.","opts":["가르쳤다","완전히 익혔다","잊어버렸다","팔았다"],"word":"mastered","r":{"a":"2) 완전히 익혔다","s":[[6,"This color was made by a special firing method using very little oxygen.","이 색은 산소를 아주 조금만 쓰는 특별한 굽기 방법으로 만들어졌다."],[7,"Goryeo potters mastered this technique and created a beautiful color.","고려의 도공들은 이 기술을 완전히 익혀서 아름다운 색을 만들어 냈다."]],"w":"6번에서 특별한 굽기 방법으로 색을 만들었다고 하고, 7번에서 도공들이 그 기술을 mastered(master, 완전히 익히다)하여 아름다운 색을 만들었다고 함. 기술을 익혀서 색이 나왔으므로 '완전히 익혔다'. 잊어버렸다면 색을 만들 수 없음.","c":2,"ev":"6~7번 문장"},"h":"718a78ba58"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It also used a decoration technique called sanggam.)","ko":"청자는 또한 상감이라고 불리는 ( ) 기법도 사용했다.","opts":["건축","운반","장식","포장"],"word":"decoration","r":{"a":"3) 장식","s":[[8,"But color was not the only special thing about celadon.","하지만 색만이 청자의 유일한 특별함은 아니었다."],[9,"It also used a decoration technique called sanggam.","청자는 또한 상감이라고 불리는 장식 기법도 사용했다."]],"w":"8번에서 색 말고도 또 다른 특별한 점이 있다고 하고, 9번이 상감이라는 기법을 소개함. 10~11번에서 무늬를 새기고 채우므로 decoration은 무늬로 꾸미는 '장식'.","c":3,"ev":"8~9번 문장"},"h":"5fd65c36c8"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThen they filled the patterns with colored clay before firing.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그런 다음 그들은 굽기 전에 그 무늬를 색이 있는 점토로 채웠다.","opts":["도공들","청자 제품","무늬","점토"],"r":{"a":"1) 도공들","s":[[10,"Instead of drawing, potters carved patterns into the clay.","도공들은 그림을 그리는 대신 무늬를 점토에 새겼다."],[11,"Then they filled the patterns with colored clay before firing.","그런 다음 굽기 전에 그 무늬를 색이 있는 점토로 채웠다."]],"w":"10번에서 무늬를 점토에 새긴 것은 potters(도공들)이고, 11번의 they는 같은 도공들이 무늬를 색 점토로 채운다는 뜻. 무늬나 점토는 채워지는 대상이지 채우는 주체가 아님.","c":1,"ev":"10~11번 문장"},"h":"74232d9f76"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of drawing, potters carved patterns into the clay.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"도공들은 그림을 그리는 대신 무늬를 점토에 새겼다.","opts":["도공들은 점토 위에 그림을 그려서 무늬를 만들었다.","도공들은 무늬를 새기는 대신 점토에 색을 칠했다.","도공들은 점토에 그림을 그리지 않고 무늬를 새겨 넣었다.","도공들은 점토를 새로 만드는 대신 그림을 그렸다."],"r":{"a":"3) 도공들은 점토에 그림을 그리지 않고 무늬를 새겨 넣었다.","s":[[10,"Instead of drawing, potters carved patterns into the clay.","도공들은 그림을 그리는 대신 무늬를 점토에 새겼다."]],"w":"Instead of drawing은 '그리는 대신'이라는 뜻이고, carved patterns는 '무늬를 새겼다'는 뜻. 그림을 그린 게 아니라 새겼다는 것이 핵심. 선지 ①, ②, ④는 순서나 행동이 거꾸로임.","c":3,"ev":"10번 문장"},"h":"d0462e0f2c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Goryeo celadon was mainly made in the 20th century.","Celadon items included bowls, cups, and even roof tiles.","Sanggam is a firing method that uses very little oxygen.","Goryeo celadon had no influence on pottery in other countries."],"oko":["고려청자는 주로 20세기에 만들어졌다.","청자 제품에는 그릇, 컵, 심지어 지붕 기와까지 있었다.","상감은 산소를 아주 적게 쓰는 굽기 방법이다.","고려청자는 다른 나라의 도자기에 영향을 주지 않았다."],"r":{"a":"2) Celadon items included bowls, cups, and even roof tiles.","s":[[3,"It was mainly made between the late 10th and 14th centuries, during the Goryeo Dynasty.","그것은 주로 고려 시대인 10세기 말에서 14세기 사이에 만들어졌다."],[4,"Celadon items included bowls, cups, and even roof tiles.","청자 제품에는 그릇, 컵, 심지어 지붕 기와까지 있었다."],[9,"It also used a decoration technique called sanggam.","청자는 또한 상감이라고 불리는 장식 기법도 사용했다."],[13,"Goryeo celadon later influenced pottery across Asia.","고려청자는 나중에 아시아 전역의 도자기에 영향을 주었다."]],"w":"4번 문장과 일치. 3번에서 10세기 말~14세기에 만들어졌으므로 20세기는 틀림. 9번에서 상감은 장식 기법이고, 산소를 적게 쓰는 것은 굽기 방법(6번)이라 틀림. 13번에서 아시아 도자기에 영향을 주었다고 했으므로 마지막도 틀림.","c":2,"ev":"3~4번, 9번, 13번 문장"},"h":"73b0e4f4f3"},{"n":9,"t":"sum","q":"Goryeo celadon is famous for its soft blue-green color, which was made by a special (A) method using very little (B).","ko":"고려청자는 은은한 청록색으로 유명한데, 이 색은 아주 적은 (B)만 쓰는 특별한 (A) 방법으로 만들어졌다.","opts":["(A) drawing / (B) oxygen","(A) firing / (B) water","(A) carving / (B) clay","(A) firing / (B) oxygen","(A) drawing / (B) clay"],"oko":["(A) 그리기 / (B) 산소","(A) 굽기 / (B) 물","(A) 새기기 / (B) 점토","(A) 굽기 / (B) 산소","(A) 그리기 / (B) 점토"],"r":{"a":"4) (A) firing / (B) oxygen","s":[[5,"The most famous feature is its soft blue-green color.","가장 유명한 특징은 은은한 청록색이다."],[6,"This color was made by a special firing method using very little oxygen.","이 색은 산소를 아주 조금만 쓰는 특별한 굽기 방법으로 만들어졌다."]],"w":"5번에서 가장 유명한 특징이 청록색이고, 6번에서 그 색은 산소를 아주 적게 쓰는 특별한 굽기(firing) 방법으로 만들어졌다고 함. 그리기, 새기기는 색을 내는 방법이 아니고, water나 clay는 6번에 나오지 않음.","c":4,"ev":"5~6번 문장"},"h":"b735687fd0"},{"n":10,"t":"fill","q":"Goryeo potters were the [A] to use the sanggam technique on ceramics, and celadon later [B] pottery across Asia.","ko":"고려의 도공들은 상감 기법을 도자기에 [A] 사용한 사람들이었고, 청자는 나중에 아시아 전역의 도자기에 [B].","bank":["first","influenced","mastered","carved","famous","special"],"bko":{"first":"처음으로, 최초의","influenced":"영향을 주었다","mastered":"완전히 익혔다","carved":"새겼다","famous":"유명한","special":"특별한"},"r":{"a":"[A] first, [B] influenced","s":[[12,"Goryeo potters were the first to use this technique on ceramics.","고려의 도공들은 이 기법을 도자기에 처음으로 사용한 사람들이었다."],[13,"Goryeo celadon later influenced pottery across Asia.","고려청자는 나중에 아시아 전역의 도자기에 영향을 주었다."]],"w":"12번 Goryeo potters were the first to use this technique on ceramics와 13번 Goryeo celadon later influenced pottery across Asia에서 가져옴. mastered, carved는 7번, 10번에서 쓰였지만 이 문장 뜻과 맞지 않고, famous, special은 형용사라 자리에 어울리지 않음.","c":null,"ev":"12~13번 문장"},"h":"b81d2da242"}]},{"u":3,"id":"b2-03-4","no":4,"ko":"오페라와 뮤지컬, 무엇이 다를까?","items":[{"n":1,"t":"tf","q":"Opera began in Europe hundreds of years ago.","ko":"오페라는 수백 년 전 유럽에서 시작되었다.","r":{"a":"T (본문과 맞는 내용)","s":[[4,"Opera began in Europe hundreds of years ago.","오페라는 수백 년 전 유럽에서 시작되었다."]],"w":"4번 문장에 Opera began in Europe hundreds of years ago가 그대로 나옴. 유럽에서 수백 년 전에 시작됐다는 내용과 일치.","c":"T","ev":"4번 문장"},"h":"1db8f5364e"},{"n":2,"t":"tf","q":"Opera singers usually use microphones to fill the theater.","ko":"오페라 가수들은 보통 극장을 채우기 위해 마이크를 사용한다.","r":{"a":"F (본문과 다른 내용)","s":[[6,"Singers use their powerful voices instead of microphones to fill the theater.","가수들은 극장을 채우기 위해 마이크 대신 힘 있는 목소리를 사용한다."]],"w":"6번 문장에서 오페라 가수들은 마이크 대신(instead of microphones) 힘 있는 목소리를 쓴다고 함. 마이크를 쓰는 쪽은 뮤지컬(10번). 그래서 틀린 내용.","c":"F","ev":"6번 문장"},"h":"bac8379b3b"},{"n":3,"t":
