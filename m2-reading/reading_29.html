rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "A New Cookie Star: Chocolate Chip Cookies", "en": "In America, there were a famous cook, Ms. Wakefield.", "ko": "미국에 Wakefield 씨라는 한 유명한 요리사가 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [3], "point": "수일치: There is/was 뒤에 오는 명사 (a famous cook, 단수)에 동사를 일치시켜 was 사용", "topic": "수일치", "memo": "There is/was 뒤에 오는 명사 (a famous cook, 단수)에 동사를 일치시켜 was 사용"}]}, {"n": 2, "tag": null, "en": "One day in 1938, she wanted baking chocolate cookies.", "ko": "1938년 어느 날, 그녀는 초콜릿 쿠키를 굽고 싶었다.", "ok": false, "foot": [], "fixes": [{"wrong": "baking", "right": "to bake", "partial": false, "at": [6], "point": "동명사 vs to부정사: want는 목적어로 to부정사를 취함(want to bake)", "topic": "동명사 vs to부정사", "memo": "want는 목적어로 to부정사를 취함(want to bake)"}]}, {"n": 3, "tag": null, "en": "However, she didn't have enough time melting chocolate.", "ko": "그러나 그녀는 초콜릿을 녹일 충분한 시간이 없었다.", "ok": false, "foot": [], "fixes": [{"wrong": "melting", "right": "to melt", "partial": false, "at": [6], "point": "to부정사의 형용사적 용법: 명사 time을 수식하는 to부정사 to melt 사용(동명사 불가)", "topic": "to부정사의 형용사적 용법", "memo": "명사 time을 수식하는 to부정사 to melt 사용(동명사 불가)"}]}, {"n": 4, "tag": null, "en": "\"Aha!\" So, she cut a chocolate bars into small chips.", "ko": "“아하!” 그래서 그녀는 초콜릿 바를 작은 조각들로 잘랐다.", "ok": false, "foot": [], "fixes": [{"wrong": "bars", "right": "bar", "partial": false, "at": [6], "point": "관사+수일치: 부정관사 a 뒤에는 단수명사 bar 사용", "topic": "관사+수일치", "memo": "부정관사 a 뒤에는 단수명사 bar 사용"}]}, {"n": 5, "tag": null, "en": "Then, she mixed them with her dough and putting the cookie dough into the oven.", "ko": "그런 다음, 그녀는 그것들을 반죽과 섞었고, 그 쿠키 반죽을 오븐에 넣었다.", "ok": false, "foot": ["1dough 반죽"], "fixes": [{"wrong": "putting", "right": "put", "partial": false, "at": [8], "point": "병렬구조: and로 연결된 동사는 mixed와 같은 시제(과거형) put 사용", "topic": "병렬구조", "memo": "and로 연결된 동사는 mixed와 같은 시제(과거형) put 사용"}]}, {"n": 6, "tag": null, "en": "When Ms. Wakefield opened the oven, she found that the chips was not melted into the dough.", "ko": "Wakefield 씨가 오븐을 열었을 때, 그녀는 그 조각들이 반죽에 녹아들지 않은 것을 발견했다.", "ok": false, "foot": [], "fixes": [{"wrong": "was", "right": "were", "partial": false, "at": [11], "point": "수동태+수일치: 주어 the chips(복수)에 맞춰 were not melted 사용", "topic": "수동태+수일치", "memo": "주어 the chips(복수)에 맞춰 were not melted 사용"}]}, {"n": 7, "tag": null, "en": "\"Oh, no!\" Although the chips remained in the cookies, she was not disappointed.", "ko": "“아, 안 돼!” 비록 그 조각들이 쿠키에 남아 있었지만, 그녀는 실망하지 않았다.", "ok": true, "foot": [], "fixes": []}, {"n": 8, "tag": null, "en": "Her new cookies were so deliciously.", "ko": "그녀의 새 쿠키들은 정말 맛있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "deliciously", "right": "delicious", "partial": false, "at": [5], "point": "어법: be동사(were)의 보어는 형용사 delicious 사용(부사 deliciously 불가)", "topic": "어법", "memo": "be동사(were)의 보어는 형용사 delicious 사용(부사 deliciously 불가)"}]}, {"n": 9, "tag": null, "en": "She has invented chocolate CHIP cookies!", "ko": "그녀가 초콜릿 ‘칩’ 쿠키를 발명했다!", "ok": false, "foot": [], "fixes": [{"wrong": "has invented", "right": "invented", "partial": false, "at": [1], "point": "시제: 과거 시점의 이야기가 이어지고 있으므로 현재완료(has invented)가 아닌 단순과거 invented 사용", "topic": "시제", "memo": "과거 시점의 이야기가 이어지고 있으므로 현재완료(has invented)가 아닌 단순과거 invented 사용"}]}, {"n": 10, "tag": "Finding Safety in Glass: Safety Glass", "en": "In 1903, an French scientist, Mr. Bénédictus, was experimenting with liquid plastic in a glass flask.", "ko": "1903년에 프랑스의 과학자인 Bénédictus 씨는 유리 플라스크 안에 있는 액체 플라스틱으로 실험을 하고 있었다.", "ok": false, "foot": ["1flask (실험용) 플라스크"], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [2], "point": "관사: French는 자음 발음으로 시작하므로 부정관사 a 사용", "topic": "관사", "memo": "French는 자음 발음으로 시작하므로 부정관사 a 사용"}]}, {"n": 11, "tag": null, "en": "He accidental hitted the glass flask, and it fell on the floor.", "ko": "그가 실수로 유리 플라스크를 쳐서 그것이 바닥에 떨어졌다.", "ok": false, "foot": [], "fixes": [{"wrong": "accidental", "right": "accidentally", "partial": false, "at": [1], "point": "어법: 동사 hit을 수식하므로 부사 accidentally 사용(형용사 accidental 불가)", "topic": "어법", "memo": "동사 hit을 수식하므로 부사 accidentally 사용(형용사 accidental 불가)"}, {"wrong": "hitted", "right": "hit", "partial": false, "at": [2], "point": "어법: hit은 불규칙동사로 과거형도 hit (hitted 불가)", "topic": "어법", "memo": "hit은 불규칙동사로 과거형도 hit (hitted 불가)"}]}, {"n": 12, "tag": null, "en": "\"Oops!\" Although the glass flask were broken into pieces, they still helded together in the shape of the flask!", "ko": "“이런!” 비록 유리 플라스크는 깨져서 조각났지만, 그것들은 플라스크 모양으로 여전히 함께 붙어 있었다!", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [5], "point": "수동태+수일치: 주어 the glass flask(단수)에 맞춰 was broken 사용", "topic": "수동태+수일치", "memo": "주어 the glass flask(단수)에 맞춰 was broken 사용"}, {"wrong": "helded", "right": "held", "partial": false, "at": [11], "point": "어법: hold의 과거형은 held (helded 불가, 불규칙동사)", "topic": "어법", "memo": "hold의 과거형은 held (helded 불가, 불규칙동사)"}]}, {"n": 13, "tag": null, "en": "How could this happen?", "ko": "어떻게 이런 일이 일어날 수 있었을까?", "ok": true, "foot": [], "fixes": []}, {"n": 14, "tag": null, "en": "A secret was the liquid plastic in the flask.", "ko": "비밀은 플라스크 안에 있는 액체 플라스틱이었다.", "ok": false, "foot": [], "fixes": [{"wrong": "A", "right": "The", "partial": false, "at": [0], "point": "관사: 앞에서 언급된 특정한 비밀을 가리키므로 정관사 The 사용", "topic": "관사", "memo": "앞에서 언급된 특정한 비밀을 가리키므로 정관사 The 사용"}]}, {"n": 15, "tag": null, "en": "This finding led into his invention of safety glass.", "ko": "이 발견이 안전유리의 발명으로 이어졌다.", "ok": false, "foot": [], "fixes": [{"wrong": "into", "right": "to", "partial": false, "at": [3], "point": "어휘: '~로 이어지다'는 lead to 사용 (lead into는 쓰지 않음)", "topic": "어휘", "memo": "'~로 이어지다'는 lead to 사용 (lead into는 쓰지 않음)"}]}, {"n": 16, "tag": null, "en": "These days, we can found safety glass everywhere.", "ko": "요즘 우리는 어디서나 안전유리를 찾을 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "found", "right": "find", "partial": false, "at": [4], "point": "어법: 조동사 can 뒤에는 동사원형 find 사용", "topic": "어법 관리자인 Jolly 씨는 테이블보를 보고 무언가를 발견했다.", 0], ["\"Wow!\" The dirty spot on the tablecloth was cleaned by the lamp oil!", "“와!” 테이블보 위의 더러운 얼룩이 등유에 의해 깨끗해졌다!", 0], ["His discovery led to a new way of cleaning clothes.", "그의 발견은 옷을 세탁하는 새로운 방법으로 이어졌다.", 0], ["Now, dry cleaning is widely used around the world.", "이제 드라이클리닝은 전 세계적으로 널리 사용된다.", 0], ["These wonderful inventions came by chance.", "이 훌륭한 발명품들은 우연히 나왔다.", 0], ["When things go wrong, don't be disappointed.", "일이 잘못될 때 실망하지 마라.", 0], ["Maybe you can be the next amazing inventor.", "아마도 당신이 다음의 놀라운 발명가가 될 수도 있다.", 0]];var RNUM=29;var TITLE_EN="Wonderful Inventions by Chance";var PASS_EN=["Wonderful Inventions by Chance", "In America, there was a famous cook, Ms. Wakefield. One day in 1938, she wanted to bake chocolate cookies. However, she didn't have enough time to melt chocolate. \"Aha!\" So, she cut a chocolate bar into small chips. Then, she mixed them with her dough and put the cookie dough into the oven. When Ms. Wakefield opened the oven, she found that the chips were not melted into the dough. \"Oh, no!\" Although the chips remained in the cookies, she was not disappointed. Her new cookies were so delicious. She invented chocolate CHIP cookies!", "In 1903, a French scientist, Mr. Bénédictus, was experimenting with liquid plastic in a glass flask. He accidentally hit the glass flask, and it fell on the floor. \"Oops!\" Although the glass flask was broken into pieces, they still held together in the shape of the flask! How could this happen? The secret was the liquid plastic in the flask. This finding led to his invention of safety glass. These days, we can find safety glass everywhere. For example, it is used for car windows. If there is a car accident, people are safer from sharp pieces of glass.", "Can you clean your clothes without water? The answer is \"yes.\" Dry cleaning uses oil to clean clothes. There's an interesting story about dry cleaning. In the 1800s, a factory worker in France spilled lamp oil on a tablecloth. The factory manager, Mr. Jolly, looked at the tablecloth and found something. \"Wow!\" The dirty spot on the tablecloth was cleaned by the lamp oil! His discovery led to a new way of cleaning clothes. Now, dry cleaning is widely used around the world. These wonderful inventions came by chance. When things go wrong, don't be disappointed. Maybe you can be the next amazing inventor."];var PASS_KO=["우연히 발명된 훌륭한 발명품들", "미국에 Wakefield 씨라는 한 유명한 요리사가 있었다. 1938년 어느 날, 그녀는 초콜릿 쿠키를 굽고 싶었다. 그러나 그녀는 초콜릿을 녹일 충분한 시간이 없었다. “아하!” 그래서 그녀는 초콜릿 바를 작은 조각들로 잘랐다. 그런 다음, 그녀는 그것들을 반죽과 섞었고, 그 쿠키 반죽을 오븐에 넣었다. Wakefield 씨가 오븐을 열었을 때, 그녀는 그 조각들이 반죽에 녹아들지 않은 것을 발견했다. “아, 안 돼!” 비록 그 조각들이 쿠키에 남아 있었지만, 그녀는 실망하지 않았다. 그녀의 새 쿠키들은 정말 맛있었다. 그녀가 초콜릿 ‘칩’ 쿠키를 발명했다!", "1903년에 프랑스의 과학자인 Bénédictus 씨는 유리 플라스크 안에 있는 액체 플라스틱으로 실험을 하고 있었다. 그가 실수로 유리 플라스크를 쳐서 그것이 바닥에 떨어졌다. “이런!” 비록 유리 플라스크는 깨져서 조각났지만, 그것들은 플라스크 모양으로 여전히 함께 붙어 있었다! 어떻게 이런 일이 일어날 수 있었을까? 비밀은 플라스크 안에 있는 액체 플라스틱이었다. 이 발견이 안전유리의 발명으로 이어졌다. 요즘 우리는 어디서나 안전유리를 찾을 수 있다. 예를 들어, 그것은 자동차 창문에 사용된다. 만약 자동차 사고가 난다면 사람들은 날카로운 유리 조각들로부터 더 안전하다.", "물 없이 옷을 세탁할 수 있을까? 정답은 ‘그렇다.’이다. 드라이클리닝은 옷을 세탁하기 위해 기름을 사용한다. 드라이클리닝에 관한 흥미로운 이야기가 있다. 1800년대에 프랑스에서 한 공장 노동자가 테이블보에 등유를 쏟았다. 공장 관리자인 Jolly 씨는 테이블보를 보고 무언가를 발견했다. “와!” 테이블보 위의 더러운 얼룩이 등유에 의해 깨끗해졌다! 그의 발견은 옷을 세탁하는 새로운 방법으로 이어졌다. 이제 드라이클리닝은 전 세계적으로 널리 사용된다. 이 훌륭한 발명품들은 우연히 나왔다. 일이 잘못될 때 실망하지 마라. 아마도 당신이 다음의 놀라운 발명가가 될 수도 있다."];var DG=[{"dlg": [["Reporter", "Juwon, you won the special prize in the invention contest. Great Job!", "주원, 발명 대회에서 특별상을 받았네요. 정말 잘했어요!"], ["Juwon", "Thank you. I’m proud of my invention.", "감사합니다. 저는 제 발명품이 자랑스러워요."], ["Reporter", "What’s your invention?", "당신의 발명품은 무엇인가요?"], ["Juwon", "It’s a recorder which doesn’t bother other people.", "다른 사람들을 방해하지 않는 리코더예요."], ["Reporter", "How does it work? Could you explain more about it?", "그건 어떻게 작동하나요? 그것에 대해 더 설명해 줄 수 있나요?"], ["Juwon", "I connected headphones to the recorder with a simple device. The device sends the sound from the reco   if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}

document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});

function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
