<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 33</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}
.sec{margin:26px 0 8px;font-weight:700;color:var(--pri);font-size:15px;border-left:4px solid var(--pri);padding-left:8px}
.sent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:10px;align-items:flex-start}.n{min-width:24px;color:var(--mut);font-size:13px;padding-top:3px}
.txt{font-size:18px;line-height:2}
.wd{cursor:pointer;border-radius:5px;padding:1px 2px;margin:0 1px;-webkit-tap-highlight-color:transparent}
.wd:hover{background:#eef3f8}.wd.on{background:var(--sel);box-shadow:inset 0 -2px 0 var(--selb)}
.locked .wd{cursor:default}.locked .wd:hover{background:none}
.wd.hit{background:var(--okbg);box-shadow:inset 0 -2px 0 var(--ok)}.wd.miss{background:var(--badbg);box-shadow:inset 0 -2px 0 var(--bad)}.wd.x{text-decoration:line-through;color:var(--mut)}
.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}
.note{margin:10px 0 0 34px;padding:10px 12px;border-radius:8px;font-size:14.5px}
.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<div class="relay" id="relay"></div><div class="rn">RELAY &middot; 앞 단계를 끝내야 다음 단계 오픈</div><div class="bmw"><span id="bm" class="bmk" style="display:none">책갈피 저장됨 &middot; 다음에 이어서 풀기<button type="button">처음부터</button></span></div><div id="app"></div>

<script>
var D=[{"n":1,"tag":null,"en":"You may knows Florence Nightingale as an nurse who helped sick people. But did you also knew that she was good at math?","ko":"여러분은 Florence Nightingale을 아픈 사람들을 도운 간호사라고 알고 있을지 모른다. 그러나 여러분은 그녀가 수학 또한 잘했다는 것을 알고 있었는가?","ok":false,"foot":[],"fixes":[{"wrong":"knows","right":"know","partial":false,"at":[2],"point":"조동사 뒤 동사원형: 조동사 may 뒤에는 동사원형 know 사용","topic":"조동사 뒤 동사원형","memo":"조동사 may 뒤에는 동사원형 know 사용"},{"wrong":"an","right":"a","partial":false,"at":[6],"point":"관사 a/an: nurse는 자음 소리로 시작하므로 a 사용","topic":"관사 a/an","memo":"nurse는 자음 소리로 시작하므로 a 사용"},{"wrong":"knew","right":"know","partial":false,"at":[16],"point":"did 뒤 동사원형: did 뒤에는 동사원형 know 사용","topic":"did 뒤 동사원형","memo":"did 뒤에는 동사원형 know 사용"}]},{"n":2,"tag":null,"en":"When she was young, Nightingale liked playing with number. She enjoyed counting travel time and distance on family trips.","ko":"Nightingale은 어릴 때 숫자를 가지고 노는 것을 좋아했다. 그녀는 가족 여행에서 여행 시간과 거리를 세는 것을 즐겼다.","ok":false,"foot":[],"fixes":[{"wrong":"number","right":"numbers","partial":false,"at":[8],"point":"가산명사 복수형: 여러 숫자이므로 복수 numbers 사용","topic":"가산명사 복수형","memo":"여러 숫자이므로 복수 numbers 사용"}]},{"n":3,"tag":null,"en":"Then she gathered the numbers and record them as data. Nightingale knew that data was important.","ko":"그러고 나서 그녀는 그 숫자들을 모으고 그것들을 데이터로 기록했다. Nightingale은 데이터가 중요하다는 것을 알았다.","ok":false,"foot":[],"fixes":[{"wrong":"record","right":"recorded","partial":false,"at":[6],"point":"시제: 과거 서술이므로 recorded (record 아님)","topic":"시제","memo":"과거 서술이므로 recorded (record 아님)"}]},{"n":4,"tag":null,"en":"She used data to solve problems.","ko":"그녀는 문제를 해결하기 위해 데이터를 사용했다.","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"During the Crimean War, Nightingale went at the battlefield to help sick soldier. The hospital was more worse than she thought.","ko":"크림전쟁 동안 Nightingale은 아픈 군인들을 돕기 위해 전쟁터에 갔다. 병원은 그녀가 생각했던 것보다 훨씬 더 형편없었다.","ok":false,"foot":[],"fixes":[{"wrong":"at","right":"to","partial":false,"at":[6],"point":"기본전치사: went 뒤 방향은 전치사 to 사용","topic":"기본전치사","memo":"went 뒤 방향은 전치사 to 사용"},{"wrong":"soldier","right":"soldiers","partial":false,"at":[12],"point":"명사의 복수형: 여러 병사이므로 복수 soldiers 사용","topic":"명사의 복수형","memo":"여러 병사이므로 복수 soldiers 사용"},{"wrong":"more","right":"much","partial":false,"at":[16],"point":"비교급: worse가 이미 비교급이라 more 없이 much worse 사용","topic":"비교급","memo":"worse가 이미 비교급이라 more 없이 much worse 사용"}]},{"n":6,"tag":null,"en":"It was dirty, messy, and full with bugs! Nightingale knew that dirty hospitals could be bad for the soldiers.","ko":"그것은 더럽고, 지저분하고, 벌레로 가득 차 있었다! Nightingale은 더러운 병원이 군인들에게 안 좋을 수 있다는 것을 알았다.","ok":false,"foot":[],"fixes":[{"wrong":"with","right":"of","partial":false,"at":[6],"point":"기본전치사: \"~로 가득 찬\"은 full of 사용","topic":"기본전치사","memo":"\"~로 가득 찬\"은 full of 사용"}]},{"n":7,"tag":null,"en":"Much soldiers got sick and died in the dirty hospital than in battle. She wanted to change that.","ko":"전투에서보다 더러운 병원에서 더 많은 군인들이 아프고 죽었다. 그녀는 그것을 변화시키고 싶었다.","ok":false,"foot":[],"fixes":[{"wrong":"Much","right":"More","partial":false,"at":[0],"point":"수량 형용사 many/much: 셀 수 있는 soldiers 앞에는 many의 비교급 More 사용","topic":"수량 형용사 many/much","memo":"셀 수 있는 soldiers 앞에는 many의 비교급 More 사용"}]},{"n":8,"tag":null,"en":"She asked England to make the hospital much cleaner and more safer. However, the leaders of England didn't understand.","ko":"그녀는 병원을 훨씬 더 깨끗하고 더 안전하게 만들어달라고 영국에 요청했다. 그러나 영국의 지도자들은 이해하지 못했다.","ok":false,"foot":[],"fixes":[{"wrong":"more safer","right":"safer","partial":false,"at":[10],"point":"비교급: safer는 이미 비교급이므로 more 없이 safer 사용","topic":"비교급","memo":"safer는 이미 비교급이므로 more 없이 safer 사용"}]},{"n":9,"tag":null,"en":"To help they see the problem, she collected data about the number of wounded and dead soldiers.","ko":"그들이 문제를 이해하도록 돕기 위해, 그녀는 부상을 입고 죽은 군인들의 숫자에 대한 데이터를 수집했다.","ok":false,"foot":[],"fixes":[{"wrong":"they","right":"them","partial":false,"at":[2],"point":"인칭대명사의 목적격: 동사 help 뒤에는 목적격 them 사용","topic":"인칭대명사의 목적격","memo":"동사 help 뒤에는 목적격 them 사용"}]},{"n":10,"tag":null,"en":"However, showing her findings with just numbers was difficult.","ko":"그러나 그녀의 조사 결과를 단지 숫자로만 보여주는 것은 어려웠다.","ok":true,"foot":[],"fixes":[]},{"n":11,"tag":null,"en":"To solving this problem, Nightingale created a simple picture. It is called Nightingale's rose diagram.","ko":"문제를 해결하기 위해 Nightingale은 간단한 그림을 만들었다. 그것은 Nightingale의 로즈 다이어그램이라고 불린다.","ok":false,"foot":[],"fixes":[{"wrong":"solving","right":"solve","partial":false,"at":[1],"point":"to부정사: 목적의 to부정사: To solve (To solving 아님)","topic":"to부정사","memo":"목적의 to부정사: To solve (To solving 아님)"}]},{"n":12,"tag":null,"en":"The diagram looked like a rose with twelve petal. Each petal showed a month, and larger petals meant more deaths.","ko":"그 다이어그램은 12개의 꽃잎이 있는 장미처럼 보였다. 각 꽃잎은 한 달을 나타내고, 더 큰 꽃잎은 더 많은 죽음을 의미했다.","ok":false,"foot":[],"fixes":[{"wrong":"petal","right":"petals","partial":false,"at":[8],"point":"수사 뒤 복수명사: twelve 뒤에는 복수명사 petals 사용","topic":"수사 뒤 복수명사","memo":"twelve 뒤에는 복수명사 petals 사용"}]},{"n":13,"tag":null,"en":"In the rose diagram, three different colors was used by Nightingale: blue, red, and black.","ko":"로즈 다이어그램에서 Nightingale에 의해 세 개의 다른 색깔이 사용되었다: 파란색, 빨간색, 그리고 검은색이다.","ok":false,"foot":[],"fixes":[{"wrong":"was","right":"were","partial":false,"at":[7],"point":"수동태: 복수 주어 colors이므로 were used (was 아님)","topic":"수동태","memo":"복수 주어 colors이므로 were used (was 아님)"}]},{"n":14,"tag":null,"en":"Blue is for disease, red are for battle wounds, and black is for other causes. Surprisingly, the blue part was the most large!","ko":"파란색은 질병, 빨간색은 전투 부상, 그리고 검은색은 다른 원인을 나타낸다. 놀랍게도, 파란색 부분이 가장 컸다!","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[5],"point":"주어와 동사의 수일치: 단수 주어 red는 is (are 아님)","topic":"주어와 동사의 수일치","memo":"단수 주어 red는 is (are 아님)"},{"wrong":"most large","right":"largest","partial":false,"at":[21],"point":"최상급: large의 최상급은 the largest 사용","topic":"최상급","memo":"large의 최상급은 the largest 사용"}]},{"n":15,"tag":null,"en":"Nightingale used this diagram to show her data simple and clearly. She was very smart and creative.","ko":"Nightingale은 그녀의 데이터를 간단하고 분명히 보여 주기 위해 이 다이어그램을 사용했다. 그녀는 매우 똑똑하고 창의적이었다.","ok":false,"foot":[],"fixes":[{"wrong":"simple","right":"simply","partial":false,"at":[8],"point":"형용사와 부사: 동사 show를 꾸미는 말은 부사 simply 사용","topic":"형용사와 부사","memo":"동사 show를 꾸미는 말은 부사 simply 사용"}]}];var PP=[["You may know Florence Nightingale as a nurse who helped sick people.","여러분은 Florence Nightingale을 아픈 사람들을 도운 간호사라고 알고 있을지 모른다.",1],["But did you also know that she was good at math?","그러나 여러분은 그녀가 수학 또한 잘했다는 것을 알고 있었는가?",0],["When she was young, Nightingale liked playing with numbers.","Nightingale은 어릴 때 숫자를 가지고 노는 것을 좋아했다.",0],["She enjoyed counting travel time and distance on family trips.","그녀는 가족 여행에서 여행 시간과 거리를 세는 것을 즐겼다.",0],["Then she gathered the numbers and recorded them as data.","그러고 나서 그녀는 그 숫자들을 모으고 그것들을 데이터로 기록했다.",0],["Nightingale knew that data was important.","Nightingale은 데이터가 중요하다는 것을 알았다.",0],["She used data to solve problems.","그녀는 문제를 해결하기 위해 데이터를 사용했다.",0],["During the Crimean War, Nightingale went to the battlefield to help sick soldiers.","크림전쟁 동안 Nightingale은 아픈 군인들을 돕기 위해 전쟁터에 갔다.",1],["The hospital was much worse than she thought.","병원은 그녀가 생각했던 것보다 훨씬 더 형편없었다.",0],["It was dirty, messy, and full of bugs!","그것은 더럽고, 지저분하고, 벌레로 가득 차 있었다!",0],["Nightingale knew that dirty hospitals could be bad for the soldiers.","Nightingale은 더러운 병원이 군인들에게 안 좋을 수 있다는 것을 알았다.",0],["More soldiers got sick and died in the dirty hospital than in battle.","전투에서보다 더러운 병원에서 더 많은 군인들이 아프고 죽었다.",0],["She wanted to change that.","그녀는 그것을 변화시키고 싶었다.",0],["She asked England to make the hospital much cleaner and safer.","그녀는 병원을 훨씬 더 깨끗하고 더 안전하게 만들어달라고 영국에 요청했다.",0],["However, the leaders of England didn't understand.","그러나 영국의 지도자들은 이해하지 못했다.",0],["To help them see the problem, she collected data about the number of wounded and dead soldiers.","그들이 문제를 이해하도록 돕기 위해, 그녀는 부상을 입고 죽은 군인들의 숫자에 대한 데이터를 수집했다.",0],["However, showing her findings with just numbers was difficult.","그러나 그녀의 조사 결과를 단지 숫자로만 보여주는 것은 어려웠다.",0],["To solve this problem, Nightingale created a simple picture.","문제를 해결하기 위해 Nightingale은 간단한 그림을 만들었다.",1],["It is called Nightingale's rose diagram.","그것은 Nightingale의 로즈 다이어그램이라고 불린다.",0],["The diagram looked like a rose with twelve petals.","그 다이어그램은 12개의 꽃잎이 있는 장미처럼 보였다.",0],["Each petal showed a month, and larger petals meant more deaths.","각 꽃잎은 한 달을 나타내고, 더 큰 꽃잎은 더 많은 죽음을 의미했다.",0],["In the rose diagram, three different colors were used by Nightingale: blue, red, and black.","로즈 다이어그램에서 Nightingale에 의해 세 개의 다른 색깔이 사용되었다: 파란색, 빨간색, 그리고 검은색이다.",0],["Blue is for disease, red is for battle wounds, and black is for other causes.","파란색은 질병, 빨간색은 전투 부상, 그리고 검은색은 다른 원인을 나타낸다.",0],["Surprisingly, the blue part was the largest!","놀랍게도, 파란색 부분이 가장 컸다!",0],["Nightingale used this diagram to show her data simply and clearly.","Nightingale은 그녀의 데이터를 간단하고 분명히 보여 주기 위해 이 다이어그램을 사용했다.",0],["She was very smart and creative.","그녀는 매우 똑똑하고 창의적이었다.",0]];var RNUM=33;var TITLE_EN="Data Saved Thousands of Lives";var PASS_EN=["Data Saved Thousands of Lives","You may know Florence Nightingale as a nurse who helped sick people. But did you also know that she was good at math? When she was young, Nightingale liked playing with numbers. She enjoyed counting travel time and distance on family trips. Then she gathered the numbers and recorded them as data. Nightingale knew that data was important. She used data to solve problems.","During the Crimean War, Nightingale went to the battlefield to help sick soldiers. The hospital was much worse than she thought. It was dirty, messy, and full of bugs! Nightingale knew that dirty hospitals could be bad for the soldiers. More soldiers got sick and died in the dirty hospital than in battle. She wanted to change that. She asked England to make the hospital much cleaner and safer. However, the leaders of England didn't understand. To help them see the problem, she collected data about the number of wounded and dead soldiers. However, showing her findings with just numbers was difficult.","To solve this problem, Nightingale created a simple picture. It is called Nightingale's rose diagram. The diagram looked like a rose with twelve petals. Each petal showed a month, and larger petals meant more deaths. In the rose diagram, three different colors were used by Nightingale: blue, red, and black. Blue is for disease, red is for battle wounds, and black is for other causes. Surprisingly, the blue part was the largest! Nightingale used this diagram to show her data simply and clearly. She was very smart and creative."];var PASS_KO=["데이터가 수천 명의 목숨을 구했다","여러분은 Florence Nightingale을 아픈 사람들을 도운 간호사라고 알고 있을지 모른다. 그러나 여러분은 그녀가 수학 또한 잘했다는 것을 알고 있었는가? Nightingale은 어릴 때 숫자를 가지고 노는 것을 좋아했다. 그녀는 가족 여행에서 여행 시간과 거리를 세는 것을 즐겼다. 그러고 나서 그녀는 그 숫자들을 모으고 그것들을 데이터로 기록했다. Nightingale은 데이터가 중요하다는 것을 알았다. 그녀는 문제를 해결하기 위해 데이터를 사용했다.","크림전쟁 동안 Nightingale은 아픈 군인들을 돕기 위해 전쟁터에 갔다. 병원은 그녀가 생각했던 것보다 훨씬 더 형편없었다. 그것은 더럽고, 지저분하고, 벌레로 가득 차 있었다! Nightingale은 더러운 병원이 군인들에게 안 좋을 수 있다는 것을 알았다. 전투에서보다 더러운 병원에서 더 많은 군인들이 아프고 죽었다. 그녀는 그것을 변화시키고 싶었다. 그녀는 병원을 훨씬 더 깨끗하고 더 안전하게 만들어달라고 영국에 요청했다. 그러나 영국의 지도자들은 이해하지 못했다. 그들이 문제를 이해하도록 돕기 위해, 그녀는 부상을 입고 죽은 군인들의 숫자에 대한 데이터를 수집했다. 그러나 그녀의 조사 결과를 단지 숫자로만 보여주는 것은 어려웠다.","문제를 해결하기 위해 Nightingale은 간단한 그림을 만들었다. 그것은 Nightingale의 로즈 다이어그램이라고 불린다. 그 다이어그램은 12개의 꽃잎이 있는 장미처럼 보였다. 각 꽃잎은 한 달을 나타내고, 더 큰 꽃잎은 더 많은 죽음을 의미했다. 로즈 다이어그램에서 Nightingale에 의해 세 개의 다른 색깔이 사용되었다: 파란색, 빨간색, 그리고 검은색이다. 파란색은 질병, 빨간색은 전투 부상, 그리고 검은색은 다른 원인을 나타낸다. 놀랍게도, 파란색 부분이 가장 컸다! Nightingale은 그녀의 데이터를 간단하고 분명히 보여 주기 위해 이 다이어그램을 사용했다. 그녀는 매우 똑똑하고 창의적이었다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["The boy is checking the app to get real-time bus information.","The girl wants to know the current location of their bus.","The bus for the speakers is one stop away.","The girl thinks that the bus will arrive in about two minutes.","The speakers are worried they will be late for school."],"a":4,"ans":"The speakers are worried they will be late for school.","evs":[["B: Great! We'll be on time for school.","잘됐다! 우리 학교에 제시간에 도착하겠어."],["G: Oh, it will arrive in about two minutes then.","아, 그럼 2분쯤 뒤에 도착하겠네."]],"ev":["B: Great! We'll be on time for school.","잘됐다! 우리 학교에 제시간에 도착하겠어."],"ow":["오답 ✕ — 소년이 'I'll check the bus app.'(내가 버스 앱을 확인해 볼게.)라고 했으므로 앱으로 버스 정보를 확인하는 것은 일치함.","오답 ✕ — 소녀가 'How far away is our bus?'(우리 버스는 얼마나 멀리 있어?)라고 물었으므로 버스의 현재 위치를 알고 싶어 하는 것은 일치함.","오답 ✕ — 소년이 'It's one stop away.'(한 정거장 거리에 있어.)라고 했으므로 일치함.","오답 ✕ — 소녀가 'it will arrive in about two minutes then'(그럼 2분쯤 뒤에 도착하겠네)라고 했으므로 일치함.","정답 ○ — 소년이 'We'll be on time for school.'(우리 학교에 제시간에 도착하겠어.)이라고 했으므로 지각을 걱정하는 것이 아니라 제시간에 도착해서 안심하고 있음. 걱정한다는 보기는 일치하지 않음."],"memo":["정답 ⑤: 두 사람은 학교에 늦을까 봐 걱정한다. (✕ 불일치)","근거: Great! We'll be on time for school.(잘됐다! 학교에 제시간에 도착하겠어.)","함정: on time(제시간에)은 늦지 않는다는 뜻이다."],"why":"버스가 곧 도착해서 제시간에 갈 수 있으므로 늦을까 봐 걱정한다는 말은 틀리다."}],"dlg":[["G","I'm curious about the bus schedule.","나는 버스 시간표가 궁금해."],["B","I'll check the bus app.","내가 버스 앱을 확인해 볼게."],["G","How far away is our bus?","우리 버스는 얼마나 멀리 있어?"],["B","It's one stop away.","한 정거장 거리에 있어."],["G","Oh, it will arrive in about two minutes then.","아, 그럼 2분쯤 뒤에 도착하겠네."],["B","Great! We'll be on time for school.","잘됐다! 우리 학교에 제시간에 도착하겠어."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하는 것은?","o":["오늘 아침은 매우 덥다.","오늘 오후에는 비가 올 것이다.","오늘 오후 기온은 25도까지 오를 것이다.","오늘은 하루 종일 화창할 것이다.","Ethan은 내일 날씨가 궁금하다."],"a":3,"ans":"오늘은 하루 종일 화창할 것이다.","evs":[["W: No. It's going to be sunny all day.","W: 아니요. 하루 종일 화창할 거예요."]],"ev":["W: No. It's going to be sunny all day.","W: 아니요. 하루 종일 화창할 거예요."],"ow":["오답 ✕ — 'This morning is cool'(오늘 아침은 선선하다)이라고 했으므로 매우 덥다는 말은 틀림.","오답 ✕ — 비가 올 가능성을 묻자 'No.'(아니요.)라고 답했으므로 비가 온다는 말은 틀림.","오답 ✕ — 'it'll warm up to 32 degrees this afternoon'(오후에는 32도까지 따뜻해질 거예요)이라고 했으므로 25도가 아니라 32도이다.","정답 ○ — 'It's going to be sunny all day.'(하루 종일 화창할 거예요.)라고 했으므로 맞다 ,"좋아. 'Animal Adventure'는 다음에 보면 되지."]]}];var BG=[{"qs":[{"n":6,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["math - data","math - songs","art - data","science - maps","music - data"],"a":0,"ans":"math - data","evs":[["But did you also know that she was good at math?","그러나 여러분은 그녀가 수학 또한 잘했다는 것을 알고 있었는가?"],["Then she gathered the numbers and recorded them as data.","그러고 나서 그녀는 그 숫자들을 모으고 그것들을 데이터로 기록했다."]],"ev":["But did you also know that she was good at math?","그러나 여러분은 그녀가 수학 또한 잘했다는 것을 알고 있었는가?"],"ow":["정답 ○ — 'did you also know that she was good at math?'(그녀가 수학 또한 잘했다는 것을 알고 있었는가?)에서 (A)는 math, 'recorded them as data'(그것들을 데이터로 기록했다)에서 (B)는 data이므로 맞음.","오답 ✕ — (A)의 math는 맞지만, 숫자들을 기록한 것은 'data'(데이터)이지 songs(노래)가 아님.","오답 ✕ — 'she was good at math'(그녀는 수학을 잘했다)라고 했으므로 (A)의 art(미술)는 틀림. (B)의 data는 맞음.","오답 ✕ — 'math'를 잘했다고 했으므로 science(과학)는 틀리고, 숫자를 기록한 것은 maps(지도)가 아니라 data임.","오답 ✕ — 글에 music(음악)에 대한 언급이 없고 'good at math'가 맞음. (B)의 data는 맞음."],"memo":["정답 ①: 수학(math)을 잘했고 숫자를 데이터(data)로 기록했다.","근거: she was good at math(그녀는 수학을 잘했다) / recorded them as data(데이터로 기록했다)","함정: 둘 중 하나만 맞는 보기가 많으니 (A), (B) 둘 다 확인한다."],"why":"Nightingale은 수학을 잘했고 숫자를 모아 데이터로 기록했다.","sum":"Nightingale was a nurse who was also good at (A). She gathered numbers and recorded them as (B).","lab":"완성된 요약문 : "}],"pp":[["You may know Florence Nightingale as a nurse who helped sick people.","여러분은 Florence Nightingale을 아픈 사람들을 도운 간호사라고 알고 있을지 모른다."],["But did you also know that she was good at math?","그러나 여러분은 그녀가 수학 또한 잘했다는 것을 알고 있었는가?"],["When she was young, Nightingale liked playing with numbers.","Nightingale은 어릴 때 숫자를 가지고 노는 것을 좋아했다."],["She enjoyed counting travel time and distance on family trips.","그녀는 가족 여행에서 여행 시간과 거리를 세는 것을 즐겼다."],["Then she gathered the numbers and recorded them as data.","그러고 나서 그녀는 그 숫자들을 모으고 그것들을 데이터로 기록했다."],["Nightingale knew that data was important.","Nightingale은 데이터가 중요하다는 것을 알았다."],["She used data to solve problems.","그녀는 문제를 해결하기 위해 데이터를 사용했다."]]},{"qs":[{"n":7,"q":"윗글의 내용과 일치하는 것은?","o":["Nightingale took part in the Crimean War as a soldier.","Nightingale found out that the hospital wasn't clean and safe for the patients.","More soldiers died in battle than in the hospital.","The leaders of England accepted Nightingale's request at once.","Nightingale gathered data about dead soldiers to find out the causes of their deaths."],"a":1,"ans":"Nightingale found out that the hospital wasn't clean and safe for the patients.","evs":[["The hospital was much worse than she thought.","병원은 그녀가 생각했던 것보다 훨씬 더 형편없었다."],["It was dirty, messy, and full of bugs!","그것은 더럽고, 지저분하고, 벌레로 가득 차 있었다!"],["To help them see the problem, she collected data about the number of wounded and dead soldiers.","그들이 문제를 이해하도록 돕기 위해, 그녀는 부상을 입고 죽은 군인들의 숫자에 대한 데이터를 수집했다."]],"ev":["The hospital was much worse than she thought.","병원은 그녀가 생각했던 것보다 훨씬 더 형편없었다."],"ow":["오답 ✕ — 'Nightingale went to the battlefield to help sick soldiers.'(아픈 군인들을 돕기 위해 전쟁터에 갔다.)라고 했으므로 군인이 아니라 아픈 군인들을 도우러 간 것임.","정답 ○ — 병원이 'dirty, messy, and full of bugs'(더럽고 지저분하고 벌레로 가득했다)였고 'cleaner and safer'(더 깨끗하고 더 안전하게)가 필요하다고 했으므로 병원이 깨끗하지도 안전하지도 않았다는 것을 알아냈음.","오답 ✕ — 'More soldiers got sick and died in the dirty hospital than in battle.'(전투에서보다 더러운 병원에서 더 많은 군인들이 아프고 죽었다.)라고 했으므로 전투가 아니라 병원에서 더 많이 죽었음.","오답 ✕ — 'However, the leaders of England didn't understand.'(그러나 영국의 지도자들은 이해하지 못했다.)라고 했으므로 즉시 받아들였다는 보기는 반대임.","오답 ✕ — 'To help them see the problem, she collected data'(그들이 문제를 이해하도록 돕기 위해 데이터를 수집했다)라고 했으므로 죽음의 원인을 찾으려는 것이 아니라 지도자들을 이해시키려는 것이 목적임."],"memo":["정답 ②: Nightingale은 병원이 환자들에게 깨끗하지도 안전하지도 않다는 것을 알아냈다.","근거: It was dirty, messy, and full of bugs!(그곳은 더럽고, 지저분하고, 벌레로 가득했다!)","함정: ③ 전투보다 병원에서 더 많이 죽었다. ⑤ 데이터는 지도자들을 이해시키기 위한 것이다."],"why":"Nightingale은 병원이 더럽고 위험하다는 것을 알아내고 개선을 요청했다."},{"n":8,"q":"윗글에서 Nightingale이 부상을 입고 죽은 군인들의 숫자에 대한 데이터를 수집한 이유로 알맞은 것은?","o":["영국의 지도자들이 문제를 이해하도록 돕기 위해","군인들에게 새 무기를 만들어 주기 위해","전쟁에서 이기는 방법을 찾기 위해","간호사를 더 많이 뽑기 위해","자신의 업적을 자랑하기 위해"],"a":0,"ans":"영국의 지도자들이 문제를 이해하도록 돕기 위해","evs":[["However, the leaders of England didn't understand.","그러나 영국의 지도자들은 이해하지 못했다."],["To help them see the problem, she collected data about the number of wounded and dead soldiers.","그들이 문제를 이해하도록 돕기 위해, 그녀는 부상을 입고 죽은 군인들의 숫자에 대한 데이터를 수집했다."]],"ev":["However, the leaders of England didn't understand.","그러나 영국의 지도자들은 이해하지 못했다."],"ow":["정답 ○ — 'the leaders of England didn't understand'(영국의 지도자들은 이해하지 못했다) 그래서 'To help them see the problem, she collected data'(그들이 문제를 이해하도록 돕기 위해 데이터를 수집했다)라고 했으므로 맞음.","오답 ✕ — 새 무기에 대한 언급이 전혀 없다. 데이터는 병원 문제를 보여 주기 위한 것임.","오답 ✕ — 전쟁에서 이기는 방법은 글에 없다. 그녀는 'to help sick soldiers'(아픈 군인들을 돕기 위해) 전쟁터에 갔음.","오답 ✕ — 간호사를 뽑는다는 내용은 없고, 그녀가 요청한 것은 'make the hospital much cleaner and safer'(병원을 훨씬 더 깨끗하고 안전하게 만드는 것)임.","오답 ✕ — 자랑하려는 것이 아니라 문제를 이해시키려는 것이다. 'To help them see the problem'(그들이 문제를 이해하도록 돕기 위해)에 어긋남."],"memo":["정답 ①: 영국의 지도자들이 문제를 이해하도록 돕기 위해","근거: To help them see the problem, she collected data(그들이 문제를 이해하도록 돕기 위해 데이터를 수집했다)","함정: 'To + 동사'는 '~하기 위해'(목적)를 나타낸다."],"why":"영국 지도자들이 병원의 문제를 이해하지 못해서 데이터를 모아 보여 주려 했다."}],"pp":[["During the Crimean War, Nightingale went to the battlefield to help sick soldiers.","크림전쟁 동안 Nightingale은 아픈 군인들을 돕기 위해 전쟁터에 갔다."],["The hospital was much worse than she thought.","병원은 그녀가 생각했던 것보다 훨씬 더 형편없었다."],["It was dirty, messy, and full of bugs!","그것은 더럽고, 지저분하고, 벌레로 가득 차 있었다!"],["Nightingale knew that dirty hospitals could be bad for the soldiers.","Nightingale은 더러운 병원이 군인들에게 안 좋을 수 있다는 것을 알았다."],["More soldiers got sick and died in the dirty hospital than in battle.","전투에서보다 더러운 병원에서 더 많은 군인들이 아프고 죽었다."],["She wanted to change that.","그녀는 그것을 변화시키고 싶었다."],["She asked England to make the hospital much cleaner and safer.","그녀는 병원을 훨씬 더 깨끗하고 더 안전하게 만들어달라고 영국에 요청했다."],["However, the leaders of England didn't understand.","그러나 영국의 지도자들은 이해하지 못했다."],["To help them see the problem, she collected data about the number of wounded and dead soldiers.","그들이 문제를 이해하도록 돕기 위해, 그녀는 부상을 입고 죽은 군인들의 숫자에 대한 데이터를 수집했다."]]},{"qs":[{"n":9,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["numbers - blue","numbers - red","pictures - blue","words - black","numbers - black"],"a":0,"ans":"numbers - blue","evs":[["However, showing her findings with just numbers was difficult.","그러나 그녀의 조사 결과를 단지 숫자로만 보여주는 것은 어려웠다."],["Surprisingly, the blue part was the largest!","놀랍게도, 파란색 부분이 가장 컸다!"]],"ev":["However, showing her findings with just numbers was difficult.","그러나 그녀의 조사 결과를 단지 숫자로만 보여주는 것은 어려웠다."],"ow":["정답 ○ — 'showing her findings with just numbers was difficult'(조사 결과를 단지 숫자로만 보여주는 것은 어려웠다)에서 (A)는 numbers, 'the blue part was the largest!'(파란색 부분이 가장 컸다!)에서 (B)는 blue이므로 맞음.","오답 ✕ — (A)의 numbers는 맞지만, 'Blue is for disease, red is for battle wounds'(파란색은 질병, 빨간색은 전투 부상)이고 가장 큰 부분은 파란색이므로 red는 틀림.","오답 ✕ — 어려웠던 것은 숫자'만'으로 보여 주는 것이었고, 그림(picture)은 그 문제의 해결책이었다. (B)의 blue는 맞음.","오답 ✕ — 어려웠던 것은 words가 아니라 numbers이고, 가장 큰 부분도 black이 아니라 blue임.","오답 ✕ — (A)의 numbers는 맞지만 'Blue is for disease... black is for other causes.'에서 가장 큰 부분은 black이 아니라 blue(파란색)임."],"memo":["정답 ①: 숫자(numbers)만으로 보여 주기 어려워서 다이어그램을 만들었고, 가장 큰 부분은 파란색(blue)이다.","근거: Surprisingly, the blue part was the largest!(놀랍게도 파란색 부분이 가장 컸다!)","함정: 파란색=질병, 빨간색=전투 부상, 검은색=다른 원인."],"why":"숫자만으로 설명하기 어려워 만든 로즈 다이어그램에서 파란색(질병) 부분이 가장 컸다.","sum":"Showing her findings with just (A) was difficult, so Nightingale made a rose diagram. In it, the (B) part was the largest.","lab":"완성된 요약문 : "},{"n":10,"q":"윗글의 로즈 다이어그램에 대한 내용과 일치하지 않는 것은?","o":["12개의 꽃잎이 있는 장미처럼 보였다.","각 꽃잎은 한 달을 나타냈다.","더 큰 꽃잎은 더 많은 죽음을 의미했다.","빨간색 부분이 가장 컸다.","세 가지 다른 색깔이 사용되었다."],"a":3,"ans":"빨간색 부분이 가장 컸다.","evs":[["The diagram looked like a rose with twelve petals.","그 다이어그램은 12개의 꽃잎이 있는 장미처럼 보였다."],["Each petal showed a month, and larger petals meant more deaths.","각 꽃잎은 한 달을 나타내고, 더 큰 꽃잎은 더 많은 죽음을 의미했다."],["Surprisingly, the blue part was the largest!","놀랍게도, 파란색 부분이 가장 컸다!"]],"ev":["The diagram looked like a rose with twelve petals.","그 다이어그램은 12개의 꽃잎이 있는 장미처럼 보였다."],"ow":["오답 ✕ — 'The diagram looked like a rose with twelve petals.'(그 다이어그램은 12개의 꽃잎이 있는 장미처럼 보였다.)라고 했으므로 일치함.","오답 ✕ — 'Each petal showed a month'(각 꽃잎은 한 달을 나타냈다)라고 했으므로 일치함.","오답 ✕ — 'larger petals meant more deaths'(더 큰 꽃잎은 더 많은 죽음을 의미했다)라고 했으므로 일치함.","정답 ○ — 'Surprisingly, the blue part was the largest!'(놀랍게도 파란색 부분이 가장 컸다!)라고 했다. 빨간색(전투 부상)이 아니라 파란색(질병)이 가장 컸으므로 일치하지 않음.","오답 ✕ — 'three different colors were used'(세 개의 다른 색깔이 사용되었다: 파란색, 빨간색, 검은색)라고 했으므로 일치함."],"memo":["정답 ④: 빨간색 부분이 가장 컸다. (✕ 불일치)","근거: Surprisingly, the blue part was the largest!(놀랍게도 파란색 부분이 가장 컸다!)","함정: 가장 큰 색은 파란색(질병)이고 빨간색은 전투 부상이다."],"why":"가장 큰 부분은 빨간색이 아니라 질병을 나타내는 파란색이었다."}],"pp":[["However, showing her findings with just numbers was difficult.","그러나 그녀의 조사 결과를 단지 숫자로만 보여주는 것은 어려웠다."],["To solve this problem, Nightingale created a simple picture.","문제를 해결하기 위해 Nightingale은 간단한 그림을 만들었다."],["It is called Nightingale's rose diagram.","그것은 Nightingale의 로즈 다이어그램이라고 불린다."],["The diagram looked like a rose with twelve petals.","그 다이어그램은 12개의 꽃잎이 있는 장미처럼 보였다."],["Each petal showed a month, and larger petals meant more deaths.","각 꽃잎은 한 달을 나타내고, 더 큰 꽃잎은 더 많은 죽음을 의미했다."],["In the rose diagram, three different colors were used by Nightingale: blue, red, and black.","로즈 다이어그램에서 Nightingale에 의해 세 개의 다른 색깔이 사용되었다: 파란색, 빨간색, 그리고 검은색이다."],["Blue is for disease, red is for battle wounds, and black is for other causes.","파란색은 질병, 빨간색은 전투 부상, 그리고 검은색은 다른 원인을 나타낸다."],["Surprisingly, the blue part was the largest!","놀랍게도, 파란색 부분이 가장 컸다!"],["Nightingale used this diagram to show her data simply and clearly.","Nightingale은 그녀의 데이터를 간단하고 분명히 보여 주기 위해 이 다이어그램을 사용했다."],["She was very smart and creative.","그녀는 매우 똑똑하고 창의적이었다."]]}];
var BK='m2-find-r'+RNUM+'-best';
var secs=[],cur=null;
D.forEach(function(it,i){if(it.tag||!cur){cur={name:it.tag||'',items:[]};secs.push(cur)}cur.items.push(i)});
var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
