ger call her “Perfect Girl.”","이제, 사람들은 더 이상 그녀를 ‘완벽한 소녀’라고 부르지 않는다.",1],["They just call her Beatrice.","그들은 그녀를 그저 Beatrice라고 부른다.",0]];var RNUM=71;var TITLE_EN="The Story of a Perfect Girl";var PASS_EN=["The Story of a Perfect Girl","For Beatrice, Friday began like any other day. She wore the same white socks on both of her feet. Then she made a sandwich. She put exactly the same amount of peanut butter on each piece of bread.","On her way to school, her neighbor said, “Good morning, Perfect Girl.” People called Beatrice “Perfect Girl” because she never made mistakes. “Are you ready for tonight’s talent show?” her neighbor asked. Beatrice just smiled. She was a juggling champion. She won the talent show every year. How wonderful she was!","At school, Beatrice had a cooking class. To make a cake, she carefully took some eggs out of the refrigerator. When she turned around, she stepped on something slippery. She was about to fall! But she didn’t. “That was close!” she thought. She almost made a mistake. Because of this, she began to feel nervous.","It was time for the talent show. The school gym was full of people. They said, “Look! That’s Perfect Girl!” Beatrice had butterflies in her stomach. “Will I mess up? I’m worried,” she thought.","Beatrice threw an egg into the air. Next, she added a salt shaker. Finally, she added a water balloon. What a good start! But then she felt something strange… Uh-oh! Beatrice’s nose started to itch. The salt shaker was full of… pepper! “ACHOO!” Beatrice missed the water balloon, and it fell to the floor. Then… OOPS! The egg broke on top of her head.","For the first time ever, Beatrice made a mistake. What a surprise! She thought, “What should I do? Cry? Run off the stage?” Suddenly, she began to laugh loudly. The people looked at each other. Then everyone started to laugh together.","That night, Beatrice had a deep sleep. The next morning, she woke up with a smile. She put a white sock on her left foot… and a green sock on her right foot!","Now, people no longer call her “Perfect Girl.” They just call her Beatrice."];var PASS_KO=["어느 완벽한 소녀의 이야기","Beatrice에게 금요일은 어느 다른 날처럼 시작되었다. 그녀는 그녀의 양쪽 발에 똑같은 흰 양말을 신었다. 그러고 나서 그녀는 샌드위치를 만들었다. 그녀는 각 빵 조각에 정확히 같은 양의 땅콩버터를 발랐다.","학교에 가는 길에, 그녀의 이웃이 “좋은 아침이야, 완벽한 소녀.”라고 말했다. Beatrice는 한 번도 실수를 하지 않았기 때문에 사람들은 그녀를 ‘완벽한 소녀’라고 불렀다. “오늘 밤 장기 자랑 준비됐니?”라고 그녀의 이웃이 물었다. Beatrice는 그저 미소를 지었다. 그녀는 저글링 챔피언이었다. 그녀는 매년 장기 자랑에서 우승했다. 그녀는 참 멋졌다!","학교에서 Beatrice는 요리 수업을 들었다. 케이크를 만들기 위해, 그녀는 조심스럽게 냉장고에서 달걀 몇 개를 꺼냈다. 그녀가 뒤돌아보았을 때, 그녀는 미끄러운 무언가를 밟았다. 그녀는 막 넘어지려고 했다! 하지만 그녀는 그러지 않았다. ‘아슬아슬했어!’라고 그녀는 생각했다. 그녀는 거의 실수할 뻔했다. 이것 때문에, 그녀는 불안을 느끼기 시작했다.","장기 자랑 시간이 되었다. 학교 체육관은 사람들로 가득 찼다. 그들은 “저기 봐! 저기 완벽한 소녀야!”라고 말했다. Beatrice는 마음이 편치 않았다. ‘내가 망칠까? 난 걱정돼.’라고 그녀는 생각했다.","Beatrice는 공중으로 달걀을 던졌다. 다음으로, 그녀는 소금 통을 추가했다. 마지막으로, 그녀는 물풍선을 추가했다. 참 좋은 시작이었다! 하지만 그다음에 그녀는 무언가 이상함을 느꼈다… 이런! Beatrice의 코가 간지럽기 시작했다. 그 소금 통은 가득 차 있었다… 후추로! “에취!” Beatrice는 물풍선을 놓쳤고, 그것은 바닥으로 떨어졌다. 그러고 나서… 어이쿠! 달걀이 그녀의 머리 위에서 깨졌다.","난생처음으로, Beatrice는 실수를 했다. 정말 놀라운 일이었다! 그녀는 ‘내가 무엇을 해야 하지? 울까? 무대에서 도망칠까?’라고 생각했다. 갑자기, 그녀는 큰 소리로 웃기 시작했다. 사람들은 서로를 바라보았다. 그러더니 모두 함께 웃기 시작했다.","그날 밤, Beatrice는 깊은 잠을 잤다. 다음 날 아침, 그녀는 미소를 지으며 일어났다. 그녀는 왼발에 흰 양말을 신었다… 그리고 오른발에는 초록색 양말을 신었다!","이제, 사람들은 더 이상 그녀를 ‘완벽한 소녀’라고 부르지 않는다. 그들은 그녀를 그저 Beatrice라고 부른다."];var DG=[{"dlg":[["G","Excuse me. I’m trying to choose a book. Can you help me?","실례합니다. 제가 책을 고르려고 하는데요. 저를 도와주실 수 있나요?"],["M","Sure. What kind of book are you looking for?","물론이죠. 어떤 종류의 책을 찾고 있나요?"],["G","Well, I want to read about animals.","음, 저는 동물에 관한 책을 읽고 싶어요."],["M","Okay. Books about animals are on this shelf. What kind of animals are you interested in?","좋아요. 동물에 관한 책들은 이 책장에 있어요. 어떤 종류의 동물에 관심이 있나요?"],["G","I’m curious about sea life.","저는 바다 생물이 궁금해요."],["M","Then what about this book, The Blue Planet? It’s about animals in the deep sea.","그럼 이 책, The Blue Planet은 어때요? 깊은 바다에 사는 동물들에 관한 책이에요."],["G","That sounds perfect. Thank you.","아주 좋아요. 감사합니다."],["M","You’re welcom
