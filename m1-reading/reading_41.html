g happy moments. Selfies capture the expressions on our faces at those times.", "ko": "우리는 행복한 순간을 기억하기 위해 셀피를 찍습니다. 셀피는 그런 때의 우리 얼굴 표정을 포착합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "remembering", "right": "remember", "partial": false, "at": [4], "point": "to부정사: 목적을 나타내는 to부정사: to remember (remembering 아님)", "topic": "to부정사", "memo": "목적을 나타내는 to부정사: to remember (remembering 아님)"}]}, {"n": 8, "tag": null, "en": "We often look at selfie with our family and friends to bringing back those joyful feelings.", "ko": "우리는 그런 즐거운 감정을 되살리기 위해 우리의 가족과 친구들과 함께 셀피를 자주 봅니다.", "ok": false, "foot": [], "fixes": [{"wrong": "selfie", "right": "selfies", "partial": false, "at": [4], "point": "명사의 복수형: 복수 selfies 사용", "topic": "명사의 복수형", "memo": "복수 selfies 사용"}, {"wrong": "bringing", "right": "bring", "partial": false, "at": [11], "point": "to부정사: to 뒤에는 동사원형 bring 사용", "topic": "to부정사", "memo": "to 뒤에는 동사원형 bring 사용"}]}, {"n": 9, "tag": null, "en": "Similarly, some painter made self-portraits to capture different times in their lives.", "ko": "마찬가지로, 몇몇 화가들은 그들의 삶에서 다른 시기를 포착하기 위해 자화상을 만들었습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "painter", "right": "painters", "partial": false, "at": [2], "point": "명사의 복수형: some 뒤에는 복수명사 painters 사용", "topic": "명사의 복수형", "memo": "some 뒤에는 복수명사 painters 사용"}]}, {"n": 10, "tag": null, "en": "Rembrandt looked in the mirror and painted himself many times. He painted around 90 self-portraits in him life.", "ko": "렘브란트는 거울을 보고 자기 자신을 여러 번 그렸습니다. 그는 그의 일생에서 약 90점의 자화상을 그렸습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "him", "right": "his", "partial": false, "at": [16], "point": "인칭대명사의 격: 명사 앞 소유격 his 사용 (him 아님)", "topic": "인칭대명사의 격", "memo": "명사 앞 소유격 his 사용 (him 아님)"}]}, {"n": 11, "tag": null, "en": "They show his face from youth to old age.", "ko": "그것들은 젊은 시절부터 노년까지 그의 얼굴을 보여 줍니다.", "ok": true, "foot": [], "fixes": []}, {"n": 12, "tag": null, "en": "Selfies and self-portraits also has differences.", "ko": "셀피와 자화상에는 차이점도 있습니다 s.", "Selfies and self-portraits are similar.", "Both show our image at a certain time. When we look at them, we can remember ourselves from that time. They are like a diary.", "We take selfies to remember happy moments. Selfies capture the expressions on our faces at those times. We often look at selfies with our family and friends to bring back those joyful feelings.", "Similarly, some painters made self-portraits to capture different times in their lives. Rembrandt looked in the mirror and painted himself many times. He painted around 90 self-portraits in his life. They show his face from youth to old age.", "Selfies and self-portraits also have differences.", "Taking a selfie is easy. We can do it quickly with our camera at any time. However, painting a self-portrait takes some time. Also, a self-portrait shows a painter's personal painting style.", "To paint a person, a painter needs a model. Vincent van Gogh didn't have enough money for a model. So he painted himself! When he painted his self-portraits, he chose bright colors and applied a lot of paint. This became his unique style. We can see it in his other paintings too.", "We can express ourselves with selfies and self-portraits. Do you want to try?"];var PASS_KO=["자화상에서 자가 촬영까지", "오늘날, 사람들은 셀피 찍는 것을 즐깁니다. 우리는 그것들로 특별한 순간을 포착할 수 있습니다.", "오래전, 사람들은 다른 방식으로 그들 자신의 모습을 포착했습니다. 그들은 그들 자신의 그림을 그렸습니다. 이 그림들이 자화상입니다.", "셀피와 자화상은 비슷합니다.", "둘 다 특정한 시간의 우리 모습을 보여 줍니다. 우리가 그것들을 볼 때, 우리는 그때의 우리 자신을 기억할 수 있습니다. 그것들은 일기와 같습니다.", "우리는 행복한 순간을 기억하기 위해 셀피를 찍습니다. 셀피는 그런 때의 우리 얼굴 표정을 포착합니다. 우리는 그런 즐거운 감정을 되살리기 위해 우리의 가족과 친구들과 함께 셀피를 자주 봅니다.", "마찬가지로, 몇몇 화가들은 그들의 삶에서 다른 시기를 포착하기 위해 자화상을 만들었습니다. 렘브란트는 거울을 보고 자기 자신을 여러 번 그렸습니다. 그는 그의 일생에서 약 90점의 자화상을 그렸습니다. 그것들은 젊은 시절부터 노년까지 그의 얼굴을 보여 줍니다.", "셀피와 자화상에는 차이점도 있습니다.", "셀피를 찍는 것은 쉽습니다. 우리는 언제든지 우리의 카메라로 그것을 빨리 할 수 있습니다. 그러나, 자화상을 그리는 것은 시간이 조금 걸립니다. 또한, 자화상은 화가 개인의 화풍을 보여 줍니다.", "인물을 그리기 위해, 화가는 모델이 필요합니다. 빈센트 반 고흐는 모델을 위한 충분한 돈이 없었습니다. 그래서 그는 자기 자신을 그렸습니다! 그가 자화상을 그릴 때, 그는 밝은색을 고르고 많은 물감을 발랐습니다. 이것은 그의 독특한 스타일이 되었습니다. 우리는 이것을 그의 다른 그림들에서도 볼 수 있습니다.", "우리는 셀피와 자화상으로 우리 자신을 표현할 수 있습니다. 한번 해 보실래요?"];
