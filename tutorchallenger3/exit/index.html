사이트에서의 뉴스 영상 소비는 소셜 미디어를 통한 소비보다 더 인기가 있다.","opts":["다섯 개의 국가","뉴스 사이트","소셜 미디어","뉴스 영상"],"r":{"a":"4) 뉴스 영상","ev":"2번 문장","s":[[2,"In four of the listed countries, consuming news videos on news sites is more popular than consuming them via social media.","언급된 국가 중 네 국가에서, 뉴스 사이트에서의 뉴스 영상 소비는 소셜 미디어를 통한 소비보다 더 인기가 있다."]],"w":"consuming them via social media는 ‘소셜 미디어를 통해 그것들을 소비하는 것’이에요. 앞의 consuming news videos on news sites와 짝이라서 them은 news videos(뉴스 영상)예요. 소셜 미디어는 them이 아니라 via 뒤에 따로 나와요.","c":4},"h":"2aa1de58ac"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As for people who mostly watch news videos on news sites, Finland shows the highest percentage among the listed countries.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"주로 뉴스 사이트에서 뉴스 영상을 시청하는 사람들에 있어서는 핀란드가 언급된 국가 중에서 가장 높은 비율을 보여 준다.","opts":["핀란드에서는 뉴스 사이트로 뉴스 영상을 보는 사람이 한 명도 없다.","주로 뉴스 사이트에서 뉴스 영상을 보는 사람의 비율은 언급된 국가 중 핀란드가 가장 높다.","핀란드 사람들은 소셜 미디어로만 뉴스 영상을 본다.","언급된 국가 중 핀란드가 뉴스 영상을 가장 적게 시청한다."],"r":{"a":"2) 주로 뉴스 사이트에서 뉴스 영상을 보는 사람의 비율은 언급된 국가 중 핀란드가 가장 높다.","ev":"3번 문장","s":[[3,"As for people who mostly watch news videos on news sites, Finland shows the highest percentage among the listed countries.","주로 뉴스 사이트에서 뉴스 영상을 시청하는 사람들에 있어서는 핀란드가 언급된 국가 중에서 가장 높은 비율을 보여 준다."]],"w":"As for ~가 기준(주로 뉴스 사이트에서 보는 사람들)을 정하고, 그 기준에서 핀란드가 가장 높은 비율(the highest percentage)이라는 뜻이에요. 한 명도 없다거나 가장 적게 본다는 말은 본문과 반대예요.","c":2},"h":"6f35214f69"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이 도표는 다섯 국가에서 만들어지는 뉴스 영상의 수를 보여 준다.","이 도표는 다섯 국가에서 뉴스 사이트로 본 뉴스 영상과 소셜 미디어로 본 뉴스 영상을 견준다.","언급된 국가 중 네 국가에서 소셜 미디어가 뉴스 영상을 보는 데 더 인기 있다.","일본이 뉴스 사이트로 뉴스 영상을 시청하는 사람의 비율이 가장 높다."],"opts":["The graph shows how many news videos are made in five countries.","The graph compares news videos watched on news sites with those watched on social media in five countries.","In four of the listed countries, social media is more popular for news videos.","Japan shows the highest percentage of people who mostly watch news videos on news sites."],"r":{"a":"2) The graph compares news videos watched on news sites with those watched on social media in five countries.","ev":"1번 문장","s":[[1,"The above graph shows how people in five different countries consume news videos: on news sites versus on social media.","위 그래프는 다섯 개의 다른 국가 사람들이 어떻게 뉴스 영상을 소비하는지를 보여 주는데, 뉴스 사이트에서의 뉴스 영상 소비 대 소셜 미디어를 통한 뉴스 영상 소비이다."]],"w":"1번에서 도표가 다섯 국가 사람들이 뉴스 영상을 어떻게 소비하는지를 뉴스 사이트 대 소셜 미디어로 보여 준다고 해요. 영상을 ‘만드는’ 수가 아니라 ‘보는’ 방식이에요. 네 국가는 뉴스 사이트가 더 인기이고(2번), 뉴스 사이트 비율이 가장 높은 나라는 핀란드예요(3번).","c":2},"h":"c16883a6d0"},{"n":9,"t":"sum","q":"In (A), the percentage of people who mostly watch news videos on news sites is (B) than in Germany.","ko":"(A)에서 주로 뉴스 사이트로 뉴스 영상을 시청하는 사람들의 비율은 독일보다 (B).","oko":["A 일본 / B 낮다","A 독일 / B 높다","A 핀란드 / B 낮다","A 프랑스 / B 낮다","A 프랑스 / B 높다"],"opts":["(A) Japan / (B) lower","(A) Germany / (B) higher","(A) Finland / (B) lower","(A) France / (B) lower","(A) France / (B) higher"],"r":{"a":"5) (A) France / (B) higher (A 프랑스 / B 높다)","ev":"4번 문장","s":[[4,"The percentage of people who mostly watch news videos on news sites in France is higher than that in Germany.","프랑스에서 주로 뉴스 사이트를 통해 뉴스 영상을 시청하는 사람들의 비율은 독일에서의 비율보다 더 높다."]],"w":"4번 문장은 프랑스(France)에서 주로 뉴스 사이트로 뉴스 영상을 보는 사람들의 비율이 독일보다 더 높다(higher)고 말해요.","c":5},"h":"e334ea3ba3"},{"n":10,"t":"fill","q":"The [A] graph shows how people in five different countries consume news videos: on news sites [B] on social media.","ko":"[A] 그래프는 다섯 개의 다른 국가 사람들이 어떻게 뉴스 영상을 소비하는지를 보여 주는데, 뉴스 사이트에서의 뉴스 영상 소비 [B] 소셜 미디어를 통한 뉴스 영상 소비이다.","bank":["above","versus","percentage","listed","mostly","highest"],"bko":{"above":"위의","versus":"대(~와 비교하여)","percentage":"비율","listed":"언급된","mostly":"주로","highest":"가장 높은"},"r":{"a":"[A] above (위의), [B] versus (대(~와 비교하여))","ev":"1번 문장","s":[[1,"The above graph shows how people in five different countries consume news videos: on news sites versus on social media.","위 그래프는 다섯 개의 다른 국가 사람들이 어떻게 뉴스 영상을 소비하는지를 보여 주는데, 뉴스 사이트에서의 뉴스 영상 소비 대 소셜 미디어를 통한 뉴스 영상 소비이다."]],"w":"1번 문장은 위의(above) 그래프가 뉴스 사이트에서의 소비 대(versus) 소셜 미디어를 통한 소비를 보여 준다고 설명해요.","c":null},"h":"3cddd4596d"}]},{"u":4,"id":"ch3-04-1","no":1,"ko":"이런 아이스크림 보셨나요?","items":[{"n":1,"t":"tf","q":"Ice cream is a popular summer snack except for the fact that it melts.","ko":"아이스크림은 녹는다는 사실을 제외하면 인기 있는 여름 간식이다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Ice cream remains a beloved summertime snack, except for one big flaw—it melts.","아이스크림은 녹는다는 한 가지 큰 결점을 제외하면 여전히 인기 많은 여름 간식이다."]],"w":"1번 문장에서 아이스크림은 녹는다는 큰 결점을 빼면 여전히 인기 많은 여름 간식이라고 해요. 본문과 맞아요.","c":"T"},"h":"3e436dccdf"},{"n":2,"t":"tf","q":"The writer says that the melting problem of ice cream will certainly last for a very long time.","ko":"글쓴이는 아이스크림이 녹는 문제가 틀림없이 아주 오래 계속될 것이라고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Thanks to scientific advancements, however, this may not be an issue for long.","그러나, 과학의 발전 덕분에, 이 문제는 오래가지 않을 수도 있다."]],"w":"2번 문장에서 과학의 발전 덕분에 이 문제는 오래가지 않을 수도 있다(may not be an issue for long)고 해요. ‘틀림없이 오래 계속된다’는 반대예요.","c":"F"},"h":"1c7c540d8d"},{"n":3,"t":"tf","q":"People who want to try the ice cream firsthand may have to travel to Japan.","ko":"그 아이스크림을 직접 맛보고 싶은 사람은 일본으로 여행을 가야 할지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Unfortunately, it’s not currently available for purchase outside of Japan, so if you’re eager to experience it firsthand, you’ll have to plan a trip.","불행히도, 현재 일본 밖에서는 구매가 가능하지 않아서, 만약 직접 경험해보고 싶다면 당신은 여행을 계획해야 할 것이다."]],"w":"10번 문장에서 일본 밖에서는 구매가 불가능해서 직접 경험하려면 여행을 계획해야 한다고 해요. 본문과 맞아요.","c":"T"},"h":"740fb83a23"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…it appeared resistant to heat, staying cold to the touch…)","ko":"(…그것은 열에 …한 것으로 보였고, 만졌을 때 여전히 차가웠으며…)","opts":["약한","저항력이 있는","민감한","의존하는"],"word":"resistant","r":{"a":"2) 저항력이 있는","ev":"8번 문장","s":[[8,"Five minutes later, it appeared resistant to heat, staying cold to the touch and showing no signs of melting.","5분 후, 그것은 열에 저항력이 있는 것으로 보였고, 만졌을 때 여전히 차가웠으며 녹는 기미를 전혀 보이지 않았다."]],"w":"8번 문장은 5분 뒤에도 만졌을 때 차가웠고 녹는 기미가 없었다는 내용이에요. 열에도 녹지 않았으니 resistant to heat는 ‘열에 저항력이 있는’이라는 뜻이에요.","c":2},"h":"792bec606c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…a unique type of ice cream that seemingly doesn’t melt at all.)","ko":"(…전혀 녹지 않는 것 …인 독특한 종류의 아이스크림.)","opts":["절대로","분명히","겉보기에는","느리게"],"word":"seemingly","r":{"a":"3) 겉보기에는","ev":"3번 문장","s":[[3,"While several slow-melting ice cream varieties already exist, Japanese researchers have developed a unique type of ice cream that seemingly doesn’t melt at all.","몇 가지 느리게 녹는 아이스크림 종류가 이미 존재하지만, 일본 연구원들은 전혀 녹지 않는 것처럼 보이는 독특한 종류의 아이스크림을 개발했다."]],"w":"seemingly는 seem(~처럼 보이다)에서 나온 말로 ‘겉보기에는’이에요. 3번 문장은 ‘전혀 녹지 않는 것처럼 보이는’ 아이스크림이라는 뜻이라서, 확실히 안 녹는다는 뜻의 ‘분명히’는 맞지 않아요.","c":3},"h":"7abf0eb060"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe researchers observed that when polyphenol was added to the dessert’s cream, the cream instantly solidified because polyphenol inhibits water and oil from separating, allowing it to stay firm and maintain its shape.","ko":"밑줄 친 it이 가리키는 것은?","sko":"연구원들은 폴리페놀이 디저트의 크림에 첨가되었을 때, 크림이 즉시 굳는다는 것을 관찰했는데, 이는 폴리페놀이 크림이 단단하게 유지되고 형태를 유지할 수 있게 해주면서, 물과 기름이 분리되는 것을 막기 때문이다.","opts":["폴리페놀","크림","물","기름"],"r":{"a":"2) 크림","ev":"5번 문장","s":[[5,"The researchers observed that when polyphenol was added to the dessert’s cream, the cream instantly solidified because polyphenol inhibits water and oil from separating, allowing it to stay firm and maintain its shape.","연구원들은 폴리페놀이 디저트의 크림에 첨가되었을 때, 크림이 즉시 굳는다는 것을 관찰했는데, 이는 폴리페놀이 크림이 단단하게 유지되고 형태를 유지할 수 있게 해주면서, 물과 기름이 분리되는 것을 막기 때문이다."]],"w":"allowing it to stay firm에서 단단하게 유지되는 것은 크림이에요. 폴리페놀이 물과 기름이 분리되지 않게 막아 주어서 크림이 단단하게 모양을 유지하는 거예요.","c":2,"k":"it = the cream (크림)"},"pron":"it","h":"92e01ae436"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In order to test their claims, a reporter purchased some of the ice cream and left it outside in 28°C weather.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들의 주장을 시험해 보기 위해 한 리포터가 그 아이스크림을 사서 28도 날씨의 야외에 두었다.","opts":["한 리포터가 연구원들의 주장이 맞는지 보려고 아이스크림을 야외 더운 날씨에 두었다.","한 리포터가 연구원들을 돕기 위해 아이스크림을 사서 냉동실에 보관했다.","연구원들이 리포터의 주장을 확인하려고 아이스크림을 야외에 두었다.","한 리포터가 아이스크림이 맛있는지 알아보려고 여러 개를 먹었다."],"r":{"a":"1) 한 리포터가 연구원들의 주장이 맞는지 보려고 아이스크림을 야외 더운 날씨에 두었다.","ev":"7번 문장","s":[[7,"In order to test their claims, a reporter purchased some of the ice cream and left it outside in 28°C weather.","그들의 주장을 시험해 보기 위해 한 리포터가 그 아이스크림을 사서 28도 날씨의 야외에 두었다."]],"w":"In order to test their claims는 ‘그들(연구원들)의 주장을 시험하기 위해’라는 목적이에요. 시험한 사람은 리포터이고, 아이스크림을 28도 야외에 두었어요. 냉동실에 보관하거나 맛을 본 것이 아니에요.","c":1},"h":"bec6e09c64"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이 아이스크림은 처음부터 계획해서 만든 것이다.","리포터의 아이스크림은 5분 만에 녹기 시작했다.","녹지 않고 세 시간 넘게 버틴 사례를 설명하는 보고가 있다.","폴리페놀은 물과 기름이 분리되게 해서 크림이 굳는다."],"opts":["The researchers planned this ice cream from the very beginning.","The reporter’s ice cream began to melt after five minutes.","There are reports of the ice cream lasting over three hours without melting.","Polyphenol makes water and oil separate, so the cream becomes firm."],"r":{"a":"3) There are reports of the ice cream lasting over three hours without melting.","ev":"9번 문장","s":[[9,"There are even reports detailing instances of the ice cream lasting for over three hours without melting.","심지어 녹지 않고 세 시간 넘게 지속되는 아이스크림의 사례들을 자세히 설명하는 보고들도 있었다."]],"w":"9번에서 녹지 않고 세 시간 넘게 지속된 사례를 설명하는 보고가 있다고 해요. 처음부터 계획한 것이 아니라 우연한 발견이었고(4번), 리포터의 아이스크림은 5분 뒤에도 녹지 않았으며(8번), 폴리페놀은 물과 기름이 분리되는 것을 막아요(5번).","c":3},"h":"d48ad201b0"},{"n":9,"t":"sum","q":"The non-melting ice cream was found by (A) while researchers were (B) with a liquid from strawberries to make desserts.","ko":"녹지 않는 아이스크림은 연구원들이 디저트를 만들려고 딸기에서 나온 액체를 가지고 (B)하던 중에 (A)로 발견되었다.","oko":["(A) 계획 / (B) 요리","(A) 우연 / (B) 판매","(A) 강요 / (B) 요리","(A) 계획 / (B) 마시기","(A) 우연 / (B) 실험"],"opts":["(A) design / (B) cooking","(A) accident / (B) selling","(A) force / (B) cooking","(A) plan / (B) drinking","(A) accident / (B) experimenting"],"r":{"a":"5) (A) accident / (B) experimenting","ev":"4번 문장","s":[[4,"Interestingly, this discovery was accidental and was revealed after they experimented with a liquid extracted from strawberries, called polyphenol, to make desserts.","흥미롭게도, 이 발견은 우연이었고 연구원들이 디저트를 만들기 위해 딸기에서 추출한, 폴리페놀이라고 불리는 액체를 실험한 후에 드러났다."]],"w":"4번에서 이 발견은 우연이었고(accidental), 연구원들이 디저트를 만들기 위해 딸기에서 추출한 액체를 실험(experiment)한 뒤에 드러났다고 해요. 그래서 (A)는 accident(우연), (B)는 experimenting(실험하는 중)이에요.","c":5},"h":"9b7d0279f5"},{"n":10,"t":"fill","q":"Realizing this effect would likely extend to additional substances, the researchers began [A] it into ice cream products to [B] melting.","ko":"이 효과가 다른 물질에도 적용될 수 있다는 것을 알아차리고서 연구원들은 녹는 것을 [B] 위해 그것을 아이스크림 제품에 [A] 시작했다.","bank":["incorporating","strawberries","prevent","unique","solidified","desserts"],"bko":{"incorporating":"포함하기","strawberries":"딸기","prevent":"막기","unique":"독특한","solidified":"굳었다","desserts":"디저트"},"r":{"a":"[A] incorporating (포함하기), [B] prevent (막기)","ev":"6번 문장","s":[[6,"Realizing this effect would likely extend to additional substances, the researchers began incorporating it into ice cream products to prevent melting.","이 효과가 다른 물질에도 적용될 수 있다는 것을 알아차리고서 연구원들은 녹는 것을 막기 위해 그것을 아이스크림 제품에 포함하기 시작했다."]],"w":"6번 문장은 연구원들이 녹는 것을 막기(prevent) 위해 그 물질을 아이스크림 제품에 포함하기(incorporating) 시작했다는 내용이에요.","c":null},"h":"d57051545e"}]},{"u":4,"id":"ch3-04-2","no":2,"ko":"손가락과 유리잔 사이","items":[{"n":1,"t":"tf","q":"The larger the area of skin touching the glass is, the stronger the friction becomes.","ko":"유리에 닿는 피부의 면적이 클수록 마찰은 더 강해진다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The greater the area of skin touching the glass, the stronger the friction.","유리잔에 닿는 피부의 면적이 더 커질수록, 마찰도 더 강해진다."]],"w":"3번 문장은 닿는 피부의 면적이 더 커질수록 마찰도 더 강해진다고 해요. 본문과 맞아요.","c":"T"},"h":"58ff93e7c5"},{"n":2,"t":"tf","q":"The ridges of our fingerprints help us hold smooth materials like glass more easily than rough ones.","ko":"우리 지문의 융선은 거친 물질보다 유리 같은 매끄러운 물질을 더 쉽게 잡도록 도와준다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The ridges of our fingerprints help us hold onto rough materials, but it’s hard to hold onto smooth materials like glass.","우리 지문의 융선은 우리가 거친 물질을 잡도록 도와주지만, 유리 같은 매끄러운 물질을 잡는 것은 어렵다."]],"w":"7번 문장에서 융선은 거친 물질을 잡도록 도와주지만, 유리 같은 매끄러운 물질은 잡기 어렵다고 해요. 거친 물질과 매끄러운 물질이 바뀌어 있어서 틀려요.","c":"F"},"h":"c8a35bff3e"},{"n":3,"t":"tf","q":"For some people, it can take as long as twenty seconds for the reaction to start.","ko":"어떤 사람들에게는 반응이 시작되는 데 20초까지 걸릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"For some people, it takes only a few seconds to start, and other times, it can take as long as twenty seconds.","어떤 사람들에게는 시작되는 데 몇 초만 걸리기도 하고 다른 때는 20초까지도 걸릴 수 있다."]],"w":"12번 문장에서 반응이 시작되는 데 몇 초만 걸리기도 하지만 다른 때는 20초까지도 걸릴 수 있다고 해요. 본문과 맞아요.","c":"T"},"h":"e5cfdff07d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…our fingers actually adapt to slippery materials by increasing the contact area.)","ko":"(…우리의 손가락이 접촉 면적을 늘려서 미끄러운 물질에 실제로 …한다.)","opts":["저항하다","적응하다","의존하다","포기하다"],"word":"adapt","r":{"a":"2) 적응하다","ev":"4번 문장","s":[[4,"Researchers recently discovered that our fingers actually adapt to slippery materials by increasing the contact area.","연구원들은 최근에 우리의 손가락이 접촉 면적을 증가시킴으로써 실제로 미끄러운 물질들에 적응한다는 것을 발견했다."]],"w":"4번 문장은 손가락이 접촉 면적을 늘려 미끄러운 물질에 맞춰 달라진다는 내용이에요. adapt to는 ‘~에 적응하다’라는 뜻이에요. 저항하거나 포기하는 것이 아니에요.","c":2},"h":"17dada907b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…it releases a little bit of sweat onto the skin.)","ko":"(…우리 몸은 피부에 약간의 땀을 …한다.)","opts":["흡수한다","닦아 낸다","숨긴다","배출한다"],"word":"releases","r":{"a":"4) 배출한다","ev":"8번 문장","s":[[8,"So when our body senses a smooth material, it releases a little bit of sweat onto the skin.","그래서 우리의 몸이 매끄러운 물질을 감지할 때, 우리 몸은 피부에 약간의 땀을 배출한다."]],"w":"8번 문장은 몸이 매끄러운 물질을 감지하면 피부 위로 약간의 땀을 내보낸다는 뜻이에요. release(내보내다, 배출하다)는 땀을 피부 ‘위로’ 내놓는 동작이라서 ‘흡수한다’와는 반대예요.","c":4},"h":"c3acb9bb1f"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThe sweat causes the ridges to flatten, which allows more skin to touch the glass and increases the amount of friction.","ko":"밑줄 친 which가 가리키는 것은?","sko":"땀은 융선들이 평평해지게 하고, 이는 더 많은 피부가 유리에 접촉하게 해 마찰의 양을 증가시킨다.","opts":["땀이 융선을 평평하게 만드는 것","유리","더 많은 피부","마찰"],"r":{"a":"1) 땀이 융선을 평평하게 만드는 것","ev":"9번 문장","s":[[9,"The sweat causes the ridges to flatten, which allows more skin to touch the glass and increases the amount of friction.","땀은 융선들이 평평해지게 하고, 이는 더 많은 피부가 유리에 접촉하게 해 마찰의 양을 증가시킨다."]],"w":"which 앞의 The sweat causes the ridges to flatten 전체를 가리켜요. 땀 때문에 융선이 평평해지는 일이 ‘더 많은 피부가 유리에 닿게 해 마찰을 늘린다’는 거예요.","c":1,"k":"which = 땀이 융선을 평평하게 만드는 것"},"pron":"which","h":"a323119b46"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Glass is a slippery material, so why doesn’t it slip right through our fingers when we hold it?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"유리는 미끄러운 물질인데, 그러면 우리가 그것을 잡을 때, 그것은 왜 우리의 손가락 사이로 바로 미끄러지지 않는가?","opts":["유리는 미끄러워서 잡는 순간 손가락 사이로 곧바로 빠진다는 설명이다.","유리를 잡을 때 손가락이 왜 미끄러워지는지 묻고 있다.","유리를 놓을 때 왜 손가락 사이로 미끄러지는지 묻고 있다.","유리가 미끄러운 물질인데도 잡을 때 손가락 사이로 곧바로 빠지지 않는 이유를 묻고 있다."],"r":{"a":"4) 유리가 미끄러운 물질인데도 잡을 때 손가락 사이로 곧바로 빠지지 않는 이유를 묻고 있다.","ev":"1번 문장","s":[[1,"Glass is a slippery material, so why doesn’t it slip right through our fingers when we hold it?","유리는 미끄러운 물질인데, 그러면 우리가 그것을 잡을 때, 그것은 왜 우리의 손가락 사이로 바로 미끄러지지 않는가?"]],"w":"doesn’t it slip right through our fingers는 ‘왜 손가락 사이로 바로 미끄러져 빠지지 않는가’라는 물음이에요. 유리가 미끄럽다(so 앞)는 사실과 달리 실제로는 안 빠진다는 점이 핵심이에요. 설명문이 아니라 의문문이고, ‘놓을 때’가 아니라 ‘잡을 때’(when we hold it)예요.","c":4},"h":"0df1ce734f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["반응에 걸리는 시간은 오직 유리의 색깔에 달려 있다.","반응에 걸리는 시간은 유리의 나이로 결정된다.","반응에 걸리는 시간은 사람과 물체의 무게에 달려 있다.","반응에 걸리는 시간은 모든 사람과 모든 물체에서 똑같다."],"opts":["The reaction time depends only on the color of the glass.","The reaction time is decided by the age of the glass.","The reaction time depends on the person and the weight of the object.","The reaction time is the same for every person and every object."],"r":{"a":"3) The reaction time depends on the person and the weight of the object. (반응에 걸리는 시간은 사람과 물체의 무게에 달려 있다.)","ev":"11번 문장","s":[[11,"Scientists researching this unusual process have found that how long this reaction takes depends on the person and weight of the object.","이러한 특이한 과정을 조사하는 과학자들은 이 반응이 얼마나 오래 걸리는지는 사람과 물체의 무게에 의해 결정된다는 것을 발견했다."]],"w":"11번 문장에서 이 반응이 얼마나 오래 걸리는지는 사람과 물체의 무게에 달려 있다고 했어요.","c":3},"h":"0b5748b2e3"},{"n":9,"t":"sum","q":"As a result, we can easily (A) a (B) grip on the glass.","ko":"그 결과, 우리는 유리를 붙잡는 (B) 힘을 쉽게 (A) 수 있다.","oko":["A 떨어뜨릴 / B 느슨한","A 부술 / B 부드러운","A 유지할 / B 단단한","A 팔 / B 차가운","A 씻을 / B 얇은"],"opts":["(A) drop / (B) loose","(A) break / (B) soft","(A) keep / (B) firm","(A) sell / (B) cold","(A) wash / (B) thin"],"r":{"a":"3) (A) keep / (B) firm (A 유지할 / B 단단한)","ev":"10번 문장","s":[[10,"As a result, we can easily keep a firm grip on the glass.","결과적으로, 우리는 유리를 쉽게 꽉 붙잡을 수 있다."]],"w":"10번 문장은 그 결과 유리를 쉽게 꽉 붙잡고 있을(keep a firm grip) 수 있다는 내용이에요.","c":3},"h":"596d09c638"},{"n":10,"t":"fill","q":"The adaptation involves [A] changes on the outer layer of our skin, where our fingerprints are [B].","ko":"이 적응은 우리 피부의 바깥층에 [A] 변화들을 수반하는데, 그 층에 지문이 [B].","bank":["small","located","flatten","release","hold","touch"],"bko":{"small":"작은","located":"위치해 있다","flatten":"평평하게 하다","release":"배출하다","hold":"붙잡다","touch":"닿다"},"r":{"a":"[A] small (작은), [B] located (위치해 있다)","ev":"6번 문장","s":[[6,"The adaptation involves small changes on the outer layer of our skin, where our fingerprints are located.","이 적응은 우리 피부의 바깥층에 작은 변화들을 수반하는데, 그 층에 지문이 있다."]],"w":"6번 문장은 피부 바깥층에 작은(small) 변화가 생기는데, 그곳에 지문이 있다(located)는 내용이에요.","c":null},"h":"2be7d56491"}]},{"u":4,"id":"ch3-04-3","no":3,"ko":"싱싱할 땐 안그러더니!","items":[{"n":1,"t":"tf","q":"Fish that have just been caught from the ocean usually give off a fairly mild smell.","ko":"바다에서 막 잡은 물고기는 보통 상당히 약한 냄새를 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Freshly caught fish from the ocean usually produce a fairly mild smell, similar to seaweed.","바다에서 갓 잡은 물고기는 보통 해초와 비슷한 상당히 약한 냄새를 낸다."]],"w":"1번 문장에서 갓 잡은 물고기는 보통 해초와 비슷한 상당히 약한 냄새를 낸다고 해요. 본문과 맞아요.","c":"T"},"h":"c1ba088761"},{"n":2,"t":"tf","q":"The salt concentration in marine fish is higher than that of the seawater around them.","ko":"바닷물고기의 염분 농도는 그들을 둘러싼 바닷물의 염분 농도보다 높다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The salt concentration in marine fish is less than that of the seawater surrounding them.","바닷물고기의 염분 농도는 그들을 둘러싼 바닷물의 염분 농도보다 낮다."]],"w":"5번 문장에서 바닷물고기의 염분 농도는 주변 바닷물보다 ‘낮다’(less than)고 해요. ‘높다’는 반대예요.","c":"F"},"h":"7e9c707207"},{"n":3,"t":"tf","q":"Putting fish in a bowl of ice in the fridge slows down the bacterial process.","ko":"생선을 냉장고 속 얼음이 든 그릇에 넣으면 세균성 과정이 느려진다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"For example, you can place the fish in a bowl of ice in the fridge, which will slow down the bacterial process.","예를 들어, 당신은 냉장고 속 얼음이 든 그릇에 생선을 놓을 수 있는데, 이는 세균성 과정을 늦출 것이다."]],"w":"11번 문장에서 냉장고 속 얼음이 든 그릇에 생선을 놓으면 세균성 과정이 늦춰진다고 해요. 본문과 맞아요.","c":"T"},"h":"b6efe10996"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…bacterial processes that are distinctive to sea creatures.)","ko":"(…바다 생물들에게 …한 세균성 과정.)","opts":["흔한","해로운","독특한","느린"],"word":"distinctive","r":{"a":"3) 독특한","ev":"4번 문장","s":[[4,"It is caused by bacterial processes that are distinctive to sea creatures.","이는 바다 생물들의 독특한 세균성 과정으로 인한 것이다."]],"w":"4번 문장은 비린내가 바다 생물들만의 세균성 과정 때문이라는 내용이에요. distinctive to ~는 ‘~에게만 있는 독특한’이라는 뜻이라서, 누구에게나 있는 ‘흔한’과는 반대예요.","c":3},"h":"dbaea66945"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…to counter the salinity of seawater and maintain fluid balance in their bodies…)","ko":"(…바닷물의 염도에 …하고 그들의 몸 속 유체 균형을 유지하기 위해…)","opts":["따라 하다","대응하다","수집하다","숨기다"],"word":"counter","r":{"a":"2) 대응하다","ev":"6번 문장","s":[[6,"Therefore, to counter the salinity of seawater and maintain fluid balance in their bodies, many fish rely on a compound called trimethylamine oxide (TMAO).","따라서, 바닷물의 염도에 대응하고 그들의 몸 속 유체 균형을 유지하기 위해 많은 물고기는 산화트리메틸아민(TMAO) 이라고 불리는 화합물에 의존한다."]],"w":"6번 문장에서 물고기는 바닷물의 높은 염도에 맞서고 체액 균형을 지키려고 TMAO에 의존해요. counter(맞서다, 대응하다)는 염도에 ‘대응하는’ 동작이에요.","c":2},"h":"b42ea988f0"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen fish are killed, however, bacteria in the fish begin to consume TMAO and convert it into a simpler compound called trimethylamine (TMA).","ko":"밑줄 친 it이 가리키는 것은?","sko":"그러나, 물고기가 죽임을 당하면, 물고기 속 세균은 TMAO를 먹기 시작하고 그것을 트리메틸아민(TMA)이라고 불리는 더 간단한 화합물로 전환시킨다.","opts":["물고기","TMAO","세균","TMA"],"r":{"a":"2) TMAO","ev":"7번 문장","s":[[7,"When fish are killed, however, bacteria in the fish begin to consume TMAO and convert it into a simpler compound called trimethylamine (TMA).","그러나, 물고기가 죽임을 당하면, 물고기 속 세균은 TMAO를 먹기 시작하고 그것을 트리메틸아민(TMA)이라고 불리는 더 간단한 화합물로 전환시킨다."]],"w":"bacteria ... consume TMAO and convert it into TMA에서 세균이 먹고 바꾸는 대상은 TMAO예요. convert it into TMA(그것을 TMA로 바꾸다)의 it은 TMAO를 가리켜요.","c":2,"k":"it = TMAO"},"pron":"it","h":"c6e9d9cf87"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Yet have you ever found yourself in a market wondering why there’s such a strong fishy smell coming from the fish?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 당신은 시장에서 왜 생선에서 그렇게 강한 비린 냄새가 나는지 궁금해하는 스스로를 발견한 적이 있는가?","opts":["시장에서 생선에서 왜 그렇게 강한 비린내가 나는지 궁금했던 적이 있는지 묻고 있다.","시장에서 비린내가 나는 생선을 골라야 하는지 묻고 있다.","생선이 신선하면 왜 비린내가 전혀 나지 않는지 묻고 있다.","시장에서 비린내가 나는 생선을 팔아도 되는지 묻고 있다."],"r":{"a":"1) 시장에서 생선에서 왜 그렇게 강한 비린내가 나는지 궁금했던 적이 있는지 묻고 있다.","ev":"2번 문장","s":[[2,"Yet have you ever found yourself in a market wondering why there’s such a strong fishy smell coming from the fish?","하지만 당신은 시장에서 왜 생선에서 그렇게 강한 비린 냄새가 나는지 궁금해하는 스스로를 발견한 적이 있는가?"]],"w":"wondering why there’s such a strong fishy smell은 ‘왜 그렇게 강한 비린내가 나는지 궁금해하는’이라는 뜻이에요. 선택이나 판매 문제가 아니라 비린내의 이유를 궁금해한 경험을 묻는 문장이에요.","c":1},"h":"5737d836ad"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["갓 잡은 생선은 보통 아주 강한 비린내를 풍긴다.","비린내는 살아 있는 물고기에서 먼저 생긴다.","생선을 최대한 차갑게 유지하는 것이 냄새를 처리하는 한 가지 방법이다.","레몬과 토마토는 생선의 맛을 더 달게 만들기 위해서만 쓰인다."],"opts":["Freshly caught fish usually give off a very strong fishy smell.","The fishy smell first comes from fish that are still alive.","One way to deal with the smell is to keep the fish as cold as possible.","Lemon and tomato are used only to make the fish taste sweeter."],"r":{"a":"3) One way to deal with the smell is to keep the fish as cold as possible.","ev":"10번 문장","s":[[10,"One way is to keep the fish as cold as possible.","하나의 방법은 생선을 최대한 차갑게 유지하는 것이다."]],"w":"10번에서 냄새를 처리하는 한 가지 방법이 생선을 최대한 차갑게 유지하는 것이라고 해요. 갓 잡은 생선은 약한 냄새가 나고(1번), 비린내는 죽은 뒤에 생기며(7번), 산성 재료는 TMA를 기름이 아니라 물과 결합하게 해요(12번).","c":3},"h":"77b57bdbac"},{"n":9,"t":"sum","q":"This prevents the smell from (A) and (B) up your kitchen.","ko":"이것은 냄새가 (A) 당신의 주방을 (B) 것을 막는다.","oko":["A 퍼지고 / B 악취로 가득 채우는","A 떠나고 / B 청소하는","A 커지고 / B 식히는","A 숨고 / B 데우는","A 떨어지고 / B 채우는"],"opts":["(A) spreading / (B) stinking","(A) leaving / (B) cleaning","(A) growing / (B) cooling","(A) hiding / (B) warming","(A) falling / (B) filling"],"r":{"a":"1) (A) spreading / (B) stinking (A 퍼지고 / B 악취로 가득 채우는)","ev":"13번 문장","s":[[13,"This prevents the smell from spreading and stinking up your kitchen.","이것은 당신의 주방에 냄새가 퍼지고 악취로 가득차게 하는 것을 막는다."]],"w":"13번 문장은 이 방법이 냄새가 퍼지고(spreading) 주방을 악취로 가득 채우는(stinking up) 것을 막는다고 말해요.","c":1},"h":"e9bcd85bac"},{"n":10,"t":"fill","q":"Treating the fish with [A] ingredients like lemon or tomato can also be effective because it causes the TMA to [B] to water.","ko":"레몬이나 토마토 같은 [A] 재료와 함께 생선을 취급하는 것은 TMA를 물과 [B] 만들기 때문에 또한 효과적일 수 있다.","bank":["acidic","bind","bacterial","fridge","bowl","melt"],"bko":{"acidic":"산성의","bind":"결합하도록","bacterial":"세균성의","fridge":"냉장고","bowl":"그릇","melt":"녹도록"},"r":{"a":"[A] acidic (산성의), [B] bind (결합하도록)","ev":"12번 문장","s":[[12,"Treating the fish with acidic ingredients like lemon or tomato can also be effective because it causes the TMA to bind to water.","레몬이나 토마토 같은 산성의 재료와 함께 생선을 취급하는 것은 TMA를 물과 결합하도록 만들기 때문에 또한 효과적일 수 있다."]],"w":"12번 문장은 레몬이나 토마토 같은 산성(acidic) 재료가 TMA를 물과 결합하도록(bind) 만든다는 내용이에요.","c":null},"h":"c6a833f32d"}]},{"u":4,"id":"ch3-04-4","no":4,"ko":"수능:ON 짧은 어구 빈칸 추론","items":[{"n":1,"t":"tf","q":"Saturn’s atmosphere is made up mostly of hydrogen and methane.","ko":"토성의 대기는 주로 수소와 메탄으로 이루어져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The reason for this is that Saturn, a gas planet with a small solid core, has an atmosphere consisting mostly of hydrogen and methane.","이것에 대한 이유는, 작은 고체 핵을 지닌 기체 행성인 토성의 대기가 주로 수소와 메탄으로 이루어져 있기 때문이다."]],"w":"3번 문장에서 토성의 대기는 주로 수소와 메탄으로 이루어져 있다(consisting mostly of hydrogen and methane)고 해요. 본문과 맞아요.","c":"T"},"h":"1e6766ffd0"},{"n":2,"t":"tf","q":"The pressure where the diamond rain would fall is about 100 times higher than on Earth.","ko":"다이아몬드 비가 내리는 곳의 기압은 지구보다 약 100배 높다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The pressure there is about 100,000 times higher than on Earth.","그곳의 기압은 지구에서보다 십만 배 정도 더 높다."]],"w":"9번 문장에서 그곳의 기압은 지구보다 약 100,000배(십만 배) 높다고 해요. 100배는 숫자가 달라서 틀려요.","c":"F"},"h":"0698b5c20c"},{"n":3,"t":"tf","q":"The writer advises visitors to Saturn to bring a strong umbrella.","ko":"글쓴이는 토성을 방문하는 사람에게 튼튼한 우산을 가져가라고 조언한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"If you ever visit Saturn, make sure you bring a strong umbrella.","토성을 방문한다면, 반드시 튼튼한 우산을 가지고 가라."]],"w":"1번 문장에서 토성을 방문한다면 반드시 튼튼한 우산을 가져가라(make sure you bring a strong umbrella)고 해요. 본문과 맞아요.","c":"T"},"h":"5b3a1041a6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…pressure would increase, eventually compressing the graphite into diamond.)","ko":"(…기압이 증가하고, 결국 흑연을 다이아몬드로 …할 것이다.)","opts":["분리하는","태우는","압축하는","녹이는"],"word":"compressing","r":{"a":"3) 압축하는","ev":"6번 문장","s":[[6,"As it moved closer to Saturn’s core, pressure would increase, eventually compressing the graphite into diamond.","그것이 토성의 중심핵으로 더 가까이 이동하면서, 기압이 증가하고, 결국 흑연을 다이아몬드로 압축할 것이다."]],"w":"6번 문장은 중심핵으로 갈수록 기압이 커져서 흑연이 다이아몬드가 된다는 내용이에요. 기압이 눌러서 흑연을 다이아몬드로 만드는 것이니 compress는 ‘압축하다’예요. 분리하거나 녹이는 것이 아니에요.","c":3},"h":"b1f3361260"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Therefore, it could literally be raining diamonds.)","ko":"(그래서, 그것은 …다이아몬드 비가 쏟아지는 것이라고 할 수 있다.)","opts":["비유적으로","아마도","거의","말 그대로"],"word":"literally","r":{"a":"4) 말 그대로","ev":"7번 문장","s":[[7,"Therefore, it could literally be raining diamonds.","그래서, 그것은 말 그대로 다이아몬드 비가 쏟아지는 것이라고 할 수 있다."]],"w":"7번은 4~6번의 과정을 거치면 다이아몬드가 진짜 비처럼 내릴 수 있다는 결론이에요. literally는 ‘비유가 아니라 말 그대로’라는 뜻이라서 ‘비유적으로’와는 반대예요.","c":4},"h":"7635b8f8e0"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAnd if we didn’t collect them fast enough, the diamonds would fly past us and fall deeper into the planet.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그리고 우리가 그것들을 충분히 빠르게 수집하지 않으면, 다이아몬드는 우리를 날아 지나가 행성 안쪽 더 깊은 곳으로 떨어져 버릴 것이다.","opts":["우산들","다이아몬드들","번개들","행성들"],"r":{"a":"2) 다이아몬드들","ev":"10번 문장","s":[[10,"And if we didn’t collect them fast enough, the diamonds would fly past us and fall deeper into the planet.","그리고 우리가 그것들을 충분히 빠르게 수집하지 않으면, 다이아몬드는 우리를 날아 지나가 행성 안쪽 더 깊은 곳으로 떨어져 버릴 것이다."]],"w":"collect them fast enough(그것들을 충분히 빠르게 모으다) 뒤에 the diamonds would fly past us(다이아몬드는 우리를 날아 지나갈 것이다)가 이어져요. 모으려는 대상은 비처럼 내리는 다이아몬드들이에요. 우산이나 번개를 모으는 것이 아니에요.","c":2},"h":"d4635011fd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There, the temperatures are so high that the diamonds would surely melt into liquid.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그곳에서는 기온이 너무 높아서 다이아몬드가 분명 액체로 녹아버릴 것이다.","opts":["그곳은 기온이 너무 높아서 다이아몬드가 분명 녹아 액체가 될 것이다.","그곳은 기온이 낮아서 다이아몬드가 꽁꽁 얼어붙을 것이다.","다이아몬드가 녹아 액체가 되면 그곳의 기온이 더 올라갈 것이다.","그곳의 기온이 높아질수록 더 많은 다이아몬드가 만들어질 것이다."],"r":{"a":"1) 그곳은 기온이 너무 높아서 다이아몬드가 분명 녹아 액체가 될 것이다.","ev":"11번 문장","s":[[11,"There, the temperatures are so high that the diamonds would surely melt into liquid.","그곳에서는 기온이 너무 높아서 다이아몬드가 분명 액체로 녹아버릴 것이다."]],"w":"so high that ~은 ‘너무 높아서 ~하다’라는 결과를 나타내요. 기온이 너무 높아서 다이아몬드가 녹아 액체가 된다는 뜻이에요. 기온이 낮다거나, 녹은 결과 기온이 오른다거나, 더 많이 만들어진다는 말은 아니에요.","c":1},"h":"6de1a4b488"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["토성의 대기는 주로 산소와 질소로 이루어져 있다.","번개는 토성의 다이아몬드를 쳐서 녹게 만든다.","NASA 연구에 따르면 매년 최대 천 톤의 다이아몬드가 토성의 대기에서 만들어질 수 있다.","인간은 이미 토성에서 떨어지는 다이아몬드를 수집했다."],"opts":["Saturn’s atmosphere consists mostly of oxygen and nitrogen.","Lightning strikes the diamonds on Saturn and makes them melt.","According to NASA research, up to 1,000 tons of diamonds could be created in Saturn’s atmosphere each year.","Humans have already collected the diamonds that fall on Saturn."],"r":{"a":"3) According to NASA research, up to 1,000 tons of diamonds could be created in Saturn’s atmosphere each year.","ev":"2번 문장","s":[[2,"According to research conducted by NASA, there could be as much as 1,000 tons of diamonds being created in Saturn’s atmosphere each year.","NASA에 의해 시행된 연구에 따르면, 매년 토성의 대기에서 천 톤이나 되는 다이아몬드가 생성되고 있을 수도 있다고 한다."]],"w":"2번에서 NASA 연구에 따르면 매년 토성의 대기에서 천 톤이나 되는 다이아몬드가 생성되고 있을 수도 있다고 해요. 대기는 수소와 메탄으로 이루어져 있고(3번), 번개가 치는 것은 메탄이며(4번), 그곳에 가는 것은 거의 불가능해요(8번).","c":3},"h":"2e1363a5c4"},{"n":9,"t":"sum","q":"When (A) occur, lightning could strike the methane and produce a mix of pure hydrogen and burnt carbon called (B).","ko":"(A)이(가) 발생하면, 번개가 메탄을 강타하여 순수한 수소와 (B)(이)라 불리는 연소된 탄소의 혼합물을 생성할 수 있다.","oko":["A 겨울 / B 얼음","A 지진 / B 소금","A 화산 / B 모래","A 무지개 / B 먼지","A 뇌우 / B 검댕"],"opts":["(A) winters / (B) ice","(A) earthquakes / (B) salt","(A) volcanoes / (B) sand","(A) rainbows / (B) dust","(A) thunderstorms / (B) soot"],"r":{"a":"5) (A) thunderstorms / (B) soot (A 뇌우 / B 검댕)","ev":"4번 문장","s":[[4,"When thunderstorms occur, lightning could strike the methane, producing a mix of pure hydrogen and burnt carbon called soot.","뇌우가 발생하면, 번개가 메탄을 강타하여 검댕이라 불리는 순수한 수소와 연소된 탄소의 혼합물을 생성할 수 있다."]],"w":"4번 문장은 뇌우(thunderstorms)가 발생하면 번개가 메탄을 쳐서 검댕(soot)이라 불리는 탄소 혼합물이 생길 수 있다고 해요.","c":5},"h":"b0f7434958"},{"n":10,"t":"fill","q":"Unfortunately, it would be nearly [A] to get to Saturn and [B] down to where the diamond rain would be falling.","ko":"안타깝게도, 토성에 가서 다이아몬드 비가 내리는 곳까지 [B] 것은 거의 [A] 일일 것이다.","bank":["impossible","umbrella","travel","hydrogen","planet","collect"],"bko":{"impossible":"불가능한","umbrella":"우산","travel":"내려가는(이동하다)","hydrogen":"수소","planet":"행성","collect":"수집하다"},"r":{"a":"[A] impossible (불가능한), [B] travel (내려가는(이동하다))","ev":"8번 문장","s":[[8,"Unfortunately, it would be nearly impossible to get to Saturn and travel down to where the diamond rain would be falling.","안타깝게도, 토성에 가서 다이아몬드 비가 내리는 곳까지 내려가는 것은 거의 불가능할 것이다."]],"w":"8번 문장은 토성에 가서 다이아몬드 비가 내리는 곳까지 내려가는(travel) 것이 거의 불가능하다(impossible)고 말해요.","c":null},"h":"90a51bff46"}]},{"u":5,"id":"ch3-05-1","no":1,"ko":"작은 것만 속인다!","items":[{"n":1,"t":"tf","q":"In the dormitory experiment, students tended to take the cans of soda but did not take the dollar bills.","ko":"기숙사 실험에서 학생들은 탄산음료 캔은 가져가는 경향이 있었지만 달러 지폐는 가져가지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"When he returned, he observed that students were likely to take the soda but left the money untouched.","그가 돌아왔을 때, 학생들이 탄산음료는 가져가면서 돈은 손대지 않은 채로 남겨두는 경향이 있음을 관찰했다."]],"w":"8번 문장에서 학생들이 탄산음료는 가져가고(take the soda) 돈은 손대지 않은 채로 남겨두었다(left the money untouched)고 해요. 본문과 맞아요.","c":"T"},"h":"dea298ee4c"},{"n":2,"t":"tf","q":"The participants who submitted their answers got an average of six correct answers.","ko":"정답을 제출한 참가자들은 평균 여섯 문제를 맞혔다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"Some were required to submit their answers for evaluation, and others checked their answers independently.","어떤 사람들은 평가를 위해 정답을 제출하라는 요구를 받았고, 다른 사람들은 독립적으로 정답을 확인했다."],[5,"The former achieved an average of four correct answers, while the latter got an average of six, indicating some level of cheating, though not to a significant degree.","전자는 평균적으로 네 문제를 맞혔고, 후자는 평균적으로 여섯 문제를 맞혀, 어느 정도의 부정행위를 나타냈지만, 심각한 수준은 아니었다."]],"w":"5번에서 전자(The former, 정답을 제출한 사람들)는 평균 네 문제, 후자(the latter, 혼자 확인한 사람들)가 평균 여섯 문제를 맞혔어요. 여섯 문제는 혼자 확인한 사람들의 수예요.","c":"F"},"h":"cf35839d84"},{"n":3,"t":"tf","q":"According to the passage, dieters usually follow their diet 100 percent of the time.","ko":"본문에 따르면, 다이어트하는 사람들은 보통 100% 항상 식단을 지킨다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"After all, it’s rare for someone to adhere to a diet 100 percent of the time.","결국, 누군가가 100% 항상 식단을 고수하는 것은 드물다."]],"w":"11번 문장은 누군가가 100% 항상 식단을 고수하는 것은 드물다(it’s rare)고 해요. ‘보통 지킨다’는 반대 내용이에요.","c":"F"},"h":"c6663c1aef"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…he administered a 20-question quiz to a group of participants.)","ko":"(…그는 한 그룹의 참가자들에게 20문제짜리 퀴즈를 …했다.)","opts":["취소했다","실시했다","암기했다","감추었다"],"word":"administered","r":{"a":"2) 실시했다","ev":"3번 문장","s":[[3,"To prove this, he administered a 20-question quiz to a group of participants.","이를 입증하기 위해, 그는 한 그룹의 참가자들에게 20문제짜리 퀴즈를 실시했다."]],"w":"3번 문장은 가설을 입증하려고 퀴즈를 참가자들에게 ‘내줬다’는 내용이에요. administer는 ‘실시하다’라는 뜻이라 administered = 실시했다예요.","c":2},"h":"4c99edcea6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…placed dollar bills and cans of soda in communal areas.)","ko":"(…달러 지폐와 탄산음료 캔을 …한 공간에 놓아두었다.)","opts":["공용의","위험한","비밀의","좁은"],"word":"communal","r":{"a":"1) 공용의","ev":"7번 문장","s":[[7,"He went into college dormitories and placed dollar bills and cans of soda in communal areas.","그는 대학 기숙사에 들어가 공용 공간에 달러 지폐와 탄산음료 캔을 놓아두었다."]],"w":"7번 문장은 대학 기숙사에서 학생들이 함께 쓰는 곳에 지폐와 음료를 놓아두었다는 내용이에요. communal area는 ‘공용 공간’이라 communal = 공용의예요.","c":1},"h":"26fa30c0f7"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nFor example, dieters might think it is permissible to indulge in some cookies for a snack because they ate a salad for lunch.","ko":"밑줄 친 they가 가리키는 것은?","sko":"예를 들어, 다이어트를 하는 사람은 점심에 샐러드를 먹었기 때문에 간식으로 쿠키 몇 개를 마음껏 먹는 것이 허용된다고 생각할지도 모른다.","opts":["퀴즈 참가자들","대학 기숙사 학생들","다이어트하는 사람들","실험을 한 저자들"],"r":{"a":"3) 다이어트하는 사람들","ev":"12번 문장","s":[[12,"For example, dieters might think it is permissible to indulge in some cookies for a snack because they ate a salad for lunch.","예를 들어, 다이어트를 하는 사람은 점심에 샐러드를 먹었기 때문에 간식으로 쿠키 몇 개를 마음껏 먹는 것이 허용된다고 생각할지도 모른다."]],"w":"because they ate a salad for lunch는 ‘점심에 샐러드를 먹었기 때문에’라는 뜻이고, 문장의 주어는 dieters예요. 샐러드를 먹은 사람은 퀴즈 참가자도, 학생도, 저자도 아니에요.","c":3},"h":"45caa3214b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"One hypothesis from an author suggests the vast majority of people do, however, only to the extent that does not compromise their morals.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"한 저자의 하나의 가설은 대다수의 사람들이 (부정행위를) 한다는 것을 시사하는데, 하지만 단지 그들의 도덕성을 해치지 않는 범위 내에서만 한다고 한다.","opts":["극소수의 사람들만 도덕성을 해치지 않는 범위에서 부정행위를 한다.","대다수의 사람들은 도덕성을 해치더라도 이익이 된다면 부정행위를 한다.","대다수의 사람들은 부정행위를 하지만, 자신의 도덕성을 해치지 않는 범위에서만 한다.","대다수의 사람들은 부정행위를 하지 않고 도덕성을 지키는 일만 중요하게 여긴다."],"r":{"a":"3) 대다수의 사람들은 부정행위를 하지만, 자신의 도덕성을 해치지 않는 범위에서만 한다.","ev":"2번 문장","s":[[2,"One hypothesis from an author suggests the vast majority of people do, however, only to the extent that does not compromise their morals.","한 저자의 하나의 가설은 대다수의 사람들이 (부정행위를) 한다는 것을 시사하는데, 하지만 단지 그들의 도덕성을 해치지 않는 범위 내에서만 한다고 한다."]],"w":"the vast majority는 ‘대다수’이고, do는 cheat를 대신해요. only to the extent that ~은 ‘~하는 범위에서만’이라서, 도덕성을 해치지 않는 선까지만 부정행위를 한다는 뜻이에요. ‘극소수’나 ‘도덕성을 해쳐도’는 반대 내용이에요.","c":3},"h":"e9f993f7e6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["저자는 기숙사 실험을 퀴즈 실험보다 먼저 했다.","저자는 퀴즈 실험 뒤에 또 다른 실험을 했다.","아무도 보지 않으면 모든 사람이 많이 부정행위를 한다.","저자는 다이어트가 부정행위와 아무 관련이 없다고 생각한다."],"opts":["The author did the dormitory experiment before the quiz experiment.","The author did another experiment after the quiz experiment.","Everyone cheats a lot when no one is watching.","The author thinks that dieting has nothing to do with cheating."],"r":{"a":"2) The author did another experiment after the quiz experiment. (저자는 퀴즈 실험 뒤에 또 다른 실험을 했다.)","ev":"6번 문장","s":[[6,"The author subsequently conducted an additional experiment.","그 저자는 이후 추가적인 실험을 실시했다."]],"w":"6번 문장에서 저자는 이후(subsequently) 추가적인 실험을 했다고 했어요. 퀴즈 뒤에 또 다른 실험을 한 거예요.","c":2},"h":"d178998fc3"},{"n":9,"t":"sum","q":"According to the passage, people tend to cheat only (A) because they want to (B) a good image of themselves.","ko":"본문에 따르면, 사람들은 자신에 대한 좋은 이미지를 (B)하고 싶어서 (A) 부정행위를 하는 경향이 있다.","oko":["(A) 완전히 / (B) 버리다","(A) 공개적으로 / (B) 판단하다","(A) 자주 / (B) 숨기다","(A) 약간만 / (B) 지키다","(A) 몰래 / (B) 바꾸다"],"opts":["(A) completely / (B) abandon","(A) openly / (B) judge","(A) often / (B) hide","(A) slightly / (B) preserve","(A) secretly / (B) replace"],"r":{"a":"4) (A) slightly / (B) preserve","ev":"5번, 13번 문장","s":[[5,"The former achieved an average of four correct answers, while the latter got an average of six, indicating some level of cheating, though not to a significant degree.","전자는 평균적으로 네 문제를 맞혔고, 후자는 평균적으로 여섯 문제를 맞혀, 어느 정도의 부정행위를 나타냈지만, 심각한 수준은 아니었다."],[13,"Despite negative inclinations, they can preserve their positive self-image.","부정적인 성향에도 불구하고, 그들은 긍정적인 자아상을 지킬 수 있다."]],"w":"5번에서 부정행위는 심각한 수준이 아닌 정도(not to a significant degree)였고, 13번에서 사람들은 긍정적인 자아상을 지킬(preserve) 수 있다고 해요. 그래서 (A)는 slightly(약간만), (B)는 preserve(지키다)예요.","c":4},"h":"7226399daf"},{"n":10,"t":"fill","q":"The author claimed that this behavior occurs because everyone has inherently [A] desires but simultaneously strives to be [B].","ko":"저자는 이러한 행동이 모든 사람이 본래 [A] 욕망을 가지고 있으면서도 동시에 [B] 사람이 되려고 노력하기 때문에 발생한다고 주장했다.","bank":["selfish","expensive","former","virtuous","latter","compromise"],"bko":{"selfish":"이기적인","expensive":"비싼","former":"이전의","virtuous":"도덕적인","latter":"후자의","compromise":"해치다"},"r":{"a":"[A] selfish (이기적인), [B] virtuous (도덕적인)","ev":"9번 문장","s":[[9,"The author claimed that this behavior occurs because everyone has inherently selfish desires but simultaneously strives to be virtuous.","저자는 이러한 행동이 모든 사람들이 본래 이기적인 욕망을 가지고 있으면서도 동시에 도덕적으로 살고자 노력하기 때문에 발생한다고 주장했다."]],"w":"9번 문장은 사람이 본래 이기적인(selfish) 욕망을 가지면서도 도덕적인(virtuous) 사람이 되려고 노력한다는 주장을 말해요.","c":null},"h":"6e8373703b"}]},{"u":5,"id":"ch3-05-2","no":2,"ko":"손을 씻으면 사라져요","items":[{"n":1,"t":"tf","q":"The rewards the psychologists offered included pens, kitchen tools, and cleaning products.","ko":"심리학자들이 제공한 보상에는 펜, 주방용품, 세정용품이 포함되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The rewards they offered were small, everyday items, including pens, kitchen tools, and cleaning products.","그들이 제공한 보상은 펜, 주방용품, 세정용품 등을 포함하는 작고 일상적인 물건들이었다."]],"w":"6번 문장에서 보상은 펜(pens), 주방용품(kitchen tools), 세정용품(cleaning products)을 포함하는 작고 일상적인 물건이었다고 해요. 본문과 맞아요.","c":"T"},"h":"2f8f6c5767"},{"n":2,"t":"tf","q":"The people who washed their hands felt more guilty and were more likely to do volunteer work later.","ko":"손을 씻은 사람들은 죄책감을 더 느꼈고 나중에 자원봉사를 할 가능성도 더 높았다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"The researchers found that those who washed their hands reported feeling less guilty and were less likely to engage in volunteer work later.","연구자들은 손을 씻은 사람들이 죄책감을 덜 느낀다고 보고했고, 나중에 자원봉사에 참여할 가능성도 더 낮다고 밝혔다."]],"w":"10번 문장은 손을 씻은 사람들이 죄책감을 덜(less guilty) 느꼈고 자원봉사에 참여할 가능성도 더 낮았다(less likely)고 해요. 두 가지 모두 반대로 말한 문장이에요.","c":"F"},"h":"742484003d"},{"n":3,"t":"tf","q":"After recalling their bad behavior, people chose a pen more often than a cleaning product.","ko":"나쁜 행동을 떠올린 후, 사람들은 세정용품보다 펜을 더 자주 골랐다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"After thinking about their bad behavior, people were significantly more inclined to choose a cleaning product, such as soap or hand wipes, than any of the other products.","나쁜 행동을 떠올린 후, 사람들은 다른 제품들보다 비누나 손 닦는 티슈와 같은 세정용품을 고르는 경향이 훨씬 더 높았다."]],"w":"7번 문장은 나쁜 행동을 떠올린 후 사람들이 다른 어떤 제품보다 비누나 손 닦는 티슈 같은 세정용품을 훨씬 더 많이 골랐다고 해요. 펜을 더 자주 골랐다는 것은 반대예요.","c":"F"},"h":"708bb8ef41"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…it is possible to alleviate feelings of guilt physically.)","ko":"(…죄책감을 신체적으로 …하는 것이 가능하다.)","opts":["숨기다","키우다","완화하다","설명하다"],"word":"alleviate","r":{"a":"3) 완화하다","ev":"3번 문장","s":[[3,"Although this is a purely fictional depiction, some psychologists propose it is possible to alleviate feelings of guilt physically.","비록 이것은 순전히 허구적인 묘사이지만, 일부 심리학자들은 죄책감을 신체적으로 완화하는 것이 가능하다고 제안한다."]],"w":"3번 문장은 죄책감을 몸으로(손 씻기 같은 행동으로) 줄일 수 있다는 내용이에요. 뒤에서 손을 씻으면 죄책감이 덜해진다고 하므로 alleviate = 완화하다예요. 키우다는 반대 뜻이에요.","c":3},"h":"d574f6add3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…when they had behaved unethically in the past…)","ko":"(…과거에 그들이 …하게 행동했던 때…)","opts":["비윤리적으로","용감하게","조용하게","정직하게"],"word":"unethically","r":{"a":"1) 비윤리적으로","ev":"5번 문장","s":[[5,"In one study, the psychologists prompted select participants to recall instances when they had behaved unethically in the past, then thanked everyone for participating and allowed each person to choose a reward.","한 연구에서, 심리학자들은 선택된 참가자들에게 과거에 비도덕적으로 행동했던 사례를 떠올리게 한 다음, 모두에게 참가에 감사를 표하고 각자가 보상을 고를 수 있게 했다."]],"w":"5번 문장은 참가자들이 떠올린 것이 ‘나쁜 행동’이었다는 내용이에요(7번의 their bad behavior와 같은 말). ethical(윤리적인)에 un-이 붙어 unethically = 비윤리적으로예요. 정직하게는 반대 뜻이에요.","c":1},"h":"3be48d9021"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nShe envisions blood on her hands and attempts to wash it off.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그녀는 손에 피가 묻어 있다고 상상하며 그것을 씻어내려고 한다.","opts":["손","피","죄책감","남편"],"r":{"a":"2) 피","ev":"2번 문장","s":[[2,"She envisions blood on her hands and attempts to wash it off.","그녀는 손에 피가 묻어 있다고 상상하며 그것을 씻어내려고 한다."]],"w":"She envisions blood on her hands and attempts to wash it off에서 씻어내려는 대상은 손 위에 있다고 상상한 피(blood)예요. it은 blood를 가리켜요.","c":2,"k":"it = blood (피)"},"pron":"it","h":"5e488580ac"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This phenomenon is called the “Lady Macbeth Effect,” and, unfortunately, it’s not always beneficial.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 현상은 ‘맥베스 부인 효과’ 라고 불리며, 안타깝게도 항상 이로운 것은 아니다.","opts":["이 현상은 맥베스 부인 효과라고 불리며, 언제나 해로운 것은 아니다.","이 현상은 맥베스 부인 효과라고 불리며, 늘 이로움만 준다.","이 현상은 맥베스 부인 효과라고 불리며, 안타깝게도 항상 이로운 것은 아니다.","이 현상은 이름이 없으며, 안타깝게도 아직 연구되지 않았다."],"r":{"a":"3) 이 현상은 맥베스 부인 효과라고 불리며, 안타깝게도 항상 이로운 것은 아니다.","ev":"4번 문장","s":[[4,"This phenomenon is called the “Lady Macbeth Effect,” and, unfortunately, it’s not always beneficial.","이 현상은 ‘맥베스 부인 효과’ 라고 불리며, 안타깝게도 항상 이로운 것은 아니다."]],"w":"not always는 ‘항상 ~인 것은 아니다’라는 부분 부정이고, beneficial은 ‘이로운’이에요. 그래서 ‘항상 이롭지는 않다’가 맞아요. ‘언제나 해롭지는 않다’(①)나 ‘늘 이롭다’(②)는 뜻이 달라요.","c":3},"h":"0455c19ef9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["참가자들은 보상을 고른 뒤에 자신의 나쁜 행동을 떠올렸다.","맥베스 부인은 남편이 왕을 죽인 뒤에 죄책감을 느끼기 시작한다.","두 번째 연구에서는 참가자 모두가 손을 씻을 수 있었다.","맥베스 부인 효과는 언제나 사람에게 이롭다."],"opts":["Participants recalled their bad behavior after they chose a reward.","Lady Macbeth begins to feel guilty after her husband actually kills the king.","In the second study, all of the participants were allowed to wash their hands.","The Lady Macbeth Effect is always good for people."],"r":{"a":"2) Lady Macbeth begins to feel guilty after her husband actually kills the king.","ev":"1번 문장","s":[[1,"In Shakespeare’s renowned play Macbeth, Lady Macbeth encourages her husband to kill the king, but begins to feel overwhelming guilt after he actually does.","셰익스피어의 유명한 희곡 『맥베스』에서, 맥베스 부인은 남편에게 왕을 죽이라고 부추기지만, 그가 정말로 그렇게 한 후에는 압도적인 죄책감을 느끼기 시작한다."]],"w":"1번에서 맥베스 부인은 남편이 실제로 왕을 죽인 뒤에 압도적인 죄책감을 느끼기 시작해요. 보상을 고르는 것은 나쁜 행동을 떠올린 뒤이고(5번), 두 번째 연구는 절반만 씻었으며(9번), 효과가 항상 이롭지는 않아요(4번).","c":2},"h":"1030e89cd0"},{"n":9,"t":"sum","q":"Although washing hands can (A) negative emotions, it may also (B) our moral feelings.","ko":"손 씻기는 부정적인 감정을 (A)할 수 있지만, 우리의 도덕적 감정도 (B)할 수 있다.","oko":["(A) 만들다 / (B) 강하게 하다","(A) 줄이다 / (B) 약하게 하다","(A) 늘리다 / (B) 보호하다","(A) 무시하다 / (B) 향상시키다","(A) 줄이다 / (B) 보호하다"],"opts":["(A) create / (B) strengthen","(A) reduce / (B) weaken","(A) increase / (B) protect","(A) ignore / (B) improve","(A) reduce / (B) protect"],"r":{"a":"2) (A) reduce / (B) weaken","ev":"4번, 11번 문장","s":[[4,"This phenomenon is called the “Lady Macbeth Effect,” and, unfortunately, it’s not always beneficial.","이 현상은 ‘맥베스 부인 효과’ 라고 불리며, 안타깝게도 항상 이로운 것은 아니다."],[11,"These findings suggest that washing one’s hands can minimize negative emotions, but it can also diminish emotions related to morality.","이러한 발견은 손 씻기가 부정적인 감정을 최소화할 수 있지만, 도덕성과 관련된 감정 또한 약화시킬 수 있음을 시사한다."]],"w":"11번에서 손 씻기는 부정적인 감정을 최소화할 수 있지만(minimize) 도덕성과 관련된 감정을 약하게 할 수도 있다(diminish)고 해요. 그래서 (A)는 reduce, (B)는 weaken이에요. ⑤는 (B)에 protect를 넣어 ‘although … also’로 이어지는 반대 흐름이 깨져요.","c":2},"h":"571c2aa841"},{"n":10,"t":"fill","q":"But this time, [A] of them were allowed to wash their hands afterward, [B] the others were not.","ko":"그러나 이번에는 그들 중 [A]만 그 후에 손을 씻을 수 있게 했고, [B] 나머지는 그렇지 못하게 했다.","bank":["half","guilt","while","soap","moral","reward"],"bko":{"half":"절반","guilt":"죄책감","while":"반면","soap":"비누","moral":"도덕적인","reward":"보상"},"r":{"a":"[A] half (절반), [B] while (반면)","ev":"9번 문장","s":[[9,"But this time, half of them were allowed to wash their hands afterward, while the others were not.","그러나 이번에는 그들 중 절반만 그 후에 손을 씻을 수 있게 했고, 나머지는 그렇지 못하게 했다."]],"w":"9번 문장은 이번에는 절반(half)만 손을 씻게 했고, 나머지는 못 씻게 했다는 내용이에요. while은 ‘~하는 반면’이라는 뜻이에요.","c":null},"h":"87ea06eea0"}]},{"u":5,"id":"ch3-05-3","no":3,"ko":"‘왜?’라고 다섯 번 묻기","items":[{"n":1,"t":"tf","q":"The change in the timing of the lights caused the number of insects near the memorial to increase.","ko":"조명 시간의 변경은 기념비 근처 곤충의 수를 증가하게 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"5. Why?: The lights surrounding the memorial had been adjusted to turn on at dusk a few months ago, causing a swell in the population of insects that are most active at dusk.","5. 왜? : 기념비를 둘러싸고 있는 조명이 몇 달 전에 해 질 무렵에 켜지도록 조정되어, 해 질 무렵에 가장 활동적인 곤충 개체수의 증가를 유발했다."]],"w":"9번 문장에서 조명이 해 질 무렵에 켜지도록 조정되어 해 질 무렵에 가장 활동적인 곤충의 개체수가 늘었다(causing a swell)고 해요. 본문과 맞아요.","c":"T"},"h":"26b156474c"},{"n":2,"t":"tf","q":"The workers had recently changed to weaker cleaners for the memorial’s exterior surface.","ko":"근로자들은 최근 기념비의 외부 표면에 더 약한 세제로 바꾸었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"1. Why?: They had recently transitioned to stronger cleaners for the memorial’s exterior surface.","1. 왜? : 그들은 최근 기념비의 외부 표면을 닦기 위해 더 강력한 세제로 바꿨다."]],"w":"5번 문장은 더 강한 세제(stronger cleaners)로 바꿨다고 해요. 약한 세제로 바꿨다는 것은 반대예요.","c":"F"},"h":"9f3a9a98b8"},{"n":3,"t":"tf","q":"The “5 Whys” technique starts with the cause and works forward to the result.","ko":"‘5 Whys’ 기법은 원인에서 시작해 결과를 향해 앞으로 나아간다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"A superior alternative to try is the “5 Whys” technique, which is an approach that involves starting with the result and working backward, asking “why?” at each stage.","시도할 우수한 대안은 ‘5 Whys’ 기법인데, 이 기법은 결과에서 시작해 거꾸로 거슬러가며 각 단계에서 ‘왜?’ 라고 질문하는 접근법이다."]],"w":"2번 문장은 5 Whys가 결과에서 시작해 거꾸로(backward) 거슬러 가며 ‘왜?’라고 묻는 접근법이라고 해요. 원인에서 결과로 나아간다는 것은 반대예요.","c":"F"},"h":"c0c2c592e8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…applied the 5 Whys to devise an effective solution to a problem…)","ko":"(…문제에 대한 효과적인 해결책을 …하기 위해 5 Whys를 적용했다.)","opts":["고안하다","거절하다","복사하다","취소하다"],"word":"devise","r":{"a":"1) 고안하다","ev":"3번 문장","s":[[3,"Recently, a team of workers responsible for maintaining the Jefferson Memorial in Washington, D.C., applied the 5 Whys to devise an effective solution to a problem they were facing.","최근에 워싱턴 D. C. 에 있는 제퍼슨 기념비를 유지하는 것을 맡고 있던 한 근로자 팀이 자신들이 직면한 문제에 대한 효과적인 해결책을 고안하기 위해 5 Whys를 적용했다."]],"w":"3번 문장은 근로자 팀이 직면한 문제의 효과적인 해결책을 ‘생각해 내기’ 위해 5 Whys를 썼다는 내용이에요. devise = 고안하다예요. 해결책을 거절하거나 취소하려고 기법을 쓰지는 않아요.","c":1},"h":"2b3e260876"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…to feed on the flourishing number of spiders there.)","ko":"(…그곳의 …한 수의 거미들을 먹기 위해…)","opts":["줄어드는","숨어 있는","무성한","느린"],"word":"flourishing","r":{"a":"3) 무성한","ev":"7번 문장","s":[[7,"3. Why?: More pigeons were attracted to the memorial to feed on the flourishing number of spiders there.","3. 왜? : 그곳의 무성한 수의 거미들을 먹기 위해 더 많은 비둘기들이 기념비에 모여들었다."]],"w":"7번 문장은 거미가 많아져서 더 많은 비둘기가 먹으러 왔다는 내용이에요. 그러니 거미의 수가 ‘불어나 무성한’ 상태이고, flourishing = 무성한(번성하는)이에요. 줄어드는 거미라면 비둘기가 더 모일 이유가 없어요.","c":3},"h":"c478dc6cf1"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSolution: Readjust the timing of the lights so that they activate later in the evening.","ko":"밑줄 친 they가 가리키는 것은?","sko":"해결책: 조명이 저녁에 더 늦게 활성화되도록 조명 시간을 다시 조정하라.","opts":["비둘기들","조명들","곤충들","근로자들"],"r":{"a":"2) 조명들","ev":"10번 문장","s":[[10,"Solution: Readjust the timing of the lights so that they activate later in the evening.","해결책: 조명이 저녁에 더 늦게 활성화되도록 조명 시간을 다시 조정하라."]],"w":"so that they activate later in the evening은 ‘저녁에 더 늦게 켜지도록’이라는 뜻이에요. 켜지는 것은 조명이라서 they는 the lights예요. 비둘기·곤충·근로자는 ‘활성화’되는 대상이 아니에요.","c":2},"h":"8000627499"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you fail to ask enough questions, you may misunderstand the real reason for the problem and never formulate an effective solution.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 당신이 충분한 질문을 하지 못한다면, 문제점의 진짜 이유를 잘못 이해할지도 모르며, 결코 효과적인 해결책을 만들어내지 못할 수도 있다.","opts":["질문을 많이 하면 문제의 진짜 이유를 오해하게 될 수 있다.","질문을 충분히 해도 효과적인 해결책은 결코 만들 수 없다.","해결책부터 만들면 질문하지 않아도 진짜 이유를 알게 된다.","질문을 충분히 하지 않으면 문제의 진짜 이유를 오해하고 효과적인 해결책도 끝내 만들지 못할 수 있다."],"r":{"a":"4) 질문을 충분히 하지 않으면 문제의 진짜 이유를 오해하고 효과적인 해결책도 끝내 만들지 못할 수 있다.","ev":"12번 문장","s":[[12,"If you fail to ask enough questions, you may misunderstand the real reason for the problem and never formulate an effective solution.","만약 당신이 충분한 질문을 하지 못한다면, 문제점의 진짜 이유를 잘못 이해할지도 모르며, 결코 효과적인 해결책을 만들어내지 못할 수도 있다."]],"w":"fail to ask enough questions는 ‘충분히 질문하지 못하다’이고, 그 결과로 진짜 이유를 오해하고(misunderstand) 효과적인 해결책을 만들지 못한다(never formulate)는 문장이에요. 질문을 ‘많이’ 하는 것이 문제라는 뜻이 아니에요.","c":4},"h":"581aaaf73e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["거미의 수가 줄어서 더 많은 비둘기가 기념비에 왔다.","근로자들은 5 Whys를 쓰지 않고 원인을 추측했다.","제퍼슨 기념비의 표면이 급격히 훼손되고 있었다.","해결책은 조명을 저녁에 더 일찍 켜는 것이었다."],"opts":["More pigeons came to the memorial because the number of spiders decreased.","The workers did not use the 5 Whys and simply guessed the cause.","The surface of the Jefferson Memorial was deteriorating rapidly.","The solution was to turn the lights on earlier in the evening."],"r":{"a":"3) The surface of the Jefferson Memorial was deteriorating rapidly.","ev":"4번 문장","s":[[4,"Problem: The surface of the Jefferson Memorial was deteriorating rapidly.","문제: 제퍼슨 기념비의 표면이 급격히 훼손되고 있었다."]],"w":"4번에서 제퍼슨 기념비의 표면이 급격히 훼손되고 있었다고 해요. 거미는 늘어서 비둘기가 왔고(7번), 근로자들은 5 Whys를 적용했으며(3번), 조명은 더 늦게 켜지도록 조정했어요(10번).","c":3},"h":"44393ef684"},{"n":9,"t":"sum","q":"The 5 Whys technique helps us (A) the real cause of a problem by repeatedly (B) “why?”","ko":"5 Whys 기법은 ‘왜?’라고 거듭 (B)함으로써 문제의 진짜 원인을 (A)하도록 도와준다.","oko":["(A) 숨기다 / (B) 묻다","(A) 찾다 / (B) 피하다","(A) 바꾸다 / (B) 무시하다","(A) 베끼다 / (B) 판단하다","(A) 찾다 / (B) 묻다"],"opts":["(A) hide / (B) asking","(A) find / (B) avoiding","(A) change / (B) ignoring","(A) copy / (B) judging","(A) find / (B) asking"],"r":{"a":"5) (A) find / (B) asking","ev":"2번, 11번 문장","s":[[2,"A superior alternative to try is the “5 Whys” technique, which is an approach that involves starting with the result and working backward, asking “why?” at each stage.","시도할 우수한 대안은 ‘5 Whys’ 기법인데, 이 기법은 결과에서 시작해 거꾸로 거슬러가며 각 단계에서 ‘왜?’ 라고 질문하는 접근법이다."],[11,"This story shows the importance of getting to the root of a problem thoroughly and efficiently, rather than simply rushing to judgment.","이 이야기는 그저 서둘러 판단하기보다는 철저하고 효율적으로 문제점의 근원에 접근하는 것의 중요성을 보여준다."]],"w":"2번에서 5 Whys는 각 단계에서 ‘왜?’라고 묻는(asking) 접근법이고, 11번에서 문제의 근원에 닿는 것(getting to the root)이 중요하다고 해요. 그래서 (A)는 find, (B)는 asking이에요. (A)가 find여도 (B)가 avoiding이면 ‘묻는다’와 반대예요.","c":5},"h":"dbfdab53e6"},{"n":10,"t":"fill","q":"Spiders had [A] there to [B] on the increasing number of insects in the area.","ko":"거미들은 그 구역에서 증가하는 수의 곤충들을 [B] 위해 그곳으로 [A].","bank":["migrated","prey","deteriorated","activated","formulated","devised"],"bko":{"migrated":"이동했다","prey":"잡아먹기","deteriorated":"훼손되었다","activated":"켜졌다","formulated":"만들어 냈다","devised":"고안했다"},"r":{"a":"[A] migrated (이동했다), [B] prey (잡아먹기)","ev":"8번 문장","s":[[8,"4. Why?: Spiders had migrated there to prey on the increasing number of insects in the area.","4. 왜? : 거미들이 그 구역에서 증가하는 수의 곤충들을 잡아먹기 위해 그곳으로 이동했다."]],"w":"8번 문장은 거미들이 곤충을 잡아먹기(prey) 위해 그곳으로 이동했다(migrated)는 내용이에요.","c":null},"h":"69613a8fde"}]},{"u":5,"id":"ch3-05-4","no":4,"ko":"수능:ON 무관한 문장","items":[{"n":1,"t":"tf","q":"Customers’ feelings during the buying experience affect their purchasing patterns.","ko":"구매 경험 동안 고객들의 기분은 그들의 구매 패턴에 영향을 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Because people’s purchasing patterns are affected by how they feel during the buying experience, happy employees matter.","사람들의 구매 패턴이 구매 경험 동안 그들의 기분이 어떠한지에 의해 영향을 받기 때문에, 행복한 직원들은 중요하다."]],"w":"4번 문장에서 사람들의 구매 패턴이 구매 경험 동안 그들의 기분에 의해 영향을 받는다(are affected by how they feel)고 해요. 본문과 맞아요.","c":"T"},"h":"cd10aef1ac"},{"n":2,"t":"tf","q":"In service organizations, client satisfaction has little to do with the attitudes of employees.","ko":"서비스 조직에서 고객 만족은 직원들의 태도와 별로 관계가 없다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Moreover, in many service organizations, client satisfaction often depends directly on the attitudes of employees, who are the company’s face for customers.","게다가, 많은 서비스 조직에서 고객 만족은 종종 고객에 대한 회사의 얼굴인 직원들의 태도에 직접적으로 달려 있다."]],"w":"3번 문장은 고객 만족이 종종 직원들의 태도에 직접적으로 달려 있다(depends directly on)고 해요. ‘별로 관계가 없다’는 반대 내용이에요.","c":"F"},"h":"dfbc3c46e5"},{"n":3,"t":"tf","q":"Companies want to raise employee contentment for only one reason.","ko":"회사들은 오직 한 가지 이유로 직원 만족도를 높이고 싶어 한다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Companies would like to enhance employee contentment on the job for several reasons.","회사들은 몇 가지 이유들로 직업에 있어서 직원 만족도를 높이고 싶어 한다."]],"w":"1번 문장은 몇 가지 이유로(for several reasons) 직원 만족도를 높이고 싶어 한다고 해요. ‘한 가지 이유’가 아니에요.","c":"F"},"h":"3ea1ef55ca"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…consumers buy less, and company performance suffers.)","ko":"(…소비자들은 덜 사고, 회사의 실적은 …)","opts":["더 나빠진다","더 좋아진다","시작된다","감추어진다"],"word":"suffers","r":{"a":"1) 더 나빠진다","ev":"5번 문장","s":[[5,"When workers are dissatisfied, their unhappiness makes the customer’s experience worse; as a result, consumers buy less, and company performance suffers.","직원들이 불만족할 때, 그들의 불행은 고객의 경험을 더 나쁘게 만든다. 결과적으로, 고객들은 덜 사게 되고, 회사의 실적은 더 나빠진다."]],"w":"5번 문장은 직원이 불만족하면 고객의 경험이 나빠지고 소비자가 덜 산다는 내용이라, 회사의 실적도 ‘나빠진다’는 흐름이에요. suffer = 더 나빠지다(시달리다)예요.","c":1},"h":"4060cb13bf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…happy employees matter.)","ko":"(…행복한 직원들은 …)","opts":["사라진다","방해한다","중요하다","웃는다"],"word":"matter","r":{"a":"3) 중요하다","ev":"4번 문장","s":[[4,"Because people’s purchasing patterns are affected by how they feel during the buying experience, happy employees matter.","사람들의 구매 패턴이 구매 경험 동안 그들의 기분이 어떠한지에 의해 영향을 받기 때문에, 행복한 직원들은 중요하다."]],"w":"4번 문장은 구매할 때의 기분이 구매 패턴에 영향을 주기 때문에 행복한 직원이 ‘중요하다’는 내용이에요. 여기서 matter는 ‘물질’이 아니라 동사로 ‘중요하다’예요.","c":3},"h":"1ee4562d32"},{"n":6,"t":"ref","q":"What does the underlined \"who\" refer to?\nMoreover, in many service organizations, client satisfaction often depends directly on the attitudes of employees, who are the company’s face for customers.","ko":"밑줄 친 who가 가리키는 것은?","sko":"게다가, 많은 서비스 조직에서 고객 만족은 종종 고객에 대한 회사의 얼굴인 직원들의 태도에 직접적으로 달려 있다.","opts":["고객들","서비스 조직들","회사의 경영진","직원들"],"r":{"a":"4) 직원들","ev":"3번 문장","s":[[3,"Moreover, in many service organizations, client satisfaction often depends directly on the attitudes of employees, who are the company’s face for customers.","게다가, 많은 서비스 조직에서 고객 만족은 종종 고객에 대한 회사의 얼굴인 직원들의 태도에 직접적으로 달려 있다."]],"w":"who 앞에 쉼표가 있어서 바로 앞의 employees를 부연 설명해요. 고객 앞에서 ‘회사의 얼굴’인 사람들은 직원들이에요. 고객이나 조직이 회사의 얼굴인 것은 아니에요.","c":4},"h":"e1c3f5beb4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because people’s purchasing patterns are affected by how they feel during the buying experience, happy employees matter.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사람들의 구매 패턴이 구매 경험 동안 그들의 기분이 어떠한지에 의해 영향을 받기 때문에, 행복한 직원들은 중요하다.","opts":["사람들의 구매 패턴은 물건을 살 때의 기분에 영향을 받기 때문에, 직원이 행복한지는 소홀히 할 수 없는 문제이다.","사람들은 기분이 나쁠 때만 물건을 사기 때문에, 직원이 행복한지는 상관이 없다.","직원이 행복해질수록 사람들은 구매 경험을 하지 않게 된다.","직원들의 기분은 구매 패턴에 영향을 받기 때문에, 직원의 구매 경험이 중요하다."],"r":{"a":"1) 사람들의 구매 패턴은 물건을 살 때의 기분에 영향을 받기 때문에, 직원이 행복한지는 소홀히 할 수 없는 문제이다.","ev":"4번 문장","s":[[4,"Because people’s purchasing patterns are affected by how they feel during the buying experience, happy employees matter.","사람들의 구매 패턴이 구매 경험 동안 그들의 기분이 어떠한지에 의해 영향을 받기 때문에, 행복한 직원들은 중요하다."]],"w":"Because ~는 이유를 나타내요. 사람들의 구매 패턴이 구매 경험 중의 기분에 영향을 받기 때문에 행복한 직원이 중요하다는 뜻이에요.","c":1},"h":"85bddd247f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["행복한 직원은 덜 일해서 회사는 더 높은 비용으로 생산한다.","구매 경험 동안의 기분은 고객의 구매 패턴과 관계가 없다.","회사는 직원들이 어떻게 느끼는지 알 필요가 없다.","불만족한 직원은 고객의 경험을 더 나쁘게 만들 수 있다."],"opts":["Happy employees work less, so companies produce at a higher cost.","Customers’ feelings while buying have nothing to do with their purchasing patterns.","Companies do not need to know how their workers feel.","Dissatisfied employees can make customers’ experiences worse."],"r":{"a":"4) Dissatisfied employees can make customers’ experiences worse.","ev":"5번 문장","s":[[5,"When workers are dissatisfied, their unhappiness makes the customer’s experience worse; as a result, consumers buy less, and company performance suffers.","직원들이 불만족할 때, 그들의 불행은 고객의 경험을 더 나쁘게 만든다. 결과적으로, 고객들은 덜 사게 되고, 회사의 실적은 더 나빠진다."]],"w":"5번에서 직원들이 불만족하면 그들의 불행이 고객의 경험을 더 나쁘게 만든다고 해요. 행복한 직원은 더 열심히 일하고(2번), 구매 기분은 구매 패턴에 영향을 주며(4번), 회사가 아는 것은 중요해요(6번).","c":4},"h":"c35e9fe37f"},{"n":9,"t":"sum","q":"Job satisfaction increases (A) because happy employees work (B), allowing companies to produce more at a lower cost.","ko":"행복한 직원들은 (B) 일하기 때문에 직업 만족도는 (A)을(를) 높이며, 회사로 하여금 더 낮은 비용에 더 많이 생산하게 한다.","oko":["A 비용 / B 덜","A 위험 / B 더 느리게","A 생산성 / B 더 열심히","A 빚 / B 나중에","A 가격 / B 혼자서"],"opts":["(A) costs / (B) less","(A) risks / (B) slower","(A) productivity / (B) harder","(A) debts / (B) later","(A) prices / (B) alone"],"r":{"a":"3) (A) productivity / (B) harder (A 생산성 / B 더 열심히)","ev":"2번 문장","s":[[2,"Job satisfaction increases productivity because happy employees work harder, allowing companies to produce more at a lower cost.","행복한 직원들은 더 열심히 일하기 때문에 직업 만족도는 생산성을 높이며, 회사로 하여금 더 낮은 비용에 더 많이 생산하게 한다."]],"w":"2번 문장은 행복한 직원들이 더 열심히(harder) 일해서 직업 만족도가 생산성(productivity)을 높인다고 말해요.","c":3},"h":"6b3d911871"},{"n":10,"t":"fill","q":"Clearly, it is [A] for companies to know what makes their employees [B] with their jobs.","ko":"분명히, 회사가 무엇이 자사의 직원들이 자기 일에 [B] 하는지를 아는 것은 [A].","bank":["important","satisfied","expensive","honest","curious","proud"],"bko":{"important":"중요하다","satisfied":"만족하게","expensive":"비싸다","honest":"정직하다","curious":"궁금하다","proud":"자랑스럽게"},"r":{"a":"[A] important (중요하다), [B] satisfied (만족하게)","ev":"6번 문장","s":[[6,"Clearly, it is important for companies to know what makes their employees satisfied with their jobs.","분명히, 회사가 무엇이 자사의 직원들이 자기 일에 만족하게 하는지를 아는 것은 중요하다."]],"w":"6번 문장은 무엇이 직원들을 일에 만족하게(satisfied) 하는지 아는 것이 회사에 중요하다(important)는 내용이에요.","c":null},"h":"0eb758b79e"}]},{"u":6,"id":"ch3-06-1","no":1,"ko":"당신이 배고픈 이유","items":[{"n":1,"t":"tf","q":"Ghrelin is the first natural appetite stimulant found to be produced outside the brain.","ko":"그렐린은 뇌 밖에서 생성된다고 알려진 최초의 천연 식욕 자극제이다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"It is the first natural appetite stimulant found to be produced outside the brain; it is produced by specialized cells in the stomach.","그것은 뇌의 외부에서 생성된다고 알려진 최초의 천연 식욕 자극제이며, 그것은 위장 내의 분화된 세포들에 의해 생성된다."]],"w":"7번 문장에 the first natural appetite stimulant found to be produced outside the brain이라고 나와요. found(알려진)가 stimulant를 꾸며 주어 ‘뇌 밖에서 생성된다고 알려진 최초의 식욕 자극제’라는 뜻이에요. 본문과 맞아요.","c":"T"},"h":"d8704822b5"},{"n":2,"t":"tf","q":"Patients who have had a gastric bypass feel stronger hunger pains because their ghrelin levels stay high.","ko":"위장 접합술을 받은 환자들은 그렐린 수치가 높게 유지되어 더 강한 배고픔의 고통을 느낀다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In patients who have received a surgical operation called a gastric bypass, however, ghrelin levels remain low, so they do not have the same hunger pains.","그러나, 위장 접합술이라고 불리는 외과 수술을 받은 환자들에게서는 그렐린 수치가 낮게 유지되고, 따라서 그들은 동일한 배고픔의 고통을 느끼지 않는다."]],"w":"5번 문장에서 위장 접합술을 받은 환자는 ghrelin levels remain low, 즉 수치가 낮게 유지되고 같은 배고픔의 고통을 느끼지 않는다고 해요. 높다(high)·더 강하다(stronger)는 정반대예요.","c":"F"},"h":"071fbcf246"},{"n":3,"t":"tf","q":"Medications that increase ghrelin are expected to help obese people lose weight.","ko":"그렐린을 증가시키는 약물이 비만인 사람들의 체중 감량을 도울 것으로 기대된다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"The hope is that medications that decrease or block ghrelin may be developed, which would help obese people lose weight and keep it off.","희망사항은 그렐린을 감소시키거나 차단하는 약물이 개발되는 것인데, 이는 비만인 사람들이 체중을 감량하고 유지하는 것을 도와줄 것이다."],[10,"Likewise, medications that boost ghrelin levels may lead dangerously thin cancer patients to recover their appetite.","마찬가지로, 그렐린 수치를 높이는 약물은 위험할 정도로 마른 암 환자들이 식욕을 회복하게 이끌지도 모른다."]],"w":"9번 문장에서 비만인을 돕는 약은 ghrelin을 줄이거나(decrease) 막는(block) 약이에요. ghrelin을 높이는(boost) 약은 10번 문장에서 마른 암 환자의 식욕 회복에 쓰여요.","c":"F"},"h":"0469c729e0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…causes hunger and slows the body’s fat-burning capacity.)","ko":"(…배고픔을 유발하고 신체의 지방 연소 …을 떨어뜨린다.)","opts":["규칙","능력","무게","기억"],"word":"capacity","r":{"a":"2) 능력","ev":"2번 문장","s":[[2,"The answer is ghrelin, a naturally occurring hormone that causes hunger and slows the body’s fat-burning capacity.","그 답은 그렐린으로, 배고픔을 유발하고 신체의 지방 연소 능력을 떨어뜨리는 자연적으로 발생하는 호르몬이다."]],"w":"2번 문장은 ghrelin이 배고픔을 일으키고 몸이 지방을 태우는 힘을 떨어뜨린다는 말이에요. fat-burning capacity는 ‘지방을 태우는 능력’이에요. 규칙·무게·기억은 문맥에 맞지 않아요.","c":2},"h":"93232a407b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…why dieters may struggle to maintain weight loss…)","ko":"(…왜 다이어트를 하는 사람들이 체중 감량을 …하는 데 어려움을 겪을 수 있는지…)","opts":["유지하다","시작하다","기록하다","검사하다"],"word":"maintain","r":{"a":"1) 유지하다","ev":"1번 문장","s":[[1,"A scientific breakthrough further explains why people get hungry at mealtimes, why dieters may struggle to maintain weight loss, and why stomach surgery may be an effective treatment for dangerously overweight patients.","한 과학적 발견은 사람들이 왜 끼니때에 배가 고프게 되는지, 왜 다이어트를 하는 사람들이 체중이 감량된 상태를 유지하는 데 어려움을 겪을 수 있는지, 그리고 왜 위험할 정도로 과체중인 환자들에게 위 수술이 효과적인 치료법이 될 수 있는지를 더 깊이 있게 설명해 준다."]],"w":"1번 문장은 다이어트하는 사람들이 줄인 체중을 ‘계속 지키기’ 어려운 까닭을 묻는 말이에요. maintain은 ‘유지하다’예요.","c":1},"h":"4d28e0737f"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis drives them to eat, forcing them to put the weight back on.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 그들로 하여금 먹게 만들어 다시 체중이 늘어나게 한다.","opts":["다이어트하는 사람들이 체중을 다시 늘리는 것","위장 접합술을 받은 환자의 그렐린 수치가 낮은 것","체중을 감량할 때 그렐린 생성이 증가하는 것","과학자들이 새로운 연구를 발표한 것"],"r":{"a":"3) 체중을 감량할 때 그렐린 생성이 증가하는 것","ev":"3~4번 문장","s":[[3,"New research indicates that dieters experience increased production of ghrelin when they lose weight.","새로운 연구는 다이어트를 하는 사람들이 체중을 감량할 때 증가된 그렐린 생성을 경험한다는 것을 보여 준다."],[4,"This drives them to eat, forcing them to put the weight back on.","이것은 그들로 하여금 먹게 만들어 다시 체중이 늘어나게 한다."]],"w":"This는 사람들을 ‘먹게 만드는’ 원인이에요. 3번 문장에서 체중을 감량할 때 ghrelin 생성이 늘어난다고 했고, 그 결과 4번에서 먹게 되고 다시 체중이 늘어요. ①은 This가 낳는 결과(forcing ~)이지 This 자체가 아니에요.","c":3},"h":"11bd22daf9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since it occurs outside the brain, it may be an easier target for scientists searching for a way to control appetite.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"뇌 외부에서 생성되기 때문에, 그것은 식욕을 통제하는 방법을 찾는 과학자들에게는 (연구하기) 더 쉬운 대상일지도 모른다.","opts":["식욕을 통제하려면 뇌 안에서 만들어지는 물질만 연구해야 한다.","뇌 밖에서 생성되기 때문에 식욕을 통제하는 것은 불가능하다.","과학자들은 식욕을 통제하는 방법을 찾으려고 뇌 밖의 세포를 없앤다.","뇌 밖에서 생성되므로, 식욕을 통제할 방법을 찾는 과학자들에게 연구하기 더 쉬운 대상일 수 있다."],"r":{"a":"4) 뇌 밖에서 생성되므로, 식욕을 통제할 방법을 찾는 과학자들에게 연구하기 더 쉬운 대상일 수 있다.","ev":"8번 문장","s":[[8,"Since it occurs outside the brain, it may be an easier target for scientists searching for a way to control appetite.","뇌 외부에서 생성되기 때문에, 그것은 식욕을 통제하는 방법을 찾는 과학자들에게는 (연구하기) 더 쉬운 대상일지도 모른다."]],"w":"8번 문장은 ghrelin이 뇌 밖에서 생기기 때문에 식욕을 다스릴 방법을 찾는 과학자들에게 더 쉬운 대상일 수 있다는 뜻이에요. ‘불가능하다’거나 ‘뇌 안 물질만 연구해야 한다’는 말은 없어요.","c":4},"h":"90e138bc76"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그렐린은 배고픔을 줄이고 신체의 지방 연소를 빠르게 한다.","다이어트하는 사람들은 체중을 감량하면서 그렐린을 더 적게 만든다.","그렐린은 뇌와 소화기 계통 사이에 메시지를 전달하는 물질 중 하나이다.","뇌 속의 분화된 세포가 그렐린을 만든다."],"opts":["Ghrelin lowers hunger and speeds up the body’s fat burning.","Dieters make less ghrelin as they lose weight.","Ghrelin is one of the substances that pass messages between the brain and the digestive system.","Specialized cells in the brain produce ghrelin."],"r":{"a":"3) Ghrelin is one of the substances that pass messages between the brain and the digestive system.","ev":"6번 문장","s":[[6,"Ghrelin is one of many substances produced naturally in the body that pass messages between the brain and the digestive system.","그렐린은 신체 내에서 자연적으로 생성되는, 뇌와 소화기 계통 사이에서 메시지를 전달하는 많은 물질 중 하나이다."]],"w":"6번 문장에서 ghrelin은 뇌와 소화기 계통 사이에서 메시지를 전달하는 많은 물질 중 하나라고 해요. ghrelin은 배고픔을 일으키고 지방 연소 능력을 떨어뜨리며(2번), 체중을 줄이면 오히려 늘어나고(3번), 위장의 세포에서 생성돼요(7번).","c":3},"h":"5b6f9685d4"},{"n":9,"t":"sum","q":"Ghrelin is a natural (A) produced in the (B), and scientists hope to use it to control weight problems.","ko":"그렐린은 (B)에서 생성되는 자연적인 (A)이며, 과학자들은 그것을 이용해 체중 문제를 조절하기를 바란다.","oko":["(A) 호르몬 / (B) 뇌","(A) 약 / (B) 위","(A) 호르몬 / (B) 위","(A) 질병 / (B) 심장","(A) 비타민 / (B) 뇌"],"opts":["(A) hormone / (B) brain","(A) medicine / (B) stomach","(A) hormone / (B) stomach","(A) disease / (B) heart","(A) vitamin / (B) brain"],"r":{"a":"3) (A) hormone / (B) stomach ((A) 호르몬 / (B) 위)","ev":"2번, 7번, 9번 문장","s":[[2,"The answer is ghrelin, a naturally occurring hormone that causes hunger and slows the body’s fat-burning capacity.","그 답은 그렐린으로, 배고픔을 유발하고 신체의 지방 연소 능력을 떨어뜨리는 자연적으로 발생하는 호르몬이다."],[7,"It is the first natural appetite stimulant found to be produced outside the brain; it is produced by specialized cells in the stomach.","그것은 뇌의 외부에서 생성된다고 알려진 최초의 천연 식욕 자극제이며, 그것은 위장 내의 분화된 세포들에 의해 생성된다."],[9,"The hope is that medications that decrease or block ghrelin may be developed, which would help obese people lose weight and keep it off.","희망사항은 그렐린을 감소시키거나 차단하는 약물이 개발되는 것인데, 이는 비만인 사람들이 체중을 감량하고 유지하는 것을 도와줄 것이다."]],"w":"2번 문장에서 ghrelin은 자연적으로 생기는 호르몬(hormone)이고, 7번 문장에서 위(stomach)의 세포가 만든다고 해요. 뇌 밖에서 생성된다고 했으니 brain은 아니고, medicine·disease·vitamin은 본문에 없어요.","c":3},"h":"33b2070ec5"},{"n":10,"t":"fill","q":"In short, ghrelin could be the [A] to finding workable [B] to weight control problems.","ko":"요컨대, 그렐린은 체중 조절 문제에 대한 실행 가능한 [B]을(를) 찾는 [A]이(가) 될 수 있다.","bank":["key","solutions","brain","surgery","patients","cells"],"bko":{"key":"열쇠","solutions":"해결책(들)","brain":"뇌","surgery":"수술","patients":"환자들","cells":"세포들"},"r":{"a":"[A] key (열쇠), [B] solutions (해결책(들))","ev":"11번 문장","s":[[11,"In short, ghrelin could be the key to finding workable solutions to weight control problems.","요컨대, 그렐린은 체중 조절 문제에 대한 실행 가능한 해결책을 찾는 데 열쇠가 될 수 있을 것이다."]],"w":"11번 문장에서 ghrelin이 체중 조절 문제의 해결책(solutions)을 찾는 데 열쇠(key)가 될 수 있다고 해요. brain·surgery·patients·cells는 빈칸에 넣으면 뜻이 맞지 않아요.","c":null},"h":"592e7e7ed2"}]},{"u":6,"id":"ch3-06-2","no":2,"ko":"얼마나 매운지 말해봐!","items":[{"n":1,"t":"tf","q":"In 1912, a chemist named Wilbur Scoville first introduced the Scoville Scale.","ko":"1912년에 윌버 스코빌이라는 이름의 화학자가 스코빌 척도를 처음 도입했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The scale was first introduced in 1912 by a chemist named Wilbur Scoville.","그 척도는 1912년에 윌버 스코빌이라는 이름의 화학자에 의해 처음 도입되었다."]],"w":"6번 문장에 The scale was first introduced in 1912 by a chemist named Wilbur Scoville이라고 나와요. 1912년, 화학자, 처음 도입했다는 내용이 모두 본문과 맞아요.","c":"T"},"h":"f36238b89c"},{"n":2,"t":"tf","q":"In the Scoville test, whole peppers are mixed with sugar water without being ground up first.","ko":"스코빌 테스트에서는 고추를 먼저 갈지 않고 통째로 설탕물에 섞는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Here’s the test: peppers are ground up and mixed with sugar water.","여기 그 실험이 있다. 고추는 갈려서 설탕물과 섞인다."]],"w":"7번 문장에서 고추는 갈려서(ground up) 설탕물과 섞인다고 해요. ‘갈지 않고 통째로’는 본문과 달라요.","c":"F"},"h":"e3bf17f26b"},{"n":3,"t":"tf","q":"The Scoville Scale measures the amount of sugar in each pepper.","ko":"스코빌 척도는 각각의 고추 안에 있는 설탕의 양을 측정한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Commonly known as the Scoville Scale, it measures the amount of the chemical capsaicin present in each pepper.","흔히 스코빌 척도라고 알려진 그것은 각각의 고추 안에 존재하는 화학 물질인 캡사이신의 양을 측정한다."]],"w":"4번 문장에서 스코빌 척도가 재는 것은 각 고추 안에 존재하는 캡사이신(capsaicin)의 양이에요. 설탕물은 용액을 묽게 하는 데 쓰일 뿐 재는 대상이 아니에요.","c":"F"},"h":"5ca76b0863"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…an SHU number is assigned.)","ko":"(…SHU 수치가 …된다.)","opts":["삭제된","부여된","숨겨진","나뉜"],"word":"assigned","r":{"a":"2) 부여된","ev":"9번 문장","s":[[9,"Based on how much sugar water is required to dilute each pepper to this level, an SHU number is assigned.","얼마나 많은 설탕물이 각각의 고추를 이 정도까지 희석하는 데 필요한지를 바탕으로 하여, SHU 수치가 부여된다."]],"w":"9번 문장은 필요한 설탕물의 양을 바탕으로 각 고추에 SHU 수치를 정해 준다는 말이에요. be assigned는 ‘부여되다’예요.","c":2},"h":"d98e90f905"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Testers then sip the solution, …)","ko":"(검사자들은 그러고 나서 그 용액을 …하는데, …)","opts":["홀짝이다","던지다","섞다","측정하다"],"word":"sip","r":{"a":"1) 홀짝이다","ev":"8번 문장","s":[[8,"Testers then sip the solution, which is gradually diluted until it no longer burns their tongues.","그러고 나서 검사자들은 그 용액을 조금 마시는데, 그것은 더 이상 그들의 혀를 얼얼하게 하지 않을 때까지 점점 희석된다."]],"w":"8번 문장에서 시음자들은 용액을 조금씩 마셔 혀가 얼얼한지 확인해요. sip은 ‘홀짝이다, 조금씩 마시다’예요. 섞는 것은 7번에서 고추와 설탕물을 섞는 일이에요.","c":1},"h":"6940512485"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt also measures capsaicin levels, but it does so in a more scientific manner than the original Scoville test.","ko":"밑줄 친 It이 가리키는 것은?","sko":"이것 역시 캡사이신의 정도를 측정하지만 원래의 스코빌 테스트보다, 더 과학적인 방법으로 그렇게 한다.","opts":["스코빌 척도","고성능 액체 크로마토그래피","고추 속의 캡사이신","윌버 스코빌의 업적"],"r":{"a":"2) 고성능 액체 크로마토그래피","ev":"13~14번 문장","s":[[13,"These days, when people want to measure levels of spiciness more accurately, they use something known as High Performance Liquid Chromatography.","오늘날, 사람들이 매운맛의 정도를 더 정확하게 측정하길 원할 때 그들은 고성능 액체 크로마토그래피라고 알려진 무언가를 사용한다."],[14,"It also measures capsaicin levels, but it does so in a more scientific manner than the original Scoville test.","이것 역시 캡사이신의 정도를 측정하지만 원래의 스코빌 테스트보다, 더 과학적인 방법으로 그렇게 한다."]],"w":"13번 문장에서 요즘 더 정확하게 재기 위해 쓰는 방법으로 고성능 액체 크로마토그래피가 나와요. 14번의 It은 이 방법이에요. also(역시)와 ‘원래의 스코빌 테스트보다 더 과학적’이라는 말에서 스코빌 척도와 다른 방법임을 알 수 있어요.","c":2},"h":"05b84f9796"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Scoville’s system can give a good idea of how spicy a pepper is.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"스코빌의 시스템은 고추가 얼마나 매운지 잘 알려줄 수 있다.","opts":["고추가 얼마나 매운지 알려 주는 일은 스코빌의 시스템으로는 전혀 할 수 없다.","스코빌의 시스템은 고추의 가격이 얼마나 싼지를 알려 준다.","스코빌의 시스템은 고추가 얼마나 매운지 어느 정도 잘 알려 줄 수 있다.","스코빌의 시스템을 쓰려면 고추를 먼저 맛봐서 좋아해야 한다."],"r":{"a":"3) 스코빌의 시스템은 고추가 얼마나 매운지 어느 정도 잘 알려 줄 수 있다.","ev":"11번 문장","s":[[11,"Scoville’s system can give a good idea of how spicy a pepper is.","스코빌의 시스템은 고추가 얼마나 매운지 잘 알려줄 수 있다."]],"w":"11번 문장은 스코빌의 시스템이 고추가 얼마나 매운지 잘 알려줄 수 있다는 뜻이에요(장점). ‘전혀 할 수 없다’는 말은 반대이고, 가격이나 좋아하는 맛은 본문에 없어요.","c":3},"h":"80f1b046a1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["스코빌 척도의 점수는 항상 1000 SHU보다 작은 수로 나온다.","나가 졸로키아는 피망보다 훨씬 낮은 점수를 받는다.","스코빌 척도의 수치는 100 SHU의 배수로 매겨진다.","피망은 스코빌 척도에서 백만 SHU를 넘는다."],"opts":["Scores on the Scoville Scale are always numbers smaller than 1,000 SHU.","Naga Jolokia gets a much lower score than sweet bell peppers.","The numbers on the Scoville Scale are given in multiples of 100 SHU.","Sweet bell peppers score over one million SHU on the Scoville Scale."],"r":{"a":"3) The numbers on the Scoville Scale are given in multiples of 100 SHU.","ev":"10번 문장","s":[[10,"These numbers are given in multiples of 100 SHU, and the scores range from zero for sweet bell peppers to over one million SHU for an extremely spicy pepper known as Naga Jolokia.","이 수치는 100 SHU의 배수로 매겨지며, 그 점수는 피망에 해당하는 0에서부터 나가 졸로키아라고 알려진 엄청나게 매운 고추에 해당하는 백만 SHU를 넘는 범위에 걸쳐 있다."]],"w":"10번 문장에서 수치는 100 SHU의 배수로 매겨진다고 해요. 점수는 피망의 0에서 나가 졸로키아의 백만 SHU 넘는 곳까지 걸쳐 있으므로, 나머지는 모두 본문과 달라요.","c":3},"h":"d92d33b998"},{"n":9,"t":"sum","q":"Since the Scoville test relies on the (B) of individual tasters, a more (A) method is now used to measure spiciness.","ko":"스코빌 테스트는 개별 시음자의 (B)에 의존하므로, 지금은 매운 정도를 재는 데 더 (A) 방법이 쓰인다.","oko":["(A) 단순한 / (B) 인식","(A) 정확한 / (B) 기계","(A) 예술적인 / (B) 나이","(A) 정확한 / (B) 인식","(A) 비싼 / (B) 의견"],"opts":["(A) simple / (B) perceptions","(A) accurate / (B) machines","(A) artistic / (B) ages","(A) accurate / (B) perceptions","(A) expensive / (B) opinions"],"r":{"a":"4) (A) accurate / (B) perceptions ((A) 정확한 / (B) 인식)","ev":"12~13번 문장","s":[[12,"However the problem with it is that it relies on the perceptions of individual tasters.","그러나 이것이 갖는 문제점은 각 시음자의 인식에 의존한다는 것이다."],[13,"These days, when people want to measure levels of spiciness more accurately, they use something known as High Performance Liquid Chromatography.","오늘날, 사람들이 매운맛의 정도를 더 정확하게 측정하길 원할 때 그들은 고성능 액체 크로마토그래피라고 알려진 무언가를 사용한다."]],"w":"12번 문장에서 스코빌 테스트는 개별 시음자의 인식(perceptions)에 의존한다는 문제가 있고, 13번 문장에서 사람들은 매운 정도를 더 정확하게(accurately) 재려고 다른 방법을 쓴다고 해요. simple·artistic·expensive와 machines·ages·opinions는 본문과 맞지 않아요.","c":4},"h":"f3ad9d4b04"},{"n":10,"t":"fill","q":"However, in [A] of Wilbur Scoville’s work, the results are often [B] into Scovilles as a unit of measurement.","ko":"그러나 윌버 스코빌의 업적에 [A]을(를) 표하여, 그 결과는 종종 측정 단위인 스코빌로 [B].","bank":["honor","converted","sugar","tongues","peppers","chemist"],"bko":{"honor":"경의","converted":"환산된","sugar":"설탕","tongues":"혀","peppers":"고추","chemist":"화학자"},"r":{"a":"[A] honor (경의), [B] converted (환산된)","ev":"15번 문장","s":[[15,"However, in honor of Wilbur Scoville’s work, the results are often converted into Scovilles as a unit of measurement.","그러나, 윌버 스코빌의 업적에 경의를 표하여, 그 결과는 종종 측정 단위로서 스코빌로 환산된다."]],"w":"15번 문장은 윌버 스코빌의 업적에 경의(honor)를 표하여 결과를 스코빌 단위로 환산한다(converted)는 뜻이에요. sugar·tongues·peppers·chemist는 빈칸에 넣으면 문장이 성립하지 않아요.","c":null},"h":"6107b79855"}]},{"u":6,"id":"ch3-06-3","no":3,"ko":"피로를 부르는 식사","items":[{"n":1,"t":"tf","q":"After a large meal, you may feel sleepy or want to take a nap.","ko":"푸짐한 식사를 한 후에, 당신은 졸리거나 낮잠을 자고 싶을 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Unfortunately, you may find yourself drowsy or tempted to take a nap shortly after eating.","유감스럽게도, 당신은 식사를 한 직후에 자신이 졸리거나 낮잠을 자고 싶은 유혹을 느끼는 상태에 있음을 발견할지도 모른다."]],"w":"2번 문장에서 식사 직후 졸리거나 낮잠 자고 싶은 유혹을 느낄 수 있다고 해요. 본문과 맞아요.","c":"T"},"h":"2140cda494"},{"n":2,"t":"tf","q":"Drinking water makes a food coma more likely.","ko":"물을 마시는 것은 푸드 코마의 가능성을 더 높인다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Drinking water also aids digestion and reduces the chances of a food coma.","물을 마시는 것 또한 소화를 돕고 푸드 코마의 가능성을 줄여 준다."]],"w":"12번 문장에서 물을 마시면 소화를 돕고 푸드 코마의 가능성을 ‘줄인다(reduces)’고 해요. ‘더 높인다’는 반대예요.","c":"F"},"h":"0af7afc97d"},{"n":3,"t":"tf","q":"Any release of insulin, even a moderate one, causes problems for the body.","ko":"적당한 정도라 해도 인슐린의 어떤 분비든 몸에 문제를 일으킨다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"While a moderate release of insulin is normal, consuming foods with a high glycemic index (GI) can cause problems.","인슐린의 적당한 분비는 정상적이지만, 고혈당 지수의 음식을 섭취하는 것은 문제를 야기할 수 있다."]],"w":"7번 문장에서 인슐린의 적당한 분비(a moderate release)는 정상이라고 하고, 문제를 일으킬 수 있는 것은 고혈당 지수 음식을 먹는 경우예요.","c":"F"},"h":"e3b316abe0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Indulging in a large meal is one of the great joys…)","ko":"(풍성한 식사를 …하는 것은 큰 기쁨 중 하나이다…)","opts":["건너뛰는 것","실컷 즐기는 것","준비하는 것","기록하는 것"],"word":"Indulging","r":{"a":"2) 실컷 즐기는 것","ev":"1번 문장","s":[[1,"Indulging in a large meal is one of the great joys of the holidays and other special occasions.","풍성한 식사를 실컷 즐기는 것은 휴일이나 다른 특별한 행사의 큰 기쁨 중 하나이다."]],"w":"1번 문장은 풍성한 식사가 휴일과 특별한 날의 큰 기쁨이라는 말이에요. Indulging in은 ‘~을 실컷 즐기는 것’이에요. 건너뛰거나 준비하는 것은 ‘기쁨’과 맞지 않아요.","c":2},"h":"c569204f6d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To combat post-meal fatigue, consume foods with a low GI…)","ko":"(식사 후 피로를 …하기 위해, 저혈당 지수의 음식을 섭취해라…)","opts":["막다","퍼뜨리다","잊다","늘리다"],"word":"combat","r":{"a":"1) 막다","ev":"11번 문장","s":[[11,"To combat post-meal fatigue, consume foods with a low GI, such as fruit, leafy vegetables, beans, and wholegrain bread.","식사 후 피로를 방지하기 위해서는, 과일, 잎 채소, 콩, 통밀 빵과 같은 저혈당 지수의 음식을 섭취해라."]],"w":"11번 문장은 식사 후 피로를 줄이려면 저혈당 지수 음식을 먹으라는 말이에요. To combat fatigue는 ‘피로를 막기 위해’예요. 퍼뜨리거나 늘리려고 먹으라는 말이 아니에요.","c":1},"h":"a4507804f2"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhen these levels rise, they disrupt our body’s sleep-wake cycle, …","ko":"밑줄 친 they가 가리키는 것은?","sko":"이러한 수치가 상승할 때, 그것들은 우리 몸의 수면-기상 주기를 방해하게 되며, 이 주기는 우리 몸이 긴장을 풀고 쉬고, 잠을 잘 준비를 하도록 신호를 보낸다.","opts":["고혈당 지수의 음식","가공식품","혈당과 인슐린 수치","우리 몸의 수면-기상 주기"],"r":{"a":"3) 혈당과 인슐린 수치","ev":"9~10번 문장","s":[[9,"High GI foods are correlated with faster digestion, leading to a spike in blood sugar and insulin levels.","고혈당 지수의 음식은 더 빠른 소화와 상관관계가 있는데, 이는 혈당과 인슐린 수치의 급격한 상승으로 이어진다."],[10,"When these levels rise, they disrupt our body’s sleep-wake cycle, which signals the body to wind down and prepare for sleep.","이러한 수치가 상승할 때, 그것들은 우리 몸의 수면-기상 주기를 방해하게 되며, 이 주기는 우리 몸이 긴장을 풀고 쉬고, 잠을 잘 준비를 하도록 신호를 보낸다."]],"w":"10번 문장은 ‘이 수치가 오르면 그것들이 수면-기상 주기를 방해한다’는 뜻이에요. they는 When these levels rise의 these levels이고, 9번의 blood sugar and insulin levels(혈당과 인슐린 수치)를 가리켜요. 수면-기상 주기는 방해를 ‘받는’ 쪽이에요.","c":3},"h":"40bfcf6686"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is especially true for processed foods that are heavy in carbohydrates.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 특히 탄수화물이 많이 있는 가공식품에서 더욱 그렇다.","opts":["탄수화물이 적은 음식에서 이 문제가 더 심하다.","가공식품은 탄수화물이 적어서 문제를 일으키지 않는다.","탄수화물이 많은 음식은 모두 가공식품이다.","이 문제는 특히 탄수화물이 많이 든 가공식품에서 더 두드러진다."],"r":{"a":"4) 이 문제는 특히 탄수화물이 많이 든 가공식품에서 더 두드러진다.","ev":"7~8번 문장","s":[[7,"While a moderate release of insulin is normal, consuming foods with a high glycemic index (GI) can cause problems.","인슐린의 적당한 분비는 정상적이지만, 고혈당 지수의 음식을 섭취하는 것은 문제를 야기할 수 있다."],[8,"This is especially true for processed foods that are heavy in carbohydrates.","이는 특히 탄수화물이 많이 있는 가공식품에서 더욱 그렇다."]],"w":"8번 문장의 This는 7번의 ‘고GI 음식이 문제를 일으킬 수 있다’는 말이에요. 그 말이 특히 탄수화물이 많이 든 가공식품에 더 해당한다는 뜻이에요. 탄수화물이 적다거나 ‘모두 가공식품’이라는 말은 본문에 없어요.","c":4},"h":"3bf39abea0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["푸드 코마는 적은 양의 음식을 먹어서 생기는 에너지가 넘치는 느낌이다.","인슐린은 음식을 에너지로 바꾸는 과정에 참여하는 호르몬이다.","저혈당 지수 음식은 혈당과 인슐린 수치를 급격히 올린다.","물을 마시면 몸이 음식을 분해하기가 더 어려워진다."],"opts":["A food coma is a feeling of high energy caused by eating a small amount of food.","Insulin is a hormone that takes part in turning food into energy.","Low GI foods cause blood sugar and insulin levels to spike.","Drinking water makes it harder for the body to break down food."],"r":{"a":"2) Insulin is a hormone that takes part in turning food into energy.","ev":"4번, 6번 문장","s":[[4,"A food coma is a state of extreme tiredness caused by eating a generous serving of food.","푸드 코마는 많은 양의 음식을 먹음으로써 야기되는 극심한 피로 상태이다."],[6,"Eating large portions of food rich in carbohydrates triggers the release of a hormone called insulin, which takes part in the process of converting food into energy.","탄수화물이 풍부한 많은 양의 음식을 먹는 것은 인슐린이라고 불리는 호르몬의 분비를 야기하는데, 인슐린은 음식을 에너지로 전환하는 과정에 참여한다."]],"w":"6번 문장에서
