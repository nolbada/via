A("RT","RT",2,"c",{q:"I want ___ in the race.",ko:"나는 경주에서 달리기를 원한다.",opts:["run","runs","ran","to run","to runs"],ans:"to run",full:"I want to run in the race.",tr:"나는 경주에서 ___ 원한다.",ex:["race = 경주"],h:["본책 UNIT 01을 떠올려요 — want(원하다) 뒤에는 to부정사가 와요.","want 뒤에 어떤 모양이 오는지 보기에서 to가 붙은 것을 찾아요.","동사 run(달리다)과 짝이 되는 to부정사를 골라요."],pen:"want(원하다) + to run(달리기를)"});
A("RT","RT",3,"c",{q:"He kept ___ about his girlfriend.",ko:"그는 여자친구에 대해 계속 생각했다.",opts:["think","thinks","thinking","to think","to thinking"],ans:"thinking",full:"He kept thinking about his girlfriend.",tr:"그는 여자친구에 대해 계속 ___ .",ex:["girlfriend = 여자친구"],h:["본책 UNIT 03을 떠올려요 — keep(계속하다) 뒤에는 동명사(-ing)가 와요.","kept 뒤에 ’계속 ~했다’이므로 -ing가 붙은 보기를 찾아요.","to가 붙지 않은 -ing 모양을 골라요."],pen:"kept(계속했다) + thinking(생각하는 것을)"});
A("RT","RT",4,"c",{q:"다음 보기의 밑줄 친 부분과 쓰임이 같은 것을 고르시오.<br>보기: I promised <u>to meet</u> her at 1:00 p.m.",ko:"나는 내 컴퓨터를 고쳐야 한다.",opts:["I’m sad <u>to leave</u>.","I need <u>to fix</u> my computer.","His goal is <u>to become</u> a lawyer.","They sat down <u>to have</u> lunch.","It is difficult <u>to exercise</u> every day."],ans:"I need <u>to fix</u> my computer.",full:"I need to fix my computer.",tr:"보기: 나는 오후 1시에 그녀를 만나기로 약속했다.<br>① 나는 떠나게 되어 슬프다.<br>② 나는 내 컴퓨터를 고쳐야 한다.<br>③ 그의 목표는 변호사가 되는 것이다.<br>④ 그들은 점심을 먹기 위해 앉았다.<br>⑤ 매일 운동하는 것은 어렵다.",ex:["lawyer = 변호사"],h:["본책 UNIT 01·02의 to부정사 쓰임을 떠올려요 — 명사 역할(~하는 것), 형용사 역할(~할), 부사 역할(~하기 위해·~해서)이에요.","보기의 promised(약속했다) 뒤 to meet은 ’약속한 내용’, 즉 동사가 하는 일을 받는 말이에요.","보기처럼 동사 바로 뒤에서 ’~하기를/~할 것을’로 풀리는 문장을 찾아요."],pen:"promised + to meet(만나기로) = need + to fix(고치기를)"});
A("RT","RT",5,"c",{q:"다음 보기의 밑줄 친 부분과 쓰임이 같은 것을 고르시오.<br>보기: Sandra’s goal is <u>winning</u> the soccer game.",ko:"내 취미는 영화 포스터를 모으는 것이다.",opts:["<u>Making</u> a study plan is important.","She stopped <u>reading</u> the newspaper.","My hobby is <u>collecting</u> movie posters.","He is avoiding <u>meeting</u> Rachel.","I’m afraid of <u>changing</u> my school."],ans:"My hobby is <u>collecting</u> movie posters.",full:"My hobby is collecting movie posters.",tr:"보기: 샌드라의 목표는 축구 경기에서 이기는 것이다.<br>① 공부 계획을 세우는 것은 중요하다.<br>② 그녀는 신문 읽는 것을 멈췄다.<br>③ 내 취미는 영화 포스터를 모으는 것이다.<br>④ 그는 레이철을 만나는 것을 피하고 있다.<br>⑤ 나는 전학 가는 것이 두렵다.",ex:["poster = 포스터","goal = 목표"],h:["본책 UNIT 03의 동명사 역할(주어·목적어·보어)을 떠올려요.","보기의 winning은 be동사 is 뒤에서 앞말(goal)을 풀어 주는 말이에요.","보기와 똑같이 be동사 뒤에서 앞의 주어와 이퀄(=)로 이어지는 -ing를 찾아요."],pen:"goal is + winning(이기는 것) = hobby is + collecting(모으는 것)"});
A("RT","RT",6,"w",{q:"[보기] what / when / how<br>A: Can you tell me ___ to get to the subway station?<br>B: Sure. Just go straight.",ko:"지하철역에 어떻게 가는지 말해 줄 수 있니?",ans:"how",full:"Can you tell me how to get to the subway station?",tr:"A: 지하철역에 가는 ___ 말해 줄 수 있니?<br>B: 물론이지. 그냥 곧장 가.",ex:["subway station = 지하철역","go straight = 곧장 가다"],h:["본책 UNIT 01의 ’의문사 + to부정사’를 떠올려요 — what to ~(무엇을), when to ~(언제), how to ~(어떻게)예요.","B가 ’곧장 가세요’라고 길을 알려 줘요. A가 물은 것이 무엇인지 생각해요.","길을 가는 ’방법’을 묻는 의문사예요. 세 글자, h로 시작해요."],pen:"get to the subway station(역에 가는) → ___ + to부정사"});
A("RT","RT",7,"w",{q:"[보기] what / when / how<br>A: I’m not sure ___ to buy for Mom’s birthday.<br>B: How about a scarf? She’ll like that.",ko:"나는 엄마 생신 선물로 무엇을 살지 모르겠어.",ans:"what",full:"I’m not sure what to buy for Mom’s birthday.",tr:"A: 나는 엄마 생신 선물로 ___ 확신이 없어.<br>B: 스카프는 어때? 엄마가 좋아하실 거야.",ex:["scarf = 스카프, 목도리","birthday = 생일"],h:["본책 UNIT 01의 ’의문사 + to부정사’를 떠올려요.","B가 스카프(a scarf)를 추천해요. A가 물은 것은 살 ’물건’이에요.","’무엇’을 뜻하는 의문사예요. 네 글자, w로 시작해요."],pen:"buy(살) + ___ → 무엇을 살지"});
A("RT","RT",8,"w",{q:"[보기] what / when / how<br>A: I don’t know ___ to visit Mr. Evans.<br>B: Why don’t you call him first?",ko:"나는 에반스 씨를 언제 방문해야 할지 모르겠어.",ans:"when",full:"I don’t know when to visit Mr. Evans.",tr:"A: 나는 에반스 씨를 ___ 모르겠어.<br>B: 먼저 그에게 전화해 보는 게 어때?",ex:["Why don’t you ~? = ~하는 게 어때?"],h:["본책 UNIT 01의 ’의문사 + to부정사’를 떠올려요.","B가 ’먼저 전화해 보지 그래?’라고 해요. 전화로 정할 수 있는 것을 생각해요.","’때’를 묻는 의문사예요. 네 글자, w로 시작해요."],pen:"visit(방문할) + ___ → 언제 방문할지"});
A("RT","RT",9,"w",{q:"[공통] • My wish is ___ go to my favorite singer’s concert.<br>• He doesn’t have enough money ___ buy a VIP ticket.",ko:"나의 소원은 내가 가장 좋아하는 가수의 콘서트에 가는 것이다. / 그는 VIP 표를 살 충분한 돈이 없다.",ans:"to",full:"My wish is to go to my favorite singer’s concert. / He doesn’t have enough money to buy a VIP ticket.",tr:"• 나의 소원은 내가 가장 좋아하는 가수의 콘서트에 ___ 것이다.<br>• 그는 VIP 표를 ___ 충분한 돈이 없다.",ex:["wish = 소원","ticket = 표"],h:["본책 UNIT 01·02를 떠올려요 — to부정사는 ’~하는 것’(보어)과 ’~할’(명사 꾸밈)로 쓰여요.","첫 문장은 is 뒤에서 ’소원 = 가는 것’이고, 둘째 문장은 money를 뒤에서 꾸며 ’살 돈’이에요.","두 문장 모두 뒤에 동사원형이 와요. 두 글자 짧은 말이에요."],pen:"wish is + ___ go(가는 것) / money + ___ buy(살 돈)"});
A("RT","RT",10,"w",{q:"[공통] • I’m not sure ___ to join the movie club or not.<br>• I don’t know ___ to laugh or not.",ko:"나는 영화 동아리에 가입할지 말지 확신이 없다. / 나는 웃어야 할지 말아야 할지 모르겠다.",ans:"whether",full:"I’m not sure whether to join the movie club or not. / I don’t know whether to laugh or not.",tr:"• 나는 영화 동아리에 ___ 확신이 없다.<br>• 나는 ___ 모르겠다.",ex:["join = 가입하다","laugh = 웃다"],h:["본책 UNIT 01의 ’whether + to부정사’를 떠올려요.","두 문장 모두 끝이 or not(~인지 아닌지)이에요.","w로 시작하는 일곱 글자 접속사예요."],pen:"___ to join ... or not → ~할지 말지"});
A("RT","RT",11,"c",{q:"다음 중 밑줄 친 부분의 쓰임이 나머지 넷과 다른 것은?",ko:"나는 보고서를 쓰기 위해 이 책을 읽었다.",opts:["There is no reason <u>to hurry</u>.","We have a test <u>to take</u> tomorrow.","Will you have something <u>to drink</u>?","I read this book <u>to write</u> a report.","He didn’t bring a sweater <u>to wear</u>."],ans:"I read this book <u>to write</u> a report.",full:"I read this book to write a report.",tr:"① 서두를 이유는 없다.<br>② 우리는 내일 볼 시험이 있다.<br>③ 마실 것 좀 줄래?<br>④ 나는 보고서를 쓰기 위해 이 책을 읽었다.<br>⑤ 그는 입을 스웨터를 가져오지 않았다.",ex:["reason = 이유","sweater = 스웨터"],h:["본책 UNIT 02를 떠올려요 — 형용사적 용법(명사를 꾸밈, ~할)과 부사적 용법(목적·원인·결과)을 구별해요.","밑줄 앞이 명사(또는 -thing)이고 ’~할’로 풀리면 형용사적 용법이에요.","다섯 중 하나만 명사를 꾸미지 않고 ’~하기 위해’로 풀려요."],pen:"reason + to hurry / test + to take / something + to drink / sweater + to wear → ’~할 ○○’"});
A("RT","RT",12,"c",{q:"다음 중 밑줄 친 부분의 쓰임이 나머지 넷과 다른 것은?",ko:"내 목표는 오늘 집 전체를 청소하는 것이다.",opts:["He wants <u>to take</u> a nap.","Steve needs <u>to wear</u> glasses.","She decided <u>to quit</u> her job.","I promised <u>to come</u> home early.","My goal is <u>to clean</u> the whole house today."],ans:"My goal is <u>to clean</u> the whole house today.",full:"My goal is to clean the whole house today.",tr:"① 그는 낮잠을 자고 싶어 한다.<br>② 스티브는 안경을 써야 한다.<br>③ 그녀는 일을 그만두기로 결심했다.<br>④ 나는 일찍 집에 오기로 약속했다.<br>⑤ 내 목표는 오늘 집 전체를 청소하는 것이다.",ex:["nap = 낮잠","quit = 그만두다","whole = 전체의"],h:["본책 UNIT 01을 떠올려요 — 명사 역할의 to부정사는 목적어, 주어, 보어 자리에 와요.","동사 바로 뒤에서 ’~하기를’로 풀리면 목적어이고, be동사 뒤에서 앞말과 이퀄(=)이면 보어예요.","나머지 넷은 동사(want, need, decide, promise) 뒤의 목적어예요. 하나만 다른 자리예요."],pen:"want / need / decide / promise + to부정사(목적어) ↔ is + to부정사(보어)"});
A("RT","RT",13,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.",ko:"최선을 다하는 것은 중요하다.",opts:["It is important <u>doing</u> your best.","Do you have anything <u>to tell</u> me?","What do you want <u>to be</u> in the future?","We kept <u>knocking</u> on the door.","I went to Busan <u>to see</u> my cousin."],ans:"It is important <u>doing</u> your best.",full:"It is important to do your best.",tr:"① 최선을 다하는 것은 중요하다.<br>② 나에게 말할 것이 있니?<br>③ 너는 미래에 무엇이 되고 싶니?<br>④ 우리는 계속 문을 두드렸다.<br>⑤ 나는 사촌을 보러 부산에 갔다.",ex:["knock = 두드리다","cousin = 사촌"],h:["본책 UNIT 01을 떠올려요 — 가주어 It is + 형용사 뒤의 진짜 주어는 to부정사로 써요.","나머지 문장의 밑줄은 어색하지 않아요. It is + 형용사 뒤의 모양을 살펴봐요.","It is … 뒤에 -ing가 와 있는 문장이 이상해요."],pen:"It is important + doing(X) → to do(O)"});
A("RT","RT",14,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.",ko:"너는 피자를 만드는 방법을 아니?",opts:["It is time <u>to start</u> a new project.","My hobby is <u>updating</u> my blog.","Do you know how <u>make</u> pizza?","He didn’t give up <u>looking</u> for a job.","She grew up <u>to become</u> a famous dancer."],ans:"Do you know how <u>make</u> pizza?",full:"Do you know how to make pizza?",tr:"① 새 프로젝트를 시작할 시간이다.<br>② 내 취미는 블로그를 업데이트하는 것이다.<br>③ 너는 피자를 만드는 방법을 아니?<br>④ 그는 일자리를 찾는 것을 포기하지 않았다.<br>⑤ 그녀는 자라서 유명한 댄서가 되었다.",ex:["update = 업데이트하다","give up = 포기하다"],h:["본책 UNIT 01의 ’의문사 + to부정사’를 떠올려요 — how to ~는 ’~하는 방법’이에요.","how 뒤에 동사만 있는 문장을 찾아요. 나머지는 to부정사·동명사가 알맞게 쓰였어요.","how와 동사 사이에 두 글자 말이 빠진 문장이에요."],pen:"how + make(X) → how to make(O)"});
A("RT","RT",15,"c",{q:"다음 중 고쳐 쓴 문장이 어법상 옳은 것은?",ko:"나는 너를 만나기에는 너무 피곤했다.",opts:["That isn’t easy to train a dog. → That isn’t easy training a dog.","I don’t mind share the room. → I don’t mind to share the room.","I was to tired too meet you. → I was too tired to meet you.","She was busy to helping her mom. → She was busy help her mom.","He’s not enough old to drive a car. → He’s not enough old driving a car."],ans:"I was to tired too meet you. → I was too tired to meet you.",full:"I was too tired to meet you.",tr:"① 개를 훈련시키는 것은 쉽지 않다.<br>② 나는 방을 같이 쓰는 것을 꺼리지 않는다.<br>③ 나는 너를 만나기에는 너무 피곤했다.<br>④ 그녀는 엄마를 돕느라 바빴다.<br>⑤ 그는 차를 운전할 만큼 나이가 많지 않다.",ex:["train = 훈련시키다","mind = 꺼리다"],h:["본책 UNIT 01~03을 떠올려요 — to부정사, 동명사, too ~ to …, enough to … 규칙을 하나씩 확인해요.","각 보기에서 화살표(→) 뒤의 문장이 어법상 맞는지 따져요. mind 뒤, be busy 뒤, enough의 위치를 살펴요.","too + 형용사 + to부정사(너무 ~해서 …할 수 없다) 모양으로 바르게 고친 보기를 찾아요."],pen:"too tired to meet(너무 피곤해서 만날 수 없는)"});
A("RT","RT",16,"w",{q:"대화가 성립되도록 ( ) 안에서 알맞은 말을 골라 쓰시오.<br>A: Thank you for ⓐ (visit, visiting) my house.<br>B: My pleasure. I’m happy ⓑ (coming, to come) here.",ko:"A: 저희 집을 방문해 주셔서 감사합니다. B: 천만에요. 여기에 오게 되어 기쁩니다.",ans:"visiting, to come",full:"Thank you for visiting my house. / I’m happy to come here.",tr:"A: 내 집에 ___ 고마워.<br>B: 천만에. 여기에 ___ 기뻐.",ex:["pleasure = 기쁨"],h:["본책 UNIT 03과 UNIT 02를 떠올려요 — 전치사 뒤는 동명사, 감정 형용사 뒤의 이유는 to부정사예요.","ⓐ는 전치사 for 뒤이고, ⓑ는 happy(기쁜) 뒤에서 기쁜 이유를 말해요.","ⓐ는 -ing가 붙은 말, ⓑ는 to가 붙은 말을 골라요."],pen:"ⓐ for + -ing / ⓑ happy + to + 동사원형"});
A("RT","RT",17,"w",{q:"A: It wasn’t easy ⓐ (get, to get) good grades on the final exams.<br>B: Right. I’m afraid of ⓑ (showing, to show) my report card to my parents.",ko:"A: 기말고사에서 좋은 성적을 받는 것은 쉽지 않았어. B: 맞아. 나는 부모님께 성적표를 보여 드리는 것이 두려워.",ans:"to get, showing",full:"It wasn’t easy to get good grades on the final exams. / I’m afraid of showing my report card to my parents.",tr:"A: 기말고사에서 좋은 성적을 ___ 쉽지 않았어.<br>B: 맞아. 나는 부모님께 성적표를 ___ 두려워.",ex:["grade = 성적","report card = 성적표","be afraid of = ~을 두려워하다"],h:["본책 UNIT 01과 UNIT 03을 떠올려요 — It is + 형용사 뒤는 to부정사, 전치사 뒤는 동명사예요.","ⓐ는 It wasn’t easy(쉽지 않았다)의 진짜 주어이고, ⓑ는 전치사 of 뒤예요.","ⓐ는 to가 붙은 말, ⓑ는 -ing가 붙은 말을 골라요."],pen:"ⓐ It wasn’t easy + to부정사 / ⓑ afraid of + -ing"});
A("RT","RT",18,"c",{q:"다음 우리말을 영어로 바르게 옮긴 것을 고르시오.<br>나는 네게 보여줄 멋진 것을 갖고 있어.",ko:"나는 네게 보여줄 멋진 것을 갖고 있다.",opts:["I have nice something to show you.","I have something nice to show you.","I have something to show you nice.","I have to show nice something you.","I have to show something nice you."],ans:"I have something nice to show you.",full:"I have something nice to show you.",tr:"① ~ ⑤ 모두 ’나는 네게 보여줄 멋진 것을 갖고 있어’를 말하려는 문장이에요. 영어 단어의 순서만 달라요.",ex:[],h:["본책 UNIT 02를 떠올려요 — -thing으로 끝나는 말은 형용사를 뒤에 붙이고, 그 뒤에 to부정사가 꾸며요.","’멋진 것’은 어떤 것(-thing) + 형용사 순서이고, ’보여줄’은 그 뒤예요.","순서: have → 어떤 것 → 멋진 → to + 보여주다 → 너에게."],pen:"have + something(어떤 것) + nice(멋진) + to show you(보여줄)"});
A("RT","RT",19,"c",{q:"다음 우리말을 영어로 바르게 옮긴 것을 고르시오.<br>우리는 많은 애플리케이션을 사용하는 것을 즐긴다.",ko:"우리는 많은 애플리케이션을 사용하는 것을 즐긴다.",opts:["We enjoy use many applications.","We enjoy many applications use.","We enjoy using many applications.","We enjoy many applications using.","We enjoy to use many applications."],ans:"We enjoy using many applications.",full:"We enjoy using many applications.",tr:"① ~ ⑤ 모두 ’우리는 많은 애플리케이션을 사용하는 것을 즐긴다’를 말하려는 문장이에요. 영어 단어의 형태와 순서만 달라요.",ex:["application = 애플리케이션, 앱"],h:["본책 UNIT 03을 떠올려요 — enjoy 뒤에는 동명사(-ing)가 와요.","enjoy 바로 뒤에 ’사용하는 것’을 쓰고, 그 뒤에 ’많은 애플리케이션을’을 써요.","use를 -ing 모양으로 바꾼 말이 enjoy 바로 뒤에 오는 문장을 찾아요."],pen:"enjoy + using(사용하는 것) + many applications"});
A("RT","RT",20,"w",{q:"우리말과 일치하도록 (avoid, drink)를 이용하여 문장을 완성하시오.<br>너는 너무 많은 탄산음료를 마시는 것을 피해야 한다.<br>You should ___ too much soda.",ko:"너는 너무 많은 탄산음료를 마시는 것을 피해야 한다.",ans:"avoid drinking",full:"You should avoid drinking too much soda.",tr:"너는 너무 많은 탄산음료를 ___ 해야 한다.",ex:["soda = 탄산음료"],h:["본책 UNIT 03을 떠올려요 — avoid 뒤에는 동명사(-ing)가 와요.","should(~해야 한다) 뒤에는 동사원형이 오고, 그 뒤에 ’마시는 것’이 이어져요.","두 단어예요. 첫 단어는 원형 그대로, 둘째 단어는 drink를 -ing 모양으로 바꿔요."],pen:"should + avoid(피하다) + drinking(마시는 것을)"});
A("RT","RT",21,"w",{q:"우리말과 일치하도록 (sad, say)를 이용하여 문장을 완성하시오.<br>우리는 그들에게 작별 인사를 하게 되어 슬펐다.<br>We were ___ goodbye to them.",ko:"우리는 그들에게 작별 인사를 하게 되어 슬펐다.",ans:"sad to say",full:"We were sad to say goodbye to them.",tr:"우리는 그들에게 작별 인사를 ___ .",ex:["say goodbye = 작별 인사를 하다"],h:["본책 UNIT 02를 떠올려요 — 감정 형용사 뒤의 to부정사는 감정의 원인(~해서)이에요.","were(~이었다) 뒤에 감정 형용사가 오고, 그 뒤에 이유가 이어져요.","세 단어예요. 감정 형용사 → to → 동사원형 순서예요."],pen:"were sad(슬펐다) + to say goodbye(작별 인사를 해서)"});
A("RT","RT",22,"w",{q:"우리말과 일치하도록 (get, opened, to, the window, some fresh air)를 바르게 배열하시오.<br>그녀는 신선한 공기를 쐬기 위해 창문을 열었다.<br>She ___ .",ko:"그녀는 신선한 공기를 쐬기 위해 창문을 열었다.",ans:"opened the window to get some fresh air",full:"She opened the window to get some fresh air.",tr:"그녀는 ___ .",ex:["fresh air = 신선한 공기"],h:["본책 UNIT 02를 떠올려요 — ’~하기 위해’(목적)는 to + 동사원형이에요.","먼저 ’창문을 열었다’를 쓰고, 그다음에 목적을 이어요.","열었다 → 창문 → ’to + 얻다’ → 신선한 공기 순서예요."],pen:"opened the window(창문을 열었다) + to get(얻기 위해)"});
A("RT","RT",23,"w",{q:"우리말과 일치하도록 (not, money, is, wasting)을 바르게 배열하시오.<br>그의 목표는 돈을 낭비하지 않는 것이다.<br>His goal ___ .",ko:"그의 목표는 돈을 낭비하지 않는 것이다.",ans:"is not wasting money",full:"His goal is not wasting money.",tr:"그의 목표는 ___ .",ex:[],h:["본책 UNIT 03을 떠올려요 — 동명사를 부정할 때는 not을 동명사 앞에 붙여요.","His goal 뒤에 be동사를 먼저 쓰고, ’낭비하지 않는 것’을 이어요.","~이다 → ~하지 않는 → 낭비하는 것 → 돈 순서예요."],pen:"is + not wasting(낭비하지 않는 것) + money"});
A("RT","RT",24,"w",{q:"다음 밑줄 친 부분이 어법상 옳은지 판단하고, 틀리면 바르게 고치시오.<br>It is bad <u>making</u> fun of others.<br>(O / X)",ko:"다른 사람들을 놀리는 것은 나쁘다.",ans:"X, to make",full:"It is bad to make fun of others.",tr:"다른 사람들을 놀리는 것은 나쁘다.",ex:["make fun of = ~을 놀리다"],h:["본책 UNIT 01을 떠올려요 — 가주어 It is + 형용사 뒤의 진짜 주어는 to부정사예요.","It is bad(나쁘다) 뒤에 ’놀리는 것’이 와요. 밑줄의 모양을 규칙과 비교해요.","규칙과 다르면 X를 쓰고, 밑줄을 진짜 주어 모양(to + 동사원형)으로 고쳐요."],pen:"It is bad + making(X) → to make(O)"});

A(1,"A",10,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"(In, On) France, people have long breaks for their vacations.",ko:"",words:"",ans:"In",full:"In France, people have long breaks for their vacations.",tr:"프랑스에서는 사람들이 휴가 때 오랜 휴식을 갖는다.",ex:["break = 휴식 시간","vacation = 휴가"],h:["본책 UNIT 01에서 나라 이름 앞에는 ‘안에’를 뜻하는 전치사를 써요.","France(프랑스)는 나라예요. 문장 맨 앞이라 첫 글자는 대문자예요.","‘안에’를 뜻하는 두 글자 말이고, 대문자로 써요."]});

A("RT","RT",8,"w",{q:"I’m going to make soup. I’ll use some chicken.<br>→ I’m going to make soup ___ some chicken.",ans:"with",full:"I’m going to make soup with some chicken.",ko:"나는 닭고기로 수프를 만들 것이다.",h:["본책 UNIT 03에서 with는 ‘~로(재료·도구)’라는 뜻도 있어요.","수프를 만들 때 닭고기를 ‘재료로 써서’ 만든다는 뜻이에요.","‘~로, ~을 넣어서’를 뜻하는 w로 시작하는 네 글자 말이에요."],pen:"수프 만들기 + 재료 닭고기 → with",tr:"나는 수프를 만들 것이다. 나는 닭고기를 조금 쓸 것이다.<br>→ 나는 닭고기 ___ 수프를 만들 것이다.",ex:["soup = 수프","chicken = 닭고기"]});
A("RT","RT",9,"c",{q:"빈칸에 들어갈 말이 나머지 넷과 다른 것을 고르시오.",opts:["He lives ___ Chicago.","The children sat ___ the floor.","I jump rope ___ the morning.","Molly entered middle school ___ 2020.","There are a few pencils ___ the pencil case."],ans:"The children sat ___ the floor.",full:"The children sat on the floor.",ko:"아이들은 바닥에 앉았다. (나머지 넷은 모두 in이 들어간다.)",h:["본책 UNIT 01·02에서 in은 도시·하루의 부분·연도·‘안에’ 앞에 써요.","각 문장을 읽고 빈칸에 알맞은 전치사를 하나씩 떠올려 비교해요.","하나만 ‘닿아서 위에’를 뜻하는 on이에요. 나머지는 모두 in이에요."],pen:"①in Chicago ②on the floor ③in the morning ④in 2020 ⑤in the pencil case → ②만 on",tr:"① 그는 시카고 ___ 산다.<br>② 아이들은 바닥 ___ 앉았다.<br>③ 나는 아침 ___ 줄넘기를 한다.<br>④ 몰리는 2020년 ___ 중학교에 입학했다.<br>⑤ 필통 ___ 연필이 몇 자루 있다.",ex:["jump rope = 줄넘기를 하다","enter = 입학하다, 들어가다","pencil case = 필통"]});
A("RT","RT",10,"c",{q:"빈칸에 들어갈 말이 나머지 넷과 다른 것을 고르시오.",opts:["My father gets up ___ 6:00 a.m.","I met Diana ___ the bus stop.","They arrived ___ midnight.","I’ll just stay ___ home today.","We will have a party ___ Sunday."],ans:"We will have a party ___ Sunday.",full:"We will have a party on Sunday.",ko:"우리는 일요일에 파티를 열 것이다. (나머지 넷은 모두 at이 들어간다.)",h:["본책 UNIT 01·02에서 at은 시각·한 지점 앞에, on은 요일·날짜 앞에 써요.","각 문장의 빈칸 뒤가 시각인지, 장소인지, 요일인지 구분해요.","빈칸 뒤가 시각도 장소도 아닌 문장을 찾아요."],pen:"①at 6:00 ②at the bus stop ③at midnight ④at home ⑤on Sunday → ⑤만 on",tr:"① 우리 아버지는 오전 6시 ___ 일어나신다.<br>② 나는 버스 정류장 ___ 다이애나를 만났다.<br>③ 그들은 자정 ___ 도착했다.<br>④ 나는 오늘 그냥 집 ___ 있을 것이다.<br>⑤ 우리는 일요일 ___ 파티를 열 것이다.",ex:["get up = 일어나다","midnight = 자정","arrive = 도착하다"]});
A("RT","RT",11,"w",{q:"다음 여름 캠프 안내서를 보고 빈칸에 알맞은 전치사를 쓰시오.<br>Summer Camp Schedule<br>Student’s name: Mike Anderson<br>Date: July 22 – August 12 (3 weeks)<br>Roommate: Danny Lewis<br>→ The summer camp is ___ July 22 to August 12.",ans:"from",full:"The summer camp is from July 22 to August 12.",ko:"여름 캠프는 7월 22일부터 8월 12일까지이다.",h:["본책 UNIT 02에서 from ~ to ~는 ‘~부터 ~까지’ 짝이에요.","문장에 to August 12(8월 12일까지)가 있어요. 짝이 되는 말을 찾아요.","‘~부터’를 뜻하는 f로 시작하는 네 글자 말이에요."],pen:"to August 12와 짝 → from July 22 to August 12",tr:"여름 캠프는 7월 22일 ___ 8월 12일까지이다.",ex:["camp = 캠프","schedule = 일정"]});
A("RT","RT",12,"w",{q:"다음 여름 캠프 안내서를 보고 빈칸에 알맞은 전치사를 쓰시오.<br>Summer Camp Schedule<br>Student’s name: Mike Anderson<br>Date: July 22 – August 12 (3 weeks)<br>Roommate: Danny Lewis<br>→ Mike will go to the summer camp ___ three weeks.",ans:"for",full:"Mike will go to the summer camp for three weeks.",ko:"마이크는 3주 동안 여름 캠프에 갈 것이다.",h:["본책 UNIT 02에서 for 뒤에는 숫자가 있는 시간 길이를 써요.","안내서에 Date 옆에 (3 weeks)가 있어요. 숫자 + 기간이에요.","‘~ 동안’을 뜻하는 f로 시작하는 세 글자 말이에요."],pen:"three weeks(숫자 + 기간) → for",tr:"마이크는 3주 ___ 여름 캠프에 갈 것이다.",ex:["camp = 캠프"]});
A("RT","RT",13,"w",{q:"다음 여름 캠프 안내서를 보고 빈칸에 알맞은 전치사를 쓰시오.<br>Summer Camp Schedule<br>Student’s name: Mike Anderson<br>Date: July 22 – August 12 (3 weeks)<br>Roommate: Danny Lewis<br>→ Mike will share his room ___ Danny.",ans:"with",full:"Mike will share his room with Danny.",ko:"마이크는 대니와 방을 같이 쓸 것이다.",h:["본책 UNIT 03에서 with는 ‘~와 함께’예요.","안내서에 Roommate: Danny Lewis(룸메이트)가 있어요. 방을 누구와 같이 쓰는지 봐요.","‘~와 함께’를 뜻하는 w로 시작하는 네 글자 말이에요."],pen:"share(함께 쓰다) + 룸메이트 Danny → with",tr:"마이크는 대니 ___ 방을 같이 쓸 것이다.",ex:["share = 함께 쓰다","roommate = 룸메이트"]});
A("RT","RT",14,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.",opts:["They will travel <u>by</u> car.","I’m going <u>at</u> a supermarket.","There is a bridge <u>over</u> the river.","Billy took pictures <u>with</u> his new camera.","Susan felt disappointed <u>after</u> the exam."],ans:"I’m going <u>at</u> a supermarket.",full:"I’m going to a supermarket.",ko:"나는 슈퍼마켓에 가고 있다.",h:["본책 UNIT 01·03에서 가는 방향·도착은 to, 교통수단은 by, 도구는 with를 써요.","각 문장의 밑줄 전치사가 문장 뜻에 맞는지 하나씩 확인해요.","‘간다(go)’ 다음에는 ‘~로’ 방향을 나타내야 해요. ‘한 지점’ 말은 어울리지 않아요."],pen:"I’m going + 슈퍼마켓(도착 장소) → at이 아니라 to",tr:"① 그들은 차로 여행할 것이다.<br>② 나는 슈퍼마켓에 가고 있다.<br>③ 강 위에 다리가 있다.<br>④ 빌리는 새 카메라로 사진을 찍었다.<br>⑤ 수잔은 시험 후에 실망했다.",ex:["disappointed = 실망한","take pictures = 사진을 찍다"]});
A("RT","RT",15,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.",opts:["I hid the letters <u>under</u> the bed.","Can you make some tea <u>for</u> us?","Tom fell asleep <u>during</u> the class.","I’ll finish this work <u>around</u> 6:00 p.m.","The festival is <u>between</u> Saturday to Wednesday."],ans:"The festival is <u>between</u> Saturday to Wednesday.",full:"The festival is from Saturday to Wednesday.",ko:"축제는 토요일부터 수요일까지이다.",h:["본책 UNIT 02에서 between A and B(A와 B 사이), from A to B(A부터 B까지)는 짝이 정해져 있어요.","각 보기의 밑줄 말이 뜻에 맞는지, 짝이 맞는지 확인해요.","between은 and와, from은 to와 짝이에요. 짝이 어긋난 문장을 찾아요."],pen:"to와 짝은 from → between Saturday to Wednesday는 틀림",tr:"① 나는 편지들을 침대 아래에 숨겼다.<br>② 우리에게 차를 만들어 줄 수 있니?<br>③ 톰은 수업 시간 동안 잠들었다.<br>④ 나는 이 일을 오후 6시쯤 끝낼 것이다.<br>⑤ 축제는 토요일부터 수요일까지이다.",ex:["hide = 숨기다","fall asleep = 잠들다","festival = 축제"]});
A("RT","RT",16,"c",{q:"다음 우리말을 영어로 바르게 옮긴 것은?<br>은행은 그의 회사 맞은편에 있다.",opts:["The bank is across his company.","The bank is from his company.","The bank is across to his company.","The bank is across from his company.","The bank is across about his company."],ans:"The bank is across from his company.",full:"The bank is across from his company.",ko:"은행은 그의 회사 맞은편에 있다.",h:["본책 UNIT 01에서 ‘~ 맞은편에’는 across 뒤에 전치사 하나가 더 붙는 두 단어 표현이에요.","‘맞은편에’를 across와 함께 어떤 말과 짝으로 쓰는지 떠올려요.","across 뒤에 ‘~에서’를 뜻하는 f로 시작하는 말이 붙어요."],pen:"맞은편에 = across from + 장소",tr:"① ~ ⑤ 모두 ‘은행은 그의 회사 맞은편에 있다’를 말하려는 문장이에요. across 뒤의 말만 달라요.",ex:["bank = 은행","company = 회사"]});
A("RT","RT",17,"w",{q:"대화가 성립되도록 ( ) 안에서 알맞은 말을 골라 쓰시오.<br>A: I bought these books ⓐ (for, to) you.<br>B: Oh, they are ⓑ (about, with) dolphins. I like dolphins!",ans:"for, about",full:"A: I bought these books for you.<br>B: Oh, they are about dolphins. I like dolphins!",ko:"A: 내가 너를 위해 이 책들을 샀어.<br>B: 오, 돌고래에 대한 책이네. 나는 돌고래를 좋아해!",h:["본책 UNIT 03에서 for는 ‘~를 위해’, about은 ‘~에 대해’예요.","ⓐ는 책을 누구를 위해 샀는지, ⓑ는 책의 내용이 무엇에 대한 것인지예요.","ⓐ는 f로 시작하는 세 글자, ⓑ는 a로 시작하는 다섯 글자예요."],pen:"ⓐ 너를 위해(for) / ⓑ 돌고래에 대한(about)",tr:"A: 내가 이 책들을 너 ___ 샀어.<br>B: 오, 돌고래 ___ 책이네. 나는 돌고래를 좋아해!",ex:["dolphin = 돌고래"]});
A("RT","RT",18,"w",{q:"대화가 성립되도록 ( ) 안에서 알맞은 말을 골라 쓰시오.<br>A: I will go on a trip ⓐ (in, on) May.<br>B: That’s great! Will you go ⓑ (by, with) your family?",ans:"in, with",full:"A: I will go on a trip in May.<br>B: That’s great! Will you go with your family?",ko:"A: 나는 5월에 여행을 갈 거야.<br>B: 멋지다! 가족과 함께 갈 거니?",h:["본책 UNIT 02·03에서 달(월)에는 in, 함께하는 사람 앞에는 with를 써요.","ⓐ는 May(5월)가 월 이름이고, ⓑ는 your family(가족)가 함께 가는 사람이에요.","ⓐ는 i로 시작하는 두 글자, ⓑ는 w로 시작하는 네 글자예요."],pen:"ⓐ May(월) → in / ⓑ 함께 가는 가족 → with",tr:"A: 나는 5월 ___ 여행을 갈 거야.<br>B: 멋지다! 가족 ___ 갈 거니?",ex:["go on a trip = 여행을 가다"]});
A("RT","RT",19,"w",{q:"벽 뒤에 비밀의 방이 있었다. (the wall)<br>→ There was a secret room ___.",ans:"behind the wall",full:"There was a secret room behind the wall.",ko:"벽 뒤에 비밀의 방이 있었다.",h:["본책 UNIT 01에서 behind는 ‘~ 뒤에’예요.","‘벽 뒤에’를 영어로 써요. 괄호 안의 말 앞에 위치 말을 붙여요.","‘뒤에’를 뜻하는 b로 시작하는 여섯 글자 말 + the wall이에요."],pen:"뒤에(b…) + the wall",tr:"___ 비밀의 방이 있었다.",ex:["secret = 비밀의"]});
A("RT","RT",20,"w",{q:"그녀는 유럽을 기차로 여행할지도 모른다. (train)<br>→ She may travel through Europe ___.",ans:"by train",full:"She may travel through Europe by train.",ko:"그녀는 유럽을 기차로 여행할지도 모른다.",h:["본책 UNIT 03에서 by + 교통수단은 ‘~로’예요. 관사를 붙이지 않아요.","‘기차로’를 영어로 써요. 괄호에 train만 있어요.","‘~로(수단)’를 뜻하는 b로 시작하는 두 글자 말 + train이에요."],pen:"교통수단 앞 by + train (관사 없이)",tr:"그녀는 유럽을 ___ 여행할지도 모른다.",ex:["may = ~할지도 모른다","through = ~을 두루, ~ 여기저기"]});
A("RT","RT",21,"w",{q:"당신은 신발 가게와 카페 사이의 길을 따라가야 합니다. (the shoe store, the café, and, between)<br>→ You should follow the road ___.",ans:"between the shoe store and the café",full:"You should follow the road between the shoe store and the café.",ko:"당신은 신발 가게와 카페 사이의 길을 따라가야 합니다.",h:["본책 UNIT 01·02에서 between A and B는 ‘A와 B 사이에’예요.","‘~ 사이의’ 말이 먼저, 그다음 두 장소를 and로 이어요.","b로 시작하는 ‘사이에’ 말 → 첫째 장소 → and → 둘째 장소 순서예요."],pen:"between + A + and + B",tr:"당신은 ___ 길을 따라가야 합니다.",ex:["follow = 따라가다","café = 카페"]});
A("RT","RT",22,"w",{q:"그 서커스는 5월 1일부터 6월 30일까지이다. (May 1, to, June 30, from)<br>→ The circus is ___.",ans:"from May 1 to June 30",full:"The circus is from May 1 to June 30.",ko:"그 서커스는 5월 1일부터 6월 30일까지이다.",h:["본책 UNIT 02에서 from A to B는 ‘A부터 B까지’ 짝이에요.","‘부터’ 말이 시작 날짜 앞에, ‘까지’ 말이 끝 날짜 앞에 와요.","f로 시작하는 말 + 시작 날짜 + t로 시작하는 말 + 끝 날짜 순서예요."],pen:"from(시작) A to(끝) B",tr:"그 서커스는 ___.",ex:["circus = 서커스"]});
A("RT","RT",23,"w",{q:"밑줄 친 부분이 어법상 옳은지 판단하고, 틀리면 바르게 고치시오.<br>The hotel is <u>next to</u> the train station.<br>(O / X)",ans:"◯",full:"The hotel is next to the train station.",ko:"그 호텔은 기차역 옆에 있다.",h:["본책 UNIT 01에서 next to는 ‘~ 옆에’라는 한 덩어리 표현이에요.","밑줄 친 next to가 ‘옆에’의 뜻에 맞게 쓰였는지 확인해요.","호텔과 기차역의 위치를 나타내는 올바른 표현인지 판단해요."],pen:"next to = ~ 옆에 → 올바른 문장이므로 O",tr:"그 호텔은 기차역 옆에 있다.",ex:["train station = 기차역"]});
A("RT","RT",24,"w",{q:"밑줄 친 부분이 어법상 옳은지 판단하고, 틀리면 바르게 고치시오.<br>We are usually busy <u>at</u> Monday mornings.<br>(O / X)",ans:"X, on",full:"We are usually busy on Monday mornings.",ko:"우리는 보통 월요일 아침마다 바쁘다.",h:["본책 UNIT 02에서 요일 앞에는 on을 써요.","Monday mornings(월요일 아침들)는 요일이 들어 있어요. 밑줄의 전치사와 비교해요.","규칙과 다르면 X를 쓰고, 요일 앞에 쓰는 두 글자 전치사로 고쳐요."],pen:"Monday(요일) 앞 → at이 아니라 on",tr:"우리는 보통 월요일 아침마다 바쁘다.",ex:["busy = 바쁜"]});

A(1,"B",5,"s",{ins:"자연스러운 대화가 되도록 알맞게 연결하시오.",q:"What kind of sports do you like?",ko:"",words:"",opts:["ⓐ That one is mine.","ⓑ I went with Tom.","ⓒ I like baseball.","ⓓ We’ll watch a musical."],ans:"ⓒ",full:"What kind of sports do you like? ⓒ I like baseball.",tr:"너는 어떤 종류의 운동을 좋아하니?<br>ⓐ 저것이 내 거야.<br>ⓑ 나는 Tom과 갔어.<br>ⓒ 나는 야구를 좋아해.<br>ⓓ 우리는 뮤지컬을 볼 거야.",ex:["what kind of = 어떤 종류의"],h:["본책 UNIT 01의 what kind of는 ‘어떤 종류의 ~’를 물어서 종류 이름으로 답해요.","‘어떤 종류의 운동?’ — 운동 종목 이름이 들어간 답을 찾아요.","보기 중 구기 종목 이름이 들어 있는 문장이에요."]});

A(1,"B",7,"s",{ins:"자연스러운 대화가 되도록 알맞게 연결하시오.",q:"Who did you go to the party with?",ko:"",words:"",opts:["ⓐ That one is mine.","ⓑ I went with Tom.","ⓒ I like baseball.","ⓓ We’ll watch a musical."],ans:"ⓑ",full:"Who did you go to the party with? ⓑ I went with Tom.",tr:"너는 누구와 파티에 갔니?<br>ⓐ 저것이 내 거야.<br>ⓑ 나는 Tom과 갔어.<br>ⓒ 나는 야구를 좋아해.<br>ⓓ 우리는 뮤지컬을 볼 거야.",ex:[],h:["본책 UNIT 01의 who는 사람을 묻고, 문장 끝의 with는 ‘~와 함께’라는 뜻이에요.","‘누구와 함께 갔니?’ — 함께 간 사람 이름을 말하는 답이고, 과거(did)라서 답도 과거예요.","보기 중 사람 이름이 나오고 과거형 동사가 쓰인 문장이에요."]});

A(1,"D",2,"s",{ins:"다음 문장의 밑줄 친 부분을 묻는 의문문을 완성하시오.",q:"<u>Her mother</u> is taking care of Emily.<br>→ ___ ?",ko:"",words:"",ans:"Who is taking care of Emily",full:"Who is taking care of Emily?",tr:"___ Emily를 돌보고 있다.",ex:["take care of = ~을 돌보다"],h:["본책 UNIT 01의 who가 주어일 때는 평소 문장 어순 그대로 쓰면 돼요.","밑줄 친 Her mother는 사람이고 주어예요. 이 부분만 바꾸고 나머지는 그대로 둬요.","Her mother 자리만 w로 시작하는 세 글자 의문사로 바꾸고, 뒤 말은 그대로 이어요."]});
A(1,"D",3,"s",{ins:"다음 문장의 밑줄 친 부분을 묻는 의문문을 완성하시오.",q:"His name is <u>Kevin Jones</u>.<br>→ ___ ?",ko:"",words:"",ans:"What is his name",full:"What is his name?",tr:"그의 이름은 ___ 이다.",ex:[],h:["본책 UNIT 01의 what은 이름·물건 등을 ‘무엇’으로 묻는 말이에요.","밑줄 친 Kevin Jones는 그의 이름이에요. ‘그의 이름이 무엇이니?’ 하고 물어요.","어순은 ‘의문사 + be동사 + 주어’예요. 의문사는 w로 시작하는 네 글자예요."]});

A(1,"D",7,"s",{ins:"다음 문장의 밑줄 친 부분을 묻는 의문문을 완성하시오.",q:"<u>Susan</u> got first prize in the contest.<br>→ ___ in the contest?",ko:"",words:"",ans:"Who got first prize",full:"Who got first prize in the contest?",tr:"___ 대회에서 1등 상을 받았다.",ex:["prize = 상"],h:["본책 UNIT 01의 who가 주어를 물을 때는 did 없이 바로 동사를 써요.","밑줄 친 Susan은 주어(사람)예요. 이 부분만 의문사로 바꿔요.","Susan 자리에 w로 시작하는 세 글자 의문사를 쓰고, 동사 got은 그대로 이어요."]});

A(5,"WB",6,"s",{ins:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.",q:"___.",ko:"우리 거실을 청소하자.",words:"the living room, clean, let’s",ans:"Let’s clean the living room",full:"Let’s clean the living room.",tr:"우리말 문제예요. 위의 영어 어순 힌트를 보고 써 보세요.",ex:["living room = 거실"],h:["본책 UNIT 05의 제안문은 Let’s로 시작해요.","‘청소하자’는 함께 하자는 제안이라서 Let’s 뒤에 동사원형이 와요.","Let’s → 동사원형 → 목적어 순서로 놓아요."],eo:"~하자 / 청소하다 / 거실을"});
A("RT","RT",1,"c",{q:"A: ___ you sleepy?<br>B: No, I’m not. I’m fine.",opts:["Isn’t","Aren’t","Don’t","Can’t","Won’t"],ko:"A: 너는 졸리지 않니?<br>B: 아니, 졸리지 않아. 나는 괜찮아.",ans:"Aren’t",full:"A: Aren’t you sleepy?<br>B: No, I’m not. I’m fine.",pen:"you(너) + 졸린 상태 → be동사 부정의문문: Aren’t you ~?",tr:"A: 너는 졸리지 ___?<br>B: 아니, 졸리지 않아. 나는 괜찮아.",ex:["sleepy = 졸린"],h:["본책 UNIT 04의 부정의문문은 부정 줄임말로 시작해요. 주어와 동사 종류에 맞춰야 해요.","주어는 you이고 sleepy(졸린)는 형용사예요. 그러니 be동사가 필요해요. B의 ‘I’m not’도 be동사 대답이에요.","be동사의 부정 줄임말이고, you에 맞는 모양이에요(A로 시작, 6글자)."]});
A("RT","RT",2,"c",{q:"A: ___ broke this window?<br>B: Helen did.",opts:["Who","What","When","Where","How"],ko:"A: 누가 이 창문을 깼니?<br>B: Helen이 했어.",ans:"Who",full:"A: Who broke this window?<br>B: Helen did.",pen:"Helen(사람)이 대답 → 사람을 묻는 Who",tr:"A: ___ 이 창문을 깼니?<br>B: Helen이 했어.",ex:["break = 깨다, 부수다"],h:["본책 UNIT 01의 who는 사람을, what은 물건·일을 물어요.","B가 ‘Helen이 했어’라고 사람 이름으로 답해요.","‘누구’를 뜻하는 w로 시작하는 세 글자 말이에요."]});
A("RT","RT",3,"c",{q:"A: ___ go on a picnic.<br>B: That sounds great.",opts:["Be","Do","Won’t","Let","Let’s"],ko:"A: 우리 소풍 가자.<br>B: 좋아.",ans:"Let’s",full:"A: Let’s go on a picnic.<br>B: That sounds great.",pen:"‘~하자’ → Let’s + 동사원형",tr:"A: 우리 소풍 ___.<br>B: 좋은 생각이야.",ex:["go on a picnic = 소풍을 가다"],h:["본책 UNIT 05의 제안문은 Let’s + 동사원형으로 ‘~하자’라고 해요.","빈칸 뒤에 go(동사원형)가 바로 와요. B도 ‘좋아’라고 받아들였어요.","‘우리 ~하자’를 뜻하는 줄임말이에요(L로 시작, 5글자)."]});
A("RT","RT",4,"c",{q:"A: ___ does he get up early?<br>B: Because he takes swimming lessons in the morning.",opts:["What","When","Where","Why","How"],ko:"A: 그는 왜 일찍 일어나니?<br>B: 아침에 수영 수업을 듣기 때문이야.",ans:"Why",full:"A: Why does he get up early?<br>B: Because he takes swimming lessons in the morning.",pen:"Because(이유)로 대답 → 이유를 묻는 Why",tr:"A: 그는 ___ 일찍 일어나니?<br>B: 아침에 수영 수업을 듣기 때문이야.",ex:["lesson = 수업"],h:["본책 UNIT 02의 why는 이유를 묻고, 대답은 because로 해요.","B의 대답이 Because로 시작해요. 이유를 말하고 있어요.","‘왜’를 뜻하는 w로 시작하는 세 글자 말이에요."]});
A("RT","RT",5,"c",{q:"• ___(A)___ did you go on vacation with?<br>• ___(B)___ car do you like, the red one or the white one?",opts:["Who … How","Whom … Which","Whom … Why","Whose … Which","Whose … What"],ko:"• 너는 누구와 함께 휴가를 갔니?<br>• 너는 빨간 것과 흰 것 중 어느 차를 좋아하니?",ans:"Whom … Which",full:"• Whom did you go on vacation with?<br>• Which car do you like, the red one or the white one?",pen:"(A) with 뒤의 사람 → Whom, (B) 빨간 것·흰 것 중 고르기 → Which",tr:"• 너는 ___(A)___ 와 함께 휴가를 갔니?<br>• ___(B)___ 차를 좋아하니, 빨간 것이니 흰 것이니?",ex:["vacation = 휴가"],h:["본책 UNIT 01의 who·whom은 사람, whose는 ‘누구의’, which는 정해진 것 중에서 고르는 말이에요.","(A)는 with(~와 함께) 뒤에 올 사람을 묻고, (B)는 ‘빨간 것이니 흰 것이니’ 둘 중 하나를 고르게 해요.","(A)는 ‘누구를’을 뜻하는 w로 시작하는 말, (B)는 ‘어느’를 뜻하는 w로 시작하는 다섯 글자 말이에요."]});
A("RT","RT",6,"c",{q:"• The soccer game was exciting, ___(A)___ it?<br>• ___(B)___ often do you go to the movies?",opts:["aren’t … When","isn’t … How","wasn’t … How","doesn’t … Why","didn’t … Why"],ko:"• 그 축구 경기는 흥미진진했어, 그렇지 않니?<br>• 너는 영화를 얼마나 자주 보러 가니?",ans:"wasn’t … How",full:"• The soccer game was exciting, wasn’t it?<br>• How often do you go to the movies?",pen:"(A) was 긍정 → wasn’t it, (B) often과 짝 → How often(얼마나 자주)",tr:"• 그 축구 경기는 흥미진진했어, ___(A)___?<br>• 너는 영화를 ___(B)___ 자주 보러 가니?",ex:["exciting = 흥미진진한"],h:["본책 UNIT 03의 부가의문문은 앞 문장과 반대로 되묻고, UNIT 02의 how often은 ‘얼마나 자주’예요.","(A) 앞 문장은 be동사 과거 긍정문이에요. (B)는 뒤의 often과 짝을 이뤄 횟수를 물어요.","(A)는 was의 부정 줄임말(w로 시작), (B)는 h로 시작하는 세 글자 말이에요."]});
A("RT","RT",7,"w",{q:"• ___ did you eat for lunch?<br>• ___ a rude person he is!",ko:"• 너는 점심으로 무엇을 먹었니?<br>• 그는 정말 무례한 사람이구나!",ans:"What",full:"• What did you eat for lunch?<br>• What a rude person he is!",pen:"먹은 것을 묻는 말 → What / What a + 형용사 + 명사 + 주어 + 동사!",tr:"• 너는 점심으로 ___ 먹었니?<br>• 그는 ___ 무례한 사람이구나!",ex:["rude = 무례한"],h:["본책 UNIT 01의 what은 ‘무엇’이고, UNIT 05의 감탄문 What a + 형용사 + 명사!에도 써요.","첫 문장은 먹은 것을 묻고, 둘째 문장은 a rude person(a + 형용사 + 명사)이 있는 감탄문이에요.","두 문장에 모두 들어가는 w로 시작하는 네 글자 말이에요."]});
A("RT","RT",8,"w",{q:"• A: ___ follow me!<br>B: I was not following you.<br>• A: ___ they sell computers?<br>B: No, they don’t. They only sell cell phones.",ko:"• A: 나를 따라오지 마!<br>B: 나는 너를 따라가고 있지 않았어.<br>• A: 그들은 컴퓨터를 팔지 않니?<br>B: 응, 안 팔아. 그들은 휴대폰만 팔아.",ans:"Don’t",full:"• A: Don’t follow me!<br>B: I was not following you.<br>• A: Don’t they sell computers?<br>B: No, they don’t. They only sell cell phones.",pen:"금지 명령문 Don’t follow ~! / 부정의문문 Don’t they sell ~?",tr:"• A: 나를 따라오지 ___!<br>B: 나는 너를 따라가고 있지 않았어.<br>• A: 그들은 컴퓨터를 팔지 ___?<br>B: 응, 안 팔아. 그들은 휴대폰만 팔아.",ex:["follow = 따라가다","cell phone = 휴대폰"],h:["본책 UNIT 05의 부정 명령문은 Don’t + 동사원형, UNIT 04의 부정의문문은 부정 줄임말 + 주어 + 동사원형이에요.","첫째는 ‘따라오지 마!’라는 금지 명령이고, 둘째는 일반동사 현재의 부정의문문이에요(B의 ‘they don’t’가 단서).","두 곳에 같은 말이 들어가요. do의 부정 줄임말(D로 시작)이에요."]});
A("RT","RT",9,"w",{q:"Paul speaks both English and French, ___?",ko:"Paul은 영어와 프랑스어를 둘 다 말해, 그렇지 않니?",ans:"doesn’t he",full:"Paul speaks both English and French, doesn’t he?",pen:"speaks(일반동사 현재 긍정, 3인칭 단수) → 부정 부가의문문 doesn’t he",tr:"Paul은 영어와 프랑스어를 둘 다 말해, ___?",ex:["both A and B = A와 B 둘 다"],h:["본책 UNIT 03의 부가의문문은 앞 문장이 긍정이면 부정으로 되물어요.","Paul speaks는 일반동사 현재 긍정문이고 주어는 남자 한 명(3인칭 단수)이에요.","do 계열 3인칭 단수의 부정 줄임말(d로 시작) + 남자 대명사, 단어 두 개예요."]});
A("RT","RT",10,"w",{q:"You will go skating tomorrow, ___?",ko:"너는 내일 스케이트 타러 갈 거야, 그렇지 않니?",ans:"won’t you",full:"You will go skating tomorrow, won’t you?",pen:"will(긍정) → 부정 부가의문문 won’t you",tr:"너는 내일 스케이트 타러 갈 거야, ___?",ex:["go skating = 스케이트 타러 가다"],h:["본책 UNIT 03의 부가의문문은 앞 문장이 긍정이면 부정으로 되물어요.","You will go는 조동사 will이 있는 긍정문이에요. 같은 조동사로 되물어요.","will의 부정 줄임말(w로 시작, 5글자) + 주어를 받는 대명사예요."]});
A("RT","RT",11,"w",{q:"Ms. Alison was your math teacher, ___?",ko:"Alison 선생님은 네 수학 선생님이었어, 그렇지 않니?",ans:"wasn’t she",full:"Ms. Alison was your math teacher, wasn’t she?",pen:"was(긍정 과거) → wasn’t she",tr:"Alison 선생님은 네 수학 선생님이었어, ___?",ex:[],h:["본책 UNIT 03의 부가의문문은 앞 문장이 긍정이면 부정으로 되물어요.","Ms. Alison was는 be동사 과거 긍정문이고 주어 Ms. Alison은 여자 한 명이에요.","was의 부정 줄임말(w로 시작) + 여자 한 명을 가리키는 대명사예요."]});
A("RT","RT",12,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.",opts:["Go to bed right now.","Isn’t this jacket Dorothy’s?","Whom took these photos?","How old is your grandfather?","Where did you buy the camera?"],ko:"누가 이 사진들을 찍었니?",ans:"Whom took these photos?",full:"Who took these photos?",pen:"의문사가 주어일 때는 ‘누가’ → Whom이 아니라 Who",tr:"① 지금 당장 자러 가라.<br>② 이 재킷은 Dorothy의 것 아니니?<br>③ 누가 이 사진들을 찍었니?<br>④ 네 할아버지는 연세가 어떻게 되시니?<br>⑤ 너는 그 카메라를 어디서 샀니?",ex:[],h:["본책 UNIT 01의 who는 주어일 때 ‘누가’, whom은 목적어일 때 ‘누구를’이에요.","각 문장을 읽고 의문사, 부정의문문, 어순이 맞는지 하나씩 살펴요.","‘누구를’이 아니라 ‘누가’라는 뜻인데 의문사 모양이 다른 문장을 찾아요. 의문사 바로 뒤에 동사가 나와요."]});
A("RT","RT",13,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.",opts:["Can’t we sit here?","Don’t let’s go out today.","Why did Jason call you?","What time did you meet Andy?","Open the door for me, please."],ko:"오늘은 나가지 말자.",ans:"Don’t let’s go out today.",full:"Let’s not go out today.",pen:"‘~하지 말자’ → Let’s not + 동사원형",tr:"① 우리 여기 앉으면 안 되니?<br>② 오늘은 나가지 말자.<br>③ 왜 Jason이 너에게 전화했니?<br>④ 너는 Andy를 몇 시에 만났니?<br>⑤ 나를 위해 문을 열어 줘, 제발.",ex:[],h:["본책 UNIT 05의 제안문 Let’s ~의 부정은 not을 붙여서 만들어요.","각 문장의 부정 표현과 어순이 맞는지 하나씩 확인해요.","‘~하지 말자’는 뜻인데 Let’s 앞에 금지 표현을 붙인 문장을 찾아요."]});
A("RT","RT",14,"c",{q:"다음 중 대화가 자연스럽지 않은 것은?",opts:["A: How do we go to the airport?<br>B: We can take the shuttle bus.","A: Isn’t that card from Danny?<br>B: No, it’s from Lewis.","A: Doesn’t she look sad?<br>B: Yes, she doesn’t. She looks happy.","A: How often do you check your email?<br>B: Almost every day.","A: Why is this pen cheaper than that one?<br>B: Because it’s on sale."],ko:"A: 그녀는 슬퍼 보이지 않니?<br>B: 아니, 그렇게 보이지 않아. 그녀는 행복해 보여.",ans:"A: Doesn’t she look sad?<br>B: Yes, she doesn’t. She looks happy.",full:"A: Doesn’t she look sad?<br>B: No, she doesn’t. She looks happy.",pen:"‘행복해 보여’ → 사실이 부정이므로 No, she doesn’t.",tr:"① A: 우리는 공항에 어떻게 가?<br>B: 우리는 셔틀버스를 탈 수 있어.<br>② A: 저 카드는 Danny가 보낸 것 아니니?<br>B: 아니, Lewis가 보낸 거야.<br>③ A: 그녀는 슬퍼 보이지 않니?<br>B: 아니, 그녀는 행복해 보여.<br>④ A: 너는 이메일을 얼마나 자주 확인하니?<br>B: 거의 매일.<br>⑤ A: 왜 이 펜이 저 펜보다 더 싸니?<br>B: 세일 중이기 때문이야.",ex:["shuttle bus = 셔틀버스","cheaper = 더 싼"],h:["본책 UNIT 04의 부정의문문에 대한 대답은 질문 모양이 아니라 사실에 맞춰 Yes/No를 정해요.","각 대화의 질문과 대답이 이어지는지 살펴요. 특히 Isn’t / Doesn’t로 묻는 대화의 대답이 사실과 맞는지 봐요.","Doesn’t로 묻는 대화에서 대답의 첫머리(Yes/No)와 뒷말(행복해 보여)이 서로 어울리는지 확인해요."]});
A("RT","RT",15,"w",{q:"A: ⓐ (Whose, Which) is better, this carpet or that one?<br>B: I like this one better. ⓑ (Let, Let’s) buy it.",ko:"A: 이 카펫과 저 카펫 중 어느 것이 더 좋니?<br>B: 나는 이게 더 좋아. 그것을 사자.",ans:"Which, Let’s",full:"A: Which is better, this carpet or that one?<br>B: I like this one better. Let’s buy it.",pen:"ⓐ 이것 or 저것 중 고르기 → Which / ⓑ ‘~하자’ → Let’s",tr:"A: ⓐ ___ 더 좋니, 이 카펫이니 저 카펫이니?<br>B: 나는 이게 더 좋아. ⓑ ___ 그것을 사.",ex:["carpet = 카펫"],h:["본책 UNIT 01의 which는 둘 중 하나를 고르는 말이고, UNIT 05의 Let’s는 ‘~하자’예요.","ⓐ는 ‘이 카펫 아니면 저 카펫’처럼 고를 범위가 있고, ⓑ 뒤에는 buy(동사원형)가 와요.","ⓐ는 ‘어느 것’을 뜻하는 w로 시작하는 다섯 글자 말, ⓑ는 ‘~하자’를 뜻하는 줄임말(L로 시작, 5글자)이에요."]});

A("RT","RT",17,"c",{q:"다음 우리말을 영어로 바르게 옮긴 것은?<br>그는 외국 동전들을 모으지 않았니?",opts:["Isn’t he collect foreign coins?","Wasn’t he collect foreign coins?","Don’t he collect foreign coins?","Doesn’t he collect foreign coins?","Didn’t he collect foreign coins?"],ko:"그는 외국 동전들을 모으지 않았니?",ans:"Didn’t he collect foreign coins?",full:"Didn’t he collect foreign coins?",pen:"과거 일반동사 부정의문문 → Didn’t he + 동사원형",tr:"① ~ ⑤ 모두 ‘그는 외국 동전들을 모으지 않았니?’를 영어로 옮기려고 한 문장이에요.",ex:["foreign = 외국의","coin = 동전","collect = 모으다"],h:["본책 UNIT 04의 부정의문문은 ‘부정 줄임말 + 주어 + 동사원형’이에요.","‘모으지 않았니?’는 과거이고 collect는 일반동사예요. 그러면 be동사 부정이나 현재형 do/does는 안 맞아요.","did의 부정 줄임말로 시작하고 뒤에 동사원형이 오는 문장을 골라요."]});
A("RT","RT",18,"w",{q:"They have a very cute baby. (감탄문으로)<br>→ ___ !",ko:"그들은 정말 귀여운 아기를 가졌구나!",ans:"What a cute baby they have",full:"What a cute baby they have!",pen:"a very cute baby → What a cute baby + 주어 + 동사!",tr:"그들은 매우 귀여운 아기를 가졌다. (감탄문으로)",ex:["cute = 귀여운"],h:["본책 UNIT 05의 감탄문: What + a/an + 형용사 + 명사 + 주어 + 동사!","원래 문장의 ‘a very cute baby’에서 very를 빼고 ‘a + 형용사 + 명사’를 What 뒤로 옮겨요.","What 뒤에 ‘a + 형용사 + 명사’를 쓰고, 그다음 원래 문장의 주어와 동사를 이어요."]});
A("RT","RT",19,"w",{q:"You should not make the same mistake again. (명령문으로)<br>→ ___ .",ko:"같은 실수를 다시 하지 마라.",ans:"Don’t make the same mistake again / Do not make the same mistake again",full:"Don’t make the same mistake again.",pen:"should not(~하면 안 된다) → 금지 명령문 Don’t + 동사원형",tr:"너는 같은 실수를 다시 하면 안 된다. (명령문으로)",ex:["mistake = 실수"],h:["본책 UNIT 05의 부정 명령문은 Don’t + 동사원형이에요. 주어는 쓰지 않아요.","should not(~하면 안 된다)을 ‘~하지 마라’는 명령으로 바꿔요. 주어 You도 빼요.","금지 표현(줄임말은 D로 시작) 뒤에 동사원형과 나머지 말을 그대로 이어요."]});

A("RT","RT",24,"w",{q:"A: Let go to the concert. Pianist Isaac Dylan will play.<br>B: That sounds great. I like his music.<br>A: He is a great pianist, is he?<br>B: Yes, he is. What beautifully he plays! (3개)",ko:"A: 콘서트에 가자. 피아니스트 Isaac Dylan이 연주할 거야.<br>B: 좋아. 나는 그의 음악을 좋아해.<br>A: 그는 훌륭한 피아니스트야, 그렇지 않니?<br>B: 응, 그래. 그는 정말 아름답게 연주하는구나!",ans:"Let go → Let’s go, is he → isn’t he, What beautifully → How beautifully",full:"A: Let’s go to the concert. Pianist Isaac Dylan will play.<br>B: That sounds great. I like his music.<br>A: He is a great pianist, isn’t he?<br>B: Yes, he is. How beautifully he plays!",pen:"Let go → Let’s go / is he → isn’t he / What beautifully → How beautifully",tr:"A: 콘서트에 가자. 피아니스트 Isaac Dylan이 연주할 거야.<br>B: 좋아. 나는 그의 음악을 좋아해.<br>A: 그는 훌륭한 피아니스트야, 그렇지 ___?<br>B: 응, 그래. 그는 ___ 연주하는구나!",ex:["pianist = 피아니스트","concert = 콘서트"],h:["본책 UNIT 05의 제안문은 Let’s, UNIT 03의 부가의문문은 앞이 긍정이면 부정, 감탄문은 부사를 강조하면 how예요.","세 곳을 찾아요. 제안하는 문장, ‘그렇지 않니?’ 하고 되묻는 문장, 감탄하는 문장이에요.","제안 문장은 ‘~하자’ 꼴로, 부가의문문은 앞 문장과 반대 꼴로, 감탄문은 부사 앞에 알맞은 말로 고쳐요."]});
