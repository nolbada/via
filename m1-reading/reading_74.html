우리의 허락 없이 이 사진들을 올렸어.","ok":false,"foot":["1permission 허락"],"fixes":[{"wrong":"in","right":"into","partial":false,"at":[2],"point":"어휘/전치사: ‘침입하다’는 break into (전치사 into 사용)","topic":"어휘/전치사","memo":"‘침입하다’는 break into (전치사 into 사용)"},{"wrong":"us","right":"our","partial":false,"at":[10],"point":"인칭대명사 격: 명사(permission)앞에는 소유격 our 사용","topic":"인칭대명사 격","memo":"명사(permission)앞에는 소유격 our 사용"}]},{"n":30,"tag":null,"en":"Don’t you know these things is wrong?” said Father Bear.","ko":"너는 이런 것들이 잘못이라는 것을 모르니?”라고 아빠곰이 말했다.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[5],"point":"수일치: 주어 things(복수)에 맞춰 be동사 are 사용","topic":"수일치","memo":"주어 things(복수)에 맞춰 be동사 are 사용"}]},{"n":31,"tag":null,"en":"“Please forgive me. I’m so sorry, and I’ll cleaning your house every day until the end of the summer,” said Goldilocks.","ko":"“용서해 주세요. 정말 죄송해요, 여름이 끝날 때까지 매일 여러분 집을 청소할게요.” Goldilocks가 말했다.","ok":false,"foot":["1forgive 용서하다"],"fixes":[{"wrong":"cleaning","right":"clean","partial":false,"at":[8],"point":"조동사(’ll=will) 뒤에는 동사원형 clean 사용","topic":"조동사(’ll=will) 뒤에는 동사원형 clean 사용","memo":""}]}];var RNUM=74;var TITLE_EN="Goldilocks Learns Her Lesson";var PASS_EN=["Goldilocks Learns Her Lesson","There was a little girl with golden hair in a small town. Her name was Goldilocks. She liked to share photos on social media. At first, she posted everyday things, but people didn’t give her many likes.","“What should I do to get more likes?” she thought. “I know! I should post funny pictures.”","Now, her posts were getting a lot of likes, and Goldilocks was happy. Her followers, however, soon got bored. So, she decided to post more shocking pictures.","One day, she was taking a walk in the forest and found a cottage. She knocked on the door, but there was no answer. It was getting dark, and it started to rain. She opened the door and walked inside.","There were three bowls of soup on a table. She ate the smallest one and took selfies with a smile. There were also three chairs. She jumped on the smallest one again and again. It broke, but she didn’t care.","“It’s so fun!” shouted Goldilocks.","She took selfies again and posted all the selfies on social media. Then, she went upstairs and found three beds. She felt tired and fell asleep in the smallest bed.","About an hour later, three bears came home.","“Someone ate my soup and broke my chair!” cried Baby Bear.","They went upstairs and saw Goldilocks. Mother Bear found a phone next to Goldilocks.","“This is terrible! Look at all these posts of our home,” shouted Mother Bear angrily.","Goldilocks jumped up in surprise.","“You broke into our house and posted these pictures without our permission. Don’t you know these things are wrong?” said Father Bear.","“Please forgive me. I’m so sorry, and I’ll clean your house every day until the end of the summer,” said Goldilocks.","“You still don’t understand. Other people already shared them on social media. Your posts will live on forever,” said Father Bear.","“Oh, I didn’t think about that,” said Goldilocks. “From now on, I’ll think twice before I press POST.”"];var PASS_KO=["Goldilocks가 교훈을 배우다","작은 마을에 금발의 어린 소녀가 있었다. 그녀의 이름은 Goldilocks였다. 그녀는 소셜 미디어에 사진을 공유하는 것을 좋아했다. 처음에, 그녀는 일상적인 것들을 올렸지만, 사람들은 그녀에게 ‘좋아요’를 많이 주지 않았다.","“어떻게 하면 더 많은 ‘좋아요’를 받을 수 있지?” 그녀는 생각했다. “알았다! 웃긴 사진들을 올려야겠어.”","이제, 그녀의 게시물은 많은 ‘좋아요’를 받고 있었고, Goldilocks는 행복했다. 하지만, 그녀의 팔로워들은 곧 지루해졌다. 그래서, 그녀는 더 충격적인 사진들을 올리기로 결심했다.","어느 날, 그녀는 숲에서 산책을 하다가 한 오두막집을 발견했다. 그녀는 문을 두드렸지만, 아무 대답이 없었다. 날이 어두워지고 있었고, 비가 내리기 시작했다. 그녀는 문을 열고 안으로 걸어 들어갔다.","식탁 위에는 수프 세 그릇이 있었다. 그녀는 가장 작은 그릇의 수프를 먹었고 미소를 지으며 셀피를 찍었다. 의자도 세 개 있었다. 그녀는 가장 작은 의자 위에서 몇 번이고 뛰었다. 의자가 부서졌지만, 그녀는 신경 쓰지 않았다.","“너무 재미있어!”라고 Goldilocks가 외쳤다.","그녀는 다시 셀피를 찍었고 모든 셀피를 소셜 미디어에 올렸다. 그런 다음, 그녀는 위층으로 올라가 침대 세 개를 발견했다. 그녀는 피곤해서 가장 작은 침대에서 잠들었다.","약 한 시간 후에, 곰 세 마리가 집으로 돌아왔다.","“누군가 내 수프를 먹고 내 의자를 부서뜨렸어요!”라고 아기곰이 외쳤다.","그들은 위층으로 가서 Goldilocks를 봤다. 엄마곰이 Goldilocks 옆에서 휴대폰을 발견했다.","“끔찍해! 우리 집에 관한 이 모든 게시물을 봐요.”라고 엄마곰이 화가 나서 외쳤다.","Goldilocks는 놀라서 벌떡 일어났다.","“너는 우리 집에 침입해서 우리의 허락 없이 이 사진들을 올렸어. 너는 이런 것들이 잘못이라는 것을 모르니?”라고 아빠곰이 말했다.","“용서해 주세요. 정말 죄송해요, 여름이 끝날 때까지 매일 여러분 집을 청소할게요.” Goldilocks가 말했다.","여름 내내, Goldilocks는 열심히 일했다. 마지막 날에 Goldilocks는 “오두막집에 관한 제 게시물을 모두 삭제했으니 걱정하지 마세요.”라고 아빠곰에게 말했다.","“너는 아직도 이해하지 못하는구나. 다른 사람들이 이미 소셜 미디어에 그것들을 공유했어. 너의 게시물은 영원히 남아 있을 거야.”라고 아빠곰이 말했다.","“아, 그 생각은 하지 못했어요.”라고 Goldilocks가 말했다. “이제부터 ‘게시’를 누르기 전에 다시 생각할게요.”"];var DLG=[["B","What do you think about this book, Yuna?","이 책 어떻게 생각해, 유나야?"],["G","A History of Black Holes? I think it’ll be difficult.","‘블랙홀의 역사’? 어려울 것 같아."],["B","I don’t agree. I think it’ll be very interesting.","나는 동의하지 않아. 아주 재미있을 것 같아."],["G","Hmm ... I didn’t know you were interested in black holes. So, are you going to buy the book, Alex?","음 ... 네가 블랙홀에 관심 있는지 몰랐어. 그래서, 그 책 살 거야, Alex?"],["B","I’d love to, but it’s too thick and heavy.","그러고 싶지만, 너무 두껍고 무거워."],["G","Why don’t you buy the e-book then? You can read it on your phone.","그럼 전자책을 사는 게 어때? 휴대폰으로 읽을 수 있잖아."],["B","That’s a good idea!","좋은 생각이야!"],["G","And it’s also cheaper than the paper book.","그리고 종이책보다 더 싸기도 해."],["B","Really? Then, I’ll buy the e-book.","정말? 그럼 전자책을 살게."]];var BQ=[{"n":1,"q":"유나는 ‘블랙홀의 역사’가 어떨 것 같다고 생각하나요?","o":["어려울 것 같다","아주 재미있을 것 같다","너무 짧을 것 같다","너무 무서울 것 같다","별로 새롭지 않을 것 같다"],"a":0,"ev":["A History of Black Holes? I think it’ll be difficult.","‘블랙홀의 역사’? 어려울 것 같아."],"why":"유나의 의견이에요. Alex는 반대로 재미있을 것 같다고 했어요.","ans":"어려울 것 같다","memo":["유나의 의견 = 책이 어려울 것 같음","I think it’ll be difficult. (어려울 것 같아.)"]},{"n":2,"q":"Alex가 종이책을 사지 않으려는 이유는 무엇인가요?","o":["너무 비싸서","너무 두껍고 무거워서","재미가 없어서","이미 갖고 있어서","글씨가 너무 작아서"],"a":1,"ev":["I’d love to, but it’s too thick and heavy.","그러고 싶지만, 너무 두껍고 무거워."],"why":"thick은 '두꺼운', heavy는 '무거운'이에요. 비싸서가 아니에요.","ans":"너무 두껍고 무거워서","memo":["종이책을 안 사는 이유 = 너무 두껍고 무거움","I’d love to, but it’s too thick and heavy. (그러고 싶지만, 너무 두껍고 무거워.)"]},{"n":3,"q":"유나는 Alex에게 무엇을 하라고 제안했나요?","o":["도서관에서 빌리기","친구에게 빌리기","전자책을 사기","책을 사지   h+='<div class="memo"><h2>문법 memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장'+(ms.length>cap?' '+ms.length+'개 중 '+cap+'개':'')+'만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function load(){try{var v=localStorage.getItem(BK);return v==null?null:+v}catch(e){return null}}
function save(n){try{var b=load();if(b==null||n>b)localStorage.setItem(BK,n)}catch(e){}}
document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){done[+b.dataset.sub]=true;render();
  var tot=0,fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[{title:'대화문 내용 파악',groups:[{dlg:DLG,qs:BQ}]},{title:'본문 내용 파악',groups:[{pass:0,qs:DQ}]}];
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 return h;
}
function passHtml(si,lock){
 var h='<div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 PASS_EN.forEach(function(l){h+='<div class="ln"><div class="en">'+esc(l)+'</div></div>'});
 if(lock){h+='<div class="kr" style="white-space:pre-line">'+esc(PASS_KO.join('\n'))+'</div>'}
 return h+'</div>';
}
function dlgHtml(d,lock){
 var h='<div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pass!=null)h+=passHtml(g.pass,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/5</span><button data-subq="'+p+'">제출하기</button></div>';
 return h;
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div><div class="pt" style="margin-top:4px">'+esc(q.why)+'</div></div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 5문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">틀린 문제'+(ms.length>cap?' '+ms.length+'개 중 '+cap+'개':'')+'만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

render();
