<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>브릭스 중학독해 3 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"b3-01-1","no":1,"ko":"1층이라고 해서 갔는데, 사무실이 없다?","items":[{"n":1,"t":"tf","q":"Kevin went straight to the first floor to find Oliver.","ko":"케빈은 올리버를 찾으려고 곧장 1층(first floor)으로 갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When Kevin arrived at the London office, he went straight to the first floor to find Oliver.","케빈이 런던 사무실에 도착했을 때, 그는 올리버를 찾으려고 곧장 1층으로 갔다."]],"w":"3번 문장에 he went straight to the first floor to find Oliver가 그대로 나옴. went는 go(가다)의 과거형.","c":"T"},"h":"a733e3783c"},{"n":2,"t":"tf","q":"Oliver worked in New York, and Kevin was based in London.","ko":"올리버는 뉴욕에서 일했고, 케빈은 런던에 근무지가 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"While Kevin worked in New York, Oliver was based in London.","케빈은 뉴욕에서 일했고, 올리버는 런던에 근무지가 있었다."]],"w":"2번 문장에서 케빈이 뉴욕에서 일했고(Kevin worked in New York) 올리버가 런던에 근무지가 있었음(Oliver was based in London). worked는 work(일하다)의 과거형. 두 사람의 도시가 서로 바뀐 진술이라 F.","c":"F"},"h":"b594bc6149"},{"n":3,"t":"tf","q":"In the U.S., the first floor is at street level.","ko":"미국에서 first floor는 길거리 높이에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"In the U.S., the first floor is located at street level.","미국에서 first floor는 길거리 높이에 있는 층이다."]],"w":"9번 문장에 In the U.S., the first floor is located at street level이라고 나옴. 같은 내용이라 T.","c":"T"},"h":"d57cca95ee"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... he remained confused by the situation.)","ko":"... 그는 그 상황에 대해 여전히 헷갈렸다.","opts":["화난","편안한","헷갈린","자랑스러운"],"word":"confused","r":{"a":"3) 헷갈린","ev":"7번 문장","s":[[7,"Although Kevin followed him up the stairs, he remained confused by the situation.","케빈은 그를 따라 계단을 올라갔지만, 여전히 그 상황이 헷갈렸다."]],"w":"7번에서 케빈은 올리버를 따라 계단을 올랐지만 아직 왜 그런지 몰랐음. 그래서 confused는 헷갈린. 화나거나 자랑스럽다는 감정은 나오지 않음.","c":3},"h":"fecdda51af"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (English words can have separate meanings in different regions of the world.)","ko":"영어 단어는 세계의 서로 다른 지역에서 서로 다른 뜻을 가질 수 있다.","opts":["별개의, 서로 다른","똑같은","쉬운","새로운"],"word":"separate","r":{"a":"1) 별개의, 서로 다른","ev":"11번 문장","s":[[11,"English words can have separate meanings in different regions of the world.","영어 단어는 세계의 지역에 따라 서로 다른 뜻을 가질 수 있다."]],"w":"11번의 separate meanings는 지역마다 따로 있는, 서로 다른 뜻. 미국과 영국에서 first floor의 뜻이 달랐던 것(8~10번)과 같은 이야기. 똑같다는 뜻이 아님.","c":1},"h":"598677fe64"},{"n":6,"t":"ref","q":"What does the underlined \"his friend’s\" refer to?\nBut Kevin could not find his friend’s office.","ko":"밑줄 친 his friend’s가 가리키는 것은?","sko":"하지만 케빈은 친구의 사무실을 찾을 수 없었다.","opts":["케빈","올리버","케빈의 가족","런던 사무실의 직원"],"r":{"a":"2) 올리버","ev":"1번, 4번 문장","s":[[1,"Kevin could not wait to see his friend, Oliver.","케빈은 친구 올리버를 몹시 만나고 싶었다."],[4,"But Kevin could not find his friend’s office.","하지만 케빈은 친구의 사무실을 찾을 수 없었다."]],"w":"4번의 his friend’s는 케빈의 친구의 뜻으로, 1번에서 케빈이 몹시 만나고 싶어 한 친구 올리버(his friend, Oliver)를 가리킴. 케빈이 찾지 못한 것은 올리버의 사무실이라서 케빈 본인이나 가족, 직원은 오답.","c":2,"k":"his friend’s = 올리버"},"pron":"his friend’s","h":"6e757e7a07"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The mix-up happened because “first floor” means different things in the U.S. and the U.K.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 착오는 ‘first floor’가 미국과 영국에서 서로 다른 것을 뜻하기 때문에 생겼다.","opts":["미국과 영국의 건물 모양이 달라서 케빈이 길을 잃었다.","영국 사람들은 first floor라는 말을 아예 쓰지 않아서 혼란이 생겼다.","케빈이 영국 영어를 몰라서 올리버와 대화가 되지 않았다.","first floor가 두 나라에서 다른 층을 가리켜서 착오가 생겼다."],"r":{"a":"4) first floor가 두 나라에서 다른 층을 가리켜서 착오가 생겼다.","ev":"8번 문장","s":[[8,"The mix-up happened because “first floor” means different things in the U.S. and the U.K.","이 착오는 ‘first floor’가 미국과 영국에서 서로 다른 것을 뜻하기 때문에 생겼다."]],"w":"8번의 because 뒤가 이유: first floor가 미국과 영국에서 서로 다른 것을 뜻함. 영국에서도 first floor라는 말을 쓰지만 지면보다 한 층 위를 가리킴(10번). 건물 모양이나 대화가 안 된 것이 원인은 아님.","c":4},"h":"bed2abd3aa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["케빈은 친구 올리버를 만나는 것이 몹시 기대되었다.","케빈은 올리버의 사무실을 쉽게 찾았다.","올리버는 케빈을 발견했을 때 화가 났다.","케빈은 올리버를 따라 계단을 내려갔다."],"opts":["Kevin was excited to see his friend Oliver.","Kevin found Oliver’s office easily.","Oliver was angry when he found Kevin.","Kevin followed Oliver down the stairs."],"r":{"a":"1) Kevin was excited to see his friend Oliver. (케빈은 친구 올리버를 만나는 것이 몹시 기대되었다.)","ev":"1번, 4번, 5번, 7번 문장","s":[[1,"Kevin could not wait to see his friend, Oliver.","케빈은 친구 올리버를 몹시 만나고 싶었다."],[4,"But Kevin could not find his friend’s office.","하지만 케빈은 친구의 사무실을 찾을 수 없었다."],[5,"A few minutes later, Oliver found Kevin and laughed.","몇 분 후, 올리버가 케빈을 발견하고 웃었다."],[7,"Although Kevin followed him up the stairs, he remained confused by the situation.","케빈은 그를 따라 계단을 올라갔지만, 여전히 그 상황이 헷갈렸다."]],"w":"1번에서 케빈은 친구 올리버를 몹시 만나고 싶어 했음(could not wait to see). 4번에서 케빈은 사무실을 찾지 못했고, 5번에서 올리버는 케빈을 발견하고 웃었으며, 7번에서 둘은 계단을 올라갔으므로 나머지는 본문과 다름.","c":1},"h":"ac20b66d14"},{"n":9,"t":"sum","q":"Kevin went to the wrong floor because people in the U.S. and the U.K. (A) the term \"first floor\" in their own ways, which shows that English can (B) from place to place.","ko":"케빈이 엉뚱한 층에 간 것은 미국과 영국 사람들이 ‘first floor’라는 말을 각자 나름대로 (A)하기 때문이며, 이는 영어가 지역마다 (B)할 수 있음을 보여 준다.","oko":["(A) 사용 / (B) 변하다","(A) 회피 / (B) 변하다","(A) 사용 / (B) 그대로이다","(A) 회피 / (B) 그대로이다","(A) 무시 / (B) 사라지다"],"opts":["(A) use / (B) change","(A) avoid / (B) change","(A) use / (B) stay the same","(A) avoid / (B) stay the same","(A) ignore / (B) disappear"],"r":{"a":"1) (A) use / (B) change ((A) 사용 / (B) 변하다)","ev":"8번, 12번 문장","s":[[8,"The mix-up happened because “first floor” means different things in the U.S. and the U.K.","이 착오는 ‘first floor’가 미국과 영국에서 서로 다른 것을 뜻하기 때문에 생겼다."],[12,"So when someone uses a word differently than you expect, remember that English changes from place to place.","그러니 누군가 여러분이 예상한 것과 다르게 단어를 쓸 때는, 영어가 지역마다 달라진다는 것을 기억하라."]],"w":"8번에서 first floor가 미국과 영국에서 서로 다른 것을 뜻해 착오가 생겼고, 12번에서 영어는 지역마다 변한다(changes from place to place)고 함. 그래서 (A)는 use(사용하다), (B)는 change(변하다)임.","c":1},"h":"14af90e3e6"},{"n":10,"t":"fill","q":"A few minutes [A], Oliver found Kevin and [B].","ko":"몇 분 [A], 올리버는 케빈을 발견하고 [B].","bko":{"later":"후에, 나중에","laughed":"웃었다(laugh의 과거)","stairs":"계단","office":"사무실","level":"층, 높이","situation":"상황"},"bank":["later","laughed","stairs","office","level","situation"],"r":{"a":"[A] later (후에, 나중에), [B] laughed (웃었다(laugh의 과거))","ev":"5번 문장","s":[[5,"A few minutes later, Oliver found Kevin and laughed.","몇 분 후, 올리버가 케빈을 발견하고 웃었다."]],"w":"5번에서 몇 분 후(A few minutes later) 올리버가 케빈을 발견하고 웃었다(laughed)고 함. stairs, office, level, situation은 명사라 두 빈칸에 들어갈 수 없음.","c":null},"h":"ddc4ceb21b"}]},{"u":1,"id":"b3-01-2","no":2,"ko":"산속에서 휘파람만 부는데 대화라고?","items":[{"n":1,"t":"tf","q":"In Kuşdili, each whistle stands for a syllable in Turkish.","ko":"쿠슈딜리에서는 각각의 휘파람이 튀르키예어의 음절 하나를 나타낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"In Kuşdili, each whistle stands for a syllable in Turkish, like letters in the alphabet.","쿠슈딜리에서는 알파벳의 글자처럼, 각각의 휘파람이 튀르키예어의 음절 하나를 나타낸다."]],"w":"11번 문장에 each whistle stands for a syllable in Turkish가 그대로 나옴.","c":"T"},"h":"66419d4c29"},{"n":2,"t":"tf","q":"Kuşköy is a flat place where voices carry well.","ko":"쿠쉬쾨이는 목소리가 잘 전달되는 평평한 곳이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It’s a steep, mountainous place in Türkiye, where voices don’t carry well.","그곳은 튀르키예의 가파르고 산이 많은 곳으로, 목소리가 잘 전달되지 않는다."]],"w":"7번 문장에서 쿠쉬쾨이는 가파르고 산이 많은 곳(steep, mountainous)이고, 목소리가 잘 전달되지 않는다(voices don’t carry well)고 함. 평평하고 소리가 잘 전달된다는 말은 반대라서 F.","c":"F"},"h":"304ee27470"},{"n":3,"t":"tf","q":"The villagers created a whistling language to communicate from a distance.","ko":"마을 사람들은 멀리서 의사소통하기 위해 휘파람 언어를 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"To communicate from a distance, they created a whistling language and have used it for hundreds of years.","멀리서 의사소통하기 위해, 그들은 휘파람 언어를 만들었고 수백 년 동안 그것을 사용해 왔다."]],"w":"10번 문장 To communicate from a distance, they created a whistling language와 같은 내용이라 T. created는 create(만들다)의 과거형.","c":"T"},"h":"48e236f2ae"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some of the people there are separated by a deep valley.)","ko":"그곳 사람들 중 일부는 깊은 골짜기로 떨어져 있다.","opts":["도와주는","떨어져 있는","섞여 있는","초대받은"],"word":"separated","r":{"a":"2) 떨어져 있는","ev":"8번 문장","s":[[8,"Some of the people there are separated by a deep valley.","그곳 사람들 중 일부는 깊은 골짜기로 떨어져 있다."]],"w":"8번에서 깊은 골짜기가 사람들 사이를 가르고 있음. 그래서 서로 방문하려면 먼 길을 걸어야 한다는 9번 내용으로 이어짐. separated = 떨어져 있는. 섞여 있다면 멀리 걸을 필요가 없었을 것.","c":2},"h":"fc92ee83e8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To visit each other, they must walk long and twisty paths.)","ko":"서로를 방문하려면, 그들은 길고 구불구불한 길을 걸어야 한다.","opts":["곧은","넓은","짧은","구불구불한"],"word":"twisty","r":{"a":"4) 구불구불한","ev":"9번 문장","s":[[9,"To visit each other, they must walk long and twisty paths.","서로를 방문하려면, 그들은 길고 구불구불한 길을 걸어야 한다."]],"w":"9번의 long and twisty paths는 산속의 길고 굽이굽이 이어진 길. twisty = 구불구불한. 곧은 길이나 짧은 길이면 걷기 힘들다는 맥락과 맞지 않음.","c":4},"h":"b47f679209"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey’re not just playing but having a real conversation!","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 단지 노는 것이 아니라 진짜 대화를 하고 있는 것이다!","opts":["휘파람을 주고받는 두 남자","쿠슈딜리라는 언어","튀르키예의 산","유네스코 직원들"],"r":{"a":"1) 휘파람을 주고받는 두 남자","ev":"1~4번 문장","s":[[1,"High in the mountains, two men stand far apart.","높은 산속에서 두 남자가 멀리 떨어져 서 있다."],[2,"One whistles.","한 명이 휘파람을 분다."],[3,"The other whistles back.","다른 한 명이 휘파람으로 답한다."],[4,"They’re not just playing but having a real conversation!","그들은 단지 노는 것이 아니라 진짜 대화를 하고 있는 것이다!"]],"w":"1~3번에서 높은 산속에 멀리 떨어져 선 두 남자가 한 명이 휘파람을 불면 다른 한 명이 휘파람으로 답했음. 4번의 They는 이 두 남자를 가리킴. 언어나 산은 대화를 할 수 없음.","c":1,"k":"They = 휘파람을 주고받는 두 남자"},"pron":"They","h":"fa2b2c4cc6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So people can whistle names, numbers, and even new words.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 사람들은 이름, 숫자, 심지어 새로운 단어까지도 휘파람으로 불 수 있다.","opts":["사람들은 이름과 숫자만 휘파람으로 표현할 수 있다.","휘파람으로는 단어를 전혀 전달할 수 없다.","사람들은 이름, 숫자, 심지어 새로운 단어도 휘파람으로 표현할 수 있다.","새로운 단어는 휘파람이 아니라 글자로만 전달할 수 있다."],"r":{"a":"3) 사람들은 이름, 숫자, 심지어 새로운 단어도 휘파람으로 표현할 수 있다.","ev":"12번 문장","s":[[12,"So people can whistle names, numbers, and even new words.","그래서 사람들은 이름, 숫자, 심지어 새로운 단어까지도 휘파람으로 불 수 있다."]],"w":"12번은 사람들이 이름, 숫자, 심지어 새로운 단어까지도 휘파람으로 부를 수 있다는 뜻(can whistle names, numbers, and even new words). even은 ‘심지어’라는 뜻이라 새 단어까지 가능하다는 내용이 들어가야 함.","c":3},"h":"28105b3daf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["쿠슈딜리는 쿠쉬쾨이라는 마을에서 쓰이는 특별한 언어이다.","쿠슈딜리는 겨우 몇 년 전에 만들어졌다.","쿠슈딜리는 오직 놀이를 할 때만 쓰인다.","쿠슈딜리는 전 세계의 도시에서 쓰인다."],"opts":["Kuşdili is a special language used in a village called Kuşköy.","Kuşdili was created only a few years ago.","Kuşdili is used only for playing games.","Kuşdili is used in cities all over the world."],"r":{"a":"1) Kuşdili is a special language used in a village called Kuşköy. (쿠슈딜리는 쿠쉬쾨이라는 마을에서 쓰이는 특별한 언어이다.)","ev":"4번, 5번, 6번, 10번 문장","s":[[4,"They’re not just playing but having a real conversation!","그들은 단지 노는 것이 아니라 진짜 대화를 하고 있는 것이다!"],[5,"It’s a special language called Kuşdili.","그것은 쿠슈딜리(Kuşdili)라고 불리는 특별한 언어이다."],[6,"Kuşdili is used in a village called Kuşköy.","쿠슈딜리는 쿠쉬쾨이(Kuşköy)라는 마을에서 쓰인다."],[10,"To communicate from a distance, they created a whistling language and have used it for hundreds of years.","멀리서 의사소통하기 위해, 그들은 휘파람 언어를 만들었고 수백 년 동안 그것을 사용해 왔다."]],"w":"5~6번에서 쿠슈딜리는 쿠쉬쾨이라는 마을에서 쓰이는 특별한 언어라고 함. 10번에서 수백 년 동안 써 왔다고 했고, 4번에서 단순한 놀이가 아니라 진짜 대화라고 했으므로 나머지는 본문과 다름. 도시에서 쓰인다는 내용은 본문에 없음.","c":1},"h":"5ae9e51c43"},{"n":9,"t":"sum","q":"Modern (A) such as cell phones and the Internet is causing the whistling tradition to (B).","ko":"휴대전화와 인터넷 같은 현대 (A) 때문에 휘파람 전통이 (B) 있다.","oko":["(A) 기술 / (B) 사라지고","(A) 기술 / (B) 커지고","(A) 음악 / (B) 사라지고","(A) 날씨 / (B) 커지고","(A) 음악 / (B) 퍼지고"],"opts":["(A) technology / (B) disappear","(A) technology / (B) grow","(A) music / (B) disappear","(A) weather / (B) grow","(A) music / (B) spread"],"r":{"a":"1) (A) technology / (B) disappear ((A) 기술 / (B) 사라지고)","ev":"13번 문장","s":[[13,"However, modern technology such as cell phones and the Internet is causing this tradition to disappear.","하지만 휴대전화와 인터넷 같은 현대 기술이 이 전통을 사라지게 하고 있다."]],"w":"13번에서 휴대전화와 인터넷 같은 현대 기술(modern technology)이 이 전통을 사라지게 하고 있다(causing this tradition to disappear)고 함. 그래서 (A)는 technology, (B)는 disappear임.","c":1},"h":"e04dec581b"},{"n":10,"t":"fill","q":"Because of this, UNESCO [A] the Turkish whistling language as an element of Intangible Cultural [B].","ko":"이 때문에 유네스코는 튀르키예의 휘파람 언어를 무형문화 [B]의 한 요소로 [A].","bko":{"recognized":"인정했다(recognize의 과거)","Heritage":"유산","steep":"가파른","deep":"깊은","modern":"현대의","special":"특별한"},"bank":["recognized","Heritage","steep","deep","modern","special"],"r":{"a":"[A] recognized (인정했다(recognize의 과거)), [B] Heritage (유산)","ev":"14번 문장","s":[[14,"Because of this, UNESCO recognized the Turkish whistling language as an element of Intangible Cultural Heritage.","이 때문에 유네스코는 튀르키예의 휘파람 언어를 무형문화유산의 하나로 인정했다."]],"w":"14번에서 유네스코가 튀르키예의 휘파람 언어를 무형문화유산의 하나로 인정했다(recognized ... Intangible Cultural Heritage)고 함. steep, deep, modern, special은 형용사라 두 빈칸에 들어갈 수 없음.","c":null},"h":"d580ae3045"}]},{"u":1,"id":"b3-01-3","no":3,"ko":"문자가 없던 언어가 한글을 만난 이유","items":[{"n":1,"t":"tf","q":"The Cia-Cia language did not have its own writing system.","ko":"찌아찌아어에는 자체 문자 체계가 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They speak their own language, but a writing system for it was never developed.","그들은 자신들의 언어를 말하지만, 그 언어를 위한 문자 체계는 한 번도 만들어진 적이 없었다."]],"w":"2번에서 그 언어를 위한 문자 체계는 한 번도 만들어진 적이 없다(was never developed)고 함. 같은 내용이라 T.","c":"T"},"h":"4d5bf24257"},{"n":2,"t":"tf","q":"The Arabic alphabet fit the Cia-Cia sounds perfectly.","ko":"아랍 문자는 찌아찌아어 소리에 완벽하게 맞았다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"But the Roman alphabet didn’t fit the sounds, and the Arabic alphabet was missing some letters.","하지만 로마자는 그 소리에 맞지 않았고, 아랍 문자는 몇몇 글자가 없었다."]],"w":"7번에서 아랍 문자는 몇몇 글자가 없었다(was missing some letters)고 함. 완벽하게 맞았다는 말은 반대라서 F.","c":"F"},"h":"0f38104891"},{"n":3,"t":"tf","q":"South Korean scholars introduced Hangul to the Cia-Cia in 2020.","ko":"한국 학자들은 2020년에 찌아찌아족에게 한글을 소개했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번, 12번 문장","s":[[8,"In 2009, South Korean scholars visited and introduced Hangul.","2009년에 한국 학자들이 찾아와 한글을 소개했다."],[12,"In 2020, the first Cia-Cia dictionary written in Hangul was published.","2020년에는 한글로 쓰인 첫 찌아찌아어 사전이 출간되었다."]],"w":"한글을 소개한 해는 2009년(8번)이고, 2020년은 한글로 쓴 첫 찌아찌아어 사전이 출간된 해(12번)임. 연도가 뒤섞인 진술이라 F.","c":"F"},"h":"038358d246"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...a writing system for it was never developed.)","ko":"... 그 언어를 위한 문자 체계는 한 번도 만들어진 적이 없었다.","opts":["잊힌","만들어진","팔린","금지된"],"word":"developed","r":{"a":"2) 만들어진","ev":"2번 문장","s":[[2,"They speak their own language, but a writing system for it was never developed.","그들은 자신들의 언어를 말하지만, 그 언어를 위한 문자 체계는 한 번도 만들어진 적이 없었다."]],"w":"2번은 말은 있지만 글로 적는 체계가 한 번도 만들어지지 않았다는 뜻. 그래서 3번에서 이야기를 기록하기 어려웠다고 이어짐. developed = (체계가) 만들어진.","c":2},"h":"3e02ea7ac7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Hangul can represent sounds by combining letters...)","ko":"한글은 글자를 조합해 소리를 ... 수 있다.","opts":["나타내다","숨기다","섞다","잊다"],"word":"represent","r":{"a":"1) 나타내다","ev":"9번 문장","s":[[9,"Hangul can represent sounds by combining letters, so it worked better than the other alphabets.","한글은 글자를 조합해 소리를 나타낼 수 있어서, 다른 문자들보다 더 잘 맞았다."]],"w":"9번의 represent sounds는 글자로 소리를 나타낸다는 뜻. 한글이 글자를 조합해 소리를 보여 줄 수 있어서 다른 문자들보다 잘 맞았다는 이유가 됨.","c":1},"h":"6d793074b3"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt wasn’t perfect, but it showed Cia-Cia sounds more clearly.","ko":"밑줄 친 It이 가리키는 것은?","sko":"완벽하지는 않았지만, 그것은 찌아찌아어 소리를 더 분명하게 보여 주었다.","opts":["인도네시아의 국가 언어","부톤섬","한글","한국 학자들"],"r":{"a":"3) 한글","ev":"9~10번 문장","s":[[9,"Hangul can represent sounds by combining letters, so it worked better than the other alphabets.","한글은 글자를 조합해 소리를 나타낼 수 있어서, 다른 문자들보다 더 잘 맞았다."],[10,"It wasn’t perfect, but it showed Cia-Cia sounds more clearly.","완벽하지는 않았지만, 한글은 찌아찌아어 소리를 더 분명하게 보여 주었다."]],"w":"9번에서 한글은 글자를 조합해 소리를 나타낼 수 있어서 다른 문자들보다 더 잘 맞았다고 했고, 10번의 It은 완벽하지는 않았지만 찌아찌아어 소리를 더 분명하게 보여 준 것, 즉 한글을 가리킴. 국가 언어나 섬, 학자들은 소리를 보여 주는 문자가 아님.","c":3,"k":"It = 한글"},"pron":"It","h":"ef9c60a29a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Eventually, more young people from the island began using only Indonesia’s national language.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결국 섬의 더 많은 젊은이들이 인도네시아의 국가 언어만 사용하기 시작했다.","opts":["섬의 더 많은 젊은이들이 결국 인도네시아의 국가 언어만 쓰기 시작했다.","섬의 젊은이들이 자기 언어로만 이야기하기 시작했다.","섬의 젊은이들이 섬을 떠나 인도네시아 본토로 이사했다.","인도네시아의 국가 언어가 섬에서 사라지기 시작했다."],"r":{"a":"1) 섬의 더 많은 젊은이들이 결국 인도네시아의 국가 언어만 쓰기 시작했다.","ev":"4번 문장","s":[[4,"Eventually, more young people from the island began using only Indonesia’s national language.","결국 섬의 더 많은 젊은이들이 인도네시아의 국가 언어만 사용하기 시작했다."]],"w":"4번의 Eventually는 ‘결국’이라는 뜻이고, only Indonesia’s national language는 인도네시아의 국가 언어만이라는 뜻. 그래서 젊은이들이 결국 국가 언어만 쓰기 시작했다는 내용이 맞음. 5번에서 찌아찌아어가 서서히 사라져 간 이유임.","c":1},"h":"0108f0f4c8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["한글은 20세기 초부터 찌아찌아어를 적는 데 쓰여 왔다.","찌아찌아족은 한국에 있는 섬에 산다.","한글은 아랍 문자보다 덜 성공적이었다.","전문가들은 찌아찌아어를 지키기 위해 로마자와 아랍 문자를 써 보려고 했다."],"opts":["Hangul has been used to write Cia-Cia since the early 1900s.","The Cia-Cia people live on an island in South Korea.","Hangul was less successful than the Arabic alphabet.","Experts tried using the Roman and Arabic alphabets to protect the Cia-Cia language."],"r":{"a":"4) Experts tried using the Roman and Arabic alphabets to protect the Cia-Cia language.","ev":"1번, 6번, 8~9번 문장","s":[[1,"The Cia-Cia people live on Buton, an island in Indonesia.","찌아찌아족은 인도네시아의 섬인 부톤섬에 산다."],[6,"To protect their language, experts tried using the Roman and Arabic alphabets.","자신들의 언어를 지키기 위해, 전문가들은 로마자와 아랍 문자를 써 보려고 했다."],[8,"In 2009, South Korean scholars visited and introduced Hangul.","2009년에 한국 학자들이 찾아와 한글을 소개했다."],[9,"Hangul can represent sounds by combining letters, so it worked better than the other alphabets.","한글은 글자를 조합해 소리를 나타낼 수 있어서, 다른 문자들보다 더 잘 맞았다."]],"w":"6번에 To protect their language, experts tried using the Roman and Arabic alphabets가 그대로 나옴. 한글은 2009년에 소개됨(8번), 섬은 인도네시아(1번), 한글이 다른 문자들보다 더 잘 맞음(9번)이라 나머지는 모두 틀림.","c":4},"h":"d6445e3922"},{"n":9,"t":"sum","q":"Since then, the Cia-Cia have used Hangul to (A) their language, and the language now has a better chance of (B).","ko":"그 이후로 찌아찌아족은 한글을 사용해 자신들의 언어를 (A) 왔고, 그 언어는 이제 (B) 더 나은 가능성을 갖게 되었다.","oko":["(A) 가르쳐 / (B) 살아남을","(A) 잊어 / (B) 살아남을","(A) 가르쳐 / (B) 사라질","(A) 잊어 / (B) 사라질","(A) 팔아 / (B) 살아남을"],"opts":["(A) teach / (B) survival","(A) forget / (B) survival","(A) teach / (B) disappearance","(A) forget / (B) disappearance","(A) sell / (B) survival"],"r":{"a":"1) (A) teach / (B) survival ((A) 가르쳐 / (B) 살아남을)","ev":"11번, 13번 문장","s":[[11,"Since then, the Cia-Cia have used Hangul to teach their language.","그 이후로 찌아찌아족은 한글을 사용해 자신들의 언어를 가르쳐 왔다."],[13,"Thanks to Hangul, the Cia-Cia language now has a better chance of survival.","한글 덕분에, 찌아찌아어는 이제 살아남을 더 나은 가능성을 갖게 되었다."]],"w":"11번에서 찌아찌아족은 한글을 사용해 자신들의 언어를 가르쳐 왔다(have used Hangul to teach their language)고 하고, 13번에서 그 덕분에 언어가 살아남을 더 나은 가능성(a better chance of survival)을 갖게 되었다고 함.","c":1},"h":"5c360eb3b8"},{"n":10,"t":"fill","q":"The Cia-Cia language was [A] being [B].","ko":"찌아찌아어는 [A] [B].","bko":{"slowly":"서서히","lost":"사라져 가고 있었다(lose의 과거분사 lost)","island":"섬","sounds":"소리들","scholars":"학자들","letters":"글자들"},"bank":["slowly","lost","island","sounds","scholars","letters"],"r":{"a":"[A] slowly (서서히), [B] lost (사라져 가고 있었다(lose의 과거분사 lost))","ev":"5번 문장","s":[[5,"The Cia-Cia language was slowly being lost.","찌아찌아어는 서서히 사라져 가고 있었다."]],"w":"5번에서 찌아찌아어는 서서히 사라져 가고 있었다(was slowly being lost)고 함. island, sounds, scholars, letters는 명사라 두 빈칸에 들어갈 수 없음.","c":null},"h":"c0a7f2243b"}]},{"u":1,"id":"b3-01-4","no":4,"ko":"꼬리 하나로 싸움도 하고 사랑도 한다고?","items":[{"n":1,"t":"tf","q":"Ring-tailed lemurs hold their tails high like a flag when they move as a group.","ko":"알락꼬리여우원숭이는 무리를 지어 움직일 때 꼬리를 깃발처럼 높이 든다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"When lemurs move as a group, they hold their tails high like a flag.","여우원숭이가 무리를 지어 움직일 때, 그들은 꼬리를 깃발처럼 높이 든다."]],"w":"4번 문장 When lemurs move as a group, they hold their tails high like a flag와 같은 내용.","c":"T"},"h":"ae939ec2f8"},{"n":2,"t":"tf","q":"In a stink fight, male lemurs hit their rivals with their tails.","ko":"냄새 싸움에서 수컷 여우원숭이는 꼬리로 라이벌을 때린다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"This is called a “stink fight,” and its goal is to scare rivals away without any physical touching.","이것은 ‘냄새 싸움(stink fight)’이라고 불리며, 그 목표는 몸을 부딪치지 않고 라이벌을 쫓아 버리는 것이다."]],"w":"8번에서 냄새 싸움의 목표는 몸을 부딪치지 않고(without any physical touching) 라이벌을 쫓는 것. 꼬리로 때린다는 말은 반대라서 F.","c":"F"},"h":"dde56ecea7"},{"n":3,"t":"tf","q":"Ring-tailed lemurs live in the wet rainforests of Madagascar.","ko":"알락꼬리여우원숭이는 마다가스카르의 습한 열대우림에 산다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Ring-tailed lemurs live in the dry forests of Madagascar.","알락꼬리여우원숭이는 마다가스카르의 건조한 숲에 산다."]],"w":"1번에서 사는 곳은 마다가스카르의 건조한 숲(dry forests). 습한 열대우림(wet rainforests)이 아니라서 F.","c":"F"},"h":"1f32428418"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...they rub a strong scent from their bodies onto their tails...)","ko":"... 그들은 몸에서 나는 강한 냄새를 꼬리에 문질러 묻힌다...","opts":["소리","냄새","색깔","무게"],"word":"scent","r":{"a":"2) 냄새","ev":"7번 문장","s":[[7,"When they meet a rival, they rub a strong scent from their bodies onto their tails and wave them through the air.","그들은 라이벌을 만나면, 몸에서 나는 강한 냄새를 꼬리에 문질러 묻히고 그것을 공중에서 흔든다."]],"w":"7번의 strong scent from their bodies는 몸에서 나는 강한 냄새. 이 냄새를 꼬리에 묻혀 흔들기 때문에 이름이 stink(고약한 냄새) fight(8번).","c":2},"h":"f3126d9c75"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...wave them to show their health and attract a female.)","ko":"... 그것을 흔들어 자신의 건강을 보여 주고 암컷을 끌어들인다.","opts":["쫓아내다","숨기다","놀라게 하다","끌어들이다"],"word":"attract","r":{"a":"4) 끌어들이다","ev":"10번 문장","s":[[10,"Males spread a different, gentler scent on their tails and wave them to show their health and attract a female.","수컷은 다른, 더 순한 냄새를 꼬리에 퍼뜨리고 그것을 흔들어 자신의 건강을 보여 주고 암컷을 끌어들인다."]],"w":"10번의 목적은 건강을 보여 주고 암컷을 끌어들이는 것. attract = 끌어들이다. 8번의 scare away(쫓아내다)와 반대 방향이라 헷갈리지 않게 주의.","c":4},"h":"ffe86db829"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nYou can spot them by their long, black-and-white striped tails.","ko":"밑줄 친 them이 가리키는 것은?","sko":"길고 검은색과 흰색 줄무늬가 있는 꼬리로 그들을 알아볼 수 있다.","opts":["알락꼬리여우원숭이","마다가스카르의 건조한 숲","길고 줄무늬가 있는 꼬리","숲속의 풀과 나무"],"r":{"a":"1) 알락꼬리여우원숭이","ev":"1~2번 문장","s":[[1,"Ring-tailed lemurs live in the dry forests of Madagascar.","알락꼬리여우원숭이는 마다가스카르의 건조한 숲에 산다."],[2,"You can spot them by their long, black-and-white striped tails.","길고 검은색과 흰색 줄무늬가 있는 꼬리로 그들을 알아볼 수 있다."]],"w":"2번은 ‘길고 검은색과 흰색 줄무늬가 있는 꼬리로 them을 알아볼 수 있다’는 뜻. 꼬리(their tails)의 주인은 1번에서 말한 알락꼬리여우원숭이(Ring-tailed lemurs)라서 them은 여우원숭이를 가리킴.","c":1,"k":"them = 알락꼬리여우원숭이"},"pron":"them","h":"79cdb92ce3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, their tails are not only eye-catching but also play a key role in communication.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그들의 꼬리는 눈길을 끌 뿐만 아니라 의사소통에서 핵심적인 역할도 한다.","opts":["여우원숭이의 꼬리는 눈길을 끌 뿐만 아니라 의사소통에서도 중요한 역할을 한다.","여우원숭이의 꼬리는 눈에 띄지만 의사소통과는 관계가 없다.","여우원숭이의 꼬리는 눈에 띄지 않아서 의사소통에만 쓰인다.","여우원숭이는 꼬리 때문에 다른 동물과 소통하지 못한다."],"r":{"a":"1) 여우원숭이의 꼬리는 눈길을 끌 뿐만 아니라 의사소통에서도 중요한 역할을 한다.","ev":"3번 문장","s":[[3,"However, their tails are not only eye-catching but also play a key role in communication.","하지만 그들의 꼬리는 눈길을 끌 뿐만 아니라 의사소통에서 핵심적인 역할도 한다."]],"w":"3번의 not only A but also B는 ‘A뿐만 아니라 B도’라는 뜻. 꼬리가 eye-catching(눈길을 끄는) 것뿐 아니라 communication(의사소통)에서 key role(핵심 역할)도 한다는 내용.","c":1},"h":"641a785dac"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["여우원숭이는 꼬리를 오직 예뻐 보이려고만 쓴다.","꼬리는 여우원숭이에게 짝짓기 철에도 중요하다.","여우원숭이는 숲에 숨으려고 꼬리를 낮게 내린다.","여우원숭이는 마다가스카르의 추운 산에 산다."],"opts":["Lemurs use their tails only to look beautiful.","The tail is also important for lemurs during the mating season.","Lemurs hold their tails low to hide in the forest.","Lemurs live in the cold mountains of Madagascar."],"r":{"a":"2) The tail is also important for lemurs during the mating season. (꼬리는 여우원숭이에게 짝짓기 철에도 중요하다.)","ev":"1번, 3번, 4번, 9번 문장","s":[[1,"Ring-tailed lemurs live in the dry forests of Madagascar.","알락꼬리여우원숭이는 마다가스카르의 건조한 숲에 산다."],[3,"However, their tails are not only eye-catching but also play a key role in communication.","하지만 그들의 꼬리는 눈길을 끌 뿐만 아니라 의사소통에서 핵심적인 역할도 한다."],[4,"When lemurs move as a group, they hold their tails high like a flag.","여우원숭이가 무리를 지어 움직일 때, 그들은 꼬리를 깃발처럼 높이 든다."],[9,"Their tail is also important during the mating season.","그들의 꼬리는 짝짓기 철에도 중요하다."]],"w":"9번에서 꼬리는 짝짓기 철(the mating season)에도 중요하다고 함. 3번에서 꼬리는 의사소통에서 핵심 역할을 한다고 했고, 4번에서 꼬리를 깃발처럼 높이 든다고 했고, 1번에서 건조한 숲에 산다고 했으므로 나머지는 본문과 다름.","c":2},"h":"4c16eee1ce"},{"n":9,"t":"sum","q":"Lemurs use their tail (A) and scents to send clear (B) to each other.","ko":"여우원숭이는 꼬리 (A)와(과) 냄새로 서로에게 분명한 (B)을(를) 보낸다.","oko":["(A) 움직임 / (B) 신호","(A) 색깔 / (B) 신호","(A) 움직임 / (B) 실수","(A) 색깔 / (B) 실수","(A) 크기 / (B) 이름"],"opts":["(A) movements / (B) signals","(A) colors / (B) signals","(A) movements / (B) mistakes","(A) colors / (B) mistakes","(A) sizes / (B) names"],"r":{"a":"1) (A) movements / (B) signals ((A) 움직임 / (B) 신호)","ev":"11번 문장","s":[[11,"With these tail movements and scents, lemurs send clear signals and communicate in their own special way.","이러한 꼬리 움직임과 냄새로, 여우원숭이는 분명한 신호를 보내며 자기들만의 특별한 방식으로 의사소통한다."]],"w":"11번에서 여우원숭이는 꼬리 움직임(tail movements)과 냄새로 분명한 신호(clear signals)를 보낸다고 함. 그래서 (A)는 movements, (B)는 signals임.","c":1},"h":"442f309059"},{"n":10,"t":"fill","q":"This [A] them to show each other where to go and stay together, even in [B] grass.","ko":"이것은 그들이 [B] 풀 속에서도 서로에게 어디로 갈지 보여 주고 함께 머무는 것을 [A].","bko":{"allows":"가능하게 해 준다(allow의 3인칭 단수형)","tall":"키 큰","scent":"냄새","rivals":"라이벌들","health":"건강","season":"철, 계절"},"bank":["allows","tall","scent","rivals","health","season"],"r":{"a":"[A] allows (가능하게 해 준다(allow의 3인칭 단수형)), [B] tall (키 큰)","ev":"5번 문장","s":[[5,"This allows them to show each other where to go and stay together, even in tall grass.","이것은 그들이 키 큰 풀 속에서도 서로에게 어디로 갈지 보여 주고 함께 머물 수 있게 해 준다."]],"w":"5번에서 이것은 그들이 키 큰 풀 속에서도 서로에게 어디로 갈지 보여 주고 함께 머물 수 있게 해 준다(This allows them to ... even in tall grass)고 함. scent, rivals, health, season은 명사라 두 빈칸에 들어갈 수 없음.","c":null},"h":"c199822c2f"}]},{"u":2,"id":"b3-02-1","no":1,"ko":"소금 좀 주세요가 실례가 되는 나라","items":[{"n":1,"t":"tf","q":"In Egypt, asking for salt or pepper might give the impression that the food is not good enough.","ko":"이집트에서는 소금이나 후추를 달라고 하면 음식이 충분히 좋지 않다는 인상을 줄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"For these reasons, asking for extra seasoning, such as salt or pepper, might give the impression that the food isn’t good enough.","이러한 이유로, 소금이나 후추 같은 추가 양념을 요청하는 것은 음식이 충분히 좋지 않다는 인상을 줄 수 있다."]],"w":"8번에서 소금이나 후추 같은 추가 양념을 요청하면 음식이 충분히 좋지 않다는 인상을 줄 수 있다(might give the impression)고 함. 같은 내용이라 T.","c":"T"},"h":"8157efce6a"},{"n":2,"t":"tf","q":"In the United States, people often ask for some salt when their food is too salty.","ko":"미국에서는 음식이 너무 짤 때 종종 소금을 달라고 한다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"In the United States, people often ask for some salt when their food tastes a little bland.","미국에서는 사람들이 음식이 약간 싱겁게 느껴질 때 종종 소금을 달라고 한다."]],"w":"1번에서 미국 사람들은 음식이 약간 싱거울 때(a little bland) 소금을 달라고 함. 너무 짤 때가 아니므로 F.","c":"F"},"h":"3e5ce58437"},{"n":3,"t":"tf","q":"Many traditional Egyptian dishes follow recipes passed down for generations.","ko":"많은 이집트 전통 요리는 대대로 전해 내려온 조리법을 따른다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Many traditional dishes follow recipes passed down for generations, and families take great pride in them.","많은 전통 요리는 대대로 전해 내려온 조리법을 따르며, 가족들은 그것에 큰 자부심을 갖는다."]],"w":"6번에서 Many traditional dishes follow recipes passed down for generations라고 함. 같은 내용이라 T.","c":"T"},"h":"57615526e1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...when their food tastes a little bland.)","ko":"... 음식이 약간 싱겁게 느껴질 때","opts":["매운","뜨거운","신","싱거운"],"word":"bland","r":{"a":"4) 싱거운","ev":"1번 문장","s":[[1,"In the United States, people often ask for some salt when their food tastes a little bland.","미국에서는 사람들이 음식이 약간 싱겁게 느껴질 때 종종 소금을 달라고 한다."]],"w":"1번에서 음식이 bland해서 소금을 달라고 함. 소금을 더 넣고 싶을 때는 맛이 밋밋하고 싱거운 때. 매운, 신 음식에는 소금을 찾지 않음.","c":4},"h":"88f4dcd6a0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...families take great pride in them.)","ko":"... 가족들은 그것에 큰 자부심을 갖는다.","opts":["자부심","걱정","부끄러움","피로"],"word":"pride","r":{"a":"1) 자부심","ev":"6번 문장","s":[[6,"Many traditional dishes follow recipes passed down for generations, and families take great pride in them.","많은 전통 요리는 대대로 전해 내려온 조리법을 따르며, 가족들은 그것에 큰 자부심을 갖는다."]],"w":"6번에서 대대로 이어 온 조리법을 가족들이 소중히 여김. take great pride in은 ~을 매우 자랑스러워한다는 뜻이므로 pride = 자부심. 걱정이나 부끄러움은 전통 요리 이야기와 어울리지 않음.","c":1},"h":"0108c7e79e"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen a host prepares food, it is not just cooking.","ko":"밑줄 친 it이 가리키는 것은?","sko":"주인이 음식을 준비할 때, 그것은 단순한 요리가 아니다.","opts":["주인이 음식을 준비하는 것","이집트라는 나라","소금과 후추","손님이 식사에 초대받는 것"],"r":{"a":"1) 주인이 음식을 준비하는 것","ev":"4번 문장","s":[[4,"When a host prepares food, it is not just cooking.","주인이 음식을 준비할 때, 그것은 단순한 요리가 아니다."]],"w":"4번은 주인이 음식을 준비할 때 it은 단순한 요리가 아니라는 뜻. it은 바로 앞에서 말한 ‘주인이 음식을 준비하는 것(a host prepares food)’을 가리킴. 나라나 양념, 초대받는 일은 요리가 아니라서 오답.","c":1,"k":"it = 주인이 음식을 준비하는 것"},"pron":"it","h":"a6906f2676"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Hosts put a lot of time, effort, and skill into preparing these dishes to make the meal as perfect as possible.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"주인은 식사를 가능한 한 완벽하게 만들려고 이 요리들을 준비하는 데 많은 시간, 노력, 기술을 쏟는다.","opts":["주인은 식사를 최대한 완벽하게 하려고 요리에 시간과 노력과 기술을 많이 들인다.","주인은 식사 시간을 줄이려고 요리 기술을 사용한다.","손님은 완벽한 식사를 위해 시간과 노력을 들여야 한다.","주인은 요리가 서툴러서 완벽한 식사를 포기한다."],"r":{"a":"1) 주인은 식사를 최대한 완벽하게 하려고 요리에 시간과 노력과 기술을 많이 들인다.","ev":"7번 문장","s":[[7,"Hosts put a lot of time, effort, and skill into preparing these dishes to make the meal as perfect as possible.","주인은 식사를 가능한 한 완벽하게 만들려고 이 요리들을 준비하는 데 많은 시간, 노력, 기술을 쏟는다."]],"w":"put A into B는 B에 A를 쏟아 붓는다는 뜻, to make the meal as perfect as possible은 목적(식사를 가능한 한 완벽하게 하려고). 그래서 주인이 시간, 노력, 기술을 요리에 많이 쏟는다는 내용. 시간을 줄이거나 포기한다는 말은 없고, 이 일을 하는 사람은 손님이 아니라 주인.","c":1},"h":"267badac8a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["손님이 추가 양념을 요청하면 요리사는 상처받을 수 있다.","이집트에서는 손님이 식사 전에 소금을 가져가는 것이 예의이다.","이집트의 주인은 보통 손님에게 직접 요리를 하게 한다.","이집트 사람들은 손님을 저녁 식사에 초대하는 일이 없다."],"opts":["A cook may feel hurt when a guest asks for extra seasoning.","In Egypt, guests are expected to bring salt before the meal.","Egyptian hosts usually ask their guests to cook the meal.","In Egypt, people never invite guests to dinner."],"r":{"a":"1) A cook may feel hurt when a guest asks for extra seasoning. (손님이 추가 양념을 요청하면 요리사는 상처받을 수 있다.)","ev":"8~9번 문장","s":[[8,"For these reasons, asking for extra seasoning, such as salt or pepper, might give the impression that the food isn’t good enough.","이러한 이유로, 소금이나 후추 같은 추가 양념을 요청하는 것은 음식이 충분히 좋지 않다는 인상을 줄 수 있다."],[9,"The cook may feel hurt by such a request.","요리사는 그런 요청에 상처받을 수 있다."]],"w":"8~9번에서 소금이나 후추 같은 양념을 요청하면 음식이 충분히 좋지 않다는 인상을 줄 수 있고, 요리사가 그런 요청에 상처받을 수 있다고 함. 소금을 가져가야 한다는 내용이나 손님이 요리를 한다는 내용, 초대를 하지 않는다는 내용은 본문에 없음.","c":1},"h":"f76af2c50c"},{"n":9,"t":"sum","q":"In Egypt, guests should (A) the food as it is, because this is the best way to show their (B).","ko":"이집트에서 손님은 음식을 있는 그대로 (A) 한다. 이것이 (B)을(를) 표현하는 가장 좋은 방법이기 때문이다.","oko":["(A) 즐겨야 / (B) 감사","(A) 바꿔야 / (B) 감사","(A) 즐겨야 / (B) 분노","(A) 거절해야 / (B) 분노","(A) 바꿔야 / (B) 배고픔"],"opts":["(A) enjoy / (B) appreciation","(A) change / (B) appreciation","(A) enjoy / (B) anger","(A) refuse / (B) anger","(A) change / (B) hunger"],"r":{"a":"1) (A) enjoy / (B) appreciation ((A) 즐겨야 / (B) 감사)","ev":"10~11번 문장","s":[[10,"So, if you’re ever invited to dine in Egypt, enjoy the food as it is.","그러니 이집트에서 식사 초대를 받게 된다면, 음식을 있는 그대로 즐겨라."],[11,"It’s the best way to show your appreciation.","그것이 감사를 표현하는 가장 좋은 방법이다."]],"w":"10번에서 이집트에서 식사 초대를 받으면 음식을 있는 그대로 즐기라(enjoy the food as it is)고 하고, 11번에서 그것이 감사를 표현하는 가장 좋은 방법(the best way to show your appreciation)이라고 함.","c":1},"h":"83a20d68a4"},{"n":10,"t":"fill","q":"In Egypt, sharing a meal is an important act of [A], and preparing food is a sign of care and [B].","ko":"이집트에서 식사를 나누는 것은 [A]의 중요한 행위이고, 음식을 준비하는 것은 배려와 [B]의 표시이다.","bko":{"hospitality":"환대","respect":"존중","seasoning":"양념","mistake":"실수","recipes":"조리법","request":"요청"},"bank":["hospitality","respect","seasoning","mistake","recipes","request"],"r":{"a":"[A] hospitality, [B] respect","ev":"3~5번 문장","s":[[3,"In Egyptian culture, sharing a meal is an important act of hospitality.","이집트 문화에서 식사를 함께 나누는 것은 환대의 중요한 행위이다."],[4,"When a host prepares food, it is not just cooking.","주인이 음식을 준비할 때, 그것은 단순한 요리가 아니다."],[5,"It is a sign of care and respect.","그것은 배려와 존중의 표시이다."]],"w":"3번 sharing a meal is an important act of hospitality, 5번 It is a sign of care and respect에서 가져옴. seasoning, mistake는 1~2번과 8번에서 문제가 되는 말이고, recipes는 6번의 요리 이야기이고 request(요청)는 9번에 나오는 말이라 이 두 문장에 맞지 않음.","c":null},"h":"1297589439"}]},{"u":2,"id":"b3-02-2","no":2,"ko":"쓴 물이라 불린 음료가 신들의 선물이었다고?","items":[{"n":1,"t":"tf","q":"The Aztecs mixed crushed cocoa beans with water to make a chocolate drink.","ko":"아즈텍인들은 으깬 카카오 콩을 물과 섞어 초콜릿 음료를 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They crushed cocoa beans and mixed them with water to make it.","그들은 카카오 콩을 으깨어 물과 섞어 그것을 만들었다."]],"w":"3번에서 카카오 콩을 으깨어 물과 섞어(crushed cocoa beans and mixed them with water) 만든다고 함. 같은 내용이라 T. crushed는 crush(으깨다), mixed는 mix(섞다)의 과거형.","c":"T"},"h":"300f91540b"},{"n":2,"t":"tf","q":"Xocolatl means “sweet water.”","ko":"xocolatl은 ‘단 물’이라는 뜻이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It was called xocolatl, which means “bitter water.”","그것은 ‘쓴 물’이라는 뜻의 xocolatl이라고 불렸다."]],"w":"4번에서 xocolatl은 bitter water(쓴 물)라는 뜻. 단 물(sweet water)이 아니라서 F.","c":"F"},"h":"ac8ce06cdd"},{"n":3,"t":"tf","q":"Chocolate was served only at weddings.","ko":"초콜릿은 결혼식에서만 제공되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It was served at weddings, festivals, and religious ceremonies.","그것은 결혼식, 축제, 종교 의식에서 제공되었다."]],"w":"7번에서 초콜릿은 결혼식뿐 아니라 축제, 종교 의식에서도 제공되었다(weddings, festivals, and religious ceremonies). only가 틀려서 F.","c":"F"},"h":"460886b470"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They crushed cocoa beans and mixed them with water...)","ko":"그들은 카카오 콩을 으깨어 물과 섞었다...","opts":["심었다","으깼다","팔았다","구웠다"],"word":"crushed","r":{"a":"2) 으깼다","ev":"3번 문장","s":[[3,"They crushed cocoa beans and mixed them with water to make it.","그들은 카카오 콩을 으깨어 물과 섞어 그것을 만들었다."]],"w":"3번은 카카오 콩으로 음료를 만드는 순서. 콩을 으깬 뒤 물과 섞어야 마시는 초콜릿이 됨. crushed = 으깼다(crush 으깨다).","c":2},"h":"f3107f9192"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People drank chocolate to treat stomach problems, fevers, and tiredness.)","ko":"사람들은 배탈, 열, 피로를 치료하려고 초콜릿을 마셨다.","opts":["즐기다","요리하다","나누다","치료하다"],"word":"treat","r":{"a":"4) 치료하다","ev":"10번 문장","s":[[10,"People drank chocolate to treat stomach problems, fevers, and tiredness.","사람들은 배탈, 열, 피로를 치료하려고 초콜릿을 마셨다."]],"w":"10번은 9번의 ‘약으로 쓰였다’를 구체적으로 설명하는 문장. 배탈, 열, 피로를 고치려는 것이므로 treat = 치료하다(treat 치료하다). 즐기다나 나누다는 앞뒤 흐름에 맞지 않음.","c":4},"h":"7395464822"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSometimes, they mixed it with other things like honey or tree bark to make it work better.","ko":"밑줄 친 it이 가리키는 것은?","sko":"때때로 그들은 그것이 더 잘 듣게 하려고 꿀이나 나무껍질 같은 다른 것들과 섞었다.","opts":["초콜릿","꿀","나무껍질","물"],"r":{"a":"1) 초콜릿","ev":"11번 문장","s":[[11,"Sometimes, they mixed it with other things like honey or tree bark to make it work better.","때때로 그들은 그것이 더 잘 듣게 하려고 꿀이나 나무껍질 같은 다른 것들과 섞었다."]],"w":"11번은 때때로 it을 꿀이나 나무껍질 같은 다른 것들과 섞었다는 뜻. 꿀과 나무껍질은 섞는 재료이고, 섞이는 대상은 앞에서 계속 이야기한 초콜릿(chocolate)임.","c":1,"k":"it = 초콜릿"},"pron":"it","h":"8344aa1433"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For them, chocolate was part of their culture, their beliefs, and their daily life.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들에게 초콜릿은 문화, 믿음, 그리고 일상생활의 일부였다.","opts":["그들에게 초콜릿은 문화와 믿음, 일상생활의 일부였다.","그들은 초콜릿을 문화나 믿음과 상관없는 간식으로만 여겼다.","초콜릿은 그들의 일상생활에서 금지된 음식이었다.","그들은 자신들의 문화를 초콜릿으로 바꾸려고 했다."],"r":{"a":"1) 그들에게 초콜릿은 문화와 믿음, 일상생활의 일부였다.","ev":"13번 문장","s":[[13,"For them, chocolate was part of their culture, their beliefs, and their daily life.","그들에게 초콜릿은 문화, 믿음, 그리고 일상생활의 일부였다."]],"w":"13번의 For them은 ‘그들에게’(아즈텍인들에게)라는 뜻이고, part of는 ‘~의 일부’라는 뜻. 초콜릿이 문화, 믿음, 일상생활의 일부였다는 내용.","c":1},"h":"2da87880a5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["아즈텍인들은 1428년 이전에 멕시코 중부를 다스렸다.","초콜릿을 나누는 것은 존중과 우정을 보여 주었다.","초콜릿은 아무것도 더하지 않은 평범한 음료였다.","초콜릿은 어린이를 위한 간식일 뿐이었다."],"opts":["The Aztecs ruled central Mexico before 1428.","Sharing chocolate showed respect and friendship.","Chocolate was a plain drink with nothing added.","Chocolate was only a snack for children."],"r":{"a":"2) Sharing chocolate showed respect and friendship. (초콜릿을 나누는 것은 존중과 우정을 보여 주었다.)","ev":"1번, 5번, 7번, 8번 문장","s":[[1,"Did you know the Aztecs, who ruled central Mexico between 1428 and 1521 CE, were some of the world’s first chocolate lovers?","1428년부터 1521년 사이에 멕시코 중부를 다스린 아즈텍인들이 세계 최초의 초콜릿 애호가들이었다는 것을 알고 있었는가?"],[5,"Sometimes, they added spices like chili or vanilla to give it a special flavor.","때때로 그들은 특별한 맛을 내기 위해 칠리나 바닐라 같은 향신료를 넣었다."],[7,"It was served at weddings, festivals, and religious ceremonies.","그것은 결혼식, 축제, 종교 의식에서 제공되었다."],[8,"Sharing chocolate showed respect and friendship.","초콜릿을 나누는 것은 존중과 우정을 보여 주었다."]],"w":"8번에서 초콜릿을 나누는 것은 존중과 우정을 보여 주었다고 함. 1번에서 아즈텍인들은 1428년부터 1521년 사이에 멕시코 중부를 다스렸고, 5번에서 칠리나 바닐라 같은 향신료를 넣었고, 7번에서 여러 의식과 축제에서 제공되었으므로 나머지는 본문과 다름.","c":2},"h":"aaeb980476"},{"n":9,"t":"sum","q":"The Aztecs used chocolate as (A) and believed it was a gift from the (B).","ko":"아즈텍인들은 초콜릿을 (A)(으)로 썼고, 그것이 (B)의 선물이라고 믿었다.","oko":["(A) 약 / (B) 신들","(A) 장난감 / (B) 신들","(A) 약 / (B) 왕들","(A) 장난감 / (B) 왕들","(A) 옷 / (B) 동물들"],"opts":["(A) medicine / (B) gods","(A) toys / (B) gods","(A) medicine / (B) kings","(A) toys / (B) kings","(A) clothes / (B) animals"],"r":{"a":"1) (A) medicine / (B) gods ((A) 약 / (B) 신들)","ev":"9번, 12번 문장","s":[[9,"Chocolate was also used as medicine.","초콜릿은 약으로도 쓰였다."],[12,"The Aztecs believed chocolate was a gift from the gods with special powers.","아즈텍인들은 초콜릿이 특별한 힘을 가진 신들의 선물이라고 믿었다."]],"w":"9번에서 초콜릿은 약(medicine)으로도 쓰였고, 12번에서 아즈텍인들은 초콜릿이 신들(the gods)의 선물이라고 믿었음.","c":1},"h":"8e3b4b1670"},{"n":10,"t":"fill","q":"Sometimes, they added [A] like chili or vanilla to give it a special [B].","ko":"때때로 그들은 칠리나 바닐라 같은 [A]을(를) 넣어 그것에 특별한 [B]을(를) 더했다.","bko":{"spices":"향신료","flavor":"맛","mixed":"섞었다(mix의 과거)","served":"제공했다(serve의 과거)","believed":"믿었다(believe의 과거)","crushed":"으깼다(crush의 과거)"},"bank":["spices","flavor","mixed","served","believed","crushed"],"r":{"a":"[A] spices (향신료), [B] flavor (맛)","ev":"5번 문장","s":[[5,"Sometimes, they added spices like chili or vanilla to give it a special flavor.","때때로 그들은 특별한 맛을 내기 위해 칠리나 바닐라 같은 향신료를 넣었다."]],"w":"5번에서 때때로 특별한 맛(a special flavor)을 내기 위해 칠리나 바닐라 같은 향신료(spices)를 넣었다고 함. mixed, served, believed, crushed는 동사의 과거형이라 명사 자리에 들어갈 수 없음.","c":null},"h":"2cbe2969a3"}]},{"u":2,"id":"b3-02-3","no":3,"ko":"아마존 부족은 왜 숲속에 숨어 지낼까?","items":[{"n":1,"t":"tf","q":"Many outsiders rushed into the Amazon forest because the demand for rubber grew quickly.","ko":"고무에 대한 수요가 빠르게 늘어서 많은 외부인들이 아마존 숲으로 몰려들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"At the time, the demand for rubber grew quickly in Europe and the United States.","당시 유럽과 미국에서 고무에 대한 수요가 빠르게 늘었다."],[6,"As a result, many outsiders rushed into the forest.","그 결과, 많은 외부인들이 숲으로 몰려들었다."]],"w":"5번에서 고무 수요가 빠르게 늘었고, 6번에서 As a result(그 결과) 많은 외부인들이 숲으로 몰려들었다고 함. 원인과 결과가 맞게 연결되어 T.","c":"T"},"h":"cb86b24448"},{"n":2,"t":"tf","q":"After the suffering, many tribes moved out of the forest to live near outsiders.","ko":"고통을 겪은 뒤 많은 부족이 외부인들 가까이에서 살려고 숲 밖으로 나갔다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Because of the suffering, many tribes moved deeper into the forest and have stayed hidden ever since.","그 고통 때문에 많은 부족이 숲속 더 깊은 곳으로 옮겨 갔고 그 후로 줄곧 숨어 지내 왔다."]],"w":"10번에서 부족들은 고통 때문에 숲 밖이 아니라 숲속 더 깊은 곳(deeper into the forest)으로 옮겨 가 숨어 지냈음. 반대 방향이라 F. moved는 move(옮기다)의 과거형.","c":"F"},"h":"004319e9d0"},{"n":3,"t":"tf","q":"Today, everyone agrees that people should contact the tribes.","ko":"오늘날 모든 사람이 부족들과 접촉해야 한다는 데 동의한다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"Today, there are some attempts to contact these tribes.","오늘날 이 부족들과 접촉하려는 시도가 일부 있다."],[12,"However, some say they should be free to live in their own way.","하지만 일부는 그들이 자신들의 방식대로 살 자유가 있어야 한다고 말한다."]],"w":"11번에서 접촉하려는 시도가 일부(some attempts) 있다고 하고, 12번에서 일부는 그들이 자신들의 방식대로 살 자유가 있어야 한다고 말함. 모든 사람이 동의한다는 말은 틀려서 F.","c":"F"},"h":"8a3eacb620"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Why do they remain isolated?)","ko":"그들은 왜 고립된 채로 남아 있을까?","opts":["유명한","붐비는","고립된","부유한"],"word":"isolated","r":{"a":"3) 고립된","ev":"1번, 3번 문장","s":[[1,"Deep in the Amazon rainforest of Brazil, some tribes still live without contact with the outside world.","브라질의 아마존 열대우림 깊은 곳에서는 일부 부족이 여전히 바깥세상과 접촉 없이 살고 있다."],[3,"Why do they remain isolated?","그들은 왜 고립된 채로 남아 있을까?"]],"w":"1번에서 일부 부족은 바깥세상과 접촉 없이(without contact with the outside world) 산다고 함. 3번의 isolated는 그렇게 외따로 떨어진 상태. 붐비거나 유명하다는 뜻과는 반대.","c":3},"h":"85bd3e6cf7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (At the time, the demand for rubber grew quickly...)","ko":"당시 고무에 대한 수요가 빠르게 늘었다...","opts":["공급","수요","가격","거절"],"word":"demand","r":{"a":"2) 수요","ev":"5번 문장","s":[[5,"At the time, the demand for rubber grew quickly in Europe and the United States.","당시 유럽과 미국에서 고무에 대한 수요가 빠르게 늘었다."]],"w":"5번은 유럽과 미국에서 고무를 찾는 사람이 빠르게 늘었다는 내용. 그래서 6번의 As a result(그 결과) 외부인들이 몰려듦. demand = 수요(사려는 요구). 공급은 반대 방향의 말.","c":2},"h":"4cb95d8bb4"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nLocal tribes suddenly faced outsiders, and this changed their lives.","ko":"밑줄 친 this가 가리키는 것은?","sko":"지역 부족들은 갑자기 외부인들을 마주하게 되었고, 이것이 그들의 삶을 바꾸었다.","opts":["고무나무가 숲을 가득 채운 것","고무 수요가 빠르게 는 것","외부인들이 고무 농장을 지은 것","부족들이 갑자기 외부인들을 마주하게 된 것"],"r":{"a":"4) 부족들이 갑자기 외부인들을 마주하게 된 것","ev":"6~7번 문장","s":[[6,"As a result, many outsiders rushed into the forest.","그 결과, 많은 외부인들이 숲으로 몰려들었다."],[7,"Local tribes suddenly faced outsiders, and this changed their lives.","지역 부족들은 갑자기 외부인들을 마주하게 되었고, 이것이 그들의 삶을 바꾸었다."]],"w":"7번 문장 안에서 and 앞의 Local tribes suddenly faced outsiders가 this가 가리키는 내용. 6번에서 외부인이 몰려든 결과로 부족들이 그들을 마주하게 되었고, 그것이 삶을 바꿈. 고무나무나 수요는 더 앞의 원인임.","c":4},"h":"4a8c0d1c0f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Deep in the Amazon rainforest of Brazil, some tribes still live without contact with the outside world.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"브라질의 아마존 열대우림 깊은 곳에서는 일부 부족이 여전히 바깥세상과 접촉 없이 살고 있다.","opts":["브라질의 아마존 열대우림 깊은 곳에는 바깥세상과 접촉하지 않고 사는 부족들이 아직 있다.","아마존의 일부 부족은 바깥세상과 자주 교류하며 산다.","브라질의 모든 부족은 도시에서 산다.","아마존 열대우림의 부족들은 바깥세상과 막 접촉을 시작했다."],"r":{"a":"1) 브라질의 아마존 열대우림 깊은 곳에는 바깥세상과 접촉하지 않고 사는 부족들이 아직 있다.","ev":"1번 문장","s":[[1,"Deep in the Amazon rainforest of Brazil, some tribes still live without contact with the outside world.","브라질의 아마존 열대우림 깊은 곳에서는 일부 부족이 여전히 바깥세상과 접촉 없이 살고 있다."]],"w":"1번의 still은 ‘아직도’, without contact with the outside world는 ‘바깥세상과 접촉 없이’라는 뜻. 아마존 깊은 곳에는 아직도 바깥세상과 접촉하지 않고 사는 부족이 있다는 내용.","c":1},"h":"b0b2b9ef0c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["아와족과 코루보족은 브라질의 도시에서 산다.","1900년대 초 아마존에는 고무나무가 드물었다.","많은 지역 사람들이 고무 농장에서 일하도록 강요받았다.","부족들은 외부인을 만난 뒤 더 건강해졌다."],"opts":["The Awá and Korubo people live in the cities of Brazil.","Rubber trees were rare in the Amazon in the early 1900s.","Many local people were forced to work in rubber plantations.","The tribes became healthier after meeting outsiders."],"r":{"a":"3) Many local people were forced to work in rubber plantations.","ev":"1번, 4번, 8~9번 문장","s":[[1,"Deep in the Amazon rainforest of Brazil, some tribes still live without contact with the outside world.","브라질의 아마존 열대우림 깊은 곳에서는 일부 부족이 여전히 바깥세상과 접촉 없이 살고 있다."],[4,"In the early 1900s, the Amazon rainforest was full of rubber trees.","1900년대 초, 아마존 열대우림은 고무나무로 가득했다."],[8,"Many were taken and forced to work in rubber plantations.","많은 사람들이 붙잡혀 고무 농장에서 일하도록 강요받았다."],[9,"They also died from new diseases like colds and the flu.","그들은 또한 감기와 독감 같은 새로운 질병으로 죽었다."]],"w":"8번에서 Many were taken and forced to work in rubber plantations라고 함. 아와족과 코루보족은 열대우림 깊은 곳에 산다(1번), 1900년대 초 숲은 고무나무로 가득함(4번), 부족들은 새로운 질병으로 죽음(9번).","c":3},"h":"39c82d63be"},{"n":9,"t":"sum","q":"New (A) like colds and the flu killed many tribal people, and today there are some (B) to contact the tribes.","ko":"감기와 독감 같은 새로운 (A)이(가) 많은 부족민을 죽게 했고, 오늘날 부족들과 접촉하려는 (B)이(가) 일부 있다.","oko":["(A) 질병 / (B) 시도","(A) 질병 / (B) 일자리","(A) 동물 / (B) 시도","(A) 음식 / (B) 일자리","(A) 동물 / (B) 꿈"],"opts":["(A) diseases / (B) attempts","(A) diseases / (B) jobs","(A) animals / (B) attempts","(A) foods / (B) jobs","(A) animals / (B) dreams"],"r":{"a":"1) (A) diseases / (B) attempts ((A) 질병 / (B) 시도)","ev":"9번, 11번 문장","s":[[9,"They also died from new diseases like colds and the flu.","그들은 또한 감기와 독감 같은 새로운 질병으로 죽었다."],[11,"Today, there are some attempts to contact these tribes.","오늘날 이 부족들과 접촉하려는 시도가 일부 있다."]],"w":"9번에서 부족민들은 감기와 독감 같은 새로운 질병(new diseases)으로 죽었고, 11번에서 오늘날 이 부족들과 접촉하려는 시도(attempts)가 일부 있다고 함.","c":1},"h":"858d4c33c6"},{"n":10,"t":"fill","q":"With [A], they can continue their [B] lives in the forest.","ko":"[A]이(가) 있다면, 그들은 숲속에서 [B] 삶을 계속 이어 갈 수 있다.","bko":{"respect":"존중","peaceful":"평화로운","moved":"옮겨 갔다(move의 과거)","stayed":"머물렀다(stay의 과거)","rushed":"서둘러 갔다(rush의 과거)","faced":"마주했다(face의 과거)"},"bank":["respect","peaceful","moved","stayed","rushed","faced"],"r":{"a":"[A] respect (존중), [B] peaceful (평화로운)","ev":"13번 문장","s":[[13,"With respect, they can continue their peaceful lives in the forest.","존중이 있다면, 그들은 숲속에서 평화로운 삶을 계속 이어 갈 수 있다."]],"w":"13번에서 존중이 있다면(With respect) 그들은 숲속에서 평화로운(peaceful) 삶을 이어 갈 수 있다고 함. moved, stayed, rushed, faced는 동사의 과거형이라 두 빈칸에 들어갈 수 없음.","c":null},"h":"d88fe8e21f"}]},{"u":2,"id":"b3-02-4","no":4,"ko":"기니피그를 한 마리만 키우면 벌금?","items":[{"n":1,"t":"tf","q":"Switzerland has a law that bans keeping social animals alone.","ko":"스위스에는 사회적 동물을 혼자 키우는 것을 금지하는 법이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The country has a law that bans keeping social animals alone.","이 나라에는 사회적 동물을 혼자 키우는 것을 금지하는 법이 있다."]],"w":"2번 문장 The country has a law that bans keeping social animals alone과 같은 내용.","c":"T"},"h":"66caa62929"},{"n":2,"t":"tf","q":"In the wild, guinea pigs usually live alone.","ko":"야생에서 기니피그는 보통 혼자 산다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Guinea pigs, for example, live in groups of up to 10 in the wild.","예를 들어 기니피그는 야생에서 최대 10마리까지 무리를 지어 산다."]],"w":"6번에서 기니피그는 야생에서 최대 10마리까지 무리를 지어(in groups of up to 10) 산다고 함. 혼자 산다는 말은 반대라서 F.","c":"F"},"h":"408f376db5"},{"n":3,"t":"tf","q":"The Swiss government provides guidelines on cage size, exercise, and diet.","ko":"스위스 정부는 우리 크기, 운동, 식단에 대한 지침을 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The Swiss government also provides guidelines on cage size, exercise, and diet.","스위스 정부는 또한 우리 크기, 운동, 식단에 대한 지침도 제공한다."]],"w":"11번 문장 The Swiss government also provides guidelines on cage size, exercise, and diet와 같은 내용.","c":"T"},"h":"1b9cff95ba"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The country has a law that bans keeping social animals alone.)","ko":"이 나라에는 사회적 동물을 혼자 키우는 것을 금지하는 법이 있다.","opts":["허락하다","금지하다","권하다","돕다"],"word":"bans","r":{"a":"2) 금지하다","ev":"1~2번 문장","s":[[1,"In Switzerland, people cannot keep just one pet guinea pig.","스위스에서는 사람들이 기니피그를 한 마리만 키울 수 없다."],[2,"The country has a law that bans keeping social animals alone.","이 나라에는 사회적 동물을 혼자 키우는 것을 금지하는 법이 있다."]],"w":"1번에서 기니피그를 한 마리만 키울 수 없다고 했고, 2번의 법이 사회적 동물을 혼자 키우는 것을 ban한다는 뜻. 그래서 bans = 금지하다. 허락하거나 권한다면 1번과 반대.","c":2},"h":"137703b2a5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That’s why Switzerland requires owners to raise them in pairs or groups.)","ko":"그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다.","opts":["거절하다","빌려주다","잊다","요구하다"],"word":"requires","r":{"a":"4) 요구하다","ev":"9번 문장","s":[[9,"That’s why Switzerland requires owners to raise them in pairs or groups.","그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다."]],"w":"9번은 혼자 키우면 안 된다는 8번의 결과로, 주인에게 쌍이나 무리로 키우라고 요구한다는 뜻. 그래서 requires = 요구하다. 10번에서 지키지 않으면 벌금을 내야 한다고 한 것과도 이어짐.","c":4},"h":"5ee77d119a"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThat’s why Switzerland requires owners to raise them in pairs or groups.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다.","opts":["스위스 정부","주인들","반려 기니피그들","우리 크기와 운동 지침들"],"r":{"a":"3) 반려 기니피그들","ev":"8~9번 문장","s":[[8,"When pet guinea pigs are kept alone, they can become sad, stressed, or even sick.","반려 기니피그가 혼자 길러지면, 슬퍼하고 스트레스를 받거나 심지어 병이 날 수 있다."],[9,"That’s why Switzerland requires owners to raise them in pairs or groups.","그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다."]],"w":"9번 바로 앞 8번의 주어가 pet guinea pigs(반려 기니피그들). 주인들(owners)이 키우는 대상이 them. 스위스나 주인은 요구하고 키우는 쪽이라 them이 될 수 없음.","c":3},"h":"f4c0f0c20a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In Switzerland, animals clearly get the care they deserve.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"스위스에서는 동물들이 분명 마땅히 받아야 할 보살핌을 받는다.","opts":["스위스에서는 동물들이 마땅히 받아야 할 보살핌을 분명히 받는다.","스위스에서는 동물들이 보살핌을 거의 받지 못한다.","스위스에서는 주인들이 동물을 돌볼 기회를 얻기 어렵다.","스위스의 동물들은 받을 자격이 없는 보살핌까지 받는다."],"r":{"a":"1) 스위스에서는 동물들이 마땅히 받아야 할 보살핌을 분명히 받는다.","ev":"12번 문장","s":[[12,"In Switzerland, animals clearly get the care they deserve.","스위스에서는 동물들이 분명 마땅히 받아야 할 보살핌을 받는다."]],"w":"12번의 clearly는 ‘분명히’, the care they deserve는 ‘그들이 받을 자격이 있는 보살핌’이라는 뜻. 스위스에서는 동물들이 마땅히 받아야 할 보살핌을 분명히 받는다는 내용.","c":1},"h":"e6073aa142"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["기니피그는 몸짓 언어로만 의사소통한다.","스위스에서는 우리 지침을 지키면 기니피그를 혼자 키워도 된다.","스위스의 법은 기니피그에게만 적용된다.","혼자 길러진 기니피그는 슬퍼하고 스트레스를 받거나 병이 날 수 있다."],"opts":["Guinea pigs communicate only with body language.","In Switzerland, people can keep one guinea pig if they follow the cage guidelines.","The Swiss law applies only to guinea pigs.","Guinea pigs kept alone can become sad, stressed, or even sick."],"r":{"a":"4) Guinea pigs kept alone can become sad, stressed, or even sick.","ev":"5번, 7~9번 문장","s":[[5,"It applies to pets such as hamsters, guinea pigs, rats, parrots, and even some fish.","이 법은 햄스터, 기니피그, 쥐, 앵무새, 심지어 일부 물고기 같은 반려동물에 적용된다."],[7,"They communicate using body language and sounds.","그들은 몸짓과 소리로 의사소통한다."],[8,"When pet guinea pigs are kept alone, they can become sad, stressed, or even sick.","반려 기니피그가 혼자 길러지면, 슬퍼하고 스트레스를 받거나 심지어 병이 날 수 있다."],[9,"That’s why Switzerland requires owners to raise them in pairs or groups.","그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다."]],"w":"8번에서 혼자 길러지면 슬퍼하거나 스트레스를 받거나 병이 날 수 있다고 함. 의사소통은 몸짓과 소리 둘 다(7번), 법은 햄스터, 쥐, 앵무새 등에도 적용(5번), 혼자 키우는 것은 쌍이나 무리로 키우도록 요구하므로 금지(9번).","c":4},"h":"13b7ae725f"},{"n":9,"t":"sum","q":"The law applies to (A) such as hamsters, parrots, and even some (B).","ko":"이 법은 햄스터, 앵무새, 심지어 일부 (B) 같은 (A)에 적용된다.","oko":["(A) 반려동물 / (B) 물고기","(A) 반려동물 / (B) 나무","(A) 장난감 / (B) 물고기","(A) 장난감 / (B) 나무","(A) 음식 / (B) 나무"],"opts":["(A) pets / (B) fish","(A) pets / (B) trees","(A) toys / (B) fish","(A) toys / (B) trees","(A) foods / (B) trees"],"r":{"a":"1) (A) pets / (B) fish ((A) 반려동물 / (B) 물고기)","ev":"5번 문장","s":[[5,"It applies to pets such as hamsters, guinea pigs, rats, parrots, and even some fish.","이 법은 햄스터, 기니피그, 쥐, 앵무새, 심지어 일부 물고기 같은 반려동물에 적용된다."]],"w":"5번에서 이 법은 햄스터, 기니피그, 쥐, 앵무새, 심지어 일부 물고기(fish) 같은 반려동물(pets)에 적용된다고 함.","c":1},"h":"1eeb86ef3b"},{"n":10,"t":"fill","q":"If not, owners may pay a [A] or lose the [B] to keep their animals.","ko":"그렇지 않으면, 주인은 [A]을(를) 내거나 동물을 키울 [B]을(를) 잃을 수 있다.","bko":{"fine":"벌금","right":"권리","sad":"슬픈","sick":"아픈","raise":"기르다","requires":"요구한다(require의 3인칭 단수형)"},"bank":["fine","right","sad","sick","raise","requires"],"r":{"a":"[A] fine (벌금), [B] right (권리)","ev":"10번 문장","s":[[10,"If not, owners may pay a fine or lose the right to keep their animals.","그렇지 않으면, 주인은 벌금을 내거나 동물을 키울 권리를 잃을 수 있다."]],"w":"10번에서 그렇지 않으면 주인은 벌금(fine)을 내거나 동물을 키울 권리(right)를 잃을 수 있다고 함. sad, sick은 형용사, raise와 requires는 동사라 명사 자리에 들어갈 수 없음.","c":null},"h":"5a8da0eead"}]},{"u":3,"id":"b3-03-1","no":1,"ko":"828m 초고층이 바람에 꿈쩍 않는 비결은?","items":[{"n":1,"t":"tf","q":"At around 100 meters, the wind is stronger than it is near the ground.","ko":"약 100미터 높이에서는 바람이 지상 근처보다 더 강하다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"At around 100 meters, the wind is 1.5 times stronger than near the ground.","약 100미터 높이에서는 바람이 지상 근처보다 1.5배 더 강하다."]],"w":"2번 문장에 At around 100 meters, the wind is 1.5 times stronger than near the ground가 있음. 100미터 높이의 바람이 지상보다 1.5배 강하다는 내용과 일치.","c":"T"},"h":"2a0d9d38e2"},{"n":2,"t":"tf","q":"Each level of the Burj Khalifa is bigger than the one below.","ko":"부르즈 할리파의 각 층은 그 아래층보다 더 크다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Each level of the Burj Khalifa is smaller than the one below.","부르즈 할리파의 각 층은 그 아래층보다 더 작다."]],"w":"8번 문장은 각 층이 아래층보다 smaller(더 작다)라고 함. bigger(더 큰)라고 한 것은 반대임.","c":"F"},"h":"2328a10ff6"},{"n":3,"t":"tf","q":"The Burj Khalifa stays stable even in the strongest desert winds.","ko":"부르즈 할리파는 가장 강한 사막 바람 속에서도 안정적으로 서 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"Thanks to these designs, the Burj Khalifa remains stable even in the strongest desert winds.","이런 설계 덕분에 부르즈 할리파는 가장 강한 사막 바람 속에서도 안정적으로 서 있다."]],"w":"14번 문장에 remains stable even in the strongest desert winds가 있음. remain(계속 ~한 상태이다)은 '변함없이 안정적이다'라는 뜻이라 본문과 일치.","c":"T"},"h":"c08f4c6bd1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... and prevent them from striking the tower all at once.)","ko":"... 바람이 탑을 한꺼번에 때리는 것을 막아 준다","opts":["돕다","막다","보내다","늘리다"],"word":"prevent","r":{"a":"2) 막다","ev":"9번 문장","s":[[9,"These step-like shapes break up strong winds and prevent them from striking the tower all at once.","이런 계단 같은 모양은 강한 바람을 흩어 놓아, 바람이 탑을 한꺼번에 때리는 것을 막아 준다."]],"w":"9번 문장은 계단 모양이 바람을 흩어 놓고, 바람이 탑을 한꺼번에 때리지 못하게 한다는 내용. prevent A from -ing는 'A가 ~하지 못하게 막다'라는 뜻.","c":2},"h":"b43483099f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A thinner top has less area exposed to the wind, ...)","ko":"더 가는 꼭대기는 바람에 ... 면적이 더 적어서","opts":["숨겨진","덮인","높아진","노출된"],"word":"exposed","r":{"a":"4) 노출된","ev":"13번 문장","s":[[13,"A thinner top has less area exposed to the wind, so the wind puts less pressure on the building.","더 가는 꼭대기는 바람에 노출되는 면적이 더 적어서, 바람이 건물에 주는 압력이 더 작다."]],"w":"13번 문장은 꼭대기가 가늘면 바람을 맞는 면적이 줄어서 압력도 줄어든다는 내용. area exposed to the wind는 '바람에 드러난 면적'이므로 exposed = 노출된.","c":4},"h":"7430ba96fa"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis means building the tower in sections, like steps.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 탑을 계단처럼 여러 구간으로 나누어 짓는 것을 뜻한다.","opts":["셋백이라는 설계","바람이 점점 강해지는 것","탑의 높이가 828미터인 것","건축가들이 아이디어를 사용한 것"],"r":{"a":"1) 셋백이라는 설계","ev":"6~7번 문장","s":[[6,"One helpful design was a setback.","도움이 된 한 가지 설계는 셋백이었다."],[7,"This means building the tower in sections, like steps.","이것은 탑을 계단처럼 여러 구간으로 나누어 짓는 것을 뜻한다."]],"w":"6번에서 도움이 된 한 가지 설계가 셋백(setback)이라고 했고, 7번은 This가 탑을 계단처럼 여러 구간으로 나누어 짓는 것을 뜻한다고 설명함. This는 바로 앞에서 말한 셋백을 가리킴.","c":1,"k":"This = 셋백이라는 설계"},"pron":"This","h":"7cc2133acf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In addition to the setbacks, the tower becomes thinner toward the top.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"셋백 외에도 탑은 위로 갈수록 더 가늘어진다.","opts":["셋백이 있어서 탑이 위로 갈수록 가늘어진다.","셋백 말고도, 탑은 위로 갈수록 더 가늘어진다.","셋백 때문에 탑의 꼭대기가 더 넓어진다.","셋백을 없애고 나서 탑이 가늘어졌다."],"r":{"a":"2) 셋백 말고도, 탑은 위로 갈수록 더 가늘어진다.","ev":"11번 문장","s":[[11,"In addition to the setbacks, the tower becomes thinner toward the top.","셋백 외에도 탑은 위로 갈수록 더 가늘어진다."]],"w":"In addition to ~는 '~ 외에도'라는 뜻이라 셋백에 더해 또 다른 방법이 있다는 말. 가늘어지는 것은 셋백의 결과가 아니라 별도의 설계(12번: tapering)임.","c":2},"h":"3ff8cd9c6d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["지상 근처의 바람이 100미터 높이의 바람보다 1.5배 더 강하다.","셋백은 탑을 한 덩어리로 곧게 짓는 방식이다.","탑은 위로 갈수록 더 넓어진다.","두바이의 부르즈 할리파는 높이가 828미터이다."],"opts":["The wind near the ground is 1.5 times stronger than at 100 meters.","A setback means building the tower as one straight block.","The tower becomes wider toward the top.","The Burj Khalifa in Dubai is 828 meters tall."],"r":{"a":"4) The Burj Khalifa in Dubai is 828 meters tall. (두바이의 부르즈 할리파는 높이가 828미터이다.)","ev":"2~3, 7, 11번 문장","s":[[2,"At around 100 meters, the wind is 1.5 times stronger than near the ground.","약 100미터 높이에서는 바람이 지상 근처보다 1.5배 더 강하다."],[3,"But the Burj Khalifa in Dubai, which is 828 meters tall, stands still.","하지만 높이가 828미터인 두바이의 부르즈 할리파는 꿈쩍도 하지 않고 서 있다."],[7,"This means building the tower in sections, like steps.","이것은 탑을 계단처럼 여러 구간으로 나누어 짓는 것을 뜻한다."],[11,"In addition to the setbacks, the tower becomes thinner toward the top.","셋백 외에도 탑은 위로 갈수록 더 가늘어진다."]],"w":"3번에서 두바이의 부르즈 할리파는 높이가 828미터라고 함. 2번에서 바람은 지상 근처보다 100미터 높이에서 1.5배 더 강하고, 7번에서 셋백은 탑을 계단처럼 여러 구간으로 나누어 짓는 것이며, 11번에서 탑은 위로 갈수록 더 가늘어지므로 나머지는 본문과 다름.","c":4},"h":"c38f6e4e70"},{"n":9,"t":"sum","q":"Because of the step-like shapes, wind flows (A) around the (B).","ko":"계단 모양 덕분에 바람이 (B) 둘레를 (A) 흐른다.","oko":["(A) 부드럽게 / (B) 건물","(A) 시끄럽게 / (B) 건물","(A) 부드럽게 / (B) 사막","(A) 시끄럽게 / (B) 사막","(A) 느리게 / (B) 지면"],"opts":["(A) smoothly / (B) structure","(A) loudly / (B) structure","(A) smoothly / (B) desert","(A) loudly / (B) desert","(A) slowly / (B) ground"],"r":{"a":"1) (A) smoothly / (B) structure ((A) 부드럽게 / (B) 건물)","ev":"9~10번 문장","s":[[9,"These step-like shapes break up strong winds and prevent them from striking the tower all at once.","이런 계단 같은 모양은 강한 바람을 흩어 놓아, 바람이 탑을 한꺼번에 때리는 것을 막아 준다."],[10,"Instead, wind flows smoothly around the structure.","대신 바람은 건물 둘레를 따라 부드럽게 흐른다."]],"w":"9번에서 계단 같은 모양이 강한 바람을 흩어 놓는다고 했고, 10번에서 대신 바람은 건물(the structure) 둘레를 따라 부드럽게(smoothly) 흐른다고 함.","c":1},"h":"4decf7b4eb"},{"n":10,"t":"fill","q":"Architects used [A] ideas to [B] the strong winds.","ko":"건축가들은 강한 바람을 [B] 위해 [A] 아이디어를 사용했다.","bank":["smart","control","quickly","toward","during","because"],"bko":{"smart":"영리한","control":"통제하기","quickly":"빠르게","toward":"~쪽으로","during":"~하는 동안","because":"왜냐하면"},"r":{"a":"[A] smart (영리한), [B] control (통제하기)","ev":"5번 문장","s":[[5,"Architects used smart ideas to control the strong winds.","건축가들은 강한 바람을 막기 위해 영리한 아이디어를 사용했다."]],"w":"5번에서 건축가들은 강한 바람을 통제하기 위해 영리한 아이디어를 사용했다(used smart ideas to control the strong winds)고 함. quickly, toward, during, because는 부사·전치사·접속사라 두 빈칸에 들어갈 수 없음.","c":null},"h":"2ddc6f15aa"}]},{"u":3,"id":"b3-03-2","no":2,"ko":"집을 퍼즐처럼 조립한다고?","items":[{"n":1,"t":"tf","q":"Most parts of a modular house are made in a factory.","ko":"조립식 집의 대부분은 공장에서 만들어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"With this method, most parts of a house are made in a factory.","이 방법에서는 집의 대부분이 공장에서 만들어진다."]],"w":"4번 문장에 With this method, most parts of a house are made in a factory가 있음. 공장에서 대부분을 만든다는 내용과 일치.","c":"T"},"h":"04af0a0c36"},{"n":2,"t":"tf","q":"A module cannot be moved once it is built.","ko":"모듈은 한번 지어지면 옮길 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Each module can also be taken apart, moved, and reused in different places.","각 모듈은 분해하고, 옮기고, 다른 장소에서 다시 사용할 수도 있다."]],"w":"10번 문장은 each module can also be taken apart, moved, and reused(분해하고, 옮기고, 다시 쓸 수 있다)라고 함. 옮길 수 없다는 말은 반대임.","c":"F"},"h":"8764e06fe3"},{"n":3,"t":"tf","q":"In emergencies, modular buildings can quickly become shelters, clinics, or homes.","ko":"비상시에 조립식 건물은 빠르게 대피소, 진료소, 또는 집이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"In emergencies, they can quickly become shelters, clinics, or homes when time or space is limited.","비상시에는 시간이나 공간이 제한될 때 그 건물들이 빠르게 대피소, 진료소, 또는 집이 될 수 있다."]],"w":"9번 문장에 In emergencies, they can quickly become shelters, clinics, or homes가 있음. they는 8번의 미리 지어 둔 조립식 건물. 내용이 일치함.","c":"T"},"h":"fb2e96f239"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is faster and cheaper than traditional construction.)","ko":"이것은 ... 건설보다 더 빠르고 더 저렴하다","opts":["현대적인","임시의","전통적인","값비싼"],"word":"traditional","r":{"a":"3) 전통적인","ev":"6번 문장","s":[[6,"This is faster and cheaper than traditional construction.","이것은 전통적인 건설보다 더 빠르고 더 저렴하다."]],"w":"6번 문장은 조립식이 전통적인 건설 방식보다 빠르고 싸다는 내용. 조립식(새 방식)과 비교되는 옛날부터 해 온 방식이므로 traditional = 전통적인.","c":3},"h":"921716847a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... when time or space is limited.)","ko":"시간이나 공간이 ... 때","opts":["제한된","넉넉한","사라진","오래된"],"word":"limited","r":{"a":"1) 제한된","ev":"9번 문장","s":[[9,"In emergencies, they can quickly become shelters, clinics, or homes when time or space is limited.","비상시에는 시간이나 공간이 제한될 때 그 건물들이 빠르게 대피소, 진료소, 또는 집이 될 수 있다."]],"w":"9번 문장은 비상시, 곧 시간이나 공간이 부족한 상황. limited는 '한정된, 제한된'이라는 뜻으로 넉넉하다는 말과 반대.","c":1},"h":"e6b6148b77"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat’s the idea behind modular architecture.","ko":"밑줄 친 That이 가리키는 것은?","sko":"그것이 조립식 건축의 바탕이 되는 아이디어이다.","opts":["직소 퍼즐처럼 지을 수 있는 집","직소 퍼즐을 좋아하는 것","건축가를 구하는 것","공장에서 일하는 것"],"r":{"a":"1) 직소 퍼즐처럼 지을 수 있는 집","ev":"2~3번 문장","s":[[2,"Imagine a house that could be built like one.","직소 퍼즐처럼 지을 수 있는 집을 상상해 보라."],[3,"That’s the idea behind modular architecture.","그것이 조립식 건축의 바탕이 되는 아이디어이다."]],"w":"2번에서 직소 퍼즐처럼 지을 수 있는 집을 상상해 보라고 했고, 3번의 That은 그 아이디어를 가리킴. 3번은 그것이 조립식 건축(modular architecture)의 바탕이 되는 아이디어라는 뜻.","c":1,"k":"That = 직소 퍼즐처럼 지을 수 있는 집"},"pron":"That","h":"e7b683052a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This system sounds great, but it's not perfect.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 시스템은 훌륭하게 들리지만 완벽하지는 않다.","opts":["이 시스템은 소리가 커서 완벽하지 않다.","이 시스템은 훌륭해 보이지만 완벽하지는 않다.","이 시스템은 훌륭해서 고칠 곳이 전혀 없다.","이 시스템은 완벽하지만 좋게 들리지는 않는다."],"r":{"a":"2) 이 시스템은 훌륭해 보이지만 완벽하지는 않다.","ev":"11~12번 문장","s":[[11,"This system sounds great, but it’s not perfect.","이 시스템은 훌륭하게 들리지만 완벽하지는 않다."],[12,"It can be hard to move big parts, and you can’t always change the design.","큰 부품을 옮기기 어려울 수 있고, 설계를 항상 바꿀 수 있는 것도 아니다."]],"w":"sound great는 '훌륭하게 들린다(좋아 보인다)'는 뜻이고, but 뒤에 not perfect(완벽하지 않다)가 이어짐. 12번에서 단점(옮기기 어려움, 설계 변경 어려움)이 나오는 것으로 확인.","c":2},"h":"d967eb97ee"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["조립식 집의 대부분은 최종 현장에서 만들어진다.","조립식 건물은 전통적인 건물보다 더 비싸다.","일부 조립식 건물은 미리 지어 둔다.","조립식의 큰 부품은 옮기기 쉽다."],"opts":["Most parts of a modular house are built at the final site.","Modular buildings are more expensive than traditional ones.","Some modular buildings are built in advance.","Big modular parts are easy to move."],"r":{"a":"3) Some modular buildings are built in advance. (일부 조립식 건물은 미리 지어 둔다.)","ev":"4번, 6번, 8번, 12번 문장","s":[[4,"With this method, most parts of a house are made in a factory.","이 방법에서는 집의 대부분이 공장에서 만들어진다."],[6,"This is faster and cheaper than traditional construction.","이것은 전통적인 건설보다 더 빠르고 더 저렴하다."],[8,"Some modular buildings are built in advance.","일부 조립식 건물은 미리 지어 둔다."],[12,"It can be hard to move big parts, and you can’t always change the design.","큰 부품을 옮기기 어려울 수 있고, 설계를 항상 바꿀 수 있는 것도 아니다."]],"w":"8번에서 일부 조립식 건물은 미리 지어 둔다(built in advance)고 함. 4번에서 대부분의 부분이 공장에서 만들어지고, 6번에서 전통적인 건설보다 더 저렴하며, 12번에서 큰 부품은 옮기기 어려울 수 있으므로 나머지는 본문과 다름.","c":3},"h":"47280c1e7a"},{"n":9,"t":"sum","q":"Modular construction also helps when there aren’t enough (A) or when the (B) is bad.","ko":"조립식 건설은 (A)이(가) 충분하지 않을 때나 (B)이(가) 나쁠 때도 도움이 된다.","oko":["(A) 일할 사람 / (B) 날씨","(A) 일할 사람 / (B) 음식","(A) 방 / (B) 날씨","(A) 방 / (B) 음식","(A) 벽 / (B) 음악"],"opts":["(A) workers / (B) weather","(A) workers / (B) food","(A) rooms / (B) weather","(A) rooms / (B) food","(A) walls / (B) music"],"r":{"a":"1) (A) workers / (B) weather ((A) 일할 사람 / (B) 날씨)","ev":"7번 문장","s":[[7,"It also helps when there aren’t enough workers or when the weather is bad.","또 일할 사람이 충분하지 않을 때나 날씨가 나쁠 때도 도움이 된다."]],"w":"7번에서 조립식 건설은 일할 사람(workers)이 충분하지 않을 때나 날씨(the weather)가 나쁠 때도 도움이 된다고 함.","c":1},"h":"69681320fd"},{"n":10,"t":"fill","q":"Moving big parts can be [A], and the design cannot always be changed, but modular buildings are becoming more modern and [B].","ko":"큰 부품을 옮기는 일은 [A] 수 있고, 설계를 항상 바꿀 수도 없지만, 조립식 건물은 더 현대적이고 [B] 건물이 되어 가고 있다.","bank":["hard","flexible","quickly","traditional","factory","module"],"bko":{"hard":"어려울","flexible":"유연한","quickly":"빠르게","traditional":"전통적인","factory":"공장","module":"모듈(조립용 한 단위)"},"r":{"a":"[A] hard (어려울), [B] flexible (유연한)","ev":"12~13번 문장","s":[[12,"It can be hard to move big parts, and you can’t always change the design.","큰 부품을 옮기기 어려울 수 있고, 설계를 항상 바꿀 수 있는 것도 아니다."],[13,"But with new ideas and materials, modular buildings are becoming more modern and flexible.","하지만 새로운 아이디어와 재료 덕분에 조립식 건물은 더 현대적이고 유연해지고 있다."]],"w":"12번 문장 It can be hard to move big parts(큰 부품을 옮기기 어려울 수 있다), 13번 문장 modular buildings are becoming more modern and flexible. perfect는 11번에서 not perfect라고 해서 맞지 않음.","c":null},"h":"e6bf90435d"}]},{"u":3,"id":"b3-03-3","no":3,"ko":"배관을 밖으로 꺼낸 파리의 건물","items":[{"n":1,"t":"tf","q":"Georges Pompidou wanted a new kind of cultural space in Paris.","ko":"조르주 퐁피두는 파리에 새로운 종류의 문화 공간을 원했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In the late 1960s, French president Georges Pompidou wanted a new kind of cultural space in Paris.","1960년대 후반, 프랑스 대통령 조르주 퐁피두는 파리에 새로운 종류의 문화 공간을 원했다."]],"w":"1번 문장에 French president Georges Pompidou wanted a new kind of cultural space in Paris가 있음. 같은 내용이라 일치.","c":"T"},"h":"50e3ca38f8"},{"n":2,"t":"tf","q":"Builders hid the pipes, wires, and metal frames inside the building.","ko":"시공자들은 배관, 전선, 철제 뼈대를 건물 안에 숨겼다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Instead of hiding its pipes, wires, and metal frames, builders put them on the outside.","배관, 전선, 철제 뼈대를 숨기는 대신, 시공자들은 그것들을 바깥쪽에 두었다."]],"w":"4번 문장은 Instead of hiding(숨기는 대신) 그것들을 on the outside(바깥쪽에) 두었다고 함. 숨겼다는 것은 반대임.","c":"F"},"h":"1d7842b268"},{"n":3,"t":"tf","q":"The Centre Pompidou is one of the most famous cultural centers in the world.","ko":"퐁피두 센터는 세계에서 가장 유명한 문화 센터 중 하나이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"It is one of the most famous cultural centers in the world.","그곳은 세계에서 가장 유명한 문화 센터 중 하나이다."]],"w":"10번 문장에 It is one of the most famous cultural centers in the world가 있음. It은 퐁피두 센터. 내용이 일치함.","c":"T"},"h":"1289ab91af"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But today, the Centre Pompidou attracts millions of visitors each year.)","ko":"하지만 오늘날 퐁피두 센터는 해마다 수백만 명의 방문객을 ...","opts":["쫓아낸다","건설한다","끌어들인다","숨긴다"],"word":"attracts","r":{"a":"3) 끌어들인다","ev":"8~9번 문장","s":[[8,"At first, people were shocked by its strange look.","처음에는 사람들이 그 낯선 모습에 충격을 받았다."],[9,"But today, the Centre Pompidou attracts millions of visitors each year.","하지만 오늘날 퐁피두 센터는 해마다 수백만 명의 방문객을 끌어들인다."]],"w":"8번에서 처음에는 충격을 받았지만, 9번의 But 뒤에서 오늘날 수백만 방문객이 온다고 함. attract(끌어들이다)는 사람들이 찾아오게 만든다는 뜻.","c":3},"h":"b8aa868777"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The building's open spaces are used for exhibitions, concerts, ...)","ko":"건물의 트인 공간은 ..., 콘서트, ...에 쓰인다","opts":["수업","여행","공연 연습","전시회"],"word":"exhibitions","r":{"a":"4) 전시회","ev":"6번 문장","s":[[6,"The building’s open spaces are used for exhibitions, concerts, a huge library, and even Europe’s largest modern art museum.","건물의 트인 공간은 전시회, 콘서트, 거대한 도서관, 심지어 유럽에서 가장 큰 현대 미술관에 쓰인다."]],"w":"6번 문장은 트인 공간의 쓰임을 나열함. exhibitions는 미술품 등을 보여 주는 '전시회'이고, 뒤에 concerts, library, art museum이 이어지는 것과도 어울림.","c":4},"h":"dbcb2f32a0"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe architects wanted it to be a small cultural town where people could enjoy many activities in one place.","ko":"밑줄 친 it이 가리키는 것은?","sko":"건축가들은 그곳이 사람들이 한곳에서 많은 활동을 즐길 수 있는 작은 문화 도시가 되기를 바랐다.","opts":["프랑스 대통령","퐁피두 센터","거대한 도서관","콘서트"],"r":{"a":"2) 퐁피두 센터","ev":"3, 6~7번 문장","s":[[3,"Architects turned his dream into a unique building: the Centre Pompidou.","건축가들은 그의 꿈을 독특한 건물인 퐁피두 센터로 바꾸어 놓았다."],[6,"The building’s open spaces are used for exhibitions, concerts, a huge library, and even Europe’s largest modern art museum.","건물의 트인 공간은 전시회, 콘서트, 거대한 도서관, 심지어 유럽에서 가장 큰 현대 미술관에 쓰인다."],[7,"The architects wanted it to be a small cultural town where people could enjoy many activities in one place.","건축가들은 그곳이 사람들이 한곳에서 많은 활동을 즐길 수 있는 작은 문화 도시가 되기를 바랐다."]],"w":"3번에서 건축가들이 만든 건물이 Centre Pompidou이고, 6~7번이 이 건물의 공간을 설명함. 7번의 it은 건축가들이 작은 문화 도시처럼 만들고 싶어 한 그 건물.","c":2},"h":"a101905877"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This unusual “inside-out” design makes the interior open and flexible.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 독특한 '안팎이 뒤바뀐' 설계는 내부를 트이고 유연하게 만든다.","opts":["이 낯선 설계는 내부를 좁고 딱딱하게 만든다.","이 설계는 건물 바깥을 막아서 닫아 놓는다.","이 독특한 안팎이 뒤바뀐 설계는 내부를 트이고 유연하게 만든다.","이 설계는 안에 있는 것을 모두 숨겨 준다."],"r":{"a":"3) 이 독특한 안팎이 뒤바뀐 설계는 내부를 트이고 유연하게 만든다.","ev":"4~5번 문장","s":[[4,"Instead of hiding its pipes, wires, and metal frames, builders put them on the outside.","배관, 전선, 철제 뼈대를 숨기는 대신, 시공자들은 그것들을 바깥쪽에 두었다."],[5,"This unusual “inside-out” design makes the interior open and flexible.","이 독특한 '안팎이 뒤바뀐' 설계는 내부를 트이고 유연하게 만든다."]],"w":"5번의 make A open and flexible은 'A를 트이고 유연하게 만든다'는 뜻. 4번에서 숨기는 대신 바깥에 두었다고 했으니 숨겨 준다는 말은 반
