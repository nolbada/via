<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>중등내신 모음</title>
<style>
:root{--ink:#17202e;--sub:#5b6b68;--line:#cfd9d6;--pri:#0f766e;--bg:#f1f5f4}
body{margin:0;background:var(--bg);font-family:'Malgun Gothic','Apple SD Gothic Neo',sans-serif;color:var(--ink)}
.w{max-width:560px;margin:0 auto;padding:20px 16px 40px}
h1{font-size:22px;margin:6px 0 4px}.sub{color:var(--sub);font-size:13.5px;margin:0 0 16px}
h2{font-size:17px;margin:22px 0 4px}.ex{display:inline-block;background:#fee2e2;color:#991b1b;border:1px solid #dc2626;border-radius:99px;font-size:12.5px;font-weight:800;padding:2px 10px;margin:2px 0 8px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin:8px 0}
.card b{font-size:15.5px}.card .d{font-size:12.5px;color:var(--sub);margin:2px 0 8px}
.u{font:12.5px/1.4 ui-monospace,Menlo,Consolas,monospace;background:#eef3f2;border-radius:8px;padding:7px 9px;word-break:break-all;margin:6px 0}
.row{display:flex;gap:8px}.row a,.row button{flex:1;text-align:center;padding:9px 0;border-radius:10px;font:800 14px inherit;font-family:inherit;text-decoration:none;cursor:pointer}
.row a{background:var(--pri);color:#fff;border:0}.row button{background:#fff;color:var(--pri);border:1.5px solid var(--pri)}
.note{font-size:12.5px;color:var(--sub);line-height:1.6;margin-top:18px}
</style></head><body><div class="w">
<h1>중등내신 모음</h1><p class="sub">학생에게 보낼 링크 주소를 학교·학년별로 모아 둔 곳이에요. 주소 옆 [복사]를 누르면 카톡에 붙여 넣을 수 있어요.</p>

<h2>용아중 2학년 · 동아(윤)</h2><span class="ex">기말고사 12/9(수) ~ 12/11(금)</span>
<div id="list"></div>

<p class="note">· 오늘 할 본문은 주소 끝에 <b>&amp;today=1,2</b> 처럼 번호를 붙여 정해 줘요. (7과는 본문 1~4, 8과는 본문 1~6) 붙이지 않으면 전체가 보여요.<br>
· 학생 앱 안의 달력에는 시험 날짜가 빨간색으로 표시돼요.<br>
· 새 단원이 생기면 이 목록에 한 줄씩 더해요.</p>
</div>
<script>
var B='https://nolbada.github.io/via/mid/dongah-yun/';
var L=[
 ['7과 학생 앱','원문 · 답안지 · 오늘의 학습 (본문 ❶~❹)','l7/app/'],
 ['8과 학생 앱','원문 · 답안지 · 오늘의 학습 (본문 ❶~❻)','l8/app/'],
 ['8과 오늘의 학습 예시 (본문 1·2)','선생님이 오늘 할 본문을 정해 줄 때','l8/app/?tab=today&today=1,2'],
 ['7과 문장 분석 (기본·심화)','분석 앱 직접 열기','l7/'],
 ['8과 문장 분석 (기본·심화)','분석 앱 직접 열기','l8/']
];
document.getElementById('list').innerHTML=L.map(function(x,i){var u=B+x[2];return '<div class="card"><b>'+x[0]+'</b><div class="d">'+x[1]+'</div><div class="u">'+u+'</div><div class="row"><a href="'+u+'" target="_blank">열기</a><button data-i="'+i+'">복사</button></div></div>'}).join('');
document.addEventListener('click',function(e){var b=e.target.closest('button[data-i]');if(!b)return;var u=B+L[b.dataset.i][2];
 function ok(){b.textContent='복사했어요';setTimeout(function(){b.textContent='복사'},1500)}
 try{navigator.clipboard.writeText(u).then(ok,function(){fb()})}catch(x){fb()}
 function fb(){var t=document.createElement('textarea');t.value=u;document.body.appendChild(t);t.select();try{document.execCommand('copy');ok()}catch(x){}document.body.removeChild(t)}});
</script></body></html>
