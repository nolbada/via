<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211f;--sub:#5b6b67;--line:#dbe3e0;--a:#1f6f5c;--soft:#e3f2ee;--good:#16a34a;--bad:#dc2626;--hl:#fff1a8;--pen:#d97706}
html,body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:0 14px 90px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:8px}
.home{font-size:14px;font-weight:800;color:var(--a);text-decoration:none;padding:8px 10px;border-radius:10px;background:var(--soft)}
.ttl{font-size:16px;font-weight:900;flex:1}
.prog{font-size:13px;color:var(--sub);font-weight:700}
.tabs{display:flex;gap:6px;margin-top:8px;overflow-x:auto}
.tab{flex:1;min-width:64px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 4px;font-size:13px;font-weight:800;color:var(--sub);text-align:center;cursor:pointer}
.tab.on{background:var(--a);color:#fff;border-color:var(--a)}
.tab small{display:block;font-size:11px;font-weight:700;opacity:.85;margin-top:2px}
.nums{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0}
.nb{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--card);font-size:14px;font-weight:800;color:var(--ink);cursor:pointer}

.nb.ng{background:#fee2e2;border-color:#fca5a5}
.card{background:var(--card);border-radius:18px;border:1px solid var(--line);padding:18px 16px 20px;margin-top:10px}
.tag{display:inline-block;font-size:12px;font-weight:800;color:#fff;background:var(--a);border-radius:99px;padding:4px 10px}

.choices.two{grid-template-columns:repeat(2,1fr)}

.ans{margin-top:12px;font-size:19px;font-weight:900;line-height:1.5}

.hl{background:var(--hl);border-radius:4px;padding:0 3px}

.opt.me{background:linear-gradient(135deg,#fee2e2,#fff1f1);border-color:#fca5a5}

.opt.ok .bd{background:var(--good)}.opt.me .bd{background:var(--bad)}
.opt .en{font-size:16px;font-weight:900;padding-right:70px;line-height:1.5}
.opt .ko{font-size:14px;color:var(--sub);margin-top:2px}
.opt .rs{margin-top:8px;border-left:4px solid #94a3b8;padding-left:10px;font-size:14.5px;line-height:1.65;color:#334155;word-break:keep-all}
.opt.ok .rs{border-left-color:var(--good)}.opt.me .rs{border-left-color:var(--bad)}
.pen{margin-top:16px;border:2px solid #fcd9a8;background:#fffaf0;border-radius:14px;padding:12px 14px}
.pen .ph{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;color:var(--pen)}
.pen svg{width:22px;height:22px}
.pen .pt{margin-top:8px;font-size:17px;line-height:1.7;font-weight:700}
.pen .bl{display:inline-block;min-width:80px;border-bottom:3px solid var(--pen);text-align:center;color:transparent}
.pen .bl.show{color:var(--pen)}
.cn{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.cn a{font-size:14px;font-weight:800;color:var(--a);background:var(--soft);border-radius:10px;padding:10px 12px;text-decoration:none;display:inline-block}
.nav{display:flex;gap:8px;margin-top:14px}
.nav .btn{margin-top:0}
.meter{margin-top:8px;font-size:12px;color:var(--sub);font-weight:700}
.sum{margin-top:10px}
.sum h2{font-size:20px;margin-bottom:10px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:800}
.srow span{font-size:15px;color:var(--sub)}
.warn{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;font-size:16px;line-height:1.7;font-weight:700}
.note{font-size:13px;color:var(--sub);margin-top:14px;line-height:1.6}

: false, "why": "would rather 뒤에는 to부정사가 올 수 없고, than 뒤에도 -ing는 안 돼요."}, {"n": "④", "en": "go for – going", "ko": "산책하러 가다 – 낚시하러 가는 것", "ok": false, "why": "than 뒤에 -ing 모양을 써서 틀려요. 동사원형 go를 써야 해요."}, {"n": "⑤", "en": "going for – to go", "ko": "산책하러 가는 것 – 가려고", "ok": false, "why": "would rather 뒤에 -ing를 쓸 수 없고, than 뒤에 to부정사도 안 돼요."}], "pencil": "would rather와 than 뒤에는 모두 ___을 쓴다", "pencilKey": "동사원형", "page": 29, "sec": "s1"}, {"id": "S1-06", "step": 1, "no": 6, "qtype": "유형 01 had better / would rather", "type": "write", "ans": "You had better slow down because the road is slippery.", "concept": ["058", "013"], "gap": "", "words": [["slow down", "속도를 줄이다"], ["slippery", "미끄러운"], ["because", "~때문에"]], "h1": "우리말을 끊어 보세요. '너는 ~하는 게 좋겠다 / 속도를 줄이다 / 길이 미끄러우니'로 나뉘어요. 문장의 첫머리는 You예요.", "h2": "'~하는 게 좋겠다'는 had better 뒤에 동사원형을 써요. 이유를 말하는 because는 문장 뒤쪽에 붙이고, 그 뒤에 '주어 + 동사'를 써요.", "why": "You 다음에 had better와 동사원형 slow down(속도를 줄이다)을 쓰고, 이유를 because the road is slippery(길이 미끄러우니까)로 이어요.", "opts": [], "pencil": "'~하는 게 좋겠다'는 ___ better + 동사원형", "pencilKey": "had", "page": 29, "sec": "s1"}, {"id": "S1-07", "step": 1, "no": 7, "qtype": "유형 01 had better / would rather", "type": "write", "ans": "would rather stay", "concept": ["058-2", "013"], "gap": "", "words": [["stay", "머무르다"], ["go shopping", "쇼핑하러 가다"]], "h1": "우리말은 '쇼핑을 가느니 차라리 집에 있겠다'예요. 빈칸 뒤에 than이 있다는 것을 보세요.", "h2": "'~하느니 차라리 …하겠다'는 「would rather + 동사원형 + than + 동사원형」이에요. 괄호 안의 단어를 어떤 모양으로 써야 할지 생각해 보세요.", "why": "'B하느니 차라리 A하겠다'는 would rather A than B예요. A 자리에 동사원형 stay(머무르다)를 써요.", "opts": [], "pencil": "'차라리 A하겠다'는 would rather + ___", "pencilKey": "동사원형", "page": 29, "sec": "s1"}, {"id": "S1-08", "step": 1, "no": 8, "qtype": "유형 02 used to / would", "type": "mc", "ans": "④", "concept": ["058"], "gap": "", "words": [["favorite", "가장 좋아하는"], ["grape", "포도"]], "h1": "대화에서 now(지금)가 나오는 부분을 보세요. 과거와 지금이 어떻게 다른지 비교해 보세요.", "h2": "'예전에는 ~했는데 지금은 아니다'를 말할 때 쓰는 두 단어짜리 표현이 있어요. 뒤에는 동사원형이 와요.", "why": "예전에는 사과를 좋아했지만 지금은 포도를 좋아한다는 내용이라서 '~하곤 했다'의 used to가 알맞아요.", "opts": [{"n": "①", "en": "should", "ko": "~해야 한다", "ok": false, "why": "should like(좋아해야 한다)는 지금 포도를 좋아한다는 내용과 이어지지 않아요."}, {"n": "②", "en": "might", "ko": "~일지도 모른다", "ok": false, "why": "might like(좋아할지도 모른다)는 과거와 지금의 비교를 나타내지 못해요."}, {"n": "③", "en": "ought to", "ko": "~해야 한다", "ok": false, "why": "ought to(~해야 한다)는 의무라서 문맥에 맞지 않아요."}, {"n": "④", "en": "used to", "ko": "~하곤 했다", "ok": true, "why": "과거에 좋아했지만 지금은 아니라는 뜻을 나타내서 맞아요."}, {"n": "⑤", "en": "could", "ko": "~할 수 있었다", "ok": false, "why": "could like는 능력의 뜻이라서 과거의 습관과 달라요."}], "pencil": "과거에는 ~했지만 지금은 아니라는 뜻은 ___ to", "pencilKey": "used", "page": 29, "sec": "s1"}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 02 used to / would", "type": "mc", "ans": "③", "concept": ["058"], "gap": "", "words": [["computer game", "컴퓨터 게임"], ["a lot", "많이"]], "h1": "밑줄 친 used to가 '예전에 ~하곤 했다'라는 과거의 습관이라는 것을 먼저 확인하세요.", "h2": "과거의 습관은 used to 말고 또 다른 조동사로도 나타낼 수 있어요. 보기 중 '~하곤 했다'라는 뜻이 되는 것을 찾으세요.", "why": "과거의 습관을 나타내는 used to + 동사원형은 would + 동사원형으로 바꿔 쓸 수 있어요.", "opts": [{"n": "①", "en": "could", "ko": "~할 수 있었다", "ok": false, "why": "could는 능력의 뜻이라서 습관과 달라요."}, {"n": "②", "en": "might", "ko": "~일지도 모른다", "ok": false, "why": "might는 약한 추측의 뜻이에요."}, {"n": "③", "en": "would", "ko": "~하곤 했다", "ok": true, "why": "과거의 습관을 나타내서 used to와 바꿔 쓸 수 있어요."}, {"n": "④", "en": "should", "ko": "~해야 한다", "ok": false, "why": "should는 의무의 뜻이에요."}, {"n": "⑤", "en": "had to", "ko": "~해야 했다", "ok": false, "why": "had to는 과거의 의무라서 습관과 달라요."}], "pencil": "과거의 습관은 used to 대신 ___ + 동사원형도 가능", "pencilKey": "would", "page": 30, "sec": "s1"}, {"id": "S1-10", "step": 1, "no": 10, "qtype": "유형 02 used to / would", "type": "mc", "ans": "④", "concept": ["058"], "gap": "", "words": [["take a nap", "낮잠을 자다"], ["accept", "받아들이다"], ["mind", "꺼리다"]], "h1": "<보기>의 would는 'After lunch he would take a nap.'에서 어떤 뜻인지 먼저 해석해 보세요. 점심 먹은 후에 늘 그랬다는 뜻이에요.", "h2": "would에는 '~하곤 했다(과거의 습관)', '~할 것이다', '~해 주시겠어요?(정중한 부탁)' 같은 여러 뜻이 있어요. 문장마다 어떤 뜻인지 해석해서 비교해 보세요.", "why": "<보기>의 would는 '~하곤 했다'라는 과거의 습관이에요. 'Every morning we would take a walk'(우리는 매일 아침 산책하곤 했다)가 같아요.", "opts": [{"n": "①", "en": "Would you like a sandwich?", "ko": "샌드위치 드시겠어요?", "ok": false, "why": "정중하게 권하는 would라서 습관의 뜻과 달라요."}, {"n": "②", "en": "She asked me if I would help her.", "ko": "그녀는 내가 그녀를 도와줄지 물었다.", "ok": false, "why": "will의 과거형으로 쓰인 would예요. 습관이 아니에요."}, {"n": "③", "en": "He would be a fool to accept it.", "ko": "그가 그것을 받아들인다면 바보일 것이다.", "ok": false, "why": "가정하는 would(~일 것이다)라서 습관이 아니에요."}, {"n": "④", "en": "Every morning we would take a walk.", "ko": "우리는 매일 아침 산책하곤 했다.", "ok": true, "why": "'매일 아침'이라는 반복되는 일을 말해서 과거의 습관이에요."}, {"n": "⑤", "en": "Would you mind opening the window?", "ko": "창문을 좀 열어 주시겠어요?", "ok": false, "why": "정중하게 부탁하는 would라서 습관이 아니에요."}], "pencil": "과거의 습관을 나타내는 would는 '___'라고 해석한다", "pencilKey": "~하곤 했다", "page": 30, "sec": "s1"}, {"id": "S1-11", "step": 1, "no": 11, "qtype": "유형 02 used to / would", "type": "mc", "ans": "⑤", "concept": ["058", "026-H2"], "gap": "", "words": [["used to + 동사원형", "~하곤 했다, ~이었다"], ["be used to + 동사원형", "~하는 데 쓰이다"], ["floor", "바닥"]], "h1": "다섯 문장 모두 used to가 있어요. used 앞에 be동사(is)가 있는 문장이 있는지 찾아보세요.", "h2": "used to 앞에 be동사가 없으면 '~하곤 했다'이고, be동사가 있으면 '~하는 데 쓰이다' 같은 전혀 다른 뜻이에요. 해석해서 비교해 보세요.", "why": "⑤는 is used to로 '~하는 데 쓰인다'는 뜻이고, 나머지는 used to로 과거의 습관이나 상태를 나타내요.", "opts": [{"n": "①", "en": "I used to be a teacher.", "ko": "나는 예전에 교사였다.", "ok": false, "why": "과거의 상태를 나타내는 used to예요."}, {"n": "②", "en": "They used to be models.", "ko": "그들은 예전에 모델이었다.", "ok": false, "why": "과거의 상태를 나타내는 used to예요."}, {"n": "③", "en": "She used to get up early.", "ko": "그녀는 일찍 일어나곤 했다.", "ok": false, "why": "과거의 습관을 나타내는 used to예요."}, {"n": "④", "en": "He used to watch TV a lot.", "ko": "그는 TV를 많이 보곤 했다.", "ok": false, "why": "과거의 습관을 나타내는 used to예요."}, {"n": "⑤", "en": "It is used to clean the floor.", "ko": "그것은 바닥을 닦는 데 쓰인다.", "ok": true, "why": "be used to는 '~하는 데 y have feel bad.", "ko": "Jane은 기분이 나빴을지도 모른다.", "ok": false, "why": "have 뒤에는 feel(느끼다)이 아니라 과거분사 felt가 와야 해요."}, {"n": "②", "en": "He cannot have be rich.", "ko": "그는 부자였을 리가 없다.", "ok": false, "why": "have 뒤에는 be가 아니라 been이 와야 해요."}, {"n": "③", "en": "They might have seen us.", "ko": "그들이 우리를 봤을지도 모른다.", "ok": true, "why": "might have + 과거분사 seen(원형 see 보다)이라서 맞아요."}, {"n": "④", "en": "You should have ate lunch.", "ko": "너는 점심을 먹었어야 했다.", "ok": false, "why": "have 뒤에는 ate가 아니라 과거분사 eaten(원형 eat 먹다)이 와야 해요."}, {"n": "⑤", "en": "She must has seen the movie.", "ko": "그녀는 그 영화를 봤음에 틀림없다.", "ok": false, "why": "조동사 뒤에는 has가 아니라 have를 써야 해요."}], "pencil": "「조동사 + have」 뒤에는 동사의 ___를 쓴다", "pencilKey": "과거분사", "page": 30, "sec": "s1"}, {"id": "S1-17", "step": 1, "no": 17, "qtype": "유형 03 조동사 + have + p.p.", "type": "write", "ans": "must have been", "concept": ["059", "053"], "gap": "", "words": [["absent", "결석한"], ["sick", "아픈"]], "h1": "A의 질문은 '왜 Tom이 어제 결석했니?'예요. B는 이유를 추측해서 대답하고 있어요.", "h2": "결석한 이유로 '아팠음에 틀림없다'고 확신하는 말이에요. 괄호의 must 뒤에 이어질 두 부분을 생각해 보세요. 확신은 「조동사 + have + 과거분사」 모양이에요. be동사의 변화(am/is/are - was/were - ?)도 떠올려 보세요.", "why": "과거에 대한 확신은 must have p.p.로 말해요. be동사의 과거분사는 been이에요.", "opts": [], "pencil": "과거의 확신은 must have + ___", "pencilKey": "과거분사", "page": 30, "sec": "s1"}, {"id": "S1-18", "step": 1, "no": 18, "qtype": "유형 03 조동사 + have + p.p.", "type": "mc", "ans": "③", "concept": ["059"], "gap": "", "words": [["red card", "레드카드"], ["off the field", "경기장 밖으로"], ["fair", "공정한"]], "h1": "앞 문장을 읽어 보세요. 선수가 레드카드를 받고 경기장에서 나갔어요. 그렇다면 경기를 어떻게 했을지 생각해 보세요.", "h2": "과거에 대해 '~했을 리가 없다'라고 부정적으로 확신하는 표현을 떠올려 보세요. 레드카드는 공정하지 않은 행동 때문에 받아요.", "why": "레드카드를 받았으니 공정하게 경기했을 리가 없어요. 그래서 cannot have p.p.를 써요.", "opts": [{"n": "①", "en": "He must have played fair.", "ko": "그는 공정하게 경기했음에 틀림없다.", "ok": false, "why": "레드카드를 받았으니 반대 내용이라 어색해요."}, {"n": "②", "en": "He might have played fair.", "ko": "그는 공정하게 경기했을지도 모른다.", "ok": false, "why": "레드카드와 어울리지 않는 내용이에요."}, {"n": "③", " ], "h1": "문장에서 could have 바로 뒤의 동사 모양을 보세요.", "h2": "조동사 뒤에 have가 오면 그 뒤의 동사는 과거분사 모양이에요. come은 come - came - come으로 변하는 불규칙 동사예요.", "why": "could have 뒤에는 과거분사가 와야 해요. 원형 come(오다)의 과거분사는 come이라서 came을 come으로 고쳐요.", "opts": [], "pencil": "have 뒤에는 동사의 ___를 쓴다", "pencilKey": "과거분사", "page": 31, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 03 조동사 + have + p.p.", "type": "write", "ans": "must have practiced", "concept": ["059"], "gap": "", "words": [["contest", "대회"], ["practice", "연습하다"]], "h1": "A가 Jane이 대회에서 우승했다고 말했어요. 그렇다면 평소에 어떻게 했을지 짐작해 보세요.", "h2": "결과를 보고 '틀림없이 ~했을 것이다'라고 확신하는 표현이 있어요. 조동사 뒤에 have와 괄호 속 동사의 과거분사를 써요.", "why": "우승했으니 연습을 많이 했음에 틀림없어요. 과거의 확신은 must have p.p.로 써요.", "opts": [], "pencil": "과거의 확신은 must have + ___", "pencilKey": "과거분사", "page": 31, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "유형 01, 03 had better / would rather", "type": "mc", "ans": "②", "concept": ["058", "013"], "gap": "", "words": [["go out", "밖에 나가다"], ["often", "자주"], ["too", "너무"]], "h1": "우리말은 '너는 너무 자주 밖에 나가지 않는 것이 좋겠다'예요. 먼저 단어를 우리말 순서에 맞게 완성한 다음, 앞에서부터 네 번째 자리를 세어 보세요.", "h2": "문장의 뼈대는 「You + had better + (부정하는 말) + 동사원형」이에요. 부정하는 말이 어디에 들어가는지 생각하고, 뒤에 go out(밖에 나가다)과 too often(너무 자주)이 이어지는 순서를 확인하세요.", "why": "You had better not go out too often.에서 네 번째 단어는 not이에요.", "opts": [{"n": "①", "en": "go", "ko": "가다", "ok": false, "why": "go는 다섯 번째 단어예요."}, {"n": "②", "en": "not", "ko": "~않다", "ok": true, "why": "You(1) had(2) better(3) not(4)이라서 네 번째가 맞아요."}, {"n": "③", "en": "had", "ko": "~하다", "ok": false, "why": "had는 두 번째 단어예요."}, {"n": "④", "en": "out", "ko": "밖으로", "ok": false, "why": "out은 여섯 번째 단어예요."}, {"n": "⑤", "en": "better", "ko": "더 좋은", "ok": false, "why": "better는 세 번째 단어예요."}], "pencil": "'~하지 않는 게 좋겠다'는 had better ___ + 동사원형", "pencilKey": "not", "page": 32, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "유형 01 had better / would rather", "type": "mc", "ans": "⑤", "concept": ["058-2", "013"], "gap": "", "words": [ ook at his shabby clothes in the picture.(사진 속 그의 남루한 옷을 봐)를 읽어 보세요. 과거에 부자였는지 묻고 있어요.", "h2": "I don't think so(그렇게 생각하지 않는다)라는 말이 있으니 부정적인 확신을 쓰면 돼요. be동사의 과거분사도 확인하세요.", "why": "과거에 부자였을 리가 없다는 뜻이라서 cannot have been이 알맞아요.", "opts": [], "pencil": "'~이었을 리가 없다'는 cannot have ___", "pencilKey": "been", "page": 35, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "조동사로 같은 뜻 문장 쓰기", "type": "write", "ans": "I must have put down the address wrong.", "concept": ["059", "053"], "gap": "", "words": [["certain", "확실한"], ["put down", "적다"], ["wrong", "잘못"]], "h1": "원문은 'It is certain that I put down the address wrong.'이에요. 과거의 일을 확신하는 문장이에요.", "h2": "과거 사실에 대한 확신은 「조동사 + have + 과거분사」 모양으로 나타내요. put은 현재형, 과거형, 과거분사가 모두 같아요.", "why": "과거 사실에 대한 확신은 must have p.p.예요. put(놓다)은 과거분사도 put이에요.", "opts": [], "pencil": "과거의 확신은 must ___ p.p.", "pencilKey": "have", "page": 36, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "글에서 어색한 곳 모두 고치기", "type": "write", "ans": "There used to, I used to climb, read", "concept": ["058", "011"], "gap": "", "words": [["tall", "높은"], ["climb", "오르다"], ["under", "~ 아래"]], "h1": "글을 문장별로 읽으며 would와 used to가 쓰인 곳이 알맞은지 확인해 보세요. 고칠 곳은 세 군데예요.", "h2": "과거의 상태는 used to만 쓸 수 있고, '~하곤 했다'에는 used to + 동사원형을 써요. would 뒤에는 동사원형이 와요.", "why": "There used to be, I used to climb(원형 climb 오르다), would often read(원형 read 읽다)로 고쳐요.", "opts": [], "pencil": "과거의 상태는 There ___ to be", "pencilKey": "used", "page": 36, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "조건에 맞게 충고하는 문장 쓰기", "type": "write", "ans": "You had better not smoke. / You had better stop smoking.", "concept": ["058", "013"], "gap": "", "words": [["lung", "폐"], ["cough", "기침하다"], ["quit", "끊다"], ["advise", "충고하다"]], "h1": "폐가 나쁘고 기침을 하는 사람에게 의사가 하는 충고예요. 담배를 어떻게 하라고 할지 생각해 보세요.", "h2": "괄호 안에 had better가 있으니 「had better (not) + 동사원형」으로 써요. 두 가지 답이 가능해요.", "why": "담배를 끊는 게 좋다는 충고라서 You had better not smoke. 또는 You had better stop smoking.으로 써요.", "opts": [], "pencil": "충    var labs=d.opts.map(function(o){return o.n});
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[];
   h+='<div class="choices'+(labs.length===2?' two':'')+'">'+labs.map(function(l){return '<button class="ch" style="'+(multi&&sel.indexOf(l)>=0?'background:var(--soft);border-color:var(--a)':'')+'" onclick="'+(multi?'tog':'pick')+'(\''+d.id+'\',\''+l+'\')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+=multi?'<div class="meter">정답이 두 개예요. 모두 누른 뒤 확인을 눌러요</div><button class="btn p" onclick="confirmMulti(\''+d.id+'\')">확인</button>':'<div class="meter">책의 답을 골라 누르면 바로 확인돼요</div>';
  }else{
   h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div>';
   h+='<button class="btn p" onclick="showW(\''+d.id+'\')">정답 확인</button>';
  }
 }else{
  h+=answerView(d,r);
 }
 h+='</div>';
 h+='<div class="nav">'+(st.idx>0?'<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>':'')+'<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button></div>';
 app.innerHTML=h;
}
function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
