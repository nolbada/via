rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "There once was a lovely family with three children. The children were very close.", "ko": "옛날에 세 아이가 있는 사랑스러운 가족이 있었다. 아이들은 매우 가까웠다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "But as they got older, they slowly growed apart. One day, the parents called the children together.", "ko": "하지만 나이가 들면서, 그들은 서서히 사이가 멀어졌다. 어느 날, 부모님이 아이들을 함께 불렀다.", "ok": false, "foot": ["1apart (부) 떨어져, 사이가 멀어져"], "fixes": [{"wrong": "growed", "right": "grew", "partial": false, "at": [7], "point": "불규칙 동사 과거형: grow-grew-grown (growed는 잘못된 형태)", "topic": "불규칙 동사 과거형", "memo": "grow-grew-grown (growed는 잘못된 형태)"}]}, {"n": 3, "tag": null, "en": "“Do you remember this room? You use to play here. It were always filled with happiness,” said the father.", "ko": "“너희는 이 방을 기억하니? 너희가 여기서 놀곤 했잖니. 이곳은 항상 행복으로 가득 찼었지.”라고 아버지가 말했다.", "ok": false, "foot": [], "fixes": [{"wrong": "use", "right": "used", "partial": false, "at": [6], "point": "관용표현: '(과거에) ~하곤 했다'는 used to + 동사원형 (현재형 use to는 오류)", "topic": "관용표현", "memo": "'(과거에) ~하곤 했다'는 used to + 동사원형 (현재형 use to는 오류)"}, {"wrong": "were", "right": "was", "partial": false, "at": [11], "point": "수동태 수일치: 주어 It(단수)에 맞춰 be동사 was 사용", "topic": "수동태 수일치", "memo": "주어 It(단수)에 맞춰 be동사 was 사용"}]}, {"n": 4, "tag": null, "en": "The mother continued, “But now, you doesn’t even talk to each other. So, we made a puzzle for you.”", "ko": "어머니가 이어 말했다, “하지만 이제, 너희는 서로 대화조차 하지 않는구나. 그래서 우리는 너희를 위한 수수께끼 하나를 만들었단다.”", "ok": false, "foot": [], "fixes": [{"wrong": "doesn’t", "right": "don’t", "partial": false, "at": [6], "point": "수일치: 주어 you에는 do의 부정형 don't 사용 (doesn't는 3인칭 단수 주어 전용)", "topic": "수일치", "memo": "주어 you에는 do의 부정형 don't 사용 (doesn't는 3인칭 단수 주어 전용)"}]}, {"n": 5, "tag": null, "en": "“Here is three silver coins.”", "ko": "“여기 은화 세 개가 있어.”", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [1], "point": "도치구문 수일치: Here is/are 뒤에 오는 명사(coins, 복수)에 동사 수 일치", "topic": eads are gooder than one.”", "ko": "아버지가 대답했다, “만약 너희가 함께 한다면, 그것을 알아낼 수 있어. 세 명이 한 명보다 더 낫단다.”", "ok": false, "foot": [], "fixes": [{"wrong": "figure out it", "right": "figure it out", "partial": false, "at": [9], "point": "어순: 「동사+부사」 구동사 (figure out)의 목적어가 대명사(it)이면 동사와 부사 사이에 위치", "topic": "어순", "memo": "「동사+부사」 구동사 (figure out)의 목적어가 대명사(it)이면 동사와 부사 사이에 위치"}, {"wrong": "gooder", "right": "better", "partial": false, "at": [15], "point": "불규칙 비교급: good-better-best (gooder는 잘못된 형태)", "topic": "불규칙 비교급", "memo": "good-better-best (gooder는 잘못된 형태)"}]}, {"n": 11, "tag": null, "en": "Patrick, the middle child, shouted, “I know the answer!” He grabbed a silver coin and running out the door.", "ko": "둘째인 Patrick이 “난 답을 알아!”라고 소리쳤다. 그는 은화 한 개를 쥐고 문밖으로 달려 나갔다.", "ok": false, "foot": [], "fixes": [{"wrong": "running", "right": "ran", "partial": false, "at": [15], "point": "병렬구조: 등위접속사 and로 연결된 두 동사는 같은 형태(과거형) grabbed ~ and ran ~", "topic": "병렬구조", "memo": "등위접속사 and로 연결된 두 동사는 같은 형태(과거형) grabbed ~ and ran ~"}]}, {"n": 12, "tag": null, "en": "Patrick returned after he bought two bag of feathers from the market.", "ko": "Patrick은 시장에서 두 자루의 깃털을 산 후 돌아왔다.", "ok": false, "foot": [], "fixes": [{"wrong": "bag", "right": "bags", "partial": false, "at": [6], "point": "수일치: 수사 two 뒤에는 복수명사 bags 사용", "topic": "수일치", "memo": "수사 two 뒤에는 복수명사 bags 사용"}]}, {"n": 13, "tag": null, "en": "He begun to fill the room with feathers, but they bare covered the floor.", "ko": "그는 깃털로 방을 채우기 시작했지만, 깃털은 간신히 바닥을 덮었다.", "ok": false, "foot": [], "fixes": [{"wrong": "begun", "right": "began", "partial": false, "at": [1], "point": "동사변화: begin-began-begun. 조동사 없이 단독 과거동사로 쓸 때는 began 사용", "topic": "동사변화", "memo": "begin-began-begun. 조동사 없이 단독 과거동사로 쓸 때는 began 사용"}, {"wrong": "bare", "right": "barely", "partial": false, "at": [10], "point": "품사 혼동: 동사를 수식하는 부사 자리에는 barely 사용 (bare는 형용사)", "topic": "품사 혼동", "memo": "동사를 수식하는 부사 자리에는 barely 사용 (bare는 형용사)"}]}, {"n": 14, "tag": null, "en": "Ethan said to .”", 0], ["“Go to the market and buy something to fill this room completely.”", "“시장에 가서 이 방을 완전히 채울 무언가를 사렴.”", 0], ["“If you succeed, you will get a big reward.”", "“만약 너희가 성공한다면, 너희는 큰 보상을 받을 거야.”", 0], ["Ethan, the eldest child, said, “We will do our best.” The youngest of the family, Annie, was puzzled.", "첫째인 Ethan이 “우리는 최선을 다할게요.”라고 말했다. 가족의 막내인 Annie는 혼란스러웠다.", 0], ["“Three silver coins aren’t enough to fill this room!”", "“은화 세 개는 이 방을 채우기에 충분하지 않아요!”", 0], ["The father replied, “If you work together, you can figure it out. Three heads are better than one.”", "아버지가 대답했다, “만약 너희가 함께 한다면, 그것을 알아낼 수 있어. 세 명이 한 명보다 더 낫단다.”", 0], ["Patrick, the middle child, shouted, “I know the answer!” He grabbed a silver coin and ran out the door.", "둘째인 Patrick이 “난 답을 알아!”라고 소리쳤다. 그는 은화 한 개를 쥐고 문밖으로 달려 나갔다.", 0], ["Patrick returned after he bought two bags of feathers from the market.", "Patrick은 시장에서 두 자루의 깃털을 산 후 돌아왔다.", 0], ["He began to fill the room with feathers, but they barely covered the floor.", "그는 깃털로 방을 채우기 시작했지만, 깃털은 간신히 바닥을 덮었다.", 0], ["Ethan said to Patrick, “Why did you act on your own?” Patrick dropped his head.", "Ethan이 Patrick에게 말했다, “왜 너 혼자서 행동했니?” Patrick이 그의 머리를 떨구었다.", 0], ["“I’m sorry. I thought I knew the answer.” Annie sighed. “Now we only have two coins left.”", "“미안해. 나는 답을 안다고 생각했어.” Annie가 한숨을 쉬었다. “이제 우리에게는 동전 두 개만이 남았어.”", 0], ["The children went to the market together. Patrick had another idea.", "아이들은 함께 시장에 갔다. Patrick은 또 다른 아이디어가 있었다.", 0], ["“How about straw? It’s cheaper than feathers, but it takes up more space.”", "“짚은 어때? 그것은 깃털보다 더 싸지만, 더 많은 공간을 차지해.”", 0], ["Ethan said, “Great idea! But let’s only use one coin for now.”", "Ethan이 “좋은 생각이야! 하지만 지금은 동전 한 개만 사용하자.”라고 말했다.", 0], ["“Good thinking! That way, we can play it safe,” said Annie.", "“좋은 생각이다! 그런 식으로, 우리는 신중을 기할 수 있어.”라고 Annie가 말했다.", 0], ["Ethan continued, “If straw is not the answer, we will have one more chance with the last coin.”", "Ethan이 이어 말했다, “만약 짚이 답이 아니라면, 우리는 마지막 om completely.” “If you succeed, you will get a big reward.”", "Ethan, the eldest child, said, “We will do our best.” The youngest of the family, Annie, was puzzled. “Three silver coins aren’t enough to fill this room!” The father replied, “If you work together, you can figure it out. Three heads are better than one.” Patrick, the middle child, shouted, “I know the answer!” He grabbed a silver coin and ran out the door. Patrick returned after he bought two bags of feathers from the market. He began to fill the room with feathers, but they barely covered the floor. Ethan said to Patrick, “Why did you act on your own?” Patrick dropped his head. “I’m sorry. I thought I knew the answer.” Annie sighed. “Now we only have two coins left.”", "The children went to the market together. Patrick had another idea. “How about straw? It’s cheaper than feathers, but it takes up more space.” Ethan said, “Great idea! But let’s only use one coin for now.” “Good thinking! That way, we can play it safe,” said Annie. Ethan continued, “If straw is not the answer, we will have one more chance with the last coin.” They returned home with six bundles of straw. The straw came up to their knees, but it wasn’t enough.", "Ethan said, “We need to think differently. How about water?” Patrick said, “The water would just leak out of the room. Perhaps the answer isn’t something physical after all.” Annie yelled, “That’s it! I know the answer. Let’s go to the market again.”", "When they got back home, Annie took a candle out of her bag. The candle was lit by Patrick, and the entire room was filled with light. The mother yelled excitedly, “You solved the puzzle!” Now, they could see drawings on the wall. “Look! That’s us! Our family,” said Annie. Patrick said, “I remember these drawings. They were drawn by us when we were little.” Ethan turned to his parents. “Now I understand. The greatest reward in the world is my family.”"];var PASS_KO=["가족 수수께끼", "옛날에 세 아이가 있는 사랑스러운 가족이 있었다. 아이들은 매우 가까웠다. 하지만 나이가 들
