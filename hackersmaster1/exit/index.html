 우리는 그 당시에는 모든 것이 더 쉬웠다고 믿는 경향이 있는데, 특히 우리가 현재에 만족하지 못하는 경우 그러하다."]],"w":"여기 content는 ‘내용’이 아니라 형용사로 ‘만족하는’이에요. aren’t content with the present는 ‘현재에 만족하지 못한다’는 뜻이고, 그래서 과거가 더 쉬웠다고 믿기 쉬워요.","c":3},"h":"8858d9d179"},{"n":6,"t":"ref","q":"What does the underlined “they” refer to?\nThis trend leaves members of Generation Z aching for something that they never really lost.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이러한 추세는 Z세대 구성원들이 그들이 실제로 잃어버린 적이 없는 무언가에 대해 그리워하게 한다.","opts":["영화감독과 음악 제작자들","Z세대 구성원들","우리 이전 세대","엔터테인먼트 산업의 투자자들"],"r":{"a":"2) Z세대 구성원들","ev":"11번 문장","s":[[11,"This trend leaves members of Generation Z aching for something that they never really lost.","이러한 추세는 Z세대 구성원들이 그들이 실제로 잃어버린 적이 없는 무언가에 대해 그리워하게 한다."]],"w":"that they never really lost는 something을 꾸며서 ‘그들이 실제로 잃어버린 적 없는 것’이에요. 그리워하는 사람은 앞의 members of Generation Z(Z세대 구성원들)이므로 they는 이들이에요.","c":2},"h":"4e61fa3ed1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“This emotional longing for an era that we never experienced personally is called ‘anemoia.’”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리가 직접 경험하지 못한 시대를 향한 이러한 감정적인 갈망은 ‘아네모이아’라고 불린다.","opts":["우리가 직접 겪은 시대를 잊어버리는 감정을 ‘아네모이아’라고 부른다.","우리가 경험하지 못한 시대의 노래를 일부러 피하는 태도를 ‘아네모이아’라고 부른다.","우리가 직접 경험한 시대를 다시 살아 보고 싶어 하는 마음을 ‘아네모이아’라고 부른다.","우리가 직접 경험하지 못한 시대를 향한 감정적인 갈망을 ‘아네모이아’라고 부른다."],"r":{"a":"4) 우리가 직접 경험하지 못한 시대를 향한 감정적인 갈망을 ‘아네모이아’라고 부른다.","ev":"4번 문장","s":[[4,"This emotional longing for an era that we never experienced personally is called “anemoia.”","우리가 직접 경험하지 못한 시대를 향한 이러한 감정적인 갈망은 ‘아네모이아’라고 불린다."]],"w":"an era that we never experienced personally는 ‘우리가 직접 경험하지 못한 시대’이고, longing은 ‘갈망’이에요. 그래서 겪지 못한 시대를 향한 감정적인 갈망이 anemoia예요. 나머지는 잊어버린다, 피한다, 겪은 시대를 다시 살고 싶다는 뜻이라 달라요.","c":4},"h":"96d88ce7b7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아네모이아는 복고풍 노래를 듣는 것으로만 촉발된다.","매체는 이전 세대의 삶에 대한 매력 없는 모습을 보여 준다.","엔터테인먼트 산업은 그 편향을 이용해 작품의 상업적 매력을 높인다.","Riize의 가장 어린 멤버는 2004년 이전에 태어났다."],"opts":["Anemoia is triggered only by listening to retro songs.","The media shows us an unattractive picture of past generations’ lives.","The entertainment industry uses the bias to make its work more commercially appealing.","The youngest member of Riize was born before 2004."],"r":{"a":"3) The entertainment industry uses the bias to make its work more commercially appealing.","ev":"9번 문장","s":[[9,"The entertainment industry uses this cognitive bias to enhance its commercial appeal.","엔터테인먼트 산업은 상업적 매력을 높이기 위해 이러한 인지 편향을 이용한다."]],"w":"9번에서 엔터테인먼트 산업은 이 인지 편향을 이용해 상업적 매력을 높여요. 6번에서 촉발 원인은 노래뿐 아니라 영화와 사진도 있고, 7번에서 매체는 이상화된(매력적인) 모습을 보여 주고, 1번에서 가장 어린 멤버는 2004년생이에요.","c":3},"h":"c33efbc9a8"},{"n":9,"t":"sum","q":"We tend to believe that everything was (A) back then, especially when we are (B) with the present.","ko":"우리는 그 당시에는 모든 것이 (A) 상태였다고 믿는 경향이 있는데, 특히 현재에 (B) 때 그러하다.","oko":["(A) 더 어려운 / (B) 만족하는","(A) 더 어려운 / (B) 만족하지 못하는","(A) 더 쉬운 / (B) 만족하는","(A) 더 저렴한 / (B) 피곤한","(A) 더 쉬운 / (B) 만족하지 못하는"],"opts":["(A) harder / (B) satisfied","(A) harder / (B) unsatisfied","(A) easier / (B) satisfied","(A) cheaper / (B) tired","(A) easier / (B) unsatisfied"],"r":{"a":"5) (A) easier / (B) unsatisfied","ev":"8번 문장","s":[[8,"Faced with this curated content, we tend to believe that everything was easier back then, especially if we aren’t content with the present.","이러한 선별된 내용에 직면하면, 우리는 그 당시에는 모든 것이 더 쉬웠다고 믿는 경향이 있는데, 특히 우리가 현재에 만족하지 못하는 경우 그러하다."]],"w":"8번에서 모든 것이 더 쉬웠다(easier)고 믿는 경향이 있고, 특히 현재에 만족하지 못할(aren’t content = unsatisfied) 때 그래요. satisfied는 조건이 반대이고, harder는 믿는 내용이 반대예요.","c":5},"h":"652072036f"},{"n":10,"t":"fill","q":"This [A] is often triggered by viewing [B] films and photographs or listening to retro songs.","ko":"이 [A]은(는) 종종 [B] 영화와 사진을 보거나 복고풍의 노래를 듣는 것에 의해 촉발된다.","bank":["phenomenon","vintage","industry","era","cognitive","youngest"],"bko":{"phenomenon":"현상","vintage":"빈티지의","industry":"산업","era":"시대","cognitive":"인지의","youngest":"가장 어린"},"r":{"a":"[A] phenomenon (현상), [B] vintage (빈티지의)","ev":"6번 문장","s":[[6,"This phenomenon is often triggered by viewing vintage films and photographs or listening to retro songs.","이 현상은 종종 빈티지 영화와 사진을 보거나 복고풍의 노래를 들음으로써 촉발된다."]],"w":"6번에서 이 현상(phenomenon)은 종종 빈티지(vintage) 영화와 사진을 보거나 복고풍의 노래를 들음으로써 촉발된다고 해요. This 뒤에는 단수 명사, films 앞에는 형용사가 와야 해요.","c":null},"h":"e6ba52c95d"}]},{"u":3,"id":"ms1-03-4","no":4,"ko":"Freeze! Who Goes First?","items":[{"n":1,"t":"tf","q":"Hot water may freeze in less time than cold water.","ko":"뜨거운 물이 차가운 물보다 더 짧은 시간에 얼 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Hot water may freeze in less time than cold water!","뜨거운 물이 차가운 물보다 더 짧은 시간에 얼 수도 있다!"]],"w":"4번에서 뜨거운 물이 찬물보다 더 짧은 시간에 얼 수도 있다고 해요. 많은 사람이 예상하는 것과 반대여서 놀라운 사실이에요.","c":"T"},"h":"a12e45f923"},{"n":2,"t":"tf","q":"The Mpemba effect was first observed by a Tanzanian man in the 1860s.","ko":"음펨바 효과는 1860년대에 한 탄자니아 남성에 의해 처음 관찰되었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"This strange phenomenon was observed by a Tanzanian man named Erasto Mpemba in the 1960s, and it is now known as the Mpemba effect.","이 이상한 현상은 1960년대에 에라스토 음펨바라는 탄자니아의 남성에 의해 관찰되었으며, 그것은 현재 음펨바 효과로 알려져 있다."]],"w":"5번에서 Erasto Mpemba가 이 현상을 관찰한 때는 1960년대(the 1960s)예요. 1860년대가 아니에요.","c":"F"},"h":"c14503b21e"},{"n":3,"t":"tf","q":"Some critics argue that the container has nothing to do with the freezing rate of water.","ko":"일부 비평가들은 용기가 물이 어는 속도와 아무 관련이 없다고 주장한다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"Some critics argue that the water’s freezing rate depends on the purity of the water and the properties of the container that holds the water.","일부 비평가들은 물이 어는 속도는 물의 순도와 물을 담고 있는 용기의 속성들에 의존한다고 주장한다."]],"w":"14번에서 비평가들은 어는 속도가 물의 순도와 물을 담은 용기의 속성에 달려 있다고 주장해요. 용기가 관련 없다는 말은 반대예요.","c":"F"},"h":"def7b0115e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… acting as insulation and slowing down further cooling.)","ko":"… 단열재 역할을 하여 추가적인 냉각을 늦출 수 있다.","word":"insulation","opts":["촉매","연료","단열재","그릇"],"r":{"a":"3) 단열재","ev":"12번 문장","s":[[12,"Cold water, on the other hand, may form a thin layer of ice on the surface early on, acting as insulation and slowing down further cooling.","반면, 찬물은 초기에 얇은 얼음 층을 표면에 형성하는데, 이것이 단열재 역할을 하여 추가적인 냉각을 늦출 수 있다."]],"w":"insulation은 ‘단열재’예요. 표면의 얇은 얼음 층이 열이 빠져나가는 것을 막아 더 식는 것을 늦춘다는 흐름이에요.","c":3},"h":"2eec503250"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… the validity of the Mpemba effect is still debated among scientists.)","ko":"… 음펨바 효과의 타당성은 여전히 과학자들 사이에서 논쟁되고 있다.","word":"validity","opts":["타당성","발견자","인기","비용"],"r":{"a":"1) 타당성","ev":"13번 문장","s":[[13,"However, the validity of the Mpemba effect is still debated among scientists.","그러나, 음펨바 효과의 타당성은 여전히 과학자들 사이에서 논쟁되고 있다."]],"w":"validity는 ‘타당성’이에요. 음펨바 효과가 정말 맞는 설명인지 아직 논쟁 중이라는 뜻이에요.","c":1},"h":"effd773466"},{"n":6,"t":"ref","q":"What does the underlined “it” refer to?\nIn addition, hot water tends to circulate more actively due to convection, which helps it cool evenly throughout.","ko":"밑줄 친 it이 가리키는 것은?","sko":"또한 뜨거운 물은 대류로 인해 더 활발하게 순환하는 경향이 있는데, 이는 물이 전체적으로 고르게 식도록 도움을 준다.","opts":["대류","냉동고","용기","뜨거운 물"],"r":{"a":"4) 뜨거운 물","ev":"9번 문장","s":[[9,"In addition, hot water tends to circulate more actively due to convection, which helps it cool evenly throughout.","또한 뜨거운 물은 대류로 인해 더 활발하게 순환하는 경향이 있는데, 이는 물이 전체적으로 고르게 식도록 도움을 준다."]],"w":"which helps it cool evenly에서 고르게 식는 것은 앞에서 활발하게 순환한다고 한 주어 hot water(뜨거운 물)예요. 대류는 순환의 원인이고, 냉동고와 용기는 이 문장에서 식는 대상이 아니에요.","c":4},"h":"7bb8697f48"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Another factor is that hot water can heat the bottom of the container and melt any frost underneath.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"또 다른 요인은 뜨거운 물이 용기 바닥을 데워서 그 아래에 있는 모든 서리를 녹일 수 있다는 것이다.","opts":["또 다른 요인은 뜨거운 물이 용기 바닥을 데워 그 아래의 서리를 녹일 수 있다는 것이다.","또 다른 요인은 뜨거운 물이 용기 바닥을 얼려서 서리를 더 두껍게 만든다는 것이다.","또 다른 요인은 용기 바닥의 서리가 뜨거운 물을 더 빨리 식힌다는 것이다.","또 다른 요인은 뜨거운 물이 서리 때문에 용기 밖으로 새어 나간다는 것이다."],"r":{"a":"1) 또 다른 요인은 뜨거운 물이 용기 바닥을 데워 그 아래의 서리를 녹일 수 있다는 것이다.","ev":"10번 문장","s":[[10,"Another factor is that hot water can heat the bottom of the container and melt any frost underneath.","또 다른 요인은 뜨거운 물이 용기 바닥을 데워서 그 아래에 있는 모든 서리를 녹일 수 있다는 것이다."]],"w":"hot water can heat the bottom of the container and melt any frost underneath는 \"뜨거운 물이 용기 바닥을 데워 그 아래의 서리를 녹일 수 있다\"는 뜻이에요.","c":1},"h":"f7b527d8e1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["용기가 냉동고 표면에서 더 멀리 놓여서 열이 더 천천히 빠져나간다.","차가운 냉동고 표면이 녹아서 용기가 그 위에 뜬다.","용기가 차가운 냉동고 표면에 더 가깝게 놓일 수 있어서 열이 더 빨리 빠져나갈 수 있다.","서리가 냉동고를 덮고 있어서 열이 용기를 떠날 수 없다."],"opts":["The container sits farther from the freezer surface, so heat moves out more slowly.","The cold freezer surface melts, so the container floats on it.","The container can sit more closely on the cold freezer surface, so heat can move out more quickly.","Heat cannot leave the container because frost covers the freezer."],"r":{"a":"3) The container can sit more closely on the cold freezer surface, so heat can move out more quickly. (용기가 차가운 냉동고 표면에 더 가깝게 놓일 수 있어서 열이 더 빨리 빠져나갈 수 있다.)","ev":"11번 문장","s":[[11,"This lets the container sit more closely on the cold freezer surface, so heat can move out more quickly.","이것은 용기가 차가운 냉동고 표면에 더 가깝게 놓이도록 해서, 열이 더 빨리 빠져나갈 수 있다."]],"w":"11번에서 서리가 녹으면 용기가 차가운 냉동고 표면에 더 가깝게 놓이고, 그래서 열이 더 빨리 빠져나간다고 해요.","c":3},"h":"face6fe653"},{"n":9,"t":"sum","q":"The question seems (A), but the answer may (B) you.","ko":"그 질문은 (A) 보이지만, 그 답은 당신을 (B) 수도 있다.","oko":["(A) 어려워 / (B) 놀라게 할","(A) 뻔해 / (B) 놀라게 할","(A) 뻔해 / (B) 지루하게 할","(A) 이상해 / (B) 도울","(A) 위험해 / (B) 지치게 할"],"opts":["(A) difficult / (B) surprise","(A) straightforward / (B) surprise","(A) straightforward / (B) bore","(A) strange / (B) help","(A) dangerous / (B) tire"],"r":{"a":"2) (A) straightforward / (B) surprise ((A) 뻔해 / (B) 놀라게 할)","ev":"2~3번 문장","s":[[2,"It seems straightforward.","그것은 뻔해 보인다."],[3,"But the answer may surprise you.","그러나 그 답은 당신을 놀라게 할지도 모른다."]],"w":"2번에서 질문은 뻔해 보인다(seems straightforward)고 하고, 3번에서 그 답은 당신을 놀라게 할지도(may surprise you) 모른다고 해요.","c":2},"h":"dee04cfb89"},{"n":10,"t":"fill","q":"One possible [A] is that hot water [B] more quickly, reducing the total amount of water that needs to freeze.","ko":"한 가지 가능한 [A]은(는) 뜨거운 물이 더 빨리 [B], 얼어야 하는 물의 총량을 줄인다는 것이다.","bank":["explanation","evaporates","container","surface","debates","insulates"],"bko":{"explanation":"설명","evaporates":"증발하다","container":"용기","surface":"표면","debates":"논쟁하다","insulates":"단열하다"},"r":{"a":"[A] explanation (설명), [B] evaporates (증발하다)","ev":"7번 문장","s":[[7,"One possible explanation is that hot water evaporates more quickly, reducing the total amount of water that needs to freeze.","한 가지 가능한 설명은 뜨거운 물이 더 빨리 증발해서, 얼어야 하는 물의 총량을 줄인다는 것이다."]],"w":"7번에서 한 가지 가능한 설명(explanation)은 뜨거운 물이 더 빨리 증발해서(evaporates) 얼어야 하는 물의 총량을 줄인다는 것이라고 해요. is that 뒤 절의 동사 자리라서 evaporates가 맞아요.","c":null},"h":"3bbcbc1767"}]},{"u":4,"id":"ms1-04-1","no":1,"ko":"이열치열 대신 이음치음","items":[{"n":1,"t":"tf","q":"One of the two sound waves comes from the noise around you, and the other comes from the earphones.","ko":"두 개의 음파 중 하나는 당신 주변의 소음에서 오고, 다른 하나는 이어폰에서 온다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"One comes from the noise around you, and the other is from the noise-canceling earphones.","하나는 당신 주변의 소음으로부터 생겨나고, 다른 하나는 노이즈 캔슬링 이어폰으로부터 생겨난다."]],"w":"10번에서 One은 당신 주변의 소음에서, the other는 노이즈 캔슬링 이어폰에서 온다고 해요. 두 파의 출처가 그대로 맞아요.","c":"T"},"h":"2719e307c1"},{"n":2,"t":"tf","q":"Three sound waves are involved in the process of destructive interference.","ko":"상쇄 간섭의 과정에는 세 개의 음파가 관련되어 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"There are two sound waves involved in this process.","이 과정에는 두 개의 음파가 관련되어 있다."]],"w":"9번에서 이 과정에 관련된 음파는 two sound waves, 즉 두 개라고 해요. 세 개는 본문과 달라요.","c":"F"},"h":"6439d80410"},{"n":3,"t":"tf","q":"When the two opposite waves meet, they make the sound louder.","ko":"두 반대되는 파가 만나면 소리가 더 커진다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"When these two opposite waves meet, they cancel out each other, resulting in silence.","이 두 반대되는 파들이 만날 때, 그것들은 서로를 상쇄시키는데, 이는 정적을 초래한다."]],"w":"12번에서 두 반대 파가 만나면 서로를 상쇄시켜(cancel out each other) 정적(silence)이 된다고 해요. 소리가 커지는 것이 아니라 없어져요.","c":"F"},"h":"5ef5d75e60"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The city is full of noise, and you find it all so annoying!)","ko":"도시는 소음으로 가득하고, 당신은 그 모든 것이 매우 짜증난다고 생각한다.","opts":["편안한","신기한","짜증나는","자랑스러운"],"word":"annoying","r":{"a":"3) 짜증나는","ev":"5번 문장","s":[[5,"The city is full of noise, and you find it all so annoying!","도시는 소음으로 가득하고, 당신은 그 모든 것이 매우 짜증난다고 생각한다!"]],"w":"5번에서 도시가 소음으로 가득하다고 하고, 그 모든 것이 annoying하다고 느낀다고 해요. 6번에서 이어폰으로 소음을 없애는 이야기가 이어지므로 annoying은 '짜증나는'이에요.","c":3},"h":"e8c06d3dd0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Loud chatter fills the air.)","ko":"시끄러운 수다가 공기를 채운다.","opts":["수다, 떠드는 소리","정적","음악","발소리"],"word":"chatter","r":{"a":"1) 수다, 떠드는 소리","ev":"4번 문장","s":[[4,"Loud chatter fills the air.","시끄러운 수다가 공기를 채운다."]],"w":"4번은 Loud chatter(시끄러운 ○○)가 공기를 채운다고 해요. 3번의 Blah blah blah(중얼중얼)와 이어져서 사람들이 떠드는 소리, 즉 수다예요.","c":1},"h":"24f79a3fc0"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIt’s like two people are pushing on opposite sides of a door with equal force—nothing happens because they balance each other.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그것은 마치 두 사람이 같은 힘으로 문의 반대편에서 밀고 있는 것과 같은데, 그들이 서로 균형을 맞추기 때문에 아무 일도 일어나지 않는다.","opts":["두 개의 문","두 사람","두 개의 이어폰","두 개의 마이크"],"r":{"a":"2) 두 사람","ev":"13번 문장","s":[[13,"It’s like two people are pushing on opposite sides of a door with equal force—nothing happens because they balance each other.","그것은 마치 두 사람이 같은 힘으로 문의 반대편에서 밀고 있는 것과 같은데, 그들이 서로 균형을 맞추기 때문에 아무 일도 일어나지 않는다."]],"w":"because 뒤의 they는 앞에 나온 two people(두 사람)을 가리켜요. 두 사람이 같은 힘으로 마주 밀기 때문에 서로 균형을 맞추는 거예요.","c":2},"h":"ff5fd6e849"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The earphones use microphones to detect external sounds and then produce a new wave called anti-noise with the exact opposite pattern of the detected sound wave.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 이어폰들은 마이크를 사용하여 외부 소음을 감지한 다음, 감지된 음파의 정확히 반대 패턴을 가진 안티 노이즈라고 불리는 새로운 파를 생성한다.","opts":["이어폰은 바깥 소리를 그대로 크게 만들어 귀에 전달한다.","이어폰은 마이크로 안티 노이즈를 감지한 뒤 바깥 소리와 같은 파를 만든다.","이어폰은 새로운 파를 먼저 만든 뒤 마이크로 바깥 소리를 감지한다.","이어폰은 마이크로 바깥 소리를 감지한 뒤, 그 소리와 정확히 반대 패턴을 가진 새로운 파를 만든다."],"r":{"a":"4) 이어폰은 마이크로 바깥 소리를 감지한 뒤, 그 소리와 정확히 반대 패턴을 가진 새로운 파를 만든다.","ev":"11번 문장","s":[[11,"The earphones use microphones to detect external sounds and then produce a new wave called anti-noise with the exact opposite pattern of the detected sound wave.","그 이어폰들은 마이크를 사용하여 외부 소음을 감지한 다음, 감지된 음파의 정확히 반대 패턴을 가진 안티 노이즈라고 불리는 새로운 파를 생성한다."]],"w":"11번은 '감지(detect) → 그다음 생성(produce)' 순서예요. 만들어지는 anti-noise는 감지된 소리와 exact opposite(정확히 반대) 패턴이에요.","c":4},"h":"60265e183f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["상쇄 간섭은 시끄러운 환경을 더 시끄럽게 만든다.","정적은 주변에 소음이 전혀 없을 때만 가능하다.","노이즈 캔슬링 이어폰은 시끄러운 환경에서도 정적을 즐길 수 있게 해준다.","이어폰을 착용하고 있으면 정적을 즐길 수 없다."],"opts":["Destructive interference makes noisy surroundings even noisier.","Silence is possible only when there is no noise around you.","Noise-canceling earphones let you enjoy silence even in noisy surroundings.","People cannot enjoy silence while wearing earphones."],"r":{"a":"3) Noise-canceling earphones let you enjoy silence even in noisy surroundings.","ev":"14번 문장","s":[[14,"This canceling-out effect of destructive interference allows you to enjoy the silence even in noisy surroundings!","이러한 상쇄 간섭의 상쇄 효과는 당신이 시끄러운 환경에서도 정적을 즐길 수 있게 해준다."]],"w":"14번에서 상쇄 간섭의 효과가 당신이 시끄러운 환경(noisy surroundings)에서도 정적을 즐기게 해 준다고 해요. 나머지는 14번과 6번에 어긋나요.","c":3},"h":"020a520f3b"},{"n":9,"t":"sum","q":"Once you slip on your earphones, the noise (A) away, leaving you in a world of (B) silence.","ko":"이어폰을 착용하자마자 소음은 (A), 당신은 (B) 정적의 세상에 남는다.","oko":["(A) 사라진다 / (B) 평화로운","(A) 사라진다 / (B) 시끄러운","(A) 커진다 / (B) 평화로운","(A) 커진다 / (B) 시끄러운","(A) 커진다 / (B) 외로운"],"opts":["(A) fades / (B) peaceful","(A) fades / (B) noisy","(A) grows / (B) peaceful","(A) grows / (B) noisy","(A) grows / (B) lonely"],"r":{"a":"1) (A) fades / (B) peaceful ((A) 사라진다 / (B) 평화로운)","ev":"6번 문장","s":[[6,"But once you slip on your earphones, the noise fades away, leaving you in a world of peaceful silence.","그러나 당신이 이어폰을 착용하자마자, 그 소음은 사라지고, 이는 당신을 평화로운 정적의 세상에 있게 한다."]],"w":"6번에서 이어폰을 끼자마자 소음이 사라지고(fades away) 평화로운(peaceful) 정적의 세상에 있게 된다고 해요.","c":1},"h":"aa771c6b9f"},{"n":10,"t":"fill","q":"This is possible [A] to noise-canceling [B].","ko":"이것은 노이즈 캔슬링 [B] [A] 가능하다.","bank":["due","technology","opposite","similar","chatter","horns"],"bko":{"due":"~ 때문에","technology":"기술","opposite":"반대의","similar":"비슷한","chatter":"수다","horns":"경적들"},"r":{"a":"[A] due (~ 때문에), [B] technology (기술)","ev":"7번 문장","s":[[7,"This is possible due to noise-canceling technology.","이것은 노이즈 캔슬링 기술 때문에 가능하다."]],"w":"7번에서 이것은 노이즈 캔슬링 기술(technology) 때문에(due to) 가능하다고 해요. due to는 \"~ 때문에\"라는 표현이고, possible 뒤의 to와 함께 쓰여요.","c":null},"h":"f6da561c64"}]},{"u":4,"id":"ms1-04-2","no":2,"ko":"돌잔치 때 휴대폰 잡은 아이들","items":[{"n":1,"t":"tf","q":"Generation Alpha refers to people who were born between 2010 and about 2025.","ko":"알파세대는 2010년과 약 2025년 사이에 태어난 사람들을 가리킨다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Generation Alpha refers to those born between 2010 and approximately 2025.","알파세대는 2010년과 약 2025년 사이에 태어난 사람들을 지칭한다."]],"w":"3번에서 Generation Alpha는 2010년과 approximately 2025 사이에 태어난 사람들을 가리킨다고 해요. 본문과 맞아요.","c":"T"},"h":"1e76e04431"},{"n":2,"t":"tf","q":"Generation Alpha is the first generation born in the 20th century.","ko":"알파세대는 20세기에 태어난 첫 번째 세대이다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Welcome to the world of Generation Alpha, the first generation born entirely in the 21st century!","온전히 21세기에 태어난 첫 번째 세대인 알파세대의 세상에 온 것을 환영한다!"]],"w":"2번에서 알파세대는 the first generation born entirely in the 21st century, 즉 21세기에 태어난 첫 세대라고 해요. 20세기는 본문과 달라요.","c":"F"},"h":"9d4c7f68e1"},{"n":3,"t":"tf","q":"Generation Alpha gets information only from traditional media such as newspapers and TV news.","ko":"알파세대는 신문과 TV 뉴스 같은 전통적인 매체에서만 정보를 얻는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Instead of only being exposed to traditional media sources like newspapers and TV news, they communicate with digital communities and consume informative short-form content.","신문과 TV 뉴스와 같은 전통적인 언론 매체에만 노출되는 대신, 그들은 디지털 커뮤니티와 소통하고 유익한 숏폼 콘텐츠를 소비한다."]],"w":"8번은 Instead of only being exposed to traditional media(전통 매체에만 노출되는 대신)라고 하며, 디지털 커뮤니티와 소통하고 숏폼 콘텐츠를 소비한다고 해요. ‘전통 매체에서만’은 반대예요.","c":"F"},"h":"c5b091df51"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Their most distinctive characteristic compared to other generations is that they are true “digital natives.”)","ko":"다른 세대들과 비교했을 때 그들의 가장 두드러진 특성은 그들이 진정한 ‘디지털 원주민’이라는 것이다.","opts":["평범한","두드러진, 뚜렷한","숨겨진","부정적인"],"word":"distinctive","r":{"a":"2) 두드러진, 뚜렷한","ev":"4번 문장","s":[[4,"Their most distinctive characteristic compared to other generations is that they are true “digital natives.”","다른 세대들과 비교했을 때 그들의 가장 두드러진 특성은 그들이 진정한 ‘디지털 원주민’이라는 것이다."]],"w":"4번은 다른 세대들과 비교했을 때 알파세대만의 특성을 말해요. 다른 세대와 구별되는 것이므로 distinctive는 ‘두드러진’이에요.","c":2},"h":"73b6f4cdec"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Therefore, they are able to navigate digital environments with ease from a very young age.)","ko":"따라서 알파세대는 아주 어린 나이부터 디지털 환경을 손쉽게 다룰 수 있다.","opts":["능숙하게 다루다","피하다","새로 만들다","걱정하다"],"word":"navigate","r":{"a":"1) 능숙하게 다루다","ev":"6번 문장","s":[[6,"Therefore, they are able to navigate digital environments with ease from a very young age.","따라서 알파세대는 아주 어린 나이부터 디지털 환경을 손쉽게 다룰 수 있다."]],"w":"6번은 with ease(손쉽게)와 이어져요. 디지털 환경을 손쉽게 다루는 능력이므로 navigate digital environments는 ‘디지털 환경을 다루다’예요.","c":1},"h":"7be21810c8"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBy engaging with a wide range of viewpoints from a young age, members of Generation Alpha more openly talk about their views and cases of unfairness and gladly share them on social media to raise awareness and encourage action.","ko":"밑줄 친 them이 가리키는 것은?","sko":"어린 나이부터 광범위한 관점들로부터 배움으로써, 알파세대의 구성원들은 그들의 견해와 불공평한 사례들에 대해 더 솔직하게 말하며 인식을 높이고 행동을 장려하기 위해 그것들을 소셜 미디어에 기꺼이 공유한다.","opts":["알파세대의 구성원들","광범위한 관점들","그들의 견해와 불공평한 사례들","소셜 미디어 계정들"],"r":{"a":"3) 그들의 견해와 불공평한 사례들","ev":"10번 문장","s":[[10,"By engaging with a wide range of viewpoints from a young age, members of Generation Alpha more openly talk about their views and cases of unfairness and gladly share them on social media to raise awareness and encourage action.","어린 나이부터 광범위한 관점들로부터 배움으로써, 알파세대의 구성원들은 그들의 견해와 불공평한 사례들에 대해 더 솔직하게 말하며 인식을 높이고 행동을 장려하기 위해 그것들을 소셜 미디어에 기꺼이 공유한다."]],"w":"share them에서 them은 바로 앞 and로 이어진 talk about their views and cases of unfairness, 즉 자신들의 견해와 불공평한 사례들이에요. 소셜 미디어에 공유하는 것은 사람이 아니라 이야기하는 내용이에요.","c":3},"h":"49e47cfd12"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Through them, they can naturally develop clear opinions about what is going on in the world.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것들을 통해, 그들은 세상에 일어나고 있는 일들에 대한 명확한 의견들을 자연스럽게 발전시킬 수 있다.","opts":["그것들을 통해 알파세대는 세상에서 일어나는 일에 대한 분명한 의견을 자연스럽게 키울 수 있다.","그것들 때문에 알파세대는 세상에서 일어나는 일에 관심을 잃게 될 수 있다.","그것들을 통해 알파세대는 자기 의견을 숨기고 세상의 흐름을 따르게 된다.","알파세대는 세상에서 일어나는 일을 몰라도 자연스럽게 의견을 갖게 된다."],"r":{"a":"1) 그것들을 통해 알파세대는 세상에서 일어나는 일에 대한 분명한 의견을 자연스럽게 키울 수 있다.","ev":"9번 문장","s":[[9,"Through them, they can naturally develop clear opinions about what is going on in the world.","그것들을 통해, 그들은 세상에 일어나고 있는 일들에 대한 명확한 의견들을 자연스럽게 발전시킬 수 있다."]],"w":"clear opinions about what is going on in the world는 ‘세상에 일어나는 일에 대한 분명한 의견’이에요. can naturally develop은 ‘자연스럽게 키울 수 있다’는 뜻이에요.","c":1},"h":"69d44784ba"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["유아와 학생들은 스마트 음성 비서와 AI 챗봇을 피한다.","어린아이들은 스마트 음성 비서와 대화하고, 학생들은 AI 챗봇과 숙제를 한다.","학생들은 게임을 하기 위해서만 AI 챗봇을 사용한다.","유아들은 스마트 음성 비서를 사용할 수 없다."],"opts":["Toddlers and students avoid smart voice assistants and AI chatbots.","Young children talk with smart voice assistants, and students do homework with AI chatbots.","Students use AI chatbots only to play games.","Toddlers cannot use smart voice assistants."],"r":{"a":"2) Young children talk with smart voice assistants, and students do homework with AI chatbots. (어린아이들은 스마트 음성 비서와 대화하고, 학생들은 AI 챗봇과 숙제를 한다.)","ev":"1번 문장","s":[[1,"Toddlers chat with smart voice assistants, and students do homework with AI chatbots.","유아들은 스마트 음성 비서와 대화하고, 학생들은 AI 챗봇과 숙제를 한다."]],"w":"1번에서 유아들은 스마트 음성 비서와 대화하고(chat with) 학생들은 AI 챗봇과 숙제를 한다고 해요.","c":2},"h":"5f89572425"},{"n":9,"t":"sum","q":"As Generation Alpha grows older, their digital (A) and social awareness will likely help create important social (B).","ko":"알파세대가 나이가 들어감에 따라, 그들의 디지털 (A)와(과) 사회적 인식은 중요한 사회 (B)을(를) 만드는 데 도움이 될 가능성이 높다.","oko":["(A) 능숙도 / (B) 변화","(A) 능숙도 / (B) 거리","(A) 불안 / (B) 변화","(A) 거리 / (B) 압박","(A) 습관 / (B) 고립"],"opts":["(A) fluency / (B) change","(A) fluency / (B) distance","(A) anxiety / (B) change","(A) distance / (B) pressure","(A) habit / (B) isolation"],"r":{"a":"1) (A) fluency / (B) change ((A) 능숙도 / (B) 변화)","ev":"11번 문장","s":[[11,"As this generation grows older, their digital fluency and social awareness will likely help create important social change.","이 세대가 나이가 들어감에 따라, 그들의 디지털 유창성과 사회적 인식은 중요한 사회적 변화를 만드는 데 도움을 줄 가능성이 높다."]],"w":"11번에서 이 세대의 디지털 능숙도(digital fluency)와 사회적 인식이 중요한 사회적 변화(social change)를 만드는 데 도움이 될 가능성이 높다고 해요.","c":1},"h":"1652d7a8fe"},{"n":10,"t":"fill","q":"Generation Alpha has superior [A] to and [B] with digital devices and technologies like virtual assistants and AI.","ko":"알파세대는 가상 비서와 AI와 같은 디지털 기기와 기술에 대해 뛰어난 [A]와(과) [B]을(를) 가지고 있다.","bank":["access","proficiency","trouble","distance","opinion","source"],"bko":{"access":"접근(성)","proficiency":"능숙함","trouble":"어려움","distance":"거리","opinion":"의견","source":"출처"},"r":{"a":"[A] access, [B] proficiency","ev":"5번 문장","s":[[5,"Since they have grown up with digital technology from birth, Generation Alpha has superior access to and proficiency with digital devices and technologies like virtual assistants and AI.","그들은 태어날 때부터 디지털 기술과 함께 자라왔기 때문에, 알파세대는 가상 비서와 AI와 같은 디지털 기기와 기술에 대해 뛰어난 접근성과 능숙함을 가지고 있다."]],"w":"5번의 access to(~에 대한 접근)와 proficiency with(~에 대한 능숙함)가 알파세대의 장점이에요. 앞의 전치사 to, with와 짝이 맞는 말도 이 둘뿐이고, 나머지는 뜻이 맞지 않아요.","c":null},"h":"d04342c4a5"}]},{"u":4,"id":"ms1-04-3","no":3,"ko":"킁킁, 글씨 냄새 맡는 중입니다만?","items":[{"n":1,"t":"tf","q":"The word chocolate stimulates the brain regions responsible for smell and taste.","ko":"‘초콜릿’이라는 단어는 냄새와 맛을 담당하는 뇌의 영역을 자극한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"For instance, the word chocolate stimulates the primary olfactory cortex and the gustatory cortex, the regions of the brain responsible for processing smell and taste.","예를 들어, ‘초콜릿’이라는 단어는 냄새와 맛을 처리하는 것을 담당하는 뇌의 영역들인 1차 후각 피질과 미각 피질을 자극한다."]],"w":"6번에서 chocolate라는 단어는 후각 피질과 미각 피질, 즉 냄새와 맛을 처리하는 뇌의 영역들을 자극한다고 해요. 본문과 맞아요.","c":"T"},"h":"4d702aeae3"},{"n":2,"t":"tf","q":"Words associated with strong sensations activate sensory areas in a different way from our senses.","ko":"강한 감각과 연관된 단어들은 우리의 감각들과는 다른 방식으로 감각 영역을 활성화한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Researchers have discovered that words associated with strong sensations activate sensory areas just as our senses do.","연구자들은 강한 감각과 연관된 단어들이 우리의 감각들이 그러하듯 감각 영역들을 활성화시킨다는 것을 발견했다."]],"w":"5번에서 그 단어들은 감각 영역을 just as our senses do, 즉 우리의 감각들이 그러하듯 활성화한다고 해요. ‘다른 방식’은 본문과 반대예요.","c":"F"},"h":"4292f7f89d"},{"n":3,"t":"tf","q":"Embodied cognition is the idea that our thinking involves only emotional experiences.","ko":"체화된 인지는 우리의 사고가 오직 감정적 경험만을 포함한다는 개념이다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"This response is rooted in the brain’s embodied cognition, the idea that our thinking processes involve both sensory and emotional experiences.","이 반응은 뇌의 체화된 인지에 뿌리를 두고 있는데, 그것은 우리의 사고 과정이 감각적이고 감정적인 경험들을 모두 포함한다는 개념이다."]],"w":"9번은 사고 과정이 both sensory and emotional experiences, 즉 감각적 경험과 감정적 경험을 모두 포함한다고 해요. ‘감정적 경험만’은 틀려요.","c":"F"},"h":"d219e82832"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She wrapped herself in a warm blanket and took a sip of hot chocolate.)","ko":"그녀는 자신을 따뜻한 담요로 감쌌고 핫 초콜릿을 한 모금 마셨다.","opts":["감쌌다","벗었다","던졌다","접었다"],"word":"wrapped","r":{"a":"1) 감쌌다","ev":"1번 문장","s":[[1,"Read the following sentence: She wrapped herself in a warm blanket and took a sip of hot chocolate.","다음 문장을 읽어 보아라: 그녀는 자신을 따뜻한 담요로 감쌌고 핫 초콜릿을 한 모금 마셨다."]],"w":"1번은 warm blanket(따뜻한 담요)과 이어져요. 담요를 두르고 핫 초콜릿을 마시는 장면이므로 wrapped herself in은 ‘자신을 ~로 감쌌다’예요.","c":1},"h":"f604488305"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (What’s interesting is that activating those cortexes does more than simply enable us to recall specific sensations.)","ko":"흥미로운 것은 그러한 피질들을 활성화하는 것이 단순히 우리가 특정한 감각들을 떠올릴 수 있게 하는 것보다 더 많은 것을 한다는 것이다.","opts":["떠올리다","잊다","만들어 내다","억누르다"],"word":"recall","r":{"a":"1) 떠올리다","ev":"7번 문장","s":[[7,"What’s interesting is that activating those cortexes does more than simply enable us to recall specific sensations.","흥미로운 것은 그러한 피질들을 활성화하는 것이 단순히 우리가 특정한 감각들을 떠올릴 수 있게 하는 것보다 더 많은 것을 한다는 것이다."]],"w":"7번의 does more than simply enable us to recall ~은 ‘단순히 떠올리게 하는 것 이상’이라는 뜻이에요. 감각을 다시 불러오는 일이므로 recall은 ‘떠올리다’예요.","c":1},"h":"ba4bc56d09"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt actually helps us experience the characters’ situations and emotions, allowing us to develop greater empathy for them.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 우리가 등장인물들의 상황과 감정을 실제로 경험하도록 도와주어, 우리가 그들에게 더 큰 공감을 갖게 될 수 있게 한다.","opts":["초콜릿이라는 단어 하나","담요를 두른 사람","감각 피질들을 활성화하는 것","체화된 인지라는 개념"],"r":{"a":"3) 감각 피질들을 활성화하는 것","ev":"8번 문장","s":[[8,"It actually helps us experience the characters’ situations and emotions, allowing us to develop greater empathy for them.","그것은 우리가 등장인물들의 상황과 감정을 실제로 경험하도록 도와주어, 우리가 그들에게 더 큰 공감을 갖게 될 수 있게 한다."]],"w":"8번의 It은 바로 앞 7번의 주어인 activating those cortexes(그 피질들을 활성화하는 것)를 가리켜요. 그것이 등장인물의 상황과 감정을 경험하게 도와 공감을 키운다는 거예요.","c":3},"h":"f21a73bc8e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By engaging multiple sensory systems, it offers us a kind of second life, broadening our understanding of the world!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다양한 감각 체계들을 관여시킴으로써, 그것은 우리에게 일종의 두 번째 삶을 제공하여, 세상에 대한 우리의 이해를 넓혀준다!","opts":["여러 감각을 동시에 쓰면 독서가 어려워져서 세상을 이해하기 힘들어진다.","독서는 우리의 실제 삶을 두 번째로 미루게 만든다.","세상에 대한 이해가 넓어지면 여러 감각 체계를 쓰지 않게 된다.","여러 감각 체계를 쓰게 함으로써 독서는 우리에게 또 하나의 삶과 같은 경험을 주고 세상에 대한 이해를 넓혀 준다."],"r":{"a":"4) 여러 감각 체계를 쓰게 함으로써 독서는 우리에게 또 하나의 삶과 같은 경험을 주고 세상에 대한 이해를 넓혀 준다.","ev":"11번 문장","s":[[11,"By engaging multiple sensory systems, it offers us a kind of second life, broadening our understanding of the world!","다양한 감각 체계들을 관여시킴으로써, 그것은 우리에게 일종의 두 번째 삶을 제공하여, 세상에 대한 우리의 이해를 넓혀준다!"]],"w":"By engaging multiple sensory systems는 ‘여러 감각 체계를 관여시킴으로써’라는 방법이에요. a kind of second life는 일종의 두 번째 삶이고, broadening ~은 그 결과로 이해를 넓혀 준다는 뜻이에요.","c":4},"h":"c97a96008b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["신경 활성화는 우리 삶에서 독서의 중요성을 보여 준다.","독서는 뇌가 작동하는 방식에 거의 영향을 주지 않는다.","우리가 읽을 때 오직 하나의 감각 체계만 쓰인다.","체화된 인지는 감정과 아무 관련이 없다."],"opts":["Neural activation shows the importance of reading in our lives.","Reading has little effect on how the brain works.","Only one sensory system is used when we read.","Embodied cognition has nothing to do with emotions."],"r":{"a":"1) Neural activation shows the importance of reading in our lives.","ev":"10번 문장","s":[[10,"This neural activation highlights the importance of reading in our lives.","이러한 신경 활성화는 우리 삶에서 독서의 중요성을 강조한다."]],"w":"10번에서 이러한 신경 활성화가 우리 삶에서 독서의 중요성을 강조한다고 해요. 나머지는 4번, 11번(multiple sensory systems), 9번에 어긋나요.","c":1},"h":"03e447fa6d"},{"n":9,"t":"sum","q":"When we read about experiences, our brains can (A) neural (B) as if we were actually experiencing those sensations.","ko":"우리가 경험에 관해 읽을 때, 우리의 뇌는 마치 실제로 그러한 감각들을 경험하고 있는 것처럼 신경 (B)을(를) (A) 수 있다.","oko":["(A) 잊을 / (B) 경로","(A) 활성화할 / (B) 경로","(A) 활성화할 / (B) 농담","(A) 막을 / (B) 경로","(A) 잊을 / (B) 규칙"],"opts":["(A) forget / (B) pathways","(A) trigger / (B) pathways","(A) trigger / (B) jokes","(A) block / (B) pathways","(A) forget / (B) rules"],"r":{"a":"2) (A) trigger / (B) pathways ((A) 활성화할 / (B) 경로)","ev":"4번 문장","s":[[4,"This phenomenon is the result of a fascinating aspect of cognitive neuroscience: when we read about experiences, our brains can trigger neural pathways as if we were actually experiencing those sensations.","이 현상은 인지 신경과학의 흥미로운 면에서 비롯된 결과인데, 우리가 경험에 관해 읽을 때, 우리의 뇌는 우리가 마치 실제로 그러한 감각들을 경험하고 있는 것처럼 신경 경로들을 활성화할 수 있다는 것이다."]],"w":"4번에서 우리가 경험에 관해 읽을 때 뇌는 실제로 경험하는 것처럼 신경 경로(neural pathways)를 활성화할(trigger) 수 있다고 해요.","c":2},"h":"ae92a63788"},{"n":10,"t":"fill","q":"Did you feel the [A] of the blanket and smell the rich [B] of the hot chocolate while you read it?","ko":"당신은 이것을 읽는 동안 담요의 [A]을(를) 느끼고 핫 초콜릿의 진한 [B]을(를) 맡았는가?","bank":["thickness","aroma","sip","cortex","empathy","region"],"bko":{"thickness":"두께","aroma":"향","sip":"한 모금","cortex":"피질","empathy":"공감","region":"영역"},"r":{"a":"[A] thickness, [B] aroma","ev":"2번 문장","s":[[2,"Did you feel the thickness of the blanket and smell the rich aroma of the hot chocolate while you read it?","당신은 이것을 읽는 동안 담요의 두께를 느끼고 핫 초콜릿의 진한 향을 맡았는가?"]],"w":"2번에서 담요의 두께(thickness)를 느끼고 핫 초콜릿의 진한 향(aroma)을 맡았는지 물어요. feel과 smell의 목적어 자리라서 느끼거나 맡을 수 있는 말이 와야 해요.","c":null},"h":"cbfea72889"}]},{"u":4,"id":"ms1-04-4","no":4,"ko":"Your Seat Is on the Stage","items":[{"n":1,"t":"tf","q":"Natasha, Pierre & the Great Comet of 1812 is a musical inspired by Leo Tolstoy’s War and Peace.","ko":"<나타샤와 피에르 그리고 1812년의 위대한 혜성>은 레오 톨스토이의 <전쟁과 평화>에서 영감을 받은 뮤지컬이다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Natasha, Pierre & the Great Comet of 1812 is a musical inspired by Leo Tolstoy’s War and Peace.","<나타샤와 피에르 그리고 1812년의 위대한 혜성>은 레오 톨스토이의 <전쟁과 평화>에서 영감을 받은 뮤지컬입니다."]],"w":"1번에서 이 작품은 톨스토이의 <전쟁과 평화>에서 영감을 받은(inspired by) 뮤지컬이라고 해요. 본문과 맞아요.","c":"T"},"h":"666a1a4c86"},{"n":2,"t":"tf","q":"In immersive theater, the seating area is never changed.","ko":"몰입형 연극에서 좌석 구역은 결코 바뀌지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Interestingly, this often applies to the seating area as well.","흥미롭게도, 이것은 종종 좌석 구역에도 적용됩니다."]],"w":"7번에서 this often applies to the seating area as well, 즉 공간의 변화가 종종 좌석 구역에도 적용된다고 해요. ‘결코 바뀌지 않는다’는 본문과 반대예요.","c":"F"},"h":"bd75625647"},{"n":3,"t":"tf","q":"Every performance of an immersive play is exactly the same.","ko":"몰입형 연극의 모든 공연은 정확히 똑같다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"This type of engagement allows for a unique experience, as no two performances are the same.","이런 유형의 참여는 독특한 경험을 가능하게 하는데, 두 번의 공연이 똑같은 경우가 없기 때문입니다."]],"w":"12번에서 no two performances are the same, 즉 똑같은 공연은 두 번도 없다고 해요. 본문과 반대예요.","c":"F"},"h":"ba23d26682"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… where every detail enhances your journey into the heart of Tolstoy’s world!)","ko":"모든 세부 사항이 톨스토이의 세계 속으로의 여러분의 여정을 더욱 향상시켜 줍니다.","opts":["방해한다","줄인다","향상시킨다","숨긴다"],"word":"enhances","r":{"a":"3) 향상시킨다","ev":"2번 문장","s":[[2,"This production offers you the best immersive theater experience, where every detail enhances your journey into the heart of Tolstoy’s world!","이 작품은 여러분에게 최고의 몰입형 연극 경험을 제공하며, 모든 세부 사항이 톨스토이의 세계 속으로의 여러분의 여정을 더욱 향상시켜 줍니다!"]],"w":"2번은 최고의 몰입형 연극 경험을 제공한다는 칭찬의 흐름이에요. 모든 세부 사항이 여정을 더 좋게 만든다는 뜻이므로 enhances는 ‘향상시킨다’예요.","c":3},"h":"55ee1c7950"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… which was profoundly shaped by war and love.)","ko":"그것은 전쟁과 사랑에 의해 깊게 형성되었습니다.","opts":["거의","깊게","잠시","우연히"],"word":"profoundly","r":{"a":"2) 깊게","ev":"4번 문장","s":[[4,"This unique form of performance art allows you to experience life in 19th-century Russia, which was profoundly shaped by war and love.","이 독특한 형태의 공연 예술은 여러분이 19세기 러시아에서의 삶을 경험할 수 있게 하는데, 그것은 전쟁과 사랑에 의해 깊게 형성되었습니다."]],"w":"profoundly는 ‘깊게’라는 뜻으로 shaped(형성되었다)를 꾸며요. 19세기 러시아의 삶이 전쟁과 사랑에 의해 깊이 영향받았다는 말이에요.","c":2},"h":"b02edf6576"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nIn immersive theater, actors often move through the audience, and audience members may find themselves engaging in lively dialogue. This can influence the choices of characters in the play, and it can even completely change the ending!","ko":"밑줄 친 This가 가리키는 것은?","sko":"몰입형 연극에서, 배우들은 종종 관객 사이로 이동하며, 관객들은 그들 자신이 활발한 대화에 참여하는 것을 느낄 수 있습니다. 이것은 연극 속 등장인물들의 선택에 영향을 줄 수 있으며, 그것은 심지어 결말을 완전히 바꿀 수도 있습니다!","opts":["배우가 관객 사이로 이동하고 관객이 활발한 대화에 참여하는 것","관객이 객석에 앉아 있는 것","배경음과 냄새가 더해지는 것","톨스토이가 쓴 소설"],"r":{"a":"1) 배우가 관객 사이로 이동하고 관객이 활발한 대화에 참여하는 것","ev":"10~11번 문장","s":[[10,"In immersive theater, actors often move through the audience, and audience members may find themselves engaging in lively dialogue.","몰입형 연극에서, 배우들은 종종 관객 사이로 이동하며, 관객들은 그들 자신이 활발한 대화에 참여하는 것을 느낄 수 있습니다."],[11,"This can influence the choices of characters in the play, and it can even completely change the ending!","이것은 연극 속 등장인물들의 선택에 영향을 줄 수 있으며, 그것은 심지어 결말을 완전히 바꿀 수도 있습니다!"]],"w":"11번의 This는 바로 앞 10번의 내용, 즉 배우가 관객 사이로 이동하고 관객이 대화에 참여하는 것을 가리켜요. 그 상호 작용이 등장인물의 선택과 결말까지 바꿀 수 있다는 거예요.","c":1},"h":"6017c72929"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"With your choices shaping the story, be ready to play your part.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"여러분의 선택들이 이야기를 형성하면서, 여러분의 역할을 할 준비를 하세요.","opts":["여러분의 선택이 이야기 때문에 바뀌니 역할을 맡지 않도록 준비하세요.","이야기가 여러분의 선택을 만들어 주므로 대본을 외울 준비를 하세요.","여러분이 이야기를 다 만든 뒤에야 역할을 정할 수 있습니다.","여러분의 선택이 이야기를 만들어 가므로 여러분이 맡을 역할을 할 준비를 하세요."],"r":{"a":"4) 여러분의 선택이 이야기를 만들어 가므로 여러분이 맡을 역할을 할 준비를 하세요.","ev":"13번 문장","s":[[13,"With your choices shaping the story, be ready to play your part.","여러분의 선택들이 이야기를 형성하면서, 여러분의 역할을 할 준비를 하세요."]],"w":"With your choices shaping the story에서 shaping은 choices를 꾸미는 분사로, 선택이 이야기를 형성한다는 뜻이에요. 그러니 자기 역할(part)을 할 준비를 하라는 명령이에요.","c":4},"h":"b16ba4f163"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["몰입형 연극은 물리적 공간을 전혀 바꾸지 않는다.","몰입은 물리적 공간을 바꾸는 것을 통해 이루어질 수 있다.","몰입은 관객의 수를 줄임으로써 만들어진다.","몰입은 오직 배우들의 의상을 바꿈으로써 이루어진다."],"opts":["Immersive theater never changes the physical space.","Immersion can be achieved through changing the physical space.","Immersion is made by reducing the number of audience members.","Immersion is achieved only by changing the actors’ costumes."],"r":{"a":"2) Immersion can be achieved through changing the physical space.","ev":"5번 문장","s":[[5,"One way this immersion is achieved is through the transformation of physical space.","이 몰입이 달성되는 한 가지 방법은 물리적 공간의 변화를 통한 것입니다."]],"w":"5번에서 몰입이 달성되는 한 가지 방법은 물리적 공간의 변화(transformation of physical space)를 통한 것이라고 해요. 나머지는 5번에 어긋나거나 본문에 없는 내용이에요.","c":2},"h":"89e016205d"},{"n":9,"t":"sum","q":"Immersive theater turns the audience from simple (A) into (B) who take part in the story.","ko":"몰입형 연극은 관객을 단순한 (A)에서 이야기에 참여하는 (B)로 바꾼다.","oko":["(A) 배우 / (B) 관객","(A) 참여자 / (B) 지켜보는 사람","(A) 비평가 / (B) 작가","(A) 지켜보는 사람 / (B) 참여자","(A) 낯선 사람 / (B) 교사"],"opts":["(A) actors / (B) spectators","(A) participants / (B) watchers","(A) critics / (B) writers","(A) watchers / (B) participants","(A) strangers / (B) teachers"],"r":{"a":"4) (A) watchers / (B) participants","ev":"3번 문장","s":[[3,"Dive into the magic of immersive theater, where you’re not just a spectator but also a participant.","몰입형 연극의 마법 속으로 뛰어드세요, 그곳에서 여러분은 단순히 관객이기만 한 것이 아니라 참여자이기도 합니다."]],"w":"3번에서 몰입형 연극은 관객이 단순한 구경꾼(spectator)이 아니라 참여자(participant)이기도 한 곳이에요. 그래서 (A)는 지켜보는 사람, (B)는 참여자예요. 순서가 바뀐 보기는 3번과 반대예요.","c":4},"h":"ea94eb20c4"},{"n":10,"t":"fill","q":"For example, the theater may be [A] to match the setting of a 19th-century Russian [B].","ko":"예를 들어, 극장은 19세기 러시아 [B]의 배경과 일치하도록 [A] 상태일 수도 있습니다.","bank":["decorated","tearoom","hidden","forgotten","ending","scent"],"bko":{"decorated":"장식된","tearoom":"찻집","hidden":"숨겨진","forgotten":"잊힌","ending":"결말","scent":"냄새"},"r":{"a":"[A] decorated, [B] tearoom","ev":"6번 문장","s":[[6,"For example, the theater may be decorated to match the setting of a 19th-century Russian tearoom.","예를 들어, 극장은 19세기 러시아 찻집의 배경과 일치하도록 장식될 수도 있습니다."]],"w":"6번에서 극장은 19세기 러시아 찻집(tearoom)의 배경과 맞게 장식될(decorated) 수 있다고 해요. hidden이나 forgotten은 ‘배경과 일치하도록’과 뜻이 맞지 않고, ending과 scent는 이 자리에 말이 되지 않아요.","c":null},"h":"4b273edee9"}]},{"u":5,"id":"ms1-05-1","no":1,"ko":"내 것만 아니면 되는 거죠?","items":[{"n":1,"t":"tf","q":"Chad and Robin took out their sandwiches after the server left to get the drinks.","ko":"종업원이 음료를 가지러 간 뒤에 Chad와 Robin은 샌드위치를 꺼냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"As she left to get the beverages, they opened their briefcases and took out big, homemade sandwiches —clearly not from the diner.","그녀가 음료를 가지러 자리를 뜨자, 그들은 서류 가방을 열고 분명히 그 식당에서 파는 것이 아닌, 커다란 수제 샌드위치를 꺼냈다."]],"w":"5번에서 종업원(she)이 음료를 가지러 자리를 뜨자 두 사람이 서류 가방을 열고 수제 샌드위치를 꺼냈다고 해요.","c":"T"},"h":"024a36bd8e"},{"n":2,"t":"tf","q":"Mr. Monroe was pleased to see people bringing their own food into his restaurant.","ko":"Monroe 씨는 사람들이 자신의 음식을 그의 식당으로 가져오는 것을 보고 기뻐했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"However, this quickly attracted the attention of the diner’s owner, Mr. Monroe, who didn’t like people bringing their own food into his restaurant.","하지만, 이것은 빠르게 식당 주인인 Monroe 씨의 주의를 끌었는데, 그는 사람들이 자신의 음식을 그의 식당으로 가져오는 것을 좋아하지 않았다."]],"w":"7번에서 Mr. Monroe는 사람들이 자신의 음식을 식당으로 가져오는 것을 좋아하지 않았다고 해요. 기뻐했다는 말은 반대예요.","c":"F"},"h":"fdc71d3732"},{"n":3,"t":"tf","q":"A man at the next table had been quietly watching Chad and Robin before he stood up.","ko":"옆 테이블의 한 남성은 일어나기 전에 Chad와 Robin을 조용히 지켜보고 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Just then, a man at the next table, who had been quietly observing them, suddenly stood up.","바로 그 때, 옆 테이블에서 그들을 조용히 지켜보고 있던 한 남성이 갑자기 자리에서 일어났다."]],"w":"12번에서 옆 테이블의 남성이 그들을 조용히 지켜보고 있다가(had been quietly observing) 갑자기 일어났다고 해요.","c":"T"},"h":"e4cd30733c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Chad and Robin smiled slyly at each other before responding, “OK.”)","ko":"Chad와 Robin은 ‘알겠습니다’라고 대답하기 전에 서로를 향해 교묘하게 미소 지었다.","opts":["부끄럽게","교묘하게","큰 소리로","슬프게"],"word":"slyly","r":{"a":"2) 교묘하게","ev":"10번 문장","s":[[10,"Chad and Robin smiled slyly at each other before responding, “OK.”","Chad와 Robin은 ‘알겠습니다’라고 대답하기 전에 서로를 향해 교묘하게 미소 지었다."]],"w":"겉으로는 OK라고 말하지만 서로 꾀를 숨긴 채 웃었어요. 바로 뒤 11번에서 샌드위치를 맞바꾸는 꾀가 나와요. slyly는 '교묘하게'예요.","c":2},"h":"6def928269"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (After settling at a table, they proceeded to order drinks.)","ko":"테이블에 자리를 잡은 후, 그들은 음료를 주문하기 시작했다.","opts":["~하기를 거절했다","~하기를 취소했다","~하기 시작했다","~하기를 피했다"],"word":"proceeded","r":{"a":"3) ~하기 시작했다","ev":"2번 문장","s":[[2,"After settling at a table, they proceeded to order drinks.","테이블에 자리를 잡은 후, 그들은 음료를 주문하기 시작했다."]],"w":"자리를 잡은 다음에 이어서 음료를 주문했다는 흐름이에요. proceed to-v는 '~하기 시작하다'예요.","c":3},"h":"2ca81b51ef"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nThey started eating casually, as if this was something they did all the time.","ko":"밑줄 친 this가 가리키는 것은?","sko":"그들은 마치 이것이 그들이 항상 하던 일인 것처럼 태연하게 먹기 시작했다.","opts":["음료를 주문하는 것","자신들이 가져온 샌드위치를 식당에서 먹는 것","서로 샌드위치를 맞바꾸는 것","종업원이 음료를 가지러 가는 것"],"r":{"a":"2) 자신들이 가져온 샌드위치를 식당에서 먹는 것","ev":"5~6번 문장","s":[[5,"As she left to get the beverages, they opened their briefcases and took out big, homemade sandwiches —clearly not from the diner.","그녀가 음료를 가지러 자리를 뜨자, 그들은 서류 가방을 열고 분명히 그 식당에서 파는 것이 아닌, 커다란 수제 샌드위치를 꺼냈다."],[6,"They started eating casually, as if this was something they did all the time.","그들은 마치 이것이 그들이 항상 하던 일인 것처럼 태연하게 먹기 시작했다."]],"w":"this는 5번에서 꺼낸 샌드위치를 6번에서 식당 안에서 먹는 일이에요. 서로 맞바꾸는 일(11번)은 이때는 아직 일어나지 않았어요.","c":2},"h":"6888a61571"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Smiling, he said, “Nice try, but your little exchange doesn’t change the rules” and then showed his police badge.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"미소를 지으며, 그는 “좋은 시도지만, 이 사소한 바꿔치기가 규칙을 바꾸지는 않죠”라고 말하고는 경찰 배지를 내보였다.","opts":["샌드위치를 맞바꿨으니 규칙이 달라졌고, 이제 먹어도 된다는 뜻이다.","시도가 훌륭했으니 규칙을 바꿔 주겠다는 뜻이다.","규칙이 이미 바뀌었으니 샌드위치를 바꿀 필요가 없다는 뜻이다.","시도는 좋았지만, 샌드위치를 맞바꾼다고 규칙이 달라지지는 않는다는 뜻이다."],"r":{"a":"4) 시도는 좋았지만, 샌드위치를 맞바꾼다고 규칙이 달라지지는 않는다는 뜻이다.","ev":"13번 문장","s":[[13,"Smiling, he said, “Nice try, but your little exchange doesn’t change the rules” and then showed his police badge.","미소를 지으며, 그는 “좋은 시도지만, 이 사소한 바꿔치기가 규칙을 바꾸지는 않죠”라고 말하고는 경찰 배지를 내보였다."]],"w":"Nice try, but ~은 '좋은 시도지만 ~는 아니다'라는 뜻이에요. your little exchange doesn’t change the rules는 샌드위치를 바꿔치기해도 규칙은 그대로라는 말이에요.","c":4},"h":"e39506c223"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Chad와 Robin은 종업원에게 샌드위치와 음료를 주문했다.","종업원이 그들의 테이블로 수제 샌드위치를 가져다주었다.","종업원이 음식에 대해 묻자 Chad와 Robin은 고개를 저었다.","Chad와 Robin은 음료를 주문한 뒤 음식도 더 주문했다."],"opts":["Chad and Robin ordered sandwiches and drinks from the server.","The server brought homemade sandwiches to their table.","Chad and Robin shook their heads when the server asked about food.","Chad and Robin ordered drinks and then ordered more food."],"r":{"a":"3) Chad and Robin shook their heads when the server asked about food.","ev":"3~4번 문장","s":[[3,"“Nothing to eat?” the server asked.","“먹을 것은 없으신가요?”라고 종업원이 물었다."],[4,"Chad and Robin shook their heads.","Chad와 Robin은 고개를 저었다."]],"w":"3번에서 종업원이 먹을 것은 없는지 묻자 4번에서 두 사람이 고개를 저었다고 해요. 샌드위치는 종업원이 아니라 두 사람이 서류 가방에서 꺼냈어요(5번).","c":3},"h":"17236f22f1"},{"n":9,"t":"sum","q":"Mr. Monroe (A) over to the table and told Chad and Robin that eating their own sandwiches there was not (B).","ko":"Monroe 씨는 테이블로 (A) 가서 Chad와 Robin에게 그곳에서 자신들의 샌드위치를 먹는 것은 (B) 않는다고 말했다.","oko":["(A) 성큼성큼 걸어 / (B) 저렴하지","(A) 머물러 / (B) 허용되지","(A) 성큼성큼 걸어 / (B) 허용되지","(A) 기다려 / (B) 비싸지","(A) 머물러 / (B) 위험하지"],"opts":["(A) marched / (B) cheap","(A) stayed / (B) allowed","(A) marched / (B) allowed","(A) waited / (B) expensive","(A) stayed / (B) dangerous"],"r":{"a":"3) (A) marched / (B) allowed ((A) 성큼성큼 걸어 / (B) 허용되지)","ev":"9번 문장","s":[[9,"He marched over to the table and said, “Hey guys, you can’t eat your own sandwiches in here!”","그는 테이블로 성큼성큼 걸어가서 “이봐요 당신들, 여기서 당신들의 샌드위치를 먹을 수 없어요!”라고 말했다."]],"w":"9번에서 그는 테이블로 성큼성큼 걸어가서(marched over) 여기서 당신들의 샌드위치를 먹을 수 없다고(can’t) 말해요. 즉 그곳에서 먹는 것이 허용되지(allowed) 않는다는 뜻이에요.","c":3},"h":"88f86b24fe"},{"n":10,"t":"fill","q":"Two [A] brought their own food into a [B], which was against the rules.","ko":"두 [A]이(가) 자신들의 음식을 [B]에 가져왔는데, 그것은 규칙에 어긋났다.","bank":["lawyers","diner","officers","briefcase","server","sandwich"],"bko":{"lawyers":"변호사들","diner":"식당","officers":"경찰관들","briefcase":"서류 가방","server":"종업원","sandwich":"샌드위치"},"r":{"a":"[A] lawyers, [B] diner","ev":"1번, 8번 문장","s":[[1,"Two lawyers named Chad and Robin entered a downtown diner.","Chad와 Robin이라는 이름의 두 변호사가 시내의 한 식당에 들어왔다."],[8,"In fact, it was against the rules!","사실, 그것은 규칙에 어긋났다!"]],"w":"1번에서 두 변호사(lawyers)가 식당(diner)에 들어왔고, 8번에서 그런 일이 규칙에 어긋난다고 해요. officers는 12~13번에서 지켜보던 사람이지 음식을 가져온 사람들이 아니에요. briefcase, server, sandwich는 이 자리에 쓰면 뜻이 이어지지 않아요.","c":null},"h":"450858fdc9"}]},{"u":5,"id":"ms1-05-2","no":2,"ko":"마음이 안 가면 눈도 없어요","items":[{"n":1,"t":"tf","q":"After being inspired by certain works, Modigliani began creating portraits with blank eyes.","ko":"특정한 작품들에게서 영감을 받은 뒤, 모딜리아니는 비어 있는 눈을 가진 초상화를 제작하기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Inspired by these works, Modigliani began creating portraits with blank eyes.","이러한 작품들에서 영감을 받아, 모딜리아니는 비어 있는 눈을 가진 초상화를 제작하기 시작했다."]],"w":"9번에서 이러한 작품들에서 영감을 받아 비어 있는 눈의 초상화를 만들기 시작했다고 해요. these works는 8번의 아프리카 조각이에요.","c":"T"},"h":"c8df35a550"},{"n":2,"t":"tf","q":"Emotional connection was the only reason Modigliani painted blank eyes.","ko":"감정적 연결은 모딜리아니가 비어 있는 눈을 그린 유일한 이유였다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"While the emotional connection to his subjects appears to be one factor in Modigliani’s portrayal of eyes, artistic influences also played a significant role.","그의 피사체들에 대한 감정적 연결이 모딜리아니의 눈 묘사에 있어서 한 가지 요소로 보이는 한편, 예술적 영향 또한 중요한 역할을 했다."]],"w":"7번에서 감정적 연결은 한 가지 요소(one factor)일 뿐이고, 예술적 영향도 중요한 역할을 했다고 해요. '유일한 이유'는 틀려요.","c":"F"},"h":"eef1da73e9"},{"n":3,"t":"tf","q":"According to some who have studied his work, Modigliani painted the eyes of young street children he felt sympathy for.","ko":"그의 작품을 연구한 일부 사람들에 따르면, 모딜리아니는 자신이 연민을 느낀 거리의 어린 아이들의 눈을 그렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"These included his partner Jeanne Hébuterne, close friends, and even young street children whom he felt sympathy for.","여기에는 그의 파트너 잔 에뷔테른, 친한 친구들, 그리고 그가 연민을 느꼈던 거리의 어린 아이들까지 포함되었다."]],"w":"6번에서 눈을 그린 피사체에 그가 연민을 느꼈던 거리의 어린 아이들까지 포함되었다고 해요.","c":"T"},"h":"4cf911ca4d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… what might it mean when an artist deliberately chooses not to depict them?)","ko":"… 예술가가 의도적으로 그것들을 묘사하지 않기로 선택한다면 그것은 무엇을 의미할 수 있을까?","opts":["우연히","의도적으로","어쩔 수 없이","갑자기"],"word":"deliberately","r":{"a":"2) 의도적으로","ev":"1번 문장","s":[[1,"If eyes are the windows to one’s soul, what might it mean when an artist deliberately chooses not to depict them?","만약 눈이 사람의 영혼에 대한 창이라면, 예술가가 의도적으로 그것들을 묘사하지 않기로 선택한다면 그것은 무엇을 의미할 수 있을까?"]],"w":"일부러 눈을 그리지 않기로 '선택한다(chooses)'고 했으니 우연이나 어쩔 수 없음이 아니에요. deliberately는 '의도적으로'예요.","c":2},"h":"d224e4f536"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The Italian painter Amedeo Modigliani is renowned for this distinctive choice.)","ko":"이탈리아 화가 아메데오 모딜리아니는 이러한 독특한 선택으로 유명하다.","opts":["평범한","위험한","서툰","유명한"],"word":"renowned","r":{"a":"4) 유명한","ev":"2번 문장","s":[[2,"The Italian painter Amedeo Modigliani is renowned for this distinctive choice.","이탈리아 화가 아메데오 모딜리아니는 이러한 독특한 선택으로 유명하다."]],"w":"독특한 선택(눈을 비워 둠) '때문에' 알려진 화가라는 뜻이에요. be renowned for는 '~으로 유명하다'예요.","c":4},"h":"feb0cacc0c"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nIn many of his portraits, the subject’s eyes remain uncolored, which makes them appear blank.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그의 많은 초상화들에서, 피사체의 눈은 색칠되지 않은 채로 남아 있는데, 이는 그것들이 비어 있는 것처럼 보이게 만든다.","opts":["피사체의 눈","모딜리아니의 초상화들","피사체의 친구들","아프리카 조각들"],"r":{"a":"1) 피사체의 눈","ev":"3번 문장","s":[[3,"In many of his portraits, the subject’s eyes remain uncolored, which makes them appear blank.","그의 많은 초상화들에서, 피사체의 눈은 색칠되지 않은 채로 남아 있는데, 이는 그것들이 비어 있는 것처럼 보이게 만든다."]],"w":"색칠되지 않은 채로 남아 있는 것이 피사체의 눈(eyes)이므로, 비어 보이는 것도 그 눈이에요. 초상화 전체가 비어 보인다는 뜻이 아니에요.","c":1},"h":"c68a11f819"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This was not just about style, but rather a meaningful personal decision.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 단지 스타일에 관한 것이 아니라, 오히려 의미 있는 개인적인 결정이었다.","opts":["이것은 스타일만의 문제였을 뿐, 개인적인 결정과는 관계가 없었다.","이것은 개인적인 결정이 아니라 다른 화가들의 스타일을 따른 것이었다.","이것은 단순히 스타일의 문제가 아니라, 의미 있는 개인적인 결정이었다.","이것은 스타일도 결정도 아닌 우연한 실수였다."],"r":{"a":"3) 이것은 단순히 스타일의 문제가 아니라, 의미 있는 개인적인 결정이었다.","ev":"4번 문장","s":[[4,"This was not just about style, but rather a meaningful personal decision.","이것은 단지 스타일에 관한 것이 아니라, 오히려 의미 있는 개인적인 결정이었다."]],"w":"not just A but rather B는 'A만이 아니라 오히려 B'라는 뜻이에요. 눈을 비운 것은 스타일 문제만이 아니라 의미 있는 개인적 결정이었다는 말이에요.","c":3},"h":"2e8d86cac5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["모딜리아니는 피사체와 가깝게 느끼는지와 관계없이 모든 피사체의 눈을 그렸다.","모딜리아니는 친구들의 눈보다 낯선 사람들의 눈을 항상 더 정성스럽게 그렸다.","모딜리아니는 감정적으로 연결된 피사체의 눈을 그리지 않으려 했다.","그의 작품을 연구한 일부 사람들에 따르면, 모딜리아니는 감정적으로 연결된 피사체의 눈만 그렸다."],"opts":["Modigliani painted eyes on every subject, whether or not he felt close to them.","Modigliani always painted the eyes of strangers more carefully than those of friends.","Modigliani avoided painting the eyes of subjects he felt emotionally connected to.","According to some who studied his work, Modigliani painted the eyes only of subjects he felt emotionally connected to."],"r":{"a":"4) According to some who studied his work, Modigliani painted the eyes only of subjects he felt emotionally connected to.","ev":"5번 문장","s":[[5,"Some who have studied Modigliani’s work believe that he would only paint the eyes of subjects he felt emotionally connected to.","모딜리아니의 작품을 연구해 온 일부 사람들은 그가 감정적으로 연결되어 있다고 느낀 피사체들의 눈만 그렸다고 믿는다."]],"w":"5번에서 일부 연구자들은 모딜리아니가 감정적으로 연결되어 있다고 느낀 피사체의 눈만 그렸다고 믿어요. 나머지 선지는 이와 반대이거나 본문에 없는 내용이에요.","c":4},"h":"538845c03e"},{"n":9,"t":"sum","q":"Modigliani removed unnecessary (A) so that viewers could focus on the (B) of the subject.","ko":"모딜리아니는 관람객들이 피사체의 (B)에 집중할 수 있도록 불필요한 (A)을 제거했다.","oko":["(A) 틀 / (B) 본질","(A) 세부 사항 / (B) 본질","(A) 세부 사항 / (B) 옷차림","(A) 피사체 / (B) 본질","(A) 친구 / (B) 옷차림"],"opts":["(A) frames / (B) essence","(A) details / (B) essence","(A) details / (B) clothes","(A) subjects / (B) essence","(A) friends / (B) clothes"],"r":{"a":"2) (A) details / (B) essence","ev":"10번 문장","s":[[10,"He removed unnecessary details, allowing viewers to focus on the essence of the subject.","그는 불필요한 세부 사항들을 제거해서, 관람객들이 피사체의 본질에 집중할 수 있도록 했다."]],"w":"10번에서 모딜리아니는 불필요한 세부 사항(details)을 없애서 관람객이 피사체의 본질(essence)에 집중하게 했어요. 틀이나 옷차림은 본문에 나오지 않아요.","c":2},"h":"4cb682dae1"},{"n":10,"t":"fill","q":"The sculptor Brancusi introduced Modigliani to African [A], which featured simplified, abstract [B].","ko":"조각가 브랑쿠시는 모딜리아니에게 단순화되고 추상적인 [B]을(를) 특징으로 하는 아프리카 [A]을(를) 소개했다.","bank":["sculpture","faces","painters","teachers","friends","children"],"bko":{"sculpture":"조각","faces":"얼굴들","painters":"화가들","teachers":"선생님들","friends":"친구들","children":"아이들"},"r":{"a":"[A] sculpture, [B] faces","ev":"8번 문장","s":[[8,"In the early 1900s, the renowned sculptor Constantin Brancusi introduced Modigliani to African sculpture, which featured simplified, abstract faces.","1900년대 초반, 유명 조각가 콘스탄틴 브랑쿠시는 모딜리아니에게 아프리카 조각을 소개했는데, 그것은 단순화되고 추상적인 얼굴을 특징으로 했다."]],"w":"8번에서 Brancusi는 모딜리아니에게 단순화되고 추상적인 얼굴(faces)이 특징인 아프리카 조각(sculpture)을 소개했어요. painters, teachers, friends, children은 which featured simplified, abstract 뒤나 African 뒤에 말이 되지 않아요.","c":null},"h":"dc00403ed4"}]},{"u":5,"id":"ms1-05-3","no":3,"ko":"으악! 훅 들어오시면 곤란해요!","items":[{"n":1,"t":"tf","q":"Our brain releases oxytocin when we respond positively to physical contact.","ko":"우리가 신체적 접촉에 긍정적으로 반응할 때 우리의 뇌는 옥시토신을 분비한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When we have a positive response to physical contact, it happens because our brain releases oxytocin, called the “trust hormone.”","우리가 신체적 접촉에 대해 긍정적인 반응을 보일 때, 그것은 우리의 뇌가 ‘신뢰 호르몬’이라고 불리는 옥시토신을 분비하기 때문에 일어난다."]],"w":"6번에서 신체적 접촉에 긍정적인 반응을 보일 때 뇌가 옥시토신을 분비한다고 해요.","c":"T"},"h":"41883c40bf"},{"n":2,"t":"tf","q":"Higher oxytocin levels make us feel less safe.","ko":"높아진 옥시토신 수치는 우리가 덜 안전하다고 느끼게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Increased oxytocin levels create feelings of security and help us to develop emotional connections.","높아진 옥시토신 수치는 안정감을 만들고 우리가 정서적 유대감을 형성하도록 돕는다."]],"w":"7번에서 높아진 옥시토신 수치는 안정감을 만들고 정서적 유대감을 형성하도록 돕는다고 해요. 덜 안전하다고 느낀다는 말은 반대예요.","c":"F"},"h":"2eef027eb5"},{"n":3,"t":"tf","q":"Uncomfortable physical contact lowers our heart rate and relaxes our muscles.","ko":"불편한 신체적 접촉은 우리의 심박수를 낮추고 근육을 이완시킨다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"You also experience physical symptoms such as increased heart rate, sweating, and muscle tension.","당신은 또한 심박수 증가, 발한, 근육 긴장과 같은 신체적 증상을 경험한다."]],"w":"12번에서 심박수 증가, 발한, 근육 긴장 같은 신체적 증상을 경험한다고 해요. 심박수가 낮아지고 근육이 이완된다는 말은 반대예요.","c":"F"},"h":"8dc3d37e27"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But what about uncomfortable physical contact like unwanted hugs?)","ko":"하지만 원치 않는 포옹과 같은 불편한 신체적 접촉은 어떤가?","opts":["원치 않는","따뜻한","오랜만의","정중한"],"word":"unwanted","r":{"a":"1) 원치 않는","ev":"8번 문장","s":[[8,"But what about uncomfortable physical contact like unwanted hugs?","하지만 원치 않는 포옹과 같은 불편한 신체적 접촉은 어떤가?"]],"w":"uncomfortable physical contact(불편한 신체적 접촉)의 예이므로, 반갑지 않은 포옹이에요. unwanted는 '원치 않는'이에요.","c":1},"h":"3a91805d84"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (What determines these different responses to a sudden touch?)","ko":"무엇이 갑작스러운 접촉에 대한 이런 다른 반응을 결정하는가?","opts":["~을 취소하다","~을 숨기다","~을 방해하다","~을 결정하다"],"word":"determines","r":{"a":"4) ~을 결정하다","ev":"3번 문장","s":[[3,"What determines these different responses to a sudden touch?","무엇이 갑작스러운 접촉에 대한 이런 다른 반응을 결정하는가?"]],"w":"무엇이 서로 다른 반응을 '정하는지' 묻는 질문이에요. 4~5번에서 그 답으로 뇌에서 일어나는 일이라고 해요. determine은 '결정하다'예요.","c":4},"h":"f0967e6a1c"},{"n":6,"t":"ref","q":"What does the underlined \"This heightened state\" refer to?\nThis heightened state causes increased anxiety and an overwhelming urge to escape the situation.","ko":"밑줄 친 This heightened state가 가리키는 것은?","sko":"이 고조된 상태는 커진 불안과 상황을 벗어나고자 하는 압도적인 충동을 유발한다.","opts":["옥시토신 덕분에 안정감을 느끼는 상태","따뜻하게 포옹을 받고 있는 상태","코르티솔이 대량 분비되어 몸이 비상 상태가 된 것","낯선 친척을 처음 만난 상태"],"r":{"a":"3) 코르티솔이 대량 분비되어 몸이 비상 상태가 된 것","ev":"10~11번 문장","s":[[10,"It releases large amounts of cortisol, the “stress hormone.”","그것은 ‘스트레스 호르몬’인 코르티솔을 대량 분비한다."],[11,"This heightened state causes increased anxiety and an overwhelming urge to escape the situation.","이 고조된 상태는 커진 불안과 상황을 벗어나고자 하는 압도적인 충동을 유발한다."]],"w":"10번에서 뇌가 코르티솔을 대량 분비한다고 했고, 11번의 This heightened state는 그 결과로 높아진 상태예요. 이 상태가 불안과 벗어나려는 충동을 일으켜요.","c":3},"h":"a5da2a5e2b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s when your brain hits the panic button.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그때가 당신의 뇌가 비상 버튼을 누르는 때이다.","opts":["그때는 뇌가 쉬면서 아무 반응도 하지 않을 때이다.","그때가 바로 뇌가 위급 신호를 작동시키는 때이다.","그때는 뇌가 옥시토신을 분비해 안정감을 만드는 때이다.","그때는 사람이 직접 버튼을 눌러 상황에서 벗어나는 때이다."],"r":{"a":"2) 그때가 바로 뇌가 위급 신호를 작동시키는 때이다.","ev":"9번 문장","s":[[9,"That’s when your brain hits the panic button.","그때가 당신의 뇌가 비상 버튼을 누르는 때이다."]],"w":"hits the panic button은 '비상 버튼을 누르다'라는 비유예요. 불편한 접촉이 생기면 뇌가 위급 신호를 보내고, 바로 뒤 10번에서 코르티솔이 분비돼요.","c":2},"h":"dbb3fe45d4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["먼 친척이 꽉 안아 주면 누구나 따뜻하고 안전하다고 느낀다.","먼 친척의 포옹에 어떤 사람은 안전하다고 느끼고 어떤 사람은 긴장할 수 있다.","글은 가까운 친구를 껴안는 아이의 이야기로 시작한다.","낯선 친척의 포옹은 모두에게 편안한 순간으로 설명된다."],"opts":["Everyone feels warm and safe when a distant relative hugs them tightly.","Some people may feel safe and others may feel tense when a distant relative hugs them.","The passage begins with a story about a child hugging a close friend.","A hug from an unfamiliar relative is described as a comfortable moment for everyone."],"r":{"a":"2) Some people may feel safe and others may feel tense when a distant relative hugs them.","ev":"1~2번 문장","s":[[1,"We’ve all been there: that awkward moment when a distant, unfamiliar relative pulls us in for a tight hug.","우리 모두 그 상황을 겪어 봤는데, 먼, 낯선 친척이 꽉 껴안는 포옹을 위해 우리를 끌어당기는 바로 그 어색한 순간이다."],[2,"In this situation, do you feel warm and safe, or does your whole body tense up?","이런 상황에서, 당신은 따뜻하고 안전하다고 느끼는가, 아니면 당신의 온몸이 긴장하는가?"]],"w":"1번에서 먼 낯선 친척의 포옹은 어색한 순간(awkward moment)이라고 하고, 2번에서 따뜻하고 안전하다고 느끼는지, 온몸이 긴장하는지 두 반응을 물어요. 누구나 같은 반응이라는 말은 없어요.","c":2},"h":"1f77c2a5c3"},{"n":9,"t":"sum","q":"These body responses evolved to help early humans (A) physical threats, and today they work as our body’s natural (B) system.","ko":"이러한 신체 반응은 초기 인류가 신체적 위협에서 (A) 수 있도록 돕기 위해 진화했고, 오늘날에는 우리 몸의 자연적인 (B) 시스템으로 작동한다.","oko":["(A) 무시할 / (B) 보상","(A) 일으킬 / (B) 신뢰","(A) 무시할 / (B) 경고","(A) 살아남을 / (B) 신뢰","(A) 살아남을 / (B) 경고"],"opts":["(A) ignore / (B) reward","(A) cause / (B) trust","(A) ignore / (B) warning","(A) survive / (B) trust","(A) survive / (B) warning"],"r":{"a":"5) (A) survive / (B) warning","ev":"13~14번 문장","s":[[13,"These responses evolved to help early humans survive immediate physical threats, such as predators.","이러한 반응들은 포식자와 같은 즉각적인 신체적 위협으로부터 초기 인류가 생존하도록 돕기 위해 진화했다."],[14,"Today, this serves as our body’s natural warning system, helping us avoid threatening situations.","오늘날, 이것은 우리 몸의 자연적 경고 시스템의 역할을 하고, 위협적인 상황을 피하도록 돕는다."]],"w":"13번에서 이 반응들은 초기 인류가 즉각적인 위협에서 살아남도록(survive) 돕기 위해 진화했고, 14번에서 오늘날은 우리 몸의 자연적 경고(warning) 시스템이라고 해요. trust는 옥시토신의 별명이에요.","c":5},"h":"57327daa43"},{"n":10,"t":"fill","q":"It releases large [A] of cortisol, the “[B] hormone.”","ko":"그것은 많은 [A]의 코르티솔, 즉 ‘[B] 호르몬’을 분비한다.","bank":["amounts","stress","symptoms","predators","relative","button"],"bko":{"amounts":"양","stress":"스트레스","symptoms":"증상들","predators":"포식자들","relative":"친척","button":"버튼"},"r":{"a":"[A] amounts (양), [B] stress (스트레스)","ev":"10번 문장","s":[[10,"It releases large amounts of cortisol, the “stress hormone.”","그것은 ‘스트레스 호르몬’인 코르티솔을 대량 분비한다."]],"w":"10번에서 뇌는 ‘스트레스 호르몬’인 코르티솔을 대량(large amounts) 분비한다고 해요. large 뒤에는 양을 나타내는 명사가 와야 해요.","c":null},"h":"e6f521ad60"}]},{"u":5,"id":"ms1-05-4","no":4,"ko":"Open Your Mouth, Open Your World","items":[{"n":1,"t":"tf","q":"Dragon NaturallySpeaking can change spoken words into text.","ko":"Dragon NaturallySpeaking은 말한 단어를 텍스트로 바꿀 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Dragon NaturallySpeaking is one such software that allows users to convert their spoken words into text and control some computer functions through voice commands.","Dragon NaturallySpeaking은 사용자가 그들이 말한 단어를 텍스트로 변환하고 음성 명령을 통해 일부 컴퓨터 기능을 제어할 수 있게 하는 그러한 소프트웨어 중 하나이다."]],"w":"4번에서 Dragon NaturallySpeaking은 사용자가 말한 단어를 텍스트로 변환할 수 있게 한다고 해요.","c":"T"},"h":"5bb36ca2fb"},{"n":2,"t":"tf","q":"Dragon NaturallySpeaking cannot understand people with speech impediments.","ko":"Dragon NaturallySpeaking은 언어 장애가 있는 사람들을 이해할 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"In addition, it adapts to each person’s unique manner of speaking, so that it can understand people with speech impediments as well.","게다가, 그것은 언어 장애가 있는 사람들도 이해할 수 있도록 각 사람의 독특한 말하기 방식에 적응한다."]],"w":"6번에서 각 사람의 독특한 말하기 방식에 적응해서 언어 장애가 있는 사람들도 이해할 수 있다고 해요.","c":"F"},"h":"499af76143"},{"n":3,"t":"tf","q":"Otter.ai records the content of a video meeting and identifies the speaker.","ko":"Otter.ai는 화상 회의의 내용을 기록하고 발언자를 식별한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"When users join a video meeting, it automatically records the content and identifies the speaker, allowing individuals with hearing impairments to independently participate in online classes.","사용자가 화상 회의에 참여하면, 그것은 자동으로 내용을 기록하고 발언자를 식별하며, 청각 장애가 있는 개인들이 온라인 수업에 독립적으로 참여할 수 있게 한다."]],"w":"8번에서 사용자가 화상 회의에 참여하면 Otter.ai가 자동으로 내용을 기록하고 발언자를 식별한다고 해요.","c":"T"},"h":"846634a12b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Through innovative assistive software, numerous individuals with disabilities are acquiring unprecedented autonomy!)","ko":"혁신적인 보조 소프트웨어를 통해, 장애를 가진 수많은 개인들이 전례 없는 자율성을 획득하고 있다!","opts":["평범한","예상된","전례 없는","오래된"],"word":"unprecedented","r":{"a":"3) 전례 없는","ev":"3번 문장","s":[[3,"Through innovative assistive software, numerous individuals with disabilities are acquiring unprecedented autonomy!","혁신적인 보조 소프트웨어를 통해, 장애를 가진 수많은 개인들이 전례 없는 자율성을 획득하고 있다!"]],"w":"기술이 주는 밝은 면을 강조하는 문장이에요. 이전에는 없던 정도의 자율성을 얻고 있다는 뜻이라 unprecedented는 '전례 없는'이에요.","c":3},"h":"c10d2f75c5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When advancements focus on ethical goals, they can enhance accessibility and contribute to a more inclusive society.)","ko":"발전이 윤리적 목표에 초점을 맞출 때, 그것들은 접근성을 향상시키고 더 포용적인 사회에 기여할 수 있다.","opts":["향상시키다","줄이다","숨기다","의심하다"],"word":"enhance","r":{"a":"1) 향상시키다","ev":"10번 문장","s":[[10,"When advancements focus on ethical goals, they can enhance accessibility and contribute to a more inclusive society.","발전이 윤리적 목표에 초점을 맞출 때, 그것들은 접근성을 향상시키고 더 포용적인 사회에 기여할 수 있다."]],"w":"enhance accessibility는 and 뒤의 '더 포용적인 사회에 기여한다'와 같은 긍정적인 결과예요. enhance는 '향상시키다'예요.","c":1},"h":"ac6638e049"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nAnother program making a positive impact for the disabled is Otter.ai, which provides real-time transcription.","ko":"밑줄 친 which가 가리키는 것은?","sko":"장애를 가진 사람들에게 긍정적인 영향을 미치는 또 다른 프로그램은 Otter.ai인데, 그것은 실시간 녹취를 제공한다.","opts":["장애를 가진 사람들","Otter.ai","긍정적인 영향","또 다른 프로그램의 사용자들"],"r":{"a":"2) Otter.ai","ev":"7번 문장","s":[[7,"Another program making a positive impact for the disabled is Otter.ai, which provides real-time transcription.","장애를 가진 사람들에게 긍정적인 영향을 미치는 또 다른 프로그램은 Otter.ai인데, 그것은 실시간 녹취를 제공한다."]],"w":"which 앞의 쉼표는 계속적 용법을 나타내요. which provides real-time transcription은 바로 앞의 Otter.ai를 설명하는 말이에요.","c":2},"h":"73d0e21358"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Ultimately, whether a technology helps or hurts us depends on how it’s used.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"궁극적으로, 기술이 우리에게 도움이 되는지 해를 끼치는지는 그것이 어떻게 사용되는지에 달려 있다.","opts":["기술이 도움이 되든 해가 되든 사용 방식은 중요하지 않다.","기술은 어떻게 쓰이든 결국 우리에게 해를 끼친다.","기술이 우리에게 도움이 될지 해가 될지를 정하는 것은 기술의 속도이다.","기술이 우리에게 도움이 될지 해가 될지는 그것이 어떻게 사용되는지에 달려 있다."],"r":{"a":"4) 기술이 우리에게 도움이 될지 해가 될지는 그것이 어떻게 사용되는지에 달려 있다.","ev":"9번 문장","s":[[9,"Ultimately, whether a technology helps or hurts us depends on how it’s used.","궁극적으로, 기술이 우리에게 도움이 되는지 해를 끼치는지는 그것이 어떻게 사용되는지에 달려 있다."]],"w":"whether ~ helps or hurts us는 '도움이 되는지 해가 되는지'이고, depends on how it’s used는 '그것이 어떻게 사용되는지에 달려 있다'예요.","c":4},"h":"ed93bf02dc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Dragon NaturallySpeaking은 키보드나 마우스를 쓰기 어려운 학생들에게 도움이 될 수 있다.","Dragon NaturallySpeaking은 타자를 빠르게 칠 수 있는 학생들에게만 쓸모 있다.","시각 장애가 있는 학생들은 어떤 보조 소프트웨어도 사용할 수 없다.","Dragon NaturallySpeaking은 사용자가 모든 단어를 직접 타이핑하게 한다."],"opts":["Dragon NaturallySpeaking can help students who find it hard to use a keyboard or a mouse.","Dragon NaturallySpeaking is useful only for students who can type quickly.","Students with vision impairments cannot use any assistive software.","Dragon NaturallySpeaking makes users type every word by hand."],"r":{"a":"1) Dragon NaturallySpeaking can help students who find it hard to use a keyboard or a mouse.","ev":"5번 문장","s":[[5,"This can be especially helpful for students with physical disabilities or vision impairments who have difficulty using a keyboard or a mouse.","이것은 키보드나 마우스를 사용하는 데 어려움이 있는 신체적 장애나 시각 장애가 있는 학생들에게 특히 도움이 될 수 있다."]],"w":"5번에서 Dragon NaturallySpeaking은 신체적 장애나 시각 장애가 있어 키보드나 마우스를 쓰기 어려운 학생들에게 특히 도움이 될 수 있다고 해요.","c":1},"h":"f4d1bb7e48"},{"n":9,"t":"sum","q":"But there is also a (A) side to tech (B).","ko":"하지만 기술 (B)에는 (A) 면도 있다.","oko":["(A) 밝은 / (B) 혁신","(A) 어두운 / (B) 혁신","(A) 밝은 / (B) 실패","(A) 어두운 / (B) 실패","(A) 무거운 / (B) 규칙"],"opts":["(A) bright / (B) innovation","(A) dark / (B) innovation","(A) bright / (B) failures","(A) dark / (B) failures","(A) heavy / (B) rules"],"r":{"a":"1) (A) bright / (B) innovation ((A) 밝은 / (B) 혁신)","ev":"2번 문장","s":[[2,"But there is also a bright side to tech innovation.","하지만 기술 혁신에는 밝은 면도 있다."]],"w":"2번에서 하지만 기술 혁신(tech innovation)에는 밝은 면(a bright side)도 있다고 해요.","c":1},"h":"9369db9541"},{"n":10,"t":"fill","q":"Recent [A] technological advancements seem to be raising [B] that they could pose threats to humanity.","ko":"최근의 [A] 기술적 발전은 그것들이 인류에게 위협을 가할 수 있다는 [B]을(를) 불러일으키는 것처럼 보인다.","bank":["rapid","concerns","spoken","speech","transcription","humanity"],"bko":{"rapid":"급속한","concerns":"우려","spoken":"말해진","speech":"말하기","transcription":"녹취","humanity":"인류"},"r":{"a":"[A] rapid (급속한), [B] concerns (우려)","ev":"1번 문장","s":[[1,"Recent rapid technological advancements seem to be raising concerns that they could pose threats to humanity.","최근의 급속한 기술적 발전은 그것들이 인류에게 위협을 가할 수 있다는 우려를 불러일으키는 것처럼 보인다."]],"w":"1번에서 최근의 급속한(rapid) 기술적 발전이 인류에게 위협을 가할 수 있다는 우려(concerns)를 불러일으키는 것처럼 보인다고 해요.","c":null},"h":"ba15a866d3"}]},{"u":6,"id":"ms1-06-1","no":1,"ko":"사막을 빛내는 거대한 도시","items":[{"n":1,"t":"tf","q":"The name NEOM is made by combining neo, meaning new, and the Arabic word mustaqbal, meaning future.","ko":"NEOM이라는 이름은 ‘새로운’을 뜻하는 neo와 ‘미래’를 뜻하는 아랍어 mustaqbal을 합쳐서 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"NEOM is a large-scale urban development project whose name combines neo (new) and the Arabic word mustaqbal (future).","NEOM은 대규모 도시 개발 프로젝트로, 그것의 이름은 ‘neo(새로운)’와 아랍어 단어인 ‘mustaqbal(미래)’이 결합한 것이다."]],"w":"2번에서 NEOM의 이름은 neo(새로운)와 아랍어 단어 mustaqbal(미래)을 결합한 것이라고 해요. 진술문과 같은 내용이에요.","c":"T"},"h":"17292343a9"},{"n":2,"t":"tf","q":"The Line’s exterior was planned to be covered with solar panels that produce clean energy.","ko":"The Line의 외관은 청정 에너지를 만드는 태양광 패널로 덮일 예정이었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Its exterior was to be covered with mirrors that reflect the surrounding environment, making it blend harmoniously with nature.","그것의 외관은 주변 환경을 반사하는 거울로 덮일 예정이었으며, 그것이 자연과 조화롭게 어우러지게 했다."]],"w":"6번에서 외관은 주변 환경을 반사하는 거울(mirrors)로 덮일 예정이었다고 해요. 태양광 패널이라는 말은 본문에 없어요.","c":"F"},"h":"d6b4f5c75e"},{"n":3,"t":"tf","q":"The Line was designed to be a small circular structure inside NEOM.","ko":"The Line은 NEOM 안의 작고 둥근 구조물로 설계되었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"This is one of the planned cities within NEOM, and it was designed to take the form of an enormous linear structure that measures 170 kilometers in length and 500 meters in height.","이것은 NEOM 내에 계획된 도시들 중 하나이며, 그것은 길이 170킬로미터, 높이 500미터에 이르는 거대한 선형 구조물 형태를 취하도록 설계되었다."]],"w":"5번에서 The Line은 길이 170킬로미터, 높이 500미터의 거대한(enormous) 선형(linear) 구조물이에요. 작고 둥근 구조물이 아니에요.","c":"F"},"h":"e7d4db4084"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (NEOM’s most notable feature was supposed to be The Line.)","ko":"NEOM의 가장 주목할 만한 특징은 The Line이 될 예정이었다.","word":"notable","opts":["평범한","주목할 만한","불가능한","임시의"],"r":{"a":"2) 주목할 만한","ev":"4번 문장","s":[[4,"NEOM’s most notable feature was supposed to be The Line.","NEOM의 가장 주목할 만한 특징은 The Line이 될 예정이었다."]],"w":"4번은 NEOM의 많은 특징 중에서 The Line이 가장 눈에 띄는 것이라고 소개해요. 그래서 notable은 '주목할 만한'이에요.","c":2},"h":"ab3907b0cb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… were to use automated, smart technologies …)","ko":"… 자동화된 똑똑한 기술을 사용할 예정이었다.","word":"automated","opts":["비밀의","수작업의","자동화된","낡은"],"r":{"a":"3) 자동화된","ev":"7번 문장","s":[[7,"Additionally, important places such as healthcare centers and grocery stores were to use automated, smart technologies and be located within a five-minute walk of people’s homes.","게다가, 보건소와 식료품점 같은 중요한 장소들은 자동화되고 똑똑한 기술을 사용하고 사람들의 집에서 걸어서 5분 거리에 위치할 예정이었다."]],"w":"7번의 장소들은 smart technologies를 쓴다고 했어요. smart와 나란히 쓰인 automated는 기계가 알아서 움직이는 '자동화된'이에요.","c":3},"h":"2d650154f3"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAs a key part of Saudi Arabia’s Vision 2030, it was planned to be a sizable, modern, sustainable city that protects the natural environment.","ko":"밑줄 친 it이 가리키는 것은?","sko":"사우디아라비아의 비전 2030의 핵심 부분으로서, 그것은 자연 환경을 보호하는 크고 현대적이며 지속 가능한 도시로 계획되었다.","opts":["NEOM","The Line","비전 2030","사우디아라비아"],"r":{"a":"1) NEOM","ev":"2~3번 문장","s":[[2,"NEOM is a large-scale urban development project whose name combines neo (new) and the Arabic word mustaqbal (future).","NEOM은 대규모 도시 개발 프로젝트로, 그것의 이름은 ‘neo(새로운)’와 아랍어 단어인 ‘mustaqbal(미래)’이 결합한 것이다."],[3,"As a key part of Saudi Arabia’s Vision 2030, it was planned to be a sizable, modern, sustainable city that protects the natural environment.","사우디아라비아의 비전 2030의 핵심 부분으로서, 그것은 자연 환경을 보호하는 크고 현대적이며 지속 가능한 도시로 계획되었다."]],"w":"2번에서 NEOM을 소개했고, 3번의 it은 그 NEOM을 받아요. NEOM이 비전 2030의 핵심 부분으로서 크고 지속 가능한 도시로 계획되었다는 뜻이에요. The Line은 4번에 처음 나와요.","c":1},"h":"9ddc5581ca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"NEOM, despite facing delays and scale reductions, was once widely regarded as the future of urban living.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 지연과 규모 축소를 마주했지만, NEOM은 한때 도시 생활의 미래로 널리 여겨졌다.","opts":["NEOM은 지연과 규모 축소 덕분에 도시 생활의 미래로 널리 여겨졌다.","NEOM은 도시 생활의 미래로 여겨졌기 때문에 지연과 규모 축소를 겪었다.","NEOM은 지연과 규모 축소를 겪은 뒤로 도시 생활의 미래로 한 번도 여겨지지 않았다.","NEOM은 지연과 규모 축소를 겪었지만, 한때는 도시 생활의 미래로 널리 여겨졌다."],"r":{"a":"4) NEOM은 지연과 규모 축소를 겪었지만, 한때는 도시 생활의 미래로 널리 여겨졌다.","ev":"1번 문장","s":[[1,"NEOM, despite facing delays and scale reductions, was once widely regarded as the future of urban living.","비록 지연과 규모 축소를 마주했지만, NEOM은 한때 도시 생활의 미래로 널리 여겨졌다."]],"w":"despite는 '~에도 불구하고'라서, 어려움이 있었는데도 한때(once) 널리 미래로 여겨졌다는 뜻이에요. 지연이 이유(덕분에, 때문에)가 되는 선지는 despite의 뜻을 거꾸로 읽은 거예요.","c":4},"h":"21762b59a4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["900만 명이 살 것으로 예상되어서 그곳에 넓은 도로가 지어지고 있었다.","The Line에서는 자동차가 허용되지만 전기차만 가능했다.","약 900만 명이 거주할 것으로 예상되었는데도 The Line에는 자동차나 도로가 없을 예정이었다.","The Line은 약 9만 명의 적은 인구를 위해 설계되었다."],"opts":["Nine million people were expected to live in The Line, so wide roads were being built there.","Cars were allowed in The Line, but only electric ones.","The Line was planned to have no cars or roads, even though about nine million people were expected to live there.","The Line was designed for a small population of about ninety thousand people."],"r":{"a":"3) The Line was planned to have no cars or roads, even though about nine million people were expected to live there.","ev":"8번 문장","s":[[8,"Although about nine million people were expected to live in The Line, there were to be no cars or roads.","약 900만 명이 The Line에 거주할 것으로 예상되었지만, 자동차나 도로는 존재하지 않을 예정이었다."]],"w":"8번에서 약 900만 명이 살 예정인데도 자동차나 도로는 없을 예정이라고 해요. 도로가 있다(①), 전기차는 허용된다(②), 인구가 9만 명이다(④)는 모두 본문과 달라요.","c":3},"h":"00c347c03b"},{"n":9,"t":"sum","q":"A fast train system was to be built (A) so that people could (B) throughout The Line.","ko":"사람들이 The Line 곳곳을 (B)할 수 있도록 빠른 기차 시스템이 (A)에 지어질 예정이었다.","oko":["(A) 근처 / (B) 머무르다","(A) 지하 / (B) 머무르다","(A) 근처 / (B) 이동하다","(A) 지하 / (B) 멈추다","(A) 지하 / (B) 이동하다"],"opts":["(A) nearby / (B) stay","(A) underground / (B) stay","(A) nearby / (B) move","(A) underground / (B) stop","(A) underground / (B) move"],"r":{"a":"5) (A) underground / (B) move (지하 / 이동하다)","ev":"9번 문장","s":[[9,"Instead, a fast train system that runs on 100 percent clean energy was to be built underground, helping people to move throughout The Line.","대신에, 100퍼센트 청정 에너지로 운영되는 빠른 기차 시스템이 지하에 지어져서, 사람들이 The Line 곳곳을 이동하는 것을 도울 예정이었다."]],"w":"9번에서 빠른 기차 시스템은 지하(underground)에 지어져서 사람들이 The Line 곳곳을 이동하는(move) 것을 돕는다고 해요. 근처(nearby), 머무르다(stay), 멈추다(stop)는 본문과 맞지 않아요.","c":5},"h":"f098e5a7ae"},{"n":10,"t":"fill","q":"This would have made life more [A] for residents while contributing to the goal of zero carbon [B].","ko":"이것은 거주민들에게 더 [A] 삶을 만들어 주고 탄소 [B] 제로라는 목표에도 기여했을 것이다.","bank":["convenient","emissions","enormous","linear","mirrors","delays"],"bko":{"convenient":"편리한","emissions":"배출","enormous":"거대한","linear":"선형의","mirrors":"거울","delays":"지연"},"r":{"a":"[A] convenient, [B] emissions","ev":"10번 문장","s":[[10,"This would have made life more convenient for residents while contributing to the goal of zero carbon emissions.","이것은 거주민들의 삶을 더 편리하게 만들고 탄소 배출 제로라는 목표에도 기여했을 것이다."]],"w":"10번에서 기차 시스템은 거주민의 삶을 더 편리하게(convenient) 하고 탄소 배출(emissions) 제로라는 목표에 기여해요. enormous, linear는 The Line의 모양을 설명하는 말이고, mirrors는 외관, delays는 1번의 어려움이라 이 자리에 맞지 않아요.","c":null},"h":"fb5c90fccf"}]},{"u":6,"id":"ms1-06-2","no":2,"ko":"질병을 막아주는 신비한 부리","items":[{"n":1,"t":"tf","q":"Plague doctors filled the beak of the mask with herbs because they believed the smell would keep them safe.","ko":"역병 의사들은 그 냄새가 자신들을 안전하게 해 줄 것이라고 믿었기 때문에 마스크의 부리를 허브로 채웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Doctors filled the beak with strong-scented herbs, convinced that smelling these would keep them safe.","의사들은 이러한 것들을 맡는 것이 그들을 계속 안전하게 해줄 것이라고 확신하면서, 그 부리를 강한 향이 나는 허브들로 채웠다."]],"w":"9번에서 의사들은 강한 향의 허브를 부리에 채우고, 이것들을 맡으면 자신들이 안전할 것이라고 확신했어요. 진술문과 같은 내용이에요.","c":"T"},"h":"bfb70541f9"},{"n":2,"t":"tf","q":"People in the 17th century already knew that bacteria spread by flea bites caused the plague.","ko":"17세기 사람들은 벼룩 물림으로 퍼지는 세균이 역병을 일으킨다는 것을 이미 알고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"We now know the plague was caused by a type of bacteria spread by flea bites and contact with infected people.","우리는 이제 그 역병이 벼룩 물림과 감염된 사람들과의 접촉으로 전염되는 세균의 일종에 의해 발생했다는 것을 안다."],[6,"Back then, however, people believed the cause was poisoned air.","그러나 당시에는, 사람들은 그 원인이 오염된 공기라고 믿었다."]],"w":"5번의 We now know는 '지금은' 안다는 뜻이고, 6번에서 당시(Back then) 사람들은 오염된 공기가 원인이라고 믿었어요. 17세기 사람들이 세균을 이미 알았다는 말은 틀려요.","c":"F"},"h":"253896a456"},{"n":3,"t":"tf","q":"The coat and gloves of the doctors were completely useless, while the mask protected them very well.","ko":"의사들의 코트와 장갑은 완전히 쓸모가 없었던 반면, 마스크는 그들을 아주 잘 보호했다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"While the coat and gloves offered limited protection, the mask was almost useless.","코트와 장갑이 제한적인 보호 기능을 제공하긴 했지만, 마스크는 거의 쓸모가 없었다."]],"w":"10번은 반대로 말해요. 코트와 장갑은 제한적이지만 보호를 줬고, 마스크가 거의 쓸모가 없었어요. 진술문은 둘을 서로 바꿔 놓았어요.","c":"F"},"h":"5b8268500a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The defining feature was the long beak of the mask, which made doctors look like birds!)","ko":"가장 눈에 띄는 특성은 마스크의 긴 부리였는데, 이는 의사들이 새처럼 보이게 만들었다!","word":"defining","opts":["가장 눈에 띄는","숨겨진","불필요한","어색한"],"r":{"a":"1) 가장 눈에 띄는","ev":"8번 문장","s":[[8,"The defining feature was the long beak of the mask, which made doctors look like birds!","가장 눈에 띄는 특성은 마스크의 긴 부리였는데, 이는 의사들이 새처럼 보이게 만들었다!"]],"w":"8번은 마스크에서 가장 두드러지는 특징이 긴 부리라고 말하고, 부리 때문에 새처럼 보였다고 설명해요. 그래서 defining feature는 '가장 눈에 띄는 특성'이에요.","c":1},"h":"9d87314493"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… it reappeared in the 17th century, prompting the introduction of plague doctors.)","ko":"… 그것은 17세기에 다시 나타나서, 역병 의사들의 도입을 촉발시켰다.","word":"prompting","opts":["막으며","촉발시키며","늦추며","설명하며"],"r":{"a":"2) 촉발시키며","ev":"2번 문장","s":[[2,"But this plague never truly disappeared; it reappeared in the 17th century, prompting the introduction of plague doctors.","그러나 이 역병은 결코 진정으로 사라지지 않았는데, 그것은 17세기에 다시 나타나서, 역병 의사들의 도입을 촉발시켰다."]],"w":"역병이 다시 나타난 일 때문에 역병 의사들이 등장했으니, 앞의 일이 뒤의 일을 일으킨 거예요. 그래서 prompting은 '촉발시키며'예요.","c":2},"h":"4d83731a34"},{"n":6,"t":"ref","q":"What does the underlined \"Their\" refer to?\nTheir strange outfit was one example.","ko":"밑줄 친 Their가 가리키는 것은?","sko":"그들의 기이한 복장이 한 가지 예시였다.","opts":["감염된 사람들","역병 의사들","유럽 사람들","벼룩들"],"r":{"a":"2) 역병 의사들","ev":"3~4번 문장","s":[[3,"Without understanding the plague’s true cause, these doctors relied on unusual methods to protect themselves while treating the infected.","전염병의 진짜 원인을 이해하지 못한 채, 이 의사들은 감염된 사람들을 치료하는 동안 자신들을 보호하기 위해 특이한 방법들에 의존했다."],[4,"Their strange outfit was one example.","그들의 기이한 복장이 한 가지 예시였다."]],"w":"3번에서 특이한 방법에 의존한 것은 these doctors(이 의사들)예요. 4번의 Their는 그 의사들을 받고, 기이한 복장은 그들이 쓴 방법의 한 예시예요.","c":2},"h":"5f982de9b0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Nose holes poked into the beak to let the wearers breathe allowed germs to enter, causing them to be infected!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"착용자들이 숨을 쉴 수 있게 하기 위해 부리에 뚫린 코 구멍은 세균이 침투할 수 있도록 했고, 그들을 감염되게 했다!","opts":["마스크에 뚫은 코 구멍은 세균이 들어오는 것을 막아 착용자가 감염되지 않게 했다.","착용자가 감염된 탓에 마스크에 코 구멍이 뚫리게 되었다.","마스크에 뚫은 코 구멍은 착용자가 숨을 쉬게 했지만 세균이 들어오게 하여 감염을 일으켰다.","마스크에 뚫은 코 구멍 때문에 세균이 밖으로 나가지 못했다."],"r":{"a":"3) 마스크에 뚫은 코 구멍은 착용자가 숨을 쉬게 했지만 세균이 들어오게 하여 감염을 일으켰다.","ev":"11번 문장","s":[[11,"Nose holes poked into the beak to let the wearers breathe allowed germs to enter, causing them to be infected!","착용자들이 숨을 쉴 수 있게 하기 위해 부리에 뚫린 코 구멍은 세균이 침투할 수 있도록 했고, 그들을 감염되게 했다!"]],"w":"Nose holes ... to let the wearers breathe는 숨 쉬게 하려고 뚫은 코 구멍이에요. 그 구멍이 allowed germs to enter(세균이 들어오게 했다)이고, causing them to be infected는 그 결과 감염되었다는 뜻이에요.","c":3},"h":"2183d588ca"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Charles de Lorme은 세균이 역병의 원인임을 알게 된 뒤 부리 마스크를 발명한 독일 의사였다.","복장에는 얇은 면 코트, 장갑, 마스크가 포함되었다.","그 복장은 피부가 오염된 공기에 닿지 않게 하려고 설계되었다.","그 복장은 의사들을 벼룩 물림으로부터 보호하려고 만들어졌다."],"opts":["Charles de Lorme was a German physician who invented the beak mask after learning that bacteria caused the plague.","The outfit included a thin cotton coat, gloves, and a mask.","The outfit was designed to keep the skin from touching contaminated air.","The outfit was made to protect doctors from flea bites."],"r":{"a":"3) The outfit was designed to keep the skin from touching contaminated air.","ev":"7번 문장","s":[[7,"Based on this poor medical knowledge, a French physician named Charles de Lorme devised an outfit consisting of a thick leather coat, gloves, and a mask to prevent the skin from coming into contact with contaminated air.","이러한 빈약한 의학 지식에 근거하여, Charles de Lorme이라는 이름의 프랑스 의사는 오염된 공기와 피부가 접촉하는 것을 방지하기 위해 두꺼운 가죽 코트, 장갑, 그리고 마스크로 구성된 복장을 고안했다."]],"w":"7번에서 프랑스 의사 Charles de Lorme은 피부가 오염된 공기와 접촉하지 않게 하려고 복장을 고안했어요. 독일 의사(①), 얇은 면 코트(②), 벼룩 물림 방지(④)는 본문과 달라요. 세균이 원인이라는 사실은 5번처럼 지금 알려진 것이에요.","c":3},"h":"74785452dd"},{"n":9,"t":"sum","q":"Plague doctors wore a bird-beaked outfit based on a (A) belief about the cause of the plague, but it proved (B) in protecting them.","ko":"역병 의사들은 역병의 원인에 대한 (A) 믿음에 근거해 새 부리 모양 복장을 입었지만, 그들을 보호하는 데 (B) 것으로 드러났다.","oko":["(A) 과학적인 / (B) 효과적인","(A) 올바른 / (B) 효과 없는","(A) 잘못된 / (B) 효과적인","(A) 과학적인 / (B) 효과 없는","(A) 잘못된 / (B) 효과 없는"],"opts":["(A) scientific / (B) effective","(A) correct / (B) ineffective","(A) mistaken / (B) effective","(A) scientific / (B) ineffective","(A) mistaken / (B) ineffective"],"r":{"a":"5) (A) mistaken / (B) ineffective","ev":"6번, 11번 문장","s":[[6,"Back then, however, people believed the cause was poisoned air.","그러나 당시에는, 사람들은 그 원인이 오염된 공기라고 믿었다."],[11,"Nose holes poked into the beak to let the wearers breathe allowed germs to enter, causing them to be infected!","착용자들이 숨을 쉴 수 있게 하기 위해 부리에 뚫린 코 구멍은 세균이 침투할 수 있도록 했고, 그들을 감염되게 했다!"]],"w":"6번에서 당시 사람들은 오염된 공기가 원인이라고 믿었는데 5번을 보면 그건 틀린(mistaken) 믿음이에요. 11번에서 마스크의 코 구멍이 세균을 들어오게 해 감염되었으니 보호에는 효과가 없었어요(ineffective).","c":5},"h":"8e3b5ca31d"},{"n":10,"t":"fill","q":"In the 14th century, a deadly [A] known as the Black Death swept across Europe, claiming nearly a third of the continent’s [B].","ko":"14세기에, 흑사병으로 알려진 치명적인 [A]이(가) 그 대륙 [B]의 거의 3분의 1을 앗아가면서 유럽 전역을 휩쓸었다.","bank":["epidemic","population","outfit","herbs","beak","flea"],"bko":{"epidemic":"전염병","population":"인구","outfit":"복장","herbs":"허브","beak":"부리","fl
