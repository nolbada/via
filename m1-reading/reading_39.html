ar. Seeing the blue ocean and the green islands were fantastic!", "ko": "우리는 통영을 방문했고 케이블카를 타고 산에 올라갔다. 파란 바다와 녹색의 섬들을 보는 것은 환상적이었다!", "ok": false, "foot": [], "fixes": [{"wrong": "with", "right": "by", "partial": false, "at": [8], "point": "기본전치사: 교통수단은 전치사 by 사용", "topic": "기본전치사", "memo": "교통수단은 전치사 by 사용"}, {"wrong": "were", "right": "was", "partial": false, "at": [19], "point": "be동사: 동명사 주어 Seeing은 단수라 was 사용", "topic": "be동사", "memo": "동명사 주어 Seeing은 단수라 was 사용"}]}, {"n": 7, "tag": null, "en": "Near the sea, we found a local restaurant and ate chungmugimbap. It wasn't like other type of gimbap.", "ko": "바다 근처에서 우리는 현지 식당을 찾았고 충무김밥을 먹었다. 그것은 다른 종류의 김밥과는 달랐다.", "ok": false, "foot": [], "fixes": [{"wrong": "type", "right": "types", "partial": false, "at": [15], "point": "명사의 복수형: other 뒤에는 복수명사 types 사용", "topic": "명사의 복수형", "memo": "other 뒤에는 복수명사 types 사용"}]}, {"n": 8, "tag": null, "en": "There were only rice inside the seaweed. Kimchi and spicy squid were on the side.", "ko": "김 안에는 오직 밥만 있었다. 김치와 매운 오징어가 옆에 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [1], "point": "be동사: only rice(단수) 앞에는 There was 사용", "topic": "be동사", "memo": "only rice(단수) 앞에는 There was 사용"}]}, {"n": 9, "tag": null, "en": "It was spicy but really delicious. I heard about the history of these food.", "ko": "그것은 매웠지만 정말 맛있었다. 나는 이 음식의 역사에 관해 들었다.", "ok": false, "foot": [], "fixes": [{"wrong": "these", "right": "this", "partial": false, "at": [12], "point": "지시형용사: food는 단수라 this food 사용", "topic": "지시형용사", "memo": "food는 단수라 this food 사용"}]}, {"n": 10, "tag": null, "en": "Chungmu is an old name for Tongyeong.", "ko": "충무는 통영의 옛 이름이다.", "ok": true, "foot": [], "fixes": []}, {"n": 11, "tag": null, "en": "Long ago, fishermans in this town started to eat chungmugimbap because it did not goes bad quickly.", "ko": "오래전에, 이 마을의 어부들은 이 음식이 빨리 상하지 않았기 때문에 충무김밥을 먹기 시작했다.", "ok": false, "foot": [], "fixes": [{"wrong": "fishermans", "right": "fishermen", "partial": false, "at": [2], "point": "불규칙 복수형: fisherman의 복수는 fishermen", "topic": "불규칙 복수형", "memo": "fisherman의 복수는 fishermen"}, {"wrong": "goes", "right": "go", "partial": false, "at": [14], "point": "do 부정문: did not 뒤에는 동사원형 go 사용", "topic": "do 부정문", "memo": "did not 뒤에는 동사원형 go 사용"}]}, {"n": 12, "tag": "8월 2일 · 제주도", "en": "Jeju-do is a beautifully island in Korea. We went there on a very hot day, and we becomed tired.", "ko": "제주도는 한국의 아름다운 섬이다. 우리는 매우 더운 날에 거기에 갔고 피곤해졌다.", "ok": false, "foot": [], "fixes": [{"wrong": "beautifully", "right": "beautiful", "partial": false, "at": [3], "point": "형용사와 부사: 명사 island 앞에는 형용사 beautiful 사용", "topic": "형용사와 부사", "memo": "명사 island 앞에는 형용사 beautiful 사용"}, {"wrong": "becomed", "right": "became", "partial": false, "at": [17], "point": "불규칙 과거형: become의 과거형은 becomed가 아니라 became", "topic": "불규칙 과거형", "memo": "become의 과거형은 becomed가 아니라 became"}]}, {"n": 13, "tag": null, "en": "However, we got our energy back thanks to dombegogi. It surprised I in two ways.", "ko": "그러나 돔베고기 덕분에 우리는 기운을 되찾았다. 그것은 두 가지 면으로 나를 놀라게 했다.", "ok": false, "foot": [], "fixes": [{"wrong": "I", "right": "me", "partial": false, "at": [11], "point": "인칭대명사의 목적격: 동사 뒤 목적어는 목적격 me 사용", "topic": "인칭대명사의 목적격", "memo": "동사 뒤 목적어는 목적격 me 사용"}]}, {"n": 14, "tag": null, "en": "First, it was pork on a cutting board, not at a plate. Second, the meat was so soft!", "ko": "첫째로, 그것은 접시 위가 아닌 도마 위의 돼지고기였다. 둘째로, 고기가 아주 부드러웠다!", "ok": false, "foot": [], "fixes": [{"wrong": "at", "right": "on", "partial": false, "at": [9], "point": "기본전치사: '접시 위에'는 전치사 on 사용", "topic": "기본전치사", "memo": "'접시 위에'는 전치사 on 사용"}]}, {"n": 15, "tag": null, "en": "I had it with a special fish sauce, and the sauce were great, too. Later, I learned about the meaning of dombe.", "ko": "나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다. 나중에 나는 돔베의 의미에 대해 배웠다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [11], "point": "be동사: 단수 주어 the sauce에는 was 사용", "topic": "be동사", "memo": "단수 주어 the sauce에는 was 사용"}]}, {"n": 16, "tag": null, "en": "It mean a cutting board in Jeju's language.", "ko": "그것은 제주 말로 도마를 의미한다.", "ok": false, "foot": [], "fixes": [{"wrong": "mean", "right": "means", "partial": false, "at": [1], "point": "3인칭 단수 현재형: 주어 It에는 means 사용", "topic": "3인칭 단수 현재형", "memo": "주어 It에는 means 사용"}]}];var PP=[["During the summer vacation, William traveled around Korea with his family.", "여름 방학 동안, William은 가족과 함께 한국 여기저기를 여행했다.", 1], ["This is his food diary.", "이것은 그의 음식 일기이다.", 0], ["July 25", "7월 25일", 1], ["We went to Damyang and visited Jungnogwon, a famous bamboo garden.", "우리는 담양에 갔고 유명한 대나무 정원인 죽녹원을 방문했다.", 1], ["We enjoyed walking in the garden.", "우리는 정원에서 걷는 것을 즐겼다.", 0], ["After we looked around, we ate two local dishes, daetongbap and tteokgalbi.", "주변을 둘러본 후에, 우리는 두 가지 지역 음식인 대통밥과 떡갈비를 먹었다.", 0], ["Daetongbap is rice in a bamboo bowl.", "대통밥은 대나무 그릇에 담긴 밥이다.", 0], ["I loved its unique bamboo smell.", "나는 그것의 독특한 대나무 향이 매우 좋았다.", 0], ["Tteokgalbi, a Korean beef dish, was soft and sweet.", "한국의 소고기 요리인 떡갈비는 부드럽고 달콤했다.", 0], ["The dishes really went well together.", "그 요리들은 함께 정말 잘 어울렸다.", 0], ["July 30", "7월 30일", 1], ["We visited Tongyeong and went up the mountain by cable car.", "우리는 통영을 방문했고 케이블카를 타고 산에 올라갔다.", 1], ["Seeing the blue ocean and the green islands was fantastic!", "파란 바다와 녹색의 섬들을 보는 것은 환상적이었다!", 0], ["Near the sea, we found a local restaurant and ate chungmugimbap.", "바다 근처에서 우리는 현지 식당을 찾았고 충무김밥을 먹었다.", 0], ["It wasn't like other types of gimbap.", "그것은 다른 종류의 김밥과는 달랐다.", 0], ["There was only rice inside the seaweed.", "김 안에는 오직 밥만 있었다.", 0], ["Kimchi and spicy squid were on the side.", "김치와 매운 오징어가 옆에 있었다.", 0], ["It was spicy but really delicious.", "그것은 매웠지만 정말 맛있었다.", 0], ["I heard about the history of this food.", "나는 이 음식의 역사에 관해 들었다.", 0], ["Chungmu is an old name for Tongyeong.", "충무는 통영의 옛 이름이다.", 0], ["Long ago, fishermen in this town started to eat chungmugimbap because it did not go bad quickly.", "오래전에, 이 마을의 어부들은 이 음식이 빨리 상하지 않았기 때문에 충무김밥을 먹기 시작했다.", 0], ["August 2", "8월 2일", 1], ["Jeju-do is a beautiful island in Korea.", "제주도는 한국의 아름다운 섬이다.", 1], ["We went there on a very hot day, and we became tired.", "우리는 매우 더운 날에 거기에 갔고 피곤해졌다.", 0], ["However, we got our energy back thanks to dombegogi.", "그러나 돔베고기 덕분에 우리는 기운을 되찾았다.", 0], ["It surprised me in two ways.", "그것은 두 가지 면으로 나를 놀라게 했다.", 0], ["First, it was pork on a cutting board, not on a plate.", "첫째로, 그것은 접시 위가 아닌 도마 위의 돼지고기였다.", 0], ["Second, the meat was so soft!", "둘째로, 고기가 아주 부드러웠다!", 0], ["I had it with a special fish sauce, and the sauce was great, too.", "나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다.", 0], ["Later, I learned about the meaning of dombe.", "나중에 나는 돔베의 의미에 대해 배웠다.", 0], ["It means a cutting board in Jeju's language.", "그것은 제주 말로 도마를 의미한다.", 0]];var RNUM=39;var TITLE_EN="My Korean Food Diary";var PASS_EN=["My Korean Food Diary", "During the summer vacation, William traveled around Korea with his family. This is his food diary.", "July 25", "We went to Damyang and visited Jungnogwon, a famous bamboo garden. We enjoyed walking in the garden. After we looked around, we ate two local dishes, daetongbap and tteokgalbi. Daetongbap is rice in a bamboo bowl. I loved its unique bamboo smell. Tteokgalbi, a Korean beef dish, was soft and sweet. The dishes really went well together.", "July 30", "We visited Tongyeong and went up the mountain by cable car. Seeing the blue ocean and the green islands was fantastic! Near the sea, we found a local restaurant and ate chungmugimbap. It wasn't like other types of gimbap. There was only rice inside the seaweed. Kimchi and spicy squid were on the side. It was spicy but really delicious. I heard about the history of this food. Chungmu is an old name for Tongyeong. Long ago, fishermen in this town started to eat chungmugimbap because it did not go bad quickly.", "August 2", "Jeju-do is a beautiful island in Korea. We went there on a very hot day, and we became tired. However, we got our energy back thanks to dombegogi. It surprised me in two ways. First, it was pork on a cutting board, not on a plate. Second, the meat was so soft! I had it with a special fish sauce, and the sauce was great, too. Later, I learned about the meaning of dombe. It means a cutting board in Jeju's language."];var PASS_KO=["나의 한국 음식 일기", "여름 방학 동안, William은 가족과 함께 한국 여기저기를 여행했다. 이것은 그의 음식 일기이다.", "7월 25일", "우리는 담양에 갔고 유명한 대나무 정원인 죽녹원을 방문했다. 우리는 정원에서 걷는 것을 즐겼다. 주변을 둘러본 후에, 우리는 두 가지 지역 음식인 대통밥과 떡갈비를 먹었다. 대통밥은 대나무 그릇에 담긴 밥이다. 나는 그것의 독특한 대나무 향이 매우 좋았다. 한국의 소고기 요리인 떡갈비는 부드럽고 달콤했다. 그 요리들은 함께 정말 잘 어울렸다.", "7월 30일", "우리는 통영을 방문했고 케이블카를 타고 산에 올라갔다. 파란 바다와 녹색의 섬들을 보는 것은 환상적이었다! 바다 근처에서 우리는 현지 식당을 찾았고 충무김밥을 먹었다. 그것은 다른 종류의 김밥과는 달랐다. 김 안에는 오직 밥만 있었다. 김치와 매운 오징어가 옆에 있었다. 그것은 매웠지만 정말 맛있었다. 나는 이 음식의 역사에 관해 들었다. 충무는 통영의 옛 이름이다. 오래전에, 이 마을의 어부들은 이 음식이 빨리 상하지 않았기 때문에 충무김밥을 먹기 시작했다.", "8월 2일", "제주도는 한국의 아름다운 섬이다. 우리는 매우 더운 날에 거기에 갔고 피곤해졌다. 그러나 돔베고기 덕분에 우리는 기운을 되찾았다. 그것은 두 가지 면으로 나를 놀라게 했다. 첫째로, 그것은 접시 위가 아닌 도마 위의 돼지고기였다. 둘째로, 고기가 아주 부드러웠다! 나는 그것을 특별한 생선 소스와 함께 먹었는데, 그 소스도 훌륭했다. 나중에 나는 돔베의 의미에 대해 배웠다. 그것은 제주 말로 도마를 의미한다."];
