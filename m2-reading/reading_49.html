ld";var PASS_EN=["Voices from the Sports Field", "Do you love sports? If you do, you can have a career in sports. Let’s meet some people who are working in the sports field.", "Hello, Ms. Ali. Can you tell me why you became a sports journalist?", "Well, I’ve always had a passion for sports and writing. Writing about sports makes me excited.", "There was a big baseball game yesterday. How did you spend the day?", "I arrived at the baseball park early. Before the game started, I had an interview with the players. I took a lot of notes during the game. After the game, I went to the press conference with other journalists. I asked the players how they felt about the game. In the afternoon, I had to write an article and edit it very quickly. My article was posted online. I love writing about sports.", "Mr. Davis. Do you like your job as a sports agent?", "Yes. I love sports, and I enjoy everything about business. I think my job is perfect for me.", "Can you tell me more about your job?", "When my clients have a new contract to sign, I check it carefully. I do my best to make the contract fair for them. Also, I often receive phone calls from advertising companies. They want my clients in their advertisements. Then, I try to get the best deal for my clients."];var PASS_KO=["스포츠 현장의 목소리", "당신은 스포츠를 좋아하시나요? 그렇다면, 당신은 스포츠 분야에서 직업을 가질 수 있습니다. 스포츠 현장에서 일하고 있는 몇몇 사람들을 만나 봅시다.", "안녕하세요, Ali 씨. 왜 스포츠 기자가 되셨는지 말씀해 주시겠어요?", "음, 저는 항상 스포츠와 글쓰기에 대한 열정을 가지고 있었습니다. 스포츠에 관해 글을 쓰는 것은 저를 신나게 합니다.", "어제 큰 야구 경기가 있었습니다. 하루를 어떻게 보내셨나요?", "저는 야구장에 일찍 도착했습니다. 경기가 시작되기 전에 저는 선수들과 인터뷰를 했습니다. 경기 중에는 메모를 많이 했습니다. 경기 후에는 다른 기자들과 기자 회견에 갔습니다. 저는 선수들에게 경기에 대해 어떻게 느꼈는지 물었습니다. 오후에는 기사를 작성하고 그것을 매우 빠르게 편집해야 했습니다. 제 기사는 온라인에 게시되었습니다. 저는 스포츠에 관한 글을 쓰는 것을 매우 좋아합니다.", "Davis 씨. 스포츠 에이전트로서의 당신의 직업이 마음에 드시나요?", "네. 저는 스포츠를 매우 좋아하고 사업에 관한 모든 것을 즐깁니다. 제 직업은 저에게 완벽하다고 생각합니다.", "당신의 직업에 대해 좀 더 말씀해 주시겠어요?", "제 고객이 서명할 새로운 계약이 있을 때, 저는 그것을 신중하게 확인합니다. 저는 그들을 위해 계약을 공정하게 만들기 위해 최선을 다합니다. 또한 저는 종종 광고 회사로부터 전화를 받습니다. 그
