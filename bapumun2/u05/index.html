가지 않을 것이다.", "ok": false, "why": "be going to의 부정이라서 맞아요."}, {"n": "③", "en": "I don't have to go to school today.", "ko": "나는 오늘 학교에 갈 필요가 없다.", "ok": false, "why": "don't have to + 동사원형이라서 맞아요."}, {"n": "④", "en": "You had not better open the box.", "ko": "너는 그 상자를 열지 않는 게 좋다.", "ok": true, "why": "not의 위치가 틀려요. had better not이 맞아요."}, {"n": "⑤", "en": "You will be a good swimmer someday.", "ko": "너는 언젠가 훌륭한 수영 선수가 될 것이다.", "ok": false, "why": "will + be로 맞아요."}], "pencil": "had better의 부정은 had better ___", "pencilKey": "not", "page": 51, "sec": "s1"}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 04 통합형", "type": "mc", "ans": "②", "concept": ["013"], "gap": "", "words": [["late for school", "학교에 지각한"], ["get up early", "일찍 일어나다"], ["advice", "충고"]], "h1": "Alice는 매일 학교에 지각해요. 그녀에게 해 줄 충고는 '일찍 일어나야 한다'예요. 어떤 조동사가 필요할까요?", "h2": "보기에서 must는 의무, has to는 3인칭 단수용 의무, should not은 금지예요. 주어가 You인 점도 확인하세요.", "why": "학교에 늦지 않으려면 일찍 일어나'야 한다'는 의무이므로 must가 알맞아요. has to는 주어 You와 맞지 않아요.", "opts": [{"n": "①", "en": "would", "ko": "~하곤 했다", "ok": false, "why": "과거의 습관이라서 충고가 되지 않아요."}, {"n": "②", "en": "must", "ko": "~해야 한다", "ok": true, "why": "일찍 일어나야 한다는 의무로 알맞아요."}, {"n": "③", "en": "has to", "ko": "~해야 한다(3인칭 단수)", "ok": false, "why": "주어가 You라서 has to는 맞지 않아요."}, {"n": "④", "en": "may", "ko": "~해도 된다", "ok": false, "why": "허락이라서 지각을 고치려는 충고가 아니에요."}, {"n": "⑤", "en": "should not", "ko": "~하면 안 된다", "ok": false, "why": "금지라서 '일찍 일어나'와 반대예요."}], "pencil": "'~해야 한다'는 의무는 ___ + 동사원형", "pencilKey": "must", "page": 51, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 04 통합형", "type": "mc", "ans": "③", "concept": ["013"], "gap": "", "words": [["take the medicine", "약을 먹다"], ["hand in", "제출하다"], ["pick up", "차로 데리러 가다"], ["math test", "수학 시험"]], "h1": "각 문장의 주어에 맞는 have to/has to 모양인지 확인해 보세요. 주어가 3인칭 단수인지, we나 they처럼 복수인지 보세요.", "h2": "has to는 주어가 he, she, it, 단수 명사일 때만 써요. 주어가 We, They, You라면 어떤 모양을 쓸까요?", "why": "③은 주어가 We(복수)인데 has to를 써서 틀렸어요. have to로 고쳐야 해요.", "opts": [{"n": "①", "en": "She doesn't have to take the medicine anymore.", "ko": "그녀는 더는 약을 먹을 필요가 없다.", "ok": false, "why": "주어 She에 doesn't have to로 맞아요."}, {"n": "②", "en": "They didn't have to take a bus because Mr. Brown picked them up.", "ko": "Brown 씨가 그들을 태워 주어서 그들은 버스를 탈 필요가 없었다.", "ok": false, "why": "과거 부정 didn't have to로 맞아요."}, {"n": "③", "en": "We has to hand in the homework by tomorrow.", "ko": "우리는 내일까지 숙제를 제출해야 한다.", "ok": true, "why": "주어 We에는 has가 아니라 have to를 써요. 정답이에요."}, {"n": "④", "en": "I had to study hard yesterday because the math test is today.", "ko": "수학 시험이 오늘이라서 나는 어제 열심히 공부해야 했다.", "ok": false, "why": "yesterday가 있어서 과거형 had to가 맞아요."}, {"n": "⑤", "en": "You must do it, but you don't have to do it right now.", "ko": "너는 그것을 해야 하지만 지금 당장 할 필요는 없다.", "ok": false, "why": "must는 의무, don't have to는 필요 없음이라 맞아요."}], "pencil": "주어 We, They, You에는 ___ to, he, she에는 has to", "pencilKey": "have", "page": 51, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "조동사의 형태와 의미/조동사의 시제와 부정", "type": "mc", "ans": "①", "concept": ["013"], "gap": "", "words": [["look tired", "피곤해 보이다"], ["vitamins", "비타민"], ["after a meal", "식사 후에"], ["medicine", "약"]], "h1": "A는 '너 무척 피곤해 보인다. 식사 후에 비타민을 먹는 게 좋을 것 같아'라고 해요. 빈칸에 들어갈 말은 '조언'의 뜻이에요.", "h2": "'~하는 게 좋다 / ~해야 한다'라는 조언을 하는 조동사를 찾아 보세요. may not은 '~ 아닐지도 모른다'는 추측이라 방향이 달라요.", "why": "친구에게 조언하는 문장이라서 '~해야 한다'의 should가 알맞아요.", "opts": [{"n": "①", "en": "should", "ko": "~해야 한다, ~하는 게 좋다", "ok": true, "why": "조언하는 뜻이라서 알맞아요."}, {"n": "②", "en": "would", "ko": "~하곤 했다", "ok": false, "why": "과거의 습관이라서 조언이 아니에요."}, {"n": "③", "en": "have", "ko": "가지다", "ok": false, "why": "조동사가 아니라서 동사원형 take 앞에 올 수 없어요."}, {"n": "④", "en": "can", "ko": "~할 수 있다", "ok": false, "why": "능력이라서 조언하는 뜻이 아니에요."}, {"n": "⑤", "en": "may not", "ko": "~하지 않을지도 모른다", "ok": false, "why": "약한 추측의 부정이라 조언이 아니에요."}], "pencil": "조언은 ___ + 동사원형", "pencilKey": "should", "page": 52, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "조동사의 형태와 의미/조동사의 시제와 부정", "type": "mc", "ans": "⑤", "concept": ["058"], "gap": "", "words": [["gym", "체육관"], ["building", "건물"], ["read lots of books", "책을 많이 읽다"], ["video clips", "동영상"]], "h1": "두 문장 모두 'but now ~(하지만 지금은 ~)'이 이어져요. 지금과 비교해서 과거의 모습을 말하는 문장이에요.", "h2": "과거의 상태(있었다)와 과거의 습관(하곤 했다)은 똑같이 「___ + 동사원형」으로 말해요. 이 표현이 무엇인지 떠올려 보세요.", "why": "예전에는 있었는데 지금은 없는 상태와, 예전에는 책을 많이 읽었던 습관 모두 used to로 말해요.", "opts": [{"n": "①", "en": "can", "ko": "~할 수 있다", "ok": false, "why": "능력이라서 '예전에는 ~했다'는 뜻이 아니에요."}, {"n": "②", "en": "may", "ko": "~일지도 모른다", "ok": false, "why": "추측이라서 과거와 지금을 비교하는 뜻이 아니에요."}, {"n": "③", "en": "would", "ko": "~하곤 했다", "ok": false, "why": "과거의 습관은 되지만 There ___ be a gym처럼 상태에는 쓰지 않아요."}, {"n": "④", "en": "has", "ko": "가지다", "ok": false, "why": "조동사가 아니라서 동사원형 be 앞에 올 수 없어요."}, {"n": "⑤", "en": "used to", "ko": "~하곤 했다, ~이었다", "ok": true, "why": "과거의 습관과 상태에 모두 쓸 수 있어서 두 빈칸에 모두 알맞아요."}], "pencil": "예전에는 그랬지만 지금은 아니면 ___ + 동사원형", "pencilKey": "used to", "page": 52, "sec": "s2"}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "조동사의 형태와 의미/조동사의 시제와 부정", "type": "mc", "ans": "③", "concept": ["013", "058"], "gap": "may(약한 추측), must(강한 추측), cannot(~일 리 없다)처럼 추측을 말하는 조동사", "words": [["lose weight", "살을 빼다"], ["eating habits", "식습관"], ["it gets dark", "어두워진다"], ["short hair", "짧은 머리"]], "h1": "세 빈칸은 각각 충고, 약한 추측, 과거의 상태예요. 문장의 상황(살을 빼려면, 확실하지 않지만, 어렸을 때)을 먼저 읽어 보세요.", "h2": "(A)는 조언, (B)는 I'm not sure로 시작하니 약한 추측, (C)는 '어렸을 때 ~였다'라는 과거의 상태를 말해요. 각각에 맞는 조동사를 떠올리세요.", "why": "(A) 조언은 should, (B) 약한 추측은 may, (C) 과거의 상태는 used to예요.", "opts": [{"n": "①", "en": "should - must - will", "ko": "해야 한다 - 해야 한다 - 할 것이다", "ok": false, "why": "(B)는 I'm not sure라서 must가 아니에요."}, {"n": "②", "en": "should not - must - used to", "ko": "하면 안 된다 - 해야 한다 - 하곤 했다", "ok": false, "why": "(A)가 조언이 아니라 금지라서 틀려요."}, {"n": "③", "en": "should - may - used to", "ko": "해야 한다 - 일지도 모른다 - 하곤 했다", "ok": true, "why": "(A) 조언, (B) 약한 추측, (C) 과거의 상태로 모두 알맞아요."}, {"n": "④", "en": "could - should - will", "ko": "할 수 있었다 - 해야 한다 - 할 것이다", "ok": false, "why": "(A)는 조언이 아니고 (B)는 추측이 아니라서 틀려요."}, {"n": "⑤", "en": "could not - should - used to", "ko": "할 수 없었다 - 해야 한다 - 하곤 했다", "ok": false, "why": "(A)가 '식습관을 바꿀 수 없었다'가 되어 어색하고 (B)가 추측이 아니에요."}], "pencil": "조언 should / 약한 추측 ___ / 과거의 상태 used to", "pencilKey": "may", "page": 52, "sec": "s2"}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "조동사의 형태와 의미/조동사의 시제와 부정", "type": "mc", "ans": "⑤", "concept": ["013"], "gap": "", "words": [["very sick", "매우 아픈"], ["yesterday", "어제"], ["presentation", "발표"], ["practice hard", "열심히 연습하다"]], "h1": "첫 문장은 어제 아파서 학교에 갈 수 '없었다', 둘째는 오늘 발표가 있어서 어제 연습해'야 했다'예요. yesterday가 두 문장에 모두 있다는 점에 주의하세요.", "h2": "과거에 할 수 없었던 일은 couldn't, 과거에 해야 했던 일은 had to예요. have to의 과거형이 무엇인지 떠올려 보세요.", "why": "첫째는 '갈 수 없었다'라서 couldn't, 둘째는 '연습해야 했다'라서 had to예요.", "opts": [{"n": "①", "en": "couldn't - have to", "ko": "할 수 없었다 - 해야 한다", "ok": false, "why": "둘째 문장이 yesterday라서 have to가 아니라 had to여야 해요."}, {"n": "②", "en": "should - could", "ko": "해야 한다 - 할 수 있었다", "ok": false, "why": "둘째 문장이 '연습할 수 있었다'가 되어 어색해요."}, {"n": "③", "en": "shouldn't - could", "ko": "하면 안 된다 - 할 수 있었다", "ok": false, "why": "첫 문장 의미와 둘째 문장 의미 모두 맞지 않아요."}, {"n": "④", "en": "must - didn't", "ko": "해야 한다 - 하지 않았다", "ok": false, "why": "형태도 뜻도 맞지 않아요."}, {"n": "⑤", "en": "couldn't - had to", "ko": "할 수 없었다 - 해야 했다", "ok": true, "why": "과거의 불가능과 과거의 의무로 모두 알맞아요."}], "pencil": "have to의 과거형은 ___", "pencilKey": "had to", "page": 52, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "조동사의 형태와 의미/조동사의 시제와 부정", "type": "mc", "ans": "⑤", "concept": ["013"], "gap": "don't have to(~할 필요 없다)와 must not(~하면 안 된다)의 차이", "words": [["boyfriend", "남자 친구"], ["change your ID", "아이디를 바꾸다"], ["waste time", "시간을 낭비하다"], ["wear a uniform", "교복을 입다"]], "h1": "'우리말 해석이 옳지 않은 것'을 고르는 문제예요. 각 조동사의 뜻을 정확하게 하나씩 떠올려 보세요.", "h2": "cannot be는 '~일 리 없다', must not은 '~하면 안 된다', don't have to는 '~할 필요가 없다'예요. 이 구별이 핵심이에요.", "why": "⑤ don't have to wear는 '입을 필요가 없다'인데 '입지 말아야 한다'로 해석해서 틀렸어요.", "opts": [{"n": "①", "en": "He cannot be her boyfriend. - ~일 리 없다", "ko": "그는 그녀의 남자 친구일 리 없다.", "ok": false, "why": "cannot be는 '~일 리 없다'라서 해석이 맞아요."}, {"n": "②", "en": "You must change your ID and password. - 바꿔야 한다", "ko": "너는 아이디와 비밀번호를 바꿔야 한다.", "ok": false, "why": "must는 의무라서 해석이 맞아요."}, {"n": "③", "en": "Judy had to finish her homework before dinner. - 끝내야 했다", "ko": "Judy는 저녁 식사 전에 숙제를 끝내야 했다.", "ok": false, "why": "had to는 과거의 의무라서 해석이 맞아요."}, {"n": "④", "en": "We must not waste any more time. - 낭비해서는 안 된다", "ko": "우리는 더는 시간을 낭비해서는 안 된다.", "ok": false, "why": "must not은 금지라서 해석이 맞아요."}, {"n": "⑤", "en": "You don't have to wear your uniform. - 입지 말아야 한다", "ko": "너는 교복을 입을 필요가 없다. - 입지 말아야 한다", "ok": true, "why": "don't have to는 '입을 필요가 없다'라서 '입지 말아야 한다'는 틀린 해석이에요."}], "pencil": "don't have to = ~할 ___ 가 없다", "pencilKey": "필요", "page": 52, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "같은 쓰임/다른 쓰임의 조동사", "type": "mc", "ans": "④", "concept": ["013"], "gap": "may(약한 추측), must(강한 추측), cannot(~일 리 없다)처럼 추측을 말하는 조동사", "words": [["get up early", "일찍 일어나다"], ["keep quiet", "조용히 하다"], ["fantastic", "환상적인"], ["sick", "아픈"]], "h1": "다섯 문장 모두 must예요. 의무(~해야 한다)인지 강한 추측(~임에 틀림없다)인지 하나씩 판단해 보세요.", "h2": "must가 'You don't look well. You must be sick.'처럼 상태를 짐작하는 문장에서는 어떤 뜻일까요? 나머지는 모두 '~해야 한다'라는 뜻이에요.", "why": "④는 '아픈 게 틀림없다'는 강한 추측이에요. 나머지는 모두 '~해야 한다'는 의무예요.", "opts": [{"n": "①", "en": "You must get up early tomorrow.", "ko": "너는 내일 일찍 일어나야 한다.", "ok": false, "why": "의무의 must예요."}, {"n": "②", "en": "You must keep quiet in the library.", "ko": "너는 도서관에서 조용히 해야 한다.", "ok": false, "why": "의무의 must예요."}, {"n": "③", "en": "It's a fantastic film. You must see it.", "ko": "그것은 환상적인 영화다. 너는 꼭 봐야 한다.", "ok": false, "why": "강하게 권하는 의무의 must예요."}, {"n": "④", "en": "You don't look well. You must be sick.", "ko": "너는 안 좋아 보여. 너는 아픈 게 틀림없어.", "ok": true, "why": "강한 추측의 must라서 나머지와 달라요."}, {"n": "⑤", "en": "You must clean your room right now.", "ko": "너는 지금 당장 방을 청소해야 한다.", "ok": false, "why": "의무의 must예요."}], "pencil": "must + be (상태)는 ___ ", "pencilKey": "강한 추측", "page": 52, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "같은 쓰임/다른 쓰임의 조동사", "type": "mc", "ans": "④", "concept": ["012"], "gap": "may(약한 추측), must(강한 추측), cannot(~일 리 없다)처럼 추측을 말하는 조동사", "words": [["come home late", "집에 늦게 오다"], ["May you live long!", "오래 사시길!"], ["May (달)", "5월"], ["use the phone", "전화를 쓰다"]], "h1": "<보기> Dad may come home late.는 '아빠가 늦게 오실지도 모른다'는 약한 추측이에요. 같은 쓰임을 찾으세요.", "h2": "may가 문장 첫머리의 대문자 May는 명사일 수 있고, 소원을 말할 때도 있어요. 추측인 may는 어떤 뜻인지 확인해 보세요.", "why": "<보기>와 ④의 may는 '~일지도 모른다'는 약한 추측이에요.", "opts": [{"n": "①", "en": "You may go now.", "ko": "너는 지금 가도 된다.", "ok": false, "why": "허가의 may예요."}, {"n": "②", "en": "May you live long!", "ko": "오래 사시길!", "ok": false, "why": "소원을 말하는 may예요."}, {"n": "③", "en": "My favorite month is May.", "ko": "내가 가장 좋아하는 달은 5월이다.", "ok": false, "why": "조동사가 아니라 '5월'이라는 명사예요."}, {"n": "④", "en": "She may not be good at dancing.", "ko": "그녀는 춤을 잘 추지 못할지도 모른다.", "ok": true, "why": "약한 추측의 may라서 <보기>와 같아요."}, {"n": "⑤", "en": "You may use the phone on the table.", "ko": "너는 탁자 위의 전화를 써도 된다.", "ok": false, "why": "허가의 may예요."}], "pencil": "may = ~해도 된다(허가) / ~일 ___ 모른다(추측)", "pencilKey": "지도", "page": 52, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "같은 쓰임/다른 쓰임의 조동사", "type": "write", "ans": "May, should, has to", "concept": ["012", "013"], "gap": "", "words": [["speak to Sora", "Sora에게 말하다"], ["read the instructions", "설명서를 읽다 (원형 read 읽다)"], ["take a bus", "버스를 타다"], ["had better", "~하는 게 좋다"]], "h1": "세 쌍의 문장이 같은 뜻이 되도록 해요. Can I ~ / You had better ~ / He must ~는 각각 무엇으로 바꿔 쓸 수 있을지 하나씩 생각해 보세요.", "h2": "Can(허가)은 may, had better(충고)는 should, must(의무)는 have to예요. 세 번째 주어 He가 3인칭 단수라서 has to라는 점을 잊지 마세요.", "why": "허가 Can은 May, 충고 had better는 should, 의무 must는 주어 He에 맞게 has to로 바꿔요.", "opts": [], "pencil": "can = may, had better = should, must = ___ to", "pencilKey": "has", "page": 53, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "같은 쓰임/다른 쓰임의 조동사", "type": "write", "ans": "had better not play", "concept": ["013"], "gap": "had better(~하는 게 좋다)와 부정형 had better not", "words": [["Don't play", "하지 마라"], ["too late", "너무 늦게"], ["computer games", "컴퓨터 게임"]], "h1": "Don't play ~는 '~하지 마라'는 부정 명령문이에요. 같은 뜻을 had better를 써서 말해 보세요.", "h2": "had better는 '~하는 게 좋다'이고, 부정은 had better not이에요. 순서를 잘 맞춰 보세요.", "why": "'하지 마라'와 같은 뜻은 '~하지 않는 게 좋다'라서 You had better not play ~가 돼요.", "opts": [], "pencil": "~하지 않는 게 좋다 = had ___ not + 동사원형", "pencilKey": "better", "page": 53, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "조동사의 형태와 의미", "type": "write", "ans": "you have to be careful", "concept": ["013"], "gap": "", "words": [["knife", "칼"], ["sharp", "날카로운"], ["careful", "조심하는"], ["have to", "~해야 한다"]], "h1": "'칼이 날카로우니 ~해야 한다'는 뜻이에요. 괄호 속 단어 (careful, to, be, you, have)를 순서대로 놓아 보세요.", "h2": "「주어 + have to + be + 형용사」 순서예요. have to 뒤에는 동사원형 be가 오고, 그 뒤에 careful(조심하는)이 와요.", "why": "'조심해야 한다'는 have to be careful이에요. 주어 you를 맨 앞에 놓아요.", "opts": [], "pencil": "have to + 동사원형 + ___", "pencilKey": "형용사(careful)", "page": 53, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "조동사의 형태와 의미", "type": "write", "ans": "She may not run a marathon again.", "concept": ["012"], "gap": "may(약한 추측), must(강한 추측), cannot(~일 리 없다)처럼 추측을 말하는 조동사", "words": [["marathon", "마라톤"], ["again", "다시"], ["may not", "~하지 않을지도 모른다"]], "h1": "'그녀는 다시 마라톤을 뛰지 않을지도 모른다'는 약한 추측의 부정이에요. 괄호 속 단어를 순서대로 놓아 보세요.", "h2": "may의 부정은 may not이에요. 순서는 「주어 + may not + 동사원형 + 목적어 + again」이에요.", "why": "약한 추측의 부정이라서 She may not run a marathon again.이 돼요.", "opts": [], "pencil": "may의 부정은 may ___ + 동사원형", "pencilKey": "not", "page": 53, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "조동사의 형태와 의미", "type": "write", "ans": "used to go", "concept": ["058"], "gap": "", "words": [["swimming", "수영하러 가기"], ["every morning", "매일 아침"], ["used to" , "step": 3, "no": 6, "qtype": "같은 쓰임/다른 쓰임의 조동사", "type": "mc", "ans": "③, ⑤", "concept": ["013"], "gap": "", "words": [["do the laundry", "빨래를 하다"], ["do the dishes", "설거지를 하다"], ["children", "아이들"]], "h1": "엄마가 '나는 빨래를 할게. 하지만 너희들은 설거지를 ___ 한단다'라고 말해요. 어떤 뜻의 조동사가 어울릴까요?", "h2": "엄마가 아이들에게 시키는 말이라서 '~해야 한다'(의무)예요. 의무를 나타내는 표현 두 개를 보기에서 고르세요.", "why": "아이들이 설거지를 '해야 한다'는 의무라서 have to와 should가 알맞아요.", "opts": [{"n": "①", "en": "would", "ko": "~하곤 했다", "ok": false, "why": "과거의 습관이라서 지금 시키는 말과 맞지 않아요."}, {"n": "②", "en": "will", "ko": "~할 것이다", "ok": false, "why": "미래를 말해서 '해야 한다'는 뜻이 아니에요."}, {"n": "③", "en": "have to", "ko": "~해야 한다", "ok": true, "why": "의무를 나타내서 알맞아요."}, {"n": "④", "en": "had to", "ko": "~해야 했다", "ok": false, "why": "과거의 의무라서 지금 시키는 말과 맞지 않아요."}, {"n": "⑤", "en": "should", "ko": "~해야 한다", "ok": true, "why": "의무를 나타내서 알맞아요."}], "pencil": "'~해야 한다'는 have to와 ___", "pencilKey": "should", "page": 54, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "같은 쓰임/다른 쓰임의 조동사", "type": "mc", "ans": "①, ③", "concept": ["013"], "gap": "don't have to(~할 필요 없다)와 must not(~하면 안 된다)의 차이", "words": [["teenagers", "십대들"], ["fashion models", "패션 모델"], ["look like", "~처럼 보이다"]], "h1": "밑줄 친 don't have to는 '~할 필요가 없다'예요. 보기 중 같은 뜻으로 바꿔 쓸 수 있는 것을 모두 고르는 문제예요.", "h2": "need not과 don't need to는 모두 '~할 필요가 없다'예요. cannot, should not은 어떤 뜻인지 하나씩 비교해 보세요.", "why": "need not과 don't need to는 모두 '~할 필요가 없다'라서 don't have to와 같아요.", "opts": [{"n": "①", "en": "need not", "ko": "~할 필요가 없다", "ok": true, "why": "don't have to와 뜻이 같아요."}, {"n": "②", "en": "cannot", "ko": "~할 수 없다", "ok": false, "why": "능력이나 강한 추측이라서 '필요가 없다'와 달라요."}, {"n": "③", "en": "don't need to", "ko": "~할 필요가 없다", "ok": true, "why": "don't have to와 뜻이 같아요."}, {"n": "④", "en": "are not going to", "ko": "~하지 않을 것이다", "ok": false, "why": "미래의 부정이라서 '필요 없다'와 달라요."}, {"n": "⑤", "en": "should not", "ko": "~하면 안 된다", "ok": false, "why": "금지라서 '필요 없다'와 달라요."}], "pencil": "don't have to = need ___ = don't need to", "pencilKey": "not", "page": 54, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "같은 쓰임/다른 쓰임의 조동사", "type": "mc", "ans": "①", "concept": ["013", "012"], "gap": "may(약한 추측), must(강한 추측), cannot(~일 리 없다)처럼 추측을 말하는 조동사", "words": [["must not be true", "사실일 리 없다"], ["bring a partner", "짝을 데려오다"], ["spend time", "시간을 보내다"], ["be able to", "~할 수 있다"]], "h1": "'두 문장의 의미가 같지 않은 것'을 고르는 문제예요. 각각 위아래 문장이 같은 뜻인지 하나씩 바꿔 읽어 보세요.", "h2": "must not be는 '~일 리 없다'(강한 추측)이고, should not be는 '~이면 안 된다'예요. 뜻이 같을까요?", "why": "①은 must not be(~일 리 없다)와 should not be(~이면 안 된다)가 뜻이 달라요. 나머지는 모두 같은 뜻이에요.", "opts": [{"n": "①", "en": "His story must not be true. / His story should not be true.", "ko": "그의 이야기는 사실일 리 없다. / 그의 이야기는 사실이면 안 된다.", "ok": true, "why": "must not be는 강한 추측이고 should not be는 금지라서 뜻이 달라요. 정답이에요."}, {"n": "②", "en": "Can I have one of these cookies? / May I have one of these cookies?", "ko": "이 쿠키 하나 먹어도 돼? / 이 쿠키 하나 먹어도 될까요?", "ok": false, "why": "can과 may는 모두 허가라서 뜻이 같아요."}, {"n": "③", "en": "She must bring her partner to the party. / She has to bring her partner to the party.", "ko": "그녀는 파티에 짝을 데려와야 한다. / 그녀는 파티에 짝을 데려와야 한다.", "ok": false, "why": "must와 has to는 모두 의무라서 뜻이 같아요."}, {"n": "④", "en": "Are you able to speak three languages? / Can you speak three languages?", "ko": "너는 3개 국어를 말할 수 있니? / 너는 3개 국어를 말할 수 있니?", "ok": false, "why": "be able to와 can은 뜻이 같아요."}, {"n": "⑤", "en": "They used to spend time together. / They would spend time together.", "ko": "그들은 함께 시간을 보내곤 했다. / 그들은 함께 시간을 보내곤 했다.", "ok": false, "why": "과거의 습관을 말할 때 used to와 would는 바꿔 쓸 수 있어요."}], "pencil": "must not be = ~일 ___ 없다, should not = 하면 안 된다", "pencilKey": "리", "page": 54, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "같은 쓰임/다른 쓰임의 조동사", "type": "write", "ans": "(1) I will have my way. (2) You must [should] speak English in the class.", "concept": ["012", "013"], "gap": "", "words": [["have my way", "내 마음대로 하다"], ["be going to", "~할 것이다"], ["have to", "~해야 한다"], ["speak English", "영어로 말하다"]], "h1": "(1)은 미래를 나타내는 be going to, (2)는 의무를 나타내는 have to예요. 각각 같은 뜻의 한 단어짜리 조동사로 바꿔 쓰는 문제예요.", "h2": "be going to는 will로, have to는 must(또는 should)로 바꿀 수 있어요. 조동사 뒤에는 동사원형이 온다는 점도 잊지 마세요.", "why": "(1) I am going to have my way.는 I will have my way.로, (2) have to는 must [should]로 바꿔요.", "opts": [], "pencil": "be going to = ___ , have to = must", "pencilKey": "will", "page": 55, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "조동사의 형태와 의미/조동사의 시제와 부정", "type": "write", "ans": "You don't have to take off your shoes.", "concept": ["013"], "gap": "don't have to(~할 필요 없다)와 must not(~하면 안 된다)의 차이", "words": [["take off", "벗다"], ["shoes", "신발"], ["don't have to", "~할 필요가 없다"]], "h1": "'너는 신발을 벗을 필요가 없다'는 말을 괄호 안의 단어(have, take off, your shoes)로 영작해요. 필요 없다는 표현이 무엇인지 떠올려 보세요.", "h2": "'~할 필요가 없다'는 don't have to + 동사원형이에요. 동사 take off(벗다)의 원형을 그대로 써요.", "why": "필요가 없다는 뜻이라서 You don't have to take off your shoes.가 돼요.", "opts": [], "pencil": "~할 필요가 없다는 don't ___ to + 동사원형", "pencilKey": "have", "page": 55, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "조동사의 형태와 의미/조동사의 시제와 부정", "type": "write", "ans": "be able to", "concept": ["011", "012"], "gap": "조동사는 나란히 못 쓰고 will be able to처럼 바꿔 쓰는 방법", "words": [["come to the meeting", "회의에 오다"], ["will", "~할 것이다"], ["I can make it.", "나는 갈 수 있어요."]], "h1": "A는 '회의에 오실 수 있나요?'라고 묻고, B는 '참석할 수 있을 것 같아요'라고 해요. 앞에 Will you가 있어요. 빈칸에는 몇 단어가 필요할까요?", "h2": "will 뒤에는 can을 쓸 수 없어요. can과 같은 뜻인 be able to를 쓰고, Will you ___ ___ ___ come의 순서에서 동사원형 be를 써요.", "why": "미래의 가능성을 묻고 있어서 Will you be able to come to the meeting?가 돼요.", "opts": [], "pencil": "will 뒤의 '~할 수 있다'는 ___ ___ to", "pencilKey": "be able", "page": 55, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "조동사의 형태와 의미/조동사의 시제와 부정", "type": "write", "ans": "must not, used to", "concept": ["013", "058"], "gap": "don't have to(~할 필요 없다)와 must not(~하면 안 된다)의 차이", "words": [["drive", "운전하다"], ["driver's license", "운전면허증"], ["on the corner", "모퉁이에"]], "h1": "첫 문장은 '운전면허증 없이 운전하면 안 된다', 둘째 문장은 '내가 가장 좋아하는 커피숍이 모퉁이에 있었다(지금은 없다)'라는 뜻이에요.", "h2": "금지는 must not, 과거의 상태는 used to예요. 보기 used to, must not, would, don't have to 중 알맞은 것을 골라요.", "why": "금지는 must not, 과거의 상태(예전에는 있었다)는 used to가 알맞아요. be 앞에는 would를 쓸 수 없어요.", "opts": [], "pencil": "금지는 ___ not, 과거의 상태는 used to", "pencilKey": "must", "page": 55, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "조동사의 형태와 의미", "type": "write", "ans": "[모범답] should do your homework / should listen to the teacher / should study harder / should not watch TV a lot (이 중 두 개)", "concept": ["013"], "gap": "", "words": [["get a good grade", "좋은 성적을 받다"], ["do your homework", "숙제를 하다"], ["listen to the teacher", "선생님 말씀을 듣다"], ["study harder", "더 열심히 공부하다"]], "h1": "민호가 시험에서 좋은 점수를 받으려면 해야 할 일이 무엇인지 보기에서 고르세요. 문장은 두 개를 쓰고 'You ~'로 시작해요.", "h2": "조건에서 should 또는 should not을 쓰라고 했어요. 해야 하는 일은 should, 하지 말아야 하는 일은 should not을 쓰고 동사 원형을 이어 쓰세요.", "why": "좋은 성적을 받기 위한 충고라서 You should do your homework.처럼 should + 동사원형으로 써요. 하지 말아야 할 일은 should not을 써요.", "opts": [], "pencil": "충고는 You should (not) + ___", "pencilKey": "동사원형", "page": 55, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "통합형", "type": "write", "ans": "(1) There used to be a small park next to my house. (2) The man was able to memorize new words easily.", "concept": ["058", "012"], "gap": "조동사는 나란히 못 쓰고 will be able to처럼 바꿔 쓰는 방법", "words": [["next to", "~ 옆에"], ["but now it is gone", "하지만 지금은 없어졌다"], ["memorize", "외우다"], ["be able to", "~할 수 있다"]], "h1": "(1)은 '예전에는 있었지만 지금은 없다'는 뜻이고, (2)는 could를 be able to로 바꾸는 문제예요. 과거 이야기라는 점을 확인하세요.", "h2": "(1)은 There used to be ~를 써요. (2) could는 과거의 가능이라서 be able to를 과거형 was able to로 써요. 주어가 The man이라서 was예요.", "why": "(1) 과거의 상태라서 There used to be ~, (2) could를 be able to로 바꿀 때 be동사도 과거형 was로 써요.", "opts": [], "pencil": "(1) 과거의 상태 used to / (2) could = was/were ___ to", "pencilKey": "able", "page": 55, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "통합형", "type": "write", "ans": "She used to take care of the cats on the street.", "concept": ["058"], "gap": "", "words": [["took care of", "돌봤다 (원형 take care of 돌보다)"], ["take care of", "돌보다"], ["cats on the street", "길고양이들"]], "h1": "She used to took ~에서 used to 뒤에는 어떤 모양의 동사가 와야 하는지 떠올려 보세요.", "h2": "used to 뒤에는 항상 동사원형을 써요. took을 원형으로 바꿔요.", "why": "used to 뒤에는 동사원형이 와야 해서 took을 take로 고쳐 쓰고 문장 전체를 다시 써요.", "opts": [], "pencil": "used to 뒤에는 ___ 을 쓴다", "pencilKey": "동사원형", "page": 55, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "우리말에 맞게 영어 고르기", "type": "mc", "ans": "①, ⑤", "concept": ["013", "058"], "gap": "had better(~하는 게 좋다)와 부정형 had better not", "words": [["wash your hands", "손을 씻다"], ["sing in Chinese", "중국어로 노래하다"], ["winner of the contest", "대회의 우승자"], ["should not", "~하면 안 된다"]], "h1": "우리말과 영어가 맞지 않는 것을 고르는 문제예요. 영어에서 쓰인 조동사나 표현이 우리말의 뜻과 맞는지 하나씩 비교해 보세요.", "h2": "'~하는 것이 좋겠다'는 had better, '~일 리 없다'는 cannot [can't]예요. ①과 ⑤의 영어 표현이 우리말 뜻과 맞는지 확인하세요.", "why": "①은 '~하는 게 좋겠다'인데 be going to(~할 것이다)를 써서 틀렸고, ⑤는 '~일 리 없다'인데 should not(~하면 안 된다)을 써서 틀렸어요.", "opts": [{"n": "①", "en": "너는 손을 씻는 것이 좋겠다. / You are going to wash your hands.", "ko": "너는 손을 씻는 것이 좋겠다. / 너는 손을 씻을 것이다.", "ok": true, "why": "be going to는 미래라서 '~하는 게 좋다'는 had better를 써야 해요. 정답이에요."}, {"n": "②", "en": "그들은 중국어로 노래할 수 있다. / They are able to sing in Chinese.", "ko": "그들은 중국어로 노래할 수 있다.", "ok": false, "why": "be able to는 '~할 수 있다'라서 맞아요."}, {"n": "③", "en": "Susan은 12시에 점심을 먹곤 했다. / Susan would have lunch at twelve.", "ko": "Susan은 12시에 점심을 먹곤 했다.", "ok": false, "why": "would는 과거의 습관을 말해서 맞아요."}, {"n": "④", "en": "너는 밤에 피아노를 치지 말아야 한다. / You must not play the piano at night.", "ko": "너는 밤에 피아노를 치지 말아야 한다.", "ok": false, "why": "must not은 금지라서 맞아요."}, {"n": "⑤", "en": "Jack이 콘테스트의 우승자일 리 없다. / Jack should not be the winner of the contest.", "ko": "Jack이 콘테스트의 우승자일 리 없다. / Jack은 우승자이면 안 된다.", "ok": true, "why": "'~일 리 없다'는 cannot [can't]예요. should not은 금지라서 틀려요. 정답이에요."}], "pencil": "~하는 게 좋다는 ___ better, ~일 리 없다는 cannot", "pencilKey": "had", "page": 56, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "같은 쓰임 개수 세기", "type": "mc", "ans": "②", "concept": ["013"], "gap": "may(약한 추측), must(강한 추측), cannot(~일 리 없다)처럼 추측을 말하는 조동사", "words": [["be angry", "화나 있다"], ["exercise", "운동하다"], ["traffic light", "신호등"], ["stop here", "여기서 멈추다"]], "h1": "<보기> He must be angry to say so.는 '그렇게 말하다니 화난 것이 틀림없다'라는 강한 추측이에요. 아래 네 문장의 must도 하나씩 의무인지 추측인지 판단해 보세요.", "h2": "must + be 뒤에 상태가 오면 강한 추측일 때가 많아요. 나머지는 '~해야 한다'로 해석하면 자연스러운 의무예요.", "why": "She must be happy.만 강한 추측이에요. 나머지 세 문장은 의무예요. 따라서 같은 쓰임은 1개예요.", "opts": [{"n": "①", "en": "없음", "ko": "하나도 없다", "ok": false, "why": "She must be happy가 <보기>와 같아서 0개가 아니에요."}, {"n": "②", "en": "1개", "ko": "한 개", "ok": true, "why": "She must be happy 한 문장만 강한 추측이에요."}, {"n": "③", "en": "2개", "ko": "두 개", "ok": false, "why": "의무인 문장을 추측으로 잘못 센 거예요."}, {"n": "④", "en": "3개", "ko": "세 개", "ok": false, "why": "나머지 세 문장은 모두 의무라서 맞지 않아요."}, {"n": "⑤", "en": "4개", "ko": "네 개", "ok": false, "why": "네 문장 모두가 추측은 아니에요."}], "pencil": "must + 상태(be happy)는 ___ , must + 행동은 의무", "pencilKey": "강한 추측", "page": 56, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "어색한 문장 찾기", "type": "mc", "ans": "③", "concept": ["011", "013", "058"], "gap": "don't have to(~할 필요 없다)와 must not(~하면 안 된다)의 차이", "words": [["used to", "~하곤 했다"], ["call", "전화하다"], ["be able to", "~할 수 있다"], ["look after", "돌보다"]], "h1": "ⓐ~ⓔ 중 어색한 문장을 모두 고르는 문제예요. don't/doesn't의 주어 일치와 조동사 뒤 동사의 모양을 중심으로 살펴보세요.", "h2": "Alex는 3인칭 단수라서 don't가 맞는지, had to 뒤에는 어떤 동사 모양이 오는지 확인해 보세요.", "why": "ⓑ는 Alex에 맞게 doesn't have to로, ⓔ는 had to 뒤에 동사원형 look을 써야 해서 틀려요.", "opts": [{"n": "①", "en": "ⓐ, ⓑ", "ko": "ⓐ와 ⓑ", "ok": false, "why": "ⓐ Amy used to speak softly.는 맞는 문장이에요. 어색한 ⓔ가 빠졌어요."}, {"n": "②", "en": "ⓑ, ⓒ", "ko": "ⓑ와 ⓒ", "ok": false, "why": "ⓒ She is able to speak Japanese.는 맞는 문장이에요. 어색한 ⓔ가 빠졌어요."}, {"n": "③", "en": "ⓑ, ⓔ", "ko": "ⓑ와 ⓔ", "ok": function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
