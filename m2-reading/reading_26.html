 분사형용사: '화가 난' 감정은 과거분사 upset 사용", "topic": "감정 분사형용사", "memo": "'화가 난' 감정은 과거분사 upset 사용"}, {"wrong": "my", "right": "mine", "partial": false, "at": [18], "point": "소유대명사: like 뒤에 명사 없이 쓰는 소유대명사 mine 사용", "topic": "소유대명사", "memo": "like 뒤에 명사 없이 쓰는 소유대명사 mine 사용"}]}, {"n": 6, "tag": null, "en": "Even today, many people still confuses Manet with Monet. So, what are the differences between them?", "ko": "오늘날까지도, 많은 사람들은 여전히 마네와 모네를 혼동해요. 그렇다면, 그들 사이의 차이점은 무엇일까요?", "ok": false, "foot": [], "fixes": [{"wrong": "confuses", "right": "confuse", "partial": false, "at": [5], "point": "주어와 동사의 수일치: many people(복수)는 confuse (confuses 아님)", "topic": "주어와 동사의 수일치", "memo": "many people(복수)는 confuse (confuses 아님)"}]}, {"n": 7, "tag": null, "en": "First, the focus of their paintings is differently. Manet focused on people.", "ko": "첫째, 그들의 그림의 초점이 달라요. 마네는 사람들에게 초점을 맞추었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "differently", "right": "different", "partial": false, "at": [7], "point": "형용사와 부사: be동사 뒤 보어 자리에는 형용사 different 사용", "topic": "형용사와 부사", "memo": "be동사 뒤 보어 자리에는 형용사 different 사용"}]}, {"n": 8, "tag": null, "en": "He painted people in everyday life. For example, in him painting Boating, Manet painted a man and an woman on a boat.", "ko": "그는 일상 속 사람들을 그렸습니다. 예를 들어, 그의 그림인 '뱃놀이(Boating)'에서, 마네는 배에 탄 남자와 여자를 그렸어요.", "ok": false, "foot": [], "fixes": [{"wrong": "him", "right": "his", "partial": false, "at": [9], "point": "인칭대명사의 소유격: 명사 painting 앞에는 소유격 his 사용", "topic": "인칭대명사의 소유격", "memo": "명사 painting 앞에는 소유격 his 사용"}, {"wrong": "an", "right": "a", "partial": false, "at": [17], "point": "관사 a/an: 자음 소리 woman 앞에는 a 사용", "topic": "관사 a/an", "memo": "자음 소리 woman 앞에는 a 사용"}]}, {"n": 9, "tag": null, "en": "Unlike Manet, Monet liked to painting landscapes and gardens. He enjoyed watching nature in different seasons and times of day.", "ko": "마네와 달리, 모네는 풍경과 정원을 그리는 것을 좋아했어요. 그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요.", "ok": false, "foot": [], "fixes": [{"wrong": "painting", "right": "paint", "partial": false, "at": [5], "point": "to부정사: like to 뒤에는 동사원형: paint (painting 아님)", "topic": "to부정사", "memo": "like to 뒤에는 동사원형: paint (painting 아님)"}]}, {"n": 10, "tag": null, "en": "He painted the same subject many times. He created about 250 different painting of water lilies for him series Water Lilies.", "ko": "그는 같은 주제를 여러 번 그렸어요. 모네는 그의 연작인 '수련(Water Lilies)'을 위해 약 250점의 다양한 수련 그림을 그렸습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "painting", "right": "paintings", "partial": false, "at": [12], "point": "명사의 복수형: 250 뒤에는 복수명사 paintings 사용", "topic": "명사의 복수형", "memo": "250 뒤에는 복수명사 paintings 사용"}, {"wrong": "him", "right": "his", "partial": false, "at": [17], "point": "인칭대명사의 소유격: 명사 series 앞에는 소유격 his 사용", "topic": "인칭대명사의 소유격", "memo": "명사 series 앞에는 소유격 his 사용"}]}, {"n": 11, "tag": null, "en": "Manet and Monet also differ on their use of color. Manet was a master in the use of black.", "ko": "마네와 모네는 또한 색 사용에서도 달라요. 마네는 검은색 사용의 대가였어요.", "ok": false, "foot": [], "fixes": [{"wrong": "on", "right": "in", "partial": false, "at": [5], "point": "기본전치사: '~에서 다르다'는 differ in 사용", "topic": "기본전치사", "memo": "'~에서 다르다'는 differ in 사용"}]}, {"n": 12, "tag": null, "en": "His painting Masked Ball at the Opera is a good examples.", "ko": "그의 그림인 '오페라 하우스의 가면무도회(Masked Ball at the Opera)'가 좋은 예입니다.", "ok": false, "foot": [], "fixes": [{"wrong": "examples", "right": "example", "partial": false, "at": [10], "point": "명사의 단수형: a 뒤에는 단수명사 example 사용", "topic": "명사의 단수형", "memo": "a 뒤에는 단수명사 example 사용"}]}, {"n": 13, "tag": null, "en": "However, in Monet's paintings, black was not use. Dark brown was used instead.", "ko": "그러나 모네의 그림에서는 검은색이 사용되지 않았어요. 대신에 짙은 갈색이 사용되었습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "use", "right": "used", "partial": false, "at": [7], "point": "수동태: 수동태는 be동사 + 과거분사 used 사용", "topic": "수동태", "memo": "수동태는 be동사 + 과거분사 used 사용"}]}, {"n": 14, "tag": null, "en": "Monet also used a lots of light colors in his paintings.", "ko": "모네는 또한 그의 그림에서 연한 색을 많이 사용했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "lots", "right": "lot", "partial": false, "at": [4], "point": "수량 표현: '많은'은 a lot of 사용 (lots 아님)", "topic": "수량 표현", "memo": "'많은'은 a lot of 사용 (lots 아님)"}]}, {"n": 15, "tag": null, "en": "You will see them if you look at paintings such as Waterloo Bridge, London, at Sunset or Waves Breaking.", "ko": "'해 질 녘 런던 워털루 다리(Waterloo Bridge, London, at Sunset)'나 '부서지는 파도(Waves Breaking)'와 같은 그림을 보면 그것들을 보게 될 거예요.", "ok": true, "foot": [], "fixes": []}, {"n": 16, "tag": null, "en": "The name Manet and Monet sound similar, but their painting styles are very different.", "ko": "마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요.", "ok": false, "foot": [], "fixes": [{"wrong": "name", "right": "names", "partial": false, "at": [1], "point": "명사의 복수형: Manet and Monet 두 이름이므로 names 사용", "topic": "명사의 복수형", "memo": "Manet and Monet 두 이름이므로 names 사용"}]}, {"n": 17, "tag": null, "en": "Do you see dark colors and people in the painting? It's probably Manet.", "ko": "그림에서 어두운 색상과 사람들이 보이나요? 그것은 아마도 마네일 거예요.", "ok": true, "foot": [], "fixes": []}, {"n": 18, "tag": null, "en": "Does you see light colors and gardens? It's probably Monet.", "ko": "연한 색과 정원이 보이나요? 그것은 아마도 모네일 거예요.", "ok": false, "foot": [], "fixes": [{"wrong": "Does", "right": "Do", "partial": false, "at": [0], "point": "do/does 의문문: 주어 you에는 Do 사용", "topic": "do/does 의문문", "memo": "주어 you에는 Do 사용"}]}, {"n": 19, "tag": null, "en": "If you remember these questions, you can easy tell them apart.", "ko": "이러한 질문들을 기억하면, 여러분은 그들을 쉽게 구별할 수 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "easy", "right": "easily", "partial": false, "at": [7], "point": "형용사와 부사: 동사 tell을 꾸미는 부사 easily 사용", "topic": "형용사와 부사", "memo": "동사 tell을 꾸미는 부사 easily 사용"}]}];var PP=[["Do you ever mix up people with similar names?", "여러분은 비슷한 이름을 가진 사람들을 혼동하곤 하나요?", 1], ["In the late 19th century, there were two French painters who had similar names: Manet and Monet.", "19세기 후반에 비슷한 이름 ot of light colors in his paintings.", "모네는 또한 그의 그림에서 연한 색을 많이 사용했어요.", 0], ["You will see them if you look at paintings such as Waterloo Bridge, London, at Sunset or Waves Breaking.", "'해 질 녘 런던 워털루 다리(Waterloo Bridge, London, at Sunset)'나 '부서지는 파도(Waves Breaking)'와 같은 그림을 보면 그것들을 보게 될 거예요.", 0], ["The names Manet and Monet sound similar, but their painting styles are very different.", "마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요.", 1], ["Do you see dark colors and people in the painting?", "그림에서 어두운 색상과 사람들이 보이나요?", 0], ["It's probably Manet.", "그것은 아마도 마네일 거예요.", 0], ["Do you see light colors and gardens?", "연한 색과 정원이 보이나요?", 0], ["It's probably Monet.", "그것은 아마도 모네일 거예요.", 0], ["If you remember these questions, you can easily tell them apart.", "이러한 질문들을 기억하면, 여러분은 그들을 쉽게 구별할 수 있어요.", 0]];var RNUM=26;var TITLE_EN="Manet and Monet";var PASS_EN=["Manet and Monet", "Do you ever mix up people with similar names? In the late 19th century, there were two French painters who had similar names: Manet and Monet.", "One day, Manet heard people at an exhibit. They were praising a painter. He thought they were talking about him. He felt happy, but they were actually talking about Monet! When Manet realized this, he got upset and shouted, \"Who is this Monet whose name sounds just like mine?\" Even today, many people still confuse Manet with Monet. So, what are the differences between them?", "First, the focus of their paintings is different. Manet focused on people. He painted people in everyday life. For example, in his painting Boating, Manet painted a man and a woman on a boat. Unlike Manet, Monet liked to paint landscapes and gardens. He enjoyed watching nature in different seasons and times of day. He painted the same subject many times. He created about 250 different paintings of water lilies for his series Water Lilies.", "Manet and Monet also differ in their use of color. Manet was a master in the use of black. His painting Masked Ball at the Opera is a good example.", "However, in Monet's paintings, black was not used. Dark brown was used instead. Monet also used a lot of light colors in his paintings. You will see them if you look at paintings such as Waterloo Bridge, London, at Sunset or Waves Breaking.", "The names Manet and Monet sound similar, but their painting styles are very different. Do you see dark colors and people in the painting? It's probably Manet. Do you see light colors and gardens? It's probably Monet. If you remember these questions, you can easily tell them apart."];var PASS_KO=["마네와 모네", "여러분은 비슷한 이름을 가진 사람들을 혼동하곤 하나요? 19세기 후반에 비슷한 이름을 가진 프랑스 화가 두 명이 있었어요. 마네와 모네입니다.", "어느 날, 마네는 전시회에서 사람들의 말을 들었어요. 그들은 한 화가를 칭찬하고 있었어요. 그는 그들이 자신에 대해서 말하고 있다고 생각했어요. 그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요! 마네가 이것을 깨달았을 때, 그는 기분이 상해서 외쳤어요. \"꼭 내 이름처럼 들리는 이름의 이 모네라는 사람은 누구야?\" 오늘날까지도, 많은 사람들은 여전히 마네와 모네를 혼동해요. 그렇다면, 그들 사이의 차이점은 무엇일까요?", "첫째, 그들의 그림의 초점이 달라요. 마네는 사람들에게 초점을 맞추었어요. 그는 일상 속 사람들을 그렸습니다. 예를 들어, 그의 그림인 '뱃놀이(Boating)'에서, 마네는 배에 탄 남자와 여자를 그렸어요. 마네와 달리, 모네는 풍경과 정원을 그리는 것을 좋아했어요. 그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요. 그는 같은 주제를 여러 번 그렸어요. 모네는 그의 연작인 '수련(Water Lilies)'을 위해 약 250점의 다양한 수련 그림을 그렸습니다.", "마네와 모네는 또한 색 사용에서도 달라요. 마네는 검은색 사용의 대가였어요. 그의 그림인 '오페라 하우스의 가면무도회(Masked Ball at the Opera)'가 좋은 예입니다.", "그러나 모네의 그림에서는 검은색이 사용되지 않았어요. 대신에 짙은 갈색이 사용되었습니다. 모네는 또한 그의 그림에서 연한 색을 많이 사용했어요. '해 질 녘 런던 워털루 다리(Waterloo Bridge, London, at Sunset)'나 '부서지는 파도(Waves Breaking)'와 같은 그림을 보면 그것들을 보게 될 거예요.", "마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요. 그림에서 어두운 색상과 사람들이 보이나요? 그것은 아마도 마네일 거예요. 연한 색과 정원이 보이나요? 그것은 아마도 모네일 거예요. 이러한 질문들을 기억하면, 여러분은 그들을 쉽게 구별할 수 있어요."];

function reasonHtml(t){t=t.replace(/^(오답|정답)\s*[○✕]\s*—\s*/,'').replace(/\s*✕/g,'');return esc(t).replace(/'(.+?)'(?=\()/g,'<mark lang="en">$1</mark>')}
function qById(n){for(var i=0;i<QL.length;i++)if(QL[i].n===n)return QL[i]}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name||(secs.length>1?'도입':''))+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  if(done[si])h+=resultTop(S,si);
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=stepQHtml();
 document.getElementById('app').innerHTML=h;relayUp();persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function aDone(){return secs.every(function(S,si){return done[si]})}
function allAdv(){return QL.every(function(q){return qst[q.n]&&qst[q.n].adv})}
function relayUp(){var st=[aDone(),allAdv()],nm=['본문 오류 찾기','본문 '+QL.length+'문제'],f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 if(lock&&!it.ok){h='<div class="sent locked fixd" id="s'+i+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt" lang="en">'+diffHtml(it)+'</div></div><div class="gl kr">'+esc(it.ko)+'</div>';if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');return h+noteHtml(i)+'</div>'}
 h+='<div class="sent'+(lock?' locked':'')+'" id="s'+i+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt" lang="en">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongWords(i){var it=D[i],sp=span(it),toks=it.en.split(/\s+/),r=[];for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))r.push(t)}r.sort(function(a,b){return a-b});return r.map(function(t){return toks[t].replace(/^[^\w]+|[^\w]+$/g,'')})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function fixedHtml(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0001'+f.right+'\u0002');return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0001'+f.right+'\u0002'+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return esc(tk.join(' ').replace(/ ?\u0000/g,'')).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>')}
function diffHtml(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   var R=f.right?'\u0001'+f.right+'\u0002':'';
   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0003'+f.wrong+'\u0004'+R);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0003'+f.wrong+'\u0004'+(R?' '+R:'')+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return esc(tk.join(' ').replace(/ ?\u0000/g,'')).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>').replace(/\u0003/g,'<del>').replace(/\u0004/g,'</del>')}
function noteHtml(i){
 var it=D[i],wp=wrongPicks(i);
 if(it.ok){return '<div class="ac s1"><div class="ac-top fine"><b>맞는 문장</b><span class="ac-a">어법 오류 없음</span>'+(wp?'<span class="ac-x">틀리게 고른 곳 : <span lang="en">'+esc(wrongWords(i).join(', '))+'</span></span>':'')+'</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 var h='<div class="ac s1"><div class="ac-top'+(all?' g':'')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+'</b>'+(wp?'<span class="ac-x">틀리게 고른 곳 : <span lang="en">'+esc(wrongWords(i).join(', '))+'</span></span>':'')+'</div>';
 it.fixes.forEach(function(f,k){var ok=foundFix(i,k);
  h+='<div class="fc '+(ok?'f':'m')+'"><div><span class="tg2">'+(ok?'찾음':'놓침')+'</span>'+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr" lang="en">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt" lang="en">'+esc(f.right)+'</span></div><div class="fcb">'+pointHtml(f)+(f.gl?f.gl.map(function(g){return '<div class="fgl">'+esc(g)+'</div>'}).join(''):'')+'</div></div>'});
 return h+'<div style="height:12px"></div></div>';
}
function critHtml(f){var w=f.wrong.split(/\s+/),r=f.right.split(/\s+/);
 if(f.alt&&f.alt.length)return '<div class="crit">빠진 말 문제 : 빠진 자리 양옆 어느 단어를 눌러도 정답으로 인정</div>';
 if(w.length==2&&r.length==2&&w.slice().sort().join()==r.slice().sort().join()&&w.join()!=r.join())return '<div class="crit">어순 문제 : 옮겨진 말과 짝이 되는 단어, 어느 쪽을 눌러도 정답으로 인정</div>';return ''}
function pointHtml(f){var p=f.point,ix=p.indexOf(':');return (ix>0&&ix<24?'<b>'+esc(p.slice(0,ix))+'</b> : '+esc(p.slice(ix+1).trim()):'<b>'+esc(f.topic)+'</b> : '+esc(p))+critHtml(f)}
function resultTop(S,si){
 var tot=0,fo=0,ch='';
 S.items.forEach(function(i){var it=D[i],f=0,w=wrongPicks(i);it.fixes.forEach(function(x,k){tot++;if(foundFix(i,k)){fo++;f++}});
  var miss=it.fixes.length-f;
  if(miss||w)ch+='<button type="button" class="rchip'+(miss?' m':'')+'" data-jump="s'+i+'">'+String(it.n).padStart(2,'0')+'번 '+(miss?'놓침':'')+(miss&&w?' · ':'')+(w?'틀리게 고름':'')+'</button>'});
 return '<div class="rsum"><b>결과</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(ch?'<div class="rchips">'+ch+'</div>':'')+'</div>';
}
function rightCard(q){
 var h='<div class="ac"><div class="ac-top g"><b>정답</b><span class="ac-a">'+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<div class="ac-k">'+esc(q.ko[q.a])+'</div>':'')+'</div>';
 h+='<div class="ac-sec">본문 근거</div><div class="pass">';
 q.evs.forEach(function(e){h+='<div class="pl1"><div class="e" lang="en"><mark>'+esc(e[0])+'</mark></div><div class="k">'+esc(e[1])+'</div></div>'});
 h+='</div><div class="ac-sec">왜 정답일까</div><div class="oc g"><div class="why">'+reasonHtml(q.ow[q.a])+'</div></div>';
 h+='<div class="nx"><button type="button" data-next="'+q.n+'">다음 문제</button></div></div>';
 return h;
}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 return '<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
}
function load(){try{var v=localStorage.getItem(BK);return v==null?null:+v}catch(e){return null}}
function save(n){try{var b=load();if(b==null||n>b)localStorage.setItem(BK,n)}catch(e){}}
function ppHtml(pp){
 return '<div class="dlg"><div class="who">'+en(TITLE_EN)+' &middot; '+en(pp[0][0])+'</div><div class="ln"><div class="en" lang="en">'+esc(pp.slice(1).map(function(p){return p[0]}).join(' '))+'</div></div></div>';
}
function qVisible(i){if(!aDone())return false;for(var j=0;j<i;j++){var s=qst[QL[j].n];if(!(s&&s.adv))return false}return true}
function stepQHtml(){
 if(!aDone())return '';
 if(!qgo)return '<div class="gobar"><button type="button" data-go="1">문제 풀러 가기</button></div>';
 var h='<div class="stage">2 · 본문 '+QL.length+'문제</div>',lastG=null;
 for(var i=0;i<QL.length;i++){
  if(!qVisible(i))break;
  var q=QL[i];
  if(q.g!==lastG){if(q.g.pp)h+=ppHtml(q.g.pp);lastG=q.g}
  h+=qCard(i);
 }
 if(allAdv())h+=resultHtml();
 return h;
}
function optText(q,j){return q.ko?en(q.o[j]):esc(q.o[j])}
function doneRow(q){return '<div class="qd" id="q'+q.n+'"><span class="qn">'+q.dn+'</span><span>정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<span class="qk">'+esc(q.ko[q.a])+'</span>':'')+'</div>'}
function postHtml(q,st){var n=q.note;
 return '<div class="post"><div class="ph">노트에 쓰기 &middot; 요약문 완성</div><div class="pl" lang="en">'+esc(n.en)+'</div><div class="pk">'+esc(n.ko)+'</div><div class="pw">'+n.words.map(function(w){return '<span lang="en">'+esc(w[0])+'</span> = '+esc(w[1])}).join(' &nbsp;&middot;&nbsp; ')+'</div>'+(st.wrote?'<div class="pd">작성 완료</div>':'<button type="button" data-wrote="'+q.n+'">노트에 썼어요</button>')+'</div>';
}
function qCard(i){
 var q=QL[i],st=qst[q.n]||(qst[q.n]={w:[],ok:0,adv:0,t0:Date.now(),t1:0,wrote:0});
 if(st.adv&&!q.note&&!st.w.length)return doneRow(q);
 var h='<div class="q" id="q'+q.n+'"><div class="qt"><span class="lbl">'+LABEL+'</span><span class="qn">'+q.dn+'</span>'+neg(q.q)+'</div>';
 if(q.sum)h+='<div class="sumbox" lang="en">'+esc(q.sum)+'</div>';
 if(!st.w.length){
  q.o.forEach(function(t,j){
   h+='<div class="opt'+(st.ok&&j===q.a?' good':'')+'"'+(st.ok?'':' data-q="'+q.n+'" data-o="'+j+'"')+'><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>';
  });
  if(st.ok&&q.note)h+=postHtml(q,st);
  h+='</div>';
  if(st.ok&&!q.note&&!st.adv)h+=rightCard(q);
  return h;
 }
 return h+'</div>'+wrongCard(q,st);
}
function wrongCard(q,st){
 var h='<div class="ac"><div class="ac-top"><b>오답</b><span class="ac-a">정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<div class="ac-k">'+esc(q.ko[q.a])+'</div>':'')+'</div>';
 var isEv=function(t){return q.evs.some(function(e){return t===e[0]||(t.length>8&&t.indexOf(e[0])>=0)})};
 if(q.g.pp){
  h+='<div class="ac-sec">본문</div><div class="pass">';
  q.g.pp.forEach(function(p,ix){if(ix===0)return;h+='<div class="pl1"><div class="e" lang="en">'+(isEv(p[0])?'<mark>'+esc(p[0])+'</mark>':esc(p[0]))+'</div><div class="k">'+esc(p[1])+'</div></div>'});
  h+='</div>';
 } else {
  h+='<div class="ac-sec">본문 근거</div><div class="pass">';
  q.evs.forEach(function(e){h+='<div class="pl1"><div class="e" lang="en"><mark>'+esc(e[0])+'</mark></div><div class="k">'+esc(e[1])+'</div></div>'});
  h+='</div>';
 }
 h+='<div class="ac-sec">보기 풀이</div>';
 q.o.forEach(function(t,j){var isA=j===q.a,isW=st.w.indexOf(j)>=0;
  h+='<div class="oc'+(isA?' g':isW?' r':'')+'"><div class="oh"><span class="cn">'+CN[j]+'</span><div class="ot">'+(q.ko?en(t):esc(t))+(q.ko?'<div class="okr">'+esc(q.ko[j])+'</div>':'')+'</div>'+(isA?'<span class="tg">정답</span>':isW?'<span class="tg">내가 고름</span>':'')+'</div><div class="why">'+reasonHtml(q.ow[j])+'</div></div>';
 });
 var tr=(q.memo||[]).filter(function(l){return /^함정/.test(l)})[0];
 if(tr)h+='<div class="trap"><b>함정</b> '+esc(tr.replace(/^함정\s*:\s*/,'').replace(/\s*✕/g,''))+'</div>';
 if(!st.ok){
  h+='<div class="fix"><div class="fh">고쳐 보기</div>';
  q.o.forEach(function(t,j){var xx=st.w.indexOf(j)>=0;h+='<div class="opt'+(xx?' xx':'')+'" data-q="'+q.n+'" data-o="'+j+'"><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>'});
  h+='</div>';
 } else {
  h+='<div class="fixed">정답 '+CN[q.a]+'</div>';
  if(q.note)h+=postHtml(q,st);
  else if(!st.adv)h+='<div class="nx"><button type="button" data-next="'+q.n+'">다음 문제</button></div>';
 }
 return h+'</div>';
}
function fcount(){return QL.filter(function(q){var s=qst[q.n];return s&&s.ok&&!s.w.length}).length}
function fastInfo(){
 var s1=[];secs.forEach(function(S,si){if(s1t[si]!=null&&s1t[si]<1500*S.items.length)s1.push(S.name||('구간 '+(si+1)))});
 var q2=[];QL.forEach(function(q){var s=qst[q.n];if(s&&s.t1&&s.t1-s.t0<2500)q2.push(q.dn)});
 return{s1:s1,q2:q2};
}
function resultHtml(){
 var f=fcount(),fx=QL.reduce(function(a,q){return a+qst[q.n].w.length},0),fi=fastInfo();
 var h='<div class="stage">완료</div><div class="res"><div class="rl">처음에 맞힌 문제</div><div class="rpct">'+f+'<small> / '+QL.length+'</small></div>';
 h+='<table class="rtb">'+QL.map(function(q){var s=qst[q.n];return '<tr><td>'+q.dn+'번</td><td>'+(s.w.length?'틀림':'처음에 맞힘')+'</td></tr>'}).join('')+'</table>';

 if(TEACH){
  h+='<div class="tp"><b>선생님용</b><div>빠른 제출 : '+((fi.s1.length||fi.q2.length)?'<span class="fl">'+(fi.s1.length?'오류 찾기 '+fi.s1.join(', ')+' ':'')+(fi.q2.length?'문제 '+fi.q2.join(', ')+'번':'')+'</span>':'없음')+'</div><div>첫 시도 정답 '+f+'/'+QL.length+'· 틀린 횟수 '+fx+'</div><div style="margin-top:8px"><button type="button" data-chk="1">'+(chk?'확인 취소':'노트 확인 완료')+'</button></div></div>';
 }
 h+='<div style="margin-top:14px"><a href="./" style="display:inline-block;background:var(--pri);color:#fff;text-decoration:none;font-weight:700;padding:9px 20px;border-radius:8px">M1 Reading 목록으로</a></div>';
 return h+'</div>';
}
function lognote(q){var n=q.note;wlog('s','2단계 · 요약문 완성',[{n:q.dn,a:'정답 '+CN[q.a]+' '+q.ans,m:[n.en,n.ko].concat(n.words.map(function(w){return w[0]+' = '+w[1]}))}])}
function pickOpt(n,j){var q=qById(n),st=qst[n];if(!st||st.ok)return;if(!st.t1)st.t1=Date.now();
 if(j===q.a){st.ok=1;if(q.note)lognote(q);}
 else if(st.w.indexOf(j)<0){st.w.push(j);st.ok=1;if(q.note)lognote(q)}
 var y=window.scrollY;render();window.scrollTo(0,y);
}
function advQ(n){var st=qst[n];if(!st||st.adv)return;st.adv=1;if(allAdv()){tmFlush();TM.done=1}
 render();var ix=QL.indexOf(qById(n)),nx=ix<QL.length-1?QL[ix+1]:null,el=nx?document.getElementById('q'+nx.n):document.querySelector('.res');
 if(el){var ty=el.getBoundingClientRect().top+window.pageYOffset-8;window.scrollTo(0,ty);setTimeout(function(){window.scrollTo(0,el.getBoundingClientRect().top+window.pageYOffset-8)},60)}
}
document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){var sb=+b.dataset.sub;s1t[sb]=Date.now()-mark;mark=Date.now();done[sb]=true;render();
  var fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(aDone())save(fo);
