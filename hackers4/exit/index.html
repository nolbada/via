<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 4 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>
</head>

<script>
var P=[{"u":1,"id":"hk4-01-1","no":1,"ko":"홍차 먼저 vs. 우유 먼저\b","items":[{"n":1,"t":"tf","q":"People in the U.K. argue about whether the milk or the tea should be put in the cup first.","ko":"영국 사람들은 우유와 홍차 중 어느 것을 컵에 먼저 부어야 하는지 논쟁한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"In the U.K., people have been arguing about the best way to make tea.","영국에서, 사람들은 홍차를 만드는 최상의 방법에 대해 논쟁해왔다."],[3,"Which should be put in the cup first—the milk or the tea?","우유 또는 홍차 중 어떤 것이 컵에 먼저 부어져야 하는가?"]],"w":"2번에서 홍차를 만드는 최상의 방법에 대해 논쟁해 왔다고 하고, 3번에서 우유와 홍차 중 무엇을 컵에 먼저 부어야 하는지 묻고 있어요.","c":"T"},"h":"318ef642a5"},{"n":2,"t":"tf","q":"The rich poured the milk first because their teacups were weak.","ko":"부유한 사람들은 찻잔이 약했기 때문에 우유를 먼저 부었다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"On the other hand, the rich preferred Tea in First (TIF).","반면에, 부유한 사람들은 ‘홍차 먼저(TIF)’를 선호했다."],[10,"They could afford expensive teacups that didn’t break easily, so they poured the tea in first.","그들은 쉽게 부서지지 않는 비싼 찻잔을 살 여유가 있어서, 홍차를 먼저 부었다."]],"w":"부유한 사람들은 쉽게 부서지지 않는 비싼 찻잔을 살 수 있었고(10번), 홍차를 먼저 부었어요(9~10번). 우유를 먼저 부은 사람들은 연약한 찻잔을 쓰던 사람들이에요.","c":"F"},"h":"0e80814a16"},{"n":3,"t":"tf","q":"Hot tea made many teacups crack because of a sudden change in temperature.","ko":"뜨거운 홍차는 갑작스러운 온도 변화 때문에 많은 찻잔에 금이 가게 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When the boiling hot tea was poured into them, they cracked due to the sudden change in temperature.","끓듯이 뜨거운 홍차가 찻잔 안에 부어졌을 때, 그것들은 갑작스러운 온도 변화 때문에 금이 갔다."]],"w":"6번에서 끓듯이 뜨거운 홍차를 붓자 갑작스러운 온도 변화 때문에 찻잔이 금이 갔다(they cracked due to the sudden change in temperature)고 해요.","c":"T"},"h":"9e59ccb546"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the 1700s, ..., most teacups were delicate.)","ko":"1700년대에, ..., 대부분의 찻잔은 ( ).","opts":["연약했다","거대했다","비쌌다","따뜻했다"],"word":"delicate","r":{"a":"1) 연약했다","ev":"5~6번 문장","s":[[5,"In the 1700s, when tea first became popular in the U.K., most teacups were delicate.","1700년대에, 홍차가 처음으로 영국에서 인기를 얻었을 때, 대부분의 찻잔은 연약했다."],[6,"When the boiling hot tea was poured into them, they cracked due to the sudden change in temperature.","끓듯이 뜨거운 홍차가 찻잔 안에 부어졌을 때, 그것들은 갑작스러운 온도 변화 때문에 금이 갔다."]],"w":"뜨거운 홍차를 부으면 금이 갔다고 하니(6번) 찻잔이 연약했다는 뜻이에요. delicate = 연약한, 깨지기 쉬운.","c":1},"h":"5b9072a162"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (On the other hand, the rich preferred Tea in First (TIF).)","ko":"반면에, 부유한 사람들은 ‘홍차 먼저(TIF)’를 ( ).","opts":["두려워했다","선호했다","거부했다","만들었다"],"word":"preferred","r":{"a":"2) 선호했다","ev":"9~10번 문장","s":[[9,"On the other hand, the rich preferred Tea in First (TIF).","반면에, 부유한 사람들은 ‘홍차 먼저(TIF)’를 선호했다."],[10,"They could afford expensive teacups that didn’t break easily, so they poured the tea in first.","그들은 쉽게 부서지지 않는 비싼 찻잔을 살 여유가 있어서, 홍차를 먼저 부었다."]],"w":"부유한 사람들은 홍차를 먼저 부었고(10번), 그 방법을 선호했다는 흐름이에요. prefer = 선호하다.","c":2},"h":"e01bf87330"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is why the Milk in First (MIF) method became common.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 ‘우유 먼저(MIF)’ 방법이 흔해졌던 이유이다.","opts":["홍차가 영국에서 처음 인기를 얻은 것","많은 사람들이 더 차가운 우유를 먼저 붓기 시작한 것","부유한 사람들이 비싼 찻잔을 산 것","홍차와 우유의 맛이 서로 다른 것"],"r":{"a":"2) 많은 사람들이 더 차가운 우유를 먼저 붓기 시작한 것","ev":"7~8번 문장","s":[[7,"Therefore, many people began to pour the cooler milk in first.","따라서, 많은 사람들이 더 차가운 우유를 먼저 붓기 시작했다."],[8,"This is why the Milk in First (MIF) method became common.","이것이 ‘우유 먼저(MIF)’ 방법이 흔해졌던 이유이다."]],"w":"8번의 This는 바로 앞 7번 내용이에요. 많은 사람들이 더 차가운 우유를 먼저 붓기 시작했고, 그래서 MIF 방법이 흔해졌어요.","c":2},"h":"5ca44971f7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Three hundred years later, the debate over MIF versus TIF is still going on!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"삼백 년 후에도, MIF 대 TIF에 대한 논쟁은 여전히 계속되고 있는 중이다!","opts":["삼백 년이 지나서 MIF가 TIF를 이겼다.","삼백 년이 지난 지금도 MIF와 TIF에 대한 논쟁이 계속되고 있다.","삼백 년 전에 MIF와 TIF 논쟁이 끝났다.","삼백 년 뒤에는 TIF가 완전히 사라질 것이다."],"r":{"a":"2) 삼백 년이 지난 지금도 MIF와 TIF에 대한 논쟁이 계속되고 있다.","ev":"12번 문장","s":[[12,"Three hundred years later, the debate over MIF versus TIF is still going on!","삼백 년 후에도, MIF 대 TIF에 대한 논쟁은 여전히 계속되고 있는 중이다!"]],"w":"still going on은 '여전히 계속되고 있다'는 뜻이에요. 논쟁이 끝났다거나 한쪽이 이겼다는 말은 없어요.","c":2},"h":"5c5f348095"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["홍차에 대한 논쟁은 매우 긴 역사를 가지고 있다.","홍차는 영국에서 겨우 10년 동안만 인기를 끌었다.","영국의 모든 사람이 홍차를 만드는 최상의 방법에 동의한다.","영국에서는 아무도 홍차 만드는 법에 대해 이야기하지 않는다."],"opts":["The debate about tea has a very long history.","Tea has been popular in the U.K. for only ten years.","Everyone in the U.K. agrees on the best way to make tea.","Nobody in the U.K. talks about how to make tea."],"r":{"a":"1) The debate about tea has a very long history. (홍차에 대한 논쟁은 매우 긴 역사를 가지고 있다.)","ev":"4번 문장","s":[[4,"The debate has a very long history.","그 논쟁은 매우 긴 역사를 가지고 있다."]],"w":"4번에서 논쟁(debate)은 매우 긴 역사를 가지고 있다고 했어요. 2번에서 사람들이 최상의 방법을 두고 논쟁해 왔다고 했으니 모두가 동의한다는 말은 틀려요.","c":1},"h":"c4fd3cf796"},{"n":9,"t":"sum","q":"The rich (A) the color, smell, and taste of the tea before adding the (B).","ko":"부유한 사람들은 (B)을(를) 더하기 전에 홍차의 색, 향, 맛을 (A).","oko":["(A) 즐겼다 / (B) 설탕","(A) 즐겼다 / (B) 우유","(A) 싫어했다 / (B) 우유","(A) 잃었다 / (B) 레몬","(A) 싫어했다 / (B) 설탕"],"opts":["(A) enjoyed / (B) sugar","(A) enjoyed / (B) milk","(A) hated / (B) milk","(A) lost / (B) lemon","(A) hated / (B) sugar"],"r":{"a":"2) (A) enjoyed / (B) milk ((A) 즐겼다 / (B) 우유)","ev":"11번 문장","s":[[11,"This way, they could enjoy the color, smell, and taste of the tea before adding the milk.","이 방법으로, 그들은 우유를 더하기 전에 홍차의 색, 향, 그리고 맛을 즐길 수 있었다."]],"w":"11번에서 부유한 사람들은 우유를 더하기 전에 홍차의 색, 향, 맛을 즐길 수 있었다고 해요. 설탕과 레몬은 본문에 나오지 않아요.","c":2},"h":"c65d59cbc5"},{"n":10,"t":"fill","q":"We all have different [A] when it comes to [B].","ko":"우리는 [B]에 관해서라면 모두 다른 [A]을(를) 가지고 있다.","bank":["preferences","food","cracked","popular","sudden","delicate"],"bko":{"preferences":"기호, 선호","food":"음식","cracked":"금이 갔다(crack의 과거)","popular":"인기 있는","sudden":"갑작스러운","delicate":"연약한"},"a":"[A] preferences, [B] food","r":{"a":"[A] preferences (기호, 선호), [B] food (음식)","ev":"1번 문장","s":[[1,"We all have different preferences when it comes to food.","우리는 음식에 관해서라면 모두 다른 기호를 가지고 있다."]],"w":"1번에서 We all have different preferences when it comes to food라고 했어요. have 뒤에는 명사 preferences, to 뒤에는 명사 food가 와요. popular·sudden·delicate는 형용사, cracked는 동사 과거형이에요.","c":null},"h":"bbd6f60d72"}]},{"u":1,"id":"hk4-01-2","no":2,"ko":"내 집중력을 들었다 놨다\b","items":[{"n":1,"t":"tf","q":"After drinking an energy drink, Alex could focus better at first.","ko":"에너지 음료를 마신 뒤, Alex는 처음에는 더 잘 집중할 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He immediately felt more awake and could focus better.","그는 즉시 더 깨어 있는 기분을 느꼈고 더 잘 집중할 수 있었다."]],"w":"3번에서 그는 즉시 더 깨어 있는 기분을 느꼈고 더 잘 집중할 수 있었다고 해요.","c":"T"},"h":"2ad0f5c3f1"},{"n":2,"t":"tf","q":"Energy drinks contain no sugar or caffeine.","ko":"에너지 음료에는 설탕이나 카페인이 들어 있지 않다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Energy drinks commonly contain lots of caffeine and sugar.","에너지 음료에는 보통 많은 양의 카페인과 설탕이 들어 있다."]],"w":"7번에서 에너지 음료에는 보통 많은 양의 카페인과 설탕이 들어 있다고 해요. 들어 있지 않다는 말은 반대예요.","c":"F"},"h":"df24375bde"},{"n":3,"t":"tf","q":"A sugar crash happens when blood sugar level and energy go down rapidly.","ko":"슈거 크래시는 혈당 수치와 에너지가 급속히 낮아질 때 일어난다.","r":{"a":"T (본문과 맞는 내용)","ev":"12~13번 문장","s":[[12,"As a result, the increased blood sugar level starts to go down rapidly, and so does your energy.","결과적으로, 증가된 혈당 수치는 급속히 낮아지기 시작하고, 당신의 에너지도 그렇다."],[13,"This is a phenomenon known as a sugar crash.","이것이 슈거 크래시라고 알려진 현상이다."]],"w":"12번에서 혈당 수치와 에너지가 급속히 낮아진다고 하고, 13번에서 이것이 슈거 크래시라고 알려진 현상이라고 해요.","c":"T"},"h":"0dd8b47e7a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He immediately felt more awake and could focus better.)","ko":"그는 ( ) 더 깨어 있는 기분을 느꼈고 더 잘 집중할 수 있었다.","opts":["천천히","즉시","가끔","마침내"],"word":"immediately","r":{"a":"2) 즉시","ev":"2~3번 문장","s":[[2,"He couldn’t keep his eyes open, so he had an energy drink.","그는 눈을 계속 뜨고 있을 수 없어서, 에너지 음료를 마셨다."],[3,"He immediately felt more awake and could focus better.","그는 즉시 더 깨어 있는 기분을 느꼈고 더 잘 집중할 수 있었다."]],"w":"에너지 음료를 마신 바로 그 순간 느낀 변화예요. immediately = 즉시, 바로.","c":2},"h":"98d71c3651"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (..., your body produces insulin to maintain a steady blood sugar level.)","ko":"..., 당신의 몸은 일정한 혈당 수치를 ( ) 위해 인슐린을 분비한다.","opts":["낮추기","유지하기","잃기","높이기"],"word":"maintain","r":{"a":"2) 유지하기","ev":"11번 문장","s":[[11,"In addition, when you take in a lot of sugar, your body produces insulin to maintain a steady blood sugar level.","게다가, 많은 양의 설탕을 섭취하면, 당신의 몸은 일정한 혈당 수치를 유지하기 위해 인슐린을 분비한다."]],"w":"인슐린은 혈당 수치를 일정하게 지키려고 나와요. maintain = 유지하다.","c":2},"h":"90791dbc03"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis helps you concentrate better.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 당신이 더 잘 집중하도록 돕는다.","opts":["카페인이 몸에 완전히 흡수되는 것","설탕과 카페인이 심박수, 혈압, 에너지 수치를 빠르게 높이는 것","Alex가 밤늦게 시험공부를 한 것","몸이 인슐린을 분비하는 것"],"pron":"This","r":{"a":"2) 설탕과 카페인이 심박수, 혈압, 에너지 수치를 빠르게 높이는 것","ev":"8~9번 문장","s":[[8,"When you drink them, the sugar and caffeine quickly raise your heart rate, blood pressure, and energy level.","그것을 마시면, 설탕과 카페인은 빠르게 당신의 심박수, 혈압, 그리고 에너지 수치를 높인다."],[9,"This helps you concentrate better.","이것은 당신이 더 잘 집중하도록 돕는다."]],"w":"9번의 This는 바로 앞 8번 내용이에요. 설탕과 카페인이 심박수, 혈압, 에너지 수치를 빠르게 높이고, 이것이 집중을 돕는다는 말이에요.","c":2,"k":"This = 설탕과 카페인이 심박수, 혈압, 에너지 수치를 빠르게 높이는 것"},"h":"ebd25d39ee"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Thus, energy drinks are only useful if you need to concentrate for a brief period.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서, 에너지 음료는 짧은 기간 동안 집중해야 할 경우에만 유용하다.","opts":["에너지 음료는 오랫동안 집중해야 할 때 가장 유용하다.","에너지 음료는 짧은 시간만 집중하면 될 때에만 쓸모가 있다.","에너지 음료는 집중력에 전혀 도움이 되지 않는다.","에너지 음료는 짧은 시간 동안 마셔야 한다."],"r":{"a":"2) 에너지 음료는 짧은 시간만 집중하면 될 때에만 쓸모가 있다.","ev":"14번 문장","s":[[14,"Thus, energy drinks are only useful if you need to concentrate for a brief period.","따라서, 에너지 음료는 짧은 기간 동안 집중해야 할 경우에만 유용하다."]],"w":"only useful if ~ brief period는 '짧은 기간 집중할 때만 유용하다'는 뜻이에요. 효과가 길게 가지 않기 때문이에요.","c":2},"h":"bb79e14d23"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["카페인의 효과는 약 45분 뒤에 사라지기 시작한다.","에너지 음료를 마신 Alex는 밤새 깨어 있었다.","몸은 심박수를 높이기 위해 인슐린을 분비한다.","에너지 음료는 심박수와 혈압을 낮춘다."],"opts":["The effect of caffeine starts to go away after about 45 minutes.","Alex stayed awake all night after the energy drink.","Your body produces insulin to raise your heart rate.","Energy drinks lower your heart rate and blood pressure."],"r":{"a":"1) The effect of caffeine starts to go away after about 45 minutes.","ev":"10번 문장","s":[[10,"But after about 45 minutes, the effect starts to go away as the caffeine is completely absorbed in your body.","그러나 약 45분 후에, 카페인이 몸에 완전히 흡수됨에 따라 그 효과는 사라지기 시작한다."]],"w":"10번에서 약 45분 뒤 카페인이 완전히 흡수되면서 효과가 사라지기 시작한다고 해요. Alex는 잠이 들었고(5번), 인슐린은 혈당 수치를 일정하게 유지하려고 나오며(11번), 에너지 음료는 심박수와 혈압을 높여요(8번).","c":1},"h":"b13d762a8f"},{"n":9,"t":"sum","q":"Alex became even more (A) than before and eventually fell (B).","ko":"Alex는 전보다 훨씬 더 (A)해졌고 결국 (B) 들었다.","oko":["(A) 피곤 / (B) 잠","(A) 피곤 / (B) 깨어","(A) 행복 / (B) 잠","(A) 튼튼 / (B) 깨어","(A) 행복 / (B) 깨어"],"opts":["(A) tired / (B) asleep","(A) tired / (B) awake","(A) happy / (B) asleep","(A) strong / (B) awake","(A) happy / (B) awake"],"r":{"a":"1) (A) tired / (B) asleep ((A) 피곤 / (B) 잠)","ev":"5번 문장","s":[[5,"He soon became even more tired than before and eventually fell asleep!","그는 곧 전보다 훨씬 더 피곤해졌고 결국 잠이 들었다!"]],"w":"5번에서 그는 전보다 훨씬 더 피곤해졌고(tired) 결국 잠이 들었다(fell asleep)고 해요. fell awake는 어색한 표현이에요.","c":1},"h":"85078a923d"},{"n":10,"t":"fill","q":"He couldn’t [A] his eyes open, so he [B] an energy drink.","ko":"그는 눈을 뜬 채로 [A] 수 없어서, 에너지 음료를 [B].","bank":["keep","had","produce","absorbed","brief","commonly"],"bko":{"keep":"유지하다, 계속 ~하다","had":"마셨다(have의 과거)","produce":"생산하다","absorbed":"흡수된","brief":"짧은","commonly":"보통, 흔히"},"a":"[A] keep, [B] had","r":{"a":"[A] keep (유지하다, 계속 ~하다), [B] had (마셨다(have의 과거))","ev":"2번 문장","s":[[2,"He couldn’t keep his eyes open, so he had an energy drink.","그는 눈을 계속 뜨고 있을 수 없어서, 에너지 음료를 마셨다."]],"w":"2번에서 He couldn’t keep his eyes open, so he had an energy drink라고 했어요. couldn’t 뒤에는 동사원형 keep, 두 번째 자리에는 과거형 had가 와요. brief는 형용사, commonly는 부사예요.","c":null},"h":"e89faaf2af"}]},{"u":1,"id":"hk4-01-3","no":3,"ko":"하늘 아래 또 하늘이?! \b","items":[{"n":1,"t":"tf","q":"Salar de Uyuni was formed after lakes that had been there dried up.","ko":"우유니 소금사막은 그곳에 있었던 호수가 말라붙은 후에 형성되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It was formed after lakes that once had been there dried up thousands of years ago.","그것은 한때 그곳에 있었던 호수가 수천 년 전에 말라붙은 후에 형성되었다."]],"w":"2번에서 한때 그곳에 있었던 호수가 수천 년 전에 말라붙은 후에 형성되었다고 해요.","c":"T"},"h":"bccfdb04da"},{"n":2,"t":"tf","q":"Salar de Uyuni is popular only for travelers.","ko":"우유니 소금사막은 오직 관광객들에게만 인기 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Salar de Uyuni is a popular place not only for travelers but also for thousands of flamingos.","우유니 소금사막은 관광객들뿐 아니라 수천 마리의 홍학들에게도 인기 있는 장소이다."]],"w":"11번에서 not only for travelers but also for thousands of flamingos라고 해요. 관광객뿐 아니라 수천 마리의 홍학에게도 인기 있어요.","c":"F"},"h":"7c3a0cc091"},{"n":3,"t":"tf","q":"Salar de Uyuni offers a unique experience whenever you visit.","ko":"우유니 소금사막은 당신이 언제 방문하더라도 독특한 경험을 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Salar de Uyuni offers a unique experience no matter when you visit.","우유니 소금사막은 당신이 언제 방문하더라도 독특한 경험을 제공한다."]],"w":"3번의 no matter when you visit는 '언제 방문하더라도'라는 뜻이에요. 우기든 건기든 독특한 경험을 준다는 내용과 일치해요.","c":"T"},"h":"90971e9356"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Salar de Uyuni offers a unique experience no matter when you visit.)","ko":"우유니 소금사막은 당신이 언제 방문하더라도 ( ) 경험을 제공한다.","opts":["평범한","독특한","위험한","값비싼"],"word":"unique","r":{"a":"2) 독특한","ev":"3~4번 문장","s":[[3,"Salar de Uyuni offers a unique experience no matter when you visit.","우유니 소금사막은 당신이 언제 방문하더라도 독특한 경험을 제공한다."],[4,"During the rainy season, the desert becomes the world’s biggest natural mirror.","우기 동안에, 그 사막은 세계의 가장 큰 천연 거울이 된다."]],"w":"3번에서 언제 가도 '독특한' 경험을 준다고 하고, 4번에서 우기에는 세계에서 가장 큰 천연 거울이 된다고 해요. 다른 곳에 없는 특별한 경험이라는 뜻이에요. unique = 독특한.","c":2},"h":"05b076034c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is hard to tell where the land stops and where the sky starts.)","ko":"땅이 어디에서 끝나고 하늘이 어디에서 시작하는지 ( ) 어렵다.","opts":["구별하기","말하기","믿기","찾아가기"],"word":"tell","r":{"a":"1) 구별하기","ev":"5~6번 문장","s":[[5,"The entire surface is covered with a layer of rainwater, and it reflects the sky perfectly.","전체 표면이 빗물 층으로 덮이고, 그것은 하늘을 완벽하게 비춘다."],[6,"It is hard to tell where the land stops and where the sky starts.","땅이 어디에서 끝나는지 그리고 하늘이 어디에서 시작하는지 구별하기가 어렵다."]],"w":"하늘이 빗물에 완벽하게 비쳐서(5번) 땅과 하늘의 경계를 가려내기 어렵다는 뜻이에요. 여기서 tell은 '말하다'가 아니라 '구별하다'예요.","c":1},"h":"de6a0da455"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nMeanwhile, during the dry season, it offers a totally different experience.","ko":"밑줄 친 it이 가리키는 것은?","sko":"한편, 건기 동안에, 그것은 완전히 다른 경험을 제공한다.","opts":["우유니 소금사막","건기","홍학","빗물"],"pron":"it","r":{"a":"1) 우유니 소금사막","ev":"4번, 8번 문장","s":[[4,"During the rainy season, the desert becomes the world’s biggest natural mirror.","우기 동안에, 그 사막은 세계의 가장 큰 천연 거울이 된다."],[8,"Meanwhile, during the dry season, it offers a totally different experience.","한편, 건기 동안에, 그것은 완전히 다른 경험을 제공한다."]],"w":"8번의 it은 앞에서 계속 이야기한 우유니 소금사막(the desert, 4번)이에요. 우기에는 거울이 되고, 건기에는 완전히 다른 경험을 제공한다는 말이에요.","c":1,"k":"it = 우유니 소금사막"},"h":"99d1e18fb2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you’re lucky enough, you may see them walking gracefully around the desert!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 당신이 충분히 운이 좋다면, 아마 그것들이 사막 주위를 우아하게 걷고 있는 것을 볼 수도 있다!","opts":["운이 나쁘면 홍학들이 사막을 떠난다.","홍학들은 언제나 사막 주위를 걷고 있다.","운이 충분히 좋으면 홍학들이 사막 주위를 우아하게 걷는 모습을 볼 수도 있다.","당신은 홍학들을 따라 사막 주위를 걸어야 한다."],"r":{"a":"3) 운이 충분히 좋으면 홍학들이 사막 주위를 우아하게 걷는 모습을 볼 수도 있다.","ev":"11~12번 문장","s":[[11,"Salar de Uyuni is a popular place not only for travelers but also for thousands of flamingos.","우유니 소금사막은 관광객들뿐 아니라 수천 마리의 홍학들에게도 인기 있는 장소이다."],[12,"If you’re lucky enough, you may see them walking gracefully around the desert!","만약 당신이 충분히 운이 좋다면, 아마 그것들이 사막 주위를 우아하게 걷고 있는 것을 볼 수도 있다!"]],"w":"lucky enough는 '충분히 운이 좋은', may는 '~할 수도 있다'예요. 언제나 볼 수 있다는 뜻도, 홍학이 떠난다는 뜻도 아니에요.","c":3},"h":"ab68e21c92"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우유니 소금사막은 세계에서 가장 큰 소금사막이다.","우유니 소금사막은 아프리카에서 가장 큰 소금사막이다.","우유니 소금사막은 볼리비아에서 가장 작은 소금사막이다.","우유니 소금사막은 산속의 유명한 호수이다."],"opts":["Salar de Uyuni is the largest salt desert in the world.","Salar de Uyuni is the largest salt desert in Africa.","Salar de Uyuni is the smallest salt desert in Bolivia.","Salar de Uyuni is a famous lake in the mountains."],"r":{"a":"1) Salar de Uyuni is the largest salt desert in the world. (우유니 소금사막은 세계에서 가장 큰 소금사막이다.)","ev":"1번 문장","s":[[1,"Salar de Uyuni, located in Bolivia, is the largest salt desert in the world.","볼리비아에 위치한 우유니 소금사막은, 세계에서 가장 큰 소금사막이다."]],"w":"1번에서 볼리비아에 위치한 우유니 소금사막은 세계에서 가장 큰 소금사막이라고 했어요.","c":1},"h":"2f7985cc91"},{"n":9,"t":"sum","q":"In the dry season, the desert looks like a giant white (A), because the salt forms a (B) pattern.","ko":"건기에 사막은 거대한 흰 (A)처럼 보이는데, 소금이 (B) 무늬를 이루기 때문이다.","oko":["(A) 벌집 / (B) 육각형","(A) 벌집 / (B) 사각형","(A) 거울 / (B) 육각형","(A) 거울 / (B) 둥근","(A) 구름 / (B) 사각형"],"opts":["(A) honeycomb / (B) hexagon","(A) honeycomb / (B) square","(A) mirror / (B) hexagon","(A) mirror / (B) round","(A) cloud / (B) square"],"r":{"a":"1) (A) honeycomb / (B) hexagon ((A) 벌집 / (B) 육각형)","ev":"9~10번 문장","s":[[9,"As the rainwater dries up, it leaves behind salt in an interesting hexagon pattern.","빗물이 마르면서, 그것은 소금을 흥미로운 육각형 무늬로 남겨 둔다."],[10,"The desert looks like a giant white honeycomb.","그 사막은 거대한 흰 벌집처럼 보인다."]],"w":"9~10번에서 빗물이 마르면 소금이 육각형(hexagon) 무늬로 남고, 사막은 거대한 흰 벌집(honeycomb)처럼 보인다고 해요. 거울은 우기의 모습이에요(4번).","c":1},"h":"e71804bc0d"},{"n":10,"t":"fill","q":"During the rainy season, the entire surface is [A] with a layer of rainwater, and it [B] the sky perfectly.","ko":"우기에는 전체 표면이 빗물 층으로 [A], 그것은 하늘을 완벽하게 [B].","bank":["covered","reflects","dried","located","tell","leaves"],"bko":{"covered":"덮인","reflects":"비춘다","dried":"말랐다","located":"위치한","tell":"구별하다","leaves":"남겨 둔다"},"r":{"a":"[A] covered, [B] reflects","ev":"5번 문장","s":[[5,"The entire surface is covered with a layer of rainwater, and it reflects the sky perfectly.","전체 표면이 빗물 층으로 덮이고, 그것은 하늘을 완벽하게 비춘다."]],"w":"5번에서 The entire surface is covered with a layer of rainwater, and it reflects the sky perfectly라고 했어요. dried(말랐다)는 우기에 빗물로 덮인다는 내용과 맞지 않고, located·tell·leaves는 [A], [B] 자리에 넣으면 뜻이 통하지 않아요.","c":null},"h":"74cc083ae4"}]},{"u":1,"id":"hk4-01-4","no":4,"ko":"미라를 두 번 죽이는 일\b","items":[{"n":1,"t":"tf","q":"In the 16th and 17th century, Europeans ate mummies to treat illnesses.","ko":"16~17세기에 유럽인들은 질병을 치료하려고 미라를 먹었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"In the 16th and 17th century, Europeans ate mummies as a treatment for various illnesses.","16세기와 17세기에, 유럽인들은 미라를 다양한 질병의 치료제로써 먹었다."]],"w":"4번에서 16~17세기 유럽인들이 미라를 다양한 질병의 치료제로써 먹었다고 해요.","c":"T"},"h":"480559ad3f"},{"n":2,"t":"tf","q":"Europeans believed that dead human bodies had no healing power.","ko":"유럽인들은 죽은 사람의 몸에 치유하는 힘이 없다고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"They believed that dead human bodies possessed healing powers.","그들은 죽은 사람의 몸에 치유하는 힘이 있다고 믿었다."]],"w":"5번에서 유럽인들은 죽은 사람의 몸에 치유하는 힘(healing powers)이 있다고 믿었어요. 없다는 말은 반대예요.","c":"F"},"h":"3fdd49ad47"},{"n":3,"t":"tf","q":"Mummies were ground into powder and mixed with honey or chocolate.","ko":"미라는 가루로 갈아졌고 꿀이나 초콜릿과 섞였다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Mummies were ground into powder and mixed with honey or chocolate.","미라는 가루로 갈아졌고 꿀이나 초콜릿과 섞였다."]],"w":"9번 문장이 그대로 이 내용이에요. 갈아서 가루로 만든 뒤 꿀이나
