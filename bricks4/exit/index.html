ggers include whispering, tapping, crinkling materials, and brushing sounds.","흔한 ASMR 유발 소리에는 속삭이는 소리, 두드리는 소리, 바스락거리는 재료 소리, 솔질하는 소리가 있다."],[5,"Many people watch ASMR videos to relax, reduce stress, or fall asleep more easily.","많은 사람들이 긴장을 풀거나, 스트레스를 줄이거나, 더 쉽게 잠들기 위해 ASMR 영상을 본다."]],"w":"4번에서 whispering, tapping, crinkling materials, and brushing sounds, 5번에서 relax, reduce stress, or fall asleep more easily라고 함. scientists, participants, experiment, results는 실험 이야기(7~13번)에 나오는 말이라 이 빈칸에는 맞지 않음.","c":null,"ev":"4~5번 문장"},"h":"fd7739e35f"}]},{"u":6,"id":"b4-06-2","no":2,"ko":"왜 우리는 보고 싶은 것만 볼까?","items":[{"n":1,"t":"tf","q":"People who believe the Earth is flat ignore the evidence shown to them.","ko":"지구가 평평하다고 믿는 사람들은 자신에게 보여 준 증거를 무시한다.","r":{"a":"T (본문과 맞는 내용)","s":[[2,"When shown scientific explanations, they ignore the evidence and pay attention only to information that supports their belief.","과학적인 설명을 보여 줘도, 그들은 증거를 무시하고 자신의 믿음을 뒷받침하는 정보에만 주의를 기울인다."]],"w":"2번에서 they ignore the evidence and pay attention only to information that supports their belief라고 함. 증거를 무시한다는 내용과 같음.","c":"T","ev":"2번 문장"},"h":"6a211b83a9"},{"n":2,"t":"tf","q":"Confirmation bias becomes weaker online.","ko":"확증 편향은 온라인에서 더 약해진다.","r":{"a":"F (본문과 다른 내용)","s":[[8,"Confirmation bias becomes stronger online.","확증 편향은 온라인에서 더 강해진다."]],"w":"8번에서 Confirmation bias becomes stronger online(온라인에서 더 강해진다)이라고 함. weaker(약해진다)는 반대.","c":"F","ev":"8번 문장"},"h":"4d1f773ee3"},{"n":3,"t":"tf","q":"Some people still believe the Earth is flat even today.","ko":"오늘날에도 어떤 사람들은 여전히 지구가 평평하다고 믿는다.","r":{"a":"T (본문과 맞는 내용)","s":[[1,"Even today, some people still believe the Earth is flat.","오늘날에도 어떤 사람들은 여전히 지구가 평평하다고 믿는다."]],"w":"1번에서 Even today, some people still believe the Earth is flat이라고 함. 선지와 같음.","c":"T","ev":"1번 문장"},"h":"b3e2e3a014"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (To overcome this bias, the first step is to notice it.)","ko":"이 편향을 ( ) 위해, 첫 단계는 그것을 알아차리는 것이다.","opts":["극복하기","시작하기","따라 하기","퍼뜨리기"],"word":"overcome","r":{"a":"1) 극복하기","s":[[11,"To overcome this bias, the first step is to notice it.","이 편향을 극복하려면, 첫 단계는 그것을 알아차리는 것이다."]],"w":"11번은 문제(편향)를 이겨 내는 방법을 말하는 문장. overcome this bias = 이 편향을 극복하다. 이어서 11~12번에 극복하는 단계(알아차리기, 질문하기)가 나옴.","c":1,"ev":"11번 문장"},"h":"72d59b72c1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... build a more balanced understanding of the world.)","ko":"... 세상에 대한 더 ( ) 이해를 쌓는 ...","opts":["한쪽으로 치우친","균형 잡힌","빠른","어려운"],"word":"balanced","r":{"a":"2) 균형 잡힌","s":[[13,"This will help us think clearly and build a more balanced understanding of the world.","이것은 우리가 명확하게 생각하고 세상에 대한 더 균형 잡힌 이해를 쌓는 데 도움이 될 것이다."]],"w":"13번은 11~12번의 해결책(다른 의견과 사실 고려)을 실천했을 때의 결과. 한쪽 면만 보던 것(9번)과 반대로 여러 면을 보는 이해라 balanced = 균형 잡힌.","c":2,"ev":"13번 문장"},"h":"aab90edec0"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis limits our understanding and increases divisions between groups.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 우리의 이해를 제한하고 집단 간의 분열을 키운다.","opts":["지구가 평평하다는 믿음","과학적인 설명들","알고리즘 때문에 문제의 한쪽 면만 보게 되는 것","열린 마음으로 생각하는 것"],"r":{"a":"3) 알고리즘 때문에 문제의 한쪽 면만 보게 되는 것","s":[[9,"Algorithms recommend content based on what we already like, so we often see only one side of an issue.","알고리즘은 우리가 이미 좋아하는 것을 바탕으로 콘텐츠를 추천하기 때문에, 우리는 어떤 문제의 한쪽 면만 보게 되는 경우가 많다."],[10,"This limits our understanding and increases divisions between groups.","이것은 우리의 이해를 제한하고 집단 간의 분열을 키운다."]],"w":"10번의 This는 바로 앞 9번 내용, 즉 알고리즘이 좋아하는 것만 추천해서 한쪽 면만 보게 되는 것. 그 결과 이해가 제한되고 집단 간 분열이 커짐.","c":3,"ev":"9~10번 문장"},"h":"f2abbf562f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Our brain prefers familiar ideas and often refuses to change our beliefs because it requires mental effort.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리의 뇌는 익숙한 생각을 선호하고, 정신적 노력이 필요하기 때문에 우리의 믿음을 바꾸는 것을 자주 거부한다.","opts":["우리의 뇌는 새로운 생각을 좋아해서 믿음을 쉽게 바꾼다.","우리의 뇌는 노력이 필요 없어서 믿음을 자주 바꾼다.","우리의 뇌는 익숙한 생각을 싫어하고 믿음을 바꾸기를 좋아한다.","우리의 뇌는 익숙한 생각을 좋아하고, 정신적 노력이 필요한 믿음 바꾸기를 자주 거부한다."],"r":{"a":"4) 우리의 뇌는 익숙한 생각을 좋아하고, 정신적 노력이 필요한 믿음 바꾸기를 자주 거부한다.","s":[[4,"Our brain prefers familiar ideas and often refuses to change our beliefs because it requires mental effort.","우리의 뇌는 익숙한 생각을 선호하고, 정신적 노력이 필요하기 때문에 우리의 믿음을 바꾸는 것을 자주 거부한다."]],"w":"prefers familiar ideas는 '익숙한 생각을 선호', often refuses to change our beliefs는 '믿음을 바꾸기를 자주 거부'. because it requires mental effort는 바꾸는 데 정신적 노력이 필요하다는 이유.","c":4,"ev":"4번 문장"},"h":"0ad4ab4ce8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["믿음에 맞는 정보는 빠르게 받아들이고 잘 기억한다.","믿음에 반하는 정보는 기쁘게 받아들이고 잘 기억한다.","알고리즘은 우리가 싫어하는 콘텐츠를 보여 준다.","확증 편향은 온라인에서는 사라진다."],"opts":["We accept information that supports our beliefs quickly and remember it well.","We happily accept information that goes against our beliefs and remember it well.","Algorithms show us content that we dislike.","Confirmation bias disappears online."],"r":{"a":"1) 믿음에 맞는 정보는 빠르게 받아들이고 잘 기억한다.","s":[[5,"When information supports what we already believe, we accept it quickly, overlook errors, and remember it well.","정보가 우리가 이미 믿고 있는 것을 뒷받침하면, 우리는 그것을 빠르게 받아들이고, 오류를 못 본 척 넘어가며, 잘 기억한다."],[6,"But when information goes against our beliefs, we feel uncomfortable, look for faults, and forget it.","하지만 정보가 우리의 믿음에 반하면, 우리는 불편함을 느끼고, 결점을 찾으며, 그것을 잊어버린다."],[8,"Confirmation bias becomes stronger online.","확증 편향은 온라인에서 더 강해진다."],[9,"Algorithms recommend content based on what we already like, so we often see only one side of an issue.","알고리즘은 우리가 이미 좋아하는 것을 바탕으로 콘텐츠를 추천하기 때문에, 우리는 어떤 문제의 한쪽 면만 보게 되는 경우가 많다."]],"w":"5번에서 믿음을 뒷받침하는 정보는 accept it quickly, remember it well. ②는 6번(반하는 정보는 불편해하고 잊음)과 반대. ③은 9번(이미 좋아하는 것을 추천)과 반대. ④는 8번(온라인에서 더 강해짐)과 반대.","c":1,"ev":"5~6번, 8~9번 문장"},"h":"a75dfced5b"},{"n":9,"t":"sum","q":"Online, algorithms show us content we already like, so we see only one side and groups become more (A), and this makes confirmation bias (B).","ko":"온라인에서 알고리즘은 우리가 이미 좋아하는 콘텐츠를 보여 줘서 우리는 한쪽 면만 보고 집단들은 더 (A), 이것은 확증 편향을 (B) 만든다.","oko":["(A) 하나가 된 / (B) 더 강하게","(A) 나뉜 / (B) 더 약하게","(A) 하나가 된 / (B) 더 약하게","(A) 균형 잡힌 / (B) 더 강하게","(A) 나뉜 / (B) 더 강하게"],"opts":["(A) united / (B) stronger","(A) divided / (B) weaker","(A) united / (B) weaker","(A) balanced / (B) stronger","(A) divided / (B) stronger"],"r":{"a":"5) (A) divided / (B) stronger","s":[[8,"Confirmation bias becomes stronger online.","확증 편향은 온라인에서 더 강해진다."],[9,"Algorithms recommend content based on what we already like, so we often see only one side of an issue.","알고리즘은 우리가 이미 좋아하는 것을 바탕으로 콘텐츠를 추천하기 때문에, 우리는 어떤 문제의 한쪽 면만 보게 되는 경우가 많다."],[10,"This limits our understanding and increases divisions between groups.","이것은 우리의 이해를 제한하고 집단 간의 분열을 키운다."]],"w":"8번에서 온라인에서는 확증 편향이 stronger, 9번에서 한쪽 면만 보게 됨, 10번에서 집단 간 divisions(분열)가 커짐. 그래서 (A) divided, (B) stronger.","c":5,"ev":"8~10번 문장"},"h":"0d36b66b32"},{"n":10,"t":"fill","q":"To overcome this bias, the first step is to [A] it, and then we can [B] our views and consider other opinions.","ko":"이 편향을 극복하려면 첫 단계는 그것을 [A] 것이고, 그런 다음 우리는 우리의 견해를 [B] 다른 의견을 고려할 수 있다.","bank":["notice","question","evidence","faults","groups","algorithms"],"bko":{"notice":"알아차리다","question":"의문을 품다","evidence":"증거","faults":"결점","groups":"집단","algorithms":"알고리즘"},"r":{"a":"[A] notice, [B] question","s":[[11,"To overcome this bias, the first step is to notice it.","이 편향을 극복하려면, 첫 단계는 그것을 알아차리는 것이다."],[12,"Then we can question our views and consider other opinions and facts with an open mind.","그런 다음 우리는 우리의 견해에 의문을 품고 열린 마음으로 다른 의견과 사실을 고려할 수 있다."]],"w":"11번에서 the first step is to notice it, 12번에서 Then we can question our views and consider other opinions라고 함. evidence(2번), faults(6번), groups(10번), algorithms(9번)는 명사라서 동작을 넣는 빈칸에 들어갈 수 없음.","c":null,"ev":"11~12번 문장"},"h":"42029df4ac"}]},{"u":6,"id":"b4-06-3","no":3,"ko":"메기를 넣었더니 정어리가 살아 도착한 이유는?","items":[{"n":1,"t":"tf","q":"A fisherman put a few catfish into the tank with the sardines.","ko":"한 어부가 정어리가 있는 수조에 메기 몇 마리를 넣었다.","r":{"a":"T (본문과 맞는 내용)","s":[[5,"He placed a few catfish into the tank.","그는 메기 몇 마리를 수조에 넣었다."]],"w":"5번에서 He placed a few catfish into the tank라고 함. 메기 몇 마리를 수조에 넣었으므로 본문과 같음.","c":"T","ev":"5번 문장"},"h":"06353a210d"},{"n":2,"t":"tf","q":"The sardines always arrived at the market alive before the fisherman tried something new.","ko":"어부가 새로운 것을 시도하기 전에는 정어리들이 항상 살아서 시장에 도착했다.","r":{"a":"F (본문과 다른 내용)","s":[[3,"The fish often died on the way.","그 물고기들은 가는 도중에 자주 죽었다."]],"w":"3번에서 The fish often died on the way(가는 도중에 자주 죽었다)라고 함. 항상 살아서 도착했다는 말은 반대.","c":"F","ev":"3번 문장"},"h":"dacc8d9aa7"},{"n":3,"t":"tf","q":"Without pressure, people may become too relaxed and lose their drive.","ko":"압박이 없으면, 사람들은 너무 느슨해져서 의욕을 잃을 수 있다.","r":{"a":"T (본문과 맞는 내용)","s":[[11,"Without such pressure, people may become too relaxed and lose their drive.","그런 압박이 없으면, 사람들은 너무 느슨해져서 의욕을 잃을 수 있다."]],"w":"11번에서 Without such pressure, people may become too relaxed and lose their drive라고 함. 선지와 같은 내용.","c":"T","ev":"11번 문장"},"h":"8287f041b5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... the sardines stayed still in the tank and soon became weak and exhausted.)","ko":"... 정어리가 수조 안에서 가만히 있다가 곧 약해지고 ( ) ...","opts":["지치지 않은","활기찬","매우 지친","배고픈"],"word":"exhausted","r":{"a":"3) 매우 지친","s":[[2,"The problem was that the sardines stayed still in the tank and soon became weak and exhausted.","문제는 정어리가 수조 안에서 가만히 있다가 곧 약해지고 지쳐 버린다는 것이었다."],[3,"The fish often died on the way.","그 물고기들은 가는 도중에 자주 죽었다."]],"w":"2번에서 정어리가 가만히 있다가 weak and exhausted(약해지고 지침)가 되었고, 3번에서 도중에 자주 죽었다고 함. exhausted = 매우 지친. 활기찬은 반대.","c":3,"ev":"2~3번 문장"},"h":"bb374ded7a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The Catfish Effect, however, works best in moderation.)","ko":"하지만 메기 효과는 ( ) 가장 잘 작동한다.","opts":["적당할 때","지나칠 때","빠를 때","혼자일 때"],"word":"moderation","r":{"a":"1) 적당할 때","s":[[12,"The Catfish Effect, however, works best in moderation.","하지만 메기 효과는 적당할 때 가장 잘 작동한다."],[13,"Too much pressure can cause stress and worsen performance, but the right amount of challenge can help us grow.","너무 많은 압박은 스트레스를 일으키고 성과를 떨어뜨릴 수 있지만, 적절한 정도의 도전은 우리가 성장하는 데 도움이 될 수 있다."]],"w":"13번에서 too much pressure(너무 많은 압박)는 성과를 떨어뜨리고 the right amount of challenge(알맞은 정도)는 도움이 된다고 함. 그래서 in moderation = 적당할 때(적당함). 지나침은 반대.","c":1,"ev":"12~13번 문장"},"h":"08e2c31551"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThe catfish chased the sardines, forcing them to swim constantly, so they arrived at the market alive and healthy.","ko":"밑줄 친 them이 가리키는 것은?","sko":"메기가 정어리를 쫓아다니며 계속 헤엄치게 만들었고, 그래서 정어리들은 살아 있고 건강한 상태로 시장에 도착했다.","opts":["어부들","메기들","시장 사람들","정어리들"],"r":{"a":"4) 정어리들","s":[[6,"The catfish chased the sardines, forcing them to swim constantly, so they arrived at the market alive and healthy.","메기가 정어리를 쫓아다니며 계속 헤엄치게 만들었고, 그래서 정어리들은 살아 있고 건강한 상태로 시장에 도착했다."]],"w":"forcing them to swim constantly에서 계속 헤엄치게 된 쪽은 메기에게 쫓긴 정어리. 메기(catfish)는 쫓은 쪽이라 them이 아님.","c":4,"ev":"6번 문장"},"h":"8c3d0da64f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Likewise, a smart classmate can push other students to study harder.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마찬가지로, 똑똑한 반 친구는 다른 학생들이 더 열심히 공부하도록 자극할 수 있다.","opts":["똑똑한 반 친구는 다른 학생이 공부를 못하게 방해한다.","똑똑한 반 친구는 다른 학생들이 더 열심히 공부하도록 자극할 수 있다.","똑똑한 반 친구는 다른 학생이 쉬도록 도와준다.","다른 학생들은 똑똑한 반 친구를 따라 공부를 멈춘다."],"r":{"a":"2) 똑똑한 반 친구는 다른 학생들이 더 열심히 공부하도록 자극할 수 있다.","s":[[10,"Likewise, a smart classmate can push other students to study harder.","마찬가지로, 똑똑한 반 친구는 다른 학생들이 더 열심히 공부하도록 자극할 수 있다."]],"w":"push A to B는 'A가 B하도록 자극하다'. a smart classmate가 메기처럼 다른 학생이 study harder(더 열심히 공부)하게 만든다는 뜻.","c":2,"ev":"10번 문장"},"h":"82f9958a70"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["정어리들은 메기가 오기 전에 수조 안에서 많이 움직였다.","메기는 정어리가 쉬도록 도와주었다.","정어리들은 메기가 쫓아다녔기 때문에 살아서 건강하게 시장에 도착했다.","어부들은 수조에 고래를 함께 넣었다."],"opts":["The sardines moved a lot in the tank before the catfish came.","The catfish helped the sardines rest.","The sardines arrived at the market alive and healthy because the catfish chased them.","The fishermen put whales into the tank together."],"r":{"a":"3) 정어리들은 메기가 쫓아다녔기 때문에 살아서 건강하게 시장에 도착했다.","s":[[2,"The problem was that the sardines stayed still in the tank and soon became weak and exhausted.","문제는 정어리가 수조 안에서 가만히 있다가 곧 약해지고 지쳐 버린다는 것이었다."],[5,"He placed a few catfish into the tank.","그는 메기 몇 마리를 수조에 넣었다."],[6,"The catfish chased the sardines, forcing them to swim constantly, so they arrived at the market alive and healthy.","메기가 정어리를 쫓아다니며 계속 헤엄치게 만들었고, 그래서 정어리들은 살아 있고 건강한 상태로 시장에 도착했다."]],"w":"6번에서 메기가 정어리를 쫓아다녀 계속 헤엄치게 했고(chased ... forcing them to swim constantly) 그래서 살아서 건강하게 도착했다고 함. ①은 2번(가만히 있었음)과 반대. ②는 메기가 쫓아다닌 6번과 반대. ④는 본문에 없음.","c":3,"ev":"2번, 5~6번 문장"},"h":"d61e06eb65"},{"n":9,"t":"sum","q":"The Catfish Effect works best when pressure is (A); too much pressure can (B) performance.","ko":"메기 효과는 압박이 (A) 때 가장 잘 작동하며, 너무 많은 압박은 성과를 (B) 수 있다.","oko":["(A) 강할 / (B) 향상시킬","(A) 강할 / (B) 떨어뜨릴","(A) 적당할 / (B) 향상시킬","(A) 없을 / (B) 떨어뜨릴","(A) 적당할 / (B) 떨어뜨릴"],"opts":["(A) strong / (B) improve","(A) strong / (B) worsen","(A) moderate / (B) improve","(A) absent / (B) worsen","(A) moderate / (B) worsen"],"r":{"a":"5) (A) moderate / (B) worsen","s":[[12,"The Catfish Effect, however, works best in moderation.","하지만 메기 효과는 적당할 때 가장 잘 작동한다."],[13,"Too much pressure can cause stress and worsen performance, but the right amount of challenge can help us grow.","너무 많은 압박은 스트레스를 일으키고 성과를 떨어뜨릴 수 있지만, 적절한 정도의 도전은 우리가 성장하는 데 도움이 될 수 있다."]],"w":"12번에서 works best in moderation(적당할 때 가장 잘 작동), 13번에서 too much pressure ... worsen performance(성과를 떨어뜨림)라고 함. strong이나 absent는 본문과 다름.","c":5,"ev":"12~13번 문장"},"h":"75bbb5fd21"},{"n":10,"t":"fill","q":"A little [A] or competition can keep people motivated, and in business, competition can [B] performance.","ko":"약간의 [A]이나 경쟁은 사람들의 동기를 유지시킬 수 있고, 사업에서 경쟁은 성과를 [B] 수 있다.","bank":["pressure","improve","catfish","sardines","relaxed","exhausted"],"bko":{"pressure":"압박","improve":"향상시키다","catfish":"메기","sardines":"정어리들","relaxed":"느슨한","exhausted":"매우 지친"},"r":{"a":"[A] pressure, [B] improve","s":[[8,"Today, the term is used to describe how a little pressure or competition can keep people motivated.","오늘날 이 용어는 약간의 압박이나 경쟁이 어떻게 사람들의 동기를 계속 유지시킬 수 있는지를 설명하는 데 쓰인다."],[9,"In business, it shows that competition can keep people engaged and improve their performance.","사업에서, 그것은 경쟁이 사람들을 계속 몰두하게 하고 그들의 성과를 향상시킬 수 있음을 보여 준다."]],"w":"8번에서 a little pressure or competition can keep people motivated, 9번에서 competition can keep people engaged and improve their performance라고 함. catfish, sardines는 1~6번 이야기에 나오는 말이고, relaxed, exhausted는 압박이 없을 때(11번)나 지친 정어리(2번)의 상태라 빈칸에 맞지 않음.","c":null,"ev":"8~9번 문장"},"h":"aedcd14b73"}]},{"u":6,"id":"b4-06-4","no":4,"ko":"‘내가 틀렸나?’ 스스로를 의심하게 만드는 말의 정체는?","items":[{"n":1,"t":"tf","q":"In the play Gas Light, a husband secretly dims the gas lamps in the house.","ko":"연극 「가스등」에서 한 남편이 집 안의 가스등을 몰래 어둡게 한다.","r":{"a":"T (본문과 맞는 내용)","s":[[1,"In a 1938 play called Gas Light, a husband secretly dims the gas lamps in the house.","1938년의 연극 「가스등」에서, 한 남편이 집 안의 가스등을 몰래 어둡게 한다."]],"w":"1번에서 a husband secretly dims the gas lamps in the house라고 함. 남편이 몰래 가스등을 어둡게 하므로 본문과 같음.","c":"T","ev":"1번 문장"},"h":"42b803b995"},{"n":2,"t":"tf","q":"When the wife notices the lights getting darker, her husband agrees that they are darker.","ko":"아내가 불빛이 점점 어두워지는 것을 알아차리자, 남편은 불빛이 더 어두워졌다는 데 동의한다.","r":{"a":"F (본문과 다른 내용)","s":[[2,"When his wife notices the lights getting darker, he tells her that nothing has changed.","아내가 불빛이 점점 어두워지는 것을 알아차리자, 그는 그녀에게 아무것도 변하지 않았다고 말한다."]],"w":"2번에서 남편은 he tells her that nothing has changed(아무것도 변하지 않았다고 말함)라고 함. 동의한다는 말은 반대.","c":"F","ev":"2번 문장"},"h":"c65abf6c00"},{"n":3,"t":"tf","q":"Writing down your thoughts and talking to a professional counselor is advised.","ko":"자신의 생각을 적어 두고 전문 상담가와 이야기하는 것이 권해진다.","r":{"a":"T (본문과 맞는 내용)","s":[[10,"Write down your thoughts and talk to a professional counselor.","당신의 생각을 적어 두고 전문 상담가와 이야기하라."]],"w":"10번에서 Write down your thoughts and talk to a professional counselor라고 하며 대처법으로 권함. 선지와 같음.","c":"T","ev":"10번 문장"},"h":"caf9240d30"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A gaslighter may lie, deny the truth, or change a story to confuse another person and gain control.)","ko":"... 이야기를 바꿔서 다른 사람을 ( ) 통제력을 얻으려 할 수 있다.","opts":["돕고","혼란스럽게 하고","가르치고","만나고"],"word":"confuse","r":{"a":"2) 혼란스럽게 하고","s":[[6,"A gaslighter may lie, deny the truth, or change a story to confuse another person and gain control.","가스라이팅하는 사람은 거짓말을 하거나, 진실을 부정하거나, 이야기를 바꿔서 다른 사람을 혼란스럽게 하고 통제력을 얻으려 할 수 있다."],[7,"As a result, the victim may lose confidence and start thinking, “Maybe I’m wrong,” even when they are right.","그 결과, 피해자는 자신감을 잃고, 자신이 옳을 때조차도 ‘내가 틀렸나 봐’라고 생각하기 시작할 수 있다."]],"w":"6번에서 거짓말, 진실 부정, 이야기 바꾸기는 상대를 헷갈리게 하려는 행동. 7번에서 그 결과 피해자가 자신이 틀렸나 생각하게 되므로 confuse = 혼란스럽게 하다.","c":2,"ev":"6~7번 문장"},"h":"b381e398c7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As a result, the victim may lose confidence and start thinking, “Maybe I’m wrong,”...)","ko":"그 결과, ( )는 자신감을 잃고, ‘내가 틀렸나 봐’라고 생각하기 시작할 수 있다.","opts":["가해자","목격자","상담가","피해자"],"word":"victim","r":{"a":"4) 피해자","s":[[6,"A gaslighter may lie, deny the truth, or change a story to confuse another person and gain control.","가스라이팅하는 사람은 거짓말을 하거나, 진실을 부정하거나, 이야기를 바꿔서 다른 사람을 혼란스럽게 하고 통제력을 얻으려 할 수 있다."],[7,"As a result, the victim may lose confidence and start thinking, “Maybe I’m wrong,” even when they are right.","그 결과, 피해자는 자신감을 잃고, 자신이 옳을 때조차도 ‘내가 틀렸나 봐’라고 생각하기 시작할 수 있다."]],"w":"6번의 gaslighter(가스라이팅하는 사람)가 하는 행동을 당하는 쪽이 7번의 victim. 자신감을 잃는 쪽이므로 '피해자'.","c":4,"ev":"6~7번 문장"},"h":"9bae246560"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nHe repeats this again and again, so she begins to question her own senses and eventually believes that she is going crazy.","ko":"밑줄 친 this가 가리키는 것은?","sko":"그가 이것을 계속 되풀이하자, 그녀는 자신의 감각을 의심하기 시작하고 결국 자신이 미쳐 가고 있다고 믿게 된다.","opts":["연극을 쓰는 것","가스등을 사러 가는 것","아내에게 아무것도 변하지 않았다고 말하는 것","상담가와 이야기하는 것"],"r":{"a":"3) 아내에게 아무것도 변하지 않았다고 말하는 것","s":[[2,"When his wife notices the lights getting darker, he tells her that nothing has changed.","아내가 불빛이 점점 어두워지는 것을 알아차리자, 그는 그녀에게 아무것도 변하지 않았다고 말한다."],[3,"He repeats this again and again, so she begins to question her own senses and eventually believes that she is going crazy.","그가 이것을 계속 되풀이하자, 그녀는 자신의 감각을 의심하기 시작하고 결국 자신이 미쳐 가고 있다고 믿게 된다."]],"w":"3번의 this는 바로 앞 2번 내용, 즉 아내가 어두워졌다고 알아차렸을 때 남편이 nothing has changed(아무것도 변하지 않았다)라고 말한 것. 그것을 되풀이하자 아내가 자기 감각을 의심하게 됨.","c":3,"ev":"2~3번 문장"},"h":"8901d32513"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, the victim may lose confidence and start thinking, “Maybe I’m wrong,” even when they are right.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 결과, 피해자는 자신감을 잃고, 자신이 옳을 때조차도 ‘내가 틀렸나 봐’라고 생각하기 시작할 수 있다.","opts":["피해자는 자신이 옳을 때에도 자신감을 잃고 ‘내가 틀렸나 봐’라고 생각할 수 있다.","피해자는 자신이 틀렸을 때만 자신감을 잃는다.","피해자는 자신감이 생겨서 항상 자신이 옳다고 생각한다.","피해자는 옳을 때 자신이 옳다고 확신하게 된다."],"r":{"a":"1) 피해자는 자신이 옳을 때에도 자신감을 잃고 ‘내가 틀렸나 봐’라고 생각할 수 있다.","s":[[7,"As a result, the victim may lose confidence and start thinking, “Maybe I’m wrong,” even when they are right.","그 결과, 피해자는 자신감을 잃고, 자신이 옳을 때조차도 ‘내가 틀렸나 봐’라고 생각하기 시작할 수 있다."]],"w":"even when they are right는 '자신이 옳을 때조차도'. 옳은데도 Maybe I’m wrong이라고 생각한다는 점이 핵심이라 ①이 답. 나머지는 자신감을 얻거나 확신한다는 반대 내용.","c":1,"ev":"7번 문장"},"h":"51b69896de"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["가스라이팅은 모르는 사람들 사이에서만 일어난다.","가스라이팅하는 사람은 거짓말을 하거나 진실을 부정하거나 이야기를 바꿀 수 있다.","연극 속 아내는 불빛이 변하지 않는다는 것을 알고 있었다.","가스라이팅하는 사람은 상대가 자신감을 얻도록 돕는다."],"opts":["Gaslighting happens only between strangers.","Gaslighters may lie, deny the truth, or change a story.","The wife in the play knew the lights were not changing.","A gaslighter helps another person gain confidence."],"r":{"a":"2) 가스라이팅하는 사람은 거짓말을 하거나 진실을 부정하거나 이야기를 바꿀 수 있다.","s":[[2,"When his wife notices the lights getting darker, he tells her that nothing has changed.","아내가 불빛이 점점 어두워지는 것을 알아차리자, 그는 그녀에게 아무것도 변하지 않았다고 말한다."],[6,"A gaslighter may lie, deny the truth, or change a story to confuse another person and gain control.","가스라이팅하는 사람은 거짓말을 하거나, 진실을 부정하거나, 이야기를 바꿔서 다른 사람을 혼란스럽게 하고 통제력을 얻으려 할 수 있다."],[8,"Gaslighting often happens between people who are close, like friends or family, because trust makes it easier to believe the gaslighter.","가스라이팅은 친구나 가족처럼 가까운 사람들 사이에서 자주 일어나는데, 신뢰가 가스라이팅하는 사람을 믿기 더 쉽게 만들기 때문이다."]],"w":"6번에서 A gaslighter may lie, deny the truth, or change a story라고 함. ①은 8번(가까운 사람들 사이에서 자주)과 반대. ③은 2번에서 아내가 불빛이 어두워지는 것을 알아차렸다고 해서 반대. ④는 7번(자신감을 잃음)과 반대.","c":2,"ev":"2번, 6번, 8번 문장"},"h":"be7f4cbfa3"},{"n":9,"t":"sum","q":"The wife in Gas Light began to (A) her own senses and eventually believed that she was going (B).","ko":"「가스등」의 아내는 자신의 감각을 (A) 시작했고 결국 자신이 (B) 가고 있다고 믿게 되었다.","oko":["(A) 믿기 / (B) 미쳐","(A) 의심하기 / (B) 집에","(A) 믿기 / (B) 집에","(A) 무시하기 / (B) 미쳐","(A) 의심하기 / (B) 미쳐"],"opts":["(A) trust / (B) crazy","(A) question / (B) home","(A) trust / (B) home","(A) ignore / (B) crazy","(A) question / (B) crazy"],"r":{"a":"5) (A) question / (B) crazy","s":[[3,"He repeats this again and again, so she begins to question her own senses and eventually believes that she is going crazy.","그가 이것을 계속 되풀이하자, 그녀는 자신의 감각을 의심하기 시작하고 결국 자신이 미쳐 가고 있다고 믿게 된다."]],"w":"3번에서 she begins to question her own senses(자신의 감각을 의심하기 시작)하고 eventually believes that she is going crazy(결국 미쳐 간다고 믿게 됨)라고 함. trust, ignore는 의심한다는 흐름과 반대.","c":5,"ev":"3번 문장"},"h":"c6ce561ef7"},{"n":10,"t":"fill","q":"Gaslighting makes someone [A] their own thoughts and feelings, so if you feel it is happening to you, [B] your feelings.","ko":"가스라이팅은 누군가가 자신의 생각과 감정을 [A]하게 만들기 때문에, 이런 일이 일어나고 있다고 느낀다면 당신의 감정을 [B].","bank":["doubt","trust","lie","gain","lamps","story"],"bko":{"doubt":"의심하다","trust":"믿다","lie":"거짓말하다","gain":"얻다","lamps":"등불","story":"이야기"},"r":{"a":"[A] doubt, [B] trust","s":[[5,"The word refers to a harmful behavior that makes someone doubt their own thoughts and feelings.","그 단어는 누군가가 자신의 생각과 감정을 의심하게 만드는 해로운 행동을 가리킨다."],[9,"If you feel this is happening to you, trust your feelings.","이런 일이 당신에게 일어나고 있다고 느낀다면, 당신의 감정을 믿어라."]],"w":"5번에서 gaslighting은 makes someone doubt their own thoughts and feelings이고, 9번에서 If you feel this is happening to you, trust your feelings라고 함. lie(거짓말하다), gain(얻다)은 6번에 나오지만 이 빈칸에 넣으면 뜻이 맞지 않고, lamps(등불), story(이야기)는 명사라 들어갈 수 없음.","c":null,"ev":"5번, 9번 문장"},"h":"6e1d1a1f60"}]},{"u":7,"id":"b4-07-1","no":1,"ko":"우주에서 본 지구가 우주비행사의 마음을 바꾼 이유","items":[{"n":1,"t":"tf","q":"The astronauts see a tiny, beautiful blue ball floating in space when they look down at Earth.","ko":"우주비행사들은 지구를 내려다볼 때 우주에 떠 있는 작고 아름다운 푸른 공을 본다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"When astronauts look down at Earth from space, they do not see borders or countries.","우주비행사들이 우주에서 지구를 내려다볼 때, 그들은 국경이나 나라를 보지 못한다."],[4,"Instead, they see a tiny, beautiful blue ball like a “marble” floating in space.","대신, 그들은 우주에 떠 있는 '구슬'처럼 작고 아름다운 푸른 공을 본다."]],"w":"3번에서 국경이나 나라는 안 보이고, 4번에서 Instead(대신) 작고 아름다운 푸른 공 같은 지구가 보인다고 함. 본문과 일치.","c":"T"},"h":"45d3d73466"},{"n":2,"t":"tf","q":"Astronauts say that the rivalry between the U.S. and Russia still matters a lot.","ko":"우주비행사들은 미국과 러시아의 경쟁이 여전히 매우 중요하다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"However, astronauts who have made the journey say that rivalry no longer matters.","그러나 그 여정을 다녀온 우주비행사들은 이제 그런 경쟁은 중요하지 않다고 말한다."]],"w":"2번에서 우주를 다녀온 사람들은 rivalry no longer matters(경쟁은 더 이상 중요하지 않다)라고 함. 여전히 중요하다는 말은 반대.","c":"F"},"h":"75b6d9b10e"},{"n":3,"t":"tf","q":"Some astronauts write books about their experience and even start charities.","ko":"일부 우주비행사들은 자신의 경험에 대한 책을 쓰고 심지어 자선 단체를 설립하기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Some astronauts share their changed view by writing books about their experience, and even start charities to help others.","일부 우주비행사들은 자신의 경험에 대한 책을 써서 변화된 관점을 공유하고, 심지어 다른 사람들을 돕기 위해 자선 단체를 설립하기도 한다."]],"w":"10번에서 writing books(책을 쓰다)와 start charities(자선 단체를 설립하다)가 그대로 나옴.","c":"T"},"h":"f6a71dee42"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... have long been intense competitors in space exploration.)","ko":"... 우주 탐사에서 오랫동안 ( ) 경쟁자였다.","opts":["친근한","치열한","느긋한","조용한"],"word":"intense","r":{"a":"2) 치열한","ev":"1번 문장","s":[[1,"The U.S. and Russia have long been intense competitors in space exploration.","미국과 러시아는 오랫동안 우주 탐사에서 치열한 경쟁자였다."]],"w":"1번에서 intense competitors는 우주 탐사에서 서로 지지 않으려는 경쟁자. intense = 치열한, 강렬한. 친한이나 조용한은 경쟁과 어울리지 않음.","c":2},"h":"3f81c5ba4b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... concern for protecting the environment and promoting world peace often grows.)","ko":"... 환경을 보호하고 세계 평화를 ( ) 관심이 종종 커진다.","opts":["방해하는","숨기는","증진하는","끝내는"],"word":"promoting","r":{"a":"3) 증진하는","ev":"9번 문장","s":[[9,"As a result, concern for protecting the environment and promoting world peace often grows.","그 결과, 환경을 보호하고 세계 평화를 증진하려는 관심이 종종 커진다."]],"w":"9번에서 환경 보호와 함께 세계 평화를 promote하려는 관심이 커진다고 함. promote(증진하다)는 더 좋아지도록 힘쓴다는 뜻. 방해나 숨김은 반대.","c":3},"h":"733158e7c2"},{"n":6,"t":"ref","q":"What does the underlined \"This view\" refer to?\nThis view changes their hearts deeply.","ko":"밑줄 친 This view가 가리키는 것은?","sko":"이 광경은 그들의 마음을 깊이 바꾼다.","opts":["국경 없이 작고 아름다운 푸른 구슬처럼 보이는 지구의 모습","미국과 러시아가 벌이는 우주 경쟁","우주비행사가 되기 위한 훈련 과정","지구로 돌아와 쓴 책의 내용"],"r":{"a":"1) 국경 없이 작고 아름다운 푸른 구슬처럼 보이는 지구의 모습","ev":"3~5번 문장","s":[[3,"When astronauts look down at Earth from space, they do not see borders or countries.","우주비행사들이 우주에서 지구를 내려다볼 때, 그들은 국경이나 나라를 보지 못한다."],[4,"Instead, they see a tiny, beautiful blue ball like a “marble” floating in space.","대신, 그들은 우주에 떠 있는 '구슬'처럼 작고 아름다운 푸른 공을 본다."],[5,"This view changes their hearts deeply.","이 광경은 그들의 마음을 깊이 바꾼다."]],"w":"5번의 This view는 바로 앞 3~4번에서 우주비행사들이 본 장면, 곧 국경이 없는 작고 푸른 지구의 모습. 경쟁이나 훈련 이야기는 아님.","c":1},"h":"11ed7cc888"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This experience often creates a strong sense of connection to all living things and helps them realize that Earth must be protected.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 경험은 종종 모든 생명체와의 강한 유대감을 만들어 내고, 지구가 보호되어야 한다는 것을 깨닫도록 도와준다.","opts":["이 경험으로 다른 나라와의 경쟁에서 이기고 싶어진다.","이 경험으로 자기 나라에 대한 자부심이 더 강해진다.","이 경험으로 우주비행사 훈련이 더 쉬워진다.","이 경험으로 모든 생명체와 이어져 있다고 느끼고, 지구를 지켜야 한다는 것을 깨닫는다."],"r":{"a":"4) 이 경험으로 모든 생명체와 이어져 있다고 느끼고, 지구를 지켜야 한다는 것을 깨닫는다.","ev":"8번 문장","s":[[8,"This experience often creates a strong sense of connection to all living things and helps them realize that Earth must be protected.","이 경험은 종종 모든 생명체와의 강한 유대감을 만들어 내고, 지구가 보호되어야 한다는 것을 깨닫도록 도와준다."]],"w":"8번은 경험이 만드는 두 가지를 말함. 모든 생명체와의 강한 유대감, 그리고 지구를 보호해야 한다는 깨달음. 나머지는 경쟁, 자기 나라 자랑, 훈련 이야기라 맞지 않음.","c":4},"h":"d37767cd73"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["우주에서는 나라 사이의 국경이 또렷하게 보인다.","우주 여행 후에는 환경과 세계 평화에 대한 관심이 종종 커진다.","미국과 러시아는 이제 우주 탐사를 하지 않는다.","조망 효과는 자기 나라에 대한 자부심을 말한다."],"opts":["Clear borders between countries can be seen from space.","After a trip to space, concern for the environment and world peace often grows.","The U.S. and Russia no longer explore space.","The Overview Effect means pride in one's own country."],"r":{"a":"2) After a trip to space, concern for the environment and world peace often grows.","ev":"9번 문장","s":[[9,"As a result, concern for protecting the environment and promoting world peace often grows.","그 결과, 환경을 보호하고 세계 평화를 증진하려는 관심이 종종 커진다."]],"w":"9번에서 As a result 뒤에 환경 보호와 세계 평화에 대한 관심이 자란다고 함. 3번에서 국경은 보이지 않고, 1번에서 두 나라는 우주 탐사를 해 왔으며, 11번의 조망 효과는 자부심이 아니라 생각의 변화.","c":2},"h":"3ddf4826cb"},{"n":9,"t":"sum","q":"Before leaving Earth, astronauts may focus mainly on their (A) countries, but after viewing the planet from space, many understand that all humans share one (B).","ko":"지구를 떠나기 전 우주비행사들은 주로 (A) 나라에 집중하지만, 우주에서 지구를 본 후에는 많은 사람들이 모든 인류가 하나의 (B)를 공유한다는 것을 이해한다.","oko":["(A) 다른 / (B) 국경","(A) 적대적인 / (B) 집","(A) 다른 / (B) 집","(A) 자신의 / (B) 집","(A) 자신의 / (B) 국경"],"opts":["(A) other / (B) border","(A) rival / (B) home","(A) other / (B) home","(A) own / (B) home","(A) own / (B) border"],"r":{"a":"4) (A) own / (B) home","ev":"6~7번 문장","s":[[6,"Before leaving Earth, astronauts may focus mainly on their own countries.","지구를 떠나기 전에는, 우주비행사들은 주로 자기 나라에 집중할지도 모른다."],[7,"After viewing the planet from space, however, many come to understand that all humans share one home.","그러나 우주에서 지구를 본 후에는, 많은 사람들이 모든 인류가 하나의 집을 공유한다는 것을 이해하게 된다."]],"w":"6번에서 떠나기 전에는 their own countries(자기 나라)에 집중, 7번에서 본 후에는 all humans share one home(모든 인류가 한 집을 공유). other, border, rival은 본문과 맞지 않음.","c":4},"h":"554e9e62f1"},{"n":10,"t":"fill","q":"The Overview Effect reminds us that we all live on the same small [A] and [B] us to care for one another.","ko":"조망 효과는 우리 모두가 같은 작은 [A]에 살고 있음을 상기시키고, 우리가 서로를 돌보도록 [B].","bank":["planet","encourages","borders","competitors","charities","deeply"],"bko":{"planet":"행성","encourages":"격려하다","borders":"국경","competitors":"경쟁자","charities":"자선 단체","deeply":"깊이"},"r":{"a":"[A] planet, [B] encourages","ev":"11~12번 문장","s":[[11,"This change in their thinking is called the Overview Effect.","그들의 생각에 일어난 이러한 변화는 조망 효과(Overview Effect)라고 불린다."],[12,"It reminds us that we all live on the same small planet and encourages us to care for one another.","그것은 우리 모두가 같은 작은 행성에 살고 있다는 것을 상기시키고, 우리가 서로를 돌보도록 격려한다."]],"w":"12번 It reminds us that we all live on the same small planet and encourages us to care for one another에서 가져옴. borders, competitors, charities, deeply는 빈칸에 넣으면 뜻이 이어지지 않음.","c":null},"h":"e2fe755b82"}]},{"u":7,"id":"b4-07-2","no":2,"ko":"우리가 보는 별빛은 이미 과거의 빛이다?","items":[{"n":1,"t":"tf","q":"If a star is 100 light-years away, the light we see today left the star 100 years ago.","ko":"어떤 별이 100광년 떨어져 있다면, 오늘 우리가 보는 빛은 100년 전에 그 별을 떠난 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"For example, if a star is 100 light-years away, the light we see today left the star 100 years ago.","예를 들어, 어떤 별이 100광년 떨어져 있다면, 오늘 우리가 보는 빛은 100년 전에 그 별을 떠난 것이다."]],"w":"8번에 같은 문장이 그대로 나옴. 100광년 떨어진 별의 빛은 100년 걸려 도착하므로 100년 전에 출발한 빛을 보는 것.","c":"T"},"h":"c4db3e0d78"},{"n":2,"t":"tf","q":"Light travels so fast that it reaches us from a star instantly.","ko":"빛은 너무 빨라서 별에서 우리에게 즉시 도달한다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Light travels at about 300,000 kilometers per second, but space is so vast that even that speed isn’t enough for light to reach us instantly.","빛은 초속 약 30만 킬로미터로 이동하지만, 우주는 너무나 광대해서 그 속도로도 빛이 우리에게 즉시 도달하기에는 충분하지 않다."]],"w":"3번에서 빛이 빨라도 space is so vast(우주가 너무 광대해서) 즉시 도달하기에는 충분하지 않다고 함. 즉시 도달한다는 말은 반대.","c":"F"},"h":"4d69c6a9e8"},{"n":3,"t":"tf","q":"Most stars are close to Earth, so the delay lasts only a few seconds.","ko":"대부분의 별은 지구에 가까워서 지연은 몇 초밖에 되지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Most stars are incredibly far away from Earth, so this delay is not just a few seconds or minutes, but often dozens or even hundreds of years.","대부분의 별은 지구에서 엄청나게 멀리 떨어져 있어서, 이 지연은 단지 몇 초나 몇 분이 아니라 종종 수십 년, 심지어 수백 년이다."]],"w":"5번에서 대부분의 별은 incredibly far away(엄청나게 멀리)라서 지연이 몇 초가 아니라 수십 년, 수백 년이라고 함.","c":"F"},"h":"6ff4eb9352"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... space is so vast that even that speed isn’t enough...)","ko":"... 우주는 너무나 ( ) 그 속도로도 충분하지 않다.","opts":["좁은","어두운","광대한","조용한"],"word":"vast","r":{"a":"3) 광대한","ev":"3번 문장","s":[[3,"Light travels at about 300,000 kilometers per second, but space is so vast that even that speed isn’t enough for light to reach us instantly.","빛은 초속 약 30만 킬로미터로 이동하지만, 우주는 너무나 광대해서 그 속도로도 빛이 우리에게 즉시 도달하기에는 충분하지 않다."]],"w":"3번에서 빛이 아주 빨라도 모자랄 만큼 우주가 크다는 뜻. vast = 광대한, 아주 넓은. 좁은이나 어두운은 문맥과 맞지 않음.","c":3},"h":"f13ecb9461"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... the starlight we observe tonight began its journey in the past.)","ko":"... 오늘 밤 우리가 ( ) 별빛은 과거에 여정을 시작했다.","opts":["관측하다","계산하다","만들다","숨기다"],"word":"observe","r":{"a":"1) 관측하다","ev":"4번 문장","s":[[4,"This means the starlight we observe tonight began its journey in the past.","이는 오늘 밤 우리가 관측하는 별빛이 과거에 여정을 시작했다는 뜻이다."]],"w":"4번에서 우리가 밤하늘에서 보는 별빛을 observe한다고 했으니 '살펴보다, 관측하다'. 계산하거나 만드는 것이 아님.","c":1},"h":"00a119f260"},{"n":6,"t":"ref","q":"What does the underlined \"this delay\" refer to?\nMost stars are incredibly far away from Earth, so this delay is not just a few seconds or minutes, but often dozens or even hundreds of years.","ko":"밑줄 친 this delay가 가리키는 것은?","sko":"대부분의 별은 지구에서 엄청나게 멀리 떨어져 있어서, 이 지연은 단지 몇 초나 몇 분이 아니라 종종 수십 년, 심지어 수백 년이다.","opts":["천문학자가 별을 연구하는 데 걸리는 시간","별빛이 우리에게 도달하는 데 걸려 늦어지는 시간","밤이 지나 아침이 오는 데 걸리는 시간","별이 새로 태어나는 데 걸리는 시간"],"r":{"a":"2) 별빛이 우리에게 도달하는 데 걸려 늦어지는 시간","ev":"3~5번 문장","s":[[3,"Light travels at about 300,000 kilometers per second, but space is so vast that even that speed isn’t enough for light to reach us instantly.","빛은 초속 약 30만 킬로미터로 이동하지만, 우주는 너무나 광대해서 그 속도로도 빛이 우리에게 즉시 도달하기에는 충분하지 않다."],[4,"This means the starlight we observe tonight began its journey in the past.","이는 오늘 밤 우리가 관측하는 별빛이 과거에 여정을 시작했다는 뜻이다."],[5,"Most stars are incredibly far away from Earth, so this delay is not just a few seconds or minutes, but often dozens or even hundreds of years.","대부분의 별은 지구에서 엄청나게 멀리 떨어져 있어서, 이 지연은 단지 몇 초나 몇 분이 아니라 종종 수십 년, 심지어 수백 년이다."]],"w":"3~4번에서 빛이 즉시 오지 못하고 과거에 출발한 빛을 본다고 함. this delay는 그 도착이 늦어지는 시간. 천문학자의 연구 시간이나 밤이 지나가는 시간이 아님.","c":2},"h":"1af44d1043"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So every time we look up, we are seeing a piece of history shining in the dark sky.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 우리가 올려다볼 때마다, 우리는 어두운 하늘에서 빛나는 역사의 한 조각을 보고 있는 것이다.","opts":["하늘에서 역사책 속 인물이 별로 나타난다.","밤하늘에서는 매일 새로운 별이 생겨난다.","어두운 하늘이 과거 역사를 기록하고 있다.","하늘을 올려다볼 때마다 우리는 과거에 출발한 빛, 곧 과거의 모습을 보고 있다."],"r":{"a":"4) 하늘을 올려다볼 때마다 우리는 과거에 출발한 빛, 곧 과거의 모습을 보고 있다.","ev":"8~9번 문장","s":[[8,"For example, if a star is 100 light-years away, the light we see today left the star 100 years ago.","예를 들어, 어떤 별이 100광년 떨어져 있다면, 오늘 우리가 보는 빛은 100년 전에 그 별을 떠난 것이다."],[9,"So every time we look up, we are seeing a piece of history shining in the dark sky.","그래서 우리가 올려다볼 때마다, 우리는 어두운 하늘에서 빛나는 역사의 한 조각을 보고 있는 것이다."]],"w":"9번은 So(그래서)로 결론을 말함. a piece of history는 과거의 한 조각이라는 뜻으로, 별빛이 과거에 출발했다는 앞 내용을 정리함. 역사책이나 새로운 별 이야기가 아님.","c":4},"h":"ab88bbb192"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["천문학자들은 광년을 사용해 큰 시간 지연을 설명한다.","빛은 우주에서 별에서 우리에게 즉시 도달한다.","대부분의 별은 지구에서 몇 광초 거리에 있다.","1광년은 빛이 100년 동안 이동하는 거리이다."],"opts":["Astronomers use the light-year to explain the large time delay.","Light reaches us from the stars instantly in space.","Most stars are only a few light-seconds away from Earth.","A light-year is the distance light travels in 100 years."],"r":{"a":"1) Astronomers use the light-year to explain the large time delay.","ev":"6번 문장","s":[[6,"Astronomers explain this large time delay using a unit called the light-year.","천문학자들은 광년이라는 단위를 사용해 이 큰 시간 지연을 설명한다."]],"w":"6번에서 천문학자들이 light-year(광년)로 큰 시간 지연을 설명한다고 함. 3번에서 빛은 즉시 도달하지 못하고, 5번에서 별은 매우 멀며, 7번에서 광년은 시간이 아닌 거리임.","c":1},"h":"02ee653da4"},{"n":9,"t":"sum","q":"Because space is so (A) that even fast light cannot reach us instantly, the starlight we see tonight began its journey in the (B).","ko":"우주가 너무 (A)해서 아주 빠른 빛도 우리에게 즉시 도달하지 못하므로, 오늘 밤 우리가 보는 별빛은 (B)에 여정을 시작했다.","oko":["(A) 좁은 / (B) 과거","(A) 광대한 / (B) 과거","(A) 광대한 / (B) 미래","(A) 밝은 / (B) 현재","(A) 좁은 / (B) 미래"],"opts":["(A) narrow / (B) past","(A) vast / (B) past","(A) vast / (B) future","(A) bright / (B) present","(A) narrow / (B) future"],"r":{"a":"2) (A) vast / (B) past","ev":"3~4번 문장","s":[[3,"Light travels at about 300,000 kilometers per second, but space is so vast that even that speed isn’t enough s were able to spin much faster than helicopters on Earth.","또한, 그 날개는 지구의 헬리콥터보다 훨씬 더 빠르게 회전할 수 있었다."]],"w":"6번에서 화성에서 날기 위해 설계된 것은 Ingenuity. 7번 Also로 이어지는 its blades는 그 헬리콥터의 날개. 지구 헬리콥터는 비교 대상일 뿐.","c":4},"h":"cca9a41fc3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because of this, scientists once believed that powered flight on Mars was almost impossible.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 때문에, 과학자들은 한때 화성에서의 동력 비행이 거의 불가능하다고 믿었다.","opts":["화성의 대기가 얇아서, 과학자들은 한때 화성에서 동력 비행이 거의 불가능하다고 믿었다.","동력 비행이 불가능해서 화성의 대기가 얇아졌다.","과학자들은 화성에서 동력 비행이 쉽다고 계속 믿고 있다.","과학자들은 화성의 대기가 지구보다 두껍다고 믿었다."],"r":{"a":"1) 화성의 대기가 얇아서, 과학자들은 한때 화성에서 동력 비행이 거의 불가능하다고 믿었다.","ev":"1~3번 문장","s":[[1,"Mars has a very thin atmosphere.","화성은 대기가 매우 얇다."],[2,"It is about one percent as thick as Earth’s atmosphere.","그것은 지구 대기 두께의 약 1퍼센트이다."],[3,"Because of this, scientists once believed that powered flight on Mars was almost impossible.","이 때문에, 과학자들은 한때 화성에서의 동력 비행이 거의 불가능하다고 믿었다."]],"w":"3번의 Because of this는 1~2번의 얇은 대기를 가리킴. once believed는 '한때 믿었다'로 지금은 달라졌다는 느낌. 나머지는 원인과 결과가 뒤바뀌거나 본문에 없는 내용.","c":1},"h":"2f3783efd7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["화성의 대기는 지구 대기만큼 두껍다.","첫 시험 비행은 몇 분 동안 계속되었다.","첫 시험 비행은 몇 초뿐이었지만 다른 행성에서의 동력 비행이 가능하다는 것을 보여 주었다.","과학자들은 화성에서의 비행이 쉽다고 믿었다."],"opts":["The atmosphere of Mars is as thick as Earth’s atmosphere.","The first test flight continued for several minutes.","The first test flight lasted only a few seconds, but it showed that powered flight on another planet was possible.","Scientists believed that flight on Mars would be easy."],"r":{"a":"3) The first test flight lasted only a few seconds, but it showed that powered flight on another planet was possible.","ev":"10번 문장","s":[[10,"The flight lasted only a few seconds, but it showed that powered flight on another planet was possible.","그 비행은 단 몇 초 동안만 지속되었지만, 다른 행성에서의 동력 비행이 가능하다는 것을 보여 주었다."]],"w":"10번에서 첫 비행은 몇 초뿐이었지만 가능하 reader.","이 에너지는 카드 안의 작은 칩을 작동시키고, 그 칩은 당신의 정보를 리더기로 다시 보낸다."]],"w":"6번에서 전기 에너지가 칩을 움직이게 해서 칩이 정보를 보내게 함. activate = 작동시키다. 멈추게 하거나 지우는 것이 아님.","c":2},"h":"e1e22ecc66"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... completes the payment instantly.)","ko":"... 결제를 ( ) 완료한다","opts":["즉시","천천히","가끔","나중에"],"word":"instantly","r":{"a":"1) 즉시","ev":"7번 문장","s":[[7,"The reader then records the information and completes the payment instantly.","그러면 리더기는 그 정보를 기록하고 결제를 즉시 완료한다."]],"w":"7번에서 정보를 기록하고 바로 결제를 끝낸다는 뜻. instantly = 즉시, 바로. 천천히나 나중에는 반대.","c":1},"h":"bd183831c7"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nThis is because its weak magnetic field only reaches a few centimeters.","ko":"밑줄 친 its가 가리키는 것은?","sko":"이는 그 약한 자기장이 몇 센티미터까지만 닿기 때문이다.","opts":["디지털 지갑","버스 요금","NFC","스마트 키"],"r":{"a":"3) NFC","ev":"8~9번 문장","s":[[8,"NFC works only at a short distance.","NFC는 짧은 거리에서만 작동한다."],[9,"This is because its weak magnetic field only reaches a few centimeters.","이는 그 약한 자기장이 몇 센티미터까지만 닿기 때문이다."]],"w":"8번에서 NFC works only at a short distance라고 하고, 9번이 그 이유(This is because)를 말함. its weak magnetic field = NFC의 약한 자기장.","c":3},"h":"0629849317"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This keeps your data safe by making it almost impossible for someone to steal it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 누군가가 데이터를 훔치는 것을 거의 불가능하게 만들어서 당신의 데이터를 안전하게 지켜 준다.","opts":["누군가가 데이터를 훔치기 쉬워져서 데이터가 빨리 전송된다.","데이터를 훔치는 사람을 쉽게 찾을 수 있다.","데이터를 안전하게 지키려면 카드를 멀리 두어야 한다.","누군가가 데이터를 훔치는 것이 거의 불가능해져서 데이터가 안전하게 지켜진다."],"r":{"a":"4) 누군가가 데이터를 훔치는 것이 거의 불가능해져서 데이터가 안전하게 지켜진다.","ev":"10번 문장","s":[[10,"This keeps your data safe by making it almost impossible for someone to steal it.","이것은 누군가가 데이터를 훔치는 것을 거의 불가능하게 만들어서 당신의 데이터를 안전하게 지켜 준다."]],"w":"10번의 by making it almost impossible for someone to steal it은 '누군가 훔치기가 거의 불가능하게 만들어서'. 그 결과 데이터가 안전함. 해킹을 돕는다는 말은 반대.","c":4},"h":"748c668daf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["카드 리더기는 먼 거리까지 닿는 자기장을 만든다.","카드가 리더기에 가까이 오면 자기장이 소량의 전기를 만든다.","카드 안의 칩이 자기장을 만든다.","NFC는 몇 미터 떨어진 곳에서도 잘 작동한다."],"opts":["A card reader creates a long-range magnetic field.","When a card comes close to the reader, the field creates a small amount of electricity.","The chip inside the card creates the magnetic field.","NFC works well even several meters away."],"r":{"a":"2) When a card comes close to the reader, the field creates a small amount of electricity.","ev":"4~5번 문장","s":[[4,"A card reader creates a short-range magnetic field.","카드 리더기는 짧은 거리의 자기장을 만든다."],[5,"When a card comes close to the reader, this field creates a small amount of electricity.","카드가 리더기에 가까이 오면, 이 자기장이 소량의 전기를 만든다."]],"w":"5번에서 카드가 리더기에 가까이 오면 자기장이 소량의 전기를 만든다고 함. 4번에서 자기장은 리더기가 만들고 짧은 거리용이며, 6번에서 칩은 카드 안에 있고, 8번에서 NFC는 짧은 거리에서만 작동함.","c":2},"h":"f45a0c2711"},{"n":9,"t":"sum","q":"A card reader creates a short-range (A) field, which gives the card a small amount of electricity and activates a tiny (B).","ko":"카드 리더기는 짧은 거리의 (A) 장(field)을 만들고, 그것이 카드에 소량의 전기를 주어 작은 (B)을 작동시킨다.","oko":["(A) 자기 / (B) 칩","(A) 시각 / (B) 칩","(A) 자기 / (B) 배터리","(A) 시각 / (B) 배터리","(A) 소리 / (B) 전선"],"opts":["(A) magnetic / (B) chip","(A) visual / (B) chip","(A) magnetic / (B) battery","(A) visual / (B) battery","(A) sound / (B) wire"],"r":{"a":"1) (A) magnetic / (B) chip","ev":"4~6번 문장","s":[[4,"A card reader creates a short-range magnetic field.","카드 리더기는 짧은 거리의 자기장을 만든다."],[5,"When a card comes close to the reader, this field creates a small amount of electricity.","카드가 리더기에 가까이 오면, 이 자기장이 소량의 전기를 만든다."],[6,"This energy activates a tiny chip inside the card, which sends your information back to the reader.","이 에너지는 카드 안의 작은 칩을 작동시키고, 그 칩은 당신의 정보를 리더기로 다시 보낸다."]],"w":"4번 short-range magnetic field(짧은 거리의 자기장), 5번 small amount of electricity(소량의 전기), 6번 activates a tiny chip(작은 칩을 작동시킴). visual, battery 등은 본문에 없음.","c":1},"h":"b4eb8985a0"},{"n":10,"t":"fill","q":"NFC works only at a short [A], because its weak magnetic field only reaches a few [B].","ko":"NFC는 짧은 [A]에서만 작동하는데, 그 약한 자기장이 몇 [B]까지만 닿기 때문이다.","bank":["distance","centimeters","wallets","keys","electricity","daily"],"bko":{"distance":"거리","centimeters":"센티미터","wallets":"지갑","keys":"열쇠","electricity":"전기","daily":"매일의"},"r":{"a":"[A] distance, [B] centimeters","ev":"8~9번 문장","s":[[8,"NFC works only at a short distance.","NFC는 짧은 거리에서만 작동한다."],[9,"This is because its weak magnetic field only reaches a few centimeters.","이는 그 약한 자기장이 몇 센티미터까지만 닿기 때문이다."]],"w":"8번에서 NFC works only at a short distance(짧은 거리에서만 작동), 9번에서 its weak magnetic field only reaches a few centimeters(몇 센티미터까지만 닿음)라고 함. wallets, keys, electricity, daily는 빈칸에 넣으면 뜻이 이어지지 않음.","c":null},"h":"c7c6e12f46"}]},{"u":8,"id":"b4-08-2","no":2,"ko":"운전대에서 손을 뗀 자동차는 어떻게 길을 찾을까?","items":[{"n":1,"t":"tf","q":"Self-driving cars work through three main steps: sensing, thinking, and acting.","ko":"자율주행 자동차는 감지, 생각, 행동이라는 세 가지 주요 단계를 통해 작동한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They work through three main steps: sensing, thinking, and acting.","그것들은 감지, 생각, 행동이라는 세 가지 주요 단계를 통해 작동한다."]],"w":"3번에 They work through three main steps: sensing, thinking, and acting이 그대로 나옴.","c":"T"},"h":"0e31b55dbe"},{"n":2,"t":"tf","q":"GPS helps the vehicle measure the speed of other objects.","ko":"GPS는 차량이 다른 물체의 속도를 측정하도록 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Along with its sensors, GPS helps the vehicle locate itself.","센서와 함께, GPS는 차량이 자신의 위치를 파악하도록 도와준다."]],"w":"7번에서 GPS는 차량이 자신의 위치를 파악하도록 돕는다(locate itself)고 함. 물체의 거리와 속도를 측정하는 것은 6번의 radar.","c":"F"},"h":"e67a079677"},{"n":3,"t":"tf","q":"Once the data is collected, a human driver analyzes it.","ko":"데이터가 수집되면, 사람 운전자가 그것을 분석한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Once this data is collected, powerful computers and AI analyze it.","이 데이터가 수집되면, 강력한 컴퓨터와 인공지능이 그것을 분석한다."]],"w":"9번에서 데이터를 분석하는 것은 powerful computers and AI(강력한 컴퓨터와 인공지능)임. 사람 운전자가 아님.","c":"F"},"h":"c7d69cab28"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... rely on a variety of sensors to understand their surroundings.)","ko":"... ( )을 이해하기 위해 다양한 센서에 의존한다","opts":["주변 환경","차의 속도","연료의 양","엔진 소리"],"word":"surroundings","r":{"a":"1) 주변 환경","ev":"4번 문장","s":[[4,"Self-driving cars rely on a variety of sensors to understand their surroundings.","자율주행 자동차는 주변 환경을 이해하기 위해 다양한 센서에 의존한다."]],"w":"4번에서 센서가 이해하려는 대상으로, 5~6번에서 표지판·차선·물체 등 차 주변의 것들이 나옴. surroundings = 주변 환경.","c":1},"h":"2db20d64a6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As the systems become better and more reliable, ...)","ko":"시스템이 더 좋고 더 ( ) 따라, ...","opts":["위험한","믿을 만한","비싼","느린"],"word":"reliable","r":{"a":"2) 믿을 만한","ev":"12번 문장","s":[[12,"As the systems become better and more reliable, self-driving cars are more likely to become a part of everyday life.","시스템이 더 좋고 더 믿을 만해짐에 따라, 자율주행 자동차는 일상의 일부가 될 가능성이 더 높다."]],"w":"12번에서 better and more reliable은 시스템이 더 좋아지고 믿을 수 있게 된다는 뜻. reliable = 믿을 만한. 위험한이나 느린은 일상의 일부가 될 가능성과 반대 방향.","c":2},"h":"8fe5e22690"},{"n":6,"t":"ref","q":"What does the underlined \"these signals\" refer to?\nTogether, these signals give the car a detailed picture of the road.","ko":"밑줄 친 these signals가 가리키는 것은?","sko":"이 신호들이 함께 차에게 도로의 상세한 그림을 제공한다.","opts":["신호등의 빨간불과 초록불","센서와 GPS가 모은 정보","운전자가 내리는 명령","승객이 보내는 메시지"],"r":{"a":"2) 센서와 GPS가 모은 정보","ev":"4~8번 문장","s":[[4,"Self-driving cars rely on a variety of sensors to understand their surroundings.","자율주행 자동차는 주변 환경을 이해하기 위해 다양한 센서에 의존한다."],[5,"Cameras read road signs, detect lanes, and recognize traffic lights.","카메라는 도로 표지판을 읽고, 차선을 감지하며, 신호등을 인식한다."],[6,"LiDAR, a laser-based system, creates a detailed 3D map of the surroundings, while radar uses radio waves to detect objects and measure their distance and speed.","레이저 기반 시스템인 라이다(LiDAR)는 주변 환경의 상세한 3D 지도를 만드는 반면, 레이더(radar)는 전파를 사용해 물체를 감지하고 그 거리와 속도를 측정한다."],[7,"Along with its sensors, GPS helps the vehicle locate itself.","센서와 함께, GPS는 차량이 자신의 위치를 파악하도록 도와준다."],[8,"Together, these signals give the car a detailed picture of the road.","이 신호들이 함께 차에게 도로의 상세한 그림을 제공한다."]],"w":"5~6번에서 카메라, 라이다, 레이더가 정보를 모으고 7번에서 GPS도 위치를 알려 줌. 8번의 these signals는 그 센서와 GPS의 정보. 운전자나 승객이 보내는 것이 아님.","c":2},"h":"65373d7468"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The system identifies objects, predicts what might happen, and responds by steering, accelerating, or braking to follow traffic rules and keep passengers safe.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시스템은 물체를 식별하고, 무슨 일이 일어날지 예측하며, 교통 규칙을 따르고 승객을 안전하게 지키기 위해 핸들 조작, 가속, 또는 제동으로 반응한다.","opts":["시스템은 승객에게 운전 방법을 알려 주고 교통 규칙을 가르친다.","시스템은 물체를 피하기 위해 항상 멈춰 있다.","시스템은 물체를 알아보고 일어날 일을 예측해, 핸들·가속·제동으로 대응하여 규칙을 지키고 승객을 안전하게 한다.","시스템은 운전자가 핸들을 잡도록 신호를 보낸다."],"r":{"a":"3) 시스템은 물체를 알아보고 일어날 일을 예측해, 핸들·가속·제동으로 대응하여 규칙을 지키고 승객을 안전하게 한다.","ev":"10번 문장","s":[[10,"The system identifies objects, predicts what might happen, and responds by steering, accelerating, or braking to follow traffic rules and keep passengers safe.","시스템은 물체를 식별하고, 무슨 일이 일어날지 예측하며, 교통 규칙을 따르고 승객을 안전하게 지키기 위해 핸들 조작, 가속, 또는 제동으로 반응한다."]],"w":"10번은 identify(식별), predict(예측), respond(반응)의 세 동작과 반응 방법(steering, accelerating, braking), 목적(규칙 준수·승객 안전)을 말함. 나머지는 운전자가 직접 운전하거나 본문에 없는 내용.","c":3},"h":"6692b4a901"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["자율주행 자동차는 카메라만으로 주변을 파악한다.","자율주행 자동차는 운전자가 페달을 밟아야 작동한다.","데이터 분석은 사람이 직접 한다.","시스템이 더 믿을 만해지면 자율주행 자동차는 일상의 일부가 될 가능성이 더 높다."],"opts":["Self-driving cars understand their surroundings with cameras only.","Self-driving cars work only when the driver presses the pedals.","People analyze the collected data by themselves.","Self-driving cars are more likely to become part of everyday life as the systems become more reliable."],"r":{"a":"4) Self-driving cars are more likely to become part of everyday life as the systems become more reliable.","ev":"12번 문장","s":[[12,"As the systems become better and more reliable, self-driving cars are more likely to become a part of everyday life.","시스템이 더 좋고 더 믿을 만해짐에 따라, 자율주행 자동차는 일상의 일부가 될 가능성이 더 높다."]],"w":"12번에서 시스템이 더 좋고 믿을 만해질수록 일상의 일부가 될 가능성이 높다고 함. 4~7번에서 센서는 카메라·라이다·레이더·GPS이고, 1번에서 손발을 쓰지 않으며, 9번에서 분석은 컴퓨터와 AI가 함.","c":4},"h":"acf25d44a5"},{"n":9,"t":"sum","q":"Self-driving cars use cameras, LiDAR, and radar as (A) to understand their surroundings, and GPS helps the vehicle (B) itself.","ko":"자율주행 자동차는 주변 환경을 이해하기 위해 카메라, 라이다, 레이더를 (A)로 사용하고, GPS는 차량이 스스로를 (B) 것을 돕는다.","oko":["(A) 운전자 / (B) 숨기는","(A) 엔진 / (B) 충전하는","(A) 센서 / (B) 숨기는","(A) 운전자 / (B) 위치를 파악하는","(A) 센서 / (B) 위치를 파악하는"],"opts":["(A) drivers / (B) hide","(A) engines / (B) charge","(A) sensors / (B) hide","(A) drivers / (B) locate","(A) sensors / (B) locate"],"r":{"a":"5) (A) sensors / (B) locate","ev":"4~7번 문장","s":[[4,"Self-driving cars rely on a variety of sensors to understand their surroundings.","자율주행 자동차는 주변 환경을 이해하기 위해 다양한 센서에 의존한다."],[5,"Cameras read road signs, detect lanes, and recognize traffic lights.","카메라는 도로 표지판을 읽고, 차선을 감지하며, 신호등을 인식한다."],[6,"LiDAR, a laser-based system, creates a detailed 3D map of the surroundings, while radar uses radio waves to detect objects and measure their distance and speed.","레이저 기반 시스템인 라이다(LiDAR)는 주변 환경의 상세한 3D 지도를 만드는 반면, 레이더(radar)는 전파를 사용해 물체를 감지하고 그 거리와 속도를 측정한다."],[7,"Along with its sensors, GPS helps the vehicle locate itself.","센서와 함께, GPS는 차량이 자신의 위치를 파악하도록 도와준다."]],"w":"4번 rely on a variety of sensors(다양한 센서에 의존), 7번 GPS helps the vehicle locate itself(차량이 자신의 위치를 파악하도록 도움). drivers, engines, hide, charge는 본문과 맞지 않음.","c":5},"h":"443b48ea7a"},{"n":10,"t":"fill","q":"Powerful computers and AI [A] the data, identify objects, and [B] what might happen.","ko":"강력한 컴퓨터와 인공지능은 데이터를 [A]하고, 물체를 식별하며, 무슨 일이 일어날지 [B]한다.","bank":["analyze","predict","steering","sensors","radio","charge"],"bko":{"analyze":"분석하다","predict":"예측하다","steering":"핸들을 조작하는 것","sensors":"센서","radio":"전파","charge":"충전하다"},"r":{"a":"[A] analyze, [B] predict","ev":"9~10번 문장","s":[[9,"Once this data is collected, powerful computers and AI analyze it.","이 데이터가 수집되면, 강력한 컴퓨터와 인공지능이 그것을 분석한다."],[10,"The system identifies objects, predicts what might happen, and responds by steering, accelerating, or braking to follow traffic rules and keep passengers safe.","시스템은 물체를 식별하고, 무슨 일이 일어날지 예측하며, 교통 규칙을 따르고 승객을 안전하게 지키기 위해 핸들 조작, 가속, 또는 제동으로 반응한다."]],"w":"9번 computers and AI analyze it, 10번 identifies objects, predicts what might happen에서 가져옴. steering, sensors, radio, charge는 이 자리에 쓰면 뜻이나 문장 형태가 맞지 않음.","c":null},"h":"fe80032e4d"}]},{"u":8,"id":"b4-08-3","no":3,"ko":"유명인이 하지도 않은 말을 하는 영상의 정체","items":[{"n":1,"t":"tf","q":"Deepfakes are realistic but fake media created with deep learning.","ko":"딥페이크는 딥러닝으로 만들어진, 현실적이지만 가짜인 미디어이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Deepfakes are realistic but fake media created with a powerful AI technique called deep learning.","딥페이크는 딥러닝이라는 강력한 인공지능 기술로 만들어진, 현실적이지만 가짜인 미디어이다."]],"w":"3번에서 딥페이크의 정의가 realistic but fake media created with ... deep learning이라고 나옴.","c":"T"},"h":"14a59cbfc8"},{"n":2,"t":"tf","q":"The passage says deepfakes cannot be used in movies.","ko":"본문은 딥페이크를 영화에서 사용할 수 없다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"For example, deepfakes can bring historical figures back to life or create complex special effects in movies.","예를 들어, 딥페이크는 역사 속 인물을 되살리거나 영화에서 복잡한 특수 효과를 만들어 낼 수 있다."]],"w":"8번에서 딥페이크는 영화에서 복잡한 특수 효과를 만드는 데 쓸 수 있다고 함. 사용할 수 없다는 말은 반대.","c":"F"},"h":"6919f62f9c"},{"n":3,"t":"tf","q":"Deepfakes can be used to spread fake news or to bully people online.","ko":"딥페이크는 가짜 뉴스를 퍼뜨리거나 온라인에서 사람들을 괴롭히는 데 사용될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"It is often used to spread false information, known as fake news, or to bully people online.","그것은 종종 가짜 뉴스로 알려진 허위 정보를 퍼뜨리거나 온라인에서 사람들을 괴롭히는 데 사용된다."]],"w":"10번에서 spread false information, known as fake news(가짜 뉴스), 또는 bully people online(온라인에서 괴롭힘)에 사용된다고 함.","c":"T"},"h":"05000df426"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... recreate a person's image and voice in a very realistic way.)","ko":"... 사람의 이미지와 목소리를 매우 ( ) 방식으로 재현한다","opts":["어두운","느린","실제 같은","슬픈"],"word":"realistic","r":{"a":"3) 실제 같은","ev":"5번 문장","s":[[5,"Using these learned patterns, the computer teaches itself to recreate a person’s image and voice in a very realistic way.","이렇게 학습한 패턴을 사용해, 컴퓨터는 스스로 학습하여 사람의 이미지와 목소리를 매우 현실적으로 재현한다."]],"w":"5번에서 사람의 이미지와 목소리를 진짜처럼 재현한다는 뜻. realistic = 현실적인, 실제 같은. 어둡거나 느린 것이 아님.","c":3},"h":"68cb5770a1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... it can swap faces and alter voices in a video.)","ko":"... 영상 속에서 얼굴을 바꾸고 목소리를 ( ) 수 있다","opts":["지키다","바꾸다, 변조하다","녹음하다","분석하다"],"word":"alter","r":{"a":"2) 바꾸다, 변조하다","ev":"6번 문장","s":[[6,"As a result, it can swap faces and alter voices in a video.","그 결과, 컴퓨터는 영상 속에서 얼굴을 바꾸고 목소리를 변조할 수 있다."]],"w":"6번에서 swap faces(얼굴을 바꾸다)와 나란히 쓰인 alter voices는 목소리를 바꾸는 것. alter = 바꾸다, 변조하다. 지키거나 녹음하는 것이 아님.","c":2},"h":"c30d98a14e"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is often used to spread false information, known as fake news, or to bully people online.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 종종 가짜 뉴스로 알려진 허위 정보를 퍼뜨리거나 온라인에서 사람들을 괴롭히는 데 사용된다.","opts":["영화의 특수 효과","딥페이크 기술","역사 속 인물","가짜 뉴스"],"r":{"a":"2) 딥페이크 기술","ev":"9~10번 문장","s":[[9,"However, not all uses of this technology are positive.","그러나 이 기술의 모든 사용이 긍정적인 것은 아니다."],[10,"It is often used to spread false information, known as fake news, or to bully people online.","그것은 종종 가짜 뉴스로 알려진 허위 정보를 퍼뜨리거나 온라인에서 사람들을 괴롭히는 데 사용된다."]],"w":"9번의 this technology(이 기술)가 딥페이크 기술이고, 10번의 It은 그 기술. 영화 특수 효과나 역사 속 인물이 가짜 뉴스를 퍼뜨리는 것이 아님.","c":2},"h":"daa4ea07c4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While deepfakes offer exciting new possibilities, their risks cannot be ignored.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"딥페이크는 흥미로운 새로운 가능성을 제공하지만, 그 위험성은 무시될 수 없다.","opts":["딥페이크는 흥미로운 새 가능성이 있지만, 그 위험도 무시해서는 안 된다.","딥페이크는 위험이 없어서 흥미로운 가능성만 있다.","딥페이크는 위험하기 때문에 가능성을 말할 필요가 없다.","딥페이크의 위험은 흥미로운 가능성 덕분에 사라진다."],"r":{"a":"1) 딥페이크는 흥미로운 새 가능성이 있지만, 그 위험도 무시해서는 안 된다.","ev":"11번 문장","s":[[11,"While deepfakes offer exciting new possibilities, their risks cannot be ignored.","딥페이크는 흥미로운 새로운 가능성을 제공하지만, 그 위험성은 무시될 수 없다."]],"w":"While은 '~이긴 하지만'. 앞은 흥미로운 가능성(좋은 점), 뒤는 위험을 무시할 수 없다는 말. 위험이 없다거나 가능성만 중요하다는 뜻이 아님.","c":1},"h":"fe0d2bfddb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["딥페이크는 진짜 영상이다.","딥러닝은 적은 양의 사진만 분석한다.","딥러닝을 쓰면 컴퓨터는 영상 속 얼굴을 바꾸고 목소리를 변조할 수 있다.","이 기술의 미래는 정해져 있어서 우리 사용 방식과 상관없다."],"opts":["Deepfakes are real videos recorded by cameras.","Deep learning analyzes only a few photos.","With deep learning, a computer can swap faces and alter voices in a video.","The future of this technology does not depend on how we use it."],"r":{"a":"3) With deep learning, a computer can swap faces and alter voices in a video.","ev":"6번 문장","s":[[6,"As a result, it can swap faces and alter voices in a video.","그 결과, 컴퓨터는 영상 속에서 얼굴을 바꾸고 목소리를 변조할 수 있다."]],"w":"6번에서 얼굴을 바꾸고 목소리를 변조할 수 있다고 함. 3번에서 딥페이크는 가짜 미디어이고, 4번에서 딥러닝은 방대한 양의 데이터를 분석하며, 12번에서 미래는 사용 방식에 달려 있음.","c":3},"h":"831f0a1807"},{"n":9,"t":"sum","q":"Deepfakes offer exciting new (A), but we must not ignore their (B), and the future depends on how responsibly we use them.","ko":"딥페이크는 흥미로운 새로운 (A)을 제공하지만 우리는 그 (B)을 무시해서는 안 되며, 미래는 우리가 그것을 얼마나 책임감 있게 사용하느냐에 달려 있다.","oko":["(A) 문제 / (B) 이익","(A) 규칙 / (B) 위험","(A) 가능성 / (B) 이익","(A) 가능성 / (B) 위험","(A) 문제 / (B) 위험"],"opts":["(A) problems / (B) benefits","(A) rules / (B) risks","(A) possibilities / (B) benefits","(A) possibilities / (B) risks","(A) problems / (B) risks"],"r":{"a":"4) (A) possibilities / (B) risks","ev":"11~12번 문장","s":[[11,"While deepfakes offer exciting new possibilities, their risks cannot be ignored.","딥페이크는 흥미로운 새로운 가능성을 제공하지만, 그 위험성은 무시될 수 없다."],[12,"The future of this technology depends on how responsibly we use it.","이 기술의 미래는 우리가 얼마나 책임감 있게 사용하느냐에 달려 있다."]],"w":"11번 exciting new possibilities(흥미로운 새로운 가능성), their risks cannot be ignored(위험은 무시될 수 없다), 12번 책임감 있게 사용. problems, benefits, rules는 본문과 어긋남.","c":4},"h":"a1a1ef4131"},{"n":10,"t":"fill","q":"Deep learning allows computers to [A] large amounts of photos, videos, and audio to find patterns in faces, voices, and [B].","ko":"딥러닝은 컴퓨터가 방대한 양의 사진, 영상, 음성을 [A]하여 얼굴, 목소리, [B]의 패턴을 찾도록 해 준다.","bank":["analyze","movements","fake","positive","bully","spread"],"bko":{"analyze":"분석하다","movements":"움직임","fake":"가짜의","positive":"긍정적인","bully":"괴롭히다","spread":"퍼뜨리다"},"r":{"a":"[A] analyze, [B] movements","ev":"4번 문장","s":[[4,"Deep learning allows computers to analyze large amounts of photos, videos, and audio recordings to find patterns in faces, voices, and movements.","딥러닝은 컴퓨터가 방대한 양의 사진, 영상, 음성 녹음을 분석해 얼굴, 목소리, 움직임의 패턴을 찾도록 해 준다."]],"w":"4번 Deep learning allows computers to analyze large amounts of photos, videos, and audio recordings to find patterns in faces, voices, and movements에서 가져옴. fake, positive, bully, spread는 뜻이 맞지 않음.","c":null},"h":"5718ed6b4a"}]},{"u":8,"id":"b4-08-4","no":4,"ko":"땅속이 아닌 실험실에서 다이아몬드를 만든다고?","items":[{"n":1,"t":"tf","q":"For a long time, diamonds could only be found deep underground.","ko":"오랫동안, 다이아몬드는 깊은 땅속에서만 발견될 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"For a long time, diamonds could only be found deep underground.","오랫동안, 다이아몬드는 깊은 땅속에서만 발견될 수 있었다."]],"w":"1번에 같은 문장이 그대로 나옴. 2번 Today, however부터 실험실에서도 만들 수 있게 됨.","c":"T"},"h":"e73c2438da"},{"n":2,"t":"tf","q":"Lab-grown diamonds are usually more expensive than natural diamonds.","ko":"실험실에서 키운 다이아몬드는 보통 천연 다이아몬드보다 더 비싸다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"Not only are they usually less expensive, but they also cause less damage to the environment.","그것들은 보통 값이 덜 비쌀 뿐만 아니라, 환경에 주는 피해도 더 적다."]],"w":"13번에서 실험실 다이아몬드는 보통 less expensive(덜 비싸다)라고 함. 더 비싸다는 말은 반대.","c":"F"},"h":"3a7e50c0bf"},{"n":3,"t":"tf","q":"Scientists place a tiny diamond seed in a machine that creates similar conditions.","ko":"과학자들은 비슷한 조건을 만들어 내는 기계 안에 아주 작은 다이아몬드 씨앗을 넣는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Scientists place a tiny diamond seed in a machine that creates similar conditions.","과학자들은 비슷한 조건을 만들어 내는 기계 안에 아주 작은 다이아몬드 씨앗을 넣는다."]],"w":"8번에 같은 문장이 그대로 나옴. 씨앗을 넣는 것이 실험실 다이아몬드 만들기의 첫 단계.","c":"T"},"h":"dcc4b15e0d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... heat and pressure bond the atoms into hard crystals.)","ko":"... 열과 압력이 그 원자들을 단단한 결정으로 ( )","opts":["분리하다","결합시키다","녹이다","숨기다"],"word":"bond","r":{"a":"2) 결합시키다","ev":"5번 문장","s":[[5,"Over millions of years, heat and pressure bond the atoms into hard crystals.","수백만 년에 걸쳐, 열과 압력이 그 원자들을 단단한 결정으로 결합시킨다."]],"w":"5번에서 흩어진 원자들이 열과 압력으로 단단한 결정이 된다는 뜻. bond = 결합시키다, 붙이다. 분리하거나 녹이는 것은 반대.","c":2},"h":"30f54fd5a7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... avoid moral problems related to diamond mining.)","ko":"... 다이아몬드 채굴과 관련된 ( ) 문제를 피하다","opts":["경제적인","법적인","기술적인","도덕적인"],"word":"moral","r":{"a":"4) 도덕적인","ev":"14번 문장","s":[[14,"They also help companies avoid moral problems related to diamond mining.","그것들은 또한 기업이 다이아몬드 채굴과 관련된 도덕적 문제를 피하도록 돕는다."]],"w":"14번의 moral problems related to diamond mining은 채굴과 관련된 옳고 그름의 문제. moral = 도덕적인. 경제적이나 기술적인 문제가 아님.","c":4},"h":"550ce1b738"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nThis has led to their growing popularity.","ko":"밑줄 친 their가 가리키는 것은?","sko":"이것이 그것들의 인기가 커지는 결과로 이어졌다.","opts":["다이아몬드 채굴 기업들","천연 다이아몬드","실험실에서 키운 다이아몬드","과학자들"],"r":{"a":"3) 실험실에서 키운 다이아몬드","ev":"12~15번 문장","s":[[12,"Many people choose lab-grown diamonds for several reasons.","많은 사람들이 여러 가지 이유로 실험실에서 키운 다이아몬드를 선택한다."],[13,"Not only are they usually less expensive, but they also cause less damage to the environment.","그것들은 보통 값이 덜 비쌀 뿐만 아니라, 환경에 주는 피해도 더 적다."],[14,"They also help companies avoid moral problems related to diamond mining.","그것들은 또한 기업이 다이아몬드 채굴과 관련된 도덕적 문제를 피하도록 돕는다."],[15,"This has led to their growing popularity.","이것이 그것들의 인기가 커지는 결과로 이어졌다."]],"w":"12번에서 사람들이 고르는 것이 lab-grown diamonds이고, 13~14번의 they도 모두 그 다이아몬드. 15번의 their growing popularity = 실험실 다이아몬드의 커지는 인기.","c":3},"h":"c622d8c819"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Lab-grown diamonds copy this process.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"실험실에서 키운 다이아몬드는 이 과정을 따라 한다.","opts":["실험실에서 키운 다이아몬드는 천연 다이아몬드가 만들어지는 과정을 따라 한다.","실험실에서 키운 다이아몬드는 천연 다이아몬드와 전혀 다른 방법으로 만들어진다.","천연 다이아몬드는 실험실의 과정을 따라 만들어진다.","실험실에서 키운 다이아몬드는 화산 안에서 만들어진다."],"r":{"a":"1) 실험실에서 키운 다이아몬드는 천연 다이아몬드가 만들어지는 과정을 따라 한다.","ev":"4~7번 문장","s":[[4,"Natural diamonds form from carbon atoms deep inside the Earth.","천연 다이아몬드는 지구 깊은 곳의 탄소 원자로부터 형성된다."],[5,"Over millions of years, heat and pressure bond the atoms into hard crystals.","수백만 년에 걸쳐, 열과 압력이 그 원자들을 단단한 결정으로 결합시킨다."],[6,"When magma rises from deep underground as a result of volcanic activity, it carries diamonds upward toward Earth’s surface.","화산 활동의 결과로 마그마가 깊은 땅속에서 올라올 때, 그것은 다이아몬드를 지구 표면 쪽으로 위로 실어 나른다."],[7,"Lab-grown diamonds copy this process.","실험실에서 키운 다이아몬드는 이 과정을 따라 한다."]],"w":"this process는 4~6번에서 설명한 천연 다이아몬드가 형성되고 올라오는 과정. copy는 따라 하다. 새로운 방법으로 바꾼다거나 천연과 전혀 다르다는 뜻이 아님.","c":1},"h":"60ba780145"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["다이아몬드는 지구 표면에서 화산 가스로 만들어진다.","마그마는 깊은 땅속에서 올라올 때 다이아몬드를 지구 표면 쪽으로 실어 나른다.","천연 다이아몬드는 단 며칠 만에 만들어진다.","열과 압력은 단단한 결정을 탄소 원자로 쪼갠다."],"opts":["Diamonds are made from volcanic gases on Earth's surface.","Magma carries diamonds upward toward Earth's surface when it rises from deep underground.","Natural diamonds form in just a few days.","Heat and pressure break hard crystals into carbon atoms."],"r":{"a":"2) Magma carries diamonds upward toward Earth's surface when it rises from deep underground.","ev":"5~6번 문장","s":[[5,"Over millions of years, heat and pressure bond the atoms into hard crystals.","수백만 년에 걸쳐, 열과 압력이 그 원자들을 단단한 결정으로 결합시킨다."],[6,"When magma rises from deep underground as a result of volcanic activity, it carries diamonds upward toward Earth’s surface.","화산 활동의 결과로 마그마가 깊은 땅속에서 올라올 때, 그것은 다이아몬드를 지구 표면 쪽으로 위로 실어 나른다."]],"w":"6번에서 마그마가 올라올 때 다이아몬드를 지구 표면 쪽으로 실어 나른다고 함. 5번에서 결정은 열과 압력이 결합시킨 것이라 지표면 화산 가스로 생기는 것이 아니고, 며칠 만에 생기는 것도 아님.","c":2},"h":"2a41a036b7"},{"n":9,"t":"sum","q":"Many people choose lab-grown diamonds because they are usually (A) expensive, cause (B) damage to the environment, and help companies avoid moral problems.","ko":"많은 사람들이 실험실에서 키운 다이아몬드를 선택하는 이유는 그것들이 보통 값이 (A) 비싸고, 환경에 (B) 피해를 주며, 기업이 도덕적 문제를 피하도록 돕기 때문이다.","oko":["(A) 더 / (B) 더 많은","(A) 더 / (B) 더 적은","(A) 너무 / (B) 더 많은","(A) 덜 / (B) 더 적은","(A) 너무 / (B) 더 적은"],"opts":["(A) more / (B) more","(A) more / (B) less","(A) too / (B) more","(A) less / (B) less","(A) too / (B) less"],"r":{"a":"4) (A) less / (B) less","ev":"12~14번 문장","s":[[12,"Many people choose lab-grown diamonds for several reasons.","많은 사람들이 여러 가지 이유로 실험실에서 키운 다이아몬드를 선택한다."],[13,"Not only are they usually less expensive, but they also cause less damage to the environment.","그것들은 보통 값이 덜 비쌀 뿐만 아니라, 환경에 주는 피해도 더 적다."],[14,"They also help companies avoid moral problems related to diamond mining.","그것들은 또한 기업이 다이아몬드 채굴과 관련된 도덕적 문제를 피하도록 돕는다."]],"w":"13번에서 less expensive(덜 비쌈), cause less damage(피해가 더 적음)라고 함. more나 too는 본문과 반대.","c":4},"h":"eac74220d2"},{"n":10,"t":"fill","q":"Heated carbon-rich gases release carbon [A], which settle onto the seed and build the diamond [B] layer by layer.","ko":"가열된 탄소가 풍부한 기체가 탄소 [A]를 방출하고, 그것이 씨앗 위에 자리 잡아 다이아몬드 [B]을 한 층 한 층 쌓아 올린다.","bank":["atoms","crystal","magma","surface","expensive","popularity"],"bko":{"atoms":"원자","crystal":"결정","magma":"마그마","surface":"표면","expensive":"비싼","popularity":"인기"},"r":{"a":"[A] atoms, [B] crystal","ev":"9~10번 문장","s":[[9,"Inside the machine, heated carbon-rich gases release carbon atoms.","기계 안에서, 가열된 탄소가 풍부한 기체가 탄소 원자를 방출한다."],[10,"These atoms settle onto the seed and build the diamond crystal layer by layer.","이 원자들은 씨앗 위에 자리 잡아 다이아몬드 결정을 한 층 한 층 쌓아 올린다."]],"w":"9~10번 heated carbon-rich gases release carbon atoms, build the diamond crystal layer by layer에서 가져옴. magma, surface, expensive, popularity는 이 자리에 쓰면 뜻이 이어지지 않음.","c":null},"h":"c1f12233ec"}]},{"u":9,"id":"b4-09-1","no":1,"ko":"넥타이 색과 브로치, 지도자의 옷이 하는 말은?","items":[{"n":1,"t":"tf","q":"In the United States, presidents carefully choose the colors of their ties for speeches or debates.","ko":"미국에서 대통령들은 연설이나 토론을 위해 넥타이 색을 신중하게 고른다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장에 presidents carefully choose tie colors for speeches or debates가 그대로 나옴. choose(고르다)의 주어가 대통령이고 이유가 연설·토론이라 선지와 일치.","c":"T","ev":"2번 문장","s":[[2,"In the United States, presidents carefully choose tie colors for speeches or debates.","미국에서 대통령들은 연설이나 토론을 위해 넥타이 색을 신중하게 고른다."]]},"h":"c42347de07"},{"n":2,"t":"tf","q":"Democrats often wear a red tie to show calmness and trust.","ko":"민주당원들은 침착함과 신뢰를 보여 주려고 흔히 빨간 넥타이를 맨다.","r":{"a":"F (본문과 다른 내용)","w":"5번 문장에서 민주당원(Democrats)은 파란(blue) 넥타이로 침착함과 신뢰를 보여 줌. 빨간 넥타이는 공화당의 색이라 색이 바뀌어서 틀림.","c":"F","ev":"5번 문장","s":[[5,"Democrats often wear a blue tie, which shows calmness and trust.","민주당원들은 흔히 파란 넥타이를 매는데, 이는 침착함과 신뢰를 보여 준다."]]},"h":"0e1264d208"},{"n":3,"t":"tf","q":"A leader may wear a purple tie to show unity between political parties.","ko":"지도자는 정당 간의 화합을 보여 주기 위해 보라색 넥타이를 맬 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장에 a leader wears a purple tie to show unity between political parties가 있음. 보라색은 정당 사이의 화합이라 선지와 일치.","c":"T","ev":"6번 문장","s":[[6,"Sometimes, a leader wears a purple tie to show unity between political parties.","때때로 지도자는 정당 간의 화합을 보여 주기 위해 보라색 넥타이를 맨다."]]},"h":"4112a71887"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For many leaders, fashion is more than decoration, as it sends quiet but powerful messages to the public.)","ko":"많은 지도자들에게 패션은 ( ) 이상의 것이며, 대중에게 조용하지만 강력한 메시지를 전달한다.","opts":["규칙","의견","장식","경쟁"],"word":"decoration","r":{"a":"3) 장식","w":"1번 문장은 패션이 decoration 이상이라고 한 뒤, 메시지를 보낸다고 이어짐. 겉을 꾸미는 ‘장식’이 맞고, 규칙·의견·경쟁은 문맥과 관계없음.","c":3,"ev":"1번 문장","s":[[1,"For many leaders, fashion is more than decoration, as it sends quiet but powerful messages to the public.","많은 지도자들에게 패션은 장식 이상의 것이며, 대중에게 조용하지만 강력한 메시지를 전달한다."]]},"h":"9f5992283d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (With this one piece of jewelry, she quietly expressed friendship and respect.)","ko":"이 보석 하나로 그녀는 우정과 존중을 조용히 ( ).","opts":["표현했다","숨겼다","요구했다","거절했다"],"word":"expressed","r":{"a":"1) 표현했다","w":"11번은 브로치 하나로 우정과 존중을 조용히 ‘나타냈다’는 내용. express(표현하다)가 맞음. 숨기거나 요구하거나 거절했다는 말은 앞 내용과 맞지 않음.","c":1,"ev":"11번 문장","s":[[11,"With this one piece of jewelry, she quietly expressed friendship and respect.","이 보석 하나로 그녀는 우정과 존중을 조용히 표현했다."]]},"h":"3e277d1b83"},{"n":6,"t":"ref","q":"What does the underlined \"this one piece of jewelry\" refer to?\nWith this one piece of jewelry, she quietly expressed friendship and respect.","ko":"밑줄 친 this one piece of jewelry가 가리키는 것은?","sko":"이 보석 하나로 그녀는 우정과 존중을 조용히 표현했다.","opts":["캐나다 국기","단풍잎 브로치","여왕의 왕관","파란 넥타이"],"r":{"a":"2) 단풍잎 브로치","w":"9번에서 캐나다 지도자들을 만날 때 단다고 한 것이 maple leaf brooch(단풍잎 브로치). 11번의 이 보석 하나가 바로 그것을 가리킴.","c":2,"ev":"9번, 11번 문장","s":[[9,"For example, when meeting Canadian leaders, she wore a maple leaf brooch.","예를 들어, 캐나다 지도자들을 만날 때 그녀는 단풍잎 브로치를 달았다."],[11,"With this one piece of jewelry, she quietly expressed friendship and respect.","이 보석 하나로 그녀는 우정과 존중을 조용히 표현했다."]]},"h":"f75f17c012"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Though simple, fashion choices like these help people understand what leaders want to say and how they want to be seen.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"소박하지만 이와 같은 패션 선택은 지도자들이 무엇을 말하고 싶은지, 그리고 어떻게 보이고 싶은지를 사람들이 이해하도록 돕는다.","opts":["지도자는 단순한 옷만 입어야 사람들이 그의 말을 이해한다.","사람들은 지도자의 패션보다 그가 하는 말에 더 관심이 많다.","화려한 패션일수록 지도자의 생각이 더 잘 전달된다.","겉보기엔 소박한 패션 선택도 지도자가 전하고 싶은 말과 보이고 싶은 모습을 알게 해 준다."],"r":{"a":"4) 겉보기엔 소박한 패션 선택도 지도자가 전하고 싶은 말과 보이고 싶은 모습을 알게 해 준다.","w":"Though simple은 ‘소박해 보여도’라는 뜻이고, help people understand는 사람들이 이해하게 돕는다는 뜻. 소박한 패션도 지도자의 뜻을 알려 준다는 4번이 맞음. 화려할수록 좋다거나 말이 더 중요하다는 내용은 없음.","c":4,"ev":"12번 문장","s":[[12,"Though simple, fashion choices like these help people understand what leaders want to say and how they want to be seen.","소박하지만 이와 같은 패션 선택은 지도자들이 무엇을 말하고 싶은지, 그리고 어떻게 보이고 싶은지를 사람들이 이해하도록 돕는다."]]},"h":"c57602e81e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["빨간 넥타이는 침착함과 신뢰를 보여 준다.","미국 대통령은 넥타이 색을 생각 없이 고른다.","엘리자베스 2세 여왕은 캐나다 지도자들을 만날 때 단풍잎 브로치를 달았다.","보라색 넥타이는 한 정당의 힘을 보여 주려고 맨다."],"opts":["A red tie shows calmness and trust.","Presidents in the United States choose tie colors without thinking.","Queen Elizabeth II wore a maple leaf brooch when meeting Canadian leaders.","A purple tie is worn to show the power of one party."],"r":{"a":"3) Queen Elizabeth II wore a maple leaf brooch when meeting Canadian leaders.","w":"9번에서 캐나다 지도자들을 만날 때 단풍잎 브로치를 달았다고 함. 침착함과 신뢰는 빨강이 아니라 파랑(5번)이고, 대통령은 신중하게 고르며(2번), 보라색은 한 정당이 아니라 정당 간 화합(6번)을 뜻함.","c":3,"ev":"4~5번, 9번 문장","s":[[4,"A red tie suggests confidence and strength.","빨간 넥타이는 자신감과 강인함을 나타낸다."],[5,"Democrats often wear a blue tie, which shows calmness and trust.","민주당원들은 흔히 파란 넥타이를 매는데, 이는 침착함과 신뢰를 보여 준다."],[9,"For example, when meeting Canadian leaders, she wore a maple leaf brooch.","예를 들어, 캐나다 지도자들을 만날 때 그녀는 단풍잎 브로치를 달았다."]]},"h":"c6e41f04c7"},{"n":9,"t":"sum","q":"In U.S. politics, a red tie suggests (A), while a blue tie shows (B).","ko":"미국 정치에서 빨간 넥타이는 (A)을 나타내고, 파란 넥타이는 (B)을 보여 준다.","oko":["(A) 침착함 / (B) 자신감","(A) 자신감 / (B) 화합","(A) 화합 / (B) 침착함","(A) 신뢰 / (B) 강인함","(A) 자신감 / (B) 침착함"],"opts":["(A) calmness / (B) confidence","(A) confidence / (B) unity","(A) unity / (B) calmness","(A) trust / (B) strength","(A) confidence / (B) calmness"],"r":{"a":"5) (A) confidence / (B) calmness","w":"4번에서 빨간 넥타이는 confidence(자신감)와 strength, 5번에서 파란 넥타이는 calmness(침착함)와 trust를 보여 줌. 따라서 (A) confidence, (B) calmness. unity(화합)는 보라색 넥타이의 뜻임.","c":5,"ev":"3~5번 문장","s":[[3,"Red is the color of the Republican Party.","빨간색은 공화당의 색이다."],[4,"A red tie suggests confidence and strength.","빨간 넥타이는 자신감과 강인함을 나타낸다."],[5,"Democrats often wear a blue tie, which shows calmness and trust.","민주당원들은 흔히 파란 넥타이를 매는데, 이는 침착함과 신뢰를 보여 준다."]]},"h":"d3ccc20274"},{"n":10,"t":"fill","q":"When meeting Canadian leaders, Queen Elizabeth II wore a maple leaf [A] to show a warm [B] and respect toward Canada.","ko":"캐나다 지도자들을 만날 때 엘리자베스 2세 여왕은 캐나다에 대한 따뜻한 [B]과 존중을 보여 주려고 단풍잎 [A]를 달았다.","bank":["brooch","friendship","confidence","calmness","strength","diplomacy"],"bko":{"brooch":"브로치","friendship":"우정","confidence":"자신감","calmness":"침착함","strength":"강인함","diplomacy":"외교"},"r":{"a":"[A] brooch, [B] friendship","w":"9번에서 단풍잎 브로치(brooch)를 달았고, 11번에서 그것으로 우정(friendship)과 존중을 표현했다고 함. confidence, strength, calmness는 2~6번 넥타이의 뜻이라 여기에 쓰면 틀림.","c":null,"ev":"9~11번 문장","s":[[9,"For example, when meeting Canadian leaders, she wore a maple leaf brooch.","예를 들어, 캐나다 지도자들을 만날 때 그녀는 단풍잎 브로치를 달았다."],[10,"The maple leaf is the symbol of Canada.","단풍잎은 캐나다의 상징이다."],[11,"With this one piece of jewelry, she quietly expressed friendship and respect.","이 보석 하나로 그녀는 우정과 존중을 조용히 표현했다."]]},"h":"81bfcbf7f4"}]},{"u":9,"id":"b4-09-2","no":2,"ko":"외교관이 체포되지 않는 이유는?","items":[{"n":1,"t":"tf","q":"A diplomat is an official who works in a foreign country to represent their own government.","ko":"외교관은 자기 나라 정부를 대표하기 위해 외국에서 일하는 공무원이다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장이 그대로 이 내용임. represent(대표하다)의 대상이 자기 나라 정부라 선지와 일치.","c":"T","ev":"1번 문장","s":[[1,"A diplomat is an official who works in a foreign country to represent their own government.","외교관은 자기 나라 정부를 대표하기 위해 외국에서 일하는 공무원이다."]]},"h":"7010d06141"},{"n":2,"t":"tf","q":"In the past, diplomats were safe from punishment even when they delivered bad news that angered the host government.","ko":"과거에 외교관은 주재국 정부를 화나게 하는 나쁜 소식을 전해도 처벌받지 않았다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 나쁜 소식이나 주재국 정부를 화나게 하는 메시지를 전하면 직접 처벌받을 수 있었다고 함. 처벌받지 않았다는 선지는 반대임.","c":"F","ev":"4번 문장","s":[[4,"If a diplomat delivered bad news or messages that angered the host government, they could be punished directly.","외교관이 나쁜 소식이나 주재국 정부를 화나게 하는 메시지를 전하면, 그들은 직접 처벌받을 수 있었다."]]},"h":"67a967d0a7"},{"n":3,"t":"tf","q":"Diplomatic immunity helps diplomats avoid unjust treatment or political pressure.","ko":"외교관 면책 특권은 외교관이 부당한 대우나 정치적 압력을 피하도록 돕는다.","r":{"a":"T (본문과 맞는 내용)","w":"10번 문장에 Because of diplomatic immunity, diplomats can avoid unjust treatment or political pressure가 있음. 면책 특권 덕분에 피할 수 있다는 뜻이라 일치.","c":"T","ev":"10번 문장","s":[[10,"Because of diplomatic immunity, diplomats can avoid unjust treatment or political pressure.","외교관 면책 특권 덕분에 외교관은 부당한 대우나 정치적 압력을 피할 수 있다."]]},"h":"6a5a42c7ab"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some were accused of spying or even arrested on false charges.)","ko":"일부는 간첩 혐의로 ( ) 심지어 거짓 혐의로 체포되기도 했다.","opts":["보호받았다","고발당했다","초대받았다","승진했다"],"word":"accused","r":{"a":"2) 고발당했다","w":"accused of spying은 ‘간첩 짓을 했다고 고발당했다’는 뜻이고, 뒤에 arrested(체포되었다)가 이어짐. accuse(고발하다)가 맞고, 보호·초대·승진은 이어지는 체포와 맞지 않음.","c":2,"ev":"5번 문장","s":[[5,"Some were accused of spying or even arrested on false charges.","일부는 간첩 혐의를 받거나 심지어 거짓 혐의로 체포되기도 했다."]]},"h":"f30797e048"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Diplomats can avoid unjust treatment or political pressure.)","ko":"외교관은 ( ) 대우나 정치적 압력을 피할 수 있다.","opts":["공정한","친절한","빠른","부당한"],"word":"unjust","r":{"a":"4) 부당한","w":"unjust는 just(공정한) 앞에 un이 붙은 말로 ‘공정하지 않은, 부당한’이라는 뜻. 10번은 면책 특권이 피하게 해 주는 나쁜 것을 말하므로 부당한이 맞음.","c":4,"ev":"10번 문장","s":[[10,"Because of diplomatic immunity, diplomats can avoid unjust treatment or political pressure.","외교관 면책 특권 덕분에 외교관은 부당한 대우나 정치적 압력을 피할 수 있다."]]},"h":"e85f7d4670"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nTo prevent this, countries created a special legal protection called diplomatic immunity.","ko":"밑줄 친 this가 가리키는 것은?","sko":"이를 막기 위해 나라들은 외교관 면책 특권이라고 불리는 특별한 법적 보호 제도를 만들었다.","opts":["외교관이 외국에서 일하는 것","현지 경찰이 외교관을 보호하는 것","외교관이 처벌받고 체포되어 나라들이 서로 대화하거나 신뢰하기 어려워진 일","나라들이 새로운 법을 만든 것"],"r":{"a":"3) 외교관이 처벌받고 체포되어 나라들이 서로 대화하거나 신뢰하기 어려워진 일","w":"7번의 To prevent this는 ‘이것을 막기 위해’라는 뜻이고, 바로 앞 6번에서 처벌·체포 때문에 나라들이 대화하거나 신뢰하기 어려워졌다고 함. 그 문제를 막으려고 면책 특권이 생긴 것.","c":3,"ev":"6~7번 문장","s":[[6,"These actions made it hard for countries to talk or trust one another.","이런 행동들은 나라들이 서로 대화하거나 신뢰하기 어렵게 만들었다."],[7,"To prevent this, countries created a special legal protection called diplomatic immunity.","이를 막기 위해 나라들은 외교관 면책 특권이라고 불리는 특별한 법적 보호 제도를 만들었다."]]},"h":"7eb20709ca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Under this protection, diplomats are not subject to the laws of the host country.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 보호 아래에서 외교관은 주재국의 법을 적용받지 않는다.","opts":["외교관은 주재국의 법을 반드시 지켜야 한다.","외교관은 주재국의 법을 적용받지 않는다.","외교관은 주재국에서 새로운 법을 만들 수 있다.","외교관은 자기 나라의 법을 적용받지 않는다."],"r":{"a":"2) 외교관은 주재국의 법을 적용받지 않는다.","w":"be subject to는 ‘~의 적용을 받다’이므로 are not subject to는 ‘적용받지 않는다’. 주재국(host country)의 법을 적용받지 않는다는 2번이 맞음. 자기 나라의 법이 아니라 주재국 법이라는 점에 주의.","c":2,"ev":"8번 문장","s":[[8,"Under this protection, diplomats are not subject to the laws of the host country.","이 보호 아래에서 외교관은 주재국의 법을 적용받지 않는다."]]},"h":"f82e0febf4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["외교관이 법을 어겼다고 의심받으면 현지 경찰이 체포할 수 있다.","외교관의 주요 임무는 외국에서 자기 나라의 법을 지키게 하는 것이다.","과거에는 외교관의 일이 안전했다.","외교관 면책 특권은 현지 경찰이 외교관을 체포하거나 가두지 못하게 한다."],"opts":["Local police can arrest diplomats if they are suspected of breaking a law.","A diplomat’s main job is to make people follow their own country’s laws abroad.","In the past, a diplomat’s job was safe.","Diplomatic immunity stops local police from arresting or jailing diplomats."],"r":{"a":"4) Diplomatic immunity stops local police from arresting or jailing diplomats.","w":"9번에서 외교관이 법을 어겼다는 의심을 받더라도 현지 경찰은 체포하거나 감옥에 가둘 수 없다고 함. 1번은 이와 반대이고, 임무는 평화와 관계 유지(2번), 과거에는 위험했다(3번)고 했으므로 2·3번도 틀림.","c":4,"ev":"9번 문장","s":[[9,"Local police cannot arrest or jail them, even if they are suspected of breaking a law.","현지 경찰은 외교관이 법을 어겼다는 의심을 받더라도 그들을 체포하거나 감옥에 가둘 수 없다."]]},"h":"58941014aa"},{"n":9,"t":"sum","q":"In the past, diplomats could be (A) for delivering bad news, and this made it hard for countries to (B) one another.","ko":"과거에 외교관은 나쁜 소식을 전했다는 이유로 (A) 수 있었고, 이는 나라들이 서로를 (B)하기 어렵게 만들었다.","oko":["(A) 보상받을 / (B) 신뢰","(A) 처벌받을 / (B) 무시","(A) 보호받을 / (B) 비난","(A) 초대받을 / (B) 방문","(A) 처벌받을 / (B) 신뢰"],"opts":["(A) rewarded / (B) trust","(A) punished / (B) ignore","(A) protected / (B) blame","(A) invited / (B) visit","(A) punished / (B) trust"],"r":{"a":"5) (A) punished / (B) trust","w":"4번에서 나쁜 소식을 전하면 punished(처벌받음), 6번에서 이런 행동들이 나라들이 대화하거나 trust(신뢰)하기 어렵게 만들었다고 함. 따라서 (A) punished, (B) trust.","c":5,"ev":"3~6번 문장","s":[[3,"In the past, this job was dangerous.","과거에는 이 일이 위험했다."],[4,"If a diplomat delivered bad news or messages that angered the host government, they could be punished directly.","외교관이 나쁜 소식이나 주재국 정부를 화나게 하는 메시지를 전하면, 그들은 직접 처벌받을 수 있었다."],[5,"Some were accused of spying or even arrested on false charges.","일부는 간첩 혐의를 받거나 심지어 거짓 혐의로 체포되기도 했다."],[6,"These actions made it hard for countries to talk or trust one another.","이런 행동들은 나라들이 서로 대화하거나 신뢰하기 어렵게 만들었다."]]},"h":"54e9d01b52"},{"n":10,"t":"fill","q":"Because of diplomatic [A], diplomats can avoid unjust treatment and speak [B] without fear.","ko":"외교관 면책 특권 덕분에 외교관은 부당한 대우를 피하고 두려움 없이 [B] 말할 수 있다.","bank":["immunity","honestly","charges","host","peace","spying"],"bko":{"immunity":"면책 특권","honestly":"솔직하게","charges":"혐의","host":"주재국의","peace":"평화","spying":"간첩 행위"},"r":{"a":"[A] immunity, [B] honestly","w":"10번에서 diplomatic immunity 덕분에 부당한 대우를 피할 수 있고, 11번에서 솔직하게(honestly) 말하고 두려움 없이 메시지를 전달할 수 있다고 함. charges·spying은 과거의 위험(5번)이고 peace는 명사라 말하는 방식으로 쓸 수 없음.","c":null,"ev":"10~11번 문장","s":[[10,"Because of diplomatic immunity, diplomats can avoid unjust treatment or political pressure.","외교관 면책 특권 덕분에 외교관은 부당한 대우나 정치적 압력을 피할 수 있다."],[11,"They are able to speak honestly, deliver difficult messages without fear, and communicate openly, which is essential for global peace.","그들은 솔직하게 말하고, 두려움 없이 어려운 메시지를 전달하고, 터놓고 소통할 수 있으며, 이는 세계 평화에 필수적이다."]]},"h":"6e761f787b"}]},{"u":9,"id":"b4-09-3","no":3,"ko":"버스 자리를 양보하지 않은 로자 파크스, 무슨 일이?","items":[{"n":1,"t":"tf","q":"In 1955, a law in the United States required Black passengers on buses to give up their seats to white passengers.","ko":"1955년 미국에는 버스에서 흑인 승객이 백인 승객에게 자리를 양보하도록 요구하는 법이 있었다.","r":{"a":"T (본문과 맞는 내용)","w":"7번 문장에 the law required Black passengers to give up their seats to white passengers가 있음. 5번에서 1955년 미국의 사례라고 했으므로 선지와 일치.","c":"T","ev":"7번 문장","s":[[7,"On buses, the law required Black passengers to give up their seats to white passengers.","버스에서 법은 흑인 승객에게 백인 승객에게 자리를 양보하도록 요구했다."]]},"h":"1faf8b20cf"},{"n":2,"t":"tf","q":"After a few days of protest, the U.S. Supreme Court ruled the bus laws illegal.","ko":"며칠 동안의 시위 뒤에 미국 연방 대법원은 버스 법이 불법이라고 판결했다.","r":{"a":"F (본문과 다른 내용)","w":"13번 문장에서 After more than a year of protest(1년이 넘는 시위 끝에) 대법원이 판결했다고 함. 며칠이 아니라 1년이 넘었으므로 틀림.","c":"F","ev":"13번 문장","s":[[13,"After more than a year of protest, the U.S. Supreme Court ruled the bus laws illegal.","1년이 넘는 시위 끝에 미국 연방 대법원은 버스 법이 불법이라고 판결했다."]]},"h":"f39921322f"},{"n":3,"t":"tf","q":"The purpose of civil disobedience is to help others recognize a problem and call for change.","ko":"시민 불복종의 목적은 다른 사람들이 문제를 알아차리고 변화를 요구하도록 돕는 것이다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장에 Its purpose is to help others recognize the problem and call for change가 있음. 시민 불복종의 목적과 그대로 일치.","c":"T","ev":"4번 문장","s":[[4,"Its purpose is to h
