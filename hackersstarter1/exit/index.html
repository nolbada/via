s, they immediately curl up.","ko":"밑줄 친 they가 가리키는 것은?","opts":["사람들","동물들","별명들","함수초의 잎들"],"sko":"누군가가 그것의 잎들을 만지면, 그것들은 즉시 동그랗게 말린다.","r":{"a":"4) 함수초의 잎들","ev":"7번 문장","s":[[7,"When someone touches its leaves, they immediately curl up.","누군가가 그것의 잎들을 만지면, 그것들은 즉시 동그랗게 말린다."]],"w":"즉시 동그랗게 말리는 것은 사람이 아니라 its leaves(그것의 잎들)예요.","c":4},"h":"8fad85ed8d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is hard to imagine, but the Mimosa pudica can.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이것은 상상하기 쉽고, 함수초도 할 수 있다.","이것은 상상하기 어렵지만, 함수초는 (손길을 느낄 수) 있다.","이것은 상상하기 어려워서, 함수초도 할 수 없다.","이것은 상상하기 쉽지만, 함수초는 할 수 없다."],"sko":"이것은 상상하기 어렵지만, 함수초는 느낄 수 있다.","r":{"a":"2) 이것은 상상하기 어렵지만, 함수초는 (손길을 느낄 수) 있다.","ev":"1~2번 문장","s":[[1,"Can a plant feel your touch?","식물이 당신의 손길을 느낄 수 있는가?"],[2,"This is hard to imagine, but the Mimosa pudica can.","이것은 상상하기 어렵지만, 함수초는 느낄 수 있다."]],"w":"hard to imagine은 '상상하기 어렵다'이고 but 뒤는 반대로 함수초는 할 수 있다는 뜻이에요. can 뒤에는 feel your touch가 생략되어 있어요.","c":2},"h":"8b8009cdfd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The plant grows only in Asia.","Animals eat the plant more when its leaves fold.","The plant gets more energy when its leaves are folded.","People call it a touch-me-not plant."],"oko":["그 식물은 아시아에서만 자란다.","잎이 접히면 동물들이 그 식물을 더 많이 먹는다.","잎이 접히면 그 식물은 더 많은 에너지를 얻는다.","사람들은 그것을 '저를 만지지 마세요 식물'이라고 부른다."],"r":{"a":"4) People call it a touch-me-not plant.","ev":"5번 문장","s":[[5,"It is called a “touch-me-not plant” or a “shy plant.”","그것은 ‘저를 만지지 마세요 식물’ 또는 ‘수줍은 식물’이라고 불린다."]],"w":"5번에서 touch-me-not plant 또는 shy plant라고 불린다고 해요. 자라는 곳은 아메리카(3번)이고, 잎이 접히면 동물들이 먹지 않으며(10번) 에너지는 더 적게 얻어요(12번).","c":4},"h":"292cb455bc"},{"n":9,"t":"sum","q":"When a Mimosa pudica is touched, its leaves fold. This (A) the plant from animals because it looks (B).","ko":"함수초가 만져지면 잎이 접힌다. 이것은 식물이 (B) 보이기 때문에 동물들로부터 식물을 (A).","opts":["(A) protects / (B) happy","(A) feeds / (B) sick","(A) hurts / (B) strong","(A) protects / (B) tall","(A) protects / (B) sick"],"oko":["(A) 보호한다 / (B) 행복해","(A) 먹여 준다 / (B) 병들어","(A) 해친다 / (B) 튼튼해","(A) 보호한다 / (B) 키가 커","(A) 보호한다 / (B) 병들어"],"r":{"a":"5) (A) protects / (B) sick","ev":"9~10번 문장","s":[[9,"This ability protects the plant from animals.","이 능력은 그 식물을 동물들로부터 보호한다."],[10,"The folded leaves make the plant look sick, so animals don’t eat it.","접힌 잎들은 식물이 병들어 보이도록 해서, 동물들이 그것을 먹지 않는다."]],"w":"9번에서 이 능력이 식물을 동물들로부터 보호하고(protects), 10번에서 접힌 잎이 식물을 병들어 보이게(sick) 해서 동물들이 먹지 않아요.","c":5},"h":"c8a00a9b38"},{"n":10,"t":"fill","q":"Do not touch the plant too [A], because its leaves fold and it gets [B] energy from sunlight.","ko":"그 식물을 너무 [A] 만지지 말아라. 잎이 접혀서 햇빛으로부터 [B] 에너지를 얻기 때문이다.","bank":["often","less","more","rarely","leaves","animals"],"bko":{"often":"자주","less":"더 적은","more":"더 많은","rarely":"드물게","leaves":"잎들","animals":"동물들"},"r":{"a":"[A] often, [B] less","ev":"11~12번 문장","s":[[11,"But do not touch it too often!","하지만 그것을 너무 자주 만지지 말아라!"],[12,"When the leaves fold, the plant gets less energy from sunlight.","잎들이 접히면, 그 식물은 햇빛으로부터 더 적은 에너지를 얻는다."]],"w":"11번에서 너무 자주(too often) 만지지 말라고 했고, 12번에서 잎이 접히면 햇빛으로부터 더 적은(less) 에너지를 얻는다고 해요. more는 반대 뜻이에요.","c":null},"h":"1f4e0ef232"}]},{"u":7,"id":"hs1-07-1","no":1,"ko":"나는 절대 눈을 감지 않지","items":[{"n":1,"t":"tf","q":"The clear scales protect the eyes of snakes from getting hurt.","ko":"투명한 비늘은 뱀의 눈을 다치는 것으로부터 보호한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"These clear scales protect their eyes from getting hurt.","이 투명한 비늘은 그것들의 눈을 다치는 것으로부터 보호한다."]],"w":"5번 문장에 These clear scales protect their eyes from getting hurt가 있어요. 투명한 비늘이 눈을 다치지 않게 보호한다는 내용과 같아요.","c":"T"},"h":"1d1db2127f"},{"n":2,"t":"tf","q":"Most snakes walk on their legs on the ground.","ko":"대부분의 뱀들은 다리로 땅 위를 걸어 다닌다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Well, most snakes crawl on the ground because they don’t have legs.","자, 대부분의 뱀들은 다리가 없기 때문에 땅 위를 기어 다닌다."]],"w":"8번 문장에서 대부분의 뱀들은 다리가 없기 때문에(they don’t have legs) 땅 위를 기어 다닌다(crawl)고 해요. 다리로 걷는다는 말은 반대예요.","c":"F"},"h":"3e46a4a146"},{"n":3,"t":"tf","q":"Snakes can’t close their eyes because they don’t have eyelids.","ko":"뱀들은 눈꺼풀이 없기 때문에 눈을 감을 수 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Snakes can’t blink or close their eyes because they don’t have eyelids.","뱀들은 눈꺼풀이 없기 때문에 눈을 깜박이거나 감을 수 없다."]],"w":"3번 문장이 그대로 말해 줘요. 눈꺼풀이 없어서(because they don’t have eyelids) 눈을 깜박이거나 감을 수 없어요.","c":"T"},"h":"c74163d5d4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Most snakes crawl on the ground because they don’t have legs.)","ko":"대부분의 뱀들은 다리가 없기 때문에 땅 위를 기어 다닌다.","opts":["뛰어오르다","헤엄치다","기어 다니다","날아다니다"],"word":"crawl","r":{"a":"3) 기어 다니다","ev":"8번 문장","s":[[8,"Well, most snakes crawl on the ground because they don’t have legs.","자, 대부분의 뱀들은 다리가 없기 때문에 땅 위를 기어 다닌다."]],"w":"뱀은 다리가 없다고 했으니 뛰거나 걷지 못하고 땅 위를 몸으로 기어 다녀요. crawl = 기다. 뒤의 on the ground(땅 위를)도 힌트예요.","c":3},"h":"a1a85bb18e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Snakes can move around safely without injuring their eyes!)","ko":"뱀들은 눈을 다치게 하지 않고 안전하게 돌아다닐 수 있다!","opts":["도와주다","다치게 하다","씻다","감추다"],"word":"injuring","r":{"a":"2) 다치게 하다","ev":"10번 문장","s":[[10,"Thanks to the eye scales, snakes can move around safely without injuring their eyes!","눈의 비늘 덕분에, 뱀들은 눈을 다치게 하지 않고 안전하게 돌아다닐 수 있다!"]],"w":"눈의 비늘 덕분에(Thanks to) 안전하게 돌아다닐 수 있다는 내용이에요. without(~하지 않고) 뒤에 오므로 눈을 다치게 하지 않는다는 뜻이고, injure는 다치게 하다예요. 5번의 get hurt(다치다)와 같은 뜻 흐름이에요.","c":2},"h":"94578e7bfb"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nSo dirt and dust can easily get into their eyes.","ko":"밑줄 친 their가 가리키는 것은?","sko":"그래서 흙과 먼지가 눈으로 쉽게 들어갈 수 있다.","opts":["흙과 먼지의","비늘의","땅의","뱀들의"],"r":{"a":"4) 뱀들의","ev":"8~9번 문장","s":[[8,"Well, most snakes crawl on the ground because they don’t have legs.","자, 대부분의 뱀들은 다리가 없기 때문에 땅 위를 기어 다닌다."],[9,"So dirt and dust can easily get into their eyes.","그래서 흙과 먼지가 눈으로 쉽게 들어갈 수 있다."]],"w":"흙과 먼지가 들어가는 눈은 8번 문장의 most snakes(대부분의 뱀들)의 눈이에요. 그래서 their는 뱀들을 가리켜요.","c":4},"h":"1826165aa1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Thanks to the eye scales, snakes can move around safely without injuring their eyes!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"눈의 비늘 덕분에, 뱀들은 눈을 다치게 하지 않고 안전하게 돌아다닐 수 있다!","opts":["눈의 비늘 덕분에 뱀들은 눈을 다치지 않고 안전하게 돌아다닐 수 있다.","눈의 비늘 때문에 뱀들은 눈을 다쳐서 돌아다닐 수 없다.","눈의 비늘이 없어도 뱀들은 눈을 다치지 않고 돌아다닐 수 있다.","눈의 비늘 덕분에 뱀들은 땅 위를 기어 다닐 수 없다."],"r":{"a":"1) 눈의 비늘 덕분에 뱀들은 눈을 다치지 않고 안전하게 돌아다닐 수 있다.","ev":"10번 문장","s":[[10,"Thanks to the eye scales, snakes can move around safely without injuring their eyes!","눈의 비늘 덕분에, 뱀들은 눈을 다치게 하지 않고 안전하게 돌아다닐 수 있다!"]],"w":"Thanks to는 '~ 덕분에', without injuring은 '다치게 하지 않고'예요. 비늘이 있어서 안전하게 돌아다닌다는 뜻이라 나머지는 모두 반대이거나 본문에 없는 말이에요.","c":1},"h":"2fbf2f241a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["뱀은 눈꺼풀로 눈을 감을 수 있다.","대부분의 뱀들은 네 개의 다리로 움직인다.","눈의 비늘은 뱀의 눈이 건조해지는 것을 막는다.","뱀은 물속에서 살기 때문에 눈의 비늘이 있다."],"opts":["Snakes can close their eyes with their eyelids.","Most snakes move around on four legs.","Eye scales keep the eyes of snakes from becoming dry.","Snakes have eye scales because they live in water."],"r":{"a":"3) Eye scales keep the eyes of snakes from becoming dry.","ev":"3번, 6번, 8번 문장","s":[[3,"Snakes can’t blink or close their eyes because they don’t have eyelids.","뱀들은 눈꺼풀이 없기 때문에 눈을 깜박이거나 감을 수 없다."],[6,"The scales also prevent the eyes from becoming dry.","그 비늘들은 또한 눈을 건조해지는 것으로부터 막는다."],[8,"Well, most snakes crawl on the ground because they don’t have legs.","자, 대부분의 뱀들은 다리가 없기 때문에 땅 위를 기어 다닌다."]],"w":"6번에서 비늘이 눈을 건조해지는 것으로부터 막는다고 해요. 뱀은 눈꺼풀이 없고(3번), 다리가 없어 땅 위를 기어 다니므로(8번) 나머지는 본문과 달라요.","c":3},"h":"e7c03370d6"},{"n":9,"t":"sum","q":"Snakes can’t close their eyes because they have no (A). Instead, clear eye scales (B) their eyes.","ko":"뱀들은 (A)이/가 없어서 눈을 감을 수 없다. 대신 투명한 눈의 비늘이 그들의 눈을 (B).","oko":["(A) 다리 / (B) 씻는다","(A) 눈꺼풀 / (B) 다치게 한다","(A) 눈꺼풀 / (B) 보호한다","(A) 다리 / (B) 보호한다","(A) 비늘 / (B) 가린다"],"opts":["(A) legs / (B) wash","(A) eyelids / (B) hurt","(A) eyelids / (B) protect","(A) legs / (B) protect","(A) scales / (B) cover"],"r":{"a":"3) (A) eyelids / (B) protect","ev":"3~5번 문장","s":[[3,"Snakes can’t blink or close their eyes because they don’t have eyelids.","뱀들은 눈꺼풀이 없기 때문에 눈을 깜박이거나 감을 수 없다."],[4,"Instead, they have eye scales!","대신, 그것들은 눈의 비늘을 가지고 있다!"],[5,"These clear scales protect their eyes from getting hurt.","이 투명한 비늘은 그것들의 눈을 다치는 것으로부터 보호한다."]],"w":"3번에서 눈꺼풀(eyelids)이 없어 눈을 감을 수 없고, 4~5번에서 대신 투명한 비늘이 눈을 보호한다(protect)고 해요. 다리가 없는 것은 8번의 이야기예요.","c":3},"h":"cab4dabc70"},{"n":10,"t":"fill","q":"Most snakes [A] on the ground, and thanks to eye scales, they can move around [B].","ko":"대부분의 뱀들은 땅 위를 [A], 눈의 비늘 덕분에 [B] 돌아다닐 수 있다.","bank":["crawl","safely","blink","injure","dust","protect"],"bko":{"crawl":"기다","safely":"안전하게","blink":"눈을 깜박이다","injure":"다치게 하다","dust":"먼지","protect":"보호하다"},"r":{"a":"[A] crawl, [B] safely","ev":"8번, 10번 문장","s":[[8,"Well, most snakes crawl on the ground because they don’t have legs.","자, 대부분의 뱀들은 다리가 없기 때문에 땅 위를 기어 다닌다."],[10,"Thanks to the eye scales, snakes can move around safely without injuring their eyes!","눈의 비늘 덕분에, 뱀들은 눈을 다치게 하지 않고 안전하게 돌아다닐 수 있다!"]],"w":"8번 most snakes crawl on the ground, 10번 snakes can move around safely에서 가져왔어요. blink(눈을 깜박이다)는 뱀이 할 수 없는 일(3번)이고, protect(보호하다)는 'move around' 뒤에 올 수 없어요.","c":null},"h":"71c6431a2b"}]},{"u":7,"id":"hs1-07-2","no":2,"ko":"반지를 위한 손가락","items":[{"n":1,"t":"tf","q":"In ancient Egypt, people believed that a vein from the left fourth finger led to the heart.","ko":"고대 이집트에서, 사람들은 왼손의 네 번째 손가락의 정맥이 심장으로 이어진다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In ancient Egypt, people believed that a vein from the left fourth finger led directly to the heart.","고대 이집트에서, 사람들은 왼손의 네 번째 손가락의 정맥이 심장으로 곧장 이어진다고 믿었다."]],"w":"3번 문장에 people believed that a vein from the left fourth finger led directly to the heart가 있어요. 믿었다(believed)는 내용과 같아요.","c":"T"},"h":"87266e9c7d"},{"n":2,"t":"tf","q":"The ring finger tradition started with the right hand.","ko":"반지 손가락 전통은 오른손에서 시작되었다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"It started with the left hand!","그것은 왼손에서 시작되었다!"]],"w":"2번 문장에서 It started with the left hand!(그것은 왼손에서 시작되었다)라고 해요. 오른손이 아니라 왼손이에요.","c":"F"},"h":"881a9dc4a9"},{"n":3,"t":"tf","q":"Many married couples still wear their wedding rings on their fourth finger.","ko":"많은 결혼한 부부들이 여전히 그들의 네 번째 손가락에 결혼 반지를 낀다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Many married couples still wear their wedding rings on their fourth finger.","많은 결혼한 부부들이 여전히 그들의 네 번째 손가락에 결혼 반지를 낀다."]],"w":"9번 문장이 그대로 말해 줘요. still(여전히)이 쓰여서 지금도 낀다는 내용이에요.","c":"T"},"h":"7de338eb0e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In ancient Egypt, people believed that a vein led directly to the heart.)","ko":"고대 이집트에서, 사람들은 정맥이 심장으로 곧장 이어진다고 믿었다.","opts":["현대의","고대의","유명한","작은"],"word":"ancient","r":{"a":"2) 고대의","ev":"3번 문장","s":[[3,"In ancient Egypt, people believed that a vein from the left fourth finger led directly to the heart.","고대 이집트에서, 사람들은 왼손의 네 번째 손가락의 정맥이 심장으로 곧장 이어진다고 믿었다."]],"w":"'고대 이집트'는 아주 오래전의 이집트예요. ancient = 고대의. 뒤의 Egypt(이집트)와 함께 외우면 쉬워요.","c":2},"h":"3fc29ad99b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (a vein from the left fourth finger led directly to the heart)","ko":"왼손의 네 번째 손가락의 정맥이 심장으로 곧장 이어졌다.","opts":["천천히","가끔","곧장","거꾸로"],"word":"directly","r":{"a":"3) 곧장","ev":"3번 문장","s":[[3,"In ancient Egypt, people believed that a vein from the left fourth finger led directly to the heart.","고대 이집트에서, 사람들은 왼손의 네 번째 손가락의 정맥이 심장으로 곧장 이어진다고 믿었다."]],"w":"손가락에서 심장으로 돌아가지 않고 바로 이어진다는 뜻이에요. directly = 곧장, 똑바로.","c":3},"h":"2a09a8e515"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSo they started wearing a wedding ring on the left fourth finger.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그래서 그들은 왼손의 네 번째 손가락에 결혼 반지를 끼기 시작했다.","opts":["결혼한 부부들","정맥들","손가락들","고대 이집트 사람들"],"r":{"a":"4) 고대 이집트 사람들","ev":"3번, 5번 문장","s":[[3,"In ancient Egypt, people believed that a vein from the left fourth finger led directly to the heart.","고대 이집트에서, 사람들은 왼손의 네 번째 손가락의 정맥이 심장으로 곧장 이어진다고 믿었다."],[5,"So they started wearing a wedding ring on the left fourth finger.","그래서 그들은 왼손의 네 번째 손가락에 결혼 반지를 끼기 시작했다."]],"w":"3번에서 믿은 사람들은 고대 이집트의 사람들(people)이에요. 4번의 They도 같은 사람들이고, 그래서(So) 반지를 끼기 시작한 5번의 they도 같아요.","c":4},"h":"75fe15b750"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This gave the finger its name, the ring finger.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그 손가락에 반지 손가락이라는 이름을 주었다.","opts":["이 일로 그 손가락에 반지 손가락이라는 이름이 붙었다.","이 일 때문에 그 손가락은 이름을 잃었다.","이 손가락이 처음으로 반지를 만들었다.","이 일은 반지에게 손가락이라는 이름을 주었다."],"r":{"a":"1) 이 일로 그 손가락에 반지 손가락이라는 이름이 붙었다.","ev":"6번 문장","s":[[6,"This gave the finger its name, the ring finger.","이것은 그 손가락에 반지 손가락이라는 이름을 주었다."]],"w":"gave the finger its name은 '그 손가락에 이름을 주었다'이고, 그 이름이 the ring finger예요. 이름을 받은 쪽은 손가락이지 반지가 아니에요.","c":1},"h":"fa9c30c4fa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고대 이집트 사람들은 오른손에 결혼 반지를 꼈다.","의사들이 네 번째 손가락에서 심장으로 가는 정맥을 찾았다.","고대 이집트 사람들은 심장이 따뜻함과 사랑의 상징이라고 생각했다.","오늘날 결혼한 부부들은 네 번째 손가락에 결혼 반지를 거의 끼지 않는다."],"opts":["In ancient Egypt, people wore wedding rings on the right hand.","Doctors found a vein from the fourth finger to the heart.","The ancient Egyptians thought the heart was a symbol of warmth and love.","Few married couples wear wedding rings on the fourth finger now."],"r":{"a":"3) The ancient Egyptians thought the heart was a symbol of warmth and love.","ev":"4번, 5번, 7번, 9번 문장","s":[[4,"They thought the heart was a symbol of warmth and love, and these were important for a happy marriage.","그들은 심장이 따뜻함과 사랑의 상징이라고 생각했고, 이것들은 행복한 결혼생활을 위해 중요했다."],[5,"So they started wearing a wedding ring on the left fourth finger.","그래서 그들은 왼손의 네 번째 손가락에 결혼 반지를 끼기 시작했다."],[7,"Actually, there isn’t a vein like that.","사실, 그것과 같은(그런) 정맥은 없다."],[9,"Many married couples still wear their wedding rings on their fourth finger.","많은 결혼한 부부들이 여전히 그들의 네 번째 손가락에 결혼 반지를 낀다."]],"w":"4번에서 심장을 따뜻함과 사랑의 상징이라고 생각했다고 해요. 반지는 왼손(5번)이고, 그런 정맥은 없고(7번), 지금도 많은 부부들이 네 번째 손가락에 반지를 껴서(9번) 나머지는 달라요.","c":3},"h":"c42637eefa"},{"n":9,"t":"sum","q":"Ancient Egyptians believed a (A) from the left fourth finger led to the heart. Actually, such a vein (B) exist.","ko":"고대 이집트 사람들은 왼손의 네 번째 손가락에서 심장으로 (A)이/가 이어진다고 믿었다. 사실, 그런 정맥은 (B).","oko":["(A) 정맥 / (B) 존재한다","(A) 뼈 / (B) 존재하지 않는다","(A) 반지 / (B) 존재하지 않는다","(A) 뼈 / (B) 존재한다","(A) 정맥 / (B) 존재하지 않는다"],"opts":["(A) vein / (B) does","(A) bone / (B) does not","(A) ring / (B) does not","(A) bone / (B) does","(A) vein / (B) does not"],"r":{"a":"5) (A) vein / (B) does not","ev":"3번, 7번 문장","s":[[3,"In ancient Egypt, people believed that a vein from the left fourth finger led directly to the heart.","고대 이집트에서, 사람들은 왼손의 네 번째 손가락의 정맥이 심장으로 곧장 이어진다고 믿었다."],[7,"Actually, there isn’t a vein like that.","사실, 그것과 같은(그런) 정맥은 없다."]],"w":"3번에서 이집트 사람들이 믿은 것은 심장으로 이어지는 정맥(vein)이에요. 하지만 7번에서 사실 그런 정맥은 없다고 하므로 (B)는 does not이에요.","c":5},"h":"54d7e957b8"},{"n":10,"t":"fill","q":"The Egyptians thought the heart was a [A] of warmth and love, and the finger got its [B], the ring finger.","ko":"이집트 사람들은 심장이 따뜻함과 사랑의 [A]이라고 생각했고, 그 손가락은 반지 손가락이라는 [B]을 얻었다.","bank":["symbol","name","vein","marriage","tradition","hand"],"bko":{"symbol":"상징","name":"이름","vein":"정맥","marriage":"결혼","tradition":"전통","hand":"손"},"r":{"a":"[A] symbol, [B] name","ev":"4번, 6번 문장","s":[[4,"They thought the heart was a symbol of warmth and love, and these were important for a happy marriage.","그들은 심장이 따뜻함과 사랑의 상징이라고 생각했고, 이것들은 행복한 결혼생활을 위해 중요했다."],[6,"This gave the finger its name, the ring finger.","이것은 그 손가락에 반지 손가락이라는 이름을 주었다."]],"w":"4번 the heart was a symbol of warmth and love, 6번 This gave the finger its name에서 가져왔어요. tradition(전통)은 8번에 나오지만 '그 손가락이 얻은 것'은 이름이에요.","c":null},"h":"32eabc4c67"}]},{"u":7,"id":"hs1-07-3","no":3,"ko":"어라, 뭐가 뭐지?","items":[{"n":1,"t":"tf","q":"In one English town, there are two water towers.","ko":"영국의 한 마을에, 두 개의 급수탑이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In one English town, there are two water towers.","영국의 한 마을에, 두 개의 급수탑이 있다."]],"w":"1번 문장이 그대로 말해 줘요. 영국의 한 마을에 급수탑이 두 개(two water towers) 있어요.","c":"T"},"h":"309410649a"},{"n":2,"t":"tf","q":"Old people think the names should match the color of salt and pepper.","ko":"나이가 많은 사람들은 이름이 소금과 후추의 색깔과 일치해야 한다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"They say the names should match the color of salt and pepper.","그들은 이름이 소금과 후추의 색깔과 일치해야 한다고 말한다."],[7,"But old people think differently.","하지만 나이가 많은 사람들은 다르게 생각한다."]],"w":"이름이 소금과 후추의 색깔과 맞아야 한다고 말하는 쪽은 젊은 사람들(6번)이에요. 나이가 많은 사람들은 다르게 생각해요(7번).","c":"F"},"h":"b08242c642"},{"n":3,"t":"tf","q":"Old people think the shape of the brown tower is similar to a real salt pot from the old days.","ko":"나이가 많은 사람들은 갈색 탑의 모양이 옛날에 있었던 실제 소금통과 비슷하다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"They think the shape of the brown tower is similar to the shape of a real salt pot from the old days.","그들은 갈색 탑의 모양이 옛날에 있었던 실제 소금통의 모양과 비슷하다고 생각한다."]],"w":"8번 문장에서 나이가 많은 사람들이 갈색 탑의 모양이 옛날의 실제 소금통 모양과 비슷하다고 생각해요.","c":"T"},"h":"6d816818cf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Young people argue the white tower is the Salt Pot.)","ko":"젊은 사람들은 하얀 탑이 Salt Pot이라고 주장한다.","opts":["잊어버리다","거절하다","주장하다","준비하다"],"word":"argue","r":{"a":"3) 주장하다","ev":"5번 문장","s":[[5,"Young people argue the white tower is the Salt Pot and the brown tower is the Pepper Pot.","젊은 사람들은 하얀 탑이 Salt Pot이고 갈색 탑이 Pepper Pot이라고 주장한다."]],"w":"젊은 사람들이 '하얀 탑이 Salt Pot이다'라고 자기 생각을 내세우는 내용이에요. argue = 주장하다.","c":3},"h":"d2daf48e84"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They say the names should match the color of salt and pepper.)","ko":"그들은 이름이 소금과 후추의 색깔과 일치해야 한다고 말한다.","opts":["잊다","일치하다","던지다","세다"],"word":"match","r":{"a":"2) 일치하다","ev":"6번 문장","s":[[6,"They say the names should match the color of salt and pepper.","그들은 이름이 소금과 후추의 색깔과 일치해야 한다고 말한다."]],"w":"이름이 소금과 후추의 색깔과 맞아야 한다는 뜻이에요. match = 일치하다, 어울리다.","c":2},"h":"8cca97a38b"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSo they want to call it the Salt Pot.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그래서 그들은 그것을 Salt Pot이라고 부르고 싶어 한다.","opts":["갈색 탑","하얀 탑","소금","마을"],"r":{"a":"1) 갈색 탑","ev":"8~9번 문장","s":[[8,"They think the shape of the brown tower is similar to the shape of a real salt pot from the old days.","그들은 갈색 탑의 모양이 옛날에 있었던 실제 소금통의 모양과 비슷하다고 생각한다."],[9,"So they want to call it the Salt Pot.","그래서 그들은 그것을 Salt Pot이라고 부르고 싶어 한다."]],"w":"8번에서 나이가 많은 사람들이 모양이 옛날 소금통과 비슷하다고 한 것은 갈색 탑이에요. 그래서(So) 9번에서 그 탑을 Salt Pot이라고 부르고 싶어 해요.","c":1},"h":"b5631be10a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They say the names should match the color of salt and pepper.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 이름이 소금과 후추의 색깔과 일치해야 한다고 말한다.","opts":["그들은 소금과 후추를 탑 색깔로 칠해야 한다고 말한다.","그들은 이름이 소금과 후추의 맛과 같아야 한다고 말한다.","그들은 소금과 후추에게 새 이름을 줘야 한다고 말한다.","그들은 탑의 이름이 소금과 후추의 색깔에 맞아야 한다고 말한다."],"r":{"a":"4) 그들은 탑의 이름이 소금과 후추의 색깔에 맞아야 한다고 말한다.","ev":"6번 문장","s":[[6,"They say the names should match the color of salt and pepper.","그들은 이름이 소금과 후추의 색깔과 일치해야 한다고 말한다."]],"w":"the names should match the color of salt and pepper는 '이름이 소금과 후추의 색깔과 일치해야 한다'예요. 맛이나 칠하는 일 이야기는 아니에요.","c":4},"h":"b291649630"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마을에는 세 개의 급수탑이 있다.","마을 사람들은 탑의 이름에 모두 같은 생각이다.","젊은 사람들은 갈색 탑이 Salt Pot이라고 주장한다.","나이가 많은 사람들은 젊은 사람들과 다르게 생각한다."],"opts":["There are three water towers in the town.","All the people in the town agree about the names of the towers.","Young people argue that the brown tower is the Salt Pot.","Old people think differently from young people."],"r":{"a":"4) Old people think differently from young people.","ev":"1번, 4번, 5번, 7번 문장","s":[[1,"In one English town, there are two water towers.","영국의 한 마을에, 두 개의 급수탑이 있다."],[4,"People in the town cannot decide.","마을 사람들은 결정할 수 없다."],[5,"Young people argue the white tower is the Salt Pot and the brown tower is the Pepper Pot.","젊은 사람들은 하얀 탑이 Salt Pot이고 갈색 탑이 Pepper Pot이라고 주장한다."],[7,"But old people think differently.","하지만 나이가 많은 사람들은 다르게 생각한다."]],"w":"7번 But old people think differently가 그대로 맞아요. 탑은 두 개이고(1번), 사람들은 결정하지 못하며(4번), 젊은 사람들은 하얀 탑이 Salt Pot이라고 해요(5번).","c":4},"h":"328e858b6f"},{"n":9,"t":"sum","q":"Young people think the (A) tower is the Salt Pot, but old people think the (B) tower is the Salt Pot because of its shape.","ko":"젊은 사람들은 (A) 탑이 Salt Pot이라고 생각하지만, 나이가 많은 사람들은 모양 때문에 (B) 탑이 Salt Pot이라고 생각한다.","oko":["(A) 갈색 / (B) 하얀","(A) 갈색 / (B) 갈색","(A) 하얀 / (B) 하얀","(A) 검은 / (B) 갈색","(A) 하얀 / (B) 갈색"],"opts":["(A) brown / (B) white","(A) brown / (B) brown","(A) white / (B) white","(A) black / (B) brown","(A) white / (B) brown"],"r":{"a":"5) (A) white / (B) brown","ev":"5번, 8~9번 문장","s":[[5,"Young people argue the white tower is the Salt Pot and the brown tower is the Pepper Pot.","젊은 사람들은 하얀 탑이 Salt Pot이고 갈색 탑이 Pepper Pot이라고 주장한다."],[8,"They think the shape of the brown tower is similar to the shape of a real salt pot from the old days.","그들은 갈색 탑의 모양이 옛날에 있었던 실제 소금통의 모양과 비슷하다고 생각한다."],[9,"So they want to call it the Salt Pot.","그래서 그들은 그것을 Salt Pot이라고 부르고 싶어 한다."]],"w":"5번에서 젊은 사람들은 하얀 탑이 Salt Pot이라고 주장해요. 8~9번에서 나이가 많은 사람들은 모양이 옛날 소금통과 비슷한 갈색 탑을 Salt Pot이라고 부르고 싶어 해요.","c":5},"h":"6a9bfcdbef"},{"n":10,"t":"fill","q":"In one English town, there are two water [A], and people cannot [B] which one is the Salt Pot.","ko":"영국의 한 마을에는 두 개의 급수 [A]이/가 있고, 사람들은 어느 것이 Salt Pot인지 [B]할 수 없다.","bank":["towers","decide","shape","match","similar","join"],"bko":{"towers":"탑들","decide":"결정하다","shape":"모양","match":"일치하다","similar":"비슷한","join":"참여하다"},"r":{"a":"[A] towers, [B] decide","ev":"1번, 4번 문장","s":[[1,"In one English town, there are two water towers.","영국의 한 마을에, 두 개의 급수탑이 있다."],[4,"People in the town cannot decide.","마을 사람들은 결정할 수 없다."]],"w":"1번 there are two water towers, 4번 People in the town cannot decide에서 가져왔어요. shape(모양)는 8번에 나오지만 'cannot shape which one ~'은 말이 되지 않아요.","c":null},"h":"156a3b92a2"}]},{"u":8,"id":"hs1-08-1","no":1,"ko":"그냥 음식이 아니야~","items":[{"n":1,"t":"tf","q":"People in China give pistachios as gifts for the Lunar New Year.","ko":"중국 사람들은 구정에 선물로 피스타치오를 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"In China, people give pistachios as gifts for the Lunar New Year.","중국에서, 사람들은 구정에 선물로 피스타치오를 준다."]],"w":"4번 문장에 give pistachios as gifts for the Lunar New Year가 그대로 나와요. 구정에 선물로 준다는 내용과 일치해요.","c":"T"},"h":"c53e5edfcc"},{"n":2,"t":"tf","q":"Chinese people call the pistachio the “sad nut.”","ko":"중국 사람들은 피스타치오를 ‘슬픈 견과’라고 부른다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"So Chinese people call the pistachio the “happy nut.”","그래서 중국 사람들은 피스타치오를 ‘행복한 견과’라고 부른다."]],"w":"7번 문장에서 중국 사람들은 피스타치오를 ‘happy nut(행복한 견과)’이라고 불러요. 슬픈 견과가 아니에요.","c":"F"},"h":"4857f469a3"},{"n":3,"t":"tf","q":"Couples in the Middle East wait for the cracking sound of a pistachio.","ko":"중동의 커플들은 피스타치오의 갈라지는 소리를 기다린다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"They wait for the cracking sound of a pistachio.","그들은 피스타치오의 갈라지는 소리를 기다린다."]],"w":"10번 문장 They wait for the cracking sound of a pistachio에서 They는 중동의 커플들이에요. 소리를 기다린다는 내용과 일치해요.","c":"T"},"h":"8e30f5080e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The shell of a pistachio is slightly open.)","ko":"피스타치오의 껍질은 약간 열려 있다. (slightly는 약간)","opts":["완전히","약간","전혀","갑자기"],"word":"slightly","r":{"a":"2) 약간","ev":"5번 문장","s":[[5,"The shell of a pistachio is slightly open.","피스타치오의 껍질은 약간 열려 있다."]],"w":"껍질이 약간 열려 있어서 웃는 것처럼 보인다고 6번에서 이어져요. 완전히 열렸다면 웃는 모습이 아니에요. slightly = 약간.","c":2},"h":"1f2d116267"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They believe it will bring function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
