 pocket, so you reach in and take it out.","당신의 전화기가 주머니에서 진동하고 있어서 당신은 손을 뻗어 그것을 꺼낸다."],[2,"However, the screen shows no phone calls, no messages, and no notifications.","그러나, 그 화면은 어떤 전화, 문자 메시지, 그리고 알림도 보여주지 않는다."]],"w":"1번에서 진동이 와서 전화기를 꺼냈는데, 2번에서 화면에는 전화·문자와 함께 notifications가 없었어요. 전화기가 보내 주는 '알림'이에요.","c":4},"h":"e5809f5c05"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nScientists aren’t sure why it happens.","ko":"밑줄 친 it이 가리키는 것은?","sko":"과학자들은 왜 그런 일이 일어나는지 확신하지 못한다.","opts":["과학자들의 실험","유령 진동 증후군","주머니 속 전화기","화면의 알림"],"r":{"a":"2) 유령 진동 증후군","ev":"5~6번 문장","s":[[5,"Phantom vibration syndrome is a kind of illusion that fools the brain and body.","유령 진동 증후군은 뇌와 몸을 속이는 일종의 착각이다."],[6,"Scientists aren’t sure why it happens.","과학자들은 왜 그런 일이 일어나는지 확신하지 못한다."]],"w":"6번의 it happens는 '그런 일이 일어나다'예요. 바로 앞 5번에서 설명한 유령 진동 증후군을 가리켜요.","c":2},"h":"ac6281d003"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If this is happening to you, maybe you are worrying about your phone too much.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 당신에게 이런 일이 일어난다면, 아마도 당신이 당신의 전화기에 대해 너무 많이 걱정하고 있는 것이다.","opts":["이런 일이 일어난다면 당신의 전화기가 고장 난 것이다.","이런 일이 일어난다면 당신은 전화기에 신경을 너무 적게 쓰는 것이다.","이런 일이 일어난다면 아마도 당신이 전화기를 너무 많이 걱정하는 것이다.","이런 일이 일어난다면 전화기가 당신을 걱정하는 것이다."],"r":{"a":"3) 이런 일이 일어난다면 아마도 당신이 전화기를 너무 많이 걱정하는 것이다.","ev":"12번 문장","s":[[12,"If this is happening to you, maybe you are worrying about your phone too much.","만약 당신에게 이런 일이 일어난다면, 아마도 당신이 당신의 전화기에 대해 너무 많이 걱정하고 있는 것이다."]],"w":"worry about은 '~에 대해 걱정하다', too much는 '너무 많이'예요. 전화기를 너무 걱정하고 있는 것일지도 모른다는 뜻이에요. 전화기가 고장 났다는 말은 없어요.","c":3},"h":"3c0226f802"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["화면에 알림이 없으면 전화기는 절대 진동하지 않는다.","전화기에 알림이 없는데도 진동을 느낄 수 있다.","진동은 전화기가 고장 났을 때만 느낄 수 있다.","과학자들은 진동의 이유를 이미 정확히 밝혀냈다."],"opts":["A phone never vibrates when the screen shows no notifications.","People can feel a vibration even when the phone has no notifications.","People feel a vibration only when the phone is broken.","Scientists have found the exact reason for the vibration."],"r":{"a":"2) People can feel a vibration even when the phone has no notifications.","ev":"1~2, 6번 문장","s":[[1,"Your phone is vibrating in your pocket, so you reach in and take it out.","당신의 전화기가 주머니에서 진동하고 있어서 당신은 손을 뻗어 그것을 꺼낸다."],[2,"However, the screen shows no phone calls, no messages, and no notifications.","그러나, 그 화면은 어떤 전화, 문자 메시지, 그리고 알림도 보여주지 않는다."],[6,"Scientists aren’t sure why it happens.","과학자들은 왜 그런 일이 일어나는지 확신하지 못한다."]],"w":"1~2번에서 전화기가 진동하는 것 같아 꺼내 보았지만 화면에는 아무 알림도 없었어요. 그래서 알림이 없어도 진동을 느낄 수 있다는 내용이 맞아요. 이유는 과학자들도 확신하지 못해요(6번).","c":2},"h":"6abec9f0f2"},{"n":9,"t":"sum","q":"Some people check their phone too often because they feel they must always (A) to others, so their brain starts making (B).","ko":"어떤 사람들은 항상 다른 사람들에게 (A)해야 한다고 느껴서 전화기를 너무 자주 확인하고, 그래서 뇌가 (B)를 하기 시작한다.","oko":["(A) 무시하다 / (B) 실수","(A) 응답하다 / (B) 노래","(A) 숨기다 / (B) 시험","(A) 무시하다 / (B) 노래","(A) 응답하다 / (B) 실수"],"opts":["(A) ignore / (B) mistakes","(A) respond / (B) songs","(A) hide / (B) tests","(A) ignore / (B) songs","(A) respond / (B) mistakes"],"r":{"a":"5) (A) respond / (B) mistakes","ev":"8~10번 문장","s":[[8,"Some people check their phone too often because they don’t want to miss a text message or a call.","어떤 사람들은 문자 메시지나 전화를 놓치는 것을 원하지 않기 때문에 그들의 전화기를 너무 자주 확인한다."],[9,"They feel that they must always respond to others.","그들은 그들이 항상 다른 사람들에게 응답해야 한다고 느낀다."],[10,"So their brain starts making mistakes.","그래서 그들의 뇌는 실수를 하기 시작한다."]],"w":"9번에서 항상 다른 사람들에게 응답해야(respond) 한다고 느끼고, 10번에서 그래서 뇌가 실수(mistakes)를 하기 시작해요.","c":5},"h":"a1537a3133"},{"n":10,"t":"fill","q":"When their clothes [A] against their skin, their [B] thinks it is a vibration.","ko":"옷이 피부에 닿아 [A]할 때, 그들의 [B]는 그것을 진동이라고 생각한다.","bank":["move","brain","clothes","mistakes","excessive","notifications"],"bko":{"move":"움직이다","brain":"뇌","clothes":"옷","mistakes":"실수들","excessive":"과도한","notifications":"알림들"},"r":{"a":"[A] move, [B] brain","ev":"11번 문장","s":[[11,"When their clothes move against their skin, their brain thinks it’s a vibration.","옷이 그들의 피부 가까이에서 움직일 때, 그들의 뇌는 그것을 진동이라고 생각한다."]],"w":"11번 문장 When their clothes move against their skin, their brain thinks it's a vibration에서 가져왔어요. 진동이라고 생각하는 것은 옷이나 알림이 아니라 뇌예요.","c":null},"h":"3fa112b730"}]},{"u":3,"id":"rj3-03-2","no":2,"ko":"감자의 활약","items":[{"n":1,"t":"tf","q":"Potatoes are used to make ink, medicine, and beauty products.","ko":"감자는 잉크, 약, 미용 제품을 만드는 데 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Potatoes are used to make ink, medicine, and beauty products, as well as food.","감자는 음식뿐만 아니라 잉크와 약, 미용 제품을 만드는 데도 사용된다."]],"w":"1번 문장에서 감자는 음식뿐만 아니라 잉크와 약, 미용 제품을 만드는 데도 사용된다고 해요.","c":"T"},"h":"3582a0bc70"},{"n":2,"t":"tf","q":"The Wi-Fi signal on airplanes has always been very strong.","ko":"비행기의 와이파이 신호는 항상 매우 강했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"However, this signal was not always very strong.","하지만, 이 신호가 항상 매우 강한 것은 아니었다."]],"w":"4번 문장에서 이 신호가 항상 매우 강한 것은 아니었다(was not always very strong)고 해요.","c":"F"},"h":"445990c761"},{"n":3,"t":"tf","q":"The engineers filled the seats of their plane with bags of potatoes.","ko":"기술자들은 그들의 비행기 좌석을 감자 자루들로 채웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"So, the engineers decided to fill the seats of their plane with bags of potatoes.","그래서, 그 기술자들은 그들의 비행기 좌석을 감자 자루들로 채우기로 결정했다."]],"w":"11번 문장에서 기술자들이 비행기 좌석을 감자 자루들로 채우기로 결정했다고 해요.","c":"T"},"h":"abb5a3e811"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...because the human body absorbs and reflects Wi-Fi signals.)","ko":"...인체가 와이파이 신호를 ( )하고 반사하기 때문에...","opts":["만들다","보내다","흡수하다","저장하다"],"word":"absorbs","r":{"a":"3) 흡수하다","ev":"6번 문장","s":[[6,"They needed a plane full of passengers for several weeks because the human body absorbs and reflects Wi-Fi signals.","인체가 와이파이 신호를 흡수하고 반사하기 때문에 그들은 승객으로 가득한 비행기 한 대가 몇 주 동안 필요했다."]],"w":"6번에서 사람의 몸은 와이파이 신호를 absorb하고 reflect(반사하다)한다고 해요. 신호를 받아들여 빨아들이는 '흡수하다'예요.","c":3},"h":"0ae998c050"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Thanks to those patient potatoes, the engineers discovered ways...)","ko":"그 ( ) 감자들 덕분에, 기술자들은 방법을 발견했다.","opts":["참을성 있는","환자인","화가 난","무거운"],"word":"patient","r":{"a":"1) 참을성 있는","ev":"7~8번, 12번 문장","s":[[7,"Of course, people can’t sit on a plane that long.","물론, 사람들은 그렇게 오랫동안 비행기에 앉아 있을 수 없다."],[8,"But potatoes can!","하지만 감자는 할 수 있다!"],[12,"Thanks to those patient potatoes, the engineers discovered ways to provide stronger Wi-Fi signals.","그 참을성 있는 감자들 덕분에, 기술자들은 더 강한 와이파이 신호를 제공하는 방법을 발견했다."]],"w":"감자는 사람처럼 오랫동안 앉아 있을 수 있었어요(7~8번). 그래서 12번에서 patient potatoes는 '참을성 있는 감자들'이에요. 병원의 '환자'라는 뜻이 아니에요.","c":1},"h":"985e431cc2"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nTherefore, they affect Wi-Fi signals in the same way as a human passenger.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그러므로, 그것들은 사람 승객과 같은 방식으로 와이파이 신호에 영향을 미친다.","opts":["기술자들","승객들","항공사들","감자들"],"r":{"a":"4) 감자들","ev":"9~10번 문장","s":[[9,"Potatoes contain water and minerals in amounts that are similar to those of the human body.","감자는 인체의 것들과 비슷한 양의 수분과 무기질을 포함한다."],[10,"Therefore, they affect Wi-Fi signals in the same way as a human passenger.","그러므로, 그것들은 사람 승객과 같은 방식으로 와이파이 신호에 영향을 미친다."]],"w":"10번의 they는 바로 앞 9번에서 수분과 무기질을 포함한다고 한 감자들(Potatoes)이에요. 사람 승객과 '같은 방식'이라고 했으니 승객이나 기술자가 아니에요.","c":4},"h":"30d3a11940"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Potatoes contain water and minerals in amounts that are similar to those of the human body.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"감자는 인체의 것들과 비슷한 양의 수분과 무기질을 포함한다.","opts":["감자는 인체보다 훨씬 많은 수분과 무기질을 포함한다.","감자에는 사람 몸과 비슷한 양의 수분과 무기질이 들어 있다.","사람의 몸은 감자에서 수분과 무기질을 얻는다.","감자는 수분과 무기질 없이도 자란다."],"r":{"a":"2) 감자에는 사람 몸과 비슷한 양의 수분과 무기질이 들어 있다.","ev":"9번 문장","s":[[9,"Potatoes contain water and minerals in amounts that are similar to those of the human body.","감자는 인체의 것들과 비슷한 양의 수분과 무기질을 포함한다."]],"w":"contain은 '포함하다', similar to는 '~와 비슷한'이에요. those는 water and minerals in amounts를 가리켜서, 사람 몸과 비슷한 양이라는 뜻이에요.","c":2},"h":"cf1671eac4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["비행기의 와이파이 신호는 언제나 매우 강했다.","감자는 음식으로만 사용될 수 있다.","기술자들은 비행기 와이파이를 개선하려고 실험하기로 했다.","기술자들은 몇 주 동안 실제 승객들로 신호를 실험했다."],"opts":["The Wi-Fi signal on airplanes was always very strong.","Potatoes can be used only as food.","The engineers decided to run tests to improve airplane Wi-Fi.","The engineers tested the signal with real passengers for several weeks."],"r":{"a":"3) The engineers decided to run tests to improve airplane Wi-Fi.","ev":"4~5번, 7번 문장","s":[[4,"However, this signal was not always very strong.","하지만, 이 신호가 항상 매우 강한 것은 아니었다."],[5,"To improve this technology, engineers decided to run some tests.","이 기술을 개선하기 위해, 기술자들이 몇 가지 실험을 하기로 결정했다."],[7,"Of course, people can’t sit on a plane that long.","물론, 사람들은 그렇게 오랫동안 비행기에 앉아 있을 수 없다."]],"w":"5번에서 기술자들은 이 기술을 개선하기 위해 실험하기로 결정했어요. 신호는 항상 강한 것은 아니었고(4번), 사람은 오래 앉을 수 없어서(7번) 실제 승객 대신 감자를 썼어요.","c":3},"h":"cc1dca790f"},{"n":9,"t":"sum","q":"The engineers used potatoes because they contain (A) and minerals like the human body and affect Wi-Fi (B) in the same way.","ko":"기술자들은 감자가 인체처럼 (A)와 무기질을 포함하고 와이파이 (B)에 같은 방식으로 영향을 주기 때문에 감자를 사용했다.","oko":["(A) 기름 / (B) 음식","(A) 소금 / (B) 좌석","(A) 설탕 / (B) 실험","(A) 기름 / (B) 신호","(A) 수분 / (B) 신호"],"opts":["(A) oil / (B) food","(A) salt / (B) seats","(A) sugar / (B) tests","(A) oil / (B) signals","(A) water / (B) signals"],"r":{"a":"5) (A) water / (B) signals","ev":"9~10번 문장","s":[[9,"Potatoes contain water and minerals in amounts that are similar to those of the human body.","감자는 인체의 것들과 비슷한 양의 수분과 무기질을 포함한다."],[10,"Therefore, they affect Wi-Fi signals in the same way as a human passenger.","그러므로, 그것들은 사람 승객과 같은 방식으로 와이파이 신호에 영향을 미친다."]],"w":"9번에서 감자는 water(수분)와 무기질을 포함하고, 10번에서 사람 승객과 같은 방식으로 Wi-Fi signals(신호)에 영향을 줘요.","c":5},"h":"22bdd386a0"},{"n":10,"t":"fill","q":"Thanks to the potatoes, the engineers [A] ways to provide [B] Wi-Fi signals.","ko":"감자 덕분에, 기술자들은 [B] 와이파이 신호를 제공하는 방법을 [A]했다.","bank":["discovered","stronger","weaker","mineral","absorbed","passengers"],"bko":{"discovered":"발견했다","stronger":"더 강한","weaker":"더 약한","mineral":"무기질","absorbed":"흡수했다","passengers":"승객들"},"r":{"a":"[A] discovered, [B] stronger","ev":"12번 문장","s":[[12,"Thanks to those patient potatoes, the engineers discovered ways to provide stronger Wi-Fi signals.","그 참을성 있는 감자들 덕분에, 기술자들은 더 강한 와이파이 신호를 제공하는 방법을 발견했다."]],"w":"12번 문장 Thanks to those patient potatoes, the engineers discovered ways to provide stronger Wi-Fi signals에서 가져왔어요. 실험은 신호를 개선하려는 것이었으니(5번) '더 강한'이 맞고 '더 약한'은 반대예요.","c":null},"h":"c5130cf359"}]},{"u":3,"id":"rj3-03-3","no":3,"ko":"공중의 저 공은 뭐지?","items":[{"n":1,"t":"tf","q":"Colorful balls on power lines are called marker balls.","ko":"송전선에 있는 알록달록한 공들은 표시구라고 불린다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They are known as “marker balls.”","그것들은 ‘표시구’로 알려져 있다."]],"w":"3번 문장에서 They are known as “marker balls.”라고 해요. 알록달록한 공들을 표시구라고 부른다는 내용과 일치해요.","c":"T"},"h":"baa42cb6f2"},{"n":2,"t":"tf","q":"Marker balls are only used in the mountains.","ko":"표시구는 산에서만 사용된다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"You may have noticed them over highways, in the mountains, near airports, or across rivers and valleys.","당신은 고속도로 위, 산속, 공항 근처, 혹은 강과 계곡을 가로지르는 그것들을 보았을지도 모른다."]],"w":"2번 문장에서 고속도로 위, 산속, 공항 근처, 강과 계곡 위 등 여러 곳에서 볼 수 있다고 해요. 산에서만이라는 말은 틀려요.","c":"F"},"h":"cb3b9491e3"},{"n":3,"t":"tf","q":"Orange and white are the colors used most often for marker balls.","ko":"주황색과 흰색은 표시구에 가장 자주 사용되는 색이다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"The most frequently used colors are orange and white, as they stand out the most.","가장 자주 사용되는 색은 주황색과 흰색인데, 이것들이 가장 눈에 잘 띄기 때문이다."]],"w":"9번 문장에서 가장 자주 사용되는 색은 주황색과 흰색이라고 해요. 눈에 가장 잘 띄기 때문이에요.","c":"T"},"h":"927a47ecff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Without them, the lines are nearly invisible.)","ko":"그것들이 없으면, 전선들은 거의 ( ).","opts":["눈에 띄는","보이지 않는","아름다운","위험한"],"word":"invisible","r":{"a":"2) 보이지 않는","ev":"5번 문장","s":[[5,"Without them, the lines are nearly invisible.","그것들이 없으면, 전선들은 거의 보이지 않는다."]],"w":"5번에서 표시구가 없으면 전선은 nearly invisible해요. 그래서 6번에서 비행기에게 문제가 된다고 해요. 눈에 보이지 않는다는 뜻이에요.","c":2},"h":"f3d01df8cd"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Even birds can run into power lines because they are so hard to spot.)","ko":"새들도 송전선을 ( )하기가 너무 어렵기 때문에 그것들에 부딪칠 수 있다.","opts":["발견하다","만들다","칠하다","치우다"],"word":"spot","r":{"a":"1) 발견하다","ev":"7번 문장","s":[[7,"Even birds can run into power lines because they are so hard to spot.","새들도 송전선을 발견하기가 너무 어렵기 때문에 그것들에 부딪칠 수 있다."]],"w":"새들이 전선에 부딪치는 이유가 so hard to spot이에요. 전선이 잘 눈에 들어오지 않아서 '발견하기' 어렵다는 뜻이에요. 4번에서도 조종사가 전선을 spot하도록 돕는다고 했어요.","c":1},"h":"e9b521d11f"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is a problem for low-flying planes and helicopters.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 저공비행을 하는 비행기와 헬리콥터에 문제가 된다.","opts":["공들이 알록달록한 것","공들이 비어 있는 것","헬리콥터가 낮게 나는 것","표시구 없이는 전선이 거의 보이지 않는 것"],"r":{"a":"4) 표시구 없이는 전선이 거의 보이지 않는 것","ev":"5~6번 문장","s":[[5,"Without them, the lines are nearly invisible.","그것들이 없으면, 전선들은 거의 보이지 않는다."],[6,"This is a problem for low-flying planes and helicopters.","이것은 저공비행을 하는 비행기와 헬리콥터에 문제가 된다."]],"w":"6번의 This는 바로 앞 5번 내용을 받아요. 표시구가 없으면 전선이 거의 보이지 않는다는 것이 낮게 나는 비행기와 헬리콥터에게 문제예요.","c":4},"h":"f7f382943a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, if the colors don’t stand out from the landscape, other colors may be used instead.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 만약 그 색들이 풍경에서 눈에 띄지 않는다면, 대신 다른 색들이 사용될 수도 있다.","opts":["풍경에서 눈에 띄는 색은 절대 쓰이지 않는다.","풍경이 눈에 띄지 않으면 공은 쓰이지 않는다.","그 색들이 풍경에서 눈에 띄지 않으면 다른 색들이 대신 쓰일 수도 있다.","다른 색들이 항상 주황색과 흰색보다 먼저 쓰인다."],"r":{"a":"3) 그 색들이 풍경에서 눈에 띄지 않으면 다른 색들이 대신 쓰일 수도 있다.","ev":"10번 문장","s":[[10,"However, if the colors don’t stand out from the landscape, other colors may be used instead.","하지만 만약 그 색들이 풍경에서 눈에 띄지 않는다면, 대신 다른 색들이 사용될 수도 있다."]],"w":"stand out은 '눈에 띄다', instead는 '대신에'예요. 주황색과 흰색이 풍경 속에서 눈에 안 띄면 다른 색을 대신 쓸 수 있다는 뜻이에요.","c":3},"h":"83a3c91ca7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["조종사들은 표시구 없이도 전선을 쉽게 볼 수 있다.","표시구는 가능한 한 무거워야 한다.","저공비행 헬리콥터만 전선을 찾기 어려워한다.","표시구는 조종사가 전선에 부딪치는 것을 피하도록 돕는다."],"opts":["Pilots can see power lines easily without marker balls.","Marker balls need to be as heavy as possible.","Only helicopters have trouble spotting power lines.","Marker balls help pilots avoid hitting power lines."],"r":{"a":"4) Marker balls help pilots avoid hitting power lines.","ev":"4~5번 문장","s":[[4,"The purpose of the balls is to help pilots spot the power lines and avoid hitting them.","그 공들의 목적은 조종사들이 송전선을 발견하고 그것들과 부딪치는 것을 피하도록 돕는 것이다."],[5,"Without them, the lines are nearly invisible.","그것들이 없으면, 전선들은 거의 보이지 않는다."]],"w":"4번에서 표시구의 역할은 조종사가 송전선을 발견하고 부딪치는 것을 피하게 돕는 것이에요. 표시구가 없으면 전선이 거의 보이지 않고(5번), 새들도 부딪칠 수 있으며(7번), 공은 가볍게 만든다(13번).","c":4},"h":"9cf961b8e9"},{"n":9,"t":"sum","q":"The marker balls are (A) inside because they need to be as (B) as possible.","ko":"표시구는 가능한 한 (B)해야 하기 때문에 안이 (A) 있다.","oko":["(A) 가득 차 / (B) 무거워","(A) 비어 / (B) 무거워","(A) 가득 차 / (B) 가벼워","(A) 비어 / (B) 밝아","(A) 비어 / (B) 가벼워"],"opts":["(A) full / (B) heavy","(A) empty / (B) heavy","(A) full / (B) light","(A) empty / (B) bright","(A) empty / (B) light"],"r":{"a":"5) (A) empty / (B) light","ev":"12~13번 문장","s":[[12,"Actually, they are empty!","사실 그것들은 비어 있다!"],[13,"That’s because they need to be as light as possible.","그것들은 가능한 한 가벼워야 하기 때문이다."]],"w":"12번에서 공은 비어(empty) 있고, 13번에서 그 이유는 가능한 한 가벼워야(light) 하기 때문이라고 해요.","c":5},"h":"78108c709b"},{"n":10,"t":"fill","q":"The most [A] used colors are orange and white, but other colors may be used if they don’t stand out from the [B].","ko":"가장 [A] 사용되는 색은 주황색과 흰색이지만, 풍경 [B]에서 눈에 띄지 않으면 다른 색이 사용될 수도 있다.","bank":["frequently","landscape","frequent","invisible","attached","nearly"],"bko":{"frequently":"자주","landscape":"풍경","frequent":"잦은","invisible":"보이지 않는","attached":"붙어 있는","nearly":"거의"},"r":{"a":"[A] frequently, [B] landscape","ev":"9~10번 문장","s":[[9,"The most frequently used colors are orange and white, as they stand out the most.","가장 자주 사용되는 색은 주황색과 흰색인데, 이것들이 가장 눈에 잘 띄기 때문이다."],[10,"However, if the colors don’t stand out from the landscape, other colors may be used instead.","하지만 만약 그 색들이 풍경에서 눈에 띄지 않는다면, 대신 다른 색들이 사용될 수도 있다."]],"w":"9번 The most frequently used colors are orange and white와 10번 if the colors don't stand out from the landscape에서 가져왔어요. 눈에 띄어야 하는 대상은 풍경이에요.","c":null},"h":"84562555fc"}]},{"u":3,"id":"rj3-03-4","no":4,"ko":"아름다운 파란 일몰","items":[{"n":1,"t":"tf","q":"Earth and Mars share the same sun.","ko":"지구와 화성은 같은 태양을 공유한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Although Earth and Mars are different planets, they share the same sun.","비록 지구와 화성은 다른 행성이지만, 그들은 같은 태양을 공유한다."]],"w":"3번 문장에서 지구와 화성이 다른 행성이지만 같은 태양을 공유한다(they share the same sun)고 해요.","c":"T"},"h":"702fbe439a"},{"n":2,"t":"tf","q":"Sunsets on Mars look red and orange.","ko":"화성의 일몰은 빨간색과 주황색으로 보인다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"But sunsets on Mars look very different —they are blue.","하지만 화성의 일몰은 매우 다르게 보인다. 그것은 파란색이다."]],"w":"2번 문장에서 화성의 일몰은 아주 다르게 보이며 파란색이라고 해요. 빨간색과 주황색은 지구의 일몰이에요(1번).","c":"F"},"h":"6f9b68dc0d"},{"n":3,"t":"tf","q":"On Earth, the particles in the air are small.","ko":"지구에서는 공기 중의 입자가 작다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"On Earth, the particles in the air are small.","지구에서는 공기 중의 입자가 작다."]],"w":"9번 문장에 On Earth, the particles in the air are small이 그대로 있어요.","c":"T"},"h":"e94f978daa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Although Earth and Mars are different planets, they share the same sun.)","ko":"비록 지구와 화성은 다른 행성이지만, 그들은 같은 태양을 ( ).","opts":["가린다","떠난다","공유한다","잃는다"],"word":"share","r":{"a":"3) 공유한다","ev":"3번 문장","s":[[3,"Although Earth and Mars are different planets, they share the same sun.","비록 지구와 화성은 다른 행성이지만, 그들은 같은 태양을 공유한다."]],"w":"3번에서 지구와 화성은 서로 다른 행성이지만 하나의 같은 태양을 함께 가져요. share는 '공유하다'예요.","c":3},"h":"3d85e4ee98"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (By the time the light reaches our eyes, blue light is spread everywhere...)","ko":"빛이 우리 눈에 ( ) 무렵에는 푸른 빛은 사방으로 퍼진다.","opts":["떠날","도달할","가릴","만들"],"word":"reaches","r":{"a":"2) 도달할","ev":"6, 10번 문장","s":[[6,"When light travels from the sun to our eyes, it passes through the air in the atmosphere.","빛이 태양에서 우리 눈까지 이동할 때, 이것은 대기 중의 공기를 통과한다."],[10,"By the time the light reaches our eyes, blue light is spread everywhere, and only red light is left.","빛이 우리 눈에 도달할 무렵에는 푸른 빛은 사방으로 퍼지고 붉은 빛만 남겨진다."]],"w":"6번에서 빛은 태양에서 우리 눈까지 이동해요. 10번의 reaches our eyes는 그 빛이 눈에 '도달하다'라는 뜻이에요.","c":2},"h":"e2a8e824bb"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen light travels from the sun to our eyes, it passes through the air in the atmosphere.","ko":"밑줄 친 it이 가리키는 것은?","sko":"빛이 태양에서 우리 눈까지 이동할 때, 이것은 대기 중의 공기를 통과한다.","opts":["태양","우리 눈","대기","빛"],"r":{"a":"4) 빛","ev":"6번 문장","s":[[6,"When light travels from the sun to our eyes, it passes through the air in the atmosphere.","빛이 태양에서 우리 눈까지 이동할 때, 이것은 대기 중의 공기를 통과한다."]],"w":"공기를 통과하는 것은 태양 자체가 아니라 태양에서 우리 눈까지 이동하는 빛(light)이에요. it은 앞의 light를 받아요.","c":4},"h":"6440136a9e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By the time the light reaches our eyes, blue light is spread everywhere, and only red light is left.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"빛이 우리 눈에 도달할 무렵에는 푸른 빛은 사방으로 퍼지고 붉은 빛만 남겨진다.","opts":["빛이 우리 눈에 도달할 무렵에는 푸른 빛은 사방으로 퍼지고 붉은 빛만 남는다.","빛이 우리 눈에 도달하면 붉은 빛은 사방으로 퍼지고 푸른 빛만 남는다.","빛이 우리 눈에 닿기 전에 모든 색의 빛이 사라진다.","푸른 빛과 붉은 빛이 모두 그대로 우리 눈에 도달한다."],"r":{"a":"1) 빛이 우리 눈에 도달할 무렵에는 푸른 빛은 사방으로 퍼지고 붉은 빛만 남는다.","ev":"10번 문장","s":[[10,"By the time the light reaches our eyes, blue light is spread everywhere, and only red light is left.","빛이 우리 눈에 도달할 무렵에는 푸른 빛은 사방으로 퍼지고 붉은 빛만 남겨진다."]],"w":"blue light is spread everywhere는 푸른 빛이 사방으로 퍼져 버렸다는 말이고, only red light is left는 붉은 빛만 남았다는 말이에요. 붉은 빛과 푸른 빛이 바뀐 선지가 헷갈리는 함정이에요.","c":1},"h":"ac97b092c2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["일몰 색이 다른 이유는 두 행성이 서로 다른 태양을 가지고 있기 때문이다.","일몰 색의 차이는 대기에서 비롯된다.","화성의 일몰은 지구처럼 빨간색과 주황색이다.","지구에서 빛은 공기를 통과하지 않고 눈에 도달한다."],"opts":["The sunset colors are different because the two planets have different suns.","The difference in sunset colors comes from the atmospheres.","Sunsets on Mars are red and orange like those on Earth.","On Earth, light reaches our eyes without passing through the air."],"r":{"a":"2) The difference in sunset colors comes from the atmospheres.","ev":"3, 5~6번 문장","s":[[3,"Although Earth and Mars are different planets, they share the same sun.","비록 지구와 화성은 다른 행성이지만, 그들은 같은 태양을 공유한다."],[5,"The answer lies in their atmospheres.","정답은 그것들의 대기에 있다."],[6,"When light travels from the sun to our eyes, it passes through the air in the atmosphere.","빛이 태양에서 우리 눈까지 이동할 때, 이것은 대기 중의 공기를 통과한다."]],"w":"5번에서 정답은 두 행성의 대기에 있다고 해요. 두 행성은 같은 태양을 공유하고(3번), 빛은 대기 중의 공기를 통과해요(6번).","c":2},"h":"89752955ff"},{"n":9,"t":"sum","q":"On Earth, (A) particles in the air make blue light spread out, so only (B) light is left.","ko":"지구에서는 공기 중의 (A) 입자가 푸른 빛을 퍼지게 해서 (B) 빛만 남는다.","oko":["(A) 큰 / (B) 푸른","(A) 큰 / (B) 붉은","(A) 작은 / (B) 푸른","(A) 무거운 / (B) 초록","(A) 작은 / (B) 붉은"],"opts":["(A) big / (B) blue","(A) big / (B) red","(A) small / (B) blue","(A) heavy / (B) green","(A) small / (B) red"],"r":{"a":"5) (A) small / (B) red","ev":"8~10번 문장","s":[[8,"Tiny particles make blue light spread out, while bigger particles make red light spread out.","작은 입자는 푸른 빛을 퍼지게 하고, 반면에 큰 입자는 붉은 빛을 퍼지게 한다."],[9,"On Earth, the particles in the air are small.","지구에서는 공기 중의 입자가 작다."],[10,"By the time the light reaches our eyes, blue light is spread everywhere, and only red light is left.","빛이 우리 눈에 도달할 무렵에는 푸른 빛은 사방으로 퍼지고 붉은 빛만 남겨진다."]],"w":"9번에서 지구의 입자는 작고(small), 8번에서 작은 입자는 푸른 빛을 퍼지게 해요. 그래서 10번에서 붉은 빛(red)만 남아요.","c":5},"h":"106ae6a55e"},{"n":10,"t":"fill","q":"Mars has [A] dust particles, so these bigger particles make [B] light spread out and only blue light can be seen.","ko":"화성은 [A] 먼지 입자가 있어서 이 더 큰 입자들이 [B] 빛을 퍼지게 하고 푸른 빛만 볼 수 있다.","bank":["larger","red","tiny","atmosphere","spread","everywhere"],"bko":{"larger":"더 큰","red":"붉은","tiny":"아주 작은","atmosphere":"대기","spread":"퍼지다","everywhere":"사방에"},"r":{"a":"[A] larger, [B] red","ev":"12~13번 문장","s":[[12,"It’s filled with larger dust particles.","그것은 더 큰 먼지 입자로 가득 차 있다."],[13,"These bigger particles make red light spread out, so only blue light can be seen during a sunset.","이 더 큰 입자들은 붉은 빛을 퍼지게 만들고, 그래서 일몰 시에는 푸른 빛만 볼 수 있다."]],"w":"12번 It's filled with larger dust particles와 13번 These bigger particles make red light spread out에서 가져왔어요. 13번에서 '푸른 빛만 보인다'고 했으니 퍼지게 하는 것은 푸른 빛이 아니라 붉은 빛이에요.","c":null},"h":"d3cf2f09db"}]},{"u":4,"id":"rj3-04-1","no":1,"ko":"마네킹 대신에 사람을!","items":[{"n":1,"t":"tf","q":"In the past, clothes were displayed only on mannequins.","ko":"과거에는 옷이 마네킹에만 전시되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Clothes were displayed only on mannequins.","옷은 마네킹에만 전시되었다."]],"w":"3번 문장에 Clothes were displayed only on mannequins가 그대로 있어요.","c":"T"},"h":"7bc8a8822f"},{"n":2,"t":"tf","q":"Photographers were welcome at the first fashion parades.","ko":"사진작가들은 최초의 패션 퍼레이드에 환영받았다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Photographers weren’t allowed to attend.","사진작가들은 참석하도록 허용되지 않았다."]],"w":"10번 문장에서 사진작가들은 참석하도록 허용되지 않았다(weren't allowed to attend)고 해요. 환영받았다는 말은 반대예요.","c":"F"},"h":"1622f4aac5"},{"n":3,"t":"tf","q":"After World War II, fashion shows became exciting events with larger audiences.","ko":"제2차 세계대전 이후 패션쇼는 더 많은 관객이 있는 흥미로운 행사가 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12~13번 문장","s":[[12,"After World War II, fashion shows began to change.","제2차 세계대전 이후, 패션쇼는 변하기 시작했다."],[13,"Soon they became exciting events with larger audiences.","곧 그것들은 더 많은 관객이 있는 흥미로운 행사가 되었다."]],"w":"12~13번 문장에서 2차 대전 이후 패션쇼가 변하기 시작했고 곧 더 많은 관객이 있는 흥미로운 행사가 되었다고 해요.","c":"T"},"h":"78257fac36"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So he organized events called fashion parades...)","ko":"그래서 그는 패션 퍼레이드라고 불리는 행사를 ( ).","opts":["취소했다","준비했다","방문했다","구경했다"],"word":"organized","r":{"a":"2) 준비했다","ev":"7번 문장","s":[[7,"So he organized events called fashion parades, where models wearing his clothes walked past an audience.","그래서 그는 패션 퍼레이드라고 불리는 행사를 준비했는데, 그곳에서 그의 옷을 입은 모델들이 관객들을 지나서 걸어 돌아다녔다."]],"w":"7번에서 Worth가 fashion parades라는 행사를 직접 만들어 열었어요. organize는 행사를 '준비하다, 조직하다'예요.","c":2},"h":"38e0e89e9e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, there was no music, no fancy stage designs, and no special effects.)","ko":"하지만, 음악도, ( ) 무대 디자인도, 특수 효과도 없었다.","opts":["소박한","화려한","오래된","위험한"],"word":"fancy","r":{"a":"2) 화려한","ev":"8번 문장","s":[[8,"However, there was no music, no fancy stage designs, and no special effects.","하지만, 음악도, 화려한 무대 디자인도, 특수 효과도 없었다."]],"w":"8번에서 처음의 패션 퍼레이드에는 음악도, fancy한 무대 디자인도, 특수 효과도 없었어요. 무대를 꾸미는 말이므로 fancy는 '화려한'이라는 뜻이에요.","c":2},"h":"ed1e75c445"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nInstead, they were small, private gatherings, with only buyers from stores in the audience.","ko":"밑줄 친 they가 가리키는 것은?","sko":"대신에 그것들은 상점에서 온 구매자들만 관객에 있는 작고 개인적인 모임이었다.","opts":["사진작가들","상점의 구매자들","패션 퍼레이드들","마네킹들"],"r":{"a":"3) 패션 퍼레이드들","ev":"7, 9번 문장","s":[[7,"So he organized events called fashion parades, where models wearing his clothes walked past an audience.","그래서 그는 패션 퍼레이드라고 불리는 행사를 준비했는데, 그곳에서 그의 옷을 입은 모델들이 관객들을 지나서 걸어 돌아다녔다."],[9,"Instead, they were small, private gatherings, with only buyers from stores in the audience.","대신에 그것들은 상점에서 온 구매자들만 관객에 있는 작고 개인적인 모임이었다."]],"w":"9번의 they는 7번에서 소개한 fashion parades(패션 퍼레이드들)예요. 구매자들은 관객으로 따로 나오므로 they가 아니에요.","c":3},"h":"c64c404666"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So there was no way to know how the clothes would look on an actual person.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 옷이 실제 사람에게 어떻게 보일지 알 방법이 없었다.","opts":["그래서 옷이 실제 사람에게 어떻게 보일지 알 방법이 없었다.","그래서 사람들은 옷이 어떻게 보이는지 곧바로 알 수 있었다.","그래서 마네킹이 사람보다 옷을 더 잘 입는다는 것을 알았다.","그래서 옷은 실제 사람에게만 어울린다는 것을 알았다."],"r":{"a":"1) 그래서 옷이 실제 사람에게 어떻게 보일지 알 방법이 없었다.","ev":"3~4번 문장","s":[[3,"Clothes were displayed only on mannequins.","옷은 마네킹에만 전시되었다."],[4,"So there was no way to know how the clothes would look on an actual person.","그래서 옷이 실제 사람에게 어떻게 보일지 알 방법이 없었다."]],"w":"no way to know는 '알 방법이 없다'예요. 옷이 마네킹에만 전시되었으니(3번) 실제 사람에게 어떻게 보일지는 알 수 없었다는 뜻이에요.","c":1},"h":"646767e399"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Charles Frederick Worth는 프랑스 디자이너였다.","초기 패션 퍼레이드에는 음악과 특수 효과가 있었다.","패션쇼는 1960년대 파리에서 시작되었다.","초기 패션 퍼레이드는 상점에서 온 구매자들이 있는 작은 모임이었다."],"opts":["Charles Frederick Worth was a French designer.","Early fashion parades had music and special effects.","Fashion shows started in Paris in the 1960s.","Early fashion parades were small gatherings with buyers from stores."],"r":{"a":"4) Early fashion parades were small gatherings with buyers from stores.","ev":"5~6, 8~9번 문장","s":[[5,"That changed in Paris in the 1860s.","그것은 1860년대 파리에서 변했다."],[6,"An English designer named Charles Frederick Worth decided to show his clothes on real people.","Charles Frederick Worth라는 이름의 영국 디자이너는 실제 사람들에게 그의 옷을 (입혀) 보여주기로 결정했다."],[8,"However, there was no music, no fancy stage designs, and no special effects.","하지만, 음악도, 화려한 무대 디자인도, 특수 효과도 없었다."],[9,"Instead, they were small, private gatherings, with only buyers from stores in the audience.","대신에 그것들은 상점에서 온 구매자들만 관객에 있는 작고 개인적인 모임이었다."]],"w":"9번에서 초기 패션 퍼레이드는 상점에서 온 구매자들만 관객으로 있는 작은 모임이었어요. Worth는 영국 디자이너이고(6번), 시기는 1860년대이며(5번), 음악도 특수 효과도 없었어요(8번).","c":4},"h":"fd04e97965"},{"n":9,"t":"sum","q":"Charles Frederick Worth had (A) wearing his clothes walk past an audience of (B) from stores.","ko":"Charles Frederick Worth는 그의 옷을 입은 (A)이 상점에서 온 (B)인 관객을 지나서 걷게 했다.","oko":["(A) 마네킹 / (B) 구매자","(A) 모델 / (B) 사진작가","(A) 디자이너 / (B) 사진작가","(A) 마네킹 / (B) 디자이너","(A) 모델 / (B) 구매자"],"opts":["(A) mannequins / (B) buyers","(A) models / (B) photographers","(A) designers / (B) photographers","(A) mannequins / (B) designers","(A) models / (B) buyers"],"r":{"a":"5) (A) models / (B) buyers","ev":"7, 9번 문장","s":[[7,"So he organized events called fashion parades, where models wearing his clothes walked past an audience.","그래서 그는 패션 퍼레이드라고 불리는 행사를 준비했는데, 그곳에서 그의 옷을 입은 모델들이 관객들을 지나서 걸어 돌아다녔다."],[9,"Instead, they were small, private gatherings, with only buyers from stores in the audience.","대신에 그것들은 상점에서 온 구매자들만 관객에 있는 작고 개인적인 모임이었다."]],"w":"7번에서 그의 옷을 입은 models(모델들)가 관객 앞을 걸었고, 9번에서 관객은 상점에서 온 buyers(구매자들)뿐이었어요.","c":5},"h":"fba486b823"},{"n":10,"t":"fill","q":"Photographers weren’t [A] to attend because the designers didn’t want anyone to [B] their ideas.","ko":"디자이너들이 누군가 자신들의 아이디어를 [B]하는 것을 원하지 않았기 때문에 사진작가들은 참석하도록 [A] 않았다.","bank":["allowed","steal","attend","wear","walk","soon"],"bko":{"allowed":"허락된","steal":"훔치다","attend":"참석하다","wear":"입다","walk":"걷다","soon":"곧"},"r":{"a":"[A] allowed, [B] steal","ev":"10~11번 문장","s":[[10,"Photographers weren’t allowed to attend.","사진작가들은 참석하도록 허용되지 않았다."],[11,"This was because the designers didn’t want anyone to steal their ideas.","이것은 그 디자이너들이 누군가 자신들의 아이디어를 훔치는 것을 원하지 않았기 때문이다."]],"w":"10번 Photographers weren't allowed to attend와 11번 didn't want anyone to steal their ideas에서 가져왔어요. allowed는 '허락된', steal은 '훔치다'예요.","c":null},"h":"988fc1af97"}]},{"u":4,"id":"rj3-04-2","no":2,"ko":"널 꼭 지켜줄게","items":[{"n":1,"t":"tf","q":"The Monuments Men included museum directors and historians.","ko":"모뉴먼츠 맨에는 박물관장과 역사가들이 포함되어 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They were museum directors, historians, artists, and architects.","그들은 박물관장과 역사가, 예술가, 건축가들이었다."]],"w":"4번 문장에서 그들은 박물관장과 역사가, 예술가, 건축가들이었다고 해요.","c":"T"},"h":"44973dabcb"},{"n":2,"t":"tf","q":"The members had received basic military training before they entered war zones.","ko":"구성원들은 전쟁 지역에 들어가기 전에 기본적인 군사 훈련을 받았었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Although they had never received basic military training, they entered dangerous war zones and performed their duties.","비록 그들은 결코 기본적인 군사 훈련을 받은 적이 없었지만, 위험한 전쟁 지역들에 들어가서 그들의 임무를 수행했다."]],"w":"5번 문장에서 그들은 기본적인 군사 훈련을 받은 적이 없었다(had never received)고 해요.","c":"F"},"h":"ebef49107f"},{"n":3,"t":"tf","q":"Many of the members continued to preserve important works after returning from the war.","ko":"많은 구성원들은 전쟁에서 돌아온 후에도 중요한 작품들을 계속 지켰다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Even after returning from the war, many of the members continued to preserve important works.","심지어 전쟁에서 돌아온 후에도, 구성원 중 많은 이들이 중요한 작품들을 계속 지켰다."]],"w":"10번 문장에서 전쟁에서 돌아온 후에도 구성원 중 많은 이들이 중요한 작품들을 계속 지켰다고 해요.","c":"T"},"h":"d61ca477ca"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It was World War II, and many European cities were being destroyed.)","ko":"제2차 세계대전 때였고, 많은 유럽의 도시들이 ( ) 있었다.","opts":["건설되고","파괴되고","보호되고","방문되고"],"word":"destroyed","r":{"a":"2) 파괴되고","ev":"1~2번 문장","s":[[1,"It was World War II, and many European cities were being destroyed.","제2차 세계대전 때였고, 많은 유럽의 도시들이 파괴되고 있었다."],[2,"Many buildings and artwork that had great artistic and historic value were being destroyed, too.","훌륭한 예술적, 역사적 가치를 지닌 많은 건축물과 예술품 또한 파괴되고 있었다."]],"w":"1번의 many European cities were being destroyed에서 전쟁 때문에 도시가 부서지고 있었어요. 2번에서 건물과 예술품도(too) 같은 일을 겪어요. destroy는 '파괴하다'예요.","c":2},"h":"b6ef72bcad"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, their belief was strong.)","ko":"하지만, 그들의 ( )은 확고했다.","opts":["신념","건강","기억","계획"],"word":"belief","r":{"a":"1) 신념","ev":"6~7번 문장","s":[[6,"Many group members were hurt and others were even killed.","많은 단체 구성원들이 다쳤고 다른 이들은 심지어 죽었다."],[7,"However, their belief was strong.","하지만, 그들의 신념은 확고했다."]],"w":"6번에서 많은 구성원이 다치거나 죽었는데도 7번에서 However로 그들의 belief는 strong했다고 해요. 어려운 일에도 흔들리지 않는 마음, '신념'이에요.","c":1},"h":"d5bb3cc63c"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe continued, “If these things are destroyed, it will be like we never existed.”","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 계속해서 “만약 이러한 것들이 파괴된다면, 그것은 우리가 결코 존재하지 않았던 것과 같을 것이다.”라고 말했다.","opts":["적군의 지휘관","한 단체 구성원","역사가들","전쟁에서 다친 시민"],"r":{"a":"2) 한 단체 구성원","ev":"8~9번 문장","s":[[8,"“Cultural assets are the evidence that we have existed and developed,” a group member said.","“문화재는 우리가 존재해 왔고 발전해 왔다는 증거이다.”라고 한 단체 구성원이 말했다."],[9,"He continued, “If these things are destroyed, it will be like we never existed.”","그는 계속해서 “만약 이러한 것들이 파괴된다면, 그것은 우리가 결코 존재하지 않았던 것과 같을 것이다.”라고 말했다."]],"w":"9번의 He는 바로 앞 8번에서 말한 a group member(한 단체 구성원)예요. 같은 사람이 이어서 말하는 장면이에요.","c":2},"h":"890d633d1c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If these things are destroyed, it will be like we never existed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 이러한 것들이 파괴된다면, 그것은 우리가 결코 존재하지 않았던 것과 같을 것이다.","opts":["이러한 것들이 파괴되어도 우리는 계속 존재할 것이다.","이러한 것들을 만들면 우리는 결코 존재하지 않을 것이다.","우리가 존재하지 않았다면 이러한 것들은 파괴되었을 것이다.","이러한 것들이 파괴되면 우리가 존재한 적 없는 것과 같을 것이다."],"r":{"a":"4) 이러한 것들이 파괴되면 우리가 존재한 적 없는 것과 같을 것이다.","ev":"8~9번 문장","s":[[8,"“Cultural assets are the evidence that we have existed and developed,” a group member said.","“문화재는 우리가 존재해 왔고 발전해 왔다는 증거이다.”라고 한 단체 구성원이 말했다."],[9,"He continued, “If these things are destroyed, it will be like we never existed.”","그는 계속해서 “만약 이러한 것들이 파괴된다면, 그것은 우리가 결코 존재하지 않았던 것과 같을 것이다.”라고 말했다."]],"w":"문화재는 우리가 존재해 왔다는 증거예요(8번). 그래서 이것들이 파괴되면 우리가 존재한 적이 없는 것처럼 된다는 뜻이에요.","c":4},"h":"17af34c480"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 단체는 100명보다 적은 사람들로 이루어졌다.","모뉴먼츠 맨은 문화적 가치가 큰 많은 물품을 구했다.","전쟁에서 파괴된 것은 몇 개의 건물뿐이었다.","구성원들은 전쟁이 끝나자 일을 그만두었다."],"opts":["The group had fewer than 100 members.","The Monuments Men saved many items of great cultural value.","Only a few buildings were destroyed in the war.","The members stopped their work when the war ended."],"r":{"a":"2) The Monuments Men saved many items of great cultural value.","ev":"1~3, 10~11번 문장","s":[[1,"It was World War II, and many European cities were being destroyed.","제2차 세계대전 때였고, 많은 유럽의 도시들이 파괴되고 있었다."],[2,"Many buildings and artwork that had great artistic and historic value were being destroyed, too.","훌륭한 예술적, 역사적 가치를 지닌 많은 건축물과 예술품 또한 파괴되고 있었다."],[3,"So, the Monuments Men, a group of more than 300 people, was formed to protect these items.","그래서, 300명 이상의 사람들의 단체인 모뉴먼츠 맨이 이러한 물품들을 보호하기 위해 결성되었다."],[10,"Even after returning from the war, many of the members continued to preserve important works.","심지어 전쟁에서 돌아온 후에도, 구성원 중 많은 이들이 중요한 작품들을 계속 지켰다."],[11,"Thanks to the Monuments Men, many items of great cultural value were saved.","모뉴먼츠 맨 덕분에, 훌륭한 문화적 가치를 가진 많은 물품들이 구해졌다."]],"w":"11번에서 모뉴먼츠 맨 덕분에 문화적 가치가 큰 많은 물품이 구해졌어요. 단체는 300명이 넘었고(3번), 많은 도시와 건물이 파괴되었으며(1~2번), 전쟁 후에도 일을 계속했어요(10번).","c":2},"h":"03fa77247c"},{"n":9,"t":"sum","q":"Although the Monuments Men had never received military (A), they entered dangerous war zones, and many were (B).","ko":"모뉴먼츠 맨은 군사 (A)을 받은 적이 없었지만 위험한 전쟁 지역에 들어갔고 많은 이들이 (B) 상태가 되었다.","oko":["(A) 군복 / (B) 다친","(A) 훈련 / (B) 행복한","(A) 훈련 / (B) 다친","(A) 음식 / (B) 부유한","(A) 군복 / (B) 부유한"],"opts":["(A) uniforms / (B) hurt","(A) training / (B) happy","(A) training / (B) hurt","(A) food / (B) rich","(A) uniforms / (B) rich"],"r":{"a":"3) (A) training / (B) hurt","ev":"5~6번 문장","s":[[5,"Although they had never received basic military training, they entered dangerous war zones and performed their duties.","비록 그들은 결코 기본적인 군사 훈련을 받은 적이 없었지만, 위험한 전쟁 지역들에 들어가서 그들의 임무를 수행했다."],[6,"Many group members were hurt and others were even killed.","많은 단체 구성원들이 다쳤고 다른 이들은 er was perfect for them because it was waterproof thanks to its coated wool.)","ko":"건지 스웨터는 코팅된 양털 덕분에 ( )였기 때문에 그들에게 안성맞춤이었다.","opts":["물이 스며들지 않는","가벼운","비싼","낡은"],"word":"waterproof","r":{"a":"1) 물이 스며들지 않는","ev":"7~8번 문장","s":[[7,"They also had to be protected from the cold water splashing across their boats.","그들은 또한 그들의 배 사방으로 튀는 차가운 물로부터 보호되어야 했다."],[8,"The Guernsey sweater was perfect for them because it was waterproof thanks to its coated wool.","건지 스웨터는 그것의 코팅된 양털 덕분에 방수되었기 때문에 그들에게 안성맞춤이었다."]],"w":"7번에서 어부들은 배 사방으로 튀는 차가운 물로부터 보호되어야 했어요. 8번의 waterproof는 코팅된 양털 덕분에 물이 스며들지 않는다는 뜻의 '방수의'예요.","c":1},"h":"0dbc699b47"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fishing was more dangerous in the past.)","ko":"어업은 과거에 더 ( ) 일이었다.","opts":["쉬운","위험한","지루한","조용한"],"word":"dangerous","r":{"a":"2) 위험한","ev":"12번 문장","s":[[12,"Fishing was more dangerous in the past.","어업은 과거에 더 위험했다."]],"w":"12번에서 과거의 어업이 더 dangerous했다고 해요. 그래서 13번처럼 시신이 해변으로 밀려오는 일도 있었어요. dangerous는 '위험한'이에요.","c":2},"h":"58c4f06242"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThe Guernsey sweater was perfect for them because it was waterproof thanks to its coated wool.","ko":"밑줄 친 them이 가리키는 것은?","sko":"건지 스웨터는 그것의 코팅된 양털 덕분에 방수되었기 때문에 그들에게 안성맞춤이었다.","opts":["스웨터들","배들","각 일가들","어부들"],"r":{"a":"4) 어부들","ev":"5~6, 8번 문장","s":[[5,"Local fishermen wore these sweaters, which were hand-knitted.","현지 어부들은 이 스웨터들을 입었는데, 그것들은 손으로 짜였다."],[6,"Since the fishermen worked on boats year round, they needed clothes that were both warm and comfortable.","어부들은 일 년 내내 배에서 일했기 때문에, 그들은 따뜻하고도 편한 옷이 필요했다."],[8,"The Guernsey sweater was perfect for them because it was waterproof thanks to its coated wool.","건지 스웨터는 그것의 코팅된 양털 덕분에 방수되었기 때문에 그들에게 안성맞춤이었다."]],"w":"8번의 them은 스웨터를 입고 배에서 일한 어부들(fishermen)이에요. 5~6번에서 어부들이 스웨터를 입고 일 년 내내 배에서 일한다고 했어요.","c":4},"h":"dbd6889475"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They also had to be protected fr of the sentence?\n\"Nowadays 4ʹ33ʹʹ is famous for challenging the way people think about music.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘날 <4분 33초>는 사람들이 음악에 대해 생각하는 방식에 도전하는 것으로 유명하다.","opts":["오늘날 <4분 33초>는 사람들이 음악을 쉽게 외울 수 있어서 유명하다.","오늘날 <4분 33초>는 사람들이 음악을 생각하지 못하게 해서 유명하다.","오늘날 <4분 33초>는 사람들이 음악에 대해 생각하는 방식에 도전해서 유명하다.","오늘날 <4분 33초>는 사람들의 생각을 그대로 따라서 유명하다."],"r":{"a":"3) 오늘날 <4분 33초>는 사람들이 음악에 대해 생각하는 방식에 도전해서 유명하다.","ev":"12번 문장","s":[[12,"Nowadays 4ʹ33ʹʹ is famous for challenging the way people think about music.","오늘날 <4분 33초>는 사람들이 음악에 대해 생각하는 방식에 도전하는 것으로 유명하다."]],"w":"famous for는 '~로 유명한', challenge는 '도전하다'예요. 사람들이 음악에 대해 가진 생각을 흔든 것으로 유명하다는 뜻이에요.","c":3},"h":"63e3950302"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["청중은 4분 33초 동안 전혀 놀라지 않았다.","피아니스트는 4분 33초를 기다린 뒤 청중에게 인사했다.","피아니스트는 4분 동안 유명한 곡을 연주했다.","피아니스트는 청중에게 인사하지 않고 걸어나갔다."],"opts":["The audience was not surprised at all.","The pianist waited for four minutes and thirty-three seconds and then bowed to the audience.","The pianist played a famous song for four minutes.","The pianist walked away without bowing to the audience."],"r":{"a":"2) The pianist waited for four minutes and thirty-three seconds and then bowed to the audience.","ev":"2~3, 5~6번 문장","s":[[2,"He checked his watch and waited for four minutes and thirty-three seconds.","그는 그의 시계를 확인하고 4분 33초 동안 기다렸다."],[3,"Afterward, he bowed to the audience and walked away!","그 후에, 그는 청중에게 고개 숙여 인사하고 걸어나가 버렸다!"],[5,"For four minutes and thirty-three seconds, the performer plays nothing at all!","4분 33초 동안, 연주자는 전혀 아무것도 연주하지 않는다!"],[6,"The audience was surprised.","청중은 놀랐다."]],"w":"2~3번에서 피아니스트는 시계를 확인하고 4분 33초 동안 기다린 뒤 청중에게 인사하고 걸어나갔어요. 연주한 곡은 없었고(5번), 청중은 놀랐어요(6번).","c":2},"h":"c837ee0c92"},{"n":9,"t":"sum","q":"Cage believed music could be made with (A) sounds, so he had the musician play nothing and let the audience (B) them.","ko":"Cage는 음악이 (A) 소리로도 만들어질 수 있다고 믿어서, 음악가가 아무것도 연주하지 않게 하고 청중이 그것들을 (B)하게 했다.","oko":["(A) 오직 / (B) 듣다","(A) 어떤 / (B) 만들다","(A) 큰 / (B) 멈추다","(A) 조용한 / (B) 만들다","(A) 어떤 / (B) 듣다"],"opts":["(A) only / (B) hear","(A) any / (B) make","(A) loud / (B) stop","(A) quiet / (B) make","(A) any / (B) hear"],"r":{"a":"5) (A) any / (B) hear","ev":"9~11번 문장","s":[[9,"Cage believed that music could be made with any sounds, including the whispers of the audience or the sound of hearts beating.","Cage는 음악은 청중의 속삭임이나 심장이 뛰는 소리를 포함하여, 어떤 소리들로도 만들어질 수 있다고 믿었다."],[10,"He wanted the audience to hear these sounds.","그는 청중이 이러한 소리들을 듣기를 원했다."],[11,"By having the musician play nothing, he let them do so.","음악가가 아무것도 연주하지 않게 함으로써, 그는 그들이 그렇게 하게 했다."]],"w":"9번에서 Cage는 any sounds(어떤 소리든)로 음악을 만들 수 있다고 믿었고, 10~11번에서 청중이 이 소리들을 hear(듣다)하게 했어요.","c":5},"h":"033cfda50a"},{"n":10,"t":"fill","q":"Nowadays 4ʹ33ʹʹ is [A] for challenging the way people [B] about music.","ko":"오늘날 <4분 33초>는 사람들이 음악에 대해 [B]하는 방식에 도전하는 것으로 [A].","bank":["famous","think","surprised","impressed","waited","beating"],"bko":{"famous":"유명한","think":"생각하다","surprised":"놀란","impressed":"감명 받은","waited":"기다렸다","beating":"뛰는"},"r":{"a":"[A] famous, [B] think","ev":"12번 문장","s":[[12,"Nowadays 4ʹ33ʹʹ is famous for challenging the way people think about music.","오늘날 <4분 33초>는 사람들이 음악에 대해 생각하는 방식에 도전하는 것으로 유명하다."]],"w":"12번 문장 Nowadays 4ʹ33ʹʹ is famous for challenging the way people think about music에서 가져왔어요. 'famous for'는 '~로 유명한', 사람들이 음악에 대해 '생각하는' 방식이에요.","c":null},"h":"064902b913"}]},{"u":5,"id":"rj3-05-1","no":1,"ko":"콩과 비밀 사이에 무슨 관련이?","items":[{"n":1,"t":"tf","q":"Each person in the ancient Greek voting system put a bean into a large jar.","ko":"고대 그리스 투표 제도에서 각각의 사람은 큰 항아리에 콩을 넣었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In this system, each person would vote by putting a bean into a large jar.","이 제도에서, 각각의 사람은 큰 항아리에 콩을 넣어 투표하곤 했다."]],"w":"5번 문장에 putting a bean into a large jar(큰 항아리에 콩을 넣음으로써)라고 나와요. 본문과 같은 내용이에요.","c":"T"},"h":"4387799ae3"},{"n":2,"t":"tf","q":"Black beans were used to vote “yes.”","ko":"검은 콩은 ‘예’에 투표하는 데 사용되었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"White beans were used to vote “yes,” and black beans were used to vote “no.”","흰 콩은 ‘예’에 투표하는 데 사용되었고 검은 콩은 ‘아니오’에 투표하는 데 사용되었다."]],"w":"6번 문장에서 ‘예’에는 흰 콩, 검은 콩은 ‘아니오’에 썼어요. 검은 콩이 ‘예’라는 말은 반대예요.","c":"F"},"h":"cac428d380"},{"n":3,"t":"tf","q":"People could know the result while the voting was still going on.","ko":"사람들은 투표가 진행되는 동안 결과를 알 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Nobody knew what the result would be during the voting process.","투표 과정 중에는 어떤 결과가 나올지 아무도 알 수 없었다."]],"w":"7번 문장에서 투표 과정 중에는 어떤 결과가 나올지 아무도 알 수 없었다고 해요. 그래서 반대예요.","c":"F"},"h":"cde76dbf75"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, if someone spilled the beans in the jar onto the floor, then the votes would no longer be hidden.)","ko":"하지만, 만약 누군가가 항아리 안의 콩을 바닥에 쏟았다면, 그 투표는 더 이상 ( ) 것이었다.","opts":["공개된","계산된","숨겨진","사라진"],"word":"hidden","r":{"a":"3) 숨겨진","ev":"7~8번 문장","s":[[7,"Nobody knew what the result would be during the voting process.","투표 과정 중에는 어떤 결과가 나올지 아무도 알 수 없었다."],[8,"However, if someone spilled the beans in the jar onto the floor, then the votes would no longer be hidden.","하지만, 만약 누군가가 항아리 안의 콩을 바닥에 쏟았다면, 그 투표는 더 이상 숨겨지지 않을 것이었다."]],"w":"7번에서 투표 중에는 어떤 결과가 나올지 아무도 알 수 없었어요. 8번에서 콩을 쏟으면 투표가 더 이상 숨겨지지 않는다(no longer hidden)고 해요. hidden은 hide(숨기다)의 과거분사로 '숨겨진'이에요.","c":3},"h":"97fc88513c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The origin of this phrase is not exactly clear.)","ko":"이 문구의 ( )은 정확하게 밝혀지지 않았다.","opts":["결과","기원, 유래","뜻풀이","예문"],"word":"origin","r":{"a":"2) 기원, 유래","ev":"3~4번 문장","s":[[3,"The origin of this phrase is not exactly clear.","이 문구의 기원은 정확하게 밝혀지지 않았다."],[4,"However, according to one popular story, it refers to an ancient Greek voting system.","하지만, 한 인기 있는 이야기에 따르면, 이것은 고대 그리스의 투표 제도를 가리킨다고 한다."]],"w":"3번에서 기원이 분명하지 않다고 하고, 4번 However 뒤에 어디서 왔는지에 대한 이야기가 나와요. origin = 기원, 유래예요.","c":2},"h":"07269c0b9b"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhether this story is true or not, it helps us remember the phrase’s meaning.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이 이야기가 사실이든 아니든, 그것은 우리가 이 문구의 의미를 기억할 수 있도록 도와준다.","opts":["이 이야기","항아리","투표 결과","이 문구의 의미"],"r":{"a":"1) 이 이야기","ev":"9번 문장","s":[[9,"Whether this story is true or not, it helps us remember the phrase’s meaning.","이 이야기가 사실이든 아니든, 그것은 우리가 이 문구의 의미를 기억할 수 있도록 도와준다."]],"w":"it은 앞의 this story(이 이야기)예요. 이야기가 문구의 의미를 기억하도록 도와준다는 뜻이에요. 문구의 의미(the phrase’s meaning)는 기억하는 대상이지 도와주는 주체가 아니에요.","c":1},"h":"e27074aee9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, according to one popular story, it refers to an ancient Greek voting system.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 한 인기 있는 이야기에 따르면, 이것은 고대 그리스의 투표 제도를 가리킨다고 한다.","opts":["한 인기 있는 이야기에 따르면, 이 문구는 고대 그리스의 요리법에서 나왔다.","이 이야기는 인기가 없어서 고대 그리스에서는 쓰이지 않았다.","고대 그리스인들은 이 문구를 만들어 투표 제도를 바꾸었다.","한 인기 있는 이야기에 따르면, 이 문구는 고대 그리스의 투표 제도와 관련이 있다."],"r":{"a":"4) 한 인기 있는 이야기에 따르면, 이 문구는 고대 그리스의 투표 제도와 관련이 있다.","ev":"4번 문장","s":[[4,"However, according to one popular story, it refers to an ancient Greek voting system.","하지만, 한 인기 있는 이야기에 따르면, 이것은 고대 그리스의 투표 제도를 가리킨다고 한다."]],"w":"according to ~는 '~에 따르면', it은 3번에 나온 이 문구(this phrase)예요. refers to는 '~을 가리키다, 나타내다'라서, 이 문구가 고대 그리스의 투표 제도와 관련 있다는 이야기라는 뜻이에요.","c":4},"h":"da5907ee30"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["투표 중에도 사람들은 결과를 알고 있었다.","투표 과정 중에는 결과를 아무도 알 수 없었다.","각 사람은 작은 상자에 콩을 넣어 투표했다.","이 문구의 기원은 분명하게 밝혀져 있다."],"opts":["People knew the result even during the voting process.","Nobody knew the result during the voting process.","Each person put a bean into a small box to vote.","The origin of this phrase is perfectly clear."],"r":{"a":"2) Nobody knew the result during the voting process.","ev":"3번, 5번, 7번 문장","s":[[3,"The origin of this phrase is not exactly clear.","이 문구의 기원은 정확하게 밝혀지지 않았다."],[5,"In this system, each person would vote by putting a bean into a large jar.","이 제도에서, 각각의 사람은 큰 항아리에 콩을 넣어 투표하곤 했다."],[7,"Nobody knew what the result would be during the voting process.","투표 과정 중에는 어떤 결과가 나올지 아무도 알 수 없었다."]],"w":"7번에서 투표 과정 중에는 결과를 아무도 몰랐다고 해요. 항아리는 큰 항아리(5번)였고, 기원은 정확하지 않아요(3번).","c":2},"h":"1ee5b83b83"},{"n":9,"t":"sum","q":"In an ancient Greek voting system, people voted with (A) in a jar, and the votes were no longer hidden when someone (B) them onto the floor.","ko":"고대 그리스의 투표 제도에서 사람들은 항아리 속 (A)으로 투표했고, 누군가 그것들을 바닥에 (B) 투표는 더 이상 숨겨지지 않았다.","oko":["(A) 돌 / (B) 쏟아","(A) 콩 / (B) 숨겨","(A) 콩 / (B) 쏟아","(A) 종이 / (B) 세어","(A) 콩 / (B) 세어"],"opts":["(A) stones / (B) spilled","(A) beans / (B) hid","(A) beans / (B) spilled","(A) papers / (B) counted","(A) beans / (B) counted"],"r":{"a":"3) (A) beans / (B) spilled","ev":"5번, 8번 문장","s":[[5,"In this system, each person would vote by putting a bean into a large jar.","이 제도에서, 각각의 사람은 큰 항아리에 콩을 넣어 투표하곤 했다."],[8,"However, if someone spilled the beans in the jar onto the floor, then the votes would no longer be hidden.","하지만, 만약 누군가가 항아리 안의 콩을 바닥에 쏟았다면, 그 투표는 더 이상 숨겨지지 않을 것이었다."]],"w":"5번에서 항아리에 넣는 것은 콩(beans)이에요. 8번에서 콩을 바닥에 쏟으면(spilled) 투표가 숨겨지지 않아요. 돌·종이·세다·숨기다는 본문에 나오지 않아요.","c":3},"h":"3917c8bce5"},{"n":10,"t":"fill","q":"The origin of the phrase “spill the beans” is not exactly [A], but one story helps us [B] its meaning.","ko":"‘콩을 쏟다’라는 문구의 기원은 정확히 [A] 않지만, 한 이야기는 우리가 그 의미를 [B] 수 있도록 도와준다.","bank":["clear","remember","jar","bean","origin","phrase"],"bko":{"clear":"분명한","remember":"기억하다","jar":"항아리","bean":"콩","origin":"기원","phrase":"문구"},"r":{"a":"[A] clear, [B] remember","ev":"3번, 9번 문장","s":[[3,"The origin of this phrase is not exactly clear.","이 문구의 기원은 정확하게 밝혀지지 않았다."],[9,"Whether this story is true or not, it helps us remember the phrase’s meaning.","이 이야기가 사실이든 아니든, 그것은 우리가 이 문구의 의미를 기억할 수 있도록 도와준다."]],"w":"3번 The origin of this phrase is not exactly clear, 9번 it helps us remember the phrase’s meaning에서 가져왔어요. jar·bean·origin·phrase는 명사라서 이 두 빈칸에 들어갈 수 없어요.","c":null},"h":"ab68dc4dfe"}]},{"u":5,"id":"rj3-05-2","no":2,"ko":"있을 때 잘해","items":[{"n":1,"t":"tf","q":"Kairos has long hair on the front of his head.","ko":"카이로스는 머리 앞쪽에 긴 머리카락이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"He has long hair on the front of his head, yet the back of his head is completely bald.","그는 그의 머리 앞쪽에 긴 머리카락을 가지고 있지만, 그의 머리 뒤쪽은 완전히 대머리이다."]],"w":"4번 문장에서 머리 앞쪽에는 긴 머리카락이 있고 뒤쪽은 대머리라고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"bf29613523"},{"n":2,"t":"tf","q":"Kairos has wings on his hands.","ko":"카이로스는 손에 날개가 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"You may also notice that he has wings on his feet.","당신은 또한 그가 그의 발에 날개들을 가진 것을 알아챌지도 모른다."]],"w":"7번 문장에서 날개는 손이 아니라 발(feet)에 있어요. 그래서 틀린 진술이에요.","c":"F"},"h":"c52ca398c7"},{"n":3,"t":"tf","q":"Kairos’s appearance teaches you to grab an opportunity right away.","ko":"카이로스의 모습은 기회를 즉시 잡으라고 가르쳐 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"His appearance teaches you what to do when an opportunity is in front of you.","그의 외모는 기회가 당신의 앞에 있을 때 무엇을 해야 할지 당신에게 가르쳐 준다."],[10,"You need to grab it right away.","당신은 그것을 즉시 잡을 필요가 있다."]],"w":"9번에서 그의 외모가 기회가 눈앞에 있을 때 무엇을 해야 할지 가르쳐 주고, 10번에서 그것을 즉시 잡을 필요가 있다고 해요.","c":"T"},"h":"3491ffc1f3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He has long hair on the front of his head, yet the back of his head is completely bald.)","ko":"그는 머리 앞쪽에 긴 머리카락을 가지고 있지만, 머리 뒤쪽은 완전히 ( ).","opts":["털이 많은","대머리인","곱슬거리는","검은색인"],"word":"bald","r":{"a":"2) 대머리인","ev":"4번 문장","s":[[4,"He has long hair on the front of his head, yet the back of his head is completely bald.","그는 그의 머리 앞쪽에 긴 머리카락을 가지고 있지만, 그의 머리 뒤쪽은 완전히 대머리이다."]],"w":"yet(하지만)으로 앞쪽의 긴 머리카락과 반대되는 말이 이어져요. 5~6번에서 지나가면 붙잡을 것이 없다고 하므로 bald는 머리카락이 없는 ‘대머리의’예요.","c":2},"h":"81fcb1c930"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, once he passes, there is nothing to hold on to.)","ko":"하지만, 일단 그가 지나가면, ( ) 것이 아무것도 없다.","opts":["던질","놓아 줄","붙잡을","세울"],"word":"hold on to","r":{"a":"3) 붙잡을","ev":"5~6번 문장","s":[[5,"So, when he approaches, you can easily catch him by grabbing his long hair.","그러므로, 그가 다가올 때, 당신은 그의 긴 머리카락을 붙잡음으로써 쉽게 그를 잡을 수 있다."],[6,"However, once he passes, there is nothing to hold on to.","하지만, 일단 그가 지나가면, 붙잡을 것이 아무것도 없다."]],"w":"5번에서 다가올 때는 긴 앞머리를 잡을 수 있다고 했어요. 6번은 지나가고 나면 그것이 없다는 말이라 hold on to는 ‘~을 꼭 붙잡다’예요.","c":3},"h":"389fcfb24b"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHowever, if you are afraid and hesitate even for a moment, it will pass you by and fly away.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만, 만약 당신이 두려워하고 잠깐이라도 망설인다면, 그것은 당신을 지나서 날아가 버릴 것이다.","opts":["카이로스의 머리카락","두려움","잠깐의 시간","기회"],"r":{"a":"4) 기회","ev":"9~10번, 12번 문장","s":[[9,"His appearance teaches you what to do when an opportunity is in front of you.","그의 외모는 기회가 당신의 앞에 있을 때 무엇을 해야 할지 당신에게 가르쳐 준다."],[10,"You need to grab it right away.","당신은 그것을 즉시 잡을 필요가 있다."],[12,"However, if you are afraid and hesitate even for a moment, it will pass you by and fly away.","하지만, 만약 당신이 두려워하고 잠깐이라도 망설인다면, 그것은 당신을 지나서 날아가 버릴 것이다."]],"w":"망설이면 지나가 날아가 버리는 것은 기회예요. 9번의 an opportunity를 10번에서 it으로 받았고, 12번의 it도 같은 기회예요.","c":4},"h":"f5978c4410"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This may seem difficult or dangerous.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 어렵거나 위험하게 보일지도 모른다.","opts":["이것은 쉽고 안전하게 보일 것이다.","이것은 어렵고 위험하다고 증명되었다.","이것은 어렵거나 위험하게 보일지도 모른다.","이것은 어렵지도 위험하지도 않을 것이다."],"r":{"a":"3) 이것은 어렵거나 위험하게 보일지도 모른다.","ev":"11번 문장","s":[[11,"This may seem difficult or dangerous.","이것은 어렵거나 위험하게 보일지도 모른다."]],"w":"may는 '~일지도 모른다', seem difficult or dangerous는 '어렵거나 위험하게 보이다'예요. This는 10번의 '기회를 즉시 잡는 것'을 가리켜요.","c":3},"h":"4f12f4c2b2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["카이로스는 머리 뒤쪽에 머리카락이 많다.","카이로스의 날개는 그가 매우 빠르게 오간다는 뜻이다.","카이로스가 지나간 뒤에도 쉽게 잡을 수 있다.","카이로스는 그리스 신화에서 불의 신이다."],"opts":["Kairos has a lot of hair on the back of his head.","The wings mean that Kairos comes and goes very quickly.","You can easily catch Kairos after he passes.","Kairos is the god of fire in Greek myths."],"r":{"a":"2) The wings mean that Kairos comes and goes very quickly.","ev":"3~4번, 6~8번 문장","s":[[3,"That is Kairos, the god of opportunity in Greek myths.","그것은 그리스 신화 속 기회의 신인 카이로스이다."],[4,"He has long hair on the front of his head, yet the back of his head is completely bald.","그는 그의 머리 앞쪽에 긴 머리카락을 가지고 있지만, 그의 머리 뒤쪽은 완전히 대머리이다."],[6,"However, once he passes, there is nothing to hold on to.","하지만, 일단 그가 지나가면, 붙잡을 것이 아무것도 없다."],[7,"You may also notice that he has wings on his feet.","당신은 또한 그가 그의 발에 날개들을 가진 것을 알아챌지도 모른다."],[8,"This means he comes and goes very quickly.","이는 그가 매우 빠르게 오간다는 것을 의미한다."]],"w":"7~8번에서 발의 날개는 매우 빠르게 오간다는 뜻이에요. 뒤는 대머리(4번), 지나가면 잡을 수 없고(6번), 카이로스는 기회의 신이에요(3번).","c":2},"h":"2c0da12bc0"},{"n":9,"t":"sum","q":"When Kairos (A), you can easily catch him by grabbing his long hair, but once he (B), there is nothing to hold on to.","ko":"카이로스가 (A) 때는 그의 긴 머리카락을 붙잡아 쉽게 잡을 수 있지만, 일단 그가 (B) 붙잡을 것이 아무것도 없다.","oko":["(A) 지나갈 / (B) 다가오면","(A) 숨을 / (B) 지나가면","(A) 다가올 / (B) 도착하면","(A) 날아갈 / (B) 잠들면","(A) 다가올 / (B) 지나가면"],"opts":["(A) passes / (B) approaches","(A) hides / (B) passes","(A) approaches / (B) arrives","(A) flies / (B) sleeps","(A) approaches / (B) passes"],"r":{"a":"5) (A) approaches / (B) passes","ev":"5~6번 문장","s":[[5,"So, when he approaches, you can easily catch him by grabbing his long hair.","그러므로, 그가 다가올 때, 당신은 그의 긴 머리카락을 붙잡음으로써 쉽게 그를 잡을 수 있다."],[6,"However, once he passes, there is nothing to hold on to.","하지만, 일단 그가 지나가면, 붙잡을 것이 아무것도 없다."]],"w":"5번에서 다가올 때(approaches) 긴 앞머리를 잡을 수 있고, 6번에서 일단 지나가면(passes) 붙잡을 것이 없어요. 나머지는 두 낱말의 뜻이 반대로 바뀌었거나 본문에 없는 말이에요.","c":5},"h":"9e6dce223a"},{"n":10,"t":"fill","q":"If you hesitate even for a moment, an opportunity will [A] you by and [B] away.","ko":"당신이 잠깐이라도 망설인다면, 기회는 당신을 [A]서 [B] 버릴 것이다.","bank":["pass","fly","grab","bald","wing","hesitate"],"bko":{"pass":"지나가다","fly":"날다","grab":"붙잡다","bald":"대머리의","wing":"날개","hesitate":"망설이다"},"r":{"a":"[A] pass, [B] fly","ev":"12번 문장","s":[[12,"However, if you are afraid and hesitate even for a moment, it will pass you by and fly away.","하지만, 만약 당신이 두려워하고 잠깐이라도 망설인다면, 그것은 당신을 지나서 날아가 버릴 것이다."]],"w":"12번 it will pass you by and fly away에서 가져왔어요. fly는 목적어를 바로 쓸 수 없어서 'fly you by'는 안 되고 'pass you by'가 맞아요. grab은 기회가 사람을 잡는다는 뜻이 되어 어색하고, bald·wing은 명사나 형용사라 문장에 안 맞아요.","c":null},"h":"10d6d14733"}]},{"u":5,"id":"rj3-05-3","no":3,"ko":"바닐라 비하인드 스토리","items":[{"n":1,"t":"tf","q":"Vanilla fruit only grew in and around Mexico.","ko":"바닐라 열매는 멕시코와 그 주변에서만 자랐다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"This was because vanilla fruit only grew in and around Mexico.","이는 바닐라 열매가 멕시코와 그 주변에서만 자랐기 때문이었다."]],"w":"2번 문장에 vanilla fruit only grew in and around Mexico라고 나와요. 본문과 같은 내용이에요.","c":"T"},"h":"7807278a2f"},{"n":2,"t":"tf","q":"The farmer’s vanilla plants grew a lot of fruit.","ko":"농장주의 바닐라 식물들은 많은 열매를 맺었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"However, they never grew any fruit.","하지만, 그것들은 결코 어떤 열매도 맺지 않았다."]],"w":"8번 문장에서 그 식물들은 결코 어떤 열매도 맺지 않았다(never grew any fruit)고 해요. 많이 맺었다는 말은 반대예요.","c":"F"},"h":"3e2794b63a"},{"n":3,"t":"tf","q":"The farmer noticed a fruit on one of the plants one day.","ko":"어느 날 농장주는 식물들 중 한 그루에서 열매 하나를 알아챘다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"One day, the farmer noticed a fruit on one of the plants.","어느 날, 그 농장주는 식물들 중 한 그루에서 열매 하나를 알아챘다."]],"w":"9번 문장에 One day, the farmer noticed a fruit on one of the plants라고 그대로 나와요.","c":"T"},"h":"bc86734159"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many people brought vanilla plants to their own countries, but no insects pollinated them.)","ko":"많은 사람들이 바닐라 식물을 자신의 나라로 들여왔지만, 어떤 곤충도 그것들을 ( ) 않았다.","opts":["먹지","수분시키지","옮겨 심지","죽이지"],"word":"pollinated","r":{"a":"2) 수분시키지","ev":"3~4번 문장","s":[[3,"Many people brought vanilla plants to their own countries, but no insects pollinated them.","많은 사람들이 바닐라 식물을 자신의 나라로 들여왔지만, 어떤 곤충도 그것들을 수분시키지 않았다."],[4,"Scientists tried to find a solution to this problem, but they all failed.","과학자들은 이 문제에 대한 해결책을 찾으려고 노력했지만, 그들은 모두 실패했다."]],"w":"3번에서 식물을 들여왔지만 곤충이 pollinated하지 않았다고 해요. 4번에서 이것이 문제가 되어 해결책을 찾으려 했고, 5번에서 ‘수분시키는 방법’을 발명해요. pollinate = 수분시키다예요.","c":2},"h":"ec64097e60"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Amazed, the farmer made Albius share the method with others.)","ko":"( ) 농장주는 Albius가 그 방법을 다른 사람들과 공유하도록 했다.","opts":["놀란","화가 난","지친","부끄러운"],"word":"Amazed","r":{"a":"1) 놀란","ev":"10~11번 문장","s":[[10,"Albius proudly explained that he had pollinated it using his thumb and a stick.","Albius는 그가 그의 엄지손가락과 막대기를 사용하여 그것을 수분시켰었다고 자랑스럽게 설명했다."],[11,"Amazed, the farmer made Albius share the method with others.","농장주는 놀라워하며, Albius가 그 방법을 다른 사람들과 공유하도록 했다."]],"w":"10번에서 열매가 맺힌 이유가 Albius의 방법임을 알게 돼요. 그래서 농장주는 놀라서(Amazed) 그 방법을 다른 사람들과 공유하게 했어요.","c":1},"h":"9e65a5172e"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nMany people brought vanilla plants to their own countries, but no insects pollinated them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"많은 사람들이 바닐라 식물을 자신의 나라로 들여왔지만, 어떤 곤충도 그것들을 수분시키지 않았다.","opts":["곤충들","사람들","바닐라 식물들","나라들"],"r":{"a":"3) 바닐라 식물들","ev":"3번 문장","s":[[3,"Many people brought vanilla plants to their own countries, but no insects pollinated them.","많은 사람들이 바닐라 식물을 자신의 나라로 들여왔지만, 어떤 곤충도 그것들을 수분시키지 않았다."]],"w":"곤충들이 수분시키지 않은 것은 같은 문장 앞에 나온 vanilla plants(바닐라 식물들)예요. 수분 대상은 곤충이나 사람이 아니라 식물이에요.","c":3},"h":"328e052149"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without Albius, delicious chocolate, ice cream, and cola would be too expensive to buy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Albius가 없었다면, 맛있는 초콜릿과 아이스크림, 콜라는 너무 비싸서 살 수 없을 것이다.","opts":["Albius 덕분에 초콜릿, 아이스크림, 콜라가 더 비싸졌다.","Albius가 없어도 초콜릿, 아이스크림, 콜라는 싸게 살 수 있다.","초콜릿, 아이스크림, 콜라가 맛있어서 Albius가 사 먹었다.","Albius가 없었다면 초콜릿, 아이스크림, 콜라는 너무 비싸서 살 수 없을 것이다."],"r":{"a":"4) Albius가 없었다면 초콜릿, 아이스크림, 콜라는 너무 비싸서 살 수 없을 것이다.","ev":"13번 문장","s":[[13,"Without Albius, delicious chocolate, ice cream, and cola would be too expensive to buy.","만약 Albius가 없었다면, 맛있는 초콜릿과 아이스크림, 콜라는 너무 비싸서 살 수 없을 것이다."]],"w":"Without Albius는 ‘Albius가 없었다면’이고, too expensive to buy는 ‘너무 비싸서 살 수 없다’예요. 즉 Albius의 방법 덕분에 바닐라가 싸졌다는 뜻이에요.","c":4},"h":"b22af268f9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["바닐라는 처음부터 전 세계에서 자랐다.","과학자들은 수분 문제를 쉽게 해결했다.","Albius는 엄지손가락과 막대기로 바닐라 식물을 수분시켰다.","농장주는 다른 사람들이 그 방법을 알기를 원하지 않았다."],"opts":["Vanilla grew all over the world from the beginning.","Scientists easily solved the pollination problem.","Albius pollinated a vanilla plant with his thumb and a stick.","The farmer did not want others to know the method."],"r":{"a":"3) Albius pollinated a vanilla plant with his thumb and a stick.","ev":"2번, 4번, 10~11번 문장","s":[[2,"This was because vanilla fruit only grew in and around Mexico.","이는 바닐라 열매가 멕시코와 그 주변에서만 자랐기 때문이었다."],[4,"Scientists tried to find a solution to this problem, but they all failed.","과학자들은 이 문제에 대한 해결책을 찾으려고 노력했지만, 그들은 모두 실패했다."],[10,"Albius proudly explained that he had pollinated it using his thumb and a stick.","Albius는 그가 그의 엄지손가락과 막대기를 사용하여 그것을 수분시켰었다고 자랑스럽게 설명했다."],[11,"Amazed, the farmer made Albius share the method with others.","농장주는 놀라워하며, Albius가 그 방법을 다른 사람들과 공유하도록 했다."]],"w":"10번에서 Albius는 엄지손가락과 막대기로 수분시켰다고 해요. 바닐라는 멕시코 주변에서만 자랐고(2번), 과학자들은 실패했고(4번), 농장주는 방법을 공유하게 했어요(11번).","c":3},"h":"83a8f8c6d3"},{"n":9,"t":"sum","q":"Even after people took vanilla plants to their own countries, (A) did not pollinate them, and scientists could not find a (B) to this problem.","ko":"사람들이 바닐라 식물을 자신의 나라로 가져간 뒤에도, (A)이 그것들을 수분시키지 않았고 과학자들은 이 문제의 (B)을 찾지 못했다.","oko":["(A) 농부 / (B) 열매","(A) 과학자 / (B) 해결책","(A) 곤충 / (B) 문제","(A) 곤충 / (B) 바닐라","(A) 곤충 / (B) 해결책"],"opts":["(A) farmers / (B) fruit","(A) scientists / (B) solution","(A) insects / (B) problem","(A) insects / (B) vanilla","(A) insects / (B) solution"],"r":{"a":"5) (A) insects / (B) solution","ev":"3~4번 문장","s":[[3,"Many people brought vanilla plants to their own countries, but no insects pollinated them.","많은 사람들이 바닐라 식물을 자신의 나라로 들여왔지만, 어떤 곤충도 그것들을 수분시키지 않았다."],[4,"Scientists tried to find a solution to this problem, but they all failed.","과학자들은 이 문제에 대한 해결책을 찾으려고 노력했지만, 그들은 모두 실패했다."]],"w":"3번에서 수분시키지 않은 것은 곤충(insects)이고, 4번에서 과학자들은 이 문제의 해결책(solution)을 찾으려다 실패했어요. 과학자·농부는 수분시키지 않았다고 한 적이 없어요.","c":5},"h":"26a9f5b60e"},{"n":10,"t":"fill","q":"The farmer made Albius [A] his method with others, so vanilla became [B] around the world.","ko":"농장주는 Albius가 그의 방법을 다른 사람들과 [A]하도록 했고, 그래서 바닐라는 세계적으로 [B] 것이 되었다.","bank":["share","common","pollinate","thumb","method","fail"],"bko":{"share":"공유하다","common":"흔한","pollinate":"수분시키다","thumb":"엄지손가락","method":"방법","fail":"실패하다"},"r":{"a":"[A] share, [B] common","ev":"11~12번 문장","s":[[11,"Amazed, the farmer made Albius share the method with others.","농장주는 놀라워하며, Albius가 그 방법을 다른 사람들과 공유하도록 했다."],[12,"Eventually, thanks to Albius’s method, vanilla became common around the world.","결국, Albius의 방법 덕분에, 바닐라는 세계적으로 흔해졌다."]],"w":"11번 made Albius share the method with others, 12번 vanilla became common around the world에서 가져왔어요. pollinate·fail은 [A]의 뜻과 맞지 않고, thumb·method는 명사라 [B]에 들어갈 수 없어요.","c":null},"h":"71544c00d6"}]},{"u":5,"id":"rj3-05-4","no":4,"ko":"구기 종목 삼 형제","items":[{"n":1,"t":"tf","q":"The teams could use as many players as they wanted in a game.","ko":"팀들은 한 경기에 원하는 만큼 많은 선수들을 쓸 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The teams could use as many players as they wanted in a game.","팀들은 그들이 원하는 만큼의 많은 선수들을 한 경기에 쓸 수 있었다."]],"w":"3번 문장에 as many players as they wanted in a game이 그대로 나와요. 선수 수에 제한이 없었다는 내용과 같아요.","c":"T"},"h":"167d3b532c"},{"n":2,"t":"tf","q":"The type of football that allowed the players to carry the ball with their hands later became soccer.","ko":"선수들이 손으로 공을 나르는 것을 허용한 풋볼 방식은 나중에 축구가 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"One type allowed the players to carry the ball with their hands.","한 방식은 선수들이 그들의 손으로 공을 나르는 것을 허용했다."],[8,"This sport later became rugby.","이 운동 경기는 나중에 럭비가 되었다."]],"w":"7번에서 손으로 공을 나르는 방식이 8번에서 나중에 럭비가 되었다고 해요. 축구가 된 것은 공을 차는 다른 방식(9번)이에요.","c":"F"},"h":"0966f0ac3a"},{"n":3,"t":"tf","q":"Both types of football were introduced to North America.","ko":"두 가지 풋볼 방식 모두 북아메리카에 소개되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Both were introduced to North America, but North Americans enjoyed the rugby-type game more.","두 가지 모두 북아메리카에 소개되었지만, 북아메리카 사람들은 럭비 형태의 경기를 더 즐겼다."]],"w":"10번 문장에 Both were introduced to North America라고 나와요. 두 방식 모두 들어갔지만 럭비 형태가 더 즐겨졌어요.","c":"T"},"h":"83da09b446"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the early 19th century, football was divided into two major categories in British public schools.)","ko":"19세기 초에, 풋볼은 영국 사립 학교들에서 두 가지 주요 범주로 ( ).","opts":["나뉘었다","합쳐졌다","금지되었다","옮겨졌다"],"word":"divided","r":{"a":"1) 나뉘었다","ev":"6~7번, 9번 문장","s":[[6,"In the early 19th century, football was divided into two major categories in British public schools.","19세기 초에, 풋볼은 영국 사립 학교들에서 두 가지 주요 범주로 나뉘었다."],[7,"One type allowed the players to carry the ball with their hands.","한 방식은 선수들이 그들의 손으로 공을 나르는 것을 허용했다."],[9,"In the other type, which became soccer, players kicked the ball.","다른 방식에서, 그것은 축구가 되었는데, 선수들은 공을 찼다."]],"w":"6번에서 풋볼이 두 가지 주요 범주로 나뉘었고, 7번 One type과 9번 the other type으로 두 방식이 설명돼요. be divided into = ~로 나뉘다예요.","c":1},"h":"1e5119b759"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The three sports originated from the same game, but each one developed in its own way.)","ko":"그 세 가지 운동 경기는 같은 경기로부터 ( ) 각각은 그것 자신의 방식으로 발전했다.","opts":["끝났지만","사라졌지만","비롯되었지만","옮겨졌지만"],"word":"originated","r":{"a":"3) 비롯되었지만","ev":"4번, 12번 문장","s":[[4,"This game eventually became a spor ","c":"F"},"h":"718202c883"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (What is more, the researchers noticed some patterns in the sounds, which resembled clicking or popping noises.)","ko":"게다가, 연구원들은 소리에서 몇 가지 패턴을 알아냈는데, 그것은 딸깍거리는 소리나 펑 하는 소리와 ( ).","opts":["달랐다","비슷했다","섞여 있었다","사라졌다"],"word":"resembled","r":{"a":"2) 비슷했다","ev":"5번 문장","s":[[5,"What is more, the researchers noticed some patterns in the sounds, which resembled clicking or popping noises.","게다가, 연구원들은 소리에서 몇 가지 패턴을 알아냈는데, 그것은 딸깍거리는 소리나 펑 하는 소리와 비슷했다."]],"w":"5번에서 패턴을 설명하는 which 뒤의 말이에요. 패턴이 딸깍거리거나 펑 하는 소리와 같은 종류라는 뜻이라 resemble = 닮다, 비슷하다예요.","c":2},"h":"47a2d2c766"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For a long time, scientists have known that plants respond to sound.)","ko":"오랫동안, 과학자들은 식물들이 소리에 ( ) 것을 알았다.","opts":["반응한다는","저항한다는","복종한다는","숨는다는"],"word":"respond","r":{"a":"1) 반응한다는","ev":"1~2번 문장","s":[[1,"For a long time, scientists have known that plants respond to sound.","오랫동안, 과학자들은 식물들이 소리에 반응한다는 것을 알았다."],[2,"However, recent discoveries have shown that plants also make sounds of their own.","하지만, 최근의 발견은 식물들이 또한 그것들 자신의 소리를 낸다는 것을 보여주었다."]],"w":"1번은 오래전부터 알던 내용이고, 2번에서는 However로 식물이 스스로 소리도 낸다는 새 발견이 이어져요. 식물이 소리에 ‘반응한다’는 뜻이라 respond to = ~에 반응하다예요.","c":1},"h":"1de3c52896"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nWhat is more, the researchers noticed some patterns in the sounds, which resembled clicking or popping noises.","ko":"밑줄 친 which가 가리키는 것은?","sko":"게다가, 연구원들은 소리에서 몇 가지 패턴을 알아냈는데, 그것은 딸깍거리는 소리나 펑 하는 소리와 비슷했다.","opts":["연구원들","마이크","소리에서 알아낸 몇 가지 패턴","토마토"],"r":{"a":"3) 소리에서 알아낸 몇 가지 패턴","ev":"5번 문장","s":[[5,"What is more, the researchers noticed some patterns in the sounds, which resembled clicking or popping noises.","게다가, 연구원들은 소리에서 몇 가지 패턴을 알아냈는데, 그것은 딸깍거리는 소리나 펑 하는 소리와 비슷했다."]],"w":"which는 바로 앞에 나온 some patterns in the sounds(소리에서 알아낸 몇 가지 패턴)를 가리켜요. 딸깍·펑 소리와 비슷했던 것은 그 패턴이에요.","c":3},"h":"a9da094895"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Researchers hope to continue studying what plants say so that they can help people who work with plants, such as farmers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"연구원들은 농부들처럼 식물들과 함께 일하는 사람들을 도울 수 있도록 식물들이 말하는 것을 계속 연구하기를 희망한다.","opts":["연구원들은 농부 같은 사람들을 도울 수 있도록 식물이 말하는 것을 계속 연구하기를 바란다.","연구원들은 식물이 말하는 것에 대한 연구를 곧 그만두기를 바란다.","농부들은 식물에게 말을 걸어 연구원들을 돕고 싶어 한다.","연구원들은 식물과 일하는 사람들이 연구를 계속하기를 바란다."],"r":{"a":"1) 연구원들은 농부 같은 사람들을 도울 수 있도록 식물이 말하는 것을 계속 연구하기를 바란다.","ev":"10번 문장","s":[[10,"Researchers hope to continue studying what plants say so that they can help people who work with plants, such as farmers.","연구원들은 농부들처럼 식물들과 함께 일하는 사람들을 도울 수 있도록 식물들이 말하는 것을 계속 연구하기를 희망한다."]],"w":"hope to continue studying은 ‘계속 연구하기를 희망한다’이고 so that they can help people은 ‘사람들을 도울 수 있도록’이에요. 연구하는 쪽은 연구원이고, 돕는 대상이 농부 같은 사람들이에요.","c":1},"h":"fc7af3d993"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["식물은 소리에 반응하지 못한다.","식물은 물을 많이 가지고 있을 때 더 많은 소리를 낸다.","사람들은 식물이 내는 모든 소리를 들을 수 있다.","연구원들은 토마토 주변의 소리를 듣기 위해 마이크를 사용했다."],"opts":["Plants cannot respond to sound.","Plants make more sounds when they have plenty of water.","Humans can hear all the sounds that plants make.","Researchers used microphones to listen to the sounds around tomatoes."],"r":{"a":"4) Researchers used microphones to listen to the sounds around tomatoes.","ev":"1번, 3~4번, 6번 문장","s":[[1,"For a long time, scientists have known that plants respond to sound.","오랫동안, 과학자들은 식물들이 소리에 반응한다는 것을 알았다."],[3,"Researchers used microphones to listen to the sounds around tomatoes.","연구원들은 토마토 주변의 소리를 듣기 위해 마이크를 사용했다."],[4,"They discovered that plants make sounds that humans cannot hear with their own ears.","그들은 사람들이 자신들의 귀로 들을 수 없는 소리를 식물들이 낸다는 것을 발견했다."],[6,"When the plants had plenty of water, they hardly made any noise.","식물들이 많은 물을 가지고 있을 때, 그것들은 거의 어떤 소리도 내지 않았다."]],"w":"3번에서 연구원들이 토마토 주변의 소리를 듣기 위해 마이크를 썼어요. 식물은 소리에 반응하고(1번), 물이 많으면 거의 소리를 내지 않고(6번), 사람이 못 듣는 소리도 있어요(4번).","c":4},"h":"a33884a9fb"},{"n":9,"t":"sum","q":"Plants (A) sounds that humans cannot (B) with their own ears.","ko":"식물은 사람들이 자신들의 귀로 (B)할 수 없는 소리를 (A).","oko":["(A) 듣는다 / (B) 만들","(A) 멈춘다 / (B) 볼","(A) 반응한다 / (B) 냄새 맡을","(A) 잃는다 / (B) 들을","(A) 낸다 / (B) 들을"],"opts":["(A) hear / (B) make","(A) stop / (B) see","(A) respond / (B) smell","(A) lose / (B) hear","(A) make / (B) hear"],"r":{"a":"5) (A) make / (B) hear","ev":"2번, 4번 문장","s":[[2,"However, recent discoveries have shown that plants also make sounds of their own.","하지만, 최근의 발견은 식물들이 또한 그것들 자신의 소리를 낸다는 것을 보여주었다."],[4,"They discovered that plants make sounds that humans cannot hear with their own ears.","그들은 사람들이 자신들의 귀로 들을 수 없는 소리를 식물들이 낸다는 것을 발견했다."]],"w":"2번에서 식물이 자신의 소리를 낸다(make sounds)고 하고, 4번에서 그 소리는 사람이 귀로 들을(hear) 수 없다고 해요. 나머지는 본문에 없거나 뜻이 반대예요.","c":5},"h":"11457baa72"},{"n":10,"t":"fill","q":"The plants made sounds when they were [A], and they made more sounds as their soil became [B].","ko":"식물들은 [A] 때 소리를 냈고, 흙이 더 [B] 질수록 더 많은 소리를 냈다.","bank":["stressed","drier","microphones","tomatoes","patterns","noise"],"bko":{"stressed":"스트레스를 받은","drier":"더 건조한","microphones":"마이크","tomatoes":"토마토","patterns":"패턴","noise":"소음"},"r":{"a":"[A] stressed, [B] drier","ev":"7번, 9번 문장","s":[[7,"However, as their soil became drier, they made more sounds.","그러나, 그것들의 토양이 더 건조해질 때 그것들은 더 많은 소리를 냈다."],[9,"In other words, the plants made sounds when they were stressed.","다시 말해서, 식물들은 그것들이 스트레스를 받았을 때 소리를 냈다."]],"w":"9번 the plants made sounds when they were stressed, 7번 as their soil became drier, they made more sounds에서 가져왔어요. 나머지는 모두 명사라 [A]와 [B] 자리에 들어갈 수 없어요.","c":null},"h":"3e6681cea0"}]},{"u":6,"id":"rj3-06-2","no":2,"ko":"루시퍼를 만나러 가볼까요?","items":[{"n":1,"t":"tf","q":"Darvaza is a village in Turkmenistan’s Karakum Desert.","ko":"다르바자는 투르크메니스탄의 카라쿰 사막에 있는 마을이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Actually, it is called the “door to hell,” but it’s just a famous tourist attraction in Darvaza, a village in Turkmenistan’s Karakum Desert.","실제로, 그것은 ‘지옥으로 가는 문’이라고 불리지만, 그것은 투르크메니스탄의 카라쿰 사막에 있는 마을인 다르바자에 있는 그저 한 유명한 관광 명소이다."]],"w":"3번 문장에서 Darvaza는 투르크메니스탄의 카라쿰 사막에 있는 마을(a village in Turkmenistan’s Karakum Desert)이라고 해요.","c":"T"},"h":"7af8775b12"},{"n":2,"t":"tf","q":"The scientists decided to burn off the gas to make a tourist attraction.","ko":"과학자들은 관광 명소를 만들기 위해 가스를 태워 없애기로 결정했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"In order to protect people in the area, the scientists decided to burn off the gas.","그 지역의 사람들을 보호하기 위해, 과학자들은 그 가스를 태워 없애기로 결정했다."]],"w":"7번 문장에서 과학자들이 가스를 태우기로 한 것은 그 지역의 사람들을 보호하기 위해서예요. 관광 명소를 만들려는 것이 아니에요.","c":"F"},"h":"19f37c1674"},{"n":3,"t":"tf","q":"No one knows when the huge fire will stop.","ko":"아무도 그 거대한 불길이 언제 멈출지 알지 못한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"No one knows when this huge fire will stop.","언제 이 거대한 불길이 멈출 것인지 아무도 알지 못한다."]],"w":"10번 문장에 No one knows when this huge fire will stop이 그대로 나와요.","c":"T"},"h":"5e17058d55"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, the ground around the site soon collapsed, creating a huge hole.)","ko":"그러나, 곧 그 장소 주변의 땅이 ( ) 한 거대한 구덩이를 생성했다.","opts":["솟아올랐다","얼어붙었다","무너졌다","사라졌다"],"word":"collapsed","r":{"a":"3) 무너졌다","ev":"4~5번 문장","s":[[4,"In 1971, scientists started digging for natural gas in this area.","1971년에, 과학자들은 이 지역에서 천연가스를 찾아 땅을 파기 시작했다."],[5,"However, the ground around the site soon collapsed, creating a huge hole.","그러나, 곧 그 장소 주변의 땅이 무너졌고 한 거대한 구덩이를 생성했다."]],"w":"4번에서 땅을 파던 장소의 주변이 어떻게 되었는지 5번에 나와요. 그 결과 거대한 구덩이가 생겼으니 땅이 ‘무너졌다’는 뜻이에요. collapse = 무너지다.","c":3},"h":"b3cc44e9b2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then poisonous gas began escaping through the hole.)","ko":"그러고 나서 그 구덩이를 통해 ( ) 가스가 새어 나오기 시작했다.","opts":["달콤한","투명한","뜨거운","유독한"],"word":"poisonous","r":{"a":"4) 유독한","ev":"6~7번 문장","s":[[6,"Then poisonous gas began escaping through the hole.","그러고 나서 그 구덩이를 통해 유독 가스가 새어 나오기 시작했다."],[7,"In order to protect people in the area, the scientists decided to burn off the gas.","그 지역의 사람들을 보호하기 위해, 과학자들은 그 가스를 태워 없애기로 결정했다."]],"w":"7번에서 사람들을 보호하기 위해 그 가스를 태우기로 했어요. 그러니 가스는 사람에게 해로운 ‘유독성의’ 가스예요. poisonous = 유독한.","c":4},"h":"a147fede8c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIs it the door to hell?","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것은 지옥으로 가는 문일까?","opts":["불타오르는 구덩이","마을","사막","천연가스"],"r":{"a":"1) 불타오르는 구덩이","ev":"1~2번 문장","s":[[1,"Imagine a burning hole that is about 70 meters wide and 30 meters deep!","너비가 약 70m이고 깊이가 30m인 불타오르는 구덩이를 상상해 보라!"],[2,"Is it the door to hell?","그것은 지옥으로 가는 문일까?"]],"w":"2번은 1번에서 상상해 보라고 한 a burning hole(불타오르는 구덩이)을 보고 던지는 질문이에요. 그래서 it은 그 구덩이예요.","c":1},"h":"fe0a38ea06"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even more than 40 years later, however, the hole is still burning.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 심지어 40년 이상이 지난 후에도, 그 구덩이는 여전히 불타고 있다.","opts":["40년이 지나자 구덩이의 불은 드디어 꺼졌다.","40년이 넘게 지난 지금도 구덩이는 여전히 불타고 있다.","40년이 안 되어 구덩이의 불이 약해졌다.","구덩이는 40년 후에야 불타기 시작했다."],"r":{"a":"2) 40년이 넘게 지난 지금도 구덩이는 여전히 불타고 있다.","ev":"9번 문장","s":[[9,"Even more than 40 years later, however, the hole is still burning.","하지만, 심지어 40년 이상이 지난 후에도, 그 구덩이는 여전히 불타고 있다."]],"w":"Even more than 40 years later는 ‘40년 이상이 지난 후에도’이고 still burning은 ‘여전히 불타고 있다’예요. 8번의 ‘며칠’ 예상과 정반대의 결과예요.","c":2},"h":"a7cda2476c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["구덩이는 전쟁으로 마을이 파괴되어 생겼다.","과학자들은 불이 40년 이상 탈 것이라고 예상했다.","과학자들이 땅을 파기 시작한 뒤 곧 그 장소 주변의 땅이 무너졌다.","사람들은 불이 언제 멈출지 정확히 알고 있다."],"opts":["The hole appeared because a war destroyed the village.","The scientists expected the fire to burn for more than 40 years.","The ground around the site collapsed soon after the scientists started digging.","People already know exactly when the fire will stop."],"r":{"a":"3) The ground around the site collapsed soon after the scientists started digging.","ev":"3~5번, 8번, 10번 문장","s":[[3,"Actually, it is called the “door to hell,” but it’s just a famous tourist attraction in Darvaza, a village in Turkmenistan’s Karakum Desert.","실제로, 그것은 ‘지옥으로 가는 문’이라고 불리지만, 그것은 투르크메니스탄의 카라쿰 사막에 있는 마을인 다르바자에 있는 그저 한 유명한 관광 명소이다."],[4,"In 1971, scientists started digging for natural gas in this area.","1971년에, 과학자들은 이 지역에서 천연가스를 찾아 땅을 파기 시작했다."],[5,"However, the ground around the site soon collapsed, creating a huge hole.","그러나, 곧 그 장소 주변의 땅이 무너졌고 한 거대한 구덩이를 생성했다."],[8,"They thought that it would take only a few days.","그들은 그것이 단 며칠만 걸릴 것이라고 생각했다."],[10,"No one knows when this huge fire will stop.","언제 이 거대한 불길이 멈출 것인지 아무도 알지 못한다."]],"w":"4~5번에서 땅을 파기 시작한 뒤 곧 주변 땅이 무너졌어요. 전쟁 이야기는 없고(3번·5번), 과학자들은 며칠을 예상했고(8번), 불이 언제 멈출지 아무도 몰라요(10번).","c":3},"h":"f8c47a66f1"},{"n":9,"t":"sum","q":"Because poisonous gas began (A) through the hole, the scientists decided to (B) the gas to protect people.","ko":"유독 가스가 구덩이를 통해 (A)하기 시작했기 때문에, 과학자들은 사람들을 보호하기 위해 그 가스를 (B)하기로 결정했다.","oko":["(A) 들어오기 / (B) 태워 없애","(A) 새어 나오기 / (B) 얼려","(A) 새어 나오기 / (B) 파","(A) 사라지기 / (B) 태워 없애","(A) 새어 나오기 / (B) 태워 없애"],"opts":["(A) entering / (B) burn off","(A) escaping / (B) freeze","(A) escaping / (B) dig","(A) disappearing / (B) burn off","(A) escaping / (B) burn off"],"r":{"a":"5) (A) escaping / (B) burn off","ev":"6~7번 문장","s":[[6,"Then poisonous gas began escaping through the hole.","그러고 나서 그 구덩이를 통해 유독 가스가 새어 나오기 시작했다."],[7,"In order to protect people in the area, the scientists decided to burn off the gas.","그 지역의 사람들을 보호하기 위해, 과학자들은 그 가스를 태워 없애기로 결정했다."]],"w":"6번에서 가스가 구덩이를 통해 새어 나오기(escaping) 시작했고, 7번에서 과학자들은 그 가스를 태워 없애기로(burn off) 결정했어요. 가스를 얼리거나 파겠다는 말은 없어요.","c":5},"h":"fa922f70c5"},{"n":10,"t":"fill","q":"Scientists started [A] for natural gas, but the ground around the site [B], creating a huge hole.","ko":"과학자들은 천연가스를 찾아 [A] 시작했지만, 그 장소 주변의 땅이 [B] 거대한 구덩이가 생겼다.","bank":["digging","collapsed","poisonous","tourist","burning","escaped"],"bko":{"digging":"땅을 파기","collapsed":"무너졌다","poisonous":"유독한","tourist":"관광객","burning":"불타는","escaped":"새어 나왔다"},"r":{"a":"[A] digging, [B] collapsed","ev":"4~5번 문장","s":[[4,"In 1971, scientists started digging for natural gas in this area.","1971년에, 과학자들은 이 지역에서 천연가스를 찾아 땅을 파기 시작했다."],[5,"However, the ground around the site soon collapsed, creating a huge hole.","그러나, 곧 그 장소 주변의 땅이 무너졌고 한 거대한 구덩이를 생성했다."]],"w":"4번 scientists started digging for natural gas, 5번 the ground around the site soon collapsed에서 가져왔어요. poisonous·tourist는 [A], [B]의 자리와 뜻이 맞지 않고, escaped는 땅이 주어라 어색해요.","c":null},"h":"b82ca411f7"}]},{"u":6,"id":"rj3-06-3","no":3,"ko":"깜깜할수록 잘 보입니다","items":[{"n":1,"t":"tf","q":"Moonlight produces rainbows just as sunlight does.","ko":"햇빛이 무지개를 만들어 내는 것처럼 달빛도 무지개를 만들어 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Just as sunlight produces rainbows, moonlight produces rainbows, too.","마치 햇빛이 무지개를 만들어 내는 것처럼, 달빛 또한 무지개를 만들어 낸다."]],"w":"3번 문장에 Just as sunlight produces rainbows, moonlight produces rainbows, too.가 나와요. 본문과 같은 내용이에요.","c":"T"},"h":"5d590e0e80"},{"n":2,"t":"tf","q":"Moonbows look more colorful than rainbows to human eyes.","ko":"달무지개는 사람의 눈에 무지개보다 더 화려한 색으로 보인다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"However, because moonlight is weaker than sunlight, moonbows look white instead of colored to human eyes.","하지만, 달빛은 햇빛보다 더 약하기 때문에, 달무지개는 사람의 눈에 유채색 대신 하얀색으로 보인다."]],"w":"6번 문장에서 달빛이 더 약해서 달무지개는 색이 있는 대신 하얗게 보인다고 해요. 더 화려하다는 말은 반대예요.","c":"F"},"h":"76692b4365"},{"n":3,"t":"tf","q":"A moonbow needs a bright moon that is low and almost full.","ko":"달무지개에는 낮게 떠 있고 거의 보름달에 가까운 밝은 달이 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Second, there must be a bright moon that is low and almost full.","둘째, 낮게 떠 있고 거의 보름달에 가까운 밝은 달이 있어야 한다."]],"w":"9번 문장에 there must be a bright moon that is low and almost full이 그대로 나와요.","c":"T"},"h":"d4a61ee654"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A rainbow in a bright blue sky is a beautiful sight.)","ko":"밝고 푸른 하늘에 있는 무지개는 아름다운 ( )이다.","opts":["소리","냄새","맛","광경"],"word":"sight","r":{"a":"4) 광경","ev":"1번 문장","s":[[1,"A rainbow in a bright blue sky is a beautiful sight.","밝고 푸른 하늘에 있는 무지개는 아름다운 광경이다."]],"w":"밝고 푸른 하늘의 무지개를 보고 ‘아름답다’고 말하는 문장이에요. 눈으로 보는 모습이라 sight = 광경이에요.","c":4},"h":"9a7c4c2157"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The basic principle of a moonbow is just like that of a rainbow.)","ko":"달무지개의 기본 ( )은 무지개의 그것과 똑같다.","opts":["법칙, 원리","이름","색깔","역사"],"word":"principle","r":{"a":"1) 법칙, 원리","ev":"5번 문장","s":[[5,"The basic principle of a moonbow is just like that of a rainbow.","달무지개의 기본 법칙은 무지개의 그것과 똑같다."]],"w":"5번은 달무지개가 생기는 방식(기본 법칙)이 보통 무지개와 똑같다는 말이에요. 그래서 principle = 법칙, 원리예요.","c":1},"h":"4e6e8e3200"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThe basic principle of a moonbow is just like that of a rainbow.","ko":"밑줄 친 that이 가리키는 것은?","sko":"달무지개의 기본 법칙은 무지개의 그것과 똑같다.","opts":["달무지개","햇빛","기본 법칙","하늘"],"r":{"a":"3) 기본 법칙","ev":"5번 문장","s":[[5,"The basic principle of a moonbow is just like that of a rainbow.","달무지개의 기본 법칙은 무지개의 그것과 똑같다."]],"w":"that of a rainbow는 ‘무지개의 기본 법칙’이에요. 앞에 나온 the basic principle을 반복하지 않으려고 that으로 받았어요.","c":3},"h":"31992c15a5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, because moonlight is weaker than sunlight, moonbows look white instead of colored to human eyes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 달빛은 햇빛보다 더 약하기 때문에, 달무지개는 사람의 눈에 유채색 대신 하얀색으로 보인다.","opts":["달빛이 햇빛보다 강해서 달무지개는 사람의 눈에 더 화려하게 보인다.","달빛이 햇빛보다 약해서 달무지개는 사람의 눈에 색이 아니라 하얗게 보인다.","달무지개가 하얗기 때문에 달빛이 햇빛보다 약하다.","사람의 눈이 약해서 달무지개가 하얗게 보인다."],"r":{"a":"2) 달빛이 햇빛보다 약해서 달무지개는 사람의 눈에 색이 아니라 하얗게 보인다.","ev":"6번 문장","s":[[6,"However, because moonlight is weaker than sunlight, moonbows look white instead of colored to human eyes.","하지만, 달빛은 햇빛보다 더 약하기 때문에, 달무지개는 사람의 눈에 유채색 대신 하얀색으로 보인다."]],"w":"because moonlight is weaker
