var D=[{"n":1,"tag":null,"en":"A New Cookie Star: Chocolate Chip Cookies","ko":"새로운 쿠키 스타: 초콜릿 칩 쿠키","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"In America, there was an famous cook, Ms. Wakefield. One day in 1938, she wanted to baking chocolate cookies.","ko":"미국에 Wakefield 씨라는 한 유명한 요리사가 있었다. 1938년 어느 날, 그녀는 초콜릿 쿠키를 굽고 싶었다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[4],"point":"관사 a/an: famous는 자음 소리로 시작하므로 a famous","topic":"관사 a/an","memo":"famous는 자음 소리로 시작하므로 a famous"},{"wrong":"baking","right":"bake","partial":false,"at":[16],"point":"to부정사: to 뒤에는 동사원형: bake (baking 아님)","topic":"to부정사","memo":"to 뒤에는 동사원형: bake (baking 아님)"}]},{"n":3,"tag":null,"en":"However, she didn't had enough time to melt chocolate. \"Aha!\"","ko":"그러나 그녀는 초콜릿을 녹일 충분한 시간이 없었다. \"아하!\"","ok":false,"foot":[],"fixes":[{"wrong":"had","right":"have","partial":false,"at":[3],"point":"일반동사의 부정문: didn't 뒤에는 동사원형 have 사용","topic":"일반동사의 부정문","memo":"didn't 뒤에는 동사원형 have 사용"}]},{"n":4,"tag":null,"en":"So, she cut a chocolate bar into small chips. Then, she mixed them with her dough and putted the cookie dough into the oven.","ko":"그래서 그녀는 초콜릿 바를 작은 조각들로 잘랐다. 그런 다음, 그녀는 그것들을 반죽과 섞었고, 그 쿠키 반죽을 오븐에 넣었다.","ok":false,"foot":[],"fixes":[{"wrong":"putted","right":"put","partial":false,"at":[17],"point":"불규칙 과거형: put의 과거형은 put (putted 아님)","topic":"불규칙 과거형","memo":"put의 과거형은 put (putted 아님)"}]},{"n":5,"tag":null,"en":"When Ms. Wakefield opened the oven, she found that the chips was not melted into the dough. \"Oh, no!\"","ko":"Wakefield 씨가 오븐을 열었을 때, 그녀는 그 조각들이 반죽에 녹아들지 않은 것을 발견했다. \"아, 안 돼!\"","ok":false,"foot":[],"fixes":[{"wrong":"was","right":"were","partial":false,"at":[11],"point":"be동사의 수일치: 복수 주어 the chips에는 were 사용","topic":"be동사의 수일치","memo":"복수 주어 the chips에는 were 사용"}]},{"n":6,"tag":null,"en":"Although the chips remained in the cookies, she was not disappointed. Her new cookies were so deliciously.","ko":"비록 그 조각들이 쿠키에 남아 있었지만, 그녀는 실망하지 않았다. 그 없이 옷을 세탁할 수 있을까?",1],["The answer is \"yes.\"","정답은 '그렇다.'이다.",0],["Dry cleaning uses oil to clean clothes.","드라이클리닝은 옷을 세탁하기 위해 기름을 사용한다.",0],["There's an interesting story about dry cleaning.","드라이클리닝에 관한 흥미로운 이야기가 있다.",0],["In the 1800s, a factory worker in France spilled lamp oil on a tablecloth.","1800년대에 프랑스에서 한 공장 노동자가 테이블보에 등유를 쏟았다.",0],["The factory manager, Mr. Jolly, looked at the tablecloth and found something.","공장 관리자인 Jolly 씨는 테이블보를 보고 무언가를 발견했다.",0],["\"Wow!\"","\"와!\"",0],["The dirty spot on the tablecloth was cleaned by the lamp oil!","테이블보 위의 더러운 얼룩이 등유에 의해 깨끗해졌다!",0],["His discovery led to a new way of cleaning clothes.","그의 발견은 옷을 세탁하는 새로운 방법으로 이어졌다.",0],["Now, dry cleaning is widely used around the world.","이제 드라이클리닝은 전 세계적으로 널리 사용된다.",0],["These wonderful inventions came by chance.","이 훌륭한 발명품들은 우연히 나왔다.",1],["When things go wrong, don't be disappointed.","일이 잘못될 때 실망하지 마라.",0],["Maybe you can be the next amazing inventor.","아마도 당신이 다음의 놀라운 발명가가 될 수도 있다.",0]];var RNUM=29;var TITLE_EN="Wonderful Inventions by Chance";var PASS_EN=["Wonderful Inventions by Chance","A New Cookie Star: Chocolate Chip Cookies","In America, there was a famous cook, Ms. Wakefield. One day in 1938, she wanted to bake chocolate cookies. However, she didn't have enough time to melt chocolate. \"Aha!\" So, she cut a chocolate bar into small chips. Then, she mixed them with her dough and put the cookie dough into the oven. When Ms. Wakefield opened the oven, she found that the chips were not melted into the dough. \"Oh, no!\" Although the chips remained in the cookies, she was not disappointed. Her new cookies were so delicious. She invented chocolate CHIP cookies!","Finding Safety in Glass: Safety Glass","In 1903, a French scientist, Mr. Bénédictus, was experimenting with liquid plastic in a glass flask. He accidentally hit the glass flask, and it fell on the floor. \"Oops!\" Although the glass flask was broken into pieces, they still held together in the shape of the flask! How could this happen? The secret was the liquid plastic in the flask. This finding led to his invention of safety glass. These days, we can find safety glass everywhere. For example, it is used for car windows. If there is a car accident, people are safer from sharp pieces of glass.","Cleaning Clothes Without Water: Dry Cleaning","Can you clean your clothes without water? The answer is \"yes.\" Dry cleaning uses oil to clean clothes. There's an interesting story about dry cleaning. In the 1800s, a factory worker in France spilled lamp oil on a tablecloth. The factory manager, Mr. Jolly, looked at the tablecloth and found something. \"Wow!\" The dirty spot on the tablecloth was cleaned by the lamp oil! His discovery led to a new way of cleaning clothes. Now, dry cleaning is widely used around the world.","These wonderful inventions came by chance. When things go wrong, don't be disappointed. Maybe you can be the next amazing inventor."];var PASS_KO=["우연히 발명된 훌륭한 발명품들","새로운 쿠키 스타: 초콜릿 칩 쿠키","미국에 Wakefield 씨라는 한 유명한 요리사가 있었다. 1938년 어느 날, 그녀는 초콜릿 쿠키를 굽고 싶었다. 그러나 그녀는 초콜릿을 녹일 충분한 시간이 없었다. \"아하!\" 그래서 그녀는 초콜릿 바를 작은 조각들로 잘랐다. 그런 다음, 그녀는 그것들을 반죽과 섞었고, 그 쿠키 반죽을 오븐에 넣었다. Wakefield 씨가 오븐을 열었을 때, 그녀는 그 조각들이 반죽에 녹아들지 않은 것을 발견했다. \"아, 안 돼!\" 비록 그 조각들이 쿠키에 남아 있었지만, 그녀는 실망하지 않았다. 그녀의 새 쿠키들은 정말 맛있었다. 그녀가 초콜릿 '칩' 쿠키를 발명했다!","유리에서 안전함 찾기: 안전유리","1903년에 프랑스의 과학자인 Bénédictus 씨는 유리 플라스크 안에 있는 액체 플라스틱으로 실험을 하고 있었다. 그가 실수로 유리 플라스크를 쳐서 그것이 바닥에 떨어졌다. \"이런!\" 비록 유리 플라스크는 깨져서 조각났지만, 그것들은 플라스크 모양으로 여전히 함께 붙어 있었다! 어떻게 이런 일이 일어날 수 있었을까? 비밀은 플라스크 안에 있는 액체 플라스틱이었다. 이 발견이 안전유리의 발명으로 이어졌다. 요즘 우리는 어디서나 안전유리를 찾을 수 있다. 예를 들어, 그것은 자동차 창문에 사용된다. 만약 자동차 사고가 난다면 사람들은 날카로운 유리 조각들로부터 더 안전하다.","물 없이 세탁하기: 드라이클리닝","물 없이 옷을 세탁할 수 있을까? 정답은 '그렇다.'이다. 드라이클리닝은 옷을 세탁하기 위해 기름을 사용한다. 드라이클리닝에 관한 흥미로운 이야기가 있다. 1800년대에 프랑스에서 한 공장 노동자가 테이블보에 등유를 쏟았다. 공장 관리자인 Jolly 씨는 테이블보를 보고 무언가를 발견했다. \"와!\" 테이블보 위의 더러운 얼룩이 등유에 의해 깨끗해졌다! 그의 발견은 옷을 세탁하는 새로운 방법으로 이어졌다. 이제 드라이클리닝은 전 세계적으로 널리 사용된다.","이 훌륭한 발명품들은 우연히 나왔다. 일이 잘못될 때 실망하지 마라. 아마도 당신이 다음의 놀라운 발명가가 될 수도 있다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["how to play the recorder","tips to become an inventor","a solution to the noise problem","Juwon's silent recorder invention","Juwon's motivation for the invention"],"a":3,"ans":"Juwon's silent recorder invention","evs":[["Reporter: Juwon, you won the special prize in the invention contest. Great Job!","주원, 발명 대회에서 특별상을 받았네요. 정말 잘했어요!"],["Juwon: It's a recorder which doesn't bother other people.","다른 사람들을 방해하지 않는 리코더예요."]],"ev":["Reporter: Juwon, you won the special prize in the invention contest. Great Job!","주원, 발명 대회에서 특별상을 받았네요. 정말 잘했어요!"],"ow":["오답 ✕ — 'tips to become an inventor'(발명가가 되는 비결)는 나오지 않는다. 주원은 자기 발명품만 설명한다.","오답 ✕ — 'the noise problem'(소음 문제)의 해결책은 주원의 발명품이 해결하는 일부일 뿐이고, 대화의 중심은 주원이 만든 리코더 자체라서 정답으로는 부족하다.","오답 ✕ — 리코더 연주법은 나오지 않는다. 'It's a recorder which doesn't bother other people.'(다른 사람들을 방해하지 않는 리코더예요.)는 발명품 소개이다.","정답 ○ — 'What's your invention?'(발명품은 무엇인가요?)에 'It's a recorder which doesn't bother other people.'(다른 사람들을 방해하지 않는 리코더예요.)라고 답하고 작동 방식을 설명하므로 주원의 조용한 리코더 발명품이 주제이다.","오답 ✕ — 발명을 하게 된 동기는 대화에 나오지 않는다. 'I connected headphones to the recorder with a simple device.'(간단한 장치로 헤드폰을 리코더에 연결했어요.)처럼 만든 방법만 나온다."],"memo":["정답 ④: 주원의 조용한 리코더 발명품","근거: It's a recorder which doesn't bother other people.(다른 사람들을 방해하지 않는 리코더예요.)","함정: ⑤ 발명 동기는 대화에 없다 ✕"],"why":"주원이 만든, 다른 사람을 방해하지 않는 리코더 발명품에 대한 대화이다."},{"n":2,"q":"How does Juwon's invention work?","o":["It makes the recorder sound louder with a speaker.","A simple device sends the sound from the recorder to the headphones.","It changes the recorder into a smartphone.","It records the sound and plays it the next day.","It stops the recorder from making any sound."],"a":1,"ans":"A simple device sends the sound from the recorder to the headphones.","evs":[["Juwon: I connected headphones to the recorder with a simple device. The device sends the sound from the recorder to the headphones.","저는 간단한 장치로 헤드폰을 리코더에 연결했어요. 그 장치는 리코더의 소리를 헤드폰으로 보내요."]],"ev":["Juwon: I connected headphones to the recorder with a simple device. The device sends the sound from the recorder to the headphones.","저는 간단한 장치로 헤드폰을 리코더에 연결했어요. 그 장치는 리코더의 소리를 헤드폰으로 보내요."],"ow":["오답 ✕ — 소리를 크게 하는 것이 아니다. 'It's a recorder which doesn't bother other people.'(다른 사람들을 방해하지 않는 리코더예요.)이므로 시끄럽게 하지 않는다.","정답 ○ — 'The device sends the sound from the recorder to the headphones.'(그 장치는 리코더의 소리를 헤드폰으로 보내요.)라고 했다.","오답 ✕ — 스마트폰 이야기는 없다. 'I connected headphones to the recorder with a simple device.'(간단한 장치로 헤드폰을 리코더에 연결했어요.)라고 했다.","오답 ✕ — 녹음해서 다음 날 튼다는 말은 없다. 헤드폰을 쓰면 'only you can hear the sound'(오직 당신만 소리를 들을 수 있다)이다.","오답 ✕ — 소리를 없애는 것이 아니라 헤드폰으로 보낸다. 'The device sends the sound from the recorder to the headphones.'"],"memo":["정답 ②: 간단한 장치가 리코더 소리를 헤드폰으로 보낸다.","근거: The device sends the sound from the recorder to the headphones.(그 장치는 리코더의 소리를 헤드폰으로 보내요.)","함정: ⑤ 소리가 사라지는 것이 아니라 헤드폰으로 전달된다 ✕"],"why":"간단한 장치가 리코더 소리를 헤드폰으로 보내서 방해가 되지 않는다."}],"dlg":[["Reporter","Juwon, you won the special prize in the invention contest. Great Job!","주원, 발명 대회에서 특별상을 받았네요. 정말 잘했어요!"],["Juwon","Thank you. I'm proud of my invention.","감사합니다. 저는 제 발명품이 자랑스러워요."],["Reporter","What's your invention?","당신의 발명품은 무엇인가요?"],["Juwon","It's a recorder which doesn't bother other people.","다른 사람들을 방해하지 않는 리코더예요."],["Reporter","How does it work? Could you explain more about it?","그건 어떻게 작동하나요? 그것에 대해 더 설명해 줄 수 있나요?"],["Juwon","I connected headphones to the recorder with a simple device. The device sends the sound from the recorder to the headphones.","저는 간단한 장치로 헤드폰을 리코더에 연결했어요. 그 장치는 리코더의 소리를 헤드폰으로 보내요."],["Reporter","That's cool. When you wear the headphones, only you can hear the sound.","멋지네요. 헤드폰을 쓰면, 오직 당신만 그 소리를 들을 수 있군요."],["Juwon","Right. People can play the recorder any time. I'm sure that this invention will be very helpful.","맞아요. 사람들은 언제든지 리코더를 연주할 수 있어요. 저는 이 발명품이 아주 도움이 될 거라고 확신해요."]]},{"qs":[{"n":3,"q":"Why does the boy think the red rocket w ar racing.","그녀는 VR 자동차 경주를 체험하고 있어."],"ow":["정답 ○ — 'With a VR device, you can be a car racer.'(VR 기기를 가지고 너는 자동차 경주 선수가 될 수 있어.)라고 했다.","오답 ✕ — 비행기에 대한 언급은 없다. 'She is experiencing VR car racing.'(그녀는 VR 자동차 경주를 체험하고 있어.)이다.","오답 ✕ — 요리 이야기는 대화에 나오지 않는다. 체험하는 것은 'VR car racing'이다.","오답 ✕ — 유명 가수를 만난다는 말은 없다. 'you can be a car racer'(자동차 경주 선수가 될 수 있어)라고만 했다.","오답 ✕ — 화성 여행은 영화 '마션' 대화에 나오는 이야기이고 VR 대화와는 관련이 없다. VR 대화는 'car racer'(경주 선수)를 말한다."],"memo":["정답 ①: 자동차 경주 선수가 될 수 있다.","근거: With a VR device, you can be a car racer.(VR 기기를 가지고 자동차 경주 선수가 될 수 있어.)","함정: ⑤ 화성은 다른 대화(마션) 내용이다 ✕"],"why":"VR 기기로 자동차 경주 선수가 되는 체험을 할 수 있다."}],"dlg":[["B","What is that woman doing there?","저 여자분은 저기서 무엇을 하고 있나요?"],["W","She is experiencing VR car racing.","그녀는 VR 자동차 경주를 체험하고 있어."],["B","Could you explain more about it?","그것에 대해 더 설명해 주실 수 있나요?"],["W","With a VR device, you can be a car racer.","VR 기기를 가지고, 너는 자동차 경주 선수가 될 수 있어."],["B","That sounds fun. I'd like to try it.","재미있겠네요. 저도 해 보고 싶어요."],["W","Then stand in line there.","그럼 저기에 줄을 서렴."]]},{"qs":[{"n":5,"q":"What is the movie The Martian about?","o":["A space man who is left alone on Mars","A famous racer who wins a car race","A scientist who invents a new rocket","A boy who finds a lost dog","A factory worker who cleans clothes"],"a":0,"ans":"A space man who is left alone on Mars","evs":[["B: Sure. It's about a space man who is left alone on Mars.","물론이지. 그건 화성에 홀로 남겨진 우주 비행사에 관한 이야기야."]],"ev":["B: Sure. It's about a space man who is left alone on Mars.","물론이지. 그건 화성에 홀로 남겨진 우주 비행사에 관한 이야기야."],"ow":["정답 ○ — 'It's about a space man who is left alone on Mars.'(화성에 홀로 남겨진 우주 비행사에 관한 이야기야.)라고 했다.","오답 ✕ — 자동차 경주 이야기는 VR 대화에 나온다. 영화 '마션'은 'a space man'(우주 비행사)에 관한 이야기이다.","오답 ✕ — 로켓을 발명하는 과학자라는 말은 없다. 'a space man who is left alone on Mars'(화성에 홀로 남겨진 우주 비행사)이다.","오답 ✕ — 잃어버린 개를 찾는다는 말은 없다. 영화는 화성에 홀로 남겨진 사람의 이야기이다.","오답 ✕ — 옷을 세탁하는 공장 노동자는 드라이클리닝 글의 이야기이다. 대화에서는 'left alone on Mars'(화성에 홀로 남겨진)라고 했다."],"memo":["정답 ①: 화성에 홀로 남겨진 우주 비행사","근거: It's about a space man who is left alone on Mars.(화성에 홀로 남겨진 우주 비행사에 관한 이야기야.)","함정: 다른 대화·글의 내용(경주, 세탁)을 섞지 말기 ✕"],"why":"영화 '마션'은 화성에 홀로 남겨진 우주 비행사의 이야기이다."}],"dlg":[["A","Did you see the movie The Martian?","너 영화 '마션' 봤니?"],["B","Yes. It's a famous movie.","응. 그건 유명한 영화야."],["A","Could you explain more about it?","그것에 대해 더 설명해 줄 수 있어?"],["B","Sure. It's about a space man who is left alone on Mars.","물론이지. 그건 화성에 홀로 남겨진 우주 비행사에 관한 이야기야."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["The Popularity of Chocolate Chip Cookies","The Inventions of the Chef, Ms. Wakefield","Be Creative to Become a Famous Chef","How to Make Chocolate Chip Cookies","The Birth of Chocolate Chip Cookies"],"a":4,"ans":"The Birth of Chocolate Chip Cookies","evs":[["She invented chocolate CHIP cookies!","그녀가 초콜릿 '칩' 쿠키를 발명했다!"],["So, she cut a chocolate bar into small chips.","그래서 그녀는 초콜릿 바를 작은 조각들로 잘랐다."]],"ev":["She invented chocolate CHIP cookies!","그녀가 초콜릿 '칩' 쿠키를 발명했다!"],"ow":["오답 ✕ — 'Her new cookies were so delicious.'(그녀의 새 쿠키들은 정말 맛있었다.)라고 했지만 쿠키가 인기를 얻는 과정은 나오지 않는다.","오답 ✕ — 글은 Wakefield 씨가 만든 여러 발명품이 아니라, 초콜릿 칩 쿠키 하나가 생긴 이야기이다. 'She invented chocolate CHIP cookies!'","오답 ✕ — 유명한 요리사가 되는 방법을 말하는 글이 아니다. 'there was a famous cook, Ms. Wakefield'(유명한 요리사 Wakefield 씨가 있었다)는 이미 유명했다는 설명이다.","오답 ✕ — 만드는 방법을 단계별로 알려 주는 글이 아니라 우연히 생긴 이야기이다. 'she didn't have enough time to melt chocolate'(초콜릿을 녹일 시간이 없었다)가 계기였다.","정답 ○ — 시간이 없어서 초콜릿을 조각내 넣었고 'She invented chocolate CHIP cookies!'(초콜릿 '칩' 쿠키를 발명했다!)로 끝나므로 초콜릿 칩 쿠키가 탄생한 이야기이다."],"memo":["정답 ⑤: 초콜릿 칩 쿠키의 탄생(The Birth of Chocolate Chip Cookies)","근거: She invented chocolate CHIP cookies!(그녀가 초콜릿 '칩' 쿠키를 발명했다!)","함정: ④ 만드는 방법 설명이 아니라 우연히 생긴 이야기 ✕"],"why":"시간이 없어 초콜릿을 조각내 넣은 것이 초콜릿 칩 쿠키의 시작이었다."}],"pp":[["A New Cookie Star: Chocolate Chip Cookies","새로운 쿠키 스타: 초콜릿 칩 쿠키"],["In America, there was a famous cook, Ms. Wakefield.","미국에 Wakefield 씨라는 한 유명한 요리사가 있었다."],["One day in 1938, she wanted to bake chocolate cookies.","1938년 어느 날, 그녀는 초콜릿 쿠키를 굽고 싶었다."],["However, she didn't have enough time to melt chocolate.","그러나 그녀는 초콜릿을 녹일 충분한 시간이 없었다."],["\"Aha!\"","\"아하!\""],["So, she cut a chocolate bar into small chips.","그래서 그녀는 초콜릿 바를 작은 조각들로 잘랐다."],["Then, she mixed them with her dough and put the cookie dough into the oven.","그런 다음, 그녀는 그것들을 반죽과 섞었고, 그 쿠키 반죽을 오븐에 넣었다."],["When Ms. Wakefield opened the oven, she found that the chips were not melted into the dough.","Wakefield 씨가 오븐을 열었을 때, 그녀는 그 조각들이 반죽에 녹아들지 않은 것을 발견했다."],["\"Oh, no!\"","\"아, 안 돼!\""],["Although the chips remained in the cookies, she was not disappointed.","비록 그 조각들이 쿠키에 남아 있었지만, 그녀는 실망하지 않았다."],["Her new cookies were so delicious.","그녀의 새 쿠키들은 정말 맛있었다."],["She invented chocolate CHIP cookies!","그녀가 초콜릿 '칩' 쿠키를 발명했다!"]]},{"qs":[{"n":7,"q":"Bénédictus 씨의 발견에 대한 설명으로 알맞은 것은?","o":["유리 플라스크가 깨졌지만 조각들이 플라스크 모양으로 붙어 있었다.","액체 플라스틱이 유리를 녹여 버렸다.","유리 플라스크는 떨어졌지만 전혀 깨지지 않았다.","그는 일부러 플라스크를 바닥에 떨어뜨렸다.","그는 자동차 사고 때문에 안전유리를 발견했다."],"a":0,"ans":"유리 플라스크가 깨졌지만 조각들이 플라스크 모양으로 붙어 있었다.","evs":[["Although the glass flask was broken into pieces, they still held together in the shape of the flask!","비록 유리 플라스크는 깨져서 조각났지만, 그것들은 플라스크 모양으로 여전히 함께 붙어 있었다!"],["The secret was the liquid plastic in the flask.","비밀은 플라스크 안에 있는 액체 플라스틱이었다."]],"ev":["Although the glass flask was broken into pieces, they still held together in the shape of the flask!","비록 유리 플라스크는 깨져서 조각났지만, 그것들은 플라스크 모양으로 여전히 함께 붙어 있었다!"],"ow":["정답 ○ — 'Although the glass flask was broken into pieces, they still held together in the shape of the flask!'(유리 플라스크는 깨졌지만 조각들은 플라스크 모양으로 붙어 있었다!)와 일치한다.","오답 ✕ — 'The secret was the liquid plastic in the flask.'(비밀은 플라스크 안의 액체 플라스틱이었다.)이므로 조각들이 붙어 있게 한 것이 액체 플라스틱이다. 유리를 녹였다는 말은 없다.","오답 ✕ — 'the glass flask was broken into pieces'(유리 플라스크는 깨져서 조각났다)라고 했으므로 깨지지 않은 것이 아니다.","오답 ✕ — 'He accidentally hit the glass flask, and it fell on the floor.'(그가 실수로 유리 플라스크를 쳐서 바닥에 떨어졌다.)라고 했으므로 실수였지 일부러가 아니다.","오답 ✕ — 발견은 실험 중 플라스크가 떨어진 일 때문이다. 자동차는 'it is used for car windows'(자동차 창문에 사용된다)처럼 나중에 쓰이는 곳이다."],"memo":["정답 ①: 플라스크가 깨졌지만 조각들이 모양대로 붙어 있었다.","근거: they still held together in the shape of the flask(조각들이 플라스크 모양으로 여전히 붙어 있었다)","함정: ④ accidentally(실수로)를 '일부러'로 바꾼 보기 ✕"],"why":"액체 플라스틱 덕분에 깨진 유리 조각들이 붙어 있는 것을 발견했다."},{"n":8,"q":"안전유리에 대한 요약문이다. 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["plastic - cars","water - houses","paper - clothes","oil - factories","chocolate - ovens"],"a":0,"ans":"plastic - cars","evs":[["The secret was the liquid plastic in the flask.","비밀은 플라스크 안에 있는 액체 플라스틱이었다."],["For example, it is used for car windows.","예를 들어, 그것은 자동차 창문에 사용된다."]],"ev":["The secret was the liquid plastic in the flask.","비밀은 플라스크 안에 있는 액체 플라스틱이었다."],"ow":["정답 ○ — 'The secret was the liquid plastic in the flask.'(비밀은 액체 플라스틱이었다.)와 'it is used for car windows'(자동차 창문에 사용된다)에 맞는 plastic - cars이다.","오답 ✕ — 'water'(물)가 아니라 'liquid plastic'(액체 플라스틱)이 비밀이었고, 안전유리는 'car windows'(자동차 창문)에 쓰이므로 houses도 틀리다.","오답 ✕ — 'paper'와 'clothes'는 글에 나오지 않는다. 안전유리 이야기에서는 'liquid plastic'(액체 플라스틱)이 나온다.","오답 ✕ — 'oil'(기름)은 드라이클리닝 이야기에 나오고, 'factories'도 안전유리와 관련이 없다.","오답 ✕ — 'chocolate'과 'ovens'는 쿠키 이야기에 나온다. 안전유리 글과 관련이 없다."],"memo":["정답 ①: plastic - cars","근거: The secret was the liquid plastic in the flask.(비밀은 액체 플라스틱이었다.) / it is used for car windows(자동차 창문에 사용된다)","함정: ④ oil은 드라이클리닝 글 내용 ✕"],"why":"액체 플라스틱이 안전유리의 비밀이며, 자동차 창문 등에 쓰인다.","sum":"Safety glass was found because of liquid (A)________ in a glass flask, and now it is used for (B)________ windows.","lab":"완성된 요약문 : "}],"pp":[["Finding Safety in Glass: Safety Glass","유리에서 안전함 찾기: 안전유리"],["In 1903, a French scientist, Mr. Bénédictus, was experimenting with liquid plastic in a glass flask.","1903년에 프랑스의 과학자인 Bénédictus 씨는 유리 플라스크 안에 있는 액체 플라스틱으로 실험을 하고 있었다."],["He accidentally hit the glass flask, and it fell on the floor.","그가 실수로 유리 플라스크를 쳐서 그것이 바닥에 떨어졌다."],["\"Oops!\"","\"이런!\""],["Although the glass flask was broken into pieces, they still held together in the shape of the flask!",
