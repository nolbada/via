el (traveling 아님)"}]}, {"n": 5, "tag": null, "en": "How did it move without pedals? Well, riders simply pushed the bicycle forward with their foots.", "ko": "페달 없이 어떻게 움직였을까? 음, 타는 사람들이 단순히 발로 자전거를 앞으로 밀었다.", "ok": false, "foot": [], "fixes": [{"wrong": "foots", "right": "feet", "partial": false, "at": [15], "point": "불규칙 복수형: foot의 복수형은 feet", "topic": "불규칙 복수형", "memo": "foot의 복수형은 feet"}]}, {"n": 6, "tag": null, "en": "The present-day bicycle is the result of much inventors' work on the 19th century.", "ko": "오늘날의 자전거는 19세기 많은 발명가들의 노력의 결과이다.", "ok": false, "foot": [], "fixes": [{"wrong": "much", "right": "many", "partial": false, "at": [7], "point": "수량 형용사 many/much: 복수명사 inventors 앞에는 many 사용", "topic": "수량 형용사 many/much", "memo": "복수명사 inventors 앞에는 many 사용"}, {"wrong": "on", "right": "in", "partial": false, "at": [10], "point": "기본전치사: '~세기에'는 in the 19th century", "topic": "기본전치사", "memo": "'~세기에'는 in the 19th century"}]}, {"n": 7, "tag": "수정액 발명", "en": "Whiteout was invented by Bette Graham. In 1956, Graham were working at a bank in Texas, USA.", "ko": "수정액은 Bette Graham에 의해 발명되었다. 1956년 Graham은 미국 텍사스의 한 은행에서 일하고 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [9], "point": "be동사의 수일치: 단수 주어 Graham에는 was 사용", "topic": "be동사의 수일치", "memo": "단수 주어 Graham에는 was 사용"}]}, {"n": 8, "tag": null, "en": "At that time, people had to retype the whole pages when they made even an small mistake.", "ko": "그 당시, 사람들은 작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다.", "ok": false, "foot": [], "fixes": [{"wrong": "pages", "right": "page", "partial": false, "at": [9], "point": "명사의 단수형: the whole 뒤에는 단수명사 page 사용", "topic": "명사의 단수형", "memo": "the whole 뒤에는 단수명사 page 사용"}, {"wrong": "an", "right": "a", "partial": false, "at": [14], "point": "관사 a/an: 자음 소리 small 앞에는 a 사용", "topic": "관사 a/an", "memo": "자음 소리 small 앞에는 a 사용"}]}, {"n": 9, "tag": null, "en": "Graham was a bad typist, so she needed a solution.", "ko": "Graham은 타자 실력이 좋지 않아서 해결책이 필요했다.", "ok": true, "foot": [], "fixes": []}, {"n": 10, "tag": null, "en": "One day, Graham saw some window painters. When them made a mistake, they corrected it by simply painting over it.", "ko": "어느 날 Graham은 창문을 칠하는 페인트공들을 보았다. 그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다.", "ok": false, "foot": [], "fixes": [{"wrong": "them", "right": "they", "partial": false, "at": [8], "point": "인칭대명사의 주격: 주어 자리에는 주격 they 사용", "topic": "인칭대명사의 주격", "memo": "주어 자리에는 주격 they 사용"}]}, {"n": 11, "tag": null, "en": "The next days, she made her own white paint and used it to corrects her typing mistakes. Surprisingly, nobody noticed!", "ko": "그다음 날 그녀는 자신만의 흰색 페인트를 만들어 오타를 수정하는 데 사용했다. 놀랍게도, 아무도 알아차리지 못했다!", "ok": false, "foot": [], "fixes": [{"wrong": "days", "right": "day", "partial": false, "at": [2], "point": "명사의 단수형: '다음 날'은 단수 the next day", "topic": "명사의 단수형", "memo": "'다음 날'은 단수 the next day"}, {"wrong": "corrects", "right": "correct", "partial": false, "at": [13], "point": "to부정사: to 뒤에는 동사원형 correct 사용", "topic": "to부정사", "memo": "to 뒤에는 동사원형 correct 사용"}]}, {"n": 12, "tag": null, "en": "Soon, everybody at the bank began using it.", "ko": "곧 은행의 모든 사람들이 그것을 사용하기 시작했다.", "ok": true, "foot": [], "fixes": []}, {"n": 13, "tag": "웹캠 발명", "en": "The first webcam was invented to watch a coffee pots.", "ko": "최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다.", "ok": false, "foot": [], "fixes": [{"wrong": "pots", "right": "pot", "partial": false, "at": [9], "point": "명사의 단수형: a 뒤에는 단수명사 pot 사용", "topic": "명사의 단수형", "memo": "a 뒤에는 단수명사 pot 사용"}]}, {"n": 14, "tag": null, "en": "In 1991, Dr. Quentin Stafford-Fraser and Dr. Paul Jardetzky were working at a computer lab in England.", "ko": "1991년 Quentin Stafford-Fraser 박사와 Paul Jardetzky 박사는 영국의 한 컴퓨터 연구소에서 일하고 있었다.", "ok": true, "foot": [], "fixes": []}, {"n": 15, "tag": null, "en": "To work more good, they needed lots of coffee. However, there was only one coffee machine in the building.", "ko": "일을 더 잘하기 위해, 그들은 많은 양의 커피가 필요했다. 하지만 건물에는 커피 머신이 한 대뿐이었다.", "ok": false, "foot": [], "fixes": [{"wrong": "more good", "right": "better", "partial": false, "at": [2], "point": "비교급: good의 비교급은 better", "topic": "비교급", "memo": "good의 비교급은 better"}]}, {"n": 16, "tag": null, "en": "So, they had to makes many disappointed trips to the empty coffee pot.", "ko": "그래서 그들은 비어 있는 커피포트로 실망스러운 발걸음을 많이 해야 했다.", "ok": false, "foot": [], "fixes": [{"wrong": "makes", "right": "make", "partial": false, "at": [4], "point": "to부정사: to 뒤에는 동사원형 make 사용", "topic": "to부정사", "memo": "to 뒤에는 동사원형 make 사용"}, {"wrong": "disappointed", "right": "disappointing", "partial": false, "at": [6], "point": "현재분사와 과거분사: trips가 실망을 주므로 disappointing 사용", "topic": "현재분사와 과거분사", "memo": "trips가 실망을 주므로 disappointing 사용"}]}];var PP=[["Bicycle", "자전거", 1], ["Mt. Tambora, a volcano in Indonesia, exploded in 1815. The explosion created a huge cloud of ash, so crops failed around the world.", "1815년 인도네시아의 화산인 탐보라산이 폭발했다. 이 폭발은 거대한 재 구름을 만들었고, 그래서 전 세계적으로 농작물이 자라지 못했다.", 1], ["As a result, people didn't have enough food to eat.", "그 결과, 사람들은 먹을 음식이 충분하지 않았다.", 0], ["Surprisingly, this made traveling difficult.", "놀랍게도, 이로 인해 이동이 어려워졌다.", 0], ["Why?", "왜일까?", 0], ["In those days, people rode horses, but many horses were killed for food.", "당시, 사람들은 말을 탔는데, 많은 말들이 식용으로 죽임을 당했다.", 0], ["People needed a new way to travel, and Karl von Drais invented the first bicycle in Germany in 1817. Drais's bicycle had two wooden wheels but no pedals.", "사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다. Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다.", 1], ["How did it move without pedals?", "페달 없이 어떻게 움직였을까?", 0], ["Well, riders simply pushed the bicycle forward with their feet.", "음, 타는 사람들이 단순히 발로 자전거를 앞으로 밀었다.", 0], ["The present-day bicycle is the result of many inventors' work in the 19th century.", "오늘날의 자전거는 19세기 많은 발명가들의 노력의 결과이다.", 0], ["Whiteout", "수정액", 1], ["Whiteout was invented by Bette Graham.", "수정액은 Bette Graham에 의해 발명되었다.", 1], ["In 1956, Graham was working at a bank in Texas, USA.", "1956년 Graham은 미국 텍사스의 한 은행에서 일하고 있었다.", 0], ["At that time, people had to retype the whole page when they made even a small mistake.", "그 당시, 사람들은 작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다.", 0], ["Graham was a bad typist, so she needed a solution.", "Graham은 타자 실력이 좋지 않아서 해결책이 필요했다.", 0], ["One day, Graham saw some window painters.", "어느 날 Graham은 창문을 칠하는 페인트공들을 보았다.", 1], ["When they made a mistake, they corrected it by simply painting over it.", "그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다.", 0], ["The next day, she made her own white paint and used it to correct her typing mistakes.", "그다음 날 그녀는 자신만의 흰색 페인트를 만들어 오타를 수정하는 데 사용했다.", 0], ["Surprisingly, nobody noticed!", "놀랍게도, 아무도 알아차리지 못했다!", 0], ["Soon, everybody at the bank began using it.", "곧 은행의 모든 사람들이 그것을 사용하기 시작했다.", 0], ["Webcam", "웹캠", 1], ["The first webcam was invented to watch a coffee pot.", "최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다.", 1], ["In 1991, Dr. Quentin Stafford-Fraser and Dr. Paul Jardetzky were working at a computer lab in England.", "1991년 Quentin Stafford-Fraser 박사와 Paul Jardetzky 박사는 영국의 한 컴퓨터 연구소에서 일하고 있었다.", 0], ["To work better, they needed lots of coffee.", "일을 더 잘하기 위해, 그들은 많은 양의 커피가 필요했다.", 0], ["However, there was only one coffee machine in the building.", "하지만 건물에는 커피 머신이 한 대뿐이었다.", 0], ["So, they had to make many disappointing trips to the empty coffee pot.", "그래서 그들은 비어 있는 커피포트로 실망스러운 발걸음을 많이 해야 했다.", 0]];var RNUM=24;var TITLE_EN="Necessity Is the Mother of Invention";var PASS_EN=["Necessity Is the Mother of Invention", "Bicycle", "Mt. Tambora, a volcano in Indonesia, exploded in 1815. The explosion created a huge cloud of ash, so crops failed around the world. As a result, people didn't have enough food to eat. Surprisingly, this made traveling difficult. Why? In those days, people rode horses, but many horses were killed for food.", "People needed a new way to travel, and Karl von Drais invented the first bicycle in Germany in 1817. Drais's bicycle had two wooden wheels but no pedals. How did it move without pedals? Well, riders simply pushed the bicycle forward with their feet. The present-day bicycle is the result of many inventors' work in the 19th century.", "Whiteout", "Whiteout was invented by Bette Graham. In 1956, Graham was working at a bank in Texas, USA. At that time, people had to retype the whole page when they made even a small mistake. Graham was a bad typist, so she needed a solution.", "One day, Graham saw some window painters. When they made a mistake, they corrected it by simply painting over it. The next day, she made her own white paint and used it to correct her typing mistakes. Surprisingly, nobody noticed! Soon, everybody at the bank began using it.", "Webcam", "The first webcam was invented to watch a coffee pot. In 1991, Dr. Quentin Stafford-Fraser and Dr. Paul Jardetzky were working at a computer lab in England. To work better, they needed lots of coffee. However, there was only one coffee machine in the building. So, they had to make many disappointing trips to the empty coffee pot."];var PASS_KO=["필요는 발명의 어머니이다", "자전거", "1815년 인도네시아의 화산인 탐보라산이 폭발했다. 이 폭발은 거대한 재 구름을 만들었고, 그래서 전 세계적으로 농작물이 자라지 못했다. 그 결과, 사람들은 먹을 음식이 충분하지 않았다. 놀랍게도, 이로 인해 이동이 어려워졌다. 왜일까? 당시, 사람들은 말을 탔는데, 많은 말들이 식용으로 죽임을 당했다.", "사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다. Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다. 페달 없이 어떻게 움직였을까? 음, 타는 사람들이 단순히 발로 자전거를 앞으로 밀었다. 오늘날의 자전거는 19세기 많은 발명가들의 노력의 결과이다.", "수정액", "수정액은 Bette Graham에 의해 발명되었다. 1956년 Graham은 미국 텍사스의 한 은행에서 일하고 있었다. 그 당시, 사람들은 작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다. Graham은 타자 실력이 좋지 않아서 해결책이 필요했다.", "어느 날 Graham은 창문을 칠하는 페인트공들을 보았다. 그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다. 그다음 날 그녀는 자신만의 흰색 페인트를 만들어 오타를 수정하는 데 사용했다. 놀랍게도, 아무도 알아차리지 못했다! 곧 은행의 모든 사람들이 그것을 사용하기 시작했다.", "웹캠", "최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다. 1991년 Quentin Stafford-Fraser 박사와 Paul Jardetzky 박사는 영국의 한 컴퓨터 연구소에서 일하고 있었다. 일을 더 잘하기 위해, 그들은 많은 양의 커피가 필요했다. 하지만 건물에는 커피 머신이 한 대뿐이었다. 그래서 그들은 비어 있는 커피포트로 실망스러운 발걸음을 많이 해야 했다."];
