<style>

.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Pollution is a big problem. Luckily, three superheroes is working to protect the environment.","ko":"오염은 큰 문제입니다. 다행히, 세 명의 슈퍼히어로가 환경을 보호하기 위해서 일하고 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[8],"point":"be동사의 수일치: 복수 주어 superheroes에는 are 사용","topic":"be동사의 수일치","memo":"복수 주어 superheroes에는 are 사용"}]},{"n":2,"tag":null,"en":"They wants to make the world clean. Will you joins them?","ko":"그들은 세상을 깨끗하게 만들고 싶어 합니다. 당신도 그들과 함께하시겠어요?","ok":false,"foot":[],"fixes":[{"wrong":"wants","right":"want","partial":false,"at":[1],"point":"일반동사의 수일치: 주어 They는 복수: want (wants 아님)","topic":"일반동사의 수일치","memo":"주어 They는 복수: want (wants 아님)"},{"wrong":"joins","right":"join","partial":false,"at":[9],"point":"조동사 뒤 동사원형: Will 뒤에는 동사원형: join (joins 아님)","topic":"조동사 뒤 동사원형","memo":"Will 뒤에는 동사원형: join (joins 아님)"}]},{"n":3,"tag":null,"en":"Hi! I'm Recycle Wizard.","ko":"안녕하세요! 저는 재활용 마법사예요.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"People waste too much resources. But recycling can saves them.","ko":"사람들은 너무 많은 자원을 낭비해요. 하지만 재활용은 그것들을 절약할 수 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"much","right":"many","partial":false,"at":[3],"point":"수량 형용사 many/much: 복수명사 resources 앞에는 many 사용","topic":"수량 형용사 many/much","memo":"복수명사 resources 앞에는 many 사용"},{"wrong":"saves","right":"save","partial":false,"at":[8],"point":"조동사 can: 조동사 can 뒤에는 동사원형 save 사용","topic":"조동사 can","memo":"조동사 can 뒤에는 동사원형 save 사용"}]},{"n":5,"tag":null,"en":"For example, recycling 1,000 kilograms for paper can save about 19 tree and 29,000 liters of water.","ko":"예를 들어, 종이 1,000kg을 재활용하는 것은 약 19그루의 나무와 29,000리터의 물을 절약할 수 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"for","right":"of","partial":false,"at":[5],"point":"수량 표현: '~킬로그램의 종이'는 kilograms of 사용","topic":"수량 표현","memo":"'~킬로그램의 종이'는 kilograms of 사용"},{"wrong":"tree","right":"trees","partial":false,"at":[11],"point":"명사의 복수형: 숫자 19 뒤에는 복수명사 trees 사용","topic":"명사의 복수형","memo":"숫자 19 뒤에는 복수명사 trees 사용"}]},{"n":6,"tag":null,"en":"Do you want to being a wizard at recycling? Then you should recycle proper!","ko":"여러분은 재활용 마법사가 되고 싶나요? 그렇다면 재활용을 제대로 해야 합니다!","ok":false,"foot":[],"fixes":[{"wrong":"being","right":"be","partial":false,"at":[4],"point":"to부정사: to 뒤에는 동사원형: to be (being 아님)","topic":"to부정사","memo":"to 뒤에는 동사원형: to be (being 아님)"},{"wrong":"proper","right":"properly","partial":false,"at":[13],"point":"형용사와 부사: 동사 recycle을 꾸미는 말은 부사 properly 사용","topic":"형용사와 부사","memo":"동사 recycle을 꾸미는 말은 부사 properly 사용"}]},{"n":7,"tag":null,"en":"Put plastic, paper, food waste, and glass in the correct bins.","ko":"플라스틱, 종이, 음식물 쓰레기, 그리고 유리를 알맞은 쓰레기통에 넣으세요.","ok":true,"foot":[],"fixes":[]},{"n":8,"tag":null,"en":"Look of the waste below. Draw a line from each pieces of waste to the right bin.","ko":"아래 쓰레기를 보세요. 각 쓰레기 조각에서 알맞은 쓰레기통까지 선을 그어 보세요.","ok":false,"foot":[],"fixes":[{"wrong":"of","right":"at","partial":false,"at":[1],"point":"기본전치사: '~을 보다'는 look at 사용","topic":"기본전치사","memo":"'~을 보다'는 look at 사용"},{"wrong":"pieces","right":"piece","partial":false,"at":[10],"point":"each + 단수명사: each 뒤에는 단수명사 piece 사용","topic":"each + 단수명사","memo":"each 뒤에는 단수명사 piece 사용"}]},{"n":9,"tag":null,"en":"Good job!","ko":"잘했어요!","ok":true,"foot":[],"fixes":[]},{"n":10,"tag":null,"en":"I'm Fashion Clever.","ko":"저는 패션 똑똑이예요.","ok":true,"foot":[],"fixes":[]},{"n":11,"tag":null,"en":"People throws away clothes too often. They become waste and hurt the environment.","ko":"사람들은 옷을 너무 자주 버려요. 그것들은 쓰레기가 되어 환경을 해쳐요.","ok":false,"foot":[],"fixes":[{"wrong":"throws","right":"throw","partial":false,"at":[1],"point":"일반동사의 수일치: 복수 주어 People에는 throw 사용","topic":"일반동사의 수일치","memo":"복수 주어 People에는 throw 사용"}]},{"n":12,"tag":null,"en":"Did you knew that some clothes take over 200 year to break down? Don't buy too much clothes.","ko":"몇몇 옷들은 분해되는 데 200년이 넘게 걸린다는 것을 알고 있었나요? 너무 많은 옷을 사지 마세요.","ok":false,"foot":[],"fixes":[{"wrong":"knew","right":"know","partial":false,"at":[2],"point":"일반동사의 과거 의문문: Did 뒤에는 동사원형 know 사용","topic":"일반동사의 과거 의문문","memo":"Did 뒤에는 동사원형 know 사용"},{"wrong":"year","right":"years","partial":false,"at":[9],"point":"명사의 복수형: 숫자 200 뒤에는 복수명사 years 사용","topic":"명사의 복수형","memo":"숫자 200 뒤에는 복수명사 years 사용"},{"wrong":"much","right":"many","partial":false,"at":[16],"point":"수량 형용사 many/much: 복수명사 clothes 앞에는 many 사용","topic":"수량 형용사 many/much","memo":"복수명사 clothes 앞에는 many 사용"}]},{"n":13,"tag":null,"en":"Wear you clothes for a long time. You can also create new items from your old clothes!","ko":"여러분의 옷을 오랫동안 입으세요. 여러분의 헌 옷으로 새로운 물건을 만들 수도 있어요!","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[1],"point":"인칭대명사의 소유격: clothes 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"clothes 앞에는 소유격 your 사용"}]},{"n":14,"tag":null,"en":"Let's make old clothes usefully.","ko":"헌 옷을 유용하게 만들어 봅시다.","ok":false,"foot":[],"fixes":[{"wrong":"usefully","right":"useful","partial":false,"at":[4],"point":"형용사와 부사: make A B에서 B 자리에는 형용사 useful 사용","topic":"형용사와 부사","memo":"make A B에서 B 자리에는 형용사 useful 사용"}]},{"n":15,"tag":null,"en":"There are some items below. What can you make with this old clothes?","ko":"아래에 몇 가지 물건들이 있어요. 여러분은 이 헌 옷들로 무엇을 만들 수 있나요?","ok":false,"foot":[],"fixes":[{"wrong":"this","right":"these","partial":false,"at":[10],"point":"지시형용사: 복수명사 clothes 앞에는 these 사용","topic":"지시형용사","memo":"복수명사 clothes 앞에는 these 사용"}]},{"n":16,"tag":null,"en":"Match the old clothes with the correct new items.","ko":"헌 옷과 알맞은 새 물건을 연결해 보세요.","ok":true,"foot":[],"fixes":[]},{"n":17,"tag":null,"en":"Now you can be clever at fashion too!","ko":"이제 여러분도 패션에 영리해질 수 있어요!","ok":true,"foot":[],"fixes":[]}];var PP=[["Pollution is a big problem.","오염은 큰 문제입니다.",1],["Luckily, three superheroes are working to protect the environment.","다행히, 세 명의 슈퍼히어로가 환경을 보호하기 위해서 일하고 있습니다.",0],["They want to make the world clean.","그들은 세상을 깨끗하게 만들고 싶어 합니다.",0],["Will you join them?","당신도 그들과 함께하시겠어요?",0],["Hi!","안녕하세요!",1],["I'm Recycle Wizard.","저는 재활용 마법사예요.",0],["People waste too many resources.","사람들은 너무 많은 자원을 낭비해요.",1],["But recycling can save them.","하지만 재활용은 그것들을 절약할 수 있어요.",0],["For example, recycling 1,000 kilograms of paper can save about 19 trees and 29,000 liters of water.","예를 들어, 종이 1,000kg을 재활용하는 것은 약 19그루의 나무와 29,000리터의 물을 절약할 수 있어요.",0],["Do you want to be a wizard at recycling?","여러분은 재활용 마법사가 되고 싶나요?",0],["Then you should recycle properly!","그렇다면 재활용을 제대로 해야 합니다!",0],["Put plastic, paper, food waste, and glass in the correct bins.","플라스틱, 종이, 음식물 쓰레기, 그리고 유리를 알맞은 쓰레기통에 넣으세요.",0],["Look at the waste below.","아래 쓰레기를 보세요.",1],["Draw a line from each piece of waste to the right bin.","각 쓰레기 조각에서 알맞은 쓰레기통까지 선을 그어 보세요.",0],["Good job!","잘했어요!",1],["I'm Fashion Clever.","저는 패션 똑똑이예요.",1],["People throw away clothes too often.","사람들은 옷을 너무 자주 버려요.",1],["They become waste and hurt the environment.","그것들은 쓰레기가 되어 환경을 해쳐요.",0],["Did you know that some clothes take over 200 years to break down?","몇몇 옷들은 분해되는 데 200년이 넘게 걸린다는 것을 알고 있었나요?",0],["Don't buy too many clothes.","너무 많은 옷을 사지 마세요.",0],["Wear your clothes for a long time.","여러분의 옷을 오랫동안 입으세요.",0],["You can also create new items from your old clothes!","여러분의 헌 옷으로 새로운 물건을 만들 수도 있어요!",0],["Let's make old clothes useful.","헌 옷을 유용하게 만들어 봅시다.",0],["There are some items below.","아래에 몇 가지 물건들이 있어요.",1],["What can you make with these old clothes?","여러분은 이 헌 옷들로 무엇을 만들 수 있나요?",0],["Match the old clothes with the correct new items.","헌 옷과 알맞은 새 물건을 연결해 보세요.",0],["Now you can be clever at fashion too!","이제 여러분도 패션에 영리해질 수 있어요!",1]];var RNUM=61;var TITLE_EN="You're an Environmental Superhero!";var PASS_EN=["You're an Environmental Superhero!","Pollution is a big problem. Luckily, three superheroes are working to protect the environment. They want to make the world clean. Will you join them?","Hi! I'm Recycle Wizard.","People waste too many resources. But recycling can save them. For example, recycling 1,000 kilograms of paper can save about 19 trees and 29,000 liters of water. Do you want to be a wizard at recycling? Then you should recycle properly! Put plastic, paper, food waste, and glass in the correct bins.","Look at the waste below. Draw a line from each piece of waste to the right bin.","Good job!","I'm Fashion Clever.","People throw away clothes too often. They become waste and hurt the environment. Did you know that some clothes take over 200 years to break down? Don't buy too many clothes. Wear your clothes for a long time. You can also create new items from your old clothes! Let's make old clothes useful.","There are some items below. What can you make with these old clothes? Match the old clothes with the correct new items.","Now you can be clever at fashion too!"];var PASS_KO=["당신은 환경 슈퍼히어로입니다!","오염은 큰 문제입니다. 다행히, 세 명의 슈퍼히어로가 환경을 보호하기 위해서 일하고 있습니다. 그들은 세상을 깨끗하게 만들고 싶어 합니다. 당신도 그들과 함께하시겠어요?","안녕하세요! 저는 재활용 마법사예요.","사람들은 너무 많은 자원을 낭비해요. 하지만 재활용은 그것들을 절약할 수 있어요. 예를 들어, 종이 1,000kg을 재활용하는 것은 약 19그루의 나무와 29,000리터의 물을 절약할 수 있어요. 여러분은 재활용 마법사가 되고 싶나요? 그렇다면 재활용을 제대로 해야 합니다! 플라스틱, 종이, 음식물 쓰레기, 그리고 유리를 알맞은 쓰레기통에 넣으세요.","아래 쓰레기를 보세요. 각 쓰레기 조각에서 알맞은 쓰레기통까지 선을 그어 보세요.","잘했어요!","저는 패션 똑똑이예요.","사람들은 옷을 너무 자주 버려요. 그것들은 쓰레기가 되어 환경을 해쳐요. 몇몇 옷들은 분해되는 데 200년이 넘게 걸린다는 것을 알고 있었나요? 너무 많은 옷을 사지 마세요. 여러분의 옷을 오랫동안 입으세요. 여러분의 헌 옷으로 새로운 물건을 만들 수도 있어요! 헌 옷을 유용하게 만들어 봅시다.","아래에 몇 가지 물건들이 있어요. 여러분은 이 헌 옷들로 무엇을 만들 수 있나요? 헌 옷과 알맞은 새 물건을 연결해 보세요.","이제 여러분도 패션에 영리해질 수 있어요!"];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["환경오염의 심각성","대체 에너지 개발","온실가스 줄이기","지구의 날 소개","에너지 절약 방법들"],"a":3,"ans":"지구의 날 소개","evs":[["G: Hey, Tom! Do you know about Earth Day?","안녕, 톰! 너 지구의 날에 대해 알고 있니?"],["G: It's a special day on April 22. People take part in a global event.","4월 22일에 있는 특별한 날이야. 사람들이 전 세계적인 행사에 참여해."]],"ev":["G: Hey, Tom! Do you know about Earth Day?","안녕, 톰! 너 지구의 날에 대해 알고 있니?"],"ow":["오답 ✕ — 환경오염이 얼마나 심각한지는 대화에서 다루지 않는다. 'Do you know about Earth Day?'(지구의 날에 대해 알고 있니?)로 시작해 행사를 소개한다.","오답 ✕ — 대체 에너지를 개발한다는 말은 없다. 'It can save a lot of energy.'(많은 에너지를 절약할 수 있어.)는 행사의 효과 중 하나일 뿐이다.","오답 ✕ — 'it can reduce greenhouse gases'(온실가스를 줄일 수 있어)는 지구의 날 행사의 효과 일부이지 대화 전체의 주제는 아니라서 너무 좁다.","정답 ○ — 'Do you know about Earth Day?'(지구의 날에 대해 알고 있니?)와 'It's a special day on April 22.'(4월 22일에 있는 특별한 날이야.)처럼 지구의 날이 무엇이고 무엇을 하는지 소개하는 대화이다.","오답 ✕ — 'It can save a lot of energy.'(많은 에너지를 절약할 수 있어.)가 나오지만 에너지 절약 방법을 여러 가지 알려 주지는 않는다. 지구의 날이라는 하나의 행사를 소개한다."],"memo":["정답 ④: 지구의 날 소개","근거: Do you know about Earth Day?(지구의 날에 대해 알고 있니?) / It's a special day on April 22.(4월 22일에 있는 특별한 날이야.)","함정: ③ 온실가스 감소는 행사의 효과일 뿐, 대화 전체 주제는 지구의 날이다 ✕"],"why":"지구의 날이 무엇이고 어떤 일을 하는지 소개하는 대화이다."},{"n":2,"q":"According to the dialog, how can the Earth Day event help the environment?","o":["It can make more trees grow in April.","It can stop all pollution in ten minutes.","It can save energy and reduce greenhouse gases.","It can make the water in the sea clean.","It can give people new lights for free."],"a":2,"ans":"It can save energy and reduce greenhouse gases.","evs":[["It can save a lot of energy. Also, it can reduce greenhouse gases.","많은 에너지를 절약할 수 있어. 또 온실가스도 줄일 수 있고."]],"ev":["It can save a lot of energy. Also, it can reduce greenhouse gases.","많은 에너지를 절약할 수 있어. 또 온실가스도 줄일 수 있고."],"ow":["오답 ✕ — 나무에 대한 언급이 없다. 4월은 'a special day on April 22'(4월 22일에 있는 특별한 날)라는 날짜로만 나온다.","오답 ✕ — 오염을 모두 멈춘다는 말은 없다. 효과는 'It can save a lot of energy.'(많은 에너지를 절약할 수 있어.)이다.","정답 ○ — 'It can save a lot of energy. Also, it can reduce greenhouse gases.'(많은 에너지를 절약할 수 있어. 또 온실가스도 줄일 수 있고.)라고 했다.","오답 ✕ — 바닷물에 대한 언급은 없다. 가장 가까운 문장은 'it can reduce greenhouse gases'(온실가스를 줄일 수 있어)이다.","오답 ✕ — 전등을 무료로 준다는 말은 없다. 'some people turn on the lights for ten minutes'(어떤 사람들은 10분 동안 전등을 켜)처럼 행사에 참여하는 방법이 나올 뿐이다."],"memo":["정답 ③: 에너지를 절약하고 온실가스를 줄일 수 있다.","근거: It can save a lot of energy. Also, it can reduce greenhouse gases.(많은 에너지를 절약하고 온실가스도 줄일 수 있어.)","함정: ② 오염을 '모두 멈춘다'는 말은 없다 ✕"],"why":"지구의 날 행사는 에너지를 절약하고 온실가스를 줄여 환경에 도움이 된다."}],"dlg":[["G","Hey, Tom! Do you know about Earth Day?","안녕, 톰! 너 지구의 날에 대해 알고 있니?"],["B","No, I don't. What is it?","아니, 몰라. 그게 뭐야?"],["G","It's a special day on April 22. People take part in a global event.","4월 22일에 있는 특별한 날이야. 사람들이 전 세계적인 행사에 참여해."],["B","I see. What do they do?","그렇구나. 사람들은 뭘 하는데?"],["G","They do many things. For example, some people turn on the lights for ten minutes.","많은 걸 해. 예를 들어, 어떤 사람들은 10분 동안 전등을 켜."],["B","Wow! But how can that help the environment?","와! 그런데 그게 어떻게 환경에 도움이 될 수 있어?"],["G","It can save a lot of energy. Also, it can reduce greenhouse gases. Why don't we take part in the event?","많은 에너지를 절약할 수 있어. 또 온실가스도 줄일 수 있고. 우리도 그 행사에 참여하는 게 어때?"],["B","That's a great idea. Let's do it.","좋은 생각이야. 그렇게 하자."]]},{"qs":[{"n":3,"q":"What can we reduce through a zero waste shop?","o":["container","shampoo","waste","some snacks","bags"],"a":2,"ans":"waste","evs":[["G: They don't sell items in containers, so you can reduce waste.","그곳은 물건을 용기에 담아서 팔지 않아서 쓰레기를 줄일 수 있어."]],"ev":["G: They don't sell items in containers, so you can reduce waste.","그곳은 물건을 용기에 담아서 팔지 않아서 쓰레기를 줄일 수 있어."],"ow":["오답 ✕ — 'container'(용기)는 줄이는 것이 아니라 손님이 가져오는 것이다. 'You should bring your own container, then.'(그럼 너의 용기를 가져와야 해.)","오답 ✕ — 샴푸는 줄이는 것이 아니라 살 수 있는 물건이다. 'they have bags, shampoo, and some snacks'(가방, 샴푸, 그리고 간식이 있어)라고 했다.","정답 ○ — 'They don't sell items in containers, so you can reduce waste.'(그곳은 물건을 용기에 담아 팔지 않아서 쓰레기를 줄일 수 있어.)라고 했으므로 줄일 수 있는 것은 waste이다.","오답 ✕ — 간식은 줄이는 것이 아니라 파는 물건이다. 'they have bags, shampoo, and some snacks'(가방, 샴푸, 그리고 간식이 있어)","오답 ✕ — 가방도 상점에서 파는 물건이다. 'they have bags, shampoo, and some snacks'(가방, 샴푸, 그리고 간식이 있어)라고 했다."],"memo":["정답 ③: waste(쓰레기)","근거: They don't sell items in containers, so you can reduce waste.(용기에 담아 팔지 않아서 쓰레기를 줄일 수 있어.)","함정: container는 줄이는 것이 아니라 손님이 직접 가져가는 것 ✕"],"why":"제로 웨이스트 상점에서는 용기에 담지 않고 팔아서 쓰레기(waste)를 줄인다."},{"n":4,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["보라는 주말에 제로 웨이스트 상점에 갈 것이다.","소년은 제로 웨이스트 상점에 대해 들어본 적이 없다.","제로 웨이스트 상점에서는 용기에 담긴 제품과 담기지 않은 제품 모두 판매한다.","소년은 제로 웨이스트 상점에서 샴푸를 살 것이다.","소년은 제로 웨이스트 상점에 자신의 용기를 가져 가야 한다."],"a":2,"ans":"제로 웨이스트 상점에서는 용기에 담긴 제품과 담기지 않은 제품 모두 판매한다.","evs":[["G: They don't sell items in containers, so you can reduce waste.","그곳은 물건을 용기에 담아서 팔지 않아서 쓰레기를 줄일 수 있어."],["G: I'm planning to go to a zero waste shop.","나는 제로 웨이스트 상점에 갈 계획이야."],["G: You should bring your own container, then.","그럼 너의 용기를 가져와야 해."]],"ev":["G: They don't sell items in containers, so you can reduce waste.","그곳은 물건을 용기에 담아서 팔지 않아서 쓰레기를 줄일 수 있어."],"ow":["오답 ✕ — 'I'm planning to go to a zero waste shop.'(나는 제로 웨이스트 상점에 갈 계획이야.)라고 했으므로 일치한다.","오답 ✕ — 소년이 'No, I don't. Please tell me about them.'(아니, 몰라. 그것들에 대해 말해 줘.)라고 했으므로 들어본 적이 없다는 보기는 일치한다.","정답 ○ — 상점은 'They don't sell items in containers'(물건을 용기에 담아서 팔지 않아)라고 했으므로 용기에 담긴 제품도 판다는 보기는 일치하지 않는다.","오답 ✕ — 소년이 'I'm going to buy shampoo.'(나는 샴푸를 살 거야.)라고 했으므로 일치한다.","오답 ✕ — 'You should bring your own container, then.'(그럼 너의 용기를 가져와야 해.)라고 했으므로 일치한다."],"memo":["정답 ③: 이 상점은 용기에 담긴 제품을 팔지 않는다.","근거: They don't sell items in containers.(물건을 용기에 담아서 팔지 않아.)","함정: ⑤ 용기를 안 파니까 손님이 own container를 가져가야 한다(일치) ✕"],"why":"제로 웨이스트 상점은 용기에 담긴 제품을 팔지 않는다."},{"n":5,"q":"What should the boy bring to the zero waste shop?","o":["Some snacks to eat there","A new bag from home","His own container","A shopping cart","Some money for the bus"],"a":2,"ans":"His own container","evs":[["I'm going to buy shampoo.","나는 샴푸를 살 거야."],["You should bring your own container, then. You can put the shampoo in it.","그럼 너의 용기를 가져와야 해. 그 안에 샴푸를 담을 수 있어."]],"ev":["I'm going to buy shampoo.","나는 샴푸를 살 거야."],"ow":["오답 ✕ — 간식은 'they have bags, shampoo, and some snacks'(가방, 샴푸, 그리고 간식이 있어)처럼 상점에서 파는 물건이다. 가져가야 하는 것이 아니다.","오답 ✕ — 가방도 상점에서 파는 물건이다. 'they have bags, shampoo, and some snacks'(가방, 샴푸, 그리고 간식이 있어)라고 했다.","정답 ○ — 소년이 샴푸를 사겠다고 하자 'You should bring your own container, then.'(그럼 너의 용기를 가져와야 해.)라고 했다.","오답 ✕ — 카트에 대한 언급은 없다. 가져가야 할 것은 'your own container'(너의 용기)이다.","오답 ✕ — 버스비 이야기는 대화에 나오지 않는다.
