 cried, \"He is a person just like you and me, and he is my friend! Bring him back!\" Gloria's smile was gone. Even a new pet and a trip to New York did not help. Nothing could make her smile.","In the end, her parents took Gloria to the factory. Mrs. Weston pointed to the robot workers and said, \"Look at them, Gloria. They are just machines, not people.\" Gloria was not listening to her mother. She was searching for Robbie.","\"There he is!\" She shouted with joy. She was so happy that she ran toward him. At that moment, a huge machine was rushing toward her. Robbie saw this, ran quickly toward her, and saved her just in time.","Gloria hugged Robbie tightly. This time, even Mrs. Weston could not separate them. Gloria's parents changed their minds about Robbie and brought him back home. Finally, the two friends lived together happily."];var PASS_KO=["나, 로봇 Robbie","\"98, 99, 100! 나 이제 간다!\" Gloria는 큰 소리로 숫자를 세고 집 주위를 찾아보기 시작했다. 이 8살짜리 여자아이는 Robbie와 숨바꼭질을 하고 있었다. Robbie는 2년 전에 그녀의 집에 온 로봇이었다. 그는 그녀의 가장 친한 친구였다. Robbie는 더 빠르고 더 잘 숨었지만, 그는 항상 그녀가 이기도록 해 줬다. 보답으로 Gloria는 그가 가장 좋아하는 이야기인 <신데렐라>를 들려주었다. Robbie의 금속으로 된 눈은 기쁨으로 깜빡였다.","\"Gloria! 들어와!\" 라고 Gloria의 엄마인 Weston 부인은 소리쳤다. 그녀는 Robbie를 좋아하지 않았다. 그녀는 로봇이 아이를 돌봐서는 안 된다고 생각했다. 그녀는 남편에게 \"Gloria는 Robbie하고만 놀아요. 그 애는 다른 아이들하고는 놀지 않아요.\"라고 말했다.","Weston 씨는 그녀의 생각에 동의하지 않았다. 그는 Robbie가 Gloria와 가족에게 큰 도움이 된다고 생각했다.","하지만 긴 대화 후에 그들은 Robbie를 공장에 돌려보내기로 결정했다. Gloria는 Robbie가 사라진 것을 알게 되었을 때, \"그는 엄마 아빠와 저랑 똑같은 사람이고, 그는 제 친구예요! 그를 다시 데려와요!\"라고 울부짖었다. Gloria의 미소는 사라졌다. 새로운 반려동물도 뉴욕으로의 여행도 소용없었다. 아무것도 그녀를 미소 짓게 할 수 없었다.","결국, 그녀의 부모는 Gloria를 공장에 데려갔다. Weston 부인은 일하는 로봇을 가리키며 \"저들을 봐, Gloria. 그것들은 사람이 아니라 단지 기계에 불과해.\"라고 말했다. Gloria는 엄마의 말을 듣고 있지 않았다. 그녀는 Robbie를 찾고 있었다.","\"저기에 있다!\" 그녀는 기뻐서 소리쳤다. 그녀는 너무 행복해서 그에게 달려갔다. 그 순간 거대한 기계가 그녀에게로 돌진하고 있었다. Robbie는 이것을 보고는 그녀에게 재빨리 달려가서 제때 그녀를 구해냈다.","Gloria는 Robbie를 꼭 껴안았다. 이번에는 Weston 부인조차도 그들을 갈라놓을 수 없었다. Gloria의 부모는 Robbie에 대한 그들의 마음을 바꿨고 그를 집에 다시 데려왔다. 결국, 두 친구는 함께 행복하게 살았다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["choosing a dish in the cafeteria","worry about a future with robots","roles of the robot in the cafeteria","things to do for the cafeteria workers","good and bad points of using a cafeteria robot"],"a":4,"ans":"good and bad points of using a cafeteria robot","evs":[["G: I think it's great because it can make the sandwich line move faster. We don't have to wait too long.","샌드위치 줄이 더 빨리 줄어들 수 있으니까 좋다고 생각해. 너무 오래 기다리지 않아도 되잖아."],["B: It's nice, but I'm worried about the cafeteria workers. They might lose their jobs.","좋긴 한데, 식당 직원분들이 걱정돼. 그분들이 일자리를 잃을지도 몰라."]],"ev":["G: I think it's great because it can make the sandwich line move faster. We don't have to wait too long.","샌드위치 줄이 더 빨리 줄어들 수 있으니까 좋다고 생각해. 너무 오래 기다리지 않아도 되잖아."],"ow":["오답 ✕ — 'It makes sandwiches really fast.'(샌드위치를 정말 빨리 만들어.)처럼 로봇이 하는 일은 나오지만, 식당에서 메뉴를 고르는 대화는 아니라서 틀림.","오답 ✕ — 'I'm worried about the cafeteria workers.'(식당 직원분들이 걱정돼.)라는 걱정은 나오지만 한쪽 의견일 뿐이고, 소녀는 'I think it's great'(좋다고 생각해)라며 장점도 말해서 로봇과의 미래 전체를 걱정하는 대화가 아니라 틀림.","오답 ✕ — 'What kind of work does it do there?'(거기서 그게 무슨 일을 하는데?)로 로봇의 역할이 나오지만 대화 앞부분 일부일 뿐이고, 중심은 사용에 대한 생각이라서 틀림.","오답 ✕ — 'I hope that the school will find new roles for the workers.'(학교가 직원분들을 위한 새로운 역할을 찾아 주면 좋겠어.)는 대화 마지막의 한 문장일 뿐 주제가 아니라서 틀림.","정답 ○ — 소녀는 'it can make the sandwich line move faster'(샌드위치 줄이 더 빨리 줄어들 수 있다)며 장점을, 소년은 'They might lose their jobs.'(그분들이 일자리를 잃을지도 몰라.)라며 단점을 말하므로 장단점이 주제임."],"memo":["정답 ⑤: good and bad points of using a cafeteria robot(식당 로봇 사용의 장단점)","근거: it can make the sandwich line move faster(장점) / They might lose their jobs.(단점)","함정: ② 걱정은 소년의 한 가지 의견일 뿐, 소녀는 좋다고 했다. ✕"],"why":"식당 로봇의 장점(빠른 샌드위치)과 단점(직원의 일자리 걱정)을 이야기하는 대화이다."},{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["소년은 학교 식당에 로봇이 있다는 것을 몰랐다.","로봇의 일은 샌드위치를 만드는 것이다.","소녀는 로봇 사용에 대해 긍정적이다.","소녀는 소년의 걱정에 대해 동의하지 않는다.","소녀는 학교가 식당 직원을 위한 새 역할을 찾아주길 바란다."],"a":3,"ans":"소녀는 소년의 걱정에 대해 동의하지 않는다.","evs":[["G: Good point. I hope that the school  help.","새로운 반려동물도 뉴욕으로의 여행도 소용없었다."],"ow":["오답 ✕ — 'She did not like Robbie.'(그녀는 Robbie를 좋아하지 않았다.)라고 했으므로 일치하는 내용이라 답이 아님.","오답 ✕ — 'He thought that Robbie was a great help to Gloria and the family.'(그는 Robbie가 Gloria와 가족에게 큰 도움이 된다고 생각했다.)라고 했으므로 일치하는 내용이라 답이 아님.","정답 ○ — 'Even a new pet and a trip to New York did not help.'(새로운 반려동물도 뉴욕으로의 여행도 소용없었다.)라고 했으므로 도움이 되었다는 보기는 일치하지 않음.","오답 ✕ — 'They are just machines, not people.'(그것들은 사람이 아니라 단지 기계에 불과해.)라고 했으므로 일치하는 내용이라 답이 아님.","오답 ✕ — 'She was searching for Robbie.'(그녀는 Robbie를 찾고 있었다.)라고 했으므로 공장에서 Robbie를 찾으려 한 것이 맞아 일치하는 내용이라 답이 아님."],"memo":["정답 ③: 새 반려동물과 뉴욕 여행은 Gloria에게 도움이 되지 않았다(도움이 되었다는 보기는 틀림).","근거: Even a new pet and a trip to New York did not help.(새 반려동물도 뉴욕 여행도 소용없었다.)","함정: ④ Weston 부인의 'just machines' 말은 본문과 일치 ✕"],"why":"새 반려동물도 뉴욕 여행도 Gloria를 웃게 하지 못했다."}],"pp":[["\"Gloria, come back inside!\"","\"Gloria! 들어와!\""],["Mrs. Weston, Gloria's mother, shouted.","라고 Gloria의 엄마인 Weston 부인은 소리쳤다."],["She did not like Robbie.","그녀는 Robbie를 좋아하지 않았다."],["She felt that a robot should not take care of a child.","그녀는 로봇이 아이를 돌봐서는 안 된다고 생각했다."],["She said to her husband, \"Gloria plays only with Robbie.","그녀는 남편에게 \"Gloria는 Robbie하고만 놀아요."],["She does not play with other children.\"","그 애는 다른 아이들하고는 놀지 않아요.\"라고 말했다."],["Mr. Weston did not agree with her.","Weston 씨는 그녀의 생각에 동의하지 않았다."],["He thought that Robbie was a great help to Gloria and the family.","그는 Robbie가 Gloria와 가족에게 큰 도움이 된다고 생각했다."],["After a long talk, however, they decided to return Robbie to the factory.","하지만 긴 대화 후에 그들은 Robbie를 공장에 돌려보내기로 결정했다."],["When Gloria found that Robbie was gone, she cried, \"He is a person just like you and me, and he is my friend!","Gloria는 Robbie가 사라진 것을 알게 되었을 때, \"그는 엄마 아빠와 저랑 똑같은 사람이고, 그는 제 친구예요!"],["Bring him back!\"","그를 다시 데려와요!\"라고 울부짖었다."],["Gloria's smile was gone.","Gloria의 미소는 사라졌다."],["Even a new pet and a trip to New York did not help.","새로운 반려동물도 뉴욕으로의 여행도 소용없었다."],["Nothing could make her smile.","아무것도 그녀를 미소 짓게 할 수 없었다."],["In the end, her parents took Gloria to the factory.","결국, 그녀의 부모는 Gloria를 공장에 데려갔다."],["Mrs. Weston pointed to the robot workers and said, \"Look at them, Gloria.","Weston 부인은 일하는 로봇을 가리키며 \"저들을 봐, Gloria."],["They are just machines, not people.\"","그것들은 사람이 아니라 단지 기계에 불과해.\"라고 말했다."],["Gloria was not listening to her mother.","Gloria는 엄마의 말을 듣고 있지 않았다."],["She was searching for Robbie.","그녀는 Robbie를 찾고 있었다."]]},{"qs":[{"n":10,"q":"윗글의 내용을 요약한 다음 글의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["saved - changed","saved - kept","hurt - changed","ignored - made","left - changed"],"a":0,"ans":"saved - changed","evs":[["Robbie saw this, ran quickly toward her, and saved her just in time.","Robbie는 이것을 보고는 그녀에게 재빨리 달려가서 제때 그녀를 구해냈다."],["Gloria's parents changed their minds about Robbie and brought him back home.","Gloria의 부모는 Robbie에 대한 그들의 마음을 바꿨고 그를 집에 다시 데려왔다."]],"ev":["Robbie saw this, ran quickly toward her, and saved her just in time.","Robbie는 이것을 보고는 그녀에게 재빨리 달려가서 제때 그녀를 구해냈다."],"ow":["정답 ○ — 'Robbie saw this, ran quickly toward her, and saved her just in time.'(Robbie는 이것을 보고 재빨리 달려가 제때 그녀를 구해냈다.)이므로 (A)는 saved이고, 'Gloria's parents changed their minds about Robbie'(부모는 Robbie에 대한 마음을 바꿨다)이므로 (B)는 changed임.","오답 ✕ — (A) saved는 맞지만, 부모는 'changed their minds'(마음을 바꿨다)이므로 kept(그대로 유지했다)는 반대 뜻이라 틀림.","오답 ✕ — (B) changed는 맞지만, Robbie는 'saved her just in time'(제때 그녀를 구해냈다)이므로 hurt(다치게 했다)는 반대 뜻이라 틀림.","오답 ✕ — Robbie는 Gloria를 무시한 것이 아니라 'saved her'(구해냈다)이고, 'made their minds'는 본문의 'changed their minds'와 맞지 않아 틀림.","오답 ✕ — Robbie가 Gloria를 떠난(left) 것이 아니라 'ran quickly toward her'(재빨리 그녀에게 달려갔다)이므로 틀림."],"memo":["정답 ①: saved - changed","근거: Robbie ... saved her just in time.(제때 그녀를 구해냈다.) / parents changed their minds(마음을 바꿨다)","함정: change one's mind = 마음을 바꾸다. kept와 반대 ✕"],"why":"Robbie가 Gloria를 구해 주자 부모가 마음을 바꿔 Robbie를 집으로 데려왔다.","sum":"Robbie (A)______ Gloria from a huge machine, so her parents (B)______ their minds about him.","lab":"완성된 요약문 : "}],"pp":[["\"There he is!\"","\"저기에 있다!\""],["She shouted with joy.","그녀는 기뻐서 소리쳤다."],["She was so happy that she ran toward him.","그녀는 너무 행복해서 그에게 달려갔다."],["At that moment, a huge machine was rushing toward her.","그 순간 거대한 기계가 그녀에게로 돌진하고 있었다."],["Robbie saw this, ran quickly toward her, and saved her just in time.","Robbie는 이것을 보고는 그녀에게 재빨리 달려가서 제때 그녀를 구해냈다."],["Gloria hugged Robbie tightly.","Gloria는 Robbie를 꼭 껴안았다."],["This time, even Mrs. Weston could not separate them.","이번에는 Weston 부인조차도 그들을 갈라놓을 수 없었다."],["Gloria's parents changed their minds about Robbie and brought him back home.","Gloria의 부모는 Robbie에 대한 그들의 마음을 바꿨고 그를 집에 다시 데려왔다."],["Finally, the two friends lived together happily.","결국, 두 친구는 함께 행복하게 살았다."]]}];
