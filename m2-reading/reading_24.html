<style>

.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":"자전거 발명","en":"Mt. Tambora, a volcano in Indonesia, was exploded in 1815. The explosion created a huge cloud of ash, so crops failed around the world.","ko":"1815년 인도네시아의 화산인 탐보라산이 폭발했다. 이 폭발은 거대한 재 구름을 만들었고, 그래서 전 세계적으로 농작물이 자라지 못했다.","ok":false,"foot":[],"fixes":[{"wrong":"was exploded","right":"exploded","partial":false,"at":[6],"point":"능동태와 수동태: explode는 자동사: exploded (was exploded 아님)","topic":"능동태와 수동태","memo":"explode는 자동사: exploded (was exploded 아님)"}]},{"n":2,"tag":null,"en":"As a result, people didn't had enough food to eat. Surprisingly, this maked traveling difficult.","ko":"그 결과, 사람들은 먹을 음식이 충분하지 않았다. 놀랍게도, 이로 인해 이동이 어려워졌다.","ok":false,"foot":[],"fixes":[{"wrong":"had","right":"have","partial":false,"at":[5],"point":"did not 뒤 동사원형: didn't 뒤에는 동사원형: have (had 아님)","topic":"did not 뒤 동사원형","memo":"didn't 뒤에는 동사원형: have (had 아님)"},{"wrong":"maked","right":"made","partial":false,"at":[12],"point":"불규칙 과거형: make의 과거형은 made (maked 아님)","topic":"불규칙 과거형","memo":"make의 과거형은 made (maked 아님)"}]},{"n":3,"tag":null,"en":"Why? In those days, people rided horses, but many horses were killed for food.","ko":"왜일까? 당시, 사람들은 말을 탔는데, 많은 말들이 식용으로 죽임을 당했다.","ok":false,"foot":[],"fixes":[{"wrong":"rided","right":"rode","partial":false,"at":[5],"point":"불규칙 과거형: ride의 과거형은 rode (rided 아님)","topic":"불규칙 과거형","memo":"ride의 과거형은 rode (rided 아님)"}]},{"n":4,"tag":null,"en":"People needed a new way to traveling, and Karl von Drais invented the first bicycle in Germany in 1817. Drais's bicycle had two wooden wheels but no pedals.","ko":"사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다. Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다.","ok":false,"foot":[],"fixes":[{"wrong":"traveling","right":"travel","partial":false,"at":[6],"point":"to부정사: way to 뒤에는 동사원형: to travel (traveling 아님)","topic":"to부정사","memo":"way to 뒤에는 동사원형: to travel (traveling 아님)"}]},{"n":5,"tag":null,"en":"How did it move without pedals? Well, riders simply pushed the bicycle forward with their foots.","ko":"페달 없이 어떻게 움직였을까? 음, 타는 사람들이 단순히 발로 자전거를 앞으로 밀었다.","ok":false,"foot":[],"fixes":[{"wrong":"foots","right":"feet","partial":false,"at":[15],"point":"불규칙 복수형: foot의 복수형은 feet","topic":"불규칙 복수형","memo":"foot의 복수형은 feet"}]},{"n":6,"tag":null,"en":"The present-day bicycle is the result of much inventors' work on the 19th century.","ko":"오늘날의 자전거는 19세기 많은 발명가들의 노력의 결과이다.","ok":false,"foot":[],"fixes":[{"wrong":"much","right":"many","partial":false,"at":[7],"point":"수량 형용사 many/much: 복수명사 inventors 앞에는 many 사용","topic":"수량 형용사 many/much","memo":"복수명사 inventors 앞에는 many 사용"},{"wrong":"on","right":"in","partial":false,"at":[10],"point":"기본전치사: '~세기에'는 in the 19th century","topic":"기본전치사","memo":"'~세기에'는 in the 19th century"}]},{"n":7,"tag":"수정액 발명","en":"Whiteout was invented by Bette Graham. In 1956, Graham were working at a bank in Texas, USA.","ko":"수정액은 Bette Graham에 의해 발명되었다. 1956년 Graham은 미국 텍사스의 한 은행에서 일하고 있었다.","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[9],"point":"be동사의 수일치: 단수 주어 Graham에는 was 사용","topic":"be동사의 수일치","memo":"단수 주어 Graham에는 was 사용"}]},{"n":8,"tag":null,"en":"At that time, people had to retype the whole pages when they made even an small mistake.","ko":"그 당시, 사람들은 작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다.","ok":false,"foot":[],"fixes":[{"wrong":"pages","right":"page","partial":false,"at":[9],"point":"명사의 단수형: the whole 뒤에는 단수명사 page 사용","topic":"명사의 단수형","memo":"the whole 뒤에는 단수명사 page 사용"},{"wrong":"an","right":"a","partial":false,"at":[14],"point":"관사 a/an: 자음 소리 small 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 small 앞에는 a 사용"}]},{"n":9,"tag":null,"en":"Graham was a bad typist, so she needed a solution.","ko":"Graham은 타자 실력이 좋지 않아서 해결책이 필요했다.","ok":true,"foot":[],"fixes":[]},{"n":10,"tag":null,"en":"One day, Graham saw some window painters. When them made a mistake, they corrected it by simply painting over it.","ko":"어느 날 Graham은 창문을 칠하는 페인트공들을 보았다. 그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다.","ok":false,"foot":[],"fixes":[{"wrong":"them","right":"they","partial":false,"at":[8],"point":"인칭대명사의 주격: 주어 자리에는 주격 they 사용","topic":"인칭대명사의 주격","memo":"주어 자리에는 주격 they 사용"}]},{"n":11,"tag":null,"en":"The next days, she made her own white paint and used it to corrects her typing mistakes. Surprisingly, nobody noticed!","ko":"그다음 날 그녀는 자신만의 흰색 페인트를 만들어 오타를 수정하는 데 사용했다. 놀랍게도, 아무도 알아차리지 못했다!","ok":false,"foot":[],"fixes":[{"wrong":"days","right":"day","partial":false,"at":[2],"point":"명사의 단수형: '다음 날'은 단수 the next day","topic":"명사의 단수형","memo":"'다음 날'은 단수 the next day"},{"wrong":"corrects","right":"correct","partial":false,"at":[13],"point":"to부정사: to 뒤에는 동사원형 correct 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 correct 사용"}]},{"n":12,"tag":null,"en":"Soon, everybody at the bank began using it.","ko":"곧 은행의 모든 사람들이 그것을 사용하기 시작했다.","ok":true,"foot":[],"fixes":[]},{"n":13,"tag":"웹캠 발명","en":"The first webcam was invented to watch a coffee pots.","ko":"최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다.","ok":false,"foot":[],"fixes":[{"wrong":"pots","right":"pot","partial":false,"at":[9],"point":"명사의 단수형: a 뒤에는 단수명사 pot 사용","topic":"명사의 단수형","memo":"a 뒤에는 단수명사 pot 사용"}]},{"n":14,"tag":null,"en":"In 1991, Dr. Quentin Stafford-Fraser and Dr. Paul Jardetzky were working at a computer lab in England.","ko":"1991년 Quentin Stafford-Fraser 박사와 Paul Jardetzky 박사는 영국의 한 컴퓨터 연구소에서 일하고 있었다.","ok":true,"foot":[],"fixes":[]},{"n":15,"tag":null,"en":"To work more good, they needed lots of coffee. However, there was only one coffee machine in the building.","ko":"일을 더 잘하기 위해, 그들은 많은 양의 커피가 필요했다. 하지만 건물에는 커피 머신이 한 대뿐이었다.","ok":false,"foot":[],"fixes":[{"wrong":"more good","right":"better","partial":false,"at":[2],"point":"비교급: good의 비교급은 better","topic":"비교급","memo":"good의 비교급은 better"}]},{"n":16,"tag":null,"en":"So, they had to makes many disappointed trips to the empty coffee pot.","ko":"그래서 그들은 비어 있는 커피포트로 실망스러운 발걸음을 많이 해야 했다.","ok":false,"foot":[],"fixes":[{"wrong":"makes","right":"make","partial":false,"at":[4],"point":"to부정사: to 뒤에는 동사원형 make 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 make 사용"},{"wrong":"disappointed","right":"disappointing","partial":false,"at":[6],"point":"현재분사와 과거분사: trips가 실망을 주므로 disappointing 사용","topic":"현재분사와 과거분사","memo":"trips가 실망을 주므로 disappointing 사용"}]}];var PP=[["Bicycle","자전거",1],["Mt. Tambora, a volcano in Indonesia, exploded in 1815. The explosion created a huge cloud of ash, so crops failed around the world.","1815년 인도네시아의 화산인 탐보라산이 폭발했다. 이 폭발은 거대한 재 구름을 만들었고, 그래서 전 세계적으로 농작물이 자라지 못했다.",1],["As a result, people didn't have enough food to eat.","그 결과, 사람들은 먹을 음식이 충분하지 않았다.",0],["Surprisingly, this made traveling difficult.","놀랍게도, 이로 인해 이동이 어려워졌다.",0],["Why?","왜일까?",0],["In those days, people rode horses, but many horses were killed for food.","당시, 사람들은 말을 탔는데, 많은 말들이 식용으로 죽임을 당했다.",0],["People needed a new way to travel, and Karl von Drais invented the first bicycle in Germany in 1817. Drais's bicycle had two wooden wheels but no pedals.","사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다. Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다.",1],["How did it move without pedals?","페달 없이 어떻게 움직였을까?",0],["Well, riders simply pushed the bicycle forward with their feet.","음, 타는 사람들이 단순히 발로 자전거를 앞으로 밀었다.",0],["The present-day bicycle is the result of many inventors' work in the 19th century.","오늘날의 자전거는 19세기 많은 발명가들의 노력의 결과이다.",0],["Whiteout","수정액",1],["Whiteout was invented by Bette Graham.","수정액은 Bette Graham에 의해 발명되었다.",1],["In 1956, Graham was working at a bank in Texas, USA.","1956년 Graham은 미국 텍사스의 한 은행에서 일하고 있었다.",0],["At that time, people had to retype the whole page when they made even a small mistake.","그 당시, 사람들은 작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다.",0],["Graham was a bad typist, so she needed a solution.","Graham은 타자 실력이 좋지 않아서 해결책이 필요했다.",0],["One day, Graham saw some window painters.","어느 날 Graham은 창문을 칠하는 페인트공들을 보았다.",1],["When they made a mistake, they corrected it by simply painting over it.","그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다.",0],["The next day, she made her own white paint and used it to correct her typing mistakes.","그다음 날 그녀는 자신만의 흰색 페인트를 만들어 오타를 수정하는 데 사용했다.",0],["Surprisingly, nobody noticed!","놀랍게도, 아무도 알아차리지 못했다!",0],["Soon, everybody at the bank began using it.","곧 은행의 모든 사람들이 그것을 사용하기 시작했다.",0],["Webcam","웹캠",1],["The first webcam was invented to watch a coffee pot.","최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다.",1],["In 1991, Dr. Quentin Stafford-Fraser and Dr. Paul Jardetzky were working at a computer lab in England.","1991년 Quentin Stafford-Fraser 박사와 Paul Jardetzky 박사는 영국의 한 컴퓨터 연구소에서 일하고 있었다.",0],["To work better, they needed lots of coffee.","일을 더 잘하기 위해, 그들은 많은 양의 커피가 필요했다.",0],["However, there was only one coffee machine in the building.","하지만 건물에는 커피 머신이 한 대뿐이었다.",0],["So, they had to make many disappointing trips to the empty coffee pot.","그래서 그들은 비어 있는 커피포트로 실망스러운 발걸음을 많이 해야 했다.",0]];var RNUM=24;var TITLE_EN="Necessity Is the Mother of Invention";var PASS_EN=["Necessity Is the Mother of Invention","Bicycle","Mt. Tambora, a volcano in Indonesia, exploded in 1815. The explosion created a huge cloud of ash, so crops failed around the world. As a result, people didn't have enough food to eat. Surprisingly, this made traveling difficult. Why? In those days, people rode horses, but many horses were killed for food.","People needed a new way to travel, and Karl von Drais invented the first bicycle in Germany in 1817. Drais's bicycle had two wooden wheels but no pedals. How did it move without pedals? Well, riders simply pushed the bicycle forward with their feet. The present-day bicycle is the result of many inventors' work in the 19th century.","Whiteout","Whiteout was invented by Bette Graham. In 1956, Graham was working at a bank in Texas, USA. At that time, people had to retype the whole page when they made even a small mistake. Graham was a bad typist, so she needed a solution.","One day, Graham saw some window painters. When they made a mistake, they corrected it by simply painting over it. The next day, she made her own white paint and used it to correct her typing mistakes. Surprisingly, nobody noticed! Soon, everybody at the bank began using it.","Webcam","The first webcam was invented to watch a coffee pot. In 1991, Dr. Quentin Stafford-Fraser and Dr. Paul Jardetzky were working at a computer lab in England. To work better, they needed lots of coffee. However, there was only one coffee machine in the building. So, they had to make many disappointing trips to the empty coffee pot."];var PASS_KO=["필요는 발명의 어머니이다","자전거","1815년 인도네시아의 화산인 탐보라산이 폭발했다. 이 폭발은 거대한 재 구름을 만들었고, 그래서 전 세계적으로 농작물이 자라지 못했다. 그 결과, 사람들은 먹을 음식이 충분하지 않았다. 놀랍게도, 이로 인해 이동이 어려워졌다. 왜일까? 당시, 사람들은 말을 탔는데, 많은 말들이 식용으로 죽임을 당했다.","사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다. Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다. 페달 없이 어떻게 움직였을까? 음, 타는 사람들이 단순히 발로 자전거를 앞으로 밀었다. 오늘날의 자전거는 19세기 많은 발명가들의 노력의 결과이다.","수정액","수정액은 Bette Graham에 의해 발명되었다. 1956년 Graham은 미국 텍사스의 한 은행에서 일하고 있었다. 그 당시, 사람들은 작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다. Graham은 타자 실력이 좋지 않아서 해결책이 필요했다.","어느 날 Graham은 창문을 칠하는 페인트공들을 보았다. 그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다. 그다음 날 그녀는 자신만의 흰색 페인트를 만들어 오타를 수정하는 데 사용했다. 놀랍게도, 아무도 알아차리지 못했다! 곧 은행의 모든 사람들이 그것을 사용하기 시작했다.","웹캠","최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다. 1991년 Quentin Stafford-Fraser 박사와 Paul Jardetzky 박사는 영국의 한 컴퓨터 연구소에서 일하고 있었다. 일을 더 잘하기 위해, 그들은 많은 양의 커피가 필요했다. 하지만 건물에는 커피 머신이 한 대뿐이었다. 그래서 그들은 비어 있는 커피포트로 실망스러운 발걸음을 많이 해야 했다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["choosing fun club activities","sharing their free-time activities","preparing events for Science Day","doing exciting science experiments","planning interesting activities for Science Day"],"a":4,"ans":"planning interesting activities for Science Day","evs":[["G: Look at this program, Liam. This weekend is Science Day, and there are lots of interesting activities.","이 프로그램 좀 봐, Liam. 이번 주말은 과학의 날이고, 흥미로운 활동이 많이 있어."],["B: Oh, I like that, too. Let's go to both classes.","오, 나도 그게 좋아. 두 수업에 다 가자."]],"ev":["G: Look at this program, Liam. This weekend is Science Day, and there are lots of interesting activities.","이 프로그램 좀 봐, Liam. 이번 주말은 과학의 날이고, 흥미로운 활동이 많이 있어."],"ow":["오답 ✕ — 동아리 활동(club activities)을 고르는 대화가 아니다. 'This weekend is Science Day'(이번 주말은 과학의 날이고)라는 행사의 활동을 이야기하므로 틀림.","오답 ✕ — 두 사람의 여가 활동을 공유하는 대화가 아니다. 'there are lots of interesting activities'(흥미로운 활동이 많이 있어)처럼 과학의 날 행사의 활동 이야기라서 틀림.","오답 ✕ — 과학의 날 행사를 '준비'하는 것이 아니라 행사에 '참가할' 활동을 고르는 대화이다. 'Let's go to both classes.'(두 수업에 다 가자.)라고 했으므로 틀림.","오답 ✕ — 과학 실험을 하는 내용은 없다. 'drone-flying class'(드론 비행 수업)와 'lecture on AI'(AI 강연)에 가자는 이야기라서 틀림.","정답 ○ — 'This weekend is Science Day, and there are lots of interesting activities.'(이번 주말은 과학의 날이고, 흥미로운 활동이 많이 있어.)로 시작해 'Let's go to both classes.'(두 수업에 다 가자.)로 마무리하므로 과학의 날 활동 계획이 주제이다."],"memo":["정답 ⑤: 과학의 날의 재미있는 활동을 계획하기","근거: there are lots of interesting activities(흥미로운 활동이 많이 있어) / Let's go to both classes.(두 수업에 다 가자.)","함정: ③ 행사를 '준비'하는 게 아니라 '참가'할 활동을 정하는 것 ✕"],"why":"과학의 날에 참가할 흥미로운 활동을 계획하는 대화이다."},{"n":2,"q":"위 대화를 읽고 답할 수 없는 질문은?","o":["When is Science Day?","How much do the activities cost?","How many Science Day activities are there?","Which activity is Liam most interested in?","What is the topic of Dr. Lee's lecture?"],"a":2,"ans":"How many Science Day activities are there?","evs":[["G: Look at this program, Liam. This weekend is Science Day, and there are lots of interesting activities.","이 프로그램 좀 봐, Liam. 이번 주말은 과학의 날이고, 흥미로운 활동이 많이 있어."],["G: Yes. All the activities look fun, and they're all free.","응. 모든 활동이 재미있어 보이고, 전부 무료야."]],"ev":["G: Look at this program, Liam. This weekend is Science Day, and there are lots of interesting activities.","이 프로그램 좀 봐, Liam. 이번 주말은 과학의 날이고, 흥미로운 활동이 많이 있어."],"ow":["오답 ✕ — 'You mean April 21?'(4월 21일 말하는 거지?)에 'Yes.'(응.)라고 답했으므로 과학의 날이 언제인지 대화로 답할 수 있다. 답할 수 없는 질문을 찾는 문제라서 틀림.","오답 ✕ — 'they're all free'(전부 무료야)라고 했으므로 활동 비용은 무료라고 답할 수 있다. 그래서 틀림.","정답 ○ — 'there are lots of inte y, and there are lots of interesting activities.","이 프로그램 좀 봐, Liam. 이번 주말은 과학의 날이고, 흥미로운 활동이 많이 있어."],["B","You mean April 21?","4월 21일 말하는 거지?"],["G","Yes. All the activities look fun, and they're all free.","응. 모든 활동이 재미있어 보이고, 전부 무료야."],["B","All of them? Are you sure?","전부 다? 확실해?"],["G","Yes, I'm quite sure. I saw it on the poster. Anyway, which ones are you interested in?","응, 아주 확실해. 포스터에서 봤어. 그건 그렇고, 너는 어떤 것들에 관심이 있니?"],["B","I want to go to the drone-flying class the most. How about you, Somi?","나는 드론 비행 수업에 가장 가고 싶어. 소미 너는 어때?"],["G","Well, I want to go to Dr. Lee's lecture on AI.","음, 나는 AI에 관한 이 박사님의 강연에 가고 싶어."],["B","Oh, I like that, too. Let's go to both classes.","오, 나도 그게 좋아. 두 수업에 다 가자."],["G","Let's see. The drone-flying class is on Saturday afternoon, and Dr. Lee's lecture is on Sunday morning.","어디 보자. 드론 비행 수업은 토요일 오후이고, 이 박사님의 강연은 일요일 오전이야."],["B","Perfect. I can't wait.","완벽해. 정말 기대된다."]]},{"qs":[{"n":4,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["The girl wonders which team will win, the Reds or the Blues.","The boy thinks the Reds will be the winner of today's game.","The boy thinks the Reds are better than the Blues.","The boy didn't know that Yun Jihun is not playing today.","The boy is sure the Reds will win even without Yun Jihun."],"a":4,"ans":"The boy is sure the Reds will win even without Yun Jihun.","evs":[["G: Are you sure? Yun Jihun, their star player, is not playing today.","확실해? 그들의 스타 선수인 윤지훈이 오늘 뛰지 않아."],["B: I didn't know that. Then, I'm not sure.","그건 몰랐네. 그럼, 잘 모르겠어."]],"ev":["G: Are you sure? Yun Jihun, their star player, is not playing today.","확실해? 그들의 스타 선수인 윤지훈이 오늘 뛰지 않아."],"ow":["오답 ✕ — 소녀가 'Which team will win today, the Reds or the Blues?'(오늘 어느 팀이 이길까, Reds일까 Blues일까?)라고 물었으므로 이 보기는 대화와 일치한다. 일치하지 않는 것을 고르는 문제라서 틀림.","오답 ✕ — 소년이 'The Reds.'라고 답했으므로 Reds가 이길 것이라고 생각한다는 보기는 대화와 일치해서 틀림.","오답 ✕ — 소년이 'They're the better team.'(그들이 더 나은 팀이야.)이라고 했으므로 이 보기는 대화와 일치해서 틀림.","오답 ✕ — 소년이 'I didn't know that.'(그건 몰랐네.)이라고 했으므로 윤지훈이 뛰지 않는다는 것을 몰랐다는 보기는 대화와 일치해서 틀림.","정답 ○ — 소년은 윤지훈이 뛰지 않는다는 말을 듣고 'Then, I'm not sure.'(그럼, 잘 모르겠어.)라고 했는데, 이 보기는 Reds가 이길 거라고 확신한다고 해서 대화와 일치하지 않는다."],"memo":["정답 ⑤: 소년은 윤지훈이 뛰지 않는다는 말을 듣고 확신하지 못한다(I'm not sure).","근거: I didn't know that. Then, I'm not sure.(그건 몰랐네. 그럼, 잘 모르겠어.)","함정: 일치하지 않는 것 찾기! ①~④는 모두 대화와 일치"],"why":"소년은 스타 선수가 뛰지 않는다는 말을 듣고 Reds가 이긴다는 확신을 잃는다."},{"n":5,"q":"다음은 위 대화를 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["Reds - not sure","Blues - not sure","Reds - very sure","Blues - very sure","Reds - angry"],"a":0,"ans":"Reds - not sure","evs":[["B: The Reds. They're the better team.","Reds. 그들이 더 나은 팀이야."],["B: I didn't know that. Then, I'm not sure.","그건 몰랐네. 그럼, 잘 모르겠어."]],"ev":["B: The Reds. They're the better team.","Reds. 그들이 더 나은 팀이야."],"ow":["정답 ○ — 소년은 'The Reds. They're the better team.'(Reds. 그들이 더 나은 팀이야.)이라고 했다가, 윤지훈이 뛰지 않는다는 말을 듣고 'Then, I'm not sure.'(그럼, 잘 모르겠어.)라고 했으므로 맞다.","오답 ✕ — not sure는 맞지만, 소년이 처음 이긴다고 말한 팀은 Blues가 아니라 'The Reds.'이다.","오답 ✕ — Reds는 맞지만, 소년은 'Then, I'm not sure.'(그럼, 잘 모르겠어.)라고 했으므로 매우 확신하게(very sure) 된 것이 아니다.","오답 ✕ — 소년이 이긴다고 한 팀은 Reds이고, 마지막에는 'I'm not sure.'라고 했으므로 둘 다 틀림.","오답 ✕ — Reds는 맞지만, 소년이 화가 났다(angry)는 말은 없다. 'I didn't know that.'(그건 몰랐네.)이라며 놀라서 'I'm not sure.'라고 했을 뿐이라 틀림."],"memo":["정답 Reds - not sure: Reds가 이긴다고 했지만 스타 선수가 없다는 말에 확신을 잃는다.","근거: The Reds. They're the better team.(Reds. 그들이 더 나은 팀이야.) / Then, I'm not sure.(그럼, 잘 모르겠어.)","함정: 마지막 말은 I'm sure가 아니라 I'm not sure ✕"],"why":"소년은 Reds가 이긴다고 했지만 스타 선수가 뛰지 않는다는 말에 확신을 잃는다.","sum":"The boy thinks the (A)______ will win, but he becomes (B)______ when he hears that Yun Jihun is not playing.","lab":"완성된 요약문 : "}],"dlg":[["G","Which team will win today, the Reds or the Blues?","오늘 어느 팀이 이길까, Reds일까 Blues일까?"],["B","The Reds. They're the better team.","Reds. 그들이 더 나은 팀이야."],["G","Are you sure? Yun Jihun, their star player, is not playing today.","확실해? 그들의 스타 선수인 윤지훈이 오늘 뛰지 않아."],["B","I didn't know that. Then, I'm not sure.","그건 몰랐네. 그럼, 잘 모르겠어."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 주제로 알맞은 것은?","o":["many volcanoes in Indonesia","the origin of the first bicycle","the reason for crop failure in 1815","various ways to travel in the 1800s","the popularity of the bicycle in 1817"],"a":1,"ans":"the origin of the first bicycle","evs":[["People needed a new way to travel, and Karl von Drais invented the first bicycle in Germany in 1817.","사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다."]],"ev":["People needed a new way to travel, and Karl von Drais invented the first bicycle in Germany in 1817.","사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다."],"ow":["오답 ✕ — 'Mt. Tambora, a volcano in Indonesia, exploded in 1815.'(1815년 인도네시아의 화산인 탐보라산이 폭발했다.)라는 내용은 있지만 화산이 많다는 이야기는 아니다. 화산 폭발은 자전거가 발명된 배경이라서 틀림.","정답 ○ — 탐보라산 폭발로 말이 줄어 'People needed a new way to travel'(사람들은 이동하기 위한 새로운 수단이 필요했고) 'Karl von Drais invented the first bicycle'(Karl von Drais가 최초의 자전거를 발명했다)이라는 흐름이므로 최초의 자전거가 생겨난 유래가 주제이다.","오답 ✕ — 'crops failed around the world'(전 세계적으로 농작물이 자라지 못했다)는 배경 설명일 뿐이다. 글의 중심은 농작물 흉작의 이유가 아니라 자전거의 발명이라서 틀림.","오답 ✕ — 'people rode horses'(사람들은 말을 탔는데)가 나오지만 다양한 이동 수단을 소개하는 글이 아니다. 중심은 자전거 발명이라서 틀림.","오답 ✕ — 자전거의 인기에 대한 내용은 없다. 1817년에 'invented the first bicycle'(최초의 자전거를 발명했다)이라는 발명 이야기이므로 틀림."],"memo":["정답 ②: 최초의 자전거가 생겨난 유래","근거: People needed a new way to travel, and Karl von Drais invented the first bicycle(사람들은 이동하기 위한 새로운 수단이 필요했고 Karl von Drais가 최초의 자전거를 발명했다)","함정: ③ 흉작은 배경일 뿐, 중심은 자전거 발명 ✕"],"why":"화산 폭발로 말이 줄자 새 이동 수단이 필요해져 최초의 자전거가 발명되었다."},{"n":7,"q":"다음 글의 내용과 일치하지 않는 것은?","o":["인도네시아의 화산인 탐보라산이 1815년에 폭발했다.","탐보라산 폭발 이후, 농작물이 자라지 못해서 먹을 음식이 충분하지 못했다.","탐보라산 폭발 이후, 많은 말들이 식용으로 죽임을 당했고, 새로운 이동 수단이 필요했다.","1817년 독일에서 나무로 된 네 개의 바퀴가 있는 최초의 자전거가 발명되었다.","최초의 자전거는 페달 없이 발로 자전거를 앞으로 밀어야 했다."],"a":3,"ans":"1817년 독일에서 나무로 된 네 개의 바퀴가 있는 최초의 자전거가 발명되었다.","evs":[["Drais's bicycle had two wooden wheels but no pedals.","Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다."]],"ev":["Drais's bicycle had two wooden wheels but no pedals.","Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다."],"ow":["오답 ✕ — 본문에 'Mt. Tambora, a volcano in Indonesia, exploded in 1815.'(1815년 인도네시아의 화산인 탐보라산이 폭발했다.)라고 했으므로 이 보기는 본문과 일치한다. 일치하지 않는 것을 고르는 문제라서 틀림.","오답 ✕ — 본문에 'crops failed around the world'(전 세계적으로 농작물이 자라지 못했다), 'people didn't have enough food to eat'(사람들은 먹을 음식이 충분하지 않았다)라고 했으므로 이 보기는 본문과 일치해서 틀림.","오답 ✕ — 본문에 'many horses were killed for food'(많은 말들이 식용으로 죽임을 당했다), 'People needed a new way to travel'(사람들은 이동하기 위한 새로운 수단이 필요했고)라고 했으므로 이 보기는 본문과 일치해서 틀림.","정답 ○ — 본문에는 'Drais's bicycle had two wooden wheels but no pedals.'(Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다.)라고 했는데, 이 보기는 네 개의 바퀴라고 해서 본문과 일치하지 않는다.","오답 ✕ — 본문에 'riders simply pushed the bicycle forward with their feet'(타는 사람들이 단순히 발로 자전거를 앞으로 밀었다)라고 했으므로 이 보기는 본문과 일치해서 틀림."],"memo":["정답 ④: 최초의 자전거는 바퀴가 네 개가 아니라 두 개였다.","근거: Drais's bicycle had two wooden wheels but no pedals.(Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다.)","함정: 일치하지 않는 것 찾기! two(두 개) vs four(네 개) 숫자 함정"],"why":"최초의 자전거는 나무 바퀴 두 개에 페달이 없었다."}],"pp":[["Bicycle","자전거"],["Mt. Tambora, a volcano in Indonesia, exploded in 1815. The explosion created a huge cloud of ash, so crops failed around the world.","1815년 인도네시아의 화산인 탐보라산이 폭발했다. 이 폭발은 거대한 재 구름을 만들었고, 그래서 전 세계적으로 농작물이 자라지 못했다."],["As a result, people didn't have enough food to eat.","그 결과, 사람들은 먹을 음식이 충분하지 않았다."],["Surprisingly, this made traveling difficult.","놀랍게도, 이로 인해 이동이 어려워졌다."],["Why?","왜일까?"],["In those days, people rode horses, but many horses were killed for food.","당시, 사람들은 말을 탔는데, 많은 말들이 식용으로 죽임을 당했다."],["People needed a new way to travel, and Karl von Drais invented the first bicycle in Germany in 1817. Drais's bicycle had two wooden wheels but no pedals.","사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다. Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다."],["How did it move without pedals?","페달 없이 어떻게 움직였을까?"],["Well, riders simply pushed the bicycle forward with their feet.","음, 타는 사람들이 단순히 발로 자전거를 앞으로 밀었다."],["The present-day bicycle is the result of many inventors' work in the 19th century.","오늘날의 자전거는 19세기 많은 발명가들의 노력의 결과이다."]]},{"qs":[{"n":8,"q":"윗글 Whiteout 이야기와 일치하는 것은?","o":["Graham은 1956년에 미국 뉴욕의 은행에서 일하고 있었다.","Graham은 타자를 매우 잘 치는 사람이었다.","당시 사람들은 작은 실수를 하면 그 부분만 지우면 되었다.","Graham이 만든 흰색 페인트를 은행 사람들은 바로 알아차렸다.","Graham은 창문을 칠하는 페인트공들이 실수를 덧칠해 고치는 것을 보았다."],"a":4,"ans":"Graham은 창문을 칠하는 페인트공들이 실수를 덧칠해 고치는 것을 보았다.","evs":[["One day, Graham saw some window painters.","어느 날 Graham은 창문을 칠하는 페인트공들을 보았다."],["When they made a mistake, they corrected it by simply painting over it.","그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다."]],"ev":["One day, Graham saw some window painters.","어느 날 Graham은 창문을 칠하는 페인트공들을 보았다."],"ow":["오답 ✕ — 본문에는 'Graham was working at a bank in Texas, USA.'(Graham은 미국 텍사스의 한 은행에서 일하고 있었다.)라고 했는데, 이 보기는 뉴욕이라고 해서 틀림.","오답 ✕ — 본문에는 'Graham was a bad typist'(Graham은 타자 실력이 좋지 않아서)라고 했는데, 이 보기는 타자를 매우 잘 쳤다고 해서 틀림.","오답 ✕ — 본문에는 'people had to retype the whole page when they made even a small mistake'(작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다)라고 했는데, 이 보기는 그 부분만 지우면 된다고 해서 틀림.","오답 ✕ — 본문에는 'Surprisingly, nobody noticed!'(놀랍게도, 아무도 알아차리지 못했다!)라고 했는데, 이 보기는 바로 알아차렸다고 해서 틀림.","정답 ○ — 본문에 'One day, Graham saw some window painters.'(어느 날 Graham은 창문을 칠하는 페인트공들을 보았다.)와 'they corrected it by simply painting over it'(그 위에 페인트를 덧칠하는 것으로 실수를 수정했다)이 나오므로 맞다."],"memo":["정답 ⑤: Graham은 페인트공들이 실수를 덧칠해 고치는 것을 보았다.","근거: When they made a mistake, they corrected it by simply painting over it.(그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다.)","함정: ② Graham은 타자를 '못 쳤다'(bad typist) ✕"],"why":"Graham은 페인트공이 실수를 덧칠해 고치는 것을 보고 수정액을 떠올렸다."},{"n":9,"q":"다음은 윗글 Whiteout 이야기를 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["solution - white","solution - red","mistake - white","chance - blue","practice - black"],"a":0,"ans":"solution - white","evs":[["Graham was a bad typist, so she needed a solution.","Graham은 타자 실력이 좋지 않아서 해결책이 필요했다."],["The next day, she made her own white paint and used it to correct her typing mistakes.","그다음 날 그녀는 자신만의 흰색 페인트를 만들어 오타를 수정하는 데 사용했다."]],"ev":["Graham was a bad typist, so she needed a solution.","Graham은 타자 실력이 좋지 않아서 해결책이 필요했다."],"ow":["정답 ○ — 'she needed a solution'(해결책이 필요했다)이므로 (A)는 solution이고, 'she made her own white paint'(그녀는 자신만의 흰색 페인트를 만들어)이므로 (B)는 white이다.","오답 ✕ — solution은 맞지만, 본문에는 'her own white paint'(자신만의 흰색 페인트)라고 했으므로 빨간색(red)이 아니다.","오답 ✕ — white는 맞지만, Graham이 필요했던 것은 실수(mistake) 그 자체가 아니라 'a solution'(해결책)이다.","오답 ✕ — 'she needed a solution'(해결책이 필요했다)이라고 했으므로 chance(기회)가 아니고, 페인트도 파란색(blue)이 아니라 'white paint'이다.","오답 ✕ — 'she needed a solution'(해결책이 필요했다)이라고 했으므로 practice(연습)가 아니고, 페인트도 검은색(black)이 아니라 'white paint'이다."],"memo":["정답 solution - white: 해결책이 필요해서 흰색 페인트를 만들었다.","근거: she needed a solution(해결책이 필요했다) / she made her own white paint(자신만의 흰색 페인트를 만들어)","함정: 페인트 색은 white(흰색), solution = 문제를 해결하는 방법"],"why":"Graham은 타자 실수를 고칠 해결책으로 직접 흰색 페인트를 만들었다.","sum":"Graham needed a (A)______ for her typing mistakes, so she made her own (B)______ paint to correct them.","lab":"완성된 요약문 : "}],"pp":[["Whiteout","수정액"],["Whiteout was invented by Bette Graham.","수정액은 Bette Graham에 의해 발명되었다."],["In 1956, Graham was working at a bank in Texas, USA.","1956년 Graham은 미국 텍사스의 한 은행에서 일하고 있었다."],["At that time, people had to retype the whole page when they made even a small mistake.","그 당시, 사람들은 작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다."],["Graham was a bad typist, so she needed a solution.","Graham은 타자 실력이 좋지 않아서 해결책이 필요했다."],["One day, Graham saw some window painters.","어느 날 Graham은 창문을 칠하는 페인트공들을 보았다."],["When they made a mistake, they corrected it by simply painting over it.","그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다."],["The next day, she made her own white paint and used it to correct her typing mistakes.","그다음 날 그녀는 자신만의 흰색 페인트를 만들어 오타를 수정하는 데 사용했다."],["Surprisingly, nobody noticed!","놀랍게도, 아무도 알아차리지 못했다!"],["Soon, everybody at the bank began using it.","곧 은행의 모든 사람들이 그것을 사용하기 시작했다."]]},{"qs":[{"n":10,"q":"윗글 Webcam 이야기와 일치하는 것은?","o":["두 박사가 일하던 연구소는 미국에 있었다.","건물에는 커피 머신이 여러 대 있었다.","두 박사는 커피 없이도 일을 잘할 수 있었다.","최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다.","두 박사는 비어 있는 커피포트 앞에서 만족스러운 발걸음을 했다."],"a":3,"ans":"최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다.","evs":[["The first webcam was invented to watch a coffee pot.","최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다."]],"ev":["The first webcam was invented to watch a coffee pot.","최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다."],"ow":["오답 ✕ — 본문에는 'a computer lab in England'(영국의 한 컴퓨터 연구소)라고 했는데, 이 보기는 미국이라고 해서 틀림.","오답 ✕ — 본문에는 'there was only one coffee machine in the building'(건물에는 커피 머신이 한 대뿐이었다)이라고 했는데, 이 보기는 여러 대라고 해서 틀림.","오답 ✕ — 본문에는 'To work better, they needed lots of coffee.'(일을 더 잘하기 위해, 그들은 많은 양의 커피가 필요했다.)라고 했는데, 이 보기는 커피 없이도 일할 수 있었다고 해서 틀림.","정답 ○ — 'The first webcam was invented to watch a coffee pot.'(최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다.)라고 했으므로 맞다.","오답 ✕ — 본문에는 'many disappointing trips to the empty coffee pot'(비어 있는 커피포트로 실망스러운 발걸음을 많이)이라고 했는데, 이 보기는 만족스러웠다고 해서 틀림."],"memo":["정답 ④: 최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다.","근거: The first webcam was invented to watch a coffee pot.(최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다.)","함정: ⑤ 발걸음은 만족스러운(satisfying)이 아니라 실망스러운(disappointing) ✕"],"why":"커피 머신이 한 대뿐이라 헛걸음하던 연구원들 때문에 최초의 웹캠이 발명되었다."}],"pp":[["Webcam","웹캠"],["The first webcam was invented to watch a coffee pot.","최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다."],["In 1991, Dr. Quentin Stafford-Fraser and Dr. Paul Jardetzky were working at a computer lab in England.","1991년 Quentin Stafford-Fraser 박사와 Paul Jardetzky 박사는 영국의 한 컴퓨터 연구소에서 일하고 있었다."],["To work better, they needed lots of coffee.","일을 더 잘하기 위해, 그들은 많은 양의 커피가 필요했다."],["However, there was only one coffee machine in the building.","하지만 건물에는 커피 머신이 한 대뿐이었다."],["So, they had to make many disappointing trips to the empty coffee pot.","그래서 그들은 비어 있는 커피포트로 실망스러운 발걸음을 많이 해야 했다."]]}];
