<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>출석부</title>
<style>
:root{--bg:#f6f7f5;--ink:#1d2421;--mut:#6b7570;--line:#dfe3df;--card:#fff;
--out:#eceeec;--wait:#fff3cf;--m:#dbe9fb;--f:#eadcf6;--left:#dcf0e0;--abs:#f6dcd6;--acc:#2f6f5e}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.4 -apple-system,"Malgun Gothic","Apple SD Gothic Neo",sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 14px 8px;border-bottom:1px solid var(--line)}
.top{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tabs{display:flex;gap:6px}
.tabs button{min-height:40px;padding:6px 16px;font-size:18px;font-weight:600;border-radius:999px;background:#fff;color:var(--mut)}
.tabs button.on{background:var(--acc);border-color:var(--acc);color:#fff}
.dbar{display:flex;align-items:center;gap:6px}
.dbar button{min-height:40px;min-width:40px;padding:4px 10px;font-size:20px;line-height:1}
.dbar button:disabled{opacity:.35}
.dl{position:relative;display:inline-flex;align-items:center;min-height:40px;padding:4px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:18px;font-weight:600;white-space:nowrap}
.dl small{color:var(--mut);font-weight:400;font-size:14px;margin-left:6px}
.dl.past{border-color:#c9a23a;background:#fff7dd}
.dl input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;cursor:pointer}
.dbar .rec{font-size:14px;color:var(--mut)}
.bd{font-size:12px;font-weight:600;color:#7a4a00;background:#ffe9b8;border-radius:6px;padding:1px 6px;margin-left:6px;vertical-align:middle}
.mkbox{grid-column:1/-1}
.mkf{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px;display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.mkf label{display:flex;flex-direction:column;font-size:13px;color:var(--mut);gap:3px}
.mkf input,.mkf select,.mk-ctl input,.mk-ctl select{font:inherit;font-size:16px;padding:8px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);min-width:0}
.mkf .full{grid-column:1/-1}
.mkh{margin:16px 2px 6px;font-size:16px;font-weight:700}
.mkh span{color:var(--mut);font-weight:400}
.mkh.late{color:#b4402c}
.mk-ctl{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center}
.mk-ctl input[type=date]{width:150px}.mk-ctl select{width:110px}
.mkc{margin-bottom:7px}
details.mkd summary{cursor:pointer;margin:16px 2px 6px;font-weight:700}
.stat{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
.stat div{background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-size:15px;color:var(--mut)}
.stat b{display:block;font-size:22px;color:var(--ink);line-height:1.1}
.stat .k b{color:#b4402c}
.srch{margin-top:8px;display:flex;gap:8px}
.srch input{flex:1;font:inherit;padding:9px 12px;border:1px solid var(--line);border-radius:10px;background:#fff}
main{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px;padding:12px 14px 80px;align-items:start}
.loading{grid-column:1/-1;color:var(--mut);padding:30px 4px;text-align:center}
section{background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden}
section>h2{margin:0;padding:9px 12px;font-size:16px;display:flex;justify-content:space-between}
section>h2 span{color:var(--mut);font-weight:400}
.s-out>h2{background:var(--out)}.s-wait>h2{background:var(--wait)}.s-m>h2{background:var(--m)}
.s-f>h2{background:var(--f)}.s-left>h2{background:var(--left)}.s-abs>h2{background:var(--abs)}
.list{padding:8px;display:flex;flex-direction:column;gap:7px}
.card{border:1px solid var(--line);border-radius:12px;padding:9px 10px;background:var(--card)}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.nm{font-size:19px;font-weight:600;flex:1;min-width:70px}
.tm{font-size:16px;color:var(--ink);background:#f2f4f2;border:1px solid var(--line);border-radius:8px;padding:3px 8px;cursor:pointer}
.tm.ed{border-color:#c9a23a;background:#fff7dd}
.sub{color:var(--mut);font-size:14px;margin-top:2px}
button{font:inherit;font-size:16px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:9px 14px;min-height:44px;cursor:pointer;color:var(--ink)}
button.p{background:var(--acc);border-color:var(--acc);color:#fff}
button.m{background:var(--m)}button.f{background:var(--f)}
button.g{min-height:36px;padding:5px 10px;font-size:14px;color:var(--mut)}
.out-card{cursor:pointer}
.empty{color:var(--mut);font-size:15px;padding:6px 4px}
#msg{position:fixed;left:0;right:0;bottom:0;background:#3b2a24;color:#fff;padding:9px 14px;font-size:15px;display:none;z-index:9}
#modal{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal .box{background:#fff;border-radius:16px;padding:16px;width:100%;max-width:340px}
#modal h3{margin:0 0 10px;font-size:18px}
#modal input[type=time]{font:inherit;font-size:26px;width:100%;padding:8px;border:1px solid var(--line);border-radius:10px;text-align:center}
.qk{display:flex;gap:8px;margin:10px 0}.qk button{flex:1}
#err{color:#b4402c;font-size:14px;min-height:20px}
.act{display:flex;gap:8px}.act button{flex:1}
#gate{max-width:340px;margin:18vh auto;padding:0 20px}
#gate input{font:inherit;width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;margin:10px 0}
</style>
</head>
<body>
<div id="gate" style="display:none">
  <h1>출석부</h1>
  <input id="pwin" type="password" placeholder="비밀번호" autocomplete="current-password">
  <button class="p" id="pwok" style="width:100%">확인</button>
  <div id="gerr" style="color:#b4402c;margin-top:8px"></div>
</div>
<div id="app" style="display:none">
<header>
  <div class="top">
    <div class="tabs" id="tabs"><button data-g="금">금요일</button><button data-g="토">토요일</button><button data-g="mk">결석·보강</button></div>
    <div class="dbar" id="dbar">
      <button id="dprev" aria-label="이전 주">&#8249;</button>
      <label class="dl" id="dl"><span id="dtxt"></span><small id="dsub"></small><input type="date" id="dpick"></label>
      <button id="dnext" aria-label="다음 주">&#8250;</button>
      <button class="g" id="drec">최근</button>
    </div>
  </div>
  <div class="stat" id="stat"></div>
  <div class="srch"><input id="q" type="search" placeholder="이름 검색" autocomplete="off"></div>
</header>
<div id="mkview" style="display:none;padding:12px 14px 80px">
  <div class="mkf" id="mkform">
    <label>학생<input id="f_name" list="mknames" autocomplete="off"><datalist id="mknames"></datalist></label>
    <label>결석일<input id="f_abs" type="date"></label>
    <label>사유<select id="f_reason"></select></label>
    <label>보강일<input id="f_date" type="date"></label>
    <label>보강 시간대<select id="f_slot"></select></label>
    <label class="full">메모<input id="f_memo" autocomplete="off"></label>
    <button class="p full" id="f_save">등록</button>
    <div class="full" id="f_err" style="color:#b4402c;font-size:14px;min-height:18px"></div>
  </div>
  <div id="mklist"></div>
</div>
<main id="main"></main>
</div>
<div id="msg"></div>
<div id="modal"><div class="box">
  <h3 id="mt"></h3>
  <input id="mi" type="time">
  <div class="qk"><button data-d="-5">-5분</button><button data-d="-10">-10분</button><button data-d="5">+5분</button></div>
  <div id="err"></div>
  <div class="act"><button id="mc">닫기</button><button class="p" id="ms">저장</button></div>
</div></div>
<script>
(function(){
var API='https://script.google.com/macros/s/AKfycby5Y6FhgpP3jiNQSAwITDIMzBp8CVIuyLWUPEVIShUUMlXh5UOzupcL8aPyvN-xfsBO/exec';
var TEACH={'남':'남쌤','여':'여쌤'};
var DAYS=['일','월','화','수','목','금','토'];
var WD={'금':5,'토':6};
var ST={'금':{roster:[],rec:{},mk:[],Q:[],busy:false,loaded:false},'토':{roster:[],rec:{},mk:[],Q:[],busy:false,loaded:false}};
var VIEW='att';
var MK={list:[],names:[],loaded:false,busy:false,err:''};
var SLOTS=['불참','11시','11시30분','12시','12시30분','1시','1시30분','2시','2시30분','3시','3시30분','4시','4시30분','5시','5시30분','6시','6시30분','7시','7시30분'];
var REASONS=['병결','무단','여행/휴가','개인','미완료','학교 행사','부모님연락','보충','가족행사'];
var DATES={'금':'','토':''};
var GM={};
var pw='',query='',editing=null,errState='',lastTap=0,lastKey='';

function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v);}catch(e){}return null;}
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function todayKey(){return new Intl.DateTimeFormat('en-CA',{timeZone:'Asia/Seoul',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());}
function dowOf(k){var p=k.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2])).getUTCDay();}
function addDays(k,n){var p=k.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]+n)).toISOString().slice(0,10);}
function dayLabel(k){var p=k.split('-').map(Number);return p[1]+'/'+p[2]+'('+DAYS[dowOf(k)]+')';}
function defDate(g){var t=todayKey();return addDays(t,-((dowOf(t)-WD[g]+7)%7));}
function kst(ms){return new Date(ms+9*3600000);}
function hm(ms){var d=kst(ms),h=d.getUTCHours(),m=d.getUTCMinutes();return (h<10?'0':'')+h+':'+(m<10?'0':'')+m;}
function toMs(key,hhmm){var p=key.split('-').map(Number),t=hhmm.split(':').map(Number);return Date.UTC(p[0],p[1]-1,p[2],t[0]-9,t[1]);}
function stay(a,l){var min=Math.round((l-a)/60000);if(min<0)return '';var h=Math.floor(min/60);return (h?h+'시간 ':'')+(min%60)+'분';}

/* 처음 열 때 탭: 주소의 g 값이 있으면 그것, 없으면 오늘이 토요일일 때만 토요일 */
var gp=new URLSearchParams(location.search).get('g');
var G=(gp==='sat'||gp==='토')?'토':(gp==='fri'||gp==='금')?'금':(dowOf(todayKey())===6?'토':'금');

/* 로컬 반영 (서버 apply_와 동일 규칙) */
function recFor(g,n){var R=ST[g].rec;return R[n]||(R[n]={arrive:null,teacher:'',leave:null,status:'',memo:'',a0:null,l0:null});}
function applyLocal(op,g){
  var r=recFor(g,op.name),t=op.t;
  if(op.op==='arrive'){if(!r.arrive)r.arrive=t;if(r.status!=='left')r.status='in';}
  else if(op.op==='assign'){if(!r.arrive)r.arrive=t;r.teacher=op.teacher;if(r.status!=='left')r.status='in';}
  else if(op.op==='leave'){if(!r.arrive)r.arrive=t;r.leave=t;r.status='left';}
  else if(op.op==='absent'){r.status='absent';}
  else if(op.op==='back'){if(r.status==='left'){r.leave=null;r.status='in';}else if(r.teacher){r.teacher='';}else{r.arrive=null;r.status='';}}
  else if(op.op==='edit'){if(op.field==='arrive'){if(!r.a0)r.a0=r.arrive;r.arrive=t;}else{if(!r.l0)r.l0=r.leave;r.leave=t;}}
}
function saveQ(g){ls('att_q_'+g,JSON.stringify(ST[g].Q));}
function cacheKey(g,d){return 'att_s_'+g+'_'+d;}
function loadCache(g){
  var S=ST[g],d=DATES[g];S.rec={};S.mk=[];S.loaded=false;
  try{var cc=JSON.parse(ls(cacheKey(g,d))||'null');if(cc&&cc.roster){S.roster=cc.roster;S.rec=cc.rec||{};S.mk=cc.mk||[];S.loaded=true;}}catch(e){}
  S.Q.forEach(function(o){if(o.date===d)applyLocal(o,g);});
}
function pruneCache(){
  try{var lim=addDays(todayKey(),-14),del=[];
    for(var i=0;i<localStorage.length;i++){var k=localStorage.key(i);
      if(k&&k.indexOf('att_s_')===0){var m=k.match(/_(\d{4}-\d{2}-\d{2})$/);if(!m||m[1]<lim)del.push(k);}}
    del.forEach(function(k){localStorage.removeItem(k);});}catch(e){}
}
function push(op){
  var g=G;
  op.date=DATES[g];op.t=op.t||Date.now();op.id=Date.now()+'-'+Math.random().toString(36).slice(2,8);
  applyLocal(op,g);ST[g].Q.push(op);saveQ(g);render();sync(g);
}
/* 지난 날짜에서는 등원·귀가 시각을 직접 입력 */
function needsTime(op){var r=ST[G].rec[op.name]||{};return op.op==='arrive'||op.op==='leave'||(op.op==='assign'&&!r.arrive);}
function act(op){
  if(DATES[G]!==todayKey()&&needsTime(op)){askTime(op);return;}
  push(op);
}
function askTime(op){
  var r=ST[G].rec[op.name]||{},isLeave=op.op==='leave';
  editing={mode:'new',op:op,name:op.name,field:isLeave?'leave':'arrive',g:G};
  document.getElementById('mt').textContent=op.name+' · '+(isLeave?'귀가':'등원')+' 시각 ('+dayLabel(DATES[G])+')';
  document.getElementById('mi').value=isLeave&&r.arrive?hm(r.arrive+3600000):'15:00';
  document.getElementById('err').textContent='';
  document.getElementById('modal').style.display='flex';
}

function bucket(n){
  var r=ST[G].rec[n];if(!r||!r.status)return 'out';
  if(r.status==='absent')return 'abs';
  if(r.status==='left')return 'left';
  if(r.teacher==='남')return 'm';
  if(r.teacher==='여')return 'f';
  return 'wait';
}
function timeBtn(n,field,ms,orig){return '<span class="tm'+(orig?' ed':'')+'" data-edit="'+field+'" data-name="'+esc(n)+'">'+hm(ms)+'</span>';}
function badge(n){return GM[n]?'<span class="bd">보강'+(GM[n].trim()?' '+esc(GM[n].trim()):'')+'</span>':'';}
function card(n,b){
  var r=ST[G].rec[n]||{},e=esc(n),h='';
  if(b==='out'){
    return '<div class="card out-card" data-op="arrive" data-name="'+e+'"><div class="row"><span class="nm">'+e+badge(n)+'</span><button class="g" data-op="absent" data-name="'+e+'">결석</button></div></div>';
  }
  h='<div class="card"><div class="row"><span class="nm">'+e+badge(n)+'</span>';
  if(b==='wait'){h+=timeBtn(n,'arrive',r.arrive,r.a0)+'</div><div class="row" style="margin-top:8px"><button class="m" data-op="assign" data-teacher="남" data-name="'+e+'">남쌤</button><button class="f" data-op="assign" data-teacher="여" data-name="'+e+'">여쌤</button><button class="g" data-op="back" data-name="'+e+'">취소</button></div>';}
  else if(b==='m'||b==='f'){var o=b==='m'?'여':'남';h+=timeBtn(n,'arrive',r.arrive,r.a0)+'</div><div class="row" style="margin-top:8px"><button class="p" data-op="leave" data-name="'+e+'">귀가</button><button class="g" data-op="assign" data-teacher="'+o+'" data-name="'+e+'">'+TEACH[o]+'으로 이동</button><button class="g" data-op="back" data-name="'+e+'">취소</button></div>';}
  else if(b==='left'){h+=timeBtn(n,'arrive',r.arrive,r.a0)+'<span style="color:var(--mut)">-</span>'+timeBtn(n,'leave',r.leave,r.l0)+'</div><div class="sub">'+(r.teacher?TEACH[r.teacher]+' · ':'')+'체류 '+stay(r.arrive,r.leave)+'</div><div class="row" style="margin-top:6px"><button class="g" data-op="back" data-name="'+e+'">귀가 취소</button></div>';}
  else if(b==='abs'){h+='</div><div class="row" style="margin-top:6px"><button class="g" data-op="back" data-name="'+e+'">결석 취소</button></div>';}
  return h+'</div>';
}
function renderDbar(){
  var d=DATES[G],t=todayKey();
  document.getElementById('dtxt').textContent=dayLabel(d);
  document.getElementById('dsub').textContent=d===t?'오늘':(d>t?'':'지난 기록');
  document.getElementById('dl').className='dl'+(d!==t?' past':'');
  document.getElementById('dpick').value=d;
  document.getElementById('dpick').max=t;
  document.getElementById('dnext').disabled=addDays(d,7)>t;
  document.getElementById('drec').style.display=(d===defDate(G))?'none':'';
}
function updMsg(){
  var pend=ST['금'].Q.length+ST['토'].Q.length;
  var m=document.getElementById('msg');
  if(errState){m.textContent=errState;m.style.display='block';}
  else if(pend){m.textContent='저장 대기 '+pend+'건';m.style.display='block';}
  else m.style.display='none';
}
function render(){
  var S=ST[G],mv=(VIEW==='mk');
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'),function(b){var g=b.getAttribute('data-g');b.className=(mv?g==='mk':g===G)?'on':'';});
  document.getElementById('dbar').style.display=mv?'none':'';
  document.getElementById('stat').style.display=mv?'none':'';
  document.querySelector('.srch').style.display=mv?'none':'';
  document.getElementById('main').style.display=mv?'none':'';
  document.getElementById('mkview').style.display=mv?'block':'none';
  if(mv){renderMk();updMsg();return;}
  renderDbar();
  var names=S.roster.map(function(x){return x.name;});
  GM={};
  (S.mk||[]).forEach(function(m){
    if(names.indexOf(m.name)>=0&&!GM[m.name]){var rr0=S.rec[m.name];if(!(m.done&&!(rr0&&rr0.status)))GM[m.name]=m.slot||' ';return;}
    var rr=S.rec[m.name];
    if(!m.done||(rr&&rr.status)){GM[m.name]=m.slot||' ';if(names.indexOf(m.name)<0)names.push(m.name);}
  });
  Object.keys(S.rec).forEach(function(n){if(names.indexOf(n)<0&&S.rec[n].status)names.push(n);});
  if(!S.loaded){
    document.getElementById('stat').innerHTML='';
    document.getElementById('main').innerHTML='<div class="loading">'+(errState?'연결되면 표시됩니다':'불러오는 중')+'</div>';
  }else{
    var B={out:[],wait:[],m:[],f:[],left:[],abs:[]};
    names.forEach(function(n){if(!query||n.toLowerCase().indexOf(query)>=0)B[bucket(n)].push(n);});
    var byArr=function(a,b){return (S.rec[a].arrive||0)-(S.rec[b].arrive||0);};
    B.out.sort(function(a,b){var ga=GM[a]?0:1,gb=GM[b]?0:1;return ga-gb||(a<b?-1:a>b?1:0);});['wait','m','f','left'].forEach(function(k){B[k].sort(byArr);});B.abs.sort();
    var all={out:0,wait:0,m:0,f:0,left:0,abs:0};
    names.forEach(function(n){all[bucket(n)]++;});
    var arrived=all.wait+all.m+all.f+all.left;
    document.getElementById('stat').innerHTML=
      '<div class="k"><b>'+all.out+'</b>안 온 학생</div><div><b>'+arrived+'</b>등원</div><div><b>'+(all.m+all.f)+'</b>수업 중</div><div><b>'+all.left+'</b>귀가</div><div><b>'+all.abs+'</b>결석</div><div><b>'+names.length+'</b>전체</div>';
    var defs=[['out','TODAY'],['wait','등원 · 배정 전'],['m','남쌤'],['f','여쌤'],['left','귀가'],['abs','결석']];
    document.getElementById('main').innerHTML=defs.map(function(d){
      var l=B[d[0]];
      return '<section class="s-'+d[0]+'"><h2>'+d[1]+'<span>'+all[d[0]]+'</span></h2><div class="list">'+(l.length?l.map(function(n){return card(n,d[0]);}).join(''):'<div class="empty">-</div>')+'</div></section>';
    }).join('');
  }
  updMsg();
}

/* 서버 동기화 (탭별) */
function post(body){
  var c=new AbortController(),tm=setTimeout(function(){c.abort();},15000);
  return fetch(API,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body),signal:c.signal}).then(function(r){clearTimeout(tm);return r.json();},function(e){clearTimeout(tm);throw e;});
}
function sync(g){
  g=g||G;
  var S=ST[g];
  if(S.busy||!pw)return;
  if(API.indexOf('__API')===0){errState='서버 주소 미설정';render();return;}
  S.busy=true;
  var sent=S.Q.slice(),d=DATES[g];
  post({act:'ops',pw:pw,date:d,group:g,ops:sent}).then(function(res){
    S.busy=false;
    if(!res.ok){
      if(res.err==='auth'){ls('att_pw',null);pw='';showGate('비밀번호가 맞지 않습니다');return;}
      errState='서버 오류';render();return;
    }
    errState='';
    S.Q.splice(0,sent.length);saveQ(g);
    if(res.errs&&res.errs.length)errState=res.errs[0];
    if(DATES[g]===d){
      if(!S.Q.length){S.roster=res.roster;S.rec=res.rec;S.mk=res.mk||[];S.loaded=true;ls(cacheKey(g,d),JSON.stringify({roster:S.roster,rec:S.rec,mk:S.mk}));}
      else if(!S.roster.length){S.roster=res.roster;}
    }
    render();
    if(S.Q.length||DATES[g]!==d)sync(g);
  }).catch(function(){S.busy=false;errState='연결 끊김 · 기록은 기기에 보관 중';render();});
}
function syncAll(){if(VIEW==='mk'){mkLoad();}sync(G);var o=(G==='금')?'토':'금';if(ST[o].Q.length)sync(o);}
function setDate(d){
  if(!d||d>todayKey())return;
  DATES[G]=d;loadCache(G);closeEdit();render();sync(G);
}

/* 이벤트 */
document.getElementById('main').addEventListener('click',function(ev){
  var t=ev.target.closest('[data-edit]');
  if(t){openEdit(t.getAttribute('data-name'),t.getAttribute('data-edit'));return;}
  var b=ev.target.closest('[data-op]');
  if(!b)return;
  ev.stopPropagation();
  var nw=Date.now(),sc=b.closest('section'),kk=sc?sc.className:'';if(kk===lastKey&&nw-lastTap<350)return;lastKey=kk;lastTap=nw;
  var op={op:b.getAttribute('data-op'),name:b.getAttribute('data-name')};
  if(op.op==='assign')op.teacher=b.getAttribute('data-teacher');
  act(op);
});
document.getElementById('tabs').addEventListener('click',function(ev){
  var b=ev.target.closest('button[data-g]');if(!b)return;
  var g=b.getAttribute('data-g');
  if(g==='mk'){if(VIEW==='mk')return;VIEW='mk';closeEdit();render();mkLoad();window.scrollTo(0,0);return;}
  if(VIEW==='att'&&g===G)return;
  VIEW='att';closeEdit();G=g;lastKey='';
  render();sync(G);
  window.scrollTo(0,0);
});
document.getElementById('dprev').onclick=function(){setDate(addDays(DATES[G],-7));};
document.getElementById('dnext').onclick=function(){setDate(addDays(DATES[G],7));};
document.getElementById('drec').onclick=function(){setDate(defDate(G));};
document.getElementById('dpick').addEventListener('change',function(e){setDate(e.target.value);});
document.getElementById('q').addEventListener('input',function(e){query=e.target.value.trim().toLowerCase();render();});

function openEdit(name,field){
  var r=ST[G].rec[name];if(!r||!r[field])return;
  editing={mode:'edit',name:name,field:field,g:G};
  document.getElementById('mt').textContent=name+' · '+(field==='arrive'?'등원':'귀가')+' 시각';
  document.getElementById('mi').value=hm(r[field]);
  document.getElementById('err').textContent='';
  document.getElementById('modal').style.display='flex';
}
function closeEdit(){editing=null;document.getElementById('modal').style.display='none';}
document.getElementById('mc').onclick=closeEdit;
document.querySelectorAll('.qk button').forEach(function(b){b.onclick=function(){
  var i=document.getElementById('mi'),v=i.value||'00:00',p=v.split(':').map(Number);
  var tot=((p[0]*60+p[1]+Number(b.getAttribute('data-d')))+1440)%1440;
  i.value=('0'+Math.floor(tot/60)).slice(-2)+':'+('0'+(tot%60)).slice(-2);
};});
document.getElementById('ms').onclick=function(){
  if(!editing)return;
  var v=document.getElementById('mi').value;if(!v)return;
  var g=editing.g,d=DATES[g],ms=toMs(d,v),r=ST[g].rec[editing.name]||{},er=document.getElementById('err');
  if(editing.field==='leave'&&r.arrive&&ms<r.arrive){er.textContent='귀가 시각이 등원 시각보다 빠릅니다';return;}
  if(editing.field==='arrive'&&r.leave&&ms>r.leave){er.textContent='등원 시각이 귀가 시각보다 늦습니다';return;}
  if(editing.field==='arrive'&&ms>Date.now()+60000){er.textContent='현재 시각보다 늦습니다';return;}
  var op;
  if(editing.mode==='new'){op=editing.op;op.t=ms;}
  else op={op:'edit',name:editing.name,field:editing.field,t:ms};
  closeEdit();push(op);
};


/* ===== 결석·보강 ===== */
var MKARM=null,MKINIT=false;
function mkPost(ops){
  MK.busy=true;
  return post({act:'mk',pw:pw,ops:ops||[]}).then(function(res){
    MK.busy=false;
    if(!res.ok){if(res.err==='auth'){ls('att_pw',null);pw='';showGate('비밀번호가 맞지 않습니다');return;}MK.err='서버 오류';render();return;}
    MK.list=res.list;MK.names=res.names;MK.loaded=true;MK.err=(res.errs&&res.errs[0])||'';
    if(VIEW==='mk')render();
    return res;
  }).catch(function(){MK.busy=false;MK.err='연결 끊김';if(VIEW==='mk')render();});
}
function mkLoad(){if(MK.busy||!pw)return;var a=document.activeElement;if(a&&document.getElementById('mklist').contains(a))return;mkPost([]);}
function mkOp(op){op.id=Date.now()+'-'+Math.random().toString(36).slice(2,8);return mkPost([op]);}
function opts(arr,sel,blank){return (blank?'<option value="">'+blank+'</option>':'')+arr.map(function(x){return '<option'+(x===sel?' selected':'')+'>'+esc(x)+'</option>';}).join('');}
function mkItem(m,kind){
  var late=kind==='late';
  var h='<div class="card mkc"><div class="row"><span class="nm">'+esc(m.name)+'</span>';
  h+=(m.date?'<span class="tm" style="cursor:default'+(late?';border-color:#b4402c;color:#b4402c':'')+'">'+dayLabel(m.date)+(m.slot?' '+esc(m.slot):'')+'</span>':'<span class="tm" style="cursor:default">보강일 미정</span>')+'</div>';
  h+='<div class="sub">'+(m.abs?'결석 '+dayLabel(m.abs):'')+(m.reason?' · '+esc(m.reason):'')+(m.memo?' · '+esc(m.memo):'')+(m.kind?' · '+esc(m.kind):'')+(m.arr?' · 도착 '+esc(m.arr):'')+'</div>';
  var nm=esc(m.name),rw=m.row;
  h+='<div class="mk-ctl">';
  if(!m.done){
    h+='<input type="date" data-mkf="date" data-row="'+rw+'" data-name="'+nm+'" value="'+m.date+'">';
    h+='<select data-mkf="slot" data-row="'+rw+'" data-name="'+nm+'">'+opts(SLOTS,m.slot,'시간대')+'</select>';
    h+='<button class="p" data-mk="done" data-row="'+rw+'" data-name="'+nm+'">보강 완료</button>';
  }else{
    h+='<button class="g" data-mk="undo" data-row="'+rw+'" data-name="'+nm+'">완료 취소</button>';
  }
  var armed=MKARM&&MKARM.row===rw&&Date.now()-MKARM.t<4000;
  h+='<button class="g" data-mk="del" data-row="'+rw+'" data-name="'+nm+'"'+(armed?' style="color:#b4402c;border-color:#b4402c"':'')+'>'+(armed?'정말 삭제':'삭제')+'</button>';
  return h+'</div></div>';
}
function renderMk(){
  if(!MKINIT){
    MKINIT=true;
    document.getElementById('f_reason').innerHTML=opts(REASONS,'','사유 선택');
    document.getElementById('f_slot').innerHTML=opts(SLOTS,'','선택 안 함');
    document.getElementById('f_abs').value=todayKey();
  }
  document.getElementById('mknames').innerHTML=MK.names.map(function(n){return '<option value="'+esc(n)+'">';}).join('');
  var L=document.getElementById('mklist'),t=todayKey();
  if(!MK.loaded){L.innerHTML='<div class="loading">'+(MK.err||'불러오는 중')+'</div>';return;}
  var pend=MK.list.filter(function(m){return !m.done&&m.kind!=='보강기회X';});
  var late=pend.filter(function(m){return m.date&&m.date<t;}).sort(function(a,b){return a.date<b.date?-1:1;});
  var up=pend.filter(function(m){return m.date&&m.date>=t;}).sort(function(a,b){return a.date<b.date?-1:a.date>b.date?1:0;});
  var nod=pend.filter(function(m){return !m.date;});
  var done=MK.list.filter(function(m){return m.done;}).sort(function(a,b){return b.row-a.row;}).slice(0,30);
  function sec(title,arr,cls,kind){return arr.length?'<div class="mkh '+cls+'">'+title+' <span>'+arr.length+'</span></div>'+arr.map(function(m){return mkItem(m,kind);}).join(''):'';}
  L.innerHTML=(MK.err?'<div style="color:#b4402c;margin-top:8px">'+esc(MK.err)+'</div>':'')+
    sec('밀린 보강',late,'late','late')+sec('예정된 보강',up,'','up')+sec('보강일 미정',nod,'','nod')+
    (pend.length?'':'<div class="empty" style="margin-top:14px">대기 중인 보강 없음</div>')+
    (done.length?'<details class="mkd"><summary>보강 완료 (최근 '+done.length+'건)</summary>'+done.map(function(m){return mkItem(m,'done');}).join('')+'</details>':'');
}
document.getElementById('f_save').onclick=function(){
  var name=document.getElementById('f_name').value.trim(),er=document.getElementById('f_err');
  if(!name){er.textContent='학생 이름을 입력하세요';return;}
  var op={op:'mk_add',name:name,abs:document.getElementById('f_abs').value,reason:document.getElementById('f_reason').value,date:document.getElementById('f_date').value,slot:document.getElementById('f_slot').value,memo:document.getElementById('f_memo').value.trim()};
  er.textContent='';
  mkOp(op).then(function(r){
    if(r&&r.errs&&r.errs.length){er.textContent=r.errs[0];return;}
    ['f_name','f_date','f_memo'].forEach(function(i){document.getElementById(i).value='';});
    document.getElementById('f_reason').value='';document.getElementById('f_slot').value='';
  });
};
document.getElementById('mklist').addEventListener('click',function(ev){
  var b=ev.target.closest('[data-mk]');if(!b)return;
  var a=b.getAttribute('data-mk'),row=Number(b.getAttribute('data-row')),name=b.getAttribute('data-name');
  if(a==='del'){
    if(MKARM&&MKARM.row===row&&Date.now()-MKARM.t<4000){MKARM=null;mkOp({op:'mk_del',row:row,name:name});}
    else{MKARM={row:row,t:Date.now()};renderMk();setTimeout(function(){if(VIEW==='mk')renderMk();},4100);}
    return;
  }
  if(a==='done')mkOp({op:'mk_set',row:row,name:name,f:{done:true}});
  if(a==='undo')mkOp({op:'mk_set',row:row,name:name,f:{done:false}});
});
document.getElementById('mklist').addEventListener('change',function(ev){
  var c=ev.target.closest('[data-mkf]');if(!c)return;
  var f={};f[c.getAttribute('data-mkf')]=c.value;
  mkOp({op:'mk_set',row:Number(c.getAttribute('data-row')),name:c.getAttribute('data-name'),f:f});
});

/* 비밀번호 */
function showGate(m){
  document.getElementById('app').style.display='none';
  document.getElementById('gate').style.display='block';
  document.getElementById('gerr').textContent=m||'';
}
document.getElementById('pwok').onclick=function(){
  var v=document.getElementById('pwin').value;if(!v)return;
  pw=v;ls('att_pw',v);start();
};
document.getElementById('pwin').addEventListener('keydown',function(e){if(e.key==='Enter')document.getElementById('pwok').click();});

function start(){
  document.getElementById('gate').style.display='none';
  document.getElementById('app').style.display='block';
  render();syncAll();
}
pruneCache();
['금','토'].forEach(function(g){
  var S=ST[g];
  DATES[g]=defDate(g);
  try{S.Q=JSON.parse(ls('att_q_'+g)||'[]');}catch(e){S.Q=[];}
  loadCache(g);
});
pw=ls('att_pw')||'';
if(pw)start();else showGate('');
setInterval(syncAll,10000);
document.addEventListener('visibilitychange',function(){if(!document.hidden)syncAll();});
})();
</script>
