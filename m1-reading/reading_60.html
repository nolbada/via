rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Hello, everyone. My name is Amélie.","ko":"안녕하세요, 여러분. 제 이름은 Amélie입니다.","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"Welcome to me husband's gallery. Look at me.","ko":"제 남편의 미술관에 오신 것을 환영합니다. 저를 보세요.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"my","partial":false,"at":[2],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 my 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 my 사용"}]},{"n":3,"tag":null,"en":"Does you think that I'm strange? My husband, Henri Matisse, color my face in green.","ko":"여러분은 제가 이상하다고 생각하세요? 제 남편, 앙리 마티스가 제 얼굴을 녹색으로 색칠했어요.","ok":false,"foot":[],"fixes":[{"wrong":"Does","right":"Do","partial":false,"at":[0],"point":"do/does 의문문: 주어 you에는 Do 사용","topic":"do/does 의문문","memo":"주어 you에는 Do 사용"},{"wrong":"color","right":"colored","partial":false,"at":[10],"point":"과거시제: 과거 이야기: color가 아니라 colored","topic":"과거시제","memo":"과거 이야기: color가 아니라 colored"}]},{"n":4,"tag":null,"en":"Don't worry. My face isn't actual green.","ko":"걱정하지 마세요. 제 얼굴은 실제로 녹색이 아니에요.","ok":false,"foot":[],"fixes":[{"wrong":"actual","right":"actually","partial":false,"at":[5],"point":"형용사와 부사: 형용사 green을 꾸미는 말은 부사 actually 사용","topic":"형용사와 부사","memo":"형용사 green을 꾸미는 말은 부사 actually 사용"}]},{"n":5,"tag":null,"en":"Why did he painted me this way then? He wanted to express he emotions with bright and wildly colors.","ko":"그러면 왜 그는 저를 이런 식으로 칠했을까요? 그는 밝고 거친 색으로 그의 감정을 표현하기를 원했거든요.","ok":false,"foot":[],"fixes":[{"wrong":"painted","right":"paint","partial":false,"at":[3],"point":"did 뒤 동사원형: did 뒤에는 동사원형 paint 사용","topic":"did 뒤 동사원형","memo":"did 뒤에는 동사원형 paint 사용"},{"wrong":"he","right":"his","partial":false,"at":[12],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 his 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 his 사용"},{"wrong":"wildly","right":"wild","partial":false,"at":[17],"point":"형용사와 부사: 명사 colors를 꾸미는 말은 형용사 wild 사용","topic":"형용사와 부사","memo":"명사 colors를 꾸미는 말은 형용사 wild 사용"}]},{"n":6,"tag":null,"en":"People didn't like these painting style at first. Some people thought that an beast painted me.","ko":"사람들은 처음에 이 그림 스타일을 좋아하지 않았어요. 어떤 사람들은 야수가 저를 그렸다고 생각했죠.","ok":false,"foot":[],"fixes":[{"wrong":"these","right":"this","partial":false,"at":[3],"point":"지시형용사 this/these: 단수명사 style이므로 this 사용","topic":"지시형용사 this/these","memo":"단수명사 style이므로 this 사용"},{"wrong":"an","right":"a","partial":false,"at":[12],"point":"관사 a/an: beast는 자음 소리로 시작하므로 a 사용","topic":"관사 a/an","memo":"beast는 자음 소리로 시작하므로 a 사용"}]},{"n":7,"tag":null,"en":"So, he got the nickname Wild Beast. He kept his own style and finally becomed famous.","ko":"그래서 그는 ‘야수’라는 별명을 얻었어요. 그는 자신만의 스타일을 지켰고 마침내 유명해졌어요.","ok":false,"foot":[],"fixes":[{"wrong":"becomed","right":"became","partial":false,"at":[14],"point":"불규칙 과거형: become의 과거형은 becomed가 아니라 became","topic":"불규칙 과거형","memo":"become의 과거형은 becomed가 아니라 became"}]},{"n":8,"tag":null,"en":"Hi, there. Can you finds me in the picture?","ko":"안녕하세요. 여러분은 그림에서 저를 찾을 수 있나요?","ok":false,"foot":[],"fixes":[{"wrong":"finds","right":"find","partial":false,"at":[4],"point":"조동사 뒤 동사원형: 조동사 Can 뒤에는 동사원형 find 사용","topic":"조동사 뒤 동사원형","memo":"조동사 Can 뒤에는 동사원형 find 사용"}]},{"n":9,"tag":null,"en":"Actually, I'm an animal. Start from the green shape on the middle.","ko":"사실, 저는 동물이에요. 가운데에 있는 녹색 모양부터 시작하세요.","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"in","partial":false,"at":[9],"point":"기본전치사: \"한가운데에\"는 in the middle 사용","topic":"기본전치사","memo":"\"한가운데에\"는 in the middle 사용"}]},{"n":10,"tag":null,"en":"Then trace another shapes with your finger. They look like a snail shell.","ko":"그런 다음, 여러분의 손가락으로 다른 모양들을 따라가세요. 그것들은 달팽이 껍데기처럼 생겼어요.","ok":false,"foot":[],"fixes":[{"wrong":"another","right":"the other","partial":false,"at":[2],"point":"수량 한정사 another/other: another는 단수명사와 쓰고 복수는 the other shapes 사용","topic":"수량 한정사 another/other","memo":"another는 단수명사와 쓰고 복수는 the other shapes 사용"}]},{"n":11,"tag":null,"en":"Yes, I'm a snail! Matisse create me in a unique way.","ko":"네, 저는 달팽이예요! 마티스는 저를 독특한 방식으로 창조했어요.","ok":false,"foot":[],"fix  colored my face in green. Don't worry. My face isn't actually green. Why did he paint me this way then? He wanted to express his emotions with bright and wild colors. People didn't like this painting style at first. Some people thought that a beast painted me. So, he got the nickname Wild Beast. He kept his own style and finally became famous.","Hi, there. Can you find me in the picture? Actually, I'm an animal. Start from the green shape in the middle. Then trace the other shapes with your finger. They look like a snail shell. Yes, I'm a snail! Matisse created me in a unique way. He painted paper and cut out shapes with scissors. Then he put the shapes together and made me. At the age of 70, Matisse got very sick. However, he never gave up art. He created a new art form. It's cut-outs. Do you want to find more artworks like me? Look around the gallery and explore Henri Matisse's world of art!"];var PASS_KO=["그림이 예술가에 대해 이야기한다!","안녕하세요, 여러분. 제 이름은 Amélie입니다. 제 남편의 미술관에 오신 것을 환영합니다. 저를 보세요. 여러분은 제가 이상하다고 생각하세요? 제 남편, 앙리 마티스가 제 얼굴을 녹색으로 색칠했어요. 걱정하지 마세요. 제 얼굴은 실제로 녹색이 아니에요. 그러면 왜 그는 저를 이런 식으로 칠했을까요? 그는 밝고 거친 색으로 그의 감정을 표현하기를 원했거든요. 사람들은 처음에 이 그림 스타일을 좋아하지 않았어요. 어떤 사람들은 야수가 저를 그렸다고 생각했죠. 그래서 그는 ‘야수’라는 별명을 얻었어요. 그는 자신만의 스타일을 지켰고 마침내 유명해졌어요.","안녕하세요. 여러분은 그림에서 저를 찾을 수 있나요? 사실, 저는 동물이에요. 가운데에 있는 녹색 모양부터 시작하세요. 그런 다음, 여러분의 손가락으로 다른 모양들을 따라가세요. 그것들은 달팽이 껍데기처럼 생겼어요. 네, 저는 달팽이예요! 마티스는 저를 독특한 방식으로 창조했어요. 그는 종이를 색칠하고 가위로 모양들을 오려 냈어요. 그런 다음, 그는 그 모양들을 합쳐서 저를 만들었어요. 70세의 나이에, 마티스는 매우 아팠어요. 하지만 그는 예술을 결코 포기하지 않았어요. 그는 새로운 예술 형식을 만들었어요. 그것은 종이 오리기(cut-outs)예요. 여러분은 저와 같은 예술 작품을 더 찾아보고 싶으신가요? 미술관을 둘러보며 앙리 마티스의 예술 세계를 탐험해 보세요!"];var DG=[{"qs":[{"n":1,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["The girl is wondering about the boy's opinion about the painting.","The boy feels very peaceful from the painting.","The artist used the green colors in the painting.","The boy thinks the painter liked nature a lot.","The girl and the boy have different opinions about the painting."],"a":4,"ans":"The gi hink about this bag?","이 가방에 대해 어떻게 생각해?"],["B","I think the design is unique.","나는 디자인이 독특하다고 생각해."],["A","The price is also good. What do you think?","가격도 좋아. 너는 어떻게 생각해?"],["B","Well, I don't think so. It's a bit expensive for me.","글쎄, 나는 그렇게 생각하지 않아. 나한테는 좀 비싸."]]},{"qs":[{"n":4,"q":"위 대화를 읽고 알 수 없는 것은?","o":["전시회 장소","전시회 주제","전시회 오픈 시간","전시회 끝나는 날","전시회에서 배울 점"],"a":2,"ans":"전시회 오픈 시간","evs":[["Look! The van Gogh exhibition is going on at Mirae Museum. How about going there together?","봐! 반 고흐 전시회가 미래 미술관에서 열리고 있어. 같이 가는 게 어때?"],["We can also learn about his life and art in the exhibition.","우리는 그 전시회에서 그의 삶과 예술에 대해서도 배울 수 있어."],["When can we go? It ends on October 1st.","우리 언제 갈 수 있을까? 10월 1일에 끝나."]],"ev":["Look! The van Gogh exhibition is going on at Mirae Museum. How about going there together?","봐! 반 고흐 전시회가 미래 미술관에서 열리고 있어. 같이 가는 게 어때?"],"ow":["오답 ✕ — 'The van Gogh exhibition is going on at Mirae Museum.'(반 고흐 전시회가 미래 미술관에서 열리고 있어)에서 장소를 알 수 있어요. 알 수 있는 정보예요.","오답 ✕ — 'The van Gogh exhibition'(반 고흐 전시회)이라고 했으므로 전시회의 주제를 알 수 있어요.","정답 ○ — 대화에는 전시회가 몇 시에 여는지에 대한 말이 전혀 없어요. 가장 가까운 문장은 'It ends on October 1st.'(10월 1일에 끝나)인데, 이것은 끝나는 날이지 오픈 시간이 아니에요. 그래서 알 수 없는 것이에요.","오답 ✕ — 'It ends on October 1st.'(10월 1일에 끝나)라고 했으므로 전시회가 끝나는 날을 알 수 있어요.","오답 ✕ — 'We can also learn about his life and art in the exhibition.'(그 전시회에서 그의 삶과 예술에 대해서도 배울 수 있어)에서 배울 점을 알 수 있어요."],"memo":["정답: ③ 전시회 오픈 시간 (대화에 나오지 않음)","근거: It ends on October 1st.(10월 1일에 끝나.) — 끝나는 날만 나오고 여는 시간은 없음","함정: ④ 끝나는 날은 October 1st라고 나와서 알 수 있어"],"why":"전시회 장소·주제·끝나는 날·배울 점은 나오지만 오픈 시간은 나오지 않는다."},{"n":5,"q":"When will the speakers go to the exhibition?","o":["They will go to the museum.","They will go there this Saturday.","They will go there on October 1st.","They will hear about van Gogh's life.","They will see paintings of different artists."],"a":1,"ans":"They will go there this Saturday.","evs":[["Let's go there this Saturday then.","그럼 이번 토요일에 거기에 가자."]],"ev":["Let's go there this Saturday then.","그럼 이번 토요일에 거기에 가자."],"ow":["오답 ✕ — 'going on at Mirae Museum'(미래 미술관에서 열리고 있어)은 전시회가 열리는 장소예요. 이 질문은 '언제' 갈 것인지를 묻고 있어서 답이 되지 않아요.","정답 ○ — 'When can we go?'(우리 언제 갈 수 있을까?)에 Alex가 'Let's go there this Saturday then.'(그럼 이번 토요일에 거기에 가자)라고 했고 Minji가 'That sounds great.'(좋아)라고 동의했어요.","오답 ✕ — 'It ends on October 1st.'(10월 1일에 끝나)는 전시회가 끝나는 날이에요. 가기로 한 날은 이번 토요일이에요.","오답 ✕ — 'We can also learn about his life and art'(그의 삶과 예술에 대해서도 배울 수 있어)는 가서 하게 될 일이지 '언제'에 대한 답이 아니에요.","오답 ✕ — 대화에는 여러 화가의 그림을 본다는 말이 없어요. 'I want to see van Gogh's paintings.'(반 고흐의 그림을 보고 싶어)처럼 반 고흐만 나와요."],"memo":["정답: ② They will go there this Saturday. (이번 토요일)","근거: Let's go there this Saturday then.(그럼 이번 토요일에 거기에 가자.)","함정: ③ October 1st는 전시회가 끝나는 날이야"],"why":"전시회에 가기로 한 날은 이번 토요일이다."}],"dlg":[["Junho","Look at this exhibition poster. What do you think about this painting?","이 전시회 포스터를 봐. 이 그림에 대해 어떻게 생각해?"],["Minji","I think it's beautiful.","나는 아름답다고 생각해."],["Alex","It's The Starry Night by Vincent van Gogh, right?","빈센트 반 고흐의 '별이 빛나는 밤'이지, 맞지?"],["Junho","Right. I like this painting. The colors of the night sky are amazing.","맞아. 나는 이 그림이 좋아. 밤하늘의 색깔이 놀라워."],["Alex","I think so, too.","나도 그렇게 생각해."],["Junho","Look! The van Gogh exhibition is going on at Mirae Museum. How about going there together?","봐! 반 고흐 전시회가 미래 미술관에서 열리고 있어. 같이 가는 게 어때?"],["Alex","That's a great idea! I want to see van Gogh's paintings.","좋은 생각이야! 나는 반 고흐의 그림을 보고 싶어."],["Minji","We can also learn about his life and art in the exhibition.","우리는 그 전시회에서 그의 삶과 예술에 대해서도 배울 수 있어."],["Junho","When can we go? It ends on October 1st.","우리 언제 갈 수 있을까? 10월 1일에 끝나."],["Alex","Let's go there this Saturday then.","그럼 이번 토요일에 거기에 가자."],["Minji","That sounds great.","좋아."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 주제로 알맞은 것은?","o":["마티스의 재미있는 별명들","마티스의 유명한 작품들","마티스가 좋아한 색깔","마티스의 독특한 화풍","야수파의 화가들"],"a":3,"ans":"마티스의 독특한 화풍","evs":[["He wanted to express his emotions with bright and wild colors.","그는 밝고 거친 색으로 그의 감정을 표현하기를 원했거든요."],["People didn't like this painting style at first.","사람들은 처음에 이 그림 스타일을 좋아하지 않았어요."],["He kept his own style and finally became famous.","그는 자신만의 스타일을 지켰고 마침내 유명해졌어요."]],"ev":["He wanted to express his emotions with bright and wild colors.","그는 밝고 거친 색으로 그의 감정을 표현하기를 원했거든요."],"ow":["오답 ✕ — 본문에 'he got the nickname Wild Beast'(그는 '야수'라는 별명을 얻었다)가 나오지만 별명은 한 가지뿐이고, 글 전체의 주제도 아니에요.","오답 ✕ — 이 글에 마티스의 유명한 작품을 여러 개 소개하는 부분은 없어요. 얼굴을 초록색으로 칠한 초상화 이야기가 중심이에요.","오답 ✕ — 'bright and wild colors'(밝고 거친 색)가 나오지만 마티스가 좋아한 색깔을 말하는 글은 아니에요. 그 색으로 감정을 표현한 화풍이 핵심이에요.","정답 ○ — 'He wanted to express his emotions with bright and wild colors.'(밝고 거친 색으로 감정을 표현하고 싶어 했다)와 'He kept his own style'(자신만의 스타일을 지켰다)에서 마티스의 독특한 화풍이 주제임을 알 수 있어요.","오답 ✕ — '야수'라는 별명은 나오지만 야수파 화가들 여러 명을 소개하지는 않아요. 마티스 한 명에 관한 글이에요."],"memo":["정답: ④ 마티스의 독특한 화풍","근거: He wanted to express his emotions with bright and wild colors.(밝고 거친 색으로 감정을 표현하고 싶어 했다.)","함정: ①은 별명 이야기가 일부일 뿐이라 너무 좁아서 ✕"],"why":"밝고 거친 색으로 감정을 표현한 마티스의 독특한 화풍이 중심이다."},{"n":7,"q":"윗글의 내용과 일치하는 것은?","o":["Amélie is Matisse's sister.","Matisse painted Amélie's face white.","Matisse used bright and light colors.","People didn't like Matisse's world of art at first.","Matisse gave up his uniqueness in the paintings."],"a":3,"ans":"People didn't like Matisse's world of art at first.","evs":[["People didn't like this painting style at first.","사람들은 처음에 이 그림 스타일을 좋아하지 않았어요."],["He kept his own style and finally became famous.","그는 자신만의 스타일을 지켰고 마침내 유명해졌어요."],["Welcome to my husband's gallery.","제 남편의 미술관에 오신 것을 환영합니다."]],"ev":["People didn't like this painting style at first.","사람들은 처음에 이 그림 스타일을 좋아하지 않았어요."],"ow":["오답 ✕ — Amélie는 'Welcome to my husband's gallery.'(제 남편의 미술관에 오신 것을 환영합니다)라고 했어요. 마티스는 남편이므로 여동생이 아니에요.","오답 ✕ — 'colored my face in green'(제 얼굴을 녹색으로 색칠했어요)이라고 했어요. 흰색이 아니라 녹색이에요.","오답 ✕ — 'bright and wild colors'(밝고 거친 색)라고 했어요. 'light(옅은)'이라는 말은 없고, wild(거친)를 light로 바꾼 틀린 보기예요.","정답 ○ — 'People didn't like this painting style at first.'(사람들은 처음에 k at me.","저를 보세요."],["Do you think that I'm strange?","여러분은 제가 이상하다고 생각하세요?"],["My husband, Henri Matisse, colored my face in green.","제 남편, 앙리 마티스가 제 얼굴을 녹색으로 색칠했어요."],["Don't worry.","걱정하지 마세요."],["My face isn't actually green.","제 얼굴은 실제로 녹색이 아니에요."],["Why did he paint me this way then?","그러면 왜 그는 저를 이런 식으로 칠했을까요?"],["He wanted to express his emotions with bright and wild colors.","그는 밝고 거친 색으로 그의 감정을 표현하기를 원했거든요."],["People didn't like this painting style at first.","사람들은 처음에 이 그림 스타일을 좋아하지 않았어요."],["Some people thought that a beast painted me.","어떤 사람들은 야수가 저를 그렸다고 생각했죠."],["So, he got the nickname Wild Beast.","그래서 그는 ‘야수’라는 별명을 얻었어요."],["He kept his own style and finally became famous.","그는 자신만의 스타일을 지켰고 마침내 유명해졌어요."]]},{"qs":[{"n":9,"q":"윗글의 제목으로 알맞은 것은?","o":["What Can We Learn from Matisse?","Why Is Matisse Famous?","Matisse's Difficult Times","Matisse's Cut-Out Art","Matisse's Old Age"],"a":3,"ans":"Matisse's Cut-Out Art","evs":[["Matisse created me in a unique way.","마티스는 저를 독특한 방식으로 창조했어요."],["He painted paper and cut out shapes with scissors.","그는 종이를 색칠하고 가위로 모양들을 오려 냈어요."],["It's cut-outs.","그것은 종이 오리기(cut-outs)예요."]],"ev":["Matisse created me in a unique way.","마티스는 저를 독특한 방식으로 창조했어요."],"ow":["오답 ✕ — 이 글은 마티스에게서 무엇을 배우는지에 대한 글이 아니에요. 'Matisse created me in a unique way.'(마티스는 저를 독특한 방식으로 창조했어요)처럼 작품 만드는 방식을 설명해요.","오답 ✕ — 마티스가 왜 유명한지를 설명하는 글이 아니에요. 달팽이 작품과 종이 오리기(cut-outs) 이야기가 중심이에요.","오답 ✕ — 'Matisse got very sick'(마티스는 매우 아팠어요)이 나오지만 곧바로 'he never gave up art'(예술을 포기하지 않았다)로 이어져요. 힘든 시기가 중심은 아니에요.","정답 ○ — 'He painted paper and cut out shapes with scissors.'(종이를 색칠하고 가위로 모양들을 오렸다)와 'It's cut-outs.'(그것은 종이 오리기예요)로 보아 제목은 'Matisse's Cut-Out Art'가 알맞아요.","오답 ✕ — '70세'라는 말이 나오지만 노년 생활이 아니라 그때 만든 새로운 예술 형식이 중심이에요."],"memo":["정답: ④ Matisse's Cut-Out Art (마티스의 종이 오리기 작품)","근거: He painted paper and cut out shapes with scissors.(종이를 색칠하고 가위로 모양들을 오렸다.) / It's cut-outs.","함정: ③ Difficult Times는 아팠다는 한 문장뿐이라 너무 좁아서 ✕"],"why":"달팽이 작품과 새로운 예술 형식인 종이 오리기가 글의 중심이다."},{"n":10,"q":"윗글의 내용과 일치하지 않는 것은?","o":["그림에서 동물을 찾기 위해 녹색 모양에서 시작해야 한다.","마티스는 달팽이라는 작품을 기존 방식으로 만들었다.","마티스는 색칠한 모양들을 오리고 그 모양을 합쳐서 달팽이를 만들었다.","70세의 나이에 마티스는 매우 아팠지만, 예술을 포기하지 않았다.","마티스는 새로운 예술 형식인 '종이 오리기'를 시작했다."],"a":1,"ans":"마티스는 달팽이라는 작품을 기존 방식으로 만들었다.","evs":[["Matisse created me in a unique way.","마티스는 저를 독특한 방식으로 창조했어요."],["He painted paper and cut out shapes with scissors.","그는 종이를 색칠하고 가위로 모양들을 오려 냈어요."],["Then he put the shapes together and made me.","그런 다음, 그는 그 모양들을 합쳐서 저를 만들었어요."]],"ev":["Matisse created me in a unique way.","마티스는 저를 독특한 방식으로 창조했어요."],"ow":["오답 ✕ — 'Start from the green shape in the middle.'(가운데에 있는 녹색 모양부터 시작하세요)라고 했으므로 일치해요.","정답 ○ — 'Matisse created me in a unique way.'(마티스는 저를 독특한 방식으로 창조했어요)라고 했어요. 기존 방식이 아니라 독특한 방식이므로 이 보기는 일치하지 않아요.","오답 ✕ — 'He painted paper and cut out shapes with scissors. Then he put the shapes together and made me.'(종이를 색칠하고 모양을 오려서 합쳐 저를 만들었어요)라고 했으므로 일치해요.","오답 ✕ — 'At the age of 70, Matisse got very sick. However, he never gave up art.'(70세에 매우 아팠지만 예술을 포기하지 않았어요)라고 했으므로 일치해요.","오답 ✕ — 'He created a new art form. It's cut-outs.'(그는 새로운 예술 형식을 만들었어요. 그것은 종이 오리기예요)라고 했으므로 일치해요."],"memo":["정답: ② 달팽이를 '기존 방식'으로 만들었다는 말은 ✕","근거: Matisse created me in a unique way.(마티스는 저를 독특한 방식으로 창조했어요.)","함정: unique(독특한)와 '기존의'는 반대 뜻이라서 ✕"],"why":"달팽이는 기존 방식이 아니라 독특한 방식(종이 오리기)으로 만들었다."}],"pp":[["Hi, there.","안녕하세요."],["Can you find me in the picture?","여러분은 그림에서 저를 찾을 수 있나요?"],["Actually, I'm an animal.","사실, 저는 동물이에요."],["Start from the green shape in the middle.","가운데에 있는 녹색 모양부터 시작하세요."],["Then trace the other shapes with your finger.","그런 다음, 여러분의 손가락으로 다른 모양들을 따라가세요."],["They look like a snail shell.","그것들은 달팽이 껍데기처럼 생겼어요."],["Yes, I'm a snail!","네, 저는 달팽이예요!"],["Matisse created me in a unique way.","마티스는 저를 독특한 방식으로 창조했어요."],["He painted paper and cut out shapes with scissors.","그는 종이를 색칠하고 가위로 모양들을 오려 냈어요."],["Then he put the shapes together and made me.","그런 다음, 그는 그 모양들을 합쳐서 저를 만들었어요."],["At the age of setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
