ata Kolok을 설명함. 마을 주민들은 수화를 개발한 사람들이라 수화 자체가 아님.","c":1,"k":"which = Kata Kolok"},"pron":"which","h":"72a89ee13b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Here, signing is not just a language — it is a bridge that unites the villagers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이곳에서 수화는 단순한 언어가 아니라, 마을 사람들을 하나로 이어 주는 다리이다.","opts":["이곳에서 수화는 단순한 언어를 넘어 마을 사람들을 하나로 이어 주는 다리이다.","이곳에서 수화는 언어가 아니라 다리를 만드는 기술이다.","이곳에서 수화는 청각 장애인만 쓰는 언어라서 마을 사람들을 나눈다.","이곳에서 수화는 단순한 언어일 뿐이라서 마을 사람들을 하나로 묶지 못한다."],"r":{"a":"1) 이곳에서 수화는 단순한 언어를 넘어 마을 사람들을 하나로 이어 주는 다리이다.","ev":"13번 문장","s":[[13,"Here, signing is not just a language — it is a bridge that unites the villagers.","이곳에서 수화는 단순한 언어가 아니라, 마을 사람들을 하나로 이어 주는 다리이다."]],"w":"not just A — it is B는 'A일 뿐 아니라 B이다'. a bridge는 진짜 다리가 아니라 사람들을 이어 주는 비유임. 9번에서 청각 장애인과 비장애인이 모두 쓴다고 했으니 사람들을 나누지 않고 이어 줌.","c":1},"h":"d5610d9163"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Kata Kolok은 인도네시아 수화를 그대로 따라 만든 언어이다.","Kata Kolok은 고유의 문법, 구조, 어휘를 갖춘 완전히 독립적인 언어이다.","Bengkala 학교에서는 청각 장애가 있는 아이들만 수화를 배운다.","Kata Kolok은 자바섬에서만 사용된다."],"opts":["Kata Kolok is a language copied directly from Indonesian sign language.","Kata Kolok is a fully independent language with its own grammar, structure, and vocabulary.","Only children who cannot hear learn sign language at school in Bengkala.","Kata Kolok is used only on the island of Java."],"r":{"a":"2) Kata Kolok is a fully independent language with its own grammar, structure, and vocabulary. (Kata Kolok은 고유의 문법, 구조, 어휘를 갖춘 완전히 독립적인 언어이다.)","ev":"8번 문장","s":[[8,"It is a fully independent language with its own grammar, structure, and vocabulary.","그것은 고유의 문법, 구조, 어휘를 갖춘 완전히 독립적인 언어이다."]],"w":"8번 문장에서 Kata Kolok은 고유의 문법, 구조, 어휘를 갖춘 완전히 독립적인 언어라고 함. 인도네시아 수화를 베꼈다는 말, 자바섬에서만 쓴다는 말, 청각 장애 아이들만 배운다는 말은 본문과 맞지 않음(3번, 9번).","c":2},"h":"e7b3a60fd8"},{"n":9,"t":"sum","q":"The story of Bengkala shows the (A) of shared language in building a truly (B) society.","ko":"Bengkala의 이야기는 진정으로 (B) 사회를 만드는 데 있어 공유된 언어의 (A)을(를) 보여 준다.","oko":["(A) 힘 / (B) 포용적인","(A) 힘 / (B) 외로운","(A) 약점 / (B) 포용적인","(A) 약점 / (B) 외로운","(A) 비용 / (B) 포용적인"],"opts":["(A) power / (B) inclusive","(A) power / (B) lonely","(A) weakness / (B) inclusive","(A) weakness / (B) lonely","(A) cost / (B) inclusive"],"r":{"a":"1) (A) power / (B) inclusive ((A) 힘 / (B) 포용적인)","ev":"14번 문장","s":[[14,"The story of Bengkala demonstrates the power of shared language in building a truly inclusive society.","Bengkala의 이야기는 진정으로 포용적인 사회를 만드는 데 있어 언어의 힘을 보여 준다."]],"w":"14번 문장에서 Bengkala의 이야기는 진정으로 포용적인(inclusive) 사회를 만드는 데 공유된 언어의 힘(power)이 얼마나 큰지 보여 준다고 함. 약점, 비용, 외로운은 본문과 반대이거나 없음.","c":1},"h":"322acf29d9"},{"n":10,"t":"fill","q":"When communication is accessible to everyone, [A] thrives, and no one is left [B].","ko":"소통이 모두에게 열려 있을 때, [A]은(는) 깊어지고, 누구도 [B] 놓이지 않는다.","bko":{"connection":"유대감, 연결","behind":"뒤에 (소외된 채)","villagers":"마을 주민들","generations":"세대들","genetic":"유전의","gestures":"몸짓들"},"bank":["connection","behind","villagers","generations","genetic","gestures"],"r":{"a":"[A] connection (유대감, 연결), [B] behind (뒤에 (소외된 채))","ev":"15번 문장","s":[[15,"When communication is accessible to everyone, connection thrives, and no one is left behind.","소통이 모두에게 열려 있을 때, 유대감은 깊어지고, 누구도 소외되지 않는다."]],"w":"15번 문장 When communication is accessible to everyone, connection thrives, and no one is left behind에서 그대로 가져옴. 'left behind'는 뒤에 남겨진다(소외된다)는 뜻. 나머지 단어는 '번창하다'의 주어나 'left ~' 뒤에 올 수 없음.","c":null},"h":"05ee3d1df1"}]},{"u":12,"id":"rg6-12-1","no":1,"ko":"책을 숨겨 나른 낙원의 길","items":[{"n":1,"t":"tf","q":"In the late 1800s, Lithuania was ruled by Russia and the Lithuanian language was banned.","ko":"1800년대 후반, 리투아니아는 러시아의 지배를 받았고 리투아니아어는 금지되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In the late 1800s, Lithuania was ruled by Russia, and the Lithuanian language was banned.","1800년대 후반, 리투아니아는 러시아의 지배를 받았고, 리투아니아어는 금지되었다."]],"w":"3번 문장에 In the late 1800s, Lithuania was ruled by Russia, and the Lithuanian language was banned가 그대로 나옴.","c":"T"},"h":"1a571035b4"},{"n":2,"t":"tf","q":"The Lithuanian books were printed secretly inside Lithuania and carried along the Panemune road.","ko":"리투아니아어 책들은 리투아니아 안에서 몰래 인쇄되어 Panemune 도로를 따라 운반되었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Nearly 40,000 Lithuanian books were published abroad and secretly brought into Lithuania, with the Panemune road being a main route for this work.","약 4만 권의 리투아니아어 책이 해외에서 출판되어 리투아니아로 몰래 반입되었는데, Panemune 도로가 이 일의 주요 경로였다."]],"w":"6번 문장에서 약 4만 권의 책이 abroad(해외)에서 출판되어 리투아니아로 몰래 반입되었다고 함. 리투아니아 안에서 인쇄했다는 말은 틀림.","c":"F"},"h":"f2f8bc84ef"},{"n":3,"t":"tf","q":"In 1904, the ban on the Lithuanian language was removed.","ko":"1904년에 리투아니아어에 대한 금지령이 해제되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"In 1904, the ban on the Lithuanian language was removed and the language was brought back to life.","1904년, 리투아니아어에 대한 금지령이 해제되었고 그 언어는 되살아났다."]],"w":"12번 문장에 In 1904, the ban on the Lithuanian language was removed(1904년, 금지령이 해제되었다)가 나옴.","c":"T"},"h":"f3f86be7b4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...winds through over 100 kilometers of breathtaking scenery.)","ko":"... 100킬로미터가 넘는 ( ) 풍경을 따라 구불구불 이어져 있다.","opts":["지루한","숨이 멎을 정도로 멋진","위험한","평범한"],"word":"breathtaking","r":{"a":"2) 숨이 멎을 정도로 멋진","ev":"1~2번 문장","s":[[1,"The Panemune road, often called Lithuania’s “paradise road,” winds through over 100 kilometers of breathtaking scenery.","리투아니아의 '낙원의 길'로 종종 불리는 Panemune 도로는 숨 막히게 아름다운 풍경을 따라 100킬로미터가 넘게 구불구불 이어져 있다."],[2,"But this road is more than just beautiful — it played a major role in protecting the Lithuanian language.","하지만 이 도로는 단순히 아름답기만 한 것이 아니라, 리투아니아어를 지키는 데 중요한 역할을 했다."]],"w":"1번의 도로는 '낙원의 길'이라 불리고, 2번에서 '단순히 아름답기만 한 길이 아니다(more than just beautiful)'라고 함. 그러니 풍경이 아주 멋지다는 뜻이므로 breathtaking = 숨이 멎을 정도로 멋진.","c":2},"h":"2e78c7fd6b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Yet, many brave people resisted by smuggling books.)","ko":"그러나 많은 용감한 사람들이 책을 밀반입함으로써 ( ).","opts":["동의했다","도망쳤다","포기했다","저항했다"],"word":"resisted","r":{"a":"4) 저항했다","ev":"4~5번 문장","s":[[4,"Printing, selling, or even owning Lithuanian texts became illegal.","리투아니아어로 된 글을 인쇄하거나, 판매하거나, 심지어 소지하는 것조차 불법이 되었다."],[5,"Yet, many brave people resisted by smuggling books.","그러나 많은 용감한 사람들이 책을 밀반입함으로써 저항했다."]],"w":"4번에서 리투아니아어 책이 불법이 되었고, 5번은 Yet(그러나)으로 반전함. 금지에 맞서 책을 몰래 들여왔으므로 resist = 저항하다. 동의하거나 포기했다면 Yet으로 이어지지 않음.","c":4},"h":"f95b512827"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut this road is more than just beautiful — it played a major role in protecting the Lithuanian language.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만 이 도로는 단순히 아름답기만 한 것이 아니라, 리투아니아어를 지키는 데 중요한 역할을 했다.","opts":["Panemune 도로","리투아니아어","러시아","책 밀수꾼"],"r":{"a":"1) Panemune 도로","ev":"2번 문장","s":[[2,"But this road is more than just beautiful — it played a major role in protecting the Lithuanian language.","하지만 이 도로는 단순히 아름답기만 한 것이 아니라, 리투아니아어를 지키는 데 중요한 역할을 했다."]],"w":"2번 문장에서 this road is more than just beautiful 뒤에 it played a major role이 이어지므로 it은 앞의 this road(Panemune 도로)를 가리킴. 리투아니아어는 도로가 지킨 대상이지 역할을 한 주체가 아님.","c":1,"k":"it = Panemune 도로"},"pron":"it","h":"194f7bd743"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Despite the risks, people from all backgrounds — farmers, priests, doctors, and many more — came together to form a large and effective network.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"위험에도 불구하고, 농부, 성직자, 의사 등 다양한 배경의 사람들이 함께 모여 크고 효과적인 조직망을 형성했다.","opts":["위험이 너무 커서 다양한 사람들이 참여를 포기했다.","농부들만 모여 작은 조직을 만들었다.","위험에도 불구하고 농부, 성직자, 의사 등 다양한 사람들이 힘을 합쳐 크고 효과적인 조직망을 만들었다.","의사와 성직자가 러시아 당국을 도와 조직망을 없앴다."],"r":{"a":"3) 위험에도 불구하고 농부, 성직자, 의사 등 다양한 사람들이 힘을 합쳐 크고 효과적인 조직망을 만들었다.","ev":"9~10번 문장","s":[[9,"If discovered, they could be shot or sent to prison, where they were tortured or executed.","발각되면, 그들은 총에 맞거나 감옥에 보내질 수 있었는데, 그곳에서 고문당하거나 처형당하기도 했다."],[10,"Despite the risks, people from all backgrounds — farmers, priests, doctors, and many more — came together to form a large and effective network.","위험에도 불구하고, 농부, 성직자, 의사 등 다양한 배경의 사람들이 함께 모여 크고 효과적인 조직망을 형성했다."]],"w":"Despite the risks는 '위험에도 불구하고', all backgrounds는 다양한 배경. 9번에서 잡히면 큰 벌을 받는데도 여러 사람이 모여 큰 조직을 만들었다는 내용임.","c":3},"h":"f1178f574e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["리투아니아어 책을 인쇄하는 것은 러시아 지배 아래에서 합법이었다.","밀수꾼들은 책을 건초, 가구, 관 속에 숨겼다.","책 밀수는 단 1년 만에 끝났다.","리투아니아는 매년 3월 6일에 책 밀수꾼의 날을 기념한다."],"opts":["Printing Lithuanian books was legal under Russian rule.","Smugglers hid books in hay, furniture, and coffins.","The book smuggling ended after only one year.","Lithuania celebrates the Day of the Book Smugglers on March 6 every year."],"r":{"a":"2) Smugglers hid books in hay, furniture, and coffins.","ev":"4, 8, 11, 13번 문장","s":[[4,"Printing, selling, or even owning Lithuanian texts became illegal.","리투아니아어로 된 글을 인쇄하거나, 판매하거나, 심지어 소지하는 것조차 불법이 되었다."],[8,"Smugglers hid books in hay, furniture, and coffins, and took a life-threatening journey on the road.","밀수꾼들은 책을 건초, 가구, 관 속에 숨기고, 그 도로로 목숨을 건 여정을 떠났다."],[11,"Their efforts continued for 39 years until their network became so strong that the Russian authorities could no longer stop them.","그들의 노력은 조직망이 너무 강력해져서 러시아 당국도 더 이상 그들을 막을 수 없을 때까지 39년 동안 이어졌다."],[13,"Today, every year on March 16, Lithuania celebrates the Day of the Book Smugglers to honor those who risked everything to preserve the Lithuanian language and identity.","오늘날 매년 3월 16일에, 리투아니아는 리투아니아어와 정체성을 지키기 위해 모든 것을 걸었던 사람들을 기리기 위해 책 밀수꾼의 날을 기념한다."]],"w":"8번 문장에서 밀수꾼들이 책을 건초, 가구, 관에 숨겼다고 함. 4번에서 인쇄는 불법이었고, 11번에서 39년간 이어졌으며, 13번에서 기념일은 3월 16일임.","c":2},"h":"a3ddb7d574"},{"n":9,"t":"sum","q":"If discovered, smugglers could be (A) or sent to (B).","ko":"발각되면, 밀수꾼들은 (A) 수 있었고 (B)에 보내질 수 있었다.","oko":["(A) 총에 맞을 / (B) 감옥","(A) 총에 맞을 / (B) 학교","(A) 상을 받을 / (B) 감옥","(A) 상을 받을 / (B) 학교","(A) 총에 맞을 / (B) 병원"],"opts":["(A) shot / (B) prison","(A) shot / (B) school","(A) rewarded / (B) prison","(A) rewarded / (B) school","(A) shot / (B) hospital"],"r":{"a":"1) (A) shot / (B) prison ((A) 총에 맞을 / (B) 감옥)","ev":"9번 문장","s":[[9,"If discovered, they could be shot or sent to prison, where they were tortured or executed.","발각되면, 그들은 총에 맞거나 감옥에 보내질 수 있었는데, 그곳에서 고문당하거나 처형당하기도 했다."]],"w":"9번 문장에서 발각되면 밀수꾼들은 총에 맞거나(shot) 감옥(prison)에 보내질 수 있었다고 함. 상을 받는다, 학교, 병원은 본문과 맞지 않음.","c":1},"h":"f7e13297e0"},{"n":10,"t":"fill","q":"Lithuania celebrates the Day of the Book Smugglers every year to [A] those who risked everything, and the Panemune road stands as a silent [B] to their spirit.","ko":"리투아니아는 모든 것을 걸었던 사람들을 [A]하기 위해 매년 책 밀수꾼의 날을 기념하며, Panemune 도로는 그들의 정신에 대한 소리 없는 [B](으)로 남아 있다.","bko":{"honor":"기리다","witness":"증인","dangerous":"위험한","effective":"효과적인","illegal":"불법의","extremely":"극도로"},"bank":["honor","witness","dangerous","effective","illegal","extremely"],"r":{"a":"[A] honor (기리다), [B] witness (증인)","ev":"13~14번 문장","s":[[13,"Today, every year on March 16, Lithuania celebrates the Day of the Book Smugglers to honor those who risked everything to preserve the Lithuanian language and identity.","오늘날 매년 3월 16일에, 리투아니아는 리투아니아어와 정체성을 지키기 위해 모든 것을 걸었던 사람들을 기리기 위해 책 밀수꾼의 날을 기념한다."],[14,"The Panemune road, once walked by these heroes, stands as a silent witness to their unbreakable spirit.","이 영웅들이 한때 걸었던 Panemune 도로는 그들의 꺾이지 않는 정신의 소리 없는 증인으로 남아 있다."]],"w":"13번 to honor those who risked everything(모든 것을 건 사람들을 기리기 위해), 14번 stands as a silent witness(소리 없는 증인으로 남아 있다)에서 가져옴. dangerous·effective·illegal·extremely는 이 두 빈칸 자리(동사 원형, 명사)에 문법적으로 들어갈 수 없음.","c":null},"h":"21be8d71dd"}]},{"u":12,"id":"rg6-12-2","no":2,"ko":"고등학생이 만든 50개 별 국기","items":[{"n":1,"t":"tf","q":"Robert spent over 12 hours creating a 50-star flag.","ko":"Robert는 12시간이 넘게 걸려 50개의 별이 있는 국기를 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Robert spent over 12 hours creating a 50-star flag.","Robert는 12시간이 넘게 걸려 50개의 별이 있는 국기를 만들었다."]],"w":"4번 문장에 Robert spent over 12 hours creating a 50-star flag(12시간이 넘게 걸려 50개 별 국기를 만들었다)가 그대로 나옴.","c":"T"},"h":"ac8ccb2725"},{"n":2,"t":"tf","q":"Robert's teacher was pleased with his flag and gave him an A grade.","ko":"Robert의 선생님은 그의 국기에 만족해서 A 점수를 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"6~8번 문장","s":[[6,"But when Heft presented his flag at school, his teacher was dissatisfied.","그러나 Heft가 학교에서 그의 국기를 제출했을 때, 선생님은 불만족스러워했다."],[7,"The teacher said, “You don’t even know how many states we have!”","선생님은 \"너는 우리가 몇 개 주를 가지고 있는지도 모르는구나!\"라고 말했다."],[8,"The teacher then gave him a B- grade.","그리고 선생님은 그에게 B- 점수를 주었다."]],"w":"6번에서 선생님은 dissatisfied(불만족스러워했다)고 하고, 8번에서 B- 점수를 주었다고 함. 만족해서 A를 줬다는 말은 반대임.","c":"F"},"h":"1974386930"},{"n":3,"t":"tf","q":"Robert's 50-star flag was raised for the first time at the U.S. Capitol on July 4, 1960.","ko":"Robert의 50개 별 국기는 1960년 7월 4일 미국 국회의사당에서 처음으로 게양되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"On July 4, 1960, Robert was invited to see the flag-raising ceremony at the U.S. Capitol, where his 50-star flag was raised for the first time.","1960년 7월 4일, Robert는 미국 국회의사당에서 열린 국기 게양식을 보러 초대되었고, 그곳에서 그의 50개 별 국기가 처음으로 게양되었다."]],"w":"11번 문장에 On July 4, 1960, ... at the U.S. Capitol, where his 50-star flag was raised for the first time이 나옴.","c":"T"},"h":"3261571883"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But when Heft presented his flag at school, his teacher was dissatisfied.)","ko":"그러나 Heft가 학교에서 그의 국기를 제출했을 때, 선생님은 ( ) 했다.","opts":["기뻐","감동","불만족스러워","졸려"],"word":"dissatisfied","r":{"a":"3) 불만족스러워","ev":"6~7번 문장","s":[[6,"But when Heft presented his flag at school, his teacher was dissatisfied.","그러나 Heft가 학교에서 그의 국기를 제출했을 때, 선생님은 불만족스러워했다."],[7,"The teacher said, “You don’t even know how many states we have!”","선생님은 \"너는 우리가 몇 개 주를 가지고 있는지도 모르는구나!\"라고 말했다."]],"w":"6번은 But으로 시작해 기대와 다른 결과를 말하고, 7번에서 선생님이 \"주가 몇 개인지도 모르는구나!\"라고 말함. 칭찬이 아니라 못마땅해 하는 말이므로 dissatisfied = 불만족스러워하는.","c":3},"h":"f70fb070c9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Robert was determined to prove the value of his design...)","ko":"Robert는 자신의 디자인의 가치를 증명하기로 ( ) 백악관에 편지를 썼다.","opts":["지쳐서","결심해서","부끄러워서","걱정해서"],"word":"determined","r":{"a":"2) 결심해서","ev":"9번 문장","s":[[9,"Robert was determined to prove the value of his design, so he wrote letters to the White House and asked them to consider his flag.","Robert는 자신의 디자인의 가치를 증명하기로 결심해서, 백악관에 편지를 써서 그들에게 자신의 국기를 고려해 달라고 요청했다."]],"w":"9번은 선생님에게 낮은 점수를 받고도 포기하지 않고 디자인의 가치를 증명하려고 백악관에 편지를 쓴 내용. 행동으로 이어졌으니 determined = 결심이 확고한.","c":2},"h":"c2201b6140"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nRobert’s flag remains the longest-used flag design in U.S. history. He even prepared a 51-star version.","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 심지어 51개의 별이 있는 버전도 준비해 두었다.","opts":["Robert","백악관의 대통령","Robert의 선생님","알래스카의 주지사"],"r":{"a":"1) Robert","ev":"13번 문장","s":[[13,"He even prepared a 51-star version.","그는 심지어 51개의 별이 있는 버전도 준비해 두었다."]],"w":"13번 문장의 He는 바로 앞 12번 문장에서 국기를 만든 Robert를 가리킴. 대통령, 선생님, 주지사는 51개 별 버전을 준비한 사람이 아님.","c":1,"k":"He = Robert"},"pron":"He","h":"d5f0b59e89"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If another state should join the Union, his new design would be ready.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"혹시라도 또 다른 주가 연방에 가입한다면, 그의 새 디자인은 준비되어 있을 것이다.","opts":["만약 또 다른 주가 연방에 가입하면, 그의 새 디자인이 이미 준비되어 있을 것이다.","또 다른 주가 연방을 떠나면, 그는 새 디자인을 만들어야 한다.","그는 이미 다른 주를 위해 국기를 팔고 있다.","또 다른 주가 가입하면, 그의 디자인은 쓸 수 없게 된다."],"r":{"a":"1) 만약 또 다른 주가 연방에 가입하면, 그의 새 디자인이 이미 준비되어 있을 것이다.","ev":"14번 문장","s":[[14,"If another state should join the Union, his new design would be ready.","혹시라도 또 다른 주가 연방에 가입한다면, 그의 새 디자인은 준비되어 있을 것이다."]],"w":"14번 문장은 “혹시 또 다른 주가 연방에 가입하더라도 그의 새 디자인이 준비되어 있을 것”이라는 뜻. 연방을 떠난다, 국기를 판다, 쓸 수 없게 된다는 말은 본문과 맞지 않음.","c":1},"h":"788da389a3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Robert의 국기는 알래스카와 하와이가 공식적으로 주가 된 뒤에 채택되었다.","Robert의 국기는 백악관에 의해 거절되었다.","알래스카와 하와이는 미국에 가입하기를 거부했다.","Robert의 국기는 몇 년만 사용되고 바뀌었다."],"opts":["Robert's flag was chosen after Alaska and Hawaii officially became states.","Robert's flag was rejected by the White House.","Alaska and Hawaii refused to join the United States.","Robert's flag was used for only a few years before being changed."],"r":{"a":"1) Robert's flag was chosen after Alaska and Hawaii officially became states. (Robert의 국기는 알래스카와 하와이가 공식적으로 주가 된 뒤에 채택되었다.)","ev":"10번 문장","s":[[10,"Two years later, after Alaska and Hawaii officially became American states, the president of the United States called Robert with thrilling news: his flag design had been chosen.","2년 후, 알래스카와 하와이가 공식적으로 미국의 주가 된 뒤에, 미국 대통령은 한 놀라운 소식을 가지고 Robert에게 전화를 걸었는데, 바로 그의 국기 디자인이 채택되었다는 것이었다."]],"w":"10번 문장에서 알래스카와 하와이가 공식적으로 주가 된 뒤 대통령이 Robert의 국기 디자인이 채택되었다고 전화함. 거절, 가입 거부, 몇 년만 사용(12번: 가장 오래 사용됨)은 본문과 반대임.","c":1},"h":"723331ffed"},{"n":9,"t":"sum","q":"The current American flag has a fascinating (A) — it all started with a high school (B).","ko":"현재의 미국 국기는 흥미로운 (A)을(를) 가지고 있는데, 모든 것이 고등학교의 한 (B)에서 시작되었다.","oko":["(A) 기원 / (B) 과제","(A) 기원 / (B) 파티","(A) 가격 / (B) 과제","(A) 가격 / (B) 파티","(A) 기원 / (B) 여행"],"opts":["(A) origin / (B) project","(A) origin / (B) party","(A) price / (B) project","(A) price / (B) party","(A) origin / (B) trip"],"r":{"a":"1) (A) origin / (B) project ((A) 기원 / (B) 과제)","ev":"1번 문장","s":[[1,"The current American flag has a fascinating origin — it all started with a high school project.","현재의 미국 국기는 흥미로운 기원을 가지고 있는데, 모든 것이 고등학교의 한 과제에서 시작되었다."]],"w":"1번 문장에서 현재 미국 국기는 흥미로운 기원(origin)을 가지고 있고 모든 것이 고등학교의 한 과제(project)에서 시작되었다고 함. 가격, 파티, 여행은 본문에 없음.","c":1},"h":"948ae19f6d"},{"n":10,"t":"fill","q":"Robert cut out stars, [A] them into neat rows, and [B] them onto the 48-star flag.","ko":"Robert는 별들을 오리고, 그것들을 가지런한 줄로 [A]. 그리고 그것들을 기존의 48개 별 국기에 [B].","bko":{"arranged":"배열했다","stitched":"꿰맸다","teacher":"선생님","grade":"점수","ceremony":"기념식","letters":"편지들"},"bank":["arranged","stitched","teacher","grade","ceremony","letters"],"r":{"a":"[A] arranged (배열했다), [B] stitched (꿰맸다)","ev":"5번 문장","s":[[5,"He carefully cut out stars, arranged them into neat rows, and stitched them onto the 48-star flag.","그는 별들을 조심스럽게 오리고, 그것들을 가지런한 줄로 배열해서, 기존의 48개 별 국기에 꿰맸다."]],"w":"5번 문장에서 Robert는 별을 오려서 가지런한 줄로 배열하고(arranged) 기존 48개 별 국기에 꿰맸다(stitched)고 함. 나머지는 명사라서 them 앞 동사 자리에 맞지 않음.","c":null},"h":"faf16d6668"}]},{"u":12,"id":"rg6-12-3","no":3,"ko":"깨진 광고판이 대박 상품이 된 이유","items":[{"n":1,"t":"tf","q":"The broken pixels left a black box above the logo on the Coors Light can.","ko":"깨진 픽셀들은 Coors Light 캔의 로고 위에 검은 사각형을 남겼다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The broken pixels left a black box above the logo on the Coors Light’s silver can.","깨진 픽셀들은 Coors Light 은색 캔의 로고 위에 검은 사각형을 남겼다."]],"w":"2번 문장에 The broken pixels left a black box above the logo(깨진 픽셀들이 로고 위에 검은 사각형을 남겼다)가 그대로 나옴.","c":"T"},"h":"0f9aff355b"},{"n":2,"t":"tf","q":"The limited-edition cans did not sell well and stayed in stores for weeks.","ko":"한정판 캔은 잘 팔리지 않아 몇 주 동안 가게에 남아 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Fans loved the playful design, and the cans sold out in less than a day.","팬들은 그 장난기 넘치는 디자인을 좋아했고, 캔은 하루도 안 되어 매진되었다."]],"w":"8번 문장에서 팬들이 디자인을 좋아했고 캔이 하루도 안 되어(in less than a day) 매진되었다고 함. 잘 팔리지 않았다는 말은 반대임.","c":"F"},"h":"1453fb9224"},{"n":3,"t":"tf","q":"The broken advertisement panel was sold at an auction for over 7,000 dollars.","ko":"부서진 광고판은 경매에서 7,000달러가 넘는 가격에 팔렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Even the broken panel itself became a popular souvenir and was auctioned for over 7,000 dollars!","심지어 부서진 광고판 자체도 인기 있는 기념품이 되어 경매에서 7,000달러가 넘는 가격에 팔렸다!"]],"w":"10번 문장에 the broken panel itself became a popular souvenir and was auctioned for over 7,000 dollars가 나옴. 광고판이 인기 있는 기념품이 되어 경매에서 팔림.","c":"T"},"h":"7c67893706"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But Coors Light took a daring approach.)","ko":"그러나 Coors Light는 ( ) 접근 방식을 택했다.","opts":["소심한","과감한 (대담한)","느린","평범한"],"word":"daring","r":{"a":"2) 과감한 (대담한)","ev":"3~5번 문장","s":[[3,"The flaw could have been a marketing disaster.","그 결함은 마케팅 재앙이 될 수도 있었다."],[4,"But Coors Light took a daring approach.","그러나 Coors Light는 과감한 접근 방식을 택했다."],[5,"They chose not to hide the flaw, but to spotlight it.","그들은 결함을 숨기지 않고, 오히려 그것에 이목을 집중시키는 것을 선택했다."]],"w":"3번에서 결함이 재앙이 될 수도 있었다고 했는데, 4번 But으로 반전하고 5번에서 결함을 숨기지 않고 오히려 드러내는 선택을 함. 흔치 않은 대담한 선택이므로 daring = 과감한.","c":2},"h":"9fe88c10ba"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...they simply used their situation swiftly and naturally to their advantage.)","ko":"... 그들은 자신들의 상황을 ( ) 그리고 자연스럽게 유리하게 활용했다.","opts":["느리게","조용히","정직하게","빠르게"],"word":"swiftly","r":{"a":"4) 빠르게","ev":"6, 13번 문장","s":[[6,"Within 48 hours, they released a limited-edition can featuring the black square above the brand’s logo.","48시간 이내에, 그들은 브랜드 로고 위에 검은 사각형이 그려진 한정판 캔을 출시했다."],[13,"And rather than relying on expensive or complex strategies, they simply used their situation swiftly and naturally to their advantage.","그리고 비싸거나 복잡한 전략에 의존하는 대신, 그들은 자신들의 상황을 빠르고 자연스럽게 유리하게 활용했다."]],"w":"6번에서 Within 48 hours(48시간 이내에) 한정판 캔을 출시했다고 함. 13번의 swiftly는 그렇게 재빠르게 상황을 활용했다는 뜻이므로 '빠르게'가 맞음.","c":4},"h":"0ef9ef5bc0"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nWithin 48 hours, they released a limited-edition can featuring the black square above the brand’s logo. This quickly went viral on social media.","ko":"밑줄 친 This이 가리키는 것은?","sko":"이것은 소셜 미디어에서 금세 화제가 되었다.","opts":["브랜드 로고 위에 검은 사각형이 그려진 한정판 캔을 출시한 것","오타니의 파울볼이 광고판을 부순 것","광고판이 경매에서 팔린 것","Coors Light가 새로운 맥주를 개발한 것"],"r":{"a":"1) 브랜드 로고 위에 검은 사각형이 그려진 한정판 캔을 출시한 것","ev":"6~7번 문장","s":[[6,"Within 48 hours, they released a limited-edition can featuring the black square above the brand’s logo.","48시간 이내에, 그들은 브랜드 로고 위에 검은 사각형이 그려진 한정판 캔을 출시했다."],[7,"This quickly went viral on social media.","이것은 소셜 미디어에서 빠르게 화제가 되었다."]],"w":"7번의 This는 바로 앞 6번 문장의 내용, 즉 48시간 이내에 검은 사각형이 있는 한정판 캔을 출시한 것임. 오타니의 파울볼(1번)이나 경매(10번)는 This의 내용이 아니고, 새 맥주 개발은 본문에 없음.","c":1,"k":"This = 브랜드 로고 위에 검은 사각형이 그려진 한정판 캔을 출시한 것"},"pron":"This","h":"f778ecfd13"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Creating a marketing masterpiece isn't always about a massive budget — sometimes, it is just a broken ad and a sense of humor that leave a lasting impression.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마케팅 걸작을 만드는 일은 항상 엄청난 예산에 달려 있는 것은 아니다. 때로는 그저 망가진 광고와 오래 남는 인상을 주는 유머 감각이면 충분하다.","opts":["마케팅 걸작을 만들려면 항상 큰 예산과 완벽한 광고가 필요하다.","망가진 광고는 유머를 써도 오래 남는 인상을 줄 수 없다.","마케팅 걸작은 항상 엄청난 예산이 필요한 것은 아니며, 때로는 망가진 광고와 유머 감각만으로도 오래 남는 인상을 줄 수 있다.","마케팅은 예산이 적을수록 언제나 성공한다."],"r":{"a":"3) 마케팅 걸작은 항상 엄청난 예산이 필요한 것은 아니며, 때로는 망가진 광고와 유머 감각만으로도 오래 남는 인상을 줄 수 있다.","ev":"15번 문장","s":[[15,"Creating a marketing masterpiece isn’t always about a massive budget — sometimes, it is just a broken ad and a sense of humor that leave a lasting impression.","마케팅 걸작을 만드는 일은 항상 엄청난 예산에 달려 있는 것은 아니다. 때로는 그저 망가진 광고와 오래 남는 인상을 주는 유머 감각이면 충분하다."]],"w":"isn't always는 '항상 ~인 것은 아니다'(부분 부정), sometimes는 '때로는'. 예산이 크지 않아도 망가진 광고와 유머로 성공할 수 있다는 뜻. 예산이 적을수록 항상 성공한다는 말은 아님.","c":3},"h":"f3953ea02c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Coors Light는 한정판 캔을 일주일 뒤에 출시했다.","Coors Light는 결함을 숨기는 대신 오히려 그것에 이목을 집중시키기로 했다.","Coors Light는 오타니 쇼헤이를 탓하며 비용을 물어내라고 했다.","Coors Light는 새 광고로 검은 사각형을 숨기려 했다."],"opts":["Coors Light released the limited-edition can a week later.","Coors Light chose to spotlight the flaw instead of hiding it.","Coors Light blamed Shohei Ohtani and asked him to pay.","Coors Light tried to hide the black square with a new advertisement."],"r":{"a":"2) Coors Light chose to spotlight the flaw instead of hiding it. (Coors Light는 결함을 숨기는 대신 오히려 그것에 이목을 집중시키기로 했다.)","ev":"5번 문장","s":[[5,"They chose not to hide the flaw, but to spotlight it.","그들은 결함을 숨기지 않고, 오히려 그것에 이목을 집중시키는 것을 선택했다."]],"w":"5번 문장에서 Coors Light는 결함을 숨기지 않고 오히려 그것에 이목을 집중시키는(spotlight) 것을 선택했다고 함. 일주일 뒤 출시(6번: 48시간 이내), 오타니 탓하기, 숨기려 했다는 말은 본문과 맞지 않음.","c":2},"h":"28dff66f91"},{"n":9,"t":"sum","q":"Coors Light (A) its embarrassing situation with humor, which connected strongly with fans, and the campaign (B) the brand's image.","ko":"Coors Light는 자신들의 난처한 상황을 유머로 (A)했고, 이것이 팬들과 강하게 마음이 통했으며, 그 캠페인은 브랜드의 이미지를 (B).","oko":["(A) 숨겼고 / (B) 높였다","(A) 받아들였고 / (B) 떨어뜨렸다","(A) 무시했고 / (B) 높였다","(A) 숨겼고 / (B) 떨어뜨렸다","(A) 받아들였고 / (B) 높였다"],"opts":["(A) hid / (B) raised","(A) embraced / (B) lowered","(A) ignored / (B) raised","(A) hid / (B) lowered","(A) embraced / (B) raised"],"r":{"a":"5) (A) embraced / (B) raised","ev":"12, 14번 문장","s":[[12,"Coors Light embraced their embarrassment in a self-aware and humorous way, which connected strongly with fans.","Coors Light는 자신들의 난처함을 자기 인식적이고 유머러스한 방식으로 받아들였고, 이것이 팬들과 강하게 마음이 통했다."],[14,"This clever campaign not only saved the moment but elevated Coors Light’s image.","이 영리한 캠페인은 그 순간을 구했을 뿐만 아니라 Coors Light의 이미지를 높였다."]],"w":"12번에서 Coors Light는 자신들의 난처함을 유머러스하게 embraced(받아들였다)하고, 14번에서 캠페인이 이미지를 elevated(높였다 = raise)고 함. hid·ignored(숨겼다·무시했다)나 lowered(떨어뜨렸다)는 본문과 반대임.","c":5},"h":"c1a2a5a9e1"},{"n":10,"t":"fill","q":"In 2023, during a baseball game in New York, superstar Shohei Ohtani hit a foul ball that [A] an advertisement panel for Coors Light, a popular [B] brand in the U.S.","ko":"2023년 뉴욕에서 열린 야구 경기 도중, 슈퍼스타 오타니 쇼헤이는 미국의 인기 [B] 브랜드인 Coors Light의 광고판을 [A] 파울볼을 쳤다.","bko":{"smashed":"부숴 버린","beer":"맥주","release":"출시하다","transform":"바꾸다","rely":"의존하다","hide":"숨기다"},"bank":["smashed","beer","release","transform","rely","hide"],"r":{"a":"[A] smashed (부숴 버린), [B] beer (맥주)","ev":"1번 문장","s":[[1,"In 2023, during a baseball game in New York, superstar Shohei Ohtani hit a foul ball that smashed an advertisement panel for Coors Light, a popular beer brand in the U.S.","2023년 뉴욕에서 열린 야구 경기 도중, 슈퍼스타 오
