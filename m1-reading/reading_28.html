, 밀가루, 소금",1],["1. Boil the macaroni.","1. 마카로니를 삶는다.",1],["2. Melt the butter in a pan.","2. 버터를 팬에서 녹인다.",1],["Add the flour and salt.","밀가루와 소금을 추가한다.",0],["3. Add the milk and stir slowly.","3. 우유를 추가하고 천천히 젓는다.",1],["4. Turn off the heat.","4. 불을 끈다.",1],["Add the cheese and stir again.","치즈를 추가하고 다시 젓는다.",0],["The sauce is ready.","소스가 준비되었다.",0],["5. Mix the sauce with the macaroni.","5. 소스를 마카로니와 섞는다.",1],["6. Bake it for about 15 minutes.","6. 그것을 약 15분간 굽는다.",1],["Ta-da!","짜잔!",1],["The mac and cheese is ready now.","맥앤치즈가 이제 준비됐어.",0],["It looks delicious!","맛있어 보여!",0],["It smells good, too!","좋은 냄새도 나!",0],["Oh, here is a secret tip from my grandma.","오, 여기에 우리 할머니의 비법이 하나 있어.",0],["\"Add love and share the food with your family and friends.\"","\"사랑을 더하고, 너의 가족과 친구들과 그 음식을 나눠 먹으렴.\"",0]];var RNUM=28;var TITLE_EN="Grandma's Secret Recipe";var PASS_EN=["Grandma's Secret Recipe","Hi, I am Sam. I live with my grandma, and she is a great cook. She makes delicious food just like magic. We often cook together. Thanks to her, I can make some simple dishes.","Mac and cheese is one of them, and I can make it very well. Mac means macaroni, a type of pasta. Many Americans love this food. The recipe is simple, so you can make it, too! Here is the recipe.","You need: macaroni, cheese, milk, butter, flour, salt","1. Boil the macaroni.","2. Melt the butter in a pan. Add the flour and salt.","3. Add the milk and stir slowly.","4. Turn off the heat. Add the cheese and stir again. The sauce is ready.","5. Mix the sauce with the macaroni.","6. Bake it for about 15 minutes.","Ta-da! The mac and cheese is ready now. It looks delicious! It smells good, too! Oh, here is a secret tip from my grandma. \"Add love and share the food with your family and friends.\""];var PASS_KO=["할머니의 비밀 요리법","안녕, 나는 Sam이야. 나는 할머니와 살고 있고, 할머니는 훌륭한 요리사야. 할머니는 마치 마법처럼 맛있는 음식을 만드셔. 우리는 종종 함께 요리를 해. 할머니 덕분에 나는 몇 개의 간단한 요리를 만들 수 있어.","맥앤치즈는 그 요리들 중 하나이고, 나는 그것을 아주 잘 만들 수 있어. mac은 파스타의 일종인 마카로니를 의미해. 많은 미국인들이 이 음식을 아주 좋아해. 그 요리법은 간단해서 너희들도 만들 수 있어! 여기에 그 요리법이 있어.","필요한 것: 마카로니, 치즈, 우유, 버터, 밀가루, 소금","1. 마카로니를 삶는다.","2. 버터를 팬에서 녹인다. 밀가루와 소금을 추가한다.","3. 우유를 추가하고 천천히 젓는다.","4. 불을 끈다. 치즈를 추가하고 다시 젓는다. 소스가 준비되었다.","5. 소스를 마카로니와 섞는다.","6. 그것을 약 15분간 굽는다.","짜잔! 맥앤치즈가 이제 준비됐어. 맛있어 보여! 좋은 냄새도 나! 오, 여기에 우리 할머니의 비법이 하나 있어. \"사랑을 더하고, 너의 가족과 친구들과 그 음식을 나눠 먹으렴.\""];var DG=[{"qs":[{"n":1,"q":"What will Jiho do after this conversation?","o":["He will bring more food for Ratu.","He will try the es-buah dessert.","He will eat more nasi-goreng.","He will say no to the dessert.","He will order Korean fried rice."],"a":1,"ans":"He will try the es-buah dessert.","evs":[["I also made a dessert. Would you like some?","후식도 만들었어. 좀 먹을래?"],["Sure! Is it also Indonesian?","좋아! 그것도 인도네시아 음식이니?"]],"ev":["I also made a dessert. Would you like some?","후식도 만들었어. 좀 먹을래?"],"ow":["오답 ✕ — 지호가 Ratu를 위해 음식을 가져온다는 말은 없다. 오히려 'Thank you for dinner, Ratu.'(저녁 식사 고마워, Ratu.)라며 대접받는 쪽이라서 틀림.","정답 ○ — Ratu가 'I also made a dessert. Would you like some?'(후식도 만들었어. 좀 먹을래?)라고 묻자 지호는 'Sure!'(좋아!)라고 답했다. 그러므로 대화 후에 es-buah 후식을 먹어 볼 것이다.","오답 ✕ — 지호는 이미 'Can I have some more?'(좀 더 먹어도 될까?)라고 해서 'Here you go.'(여기 있어.)라며 받았다. 대화 뒤에 할 일은 후식을 먹는 것이라서 틀림.","오답 ✕ — 후식을 권유받고 'Sure!'(좋아!)라고 했으므로 거절하지 않는다. 거절하는 'No, thanks.'와 반대라서 틀림.","오답 ✕ — 지호가 한국식 볶음밥을 주문한다는 말은 없다. 'It's nasi-goreng. It's Indonesian fried rice.'(나시고렝이야. 인도네시아식 볶음밥이야.)라고 했으므로 틀림."],"memo":["정답: ② 지호는 es-buah 후식을 먹어 볼 것이다","근거: Would you like some?(좀 먹을래?) → Sure!(좋아!)","함정: ③ 나시고렝은 이미 더 받았다(Here you go.)"],"why":"후식을 권유받고 'Sure!'라고 했으므로 이어서 후식을 먹는다."},{"n":2,"q":"위 대화의 내용과 일치하는 것은?","o":["Ratu thanks Jiho for the dinner.","Jiho enjoyed the nasi-goreng, Korean fried rice.","Jiho asks Ratu for more food.","The dessert is Indonesian style fruit cake.","Jiho is not interested in the dessert."],"a":2,"ans":"Jiho asks Ratu for more food.","evs":[["Thank you for dinner, Ratu.","저녁 식사 고마워, Ratu."],["Can I have some more?","좀 더 먹어도 될까?"]],"ev":["Thank you for dinner, Ratu.","저녁 식사 고마워, Ratu."],"ow":["오답 ✕ — 저녁 식사에 고마워한 사람은 지호다. 'Thank you for dinner, Ratu.'(저녁 식사 고마워, Ratu.)라고 말한 쪽이 Jiho라서 Ratu가 Jiho에게 고마워한다는 보기는 틀림.","오답 ✕ — 'It's nasi-goreng. It's Indonesian fried rice.'(나시고렝이야. 인도네시아식 볶음밥이야.)라고 했다. 한국식 볶음밥이 아니라 인도네시아식 볶음밥이라서 틀림.","정답 ○ — 지호가 'Can I have some more?'(좀 더 먹어도 될까?)라고 말해서 Ratu에게 음식을 더 달라고 부탁했다. 대화와 일치한다.","오답 ✕ — 'It's es-buah, an iced fruit dessert.'(에스부아라는 얼음 과일 후식이야.)라고 했다. 과일 케이크가 아니라 얼음 과일 후식이라서 틀림.","오답 ✕ — 후식을 권하자 'Sure! Is it also Indonesian?'(좋아! 그것도 인도네시아 음식이니?)라며 관심을 보였다. 관심이 없다는 말은 틀림."],"memo":["정답: ③ 지호는 Ratu에게 음식을 더 달라고 한다","근거: Can I have some more?(좀 더 먹어도 될까?)","함정: 고맙다고 한 사람은 Ratu가 아니라 Jiho"],"why":"지호가 'Can I have some more?'라고 더 달라고 했다."},{"n":3,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["Indonesian - hot","Korean - iced","Indonesian - iced","Indian - iced","Thai - hot"],"a":2,"ans":"Indonesian - iced","evs":[["It's nasi-goreng. It's Indonesian fried rice.","나시고렝이야. 인도네시아식 볶음밥이야."],["It's es-buah, an iced fruit dessert.","에스부아라는 얼음 과일 후식이야."]],"ev":["It's nasi-goreng. It's Indonesian fried rice.","나시고렝이야. 인도네시아식 볶음밥이야."],"ow":["오답 ✕ — (A) Indonesian은 맞지만, 후식은 'an iced fruit dessert'(얼음 과일 후식)이지 뜨거운 후식이 아니라서 (B)가 틀림.","오답 ✕ — 나시고렝은 'Indonesian fried rice'(인도네시아식 볶음밥)이지 한국 음식이 아니라서 (A)가 틀림.","정답 ○ — 'It's Indonesian fried rice.'(인도네시아식 볶음밥이야.)와 'an iced fruit dessert'(얼음 과일 후식)에 맞게 (A)=Indonesian, (B)=iced이다.","오답 ✕ — 지호가 'Is it also Indonesian?'(그것도 인도네시아 음식이니?)이라고 묻자 'Yes.'라고 답했다. 인도 음식(Indian)이 아니라서 (A)가 틀림.","오답 ✕ — 태국 음식은 대화에 나오지 않고 후식은 hot이 아니라 iced라서 둘 다 틀림."],"memo":["정답: ③ Indonesian - iced","근거: It's Indonesian fried rice.(인도네시아식 볶음밥이야.) / an iced fruit dessert(얼음 과일 후식)","함정: Indonesian(인도네시아의)과 Indian(인도의)을 헷갈리지 말기"],"why":"Ratu는 인도네시아식 볶음밥과 얼음 과일 후식을 만들어 주었다.","sum":"Ratu made nasi-goreng, an (A) fried rice, and es-buah, an (B) fruit dessert.","lab":"완성된 요약문 : "}],"dlg":[["B","Thank you for dinner, Ratu.","저녁 식사 고마워, Ratu."],["G","My pleasure, Jiho. Help yourself.","천만에, 지호야. 마음껏 먹어."],["B","Wow, it's so delicious! What is the name of this food?","와, 정말 맛있다! 이 음식의 이름이 뭐니?"],["G","It's nasi-goreng. It's Indonesian fried rice.","나시고렝이야. 인도네시아식 볶음밥이야."],["B","Can I have some more?","좀 더 먹어도 될까?"],["G","No problem. Here you go. I also made a dessert. Would you like some?","물론이지. 여기 있어. 후식도 만들었어. 좀 먹을래?"],["B","Sure! Is it also Indonesian?","좋아! 그것도 인도네시아 음식이니?"],["G","Yes. It's es-buah, an iced fruit dessert. It's really good.","응. 에스부아라는 얼음 과일 후식이야. 정말 맛있어."]]},{"qs":[{"n":4,"q":"What is the boy doing?","o":["He is buying doughnuts at a bakery.","He is ordering more doughnuts for Mina.","He is baking doughnuts in the kitchen.","He is sharing his doughnuts with Mina.","He is eating doughnuts with Mina at a cafe."],"a":3,"ans":"He is sharing his doughnuts with Mina.","evs":[["I have some doughnuts. Would you like some, Mina?","나 도넛이 좀 있어. 좀 먹을래, 미나야?"],["Here you go.","여기 있어."]],"ev":["I have some doughnuts. Would you like some, Mina?","나 도넛이 좀 있어. 좀 먹을래, 미나야?"],"ow":["오답 ✕ — 소년은 도넛을 사는 사람이 아니라 이미 'I have some doughnuts.'(나 도넛이 좀 있어.)라고 하는 사람이다. 빵집에서 산다는 말이 없어서 틀림.","오답 ✕ — 'Yes, please. Thanks.'(응, 줘. 고마워.)로 미나가 받겠다고 했을 뿐, 도넛을 더 주문하는 장면은 없어서 틀림.","오답 ✕ — 도넛을 굽는 장면은 대화에 없다. 이미 가지고 있는 도넛을 주는 상황이라서 틀림.","정답 ○ — 소년은 'I have some doughnuts. Would you like some, Mina?'(도넛이 좀 있어. 좀 먹을래, 미나야?)라고 권한 뒤 'Here you go.'(여기 있어.)라며 건넨다. 도넛을 미나와 나누고 있다.","오답 ✕ — 카페에서 먹는다는 말은 없다. 소년이 미나에게 도넛을 건네주는 장면이라서 틀림."],"memo":["정답: ④ 소년은 미나와 도넛을 나눠 주고 있다","근거: Would you like some, Mina?(좀 먹을래, 미나야?) / Here you go.(여기 있어.)","함정: 도넛을 사거나 굽는 장면은 없다"],"why":"소년이 배고픈 미나에게 도넛을 권하고 건네준다."},{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["Mina is so full right now.","The boy doesn't have any food.","Mina asks the boy for a drink","Mina accepts the boy's offer.","The boy offers his cookies to Mina."],"a":3,"ans":"Mina accepts the boy's offer.","evs":[["Would you like some, Mina?","좀 먹을래, 미나야?"],["Yes, please. Thanks.","응, 줘. 고마워."]],"ev":["Would you like some, Mina?","좀 먹을래, 미나야?"],"ow":["오답 ✕ — 미나는 'Oh, I am so hungry.'(아, 나 너무 배고파.)라고 했다. 배부르다는 말과 반대라서 틀림.","오답 ✕ — 소년은 'I have some doughnuts.'(나 도넛이 좀 있어.)라고 했으므로 음식이 있다. 없다는 말은 틀림.","오답 ✕ — 음료를 달라고 하는 사람은 없다. 미나는 도넛을 주겠다는 제안에 'Yes, please.'라고 답했을 뿐이라서 틀림.","정답 ○ — 소년이 'Would you like some, Mina?'(좀 먹을래, 미나야?)라고 권하자 미나가 'Yes, please. Thanks.'(응, 줘. 고마워.)라고 답했다. 미나는 제안을 받아들였다.","오답 ✕ — 소년이 권한 것은 쿠키가 아니라 도넛(doughnuts)이라서 틀림."],"memo":["정답: ④ 미나는 소년의 제안을 받아들인다","근거: Yes, please. Thanks.(응, 줘. 고마워.)","함정: 권한 음식은 쿠키가 아니라 도넛"],"why":"미나가 'Yes, please.'라며 소년의 제안을 받아들였다."}],"dlg":[["G","Oh, I am so hungry.","아, 나 너무 배고파."],["B","Are you? I have some doughnuts. Would you like some, Mina?","그래? 나 도넛이 좀 있어. 좀 먹을래, 미나야?"],["G","Yes, please. Thanks.","응, 줘. 고마워."],["B","Here you go.","여기 있어."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["Sam은 부모님과 함께 산다.","Sam의 할머니는 요리를 잘하지 못하신다.","프랑스 사람들은 감자가 들어간 맥앤치즈를 좋아한다.","맥앤치즈는 오븐 없이 요리할 수 있다.","맥앤치즈는 6가지 재료로 만들 수 있다."],"a":4,"ans":"맥앤치즈는 6가지 재료로 만들 수 있다.","evs":[["You need: macaroni, cheese, milk, butter, flour, salt","필요한 것: 마카로니, 치즈, 우유, 버터, 밀가루, 소금"]],"ev":["You need: macaroni, cheese, milk, butter, flour, salt","필요한 것: 마카로니, 치즈, 우유, 버터, 밀가루, 소금"],"ow":["오답 ✕ — 본문에는 'I live with my grandma'(나는 할머니와 살고 있고)라고 했는데 이 보기는 부모님과 산다고 해서 틀림.","오답 ✕ — 본문에는 'she is a great cook'(할머니는 훌륭한 요리사야)라고 했는데 이 보기는 요리를 잘하지 못하신다고 해서 틀림.","오답 ✕ — 'Many Americans love this food.'(많은 미국인들이 이 음식을 아주 좋아해.)라고 했을 뿐, 프랑스 사람이나 감자가 들어간 맥앤치즈 이야기는 본문에 없어서 틀림.","오답 ✕ — 요리 과정에 'Bake it for about 15 minutes.'(약 15분간 굽는다.)가 있다. 오븐 없이 만든다는 근거는 본문에 없어서 틀림.","정답 ○ — 'You need: macaroni, cheese, milk, butter, flour, salt'(필요한 것: 마카로니, 치즈, 우유, 버터, 밀가루, 소금)로 재료가 6가지이다. 본문과 일치한다."],"memo":["정답: ⑤ 맥앤치즈는 6가지 재료로 만들 수 있다","근거: You need: macaroni, cheese, milk, butter, flour, salt(필요한 것: 마카로니, 치즈, 우유, 버터, 밀가루, 소금)","함정: ① 부모님이 아니라 할머니(grandma)와 산다"],"why":"필요한 재료를 세어 보면 마카로니, 치즈, 우유, 버터, 밀가루, 소금의 6가지이다."},{"n":7,"q":"윗글에 언급된 요리 과정을 제대로 이해하지 못한 학생은?","o":["연우: 마카로니를 먼저 삶아야 해.","유진: 밀가루와 소금은 버터가 녹은 뒤에 넣는 거야.","다빈: 우유를 넣고 저은 다음 불을 끄기 전에 치즈를 넣어.","세윤: 만들어진 소스를 삶은 마카로니와 섞으면 돼.","나현: 마지막에 소스와 마카로니를 섞고 15분간 구워."],"a":2,"ans":"다빈: 우유를 넣고 저은 다음 불을 끄기 전에 치즈를 넣어.","evs":[["Turn off the heat.","불을 끈다."],["Add the cheese and stir again.","치즈를 추가하고 다시 젓는다."]],"ev":["Turn off the heat.","불을 끈다."],"ow":["오답 ✕ — 'Boil the macaroni.'(마카로니를 삶는다.)가 1번 순서이므로 연우는 바르게 이해했다. 이해하지 못한 학생을 찾는 문제라서 답이 아니다.","오답 ✕ — 'Melt the butter in a pan. Add the flour and salt.'(버터를 팬에서 녹인다. 밀가루와 소금을 추가한다.)의 순서이므로 유진은 바르게 이해했다.","정답 ○ — 본문은 'Turn off the heat.'(불을 끈다.) 다음에 'Add the cheese and stir again.'(치즈를 추가하고 다시 젓는다.)이다. 치즈는 불을 끈 뒤에 넣으므로 '불을 끄기 전에 치즈를 넣어'라는 다빈이의 말이 틀리다.","오답 ✕ — 'Mix the sauce with the macaroni.'(소스를 마카로니와 섞는다.)라고 했으므로 세윤이는 바르게 이해했다.","오답 ✕ — 마지막 단계가 'Mix the sauce with the macaroni.'(소스를 마카로니와 섞는다.)와 'Bake it for about 15 minutes.'(약 15분간 굽는다.)이므로 나현이는 바르게 이해했다."],"memo":["정답: ③ 다빈 — 치즈는 불을 끈 '뒤'에 넣는다","근거: Turn off the heat.(불을 끈다.) → Add the cheese and stir again.(치즈를 추가하고 다시 젓는다.)","함정: 4번 단계의 순서(불 끄기 → 치즈)에 주의"],"why":"치즈는 불을 끈 다음에 넣는다."},{"n":8,"q":"윗글을 읽고 알 수 있는 맥앤치즈 요리법으로 적절하지 않은 것은?","o":["삶다","녹이다","굽다","섞다","튀기다"],"a":4,"ans":"튀기다","evs":[["Boil the macaroni.","마카로니를 삶는다."],["Melt the butter in a pan.","버터를 팬에서 녹인다."]],"ev":["Boil the macaroni.","마카로니를 삶는다."],"ow":["오답 ✕ — '1. Boil the macaroni.'(마카로니를 삶는다.)가 있으므로 '삶다'는 본문에 나오는 요리법이다.","오답 ✕ — 'Melt the butter in a pan.'(버터를 팬에서 녹인다.)가 있으므로 '녹이다'는 본문에 나오는 요리법이다.","오답 ✕ — 'Bake it for about 15 minutes.'(약 15분간 굽는다.)가 있으므로 '굽다'는 본문에 나오는 요리법이다.","오답 ✕ — 'Mix the sauce with the macaroni.'(소스를 마카로니와 섞는다.)가 있으므로 '섞다'는 본문에 나오는 요리법이다.","정답 ○ — 본문에는 삶기, 녹이기, 젓기, 섞기, 굽기만 나오고 튀기는 과정은 없다. '튀기다'는 알 수 없는 요리법이라서 적절하지 않다."],"memo":["정답: ⑤ 튀기다 (본문에 없는 요리법)","근거: Boil(삶다) / Melt(녹이다) / Mix(섞다) / Bake(굽다)","함정: 알 수 없는(적절하지 않은) 것을 고르는 문제"],"why":"본문의 요리 과정은 삶기·녹이기·섞기·굽기이고 튀기기는 없다."}],"pp":[["Hi, I am Sam.","안녕, 나는 Sam이야."],["I live with my grandma, and she is a great cook.","나는 할머니와 살고 있고, 할머니는 훌륭한 요리사야."],["She makes delicious food just like magic.","할머니는 마치 마법처럼 맛있는 음식을 만드셔."],["We often cook together.","우리는 종종 함께 요리를 해."],["Thanks to her, I can make some simple dishes.","할머니 덕분에 나는 몇 개의 간단한 요리를 만들 수 있어."],["Mac and cheese is one of them, and I can make it very well.","맥앤치즈는 그 요리들 중 하나이고, 나는 그것을 아주 잘 만들 수 있어."],["Mac means macaroni, a type of pasta.","mac은 파스타의 일종인 마카로니를 의미해."],["Many Americans love this food.","많은 미국인들이 이 음식을 아주 좋아해."],["The recipe is simple, so you can make it, too!","그 요리법은 간단해서 너희들도 만들 수 있어!"],["Here is the recipe.","여기에 그 요리법이 있어."],["You need: macaroni, cheese, milk, butter, flour, salt","필요한 것: 마카로니, 치즈, 우유, 버터, 밀가루, 소금"],["1. Boil the macaroni.","1. 마카로니를 삶는다."],["2. Melt the butter in a pan.","2. 버터를 팬에서 녹인다."],["Add the flour and salt.","밀가루와 소금을 추가한다."],["3. Add the milk and stir slowly.","3. 우유를 추가하고 천천히 젓는다."],["4. Turn off the heat.","4. 불을 끈다."],["Add the cheese and stir again.","치즈를 추가하고 다시 젓는다."],["The sauce is ready.","소스가 준비되었다."],["5. Mix the sauce with the macaroni.","5. 소스를 마카로니와 섞는다."],["6. Bake it for about 15 minutes.","6. 그것을 약 15분간 굽는다."]]},{"qs":[{"n":9,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["salt - hide","love - share","sugar - share","love - sell","cheese - cook"],"a":1,"ans":"love - share","evs":[["\"Add love and share the food with your family and friends.\"","\"사랑을 더하고, 너의 가족과 친구들과 그 음식을 나눠 먹으렴.\""]],"ev":["\"Add love and share the food with your family and friends.\"","\"사랑을 더하고, 너의 가족과 친구들과 그 음식을 나눠 먹으렴.\""],"ow":["오답 ✕ — 비법은 소금이 아니라 'Add love'(사랑을 더하고)이고, 음식을 숨기는 것이 아니라 'share the food'(음식을 나눠 먹으렴)라서 틀림.","정답 ○ — 할머니의 비법은 \"Add love and share the food with your family and friends.\"(사랑을 더하고, 가족과 친구들과 그 음식을 나눠 먹으렴.)이므로 (A)=love, (B)=share이다.","오답 ✕ — (B) share는 맞지만 더하라는 것은 설탕이 아니라 'Add love'(사랑을 더하고)라서 (A)가 틀림.","오답 ✕ — (A) love는 맞지만 음식을 파는 것(sell)이 아니라 'share the food'(음식을 나눠 먹으렴)라서 (B)가 틀림.","오답 ✕ — 치즈를 더하거나 요리하라는 말은 비법이 아니다. 비법은 사랑과 나눔이라서 둘 다 틀림."],"memo":["정답: ② love - share","근거: Add love and share the food with your family and friends.(사랑을 더하고, 가족과 친구들과 음식을 나눠 먹으렴.)","함정: 비법은 재료가 아니라 '마음'"],"why":"할머니의 비법은 사랑을 더하고 음식을 나누는 것이다.","sum":"Grandma's secret tip is to add (A) and (B) the food with your family and friends.","lab":"완성된 요약문 : "},{"n":10,"q":"윗글을 읽고 추론한 할머니의 성격으로 알맞은 것은?","o":["warm and loving","boring and careless","dramatic and annoying","serious and scary","mysterious and dark"],"a":0,"ans":"warm and loving","evs":[["Oh, here is a secret tip from my grandma.","오, 여기에 우리 할머니의 비법이 하나 있어."],["\"Add love and share the food with your family and friends.\"","\"사랑을 더하고, 너의 가족과 친구들과 그 음식을 나눠 먹으렴.\""]],"ev":["Oh, here is a secret tip from my grandma.","오, 여기에 우리 할머니의 비법이 하나 있어."],"ow":["정답 ○ — 할머니의 비법은 'Add love and share the food with your family and friends.'(사랑을 더하고, 가족과 친구들과 음식을 나눠 먹으렴.)이다. 사랑과 나눔을 강조하는 따뜻하고 애정 깊은 분이라서 warm and loving이다.","오답 ✕ — 'It looks delicious! It smells good, too!'(맛있어 보여! 좋은 냄새도 나!)처럼 즐거운 분위기이고, 비법도 사랑을 더하라는 말이다. 지루하고 부주의한 모습은 찾을 수 없어서 틀림.","오답 ✕ — 할머니가 극적이거나 짜증 나게 한다는 내용은 없다. 가장 가까운 문장인 'Add love...'(사랑을 더하고...)는 다정한 조언이라서 틀림.","오답 ✕ — 엄격하거나 무섭다는 근거가 없다. 'Add love and share the food...'(사랑을 더하고... 음식을 나눠 먹으렴.)는 부드러운 말이라서 틀림.","오답 ✕ — 'Oh, here is a secret tip from my grandma.'(여기에 할머니의 비법이 있어.)처럼 비법을 알려 주는 분이지, 신비롭고 어두운 사람은 아니라서 틀림."],"memo":["정답: ① warm and loving (따뜻하고 사랑이 많다)","근거: Add love and share the food with your family and friends.(사랑을 더하고, 가족과 친구들과 음식을 나눠 먹으렴.)","함정: 비법 = 사랑 → 무섭거나 어두운 성격은 ✕"],"why":"사랑과 나눔을 알려 주는 할머니는 따뜻하고 애정이 깊은 분이다."}],"pp":[["Ta-da!","짜잔!"],["The mac and cheese is ready now.","맥앤치즈가 이제 준비됐어."],["It looks delicious!","맛있어 보여!"],["It smells good, too!","좋은 냄새도 나!"],["Oh, here is a secret tip from my grandma.","오, 여기에 우리 할머니의 비법이 하나 있어."],["\"Add love and share the food with your family and friends.\"","\"사랑을 더하고, 너의 가족과 친구들과 그 음식을 나눠 먹으렴.\""]]}];

setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
