<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩튜터 주니어 4 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>

<script>
var P=[{"u":1,"id":"rj4-01-1","no":1,"ko":"여행을 하며 문화를 배워요","items":[{"n":1,"t":"tf","q":"Antonio makes sure that everyone knows where and when to meet.","ko":"Antonio는 모든 사람이 어디에서 언제 만날지 알고 있는지 확인한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Antonio leads multiple tours each day, and he always makes sure that everyone knows where and when to meet.","Antonio는 매일 여러 관광을 안내하고, 항상 모든 사람이 어디에서 언제 만날지를 알고 있는지 확인한다."]],"w":"3번 문장 he always makes sure that everyone knows where and when to meet와 같은 내용이에요. 항상 확인한다고 했어요.","c":"T"},"h":"54052bc6a2"},{"n":2,"t":"tf","q":"Antonio tells visitors to arrive at the meeting point 10 minutes late.","ko":"Antonio는 방문객들에게 모임 장소에 10분 늦게 도착하라고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"He instructs them to arrive at the meeting point 10 minutes early.","그는 그들에게 모임 장소에 10분 일찍 도착하라고 지시한다."]],"w":"4번 문장은 10분 일찍(early) 도착하라고 지시한다고 해요. 늦게(late)가 아니라 일찍이에요.","c":"F"},"h":"3eb107c417"},{"n":3,"t":"tf","q":"Pinchos are snacks served on top of a small slice of bread.","ko":"Pincho는 작은 빵 조각 위에 제공되는 간식이다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Pinchos are snacks served on top of a small slice of bread.","Pincho는 작은 빵 조각 위에 제공되는 간식이다."]],"w":"8번 문장에서 Pincho를 작은 빵 조각 위에 제공되는 간식이라고 설명해요.","c":"T"},"h":"d0018d5a68"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Antonio starts his tours by introducing several historic buildings.)","ko":"Antonio는 여러 역사적인 건물들을 ( )함으로써 관광을 시작한다.","opts":["수리하는 것","소개하는 것","무너뜨리는 것","그리는 것"],"word":"introducing","r":{"a":"2) 소개하는 것","ev":"5번 문장","s":[[5,"Antonio starts his tours by introducing several historic buildings.","Antonio는 여러 역사적인 건물들을 소개함으로써 그의 관광을 시작한다."]],"w":"5번에서 관광을 시작하는 방법이 several historic buildings를 introducing하는 거예요. 가이드가 건물들을 방문객에게 알려 주는 것이니 introduce = 소개하다예요.","c":2},"h":"cfaeed0bdc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (After lunch, he shares hidden stories about the region while walking around.)","ko":"점심 식사 후, 그는 돌아다니면서 그 지역에 대한 ( ) 이야기들을 공유한다.","opts":["유명한","웃긴","슬픈","숨겨진"],"word":"hidden","r":{"a":"4) 숨겨진","ev":"9번 문장","s":[[9,"After lunch, he shares hidden stories about the region while walking around.","점심 식사 후, 그는 돌아다니면서 그 지역에 대한 숨겨진 이야기들을 공유한다."]],"w":"9번에서 가이드가 지역에 대한 hidden stories를 들려줘요. 사람들이 잘 모르는 이야기이므로 hidden = 숨겨진이에요.","c":4},"h":"a37037dc84"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAround noon, Antonio takes them to a place that serves a local food, pinchos.","ko":"밑줄 친 them이 가리키는 것은?","sko":"정오쯤, Antonio는 지역 음식인 pincho를 제공하는 장소로 그들을 데려간다.","opts":["방문객들","벽화들","역사적인 건물들","지역 음식들"],"r":{"a":"1) 방문객들","ev":"6~7번 문장","s":[[6,"He then brings visitors to see murals that show the history of the city.","그러고 나서 그는 도시의 역사를 보여주는 벽화를 보기 위해 방문객들을 데려간다."],[7,"Around noon, Antonio takes them to a place that serves a local food, pinchos.","정오쯤, Antonio는 지역 음식인 pincho를 제공하는 장소로 그들을 데려간다."]],"w":"6번에서 Antonio가 visitors를 벽화를 보러 데려가요. 이어서 7번에서 그 방문객들을 pincho 파는 곳으로 데려가므로 them = 방문객들이에요.","c":1},"h":"deba669336"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This information helps him improve his wonderful tours.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 정보는 그가 그의 멋진 관광을 개선하는 것을 돕는다.","opts":["그 정보 때문에 Antonio는 관광 시간을 줄인다.","그 정보는 Antonio의 관광이 인기를 잃게 만든다.","그 정보는 Antonio가 관광을 더 좋게 고치는 데 도움이 된다.","그 정보는 방문객들이 관광을 건너뛰게 한다."],"r":{"a":"3) 그 정보는 Antonio가 관광을 더 좋게 고치는 데 도움이 된다.","ev":"10~11번 문장","s":[[10,"Antonio concludes every tour by asking for a review.","Antonio는 후기를 요청함으로써 모든 관광을 마친다."],[11,"This information helps him improve his wonderful tours.","이 정보는 그가 그의 멋진 관광을 개선하는 것을 돕는다."]],"w":"10번에서 후기를 요청하고, 11번에서 그 정보가 관광을 개선(improve)하도록 돕는다고 해요. 그래서 관광을 더 좋게 고치는 데 도움이 된다는 뜻이에요.","c":3},"h":"dc413589c7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Antonio는 방문객들을 점심 식사에 데려가면서 관광을 시작한다.","Antonio는 점심 식사 전에 모임 장소에 앉아 이야기를 들려준다.","Antonio는 관광을 시작할 때 방문객들에게 요금을 내라고 요청한다.","Antonio는 도시의 역사를 보여 주는 벽화를 방문객들에게 보여 준다."],"opts":["Antonio starts his tours by taking visitors to lunch.","Antonio shares stories before lunch while sitting at the meeting point.","Antonio asks visitors to pay at the start of each tour.","Antonio shows visitors murals that show the history of the city."],"r":{"a":"4) Antonio shows visitors murals that show the history of the city.","ev":"5~6번, 9~10번 문장","s":[[5,"Antonio starts his tours by introducing several historic buildings.","Antonio는 여러 역사적인 건물들을 소개함으로써 그의 관광을 시작한다."],[6,"He then brings visitors to see murals that show the history of the city.","그러고 나서 그는 도시의 역사를 보여주는 벽화를 보기 위해 방문객들을 데려간다."],[9,"After lunch, he shares hidden stories about the region while walking around.","점심 식사 후, 그는 돌아다니면서 그 지역에 대한 숨겨진 이야기들을 공유한다."],[10,"Antonio concludes every tour by asking for a review.","Antonio는 후기를 요청함으로써 모든 관광을 마친다."]],"w":"6번에서 도시의 역사를 보여 주는 벽화를 보러 데려가요. 관광은 건물 소개로 시작하고(5번), 숨겨진 이야기는 점심 후 돌아다니며 들려주고(9번), 후기는 마지막에 요청해요(10번).","c":4},"h":"115e7c1715"},{"n":9,"t":"sum","q":"Travel Magazine spent a day with Antonio to (A) more about the job of a tour guide in (B).","ko":"Travel Magazine은 (B)의 여행 가이드라는 직업에 대해 더 (A) 목적으로 Antonio와 하루를 보냈다.","oko":["(A) 배우는 / (B) 프랑스","(A) 잊는 / (B) 스페인","(A) 파는 / (B) 이탈리아","(A) 잊는 / (B) 프랑스","(A) 배우는 / (B) 스페인"],"opts":["(A) learn / (B) France","(A) forget / (B) Spain","(A) sell / (B) Italy","(A) forget / (B) France","(A) learn / (B) Spain"],"r":{"a":"5) (A) learn / (B) Spain (배우는 / 스페인)","ev":"2번 문장","s":[[2,"To learn more about this interesting job, Travel Magazine spent a day with Antonio, a tour guide in Spain.","이 흥미로운 직업에 대해 더 알아보기 위해 <Travel Magazine>은 스페인의 여행 가이드인 Antonio와 하루를 보냈다."]],"w":"2번 문장에서 To learn more about this interesting job(이 직업에 대해 더 알아보기 위해), 스페인(Spain)의 여행 가이드 Antonio와 하루를 보냈다고 해요.","c":5},"h":"4f00ddbf17"},{"n":10,"t":"fill","q":"Antonio [A] every tour by asking for a [B].","ko":"Antonio는 [B]을(를) 요청함으로써 모든 관광을 [A].","bank":["concludes","review","early","noon","murals","snacks"],"bko":{"concludes ["외쳤다","떠났다","대답했다","거절했다"],"word":"responded","r":{"a":"3) 대답했다","ev":"11번 문장","s":[[11,"Nokomis smiled and responded, “It was my pleasure.”","Nokomis는 미소 지으며, “별말씀을요.”라고 대답했다."]],"w":"11번에서 거미가 고맙다고 한 말에 Nokomis가 미소 지으며 '별말씀을요'라고 말해요. 그래서 respond = 대답하다예요.","c":3},"h":"7fcf257e1c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (“Let me repay you, faithful friend,” the spider said.)","ko":"“제가 당신에게 은혜를 갚게 해 주세요, ( ) 친구여.”라고 그 거미가 말했다.","opts":["충직한","게으른","무서운","낯선"],"word":"faithful","r":{"a":"1) 충직한","ev":"12번 문장","s":[[12,"“Let me repay you, faithful friend,” the spider said.","“제가 당신에게 은혜를 갚게 해 주세요, 충직한 친구여.”라고 그 거미가 말했다."]],"w":"12번에서 거미는 자기를 구해 준 Nokomis를 친구라고 부르며 은혜를 갚겠다고 해요. 자기를 지켜 준 믿을 만한 친구이므로 faithful = 충직한이에요.","c":1},"h":"3de0309b03"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nRemember my technique, Nokomis, and use it to weave your own webs.","ko":"밑줄 친 it이 가리키는 것은?","sko":"제 기술을 기억하세요, Nokomis, 그리고 그것을 당신 자신의 망을 짜는 데 사용하세요.","opts":["소년의 신발","Nokomis의 집","거미의 다리","거미의 기술"],"r":{"a":"4) 거미의 기술","ev":"17번 문장","s":[[17,"Remember my technique, Nokomis, and use it to weave your own webs.","제 기술을 기억하세요, Nokomis, 그리고 그것을 당신 자신의 망을 짜는 데 사용하세요."]],"w":"17번에서 거미가 my technique(제 기술)을 기억하라고 하고, and use it으로 이어져요. 사용해서 망을 짜는 것은 기술이므로 it = 거미의 기술이에요.","c":4},"h":"1f62e6a5b6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without you, I would have died.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 없었다면, 저는 죽었을 거예요.","opts":["당신이 도와줘서 저는 이미 죽었어요.","당신이 없었다면 저는 죽었을 거예요.","당신이 없어서 저는 죽고 싶었어요.","당신이 있으니 저는 절대 죽지 않을 거예요."],"r":{"a":"2) 당신이 없었다면 저는 죽었을 거예요.","ev":"9~10번 문장","s":[[9,"“You saved me, Nokomis,” it said.","“당신이 저를 구해 주셨군요, Nokomis.”라고 그것이 말했다."],[10,"“Without you, I would have died.”","“당신이 없었다면, 저는 죽었을 거예요.”"]],"w":"Without you, ~ would have died는 '당신이 없었다면 ~했을 텐데'라는 뜻이에요. 9번에서 거미가 Nokomis가 자기를 구해 줬다고 하니, 구해 주지 않았다면 죽었을 거라는 말이에요.","c":2},"h":"9bb241fad7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Nokomis는 신발로 거미를 죽였다.","거미는 Nokomis에게 자기가 평범한 거미라고 말했다.","거미는 Nokomis에게 좋은 꿈을 가져다주는 망을 짜는 방법을 알려 주었다.","소년이 그 망들을 드림 캐처라고 이름 붙였다."],"opts":["Nokomis killed the spider with her shoe.","The spider told Nokomis it was an ordinary spider.","The spider showed Nokomis how to weave webs that bring wonderful dreams.","The boy named the webs dream catchers."],"r":{"a":"3) The spider showed Nokomis how to weave webs that bring wonderful dreams.","ev":"17~19번 문장","s":[[17,"Remember my technique, Nokomis, and use it to weave your own webs.","제 기술을 기억하세요, Nokomis, 그리고 그것을 당신 자신의 망을 짜는 데 사용하세요."],[18,"The webs will bring you wonderful dreams each night.”","그 망은 매일 밤 당신에게 멋진 꿈을 가져다줄 거예요.”"],[19,"“Thank you! I will,” Nokomis said, “And I shall call them dream catchers.”","“고마워요! 그렇게 할게요. 그리고 저는 그것들을 드림 캐처라고 부를 거예요.”라고 Nokomis가 말했다."]],"w":"17~18번에서 거미가 망을 짜는 기술을 알려 주고 그 망이 멋진 꿈을 가져다준다고 해요. 신발을 든 사람은 소년이고(4번), 거미는 평범하지 않았고(8번), 드림 캐처라고 부르겠다고 한 사람은 Nokomis예요(19번).","c":3},"h":"2fc9805066"},{"n":9,"t":"sum","q":"Nokomis (A) the spider, and the spider, which had powerful (B), wanted to repay her.","ko":"Nokomis는 그 거미를 (A) 강력한 (B)을(를) 가진 그 거미는 그녀에게 은혜를 갚고 싶어 했다.","oko":["(A) 구했고 / (B) 독","(A) 죽였고 / (B) 마법","(A) 두려워했고 / (B) 신발","(A) 잡았고 / (B) 꿈","(A) 구했고 / (B) 마법"],"opts":["(A) saved / (B) poison","(A) killed / (B) magic","(A) feared / (B) shoes","(A) caught / (B) dreams","(A) saved / (B) magic"],"r":{"a":"5) (A) saved / (B) magic (구했고 / 마법)","ev":"5~6번, 8~9번, 12번 문장","s":[[5,"“Sweetheart,” Nokomis said, “Please don’t.","“얘야, 그러지 마."],[6,"It won’t hurt you and it is making a beautiful web.”","그것은 너를 해치지 않을 것이고, 아름다운 거미줄을 만들고 있잖니.”라고 Nokomis가 말했다."],[8,"Actually, it was not an ordinary spider—it had powerful magic!","사실, 그것은 평범한 거미가 아니었고, 그것은 강력한 마법을 가지고 있었다!"],[9,"“You saved me, Nokomis,” it said.","“당신이 저를 구해 주셨군요, Nokomis.”라고 그것이 말했다."],[12,"“Let me repay you, faithful friend,” the spider said.","“제가 당신에게 은혜를 갚게 해 주세요, 충직한 친구여.”라고 그 거미가 말했다."]],"w":"5~6번에서 Nokomis가 거미를 해치지 말라고 말려 거미를 구해 줬고(saved), 8번에서 그 거미는 강력한 마법(magic)을 가졌다고 해요. 12번에서 거미가 은혜를 갚겠다고 해요.","c":5},"h":"07a7546c48"},{"n":10,"t":"fill","q":"A spider’s web catches [A], and each stitch also catches [B] dreams.","ko":"거미줄은 [A]을(를) 잡고, 한 땀 한 땀은 [B] 꿈도 잡는다.","bank":["prey","bad","window","shoe","pleasure","technique"],"bko":{"prey":"먹이","bad":"나쁜","window":"창문","shoe":"신발","pleasure":"기쁨","technique":"기술"},"r":{"a":"[A] prey (먹이), [B] bad (나쁜)","ev":"14번, 16번 문장","s":[[14,"“As you know, my web catches prey.","“당신이 알다시피, 저의 거미줄은 먹이를 잡죠."],[16,"Each stitch catches bad dreams, too!","각각의 땀은 나쁜 꿈도 잡아요!"]],"w":"14번에서 my web catches prey(먹이를 잡는다)라고 하고, 16번에서 Each stitch catches bad dreams, too라고 해요. window, shoe, pleasure, technique는 거미줄이 잡는 것으로 나오지 않아요.","c":null},"h":"6d2f4cd674"}]},{"u":1,"id":"rj4-01-3","no":3,"ko":"그리스 로마 신화에 숨겨진 ‘clue’","items":[{"n":1,"t":"tf","q":"The Minotaur was a monster that lived in a huge maze.","ko":"미노타우로스는 거대한 미로에서 살았던 괴물이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The Minotaur was a monster that was half bull and half human, and it lived in a huge maze.","미노타우로스는 반은 황소이며 반은 인간이었던 괴물이었고, 그것은 거대한 미로에서 살았다."]],"w":"5번에서 미노타우로스는 반은 황소, 반은 인간인 괴물이고 거대한 미로(huge maze)에서 살았다고 해요.","c":"T"},"h":"fb0dfc6166"},{"n":2,"t":"tf","q":"Ariadne gave Theseus a sword to kill the Minotaur.","ko":"아리아드네는 테세우스에게 미노타우로스를 죽이라고 칼을 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"A princess named Ariadne solved the problem by giving Theseus a ball of thread.","아리아드네라는 이름의 공주는 테세우스에게 실뭉치를 줌으로써 그 문제를 해결했다."]],"w":"7번에서 아리아드네가 테세우스에게 준 것은 칼이 아니라 실뭉치(a ball of thread)예요.","c":"F"},"h":"cac749ebaf"},{"n":3,"t":"tf","q":"Today, the word “clue” still only means a ball of thread.","ko":"오늘날에도 ‘clue’라는 단어는 실뭉치만을 의미한다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Today, it refers to something that helps answer a question or solve a mystery.","오늘날, 그것은 질문에 답하거나 미스터리를 푸는 것을 돕는 것을 가리킨다."]],"w":"3번에서 오늘날 clue는 질문에 답하거나 미스터리를 푸는 것을 돕는 것을  만든 사전에 적혀 있다.","그 이유는 아직 아무도 알지 못한다."],"r":{"a":"1) 그 이유는 고대 그리스 신화의 테세우스와 미노타우로스 이야기에서 찾을 수 있다.","ev":"4번 문장","s":[[4,"The reason lies in the ancient Greek myth of Theseus and the Minotaur.","그 이유는 고대 그리스 신화의 테세우스와 미노타우로스에게 있다."]],"w":"12번의 Over time은 시간이 지나면서, more common은 더 흔한, standard는 표준의라는 뜻이에요. 11번에서 이 철자는 1400년대에 처음 기록되었다고 하므로 '막 만들어졌다'는 말은 맞지 않아요.","c":1},"h":"e1cdd21fb0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["테세우스는 미노타우로스가 무서워서 죽이는 것을 포기했다.","테세우스는 미노타우로스를 죽인 뒤 돌아가는 길을 찾을 수 있었다.","‘clue’라는 단어는 처음에는 미스터리를 푸는 데 도움이 되는 것을 의미했다.","미노타우로스는 반은 말이고 반은 인간인 괴물이었다."],"opts":["Theseus was afraid of the Minotaur, so he gave up killing it.","Theseus could find his way back after killing the Minotaur.","The word “clue” first meant something that helps solve a mystery.","The Minotaur was a monster that was half horse and half human."],"r":{"a":"2) Theseus could find his way back after killing the Minotaur. (테세우스는 미노타우로스를 죽인 뒤 돌아가는 길을 찾을 수 있었다.)","ev":"2~3번, 5~6번, 9번 문장","s":[[2,"Originally, the word was spelled “clew,” and it meant a ball of thread.","원래 그 단어는 ‘clew’라는 철자로 쓰였고, 그것은 실뭉치를 의미했다."],[3,"Today, it refers to something that helps answer a question or solve a mystery.","오늘날, 그것은 질문에 답하거나 미스터리를 푸는 것을 돕는 것을 가리킨다."],[5,"The Minotaur was a monster that was half bull and half human, and it lived in a huge maze.","미노타우로스는 반은 황소이며 반은 인간이었던 괴물이었고, 그것은 거대한 미로에서 살았다."],[6,"Theseus wanted to kill the Minotaur, but the maze was very difficult to escape from.","테세우스는 미노타우로스를 죽이고 싶었지만, 그 미로는 탈출하기가 매우 어려웠다."],[9,"He could just follow it to find his way back after killing the Minotaur.","그는 미노타우로스를 죽이고 나서 돌아가는 길을 찾기 위해 그저 그것을 따라갈 수 있었다."]],"w":"8번에서 테세우스는 미로를 통과하며 뒤에 실을 남겼어요. 테세우스는 죽이고 싶어 했고(6번), 1400년대에 처음 기록된 철자는 clue이며(11번), 미노타우로스는 반은 황소였어요(5번).","c":2},"h":"b668143e92"},{"n":9,"t":"sum","q":"The modern spelling “clue” was first (A) in the 1400s, and over time it became more (B).","ko":"현대의 철자 ‘clue’는 1400년대에 처음 (A) 철자였고, 시간이 지나면서 더 (B) 철자가 되었다.","oko":["(A) 기록된 / (B) 드문","(A) 잊힌 / (B) 흔한","(A) 기록된 / (B) 흔한","(A) 잊힌 / (B) 드문","(A) 사라진 / (B) 흔한"],"opts":["(A) recorded / (B) rare","(A) forgotten / (B) common","(A) recorded / (B) common","(A) forgotten / (B) rare","(A) lost / (B) common"],"r":{"a":"3) (A) recorded / (B) common (기록된 / 흔한)","ev":"11~12번 문장","s":[[11,"The modern spelling “clue” was first recorded in the 1400s.","현대의 철자인 ‘clue’는 1400년대에 처음으로 기록되었다."],[12,"Over time, this spelling became more common, and now it is standard.","시간이 지나면서, 이 철자법이 더 흔해지게 되었고, 이제 그것은 표준이 되었다."]],"w":"11번에서 현대 철자 clue가 1400년대에 처음 기록되었다(recorded)고 하고, 12번에서 시간이 지나며 이 철자가 더 흔해졌다(common)고 해요.","c":3},"h":"a31554bdb6"},{"n":10,"t":"fill","q":"As he went through the maze, he [A] the thread in a [B] behind him.","ko":"그는 미로를 통과하면서 실을 그의 뒤에 [B](으)로 [A].","bank":["left","trail","half","standard","ancient","modern"],"bko":{"left":"남겼다(leave의 과거)","trail":"자취","half":"반","standard":"표준","ancient":"고대의","modern":"현대의"},"r":{"a":"[A] left (남겼다(leave의 과거)), [B] trail (자취)","ev":"8번 문장","s":[[8,"As he went through the maze, he left the thread in a trail behind him.","그는 미로를 통과하면서 그의 뒤로 길에 실을 남겼다."]],"w":"8번에서 테세우스가 the thread를 남기고, 9번에서 그것을 follow해서 돌아가는 길을 찾았어요. maze, half, standard, spelled는 남기거나 따라간 것으로 나오지 않아요.","c":null},"h":"6b02fc60d5"}]},{"u":1,"id":"rj4-01-4","no":4,"ko":"그걸 다 센다고?","items":[{"n":1,"t":"tf","q":"A judge has to check that the man used only fresh and uncracked eggs.","ko":"심판은 그 남자가 신선하고 깨지지 않은 달걀만을 사용했는지 점검해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"You would have to check that he used only fresh and uncracked eggs.","당신은 그가 신선하고 깨지지 않은 달걀만을 사용했는지 점검해야 할 것이다."]],"w":"4번 문장에서 그가 신선하고 깨지지 않은 달걀만 사용했는지 점검해야 한다고 해요.","c":"T"},"h":"8d16d5d20f"},{"n":2,"t":"tf","q":"The eggs only need to stay upright for one second.","ko":"달걀들은 1초 동안만 똑바로 서 있으면 된다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Also, you would need to make sure that the eggs stayed upright for more than five seconds
