w about you? Different countries have different types of ice cream. A gelato truck is over there. There is a long line. Let's go there first.","There are many flavors of gelato. They all look delicious. Hmm.... This time, I want to try strawberry gelato. Yummy! It is very creamy.","Italy is the home of gelato. Gelato is a very popular dessert there. It first appeared there in the 16th century, and some gelato shops have a long history.","Here is a dondurma truck. I choose chocolate dondurma. Surprise! It's sticky and stretchy. Look at the man. He is stretching some dondurma. It is longer than his arm. Now he is handing the dondurma to a boy, but then he is taking it back. Huh? The man is doing the same thing again and again. Can the boy get it?","Dondurma is Turkish ice cream. It melts very slowly. Turkish people eat dondurma in many ways. Some use a knife and fork, and others eat it like a sandwich.","This is a truck for Mexican ice cream, paleta. Paleta looks like a popsicle. Most paletas have natural fruits in them. I want this kiwi paleta. Oh, no! It tastes spicy!","Mexicans love spicy food. They sometimes add chili peppers to paletas. Most paletas are sweet, but some are spicy. Some Mexicans make them at home.","Today, I had a lot of ice cream. Gelato was my favorite. It was more delicious than dondurma and paleta. What kind of ice cream do you want to try? Please leave a comment. Bye, bye."];var PASS_KO=["세계의 아이스크림","여러분 안녕하세요! 제 브이로그에 오신 것을 환영해요. 저는 국제 아이스크림 축제에 와 있어요. 저는 아이스크림을 사랑해요. 여러분은 어떠신가요? 다양한 나라에는 각기 다른 종류의 아이스크림이 있어요. 젤라토 트럭이 저기에 있어요. 줄이 길어요. 저기에 먼저 가 봐요.","다양한 맛의 젤라토가 있어요. 그것들은 모두 맛있어 보여요. 음…. 이번에는 딸기 젤라토를 먹어 보고 싶어요. 맛있어요! 이것은 정말 부드러워요.","이탈리아는 젤라토의 본고장입니다. 젤라토는 그곳에서 매우 인기 있는 디저트입니다. 그것은 그곳에 16세기에 처음 등장했고, 몇몇 젤라토 가게들은 긴 역사가 있답니다.","여기는 돈두르마 트럭이에요. 저는 초콜릿 돈두르마를 골랐어요. 놀라워요! 이것은 쫀득하고 잘 늘어나요. 저 아저씨를 보세요. 그는 돈두르마를 늘리고 있어요. 그것은 그의 팔보다 더 길어요. 이제 그는 한 남학생에게 돈두르마를 건네주고 있는데요, 아저씨가 그것을 다시 가져가네요. 어? 아저씨가 같은 행동을 계속 해요. 남학생은 그것을 받을 수 있을까요?","돈두르마는 튀르키예 아이스크림입니다. 그것은 아주 천천히 녹습니다. 튀르키예 사람들은 다양한 방법으로 돈두르마를 먹습니다. 어떤 사람들은 칼과 포크를 사용하고, 다른 사람들은 그것을 샌드위치처럼 먹습니다.","이것은 멕시코 아이스크림인 팔레타 트럭이에요. 팔레타는 막대 아이스크림처럼 생겼어요. 팔레타 대부분은 안에 천연 과일이 들어 있어요. 저는 이 키위 팔레타를 먹고 싶어요. 오, 이런! 이것은 매운맛이 나요!","멕시코 사람들은 매운 음식을 좋아합니다. 그들은 때때로 팔레타에 고추를 추가합니다. 팔레타 대부분은 달콤하지만, 어떤 것은 맵습니다. 어떤 멕시코 사람들은 그것을 집에서 만듭니다.","오늘 저는 많은 아이스크림을 먹었어요. 젤라토는 제가 제일 좋아하는 것이었어요. 그것은 돈두르마와 팔레타보다 더 맛있었어요. 여러분은 어떤 종류의 아이스크림을 먹어 보고 싶나요? 의견을 남겨 주세요. 안녕."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["the taste of Peking duck","Ming's Kitchen's best dish","traditional Chinese dishes","Ming's Kitchen's famous chefs","Ming's Kitchen's opening event"],"a":4,"ans":"Ming's Kitchen's opening event","evs":[["Ming's Kitchen is going to hold an opening event for three days from today.","Ming's Kitchen이 오늘부터 3일간 개업 행사를 열 예정입니다."],["Peking duck will be half price during the event.","행사 기간 동안 베이징덕은 반값입니다."]],"ev":["Ming's Kitchen is going to hold an opening event for three days from today.","Ming's Kitchen이 오늘부터 3일간 개업 행사를 열 예정입니다."],"ow":["오답 ✕ — 'the duck is really crispy'(오리가 정말 바삭합니다)처럼 맛을 한 번 말하지만 방송 전체의 주제는 아니다. 중심 내용은 개업 행사 안내라서 틀림.","오답 ✕ — 'Peking duck will be half price during the event.'(행사 기간 동안 베이징덕은 반값입니다.)에서 베이징덕이 나오지만, 가장 맛있는 요리라는 설명은 없다. 행사 소식이 중심이라 틀림.","오답 ✕ — 'It's a traditional Chinese dish'(중국 전통 요리입니다)는 베이징덕 하나를 설명하는 말일 뿐, 여러 전통 요리를 소개하는 방송이 아니라서 틀림.","오답 ✕ — 방송에 요리사에 대한 언급은 전혀 없다. 가장 가까운 문장은 'Why don't you come and enjoy some tasty Chinese food?'(오셔서 맛있는 중국 음식을 즐기시는 게 어떨까요?)인데 이것도 행사 홍보이다.","정답 ○ — 'Ming's Kitchen is going to hold an opening event'(Ming's Kitchen이 개업 행사를 열 예정입니다)로 시작해 행사 기간의 혜택(반값)과 방문을 권하므로 주제는 개업 행사임."],"memo":["정답 ⑤: Ming's Kitchen의 개업 행사 안내","근거: Ming's Kitchen is going to hold an opening event ...(Ming's Kitchen이 개업 행사를 열 예정입니다.)","함정: 베이징덕의 맛·전통 요리는 행사 홍보 중에 나온 일부라 ①~③은 ✕"],"why":"식당 개업 행사를 알리고 방문을 권하는 방송이다."},{"n":2,"q":"위 방송의 내용과 일치하는 것은?","o":["개업 행사는 하루 동안만 열린다.","베이징덕은 이탈리아의 전통 요리이다.","행사 기간에 모든 요리가 반값이다.","행사 기간에 베이징덕을 반값에 먹을 수 있다.","베이징덕의 오리는 부드럽고 촉촉하다고 소개한다."],"a":3,"ans":"행사 기간에 베이징덕을 반값에 먹을 수 있다.","evs":[["Peking duck will be half price during the event.","행사 기간 동안 베이징덕은 반값입니다."],["It's a traditional Chinese dish, and the duck is really crispy.","베이징덕은 중국 전통 요리이고, 오리가 정말 바삭합니다."]],"ev":["Peking duck will be half price during the event.","행사 기간 동안 베이징덕은 반값입니다."],"ow":["오답 ✕ — 방송에서는 'for three days from today'(오늘부터 3일간)라고 했는데, 이 보기는 하루 동안만 열린다고 해서 틀림.","오답 ✕ — 'It's a traditional Chinese dish'(중국 전통 요리입니다)라고 했는데, 이 보기는 이탈리아의 요리라고 해서 틀림.","오답 ✕ — 'Peking duck will be half price during the event.'(행사 기간 동안 베이징덕은 반값입니다.)처럼 반값인 것은 베이징덕뿐이다. 모든 요리가 반값이라는 말은 없어서 틀림.","정답 ○ — 'Peking duck will be half price during the event.'(행사 기간 동안 베이징덕은 반값입니다.)와 일치함.","오답 ✕ — 'the duck is really crispy'(오리가 정말 바삭합니다)라고 했는데, 이 보기는 부드럽고 촉촉하다고 해서 틀림."],"memo":["정답 ④: 행사 기간에 베이징덕을 반값에 먹을 수 있다.","근거: Peking duck will be half price during the event.(행사 기간 동안 베이징덕은 반값입니다.)","함정: ③ 반값은 모든 요리가 아니라 베이징덕만이다. ✕"],"why":"행사 기간(three days)에 베이징덕이 half price라는 내용이다."}],"dlg":[["W","May I have your attention, please? Ming's Kitchen is going to hold an opening event for three days from today. Peking duck will be half price during the event. It's a traditional Chinese dish, and the duck is really crispy. Why don't you come and enjoy some tasty Chinese food?","주목해 주시겠어요? Ming's Kitchen이 오늘부터 3일간 개업 행사를 열 예정입니다. 행사 기간 동안 베이징덕은 반값입니다. 베이징덕은 중국 전통 요리이고, 오리가 정말 바삭합니다. 오셔서 맛있는 중국 음식을 즐기시는 게 어떨까요?"]]},{"qs":[{"n":3,"q":"What are the speakers going to do after the dialogue?","o":["They are going to eat snacks.","They are going to go to Thailand.","They are going to have a Thai dish.","They are going to research Thai food.","They are going to make food at home."],"a":2,"ans":"They are going to have a Thai dish.","evs":[["G: Let's eat Thai food today.","오늘은 태국 음식을 먹자."],["G: It's Thai salad.","태국식 샐러드야."],["B: Sounds good. I'll get it.","좋아. 그걸로 할게."]],"ev":["G: Let's eat Thai food today.","오늘은 태국 음식을 먹자."],"ow":["오답 ✕ — 대화에서 먹을 것은 'Thai salad'(태국식 샐러드)인 솜탐이다. 간식(snacks)을 먹겠다는 말은 지문에 없음.","오답 ✕ — 'Let's eat Thai food today.'(오늘은 태국 음식을 먹자.)는 태국 음식을 먹자는 말이지 태국에 간다는 말이 아니다. 지문에 태국 여행 이야기는 없음.","정답 ○ — 'Let's eat Thai food today.'(오늘은 태국 음식을 먹자.)라고 했고 마지막에 소년이 'Sounds good. I'll get it.'(좋아. 그걸로 할게.)라고 솜탐을 고르므로 대화 후 태국 음식을 먹을 것임.","오답 ✕ — 'What's that?'(그게 뭐야?)은 솜탐이 무엇인지 묻는 말일 뿐, 태국 음식을 조사한다는 말은 지문에 없음.","오답 ✕ — 'I'll get it.'(그걸로 할게.)은 음식을 주문하겠다는 뜻이다. 집에서 만든다는 말은 지문에 없음."],"memo":["정답 ③: 태국 음식(솜탐)을 먹을 것이다.","근거: Sounds good. I'll get it.(좋아. 그걸로 할게.)","함정: Thai food를 먹자는 말이지 Thailand로 가자는 말이 아니다. ②는 ✕"],"why":"두 사람은 태국 음식인 솜탐을 먹기로 한다."}],"dlg":[["G","Let's eat Thai food today.","오늘은 태국 음식을 먹자."],["B","Sure. I want some spicy food.","좋아. 나는 매운 음식이 먹고 싶어."],["G","Why don't you try som tam? It's spicy.","솜탐을 먹어 보는 게 어때? 그건 매워."],["B","Som tam? What's that?","솜탐? 그게 뭐야?"],["G","It's Thai salad.","태국식 샐러드야."],["B","Sounds good. I'll get it.","좋아. 그걸로 할게."]]},{"qs":[{"n":4,"q":"What is the girl doing?","o":["She is ordering food.","She is making a taco.","She is taking an order.","She is eating Mexican food.","She is baking a corn dessert."],"a":0,"ans":"She is ordering food.","evs":[["G: Excuse me. What's that at the top?","실례합니다. 맨 위에 있는 건 뭔가요?"],["G: I see. I'm going to have a taco.","그렇군요. 저는 타코를 먹을게요."]],"ev":["G: Excuse me. What's that at the top?","실례합니다. 맨 위에 있는 건 뭔가요?"],"ow":["정답 ○ — 소녀는 메뉴를 보며 'What's that at the top?'(맨 위에 있는 건 뭔가요?)이라고 묻고 'I'm going to have a taco.'(저는 타코를 먹을게요.)라고 고르므로 음식을 주문하는 중임.","오답 ✕ — 타코를 만드는 사람은 가게 주인이다. 소녀는 'I'm going to have a taco.'(저는 타코를 먹을게요.)라고 고르기만 해서 틀림.","오답 ✕ — 주문을 받는 사람은 가게 주인(M)이다. 소녀는 'What's that at the top?'(맨 위에 있는 건 뭔가요?)이라고 물으며 주문하는 쪽이라 틀림.","오답 ✕ — 소녀는 'I'm going to have a taco.'(저는 타코를 먹을게요.)라며 지금부터 먹을 것을 고르는 중이다. 아직 먹고 있는 것이 아니라서 틀림.","오답 ✕ — 'We bake corn with butter and cheese.'(옥수수를 버터와 치즈와 함께 구워요.)라고 말한 사람은 가게 주인이다. 소녀가 굽는 것이 아니라서 틀림."],"memo":["정답 ①: 소녀는 음식을 주문하고 있다.","근거: I'm going to have a taco.(저는 타코를 먹을게요.)","함정: 만들고(baking) 주문을 받는(taking an order) 쪽은 가게 주인이다. ②③⑤는 ✕"],"why":"소녀가 메뉴를 묻고 타코를 고르는, 음식을 주문하는 상황이다."},{"n":5,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["소녀는 맨 위에 있는 음식이 무엇인지 묻는다.","타코에는 소고기와 채소가 들어 있다.","멕시코식 옥수수 디저트는 버터와 치즈를 넣어 굽는다.","소녀는 멕시코식 옥수수 디저트를 먹기로 한다.","소녀는 맨 아래에 있는 음식에 대해서도 묻는다."],"a":3,"ans":"소녀는 멕시코식 옥수수 디저트를 먹기로 한다.","evs":[["G: I see. I'm going to have a taco.","그렇군요. 저는 타코를 먹을게요."]],"ev":["G: I see. I'm going to have a taco.","그렇군요. 저는 타코를 먹을게요."],"ow":["오답 ✕ — 'What's that at the top?'(맨 위에 있는 건 뭔가요?)이라고 물었으므로 일치하는 내용이다. 불일치를 고르는 문제라 정답이 아님.","오답 ✕ — 'There are beef and vegetables in it.'(안에 소고기와 채소가 들어 있어요.)와 일치한다. 그래서 정답이 아님.","오답 ✕ — 'We bake corn with butter and cheese.'(옥수수를 버터와 치즈와 함께 구워요.)와 일치한다. 그래서 정답이 아님.","정답 ○ — 소녀는 마지막에 'I'm going to have a taco.'(저는 타코를 먹을게요.)라고 했다. 옥수수 디저트가 아니라 타코를 고른 것이므로 일치하지 않음.","오답 ✕ — 'Then what's that at the bottom?'(그럼 맨 아래에 있는 건 뭔가요?)이라고 물었으므로 일치하는 내용이다. 그래서 정답이 아님."],"memo":["정답 ④: 소녀가 고른 것은 옥수수 디저트가 아니라 타코이다.","근거: I'm going to have a taco.(저는 타코를 먹을게요.)","함정: 디저트에 대해 '물어본 것'과 '먹기로 한 것'은 다르다. ④만 ✕"],"why":"소녀는 두 음식에 대해 물어본 뒤 타코를 먹기로 한다."}],"dlg":[["G","Excuse me. What's that at the top?","실례합니다. 맨 위에 있는 건 뭔가요?"],["M","It's a taco. There are beef and vegetables in it.","타코예요. 안에 소고기와 채소가 들어 있어요."],["G","Then what's that at the bottom?","그럼 맨 아래에 있는 건 뭔가요?"],["M","It's a Mexican corn dessert. We bake corn with butter and cheese.","멕시코식 옥수수 디저트예요. 옥수수를 버터와 치즈와 함께 구워요."],["G","I see. I'm going to have a taco.","그렇군요. 저는 타코를 먹을게요."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["딸기 젤라토만 맛있어 보인다.","딸기 젤라토는 정말 부드럽다.","젤라토가 등장한지 300년이 안되었다.","이탈리아에서 젤라토는 별로 인기가 없다.","긴 역사를 가진 젤라토 가게가 없다."],"a":1,"ans":"딸기 젤라토는 정말 부드럽다.","evs":[["They all look delicious.","그것들은 모두 맛있어 보여요."],["Yummy!","맛있어요!"],["It is very creamy.","이것은 정말 부드러워요."],["It first appeared there in the 16th century, and some gelato shops have a long history.","그것은 그곳에 16세기에 처음 등장했고, 몇몇 젤라토 가게들은 긴 역사가 있답니다."]],"ev":["They all look delicious.","그것들은 모두 맛있어 보여요."],"ow":["오답 ✕ — 'They all look delicious.'(그것들은 모두 맛있어 보여요.)라고 했으므로 딸기 젤라토만 맛있어 보이는 것이 아니라 모든 젤라토가 맛있어 보인다. 그래서 틀림.","정답 ○ — 딸기 젤라토를 먹고 'Yummy! It is very creamy.'(맛있어요! 이것은 정말 부드러워요.)라고 했으므로 본문과 일치함.","오답 ✕ — 'It first appeared there in the 16th century'(그것은 그곳에 16세기에 처음 등장했고)라고 했다. 16세기부터면 300년이 훨씬 넘었으므로 300년이 안 되었다는 보기는 틀림.","오답 ✕ — 'Gelato is a very popular dessert there.'(젤라토는 그곳에서 매우 인기 있는 디저트입니다.)라고 했는데, 이 보기는 별로 인기가 없다고 해서 틀림.","오답 ✕ — 'some gelato shops have a long history'(몇몇 젤라토 가게들은 긴 역사가 있답니다)라고 했는데, 이 보기는 긴 역사를 가진 가게가 없다고 해서 틀림."],"memo":["정답 ②: 딸기 젤라토는 정말 부드럽다.","근거: It is very creamy.(이것은 정말 부드러워요.)","함정: ③ 젤라토는 16세기에 등장했으니 300년이 훨씬 넘었다. ✕"],"why":"딸기 젤라토를 먹고 'It is very creamy.'라고 감탄하는 내용이다."}],"pp":[["A gelato truck is over there.","젤라토 트럭이 저기에 있어요."],["There is a long line.","줄이 길어요."],["Let's go there first.","저기에 먼저 가 봐요."],["There are many flavors of gelato.","다양한 맛의 젤라토가 있어요."],["They all look delicious.","그것들은 모두 맛있어 보여요."],["Hmm....","음…."],["This time, I want to try strawberry gelato.","이번에는 딸기 젤라토를 먹어 보고 싶어요."],["Yummy!","맛있어요!"],["It is very creamy.","이것은 정말 부드러워요."],["Italy is the home of gelato.","이탈리아는 젤라토의 본고장입니다."],["Gelato is a very popular dessert there.","젤라토는 그곳에서 매우 인기 있는 디저트입니다."],["It first appeared there in the 16th century, and some gelato shops have a long history.","그것은 그곳에 16세기에 처음 등장했고, 몇몇 젤라토 가게들은 긴 역사가 있답니다."]]},{"qs":[{"n":7,"q":"윗글의 제목으로 알맞은 것은?","o":["Don't Play With Food","The Long History of Dondurma","My Own Way of Eating Dondurma","Dondurma: Turkish Stretchy Ice Cream","Why Does Dondurma Become Stretchy?"],"a":3,"ans":"Dondurma: Turkish Stretchy Ice Cream","evs":[["Dondurma is Turkish ice cream.","돈두르마는 튀르키예 아이스크림입니다."],["It's sticky and stretchy.","이것은 쫀득하고 잘 늘어나요."],["It melts very slowly.","그것은 아주 천천히 녹습니다."]],"ev":["Dondurma is Turkish ice cream.","돈두르마는 튀르키예 아이스크림입니다."],"ow":["오답 ✕ — 'The man is doing the same thing again and again.'(아저씨가 같은 행동을 계속 해요.)처럼 장난치는 모습이 나오지만, 음식을 가지고 놀지 말라는 교훈은 지문에 없다. 글의 중심은 돈두르마 소개라서 틀림.","오답 ✕ — 'some gelato shops var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){

  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';

function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}

function sentHtml(i,lock){

  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});

 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;

  var tot=0,fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
