<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<title>대화문 기출 중2</title>
<meta name="application-name" content="대화문 기출 중2">
<meta name="apple-mobile-web-app-title" content="대화문 기출 중2">
<meta name="theme-color" content="#2F6FD6">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Crect%20width=%22100%22%20height=%22100%22%20rx=%2222%22%20fill=%22%23CFE1FF%22/%3E%3Ctext%20x=%2242%22%20y=%2276%22%20font-size=%2260%22%20text-anchor=%22middle%22%3E%F0%9F%91%A9%3C/text%3E%3Ctext%20x=%2276%22%20y=%2238%22%20font-size=%2226%22%20text-anchor=%22middle%22%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg%20xmlns=%22http://www.w3.org/2000/svg%22%20viewBox=%220%200%20100%20100%22%3E%3Crect%20width=%22100%22%20height=%22100%22%20rx=%2222%22%20fill=%22%23CFE1FF%22/%3E%3Ctext%20x=%2242%22%20y=%2276%22%20font-size=%2260%22%20text-anchor=%22middle%22%3E%F0%9F%91%A9%3C/text%3E%3Ctext%20x=%2276%22%20y=%2238%22%20font-size=%2226%22%20text-anchor=%22middle%22%3E%F0%9F%92%AC%3C/text%3E%3C/svg%3E">
<style>
:root{--bg:#F4F5F2;--sf:#fff;--ink:#1c2420;--soft:#6b766f;--bd:#dde3dd;--ok:#1F7A5C;--okb:#e3f3ec;--no:#C22E1C;--nob:#fbe8e5;--ac:#2F6FD6}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;font-size:17px;line-height:1.5}
#app{max-width:640px;margin:0 auto;padding:14px 14px 40px}
.hd{display:flex;justify-content:space-between;align-items:baseline;margin:2px 2px 10px}
.no{font-weight:800;font-size:15px;color:var(--ac)}
.src{font-size:11.5px;color:#9aa49d}
.ins{font-size:18px;font-weight:700;line-height:1.55;margin:0 2px 12px}
.neg{background:linear-gradient(transparent 38%,#ffe14d 38%);padding:0 2px;border-radius:2px}
.box{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:12px 14px;margin:0 0 12px}
.ln{padding:5px 0}
.ln+.ln{border-top:1px dashed #eceeea}
.sp{font-weight:800;color:#44524a;margin-right:6px}
.ko{display:none;font-size:13px;color:#8b958e;line-height:1.45;margin-top:1px}
.rev .ko{display:block}
.mk{background:transparent}
.rev .mk{background:linear-gradient(transparent 45%,#f6e27a 45%)}
u{text-decoration:underline;text-underline-offset:3px;text-decoration-thickness:2px}
.chs{display:flex;flex-direction:column;gap:9px}
.ch{display:flex;gap:10px;align-items:flex-start;text-align:left;width:100%;background:var(--sf);border:1.5px solid var(--bd);border-radius:14px;padding:12px 14px;font:inherit;color:inherit;cursor:pointer;min-height:52px}
.ch:active{background:#f1f4f1}
.cn{font-weight:800;color:var(--ac);min-width:20px}
.ct{flex:1}
.ct .tg{display:block;font-size:13px;color:#7a847d;margin-top:2px}
.ch.okc{border-color:var(--ok);background:linear-gradient(90deg,var(--okb),#fff)}
.ch[disabled]{opacity:1}
.bn{background:var(--no);color:#fff;border-radius:14px 14px 0 0;padding:10px 14px;font-weight:800;font-size:15px}
.bn small{display:block;font-weight:500;font-size:12.5px;opacity:.9;margin-top:2px}
.bnb{background:var(--nob);border:1.5px solid var(--no);border-top:0;border-radius:0 0 14px 14px;padding:10px 14px;margin:0 0 12px;font-size:16px;font-weight:700}
.bnb .ko{display:block;font-weight:500}
.sh{font-weight:800;font-size:14px;margin:16px 2px 8px;color:#44524a}
.cd{background:var(--sf);border:1.5px solid var(--bd);border-radius:14px;padding:11px 14px;margin:0 0 9px}
.cd.a{border-color:var(--ok);background:linear-gradient(90deg,var(--okb),#fff)}
.cd.w{border-color:var(--no);background:linear-gradient(90deg,var(--nob),#fff)}
.ch2{display:flex;gap:8px;align-items:flex-start}
.ch2 .ct{font-weight:700}
.lb{font-size:12px;font-weight:800;border-radius:10px;padding:2px 8px;white-space:nowrap}
.a .lb{background:var(--ok);color:#fff}
.w .lb{background:var(--no);color:#fff}
.rs{margin-top:8px;padding-left:10px;border-left:3px solid #cdd5ce;font-size:14.5px;line-height:1.6;color:#33403a}
.a .rs{border-left-color:var(--ok)}
.w .rs{border-left-color:var(--no)}
.pit{background:#FFF8C9;border:1.5px solid #F0D96A;border-radius:6px;padding:12px 14px;margin:0 0 12px;box-shadow:0 2px 0 rgba(0,0,0,.05)}
.pit h4{margin:0 0 8px;font-size:14px;color:#7a6500}
.pit .l{padding:4px 0;font-size:16px;font-weight:700}
.pit .l .ko{display:block;font-weight:500;font-size:13.5px;color:#7a7040}
.pit .x{padding:4px 0;font-size:14.5px;color:#4a4520}
.nx{display:block;width:100%;background:var(--ac);color:#fff;border:0;border-radius:14px;padding:15px;font:inherit;font-weight:800;font-size:17px;cursor:pointer;margin:14px 0 0}
.bk{display:block;text-align:center;margin:22px 0 0;padding:14px;border:1.5px solid var(--bd);border-radius:14px;background:var(--sf);color:var(--ink);text-decoration:none;font-weight:700}
.end{text-align:center;padding:40px 10px}
.end b{font-size:20px}
.rs2{display:block;width:100%;margin-top:14px;padding:13px;border-radius:12px;border:1.5px solid var(--bd);background:var(--sf);font:inherit;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app" translate="no">불러오는 중</div>
<script>
(function(){
var GRADE="m2",URL_JSON="/board/gichul_m2.json";
var NUMS=["①","②","③","④","⑤"];
var ls;try{ls=window.localStorage;ls.getItem("x")}catch(e){ls=null}
function lget(k){try{return ls?ls.getItem(k):null}catch(e){return null}}
function lset(k,v){try{if(ls)ls.setItem(k,v)}catch(e){}}
var NAME=lget("bd-name")||"guest";
var KEY="gk-"+GRADE+"|"+NAME;
var st={last:"",wr:[]};
try{var o=JSON.parse(lget(KEY)||"null");if(o&&typeof o==="object"){st.last=o.last||"";st.wr=o.wr||[]}}catch(e){}
function save(){lset(KEY,JSON.stringify(st))}
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function fmt(s,neg){
  var t=esc(s);
  t=t.replace(/\[\[([\s\S]*?)\]\]/g,'<span class="mk">$1</span>');
  t=t.replace(/\{\{([\s\S]*?)\}\}/g,"<u>$1</u>");
  if(neg)t=t.replace(/«([\s\S]*?)»/g,'<span class="neg">$1</span>');
  else t=t.replace(/[«»]/g,"");
  return t.replace(/\n/g,"<br>");
}
function en(s,neg){return '<span lang="en" translate="no">'+fmt(s,neg)+'</span>'}
var Q=[],idx=0,app=document.getElementById("app");
function startIndex(){
  if(!st.last)return 0;
  for(var i=0;i<Q.length;i++){if(Q[i].id===st.last)return i+1}
  return 0;
}
function head(q){
  return '<div class="hd"><span class="no">No. '+(idx+1)+'</span><span class="src">'+esc(q.src||"")+'</span></div>';
}
function dlHtml(q){
  if(!q.dl||!q.dl.length)return "";
  var h='<div class="box">';
  q.dl.forEach(function(l){
    var sp=l[0]?'<span class="sp">'+esc(l[0])+'</span>':"";
    h+='<div class="ln">'+sp+en(l[1])+(l[2]?'<div class="ko">'+fmt(l[2])+'</div>':"")+'</div>';
  });
  return h+'</div>';
}
function choiceText(q,c){
  /* ek=1: 보기 자체가 한글. 아니면 영어 */
  return q.ek?'<span>'+fmt(c[0])+'</span>':en(c[0]);
}
function koOf(q,c){return (!q.ek&&c[1])?'<div class="ko">'+fmt(c[1])+'</div>':""}
function tagOf(c){return c[3]?'<span class="tg">'+esc(c[3])+'</span>':""}
function noteLines(arr){
  var h="";
  (arr||[]).forEach(function(p){
    if(!p)return;
    if(p[0])h+='<div class="l">'+en(p[0])+(p[1]?'<span class="ko" style="display:block">'+fmt(p[1])+'</span>':"")+'</div>';
    else if(p[1])h+='<div class="x">'+fmt(p[1])+'</div>';
  });
  return h;
}
function backBtn(){return '<a class="bk" href="/board/?back=1" target="_top">‹ 목록으로</a>'}
function showQ(){
  window.scrollTo(0,0);
  if(idx>=Q.length){
    app.innerHTML='<div class="end"><b>여기까지 모두 풀었습니다</b></div><button class="rs2" id="again">처음부터</button>'+backBtn();
    document.getElementById("again").onclick=function(){st.last="";save();idx=0;showQ()};
    return;
  }
  var q=Q[idx],h=head(q)+'<div class="ins">'+fmt(q.ins,true)+'</div>'+dlHtml(q)+'<div class="chs">';
  q.ch.forEach(function(c,i){
    h+='<button class="ch" data-i="'+i+'"><span class="cn">'+NUMS[i]+'</span><span class="ct">'+choiceText(q,c)+tagOf(c)+'</span></button>';
  });
  h+='</div>'+backBtn();
  app.innerHTML=h;
  var bs=app.querySelectorAll(".ch");
  for(var k=0;k<bs.length;k++)bs[k].onclick=function(){pick(+this.getAttribute("data-i"),this)};
}
function pick(i,el){
  var q=Q[idx],bs=app.querySelectorAll(".ch");
  for(var k=0;k<bs.length;k++)bs[k].disabled=true;
  if(i+1===q.ans){
    el.className="ch okc";
    st.last=q.id;save();
    setTimeout(function(){idx++;showQ()},700);
  }else{
    if(st.wr.indexOf(q.id)<0)st.wr.push(q.id);
    st.last=q.id;save();
    showWrong(q,i);
  }
}
function showWrong(q,i){
  window.scrollTo(0,0);
  var a=q.ch[q.ans-1];
  var h=head(q);
  h+='<div class="bn">오답<small>정답 '+NUMS[q.ans-1]+'</small></div>';
  h+='<div class="bnb">'+choiceText(q,a)+(!q.ek&&a[1]?'<div class="ko">'+fmt(a[1])+'</div>':"")+'</div>';
  h+='<div class="rev">';
  h+='<div class="ins">'+fmt(q.ins,true)+'</div>'+dlHtml(q);
  h+='<div class="sh">보기 풀이</div>';
  q.ch.forEach(function(c,k){
    var cls=(k+1===q.ans)?"cd a":(k===i?"cd w":"cd"),lb=(k+1===q.ans)?'<span class="lb">정답</span>':(k===i?'<span class="lb">내가 고름</span>':"");
    h+='<div class="'+cls+'"><div class="ch2"><span class="cn">'+NUMS[k]+'</span><span class="ct">'+choiceText(q,c)+tagOf(c)+koOf(q,c)+'</span>'+lb+'</div>'+(c[2]?'<div class="rs">'+fmt(c[2])+'</div>':"")+'</div>';
  });
  var n1=noteLines(q.pn);
  if(n1)h+='<div class="pit"><h4>이것만은 노트에 쓰자 1 · 정답의 근거</h4>'+n1+'</div>';
  var n2=q.wn&&q.wn[i]?noteLines(q.wn[i]):"";
  if(n2)h+='<div class="pit"><h4>이것만은 노트에 쓰자 2 · 내가 고른 답이 틀린 이유</h4>'+n2+'</div>';
  h+='</div>';
  h+='<button class="nx" id="nx">다음 문제</button>'+backBtn();
  app.innerHTML=h;
  document.getElementById("nx").onclick=function(){idx++;showQ()};
}
fetch(URL_JSON,{cache:"no-cache"}).then(function(r){return r.json()}).then(function(d){
  Q=d.questions.filter(function(q){return !q.retired});
  idx=startIndex();
  showQ();
}).catch(function(){app.innerHTML='<div class="end"><b>문제를 불러오지 못했습니다</b></div>'+backBtn()});
})();
</script>
</body>
</html>
