<!doctype html>

<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}

.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}

.gl b{color:var(--ink)}

.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}

.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Hello, everyone! I'm Yuna, and I'm the leader of Warm Hearts, a club at our school.","ko":"안녕하세요, 여러분! 저는 유나이고, 우리 학교 동아리인 '따뜻한 마음'의 회장이에요.","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"Our club has solved some problems in our school and our community over the past few year. I want to share our stories.","ko":"우리 동아리는 지난 몇 년간 우리 학교 및 지역사회의 몇몇 문제를 해결해 왔어요. 저는 우리의 이야기를 여러분과 나누고 싶어요.","ok":false,"foot":[],"fixes":[{"wrong":"year","right":"years","partial":false,"at":[16],"point":"명사의 복수형: few 뒤에는 복수명사 years 사용","topic":"명사의 복수형","memo":"few 뒤에는 복수명사 years 사용"}]},{"n":3,"tag":null,"en":"One day, our school principal announced, \"Our students often takes too much food and waste it at lunchtime.","ko":"어느 날 교장선생님이 \"점심시간에 학생들이 종종 음식을 너무 많이 가져가서 버립니다.","ok":false,"foot":[],"fixes":[{"wrong":"takes","right":"take","partial":false,"at":[9],"point":"주어와 동사의 수일치: 주어 students(복수)는 동사원형: take (takes 아님)","topic":"주어와 동사의 수일치","memo":"주어 students(복수)는 동사원형: take (takes 아님)"}]},{"n":4,"tag":null,"en":"How can we reduce food waste?\"","ko":"어떻게 음식물 쓰레기를 줄일 수 있을까요?\"라고 말씀하셨어요.","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"The members of Warm Hearts gathered to solve these problem. We thought that adding lines to food trays would be helpfully.","ko":"'따뜻한 마음'의 회원들은 이 문제를 해결하기 위해 모였어요. 우리는 식판에 선을 표시하는 것이 도움이 될 거라 생각했어요.","ok":false,"foot":[],"fixes":[{"wrong":"these","right":"this","partial":false,"at":[8],"point":"지시형용사: 단수명사 problem 앞에는 this 사용","topic":"지시형용사","memo":"단수명사 problem 앞에는 this 사용"},{"wrong":"helpfully","right":"helpful","partial":false,"at":[20],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 helpful 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 helpful 사용"}]},{"n":6,"tag":null,"en":"Students could look at the lines and take the right amount of food.","ko":"학생들이 선을 보고 적당한 양의 음식을 가져갈 수 있죠.","ok":true,"foot":[],"fixes":[]},{"n":7,"tag":null,"en":"Our school principal liked this idea, so he change the food trays in the cafeteria. It was a success!","ko":"교장선생님은 이 생각을 마음에 들어 하셨고, 구내식당의 식판을 교체하셨어요. 그건 성공적이었죠!","ok":false,"foot":[],"fixes":[{"wrong":"change","right":"changed","partial":false,"at":[8],"point":"과거시제: 과거 사실이므로 changed 사용","topic":"과거시제","memo":"과거 사실이므로 changed 사용"}]},{"n":8,"tag":null,"en":"The new trays reduced a large number of food waste!","ko":"새 식판은 많은 양의 음식물 쓰레기를 줄였어요!","ok":false,"foot":[],"fixes":[{"wrong":"number","right":"amount","partial":false,"at":[6],"point":"수량 형용사: food waste(셀 수 없음)에는 amount of 사용","topic":"수량 형용사","memo":"food waste(셀 수 없음)에는 amount of 사용"}]},{"n":9,"tag":null,"en":"After we solved this problems at our school, we started look for problems in our community.","ko":"우리 학교의 이 문제를 해결한 뒤 우리는 우리 지역사회의 문제를 찾아보기 시작했어요.","ok":false,"foot":[],"fixes":[{"wrong":"problems","right":"problem","partial":false,"at":[4],"point":"명사의 복수형: this 뒤에는 단수명사 problem 사용","topic":"명사의 복수형","memo":"this 뒤에는 단수명사 problem 사용"},{"wrong":"look","right":"to look","partial":false,"at":[10],"point":"to부정사의 명사적 용법: started 뒤에는 to look 사용","topic":"to부정사의 명사적 용법","memo":"started 뒤에는 to look 사용","alt":[9]}]},{"n":10,"tag":null,"en":"We found out that some roads around our school was very dark at night. We all agreed that the roads needed much lights.","ko":"우리는 우리 학교 주위의 일부 도로가 밤에 무척 어둡다는 걸 발견했어요. 우리는 모두 도로에 등이 더 필요하다고 동의했어요.","ok":false,"foot":[],"fixes":[{"wrong":"was","right":"were","partial":false,"at":[9],"point":"be동사 수일치: 주어 roads(복수)는 were (was 아님)","topic":"be동사 수일치","memo":"주어 roads(복수)는 were (was 아님)"},{"wrong":"much","right":"more","partial":false,"at":[21],"point":"수량 형용사: 셀 수 있는 lights 앞에는 more 사용","topic":"수량 형용사","memo":"셀 수 있는 lights 앞에는 more 사용"}]},{"n":11,"tag":null,"en":"With the help of a teacher, we putted up lights with sensors around the neighborhood. Now all our neighbors feel more safer than before!","ko":"한 선생님의 도움을 받아 우리는 인근에 센서가 있는 등을 설치했어요. 이제 모든 우리의 이웃들이 예전보다 더 안전하다고 느껴요!","ok":false,"foot":[],"fixes":[{"wrong":"putted","right":"put","partial":false,"at":[7],"point":"불규칙 과거형: put의 과거형은 put (putted 아님)","topic":"불규칙 과거형","memo":"put의 과거형은 put (putted 아님)"},{"wrong":"more safer","right":"safer","partial":false,"at":[20],"point":"비교급: safer가 이미 비교급이므로 more 불필요","topic":"비교급","memo":"safer가 이미 비교급이므로 more 불필요"}]},{"n":12,"tag":null,"en":"Have you ever used a digital kiosk before? You may think it's easy.","ko":"여러분은 디지털 키오스크를 써 본 적이 있나요? 여러분은 그게 쉽다고 생각할 거예요.","ok":true,"foot":[],"fixes":[]},{"n":13,"tag":null,"en":"But some people has trouble using kiosks.","ko":"하지만 어떤 사람들은 키오스크를 사용하는 데 어려움을 겪어요.","ok":false,"foot":[],"fixes":[{"wrong":"has","right":"have","partial":false,"at":[3],"point":"주어와 동사의 수일치: 복수 주어 people에는 have 사용","topic":"주어와 동사의 수일치","memo":"복수 주어 people에는 have 사용"}]},{"n":14,"tag":null,"en":"To help they, we volunteered as digital guides at the community center.","ko":"그런 사람들을 돕기 위해 우리는 주민센터에서 디지털 가이드로 자원봉사를 했어요.","ok":false,"foot":[],"fixes":[{"wrong":"they","right":"them","partial":false,"at":[2],"point":"인칭대명사의 목적격: help 뒤 목적어 자리에는 them 사용","topic":"인칭대명사의 목적격","memo":"help 뒤 목적어 자리에는 them 사용"}]},{"n":15,"tag":null,"en":"We explained every steps of ordering: starting a order, choosing from the menu, and paying.","ko":"우리는 주문을 시작하고, 메뉴에서 고르고, 결제하는 모든 주문 절차를 설명했어요.","ok":false,"foot":[],"fixes":[{"wrong":"steps","right":"step","partial":false,"at":[3],"point":"명사의 복수형: every 뒤에는 단수명사 step 사용","topic":"명사의 복수형","memo":"every 뒤에는 단수명사 step 사용"},{"wrong":"a","right":"an","partial":false,"at":[7],"point":"관사 a/an: order는 모음 소리이므로 an 사용","topic":"관사 a/an","memo":"order는 모음 소리이므로 an 사용"}]},{"n":16,"tag":null,"en":"After the class, people said, \"Now we feel more comfortable with kiosks. Thank you so much!\"","ko":"수업이 끝나고 사람들은 \"이제 우리는 키오스크가 좀 더 편하게 느껴져요. 정말 고마워요!\"라고 말했어요.","ok":true,"foot":[],"fixes":[]},{"n":17,"tag":null,"en":"We felt very proudly.","ko":"우리는 정말 뿌듯했어요.","ok":false,"foot":[],"fixes":[{"wrong":"proudly","right":"proud","partial":false,"at":[3],"point":"형용사와 부사: felt 뒤 보어 자리에는 형용사 prou ry dark at night.","우리는 우리 학교 주위의 일부 도로가 밤에 무척 어둡다는 걸 발견했어요.",0],["We all agreed that the roads needed more lights.","우리는 모두 도로에 등이 더 필요하다고 동의했어요.",0],["With the help of a teacher, we put up lights with sensors around the neighborhood.","한 선생님의 도움을 받아 우리는 인근에 센서가 있는 등을 설치했어요.",0],["Now all our neighbors feel safer than before!","이제 모든 우리의 이웃들이 예전보다 더 안전하다고 느껴요!",0],["Have you ever used a digital kiosk before?","여러분은 디지털 키오스크를 써 본 적이 있나요?",1],["You may think it's easy.","여러분은 그게 쉽다고 생각할 거예요.",0],["But some people have trouble using kiosks.","하지만 어떤 사람들은 키오스크를 사용하는 데 어려움을 겪어요.",0],["To help them, we volunteered as digital guides at the community center.","그런 사람들을 돕기 위해 우리는 주민센터에서 디지털 가이드로 자원봉사를 했어요.",1],["We explained every step of ordering: starting an order, choosing from the menu, and paying.","우리는 주문을 시작하고, 메뉴에서 고르고, 결제하는 모든 주문 절차를 설명했어요.",0],["After the class, people said, \"Now we feel more comfortable with kiosks.","수업이 끝나고 사람들은 \"이제 우리는 키오스크가 좀 더 편하게 느껴져요.",1],["Thank you so much!\"","정말 고마워요!\"라고 말했어요.",0],["We felt very proud.","우리는 정말 뿌듯했어요.",0],["As you can see, your actions can make positive changes.","이렇듯 여러분의 행동은 긍정적인 변화를 만들 수 있어요.",1],["Even the smallest acts can make a big difference!","가장 작은 행위일지라도 큰 차이를 만들 수 있어요!",0]];var RNUM=11;var TITLE_EN="Warm Hearts for Our Community";var PASS_EN=["Warm Hearts for Our Community","Hello, everyone! I'm Yuna, and I'm the leader of Warm Hearts, a club at our school. Our club has solved some problems in our school and our community over the past few years. I want to share our stories.","One day, our school principal announced, \"Our students often take too much food and waste it at lunchtime. How can we reduce food waste?\"","The members of Warm Hearts gathered to solve this problem. We thought that adding lines to food trays would be helpful. Students could look at the lines and take the right amount of food.","Our school principal liked this idea, so he changed the food trays in the cafeteria. It was a success! The new trays reduced a large amount of food waste!","After we solved this problem at our school, we started to look for problems in our community. We found out that some roads around our school were very dark at night. We all agreed that the roads needed more lights. With the help of a teacher, we put up lights with sensors around the neighborhood. Now all our neighbors feel safer than before!","Have you ever used a digital kiosk before? You may think it's easy. But some people have trouble using kiosks.","To help them, we volunteered as digital guides at the community center. We explained every step of ordering: starting an order, choosing from the menu, and paying.","After the class, people said, \"Now we feel more comfortable with kiosks. Thank you so much!\" We felt very proud.","As you can see, your actions can make positive changes. Even the smallest acts can make a big difference!"];var PASS_KO=["우리 지역사회를 위한 따뜻한 마음","안녕하세요, 여러분! 저는 유나이고, 우리 학교 동아리인 '따뜻한 마음'의 회장이에요. 우리 동아리는 지난 몇 년간 우리 학교 및 지역사회의 몇몇 문제를 해결해 왔어요. 저는 우리의 이야기를 여러분과 나누고 싶어요.","어느 날 교장선생님이 \"점심시간에 학생들이 종종 음식을 너무 많이 가져가서 버립니다. 어떻게 음식물 쓰레기를 줄일 수 있을까요?\"라고 말씀하셨어요.","'따뜻한 마음'의 회원들은 이 문제를 해결하기 위해 모였어요. 우리는 식판에 선을 표시하는 것이 도움이 될 거라 생각했어요. 학생들이 선을 보고 적당한 양의 음식을 가져갈 수 있죠.","교장선생님은 이 생각을 마음에 들어 하셨고, 구내식당의 식판을 교체하셨어요. 그건 성공적이었죠! 새 식판은 많은 양의 음식물 쓰레기를 줄였어요!","우리 학교의 이 문제를 해결한 뒤 우리는 우리 지역사회의 문제를 찾아보기 시작했어요. 우리는 우리 학교 주위의 일부 도로가 밤에 무척 어둡다는 걸 발견했어요. 우리는 모두 도로에 등이 더 필요하다고 동의했어요. 한 선생님의 도움을 받아 우리는 인근에 센서가 있는 등을 설치했어요. 이제 모든 우리의 이웃들이 예전보다 더 안전하다고 느껴요!","여러분은 디지털 키오스크를 써 본 적이 있나요? 여러분은 그게 쉽다고 생각할 거예요. 하지만 어떤 사람들은 키오스크를 사용하는 데 어려움을 겪어요.","그런 사람들을 돕기 위해 우리는 주민센터에서 디지털 가이드로 자원봉사를 했어요. 우리는 주문을 시작하고, 메뉴에서 고르고, 결제하는 모든 주문 절차를 설명했어요.","수업이 끝나고 사람들은 \"이제 우리는 키오스크가 좀 더 편하게 느껴져요. 정말 고마워요!\"라고 말했어요. 우리는 정말 뿌듯했어요.","이렇듯 여러분의 행동은 긍정적인 변화를 만들 수 있어요. 가장 작은 행위일지라도 큰 차이를 만들 수 있어요!"];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Putting up a poster is difficult for Soye.","Ben helps Soye by holding the poster.","Soye says thank you to Ben for helping her.","The Community Cleanup is a volunteer activity to clean the neighborhood.","The Community Cleanup welcomes people with special skills."],"a":4,"ans":"The Community Cleanup welcomes people with special skills.","evs":[["G: It's a volunteer activity. People sweep the streets and pick up trash to make our neighborhood clean.","자원봉사 활동이야. 사람들이 우리 동네를 깨끗하게 만들기 위해 거리를 쓸고 쓰레기를 주워."],["G: Of course! It is open to everyone.","물론이지! 누구에게나 열려 있어."]],"ev":["G: It's a volunteer activity. People sweep the streets and pick up trash to make our neighborhood clean.","자원봉사 활동이야. 사람들이 우리 동네를 깨끗하게 만들기 위해 거리를 쓸고 쓰레기를 주워."],"ow":["오답 ✕ — 소예가 'I'm trying to put up a poster, but it's not easy.'(포스터를 붙이려고 하는데 쉽지 않아.)라고 했으므로 포스터를 붙이는 일이 어렵다는 것은 일치한다. 그래서 정답이 아님.","오답 ✕ — 벤이 'I can hold it for you.'(내가 대신 잡아 줄 수 있어.)라고 했으므로 포스터를 잡아 주며 돕는 것은 일치한다. 그래서 정답이 아님.","오답 ✕ — 소예가 'Thank you for lending a hand.'(도와줘서 고마워.)라고 했으므로 일치한다. 그래서 정답이 아님.","오답 ✕ — 'It's a volunteer activity.'(자원봉사 활동이야.)와 'to make our neighborhood clean'(우리 동네를 깨끗하게 만들기 위해)과 일치한다. 그래서 정답이 아님.","정답 ○ — 소예는 'It is open to everyone.'(누구에게나 열려 있어.)라고 했다. 특별한 기술이 있는 사람만 환영하는 것이 아니므로 일치하지 않음."],"memo":["정답 ⑤: 지역 대청소는 특별한 기술이 있는 사람만 환영하지 않는다(불일치 보기).","근거: It is open to everyone.(누구에게나 열려 있어.)","함정: open to everyone(모두에게 열려 있음)을 '특별한 기술이 필요함'으로 바꾼 보기라 ⑤만 ✕"],"why":"지역 대청소는 특별한 기술이 필요한 활동이 아니라 누구에게나 열려 있다."},{"n":2,"q":"Community Cleanup에 대한 설명으로 알맞은 것은?","o":["특별한 기술이 있는 사람만 참여할 수 있다.","학교 안을 청소하는 시험 준비 활동이다.","벽에 그림을 그리는 미술 활동이다.","사람들이 거리를 쓸고 쓰레기를 줍는 자원봉사 활동이다.","참가하려면 참가비를 내야 한다."],"a":3,"ans":"사람들이 거리를 쓸고 쓰레기를 줍는 자원봉사 활동이다.","evs":[["G: It's a volunteer activity. People sweep the streets and pick up trash to make our neighborhood clean.","자원봉사 활동이야. 사람들이 우리 동네를 깨끗하게 만들기 위해 거리를 쓸고 쓰레기를 주워."]],"ev":["G: It's a volunteer activity. People sweep the streets and pick up trash to make our neighborhood clean.","자원봉사 활동이야. 사람들이 우리 동네를 깨끗하게 만들기 위해 거리를 쓸고 쓰레기를 주워."],"ow":["오답 ✕ — 소예가 'It is open to everyone.'(누구에게나 열려 있어.)라고 했는데, 이 보기는 기술이 있는 사람만 참여한다고 해서 틀림.","오답 ✕ — 'to make our neighborhood clean'(우리 동네를 깨끗하게 만들기 위해)이라고 했으므로 학교 안이 아니라 동네를 청소하는 활동이다. 시험 준비라는 말도 지문에 없음.","오답 ✕ — 'People sweep the streets and pick up trash'(사람들이 거리를 쓸고 쓰레기를 주워)라고 했다. 벽에 그림을 그린다는 말은 지문에 없어서 틀림.","정답 ○ — 'It's a volunteer activity. People sweep the streets and pick up trash'(자원봉사 활동이야. 사람들이 거리를 쓸고 쓰레기를 주워.)와 일치함.","오답 ✕ — 참가비에 대한 언급은 지문에 없다. 가장 가까운 문장은 'It is open to everyone.'(누구에게나 열려 있어.)이다."],"memo":["정답 ④: 거리를 쓸고 쓰레기를 줍는 자원봉사 활동","근거: People sweep the streets and pick up trash.(사람들이 거리를 쓸고 쓰레기를 주워.)","함정: 청소하는 곳은 학교가 아니라 동네(neighborhood). ②는 ✕"],"why":"지역 대청소는 동네를 깨끗하게 하려고 거리를 쓸고 쓰레기를 줍는 자원봉사이다."}],"dlg":[["B","Good morning, Soye! What are you doing?","좋은 아침이야, 소예야! 뭐 하고 있니?"],["G","Hi, Ben. I'm trying to put up a poster, but it's not easy.","안녕, 벤. 포스터를 붙이려고 하는데 쉽지 않아."],["B","Can I help you? I can hold it for you.","도와줄까? 내가 대신 잡아 줄 수 있어."],["G","Sure! Thank you for lending a hand.","좋아! 도와줘서 고마워."],["B","You're welcome. What is this poster for?","천만에. 이 포스터는 무엇을 위한 거니?"],["G","It's for the Community Cleanup.","지역 대청소를 위한 거야."],["B","What is the Community Cleanup?","지역 대청소가 뭐니?"],["G","It's a volunteer activity. People sweep the streets and pick up trash to make our neighborhood clean.","자원봉사 활동이야. 사람들이 우리 동네를 깨끗하게 만들기 위해 거리를 쓸고 쓰레기를 주워."],["B","That's a good idea! Can I join?","좋은 생각이다! 나도 참여해도 될까?"],["G","Of course! It is open to everyone.","물론이지! 누구에게나 열려 있어."]]},{"qs":[{"n":3,"q":"위 대화의 주제로 알맞은 것은?","o":["how to adopt a dog","various volunteer activities","tips for raising puppies well","volunteering at an animal shelter","choosing the right volunteer work"],"a":3,"ans":"volunteering at an animal shelter","evs":[["B: Yes. I'm here to volunteer.","네. 저는 자원봉사를 하러 왔어요."],["W: While we clean the cage, take these puppies for a walk, please.","저희가 우리를 청소하는 동안 이 강아지들을 산책시켜 주세요."]],"ev":["B: Yes. I'm here to volunteer.","네. 저는 자원봉사를 하러 왔어요."],"ow":["오답 ✕ — 개를 입양하는 방법은 지문에 없다. 'I'm here I'm Jinho. I love dogs, so I want to take care of them.","저는 진호예요. 저는 개를 정말 좋아해서 그들을 돌보고 싶어요."],["W","That's great! I'll introduce our puppies first.","잘됐네요! 먼저 저희 강아지들을 소개해 드릴게요."],["B","They're so cute. What should I do to help?","정말 귀엽네요. 도우려면 제가 무엇을 해야 하나요?"],["W","While we clean the cage, take these puppies for a walk, please.","저희가 우리를 청소하는 동안 이 강아지들을 산책시켜 주세요."],["B","Okay. I'm happy to spend some time with them!","알겠어요. 강아지들과 시간을 보낼 수 있어서 기뻐요!"],["W","I'm glad. Thank you for volunteering!","저도 기뻐요. 자원봉사 해 주셔서 감사합니다!"]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["Lee 선생님은 지훈이의 도움을 거절한다.","Lee 선생님의 양손은 비어 있다.","지훈이는 문을 열어 주고 책을 들어 준다.","지훈이는 Lee 선생님의 책을 모두 읽었다.","Lee 선생님은 더 도와줄 일이 있다고 말한다."],"a":2,"ans":"지훈이는 문을 열어 주고 책을 들어 준다.","evs":[["B: No problem. I can also carry the books for you.","그럼요. 책도 들어 드릴 수 있어요."],["W: That's it. Thank you so much for helping me.","그게 다야. 도와줘서 정말 고마워."]],"ev":["B: No problem. I can also carry the books for you.","그럼요. 책도 들어 드릴 수 있어요."],"ow":["오답 ✕ — Lee 선생님이 'Yes, please.'(응, 부탁할게.)라고 했으므로 도움을 받아들였다. 거절한 것이 아니라서 틀림.","오답 ✕ — 지훈이가 'Your hands are full.'(양손이 가득 차 있으시네요.)라고 했으므로 양손이 비어 있다는 보기는 틀림.","정답 ○ — Lee 선생님이 'Can you open the door for me?'(문 좀 열어 줄래?)라고 하자 지훈이가 'No problem. I can also carry the books for you.'(그럼요. 책도 들어 드릴 수 있어요.)라고 했으므로 일치함.","오답 ✕ — 지훈이는 책을 '들어 주겠다'고 했을 뿐 읽었다는 말은 지문에 없다. 'carry the books'(책을 들어 주다)가 가장 가까운 문장이다.","오답 ✕ — 지훈이가 'Is there anything else?'(다른 도울 일이 있나요?)라고 묻자 Lee 선생님은 'That's it.'(그게 다야.)이라고 했다. 더 도울 일이 없다는 뜻이라 틀림."],"memo":["정답 ③: 지훈이는 문을 열어 주고 책을 들어 준다.","근거: No problem. I can also carry the books for you.(그럼요. 책도 들어 드릴 수 있어요.)","함정: carry(들다)를 read(읽다)로 바꾼 ④, That's it(그게 다야)을 바꾼 ⑤는 ✕"],"why":"지훈이는 양손이 가득 찬 Lee 선생님을 위해 문을 열고 책을 들어 준다."}],"dlg":[["B","Hello, Ms. Lee. Can I help you? Your hands are full.","안녕하세요, Lee 선생님. 도와드릴까요? 양손이 가득 차 있으시네요."],["W","Oh, hi, Jihun. Yes, please. Can you open the door for me?","어, 안녕, 지훈아. 응, 부탁할게. 문 좀 열어 줄래?"],["B","No problem. I can also carry the books for you.","그럼요. 책도 들어 드릴 수 있어요."],["W","Thank you! Please put them over there.","고마워! 저기에 놓아 주렴."],["B","Okay. Is there anything else?","네. 다른 도울 일이 있나요?"],["W","That's it. Thank you so much for helping me.","그게 다야. 도와줘서 정말 고마워."],["B","You're welcome. Have a nice day, Ms. Lee!","천만에요. 좋은 하루 보내세요, Lee 선생님!"]]}];var BG=[{"qs":[{"n":6,"q":"다음 글의 내용과 일치하지 않는 것은?","o":["교장선생님이 점심시간에 남는 많은 음식물 쓰레기를 걱정했다.","'따뜻한 마음' 회원들은 식판에 선을 표시하는 아이디어를 제안했다.","학생들은 식판의 선 때문에 더 많은 음식을 먹을 수 있다.","교장선생님은 선이 표시된 식판으로 구내식당의 식판을 교체했다.","새 식판은 많은 양의 음식물 쓰레기를 줄였다."],"a":2,"ans":"학생들은 식판의 선 때문에 더 많은 음식을 먹을 수 있다.","evs":[["Students could look at the lines and take the right amount of food.","학생들이 선을 보고 적당한 양의 음식을 가져갈 수 있죠."],["The new trays reduced a large amount of food waste!","새 식판은 많은 양의 음식물 쓰레기를 줄였어요!"]],"ev":["Students could look at the lines and take the right amount of food.","학생들이 선을 보고 적당한 양의 음식을 가져갈 수 있죠."],"ow":["오답 ✕ — 'Our students often take too much food and waste it at lunchtime.'(점심시간에 학생들이 종종 음식을 너무 많이 가져가서 버립니다.)라며 교장선생님이 음식물 쓰레기를 걱정했으므로 일치한다. 그래서 정답이 아님.","오답 ✕ — 'We thought that adding lines to food trays would be helpful.'(우리는 식판에 선을 표시하는 것이 도움이 될 거라 생각했어요.)와 일치한다. 그래서 정답이 아님.","정답 ○ — 선은 'take the right amount of food'(적당한 양의 음식을 가져가도록)하려는 것이다. 더 많은 음식을 먹게 하려는 것이 아니므로 일치하지 않음.","오답 ✕ — 'he changed the food trays in the cafeteria'(구내식당의 식판을 교체하셨어요)와 일치한다. 그래서 정답이 아님.","오답 ✕ — 'The new trays reduced a large amount of food waste!'(새 식판은 많은 양의 음식물 쓰레기를 줄였어요!)와 일치한다. 그래서 정답이 아님."],"memo":["정답 ③: 선은 더 많이 먹게 하려는 것이 아니라 적당한 양을 가져가게 하려는 것이다(불일치 보기).","근거: take the right amount of food(적당한 양의 음식을 가져가다)","함정: right amount(적당한 양)를 more food(더 많은 음식)로 바꾼 보기라 ③만 ✕"],"why":"식판의 선은 적당한 양을 가져가게 해서 음식물 쓰레기를 줄이려는 것이다."},{"n":7,"q":"교장선생님이 구내식당의 식판을 교체한 이유로 알맞은 것은?","o":["학생들이 식판을 자주 잃어버려서","식판이 너무 낡아서","점심시간을 줄이고 싶어서","동아리 회원들이 부탁해서","식판에 선을 표시하는 아이디어가 마음에 들어서"],"a":4,"ans":"식판에 선을 표시하는 아이디어가 마음에 들어서","evs":[["Our school principal liked this idea, so he changed the food trays in the cafeteria.","교장선생님은 이 생각을 마음에 들어 하셨고, 구내식당의 식판을 교체하셨어요."],["We thought that adding lines to food trays would be helpful.","우리는 식판에 선을 표시하는 것이 도움이 될 거라 생각했어요."]],"ev":["Our school principal liked this idea, so he changed the food trays in the cafeteria.","교장선생님은 이 생각을 마음에 들어 하셨고, 구내식당의 식판을 교체하셨어요."],"ow":["오답 ✕ — 식판을 잃어버린다는 말은 지문에 없다. 문제는 'take too much food and waste it'(음식을 너무 많이 가져가서 버리는 것)이었다.","오답 ✕ — 식판이 낡았다는 말은 지문에 없다. 교체한 이유는 'liked this idea'(이 생각을 마음에 들어 하셨고)이다.","오답 ✕ — 점심시간을 줄이려 했다는 말은 지문에 없다. 목적은 'reduce food waste'(음식물 쓰레기를 줄이기)였다.","오답 ✕ — 회원들은 아이디어를 제안했을 뿐이고, 교체는 교장선생님이 'liked this idea'(이 생각을 마음에 들어 하셔서) 한 것이다. 부탁했다는 말은 지문에 없음.","정답 ○ — 'Our school principal liked this idea, so he changed the food trays'(교장선생님은 이 생각을 마음에 들어 하셨고, 식판을 교체하셨어요)에서 this idea는 식판에 선을 표시하는 것이므로 맞음."],"memo":["정답 ⑤: 식판에 선을 표시하는 아이디어가 마음에 들어서","근거: Our school principal liked this idea, so he changed the food trays.(교장선생님은 이 생각을 마음에 들어 하셔서 식판을 교체했어요.)","함정: 지문에 이유로 나오지 않은 식판 분실·낡음·점심시간 단축은 ✕"],"why":"교장선생님은 식판에 선을 표시하자는 아이디어가 마음에 들어 식판을 교체했다."}],"pp":[["One day, our school principal announced, \"Our students often take too much food and waste it at lunchtime.","어느 날 교장선생님이 \"점심시간에 학생들이 종종 음식을 너무 많이 가져가서 버립니다."],["How can we reduce food waste?\"","어떻게 음식물 쓰레기를 줄일 수 있을까요?\"라고 말씀하셨어요."],["The members of Warm Hearts gathered to solve this problem.","'따뜻한 마음'의 회원들은 이 문제를 해결하기 위해 모였어요."],["We thought that adding lines to food trays would be helpful.","우리는 식판에 선을 표시하는 것이 도움이 될 거라 생각했어요."],["Students could look at the lines and take the right amount of food.","학생들이 선을 보고 적당한 양의 음식을 가져갈 수 있죠."],["Our school principal liked this idea, so he changed the food trays in the cafeteria.","교장선생님은 이 생각을 마음에 들어 하셨고, 구내식당의 식판을 교체하셨어요."],["It was a success!","그건 성공적이었죠!"],["The new trays reduced a large amount of food waste!","새 식판은 많은 양의 음식물 쓰레기를 줄였어요!"]]},{"qs":[{"n":8,"q":"윗글의 제목으로 알맞은 것은?","o":["Making a Better School","The Danger of Old Roads","Solving Problems at School","Our Solution for Dark Roads","Examining Community Problems"],"a":3,"ans":"Our Solution for Dark Roads","evs":[["We found out that some roads around our school were very dark at night.","우리는 우리 학교 주위의 일부 도로가 밤에 무척 어둡다는 걸 발견했어요."],["With the help of a teacher, we put up lights with sensors around the neighborhood.","한 선생님의 도움을 받아 우리는 인근에 센서가 있는 등을 설치했어요."],["Now all our neighbors feel safer than before!","이제 모든 우리의 이웃들이 예전보다 더 안전하다고 느껴요!"]],"ev":["We found out that some roads around our school were very dark at night.","우리는 우리 학교 주위의 일부 도로가 밤에 무척 어둡다는 걸 발견했어요."],"ow":["오답 ✕ — 지문은 학교가 아니라 지역사회의 도로 문제를 다룬다. 'we started to look for problems in our community'(우리는 우리 지역사회의 문제를 찾아보기 시작했어요)라고 했으므로 틀림.","오답 ✕ — 도로가 오래되어서 위험하다는 말은 지문에 없다. 문제는 'very dark at night'(밤에 무척 어두운 것)이었고, 위험을 말하기보다 해결 이야기가 중심이라 틀림.","오답 ✕ — 학교 문제는 앞 단락(식판)에서 해결했다. 이 글은 'After we solved this problem at our school'(우리 학교의 이 문제를 해결한 뒤) 지역사회로 넘어간 내용이라 틀림.","정답 ○ — 어두운 도로를 발견하고 'we put up lights with sensors'(센서가 있는 등을 설치했어요)로 해결해 'safer than before'(예전보다 더 안전)해졌으므로 어두운 도로의 해결책이라는 제목이 알맞음.","오답 ✕ — 지역사회 문제를 찾아본 과정은 나오지만 하나(어두운 도로)를 찾아 해결한 이야기가 중심이다. 문제를 살펴보기만 하는 제목은 해결 내용이 빠져 틀림."],"memo":["정답 ④: Our Solution for Dark Roads","근거: we put up lights with sensors around the neighborhood.(인근에 센서가 있는 등을 설치했어요.)","함정: 학교 문제는 앞 단락 내용. 이 글은 지역사회의 어두운 도로와 해결책이다. ①③은 ✕"],"why":"밤에 어두운 도로 문제를 센서 등으로 해결한 이야기이다."}],"pp":[["After we solved this problem at our school, we started to look for problems in our community.","우리 학교의 이 문제를 해결한 뒤 우리는 우리 지역사회의 문제를 찾아보기 시작했어요."],["We found out that some roads around our school were very dark at night.","우리는 우리 학교 주위의 일부 도로가 밤에 무척 어둡다는 걸 발견했어요."],["We all agreed that the roads needed more lights.","우리는 모두 도로에 등이 더 필요하다고 동의했어요."],["With the help of a teacher, we put up lights with sensors around the neighborhood.","한 선생님의 도움을 받아 우리는 인근에 센서가 있는 등을 설치했어요."],["Now all our neighbors feel safer than before!","이제 모든 우리의 이웃들이 예전보다 더 안전하다고 느껴요!"]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["모든 사람이 키오스크 사용을 쉽다고 생각한다.","'
