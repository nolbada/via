usic, but they live in different times. Jihun lives in 1995, and Minjun lives in the present. Let's look at their lives.","It is morning. Ring, ring, ring! The alarm clock is going off. Jihun gets up. He looks out the window and checks the weather. It is raining. He puts his books and lunchbox in his backpack and grabs his umbrella. As he leaves, he says, \"Ugh! My backpack is so heavy!\"","Loud hip-hop music is coming from Minjun's smartphone. Minjun wakes up. He asks AI Joe, \"Hey Joe, what's the weather like today?\" \"It's sunny,\" says Joe. Then, Minjun gets ready for school. He simply picks up his tablet.","Jihun is waiting for the bus. There are many coins in his pocket. He takes out 200 won and gets on the bus. Lucky him! There is an empty seat on the bus. Jihun sits down and reads his comic book.","Minjun is taking the bus. He is holding a bus card in his hand. There are many people on the bus. There is no seat for him, but that is okay. He reads his favorite webtoon on his smartphone."];var PASS_KO=["그때 그리고 지금","지훈이와 민준이를 만나 보세요. 그들은 열두 살이에요. 그들은 둘 다 만화와 음악을 정말 좋아하지만, 다른 시대에 살고 있어요. 지훈이는 1995년에 살고, 민준이는 현재에 살고 있어요. 그들의 생활을 살펴봅시다.","아침이에요. 따릉, 따릉, 따르릉! 자명종이 울리고 있어요. 지훈이가 일어나요. 그는 창밖을 내다보고 날씨를 확인해요. 비가 오고 있어요. 그는 책과 도시락을 책가방에 넣고 우산을 집어 들어요. 그는 출발하면서 \"윽! 책가방이 정말 무거워!\"라고 말해요.","요란한 힙합 음악이 민준이의 스마트폰에서 나오고 있어요. 민준이가 잠에서 깨요. 그는 AI Joe에게 \"이봐 Joe, 오늘 날씨가 어때?\"라고 물어요. \"화창해요.\"라고 Joe가 말해요. 그러고 나서, 민준이는 학교에 갈 준비를 해요. 그는 그냥 간단히 태블릿을 집어 들어요.","지훈이는 버스를 기다리고 있어요. 그의 주머니에는 동전이 많이 있어요. 그는 이백 원을 꺼내 버스에 타요. 그는 운이 좋아요! 버스에 빈자리가 있네요. 지훈이는 앉아서 그의 만화책을 읽어요.","민준이는 버스에 타고 있어요. 그는 손에 버스 카드를 쥐고 있어요. 버스에는 사람들이 많이 있어요. 그가 앉을 자리는 없지만, 괜찮아요. 그는 스마트폰으로 자신이 가장 좋아하는 웹툰을 읽어요."];var DG=[{"qs":[{"n":1,"q":"What is the boy doing now?","o":["He is sightseeing Seoul.","He is repairing Bulguksa.","He is taking pictures of rain.","He is having fun in Gyeongju.","He is sending some pictures to his mom."],"a":3,"ans":"He is having fun in Gyeongju.","evs":[["B: Yes, I am. I'm walking around Bulg document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
