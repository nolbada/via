Airports do three things to reduce bird strikes.","공항은 버드 스트라이크를 줄이기 위해 세 가지 일을 한다."]]},"h":"3d03b31fe8"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes birds leave the area because there are no places to nest or feed.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이는 새가 그 지역을 떠나게 만드는데, 둥지를 틀거나 먹이를 먹을 장소가 없기 때문이다.","opts":["새가 둥지를 트는 것","공항이 나무를 없애는 것","공항이 레이저를 사용하는 것","비행기가 새와 충돌하는 것"],"r":{"a":"2) 공항이 나무를 없애는 것","ev":"8~9번 문장","w":"8번에서 공항이 나무를 없앤다고 했고, 9번의 This는 그 일을 가리켜요. 나무가 없어지면 새가 둥지 틀 곳과 먹이 먹을 곳이 없어서 떠나요.","c":2,"s":[[8,"First, they remove trees.","첫째로, 그들은 나무를 없앤다."],[9,"This makes birds leave the area because there are no places to nest or feed.","이는 새가 그 지역을 떠나게 만드는데, 둥지를 틀거나 먹이를 먹을 장소가 없기 때문이다."]]},"h":"3382801619"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But since airplanes were invented, birds and humans have had to share the sky.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 비행기가 발명된 이후로, 새와 인간은 하늘을 공유해야 했다.","opts":["비행기가 발명되기 전까지, 새와 인간은 하늘을 공유했다.","비행기가 발명된 이후로, 새는 하늘을 완전히 차지했다.","새와 인간이 하늘을 공유하게 되어 비행기가 발명되었다.","비행기가 발명된 이후로, 새와 인간은 하늘을 공유해야 했다."],"r":{"a":"4) 비행기가 발명된 이후로, 새와 인간은 하늘을 공유해야 했다.","ev":"2번 문장","w":"since airplanes were invented는 '비행기가 발명된 이후로'이고 have had to share the sky는 '하늘을 공유해야 했다'예요. 비행기가 발명된 뒤에야 새와 인간이 하늘을 함께 쓰게 된 거예요.","c":4,"s":[[2,"But since airplanes were invented, birds and humans have had to share the sky.","그러나 비행기가 발명된 이후로, 새와 인간은 하늘을 공유해야 했다."]]},"h":"643688ffe8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["공항은 새에게 둥지를 틀 장소를 더 주려고 나무를 없앤다.","버드 스트라이크는 비행기가 새와 충돌하는 것이다.","버드 스트라이크는 새 두 마리가 서로 충돌하는 것이다.","공항은 비행경로나 일정을 절대 바꾸지 않는다."],"opts":["Airports remove trees to give birds more places to nest.","A bird strike is when a plane crashes into a bird.","A bird strike happens when two birds crash into each other.","Airports never change flight paths or schedules."],"r":{"a":"2) A bird strike is when a plane crashes into a bird.","ev":"3~4번 문장","w":"3번에서 비행기가 새와 충돌한다고 하고, 4번에서 이것을 bird strike라고 불러요. 나무를 없애는 것은 새가 떠나게 하려는 것이고(8~9번), 공항은 때때로 비행경로와 일정을 바꿔요(12번).","c":2,"s":[[3,"Sadly, planes often crash into birds.","안타깝게도, 비행기는 자주 새와 충돌한다."],[4,"This is called a “bird strike.”","이는 ‘버드 스트라이크’라고 불린다."]]},"h":"5c1132a8af"},{"n":9,"t":"sum","q":"To reduce bird strikes, airports remove (A), use technology, and change flight paths and (B).","ko":"버드 스트라이크를 줄이기 위해 공항은 (A)을 없애고, 기술을 이용하고, 비행경로와 (B)을 바꾼다.","oko":["(A) 새 / (B) 공항","(A) 엔진 / (B) 일정","(A) 나무 / (B) 일정","(A) 나무 / (B) 엔진","(A) 레이저 / (B) 일정"],"opts":["(A) birds / (B) airports","(A) engines / (B) schedules","(A) trees / (B) schedules","(A) trees / (B) engines","(A) lasers / (B) schedules"],"r":{"a":"3) (A) trees / (B) schedules","ev":"8번, 10번, 12번 문장","w":"8번에서 나무(trees)를 없애고, 10번에서 기술을 이용하고, 12번에서 비행경로와 일정(schedules)을 바꾼다고 해요. 레이저는 없애는 것이 아니라 기술의 예예요.","c":3,"s":[[8,"First, they remove trees.","첫째로, 그들은 나무를 없앤다."],[10,"Second, they use technology.","둘째로, 그들은 기술을 이용한다."],[12,"Finally, airports sometimes change flight paths and schedules to avoid birds.","마지막으로, 공항은 새를 피하기 위해 때때로 비행경로와 일정을 바꾼다."]]},"h":"3527980854"},{"n":10,"t":"fill","q":"Sometimes birds get [A] into airplane engines, and it can be very [B].","ko":"때때로 새는 비행기 엔진에 [A] 들어가고, 이는 매우 [B]할 수 있다.","bank":["pulled","dangerous","invented","safe","freely","recorded"],"bko":{"pulled":"빨려 들어간","dangerous":"위험한","invented":"발명된","safe":"안전한","freely":"자유롭게","recorded":"녹음된"},"r":{"a":"[A] pulled, [B] dangerous","ev":"5~6번 문장","w":"5번에서 새가 비행기 엔진에 빨려 들어간다(get pulled)고 하고, 6번에서 그것이 매우 위험하다(dangerous)고 해요.","c":null,"s":[[5,"Sometimes birds get pulled into airplane engines.","때때로 새는 비행기 엔진에 빨려 들어간다."],[6,"It can be very dangerous.","이는 매우 위험할 수 있다."]]},"h":"a1ef467105"}]},{"u":5,"id":"rt3-05-1","no":1,"ko":"유리가 튼튼해졌네?","items":[{"n":1,"t":"tf","q":"The glass flask did not break completely when Benedictus knocked it over.","ko":"Benedictus가 플라스크를 쳐서 넘어뜨렸을 때 유리 플라스크는 완전히 깨지지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~4번 문장","s":[[2,"He knocked over a glass flask in his lab.","그는 실험실에서 유리 플라스크를 쳐서 넘어뜨렸다."],[3,"Something strange happened.","이상한 일이 벌어졌다."],[4,"The glass was not entirely broken.","유리가 완전히 깨지지 않았다."]],"w":"2번에서 플라스크를 넘어뜨렸고, 4번에서 유리가 완전히 깨지지 않았다(not entirely broken)고 해요.","c":"T"},"h":"39325d9495"},{"n":2,"t":"tf","q":"The thin plastic coating was left on the outside of the glass.","ko":"얇은 플라스틱 코팅은 유리 바깥쪽에 남았다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"After it dried, it left a thin plastic coating inside.","그것은 마른 후에, 안에 얇은 플라스틱 코팅을 남겼다."]],"w":"7번에서 코팅은 유리 안쪽(inside)에 남았다고 해요. 바깥쪽이라는 말은 틀려요.","c":"F"},"h":"70b516c37a"},{"n":3,"t":"tf","q":"Benedictus used his experience in the lab to create safety glass.","ko":"Benedictus는 실험실에서의 경험을 사용해 안전유리를 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"So he used his experience in the lab to create safety glass.","그래서 그는 안전유리를 만들기 위해 실험실에서의 경험을 사용했다."]],"w":"12번에 he used his experience in the lab to create safety glass가 그대로 있어요.","c":"T"},"h":"afd8320eba"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The glass was not entirely broken.)","ko":"유리가 완전히 깨지지 않았다. (entirely는 완전히)","opts":["갑자기","완전히","천천히","조금"],"word":"entirely","r":{"a":"2) 완전히","ev":"4번 문장","s":[[4,"The glass was not entirely broken.","유리가 완전히 깨지지 않았다."]],"w":"not entirely broken은 '완전히 깨지지는 않았다'는 뜻이에요. entirely는 '완전히, 전적으로'예요.","c":2},"h":"379d30ab1e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He put a layer of cellulose nitrate between two pieces of glass.)","ko":"그는 두 장의 유리 사이에 질산셀룰로오스 한 겹을 넣었다.","opts":["한 겹","한 상자","한 방울","한 조각"],"word":"layer","r":{"a":"1) 한 겹","ev":"13번 문장","s":[[13,"He put a layer of cellulose nitrate between two pieces of glass.","그는 두 장의 유리 사이에 질산셀룰로오스 한 겹을 넣었다."]],"w":"유리 두 장 사이에 질산셀룰로오스를 얇게 한 막, 즉 한 겹을 넣은 거예요. layer = 막, 겹.","c":1},"h":"3f817ac92d"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis protected the glass.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 유리를 보호했다.","opts":["유리 플라스크","얇은 플라스틱 코팅","Benedictus의 실수","실험실"],"r":{"a":"2) 얇은 플라스틱 코팅","ev":"7~8번 문장","s":[[7,"After it dried, it left a thin plastic coating inside.","그것은 마른 후에, 안에 얇은 플라스틱 코팅을 남겼다."],[8,"This protected the glass.","이것이 유리를 보호했다."]],"w":"7번에서 마른 뒤 얇은 플라스틱 코팅이 안쪽에 남았다고 했고, 8번 This가 그 코팅을 받아요. 보호받은 것은 유리이므로 유리 플라스크는 아니에요.","c":2},"h":"d3e1cd3713"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, every driver is protected by safety glass!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"지금, 모든 운전자가 안전유리로 보호받는다!","opts":["지금은 안전유리가 모든 운전자를 다치게 한다.","지금은 운전자들이 직접 안전유리를 만든다.","지금은 일부 운전자만 안전유리의 보호를 받는다.","지금은 모든 운전자가 안전유리로 보호받는다."],"r":{"a":"4) 지금은 모든 운전자가 안전유리로 보호받는다.","ev":"14번 문장","s":[[14,"Now, every driver is protected by safety glass!","지금, 모든 운전자가 안전유리로 보호받는다!"]],"w":"every driver는 '모든 운전자'이고 is protected by는 '~로 보호받는다'예요. 일부만이라는 말도, 다치게 한다는 말도 틀려요.","c":4},"h":"7bfd32ed0e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["유리 플라스크는 산산조각으로 깨졌다.","1903년에 차에는 안전유리 창문이 있었다.","그 당시 차에는 보통의 유리 창문이 있었고, 깨진 유리가 사람들을 다치게 했다.","Benedictus는 유리 바깥쪽에 플라스틱을 붙였다."],"opts":["The glass flask broke into small pieces.","Cars had safety glass windows in 1903.","Cars had regular glass windows, and broken glass hurt people.","Benedictus put plastic on the outside of the glass."],"r":{"a":"3) Cars had regular glass windows, and broken glass hurt people.","ev":"9~10번 문장","s":[[9,"At that time, cars had regular glass windows.","그 당시에, 차에는 보통의 유리 창문이 있었다."],[10,"People were hurt by broken glass in car accidents.","사람들은 차 사고에서 깨진 유리에 다쳤다."]],"w":"9번에서 그 당시 차에는 보통의 유리 창문이 있었고, 10번에서 깨진 유리에 사람들이 다쳤어요. 플라스크는 완전히 깨지지 않았고(4번), 안전유리는 유리 두 장 사이에 넣어 만들었어요(13번).","c":3},"h":"2589ce3911"},{"n":9,"t":"sum","q":"When Benedictus knocked over a glass flask, it did not (A) entirely because a thin plastic (B) protected it.","ko":"Benedictus가 유리 플라스크를 넘어뜨렸을 때, 얇은 플라스틱 (B)가 보호해서 유리는 완전히 (A)하지 않았다.","oko":["(A) 녹다 / (B) 코팅","(A) 깨지다 / (B) 가방","(A) 뛰다 / (B) 가방","(A) 녹다 / (B) 가방","(A) 깨지다 / (B) 코팅"],"opts":["(A) melt / (B) coating","(A) break / (B) bag","(A) jump / (B) bag","(A) melt / (B) bag","(A) break / (B) coating"],"r":{"a":"5) (A) break / (B) coating","ev":"4번, 7~8번 문장","s":[[4,"The glass was not entirely broken.","유리가 완전히 깨지지 않았다."],[7,"After it dried, it left a thin plastic coating inside.","그것은 마른 후에, 안에 얇은 플라스틱 코팅을 남겼다."],[8,"This protected the glass.","이것이 유리를 보호했다."]],"w":"4번에서 유리가 완전히 깨지지(break) 않았고, 7~8번에서 얇은 플라스틱 코팅(coating)이 유리를 보호했어요.","c":5},"h":"51f9f8adec"},{"n":10,"t":"fill","q":"People were [A] by broken glass in car accidents, so Benedictus created [B] glass.","ko":"사람들은 차 사고에서 깨진 유리에 [A], 그래서 Benedictus는 [B] 유리를 만들었다.","bank":["hurt","safety","protected","regular","broken","strange"],"bko":{"hurt":"다친","safety":"안전","protected":"보호받은","regular":"보통의","broken":"깨진","strange":"이상한"},"r":{"a":"[A] hurt, [B] safety","ev":"10~12번 문장","s":[[10,"People were hurt by broken glass in car accidents.","사람들은 차 사고에서 깨진 유리에 다쳤다."],[11,"Benedictus wanted to solve this problem.","Benedictus는 이 문제를 해결하기를 원했다."],[12,"So he used his experience in the lab to create safety glass.","그래서 그는 안전유리를 만들기 위해 실험실에서의 경험을 사용했다."]],"w":"10번에서 사람들이 깨진 유리에 다쳤고(hurt), 12번에서 그 문제를 해결하려고 안전유리(safety glass)를 만들었어요. protected는 안전유리 쪽 내용이라 [A]에 맞지 않고, regular는 문제의 원래 유리예요.","c":null},"h":"336ce8277c"}]},{"u":5,"id":"rt3-05-2","no":2,"ko":"보트 속에 살아요~","items":[{"n":1,"t":"tf","q":"The villagers turned old boats upside down to make houses.","ko":"마을 사람들은 집을 만들기 위해 오래된 보트를 거꾸로 뒤집었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They turned them upside down and cut out a door and windows.","그들은 그것들을 거꾸로 뒤집고 문과 창문을 잘라 만들었다."]],"w":"6번에서 They turned them upside down and cut out a door and windows라고 해요.","c":"T"},"h":"3bd5cc716d"},{"n":2,"t":"tf","q":"The old boats became tall houses with many rooms.","ko":"오래된 보트는 방이 많은 높은 집이 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The old boats were turned into long, one-room houses!","오래된 보트는 길고 방이 하나인 집으로 바뀌었다!"]],"w":"7번에서 오래된 보트는 길고 방이 하나인(one-room) 집이 되었다고 해요. 방이 많다는 말은 틀려요.","c":"F"},"h":"269747560e"},{"n":3,"t":"tf","q":"A fishing village in northern France did not throw old boats away.","ko":"프랑스 북부의 한 어촌은 오래된 보트를 버리지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But one fishing village in northern France didn’t throw them away.","그러나 프랑스 북부의 한 어촌은 그것들을 버리지 않았다."]],"w":"3번에 one fishing village in northern France didn’t throw them away가 있어요.","c":"T"},"h":"8568f1a00a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In World War II, most of these houses were destroyed.)","ko":"제2차 세계 대전 때, 이 집들 중 대부분이 파괴되었다.","opts":["수리되었다","팔렸다","파괴되었다","옮겨졌다"],"word":"destroyed","r":{"a":"3) 파괴되었다","ev":"8번 문장","s":[[8,"In World War II, most of these houses were destroyed.","제2차 세계 대전 때, 이 집들 중 대부분이 파괴되었다."]],"w":"8번은 전쟁 때 집들에게 일어난 일이에요. 그런데 9번에서 But으로 전통을 이어 가려 했으므로, destroy(파괴하다)의 수동 were destroyed는 '파괴되었다'예요.","c":3},"h":"eb5a7ff987"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But the villagers wanted to continue their tradition.)","ko":"그러나 마을 사람들은 그들의 전통을 계속 이어나가기를 원했다.","opts":["새 집","전통","계획","규칙"],"word":"tradition","r":{"a":"2) 전통","ev":"9번 문장","s":[[9,"But the villagers wanted to continue their tradition.","그러나 마을 사람들은 그들의 전통을 계속 이어나가기를 원했다."]],"w":"9번의 their tradition은 앞에서 말한 오래된 보트로 집을 만드는 것이에요. 오래 이어 온 풍습, 즉 전통이에요.","c":2},"h":"93b86cf784"},{"n":6,"t":"ref","q":"What does the underlined \"these people\" refer to?\nAt the beginning of the 1900s, these people brought old boats onto the ground.","ko":"밑줄 친 these people이 가리키는 것은?","sko":"1900년대 초에, 이 사람들은 오래된 보트를 땅 위로 가져왔다.","opts":["보트를 만드는 기술자들","1900년대의 관광객들","제2차 세계 대전의 군인들","프랑스 북부 어촌 마을 사람들"],"r":{"a":"4) 프랑스 북부 어촌 마을 사람들","ev":"4~5번 문장","s":[[4,"The people of the village turned them into houses!","그 마을의 사람들은 그것들을 집으로 바꾸었다!"],[5,"At the beginning of the 1900s, these people brought old boats onto the ground.","1900년대 초에, 이 사람들은 오래된 보트를 땅 위로 가져왔다."]],"w":"4번에서 The people of the village가 보트를 집으로 바꾸었고, 5번 these people이 그 마을 사람들을 다시 가리켜요.","c":4},"h":"f56c2b31f7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of new modern houses, they made better houses from old boats.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"새로운 현대적인 집 대신에, 그들은 오래된 보트로 더 좋은 집을 만들었다.","opts":["새로운 현대적인 집 대신 오래된 보트로 더 좋은 집을 만들었다.","오래된 보트 대신 새로운 현대적인 집을 지었다.","새로운 현대적인 집과 보트 집을 함께 지었다.","새 집을 지으려고 오래된 보트를 팔았다."],"r":{"a":"1) 새로운 현대적인 집 대신 오래된 보트로 더 좋은 집을 만들었다.","ev":"10번 문장","s":[[10,"Instead of new modern houses, they made better houses from old boats.","새로운 현대적인 집 대신에, 그들은 오래된 보트로 더 좋은 집을 만들었다."]],"w":"Instead of ~는 '~ 대신에'예요. 현대적인 새 집 대신 오래된 보트로 집을 만들었다는 뜻이고, 순서가 반대인 2번과는 달라요.","c":1},"h":"af703bf2ce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["보트 집은 새 보트로 만들었다.","전쟁이 끝난 뒤 마을 사람들은 높은 현대적인 집을 지었다.","오늘날 3,000명 이상의 사람들이 이런 집에서 산다.","방문객은 이런 집에 머물 수 없다."],"opts":["The houses were made from new boats.","The villagers built tall modern houses after the war.","Over 3,000 people live in these houses today.","Visitors cannot stay in these houses."],"r":{"a":"3) Over 3,000 people live in these houses today.","ev":"11~12번 문장","s":[[11,"Today, over 3,000 people live in these houses.","오늘날, 3,000명 이상의 사람들이 이런 집에서 살고 있다."],[12,"If you visit the village, you can stay in one of these houses too!","당신이 그 마을을 방문한다면, 당신도 이런 집 중 하나에 머물 수 있다!"]],"w":"11번에서 오늘날 3,000명 이상이 이런 집에서 산다고 해요. 보트는 오래된 보트이고(4번), 현대적인 집 대신 보트 집을 만들었고(10번), 방문객도 머물 수 있어요(12번).","c":3},"h":"350d59326f"},{"n":9,"t":"sum","q":"Villagers brought old boats onto the (A) and turned them upside down to make (B) houses.","ko":"마을 사람들은 오래된 보트를 (A) 위로 가져와 거꾸로 뒤집어 (B) 집을 만들었다.","oko":["(A) 바다 / (B) 방이 하나인","(A) 땅 / (B) 이층","(A) 바다 / (B) 이층","(A) 공중 / (B) 방이 하나인","(A) 땅 / (B) 방이 하나인"],"opts":["(A) sea / (B) one-room","(A) ground / (B) two-story","(A) sea / (B) two-story","(A) air / (B) one-room","(A) ground / (B) one-room"],"r":{"a":"5) (A) ground / (B) one-room","ev":"5~7번 문장","s":[[5,"At the beginning of the 1900s, these people brought old boats onto the ground.","1900년대 초에, 이 사람들은 오래된 보트를 땅 위로 가져왔다."],[6,"They turned them upside down and cut out a door and windows.","그들은 그것들을 거꾸로 뒤집고 문과 창문을 잘라 만들었다."],[7,"The old boats were turned into long, one-room houses!","오래된 보트는 길고 방이 하나인 집으로 바뀌었다!"]],"w":"5번에서 보트를 땅(ground) 위로 가져왔고, 7번에서 길고 방이 하나인(one-room) 집이 되었어요.","c":5},"h":"f5401479d5"},{"n":10,"t":"fill","q":"Old boats are often [A] away, but one village [B] them into houses.","ko":"오래된 보트는 보통 [A] 버려지지만, 한 마을은 그것들을 집으로 [B].","bank":["thrown","turned","float","destroyed","visit","stay"],"bko":{"thrown":"던져진","turned":"바꾸었다","float":"떠다니다","destroyed":"파괴된","visit":"방문하다","stay":"머물다"},"r":{"a":"[A] thrown, [B] turned","ev":"2~4번 문장","s":[[2,"Old boats are often thrown away.","오래된 보트는 보통 버려진다."],[3,"But one fishing village in northern France didn’t throw them away.","그러나 프랑스 북부의 한 어촌은 그것들을 버리지 않았다."],[4,"The people of the village turned them into houses!","그 마을의 사람들은 그것들을 집으로 바꾸었다!"]],"w":"2번에서 are often thrown away(버려진다), 4번에서 turned them into houses(그것들을 집으로 바꾸었다)예요. 두 칸은 서로 바꿔 읽으면 문법이 맞지 않아요.","c":null},"h":"cf1233b5d5"}]},{"u":5,"id":"rt3-05-3","no":3,"ko":"배고파? 내게 맡겨!","items":[{"n":1,"t":"tf","q":"One of an ant’s two stomachs is for sharing food.","ko":"개미의 두 위 중 하나는 먹이를 나누기 위한 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"One is for themselves, and the other is for sharing food.","하나는 그들 자신을 위한 것이고, 다른 하나는 먹이를 나누기 위한 것이다."]],"w":"2번에서 하나는 자신을 위한 것이고, 다른 하나(the other)는 먹이를 나누기 위한 것이라고 해요.","c":"T"},"h":"f1234cd659"},{"n":2,"t":"tf","q":"An ant stores extra food in its antennae.","ko":"개미는 여분의 먹이를 더듬이에 저장한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"After an ant eats enough food, it stores extra food in its social stomach.","개미는 충분한 먹이를 먹은 후에, 여분의 먹이를 사회적 위에 저장한다."]],"w":"4번에서 여분의 먹이는 사회적 위(social stomach)에 저장해요. 더듬이는 6번에서 신호를 보낼 때 쓰는 부분이에요.","c":"F"},"h":"48d091d9af"},{"n":3,"t":"tf","q":"One ant can feed the entire colony.","ko":"개미 한 마리가 무리 전체를 먹일 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"One ant can feed the entire colony!","개미 한 마리가 무리 전체를 먹일 수 있다!"]],"w":"12번에 One ant can feed the entire colony!가 그대로 있어요.","c":"T"},"h":"50dec81a58"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The ant with extra food vomits some out of its social stomach.)","ko":"여분의 먹이가 있는 개미는 사회적 위에서 일부를 토해낸다.","opts":["삼킨다","토해낸다","씹는다","숨긴다"],"word":"vomits","r":{"a":"2) 토해낸다","ev":"8번 문장","s":[[8,"The ant with extra food vomits some out of its social stomach.","여분의 먹이가 있는 개미는 사회적 위에서 일부를 토해낸다."]],"w":"8번은 먹이가 있는 개미가 사회적 위(out of its social stomach)에서 먹이 일부를 꺼내 굶주린 개미에게 주는 장면이에요. vomit = 토하다.","c":2},"h":"60ffe5f1f4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Some ant species can expand their social stomachs to extreme sizes.)","ko":"어떤 개미 종은 사회적 위를 극단적인 크기로 확장시킬 수 있다.","opts":["확장시키다","줄이다","보관하다","옮기다"],"word":"expand","r":{"a":"1) 확장시키다","ev":"10번 문장","s":[[10,"Some ant species can expand their social stomachs to extreme sizes.","어떤 개미 종은 사회적 위를 극단적인 크기로 확장시킬 수 있다."]],"w":"10번에서 위를 extreme sizes(극단적인 크기)까지 키울 수 있다고 했으니, expand는 '크게 늘리다'라는 뜻이에요. expand = 확대하다, 확장시키다.","c":1},"h":"3a91272079"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhen they are full, they look like balloons.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그것들이 가득 차면, 풍선처럼 보인다.","opts":["어떤 개미 종","굶주린 개미들","개미들의 사회적 위","풍선"],"r":{"a":"3) 개미들의 사회적 위","ev":"10~11번 문장","s":[[10,"Some ant species can expand their social stomachs to extreme sizes.","어떤 개미 종은 사회적 위를 극단적인 크기로 확장시킬 수 있다."],[11,"When they are full, they look like balloons.","그것들이 가득 차면, 풍선처럼 보인다."]],"w":"10번에서 사회적 위(their social stomachs)를 극단적인 크기로 확장시킨다고 했고, 11번에서 그것들이 가득 차면 풍선처럼 보인다고 해요.","c":3},"h":"30068904fa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The food in this stomach is used for other hungry ants.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 위 속의 먹이는 다른 굶주린 개미들을 위해 사용된다.","opts":["이 위 속의 먹이는 그 개미 혼자만 먹는다.","이 위 속의 먹이는 개미집 밖에서 먹이를 찾는 데 쓰인다.","다른 개미들이 이 위 속의 먹이를 모두 훔친다.","이 위 속의 먹이는 다른 굶주린 개미들에게 쓰인다."],"r":{"a":"4) 이 위 속의 먹이는 다른 굶주린 개미들에게 쓰인다.","ev":"5번 문장","s":[[5,"The food in this stomach is used for other hungry ants.","이 위 속의 먹이는 다른 굶주린 개미들을 위해 사용된다."]],"w":"is used for는 '~을 위해 쓰인다'이고 other hungry ants는 '다른 굶주린 개미들'이에요. 혼자만 먹는 것이 아니라 다른 개미들을 위한 먹이예요.","c":4},"h":"2863a0a5db"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["개미는 위가 한 개뿐이다.","굶주린 개미는 더듬이로 신호를 보내고 먹이를 달라고 말한다.","개미는 다른 개미와 먹이를 절대 나누지 않는다.","가득 찬 사회적 위는 작은 돌처럼 보인다."],"opts":["Ants have only one stomach.","A hungry ant signals with its antennae and asks for food.","Ants never share food with other ants.","A full social stomach looks like a small rock."],"r":{"a":"2) A hungry ant signals with its antennae and asks for food.","ev":"6~7번 문장","s":[[6,"When a hungry ant sees another ant with food, it signals with its antennae.","굶주린 개미가 먹이를 가진 다른 개미를 보면, 더듬이로 신호를 보낸다."],[7,"The hungry ant says, “Feed me.”","굶주린 개미는 “나에게 먹이를 줘.”라고 말한다."]],"w":"6번에서 굶주린 개미는 더듬이로 신호를 보내고, 7번에서 “Feed me.”라고 말해요. 위는 두 개이고(1번), 먹이를 나누며(2번), 가득 찬 위는 풍선처럼 보여요(11번).","c":2},"h":"0253ded565"},{"n":9,"t":"sum","q":"An ant stores extra food in its (A) stomach and later (B) some of it to share with hungry ants.","ko":"개미는 여분의 먹이를 (A) 위에 저장하고, 나중에 그 일부를 (B) 굶주린 개미와 나눈다.","oko":["(A) 사회적 / (B) 먹는다","(A) 굶주린 / (B) 토해낸다","(A) 굶주린 / (B) 먹는다","(A) 사회적 / (B) 숨긴다","(A) 사회적 / (B) 토해낸다"],"opts":["(A) social / (B) eats","(A) hungry / (B) vomits","(A) hungry / (B) eats","(A) social / (B) hides","(A) social / (B) vomits"],"r":{"a":"5) (A) social / (B) vomits","ev":"4번, 8번 문장","s":[[4,"After an ant eats enough food, it stores extra food in its social stomach.","개미는 충분한 먹이를 먹은 후에, 여분의 먹이를 사회적 위에 저장한다."],[8,"The ant with extra food vomits some out of its social stomach.","여분의 먹이가 있는 개미는 사회적 위에서 일부를 토해낸다."]],"w":"4번에서 여분의 먹이를 사회적(social) 위에 저장하고, 8번에서 그 일부를 토해내(vomits) 굶주린 개미에게 줘요.","c":5},"h":"1b5e4300ae"},{"n":10,"t":"fill","q":"The social stomach is [A] for ants because ants can [B] food with it.","ko":"개미는 사회적 위로 먹이를 [B] 수 있기 때문에, 사회적 위는 개미에게 [A].","bank":["important","share","hungry","extreme","entire","balloons"],"bko":{"important":"중요한","share":"나누다","hungry":"굶주린","extreme":"극단적인","entire":"전체의","balloons":"풍선들"},"r":{"a":"[A] important, [B] share","ev":"2번, 9번 문장","s":[[2,"One is for themselves, and the other is for sharing food.","하나는 그들 자신을 위한 것이고, 다른 하나는 먹이를 나누기 위한 것이다."],[9,"In this way, the social stomach is important for ants.","이런 식으로, 사회적 위는 개미에게 중요하다."]],"w":"9번에서 사회적 위는 개미에게 중요하다(important)고 했고, 2번에서 다른 위는 먹이를 나누기(sharing) 위한 것이라고 해요. [B] 자리는 동사원형이 와야 하므로 share가 맞아요.","c":null},"h":"67a14059fe"}]},{"u":6,"id":"rt3-06-1","no":1,"ko":"올록볼록~ 소중한 이정표","items":[{"n":1,"t":"tf","q":"The yellow tiles with bumps are called braille blocks.","ko":"요철이 있는 노란색 타일은 점자 블록이라고 불린다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"The yellow tiles have bumps on them!","노란색 타일에 요철(튀어나온 부분)들이 있다!"],[3,"They are called braille blocks.","그것들은 점자 블록이라고 불린다."]],"w":"2번에서 노란색 타일에 요철이 있다고 하고, 3번에서 그것들이 점자 블록이라고 불린다(are called)고 해요.","c":"T"},"h":"fc2090ae68"},{"n":2,"t":"tf","q":"Blocks with small, round bumps show it is safe to walk in that direction.","ko":"작고 둥근 요철이 있는 블록은 그 방향으로 걸어가는 것이 안전하다는 것을 보여 준다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"The second design has many small, round bumps.","두 번째 디자인에는 작고 둥근 요철들이 많이 있다."],[11,"These blocks tell the people to be careful of nearby dangers.","이 블록은 그 사람들에게 인근의 위험을 주의하라고 말해 준다."]],"w":"작고 둥근 요철은 10번의 두 번째 디자인이고, 11번에서 인근의 위험을 주의하라고 말해 줘요. 안전한 방향을 보여 주는 것은 길고 일직선인 요철(9번)이에요.","c":"F"},"h":"640eb01577"},{"n":3,"t":"tf","q":"Blocks with long, straight bumps are placed in a line.","ko":"길고 일직선인 요철이 있는 블록은 일렬로 설치된다.","r":{"a":"T (본문과 맞는 내용)","ev":"7~8번 문장","s":[[7,"The first design has long, straight bumps.","첫 번째 디자인에는 길고 일직선인 요철들이 있다."],[8,"These blocks are placed in a line.","이 블록은 일렬로 설치된다."]],"w":"7번에서 첫 번째 디자인은 길고 일직선인 요철이고, 8번에서 이 블록들이 일렬로 설치된다(are placed in a line)고 해요.","c":"T"},"h":"ef3e159723"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The yellow tiles have bumps on them!)","ko":"노란색 타일에는 요철이 있다!","opts":["구멍","얼룩","요철(튀어나온 부분)","무늬"],"word":"bumps","r":{"a":"3) 요철(튀어나온 부분)","ev":"2번 문장","s":[[2,"The yellow tiles have bumps on them!","노란색 타일에 요철(튀어나온 부분)들이 있다!"]],"w":"점자 블록 위에 올록볼록 튀어나온 부분을 말해요. bump = 요철, 튀어나온 부분.","c":3},"h":"77ed1c9748"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Now you understand the importance of braille blocks!)","ko":"이제 당신은 점자 블록의 중요성을 이해한다!","opts":["가격","중요성","역사","종류"],"word":"importance","r":{"a":"2) 중요성","ev":"13번 문장","s":[[13,"Now you understand the importance of braille blocks!","이제 당신은 점자 블록의 중요성을 이해한다!"]],"w":"앞에서 블록의 종류와 뜻을 알았으니 '점자 블록이 얼마나 중요한지'를 이해한다는 말이에요. importance = 중요성.","c":2},"h":"170f74d18c"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey show it is safe to walk in that direction.","ko":"밑줄 친 They가 가리키는 것은?","opts":["시각 장애인들","작고 둥근 요철이 있는 블록","횡단보도","길고 일직선인 요철이 있는 블록"],"sko":"그것들은 그 방향으로 걸어가는 것이 안전하다는 것을 보여 준다.","r":{"a":"4) 길고 일직선인 요철이 있는 블록","ev":"8~9번 문장","s":[[8,"These blocks are placed in a line.","이 블록은 일렬로 설치된다."],[9,"They show it is safe to walk in that direction.","그것들은 그 방향으로 걸어가는 것이 안전하다는 것을 보여 준다."]],"w":"안전한 방향을 보여 주는 것은 8번 These blocks, 즉 첫 번째 디자인(길고 일직선인 요철) 블록이에요. 작고 둥근 블록은 위험을 알려 줘요(11번).","c":4},"h":"fc3853d2c0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These blocks tell the people to be careful of nearby dangers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이 블록은 사람들에게 가까운 곳의 위험을 조심하라고 알려 준다.","이 블록은 사람들에게 위험한 곳을 피해 멀리 가라고 말한다.","이 블록은 사람들에게 가까운 곳에 안전한 길이 있다고 알려 준다.","이 블록은 사람들이 위험을 만들지 않도록 도와준다."],"sko":"이 블록은 그 사람들에게 인근의 위험을 주의하라고 말해 준다.","r":{"a":"1) 이 블록은 사람들에게 가까운 곳의 위험을 조심하라고 알려 준다.","ev":"11번 문장","s":[[11,"These blocks tell the people to be careful of nearby dangers.","이 블록은 그 사람들에게 인근의 위험을 주의하라고 말해 준다."]],"w":"tell + 사람 + to-v는 '~에게 …하라고 말하다'예요. be careful of nearby dangers = 가까운 곳의 위험을 조심하다. 안전한 길을 알려 주는 것은 첫 번째 디자인이에요(9번).","c":1},"h":"c1616339d8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Braille blocks have only one type.","Braille blocks are only placed inside subway cars.","Braille blocks help visually impaired people get around.","Visually impaired people cannot see any color at all."],"oko":["점자 블록은 한 종류뿐이다.","점자 블록은 지하철 객차 안에만 설치된다.","점자 블록은 시각 장애인이 돌아다니는 것을 돕는다.","시각 장애인은 어떤 색도 전혀 볼 수 없다."],"r":{"a":"3) Braille blocks help visually impaired people get around.","ev":"4번 문장","s":[[4,"They help visually impaired people get around.","그것들은 시각 장애가 있는 사람들이 돌아다니는 것을 돕는다."]],"w":"4번에서 점자 블록은 시각 장애가 있는 사람들이 돌아다니는 것을 돕는다고 해요. 블록은 두 종류예요(6번). 설치 장소는 횡단보도나 지하철 승강장이고(12번), 일부 시각 장애인은 밝은색을 볼 수 있어요(5번).","c":3},"h":"730c5fb593"},{"n":9,"t":"sum","q":"Blocks with (A) bumps show a safe direction, and blocks with (B) bumps warn people of nearby dangers.","ko":"(A) 요철이 있는 블록은 안전한 방향을 보여 주고, (B) 요철이 있는 블록은 사람들에게 인근의 위험을 경고한다.","opts":["(A) round / (B) straight","(A) straight / (B) yellow","(A) bright / (B) round","(A) small / (B) long","(A) straight / (B) round"],"oko":["(A) 둥근 / (B) 일직선인","(A) 일직선인 / (B) 노란","(A) 밝은 / (B) 둥근","(A) 작은 / (B) 긴","(A) 일직선인 / (B) 둥근"],"r":{"a":"5) (A) straight / (B) round","ev":"7번, 9~11번 문장","s":[[7,"The first design has long, straight bumps.","첫 번째 디자인에는 길고 일직선인 요철들이 있다."],[9,"They show it is safe to walk in that direction.","그것들은 그 방향으로 걸어가는 것이 안전하다는 것을 보여 준다."],[10,"The second design has many small, round bumps.","두 번째 디자인에는 작고 둥근 요철들이 많이 있다."],[11,"These blocks tell the people to be careful of nearby dangers.","이 블록은 그 사람들에게 인근의 위험을 주의하라고 말해 준다."]],"w":"일직선(straight) 요철은 안전한 방향(7, 9번), 둥근(round) 요철은 인근의 위험 주의(10~11번)예요. 반대로 쓰면 틀려요.","c":5},"h":"65eade175e"},{"n":10,"t":"fill","q":"Braille blocks are [A] because some visually impaired people can still see bright colors. They are usually placed at crosswalks or on subway [B].","ko":"점자 블록은 일부 시각 장애인들이 여전히 밝은색을 볼 수 있기 때문에 [A]이다. 그것들은 대개 횡단보도나 지하철 [B]에 설치된다.","bank":["yellow","platforms","direction","bumps","careful","dangers"],"bko":{"yellow":"노란색","platforms":"승강장","direction":"방향","bumps":"요철","careful":"조심하는","dangers":"위험"},"r":{"a":"[A] yellow, [B] platforms","ev":"5번, 12번 문장","s":[[5,"Braille blocks are yellow because some visually impaired people can still see bright colors.","일부 시각 장애인들이 여전히 밝은색은 볼 수 있기 때문에 점자 블록은 노란색이다."],[12,"They are usually placed at crosswalks or on subway platforms.","그것들은 대개 횡단보도나 지하철 승강장에 설치된다."]],"w":"5번에서 블록은 밝은색을 볼 수 있는 사람을 위해 yellow(노란색)이고, 12번에서 횡단보도나 지하철 platforms(승강장)에 설치돼요.","c":null},"h":"07399454c7"}]},{"u":6,"id":"rt3-06-2","no":2,"ko":"심장을 울리는 소리","items":[{"n":1,"t":"tf","q":"The didgeridoo was first played by native Australians.","ko":"디저리두는 호주 원주민들에 의해 처음 연주되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It was first played by native Australians about 40,000 years ago!","그것은 약 4만 년 전에 호주 원주민들에 의해 처음 연주되었다!"]],"w":"3번 문장에서 It(디저리두) was first played by native Australians라고 해요.","c":"T"},"h":"56cae32536"},{"n":2,"t":"tf","q":"A didgeridoo is always shorter than one meter.","ko":"디저리두는 항상 1미터보다 짧다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It can be one to three meters long.","그것은 길이가 1에서 3미터까지 될 수 있다."]],"w":"6번 문장에서 디저리두는 길이가 1에서 3미터까지(one to three meters long) 될 수 있다고 해요. 항상 1미터보다 짧은 것은 아니에요.","c":"F"},"h":"2d5471ae80"},{"n":3,"t":"tf","q":"The didgeridoo is a wooden wind instrument.","ko":"디저리두는 나무로 된 관악기이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The didgeridoo is a long, wooden wind instrument.","디저리두는 길고 나무로 된 관악기이다."]],"w":"4번 문장에서 디저리두는 길고 나무로 된 관악기(a long, wooden wind instrument)라고 해요.","c":"T"},"h":"124b9b123c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Native people don’t carve out the insides of the trees.)","ko":"원주민들은 나무의 속을 파내지 않는다.","opts":["가득 채우다","파내다","칠하다","쌓다"],"word":"carve out","r":{"a":"2) 파내다","ev":"11번 문장","s":[[11,"Native people don’t carve out the insides of the trees.","원주민들은 나무의 속을 파내지 않는다."]],"w":"carve out the insides는 나무의 속을 파낸다는 뜻이에요. 바로 뒤 12번에서 대신 흰개미가 먹어 뚫은 나무를 찾는다고 하니, 속을 사람이 파내지 않는다는 말이에요. carve out = 파내다.","c":2},"h":"dafe2cbfc6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It looks like a pipe.)","ko":"그것은 관처럼 생겼다.","opts":["상자","북","줄","관(파이프)"],"word":"pipe","r":{"a":"4) 관(파이프)","ev":"5번 문장","s":[[5,"It looks like a pipe.","그것은 관처럼 생겼다."]],"w":"5번의 It은 디저리두예요. 디저리두가 길쭉한 관처럼 생겼다는 말이에요. pipe = 관, 파이프.","c":4},"h":"6a2892a176"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nInstead, they look for trees that termites have eaten through.","ko":"밑줄 친 they가 가리키는 것은?","opts":["흰개미들","연주자들","원주민들","디저리두들"],"sko":"대신 그들은 흰개미들이 관통해서 먹어 뚫린 나무를 찾는다.","r":{"a":"3) 원주민들","ev":"11~12번 문장","s":[[11,"Native people don’t carve out the insides of the trees.","원주민들은 나무의 속을 파내지 않는다."],[12,"Instead, they look for trees that termites have eaten through.","대신 그들은 흰개미들이 관통해서 먹어 뚫린 나무를 찾는다."]],"w":"12번의 they는 바로 앞 11번 문장의 주어 Native people(원주민들)이에요. 흰개미(termites)는 12번 뒤쪽에서 나무를 먹는 쪽이에요.","c":3},"h":"a654a358e7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Traditional didgeridoos are made of eucalyptus, a hardwood.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["전통적인 디저리두는 유칼립투스라는 단단한 목재로 만들어진다.","전통적인 디저리두는 유칼립투스 열매로 만들어진다.","유칼립투스는 디저리두를 연주하는 사람의 이름이다.","전통적인 디저리두는 부드러운 천으로 만들어진다."],"sko":"전통적인 디저리두는 유칼립투스라는 단단한 목재로 만들어진다.","r":{"a":"1) 전통적인 디저리두는 유칼립투스라는 단단한 목재로 만들어진다.","ev":"10번 문장","s":[[10,"Traditional didgeridoos are made of eucalyptus, a hardwood.","전통적인 디저리두는 유칼립투스라는 단단한 목재로 만들어진다."]],"w":"콤마 뒤 a hardwood는 eucalyptus를 설명하는 동격이에요. 유칼립투스 = 단단한 목재, 그 나무로 만든다는 뜻이에요.","c":1},"h":"d6331969f0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The didgeridoo was first played in Europe.","The didgeridoo has one base tone.","Didgeridoos are only used in traditional ceremonies today.","Native people carve out the insides of the trees."],"oko":["디저리두는 유럽에서 처음 연주되었다.","디저리두는 하나의 기본음을 갖는다.","오늘날 디저리두는 전통 의식에서만 쓰인다.","원주민들은 나무의 속을 파낸다."],"r":{"a":"2) The didgeridoo has one base tone.","ev":"8번 문장","s":[[8,"The didgeridoo has one base tone.","디저리두는 하나의 기본음을 갖는다."]],"w":"8번에서 디저리두는 하나의 기본음을 갖는다고 해요. 처음 연주한 사람은 호주 원주민(3번), 지금은 여러 음악에도 써요(14번), 속은 파내지 않아요(11번).","c":2},"h":"b4f7efe842"},{"n":9,"t":"sum","q":"The didgeridoo is one of the (A) instruments. Traditionally it was for special ceremonies, but now people around the world use (B) didgeridoos.","ko":"디저리두는 가장 (A) 악기들 중 하나이다. 전통적으로 특별 의식을 위한 것이었지만, 지금은 전 세계 사람들이 (B) 디저리두를 사용한다.","opts":["(A) newest / (B) modern","(A) oldest / (B) ancient","(A) shortest / (B) modern","(A) newest / (B) ancient","(A) oldest / (B) modern"],"oko":["(A) 가장 새로운 / (B) 현대식의","(A) 가장 오래된 / (B) 고대의","(A) 가장 짧은 / (B) 현대식의","(A) 가장 새로운 / (B) 고대의","(A) 가장 오래된 / (B) 현대식의"],"r":{"a":"5) (A) oldest / (B) modern","ev":"2번, 13~14번 문장","s":[[2,"One of the oldest instruments is the didgeridoo.","가장 오래된 악기들 중 하나는 디저리두이다."],[13,"Didgeridoos were traditionally for special ceremonies.","디저리두는 전통적으로 특별 의식을 위한 것이었다."],[14,"Now people all over the world use modern didgeridoos in beatboxing, dance music, and meditation music.","현재는 전 세계 사람들이 비트박스, 댄스 음악, 그리고 명상 음악에 현대식 디저리두를 사용한다."]],"w":"2번에서 가장 오래된(oldest) 악기 중 하나이고, 14번에서 지금은 현대식(modern) 디저리두를 써요. newest나 ancient는 본문과 달라요.","c":5},"h":"c151de6908"},{"n":10,"t":"fill","q":"You can play the didgeridoo by [A] your lips and blowing into it, and players can make some [B] tones too.","ko":"디저리두는 입술을 [A] 불어서 연주할 수 있고, 연주자들은 몇몇 더 [B] 음도 만들 수 있다.","bank":["vibrating","higher","wooden","termites","ceremonies","eucalyptus"],"bko":{"vibrating":"떨며","higher":"높은","wooden":"나무로 된","termites":"흰개미들","ceremonies":"의식들","eucalyptus":"유칼립투스"},"r":{"a":"[A] vibrating, [B] higher","ev":"7번, 9번 문장","s":[[7,"You can play it by vibrating your lips and blowing into it.","입술을 떨며 불어서 그것을 연주할 수 있다."],[9,"But players can make some higher tones too.","그러나 연주자들이 몇몇 더 높은 음도 만들 수 있다."]],"w":"7번에서 vibrate(떨다) your lips and blowing으로 연주하고, 9번에서 기본음 외에 higher(더 높은) 음도 만들어요.","c":null},"h":"c22a3abfd7"}]},{"u":6,"id":"rt3-06-3","no":3,"ko":"차가운 두루마리 휴지?","items":[{"n":1,"t":"tf","q":"Snow rollers are very rare.","ko":"두루마리 눈은 매우 희귀하다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They are very rare.","그것들은 매우 희귀하다."]],"w":"6번 문장에 They are very rare.라고 나와요. 두루마리 눈은 매우 희귀해요.","c":"T"},"h":"246e353abe"},{"n":2,"t":"tf","q":"Snow rollers are snowballs made by people.","ko":"두루마리 눈은 사람이 만든 눈덩이이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Snow rollers are nature-made snowballs.","두루마리 눈은 자연이 만든 눈덩이다."]],"w":"4번 문장에서 두루마리 눈은 자연이 만든 눈덩이(nature-made snowballs)라고 해요. 사람이 만든 것이 아니에요.","c":"F"},"h":"defabb6c9b"},{"n":3,"t":"tf","q":"Wind or a slope makes the snow roll.","ko":"바람이나 경사지가 눈을 구르게 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The wind or slope will make the snow roll.","바람이나 경사지가 눈을 구르게 만들 것이다."]],"w":"11번 문장에서 The wind or slope will make the snow roll.이라고 해요.","c":"T"},"h":"9289a400ce"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Wet snow sticks together more easily.)","ko":"젖은 눈은 더 쉽게 함께 뭉친다.","opts":["함께 뭉친다","서로 녹아 없어진다","멀리 날아간다","바닥으로 스며든다"],"word":"sticks together","r":{"a":"1) 함께 뭉친다","ev":"9번 문장","s":[[9,"Wet snow sticks together more easily.","젖은 눈은 더 쉽게 함께 뭉친다."]],"w":"젖은 눈은 눈송이들이 서로 달라붙어 눈덩이가 되기 쉬워요. stick together = 함께 뭉치다.","c":1},"h":"3218d409c8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (All the following are necessary for their formation.)","ko":"다음의 모든 것들이 그것들의 형성에 필요하다.","opts":["위험한","필요한","쉬운","불가능한"],"word":"necessary","r":{"a":"2) 필요한","ev":"7번 문장","s":[[7,"All the following are necessary for their formation.","다음의 모든 것들이 그것들의 형성에 필요하다."]],"w":"the following은 '다음에 오는 것들'이고, 그것들이 두루마리 눈의 형성에 필요하다(necessary)는 말이에요. necessary = 필요한.","c":2},"h":"4170f9014b"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey form when snow rolls along the ground.","ko":"밑줄 친 They가 가리키는 것은?","opts":["땅바닥들","롤케이크들","두루마리 눈들","경사지들"],"sko":"그것들은 눈이 땅바닥을 따라 구를 때 형성된다.","r":{"a":"3) 두루마리 눈들","ev":"4~5번 문장","s":[[4,"Snow rollers are nature-made snowballs.","두루마리 눈은 자연이 만든 눈덩이다."],[5,"They form when snow rolls along the ground.","그것들은 눈이 땅바닥을 따라 구를 때 형성된다."]],"w":"5번의 They는 바로 앞 4번 문장의 주어 Snow rollers(두루마리 눈)이에요. '두루마리 눈은 눈이 땅바닥을 따라 구를 때 형성된다'는 내용이에요.","c":3},"h":"04cc24a540"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s because the middle part is thin and weak.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["가운데 부분이 두껍고 단단하기 때문이다.","바깥 부분이 얇고 약하기 때문이다.","땅바닥이 얇은 얼음으로 덮여 있기 때문이다.","가운데 부분이 얇고 약하기 때문이다."],"sko":"그것은 가운데 부분이 얇고 약하기 때문이다.","r":{"a":"4) 가운데 부분이 얇고 약하기 때문이다.","ev":"13~14번 문장","s":[[13,"As they grow, the inside is often blown away by the wind.","그것들이 커짐에 따라, 안쪽이 보통 바람에 의해 날려간다."],[14,"That’s because the middle part is thin and weak.","그것은 가운데 부분이 얇고 약하기 때문이다."]],"w":"That’s because ~는 '그것은 ~ 때문이다'로, 앞(13번: 안쪽이 바람에 날려감)의 이유를 말해요. 이유는 가운데 부분이 얇고 약하다는 것이에요.","c":4},"h":"1e97e2955e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Snow rollers get smaller as they roll.","Rolling snow picks up more and more snow.","Snow rollers form only when the ground has no ice.","Snow rollers are very common in winter."],"oko":["두루마리 눈은 구르면서 점점 작아진다.","구르는 눈은 점점 더 많은 눈을 얻는다.","두루마리 눈은 땅에 얼음이 전혀 없을 때만 생긴다.","두루마리 눈은 겨울에 매우 흔하다."],"r":{"a":"2) Rolling snow picks up more and more snow.","ev":"12번 문장","s":[[12,"When small amounts of snow start rolling, they pick up more and more snow.","적은 양의 눈이 구르기 시작하면, 그것들은 점점 더 많은 눈을 얻는다."]],"w":"12번에서 적은 양의 눈이 구르기 시작하면 점점 더 많은 눈을 얻는다고 해요. 땅에는 얼음이 있어야 하고(8번), 두루마리 눈은 매우 희귀해요(6번).","c":2},"h":"5b2ca065b0"},{"n":9,"t":"sum","q":"Snow rollers are very (A), and their (B) is often blown away, so they look like hollow roll cakes.","ko":"두루마리 눈은 매우 (A), 그것들의 (B)이 흔히 날려가서 속이 빈 롤케이크처럼 보인다.","opts":["(A) common / (B) outside","(A) rare / (B) outside","(A) common / (B) inside","(A) rare / (B) ground","(A) rare / (B) inside"],"oko":["(A) 흔하고 / (B) 바깥쪽","(A) 희귀하고 / (B) 바깥쪽","(A) 흔하고 / (B) 안쪽","(A) 희귀하고 / (B) 땅바닥","(A) 희귀하고 / (B) 안쪽"],"r":{"a":"5) (A) rare / (B) inside","ev":"6번, 13번, 15번 문장","s":[[6,"They are very rare.","그것들은 매우 희귀하다."],[13,"As they grow, the inside is often blown away by the wind.","그것들이 커짐에 따라, 안쪽이 보통 바람에 의해 날려간다."],[15,"This makes snow rollers look like hollow roll cakes!","이것이 두루마리 눈을 속이 빈 롤케이크처럼 보이게 만든다!"]],"w":"6번에서 매우 희귀하고(rare), 13번에서 안쪽(inside)이 바람에 날려가서 15번처럼 속이 빈 롤케이크처럼 보여요.","c":5},"h":"aff8e6adfa"},{"n":10,"t":"fill","q":"To form snow rollers, the ground must be covered with ice and [A] snow, and wind or a [B] must make the snow roll.","ko":"두루마리 눈이 생기려면, 땅은 얼음과 [A] 눈으로 덮여야 하고, 바람이나 [B]가 눈을 구르게 해야 한다.","bank":["wet","slope","hollow","ground","rare","middle"],"bko":{"wet":"젖은","slope":"경사지","hollow":"속이 빈","ground":"땅바닥","rare":"희귀한","middle":"가운데의"},"r":{"a":"[A] wet, [B] slope","ev":"8번, 10~11번 문장","s":[[8,"First, the ground has to be covered with ice, and that ice has to be covered with wet snow.","첫째로, 땅바닥이 얼음으로 덮여 있어야 하고, 그 얼음은 젖은 눈으로 덮여 있어야 한다."],[10,"Second, there must be wind or a slope.","둘째로, 바람이나 경사지가 있어야 한다."],[11,"The wind or slope will make the snow roll.","바람이나 경사지가 눈을 구르게 만들 것이다."]],"w":"8번에서 얼음 위에 wet(젖은) 눈이 덮여 있어야 하고, 10~11번에서 바람이나 slope(경사지)가 눈을 구르게 만들어요.","c":null},"h":"e34036c9c5"}]},{"u":7,"id":"rt3-07-1","no":1,"ko":"혀도 코도 매워~","items":[{"n":1,"t":"tf","q":"Spicy food activates the same kind of receptor that responds to extreme heat.","ko":"매운 음식은 극심한 열기에 반응하는 것과 같은 종류의 수용기를 활성화시킨다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"Spicy food activates a type of sensory receptor in your body.","매운 음식은 몸에 있는 감각 수용기의 한 종류를 활성화시킨다."],[5,"This is the same receptor that responds to extreme heat.","이것은 극심한 열기에 반응하는 것과 동일한 수용기이다."]],"w":"4번에서 매운 음식이 감각 수용기를 활성화시킨다고 하고, 5번에서 이것이 극심한 열기에 반응하는 것과 동일한 수용기라고 해요.","c":"T"},"h":"37fbb26789"},{"n":2,"t":"tf","q":"Wasabi has large and heavy molecules that stay in your mouth.","ko":"와사비에는 입안에 머무르는 크고 무거운 분자들이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"But wasabi is different.","그러나 와사비는 다르다."],[12,"It has small molecules.","그것에는 작은 분자들이 있다."]],"w":"크고 무거운 분자는 고추의 것이에요(9번). 와사비는 작은 분자를 가지고 있어요(12번).","c":"F"},"h":"5c336f49e6"},{"n":3,"t":"tf","q":"Your brain thinks your mouth is on fire when you eat chilies.","ko":"고추를 먹으면 뇌는 입이 불타고 있다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6~7번 문장","s":[[6,"So, when you eat chilies, your mouth feels like it’s burning.","따라서, 당신이 고추를 먹으면, 입은 불 타고 있는 것처럼 느껴진다."],[7,"Your brain actually thinks your mouth is on fire.","뇌는 실제로 당신의 입이 불타고 있다고 생각한다."]],"w":"6번에서 고추를 먹으면 입이 불타는 것처럼 느껴지고, 7번에서 뇌는 실제로 입이 불타고 있다고 생각한다고 해요.","c":"T"},"h":"61a4265507"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Spicy food activates a type of sensory receptor in your body.)","ko":"매운 음식은 몸에 있는 감각 수용기의 한 종류를 활성화시킨다. (activate는 활성화시키다)","opts":["활성화시킨다","소화시킨다","차단한다","식힌다"],"word":"activates","r":{"a":"1) 활성화시킨다","ev":"4번 문장","s":[[4,"Spicy food activates a type of sensory receptor in your body.","매운 음식은 몸에 있는 감각 수용기의 한 종류를 활성화시킨다."]],"w":"매운 음식이 수용기를 작동하게 만들어서 5번~6번처럼 입이 불타는 느낌이 생겨요. activate = 활성화시키다.","c":1},"h":"8b163b3d44"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That’s why you start to sweat and turn red.)","ko":"그것이 바로 당신이 땀을 흘리고 얼굴이 빨개지기 시작하는 이유이다. (sweat는 땀을 흘리다)","opts":["잠을 자다","웃다","땀을 흘리다","기침하다"],"word":"sweat","r":{"a":"3) 땀을 흘리다","ev":"8번 문장","s":[[8,"That’s why you start to sweat and turn red.","그것이 바로 당신이 땀을 흘리고 얼굴이 빨개지기 시작하는 이유이다."]],"w":"입이 불탄다고 느낀 몸이 보이는 반응이 turn red(빨개지다)와 sweat예요. 더울 때 나는 것이 땀이에요. sweat = 땀을 흘리다.","c":3},"h":"1ab3506f39"},{"n":6,"t":"ref","q":"What does the underlined \"These\" refer to?\nThese can move up to your nose and make your nose burn.","ko":"밑줄 친 These가 가리키는 것은?","opts":["빨간 고추들","와사비의 작은 분자들","감각 수용기들","김치와 초밥"],"sko":"이것들은 코로 올라가서 당신의 코를 얼얼하게 할 수 있다.","r":{"a":"2) 와사비의 작은 분자들","ev":"12~13번 문장","s":[[12,"It has small molecules.","그것에는 작은 분자들이 있다."],[13,"These can move up to your nose and make your nose burn.","이것들은 코로 올라가서 당신의 코를 얼얼하게 할 수 있다."]],"w":"바로 앞 12번에서 와사비에는 작은 분자들(small molecules)이 있다고 했어요. These는 복수이고 코로 올라가는 것은 그 분자들이에요.","c":2},"h":"2abc0446ab"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, when you eat chilies, your mouth feels like it’s burning.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["고추를 먹으면 입이 얼음처럼 차갑게 느껴진다.","고추를 먹으면 입이 불에 타서 실제로 다친다.","고추를 먹으면 입이 불타고 있는 것처럼 느껴진다.","입이 불타는 것처럼 느껴져서 고추를 더 먹고 싶어진다."],"sko":"따라서, 당신이 고추를 먹으면, 입은 불 타고 있는 것처럼 느껴진다.","r":{"a":"3) 고추를 먹으면 입이 불타고 있는 것처럼 느껴진다.","ev":"6번 문장","s":[[6,"So, when you eat chilies, your mouth feels like it’s burning.","따라서, 당신이 고추를 먹으면, 입은 불 타고 있는 것처럼 느껴진다."]],"w":"feel like ~는 '~처럼 느껴지다'예요. 실제로 불에 타는 것이 아니라 그렇게 느껴지는 것이고, 차갑다는 말도 없어요.","c":3},"h":"c2e1c646f4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Chilies make your nose burn, but wasabi makes your tongue burn.","The receptor for spicy food is different from the one for extreme heat.","Large molecules of chilies move up to your nose.","The small molecules of wasabi can move up to your nose."],"oko":["고추는 코를 얼얼하게 하고, 와사비는 혀를 얼얼하게 한다.","매운 음식에 반응하는 수용기는 극심한 열기에 반응하는 것과 다르다.","고추의 큰 분자들은 코로 올라간다.","와사비의 작은 분자들은 코로 올라갈 수 있다."],"r":{"a":"4) The small molecules of wasabi can move up to your nose.","ev":"10, 12, 13번 문장","s":[[10,"They stay in your mouth.","그것들은 입안에 머무른다."],[12,"It has small molecules.","그것에는 작은 분자들이 있다."],[13,"These can move up to your nose and make your nose burn.","이것들은 코로 올라가서 당신의 코를 얼얼하게 할 수 있다."]],"w":"와사비의 작은 분자는 코로 올라가요(12~13번). 혀는 고추, 코는 와사비예요(1번). 수용기는 같고(5번), 큰 분자는 입안에 머물러요(10번).","c":4},"h":"d1de61a503"},{"n":9,"t":"sum","q":"Chilies have (A) molecules that stay in your mouth, but wasabi has (B) molecules that can move up to your nose.","ko":"고추에는 입안에 머무르는 (A) 분자가, 와사비에는 코로 올라갈 수 있는 (B) 분자가 있다.","opts":["(A) small / (B) large","(A) light / (B) small","(A) small / (B) small","(A) light / (B) large","(A) large / (B) small"],"oko":["(A) 작은 / (B) 큰","(A) 가벼운 / (B) 작은","(A) 작은 / (B) 작은","(A) 가벼운 / (B) 큰","(A) 큰 / (B) 작은"],"r":{"a":"5) (A) large / (B) small","ev":"9, 10, 12, 13번 문장","s":[[9,"Chilies have large and heavy molecules.","고추에는 크고 무거운 분자들이 있다."],[10,"They stay in your mouth.","그것들은 입안에 머무른다."],[12,"It has small molecules.","그것에는 작은 분자들이 있다."],[13,"These can move up to your nose and make your nose burn.","이것들은 코로 올라가서 당신의 코를 얼얼하게 할 수 있다."]],"w":"고추는 크고 무거운 분자(9번), 와사비는 작은 분자(12번)예요. 그래서 고추는 입안에, 와사비는 코로 가요.","c":5},"h":"54494add5d"},{"n":10,"t":"fill","q":"When you eat chilies, your brain thinks your mouth is on [A], so you start to [B] and turn red.","ko":"고추를 먹으면 뇌는 입이 [A]에 있다고 생각해서, 당신은 [B]하고 얼굴이 빨개지기 시작한다.","bank":["fire","sweat","nose","wasabi","kimchi","receptor"],"bko":{"fire":"불","sweat":"땀을 흘리다","nose":"코","wasabi":"와사비","kimchi":"김치","receptor":"수용기"},"r":{"a":"[A] fire, [B] sweat","ev":"7~8번 문장","s":[[7,"Your brain actually thinks your mouth is on fire.","뇌는 실제로 당신의 입이 불타고 있다고 생각한다."],[8,"That’s why you start to sweat and turn red.","그것이 바로 당신이 땀을 흘리고 얼굴이 빨개지기 시작하는 이유이다."]],"w":"7번에서 뇌는 입이 on fire(불타고 있다)라고 생각하고, 8번에서 그래서 sweat(땀을 흘리다)하고 빨개져요. 나머지는 이 문장에 들어가면 뜻이 맞지 않아요.","c":null},"h":"1dbdd2b6e1"}]},{"u":7,"id":"rt3-07-2","no":2,"ko":"선크림을 고를 때 주의하세요!","items":[{"n":1,"t":"tf","q":"Some kinds of sunscreen are illegal in Hawaii.","ko":"하와이에서는 일부 자외선 차단제가 불법이다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Sunscreen with oxybenzone and octinoxate is illegal in Hawaii.","하와이에서 옥시벤존과 옥티녹세이트가 들어 있는 자외선 차단제는 불법이다."]],"w":"1번에서 옥시벤존과 옥티녹세이트가 들어 있는 자외선 차단제가 하와이에서 불법이라고 해요.","c":"T"},"h":"b59cc9dcc4"},{"n":2,"t":"tf","q":"Fourteen thousand tons of sunscreen get into the ocean every month.","ko":"매달 1만 4천 톤의 자외선 차단제가 바다로 들어간다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Fourteen thousand tons of sunscreen get into the ocean every year in this way.","이런 식으로 매년 1만 4천 톤의 자외선 차단제가 바다로 들어간다."]],"w":"8번에서 1만 4천 톤은 every year(매년) 바다로 들어간다고 해요. 매달이 아니에요.","c":"F"},"h":"92d42c45dd"},{"n":3,"t":"tf","q":"Many sea animals lose their homes because coral reefs are killed.","ko":"산호초가 죽기 때문에 많은 해양 동물들이 서식지를 잃는다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~12번 문장","s":[[10,"These chemicals kill coral reefs.","이 화학 물질들은 산호초를 죽인다."],[11,"Also, many sea animals live in the coral reefs.","또한, 많은 해양 동물들이 산호초에 산다."],[12,"They lose their homes.","그들은 서식지를 잃는 것이다."]],"w":"10번에서 화학 물질이 산호초를 죽이고, 11번에서 많은 해양 동물이 산호초에 살며, 12번에서 그들이 서식지를 잃는다고 해요.","c":"T"},"h":"dae9f6c3c1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Oxybenzone and octinoxate in sunscreen prevent coral from growing normally.)","ko":"자외선 차단제에 들어 있는 옥시벤존과 옥티녹세이트는 산호가 정상적으로 자라는 것을 방해한다. (prevent는 막다)","opts":["돕는다","방해한다","만들어 낸다","허락한다"],"word":"prevent","r":{"a":"2) 방해한다","ev":"9번 문장","s":[[9,"Oxybenzone and octinoxate in sunscreen prevent coral from growing normally.","자외선 차단제에 들어 있는 옥시벤존과 옥티녹세이트는 산호가 정상적으로 자라는 것을 방해한다."]],"w":"prevent A from -ing는 'A가 ~하는 것을 막다'예요. 이 물질은 산호가 자라는 것을 막아서 10번처럼 산호초를 죽여요.","c":2},"h":"446a5f9ebb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, choose your next sunscreen wisely!)","ko":"그러니, 다음 자외선 차단제를 현명하게 선택하라! (wisely는 현명하게)","opts":["현명하게","서둘러","몰래","우연히"],"word":"wisely","r":{"a":"1) 현명하게","ev":"15번 문장","s":[[15,"So, choose your next sunscreen wisely!","그러니, 다음 자외선 차단제를 현명하게 선택하라!"]],"w":"산호초를 지키는 쪽을 생각하며 고르라는 말이에요. wisely = 현명하게.","c":1},"h":"1615d73f8a"},{"n":6,"t":"ref","q":"What does the underlined \"These chemicals\" refer to?\nThese chemicals kill coral reefs.","ko":"밑줄 친 These chemicals가 가리키는 것은?","opts":["천연 자외선 차단제","관광객들","옥시벤존과 옥티녹세이트","해양 동물들"],"sko":"이 화학 물질들은 산호초를 죽인다.","r":{"a":"3) 옥시벤존과 옥티녹세이트","ev":"9~10번 문장","s":[[9,"Oxybenzone and octinoxate in sunscreen prevent coral from growing normally.","자외선 차단제에 들어 있는 옥시벤존과 옥티녹세이트는 산호가 정상적으로 자라는 것을 방해한다."],[10,"These chemicals kill coral reefs.","이 화학 물질들은 산호초를 죽인다."]],"w":"바로 앞 9번에서 산호가 자라는 것을 방해하는 것은 옥시벤존과 옥티녹세이트예요. 이 두 물질이 These chemicals예요.","c":3},"h":"b9fc2cba36"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Fourteen thousand tons of sunscreen get into the ocean every year in this way.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이런 식으로 매년 1만 4천 톤의 자외선 차단제가 바다로 들어간다.","바다에서 매년 1만 4천 톤의 자외선 차단제를 만든다.","1만 4천 톤의 자외선 차단제가 단 한 번 바다에 들어간 적이 있다.","이런 식으로 1만 4천 톤의 바다가 오염되어 있다."],"sko":"이런 식으로 매년 1만 4천 톤의 자외선 차단제가 바다로 들어간다.","r":{"a":"1) 이런 식으로 매년 1만 4천 톤의 자외선 차단제가 바다로 들어간다.","ev":"8번 문장","s":[[8,"Fourteen thousand tons of sunscreen get into the ocean every year in this way.","이런 식으로 매년 1만 4천 톤의 자외선 차단제가 바다로 들어간다."]],"w":"get into the ocean은 '바다로 들어간다', every year는 '매년'이에요. 만들어 내는 것도, 한 번뿐인 일도 아니에요.","c":1},"h":"228f4b85b8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The law against some sunscreens started on January 1, 2012.","Oxybenzone and octinoxate help coral grow normally.","Sea animals do not live in coral reefs.","Sunscreen is washed away in water when tourists swim."],"oko":["일부 자외선 차단제에 대한 법은 2012년 1월 1일에 시작되었다.","옥시벤존과 옥티녹세이트는 산호가 정상적으로 자라도록 돕는다.","해양 동물들은 산호초에 살지 않는다.","관광객이 수영할 때 자외선 차단제는 물에 씻겨 나간다."],"r":{"a":"4) Sunscreen is washed away in water when tourists swim.","ev":"2, 7, 9, 11번 문장","s":[[2,"The law took effect on January 1, 2021.","이 법은 2021년 1월 1일에 시행되었다."],[7,"But sunscreen is washed away in water when they swim.","그런데 그들이 수영을 할 때 자외선 차단제는 물에 씻겨나간다."],[9,"Oxybenzone and octinoxate in sunscreen prevent coral from growing normally.","자외선 차단제에 들어 있는 옥시벤존과 옥티녹세이트는 산호가 정상적으로 자라는 것을 방해한다."],[11,"Also, many sea animals live in the coral reefs.","또한, 많은 해양 동물들이 산호초에 산다."]],"w":"7번에서 관광객이 수영할 때 자외선 차단제가 물에 씻겨 나가요. 법은 2021년에 시행되었고(2번), 두 물질은 산호의 성장을 방해하며(9번), 해양 동물은 산호초에 살아요(11번).","c":4},"h":"a6a6387134"},{"n":9,"t":"sum","q":"Sunscreen with certain (A) hurts coral reefs, so Hawaii made it (B).","ko":"특정 (A)가 들어 있는 자외선 차단제는 산호초를 해쳐서 하와이는 그것을 (B)로 정했다.","opts":["(A) chemicals / (B) illegal","(A) chemicals / (B) free","(A) animals / (B) illegal","(A) samples / (B) natural","(A) tourists / (B) free"],"oko":["(A) 화학 물질 / (B) 불법","(A) 화학 물질 / (B) 무료","(A) 동물 / (B) 불법","(A) 견본 / (B) 천연","(A) 관광객 / (B) 무료"],"r":{"a":"1) (A) chemicals / (B) illegal","ev":"1, 9, 10번 문장","s":[[1,"Sunscreen with oxybenzone and octinoxate is illegal in Hawaii.","하와이에서 옥시벤존과 옥티녹세이트가 들어 있는 자외선 차단제는 불법이다."],[9,"Oxybenzone and octinoxate in sunscreen prevent coral from growing normally.","자외선 차단제에 들어 있는 옥시벤존과 옥티녹세이트는 산호가 정상적으로 자라는 것을 방해한다."],[10,"These chemicals kill coral reefs.","이 화학 물질들은 산호초를 죽인다."]],"w":"1번에서 옥시벤존과 옥티녹세이트가 든 자외선 차단제는 불법이고, 9~10번에서 이 화학 물질(chemicals)이 산호초를 죽여요. 무료(free)는 항공사 견본 이야기(13번)예요.","c":1},"h":"81ab91fed6"},{"n":10,"t":"fill","q":"A Hawaiian airline gave passengers free [A] of natural sunscreen, and changing your sunscreen is an easy way to go [B].","ko":"하와이의 한 항공사는 승객들에게 천연 자외선 차단제 무료 [A]을 주었고, 자외선 차단제를 바꾸는 것은 [B]적이 되는 쉬운 방법이다.","bank":["samples","green","tons","tourists","coral","ocean"],"bko":{"samples":"견본","green":"친환경적인","tons":"톤","tourists":"관광객들","coral":"산호","ocean":"바다"},"r":{"a":"[A] samples, [B] green","ev":"13~14번 문장","s":[[13,"As a solution, a Hawaiian airline gave passengers free samples of natural sunscreen!","해결책으로, 하와이의 한 항공사는 승객들에게 천연 자외선 차단제 무료 견본을 지급했다!"],[14,"Changing your sunscreen is an easy way to go green.","자외선 차단제를 바꾸는 것은 친환경적이 되는 쉬운 방법이다."]],"w":"13번에서 항공사가 free samples(무료 견본)를 주었고, 14번에서 go green(친환경적이 되다)이라고 해요. 나머지 단어는 이 자리에 넣으면 뜻이 맞지 않아요.","c":null},"h":"ed40977b17"}]},{"u":7,"id":"rt3-07-3","no":3,"ko":"소나기가 아니야","items":[{"n":1,"t":"tf","q":"Cicadas cannot sweat.","ko":"매미는 땀을 흘릴 수 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"That’s because cicadas cannot sweat.","그것은 매미가 땀을 흘릴 수 없기 때문이다."]],"w":"7번에서 매미가 소변을 자주 보는 것은 매미가 땀을 흘릴 수 없기 때문이라고 해요.","c":"T"},"h":"470ca72985"},{"n":2,"t":"tf","q":"Cicada pee is harmful to humans.","ko":"매미 오줌은 사람에게 해롭다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Luckily, cicada pee is not harmful to humans.","다행히도, 매미 오줌은 사람에게 해롭지 않다."]],"w":"4번에서 매미 오줌은 사람에게 해롭지 않다(not harmful)고 해요.","c":"F"},"h":"1433eb9b4f"},{"n":3,"t":"tf","q":"Cicadas can cool down in the hot summer by drinking liquid and peeing it out.","ko":"매미는 액체를 마시고 소변으로 내보내서 더운 여름에 열을 식힐 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8~9번 문장","s":[[8,"They drink liquid from the tree and pee it out frequently.","그들은 나무에서 나온 액체를 마시고 자주 소변을 본다."],[9,"By doing this, they can cool down during the hot summer!","이것을 함으로써, 그들은 더운 여름 동안 열을 식힐 수 있다!"]],"w":"8번에서 매미는 나무의 액체를 마시고 자주 소변을 보고, 9번에서 이렇게 해서 더운 여름에 열을 식힐 수 있다고 해요.","c":"T"},"h":"eb295f2222"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They drink liquid from the tree and pee it out frequently.)","ko":"그들은 나무에서 나온 액체를 마시고 자주 소변을 본다. (frequently는 자주)","opts":["거의 하지 않게","조용히","자주","빠르게"],"word":"frequently","r":{"a":"3) 자주","ev":"8번 문장","s":[[8,"They drink liquid from the tree and pee it out frequently.","그들은 나무에서 나온 액체를 마시고 자주 소변을 본다."]],"w":"6번에서 매미는 소변을 very often(매우 자주) 본다고 했어요. frequently = often = 자주.","c":3},"h":"8e932695b6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (And if you happen to feel a drop, don’t worry.)","ko":"그리고 우연히 한 방울을 느낀다면, 걱정하지 말아라. (happen to-v는 우연히 ~하다)","opts":["우연히 ~하다","일부러 ~하다","서둘러 ~하다","~하기를 거절하다"],"word":"happen","r":{"a":"1) 우연히 ~하다","ev":"12번 문장","s":[[12,"And if you happen to feel a drop, don’t worry—it’s harmless!","그리고 우연히 한 방울을 느낀다면, 걱정하지 말아라. 그것은 무해하다!"]],"w":"나무 밑을 걷다가 오줌 한 방울이 떨어지는 것은 일부러가 아닌 우연한 일이에요. happen to feel = 우연히 느끼다.","c":1},"h":"428a11266a"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey drink liquid from the tree and pee it out frequently.","ko":"밑줄 친 They가 가리키는 것은?","opts":["사람들","매미들","나무들","빗방울들"],"sko":"그들은 나무에서 나온 액체를 마시고 자주 소변을 본다.","r":{"a":"2) 매미들","ev":"7~8번 문장","s":[[7,"That’s because cicadas cannot sweat.","그것은 매미가 땀을 흘릴 수 없기 때문이다."],[8,"They drink liquid from the tree and pee it out frequently.","그들은 나무에서 나온 액체를 마시고 자주 소변을 본다."]],"w":"7번 주어가 cicadas예요. 8번의 They는 그 매미들이고, 나무에서 나온 액체를 마시는 쪽도 매미예요.","c":2},"h":"6d768a42a9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The best way is to wear a hat and never look up the trees in the summer.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["여름에 나무 아래에서 모자를 벗고 나무를 자주 올려다보는 것이 가장 좋다.","여름에는 모자를 쓰고 나무를 올려다보지 않는 것이 가장 좋은 방법이다.","여름에는 모자 대신 우산을 쓰고 걷는 것이 가장 좋은 방법이다.","여름에 나무를 올려다보며 모자를 던지는 것이 가장 좋은 방법이다."],"sko":"가장 좋은 방법은 모자를 쓰고 여름에 절대 나무를 올려다보지 않는 것이다.","r":{"a":"2) 여름에는 모자를 쓰고 나무를 올려다보지 않는 것이 가장 좋은 방법이다.","ev":"11번 문장","s":[[11,"The best way is to wear a hat and never look up the trees in the summer.","가장 좋은 방법은 모자를 쓰고 여름에 절대 나무를 올려다보지 않는 것이다."]],"w":"wear a hat은 '모자를 쓰다', never look up은 '절대 올려다보지 않다'예요. 우산이나 모자 던지기는 글에 없어요.","c":2},"h":"20ac397e68"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Cicadas can sweat a lot in summer.","Cicadas rarely pee.","Cicadas drink liquid from the tree and pee it out frequently.","Cicada pee is very dangerous to humans."],"oko":["매미는 여름에 땀을 많이 흘릴 수 있다.","매미는 소변을 거의 보지 않는다.","매미는 나무에서 나온 액체를 마시고 자주 소변을 본다.","매미 오줌은 사람에게 매우 위험하다."],"r":{"a":"3) Cicadas drink liquid from the tree and pee it out frequently.","ev":"4, 6, 7, 8번 문장","s":[[4,"Luckily, cicada pee is not harmful to humans.","다행히도, 매미 오줌은 사람에게 해롭지 않다."],[6,"Cicadas pee very often.","매미는 소변을 매우 자주 본다."],[7,"That’s because cicadas cannot sweat.","그것은 매미가 땀을 흘릴 수 없기 때문이다."],[8,"They drink liquid from the tree and pee it out frequently.","그들은 나무에서 나온 액체를 마시고 자주 소변을 본다."]],"w":"매미는 나무의 액체를 마시고 자주 소변을 봐요(8번). 땀은 흘릴 수 없고(7번), 소변은 매우 자주 보고(6번), 사람에게 해롭지 않아요(4번).","c":3},"h":"d5d2384254"},{"n":9,"t":"sum","q":"Cicadas cannot (A), so they drink liquid from the tree and (B) it out to cool down.","ko":"매미는 (A)할 수 없어서 나무의 액체를 마시고 열을 식히려고 그것을 (B)한다.","opts":["(A) sweat / (B) sweat","(A) pee / (B) sweat","(A) drink / (B) pee","(A) sweat / (B) pee","(A) pee / (B) drink"],"oko":["(A) 땀을 흘리다 / (B) 땀을 흘리다","(A) 소변을 보다 / (B) 땀을 흘리다","(A) 마시다 / (B) 소변을 보다","(A) 땀을 흘리다 / (B) 소변을 보다","(A) 소변을 보다 / (B) 마시다"],"r":{"a":"4) (A) sweat / (B) pee","ev":"7~9번 문장","s":[[7,"That’s because cicadas cannot sweat.","그것은 매미가 땀을 흘릴 수 없기 때문이다."],[8,"They drink liquid from the tree and pee it out frequently.","그들은 나무에서 나온 액체를 마시고 자주 소변을 본다."],[9,"By doing this, they can cool down during the hot summer!","이것을 함으로써, 그들은 더운 여름 동안 열을 식힐 수 있다!"]],"w":"7번에서 매미는 땀을 흘릴 수 없고(cannot sweat), 8번에서 액체를 마시고 소변을 봐요(pee it out). 9번에서 그렇게 열을 식혀요. 소변을 볼 수 없다거나 마실 수 없다는 말은 없어요.","c":4},"h":"ca82bf9d5b"},{"n":10,"t":"fill","q":"The best way to avoid cicada pee is to wear a [A] and never look [B] the trees in the summer.","ko":"매미 오줌을 피하는 가장 좋은 방법은 [A]를 쓰고 여름에 절대 나무를 [B]로 쳐다보지 않는 것이다.","bank":["hat","up","tree","liquid","summer","drop"],"bko":{"hat":"모자","up":"위로","tree":"나무","liquid":"액체","summer":"여름","drop":"방울"},"r":{"a":"[A] hat, [B] up","ev":"11번 문장","s":[[11,"The best way is to wear a hat and never look up the trees in the summer.","가장 좋은 방법은 모자를 쓰고 여름에 절대 나무를 올려다보지 않는 것이다."]],"w":"11번에서 wear a hat(모자를 쓰다), never look up(절대 올려다보지 않다)이에요. 나머지 단어는 wear 뒤나 look 뒤에 넣으면 말이 되지 않아요.","c":null},"h":"64041b5de6"}]},{"u":8,"id":"rt3-08-1","no":1,"ko":"랍스터의 숨겨진 과거","items":[{"n":1,"t":"tf","q":"Before the mid-1800s, lobster was a cheap food for slaves and prisoners.","ko":"1800년대 중반 이전에 랍스터는 노예와 죄수를 위한 저렴한 음식이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","w":"4번 문장에 lobster was so cheap that it was for slaves and prisoners라고 나와요. 너무 싸서 노예와 죄수를 위한 것이었다는 내용과 일치해요.","c":"T","s":[[4,"Before the mid-1800s, lobster was so cheap that it was for slaves and prisoners.","1800년대 중반 이전에 랍스터는 매우 저렴해서 노예와 죄수를 위한 것이었다."]]},"h":"1b289a5797"},{"n":2,"t":"tf","q":"Canning made lobster available only near the sea.","ko":"통조림 제조는 바다 가까이에서만 랍스터를 구할 수 있게 만들었다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","w":"7번에서 통조림 제조는 랍스터를 everywhere(모든 곳에서) 구할 수 있게 했고, 8번에서 바다에서 먼 곳에서도 즐길 수 있었다고 해요. 바다 가까이에서만이라는 말은 반대예요.","c":"F","s":[[7,"First, canning made lobster available everywhere.","첫째로, 통조림 제조는 모든 곳에서 랍스터를 구할 수 있게 만들었다."],[8,"People could enjoy it far away from the sea.","사람들은 바다로부터 먼 곳에서 랍스터를 즐길 수 있었다."]]},"h":"76315d72a6"},{"n":3,"t":"tf","q":"Canned lobster became very popular.","ko":"통조림 랍스터가 매우 인기 있게 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","w":"10번 문장에 canned lobster became very popular라고 그대로 나와요.","c":"T","s":[[10,"So, canned lobster became very popular.","그래서 통조림 랍스터가 매우 인기 있게 되었다."]]},"h":"e08900e43f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But two things changed this: the development of canned food and the introduction of railways.)","ko":"두 가지가 이를 바꿔 놓았다. 바로 통조림 식품의 발달과 철도의 도입이다.","opts":["철거","도입","수리","금지"],"r":{"a":"2) 도입","ev":"6번 문장","w":"6번에서 랍스터를 바꿔 놓은 두 가지가 통조림 식품의 발달과 철도의 '도입'이에요. 철도가 새로 들어오게 된 것이므로 introduction = 도입이에요.","c":2,"s":[[6,"But two things changed this: the development of canned food and the introduction of railways.","그러나 두 가지가 이를 바꿔 놓았다. 바로 통조림 식품의 발달과 철도의 도입이다."]]},"word":"introduction","h":"8a9c68b630"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As demand for lobster rose, the price rose too.)","ko":"랍스터에 대한 수요가 증가함에 따라, 가격 또한 올랐다.","opts":["재료","조리법","수요","값"],"r":{"a":"3) 수요","ev":"13번 문장","w":"13번은 랍스터를 찾는 사람이 늘어나자 가격이 올랐다는 말이에요. demand for lobster = 랍스터에 대한 수요예요. 값은 바로 뒤의 price예요.","c":3,"s":[[13,"As demand for lobster rose, the price rose too.","랍스터에 대한 수요가 증가함에 따라, 가격 또한 올랐다."]]},"word":"demand","h":"4e9a7c99d4"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey tried it for the first time and loved it!","ko":"밑줄 친 They가 가리키는 것은?","opts":["바다에서 먼 곳에 사는 사람들","통조림을 만든 사람들","노예와 죄수","랍스터를 잡는 어부들"],"r":{"a":"1) 바다에서 먼 곳에 사는 사람들","ev":"8~9번 문장","w":"9번의 They는 바로 앞 8번의 People, 즉 바다에서 먼 곳에서 랍스터를 즐길 수 있게 된 사람들이에요. 통조림 덕분에 처음 먹어 본 사람들이에요.","c":1,"s":[[8,"People could enjoy it far away from the sea.","사람들은 바다로부터 먼 곳에서 랍스터를 즐길 수 있었다."],[9,"They tried it for the first time and loved it!","그들은 그것을 처음으로 맛보았고 아주 좋아했다!"]]},"sko":"그들은 그것을 처음으로 맛보았고 아주 좋아했다!","h":"fa4c9dfe15"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But lobster was not always expensive like this.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["랍스터는 한 번도 비싼 적이 없다.","랍스터는 예전에 지금보다 더 비쌌다.","랍스터는 지금도 예전처럼 저렴하다.","랍스터는 예전에는 지금처럼 늘 비싼 음식은 아니었다."],"r":{"a":"4) 랍스터는 예전에는 지금처럼 늘 비싼 음식은 아니었다.","ev":"2~3번 문장","w":"not always는 '항상 ~인 것은 아닌'이에요. 2번에서 지금은 굉장히 비싸다고 했으니, 예전에는 지금처럼 비싸지 않았다는 뜻이에요. 4번에서 예전엔 매우 저렴했다고 이어져요.","c":4,"s":[[2,"Dishes with lobster are super expensive!","랍스터 요리는 굉장히 비싸다!"],[3,"But lobster was not always expensive like this.","그러나 랍스터가 항상 이렇게 비싼 것은 아니었다."]]},"sko":"그러나 랍스터가 항상 이렇게 비싼 것은 아니었다.","h":"38c9269c94"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Lobster was always a luxury food.","Lobster was even used as fish bait.","Canned lobster was not popular.","Railways took tourists away from the coast."],"r":{"a":"2) Lobster was even used as fish bait.","ev":"5번 문장","w":"5번에 It was even used as fish bait.이 나와요. 랍스터는 항상 고급 음식이 아니었고(3~4번), 통조림 랍스터는 인기를 얻었고(10번), 철도는 관광객이 해안에 가게 해 주었어요(11번).","c":2,"s":[[5,"It was even used as fish bait.","그것은 심지어 낚시 미끼로 사용되기도 했다."]]},"oko":["랍스터는 항상 고급 음식이었다.","랍스터는 심지어 낚시 미끼로 사용되기도 했다.","통조림 랍스터는 인기가 없었다.","철도는 관광객을 해안에서 멀어지게 했다."],"h":"6a7c5681fc"},{"n":9,"t":"sum","q":"Canned food made lobster (A) everywhere, and railways let tourists (B) the coast easily.","ko":"통조림 식품은 랍스터를 모든 곳에서 (A)하게 만들었고, 철도는 관광객들이 쉽게 해안을 (B)하게 했다.","opts":["(A) hidden / (B) visit","(A) available / (B) leave","(A) expensive / (B) avoid","(A) fresh / (B) leave","(A) available / (B) visit"],"r":{"a":"5) (A) available / (B) visit","ev":"7번, 11번 문장","w":"7번에서 통조림이 랍스터를 available(구할 수 있는) 하게 만들었고, 11번에서 철도가 관광객이 해안을 visit(방문하다) 하게 했어요.","c":5,"s":[[7,"First, canning made lobster available everywhere.","첫째로, 통조림 제조는 모든 곳에서 랍스터를 구할 수 있게 만들었다."],[11,"In addition, railways allowed tourists to visit the coast easily.","게다가, 철도는 관광객들이 쉽게 해안에 가는 것을 가능하게 했다."]]},"oko":["(A) 숨겨진 / (B) 방문하다","(A) 구할 수 있는 / (B) 떠나다","(A) 비싼 / (B) 피하다","(A) 신선한 / (B) 떠나다","(A) 구할 수 있는 / (B) 방문하다"],"h":"9bd609394b"},{"n":10,"t":"fill","q":"Because [A] for lobster rose, it finally became a [B] food.","ko":"랍스터에 대한 [A]가 증가했기 때문에, 랍스터는 마침내 [B] 음식이 되었다.","bank":["demand","luxury","railways","bait","prisoners","tourists"],"bko":{"demand":"수요","luxury":"고급의","railways":"철도","bait":"미끼","prisoners":"죄수들","tourists":"관광객들"},"r":{"a":"[A] demand, [B] luxury","ev":"13~14번 문장","w":"13번에서 수요(demand)가 늘자 가격이 올랐고, 14번에서 랍스터는 고급(luxury) 음식이 되었어요. [A] 뒤의 for lobster는 demand와 어울리고, [B]는 food를 꾸미는 말이라 luxury만 맞아요.","c":null,"s":[[13,"As demand for lobster rose, the price rose too.","랍스터에 대한 수요가 증가함에 따라, 가격 또한 올랐다."],[14,"Soon lobster became a luxury food.","곧 랍스터는 고급 음식이 되었다."]]},"h":"73bba7c453"}]},{"u":8,"id":"rt3-08-2","no":2,"ko":"숲에 마음을 담아","items":[{"n":1,"t":"tf","q":"Pedro planted the guitar-shaped forest for his wife.","ko":"Pedro는 아내를 위해 기타 모양의 숲을 심었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번에서 숲은 농부 Pedro Martin Ureta에 의해 그의 아내를 위해 심어졌다고 해요. 본문과 일치해요.","c":"T","s":[[3,"It was planted by farmer Pedro Martin Ureta for his wife.","그것은 아내를 위해 농부 Pedro Martin Ureta에 의해 심어졌다."]]},"h":"ae41e77ee5"},{"n":2,"t":"tf","q":"Pedro had a lot of free time to think about his wife's dream.","ko":"Pedro는 아내의 꿈에 대해 생각할 시간이 많았다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번에서 농장 생활이 바빠서 Pedro는 그것에 대해 생각할 시간이 없었다고 해요. 시간이 많았다는 말은 반대예요.","c":"F","s":[[7,"But farm life was busy, so Pedro did not have time to think about it.","그러나 농장 생활이 바빠서, Pedro는 그것에 대해 생각할 시간이 없었다."]]},"h":"861849b91a"},{"n":3,"t":"tf","q":"The strings of the guitar forest were made of cypress trees.","ko":"기타 숲의 줄은 사이프러스 나무로 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","w":"11번에서 사이프러스 나무는 본체와 별 모양의 구멍을 만들었고, 12번에서 줄은 푸른빛 유칼립투스로 만들어졌다고 해요. 줄이 사이프러스라는 말은 틀려요.","c":"F","s":[[11,"Cypress trees made up the body and star-shaped hole.","사이프러스 나무가 본체와 별 모양의 구멍을 구성했다."],[12,"The strings were made of blue eucalyptus.","기타 줄은 푸른빛의 유칼립투스로 만들어졌다."]]},"h":"18d9903705"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Years passed, and suddenly she died.)","ko":"여러 해가 흘렀고, 갑자기 그녀가 죽었다.","opts":["천천히","갑자기","조용히","다행히"],"r":{"a":"2) 갑자기","ev":"8번 문장","w":"여러 해가 흐르고 아내가 죽었다는 문장이에요. suddenly는 '갑자기'라서, 아내가 뜻밖에 죽었다는 느낌이에요.","c":2,"s":[[8,"Years passed, and suddenly she died.","여러 해가 흘렀고, 갑자기 그녀가 죽었다."]]},"word":"suddenly","h":"4acf244cf3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The memorial to his wife can be seen even from space!)","ko":"그의 아내를 위한 기념물은 심지어 우주에서도 볼 수 있다!","opts":["지도","농장","기념물","도로"],"r":{"a":"3) 기념물","ev":"14번 문장","w":"아내를 위해 만든 기타 숲이 우주에서도 보인다는 문장이에요. memorial은 기념하려고 만든 것, 즉 기념물이에요.","c":3,"s":[[14,"The memorial to his wife can be seen even from space!","그의 아내를 위한 기념물은 심지어 우주에서도 볼 수 있다!"]]},"word":"memorial","h":"f0d7ec75c9"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nPedro was very sad, but he remembered her dream.","ko":"밑줄 친 her가 가리키는 것은?","opts":["Pedro","Pedro의 아내","Pedro의 딸","양동이 모양의 농장"],"r":{"a":"2) Pedro의 아내","ev":"8~9번 문장","w":"8번에서 죽은 사람은 아내(she)예요. 9번에서 Pedro가 기억한 것은 그 아내의 꿈이므로 her = Pedro의 아내예요.","c":2,"s":[[8,"Years passed, and suddenly she died.","여러 해가 흘렀고, 갑자기 그녀가 죽었다."],[9,"Pedro was very sad, but he remembered her dream.","Pedro는 무척 슬펐지만, 그녀의 꿈을 기억했다."]]},"sko":"Pedro는 무척 슬펐지만, 그녀의 꿈을 기억했다.","h":"d52f217a4d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You can only see the shape from the sky.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그 형태는 땅에서만 볼 수 있다.","그 형태는 하늘에서는 볼 수 없다.","그 형태는 하늘과 땅 어디서나 볼 수 있다.","그 형태는 하늘에서만 볼 수 있다."],"r":{"a":"4) 그 형태는 하늘에서만 볼 수 있다.","ev":"2번 문장","w":"only는 '오직'이에요. from the sky는 '하늘에서'라서, 기타 모양은 하늘에서만 볼 수 있다는 뜻이에요.","c":4,"s":[[2,"You can only see the shape from the sky.","하늘에서만 그 형태를 볼 수 있다."]]},"sko":"하늘에서만 그 형태를 볼 수 있다.","h":"0932cf5a4e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Pedro designed the forest before his wife died.","The forest can be seen only from the ground.","Pedro's wife saw a farm that looked like a bucket.","Pedro's wife made a special farm in Argentina."],"r":{"a":"3) Pedro's wife saw a farm that looked like a bucket.","ev":"5번 문장","w":"5번에 아내가 한 농장을 보았는데 양동이처럼 보였다고 나와요. 숲은 아내가 죽은 뒤에 만들었고(8~10번), 땅이 아니라 하늘과 우주에서 보이며(2번, 14번), 아내는 특별한 농장을 만들지 못했어요(6~8번).","c":3,"s":[[5,"She saw a farm and it looked like a bucket.","그녀는 한 농장을 보았는데 그것은 양동이처럼 보였다."]]},"oko":["Pedro는 아내가 죽기 전에 숲을 디자인했다.","그 숲은 땅에서만 볼 수 있다.","Pedro의 아내는 양동이처럼 보이는 농장을 보았다.","Pedro의 아내는 아르헨티나에 특별한 농장을 만들었다."],"h":"f9eb68c537"},{"n":9,"t":"sum","q":"Pedro's wife wanted to make a (A) farm, but years passed and she (B).","ko":"Pedro의 아내는 (A) 농장을 만들기를 원했지만, 여러 해가 흘렀고 그녀는 (B).","opts":["(A) busy / (B) died","(A) special / (B) smiled","(A) bucket / (B) sold","(A) special / (B) died","(A) special / (B) forgot"],"r":{"a":"4) (A) special / (B) died","ev":"6번, 8번 문장","w":"6번에서 아내는 special(특별한) 농장을 만들고 싶어 했고, 8번에서 여러 해가 흐른 뒤 아내가 died(죽었다)고 해요.","c":4,"s":[[6,"She wanted to make a special farm too.","그녀 또한 특별한 농장을 만들기를 원했다."],[8,"Years passed, and suddenly she died.","여러 해가 흘렀고, 갑자기 그녀가 죽었다."]]},"oko":["(A) 바쁜 / (B) 죽었다","(A) 특별한 / (B) 미소 지었다","(A) 양동이 / (B) 팔았다","(A) 특별한 / (B) 죽었다","(A) 특별한 / (B) 잊었다"],"h":"822b0f51c0"},{"n":10,"t":"fill","q":"Pedro's [A] loved guitars, so he designed the guitar forest, and his four [B] helped plant the trees.","ko":"Pedro의 [A]는 기타를 아주 좋아해서 그는 기타 숲을 디자인했고, 그의 네 명의 [B]가 나무 심는 것을 도왔다.","bank":["wife","children","farmer","guitar","eucalyptus","cypress"],"bko":{"wife":"아내","children":"자녀들","farmer":"농부"
