s tuna companies promised to protect dolphins.","1990년에 몇몇 유명한 참치 회사들이 돌고래를 보호하겠다고 약속했다."],[7,"They put a Dolphin Safe label on their cans to show their promise.","그들은 약속을 보여 주기 위해 통조림에 '돌고래 안전(Dolphin Safe)' 라벨을 붙였다."]],"w":"6번에서 돌고래를 보호하겠다고 약속한 쪽은 some famous tuna companies예요. 7번에서 그 회사들이 약속을 보여 주려고 통조림에 라벨을 붙였어요.","c":1},"h":"5df4384927"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You can help too by choosing tuna with this small logo.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"여러분도 이 작은 로고가 붙은 참치를 선택함으로써 도울 수 있다.","opts":["이 로고가 없는 참치를 사야 돌고래를 도울 수 있다.","이 작은 로고가 붙은 참치를 고르면 여러분도 도울 수 있다.","작은 로고를 만들어 돌고래에게 붙여 주면 도울 수 있다.","새로운 법을 만드는 것만이 돌고래를 돕는 유일한 방법이다."],"r":{"a":"2) 이 작은 로고가 붙은 참치를 고르면 여러분도 도울 수 있다.","ev":"11번 문장","s":[[11,"You can help too by choosing tuna with this small logo.","여러분도 이 작은 로고가 붙은 참치를 선택함으로써 도울 수 있다."]],"w":"by choosing tuna with this small logo는 이 로고가 붙은 참치를 고름으로써라는 뜻이에요. 로고가 없는 참치를 사라는 말이 아니에요.","c":2},"h":"cd1200399c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["어선들은 돌고래에게서 멀리 떨어져 참치를 잡았다.","Dolphin Safe 라벨은 1980년대에 미국이 만들었다.","한 법이 누가 Dolphin Safe 라벨을 쓸 수 있는지를 규제한다.","돌고래들은 그물이 너무 작아서 죽었다."],"opts":["Tuna fishing boats stayed far away from dolphins.","The Dolphin Safe label was made by the United States in the 1980s.","A law controls who can use the Dolphin Safe label.","Dolphins died because the nets were too small."],"r":{"a":"3) A law controls who can use the Dolphin Safe label.","ev":"8~9번 문장","s":[[8,"After that, the United States made a law to strictly control the use of the label.","그 후, 미국은 그 라벨의 사용을 엄격하게 규제하는 법을 만들었다."],[9,"Now, only tuna companies that do not hurt dolphins can use it.","이제, 돌고래를 해치지 않는 참치 회사들만 그것을 사용할 수 있다."]],"w":"8번에서 미국이 라벨 사용을 엄격하게 규제하는 법을 만들었고, 9번에서 해치지 않는 회사만 쓸 수 있다고 해요. 어선들은 돌고래를 따라갔고(3번), 라벨은 1990년 회사들이 붙였고(6~7번), 돌고래는 숨을 못 쉬어 죽었어요(4번).","c":3},"h":"5c1e3429a3"},{"n":9,"t":"sum","q":"In the 1980s, tuna fishing (A) many dolphins. Later, the Dolphin Safe label helped (B) them.","ko":"1980년대에 참치잡이는 많은 돌고래를 (A)했다. 나중에 Dolphin Safe 라벨은 돌고래를 (B)하는 데 도움이 되었다.","oko":["(A) 구했다 / (B) 보호하다","(A) 죽였다 / (B) 잡다","(A) 구했다 / (B) 해치다","(A) 죽였다 / (B) 보호하다","(A) 도왔다 / (B) 잃다"],"opts":["(A) saved / (B) protect","(A) killed / (B) catch","(A) saved / (B) hurt","(A) killed / (B) protect","(A) helped / (B) lose"],"r":{"a":"4) (A) killed / (B) protect","ev":"1번, 10번 문장","s":[[1,"In the 1980s, many dolphins were killed from tuna fishing.","1980년대에 많은 돌고래가 참치잡이 때문에 죽었다."],[10,"These actions helped save many dolphins.","이러한 조치들은 많은 돌고래를 구하는 데 도움이 되었다."]],"w":"1번에서 참치잡이 때문에 많은 돌고래가 죽었고(killed), 10번에서 이후의 조치들이 많은 돌고래를 구하는 데 도움이 되었다고 해요. 라벨은 돌고래를 보호(protect)하려는 약속의 표시예요.","c":4},"h":"6ffdadb238"},{"n":10,"t":"fill","q":"Tuna companies put a Dolphin Safe [A] on their cans, and a [B] now controls the use of it.","ko":"참치 회사들은 통조림에 Dolphin Safe [A]을(를) 붙였고, 이제 [B]이(가) 그것의 사용을 규제한다.","bank":["label","law","promise","nets","fishing","change"],"bko":{"label":"라벨","law":"법","promise":"약속","nets":"그물","change":"변화","fishing":"고기잡이"},"r":{"a":"[A] label, [B] law","ev":"7~8번 문장","s":[[7,"They put a Dolphin Safe label on their cans to show their promise.","그들은 약속을 보여 주기 위해 통조림에 '돌고래 안전(Dolphin Safe)' 라벨을 붙였다."],[8,"After that, the United States made a law to strictly control the use of the label.","그 후, 미국은 그 라벨의 사용을 엄격하게 규제하는 법을 만들었다."]],"w":"7번에서 회사들이 통조림에 Dolphin Safe label을 붙였고, 8번에서 미국이 라벨의 사용을 규제하는 law를 만들었어요. promise는 라벨로 보여 주려는 것이고, nets는 문제 상황(3번)에 나오는 말이에요.","c":null},"h":"ba7712c629"}]},{"u":7,"id":"b1-07-3","no":3,"ko":"싸고 예쁜 옷이 지구에 남기는 것","items":[{"n":1,"t":"tf","q":"Fast fashion brings new clothes to stores almost every week.","ko":"패스트 패션은 거의 매주 새 옷을 매장에 들여온다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Fast fashion brings new clothes to stores almost every week.","패스트 패션은 거의 매주 새 옷을 매장에 들여온다."]],"w":"1번 문장에 Fast fashion brings new clothes to stores almost every week가 그대로 나와요.","c":"T"},"h":"c64387e66b"},{"n":2,"t":"tf","q":"Making clothes uses only a little water and energy.","ko":"옷을 만드는 데는 물과 에너지가 조금만 쓰인다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Making so many clothes uses a lot of water and energy.","그렇게 많은 옷을 만드는 데는 많은 물과 에너지가 쓰인다."]],"w":"4번 문장에서 옷을 만드는 데 많은 물과 에너지(a lot of water and energy)가 쓰인다고 해요. 조금만 쓰인다는 말은 반대예요.","c":"F"},"h":"d0f6b0c80d"},{"n":3,"t":"tf","q":"Many brands use plastic to keep prices low.","ko":"많은 브랜드가 가격을 낮게 유지하기 위해 플라스틱을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Even worse, many brands use plastic to keep prices low.","설상가상으로, 많은 브랜드가 가격을 낮게 유지하기 위해 플라스틱을 사용한다."]],"w":"9번 문장에서 many brands use plastic to keep prices low라고 해요.","c":"T"},"h":"8c29908c82"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They’re trendy and cheap, so people often buy more than they need.)","ko":"그 옷들은 유행을 따르고 값이 싸서, 사람들은 흔히 필요한 것보다 더 많이 산다. (trendy는 유행하는)","opts":["낡은","무거운","유행하는","비싼"],"word":"trendy","r":{"a":"3) 유행하는","ev":"2번 문장","s":[[2,"They’re trendy and cheap, so people often buy more than they need.","그 옷들은 유행을 따르고 값이 싸서, 사람들은 흔히 필요한 것보다 더 많이 산다."]],"w":"새 옷이 거의 매주 나오고(1번) 사람들이 필요 이상으로 사게 되는 이유예요. 싸고 유행하는 옷이니까 trendy = 유행하는이에요.","c":3},"h":"c63e22705e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Second, repair clothes instead of throwing them away.)","ko":"둘째, 옷을 버리는 대신 수선하라.","opts":["빌리다","수선하다","나누어 주다","새로 사다"],"word":"repair","r":{"a":"2) 수선하다","ev":"13번 문장","s":[[13,"Second, repair clothes instead of throwing them away.","둘째, 옷을 버리는 대신 수선하라."]],"w":"instead of throwing them away(버리는 대신)와 이어지니까, 버리지 않고 고쳐 입는 repair = 수선하다예요.","c":2},"h":"f74425a492"},{"n":6,"t":"ref","q":"What does the underlined \"These materials\" refer to?\nThese materials take hundreds of years to break down.","ko":"밑줄 친 These materials가 가리키는 것은?","sko":"이 소재들은 분해되는 데 수백 년이 걸린다.","opts":["물과 에너지","온실가스","오래된 옷","플라스틱"],"r":{"a":"4) 플라스틱","ev":"9~10번 문장","s":[[9,"Even worse, many brands use plastic to keep prices low.","설상가상으로, 많은 브랜드가 가격을 낮게 유지하기 위해 플라스틱을 사용한다."],[10,"These materials take hundreds of years to break down.","이 소재들은 분해되는 데 수백 년이 걸린다."]],"w":"바로 앞 9번에서 브랜드들이 가격을 낮게 유지하려고 쓰는 것은 plastic이에요. 10번의 These materials는 그 플라스틱 소재예요.","c":4},"h":"a01e3c650f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even worse, many brands use plastic to keep prices low.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"설상가상으로, 많은 브랜드가 가격을 낮게 유지하기 위해 플라스틱을 사용한다.","opts":["더 나쁜 점은, 많은 브랜드가 값을 낮게 유지하려고 플라스틱을 쓴다는 것이다.","더 좋은 점은, 많은 브랜드가 값을 올리려고 플라스틱 소재를 쓴다는 것이다.","많은 브랜드가 플라스틱 사용을 줄여서 값을 낮춘다.","많은 브랜드가 플라스틱 때문에 값이 계속 오른다고 말한다."],"r":{"a":"1) 더 나쁜 점은, 많은 브랜드가 값을 낮게 유지하려고 플라스틱을 쓴다는 것이다.","ev":"9번 문장","s":[[9,"Even worse, many brands use plastic to keep prices low.","설상가상으로, 많은 브랜드가 가격을 낮게 유지하기 위해 플라스틱을 사용한다."]],"w":"Even worse는 더 나쁜 점은이라는 뜻이고, to keep prices low는 가격을 낮게 유지하기 위해라는 뜻이에요. 플라스틱을 줄인다는 말은 없어요.","c":1},"h":"0e1bc1ec8d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["패스트 패션은 새 옷을 일 년에 한 번만 들여온다.","패스트 패션은 세계 온실가스의 1%보다 적게 만든다.","사람들은 최신 스타일을 사면서 오래된 옷을 버린다.","플라스틱 소재는 며칠이면 분해된다."],"opts":["Fast fashion brings new clothes to stores only once a year.","Fast fashion makes less than 1% of the world’s greenhouse gases.","People throw away old clothes when they buy the latest styles.","Plastic materials break down in a few days."],"r":{"a":"3) People throw away old clothes when they buy the latest styles.","ev":"7번 문장","s":[[7,"People buy the latest styles and throw away their old clothes.","사람들은 최신 스타일을 사고 오래된 옷을 버린다."]],"w":"7번에서 사람들은 최신 스타일을 사고 오래된 옷을 버려요. 새 옷은 거의 매주 들어오고(1번), 온실가스는 4%이며(5번), 플라스틱은 분해에 수백 년이 걸려요(10번).","c":3},"h":"ddf7823608"},{"n":9,"t":"sum","q":"Fast fashion (A) too much trash, so we should buy (B) clothing and repair our clothes.","ko":"패스트 패션은 너무 많은 쓰레기를 (A)하므로, 우리는 옷을 (B) 사고 옷을 수선해야 한다.","oko":["(A) 깨끗이 치운다 / (B) 덜","(A) 만든다 / (B) 더 많이","(A) 줄인다 / (B) 더 많이","(A) 아낀다 / (B) 덜","(A) 만든다 / (B) 덜"],"opts":["(A) cleans / (B) less","(A) creates / (B) more","(A) reduces / (B) more","(A) saves / (B) less","(A) creates / (B) less"],"r":{"a":"5) (A) creates / (B) less","ev":"7~8번, 12~13번 문장","s":[[7,"People buy the latest styles and throw away their old clothes.","사람들은 최신 스타일을 사고 오래된 옷을 버린다."],[8,"This creates too much trash.","이것은 너무 많은 쓰레기를 만든다."],[12,"First, buy less clothing.","첫째, 옷을 덜 사라."],[13,"Second, repair clothes instead of throwing them away.","둘째, 옷을 버리는 대신 수선하라."]],"w":"7~8번에서 오래된 옷을 버려 너무 많은 쓰레기를 만들어 내고(creates), 12~13번에서 해결책은 옷을 덜 사고(less) 수선하는 거예요.","c":5},"h":"a3f4ae4525"},{"n":10,"t":"fill","q":"Fast fashion makes 4% of the world’s [A] gases, which change our [B].","ko":"패스트 패션은 세계 [A] 가스의 4%를 만들어 내고, 이 가스는 우리의 [B]을(를) 변화시킨다.","bank":["greenhouse","climate","plastic","trash","water","brands"],"bko":{"greenhouse":"온실","climate":"기후","plastic":"플라스틱","trash":"쓰레기","water":"물","brands":"브랜드들"},"r":{"a":"[A] greenhouse, [B] climate","ev":"5번 문장","s":[[5,"Fast fashion makes 4% of the world’s greenhouse gases, which change our climate.","패스트 패션은 세계 온실가스의 4%를 만들어 내는데, 이 가스는 우리의 기후를 변화시킨다."]],"w":"5번 문장 Fast fashion makes 4% of the world’s greenhouse gases, which change our climate에서 가져왔어요. brands(브랜드들)와 water(물)는 이 문장의 빈칸에 들어가면 뜻이 맞지 않아요.","c":null},"h":"21602819de"}]},{"u":7,"id":"b1-07-4","no":4,"ko":"버린 플라스틱이 내 몸으로 돌아온다고?","items":[{"n":1,"t":"tf","q":"Sunlight and waves break plastic into very tiny pieces in the ocean.","ko":"바다에서 햇빛과 파도는 플라스틱을 아주 작은 조각으로 부순다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In the ocean, sunlight and waves slowly break plastic into very tiny pieces.","바다에서는 햇빛과 파도가 플라스틱을 아주 작은 조각으로 서서히 부순다."]],"w":"6번 문장에서 In the ocean, sunlight and waves slowly break plastic into very tiny pieces라고 해요.","c":"T"},"h":"d15ac66f2d"},{"n":2,"t":"tf","q":"Plastic trash stays where it is thrown and never moves.","ko":"플라스틱 쓰레기는 버려진 자리에 그대로 있고 절대 움직이지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"It does not just stay there.","그것은 그냥 그곳에 머물러 있지 않는다."],[4,"When it rains, rainwater carries plastic trash into nearby rivers.","비가 오면, 빗물이 플라스틱 쓰레기를 근처 강으로 실어 나른다."]],"w":"3번에서 It does not just stay there(그냥 그곳에 머물지 않는다)라고 하고, 4번에서 비가 오면 빗물이 강으로 실어 나른다고 해요.","c":"F"},"h":"58fdfd3a2d"},{"n":3,"t":"tf","q":"Plastic moves up the food chain from plankton to larger fish.","ko":"플라스틱은 플랑크톤에서 더 큰 물고기로 먹이 사슬을 따라 올라간다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"Then, larger fish eat the plankton.","그다음, 더 큰 물고기들이 그 플랑크톤을 먹는다."],[10,"This is how plastic moves up the food chain.","이것이 플라스틱이 먹이 사슬을 따라 올라가는 방식이다."]],"w":"9번에서 더 큰 물고기가 플랑크톤을 먹고, 10번에서 이것이 플라스틱이 먹이 사슬을 따라 올라가는 방식이라고 해요.","c":"T"},"h":"c505dd0dd3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When it rains, rainwater carries plastic trash into nearby rivers.)","ko":"비가 오면, 빗물이 플라스틱 쓰레기를 근처 강으로 실어 나른다. (carry는 실어 나르다)","opts":["막는다","녹인다","멈춘다","실어 나른다"],"word":"carries","r":{"a":"4) 실어 나른다","ev":"4~5번 문장","s":[[4,"When it rains, rainwater carries plastic trash into nearby rivers.","비가 오면, 빗물이 플라스틱 쓰레기를 근처 강으로 실어 나른다."],[5,"Over time, the trash flows into the ocean.","시간이 지나면서, 그 쓰레기는 바다로 흘러간다."]],"w":"4번에서 빗물이 쓰레기를 강으로 옮기고, 5번에서 그 쓰레기가 시간이 지나 바다로 흘러가요. carries = 실어 나른다.","c":4},"h":"88ab41c867"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To stop this cycle, we should use less plastic and recycle it properly.)","ko":"이 순환을 멈추기 위해, 우리는 플라스틱을 덜 쓰고 올바르게 재활용해야 한다.","opts":["올바르게","빠르게","몰래","거의"],"word":"properly","r":{"a":"1) 올바르게","ev":"12번 문장","s":[[12,"To stop this cycle, we should use less plastic and recycle it properly.","이 순환을 멈추기 위해, 우리는 플라스틱을 덜 쓰고 올바르게 재활용해야 한다."]],"w":"플라스틱이 우리 몸으로 돌아오는 순환(1~11번)을 멈추려면 제대로 재활용해야 해요. properly = 올바르게.","c":1},"h":"381ac4853f"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSmall creatures like plankton think they are food and eat them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"플랑크톤 같은 작은 생물들은 그것들을 먹이라고 생각하고 먹는다.","opts":["플랑크톤","미세 플라스틱","더 큰 물고기","강물"],"r":{"a":"2) 미세 플라스틱","ev":"7~8번 문장","s":[[7,"These pieces are called microplastics.","이 조각들은 미세 플라스틱이라고 불린다."],[8,"Small creatures like plankton think they are food and eat them.","플랑크톤 같은 작은 생물들은 그것들을 먹이라고 생각하고 먹는다."]],"w":"7번에서 플라스틱의 아주 작은 조각을 microplastics(미세 플라스틱)라고 불러요. 8번에서 플랑크톤은 그 미세 플라스틱을 먹이로 착각하고 먹어요.","c":2},"h":"2835d08520"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"To stop this cycle, we should use less plastic and recycle it properly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 순환을 멈추기 위해, 우리는 플라스틱을 덜 쓰고 올바르게 재활용해야 한다.","opts":["이 순환을 멈추려면 플라스틱을 더 많이 쓰고 버려야 한다.","이 순환은 멈출 수 없으니 해산물을 먹지 말아야 한다.","이 순환을 멈추려면 플라스틱을 덜 쓰고 올바르게 재활용해야 한다.","이 순환을 멈추려면 플라스틱을 모두 바다에 모아야 한다."],"r":{"a":"3) 이 순환을 멈추려면 플라스틱을 덜 쓰고 올바르게 재활용해야 한다.","ev":"12번 문장","s":[[12,"To stop this cycle, we should use less plastic and recycle it properly.","이 순환을 멈추기 위해, 우리는 플라스틱을 덜 쓰고 올바르게 재활용해야 한다."]],"w":"less plastic은 플라스틱을 덜, recycle it properly는 올바르게 재활용하라는 뜻이에요. 해산물을 먹지 말라거나 바다에 모으자는 말은 없어요.","c":3},"h":"6f71c0c920"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["땅에 버린 플라스틱 쓰레기는 곧바로 사라진다.","더 큰 물고기는 미세 플라스틱을 먹은 플랑크톤을 먹는다.","미세 플라스틱은 강에서 온 커다란 플라스틱 덩어리다.","사람은 자신이 버린 플라스틱의 영향을 받지 않는다."],"opts":["Plastic trash disappears as soon as it is thrown on the ground.","Larger fish eat plankton that have eaten microplastics.","Microplastics are big pieces of plastic from rivers.","People are not affected by the plastic they throw away."],"r":{"a":"2) Larger fish eat plankton that have eaten microplastics.","ev":"8~9번 문장","s":[[8,"Small creatures like plankton think they are food and eat them.","플랑크톤 같은 작은 생물들은 그것들을 먹이라고 생각하고 먹는다."],[9,"Then, larger fish eat the plankton.","그다음, 더 큰 물고기들이 그 플랑크톤을 먹는다."]],"w":"8번에서 플랑크톤이 미세 플라스틱을 먹고, 9번에서 더 큰 물고기가 그 플랑크톤을 먹어요. 플라스틱은 사라지지 않고 이동하며(3번), 미세 플라스틱은 아주 작은 조각이고(6~7번), 결국 우리 몸에 들어와요(11번).","c":2},"h":"a563ce04cd"},{"n":9,"t":"sum","q":"Plastic trash flows into the (A), breaks into tiny pieces, and finally (B) our bodies through seafood.","ko":"플라스틱 쓰레기는 (A)(으)로 흘러가 작은 조각으로 부서지고, 결국 해산물을 통해 우리 몸에 (B).","oko":["(A) 산 / (B) 들어온다","(A) 바다 / (B) 떠난다","(A) 바다 / (B) 피한다","(A) 하늘 / (B) 들어온다","(A) 바다 / (B) 들어온다"],"opts":["(A) mountain / (B) enters","(A) ocean / (B) leaves","(A) ocean / (B) avoids","(A) sky / (B) enters","(A) ocean / (B) enters"],"r":{"a":"5) (A) ocean / (B) enters","ev":"5번, 11번 문장","s":[[5,"Over time, the trash flows into the ocean.","시간이 지나면서, 그 쓰레기는 바다로 흘러간다."],[11,"Finally, when we eat seafood, the plastic we threw away enters our own bodies.","마침내, 우리가 해산물을 먹으면, 우리가 버린 플라스틱이 우리 자신의 몸속으로 들어온다."]],"w":"5번에서 쓰레기가 바다(ocean)로 흘러가고, 11번에서 우리가 해산물을 먹으면 플라스틱이 우리 몸속으로 들어와요(enters).","c":5},"h":"d63caf5fcd"},{"n":10,"t":"fill","q":"Sunlight and waves [A] plastic into tiny pieces called [B].","ko":"햇빛과 파도는 플라스틱을 [B](이)라고 불리는 작은 조각으로 [A].","bank":["break","microplastics","rivers","plankton","recycle","seafood"],"bko":{"break":"부수다","microplastics":"미세 플라스틱","rivers":"강","plankton":"플랑크톤","recycle":"재활용하다","seafood":"해산물"},"r":{"a":"[A] break, [B] microplastics","ev":"6~7번 문장","s":[[6,"In the ocean, sunlight and waves slowly break plastic into very tiny pieces.","바다에서는 햇빛과 파도가 플라스틱을 아주 작은 조각으로 서서히 부순다."],[7,"These pieces are called microplastics.","이 조각들은 미세 플라스틱이라고 불린다."]],"w":"6번에서 햇빛과 파도가 플라스틱을 아주 작은 조각으로 break(부수다)하고, 7번에서 그 조각들을 microplastics라고 불러요. plankton과 seafood는 그 조각을 먹는 쪽(8~11번) 이야기예요.","c":null},"h":"5a809af8ac"}]},{"u":8,"id":"b1-08-1","no":1,"ko":"여성은 못 달린다던 마라톤, 이름을 바꿔 출발선에 선 그녀","items":[{"n":1,"t":"tf","q":"Many people thought long-distance running was too dangerous for women.","ko":"많은 사람들은 장거리 달리기가 여성에게 너무 위험하다고 생각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에 people thought that running such a long distance was too dangerous for women이 그대로 나와요. 일치해요.","c":"T","s":[[2,"For many years, people thought that running such a long distance was too dangerous for women.","오랜 세월 동안 사람들은 그렇게 먼 거리를 달리는 것은 여성에게 너무 위험하다고 생각했다."]]},"h":"efac53d1f2"},{"n":2,"t":"tf","q":"An official helped Kathrine and let her keep running.","ko":"한 관계자가 캐서린을 도와주어 계속 달리게 했다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","w":"8번에서 관계자는 그녀를 도운 게 아니라 막으려(tried to stop her) 했어요. 그래도 9번에서 캐서린은 포기하지 않았어요.","c":"F","s":[[8,"After a few miles, an official saw her and tried to stop her.","몇 마일을 달린 뒤, 한 관계자가 그녀를 보고 그녀를 막으려 했다."],[9,"But Kathrine did not give up.","하지만 캐서린은 포기하지 않았다."]]},"h":"eaee55e116"},{"n":3,"t":"tf","q":"Kathrine finished the entire race.","ko":"캐서린은 경주 전체를 완주했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","w":"10번 문장에 She kept running and finished the entire race.가 있어요. 끝까지 완주했어요.","c":"T","s":[[10,"She kept running and finished the entire race.","그녀는 계속 달려서 경주 전체를 완주했다."]]},"h":"c69bd8655e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...a woman named Kathrine Switzer decided to challenge this idea.)","ko":"캐서린 스위처라는 한 여성이 이 생각에 도전하기로 결심했다.","opts":["받아들이다","피하다","맞서 도전하다","설명하다"],"word":"challenge","r":{"a":"3) 맞서 도전하다","ev":"4번 문장","w":"여성은 위험해서 달릴 수 없다는 2번의 생각을 캐서린이 그대로 받아들인 게 아니에요. 이 생각에 맞서 보기로 한 거예요. challenge = 도전하다, 맞서다.","c":3,"s":[[4,"In 1967, a woman named Kathrine Switzer decided to challenge this idea.","1967년에 캐서린 스위처라는 한 여성이 이 생각에 도전하기로 결심했다."]]},"h":"0cf22eb4ee"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (She kept running and finished the entire race.)","ko":"그녀는 계속 달려서 경주 전체를 완주했다.","opts":["짧은","일부의","위험한","전체의"],"word":"entire","r":{"a":"4) 전체의","ev":"10번 문장","w":"끝까지 완주했다고 했으니 entire race는 경주 전체예요. 일부만 달린 게 아니에요. entire = 전체의.","c":4,"s":[[10,"She kept running and finished the entire race.","그녀는 계속 달려서 경주 전체를 완주했다."]]},"h":"663760c514"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nAfter a few miles, an official saw her and tried to stop her.","ko":"밑줄 친 her가 가리키는 것은?","sko":"몇 마일을 달린 뒤, 한 관계자가 그녀를 보고 그녀를 막으려 했다.","opts":["주최 측 사람","캐서린","경기를 보던 다른 여성","보스턴 마라톤"],"r":{"a":"2) 캐서린","ev":"7~8번 문장","w":"7번에서 달리기를 시작한 사람은 캐서린이에요. 8번에서 관계자가 본 사람, 막으려 한 사람이 바로 캐서린이에요.","c":2,"s":[[7,"On the day of the race, Kathrine started running.","경주 날, 캐서린은 달리기 시작했다."],[8,"After a few miles, an official saw her and tried to stop her.","몇 마일을 달린 뒤, 한 관계자가 그녀를 보고 그녀를 막으려 했다."]]},"h":"cd9139a5b2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Her brave run proved that women could run long distances too.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀의 용감한 달리기는 여성도 장거리를 달릴 수 있다는 것을 증명했다.","opts":["그녀의 달리기는 장거리 달리기가 여성에게 위험하다는 것을 보여 주었다.","그녀의 달리기는 남자만 장거리를 달릴 수 있음을 보여 주었다.","그녀의 달리기 때문에 보스턴 마라톤이 사라졌다.","그녀의 달리기는 여성도 장거리를 달릴 수 있음을 보여 주었다."],"r":{"a":"4) 그녀의 달리기는 여성도 장거리를 달릴 수 있음을 보여 주었다.","ev":"11번 문장","w":"proved that ~는 '~을 증명했다'예요. 캐서린이 완주해서 여성도 장거리를 달릴 수 있다는 걸 보여 준 거예요. 나머지는 11번과 반대이거나 본문에 없는 내용이에요.","c":4,"s":[[11,"Her brave run proved that women could run long distances too.","그녀의 용감한 달리기는 여성도 장거리를 달릴 수 있다는 것을 증명했다."]]},"h":"ab5709a2bf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["여성은 처음부터 보스턴 마라톤에 출전할 수 있었다.","주최 측은 K.V. Switzer가 여성인 것을 알고 있었다.","여성들은 1972년에 보스턴 마라톤에 공식 선수로 출전할 수 있게 되었다.","캐서린은 몇 마일을 달린 뒤 달리기를 멈췄다."],"opts":["Women were allowed to run in the Boston Marathon from the beginning.","The organizers knew that K.V. Switzer was a woman.","Women became official runners in the Boston Marathon in 1972.","Kathrine stopped running after a few miles."],"r":{"a":"3) Women became official runners in the Boston Marathon in 1972.","ev":"12번 문장","w":"12번에서 1972년에 여성들이 공식 선수로 달릴 수 있게 되었다고 해요. 첫째 선지는 3번(허용되지 않음), 둘째 선지는 6번(남자라고 생각함), 넷째 선지는 9~10번(포기하지 않고 완주)과 반대예요.","c":3,"s":[[12,"In 1972, women were finally allowed to run in the Boston Marathon as official runners.","1972년에 여성들은 마침내 공식 선수로서 보스턴 마라톤에서 달리는 것이 허용되었다."]]},"h":"3fb4f1675a"},{"n":9,"t":"sum","q":"Kathrine's brave run showed that women could (A) long distances, and in 1972 women were finally (B) to run as official runners.","ko":"캐서린의 용감한 달리기는 여성도 장거리를 (A)할 수 있음을 보여 주었고, 1972년에 여성들은 마침내 공식 선수로 달리도록 (B)되었다.","oko":["(A) 달릴 / (B) 멈추게","(A) 피할 / (B) 허용","(A) 달릴 / (B) 허용","(A) 피할 / (B) 초대","(A) 멈출 / (B) 멈추게"],"opts":["(A) run / (B) stopped","(A) avoid / (B) allowed","(A) run / (B) allowed","(A) avoid / (B) invited","(A) stop / (B) stopped"],"r":{"a":"3) (A) run / (B) allowed","ev":"11~12번 문장","w":"11번에서 여성도 장거리를 달릴 수 있다(run)고 증명했고, 12번에서 마침내 달리는 것이 허용되었다(allowed)고 해요.","c":3,"s":[[11,"Her brave run proved that women could run long distances too.","그녀의 용감한 달리기는 여성도 장거리를 달릴 수 있다는 것을 증명했다."],[12,"In 1972, women were finally allowed to run in the Boston Marathon as official runners.","1972년에 여성들은 마침내 공식 선수로서 보스턴 마라톤에서 달리는 것이 허용되었다."]]},"h":"231c5439d9"},{"n":10,"t":"fill","q":"Kathrine signed up for the race using the name K.V. [A], so the organizers thought she was a [B].","ko":"캐서린은 K.V. [A]라는 이름을 사용해 경주에 등록했고, 그래서 주최 측은 그녀가 [B]라고 생각했다.","bank":["Switzer","man","woman","Boston","official","runner"],"bko":{"Switzer":"스위처","man":"남자","woman":"여자","Boston":"보스턴","official":"관계자","runner":"주자"},"r":{"a":"[A] Switzer, [B] man","ev":"5~6번 문장","w":"5번에서 쓴 이름이 K.V. Switzer이고, 6번에서 주최 측은 그녀가 남자(man)라고 생각했어요. woman은 실제 사실이지만 주최 측의 생각과는 달라요.","c":null,"s":[[5,"She signed up for the race using the name K.V. Switzer.","그녀는 K.V. Switzer라는 이름을 사용해 경주에 등록했다."],[6,"The organizers thought she was a man.","주최 측은 그녀가 남자라고 생각했다."]]},"h":"305c46a2b0"}]},{"u":8,"id":"b1-08-2","no":2,"ko":"가난한 소녀가 찾아낸 화석, 이름은 왜 사라졌을까?","items":[{"n":1,"t":"tf","q":"Mary's family sold fossils to make money.","ko":"메리의 가족은 돈을 벌기 위해 화석을 팔았다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에 Her family sold fossils to make money.가 그대로 있어요. 일치해요.","c":"T","s":[[2,"Her family sold fossils to make money.","그녀의 가족은 돈을 벌기 위해 화석을 팔았다."]]},"h":"8d36c65f34"},{"n":2,"t":"tf","q":"The scientists gave Mary full credit for her work.","ko":"과학자들은 메리의 일에 대해 충분한 공로를 인정해 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","w":"10번에서 그들은 그녀에게 공로를 인정해 주지 않았다(They did not give her credit)고 해요. 반대예요.","c":"F","s":[[10,"They did not give her credit.","그들은 그녀에게 공로를 인정해 주지 않았다."]]},"h":"0e538b83f9"},{"n":3,"t":"tf","q":"Some of Mary's fossils were from large sea animals that are no longer alive.","ko":"메리의 화석 중 일부는 더 이상 살아 있지 않은 커다란 바다 동물의 것이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장 Some were from large sea animals that are no longer alive today.와 같은 내용이에요.","c":"T","s":[[6,"Some were from large sea animals that are no longer alive today.","그중 일부는 오늘날 더 이상 살아 있지 않은 커다란 바다 동물의 것이었다."]]},"h":"2e546d1b73"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, they ignored her because she was a woman from a poor family.)","ko":"하지만 그들은 그녀가 가난한 집안 출신의 여성이라는 이유로 그녀를 무시했다.","opts":["도와주었다","무시했다","칭찬했다","따라 했다"],"word":"ignored","r":{"a":"2) 무시했다","ev":"9~10번 문장","w":"10번에서 공로를 인정해 주지 않았다고 이어져요. 칭찬하거나 도와준 게 아니라 무시한 거예요. ignore = 무시하다.","c":2,"s":[[9,"However, they ignored her because she was a woman from a poor family.","하지만 그들은 그녀가 가난한 집안 출신의 여성이라는 이유로 그녀를 무시했다."],[10,"They did not give her credit.","그들은 그녀에게 공로를 인정해 주지 않았다."]]},"h":"e98055107e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They did not give her credit.)","ko":"그들은 그녀에게 공로를 인정해 주지 않았다.","opts":["빚","질문","공로, 인정","선물"],"word":"credit","r":{"a":"3) 공로, 인정","ev":"10~11번 문장","w":"공로를 인정해 주지 않아서(10번) 그래서 오랫동안 알려지지 않았어요(11번). 여기서 credit은 '공로를 인정함'이에요.","c":3,"s":[[10,"They did not give her credit.","그들은 그녀에게 공로를 인정해 주지 않았다."],[11,"So, she remained unknown for a long time.","그래서 그녀는 오랫동안 알려지지 않은 채로 남았다."]]},"h":"e3192b1823"},{"n":6,"t":"ref","q":"What does the underlined \"this knowledge\" refer to?\nWith this knowledge, Mary found many important fossils.","ko":"밑줄 친 this knowledge가 가리키는 것은?","sko":"이 지식으로 메리는 많은 중요한 화석을 발견했다.","opts":["그녀가 발견한 뼈에 대해 공부하고 배운 것","바다 절벽의 위치","과학자들의 연구 결과","가족이 화석을 파는 방법"],"r":{"a":"1) 그녀가 발견한 뼈에 대해 공부하고 배운 것","ev":"4~5번 문장","w":"4번에서 메리가 발견한 뼈에 대해 주의 깊게 공부하고 배웠다고 했어요. 5번의 this knowledge는 그렇게 배운 지식이에요.","c":1,"s":[[4,"She carefully studied and learned about the bones she found.","그녀는 자신이 발견한 뼈에 대해 주의 깊게 연구하고 배웠다."],[5,"With this knowledge, Mary found many important fossils.","이 지식으로 메리는 많은 중요한 화석을 발견했다."]]},"h":"3b02483a9c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, she remained unknown for a long time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 그녀는 오랫동안 알려지지 않은 채로 남았다.","opts":["그래서 그녀는 곧 유명해졌다.","그래서 그녀는 오랫동안 영국을 떠나 있었다.","그래서 그녀는 오랫동안 화석 찾기를 쉬었다.","그래서 그녀는 오랫동안 사람들에게 알려지지 않았다."],"r":{"a":"4) 그래서 그녀는 오랫동안 사람들에게 알려지지 않았다.","ev":"10~11번 문장","w":"remain unknown은 '알려지지 않은 채로 남다'예요. 공로를 인정받지 못해서(10번) 오랫동안 이름이 알려지지 않았어요. 곧 유명해진 것이 아니에요.","c":4,"s":[[10,"They did not give her credit.","그들은 그녀에게 공로를 인정해 주지 않았다."],[11,"So, she remained unknown for a long time.","그래서 그녀는 오랫동안 알려지지 않은 채로 남았다."]]},"h":"247c721571"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["메리는 바다에서 멀리 떨어진 큰 도시에 살았다.","메리의 화석은 과학자들에게 쓸모가 없었다.","과학자들은 메리의 화석을 이용했지만 그녀의 공로는 인정하지 않았다.","사람들은 메리의 중요성을 곧바로 알아보았다."],"opts":["Mary lived in a big city far from the sea.","Mary's fossils were not useful to scientists.","Scientists used Mary's fossils but did not give her credit.","People saw Mary's importance right away."],"r":{"a":"3) Scientists used Mary's fossils but did not give her credit.","ev":"8~10번 문장","w":"8번에서 과학자들이 메리의 화석을 이용했고, 9~10번에서 그녀를 무시하고 공로를 인정하지 않았어요. 첫째 선지는 1번(바닷가 마을), 둘째 선지는 7번(도움이 됨), 넷째 선지는 11~12번(오랜 뒤에야 알아봄)과 달라요.","c":3,"s":[[8,"Many scientists used Mary’s fossils and ideas.","많은 과학자들이 메리의 화석과 생각을 이용했다."],[9,"However, they ignored her because she was a woman from a poor family.","하지만 그들은 그녀가 가난한 집안 출신의 여성이라는 이유로 그녀를 무시했다."],[10,"They did not give her credit.","그들은 그녀에게 공로를 인정해 주지 않았다."]]},"h":"139fc1b0ea"},{"n":9,"t":"sum","q":"Mary stayed (A) for a long time, but many years later people saw her (B).","ko":"메리는 오랫동안 (A) 채로 있었지만, 여러 해 뒤 사람들은 그녀의 (B)을 알아보았다.","oko":["(A) 유명한 / (B) 실수","(A) 알려지지 않은 / (B) 중요성","(A) 부유한 / (B) 중요성","(A) 유명한 / (B) 중요성","(A) 알려지지 않은 / (B) 실수"],"opts":["(A) famous / (B) mistakes","(A) unknown / (B) importance","(A) rich / (B) importance","(A) famous / (B) importance","(A) unknown / (B) mistakes"],"r":{"a":"2) (A) unknown / (B) importance","ev":"11~12번 문장","w":"11번에서 오랫동안 알려지지 않은(unknown) 채로 남았고, 12번에서 여러 해 뒤 사람들이 그녀의 중요성(importance)을 알아보았어요.","c":2,"s":[[11,"So, she remained unknown for a long time.","그래서 그녀는 오랫동안 알려지지 않은 채로 남았다."],[12,"Many years later, people looked at old records and saw her importance.","여러 해 뒤, 사람들은 옛 기록을 살펴보고 그녀의 중요성을 알아보았다."]]},"h":"19feee39ca"},{"n":10,"t":"fill","q":"Mary studied the [A] she found, and she used this [B] to find many important fossils.","ko":"메리는 자신이 발견한 [A]에 대해 공부했고, 이 [B]을 이용해 많은 중요한 화석을 발견했다.","bank":["bones","knowledge","cliffs","scientists","family","records"],"bko":{"bones":"뼈","knowledge":"지식","cliffs":"절벽","scientists":"과학자들","family":"가족","records":"기록"},"r":{"a":"[A] bones, [B] knowledge","ev":"4~5번 문장","w":"4번에서 메리가 발견한 뼈(bones)를 공부했고, 5번에서 이 지식(knowledge)으로 중요한 화석을 많이 찾았어요. cliffs는 화석을 찾은 장소(3번)예요.","c":null,"s":[[4,"She carefully studied and learned about the bones she found.","그녀는 자신이 발견한 뼈에 대해 주의 깊게 연구하고 배웠다."],[5,"With this knowledge, Mary found many important fossils.","이 지식으로 메리는 많은 중요한 화석을 발견했다."]]},"h":"6d238ef534"}]},{"u":8,"id":"b1-08-3","no":3,"ko":"비가 되어 쏟아지는 글자들, 아폴리네르의 캘리그램","items":[{"n":1,"t":"tf","q":"Apollinaire loved modern art that showed familiar things in new ways.","ko":"아폴리네르는 익숙한 것들을 새로운 방식으로 보여 주는 현대 미술을 좋아했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에 He loved modern art that showed familiar things in new ways.가 그대로 있어요. 일치해요.","c":"T","s":[[2,"He loved modern art that showed familiar things in new ways.","그는 익숙한 것들을 새로운 방식으로 보여 주는 현대 미술을 좋아했다."]]},"h":"bedbc6647a"},{"n":2,"t":"tf","q":"Il Pleut means \"It's Sunny\" in French.","ko":"Il Pleut은 프랑스어로 \"날씨가 맑다\"를 의미한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","w":"8번에서 Il Pleut은 \"It's Raining(비가 온다)\"을 의미한다고 해요. 맑다는 말은 틀려요.","c":"F","s":[[8,"This means “It’s Raining” in French.","이것은 프랑스어로 “비가 온다”를 의미한다."]]},"h":"dfda9dd92a"},{"n":3,"t":"tf","q":"In a calligram, the shape of the poem shows what the poem is about.","ko":"캘리그램에서 시의 모양은 그 시가 무엇에 관한 것인지 보여 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장 The shape of the poem shows what the poem is about.와 같은 내용이에요.","c":"T","s":[[6,"The shape of the poem shows what the poem is about.","시의 모양은 그 시가 무엇에 관한 것인지 보여 준다."]]},"h":"5ba651b3ef"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In a calligram, words are arranged to look like a picture.)","ko":"캘리그램에서는 단어들이 그림처럼 보이도록 배열된다.","opts":["숨겨진","배열된","지워진","읽힌"],"word":"arranged","r":{"a":"2) 배열된","ev":"5~6번 문장","w":"단어들이 그림처럼 보이게 놓인다는 뜻이고, 6번에서 시의 모양이 내용을 보여 준다고 해요. are arranged = 배열된다.","c":2,"s":[[5,"In a calligram, words are arranged to look like a picture.","캘리그램에서는 단어들이 그림처럼 보이도록 배열된다."],[6,"The shape of the poem shows what the poem is about.","시의 모양은 그 시가 무엇에 관한 것인지 보여 준다."]]},"h":"ff223402d4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He wanted to express his ideas with words in a similar way.)","ko":"그는 비슷한 방식으로 자신의 생각을 말로 표현하고 싶었다.","opts":["숨기다","잊다","표현하다","바꾸다"],"word":"express","r":{"a":"3) 표현하다","ev":"3번 문장","w":"아폴리네르는 현대 미술처럼 자신의 생각을 말로 나타내고 싶었어요. 숨기거나 바꾸려는 게 아니에요. express = 표현하다.","c":3,"s":[[3,"He wanted to express his ideas with words in a similar way.","그는 비슷한 방식으로 자신의 생각을 말로 표현하고 싶었다."]]},"h":"55b39968ac"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey look like raindrops coming from the sky.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 하늘에서 내려오는 빗방울처럼 보인다.","opts":["프랑스 시인들","긴 줄로 떨어지는 단어들","하늘의 구름들","캘리그램을 읽는 사람들"],"r":{"a":"2) 긴 줄로 떨어지는 단어들","ev":"9~10번 문장","w":"9번에서 이 시의 단어들이 긴 줄로 아래로 떨어진다고 했고, 그 단어들이 빗방울처럼 보인다고 10번에서 이어져요.","c":2,"s":[[9,"In this poem, the words fall down the page in long lines.","이 시에서 단어들은 긴 줄로 쪽 아래로 떨어진다."],[10,"They look like raindrops coming from the sky.","그것들은 하늘에서 내려오는 빗방울처럼 보인다."]]},"h":"6d23596c56"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because of this, the poem feels quiet and sad.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 때문에 그 시는 조용하고 슬픈 느낌이 든다.","opts":["이 때문에 그 시는 조용하고 슬픈 느낌이 든다.","이 때문에 그 시는 시끄럽고 신나는 느낌이 든다.","이 때문에 그 시는 읽기 어렵다.","이 때문에 그 시는 조용하지만 즐거운 느낌이 든다."],"r":{"a":"1) 이 때문에 그 시는 조용하고 슬픈 느낌이 든다.","ev":"11~12번 문장","w":"11번에서 떨어지는 단어들이 눈물처럼도 보인다고 했으니 조용하고 슬픈(quiet and sad) 느낌이에요. 신나거나 즐거운 느낌이 아니에요.","c":1,"s":[[11,"The falling words also look like tears.","떨어지는 단어들은 눈물처럼도 보인다."],[12,"Because of this, the poem feels quiet and sad.","이 때문에 그 시는 조용하고 슬픈 느낌이 든다."]]},"h":"cbd5841e16"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아폴리네르는 1800년대의 스페인 시인이었다.","캘리그램에서는 단어들이 일반 시처럼 곧은 줄로만 쓰인다.","Il Pleut은 태양에 관한 시이다.","Il Pleut에서 단어들은 긴 줄로 쪽 아래로 떨어진다."],"opts":["Apollinaire was a Spanish poet in the 1800s.","In a calligram, words are written only in straight lines like a regular poem.","Il Pleut is a poem about the sun.","In Il Pleut, the words fall down the page in long lines."],"r":{"a":"4) In Il Pleut, the words fall down the page in long lines.","ev":"9번 문장","w":"9번 문장 In this poem, the words fall down the page in long lines.와 같아요. 첫째 선지는 1번(프랑스 시인, 1900년대 초), 둘째 선지는 5번(그림처럼 배열), 셋째 선지는 8번(비가 온다)과 달라요.","c":4,"s":[[9,"In this poem, the words fall down the page in long lines.","이 시에서 단어들은 긴 줄로 쪽 아래로 떨어진다."]]},"h":"65797f1d93"},{"n":9,"t":"sum","q":"Apollinaire believed that calligrams could express (A) better than regular poems, and his creative style opened new (B) for art and writing.","ko":"아폴리네르는 캘리그램이 일반적인 시보다 (A)을 더 잘 표현할 수 있다고 믿었고, 그의 창의적인 스타일은 예술과 글쓰기에 새로운 (B)을 열어 주었다.","oko":["(A) 감정 / (B) 규칙","(A) 사실 / (B) 문","(A) 감정 / (B) 그림","(A) 사실 / (B) 규칙","(A) 감정 / (B) 문"],"opts":["(A) feelings / (B) rules","(A) facts / (B) doors","(A) feelings / (B) pictures","(A) facts / (B) rules","(A) feelings / (B) doors"],"r":{"a":"5) (A) feelings / (B) doors","ev":"13~14번 문장","w":"13번에서 캘리그램이 일반적인 시보다 감정(feelings)을 더 잘 표현한다고 믿었고, 14번에서 새로운 문(doors)을 열어 주었다고 해요.","c":5,"s":[[13,"Apollinaire believed that calligrams could express feelings better than regular poems.","아폴리네르는 캘리그램이 일반적인 시보다 감정을 더 잘 표현할 수 있다고 믿었다."],[14,"His creative style opened new doors for art and writing.","그의 창의적인 스타일은 예술과 글쓰기에 새로운 문을 열어 주었다."]]},"h":"340d4b86c2"},{"n":10,"t":"fill","q":"In Il Pleut, the words [A] down the page like raindrops, so the poem feels quiet and [B].","ko":"Il Pleut에서 단어들은 빗방울처럼 쪽 아래로 [A], 그래서 시는 조용하고 [B] 느낌이 든다.","bank":["fall","sad","rise","happy","noisy","tears"],"bko":{"fall":"떨어지다","sad":"슬픈","rise":"올라가다","happy":"행복한","noisy":"시끄러운","tears":"눈물"},"r":{"a":"[A] fall, [B] sad","ev":"9~12번 문장","w":"9번에서 단어들이 아래로 떨어지고(fall), 12번에서 조용하고 슬픈(sad) 느낌이라고 해요. rise는 위로 올라간다는 뜻이라 반대예요.","c":null,"s":[[9,"In this poem, the words fall down the page in long lines.","이 시에서 단어들은 긴 줄로 쪽 아래로 떨어진다."],[10,"They look like raindrops coming from the sky.","그것들은 하늘에서 내려오는 빗방울처럼 보인다."],[11,"The falling words also look like tears.","떨어지는 단어들은 눈물처럼도 보인다."],[12,"Because of this, the poem feels quiet and sad.","이 때문에 그 시는 조용하고 슬픈 느낌이 든다."]]},"h":"df721294e5"}]},{"u":8,"id":"b1-08-4","no":4,"ko":"파란색에서 분홍색으로, 피카소의 마음이 바뀐 시기","items":[{"n":1,"t":"tf","q":"Picasso was in his Blue Period from 1901 to 1904.","ko":"피카소는 1901년부터 1904년까지 청색 시대를 보냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장에 From 1901 to 1904, Picasso was in his Blue Period.가 그대로 있어요. 일치해요.","c":"T","s":[[3,"From 1901 to 1904, Picasso was in his Blue Period.","1901년부터 1904년까지 피카소는 청색 시대를 보냈다."]]},"h":"5c4b564db0"},{"n":2,"t":"tf","q":"Picasso used warm colors like pink and orange in his Blue Period.","ko":"피카소는 청색 시대에 분홍색과 주황색 같은 따뜻한 색을 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번, 10번 문장","w":"분홍색과 주황색 같은 따뜻한 색(10번)은 청색 시대가 아니라 장밋빛 시대(8번)에 사용했어요. 청색 시대에는 파란색을 많이 썼어요.","c":"F","s":[[8,"From 1904 to 1906, Picasso entered his Rose Period.","1904년부터 1906년까지 피카소는 장밋빛 시대에 들어섰다."],[10,"He used warm colors like pink and orange.","그는 분홍색과 주황색 같은 따뜻한 색을 사용했다."]]},"h":"6160878d35"},{"n":3,"t":"tf","q":"Picasso kept painting until he died in 1973.","ko":"피카소는 1973년에 죽을 때까지 계속 그림을 그렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","w":"13번 문장 Picasso kept painting until he died in 1973.과 같은 내용이에요.","c":"T","s":[[13,"Picasso kept painting until he died in 1973.","피카소는 1973년에 죽을 때까지 그림을 그렸다."]]},"h":"606e1d3dbe"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (During this time, he fell in love and became more hopeful.)","ko":"이 시기에 그는 사랑에 빠졌고 더 희망적이 되었다.","opts":["희망적인","화가 난","피곤한","외로운"],"word":"hopeful","r":{"a":"1) 희망적인","ev":"9번 문장","w":"사랑에 빠진 시기에 더 ~해졌다고 했으니 기분이 좋아진 거예요. 슬픔의 청색 시대와 반대로 hopeful = 희망에 찬, 희망적인.","c":1,"s":[[9,"During this time, he fell in love and became more hopeful.","이 시기에 그는 사랑에 빠졌고 더 희망적이 되었다."]]},"h":"93523c794d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The soft colors and a gentle background show that he was feeling happy and peaceful.)","ko":"부드러운 색과 온화한 배경은 그가 행복하고 평화롭게 느끼고 있었음을 보여 준다.","opts":["강렬한","어두운","온화한","복잡한"],"word":"gentle","r":{"a":"3) 온화한","ev":"12번 문장","w":"soft colors와 나란히 쓰여 happy and peaceful(행복하고 평화로운) 마음을 보여 줘요. gentle = 온화한, 부드러운.","c":3,"s":[[12,"The soft colors and a gentle background show that he was feeling happy and peaceful.","부드러운 색과 온화한 배경은 그가 행복하고 평화롭게 느끼고 있었음을 보여 준다."]]},"h":"afb0bbd831"},{"n":6,"t":"ref","q":"What does the underlined \"this mood\" refer to?\nOne famous painting, The Old Guitarist, reflects this mood.","ko":"밑줄 친 this mood가 가리키는 것은?","sko":"유명한 그림 중 하나인 《늙은 기타리스트》는 이 분위기를 나타낸다.","opts":["따뜻한 분홍색 그림의 분위기","피카소가 사랑에 빠져 느낀 희망","가난한 사람들이 느낀 기쁨","청색 시대 피카소의 슬프고 불행한 기분"],"r":{"a":"4) 청색 시대 피카소의 슬프고 불행한 기분","ev":"6~7번 문장","w":"7번은 청색 시대 이야기예요. 6번에서 파란색으로 불행한 마음(unhappy)을 보여 주었으니 this mood는 그 슬프고 불행한 기분이에요.","c":4,"s":[[6,"He used lots of blue colors to show that he was unhappy.","그는 자신이 불행하다는 것을 보여 주려고 파란색을 많이 사용했다."],[7,"One famous painting, The Old Guitarist, reflects this mood.","유명한 그림 중 하나인 《늙은 기타리스트》는 이 분위기를 나타낸다."]]},"h":"d9bc837bce"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Throughout his life, his feelings changed his art.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"평생에 걸쳐 그의 감정이 그의 예술을 바꾸었다.","opts":["평생 동안 그의 예술이 그의 감정을 바꾸었다.","평생에 걸쳐 그의 감정이 그의 예술을 바꾸었다.","그는 평생 같은 그림만 그렸다.","그의 감정은 예술에 아무 영향을 주지 않았다."],"r":{"a":"2) 평생에 걸쳐 그의 감정이 그의 예술을 바꾸었다.","ev":"14번 문장","w":"주어는 his feelings(그의 감정)이고 바뀐 것은 his art(그의 예술)예요. 첫째 선지는 주어와 목적어가 뒤바뀌었고, 나머지는 14번과 반대예요.","c":2,"s":[[14,"Throughout his life, his feelings changed his art.","평생에 걸쳐 그의 감정이 그의 예술을 바꾸었다."]]},"h":"d23e41292c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["피카소는 색을 쓰지 않은 프랑스 화가였다.","〈늙은 기타리스트〉는 장밋빛 시대에 그려졌다.","장밋빛 시대에 피카소는 사랑에 빠졌고 더 희망적이 되었다.","피카소는 평생 가난한 사람들만 그렸다."],"opts":["Picasso was a French artist who did not use color.","The Old Guitarist belongs to the Rose Period.","During the Rose Period, Picasso fell in love and became more hopeful.","Picasso painted only poor people throughout his life."],"r":{"a":"3) During the Rose Period, Picasso fell in love and became more hopeful.","ev":"8~9번 문장","w":"8~9번에서 장밋빛 시대에 사랑에 빠졌고 더 희망적이 되었다고 해요. 첫째 선지는 1번(스페인 화가, 색 사용), 둘째 선지는 7번(청색 시대 그림), 넷째 선지는 5번과 10~11번(시기마다 다름)과 달라요.","c":3,"s":[[8,"From 1904 to 1906, Picasso entered his Rose Period.","1904년부터 1906년까지 피카소는 장밋빛 시대에 들어섰다."],[9,"During this time, he fell in love and became more hopeful.","이 시기에 그는 사랑에 빠졌고 더 희망적이 되었다."]]},"h":"7ca87b558c"},{"n":9,"t":"sum","q":"In his Blue Period, Picasso used (A) colors to show he was unhappy, but in his Rose Period, he used (B) colors like pink and orange.","ko":"청색 시대에 피카소는 불행함을 보여 주려고 (A) 색을 사용했지만, 장밋빛 시대에는 분홍색과 주황색 같은 (B) 색을 사용했다.","oko":["(A) 따뜻한 / (B) 파란","(A) 파란 / (B) 어두운","(A) 따뜻한 / (B) 따뜻한","(A) 회색 / (B) 파란","(A) 파란 / (B) 따뜻한"],"opts":["(A) warm / (B) blue","(A) blue / (B) dark","(A) warm / (B) warm","(A) gray / (B) blue","(A) blue / (B) warm"],"r":{"a":"5) (A) blue / (B) warm","ev":"6~10번 문장","w":"6번에서 불행함을 보여 주려고 파란색(blue)을 많이 썼고, 10번에서 장밋빛 시대에는 분홍색과 주황색 같은 따뜻한(warm) 색을 썼어요.","c":5,"s":[[6,"He used lots of blue colors to show that he was unhappy.","그는 자신이 불행하다는 것을 보여 주려고 파란색을 많이 사용했다."],[7,"One famous painting, The Old Guitarist, reflects this mood.","유명한 그림 중 하나인 《늙은 기타리스트》는 이 분위기를 나타낸다."],[8,"From 1904 to 1906, Picasso entered his Rose Period.","1904년부터 1906년까지 피카소는 장밋빛 시대에 들어섰다."],[9,"During this time, he fell in love and became more hopeful.","이 시기에 그는 사랑에 빠졌고 더 희망적이 되었다."],[10,"He used warm colors like pink and orange.","그는 분홍색과 주황색 같은 따뜻한 색을 사용했다."]]},"h":"da7a1988e2"},{"n":10,"t":"fill","q":"Picasso felt deep [A] after losing a close friend, and he often painted poor and [B] people.","ko":"피카소는 가까운 친구를 잃은 뒤 깊은 [A]을 느꼈고, 가난하고 [B] 사람들을 자주 그렸다.","bank":["sadness","lonely","hopeful","friend","blue","happy"],"bko":{"sadness":"슬픔","lonely":"외로운","hopeful":"희망적인","friend":"친구","blue":"파란","happy":"행복한"},"r":{"a":"[A] sadness, [B] lonely","ev":"4~5번 문장","w":"4번에서 친구를 잃고 깊은 슬픔(sadness)을 느꼈고, 5번에서 가난하고 외로운(lonely) 사람들을 그렸어요. happy와 hopeful은 장밋빛 시대의 감정이에요.","c":null,"s":[[4,"He felt deep sadness after losing a close friend.","그는 가까운 친구를 잃은 뒤 깊은 슬픔을 느꼈다."],[5,"He often painted poor and lonely people.","그는 가난하고 외로운 사람들을 자주 그렸다."]]},"h":"73eff4eee4"}]},{"u":9,"id":"b1-09-1","no":1,"ko":"하루에 두 번 모습이 바뀌는 섬, 몽생미셸","items":[{"n":1,"t":"tf","q":"At high tide, Mont-Saint-Michel is surrounded by water.","ko":"밀물 때 몽생미셸은 물로 둘러싸인다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"At high tide, the island is surrounded by water and looks like it is floating.","밀물 때는 섬이 물로 둘러싸여 떠 있는 것처럼 보인다."]],"w":"4번 문장에 At high tide, the island is surrounded by water가 그대로 나와요. 밀물 때 섬이 물로 둘러싸인다는 내용과 일치해요.","c":"T"},"h":"805bf6dff0"},{"n":2,"t":"tf","q":"A sandy path connects the island to the mainland at high tide.","ko":"밀물 때 모래 길이 섬을 육지와 연결한다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"When the tide is low, the water falls back.","썰물 때는 물이 뒤로 물러난다."],[6,"Then a sandy path appears and connects the island to the mainland.","그러면 모래 길이 나타나 섬을 육지와 연결한다."]],"w":"모래 길이 나타나 섬과 육지를 잇는 때는 밀물이 아니라 썰물(the tide is low)이에요(5~6번).","c":"F"},"h":"48ac4011d5"},{"n":3,"t":"tf","q":"At low tide, the ground became wet and muddy, so it was hard for enemies to cross.","ko":"썰물 때 땅이 젖고 진흙투성이가 되어서 적들이 건너가기 어려웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"At low tide, the ground became wet and muddy.","썰물 때는 땅이 젖고 진흙투성이가 되었다."],[10,"It was hard for enemies to cross.","적들이 건너가기 어려웠다."]],"w":"9번에서 썰물 때 땅이 젖고 진흙투성이가 되었고, 10번에서 적들이 건너가기 어려웠다고 해요.","c":"T"},"h":"b3efd424b0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (At low tide, the ground became wet and muddy.)","ko":"썰물 때는 땅이 젖고 진흙투성이가 되었다.","opts":["단단한","진흙투성이의","건조한","얼어붙은"],"word":"muddy","r":{"a":"2) 진흙투성이의","ev":"9~10번 문장","s":[[9,"At low tide, the ground became wet and muddy.","썰물 때는 땅이 젖고 진흙투성이가 되었다."],[10,"It was hard for enemies to cross.","적들이 건너가기 어려웠다."]],"w":"썰물 때 물이 빠지면 땅이 젖어요. wet and muddy는 '젖고 진흙투성이인'이라는 뜻이고, 그래서 적들이 건너가기 어려웠어요(10번).","c":2},"h":"4f76c5ee21"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Sometimes, the sea would rush back in and trap them.)","ko":"때때로 바닷물이 갑자기 밀려들어 와 그들을 가두기도 했다.","opts":["천천히 흘러가다","조용히 멈추다","갑자기 빠르게 오다","얼어붙다"],"word":"rush","r":{"a":"3) 갑자기 빠르게 오다","ev":"10~11번 문장","s":[[10,"It was hard for enemies to cross.","적들이 건너가기 어려웠다."],[11,"Sometimes, the sea would rush back in and trap them.","때때로 바닷물이 갑자기 밀려들어 와 그들을 가두기도 했다."]],"w":"10번에서 적들이 건너기 어려웠고, 11번에서 바다가 rush back in 해서 그들을 가둬요. rush는 '갑자기 빠르게 밀려오다'예요.","c":3},"h":"f66080a0fc"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nIn the past, this helped protect the island from enemies.","ko":"밑줄 친 this가 가리키는 것은?","sko":"과거에는 이것이 적으로부터 섬을 지키는 데 도움이 되었다.","opts":["섬 꼭대기의 오래된 교회","섬 아래의 작은 마을","적들이 섬으로 건너오는 것","조수가 매일 빠르게 변하는 것"],"r":{"a":"4) 조수가 매일 빠르게 변하는 것","ev":"7~8번 문장","s":[[7,"The tide changes quickly each day.","조수는 매일 빠르게 변한다."],[8,"In the past, this helped protect the island from enemies.","과거에는 이것이 적으로부터 섬을 지키는 데 도움이 되었다."]],"w":"8번의 this는 바로 앞 7번 문장 내용을 받아요. 조수가 매일 빠르게 변하는 것이 섬을 지키는 데 도움이 되었어요.","c":4},"h":"aaf3ba65b5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because of all these natural conditions, the island still stands today.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 모든 자연 조건 덕분에 그 섬은 오늘날에도 서 있다.","opts":["이런 자연 조건 덕분에 섬은 오늘날에도 남아 있다.","이런 자연 조건 때문에 섬은 오늘날 사라졌다.","사람들이 만든 조건 덕분에 섬이 서 있다.","자연 조건이 모두 사라져서 섬이 서 있다."],"r":{"a":"1) 이런 자연 조건 덕분에 섬은 오늘날에도 남아 있다.","ev":"12번 문장","s":[[12,"Because of all these natural conditions, the island still stands today.","이 모든 자연 조건 덕분에 그 섬은 오늘날에도 서 있다."]],"w":"Because of는 '~ 덕분에'이고 still stands today는 '오늘날에도 서 있다'예요. 사라졌다는 말이나 사람이 만든 조건이라는 말은 본문과 달라요.","c":1},"h":"3db3619ab2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["섬은 프랑스 해안에서 멀리 떨어져 있다.","바닷물이 갑자기 밀려들어 와 적들이 갇히기도 했다.","모래 길은 밀물 때 나타난다.","섬에는 마을이 없다."],"opts":["The island is far away from the coast of France.","Enemies were sometimes trapped when the sea rushed back in.","A sandy path appears when the tide is high.","There is no village on the island."],"r":{"a":"2) Enemies were sometimes trapped when the sea rushed back in.","ev":"11번 문장","s":[[11,"Sometimes, the sea would rush back in and trap them.","때때로 바닷물이 갑자기 밀려들어 와 그들을 가두기도 했다."]],"w":"11번에서 바다가 다시 밀려들어 와 적들을 가두기도 했다고 해요. 섬은 해안 근처에 있고(1번), 모래 길은 썰물 때 나타나며(5~6번), 아래에 작은 마을이 있어요(2번).","c":2},"h":"e03167b5cc"},{"n":9,"t":"sum","q":"When the tide is high, the island is (A) by water. When the tide is low, a sandy path (B) the island to the mainland.","ko":"밀물 때 섬은 물로 (A)된다. 썰물 때는 모래 길이 섬을 육지와 (B)한다.","oko":["(A) 둘러싸인 / (B) 떼어 놓는다","(A) 버려진 / (B) 연결한다","(A) 가려진 / (B) 떠난다","(A) 지켜진 / (B) 건넌다","(A) 둘러싸인 / (B) 연결한다"],"opts":["(A) surrounded / (B) separates","(A) left / (B) connects","(A) hidden / (B) leaves","(A) protected / (B) crosses","(A) surrounded / (B) connects"],"r":{"a":"5) (A) surrounded / (B) connects","ev":"4~6번 문장","s":[[4,"At high tide, the island is surrounded by water and looks like it is floating.","밀물 때는 섬이 물로 둘러싸여 떠 있는 것처럼 보인다."],[5,"When the tide is low, the water falls back.","썰물 때는 물이 뒤로 물러난다."],[6,"Then a sandy path appears and connects the island to the mainland.","그러면 모래 길이 나타나 섬을 육지와 연결한다."]],"w":"4번에서 밀물 때 섬은 물로 둘러싸이고(surrounded), 5~6번에서 썰물 때 모래 길이 섬과 육지를 연결해요(connects). separates(떼어 놓다)는 반대 뜻이에요.","c":5},"h":"d509236a57"},{"n":10,"t":"fill","q":"In the past, the changing tide helped [A] the island, and the sea could suddenly [B] enemies.","ko":"과거에는 변하는 조수가 섬을 [A]하는 데 도움이 되었고, 바다는 갑자기 적들을 [B]하기도 했다.","bank":["protect","trap","float","cross","connect","muddy"],"bko":{"protect":"지키다","trap":"가두다","float":"떠 있다","cross":"건너다","connect":"연결하다","muddy":"진흙투성이의"},"r":{"a":"[A] protect, [B] trap","ev":"8, 11번 문장","s":[[8,"In the past, this helped protect the island from enemies.","과거에는 이것이 적으로부터 섬을 지키는 데 도움이 되었다."],[11,"Sometimes, the sea would rush back in and trap them.","때때로 바닷물이 갑자기 밀려들어 와 그들을 가두기도 했다."]],"w":"8번 this helped protect the island, 11번 the sea would rush back in and trap them에서 가져왔어요. cross는 적들이 하기 어려웠던 일이고, connect는 모래 길이 하는 일이에요.","c":null},"h":"4d2f5fd9e9"}]},{"u":9,"id":"b1-09-2","no":2,"ko":"하늘을 그대로 비추는 거울 땅, 우유니","items":[{"n":1,"t":"tf","q":"Salar de Uyuni is the world’s largest salt flat.","ko":"우유니 소금사막은 세계에서 가장 큰 소금 평원이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It is the world’s largest salt flat.","그곳은 세계에서 가장 큰 소금 평원이다."]],"w":"3번 문장에 It is the world’s largest salt flat이라고 나와요. It은 우유니를 가리켜요.","c":"T"},"h":"3c7d07eb05"},{"n":2,"t":"tf","q":"The mirror effect can be seen during the dry season.","ko":"거울 효과는 건기에 볼 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"During the dry season, it is just a wide, white desert made of salt.","건기에는 그저 소금으로 이루어진 넓고 하얀 사막일 뿐이다."],[6,"To see the mirror effect, you need to visit during the rainy season.","거울 효과를 보려면 우기에 방문해야 한다."]],"w":"건기에는 소금으로 된 하얀 사막일 뿐이에요(5번). 거울 효과를 보려면 우기에 가야 해요(6번).","c":"F"},"h":"d708ffd2c3"},{"n":3,"t":"tf","q":"Rainwater forms a thin layer of water on the flat ground.","ko":"빗물이 평평한 땅 위에 얇은 물층을 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Rainwater spreads across the flat ground and forms a thin layer of water.","빗물이 평평한 땅 위로 퍼져 얇은 물층을 만든다."]],"w":"7번에서 빗물이 평평한 땅 위로 퍼져 얇은 물층을 만든다(forms a thin layer of water)고 해요.","c":"T"},"h":"fb119bcefb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The water reflects the sky so clearly.)","ko":"물이 하늘을 아주 선명하게 비춘다.","opts":["가리다","씻어내다","흡수하다","비추다"],"word":"reflects","r":{"a":"4) 비추다","ev":"7~8번 문장","s":[[7,"Rainwater spreads across the flat ground and forms a thin layer of water.","빗물이 평평한 땅 위로 퍼져 얇은 물층을 만든다."],[8,"The water reflects the sky so clearly.","물이 하늘을 아주 선명하게 비춘다."]],"w":"7번에서 땅 위에 얇은 물층이 생겨요. 그 물이 하늘을 선명하게 reflect, 즉 비추기 때문에 땅이 거울처럼 보여요.","c":4},"h":"88d4b1e7ff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This salt became the huge, bright surface we see today.)","ko":"이 소금이 오늘날 우리가 보는 거대하고 밝은 표면이 되었다.","opts":["깊은 곳","표면","가장자리","입구"],"word":"surface","r":{"a":"2) 표면","ev":"11~12번 문장","s":[[11,"Over time, the lake dried up and left behind salt.","시간이 지나면서 호수는 말라 버리고 소금을 남겼다."],[12,"This salt became the huge, bright surface we see today.","이 소금이 오늘날 우리가 보는 거대하고 밝은 표면이 되었다."]],"w":"호수가 말라 남은 소금이 오늘날 우리가 보는 거대하고 밝은 surface가 되었어요. 눈에 보이는 땅의 겉, 즉 표면이에요.","c":2},"h":"d1c42344b4"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is the world’s largest salt flat.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그곳은 세계에서 가장 큰 소금 평원이다.","opts":["우유니 소금사막","볼리비아의 하늘","거울","빗물"],"r":{"a":"1) 우유니 소금사막","ev":"2~3번 문장","s":[[2,"You can see this in Salar de Uyuni in Bolivia.","볼리비아의 우유니 소금사막에서 이것을 볼 수 있다."],[3,"It is the world’s largest salt flat.","그곳은 세계에서 가장 큰 소금 평원이다."]],"w":"2번에서 거울 같은 땅을 볼 수 있는 곳으로 Salar de Uyuni가 나와요. 3번의 It은 그 우유니 소금사막을 가리켜요.","c":1},"h":"ceee46e5ca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It feels like you are walking on the clouds.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"구름 위를 걷는 것 같은 기분이 든다.","opts":["정말 구름 위로 올라가 걷게 된다.","하늘이 어두워서 걷기 어렵다.","구름 위를 걷는 것 같은 느낌이 든다.","구름이 땅에 내려앉아 길을 가린다."],"r":{"a":"3) 구름 위를 걷는 것 같은 느낌이 든다.","ev":"8~9번 문장","s":[[8,"The water reflects the sky so clearly.","물이 하늘을 아주 선명하게 비춘다."],[9,"It feels like you are walking on the clouds.","구름 위를 걷는 것 같은 기분이 든다."]],"w":"feels like는 '~처럼 느껴진다'예요. 물이 하늘을 선명하게 비추기 때문에 구름 위를 걷는 듯한 기분일 뿐, 실제로 구름 위를 걷는 것은 아니에요.","c":3},"h":"4a004ff5d7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우유니는 볼리비아에 있는 큰 모래 사막이다.","우유니는 아주 오래전에 거대한 호수였다.","거울 효과는 건기에만 볼 수 있다.","빗물은 땅에 스며들어 사라진다."],"opts":["Uyuni is a large sand desert in Bolivia.","Uyuni was a giant lake a long time ago.","The mirror effect is seen only in the dry season.","Rainwater soaks into the ground and disappears."],"r":{"a":"2) Uyuni was a giant lake a long time ago.","ev":"10번 문장","s":[[10,"This amazing place was a giant lake a long time ago.","이 놀라운 곳은 아주 오래전에 거대한 호수였다."]],"w":"10번에서 이 놀라운 곳은 아주 오래전에 거대한 호수였다고 해요. 우유니는 모래가 아닌 소금 평원이고(3번), 거울 효과는 우기에 보이며(6번), 빗물은 땅 위에 얇은 물층을 만들어요(7번).","c":2},"h":"a248fc219a"},{"n":9,"t":"sum","q":"In the rainy season, a thin layer of water makes the salt flat look like a (A). In the dry season, it is just a (B) desert made of salt.","ko":"우기에는 얇은 물층 때문에 소금 평원이 (A)처럼 보인다. 건기에는 소금으로 된 (B) 사막일 뿐이다.","oko":["(A) 호수 / (B) 검은","(A) 구름 / (B) 하얀","(A) 거울 / (B) 초록빛","(A) 거울 / (B) 하얀","(A) 사막 / (B) 축축한"],"opts":["(A) lake / (B) black","(A) cloud / (B) white","(A) mirror / (B) green","(A) mirror / (B) white","(A) desert / (B) wet"],"r":{"a":"4) (A) mirror / (B) white","ev":"1, 5, 6, 7번 문장","s":[[1,"Imagine a place where the ground reflects the sky, like a mirror.","땅이 거울처럼 하늘을 비추는 곳을 상상해 보라."],[5,"During the dry season, it is just a wide, white desert made of salt.","건기에는 그저 소금으로 이루어진 넓고 하얀 사막일 뿐이다."],[6,"To see the mirror effect, you need to visit during the rainy season.","거울 효과를 보려면 우기에 방문해야 한다."],[7,"Rainwater spreads across the flat ground and forms a thin layer of water.","빗물이 평평한 땅 위로 퍼져 얇은 물층을 만든다."]],"w":"우기에는 빗물이 얇은 물층을 만들어 땅이 거울처럼 하늘을 비춰요(1번, 6~7번). 건기에는 소금으로 이루어진 넓고 하얀 사막이에요(5번).","c":4},"h":"156b8e77aa"},{"n":10,"t":"fill","q":"Long ago, Uyuni was a giant [A]. It dried up and left behind [B], which became the bright surface we see today.","ko":"아주 오래전 우유니는 거대한 [A]였다. 그것이 말라서 [B]을 남겼고, 그것이 오늘날 우리가 보는 밝은 표면이 되었다.","bank":["lake","salt","rain","mirror","cloud","desert"],"bko":{"lake":"호수","salt":"소금","rain":"비","mirror":"거울","cloud":"구름","desert":"사막"},"r":{"a":"[A] lake, [B] salt","ev":"10~12번 문장","s":[[10,"This amazing place was a giant lake a long time ago.","이 놀라운 곳은 아주 오래전에 거대한 호수였다."],[11,"Over time, the lake dried up and left behind salt.","시간이 지나면서 호수는 말라 버리고 소금을 남겼다."],[12,"This salt became the huge, bright surface we see today.","이 소금이 오늘날 우리가 보는 거대하고 밝은 표면이 되었다."]],"w":"10번에서 거대한 호수(giant lake)였고, 11번에서 호수가 말라 소금(salt)을 남겼으며, 12번에서 그 소금이 밝은 표면이 되었어요. desert는 건기의 모습이고 mirror·cloud는 비친 모습이에요.","c":null},"h":"c97e086ef7"}]},{"u":9,"id":"b1-09-3","no":3,"ko":"남극에서 피를 흘리는 폭포의 비밀","items":[{"n":1,"t":"tf","q":"Dark red water flows out of a white glacier.","ko":"짙은 붉은색 물이 하얀 빙하에서 흘러나온다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Dark red water flows out of a white glacier, so people call it “Blood Falls.”","짙은 붉은색 물이 하얀 빙하에서 흘러나와서, 사람들은 그것을 ‘블러드 폴스(피의 폭포)’라고 부른다."]],"w":"3번 문장에 Dark red water flows out of a white glacier가 그대로 나와요.","c":"T"},"h":"56fe92ac5d"},{"n":2,"t":"tf","q":"Scientists still do not know why the water is red.","ko":"과학자들은 물이 왜 붉은지 아직도 모른다.","r":{"a":"F (본문과 다른 내용)","ev":"5, 10번 문장","s":[[5,"However, after years of research, scientists finally found the answer to what is happening.","하지만 수년간의 연구 끝에, 과학자들은 마침내 무슨 일이 일어나고 있는지에 대한 답을 찾았다."],[10,"The secret of the red waterfall isn’t a mystery anymore.","붉은 폭포의 비밀은 더 이상 수수께끼가 아니다."]],"w":"5번에서 과학자들이 마침내 답을 찾았고, 10번에서 붉은 폭포의 비밀은 더 이상 수수께끼가 아니라고 해요.","c":"F"},"h":"1f646452ba"},{"n":3,"t":"tf","q":"The salty water under the glacier has a lot of iron.","ko":"빙하 아래의 짠물에는 철분이 많이 들어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Deep under the glacier, there is salty water that has a lot of iron.","빙하 깊은 곳에는 철분이 많이 들어 있는 짠물이 있다."]],"w":"6번에서 빙하 깊은 곳에 철분이 많은 짠물(salty water that has a lot of iron)이 있다고 해요.","c":"T"},"h":"bd8436e6ff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For a long time, this was a great mystery.)","ko":"오랫동안 이것은 커다란 수수께끼였다.","opts":["사고","수수께끼","축제","발명"],"word":"mystery","r":{"a":"2) 수수께끼","ev":"4~5번 문장","s":[[4,"For a long time, this was a great mystery.","오랫동안 이것은 커다란 수수께끼였다."],[5,"However, after years of research, scientists finally found the answer to what is happening.","하지만 수년간의 연구 끝에, 과학자들은 마침내 무슨 일이 일어나고 있는지에 대한 답을 찾았다."]],"w":"4번에서 오랫동안 이유를 몰랐던 일을 great mystery라고 하고, 5번에서 과학자들이 마침내 답을 찾아요. mystery는 '이유를 알 수 없는 일, 수수께끼'예요.","c":2},"h":"2e43ad826d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This water moves through cracks in the ice and slowly comes out.)","ko":"이 물은 얼음의 갈라진 틈을 지나 천천히 흘러나온다.","opts":["녹은 물","두꺼운 층","갈라진 틈","반짝이는 빛"],"word":"cracks","r":{"a":"3) 갈라진 틈","ev":"7번 문장","s":[[7,"This water moves through cracks in the ice and slowly comes out.","이 물은 얼음의 갈라진 틈을 지나 천천히 흘러나온다."]],"w":"물이 얼음 속의 cracks를 지나 밖으로 나와요. cracks는 얼음이 갈라져 생긴 틈이에요.","c":3},"h":"91949cba2d"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes the water turn a deep red color.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 물을 짙은 붉은색으로 변하게 한다.","opts":["얼음의 갈라진 틈","빙하가 하얗다는 것","물이 천천히 흘러나오는 것","물속 철분이 산소와 섞이는 것"],"r":{"a":"4) 물속 철분이 산소와 섞이는 것","ev":"8~9번 문장","s":[[8,"When the water meets the air, the iron inside it mixes with oxygen.","물이 공기와 만나면, 그 안의 철분이 산소와 섞인다."],[9,"This makes the water turn a deep red color.","이것이 물을 짙은 붉은색으로 변하게 한다."]],"w":"9번의 This는 바로 앞 8번 문장 내용을 받아요. 철분이 산소와 섞여서 물이 짙은 붉은색으로 변해요.","c":4},"h":"7c2f3e2eae"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The secret of the red waterfall isn’t a mystery anymore.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"붉은 폭포의 비밀은 더 이상 수수께끼가 아니다.","opts":["붉은 폭포의 비밀은 이제 더 이상 수수께끼가 아니다.","붉은 폭포의 비밀은 여전히 풀리지 않았다.","붉은 폭포는 더 이상 붉지 않다.","붉은 폭포의 비밀을 아무도 알고 싶어 하지 않는다."],"r":{"a":"1) 붉은 폭포의 비밀은 이제 더 이상 수수께끼가 아니다.","ev":"10번 문장","s":[[10,"The secret of the red waterfall isn’t a mystery anymore.","붉은 폭포의 비밀은 더 이상 수수께끼가 아니다."]],"w":"isn’t ~ anymore는 '더 이상 ~이 아니다'예요. 5번에서 답을 찾았으니 비밀은 풀린 거예요.","c":1},"h":"9dfc559035"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["빙하는 붉고 폭포는 하얗다.","과학자들은 아직 답을 찾지 못했다.","철분 많은 짠물이 얼음의 갈라진 틈으로 천천히 흘러나온다.","철분과 산소는 빙하 깊은 곳에서 이미 섞여 있다."],"opts":["The glacier is red and the waterfall is white.","Scientists have not found the answer yet.","Salty water with iron slowly comes out through cracks in the ice.","Iron and oxygen are already mixed deep under the glacier."],"r":{"a":"3) Salty water with iron slowly comes out through cracks in the ice.","ev":"6~7번 문장","s":[[6,"Deep under the glacier, there is salty water that has a lot of iron.","빙하 깊은 곳에는 철분이 많이 들어 있는 짠물이 있다."],[7,"This water moves through cracks in the ice and slowly comes out.","이 물은 얼음의 갈라진 틈을 지나 천천히 흘러나온다."]],"w":"6~7번에서 철분이 많은 짠물이 얼음의 갈라진 틈으로 천천히 나온다고 해요. 붉은 것은 물이고 빙하는 하얗고(3번), 답은 이미 찾았으며(5번), 철분이 산소와 섞이는 것은 공기를 만난 뒤예요(8번).","c":3},"h":"84cdae4e0e"},{"n":9,"t":"sum","q":"The salty water under the glacier has a lot of (A), and when it meets the (B), the water turns red.","ko":"빙하 아래의 짠물에는 (A)이 많이 들어 있고, 그것이 (B)와 만나면 물이 붉게 변한다.","oko":["(A) 철분 / (B) 얼음","(A) 산소 / (B) 공기","(A) 설탕 / (B) 공기","(A) 철분 / (B) 공기","(A) 산소 / (B) 얼음"],"opts":["(A) iron / (B) ice","(A) oxygen / (B) air","(A) sugar / (B) air","(A) iron / (B) air","(A) oxygen / (B) ice"],"r":{"a":"4) (A) iron / (B) air","ev":"6, 8, 9번 문장","s":[[6,"Deep under the glacier, there is salty water that has a lot of iron.","빙하 깊은 곳에는 철분이 많이 들어 있는 짠물이 있다."],[8,"When the water meets the air, the iron inside it mixes with oxygen.","물이 공기와 만나면, 그 안의 철분이 산소와 섞인다."],[9,"This makes the water turn a deep red color.","이것이 물을 짙은 붉은색으로 변하게 한다."]],"w":"6번에서 짠물에는 철분(iron)이 많고, 8~9번에서 물이 공기(air)와 만나면 철분이 산소와 섞여 붉어져요. 철분이 많은 쪽은 oxygen이 아니라 iron이에요.","c":4},"h":"d7ade371d0"},{"n":10,"t":"fill","q":"People call it Blood Falls because dark [A] water flows out of a white [B].","ko":"짙은 [A]색 물이 하얀 [B]에서 흘러나와서 사람들은 그것을 블러드 폴스라고 부른다.","bank":["red","glacier","salty","iron","cracks","mystery"],"bko":{"red":"붉은","glacier":"빙하","salty":"짠","iron":"철분","cracks":"갈라진 틈","mystery":"수수께끼"},"r":{"a":"[A] red, [B] glacier","ev":"3번 문장","s":[[3,"Dark red water flows out of a white glacier, so people call it “Blood Falls.”","짙은 붉은색 물이 하얀 빙하에서 흘러나와서, 사람들은 그것을 ‘블러드 폴스(피의 폭포)’라고 부른다."]],"w":"3번 문장 Dark red water flows out of a white glacier에서 가져왔어요. salty와 iron은 빙하 속 물의 특징이라(6번) 폭포의 이름이 붙은 이유가 아니에요.","c":null},"h":"760e62e9ff"}]},{"u":9,"id":"b1-09-4","no":4,"ko":"아무도 가지 않는 곳, 포인트 니모의 쓸모","items":[{"n":1,"t":"tf","q":"Point Nemo is more than 2,600 kilometers away from any land.","ko":"포인트 니모는 어떤 육지로부터도 2,600킬로미터 넘게 떨어져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It’s more than 2,600 kilometers away from any land.","그곳은 어떤 육지로부터도 2,600킬로미터 넘게 떨어져 있다."]],"w":"2번 문장에 It’s more than 2,600 kilometers away from any land가 나와요. It은 포인트 니모를 가리켜요.","c":"T"},"h":"584a264ead"},{"n":2,"t":"tf","q":"Spacecraft and satellites can stay in space forever.","ko":"우주선과 인공위성은 우주에 영원히 머무를 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Spacecraft and satellites cannot stay in space forever.","우주선과 인공위성은 우주에 영원히 머무를 수 없다."]],"w":"7번에서 우주선과 인공위성은 우주에 영원히 머무를 수 없다(cannot stay in space forever)고 해요. can과 cannot이 반대예요.","c":"F"},"h":"81e5e48e88"},{"n":3,"t":"tf","q":"Most falling spacecraft burn up in the air.","ko":"떨어지는 우주선 대부분은 공기 중에서 타 버린다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Most of them burn up in the air.","그것들 대부분은 공기 중에서 타 버린다."]],"w":"10번에서 Most of them burn up in the air라고 해요. 대부분은 공기 중에서 타 버려요.","c":"T"},"h":"3862f3d5ed"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The water around Point Nemo does not have many nutrients.)","ko":"포인트 니모 주변의 물에는 영양분이 많지 않다.","opts":["영양분","소음","온도","쓰레기"],"word":"nutrients","r":{"a":"1) 영양분","ev":"4~5번 문장","s":[[4,"The water around Point Nemo does not have many nutrients.","포인트 니모 주변의 물에는 영양분이 많지 않다."],[5,"So even sea animals are rare.","그래서 바다 동물조차 드물다."]],"w":"4번에서 물에 nutrients가 많지 않다고 하고, 5번에서 그래서 바다 동물조차 드물다고 해요. 동물이 살 수 있게 해 주는 영양분이라는 뜻이에요.","c":1},"h":"b0c7aab7b8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To keep people and nature safe, scientists guide these falling objects to Point Nemo.)","ko":"사람과 자연을 안전하게 지키기 위해, 과학자들은 이 떨어지는 물체들을 포인트 니모로 유도한다.","opts":["막다","이끌어 가다","바꾸다","숨기다"],"word":"guide","r":{"a":"2) 이끌어 가다","ev":"12번 문장","s":[[12,"To keep people and nature safe, scientists guide these falling objects to Point Nemo.","사람과 자연을 안전하게 지키기 위해, 과학자들은 이 떨어지는 물체들을 포인트 니모로 유도한다."]],"w":"과학자들이 떨어지는 물체를 포인트 니모로 가도록 이끌어요. guide는 '길을 알려 이끌다, 유도하다'예요.","c":2},"h":"dde1067f40"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis shows that even the emptiest place on Earth can have an important role.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 지구에서 가장 텅 빈 곳조차도 중요한 역할을 할 수 있음을 보여 준다.","opts":["우주선이 우주에 영원히 머무를 수 없다는 것","포인트 니모에 사람이 거의 가지 않는다는 것","과학자들이 떨어지는 물체를 포인트 니모로 유도한다는 것","일부 조각이 바다에 떨어진다는 것"],"r":{"a":"3) 과학자들이 떨어지는 물체를 포인트 니모로 유도한다는 것","ev":"12~13번 문장","s":[[12,"To keep people and nature safe, scientists guide these falling objects to Point Nemo.","사람과 자연을 안전하게 지키기 위해, 과학자들은 이 떨어지는 물체들을 포인트 니모로 유도한다."],[13,"This shows that even the emptiest place on Earth can have an important role.","이것은 지구에서 가장 텅 빈 곳조차도 중요한 역할을 할 수 있음을 보여 준다."]],"w":"13번의 This는 바로 앞 12번 내용을 받아요. 과학자들이 떨어지는 물체를 포인트 니모로 유도하는 일이 가장 텅 빈 곳의 중요한 역할을 보여 줘요.","c":3},"h":"975dc2b379"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As they fall, they move very fast and get very hot.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"떨어지는 동안 그것들은 매우 빠르게 움직이고 매우 뜨거워진다.","opts":["떨어질수록 느려지고 차가워진다.","떨어지는 동안 속도는 빠르지만 온도는 그대로이다.","떨어진 뒤에야 매우 뜨거워진다.","떨어지는 동안 매우 빠르게 움직이고 몹시 뜨거워진다."],"r":{"a":"4) 떨어지는 동안 매우 빠르게 움직이고 몹시 뜨거워진다.","ev":"9번 문장","s":[[9,"As they fall, they move very fast and get very hot.","떨어지는 동안 그것들은 매우 빠르게 움직이고 매우 뜨거워진다."]],"w":"As they fall은 '떨어지는 동안'이고 move very fast and get very hot은 '매우 빠르게 움직이고 매우 뜨거워진다'예요.","c":4},"h":"091133e836"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["일부 우주선 조각은 바다에 떨어진다.","포인트 니모 주변에는 바다 동물이 많이 산다.","우주선은 뜨거워지기 전에 모두 사라진다.","과학자들은 사람이 많은 곳이라서 포인트 니모를 쓴다."],"opts":["Some parts of spacecraft fall into the ocean.","Many sea animals live around Point Nemo.","Spacecraft disappear before they get hot.","Scientists use Point Nemo because it is crowded."],"r":{"a":"1) Some parts of spacecraft fall into the ocean.","ev":"11번 문장","s":[[11,"But some parts fall into the ocean.","하지만 일부 조각은 바다에 떨어진다."]],"w":"11번에서 일부 조각은 바다에 떨어진다고 해요. 포인트 니모 주변은 바다 동물도 드물고(5번), 우주선은 떨어지며 뜨거워지고(9번), 포인트 니모는 텅 빈 곳이에요(6번).","c":1},"h":"0885a3229a"},{"n":9,"t":"sum","q":"Spacecraft cannot stay in space forever, so they (A) to Earth. Most of them (B) in the air.","ko":"우주선은 우주에 영원히 머무를 수 없어서 지구로 (A). 대부분은 공기 중에서 (B).","oko":["(A) 날아간다 / (B) 자란다","(A) 떨어진다 / (B) 얼어붙는다","(A) 올라간다 / (B) 타 버린다","(A) 머무른다 / (B) 사라진다","(A) 떨어진다 / (B) 타 버린다"],"opts":["(A) fly / (B) grow","(A) fall / (B) freeze","(A) rise / (B) burn up","(A) stay / (B) disappear","(A) fall / (B) burn up"],"r":{"a":"5) (A) fall / (B) burn up","ev":"7~10번 문장","s":[[7,"Spacecraft and satellites cannot stay in space forever.","우주선과 인공위성은 우주에 영원히 머무를 수 없다."],[8,"When they are done with their work, they fall back to Earth.","그것들이 임무를 마치면, 지구로 다시 떨어진다."],[9,"As they fall, they move very fast and get very hot.","떨어지는 동안 그것들은 매우 빠르게 움직이고 매우 뜨거워진다."],[10,"Most of them burn up in the air.","그것들 대부분은 공기 중에서 타 버린다."]],"w":"7~8번에서 우주선은 임무를 마치면 지구로 떨어지고(fall), 9~10번에서 대부분은 공기 중에서 타 버려요(burn up).","c":5},"h":"cf79d51af7"},{"n":10,"t":"fill","q":"Because Point Nemo is [A], scientists use it as a safe [B] to bring down old spacecraft.","ko":"포인트 니모는 [A] 곳이기 때문에, 과학자들은 그곳을 낡은 우주선을 떨어뜨리는 안전한 [B]로 사용한다.","bank":["empty","place","rare","nutrients","satellite","land"],"bko":{"empty":"텅 빈","place":"장소","rare":"드문","nutrients":"영양분","land":"육지","satellite":"인공위성"},"r":{"a":"[A] empty, [B] place","ev":"6번 문장","s":[[6,"Because Point Nemo is empty, scientists use it as a safe place to bring down old spacecraft.","포인트 니모는 텅 비어 있기 때문에, 과학자들은 그곳을 낡은 우주선을 떨어뜨리는 안전한 장소로 사용한다."]],"w":"6번 문장 Because Point Nemo is empty, scientists use it as a safe place to bring down old spacecraft에서 가져왔어요. rare(드문)는 바다 동물의 상태(5번)이고, nutrients(영양분)·satellite(인공위성)·land(육지)는 이 문장의 빈칸 뜻과 맞지 않아요.","c":null},"h":"9decb63462"}]},{"u":10,"id":"b1-10-1","no":1,"ko":"짧은 영상은 왜 자꾸 사고 싶게 만들까?","items":[{"n":1,"t":"tf","q":"Many short videos are designed to sell you things.","ko":"많은 짧은 영상은 당신에게 물건을 팔기 위해 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But many short videos are actually designed to sell you things.","하지만 많은 짧은 영상은 사실 당신에게 물건을 팔기 위해 만들어진 것이다."]],"w":"3번 문장에 many short videos are actually designed to sell you things가 있음. 사실은 물건을 팔려고 만든 것이라는 내용과 일치.","c":"T"},"h":"2b9bcba921"},{"n":2,"t":"tf","q":"Short videos look like regular advertisements.","ko":"짧은 영상은 일반 광고처럼 보인다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"First, they don’t feel like regular advertisements.","첫째, 그것들은 일반 광고처럼 느껴지지 않는다."],[6,"Instead, they look like friendly advice or useful tips, so you tend to trust them more.","대신, 친근한 조언이나 유용한 팁처럼 보여서, 당신은 그것들을 더 믿는 경향이 있다."]],"w":"5번 문장에서 they don’t feel like regular advertisements(일반 광고처럼 느껴지지 않는다)라고 함. 6번에서도 광고 대신 친근한 조언이나 팁처럼 보인다고 하므로 틀린 진술.","c":"F"},"h":"0ad8d779a4"},{"n":3,"t":"tf","q":"Seeing many people use the same item can make you feel left out.","ko":"같은 물건을 쓰는 많은 사람을 보면 당신은 소외된 기분이 들 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"In addition, they often show many people using the same item.","게다가, 그것들은 같은 물건을 사용하는 많은 사람을 자주 보여 준다."],[10,"This makes you feel like everyone has it except you.","이것은 당신만 빼고 모두가 그것을 가진 것처럼 느끼게 한다."]],"w":"9번에서 같은 물건을 쓰는 많은 사람을 보여 주고, 10번에서 그것이 나만 빼고 모두가 가진 것처럼 느끼게 한다고 함. 소외된 기분과 일치.","c":"T"},"h":"9155422a56"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? They’re quick and fun, and they look like simple entertainment.","ko":"그것들은 빠르고 재미있으며, 단순한 entertainment처럼 보인다.","opts":["교육","오락","운동","요리"],"word":"entertainment","r":{"a":"2) 오락","ev":"2번 문장","s":[[2,"They’re quick and fun, and they look like simple entertainment.","그것들은 빠르고 재미있으며, 단순한 오락처럼 보인다."]],"w":"빠르고 재미있다(quick and fun)와 함께 쓰여서, 보고 즐기는 오락. entertainment = 오락.","c":2},"h":"d09f95e536"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? It can pressure you to buy something just to fit in.","ko":"그것은 어울리기 위해서라도 무언가를 사도록 당신을 pressure할 수 있다.","opts":["도와주다","허락하다","칭찬하다","압박하다"],"word":"pressure","r":{"a":"4) 압박하다","ev":"12번 문장","s":[[12,"It can pressure you to buy something just to fit in.","그것은 당신이 어울리기 위해서라도 무언가를 사도록 압박할 수 있다."]],"w":"FOMO 때문에 어울리려고 무언가를 사게 되는 상황이라, 사라고 몰아붙이는 것. pressure = 압박하다.","c":4},"h":"54e43fe62a"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis makes you feel like everyone has it except you.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"이것은 당신만 빼고 모두가 그것을 가진 것처럼 느끼게 한다.","opts":["같은 물건","짧은 영상","휴대폰","광고"],"r":{"a":"1) 같은 물건","ev":"9~10번 문장","s":[[9,"In addition, they often show many people using the same item.","게다가, 그것들은 같은 물건을 사용하는 많은 사람을 자주 보여 준다."],[10,"This makes you feel like everyone has it except you.","이것은 당신만 빼고 모두가 그것을 가진 것처럼 느끼게 한다."]],"w":"9번에서 많은 사람이 사용하는 것이 the same item(같은 물건). 10번의 it은 나만 빼고 모두가 가진 그 물건.","c":1},"h":"8958cab8f5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So try to notice them before you click “buy.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러니 \"구매\" 버튼을 누르기 전에 그것들을 알아차리려고 해 보자.","opts":["구매 버튼을 누른 뒤에 후기를 쓰자.","영상을 보기 전에 휴대폰을 꺼 두자.","구매 버튼을 누르기 전에 그 속임수들을 알아차리려고 해 보자.","그 영상을 친구들에게 공유한 뒤에 구매하자."],"r":{"a":"3) 구매 버튼을 누르기 전에 그 속임수들을 알아차리려고 해 보자.","ev":"14번 문장","s":[[14,"So try to notice them before you click “buy.”","그러니 \"구매\" 버튼을 누르기 전에 그것들을 알아차리려고 해 보자."]],"w":"notice them before you click buy = 구매를 누르기 전에 그것들(속임수들)을 알아차리다. 후기, 휴대폰, 공유에 대한 말은 본문에 없음.","c":3},"h":"125c2ceb62"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["짧은 영상은 늘 일반 광고처럼 보인다.","영상의 느린 속도가 신중하게 생각하게 해 준다.","FOMO는 무언가를 놓친 것을 기뻐하는 마음이다.","짧은 영상은 어울리기 위해 물건을 사도록 압박할 수 있다."],"opts":["Short videos always look like regular advertisements.","The slow pace of the videos helps you think carefully.","FOMO is a feeling of being happy about missing something.","Short videos can pressure you to buy something just to fit in."],"r":{"a":"4) Short videos can pressure you to buy something just to fit in.","ev":"11~12번 문장","s":[[11,"That feeling is called FOMO, or fear of missing out.","그 느낌을 FOMO, 즉 놓칠까 봐 두려워하는 마음이라고 한다."],[12,"It can pressure you to buy something just to fit in.","그것은 당신이 어울리기 위해서라도 무언가를 사도록 압박할 수 있다."]],"w":"12번에서 FOMO는 어울리려고 무언가를 사도록 압박할 수 있다고 함. 영상은 광고처럼 느껴지지 않고(5번), 속도가 빨라 생각할 틈이 없으며(7~8번), FOMO는 놓칠까 봐 두려운 마음임(11번).","c":4},"h":"eaad7b4218"},{"n":9,"t":"sum","q":"Short videos look like friendly (A), so you tend to (B) them more.","ko":"짧은 영상은 친근한 (A)처럼 보여서, 당신은 그것들을 더 (B)하는 경향이 있다.","oko":["(A) 광고 / (B) 믿는다","(A) 게임 / (B) 믿는다","(A) 조언 / (B) 믿는다","(A) 조언 / (B) 두려워한다","(A) 광고 / (B) 의심한다"],"opts":["(A) advertisements / (B) trust","(A) games / (B) trust","(A) advice / (B) trust","(A) advice / (B) fear","(A) advertisements / (B) doubt"],"r":{"a":"3) (A) advice / (B) trust","ev":"6번 문장","s":[[6,"Instead, they look like friendly advice or useful tips, so you tend to trust them more.","대신, 친근한 조언이나 유용한 팁처럼 보여서, 당신은 그것들을 더 믿는 경향이 있다."]],"w":"6번 문장에 they look like friendly advice or useful tips, so you tend to trust them more가 있음. 따라서 advice(조언)와 trust(믿다). 광고처럼 느껴지지 않는다고 했으므로 advertisements는 아님.","c":3},"h":"cc02012aab"},{"n":10,"t":"fill","q":"The fast [A] grabs your attention, so you get pulled in before you think about whether you need the [B].","ko":"빠른 [A]가 당신의 주의를 사로잡아서, 그 [B]이(가) 필요한지 생각해 보기도 전에 빨려 들어간다.","bko":{"pace":"속도","product":"제품","trust":"믿다","advertisements":"광고","pressure":"압박하다","FOMO":"포모(놓칠까 봐 두려운 마음)"},"bank":["pace","FOMO","product","trust","advertisements","pressure"],"r":{"a":"[A] pace, [B] product","ev":"7~8번 문장","s":[[7,"Next, the fast pace grabs your attention right away.","다음으로, 빠른 속도가 당장 당신의 주의를 사로잡는다."],[8,"You get pulled in before you can think about whether you really need the product.","당신은 그 제품이 정말 필요한지 생각해 보기도 전에 빨려 들어간다."]],"w":"7번 the fast pace grabs your attention과 8번 before you can think about whether you really need the product에서 가져옴. FOMO, trust, advertisements는 다른 문장의 단어라 이 빈칸에 맞지 않음.","c":null},"h":"f2ebcd8969"}]},{"u":10,"id":"b1-10-2","no":2,"ko":"공짜 앱, 진짜 공짜일까?","items":[{"n":1,"t":"tf","q":"Free apps often track what you do.","ko":"무료 앱은 당신이 하는 일을 자주 추적한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Free apps often track what you do, such as what you like, where you go, and how you use your phone.","무료 앱은 당신이 하는 일, 예를 들어 무엇을 좋아하는지, 어디에 가는지, 휴대폰을 어떻게 사용하는지를 자주 추적한다."]],"w":"10번 문장에 Free apps often track what you do가 있음. 일치하는 내용.","c":"T"},"h":"622546cfe0"},{"n":2,"t":"tf","q":"Companies give things away only to be nice.","ko":"회사들은 단지 친절하려고만 물건을 공짜로 준다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"Companies don’t give things away just to be nice.","회사들은 단지 친절하려고 물건을 공짜로 주지 않는다."],[6,"When something is free, they usually get something in return.","무언가가 무료일 때, 그들은 보통 그 대가로 무언가를 얻는다."]],"w":"5번에서 Companies don’t give things away just to be nice라고 함. 6번에서 무료일 때 회사는 대가로 무언가를 얻는다고 하므로 틀린 진술.","c":"F"},"h":"ca169fa369"},{"n":3,"t":"tf","q":"Companies sometimes sell your data to others.","ko":"회사들은 때때로 당신의 정보를 다른 곳에 판다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Sometimes, they even sell your data to others.","때로는, 심지어 당신의 정보를 다른 곳에 팔기도 한다."]],"w":"12번 문장에 Sometimes, they even sell your data to others가 있음. 일치하는 내용.","c":"T"},"h":"db397b205c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? When something is free, they usually get something in return.","ko":"무언가가 무료일 때, 그들은 보통 무언가를 in return 얻는다.","opts":["실수로","미리","그 대가로","혼자서"],"word":"in return","r":{"a":"3) 그 대가로","ev":"6번 문장","s":[[6,"When something is free, they usually get something in return.","무언가가 무료일 때, 그들은 보통 그 대가로 무언가를 얻는다."]],"w":"무료로 주면서 회사가 얻는 것이므로, 준 것에 대한 보답·대가로 얻는다는 뜻. in return = 그 대가로.","c":3},"h":"0739db41fa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? So next time you see a free offer, remember that there’s a hidden cost.","ko":"그러니 다음에 무료 혜택을 보면, hidden 비용이 있다는 것을 기억하라.","opts":["작은","새로운","무서운","숨겨진"],"word":"hidden","r":{"a":"4) 숨겨진","ev":"13번 문장","s":[[13,"So next time you see a free offer, remember that there’s a hidden cost.","그러니 다음에 무료 혜택을 보면, 숨겨진 비용이 있다는 것을 기억하라."]],"w":"4~12번에서 겉으로는 공짜지만 속으로 얻는 대가가 있다고 설명함. 겉에서 보이지 않는 비용이므로 hidden = 숨겨진.","c":4},"h":"8e1c1019c2"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSometimes, they even sell your data to others.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"때로는, 심지어 당신의 정보를 다른 곳에 팔기도 한다.","opts":["손님들","회사들","가게 점원들","당신의 친구들"],"r":{"a":"2) 회사들","ev":"11~12번 문장","s":[[11,"Companies use this information to show you advertisements or recommend products.","회사들은 이 정보를 이용해 당신에게 광고를 보여 주거나 제품을 추천한다."],[12,"Sometimes, they even sell your data to others.","때로는, 심지어 당신의 정보를 다른 곳에 팔기도 한다."]],"w":"11번 문장의 주어가 Companies(회사들). 12번의 they는 정보를 광고와 추천에 쓰고, 심지어 팔기도 하는 그 회사들.","c":2},"h":"018185b1e2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That tiny taste could lead to a big sale.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 작은 맛이 큰 판매로 이어질 수 있다.","opts":["작은 가게는 큰 가게보다 맛이 좋다.","맛을 보면 대부분 사고 싶지 않아진다.","작은 맛보기 하나가 큰 판매로 이어질 수 있다.","큰 판매 행사에서는 작은 샘플을 나눠 준다."],"r":{"a":"3) 작은 맛보기 하나가 큰 판매로 이어질 수 있다.","ev":"8번 문장","s":[[8,"That tiny taste could lead to a big sale.","그 작은 맛이 큰 판매로 이어질 수 있다."]],"w":"tiny taste = 아주 작은 맛보기(무료 샘플), lead to a big sale = 큰 판매로 이어지다. 가게 크기나 판매 행사에 대한 말은 본문에 없음.","c":3},"h":"320c38df45"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["회사들은 모은 정보를 절대 사용하지 않는다.","회사들은 정보를 이용해 광고를 보여 주거나 제품을 추천한다.","무료 샘플은 단지 친절하려고 주는 것이다.","회사들은 당신의 정보를 다른 곳에 팔지 않는다."],"opts":["Companies never use the information they collect.","Companies use information to show you advertisements or recommend products.","Free samples are given only to be nice.","Companies do not sell your data to others."],"r":{"a":"2) Companies use information to show you advertisements or recommend products.","ev":"11~12번 문장","s":[[11,"Companies use this information to show you advertisements or recommend products.","회사들은 이 정보를 이용해 당신에게 광고를 보여 주거나 제품을 추천한다."],[12,"Sometimes, they even sell your data to others.","때로는, 심지어 당신의 정보를 다른 곳에 팔기도 한다."]],"w":"11번에서 회사들이 정보를 이용해 광고를 보여 주거나 제품을 추천한다고 함. 12번에서는 정보를 팔기도 한다고 하므로 4번 선지도 틀림. 샘플은 친절 때문이 아님(5, 7번).","c":2},"h":"bbb3dde07f"},{"n":9,"t":"sum","q":"In other cases, your personal data is the real (A), and free apps often (B) what you do.","ko":"다른 경우에는, 당신의 개인 정보가 진짜 (A)이고, 무료 앱은 당신이 하는 일을 자주 (B)한다.","oko":["(A) 선물 / (B) 추적한다","(A) 가격 / (B) 잊는다","(A) 게임 / (B) 추적한다","(A) 가격 / (B) 추적한다","(A) 보상 / (B) 숨긴다"],"opts":["(A) gift / (B) track","(A) price / (B) forget","(A) game / (B) track","(A) price / (B) track","(A) reward / (B) hide"],"r":{"a":"4) (A) price / (B) track","ev":"9~10번 문장","s":[[9,"In other cases, your personal data is the real price.","다른 경우에는, 당신의 개인 정보가 진짜 가격이다."],[10,"Free apps often track what you do, such as what you like, where you go, and how you use your phone.","무료 앱은 당신이 하는 일, 예를 들어 무엇을 좋아하는지, 어디에 가는지, 휴대폰을 어떻게 사용하는지를 자주 추적한다."]],"w":"9번에서 your personal data is the real price, 10번에서 Free apps often track what you do라고 함. 따라서 price(가격)와 track(추적하다).","c":4},"h":"5185d583e5"},{"n":10,"t":"fill","q":"Stores offer free samples so you’ll remember the [A] and maybe [B] it later.","ko":"가게들은 당신이 그 [A]을(를) 기억하고 나중에 아마 그것을 [B]할 수 있도록 무료 샘플을 제공한다.","bko":{"brand":"브랜드","data":"정보","buy":"사다","sell":"팔다","track":"추적하다","price":"가격"},"bank":["brand","data","buy","sell","track","price"],"r":{"a":"[A] brand, [B] buy","ev":"7번 문장","s":[[7,"For example, stores offer free samples, so you’ll remember the brand and maybe buy it later.","예를 들어, 가게들은 무료 샘플을 제공하는데, 이는 당신이 그 브랜드를 기억하고 나중에 아마 살 수도 있게 하려는 것이다."]],"w":"7번 stores offer free samples, so you’ll remember the brand and maybe buy it later에서 가져옴. sell과 track은 회사가 정보로 하는 일(10~12번)이라 샘플 이야기와 맞지 않음.","c":null},"h":"370ea3856e"}]},{"u":10,"id":"b1-10-3","no":3,"ko":"팝콘 중간 사이즈는 왜 있는 걸까?","items":[{"n":1,"t":"tf","q":"The large popcorn costs only $1 more than the medium.","ko":"큰 팝콘은 중간 팝콘보다 겨우 1달러 더 비싸다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Now, the large is only $1 more than the medium.","이제 큰 것은 중간 것보다 겨우 1달러 더 비쌀 뿐이다."]],"w":"4번 문장에 the large is only $1 more than the medium이 있음. 큰 것 $7, 중간 것 $6이므로 일치.","c":"T"},"h":"4af03b6a34"},{"n":2,"t":"tf","q":"The medium popcorn is the one the company wants you to buy.","ko":"중간 팝콘은 회사가 당신이 사길 바라는 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Its job is not to be bought, but to make the nearby option, the large, look much more attractive.","그것의 역할은 구매되는 것이 아니라, 근처의 선택지인 큰 것을 훨씬 더 매력적으로 보이게 하는 것이다."]],"w":"8번 문장에서 Its job is not to be bought(그것의 역할은 구매되는 것이 아니다)라고 함. 중간 크기는 큰 것을 돋보이게 하는 미끼이므로 틀린 진술.","c":"F"},"h":"178e871bdb"},{"n":3,"t":"tf","q":"The writer says you should be careful when you see three choices.","ko":"글쓴이는 선택지 세 개를 볼 때 조심해야 한다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"So, next time you see three choices, be careful of decoys!","그러니 다음에 선택지 세 개를 보면, 미끼를 조심하라!"]],"w":"11번 문장에 next time you see three choices, be careful of decoys!가 있음. 일치하는 내용.","c":"T"},"h":"080d7f0764"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? It’s a tough choice between saving money and getting more snacks.","ko":"돈을 아끼는 것과 더 많은 간식을 얻는 것 사이에서 tough한 선택이다.","opts":["어려운","쉬운","빠른","공짜의"],"word":"tough","r":{"a":"1) 어려운","ev":"2번 문장","s":[[2,"It’s a tough choice between saving money and getting more snacks.","돈을 아끼는 것과 더 많은 간식을 얻는 것 사이에서 고르기 어려운 선택이다."]],"w":"돈을 아낄지 간식을 더 얻을지 고민된다는 상황이라, 쉽게 고르기 힘든 선택. tough = 어려운.","c":1},"h":"8630f7b05c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? This clever trick is called the decoy effect.","ko":"이 clever한 속임수는 미끼 효과라고 불린다.","opts":["서투른","영리한","위험한","오래된"],"word":"clever","r":{"a":"2) 영리한","ev":"3~6번 문장","s":[[3,"But then, a third option appears: a medium for $6.","하지만 그때, 세 번째 선택지가 나타난다. $6짜리 중간 크기이다."],[4,"Now, the large is only $1 more than the medium.","이제 큰 것은 중간 것보다 겨우 1달러 더 비쌀 뿐이다."],[5,"Suddenly, the large seems like a much better deal, even if you didn’t want that much.","갑자기, 큰 것은 그렇게 많은 양을 원하지 않았더라도 훨씬 더 좋은 거래처럼 보인다."],[6,"This clever trick is called the decoy effect.","이 영리한 속임수는 미끼 효과라고 불린다."]],"w":"3~5번에서 큰 팝콘이 좋아 보이도록 머리를 쓴 속임수를 설명함. 그래서 clever = 영리한.","c":2},"h":"da67f42c84"},{"n":6,"t":"ref","q":"What does the underlined \"Its\" refer to?\nIts job is not to be bought, but to make the nearby option, the large, look much more attractive.","ko":"밑줄 친 Its이(가) 가리키는 것은?","sko":"그것의 역할은 구매되는 것이 아니라, 근처의 선택지인 큰 것을 훨씬 더 매력적으로 보이게 하는 것이다.","opts":["작은 것","큰 것","중간 것","팝콘 가게"],"r":{"a":"3) 중간 것","ev":"7~8번 문장","s":[[7,"The medium is the decoy.","중간 크기가 미끼이다."],[8,"Its job is not to be bought, but to make the nearby option, the large, look much more attractive.","그것의 역할은 구매되는 것이 아니라, 근처의 선택지인 큰 것을 훨씬 더 매력적으로 보이게 하는 것이다."]],"w":"7번에서 The medium is the decoy라고 했음. 8번의 Its job은 미끼인 중간 크기의 역할이며, 구매
