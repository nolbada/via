<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩그라피 5 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>

<script>
var P=[{"u":1,"id":"r01","no":1,"ko":"디즈니가 선택한 패션 아이템, 그 이유는?","items":[{"n":1,"t":"tf","q":"Animators looked for ways to save time because they had to draw each frame by hand.","h":"c96bfb9551","ko":"애니메이션 제작자들은 각 화면을 손으로 그려야 해서 시간을 아낄 방법을 찾았다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Animators had to draw each frame by hand, so they looked for ways to save time.","애니메이션 제작자들은 각 프레임을 손으로 그려야 했기 때문에, 그들은 시간을 절약할 방법을 찾았다."]],"w":"6번 문장에 draw each frame by hand, so they looked for ways to save time이 있음. 손으로 그려야 해서 시간 절약 방법을 찾았다는 내용과 일치.","c":"T"}},{"n":2,"t":"tf","q":"Animators saved time by making hands square instead of round.","h":"c138ffae0f","ko":"애니메이션 제작자들은 손을 둥글게 하는 대신 네모나게 만들어 시간을 아꼈다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"One trick was to simplify the design of hands by making them round instead of drawing detailed fingers.","한 가지 요령은 세밀한 손가락을 그리는 대신 손을 둥글게 만들어 손의 디자인을 단순화하는 것이었다."]],"w":"7번 문장은 손을 둥글게(round) 만들어 단순화했다고 함. square로 바꾼 것이 오답.","c":"F"}},{"n":3,"t":"tf","q":"White gloves also made characters like Mickey Mouse seem more human.","h":"6fad51131b","ko":"흰 장갑은 미키마우스 같은 캐릭터가 더 인간적으로 보이게도 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Although gloves were chosen for (B) needs, they also made characters like Mickey Mouse seem more human and relatable.","장갑은 실용적인 필요로 선택되었지만, 그것들은 또한 미키마우스와 같은 캐릭터를 더 인간적이고 공감되어 보이도록 했다."]],"w":"10번 문장에 they also made characters like Mickey Mouse seem more human and relatable이 있음. 본문과 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... instead of drawing detailed fingers.)","h":"01f2aca28c","ko":"... 상세한 손가락을 그리는 대신","opts":["거대한","상세한","단순한","어두운"],"word":"detailed","r":{"a":"2) 상세한","ev":"7번 문장","s":[[7,"One trick was to simplify the design of hands by making them round instead of drawing detailed fingers.","한 가지 요령은 세밀한 손가락을 그리는 대신 손을 둥글게 만들어 손의 디자인을 단순화하는 것이었다."]],"w":"7번 문장의 detailed fingers는 '자세히 그린 손가락'. detailed = 상세한. 단순한은 simplify 쪽 뜻이라 반대 방향.","c":2}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (... gloves as a reflection of animation's early history.)","h":"b3415aace2","ko":"... 장갑은 애니메이션 초기 역사의 반영이다.","opts":["복제","숙고, 깊은 생각","모방","반영"],"word":"reflection","r":{"a":"4) 반영","ev":"12번 문장","s":[[12,"Even today, many characters wear gloves as a reflection of animation’s early history.","오늘날에도, 많은 캐릭터들이 애니메이션의 초기 역사에 대한 반영으로 장갑을 끼고 있다."]],"w":"reflection은 다의어. 이 문장에서는 '(상태·속성의) 반영'. 초기 역사가 오늘날 장갑에 반영되어 있다는 흐름.","c":4}},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBut why do they wear them?","h":"ffda423cdb","ko":"밑줄 친 them이 가리키는 것은?","sko":"그런데 그들은 왜 그것을 끼고 있을까?","opts":["디즈니 캐릭터들","애니메이션 제작자들","흰 장갑","캐릭터들의 개성"],"r":{"a":"3) 흰 장갑","ev":"1~2번 문장","s":[[1,"Mickey, Minnie, Goofy, Pinocchio, and many other Disney characters all share one thing in common — white gloves.","미키, 미니, 구피, 피노키오, 그리고 다른 많은 디즈니 캐릭터들은 모두 흰색 장갑이라는 한 가지 공통점을 가지고 있다."],[2,"But why do they wear them?","그런데 그들은 왜 그것을 끼고 있을까?"]],"w":"1번 문장에서 캐릭터들이 공유하는 것이 white gloves. 2번의 they는 캐릭터들, them은 그들이 끼는 흰 장갑.","c":3}},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"White gloves solved this problem by making the hands stand out clearly.\"","h":"42acccacae","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"흰색 장갑은 손이 명확하게 눈에 띄도록 하여 이 문제를 해결했다.","opts":["흰 장갑이 손을 눈에 띄게 해서 손이 잘 안 보이던 문제를 해결했다.","흰 장갑 덕분에 손가락을 더 자세히 그릴 수 있어 문제가 해결됐다.","흰 장갑이 배경을 밝게 만들어 문제가 해결됐다.","흰 장갑이 그리는 시간을 줄여서 문제가 해결됐다."],"r":{"a":"1) 흰 장갑이 손을 눈에 띄게 해서 손이 잘 안 보이던 문제를 해결했다.","ev":"8~9번 문장","s":[[8,"But there was another problem with black-and-white cartoons: characters’ hands often became hard to see in dark or busy backgrounds.","하지만 흑백 만화영화에는 캐릭터의 손이 종종 어둡거나 복잡한 배경에서 보기 어렵다는 또 다른 문제가 있었다."],[9,"White gloves solved this problem by making the hands stand out clearly.","흰색 장갑은 손이 명확하게 눈에 띄도록 하여 이 문제를 해결했다."]],"w":"this problem은 8번의 어둡거나 복잡한 배경에서 손이 보기 어려웠던 문제. 흰 장갑이 손을 눈에 띄게 해 해결. 배경을 바꾸거나 시간을 줄였다는 말은 없음.","c":1}},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["제작자들은 모든 손에 세밀한 손가락을 그려서 시간을 아꼈다.","장갑이 없어도 어두운 배경에서 손이 쉽게 보였다.","현대 애니메이션에서 디즈니 캐릭터들은 장갑 끼는 것을 그만두었다.","구피와 피노키오 같은 디즈니 캐릭터들도 흰 장갑을 낀다."],"opts":["Animators saved time by drawing detailed fingers on every hand.","Hands were easy to see in dark backgrounds even without gloves.","Disney characters stopped wearing gloves in modern animation.","Disney characters such as Goofy and Pinocchio also wear white gloves."],"r":{"a":"4) Disney characters such as Goofy and Pinocchio also wear white gloves. (구피와 피노키오 같은 디즈니 캐릭터들도 흰 장갑을 낀다.)","ev":"1번 문장","s":[[1,"Mickey, Minnie, Goofy, Pinocchio, and many other Disney characters all share one thing in common — white gloves.","미키, 미니, 구피, 피노키오, 그리고 다른 많은 디즈니 캐릭터들은 모두 흰색 장갑이라는 한 가지 공통점을 가지고 있다."]],"w":"1번 문장에서 미키, 미니, 구피, 피노키오 등 많은 디즈니 캐릭터가 모두 흰 장갑이라는 공통점을 가진다고 함. ①은 7번(손가락 대신 둥글게), ②는 8번(어두운 배경에서 안 보임), ③은 12번(오늘날에도 장갑)과 어긋남.","c":4},"h":"4eebe81ef4"},{"n":9,"t":"sum","q":"In early animation, animators (A) the design of hands to save time, and white gloves made the hands (B) in dark or busy backgrounds.","ko":"초기 애니메이션에서 제작자들은 시간을 아끼려고 손 모양을 (A), 흰 장갑은 어둡거나 복잡한 배경에서 손을 (B) 상태로 만들었다.","oko":["(A) 복잡하게 만들었다 / (B) 눈에 보이는","(A) 단순화했다 / (B) 숨겨진","(A) 단순화했다 / (B) 눈에 보이는","(A) 복잡하게 만들었다 / (B) 숨겨진","(A) 없앴다 / (B) 눈에 보이는"],"opts":["(A) complicated / (B) visible","(A) simplified / (B) hidden","(A) simplified / (B) visible","(A) complicated / (B) hidden","(A) removed / (B) visible"],"r":{"a":"3) (A) simplified / (B) visible","ev":"7~9번 문장","s":[[7,"One trick was to simplify the design of hands by making them round instead of drawing detailed fingers.","한 가지 요령은 세밀한 손가락을 그리는 대신 손을 둥글게 만들어 손의 디자인을 단순화하는 것이었다."],[8,"But there was another problem with black-and-white cartoons: characters’ hands often became hard to see in dark or busy backgrounds.","하지만 흑백 만화영화에는 캐릭터의 손이 종종 어둡거나 복잡한 배경에서 보기 어렵다는 또 다른 문제가 있었다."],[9,"White gloves solved this problem by making the hands stand out clearly.","흰색 장갑은 손이 명확하게 눈에 띄도록 하여 이 문제를 해결했다."]],"w":"7번 simplify the design of hands(단순화), 9번 hands stand out(눈에 띔=잘 보임). 따라서 simplified와 visible.","c":3},"h":"8975906b3b"},{"n":10,"t":"fill","q":"In the early days of animation, [A] cartoons took a lot of time and [B].","ko":"애니메이션의 초창기에는 만화영화 [A]에 많은 시간과 [B]이(가) 들었다.","bko":{"solve":"해결하다","effort":"노력","frame":"프레임, 화면","creating":"만들기 (create의 -ing형)","backgrounds":"배경들 (background의 복수형)","save":"절약하다"},"bank":["solve","effort","frame","creating","backgrounds","save"],"r":{"a":"[A] creating (만들기 (create의 -ing형)), [B] effort (노력)","ev":"5번 문장","s":[[5,"In the early days of animation, creating cartoons took a lot of time and effort.","애니메이션의 초창기에는, 만화영화를 제작하는 것이 많은 시간과 노력이 들었다."]],"w":"5번 문장 \"creating cartoons took a lot of time and effort\"에서 가져옴. 나머지는 동사 solve·save, 명사 frame·backgrounds라 [A](주어 자리)와 [B](time and 뒤)에 맞지 않음.","c":null},"h":"b83df80a8a"}]},{"u":1,"id":"r02","no":2,"ko":"도로 위 3색 신호의 시작","items":[{"n":1,"t":"tf","q":"In the early railroad system, white meant 'caution' and green meant 'go.'","h":"d0e1801c34","ko":"초기 철도 체계에서 흰색은 '주의', 초록은 '가기'를 뜻했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"White was used for ‘go,’ and green was for ‘caution.’","흰색은 ‘출발’로, 녹색은 ‘주의’로 사용되었다."]],"w":"7번 문장은 White가 go, green이 caution. 뜻이 서로 바뀌어 있어 거짓.","c":"F"}},{"n":2,"t":"tf","q":"At night, train operators sometimes mistook a bright white light for stars.","h":"a1bef20e85","ko":"밤에 기차 기사들은 가끔 밝은 흰 불빛을 별로 착각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"At night, train operators sometimes mistook the bright white light for stars, causing confusion.","밤에, 기관사들이 때때로 밝은 흰색 불빛을 별로 착각하여 혼란을 초래했다."]],"w":"9번 문장에 At night, train operators sometimes mistook the bright white light for stars가 있음. 일치.","c":"T"}},{"n":3,"t":"tf","q":"Railroads used colored lanterns to guide trains.","h":"16b087a6e2","ko":"철도는 기차를 안내하려고 색깔 있는 랜턴을 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Back then, railroads used colored lanterns to guide trains.","그 당시, 철도 시설은 기차를 안내하기 위해 색이 있는 랜턴을 사용했다."]],"w":"5번 문장에 railroads used colored lanterns to guide trains가 있음. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, this system had a flaw.)","h":"453c0250a7","ko":"하지만 이 체계에는 결함이 있었다.","opts":["결함","장점","신호","위험"],"word":"flaw","r":{"a":"1) 결함","ev":"8~9번 문장","s":[[8,"However, this system had a flaw.","그러나, 이 체계에는 결함이 있었다."],[9,"At night, train operators sometimes mistook the bright white light for stars, causing confusion.","밤에, 기관사들이 때때로 밝은 흰색 불빛을 별로 착각하여 혼란을 초래했다."]],"w":"8번 뒤 9번에서 흰 불빛을 별로 착각해 혼란이 생김. 문제점이므로 flaw = 결함.","c":1}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (To address this, green was reassigned ...)","h":"3979020a30","ko":"이것에 대처하기 위해 초록이 재배정되었다.","opts":["~에 주소를 쓰다","~에게 연설하다","(문제에) 대처하다","피하다, 회피하다"],"word":"address","r":{"a":"3) (문제에) 대처하다","ev":"10번 문장","s":[[10,"To address this, green was reassigned to signal ‘go’ as it strongly contrasted with red.","이러한 문제에 대처하기 위해, 녹색은 빨간색과 강하게 대비를 이루므로 ‘출발’ 신호를 나타내도록 재배치되었다."]],"w":"address는 다의어. 여기서는 9번의 혼란 문제를 해결하려는 내용이라 '(문제에) 대처하다'. 주소, 연설 뜻은 문맥에 맞지 않음.","c":3}},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nWhy aren't colors like blue or pink, which seem more appealing, used instead?","h":"8ab85b153d","ko":"밑줄 친 which이 가리키는 것은?","sko":"파란색이나 분홍색처럼 더 매력적으로 보이는 색상들이 왜 대신 사용되지 않을까?","opts":["신호등","파랑이나 분홍 같은 색","빨강과 초록","철도 랜턴"],"r":{"a":"2) 파랑이나 분홍 같은 색","ev":"3번 문장","s":[[3,"Why aren’t colors like blue or pink, which seem more appealing, used instead?","파란색이나 분홍색처럼 더 매력적으로 보이는 색상들이 왜 대신 사용되지 않을까?"]],"w":"which 바로 앞이 colors like blue or pink. 더 매력적으로 보이는 것은 파랑이나 분홍 같은 색.","c":2}},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Red was used for ‘stop’ because it has long been associated with danger.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"빨간색은 오랫동안 위험과 관련되어 왔기 때문에 ‘정지’로 사용되었다.","opts":["빨간색은 오랫동안 위험과 관련되어 왔기 때문에 ‘정지’를 뜻하는 데 쓰였다.","빨간색은 가장 값싼 색이라서 ‘정지’를 뜻하는 데 쓰였다.","빨간색은 안전과 관련된 색이어서 ‘정지’를 뜻하는 데 쓰였다.","빨간색은 기관사들이 가장 좋아하는 색이어서 ‘정지’를 뜻하는 데 쓰였다."],"r":{"a":"1) 빨간색은 오랫동안 위험과 관련되어 왔기 때문에 ‘정지’를 뜻하는 데 쓰였다.","ev":"6번 문장","s":[[6,"Red was used for ‘stop’ because it has long been associated with danger.","빨간색은 오랫동안 위험과 관련되어 왔기 때문에 ‘정지’로 사용되었다."]],"w":"6번 문장 because it has long been associated with danger(오랫동안 위험과 관련되어 왔기 때문에). 값싸다·안전·기관사가 좋아함이라는 말은 본문에 없음.","c":1},"h":"ccdf1a1a43"},{"n":8,"t":"match","q":"Which is the same as the passage?","h":"1e34ec1e00","ko":"본문의 내용과 일치하는 것은?","oko":["파란색과 분홍색은 초기 철도 체계에서 사용되었다.","노란색은 빨간색과 녹색에서 구별하기 쉬워서 선택되었다.","기관사들은 낮에 밝은 흰색 불빛을 별로 착각했다.","신호등은 19세기에 해운업에서 처음 나왔다."],"opts":["Blue and pink were used in the early railroad system.","Yellow was chosen because it was easy to tell from red and green.","Train operators mistook the bright white light for stars during the day.","Traffic lights first came from the shipping industry in the 19th century."],"r":{"a":"2) Yellow was chosen because it was easy to tell from red and green.","ev":"4~7번, 9번, 11번 문장","s":[[4,"The color system for traffic lights originates from the railroad industry in the early 19th century.","신호등의 색상 체계는 19세기 초 철도 산업에서 유래했다."],[5,"Back then, railroads used colored lanterns to guide trains.","그 당시, 철도 시설은 기차를 안내하기 위해 색이 있는 랜턴을 사용했다."],[6,"Red was used for ‘stop’ because it has long been associated with danger.","빨간색은 오랫동안 위험과 관련되어 왔기 때문에 ‘정지’로 사용되었다."],[7,"White was used for ‘go,’ and green was for ‘caution.’","흰색은 ‘출발’로, 녹색은 ‘주의’로 사용되었다."],[9,"At night, train operators sometimes mistook the bright white light for stars, causing confusion.","밤에, 기관사들이 때때로 밝은 흰색 불빛을 별로 착각하여 혼란을 초래했다."],[11,"Yellow was introduced to mean ‘caution’ as it stood out well from both red and green.","노란색은 빨간색과 녹색 모두에서 잘 구별되기 때문에 ‘주의’를 의미하도록 도입되었다."]],"w":"②는 11번(stood out well from both red and green)과 일치. ①은 7번 초기 색(빨강·흰색·초록), ③은 9번 At night, ④는 4번 railroad industry와 어긋남.","c":2}},{"n":9,"t":"sum","q":"The traffic light color system began in the railroad industry, and it proved (A) and became the (B) of modern traffic signals.","ko":"신호등 색 체계는 철도 산업에서 시작되었고, 효과가 (A)임이 입증되어 현대 교통 신호의 (B)이(가) 되었다.","oko":["(A) 효과적인 / (B) 토대","(A) 효과적인 / (B) 끝","(A) 위험한 / (B) 토대","(A) 혼란스러운 / (B) 끝","(A) 값비싼 / (B) 토대"],"opts":["(A) effective / (B) foundation","(A) effective / (B) end","(A) dangerous / (B) foundation","(A) confusing / (B) end","(A) expensive / (B) foundation"],"r":{"a":"1) (A) effective / (B) foundation ((A) 효과적인 / (B) 토대)","ev":"4번, 12번 문장","s":[[4,"The color system for traffic lights originates from the railroad industry in the early 19th century.","신호등의 색상 체계는 19세기 초 철도 산업에서 유래했다."],[12,"This color system proved effective and became the foundation of modern traffic signals.","이러한 색상 체계는 효과적임이 입증되어 현대 교통 신호의 토대가 되었다."]],"w":"4번 문장에서 철도 산업에서 유래했고, 12번 문장에서 This color system proved effective and became the foundation of modern traffic signals라고 함.","c":1},"h":"9a144efcad"},{"n":10,"t":"fill","q":"As we cross the road, we [A] on one [B] signal to keep us safe: traffic lights.","ko":"도로를 건널 때, 우리는 우리를 안전하게 지키기 위해 한 가지 [B] 신호인 신호등에 [A]고 있다.","bko":{"guide":"안내하다","rely":"의존하다","essential":"필수적인","originate":"유래하다","contrast":"대비를 이루다","introduce":"도입하다"},"bank":["guide","rely","essential","originate","contrast","introduce"],"r":{"a":"[A] rely (의존하다), [B] essential (필수적인)","ev":"1번 문장","s":[[1,"As we cross the road, we rely on one essential signal to keep us safe: traffic lights.","우리는 도로를 건널 때, 우리를 안전하게 지키기 위해 한 가지 필수 신호인 신호등에 의존한다."]],"w":"1번 문장 \"we rely on one essential signal\"에서 가져옴. [A]는 on과 함께 쓰는 동사 rely, [B]는 signal을 꾸미는 형용사 essential.","c":null},"h":"86188f8ae6"}]},{"u":1,"id":"r03","no":3,"ko":"깊은 바다의 지략가","items":[{"n":1,"t":"tf","q":"Some fish moved only when the octopus led the way.","h":"1a7759f470","ko":"일부 물고기는 문어가 앞장설 때만 움직였다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Even more fascinating, some fish moved only when the octopus led the way.","더욱 흥미로운 점은, 문어가 길을 이끌 때만 일부 물고기들이 움직였다는 것이다."]],"w":"6번 문장에 some fish moved only when the octopus led the way가 있음. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Octopuses punched fish to make them leave the group.","h":"236f3c011a","ko":"문어는 물고기를 무리에서 쫓아내려고 쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The octopuses played an active role, sometimes punching fish to keep them focused and on task.","그 문어들은 적극적인 역할을 했으며, 때때로 물고기를 때려서 그들이 집중하고 임무에 전념하도록 했다."]],"w":"5번 문장은 물고기를 쳐서 집중하고 맡은 일을 하게 함(keep them focused and on task). 쫓아내려는 것이 아님.","c":"F"}},{"n":3,"t":"tf","q":"The fish help octopuses by driving out hidden prey from tight spaces.","h":"00d7ad22de","ko":"물고기는 좁은 틈에서 숨은 먹이를 쫓아내서 문어를 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"Octopuses help the fish by reaching into tight spaces to drive out hidden prey.","문어는 숨겨진 먹이를 몰아내려고 좁은 공간까지 몸을 뻗어 물고기를 돕는다."],[11,"In return, the fish help octopuses by using their sharp senses to find areas with plenty of food.","그 대가로, 물고기는 그들의 예리한 감각을 사용하여 풍부한 먹이가 있는 곳을 찾아내어 문어를 돕는다."]],"w":"좁은 틈에서 숨은 먹이를 쫓아내는 쪽은 문어(10번). 물고기는 예민한 감각으로 먹이 많은 곳을 찾아 줌(11번). 주체가 뒤바뀜.","c":"F"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Even more fascinating, some fish moved only when ...)","h":"09f7dcd817","ko":"더욱 흥미로운 것은, 일부 물고기가 ... 때만 움직였다는 것이다.","opts":["지루한","위험한","매혹적인","평범한"],"word":"fascinating","r":{"a":"3) 매혹적인","ev":"6번 문장","s":[[6,"Even more fascinating, some fish moved only when the octopus led the way.","더욱 흥미로운 점은, 문어가 길을 이끌 때만 일부 물고기들이 움직였다는 것이다."]],"w":"Even more은 더 놀랍다는 뜻으로 앞의 흥미로운 사실에 덧붙임. fascinating = 매혹적인, 흥미를 끄는.","c":3}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (The octopuses played an active role ...)","h":"2bdbc35d31","ko":"문어들은 적극적인 역할을 ...","opts":["(역할을) 맡았다","놀았다","연주했다","경기를 했다"],"word":"played","r":{"a":"1) (역할을) 맡았다","ev":"5번 문장","s":[[5,"The octopuses played an active role, sometimes punching fish to keep them focused and on task.","그 문어들은 적극적인 역할을 했으며, 때때로 물고기를 때려서 그들이 집중하고 임무에 전념하도록 했다."]],"w":"play a role은 '역할을 맡다'. play의 놀다, 연주하다 뜻은 문맥에 맞지 않음. played는 동사 play의 과거형.","c":1}},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nScientists are now curious to see if octopuses learn this behavior over time, and if they even have favorite hunting partners.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이제 과학자들은 문어가 시간이 지나면서 이러한 행동을 학습하는지, 그리고 그들이 심지어 선호하는 사냥 파트너가 있는지를 궁금해한다.","opts":["과학자들","물고기들","사냥 파트너들","문어들"],"r":{"a":"4) 문어들","ev":"13번 문장","s":[[13,"Scientists are now curious to see if octopuses learn this behavior over time, and if they even have favorite hunting partners.","이제 과학자들은 문어가 시간이 지나면서 이러한 행동을 학습하는지, 그리고 그들이 심지어 선호하는 사냥 파트너가 있는지를 궁금해한다."]],"w":"13번 문장에서 문어가 이 행동을 시간이 지나며 학습하는지, 그리고 (문어들이) 선호하는 사냥 파트너가 있는지 궁금해한다는 흐름. they는 앞의 octopuses.","c":4,"k":"they = 문어들"},"pron":"they","h":"def50dff86"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These behaviors suggest that the octopus may be the group's main decision-maker.\"","h":"66856117f8","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 행동들은 문어가 그 무리의 주요 의사 결정자일 수 있다는 것을 시사한다.","opts":["물고기가 무리의 결정을 내리는 중심일 수 있다.","문어가 무리의 주요 결정을 내리는 역할일 수도 있다.","문어는 물고기에게 의존해 사냥하고 있다.","문어는 혼자 사냥한다는 것이 확인되었다."],"r":{"a":"2) 문어가 무리의 주요 결정을 내리는 역할일 수도 있다.","ev":"5~7번 문장","s":[[5,"The octopuses played an active role, sometimes punching fish to keep them focused and on task.","그 문어들은 적극적인 역할을 했으며, 때때로 물고기를 때려서 그들이 집중하고 임무에 전념하도록 했다."],[6,"Even more fascinating, some fish moved only when the octopus led the way.","더욱 흥미로운 점은, 문어가 길을 이끌 때만 일부 물고기들이 움직였다는 것이다."],[7,"These behaviors suggest that the octopus may be the group’s main decision-maker.","이 행동들은 문어가 그 무리의 주요 의사 결정자일 수 있다는 것을 시사한다."]],"w":"5~6번에서 문어가 물고기를 치고 앞장서는 행동을 보임. 이를 근거로 문어가 의사 결정자일 수 있다고 시사.","c":2}},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["한 연구는 문어가 사람들이 예전에 생각했던 것보다 더 풍부한 사회적 삶을 가질 수도 있다고 보여 준다.","물고기가 무리를 이끌고 문어가 그들을 따라간다.","과학자들은 문어가 물고기에게서 사냥을 배운다는 것을 이미 증명했다.","문어는 항상 혼자 사냥하며 물고기는 결코 함께하지 않는다."],"opts":["A study shows that octopuses may have richer social lives than people once thought.","Fish lead the group, and octopuses follow them.","Scientists have already proved that octopuses learn hunting from fish.","Octopuses always hunt alone, and fish never join them."],"r":{"a":"1) A study shows that octopuses may have richer social lives than people once thought. (한 연구는 문어가 사람들이 예전에 생각했던 것보다 더 풍부한 사회적 삶을 가질 수도 있다고 보여 준다.)","ev":"3번 문장","s":[[3,"A study on the species Octopus cyanea shows that these creatures may have far richer social lives than they were previously thought to have.","Octopus cyanea 종에 대한 연구는 이 생물들이 과거에 생각되었던 것보다 훨씬 더 풍부한 사회적인 삶을 살 수도 있다는 것을 보여준다."]],"w":"3번 문장 far richer social lives than they were previously thought to have에 해당. ②는 6~7번(문어가 이끎), ③은 13번(아직 궁금해하는 단계), ④는 2번(물고기와 팀을 이룸)과 어긋남.","c":1},"h":"b895263702"},{"n":9,"t":"sum","q":"Octopuses are known as (A) hunters, but a study suggests that some of them (B) with fish.","ko":"문어는 (A) 사냥꾼으로 알려져 있지만, 한 연구는 일부 문어가 물고기와 (B)고 시사한다.","oko":["(A) 독립적인 / (B) 협력한다","(A) 사회적인 / (B) 경쟁한다","(A) 독립적인 / (B) 경쟁한다","(A) 위험한 / (B) 논쟁한다","(A) 사회적인 / (B) 협력한다"],"opts":["(A) independent / (B) collaborate","(A) social / (B) compete","(A) independent / (B) compete","(A) dangerous / (B) argue","(A) social / (B) collaborate"],"r":{"a":"1) (A) independent / (B) collaborate ((A) 독립적인 / (B) 협력한다)","ev":"1번, 12번 문장","s":[[1,"Octopuses are often known as independent hunters, using camouflage on the seafloor.","문어는 해저에서 위장술을 사용하는 독립적인 사냥꾼으로 종종 알려져 있다."],[12,"The study suggests that these octopuses may use social intelligence to collaborate, a trait once thought to be unique to highly social animals like primates.","그 연구는 이 문어들이 협력하기 위해 사회적 지능을 사용할 수도 있음을 시사하는데, 이는 한때 영장류와 같은 고도로 사회적인 동물들에게만 고유하다고 여겨졌던 특성이다."]],"w":"1번 문장에서 문어는 독립적인 사냥꾼(independent hunters)으로 알려져 있고, 12번 문장에서 문어가 협력하기 위해(to collaborate) 사회적 지능을 쓸 수 있다고 함.","c":1},"h":"62f7f1c386"} 직이지 않는","wear":"입다, 착용하다","disturb":"방해하다"},"bank":["assure","roam","creative","motionless","wear","disturb"],"r":{"a":"[A] creative (창의적인), [B] assure (안심시키다)","ev":"2번 문장","s":[[2,"An Australian company, Honest Eggs, has found a creative way to assure you that their chickens are healthy and happy: a fitness tracker for chickens called FitChix.","호주의 한 기업인 Honest Eggs는 그들의 닭이 건강하고 행복하다고 당신을 안심시켜 줄 창의적인 방법을 찾아냈는데, 바로 FitChix라고 불리는 닭을 위한 건강 지표 추적기이다."]],"w":"2번 문장 \"has found a creative way to assure you that ...\"에서 가져옴. [A]는 way를 꾸미는 형용사, [B]는 to 뒤 동사 + you that.","c":null},"h":"c978160716"}]},{"u":2,"id":"r06","no":6,"ko":"똑똑, 일어나세요!","items":[{"n":1,"t":"tf","q":"Knocker-uppers started working after the sun went down.","h":"4ed2e8014e","ko":"노커 어퍼는 해가 진 뒤에 일을 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"As the sun began to rise, knocker-uppers walked through the streets carrying long sticks, soft hammers, or pea shooters.","해가 뜨기 시작할 때, 노커 어퍼는 긴 막대, 부드러운 재질의 망치, 또는 완두콩 총을 든 채 거리를 걸었다."]],"w":"4번 문장 As the sun began to rise, 즉 해가 뜰 무렵(아침)에 걸어 다님. 방향(뜸/짐)을 뒤집은 진술.","c":"F"}},{"n":2,"t":"tf","q":"The fee for the service depended on the time and the distance to the client’s home.","h":"4dfc5f7e73","ko":"그 서비스의 요금은 시간과 고객 집까지의 거리에 따라 달랐다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"They received a small fee for the service, which varied depending on the time and the distance to the client’s home.","그들은 그 서비스에 대한 약간의 요금을 받았는데, 그것은 고객의 집까지의 시간과 거리에 따라 달라졌다."]],"w":"7번 문장 varied depending on the time and the distance to the client’s home. 일치.","c":"T"}},{"n":3,"t":"tf","q":"The last known knocker-upper retired in the 1970s.","h":"d69b7f1912","ko":"알려진 마지막 노커 어퍼는 1970년대에 은퇴했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"(B), in some parts of Britain, the role of the knocker-upper continued until the 1970s.","그럼에도 불구하고, 영국의 일부 지역에서는 1970년대까지 노커 어퍼의 역할이 계속되었다."],[10,"The last known knocker-upper was an 84-year-old man who retired in that decade.","마지막으로
