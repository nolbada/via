s3-06-3","no":3,"ko":"어라...? 나 어째서 눈물이...","items":[{"n":1,"t":"tf","q":"UNESCO added fado to the Intangible Cultural Heritage list in 2011.","ko":"유네스코는 2011년에 파두를 무형 문화유산 목록에 추가했다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"In recognition of its importance, UNESCO added fado to the Intangible Cultural Heritage list in 2011.","그것의 중요성을 인정하여, 유네스코는 2011년에 파두를 무형 문화유산 목록에 추가했다."]],"w":"12번에서 UNESCO added fado to the Intangible Cultural Heritage list in 2011이라고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"fd0c096372"},{"n":2,"t":"tf","q":"Fado began in Lisbon, where sailors sang about the joy of leaving home.","ko":"파두는 리스본에서 시작되었는데, 그곳에서 선원들은 집을 떠나는 기쁨을 노래했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It began in the port city of Lisbon, where sailors embarking on unpredictable journeys would sing about the sorrow of leaving home, the uncertainty of return, and the hope of seeing loved ones again.","그것은 리스본이라는 항구 도시에서 시작되었는데, 그곳에서 예측할 수 없는 여정에 나서는 선원들이 집을 떠나는 슬픔, 귀환의 불확실성, 그리고 사랑하는 사람들을 다시 보는 희망에 대해 노래하곤 했다."]],"w":"6번에서 선원들이 노래한 것은 집을 떠나는 슬픔(sorrow of leaving home)이에요. 기쁨이 아니라서 본문과 달라요.","c":"F"},"h":"fde524d2b9"},{"n":3,"t":"tf","q":"Modern fado performances use only a classic guitar and a Portuguese guitar.","ko":"현대의 파두 공연은 전통 기타와 포르투갈식 기타만 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Over time, fado has evolved, with modern performances often incorporating instruments like the bass guitar, saxophone, and piano to increase the complexity of the music.","시간이 흐르면서, 파두는 진화해 왔으며, 현대의 공연들은 음악의 복잡성을 증가시키기 위해 베이스 기타, 색소폰, 그리고 피아노와 같은 악기들을 종종 포함한다."]],"w":"9번에서 현대 공연은 베이스 기타, 색소폰, 피아노 같은 악기를 종종 포함한다고 해요. 두 기타만 쓴다는 말은 본문과 달라요.","c":"F"},"h":"9782c4db00"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It fills you with a sense of melancholy and even sadness.)","ko":"그것은 당신을 우울감과 심지어 슬픔의 감각으로 가득 채운다.","opts":["즐거움","우울감","분노","놀라움"],"word":"melancholy","r":{"a":"2) 우울감","ev":"3번 문장","s":[[3,"It fills you with a sense of melancholy and even sadness.","그것은 당신을 우울감과 심지어 슬픔의 감각으로 가득 채운다."]],"w":"melancholy and even sadness에서 even(심지어) 뒤에 sadness가 오므로 melancholy도 슬픈 계열의 감정이에요. melancholy = 우울감이에요.","c":2},"h":"8896c79e46"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…understood through the experiences of contemporary life, such as the loneliness…)","ko":"…현대 삶의 경험들을 통해 이제 이해된다…","opts":["고대의","지역의","현대의","비밀의"],"word":"contemporary","r":{"a":"3) 현대의","ev":"10번 문장","s":[[10,"The themes of hardship and hope, though still central, are now understood through the experiences of contemporary life, such as the loneliness that many residents of modern cities feel.","고난과 희망이라는 주제들은, 비록 여전히 중심적이지만, 현대 도시의 많은 거주자가 느끼는 외로움과 같은, 현대 삶의 경험들을 통해 이제 이해된다."]],"w":"contemporary life의 예로 현대 도시 거주자가 느끼는 외로움이 나와요. 지금 우리 시대의 삶이므로 contemporary = 현대의예요.","c":3},"h":"e4c77b04f0"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nWhile one plays the classic guitar, the other plays the Portuguese guitar, a unique pear-shaped instrument with twelve strings arranged in six pairs, which has six more strings than a conventional guitar.","ko":"밑줄 친 which가 가리키는 것은?","sko":"한 명이 전통적인 기타를 연주하는 반면, 다른 한 명은 포르투갈식 기타를 연주하는데, 그것은 여섯 쌍으로 배열된 열두 개의 현을 가진 독특한 배 모양의 악기이며, 이는 전통적인 기타보다 여섯 개의 현이 더 많은 것이다.","opts":["일반 기타","여섯 쌍의 현","열두 개의 현","포르투갈식 기타"],"r":{"a":"4) 포르투갈식 기타","ev":"8번 문장","s":[[8,"While one plays the classic guitar, the other plays the Portuguese guitar, a unique pear-shaped instrument with twelve strings arranged in six pairs, which has six more strings than a conventional guitar.","한 명이 전통적인 기타를 연주하는 반면, 다른 한 명은 포르투갈식 기타를 연주하는데, 그것은 여섯 쌍으로 배열된 열두 개의 현을 가진 독특한 배 모양의 악기이며, 이는 전통적인 기타보다 여섯 개의 현이 더 많은 것이다."]],"w":"which has six more strings than a conventional guitar는 일반 기타보다 현이 여섯 개 더 많다는 뜻이에요. 비교 대상이 일반 기타이므로 which는 포르투갈식 기타예요.","c":4},"h":"5e85e7db9c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Though you can’t understand the words, you notice the emotional depth of the performance.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 당신이 그 가사를 이해할 수는 없더라도, 당신은 그 공연의 감정적인 깊이를 인지하게 된다.","opts":["가사를 이해하지 못해도 공연이 담은 감정의 깊이는 느낄 수 있다.","가사를 이해해야만 공연의 감정을 느낄 수 있다.","가사는 이해하지만 공연의 감정은 느끼지 못한다.","가사를 이해하면 공연이 더 짧게 느껴진다."],"r":{"a":"1) 가사를 이해하지 못해도 공연이 담은 감정의 깊이는 느낄 수 있다.","ev":"2번 문장","s":[[2,"Though you can’t understand the words, you notice the emotional depth of the performance.","비록 당신이 그 가사를 이해할 수는 없더라도, 당신은 그 공연의 감정적인 깊이를 인지하게 된다."]],"w":"Though는 '비록 ~이지만'이에요. 가사(the words)를 이해하지 못해도 감정적인 깊이는 느낀다는 대비 구조예요.","c":1},"h":"55069cf429"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파두는 20세기 초에 처음 시작되었다.","파두는 처음부터 현대 도시인의 외로움만 노래했다.","파두는 거의 2세기 동안 포르투갈 정체성과 문화의 상징이었다.","유네스코는 2011년에 파두를 처음 만들었다."],"opts":["Fado began in the early 20th century.","Fado has sung only about the loneliness of modern city dwellers from the beginning.","Fado has been a symbol of Portuguese identity and culture for nearly two centuries.","UNESCO created fado in 2011."],"r":{"a":"3) Fado has been a symbol of Portuguese identity and culture for nearly two centuries.","ev":"11번 문장","s":[[11,"For nearly two centuries, fado has been a symbol of Portuguese identity and culture.","거의 2세기 동안, 파두는 포르투갈의 정체성과 문화의 상징이어 왔다."]],"w":"11번에서 파두는 거의 2세기 동안 포르투갈 정체성과 문화의 상징이었어요. 5번에서 시작은 1830년대, 10번에서 현대의 외로움은 이제 더해진 이해 방식, 12번에서 유네스코는 목록에 추가했을 뿐이에요.","c":3},"h":"02915da393"},{"n":9,"t":"sum","q":"Fado, whose name comes from the word for (A), is traditionally performed by a solo singer with (B) guitarists.","ko":"파두는 그 이름이 (A)을 뜻하는 단어에서 왔고, 전통적으로 독창가수가 (B)의 기타 연주자와 함께 공연한다.","oko":["(A) 사랑 / (B) 두 명","(A) 운명 / (B) 세 명","(A) 희망 / (B) 네 명","(A) 운명 / (B) 한 명","(A) 운명 / (B) 두 명"],"opts":["(A) love / (B) two","(A) fate / (B) three","(A) hope / (B) four","(A) fate / (B) one","(A) fate / (B) two"],"r":{"a":"5) (A) fate / (B) two","ev":"5번, 7번 문장","s":[[5,"Originating in the 1830s, fado takes its name from the Portuguese word for fate.","1830년대에 기원한 파두는 운명을 뜻하는 포르투갈 단어에서 그것의 이름을 따온다."],[7,"A traditional fado performance features a solo singer accompanied by two guitarists.","전통적인 파두 공연은 두 명의 기타 연주자에 의해 반주되는 독창가수를 특징으로 한다."]],"w":"5번에서 파두는 운명(fate)을 뜻하는 포르투갈 단어에서 이름을 따왔어요. 7번에서 독창가수는 두 명(two)의 기타 연주자가 반주해요. 그래서 (A) fate, (B) two예요.","c":5},"h":"483ee25842"},{"n":10,"t":"fill","q":"Sitting by a [A] in Portugal, you hear someone singing [B].","ko":"포르투갈의 한 [A] 옆에 앉아 있으면, 당신은 누군가가 [B] 노래하는 것을 듣는다.","bank":["port","passionately","sorrow","genre","journey","return"],"bko":{"port":"항구","passionately":"열정적으로","sorrow":"슬픔","genre":"장르","journey":"여정","return":"귀환"},"r":{"a":"[A] port, [B] passionately","ev":"1번 문장","s":[[1,"Sitting by a port in Portugal, you hear someone singing passionately.","포르투갈의 한 항구 옆에 앉아 있으면, 당신은 누군가가 열정적으로 노래하는 것을 듣는다."]],"w":"1번 Sitting by a port in Portugal, you hear someone singing passionately에서 가져왔어요. 앉아 있는 장소는 항구(port)이고, singing을 꾸미는 말은 부사 passionately예요. sorrow·genre·journey·return은 두 자리에 뜻이 맞지 않아요.","c":null},"h":"6afbd94be1"}]},{"u":6,"id":"ms3-06-4","no":4,"ko":"Dress Well, Feel Well","items":[{"n":1,"t":"tf","q":"Dawnn Karen realized the importance of dressing for oneself when the pandemic reduced social events.","ko":"Dawnn Karen은 팬데믹으로 사교 행사가 줄어들었을 때 자신을 위해 옷을 입는 것의 중요성을 인식했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"When the pandemic led to the disappearance of social events and forced many to work from home, Karen recognized the importance of dressing for oneself —wearing clothes that make you feel good.","팬데믹이 사교 행사의 실종으로 이어지고 많은 사람들이 재택근무를 하도록 강요했을 때, Karen은 자신을 위해 옷을 입는 것, 즉 당신을 기분 좋게 만드는 옷을 입는 것의 중요성을 인식했다."]],"w":"7번에서 팬데믹이 사교 행사의 실종으로 이어지고 많은 사람이 재택근무를 하게 되었을 때 Karen이 자신을 위해 옷을 입는 것의 중요성을 인식했다고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"8fd196d577"},{"n":2,"t":"tf","q":"People usually choose their clothes only for themselves.","ko":"사람들은 보통 오직 자신을 위해서만 옷을 고른다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"People typically dress for specific purposes, such as to fit in with friends or to follow a workplace dress code.","사람들은 친구들과 어울리기 위해서나 직장 복장 규정을 따르는 것과 같이, 일반적으로 특정한 목적을 위해 옷을 입는다."]],"w":"6번에서 사람들은 보통 친구들과 어울리거나 직장 복장 규정을 따르는 것 같은 특정한 목적을 위해 옷을 입는다고 해요. 자신을 위해서만이라는 말은 반대예요.","c":"F"},"h":"3cbf5e647d"},{"n":3,"t":"tf","q":"According to color therapy, blue is connected with excitement.","ko":"색채 치료에 따르면 파란색은 흥분과 연결된다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Karen’s idea draws on the established principles of color therapy, which suggest that certain colors can evoke specific emotions, such as red sparking excitement or blue being associated with calmness.","Karen의 아이디어는 빨간색이 흥분을 불러일으키거나 파란색이 차분함과 연관되는 것과 같이, 특정 색깔이 특정한 감정을 불러일으킬 수 있다고 제시하는 색채 치료의 확립된 원리에 기반한다."]],"w":"8번에서 흥분을 불러일으키는 색은 빨간색(red)이고, 파란색(blue)은 차분함(calmness)과 연관돼요. 본문과 달라요.","c":"F"},"h":"2deaae17a6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…because they trigger the release of dopamine…)","ko":"…그것들이 도파민의 방출을 촉발하기 때문에…","opts":["막다","촉발하다","잊다","식히다"],"word":"trigger","r":{"a":"2) 촉발하다","ev":"2번 문장","s":[[2,"All of these activities can help boost your mood because they trigger the release of dopamine, a chemical linked to happiness.","이 모든 활동들은 그것들이 행복과 연관된 화학 물질인 도파민의 방출을 촉발하기 때문에 당신의 기분을 북돋우는 것을 도울 수 있다."]],"w":"달리기, 전화, 개와 놀기가 기분을 북돋는 이유가 도파민 방출이에요. 활동이 방출을 일으키는 것이므로 trigger = 촉발하다예요.","c":2},"h":"0867451495"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…can arouse positive feelings.)","ko":"…긍정적인 감정을 불러일으킬 수 있다.","opts":["불러일으키다","숨기다","없애다","측정하다"],"word":"arouse","r":{"a":"1) 불러일으키다","ev":"11번 문장","s":[[11,"Even the texture of clothing, such as the softness of a well-worn hoodie or the sleekness of a silk dress, can arouse positive feelings.","심지어 오래 입은 후드티의 부드러움이나 실크 드레스의 매끄러움과 같은 옷의 질감조차도 긍정적인 감정을 불러일으킬 수 있다."]],"w":"부드러운 후드티와 매끄러운 실크 드레스의 질감이 긍정적인 감정을 '일으킨다'는 흐름이에요. arouse = 불러일으키다예요.","c":1},"h":"590686df6c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe concept was introduced by fashion psychologist Dawnn Karen, who developed it during the pandemic.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그 개념은 패션 심리학자 Dawnn Karen에 의해 도입되었는데, 그는 팬데믹 동안 그것을 개발했다.","opts":["팬데믹","패션 심리학자","도파민 드레싱이라는 개념","직장 복장 규정"],"r":{"a":"3) 도파민 드레싱이라는 개념","ev":"5번 문장","s":[[5,"The concept was introduced by fashion psychologist Dawnn Karen, who developed it during the pandemic.","그 개념은 패션 심리학자 Dawnn Karen에 의해 도입되었는데, 그는 팬데믹 동안 그것을 개발했다."]],"w":"developed의 목적어 it은 문장 맨 앞 The concept(그 개념)를 가리켜요. 4번에서 이름이 붙은 도파민 드레싱이에요. Karen은 사람이므로 it이 될 수 없어요.","c":3},"h":"7fcd7eb42a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A cozy sweater gifted by a loved one may bring warmth and comfort, while a pair of bold shoes might make someone feel confident.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사랑하는 사람에 의해 선물 받은 아늑한 스웨터는 따뜻함과 편안함을 가져다줄지도 모르는 반면, 한 켤레의 대담한 신발은 누군가가 자신감을 느끼게 만들지도 모른다.","opts":["아늑한 스웨터는 자신감을, 대담한 신발은 따뜻함과 편안함을 준다.","선물 받은 스웨터는 불편하지만 신발은 편안하다.","스웨터와 신발은 사람의 감정에 아무 영향도 주지 않는다.","선물 받은 아늑한 스웨터는 따뜻함과 편안함을, 대담한 신발은 자신감을 줄 수 있다."],"r":{"a":"4) 선물 받은 아늑한 스웨터는 따뜻함과 편안함을, 대담한 신발은 자신감을 줄 수 있다.","ev":"10번 문장","s":[[10,"A cozy sweater gifted by a loved one may bring warmth and comfort, while a pair of bold shoes might make someone feel confident.","사랑하는 사람에 의해 선물 받은 아늑한 스웨터는 따뜻함과 편안함을 가져다줄지도 모르는 반면, 한 켤레의 대담한 신발은 누군가가 자신감을 느끼게 만들지도 모른다."]],"w":"while은 두 가지를 대비해 나란히 놓아요. 스웨터는 따뜻함과 편안함, 신발은 자신감이에요. 둘이 서로 바뀐 선택지에 주의해요.","c":4},"h":"358065ea81"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["도파민은 좋아하는 옷을 입을 때도 방출된다.","도파민은 비싼 옷을 입을 때만 방출된다.","도파민은 옷과 상관없이 운동할 때만 방출된다.","도파민은 색깔 때문에만 방출된다."],"opts":["Dopamine is also released when people wear their favorite outfits.","Dopamine is released only when people wear expensive clothes.","Dopamine is released only when people exercise, regardless of clothes.","Dopamine is released only because of colors."],"r":{"a":"1) Dopamine is also released when people wear their favorite outfits.","ev":"3번 문장","s":[[3,"Interestingly, dopamine is also released when you wear your favorite outfits.","흥미롭게도, 도파민은 당신이 당신의 가장 좋아하는 옷을 입을 때도 또한 방출된다."]],"w":"3번에서 도파민은 가장 좋아하는 옷을 입을 때도(also) 방출된다고 해요. 가격, 운동만, 색깔만이라는 말은 본문에 없고, 9번도 색깔이 전부가 아니라고 해요.","c":1},"h":"18f92aa9a5"},{"n":9,"t":"sum","q":"Dopamine dressing recognizes that people do not all share the same (A) with colors, so it stresses the (B) connection with certain outfits.","ko":"도파민 드레싱은 사람들이 색깔에 대해 같은 (A)을 모두 가지고 있지는 않다는 것을 인정하고, 그래서 특정 옷들과의 (B) 연결을 강조한다.","oko":["(A) 취미 / (B) 개인적인","(A) 연상 / (B) 일반적인","(A) 습관 / (B) 문화적인","(A) 허락 / (B) 사회적인","(A) 연상 / (B) 개인적인"],"opts":["(A) hobbies / (B) personal","(A) associations / (B) general","(A) habits / (B) cultural","(A) permissions / (B) social","(A) associations / (B) personal"],"r":{"a":"5) (A) associations / (B) personal","ev":"9번 문장","s":[[9,"But dopamine dressing acknowledges that not everyone has conventional color associations; it emphasizes the personal connection a person has with certain outfits.","그러나 도파민 드레싱은 모든 사람이 전통적인 색깔 연상을 가지고 있는 것은 아니라는 점을 인정하며, 한 사람이 특정 옷들과 맺고 있는 개인적인 연결을 강조한다."]],"w":"9번에서 모든 사람이 전통적인 색깔 연상(color associations)을 가지고 있는 것은 아니라고 하고, 특정 옷들과의 개인적인(personal) 연결을 강조해요. 그래서 (A) associations, (B) personal이에요.","c":5},"h":"666284cdd8"},{"n":10,"t":"fill","q":"When you’re feeling [A], do you go for a [B], call a friend, or play with your dog?","ko":"당신이 기분이 [A] 때, 당신은 [B]을(를) 하러 가거나, 친구에게 전화하거나, 또는 당신의 개와 노는가?","bank":["down","run","boost","mood","dopamine","outfit"],"bko":{"down":"우울한","run":"달리기","boost":"북돋우다","mood":"기분","dopamine":"도파민","outfit":"옷"},"r":{"a":"[A] down, [B] run","ev":"1번 문장","s":[[1,"When you’re feeling down, do you go for a run, call a friend, or play with your dog?","당신이 기분이 우울할 때, 당신은 달리기를 하러 가거나, 친구에게 전화하거나, 또는 당신의 개와 노는가?"]],"w":"1번 When you're feeling down, do you go for a run, call a friend, or play with your dog?에서 가져왔어요. feel down은 '기분이 우울하다'이고, go for a run은 '달리기를 하러 가다'예요. boost·mood·dopamine·outfit은 두 자리에 뜻과 문법이 맞지 않아요.","c":null},"h":"f258c66588"}]},{"u":7,"id":"ms3-07-1","no":1,"ko":"초고층 건물의 저주","items":[{"n":1,"t":"tf","q":"Andrew Lawrence believes that the construction of skyscrapers can be a sign of an economic decline.","ko":"앤드류 로렌스는 초고층 건물의 건설이 경제적 쇠퇴의 신호가 될 수 있다고 믿는다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"Can the construction of skyscrapers serve as an indicator of an economic decline?","초고층 건물의 건설이 경제적 쇠퇴의 지표 역할을 할 수 있는가?"],[2,"That’s what economist Andrew Lawrence believes.","그것이 경제학자 앤드류 로렌스가 믿는 것이다."]],"w":"1번은 초고층 건물 건설이 경제적 쇠퇴의 지표 역할을 할 수 있느냐고 묻고, 2번에서 That's what economist Andrew Lawrence believes(그것이 로렌스가 믿는 것이다)라고 해요. 로렌스가 그렇게 믿는다는 내용과 일치해요.","c":"T"},"h":"e5ac4985db"},{"n":2,"t":"tf","q":"Lawrence compared the timing of skyscraper construction plans with the heights of the buildings.","ko":"로렌스는 초고층 건물 건설 계획의 시기를 그 건물들의 높이와 비교했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Going back to 1899, he compared the timing of skyscraper construction plans with major economic cycles, identifying a recurring pattern.","1899년으로 거슬러 올라가, 그는 초고층 건물의 건설 계획의 시기와 주요 경제 주기를 비교했고, 반복되는 패턴을 확인했다."]],"w":"4번에서 건설 계획의 시기를 비교한 대상은 건물의 높이가 아니라 주요 경제 주기(major economic cycles)예요.","c":"F"},"h":"bfd482a053"},{"n":3,"t":"tf","q":"The Chrysler Building was started after the 1929 stock market crash.","ko":"크라이슬러 빌딩은 1929년 주식 시장 붕괴 이후에 착공되었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The Chrysler Building, for instance, was initiated in 1928, just before the 1929 stock market crash and the onset of the Great Depression.","크라이슬러 빌딩은, 예를 들어, 1929년 주식 시장 붕괴와 대공황의 시작 직전인 1928년에 착공되었다."]],"w":"5번에서 크라이슬러 빌딩은 1929년 주식 시장 붕괴와 대공황의 시작 '직전'인 1928년에 착공되었다고 해요. 붕괴 이후가 아니라 이전이에요.","c":"F"},"h":"6955e23c23"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (the Petronas Towers were planned in the early 1990s ahead of the Asian financial crisis)","ko":"페트로나스 타워는 아시아 금융 위기에 앞서 1990년대 초에 계획되었다.","opts":["~이 끝난 뒤에","~와 동시에","~보다 앞서","~ 대신에"],"word":"ahead of","r":{"a":"3) ~보다 앞서","ev":"6번 문장","s":[[6,"Similarly, the Petronas Towers were planned in the early 1990s ahead of the Asian financial crisis, while the Burj Khalifa in Dubai began construction several years before the 2008 global collapse.","비슷하게, 페트로나스 타워는 아시아 금융 위기 이전인 1990년대 초에 계획되었고, 두바이의 부르즈 칼리파는 2008년 글로벌 금융 위기 수년 전에 건설이 시작되었다."]],"w":"페트로나스 타워는 1990년대 초에 계획되었고 아시아 금융 위기는 그 뒤에 왔어요. 그래서 ahead of는 '~보다 앞서'예요. 5번의 just before(바로 직전)와 같은 흐름이에요.","c":3},"h":"7fbd33ac90"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The underlying cause of the Skyscraper Curse can be traced to economic cycles driven by monetary policy.)","ko":"마천루의 저주의 근본적인 원인은 통화 정책에 의해 주도되는 경제 주기로 거슬러 올라갈 수 있다.","opts":["눈에 띄는","근본적인","일시적인","우연한"],"word":"underlying","r":{"a":"2) 근본적인","ev":"7번 문장","s":[[7,"The underlying cause of the Skyscraper Curse can be traced to economic cycles driven by monetary policy.","마천루의 저주의 근본적인 원인은 통화 정책에 의해 주도되는 경제 주기로 거슬러 올라갈 수 있다."]],"w":"7번은 마천루의 저주가 왜 생기는지 '밑바탕의 원인'을 밝히는 문장이에요. 그 원인이 경제 주기이므로 underlying은 '근본적인'이에요.","c":2},"h":"f7a098ef62"},{"n":6,"t":"ref","q":"What does the underlined \"these massive structures\" refer to?\nHowever, when the economic boom inevitably slows down and interest rates rise, the economy enters a downturn as these massive structures are completed.","ko":"밑줄 친 these massive structures가 가리키는 것은?","sko":"하지만, 경제 호황이 불가피하게 둔화되고 이자율이 상승할 때, 이러한 거대한 구조물들이 완공되면서 경제는 침체기에 접어든다.","opts":["중앙 은행들","경제 주기들","금융 위기들","초고층 건물들"],"r":{"a":"4) 초고층 건물들","ev":"8~9번 문장","s":[[8,"When central banks lower interest rates and increase the money supply, businesses and investors are encouraged to take on more debt and invest in large-scale projects, including skyscrapers.","중앙 은행이 이자율을 낮추고 통화 공급을 늘릴 때, 기업들과 투자자들은 더 많은 부채를 떠안고 초고층 건물을 포함한 대규모 프로젝트에 투자하도록 장려된다."],[9,"However, when the economic boom inevitably slows down and interest rates rise, the economy enters a downturn as these massive structures are completed.","하지만, 경제 호황이 불가피하게 둔화되고 이자율이 상승할 때, 이러한 거대한 구조물들이 완공되면서 경제는 침체기에 접어든다."]],"w":"9번의 these massive structures는 8번에서 투자하는 대규모 프로젝트, 즉 skyscrapers(초고층 건물들)를 가리켜요. 이 건물들이 완공될 즈음 경제가 침체로 접어든다는 흐름이에요.","c":4},"h":"1283b432c4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When central banks lower interest rates and increase the money supply, businesses and investors are encouraged to take on more debt and invest in large-scale projects, including skyscrapers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"중앙 은행이 이자율을 낮추고 통화 공급을 늘릴 때, 기업들과 투자자들은 더 많은 부채를 떠안고 초고층 건물을 포함한 대규모 프로젝트에 투자하도록 장려된다.","opts":["중앙 은행이 이자율을 낮추고 통화 공급을 늘리면, 기업과 투자자는 빚을 더 내서 초고층 건물 같은 대규모 사업에 투자하게 된다.","중앙 은행이 이자율을 높이고 통화 공급을 줄이면, 기업들은 초고층 건물 건설을 포기한다.","기업과 투자자들이 부채를 줄이면, 중앙 은행은 이자율을 낮추고 초고층 건물을 짓는다.","중앙 은행이 초고층 건물 건설을 위해 기업들에게 직접 돈을 빌려준다."],"r":{"a":"1) 중앙 은행이 이자율을 낮추고 통화 공급을 늘리면, 기업과 투자자는 빚을 더 내서 초고층 건물 같은 대규모 사업에 투자하게 된다.","ev":"8번 문장","s":[[8,"When central banks lower interest rates and increase the money supply, businesses and investors are encouraged to take on more debt and invest in large-scale projects, including skyscrapers.","중앙 은행이 이자율을 낮추고 통화 공급을 늘릴 때, 기업들과 투자자들은 더 많은 부채를 떠안고 초고층 건물을 포함한 대규모 프로젝트에 투자하도록 장려된다."]],"w":"lower는 낮추다, increase는 늘리다예요. 이자율이 낮고 돈이 많이 풀리면 take on more debt(빚을 더 떠안고) invest in large-scale projects(대규모 프로젝트에 투자)하도록 장려돼요. 이자율을 높인다는 선지와, 기업이 빚을 줄인다는 선지는 방향이 반대예요.","c":1},"h":"84120d220e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["초고층 건물은 대개 금융 위기 직후에 계획된다.","로렌스는 낮은 이자율이 초고층 건물 건설과 아무 관련이 없다고 말한다.","로렌스는 초고층 건물 건설과 경제 쇠퇴의 연결을 마천루의 저주라고 부른다.","로렌스의 연구는 1990년대 초 페트로나스 타워에서 시작되었다."],"opts":["Skyscrapers are usually planned right after a financial crisis.","Lawrence says low interest rates have nothing to do with skyscraper building.","Lawrence calls the link between skyscraper building and economic decline the Skyscraper Curse.","Lawrence's study began in the early 1990s with the Petronas Towers."],"r":{"a":"3) Lawrence calls the link between skyscraper building and economic decline the Skyscraper Curse.","ev":"1~3번 문장","s":[[1,"Can the construction of skyscrapers serve as an indicator of an economic decline?","초고층 건물의 건설이 경제적 쇠퇴의 지표 역할을 할 수 있는가?"],[2,"That’s what economist Andrew Lawrence believes.","그것이 경제학자 앤드류 로렌스가 믿는 것이다."],[3,"He calls it the Skyscraper Curse.","그는 그것을 마천루의 저주라고 부른다."]],"w":"3번에서 He calls it the Skyscraper Curse라고 해요. it은 초고층 건물 건설이 경제 쇠퇴의 지표가 될 수 있다는 생각이에요(1~2번). 초고층 건물은 금융 위기 직후가 아니라 위기 이전에 계획되었고(5~6번), 이자율을 낮추면 대규모 프로젝트 투자가 늘어난다고 했어요(8번). 로렌스의 연구는 1899년으로 거슬러 올라가요(4번).","c":3},"h":"ea1d9cabdc"},{"n":9,"t":"sum","q":"The Burj Khalifa in (A) began construction several years before the 2008 global (B).","ko":"(A)에 있는 부르즈 칼리파는 2008년 글로벌 (B) 수년 전에 건설이 시작되었다.","oko":["(A) 도쿄 / (B) 붕괴","(A) 두바이 / (B) 회복","(A) 두바이 / (B) 붕괴","(A) 파리 / (B) 회복","(A) 도쿄 / (B) 회복"],"opts":["(A) Tokyo / (B) collapse","(A) Dubai / (B) recovery","(A) Dubai / (B) collapse","(A) Paris / (B) recovery","(A) Tokyo / (B) recovery"],"r":{"a":"3) (A) Dubai / (B) collapse ((A) 두바이 / (B) 붕괴)","ev":"6번 문장","s":[[6,"Similarly, the Petronas Towers were planned in the early 1990s ahead of the Asian financial crisis, while the Burj Khalifa in Dubai began construction several years before the 2008 global collapse.","비슷하게, 페트로나스 타워는 아시아 금융 위기 이전인 1990년대 초에 계획되었고, 두바이의 부르즈 칼리파는 2008년 글로벌 금융 위기 수년 전에 건설이 시작되었다."]],"c":3,"w":"6번에서 the Burj Khalifa in Dubai began construction several years before the 2008 global collapse라고 했어요. 그래서 (A) Dubai, (B) collapse예요. Tokyo·Paris는 본문에 나오지 않고, recovery(회복)는 collapse(붕괴)와 반대예요."},"h":"23ef090411"},{"n":10,"t":"fill","q":"Can the construction of skyscrapers [A] as an [B] of an economic decline?","ko":"초고층 건물의 건설이 경제적 쇠퇴의 [B](으)로서 [A]할 수 있는가?","bank":["serve","indicator","compare","underlying","inevitably","monetary"],"bko":{"serve":"기능하다","indicator":"지표","compare":"비교하다","underlying":"근본적인","inevitably":"불가피하게","monetary":"통화의"},"r":{"a":"[A] serve (기능하다), [B] indicator (지표)","ev":"1번 문장","s":[[1,"Can the construction of skyscrapers serve as an indicator of an economic decline?","초고층 건물의 건설이 경제적 쇠퇴의 지표 역할을 할 수 있는가?"]],"c":null,"w":"1번 Can the construction of skyscrapers serve as an indicator of an economic decline?에서 가져왔어요. serve as는 '~로서 기능하다', indicator는 '지표'예요. an 뒤에는 모음으로 시작하는 말이 오므로 indicator가 맞고, compare·underlying·inevitably·monetary는 두 자리에 문법이나 뜻이 맞지 않아요."},"h":"5461434f45"}]},{"u":7,"id":"ms3-07-2","no":2,"ko":"잃은 게 아니야, 사실은...","items":[{"n":1,"t":"tf","q":"Mia felt stuck in unhealthy relationships.","ko":"Mia는 건강하지 않은 관계들에 갇혀 있다고 느꼈다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Mia sighed and replied, “I feel stuck in unhealthy relationships.","Mia는 한숨을 쉬며 “저는 건강하지 않은 관계들에 갇혀 있는 듯한 기분이 들어요."]],"w":"3번에서 Mia가 I feel stuck in unhealthy relationships(저는 건강하지 않은 관계들에 갇혀 있는 듯한 기분이 들어요)라고 말해요. 그대로 일치해요.","c":"T"},"h":"ea59326935"},{"n":2,"t":"tf","q":"According to the fisherman, a lobster stays strong and safe while it leaves its old shell.","ko":"어부에 따르면, 바닷가재는 오래된 껍데기를 벗는 동안 강하고 안전하게 지낸다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It becomes vulnerable for a while, but it can’t reach its full size unless it sheds the shell first.”","잠시 동안은 그것이 연약한 상태가 되지만, 만약 그것이 먼저 껍데기를 벗지 않는다면 완전한 크기에 도달할 수 없지.”"]],"w":"7번에서 바닷가재는 껍데기를 벗고 나면 잠시 동안 연약한(vulnerable) 상태가 된다고 해요. 강하고 안전하다는 말은 반대예요.","c":"F"},"h":"1ed21fa877"},{"n":3,"t":"tf","q":"The fisherman said that growth is easy because nothing has to be left behind.","ko":"어부는 아무것도 뒤에 남길 필요가 없으므로 성장이 쉽다고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"“Growth often means leaving something behind, even if it’s difficult.”","“성장은 보통 무언가를 뒤로 하고 떠나는 것을 의미한단다, 비록 그것이 어려울지라도 말이야.”"]],"w":"12번에서 어부는 성장이 보통 무언가를 뒤에 남기고 떠나는 것을 뜻하고, 그것이 어려울 수 있다(even if it’s difficult)고 말해요. 쉽다거나 남길 것이 없다는 말과 반대예요.","c":"F"},"h":"987075f147"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (an elderly fisherman observed Mia, a young woman, appearing profoundly disheartened)","ko":"한 늙은 어부는 젊은 여성인 Mia가 깊이 낙담한 것처럼 보이는 것을 목격했다.","opts":["들뜬","낙담한","편안한","자랑스러운"],"word":"disheartened","r":{"a":"2) 낙담한","ev":"1번 문장","s":[[1,"In a tranquil seaside village, an elderly fisherman observed Mia, a young woman, appearing profoundly disheartened.","평온한 해변 마을에서, 한 늙은 어부는 젊은 여성인 Mia가 깊이 낙담한 것처럼 보이는 것을 목격했다."]],"w":"1번에서 어부가 Mia를 보고, 2번에서 '무엇이 너를 괴롭히고 있니?'라고 물어요. 그래서 disheartened는 기운이 빠진 '낙담한'이에요. 들뜨거나 편안한 사람에게는 이렇게 묻지 않아요.","c":2},"h":"48ef935d75"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Mia gazed at the shell, contemplating.)","ko":"Mia는 곰곰이 생각하며 껍데기를 바라보았다.","opts":["크게 웃으며","화가 나서","곰곰이 생각하며","잠에 빠져서"],"word":"contemplating","r":{"a":"3) 곰곰이 생각하며","ev":"8번 문장","s":[[8,"Mia gazed at the shell, contemplating.","Mia는 곰곰이 생각하며 껍데기를 바라보았다."]],"w":"어부가 바닷가재 껍데기 이야기를 마친 뒤 Mia가 껍데기를 바라보는 장면이에요. 말을 되새기며 깊이 생각하는 모습이므로 contemplate는 '곰곰이 생각하다'예요.","c":3},"h":"6ab4922302"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\n“But that temporary discomfort creates space for something better to grow,” said the old man, picking up a larger shell and handing it to Mia.","ko":"밑줄 친 it이 가리키는 것은?","sko":"“하지만 그 일시적인 불편함이 더 나은 무언가가 자랄 수 있는 공간을 만들어 주지.”라고 노인은 더 큰 껍데기를 주워 들어 Mia에게 건네며 말했다.","opts":["일시적인 불편함","더 나은 무언가","어부의 낡은 배","더 큰 껍데기"],"r":{"a":"4) 더 큰 껍데기","ev":"11번 문장","s":[[11,"“But that temporary discomfort creates space for something better to grow,” said the old man, picking up a larger shell and handing it to Mia.","“하지만 그 일시적인 불편함이 더 나은 무언가가 자랄 수 있는 공간을 만들어 주지.”라고 노인은 더 큰 껍데기를 주워 들어 Mia에게 건네며 말했다."]],"w":"it은 handing(건네며)의 대상이에요. 바로 앞에서 어부가 picking up a larger shell(더 큰 껍데기를 주워 들고)이라고 했으므로, 건넨 것은 a larger shell이에요.","c":4},"h":"9f1323dc84"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"“It might feel uncomfortable at first, like being exposed without protection.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"“처음에는 마치 보호막 없이 노출된 것처럼 불편하게 느껴질 수도 있어.”","opts":["처음에는 보호막 없이 드러난 것처럼 불편하게 느껴질 수 있다.","처음에는 보호막이 생겨서 편안하게 느껴질 것이다.","처음에는 불편하지만 시간이 지나도 계속 불편할 것이다.","처음에는 아무 느낌이 없다가 나중에 불편해진다."],"r":{"a":"1) 처음에는 보호막 없이 드러난 것처럼 불편하게 느껴질 수 있다.","ev":"10번 문장","s":[[10,"“It might feel uncomfortable at first, like being exposed without protection.”","“처음에는 마치 보호막 없이 노출된 것처럼 불편하게 느껴질 수도 있어.”"]],"w":"at first는 '처음에는', exposed without protection은 '보호막 없이 노출된'이에요. 껍데기를 벗은 바닷가재처럼 잠시 불편하고 무방비한 느낌이라는 뜻이에요. 11번에서 그 불편함이 일시적이라고 이어져요.","c":1},"h":"cb68c0e30e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Mia는 어부에게 더 큰 껍데기를 건넸다.","어부는 비어 있는 바닷가재 껍데기를 주워 들었다.","Mia는 현재 관계들에 매우 만족한다고 말했다.","바닷가재는 오래된 껍데기에서 벗어난 뒤에도 작은 채로 남는다."],"opts":["Mia handed a larger shell to the fisherman.","The fisherman picked up an empty lobster shell.","Mia said she was very satisfied with her relationships.","A lobster stays small even after it breaks free from its old shell."],"r":{"a":"2) The fisherman picked up an empty lobster shell.","ev":"5번 문장","s":[[5,"The fisherman bent down and picked up an empty lobster shell.","그 어부는 몸을 구부려 비어 있는 바닷가재 껍데기를 주워 들었다."]],"w":"5번에서 어부가 몸을 구부려 비어 있는 바닷가재 껍데기를 주워 들어요. 더 큰 껍데기는 어부가 Mia에게 건넸고(11번), Mia는 건강하지 않은 관계에 갇혀 있다고 했으며(3번), 바닷가재는 껍데기를 벗어야 완전한 크기로 자라요(6~7번).","c":2},"h":"3b0f32bb4f"},{"n":9,"t":"sum","q":"A lobster has to (A) its old shell in order to grow. In the same way, people may need to (B) relationships that no longer help them.","ko":"바닷가재는 자라기 위해 오래된 껍데기를 (A)해야 한다. 마찬가지로 사람도 더 이상 도움이 되지 않는 관계를 (B)해야 할지도 모른다.","oko":["(A) 지키다 / (B) 놓아주다","(A) 벗어나다 / (B) 더 단단히 붙잡다","(A) 청소하다 / (B) 놓아주다","(A) 채우다 / (B) 무시하다","(A) 벗다 / (B) 놓아주다"],"opts":["(A) keep / (B) release","(A) leave / (B) strengthen","(A) clean / (B) release","(A) fill / (B) ignore","(A) shed / (B) release"],"r":{"a":"5) (A) shed / (B) release ((A) 벗다 / (B) 놓아주다)","ev":"6번, 7번, 9번 문장","s":[[6,"“When a lobster grows, it has to break free from its old shell.","“바닷가재가 자랄 때, 그것은 자신의 오래된 껍데기로부터 벗어나야 한단다."],[7,"It becomes vulnerable for a while, but it can’t reach its full size unless it sheds the shell first.”","잠시 동안은 그것이 연약한 상태가 되지만, 만약 그것이 먼저 껍데기를 벗지 않는다면 완전한 크기에 도달할 수 없지.”"],[9,"“Just like the lobster, you too may need to let go of relationships that no longer serve you,” the fisherman continued.","“바닷가재처럼, 너 또한 더 이상 너에게 도움이 되지 않는 관계들을 놓아줘야 할지도 몰라.”라며 그 어부는 말을 계속했다."]],"c":5,"w":"6번에서 바닷가재는 자랄 때 오래된 껍데기에서 벗어나야 하고, 7번에서 먼저 껍데기를 벗지(sheds) 않으면 완전한 크기에 도달할 수 없다고 해요. 9번에서 어부는 사람도 더 이상 도움이 되지 않는 관계를 놓아줘야(let go of) 할지도 모른다고 해요. 껍데기를 지키거나 채우는 것, 관계를 더 붙잡는 것은 모두 반대예요."},"h":"a843372928"},{"n":10,"t":"fill","q":"Mia’s unhealthy relationships [A] her emotional energy, and she was [B] about what to do next.","ko":"Mia의 건강하지 않은 관계들은 그녀의 감정적 에너지를 [A]하고, 그녀는 다음에 무엇을 해야 할지 [B] 상태였다.","bank":["exhaust","uncertain","proceed","shell","vulnerable","behind"],"bko":{"exhaust":"고갈시키다","uncertain":"확신하지 못하는","proceed":"나아가다","shell":"껍데기","vulnerable":"연약한","behind":"뒤에"},"r":{"a":"[A] exhaust, [B] uncertain","ev":"4번 문장","s":[[4,"Not only do they exhaust my emotional reserves but I am also entirely uncertain about how to proceed.”","그것들은 나의 감정적 여력을 고갈시킬 뿐만 아니라, 나는 어떻게 나아가야 할지에 대해서도 완전히 확신하지 못하고 있어요.”라고 대답했다."]],"w":"4번에서 Mia는 관계들이 감정적 여력을 고갈시킬(exhaust) 뿐만 아니라, 어떻게 나아가야 할지 확신하지 못한다(uncertain)고 해요. shell·vulnerable은 Mia가 한 말이 아니고, proceed와 behind는 문장에 맞게 들어갈 수 없어요.","c":null},"h":"493a5afd05"}]},{"u":7,"id":"ms3-07-3","no":3,"ko":"사실 아무도 원하지 않았다!","items":[{"n":1,"t":"tf","q":"Jerry Harvey’s father-in-law suggested a trip to the town of Abilene for lunch.","ko":"제리 하비의 장인은 점심을 위해 애빌린이라는 마을로 여행을 갈 것을 제안했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"On a hot summer day in 1971, social psychologist Jerry Harvey’s father-in-law suggested that the family take a trip to the town of Abilene for lunch.","1971년 무더운 여름날, 사회 심리학자 제리 하비의 장인은 가족이 점심을 위해 애빌린이라는 마을로 여행을 갈 것을 제안했다."]],"w":"1번에서 장인이 가족이 점심을 위해 애빌린 마을로 여행을 가자고 제안했다고 해요. 그대로 일치해요.","c":"T"},"h":"3f62c7b152"},{"n":2,"t":"tf","q":"After the trip, the family blamed Jerry Harvey for suggesting the two-hour drive.","ko":"여행 후에, 가족은 두 시간 운전을 제안한 것에 대해 제리 하비를 비난했다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"After they returned home, everyone admitted that they hadn’t really wanted to go in the first place and blamed his father-in-law for suggesting a two-hour drive for a meal that no one enjoyed.","그들이 집으로 돌아온 후, 모두는 사실 처음부터 가고 싶지 않았다고 인정했고, 아무도 즐기지 못한 식사를 위해 2시간 운전을 제안한 것에 대해 그의 장인을 비난했다."]],"w":"2번에서 가족이 비난한 사람은 제리 하비가 아니라 그의 장인(his father-in-law)이에요. 2시간 운전을 제안한 사람이 장인이었어요.","c":"F"},"h":"cb3583a250"},{"n":3,"t":"tf","q":"The father-in-law suggested the trip because he thought the family was getting bored at home.","ko":"장인은 가족이 집에서 지루해하고 있다고 생각했기 때문에 여행을 제안했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"His father-in-law explained that he only suggested it because he thought the family was getting bored staying at home.","그의 장인은 단지 가족이 집에 있는 것에 지루해하고 있다고 생각했기 때문에 제안했다고 설명했다."]],"w":"3번에서 장인은 가족이 집에 있는 것에 지루해하고 있다고 생각했기 때문에 제안했다고 설명해요. 일치해요.","c":"T"},"h":"f6bcff26be"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This anxiety is often amplified by negative fantasies that they might be branded disloyal ...)","ko":"이 불안은 그들이 불충하다고 낙인찍힐 수도 있다는 부정적인 상상에 의해 종종 증폭된다.","opts":["줄어드는","증폭되는","숨겨지는","멈추는"],"word":"amplified","r":{"a":"2) 증폭되는","ev":"7번 문장","s":[[7,"This anxiety is often amplified by negative fantasies that they might be branded disloyal or blamed for a group’s mistakes, leading to fears of social isolation or harm to their reputation.","이 불안은 그들이 불충하다고 낙인찍히거나 집단의 실수에 대해 비난받을 수도 있다는 부정적인 상상에 의해 종종 증폭되어, 사회적 고립이나 평판 손상에 대한 두려움으로 이어진다."]],"w":"7번은 행동 불안이 부정적인 상상 때문에 더 커진다는 내용이에요. 그 결과 사회적 고립이나 평판 손상에 대한 두려움으로 이어지므로 amplify는 '증폭하다(키우다)'예요.","c":2},"h":"4209508fb5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (feel discomfort at the mere thought of acting on their genuine beliefs)","ko":"그들의 진정한 믿음에 따라 행동하는 것에 대한 생각만으로도 불편함을 느끼다","opts":["엄청난","긴 시간의","단순한","위험한"],"word":"mere","r":{"a":"3) 단순한","ev":"6번 문장","s":[[6,"One example is action anxiety, which occurs when people feel discomfort at the mere thought of acting on their genuine beliefs.","한 예는 행동 불안인데, 이는 사람들이 그들의 진정한 믿음에 따라 행동하는 것에 대한 생각만으로도 불편함을 느낄 때 발생한다."]],"w":"6번에서 행동 불안은 행동에 옮기는 것이 아니라 '그저 생각하는 것'만으로도 불편함을 느낄 때 생겨요. 그래서 the mere thought는 '단순한(그저 ~만의) 생각'이에요.","c":3},"h":"14174ef842"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nOne example is action anxiety, which occurs when people feel discomfort at the mere thought of acting on their genuine beliefs.","ko":"밑줄 친 which가 가리키는 것은?","sko":"한 예는 행동 불안인데, 이는 사람들이 그들의 진정한 믿음에 따라 행동하는 것에 대한 생각만으로도 불편함을 느낄 때 발생한다.","opts":["애빌린 역설","행동 불안","진정한 믿음","집단 내 솔직한 의사소통"],"r":{"a":"2) 행동 불안","ev":"6번 문장","s":[[6,"One example is action anxiety, which occurs when people feel discomfort at the mere thought of acting on their genuine beliefs.","한 예는 행동 불안인데, 이는 사람들이 그들의 진정한 믿음에 따라 행동하는 것에 대한 생각만으로도 불편함을 느낄 때 발생한다."]],"c":2,"k":"which = 행동 불안","w":"6번 문장 One example is action anxiety, which occurs when ~에서 which 앞에 있는 명사는 action anxiety(행동 불안)예요. 행동 불안이 '언제 일어나는지'를 which 이하에서 설명하고 있어요."},"pron":"which","h":"63b2206c7b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The concept is driven by psychological barriers that prevent honest communication within groups.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 개념은 집단 내에서 솔직한 의사소통을 방해하는 심리적 장벽들에 의해 작동된다.","opts":["이 개념은 집단 내 소통을 돕는 심리적 장벽에서 나온다.","이 개념은 집단 밖 사람과의 대화를 막는 장벽을 뜻한다.","이 개념은 솔직한 소통이 잘 되는 집단에서만 나타난다.","이 개념은 집단 내 솔직한 소통을 막는 심리적 장벽 때문에 생긴다."],"r":{"a":"4) 이 개념은 집단 내 솔직한 소통을 막는 심리적 장벽 때문에 생긴다.","ev":"5번 문장","s":[[5,"The concept is driven by psychological barriers that prevent honest communication within groups.","이 개념은 집단 내에서 솔직한 의사소통을 방해하는 심리적 장벽들에 의해 작동된다."]],"w":"driven by는 '~에 의해 이끌린', prevent는 '막다'예요. 심리적 장벽이 집단 안의 솔직한 소통을 막고, 그 때문에 애빌린 역설이 생긴다는 뜻이에요. 소통을 돕는다는 선지나 집단 밖과의 대화라는 선지는 내용이 달라요.","c":4},"h":"182cfbfbac"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["애빌린 역설은 기업이 혁신을 더 빨리 이루도록 돕는다.","애빌린 역설은 기업에서 개인의 전문성을 끌어내는 것을 방해한다.","애빌린 역설은 직원들의 생산성을 높여 준다.","애빌린 역설이 있는 직장에서는 이직률이 낮아진다."],"opts":["The Abilene paradox helps companies innovate faster.","The Abilene paradox prevents companies from drawing out individual expertise.","The Abilene paradox raises employees’ productivity.","The Abilene paradox lowers the turnover rate in workplaces."],"r":{"a":"2) The Abilene paradox prevents companies from drawing out individual expertise.","ev":"11번 문장","s":[[11,"For companies, it prevents the extraction of individual expertise, hindering effective decision-making and slowing innovation.","기업들에게, 그것은 개인의 전문성을 끌어내는 것을 방해하여, 효과적인 의사결정을 저해하고 혁신을 늦춘다."]],"w":"11번에서 기업에게 애빌린 역설은 개인의 전문성을 끌어내는 것을 방해하고(prevents), 효과적인 의사결정을 저해하며 혁신을 늦춰요. 생산성은 줄고 이직률은 높아진다고 12번에서 말해요.","c":2},"h":"9bfb5571a1"},{"n":9,"t":"sum","q":"The Abilene paradox occurs when group members (A) their true opinions out of fear, which leads to (B) results for organizations.","ko":"애빌린 역설은 집단 구성원들이 두려움 때문에 자신의 진짜 의견을 (A)할 때 일어나며, 이는 조직에 (B) 결과를 가져온다.","oko":["(A) 드러낸다 / (B) 긍정적인","(A) 숨긴다 / (B) 도움이 되는","(A) 숨긴다 / (B) 바람직하지 않은","(A) 자랑한다 / (B) 바람직하지 않은","(A) 드러낸다 / (B) 바람직하지 않은"],"opts":["(A) reveal / (B) positive","(A) hide / (B) helpful","(A) hide / (B) unfavorable","(A) boast / (B) unfavorable","(A) reveal / (B) unfavorable"],"r":{"a":"3) (A) hide / (B) unfavorable","ev":"4번, 8번, 10번 문장","s":[[4,"This experience became the basis for the Abilene paradox, describing situations where a group pursues actions that contradict individual preferences.","이 경험은 애빌린 역설의 기초가 되었는데, 이는 집단이 개인의 선호와 모순되는 행동을 추구하는 상황을 설명한다."],[8,"As a result, individuals often can’t help withholding minority opinions.","결과적으로, 개인들은 종종 소수 의견을 억제할 수밖에 없게 된다."],[10,"The Abilene paradox can be especially unfavorable in organizational settings.","애빌린 역설은 조직 환경에서 특히 바람직하지 않을 수 있다."]],"w":"4번에서 애빌린 역설은 집단이 개인의 선호와 어긋나는 행동을 하는 상황이고, 8번에서 사람들은 소수 의견을 억제할 수밖에 없으며, 10번에서 조직에서 특히 바람직하지 않다고 해요. 의견을 드러내거나 자랑하는 것, 결과가 긍정적이거나 도움이 되는 것은 모두 본문과 반대예요.","c":3},"h":"38089b6c38"},{"n":10,"t":"fill","q":"When employees feel they cannot [A] their opinions freely, they become [B], which leads to lower motivation and higher turnover.","ko":"직원들이 자신의 의견을 자유롭게 [A]할 수 없다고 느끼면, 그들은 [B] 상태가 되고, 이는 낮은 동기와 높은 이직률로 이어진다.","bank":["express","disengaged","motivated","extraction","branded","amplified"],"bko":{"express":"표현하다","disengaged":"의욕이 떨어진","motivated":"동기 부여된","extraction":"추출","branded":"낙인찍힌","amplified":"증폭된"},"r":{"a":"[A] express, [B] disengaged","ev":"12번 문장","s":[[12,"When employees feel they can’t express their opinions freely, they become disengaged, leading to lower motivation, reduced productivity, and higher turnover.","직원들이 그들의 의견을 자유롭게 표현할 수 없다고 느낄 때, 그들은 의욕이 떨어지고, 이는 낮은 동기, 생산성 감소, 높은 이직률로 이어진다."]],"w":"12번에서 직원들이 의견을 자유롭게 표현할 수 없다(can’t express)고 느끼면 의욕이 떨어지고(disengaged), 그 결과 낮은 동기와 높은 이직률로 이어져요. motivated는 낮은 동기와 모순돼서 [B]에 맞지 않아요.","c":null},"h":"ee64f7235d"}]},{"u":7,"id":"ms3-07-4","no":4,"ko":"Study Playlist: Hit or Miss?","items":[{"n":1,"t":"tf","q":"Classical or ambient music may help concentration by reducing outside distractions.","ko":"클래식이나 잔잔한 음악은 외부의 산만함을 줄임으로써 집중력에 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Classical or ambient music, in particular, may enhance concentration by providing a structured auditory environment that minimizes external distractions.","특히 클래식이나 잔잔한 음악은 외부의 산만함을 최소화하는 구조화된 청각 환경을 제공함으로써 집중력을 향상시킬 수 있다."]],"w":"4번에서 클래식이나 잔잔한 음악은 외부의 산만함을 최소화하는 청각 환경을 제공해 집중력을 향상시킬 수 있다고 해요. 일치해요.","c":"T"},"h":"750efc5d28"},{"n":2,"t":"tf","q":"The writer says that studying without any background sounds is a bad choice if you have not found the right music.","ko":"글쓴이는 알맞은 음악을 찾지 못했다면 배경 소리 없이 공부하는 것은 나쁜 선택이라고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"If you have not found the right music yet, starting your study session without any background sounds might not be a bad choice.","만약 당신이 아직 적절한 음악을 찾지 못했다면, 아무런 배경 소리 없이 공부 시간을 시작하는 것도 나쁜 선택은 아닐지도 모른다."]],"w":"9번에서 아직 알맞은 음악을 찾지 못했다면 배경 소리 없이 공부를 시작하는 것도 '나쁜 선택은 아닐 수 있다(might not be a bad choice)'고 해요. 나쁜 선택이라는 말은 반대예요.","c":"F"},"h":"764b2018d2"},{"n":3,"t":"tf","q":"The writer says that learners should choose music based on their personal responses and study needs.","ko":"글쓴이는 학습자가 자신의 개인적인 반응과 학습 필요에 따라 음악을 골라야 한다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Therefore, for music to be a beneficial study aid, learners should select music based on their personal cognitive responses and study needs.","따라서, 음악이 유익한 학습 보조 수단이 되기 위해서는, 학습자들은 자신의 개인적인 인지 반응과 학습 필요에 따라 음악을 선택해야 한다."]],"w":"8번에서 음악이 유익한 학습 보조 수단이 되기 위해서는 학습자가 개인적인 인지 반응과 학습 필요에 따라 음악을 선택해야 한다고 해요. 일치해요.","c":"T"},"h":"c2d2a4462d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (incorporating music into learning can serve as a mental endurance booster)","ko":"학습에 음악을 포함하는 것은 정신적 지구력 강화제의 역할을 할 수 있다.","opts":["지구력","속도","창의력","기억력"],"word":"endurance","r":{"a":"1) 지구력","ev":"3번 문장","s":[[3,"From a neuroscience perspective, incorporating music into learning can serve as a mental endurance booster by maintaining engagement and reducing cognitive fatigue.","신경과학적 관점에서, 학습에 음악을 포함하는 것은 참여를 유지하고 인지적 피로를 줄임으로써 정신적 지구력 강화제의 역할을 할 수 있다."]],"w":"3번은 음악이 참여를 유지하고 인지적 피로를 줄여서 오래 버티게 도와준다는 내용이에요. 그래서 mental endurance booster는 '정신적 지구력 강화제'예요.","c":1},"h":"42f572b070"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (songs with lyrics and high-tempo compositions may disrupt reading comprehension)","ko":"가사가 있고 템포가 빠른 곡들은 독해력을 방해할 수 있다.","opts":["도와준다","방해한다","설명한다","반복한다"],"word":"disrupt","r":{"a":"2) 방해한다","ev":"7번 문장","s":[[7,"Experts point out songs with lyrics and high-tempo compositions may disrupt reading comprehension by competing for cognitive resources in the brain’s language-processing centers.","전문가들은 가사가 있고 템포가 빠른 곡들은 뇌의 언어 처리 중추에서 인지 자원을 두고 경쟁함으로써 독해력을 방해할 수 있다고 지적한다."]],"w":"7번은 가사가 있고 템포가 빠른 곡이 뇌의 언어 처리 중추에서 인지 자원을 두고 경쟁한다는 내용이에요. 읽기에 쓸 자원을 빼앗으므로 disrupt는 '방해하다'예요.","c":2},"h":"94e6d4792e"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nAdditionally, its structured melodies help learners create associative cues that aid in recall, especially in tasks involving pattern recognition or creative problem-solving.","ko":"밑줄 친 that이 가리키는 것은?","sko":"게다가, 그것의 구조화된 선율은 학습자들이 특히 패턴 인식이나 창의적 문제 해결을 포함하는 과제에서 기억해 내는 것을 돕는 연상 단서를 만드는 데 도움을 준다.","opts":["학습자들","구조화된 선율","연상 단서","패턴 인식"],"r":{"a":"3) 연상 단서","ev":"5번 문장","s":[[5,"Additionally, its structured melodies help learners create associative cues that aid in recall, especially in tasks involving pattern recognition or creative problem-solving.","게다가, 그것의 구조화된 선율은 학습자들이 특히 패턴 인식이나 창의적 문제 해결을 포함하는 과제에서 기억해 내는 것을 돕는 연상 단서를 만드는 데 도움을 준다."]],"c":3,"k":"that = 연상 단서","w":"5번 문장 ~ help learners create associative cues that aid in recall에서 that은 바로 앞의 associative cues(연상 단서)를 꾸며 줘요. 기억해 내는 것을 돕는 것은 선율이 아니라 연상 단서예요."},"pron":"that","h":"9b809fa610"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Just as you’re about to start, you wonder: should you include music in your review session?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"막 시작하려고 할 때, 당신은 궁금해지는데, 복습 시간에 음악을 포함해야 할까?","opts":["공부를 마친 뒤에 음악을 들어야 하는지 궁금해진다.","음악 때문에 공부를 시작하지 못하고 있다.","시작하기 전에 시험 범위를 먼저 확인해야 하는지 궁금해진다.","막 공부를 시작하려는 순간, 복습 시간에 음악을 넣어야 할지 궁금해진다."],"r":{"a":"4) 막 공부를 시작하려는 순간, 복습 시간에 음악을 넣어야 할지 궁금해진다.","ev":"2번 문장","s":[[2,"Just as you’re about to start, you wonder: should you include music in your review session?","막 시작하려고 할 때, 당신은 궁금해지는데, 복습 시간에 음악을 포함해야 할까?"]],"w":"Just as you’re about to start는 '막 시작하려고 할 때', 콜론 뒤의 should you include music in your review session?은 '복습 시간에 음악을 포함해야 할까?'라는 질문이에요. 공부를 마친 뒤나 시험 범위 확인에 대한 질문이 아니에요.","c":4},"h":"d463b4041e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["모든 종류의 음악은 공부에 똑같은 효과를 준다.","음악의 효과는 음악의 종류에 따라 달라진다.","음악은 인지 과제에 어떤 영향도 주지 않는다.","음악은 템포가 빠를 때만 학습에 도움이 된다."],"opts":["Every kind of music has the same effect on studying.","The effectiveness of music varies depending on its type.","Music has no effect on cognitive tasks.","Music helps learning only when the tempo is fast."],"r":{"a":"2) The effectiveness of music varies depending on its type.","ev":"6번 문장","s":[[6,"While music can be a powerful cognitive tool, its effectiveness varies depending on the type of music.","음악이 강력한 인지적 도구가 될 수 있는 반면, 그 효과는 음악의 유형에 따라 다르다."]],"w":"6번에서 음악이 강력한 인지적 도구가 될 수 있지만 그 효과는 음악의 유형에 따라 다르다고 해요. 모두 똑같다는 선지와 영향이 없다는 선지는 6번과 반대이고, 템포가 빠른 곡은 7번에서 오히려 방해가 될 수 있다고 해요.","c":2},"h":"d5e150b6b5"},{"n":9,"t":"sum","q":"Music can serve as a mental endurance booster by maintaining (A) and reducing cognitive (B).","ko":"음악은 (A)을(를) 유지하고 인지적 (B)을(를) 줄임으로써 정신적 지구력 강화제의 역할을 할 수 있다.","oko":["(A) 참여 / (B) 피로","(A) 참여 / (B) 에너지","(A) 지루함 / (B) 피로","(A) 지루함 / (B) 에너지","(A) 소음 / (B) 피로"],"opts":["(A) engagement / (B) fatigue","(A) engagement / (B) energy","(A) boredom / (B) fatigue","(A) boredom / (B) energy","(A) noise / (B) fatigue"],"r":{"a":"1) (A) engagement / (B) fatigue ((A) 참여 / (B) 피로)","ev":"3번 문장","s":[[3,"From a neuroscience perspective, incorporating music into learning can serve as a mental endurance booster by maintaining engagement and reducing cognitive fatigue.","신경과학적 관점에서, 학습에 음악을 포함하는 것은 참여를 유지하고 인지적 피로를 줄임으로써 정신적 지구력 강화제의 역할을 할 수 있다."]],"c":1,"w":"3번에서 음악은 maintaining engagement(참여를 유지)하고 reducing cognitive fatigue(인지적 피로를 줄임)로써 정신적 지구력 강화제의 역할을 할 수 있다고 해요. boredom(지루함)·noise(소음)를 유지하는 것, energy(에너지)를 줄이는 것은 본문과 맞지 않아요."},"h":"fc634b4064"},{"n":10,"t":"fill","q":"You’re sitting at your [A] with your textbooks, notes, and highlighters, feeling ready to study [B] for your upcoming exams.","ko":"당신은 교과서, 노트, 그리고 형광펜과 함께 [A]에 앉아 있고, 다가오는 시험을 위해 [B] 공부할 준비가 된 기분이다.","bank":["desk","hard","lyrics","tempo","external","cognitive"],"bko":{"desk":"책상","hard":"열심히","lyrics":"가사","tempo":"템포","external":"외부의","cognitive":"인지적인"},"r":{"a":"[A] desk (책상), [B] hard (열심히)","ev":"1번 문장","s":[[1,"You’re sitting at your desk with your textbooks, notes, and highlighters, feeling ready to study hard for your upcoming exams.","당신은 다가오는 시험을 위해 열심히 공부할 준비가 된 기분으로, 교과서, 노트, 그리고 형광펜을 가지고 책상에 앉아 있다."]],"c":null,"w":"1번 You’re sitting at your desk with your textbooks, ~, feeling ready to study hard for your upcoming exams.에서 가져왔어요. 책상에 앉는 것이므로 desk, study hard는 '열심히 공부하다'예요. lyrics·tempo는 앉는 장소로 맞지 않고, external·cognitive는 형용사라서 study 뒤에 올 수 없어요."},"h":"4b6b80945b"}]},{"u":8,"id":"ms3-08-1","no":1,"ko":"페이지 새로고침, 가격도 새로고침","items":[{"n":1,"t":"tf","q":"Dynamic pricing is a strategy in which a product’s price changes in real-time depending on factors like demand and supply.","ko":"가변 가격제는 수요와 공급 같은 요인에 따라 제품의 가격이 실시간으로 바뀌는 전략이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Dynamic pricing refers to a strategy wherein a product’s price fluctuates in real-time, contingent upon variables such as demand, competitor pricing, and supply levels.","가변 가격제는 수요, 경쟁자 가격 책정, 그리고 공급 수준과 같은 변수들에 따라 제품의 가격이 실시간으로 변동하는 전략을 지칭한다."]],"w":"5번 문장이 가변 가격제를 가격이 실시간으로 변동하는 전략이라 설명하고, 변수로 수요(demand)와 공급 수준(supply levels)을 들어요.","c":"T"},"h":"7ce839e3ca"},{"n":2,"t":"tf","q":"Coca-Cola’s vending machine charged higher prices on colder days.","ko":"코카콜라의 자판기는 더 추운 날에 더 높은 가격을 청구했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"For instance, Coca-Cola once introduced a vending machine that charged higher prices on hotter days.","예를 들어, 코카콜라는 한때 더 더운 날에 더 높은 가격을 청구하는 자판기를 도입했다."]],"w":"8번 문장에서 자판기는 더 더운(hotter) 날에 더 높은 가격을 청구했어요. colder는 반대예요.","c":"F"},"h":"0c8a2a8347"},{"n":3,"t":"tf","q":"Thirsty customers went to a nearby store to quench their thirst with other carbonated drinks.","ko":"목마른 고객들은 갈증을 해소하려고 다른 탄산음료를 찾아 근처 가게로 갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"So, thirsty customers simply went to a nearby store to quench their thirst with alternative carbonated beverages.","그래서, 목마른 고객들은 대체 탄산음료로 그들의 갈증을 해소하기 위해 단순히 근처 가게로 가게 된다."]],"w":"13번 문장에 thirsty customers went to a nearby store to quench their thirst with alternative carbonated beverages가 그대로 나와요.","c":"T"},"h":"ac4c6b67a1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…industries like airlines and hotels often raise their prices accordingly to maximize revenue.)","ko":"…항공사와 호텔 같은 산업들은 수익을 극대화하기 위해 그에 맞춰 가격을 종종 인상한다.","opts":["반대로","거의 ~않게","그에 맞춰","갑자기"],"word":"accordingly","r":{"a":"3) 그에 맞춰","ev":"6번 문장","s":[[6,"During high-demand periods, such as holidays or vacation seasons, industries like airlines and hotels often raise their prices accordingly to maximize revenue.","휴일이나 휴가철과 같은 수요가 많은 기간 동안, 항공사나 호텔 같은 산업들은 수익을 극대화하기 위해 그에 맞춰 가격을 종종 인상한다."]],"w":"수요가 많은 기간에(During high-demand periods) 그 상황에 맞춰 가격을 올린다는 흐름이에요. accordingly = 그에 맞춰.","c":3},"h":"37ec30248c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But the machines failed to boost revenue because hardly anyone bought a Coke when the price went up.)","ko":"그러나 그 기계들은 가격이 올랐을 때 코카콜라를 산 사람이 거의 없었기 때문에 수익을 …하는 데 실패했다.","opts":["증가시키다","줄이다","나누다","확인하다"],"word":"boost","r":{"a":"1) 증가시키다","ev":"9번 문장","s":[[9,"But the machines failed to boost revenue because hardly anyone bought a Coke when the price went up.","그러나 그 기계들은 가격이 올랐을 때 코카콜라를 산 사람이 거의 없었기 때문에 수익을 증대시키는 데 실패했다."]],"w":"가격을 올려서 수익을 늘리려 했지만 사 먹는 사람이 거의 없었다는 내용이에요. 그래서 boost = 증가시키다예요.","c":1},"h":"65ea86c72c"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nUnlike airplane seats, which have a limited supply and few alternatives, beverages like Coca-Cola are available almost everywhere at a fixed price.","ko":"밑줄 친 which가 가리키는 것은?","sko":"공급이 제한적이고 대안이 거의 없는 비행기 좌석과는 달리, 코카콜라 같은 음료들은 거의 모든 곳에서 고정된 가격으로 이용 가능하다.","opts":["비행기 좌석들","코카콜라 같은 음료들","대안","고정된 가격"],"r":{"a":"1) 비행기 좌석들","ev":"12번 문장","s":[[12,"Unlike airplane seats, which have a limited supply and few alternatives, beverages like Coca-Cola are available almost everywhere at a fixed price.","공급이 제한적이고 대안이 거의 없는 비행기 좌석과는 달리, 코카콜라 같은 음료들은 거의 모든 곳에서 고정된 가격으로 이용 가능하다."]],"c":1,"k":"which = 비행기 좌석들","w":"12번 문장 Unlike airplane seats, which have a limited supply and few alternatives에서 which 바로 앞의 명사는 airplane seats(비행기 좌석들)예요. 공급이 제한적이고 대안이 거의 없는 것은 비행기 좌석이고, 코카콜라 같은 음료는 오히려 거의 어디서나 구할 수 있다고 해요."},"pron":"which","h":"6370b43744"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But when the webpage finishes loading a few seconds later, your jaw drops—the price for the same seat has doubled in the blink of an eye!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 몇 초 후 웹페이지 로딩이 끝났을 때, 당신의 입이 떡 벌어지는데, 같은 좌석의 가격이 눈 깜짝할 사이에 두 배가 되었다!","opts":["웹페이지가 천천히 로딩되어서 같은 좌석의 가격이 절반이 되었다.","웹페이지 로딩이 끝나기 전에 좌석이 모두 팔려서 구매할 수 없게 되었다.","웹페이지를 다시 열었더니 같은 좌석의 가격이 그대로였다.","웹페이지 로딩이 끝나자 같은 좌석의 가격이 순식간에 두 배가 되어 깜짝 놀라게 된다."],"r":{"a":"4) 웹페이지 로딩이 끝나자 같은 좌석의 가격이 순식간에 두 배가 되어 깜짝 놀라게 된다.","ev":"3번 문장","s":[[3,"But when the webpage finishes loading a few seconds later, your jaw drops—the price for the same seat has doubled in the blink of an eye!","그러나 몇 초 후 웹페이지 로딩이 끝났을 때, 당신의 입이 떡 벌어지는데, 같은 좌석의 가격이 눈 깜짝할 사이에 두 배가 되었다!"]],"c":4,"w":"3번의 your jaw drops는 '입이 떡 벌어질 만큼 놀라다'라는 뜻이고, in the blink of an eye는 '눈 깜짝할 사이에'예요. 가격이 doubled(두 배가 되었다)이므로 4번이 맞아요."},"h":"142759716f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["가변 가격제는 모든 제품과 서비스에 똑같이 효과적이다.","항공사와 호텔은 수요가 많은 기간에 가격을 내린다.","가변 가격제는 모든 제품이나 서비스에 효과적인 것은 아니다.","가변 가격제는 오직 경쟁자의 가격에 따라 결정된다."],"opts":["Dynamic pricing is effective for every product and service.","Airlines and hotels lower their prices during high-demand periods.","Dynamic pricing is not effective for all products or services.","Dynamic pricing depends only on competitor pricing."],"r":{"a":"3) Dynamic pricing is not effective for all products or services.","ev":"7번 문장","s":[[7,"However, dynamic pricing is not effective for all products or services.","그러나, 가변 가격제가 모든 제품이나 서비스에 효과적인 것은 아니다."]],"w":"7번에서 모든 제품과 서비스에 효과적인 것은 아니라고 해요. 항공사와 호텔은 수요가 많을 때 가격을 올리고(6번), 가격은 경쟁자 가격만이 아니라 수요·공급에도 따라 달라져요(5번).","c":3},"h":"db471b8be8"},{"n":9,"t":"sum","q":"(B) the hot weather, people did not suddenly stop (A) soft drinks.","ko":"더운 날씨 (B), 사람들은 청량음료를 (A) 것을 갑자기 멈추지 않았다.","oko":["(A) 만드는 / (B) ~에도 불구하고","(A) 마시는 / (B) ~없이","(A) 마시는 / (B) ~에도 불구하고","(A) 만드는 / (B) ~없이","(A) 잃는 / (B) ~을 제외하고"],"opts":["(A) making / (B) despite","(A) drinking / (B) without","(A) drinking / (B) despite","(A) making / (B) without","(A) losing / (B) except"],"r":{"a":"3) (A) drinking / (B) despite ((A) 마시는 / (B) ~에도 불구하고)","ev":"10번 문장","s":[[10,"Did people suddenly stop drinking soft drinks despite the hot weather?","사람들이 더운 날씨에도 불구하고 갑자기 청량음료 마시는 것을 멈췄을까?"]],"c":3,"w":"10번에서 Did people suddenly stop drinking soft drinks despite the hot weather?라고 묻고, 11번에서 Of course, that was not the case(물론 그렇지 않았다)라고 답해요. 그래서 (A) drinking, (B) despite(~에도 불구하고)예요. making·losing은 본문에 없는 내용이고, without·except는 문장의 뜻이 맞지 않아요."},"h":"53f213c61a"},{"n":10,"t":"fill","q":"In March, you searched for a flight for your [A] summer vacation and found a [B] priced ticket.","ko":"3월에 당신은 [A] 여름 휴가를 위한 항공편을 검색했고 [B] 가격이 책정된 표를 발견했다.","bank":["upcoming","reasonably","doubled","accordingly","hardly","boost"],"bko":{"upcoming":"다가오는","reasonably":"합리적으로","doubled":"두 배가 된","accordingly":"그에 맞춰","hardly":"거의 ~않다","boost":"증가시키다"},"r":{"a":"[A] upcoming, [B] reasonably","ev":"1~2번 문장","s":[[1,"It’s March, and you’re already searching for a flight for your upcoming summer vacation to Hawaii.","3월이고, 당신은 다가오는 하와이 여름 휴가를 위해 이미 항공편을 검색하고 있다."],[2,"Luckily, you find a reasonably priced ticket and immediately press “Buy.”","운 좋게도, 당신은 합리적으로 가격이 책정된 표를 발견하고 즉시 “구매” 버튼을 누른다."]],"w":"1번에서 여름 휴가는 앞으로 다가오는(upcoming) 휴가이고, 2번에서 합리적으로 가격이 책정된(reasonably priced) 표를 발견해요. 나머지 단어는 이 자리에 들어가면 뜻이 어색해요.","c":null},"h":"347f79bf90"}]},{"u":8,"id":"ms3-08-2","no":2,"ko":"50% 할인 vs 반값 할인","items":[{"n":1,"t":"tf","q":"In a coin toss, the probability never changes even after the coin lands on heads five times.","ko":"동전 던지기에서 동전이 앞면으로 다섯 번 떨어진 뒤에도 확률은 결코 변하지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"However, from a mathematical perspective, each flip is independent and the probability never changes.","그러나, 수학적 관점에서, 각 던지기는 독립적이고 확률은 결코 변하지 않는다."]],"w":"6번에서 각 던지기는 독립적이고 확률은 결코 변하지 않는다고 해요. 뒷면이 나올 때가 됐다는 생각(5번)은 직관일 뿐이에요.","c":"T"},"h":"ab63dbade6"},{"n":2,"t":"tf","q":"“One in two” and “fifty percent” mean different chances, so people feel them differently.","ko":"“둘 중 하나”와 “50퍼센트”는 서로 다른 가능성을 의미해서 사람들이 다르게 느낀다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"When people are told something has a “one in two” chance of happening, it feels different from hearing a “fifty percent” chance, even though both mean the same thing.","사람들이 무언가가 일어날 “둘 중 하나”의 가능성이 있다고 들을 때, 비록 둘 다 같은 것을 의미할지라도, “50퍼센트”의 가능성을 듣는 것과는 다르게 느껴진다."]],"w":"10번에서 두 표현은 같은 것을 의미하는데도(both mean the same thing) 다르게 느껴진다고 해요.","c":"F"},"h":"f3bed9c3e6"},{"n":3,"t":"tf","q":"People are less willing to try a product when success is described as “likely” than when it is given as a numerical probability.","ko":"성공이 “가능성 있는”으로 묘사될 때가 수치적 확률로 주어질 때보다 사람들은 제품을 덜 기꺼이 시도한다.","r":{"a":"F (본문과 다른 내용)","ev":"17번 문장","s":[[17,"For example, people are more willing to try products when success is described as “likely” rather than as a numerical probability, even when the actual chance is identical.","예를 들어, 실제 확률이 동일할 때조차도, 성공이 수치적 확률로서보다는 “가능성 있는” 것으로 묘사될 때 사람들은 기꺼이 제품을 시도하려 한다."]],"w":"17번에서 “likely”로 묘사될 때 사람들이 더 기꺼이 시도해요. less가 반대예요.","c":"F"},"h":"f63ad94915"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Randomness naturally includes streaks, clusters, and repetition—features that may seem suspicious but are mathematically normal.)","ko":"무작위성은 의심스러워 보일지도 모르지만 수학적으로는 정상적인 특징들을 자연스럽게 포함한다.","opts":["의심스러운","놀라운","유용한","위험한"],"word":"suspicious","r":{"a":"1) 의심스러운","ev":"15번 문장","s":[[15,"Randomness naturally includes streaks, clusters, and repetition—features that may seem suspicious but are mathematically normal.","무작위성은 의심스러워 보일지도 모르지만 수학적으로는 정상적인 특징들인 연속, 군집, 그리고 반복을 자연스럽게 포함한다."]],"w":"but 뒤에 '수학적으로는 정상적'이라고 하니, 앞은 정상이 아닌 듯 '의심스러워 보일 수 있다'는 뜻이에요.","c":1},"h":"214ad3df82"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Truly random events rarely seem arbitrary to the human mind.)","ko":"진정으로 무작위적인 사건들은 인간의 마음에 좀처럼 …하게 보이지 않는다.","opts":["정확한","무작위적인","불가능한","익숙한"],"word":"arbitrary","r":{"a":"2) 무작위적인","ev":"8번 문장","s":[[8,"Truly random events rarely seem arbitrary to the human mind.","진정으로 무작위적인 사건들은 인간의 마음에 좀처럼 무작위적으로 보이지 않는다."]],"w":"앞의 random events와 이어져서, 진짜 무작위인 사건이 사람 눈에는 무작위로 보이지 않는다는 뜻이에요. arbitrary = 무작위적인.","c":2},"h":"f9af9247f7"},{"n":6,"t":"ref","q":"What does the underlined \"none\" refer to?\nOur brains react more strongly to stories and patterns than to numbers, and we search for meaning where none exists.","ko":"밑줄 친 none이 가리키는 것은?","sko":"우리의 뇌는 숫자보다 이야기와 패턴에 더 강하게 반응하고, 우리는 아무것도 존재하지 않는 곳에서 의미를 찾는다.","opts":["숫자","이야기","의미","뇌"],"r":{"a":"3) 의미","ev":"11번 문장","s":[[11,"Our brains react more strongly to stories and patterns than to numbers, and we search for meaning where none exists.","우리의 뇌는 숫자보다 이야기와 패턴에 더 강하게 반응하고, 우리는 아무것도 존재하지 않는 곳에서 의미를 찾는다."]],"w":"where none exists는 '아무것도 존재하지 않는 곳'이고, 찾는 대상은 search for meaning의 meaning(의미)이에요. 의미가 없는 곳에서도 의미를 찾는다는 뜻이에요.","c":3},"h":"c1cf3eecb0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The discomfort comes not from incorrect math, but from incorrect intuition.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 불편함은 부정확한 수학이 아니라, 부정확한 직관에서 온다.","opts":["불편함은 틀린 직관이 아니라 부정확한 수학에서 생긴다.","불편함은 수학과 직관을 모두 정확히 쓸 때 생긴다.","불편함은 부정확한 수학이 아니라 부정확한 직관에서 온다.","불편함은 부정확한 수학과 직관 어느 것과도 관계가 없다."],"r":{"a":"3) 불편함은 부정확한 수학이 아니라 부정확한 직관에서 온다.","ev":"7번 문장","s":[[7,"The discomfort comes not from incorrect math, but from incorrect intuition.","그 불편함은 부정확한 수학이 아니라, 부정확한 직관에서 온다."]],"w":"not A but B는 'A가 아니라 B'예요. A는 incorrect math, B는 incorrect intuition이므로 원인은 직관이에요.","c":3},"h":"42dd1d7298"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사람들은 결정을 내릴 때 항상 직관이 아니라 통계에 의존한다.","표현만 바꿔도 위험이 더 안전하거나 더 매력적으로 느껴질 수 있다.","인간은 본래 확률을 해석하는 데 능숙하다.","우리의 뇌는 이야기보다 숫자에 더 강하게 반응한다."],"opts":["People always use statistics rather than intuition when making decisions.","Wording can make a risk feel safer or more appealing.","Humans are naturally good at interpreting probability.","Our brains react more strongly to numbers than to stories."],"r":{"a":"2) Wording can make a risk feel safer or more appealing.","ev":"18번 문장","s":[[18,"Simply changing the wording makes a risk feel safer or more appealing.","단순히 표현만 바꾸는 것도 위험을 더 안전하거나 더 매력적으로 느껴지게 만든다."]],"w":"18번에서 표현을 바꾸는 것만으로도 위험이 더 안전하거나 매력적으로 느껴진다고 해요. 확률은 변하지 않고(6번), 인간은 확률 해석에 서툴며(2번), 뇌는 숫자보다 이야기에 더 반응해요(11번).","c":2},"h":"e04fad4d93"},{"n":9,"t":"sum","q":"People are (A) at judging probability because they (B) rely on intuition rather than statistics.","ko":"사람들은 통계보다 직관에 (B) 의존하기 때문에 확률을 판단하는 데 (A).","oko":["(A) 서툰 / (B) 거의 ~않게","(A) 능숙한 / (B) 자주","(A) 서툰 / (B) 자주","(A) 능숙한 / (B) 거의 ~않게","(A) 관심 있는 / (B) 결코 ~않게"],"opts":["(A) poor / (B) rarely","(A) skilled / (B) frequently","(A) poor / (B) frequently","(A) skilled / (B) rarely","(A) interested / (B) never"],"r":{"a":"3) (A) poor / (B) frequently ((A) 서툰 / (B) 자주)","ev":"2번, 12번 문장","s":[[2,"Yet in reality, humans are surprisingly poor at interpreting probability—even when the math is simple.","그러나 실제로, 인간은 확률을 해석하는 데 놀라울 정도로 서툰데, 심지어 셈이 간단할 때조차도 그렇다."],[12,"Because of this, people frequently rely on intuition rather than statistics when making decisions.","이것 때문에, 사람들은 결정을 내릴 때 통계보다는 직관에 자주 의존한다."]],"c":3,"w":"2번에서 인간은 확률을 해석하는 데 놀라울 정도로 서툴다(poor)고 했고, 12번에서 사람들은 결정을 내릴 때 통계보다 직관에 자주(frequently) 의존한다고 해요. 그래서 (A) poor, (B) frequently예요. skilled는 poor와 반대이고, rarely·never는 frequently와 반대예요."},"h":"05ed9fd35a"},{"n":10,"t":"fill","q":"Detecting patterns helps humans [A], but probability does not follow human [B].","ko":"패턴을 감지하는 것은 인간이 [A]하도록 돕지만, 확률은 인간의 [B]을(를) 따르지 않는다.","bank":["survive","expectations","repetition","arbitrary","willing","identical"],"bko":{"survive":"살아남다","expectations":"기대","repetition":"반복","arbitrary":"무작위적인","willing":"기꺼이 ~하는","identical":"동일한"},"r":{"a":"[A] survive, [B] expectations","ev":"13~14번 문장","s":[[13,"So in everyday life, detecting patterns helps humans survive.","따라서 일상생활에서, 패턴을 감지하는 것은 인간이 생존하도록 돕는다."],[14,"However, probability does not follow human expectations.","그러나, 확률은 인간의 기대를 따르지 않는다."]],"w":"13번에서 패턴을 감지하면 인간이 생존(survive)하는 데 도움이 되고, 14번에서 확률은 인간의 기대(expectations)를 따르지 않는다고 해요.","c":null},"h":"f99329129f"}]},{"u":8,"id":"ms3-08-3","no":3,"ko":"멜로디로 치료해 드립니다","items":[{"n":1,"t":"tf","q":"Sunshine pop emerged in Southern California in the mid-1960s.","ko":"선샤인 팝은 1960년대 중반 남부 캘리포니아에서 등장했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Sunshine pop is a subgenre of pop music that emerged in the mid-1960s in Southern California.","선샤인 팝은 1960년대 중반 남부 캘리포니아에서 등장한 팝 음악의 하위 장르이다."]],"w":"3번에서 1960년대 중반(mid-1960s) 남부 캘리포니아에서 등장했다고 해요.","c":"T"},"h":"21ca794f32"},{"n":2,"t":"tf","q":"The Mamas & the Papas were an unknown band with little connection to sunshine pop.","ko":"마마스 앤 파파스는 선샤인 팝과 거의 관련이 없는 무명 밴드였다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Sunshine pop peaked in popularity from the mid to late 1960s, with the Mamas & the Papas being one of the representative bands of this era.","선샤인 팝은 1960년대 중반부터 후반까지 인기의 정점을 찍었는데, 마마스 앤 파파스가 이 시대의 대표적인 밴드 중 하나였다."]],"w":"7번에서 마마스 앤 파파스는 이 시대를 대표하는 밴드 중 하나(one of the representative bands)였어요.","c":"F"},"h":"aa7061a20c"},{"n":3,"t":"tf","q":"Sunshine pop still provides background music in advertisements and movies.","ko":"선샤인 팝은 지금도 광고와 영화에서 배경 음악을 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Thanks to its catchy harmonies and pleasing sound, this genre remains influential by providing background music in advertisements and movies.","그것의 기억하기 쉬운 화음과 즐거운 소리 덕분에, 이 장르는 광고와 영화에서 배경 음악을 제공함으로써 여전히 영향력이 있다."]],"w":"10번에서 이 장르는 광고와 영화에 배경 음악을 제공함으로써 여전히 영향력이 있다고 해요.","c":"T"},"h":"bd33bbc6f2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For music lovers, there’s a melodic remedy that transforms melancholy into joy—sunshine pop!)","ko":"음악 애호가들에게는, …을 기쁨으로 바꾸는 선율적인 치료법이 있는데, 바로 선샤인 팝이다!","opts":["분노","우울함","평온","지루함"],"word":"melancholy","r":{"a":"2) 우울함","ev":"2번 문장","s":[[2,"For music lovers, there’s a melodic remedy that transforms melancholy into joy—sunshine pop!","음악 애호가들에게는, 우울함을 기쁨으로 바꾸는 선율적인 치료법이 있는데, 바로 선샤인 팝이다!"]],"w":"1번에서 삶이 무겁고 감정이 짓누른다고 했고, 이것을 기쁨(joy)으로 바꾼다고 하니 melancholy = 우울함이에요.","c":2},"h":"04417db434"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…they are sung along to an uplifting melody.)","ko":"…그것들은 …한 멜로디에 맞춰 불린다.","opts":["느린","복잡한","경쾌한","우울한"],"word":"uplifting","r":{"a":"3) 경쾌한","ev":"6번 문장","s":[[6,"Even when lyrics occasionally express feelings of anxiety, they are sung along to an uplifting melody.","가사가 가끔 불안의 감정을 표현할 때조차도, 그것들은 경쾌한 멜로디에 맞춰 불린다."]],"w":"가사가 불안을 표현해도(Even when) 그 가사는 기분을 들어 올리는 멜로디에 맞춰 불려요. uplifting = 경쾌한.","c":3},"h":"aa271de3ec"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nIn 1966, the group released a genre-defining song “Monday, Monday,” which combines lyrics about Monday always bringing sadness with an upbeat tone.","ko":"밑줄 친 which가 가리키는 것은?","sko":"1966년에, 그 그룹은 장르를 정의하는 노래인 “Monday, Monday”를 발표했는데, 그것은 월요일이 항상 슬픔을 가져온다는 가사를 긍정적인 어조와 결합한다.","opts":["월요일","선샤인 팝","마마스 앤 파파스","노래 “Monday, Monday”"],"r":{"a":"4) 노래 “Monday, Monday”","ev":"8번 문장","s":[[8,"In 1966, the group released a genre-defining song “Monday, Monday,” which combines lyrics about Monday always bringing sadness with an upbeat tone.","1966년에, 그 그룹은 장르를 정의하는 노래인 “Monday, Monday”를 발표했는데, 그것은 월요일이 항상 슬픔을 가져온다는 가사를 긍정적인 어조와 결합한다."]],"w":"which는 바로 앞 “Monday, Monday”를 보충 설명해요. 슬픈 가사와 긍정적인 어조를 결합한 것은 이 노래예요.","c":4},"h":"2fc5b1c01f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Like the region’s sunny weather, this music sounds warm and bright.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 지역의 화창한 날씨처럼, 이 음악은 따뜻하고 밝게 들린다.","opts":["그 지역의 화창한 날씨처럼, 이 음악은 차갑고 어둡게 들린다.","그 지역의 날씨가 흐려서, 이 음악도 흐리고 조용하게 들린다.","그 지역의 화창한 날씨처럼, 이 음악은 따뜻하고 밝게 들린다.","이 음악은 날씨와 상관없이 항상 슬프게 들린다."],"r":{"a":"3) 그 지역의 화창한 날씨처럼, 이 음악은 따뜻하고 밝게 들린다.","ev":"4번 문장","s":[[4,"Like the region’s sunny weather, this music sounds warm and bright.","그 지역의 화창한 날씨처럼, 이 음악은 따뜻하고 밝게 들린다."]],"c":3,"w":"4번의 Like the region’s sunny weather는 '그 지역의 화창한 날씨처럼'이라는 뜻이에요. 화창한 날씨처럼 이 음악도 warm and bright(따뜻하고 밝게) 들린다는 뜻이므로 3번이에요."},"h":"85fde60fc2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["“Monday, Monday”는 빌보드 핫 100 차트에서 3주 연속 1위를 했다.","마마스 앤 파파스는 “Monday, Monday”를 발표하기 전에 그래미상을 받았다.","“Monday, Monday”는 1970년대 중반에 발표되었다.","그 그룹은 솔로 가수 부문 최우수 팝 퍼포먼스로 그래미상을 받았다."],"opts":["“Monday, Monday” topped the Billboard Hot 100 chart for three consecutive weeks.","The Mamas & the Papas won a Grammy before they released “Monday, Monday.”","“Monday, Monday” was released in the mid-1970s.","The group won a Grammy for Best Pop Performance by a Solo Artist."],"r":{"a":"1) “Monday, Monday” topped the Billboard Hot 100 chart for three consecutive weeks.","ev":"9번 문장","s":[[9,"This song not only topped the Billboard Hot 100 chart for three consecutive weeks but also won a Grammy for Best Pop Performance by a Group.","이 노래는 빌보드 핫 100 차트에서 3주 연속 1위를 차지했을 뿐만 아니라 그룹 부문 최우수 팝 퍼포먼스로 그래미상을 수상했다."]],"w":"9번에서 이 노래는 3주 연속 빌보드 핫 100 1위를 했어요. 노래는 1966년에 발표되었고(8번), 그래미는 '그룹' 부문이었어요(9번).","c":1},"h":"ead4316c2c"},{"n":9,"t":"sum","q":"It features joyful, rich (A) and lyrics that focus on themes of love and (B).","ko":"그것은 즐겁고 풍부한 (A)과(와) 사랑과 (B)의 주제에 초점을 맞춘 가사를 특징으로 한다.","oko":["(A) 보컬 / (B) 분노","(A) 춤 / (B) 우정","(A) 보컬 / (B) 우정","(A) 춤 / (B) 분노","(A) 비명 / (B) 성공"],"opts":["(A) vocals / (B) anger","(A) dances / (B) friendship","(A) vocals / (B) friendship","(A) dances / (B) anger","(A) screams / (B) success"],"r":{"a":"3) (A) vocals / (B) friendship ((A) 보컬 / (B) 우정)","ev":"5번 문장","s":[[5,"It features joyful, rich vocals and lyrics that usually focus on themes of love and friendship.","그것은 즐겁고 풍부한 보컬과 대개 사랑과 우정의 주제에 초점을 맞춘 가사를 특징으로 한다."]],"c":3,"w":"5번에서 선샤인 팝은 joyful, rich vocals(즐겁고 풍부한 보컬)와, love and friendship(사랑과 우정)의 주제에 초점을 맞춘 가사를 특징으로 한다고 해요. 그래서 (A) vocals, (B) friendship이에요. anger·success·dances·screams는 본문에 나오지 않아요."},"h":"ba80510d69"},{"n":10,"t":"fill","q":"When life feels [A] and emotions weigh you down, what do you [B] do?","ko":"삶이 [A] 것처럼 느껴지고 감정이 당신을 짓누를 때, 당신은 [B] 무엇을 하는가?","bank":["heavy","usually","melody","region","harmonies","lyrics"],"bko":{"heavy":"무거운","usually":"대개","melody":"멜로디","region":"지역","harmonies":"화음","lyrics":"가사"},"r":{"a":"[A] heavy (무거운), [B] usually (대개)","ev":"1번 문장","s":[[1,"When life feels heavy and emotions weigh you down, what do you usually do?","삶이 무겁게 느껴지고 감정이 당신을 짓누를 때, 당신은 대개 무엇을 하는가?"]],"c":null,"w":"1번 When life feels heavy and emotions weigh you down, what do you usually do?에서 가져왔어요. feel 뒤에는 상태를 나타내는 형용사 heavy(무거운)가 오고, do 앞에는 '대개'라는 뜻의 부사 usually가 와요. melody·region·harmonies·lyrics는 명사라서 두 자리에 들어갈 수 없어요."},"h":"503413d6ac"}]},{"u":8,"id":"ms3-08-4","no":4,"ko":"Zero Gravity, Zero Defense","items":[{"n":1,"t":"tf","q":"In a microgravity environment, objects seem to have no mass because they are in a state of freefall.","ko":"미세 중력 환경에서 물체들은 자유 낙하 상태에 있기 때문에 질량이 없는 것처럼 보인다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The reason for this is that ISS crew members spend an extended period of time in a microgravity environment—one in which objects seem to have no mass because they are in a state of freefall.","이것에 대한 이유는 ISS 승무원들이 미세 중력 환경, 즉 물체들이 그것들이 자유 낙하의 상태에 있기 때문에 질량이 없는 것처럼 보이는 환경에서 연장된 기간을 보내기 때문이다."]],"w":"3번 문장의 one in which 이하에서 물체들이 자유 낙하 상태에 있어 질량이 없는 것처럼 보인다고 해요.","c":"T"},"h":"fbe9932a89"},{"n":2,"t":"tf","q":"Recent research suggests that astronauts are less susceptible to illnesses than people on Earth.","ko":"최근의 연구는 우주비행사들이 지구에 있는 사람들보다 질병에 덜 취약하다고 시사한다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"But this is not the only challenge they face; recent research suggests that astronauts may be more susceptible to illnesses such as colds and skin rashes than people on Earth!","그러나 이것이 그들이 직면하는 유일한 도전은 아닌데, 최근의 연구는 우주비행사들이 지구에 있는 사람들보다 감기와 피부 발진들과 같은 질병들에 더 취약할지도 모른다는 것을 시사한다!"]],"w":"2번에서 우주비행사들은 지구에 있는 사람들보다 질병에 더 취약할지도 모른다(more susceptible)고 해요. less는 반대예요.","c":"F"},"h":"59106cb86a"},{"n":3,"t":"tf","q":"If astronauts avoid improperly sterilized equipment and infected people, they never get sick.","ko":"우주비행사들이 부적절하게 살균된 장비와 감염된 사람을 피하면, 결코 아프지 않다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Even if these situations are avoided, astronauts can still get sick.","비록 이 상황들이 피해질지라도, 우주비행사들은 여전히 아플 수 있다."]],"w":"9번에서 이런 상황을 피해도 우주비행사들은 여전히 아플 수 있다고 해요. 몸속 잠재 바이러스가 재활성화될 수 있기 때문이에요(10번).","c":"F"},"h":"1679ded54a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…their immune systems tend to resume normal function after a few months.)","ko":"…그들의 면역 체계는 몇 달 후에 정상적인 기능을 …하는 경향이 있다.","opts":["재개하다","중단하다","잊어버리다","약화시키다"],"word":"resume","r":{"a":"1) 재개하다","ev":"12번 문장","s":[[12,"Once astronauts return to Earth, their immune systems tend to resume normal function after a few months.","일단 우주비행사들이 지구로 돌아오면, 그들의 면역 체계들은 몇 달 후에 정상적인 기능을 재개하는 경향이 있다."]],"w":"11번에서 이 상태가 일시적이라고 했으니, 지구로 돌아오면 정상 기능을 다시 시작한다는 뜻이에요. resume = 재개하다.","c":1},"h":"66fc003942"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…it begins to accumulate in the head.)","ko":"…그것은 머리에 …하기 시작한다.","opts":["사라지다","흩어지다","축적되다","증발하다"],"word":"accumulate","r":{"a":"3) 축적되다","ev":"4번 문장","s":[[4,"Without gravity to constantly pull blood down into the arms and legs, it begins to accumulate in the head.","혈액을 팔들과 다리들로 끊임없이 아래로 당기는 중력이 없이, 그것은 머리에 축적되기 시작한다."]],"w":"중력이 혈액을 팔과 다리로 끌어내리지 못하니 혈액이 머리에 쌓이기 시작해요. accumulate = 축적되다.","c":3},"h":"55993ef263"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nSo where do the microorganisms that infect astronauts come from?","ko":"밑줄 친 that이 가리키는 것은?","sko":"그렇다면 우주비행사들을 감염시키는 미생물들은 어디에서 오는가?","opts":["우주비행사들","미생물들","감염된 사람","면역 세포들"],"r":{"a":"2) 미생물들","ev":"7번 문장","s":[[7,"So where do the microorganisms that infect astronauts come from?","그렇다면 우주비행사들을 감염시키는 미생물들은 어디에서 오는가?"]],"c":2,"k":"that = 미생물들","w":"7번 문장 the microorganisms that infect astronauts에서 that은 바로 앞의 the microorganisms(미생물들)를 꾸며 줘요. 우주비행사들을 감염시키는 것은 우주비행사가 아니라 미생물이에요."},"pron":"that","h":"4ae334a6c1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is because the immune system becomes so weak that latent viruses in the body can be reactivated, triggering a new infection.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 면역 체계가 너무 약해져서 신체 내의 잠재하는 바이러스들이 재활성화될 수 있고, 새로운 감염을 유발하기 때문이다.","opts":["면역 체계가 너무 강해져서 몸속 바이러스가 모두 사라진다.","새로운 감염 때문에 면역 체계가 약해지고 잠재 바이러스가 생긴다.","잠재 바이러스가 몸 밖에서 들어와 면역 체계를 약하게 만든다.","면역 체계가 너무 약해져서 몸속 잠재 바이러스가 다시 활동해 새로운 감염을 일으킬 수 있다."],"r":{"a":"4) 면역 체계가 너무 약해져서 몸속 잠재 바이러스가 다시 활동해 새로운 감염을 일으킬 수 있다.","ev":"10번 문장","s":[[10,"This is because the immune system becomes so weak that latent viruses in the body can be reactivated, triggering a new infection.","이것은 면역 체계가 너무 약해져서 신체 내의 잠재하는 바이러스들이 재활성화될 수 있고, 새로운 감염을 유발하기 때문이다."]],"w":"「so + 형용사 + that」은 '너무 ~해서 …하다'예요. 면역 체계가 약해진 것이 원인이고, 잠재 바이러스의 재활성화와 새 감염이 결과예요. 인과 관계가 뒤바뀐 보기는 오답이에요.","c":4},"h":"706c7aa930"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["미세 중력 환경에서 혈액은 다리 쪽으로 몰린다.","혈액의 총량이 줄면 면역 세포의 수가 늘어난다.","우주비행사의 면역 체계는 결국 상당히 더 약해진다.","우주비행사는 오직 부적절하게 살균된 장비 때문에만 병에 걸린다."],"opts":["Blood moves toward the legs in a microgravity environment.","The number of immune cells increases as the total amount of blood falls.","The immune system of astronauts becomes significantly weaker.","Astronauts get sick only because of improperly sterilized equipment."],"r":{"a":"3) The immune system of astronauts becomes significantly weaker.","ev":"6번 문장","s":[[6,"Eventually, the body’s immune system becomes significantly weaker.","결국, 신체의 면역 체계는 상당히 더 약해진다."]],"w":"6번에서 신체의 면역 체계가 상당히 더 약해진다고 해요. 혈액은 머리에 쌓이고(4번), 혈액량이 줄면 면역 세포 수가 감소하며(5번), 감염 원인은 장비만이 아니에요(8~10번).","c":3},"h":"89b473ca7c"},{"n":9,"t":"sum","q":"The weakened immune system of astronauts is (A), and it gets better once they (B) to Earth.","ko":"우주비행사의 약해진 면역 체계는 (A)이며, 그들이 지구로 (B) 나아진다.","oko":["(A) 영구적 / (B) 돌아오면","(A) 일시적 / (B) 떠나면","(A) 일시적 / (B) 돌아오면","(A) 위험한 / (B) 떠나면","(A) 영구적 / (B) 떠나면"],"opts":["(A) permanent / (B) return","(A) temporary / (B) leave","(A) temporary / (B) return","(A) dangerous / (B) leave","(A) permanent / (B) leave"],"r":{"a":"3) (A) temporary / (B) return ((A) 일시적 / (B) 돌아오면)","ev":"11번, 12번 문장","s":[[11,"Fortunately, this condition is temporary.","다행히도, 이 상태는 일시적이다."],[12,"Once astronauts return to Earth, their immune systems tend to resume normal function after a few months.","일단 우주비행사들이 지구로 돌아오면, 그들의 면역 체계들은 몇 달 후에 정상적인 기능을 재개하는 경향이 있다."]],"c":3,"w":"11번에서 this condition is temporary(이 상태는 일시적이다)라고 했고, 12번에서 우주비행사들이 지구로 돌아오면(return to Earth) 면역 체계가 몇 달 후 정상 기능을 되찾는다고 해요. 그래서 (A) temporary, (B) return이에요. permanent는 temporary와 반대이고, leave는 return과 반대예요."},"h":"dfa176793e"},{"n":10,"t":"fill","q":"In some cases, infection [A] due to improperly sterilized equipment or contact with an infected person just before a [B].","ko":"몇몇 경우에, 감염은 부적절하게 살균된 장비 또는 [B] 바로 직전의 감염된 사람과의 접촉 때문에 [A].","bank":["occurs","mission","gravity","immune","resume","viruses"],"bko":{"occurs":"발생하다","mission":"임무","gravity":"중력","immune":"면역의","resume":"재개하다","viruses":"바이러스들"},"r":{"a":"[A] occurs (발생하다), [B] mission (임무)","ev":"8번 문장","s":[[8,"In some cases, infection occurs due to improperly sterilized equipment or contact with an infected person just before a mission.","몇몇 경우들에서, 감염은 부적절하게 살균된 장비 또는 임무 바로 직전의 감염된 사람과의 접촉 때문에 발생한다."]],"c":null,"w":"8번 In some cases, infection occurs due to improperly sterilized equipment or contact with an infected person just before a mission.에서 가져왔어요. 감염이 '발생하다'는 occurs, 감염된 사람과 접촉한 때는 '임무(mission)' 직전이에요. gravity·immune·resume·viruses는 두 자리에 문법이나 뜻이 맞지 않아요."},"h":"9f18231bd1"}]},{"u":9,"id":"ms3-09-1","no":1,"ko":"벤치가 부서졌으니 나도 망했군!","items":[{"n":1,"t":"tf","q":"Having a broken bench came to mean being unable to pay one's debts.","ko":"부서진 벤치를 가지는 것은 자신의 빚을 갚을 수 없는 것을 뜻하게 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Over time, having a broken bench became synonymous with being unable to pay one’s debts.","시간이 흐르면서, 부서진 벤치를 가지는 것은 자신의 빚을 갚을 수 없는 것과 동의어가 되었다."]],"w":"3번에서 부서진 벤치를 가지는 것이 빚을 갚을 수 없는 것과 동의어(synonymous)가 되었다고 해요. 2번에서 상인이 실패하면 벤치를 부순 일이 점점 그 뜻으로 굳어진 거예요.","c":"T"},"h":"eece726fdd"},{"n":2,"t":"tf","q":"The English word bankrupt comes from a Latin phrase meaning “broken bench.”","ko":"영어 단어 bankrupt는 ‘부서진 벤치’를 의미하는 라틴어 구절에서 왔다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"This is reflected in the Italian phrase banca rotta, meaning “broken bench,” which later became the root of the English word bankrupt.","이것은 ‘부서진 벤치’를 의미하는 이탈리아어 구절 banca rotta에 반영되었는데, 이것은 후에 영어 단어 bankrupt의 어원이 되었다."]],"w":"4번에서 어원이 된 banca rotta는 이탈리아어(Italian) 구절이에요. 라틴어가 아니에요. 뜻이 ‘부서진 벤치’인 것은 맞아요.","c":"F"},"h":"076449463a"},{"n":3,"t":"tf","q":"Other European nations also adopted regulations similar to Italy's to handle commercial debt.","ko":"다른 유럽 국가들도 상업적 부채를 처리하기 위해 이탈리아와 비슷한 규정을 채택했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Then, other European nations eventually adopted similar regulations to handle commercial debt and developed them.","그러자, 다른 유럽 국가들도 결국 상업적 부채를 처리하기 위한 유사한 규정들을 채택해서 그것들을 발전시켰다."]],"w":"8번에서 다른 유럽 국가들이 결국 상업적 부채를 처리하려고 유사한 규정(similar regulations)을 채택했다고 해요. 6~7번의 이탈리아 파산법 뒤에 이어진 일이에요.","c":"T"},"h":"c325f94a66"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 15th-century Italy, cities established comprehensive bankruptcy laws…)","ko":"15세기 이탈리아에서, 도시들은 포괄적인 파산법을 …했다.","opts":["폐지했다","제정했다","비판했다","잊어버렸다"],"word":"established","r":{"a":"2) 제정했다","ev":"6번 문장","s":[[6,"In 15th-century Italy, cities established comprehensive bankruptcy laws to deal with merchants who could not repay their debts.","15세기 이탈리아에서, 도시들은 빚을 갚을 수 없는 상인들을 다루기 위한 포괄적인 파산법을 도입했다."]],"w":"6번에서 도시들이 파산법을 새로 만들어 두었다는 흐름이에요. 5번에서 법 제도가 채무 해결 과정을 공식화하기 시작했다고 했으니, established는 '제정했다'예요.","c":2},"h":"3b7217da13"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…distinguishing between fraudulent and unfortunate financial collapse.)","ko":"…사기성이 있는 재정 붕괴와 불운한 재정 붕괴를 구분하는.","opts":["고의적인","합법적인","불법적인","불운한"],"word":"unfortunate","r":{"a":"4) 불운한","ev":"9번 문장","s":[[9,"For example, by the 17th century, England had developed a robust legal framework for bankruptcy, distinguishing between fraudulent and unfortunate financial collapse.","예를 들어, 17세기에 이르러, 영국은 사기성이 있는 재정 붕괴와 불운한 재정 붕괴를 구분하는 파산을 위한 견고한 법적 체계를 발전시켰다."]],"w":"9번은 fraudulent(사기성이 있는)와 unfortunate를 구분한다고 해요. 사기와 반대로, 일부러가 아니라 운이 나빠서 생긴 붕괴이므로 '불운한'이에요.","c":4},"h":"f0bf21ac14"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIf these merchants failed financially, their bench was physically broken so that they could no longer continue trading.","ko":"밑줄 친 they가 가리키는 것은?","sko":"만약 이 상인들이 재정적으로 실패하면, 그들이 더 이상 거래를 계속할 수 없도록 그들의 벤치가 물리적으로 부서졌다.","opts":["상인들","벤치들","시장 광장","은행들"],"r":{"a":"1) 상인들","ev":"2번 문장","s":[[2,"If these merchants failed financially, their bench was physically broken so that they could no longer continue trading.","만약 이 상인들이 재정적으로 실패하면, 그들이 더 이상 거래를 계속할 수 없도록 그들의 벤치가 물리적으로 부서졌다."]],"w":"더 이상 거래를 계속할 수 없게 되는 쪽은 벤치가 아니라 사람, 즉 these merchants(이 상인들)예요. 벤치는 부서지는 대상이에요.","c":1},"h":"18bdd1b488"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As the concept of bankruptcy evolved, legal systems began to formalize the process of debt resolution.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"파산의 개념이 발전함에 따라, 법적 시스템은 채무 해결 과정을 공식화하기 시작했다.","opts":["파산의 개념이 사라지자, 법 제도가 채무 해결 과정을 없애기 시작했다.","파산의 개념이 발전하면서, 법 제도가 채무를 해결하는 절차를 공식적으로 정리하기 시작했다.","파산을 처리하는 법이 먼저 생기고 나서 파산이라는 개념이 만들어졌다.","법 제도가 발전하자, 상인들은 빚을 해결하는 과정을 스스로 바꾸기 시작했다."],"r":{"a":"2) 파산의 개념이 발전하면서, 법 제도가 채무를 해결하는 절차를 공식적으로 정리하기 시작했다.","ev":"5번 문장","s":[[5,"As the concept of bankruptcy evolved, legal systems began to formalize the process of debt resolution.","파산의 개념이 발전함에 따라, 법적 시스템은 채무 해결 과정을 공식화하기 시작했다."]],"w":"As ~ evolved는 '~가 발전함에 따라', formalize the process of debt resolution은 '채무 해결 과정을 공식화하다'예요. 개념이 먼저 발전하고 그에 따라 법이 정리하기 시작한 순서예요.","c":2},"h":"8644c2f4de"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["중세 상인들은 큰 이익을 낸 뒤 자신의 벤치를 스스로 부쉈다.","중세 상인들은 시장 광장의 벤치에서 금전 대출과 통화 교환을 했다.","영국은 15세기에 처음으로 포괄적인 파산법을 도입했다.","현대에는 파산하는 것이 오직 최종적인 실패로만 여겨진다."],"opts":["Merchants broke their own benches after making a large profit.","Merchants in the Middle Ages did money lending and currency exchange from benches in market squares.","England established the first comprehensive bankruptcy laws in the 15th century.","In the modern era, going bankrupt is seen only as terminal failure."],"r":{"a":"2) Merchants in the Middle Ages did money lending and currency exchange from benches in market squares.","ev":"1번 문장","s":[[1,"Before structured bank systems appeared, merchants in the Middle Ages engaged in money lending and currency exchange from benches in market squares.","체계적인 은행 시스템이 등장하기 전에, 중세 시대의 상인들은 시장 광장의 벤치에서 금전 대출 및 통화 교환에 종사했다."]],"w":"1번에서 중세 상인들은 시장 광장의 벤치에서 금전 대출과 통화 교환을 했어요. 벤치는 실패했을 때 부서졌고(2번), 15세기 파산법은 이탈리아 도시들이 도입했으며(6번), 현대에는 오로지 실패로만 보지 않아요(10번).","c":2},"h":"5b77e60df0"},{"n":9,"t":"sum","q":"Today, bankruptcy can be understood as a kind of (A) button that gives people and companies genuine (B) for economic rebirth.","ko":"오늘날 파산은 개인과 기업에게 경제적 재탄생을 위한 진정한 (B)을(를) 주는 일종의 (A) 버튼으로 이해될 수 있다.","oko":["(A) 재설정 / (B) 처벌","(A) 정지 / (B) 기회","(A) 재설정 / (B) 기회","(A) 정지 / (B) 처벌","(A) 전원 / (B) 빚"],"opts":["(A) reset / (B) punishments","(A) stop / (B) opportunities","(A) reset / (B) opportunities","(A) stop / (B) punishments","(A) power / (B) debts"],"r":{"a":"3) (A) reset / (B) opportunities ((A) 재설정 / (B) 기회)","ev":"11번 문장","s":[[11,"Rather, it can be understood as a kind of reset button—a sophisticated financial strategy that affords individuals and corporations legal protections, debt restructuring, and genuine opportunities for economic rebirth.","오히려, 그것은 일종의 리셋 버튼으로 이해될 수 있고, 개인과 기업에게 법적 보호, 부채 구조조정, 그리고 경제적 재탄생을 위한 진정한 기회를 제공하는 정교한 재정 전략이다."]],"c":3,"w":"11번에서 파산은 일종의 reset button(리셋 버튼)으로 이해될 수 있고, 개인과 기업에게 경제적 재탄생을 위한 진정한 기회(genuine opportunities)를 준다고 해요. 그래서 (A) reset, (B) opportunities예요. stop·power는 본문의 버튼과 맞지 않고, punishments(처벌)·debts(빚)는 본문 내용과 반대예요."},"h":"a8d5c0d0de"},{"n":10,"t":"fill","q":"Italian laws [A] the specific conditions under which a merchant could be [B] insolvent.","ko":"이탈리아의 법들은 상인이 지불 불능으로 [B]될 수 있는 특정 조건들을 [A]했다.","bank":["defined","declared","repaid","feared","sold","evolved"],"bko":{"defined":"정의했다","declared":"선언된","repaid":"갚았다","feared":"두려워했다","sold":"팔았다","evolved":"발전했다"},"r":{"a":"[A] defined, [B] declared","ev":"7번 문장","s":[[7,"These laws defined the specific conditions under which merchants could be declared insolvent, creating a structured approach to financial failure.","이 법들은 상인들이 지불 불능으로 선언될 수 있는 특정 조건들을 정의하여, 재정적 실패에 대한 구조화된 접근법을 만들었다."]],"w":"7번에서 These laws defined the specific conditions under which merchants could be declared insolvent라고 해요. [B]는 be 뒤의 수동 표현이라 declared(선언된)가 들어가고, repaid·sold·feared·evolved는 이 문장 구조나 뜻과 맞지 않아요.","c":null},"h":"819447be82"}]},{"u":9,"id":"ms3-09-2","no":2,"ko":"금 가도 걱정 없는 건물이 온다","items":[{"n":1,"t":"tf","q":"Henk Jonkers added bacteria and a nutrient called calcium lactate to the concrete mixture in 2006.","ko":"2006년에 Henk Jonk
