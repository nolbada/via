<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<title>관제탑 등록</title>
<style>
  :root{--ink:#1f2328;--sub:#667085;--line:#e3e5e8;--bg:#f5f4f0;--pri:#2b5cab;--warn:#b4402c}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);margin:0;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 80px}
  h1{font-size:19px;margin:6px 0 12px}
  button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;cursor:pointer}
  button.p{background:var(--pri);border-color:var(--pri);color:#fff}
  button.w{color:var(--warn);border-color:#e8c9c2}
  button:disabled{opacity:.5}
  #gate{max-width:420px;margin:60px auto;padding:24px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center}
  #gerr,#msg{color:var(--sub);min-height:22px;margin:8px 2px;font-size:14px}
  #msg.no,#gerr{color:var(--warn)}
  .grp{font-size:13px;color:var(--sub);margin:14px 2px 6px}
  .row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
  .row .n{font-weight:600}
  .row .s{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
  .row.out .n{color:var(--sub);text-decoration:line-through}
  .bar{display:flex;gap:8px;margin-bottom:8px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px;margin-bottom:8px}
  .k{color:var(--sub);font-size:13px}
  .line{display:flex;gap:8px;margin-top:6px;align-items:center}
  input{font:inherit;padding:8px 10px;border:1px solid var(--line);border-radius:8px;min-width:0;flex:1}
  .n2{cursor:pointer;text-decoration:underline;text-underline-offset:3px}
  .tag{font-size:12px;color:var(--pri);margin-left:6px}
  .lg{font-size:13px;padding:6px 0;border-top:1px solid var(--line);display:flex;gap:8px;align-items:center}
  .lg span.m{flex:1}
</style>
</head>
<body>
<div id="gate" style="display:none"><h1>관제탑 등록</h1><button class="p" id="glog" style="width:100%">구글로 로그인</button><div id="gerr"></div></div>
<div class="wrap" id="app" style="display:none">
  <h1>관제탑 등록</h1>
  <div class="bar"><button class="p" id="reg">빠진 학생 등록</button><button id="reload">새로 읽기</button><button id="syn">위치 새로 읽기</button></div>
  <div id="msg"></div>
  <div id="list"></div>
</div>
<div class="wrap" id="st" style="display:none"></div>
<script>
/* tower-admin 261121d — 선생님 전용. 학생 문서 등록(이미 있으면 건드리지 않음)·재원/퇴원 전환·위치 새로 읽기. 모든 변경은 tower_log 에 새로 쌓인다. */
(function(){
var ROSTER={"M초6A":["윤여름","조서인"],"M초6C":["김동권","김은찬","김이한","민윤찬","박윤수","신도건","이상윤"],"T초6B":["김지율","김태율","노지훈","이재빈","연휘건"],"T초6C":["김예슬","노예린","류이안","이연서","이재인","조은유","연다혜"],"M중1B":["김시원","김윤슬","류아인","박대환","이지성","임건호","정해윤"],"T중1A":["김태건","장도율","조이준","최민준","홍윤제"]};
var ORDER=["M초6A","M초6C","T초6B","T초6C","M중1B","T중1A"];
var DB="projects/h-roadmap/databases/(default)",BASE="https://firestore.googleapis.com/v1/"+DB+"/documents";
var AUTH=null,EMAIL="",DOCS=[],BUSY=false,ARM="";
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function say(t,no){$("msg").textContent=t||"";$("msg").className=no?"no":"";}
function norm(s){return String(s||"").normalize("NFC").replace(/\s+/g,"");}
function docId(name){
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode("tower|"+norm(name))).then(function(h){
    return Array.prototype.map.call(new Uint8Array(h),function(x){return ("0"+x.toString(16)).slice(-2);}).join("").slice(0,20);
  });
}
function S(v){return {stringValue:String(v)};}
function dec(f){
  if(!f)return null;
  if("stringValue" in f)return f.stringValue;
  if("integerValue" in f)return Number(f.integerValue);
  if("nullValue" in f)return null;
  if("arrayValue" in f)return (f.arrayValue.values||[]).map(dec);
  if("mapValue" in f){var o={},m=f.mapValue.fields||{};for(var k in m)o[k]=dec(m[k]);return o;}
  return null;
}
function api(path,opt){return AUTH.token().then(function(t){opt=opt||{};opt.headers={"Authorization":"Bearer "+t,"Content-Type":"application/json"};return fetch(BASE+path,opt);});}
function logW(act,name,cls){
  var t=Date.now(),id=t+"_"+Math.random().toString(36).slice(2,8);
  return {update:{name:DB+"/documents/tower_log/"+id,fields:{t:{integerValue:String(t)},who:S(EMAIL),act:S(act),name:S(name),cls:S(cls)}},currentDocument:{exists:false}};
}
function load(){
  DOCS=[];
  function page(tok){
    return api("/tower_s?pageSize=100"+(tok?"&pageToken="+encodeURIComponent(tok):"")).then(function(r){
      if(r.status===401||r.status===403)throw {auth:1};
      if(!r.ok)throw new Error("읽기 실패 "+r.status);
      return r.json().then(function(j){
        (j.documents||[]).forEach(function(d){var f=d.fields||{};DOCS.push({id:d.name.split("/").pop(),ut:d.updateTime,name:(f.name||{}).stringValue,cls:(f.cls||{}).stringValue,status:(f.status||{}).stringValue,pos:dec(f.pos),pend:dec(f.pend)});});
        if(j.nextPageToken)return page(j.nextPageToken);
      });
    });
  }
  return page("");
}
function render(){
  var by={};DOCS.forEach(function(d){(by[d.cls]=by[d.cls]||[]).push(d);});
  var h="";
  ORDER.concat(Object.keys(by).filter(function(c){return ORDER.indexOf(c)<0;})).forEach(function(c){
    var a=by[c];if(!a)return;
    var n=a.filter(function(d){return d.status==="active";}).length;
    h+='<div class="grp">'+esc(c)+" · 재원 "+n+"명</div>";
    a.sort(function(x,y){return x.name<y.name?-1:1;}).forEach(function(d){
      var out=d.status!=="active";
      h+='<div class="row'+(out?" out":"")+'"><span class="n n2" data-open="'+d.id+'">'+esc(d.name)+'</span><span class="s">'+(out?"퇴원":"재원")+'<button class="'+(out?"":"w")+'" data-id="'+d.id+'">'+(out?"다시 재원":"퇴원 처리")+"</button></span></div>";
    });
  });
  $("list").innerHTML=h||'<div class="grp">등록된 학생이 없습니다</div>';
  var missing=allNames().length-DOCS.filter(function(d){return allNames().some(function(x){return x[1]===d.name;});}).length;
  $("reg").textContent=missing>0?"빠진 학생 등록 ("+missing+"명)":"빠진 학생 없음";
  $("reg").disabled=missing<=0||BUSY;
}
function allNames(){var o=[];ORDER.forEach(function(c){ROSTER[c].forEach(function(n){o.push([c,n]);});});return o;}
function fail(e){BUSY=false;if(e&&e.auth){authFail();return;}say(String(e&&e.message||e),1);render();}
function reload(msg){return load().then(function(){render();say(msg||"");},fail);}
$("reg").onclick=function(){
  if(BUSY)return;BUSY=true;say("등록 중...");
  load().then(function(){
    var have={};DOCS.forEach(function(d){have[d.name]=1;});
    var todo=allNames().filter(function(x){return !have[x[1]];});
    if(!todo.length){BUSY=false;render();say("빠진 학생이 없습니다.");return;}
    return Promise.all(todo.map(function(x){return docId(x[1]);})).then(function(ids){
      var w=[];
      todo.forEach(function(x,i){
        w.push({update:{name:DB+"/documents/tower_s/"+ids[i],fields:{
          name:S(x[1]),cls:S(x[0]),status:S("active"),season:S("비내신"),
          pos:{mapValue:{fields:{}}},pend:{arrayValue:{values:[]}},pin:{nullValue:null},v:{integerValue:"1"},created:{integerValue:String(Date.now())}
        }},currentDocument:{exists:false}});
        w.push(logW("register",x[1],x[0]));
      });
      return api(":commit",{method:"POST",body:JSON.stringify({writes:w})}).then(function(r){
        if(r.status===401||r.status===403)throw {auth:1};
        if(!r.ok)throw new Error("등록 실패 "+r.status+" (이미 있는 학생이 있으면 새로 읽고 다시 해 주세요)");
        BUSY=false;return reload(todo.length+"명을 등록했습니다.");
      });
    });
  }).catch(fail);
};
$("reload").onclick=function(){say("읽는 중...");reload();};
$("list").onclick=function(ev){
  var b=ev.target.closest("[data-id]");if(!b||BUSY)return;
  var d=DOCS.filter(function(x){return x.id===b.getAttribute("data-id");})[0];if(!d)return;
  var to=d.status==="active"?"left":"active";
  if(to==="left"&&ARM!==d.id){ARM=d.id;say(d.name+" 학생을 퇴원 처리하려면 한 번 더 눌러 주세요. 기록은 지워지지 않고 입장만 막힙니다.");setTimeout(function(){ARM="";},4000);return;}
  ARM="";BUSY=true;say("저장 중...");
  var w=[{update:{name:DB+"/documents/tower_s/"+d.id,fields:{status:S(to)}},updateMask:{fieldPaths:["status"]},currentDocument:{updateTime:d.ut}},logW(to==="left"?"left":"active",d.name,d.cls)];
  api(":commit",{method:"POST",body:JSON.stringify({writes:w})}).then(function(r){
    if(r.status===401||r.status===403)throw {auth:1};
    if(!r.ok)throw new Error("저장 실패 "+r.status+" (새로 읽고 다시 해 주세요)");
    BUSY=false;return reload(d.name+" 학생을 "+(to==="left"?"퇴원":"재원")+"으로 바꿨습니다.");
  }).catch(fail);
};

/* ===== 위치 새로 읽기: 기존 기록(l_*)을 읽어 학생 문서의 위치(pos)·지정 대기(pend)에 저장 ===== */
var SRV="https://script.google.com/macros/s/AKfycbyGjwU2UXP8hoRLn0VThkus7bj_ZnGc12ByvFXuFDVtPSz-GmyumnDd2CkLSBWJw81I/exec";
var GK_URL="https://nolbada.github.io/board/gichul_m1.json";
var LEN={K:64,E:64,Y:64,X:100,M1:78,GK:232,VL:30};
var BDEND={"기본":950,"발전":1140,"심화":950,"고교":1440};
var BDORD=["기본","발전","심화","고교","워마2000"];
var DVEND={M:80,B:80,H:112};
var DVORD=["M","B","H"];
var RDINFO={tutorstarter:["리딩튜터 주니어 스타터",24],hackersstarter:["해커스 스타터",24],tutorjunior:["리딩튜터 주니어",40],hackers:["해커스 리딩스마트",40],"1316reading":["능률 1316",40],bricks:["브릭스",40],readinggraphy:["리딩그라피",36],tutorchallenger:["리딩튜터 챌린저",40],hackersmaster:["해커스 마스터",40]};
var RDPER={tutorstarter:3,hackersstarter:3,tutorjunior:4,hackers:4,"1316reading":4,bricks:4,readinggraphy:3,tutorchallenger:4,hackersmaster:4};
function P(s){try{return JSON.parse(s)}catch(e){return {}}}
function num(s,re){var m=(s||"").match(re);return m?+m[1]:null}
function bookInfo(k){var m=k.match(/^(.*?)(\d+)$/),b=m?m[1]:k,n=m?m[2]:"",t=RDINFO[b]||[b,40];return {name:t[0]+" "+n,len:t[1],per:RDPER[b]||4};}
function readOne(n){
  return fetch(SRV+"?a=get&date=2000-01-01&name="+encodeURIComponent(n)).then(function(r){return r.json()}).then(function(j){
    var a=(j&&j.chk&&j.chk.app)||{},o={};
    for(var k in a){if(k.indexOf("l_")===0)o[k]=P(a[k]);}
    var r={};
    if(o.l_vk)r.K=num(o.l_vk.w,/Day (\d+)/);
    if(o.l_ve)r.E=num(o.l_ve.w,/Day (\d+)/);
    if(o.l_vy)r.Y=num(o.l_vy.w,/Day (\d+)/);
    if(o.l_xr)r.X=num(o.l_xr.w,/엑스레이 (\d+)/);
    if(o.l_m1)r.M1=num(o.l_m1.w,/Reading (\d+)/);
    if(o.l_m2)r.M2=num(o.l_m2.w,/Reading (\d+)/);
    if(o.l_gk1)r.GK=num(o.l_gk1.w,/No\.(\d+)/);
    if(o.l_vl)r.VL=num(o.l_vl.w,/DAY (\d+)/);
    if(o.l_dv){var md=(o.l_dv.w||"").match(/데일리보카 ([MBH]) Day (\d+)/);if(md){r.DVL=md[1];r.DVN=+md[2];}}
    if(o.l_bd){var m=(o.l_bd.w||"").match(/비단챌 (\S+) (\d+)/);if(m){r.BDL=m[1];r.BDN=+m[2];}}
    var best=null;
    for(var k2 in o){var m2=k2.match(/^l_rd_(.+?)(_exit)?$/);if(!m2)continue;var dd=(o[k2].d||"")+(o[k2].t||"");if(!best||dd>best.d)best={d:dd,b:m2[1],u:o[k2].u||""};}
    if(best){var bi=bookInfo(best.b),mr=/[?&]r=([^&]+)/.exec(best.u),id=mr?mr[1]:"",q,ord=null;
      if(/^r\d+$/.test(id))ord=+id.slice(1);else{q=id.match(/-(\d+)-(\d+)$/);if(q)ord=(+q[1]-1)*bi.per+(+q[2]);}
      r.RDB=bi.name;r.RDL=bi.len;r.RDN=ord;}
    var last="";for(var k3 in o){if((o[k3].d||"")>last)last=o[k3].d;}
    r.last=last;
    return r;
  });
}
/* 자동 연결 규칙: 지금 단계가 끝(진행>=길이)이면 다음 단계 "시작 전"으로 보인다. 끝에서 사람이 정해야 하면 지정 대기에 올린다. */
function computePos(r){
  var pos=[],pend=[];
  var vs=[["K",r.K,LEN.K],["E",r.E,LEN.E],["엑스레이",r.X,LEN.X],["Y",r.Y,LEN.Y]],li=-1,i;
  for(i=0;i<vs.length;i++)if(vs[i][1]!=null)li=i;
  if(li>=0){var c=vs[li];
    if(c[1]>=c[2])pos.push({k:"V시그널",v:c[0]+" 끝 · 다음 "+(li<3?vs[li+1][0]:"Y 주요문장 100")+" 시작 전"});
    else pos.push({k:"V시그널",v:c[0]+" "+c[1]+"/"+c[2]});}
  if(r.M2!=null)pos.push({k:"M 리딩",v:"M2 Reading "+r.M2});
  else if(r.M1!=null){if(r.M1>=LEN.M1)pos.push({k:"M 리딩",v:"M1 끝 · 다음 M2 시작 전"});else pos.push({k:"M 리딩",v:"M1 "+r.M1+"/"+LEN.M1});}
  if(r.GK!=null){pos.push({k:"대화문 기출",v:r.GK+"/"+LEN.GK});if(r.GK>=LEN.GK)pend.push("대화문 기출 중1 끝, 새 문제 대기 또는 중2 지정");}
  if(r.BDL){var e=BDEND[r.BDL];
    if(e&&r.BDN>=e){var nx=BDORD[BDORD.indexOf(r.BDL)+1]||"";pos.push({k:"비단챌",v:r.BDL+" 끝"+(nx?" · 다음 "+nx+" 시작 전":"")});}
    else pos.push({k:"비단챌",v:r.BDL+" "+r.BDN+(e?"/"+e:"")+(e&&r.BDN+9>=e?" · 마지막 묶음":"")});}
  if(r.VL!=null){pos.push({k:"보카링크",v:"DAY "+r.VL+"/"+LEN.VL});if(r.VL>=LEN.VL)pend.push("보카링크 끝, 시험 대기");}
  if(r.RDN!=null){pos.push({k:"독해33",v:r.RDB+" "+r.RDN+"/"+r.RDL});if(r.RDN>=r.RDL)pend.push("독해33 "+r.RDB+" 끝, 다음 책 지정 대기");}
  if(r.DVL&&DVEND[r.DVL]){
    if(r.DVN>=DVEND[r.DVL]){
      if(r.DVL==="H"){pos.push({k:"데일리보카",v:"H 끝"});pend.push("데일리보카 H 끝, 다음 지정 대기");}
      else pos.push({k:"데일리보카",v:r.DVL+" 끝 · 다음 "+DVORD[DVORD.indexOf(r.DVL)+1]+" 시작 전"});
    }else pos.push({k:"데일리보카",v:r.DVL+" "+r.DVN+"/"+DVEND[r.DVL]});
  }
  return {pos:pos,pend:pend};
}
function arrV(a,f){return {arrayValue:{values:a.map(f)}};}
function posField(p){return arrV(p,function(x){return {mapValue:{fields:{k:S(x.k),v:S(x.v)}}};});}
function same(a,b){return JSON.stringify(a||[])===JSON.stringify(b||[]);}
function wdate(t){var d=new Date(t),W=["일","월","화","수","목","금","토"];return (d.getMonth()+1)+"/"+d.getDate()+"("+W[d.getDay()]+")";}
$("syn").onclick=function(){
  if(BUSY)return;BUSY=true;$("syn").disabled=true;say("기록을 읽는 중...");
  var act=[],res=[],bad=[];
  load().then(function(){
    act=DOCS.filter(function(d){return d.status==="active";});
    return fetch(GK_URL).then(function(r){return r.json()}).then(function(j){if(j&&j.questions)LEN.GK=j.questions.length;}).catch(function(){});
  }).then(function(){
    var i=0;
    function batch(){
      if(i>=act.length)return Promise.resolve();
      var part=act.slice(i,i+6);i+=6;
      return Promise.all(part.map(function(d){return readOne(d.name).then(function(r){res.push([d,r]);}).catch(function(){bad.push(d.name);});})).then(batch);
    }
    return batch();
  }).then(function(){
    var now=Date.now(),w=[],ch=0;
    res.forEach(function(x){
      var d=x[0],r=x[1],c=computePos(r);
      var np=c.pos.map(function(q){return [q.k,q.v];}),op=(Array.isArray(d.pos)?d.pos:[]).map(function(q){return [q.k,q.v];});
      var chg=!same(np,op)||!same(c.pend,d.pend);
      var f={pos:posField(c.pos),pend:arrV(c.pend,S),r:S(JSON.stringify(r)),sy:{integerValue:String(now)}};
      w.push({update:{name:DB+"/documents/tower_s/"+d.id,fields:f},updateMask:{fieldPaths:["pos","pend","r","sy"]},currentDocument:{exists:true}});
      if(chg){ch++;var lw=logW("pos",d.name,d.cls);lw.update.fields.before=S(JSON.stringify({pos:op,pend:d.pend||[]}));lw.update.fields.after=S(JSON.stringify({pos:np,pend:c.pend}));w.push(lw);}
    });
    if(!w.length){BUSY=false;$("syn").disabled=false;say("읽을 학생이 없습니다.",1);return;}
    return api(":commit",{method:"POST",body:JSON.stringify({writes:w})}).then(function(r){
      if(r.status===401||r.status===403)throw {auth:1};
      if(!r.ok)throw new Error("위치 저장 실패 "+r.status);
      BUSY=false;$("syn").disabled=false;
      return reload("위치를 새로 읽었습니다. 바뀐 학생 "+ch+"명 · "+res.length+"명 확인"+(bad.length?" · 읽지 못함: "+bad.join(", "):"")+" ("+wdate(now)+")");
    });
  }).catch(function(e){$("syn").disabled=false;fail(e);});
};
/* ===== 학생 한 명 화면: 반 옮기기 · 위치 지정 · 지정 대기 처리 · 되돌리기 ===== */
var ST=null,STLOG=[],STK=[],TRK=["V시그널","M 리딩","대화문 기출","비단챌","보카링크","독해33","데일리보카"];
var ACT={register:"등록",left:"퇴원",active:"재원",pos:"위치 읽기",cls:"반 이동",ov:"위치 지정",asg:"지정 입력",undo:"되돌림"};
function fv(x){
  if(x===null||x===undefined)return {nullValue:null};
  if(typeof x==="string")return S(x);
  if(typeof x==="number")return {integerValue:String(x)};
  if(Array.isArray(x))return {arrayValue:{values:x.map(fv)}};
  var f={};for(var k in x)f[k]=fv(x[k]);return {mapValue:{fields:f}};
}
function fdec(f){var d={};for(var k in f)d[k]=dec(f[k]);return d;}
function stFail(e){BUSY=false;if(e&&e.auth){authFail();return;}say(String(e&&e.message||e),1);}
function stLoad(id){
  return api("/tower_s/"+id).then(function(r){
    if(r.status===401||r.status===403)throw {auth:1};
    if(!r.ok)throw new Error("학생 읽기 실패 "+r.status);
    return r.json();
  }).then(function(j){
    var d=fdec(j.fields||{});d.id=id;d.ut=j.updateTime;
    if(!d.ov||Array.isArray(d.ov)||typeof d.ov!=="object")d.ov={};
    if(!Array.isArray(d.asg))d.asg=[];
    if(!Array.isArray(d.pos))d.pos=[];
    if(!Array.isArray(d.pend))d.pend=[];
    ST=d;
    return api(":runQuery",{method:"POST",body:JSON.stringify({structuredQuery:{from:[{collectionId:"tower_log"}],where:{fieldFilter:{field:{fieldPath:"name"},op:"EQUAL",value:S(d.name)}},limit:100}})});
  }).then(function(r){
    if(r.status===401||r.status===403)throw {auth:1};
    if(!r.ok)throw new Error("기록 읽기 실패 "+r.status);
    return r.json();
  }).then(function(a){
    STLOG=a.filter(function(x){return x.document;}).map(function(x){var q=fdec(x.document.fields||{});q.id=x.document.name.split("/").pop();return q;}).sort(function(x,y){return y.t-x.t;});
  });
}
function ptime(t){var d=new Date(t),W=["일","월","화","수","목","금","토"];return (d.getMonth()+1)+"/"+d.getDate()+"("+W[d.getDay()]+") "+("0"+d.getHours()).slice(-2)+":"+("0"+d.getMinutes()).slice(-2);}
function compV(k){for(var i=0;i<ST.pos.length;i++)if(ST.pos[i].k===k)return ST.pos[i].v;return "";}
function ovOn(k){var o=ST.ov[k];return !!(o&&typeof o==="object"&&o.b===compV(k));}
function undoId(){
  for(var i=0;i<STLOG.length;i++){var e=STLOG[i];
    if(e.act!=="cls"&&e.act!=="ov"&&e.act!=="asg")continue;
    if(STLOG.some(function(x){return x.act==="undo"&&x.of===e.id;}))continue;
    return e.id;
  }
  return "";
}
function stView(){
  var d=ST,h="",cl={};
  DOCS.forEach(function(x){cl[x.cls]=1;});
  STK=[];d.pos.forEach(function(x){STK.push(x.k);});
  Object.keys(d.ov).forEach(function(k){if(STK.indexOf(k)<0)STK.push(k);});
  h+='<button data-a="back">목록으로</button>';
  h+='<h1>'+esc(d.name)+'</h1><div class="grp">'+esc(d.cls)+" · "+(d.status==="active"?"재원":"퇴원")+(d.sy?" · 기록 읽은 시각 "+ptime(d.sy):"")+'</div>';
  h+='<div class="card"><div class="k">반</div><div class="line"><input id="stcls" list="clsl" value="'+esc(d.cls)+'"><button class="p" data-a="cls">옮기기</button></div><datalist id="clsl">'+Object.keys(cl).map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist></div>';
  h+='<div class="grp">위치</div>';
  STK.forEach(function(k,i){
    var on=ovOn(k),cur=on?d.ov[k].t:compV(k);
    h+='<div class="card"><div class="k">'+esc(k)+(on?'<span class="tag">선생님 지정</span>':"")+'</div><div class="line"><input id="stv'+i+'" value="'+esc(cur)+'"><button class="p" data-a="ov" data-i="'+i+'">저장</button>'+(on?'<button data-a="ovx" data-i="'+i+'">지정 해제</button>':"")+'</div></div>';
  });
  h+='<div class="card"><div class="k">항목 추가</div><div class="line"><input id="stnk" list="trkl" placeholder="항목"><datalist id="trkl">'+TRK.map(function(c){return '<option value="'+esc(c)+'">';}).join("")+'</datalist><input id="stnv" placeholder="위치"><button class="p" data-a="ovn">추가</button></div></div>';
  h+='<div class="grp">지정 대기</div>';
  if(!d.pend.length)h+='<div class="card k">없음</div>';
  d.pend.forEach(function(x,i){

  });

    h+='<div class="lg"><span class="k">'+ptime(e.t)+'</span><span class="m">'+esc(ACT[e.act]||e.act)+(e.msg?" · "+esc(e.msg):"")+'</span>'+(e.id===u?'<button data-a="undo">되돌리기</button>':"")+'</div>';n++;
  });

function stOpen(id){
  say("읽는 중...");
  stLoad(id).then(function(){$("app").style.display="none";$("st").style.display="block";stView();say("");window.scrollTo(0,0);}).catch(stFail);

function stSave(act,changes,msg,of){
  if(BUSY)return;BUSY=true;say("저장 중...");
  var before={},after={},fields={},mask=[];
  for(var f in changes){before[f]=ST[f];after[f]=changes[f];fields[f]=fv(changes[f]);mask.push(f);}
  var lw=logW(act,ST.name,ST.cls);
  lw.update.fields.before=S(JSON.stringify(before));lw.update.fields.after=S(JSON.stringify(after));lw.update.fields.msg=S(msg);
  if(of)lw.update.fields.of=S(of);
  var w=[{update:{name:DB+"/documents/tower_s/"+ST.id,fields:fields},updateMask:{fieldPaths:mask},currentDocument:{updateTime:ST.ut}},lw];
  return api(":commit",{method:"POST",body:JSON.stringify({writes:w})}).then(function(r){
    if(r.status===401||r.status===403)throw {auth:1};
    if(!r.ok)throw new Error("저장 실패 "+r.status+" (아래 새로 읽기를 누르고 다시 해 주세요)");
    BUSY=false;
    return stLoad(ST.id).then(function(){stView();say(msg+" 저장했습니다.");});
  }).catch(stFail);
}
function cp(o){return JSON.parse(JSON.stringify(o));}
function ovSet(k,val){
  var o=cp(ST.ov);val=String(val||"").trim();
  if(!val||val===compV(k))delete o[k];else o[k]={t:val,b:compV(k)};
  return o;
}
$("st").addEventListener("click",function(ev){

  var a=b.getAttribute("data-a"),i=+b.getAttribute("data-i"),k=STK[i];

    var p=ST.pend[i],t=a==="asg"?String($("sta"+i).value).trim():"",L=ST.asg.filter(function(q){return q&&q.p!==p;});
    if(t)L.push({p:p,t:t});

    stSave("undo",bf,(ACT[e.act]||e.act)+(e.msg?" · "+e.msg:""),e.id);return;
  }
});
