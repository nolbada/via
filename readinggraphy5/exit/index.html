 or rainfall.","코끼리는 먼 거리의 천둥이나 강우로부터 오는 저주파 진동을 감지하기 위해 그들의 발을 사용한다."],[7,"Guided by this natural ‘ground vibration radar,’ elephants can detect storms up to 100 kilometers away and anticipate rainfall even before it arrives.","이 자연적인 ‘지면 진동 레이더’의 안내를 받아, 코끼리는 최대 100킬로미터 떨어진 폭풍을 감지하고 비가 내리기도 전에 강우를 예측할 수 있다."],[8,"This early warning allows the herd to move toward water and increase ⓔ their chances of survival even in the harshest conditions.","이러한 조기 경보는 코끼리 무리가 물 쪽으로 이동하게 하고 가장 혹독한 환경에서조차도 그들의 생존 가능성을 높일 수 있게 한다."]],"w":"4번 use their feet to sense vibrations, 7번 anticipate rainfall, 8번 생존 가능성 증가. 코·귀·먹이는 본문에 근거 없음.","c":3}},{"n":10,"t":"fill","q":"Elephants lift one foot off the ground and [A] another deeper into the earth to [B] the source of a vibration.","h":"d930d5f017","ko":"코끼리는 한 발을 땅에서 들고 다른 발을 땅속 깊이 [A]하여 진동의 근원을 [B]한다.","bko":{"press":"누르다","pinpoint":"정확히 찾아내다","lift":"들어 올리다","enhance":"향상시키다","anticipate":"예측하다","survive":"살아남다"},"bank":["press","pinpoint","lift","enhance","anticipate","survive"],"r":{"a":"[A] press, [B] pinpoint","ev":"6번 문장","s":[[6,"To enhance ⓓ their senses and pinpoint the vibration’s source, elephants sometimes lift one foot off the ground and press another deeper into the earth.","그들의 감각을 향상시키고 진동의 근원을 정확히 찾아내기 위해, 코끼리는 때때로 한 발을 땅에서 들어 올려 다른 발을 땅속으로 더 깊숙이 누른다."]],"w":"6번 문장: press another deeper into the earth, pinpoint the vibration's source. lift는 앞에 이미 쓰였고 방향도 반대.","c":null}}]},{"u":4,"id":"r12","no":12,"ko":"낯선 이가 남기는 따뜻함 한 잔","items":[{"n":1,"t":"tf","q":"People who felt lucky or grateful would pay for an extra coffee.","h":"1deac7ed4d","ko":"운이 좋거나 감사함을 느낀 사람들은 커피를 한 잔 더 계산하곤 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When someone felt lucky or grateful, they would pay for an extra coffee at their local cafe.","누군가가 운이 좋거나 감사하다고 느낄 때, 그들은 지역 카페에서 커피 한 잔 값을 더 지불했다."]],"w":"6번 문장 When someone felt lucky or grateful, they would pay for an extra coffee.","c":"T"}},{"n":2,"t":"tf","q":"Suspended coffee is a tradition where people leave a paid coffee for a friend.","h":"1ecb81e2e3","ko":"유예된 커피는 사람들이 친구를 위해 값을 낸 커피를 남겨 두는 전통이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It’s a heartwarming tradition where people leave a paid coffee for a stranger.","그것은 사람들이 낯선 이에게 줄 커피를 미리 계산해 두는, 마음을 따뜻하게 하는 전통이다."]],"w":"3번 문장은 for a stranger(낯선 사람). friend로 바꾼 것이 오류.","c":"F"}},{"n":3,"t":"tf","q":"Today, only cafes follow the tradition of suspended coffee.","h":"38e4acf719","ko":"오늘날 카페만이 유예된 커피 전통을 따른다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Some restaurants now offer suspended meals, and bakeries do the same with bread.","일부 레스토랑들은 이제 서스펜디드 식사를 제공하고, 빵집들은 같은 방식으로 빵을 제공한다."]],"w":"10번 문장: restaurants가 suspended meals를, bakeries가 bread로 같은 일을 함. 카페만이 아님.","c":"F"}},{"n":4,"t":"vocab","q":"Choose the dictionary meaning of the underlined verb: \"someone who couldn't afford one.\"","h":"d37d86ddae","ko":"밑줄 친 동사 afford의 사전적 뜻은? (\"한 잔을 살 여유가 없는 사람\")","opts":["~을 거절하다","~을 빌리다","~을 기억하다","~할 여유가 있다, ~을 살 형편이 되다"],"word":"afford","r":{"a":"4) ~할 여유가 있다, ~을 살 형편이 되다","ev":"7번 문장","s":[[7,"This coffee was suspended, ready to be given to someone who couldn’t afford one.","이 커피는 유예된 상태로, 커피 한 잔을 살 여유가 없는 사람에게 주어질 준비가 되어 있었다."]],"w":"afford = ~을 지불할 여유가 있다. couldn't afford one = 한 잔 살 여유가 없는.","c":4}},{"n":5,"t":"vocab","q":"Choose the meaning of the underlined word in the sentence: \"people leave a paid coffee for a stranger.\"","h":"80fb96d7c8","ko":"밑줄 친 leave의 문맥상 뜻: \"사람들이 낯선 사람을 위해 값을 낸 커피를 ~한다\"","opts":["떠나다","남겨 두다","허락하다","잊다"],"word":"leave","r":{"a":"2) 남겨 두다","ev":"3번 문장","s":[[3,"It’s a heartwarming tradition where people leave a paid coffee for a stranger.","그것은 사람들이 낯선 이에게 줄 커피를 미리 계산해 두는, 마음을 따뜻하게 하는 전통이다."]],"w":"leave는 다의어(떠나다, 남겨 두다). 목적어가 a paid coffee이므로 '남겨 두다'.","c":2}},{"n":6,"t":"ref","q":"In sentence 7, \"one\" refers to","h":"b5285c6b88","ko":"7번 문장의 one이 가리키는 것은?","sko":"커피 한 잔을 살 여유가 없는 사람에게 주어질 준비가 되어 있는","opts":["커피 한 잔","낯선 사람","카페","빵"],"r":{"a":"1) 커피 한 잔","ev":"7번 문장","s":[[7,"This coffee was suspended, ready to be given to someone who couldn’t afford one.","이 커피는 유예된 상태로, 커피 한 잔을 살 여유가 없는 사람에게 주어질 준비가 되어 있었다."]],"w":"one은 앞에 나온 명사(coffee)를 대신하는 말. 커피 한 잔을 살 여유가 없는 사람이라는 뜻.","c":1}},{"n":7,"t":"sense","q":"What does \"yet\" in sentence 5 show?","h":"f479715510","ko":"5번 문장의 yet이 나타내는 관계는?","sko":"yet: 그렇지만, 그럼에도 (경제적 고난이 삶을 힘들게 했지만, 그들은 여전히 서로를 도울 방법을 찾았다)","opts":["어려움 때문에 서로 돕지 못했다","어려움이 사라진 뒤에 서로 돕기 시작했다","어려움이 있었지만 그럼에도 서로 도울 방법을 찾았다","어려움이 생긴 이유를 설명한다"],"r":{"a":"3) 어려움이 있었지만 그럼에도 서로 도울 방법을 찾았다","ev":"5번 문장","s":[[5,"Economic hardships made life difficult for many people in Naples, yet they still found ways to help one another.","경제적 고난이 나폴리의 많은 사람들의 삶을 힘들게 했지만, 그들은 여전히 서로를 도울 방법을 찾았다."]],"w":"yet = 그럼에도. 경제적 어려움(앞)과 서로 도울 방법을 찾음(뒤)이 역접으로 연결됨.","c":3}},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","h":"4ba9b657b3","ko":"본문과 일치하는 것은?","oko":["그 전통은 나폴리에만 머물러 있다.","나폴리 사람들은 삶이 힘들 때에도 서로를 도왔다.","커피는 값을 낸 사람이 직접 마셔야 했다.","그 전통은 제2차 세계대전 이후에 끝났다."],"opts":["The tradition has stayed only in Naples.","People in Naples helped one another even when life was hard.","The coffee had to be drunk by the person who paid for it.","The tradition ended after World War II."],"r":{"a":"2) People in Naples helped one another even when life was hard.","ev":"5번 문장","s":[[5,"Economic hardships made life difficult for many people in Naples, yet they still found ways to help one another.","경제적 고난이 나폴리의 많은 사람들의 삶을 힘들게 했지만, 그들은 여전히 서로를 도울 방법을 찾았다."]],"w":"5번 문장: Economic hardships ... yet they still found ways to help one another. ①은 11번(다른 도시·나라로 퍼짐), ③은 7번(여유 없는 사람에게 줌), ④는 9번(지금도 계속됨)과 반대.","c":2}},{"n":9,"t":"sum","q":"In suspended coffee, people pay for a coffee for a (A), and this tradition, which began in Naples, has (B) to other cities and countries.","h":"e2a65cb71e","ko":"유예된 커피는 사람들이 (A)을 위해 커피 값을 내는 것으로, 나폴리에서 시작해 다른 도시와 나라로 (B).","oko":["(A) 친구 / (B) 퍼졌다","(A) 낯선 사람 / (B) 멈췄다","(A) 가족 / (B) 사라졌다","(A) 카페 주인 / (B) 돌아왔다","(A) 낯선 사람 / (B) 퍼졌다"],"opts":["(A) friend / (B) spread","(A) stranger / (B) stopped","(A) family / (B) disappeared","(A) cafe owner / (B) returned","(A) stranger / (B) spread"],"r":{"a":"5) (A) stranger / (B) spread","ev":"3~4번, 11번 문장","s":[[3,"It’s a heartwarming tradition where people leave a paid coffee for a stranger.","그것은 사람들이 낯선 이에게 줄 커피를 미리 계산해 두는, 마음을 따뜻하게 하는 전통이다."],[4,"The tradition is believed to have started in early 20th-century Naples, Italy and gained popularity during World War II.","그 전통은 20세기 초 이탈리아 나폴리에서 시작되어 제2차 세계대전 동안 인기를 얻은 것으로 여겨진다."],[11,"This generous act has even spread to other cities and countries.","이 관대한 행동은 다른 도시와 나라로도 퍼졌다."]],"w":"3번 for a stranger, 4번 Naples에서 시작, 11번 has even spread to other cities and countries.","c":5}},{"n":10,"t":"fill","q":"The coffee is [A] until it is given to a person who cannot [B] one.","h":"becb111c3a","ko":"그 커피는 살 여유가 없는 사람에게 주어질 때까지 [A]되어 있다.","bko":{"suspended":"유예된, 보류된","afford":"(~할) 여유가 있다","spread":"퍼지다","continues":"계속된다","multiplies":"늘어난다","gentle":"상냥한"},"bank":["suspended","afford","spread","continues","multiplies","gentle"],"r":{"a":"[A] suspended, [B] afford","ev":"7번 문장","s":[[7,"This coffee was suspended, ready to be given to someone who couldn’t afford one.","이 커피는 유예된 상태로, 커피 한 잔을 살 여유가 없는 사람에게 주어질 준비가 되어 있었다."]],"w":"7번 문장: This coffee was suspended, ready to be given to someone who couldn't afford one. 나머지 보기는 문법·의미상 들어갈 수 없음.","c":null}}]},{"u":5,"id":"r13","no":13,"ko":"브라질의 유령 도로","items":[{"n":1,"t":"tf","q":"The BR-319 highway was built to connect remote areas of the Amazon to the rest of Brazil.","h":"4158014a2c","ko":"BR-319 고속도로는 아마존의 외딴 지역을 브라질의 나머지 지역과 연결하려고 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"The BR-319 highway, also known as the Road of Ghosts, is a 900-km-long road meant to connect remote areas of the Amazon to the rest of Brazil.","유령의 도로라고도 알려진 BR-319 고속도로는, 아마존의 외딴 지역을 브라질의 나머지 지역과 연결하도록 의도된 900km 길이의 도로이다."]],"w":"1번 문장에 meant to connect remote areas of the Amazon to the rest of Brazil이 나옴. 본문과 일치.","c":"T"}},{"n":2,"t":"tf","q":"The BR-319 was completed in the 1980s.","h":"ebe0c7bd5c","ko":"BR-319는 1980년대에 완공되었다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"When construction was completed in the 1970s, it attracted many people with the promise of cheap farmland and economic opportunities.","1970년대에 건설이 완료되었을 때, 그것은 저렴한 농지와 경제적 기회라는 약속과 함께 많은 사람들을 불러들였다."]],"w":"2번 문장에 completed in the 1970s로 나옴. 1980년대가 아니라 1970년대.","c":"F"}},{"n":3,"t":"tf","q":"Critics fear that a new road will expose the land to more deforestation and illegal activities.","h":"b8e39c265c","ko":"비판자들은 새 도로가 땅을 더 많은 삼림 벌채와 불법 활동에 노출시킬까 봐 두려워한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"(C) They fear that a new road will expose the land to more deforestation and illegal activities, threatening the rainforest and local communities.","(C) 그들은 새로운 도로가 토지를 더 많은 삼림 벌채와 불법 활동들에 노출시켜서, 열대우림과 지역 사회를 위협할 것이라고 우려한다."]],"w":"10번 문장에 They(=Critics) fear that a new road will expose the land to more deforestation and illegal activities가 나옴. 본문과 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Choose the meaning of the underlined word 'faulty' as used in the passage.","h":"063ca9f2e7","ko":"본문에 쓰인 밑줄 친 faulty의 뜻을 고르시오.","opts":["믿을 수 있는","결함이 있는","값싼","고립된"],"word":"faulty","r":{"a":"2) 결함이 있는","ev":"4번 문장","s":[[4,"Faulty construction and lack of maintenance caused the road to break down quickly.","부실 공사와 유지 보수의 부족은 도로를 빠르게 무너지게 했다."]],"w":"4번 문장 Faulty construction은 '결함이 있는 건설'. 이 때문에 도로가 빨리 망가졌다는 흐름.","c":2}},{"n":5,"t":"vocab","q":"Choose the meaning of the underlined word 'isolated' as used in the passage.","h":"06bcb692ea","ko":"본문에 쓰인 밑줄 친 isolated의 뜻을 고르시오.","opts":["값싼","방치된","고립된","불법적인"],"word":"isolated","r":{"a":"3) 고립된","ev":"6번 문장","s":[[6,"Eventually, the road became nearly unusable, leaving small towns along the route isolated and neglected.","결국, 그 도로는 거의 사용할 수 없게 되었고, 그 결과 그 길을 따라 위치한 작은 마을들은 고립되고 방치되었다."]],"w":"6번 문장 small towns ... isolated and neglected는 '고립되고 방치된'. isolated는 remote(외딴)와 비슷한 뜻. 바로 옆의 neglected(방치된)와 구별.","c":3}},{"n":6,"t":"ref","q":"What does the underlined 'this' refer to?","h":"3b414b1aa3","ko":"밑줄 친 this가 가리키는 것은?","opts":["도로가 1970년대에 완공된 일","폭우로 도로가 손상된 일","도로가 고립된 마을을 만든 일","정부가 BR-319를 재건하려는 계획"],"r":{"a":"4) 정부가 BR-319를 재건하려는 계획","ev":"7번 문장","s":[[7,"Today, Brazil’s government plans to rebuild the BR-319, and this has started a big debate.","오늘날, 브라질 정부는 BR-319를 재건할 계획이며, 이것은 큰 논쟁을 일으켰다."]],"w":"7번 문장에서 this는 바로 앞의 '브라질 정부가 BR-319를 재건하려 계획한다'는 내용을 가리킴. 그 결과 big debate가 시작됨.","c":4}},{"n":7,"t":"sense","q":"Which is the closest in meaning to the underlined part of sentence 6? '...leaving small towns along the route isolated and neglected.'","h":"4564382737","ko":"6번 문장의 밑줄 친 부분(leaving small towns along the route isolated and neglected)과 의미가 가장 가까운 것은?","sko":"그 결과 그 길을 따라 위치한 작은 마을들은 고립되고 방치되었다.","opts":["도로가 거의 쓸 수 없게 된 결과, 도로 주변의 작은 마을들이 고립되고 방치되었다","작은 마을들이 떠나서 도로가 쓰이지 않게 되었다","도로 옆 마을 사람들이 도로를 방치하였다","도로를 따라 작은 마을들이 새로 생겨났다"],"r":{"a":"1) 도로가 거의 쓸 수 없게 된 결과, 도로 주변의 작은 마을들이 고립되고 방치되었다","ev":"6번 문장","s":[[6,"Eventually, the road became nearly unusable, leaving small towns along the route isolated and neglected.","결국, 그 도로는 거의 사용할 수 없게 되었고, 그 결과 그 길을 따라 위치한 작은 마을들은 고립되고 방치되었다."]],"w":"콤마 뒤 leaving 이하는 앞 절(도로가 거의 사용 불가)의 결과. 즉 도로가 못 쓰이게 되어 그 길가의 마을들이 고립·방치됨. 원인과 결과를 뒤집은 선지에 주의.","c":1}},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","h":"830d3081b7","ko":"본문의 내용과 일치하는 것은?","oko":["빠르게 자라는 식물들은 도로를 좋은 상태로 유지하는 데 도움이 되었다.","지지자들은 새 도로가 열대우림에 해를 끼칠까 봐 걱정한다.","부실 공사와 유지 보수의 부족이 도로를 빠르게 무너지게 했다.","모든 사람이 도로를 재건하는 것이 좋은 생각이라는 데 동의한다."],"opts":["Fast-growing plants helped keep the road in good condition.","Supporters worry that a new road will harm the rainforest.","Faulty construction and lack of maintenance made the road break down quickly.","Everyone agrees that rebuilding the road is a good idea."],"r":{"a":"3) Faulty construction and lack of maintenance made the road break down quickly.","ev":"4번 문장","s":[[4,"Faulty construction and lack of maintenance caused the road to break down quickly.","부실 공사와 유지 보수의 부족은 도로를 빠르게 무너지게 했다."]],"w":"4번 문장: Faulty construction and lack of maintenance caused the road to break down quickly. 정답 ③. ① 5번 문장에서 식물은 손상을 악화시킴. ② 우려는 지지자가 아니라 비판자(10번). ④ 7번에서 재건은 큰 논쟁을 일으킴.","c":3}},{"n":9,"t":"sum","q":"The BR-319 was first seen as a road of (A), but after it fell into poor condition, plans to rebuild it have started a (B) over its future.","h":"761571bc30","ko":"BR-319는 처음에는 (A)의 길로 여겨졌지만, 도로 상태가 나빠진 뒤 재건 계획이 그 미래를 둘러싼 (B)을 일으켰다.","oko":["(A) 고립 / (B) 합의","(A) 위험 / (B) 논쟁","(A) 기회 / (B) 합의","(A) 기회 / (B) 논쟁","(A) 위험 / (B) 합의"],"opts":["(A) isolation / (B) agreement","(A) danger / (B) debate","(A) opportunity / (B) agreement","(A) opportunity / (B) debate","(A) danger / (B) agreement"],"r":{"a":"4) (A) opportunity / (B) debate","ev":"2번, 7번 문장","s":[[2,"When construction was completed in the 1970s, it attracted many people with the promise of cheap farmland and economic opportunities.","1970년대에 건설이 완료되었을 때, 그것은 저렴한 농지와 경제적 기회라는 약속과 함께 많은 사람들을 불러들였다."],[7,"Today, Brazil’s government plans to rebuild the BR-319, and this has started a big debate.","오늘날, 브라질 정부는 BR-319를 재건할 계획이며, 이것은 큰 논쟁을 일으켰다."]],"w":"2번 문장: 완공 때 cheap farmland and economic opportunities를 약속해 사람들을 끌어들임 → (A) opportunity. 7번 문장: 재건 계획이 a big debate를 시작 → (B) debate.","c":4}},{"n":10,"t":"fill","q":"Supporters say the new road will [A] regional connections, but critics fear it will [B] the land to more deforestation and illegal activities.","h":"ec2417435a","ko":"지지자들은 새 도로가 지역 간 연결을 [A]할 것이라 하지만, 비판자들은 그것이 땅을 더 많은 삼림 벌채와 불법 활동에 [B]시킬까 봐 두려워한다.","bko":{"expose":"노출시키다","improve":"개선하다","argue":"주장하다","worry":"걱정하다","uncertain":"불확실한","isolated":"고립된"},"bank":["expose","improve","argue","worry","uncertain","isolated"],"r":{"a":"[A] improve, [B] expose","ev":"9~10번 문장","s":[[9,"(B) Supporters argue that it will bring growth to nearby villages, improve regional connections, and even boost the national economy.","(B) 지지자들은 그것이 인근의 지역 마을들을 발전시키고, 지역 간 연결을 개선하며, 심지어 국가 경제를 신장시킬 것이라고 주장한다."],[10,"(C) They fear that a new road will expose the land to more deforestation and illegal activities, threatening the rainforest and local communities.","(C) 그들은 새로운 도로가 토지를 더 많은 삼림 벌채와 불법 활동들에 노출시켜서, 열대우림과 지역 사회를 위협할 것이라고 우려한다."]],"w":"9번 문장: improve regional connections (지역 간 연결 개선). 10번 문장: expose the land to more deforestation (땅을 노출시킴). expose A to B = A를 B에 노출시키다.","c":null}}]},{"u":5,"id":"r14","no":14,"ko":"바누아투만의 특별한 장소","items":[{"n":1,"t":"tf","q":"Visitors dive 3 meters down to reach the Underwater Post Office.","h":"c6184cb66e","ko":"방문객들은 수중 우체국에 가기 위해 3미터 아래로 잠수한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"(B) Then, dive 3 meters down to reach the Underwater Post Office.","(B) 그런 다음, 3미터 아래로 잠수하여 수중 우체국에 도착하세요."]],"w":"6번 문장에 Then, dive 3 meters down to reach the Underwater Post Office가 나옴. 본문과 일치.","c":"T"}},{"n":2,"t":"tf","q":"The staff stamp postcards with a mark that washes away in water.","h":"79de67b9d2","ko":"직원들은 물에 씻겨 나가는 표식을 엽서에 찍는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"(A) There, the underwater postal staff will stamp your postcard with a special engraved mark, which won’t wash away in water, and send it on its way.","(A) 그곳에서, 수중 우체국 직원은 물에 씻겨 나가지 않는 특별하게 새겨진 도장을 여러분의 엽서에 찍어 그것을 발송할 것입니다."]],"w":"5번 문장에 a special engraved mark, which won't wash away in water로 나옴. 씻겨 나가지 않는 표식이라 반대.","c":"F"}},{"n":3,"t":"tf","q":"Visitors can also swim with colorful tropical fish near the post office.","h":"0f1da780b3","ko":"방문객들은 우체국 근처에서 알록달록한 열대어와 함께 수영할 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"While there, you can also explore vibrant coral gardens and swim with colorful tropical fish.","그곳에 있는 동안, 여러분은 또한 생기 넘치는 산호 정원을 탐험하고 다채로운 열대어와 함께 수영할 수 있습니다."]],"w":"9번 문장에 you can also explore vibrant coral gardens and swim with colorful tropical fish가 나옴. 본문과 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Choose the meaning of the underlined word 'waterproof' as used in the passage.","h":"ea68018e73","ko":"본문에 쓰인 밑줄 친 waterproof의 뜻을 고르시오.","opts":["값비싼","활기찬","새겨진","방수의"],"word":"waterproof","r":{"a":"4) 방수의","ev":"4번 문장","s":[[4,"Purchase waterproof postcards at the Hideaway Island Resort gift shop, and write your message using waterproof markers or pens.","Hideaway 섬 리조트의 선물 가게에서 방수 엽서를 구매하고, 방수 마커나 펜을 사용하여 여러분의 메시지를 작성하세요."]],"w":"4번 문장 waterproof postcards는 '방수 엽서'. 물속에서 쓰기 위한 엽서라는 흐름. 활기찬(vibrant), 새겨진(engraved)은 다른 단어의 뜻.","c":4}},{"n":5,"t":"vocab","q":"Choose the meaning of the underlined word 'stamp' as used in the passage.","h":"abfad10623","ko":"본문에 쓰인 밑줄 친 stamp의 문맥상 뜻을 고르시오.","opts":["우표","도장을 찍다","발로 쾅쾅 밟다","포장하다"],"word":"stamp","r":{"a":"2) 도장을 찍다","ev":"5번 문장","s":[[5,"(A) There, the underwater postal staff will stamp your postcard with a special engraved mark, which won’t wash away in water, and send it on its way.","(A) 그곳에서, 수중 우체국 직원은 물에 씻겨 나가지 않는 특별하게 새겨진 도장을 여러분의 엽서에 찍어 그것을 발송할 것입니다."]],"w":"5번 문장 the staff will stamp your postcard with a special engraved mark에서 stamp는 동사. 엽서에 표식을 '도장 찍다'. 명사 '우표' 뜻과 혼동 주의.","c":2}},{"n":6,"t":"ref","q":"What does the underlined 'it' refer to?","h":"ff815538d3","ko":"밑줄 친 it이 가리키는 것은?","opts":["바누아투의 수중 우체국","태평양","선물 가게","수중 우체국 직원들"],"r":{"a":"1) 바누아투의 수중 우체국","ev":"3번 문장","s":[[3,"Since 2003, it has welcomed nearly 100,000 visitors annually and has earned a reputation as a must-visit destination!","2003년부터, 그곳은 매년 거의 10만 명의 방문객을 맞이하며 꼭 가 봐야 할 여행지로 명성을 얻어왔습니다!"]],"w":"3번 문장 it은 2번 문장에서 소개한 Vanuatu's Underwater Post Office. 2003년부터 매년 약 10만 명을 맞이한 주체이고 must-visit destination이라는 평판을 얻음.","c":1}},{"n":7,"t":"sense","q":"Which is the closest in meaning to sentence 10? 'Thanks to Vanuatu's Marine Park laws, the area is well protected...'","h":"af81c29c18","ko":"10번 문장(Thanks to Vanuatu's Marine Park laws, the area is well protected)과 의미가 가장 가까운 것은?","sko":"바누아투의 해양 공원법 덕분에, 이 지역은 잘 보호되어 있다.","opts":["법 때문에 방문객이 줄었다","야생 동물이 많아서 법이 생겼다","바누아투의 해양 공원 법 덕분에 그 지역이 잘 보호된다","그 지역이 보호되지 않아 환경이 파괴되고 있다"],"r":{"a":"3) 바누아투의 해양 공원 법 덕분에 그 지역이 잘 보호된다","ev":"10번 문장","s":[[10,"Thanks to Vanuatu’s Marine Park laws, the area is well protected, thereby preserving its stunning environment and wildlife for everyone to enjoy.","바누아투의 해양 공원법 덕분에, 이 지역은 잘 보호되어 있으며, 그 결과 모두가 즐길 수 있도록 눈부시게 아름다운 환경과 야생동물을 보존하고 있습니다."]],"w":"Thanks to ~는 '~ 덕분에'. 해양 공원 법이 원인, 지역이 잘 보호됨이 결과. 원인과 결과를 뒤집은 ②에 주의.","c":3}},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","h":"c08c87718c","ko":"본문의 내용과 일치하는 것은?","oko":["그곳은 2003년 이래로 매년 거의 10만 명의 방문객을 맞이해 왔다.","그곳은 2013년에 문을 열었고 매년 약 1만 명의 방문객을 맞이한다.","엽서는 방문객이 섬을 떠난 뒤에야 보낼 수 있다.","그곳은 어떤 섬에서도 멀리 떨어진 태평양 한가운데에 서 있다."],"opts":["It has welcomed nearly 100,000 visitors every year since 2003.","It opened in 2013 and welcomes about 10,000 visitors a year.","Postcards can be sent only after visitors leave the island.","It stands in the middle of the Pacific, far from any island."],"r":{"a":"1) It has welcomed nearly 100,000 visitors every year since 2003.","ev":"3번 문장","s":[[3,"Since 2003, it has welcomed nearly 100,000 visitors annually and has earned a reputation as a must-visit destination!","2003년부터, 그곳은 매년 거의 10만 명의 방문객을 맞이하며 꼭 가 봐야 할 여행지로 명성을 얻어왔습니다!"]],"w":"3번 문장: Since 2003, it has welcomed nearly 100,000 visitors annually. 정답 ①. ② 2003년 개장, 연간 약 10만 명. ③ 우체국에서 엽서를 보냄. ④ Hideaway 섬 해안 바로 앞.","c":1}},{"n":9,"t":"sum","q":"Vanuatu's Underwater Post Office offers visitors a (A) experience of sending postcards beneath the sea, and its surroundings are (B) by the Marine Park laws.","h":"0748cd8f40","ko":"바누아투의 수중 우체국은 방문객에게 바다 밑에서 엽서를 보내는 (A) 경험을 주며, 그 주변은 해양 공원 법으로 (B).","oko":["(A) 지루한 / (B) 파괴된다","(A) 위험한 / (B) 보호된다","(A) 지루한 / (B) 보호된다","(A) 독특한 / (B) 파괴된다","(A) 독특한 / (B) 보호된다"],"opts":["(A) boring / (B) destroyed","(A) dangerous / (B) protected","(A) boring / (B) protected","(A) unique / (B) destroyed","(A) unique / (B) protected"],"r":{"a":"5) (A) unique / (B) protected","ev":"1번, 10번 문장","s":[[1,"Ready for a one-of-a-kind adventure?","특별한 모험을 할 준비가 되었나요?"],[10,"Thanks to Vanuatu’s Marine Park laws, the area is well protected, thereby preserving its stunning environment and wildlife for everyone to enjoy.","바누아투의 해양 공원법 덕분에, 이 지역은 잘 보호되어 있으며, 그 결과 모두가 즐길 수 있도록 눈부시게 아름다운 환경과 야생동물을 보존하고 있습니다."]],"w":"1번 문장 one-of-a-kind adventure → (A) unique. 10번 문장 the area is well protected → (B) protected.","c":5}},{"n":10,"t":"fill","q":"At the Underwater Post Office, the staff [A] your postcard with an engraved mark, and you can explore [B] coral gardens.","h":"5879bf4b1e","ko":"수중 우체국에서 직원은 새겨진 표식을 당신의 엽서에 [A]하고, 당신은 [B] 산호 정원을 둘러볼 수 있다.","bko":{"vibrant":"생기 넘치는","stamp":"도장을 찍다","waterproof":"방수의","destination":"여행지","annually":"매년","beneath":"~의 아래에"},"bank":["vibrant","stamp","waterproof","destination","annually","beneath"],"r":{"a":"[A] stamp, [B] vibrant","ev":"5번, 9번 문장","s":[[5,"(A) There, the underwater postal staff will stamp your postcard with a special engraved mark, which won’t wash away in water, and send it on its way.","(A) 그곳에서, 수중 우체국 직원은 물에 씻겨 나가지 않는 특별하게 새겨진 도장을 여러분의 엽서에 찍어 그것을 발송할 것입니다."],[9,"While there, you can also explore vibrant coral gardens and swim with colorful tropical fish.","그곳에 있는 동안, 여러분은 또한 생기 넘치는 산호 정원을 탐험하고 다채로운 열대어와 함께 수영할 수 있습니다."]],"w":"5번 문장: the staff will stamp your postcard (도장을 찍다, 동사 자리). 9번 문장: explore vibrant coral gardens (활기찬, 명사를 꾸미는 형용사 자리).","c":null}}]},{"u":5,"id":"r15","no":15,"ko":"꽥꽥! 접근 금지!","items":[{"n":1,"t":"tf","q":"The geese at the Sao Pedro prison patrol the area between the fences and the outer walls.","h":"be3a0673d8","ko":"Sao Pedro 교도소의 거위들은 울타리와 바깥 벽 사이 구역을 순찰한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"These “geese guards” patrol the area between the prison’s fences and outer walls.","이 ‘거위 경비원들’은 교도소의 울타리와 외벽 사이의 지역을 순찰한다."]],"w":"4번 문장에 patrol the area between the prison's fences and outer walls가 나옴. 본문과 일치.","c":"T"}},{"n":2,"t":"tf","q":"China used 5,000 geese to guard the Vietnam border during the COVID-19 pandemic.","h":"1c7630bda1","ko":"중국은 코로나19 대유행 동안 베트남 국경을 지키는 데 거위 5,000마리를 썼다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"During the COVID-19 pandemic, China used 500 geese to guard the Vietnam border.","코로나19 대유행 동안, 중국은 베트남 국경을 지키기 위해 500마리의 거위를 이용했다."]],"w":"13번 문장에 China used 500 geese로 나옴. 5,000마리가 아니라 500마리.","c":"F"}},{"n":3,"t":"tf","q":"Geese hiss and honk aggressively when something seems unusual.","h":"5ed6856019","ko":"거위들은 뭔가 평소와 다르게 보이면 쉬익 소리를 내고 공격적으로 꽥꽥 운다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"If something seems unusual, they hiss and honk aggressively.","무언가 이상해 보이면, 그들은 공격적으로 쉬익 하는 소리를 내고 꽥꽥 울어댄다."]],"w":"9번 문장에 If something seems unusual, they hiss and honk aggressively가 나옴. 본문과 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Choose the meaning of the underlined word 'patrol' as used in the passage.","h":"95e187d055","ko":"본문에 쓰인 밑줄 친 patrol의 뜻을 고르시오.","opts":["도망치다","방어하다","순찰하다","훈련하다"],"word":"patrol","r":{"a":"3) 순찰하다","ev":"4번 문장","s":[[4,"These “geese guards” patrol the area between the prison’s fences and outer walls.","이 ‘거위 경비원들’은 교도소의 울타리와 외벽 사이의 지역을 순찰한다."]],"w":"4번 문장 geese guards patrol the area는 '그 구역을 순찰한다'. 울타리와 바깥 벽 사이를 돌며 지키는 일. 방어하다(defend)는 11번 문장의 다른 단어.","c":3}},{"n":5,"t":"vocab","q":"Choose the meaning of the underlined word in this sentence: \"Their job is to alert guards if someone tries to escape.\"","h":"7e930a0334","ko":"밑줄 친 alert의 뜻은? (\"그들의 일은 누군가 탈출하려 하면 경비원에게 알리는 것이다\")","opts":["경계하는","탈출하다","지키다","~에게 경고하다"],"word":"alert","r":{"a":"4) ~에게 경고하다","ev":"5번 문장","s":[[5,"Their job is to alert guards if someone tries to escape.","그들의 임무는 누구가 탈출하려고 하면 교도관에게 알리는 것이다."]],"w":"5번 문장 Their job is to alert guards는 동사로 '경비원들에게 알리다, 경고하다'. 8번 문장의 on high alert에서는 명사(경계 태세)로 쓰여 뜻이 다름.","c":4}},{"n":6,"t":"ref","q":"What does the underlined 'Their' refer to?","h":"90da8d4e31","ko":"밑줄 친 Their가 가리키는 것은?","opts":["중국 사람들","500마리의 거위","베트남 경비원들","코로나19 바이러스"],"r":{"a":"2) 500마리의 거위","ev":"13~14번 문장","s":[[13,"During the COVID-19 pandemic, China used 500 geese to guard the Vietnam border.","코로나19 대유행 동안, 중국은 베트남 국경을 지키기 위해 500마리의 거위를 이용했다."],[14,"Their job was to stop people from crossing borders to prevent the virus from spreading.","그들의 임무는 바이러스가 확산하는 것을 방지하기 위해 사람들이 국경을 넘는 것을 막는 것이었다."]],"w":"14번 문장 Their는 바로 앞 13번 문장의 500 geese. 거위의 임무가 사람들이 국경을 넘지 못하게 막는 것이었다는 내용.","c":2}},{"n":7,"t":"sense","q":"Which is the closest in meaning to the underlined part of sentence 17? '...these honking birds prove they're more than just farm animals.'","h":"f15c82d1f2","ko":"17번 문장의 밑줄 친 부분(these honking birds prove they're more than just farm animals)과 의미가 가장 가까운 것은?","sko":"이 꽥꽥거리는 새들은 그들이 단순한 농장 동물 그 이상임을 증명한다.","opts":["거위는 농장에서만 쓸모가 있다","거위는 가축 중에서 가장 큰 동물이다","거위는 단순한 농장 동물을 넘어 경비 역할도 해낸다","거위는 키우기 어려워 경비에 쓸 수 없다"],"r":{"a":"3) 거위는 단순한 농장 동물을 넘어 경비 역할도 해낸다","ev":"17~18번 문장","s":[[17,"From prisons to borders and whisky warehouses, these honking birds prove they’re more than just farm animals.","교도소부터 국경, 그리고 위스키 창고까지, 이 꽥꽥거리는 새들은 그들이 단순한 농장 동물 그 이상임을 증명한다."],[18,"They’re clever, loud, and surprisingly reliable security guards!","그들은 영리하고, 시끄러우며, 놀랍도록 믿을 만한 보안 경비원이다!"]],"w":"more than just ~는 '단지 ~ 이상의'. 거위가 교도소·국경·창고를 지켜 온 사례로 단순한 농장 동물 이상임을 보여준다는 뜻. 18번에서 믿을 만한 경비원이라고 정리.","c":3}},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","h":"fbc91026a7","ko":"본문의 내용과 일치하는 것은?","oko":["거위를 경비원으로 이용하는 것은 새로운 생각이다.","교도소의 거위들은 이상한 일이 생겨도 조용히 있다.","스코틀랜드에서는 수백만 파운드의 가치가 있는 위스키 창고를 지키는 데 거위가 쓰였다.","거위 경비원들은 교도소 외벽 바깥 지역을 순찰한다."],"opts":["Using geese as guards is a new idea.","The geese at the prison stay quiet when something unusual happens.","In Scotland, geese were used to protect whisky warehouses worth millions of pounds.","The geese guards patrol the area outside the prison's outer walls."],"r":{"a":"3) In Scotland, geese were used to protect whisky warehouses worth millions of pounds.","ev":"15~16번 문장","s":[[15,"In Scotland, geese were also used to protect whisky warehouses.","스코틀랜드에서는, 거위가 또한 위스키 창고를 보호하는 데 쓰였다."],[16,"For over 60 years, the “Scotch Watch” guarded 56,656 square meters of warehouses, which were worth millions of pounds.","60년 이상 동안, ‘스카치 경비대’는 56,656제곱미터의 창고들을 지켰으며, 그곳들은 수백만 파운드의 가치가 있었다."]],"w":"15번 문장: In Scotland, geese were also used to protect whisky warehouses. 16번 문장: warehouses, which were worth millions of pounds. 정답 ③. ① 12번에서 새로운 생각이 아니라고 함. ② 9번에서 쉬익·꽥꽥 소리를 냄. ④ 4번은 울타리와 바깥 벽 사이.","c":3}},{"n":9,"t":"sum","q":"Geese are (A) and fearless, so they work as (B) guards in places such as prisons, borders, and warehouses.","h":"28fe953485","ko":"거위는 (A)고 두려움을 모르기 때문에 교도소, 국경, 창고 같은 곳에서 (B) 경비원으로 일한다.","oko":["(A) 시끄러운 / (B) 믿을 만한","(A) 시끄러운 / (B) 게으른","(A) 조용한 / (B) 믿을 만한","(A) 조용한 / (B) 게으른","(A) 약한 / (B) 믿을 만한"],"opts":["(A) loud / (B) reliable","(A) loud / (B) lazy","(A) quiet / (B) reliable","(A) quiet / (B) lazy","(A) weak / (B) reliable"],"r":{"a":"1) (A) loud / (B) reliable","ev":"8번, 17~18번 문장","s":[[8,"They’re loud, fearless, and always on high alert.","그들은 시끄럽고, 두려움이 없으며, 항상 높은 경계 태세이다."],[17,"From prisons to borders and whisky warehouses, these honking birds prove they’re more than just farm animals.","교도소부터 국경, 그리고 위스키 창고까지, 이 꽥꽥거리는 새들은 그들이 단순한 농장 동물 그 이상임을 증명한다."],[18,"They’re clever, loud, and surprisingly reliable security guards!","그들은 영리하고, 시끄러우며, 놀랍도록 믿을 만한 보안 경비원이다!"]],"w":"8번 문장: They're loud, fearless → (A) loud. 18번 문장: surprisingly reliable security guards → (B) reliable. 거위는 시끄럽다고 했으므로 quiet은 반대.","c":1}},{"n":10,"t":"fill","q":"At the Sao Pedro prison, geese [A] the guards when someone tries to [B].","h":"5f800a22af","ko":"Sao Pedro 교도소에서 거위들은 누군가 [B]하려 하면 경비원들에게 [A]한다.","bko":{"alert":"경고하다, 알리다","escape":"탈출하다","patrol":"순찰하다","defend":"방어하다","honk":"꽥꽥 울다","hiss":"쉬익 소리를 내다"},"bank":["alert","escape","patrol","defend","honk","hiss"],"r":{"a":"[A] alert, [B] escape","ev":"5번 문장","s":[[5,"Their job is to alert guards if someone tries to escape.","그들의 임무는 누구가 탈출하려고 하면 교도관에게 알리는 것이다."]],"w":"5번 문장: Their job is to alert guards if someone tries to escape. alert A = A에게 경고하다, try to escape = 탈출하려 하다.","c":null}}]},{"u":6,"id":"r16","no":16,"ko":"우주 미션 중에 이런 일이!","items":[{"n":1,"t":"tf","q":"The Soviet Union collapsed while Krikalev was on his space mission.","h":"9e90a574be","ko":"소련은 Krikalev가 우주 임무를 수행하는 동안 붕괴되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, during his mission, the Soviet Union collapsed, and everything changed.","그러나, 그의 임무 중 소련이 붕괴되었고, 모든 것이 바뀌었다."]],"w":"3번 문장에 during his mission, the Soviet Union collapsed 라고 나옴. 임무 중 소련 붕괴는 사실.","c":"T"}},{"n":2,"t":"tf","q":"Krikalev returned to Earth earlier than planned.","h":"a6907c3f3b","ko":"Krikalev는 계획보다 일찍 지구로 돌아왔다.","r":{"a":"F (본문과 다른 내용)","ev":"1번, 10번 문장","s":[[1,"In 1991, Sergei Krikalev, a Soviet astronaut, left Earth for a five-month mission on the Mir space station.","1991년, 소련의 우주비행사 Sergei Krikalev는 미르 우주 정거장에서의 5개월간의 임무를 위해 지구를 떠났다."],[10,"After 311 days in space — more than twice the planned time — Krikalev finally returned to Earth.","계획된 시간의 두 배가 넘는 311일을 우주에서 보낸 후, Krikalev는 마침내 지구로 돌아왔다."]],"w":"원래 계획은 five-month(1번)였고 실제로는 311일 뒤에 돌아옴(10번). 일찍이 아니라 계획의 두 배 넘게 늦게 돌아옴.","c":"F"}},{"n":3,"t":"tf","q":"Krikalev chose to stay because no one else could take care of the station.","h":"6b480e54a5","ko":"Krikalev는 정거장을 돌볼 다른 사람이 없어서 남기로 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6~7번 문장","s":[[6,"Krikalev had the option to return using an escape capsule, but with no one else to maintain the station, it could have suffered serious damage.","Krikalev는 탈출 캡슐을 사용하여 돌아올 선택지가 있었지만, 그 정거장을 유지 관리할 다른 사람 없이는, 그것은 심각한 손상을 입을 수도 있었다."],[7,"So he decided to remain.","그래서 그는 남기로 결정했다."]],"w":"6번 문장에 no one else to maintain the station, 7번 문장에 So he decided to remain 이 나옴. 관리할 사람이 없어서 남기로 한 것이므로 사실.","c":"T"}},{"n":4,"t":"vocab","q":"His job was to conduct experiments and maintain the station.","h":"86033ae101","ko":"그의 임무는 실험을 수행하고 정거장을 유지·관리하는 것이었다.","opts":["취소하다","수행하다, 실시하다","설명하다","방문하다"],"word":"conduct","r":{"a":"2) 수행하다, 실시하다","ev":"2번 문장","s":[[2,"His job was to conduct experiments and maintain the station.","그의 임무는 실험을 수행하고 정거장을 유지 관리하는 것이었다."]],"w":"conduct experiments = 실험을 수행하다[실시하다]. 임무 내용을 말하는 문장이라 수행하다가 알맞음.","c":2}},{"n":5,"t":"vocab","q":"a highly respected figure in the history of space exploration","h":"433c0c3c5c","ko":"우주 탐사 역사에서 매우 존경받는 (   )","opts":["숫자","모양","인물","그림"],"word":"figure","r":{"a":"3) 인물","ev":"12번 문장","s":[[12,"Krikalev’s commitment and courage during such a difficult time have made him a highly respected figure in the history of space exploration.","그런 어려운 시기 동안의 Krikalev의 헌신과 용기는 우주 탐험의 역사에서 그를 매우 존경받는 인물로 만들었다."]],"w":"figure는 숫자·모양 등 여러 뜻이 있지만 여기서는 respected figure = 존경받는 인물. 사람을 꾸미는 말이라 인물.","c":3}},{"n":6,"t":"ref","q":"What does “it” refer to? — “Krikalev had the option to return using an escape capsule, but with no one else to maintain the station, it could have suffered serious damage.”","h":"4cc8ad49dc","ko":"“it”이 가리키는 것은? — 크리칼레프는 탈출 캡슐로 돌아올 수 있었지만, 정거장을 관리할 사람이 없어 그것이 심각한 손상을 입을 수도 있었다","sko":"Krikalev는 탈출 캡슐을 사용하여 돌아올 선택지가 있었지만, 그 정거장을 유지 관리할 다른 사람 없이는, 그것은 심각한 손상을 입을 수도 있었다.","opts":["the escape capsule","the Soviet Union","Krikalev’s health","the station"],"r":{"a":"4) the station","ev":"6번 문장","s":[[6,"Krikalev had the option to return using an escape capsule, but with no one else to maintain the station, it could have suffered serious damage.","Krikalev는 탈출 캡슐을 사용하여 돌아올 선택지가 있었지만, 그 정거장을 유지 관리할 다른 사람 없이는, 그것은 심각한 손상을 입을 수도 있었다."]],"w":"바로 앞에 maintain the station 이 있고 damage를 입는 대상이 정거장이므로 it = the station.","c":4}},{"n":7,"t":"sense","q":"[5번 문장] “… the answer was always, ‘You’ll have to wait a bit longer.’”","h":"abe41612ce","ko":"[5번 문장] 대답은 늘 “조금 더 기다려야 합니다”였다. 이 문장이 보여 주는 상황은?","sko":"대답은 항상 “당신은 조금 더 기다려야 할 것이다.”였다.","opts":["귀환이 계속 미뤄지기만 했다","곧 돌아올 수 있다는 확답을 받았다","기다리는 것을 포기하고 스스로 떠났다","달마다 새로운 임무를 받았다"],"r":{"a":"1) 귀환이 계속 미뤄지기만 했다","ev":"5번 문장","s":[[5,"Month after month, he waited for news, but the answer was always, “You’ll have to wait a bit longer.”","몇 달이 지나도록 그는 소식을 기다렸지만, 대답은 항상 “당신은 조금 더 기다려야 할 것이다.”였다."]],"w":"Month after month 동안 소식을 기다렸지만 늘 더 기다리라는 답만 들었으므로, 귀환 일정이 계속 미뤄진 상황.","c":1}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"8e4ee5d371","ko":"본문 내용과 일치하는 것은?","oko":["Krikalev의 임무는 311일 동안 계속되도록 계획되었다.","Krikalev는 집에 돌아오기 위해 탈출 캡슐을 사용했다.","Krikalev는 더 이상 존재하지 않는 나라로 돌아왔다.","Krikalev의 건강은 우주에 있는 동안 좋아졌다."],"opts":["Krikalev’s mission was planned to last 311 days.","Krikalev used an escape capsule to come home.","Krikalev returned to a country that no longer existed.","Krikalev’s health improved during his time in space."],"r":{"a":"3) Krikalev returned to a country that no longer existed.","ev":"11번 문장","s":[[11,"By then, his country no longer existed, and his salary in rubles had lost much of its value.","그 무렵, 그의 조국은 더 이상 존재하지 않았고, 그의 루블 급여는 가치를 많이 잃었다."]],"w":"11번 문장에 By then, his country no longer existed 가 나옴. 311일은 실제 기간(계획은 5개월), 캡슐은 쓰지 않았고(6~7번), 건강은 나빠짐(8번).","c":3}},{"n":9,"t":"sum","q":"Krikalev’s space mission became much (A) than planned after his country collapsed, but his (B) to duty made him a respected figure.","h":"5d5882d5d6","ko":"Krikalev의 우주 임무는 나라가 붕괴된 뒤 계획보다 훨씬 (A) 되었지만, 임무에 대한 (B) 덕분에 존경받는 인물이 되었다.","oko":["(A) 더 짧아졌고 / (B) 헌신","(A) 더 길어졌고 / (B) 약점","(A) 더 저렴해졌고 / (B) 헌신","(A) 더 길어졌고 / (B) 헌신","(A) 더 쉬워졌고 / (B) 두려움"],"opts":["(A) shorter / (B) commitment","(A) longer / (B) weakness","(A) cheaper / (B) commitment","(A) longer / (B) commitment","(A) easier / (B) fear"],"r":{"a":"4) (A) longer / (B) commitment","ev":"1~12번  전체 문장","s":[[1,"In 1991, Sergei Krikalev, a Soviet astronaut, left Earth for a five-month mission on the Mir space station.","1991년, 소련의 우주비행사 Sergei Krikalev는 미르 우주 정거장에서의 5개월간의 임무를 위해 지구를 떠났다."],[2,"His job was to conduct experiments and maintain the station.","그의 임무는 실험을 수행하고 정거장을 유지 관리하는 것이었다."],[3,"However, during his mission, the Soviet Union collapsed, and everything changed.","그러나, 그의 임무 중 소련이 붕괴되었고, 모든 것이 바뀌었다."],[4,"With no money to fund his return, Krikalev was told to stay in space longer.","그의 귀환에 자금을 제공할 돈이 없어, Krikalev는 우주에 더 오래 머물라는 지시를 받았다."],[5,"Month after month, he waited for news, but the answer was always, “You’ll have to wait a bit longer.”","몇 달이 지나도록 그는 소식을 기다렸지만, 대답은 항상 “당신은 조금 더 기다려야 할 것이다.”였다."],[6,"Krikalev had the option to return using an escape capsule, but with no one else to maintain the station, it could have suffered serious damage.","Krikalev는 탈출 캡슐을 사용하여 돌아올 선택지가 있었지만, 그 정거장을 유지 관리할 다른 사람 없이는, 그것은 심각한 손상을 입을 수도 있었다."],[7,"So he decided to remain.","그래서 그는 남기로 결정했다."],[8,"The extended mission affected his health; the lack of gravity severely weakened his muscles and bones.","연장된 임무는 그의 건강에 영향을 미쳤으며, 중력 부족은 그의 근육과 뼈를 심각하게 약화시켰다."],[9,"The uncertainty about whether he would return safely made it even harder to endure.","그가 안전하게 귀환할지에 대한 불확실성은 견디는 것을 더욱 힘들게 만들었다."],[10,"After 311 days in space — more than twice the planned time — Krikalev finally returned to Earth.","계획된 시간의 두 배가 넘는 311일을 우주에서 보낸 후, Krikalev는 마침내 지구로 돌아왔다."],[11,"By then, his country no longer existed, and his salary in rubles had lost much of its value.","그 무렵, 그의 조국은 더 이상 존재하지 않았고, 그의 루블 급여는 가치를 많이 잃었다."],[12,"Krikalev’s commitment and courage during such a difficult time have made him a highly respected figure in the history of space exploration.","그런 어려운 시기 동안의 Krikalev의 헌신과 용기는 우주 탐험의 역사에서 그를 매우 존경받는 인물로 만들었다."]],"w":"임무는 5개월 계획이 311일로 늘어남(longer), 존경의 이유는 commitment(12번). shorter·cheaper·easier는 본문과 반대이거나 근거 없음.","c":4}},{"n":10,"t":"fill","q":"Krikalev stayed in space to [A] the station even though the long mission [B] his body.","h":"c1f7acb737","ko":"Krikalev는 긴 임무가 그의 몸을 약하게 만들었는데도 정거장을 유지하기 위해 우주에 남았다.","bko":{"maintain":"유지 관리하다","weakened":"약화시켰다","collapsed":"붕괴되었다","conduct":"수행하다","endure":"견디다","fund":"자금을 제공하다"},"bank":["maintain","weakened","collapsed","conduct","endure","fund"],"r":{"a":"[A] maintain, [B] weakened","ev":"6~8번 문장","s":[[6,"Krikalev had the option to return using an escape capsule, but with no one else to maintain the station, it could have suffered serious damage.","Krikalev는 탈출 캡슐을 사용하여 돌아올 선택지가 있었지만, 그 정거장을 유지 관리할 다른 사람 없이는, 그것은 심각한 손상을 입을 수도 있었다."],[7,"So he decided to remain.","그래서 그는 남기로 결정했다."],[8,"The extended mission affected his health; the lack of gravity severely weakened his muscles and bones.","연장된 임무는 그의 건강에 영향을 미쳤으며, 중력 부족은 그의 근육과 뼈를 심각하게 약화시켰다."]],"w":"정거장을 관리하려고 남았으므로 maintain(6번), 중력이 부족해 근육과 뼈가 약해졌으므로 weakened(8번).","c":null}}]},{"u":6,"id":"r17","no":17,"ko":"사기꾼을 홀리는 목소리","items":[{"n":1,"t":"tf","q":"Daisy is an AI chatbot made by a British telecom company.","h":"dbc9d63d27","ko":"Daisy는 영국 통신 회사가 만든 AI 챗봇이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"She’s actually an AI chatbot created by a British telecom company with one purpose: ______.","그녀는 사실 영국의 한 통신 회사에 의해 한 가지 목적을 가지고 만들어진 AI 챗봇인데, 그 목적은 바로 전화 사기범들의 시간을 낭비하는 것이다."]],"w":"4번 문장에 an AI chatbot created by a British telecom company 라고 나옴.","c":"T"}},{"n":2,"t":"tf","q":"Daisy gives scammers her real credit card information.","h":"d162da5a08","ko":"Daisy는 사기꾼들에게 자신의 진짜 신용카드 정보를 준다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"She never gives them what they want, like bank or credit card details, and instead provides fake information just to drain their time and patience.","그녀는 은행이나 신용카드 정보와 같이 그들이 원하는 것을 절대 그들에게 주지 않고, 대신 오로지 그들의 시간과 인내심을 고갈시키기 위해 가짜 정보를 제공한다."]],"w":"8번 문장에 She never gives them … credit card details, and instead provides fake information 이 나옴. 진짜가 아니라 가짜 정보를 줌.","c":"F"}},{"n":3,"t":"tf","q":"Daisy has helped save millions of dollars from phone scams.","h":"68efca3037","ko":"Daisy는 전화 사기로부터 수백만 달러를 지키는 데 도움을 주었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Her efforts have contributed to saving millions of dollars from phone scams.","그녀의 노력은 전화 사기로부터 수백만 달러를 지키는 데 기여했다."]],"w":"11번 문장에 Her efforts have contributed to saving millions of dollars from phone scams 가 나옴. 사실.","c":"T"}},{"n":4,"t":"vocab","q":"she traps them in endless conversations","h":"89f7d7ab24","ko":"그녀는 그들을 끝없는 대화에 (   )","opts":["(궁지에) 가두다","도와주다","놓아주다","놀라게 하다"],"word":"trap","r":{"a":"1) (궁지에) 가두다","ev":"7번 문장","s":[[7,"But instead of providing easy money, she traps them in endless conversations about her everyday life and hobbies.","하지만 손쉬운 돈을 제공하는 대신, 그녀는 그녀의 일상생활과 취미에 대한 끝없는 대화 속에 그들을 가둔다."]],"w":"trap은 (궁지에) 가두다. 끝없는 대화에 사기꾼을 붙잡아 두는 내용과 맞음. 8번 문장의 drain their time 과도 이어짐.","c":1}},{"n":5,"t":"vocab","q":"just to drain their time and patience","h":"0ffca0f9e5","ko":"그들의 시간과 인내심을 (   ) 위해서일 뿐","opts":["보호하다","모으다","기록하다","고갈시키다, 빼내다"],"word":"drain","r":{"a":"4) 고갈시키다, 빼내다","ev":"8번 문장","s":[[8,"She never gives them what they want, like bank or credit card details, and instead provides fake information just to drain their time and patience.","그녀는 은행이나 신용카드 정보와 같이 그들이 원하는 것을 절대 그들에게 주지 않고, 대신 오로지 그들의 시간과 인내심을 고갈시키기 위해 가짜 정보를 제공한다."]],"w":"drain은 물을 빼다라는 뜻도 있지만 여기서는 시간과 인내심을 고갈시키다. 사기꾼의 시간을 낭비시키는 목적(10번 wasted)과 연결.","c":4}},{"n":6,"t":"ref","q":"What does “they” refer to? — “She never gives them what they want”","h":"dd2aa9a2c5","ko":"“they”가 가리키는 것은? — 그녀는 그들이 원하는 것을 절대 주지 않는다","sko":"그녀는 그들이 원하는 것을 절대 그들에게 주지 않는다.","opts":["Daisy","the telecom company","real victims","scammers"],"r":{"a":"4) scammers","ev":"8번 문장","s":[[8,"She never gives them what they want, like bank or credit card details, and instead provides fake information just to drain their time and patience.","그녀는 은행이나 신용카드 정보와 같이 그들이 원하는 것을 절대 그들에게 주지 않고, 대신 오로지 그들의 시간과 인내심을 고갈시키기 위해 가짜 정보를 제공한다."]],"w":"그들이 원하는 것은 은행·신용카드 정보이고, 그것을 얻으려는 쪽은 사기꾼. 앞의 them 도 같은 사기꾼.","c":4}},{"n":7,"t":"sense","q":"[7번 문장] “… instead of providing easy money, she traps them in endless conversations”","h":"73 (B) traps"],"r":{"a":"5) (A) harmless / (B) traps","ev":"6~8번, 10번 문장","s":[[6,"She presents herself as a harmless elderly woman, so scammers believe they’ve found an easy target.","그녀는 자신을 무해한 노인 여성으로 묘사해서, 사기범들은 자신들이 쉬운 표적을 찾았다고 생각한다."],[7,"But instead of providing easy money, she traps them in endless conversations about her everyday life and hobbies.","하지만 손쉬운 돈을 제공하는 대신, 그녀는 그녀의 일상생활과 취미에 대한 끝없는 대화 속에 그들을 가둔다."],[8,"She never gives them what they want, like bank or credit card details, and instead provides fake information just to drain their time and patience.","그녀는 은행이나 신용카드 정보와 같이 그들이 원하는 것을 절대 그들에게 주지 않고, 대신 오로지 그들의 시간과 인내심을 고갈시키기 위해 가짜 정보를 제공한다."],[10,"So far, she’s wasted hundreds of hours of their time, exposing their sneaky tricks and protecting real victims.","지금까지, 그녀는 그들의 교활한 속임수를 노출시키고 실제 피해자들을 보호하며, 그들의 수백 시간을 헛되이 쓰게 해왔다."]],"w":"6번 harmless elderly woman, 7번 traps them in endless conversations. harmful은 반대 뜻이고 helps·avoids·invites는 본문 내용과 맞지 않음.","c":5}},{"n":10,"t":"fill","q":"Daisy [A] scammers in endless conversations, [B] their sneaky tricks and protecting real victims.","h":"efe061459e","ko":"Daisy는 사기꾼들을 끝없는 대화에 가두고, 그들의 교활한 수법을 드러내며 진짜 피해자들을 보호한다.","bko":{"traps":"가두다","exposing":"노출시키는","wasted":"낭비했다","provides":"제공하다","powered":"동력을 공급받은","contributed":"기여했다"},"bank":["traps","exposing","wasted","provides","powered","contributed"],"r":{"a":"[A] traps, [B] exposing","ev":"7번, 10번 문장","s":[[7,"But instead of providing easy money, she traps them in endless conversations about her everyday life and hobbies.","하지만 손쉬운 돈을 제공하는 대신, 그녀는 그녀의 일상생활과 취미에 대한 끝없는 대화 속에 그들을 가둔다."],[10,"So far, she’s wasted hundreds of hours of their time, exposing their sneaky tricks and protecting real victims.","지금까지, 그녀는 그들의 교활한 속임수를 노출시키고 실제 피해자들을 보호하며, 그들의 수백 시간을 헛되이 쓰게 해왔다."]],"w":"7번 문장 she traps them in endless conversations, 10번 문장 exposing their sneaky tricks and protecting real victims.","c":null}}]},{"u":6,"id":"r18","no":18,"ko":"자연이 새로 빚어낸 신비한 마을","items" 나 안내한다는 문장.","c":3}},{"n":6,"t":"ref","q":"What does “its” refer to? — “However, its remote location made life difficult”","h":"b280c4444a","ko":"“its”가 가리키는 것은? — 그러나 그것의 외진 위치가 생활을 힘들게 했다","sko":"그러나, 그것의 외딴 위치는 생활을 어렵게 했다.","opts":["Shanghai","nature","the tourists","the village"],"r":{"a":"4) the village","ev":"3번 문장","s":[[3,"However, its remote location made life difficult, and work opportunities were limited.","그러나, 그것의 외딴 위치는 생활을 어렵게 했고, 일자리는 제한적이었다."]],"w":"바로 앞 2번 문장에서 this village 가 3,000명이 살던 곳으로 나옴. 위치 때문에 생활이 힘들어진 대상은 마을.","c":4}},{"n":7,"t":"sense","q":"[6번 문장] “Nature moved in, turning the village into something out of a movie.”","h":"84b56abd8a","ko":"[6번 문장] 자연이 들어와 마을을 영화 속 한 장면 같은 곳으로 바꾸었다. 이 문장의 의미는?","sko":"자연이 들어와 그 마을을 마치 영화에서 나온 것처럼 변화시켰다.","opts":["자연이 마을을 뒤덮어 영화 속 장면 같은 모습이 되었다","영화 촬영팀이 마을로 이사 와서 영화를 찍었다","자연이 마을에서 완전히 떠나 버렸다","마을 사람들이 영화를 보려고 다른 곳으로 이사했다"],"r":{"a":"1) 자연이 마을을 뒤덮어 영화 속 장면 같은 모습이 되었다","ev":"6~7번 문장","s":[[6,"Nature moved in, turning the village into something out of a movie.","자연이 들어와 그 마을을 마치 영화에서 나온 것처럼 변화시켰다."],[7,"Vines crept through windows, green blankets of plants covered roofs, and walls were wrapped in greenery.","덩굴이 창문을 통해 기어올랐고, 초록빛 식물 덮개가 지붕을 뒤덮었으며, 벽은 푸른 잎으로 뒤덮였다."]],"w":"Nature moved in 은 자연이 사람이 떠난 마을을 차지했다는 뜻. 이어지는 7번 문장에서 덩굴·풀·푸른 잎이 마을을 덮음.","c":1}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"3d39b4cd2f","ko":"본문 내용과 일치하는 것은?","oko":["Houtouwan의 집들은 관광객들에 의해 손상되었다.","방문객들은 하이킹 코스를 따라 마을을 걸어서 지나갈 수 있다.","사람들은 1980년대에 Houtouwan을 떠나기 시작했다.","전망대는 마을이 비기 전에 개장되었다."],"opts":["Houtouwan’s houses were damaged by tourists.","Visitors can walk through the village on hiking trails.","People started leaving Houtouwan in the 1980s.","The viewing platform opened before the village became empty."],"r":{"a":"2) Visitors can walk through the village on hiking trails.","ev":"11번 문장","s":[[11,"A viewing platform opened in 2017, and hiking trails guide visitors through its winding alleys and overgrown ruins.","2017년에 전망대가 개장되었고, 하이킹 코스는 구불구불한 골목길과 무성하게 자란 폐허를 따라 관광객들을 안내한다."]],"w":"11번 문장에 hiking trails guide visitors through its winding alleys 가 나옴. 집 손상은 초목의 무게(8번), 떠나기 시작한 때는 1990년대(4번), 전망대는 2017년이라 마을이 빈 2002년 뒤(11번).","c":2}},{"n":9,"t":"sum","q":"After people (A) Houtouwan, nature (B) the village, and now tourists visit the green ruins.","h":"445ffda0bc","ko":"사람들이 Houtouwan을 (A) 후, 자연이 마을을 (B), 이제 관광객들이 푸른 폐허를 찾아온다.","oko":["(A) 떠난 / (B) 피했고","(A) 지은 / (B) 뒤덮었고","(A) 떠난 / (B) 뒤덮었고","(A) 채운 / (B) 떠났고","(A) 지은 / (B) 피했고"],"opts":["(A) left / (B) avoided","(A) built / (B) covered","(A) left / (B) covered","(A) filled / (B) left","(A) built / (B) avoided"],"r":{"a":"3) (A) left / (B) covered","ev":"4~7번, 10~12번 문장","s":[[4,"By the 1990s, people began leaving, and by 2002, the village was completely abandoned.","1990년대에는 사람들이 떠나기 시작했고, 2002년에는 그 마을이 완전히 버려졌다."],[5,"But Houtouwan didn’t stay empty for long.","하지만 Houtouwan은 오래 비어 있지 않았다."],[6,"Nature moved in, turning the village into something out of a movie.","자연이 들어와 그 마을을 마치 영화에서 나온 것처럼 변화시켰다."],[7,"Vines crept through windows, green blankets of plants covered roofs, and walls were wrapped in greenery.","덩굴이 창문을 통해 기어올랐고, 초록빛 식물 덮개가 지붕을 뒤덮었으며, 벽은 푸른 잎으로 뒤덮였다."],[10,"Today, Houtouwan is a popular destination for adventurers.","오늘날, Houtouwan은 모험가들에게 인기 있는 여행지이다."],[11,"A viewing platform opened in 2017, and hiking trails guide visitors through its winding alleys and overgrown ruins.","2017년에 전망대가 개장되었고, 하이킹 코스는 구불구불한 골목길과 무성하게 자란 폐허를 따라 관광객들을 안내한다."],[12,"Hundreds of tourists visit daily, especially in summer, when the sunlight sparkles through the green leaves.","특히, 푸른 나뭇잎 사이로 햇빛이 반짝거리는 여름에는 매일 수백 명의 관광객들이 방문한다."]],"w":"사람들이 떠난 뒤(4번) 덩굴과 풀이 마을을 덮었고(7번) 지금은 관광지(10~12번). avoided·built·filled는 본문과 맞지 않음.","c":3}},{"n":10,"t":"fill","q":"Houtouwan was completely [A] by 2002, and its green ruins are now [B] many tourists.","h":"caa4ad2282","ko":"Houtouwan은 2002년에 완전히 버려졌고, 지금은 푸른 폐허가 많은 관광객을 끌어들이고 있다.","bk on a plane.","h":"92f6923d98","ko":"비행기 안에서는 단맛과 짠맛이 약 30% 약해진다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"As a result, sweet and salty flavors weaken by approximately 30%.","결과적으로, 단맛과 짠맛이 약 30퍼센트 정도 약해진다."]],"w":"5번 문장에 sweet and salty flavors weaken by approximately 30%가 나옴. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Airlines know these challenges, so they adjust their recipes.","h":"977b1807a9","ko":"항공사들은 이런 어려움을 알고 있어서 조리법을 조절한다.","opts":["포기하다","비판하다","조절하다","주문하다"],"word":"adjust","r":{"a":"3) 조절하다","ev":"9번 문장","s":[[9,"Airlines know these challenges, so they adjust their recipes by adding extra salt, sugar, and bold flavors.","항공사는 이러한 어려움을 잘 알고 있어서, 추가적인 소금, 설탕과 강렬한 맛을 더하여 조리법을 조절한다."]],"w":"adjust는 동사 '조절하다, 맞추다'. 9번에서 소금·설탕을 더 넣어 조리법을 맞춘다는 흐름.","c":3}},{"n":5,"t":"vocab","q":"People eating with loud background noise rate food less sweet or salty.","h":"37511e8240","ko":"시끄러운 배경 소음 속에서 먹는 사람들은 음식을 덜 달거나 덜 짜다고 평가한다.","opts":["평가하다","달리다","요금","속도"],"word":"rate","r":{"a":"1) 평가하다","ev":"7번 문장","s":[[7,"Studies reveal that people eating with loud background noise rate food less sweet or salty than when eating in silence.","연구는 시끄러운 배경 소음 속에서 식사하는 사람들이 고요함 속에서 식사할 때에 비해 음식을 덜 달거나 덜 짜다고 평가한다는 것을 보여준다."]],"w":"rate는 명사 '속도, 요금'으로도 쓰이지만 여기서는 동사 '평가하다'. rate food less sweet = 음식을 덜 달다고 평가함.","c":1}},{"n":6,"t":"ref","q":"Which does the underlined 'This' refer to?","h":"2cdebcca26","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 당신의 코와 입에 영향을 미쳐, 미뢰와 후각이 제대로 기능하는 것을 어렵게 만든다.","opts":["기내식의 맛","낮은 기압과 낮은 습도","엔진의 굉음","요리사의 실수"],"r":{"a":"2) 낮은 기압과 낮은 습도","ev":"3~4번 문장","s":[[3,"As the plane climbs to 30,000 feet, the cabin air pressure drops, and humidity levels become extremely low — lower than most deserts!","비행기가 3만 피트까지 상승할 때, 기내 공기압이 떨어지고 습도가 극도로 낮아지는데, 이는 대부분의 사막보다 더 낮다!"],[4,"This affects your nose and mouth, making it difficult for your taste buds and smell sensors to function properly.","이것은 당신의 코와 입에 영향을 미쳐, 미뢰와 후각이 제대로 기능하는 것을 어렵게 만든다."]],"w":"4번의 This는 바로 앞 3번 문장의 기압이 떨어지고 습도가 매우 낮아지는 상황. 엔진 소음은 6번에서 처음 나옴.","c":2}},{"n":7,"t":"sense","q":"Which is closest in meaning to sentence 8, 'Together, these factors make in-flight meals less enjoyable'?","h":"3f64225dfe","ko":"8번 문장 '이 요인들이 함께 작용해 기내식을 덜 즐겁게 만든다'와 가장 가까운 의미는?","sko":"이러한 요인들이 함께 작용하여, 기내식을 덜 맛있게 만든다.","opts":["기압, 습도, 소음이 합쳐져 기내식을 덜 맛있게 느끼게 한다.","요리사가 바뀌면 기내식이 훨씬 더 즐거워진다.","세 가지 요인 중 소음만 맛에 영향을 준다.","항공사들이 요인들을 모두 해결해 맛이 좋아진다."],"r":{"a":"1) 기압, 습도, 소음이 합쳐져 기내식을 덜 맛있게 느끼게 한다.","ev":"8번 문장","s":[[8,"Together, these factors make in-flight meals less enjoyable.","이러한 요인들이 함께 작용하여, 기내식을 덜 맛있게 만든다."]],"w":"Together는 앞에서 나온 기압, 습도, 소음을 합친다는 뜻이고 결과는 less enjoyable. 나머지 선지는 본문과 반대.","c":1}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"8d8af0bff1","ko":"본문과 일치하는 것은?","oko":["비행기 안의 습도는 대부분의 사막보다 높다.","시끄러운 소음은 사람들이 음식을 더 달다고 평가하게 만든다.","일부 항공사는 모의 기내에서 조리법을 시험한다.","항공사는 음식의 소금과 설탕을 줄인다."],"opts":["Humidity on planes is higher than in most deserts.","Loud noise makes people rate food sweeter.","Some airlines test recipes in simulated cabins.","Airlines reduce salt and sugar in their meals."],"r":{"a":"3) Some airlines test recipes in simulated cabins.","ev":"3번, 7번, 9~10번 문장","s":[[3,"As the plane climbs to 30,000 feet, the cabin air pressure drops, and humidity levels become extremely low — lower than most deserts!","비행기가 3만 피트까지 상승할 때, 기내 공기압이 떨어지고 습도가 극도로 낮아지는데, 이는 대부분의 사막보다 더 낮다!"],[7,"Studies reveal that people eating with loud background noise rate food less sweet or salty than when eating in silence.","연구는 시끄러운 배경 소음 속에서 식사하는 사람들이 고요함 속에서 식사할 때에 비해 음식을 덜 달거나 덜 짜다고 평가한다는 것을 보여준다."],[9,"Airlines know these challenges, so they adjust their recipes by adding extra salt, sugar, and bold flavors.","항공사는 이러한 어려움을 잘 알고 있어서, 추가적인 소금, 설탕과 강렬한 맛을 더하여 조리법을 조절한다."],[10,"Some airlines even test recipes in simulated cabins to develop recipes that could work well in the unique environment.","일부 항공사는 그 특수한 환경에서 잘 작용할 수 있는 조리법을 개발하기 위해 모의 기내에서 조리법을 실험하기도 한다."]],"w":"10번에서 일부 항공사는 simulated cabins에서 조리법을 시험한다고 함. ①은 사막보다 낮음, ②는 덜 달다고 평가, ④는 소금·설탕을 더 넣음.","c":3}},{"n":9,"t":"sum","q":"Cabin conditions make airplane food taste (A), so airlines make their recipes (B).","h":"c5c1dbf598","ko":"객실 환경이 기내식 맛을 (A) 느끼게 해서, 항공사들은 조리법을 (B) 만든다.","oko":["(A) 더 강한 / (B) 더 순한","(A) 더 좋은 / (B) 더 짠","(A) 더 약한 / (B) 더 저렴한","(A) 더 약한 / (B) 더 강렬한","(A) 더 풍부한 / (B) 더 강렬한"],"opts":["(A) stronger / (B) milder","(A) better / (B) saltier","(A) weaker / (B) cheaper","(A) weaker / (B) bolder","(A) richer / (B) bolder"],"r":{"a":"4) (A) weaker / (B) bolder","ev":"3~5번, 9번 문장","s":[[3,"As the plane climbs to 30,000 feet, the cabin air pressure drops, and humidity levels become extremely low — lower than most deserts!","비행기가 3만 피트까지 상승할 때, 기내 공기압이 떨어지고 습도가 극도로 낮아지는데, 이는 대부분의 사막보다 더 낮다!"],[4,"This affects your nose and mouth, making it difficult for your taste buds and smell sensors to function properly.","이것은 당신의 코와 입에 영향을 미쳐, 미뢰와 후각이 제대로 기능하는 것을 어렵게 만든다."],[5,"As a result, sweet and salty flavors weaken by approximately 30%.","결과적으로, 단맛과 짠맛이 약 30퍼센트 정도 약해진다."],[9,"Airlines know these challenges, so they adjust their recipes by adding extra salt, sugar, and bold flavors.","항공사는 이러한 어려움을 잘 알고 있어서, 추가적인 소금, 설탕과 강렬한 맛을 더하여 조리법을 조절한다."]],"w":"낮은 기압·습도·소음으로 맛이 약해지고(weaken), 항공사는 소금·설탕·강한 맛(bold flavors)을 더함. 정답은 weaker / bolder.","c":4}},{"n":10,"t":"fill","q":"Low air pressure, dry air, and engine [A] make in-flight meals less [B].","h":"2cf32a1867","ko":"낮은 기압, 건조한 공기, 엔진 [A]이 기내식을 덜 [B]하게 만든다.","bko":{"noise":"소음","silence":"고요함","science":"과학","enjoyable":"즐거운, 맛있는","chef":"요리사","airlines":"항공사"},"bank":["noise","silence","science","enjoyable","chef","airlines"],"r":{"a":"[A] noise, [B] enjoyable","ev":"3~8번 문장","s":[[3,"As the plane climbs to 30,000 feet, the cabin air pressure drops, and humidity levels become extremely low — lower than most deserts!","비행기가 3만 피트까지 상승할 때, 기내 공기압이 떨어지고 습도가 극도로 낮아지는데, 이는 대부분의 사막보다 더 낮다!"],[4,"This affects your nose and mouth, making it difficult for your taste buds and smell sensors to function properly.","이것은 당신의 코와 입에 영향을 미쳐, 미뢰와 후각이 제대로 기능하는 것을 어렵게 만든다."],[5,"As a result, sweet and salty flavors weaken by approximately 30%.","결과적으로, 단맛과 짠맛이 약 30퍼센트 정도 약해진다."],[6,"The constant roar of airplane engines also impacts how you perceive taste.","비행기 엔진의 지속적인 굉음도 당신이 맛을 인식하는 방식에 영향을 미친다."],[7,"Studies reveal that people eating with loud background noise rate food less sweet or salty than when eating in silence.","연구는 시끄러운 배경 소음 속에서 식사하는 사람들이 고요함 속에서 식사할 때에 비해 음식을 덜 달거나 덜 짜다고 평가한다는 것을 보여준다."],[8,"Together, these factors make in-flight meals less enjoyable.","이러한 요인들이 함께 작용하여, 기내식을 덜 맛있게 만든다."]],"w":"6~7번에서 엔진의 굉음(noise)이 맛에 영향을 주고, 8번에서 less enjoyable이라고 정리함. silence는 오히려 조용할 때 맛이 덜 약해진다는 비교 대상.","c":null}}]},{"u":7,"id":"r20","no":20,"ko":"어디서든 수술이 가능해!","items":[{"n":1,"t":"tf","q":"The entire setup of SurgiField can be assembled in minutes.","h":"e4bacab7ca","ko":"SurgiField의 전체 장비는 몇 분 안에 조립될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The entire setup fits inside a backpack and can be assembled in minutes.","전체 장비는 배낭 안에 들어가며 몇 분 안에 조립될 수 있다."]],"w":"5번 문장에 can be assembled in minutes가 나옴. 일치.","c":"T"}},{"n":2,"t":"tf","q":"SurgiField consists of two main parts.","h":"c9184b493a","ko":"SurgiField는 두 가지 주요 부품으로 이루어져 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It ⓑ consists of three main parts: a plastic bubble with armholes, a module that filters and controls airflow, and a battery.","그것은 세 가지 주요 부품으로 구성되어 있는데, 팔 구멍이 있는 플라스틱 버블(보호막), 공기 흐름을 정화하고 조절하는 모듈, 그리고 배터리이다."]],"w":"4번에서 three main parts(비닐 거품, 공기 모듈, 배터리)라고 함. 숫자가 틀려 F.","c":"F"}},{"n":3,"t":"tf","q":"SurgiField has saved 31 lives in war zones.","h":"ee93e04d82","ko":"SurgiField는 전쟁 지역에서 31명의 생명을 구했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"SurgiField has already proven its ⓓ worth by saving 31 lives in war zones.","SurgiField는 전쟁 지역에서 31명의 생명을 구함으로써 그것의 가치를 이미 입증했다."]],"w":"10번 문장에 saving 31 se","q":"Which is closest in meaning to sentence 10, 'SurgiField has already proven its worth by saving 31 lives in war zones'?","h":"f787e3b89c","ko":"10번 문장 'SurgiField는 이미 전쟁 지역에서 31명을 구하며 그 가치를 입증했다'와 가장 가까운 의미는?","sko":"SurgiField는 전쟁 지역에서 31명의 생명을 구함으로써 그것의 가치를 이미 입증했다.","opts":["전쟁 지역에서 실제로 사람을 살려 쓸모를 보여 주었다.","전쟁 지역에서 값이 비싸서 쓰이지 못했다.","앞으로 31명을 구할 것으로 예상된다.","전쟁이 끝난 뒤에야 만들어졌다."],"r":{"a":"1) 전쟁 지역에서 실제로 사람을 살려 쓸모를 보여 주었다.","ev":"10번 문장","s":[[10,"SurgiField has already proven its ⓓ worth by saving 31 lives in war zones.","SurgiField는 전쟁 지역에서 31명의 생명을 구함으로써 그것의 가치를 이미 입증했다."]],"w":"proven its worth는 가치를 입증했다는 뜻이고, already와 현재완료로 이미 이룬 결과. 예상(11번)과 구분.","c":1}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"fcd293fba1","ko":"본문과 일치하는 것은?","oko":["외과의사는 버블 밖에서 수술을 지켜본다.","SurgiField는 배낭에 넣어 운반할 수 있다.","SurgiField는 지방 진료소에서만 사용되어 왔다.","그 시스템은 매번 처음부터 다시 만들어져야 한다."],"opts":["The surgeon watches the surgery from outside the bubble.","SurgiField can be carried in a backpack.","SurgiField has only been used in rural clinics.","The system must be rebuilt from scratch every time."],"r":{"a":"2) SurgiField can be carried in a backpack.","ev":"5번, 8~9번, 10~11번 문장","s":[[5,"The entire setup fits inside a backpack and can be assembled in minutes.","전체 장비는 배낭 안에 들어가며 몇 분 안에 조립될 수 있다."],[8,"The surgeon then inserts their arms through the armholes and performs the procedure.","그런 다음 외과의사는 팔 구멍을 통해 팔을 넣고 수술을 시행한다."],[9,"Once the surgery is complete, the system is disassembled and packed for reuse.","수술이 완료되면, 그 시스템은 분해되고 재사용을 위해 포장된다."],[10,"SurgiField has already proven its ⓓ worth by saving 31 lives in war zones.","SurgiField는 전쟁 지역에서 31명의 생명을 구함으로써 그것의 가치를 이미 입증했다."],[11,"The system is expected to be adopted in various settings such as disaster sites, rural clinics, and patient bedsides.","그 시스템은 재난 현장, 지방 진료소, 그리고 환자 병상과 같은 다양한 환경에 도입될 것으로 예상된다."]],"w":"5번에서 전체 장비가 백팩에 들어감. ①은 팔을 구멍으로 넣어 수술, ③은 war zones에서 사용, ④는 packed for reuse라 재사용.","c":2}},{"n":9,"t":"sum","q":"SurgiField is a (A) surgery system that creates a (B) space in places with limited medical facilities.","h":"c9fa9c587b","ko":"SurgiField는 의료 시설이 부족한 곳에서 (B) 공간을 만드는 (A) 수술 시스템이다.","oko":["(A) 고정된 / (B) 무균의","(A) 휴대용의 / (B) 붐비는","(A) 무거운 / (B) 시끄러운","(A) 비싼 / (B) 더러운","(A) 휴대용의 / (B) 무균의"],"opts":["(A) fixed / (B) sterile","(A) portable / (B) crowded","(A) heavy / (B) noisy","(A) expensive / (B) dirty","(A) portable / (B) sterile"],"r":{"a":"5) (A) portable / (B) sterile","ev":"1~3번, 7번 문장","s":[[1,"In areas with limited medical facilities, performing emergency surgery is often ⓐ impossible.","의료 시설이 제한된 지역에서는, 응급 수술을 시행하는 것이 종종 불가능하다."],[2,"SurgiBox, a startup company that has worked with MIT D-Lab, developed a portable surgery system, SurgiField.","MIT D-Lab과 협력해 온 스타트업 회사인 SurgiBox는, 휴대용 수술 시스템인 SurgiField를 개발했다."],[3,"This innovative system brings urgent surgery to places where it’s needed.","이 혁신적인 시스템은 응급 수술을 필요한 곳에 가져다준다."],[7,"This bubble creates a sterile environment while ⓒ disabling surgeons to see the patient clearly.","이 버블은 무균 환경을 만들어주는 동시에 외과의사가 환자를 또렷이 볼 수 없게 한다(→ 수 있게 한다)."]],"w":"휴대용(portable) 시스템이 살균된(sterile) 환경을 만든다는 것이 핵심. 나머지는 본문과 반대이거나 언급 없음.","c":5}},{"n":10,"t":"fill","q":"The whole setup fits inside a [A] and can be [B] in minutes.","h":"7e757a4f9c","ko":"전체 장비는 [A] 안에 들어가고 몇 분 안에 [B] 수 있다.","bko":{"backpack":"배낭","bubble":"버블(보호막)","battery":"배터리","assembled":"조립되다","adopted":"도입되다","filtered":"정화되다, 걸러지다"},"bank":["backpack","bubble","battery","assembled","adopted","filtered"],"r":{"a":"[A] backpack, [B] assembled","ev":"5번 문장","s":[[5,"The entire setup fits inside a backpack and can be assembled in minutes.","전체 장비는 배낭 안에 들어가며 몇 분 안에 조립될 수 있다."]],"w":"5번 문장: fits inside a backpack and can be assembled in minutes. bubble·battery는 부품이고 adopted는 11번에서 쓰임새가 다름.","c":null}}]},{"u":7,"id":"r21","no":21,"ko":"느리게, 준비, 출발!","items":[{"n":1,"t":"tf","q":"The snail racing event will be held this Saturday.","h":"f7610f3a45","ko": e Congham village church, making this a fun event for a good cause.","모인 모든 기금은 Congham 마을 교회를 지원하는 데 사용될 것이며, 이는 이것을 가치 있는 목적을 위한 재미있는 행사로 만듭니다."]],"w":"cause는 '원인'으로 많이 쓰이지만 여기서는 good cause = 좋은 목적(대의). 모금 이야기가 앞에 나오는 문맥.","c":3}},{"n":6,"t":"ref","q":"Which does the underlined 'its' refer to?","h":"1ae73c6c00","ko":"밑줄 친 its가 가리키는 것은?","sko":"경주 우승자는 신선한 로메인 상추 한 다발을 받게 되고, 그 달팽이의 뿌듯한 코치는 특별한 트로피 컵을 집으로 가져가게 됩니다.","opts":["Romaine 상추","경주의 우승자(달팽이)","트로피 컵","달팽이 대여"],"r":{"a":"2) 경주의 우승자(달팽이)","ev":"9번 문장","s":[[9,"The winner of the race will receive a fresh bunch of Romaine lettuce, while its proud coach will take home a special trophy cup.","경주 우승자는 신선한 로메인 상추 한 다발을 받게 되고, 그 달팽이의 뿌듯한 코치는 특별한 트로피 컵을 집으로 가져가게 됩니다."]],"w":"its proud coach는 우승자(달팽이)의 자랑스러운 코치. 우승자는 상추, 코치는 트로피 컵을 받음.","c":2}},{"n":7,"t":"sense","q":"Which is closest in meaning to sentence 12, 'It's time to find out if your snail has what it takes to be the next champion'?","h":"140a97d73a","ko":"12번 문장 '여러분의 달팽이가 다음 챔피언이 될 자질이 있는지 알아볼 시간이다'와 가장 가까운 의미는?","sko":"이제 여러분의 달팽이가 다음 챔피언이 되기 위해 필요한 것을 가지고 있는지 알아볼 시간입니다.","opts":["달팽이를 팔기 시작할 시간이다.","대회가 이미 끝났다.","달팽이에게 먹이를 줄 시간이다.","내 달팽이가 챔피언이 될 만한지 확인할 때이다."],"r":{"a":"4) 내 달팽이가 챔피언이 될 만한지 확인할 때이다.","ev":"12번 문장","s":[[12,"It’s time to find out if your snail has what it takes to be the next champion.","이제 여러분의 달팽이가 다음 챔피언이 되기 위해 필요한 것을 가지고 있는지 알아볼 시간입니다."]],"w":"what it takes는 '필요한 것(자질)'. find out if는 ~인지 알아보다. 챔피언이 될 자질을 확인한다는 뜻.","c":4}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"d37ac992e3","ko":"본문과 일치하는 것은?","oko":["그 선수권 대회는 60년 넘게 이어져 온 전통이다.","그 행사는 Congham의 달팽이 농장에서 열린다.","우승한 달팽이는 트로피 컵을 받는다.","달팽이가 없는 사람은 경주에 참가할 수 없다."],"opts":["The championship has been a tradition for over 60 years.","The event is held at a snail farm in Congham.","The winning snail receives a trophy cup.","People who have no snail cannot join the race."],"r":{"a":"1) The championship has been a tradition for over 60 years.","ev":"3번, 8번, 9번, 4번 문장","s":[[3,"This Saturday, we’re hosting our annual snail racing event at Grimston Cricket Club, located in Congham, U.K.","이번 토요일, 저희는 영국 Congham에 위치한 Grimston Cricket Club에서 연례 달팽이 경주 행사를 개최할 것입니다."],[4,"Our championship has been a beloved tradition for over 60 years, featuring snails racing across a 34-centimeter course.","저희 대회는 60년 넘게 이어져 온 사랑받는 전통이며, 34센티미터 코스를 달리는 달팽이들을 특색으로 합니다."],[8,"We offer a “snail rental” where you can rent your very own racer.","저희는 여러분이 자신만의 경주용 달팽이를 대여할 수 있는 ‘달팽이 대여’를 제공합니다."],[9,"The winner of the race will receive a fresh bunch of Romaine lettuce, while its proud coach will take home a special trophy cup.","경주 우승자는 신선한 로메인 상추 한 다발을 받게 되고, 그 달팽이의 뿌듯한 코치는 특별한 트로피 컵을 집으로 가져가게 됩니다."]],"w":"4번에서 over 60 years 전통. ②는 Grimston Cricket Club, ③ 트로피는 코치, ④는 snail rental로 참가 가능.","c":1}},{"n":9,"t":"sum","q":"The World Snail Racing Championships is a (A) event where people can (B) a snail to race and support a good cause.","h":"ac7e9b4b21","ko":"세계 달팽이 경주 대회는 사람들이 경주할 달팽이를 (B)할 수 있고 좋은 목적을 돕는 (A) 행사이다.","oko":["(A) 지루한 / (B) 대여하다","(A) 재미있는 / (B) 대여하다","(A) 재미있는 / (B) 사다","(A) 비공개의 / (B) 팔다","(A) 비싼 / (B) 빌리다"],"opts":["(A) boring / (B) rent","(A) fun / (B) rent","(A) fun / (B) buy","(A) private / (B) sell","(A) expensive / (B) borrow"],"r":{"a":"2) (A) fun / (B) rent","ev":"1~2번, 8번, 10번 문장","s":[[1,"I’m Nicholas Dickinson, co-organizer of the World Snail Racing Championships.","저는 세계 달팽이 경주 선수권 대회의 공동 주최자인 Nicholas Dickinson입니다."],[2,"If you enjoy unique and fun competitions, this event is for you.","여러분이 독특하고 재미있는 대회를 즐긴다면, 이 행사는 여러분을 위한 것입니다."],[8,"We offer a “snail rental” where you can rent your very own racer.","저희는 여러분이 자신만의 경주용 달팽이를 대여할 수 있는 ‘달팽이 대여’를 제공합니다."],[10,"All funds raised will go to support the Congham village church, making this a fun event for a good cause.","모인 모든 기금은 Congham 마을 교회를 지원하는 데 사용될 것이며, 이는 이것을 가치 있는 목적을 위한 재미있는 행사로 만듭니다."]],"w":"fun and unique competitions이고 snail rental로 달팽이를 빌릴 수 있으며(rent) 수익은 교회를 도움. buy·sell은 언급 없음.","c":2}},{"n":10,"t":"fill","q":"People who have no snail can [A] one, and the money raised supports a village [B].","h":"0b3091817b","ko":"달팽이가 없는 사람은 하나를 [A] 수 있고, 모금된 돈은 마을 [B]를 돕는다.","bko":{"rent":"빌리다, 대여하다","church":"교회","lettuce":"상추","cup":"컵(트로피 컵)","ride":"올라타다","win":"우승하다, 이기다"},"bank":["rent","church","lettuce","cup","ride","win"],"r":{"a":"[A] rent, [B] church","ev":"8번, 10번 문장","s":[[8,"We offer a “snail rental” where you can rent your very own racer.","저희는 여러분이 자신만의 경주용 달팽이를 대여할 수 있는 ‘달팽이 대여’를 제공합니다."],[10,"All funds raised will go to support the Congham village church, making this a fun event for a good cause.","모인 모든 기금은 Congham 마을 교회를 지원하는 데 사용될 것이며, 이는 이것을 가치 있는 목적을 위한 재미있는 행사로 만듭니다."]],"w":"8번 snail rental에서 rent your very own racer, 10번에서 Congham village church를 지원. lettuce와 cup은 상품, ride는 달팽이들이 서로 등에 타려는 행동.","c":null}}]},{"u":8,"id":"r22","no":22,"ko":"작지만 강한 유럽의 녹색 도시","items":[{"n":1,"t":"tf","q":"Växjö pledged to end its use of fossil fuels in 1996.","h":"3412336177","ko":"Växjö는 1996년에 화석 연료 사용을 끝내겠다고 약속했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Växjö, a small but ambitious city in southern Sweden, pledged to make this a reality in 1996.","스웨덴 남부의 작지만 야심 찬 도시인 Växjö는 1996년에 이를 현실로 만들기로 약속했다."]],"w":"2번 문장에 pledged ... in 1996 (1996년에 약속)이 나옴. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Växjö has already completely eliminated fossil fuels.","h":"f97c5a3c46","ko":"Växjö는 이미 화석 연료를 완전히 없앴다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"While Växjö hasn’t completely eliminated fossil fuels yet, it has already cut its carbon emissions by 70% since the 1990s.","Växjö는 아직 화석 연료를 완전히 제거하지는 않았지만, 1990년대 이후로 이미 탄소 배출량을 70퍼센트 줄였다."]],"w":"9번 문장에 hasn't completely eliminated fossil fuels yet (아직 완전히 없애지 못함). 아직 완전 제거 전이므로 불일치.","c":"F"}},{"n":3,"t":"tf","q":"Växjö's economy grew while its carbon emissions went down.","h":"8ed2ecf897","ko":"Växjö의 경제는 성장했고 그동안 탄소 배출량은 줄었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"While Växjö hasn’t completely eliminated fossil fuels yet, it has already cut its carbon emissions by 70% since the 1990s.","Växjö는 아직 화석 연료를 완전히 제거하지는 않았지만, 1990년대 이후로 이미 탄소 배출량을 70퍼센트 줄였다."],[10,"What’s even more impressive is that this progress was achieved while the city’s population grew and its economy doubled.","더욱 인상적인 것은 이러한 진전이 도시의 인구가 증가하고 경제가 두 배로 성장하는 동안 이루어졌다는 점이다."]],"w":"탄소 배출 70% 감축(9번)과 경제가 두 배로 성장(10번)이 함께 제시됨. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word in the passage?","h":"bfe20d2646","ko":"밑줄 친 eliminated의 뜻","opts":["늘렸다","측정했다","제거했다","발견했다"],"word":"eliminated","r":{"a":"3) 제거했다","ev":"9번 문장","s":[[9,"While Växjö hasn’t completely eliminated fossil fuels yet, it has already cut its carbon emissions by 70% since the 1990s.","Växjö는 아직 화석 연료를 완전히 제거하지는 않았지만, 1990년대 이후로 이미 탄소 배출량을 70퍼센트 줄였다."]],"w":"eliminate는 '제거하다, 없애다'. 화석 연료를 완전히 없애지는 못했다는 문맥. 오답: increase 늘리다, measure 측정하다, discover 발견하다.","c":3}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in the passage?","h":"6bc96a5c8b","ko":"밑줄 친 run의 문맥상 뜻 (다의어: 달리다 / 운영하다 / ~로 작동하다)","opts":["달리다","흐르다","운영하다","(연료로) 작동하다"],"word":"run","r":{"a":"4) (연료로) 작동하다","ev":"14번 문장","s":[[14,"Furthermore, local buses and city vehicles run on fuel made from household waste, such as food scraps and gardening waste.","또한, 지역 버스와 시내 차량은 음식물 찌꺼기와 정원 폐기물 같은 가정 폐기물로 만든 연료로 작동한다."]],"w":"'run on + 연료'는 '~로 작동하다, ~를 연료로 달리다'. 버스와 시 차량이 폐기물 연료로 움직인다는 뜻. '달리다'만 알면 틀리기 쉬운 다의어.","c":4}},{"n":6,"t":"ref","q":"What does the underlined 'which' refer to?","h":"8fbbd20fcc","ko":"밑줄 친 which가 가리키는 것","oko":["목재","탄소","기후 변화","신축 건물"],"sko":"목재로 지어지는데, 그것은 탄소를 가두고","opts":["timber","carbon","climate change","new buildings"],"r":{"a":"1) timber","ev":"6번 문장","s":[[6,"Half of all new buildings in the city are constructed from timber, which traps carbon and helps combat climate change.","도시의 모든 신축 건물의 절반은 목재로 지어지는데, 그것은 탄소를 가두고 기후 변화를 막는 데 도움이 된다."]],"w":"which 바로 앞 timber(목재)를 받음. '목재는 탄소를 가두고 기후 변화 대응에 도움'이라는 설명.","c":1}},{"n":7,"t":"sense","q":"Which is closest in meaning to the sentence below? (Sentence 10)","h":"b017abeb3f","ko":"10번 문장의 의미로 알맞은 것","sko":"이러한 진전이 도시의 인구가 증가하고 경제가 두 배로 성장하는 동안 이루어졌다","opts":["인구가 줄어든 덕분에 감축이 쉬웠다는 의미","인구와 경제가 성장하는 가운데 이룬 성과라서 더 인상적이라는 의미","경제 규모가 두 배가 된 뒤에야 감축을 시작했다는 의미","감축 때문에 경제 성장이 멈췄다는 의미"],"r":{"a":"2) 인구와 경제가 성장하는 가운데 이룬 성과라서 더 인상적이라는 의미","ev":"10번 문장","s":[[10,"What’s even more impressive is that this progress was achieved while the city’s population grew and its economy doubled.","더욱 인상적인 것은 이러한 진전이 도시의 인구가 증가하고 경제가 두 배로 성장하는 동안 이루어졌다는 점이다."]],"w":"10번 문장: 도시 인구가 늘고 경제가 두 배가 되는 동안 이뤄낸 성과라서 더 인상적. 인구 감소나 경제 정체는 본문에 없음.","c":2}},{"n":8,"t":"match","q":"Which is true about the passage?","h":"8177e87fd9","ko":"본문과 일치하는 것","oko":["Växjö의 목조 구조물은 주택에만 사용된다.","Växjö 전기의 90퍼센트 이상이 바이오 연료에서 나온다.","지역 버스와 시내 차량은 가정 폐기물로 만든 연료를 사용한다.","Växjö의 경제가 두 배로 성장하는 동안 인구는 감소했다."],"opts":["Wooden structures in Växjö are used only for homes.","More than 90% of Växjö's electricity comes from biofuels.","Local buses and city vehicles use fuel made from household waste.","Växjö's population has fallen as its economy has doubled."],"r":{"a":"3) Local buses and city vehicles use fuel made from household waste.","ev":"7번, 10번, 13~14번 문장","s":[[7,"Homes, schools, and even sports centers are built using wooden structures.","주택, 학교, 심지어 스포츠 센터도 목조 구조물을 사용하여 지어진다."],[10,"What’s even more impressive is that this progress was achieved while the city’s population grew and its economy doubled.","더욱 인상적인 것은 이러한 진전이 도시의 인구가 증가하고 경제가 두 배로 성장하는 동안 이루어졌다는 점이다."],[13,"Over 90% of Växjö’s heating and about 50% of its electricity come from biofuels made from leftover wood materials.","Växjö의 난방의 90퍼센트 이상과 전기의 약 50퍼센트는 남은 목재 재료로 만든 바이오 연료에서 나온다."],[14,"Furthermore, local buses and city vehicles run on fuel made from household waste, such as food scraps and gardening waste.","또한, 지역 버스와 시내 차량은 음식물 찌꺼기와 정원 폐기물 같은 가정 폐기물로 만든 연료로 작동한다."]],"w":"14번 문장: 시 버스와 차량이 가정 쓰레기 연료로 달림(일치). 오답: 7번 homes, schools, sports centers 모두 목조(homes만 아님). 13번 90%는 난방, 전기는 약 50%. 10번 인구는 늘었음.","c":3}},{"n":9,"t":"sum","q":"Växjö has (A) its carbon emissions with waste-based energy and timber buildings, showing that going green can go along with economic (B).","h":"27cb4617e1","ko":"Växjö는 폐기물 에너지와 목조 건축으로 탄소 배출량을 (A)했고, 친환경이 경제 (B)와 함께 갈 수 있음을 보여 준다.","oko":["(A) 늘렸다 / (B) 쇠퇴","(A) 줄였다 / (B) 쇠퇴","(A) 늘렸다 / (B) 성장","(A) 무시했다 / (B) 성장","(A) 줄였다 / (B) 성장"],"opts":["(A) raised / (B) decline","(A) cut / (B) decline","(A) raised / (B) growth","(A) ignored / (B) growth","(A) cut / (B) growth"],"r":{"a":"5) (A) cut / (B) growth","ev":"9~13번 문장","s":[[9,"While Växjö hasn’t completely eliminated fossil fuels yet, it has already cut its carbon emissions by 70% since the 1990s.","Växjö는 아직 화석 연료를 완전히 제거하지는 않았지만, 1990년대 이후로 이미 탄소 배출량을 70퍼센트 줄였다."],[10,"What’s even more impressive is that this progress was achieved while the city’s population grew and its economy doubled.","더욱 인상적인 것은 이러한 진전이 도시의 인구가 증가하고 경제가 두 배로 성장하는 동안 이루어졌다는 점이다."],[11,"Växjö shows the world that sustainability and economic growth can go hand in hand.","Växjö는 지속 가능성과 경제 성장이 함께 이루어질 수 있다는 것을 전 세계에 보여준다."],[12,"A key part of its success was turning waste into energy.","그것의 성공 핵심 요소는 폐기물을 에너지로 전환한 것이었다."],[13,"Over 90% of Växjö’s heating and about 50% of its electricity come from biofuels made from leftover wood materials.","Växjö의 난방의 90퍼센트 이상과 전기의 약 50퍼센트는 남은 목재 재료로 만든 바이오 연료에서 나온다."]],"w":"배출량 70% 감축(9번), 경제 성장과 병행(10~11번). 따라서 cut / growth.","c":5}},{"n":10,"t":"fill","q":"Växjö has cut its carbon [A] by 70% by turning waste into energy and building with [B].","h":"e9ce10d5e2","ko":"Växjö는 폐기물을 에너지로 바꾸고 [B]로 건축해 탄소 [A]을 70% 줄였다.","bko":{"emissions":"배출량","population":"인구","economy":"경제","timber":"목재","biofuels":"바이오 연료","architects":"건축가"},"bank":["emissions","population","economy","timber","biofuels","architects"],"r":{"a":"[A] emissions, [B] timber","ev":"6번, 9번, 12번 문장","s":[[6,"Half of all new buildings in the city are constructed from timber, which traps carbon and helps combat climate change.","도시의 모든 신축 건물의 절반은 목재로 지어지는데, 그것은 탄소를 가두고 기후 변화를 막는 데 도움이 된다."],[9,"While Växjö hasn’t completely eliminated fossil fuels yet, it has already cut its carbon emissions by 70% since the 1990s.","Växjö는 아직 화석 연료를 완전히 제거하지는 않았지만, 1990년대 이후로 이미 탄소 배출량을 70퍼센트 줄였다."],[12,"A key part of its success was turning waste into energy.","그것의 성공 핵심 요소는 폐기물을 에너지로 전환한 것이었다."]],"w":"cut its carbon emissions by 70%(9번), timber로 건축(6번). 나머지 단어는 이 문맥에 맞지 않음.","c":null}}]},{"u":8,"id":"r23","no":23,"ko":"진실보다 중요한 ‘눈치’?","items":[{"n":1,"t":"tf","q":"The real participants answered first in Asch's experiment.","h":"f3856bbb0e","ko":"Asch의 실험에서 진짜 참가자들이 먼저 대답했다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"The confederates answered first, intentionally giving incorrect answers.","그 공모자들은 의도적으로 잘못된 답변을 하며 먼저 대답했다."],[8,"The real participants were always required to answer last.","진짜 참가자들은 항상 마지막에 대답하도록 요구되었다."]],"w":"7번: 공모자(confederates)가 먼저 답함. 8번: 진짜 참가자는 항상 마지막에 답하도록 요구됨. 순서가 반대.","c":"F"}},{"n":2,"t":"tf","q":"Only one person in each group was a real participant.","h":"464ef6f98d","ko":"각 집단에서 진짜 참가자는 한 명뿐이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, only one in each group was a real participant — the rest were confederates secretly working with Asch.","그러나, 각 집단에서 오직 한 명만이 진짜였고, 나머지 사람들은 모두 Asch와 비밀리에 협력하는 공모자들이었다."]],"w":"3번 문장 only one in each group was a real participant. 나머지는 공모자. 일치.","c":"T"}},{"n":3,"t":"tf","q":"About one-third of the real participants gave the same wrong answers as the confederates.","h":"fb4fb10570","ko":"진짜 참가자의 약 3분의 1이 공모자와 같은 오답을 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"In the end, about one-third of the real participants chose the same incorrect answers as the confederates in the groups.","결과적으로, 진짜 참가자의 약 3분의 1은 그 집단에 있는 공모자들과 같은 틀린 답을 선택했다."]],"w":"10번 문장 about one-third ... chose the same incorrect answers. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word in the passage?","h":"3f1b5f579b","ko":"밑줄 친 identify의 뜻","opts":["숨기다","반복하다","포기하다","식별하다, 알아내다"],"word":"identify","r":{"a":"4) 식별하다, 알아내다","ev":"6번 문장","s":[[6,"They had to identify which line on the second card matched the length of the first.","그들은 두 번째 카드의 어느 선이 첫 번째 것의 길이와 일치하는지 식별해야 했다."]],"w":"identify는 '식별하다, 알아보다'. 어느 선이 첫 번째 카드의 선과 길이가 같은지 알아내는 상황.","c":4}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in the passage? (다의어)","h":"c18d2c527b","ko":"밑줄 친 followed의 문맥상 뜻 (follow: 따르다 / 뒤따르다)","opts":["(의견을) 따랐던","뒤를 쫓아갔던","그 뒤에 이어진","이해했던"],"word":"followed","r":{"a":"3) 그 뒤에 이어진","ev":"11번 문장","s":[[11,"In interviews that followed, some explained that they doubted their judgment when their answers differed from the majority.","이후 이어진 면담에서, 진짜 참가자들 중 몇몇은 자신의 답변이 다수와 달랐을 때 자신의 판단력을 의심했다고 설명했다."]],"w":"interviews that followed는 '뒤이어 진행된 인터뷰'. 9번 문장의 follow(따르다)와 뜻이 다른 다의어.","c":3}},{"n":6,"t":"ref","q":"What does the underlined 'Others' refer to? (they also refers to the same people)","h":"ddc2d284d5","ko":"밑줄 친 Others(와 이어지는 they)가 가리키는 것","oko":["공모자들","진짜 참가자들 중 일부","Asch","면담 진행자들"],"sko":"다른 참가자들은 그들이 정답을 알았음에도 불구하고","opts":["the confederates","some of the real participants","Asch","the interviewers"],"r":{"a":"2) some of the real participants","ev":"11~12번 문장","s":[[11,"In interviews that followed, some explained that they doubted their judgment when their answers differed from the majority.","이후 이어진 면담에서, 진짜 참가자들 중 몇몇은 자신의 답변이 다수와 달랐을 때 자신의 판단력을 의심했다고 설명했다."],[12,"Others admitted that, although they knew the correct answer, they went along with the group to avoid standing out.","다른 참가자들은 그들이 정답을 알았음에도 불구하고, 눈에 띄는 것을 피하기 위해 그 집단의 의견에 따랐다고 털어놓았다."]],"w":"11번 some explained에 이어 12번 Others admitted: 인터뷰에서 말한 진짜 참가자 중 다른 일부. 공모자는 답을 아는 쪽이라 해당 없음.","c":2}},{"n":7,"t":"sense","q":"Which is closest in meaning to the sentence below? (Sentence 12)","h":"e23a5f35ee","ko":"12번 문장 일부의 의미로 알맞은 것","sko":"그들이 정답을 알았음에도 불구하고, 그 집단의 의견에 따랐다","opts":["정답을 알면서도 눈에 띄지 않으려고 다수의 의견을 따랐다는 의미","정답을 몰라서 다수의 의견을 따랐다는 의미","정답을 알았기 때문에 끝까지 자기 답을 고수했다는 의미","다수가 틀리기를 바라며 일부러 틀린 답을 말했다는 의미"],"r":{"a":"1) 정답을 알면서도 눈에 띄지 않으려고 다수의 의견을 따랐다는 의미","ev":"12번 문장","s":[[12,"Others admitted that, although they knew the correct answer, they went along with the group to avoid standing out.","다른 참가자들은 그들이 정답을 알았음에도 불구하고, 눈에 띄는 것을 피하기 위해 그 집단의 의견에 따랐다고 털어놓았다."]],"w":"12번 문장: although they knew the correct answer, they went along with the group. 알면서도 집단에 맞춘 것. went along with = 동조하다.","c":1}},{"n":8,"t":"match","q":"Which is true about the passage?","h":"bec096ee67","ko":"본문과 일치하는 것","oko":["첫 번째 카드에는 A, B, C로 표시된 세 개의 선이 있었다.","공모자들은 정직한 실수를 한 실제 학생들이었다.","진짜 참가자 모두가 공모자들을 따랐다.","일부 참가자들은 다수와 의견이 다를 때 자신의 판단을 의심했다."],"opts":["The first card showed three lines labeled A, B, and C.","The confederates were real students who made honest mistakes.","All of the real participants followed the confederates.","Some participants doubted their own judgment when they disagreed with the majority."],"r":{"a":"4) Some participants doubted their own judgment when they disagreed with the majority.","ev":"5번, 7번, 10~11번 문장","s":[[5,"The first card showed a single vertical line, while the other card showed three vertical lines of different lengths labeled “A,” “B,” and “C.”","첫 번째 카드에는 하나의 수직선이 있었고, 반면에 다른 카드에는 ‘A’, ‘B’, ‘C’로 표시된 서로 다른 길이의 세 개의 수직선이 있었다."],[7,"The confederates answered first, intentionally giving incorrect answers.","그 공모자들은 의도적으로 잘못된 답변을 하며 먼저 대답했다."],[10,"In the end, about one-third of the real participants chose the same incorrect answers as the confederates in the groups.","결과적으로, 진짜 참가자의 약 3분의 1은 그 집단에 있는 공모자들과 같은 틀린 답을 선택했다."],[11,"In interviews that followed, some explained that they doubted their judgment when their answers differed from the majority.","이후 이어진 면담에서, 진짜 참가자들 중 몇몇은 자신의 답변이 다수와 달랐을 때 자신의 판단력을 의심했다고 설명했다."]],"w":"1
