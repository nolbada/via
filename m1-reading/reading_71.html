var D=[{"n":1,"tag":null,"en":"For Beatrice, Friday began like any other day. She wore the same white socks on both of her foots.","ko":"Beatrice에게 금요일은 어느 다른 날처럼 시작되었다. 그녀는 그녀의 양쪽 발에 똑같은 흰 양말을 신었다.","ok":false,"foot":[],"fixes":[{"wrong":"foots","right":"feet","partial":false,"at":[18],"point":"불규칙 복수형: foot의 복수형은 feet","topic":"불규칙 복수형","memo":"foot의 복수형은 feet"}]},{"n":2,"tag":null,"en":"Then she made an sandwich. She put exact the same amount of peanut butter on each piece of bread.","ko":"그러고 나서 그녀는 샌드위치를 만들었다. 그녀는 각 빵 조각에 정확히 같은 양의 땅콩버터를 발랐다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[3],"point":"관사 a/an: 자음 소리 sandwich 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 sandwich 앞에는 a 사용"},{"wrong":"exact","right":"exactly","partial":false,"at":[7],"point":"형용사와 부사: the same을 꾸미는 말은 부사 exactly 사용","topic":"형용사와 부사","memo":"the same을 꾸미는 말은 부사 exactly 사용"}]},{"n":3,"tag":null,"en":"On her way at school, her neighbor said, \"Good morning, Perfect Girl.\"","ko":"학교에 가는 길에, 그녀의 이웃이 \"좋은 아침이야, 완벽한 소녀.\"라고 말했다.","ok":false,"foot":[],"fixes":[{"wrong":"at","right":"to","partial":false,"at":[3],"point":"기본전치사: '학교로 가는 길'은 way to school","topic":"기본전치사","memo":"'학교로 가는 길'은 way to school"}]},{"n":4,"tag":null,"en":"People called Beatrice \"Perfect Girl\" because she never maked mistakes.","ko":"Beatrice는 한 번도 실수를 하지 않았기 때문에 사람들은 그녀를 '완벽한 소녀'라고 불렀다.","ok":false,"foot":[],"fixes":[{"wrong":"maked","right":"made","partial":false,"at":[8],"point":"불규칙 과거형: make의 과거형은 made","topic":"불규칙 과거형","memo":"make의 과거형은 made"}]},{"n":5,"tag":null,"en":"\"Is you ready for tonight's talent show?\" her neighbor asked. Beatrice just smiled.","ko":"\"오늘 밤 장기 자랑 준비됐니?\"라고 그녀의 이웃이 물었다. Beatrice는 그저 미소를 지었다.","ok":false,"foot":[],"fixes":[{"wrong":"Is","right":"Are","partial":false,"at":[0],"point":"be동사의 의문문: 주어 you에는 Are 사용","topic":"be동사의 의문문","memo":"주어 you에는 Are 사용"}]},{"n":6,"tag":null,"en":"She was an juggling champion. She won the talent show every years.","k for the talent show. The school gym was full of people. They said, \"Look! That's Perfect Girl!\" Beatrice had butterflies in her stomach. \"Will I mess up? I'm worried,\" she thought.","Beatrice threw an egg into the air. Next, she added a salt shaker. Finally, she added a water balloon. What a good start! But then she felt something strange… Uh-oh! Beatrice's nose started to itch. The salt shaker was full of… pepper! \"ACHOO!\" Beatrice missed the water balloon, and it fell to the floor. Then… OOPS! The egg broke on top of her head.","For the first time ever, Beatrice made a mistake. What a surprise! She thought, \"What should I do? Cry? Run off the stage?\" Suddenly, she began to laugh loudly. The people looked at each other. Then everyone started to laugh together.","That night, Beatrice had a deep sleep. The next morning, she woke up with a smile. She put a white sock on her left foot… and a green sock on her right foot!","Now, people no longer call her \"Perfect Girl.\" They just call her Beatrice."];var PASS_KO=["어느 완벽한 소녀의 이야기","Beatrice에게 금요일은 어느 다른 날처럼 시작되었다. 그녀는 그녀의 양쪽 발에 똑같은 흰 양말을 신었다. 그러고 나서 그녀는 샌드위치를 만들었다. 그녀는 각 빵 조각에 정확히 같은 양의 땅콩버터를 발랐다.","학교에 가는 길에, 그녀의 이웃이 \"좋은 아침이야, 완벽한 소녀.\"라고 말했다. Beatrice는 한 번도 실수를 하지 않았기 때문에 사람들은 그녀를 '완벽한 소녀'라고 불렀다. \"오늘 밤 장기 자랑 준비됐니?\"라고 그녀의 이웃이 물었다. Beatrice는 그저 미소를 지었다. 그녀는 저글링 챔피언이었다. 그녀는 매년 장기 자랑에서 우승했다. 그녀는 참 멋졌다!","학교에서 Beatrice는 요리 수업을 들었다. 케이크를 만들기 위해, 그녀는 조심스럽게 냉장고에서 달걀 몇 개를 꺼냈다. 그녀가 뒤돌아보았을 때, 그녀는 미끄러운 무언가를 밟았다. 그녀는 막 넘어지려고 했다! 하지만 그녀는 그러지 않았다. '아슬아슬했어!'라고 그녀는 생각했다. 그녀는 거의 실수할 뻔했다. 이것 때문에, 그녀는 불안을 느끼기 시작했다.","장기 자랑 시간이 되었다. 학교 체육관은 사람들로 가득 찼다. 그들은 \"저기 봐! 저기 완벽한 소녀야!\"라고 말했다. Beatrice는 마음이 편치 않았다. '내가 망칠까? 난 걱정돼.'라고 그녀는 생각했다.","Beatrice는 공중으로 달걀을 던졌다. 다음으로, 그녀는 소금 통을 추가했다. 마지막으로, 그녀는 물풍선을 추가했다. 참 좋은 시작이었다! 하지만 그다음에 그녀는 무언가 이상함을 느꼈다… 이런! Beatrice의 코가 간지럽기 시작했다. 그 소금 통은 가득 차 있었다… 후추로! \"에취!\" Beatrice는 물풍선을 놓쳤고, 그것은 바닥으로 떨어졌다. 그러고 나서… 어이쿠! 달걀이 그녀의 머리 위에서 깨졌다.","난생처음으로, Beatrice는 실수를 했다. 정말 놀라운 일이었다! 그녀는 '내가 무엇을 해야 하지? 울까? 무대에서 도망칠까?'라고 생각했다. 갑자기, 그녀는 큰 소리로 웃기 시작했다. 사람들은 서로를 바라보았다. 그러더니 모두 함께 웃기 시작했다.","그날 밤, Beatrice는 깊은 잠을 잤다. 다음 날 아침, 그녀는 미소를 지으며 일어났다. 그녀는 왼발에 흰 양말을 신었다… 그리고 오른발에는 초록색 양말을 신었다!","이제, 사람들은 더 이상 그녀를 '완벽한 소녀'라고 부르지 않는다. 그들은 그녀를 그저 Beatrice라고 부른다."];var DG=[{"qs":[{"n":1,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["The girl would like to read a book about sea life.","The girl needs some help to choose a book.","The girl has an interest in any kind of animal.","The man recommends a book about animals in the deep sea to her.","The girl likes the man's recommendation."],"a":2,"ans":"The girl has an interest in any kind of animal.","evs":[["Well, I want to read about animals.","음, 저는 동물에 관한 책을 읽고 싶어요."],["I'm curious about sea life.","저는 바다 생물이 궁금해요."]],"ev":["Well, I want to read about animals.","음, 저는 동물에 관한 책을 읽고 싶어요."],"ow":["오답 ✕ — 소녀가 \"I'm curious about sea life.\"(저는 바다 생물이 궁금해요.)라고 했으므로 바다 생물에 관한 책을 읽고 싶다는 말은 대화와 일치함. 그래서 '일치하지 않는 것'이 아님.","오답 ✕ — 소녀가 \"I'm trying to choose a book. Can you help me?\"(제가 책을 고르려고 하는데요. 저를 도와주실 수 있나요?)라고 했으므로 도움이 필요하다는 말은 일치함.","정답 ○ — 남자가 \"What kind of animals are you interested in?\"(어떤 종류의 동물에 관심이 있나요?)이라고 묻자 소녀는 \"I'm curious about sea life.\"(저는 바다 생물이 궁금해요.)라고 답했다. 모든 종류의 동물이 아니라 바다 생물에 관심이 있는 것이므로 일치하지 않음.","오답 ✕ — 남자가 \"what about this book, The Blue Planet? It's about animals in the deep sea.\"(이 책, The Blue Planet은 어때요? 깊은 바다에 사는 동물들에 관한 책이에요.)라고 추천했으므로 일치함.","오답 ✕ — 소녀가 \"That sounds perfect. Thank you.\"(아주 좋아요. 감사합니다.)라고 했으므로 추천을 마음에 들어 하는 것은 일치함."],"memo":["정답 ③: 소녀는 모든 동물이 아니라 '바다 생물'에 관심이 있다.","근거: What kind of animals are you interested in? — I'm curious about sea life.(어떤 동물에 관심이 있나요? — 바다 생물이 궁금해요.)","함정: any kind of animal(어떤 동물이든)은 본문에 없는 말 ✕"],"why":"소녀는 동물 전체가 아니라 바다 생물에 관심이 있어 The Blue Planet을 추천받는다."},{"n":2,"q":"위 대화의 내용을 요약한 문장의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["sea - deep","land - deep","sea - shallow","sky - deep","forest - warm"],"a":0,"ans":"sea - deep","evs":[["I'm curious about sea life.","저는 바다 생물이 궁금해요."],["Then what about this book, The Blue Planet? It's about animals in the deep sea.","그럼 이 책, The Blue Planet은 어때요? 깊은 바다에 사는 동물들에 관한 책이에요."]],"ev":["I'm curious about sea life.","저는 바다 생물이 궁금해요."],"ow":["정답 ○ — 소녀가 \"I'm curious about sea life.\"(저는 바다 생물이 궁금해요.)라고 했고, 남자가 \"It's about animals in the deep sea.\"(깊은 바다에 사는 동물들에 관한 책이에요.)라고 했으므로 sea - deep이 맞음.","오답 ✕ — (B) deep은 맞지만, 소녀는 \"I'm curious about sea life.\"(저는 바다 생물이 궁금해요.)라고 했으므로 land(땅)가 아니라서 틀림.","오답 ✕ — (A) sea는 맞지만, 남자는 \"animals in the deep sea\"(깊은 바다에 사는 동물들)라고 했으므로 shallow(얕은)가 아니라서 틀림.","오답 ✕ — \"I'm curious about sea life.\"(저는 바다 생물이 궁금해요.)이므로 sky(하늘)가 아니고 sea(바다)이다. (B)만 맞고 (A)가 틀림.","오답 ✕ — 소녀가 관심 있는 것은 forest(숲)가 아니라 \"sea life\"(바다 생물)이고, 책은 \"deep sea\"(깊은 바다) 이야기라서 warm도 틀림. 둘 다 틀림."],"memo":["정답 ①: sea(바다) - deep(깊은)","근거: I'm curious about sea life. / animals in the deep sea(바다 생물이 궁금해요. / 깊은 바다에 사는 동물들)","함정: (A)만 맞고 (B)가 틀린 ③ shallow(얕은)에 주의 ✕"],"why":"바다 생물이 궁금한 소녀에게 깊은 바다 동물에 관한 책이 추천된다.","sum":"The girl wants to read about animals and is curious about (A)________ life, so the man recommends a book about animals in the (B)________ sea.","lab":"완성된 요약문 : "}],"dlg":[["G","Excuse me. I'm trying to choose a book. Can you help me?","실례합니다. 제가 책을 고르려고 하는데요. 저를 도와주실 수 있나요?"],["M","Sure. What kind of book are you looking for?","물론이죠. 어떤 종류의 책을 찾고 있나요?"],["G","Well, I want to read about animals.","음, 저는 동물에 관한 책을 읽고 싶어요."],["M","Okay. Books about animals are on this shelf. What kind of animals are you interested in?","좋아요. 동물에 관한 책들은 이 책장에 있어요. 어떤 종류의 동물에 관심이 있나요?"],["G","I'm curious about sea life.","저는 바다 생물이 궁금해요."],["M","Then what about this book, The Blue Planet? It's about animals in the deep sea.","그럼 이 책, The Blue Planet은 어때요? 깊은 바다에 사는 동물들에 관한 책이에요."],["G","That sounds perfect. Thank you.","아주 좋아요. 감사합니다."],["M","You're welcome.","천만에요."]]},{"qs":[{"n":3,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["Sofia는 판타지 소설을 읽고 있다.","<호빗>은 마법의 세계에서의 모험에 관한 이야기 이다.","소년은 <호빗>에 대한 설명을 해줄 것을 요청한다.","Sofia는 소년에게 책을 빌려 보라고 권하고 있다.","소년은 <호빗>을 새로 사서 읽을 것이다."],"a":4,"ans":"소년은 <호빗>을 새로 사서 읽을 것이다.","evs":[["Why don't you borrow it? You'll like it.","그걸 빌려 보는 게 어때? 마음에 들 거야."],["Okay. I'll try reading it.","좋아. 읽어 볼게."]],"ev":["Why don't you borrow it? You'll like it.","그걸 빌려 보는 게 어때? 마음에 들 거야."],"ow":["오답 ✕ — Sofia가 \"I'm reading The Hobbit.\"(나는 The Hobbit을 읽고 있어.)라 하고 \"It's a fantasy novel.\"(그건 판타지 소설이야.)이라고 했으므로 일치함.","오답 ✕ — Sofia가 \"It is about adventures in a magical world.\"(마법의 세계에서의 모험에 관한 이야기야.)라고 했으므로 일치함.","오답 ✕ — 소년이 \"Can you tell me about it?\"(그것에 대해 말해 줄래?)이라고 했으므로 설명을 요청한 것이 맞고 일치함.","오답 ✕ — Sofia가 \"Why don't you borrow it?\"(그걸 빌려 보는 게 어때?)이라고 했으므로 빌려 보라고 권하는 것이 맞고 일치함.","정답 ○ — 본문에는 Sofia가 \"Why don't you borrow it?\"(그걸 빌려 보는 게 어때?)라고 했고 소년이 \"Okay. I'll try reading it.\"(좋아. 읽어 볼게.)이라고 했다. 빌려서 읽는 것이지 새로 사서 읽는 것이 아니므로 일치하지 않음."],"memo":["정답 ⑤: 소년은 책을 새로 사는 것이 아니라 '빌려' 읽을 것이다.","근거: Why don't you borrow it? — Okay. I'll try reading it.(빌려 보는 게 어때? — 좋아. 읽어 볼게.)","함정: borrow(빌리다)와 buy(사다)를 바꾼 보기 ✕"],"why":"소년은 Sofia의 권유로 The Hobbit을 빌려 읽어 볼 것이다."}],"dlg":[["B","Sofia, what are you reading?","Sofia, 너 뭐 읽고 있니?"],["G","I'm reading The Hobbit.","나는 The Hobbit을 읽고 있어."],["B","Can you tell me about it?","그것에 대해 말해 줄래?"],["G","It's a fantasy novel. It is about adventures in a magical world.","그건 판타지 소설이야. 마법의 세계에서의 모험에 관한 이야기야."],["B","It sounds interesting. I'm curious about the story.","재미있겠다. 그 이야기가 궁금해."],["G","Why don't you borrow it? You'll like it.","그걸 빌려 보는 게 어때? 마음에 들 거야."],["B","Okay. I'll try reading it.","좋아. 읽어 볼게."]]},{"qs":[{"n":4,"q":"위 대화의 목적으로 알맞은 것은?","o":["영화 리뷰하기","좋은 책 소개하기","동물 보호의 중요성 알리기","책을 많이 읽도록 장려하기","새로 개봉한 영화 홍보하기"],"a":1,"ans":"좋은 책 소개하기","evs":[["Today, we're going to talk about a good book.","오늘은 좋은 책에 대해 이야기할 거예요."],["Can you tell our viewers about the story?","시청자분들께 그 이야기를 알려 줄 수 있어요?"]],"ev":["Today, we're going to talk about a good book.","오늘은 좋은 책에 대해 이야기할 거예요."],"ow":["오답 ✕ — 영화 버전 이야기(\"there is a movie version of the story\")가 잠깐 나오지만, 대화의 중심은 책이라서 영화 리뷰가 목적은 아님.","정답 ○ — \"Today, we're going to talk about a good book.\"(오늘은 좋은 책에 대해 이야기할 거예요.)라고 시작해서 Charlotte's Web의 줄거리를 소개하므로 좋은 책 소개하기가 목적임.","오답 ✕ — 거미 Charlotte와 돼지 Wilbur가 나오지만, 동물 보호가 중요하다는 말은 없고 \"We can learn about true friendship from this story.\"(진정한 우정을 배울 수 있어요.)라고 했으므로 틀림.","오답 ✕ — 대화에는 책을 많이 읽자고 장려하는 말이 없다. 특정한 책 한 권을 소개할 뿐이라서 틀림.","오답 ✕ — 영화 이야기는 \"I loved it.\"(정말 좋았어요.) 정도의 감상이고, 새로 개봉한 영화를 홍보하는 내용은 없어서 틀림."],"memo":["정답 ② 좋은 책 소개하기","근거: Today, we're going to talk about a good book.(오늘은 좋은 책에 대해 이야기할 거예요.)","함정: 영화 이야기는 곁가지일 뿐, 중심은 책 소개이다 ✕"],"why":"Tony와 Ivy가 채널에서 Charlotte's Web이라는 좋은 책을 소개하는 대화이다."},{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["Tony와 Ivy는 오늘 영화에 대해 이야기한다.","Charlotte's Web은 Ivy가 쓴 책이다.","Charlotte는 어린 돼지이다.","Charlotte는 Wilbur를 위험에서 구한다.","이 이야기에는 영화 버전이 없다."],"a":3,"ans":"Charlotte는 Wilbur를 위험에서 구한다.","evs":[["Charlotte saves Wilbur from danger, and they become close friends.","Charlotte가 Wilbur를 위험에서 구하고, 그들은 친한 친구가 돼요."]],"ev":["Charlotte saves Wilbur from danger, and they become close friends.","Charlotte가 Wilbur를 위험에서 구하고, 그들은 친한 친구가 돼요."],"ow":["오답 ✕ — Ivy가 \"Today, we're going to talk about a good book.\"(오늘은 좋은 책에 대해 이야기할 거예요.)라고 했으므로 오늘 이야기하는 것은 영화가 아니라 책이라서 틀림.","오답 ✕ — Tony가 \"The book is Charlotte's Web by E.B. White.\"(그 책은 E.B. White가 쓴 Charlotte's Web이에요.)라고 했으므로 지은이는 Ivy가 아니라 E.B. White임.","오답 ✕ — Tony가 \"Charlotte, a wise spider, and Wilbur, a little pig\"(현명한 거미 Charlotte와 어린 돼지 Wilbur)라고 했으므로 Charlotte는 돼지가 아니라 거미임.","정답 ○ — \"Charlotte saves Wilbur from danger, and they become close friends.\"(Charlotte가 Wilbur를 위험에서 구하고, 그들은 친한 친구가 돼요.)라고 했으므로 맞음.","오답 ✕ — Tony가 \"Also, there is a movie version of the story.\"(또 그 이야기의 영화 버전도 있어요.)라고 했으므로 영화 버전이 있어서 틀림."],"memo":["정답 ④: Charlotte는 Wilbur를 위험에서 구한다.","근거: Charlotte saves Wilbur from danger.(Charlotte가 Wilbur를 위험에서 구하고)","함정: ③ 거미는 Charlotte, 돼지는 Wilbur — 서로 바꾸면 ✕"],"why":"거미 Charlotte가 돼지 Wilbur를 위험에서 구해 주고 둘은 친구가 된다."}],"dlg":[["B","Hi, everyone! Welcome to our channel! I'm Tony.","여러분 안녕하세요! 저희 채널에 오신 걸 환영합니다! 저는 Tony예요."],["G","And I'm Ivy. Today, we're going to talk about a good book.","그리고 저는 Ivy예요. 오늘은 좋은 책에 대해 이야기할 거예요."],["B","Right. The book is Charlotte's Web by E.B. White.","맞아요. 그 책은 E.B. White가 쓴 Charlotte's Web이에요."],["G","Can you tell our viewers about the story?","시청자분들께 그 이야기를 알려 줄 수 있어요?"],["B","Sure. It's about Charlotte, a wise spider, and Wilbur, a little pig. Charlotte saves Wilbur from danger, and they become close friends.","물론이죠. 현명한 거미 Charlotte와 어린 돼지 Wilbur에 관한 이야기예요. Charlotte가 Wilbur를 위험에서 구하고, 그들은 친한 친구가 돼요."],["G","We can learn about true friendship from this story.","우리는 이 이야기에서 진정한 우정에 대해 배울 수 있어요."],["B","Yes. Also, there is a movie version of the story.","네. 또 그 이야기의 영화 버전도 있어요."],["G","How did you like the movie? I'm curious about your opinion.","영화는 어땠어요? 당신의 의견이 궁금해요."],["B","I loved it. I think our viewers will enjoy both the book and the movie.","정말 좋았어요. 시청자분들이 책과 영화 둘 다 즐기실 거라고 생각해요."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["Beatrice에게 금요일은 여느 다른 날들과 달랐다.","Beatrice는 땅콩버터가 들어간 햄버거를 만들었다.","Beatrice는 이웃들이 자신을 '완벽한 소녀'라고 불러 주기를 바랐다.","Beatrice는 실수를 한 번도 하지 않은 저글링 챔피언이었다.","Beatrice는 올해 장기 자랑에는 참여하지 않을 것이다."],"a":3,"ans":"Beatrice는 실수를 한 번도 하지 않은 저글링 챔피언이었다.","evs":[["People called Beatrice \"Perfect Girl\" because she never made mistakes.","Beatrice는 한 번도 실수를 하지 않았기 때문에 사람들은 그녀를 '완벽한 소녀'라고 불렀다."],["She was a juggling champion.","그녀는 저글링 챔피언이었다."]],"ev":["People called Beatrice \"Perfect Girl\" because she never made mistakes.","Beatrice는 한 번도 실수를 하지 않았기 때문에 사람들은 그녀를 '완벽한 소녀'라고 불렀다."],"ow":["오답 ✕ — 본문에는 \"For Beatrice, Friday began like any other day.\"(Beatrice에게 금요일은 어느 다른 날처럼 시작되었다.)라고 했는데 이 보기는 다른 날들과 달랐다고 해서 틀림.","오답 ✕ — 본문에는 \"Then she made a sandwich.\"(그러고 나서 그녀는 샌드위치를 만들었다.)라고 했는데 이 보기는 땅콩버터가 들어간 햄버거라고 해서 틀림. 땅콩버터는 샌드위치에 발랐다.","오답 ✕ — 이웃이 \"Good morning, Perfect Girl.\"이라고 부른 것은 있지만, Beatrice가 그렇게 불러 주기를 '바랐다'는 말은 본문에 ge?\"(내가 무엇을 해야 하지? 울까? 무대에서 도망칠까?)라고 생각했으므로 일치함.","오답 ✕ — \"She put a white sock on her left foot… and a green sock on her right foot!\"(왼발엔 흰 양말, 오른발엔 초록색 양말)와 \"people no longer call her 'Perfect Girl.'\"(사람들은 더 이상 그녀를 '완벽한 소녀'라고 부르지 않는다.)이므로 일치함."],"memo":["정답 ③: 물풍선이 바닥에 떨어지고 달걀이 머리 위에서 깨졌다(보기는 반대로 써서 ✕).","근거: water balloon fell to the floor / The egg broke on top of her head.(물풍선은 바닥으로 / 달걀은 머리 위에서 깨짐)","함정: 달걀과 물풍선의 위치를 바꾼 보기에 주의 ✕"],"why":"바닥에 떨어진 것은 물풍선이고, 머리 위에서 깨진 것은 달걀이다."}],"pp":[["Beatrice threw an egg into the air.","Beatrice는 공중으로 달걀을 던졌다."],["Next, she added a salt shaker.","다음으로, 그녀는 소금 통을 추가했다."],["Finally, she added a water balloon.","마지막으로, 그녀는 물풍선을 추가했다."],["What a good start!","참 좋은 시작이었다!"],["But then she felt something strange… Uh-oh!","하지만 그다음에 그녀는 무언가 이상함을 느꼈다… 이런!"],["Beatrice's nose started to itch.","Beatrice의 코가 간지럽기 시작했다."],["The salt shaker was full of… pepper!","그 소금 통은 가득 차 있었다… 후추로!"],["\"ACHOO!\"","\"에취!\""],["Beatrice missed the water balloon, and it fell to the floor.","Beatrice는 물풍선을 놓쳤고, 그것은 바닥으로 떨어졌다."],["Then… OOPS!","그러고 나서… 어이쿠!"],["The egg broke on top of her head.","달걀이 그녀의 머리 위에서 깨졌다."],["For the first time ever, Beatrice made a mistake.","난생처음으로, Beatrice는 실수를 했다."],["What a surprise!","정말 놀라운 일이었다!"],["She thought, \"What should I do?","그녀는 '내가 무엇을 해야 하지?"],["Cry?","울까?"],["Run off the stage?\"","무대에서 도망칠까?'라고 생각했다."],["Suddenly, she began to laugh loudly.","갑자기, 그녀는 큰 소리로 웃기 시작했다."],["The people looked at each other.","사람들은 서로를 바라보았다."],["Then everyone started to laugh together.","그러더니 모두 함께 웃기 시작했다."],["That night, Beatrice had a deep sleep.","그날 밤, Beatrice는 깊은 잠을 잤다."],["The next morning, she woke up with a smile.","다음 날 아침, 그녀는 미소를 지으며 일어났다."],["She put a white sock on her left foot… and a green sock on her right foot!","그녀는 왼발에 흰 양말을 신었다… 그리고 오른발에는 초록색 양말을 신었다!"],["Now, people no longer call her \"Perfect Girl.\"","이제, 사람들은 더 이상 그녀를 '완벽한 소녀'라고 부르지 않는다."],["They just call her Beatrice.","그들은 그녀를 그저 Beatrice라고 부 function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function load(){try{var v=localStorage.getItem(BK);return v==null?null:+v}catch(e){return null}}

document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){done[+b.dataset.sub]=true;logA(+b.dataset.sub);render();
  var tot=0,fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}

var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}

});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}

document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
