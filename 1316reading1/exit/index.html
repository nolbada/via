<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}

:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}

body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}

.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}

button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}

.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>

<script>
var P=[{"u":1,"id":"nl1-01-1","no":1,"ko":"비 냄새는 어디서 오는 걸까?","items":[{"n":1,"t":"tf","q":"Rain itself has a smell.","ko":"비 자체에 냄새가 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"Some people think it’s the smell of the rain itself.","어떤 사람들은 그것이 비 자체의 냄새라고 생각한다."],[4,"But rain doesn’t have a smell.","하지만 비는 냄새를 가지고 있지 않다."]],"w":"3번에서 사람들은 비 자체의 냄새라고 생각하지만, 4번에서 But rain doesn’t have a smell(하지만 비는 냄새를 가지고 있지 않다)이라고 해요. 비에 냄새가 있다는 말은 반대예요.","c":"F"},"h":"10d805fca2"},{"n":2,"t":"tf","q":"The bacteria live in the wet soil.","ko":"박테리아는 축축한 흙에 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"These bacteria live in the wet soil.","이 박테리아는 축축한 흙에 산다."]],"w":"6번 문장에 These bacteria live in the wet soil(이 박테리아는 축축한 흙에 산다)이 그대로 나와요.","c":"T"},"h":"2f136f3a5f"},{"n":3,"t":"tf","q":"Geosmin is usually located in the air.","ko":"지오스민은 보통 공기 중에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"It is usually located between rocks.","그것은 보통 바위들 사이에 있다."]],"w":"9번에서 지오스민은 보통 바위들 사이에 있다(located between rocks)고 해요. 공기 속에 있는 것은 비가 온 뒤에 일어나는 일이에요.","c":"F"},"h":"36a79ca28e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Geosmin has a unique smell that we all recognize.)","ko":"지오스민은 우리 모두가 인식하는 독특한 냄새를 가지고 있다.","opts":["흔한","약한","평범한","독특한"],"word":"unique","r":{"a":"4) 독특한","ev":"8번 문장","s":[[8,"Geosmin has a unique smell that we all recognize.","지오스민은 우리 모두가 인식하는 독특한 냄새를 가지고 있다."]],"w":"8번에서 지오스민은 우리 모두가 알아보는 특별한 냄새를 가졌다고 해요. unique = 독특한, 하나뿐인 느낌이에요.","c":4},"h":"bfe8b0800b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It has an earthy scent.)","ko":"그것은 흙냄새를 가지고 있다.","opts":["바다 냄새가 나는","꽃향기가 나는","흙냄새가 나는","불 냄새가 나는"],"word":"earthy","r":{"a":"3) 흙냄새가 나는","ev":"2번 문장","s":[[2,"It has an earthy scent.","그것은 흙냄새를 가지고 있다."]],"w":"2번은 비 온 뒤 공기에서 나는 냄새를 말해요. 흙에서 올라오는 냄새니까 earthy는 '흙냄새가 나는'이에요.","c":3},"h":"7e7538d4e8"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis causes it to enter the air.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이것은 그것이 공기에 들어가게 한다.","opts":["비","지오스민","박테리아","바위"],"r":{"a":"2) 지오스민","ev":"10~11번 문장","s":[[10,"When it rains, water hits the geosmin.","비가 오면, 빗물이 지오스민을 튕겨낸다."],[11,"This causes it to enter the air.","이것은 지오스민이 공기에 들어가게 한다."]],"w":"11번의 it은 앞 문장(10번)에서 빗물이 튕겨낸 geosmin(지오스민)이에요. 지오스민이 공기에 들어가는 거예요.","c":2},"h":"c91b1223eb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why we can smell an earthy scent on a rainy day.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 우리는 비 오는 날에 흙냄새를 맡을 수 있다.","opts":["앞에서 말한 과정 때문에 우리는 비 오는 날 흙냄새를 맡을 수 있다.","그것이 우리가 비 오는 날을 좋아하는 이유이다.","비 오는 날에는 우리가 냄새를 전혀 맡을 수 없다.","흙냄새가 나기 때문에 비가 오기 시작한다."],"r":{"a":"1) 앞에서 말한 과정 때문에 우리는 비 오는 날 흙냄새를 맡을 수 있다.","ev":"13번 문장","s":[[13,"That’s why we can smell an earthy scent on a rainy day.","그래서 우리는 비 오는 날에 흙냄새를 맡을 수 있다."]],"w":"That’s why는 '그래서 ~다'라는 뜻이고, 뒤에 결과가 와요. 그래서 비 오는 날 흙냄새를 맡을 수 있다는 뜻이에요.","c":1},"h":"e73ab3c597"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["비 자체가 지오스민을 만들어 낸다.","지오스민은 아무 냄새도 없는 물질이다.","박테리아가 지오스민이라는 물질을 만들어 낸다.","지오스민은 비가 오기 전에 이미 공기 속에 있다."],"opts":["Rain itself produces geosmin.","Geosmin is a substance with no smell.","Bacteria produce a substance called geosmin.","Geosmin is already in the air before it rains."],"r":{"a":"3) Bacteria produce a substance called geosmin.","ev":"7번 문장","s":[[7,"They produce something called geosmin.","그들은 geosmin(지오스민)이라고 불리는 것을 만들어 낸다."]],"w":"7번에서 박테리아(They)가 geosmin이라 불리는 것을 만들어 낸다고 해요. 나머지는 본문과 달라요. 빗물이 지오스민을 만드는 게 아니고(7번), 지오스민에는 냄새가 있어요(8번).","c":3},"h":"ec5ce0b4f1"},{"n":9,"t":"sum","q":"In the air, (A) carries the geosmin to our (B).","ko":"공기 중에서 (A)이(가) 지오스민을 우리 (B)(으)로 옮긴다.","oko":["(A) 바람 / (B) 귀","(A) 수분 / (B) 귀","(A) 연기 / (B) 코","(A) 먼지 / (B) 눈","(A) 수분 / (B) 코"],"opts":["(A) wind / (B) ears","(A) moisture / (B) ears","(A) smoke / (B) noses","(A) dust / (B) eyes","(A) moisture / (B) noses"],"r":{"a":"5) (A) moisture / (B) noses ((A) .","c":"T"},"h":"3b1f9ac2ef"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The term “dog days” came from the ancient Greeks.)","ko":"‘dog days’라는 용어는 고대 그리스인들로부터 왔다.","opts":["현대의","고대의","유명한","용감한"],"word":"ancient","r":{"a":"2) 고대의","ev":"3번 문장","s":[[3,"The term “dog days” came from the ancient Greeks.","‘dog days’라는 용어는 고대 그리스인들로부터 왔다."]],"w":"3번은 ‘dog days’라는 말이 누구에게서 왔는지 말해요. 4번의 Long ago(오래전에)와 이어지므로 ancient는 ‘고대의, 아주 오래된’이에요.","c":2},"h":"1f81721762"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is very hot, and the sun is shining brightly.)","ko":"매우 덥고 태양은 밝게 빛나고 있다.","opts":["숨어 있는","식어 가는","빛나고 있는","떨어지는"],"word":"shining","r":{"a":"3) 빛나고 있는","ev":"1번 문장","s":[[1,"It is very hot, and the sun is shining brightly.","매우 덥고 태양은 밝게 빛나고 있다."]],"w":"1번은 매우 더운 날의 모습이에요. 태양이 brightly(밝게) 빛나고 있다는 뜻이라서 shining은 ‘빛나고 있는’이에요. shine(빛나다)의 -ing형이에요.","c":3},"h":"e5dd5894f8"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt rises and sets with the sun as well.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 또한 태양과 함께 뜨고 진다.","opts":["태양","큰개자리","여름","시리우스"],"r":{"a":"4) 시리우스","ev":"6~7번 문장","s":[[6,"During the hottest part of summer, Sirius is very close to the sun.","여름의 가장 더운 기간 동안, 시리우스는 태양에 매우 가깝다."],[7,"It rises and sets with the sun as well.","그것은 또한 태양과 함께 뜨고 진다."]],"w":"7번의 It은 앞 문장(6번)의 주어 Sirius예요. 시리우스가 태양과 함께 뜨고 진다는 두 번째 이유를 말해요.","c":4},"h":"95061a5614"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Today, the dog days usually start in early July and end in the middle of August.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘날, 삼복더위는 보통 7월 초에 시작해서 8월 중순에 끝난다.","opts":["오늘날 삼복더위는 보통 7월 초에 시작해서 8월 중순에 끝난다.","오늘날 삼복더위는 보통 7월 중순에 시작해서 8월 초에 끝난다.","오늘날 삼복더위는 보통 6월 초에 시작해서 7월 중순에 끝난다.","오늘날 삼복더위는 8월 초에 시작해서 9월 중순에 끝난다."],"r":{"a":"1) 오늘날 삼복더위는 보통 7월 초에 시작해서 8월 중순에 끝난다.","ev":"9번 문장","s":[[9,"Today, the dog days usually start in early July and end in the middle of August.","오늘날, 삼복더위는 보통 7월 초에 시작해서 8월 중순에 끝난다."]],"w":"Today(오늘날)로 시작해서 지금의 dog days 기간을 말해요. early July는 7월 초, the middle of August는 8월 중순이에요.","c":1},"h":"f4d30f0463"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["시리우스는 태양의 다른 이름이다.","시리우스는 태양이 진 뒤에 뜬다.","고대 그리스인들은 큰개자리에 있는 별을 보았다.","삼복더위는 겨울의 가장 추운 날들이다."],"opts":["Sirius is another name for the sun.","Sirius rises after the sun sets.","The ancient Greeks looked at a star in Canis Major.","The dog days are the coldest days of winter."],"r":{"a":"3) The ancient Greeks looked at a star in Canis Major. (고대 그리스인들은 큰개자리에 있는 별을 보았다.)","ev":"4번 문장","s":[[4,"Long ago, they watched the brightest star in Canis Major.","오래전에, 그들은 큰개자리에 있는 가장 밝은 별을 관찰했다."]],"w":"4번에서 그리스인들은 큰개자리(Canis Major)에 있는 별을 관찰했어요. 시리우스는 태양의 다른 이름이 아니고(5번), 태양과 함께 뜨고 져요(7번). dog days는 여름의 더운 기간이에요(2번).","c":3},"h":"7f8a8c7e39"},{"n":9,"t":"sum","q":"The ancient Greeks (A) that the hot (B) was caused by two stars.","ko":"고대 그리스인들은 더운 (B)이(가) 두 개의 별 때문에 생긴다고 (A).","oko":["(A) 잊었다 / (B) 날씨","(A) 믿었다 / (B) 물","(A) 부인했다 / (B) 날씨","(A) 믿었다 / (B) 날씨","(A) 믿었다 / (B) 겨울"],"opts":["(A) forgot / (B) weather","(A) believed / (B) water","(A) denied / (B) weather","(A) believed / (B) weather","(A) believed / (B) winter"],"r":{"a":"4) (A) believed / (B) weather ((A) 믿었다 / (B) 날씨)","ev":"8번 문장","s":[[8,"Therefore, the ancient Greeks believed the hot weather was caused by these two stars.","따라서, 고대 그리스인들은 더운 날씨가 이 두 개의 별에 의해 야기되었다고 믿었다."]],"w":"8번에서 고대 그리스인들은 더운 날씨(weather)가 이 두 개의 별에 의해 생긴다고 믿었다(believed)고 해요. 잊었다(forgot)거나 부인했다(denied)는 말은 본문에 없어요.","c":4},"h":"75737ac911"},{"n":10,"t":"fill","q":"The term “dog days” came from the ancient Greeks. Long ago, they [A] the [B] star in Canis Major.","ko":"‘dog days’라는 용어는 고대 그리스인들로부터 왔다. 오래전에, 그들은 큰개자리에 있는 [B] 별을 [A].","bank":["watched","brightest","during","with","also","today"],"bko":{"watched":"관찰했다(watch의 과거)","brightest":"가장 밝은","during":"~ 동안","with":"~와 함께","also":"또한","today":"오늘날"},"a":"[A] watched, [B] brightest","r":{"a":"[A] watched (관찰했다(watch의 과거)), [B] brightest (가장 밝은)","ev":"3~4번 문장","s":[[3,"The term “dog days” came from the ancient Greeks.","‘dog days’라는 용어는 고대 그리스인들로부터 왔다."],[4,"Long ago, they watched the brightest star in Canis Major.","오래전에, 그들은 큰개자리에 있는 가장 밝은 별을 관찰했다."]],"w":"4번에서 Long ago, they watched the brightest star in Canis Major(오래전에 그들은 큰개자리에서 가장 밝은 별을 관찰했다)라고 해요. they 뒤에는 동사 watched(watch의 과거), the와 star 사이에는 형용사 brightest가 와요.","c":null},"h":"5adef9067d"}]},{"u":1,"id":"nl1-01-3","no":3,"ko":"달걀 껍질의 쓸모 있는 변신","items":[{"n":1,"t":"tf","q":"Eggshells contain a lot of calcium carbonate.","ko":"달걀 껍질에는 탄산칼슘이 많이 들어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Eggshells contain lots of calcium carbonate.","달걀 껍질에는 탄산칼슘이 많이 들어 있다."]],"w":"4번 문장에 Eggshells contain lots of calcium carbonate(달걀 껍질에는 탄산칼슘이 많이 들어 있다)가 나와요.","c":"T"},"h":"d9f7831b31"},{"n":2,"t":"tf","q":"Tomato plants rot easily when they get enough calcium.","ko":"토마토는 칼슘을 충분히 얻으면 쉽게 썩는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Without enough calcium, these plants easily rot.","충분한 칼슘이 없으면 이 식물은 쉽게 썩는다."]],"w":"8번에서 칼슘이 충분하지 않으면(Without enough calcium) 토마토가 쉽게 썩는다고 해요. 칼슘이 충분하면 썩는다는 말은 반대예요.","c":"F"},"h":"dd00157e5e"},{"n":3,"t":"tf","q":"Crushing eggshells helps them break down faster.","ko":"달걀 껍질을 으깨면 더 빨리 분해되도록 도와준다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"This helps the eggshells break down faster.","이것은 달걀 껍질이 더 빨리 분해되도록 도와준다."]],"w":"13번에서 This helps the eggshells break down faster(이것은 달걀 껍질이 더 빨리 분해되도록 도와준다)라고 해요. This는 12번의 잘게 부수는 일이에요.","c":"T"},"h":"8c11e7ed40"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Eggshells contain lots of calcium carbonate.)","ko":"달걀 껍질에는 탄산칼슘이 많이 들어 있다.","opts":["버리다","들어 있다","섞다","없애다"],"word":"contain","r":{"a":"2) 들어 있다","ev":"4번 문장","s":[[4,"Eggshells contain lots of calcium carbonate.","달걀 껍질에는 탄산칼슘이 많이 들어 있다."]],"w":"4번은 달걀 껍질 안에 탄산칼슘이 많다는 말이에요. contain은 안에 ‘들어 있다’는 뜻이에요.","c":2},"h":"ab047d5fdb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Finally, sprinkle the crushed eggshells onto the soil around your plants.)","ko":"마지막으로, 으깨진 달걀 껍질을 식물 주변의 흙 위에 흩뿌려라.","opts":["끓이다","얼리다","태우다","흩뿌리다"],"word":"sprinkle","r":{"a":"4) 흩뿌리다","ev":"14번 문장","s":[[14,"Finally, sprinkle the crushed eggshells onto the soil around your plants.","마지막으로, 으깨진 달걀 껍질을 식물 주변의 흙 위에 흩뿌려라."]],"w":"14번은 비료 만들기의 마지막 단계예요. 으깬 달걀 껍질을 흙 위에 골고루 ‘흩뿌리라’는 뜻이에요.","c":4},"h":"6f84e95677"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey make plants healthy.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것은 식물을 건강하게 만들어 준다.","opts":["달걀 껍질","식물","토마토","비료"],"r":{"a":"1) 달걀 껍질","ev":"2~3번 문장","s":[[2,"Then don’t throw away eggshells.","그렇다면 달걀 껍질을 버리지 마라."],[3,"They make plants healthy.","그것은 식물을 건강하게 만들어 준다."]],"w":"3번의 They는 앞 문장(2번)의 eggshells(달걀 껍질)예요. 달걀 껍질이 식물을 건강하게 만들어 준다는 말이에요.","c":1,"k":"They = 달걀 껍질"},"pron":"They","h":"a2352765fb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you have plants, try making eggshell fertilizer today!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 당신이 식물을 기른다면, 오늘 달걀 껍질 비료를 만들어 보아라!","opts":["식물을 기른다면 오늘 달걀 껍질을 모두 버려라.","식물이 없다면 오늘 달걀 껍질 비료를 사라.","식물을 기른다면 오늘 달걀 껍질 비료를 만들어 보라.","달걀 껍질 비료를 만들려고 애쓰지 마라."],"r":{"a":"3) 식물을 기른다면 오늘 달걀 껍질 비료를 만들어 보라.","ev":"15번 문장","s":[[15,"If you have plants, try making eggshell fertilizer today!","만약 당신이 식물을 기른다면, 오늘 달걀 껍질 비료를 만들어 보아라!"]],"w":"If you have plants는 ‘식물을 기른다면’, try making ~은 ‘만들어 보라’는 뜻이에요. 1번의 Do you grow plants?와 이어지는 마무리 문장이에요.","c":3},"h":"857c9d3c9e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["달걀 껍질은 식물의 뿌리를 약하게 만든다.","달걀 껍질은 특히 토마토에 좋다.","달걀 껍질은 식물에 쓸모가 없다.","달걀 껍질을 부수기 전에 흙 위에 뿌려야 한다."],"opts":["Eggshells make plants’ roots weak.","Eggshells are especially good for tomato plants.","Eggshells are not useful for plants.","You should sprinkle the eggshells before you crush them."],"r":{"a":"2) Eggshells are especially good for tomato plants. (달걀 껍질은 특히 토마토에 좋다.)","ev":"7번 문장","s":[[7,"Eggshells are especially good for tomato plants.","달걀 껍질은 특히 토마토에 좋다."]],"w":"7번에서 달걀 껍질은 특히 토마토에 좋다고 해요. 달걀 껍질은 뿌리를 튼튼하게 하고(5번), 식물에 쓸모가 있으며(3번), 부수는 일은 흙에 뿌리기 전에 해요(12~14번).","c":2},"h":"ac514d19ed"},{"n":9,"t":"sum","q":"The (A) of eggshells also keeps (B) away.","ko":"달걀 껍질의 (A)은(는) 또한 (B)을(를) 쫓아낸다.","oko":["(A) 색 / (B) 해충","(A) 냄새 / (B) 새","(A) 냄새 / (B) 해충","(A) 맛 / (B) 해충","(A) 색 / (B) 새"],"opts":["(A) color / (B) pests","(A) smell / (B) birds","(A) smell / (B) pests","(A) taste / (B) pests","(A) color / (B) birds"],"r":{"a":"3) (A) smell / (B) pests ((A) 냄새 / (B) 해충)","ev":"9번 문장","s":[[9,"The smell of eggshells also keeps pests away.","달걀 껍질의 냄새는 또한 해충을 쫓는다."]],"w":"9번에서 달걀 껍질의 냄새(smell)는 해충(pests)을 쫓는다고 해요. 색, 맛, 새는 본문에 나오지 않아요.","c":3},"h":"7542cab605"},{"n":10,"t":"fill","q":"Do you [A] plants? Then don’t [B] away eggshells.","ko":"당신은 식물을 [A]는가? 그렇다면 달걀 껍질을 [B]지 마라.","bank":["grow","throw","healthy","small","easily","strong"],"bko":{"grow":"기르다","throw":"던지다(throw away는 버리다)","healthy":"건강한","small":"작은","easily":"쉽게","strong":"튼튼한"},"a":"[A] grow, [B] throw","r":{"a":"[A] grow (기르다), [B] throw (던지다(throw away는 버리다))","ev":"1~2번 문장","s":[[1,"Do you grow plants?","당신은 식물을 기르는가?"],[2,"Then don’t throw away eggshells.","그렇다면 달걀 껍질을 버리지 마라."]],"w":"1번 Do you grow plants?(당신은 식물을 기르는가?)와 2번 Then don’t throw away eggshells.(그렇다면 달걀 껍질을 버리지 마라.)에서 가져왔어요. Do you 뒤와 don’t 뒤에는 동사 원형이 와요.","c":null},"h":"d1eda89ee4"}]},{"u":1,"id":"nl1-01-4","no":4,"ko":"어떤 고래의 놀라운 적응력","items":[{"n":1,"t":"tf","q":"Eden’s whales in the Gulf of Thailand come to the surface for the same reason as other whales.","ko":"태국만의 에덴 고래는 다른 고래들과 같은 이유로 수면으로 온다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"They are mammals, so they must come to the surface of the ocean to breathe.","그들은 포유류라서 숨을 쉬기 위해 해수면으로 와야 한다."],[3,"However, Eden’s whales in the Gulf of Thailand come to the surface for another reason.","하지만 태국만에 사는 에덴 고래는 다른 이유로 수면으로 온다."]],"w":"2번에서 보통 고래는 숨을 쉬려고 수면에 와요. 하지만 3번 However 뒤에서 태국만의 에덴 고래는 다른 이유(for another reason)로 온다고 해요. 같은 이유라는 말은 반대예요.","c":"F"},"h":"07afa8b367"},{"n":2,"t":"tf","q":"Fish often swim to the surface to get more oxygen.","ko":"물고기들은 더 많은 산소를 얻기 위해 자주 수면으로 헤엄친다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Consequently, they often swim to the surface to get more oxygen.","그 결과, 그들은 더 많은 산소를 얻기 위해 자주 수면으로 헤엄친다."]],"w":"5번에서 물고기들은 더 많은 산소를 얻기 위해 자주 수면으로 헤엄친다(they often swim to the surface to get more oxygen)고 해요.","c":"T"},"h":"ebb06b25ab"},{"n":3,"t":"tf","q":"A whale closes its mouth when its mouth is empty.","ko":"고래는 입이 비어 있을 때 입을 닫는다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"When its mouth is full, the whale closes it and enjoys its meal.","입이 가득 차면 고래는 입을 다물고 식사를 즐긴다."]],"w":"12번에서 입이 가득 차면(When its mouth is full) 고래가 입을 닫고 식사를 즐긴다고 해요. 입이 비었을 때 닫는다는 말은 맞지 않아요.","c":"F"},"h":"a92c504e83"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The polluted water of the gulf makes it hard for fish to breathe.)","ko":"그 (태국)만의 오염된 물은 물고기들이 숨 쉬는 것을 어렵게 만든다.","opts":["깨끗한","얼어붙은","깊은","오염된"],"word":"polluted","r":{"a":"4) 오염된","ev":"4번 문장","s":[[4,"The polluted water of the gulf makes it hard for fish to breathe.","그 (태국)만의 오염된 물은 물고기들이 숨 쉬는 것을 어렵게 만든다."]],"w":"4번은 물고기가 숨 쉬기 힘들다는 내용이에요. 그 이유가 물의 상태이니 polluted는 ‘오염된’이에요.","c":4},"h":"71e8ddcb3a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Birds even fly over and grab them from the whale’s mouth.)","ko":"심지어 새들이 날아와 고래의 입에서 그들을 낚아챈다.","opts":["낚아채다","지켜보다","뱉어내다","따라가다"],"word":"grab","r":{"a":"1) 낚아채다","ev":"11번 문장","s":[[11,"Birds even fly over and grab them from the whale’s mouth.","심지어 새들이 날아와 고래의 입에서 그들을 낚아챈다."]],"w":"11번은 새들이 날아와서 고래의 입 안의 물고기를 ‘잡아채는’ 장면이에요. grab = 움켜쥐다, 잡아채다예요.","c":1},"h":"c785cce772"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nEden’s whales wanting to feed on the fish follow them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"물고기를 먹고 싶은 에덴 고래는 그들을 따라간다.","opts":["고래들","물고기들","새들","오염 물질"],"r":{"a":"2) 물고기들","ev":"6번 문장","s":[[6,"Eden’s whales wanting to feed on the fish follow them.","물고기를 먹고 싶은 에덴 고래는 그들을 따라간다."]],"w":"6번에서 고래는 the fish(물고기들)를 먹고 싶어서 따라가요. them은 바로 앞에 나온 the fish를 가리켜요. 고래가 고래를 따라가는 게 아니에요.","c":2},"h":"405ca4a3af"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"At the surface, an Eden’s whale opens its mouth wide.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"수면에서 에덴 고래는 입을 크게 벌린다.","opts":["수면에서 에덴 고래는 입을 크게 벌린다.","수면에서 에덴 고래는 입을 꽉 다문다.","깊은 바닷속에서 에덴 고래는 입을 크게 벌린다.","수면에서 에덴 고래는 눈을 크게 뜬다."],"r":{"a":"1) 수면에서 에덴 고래는 입을 크게 벌린다.","ev":"7번 문장","s":[[7,"At the surface, an Eden’s whale opens its mouth wide.","수면에서 에덴 고래는 입을 크게 벌린다."]],"w":"At the surface는 ‘수면에서’, opens its mouth wide는 ‘입을 크게 벌린다’는 뜻이에요. wide는 ‘넓게, 크게’라는 뜻이에요.","c":1},"h":"07e5a4bb4b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오염된 물은 물고기가 더 쉽게 숨 쉬도록 돕는다.","에덴 고래는 새들을 수면으로 쫓아낸다.","물의 흐름이 물고기를 고래의 입 밖으로 밀어낸다.","고래의 입을 향한 물의 흐름이 물고기를 끌어넣는다."],"opts":["The polluted water helps fish breathe more easily.","Eden’s whales chase birds to the surface.","The flow of water pushes the fish out of the whale’s mouth.","A flow of water toward the whale’s mouth pulls the fish in."],"r":{"a":"4) A flow of water toward the whale’s mouth pulls the fish in.","ev":"8~9번 문장","s":[[8,"This creates a flow of water towards it.","이는 그 입을 향해 물의 흐름을 만들어 낸다."],[9,"The flow of water pulls the fish into the whale’s mouth.","그 물의 흐름은 고래의 입 속으로 물고기를 끌어넣는다."]],"w":"8~9번에서 입을 향한 물의 흐름이 생기고, 그 흐름이 물고기를 입속으로 끌어넣어요. 오염된 물은 물고기를 숨 쉬기 어렵게 하고(4번), 고래가 새를 쫓지 않으며, 물고기를 밖으로 밀어내지도 않아요.","c":4},"h":"ca0ff9665d"},{"n":9,"t":"sum","q":"Whales (A) air through their (B).","ko":"고래는 (B)을(를) 통해 공기를 (A).","oko":["(A) 방출한다 / (B) 지느러미","(A) 숨긴다 / (B) 분수공","(A) 방출한다 / (B) 분수공","(A) 숨긴다 / (B) 지느러미","(A) 방출한다 / (B) 눈"],"opts":["(A) release / (B) fins","(A) hide / ns to its original size in winter.","그것은 겨울에 원래의 크기로 돌아온다."]],"w":"10~11번에서 It returns to its original size in winter(그것은 겨울에 원래의 크기로 돌아온다)라고 해요. It 뒤에는 3인칭 단수 동사 returns가, size 앞에는 형용사 original이 와요.","c":null},"h":"c423a98808"}]},{"u":2,"id":"nl1-02-2","no":2,"ko":"바닷속에 있는 거대한 싱크홀!","items":[{"n":1,"t":"tf","q":"The Great Blue Hole is near the coast of Belize.","ko":"Great Blue Hole은 Belize 해안 근처에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It’s a giant underwater sinkhole near the coast of Belize.","그것은 Belize(벨리즈) 해안 근처의 거대한 수중 싱크홀이다."]],"w":"3번에서 Great Blue Hole은 Belize 해안 근처(near the coast of Belize)의 수중 싱크홀이라고 해요.","c":"T"},"h":"fa8bc7b520"},{"n":2,"t":"tf","q":"The Great Blue Hole is 318 meters deep.","ko":"Great Blue Hole은 깊이가 318미터이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It is 318 meters across and 124 meters deep.","그것은 폭이 318미터이고 깊이가 124미터이다."]],"w":"4번에서 폭이 318미터(across), 깊이는 124미터(deep)라고 해요. 깊이가 318미터라는 말은 틀렸어요.","c":"F"},"h":"822013e79f"},{"n":3,"t":"tf","q":"The Great Blue Hole will last forever.","ko":"Great Blue Hole은 영원히 지속될 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Unfortunately, the Great Blue Hole won’t last forever.","안타깝게도 Great Blue Hole은 영원히 지속되지 않을 것이다."]],"w":"11번에서 Great Blue Hole은 영원히 지속되지 않을 것이다(won’t last forever)라고 해요.","c":"F"},"h":"b2cd6eaed9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Are you looking for adventure?)","ko":"당신은 모험을 찾고 있는가?","opts":["숙제","모험","휴식","쇼핑"],"word":"adventure","r":{"a":"2) 모험","ev":"1~2번 문장","s":[[1,"Are you looking for adventure?","당신은 모험을 찾고 있는가?"],[2,"Then you should visit the Great Blue Hole!","그렇다면 Great Blue Hole(그레이트 블루홀)을 방문해야 한다!"]],"w":"1번에서 모험을 찾고 있느냐고 묻고, 2번에서 그렇다면 Great Blue Hole을 방문하라고 해요. 거대한 수중 싱크홀에서 다이빙을 하는 것은 신나는 일이니 adventure는 '모험'이에요.","c":2},"h":"8a671ebe1b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Eventually, it collapsed, and a huge hole was created.)","ko":"마침내, 그것은 무너졌고 거대한 구멍이 형성되었다.","opts": )에 (A).","oko":["(A) 숨겼다 / (B) 위","(A) 올렸다 / (B) 아래","(A) 숨겼다 / (B) 아래","(A) 올렸다 / (B) 위","(A) 잃어버렸다 / (B) 위"],"opts":["(A) hid / (B) top","(A) placed / (B) bottom","(A) hid / (B) bottom","(A) placed / (B) top","(A) lost / (B) top"],"r":{"a":"4) (A) placed / (B) top ((A) 올렸다 / (B) 위)","ev":"5번 문장","s":[[5,"Then they placed the paper on top of cookies.","그러고 나서 그들은 쿠키 위에 그 종이를 올렸다."]],"w":"5번에서 Then they placed the paper on top of cookies(그러고 나서 그들은 쿠키 위에 그 종이를 올렸다)라고 해요. 숨겼다(hid)거나 잃었다(lost)는 말은 본문에 없고, 쿠키 아래(bottom)도 아니에요.","c":4},"h":"96447a010b"},{"n":10,"t":"fill","q":"They also posted a picture of the cookies on social media. Below it, they [A], “Take a [B] out of the thief!”","ko":"그들은 또한 쿠키의 사진을 소셜 미디어에 올렸다. 그 아래에 그들은 “도둑을 한 [B] 베어 드세요!”라고 [A].","bank":["wrote","bite","also","still","although","eventually"],"bko":{"wrote":"썼다(write의 과거)","bite":"한 입","also":"또한","still":"여전히","although":"비록 ~이지만","eventually":"마침내"},"a":"[A] wrote, [B] bite","r":{"a":"[A] wrote (썼다(write의 과거)), [B] bite (한 입)","ev":"8~9번 문장","s":[[8,"They also posted a picture of the cookies on social media.","그들은 또한 쿠키의 사진을 소셜 미디어에 올렸다."],[9,"Below it, they wrote, “Take a bite out of the thief!”","그 아래에 그들은 “도둑을 한 입 베어 드세요!”라고 썼다."]],"w":"9번에서 Below it, they wrote, “Take a bite out of the thief!”(그 아래에 그들은 “도둑을 한 입 베어 드세요!”라고 썼다)라고 해요. they 뒤에는 과거 동사 wrote(write의 과거)가, a 뒤에는 명사 bite가 와요.","c":null},"h":"6c07b63f19"}]},{"u":2,"id":"nl1-02-4","no":4,"ko":"살아있는 여신을 만나고 싶나요?","items":[{"n":1,"t":"tf","q":"Young girls in Nepal are chosen to be Kumari.","ko":"네팔에서 어린 소녀들이 Kumari로 선택된다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Young girls are chosen to be living goddesses called Kumari.","어린 소녀들이 Kumari(쿠마리)라고 불리는 살아있는 여신으로 선택된다."]],"w":"2번에 Young girls are chosen to be living goddesses called Kumari(어린 소녀들이 Kumari라고 불리는 살아있는 여신으로 선택된다)가 있어요.","c":"T"},"h":"c38054f6dd"},{"n":2,"t":"tf","q":"A Kumari can visit her parents whenever she wants.","ko":"Kumari는 원할 때마다 부모님을 방문할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"She can’t even visit her parents.","그녀는 부모님을 방문할 수도 없다."]],"w":"14번에서 Kumari는 부모님을 방문할 수도 없다(She can’t even visit her parents)고 해요. 원할 때마다 만날 수 있다는 말은 반대예요.","c":"F"},"h":"9e163df45b"},{"n":3,"t":"tf","q":"A girl must have all her teeth to become a Kumari.","ko":"Kumari가 되려면 소녀는 치아를 모두 가지고 있어야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"And she must have all her teeth.","그리고 그녀는 치아를 모두 가지고 있어야 한다."]],"w":"7번에서 Kumari가 되려면 치아를 모두 가지고 있어야 한다(she must have all her teeth)고 해요.","c":"T"},"h":"fa1e4354be"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Being a Kumari is a big honor.)","ko":"Kumari가 되는 것은 큰 영광이다.","opts":["벌","직업","영광","비밀"],"word":"honor","r":{"a":"3) 영광","ev":"3번 문장","s":[[3,"Being a Kumari is a big honor.","Kumari가 되는 것은 큰 영광이다."]],"w":"3번에서 Kumari가 되는 것은 큰 영광이라고 해요. 바로 뒤 4번에서 So(그래서) 많은 부모들이 딸이 Kumari가 되기를 원한다고 하니, honor는 '영광'이에요.","c":3},"h":"47004b29e2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The life of a Kumari is lonely.)","ko":"Kumari의 삶은 외롭다.","opts":["즐거운","외로운","바쁜","안전한"],"word":"lonely","r":{"a":"2) 외로운","ev":"12번 문장","s":[[12,"The life of a Kumari is lonely.","Kumari의 삶은 외롭다."]],"w":"12번 다음에 가족을 떠나 궁궐에 살고 부모님도 만나지 못한다는 이야기가 이어져요. 그래서 lonely는 '외로운'이에요.","c":2},"h":"79b1cbdfbf"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nSo many parents want their daughters to become one.","ko":"밑줄 친 one이 가리키는 것은?","sko":"그래서 많은 부모들이 자신들의 딸이 그중 하나가 되기를 원한다.","opts":["부모님","딸들","궁궐","Kumari"],"r":{"a":"4) Kumari","ev":"3~4번 문장","s":[[3,"Being a Kumari is a big honor.","Kumari가 되는 것은 큰 영광이다."],[4,"So many parents want their daughters to become one.","그래서 많은 부모들이 자신들의 딸이 Kumari가 되기를 원한다."]],"w":"4번의 one은 앞 문장(3번)의 a Kumari를 대신하는 말이에요. 부모들이 딸이 Kumari가 되기를 원한다는 뜻이에요.","c":4},"h":"c25b078b3a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Some people say this tradition is unfair to the girls.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어떤 사람들은 이 전통이 소녀들에게 부당하다고 말한다.","opts":["어떤 사람들은 이 전통이 소녀들에게 부당하다고 말한다.","모든 사람들은 이 전통이 소녀들에게 이롭다고 말한다.","어떤 사람들은 소녀들이 이 전통을 만들었다고 말한다.","모든 사람들은 이 전통이 소녀들에게 부당하다고 말한다."],"r":{"a":"1) 어떤 사람들은 이 전통이 소녀들에게 부당하다고 말한다.","ev":"16번 문장","s":[[16,"Some people say this tradition is unfair to the girls.","어떤 사람들은 이 전통이 소녀들에게 부당하다고 말한다."]],"w":"Some people say (that) ~은 ‘어떤 사람들은 ~라고 말한다’, unfair는 ‘부당한’이에요. 모든 사람이 아니라 어떤 사람들의 의견이에요.","c":1},"h":"8ce1d76cd1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Kumari는 가족과 함께 궁궐에서 산다.","Kumari는 의식을 위해서만 궁궐을 떠날 수 있다.","부모들은 딸이 Kumari가 되는 것을 원하지 않는다.","Kumari는 원하는 옷을 아무거나 입을 수 있다."],"opts":["A Kumari lives with her family in a palace.","A Kumari can leave the palace only for ceremonies.","Parents don’t want their daughters to become a Kumari.","A Kumari may wear any clothes she likes."],"r":{"a":"2) A Kumari can leave the palace only for ceremonies.","ev":"13번 문장","s":[[13,"She can only leave the palace for ceremonies.","그녀는 의식을 위해서만 궁궐을 떠날 수 있다."]],"w":"13번에서 Kumari는 의식(ceremonies)을 위해서만 궁궐을 떠날 수 있다고 해요. 가족을 떠나 궁궐에 살고(10번), 부모들은 딸이 되기를 원하며(4번), 항상 빨간 옷을 입어야 해요(11번).","c":2},"h":"a5a7f4761e"},{"n":9,"t":"sum","q":"A girl must also have (A) and a good (B).","ko":"소녀는 또한 (A)와(과) 좋은 (B)을(를) 지녀야 한다.","oko":["(A) 용기 / (B) 기억력","(A) 돈 / (B) 목소리","(A) 용기 / (B) 미소","(A) 돈 / (B) 기억력","(A) 용기 / (B) 목소리"],"opts":["(A) courage / (B) memory","(A) money / (B) voice","(A) courage / (B) smile","(A) money / (B) memory","(A) courage / (B) voice"],"r":{"a":"5) (A) courage / (B) voice ((A) 용기 / (B) 목소리)","ev":"8번 문장","s":[[8,"She must also have courage and a good voice.","그녀는 또한 용기와 좋은 목소리를 지녀야 한다."]],"w":"8번에서 소녀는 또한 용기(courage)와 좋은 목소리(voice)를 지녀야 한다고 해요. 돈, 기억력, 미소는 본문에 나오지 않아요.","c":5},"h":"c32e049b8d"},{"n":10,"t":"fill","q":"She must live this way until [A] girl [B] her.","ko":"그녀는 [A] 소녀가 그녀를 [B] 때까지 이런 식으로 살아야 한다.","bank":["another","replaces","all","even","also","good"],"bko":{"another":"다른, 또 하나의","r ning of the underlined word? (It was the correct answer!)","ko":"그것은 정답이었다!","opts":["틀린","어려운","정확한","재미있는"],"word":"correct","r":{"ev":"13번 문장","s":[[13,"It was the correct answer!","그것은 정답이었다!"]],"w":"친구들이 냅킨에 쓴 답을 보니 맞았어요. 앞에서 오답(wrong)이던 T-shirt와 반대로 correct는 '정확한, 맞는'이에요.","a":"3) 정확한","c":3},"h":"dc9beacdab"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey began discussing possible answers.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 가능한 답을 의논하기 시작했다.","opts":["작가의 친구들","작가","그 수수께끼들","가능한 답들"],"r":{"ev":"10~11번 문장","s":[[10,"Her friends agreed.","그녀의 친구들은 동의했다."],[11,"They began discussing possible answers.","그들은 가능한 답을 의논하기 시작했다."]],"w":"10번에서 작가의 친구들이 동의했고(Her friends agreed), 11번 They는 그 친구들이에요. 작가는 이미 답을 알고 있었어요.","a":"1) 작가의 친구들","c":1},"h":"ca0a0333b7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"No one seemed to know the correct answer.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아무도 정답을 모르는 것 같았다.","opts":["모두가 정답을 알고 있는 것 같았다.","한 명만 정답을 아는 것 같았다.","아무도 정답을 말하고 싶어 하지 않는 것 같았다.","아무도 정답을 모르는 것 같았다."],"r":{"ev":"7번 문장","s":[[7,"No one seemed to know the correct answer.","아무도 정답을 모르는 것 같았다."]],"w":"No one은 '아무도 ~ 않다'이고 seemed to know는 '아는 것 같았다'예요. 합치면 아무도 정답을 모르는 것 같았다는 뜻이에요.","a":"4) 아무도 정답을 모르는 것 같았다.","c":4},"h":"00cb352ba8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["작가는 혼자서 점심을 먹고 있었다.","친구들은 작가의 제안을 거절했다.","친구들은 잠시 후 냅킨에 무언가를 적었다.","친구들은 수수께끼의 답을 전혀 찾지 못했다."],"opts":["The writer was having lunch alone.","The friends refused the writer’s suggestion.","The friends wrote something on a napkin after a while.","The friends could not find any answer to the riddle."],"r":{"ev":"12번 문장","s":[[12,"After a while, they smiled and wrote something on a napkin.","잠시 후, 그들은 웃으며 냅킨에 무언가를 적었다."]],"w":"12번에서 잠시 후 친구들이 웃으며 냅킨에 무언가를 적었다고 해요. 작가는 친구들과 점심 중이었고(1번), 친구들은 제안에 동의했고(10번), 답을 찾아냈어요(13번).","a":"3) The friends wrote something on a napkin after a while. (친구들은 잠시 후 냅킨에 무언가를 적었 4},"h":"afd74785bb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Napoleon was usually surrounded by his guards.)","ko":"Napoleon은 평소에 그의 경호원들에 둘러싸여 있었다.","opts":["둘러싸인","쫓겨난","놀란","보호받지 못한"],"word":"surrounded","r":{"ev":"9번 문장","s":[[9,"Also, Napoleon was usually surrounded by his guards.","또한, Napoleon은 평소에 그의 경호원들에 둘러싸여 있었다."]],"w":"경호원들이 곁에 있었고, 그들이 모두 키가 더 컸다고 이어져요(10번). 경호원이 주변에 빙 둘러서 있는 장면이에요. surround = 둘러싸다.","a":"1) 둘러싸인","c":1},"h":"239ac03092"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey were longer than they are today.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 오늘날의 것보다 더 길었다.","opts":["피트와 인치","Napoleon의 경호원들","러시아 사람들","Napoleon의 적들"],"r":{"ev":"4~5번 문장","s":[[4,"First of all, feet and inches were different in the past.","우선, 과거의 피트와 인치는 달랐다."],[5,"They were longer than they are today.","그것들은 오늘날의 것보다 더 길었다."]],"w":"5번의 They는 앞 문장(4번)의 feet and inches(피트와 인치)예요. 과거의 피트와 인치가 오늘날의 것보다 더 길었다는 말이에요.","a":"1) 피트와 인치","c":1,"k":"They = 피트와 인치"},"pron":"They","h":"41482b876d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Napoleon was Russia’s enemy, so he described the emperor as a “little man.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Napoleon은 러시아의 적이었기 때문에 그는 그 황제를 ‘작은 남자’라고 묘사했다.","opts":["Tolstoy는 Napoleon의 친구여서 그를 '위대한 남자'라고 불렀다.","Napoleon은 러시아의 적이어서 Tolstoy를 '작은 남자'라고 묘사했다.","Napoleon이 러시아의 적이었기 때문에 Tolstoy는 그 황제를 '작은 남자'라고 묘사했다.","Tolstoy는 러시아의 적이어서 Napoleon을 '작은 남자'라고 묘사했다."],"r":{"ev":"13번 문장","s":[[13,"Napoleon was Russia’s enemy, so he described the emperor as a “little man.”","Napoleon은 러시아의 적이었기 때문에 그는 그 황제를 ‘작은 남자’라고 묘사했다."]],"w":"Napoleon이 러시아의 적이었다는 것이 이유(so)이고, he는 Tolstoy예요. 그래서 Tolstoy가 그 황제를 '작은 남자'라고 묘사했다는 뜻이에요.","a":"3) Napoleon이 러시아의 적이었기 때문에 Tolstoy는 그 황제를 '작은 남자'라고 묘사했다.","c":3},"h":"5c2e503b8b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Napoleon의 경호원들은 그보다 키가 작았다.","Napoleon의 경호원들은 모두 그보다 약 10센티미터 컸다.","Napoleon의 키 5피트 2인치는 당시에도 매우 작은 키였다.","Tolstoy는 Napoleon을 칭찬하려고 <전쟁과 평화>를 썼다."],"opts":["Napoleon’s guards were shorter than he was.","Napoleon’s guards were all about 10 centimeters taller than he was.","Napoleon’s height of 5 feet, 2 inches was very short even at that time.","Tolstoy wrote War and Peace to praise Napoleon."],"r":{"ev":"9~10번 문장","s":[[9,"Also, Napoleon was usually surrounded by his guards.","또한, Napoleon은 평소에 그의 경호원들에 둘러싸여 있었다."],[10,"They were all about 10 centimeters taller than him.","그들은 모두 그보다 약 10센티미터 더 컸다."]],"w":"10번에서 경호원들은 모두 Napoleon보다 약 10센티미터 컸어요. 경호원이 더 작았다는 말은 없고, 5피트 2인치는 당시 평균이었으며(8번), Tolstoy는 그를 작게 묘사했어요(13번).","a":"2) Napoleon’s guards were all about 10 centimeters taller than he was.","c":2},"h":"b0077f16d9"},{"n":9,"t":"sum","q":"Everyone (A) he was very short, but that’s not (B).","ko":"모두가 그가 매우 작았다고 (A)지만, 그것은 (B)이(가) 아니다.","oko":["(A) 잊는다 / (B) 사실","(A) 생각한다 / (B) 우스운 것","(A) 잊는다 / (B) 우스운 것","(A) 생각한다 / (B) 사실","(A) 바란다 / (B) 우스운 것"],"opts":["(A) forgets / (B) true","(A) thinks / (B) funny","(A) forgets / (B) funny","(A) thinks / (B) true","(A) hopes / (B) funny"],"r":{"ev":"2번 문장","s":[[2,"Everyone thinks he was very short, but that’s not true.","모두가 그는 키가 매우 작았다고 생각하지만 그것은 사실이 아니다."]],"w":"2번에서 모두가 그가 매우 작았다고 생각하지만(thinks) 그것은 사실이 아니다(not true)라고 해요. 잊는다(forgets)거나 바란다(hopes)는 말은 본문에 없어요.","a":"4) (A) thinks / (B) true ((A) 생각한다 / (B) 사실)","c":4},"h":"31e9079c14"},{"n":10,"t":"fill","q":"First of all, feet and inches were [A] in the [B].","ko":"우선, [B]의 피트와 인치는 [A].","bank":["different","past","usually","finally","also","several"],"bko":{"different":"다른","past":"과거","usually":"보통","finally":"마지막으로","also":"또한","several":"몇몇의"},"r":{"ev":"4번 문장","s":[[4,"First of all, feet and inches were different in the past.","우선, 과거의 피트와 인치는 달랐다."]],"w":"4번에서 First of all, feet and inches were different in the past(우선, 과거의 피트와 인치는 달랐다)라고 해요. were 뒤에는 형용사 different가, the 뒤에는 명사 past가 와요.","a":"[A] different (다른), [B] past (과거)","c":null},"a":"[A] different, [B] past","h":"94617d9dce"}]},{"u":3,"id":"nl1-03-4","no":4,"ko":"걸어서 어디든 갈 수 있어!","items":[{"n":1,"t":"tf","q":"A walk score tells you how easy walking to public places is.","ko":"워크 스코어는 공공장소에 걸어서 가는 것이 얼마나 쉬운지를 알려 준다.","r":{"ev":"3번 문장","s":[[3,"A walk score tells you how easy walking to public places is.","워크 스코어는 공공장소에 걸어서 가는 것이 얼마나 쉬운지를 알려 준다."]],"w":"3번 문장 그대로예요. 걸어서 갈 수 있는 쉬운 정도를 알려 줘요.","a":"T (본문과 맞는 내용)","c":"T"},"h":"818b61c5ed"},{"n":2,"t":"tf","q":"A city gets the highest walk score if the places are within a thirty-minute walk.","ko":"장소들이 도보로 30분 이내에 있으면 그 도시는 가장 높은 워크 스코어를 얻는다.","r":{"ev":"4번 문장","s":[[4,"If the places are within a five-minute walk, the city gets the highest walk score.","만약 그 장소들이 도보로 5분 이내에 있다면, 그 도시는 가장 높은 워크 스코어를 얻는다."]],"w":"4번에서 가장 높은 점수의 조건은 five-minute walk(도보 5분 이내)예요. 30분이 아니에요.","a":"F (본문과 다른 내용)","c":"F"},"h":"60bb021b3d"},{"n":3,"t":"tf","q":"Cities with high walk scores have less noise because there are not many cars on the road.","ko":"워크 스코어가 높은 도시는 도로에 차가 많지 않아서 소음이 더 적다.","r":{"ev":"8번 문장","s":[[8,"These cities also have less noise because there aren’t many cars on the road.","또한 이 도시들은 도로에 차가 많이 없기 때문에 소음도 더 적다."]],"w":"8번 문장에서 these cities also have less noise because there aren’t many cars on the road라고 해요.","a":"T (본문과 맞는 내용)","c":"T"},"h":"a82b7dfc76"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Furthermore, they are an attractive choice for tourists.)","ko":"게다가 관광객에게 매력적인 선택지이다.","opts":["위험한","매력적인","값비싼","지루한"],"word":"attractive","r":{"ev":"9번 문장","s":[[9,"Furthermore, they are an attractive choice for tourists.","게다가 관광객에게 매력적인 선택지이다."]],"w":"Furthermore 뒤에 두 번째 이점이 와요. 관광객이 선택하고 싶은 도시라는 좋은 뜻이므로 '매력적인'이 알맞아요.","a":"2) 매력적인","c":2},"h":"0c51d2e282"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These systems make it more convenient for tourists to walk around the cities.)","ko":"이러한 시스템들은 관광객들이 도시를 돌아다니는 것을 더 편리하게 해 준다.","opts":["편리한","불편한","복잡한","조용한"],"word":"convenient","r":{"ev":"11번 문장","s":[[11,"These systems make it more convenient for tourists to walk around the cities.","이러한 시스템들은 관광객들이 도시를 돌아다니는 것을 더 편리하게 해 준다."]],"w":"체계적인 도로 시스템 덕분에 걷기가 더 쉬워진다는 내용이에요. 좋은 결과이므로 '편리한'이 알맞아요.","a":"1) 편리한","c":1},"h":"646c615841"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey usually have organized street systems.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 대개 체계적인 도로 시스템을 갖고 있다.","opts":["관광객들","자동차들","높은 워크 스코어를 가진 도시들","공공장소들"],"r":{"ev":"9~10번 문장","s":[[9,"Furthermore, they are an attractive choice for tourists.","게다가 관광객에게 매력적인 선택지이다."],[10,"They usually have organized street systems.","이 도시들은 대개 체계적인 도로 시스템을 갖고 있다."]],"w":"9번의 they(관광객에게 매력적인 선택지)와 10번의 They는 모두 워크 스코어가 높은 도시들이에요. 체계적인 도로 시스템을 갖는 것은 도시예요.","a":"3) 높은 워크 스코어를 가진 도시들","c":3},"h":"59c2eaae07"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The air is cleaner because people don’t need to drive everywhere.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사람들이 어느 곳에서나 운전할 필요가 없기 때문에 공기가 더 깨끗하다.","opts":["공기가 더 깨끗해서 사람들이 운전할 필요가 없다.","사람들이 어디서나 운전해야 하기 때문에 공기가 더 깨끗하다.","사람들이 운전을 하지 않아서 공기가 더 나빠진다.","사람들이 어디든 운전할 필요가 없어서 공기가 더 깨끗하다."],"r":{"ev":"7번 문장","s":[[7,"The air is cleaner because people don’t need to drive everywhere.","사람들이 어느 곳에서나 운전할 필요가 없기 때문에 공기가 더 깨끗하다."]],"w":"because 뒤가 이유예요. 사람들이 어디든 운전할 필요가 없어서 공기가 더 깨끗하다는 뜻이에요. 원인과 결과가 뒤바뀌지 않게 주의하세요.","a":"4) 사람들이 어디든 운전할 필요가 없어서 공기가 더 깨끗하다.","c":4},"h":"5e4f7ec78d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["관광객은 체계적인 도로 시스템이 있는 도시에서 도시의 문화를 더 쉽게 경험할 수 있다.","워크 스코어가 높은 도시는 차가 더 많다.","장소들이 도보로 한 시간 이내에 있으면 가장 높은 워크 스코어를 얻는다.","워크 스코어가 높은 도시의 사람들은 어디든 운전해야 한다."],"opts":["Tourists can experience a city’s culture more easily where the street system is organized.","A city with a high walk score has more cars.","A city gets the highest walk score if the places are within a one-hour walk.","People in cities with high walk scores need to drive everywhere."],"r":{"ev":"10~12번 문장","s":[[10,"They usually have organized street systems.","이 도시들은 대개 체계적인 도로 시스템을 갖고 있다."],[11,"These systems make it more convenient for tourists to walk around the cities.","이러한 시스템들은 관광객들이 도시를 돌아다니는 것을 더 편리하게 해 준다."],[12,"So they can experience the city’s culture more easily!","그래서 그들은 도시의 문화를 더 쉽게 경험할 수 있다!"]],"w":"10~12번에서 체계적인 도로 시스템 덕분에 관광객이 걷기 편해져 도시 문화를 더 쉽게 경험한다고 해요. 높은 워크 스코어의 도시는 차가 많지 않고(8번), 최고 점수 조건은 도보 5분(4번)이며, 사람들은 운전할 필요가 없어요(7번).","a":"1) Tourists can experience a city’s culture more easily where the street system is organized. (관광객은 체계적인 도로 시스템이 있는 도시에서 도시의 문화를 더 쉽게 경험할 수 있다.)","c":1},"h":"481dc3912c"},{"n":9,"t":"sum","q":"Having a high walk score has some (A). First, there is less (B) in cities with high walk scores.","ko":"높은 워크 스코어를 갖는 것에는 몇 가지 (A)이(가) 있다. 첫째로, 높은 워크 스코어를 갖춘 도시에는 (B)이(가) 덜하다.","oko":["(A) 문제 / (B) 오염","(A) 이점 / (B) 비","(A) 문제 / (B) 비","(A) 이점 / (B) 오염","(A) 가격 / (B) 비"],"opts":["(A) problems / (B) pollution","(A) benefits / (B) rain","(A) problems / (B) rain","(A) benefits / (B) pollution","(A) prices / (B) rain"],"r":{"ev":"5~6번 문장","s":[[5,"Having a high walk score has some benefits.","높은 워크 스코어를 갖는 것에는 몇 가지 이점이 있다."],[6,"First, there is less pollution in cities with high walk scores.","첫째로, 높은 워크 스코어를 갖춘 도시에는 오염이 덜하다."]],"w":"5번에서 높은 워크 스코어를 갖는 것에는 몇 가지 이점(benefits)이 있다고 하고, 6번에서 첫째로 오염(pollution)이 덜하다고 해요. 문제, 비, 가격은 본문에 나오지 않아요.","a":"4) (A) benefits / (B) pollution ((A) 이점 / (B) 오염)","c":4},"h":"8a7ffb1661"},{"n":10,"t":"fill","q":"If you can get there on [A], your city [B] has a high walk score!","ko":"만약 그곳에 [A](으)로 갈 수 있다면, 당신의 도시는 [B] 높은 워크 스코어를 가질 것이다!","bank":["foot","probably","drive","need","make","tell"],"bko":{"foot":"도보, 발","probably":"아마도","drive":"운전하다","need":"필요하다","make":"만들다","tell":"알려 주다"},"r":{"ev":"2번 문장","s":[[2,"If you can get there on foot, your city probably has a high walk score!","만약 걸어서 갈 수 있다면, 당신의 도시는 아마 높은 워크 스코어를 가질 것이다!"]],"w":"2번에서 If you can get there on foot, your city probably has a high walk score!(걸어서 갈 수 있다면, 당신의 도시는 아마 높은 워크 스코어를 가질 것이다!)라고 해요. on 뒤에는 명사 foot이, 주어 뒤에는 부사 probably가 와요.","a":"[A] foot (도보, 발), [B] probably (아마도)","c":null},"a":"[A] foot, [B] probably","h":"7b948ce80c"}]},{"u":4,"id":"nl1-04-1","no":1,"ko":"개미들의 대화","items":[{"n":1,"t":"tf","q":"Ants use smells to communicate with each other.","ko":"개미들은 서로 의사소통하려고 냄새를 사용한다.","r":{"ev":"5번 문장","s":[[5,"This is how ants communicate with each other.","이것이 개미들이 서로 의사소통하는 방법이다."]],"w":"5번 문장에서 This is how ants communicate with each other라고 해요. 그 방법이 냄새예요(1~4번).","a":"T (본문과 맞는 내용)","c":"T"},"h":"068a0ea917"},{"n":2,"t":"tf","q":"Most ants can use only two different smells.","ko":"대부분의 개미는 두 가지 서로 다른 냄새만 사용할 수 있다.","r":{"ev":"6번 문장","s":[[6,"Most ants can use up to 20 different smells to communicate.","대부분의 개미는 의사소통을 하는 데 20가지에 이르는 서로 다른 냄새를 사용할 수 있다."]],"w":"6번에서 대부분의 개미는 up to 20 different smells(20가지에 이르는 서로 다른 냄새)를 쓸 수 있다고 해요. 두 가지뿐이라는 말은 틀려요.","a":"F (본문과 다른 내용)","c":"F"},"h":"a4e6f3bff4"},{"n":3,"t":"tf","q":"Ants use their antennae to smell and understand a message.","ko":"개미들은 더듬이로 냄새를 맡고 메시지를 이해한다.","r":{"ev":"10번 문장","s":[[10,"When an ant makes smells, the other ants use their antennae to smell and understand the message.","한 개미가 냄새를 만들면, 다른 개미들은 냄새를 맡고 메시지의 내용을 이해하기 위해 그들의 더듬이를 사용한다."]],"w":"10번에서 다른 개미들이 their antennae로 냄새를 맡고 메시지를 이해한다고 해요.","a":"T (본문과 맞는 내용)","c":"T"},"h":"06dcf318ca"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is how ants communicate with each other.)","ko":"이것이 개미들이 서로 의사소통하는 방법이다.","opts":["숨다","경쟁하다","도망치다","의사소통하다"],"word":"communicate","r":{"ev":"5번 문장","s":[[5,"This is how ants communicate with each other.","이것이 개미들이 서로 의사소통하는 방법이다."]],"w":"1~4번에서 개미는 냄새로 어느 쪽으로 갈지 서로 알려 줘요. 냄새로 서로 메시지를 주고받는 것이니 communicate = 의사소통하다예요.","a":"4) 의사소통하다","c":4},"h":"859ce20805"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (What if you smell something fishy?)","ko":"비린내가 난다면 어떻게 해야 할까?","opts":["고소한 냄새가 나는","달콤한","비린내 나는","타는 냄새가 나는"],"word":"fishy","r":{"ev":"3~4번 문장","s":[[3,"What if you smell something fishy?","비린내가 난다면 어떻게 해야 할까?"],[4,"That means you should turn right.","그건 오른쪽으로 돌라는 뜻이다."]],"w":"fishy는 fish(생선)에서 온 말이에요. 달콤한 냄새(sweet)와 대비되는 냄새로, 비린내 나는을 뜻해요.","a":"3) 비린내 나는","c":3},"h":"90aa508a24"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nEach one has a different meaning.","ko":"밑줄 친 one이 가리키는 것은?","sko":"각각은 별개의 의미를 가진다.","opts":["냄새","개미","사람","더듬이"],"r":{"ev":"7~8번 문장","s":[[7,"They use smells the same way we use words.","그들은 우리가 단어를 사용하는 것과 같은 방법으로 냄새를 사용한다."],[8,"Each one has a different meaning.","각각의 냄새는 별개의 의미를 가진다."]],"w":"8번의 one은 앞 문장(7번)에서 개미가 사용한다고 한 smells(냄새)를 가리켜요. 각각의 냄새가 서로 다른 의미를 가진다는 말이에요.","a":"1) 냄새","c":1,"k":"one = 냄새"},"pron":"one","h":"2763099aa4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They use smells the same way we use words.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 우리가 단어를 사용하는 것과 같은 방법으로 냄새를 사용한다.","opts":["개미는 사람이 단어를 쓰듯이 냄새를 쓴다.","개미는 사람과 달리 단어 없이 냄새만 쓴다.","개미는 단어를 냄새로 바꿔서 먹는다.","사람은 개미가 냄새를 쓰듯이 단어를 맡는다."],"r":{"ev":"7번 문장","s":[[7,"They use smells the same way we use words.","그들은 우리가 단어를 사용하는 것과 같은 방법으로 냄새를 사용한다."]],"w":"the same way는 같은 방법이에요. 개미는 사람이 단어를 쓰듯이 냄새를 쓴다는 뜻이에요.","a":"1) 개미는 사람이 단어를 쓰듯이 냄새를 쓴다.","c":1},"h":"3a95bf410c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["개미는 의사소통하려고 냄새를 한 가지만 쓴다.","모든 냄새는 같은 의미를 가진다.","개미는 냄새를 조합해 서로 다른 메시지를 만들 수 있다.","개미는 눈으로 메시지를 이해한다."],"opts":["Ants use only one smell to communicate.","Every smell has the same meaning.","Ants can make different messages by putting smells together.","Ants use their eyes to understand messages."],"r":{"ev":"8~9번 문장","s":[[8,"Each one has a different meaning.","각각의 냄새는 별개의 의미를 가진다."],[9,"When they put smells together, they can make different messages, like the way we make sentences.","그들이 냄새를 조합하면 우리가 문장을 만드는 방법과 같이 서로 다른 메시지를 만들 수 있다."]],"w":"9번에서 냄새를 조합하면 서로 다른 메시지를 만들 수 있다고 해요. 개미는 20가지에 이르는 냄새를 쓰고(6번), 각 냄새는 서로 다른 의미를 가지며(8번), 더듬이로 냄새를 맡아요(10번).","a":"3) Ants can make different messages by putting smells together.","c":3},"h":"cd714fc3ac"},{"n":9,"t":"sum","q":"Often, ants use smells to tell other ants where to (A) (B).","ko":"흔히, 개미들은 다른 개미들에게 어디에서 (B)을(를) (A)지 알려 주기 위해 냄새를 사용한다.","oko":["(A) 숨길 / (B) 물","(A) 찾을 / (B) 물","(A) 숨길 / (B) 음식","(A) 찾을 / (B) 음식","(A) 잃을 / (B) 물"],"opts":["(A) hide / (B) water","(A) find / (B) water","(A) hide / (B) food","(A) find / (B) food","(A) lose / (B) water"],"r":{"ev":"11번 문장","s":[[11,"Often, ants use smells to tell other ants where to find food.","흔히, 개미들은 다른 개미들에게 어디에서 음식을 찾을 수 있는지 알려 주기 위해 냄새를 사용한다."]],"w":"11번에서 개미들은 다른 개미들에게 어디에서 음식(food)을 찾을 수(find) 있는지 알려 주려고 냄새를 쓴다고 해요. 숨기거나(hide) 잃는(lose) 것, 물(water)은 본문에 나오지 않아요.","a":"4) (A) find / (B) food ((A) 찾을 / (B) 음식)","c":4},"h":"265f309b56"},{"n":10,"t":"fill","q":"Do you smell something sweet? Then you should [A] [B].","ko":"어떤 달콤한 냄새가 나는가? 그렇다면 [B] [A]야 한다.","bank":["go","straight","meaning","words","message","sentences"],"bko":{"go":"가다","straight":"똑바로","meaning":"의미","words":"단어들","message":"메시지","sentences":"문장들"},"r":{"ev":"1~2번 문장","s":[[1,"Do you smell something sweet?","어떤 달콤한 냄새가 나는가?"],[2,"Then you should go straight.","그렇다면 똑바로 가야 한다."]],"w":"1~2번에서 Do you smell something sweet? Then you should go straight.(어떤 달콤한 냄새가 나는가? 그렇다면 똑바로 가야 한다.)라고 해요. should 뒤에는 동사 원형 go가, 그 뒤에는 부사 straight가 와요.","a":"[A] go (가다), [B] straight (똑바로)","c":null},"a":"[A] go, [B] straight","h":"3853ef0f7d"}]},{"u":4,"id":"nl1-04-2","no":2,"ko":"여러분은 상어를 무서워하나요?","items":[{"n":1,"t":"tf","q":"Cristina Zenato is a professional diver.","ko":"Cristina Zenato는 전문 다이버이다.","r":{"ev":"3번 문장","s":[[3,"She is a professional diver.","그녀는 전문 다이버이다."]],"w":"3번 문장 She is a professional diver 그대로예요.","a":"T (본문과 맞는 내용)","c":"T"},"h":"c8547e02fe"},{"n":2,"t":"tf","q":"Zenato has been diving with sharks  듣고 있는 특별한 친구"},"pron":"it","h":"530445a3b5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They worry about being laughed at.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 비웃음을 당할까 봐 걱정한다.","opts":["그들은 다른 사람을 비웃는 것을 걱정한다.","그들은 너무 자주 웃는 것을 걱정한다.","그들은 다른 사람에게 비웃음을 당하는 것을 걱정한다.","그들은 웃음소리가 들리지 않는 것을 걱정한다."],"r":{"a":"3) 그들은 다른 사람에게 비웃음을 당하는 것을 걱정한다.","ev":"7번 문장","s":[[7,"They worry about being laughed at.","그들은 비웃음을 당할까 봐 걱정한다."]],"w":"being laughed at은 ‘비웃음을 당하는 것’(수동)이에요. 아이들이 남을 비웃는 게 아니라 비웃음을 당할까 봐 걱정해요.","c":3},"h":"01bdb90236"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["학습에 문제가 있는 아이들은 책을 읽을 때 항상 기뻐한다.","개가 웃으면 아이들이 긴장을 풀 수 있다.","치료견은 아이들에게 책을 읽어 주도록 훈련 받는다.","이 독서 프로그램은 학습에 문제가 있는 아이들을 위한 것이다."],"opts":["Children with learning problems always feel glad when they read.","A dog’s laugh helps children relax.","Therapy dogs are trained to read books to children.","The reading program is for children with learning problems."],"r":{"a":"4) The reading program is for children with learning problems.","ev":"5~6번, 9~10번 문장","s":[[5,"This is a special kind of reading program for children with learning problems.","이것은 학습에 문제가 있는 아이들을 위한 특별한 유형의 독서 프로그램이다."],[6,"These children often feel nervous and upset when they have to read in front of others.","이 아이들은 다른 사람들 앞에서 책을 읽어야 할 때 종종 긴장하고 당황해한다."],[9,"Therapy dogs are specially trained to listen patiently while children read.","치료견들은 아이들이 책을 읽는 동안 참을성 있게 듣도록 특별히 훈련 받는다."],[10,"They never laugh.","그들은 절대 웃지 않는다."]],"w":"5번에 learning problems가 있는 아이들을 위한 독서 프로그램이라고 나와요. 아이들은 남들 앞에서 긴장하고(6번), 개는 웃지 않고(10번), 개는 읽어 주는 게 아니라 들어 줘요(9번).","c":4},"h":"94bcfc2039"},{"n":9,"t":"sum","q":"A girl is (A) reading a book (B).","ko":"한 여자아이가 (A) 책을 (B) 읽고 있다.","oko":["(A) 슬프게 / (B) 소리 내어","(A) 행복하게 / (B) 조용히","(A) 슬프게 / (B) 조용히","(A) 행복하게 / (B) 소리 내어","(A) 행복하게 / (B) 천천히"],"opts":["(A) sadly / (B) aloud","(A) happily / (B) quietly","(A) sadly / (B) quietly","(A) happily / (B) aloud","(A) happily / (B) slowly"],"r":{"a":"4) (A) happily / (B) aloud ((A) 행복하게 / (B) 소리 내어)","ev":"1번 문장","s":[[1,"A girl is happily reading a book aloud.","한 여자아이가 행복하게 소리 내어 책을 읽고 있다."]],"w":"1번에서 한 여자아이가 행복하게(happily) 소리 내어(aloud) 책을 읽고 있다고 해요. 슬프게(sadly), 조용히(quietly), 천천히(slowly)라는 말은 본문에 없어요.","c":4},"h":"81db20fd0c"},{"n":10,"t":"fill","q":"These children often feel [A] and upset when they have to read in front of [B].","ko":"이 아이들은 [B] 앞에서 책을 읽어야 할 때 종종 [A]하고 당황해한다.","bank":["nervous","others","listen","worry","relax","never"],"bko":{"nervous":"긴장한, 불안한","others":"다른 사람들","listen":"듣다","worry":"걱정하다","relax":"긴장을 풀다","never":"결코 ~않다"},"r":{"a":"[A] nervous (긴장한, 불안한), [B] others (다른 사람들)","ev":"6번 문장","s":[[6,"These children often feel nervous and upset when they have to read in front of others.","이 아이들은 다른 사람들 앞에서 책을 읽어야 할 때 종종 긴장하고 당황해한다."]],"w":"6번에서 These children often feel nervous and upset when they have to read in front of others(이 아이들은 다른 사람들 앞에서 책을 읽어야 할 때 종종 긴장하고 당황해한다)라고 해요. feel 뒤에는 형용사 nervous가, in front of 뒤에는 명사 others가 와요.","c":null},"a":"[A] nervous, [B] others","h":"00a2510030"}]},{"u":5,"id":"nl1-05-3","no":3,"ko":"밤에 먹는 것도 병이다","items":[{"n":1,"t":"tf","q":"At night, the body produces more melatonin and leptin.","ko":"밤에 신체는 멜라토닌과 렙틴을 더 많이 생산한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"At night, the body produces more of two hormones, melatonin and leptin.","밤에 신체는 멜라토닌과 렙틴이라는 두 가지 호르몬을 더 많이 생산한다."]],"w":"7번에 At night, the body produces more of two hormones, melatonin and leptin이 나와요.","c":"T"},"h":"006189dc1a"},{"n":2,"t":"tf","q":"Doctors know exactly why people get night eating syndrome.","ko":"의사들은 사람들이 야식증후군에 걸리는 이유를 정확히 알고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Doctors aren’t sure why this happens, but NES is more common when people are stressed.","의사들은 왜 이런 일이 일어나는지 확신하지 못하지만, 야식증후군은 사람들이 스트레스를 받을 때 더 흔하다."]],"w":"11번에서 의사들도 왜 이런 일이 일어나는지 확신하지 못한다(aren’t sure)고 해요.","c":"F"},"h":"5fe57cbaa5"},{"n":3,"t":"tf","q":"Keeping a journal about what you eat and how you feel can help reduce night eating.","ko":"먹는 것과 기분에 대해 일기를 쓰면 야식을 줄이는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"15~16번 문장","s":[[15,"Also, keep a journal about what you eat and how you feel.","또한 당신이 무엇을 먹는지와 당신의 기분이 어떤지에 대해 일기를 써라."],[16,"This will help reduce your night eating.","이것이 당신의 야식을 줄이도록 도와줄 것이다."]],"w":"15번에서 일기를 쓰라고 하고, 16번에서 이것이 야식을 줄이는 데 도움이 된다고 해요.","c":"T"},"h":"6df403b267"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (I frequently eat late at night and regret it.)","ko":"나는 자주 밤늦게 먹고 그것을 후회한다.","opts":["자랑한다","기대한다","후회한다","즐긴다"],"word":"regret","r":{"a":"3) 후회한다","ev":"3번 문장","s":[[3,"I frequently eat late at night and regret it.","나는 자주 밤늦게 먹고 그것을 후회한다."]],"w":"밤늦게 먹고 나서 드는 마음이에요. 체크 문장들은 모두 야식증후군의 좋지 않은 모습이라 regret = 후회하다예요.","c":3},"h":"7df6fae353"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (I usually skip breakfast and don’t feel hungry until late afternoon.)","ko":"나는 대개 아침 식사를 거르고 오후 늦게까지 배고픔을 느끼지 않는다.","opts":["준비한다","거른다","남긴다","데운다"],"word":"skip","r":{"a":"2) 거른다","ev":"5번 문장","s":[[5,"I usually skip breakfast and don’t feel hungry until late afternoon.","나는 대개 아침 식사를 거르고 오후 늦게까지 배고픔을 느끼지 않는다."]],"w":"아침을 skip하고 오후 늦게까지 배고프지 않다고 했으니, 아침을 먹지 않는다는 뜻이에요. skip = (일을) 거르다예요.","c":2},"h":"2eb48ce903"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis will help you control the desire for food.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 당신이 음식에 대한 욕구를 조절하도록 도울 것이다.","opts":["야식증후군을 겪는 것","일기를 쓰는 것","음식에 대한 욕구","밤에 운동하는 것"],"r":{"a":"4) 밤에 운동하는 것","ev":"13~14번 문장","s":[[13,"First, exercise at night.","우선, 밤에 운동해라."],[14,"This will help you control the desire for food.","이것은 당신이 음식에 대한 욕구를 조절하도록 도울 것이다."]],"w":"13번 First, exercise at night. 바로 뒤라서 This는 밤에 운동하는 것이에요. 일기는 15번에서 Also로 따로 나와요.","c":4},"h":"d872544253"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But people with NES don’t experience the increase in these hormones.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 야식증후군을 앓는 사람들은 이러한 호르몬의 증가를 겪지 않는다.","opts":["야식증후군을 앓는 사람들은 이 호르몬의 증가를 겪지 않는다.","야식증후군을 앓는 사람들은 이 호르몬이 지나치게 늘어난다.","야식증후군을 앓는 사람들에게는 호르몬이 필요하지 않다.","야식증후군은 호르몬과 전혀 관계가 없다."],"r":{"a":"1) 야식증후군을 앓는 사람들은 이 호르몬의 증가를 겪지 않는다.","ev":"7번, 9~10번 문장","s":[[7,"At night, the body produces more of two hormones, melatonin and leptin.","밤에 신체는 멜라토닌과 렙틴이라는 두 가지 호르몬을 더 많이 생산한다."],[9,"But people with NES don’t experience the increase in these hormones.","그러나 야식증후군을 앓는 사람들은 이러한 호르몬의 증가를 겪지 않는다."],[10,"So, they feel hungry and can’t sleep.","따라서 그들은 배고픔을 느끼고 잠을 잘 수 없다."]],"w":"don’t experience the increase는 ‘증가를 겪지 않는다’예요. 호르몬이 늘지 않아서 10번처럼 배고프고 잠을 못 자요.","c":1},"h":"f69e4d56dd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["멜라토닌은 우리를 배고프게 만든다.","야식증후군은 사람들이 행복할 때 더 흔하다.","야식증후군이 있는 사람이 그것을 멈추기 위해 할 수 있는 몇 가지 일이 있다.","야식증후군은 어린이에게만 생긴다."],"opts":["Melatonin makes us hungry.","NES is more common when people feel happy.","There are some things people with NES can do to stop it.","NES only happens to children."],"r":{"a":"3) There are some things people with NES can do to stop it. (야식증후군이 있는 사람이 그것을 멈추기 위해 할 수 있는 몇 가지 일이 있다.)","ev":"12번 문장","s":[[12,"If you experience NES, there are some things you can do to stop it.","만약 당신이 야식증후군을 겪는다면, 그것을 멈추기 위해 당신이 할 수 있는 몇 가지 일이 있다."]],"w":"12번에서 야식증후군을 겪는다면 그것을 멈추기 위해 할 수 있는 몇 가지 일이 있다고 해요. 멜라토닌은 잠들게 도와주고(8번), 야식증후군은 스트레스를 받을 때 더 흔하며(11번), 어린이에게만 생기는 병이 아니에요.","c":3},"h":"2fd82f014f"},{"n":9,"t":"sum","q":"I eat a (A) when I get stressed or feel (B).","ko":"나는 스트레스를 받거나 (B)을(를) 느낄 때 (A) 먹는다.","oko":["(A) 조금 / (B) 슬픔","(A) 많이 / (B) 기쁨","(A) 조금 / (B) 기쁨","(A) 많이 / (B) 슬픔","(A) 많이 / (B) 피곤함"],"opts":["(A) little / (B) sad","(A) lot / (B) glad","(A) little / (B) glad","(A) lot / (B) sad","(A) lot / (B) tired"],"r":{"a":"4) (A) lot / (B) sad ((A) 많이 / (B) 슬픔)","ev":"2번 문장","s":[[2,"I eat a lot when I get stressed or feel sad.","나는 스트레스를 받거나 슬플 때 많이 먹는다."]],"w":"2번에서 I eat a lot when I get stressed or feel sad(나는 스트레스를 받거나 슬플 때 많이 먹는다)라고 해요. 조금(little) 먹는다거나 기쁘거나(glad) 피곤할(tired) 때라는 말은 본문에 없어요.","c":4},"h":"5691f61a51"},{"n":10,"t":"fill","q":"If you [A] with these [B], you might have night eating syndrome (NES).","ko":"당신이 이 [B]에 [A]한다면, 당신은 야식증후군(NES)을 앓고 있을지도 모른다.","bank":["agree","sentences","hungry","late","tired","careful"],"bko":{"agree":"동의하다","sentences":"문장들","hungry":"배고픈","late":"늦은","tired":"피곤한","careful":"조심하는"},"r":{"a":"[A] agree (동의하다), [B] sentences (문장들)","ev":"6번 문장","s":[[6,"If you agree with these sentences, you might have night eating syndrome (NES).","당신이 이 문장들에 동의한다면, 당신은 야식증후군(NES)을 앓고 있을지도 모른다."]],"w":"6번에서 If you agree with these sentences, you might have night eating syndrome (NES)(이 문장들에 동의한다면, 당신은 야식증후군을 앓고 있을지도 모른다)라고 해요. If you 뒤에는 동사 agree가, these 뒤에는 복수 명사 sentences가 와요.","c":null},"a":"[A] agree, [B] sentences","h":"410d80a1ac"}]},{"u":5,"id":"nl1-05-4","no":4,"ko":"초록색을 좋아하나요?","items":[{"n":1,"t":"tf","q":"Scheele’s green was created by a Swedish chemist in 1775.","ko":"Scheele’s green은 1775년에 스웨덴의 한 화학자에 의해 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Scheele’s green was created by a Swedish chemist in 1775.","Scheele’s green(셸레 그린)은 1775년에 스웨덴의 한 화학자에 의해 만들어졌다."]],"w":"5번에 Scheele’s green was created by a Swedish chemist in 1775가 그대로 나와요.","c":"T"},"h":"a45606a22b"},{"n":2,"t":"tf","q":"Scheele’s green was used only in children’s toys.","ko":"Scheele’s green은 어린이 장난감에만 사용되었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It was commonly used in wallpaper, clothes, and even children’s toys.","그것은 벽지, 의류, 그리고 심지어 어린이 장난감에도 흔히 사용되었다."]],"w":"6번에서 벽지, 옷, 그리고 심지어 어린이 장난감에도 쓰였다고 해요. 장난감에만 쓰인 것이 아니에요.","c":"F"},"h":"e056a37636"},{"n":3,"t":"tf","q":"Today’s green pigments are no longer dangerous.","ko":"오늘날의 녹색 색소는 더 이상 위험하지 않다.","r":{"a":"T (본문과 맞는 내용)","ev":"15번 문장","s":[[15,"Today’s green pigments have been improved and are no longer dangerous.","오늘날의 녹색 색소는 개선되어 더 이상 위험하지 않다."]],"w":"15번에서 오늘날의 녹색 색소는 개선되어 더 이상 위험하지 않다고 해요.","c":"T"},"h":"625dd9a99a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But in the past, it did not. In fact, it was poisonous.)","ko":"하지만 과거에 녹색은 그렇지 않았다. 사실, 그것은 독성이 있었다.","opts":["값비싼","유명한","오래된","독이 있는"],"word":"poisonous","r":{"a":"4) 독이 있는","ev":"4번, 9번 문장","s":[[4,"In fact, it was poisonous.","사실, 그것은 독성이 있었다."],[9,"That’s because it contained poison!","그것에 독이 들어 있었기 때문이었다!"]],"w":"뒤에서 독이 들어 있어 사람들이 아팠다고 해요(8~9번). poisonous = 독이 있는이에요.","c":4},"h":"8ec797bb60"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As a result, it was replaced by a pigment called Paris green in the 19th century.)","ko":"그 결과, 그것은 19세기에 Paris green이라는 색소로 대체되었다.","opts":["섞였다","금지되었다","대체되었다","발견되었다"],"word":"replaced","r":{"a":"3) 대체되었다","ev":"10번 문장","s":[[10,"As a result, it was replaced by a pigment called Paris green in the 19th century.","그 결과, 그것은 19세기에 Paris green(파리스 그린)이라는 색소로 대체되었다."]],"w":"독이 문제라서 Scheele’s green 대신 Paris green이 쓰였어요. be replaced by = ~로 대체되다예요.","c":3},"h":"c0998ad07b"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nLike Scheele’s green, it was eventually forbidden.","ko":"밑줄 친 it이 가리키는 것은?","sko":"Scheele’s green처럼 그것은 결국 금지되었다.","opts":["Scheele’s green","Paris green","오늘날의 녹색 색소","스웨덴의 화학자"],"r":{"a":"2) Paris green","ev":"13~14번 문장","s":[[13,"Due to Paris green, Cézanne suffered from diabetes and Monet went blind.","Paris green 때문에 Cézanne(세잔)은 당뇨병을 앓았고 Monet(모네)는 눈이 멀게 되었다."],[14,"Like Scheele’s green, it was eventually forbidden.","Scheele’s green처럼 그것은 결국 금지되었다."]],"w":"Like Scheele’s green이라고 비교했으니, it은 Scheele’s green이 아닌 Paris green이에요. 13번에서 Paris green이 피해를 줬다는 내용으로 이어져요.","c":2},"h":"6ef34e8c83"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Due to Paris green, Cézanne suffered from diabetes and Monet went blind.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Paris green 때문에 Cézanne(
