// 공통 데이터 도우미. 각 챕터 파일이 BEGIN → A(...) 순서로 항목을 넣는다.
const ITEMS=[],CHAPS={},UN={};let CURCH=0;
function BEGIN(ch,name,units){CURCH=ch;CHAPS[ch]={name:name,units:Object.keys(units).sort((a,b)=>parseInt(units[a].pp.replace(/\D*/,''))-parseInt(units[b].pp.replace(/\D*/,'')))};Object.keys(units).forEach(k=>{UN[ch+"-"+k]=Object.assign({ch:ch,k:k},units[k])})}
function A(u,sec,n,kind,o){const it=Object.assign({ch:CURCH,u:String(u),sec:sec,n:n,kind:kind},o);it.uk=CURCH+"-"+it.u;it.id=it.uk+"."+sec+"."+n;ITEMS.push(it)}
const mk=a=>a.map((x,i)=>"①②③④⑤⑥⑦"[i]+" "+x);
function SECLAB(it){const s=it.sec;if(s=="CU")return"개념 우선 확인 · "+it.n+"번";if(s=="MP")return"30초 완성 · "+it.n+"번";if(/^[ABC]$/.test(s))return s+" · "+it.n+"번";if(s=="SW")return"서술형 대비 · "+it.n+"번";if(s=="PT")return"출제 포인트 · "+it.n+"번";if(s=="T")return"실전 TEST · "+it.n+"번";return s+" · "+it.n+"번"}
function SECSHORT(it){const s=it.sec;if(s=="CU")return"개념"+it.n;if(s=="MP")return"30초"+it.n;if(/^[ABC]$/.test(s))return s+"-"+it.n;if(s=="SW")return"서술"+it.n;if(s=="PT")return"포인트"+it.n;if(s=="T")return"실전"+it.n;return s+"-"+it.n}

 pen:"be동사 + not + able to + 동사원형"});

A(1,"E",5,"w",{q:"괄호 안의 단어를 바르게 배열하여 문장을 완성하세요.<br>너는 길을 찾을 수 있을 것이다.<br>(find, be, to, able, your way, will, you)<br>→ ___ .",ans:"You will be able to find your way",full:"You will be able to find your way.",ko:"너는 길을 찾을 수 있을 것이다.",

A(2,"A",1,"c",{q:"우리말과 일치하도록 괄호 안에서 알맞은 것을 고르세요.<br>너는 그 수업을 듣는 게 좋겠다.<br>You ( had better / used to ) take the class.",opts:["had better","used to"],ans:"had better",full:"You had better take the class.",ko:"너는 그 수업을 듣는 게 좋겠다.",

A(2,"A",4,"c",{q:"우리말과 일치하도록 괄호 안에서 알맞은 것을 고르세요.<br>좋은 성적을 받으려면 열심히 공부해야 한다.<br>You ( should / would ) study hard to get good grades.",opts:["should","would"],ans:"should",full:"You should study hard to get good grades.",ko:"좋은 성적을 받으려면 열심히 공부해야 한다.",

A(2,"A",5,"c",{q:"우리말과 일치하도록 괄호 안에서 알맞은 것을 고르세요.<br>너는 지금 그 돈을 낼 필요가 없다.<br>You ( must not / don’t have to ) pay the money now.",opts:["must not","don’t have to"],ans:"don’t have to",full:"You don’t have to pay the money now.",ko:"너는 지금 그 돈을 낼 필요가 없다.",

 pen:"don’t have to = ~할 필요가 없다 (must not = 금지)"});
A(2,"A",6,"c",{q:"우리말과 일치하도록 괄호 안에서 알맞은 것을 고르세요.<br>그녀는 더 조심해야 했다.<br>She ( must / had to ) be more careful.",opts:["must","had to"],ans:"had to",full:"She had to be more careful.",ko:"그녀는 더 조심해야 했다.",

A(2,"B",1,"c",{q:"Emma ( have to / has to ) practice the piano.",opts:["have to","has to"],ans:"has to",full:"Emma has to practice the piano.",ko:"에마는 피아노를 연습해야 한다.",

A(2,"B",2,"c",{q:"You ( must not / don’t have to ) smoke in public places.",opts:["must not","don’t have to"],ans:"must not",full:"You must not smoke in public places.",ko:"공공장소에서 담배를 피워서는 안 된다.",

A(2,"B",3,"c",{q:"There ( would / used to ) be a park near my house.",opts:["would","used to"],ans:"used to",full:"There used to be a park near my house.",ko:"우리 집 근처에는 공원이 있었다.",

A(2,"B",4,"c",{q:"I think you ( should / would ) apologize to her.",opts:["should","would"],ans:"should",full:"I think you should apologize to her.",ko:"나는 네가 그녀에게 사과해야 한다고 생각해.",

 h:["본책 p.78 ‘2 수동태의 형태와 의미’ 아래의 ‘by + 목적격’을 생략할 수 있는 경우(English is spoken all over the world.)를 펴세요.","1) is eaten은 「be동사 + p.p.」 모양이에요(eat 먹다의 p.p.).  2) by가 없어도 쌀은 ‘먹히는’ 쪽이에요.","행위자(by ~)가 생략된 수동태예요. 어느 태일지 골라 보세요."],
 pen:"행위자가 일반인이면 by ~ 생략 (English is spoken ~ 처럼)"});

A(1,"B",1,"c",{q:"The rabbit was ( attacked / attacking ) by the lion.",opts:["attacked","attacking"],ans:"attacked",full:"The rabbit was attacked by the lion.",ko:"토끼는 사자에게 공격당했다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’의 「be동사 + p.p.」를 펴세요.","1) was 뒤에 by the lion(사자에 의해)이 있어요.  2) 토끼는 공격하는 쪽일까요, 공격당하는 쪽일까요? 당하는 문장은 be동사 뒤에 p.p.를 써요.","-ing가 붙은 쪽은 아니에요. -ed가 붙은 쪽을 고르세요."],
 pen:"was + p.p.(attacked) = 공격당했다"});
A(1,"B",2,"c",{q:"The room ( was / were ) decorated by them.",opts:["was","were"],ans:"was",full:"The room was decorated by them.",ko:"그 방은 그들에 의해 꾸며졌다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (2) 과거시제: was / were + p.p.를 펴세요.","1) 주어 The room(그 방)은 하나예요, 여럿이에요?  2) by them(그들에 의해)의 them이 아니라 주어에 be동사를 맞춰야 해요.","주어가 하나(단수)일 때 쓰는 과거 be동사예요. w로 시작하고 글자 수가 짧은 쪽이에요."],
 pen:"단수 주어 + was + p.p. (by them의 them은 주어가 아님)"});
A(1,"B",3,"c",{q:"Two people ( injured / were injured ) in the accident.",opts:["injured","were injured"],ans:"were injured",full:"Two people were injured in the accident.",ko:"그 사고에서 두 사람이 다쳤다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’의 「be동사 + p.p.」와, ‘「by + 목적격」을 생략할 수 있다’ 상자의 예문(Five people were killed in the accident. 상황이 중요할 때)을 펴세요.","1) 사람들은 사고로 다친 걸까요, 다치게 한 걸까요?  2) injure(다치게 하다)는 목적어가 있어야 하는데 뒤에 목적어가 없어요.","‘다침을 당한’ 뜻이 되려면 be동사가 필요해요. 두 단어인 쪽이에요."],
 pen:"목적어 없이 ‘~당했다’ = were + p.p. (행위자 by ~ 생략)"});
A(1,"B",4,"c",{q:"This machine ( was fixed / will be fixed ) tomorrow.",opts:["was fixed","will be fixed"],ans:"will be fixed",full:"This machine will be fixed tomorrow.",ko:"이 기계는 내일 수리될 것이다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (3) 미래시제: will be + p.p.를 펴세요.","1) tomorrow(내일)는 지난 때일까요, 앞으로 올 때일까요?  2) 앞일의 수동태는 「will be + p.p.」예요.","과거형 was가 있는 쪽은 아니에요. will이 있는 쪽이에요."],
 pen:"tomorrow(내일) = 미래 → will be + p.p."});
A(1,"B",5,"c",{q:"Keep the pan warm until the spaghetti ( is cooked / was cooked ).",opts:["is cooked","was cooked"],ans:"is cooked",full:"Keep the pan warm until the spaghetti is cooked.",ko:"스파게티가 다 요리될 때까지 팬을 따뜻하게 유지해라.",
 h:["본책 p.78 ‘3 수동태의 시제’ (1) 현재시제: am / are / is + p.p.를 펴세요.","1) Keep(유지해라)은 지금 하라고 시키는 말이에요.  2) 아직 스파게티가 완성되기 전이니 이미 끝난 과거는 아니에요.","과거 be동사(was)가 아닌 쪽이에요. 주어 the spaghetti(스파게티)는 단수예요."],
 pen:"지금 상황 = 현재시제 수동태 am/are/is + p.p."});
A(1,"B",6,"c",{q:"Linda and I ( are invited / were invited ) to the party yesterday.",opts:["are invited","were invited"],ans:"were invited",full:"Linda and I were invited to the party yesterday.",ko:"Linda와 나는 어제 그 파티에 초대받았다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (2) 과거시제: was / were + p.p.를 펴세요.","1) yesterday(어제)는 이미 지난 때예요.  2) 주어 Linda and I는 두 사람이라서 복수예요.","현재 be동사(are)가 아니라 과거 be동사가 있는 쪽이에요."],
 pen:"yesterday = 과거, 복수 주어 → were + p.p."});

A(1,"C",1,"w",{q:"Jessica played the song on the guitar.<br>→ The song ___ ___ on the guitar by Jessica.",ans:"was played",full:"The song was played on the guitar by Jessica.",ko:"그 노래는 Jessica에 의해 기타로 연주되었다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’의 능동태를 수동태로 바꾸는 예문(She drew the picture.)을 펴세요.","1) 능동태의 목적어 the song(그 노래)이 수동태의 주어가 돼요.  2) 능동태가 과거(played)이니 be동사도 과거, 그 뒤에 play(연주하다)의 p.p.를 써요.","빈칸 두 개: w로 시작하는 be동사 / p로 시작하는 p.p."],
 pen:"능동태 목적어 → 주어, 동사 → be동사 + p.p., 주어 → by + 목적격"});
A(1,"C",2,"w",{q:"Someone stole my bike.<br>→ My bike ___ ___ ___ someone.",ans:"was stolen by",full:"My bike was stolen by someone.",ko:"내 자전거는 누군가에게 도난당했다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’ 설명과 예문(My bike was stolen yesterday.)을 펴세요.","1) 능동태 주어 Someone(누군가)은 수동태 뒤로 가서 「by + 목적격」이 돼요.  2) stole은 steal(훔치다)의 과거형이고, 수동태는 be동사 + steal의 p.p.예요.","빈칸 세 개: be동사(과거) / steal(훔치다)의 p.p. / 행위자 앞에 붙는 전치사"],
 pen:"S + 과거동사 + O → O + was/were + p.p. + by S"});
A(1,"C",3,"w",{q:"The company will employ five people. (employ)<br>→ Five people ___ ___ ___ ___ the company.",ans:"will be employed by",full:"Five people will be employed by the company.",ko:"그 회사는 다섯 명을 고용할 것이다. = 다섯 명이 그 회사에 의해 고용될 것이다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (3) 미래시제: will be + p.p.를 펴세요.","1) 능동태에 will이 있으니 미래예요.  2) 수동태는 「will be + p.p.」이고, 마지막에 행위자 the company 앞에 by가 와요.","빈칸 네 개: w로 시작 / b로 시작 / employ(고용하다)의 p.p. / b로 시작하는 전치사"],
 pen:"미래 수동태 = will be + p.p. + by 행위자"});

A(1,"D",1,"w",{q:"These books <u>was written</u> in Chinese.",ans:"were written",full:"These books were written in Chinese.",ko:"이 책들은 중국어로 쓰였다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (2) 과거시제: was / were + p.p.를 펴세요.","1) 주어 These books(이 책들)는 하나일까요, 여럿일까요?  2) 복수 주어에는 be동사도 복수형을 써요. written은 write(쓰다)의 p.p.예요.","was만 고치면 돼요. 두 단어 중 첫 단어는 w로 시작해요."],
 pen:"복수 주어 + were + p.p."});
A(1,"D",2,"w",{q:"This picture was taken <u>by she</u>.",ans:"by her",full:"This picture was taken by her.",ko:"이 사진은 그녀에 의해 찍혔다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’의 「by + 목적격」을 펴세요.","1) by 뒤에는 주격(she)이 아니라 목적격을 써야 해요.  2) she(그녀)의 목적격을 떠올려 보세요.","by는 그대로 두고 she를 고친 두 단어예요. 뒤 단어는 h로 시작해요."],
 pen:"by + 목적격 (by her, by him, by them)"});
A(1,"D",3,"w",{q:"The Mona Lisa <u>painted</u> by Leonardo da Vinci.",ans:"was painted",full:"The Mona Lisa was painted by Leonardo da Vinci.",ko:"모나리자는 레오나르도 다빈치에 의해 그려졌다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’의 「be동사 + p.p.」를 펴세요.","1) 이 문장에는 동사가 painted(그려졌다, 원형 paint 그리다의 p.p.)뿐이에요.  2) 수동태에는 be동사가 꼭 필요해요. 모나리자는 오래전 그림이니 과거예요.","빠진 be동사를 앞에 넣은 두 단어예요. w로 시작해요."],
 pen:"수동태는 be동사 + p.p. (be동사를 빠뜨리지 말 것)"});
A(1,"D",4,"w",{q:"French and English <u>are speaking</u> in Canada.",ans:"are spoken",full:"French and English are spoken in Canada.",ko:"캐나다에서는 프랑스어와 영어가 사용된다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’의 「be동사 + p.p.」를 펴세요.","1) 프랑스어와 영어는 ‘말하는’ 쪽일까요, ‘말해지는’ 쪽일까요?  2) 수동태는 -ing가 아니라 p.p.를 써요. speak(말하다)의 p.p.는 불규칙이에요.","are는 그대로 두고 -ing형을 p.p.로 고쳐요. s로 시작하는 두 번째 단어예요."],
 pen:"수동태 = be동사 + p.p. (-ing 아님)"});
A(1,"D",5,"w",{q:"Nobody <u>was solved</u> the problem.",ans:"solved",full:"Nobody solved the problem.",ko:"아무도 그 문제를 풀지 못했다.",
 h:["본책 p.78 ‘1 능동태와 수동태’를 펴세요.","1) 주어 Nobody(아무도 ~ 않다)가 문제를 풀지 못한 거예요. 주어가 직접 행동하는 능동태예요.  2) 뒤에 the problem이라는 목적어가 이미 있어요.","be동사를 빼고 solve(풀다)의 과거형만 쓰세요. 한 단어, s로 시작해요."],
 pen:"주어가 직접 행동 + 목적어가 있으면 능동태 (be동사 X)"});
A(1,"D",6,"w",{q:"The meeting <u>will held</u> in Seoul next week.",ans:"will be held",full:"The meeting will be held in Seoul next week.",ko:"그 회의는 다음 주에 서울에서 열릴 것이다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (3) 미래시제: will be + p.p.를 펴세요.","1) 모임은 ‘열리는’ 쪽이니 수동태예요.  2) next week(다음 주)는 미래이니 「will be + p.p.」예요. held는 hold(열다)의 p.p.예요.","will과 held 사이에 한 단어를 넣어요. 모두 세 단어예요."],
 pen:"미래 수동태 = will be + p.p."});
A(1,"D",7,"w",{q:"The kitchen <u>is cleaned</u> yesterday.",ans:"was cleaned",full:"The kitchen was cleaned yesterday.",ko:"그 부엌은 어제 청소되었다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (2) 과거시제: was / were + p.p.를 펴세요.","1) yesterday(어제)는 지난 때를 말해요.  2) 지난 일이면 be동사도 과거형이어야 해요. 주어 The kitchen(부엌)은 단수예요.","is만 과거형으로 바꾼 두 단어예요. 첫 단어는 w로 시작해요."],
 pen:"yesterday = 과거 → was/were + p.p."});
A(1,"D",8,"w",{q:"This tower <u>is built</u> in 2000.",ans:"was built",full:"This tower was built in 2000.",ko:"이 탑은 2000년에 지어졌다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (2) 과거시제를 펴세요.","1) in 2000(2000년에)은 이미 지난 해예요.  2) 지난 해에 지어진 일은 과거시제 수동태로 써요.","is를 과거형으로 바꾼 두 단어예요. 첫 단어는 w로 시작해요."],
 pen:"과거를 나타내는 연도(in 2000) = 과거시제"});
A(1,"D",9,"w",{q:"My mother <u>is read</u> poems every morning.",ans:"reads",full:"My mother reads poems every morning.",ko:"우리 엄마는 매일 아침 시를 읽으신다.",
 h:["본책 p.78 ‘1 능동태와 수동태’를 펴세요.","1) 엄마가 시를 ‘읽는’ 쪽이에요. 뒤에 poems(시들)라는 목적어도 있어요.  2) every morning(매일 아침)은 습관이니 현재시제예요.","수동태가 아니라 능동태예요. 한 단어, 끝에 -s가 붙은 read(읽다)예요."],
 pen:"주어가 직접 행동 + 목적어 있음 = 능동태 (every morning → 현재형 reads)"});

A(1,"E",1,"w",{q:"우리말: 이 카메라는 독일에서 만들어졌다.<br>(made, in Germany, was)<br>This camera ___ .",ans:"was made in Germany",full:"This camera was made in Germany.",ko:"이 카메라는 독일에서 만들어졌다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’의 「be동사 + p.p.」를 펴세요.","1) 카메라는 ‘만들어진’ 것이니 수동태예요.  2) 「be동사 + p.p.」 순서로 놓고 장소(in Germany, 독일에서)는 맨 뒤에 둬요.","모두 네 단어예요. was로 시작해요."],
 pen:"be동사 + p.p. + 장소(in ~)"});
A(1,"E",2,"w",{q:"우리말: Tony는 그 개에게 물렸다.<br>(by, was, the dog, bitten)<br>Tony ___ .",ans:"was bitten by the dog",full:"Tony was bitten by the dog.",ko:"Tony는 그 개에게 물렸다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’의 「by + 목적격」 예문을 펴세요.","1) Tony는 물린 쪽이에요. 「be동사 + p.p.」 뒤에 「by + 행위자」를 붙여요.  2) bitten은 bite(물다)의 p.p.예요.","모두 다섯 단어예요. was로 시작하고 the dog로 끝나요."],
 pen:"be동사 + p.p. + by 행위자"});
A(1,"E",3,"w",{q:"우리말: 경기는 비 때문에 중단되었다.<br>(stopped, because of, was, the rain)<br>The game ___ .",ans:"was stopped because of the rain",full:"The game was stopped because of the rain.",ko:"그 경기는 비 때문에 중단되었다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’의 「be동사 + p.p.」를 펴세요.","1) 경기는 중단된 쪽이라 수동태예요.  2) 「be동사 + p.p.」를 먼저 쓰고, 이유(because of ~, ~ 때문에)를 이어 붙여요.","모두 여섯 단어예요. was로 시작하고 the rain으로 끝나요."],
 pen:"was + p.p. + because of ~ (~ 때문에)"});
A(1,"E",4,"w",{q:"우리말: 커피는 브라질에서 농부들에 의해 재배된다.<br>(by, is, farmers, grown)<br>The coffee ___ in Brazil.",ans:"is grown by farmers",full:"The coffee is grown by farmers in Brazil.",ko:"커피는 브라질에서 농부들에 의해 재배된다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (1) 현재시제: am / are / is + p.p.를 펴세요.","1) 변하지 않는 사실이라 현재시제예요.  2) The coffee는 단수이니 be동사는 is이고, grown은 grow(기르다)의 p.p.예요.","모두 네 단어예요. is로 시작하고 farmers로 끝나요."],
 pen:"현재 수동태 = is/are + p.p. + by 행위자"});
A(1,"E",5,"w",{q:"우리말: 그 소년은 선생님에게 벌을 받을 것이다.<br>(be, by, punished, will)<br>The boy ___ his teacher.",ans:"will be punished by",full:"The boy will be punished by his teacher.",ko:"그 소년은 선생님에게 벌을 받을 것이다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (3) 미래시제: will be + p.p.를 펴세요.","1) ‘벌을 받을 것이다’는 앞일이면서 당하는 쪽이에요.  2) 「will be + p.p.」 뒤에 행위자 his teacher가 이어지니 마지막에 by가 와요.","모두 네 단어예요. will로 시작하고 by로 끝나요."],
 pen:"will be + p.p. + by 행위자"});
A(1,"E",6,"w",{q:"우리말: 그 창문은 돌에 의해 깨졌다.<br>(a stone, was, the window, by, broken)<br>___",ans:"The window was broken by a stone.",full:"The window was broken by a stone.",ko:"그 창문은 돌에 의해 깨졌다.",
 h:["본책 p.78 ‘2 수동태의 형태와 의미’의 「주어 + be동사 + p.p. + by + 행위자」를 펴세요.","1) 먼저 주어(깨진 것)를 정하세요. 창문이에요.  2) 그다음 be동사 + p.p., 마지막에 「by + 행위자」를 놓아요. 대문자로 시작하고 마침표를 잊지 마세요.","모두 일곱 단어예요. The로 시작하고 stone으로 끝나요."],
 pen:"주어 + be동사 + p.p. + by 행위자"});
A(1,"E",7,"w",{q:"우리말: 작은 물고기는 더 큰 물고기에게 먹힌다.<br>(larger fish, are, by, eaten, small fish)<br>___",ans:"Small fish are eaten by larger fish.",full:"Small fish are eaten by larger fish.",ko:"작은 물고기는 더 큰 물고기에게 먹힌다.",
 h:["본책 p.78 ‘3 수동태의 시제’ (1) 현재시제: am / are / is + p.p.를 펴세요.","1) 먹히는 쪽(작은 물고기)이 주어예요.  2) fish는 복수로 쓰였으니 be동사는 복수형이에요. 그다음 p.p., 마지막에 「by + 행위자」를 놓아요.","모두 일곱 단어예요. Small로 시작하고 fish로 끝나요."],
 pen:"복수 주어 + are + p.p. + by 행위자"});

// ===================== UNIT 02 (wb pp.30-31) =====================
A(2,"A",1,"c",{q:"The letter ( was not / did not ) written by Emma.",opts:["was not","did not"],ans:"was not",full:"The letter was not written by Emma.",ko:"그 편지는 Emma가 쓴 것이 아니다.",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (1) 수동태의 부정문: be동사 + not + p.p.를 펴세요.","1) 빈칸 뒤에 written(쓰여진, 원형 write 쓰다의 p.p.)이 있어요.  2) 수동태 부정문은 be동사 뒤에 not을 붙여요.","did(원형 do 하다)는 능동태 부정문에 쓰는 말이에요. be동사가 있는 쪽이에요."],
 pen:"수동태 부정문 = be동사 + not + p.p."});
A(2,"A",2,"c",{q:"Paper ( can recycle / can be recycled ).",opts:["can recycle","can be recycled"],ans:"can be recycled",full:"Paper can be recycled.",ko:"종이는 재활용될 수 있다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태’와 ‘시험’ 상자(can recycled / can be recycled)를 펴세요.","1) 종이는 재활용을 하는 쪽일까요, 당하는 쪽일까요?  2) 조동사가 있는 수동태는 「조동사 + be + p.p.」예요.","be가 들어 있는 쪽, 세 단어짜리 쪽이에요."],
 pen:"조동사 + be + p.p. (be를 빠뜨리지 말 것)"});
A(2,"A",3,"c",{q:"The work ( may be finishing / may be finished ) early by Tony.",opts:["may be finishing","may be finished"],ans:"may be finished",full:"The work may be finished early by Tony.",ko:"그 일은 Tony에 의해 일찍 끝날지도 모른다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태’를 펴세요.","1) 뒤에 by Tony(Tony에 의해)가 있어서 일은 ‘끝내지는’ 쪽이에요.  2) 「조동사 + be + p.p.」 모양을 찾아요.","-ing가 붙은 쪽이 아니에요. -ed가 붙은 쪽이에요."],
 pen:"조동사 + be + p.p. (by 행위자가 있으면 수동태)"});
A(2,"A",4,"c",{q:"When ( did the telescope / was the telescope ) invented?",opts:["did the telescope","was the telescope"],ans:"was the telescope",full:"When was the telescope invented?",ko:"망원경은 언제 발명되었니?",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (2) 의문사 + be동사 + 주어 + p.p. ~?를 펴세요.","1) 뒤에 invented(발명된, 원형 invent 발명하다의 p.p.)가 있어요.  2) 망원경은 발명되는 쪽이니 수동태 의문문이에요.","do 계열(did)이 아니라 be동사가 의문사 바로 뒤에 와요."],
 pen:"의문사 + be동사 + 주어 + p.p. ~?"});
A(2,"A",5,"c",{q:"Glasses ( should be carried / should are carried ) carefully.",opts:["should be carried","should are carried"],ans:"should be carried",full:"Glasses should be carried carefully.",ko:"안경은 조심스럽게 들고 다녀야 한다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태’의 「조동사 + be + p.p.」를 펴세요.","1) should(~해야 한다) 같은 조동사 뒤에는 동사원형이 와요.  2) be동사의 원형은 be예요.","are를 쓰지 않은 쪽, 즉 be를 쓴 쪽이에요."],
 pen:"조동사 뒤에는 동사원형 → should be + p.p."});
A(2,"A",6,"c",{q:"( Was this flower watered / Did this flower water ) yesterday?",opts:["Was this flower watered","Did this flower water"],ans:"Was this flower watered",full:"Was this flower watered yesterday?",ko:"이 꽃은 어제 물을 받았니?",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (2) Be동사 + 주어 + p.p. ~?를 펴세요.","1) 꽃은 물을 ‘주는’ 쪽일까요, ‘받는’ 쪽일까요?  2) 받는 쪽이면 수동태 의문문은 Be동사로 시작해요.","Did로 시작하는 쪽이 아니에요. water(물을 주다)의 p.p.가 있는 쪽이에요."],
 pen:"수동태 의문문 = Be동사 + 주어 + p.p. ~?"});

A(2,"B",1,"w",{q:"우리말: 영어는 태국에서 사용되니? (speak)<br>___ English ___ in Thailand?",ans:"Is, spoken",full:"Is English spoken in Thailand?",ko:"영어는 태국에서 사용되니?",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (2) 수동태의 의문문을 펴세요.","1) 의문문은 Be동사가 맨 앞으로 나가요.  2) English는 단수이고 현재 상황이에요. speak(말하다)의 p.p.는 불규칙이에요.","빈칸 두 개: 대문자 I로 시작하는 be동사 / s로 시작하는 p.p."],
 pen:"Be동사 + 주어 + p.p. ~?"});
A(2,"B",2,"w",{q:"우리말: 다행히 그는 심하게 다치지 않았다.<br>Luckily, he ___ ___ hurt badly.",ans:"was not",full:"Luckily, he was not hurt badly.",ko:"다행히 그는 심하게 다치지 않았다.",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (1) be동사 + not + p.p.를 펴세요.","1) 빈칸 뒤에 hurt(다친, 원형 hurt 다치게 하다)가 p.p.로 쓰였어요.  2) ‘다치지 않았다’는 과거의 부정이에요.","빈칸 두 개: w로 시작하는 be동사 / not"],
 pen:"be동사 + not + p.p. (수동태 부정문)"});
A(2,"B",3,"w",{q:"우리말: 우리는 그 이야기에 감동받았다.<br>We ___ moved ___ the story.",ans:"were, by",full:"We were moved by the story.",ko:"우리는 그 이야기에 감동받았다.",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’의 수동태 예문과 p.78 ‘「by + 목적격」’을 보세요.","1) We(우리)는 감동을 ‘받은’ 쪽이에요.  2) 과거이고 주어가 복수이니 be동사는 과거 복수형이에요. 이야기는 감동을 준 행위자예요.","빈칸 두 개: w로 시작하는 be동사 / b로 시작하는 전치사"],
 pen:"were + p.p. + by 행위자"});
A(2,"B",4,"w",{q:"우리말: 그 쿠키는 언제 구워졌니?<br>___ ___ the cookies baked?",ans:"When were",full:"When were the cookies baked?",ko:"그 쿠키는 언제 구워졌니?",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (2) 의문사 + be동사 + 주어 + p.p. ~?를 펴세요.","1) ‘언제’를 뜻하는 의문사가 맨 앞에 와요.  2) 그다음 be동사가 오고 주어(the cookies, 복수)가 이어져요.","빈칸 두 개: W로 시작하는 의문사 / w로 시작하는 복수형 be동사"],
 pen:"의문사 + be동사 + 주어 + p.p. ~?"});
A(2,"B",5,"w",{q:"우리말: 어떤 사실들은 잊혀서는 안 된다.<br>Some facts must ___ ___ forgotten.",ans:"not be",full:"Some facts must not be forgotten.",ko:"어떤 사실들은 잊혀서는 안 된다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태’의 부정문: 조동사 + not + be + p.p.를 펴세요.","1) must(~해야 한다) 바로 뒤에 부정어가 와요.  2) 그 뒤에 be가 오고 마지막이 p.p.(forgotten, 잊혀진)예요.","빈칸 두 개: n으로 시작 / b로 시작. 순서대로 쓰세요."],
 pen:"조동사 + not + be + p.p."});

A(2,"C",1,"w",{q:"The show <u>not was canceled</u>.",ans:"was not canceled",full:"The show was not canceled.",ko:"그 쇼는 취소되지 않았다.",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (1) be동사 + not + p.p.를 펴세요.","1) 부정어 not은 어디에 와야 할까요?  2) be동사 바로 뒤, p.p.(canceled, 취소된) 앞이에요.","순서만 바꾼 세 단어예요. 첫 단어는 w로 시작해요."],
 pen:"be동사 + not + p.p. (not의 자리는 be동사 바로 뒤)"});
A(2,"C",2,"w",{q:"Why <u>did</u> the plan changed?",ans:"was",full:"Why was the plan changed?",ko:"그 계획은 왜 변경되었니?",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (2) 의문사 + be동사 + 주어 + p.p. ~?를 펴세요.","1) 계획은 ‘바뀌는’ 쪽이니 수동태예요.  2) 수동태 의문문은 do 계열이 아니라 be동사를 써요. changed는 이미 p.p.예요.","한 단어, w로 시작해요."],
 pen:"수동태 의문문은 did X → was/were + 주어 + p.p."});
A(2,"C",3,"w",{q:"Millions of people <u>will be visited</u> the new museum.",ans:"will visit",full:"Millions of people will visit the new museum.",ko:"수백만 명의 사람들이 그 새 박물관을 방문할 것이다.",
 h:["본책 p.78 ‘1 능동태와 수동태’와 p.80 ‘2 조동사가 있는 수동태’를 펴세요.","1) 사람들이 직접 방문하는 쪽이고 뒤에 the new museum이라는 목적어가 있어요.  2) 그러니 능동태예요. be + p.p.가 필요 없어요.","「will + 동사원형」으로 두 단어예요. v로 시작하는 동사원형을 쓰세요."],
 pen:"주어가 직접 행동 + 목적어 있음 = 능동태 (will + 동사원형)"});
A(2,"C",4,"w",{q:"The book is difficult, so it <u>can’t understand</u> easily.",ans:"can’t be understood",full:"The book is difficult, so it can’t be understood easily.",ko:"그 책은 어려워서 쉽게 이해될 수 없다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태’의 「조동사 + be + p.p.」를 펴세요.","1) it(그 책)은 이해하는 쪽일까요, 이해되는 쪽일까요?  2) 조동사 can’t 뒤에 be + p.p.를 써요. understand(이해하다)의 p.p.는 u로 시작하는 불규칙형이에요.","세 단어예요. can’t / b로 시작 / u로 시작."],
 pen:"조동사 + not + be + p.p. (can’t be understood)"});
A(2,"C",5,"w",{q:"The medicine <u>should is taken</u> twice a day.",ans:"should be taken",full:"The medicine should be taken twice a day.",ko:"그 약은 하루에 두 번 복용되어야 한다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태’의 「조동사 + be + p.p.」를 펴세요.","1) 조동사 should(~해야 한다) 뒤에는 동사원형이 와요.  2) is가 아니라 be동사의 원형을 써요.","is만 고쳐서 세 단어가 돼요. 가운데 단어는 b로 시작해요."],
 pen:"조동사 뒤에는 동사원형 → should be + p.p."});
A(2,"C",6,"w",{q:"The bill <u>can paid</u> by credit card.",ans:"can be paid",full:"The bill can be paid by credit card.",ko:"그 계산서는 신용카드로 지불될 수 있다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태’와 ‘시험’ 상자의 be를 빠뜨리지 말라는 설명을 펴세요.","1) 계산서는 지불되는 쪽이니 수동태예요.  2) can과 p.p.(paid, 원형 pay 지불하다) 사이에 빠진 말이 있어요.","한 단어를 가운데에 넣어 모두 세 단어예요. b로 시작해요."],
 pen:"조동사 + be + p.p. (be 빠뜨리지 말 것)"});

A(2,"D",1,"w",{q:"The hotel does not provide breakfast.<br>→ Breakfast ___ ___ ___ by the hotel.",ans:"is not provided",full:"Breakfast is not provided by the hotel.",ko:"그 호텔은 아침 식사를 제공하지 않는다. = 아침 식사는 그 호텔에 의해 제공되지 않는다.",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (1) 수동태의 부정문을 펴세요.","1) 능동태 does not provide(제공하지 않는다)는 현재 부정이에요.  2) 목적어 breakfast가 주어가 되고, 「be동사 + not + p.p.」로 써요.","빈칸 세 개: i로 시작 / not / provide(제공하다)의 p.p."],
 pen:"능동 부정문 → be동사 + not + p.p. + by ~"});
A(2,"D",2,"w",{q:"When did Jack use your computer?<br>→ When ___ your computer ___ ___ Jack?",ans:"was, used by",full:"When was your computer used by Jack?",ko:"Jack은 언제 네 컴퓨터를 사용했니? = 네 컴퓨터는 언제 Jack에 의해 사용되었니?",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (2) 의문사 + be동사 + 주어 + p.p. ~?를 펴세요.","1) did use(사용했다)는 과거예요. 컴퓨터가 주어가 돼요.  2) When 다음에 be동사, 주어, p.p., 「by + 행위자」 순서로 놓아요.","빈칸 세 개: w로 시작하는 be동사 / use(사용하다)의 p.p. / by"],
 pen:"When + was/were + 주어 + p.p. + by ~?"});
A(2,"D",3,"w",{q:"You should close the doors at night.<br>→ The doors ___ ___ ___ at night (by you).",ans:"should be closed",full:"The doors should be closed at night (by you).",ko:"너는 밤에 문을 닫아야 한다. = 문은 밤에 (너에 의해) 닫혀야 한다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태’의 「조동사 + be + p.p.」를 펴세요.","1) 능동태의 조동사 should(~해야 한다)는 그대로 가져와요.  2) 그 뒤에 be + p.p.(close 닫다의 p.p.)를 써요.","빈칸 세 개: s로 시작하는 조동사 / b로 시작 / c로 시작하는 p.p."],
 pen:"조동사는 그대로 + be + p.p."});
A(2,"D",4,"w",{q:"He didn’t answer the questions.<br>→ The questions ___ ___ ___ ___ .",ans:"weren’t answered by him",full:"The questions weren’t answered by him.",ko:"그는 그 질문들에 대답하지 않았다. = 그 질문들은 그에 의해 대답되지 않았다.",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (1) be동사 + not + p.p.와 p.78 ‘「by + 목적격」’을 펴세요.","1) didn’t는 과거 부정, 목적어 The questions는 복수 주어가 돼요.  2) 부정은 be동사에 not을 줄여 붙여 쓰고, 행위자 He는 by 뒤에서 목적격이 돼요.","빈칸 네 개: w로 시작하는 줄임말 / answer(대답하다)의 p.p. / 행위자 앞 전치사 / He(그)의 목적격"],
 pen:"didn’t + 동사원형 → weren’t/wasn’t + p.p. + by 목적격"});
A(2,"D",5,"w",{q:"We may not need more food for the party.<br>→ More food ___ ___ ___ ___ (by us) for the party.",ans:"may not be needed",full:"More food may not be needed (by us) for the party.",ko:"우리는 파티를 위해 더 많은 음식이 필요하지 않을 수도 있다. = 파티를 위해 더 많은 음식이 (우리에 의해) 필요되지 않을 수도 있다.",
 h:["본책 p.80 ‘2 조동사가 있는 수동태’의 부정문: 조동사 + not + be + p.p.를 펴세요.","1) 능동태의 may not(~하지 않을 수도 있다)을 그대로 가져와요.  2) 그 뒤에 be + p.p.(need 필요로 하다의 p.p.)를 써요.","빈칸 네 개: may / not / b로 시작 / n으로 시작하는 p.p."],
 pen:"조동사 + not + be + p.p."});

A(2,"E",1,"w",{q:"우리말: 네 자전거는 Tom이 고쳤니?<br>(by, your bike, was, repaired)<br>___ Tom?",ans:"Was your bike repaired by",full:"Was your bike repaired by Tom?",ko:"네 자전거는 Tom이 고쳤니?",
 h:["본책 p.80 ‘1 수동태의 부정문과 의문문’ (2) Be동사 + 주어 + p.p. ~?를 펴세요.","1) 의문문이니 Be동사가 맨 앞에 와요.  2) 그 뒤에 주어(자전거), p.p.(repaired, 고쳐진), 마지막에 by가 와서 Tom을 이어요.","모두 다섯 단어예요. Was로 시작하고 by로 끝나요."],

A(1,"D",1,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>I’ll wait here until the concert <u>will be</u> over.",ans:"is",full:"I’ll wait here until the concert is over.",ko:"나는 콘서트가 끝날 때까지 여기서 기다릴 것이다.",
 h:["본책 p.130 맨 아래 ‘시간·조건 부사절의 시제’ 설명을 펴세요.","1) until(~할 때까지)이 이끄는 부분은 시간 부사절이에요.  2) 시간 부사절에서는 미래의 일도 will(~할 것이다) 없이 현재시제로 써요.","will be(원형 be 이다)를 현재형 한 단어로 바꿔요. i로 시작해요."],
 pen:"시간 부사절 = 미래 대신 현재시제 (until the concert is over)"});
A(1,"D",2,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>He was driving, <u>because</u> he couldn’t answer the phone.",ans:"so",full:"He was driving, so he couldn’t answer the phone.",ko:"그는 운전 중이어서 전화를 받을 수 없었다.",
 h:["본책 p.130 ‘2 이유·결과를 나타내는 접속사’ 맨 위 설명(so 뒤에는 결과, because 뒤에는 원인)을 보세요.","1) 운전 중이었던 것이 원인이고, 전화를 못 받은 것이 결과예요.  2) 결과 앞에는 ‘그래서’라는 뜻의 접속사를 써요.","두 글자짜리 단어로 s로 시작해요."],
 pen:"원인, so + 결과 (He was driving, so he couldn’t ...)"});
A(1,"D",3,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>Unless you <u>don’t get</u> enough sleep, you’ll be tired.",ans:"get",full:"Unless you get enough sleep, you’ll be tired.",ko:"충분히 자지 않으면 너는 피곤할 것이다.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 아래 ‘주의’ 상자(unless에는 not을 함께 쓰지 않는다)를 보세요.","1) Unless는 ‘~하지 않으면’이라는 부정의 뜻이 이미 있어요.  2) 그러니 don’t(원형 do 하다 + not)를 또 쓰면 부정이 두 번이 돼요.","not의 뜻이 들어 있는 don’t를 지우면 돼요. 남는 동사 한 단어를 써요."],
 pen:"unless에는 not이 포함됨 → Unless you get (don’t get X)"});
A(1,"D",4,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>Jenny will get better if she <u>will take</u> the medicine.",ans:"takes",full:"Jenny will get better if she takes the medicine.",ko:"Jenny는 약을 먹으면 나아질 것이다.",
 h:["본책 p.130 맨 아래 ‘시간·조건 부사절의 시제’ 설명을 펴세요.","1) if(만약 ~하면)가 이끄는 부분은 조건 부사절이에요.  2) 조건 부사절에서는 미래의 일도 현재시제로 써요. 주어 she는 3인칭 단수예요.","take(먹다)에 -s를 붙인 한 단어예요."],
 pen:"조건 부사절 = 미래 대신 현재시제 (if she takes)"});
A(1,"D",5,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>The problem was <u>as</u> difficult that we couldn’t solve it.",ans:"so",full:"The problem was so difficult that we couldn’t solve it.",ko:"그 문제는 너무 어려워서 우리는 그것을 풀 수 없었다.",
 h:["본책 p.130 ‘2 이유·결과를 나타내는 접속사’ 표의 so ~ that ... 줄을 펴세요.","1) difficult(어려운) 뒤에 that이 이어져요.  2) ‘너무 ~해서 …하다’는 「so ~ that ...」으로 짝을 이뤄요.","as 대신 s로 시작하는 두 글자 단어를 써요."],
 pen:"so + 형용사 + that ... = 매우 ~해서 …하다 (as ~ that X)"});

A(1,"E",1,"w",{q:"( )의 단어를 바르게 배열하여 문장을 완성하시오. (bright, is, the sun, as)<br>___, you’d better put on sunglasses.",ans:"As the sun is bright",full:"As the sun is bright, you’d better put on sunglasses.",ko:"햇빛이 밝으니 선글라스를 쓰는 게 좋겠다.",
 h:["본책 p.130 ‘2 이유·결과를 나타내는 접속사’ 표의 as(~이므로)를 보세요.","1) 선글라스를 쓰라는 이유가 앞에 와요.  2) 접속사 + 주어 + 동사 순서로 놓아요. 맨 앞이라 첫 글자는 대문자예요.","모두 다섯 단어이고, 접속사 as로 시작해요."],
 pen:"As + 주어 + 동사, ... = ~이므로 (이유)"});
A(1,"E",2,"w",{q:"( )의 단어를 바르게 배열하여 문장을 완성하시오. (after, something, your teeth, eat, brush, you)<br>You have to ___.",ans:"brush your teeth after you eat something",full:"You have to brush your teeth after you eat something.",ko:"너는 무언가를 먹은 후에 양치질을 해야 한다.",

A(1,"E",3,"w",{q:"( )의 단어를 바르게 배열하여 문장을 완성하시오. (I, was, said, talking, while, nothing)<br>Jessica ___.",ans:"said nothing while I was talking",full:"Jessica said nothing while I was talking.",ko:"Jessica는 내가 말하는 동안 아무 말도 하지 않았다.",
 h:["본책 p.130 ‘1 시간을 나타내는 접속사’ 표의 while(~하는 동안)을 보세요.","1) 주어 Jessica 바로 뒤에는 동사가 와요. 어떤 일을 했는지부터 놓아요.  2) 그다음 while + 주어 + 동사(진행형)를 놓아요.","모두 여섯 단어이고, said로 시작해요."],
 pen:"주절 + while + 주어 + was/were + -ing (~하는 동안)"});
A(1,"E",4,"w",{q:"( )의 단어를 바르게 배열하여 문장을 완성하시오. (a great time, it, even though, rained, had)<br>We ___.",ans:"had a great time even though it rained",full:"We had a great time even though it rained.",ko:"비가 왔지만 우리는 즐거운 시간을 보냈다.",
 h:["본책 p.130 ‘3 조건·양보를 나타내는 접속사’ 표의 even though(비록 ~이지만)를 보세요.","1) 먼저 We 다음에 올 동사 + 목적어를 놓아요. 즐거운 시간을 가졌다는 말이에요.  2) 그다음 even though + 주어 + 동사로 반대되는 상황을 덧붙여요.","모두 여덟 단어(a great time은 세 단어, even though는 두 단어)이고, had로 시작해요."],
 pen:"주절 + even though + 주어 + 동사 = 비록 ~이지만"});
A(1,"E",5,"w",{q:"( )의 단어를 바르게 배열하여 문장을 완성하시오. (I, so, find a seat, that, crowded, couldn’t)<br>The subway was ___.",ans:"so crowded that I couldn’t find a seat",full:"The subway was so crowded that I couldn’t find a seat.",ko:"지하철이 너무 붐벼서 나는 자리를 찾을 수 없었다.",
 h:["본책 p.130 ‘2 이유·결과를 나타내는 접속사’ 표의 so ~ that ... 줄을 펴세요.","1) was 뒤에는 so + 형용사(crowded 붐비는)가 와요.  2) 그다음 that + 주어 + 동사로 결과를 말해요.","모두 여덟 단어(find a seat는 세 단어)이고, so로 시작해요."],
 pen:"so + 형용사 + that + 주어 + 동사 = 매우 ~해서 …하다"});

A(2,"A",3,"c",{q:"Take an umbrella, ( and / or ) you’ll get wet.",opts:["and","or"],ans:"or",full:"Take an umbrella, or you’ll get wet.",ko:"우산을 가져가라, 그러지 않으면 너는 젖을 것이다.",

A(2,"A",4,"c",{q:"I have been to neither Busan ( or / nor ) Mokpo.",opts:["or","nor"],ans:"nor",full:"I have been to neither Busan nor Mokpo.",ko:"나는 부산에도 목포에도 가 본 적이 없다.",

A(2,"A",6,"c",{q:"They will visit the museum ( either / neither ) today or tomorrow.",opts:["either","neither"],ans:"either",full:"They will visit the museum either today or tomorrow.",ko:"그들은 오늘이나 내일 둘 중 하루 박물관을 방문할 것이다.",

A(2,"A",7,"c",{q:"You can buy the raincoat as well ( as / so ) the sweater.",opts:["as","so"],ans:"as",full:"You can buy the raincoat as well as the sweater.",ko:"너는 스웨터뿐만 아니라 우비도 살 수 있다.",

A(2,"A",10,"c",{q:"I think both learning and playing ( is / are ) important.",opts:["is","are"],ans:"are",full:"I think both learning and playing are important.",ko:"나는 배우는 것과 노는 것 둘 다 중요하다고 생각한다.",

A(2,"B",1,"w",{q:"다음 두 문장이 같은 뜻이 되도록 빈칸에 알맞은 말을 쓰시오.<br>If you practice hard, you will play the piano well.<br>= Practice hard, ___ you will play the piano well.",ans:"and",full:"Practice hard, and you will play the piano well.",ko:"열심히 연습해라, 그러면 너는 피아노를 잘 치게 될 것이다.",

 pen:"him(목적어) → who(m) / that + 주어 + 동사"});
A(2,"C",2,"w",{q:"두 문장을 관계대명사를 써서 한 문장으로 연결할 때 빈칸에 알맞은 말을 쓰시오.<br>Please tell me the name of the shop. It sells good fruit.<br>→ Please tell me the name of the shop ___ sells good fruit.",ans:"that 또는 which",full:"Please tell me the name of the shop that [which] sells good fruit.",ko:"좋은 과일을 파는 가게의 이름을 내게 말해 주세요.",

A(2,"C",3,"w",{q:"두 문장을 관계대명사를 써서 한 문장으로 연결할 때 빈칸에 알맞은 말을 쓰시오.<br>We found a lake. Its water was quite blue.<br>→ We found a lake ___ water was quite blue.",ans:"whose",full:"We found a lake whose water was quite blue.",ko:"우리는 물이 꽤 푸른 호수를 발견했다.",
 h:["본책 p.144 ‘3 소유격 관계대명사’ 설명을 펴세요.","1) 두 번째 문장의 Its(그것의)는 호수의 물이라는 소유를 나타내요.  2) Its 같은 소유격이 관계대명사로 바뀌어요.","빈칸 바로 뒤에 명사 water(물)가 와요. w로 시작하는 다섯 글자예요."],

A(2,"D",1,"w",{q:"밑줄 친 부분을 바르게 고쳐 쓰시오.<br>Fish are a kind of animal <u>who</u> lives in the water.",ans:"that 또는 which",full:"Fish are a kind of animal that [which] lives in the water.",ko:"물고기는 물속에 사는 동물의 한 종류이다.",

A(2,"D",3,"w",{q:"밑줄 친 부분을 바르게 고쳐 쓰시오.<br>Peter likes a girl <u>that</u> hobby is taking pictures.",ans:"whose",full:"Peter likes a girl whose hobby is taking pictures.",ko:"Peter는 취미가 사진 찍기인 소녀를 좋아한다.",

A(2,"D",4,"w",{q:"밑줄 친 부분을 바르게 고쳐 쓰시오.<br>I remember the movie <u>who I watched it</u> with Paul.",ans:"that I watched 또는 which I watched",full:"I remember the movie that [which] I watched with Paul.",ko:"나는 Paul과 함께 본 영화를 기억한다.",

A(2,"D",5,"w",{q:"밑줄 친 부분을 바르게 고쳐 쓰시오.<br>He is a scientist <u>who love</u> art and music.",ans:"who loves 또는 that loves",full:"He is a scientist who loves art and music.",ko:"그는 예술과 음악을 사랑하는 과학자이다.",

A(2,"E",3,"w",{q:"우리말에 맞게 괄호 안의 말을 바르게 배열하시오.<br>우리가 기억해야 하는 영웅들이 있다.<br>There are ___ . (we, whom, must, heroes, remember)",ans:"heroes whom we must remember",full:"There are heroes whom we must remember.",ko:"우리가 기억해야 하는 영웅들이 있다.",

A(2,"E",5,"w",{q:"우리말에 맞게 괄호 안의 말을 바르게 배열하시오.<br>우리는 엄마가 만든 천연 비누를 사용한다.<br>We ___ . (the natural soap, that, Mom, use, made)",ans:"use the natural soap that Mom made",full:"We use the natural soap that Mom made.",ko:"우리는 엄마가 만든 천연 비누를 사용한다.",

A(3,"A",1,"w",{q:"밑줄 친 관계대명사를 생략할 수 있으면 ○, 없으면 ×를 쓰시오.<br>The teacher <u>whom</u> I respect is very kind.",ans:"○",full:"The teacher whom I respect is very kind. → The teacher I respect is very kind. (생략 가능)",ko:"내가 존경하는 선생님은 매우 친절하시다.",

A(3,"A",2,"w",{q:"밑줄 친 관계대명사를 생략할 수 있으면 ○, 없으면 ×를 쓰시오.<br>I have a cat <u>whose</u> eyes are blue.",ans:"×",full:"I have a cat whose eyes are blue. (whose는 생략 불가)",ko:"나는 눈이 파란 고양이가 한 마리 있다.",

 pen:"소유격 whose는 생략 불가"});
A(3,"A",3,"w",{q:"밑줄 친 관계대명사를 생략할 수 있으면 ○, 없으면 ×를 쓰시오.<br>Do you know the girl <u>who is</u> playing the flute?",ans:"○",full:"Do you know the girl who is playing the flute? → Do you know the girl playing the flute? (생략 가능)",ko:"너는 플루트를 연주하고 있는 소녀를 아니?",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2) 「주격 관계대명사 + be동사」 설명을 펴세요.","1) 밑줄 친 부분이 who만이 아니라 who is(주격 관계대명사 + be동사)예요.  2) 뒤에 playing(원형 play 연주하다)이라는 분사가 오면 「주격 관계대명사 + be동사」는 함께 생략할 수 있어요.","밑줄이 be동사까지 포함하는지, 뒤에 분사(-ing)가 오는지 두 가지를 확인해요."],
 pen:"「주격 관계대명사 + be동사」 + 분사 → 함께 생략 가능"});
A(3,"A",4,"w",{q:"밑줄 친 관계대명사를 생략할 수 있으면 ○, 없으면 ×를 쓰시오.<br>Everything <u>that</u> he said was true.",ans:"○",full:"Everything that he said was true. → Everything he said was true. (생략 가능)",ko:"그가 말한 모든 것은 사실이었다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (1) 목적격 관계대명사 설명을 펴세요.","1) that 뒤에 주어 he(그는)가 따로 있어요. said(원형 say 말하다)의 목적어 자리가 비어 있으니 that은 목적격이에요.  2) 목적격은 생략할 수 있어요.","that 뒤에 he said(주어 + 동사)가 있어요. 이 격이 생략 가능한 격인지 확인해요."],
 pen:"that + 주어 + 동사 = 목적격 → 생략 가능"});
A(3,"A",5,"w",{q:"밑줄 친 관계대명사를 생략할 수 있으면 ○, 없으면 ×를 쓰시오.<br>Many people still love <u>what</u> he wrote.",ans:"×",full:"Many people still love what he wrote. (what은 생략 불가)",ko:"많은 사람이 여전히 그가 쓴 것을 좋아한다.",
 h:["본책 p.146 ‘1 관계대명사 what’ 설명과 (2) 명사절 역할을 펴세요.","1) what은 선행사를 포함한 관계대명사로 ‘~하는 것’이라는 뜻이에요.  2) what을 빼면 love(좋아하다)의 목적어가 사라져 문장이 성립하지 않아요.","what을 지운 문장 Many people still love he wrote.가 말이 되는지 소리 내어 읽어 보세요."],
 pen:"what = the thing that → 생략 불가"});
A(3,"A",6,"w",{q:"밑줄 친 관계대명사를 생략할 수 있으면 ○, 없으면 ×를 쓰시오.<br>Daniel likes a girl <u>who</u> is kind and smart.",ans:"×",full:"Daniel likes a girl who is kind and smart. (who 단독 생략 불가)",ko:"Daniel은 친절하고 똑똑한 소녀를 좋아한다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2)를 펴세요. 생략되는 조건이 무엇인지 보세요.","1) who는 is(원형 be 이다)의 주어 역할을 하는 주격이에요.  2) 주격은 「주격 관계대명사 + be동사」를 함께 지울 때만 생략할 수 있고, 뒤가 분사(구)일 때예요. 여기서는 who만 밑줄이고 뒤가 형용사예요.","who만 지운 문장 Daniel likes a girl is kind and smart.가 말이 되는지 읽어 보세요."],

A(3,"A",7,"w",{q:"밑줄 친 관계대명사를 생략할 수 있으면 ○, 없으면 ×를 쓰시오.<br>This is a castle <u>which was</u> built in the early 1800s.",ans:"○",full:"This is a castle which was built in the early 1800s. → This is a castle built in the early 1800s. (생략 가능)",ko:"이곳은 1800년대 초에 지어진 성이다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2) 「주격 관계대명사 + be동사」 설명과 오른쪽 능동·수동 설명을 펴세요.","1) 밑줄 친 부분이 which was(주격 관계대명사 + be동사)예요.  2) 뒤에 built(원형 build 짓다)라는 과거분사가 오면 함께 생략할 수 있어요.","밑줄이 be동사까지 포함하는지, 뒤에 과거분사가 오는지 두 가지를 확인해요."],
 pen:"「which was」 + 과거분사 → 함께 생략 가능"});
A(3,"A",8,"w",{q:"밑줄 친 관계대명사를 생략할 수 있으면 ○, 없으면 ×를 쓰시오.<br>He drew a house <u>that</u> was made of chocolate.",ans:"×",full:"He drew a house that was made of chocolate. (that만 생략하면 불가, that was를 함께 지워야 가능)",ko:"그는 초콜릿으로 만들어진 집을 그렸다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2) 「주격 관계대명사 + be동사」를 펴세요.","1) 밑줄 친 부분은 that 하나뿐이에요. 뒤에 was(원형 be 이다)가 그대로 남아요.  2) that만 지우면 주어가 없는 문장이 돼요. 주격은 be동사와 함께 지울 때만 생략돼요.","that만 지운 문장 He drew a house was made of chocolate.가 말이 되는지 읽어 보세요."],
 pen:"주격 that 단독 생략 불가 (that was 함께만 가능)"});
A(3,"A",9,"w",{q:"밑줄 친 관계대명사를 생략할 수 있으면 ○, 없으면 ×를 쓰시오.<br>There is nothing <u>that</u> I can do for him.",ans:"○",full:"There is nothing that I can do for him. → There is nothing I can do for him. (생략 가능)",ko:"내가 그를 위해 할 수 있는 일은 아무것도 없다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (1) 목적격 관계대명사 설명을 펴세요.","1) that 뒤에 주어 I(나는)가 따로 있어요. do(하다)의 목적어 자리가 비어 있으니 that은 목적격이에요.  2) 목적격은 생략할 수 있어요.","that 뒤에 I can do(주어 + 동사)가 있어요. 이 격이 생략 가능한 격인지 확인해요."],
 pen:"nothing + that + 주어 + 동사 = 목적격 → 생략 가능"});
A(3,"A",10,"w",{q:"밑줄 친 관계대명사를 생략할 수 있으면 ○, 없으면 ×를 쓰시오.<br><u>What</u> she is looking at now is a painting by Van Gogh.",ans:"×",full:"What she is looking at now is a painting by Van Gogh. (what은 생략 불가)",ko:"그녀가 지금 보고 있는 것은 반 고흐의 그림이다.",
 h:["본책 p.146 ‘1 관계대명사 what’ 설명과 (2) 주어로 쓰이는 예문을 펴세요.","1) What she is looking at now가 문장 전체의 주어 덩어리예요. what은 ‘~하는 것’이라는 뜻이에요.  2) what을 지우면 주어 덩어리가 사라져 문장이 성립하지 않아요.","What을 지운 문장 She is looking at now is a painting ...이 말이 되는지 읽어 보세요."],
 pen:"what은 선행사를 포함 → 생략 불가"});

A(3,"B",1,"c",{q:"I can’t understand ( that / what ) you’re saying.",opts:["that","what"],ans:"what",full:"I can’t understand what you’re saying.",ko:"나는 네가 말하는 것을 이해할 수 없다.",
 h:["본책 p.146 ‘1 관계대명사 what’ 설명과 (2) 목적어 예문을 펴세요.","1) 괄호 앞에 선행사가 없어요.  2) ‘네가 말하는 것’이라는 뜻의 명사절이 understand(이해하다)의 목적어가 돼야 해요.","선행사를 포함한 ‘~하는 것’이에요. w로 시작하는 쪽이에요."],
 pen:"선행사 없이 ‘~하는 것’ = what"});
A(3,"B",2,"c",{q:"( That / What ) I like is taking a walk with my dog.",opts:["That","What"],ans:"What",full:"What I like is taking a walk with my dog.",ko:"내가 좋아하는 것은 내 개와 산책하는 것이다.",
 h:["본책 p.146 ‘1 관계대명사 what’ 설명과 (2) 주어 예문을 펴세요.","1) 문장 맨 앞에 선행사가 없어요.  2) ‘내가 좋아하는 것’이라는 명사절이 문장의 주어가 돼야 해요.","선행사를 포함한 ‘~하는 것’이에요. W로 시작하는 쪽이에요."],
 pen:"What + 주어 + 동사 = ‘~하는 것’ (주어 역할)"});
A(3,"B",3,"c",{q:"The movie ( we saw / we saw it ) last week was exciting.",opts:["we saw","we saw it"],ans:"we saw",full:"The movie we saw last week was exciting.",ko:"우리가 지난주에 본 영화는 흥미진진했다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (1) 목적격 관계대명사 설명과 p.144 ‘2 목적격 관계대명사’의 주의 상자를 펴세요.","1) 선행사 The movie와 we saw(우리가 보았다) 사이에 목적격 관계대명사가 생략돼 있어요. saw는 원형 see 보다예요.  2) 관계대명사가 목적어 역할을 하니 saw 뒤에 목적어 it을 또 쓰면 안 돼요.","it이 없는 쪽, 즉 짧은 쪽이에요."],
 pen:"목적격 관계대명사 생략 + 목적어는 다시 쓰지 않음"});
A(3,"B",4,"c",{q:"Do you know the girl ( talking / is taking ) to Eric?",opts:["talking","is taking"],ans:"talking",full:"Do you know the girl talking to Eric?",ko:"너는 Eric에게 이야기하고 있는 소녀를 아니?",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2) 「주격 관계대명사 + be동사」 설명과 오른쪽 능동 관계 설명을 펴세요.","1) 이 문장에는 이미 동사 Do you know가 있어요. 또 동사 is taking(원형 take 가지다)을 쓰면 동사가 두 개가 돼요.  2) 소녀가 ‘이야기하는’ 능동 관계이니 현재분사로 앞 명사를 꾸며요.","t로 시작하고 -ing로 끝나는 쪽이에요."],
 pen:"선행사와 분사가 능동 관계 → 현재분사(-ing)로 후치 수식"});
A(3,"B",5,"c",{q:"I will never forget ( that / what ) you did for me.",opts:["that","what"],ans:"what",full:"I will never forget what you did for me.",ko:"나는 네가 나를 위해 해 준 것을 절대 잊지 않을 것이다.",
 h:["본책 p.146 ‘1 관계대명사 what’ 설명과 (2) 목적어 예문을 펴세요.","1) 괄호 앞에 선행사가 없고, 뒤의 did(원형 do 하다) 뒤에는 목적어가 빠져 있어요.  2) ‘네가 해 준 것’이라는 뜻이 forget(잊다)의 목적어가 돼야 해요.","선행사를 포함한 ‘~하는 것’이에요. w로 시작하는 쪽이에요."],
 pen:"선행사 없음 + 목적어 빠짐 = what"});
A(3,"B",6,"c",{q:"The story ( that / what ) he told me was not true.",opts:["that","what"],ans:"that",full:"The story that he told me was not true.",ko:"그가 나에게 말해 준 이야기는 사실이 아니었다.",
 h:["본책 p.146 ‘1 관계대명사 what’ 오른쪽의 ‘관계대명사 that vs. 관계대명사 what’ 설명을 펴세요.","1) 괄호 앞에 선행사 The story(이야기)가 있어요.  2) 선행사가 있으면 that을 쓰고, what은 선행사를 포함하니 선행사 뒤에 쓰지 않아요. told(원형 tell 말해 주다)의 목적어 자리예요.","선행사가 있을 때 쓰는 쪽이에요. t로 시작해요."],
 pen:"선행사 있음 → that, 선행사 없음 → what"});
A(3,"B",7,"c",{q:"Do the things ( which / what ) you’d like to do.",opts:["which","what"],ans:"which",full:"Do the things which you’d like to do.",ko:"네가 하고 싶은 일들을 해라.",
 h:["본책 p.146 ‘1 관계대명사 what’의 주의 상자(what 앞에는 선행사를 쓰지 않는다)를 펴세요.","1) 괄호 앞에 선행사 the things(것들)가 있어요.  2) 선행사가 있는데 what을 쓰면 틀려요. what은 선행사를 이미 포함하고 있어요.","선행사 뒤에 쓰는 쪽이에요. 두 보기 중 긴 쪽이에요."],
 pen:"선행사 the things 뒤에는 which / that (what X)"});
A(3,"B",8,"c",{q:"I read a book ( written / that written ) by Charles Dickens.",opts:["written","that written"],ans:"written",full:"I read a book written by Charles Dickens.",ko:"나는 Charles Dickens가 쓴 책을 읽었다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2) 「주격 관계대명사 + be동사」 설명의 I’m reading a novel written in English. 예문을 펴세요.","1) 책은 ‘쓰여진’ 수동 관계예요. written은 원형 write 쓰다의 과거분사예요.  2) that written은 ‘that + 분사’라서 be동사가 없어 틀려요. 분사 앞에는 that was를 함께 쓰거나, 아예 모두 생략해요.","that이 없는 쪽, 즉 한 단어짜리 보기예요."],
 pen:"명사 + 과거분사(수동) 후치 수식, 「that + 분사」는 틀림"});
A(3,"B",9,"c",{q:"The kids ( play / playing ) at the beach look happy.",opts:["play","playing"],ans:"playing",full:"The kids playing at the beach look happy.",ko:"해변에서 놀고 있는 아이들은 행복해 보인다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2) 「주격 관계대명사 + be동사」 설명과 오른쪽 능동 관계 설명을 펴세요.","1) 이 문장의 진짜 동사는 look(~해 보인다)이에요.  2) 괄호 안은 앞 명사 The kids(아이들)를 꾸미는 말이에요. 아이들이 ‘놀고 있는’ 능동 관계이니 분사를 써요. play는 원형 play 놀다예요.","-ing가 붙은 쪽이에요."],
 pen:"능동 관계 후치 수식 → 현재분사(-ing)"});
A(3,"B",10,"c",{q:"Jenny likes the movies ( direct / directed ) by Steven Spielberg.",opts:["direct","directed"],ans:"directed",full:"Jenny likes the movies directed by Steven Spielberg.",ko:"Jenny는 Steven Spielberg가 감독한 영화들을 좋아한다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2) 「주격 관계대명사 + be동사」 설명의 오른쪽 능동·수동 설명을 펴세요.","1) 영화는 감독 ‘당하는’ 수동 관계예요. by Steven Spielberg(Spielberg에 의해)가 뒤에 있는 것도 단서예요.  2) 수동이면 과거분사로 앞 명사를 꾸며요. direct는 원형 direct 감독하다예요.","-ed가 붙은 쪽이에요."],
 pen:"명사 + 과거분사 + by ~ = 수동 후치 수식"});

A(3,"C",1,"w",{q:"밑줄 친 부분을 우리말로 옮기시오.<br>My sister believes <u>what I say</u>.",ans:"내가 말하는 것을",full:"My sister believes what I say. (what I say = 내가 말하는 것을)",ko:"내 여동생은 내가 말하는 것을 믿는다.",
 h:["본책 p.146 ‘1 관계대명사 what’ (1)의 what = the thing that 설명을 펴세요.","1) what은 ‘~하는 것’이라는 뜻이에요.  2) 주어 I(나는)와 동사 say(말하다)가 이어져서 ‘내가 말하는 것’이 되고, believes(원형 believe 믿다)의 목적어라 ‘~을’을 붙여요.","‘내가’로 시작하고 ‘것을’로 끝나요."],
 pen:"what + 주어 + 동사 = ‘주어가 ~하는 것(을)’"});
A(3,"C",2,"w",{q:"밑줄 친 부분을 우리말로 옮기시오.<br><u>The boy eating ice cream</u> looks happy.",ans:"아이스크림을 먹고 있는 저 소년은",full:"The boy eating ice cream looks happy. (The boy eating ice cream = 아이스크림을 먹고 있는 저 소년은)",ko:"아이스크림을 먹고 있는 저 소년은 행복해 보인다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2) 「주격 관계대명사 + be동사」 생략 설명을 펴세요.","1) The boy 뒤의 eating(원형 eat 먹다)은 현재분사로 소년을 꾸며요. who is가 생략된 모양이에요.  2) ‘~하고 있는’으로 해석하고 소년을 뒤에 붙여요. 이 덩어리는 문장의 주어예요.","‘아이스크림을’로 시작하고 ‘소년은’으로 끝나요. 가운데는 eating을 ‘~하고 있는’ 꼴로 넣어요."],
 pen:"명사 + 현재분사 = ‘~하고 있는 + 명사’ (who is 생략)"});
A(3,"C",3,"w",{q:"밑줄 친 부분을 우리말로 옮기시오.<br>She bought <u>a table made in Italy</u>.",ans:"이탈리아에서 만들어진 탁자를",full:"She bought a table made in Italy. (a table made in Italy = 이탈리아에서 만들어진 탁자를)",ko:"그녀는 이탈리아에서 만들어진 탁자를 샀다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2) 「주격 관계대명사 + be동사」 설명의 I’m reading a novel written in English. 예문을 펴세요.","1) a table(탁자) 뒤의 made(원형 make 만들다)는 과거분사로 탁자를 꾸며요. which was가 생략된 모양이에요.  2) 탁자가 ‘만들어진’ 수동 관계예요.","‘이탈리아에서’로 시작하고 ‘탁자를’로 끝나요. 가운데는 made를 수동의 ‘~된’ 꼴로 넣어요."],
 pen:"명사 + 과거분사 = ‘~된 + 명사’ (which was 생략)"});

A(3,"D",1,"w",{q:"밑줄 친 부분을 바르게 고쳐 쓰시오.<br>Can you understand <u>which</u> I’m saying?",ans:"what",full:"Can you understand what I’m saying?",ko:"너는 내가 말하는 것을 이해할 수 있니?",
 h:["본책 p.146 ‘1 관계대명사 what’ 설명을 펴세요.","1) which 앞에 선행사가 없어요.  2) understand(이해하다)의 목적어가 되는 ‘내가 말하는 것’이라는 명사절이 필요해요.","선행사를 포함한 ‘~하는 것’이에요. w로 시작하는 네 글자예요."],
 pen:"선행사 없이 ‘~하는 것’ = what"});
A(3,"D",2,"w",{q:"밑줄 친 부분을 바르게 고쳐 쓰시오.<br>This hat is exactly <u>that</u> I want.",ans:"what",full:"This hat is exactly what I want.",ko:"이 모자는 바로 내가 원하는 것이다.",
 h:["본책 p.146 ‘1 관계대명사 what’ 설명과 (2) 보어 예문 This is what we did. 를 펴세요.","1) that 앞에 선행사가 없어요. 보어 자리에 ‘내가 원하는 것’이 와야 해요.  2) 선행사를 포함하는 관계대명사를 써요.","w로 시작하는 네 글자예요."],
 pen:"보어 자리의 ‘~하는 것’ = what"});
A(3,"D",3,"w",{q:"밑줄 친 부분을 바르게 고쳐 쓰시오.<br>Food <u>is cooked</u> by my mother is always delicious.",ans:"cooked 또는 that is cooked 또는 which is cooked",full:"Food cooked by my mother is always delicious. (= Food that [which] is cooked by my mother is always delicious.)",ko:"우리 어머니가 요리하신 음식은 항상 맛있다.",
 h:["본책 p.146 ‘2 관계대명사의 생략’ (2) 「주격 관계대명사 + be동사」 설명을 펴세요.","1) 이 문장에는 진짜 동사 is(원형 be 이다)가 이미 있어요. 앞의 is cooked(원형 cook 요리하다)까지 있으면 동사가 둘이 돼요.  2) Food를 꾸미는 말은 과거분사로 쓰거나, that / which를 붙여 절로 써요.","한 단어로 고치면 -ed 모양의 분사이고, 길게 쓰면 앞에 that이나 which를 붙여요."],
 pen:"명사 + 과거분사(수동) 또는 명사 + that is + 과거분사"});
A(3,"D",4,"w",{q:"밑줄 친 부분을 바르게 고쳐 쓰시오.<br>Look at the rabbits <u>are eating</u> carrots.",ans:"eating 또는 that are eating 또는 which are eating",full:"Look at the rabbits eating carrots. (= Look at the rabbits that [which] are eating carrots.)",ko:"당근을 먹고 있는 토끼들을 보아라.",

 h:["본책 p.160 ‘2 가정법 과거완료의 직설법 전환’의 예문(If I had taken a taxi ...)을 보세요.","1) 가정법 과거완료의 긍정은 직설법 과거의 부정이에요.  2) had taken(원형 take 받아들이다)은 didn’t + 동사원형, could have solved(원형 solve 풀다)는 couldn’t + 동사원형이 돼요.","두 칸 모두 두 단어예요. 둘 다 n’t가 들어가요."],
 pen:"가정법 과거완료 → 직설법 과거 (had taken → didn’t take)"});
A(2,"B",4,"w",{q:"다음 문장을 가정법 문장으로 바꿔 쓰시오.<br>As Jenny didn’t do her homework, she didn’t get an A.<br>If Jenny ___ her homework, she ___ an A.",ans:"had done, would have gotten",full:"If Jenny had done her homework, she would have gotten an A.",ko:"Jenny가 숙제를 했다면 A를 받았을 텐데.",

 pen:"직설법 과거 부정 → 가정법 과거완료 긍정 (had done / would have gotten)"});
A(2,"B",5,"w",{q:"다음 문장을 가정법 문장으로 바꿔 쓰시오.<br>As you weren’t there, you didn’t see the accident.<br>If you ___ there, you ___ the accident.",ans:"had been, would have seen",full:"If you had been there, you would have seen the accident.",ko:"네가 거기에 있었다면 그 사고를 봤을 텐데.",
 h:["본책 p.160 ‘2 가정법 과거완료의 직설법 전환’을 펴세요.","1) weren’t there와 didn’t see는 모두 부정이니 가정법에서는 긍정이에요.  2) if절은 had + p.p., 주절은 would have + p.p.예요.","첫째 칸은 had + be의 p.p. 두 단어, 둘째 칸은 would have + see(보다)의 p.p. 세 단어예요."],

A(2,"B",6,"w",{q:"다음 문장을 직설법 문장으로 바꿔 쓰시오.<br>If I had watched the weather forecast, I might not have gone out.<br>As I ___ the weather forecast, I ___ out.",ans:"didn’t watch, went",full:"As I didn’t watch the weather forecast, I went out.",ko:"나는 일기예보를 보지 않았기 때문에 외출했다.",
 h:["본책 p.160 ‘2 가정법 과거완료의 직설법 전환’을 펴세요.","1) 앞부분(had watched)은 긍정이니 직설법에서는 부정이에요.  2) 뒷부분(might not have gone)은 부정이니 직설법에서는 긍정이고, 과거시제로 써요.","첫째 칸은 did not의 줄임말 + watch 두 단어, 둘째 칸은 go(가다)의 과거형 한 단어예요."],
 pen:"가정법 과거완료 부정 → 직설법 과거 긍정 (might not have gone → went)"});

A("1-2","A",1,"c",{q:"가정법 과거인지 가정법 과거완료인지 고르시오.<br>If I had a spaceship, I could fly to the moon.",opts:["가정법 과거","가정법 과거완료"],ans:"가정법 과거",full:"If I had a spaceship, I could fly to the moon. = 가정법 과거",ko:"내게 우주선이 있다면 달까지 날아갈 수 있을 텐데.",
 h:["본책 p.160 ‘3 가정법 과거와 가정법 과거완료 비교’와 아래 비교 표를 펴세요.","1) if절 동사 had(원형 have 가지다)가 had + p.p.일까요, 그냥 과거형일까요?  2) 주절 could fly(원형 fly 날다)는 could + 동사원형이에요.","if절에 had + p.p.가 없고 주절에 have + p.p.가 없으면 현재 사실의 반대예요. 이 문장에 have + p.p.가 있는지 찾아보세요."],
 pen:"if절 과거형 + 주절 would / could + 동사원형 = 가정법 과거"});
A("1-2","A",2,"c",{q:"가정법 과거인지 가정법 과거완료인지 고르시오.<br>If we didn’t have language, we couldn’t communicate easily.",opts:["가정법 과거","가정법 과거완료"],ans:"가정법 과거",full:"If we didn’t have language, we couldn’t communicate easily. = 가정법 과거",ko:"우리에게 언어가 없다면 쉽게 의사소통할 수 없을 텐데.",
 h:["본책 p.160 ‘3 가정법 과거와 가정법 과거완료 비교’ 표를 펴세요.","1) if절 didn’t have(원형 have 가지다)는 과거형의 부정이에요.  2) 주절 couldn’t communicate(원형 communicate 의사소통하다)는 조동사 + 동사원형이에요.","주절 couldn’t 뒤에 have + p.p.가 있는지, 동사원형이 있는지 확인해요."],
 pen:"If + 과거형 ~, 주어 + could + 동사원형 = 가정법 과거"});
A("1-2","A",3,"c",{q:"가정법 과거인지 가정법 과거완료인지 고르시오.<br>If I had had time, I could have visited you.",opts:["가정법 과거","가정법 과거완료"],ans:"가정법 과거완료",full:"If I had had time, I could have visited you. = 가정법 과거완료",ko:"내게 시간이 있었다면 너를 방문할 수 있었을 텐데.",
 h:["본책 p.160 ‘3 가정법 과거와 가정법 과거완료 비교’ 표를 펴세요.","1) if절 had had(원형 have 가지다)는 had + p.p.예요.  2) 주절 could have visited(원형 visit 방문하다)는 could have + p.p.예요.","if절과 주절 모두에서 have / had + p.p. 모양을 찾아보세요. 과거 사실의 반대인지 현재 사실의 반대인지 정해요."],
 pen:"If + had + p.p. ~, could have + p.p. = 가정법 과거완료"});
A("1-2","A",4,"c",{q:"가정법 과거인지 가정법 과거완료인지 고르시오.<br>If I were a teacher, I would never give tests.",opts:["가정법 과거","가정법 과거완료"],ans:"가정법 과거",full:"If I were a teacher, I would never give tests. = 가정법 과거",ko:"내가 선생님이라면 절대 시험을 내지 않을 텐데.",
 h:["본책 p.160 ‘3 가정법 과거와 가정법 과거완료 비교’ 표를 펴세요.","1) if절에 were(원형 be 이다)가 있어요.  2) 주절 would never give(원형 give 주다)는 would + 동사원형이에요.","if절에 had + p.p.가 있는지, 주절에 have + p.p.가 있는지 확인해요. 둘 다 없으면 현재 사실의 반대예요."],
 pen:"If + were ~, would + 동사원형 = 가정법 과거"});
A("1-2","A",5,"c",{q:"가정법 과거인지 가정법 과거완료인지 고르시오.<br>If Ted had known about it, he would have helped us.",opts:["가정법 과거","가정법 과거완료"],ans:"가정법 과거완료",full:"If Ted had known about it, he would have helped us. = 가정법 과거완료",ko:"Ted가 그것에 대해 알았다면 그는 우리를 도왔을 텐데.",
 h:["본책 p.160 ‘3 가정법 과거와 가정법 과거완료 비교’ 표를 펴세요.","1) if절 had known(원형 know 알다)은 had + p.p.예요.  2) 주절 would have helped(원형 help 돕다)는 would have + p.p.예요.","if절의 had known과 주절의 would have helped는 어떤 시점의 반대를 말할까요? 표에서 같은 모양을 찾아요."],
 pen:"If + had + p.p. ~, would have + p.p. = 가정법 과거완료"});

A("1-2","B",1,"c",{q:"If Dave ( goes / went ) there, he would love that place.",opts:["goes","went"],ans:"went",full:"If Dave went there, he would love that place.",ko:"Dave가 거기에 간다면 그는 그곳을 매우 좋아할 텐데.",
 h:["본책 p.158 ‘2 가정법 과거’ 표(If + 주어 + 동사의 과거형)를 펴세요.","1) 주절에 would love(사랑하다, 매우 좋아하다)가 있어요.  2) would가 있으니 현재 사실의 반대를 가정하는 가정법 과거예요.","go(가다)의 과거형이에요. w로 시작해요."],
 pen:"가정법 과거: If + 과거형 ~, would + 동사원형"});
A("1-2","B",2,"c",{q:"If he ( came / had come ) earlier, he would have met Stella.",opts:["came","had come"],ans:"had come",full:"If he had come earlier, he would have met Stella.",ko:"그가 더 일찍 왔다면 Stella를 만났을 텐데.",
 h:["본책 p.160 ‘가정법 과거완료’ 표를 펴세요.","1) 주절 would have met(원형 meet 만나다)이 would have + p.p.예요.  2) 그러면 if절은 had + p.p.예요.","had가 들어간 두 단어 쪽이에요."],
 pen:"주절 would have + p.p. → if절 had + p.p."});
A("1-2","B",3,"c",{q:"We ( would play / would have played ) tennis if it stopped raining.",opts:["would play","would have played"],ans:"would play",full:"We would play tennis if it stopped raining.",ko:"비가 그친다면 우리는 테니스를 칠 텐데.",
 h:["본책 p.158 ‘2 가정법 과거’ 표의 주절 부분을 보세요.","1) if절 stopped(원형 stop 멈추다)는 과거형이지 had + p.p.가 아니에요.  2) if절이 과거형이면 주절은 would + 동사원형이에요.","have가 없는 두 단어 쪽이에요."],

A("1-2","B",4,"c",{q:"If we had stayed in Florida, we ( could go / could have gone ) to the beach.",opts:["could go","could have gone"],ans:"could have gone",full:"If we had stayed in Florida, we could have gone to the beach.",ko:"우리가 플로리다에 머물렀다면 해변에 갈 수 있었을 텐데.",
 h:["본책 p.160 ‘가정법 과거완료’ 표의 주절(could + have + p.p.)을 보세요.","1) if절 had stayed(원형 stay 머무르다)가 had + p.p.예요.  2) 그러면 주절은 조동사 + have + p.p.예요.","have가 들어간 세 단어 쪽이에요."],
 pen:"If + had + p.p., could have + p.p."});
A("1-2","B",5,"c",{q:"If Bob ( were / had been ) healthy, he could travel around the world.",opts:["were","had been"],ans:"were",full:"If Bob were healthy, he could travel around the world.",ko:"Bob이 건강하다면 그는 세계 일주를 할 수 있을 텐데.",

 pen:"주절 could + 동사원형 → if절 were / 과거형"});
A("1-2","B",6,"c",{q:"I ( would join / would have joined ) the band if I had played the guitar well.",opts:["would join","would have joined"],ans:"would have joined",full:"I would have joined the band if I had played the guitar well.",ko:"내가 기타를 잘 쳤다면 그 밴드에 들어갔을 텐데.",
 h:["본책 p.160 ‘가정법 과거와 가정법 과거완료 비교’ 표를 펴세요.","1) if절 had played(원형 play 연주하다)가 had + p.p.예요.  2) 과거 사실의 반대이니 주절은 would have + p.p.예요.","have가 들어간 세 단어 쪽이에요."],
 pen:"if절 had + p.p. → 주절 would have + p.p."});

A("1-2","C",1,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>If you listened carefully, you <u>will know</u> about it.",ans:"would know",full:"If you listened carefully, you would know about it.",ko:"네가 주의 깊게 듣는다면 그것에 대해 알게 될 텐데.",

 h:["본책 p.158 ‘2 가정법 과거’ 표(If + 주어 + 동사의 과거형)를 펴세요.","1) 주절 would stay(원형 stay 머무르다)가 would + 동사원형이에요.  2) 그러면 if절 동사는 현재형이 아니라 과거형이에요.","have(가지다)의 과거형 한 단어예요. h로 시작해요."],
 pen:"주절 would + 동사원형 → if절 동사는 과거형 (have → had)"});
A("1-2","C",3,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>If we hadn’t come here, we <u>will regret</u> it.",ans:"would have regretted",full:"If we hadn’t come here, we would have regretted it.",ko:"우리가 여기에 오지 않았다면 우리는 그것을 후회했을 텐데.",

A("1-2","C",4,"w",{q:"밑줄 친 부분을 어법에 맞게 고쳐 쓰시오.<br>The soup <u>will taste</u> better if you added some salt.",ans:"would taste",full:"The soup would taste better if you added some salt.",ko:"소금을 좀 넣는다면 수프가 더 맛있을 텐데.",

A("1-2","D",1,"w",{q:"다음 문장을 가정법 문장으로 바꿔 쓰시오.<br>As Jeff doesn’t like Jessica, he doesn’t get along with her.<br>If Jeff ___ Jessica, he ___ along with her.",ans:"liked, would get",full:"If Jeff liked Jessica, he would get along with her.",ko:"Jeff가 Jessica를 좋아한다면 그녀와 잘 지낼 텐데.",
 h:["본책 p.158 ‘3 가정법 과거의 직설법 전환’을 펴세요.","1) 직설법 현재 부정(doesn’t like, doesn’t get along)은 가정법 과거에서 긍정이에요.  2) if절은 과거형, 주절은 would + 동사원형이에요.","첫째 칸은 like(좋아하다)의 과거형 한 단어, 둘째 칸은 would + get 두 단어예요."],
 pen:"직설법 현재 부정 → 가정법 과거 긍정 (liked / would get)"});
A("1-2","D",2,"w",{q:"다음 문장을 가정법 문장으로 바꿔 쓰시오.<br>As I didn’t speak Italian, I communicated with body gestures.<br>If I ___ Italian, I ___ with body gestures.",ans:"had spoken, wouldn’t have communicated",full:"If I had spoken Italian, I wouldn’t have communicated with body gestures.",ko:"내가 이탈리아어를 했다면 몸짓으로 의사소통하지 않았을 텐데.",
 h:["본책 p.160 ‘2 가정법 과거완료의 직설법 전환’을 펴세요.","1) 직설법 과거 부정(didn’t speak)은 가정법 과거완료에서 긍정이에요. 반대로 긍정(communicated)은 부정이에요.  2) if절은 had + p.p., 주절은 would not have + p.p.예요.","첫째 칸은 had + speak(말하다)의 p.p. 두 단어, 둘째 칸은 wouldn’t have + communicate(의사소통하다)의 p.p. 세 단어예요."],
 pen:"직설법 과거 → 가정법 과거완료, 긍정 ↔ 부정이 뒤바뀜"});
A("1-2","D",3,"w",{q:"다음 문장을 가정법 문장으로 바꿔 쓰시오.<br>As the weather isn’t warm, we can’t have lunch on the grass.<br>If the weather ___ warm, we ___ lunch on the grass.",ans:"were, could have",full:"If the weather were warm, we could have lunch on the grass.",ko:"날씨가 따뜻하다면 우리는 잔디밭에서 점심을 먹을 수 있을 텐데.",
 h:["본책 p.158 ‘3 가정법 과거의 직설법 전환’을 펴세요.","1) isn’t warm, can’t have는 현재의 부정이니 가정법 과거에서 긍정이에요.  2) if절은 were, 주절은 could + 동사원형이에요. (have는 ‘먹다’라는 뜻의 동사원형이에요.)","첫째 칸은 w로 시작하는 한 단어, 둘째 칸은 could + have 두 단어예요."],
 pen:"직설법 현재 부정 → 가정법 과거 긍정 (isn’t → were, can’t → could)"});
A("1-2","D",4,"w",{q:"다음 문장을 직설법 문장으로 바꿔 쓰시오.<br>If he had stayed home, he would have cleaned the house.<br>As he ___ home, he ___ the house.",ans:"didn’t stay, didn’t clean",full:"As he didn’t stay home, he didn’t clean the house.",ko:"그는 집에 머무르지 않았기 때문에 집을 청소하지 않았다.",
 h:["본책 p.160 ‘2 가정법 과거완료의 직설법 전환’을 펴세요.","1) 가정법 과거완료는 과거 사실의 반대예요. 그래서 직설법은 과거시제의 부정이에요.  2) had stayed(원형 stay 머무르다)와 would have cleaned(원형 clean 청소하다) 둘 다 긍정이니 부정으로 바꿔요.","두 칸 모두 두 단어로, did not의 줄임말 + 동사원형이에요."],
 pen:"가정법 과거완료 긍정 → 직설법 과거 부정"});
A("1-2","D",5,"w",{q:"다음 문장을 직설법 문장으로 바꿔 쓰시오.<br>If Aaron had drunk warm milk, he could have fallen asleep.<br>As Aaron ___ warm milk, he ___ asleep.",ans:"didn’t drink, couldn’t fall",full:"As Aaron didn’t drink warm milk, he couldn’t fall asleep.",ko:"Aaron은 따뜻한 우유를 마시지 않았기 때문에 잠들 수 없었다.",
 h:["본책 p.160 ‘2 가정법 과거완료의 직설법 전환’의 둘째 예문(If you had gone there ...)을 보세요.","1) 가정법 과거완료의 긍정은 직설법 과거의 부정이에요.  2) had drunk(원형 drink 마시다)는 didn’t + 동사원형, could have fallen(원형 fall 빠지다)은 couldn’t + 동사원형이에요.","두 칸 모두 두 단어예요. 둘 다 n’t가 들어가요."],
 pen:"could have + p.p. → couldn’t + 동사원형 (직설법 과거 부정)"});
A("1-2","D",6,"w",{q:"다음 문장을 가정법 문장으로 바꿔 쓰시오.<br>As you didn’t watch the horror movie, you didn’t have nightmares.<br>If you ___ the horror movie, you ___ nightmares.",ans:"had watched, would have had",full:"If you had watched the horror movie, you would have had nightmares.",ko:"네가 그 공포 영화를 봤다면 악몽을 꿨을 텐데.",
 h:["본책 p.160 ‘2 가정법 과거완료의 직설법 전환’을 펴세요.","1) 직설법 과거 부정(didn’t watch, didn’t have)은 가정법 과거완료에서 긍정이에요.  2) if절은 had + p.p., 주절은 would have + p.p.예요.","첫째 칸은 had + watch(보다)의 p.p. 두 단어, 둘째 칸은 would have + have(가지다)의 p.p. 세 단어예요."],
 pen:"직설법 과거 부정 → 가정법 과거완료 긍정 (had watched / would have had)"});

A("1-2","E",1,"w",{q:"( )의 단어를 바르게 배열하여 문장을 완성하시오. (have, could, made, a snowman, I)<br>If it had snowed a lot, ___.",ans:"I could have made a snowman",full:"If it had snowed a lot, I could have made a snowman.",ko:"눈이 많이 왔다면 나는 눈사람을 만들 수 있었을 텐데.",
 h:["본책 p.160 ‘가정법 과거완료’ 표의 주절(주어 + could + have + p.p.)을 보세요.","1) if절이 had snowed(원형 snow 눈이 오다)로 과거완료예요.  2) 그러니 주절은 주어 + could have + p.p. 순서로 놓아요.","모두 여섯 단어(a snowman은 두 단어)이고, 주어 I로 시작해요."],
 pen:"If + had + p.p., 주어 + could have + p.p."});
A("1-2","E",2,"w",{q:"( )의 단어를 바르게 배열하여 문장을 완성하시오. (the environment, we, help, could)<br>If we recycled these cans, ___.",ans:"we could help the environment",full:"If we recycled these cans, we could help the environment.",ko:"우리가 이 캔들을 재활용한다면 환경을 도울 수 있을 텐데.",
 h:["본책 p.158 ‘2 가정법 과거’ 표의 주절(주어 + could + 동사원형)을 보세요.","1) if절 recycled(원형 recycle 재활용하다)가 과거형이에요.  2) 그러니 주절은 주어 + could + 동사원형 + 목적어 순서로 놓아요.","모두 다섯 단어(the environment는 두 단어)이고, we로 시작해요."],
 pen:"If + 과거형, 주어 + could + 동사원형 (가정법 과거)"});
A("1-2","E",3,"w",{q:"( )의 단어를 바르게 배열하여 문장을 완성하시오. (had, if, she, home, been)<br>___, we would have had dinner together.",ans:"If she had been home",full:"If she had been home, we would have had dinner together.",ko:"그녀가 집에 있었다면 우리는 함께 저녁을 먹었을 텐데.",
 h:["본책 p.160 ‘가정법 과거완료’ 표(If + 주어 + had + p.p. ~)를 펴세요.","1) 주절 would have had(원형 have 먹다)가 would have + p.p.예요.  2) 그러니 if절은 If + 주어 + had + p.p. 순서로 놓아요. 문장 맨 앞이라 If는 대문자예요.","모두 다섯 단어이고, If로 시작해요."],
 pen:"If + 주어 + had + p.p. (가정법 과거완료의 if절)"});
A("1-2","E",4,"w",{q:"( )의 단어를 바르게 배열하여 문장을 완성하시오. (if, I, would, buy, you, I, were)<br>___, ___ the shoes.",ans:"If I were you, I would buy",full:"If I were you, I would buy the shoes.",ko:"내가 너라면 그 신발을 살 텐데.",

 pen:"If I were you, I would + 동사원형 (~라면 …할 텐데)"});
A("1-2","E",5,"w",{q:"( )의 단어를 바르게 배열하여 문장을 완성하시오. (if, he, could, had, have, spoken, you, understood)<br>___ slowly, ___ him.",ans:"If he had spoken, you could have understood",full:"If he had spoken slowly, you could have understood him.",ko:"그가 천천히 말했다면 너는 그를 이해할 수 있었을 텐데.",
 h:["본책 p.160 ‘가정법 과거완료’ 표를 펴세요.","1) 첫째 빈칸은 If + 주어 + had + p.p., 둘째 빈칸은 주어 + could have + p.p. 순서예요.  2) 뒤에 him이 있으니 둘째 빈칸 끝은 understand(이해하다)의 p.p.예요.","첫째 빈칸은 네 단어(If로 시작), 둘째 빈칸은 네 단어(you로 시작)예요."],

A(3,"A",2,"c",{q:"It seems as if Maria ( lies / lied ) to me.",opts:["lies","lied"],ans:"lied",full:"It seems as if Maria lied to me.",ko:"Maria가 나에게 거짓말을 한 것처럼 보인다.",

 h:["본책 p.162 ‘1 I wish 가정법 (1) I wish + 가정법 과거’를 펴세요.","1) I wish 뒤에는 현재 사실에 대한 아쉬움이에요.  2) 그러므로 동사는 현재형이 아니라 과거형이에요.","buy(사다)의 과거형이에요. b로 시작해요."],

A(3,"A",4,"c",{q:"Sora talks as if she ( visited / had visited ) London last year.",opts:["visited","had visited"],ans:"had visited",full:"Sora talks as if she had visited London last year.",ko:"소라는 작년에 런던을 방문했던 것처럼 말한다.",

A(3,"A",6,"c",{q:"I wish Mom ( has bought / had bought ) me the jacket.",opts:["has bought","had bought"],ans:"had bought",full:"I wish Mom had bought me the jacket.",ko:"엄마가 내게 그 재킷을 사 주셨다면 좋을 텐데.",

A(3,"A",7,"c",{q:"Mary is smiling as if she ( is not / were not ) sad.",opts:["is not","were not"],ans:"were not",full:"Mary is smiling as if she were not sad.",ko:"Mary는 마치 슬프지 않은 것처럼 미소 짓고 있다.",
 h:["본책 p.162 ‘2 as if 가정법 (1) as if + 가정법 과거’를 펴세요.","1) 실제로는 슬픈데 슬프지 않은 것처럼 웃고 있어요.  2) 실제와 다른 상황이니 as if 뒤는 가정법 과거예요.","w로 시작하는 쪽이에요."],

const KEY="clear-l2-wb-v1",PIN="7372";
const PEN='<svg class="pen" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8 19z"/><path d="M14.5 6.5l3 3"/></svg>';
function fresh(){return{it:{},last:0}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
let view="home",cur=null,curCh=0,sh=0,wrong=0,pinv="",tab="stuck";
function st(id){return S.it[id]||(S.it[id]={h:0,tries:0,ok:null,rev:0,pen:0})}
function IT(id){return ITEMS.find(x=>x.id==id)}
function R(h){document.getElementById("app").innerHTML=h;try{window.scrollTo(0,0)}catch(e){}}
function go(v){view=v;render()}
function render(){({home,chapter,item,unitend,pin,teacher})[view]()}
const doneOf=L=>L.filter(x=>st(x.id).pen).length;
const chItems=c=>ITEMS.filter(x=>x.ch==c),unItems=uk=>ITEMS.filter(x=>x.uk==uk);
const chList=()=>Object.keys(CHAPS).map(Number).sort((a,b)=>a-b);
function pad2(n){return(n<10?"0":"")+n}
function home(){
 let h='<div class="top"><div class="small">비타민 영어클리닉</div><h1>클리어 중학 영문법 L2</h1><div class="sub">워크북 도우미</div></div>';
 h+='<div class="card"><b>답 대신 힌트</b><div class="small">막히면 힌트를 1 → 2 → 3 순서로 열어요. 맞혀도 연필 한 줄은 꼭 써요.</div></div>';
 chList().forEach(c=>{const L=chItems(c),d=doneOf(L);
  h+='<button class="row" onclick="openCh('+c+')"><span><b>CHAPTER '+pad2(c)+'</b> '+CHAPS[c].name+'</span><span class="pill '+(d==L.length?"on":"")+'">'+d+' / '+L.length+'</span></button>'});
 h+='<div class="foot"><a onclick="go(\'pin\')">선생님</a></div>';R(h)}
function openCh(c){curCh=c;go("chapter")}
function chapter(){const c=curCh;
 let h='<div class="bk"><a onclick="go(\'home\')">목록</a><span class="small">CHAPTER '+pad2(c)+'</span></div><h2>'+CHAPS[c].name+'</h2>';
 CHAPS[c].units.forEach(k=>{const uk=c+"-"+k,L=unItems(uk),U=UN[uk];if(!L.length)return;const d=doneOf(L);
  h+='<button class="row" onclick="start(\''+uk+'\')"><span><b>'+U.n+'</b> '+U.t+'<span class="small"> · '+(U.cp?"개념 "+U.cp+" · ":"")+"문제 "+U.pp+'</span></span><span class="pill '+(d==L.length?"on":"")+'">'+d+' / '+L.length+'</span></button>'});
 R(h)}
function start(uk){const L=unItems(uk),n=L.find(x=>!st(x.id).pen)||L[0];open_(n.id)}
function open_(id){cur=id;sh=st(id).h||0;wrong=0;go("item")}
function dq(it){if(it.kind!="c")return it.q;const i=it.q.indexOf("①");if(i<0)return it.q;
 const n=t=>t.replace(/<[^>]+>/g,"").replace(/&nbsp;/g,"").replace(/[①-⑦\s]/g,"");
 if(n(it.q.slice(i))!=n(it.opts.join("")))return it.q;
 return it.q.slice(0,i).replace(/(<br>|&nbsp;|\s)+$/,"")}
function item(){
 const it=IT(cur),s=st(cur),U=UN[it.uk],L=unItems(it.uk);
 let h='<div class="bk"><a onclick="openCh('+it.ch+')">목록</a><span class="small">CH'+pad2(it.ch)+' · '+U.n+' · '+SECLAB(it)+'</span></div>';
 h+='<div class="q">'+dq(it).replace(/___/g,'<span class="blank"></span>')+'</div>';
 if(it.bank)h+='<div class="small">보기 : '+it.bank.join(" · ")+' (한 번씩만)</div>';
 if(it.kind=="w"&&!s.rev)h+='<div class="small">워크북에 직접 써요.</div>';
 h+='<div class="hint">';
 for(let i=0;i<3;i++){h+=i<sh?'<div class="hp"><b>힌트 '+(i+1)+'</b> '+it.h[i]+'</div>':(i==sh?'<button class="btn ghost" onclick="openHint()">힌트 '+(i+1)+' 열기 : '+["본책 어디?","생각 순서","거의 답"][i]+'</button>':'')}
 h+='</div>';
 if(!s.rev){
  if(it.kind=="c")h+='<div class="opts">'+it.opts.map((o,i)=>'<button class="opt" onclick="pick('+i+')">'+o+'</button>').join("")+'</div>'+(wrong?'<div class="note">다시 한 번 골라 봐요. 힌트를 열어서 따라가 보세요.</div>':'');
  else h+='<button class="btn" onclick="wrote()">다 썼어요 · 답 보기</button>';
 }else{
  h+='<div class="ans"><div class="small">정답</div><b>'+it.full+'</b><div class="small">'+it.ko+'</div></div>';
  if(it.kind=="w"&&s.self==null)h+='<div class="note">내가 쓴 답과 비교해 보세요.</div><div class="two"><button class="btn" onclick="selfck(1)">똑같이 썼어요</button><button class="btn ghost" onclick="selfck(0)">고쳐 썼어요</button></div>';
  else{
   h+='<div class="post"><div class="pt">'+PEN+' 책에 쓰기 · 워크북 '+U.pp+' 이 문제 옆 여백에 이 한 줄만</div><div class="pl">'+it.pen+'</div><div class="pt2">맞혔어도 이 한 줄은 꼭 써요.</div></div>';
   if(!s.pen)h+='<button class="btn pencil" onclick="penDone()">'+PEN+' 다 썼어요</button>';
   else{const last=L[L.length-1].id==cur;h+='<div class="small ok">연필 한 줄 완료</div><button class="btn" onclick="nextItem()">'+(last?"이 파트 마무리":"다음 문제")+'</button>'}
  }
 }
 R(h)}
function openHint(){sh++;st(cur).h=Math.max(st(cur).h,sh);save();render()}
function pick(i){const it=IT(cur),s=st(cur);s.tries++;
 if(it.opts[i]==it.ans){s.rev=1;s.ok=s.tries==1?1:0}
 else{wrong++;if(wrong>=2){s.rev=1;s.ok=0}}save();render()}
function wrote(){st(cur).rev=1;save();render()}
function selfck(v){const s=st(cur);s.self=v;s.ok=v;save();render()}
function penDone(){st(cur).pen=1;save();render()}
function nextItem(){const it=IT(cur),L=unItems(it.uk),i=L.findIndex(x=>x.id==cur);
 if(i==L.length-1){go("unitend");return}open_(L[i+1].id)}
function unitend(){const it=IT(cur),L=unItems(it.uk),U=UN[it.uk];
 const ok=L.filter(x=>st(x.id).ok).length,hs=L.reduce((a,x)=>a+st(x.id).h,0);
 R('<div class="bk"><a onclick="openCh('+it.ch+')">목록</a></div><h2>'+U.n+' 끝</h2><div class="small">처음에 바로 맞힌 문제 '+ok+' / '+L.length+' · 힌트 사용 '+hs+'회</div><div class="post"><div class="pt">'+PEN+' 오늘 쓴 줄 모아 보기</div>'+L.map(x=>'<div class="pl"><span class="small">'+SECSHORT(x)+'</span> '+x.pen+'</div>').join("")+'</div><button class="btn" onclick="openCh('+it.ch+')">목록으로</button>')}
function pin(){pinv="";pinui()}
function pinui(){R('<div class="bk"><a onclick="go(\'home\')">목록</a></div><h2>선생님 확인</h2><div class="dots">'+[0,1,2,3].map(i=>'<i class="'+(i<pinv.length?"f":"")+'"></i>').join("")+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9,"",0,"←"].map(k=>k===""?'<span></span>':'<button onclick="pk(\''+k+'\')">'+k+'</button>').join("")+'</div>')}
function pk(k){if(k=="←")pinv=pinv.slice(0,-1);else if(pinv.length<4)pinv+=k;if(pinv.length==4){if(pinv==PIN){tab="stuck";go("teacher");return}pinv=""}pinui()}
function teacher(){
 let h='<div class="bk"><a onclick="go(\'home\')">나가기</a><span class="small">선생님 화면</span></div><div class="tabs">'+[["stuck","막힌 문제"],["ctl","관리"]].map(([k,n])=>'<button class="'+(tab==k?"on":"")+'" onclick="tab=\''+k+'\';render()">'+n+'</button>').join("")+'</div>';
 if(tab=="stuck"){
  const pen=ITEMS.filter(x=>st(x.id).pen).length;
  h+='<div class="small">이 기기에서 푼 기록입니다. 실시간 연결은 EM보드에 넣을 때 붙입니다.</div><div class="card"><b>연필 한 줄 완료</b> '+pen+' / '+ITEMS.length+'</div>';
  chList().forEach(c=>{const L=chItems(c);h+='<div class="small">CHAPTER '+pad2(c)+' '+CHAPS[c].name+' : '+doneOf(L)+' / '+L.length+'</div>'});
  const S2=ITEMS.filter(x=>st(x.id).h>=2||st(x.id).ok===0);
  h+='<div class="small" style="margin-top:10px">막힌 문제 (힌트 2단계 이상 또는 바로 못 맞힘)</div>';
  if(!S2.length)h+='<div class="card small">아직 없어요.</div>';
  S2.forEach(x=>{const s=st(x.id);h+='<div class="card"><b>CH'+pad2(x.ch)+' · '+UN[x.uk].n+' · '+SECLAB(x)+'</b><div class="small">힌트 '+s.h+'단계 · 시도 '+s.tries+'회</div><div class="small">'+x.pen+'</div></div>'});
  h+='<div class="small">힌트를 3단계까지 써도 못 맞히면 개념을 오프라인으로 설명하고, 힌트 없이 바로 맞히면 다음 난이도로 넘겨요.</div>';
 }else h+='<div class="card"><b>초기화</b><div class="small">이 기기의 기록을 지웁니다.</div><button class="btn ghost" onclick="S=fresh();save();go(\'home\')">지우기</button></div>';
 R(h)}
render();
</script></body></html>
