<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#2563eb">
<meta name="application-name" content="등급계산기">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="등급계산기">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<title>고교 등급 계산기 (5등급제)</title>
<style>
  :root{--ink:#1f2937;--sub:#6b7280;--line:#e5e7eb;--bg:#f8fafc;--card:#fff;--accent:#2563eb;--soft:#eff6ff;--me:#ef4444}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;line-height:1.45;font-size:14px}
  .wrap{max-width:560px;margin:0 auto;padding:12px 10px 32px}
  h1{font-size:18px;margin:2px 0 2px}
  .lead{color:var(--sub);font-size:12.5px;margin:0 0 10px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:10px}
  .seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;margin-bottom:10px}
  .seg button{border:0;background:#fff;padding:7px 12px;font:inherit;font-size:13px;cursor:pointer;color:var(--sub)}
  .seg button.on{background:var(--accent);color:#fff}
  label{display:block;font-size:12.5px;color:var(--sub);margin-bottom:4px}
  .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .row{display:flex;gap:6px;align-items:center}
  input[type=number]{flex:1;min-width:0;width:100%;font:inherit;font-size:18px;padding:7px 9px;border:1.5px solid var(--line);border-radius:9px;outline:none}
  input[type=number]:focus{border-color:var(--accent)}
  .unit{font-size:13px;color:var(--sub)}
  .note{font-size:12px;color:var(--sub);margin:6px 0 0}
  .err{color:#b91c1c}
  .me-top{font-size:17px;font-weight:700}
  .me-top b{color:var(--me)}
  .meta{font-size:12.5px;color:var(--sub)}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
  .stat{border:1px solid var(--line);border-radius:10px;padding:7px 10px}
  .stat .t{font-size:11.5px;color:var(--sub)}
  .stat .v{font-size:18px;font-weight:700}
  /* 전체 막대 + 빨간 점 */
  .tl{position:relative;margin:26px 4px 4px}
  .tl .bars{display:flex;height:16px;border-radius:8px;overflow:hidden;gap:2px}
  .tl .bars i{display:block;height:100%;background:#dbeafe}
  .tl .bars i.on{background:var(--accent)}
  .tl .dot{position:absolute;top:-1px;width:18px;height:18px;margin-left:-9px;border-radius:50%;background:var(--me);border:3px solid #fff;box-shadow:0 0 0 1px var(--me)}
  .tl .tag{position:absolute;top:-24px;transform:translateX(-50%);font-size:11.5px;font-weight:700;color:#fff;background:var(--me);padding:1px 6px;border-radius:6px;white-space:nowrap}
  .tl .lbl{display:flex;gap:2px;margin-top:4px}
  .tl .lbl span{text-align:center;font-size:11px;color:var(--sub)}
  /* 등급 안 점 */
  .dots{display:flex;flex-wrap:wrap;gap:3px;margin:10px 0 4px}
  .dots i{width:9px;height:9px;border-radius:50%;background:#94a3b8}
  .dots i.back{background:#dbe4ee}
  .dots i.me{width:13px;height:13px;background:var(--me);box-shadow:0 0 0 2px #fecaca;margin:-2px 2px}
  .legend{font-size:11.5px;color:var(--sub);display:flex;gap:12px;flex-wrap:wrap}
  .legend span::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:4px;background:#94a3b8}
  .legend .m::before{background:var(--me)}
  .legend .b::before{background:#dbe4ee}
  /* 등급 목록 */
  .g{display:grid;grid-template-columns:50px 1fr;gap:10px;align-items:center;padding:8px 6px;border-bottom:1px solid var(--line)}
  .g:last-child{border-bottom:0}
  .badge{background:var(--soft);color:var(--accent);font-weight:700;font-size:14px;text-align:center;border-radius:8px;padding:7px 0}
  .range{font-size:16px;font-weight:700}
  .range small{font-size:12px;font-weight:400;color:var(--sub);margin-left:6px}
  .g .meta{font-size:11.5px}
  .g.hit{background:#fef2f2;border-radius:10px;border-bottom-color:transparent}
  .g.hit .badge{background:var(--me);color:#fff}
  .empty{color:#9ca3af;font-weight:400}
  details summary{font-size:12.5px;color:var(--sub);cursor:pointer}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  th,td{padding:6px 4px;border-bottom:1px solid var(--line);text-align:center}
  th{color:var(--sub);font-weight:600}
</style>
</head>
<body>
<div class="wrap">
  <h1>고교 등급 계산기</h1>
  <p class="lead">전체 학생 수와 내 등수를 넣어 보세요.</p>

  <div class="seg" id="seg">
    <button data-m="5" class="on">5등급제</button>
    <button data-m="9">9등급제 (참고)</button>
  </div>

  <div class="card">
    <div class="two">
      <div><label for="n">전체 학생 수</label>
        <div class="row"><input id="n" type="number" min="1" max="2000" inputmode="numeric" placeholder="258"><span class="unit">명</span></div></div>
      <div><label for="r">내 등수</label>
        <div class="row"><input id="r" type="number" min="1" inputmode="numeric" placeholder="32"><span class="unit">등</span></div></div>
    </div>
    <div id="rerr" class="note err"></div>
  </div>

  <div class="card" id="me" style="display:none"></div>

  <div class="card" id="out" style="display:none">
    <div id="grades"></div>
    <p class="note">누적 인원 = 전체 × 누적 비율(소수점 첫째 자리 반올림). 경계 동석차는 같은 등급.</p>
  </div>

  <div class="card">
    <details>
      <summary>등급 비율표 보기</summary>
      <table>
        <thead><tr><th>등급</th><th>5등급제</th><th>5등급제 누적</th><th>9등급제 누적</th></tr></thead>
        <tbody>
          <tr><td>1</td><td>10%</td><td>10%</td><td>4%</td></tr>
          <tr><td>2</td><td>24%</td><td>34%</td><td>11%</td></tr>
          <tr><td>3</td><td>32%</td><td>66%</td><td>23%</td></tr>
          <tr><td>4</td><td>24%</td><td>90%</td><td>40%</td></tr>
          <tr><td>5</td><td>10%</td><td>100%</td><td>60%</td></tr>
        </tbody>
      </table>
      <p class="note">9등급제 6~9등급 누적: 77% · 89% · 96% · 100%</p>
    </details>
  </div>
</div>

<script>
const SCHEMES = {
  5: [10,34,66,90,100],
  9: [4,11,23,40,60,77,89,96,100]
};
let mode = 5;
const $ = id => document.getElementById(id);

function compute(n){
  const cum = SCHEMES[mode];
  let prev = 0;
  return cum.map((c,i)=>{
    const end = Math.round(n*c/100);
    const row = {grade:i+1, cumPct:c, start:prev+1, end:end, count:Math.max(0,end-prev)};
    prev = Math.max(prev,end);
    return row;
  });
}

function render(){
  const n = parseInt($('n').value,10);
  const ok = Number.isFinite(n) && n>=1;
  $('out').style.display = ok ? '' : 'none';
  $('me').style.display = 'none';
  $('rerr').textContent = '';
  if(!ok) return;
  const rows = compute(n);
  const r = parseInt($('r').value,10);
  let hit = null;
  if(Number.isFinite(r)){
    if(r<1||r>n) $('rerr').textContent = '등수는 1 ~ '+n+' 사이로 입력하세요.';
    else hit = rows.find(x=>x.count>0 && r>=x.start && r<=x.end);
  }
  $('grades').innerHTML = rows.map(x=>{
    const range = x.count>0
      ? `${x.start===x.end ? x.start+'등' : x.start+'등 ~ '+x.end+'등'}<small>${x.count}명</small>`
      : `<span class="empty">해당 없음</span>`;
    return `<div class="g${hit&&hit.grade===x.grade?' hit':''}">
      <div class="badge">${x.grade}등급</div>
      <div><div class="range">${range}</div>
      <div class="meta">누적 상위 ${x.cumPct}% (${x.end}명까지)</div></div></div>`;
  }).join('');
  if(!hit) return;

  const front = r - hit.start, back = hit.end - r;
  const pos = ((r-0.5)/n*100).toFixed(2);

  // 전체 막대: 등급별 구간 + 빨간 점
  const bars = rows.map(x=>`<i class="${x.grade===hit.grade?'on':''}" style="flex:${Math.max(x.count,0.0001)}"></i>`).join('');
  const lbls = rows.map(x=>`<span style="flex:${Math.max(x.count,0.0001)}">${x.count>0?x.grade:''}</span>`).join('');
  const tl = `<div class="tl"><div class="tag" style="left:clamp(22px,${pos}%,calc(100% - 22px))">${r}등</div>
    <div class="bars">${bars}</div><div class="dot" style="left:${pos}%"></div>
    <div class="lbl">${lbls}</div></div>`;

  // 같은 등급 안 점
  let inner;
  if(hit.count<=100){
    inner = '<div class="dots">'+'<i></i>'.repeat(front)+'<i class="me"></i>'+'<i class="back"></i>'.repeat(back)+'</div>'
      +'<div class="legend"><span>나보다 앞</span><span class="m">나</span><span class="b">나보다 뒤</span></div>';
  } else inner = '';

  const prev = rows.slice(0,hit.grade-1).reverse().find(x=>x.count>0);
  const nxt = rows.slice(hit.grade).find(x=>x.count>0);
  const up = prev ? `${prev.grade}등급까지 <b>${front+1}명</b> 앞지르기` : '1등급';
  const down = nxt ? `뒤 <b>${back+1}명</b>이 앞지르면 ${nxt.grade}등급` : '마지막 등급';

  $('me').style.display = '';
  $('me').innerHTML = `
    <div class="me-top">${n}명 중 <b>${r}등</b> &rarr; <b>${hit.grade}등급</b></div>
    <div class="meta">${hit.grade}등급: ${hit.start}등 ~ ${hit.end}등 (${hit.count}명)</div>
    ${tl}
    <div class="stats">
      <div class="stat"><div class="t">같은 등급, 나보다 앞</div><div class="v">${front}명</div></div>
      <div class="stat"><div class="t">같은 등급, 나보다 뒤</div><div class="v">${back}명</div></div>
    </div>
    ${inner}
    <div class="note">${up} · ${down}</div>`;
}

$('n').addEventListener('input',render);
$('r').addEventListener('input',render);
$('seg').addEventListener('click',e=>{
  const b = e.target.closest('button'); if(!b) return;
  mode = +b.dataset.m;
  [...$('seg').children].forEach(x=>x.classList.toggle('on',x===b));
  render();
});
</script>
</body>
</html>
