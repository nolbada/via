ple straws.","하지만 그것들은 사과 빨대를 만들기 위해 재활용될 수 있다."]],"w":"10번에서 주스를 만들 때 a lot of peels(많은 껍질)가 버려진다고 하고, 11번에서 they can be recycled to make apple straws라고 해요. straws는 11번의 결과물이라 버려지는 것이 아니고, bamboo는 대나무 이야기라 맞지 않아요.","c":null},"h":"30778ccd26"}]},{"u":7,"id":"hk1-07-4","no":4,"ko":"선물을 뿌직!","items":[{"n":1,"t":"tf","q":"Caga Tió is a small log with a smiling face.","ko":"Caga Tió는 웃고 있는 얼굴을 한 작은 통나무이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It is a small log with a smiling face.","그것은 웃고 있는 얼굴을 한 작은 통나무다."]],"w":"4번 문장 It is a small log with a smiling face 그대로예요.","c":"T"},"h":"7a1a471d90"},{"n":2,"t":"tf","q":"Children get their own Caga Tió on Christmas Day.","ko":"아이들은 크리스마스 날에 자기만의 Caga Tió를 받는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"On December 8, children get their own Caga Tió.","12월 8일에, 아이들은 그들만의 Caga Tió를 받는다."]],"w":"5번 문장에서 아이들은 12월 8일에 Caga Tió를 받아요. 크리스마스 날(Christmas Day)에는 8번에서 두드리고 노래를 불러요.","c":"F"},"h":"c260b86f90"},{"n":3,"t":"tf","q":"Children remove the blanket after they finish singing the song.","ko":"아이들은 노래 부르는 것을 마친 후 담요를 치운다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"When they finish singing the song, they remove the blanket from the log.","그들은 노래 부르는 것을 마치면, 통나무에서 담요를 치운다."]],"w":"9번 문장에서 노래 부르는 것을 마치면 통나무에서 담요를 치운다고 해요.","c":"T"},"h":"5ee04dc3bf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In Spain, children receive Christmas gifts from something special.)","ko":"스페인에서는, 아이들이 무언가 특별한 것으로부터 크리스마스 선물을 받는다.","opts":["준다","빌린다","받는다","만든다"],"word":"receive","r":{"a":"3) 받는다","ev":"1~2번 문장","s":[[1,"In Spain, children receive Christmas gifts from something special.","스페인에서는, 아이들이 무언가 특별한 것으로부터 크리스마스 선물을 받는다."],[2,"Its name is Caga Tió.","그것의 이름은 Caga Tió이다."]],"w":"1번에서 아이들이 선물을 어떻게 하는지를 말해요. 2번에서 선물을 주는 존재가 Caga Tió이니 아이들은 선물을 받아요. receive = 받다예요.","c":3},"h":"a457ccadb8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fortunately, they don’t smell bad!)","ko":"다행스럽게도, 그것은 고약한 냄새가 나지 않는다!","opts":["불행하게도","갑자기","천천히","다행스럽게도"],"word":"Fortunately","r":{"a":"4) 다행스럽게도","ev":"10~11번 문장","s":[[10,"There, they will find the gifts that are pooped out by the well-fed Caga Tió.","거기에서, 그들은 잘 먹은 Caga Tió로부터 배설된 선물을 발견할 것이다."],[11,"Fortunately, they don’t smell bad!","다행스럽게도, 그것은 고약한 냄새가 나지 않는다!"]],"w":"10번에서 선물이 응가처럼 나온다고 해서 냄새가 날 것 같지만, 11번에서는 냄새가 나지 않는다고 해요. 좋은 소식이므로 fortunately = 다행스럽게도예요.","c":4},"h":"6d87ebf205"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThey believe if they take good care of it until Christmas Eve, it will give them presents!","ko":"그들은 크리스마스 전날까지 Caga Tió를 잘 돌본다면, 그것이 선물을 줄 것이라고 믿는다!","opts":["아이들","Caga Tió","담요","크리스마스 전날"],"sko":"그들은 크리스마스 전날까지 Caga Tió를 잘 돌본다면, 그것이 선물을 줄 것이라고 믿는다!","r":{"a":"2) Caga Tió","ev":"4~6번 문장","s":[[4,"It is a small log with a smiling face.","그것은 웃고 있는 얼굴을 한 작은 통나무다."],[5,"On December 8, children get their own Caga Tió.","12월 8일에, 아이들은 그들만의 Caga Tió를 받는다."],[6,"They believe if they take good care of it until Christmas Eve, it will give them presents!","그들은 크리스마스 전날까지 Caga Tió를 잘 돌본다면, 그것이 선물을 줄 것이라고 믿는다!"]],"w":"선물을 주는 것은 5번에서 아이들이 받은 Caga Tió예요. 돌봄을 받는 것도 같은 Caga Tió예요.","c":2},"h":"8de0cd049f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Then, on Christmas Day, children tap their Caga Tió with a stick and sing a song to ask it for presents.\"","ko":"그 후, 크리스마스 날에, 아이들은 그들의 Caga Tió를 막대기로 두드리고 그것에게 선물을 요청하기 위해 노래를 부른다.","opts":["크리스마스 날에 아이들은 선물을 달라고 막대기로 통나무를 두드리며 노래한다.","크리스마스 날에 아이들은 통나무에게 선물을 주려고 노래한다.","크리스마스 날에 아이들은 막대기로 통나무를 쪼개어 불을 피운다.","크리스마스 날에 아이들은 통나무를 막대기로 밀며 놀러 간다."],"sko":"그 후, 크리스마스 날에, 아이들은 그들의 Caga Tió를 막대기로 두드리고 그것에게 선물을 요청하기 위해 노래를 부른다.","r":{"a":"1) 크리스마스 날에 아이들은 선물을 달라고 막대기로 통나무를 두드리며 노래한다.","ev":"8번 문장","s":[[8,"Then, on Christmas Day, children tap their Caga Tió with a stick and sing a song to ask it for presents.","그 후, 크리스마스 날에, 아이들은 그들의 Caga Tió를 막대기로 두드리고 그것에게 선물을 요청하기 위해 노래를 부른다."]],"w":"tap은 톡톡 두드리다이고 ask it for presents는 그것에게 선물을 요청하다예요. 아이들이 선물을 주는 것이 아니라 요청하는 거예요.","c":1},"h":"2d3a051881"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Caga Tió is a big log with a sad face.","Children put a blanket on the log to keep it cold.","Caga Tió means “poo log” in Spanish.","The gifts from Caga Tió smell bad."],"oko":["Caga Tió는 슬픈 얼굴을 한 큰 통나무이다.","아이들은 통나무를 차갑게 유지하려고 담요를 덮는다.","Caga Tió는 스페인어로 ‘응가 통나무’를 의미한다.","Caga Tió의 선물은 고약한 냄새가 난다."],"r":{"a":"3) Caga Tió means “poo log” in Spanish.","ev":"3, 7, 11번 문장","s":[[3,"Caga Tió means “poo log” in Spanish.","Caga Tió는 스페인어로 ‘응가 통나무’를 의미한다."],[7,"So, they offer their log food and put a blanket over it to keep it warm.","그래서, 그들은 통나무에게 음식을 제공하고 따뜻하게 해주기 위해 그 위에 담요를 덮어준다."],[11,"Fortunately, they don’t smell bad!","다행스럽게도, 그것은 고약한 냄새가 나지 않는다!"]],"w":"3번에서 Caga Tió는 스페인어로 응가 통나무라고 해요. 생김새는 웃는 작은 통나무(4번), 담요는 따뜻하게 하려는 것(7번), 선물은 냄새가 나지 않아요(11번).","c":3},"h":"f271d171ee"},{"n":9,"t":"sum","q":"Children in Spain (A) Christmas gifts from a log called Caga Tió. On Christmas Day, they (B) it with a stick and sing a song.","ko":"스페인의 아이들은 Caga Tió라는 통나무에게서 크리스마스 선물을 (A). 크리스마스 날에 막대기로 그것을 (B) 노래를 부른다.","opts":["(A) send / (B) tap","(A) buy / (B) feed","(A) hide / (B) sing","(A) receive / (B) remove","(A) receive / (B) tap"],"oko":["(A) 보낸다 / (B) 두드리고","(A) 산다 / (B) 먹이고","(A) 숨긴다 / (B) 노래하고","(A) 받는다 / (B) 치우고","(A) 받는다 / (B) 두드리고"],"r":{"a":"5) (A) receive / (B) tap","ev":"1, 8번 문장","s":[[1,"In Spain, children receive Christmas gifts from something special.","스페인에서는, 아이들이 무언가 특별한 것으로부터 크리스마스 선물을 받는다."],[8,"Then, on Christmas Day, children tap their Caga Tió with a stick and sing a song to ask it for presents.","그 후, 크리스마스 날에, 아이들은 그들의 Caga Tió를 막대기로 두드리고 그것에게 선물을 요청하기 위해 노래를 부른다."]],"w":"1번에서 아이들은 선물을 receive(받는다)하고, 8번에서 막대기로 Caga Tió를 tap(두드린다)해요. send, buy는 선물을 받는 쪽이 아니고, feed는 크리스마스 전날까지 하는 일이에요.","c":5},"h":"2bcd1d970e"},{"n":10,"t":"fill","q":"Children offer their log food and put a [A] over it to keep it [B].","ko":"아이들은 통나무에게 음식을 제공하고 그것을 [B] 유지하기 위해 그 위에 [A]을 덮어 준다.","bank":["blanket","warm","stick","cold","song","presents"],"bko":{"blanket":"담요","warm":"따뜻한","stick":"막대기","cold":"차가운","song":"노래","presents":"선물"},"r":{"a":"[A] blanket, [B] warm","ev":"7번 문장","s":[[7,"So, they offer their log food and put a blanket over it to keep it warm.","그래서, 그들은 통나무에게 음식을 제공하고 따뜻하게 해주기 위해 그 위에 담요를 덮어준다."]],"w":"7번에서 put a blanket over it to keep it warm이라고 해요. 담요를 덮는 목적은 따뜻하게 하는 것이에요. stick은 8번에서 두드릴 때 쓰고, cold는 목적과 반대예요.","c":null},"h":"0bdbf600e9"}]},{"u":8,"id":"hk1-08-1","no":1,"ko":"나도 철 들었어~","items":[{"n":1,"t":"tf","q":"Many kinds of cereal contain iron powder.","ko":"많은 종류의 시리얼은 철가루를 함유하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In fact, many kinds of cereal contain iron powder, even yours.","사실, 많은 종류의 시리얼이, 심지어 당신의 것도 철가루를 함유하고 있다."]],"w":"3번 문장에 many kinds of cereal contain iron powder가 그대로 나와요. 심지어 당신이 먹는 시리얼도 그렇다고 해요.","c":"T"},"h":"0f47737ff0"},{"n":2,"t":"tf","q":"The iron in cereal is dangerous to eat.","ko":"시리얼 속 철은 먹기에 위험하다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The iron in cereal is clean and safe to eat.","시리얼에 있는 철은 깨끗하고 먹기에 안전하다."]],"w":"11번 문장에서 시리얼 속 철은 깨끗하고 먹기에 안전하다(clean and safe to eat)고 해요. 위험하다는 말은 반대예요.","c":"F"},"h":"9f347cef87"},{"n":3,"t":"tf","q":"You should fill the plastic bottle completely with water.","ko":"플라스틱병을 물로 가득 채워야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Put them inside a plastic bottle and fill it halfway with water.","그것들을 플라스틱병 안에 넣고 병을 물로 반 정도 채워라."]],"w":"6번 문장은 병을 물로 반 정도(halfway) 채우라고 해요. 가득 채우는 것이 아니에요.","c":"F"},"h":"b4bad6999e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (First, crush up some cereal into small pieces.)","ko":"먼저, 약간의 시리얼을 작은 조각들로 부숴라. (crush는 부수다)","word":"crush","opts":["씻다","부수다","굽다","섞다"],"r":{"a":"2) 부수다","ev":"5번 문장","s":[[5,"First, crush up some cereal into small pieces.","먼저, 약간의 시리얼을 작은 조각들로 부숴라."]],"w":"시리얼을 작은 조각들(small pieces)로 만드는 행동이에요. crush up은 '부수다'예요.","c":2},"h":"5c0ea1a4be"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You can feel weak or dizzy without enough of it.)","ko":"그것이 충분하지 않으면 당신은 힘이 없거나 어지럽다고 느낄 수 있다.","word":"dizzy","opts":["졸린","화난","어지러운","배고픈"],"r":{"a":"3) 어지러운","ev":"13번 문장","s":[[13,"You can feel weak or dizzy without enough of it.","그것이 충분하지 않으면 당신은 힘이 없거나 어지럽다고 느낄 수 있다."]],"w":"철이 부족할 때 힘이 없는(weak) 것과 함께 느끼는 상태예요. dizzy는 '어지러운'이에요. 졸리거나 배고프다는 말은 본문에 없어요.","c":3},"h":"00f3bb5558"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHold it close to the cereal pieces that are inside the bottle.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것을 병 안에 들어 있는 시리얼 조각들에 가까이 들어라.","opts":["물","시리얼 조각","병","자석"],"r":{"a":"4) 자석","ev":"7~8번 문장","s":[[7,"Next, get a magnet.","그 다음, 자석을 가져와라."],[8,"Hold it close to the cereal pieces that are inside the bottle.","그것을 병 안에 들어 있는 시리얼 조각들에 가까이 들어라."]],"w":"7번에서 Next, get a magnet(자석을 가져와라)이라고 했고, 8번에서 그 자석을 병 안의 시리얼 조각들 가까이에 들라고 해요. 병이나 시리얼 조각은 자석이 가까이 가는 대상이에요.","c":4},"h":"1a484fbef7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, you may worry about eating iron, but you don’t have to.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이제, 당신은 철을 섭취하는 것에 대해 걱정할지도 모르겠지만, 그럴 필요가 없다.","opts":["철을 먹는 것을 걱정할지 모르지만, 걱정할 필요는 없다.","철을 먹는 것에 대해 반드시 걱정해야 한다.","철을 먹지 않아도 되니 시리얼도 먹지 마라.","철을 먹는 것을 걱정하는 사람은 아무도 없다."],"r":{"a":"1) 철을 먹는 것을 걱정할지 모르지만, 걱정할 필요는 없다.","ev":"10번 문장","s":[[10,"Now, you may worry about eating iron, but you don’t have to.","이제, 당신은 철을 섭취하는 것에 대해 걱정할지도 모르겠지만, 그럴 필요가 없다."]],"w":"you may worry는 '걱정할지도 모른다', don’t have to는 '~할 필요가 없다'예요. 뒤에 worry about eating iron이 생략돼 있어요. 걱정은 해도 되지만 그럴 필요가 없다는 뜻이에요.","c":1},"h":"05a0470760"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["시리얼 속 철은 더러우니 먹으면 안 된다.","철은 몸을 힘없고 어지럽게 만든다.","시리얼 속 철은 몸이 에너지를 만드는 것을 돕는다.","아침 식사용 시리얼에는 철이 전혀 들어 있지 않다."],"opts":["The iron in cereal is dirty, so you should not eat it.","Iron makes your body feel weak or dizzy.","Iron in cereal helps your body make energy.","Cereal for breakfast never contains iron."],"r":{"a":"3) Iron in cereal helps your body make energy.","ev":"11~12번 문장","s":[[11,"The iron in cereal is clean and safe to eat.","시리얼에 있는 철은 깨끗하고 먹기에 안전하다."],[12,"It’s actually necessary for your body because it helps produce energy.","그것은 에너지를 만들어 내는 것을 돕기 때문에 사실 당신의 몸에 필요하다."]],"w":"12번에서 철은 에너지를 만들어 내는 것을 돕기 때문에 몸에 필요하다고 해요. 철이 더럽다는 말은 없고(11번은 깨끗하고 안전), 힘이 없거나 어지러운 것은 철이 부족할 때예요(13번). 시리얼에는 철가루가 들어 있어요(3번).","c":3},"h":"2d0e8b9d20"},{"n":9,"t":"sum","q":"You can check the iron in cereal with a simple test. When you move a (A) slowly near the cereal pieces, small (B) pieces follow it.","ko":"시리얼 속 철은 간단한 실험으로 확인할 수 있다. 시리얼 조각 가까이에서 (A)를 천천히 움직이면 작은 (B) 조각들이 따라온다.","oko":["(A) 병 / (B) 플라스틱","(A) 물 / (B) 가루","(A) 시리얼 / (B) 플라스틱","(A) 병 / (B) 철","(A) 자석 / (B) 철"],"opts":["(A) bottle / (B) plastic","(A) water / (B) powder","(A) cereal / (B) plastic","(A) bottle / (B) iron","(A) magnet / (B) iron"],"r":{"a":"5) (A) magnet / (B) iron","ev":"4번, 8~9번 문장","s":[[4,"You can check this with a simple test.","당신은 간단한 실험으로 이것을 확인할 수 있다."],[8,"Hold it close to the cereal pieces that are inside the bottle.","그것을 병 안에 들어 있는 시리얼 조각들에 가까이 들어라."],[9,"When you move the magnet slowly, you will see small iron pieces from the cereal follow it!","당신이 자석을 천천히 움직이면, 시리얼에서 나온 작은 철 조각들이 그것을 따라다니는 것을 볼 것이다!"]],"w":"4번에서 간단한 실험으로 확인할 수 있다고 하고, 8~9번에서 자석(magnet)을 천천히 움직이면 시리얼에서 나온 작은 철(iron) 조각들이 따라온다고 해요. 병이나 플라스틱이 따라오는 것이 아니에요.","c":5},"h":"f036462a03"},{"n":10,"t":"fill","q":"Our body needs iron to make [A], and without enough iron we can feel [B] or dizzy.","ko":"우리 몸은 [A]를 만들기 위해 철이 필요하고, 철이 충분하지 않으면 [B]하거나 어지럽다고 느낄 수 있다.","bank":["energy","weak","powder","magnet","bottle","safe"],"bko":{"energy":"에너지","weak":"힘이 없는","powder":"가루","magnet":"자석","bottle":"병","safe":"안전한"},"r":{"a":"[A] energy, [B] weak","ev":"12~13번 문장","s":[[12,"It’s actually necessary for your body because it helps produce energy.","그것은 에너지를 만들어 내는 것을 돕기 때문에 사실 당신의 몸에 필요하다."],[13,"You can feel weak or dizzy without enough of it.","그것이 충분하지 않으면 당신은 힘이 없거나 어지럽다고 느낄 수 있다."]],"w":"12번에서 철은 에너지를 만들어 내는 것을 도와서 몸에 필요해요. 13번에서 철이 충분하지 않으면 힘이 없거나(weak) 어지럽다(dizzy)고 해요. powder, magnet, bottle은 실험 이야기이고, safe는 11번에서 철이 안전하다는 말이라 이 문장에는 맞지 않아요.","c":null},"h":"30d638310d"}]},{"u":8,"id":"hk1-08-2","no":2,"ko":"개미 vs 사람 vs 코끼리","items":[{"n":1,"t":"tf","q":"The ant wins when an elephant and an ant fight.","ko":"코끼리와 개미가 싸우면 개미가 이긴다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"However, when an elephant and an ant fight, the ant wins!","하지만, 코끼리와 개미가 싸우면, 개미가 이긴다!"]],"w":"11번 문장에 when an elephant and an ant fight, the ant wins!가 그대로 나와요.","c":"T"},"h":"293f04f0a5"},{"n":2,"t":"tf","q":"You show “ant” by sticking out your thumb.","ko":"엄지를 내밀어서 ‘개미’를 나타낸다.","r":{"a":"F (본문과 다른 내용)","ev":"5번, 7번 문장","s":[[5,"You stick out your little finger for “ant.”","‘개미’라는 뜻으로 새끼손가락을 내민다."],[7,"Finally, you show “elephant” by sticking out your thumb.","마지막으로, 엄지를 내밀어서 ‘코끼리’를 나타낸다."]],"w":"엄지는 7번 문장에서 코끼리(elephant)를 나타내요. 개미는 5번 문장처럼 새끼손가락을 내밀어요.","c":"F"},"h":"491aac3347"},{"n":3,"t":"tf","q":"For “person,” you stick out your pointer finger.","ko":"‘사람’이라는 뜻으로는 검지를 내민다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"For “person,” you stick out your pointer finger.","‘사람’이라는 뜻으로는, 검지를 내민다."]],"w":"6번 문장에 For “person,” you stick out your pointer finger가 그대로 나와요.","c":"T"},"h":"1340bfdc57"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is because the ant can go in the elephant’s ear and annoy it.)","ko":"이것은 개미가 코끼리의 귓속으로 들어가 코끼리를 약 오르게 할 수 있기 때문이다. (annoy는 약 오르게 하다)","word":"annoy","opts":["도와주다","씻어 주다","약 오르게 하다","놀라게 하다"],"r":{"a":"3) 약 오르게 하다","ev":"12번 문장","s":[[12,"This is because the ant can go in the elephant’s ear and annoy it.","이것은 개미가 코끼리의 귓속으로 들어가 코끼리를 약 오르게 할 수 있기 때문이다."]],"w":"개미가 코끼리 귓속에 들어가서 코끼리가 약이 오르는 상황이에요. annoy는 '약 오르게 하다, 귀찮게 하다'예요. 그래서 개미가 이겨요.","c":3},"h":"872321efb2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The person beats the ant because they step on it.)","ko":"사람은 개미를 밟기 때문에 그것을 이긴다.","word":"beats","opts":["지다","이기다","피하다","따라가다"],"r":{"a":"2) 이기다","ev":"9번 문장","s":[[9,"The person beats the ant because they step on it.","사람은 개미를 밟기 때문에 그것을 이긴다."]],"w":"사람이 개미를 밟으니까 사람이 이기는 거예요. beat는 여기서 '이기다'예요. 뒤의 because 이하가 이기는 이유를 설명해 줘요.","c":2},"h":"606d804aba"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe person beats the ant because they step on it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"사람은 개미를 밟기 때문에 그것을 이긴다.","opts":["사람","코끼리","놀이","개미"],"r":{"a":"4) 개미","ev":"9번 문장","s":[[9,"The person beats the ant because they step on it.","사람은 개미를 밟기 때문에 그것을 이긴다."]],"w":"사람이 밟는 대상이 개미예요. it은 같은 문장 앞에 나온 the ant를 가리켜요. they는 사람(the person)이에요.","c":4},"h":"f609352d77"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, try playing the game with your friends.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이제, 친구들과 그 놀이를 한번 해봐라.","opts":["이제, 친구들에게 그 놀이를 가르쳐 줘라.","이제, 친구들과 그 놀이를 한번 해봐라.","이제, 친구들이 그 놀이를 하는 것을 구경해라.","이제, 친구들과 함께 그 놀이를 만들려고 노력해라."],"r":{"a":"2) 이제, 친구들과 그 놀이를 한번 해봐라.","ev":"13번 문장","s":[[13,"Now, try playing the game with your friends.","이제, 친구들과 그 놀이를 한번 해봐라."]],"w":"try + v-ing는 '(시험 삼아) ~해보다'예요. 그래서 친구들과 그 놀이를 한번 해보라는 뜻이에요. try to-v(~하려고 노력하다)와 달라요.","c":2},"h":"a75b03bd15"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이 놀이는 인도네시아에서 왔고, 동작이 가위바위보와 다르다.","이 놀이는 한국에서 왔고, 가위바위보와 같은 동작을 쓴다.","‘개미’라는 뜻으로 엄지를 내민다.","이 놀이에서 사람은 개미에게 진다."],"opts":["The game is from Indonesia, and its gestures are different from Rock, Paper, Scissors.","The game comes from Korea, and it uses the same gestures as Rock, Paper, Scissors.","You stick out your thumb for “ant.”","A person loses to an ant in this game."],"r":{"a":"1) The game is from Indonesia, and its gestures are different from Rock, Paper, Scissors.","ev":"3~4번 문장","s":[[3,"This is another version of the game from Indonesia.","이것은 인도네시아에서 나온 가위바위보의 또 다른 버전이다."],[4,"However, the gestures are different.","하지만, 동작들이 다르다."]],"w":"3번에서 인도네시아에서 나온 가위바위보의 또 다른 버전이라고 하고, 4번에서 동작이 다르다고 해요. 엄지는 개미가 아니라 코끼리(7번)이고, 사람은 개미를 이겨요(9번).","c":1},"h":"23410d9cfb"},{"n":9,"t":"sum","q":"In this game, the elephant beats the (A), but it loses to the (B) because the (B) can go in its ear.","ko":"이 놀이에서 코끼리는 (A)를 이기지만, (B)가 코끼리의 귓속에 들어갈 수 있어서 (B)에게 진다.","oko":["(A) 개미 / (B) 사람","(A) 사람 / (B) 코끼리","(A) 개미 / (B) 코끼리","(A) 코끼리 / (B) 사람","(A) 사람 / (B) 개미"],"opts":["(A) ant / (B) person","(A) person / (B) elephant","(A) ant / (B) elephant","(A) elephant / (B) person","(A) person / (B) ant"],"r":{"a":"5) (A) person / (B) ant","ev":"10~12번 문장","s":[[10,"An elephant can step on a human, so it beats the person.","코끼리는 사람을 밟을 수 있어서, 그것은 사람을 이긴다."],[11,"However, when an elephant and an ant fight, the ant wins!","하지만, 코끼리와 개미가 싸우면, 개미가 이긴다!"],[12,"This is because the ant can go in the elephant’s ear and annoy it.","이것은 개미가 코끼리의 귓속으로 들어가 코끼리를 약 오르게 할 수 있기 때문이다."]],"w":"10번에서 코끼리는 사람(person)을 이겨요. 11~12번에서 개미(ant)가 코끼리 귓속으로 들어가 약 오르게 해서 개미가 코끼리를 이겨요. 코끼리가 개미를 이기는 것이 아니에요.","c":5},"h":"cf158778df"},{"n":10,"t":"fill","q":"The person beats the [A] because the person can [B] on it.","ko":"사람은 그것 위를 [B]할 수 있기 때문에 [A]를 이긴다.","bank":["ant","step","elephant","thumb","annoy","fight"],"bko":{"ant":"개미","step":"밟다","elephant":"코끼리","thumb":"엄지","annoy":"약 오르게 하다","fight":"싸우다"},"r":{"a":"[A] ant, [B] step","ev":"9번 문장","s":[[9,"The person beats the ant because they step on it.","사람은 개미를 밟기 때문에 그것을 이긴다."]],"w":"9번 The person beats the ant because they step on it에서 가져왔어요. 사람이 개미를 밟기 때문에 이겨요. elephant는 사람이 이기는 상대가 아니고, annoy는 개미가 코끼리에게 하는 행동(12번)이에요.","c":null},"h":"20f95e3b42"}]},{"u":8,"id":"hk1-08-3","no":3,"ko":"지구야 잘 자!","items":[{"n":1,"t":"tf","q":"Earth Hour is held once a year.","ko":"Earth Hour는 일 년에 한 번 열린다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Once a year, places all over the world go dark for Earth Hour.","일 년마다 한 번씩, 전 세계의 지역들이 Earth Hour를 위해 어두워진다."]],"w":"3번 문장에 Once a year, places all over the world go dark for Earth Hour라고 나와요.","c":"T"},"h":"59a43d5335"},{"n":2,"t":"tf","q":"Most cities around the world turn off their lights at night.","ko":"전 세계 대부분의 도시들은 밤에 불을 끈다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Most cities around the world stay bright all night long.","전 세계 대부분의 도시들은 밤새도록 밝은 상태를 유지한다."]],"w":"4번 문장은 대부분의 도시들이 밤새도록 밝은 상태를 유지한다(stay bright all night long)고 해요. 불을 끈다는 말은 반대예요.","c":"F"},"h":"798e8a33ce"},{"n":3,"t":"tf","q":"Only a few countries take part in Earth Hour.","ko":"몇몇 나라만 Earth Hour에 참여한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Each year, people in more than 180 nations turn off their lights for an hour.","매년, 180개 이상의 나라들의 사람들은 한 시간 동안 불을 끈다."]],"w":"7번 문장에서 180개 이상의 나라 사람들이 불을 끈다고 해요. 몇몇 나라만이 아니에요.","c":"F"},"h":"f8bd4a850f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This consumes a lot of electricity and causes light pollution.)","ko":"이것은 많은 전력을 소비하고 빛 공해를 초래한다. (consume은 소비하다)","word":"consumes","opts":["만들다","저장하다","소비하다","빌리다"],"r":{"a":"3) 소비하다","ev":"5번 문장","s":[[5,"This consumes a lot of electricity and causes light pollution.","이것은 많은 전력을 소비하고 빛 공해를 초래한다."]],"w":"밤새 밝은 도시가 전력을 많이 쓴다는 뜻이에요. 그래서 전력을 아끼자는 Earth Hour가 필요해요. consume은 '소비하다'예요.","c":3},"h":"01779154c2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In countries that participate in Earth Hour, electricity usage decreases by 4% on average.)","ko":"Earth Hour에 참여하는 나라들에서, 전력 사용량은 평균적으로 4퍼센트만큼 감소한다.","word":"decreases","opts":["늘어나다","줄어들다","그대로이다","멈추다"],"r":{"a":"2) 줄어들다","ev":"9번 문장","s":[[9,"In countries that participate in Earth Hour, electricity usage decreases by 4% on average.","Earth Hour에 참여하는 나라들에서, 전력 사용량은 평균적으로 4퍼센트만큼 감소한다."]],"w":"Earth Hour 덕분에 전력 사용이 줄어드는 효과를 말하는 문장이에요. 퍼센트만큼 줄어든다는 뜻이라서 decrease는 '감소하다'예요.","c":2},"h":"6dad30fa2c"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nWhat happens when they all do this then?","ko":"밑줄 친 this가 가리키는 것은?","sko":"그렇다면 그들 모두가 이것을 할 때 무슨 일이 일어나는가?","opts":["밤새도록 불을 켜 두는 것","전력을 더 많이 쓰는 것","한 시간 동안 불을 끄는 것","도시를 더 밝게 꾸미는 것"],"r":{"a":"3) 한 시간 동안 불을 끄는 것","ev":"7~8번 문장","s":[[7,"Each year, people in more than 180 nations turn off their lights for an hour.","매년, 180개 이상의 나라들의 사람들은 한 시간 동안 불을 끈다."],[8,"What happens when they all do this then?","그렇다면 그들 모두가 이것을 할 때 무슨 일이 일어나는가?"]],"w":"8번의 they는 7번의 180개 이상의 나라 사람들이에요. 그들이 하는 것(this)은 7번의 turn off their lights for an hour, 즉 한 시간 동안 불을 끄는 것이에요.","c":3},"h":"5e07a66690"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But more importantly, it reminds everyone that saving electricity can save our planet.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 더 중요하게, 그것은 모든 사람에게 전력을 아끼는 것이 우리의 행성을 구할 수 있다는 것을 상기시킨다.","opts":["그러나 더 중요한 것은, 모두가 전력을 많이 쓸수록 행성이 구해진다는 점이다.","그러나 더 중요한 것은, 행성을 구하면 전력이 저절로 아껴진다는 점이다.","그러나 더 중요한 것은, 전력을 아끼려면 행성을 떠나야 한다는 점이다.","그러나 더 중요하게, 그것은 모든 사람에게 전력을 아끼는 것이 우리의 행성을 구할 수 있음을 상기시킨다."],"r":{"a":"4) 그러나 더 중요하게, 그것은 모든 사람에게 전력을 아끼는 것이 우리의 행성을 구할 수 있음을 상기시킨다.","ev":"10번 문장","s":[[10,"But more importantly, it reminds everyone that saving electricity can save our planet.","그러나 더 중요하게, 그것은 모든 사람에게 전력을 아끼는 것이 우리의 행성을 구할 수 있다는 것을 상기시킨다."]],"w":"remind + 사람 + that절은 '~에게 …을 상기시키다'예요. that절의 주어는 saving electricity(전력을 아끼는 것)이고, 그것이 행성을 구할 수 있다는 내용이에요. 원인과 결과를 뒤집은 선지에 주의하세요.","c":4},"h":"cae80fccef"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["서울의 N서울타워도 Earth Hour를 위해 불을 끈다.","Earth Hour는 매달 첫째 월요일에 열린다.","빛 공해는 불을 끄는 도시들이 일으킨다.","Earth Hour는 유럽 사람들만을 위한 것이다."],"opts":["N Seoul Tower in Seoul also turns off its lights for Earth Hour.","Earth Hour is held on the first Monday of every month.","Light pollution is caused by cities that turn off their lights.","Earth Hour is only for people in Europe."],"r":{"a":"1) N Seoul Tower in Seoul also turns off its lights for Earth Hour.","ev":"1~2번 문장","s":[[1,"At 8:30 p.m. on the last Saturday of March, the Eiffel Tower in Paris turns off its lights.","3월의 마지막 주 토요일 오후 8시 30분에, 파리의 에펠탑은 불을 끈다."],[2,"The Opera House in Sydney and N Seoul Tower in Seoul switch off their lights as well.","시드니의 오페라 하우스와 서울의 N서울타워 또한 그것들의 불을 끈다."]],"w":"2번 문장에서 서울의 N서울타워도 불을 끈다고 해요. Earth Hour는 일 년에 한 번(3번), 3월 마지막 주 토요일(1번)이에요. 빛 공해는 불을 끄는 도시가 아니라 밤새 밝은 도시가 만들어요(4~5번). 180개 이상의 나라가 참여해요(7번).","c":1},"h":"ac68194b00"},{"n":9,"t":"sum","q":"Most cities stay bright all night, which (A) a lot of electricity. Earth Hour (B) people’s attention to this problem.","ko":"대부분의 도시는 밤새 밝은 상태여서 전력을 많이 (A)한다. Earth Hour는 이 문제에 사람들의 관심을 (B)한다.","oko":["(A) 아낀다 / (B) 끈다","(A) 소비한다 / (B) 숨긴다","(A) 아낀다 / (B) 숨긴다","(A) 만든다 / (B) 잊게 한다","(A) 소비한다 / (B) 끈다"],"opts":["(A) saves / (B) draws","(A) consumes / (B) hides","(A) saves / (B) hides","(A) makes / (B) forgets","(A) consumes / (B) draws"],"r":{"a":"5) (A) consumes / (B) draws","ev":"5~6번 문장","s":[[5,"This consumes a lot of electricity and causes light pollution.","이것은 많은 전력을 소비하고 빛 공해를 초래한다."],[6,"Earth Hour was started to draw people’s attention to these problems.","Earth Hour는 이러한 문제들에 사람들의 관심을 끌기 위해 시작되었다."]],"w":"5번에서 밤새 밝은 도시는 많은 전력을 소비하고(consumes), 6번에서 Earth Hour는 이 문제에 사람들의 관심을 끌려고(draw) 시작되었어요. 전력을 아끼거나(saves) 관심을 숨기는(hides) 것이 아니에요.","c":5},"h":"f3139e63b4"},{"n":10,"t":"fill","q":"On the last [A] of March at 8:30 p.m., the [B] Tower in Paris turns off its lights.","ko":"3월의 마지막 [A] 오후 8시 30분에, 파리의 [B] 타워는 불을 끈다.","bank":["Saturday","Eiffel","Sunday","Seoul","morning","planet"],"bko":{"Saturday":"토요일","Eiffel":"에펠","Sunday":"일요일","Seoul":"서울","morning":"아침","planet":"행성"},"r":{"a":"[A] Saturday, [B] Eiffel","ev":"1번 문장","s":[[1,"At 8:30 p.m. on the last Saturday of March, the Eiffel Tower in Paris turns off its lights.","3월의 마지막 주 토요일 오후 8시 30분에, 파리의 에펠탑은 불을 끈다."]],"w":"1번 문장에 the last Saturday of March(3월의 마지막 주 토요일)와 the Eiffel Tower in Paris(파리의 에펠탑)가 나와요. Seoul은 2번 문장의 N서울타워가 있는 도시이지 파리의 탑이 아니에요. 시각이 오후(p.m.)라서 morning도 맞지 않아요.","c":null},"h":"e943633490"}]},{"u":8,"id":"hk1-08-4","no":4,"ko":"좋아해서 그래~","items":[{"n":1,"t":"tf","q":"Jessica and Amber both cover their mouths when they laugh.","ko":"Jessica와 Amber는 웃을 때 둘 다 입을 가린다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They both cover their mouths when they laugh.","그들이 웃을 때는 둘 다 입을 가린다."]],"w":"3번 문장에 They both cover their mouths when they laugh가 그대로 나와요.","c":"T"},"h":"19ea8d0d51"},{"n":2,"t":"tf","q":"The Chameleon Effect happens more often when we are far from people.","ko":"카멜레온 효과는 우리가 사람들과 멀리 떨어져 있을 때 더 자주 일어난다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It happens more often if we are close to them.","만약 우리가 그들과 가깝다면 그것은 더 자주 일어난다."]],"w":"6번 문장은 그들과 가까울 때(if we are close to them) 더 자주 일어난다고 해요. 멀리 있을 때가 아니에요.","c":"F"},"h":"d4a8ee77a2"},{"n":3,"t":"tf","q":"Psychologists call this phenomenon the Chameleon Effect.","ko":"심리학자들은 이 현상을 카멜레온 효과라고 부른다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Psychologists call this phenomenon the Chameleon Effect.","심리학자들은 이 현상을 카멜레온 효과라고 부른다."]],"w":"8번 문장에 Psychologists call this phenomenon the Chameleon Effect가 그대로 나와요.","c":"T"},"h":"18edc01029"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (And interestingly, we usually don’t even notice it.)","ko":"그리고 흥미롭게도, 우리는 보통 그것을 의식하지도 못한다.","word":"notice","opts":["잊다","거절하다","알아차리다","허락하다"],"r":{"a":"3) 알아차리다","ev":"7번 문장","s":[[7,"And interestingly, we usually don’t even notice it.","그리고 흥미롭게도, 우리는 보통 그것을 의식하지도 못한다."]],"w":"주변 사람처럼 행동하고 있다는 사실을 우리가 알아차리지 못한다는 뜻이에요. don’t even notice는 '알아차리지도 못하다'예요. notice는 '의식하다, 알아차리다'예요.","c":3},"h":"5744373fe9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In fact, they share many other similar habits.)","ko":"사실, 그들은 다른 많은 비슷한 습관들을 공유한다. (share는 공유하다)","word":"share","opts":["공유하다","버리다","숨기다","빌려주다"],"r":{"a":"1) 공유하다","ev":"4번 문장","s":[[4,"In fact, they share many other similar habits.","사실, 그들은 다른 많은 비슷한 습관들을 공유한다."]],"w":"Jessica와 Amber가 말 속도, 웃는 모습뿐 아니라 다른 습관도 둘 다 갖고 있다는 뜻이에요. share는 여기서 '공유하다, 함께 갖고 있다'예요.","c":1},"h":"da8afcaa62"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis is why we naturally follow what others do, because it can cause them to like us more!","ko":"밑줄 친 it이 가리키는 것은?","sko":"이것이 우리가 자연스럽게 다른 사람들이 하는 것을 따라 하는 이유인데, 왜냐하면 그들이 우리를 더 많이 좋아하도록 만들 수 있기 때문이다!","opts":["카멜레온이 색을 바꾸는 것","다른 사람들이 하는 것을 따라 하는 것","습관을 숨기는 것","친구와 다투는 것"],"r":{"a":"2) 다른 사람들이 하는 것을 따라 하는 것","ev":"11~12번 문장","s":[[11,"By nature, people are attracted to someone who is similar to them.","본래, 사람들은 그들과 비슷한 누군가에게 마음이 끌린다."],[12,"This is why we naturally follow what others do, because it can cause them to like us more!","이것이 우리가 자연스럽게 다른 사람들이 하는 것을 따라 하는 이유인데, 왜냐하면 그들이 우리를 더 많이 좋아하도록 만들 수 있기 때문이다!"]],"w":"12번 because 앞에서 우리는 다른 사람들이 하는 것을 따라 한다고 했어요. 그것(= 따라 하는 것)이 그들이 우리를 더 좋아하게 만들 수 있다는 이유가 돼요.","c":2},"h":"b03e73539b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Just think how you act when your crush or friends are around.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신의 짝사랑 상대나 친구들이 주변에 있을 때 당신이 어떻게 행동하는지 한번 생각해보아라.","opts":["당신의 짝사랑 상대와 친구들이 떠났을 때 어떻게 행동하는지 생각해 봐라.","당신의 짝사랑 상대가 어떻게 행동하는지 한번 생각해 봐라.","당신이 짝사랑 상대와 친구들에게 어떻게 행동해야 하는지 알려 줘라.","당신의 짝사랑 상대나 친구들이 주변에 있을 때 당신이 어떻게 행동하는지 생각해 보아라."],"r":{"a":"4) 당신의 짝사랑 상대나 친구들이 주변에 있을 때 당신이 어떻게 행동하는지 생각해 보아라.","ev":"13번 문장","s":[[13,"Just think how you act when your crush or friends are around.","당신의 짝사랑 상대나 친구들이 주변에 있을 때 당신이 어떻게 행동하는지 한번 생각해보아라."]],"w":"think 뒤의 how you act는 '네가 어떻게 행동하는지'예요. when your crush or friends are around는 '짝사랑 상대나 친구들이 주변에 있을 때'예요. 떠났을 때가 아니고, 상대의 행동이 아니라 내 행동이에요.","c":4},"h":"26a3cea88d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Jessica는 말이 빠르지만 Amber는 느리게 말한다.","사람들은 다른 사람처럼 행동할 때 항상 알아차린다.","Jessica와 Amber는 둘 다 말을 매우 빠르게 한다.","Jessica와 Amber는 어떤 습관도 공유하지 않는다."],"opts":["Jessica talks fast, but Amber talks slowly.","People always notice when they act like others.","Jessica and Amber both talk very fast.","Jessica and Amber never share any habits."],"r":{"a":"3) Jessica and Amber both talk very fast.","ev":"2번 문장","s":[[2,"Jessica talks very fast, and Amber does too.","Jessica는 말을 매우 빠르게 하는데, Amber도 역시 그렇다."]],"w":"2번 문장에서 Jessica는 말을 매우 빠르게 하는데 Amber도 그렇다고 해요. 4번에서 둘은 비슷한 습관을 많이 공유하고, 7번에서 우리는 보통 그것을 알아차리지 못해요.","c":3},"h":"079ebe4774"},{"n":9,"t":"sum","q":"People are (A) to someone similar to them, so we naturally (B) what others do.","ko":"사람들은 자신과 비슷한 사람에게 (A)기 때문에 우리는 자연스럽게 다른 사람들이 하는 것을 (B)한다.","oko":["(A) 두려워하다 / (B) 따라 하다","(A) 끌리다 / (B) 피하다","(A) 두려워하다 / (B) 피하다","(A) 지루해하다 / (B) 무시하다","(A) 끌리다 / (B) 따라 하다"],"opts":["(A) afraid / (B) follow","(A) attracted / (B) avoid","(A) afraid / (B) avoid","(A) bored / (B) ignore","(A) attracted / (B) follow"],"r":{"a":"5) (A) attracted / (B) follow","ev":"11~12번 문장","s":[[11,"By nature, people are attracted to someone who is similar to them.","본래, 사람들은 그들과 비슷한 누군가에게 마음이 끌린다."],[12,"This is why we naturally follow what others do, because it can cause them to like us more!","이것이 우리가 자연스럽게 다른 사람들이 하는 것을 따라 하는 이유인데, 왜냐하면 그들이 우리를 더 많이 좋아하도록 만들 수 있기 때문이다!"]],"w":"11번에서 사람들은 본래 비슷한 사람에게 끌려요(attracted). 12번에서 그래서 다른 사람들이 하는 것을 자연스럽게 따라 해요(follow). 두려워하거나 피하거나 무시하는 것이 아니에요.","c":5},"h":"869f692502"},{"n":10,"t":"fill","q":"Chameleons change their [A] to match their surroundings, and we change our [B] to match our social environments.","ko":"카멜레온은 환경에 맞추기 위해 [A]을 바꾸고, 우리는 사회적 환경에 맞추기 위해 [B]을 바꾼다.","bank":["colors","behavior","names","friends","shape","laugh"],"bko":{"colors":"색","behavior":"행동","names":"이름","friends":"친구들","shape":"모양","laugh":"웃음"},"r":{"a":"[A] colors, [B] behavior","ev":"9~10번 문장","s":[[9,"Chameleons change their colors to match their surroundings.","카멜레온은 그것들의 환경에 맞추기 위해 색을 바꾼다."],[10,"In the same way, we often change our behavior to match our social environments.","같은 방식으로, 우리는 종종 우리의 사회적 환경에 맞추기 위해 행동을 바꾼다."]],"w":"9번에서 카멜레온은 환경에 맞추려고 색(colors)을 바꾸고, 10번 In the same way로 사람은 사회적 환경에 맞추려고 행동(behavior)을 바꾼다고 해요. names, shape는 본문에 나오지 않아요. friends와 laugh는 다른 문장에 나오는 말이에요.","c":null},"h":"cd907dd9be"}]},{"u":9,"id":"hk1-09-1","no":1,"ko":"삼촌이 왜 거기서 나와?","items":[{"n":1,"t":"tf","q":"The trophy that the winners get is known as an Oscar.","ko":"수상자들이 받는 트로피는 오스카상으로 알려져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"This is because the trophy that the winners get is known as an Oscar.","이것은 수상자들이 받는 트로피가 오스카상으로 알려져 있기 때문이다."]],"w":"5번 문장에 the trophy that the winners get is known as an Oscar가 그대로 나와요. 수상자들이 받는 트로피가 Oscar로 알려져 있다는 내용과 일치해요.","c":"T"},"h":"fefdd08334"},{"n":2,"t":"tf","q":"Margaret Herrick was a reporter at the organization that presents the Academy Awards.","ko":"Margaret Herrick은 아카데미상을 수여하는 조직의 기자였다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Margaret Herrick was a librarian at the organization that presents the Academy Awards.","Margaret Herrick은 아카데미상을 수여하는 조직의 사서였다."]],"w":"7번 문장에서 Margaret Herrick은 사서(librarian)였다고 해요. 기자(reporter)는 10번에 나오는 다른 사람이에요.","c":"F"},"h":"3390dd56a3"},{"n":3,"t":"tf","q":"A reporter was standing beside Margaret when she said the trophy looked like her uncle.","ko":"Margaret이 트로피가 삼촌처럼 생겼다고 말했을 때, 기자가 그녀의 옆에 서 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"She said, “It looks like my uncle Oscar!”","그녀는 “그건 우리 Oscar 삼촌처럼 생겼어!”라고 말했다."],[10,"At that time, a reporter was standing beside her.","그때, 한 기자가 그녀의 옆에 서 있었다."]],"w":"9번에서 Margaret이 삼촌 Oscar 같다고 말하고, 10번에서 그때 기자가 그녀의 옆에 서 있었다고 해요.","c":"T"},"h":"7c78743522"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Margaret Herrick was a librarian at the organization that presents the Academy Awards.)","ko":"Margaret Herrick은 아카데미상을 수여하는 조직의 사서였다. (librarian은 도서관에서 일하는 사람)","opts":["기자","사서","수상자","건축가"],"word":"librarian","r":{"a":"2) 사서","ev":"7~8번 문장","s":[[7,"Margaret Herrick was a librarian at the organization that presents the Academy Awards.","Margaret Herrick은 아카데미상을 수여하는 조직의 사서였다."],[8,"One day in 1931, she saw the Academy Award trophy on a library desk.","1931년 어느 날, 그녀는 도서관 책상 위의 아카데미상 트로피를 보았다."]],"w":"7번의 librarian이 하는 일은 8번의 library(도서관)에서 알 수 있어요. librarian = 사서(도서관에서 일하는 사람).","c":2},"h":"47baa68d57"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (She heard this and wrote about it in an article.)","ko":"기자는 이를 듣고는 기사에서 그것에 대해 썼다. (article은 신문 등에 실리는 글)","opts":["상자","편지","사진","기사"],"word":"article","r":{"a":"4) 기사","ev":"11번 문장","s":[[11,"She heard this and wrote about it in an article.","기자는 이를 듣고는 기사에서 그것에 대해 썼다."]],"w":"기자(reporter)가 들은 말을 적어서 남기는 글이니 article = 기사예요.","c":4},"h":"77d4cc13f3"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nShe heard this and wrote about it in an article.","ko":"밑줄 친 this가 가리키는 것은?","sko":"기자는 이를 듣고는 기사에서 그것에 대해 썼다.","opts":["기자가 쓴 기사","트로피가 삼촌 Oscar처럼 생겼다는 Margaret의 말","1931년의 어느 날","도서관 책상 위의 책"],"r":{"a":"2) 트로피가 삼촌 Oscar처럼 생겼다는 Margaret의 말","ev":"9~11번 문장","s":[[9,"She said, “It looks like my uncle Oscar!”","그녀는 “그건 우리 Oscar 삼촌처럼 생겼어!”라고 말했다."],[10,"At that time, a reporter was standing beside her.","그때, 한 기자가 그녀의 옆에 서 있었다."],[11,"She heard this and wrote about it in an article.","기자는 이를 듣고는 기사에서 그것에 대해 썼다."]],"w":"기자가 들은 것은 9번에서 Margaret이 말한 내용(“It looks like my uncle Oscar!”)이에요. 기사는 들은 뒤에 쓴 결과물이라 this가 아니에요.","c":2},"h":"717b64184e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since then, that has been the trophy’s nickname, and people have called the Academy Awards the Oscars.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 이후로, 오스카는 트로피의 별명이 되었고, 사람들은 아카데미상을 오스카상이라고 불러왔다.","opts":["그 이후로 트로피는 아카데미상이 되었고, 사람들은 오스카라는 이름을 싫어했다.","그 이후로 오스카는 기자의 별명이 되었고, 사람들은 트로피를 아카데미상이라고만 불렀다.","그 이후로 오스카는 트로피의 별명이 되었고, 사람들은 아카데미상을 오스카상이라고 불러 왔다.","그 이후로 트로피는 삼촌의 이름이 되었고, 사람들은 도서관을 오스카상이라고 불렀다."],"r":{"a":"3) 그 이후로 오스카는 트로피의 별명이 되었고, 사람들은 아카데미상을 오스카상이라고 불러 왔다.","ev":"12번 문장","s":[[12,"Since then, that has been the trophy’s nickname, and people have called the Academy Awards the Oscars.","그 이후로, 오스카는 트로피의 별명이 되었고, 사람들은 아카데미상을 오스카상이라고 불러왔다."]],"w":"since then은 '그 이후로', the trophy’s nickname은 '트로피의 별명', call A B는 'A를 B라고 부르다'예요. 이 뜻을 모두 담은 건 3번이에요.","c":3},"h":"c00454d2a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Margaret은 도서관 책상 위의 아카데미상 트로피를 보았다.","Margaret Herrick은 신문사의 기자였다.","트로피는 기자의 삼촌 이름을 따서 이름 지어졌다.","아카데미상 수상자들은 오스카라고 불린다."],"opts":["Margaret saw the Academy Award trophy on a library desk.","Margaret Herrick was a reporter at a newspaper.","The trophy was named after the reporter’s uncle.","The winners of the Academy Awards are called Oscars."],"r":{"a":"1) Margaret saw the Academy Award trophy on a library desk.","ev":"5번, 7~8번 문장","s":[[5,"This is because the trophy that the winners get is known as an Oscar.","이것은 수상자들이 받는 트로피가 오스카상으로 알려져 있기 때문이다."],[7,"Margaret Herrick was a librarian at the organization that presents the Academy Awards.","Margaret Herrick은 아카데미상을 수여하는 조직의 사서였다."],[8,"One day in 1931, she saw the Academy Award trophy on a library desk.","1931년 어느 날, 그녀는 도서관 책상 위의 아카데미상 트로피를 보았다."]],"w":"8번에서 Margaret이 도서관 책상 위의 트로피를 봤어요. Margaret은 사서였고(7번), 삼촌은 Margaret의 삼촌이며(9번), Oscar로 알려진 것은 수상자가 아니라 트로피예요(5번).","c":1},"h":"ce22f3c8e4"},{"n":9,"t":"sum","q":"The nickname “Oscar” started when a librarian said the trophy (A) her uncle Oscar and a reporter (B) it in an article.","ko":"'오스카'라는 별명은 사서가 트로피가 삼촌 Oscar (A)고 말하고, 기자가 그것을 기사에 (B)면서 시작되었다.","oko":["(A) 같은 이름을 가졌다 / (B) 읽었다","(A) 처럼 생겼다 / (B) 팔았다","(A) 를 싫어했다 / (B) 썼다","(A) 에게 주어졌다 / (B) 잊어버렸다","(A) 처럼 생겼다 / (B) 썼다"],"opts":["(A) had the same name as / (B) read","(A) looked like / (B) sold","(A) disliked / (B) wrote about","(A) was given to / (B) forgot","(A) looked like / (B) wrote about"],"r":{"a":"5) (A) looked like / (B) wrote about","ev":"9~11번 문장","s":[[9,"She said, “It looks like my uncle Oscar!”","그녀는 “그건 우리 Oscar 삼촌처럼 생겼어!”라고 말했다."],[10,"At that time, a reporter was standing beside her.","그때, 한 기자가 그녀의 옆에 서 있었다."],[11,"She heard this and wrote about it in an article.","기자는 이를 듣고는 기사에서 그것에 대해 썼다."]],"w":"9번에서 Margaret은 트로피가 삼촌 Oscar처럼 생겼다(looks like)고 했고, 10~11번에서 기자가 그 말을 듣고 기사에 썼어요(wrote about).","c":5},"h":"18d96da1c9"},{"n":10,"t":"fill","q":"The trophy that winners get is known as an [A], and people have [B] the Academy Awards the Oscars.","ko":"수상자들이 받는 트로피는 [A]로 알려져 있고, 사람들은 아카데미상을 오스카상이라고 [B] 왔다.","bank":["Oscar","called","nickname","wrote","uncle","heard"],"bko":{"Oscar":"오스카","called":"불렀다(call 부르다)","nickname":"별명","wrote":"썼다(write 쓰다)","uncle":"삼촌","heard":"들었다(hear 듣다)"},"r":{"a":"[A] Oscar, [B] called","ev":"5번, 12번 문장","s":[[5,"This is because the trophy that the winners get is known as an Oscar.","이것은 수상자들이 받는 트로피가 오스카상으로 알려져 있기 때문이다."],[12,"Since then, that has been the trophy’s nickname, and people have called the Academy Awards the Oscars.","그 이후로, 오스카는 트로피의 별명이 되었고, 사람들은 아카데미상을 오스카상이라고 불러왔다."]],"w":"5번에 known as an Oscar가 있고, 12번에서 people have called the Academy Awards the Oscars(사람들이 아카데미상을 오스카상이라고 불러 왔다)라고 해요. [A]는 트로피가 알려진 이름이라 Oscar, [B]는 have 뒤라서 과거분사 called(call 부르다)가 와요.","c":null},"h":"3cc75e5ba5"}]},{"u":9,"id":"hk1-09-2","no":2,"ko":"티끌 모아 100L","items":[{"n":1,"t":"tf","q":"People in the Ethiopian village walked for four hours every day to get water.","ko":"에티오피아 마을 사람들은 물을 얻기 위해 매일 4시간 동안 걸었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In a mountain village in Ethiopia, people had to walk for four hours every day to get water.","에티오피아의 한 산골 마을에서, 사람들은 물을 얻기 위해 매일 4시간 동안 걸어야 했다."]],"w":"1번 문장에 people had to walk for four hours every day to get water가 있어요. 매일 4시간을 걸어 물을 얻었다는 내용과 일치해요.","c":"T"},"h":"b90baa81c3"},{"n":2,"t":"tf","q":"Nights in Ethiopia are usually hot.","ko":"에티오피아의 밤은 대체로 덥다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Usually, nights in Ethiopia are cool.","대체로, 에티오피아의 밤은 서늘하다."]],"w":"8번 문장에서 Usually, nights in Ethiopia are cool(에티오피아의 밤은 서늘하다)이라고 해요. 덥다는 말은 반대예요.","c":"F"},"h":"ac7d4b87d1"},{"n":3,"t":"tf","q":"The Warka Tower has a mesh net and a water tank.","ko":"와카 타워에는 그물망과 물탱크가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The tower consisted of a mesh net and an empty water tank at the bottom.","그 타워는 그물망과 바닥에 있는 빈 물탱크로 이루어졌다."]],"w":"5번 문장에서 타워는 mesh net(그물망)과 empty water tank(빈 물탱크)로 이루어졌다고 해요.","c":"T"},"h":"6f2bd3ea35"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He built a nine-meter-high tower to collect water.)","ko":"그는 물을 모으기 위해 9미터 높이의 타워를 지었다. (collect는 물을 ~하는 일)","opts":["씻다","모으다","버리다","섞다"],"word":"collect","r":{"a":"2) 모으다","ev":"4번, 12번 문장","s":[[4,"He built a nine-meter-high tower to collect water.","그는 물을 모으기 위해 9미터 높이의 타워를 지었다."],[12,"This way, it can collect 50 to 100 liters of clean water per day!","이렇게 하여, 그것은 하루에 50에서 100리터의 깨끗한 물을 모을 수 있다!"]],"w":"타워를 지은 이유가 물을 모으려는 것이고, 12번에서 하루에 50~100리터의 물을 모을 수 있다(collect)고 해요. collect = 모으다.","c":2},"h":"7fb8852692"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (the water vapor in the air turns into water drops)","ko":"공기 중의 수증기는 물방울로 변한다. (drop은 물의 ~)","opts":["방울","구멍","그림자","바위"],"word":"drops","r":{"a":"1) 방울","ev":"10~11번 문장","s":[[10,"When the temperature drops, the water vapor in the air turns into water drops.","기온이 떨어질 때, 공기 중의 수증기는 물방울로 변한다."],[11,"The Warka Tower was designed so that the water drops could form on its net and then fall into the tank.","와카 타워는 망에 물방울이 형성되어 물탱크 안에 떨어질 수 있도록 설계되었다."]],"w":"10번에서 수증기가 water drops로 변하고, 11번에서 그 drops가 망에 맺혀 탱크로 떨어져요. 그러니 drops = 물방울이에요.","c":1},"h":"af20691d48"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nThe Warka Tower was designed so that the water drops could form on its net and then fall into the tank.","ko":"밑줄 친 its가 가리키는 것은?","sko":"와카 타워는 망에 물방울이 형성되어 물탱크 안에 떨어질 수 있도록 설계되었다.","opts":["물방울","에티오피아의 마을", e water drops could form on its net and then fall into the tank.","와카 타워는 망에 물방울이 형성되어 물탱크 안에 떨어질 수 있도록 설계되었다."]],"w":"10~11번에서 수증기가 물방울이 되어 타워의 망에 맺히고 탱크로 떨어져요. 물은 깨끗하지 않았고(2번), Arturo Vittori는 건축가예요(3번).","c":3},"h":"8ff8048611"},{"n":9,"t":"sum","q":"In an Ethiopian village, it was hard to get (A) water, so an architect built a tower to (B) water.","ko":"에티오피아의 한 마을에서는 (A) 물을 얻기 어려워서, 한 건축가가 물을 (B)기 위해 타워를 지었다.","oko":["(A) 깨끗한 / (B) 팔","(A) 뜨거운 / (B) 버리","(A) 단 / (B) 마시","(A) 차가운 / (B) 모으","(A) 깨끗한 / (B) 모으"],"opts":["(A) clean / (B) sell","(A) hot / (B) waste","(A) sweet / (B) drink","(A) cold / (B) collect","(A) clean / (B) collect"],"r":{"a":"5) (A) clean / (B) collect","ev":"1~2번, 4번 문장","s":[[1,"In a mountain village in Ethiopia, people had to walk for four hours every day to get water.","에티오피아의 한 산골 마을에서, 사람들은 물을 얻기 위해 매일 4시간 동안 걸어야 했다."],[2,"Most times, the water was not even clean.","대부분의 경우, 그 물은 심지어 깨끗하지도 않았다."],[4,"He built a nine-meter-high tower to collect water.","그는 물을 모으기 위해 9미터 높이의 타워를 지었다."]],"w":"1~2번에서 물을 얻으려고 4시간을 걸어야 했고 그 물마저 깨끗하지 않았어요. 그래서 4번에서 건축가가 물을 모으려고(collect) 타워를 지었어요.","c":5},"h":"71e0128320"},{"n":10,"t":"fill","q":"At night, the water [A] in the air turns into drops, and the drops form on the net and then fall into the [B].","ko":"밤이 되면 공기 중의 [A]는 물방울로 변하고, 그 물방울은 망에 맺힌 뒤 [B] 안으로 떨어진다.","bank":["vapor","tank","net","tree","liters","village"],"bko":{"vapor":"수증기","tank":"물탱크","net":"그물망","liters":"리터","village":"마을","tree":"나무"},"r":{"a":"[A] vapor, [B] tank","ev":"10~11번 문장","s":[[10,"When the temperature drops, the water vapor in the air turns into water drops.","기온이 떨어질 때, 공기 중의 수증기는 물방울로 변한다."],[11,"The Warka Tower was designed so that the water drops could form on its net and then fall into the tank.","와카 타워는 망에 물방울이 형성되어 물탱크 안에 떨어질 수 있도록 설계되었다."]],"w":"10번에서 공기 중의 water vapor(수증기)가 물방울로 변하고, 11번에서 물방울이 망에 맺힌 뒤 tank(물탱크) 안으로 떨어져요. net은 물방울이 맺히는 곳이지 떨어져 들어가는 곳이 아니에요.","c":null},"h":"e2f7b163c4"}]},{"u":9,"id":"hk1-09-3","no":3,"ko":"여긴 특급 축구장이야","items":[{"n":1,"t":"tf","q":"Wembley Stadium has an arch that is 315 meters high.","ko":"웸블리 스타디움에는 315미터 높이의 아치가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When you visit the place, the first thing you notice is the 315-meter arch.","당신이 그 장소를 방문할 때, 첫 번째로 알아차리는 것은 315미터의 아치이다."]],"w":"3번 문장에 the 315-meter arch가 나와요. 스타디움을 방문하면 가장 먼저 눈에 띄는 것이 이 아치예요.","c":"T"},"h":"5b390a467b"},{"n":2,"t":"tf","q":"Wembley Stadium has fewer than 1,000 toilets.","ko":"웸블리 스타디움에는 변기가 1,000개보다 적다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It even has 2,618 toilets!","그곳에는 심지어 2,618개의 변기가 있다!"]],"w":"7번 문장에서 It even has 2,618 toilets!라고 해요. 2,618개는 1,000개보다 많으니 틀린 말이에요.","c":"F"},"h":"cf807d15df"},{"n":3,"t":"tf","q":"The Korean group BTS was on the stage at Wembley Stadium in 2019.","ko":"한국 그룹 BTS는 2019년에 웸블리 스타디움 무대에 올랐다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"In 2019, the Korean group BTS was on the stage!","2019년에는, 한국 그룹 BTS가 무대에 올랐다!"]],"w":"11번 문장에 In 2019, the Korean group BTS was on the stage!라고 나와요.","c":"T"},"h":"eaa80cf4de"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (the first thing you notice is the 315-meter arch)","ko":"당신이 첫 번째로 알아차리는 것은 315미터의 아치이다.","opts":["잊어버리다","만들다","알아차리다","팔다"],"word":"notice","r":{"a":"3) 알아차리다","ev":"3번 문장","s":[[3,"When you visit the place, the first thing you notice is the 315-meter arch.","당신이 그 장소를 방문할 때, 첫 번째로 알아차리는 것은 315미터의 아치이다."]],"w":"스타디움에 가면 가장 먼저 눈에 들어오는 것이 아치라는 흐름이에요. notice = 알아차리다.","c":3},"h":"e6ab111d48"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It has hosted the world’s biggest music concerts.)","ko":"그곳은 세계에서 가장 큰 음악 콘서트들을 주최했다.","opts":["취소했다","무시했다","건설했다","주최했다"],"word":"hosted","r":{"a":"4) 주최했다","ev":"9~10번 문장","s":[[9,"It has hosted the world’s biggest music concerts.","그곳은 세계에서 가장 큰 음악 콘서트들을 주최했다."],[10,"Singers such as Ed Sheeran and Taylor Swift have performed there.","에드 시런과 테일러 스위프트 같은 가수들이 그곳에서 공연을 했다."]],"w":"9번에서 큰 콘서트들을 hosted했고, 10번에서 가수들이 그곳에서 공연했다고 해요. 그러니 host = 주최하다.","c":4},"h":"6dbd4bfc2d"},{"n":6,"t":"ref","q":"What does the underlined \"there\" refer to?\nSingers such as Ed Sheeran and Taylor Swift have performed there.","ko":"밑줄 친 there가 가리키는 것은?","sko":"에드 시런과 테일러 스위프트 같은 가수들이 그곳에서 공연을 했다.","opts":["런던의 공원","웸블리 스타디움","유럽 전체","BTS의 집"],"r":{"a":"2) 웸블리 스타디움","ev":"8~10번 문장","s":[[8,"Wembley Stadium is also popular among fans of pop music.","웸블리 스타디움은 대중음악 팬들 사이에서도 인기가 있다."],[9,"It has hosted the world’s biggest music concerts.","그곳은 세계에서 가장 큰 음악 콘서트들을 주최했다."],[10,"Singers such as Ed Sheeran and Taylor Swift have performed there.","에드 시런과 테일러 스위프트 같은 가수들이 그곳에서 공연을 했다."]],"w":"8번에서 웸블리 스타디움이 대중음악 팬들에게도 인기 있다고 하고, 9번에서 그곳이 큰 콘서트를 주최했다고 해요. 10번의 there는 그 웸블리 스타디움이에요.","c":2},"h":"c2f31b5e39"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is big enough to have 90,000 seats and standing space for 25,000 people.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그곳은 9만 석의 좌석과 2만 5천 명을 위한 입석을 가지고 있을 만큼 충분히 크다.","opts":["그곳은 너무 작아서 9만 석의 좌석을 가질 수 없다.","그곳은 9만 석의 좌석과 2만 5천 명이 서서 볼 자리를 가질 만큼 충분히 크다.","그곳은 2만 5천 석의 좌석과 9만 명을 위한 입석이 있다.","그곳은 좌석이 9만 석이고 입석은 없다."],"r":{"a":"2) 그곳은 9만 석의 좌석과 2만 5천 명이 서서 볼 자리를 가질 만큼 충분히 크다.","ev":"6번 문장","s":[[6,"It is big enough to have 90,000 seats and standing space for 25,000 people.","그곳은 9만 석의 좌석과 2만 5천 명을 위한 입석을 가지고 있을 만큼 충분히 크다."]],"w":"형용사 + enough to는 '~할 만큼 충분히 …한'이에요. 좌석 9만 석과 입석 2만 5천 명 자리가 모두 있다는 뜻이라 2번이에요. 숫자를 서로 바꾼 3번과 입석이 없다는 4번은 6번과 달라요.","c":2},"h":"e98fe32543"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["골이 득점되면 아치의 LED 전등이 번쩍인다.","웸블리 스타디움은 유럽에서 가장 큰 경기장이다.","웸블리 스타디움은 축구 팬들에게만 인기가 있다.","에드 시런과 테일러 스위프트는 그곳에서 공연한 적이 없다."],"opts":["When a goal is scored, LED lights in the arch flash.","Wembley Stadium is the largest stadium in Europe.","Wembley Stadium is popular only among football fans.","Ed Sheeran and Taylor Swift have never performed there."],"r":{"a":"1) When a goal is scored, LED lights in the arch flash.","ev":"4~5번, 8번, 10번 문장","s":[[4,"When a goal is scored, colored LED lights in the arch flash.","골이 득점되면, 아치에 있는 색이 입혀진 LED 전등이 번쩍인다."],[5,"Also, the stadium is the second largest in all of Europe.","또한, 그 경기장은 유럽 전체에서 두 번째로 가장 크다."],[8,"Wembley Stadium is also popular among fans of pop music.","웸블리 스타디움은 대중음악 팬들 사이에서도 인기가 있다."],[10,"Singers such as Ed Sheeran and Taylor Swift have performed there.","에드 시런과 테일러 스위프트 같은 가수들이 그곳에서 공연을 했다."]],"w":"4번에서 골이 득점되면 LED 전등이 번쩍인다고 해요. 가장 큰 것이 아니라 두 번째로 큰 경기장이고(5번), 대중음악 팬들 사이에서도 인기가 있으며(8번), 두 가수는 공연을 했어요(10번).","c":1},"h":"f5b07c9363"},{"n":9,"t":"sum","q":"Wembley Stadium is the home of English (A), and it is also a (B) place for pop music concerts.","ko":"웸블리 스타디움은 영국 (A)의 본고장이며, 대중음악 콘서트로도 (B) 장소이다.","oko":["(A) 테니스 / (B) 인기 있는","(A) 농구 / (B) 작은","(A) 축구 / (B) 조용한","(A) 축구 / (B) 빈","(A) 축구 / (B) 인기 있는"],"opts":["(A) tennis / (B) popular","(A) basketball / (B) small","(A) football / (B) quiet","(A) football / (B) empty","(A) football / (B) popular"],"r":{"a":"5) (A) football / (B) popular","ev":"2번, 8번 문장","s":[[2,"It is the home of English football.","그곳은 영국 축구의 본고장이다."],[8,"Wembley Stadium is also popular among fans of pop music.","웸블리 스타디움은 대중음악 팬들 사이에서도 인기가 있다."]],"w":"2번에서 영국 축구(English football)의 본고장이라고 하고, 8번에서 대중음악 팬들 사이에서도 인기 있다(popular)고 해요.","c":5},"h":"917ded0245"},{"n":10,"t":"fill","q":"Wembley Stadium is the second [A] stadium in Europe, and it has [B] the world’s biggest music concerts.","ko":"웸블리 스타디움은 유럽에서 두 번째로 [A] 경기장이며, 세계에서 가장 큰 음악 콘서트들을 [B] 왔다.","bank":["largest","hosted","scored","flash","notice","seats"],"bko":{"largest":"가장 큰","hosted":"주최했다(host 주최하다)","scored":"득점했다(score 득점하다)","flash":"번쩍이다","notice":"알아차리다","seats":"좌석"},"r":{"a":"[A] largest, [B] hosted","ev":"5번, 9번 문장","s":[[5,"Also, the stadium is the second largest in all of Europe.","또한, 그 경기장은 유럽 전체에서 두 번째로 가장 크다."],[9,"It has hosted the world’s biggest music concerts.","그곳은 세계에서 가장 큰 음악 콘서트들을 주최했다."]],"w":"5번에 the second largest(두 번째로 가장 큰)가 있고, 9번에 It has hosted the world’s biggest music concerts가 있어요. has 뒤에는 과거분사 hosted가 와야 해요.","c":null},"h":"30c84ca732"}]},{"u":9,"id":"hk1-09-4","no":4,"ko":"눈사람도 추워요!","items":[{"n":1,"t":"tf","q":"The snowman Olaf stays frozen thanks to the snow queen.","ko":"눈사람 올라프는 눈의 여왕 덕분에 언 상태를 유지한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"The snowman Olaf stays frozen thanks to the snow queen.","눈사람 올라프는 눈의 여왕 덕분에 언 상태를 유지한다."]],"w":"1번 문장에 stays frozen thanks to the snow queen이 그대로 있어요. 눈의 여왕 덕분에 언 상태를 유지한다는 내용과 일치해요.","c":"T"},"h":"f07a46c7ca"},{"n":2,"t":"tf","q":"After about an hour, the snowman with the blanket melts first.","ko":"약 한 시간 후, 담요를 두른 눈사람이 먼저 녹는다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"After about an hour, one of them melts and falls apart.","약 한 시간 후, 그것들 중 하나는 녹아서 허물어진다."],[8,"Surprisingly, it is the snowman without the blanket.","놀랍게도, 그것은 담요가 없는 눈사람이다."]],"w":"7번에서 한 시간 뒤에 한 눈사람이 녹아 허물어진다고 하고, 8번에서 놀랍게도 그것은 담요가 없는 눈사람이라고 해요. 담요를 두른 쪽이 먼저 녹는다는 말은 반대예요.","c":"F"},"h":"ee212b62c8"},{"n":3,"t":"tf","q":"Heat always flows from a hot area to a colder one.","ko":"열은 항상 더운 곳에서 더 찬 곳으로 흐른다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Heat always flows from a hot area to a colder one.","열은 항상 더운 곳에서 더 찬 곳으로 흐른다."]],"w":"10번 문장에서 Heat always flows from a hot area to a colder one이라고 해요. from A to B는 'A에서 B로'예요.","c":"T"},"h":"4bcb7aa868"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (After about an hour, one of them melts and falls apart.)","ko":"약 한 시간 후, 그것들 중 하나는 녹아서 허물어진다. (melt는 눈사람이 ~하는 것)","opts":["녹다","얼다","자라다","날다"],"word":"melts","r":{"a":"1) 녹다","ev":"7번, 11번 문장","s":[[7,"After about an hour, one of them melts and falls apart.","약 한 시간 후, 그것들 중 하나는 녹아서 허물어진다."],[11,"If there is no blanket, the warm air reaches the snowman and melts it.","만약 담요가 없다면, 따뜻한 공기는 눈사람에 닿아서 그것을 녹인다."]],"w":"눈사람이 허물어진다고 했고, 11번에서 따뜻한 공기가 눈사람에 닿아 melts it(그것을 녹인다)이라고 해요. melt = 녹다, 녹이다.","c":1},"h":"1d2a237e2f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, the blanket prevents the warm air from reaching it.)","ko":"하지만, 담요는 따뜻한 공기가 눈사람에 닿는 것을 막는다.","opts":["가져온다","막는다","만든다","돕는다"],"word":"prevents","r":{"a":"2) 막는다","ev":"11~12번 문장","s":[[11,"If there is no blanket, the warm air reaches the snowman and melts it.","만약 담요가 없다면, 따뜻한 공기는 눈사람에 닿아서 그것을 녹인다."],[12,"However, the blanket prevents the warm air from reaching it.","하지만, 담요는 따뜻한 공기가 눈사람에 닿는 것을 막는다."]],"w":"11번은 담요가 없을 때 따뜻한 공기가 눈사람에 닿는 이야기이고, 12번은 However(하지만)로 그 반대를 말해요. 닿는 것을 '막는다'는 뜻이라서 prevent = 막다예요.","c":2},"h":"629b2ef348"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIf there is no blanket, the warm air reaches the snowman and melts it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"만약 담요가 없다면, 따뜻한 공기는 눈사람에 닿아서 그것을 녹인다.","opts":["담요","따뜻한 공기","눈사람","열"],"r":{"a":"3) 눈사람","ev":"11번 문장","s":[[11,"If there is no blanket, the warm air reaches the snowman and melts it.","만약 담요가 없다면, 따뜻한 공기는 눈사람에 닿아서 그것을 녹인다."]],"w":"녹는 것은 눈사람이에요. 따뜻한 공기가 눈사람에 닿아서 눈사람을 녹이니, melts it의 it은 the snowman이에요.","c":3},"h":"9e39746336"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Therefore, the snowman with the blanket stays cold longer and melts more slowly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서, 담요가 있는 눈사람이 더 오랫동안 차가운 상태를 유지하고 더 천천히 녹는다.","opts":["담요가 있는 눈사람이 더 빨리 녹는다.","담요가 없는 눈사람이 더 오래 차가운 상태를 유지한다.","담요가 있는 눈사람은 따뜻해져서 더 천천히 녹는다.","담요가 있는 눈사람이 더 오래 차갑게 있고 더 천천히 녹는다."],"r":{"a":"4) 담요가 있는 눈사람이 더 오래 차갑게 있고 더 천천히 녹는다.","ev":"13번 문장","s":[[13,"Therefore, the snowman with the blanket stays cold longer and melts more slowly.","따라서, 담요가 있는 눈사람이 더 오랫동안 차가운 상태를 유지하고 더 천천히 녹는다."]],"w":"stays cold longer는 '더 오래 차가운 상태로 있다', melts more slowly는 '더 천천히 녹는다'예요. 이 두 가지를 모두 담은 것은 4번이에요.","c":4},"h":"2a40264e56"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["열은 찬 곳에서 더운 곳으로 흐른다.","두 눈사람은 한 시간 뒤 모두 녹았다.","담요는 따뜻한 공기가 눈사람에 닿는 것을 막는다.","올라프는 담요 덕분에 얼어 있다."],"opts":["Heat flows from a cold area to a hotter one.","Both snowmen melted after an hour.","The blanket keeps the warm air from reaching the snowman.","Olaf stays frozen thanks to a blanket."],"r":{"a":"3) The blanket keeps the warm air from reaching the snowman.","ev":"1번, 7번, 10번, 12번 문장","s":[[1,"The snowman Olaf stays frozen thanks to the snow queen.","눈사람 올라프는 눈의 여왕 덕분에 언 상태를 유지한다."],[7,"After about an hour, one of them melts and falls apart.","약 한 시간 후, 그것들 중 하나는 녹아서 허물어진다."],[10,"Heat always flows from a hot area to a colder one.","열은 항상 더운 곳에서 더 찬 곳으로 흐른다."],[12,"However, the blanket prevents the warm air from reaching it.","하지만, 담요는 따뜻한 공기가 눈사람에 닿는 것을 막는다."]],"w":"12번에서 담요가 따뜻한 공기가 눈사람에 닿는 것을 막는다고 해요. 열은 더운 곳에서 찬 곳으로 흐르고(10번), 한 시간 뒤 하나만 녹으며(7번), 올라프는 눈의 여왕 덕분에 얼어 있어요(1번).","c":3},"h":"7ecd306331"},{"n":9,"t":"sum","q":"After an hour, the snowman (A) a blanket melted because (B) air reached it.","ko":"한 시간 뒤, 담요가 (A) 눈사람이 녹았는데, (B) 공기가 그것에 닿았기 때문이다.","oko":["(A) 없는 / (B) 따뜻한","(A) 있는 / (B) 따뜻한","(A) 없는 / (B) 차가운","(A) 있는 / (B) 차가운","(A) 없는 / (B) 아무"],"opts":["(A) without / (B) warm","(A) with / (B) warm","(A) without / (B) cold","(A) with / (B) cold","(A) without / (B) no"],"r":{"a":"1) (A) without / (B) warm","ev":"7~8번, 11번 문장","s":[[7,"After about an hour, one of them melts and falls apart.","약 한 시간 후, 그것들 중 하나는 녹아서 허물어진다."],[8,"Surprisingly, it is the snowman without the blanket.","놀랍게도, 그것은 담요가 없는 눈사람이다."],[11,"If there is no blanket, the warm air reaches the snowman and melts it.","만약 담요가 없다면, 따뜻한 공기는 눈사람에 닿아서 그것을 녹인다."]],"w":"한 시간 뒤 먼저 녹은 눈사람은 담요가 없는(without) 눈사람이에요(7~8번). 담요가 없으면 따뜻한(warm) 공기가 눈사람에 닿아 녹여요(11번).","c":1},"h":"0dc8f3458a"},{"n":10,"t":"fill","q":"The blanket [A] warm air from reaching the snowman, so the snowman stays cold and melts [B].","ko":"담요는 따뜻한 공기가 눈사람에 닿는 것을 [A], 그래서 눈사람은 차가운 상태로 있고 [B] 녹는다.","bank":["prevents","slowly","flows","quickly","covers","reaches"],"bko":{"prevents":"막는다(prevent 막다)","slowly":"천천히","flows":"흐른다(flow 흐르다)","quickly":"빨리","covers":"덮는다(cover 덮다)","reaches":"닿는다(reach 닿다)"},"r":{"a":"[A] prevents, [B] slowly","ev":"12~13번 문장","s":[[12,"However, the blanket prevents the warm air from reaching it.","하지만, 담요는 따뜻한 공기가 눈사람에 닿는 것을 막는다."],[13,"Therefore, the snowman with the blanket stays cold longer and melts more slowly.","따라서, 담요가 있는 눈사람이 더 오랫동안 차가운 상태를 유지하고 더 천천히 녹는다."]],"w":"12번에서 the blanket prevents the warm air from reaching it이라고 하고, 13번에서 담요가 있는 눈사람은 more slowly 녹는다고 해요. quickly(빨리)는 반대예요.","c":null},"h":"ce71129b32"}]},{"u":10,"id":"hk1-10-1","no":1,"ko":"LA에서 만나요","items":[{"n":1,"t":"tf","q":"Ahn went to the United States in 1902 to study.","ko":"안창호 선생은 공부하기 위해 1902년에 미국으로 갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장에 In 1902, Ahn went to the United States to study.라고 그대로 나와요. 1902년, 미국, 공부하기 위해 모두 맞아요.","c":"T","s":[[6,"In 1902, Ahn went to the United States to study.","1902년에, 안창호 선생은 공부를 하기 위해 미국으로 갔다."]]},"h":"d45a6c2fe8"},{"n":2,"t":"tf","q":"Korean students and workers in the United States had many opportunities to become successful.","ko":"미국에 있던 한인 학생들과 노동자들에게는 성공할 수 있는 기회가 많았다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","w":"8번 문장은 They didn’t have many opportunities라고 해요. 기회가 많지 않았다는 말이라 '많았다'는 반대예요.","c":"F","s":[[7,"There, he found that Korean students and workers were living under poor conditions.","그곳에서, 그는 한인 학생들과 노동자들이 열악한 환경하에 살고 있었다는 것을 알게 되었다."],[8,"They didn’t have many opportunities to become successful.","그들에게는 성공할 수 있는 기회가 많지 않았다."]]},"h":"3acc40b2b0"},{"n":3,"t":"tf","q":"The people in Korea Town joined Ahn and fought with him.","ko":"한인타운의 사람들은 안창호 선생에게 동참해 그와 함께 투쟁했다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","w":"11번 문장에 joined and fought with him이 나와요. him은 안창호 선생이므로 맞는 말이에요.","c":"T","s":[[11,"The people in Korea Town joined and fought with him.","한인타운의 사람들도 동참해서 그와 함께 투쟁했다."]]},"h":"c0d66f3715"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They didn’t have many opportunities to become successful.)","ko":"그들에게는 성공할 수 있는 기회가 많지 않았다. (opportunities의 뜻은?)","opts":["문제들","기회들","비용","약속"],"word":"opportunities","r":{"a":"2) 기회들","ev":"8번 문장","w":"opportunity는 '기회'예요. 성공할 수 있는 ○○가 많지 않았다는 흐름이라, 문제나 비용이 아니라 '기회'가 알맞아요.","c":2,"s":[[8,"They didn’t have many opportunities to become successful.","그들에게는 성공할 수 있는 기회가 많지 않았다."]]},"h":"6a314e6de1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the people in Korea Town still remember and celebrate Ahn’s achievements.)","ko":"...한인타운의 사람들은 여전히 안창호 선생의 achievements를 기억하고 기념한다. (achievements의 뜻은?)","opts":["실수들","재산","약속","업적"],"word":"achievements","r":{"a":"4) 업적","ev":"12번 문장","w":"사람들이 지금까지 기억하고 기념하는 것은 선생이 이룬 일, 즉 '업적'이에요. 기념하는 대상으로 실수나 재산은 어울리지 않아요.","c":4,"s":[[12,"To this day, the people in Korea Town still remember and celebrate Ahn’s achievements.","지금까지도, 한인타운의 사람들은 여전히 안창호 선생의 업적을 기억하고 기념한다."]]},"h":"899ecb30e4"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey didn’t have many opportunities to become successful.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들에게는 성공할 수 있는 기회가 많지 않았다.","opts":["한인타운의 사람들","한인 학생들과 노동자들","일본 사람들","안창호 선생과 친구들"],"r":{"a":"2) 한인 학생들과 노동자들","ev":"7~8번 문장","w":"7번 문장에서 열악한 환경에 살고 있던 사람들은 Korean students and workers예요. 바로 뒤 8번의 They가 이 사람들을 받아요.","c":2,"s":[[7,"There, he found that Korean students and workers were living under poor conditions.","그곳에서, 그는 한인 학생들과 노동자들이 열악한 환경하에 살고 있었다는 것을 알게 되었다."],[8,"They didn’t have many opportunities to become successful.","그들에게는 성공할 수 있는 기회가 많지 않았다."]]},"h":"f178151dec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Ahn created a Korean community and tried to educate them and find them jobs.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"안창호 선생은 한인 공동체를 만들어서 그들을 교육하고 그들에게 일자리를 찾아 주기 위해 노력했다.","opts":["안창호 선생은 한인들에게 일자리를 얻은 뒤 공동체를 떠나라고 했다.","한인 공동체가 안창호 선생을 교육하고 일자리를 찾아 주었다.","안창호 선생은 한인 공동체를 만들어서 한인들을 교육하고 일자리를 찾아 주려고 노력했다.","안창호 선생은 일본인 공동체를 만들어서 그들을 가르쳤다."],"r":{"a":"3) 안창호 선생은 한인 공동체를 만들어서 한인들을 교육하고 일자리를 찾아 주려고 노력했다.","ev":"9번 문장","w":"주어는 Ahn이고, 그가 공동체를 만들고(created) 한인들을 교육하고 일자리를 찾아 주려고(tried to educate and find jobs) 했어요. 나머지는 주어나 대상이 바뀌었거나 본문에 없는 내용이에요.","c":3,"s":[[9,"Therefore, Ahn created a Korean community and tried to educate them and find them jobs.","그래서, 안창호 선생은 한인 공동체를 만들어서 그들을 교육하고 그들에게 일자리를 찾아 주기 위해 노력했다."]]},"h":"bf5521ece1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["안창호 선생은 공부하기 위해 1902년에 일본으로 갔다.","미국에 있던 한인 학생들과 노동자들은 성공할 기회가 많았다.","한인타운의 사람들은 안창호 선생의 투쟁에 동참하지 않았다.","안창호 선생은 일본이 한국을 점령했을 때 한국의 독립을 위해 투쟁했다."],"opts":["Ahn went to Japan to study in 1902.","Korean students and workers in the United States had many chances to become successful.","The people in Korea Town did not join Ahn’s fight.","Ahn fought for Korea’s independence when Japan took over Korea."],"r":{"a":"4) Ahn fought for Korea’s independence when Japan took over Korea.","ev":"6·8·10·11번 문장","w":"10번 문장에 일본이 한국을 점령했을 때 독립을 위해 투쟁했다고 나와요. 선생이 간 곳은 일본이 아니라 미국(6번), 기회는 많지 않았고(8번), 사람들은 동참했어요(11번).","c":4,"s":[[6,"In 1902, Ahn went to the United States to study.","1902년에, 안창호 선생은 공부를 하기 위해 미국으로 갔다."],[8,"They didn’t have many opportunities to become successful.","그들에게는 성공할 수 있는 기회가 많지 않았다."],[10,"Ahn also fought for Korea’s independence when Japan took over Korea.","안창호 선생은 또한 일본이 한국을 점령했을 때 한국의 독립을 위해 투쟁했다."],[11,"The people in Korea Town joined and fought with him.","한인타운의 사람들도 동참해서 그와 함께 투쟁했다."]]},"h":"0cc741b92b"},{"n":9,"t":"sum","q":"Ahn saw that Koreans in the United States lived in (A) conditions, so he created a (B) to help them.","ko":"안창호 선생은 미국의 한인들이 (A) 환경에서 살고 있는 것을 보고, 그들을 돕기 위해 (B)를 만들었다.","oko":["(A) 좋은 / (B) 학교","(A) 열악한 / (B) 병원","(A) 부유한 / (B) 공동체","(A) 안전한 / (B) 회사","(A) 열악한 / (B) 공동체"],"opts":["(A) good / (B) school","(A) poor / (B) hospital","(A) rich / (B) community","(A) safe / (B) company","(A) poor / (B) community"],"r":{"a":"5) (A) poor / (B) community","ev":"7번, 9번 문장","w":"7번에서 한인들은 poor conditions(열악한 환경)에서 살고 있었고, 9번에서 선생은 Korean community(한인 공동체)를 만들었어요. 그래서 (A)는 poor, (B)는 community예요.","c":5,"s":[[7,"There, he found that Korean students and workers were living under poor conditions.","그곳에서, 그는 한인 학생들과 노동자들이 열악한 환경하에 살고 있었다는 것을 알게 되었다."],[9,"Therefore, Ahn created a Korean community and tried to educate them and find them jobs.","그래서, 안창호 선생은 한인 공동체를 만들어서 그들을 교육하고 그들에게 일자리를 찾아 주기 위해 노력했다."]]},"h":"bddb60e9ef"},{"n":10,"t":"fill","q":"Ahn fought for Korea’s [A] when Japan took over Korea, and the people in Korea Town still [B] his achievements.","ko":"안창호 선생은 일본이 한국을 점령했을 때 한국의 [A]을 위해 투쟁했고, 한인타운의 사람들은 여전히 그의 업적을 [B]한다.","bank":["independence","celebrate","community","educate","achievements","successful"],"bko":{"independence":"독립","celebrate":"기념하다","community":"공동체","educate":"교육하다","achievements":"업적","successful":"성공한"},"r":{"a":"[A] independence, [B] celebrate","ev":"10~12번 문장","w":"10번에서 한국의 independence(독립)를 위해 투쟁했고, 12번에서 사람들이 업적을 remember and celebrate(기억하고 기념한다)해요. 빈칸 [B] 뒤에 his achievements가 목적어로 오므로 동사 celebrate가 맞아요.","c":null,"s":[[10,"Ahn also fought for Korea’s independence when Japan took over Korea.","안창호 선생은 또한 일본이 한국을 점령했을 때 한국의 독립을 위해 투쟁했다."],[11,"The people in Korea Town joined and fought with him.","한인타운의 사람들도 동참해서 그와 함께 투쟁했다."],[12,"To this day, the people in Korea Town still remember and celebrate Ahn’s achievements.","지금까지도, 한인타운의 사람들은 여전히 안창호 선생의 업적을 기억하고 기념한다."]]},"h":"9821dd51de"}]},{"u":10,"id":"hk1-10-2","no":2,"ko":"90초면 사르르~","items":[{"n":1,"t":"tf","q":"The writer was very angry and threw a phone.","ko":"글쓴이는 너무 화가 나서 전화기를 던졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에 I was very angry and even threw my phone.이 나와요. 화가 나서 전화기를 던졌다는 내용과 같아요.","c":"T","s":[[2,"I was very angry and even threw my phone.","저는 너무 화가 나서 제 전화기를 던지기까지 했어요."]]},"h":"6b91f75b6a"},{"n":2,"t":"tf","q":"Dr. Helper says that something is wrong with the writer.","ko":"Helper 박사는 글쓴이에게 문제가 있다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","w":"5번 Don’t worry, 6번 Nothing is wrong with you!라고 해요. 문제가 있다고 한 것이 아니라 아무 문제 없다고 안심시켜요.","c":"F","s":[[5,"Don’t worry.","걱정하지 말아요."],[6,"Nothing is wrong with you!","당신에게는 아무런 문제가 없어요!"]]},"h":"d998a634ef"},{"n":3,"t":"tf","q":"Many people become angry quickly and regret it later.","ko":"많은 사람들이 금방 화를 내고 나중에 그것을 후회한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","w":"7번 문장에 그대로 나와요. 글쓴이만 그런 것이 아니라 많은 사람이 같은 경험을 한다는 내용이에요.","c":"T","s":[[7,"Many people become angry quickly and regret it later.","많은 사람들이 금방 화를 내고 나중에 그것을 후회해요."]]},"h":"b1031a4483"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many people become angry quickly and regret it later.)","ko":"많은 사람들이 금방 화를 내고 나중에 그것을 후회한다. (regret의 뜻은?)","opts":["후회하다","자랑하다","설명하다","기억하다"],"word":"regret","r":{"a":"1) 후회하다","ev":"3번, 7번 문장","w":"3번에서 글쓴이가 화낸 것을 feel bad(후회)한다고 했고, 7번은 많은 사람들도 그렇다는 말이에요. regret = 후회하다.","c":1,"s":[[3,"Now I feel bad for losing my temper.","지금 저는 화를 낸 것을 후회해요."],[7,"Many people become angry quickly and regret it later.","많은 사람들이 금방 화를 내고 나중에 그것을 후회해요."]]},"h":"fb857799f8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...just leave the area and clear your mind.)","ko":"...그냥 그 장소를 떠나서 마음을 clear하는 거예요. (clear의 뜻은?)","opts":["채우다","숨기다","비우다","따라 하다"],"word":"clear","r":{"a":"3) 비우다","ev":"13번 문장","w":"화가 난 마음을 가라앉히는 방법이므로 clear your mind는 '마음을 비우다'예요. 채우거나 숨긴다면 화가 풀리기 어려워요.","c":3,"s":[[13,"The best thing to do is to just leave the area and clear your mind.","당신이 할 수 있는 가장 좋은 것은 그냥 그 장소를 떠나서 마음을 비우는 거예요."]]},"h":"9b9654cd23"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nUsually, it goes back to a normal level after only 90 seconds.","ko":"밑줄 친 it이 가리키는 것은?","sko":"보통, 그것은 단 90초 후면 정상 수준으로 돌아가요.","opts":["당신의 몸","코르티솔(의 수치)","싸움","90초"],"r":{"a":"2) 코르티솔(의 수치)","ev":"8~9번 문장","w":"8번에서 화가 나면 몸이 cortisol을 많이 만들어 낸다고 했어요. 9번의 it은 그 코르티솔이 90초 후면 정상 수준으로 돌아간다는 뜻이에요.","c":2,"s":[[8,"When you get upset, your body produces a greater amount of cortisol, the anger hormone.","화가 났을 때, 당신의 몸은 더 많은 양의 분노 호르몬인 코르티솔을 만들어 내요."],[9,"Usually, it goes back to a normal level after only 90 seconds.","보통, 그것은 단 90초 후면 정상 수준으로 돌아가요."]]},"h":"ec3cd5f9f7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This means the physical reaction to anger doesn’t actually last long.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 분노에 대한 신체 반응이 사실상 오래 지속되지 않는다는 것을 의미해요.","opts":["분노에 대한 신체 반응은 아주 오랫동안 계속된다.","분노에 대한 신체 반응은 실제로는 일어나지 않는다.","분노에 대한 신체 반응은 90분 후에야 시작된다.","분노에 대한 신체 반응은 사실상 오래 가지 않는다."],"r":{"a":"4) 분노에 대한 신체 반응은 사실상 오래 가지 않는다.","ev":"9~10번 문장","w":"doesn’t actually last long은 '사실상 오래 지속되지 않는다'예요. 9번에서 90초면 정상으로 돌아간다고 했으니 짧게 끝난다는 뜻이에요.","c":4,"s":[[9,"Usually, it goes back to a normal level after only 90 seconds.","보통, 그것은 단 90초 후면 정상 수준으로 돌아가요."],[10,"This means the physical reaction to anger doesn’t actually last long.","이것은 분노에 대한 신체 반응이 사실상 오래 지속되지 않는다는 것을 의미해요."]]},"h":"7fbebff18b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["코르티솔은 화가 났을 때 몸이 더 많이 만들어 내는 호르몬이다.","코르티솔은 90분이 지나야 정상 수준으로 돌아간다.","Helper 박사는 글쓴이에게 싸움을 계속 생각하라고 말한다.","글쓴이는 전화기를 던진 것을 자랑스러워한다."],"opts":["Cortisol is a hormone that your body makes more of when you are upset.","Cortisol goes back to a normal level only after 90 minutes.","Dr. Helper tells the writer to keep thinking about the fight.","The writer is proud of throwing the phone."],"r":{"a":"1) Cortisol is a hormone that your body makes more of when you are upset.","ev":"3·8·9·12번 문장","w":"8번에서 화가 나면 코르티솔을 더 많이 만든다고 했어요. 정상으로 돌아오는 시간은 90초(9번), 싸움을 계속 생각하면 수치가 안 내려간다고 했고(12번), 글쓴이는 후회해요(3번).","c":1,"s":[[3,"Now I feel bad for losing my temper.","지금 저는 화를 낸 것을 후회해요."],[8,"When you get upset, your body produces a greater amount of cortisol, the anger hormone.","화가 났을 때, 당신의 몸은 더 많은 양의 분노 호르몬인 코르티솔을 만들어 내요."],[9,"Usually, it goes back to a normal level after only 90 seconds.","보통, 그것은 단 90초 후면 정상 수준으로 돌아가요."],[12,"And your cortisol level won’t go down!","그리고 당신의 코르티솔 수치는 낮아지지 않을 거예요!"]]},"h":"29988e6a06"},{"n":9,"t":"sum","q":"To calm down, the best thing to do is to (A) the area and (B) to 90.","ko":"마음을 가라앉히려면, 가장 좋은 방법은 그 장소를 (A)하고 90까지 (B)하는 것이다.","oko":["(A) 떠나다 / (B) 쓰다","(A) 머물다 / (B) 세다","(A) 떠나다 / (B) 세다","(A) 들어가다 / (B) 소리치다","(A) 머물다 / (B) 소리치다"],"opts":["(A) leave / (B) write","(A) stay in / (B) count","(A) leave / (B) count","(A) enter / (B) shout","(A) stay in / (B) shout"],"r":{"a":"3) (A) leave / (B) count","ev":"13~14번 문장","w":"13번에서 그 장소를 leave(떠나서) 마음을 비우라고 했고, 14번에서 90까지 count(세라)고 했어요.","c":3,"s":[[13,"The best thing to do is to just leave the area and clear your mind.","당신이 할 수 있는 가장 좋은 것은 그냥 그 장소를 떠나서 마음을 비우는 거예요."],[14,"Count to 90 while you do this.","이것을 하는 동안 90까지 세어보세요."]]},"h":"bed4d99072"},{"n":10,"t":"fill","q":"If you keep [A] about the fight, you will keep making yourself [B], and your cortisol level will not go down.","ko":"싸움에 대해 계속 [A]하면, 당신은 계속 스스로를 [B]하게 만들 것이고 코르티솔 수치도 낮아지지 않을 것이다.","bank":["thinking","angry","leaving","counting","quickly","normal"],"bko":{"thinking":"생각하는","angry":"화난","leaving":"떠나는","counting":"세는","quickly":"빠르게","normal":"정상의"},"r":{"a":"[A] thinking, [B] angry","ev":"11~12번 문장","w":"11번에 keep thinking about the fight와 keep making yourself angry가 나와요. 그렇게 하면 코르티솔 수치도 낮아지지 않는다고 12번에서 말해요. 떠나거나 세는 것은 좋은 방법(13~14번)이라 반대 내용이에요.","c":null,"s":[[11,"However, if you keep thinking about the fight, you’ll keep making yourself angry.","하지만, 만약 계속 그 싸움에 대해 생각한다면, 당신은 계속 스스로를 화나게 만들 거예요."],[12,"And your cortisol level won’t go down!","그리고 당신의 코르티솔 수치는 낮아지지 않을 거예요!"]]},"h":"a80a41c5dc"}]},{"u":10,"id":"hk1-10-3","no":3,"ko":"쭉쭉 잡아당겨!","items":[{"n":1,"t":"tf","q":"People in Brazil pull on a birthday person’s ear because they hope the person will live a long life.","ko":"브라질 사람들은 생일을 맞은 사람이 오래 살기를 바라서 그 사람의 귀를 잡아당긴다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번 문장에 they hope you will have a long life라고 나와요. 귀를 잡아당기는 이유가 장수를 바라는 마음이에요.","c":"T","s":[[5,"As they do so, they hope you will have a long life.","그들은 이렇게 하면서, 당신이 오래 살기를 바란다."]]},"h":"e3ffb4f58f"},{"n":2,"t":"tf","q":"Hungarians pull on a birthday person’s ankles.","ko":"헝가리 사람들은 생일을 맞은 사람의 발목을 잡아당긴다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","w":"6번에서 헝가리 사람들이 당기는 곳은 earlobes(귓불)예요. 발목(ankle)은 노래 가사에서 귀가 닿는 곳으로만 나와요.","c":"F","s":[[6,"Hungarians also pull on the birthday person’s earlobes for a similar reason.","헝가리 사람들도 비슷한 이유로 생일을 맞은 사람의 귓불을 잡아당긴다."],[7,"However, they sing a song with lyrics that mean “Live so long that your ears reach your ankles” at the same time.","하지만, 동시에 그들은 “매우 오래 살아서 귀가 발목에 닿게 되어라.”를 의미하는 가사가 있는 노래를 부른다."]]},"h":"b143eb387d"},{"n":3,"t":"tf","q":"Ear-pulling is similar to massage and helps the body relax.","ko":"귀를 잡아당기는 것은 마사지와 비슷하고 몸의 긴장을 푸는 것을 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8~9번 문장","w":"8번에서 마사지와 비슷한 이점이 있다고 했고, 9번에서 몸의 긴장을 푸는 것을 돕는다고 했어요.","c":"T","s":[[8,"Recently, scientists have found that ear-pulling has similar benefits to massage.","최근에, 과학자들은 귀를 잡아당기는 것이 마사지와 비슷한 이점들을 가지는 것을 발견했다."],[9,"It helps to relieve stress and relax the body.","그것은 스트레스를 완화하고 몸의 긴장을 푸는 것을 돕는다."]]},"h":"76da462793"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But in Brazil, people do this to congratulate you.)","ko":"하지만 브라질에서는, 사람들이 당신을 congratulate하기 위해 이것을 한다. (congratulate의 뜻은?)","opts":["위로하다","축하하다","초대하다","놀리다"],"word":"congratulate","r":{"a":"2) 축하하다","ev":"2·3·5번 문장","w":"귀를 잡아당기는 것은 생일을 맞은 사람이 오래 살기를 바라는 좋은 뜻이에요(3·5번). 그래서 congratulate는 '축하하다'예요.","c":2,"s":[[2,"But in Brazil, people do this to congratulate you.","하지만 브라질에서는, 사람들이 당신을 축하하기 위해 이것을 한다."],[3,"They pull on a birthday person’s ear as many times as his or her age.","그들은 생일을 맞은 사람의 귀를 그 또는 그녀의 나이만큼 많이 잡아당긴다."],[5,"As they do so, they hope you will have a long life.","그들은 이렇게 하면서, 당신이 오래 살기를 바란다."]]},"h":"19ed3ac2ad"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...ear-pulling has similar benefits to massage.)","ko":"...귀를 잡아당기는 것은 마사지와 비슷한 benefits를 가진다. (benefits의 뜻은?)","opts":["단점","비용","경기","이점"],"word":"benefits","r":{"a":"4) 이점","ev":"8~9번 문장","w":"9번에서 스트레스를 줄이고 몸의 긴장을 푼다고 했어요. 이런 좋은 점이 benefits(이점)예요.","c":4,"s":[[8,"Recently, scientists have found that ear-pulling has similar benefits to massage.","최근에, 과학자들은 귀를 잡아당기는 것이 마사지와 비슷한 이점들을 가지는 것을 발견했다."],[9,"It helps to relieve stress and relax the body.","그것은 스트레스를 완화하고 몸의 긴장을 푸는 것을 돕는다."]]},"h":"8bc432e56f"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nBut in Brazil, people do this to congratulate you.","ko":"밑줄 친 this가 가리키는 것은?","sko":"하지만 브라질에서는, 사람들이 당신을 축하하기 위해 이것을 한다.","opts":["귀를 잡아당기는 것","생일 노래를 부르는 것","귀걸이를 하는 것","화를 내는 것"],"r":{"a":"1) 귀를 잡아당기는 것","ev":"1~2번 문장","w":"1번에서 누군가 your ear를 pull on하면 화날 수 있다고 했고, 2번의 this가 그 행동을 받아요.","c":1,"s":[[1,"If someone pulls on your ear, you might get upset.","만약 누군가 당신의 귀를 잡아당긴다면, 당신은 화가 날 수도 있다."],[2,"But in Brazil, people do this to congratulate you.","하지만 브라질에서는, 사람들이 당신을 축하하기 위해 이것을 한다."]]},"h":"935590691c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So if you are 14 years old, friends and family will pull on your ears 14 times.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 만약 당신이 14살이라면, 친구들과 가족은 당신의 귀를 14번 잡아당길 것이다.","opts":["14살이 되면 친구들과 가족이 당신의 귀를 한 번만 잡아당긴다.","당신이 14살이면 당신이 가족의 귀를 14번 잡아당긴다.","당신이 14살이면 친구들과 가족이 당신의 귀를 14번 잡아당긴다.","14살이 되면 친구들과 가족이 당신의 발목을 14번 잡아당긴다."],"r":{"a":"3) 당신이 14살이면 친구들과 가족이 당신의 귀를 14번 잡아당긴다.","ev":"3~4번 문장","w":"3번의 규칙(나이만큼)을 14살에 적용한 문장이에요. 당기는 사람은 친구들과 가족, 당기는 곳은 당신의 귀, 횟수는 14번이에요.","c":3,"s":[[3,"They pull on a birthday person’s ear as many times as his or her age.","그들은 생일을 맞은 사람의 귀를 그 또는 그녀의 나이만큼 많이 잡아당긴다."],[4,"So if you are 14 years old, friends and family will pull on your ears 14 times.","그래서 만약 당신이 14살이라면, 친구들과 가족은 당신의 귀를 14번 잡아당길 것이다."]]},"h":"9b05cb0b3a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["브라질 사람들은 생일을 맞은 사람의 귀를 딱 한 번만 잡아당긴다.","헝가리 사람들은 생일을 맞은 사람의 귓불을 잡아당기면서 노래를 부른다.","과학자들은 귀를 잡아당기는 것이 건강에 나쁘다고 말한다.","브라질에서 귀를 잡아당기는 것은 무례한 행동이다."],"opts":["Brazilians pull on a birthday person’s ear only once.","Hungarians sing a song while they pull on a birthday person’s earlobes.","Scientists say ear-pulling is bad for your health.","Pulling on someone’s ear is a rude action in Brazil."],"r":{"a":"2) Hungarians sing a song while they pull on a birthday person’s earlobes.","ev":"2·3·7·10번 문장","w":"7번에서 헝가리 사람들은 귀를 당기면서 동시에 노래를 불러요. 브라질은 나이만큼 여러 번(3번), 건강에는 좋다고 했고(10번), 브라질에서는 축하하는 행동이에요(2번).","c":2,"s":[[2,"But in Brazil, people do this to congratulate you.","하지만 브라질에서는, 사람들이 당신을 축하하기 위해 이것을 한다."],[3,"They pull on a birthday person’s ear as many times as his or her age.","그들은 생일을 맞은 사람의 귀를 그 또는 그녀의 나이만큼 많이 잡아당긴다."],[7,"However, they sing a song with lyrics that mean “Live so long that your ears reach your ankles” at the same time.","하지만, 동시에 그들은 “매우 오래 살아서 귀가 발목에 닿게 되어라.”를 의미하는 가사가 있는 노래를 부른다."],[10,"Therefore, ear-pulling is actually good for your health!","그러므로, 귀를 잡아당기는 것은 실제로 건강에 좋다!"]]},"h":"be298ac120"},{"n":9,"t":"sum","q":"Scientists found that ear-pulling is similar to (A), so it helps to relieve (B) and is good for your health.","ko":"과학자들은 귀를 잡아당기는 것이 (A)와 비슷하다는 것을 발견했고, 그래서 (B)를 완화하는 것을 돕고 건강에 좋다.","oko":["(A) 음악 / (B) 스트레스","(A) 마사지 / (B) 배고픔","(A) 운동 / (B) 감기","(A) 생일 / (B) 발목","(A) 마사지 / (B) 스트레스"],"opts":["(A) music / (B) stress","(A) massage / (B) hunger","(A) exercise / (B) cold","(A) birthdays / (B) ankles","(A) massage / (B) stress"],"r":{"a":"5) (A) massage / (B) stress","ev":"8~10번 문장","w":"8번에서 귀를 당기는 것은 massage와 비슷하다고 했고, 9번에서 stress를 완화하는 것을 돕는다고 했어요. 그래서 10번처럼 건강에 좋아요.","c":5,"s":[[8,"Recently, scientists have found that ear-pulling has similar benefits to massage.","최근에, 과학자들은 귀를 잡아당기는 것이 마사지와 비슷한 이점들을 가지는 것을 발견했다."],[9,"It helps to relieve stress and relax the body.","그것은 스트레스를 완화하고 몸의 긴장을 푸는 것을 돕는다."],[10,"Therefore, ear-pulling is actually good for your health!","그러므로, 귀를 잡아당기는 것은 실제로 건강에 좋다!"]]},"h":"2749a2bc2e"},{"n":10,"t":"fill","q":"In Brazil, people pull on a birthday person’s ear as many times as his or her [A], and they [B] the person will have a long life.","ko":"브라질에서 사람들은 생일을 맞은 사람의 귀를 그 사람의 [A]만큼 여러 번 잡아당기고, 그 사람이 오래 살기를 [B].","bank":["age","hope","sing","ankles","health","massage"],"bko":{"age":"나이","hope":"바라다","sing":"노래하다","ankles":"발목","health":"건강","massage":"마사지"},"r":{"a":"[A] age, [B] hope","ev":"3·5번 문장","w":"3번 문장에 as many times as his or her age가 나와서 [A]는 나이(age)예요. 5번 문장에 they hope you will have a long life가 나와서 [B]는 hope(바라다)예요. 노래하는 것(sing)은 헝가리 사람들 이야기(7번)예요.","c":null,"s":[[3,"They pull on a birthday person’s ear as many times as his or her age.","그들은 생일을 맞은 사람의 귀를 그 또는 그녀의 나이만큼 많이 잡아당긴다."],[5,"As they do so, they hope you will have a long life.","그들은 이렇게 하면서, 당신이 오래 살기를 바란다."]]},"h":"b8cc3196c3"}]},{"u":10,"id":"hk1-10-4","no":4,"ko":"특명! 숨겨진 간식을 찾아라","items":[{"n":1,"t":"tf","q":"Tom noticed that some letters in the note were bold and capital.","ko":"Tom은 쪽지에 있는 글자들 중 일부가 굵고 대문자라는 것을 알아차렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","w":"9번 문장에 he noticed some of the letters in the note were bold and capital이라고 나와요. 그대로 같은 내용이에요.","c":"T","s":[[9,"Then, he noticed some of the letters in the note were bold and capital.","그때, 그는 쪽지에 있는 글자들 중 일부가 굵고 대문자라는 것을 알아차렸다."]]},"h":"17a2105264"},{"n":2,"t":"tf","q":"When Tom arrived at his aunt’s house, Jane was waiting for him.","ko":"Tom이 고모의 집에 도착했을 때, Jane은 그를 기다리고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","w":"3번 문장은 no one was there라고 해요. 집에 아무도 없었다는 말이라 Jane이 기다렸다는 것은 반대예요.","c":"F","s":[[3,"On the first day of vacation, Tom arrived at his aunt’s house, but no one was there.","방학 첫날, Tom은 고모의 집에 도착했지만, 그곳에는 아무도 없었다."]]},"h":"ed719e8e3c"},{"n":3,"t":"tf","q":"Jane always prepares a fun riddle for Tom when he visits.","ko":"Jane은 Tom이 방문할 때 항상 그를 위해 재미있는 수수께끼를 준비한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에 Jane always prepares a fun riddle for Tom when he visits.라고 나와요. 항상 준비한다는 내용과 같아요.","c":"T","s":[[2,"Jane always prepares a fun riddle for Tom when he visits.","Jane은 Tom이 방문할 때 항상 그를 위해 재미있는 수수께끼를 준비한다."]]},"h":"e395577c8b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He looked around but couldn’t see the treats.)","ko":"그는 주위를 둘러보았지만 treats를 볼 수 없었다. (treats의 뜻은?)","opts":["간식","그림","열쇠","쪽지"],"word":"treats","r":{"a":"1) 간식","ev":"5번, 8번 문장","w":"5번에서 Jane이 간식(snacks)을 숨겨 놓았다고 했고, 8번에서 Tom이 그것을 찾지 못했어요. treats는 그 간식이에요.","c":1,"s":[[5,"snacks are hidden, so have Them wHile you wait for mE.","간식들이 숨겨져 있으니, 나를 기다리는 동안 먹으렴."],[8,"He looked around but couldn’t see the treats.","그는 주위를 둘러보았지만 간식을 볼 수 없었다."]]},"h":"c84ff9fdd5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...she saw Tom happily eating chocolate-chip cookies on the bed.)","ko":"...그녀는 Tom이 침대 위에서 happily 초콜릿칩 쿠키를 먹고 있는 것을 보았다. (happily의 뜻은?)","opts":["슬프게","조용히","행복하게","천천히"],"word":"happily","r":{"a":"3) 행복하게","ev":"11번 문장","w":"수수께끼를 풀고 간식을 찾은 Tom이 쿠키를 먹고 있는 장면이에요. 그래서 happily는 '행복하게'예요.","c":3,"s":[[11,"When his aunt came back home, she saw Tom happily eating chocolate-chip cookies on the bed.","그의 고모가 집에 돌아왔을 때, 그녀는 Tom이 침대 위에서 행복하게 초콜릿칩 쿠키를 먹고 있는 것을 보았다."]]},"h":"be230f1b5d"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHe looked at them carefully, and he shouted, “I know where they are!”","ko":"밑줄 친 they가 가리키는 것은?","sko":"그는 그것들을 신중히 쳐다보았고, “그것이 어디에 있는지 알겠어!”라고 소리쳤다.","opts":["쪽지의 글자들","숨겨진 간식들","Jane과 Tom","서랍들"],"r":{"a":"2) 숨겨진 간식들","ev":"5번, 10번 문장","w":"Tom이 알아낸 것은 쪽지의 글자가 아니라 '간식이 어디 있는지'예요. where they are의 they는 5번의 숨겨진 snacks를 말해요.","c":2,"s":[[5,"snacks are hidden, so have Them wHile you wait for mE.","간식들이 숨겨져 있으니, 나를 기다리는 동안 먹으렴."],[10,"He looked at them carefully, and he shouted, “I know where they are!”","그는 그것들을 신중히 쳐다보았고, “그것이 어디에 있는지 알겠어!”라고 소리쳤다."]]},"h":"33946279cb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It was finally summer vacation, and Tom couldn’t wait to visit his aunt Jane.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마침내 여름 방학이 되었고, Tom은 고모 Jane을 정말 방문하고 싶었다.","opts":["Tom은 고모를 방문할 수 없었다.","Tom은 고모를 방문하기 전에 기다려야 했다.","Tom은 고모를 방문하고 싶지 않았다.","Tom은 고모를 방문하는 것이 몹시 기다려졌다."],"r":{"a":"4) Tom은 고모를 방문하는 것이 몹시 기다려졌다.","ev":"1번 문장","w":"couldn’t wait to는 '기다릴 수 없다'가 아니라 '몹시 ~하고 싶다'예요. 그래서 고모를 빨리 방문하고 싶었다는 뜻이에요.","c":4,"s":[[1,"It was finally summer vacation, and Tom couldn’t wait to visit his aunt Jane.","마침내 여름 방학이 되었고, Tom은 고모 Jane을 정말 방문하고 싶었다."]]},"h":"a13c7206c8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Tom은 겨울 방학에 고모 집에 갔다.","Tom이 도착했을 때 고모는 집에 있었다.","Tom은 고모 집에 도착해서 서랍 위의 쪽지를 발견했다.","Tom은 간식을 찾지 못하고 포기했다."],"opts":["Tom went to his aunt’s house in winter.","Tom’s aunt was at home when he arrived.","Tom found a note on the drawer at his aunt’s house.","Tom gave up and did not find the snacks."],"r":{"a":"3) Tom found a note on the drawer at his aunt’s house.","ev":"1·3·4·10·11번 문장","w":"4번에서 서랍 위에서 쪽지를 발견했어요. 여름 방학이었고(1번), 집에는 아무도 없었고(3번), Tom은 수수께끼를 풀고 간식을 찾았어요(10~11번).","c":3,"s":[[1,"It was finally summer vacation, and Tom couldn’t wait to visit his aunt Jane.","마침내 여름 방학이 되었고, Tom은 고모 Jane을 정말 방문하고 싶었다."],[3,"On the first day of vacation, Tom arrived at his aunt’s house, but no one was there.","방학 첫날, Tom은 고모의 집에 도착했지만, 그곳에는 아무도 없었다."],[4,"Instead, he found a note on the drawer: I weNt to the Store to buy some rIce anD Eggs.","대신, 그는 서랍 위에 있는 쪽지를 발견했다. 나는 쌀과 계란을 좀 사기 위해 가게에 갔단다."],[10,"He looked at them carefully, and he shouted, “I know where they are!”","그는 그것들을 신중히 쳐다보았고, “그것이 어디에 있는지 알겠어!”라고 소리쳤다."],[11,"When his aunt came back home, she saw Tom happily eating chocolate-chip cookies on the bed.","그의 고모가 집에 돌아왔을 때, 그녀는 Tom이 침대 위에서 행복하게 초콜릿칩 쿠키를 먹고 있는 것을 보았다."]]},"h":"ae9384dcd4"},{"n":9,"t":"sum","q":"Tom noticed that some letters in the note were (A) and capital, so he could find the (B) snacks.","ko"
