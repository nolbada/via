mart Shopper";var PASS_EN=["Be a Smart Shopper","Do you think you are a smart shopper? Well, you may think you are, but hold on! There are various marketing strategies which influence your decisions. Learning about them will make you a smarter shopper.","Hunger Marketing","Junho: What? The sale ends in two hours? If I don't buy the sneakers now, I will have to buy them at a higher price.","Stop, Junho! You're buying the sneakers just because you don't want to miss the sale. You're falling for a hunger marketing strategy.","If people can buy a product only for a limited time, they often feel \"hungry\" for it and want to buy it. About missing the sale, don't worry, Junho. You'll soon see a similar sale again.","Viral Marketing","Yuna: That's the hottest dress on social media now. Lots of people are wearing it. I have to get that dress, too!","Wait, Yuna! You only want the dress because you saw it again and again on social media. It isn't just you. There are a lot of people who fall for a viral marketing strategy. Why?","Information about a product can spread quickly and widely on the Internet, just like a \"virus.\" If a product becomes hot on social media, people naturally want to have it. Yuna, just remember that a popular product isn't always right for you."];var PASS_KO=["현명한 구매자가 되세요","여러분은 자신이 현명한 구매자라고 생각하나요? 글쎄요, 여러분은 그렇다고 생각할 수도 있지만, 잠깐만요! 여러분의 결정에 영향을 미치는 다양한 마케팅 전략들이 있어요. 그것들에 대해 배우는 것이 여러분을 더 현명한 구매자로 만들 거예요.","헝거 마케팅","준호: 뭐라고? 세일이 두 시간 후에 끝난다고? 지금 운동화를 사지 않으면, 더 비싼 가격에 그것을 사야 할 거야.","멈춰, 준호야! 너는 단지 세일을 놓치고 싶지 않아서 운동화를 사고 있는 거야. 너는 헝거 마케팅 전략에 속고 있어.","만약 사람들이 한정된 시간 동안만 제품을 살 수 있다면, 그들은 종종 그 제품에 대해 '배고프다'고 느끼고 그것을 사고 싶어 해. 세일을 놓치는 것에 대해서는 걱정하지 마, 준호야. 너는 곧 비슷한 세일을 다시 보게 될 거야.","바이럴 마케팅","유나: 저건 지금 소셜 미디어에서 가장 인기 있는 원피스야. 많은 사람들이 이것을 입고 있어. 나도 저 원피스를 사야 해!","잠깐, 유나야! 너는 소셜 미디어에서 그 원피스를 계속 봤기 때문에 그것을 원하는 것뿐이야. 너뿐만이 아니야. 바이럴 마케팅 전략에 속는 사람들이 많아. 왜냐고?","제품에 대한 정보는 '바이러스'처럼 인터넷에서 빠르게 널리 퍼질 수 있어. 만약 어떤 제품이 소셜 미디어에서 인기를 끌게 되면, 사람들은 자연스럽게 그것을 갖고 싶어 해. 유나야, 인기 있는 제품이 항상 너에게 적합한 것은 아니라는 것을 기억하렴."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["소년은 휴대폰 케이스를 찾고 있다.","소년은 파란색을 별로 좋아하지 않는다.","점원은 노란색 케이스를 추천한다.","소년은 노란색 케이스를 사기로 한다.","소년은 파란색 케이스를 사기로 한다."],"a":4,"ans":"소년은 파란색 케이스를 사기로 한다.","evs":[["B: I don't really like blue. Can you show me something else?","저는 파란색은 별로 좋아하지 않아요. 다른 것을 보여 주시겠어요?"],["B: Oh, that will do. I'll take it.","아, 그거면 되겠네요. 그걸로 할게요."]],"ev":["B: I don't really like blue. Can you show me something else?","저는 파란색은 별로 좋아하지 않아요. 다른 것을 보여 주시겠어요?"],"ow":["오답 ✕ — 소년이 'I'm looking for a phone case.'(휴대폰 케이스를 찾고 있어요.)라고 했으므로 일치한다. 불일치를 고르는 문제라 정답이 아님.","오답 ✕ — 소년이 'I don't really like blue.'(저는 파란색은 별로 좋아하지 않아요.)라고 했으므로 일치한다. 그래서 정답이 아님.","오답 ✕ — 점원이 'Then, how about this yellow case?'(그럼 이 노란색 케이스는 어떠세요?)라고 했으므로 일치한다. 그래서 정답이 아님.","오답 ✕ — 소년이 노란색 케이스를 보고 'that will do. I'll take it.'(그거면 되겠네요. 그걸로 할게요.)라고 했으므로 일치한다. 그래서 정답이 아님.","정답 ○ — 소년은 'I don't really like blue.'(파란색은 별로 좋아하지 않아요.)라고 했고 노란색 케이스를 사기로 했으므로, 파란색을 사기로 했다는 보기는 일치하지 않음."],"memo":["정답 ⑤: 소년은 파란색이 아니라 노란색 케이스를 사기로 했다(불일치 보기).","근거: Oh, that will do. I'll take it.(그거면 되겠네요. 그걸로 할게요.) — 노란색 케이스를 보고 한 말","함정: 소년은 파란색을 좋아하지 않는다고 했다. 색을 바꾼 ⑤만 ✕"],"why":"소년은 파란색 대신 점원이 추천한 노란색 케이스를 사기로 한다."}],"dlg":[["B","Hi. I'm looking for a phone case.","안녕하세요. 휴대폰 케이스를 찾고 있어요."],["W","We have a few different colors here. How do you like this case?","여기에 몇 가지 다른 색이 있어요. 이 케이스는 어떠세요?"],["B","I don't really like blue. Can you show me something else?","저는 파란색은 별로 좋아하지 않아요. 다른 것을 보여 주시겠어요?"],["W","Then, how about this yellow case?","그럼 이 노란색 케이스는 어떠세요?"],["B","Oh, that will do. I'll take it.","아, 그거면 되겠네요. 그걸로 할게요."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하는 것은?","o":["소년은 점원에게 다른 맛의 과자를 보여 달라고 부탁한다.","점원은 먼저 과자를 먹어 보라고 권한다.","과자 한 상자는 18,000원이다.","소년은 가격이 비싸서 과자를 사지 않는다.","소년은 과자가 맛이 없다고 말한다."],"a":1,"ans":"점원은 먼저 과자를 먹어 보라고 권한다.","evs":[["W: Oh, we have many different kinds. Here, try one of these.","아, 여러 종류가 있어요. 자, 이 중에서 하나 드셔 보세요."],["W: We're having a sale, so this box is 8,000 won.","세일 중이라 이 상자는 8,000원이에요."]],"ev":["W: Oh, we have many different kinds. Here, try one of these.","아, 여러 종류가 있어요. 자, 이 중에서 하나 드셔 보세요."],"ow":["오답 ✕ — 소년이 다른 것을 보여 달라고 한 말은 지문에 없다. 소년은 'It's sweet and delicious.'(달고 맛있네요.)라고 만족했다.","정답 ○ — 점원이 'Here, try one of these.'(자, 이 중에서 하나 드셔 보세요.)라고 권했으므로 일치함.","오답 ✕ — 점원은 'this box is 8,000 won'(이 상자는 8,000원이에요)이라고 했는데, 이 보기는 18,000원이라고 해서 틀림.","오답 ✕ — 소년은 'OK, I'll take it.'(좋아요, 그걸로 할게요.)라고 했으므로 과자를 산다. 그래서 틀림.","오답 ✕ — 소년은 'It's sweet and delicious.'(달고 맛있네요.)라고 했는데, 이 보기는 맛이 없다고 해서 틀림."],"memo":["정답 ②: 점원은 먼저 과자를 먹어 보라고 권한다.","근거: Here, try one of these.(자, 이 중에서 하나 드셔 보세요.)","함정: 가격은 8,000원이다(③ ✕). 소년은 맛있다고 하고 구매한다(④⑤ ✕)"],"why":"점원이 시식을 권하고, 소년은 맛있다며 세일 가격 8,000원에 산다."}],"dlg":[["B","I'm looking for traditional Korean cookies.","한국 전통 과자를 찾고 있어요."],["W","Oh, we have many different kinds. Here, try one of these.","아, 여러 종류가 있어요. 자, 이 중에서 하나 드셔 보세요."],["B","It's sweet and delicious. How much are they?","달고 맛있네요. 얼마인가요?"],["W","We're having a sale, so this box is 8,000 won.","세일 중이라 이 상자는 8,000원이에요."],["B","OK, I'll take it.","좋아요, 그걸로 할게요."]]},{"qs":[{"n":3,"q":"위 대화의 주제로 알맞은 것은?","o":["asking for a refund","finding a souvenir shop","trying on traditional Korean clothes","introducing traditional Korean items","buying a traditional Korean souvenir"],"a":4,"ans":"buying a traditional Korean souvenir","evs":[["G: Yes. I'm looking for a traditional Korean souvenir. It's for my dad.","네. 한국 전통 기념품을 찾고 있어요. 아빠께 드릴 거예요."],["G: That's perfect! I'll get two hats, then.","아주 좋아요! 그럼 모자 두 개를 살게요."]],"ev":["G: Yes. I'm looking for a traditional Korean souvenir. It's for my dad.","네. 한국 전통 기념품을 찾고 있어요. 아빠께 드릴 거예요."],"ow":["오답 ✕ — 환불을 요청하는 말은 지문에 없다. 소녀가 'I'll get two hats, then.'(그럼 모자 두 개를 살게요.)라고 물건을 사기로 했으므로 틀림.","오답 ✕ — 소녀는 이미 가게에 와서 점원과 이야기하고 있다. 가게를 찾는 이야기가 아니라서 틀림.","오답 ✕ — 옷을 입어 보는 장면은 지문에 없다. 가장 가까운 문장은 'This is a gat, a traditional Korean hat for men.'(이것은 갓이라고 하는 남성용 한국 전통 모자예요.)인데, 소개일 뿐 입어 보지는 않는다.","오답 ✕ — 점원이 부채와 갓을 소개하긴 하지만, 소개가 대화의 목적은 아니다. 소녀가 사려고 'I'm looking for a traditional Korean souvenir.'(한국 전통 기념품을 찾고 있어요.)라고 했고 결국 구입하므로 틀림.","정답 ○ — 소녀는 'I'm looking for a traditional Korean souvenir.'(한국 전통 기념품을 찾고 있어요.)라고 하고, 할인을 받아 'I'll get two hats, then.'(그럼 모자 두 개를 살게요.)라고 하므로 주제는 한국 전통 기념품 사기임."],"memo":["정답 ⑤: buying a traditional Korean souvenir","근거: I'm looking for a traditional Korean souvenir. / I'll get two hats, then.(한국 전통 기념품을 찾고 있어요. / 그럼 모자 두 개를 살게요.)","함정: 갓 소개는 구매 과정의 일부일 뿐. ④는 ✕"],"why":"소녀가 전통 기념품을 찾아 갓을 할인받아 사는 대화이다."},{"n":4,"q":"위 대화를 읽고 답할 수 없는 질문은?","o":["Where is the conversation taking place?","What is the girl looking for?","Why is a fan popular?","What is a gat?","How many gats will the girl buy?"],"a":2,"ans":"Why is a fan popular?","evs":[["M: How about this fan? It is really popular.","이 부채는 어떠세요? 정말 인기가 많아요."],["M: How about this hat, then? This is a gat, a traditional Korean hat for men.","그럼 이 모자는 어떠세요? 이것은 갓이라고 하는 남성용 한국 전통 모자예요."],["G: That's perfect! I'll get two hats, then.","아주 좋아요! 그럼 모자 두 개를 살게요."]],"ev":["M: How about this fan? It is really popular.","이 부채는 어떠세요? 정말 인기가 많아요."],"ow":["오답 ✕ — 점원이 'Hi, can I help you?'(안녕하세요, 도와드릴까요?)라고 하고 소녀가 기념품을 찾고 있다고 하므로, 가게에서 손님과 점원이 하는 대화임을 알 수 있다. 그래서 답할 수 있는 질문임.","오답 ✕ — 소녀가 'I'm looking for a traditional Korean souvenir.'(한국 전통 기념품을 찾고 있어요.)라고 했으므로 답할 수 있다.","정답 ○ — 점원은 'It is really popular.'(정말 인기가 많아요.)라고만 했고 부채가 왜 인기인지 이유는 지문에 없으므로 답할 수 없는 질문임.","오답 ✕ — 'This is a gat, a traditional Korean hat for men.'(이것은 갓이라고 하는 남성용 한국 전통 모자예요.)라고 설명했으므로 답할 수 있다.","오답 ✕ — 소녀가 'I'll get two hats, then.'(그럼 모자 두 개를 살게요.)라고 했으므로 두 개라고 답할 수 있다."],"memo":["정답 ③: 부채가 왜 인기가 있는지는 알 수 없다.","근거: It is really popular.(정말 인기가 많아요.) — 이유는 나오지 않음","함정: '인기 있다'는 사실과 '왜 인기인지'는 다르다. ③만 답할 수 없음"],"why":"부채가 인기 있다는 말은 있지만 그 이유는 대화에 나오지 않는다."}],"dlg":[["M","Hi, can I help you?","안녕하세요, 도와드릴까요?"],["G","Yes. I'm looking for a traditional Korean souvenir. It's for my dad.","네. 한국 전통 기념품을 찾고 있어요. 아빠께 드릴 거예요."],["M","How about this fan? It is really popular.","이 부채는 어떠세요? 정말 인기가 많아요."],["G","Hmm ... can you show me something else?","음... 다른 것을 보여 주시겠어요?"],["M","How about this hat, then? This is a gat, a traditional Korean hat for men.","그럼 이 모자는 어떠세요? 이것은 갓이라고 하는 남성용 한국 전통 모자예요."],["G","Oh, it's unique. I love it. How much is it?","아, 독특하네요. 정말 마음에 들어요. 얼마예요?"],["M","It's 30,000 won.","30,000원이에요."],["G","That's a little expensive.","조금 비싸네요."],["M","We can give you a discount if you buy two. It'll be 25,000 won each.","두 개를 사시면 할인해 드릴 수 있어요. 하나에 25,000원이 될 거예요."],["G","That's perfect! I'll get two hats, then.","아주 좋아요! 그럼 모자 두 개를 살게요."]]},{"qs":[{"n":5,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["소년은 여동생을 위한 선물을 찾고 있다.","여자는 처음에 작은 가방을 추천한다.","소년은 크기가 다른 가방을 보길 원한다.","여자는 머리핀을 추천한다.","소년은 머리핀 두 개를 사기로 한다."],"a":2,"ans":"소년은 크기가 다른 가방을 보길 원한다.","evs":[["W: How about this small bag?","이 작은 가방은 어떠세요?"],["B: Well, can you show me something else?","음, 다른 것을 보여 주시겠어요?"],["B: Oh, they're so pretty! I'll take two of them.","아, 정말 예쁘네요! 두 개 살게요."]],"ev":["W: How about this small bag?","이 작은 가방은 어떠세요?"],"ow":["오답 ✕ — 소년이 'I'm looking for a gift for my younger sister.'(여동생에게 줄 선물을 찾고 있어요.)라고 했으므로 일치한다. 불일치를 고르는 문제라 정답이 아님.","오답 ✕ — 점원이 처음에 'How about this small bag?'(이 작은 가방은 어떠세요?)라고 추천했으므로 일치한다. 그래서 정답이 아님.","정답 ○ — 소년은 'can you show me something else?'(다른 것을 보여 주시겠어요?)라고 했다. 크기가 다른 가방이 아니라 가방이 아닌 다른 물건을 원한 것이므로 일치하지 않음.","오답 ✕ — 소년이 가방이 마음에 들지 않자 점원이 'How about these hairpins, then?'(그럼 이 머리핀들은 어떠세요?)라고 추천했으므로 일치한다. 그래서 정답이 아님.","오답 ✕ — 소년이 'I'll take two of them.'(두 개 살게요.)라고 했으므로 머리핀 두 개를 사기로 한 것은 일치한다. 그래서 정답이 아님."],"memo":["정답 ③: 소년은 크기가 다른 가방이 아니라 다른 물건을 보고 싶어 한다(불일치 보기).","근거: can you show me something else?(다른 것을 보여 주시겠어요?)","함정: something else는 '다른 크기'가 아니라 '다른 물건'이다. ③만 ✕"],"why":"소년은 작은 가방 대신 다른 물건을 원했고, 머리핀 두 개를 사기로 한다."}],"dlg":[["B","Hi, I'm looking for a gift for my younger sister. She's twelve.","안녕하세요, 여동생에게 줄 선물을 찾고 있어요. 열두 살이에요."],["W","How about this small bag?","이 작은 가방은 어떠세요?"],["B","Well, can you show me something else?","음, 다른 것을 보여 주시겠어요?"],["W","How about these hairpins, then?","그럼 이 머리핀들은 어떠세요?"],["B","Oh, they're so pretty! I'll take two of them.","아, 정말 예쁘네요! 두 개 살게요."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["마케팅 전략은 구매 결정에 영향을 주지 않는다.","마케팅 전략은 한 가지뿐이다.","글쓴이는 독자가 이미 현명한 구매자라고 확신한다.","마케팅 전략을 배우면 더 현명한 구매자가 될 수 있다.","현명한 구매자라면 마케팅 전략을 알 필요가 없다."],"a":3,"ans":"마케팅 전략을 배우면 더 현명한 구매자가 될 수 있다.","evs":[["Learning about them will make you a smarter shopper.","그것들에 대해 배우는 것이 여러분을 더 현명한 구매자로 만들 거예요."],["There are various marketing strategies which influence your decisions.","여러분의 결정에 영향을 미치는 다양한 마케팅 전략들이 있어요."]],"ev":["Learning about them will make you a smarter shopper.","그것들에 대해 배우는 것이 여러분을 더 현명한 구매자로 만들 거예요."],"ow":["오답 ✕ — 'There are various marketing strategies which influence your decisions.'(여러분의 결정에 영향을 미치는 다양한 마케팅 전략들이 있어요.)라고 했는데, 이 보기는 영향을 주지 않는다고 해서 틀림.","오답 ✕ — 같은 문장에서 'various marketing strategies'(다양한 마케팅 전략들)라고 했는데, 이 보기는 한 가지뿐이라고 해서 틀림.","오답 ✕ — 글쓴이는 'you may think you are, but hold on!'(그렇다고 생각할 수도 있지만, 잠깐만요!)이라며 독자의 생각에 의문을 던지므로, 이미 현명하다고 확신한다는 보기는 틀림.","정답 ○ — 'Learning about them will make you a smarter shopper.'(그것들에 대해 배우는 것이 여러분을 더 현명한 구매자로 만들 거예요.)와 일치함.","오답 ✕ — 오히려 마케팅 전략을 배워야 더 현명한 구매자가 된다고 했다. 알 필요가 없다는 보기는 틀림."],"memo":["정답 ④: 마케팅 전략을 배우면 더 현명한 구매자가 된다.","근거: Learning about them will make you a smarter shopper.(그것들에 대해 배우는 것이 여러분을 더 현명한 구매자로 만들 거예요.)","함정: 마케팅 전략은 한 가지가 아니라 various(다양한)하다. ②는 ✕"],"why":"다양한 마케팅 전략을 배우면 더 현명한 구매자가 된다는 내용이다."}],"pp":[["Do you think you are a smart shopper?","여러분은 자신이 현명한 구매자라고 생각하나요?"],["Well, you may think you are, but hold on!","글쎄요, 여러분은 그렇다고 생각할 수도 있지만, 잠깐만요!"],["There are various marketing strategies which influence your decisions.","여러분의 결정에 영향을 미치는 다양한 마케팅 전략들이 있어요."],["Learning about them will make you a smarter shopper.","그것들에 대해 배우는 것이 여러분을 더 현명한 구매자로 만들 거예요."]]},{"qs":[{"n":7,"q":"윗글의 제목으로 알맞은 것은?","o":["Sale Period: Hurry Up and Buy!","The Birth of Hunger Marketing","Be Careful of Hunger Marketing","The Benefits of Hunger Marketing","Why Do People Fall for Hunger Marketing?"],"a":2,"ans":"Be Careful of Hunger Marketing","evs":[["You're falling for a hunger marketing strategy.","너는 헝거 마케팅 전략에 속고 있어."],["If people can buy a product only for a limited time, they often feel \"hungry\" for it and want to buy it.","만약 사람들이 한정된 시간 동안만 제품을 살 수 있다면, 그들은 종종 그 제품에 대해 '배고프다'고 느끼고 그것을 사고 싶어 해."],["You'll soon see a similar sale again.","너는 곧 비슷한 세일을 다시 보게 될 거야."]],"ev":["You're falling for a hunger marketing strategy.","너는 헝거 마케팅 전략에 속고 있어."],"ow":["오답 ✕ — 'Stop, Junho!'(멈춰, 준호야!)는 서두르지 말라는 말인데, 이 제목은 서둘러 사라는 뜻이라 반대이다.","오답 ✕ — 헝거 마케팅이 어떻게 처음 생겼는지는 지문에 없다. 지문은 마케팅의 유래가 아니라 그 전략에 속지 말라는 내용이라 틀림.","정답 ○ — 친구가 'You're falling for a hunger marketing strategy.'(너는 헝거 마케팅 전략에 속고 있어.)라며 말리고, 'You'll soon see a similar sale again.'(곧 비슷한 세일을 다시 보게 될 거야.)이라고 달래므로 조심하라는 제목이 알맞음.","오답 ✕ — 지문은 헝거 마케팅의 장점이 아니라 그 전략에 속아 충동적으로 사는 문제를 지적한다. 'You're buying the sneakers just because you don't want to miss the sale.'(너는 단지 세일을 놓치고 싶지 않아서 운동화를 사고 있는 거야.)가 그 근거이다.","오답 ✕ — 'they often feel \"hungry\" for it'(그 제품에 대해 '배고프다'고 느끼고)처럼 이유가 조금 설명되지만, 글의 중심은 '속지 말고 조심하라'는 충고이다. 원인 설명만으로는 제목이 되기에 좁아서 틀림."],"memo":["정답 ③: Be Careful of Hunger Marketing","근거: You're falling for a hunger marketing strategy.(너는 헝거 마케팅 전략에 속고 있어.)","함정: 글은 사라고 부추기는 글(①)이 아니라 말리는 글이다. ①④는 ✕"],"why":"한정된 기간 세일에 속아 서두르지 말고 헝거 마케팅을 조심하라는 내용이다."},{"n":8,"q":"Junho가 운동화를 지금 사려고 하는 이유로 알맞은 것은?","o":["운동화가 너무 낡아서","세일이 두 시간 후에 끝나서 놓치고 싶지 않아서","친구가 운동화를 사 달라고 부탁해서","새 학기가 곧 시작되어서","소셜 미디어에서 인기가 있어서"],"a":1,"ans":"세일이 두 시간 후에 끝나서 놓치고 싶지 않아서","evs":[["The sale ends in two hours?","세일이 두 시간 후에 끝난다고?"],["You're buying the sneakers just because you don't want to miss the sale.","너는 단지 세일을 놓치고 싶지 않아서 운동화를 사고 있는 거야."]],"ev":["The sale ends in two hours?","세일이 두 시간 후에 끝난다고?"],"ow":["오답 ✕ — 운동화가 낡았다는 말은 지문에 없다. 친구는 'just because you don't want to miss the sale'(단지 세일을 놓치고 싶지 않아서)라고 이유를 말한다.","정답 ○ — 'The sale ends in two hours?'(세일이 두 시간 후에 끝난다고?)에 놀란 준호는 'If I don't buy the sneakers now, I will have to buy them at a higher price.'(지금 사지 않으면 더 비싼 가격에 사야 할 거야.)라고 했고, 친구는 세일을 놓치기 싫어서라고 지적하므로 맞음.","오답 ✕ — 친구는 오히려 'Stop, Junho!'(멈춰, 준호야!)라며 말리고 있다. 사 달라고 부탁했다는 말은 지문에 없음.","오답 ✕ — 새 학기에 대한 언급은 지문에 없다. 이유는 세일이 곧 끝나기 때문이다.","오답 ✕ — 소셜 미디어에서 인기라는 이유는 뒤에 나오는 바이럴 마케팅(유나의 원피스) 이야기이다. 준호의 이유는 한정된 시간의 세일이라서 틀림."],"memo":["정답 ②: 세일이 두 시간 후에 끝나서 놓치고 싶지 않아서","근거: You're buying the sneakers just because you don't want to miss the sale.(너는 단지 세일을 놓치고 싶지 않아서 운동화를 사고 있는 거야.)","함정: 소셜 미디어 인기는 유나(바이럴 마케팅) 이야기. ⑤는 ✕"],"why":"준호는 세일이 곧 끝난다는 말에 놓치기 싫어서 운동화를 사려 한다."}],"pp":[["Hunger Marketing","헝거 마케팅"],["Junho: What?","준호: 뭐라고?"],["The sale ends in two hours?","세일이 두 시간 후에 끝난다고?"],["If I don't buy the sneakers now, I will have to buy them at a higher price.","지금 운동화를 사지 않으면, 더 비싼 가격에 그것을 사야 할 거야."],["Stop, Junho!","멈춰, 준호야!"],["You're buying the sneakers just because you don't want to miss the sale.","너는 단지 세일을 놓치고 싶지 않아서 운동화를 사고 있는 거야."],["You're falling for a hunger marketing strategy.","너는 헝거 마케팅 전략에 속고 있어."],["If people can buy a product only for a limited time, they often feel \"hungry\" for it and want to buy it.","만약 사람들이 한정된 시간 동안만 제품을 살 수 있다면, 그들은 종종 그 제품에 대해 '배고프다'고 느끼고 그것을 사고 싶어 해."],["About missing the sale, don't worry, Junho.","세일을 놓치는 것에 대해서는 걱정하지 마, 준호야."],["You'll soon see a similar sale again.","너는 곧 비슷한 세일을 다시 보게 될 거야."]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하지 않는 것은?","o":["유나가 사고 싶은 원피스는 많은 사람들이 입고 있는 것이다.","유나는 단지 소셜 미디어에서 그 원피스를 반복해서 봤기 때문에 구매하고 싶은 것이다.","바이럴 마케팅 전략에 속는 사람들은 많지 않지만, 유나는 그 전략에 속고 있다.","사람들은 소셜 미디어에서 인기를 끄는 제품을 갖고 싶어 한다.","인기 있는 제품이 항상 모두에게 적합한 것은 아니다."],"a":2,"ans":"바이럴 마케팅 전략에 속는 사람들은 많지 않지만, 유나는 그 전략에 속고 있다.","evs":[["Yuna: That's the hottest dress on social media now.","저건 지금 소셜 미디어에서 가장 인기 있는 원피스야."],["You only want the dress because you saw it again and again on social media.","너는 소셜 미디어에서 그 원피스를 계속 봤기 때문에 그것을 원하는 것뿐이야."],["The
