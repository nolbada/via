/ (B) speeds up","(A) hair / (B) stops"],"r":{"a":"3) (A) hormones / (B) stops","ev":"4~6번 문장","s":[[4,"Before babies are born, they have high levels of hormones from their mother’s body.","아기는 태어나기 전에 엄마의 몸으로부터 높은 수치의 호르몬을 갖는다."],[5,"These hormones can cause hair growth.","이 호르몬이 머리카락의 성장을 초래한다."],[6,"After birth, the hormone levels drop and hair growth stops.","출생 후, 호르몬 수치는 떨어지고 머리카락의 성장은 멈춘다."]],"w":"4번 태어나기 전 호르몬(hormones) 수치가 높고, 6번 출생 후 수치가 떨어지며 머리카락의 성장이 멈춘다(stops)고 해요.","c":3},"h":"ffd73d88e3"},{"n":10,"t":"fill","q":"Their son was born with thick, [A], black hair, but it fell out and [B] blond hair grew in its place.","ko":"그들의 아들은 굵은 [A] 검은 머리카락을 가지고 태어났지만, 그것은 빠졌고 [B] 금발 머리카락이 그 자리에 자랐다.","bank":["straight","curly","wavy","thin","blond","old"],"bko":{"straight":"곧은","curly":"곱슬곱슬한","wavy":"구불구불한","thin":"가는","blond":"금발의","old":"오래된"},"r":{"a":"[A] straight, [B] curly","ev":"11, 13번 문장","s":[[11,"But their son was born with thick, straight, black hair.","그런데 그들의 아들은 굵은 직모의 검은 머리카락을 가지고 태어났다."],[13,"But it soon fell out, and curly blond hair grew in its place.","하지만 그것은 곧 빠졌고 곱슬곱슬한 금발 머리카락이 그 자리에 자라났다."]],"w":"11번 thick, straight, black hair, 13번 curly blond hair grew in its place에서 가져왔어요. wavy와 thin은 부모의 머리카락(10번)을 설명하는 말이에요. blond는 [A] 자리에서 black과 맞지 않고, old는 [B] 자리에서 새로 자란 머리카락과 맞지 않아요.","c":null},"h":"48f463d2e8"}]},{"u":10,"id":"nl1-10-4","no":4,"ko":"특별한 채소","items":[{"n":1,"t":"tf","q":"In the movie, Mark Watney grows potatoes to survive on Mars.","ko":"영화에서 Mark Watney는 화성에서 살아남기 위해 감자를 재배한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"To survive, he grows potatoes.","생존하기 위해, 그는 감자를 재배한다."]],"w":"2번 문장에서 살아남기 위해(To survive) 그는 감자를 재배한다고 해요.","c":"T"},"h":"af5a8f4ef9"},{"n":2,"t":"tf","q":"Michael Mautner went to Mars to get Martian vegetables.","ko":"Michael Mautner는 화성 채소를 얻으려고 화성에 갔다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"He says he has Martian vegetables, but he never went to Mars.","그는 자신이 화성의 채소를 가지고 있다고 하는데, 그는 결코 화성에 간 적이 없다."]],"w":"5번 문장에서 그는 화성 채소를 가지고 있다고 하지만 화성에 간 적이 없다(he never went to Mars)고 해요.","c":"F"},"h":"327efcf84d"},{"n":3,"t":"tf","q":"Mautner found two rocks that fell to Earth from Mars.","ko":"Mautner는 화성에서 지구로 떨어진 암석 두 개를 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"A few years ago, he found two rocks that fell to Earth from Mars thousands of years ago.","몇 년 전에 그는 수천 년 전 화성에서 지구로 떨어진 암석 두 개를 발견했다."]],"w":"8번 문장 그대로예요. 수천 년 전에 화성에서 지구로 떨어진 암석 두 개를 발견했어요.","c":"T"},"h":"51f6265b90"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (To survive, he grows potatoes.)","ko":"생존하기 위해, 그는 감자를 재배한다. (survive는 생존하다)","opts":["도망치다","사냥하다","살아남다","여행하다"],"word":"survive","r":{"a":"3) 살아남다","ev":"1~2번 문장","s":[[1,"In the movie The Martian, astronaut Mark Watney is left alone on Mars after a big storm.","영화 ‘마션’에서 우주 비행사 Mark Watney(마크 와트니)는 거대한 폭풍이 몰아친 이후 화성에 홀로 남게 된다."],[2,"To survive, he grows potatoes.","생존하기 위해, 그는 감자를 재배한다."]],"w":"화성에 혼자 남은 사람이 감자를 키우는 이유예요. 살아남기 위해서라서 survive = 살아남다(생존하다)예요.","c":3},"h":"8f987ae22a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then he planted and gave water to tiny bits of asparagus and potato plants.)","ko":"그런 다음 아스파라거스와 감자 묘목의 작은 조각들을 심고 물을 주었다. (tiny는 아주 작은)","opts":["거대한","낡은","아주 무거운","아주 작은"],"word":"tiny","r":{"a":"4) 아주 작은","ev":"10번 문장","s":[[10,"Then he planted and gave water to tiny bits of asparagus and potato plants.","그런 다음 아스파라거스와 감자 묘목의 작은 조각들을 심고 물을 주었다."]],"w":"bits(조각)와 함께 쓰여 아주 작은 조각이라는 뜻이에요. tiny = 아주 작은.","c":4},"h":"a8e3c5a29b"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nHe grew them in Martian soil here on Earth.","ko":"밑줄 친 them가 가리키는 것은?","sko":"그는 이곳 지구에서 화성의 흙에 그것을 재배했다.","opts":["화성 채소","암석 두 개","우주 비행사들","감자 영화"],"r":{"a":"1) 화성 채소","ev":"5, 7번 문장","s":[[5,"He says he has Martian vegetables, but he never went to Mars.","그는 자신이 화성의 채소를 가지고 있다고 하는데, 그는 결코 화성에 간 적이 없다."],[7,"He grew them in Martian soil here on Earth.","그는 이곳 지구에서 화성의 흙에 그것을 재배했다."]],"w":"지구에서 화성의 흙에 키운 것은 5번에서 말한 화성 채소(Martian vegetables)예요. 6번 질문의 답이 7번이에요.","c":1},"h":"851c127447"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the future, people living on Mars could grow their own food there.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"미래에는 화성에 사는 사람들이 거기서 자신들의 식량을 재배할 수 있을 거예요.","opts":["미래에는 사람들이 화성으로 식량을 보낼 것이다.","미래에는 화성에 사는 사람들이 직접 식량을 키울 수 있을 것이다.","미래에는 화성의 식량이 모두 없어질 것이다.","미래에는 사람들이 지구에서 식량을 사 올 것이다."],"r":{"a":"2) 미래에는 화성에 사는 사람들이 직접 식량을 키울 수 있을 것이다.","ev":"13번 문장","s":[[13,"“In the future, people living on Mars could grow their own food there.”","“미래에는 화성에 사는 사람들이 거기서 자신들의 식량을 재배할 수 있을 거예요.”"]],"w":"people living on Mars는 화성에 사는 사람들, grow their own food는 자기들의 식량을 직접 재배하다라는 뜻이에요.","c":2},"h":"d12aa3ca2e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["식물들은 몇 주 후에 죽었다.","감자는 화성에서 가져온 것이다.","Mautner는 화성에 씨앗을 심었다.","식물들은 몇 주 만에 몇 센티미터 자랐다."],"opts":["The plants died after a few weeks.","The potatoes were brought from Mars.","Mautner planted the seeds on Mars.","The plants grew several centimeters in a few weeks."],"r":{"a":"4) The plants grew several centimeters in a few weeks.","ev":"11번 문장","s":[[11,"In a few weeks, the plants had grown several centimeters high.","몇 주 후에 그 식물들은 몇 센티미터가 자랐다."]],"w":"11번 문장에서 몇 주 후 식물들이 몇 센티미터 자랐다고 해요. 식물은 지구에서 키웠어요(7번).","c":4},"h":"20201ecfab"},{"n":9,"t":"sum","q":"Mautner grew vegetables on (A) in soil taken from rocks that came from (B).","ko":"Mautner는 (B)에서 온 암석의 흙을 가져와 (A)에서 채소를 재배했다.","oko":["(A) 화성 / (B) 지구","(A) 지구 / (B) 화성","(A) 화성 / (B) 화성","(A) 지구 / (B) 지구","(A) 달 / (B) 화성"],"opts":["(A) Mars / (B) Earth","(A) Earth / (B) Mars","(A) Mars / (B) Mars","(A) Earth / (B) Earth","(A) the Moon / (B) Mars"],"r":{"a":"2) (A) Earth / (B) Mars","ev":"7~9번 문장","s":[[7,"He grew them in Martian soil here on Earth.","그는 이곳 지구에서 화성의 흙에 그것을 재배했다."],[8,"A few years ago, he found two rocks that fell to Earth from Mars thousands of years ago.","몇 년 전에 그는 수천 년 전 화성에서 지구로 떨어진 암석 두 개를 발견했다."],[9,"He took soil from the rocks.","그는 그 암석에서 흙을 채취했다."]],"w":"7번에서 지구(Earth)에서 재배했고, 8~9번에서 화성(Mars)에서 지구로 떨어진 암석의 흙을 사용했어요.","c":2},"h":"1894772556"},{"n":10,"t":"fill","q":"Mautner said that in the future people living on [A] could [B] their own food there.","ko":"Mautner는 미래에 [A]에 사는 사람들이 거기서 자신들의 식량을 [B] 수 있을 거라고 말했다.","bank":["Mars","grow","storm","fall","rocks","survive"],"bko":{"Mars":"화성","grow":"재배하다","rocks":"암석","storm":"폭풍","fall":"떨어지다","survive":"살아남다"},"r":{"a":"[A] Mars, [B] grow","ev":"13번 문장","s":[[13,"“In the future, people living on Mars could grow their own food there.”","“미래에는 화성에 사는 사람들이 거기서 자신들의 식량을 재배할 수 있을 거예요.”"]],"w":"13번 people living on Mars could grow their own food there에서 가져왔어요. rocks(암석)는 사는 곳도, 식량에 하는 일도 아니에요. fall, survive, storm은 두 빈칸 어디에도 뜻이 맞지 않아요.","c":null},"h":"c9363efd4e"}]}];

async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
