// 공통 데이터 도우미. 각 챕터 파일이 BEGIN → A(...) 순서로 항목을 넣는다.
const ITEMS=[],CHAPS={},UN={};let CURCH=0;
function BEGIN(ch,name,units){CURCH=ch;CHAPS[ch]={name:name,units:Object.keys(units)};Object.keys(units).forEach(k=>{UN[ch+"-"+k]=Object.assign({ch:ch,k:k},units[k])})}
function A(u,sec,n,kind,o){const it=Object.assign({ch:CURCH,u:String(u),sec:sec,n:n,kind:kind},o);it.uk=CURCH+"-"+it.u;it.id=it.uk+"."+sec+"."+n;ITEMS.push(it)}
const mk=a=>a.map((x,i)=>"①②③④⑤⑥⑦"[i]+" "+x);
function SECLAB(it){const s=it.sec;if(s=="CU")return"개념 우선 확인 · "+it.n+"번";if(s=="MP")return"30초 완성 · "+it.n+"번";if(/^[ABC]$/.test(s))return s+" · "+it.n+"번";if(s=="SW")return"서술형 대비 · "+it.n+"번";if(s=="PT")return"출제 포인트 · "+it.n+"번";if(s=="T")return"실전 TEST · "+it.n+"번";return s+" · "+it.n+"번"}
function SECSHORT(it){const s=it.sec;if(s=="CU")return"개념"+it.n;if(s=="MP")return"30초"+it.n;if(/^[ABC]$/.test(s))return s+"-"+it.n;if(s=="SW")return"서술"+it.n;if(s=="PT")return"포인트"+it.n;if(s=="T")return"실전"+it.n;return s+"-"+it.n}

 pen:"~ ago = 과거시제 (현재완료 X)"});
A(3,"A",2,"c",{q:"We have ( knew / known ) each other for a long time.",opts:["knew","known"],ans:"known",full:"We have known each other for a long time.",ko:"우리는 오랫동안 서로 알고 지냈다.",
 h:["본책 p.16 ‘3 현재완료의 형태’의 「have / has + p.p.」를 펴세요.","1) have 다음에는 과거분사형(p.p.)이 와야 해요.  2) know(알다)의 과거형은 knew, 과거분사형은 따로 있어요.","know에 -n이 붙은 모양이에요. k로 시작하고 n으로 끝나요."],

A(3,"A",4,"c",{q:"I ( met / have met ) Daniel at the soccer stadium in 2017.",opts:["met","have met"],ans:"met",full:"I met Daniel at the soccer stadium in 2017.",ko:"나는 2017년에 축구 경기장에서 Daniel을 만났다.",
 h:["본책 p.16 ‘2 과거시제 vs. 현재완료’ 표를 펴세요.","1) in 2017(2017년에)은 특정한 과거 시점이에요.  2) 특정 과거 시점이 있으면 과거시제를 써요.","have가 없는 짧은 쪽이에요. 원형 meet(만나다)의 과거형이에요."],

A(3,"A",5,"c",{q:"When ( did you go / have you gone ) to Jeju-do?",opts:["did you go","have you gone"],ans:"did you go",full:"When did you go to Jeju-do?",ko:"너는 언제 제주도에 갔니?",

A(3,"B",1,"w",{q:"Jake <u>has won</u> the lottery last month.",ans:"won",full:"Jake won the lottery last month.",ko:"Jake는 지난달에 복권에 당첨되었다.",
 h:["본책 p.16 ‘2 과거시제 vs. 현재완료’ 표를 펴세요.","1) last month(지난달)는 특정 과거 시점이에요.  2) 이런 때에는 현재완료를 못 쓰고 과거형을 써요.","win(이기다, 당첨되다)의 과거형이에요. w로 시작하는 짧은 말이에요."],
 pen:"last month = 과거시제 (has won X)"});
A(3,"B",2,"w",{q:"Alex <u>used</u> this iPad for three years. He is still using it.",ans:"has used",full:"Alex has used this iPad for three years. He is still using it.",ko:"Alex는 이 아이패드를 3년 동안 써 왔다. 그는 아직도 그것을 쓰고 있다.",
 h:["본책 p.16 ‘1 현재완료의 의미’ 설명(과거부터 현재까지)을 펴세요.","1) for three years(3년 동안)가 있고, 뒤 문장에 아직도 쓰고 있다고 해요.  2) 과거에 시작해서 지금까지 이어지니 과거형이 아니라 현재완료예요.","have(has) + p.p.예요. 주어 Alex에 맞게 h로 시작하는 말을 써요."],
 pen:"과거부터 지금까지 계속 = has + p.p."});
A(3,"B",3,"w",{q:"I <u>ate</u> hamburgers with my friends yesterday.<br>(옳으면 ○ 표시)",ans:"○ (고칠 곳 없음)",full:"I ate hamburgers with my friends yesterday. (옳은 문장)",ko:"나는 어제 친구들과 햄버거를 먹었다.",
 h:["본책 p.16 ‘2 과거시제 vs. 현재완료’ 표의 왼쪽(과거시제) 설명을 펴세요.","1) yesterday(어제)는 특정 과거 시점이에요.  2) ate는 원형 eat(먹다)의 과거형이에요. 과거 시점에는 과거형을 쓰는 게 맞아요.","이 문장은 이미 바른 문장이에요. 고치지 말고 ○만 표시해요."],

A(3,"B",4,"w",{q:"<u>Did</u> you ever played chess?",ans:"Have",full:"Have you ever played chess?",ko:"너는 체스를 둬 본 적이 있니?",
 h:["본책 p.16 ‘3 현재완료의 형태’의 의문문 「Have / Has + 주어 + p.p. ~?」를 펴세요.","1) ever(지금까지)가 있고 played(원형 play 하다)는 과거분사형이에요.  2) 경험을 묻는 현재완료 의문문은 Have / Has로 시작해요.","Did 자리에 현재완료 의문문의 첫 단어가 와야 해요. 대문자 H로 시작하는 네 글자예요."],
 pen:"현재완료 의문문 = Have/Has + 주어 + p.p. ~?"});
A(3,"B",5,"w",{q:"She <u>never has eaten</u> Thai food before.",ans:"has never eaten",full:"She has never eaten Thai food before.",ko:"그녀는 전에 태국 음식을 먹어 본 적이 없다.",
 h:["본책 p.16 ‘3 현재완료의 형태’의 부정문 「have / has + not 〔never〕 + p.p.」를 펴세요.","1) never(한 번도 ~않은)의 자리를 보세요.  2) 현재완료에서 never는 have/has와 p.p. 사이에 와요.","순서는 has - never - 과거분사형이에요. h로 시작해요."],
 pen:"have/has + never + p.p. (never는 가운데)"});
A(3,"C",1,"w",{q:"나는 지난 주말에 그 박물관을 방문했다. (visit)<br>→ I ___ the museum last weekend.",ans:"visited",full:"I visited the museum last weekend.",ko:"나는 지난 주말에 그 박물관을 방문했다.",
 h:["본책 p.16 ‘2 과거시제 vs. 현재완료’ 표를 펴세요.","1) last weekend(지난 주말)는 특정 과거 시점이에요.  2) 과거 시점에는 과거시제를 써요. visit(방문하다)에 -ed를 붙여요.","v로 시작하고 -ed로 끝나는 한 단어예요."],
 pen:"last ~ = 과거시제 (visit + ed)"});
A(3,"C",2,"w",{q:"그 작가는 3년 동안 그 소설을 써 왔다. (write)<br>→ The author ___ the novel for three years.",ans:"has written",full:"The author has written the novel for three years.",ko:"그 작가는 3년 동안 그 소설을 써 왔다.",

A(3,"C",3,"w",{q:"그녀는 어제 이후로 나에게 전화하지 않고 있다. (call)<br>→ She ___ me since yesterday.",ans:"has not called",full:"She has not called me since yesterday.",ko:"그녀는 어제 이후로 나에게 전화하지 않고 있다.",

A(3,"MP",1,"w",{q:"형태: 긍정문: ___ + p.p. / 부정문: have / has + ___ + p.p. / 의문문: ___ + 주어 + p.p. ~?<br>(빈칸 세 개를 차례로 쓰세요)",ans:"have / has, not 〔never〕, Have / Has",full:"긍정문: have / has + p.p. / 부정문: have / has + not 〔never〕 + p.p. / 의문문: Have / Has + 주어 + p.p. ~?",ko:"현재완료의 긍정문은 have / has + p.p., 부정문은 have / has + not(never) + p.p., 의문문은 Have / Has + 주어 + p.p. ~? 이다.",
 h:["본책 p.16 ‘3 현재완료의 형태’ 표(긍정문, 부정문, 의문문)를 펴세요.","1) 긍정문은 평소 문장처럼 have나 has로 시작해요.  2) 부정문은 ‘아니다, 한 번도 ~않다’를 뜻하는 말이 가운데에 들어가요. 의문문은 맨 앞을 대문자로 써요.","빈칸 세 개: have나 has / n으로 시작하는 말 / 대문자 H로 시작하는 말"],
 pen:"긍정 have/has + p.p. / 부정 have/has + not(never) + p.p. / 의문 Have/Has + 주어 + p.p. ~?"});
A(3,"MP",2,"w",{q:"과거 vs. 현재완료: I ( played / have played ) tennis last Friday.<br>I ( played / have played ) tennis for an hour. I’m still playing it.<br>(알맞은 말 두 개를 차례로 쓰세요)",ans:"played, have played",full:"I played tennis last Friday. / I have played tennis for an hour. I’m still playing it.",ko:"나는 지난 금요일에 테니스를 쳤다. / 나는 한 시간 동안 테니스를 쳐 왔다. 나는 아직도 치고 있다.",
 h:["본책 p.16 ‘2 과거시제 vs. 현재완료’ 표를 펴세요.","1) last Friday(지난 금요일)는 특정 과거 시점이에요.  2) for an hour(한 시간 동안)에 아직도 치는 중이니 현재까지 이어져요.","첫째는 have가 없는 과거형, 둘째는 have가 붙은 현재완료예요."],

A(4,"CU",1,"c",{q:"I have learned Chinese for two years.",opts:["2년 전에 중국어를 배웠다","2년 동안 중국어를 배워 왔다"],ans:"2년 동안 중국어를 배워 왔다",full:"I have learned Chinese for two years. = 2년 동안 중국어를 배워 왔다.",ko:"나는 2년 동안 중국어를 배워 왔다.",

A(4,"CU",2,"c",{q:"She has lost her ring.",opts:["반지를 잃어버려서 지금 없다","반지를 잃어버렸다가 찾았다"],ans:"반지를 잃어버려서 지금 없다",full:"She has lost her ring. = 반지를 잃어버려서 지금 없다.",ko:"그녀는 반지를 잃어버려서 지금 없다.",

A(4,"A",1,"c",{q:"밑줄 친 현재완료의 쓰임에 체크(V) 표시하시오. (계속 / 경험 / 완료 / 결과)<br>The little girl <u>has just stopped</u> crying.",opts:["계속","경험","완료","결과"],ans:"완료",full:"The little girl has just stopped crying. (완료)",ko:"그 어린 소녀는 방금 울음을 그쳤다.",

 pen:"just / already / yet = 완료 (막 ~했다)"});
A(4,"A",2,"c",{q:"밑줄 친 현재완료의 쓰임에 체크(V) 표시하시오. (계속 / 경험 / 완료 / 결과)<br>I <u>have never been</u> late for school.",opts:["계속","경험","완료","결과"],ans:"경험",full:"I have never been late for school. (경험)",ko:"나는 학교에 지각한 적이 한 번도 없다.",
 h:["본책 p.18 ‘2 경험: ~한 적이 있다’ 설명을 펴세요.","1) never(한 번도 ~않은)가 쓰였어요.  2) ever, never, once, before는 경험 용법과 자주 같이 써요.","‘~한 적이 (없다)’를 말하는 쪽이에요. 첫 글자는 ‘경’이에요."],

A(4,"A",3,"c",{q:"밑줄 친 현재완료의 쓰임에 체크(V) 표시하시오. (계속 / 경험 / 완료 / 결과)<br>We <u>have been</u> friends since elementary school.",opts:["계속","경험","완료","결과"],ans:"계속",full:"We have been friends since elementary school. (계속)",ko:"우리는 초등학교 때부터 친구로 지내 왔다.",
 h:["본책 p.18 ‘1 계속: 계속 ~해 왔다’ 설명을 펴세요.","1) since elementary school(초등학교 때부터)은 시작한 때를 말해요.  2) since나 for가 있으면 과거부터 지금까지 이어지는 계속 용법이에요.","‘~해 왔다’ 쪽이에요. 첫 글자는 ‘계’예요."],
 pen:"since / for = 계속 (~해 왔다)"});
A(4,"A",4,"c",{q:"밑줄 친 현재완료의 쓰임에 체크(V) 표시하시오. (계속 / 경험 / 완료 / 결과)<br>Mina <u>has moved</u> to another city.",opts:["계속","경험","완료","결과"],ans:"결과",full:"Mina has moved to another city. (결과)",ko:"Mina는 다른 도시로 이사 가서 지금 여기에 없다.",
 h:["본책 p.18 ‘4 결과: ~했다 (그 결과 현재 …하다)’ 설명을 펴세요.","1) has moved(원형 move 이사하다)는 이사 간 일이에요.  2) 이사 간 결과 지금은 다른 도시에 살고 있어요.","just 같은 말도, since 같은 말도, never 같은 말도 없어요. 지금 상태가 달라진 쪽이에요. 첫 글자는 ‘결’이에요."],
 pen:"과거에 한 일의 결과가 지금 남음 = 결과 (gone, lost, moved)"});
A(4,"B",1,"c",{q:"She has taught math ( for / since ) five years.",opts:["for","since"],ans:"for",full:"She has taught math for five years.",ko:"그녀는 5년 동안 수학을 가르쳐 왔다.",
 h:["본책 p.18 ‘1 계속’ 아래 ‘for 다음에는 기간…, since 다음에는 시점…’ 상자를 펴세요.","1) five years(5년)는 기간인가요, 시점인가요?  2) 기간 앞에는 for(~ 동안)를 써요.","since(~부터)가 아닌 쪽이에요. f로 시작해요."],

A(4,"B",2,"c",{q:"He hasn’t finished the work ( already / yet ).",opts:["already","yet"],ans:"yet",full:"He hasn’t finished the work yet.",ko:"그는 아직 그 일을 끝내지 못했다.",
 h:["본책 p.18 ‘3 완료: 막 ~했다’의 yet 설명(yet은 주로 문장 끝에 쓴다)을 펴세요.","1) hasn’t는 has not의 줄임말로 부정문이에요.  2) 부정문에서 ‘아직’은 yet이고, 문장 끝에 와요.","already(이미)는 긍정문에서 써요. 그러니 y로 시작하는 쪽이에요."],

A(4,"B",3,"c",{q:"Amy has ( been / gone ) to Hawaii once.",opts:["been","gone"],ans:"been",full:"Amy has been to Hawaii once.",ko:"Amy는 하와이에 한 번 가 본 적이 있다.",
 h:["본책 p.18 아래 ‘비교 have been to vs. have gone to’ 상자를 펴세요.","1) once(한 번)는 경험을 말할 때 자주 써요.  2) have been to는 ‘가 본 적이 있다’(경험), have gone to는 ‘가 버렸다’(결과)예요.","‘가 본 적이 있다’ 쪽이에요. b로 시작해요."],
 pen:"have been to = 가 본 적 있다 (경험) / have gone to = 가 버렸다 (결과)"});
A(4,"C",1,"w",{q:"<보기> I had a toothache yesterday. I still have it. → I have had a toothache since yesterday.<br>My dad went to New York. He is not here now.<br>→ My dad ___ to New York.",ans:"has gone",full:"My dad has gone to New York.",ko:"우리 아빠는 뉴욕에 가 버렸다. (그래서 지금 여기에 없다.)",
 h:["본책 p.18 아래 ‘비교 have been to vs. have gone to’ 상자를 펴세요.","1) ‘뉴욕에 갔다. 지금 여기에 없다’는 현재 상황이 이어져요.  2) 가서 지금 없는 것은 결과 용법이에요. 주어 My dad는 3인칭 단수예요.","두 단어예요. has + go(가다)의 과거분사형이에요. g로 시작해요."],

A(4,"C",2,"w",{q:"<보기> I had a toothache yesterday. I still have it. → I have had a toothache since yesterday.<br>Jacob started to work for the company three years ago. He still works there.<br>→ Jacob ___ for the company for three years.",ans:"has worked",full:"Jacob has worked for the company for three years.",ko:"Jacob은 3년 동안 그 회사에서 일해 왔다.",
 h:["본책 p.18 ‘1 계속: 계속 ~해 왔다’ 설명을 펴세요.","1) three years ago에 시작해서 still works there(아직도 거기서 일한다)예요.  2) 과거부터 지금까지 이어지니 현재완료예요. 주어 Jacob은 3인칭 단수예요.","두 단어예요. has + work(일하다)의 과거분사형이에요. h로 시작해요."],
 pen:"과거에 시작해서 지금도 계속 = has + p.p. (계속)"});
A(4,"C",3,"w",{q:"<보기> I had a toothache yesterday. I still have it. → I have had a toothache since yesterday.<br>I watched the movie two months ago. I watched the movie again yesterday.<br>→ I ___ the movie twice.",ans:"have watched",full:"I have watched the movie twice.",ko:"나는 그 영화를 두 번 봤다.",
 h:["본책 p.18 ‘2 경험: ~한 적이 있다’ 설명을 펴세요.","1) 두 문장을 합치면 ‘두 번 봤다’는 횟수가 돼요.  2) 지금까지의 횟수를 말하는 것은 경험 용법의 현재완료예요. 주어는 I예요.","두 단어예요. have + watch(보다)의 과거분사형이에요. h로 시작해요."],
 pen:"횟수(twice, three times) = 경험 → have + p.p."});
A(4,"MP",1,"w",{q:"계속: It has snowed ___ an hour.",ans:"for",full:"It has snowed for an hour.",ko:"한 시간 동안 눈이 왔다.",
 h:["본책 p.18 ‘1 계속’ 아래의 ‘for 다음에는 기간, since 다음에는 시점’ 상자를 펴세요.","1) an hour(한 시간)는 기간이에요.  2) 기간 앞에는 ‘~ 동안’을 뜻하는 전치사를 써요.","f로 시작하는 세 글자 짧은 말이에요."],
 pen:"for + 기간 (계속)"});
A(4,"MP",2,"w",{q:"경험: I have never seen a penguin. 나는 펭귄을 ___.",ans:"본 적이 없다",full:"I have never seen a penguin. = 나는 펭귄을 본 적이 없다.",ko:"나는 펭귄을 본 적이 없다.",
 h:["본책 p.18 ‘2 경험: ~한 적이 있다’ 설명을 펴세요.","1) have never seen(원형 see 보다)은 ‘한 번도 본 적이 없다’는 뜻이에요.  2) never가 있는 현재완료는 경험을 나타내요.","‘~한 적이 없다’로 끝나요. ‘본’으로 시작하는 말이에요."],
 pen:"have never + p.p. = ~한 적이 없다 (경험)"});
A(4,"MP",3,"w",{q:"완료: He ___ already ___ the news. 그는 이미 그 소식을 들었다.<br>(빈칸 두 개를 차례로 쓰세요)",ans:"has, heard",full:"He has already heard the news.",ko:"그는 이미 그 소식을 들었다.",
 h:["본책 p.18 ‘3 완료: 막 ~했다’ 설명(just와 already는 have와 과거분사 사이)을 펴세요.","1) already(이미)는 have/has와 과거분사 사이에 와요.  2) 주어 He는 3인칭 단수이니 has를 써요. hear(듣다)의 과거분사형이 필요해요.","첫째 빈칸은 h로 시작하는 세 글자, 둘째는 hear(듣다)의 과거분사형인데 과거형과 모양이 같아요."],
 pen:"has + already + p.p. (already는 가운데)"});
A(4,"MP",4,"w",{q:"결과: She has gone to London. 그녀는 ___.<br>cf. She ___ ___ to London. 그녀는 런던에 가 본 적이 있다.<br>(빈칸을 차례로 쓰세요)",ans:"런던으로 가 버렸다, has been",full:"She has gone to London. = 그녀는 런던으로 가 버렸다. / She has been to London. = 그녀는 런던에 가 본 적이 있다.",ko:"그녀는 런던으로 가 버렸다. / 그녀는 런던에 가 본 적이 있다.",
 h:["본책 p.18 아래 ‘비교 have been to vs. have gone to’ 상자를 펴세요.","1) have gone to(원형 go 가다)는 ‘가 버렸다’, 즉 지금 여기 없다는 뜻이에요.  2) have been to(원형 be 이다)는 ‘가 본 적이 있다’는 경험이에요.","한글 빈칸은 ‘~(으)로 가 버렸다’ 모양이에요. 영어 빈칸은 경험을 나타내는 ‘have(has) + be의 과거분사형’이에요."],
 pen:"have gone to = 가 버렸다 / have been to = 가 본 적 있다"});

A("SW","SW",1,"w",{q:"[빈칸 완성] 괄호 안의 말을 이용하여 빈칸 완성하기<br>Steve는 항상 검정색 재킷을 입는다. (wear)<br>Steve always ___ a black jacket.",ans:"wears",full:"Steve always wears a black jacket.",ko:"Steve는 항상 검정색 재킷을 입는다.",
 h:["본책 p.12 ‘1 현재시제’ 맨 위의 빈도부사(always, usually 등) 설명을 펴세요.","1) always(항상)는 습관이에요.  2) 주어 Steve는 3인칭 단수이니 wear(입다)에 s를 붙여요.","w로 시작하고 s로 끝나는 한 단어예요."],
 pen:"always = 습관 → 현재시제 (3인칭 단수 + s)"});
A("SW","SW",2,"w",{q:"[빈칸 완성] 그 빵집은 다음 주에 개업할 예정이다. (open)<br>The bakery ___ ___ ___ ___ next week.",ans:"is going to open",full:"The bakery is going to open next week.",ko:"그 빵집은 다음 주에 개업할 예정이다.",
 h:["본책 p.12 ‘3 미래시제’의 「be going to + 동사원형」을 펴세요.","1) next week(다음 주)는 앞으로 올 때예요.  2) 빈칸이 네 개예요. 앞으로의 계획·예정은 be going to + 동사원형으로 쓰고, 마지막 칸에 open(열다)이 들어가요.","주어 The bakery는 단수이니 be동사는 i로 시작해요. 그다음 going, to 순서예요."],
 pen:"계획·예정 = be going to + 동사원형"});
A("SW","SW",3,"w",{q:"[빈칸 완성] 그 학생들은 학교 버스를 기다리는 중이었다. (wait)<br>The students ___ ___ for the school bus.",ans:"were waiting",full:"The students were waiting for the school bus.",ko:"그 학생들은 학교 버스를 기다리는 중이었다.",
 h:["본책 p.14 ‘2 과거진행형: was / were + 동사원형-ing’를 펴세요.","1) ‘기다리는 중이었다’는 과거에 하는 중이던 일이에요.  2) 주어 The students는 복수이니 were를 써요. wait(기다리다)에 -ing를 붙여요.","빈칸 두 개: w로 시작하는 be동사 / w로 시작하고 -ing로 끝나는 말"],
 pen:"복수 주어 + were + 동사원형-ing = ~하는 중이었다"});
A("SW","SW",4,"w",{q:"[빈칸 완성] 그녀는 전에 유럽에 가 본 적이 없다. (be, never)<br>She ___ ___ ___ to Europe before.",ans:"has never been",full:"She has never been to Europe before.",ko:"그녀는 전에 유럽에 가 본 적이 없다.",
 h:["본책 p.18 아래 ‘비교 have been to vs. have gone to’ 상자와 ‘2 경험’ 설명을 펴세요.","1) ‘가 본 적이 없다’는 경험이에요. before(전에)도 경험과 자주 써요.  2) 현재완료 부정문에서 never는 have/has와 p.p. 사이에 와요. be(이다)의 과거분사형이 필요해요.","세 단어예요. has - never - b로 시작하는 말 순서예요."],
 pen:"has never been to = 가 본 적이 없다 (경험)"});
A("SW","SW",5,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br>We <u>didn’t see</u> Ben since Monday.<br>→ We ___ Ben since Monday.",ans:"haven’t seen 또는 have not seen",full:"We haven’t seen Ben since Monday.",ko:"우리는 월요일 이후로 Ben을 보지 못했다.",
 h:["본책 p.16 ‘3 현재완료의 형태’의 부정문과 p.18 ‘1 계속’의 since 설명을 펴세요.","1) since Monday(월요일부터)는 월요일부터 지금까지 이어지는 시간이에요.  2) 그러면 didn’t(과거 부정)가 아니라 현재완료 부정문이에요. see(보다)의 과거분사형을 써요.","두 단어예요. have의 부정 줄임말(또는 have not) + see(보다)의 과거분사형이에요. 과거형 saw가 아니에요."],
 pen:"since + 시점 = 현재완료 (didn’t see X → haven’t seen)"});
A("SW","SW",6,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br>James <u>is sleeping</u> when I entered his room.<br>→ James ___ when I entered his room.",ans:"was sleeping",full:"James was sleeping when I entered his room.",ko:"내가 James의 방에 들어갔을 때 그는 자고 있었다.",
 h:["본책 p.14 ‘2 과거진행형: was / were + 동사원형-ing’를 펴세요.","1) when I entered(내가 들어갔을 때)는 과거예요. entered는 원형 enter(들어가다)의 과거형이에요.  2) 그 시점에 하는 중이던 일이니 be동사도 과거형이어야 해요.","is를 과거형으로 고치면 돼요. 첫 단어는 w로 시작해요."],
 pen:"과거 시점에 진행 중 = was + 동사원형-ing"});
A("SW","SW",7,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br>Lucy <u>is having</u> blue eyes.<br>→ Lucy ___ blue eyes.",ans:"has",full:"Lucy has blue eyes.",ko:"Lucy는 파란 눈을 가지고 있다.",
 h:["본책 p.14 ‘3 진행형으로 쓸 수 없는 동사’의 소유 동사(have, belong 등)를 펴세요.","1) 눈 색깔을 가지고 있는 것은 ‘소유’예요.  2) 소유는 상태이니 진행형으로 쓰지 않아요. 주어 Lucy는 3인칭 단수예요.","is having을 한 단어로 줄여요. h로 시작하는 세 글자예요."],
 pen:"소유의 have = 상태 → is having (X) → has"});
A("SW","SW",8,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br>When <u>have you taken</u> these photos?<br>→ When ___ these photos?",ans:"did you take",full:"When did you take these photos?",ko:"너는 이 사진들을 언제 찍었니?",
 h:["본책 p.16 ‘2 과거시제 vs. 현재완료’ 아래의 When did you make dinner? 예문을 펴세요.","1) When(언제)으로 묻는 질문은 지난 한 시점을 물어요.  2) when은 현재완료와 함께 쓸 수 없어요. take(찍다)의 형태도 바뀌어요.","세 단어예요. d로 시작하는 말 + you + take의 원형이에요."],
 pen:"When ~? = 과거시제 (When have you ~? X)"});
A("SW","SW",9,"w",{q:"[배열 영작] 괄호 안의 말을 바르게 배열하기<br>내 남동생은 내년에 중학생이 될 것이다. (be, next year, a middle school student, will)<br>My brother ___ .",ans:"will be a middle school student next year",full:"My brother will be a middle school student next year.",ko:"내 남동생은 내년에 중학생이 될 것이다.",
 h:["본책 p.12 ‘3 미래시제’ 설명(will + 동사원형)을 펴세요.","1) next year(내년)는 앞일이에요.  2) 주어 다음에 will을 놓고 그 뒤에 be(이다, 되다)의 원형을 써요. ‘중학생이’ 다음에 때를 나타내는 말이 와요.","조동사 will 바로 뒤에는 동사원형이 와요. 시간 표현 next year는 문장 맨 끝에 둬요."],
 pen:"주어 + will + be + 보어 + 시간 표현"});
A("SW","SW",10,"w",{q:"[배열 영작] 괄호 안의 말을 바르게 배열하기<br>두통이 얼마 동안 있었나요? (you, a headache, have, had)<br>How long ___ ?",ans:"have you had a headache",full:"How long have you had a headache?",ko:"두통이 얼마 동안 있었나요?",
 h:["본책 p.16 ‘3 현재완료의 형태’의 의문문 「Have / Has + 주어 + p.p. ~?」를 펴세요.","1) How long(얼마나 오래)은 기간을 묻는 말이에요.  2) 현재완료 의문문은 How long 다음에 have + 주어 + 과거분사 순서로 써요. had는 원형 have(가지다)의 과거분사형이에요.","How long 바로 뒤에 have가 오고, 주어와 had가 이어진 다음 목적어로 끝나요."],
 pen:"How long + have + 주어 + p.p. ~? (기간을 묻는 현재완료)"});
A("SW","SW",11,"w",{q:"[배열 영작] 괄호 안의 말을 바르게 배열하기<br>그는 그의 부모님께 편지를 써 본 적이 없다. (a letter, never, has, written)<br>He ___ to his parents.",ans:"has never written a letter",full:"He has never written a letter to his parents.",ko:"그는 그의 부모님께 편지를 써 본 적이 없다.",
 h:["본책 p.16 ‘3 현재완료의 형태’의 부정문과 p.18 ‘2 경험’ 설명을 펴세요.","1) ‘써 본 적이 없다’는 경험의 현재완료예요.  2) 순서는 has + never + 과거분사 + 목적어예요. never는 has와 p.p. 사이에 와요.","has로 시작하고 목적어 a letter(편지)로 끝나요. never의 자리만 잘 잡으면 돼요."],
 pen:"has + never + p.p. + 목적어 (경험의 부정)"});
A("SW","SW",12,"w",{q:"[배열 영작] 괄호 안의 말을 바르게 배열하기<br>나는 지금 Jenny를 만나러 공항에 가는 중이다. (the airport, going, to, am)<br>I ___ to meet Jenny now.",ans:"am going to the airport",full:"I am going to the airport to meet Jenny now.",ko:"나는 지금 Jenny를 만나러 공항에 가는 중이다.",
 h:["본책 p.14 맨 아래 ‘be going to 구분하기’ 상자를 펴세요.","1) ‘가는 중이다’는 현재진행형이에요.  2) going 뒤에 to the airport(공항으로)처럼 장소가 오면 ‘가는 중’이고, 문장 뒤의 to meet(만나러)은 목적이에요.","am going 다음에 ‘~로’를 뜻하는 to와 장소를 이어 써요."],
 pen:"am going + to + 장소 = 가는 중 (현재진행형)"});

{ const o=mk(["He is going to the park now.","It’s going to be warm this week.","We will have a music festival.","The bus leaves in 5 minutes.","She is coming back this Friday."]);

 h:["본책 p.16 ‘2 과거시제 vs. 현재완료’ 아래 ‘특정 과거 시점을 나타내는 표현과 함께 쓸 수 없다’ 부분을 펴세요.","1) 현재완료(have/has + p.p.) 문장마다 시간 표현이 있는지 보세요.  2) last year, yesterday, when 같은 과거 시점은 현재완료와 같이 쓸 수 없어요.","already, never, 의문문 Have you ~는 모두 괜찮아요. 시점을 나타내는 말이 있는 보기가 틀렸어요."],
 pen:"현재완료 + last year (X) → 과거시제"}); }
{ const o=mk(["It has snowed ___ two hours.","She has taught English ___ 2008.","I have lived here ___ seven years.","He has been in the hospital ___ a week.","We have been friends ___ a long time."]);
A("T","T",11,"c",{q:"(출제 포인트 3) 빈칸에 들어갈 말이 나머지와 다른 것은?<br>① It has snowed ___ two hours.<br>② She has taught English ___ 2008.<br>③ I have lived here ___ seven years.<br>④ He has been in the hospital ___ a week.<br>⑤ We have been friends ___ a long time.",opts:o,ans:o[1],full:"② She has taught English since 2008. (나머지는 for)",ko:"② 그녀는 2008년부터 영어를 가르쳐 왔다. (since) 나머지는 ‘~ 동안’이라 for가 들어간다.",
 h:["본책 p.18 ‘1 계속’ 아래 ‘for 다음에는 기간…, since 다음에는 시점…’ 상자를 펴세요.","1) 빈칸 뒤 말이 기간(two hours, seven years, a week, a long time)인지 시점인지 하나씩 보세요.  2) 기간이면 for, 시점이면 since예요.","네 개는 기간이에요. 시점(연도)을 쓴 보기가 하나 있어요. 두 번째 보기예요."],
 pen:"for + 기간 / since + 시점(연도 등)"}); }
A("T","T",12,"w",{q:"(고난도) 어법상 옳은 문장을 모두 고르면?<br>① They are coming next week.<br>② The man is having five cars.<br>③ I’ve lost my wallet yesterday.<br>④ She was having lunch at that time.<br>⑤ When have you visited London?",ans:"①, ④",full:"① They are coming next week. / ④ She was having lunch at that time.",ko:"① 그들은 다음 주에 온다. ④ 그녀는 그때 점심을 먹고 있었다.",
 h:["본책 p.14 ‘1 현재진행형’ 아래의 ‘가까운 미래의 계획’ 설명과 ‘3 진행형으로 쓸 수 없는 동사’의 cf. 상자, p.16 ‘2 과거시제 vs. 현재완료’를 펴세요.","1) 소유의 have(가지다)는 진행형 X, 먹다의 have는 진행형 O예요.  2) 현재완료는 yesterday나 when과 함께 쓸 수 없어요. 현재진행형은 next week 같은 가까운 미래도 나타내요.","틀린 것은 3개(②, ③, ⑤)예요. 남는 두 개가 정답이고, 번호 순서로 하나는 맨 앞, 하나는 네 번째예요."],
 pen:"소유 have 진행형 X / 현재완료 + yesterday·when X / 현재진행형 = 가까운 미래 가능"});
{ const o=mk(["am going – rode","went – was riding","have gone – rode","went – have ridden","have gone – have ridden"]);
A("T","T",13,"c",{q:"빈칸에 들어갈 말이 순서대로 바르게 짝지어진 것은?<br>• I ___ to the amusement park last weekend.<br>• I ___ a horse twice.",opts:o,ans:o[3],full:"④ I went to the amusement park last weekend. / I have ridden a horse twice.",ko:"④ 나는 지난 주말에 놀이공원에 갔다. / 나는 말을 두 번 타 본 적이 있다.",
 h:["본책 p.16 ‘2 과거시제 vs. 현재완료’와 p.18 ‘2 경험: ~한 적이 있다’를 펴세요.","1) 첫 문장의 last weekend(지난 주말)는 과거 시점이라 과거시제예요.  2) 둘째 문장의 twice(두 번)는 지금까지의 경험이라 현재완료예요. ride(타다)의 과거분사형은 -en으로 끝나요.","첫 빈칸은 go(가다)의 과거형, 둘째는 have + p.p.예요. 보기에서 이 두 가지가 순서대로 있는 번호를 찾으세요."],
 pen:"last weekend = 과거 (went) / twice = 경험 (have ridden)"}); }
{ const o=mk(["She usually walks her dog in the evening.","We know that the war ended in 1945.","I’m going to the movies tonight.","He was talking on the phone at that time.","Did you seen her recently?"]);
A("T","T",14,"c",{q:"우리말을 영어로 잘못 옮긴 것은?<br>① 그녀는 보통 저녁에 개를 산책시킨다. → She usually walks her dog in the evening.<br>② 우리는 그 전쟁이 1945년에 끝났다는 것을 안다. → We know that the war ended in 1945.<br>③ 나는 오늘 밤에 영화 보러 갈 것이다. → I’m going to the movies tonight.<br>④ 그는 그때 전화 통화를 하고 있었다. → He was talking on the phone at that time.<br>⑤ 최근에 그녀를 본 적이 있니? → Did you seen her recently?",opts:o,ans:o[4],full:"⑤ Did you seen her recently? (X) → Have you seen her recently?",ko:"⑤ 최근에 그녀를 본 적이 있니? (현재완료 의문문은 Have + 주어 + p.p. ~?)",
 h:["본책 p.16 ‘3 현재완료의 형태’의 의문문 「Have / Has + 주어 + p.p. ~?」를 펴세요.","1) 각 문장의 시제를 우리말과 맞춰 보세요. usually는 습관, in 1945는 과거, tonight는 앞일, at that time은 과거진행이에요.  2) 경험을 묻는 ‘~한 적이 있니?’는 현재완료 의문문이에요.","①~④는 시제가 맞아요. 마지막 문장의 Did + seen(원형 see 보다의 과거분사)의 짝이 어색해요."],
 pen:"경험 묻기 = Have/Has + 주어 + p.p. ~? (Did + p.p. X)"}); }
{ const o=mk(["It’s raining hard.","They’re watching TV now.","He’s leaving for New York soon.","Mom is cooking in the kitchen.","She’s studying for the exam."]);
A("T","T",15,"c",{q:"문장의 시제가 나타내는 의미가 나머지와 다른 것은?<br>① It’s raining hard.<br>② They’re watching TV now.<br>③ He’s leaving for New York soon.<br>④ Mom is cooking in the kitchen.<br>⑤ She’s studying for the exam.",opts:o,ans:o[2],full:"③ He’s leaving for New York soon. (가까운 미래)",ko:"③ 그는 곧 뉴욕으로 떠난다. (가까운 미래) 나머지는 지금 진행 중인 동작이다.",
 h:["본책 p.14 ‘1 현재진행형’ 아래의 ‘현재진행형을 써서 가까운 미래의 계획을 나타낼 수 있다’ 부분을 펴세요.","1) 모두 be + -ing 모양이에요.  2) 지금 하는 중인지, 앞으로 할 일인지 시간 표현(now, soon 등)과 뜻으로 구분해요.","‘곧’(soon)이 들어간 보기가 앞일이에요. 세 번째 보기예요."],
 pen:"현재진행형 = 지금 진행 중 / 가까운 미래(soon, next week)도 가능"}); }
{ const o=mk(["ⓐ, ⓑ","ⓐ, ⓒ","ⓒ, ⓓ","ⓐ, ⓒ, ⓔ","ⓑ, ⓓ, ⓔ"]);
A("T","T",16,"c",{q:"(최신기출) 어법상 옳은 문장끼리 짝지어진 것은?<br>ⓐ The sun rises in the east.<br>ⓑ My family moves to Busan in 2010.<br>ⓒ They will elect a new president.<br>ⓓ Many people are believing in God.<br>ⓔ I have gone to Jeju-do three times.",opts:o,ans:o[1],full:"② ⓐ, ⓒ — ⓐ The sun rises in the east. / ⓒ They will elect a new president.",ko:"② ⓐ 태양은 동쪽에서 뜬다. ⓒ 그들은 새 대통령을 선출할 것이다.",
 h:["본책 p.12 ‘2 과거시제’(in + 연도), p.14 ‘3 진행형으로 쓸 수 없는 동사’, p.18 아래 ‘비교 have been to vs. have gone to’를 펴세요.","1) ⓑ는 in 2010(2010년에)이 있는데 현재형이에요.  2) ⓓ는 believe(믿다)를 진행형으로 썼고, ⓔ는 ‘세 번 가 본 적’인데 have gone to를 썼어요.","틀린 것은 ⓑ, ⓓ, ⓔ 세 개예요. 남는 두 개(ⓐ와 ⓒ)가 들어 있는 보기를 고르세요."],
 pen:"in + 연도 = 과거 / believe 진행형 X / 경험은 have been to"}); }
{ const o=mk(["I have eaten Indian food before.","He has never made a mistake.","Somebody has stolen my bike.","They haven’t started the project yet.","Have you already finished your homework?"]);
A("T","T",17,"w",{q:"(고난도, 출제 포인트 4) 현재완료의 쓰임이 <보기>와 같은 것을 모두 고르면?<br>보기: The restaurant has just closed.<br>① I have eaten Indian food before.<br>② He has never made a mistake.<br>③ Somebody has stolen my bike.<br>④ They haven’t started the project yet.<br>⑤ Have you already finished your homework?",ans:"④, ⑤",full:"④ They haven’t started the project yet. / ⑤ Have you already finished your homework?",ko:"<보기> 그 식당은 방금 문을 닫았다. (완료) ④ 그들은 아직 그 프로젝트를 시작하지 않았다. ⑤ 너는 벌써 숙제를 끝냈니?",
 h:["본책 p.18 ‘3 완료: 막 ~했다’ 설명(just, yet, already)을 펴세요.","1) <보기>의 just(방금)는 완료 용법과 자주 쓰는 말이에요.  2) 같은 완료 용법의 말을 가진 문장은 yet(아직)이나 already(이미)가 들어 있어요.","①, ②는 before, never라서 경험이고, ③은 결과(자전거가 지금 없음)예요. 완료는 마지막 두 개예요."],
 pen:"just / yet / already = 완료 / before·never = 경험"}); }
{ const o=mk(["Do you have any plans for this weekend?","I’m going camping with my family.","Do you like camping?","Actually, I have never gone camping before.","We were going to the campsite this weekend."]);
A("T","T",18,"c",{q:"(출제 포인트 1) 밑줄 친 ①~⑤ 중 어법상 틀린 것은?<br>A ① <u>Do you have any plans for this weekend?</u><br>B Yes, ② <u>I’m going camping with my family.</u> I love camping. ③ <u>Do you like camping?</u><br>A ④ <u>Actually, I have never gone camping before.</u><br>B Will you join us? ⑤ <u>We were going to the campsite this weekend.</u><br>A Okay. That sounds fun.<br>* campsite 캠핑장",opts:o,ans:o[4],full:"⑤ We were going to the campsite this weekend. (X) → We are going to the campsite this weekend.",ko:"⑤ 우리는 이번 주말에 캠핑장에 갈 거야. (이번 주말 계획이므로 미래로 써야 한다.)",
 h:["본책 p.12 ‘3 미래시제’와 p.14 ‘1 현재진행형’의 ‘가까운 미래의 계획’ 설명을 펴세요.","1) 이 대화는 이번 주말의 계획을 말하는 대화예요.  2) this weekend(이번 주말)는 앞일이니 be going to, will, 또는 현재진행형을 써야 해요.","시제가 과거로 쓰인 보기가 있어요. 마지막 보기를 확인하세요."],
 pen:"this weekend(앞일) = 미래 표현 (were going to X)"}); }
A("T","T",19,"w",{q:"[서술형] 괄호 안의 말을 이용하여 대화를 완성하시오.<br>A What are you doing, Jiho?<br>B I ___ cookies. (bake)",ans:"am baking",full:"I am baking cookies.",ko:"A 지호야, 너 뭐 하고 있니? B 나는 쿠키를 굽고 있어.",
 h:["본책 p.14 ‘1 현재진행형: am / are / is + 동사원형-ing’ 설명을 펴세요.","1) A가 What are you doing(너 뭐 하고 있니?)이라고 지금 하는 일을 물었어요.  2) 답도 같은 현재진행형으로 하고, 주어 I에 맞는 be동사를 써요. bake(굽다)는 e를 빼고 -ing를 붙여요.","두 단어예요. a로 시작하는 두 글자 + b로 시작하는 -ing형"],
 pen:"What are you doing? → I am + 동사원형-ing"});
A("T","T",20,"w",{q:"[서술형] [20-21] 우리말과 일치하도록 괄호 안의 말을 이용하여 문장을 완성하시오.<br>우리는 전에 이 영화를 본 적이 없다. (never, see)<br>→ We ___ this movie before.",ans:"have never seen",full:"We have never seen this movie before.",ko:"우리는 전에 이 영화를 본 적이 없다.",
 h:["본책 p.16 ‘3 현재완료의 형태’의 부정문 「have / has + not 〔never〕 + p.p.」와 p.18 ‘2 경험’을 펴세요.","1) ‘본 적이 없다’와 before(전에)는 경험이에요.  2) 주어 We는 복수이니 have를 쓰고, never는 have와 p.p. 사이에 놓아요. see(보다)의 과거분사형을 써요.","세 단어예요. have - never - see(보다)의 과거분사형 순서예요. 과거형 saw가 아니에요."],
 pen:"have + never + p.p. = ~한 적이 없다 (경험)"});
A("T","T",21,"w",{q:"[서술형] [20-21] 우리말과 일치하도록 괄호 안의 말을 이용하여 문장을 완성하시오.<br>내가 집에 도착했을 때 엄마와 아빠는 주방에서 요리를 하고 계셨다. (cook)<br>→ When I arrived home, Mom and Dad ___ in the kitchen.",ans:"were cooking",full:"When I arrived home, Mom and Dad were cooking in the kitchen.",ko:"내가 집에 도착했을 때 엄마와 아빠는 주방에서 요리를 하고 계셨다.",
 h:["본책 p.14 ‘2 과거진행형: was / were + 동사원형-ing’ 설명을 펴세요.","1) arrived(원형 arrive 도착하다)는 과거 시점이에요.  2) 그때 하는 중이던 일이고, 주어 Mom and Dad는 복수이니 be동사는 were예요.","두 단어예요. w로 시작하는 be동사 + c로 시작하는 -ing형"],
 pen:"과거 시점에 진행 중 = were + 동사원형-ing (복수 주어)"});
A("T","T",22,"w",{q:"[서술형] 대화의 흐름에 맞게 빈칸에 알맞은 말을 쓰시오.<br>A Have you ever eaten Thai food?<br>B ___, I ___. But I heard it’s delicious. I’d like to try it someday.",ans:"No, I haven’t",full:"A Have you ever eaten Thai food? B No, I haven’t. But I heard it’s delicious. I’d like to try it someday.",ko:"A 너는 태국 음식을 먹어 본 적이 있니? B 아니, 없어. 하지만 맛있다고 들었어. 언젠가 먹어 보고 싶어.",
 h:["본책 p.16 ‘3 현재완료의 형태’의 대화 예문(A Have you seen her lately? B Yes, I have. / No, I haven’t.)을 펴세요.","1) A가 Have you ever ~?로 경험을 물었어요.  2) 뒤 문장(But I heard it’s delicious.)을 보면 아직 먹어 보지 않았다는 부정의 대답이에요. Have로 물었으니 have 동사로 답해요.","첫 빈칸은 두 글자의 부정 대답이에요. 둘째 빈칸은 have의 부정 줄임말이고 h로 시작해요."],
 pen:"Have you ever ~? → No, I haven’t. (Have로 물으면 have로 답)"});
A("T","T",23,"w",{q:"[서술형] (최신기출, 출제 포인트 1) 우리말과 일치하도록 <조건>에 맞게 영작하시오.<br>나는 이번 여름 방학에 중국어를 배울 것이다.<br>조건: 다음 중에서 필요한 단어만을 골라 영작할 것 (I, Chinese, go, learn, am, was, to, going)<br>→ ___ this summer vacation.",ans:"I am going to learn Chinese",full:"I am going to learn Chinese this summer vacation.",ko:"나는 이번 여름 방학에 중국어를 배울 것이다.",
 h:["본책 p.12 ‘3 미래시제’의 「be going to + 동사원형」을 펴세요.","1) this summer vacation(이번 여름 방학)은 앞일이에요.  2) 앞으로의 계획은 「be going to + 동사원형」이에요. 주어 I에 맞는 be동사를 골라야 해요. was는 과거니까 쓰지 않아요.","8개 단어 중 2개는 쓰지 않아요(동사원형 go와 과거형 was). 나머지 여섯 개로 「be going to + 동사원형」 순서를 만들어요."],
 pen:"I + am going to + 동사원형 = ~할 것이다 (계획)"});
A("T","T",24,"w",{q:"[서술형] 그림의 내용과 일치하도록 문장을 완성하시오.<br>[그림: 왼쪽 ‘Yesterday’ 그림에서 아픈 소녀가 침대에 누워 이마에 찜질 수건을 얹은 채 이마를 짚으며 ‘I’m sick.’(나는 아파요.)이라고 말한다. 오른쪽 ‘Now’ 그림에서는 같은 소녀가 침대에서 코를 풀며 ‘I’m still sick.’(나는 아직도 아파요.)이라고 말한다.]<br>→ She ___ ___ ___ ___ yesterday.",ans:"has been sick since",full:"She has been sick since yesterday.",ko:"그녀는 어제부터 아팠다. (그래서 지금도 아프다.)",

A(1,"MP",1,"w",{q:"can<br>I can swim. = I am ___ ___ swim.<br>___ ___ help me?<br>주의: You will ( can / be able to ) finish the work.<br>(빈칸과 괄호의 정답을 차례로 쓰세요)",ans:"able to, Can 〔Could〕 you, be able to",full:"I can swim. = I am able to swim. / Can 〔Could〕 you help me? / You will be able to finish the work.",ko:"나는 수영을 할 수 있다. / 나를 도와줄래? / 너는 그 일을 끝낼 수 있을 것이다.",
 h:["본책 p.28 ‘2 can’ 표와 맨 아래 ‘조동사를 쓸 때 주의할 점’을 펴세요.","1) can은 be able to로 바꿔 쓸 수 있어요.  2) 부탁하는 질문 모양은 p.28 ‘2 can’ 표의 ‘요청’ 줄에 있어요. 그리고 조동사는 두 개를 연달아 쓸 수 없어요.","첫째 a로 시작하는 말 + to, 둘째 C로 시작하는 말 + you, 셋째는 will 뒤라서 can이 아닌 쪽이에요."],
 pen:"can = be able to / will 뒤에는 will can (X) → will be able to"});
A(1,"MP",2,"w",{q:"may<br>She ___ be hungry.<br>___ I sit here? = Can I sit here?<br>(빈칸 두 개를 차례로 쓰세요)",ans:"may, May",full:"She may be hungry. / May I sit here? = Can I sit here?",ko:"그녀는 배가 고플지도 모른다. / 제가 여기에 앉아도 될까요?",
 h:["본책 p.28 ‘3 may’ 표를 펴세요. ‘허가’ 줄과 ‘불확실한 추측’ 줄이 둘 다 있어요.","1) 첫 문장은 배가 고픈지 확실하지 않은 추측이에요.  2) 둘째 문장은 Can I ~?와 같은 뜻으로 허락을 구해요.","두 빈칸 모두 m으로 시작하는 조동사예요. 하나는 소문자, 하나는 문장 맨 앞이라 대문자예요."],
 pen:"may = ~일지도 모른다 / May I ~? = ~해도 될까요?"});
A(1,"MP",3,"w",{q:"will<br>I ___ see a doctor tomorrow.",ans:"will",full:"I will see a doctor tomorrow.",ko:"나는 내일 병원에 갈 것이다.",
 h:["본책 p.28 ‘4 will’ 표의 ‘예정’ 줄을 펴세요.","1) tomorrow(내일)는 앞으로 올 때예요.  2) 앞으로 할 일은 will + 동사원형으로 나타내요.","w로 시작하는 네 글자 조동사예요."],
 pen:"will + 동사원형 = ~할 것이다 (예정)"});

// ===================== UNIT 02 (p.31) =====================
A(2,"CU",1,"c",{q:"He must be a genius.",opts:["그는 천재임에 틀림없다.","그는 천재일지도 모른다."],ans:"그는 천재임에 틀림없다.",full:"He must be a genius. = 그는 천재임에 틀림없다.",ko:"그는 천재임에 틀림없다.",
 h:["본책 p.30 ‘1 must’ 표의 ‘강한 추측’ 줄을 펴세요.","1) must 뒤에 be(원형 be 이다)가 와서 상태를 말하고 있어요.  2) 이때 must는 거의 확실하다는 강한 추측이에요.","‘~일지도 모른다’(may)보다 더 확실한 쪽이에요. ‘틀림없다’가 들어간 쪽이에요."],
 pen:"must + be = ~임에 틀림없다 (강한 추측)"});
A(2,"CU",2,"c",{q:"You must not lie.",opts:["너는 거짓말을 해서는 안 된다.","너는 거짓말을 할 필요가 없다."],ans:"너는 거짓말을 해서는 안 된다.",full:"You must not lie. = 너는 거짓말을 해서는 안 된다.",ko:"너는 거짓말을 해서는 안 된다.",
 h:["본책 p.30 ‘1 must’ 표의 ‘의무’ 줄에서 must not과 don’t have to의 설명을 펴세요.","1) must not은 금지를 나타내요.  2) ‘할 필요가 없다’는 must not이 아니라 don’t have to의 뜻이에요.","금지를 말하는 ‘~해서는 안 된다’ 쪽이에요."],
 pen:"must not = ~해서는 안 된다 (금지)"});
A(2,"CU",3,"c",{q:"You had better leave now.",opts:["너는 지금 떠나는 게 좋겠다.","너는 지금 떠나도 된다."],ans:"너는 지금 떠나는 게 좋겠다.",full:"You had better leave now. = 너는 지금 떠나는 게 좋겠다.",ko:"너는 지금 떠나는 게 좋겠다.",
 h:["본책 p.30 ‘3 had better’ 표를 펴세요.","1) had better는 한 덩어리로 충고나 권고를 나타내요.  2) 뒤에 leave(원형 leave 떠나다)가 동사원형으로 왔어요.","허락(~해도 된다)이 아니라 충고(~하는 게 좋겠다) 쪽이에요."],
 pen:"had better + 동사원형 = ~하는 게 좋겠다 (충고)"});
A(2,"A",1,"c",{q:"He ( must / had to ) attend the meeting yesterday.",opts:["must","had to"],ans:"had to",full:"He had to attend the meeting yesterday.",ko:"그는 어제 회의에 참석해야 했다.",
 h:["본책 p.30 ‘1 must’ 아래 ‘의무의 must 〔have to〕의 과거형은 had to’ 설명을 펴세요.","1) yesterday(어제)가 있으니 과거의 일이에요.  2) 의무를 나타내는 must에는 과거형이 따로 없어서 have to의 과거형을 써요.","must가 아닌 쪽, 즉 h로 시작하는 쪽이에요."],
 pen:"의무의 과거 = had to (must는 과거형 없음)"});
A(2,"A",2,"c",{q:"You look tired. I think you ( should / would ) go home early today.",opts:["should","would"],ans:"should",full:"You look tired. I think you should go home early today.",ko:"너는 피곤해 보여. 오늘은 집에 일찍 가는 게 좋을 것 같아.",
 h:["본책 p.30 ‘2 should’ 표의 ‘충고’ 줄(I think you should ~)을 펴세요.","1) 피곤해 보이는 친구에게 해 주는 말이에요.  2) ‘~하는 게 좋다’는 충고는 should로 나타내요.","would는 ‘~하곤 했다’ 같은 과거의 뜻이에요. s로 시작하는 쪽이 답이에요."],
 pen:"should = ~하는 게 좋다 (충고), ~해야 한다 (의무)"});
A(2,"A",3,"c",{q:"You ( must not / don’t have to ) swim here. The water is deep.",opts:["must not","don’t have to"],ans:"must not",full:"You must not swim here. The water is deep.",ko:"너는 여기서 수영해서는 안 된다. 물이 깊다.",
 h:["본책 p.30 아래쪽 ‘비교 must not vs. don’t have to’를 펴세요.","1) 뒤 문장 The water is deep(물이 깊다)은 위험하다는 뜻이에요.  2) 위험하니 하지 말라는 금지의 말이 어울려요.","‘~할 필요가 없다’가 아니라 ‘~해서는 안 된다’ 쪽이에요. m으로 시작해요."],
 pen:"위험·금지 = must not / 불필요 = don’t have to"});
A(2,"A",4,"c",{q:"This bag ( must / may ) be Amy’s. I can see her name on it.",opts:["must","may"],ans:"must",full:"This bag must be Amy’s. I can see her name on it.",ko:"이 가방은 Amy의 것임에 틀림없다. 그 위에 그녀의 이름이 보인다.",
 h:["본책 p.30 ‘1 must’ 표의 ‘강한 추측’ 줄을 펴세요.","1) 뒤 문장에 이름이 보인다는 확실한 근거가 있어요.  2) 근거가 확실하면 ‘~임에 틀림없다’의 must를 써요.","‘~일지도 모른다’(may)보다 더 확실한 쪽이에요."],
 pen:"확실한 근거가 있는 추측 = must (~임에 틀림없다)"});
A(2,"B",1,"c",{q:"우리는 지금 표를 사는 게 좋겠다.<br>→ We ___ buy the tickets now.<br>보기: should / had better / used to (한 번씩만 사용)",bank:["should","had better","used to"],opts:["should","had better","used to"],ans:"had better",full:"We had better buy the tickets now.",ko:"우리는 지금 표를 사는 게 좋겠다.",
 h:["본책 p.30 ‘3 had better’ 표(충고, 권고 ~하는 게 좋겠다)를 펴세요.","1) 우리말이 ‘~하는 게 좋겠다’로 충고예요.  2) 보기 중 ‘좋겠다’의 느낌이 가장 강한 두 단어짜리 표현이 있어요.","두 단어이고 h로 시작해요."],
 pen:"had better + 동사원형 = ~하는 게 좋겠다"});
A(2,"B",2,"c",{q:"내 남동생은 내 장난감을 망가뜨리곤 했다.<br>→ My brother ___ break my toys.<br>보기: should / had better / used to (한 번씩만 사용)",bank:["should","had better","used to"],opts:["should","had better","used to"],ans:"used to",full:"My brother used to break my toys.",ko:"내 남동생은 내 장난감을 망가뜨리곤 했다.",
 h:["본책 p.30 ‘4 used to’ 표의 ‘과거의 습관’ 줄을 펴세요.","1) ‘~곤 했다’는 과거에 반복하던 습관이에요.  2) 지금은 하지 않는다는 느낌도 들어 있어요.","u로 시작하는 두 단어 표현이에요."],
 pen:"used to + 동사원형 = ~하곤 했다 (과거의 습관)"});
A(2,"B",3,"c",{q:"우리는 야생동물을 보호해야 한다.<br>→ We ___ protect wild animals.<br>보기: should / had better / used to (한 번씩만 사용)",bank:["should","had better","used to"],opts:["should","had better","used to"],ans:"should",full:"We should protect wild animals.",ko:"우리는 야생동물을 보호해야 한다.",
 h:["본책 p.30 ‘2 should’ 표의 ‘의무’ 줄(마땅히 ~해야 한다)을 펴세요.","1) 야생동물을 보호하는 것은 마땅히 해야 하는 도리예요.  2) 앞의 두 문제에서 쓴 표현을 빼면 남는 것이 하나예요.","s로 시작하는 한 단어예요."],
 pen:"should = (마땅히) ~해야 한다"});
A(2,"C",1,"w",{q:"너는 지금 Tom에게 전화하지 않는 게 좋겠다. (call, had better)<br>→ You ___ Tom now.",ans:"had better not call",full:"You had better not call Tom now.",ko:"너는 지금 Tom에게 전화하지 않는 게 좋겠다.",
 h:["본책 p.30 ‘3 had better’ 아래 ‘had better의 부정은 had better not’을 펴세요.","1) ‘~하지 않는 게 좋겠다’는 had better의 부정문이에요.  2) not은 better 바로 뒤에 놓고, 그 뒤에 call(원형 call 전화하다)을 써요.","빈칸에는 네 단어가 들어가요. h로 시작 / b로 시작 / n으로 시작하는 말 다음에 call이 와요."],
 pen:"had better not + 동사원형 (not은 better 뒤)"});
A(2,"C",2,"w",{q:"그녀는 그것에 대해 걱정할 필요가 없다. (worry, have to)<br>→ She ___ about that.",ans:"doesn’t have to worry",full:"She doesn’t have to worry about that.",ko:"그녀는 그것에 대해 걱정할 필요가 없다.",
 h:["본책 p.30 ‘1 must’ 표 아래 ‘don’t have to는 ~할 필요가 없다’ 설명을 펴세요.","1) ‘~할 필요가 없다’는 have to의 부정이에요.  2) 주어 She는 3인칭 단수이니 don’t가 아니라 doesn’t로 써요.","does not의 줄임말(d로 시작)로 시작하고, have to 뒤에 worry(걱정하다)의 원형으로 끝나요. 모두 네 단어예요."],
 pen:"don’t / doesn’t have to + 동사원형 = ~할 필요가 없다"});
A(2,"C",3,"w",{q:"너는 공공장소에서는 큰 소리로 이야기해서는 안 된다. (talk loudly, must)<br>→ You ___ in public places.",ans:"must not talk loudly",full:"You must not talk loudly in public places.",ko:"너는 공공장소에서는 큰 소리로 이야기해서는 안 된다.",
 h:["본책 p.30 ‘1 must’ 표의 ‘의무’ 줄에서 ‘You must not swim here. <금지>’를 펴세요.","1) ‘~해서는 안 된다’는 금지의 말이에요.  2) must 뒤에 not을 붙이고, 그 뒤에 동사원형이 와요.","괄호 안의 talk loudly(큰 소리로 이야기하다) 앞에 m으로 시작하는 말과 n으로 시작하는 말을 써요."],
 pen:"must not + 동사원형 = ~해서는 안 된다 (금지)"});
A(2,"MP",1,"w",{q:"must<br>He must go. = He ___ ___ go.<br>They ___ ___ rich.<br>You ( must not / don’t have to ) go there. (우리말: 너는 그곳에 갈 필요가 없다.)<br>(빈칸과 괄호의 정답을 차례로 쓰세요)",ans:"has to, must be, don’t have to",full:"He must go. = He has to go. / They must be rich. / You don’t have to go there.",ko:"그는 가야 한다. / 그들은 부자임에 틀림없다. / 너는 그곳에 갈 필요가 없다.",
 h:["본책 p.30 ‘1 must’ 표와 ‘must not vs. don’t have to’ 설명을 펴세요.","1) 의무의 must는 have to와 같은 뜻이고, 주어가 He이면 형태가 달라져요.  2) ‘갈 필요가 없다’는 금지가 아니라 불필요예요.","첫째는 h로 시작하는 말 + to, 둘째는 m으로 시작하는 말 + be, 셋째는 ‘필요 없다’ 쪽이에요."],
 pen:"must = have to / must be = 틀림없다 / don’t have to = 할 필요 없다"});
A(2,"MP",2,"w",{q:"should<br>You should study English.<br>너는 영어를 ___ .",ans:"공부해야 한다",full:"You should study English. = 너는 영어를 공부해야 한다.",ko:"너는 영어를 공부해야 한다.",
 h:["본책 p.30 ‘2 should’ 표의 ‘의무’와 ‘충고’ 줄을 펴세요.","1) should는 ‘(마땅히) ~해야 한다’는 뜻이에요.  2) study(원형 study 공부하다)에 그 뜻을 이어서 써요.","‘공부’로 시작해서 ‘~해야 한다’로 끝나는 말이에요."],
 pen:"should + 동사원형 = ~해야 한다"});
A(2,"MP",3,"w",{q:"had better<br>You ___ ___ ___ go there.<br>(너는 그곳에 가지 않는 게 좋겠다.)",ans:"had better not",full:"You had better not go there.",ko:"너는 그곳에 가지 않는 게 좋겠다.",
 h:["본책 p.30 ‘3 had better’ 표 아래 ‘had better의 부정은 had better not’을 펴세요.","1) ‘가지 않는 게 좋겠다’는 부정 충고예요.  2) 부정어 not의 자리가 어디인지 생각해 보세요.","빈칸 세 개: h로 시작 / b로 시작 / n으로 시작하는 말이에요."],
 pen:"had better not + 동사원형 (not은 맨 뒤)"});
A(2,"MP",4,"c",{q:"used to<br>There ( used to / would ) be a bank here. (우리말: (과거에) 이곳에 은행이 있었다.)",opts:["used to","would"],ans:"used to",full:"There used to be a bank here.",ko:"(과거에) 이곳에 은행이 있었다.",
 h:["본책 p.30 ‘4 used to’ 아래 ‘주의’ 상자(과거의 상태는 would로 바꿔 쓸 수 없다)를 펴세요.","1) 은행이 ‘있었다’는 과거의 상태예요.  2) 과거의 상태를 나타낼 때는 would를 쓰지 못해요.","would가 아닌 쪽, 즉 u로 시작하는 쪽이에요."],
 pen:"과거의 상태(~이 있었다) = used to (would X)"});

 h:["본책 p.30 ‘1 must’ 표의 ‘불필요’ 설명(You don’t have to hurry.)을 펴세요.","1) ‘답하지 않아도 된다’는 ‘~할 필요가 없다’는 뜻이에요.  2) 주어 He는 3인칭 단수이니 don’t가 아니라 doesn’t예요.","빈칸 네 개: d로 시작 / h로 시작 / t로 시작하는 말 다음에 answer(원형 answer 답하다)가 와요."],

A("SW","SW",4,"w",{q:"[빈칸 완성] Tom은 서울에 살았지만, 지금은 부산에 산다. (live)<br>→ Tom ___ ___ ___ in Seoul, but now he lives in Busan.",ans:"used to live",full:"Tom used to live in Seoul, but now he lives in Busan.",ko:"Tom은 서울에 살았지만, 지금은 부산에 산다.",
 h:["본책 p.30 ‘4 used to’ 표의 ‘과거의 습관, 상태’ 설명을 펴세요.","1) ‘예전에는 살았지만 지금은 아니다’라는 대조가 들어 있어요.  2) 과거에는 그랬지만 지금은 아닌 일은 used to로 나타내요.","빈칸 세 개: u로 시작하는 말 + to + live(원형 live 살다)예요."],

A("SW","SW",5,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br>He is wearing a ring. <u>He has to be</u> married.<br>→ He is wearing a ring. ___ married.",ans:"He must be",full:"He is wearing a ring. He must be married.",ko:"그는 반지를 끼고 있다. 그는 결혼했음에 틀림없다.",

 pen:"추측의 must(~임에 틀림없다)는 have/has to로 바꿔 쓸 수 없다"});

 pen:"능력의 미래 = will be able to (will can X)"});
A("SW","SW",7,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br>It’s a secret. <u>You had not better tell</u> anybody.<br>→ It’s a secret. ___ anybody.",ans:"You had better not tell",full:"It’s a secret. You had better not tell anybody.",ko:"그것은 비밀이야. 너는 아무에게도 말하지 않는 게 좋겠다.",
 h:["본책 p.30 ‘3 had better’ 표 아래 ‘had better의 부정은 had better not’을 펴세요.","1) 밑줄 친 부분은 not의 위치가 틀렸어요.  2) had better를 한 덩어리로 보고 not은 그 뒤에 붙여요.","You와 tell은 그대로 두고, not만 better 뒤로 옮겨 써요."],
 pen:"had better의 부정 = had better not (had not better X)"});
A("SW","SW",8,"w",{q:"[오류 수정] 어법에 맞게 문장 고쳐 쓰기<br><u>There would be a theater</u> in my town, but now there isn’t.<br>→ ___ in my town, but now there isn’t.",ans:"There used to be a theater",full:"There used to be a theater in my town, but now there isn’t.",ko:"우리 동네에는 극장이 있었지만, 지금은 없다.",
 h:["본책 p.30 ‘4 used to’ 아래 ‘주의’ 상자(과거의 상태는 would로 바꿔 쓸 수 없다)를 펴세요.","1) ‘극장이 있었다’는 과거의 상태예요.  2) 상태를 나타낼 때는 would를 쓰지 못해요.","밑줄 친 would를 u로 시작하는 두 단어 표현으로 바꿔요. be(원형 be 이다, 있다)는 그대로예요."],
 pen:"과거의 상태(~이 있었다) = used to (would X)"});
A("SW","SW",9,"w",{q:"[배열 영작] 조금 더 천천히 말씀해 주시겠어요? (speak, you, could)<br>→ ___ ___ ___ more slowly?",ans:"Could you speak",full:"Could you speak more slowly?",ko:"조금 더 천천히 말씀해 주시겠어요?",

A("SW","SW",11,"w",{q:"[배열 영작] 너는 너의 건강에 신경을 써야 한다. (of, take, should, care, you)<br>→ ___ ___ ___ ___ ___ your health.",ans:"You should take care of",full:"You should take care of your health.",ko:"너는 너의 건강에 신경을 써야 한다.",

 pen:"should + 동사원형 / take care of = ~을 돌보다"});
A("SW","SW",12,"w",{q:"[배열 영작] 나는 오늘 밤에 너에게 전화할 수 없을 것이다. (not, call, able, be, will, to)<br>→ I ___ ___ ___ ___ ___ ___ you tonight.",ans:"will not be able to call",full:"I will not be able to call you tonight.",ko:"나는 오늘 밤에 너에게 전화할 수 없을 것이다.",

A("T","T",20,"w",{q:"[19-20] 우리말과 일치하도록 빈칸에 알맞은 말을 쓰시오.<br>Jessica는 전화를 받지 않고 있어. 그녀는 바쁜 게 틀림없어. (busy)<br>→ Jessica is not answering the phone. She ___ ___ ___.",ans:"must be busy",full:"Jessica is not answering the phone. She must be busy.",ko:"Jessica는 전화를 받지 않고 있어. 그녀는 바쁜 게 틀림없어.",
 h:["본책 p.30 ‘1 must’ 표의 ‘강한 추측’ 줄을 펴세요.","1) 전화를 받지 않는다는 근거로 ‘바쁜 게 틀림없다’고 확신하고 있어요.  2) ‘~임에 틀림없다’는 조동사 하나 뒤에 be(원형 be 이다)를 써요.","빈칸 세 개: m으로 시작하는 조동사 / b로 시작하는 be / busy(바쁜)예요."],
 pen:"must be = ~임에 틀림없다 (강한 추측)"});
A("T","T",21,"w",{q:"우리말과 일치하도록 괄호 안의 말을 바르게 배열하여 문장을 완성하시오.<br>Harry는 그의 고양이를 돌보아야 한다.<br>(care, his cat, has, take, of, to)<br>→ Harry ___ ___ ___ ___ ___ ___.",ans:"has to take care of his cat",full:"Harry has to take care of his cat.",ko:"Harry는 그의 고양이를 돌보아야 한다.",
 h:["본책 p.30 ‘1 must’ 표의 ‘의무’ 줄(~해야 한다 = have to)을 펴세요.","1) ‘돌보아야 한다’는 의무예요.  2) 주어 Harry는 3인칭 단수이니 have to가 아니라 has to를 쓰고, ‘~을 돌보다’는 take care of로 한 덩어리예요.","has to 뒤에 동사원형 take로 시작하는 덩어리 take care of(~을 돌보다)를 쓰고, 돌보는 대상으로 끝나요."],
 pen:"has to + 동사원형 / take care of = ~을 돌보다"});
A("T","T",22,"w",{q:"(고난도, 출제 포인트 1, 4) 어법상 틀린 부분을 두 곳 찾아 바르게 고쳐 쓰시오.<br>You had not better buy that lamp. I think it’s too expensive. We will able to find a better one.<br>(1) ___ → ___<br>(2) ___ → ___",ans:"(1) had better not (2) will be able to",full:"You had better not buy that lamp. I think it’s too expensive. We will be able to find a better one.",ko:"너는 그 램프를 사지 않는 게 좋겠다. 내 생각에는 너무 비싸다. 우리는 더 좋은 것을 찾을 수 있을 것이다.",
 h:["본책 p.30 ‘3 had better’ 표 아래 설명과 본책 p.28 ‘능력의 can의 …, 미래는 will be able to’ 설명을 펴세요.","1) 첫 번째 오류는 ‘~하지 않는 게 좋겠다’의 not 위치예요.  2) 두 번째 오류는 ‘찾을 수 있을 것이다’(능력의 미래)에서 빠진 단어가 있어요.","(1)은 had, better, not 순서로 고치고, (2)는 will과 able 사이에 b로 시작하는 한 단어를 넣어요."],
 pen:"had better not / will be able to"});
A("T","T",23,"w",{q:"(출제 포인트 2) 다음 그림을 설명하는 문장을 <조건>에 맞게 완성하시오.<br>[그림: 두 장의 그림이 벽돌담이 있는 같은 뒷마당을 보여 준다. 왼쪽 ‘10 years ago’(10년 전) 그림에는 그네가 있고 작은 덤불이 있다. 오른쪽 ‘now’(지금) 그림에는 그네가 없고 큰 나무 한 그루가 서 있다.]<br>조건 1. 조동사와 a swing을 이용할 것 2. 5단어로 쓸 것<br>→ There ___ ___ ___ ___ ___ in my backyard 10 years ago.",ans:"used to be a swing",full:"There used to be a swing in my backyard 10 years ago.",ko:"10년 전에 우리 뒷마당에는 그네가 있었다.",
 h:["본책 p.30 ‘4 used to’ 표의 ‘과거의 상태’ 줄(~이 있었다)을 펴세요.","1) 그림에서 10년 전에는 그네가 있었지만 지금은 없어요.  2) 과거에는 있었지만 지금은 없는 상태는 used to be로 나타내요.","빈칸 다섯 개: u로 시작 / t로 시작 / b로 시작 / 그리고 a swing(그네 하나)이에요."],
 pen:"There used to be + 명사 = (과거에) ~이 있었다"});
A("T","T",24,"w",{q:"(출제 포인트 1) 다음 문장을 지시대로 바꿔 쓰시오.<br>(1) You can enjoy fun activities here. (미래시제로)<br>→ You ___ ___ ___ ___ fun activities here.<br>(2) You must rent a car. (과거시제로)<br>→ You ___ ___ rent a car.",ans:"(1) will be able to enjoy (2) had to",full:"(1) You will be able to enjoy fun activities here. (2) You had to rent a car.",ko:"(1) 너는 여기서 재미있는 활동을 즐길 수 있을 것이다. (2) 너는 차를 빌려야 했다.",
 h:["본책 p.28 ‘능력의 can의 …, 미래는 will be able to’ 설명과 본책 p.30 ‘의무의 must 〔have to〕의 과거형은 had to’ 설명을 펴세요.","1) can의 미래는 조동사 두 개를 연달아 쓸 수 없어서 will can이 아니라 다른 표현을 써요.  2) must의 과거는 must 자체를 바꾸지 않고 have to의 과거형을 써요.","(1) will 뒤에 be able to + enjoy(원형 enjoy 즐기다), (2) h로 시작하는 말 + to예요."],
 pen:"can의 미래 = will be able to / must의 과거 = had to"});
A("T","T",25,"w",{q:"밑줄 친 우리말을 <조건>에 맞게 영작하시오.<br>It’s already 11 o’clock. <u>너는 잠자리에 드는 것이 좋다.</u><br>조건 1. 충고의 표현과 go to bed를 이용할 것 2. 5단어로 쓸 것",ans:"You should go to bed.",full:"You should go to bed.",ko:"벌써 11시야. 너는 잠자리에 드는 것이 좋다.",
 h:["본책 p.30 ‘2 should’ 표의 ‘충고’ 줄과 ‘3 had better’ 표를 펴세요.","1) 충고의 표현은 should와 had better 두 가지예요.  2) 5단어로 써야 하니 단어 수를 세어 보세요. had better는 두 단어라서 You had better go to bed는 여섯 단어예요.","주어 You 다음에 s로 시작하는 조동사 한 단어를 쓰고 go to bed를 이어요."],
 pen:"should + 동사원형 = ~하는 게 좋다 (충고)"});
A("T","T",26,"w",{q:"(출제 포인트 1) 두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>Dinosaurs could not live in cold weather.<br>→ Dinosaurs ___ ___ ___ ___ live in cold weather.",ans:"were not able to",full:"Dinosaurs were not able to live in cold weather.",ko:"공룡은 추운 날씨에서 살 수 없었다.",
 h:["본책 p.28 ‘능력의 can의 과거는 could나 was / were able to’ 설명을 펴세요.","1) could not은 ‘~할 수 없었다’는 과거의 능력이에요.  2) 이것은 be able to의 과거형으로 바꿔 쓸 수 있고, 주어 Dinosaurs는 복수예요.","빈칸 네 개: w로 시작하는 be동사 / n으로 시작 / a로 시작 / t로 시작하는 말이에요."],
 pen:"could not = was/were not able to (과거의 능력)"});
A("T","T",27,"w",{q:"(고난도, 출제 포인트 3) <보기>의 단어와 알맞은 조동사를 이용하여 문장을 완성하시오.<br>보기: lose, cross, take<br>(1) It’s sunny today. You ___ ___ ___ ___ an umbrella.<br>(2) It’s a red light. You ___ ___ ___ the road.",ans:"(1) don’t have to take (2) must not cross",full:"(1) It’s sunny today. You don’t have to take an umbrella. (2) It’s a red light. You must not cross the road.",ko:"(1) 오늘은 화창해. 너는 우산을 가져갈 필요가 없다. (2) 빨간불이야. 너는 길을 건너서는 안 된다.",
 h:["본책 p.30 아래 ‘비교 must not vs. don’t have to’를 펴세요.","1) (1)은 날씨가 화창하니 우산이 필요 없다는 불필요예요.  2) (2)는 빨간불이니 건너면 안 된다는 금지예요.","(1)은 d / h / t로 시작하는 말 다음에 take(원형 take 가져가다), (2)는 m으로 시작하는 말과 n으로 시작하는 말 다음에 cross(원형 cross 건너다)예요."],
 pen:"don’t have to = 불필요 / must not = 금지"});
A("T","T",28,"w",{q:"(최신기출) 다음은 도서관에서 지켜야 할 규칙을 메모한 것이다. <보기>에서 알맞은 조동사를 골라 문장을 완성하시오.<br>[그림: 메모 상자. ×(하면 안 되는 것) 칸에 ‘(1) eat or drink’(먹거나 마시기)와 ‘(2) talk on the phone’(전화 통화하기)이 적혀 있고, ○(해도 되는 것) 칸에 ‘(3) read books quietly’(조용히 책 읽기)가 적혀 있다.]<br>보기: should, should not<br>(1) We ___ in the library.<br>(2) We ___ in the library.<br>(3) We ___ in the library.",ans:"(1) should not eat or drink (2) should not talk on the phone (3) should read books quietly",full:"(1) We should not eat or drink in the library. (2) We should not talk on the phone in the library. (3) We should read books quietly in the library.",ko:"(1) 우리는 도서관에서 먹거나 마시면 안 된다. (2) 우리는 도서관에서 전화 통화를 하면 안 된다. (3) 우리는 도서관에서 조용히 책을 읽어야 한다.",
 h:["본책 p.30 ‘2 should’ 표의 ‘의무’ 줄을 펴세요.","1) 메모에서 ×가 붙은 일은 하지 말아야 하는 일이에요.  2) ○가 붙은 일은 해야 하는 일이에요. 해야 하는 일은 should, 하지 말아야 할 일은 should not이에요.","×칸의 (1)(2)는 부정 쪽 보기, ○칸의 (3)은 긍정 쪽 보기를 고르고, 뒤에 메모의 동사 표현을 그대로 이어 써요."],
 pen:"해야 하는 일 = should / 하지 말아야 할 일 = should not"});
}

 h:["본책 p.42 ‘(2) 명사 + to부정사 + 전치사’의 a friend to talk to 부분을 펴세요.","1) ‘이야기할 누군가’는 someone(누군가)을 to부정사가 뒤에서 꾸며 줘요.  2) ‘누군가와 이야기한다’이니 talk(이야기하다) 뒤에 전치사가 필요해요.","someone to talk 뒤에 t로 시작하는 전치사 또는 w로 시작하는 전치사를 써요."],
 pen:"someone to talk to (with) : 전치사를 빠뜨리지 않기"});
A(2,"C",3,"w",{q:"나는 그녀의 생일을 축하하기 위해 케이크를 만들었다. (celebrate, birthday)<br>→ I made a cake ___.",ans:"to celebrate her birthday 또는 in order to celebrate her birthday",full:"I made a cake (in order) to celebrate her birthday.",ko:"나는 그녀의 생일을 축하하기 위해 케이크를 만들었다.",
 h:["본책 p.42 ‘(1) 목적: ~하기 위해’ 아래 ‘in order to’ 설명을 펴세요.","1) 케이크를 만든 이유를 말하는 부분이에요.  2) ‘~하기 위해’는 to + 동사원형이고, 더 분명히 하려면 앞에 in order를 붙일 수 있어요.","네 단어(앞에 in order를 붙이면 여섯 단어)예요. t로 시작하는 두 글자로 시작하고 birthday(생일)로 끝나요."],

A(2,"C",4,"w",{q:"그 소년은 자라서 훌륭한 축구 선수가 되었다. (be, a great soccer player)<br>→ The boy grew up ___.",ans:"to be a great soccer player",full:"The boy grew up to be a great soccer player.",ko:"그 소년은 자라서 훌륭한 축구 선수가 되었다.",
 h:["본책 p.42 ‘(3) 결과: (…해서) ~하다’의 She grew up to be a great scientist. 예문을 펴세요.","1) grew up(원형 grow up 자라다) 뒤에 ‘자라서 ~가 되었다’가 와요.  2) 앞에서부터 순서대로 결과를 이어 주는 to부정사예요.","여섯 단어예요. t로 시작하는 두 글자 다음에 ‘되다’의 동사원형이 오고, 괄호 속 말로 끝나요."],
 pen:"grow up to be ~ = 자라서 ~가 되다 (결과)"});
A(2,"MP",1,"w",{q:"형용사적 용법<br>I have ( work to do / to do work ). 나는 해야 할 일이 있다.<br>We bought a house ( to live / to live in ). 우리는 살 집을 구입했다.<br>(알맞은 말 두 개를 차례로 쓰세요)",ans:"work to do, to live in",full:"I have work to do. / We bought a house to live in.",ko:"나는 해야 할 일이 있다. / 우리는 살 집을 구입했다.",
 h:["본책 p.42 ‘(1) 명사 + to부정사’와 ‘(2) 명사 + to부정사 + 전치사’를 펴세요.","1) 첫 문장: ‘할 일’은 명사 work(일) 뒤에서 to do가 꾸며요.  2) 둘째 문장: ‘집 안에서 산다’이니 live(살다) 뒤에 ‘~ 안에’를 뜻하는 전치사가 필요해요.","첫 번째는 명사 work(일)가 앞에 나오는 쪽, 두 번째는 전치사가 붙어 한 단어 더 긴 쪽이에요."],
 pen:"명사 + to부정사 / 명사 + to부정사 + 전치사 (to live in)"});
A(2,"MP",2,"w",{q:"부사적 용법<br>I studied hard to be a doctor. ( 의사가 되기 위해 / 의사가 되다니 )<br>I was sad to hear the news. ( 그 소식을 듣기 위해 / 그 소식을 들어서 )<br>You are very kind to help me. ( 나를 도와주다니 / 나를 도와주기 위해 )<br>(알맞은 말 세 개를 차례로 쓰세요)",ans:"의사가 되기 위해, 그 소식을 들어서, 나를 도와주다니",full:"I studied hard to be a doctor. = 나는 의사가 되기 위해 열심히 공부했다. / I was sad to hear the news. = 나는 그 소식을 들어서 슬펐다. / You are very kind to help me. = 나를 도와주다니 너는 매우 친절하구나.",ko:"나는 의사가 되기 위해 열심히 공부했다. / 나는 그 소식을 들어서 슬펐다. / 나를 도와주다니 너는 매우 친절하구나.",
 h:["본책 p.42 ‘2 부사적 용법의 to부정사’의 (1) 목적, (2) 감정의 원인, (4) 판단의 근거를 펴세요.","1) studied hard(열심히 공부했다) 뒤는 공부한 목적이에요.  2) sad(슬픈)는 감정이고, kind(친절한) 뒤는 그렇게 판단한 근거예요.","순서대로 목적, 감정의 원인, 판단의 근거에 맞는 해석을 고르면 돼요."],
 pen:"목적 ~하기 위해 / 감정의 원인 ~해서 / 판단의 근거 ~하다니"});

A(3,"CU",1,"c",{q:"It’s hard for Jack to get up early.",opts:["Jack을 위해 일찍 일어나는 것은 힘들다.","Jack은 일찍 일어나는 것이 힘들다."],ans:"Jack은 일찍 일어나는 것이 힘들다.",full:"It’s hard for Jack to get up early. = Jack은 일찍 일어나는 것이 힘들다.",ko:"Jack은 일찍 일어나는 것이 힘들다.",
 h:["본책 p.44 ‘1 to부정사의 의미상 주어’ 맨 위 설명(「for + 목적격」)을 펴세요.","1) for Jack은 ‘Jack을 위해’가 아니라 to get up(일어나다)을 하는 사람을 알려 줘요.  2) 일찍 일어나는 사람이 Jack이에요.","행동하는 사람이 Jack이니 ‘Jack은 ~ 힘들다’로 해석한 두 번째 보기가 맞아요."],

A(3,"CU",2,"c",{q:"The box is too heavy to move.",opts:["그 상자는 너무 무거워서 옮길 수 없다.","그 상자는 매우 무겁지만 옮길 만하다."],ans:"그 상자는 너무 무거워서 옮길 수 없다.",full:"The box is too heavy to move. = 그 상자는 너무 무거워서 옮길 수 없다.",ko:"그 상자는 너무 무거워서 옮길 수 없다.",
 h:["본책 p.44 ‘2 too + 형용사 / 부사 + to부정사: 너무 ~해서 …할 수 없는’을 펴세요.","1) too heavy(너무 무거운) 뒤에 to move(옮기다)가 이어져요.  2) too ~ to 구문은 ‘할 수 없다’라는 부정의 뜻이 있어요.","‘옮길 수 없다’가 들어 있는 첫 번째 보기가 맞아요."],
 pen:"too + 형용사 + to부정사 = 너무 ~해서 …할 수 없다"});
A(3,"A",1,"c",{q:"The dress is too expensive ( for / of ) her to buy.",opts:["for","of"],ans:"for",full:"The dress is too expensive for her to buy.",ko:"그 드레스는 너무 비싸서 그녀가 살 수 없다.",
 h:["본책 p.44 ‘1 to부정사의 의미상 주어’ 아래 ‘사람의 성격이나 성향을 나타내는 형용사’ 상자를 펴세요.","1) expensive(비싼)는 물건의 가격을 말하지, 사람의 성격을 말하는 말이 아니에요.  2) 성격 형용사가 아니면 의미상 주어는 기본형을 써요.","성격 형용사가 아닐 때 쓰는 기본 전치사 쪽이에요. f로 시작해요."],
 pen:"성격 형용사가 아니면 for + 목적격 (expensive는 성격 X)"});
A(3,"A",2,"c",{q:"This soup is ( too / enough ) hot to eat.",opts:["too","enough"],ans:"too",full:"This soup is too hot to eat.",ko:"이 수프는 너무 뜨거워서 먹을 수 없다.",
 h:["본책 p.44 ‘2 too + 형용사 / 부사 + to부정사’와 ‘3 형용사 / 부사 + enough + to부정사’를 비교해 펴세요.","1) 빈칸은 hot(뜨거운) 앞에 있어요.  2) enough는 형용사 뒤에 오는 말이라서 형용사 앞에 올 수 없어요.","hot 앞에 오는 말은 t로 시작하는 쪽이에요."],
 pen:"too는 형용사 앞 / enough는 형용사 뒤"});
A(3,"A",3,"c",{q:"The ladder is ( long enough / enough long ) to reach the roof.",opts:["long enough","enough long"],ans:"long enough",full:"The ladder is long enough to reach the roof.",ko:"그 사다리는 지붕에 닿을 만큼 충분히 길다.",
 h:["본책 p.44 ‘3 형용사 / 부사 + enough + to부정사’와 아래 ‘시험 to부정사 구문의 어순’ 상자를 펴세요.","1) enough(충분히)는 부사로서 형용사를 뒤에서 꾸며 줘요.  2) 그러니 long(긴)과 enough의 순서가 중요해요.","형용사 long이 먼저 나오는 첫 번째 보기가 맞아요."],
 pen:"형용사 / 부사 + enough + to부정사 (enough는 뒤에)"});
A(3,"A",4,"c",{q:"It was wise ( for / of ) you to make a study plan.",opts:["for","of"],ans:"of",full:"It was wise of you to make a study plan.",ko:"네가 공부 계획을 세운 것은 현명했다.",
 h:["본책 p.44 ‘사람의 성격이나 성향을 나타내는 형용사 (kind, rude, polite, foolish, honest, wise, careful 등)’ 상자를 펴세요.","1) wise(현명한)는 사람의 성격을 나타내는 말이에요.  2) 이런 형용사 다음 의미상 주어는 「of + 목적격」으로 써요.","for가 아닌 o로 시작하는 쪽이에요."],
 pen:"성격 형용사(wise 등) + of + 목적격 + to부정사"});
A(3,"B",1,"w",{q:"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>Jenny was so shy that she couldn’t speak in front of people.<br>→ Jenny was ___ ___ ___ ___ in front of people.",ans:"too, shy, to, speak",full:"Jenny was too shy to speak in front of people.",ko:"Jenny는 너무 수줍어서 사람들 앞에서 말할 수 없었다.",
 h:["본책 p.44 ‘2 too + 형용사 / 부사 + to부정사’와 ‘so ~ that … can’t’로 바꿔 쓰는 설명을 펴세요.","1) so shy that she couldn’t(너무 수줍어서 ~할 수 없었다)는 too ~ to 구문과 같은 뜻이에요.  2) that절의 주어 she가 문장의 주어와 같으니 의미상 주어는 쓰지 않아요.","빈칸 네 개: t로 시작하는 세 글자 / shy(수줍은) / t로 시작하는 두 글자 / speak(말하다)의 원형이에요."],
 pen:"so + 형용사 + that + 주어 + couldn’t = too + 형용사 + to부정사"});
A(3,"B",2,"w",{q:"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>The little boy is so smart that he can solve any problem.<br>→ The little boy is ___ ___ ___ ___ any problem.",ans:"smart, enough, to, solve",full:"The little boy is smart enough to solve any problem.",ko:"그 어린 소년은 어떤 문제든 풀 수 있을 만큼 충분히 똑똑하다.",
 h:["본책 p.44 ‘3 형용사 / 부사 + enough + to부정사’의 so ~ that … can 설명을 펴세요.","1) so smart that he can(너무 똑똑해서 ~할 수 있다)은 ‘~할 만큼 충분히’와 같은 뜻이에요.  2) 형용사 뒤에 enough(충분히)를 붙이고 to부정사를 이어요.","빈칸 네 개: smart(똑똑한) / e로 시작하는 ‘충분히’ / t로 시작하는 두 글자 / solve(풀다)의 원형이에요."],
 pen:"so + 형용사 + that + 주어 + can = 형용사 + enough + to부정사"});
A(3,"B",3,"w",{q:"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>She is tall enough to be a model.<br>→ She is ___ ___ ___ ___ ___ be a model.",ans:"so, tall, that, she, can",full:"She is so tall that she can be a model.",ko:"그녀는 모델이 될 수 있을 만큼 충분히 키가 크다.",
 h:["본책 p.44 ‘3 형용사 / 부사 + enough + to부정사’의 아래쪽 ‘= He is so rich that he can buy the car.’ 부분을 펴세요.","1) enough to를 so ~ that 구문으로 바꿔요.  2) that 뒤에는 주어와 can(~할 수 있다)을 써요. 주어는 문장 주어와 같아요.","빈칸 다섯 개: s로 시작하는 두 글자 / tall(키가 큰) / t로 시작하는 접속사 / 주어 She를 받는 대명사 / ‘~할 수 있다’ 조동사예요."],
 pen:"형용사 + enough + to부정사 = so + 형용사 + that + 주어 + can"});
A(3,"B",4,"w",{q:"두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>It was too noisy for us to fall asleep.<br>→ It was ___ ___ ___ ___ ___ fall asleep.",ans:"so, noisy, that, we, couldn’t",full:"It was so noisy that we couldn’t fall asleep.",ko:"너무 시끄러워서 우리는 잠들 수 없었다.",
 h:["본책 p.44 ‘의미상 주어가 있는 to부정사 구문을 that절로 전환할 때는 의미상 주어가 that절의 주어가 된다’ 상자를 펴세요.","1) for us(우리가)가 의미상 주어이니 that절의 주어는 we예요.  2) 문장이 was(원형 be 이다)로 과거이니 can’t가 아니라 과거형을 써요.","빈칸 다섯 개: s로 시작하는 두 글자 / noisy(시끄러운) / t로 시작하는 접속사 / us의 주격 / can’t의 과거형이에요."],
 pen:"too ~ for A to ~ = so ~ that A couldn’t ~ (과거는 couldn’t)"});
A(3,"C",1,"w",{q:"내가 그에게 돈을 빌려준 것은 어리석었다. (me, lend, foolish, of, to)<br>→ It was ___ him money.",ans:"foolish of me to lend",full:"It was foolish of me to lend him money.",ko:"내가 그에게 돈을 빌려준 것은 어리석었다.",
 h:["본책 p.44 ‘사람의 성격이나 성향을 나타내는 형용사’ 상자의 It was nice of you to help us. 예문을 펴세요.","1) foolish(어리석은)는 사람의 성격을 나타내는 말이에요.  2) 성격 형용사 다음에는 「of + 목적격」을 쓰고 그 뒤에 to + 동사원형이 와요.","네 단어예요. foolish(어리석은)로 시작해서 lend(빌려주다)로 끝나요. 가운데 전치사는 for가 아니에요."],
 pen:"It was + 성격 형용사 + of + 목적격 + to + 동사원형"});
A(3,"C",2,"w",{q:"그 소방관들은 너무 바빠서 점심을 먹을 수가 없었다. (busy, too, have, lunch, to)<br>→ The firefighters were ___.",ans:"too busy to have lunch",full:"The firefighters were too busy to have lunch.",ko:"그 소방관들은 너무 바빠서 점심을 먹을 수가 없었다.",
 h:["본책 p.44 ‘2 too + 형용사 / 부사 + to부정사’ 설명을 펴세요.","1) ‘너무 바빠서 ~할 수 없는’은 too를 형용사 앞에 써요.  2) to부정사는 형용사 바로 뒤에 이어요.","다섯 단어예요. too로 시작하고 lunch(점심)로 끝나요. busy(바쁜)는 too 바로 뒤에 와요."],
 pen:"too + 형용사 + to + 동사원형"});
A(3,"C",3,"w",{q:"그 영화는 다시 볼 만큼 충분히 재미있다. (enough, watch, interesting, to)<br>→ The movie is ___ again.",ans:"interesting enough to watch",full:"The movie is interesting enough to watch again.",ko:"그 영화는 다시 볼 만큼 충분히 재미있다.",
 h:["본책 p.44 ‘3 형용사 / 부사 + enough + to부정사’ 설명을 펴세요.","1) ‘~할 만큼 충분히 …한’에서 enough는 형용사 뒤에 와요.  2) 그 뒤에 to부정사를 붙여요.","네 단어예요. interesting(재미있는)으로 시작하고 watch(보다)로 끝나요. enough는 형용사 바로 뒤예요."],
 pen:"형용사 + enough + to + 동사원형"});
A(3,"MP",1,"w",{q:"의미상 주어<br>It’s impossible ___ me to carry it alone.<br>It was kind ___ her to help me.<br>(알맞은 말 두 개를 차례로 쓰세요)",ans:"for, of",full:"It’s impossible for me to carry it alone. / It was kind of her to help me.",ko:"내가 그것을 혼자 나르는 것은 불가능하다. / 나를 돕다니 그녀는 친절했다.",
 h:["본책 p.44 ‘1 to부정사의 의미상 주어’ 설명과 ‘사람의 성격이나 성향을 나타내는 형용사’ 상자를 펴세요.","1) impossible(불가능한)은 성격을 나타내지 않아요.  2) kind(친절한)는 사람의 성격을 나타내요.","첫째 빈칸은 기본형, 둘째 빈칸은 성격 형용사 뒤에 쓰는 말이에요."],
 pen:"기본 for + 목적격 / 성격 형용사(kind) + of + 목적격"});
A(3,"MP",2,"w",{q:"to부정사 구문<br>I am ___ full ___ eat more.<br>He ran fast ___ ___ catch the bus.<br>(빈칸 네 개를 차례로 쓰세요. 첫 줄 빈칸 둘, 둘째 줄 빈칸 둘)",ans:"too, to, enough, to",full:"I am too full to eat more. / He ran fast enough to catch the bus.",ko:"나는 너무 배불러서 더 먹을 수 없다. / 그는 버스를 잡을 만큼 충분히 빨리 달렸다.",
 h:["본책 p.44 ‘2 too + 형용사 / 부사 + to부정사’와 ‘3 형용사 / 부사 + enough + to부정사’를 펴세요.","1) 첫 문장은 full(배부른) 앞에 오는 말과 eat more(더 먹다) 앞의 말이 필요해요.  2) 둘째 문장은 fast(빨리) 뒤에 오는 부사와 to가 필요해요.","첫 문장 빈칸 둘은 모두 t로 시작해요(세 글자 하나, 두 글자 하나). 둘째 문장은 e로 시작하는 말 다음에 t로 시작하는 두 글자가 와요."],
 pen:"too + 형용사 + to ~ / 형용사(부사) + enough + to ~"});

A("SW","SW",1,"w",{q:"[빈칸 완성] 두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>To exercise every day is not easy.<br>→ ___ is not easy ___ ___ every day.",ans:"It, to, exercise",full:"It is not easy to exercise every day.",ko:"매일 운동하는 것은 쉽지 않다.",
 h:["본책 p.40 ‘주어로 쓰인 to부정사(구)는 가주어 it으로 바꿔 쓸 수 있다’ 부분을 펴세요.","1) 긴 주어 To exercise every day가 문장 맨 앞에 있어요.  2) 가짜 주어를 앞에 쓰고 진짜 주어는 뒤로 보내요.","빈칸 세 개 중 첫 칸은 I로 시작하고 마지막 칸은 exercise(운동하다)예요."],
 pen:"To + 동사원형 ~ is ... = It is ... to + 동사원형 ~"});
A("SW","SW",2,"w",{q:"[빈칸 완성] 두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>Let’s decide when we should leave for vacation.<br>→ Let’s decide ___ ___ ___ for vacation.",ans:"when, to, leave",full:"Let’s decide when to leave for vacation.",ko:"휴가를 언제 떠날지 정하자.",
 h:["본책 p.40 ‘2 의문사 + to부정사’의 when + to부정사(언제 ~할지)를 펴세요.","1) when(언제)은 그대로 둬요.  2) we should(우리는 ~해야 한다)를 to로 바꿔요.","빈칸 세 개 중 첫 칸은 w로 시작하고 마지막 칸은 leave(떠나다)예요."],
 pen:"when + 주어 + should + 동사원형 = when + to부정사"});
A("SW","SW",3,"w",{q:"[빈칸 완성] 두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>I was so busy that I couldn’t help you yesterday.<br>→ I was ___ ___ ___ ___ you yesterday.",ans:"too, busy, to, help",full:"I was too busy to help you yesterday.",ko:"나는 너무 바빠서 어제 너를 도울 수 없었다.",
 h:["본책 p.44 ‘2 too + 형용사 / 부사 + to부정사’ 설명(I was too busy to wash the dishes.)을 펴세요.","1) so busy that I couldn’t(너무 바빠서 ~할 수 없었다)는 too ~ to와 같은 뜻이에요.  2) that절의 주어는 I로 문장 주어와 같아서 의미상 주어는 필요 없어요.","빈칸 네 개: t로 시작하는 세 글자 / busy(바쁜) / t로 시작하는 두 글자 / help(돕다)의 원형이에요."],
 pen:"so ~ that + 주어 + couldn’t = too ~ to"});
A("SW","SW",4,"w",{q:"[빈칸 완성] 두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>The man is rich enough to buy the island.<br>→ The man is ___ ___ ___ he ___ ___ the island.",ans:"so, rich, that, can, buy",full:"The man is so rich that he can buy the island.",ko:"그 남자는 그 섬을 살 수 있을 만큼 충분히 부유하다.",
 h:["본책 p.44 ‘3 형용사 / 부사 + enough + to부정사’ 아래 ‘= He is so rich that he can buy the car.’ 부분을 펴세요.","1) ‘충분히 ~해서 …할 수 있다’는 so ~ that … can으로 바꿔요.  2) 이미 that 뒤에 he가 인쇄돼 있고, 그 뒤에 can과 동사를 써요.","빈칸 다섯 개: s로 시작하는 두 글자 / rich(부유한) / t로 시작하는 접속사 / ‘~할 수 있다’ 조동사 / buy(사다)의 원형이에요."],
 pen:"형용사 + enough + to부정사 = so + 형용사 + that + 주어 + can"});
A("SW","SW",5,"w",{q:"[오류 수정] 어법에 맞게 문장을 고쳐 쓰시오. (밑줄 친 부분을 고쳐 쓰세요)<br>My brother is <u>enough old to sleep</u> alone.",ans:"old enough to sleep",full:"My brother is old enough to sleep alone.",ko:"내 남동생은 혼자 잘 만큼 충분히 나이가 들었다.",
 h:["본책 p.44 ‘시험 to부정사 구문의 어순’ 상자(enough는 수식하는 형용사나 부사 뒤에 와야 한다)를 펴세요.","1) enough(충분히)가 old(나이가 든) 앞에 있어서 어순이 틀렸어요.  2) enough는 꾸며 주는 형용사 뒤에 써요.","old와 enough의 자리를 바꿔요. o로 시작하는 말이 먼저예요."],
 pen:"enough는 형용사 뒤 (old enough to ~)"});
A("SW","SW",6,"w",{q:"[오류 수정] 어법에 맞게 문장을 고쳐 쓰시오. (밑줄 친 부분을 고쳐 쓰세요)<br>Please lend me <u>a pen to write</u>.",ans:"a pen to write with",full:"Please lend me a pen to write with.",ko:"쓸 펜 하나만 빌려주세요.",
 h:["본책 p.42 ‘(2) 명사 + to부정사 + 전치사’의 a pen to write with 부분을 펴세요.","1) 펜(pen)은 ‘~을 가지고 쓴다’의 목적어예요.  2) to write(쓰다)만 있으면 전치사가 빠져요.","to write 뒤에 w로 시작하는 전치사를 붙여요."],
 pen:"a pen to write with (전치사 with 필수)"});
A("SW","SW",7,"w",{q:"[오류 수정] 어법에 맞게 문장을 고쳐 쓰시오. (밑줄 친 부분을 고쳐 쓰세요)<br>It was honest <u>for you to admit</u> your mistake.",ans:"of you to admit",full:"It was honest of you to admit your mistake.",ko:"네가 너의 실수를 인정한 것은 정직했다.",
 h:["본책 p.44 ‘사람의 성격이나 성향을 나타내는 형용사 (kind, rude, polite, foolish, honest, wise, careful 등)’ 상자를 펴세요.","1) honest(정직한)는 사람의 성격을 나타내요.  2) 그러면 의미상 주어를 이끄는 말이 기본형(for)에서 바뀌어야 해요.","for 대신 o로 시작하는 두 글자 전치사를 써요."],
 pen:"honest 같은 성격 형용사 + of + 목적격 + to부정사"});
A("SW","SW",8,"w",{q:"[오류 수정] 어법에 맞게 문장을 고쳐 쓰시오. (밑줄 친 부분을 고쳐 쓰세요)<br>I have <u>interesting something to tell</u> you.",ans:"something interesting to tell",full:"I have something interesting to tell you.",ko:"너에게 말해 줄 흥미로운 것이 있어.",
 h:["본책 p.42 ‘-thing, -one, -body로 끝나는 대명사를 형용사와 to부정사가 같이 수식할 때’ 상자를 펴세요.","1) something(무언가)은 -thing으로 끝나는 대명사예요.  2) 이런 대명사는 형용사가 대명사 뒤에 와요.","s로 시작하는 대명사를 맨 앞으로 옮기고, 형용사는 그 바로 뒤에, to부정사는 맨 끝에 둬요."],
 pen:"-thing + 형용사 + to부정사"});
A("SW","SW",9,"w",{q:"[배열 영작] 괄호 안의 말을 바르게 배열하시오. (dogs, to, is, train)<br>그의 직업은 개를 훈련시키는 것이다.<br>→ His job ___.",ans:"is to train dogs",full:"His job is to train dogs.",ko:"그의 직업은 개를 훈련시키는 것이다.",
 h:["본책 p.40 ‘(3) 보어 역할: ~하는 것(이다)’ 부분을 펴세요.","1) His job(그의 직업) 다음에 is(원형 be 이다)가 와요.  2) ‘~하는 것’은 to + 동사원형으로 이어요.","네 단어예요. be동사로 시작하고 dogs(개들)로 끝나요. train(훈련시키다) 앞에 무엇이 와야 할까요?"],
 pen:"주어 + is + to + 동사원형 (보어)"});
A("SW","SW",10,"w",{q:"[배열 영작] 괄호 안의 말을 바르게 배열하시오. (fast food, not, agreed, eat, to)<br>우리는 패스트푸드를 너무 자주 먹지 않기로 동의했다.<br>→ We ___ too often.",ans:"agreed not to eat fast food",full:"We agreed not to eat fast food too often.",ko:"우리는 패스트푸드를 너무 자주 먹지 않기로 동의했다.",
 h:["본책 p.40 ‘to부정사의 부정은 to 바로 앞에 not을 써서 표현한다’ 상자를 펴세요.","1) agreed(원형 agree 동의하다) 뒤에 할 일이 와요.  2) ‘~하지 않기로’는 not을 to 바로 앞에 써요.","agreed(원형 agree 동의하다)로 시작하고 fast food(패스트푸드)로 끝나요. not을 어디에 둘지가 핵심이에요."],
 pen:"동사 + not + to + 동사원형 (to부정사의 부정)"});
A("SW","SW",11,"w",{q:"[배열 영작] 괄호 안의 말을 바르게 배열하시오. (to, hear, you, from, pleased)<br>나는 너로부터 소식을 듣게 되어 기쁘다.<br>→ I’m ___.",ans:"pleased to hear from you",full:"I’m pleased to hear from you.",ko:"나는 너로부터 소식을 듣게 되어 기쁘다.",
 h:["본책 p.42 ‘(2) 감정의 원인: ~해서, ~하여’ 부분을 펴세요.","1) pleased(기쁜)는 감정을 나타내요.  2) 감정이 생긴 이유는 to + 동사원형으로 그 뒤에 이어요.","다섯 단어예요. pleased(기쁜)로 시작하고 you(너)로 끝나요. hear from(~로부터 소식을 듣다)은 붙어 다녀요."],
 pen:"감정 형용사 + to + 동사원형 = ~해서"});
A("SW","SW",12,"w",{q:"[배열 영작] 괄호 안의 말을 바르게 배열하시오. (difficult, me, read, for, to, too)<br>이 책은 내가 읽기에 너무 어렵다.<br>→ This book is ___.",ans:"too difficult for me to read",full:"This book is too difficult for me to read.",ko:"이 책은 내가 읽기에 너무 어렵다.",
 h:["본책 p.44 ‘2 too + 형용사 / 부사 + to부정사’의 The question was too hard for me to solve. 예문을 펴세요.","1) ‘너무 ~해서 …할 수 없는’은 too를 형용사 앞에 써요.  2) 의미상 주어 for me는 to부정사 바로 앞에 와요.","여섯 단어예요. too로 시작하고 read(읽다)로 끝나요. for me는 to 바로 앞에 와요."],
 pen:"too + 형용사 + for + 목적격 + to + 동사원형"});

 pen:"명사 뒤 to부정사 = ~할 (형용사적) / 목적어·보어 = ~하는 것 (명사적)"}); }
A("PT","PT",2,"w",{q:"(출제 포인트 1, 고득점 POINT 가주어 it을 이용한 문장) 두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.<br>To get a perfect score is hard.<br>→ It ___ ___ ___ ___ a perfect score.",ans:"is, hard, to, get",full:"It is hard to get a perfect score.",ko:"만점을 받는 것은 어렵다.",

 pen:"To + 동사원형 ~ is hard = It is hard to + 동사원형 ~"});

A("PT","PT",4,"w",{q:"(출제 포인트 2, 고득점 POINT -thing, -body, -one으로 끝나는 대명사를 수식하는 to부정사의 위치) 괄호 안의 말을 이용하여 우리말을 영작하시오. (warm, anything, wear)<br>입을 따뜻한 무언가가 있나요?<br>→ Do you have ___?",ans:"anything warm to wear",full:"Do you have anything warm to wear?",ko:"입을 따뜻한 무언가가 있나요?",
 h:["본책 p.42 ‘-thing, -one, -body로 끝나는 대명사를 형용사와 to부정사가 같이 수식할 때’ 상자를 펴세요.","1) anything(무언가)은 -thing으로 끝나는 대명사예요.  2) 이런 대명사 뒤에 형용사(warm 따뜻한)를 먼저 쓰고 그다음에 to부정사를 써요.","네 단어예요. a로 시작하는 대명사가 맨 앞, wear(입다)가 맨 끝이에요. warm(따뜻한)은 어디에 둘까요?"],

A("T","T",21,"w",{q:"[서술형] [21-22] 다음 문장에서 어법상 틀린 부분을 찾아 바르게 고쳐 쓰시오.<br>(출제 포인트 3)<br>It was foolish for her to forget her father’s birthday.<br>→ 틀린 부분: ___  →  바르게: ___",ans:"for, of",full:"It was foolish of her to forget her father’s birthday.",ko:"아버지의 생신을 잊다니 그녀는 어리석었다.",

A("T","T",26,"w",{q:"[서술형] [26] 우리말과 일치하도록 괄호 안의 말을 바르게 배열하여 문장을 완성하시오.<br>(1) 그 피자는 우리가 나눠 먹을 만큼 충분히 크다. (enough, share, us, to, for, large)<br>→ The pizza is ___.<br>(2) 이야기할 현명한 누군가가 있는 것은 도움이 된다. (to, to, talk, someone, wise)<br>→ It’s helpful to have ___.<br>(두 문장의 빈칸을 차례로 쓰세요)",ans:"large enough for us to share, someone wise to talk to",full:"(1) The pizza is large enough for us to share. / (2) It’s helpful to have someone wise to talk to.",ko:"(1) 그 피자는 우리가 나눠 먹을 만큼 충분히 크다. / (2) 이야기할 현명한 누군가가 있는 것은 도움이 된다.",

 pen:"깨진(수동·완료) = 과거분사 broken (fallen leaves처럼)"});
A(1,"CU",2,"c",{q:"Amy와 이야기하고 있는 남자아이",opts:["a boy talking with Amy","a boy talked with Amy"],ans:"a boy talking with Amy",full:"a boy talking with Amy = Amy와 이야기하고 있는 남자아이",ko:"Amy와 이야기하고 있는 남자아이",
 h:["본책 p.66 ‘2 분사의 역할’의 (1) 명사 수식, 그중 ‘명사 뒤에서 수식’하는 예(a window broken by a baseball)를 펴세요.","1) ‘이야기하고 있는’은 지금 진행 중인 모습이에요.  2) 진행·능동의 뜻은 현재분사(동사원형 + -ing)로 나타내요. 수식어구(with Amy)가 있으면 명사 뒤에 와요.","-ing로 끝나는 talking이 있는 쪽이에요."],
 pen:"~하고 있는(진행·능동) = 현재분사 -ing, 수식어구가 있으면 명사 뒤"});
A(1,"CU",3,"c",{q:"충격적인 사건",opts:["a shocking event","a shocked event"],ans:"a shocking event",full:"a shocking event = 충격적인 사건",ko:"충격적인 사건",
 h:["본책 p.66 ‘3 감정을 나타내는 분사’의 표와 설명을 펴세요.","1) ‘사건’이 사람에게 충격을 주는 쪽일까요, 충격을 받는 쪽일까요?  2) 주어·명사가 감정을 일으키면 현재분사, 감정을 느끼면 과거분사예요.","충격을 ‘일으키는’ 사건이니 -ing 모양이 맞아요. shocking(충격적인)이 있는 쪽이에요."],
 pen:"감정을 일으키는 것 = 현재분사 (shocking 충격적인)"});
A(1,"A",1,"c",{q:"I want to eat ( frying / fried ) chicken.",opts:["frying","fried"],ans:"fried",full:"I want to eat fried chicken.",ko:"나는 튀긴 치킨을 먹고 싶다.",
 h:["본책 p.66 ‘1 분사의 종류’ 표(능동·진행 / 수동·완료)를 펴세요.","1) 치킨이 스스로 튀기는 걸까요, 사람이 튀겨 놓은 걸까요?  2) fry(원형 fry 튀기다)한 결과로 ‘튀겨진’ 것이니 수동·완료예요.","수동·완료는 과거분사예요. -ing가 아닌 쪽을 고르세요."],
 pen:"튀겨진 치킨 = 수동 → 과거분사 fried"});
A(1,"A",2,"c",{q:"Do you know the ( crying / cried ) girl?",opts:["crying","cried"],ans:"crying",full:"Do you know the crying girl?",ko:"너는 그 우는 소녀를 아니?",
 h:["본책 p.66 ‘2 분사의 역할’ (1) 명사 수식(a dancing boy)을 펴세요.","1) 소녀(girl)가 울고 있는 중이에요. 능동·진행의 뜻이에요.  2) cry(원형 cry 울다)하는 중이라는 뜻이니 현재분사를 써요.","명사 앞에서 꾸며 주는 -ing 모양이에요. crying 쪽이에요."],
 pen:"우는(진행·능동) = 현재분사 crying + 명사"});
A(1,"A",3,"c",{q:"We’re ( pleasing / pleased ) to see him again.",opts:["pleasing","pleased"],ans:"pleased",full:"We’re pleased to see him again.",ko:"우리는 그를 다시 만나서 기쁘다.",
 h:["본책 p.66 ‘3 감정을 나타내는 분사’ 표에서 pleasing(기쁘게 하는)과 pleased(기쁜)를 펴세요.","1) 주어 We(우리)는 기쁨을 일으키는 쪽일까요, 느끼는 쪽일까요?  2) 사람이 감정을 느낄 때는 과거분사를 써요.","느끼는 쪽은 -ed 모양이에요. p로 시작하고 d로 끝나는 말이에요."],
 pen:"사람이 감정을 느낌 = 과거분사 (pleased 기쁜)"});
A(1,"A",4,"c",{q:"It’s important to have a ( satisfying / satisfied ) job.",opts:["satisfying","satisfied"],ans:"satisfying",full:"It’s important to have a satisfying job.",ko:"만족스러운 직업을 갖는 것은 중요하다.",
 h:["본책 p.66 ‘3 감정을 나타내는 분사’ 표에서 satisfying과 satisfied를 비교하세요.","1) 꾸밈을 받는 말은 job(직업)이에요. 직업이 만족감을 느낄까요, 만족감을 줄까요?  2) 감정을 일으키는 대상에는 현재분사를 써요.","job(직업)은 만족감을 ‘주는’ 쪽이에요. -ing로 끝나는 보기예요."],
 pen:"감정을 일으키는 대상 = 현재분사 (satisfying 만족스러운)"});
A(1,"A",5,"c",{q:"The ring ( finding / found ) under the bed was mine.",opts:["finding","found"],ans:"found",full:"The ring found under the bed was mine.",ko:"침대 밑에서 발견된 반지는 내 것이었다.",
 h:["본책 p.66 ‘2 분사의 역할’ (1) 명사 수식에서 ‘수식어구와 함께 쓰이면 명사 뒤’(a window broken by a baseball)를 펴세요.","1) 반지(ring)가 스스로 찾는 걸까요, 누군가에게 발견된 걸까요?  2) find(원형 find 찾다)의 대상이 반지이니 수동의 뜻이에요.","수동이니 과거분사예요. f로 시작하고 d로 끝나는 말이에요."],
 pen:"발견된(수동) = 과거분사 found (find의 과거분사)"});
A(1,"B",1,"w",{q:"That was a really ___ story. (amaze)",ans:"amazing",full:"That was a really amazing story.",ko:"그것은 정말 놀라운 이야기였다.",
 h:["본책 p.66 ‘3 감정을 나타내는 분사’ 표에서 amazing(놀라운)과 amazed(놀란)를 펴세요.","1) 꾸밈을 받는 말은 story(이야기)예요.  2) 이야기는 놀라움을 느끼는 게 아니라 놀라움을 일으키는 쪽이에요.","amaze(원형 amaze 놀라게 하다)에 -ing를 붙인 말이에요. a로 시작해요."],
 pen:"감정을 일으키는 대상 = 현재분사 (amazing 놀라운)"});
A(1,"B",2,"w",{q:"I bought a bag ___ in Italy. (make)",ans:"made",full:"I bought a bag made in Italy.",ko:"나는 이탈리아에서 만들어진 가방을 샀다.",
 h:["본책 p.66 ‘2 분사의 역할’ (1) 명사 수식에서 명사 뒤에서 수식하는 경우(a window broken by a baseball)를 펴세요.","1) 가방(bag)이 만드는 걸까요, 만들어진 걸까요?  2) ‘~에서 만들어진’은 수동이니 과거분사를 써요. make(원형 make 만들다)는 불규칙이에요.","m으로 시작하는 네 글자예요. 과거형과 같은 모양이에요."],
 pen:"만들어진(수동) = 과거분사 made, 수식어구(in Italy)와 함께 명사 뒤"});
A(1,"B",3,"w",{q:"She was ___ to hear the news. (shock)",ans:"shocked",full:"She was shocked to hear the news.",ko:"그녀는 그 소식을 듣고 충격을 받았다.",
 h:["본책 p.66 ‘3 감정을 나타내는 분사’ 표에서 shocking(충격적인)과 shocked(충격 받은)를 펴세요.","1) 주어 She(그녀)는 충격을 주는 쪽일까요, 받는 쪽일까요?  2) 사람이 감정을 느끼면 과거분사를 써요.","shock(원형 shock 충격을 주다)에 -ed를 붙인 말이에요. s로 시작해요."],
 pen:"사람이 감정을 느낌 = 과거분사 (shocked 충격 받은)"});
A(1,"B",4,"w",{q:"He likes the picture ___ by his daughter. (draw)",ans:"drawn",full:"He likes the picture drawn by his daughter.",ko:"그는 딸이 그린 그림을 좋아한다.",
 h:["본책 p.66 ‘2 분사의 역할’ (1) 명사 수식에서 ‘by ~’ 같은 수식어구가 붙으면 명사 뒤에 쓰는 예를 펴세요.","1) 그림(picture)은 딸에 의해 그려진 것이에요. 수동의 뜻이에요.  2) draw(원형 draw 그리다)는 불규칙 동사라서 과거분사가 -ed가 아니에요. draw - drew - ?","d로 시작해서 n으로 끝나는 말이에요."],
 pen:"그려진(수동) = 과거분사 drawn (draw - drew - drawn)"});
A(1,"B",5,"w",{q:"The cat ___ on the sofa is so cute. (sleep)",ans:"sleeping",full:"The cat sleeping on the sofa is so cute.",ko:"소파에서 자고 있는 고양이는 정말 귀엽다.",
 h:["본책 p.66 ‘2 분사의 역할’ (1) 명사 수식(명사 뒤에서 수식)을 펴세요.","1) 고양이(cat)가 자고 있는 중이에요. 능동·진행의 뜻이에요.  2) sleep(원형 sleep 자다)을 현재분사로 바꾸고 on the sofa(소파 위에서)와 함께 명사 뒤에 둬요.","sleep에 -ing를 붙인 말이에요. s로 시작해요."],
 pen:"자고 있는(능동·진행) = 현재분사 sleeping, 수식어구가 있으면 명사 뒤"});
A(1,"C",1,"w",{q:"James는 그의 잃어버린 강아지를 찾고 있다. (lose, puppy)<br>→ James is looking for ___ ___ ___.",ans:"his lost puppy",full:"James is looking for his lost puppy.",ko:"James는 그의 잃어버린 강아지를 찾고 있다.",
 h:["본책 p.66 ‘2 분사의 역할’ (1) 명사 수식에서 ‘분사만 있는 경우는 명사 앞에서 수식’(a dancing boy)을 펴세요.","1) 빈칸 세 개에 ‘그의’, ‘잃어버린’, ‘강아지’를 차례로 넣어요.  2) 강아지는 잃어버림을 당한 것이니 lose(원형 lose 잃다)의 과거분사를 써요. 분사 하나만 있으니 명사 앞에 와요.","순서는 소유격 + 과거분사 + 명사예요. 첫 칸은 h로 시작하고, 둘째 칸은 l로 시작해요."],
 pen:"잃어버린(수동) = 과거분사 lost + 명사 (분사 하나면 명사 앞)"});
A(1,"C",2,"w",{q:"나는 영어로 쓰인 편지 한 통을 발견했다. (letter, write)<br>→ I found ___ ___ ___ in English.",ans:"a letter written",full:"I found a letter written in English.",ko:"나는 영어로 쓰인 편지 한 통을 발견했다.",
 h:["본책 p.66 ‘2 분사의 역할’ (1) 명사 수식에서 ‘수식어구와 함께 쓰이면 명사 뒤’(a window broken by a baseball)를 펴세요.","1) 빈칸 세 개에 ‘한 통의’, ‘편지’, ‘쓰인’을 차례로 넣어요.  2) 편지는 쓰여진 것이니 수동이에요. in English(영어로)라는 수식어구가 있어서 분사는 명사 뒤에 가요.","첫 칸은 a, 둘째 칸은 l로 시작하는 명사, 셋째 칸은 write(원형 write 쓰다)의 과거분사 w로 시작하는 말이에요."],
 pen:"쓰인(수동) = 과거분사 written, 수식어구(in English)가 있으면 명사 뒤"});
A(1,"C",3,"w",{q:"나는 무대에서 드럼을 치고 있는 그 남자를 안다. (man, play)<br>→ I know ___ ___ ___ the drums on the stage.",ans:"the man playing",full:"I know the man playing the drums on the stage.",ko:"나는 무대에서 드럼을 치고 있는 그 남자를 안다.",
 h:["본책 p.66 ‘2 분사의 역할’ (1) 명사 수식에서 수식어구와 함께 쓰이면 명사 뒤에서 수식하는 규칙을 펴세요.","1) 빈칸 세 개에 ‘그’, ‘남자’, ‘치고 있는’을 차례로 넣어요.  2) 남자가 드럼을 치고 있는 중이니 능동·진행이에요. play(원형 play 연주하다)를 현재분사로 바꿔요.","첫 칸은 t로 시작하는 한정사, 둘째 칸은 m으로 시작하는 명사, 셋째 칸은 play에 -ing를 붙인 말이에요."],
 pen:"치고 있는(능동·진행) = 현재분사 playing, the drums … 수식어구가 있으면 명사 뒤"});
A(1,"MP",1,"w",{q:"[30초 완성 ① 현재분사] singing birds = ___ 새들",ans:"노래하고 있는",full:"singing birds = 노래하고 있는 새들",ko:"노래하고 있는 새들",
 h:["본책 p.66 ‘1 분사의 종류’ 표에서 현재분사(능동·진행: ~하는, ~하고 있는)를 펴세요.","1) singing은 sing(원형 sing 노래하다)에 -ing를 붙인 현재분사예요.  2) 현재분사는 능동·진행의 뜻이니 ‘~하고 있는’이라고 풀어요.","‘노래’로 시작해서 ‘는’으로 끝나는 말이에요. 새들이 지금 노래하는 중이에요."],
 pen:"현재분사 = ~하는, ~하고 있는 (능동·진행)"});
A(1,"MP",2,"w",{q:"[30초 완성 ② 과거분사] a man caught by the police = 경찰에게 ___ 남자",ans:"잡힌",full:"a man caught by the police = 경찰에게 잡힌 남자",ko:"경찰에게 잡힌 남자",
 h:["본책 p.66 ‘1 분사의 종류’ 표에서 과거분사(수동·완료: ~된, ~한)를 펴세요.","1) caught는 catch(원형 catch 잡다)의 과거분사예요.  2) by the police(경찰에 의해)가 있으니 수동의 뜻이에요.","‘~되다, ~당하다’ 뜻을 담아 두 글자로 써요. ‘잡’으로 시작해요."],
 pen:"과거분사 = ~된, ~당한 (수동·완료)"});
A(1,"MP",3,"w",{q:"[30초 완성 ③ 감정을 나타내는 분사] We were ( exciting / excited ) to watch the movie.<br>The game was ( exciting / excited ).<br>(알맞은 말 두 개를 차례로 쓰세요)",ans:"excited, exciting",full:"We were excited to watch the movie. / The game was exciting.",ko:"우리는 그 영화를 보게 되어 신이 났다. / 그 경기는 흥미진진했다.",
 h:["본책 p.66 ‘3 감정을 나타내는 분사’ 설명과 표(exciting 흥미진진한 / excited 신이 난)를 펴세요.","1) 첫 문장의 주어 We(우리)는 감정을 느끼는 사람이에요.  2) 둘째 문장의 주어 The game(경기)은 감정을 일으키는 쪽이에요.","첫째 빈칸은 -ed 모양, 둘째 빈칸은 -ing 모양이에요."],
 pen:"사람이 느낌 = 과거분사 excited / 대상이 일으킴 = 현재분사 exciting"});

// ===================== UNIT 02 (p.69) =====================
A(2,"CU",1,"c",{q:"<u>Having no time</u>, I couldn’t help you.",opts:["시간이 없어도","시간이 없었기 때문에"],ans:"시간이 없었기 때문에",full:"Having no time, I couldn’t help you. = 시간이 없었기 때문에 나는 너를 도울 수 없었다.",ko:"시간이 없었기 때문에 나는 너를 도울 수 없었다.",
 h:["본책 p.68 ‘2 분사구문의 여러 가지 의미’의 (2) 이유(~ 때문에) 예문(Feeling tired, he took a nap.)을 펴세요.","1) 앞부분 Having no time(시간이 없는)과 뒷부분 I couldn’t help you(너를 도울 수 없었다)의 관계를 보세요.  2) 시간이 없는 것이 도울 수 없었던 원인이에요.","원인과 결과의 관계예요. ‘~ 때문에’ 뜻이 들어간 보기가 답이에요."],
 pen:"분사구문이 원인·결과 관계 = 이유(~ 때문에)"});
A(2,"CU",2,"c",{q:"<u>Finishing my homework</u>, I started to watch TV.",opts:["숙제를 끝낸 후에","숙제를 끝내지 않아도"],ans:"숙제를 끝낸 후에",full:"Finishing my homework, I started to watch TV. = 숙제를 끝낸 후에 나는 TV를 보기 시작했다.",ko:"숙제를 끝낸 후에 나는 TV를 보기 시작했다.",
 h:["본책 p.68 ‘2 분사구문의 여러 가지 의미’의 (1) 시간 예문(Seeing my brother, I waved to him.)을 펴세요.","1) 숙제를 끝내는 일과 TV를 보기 시작하는 일 중 어느 쪽이 먼저일까요?  2) finish(원형 finish 끝내다)는 먼저 일어난 일이고, 분사구문은 때를 나타낼 수 있어요.","시간 순서(~한 후에)를 나타내요. finish를 부정하는 not이 없다는 점도 보세요."],

A(2,"A",1,"w",{q:"밑줄 친 부분을 분사구문으로 바꿔 쓸 때 빈칸에 알맞은 말을 쓰시오.<br><u>While he walked his dog</u>, he met Sumin.<br>→ ___ his dog, he met Sumin.",ans:"Walking",full:"Walking his dog, he met Sumin.",ko:"개를 산책시키다가 그는 Sumin을 만났다.",

A(2,"A",2,"w",{q:"밑줄 친 부분을 분사구문으로 바꿔 쓸 때 빈칸에 알맞은 말을 쓰시오.<br><u>Because she had a headache</u>, she took some medicine.<br>→ ___ a headache, she took some medicine.",ans:"Having",full:"Having a headache, she took some medicine.",ko:"그녀는 두통이 있어서 약을 먹었다.",

A(2,"A",3,"w",{q:"밑줄 친 부분을 분사구문으로 바꿔 쓸 때 빈칸에 알맞은 말을 쓰시오.<br><u>As they were hungry</u>, they went to a fast-food restaurant.<br>→ ___ hungry, they went to a fast-food restaurant.",ans:"Being",full:"Being hungry, they went to a fast-food restaurant.",ko:"그들은 배가 고파서 패스트푸드점에 갔다.",

A(2,"B",1,"w",{q:"자연스러운 문장이 되도록 빈칸에 알맞은 분사구문을 <보기>에서 골라 그 기호를 쓰시오.<br>보기: ⓐ Before spending money  ⓑ After having dinner  ⓒ Staying in New York  ⓓ Studying hard for the test<br>1 ___ , we visited a lot of places.",ans:"ⓒ",full:"ⓒ Staying in New York, we visited a lot of places.",ko:"뉴욕에 머무르는 동안 우리는 많은 곳을 방문했다.",
 h:["본책 p.68 ‘2 분사구문의 여러 가지 의미’의 (1) 시간과 (3) 동시 동작 예문을 펴세요.","1) 뒤 문장은 we visited a lot of places(우리는 많은 곳을 방문했다)예요.  2) 방문한 장소와 어울리는 앞부분을 보기에서 찾아요. stay(원형 stay 머무르다)가 어울리는지 보세요.","‘어디에 머무는 동안’이라는 뜻이 되는 보기예요. 도시 이름이 들어 있어요."],

A(2,"B",2,"w",{q:"자연스러운 문장이 되도록 빈칸에 알맞은 분사구문을 <보기>에서 골라 그 기호를 쓰시오.<br>보기: ⓐ Before spending money  ⓑ After having dinner  ⓒ Staying in New York  ⓓ Studying hard for the test<br>2 ___ , she got a good grade.",ans:"ⓓ",full:"ⓓ Studying hard for the test, she got a good grade.",ko:"시험을 위해 열심히 공부해서 그녀는 좋은 성적을 받았다.",

A(2,"B",3,"w",{q:"자연스러운 문장이 되도록 빈칸에 알맞은 분사구문을 <보기>에서 골라 그 기호를 쓰시오.<br>보기: ⓐ Before spending money  ⓑ After having dinner  ⓒ Staying in New York  ⓓ Studying hard for the test<br>3 ___ , I washed the dishes.",ans:"ⓑ",full:"ⓑ After having dinner, I washed the dishes.",ko:"저녁을 먹은 후에 나는 설거지를 했다.",
 h:["본책 p.68 ‘2 분사구문의 여러 가지 의미’ (1) 시간과 아래 cf. 상자(After breaking the window, he ran away.)를 펴세요.","1) 뒤 문장은 I washed the dishes(나는 설거지를 했다)예요. wash는 원형 wash 씻다예요.  2) 설거지는 식사를 마친 다음에 하는 일이에요.","dinner(저녁 식사)라는 단어가 들어 있는 보기예요."],

A(2,"B",4,"w",{q:"자연스러운 문장이 되도록 빈칸에 알맞은 분사구문을 <보기>에서 골라 그 기호를 쓰시오.<br>보기: ⓐ Before spending money  ⓑ After having dinner  ⓒ Staying in New York  ⓓ Studying hard for the test<br>4 ___ , you should think carefully.",ans:"ⓐ",full:"ⓐ Before spending money, you should think carefully.",ko:"돈을 쓰기 전에 너는 신중하게 생각해야 한다.",

 pen:"분사구문 → 부사절: 접속사 + 주어(주절과 같음) + 동사(주절과 같은 시제)"});
A(2,"C",2,"w",{q:"두 문장의 의미가 같도록 밑줄 친 부분을 부사절로 바꿔 문장을 완성하시오.<br><u>Being rich</u>, he can buy the expensive car.<br>→ Because ___, he can buy the expensive car.",ans:"he is rich",full:"Because he is rich, he can buy the expensive car.",ko:"그는 부자라서 그 비싼 차를 살 수 있다.",
 h:["본책 p.68 아래쪽 ‘부사절의 동사가 be동사인 문장의 분사구문’ 상자를 펴세요.","1) Being은 be동사에서 온 분사구문이에요. 주어는 주절의 he(그)예요.  2) 주절 동사 can buy(원형 buy 사다)가 현재형이니 부사절도 현재 시제로 써요.","세 단어예요. 주어 + be동사의 현재형(주어가 he이니 i로 시작) + 형용사 rich예요."],

 h:["본책 p.68 ‘1 분사구문’의 분사구문 만드는 방법 ①②③을 펴세요.","1) 접속사 When(~할 때)과 주절과 같은 주어 she를 지워요.  2) saw(원형 see 보다)를 현재분사로 바꾸고 a rat(쥐 한 마리)을 그대로 붙여요.","see에 -ing를 붙인 말로 시작하고, 뒤에 a rat이 와요. S로 시작해요."],

 h:["본책 p.68 ‘2 분사구문의 여러 가지 의미’ (1) 시간과 (2) 이유를 펴세요.","1) 첫 문장은 Hearing(원형 hear 듣다)이 울기 시작한 때를 알려 줘요.  2) 둘째 문장은 Waking up(원형 wake up 일어나다)이 버스를 놓친 이유가 돼요.","첫째 빈칸은 ‘~했을 때’, 둘째 빈칸은 ‘~해서’ 꼴이에요."],

A("SW","SW",4,"w",{q:"[빈칸 완성] 우리는 그녀의 갑작스러운 죽음에 충격을 받았다. (shock)<br>We were ___ by her sudden death.",ans:"shocked",full:"We were shocked by her sudden death.",ko:"우리는 그녀의 갑작스러운 죽음에 충격을 받았다.",

A("PT","PT",8,"w",{q:"(출제 포인트 4) 두 문장의 의미가 같도록 빈칸에 알맞은 분사구문을 쓰시오.<br>(1) Because she was tired, she didn’t go out with us.<br>→ ___, she didn’t go out with us.",ans:"Being tired",full:"Being tired, she didn’t go out with us.",ko:"피곤해서 그녀는 우리와 함께 나가지 않았다.",

 pen:"명사 용도·목적 / 보어 / 동사의 목적어 = 동명사, 꾸밈·진행 = 현재분사"}); }

 h:["본책 p.68 ‘2 분사구문의 여러 가지 의미’ (1) 시간, (2) 이유, (3) 동시 동작을 펴세요.","1) 각 문장이 시간·이유·동시 동작 중 무엇인지 문맥으로 판단해요.  2) 그 의미에 맞는 접속사(After, Because, As 등)가 쓰였는지 확인해요.","알맞지 않은 것은 한 개예요. 접속사의 의미가 문맥과 맞지 않는 문장이에요. 두 번째 보기를 확인해 보세요."],

A("T","T",18,"c",{q:"(고난도, 출제 포인트 1, 3) 18 밑줄 친 부분이 어법상 옳은 것끼리 짝지어진 것은?<br>ⓐ Can you see the cat <u>hiding</u> in the box?<br>ⓑ Be careful of the <u>breaking</u> glass.<br>ⓒ I don’t want to listen to the <u>bored</u> lecture.<br>ⓓ Are you <u>satisfied</u> with your test score?<br>ⓔ I was <u>amazing</u> at the beautiful view.",opts:o,ans:o[1],full:"② ⓐ, ⓓ (ⓑ breaking → broken, ⓒ bored → boring, ⓔ amazing → amazed)",ko:"② ⓐ 상자 안에 숨어 있는 고양이가 보이니? ⓓ 너는 시험 점수에 만족하니?",
 h:["본책 p.66 ‘1 분사의 종류’와 ‘3 감정을 나타내는 분사’를 펴세요.","1) ⓐ는 고양이가 숨어 있는 중(능동·진행)인지, ⓑ 유리는 깨진(수동)인지 보세요.  2) ⓒ 강의(lecture)는 사물, ⓓ·ⓔ의 주어는 사람이에요. 일으킴은 -ing, 느낌은 -ed예요.","옳은 것은 두 개예요. 하나는 첫 번째 문장이에요. 보기에서 ⓐ로 시작하는 두 가지 중 고르세요."],
