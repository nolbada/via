bles. He also enjoys delicious beans and mushrooms. The food comes from local farms, so it doesn't travel far.", "Green Shopping", "On Fridays, Seojun takes plastic bottles and cans to a zero waste shop. Then, he gets green points. With these points, Seojun buys green products like eco-bags and bamboo toothbrushes. He gives his family and friends these products as gifts.", "Seojun's green life teaches us a good lesson. Like Seojun, we can make some simple changes in our everyday life. Our small actions can make a big difference. Let's do something to help the Earth now!"];var PASS_KO=["세상을 위한 친환경 생활", "서준이는 중학생입니다. 어느 날, 그는 위험에 처한 북극곰에 관한 영상을 보았습니다. 그는 그들이 안타까웠고, 그래서 무언가를 하기로 결심했습니다. 이제 그는 지구를 돕기 위해 많은 것들을 해요. 서준이의 친환경 생활에 대해 알아봅시다.", "환경 친화적인 선택", "서준이는 물을 마시기 위해 항상 물병을 가지고 다닙니다. 그는 종이컵을 사용하지 않아요. 또한, 서준이는 화장실에서 손을 말릴 때 종이 타월을 사용하지 않습니다. 그는 자신의 손수건을 사용해요.", "환경 친화적인 식사", "매주 주말, 서준이의 가족은 고기 없는 특별한 식사를 합니다. 서준이의 부모님은 그에게 과일과 야채가 든 신선한 샐러드를 만들어 줍니다. 그는 또한 맛있는 콩과 버섯도 즐겨 먹어요. 그 음식들은 지역 농장에서 오는 것들이라, 멀리 이동하지 않습니다.", "환경 친화적인 물건 구매", "금요일마다, 서준이는 플라스틱 병과 캔을 제로 웨이스트 가게로 가지고 갑니다. 그러고 나서, 그는 친환경 포인트를 받습니다. 서준이는 이 포인트로 에코백이나 대나무 칫솔과 같은 친환경 제품을 구매합니다. 그는 그의 가족과 친구들에게 이러한 제품을 선물로 줍니다.", "서준이의 친환경 생활은 우리에게 좋은 교훈을 가르쳐 줍니다. 서준이처럼, 우리는 우리의 일상생활에서 몇 가지 간단한 변화를 만들 수 있어요. 우리의 작은 행동이 큰 변화를 만들 수 있습니다. 지구를 돕기 위해 지금 무언가를 합시다!"];
