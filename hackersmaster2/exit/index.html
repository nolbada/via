n Vermont right at the border between Canada and the United States에서 가져왔어요. 1791년에 세워졌으니 founded(설립), 버몬트 북부에 놓여 있으니 situated(위치해 있는)예요. closed, hidden, trapped는 본문에 없는 내용이에요.","c":5},"h":"8dbaaab45c"},{"n":10,"t":"fill","q":"For many years, these two towns [A] as one [B], with residents crossing the border easily to visit friends, go shopping, or take a walk.","ko":"수년간, 이 두 마을은 주민들이 친구를 방문하거나, 쇼핑하러 가거나, 산책하기 위해 국경을 쉽게 건너며 하나의 [B](으)로서 [A].","bank":["functioned","community","triggered","stricter","official","cameras"],"bko":{"functioned":"기능했다","community":"공동체","triggered":"촉발했다","stricter":"더 엄격한","official":"공식적인","cameras":"카메라(camera의 복수형)"},"r":{"a":"[A] functioned (기능했다), [B] community (공동체)","ev":"5번 문장","s":[[5,"For many years, these two towns functioned as one community, with residents crossing the border easily to visit friends, go shopping, or take a walk.","수년간, 이 두 마을은 주민들이 친구를 방문하거나, 쇼핑하러 가거나, 산책하기 위해 국경을 쉽게 건너며 하나의 공동체로서 기능했다."]],"w":"5번 문장 For many years, these two towns functioned as one community에서 가져왔어요. 두 마을이 '하나의 공동체로서 기능했다'는 뜻이라 functioned(기능했다)와 community(공동체)를 쓰고, A와 B를 바꾸면 말이 안 돼요. 나머지는 동사나 명사 자리에 맞지 않아요.","c":null},"h":"7f9fc21278"}]},{"u":3,"id":"ms2-03-3","no":3,"ko":"뼈는 없어도 썰은 넘쳐나요~","items":[{"n":1,"t":"tf","q":"Bernard Heuvelmans helped make the term cryptozoology popular in the mid-20th century.","ko":"베르나르 회벨만스는 20세기 중반에 신비동물학이라는 용어가 널리 알려지도록 도왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The term was popularized in the mid-20th century by Bernard Heuvelmans, a Belgian-French zoologist often called the “father of cryptozoology.”","이 용어는 종종 “신비동물학의 아버지”라고 불리는 벨기에계 프랑스인 동물학자 베르나르 회벨만스에 의해 20세기 중반에 대중화되었다."]],"w":"4번에서 이 용어는 20세기 중반에 회벨만스에 의해 대중화되었다(was popularized)고 해요.","c":"T"},"h":"ea34582139"},{"n":2,"t":"tf","q":"Cryptozoologists usually have physical proof, such as bones or living specimens, of mysterious creatures.","ko":"신비동물학자들은 보통 뼈나 살아있는 표본 같은 신비한 동물들의 물리적 증거를 갖고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Sightings are often based on personal testimony rather than repeatable experiments, and physical proof—such as bones or living specimens—is usually missing.","목격담은 종종 반복 가능한 실험보다는 개인적인 증언에 기초하며, 뼈나 살아있는 표본과 같은 물리적 증거는 대개 누락되어 있다."]],"w":"9번에서 뼈나 살아있는 표본 같은 물리적 증거는 대개 누락되어 있다(usually missing)고 해요. 갖고 있다는 말은 반대예요.","c":"F"},"h":"834c7e714b"},{"n":3,"t":"tf","q":"Cryptozoology reflects a human desire to believe that nature still holds untold secrets.","ko":"신비동물학은 자연이 여전히 밝혀지지 않은 비밀을 간직하고 있다고 믿고 싶은 인간의 욕망을 반영한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"It reflects a deep human desire to believe that the natural world still holds untold secrets.","그것은 자연 세계가 여전히 밝혀지지 않은 비밀들을 간직하고 있다고 믿고 싶은 깊은 인간의 욕망을 반영한다."]],"w":"12번에서 신비동물학은 자연 세계가 여전히 밝혀지지 않은 비밀들을 간직하고 있다고 믿고 싶은 깊은 인간의 욕망을 반영한다고 해요.","c":"T"},"h":"d4b5845930"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…cryptozoology is generally not recognized as a legitimate scientific discipline.)","ko":"…신비동물학은 일반적으로 정당한 과학 분야로 인정받지 못한다.","opts":["위험한","정당한","유명한","새로운"],"word":"legitimate","r":{"a":"2) 정당한","ev":"10번 문장","s":[[10,"As a result, cryptozoology is generally not recognized as a legitimate scientific discipline.","그 결과, 신비동물학은 일반적으로 정당한 과학 분야로 인정받지 못한다."]],"w":"10번은 신비동물학이 증거 부족 때문에 '정당한' 과학 분야로 인정받지 못한다는 결과예요. legitimate = 정당한, 합법적인.","c":2},"h":"3fead7a096"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the influence of cryptozoology cannot be dismissed.)","ko":"…신비동물학의 영향력은 일축될 수 없다.","opts":["일축되다","확인되다","증명되다","반복되다"],"word":"dismissed","r":{"a":"1) 일축되다","ev":"11번 문장","s":[[11,"Even so, the influence of cryptozoology cannot be dismissed.","그렇다 하더라도, 신비동물학의 영향력은 일축될 수 없다."]],"w":"11번의 Even so(그렇다 하더라도) 뒤에서, 신비동물학의 영향력은 무시하고 넘겨 버릴 수 없다는 뜻이에요. dismiss = 일축하다, cannot be dismissed = 일축될 수 없다.","c":1},"h":"e987edb9f5"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nFrom the tentacled Kraken, said to drag ships beneath the ocean, to Bigfoot, an ape-like creature rumored to roam remote forests, stories of mysterious animals have captured humanity’s attention for centuries. No clear scientific evidence has proved their existence yet, but their long history in human culture raises an interesting question: What if some legendary animals are more than just myths?","ko":"밑줄 친 their가 가리키는 것은?","sko":"선박들을 바다 밑으로 끌고 간다고 전해지는 촉수가 달린 크라켄부터, 외딴 숲을 배회한다고 소문난 유인원 같은 생물인 빅풋에 이르기까지, 신비한 동물들에 대한 이야기는 수 세기 동안 인류의 관심을 사로잡았다. 아직 어떤 명확한 과학적 증거도 그들의 존재를 증명하지 못했지만, 인간 문화 속에서 그것들의 긴 역사는 흥미로운 질문을 제기하는데, 만약 몇몇 전설적인 동물들이 단순한 신화 이상의 존재라면 어떨까?","opts":["인류의 문화들","선박들","신비한 동물들","과학자들"],"r":{"a":"3) 신비한 동물들","ev":"1~2번 문장","s":[[1,"From the tentacled Kraken, said to drag ships beneath the ocean, to Bigfoot, an ape-like creature rumored to roam remote forests, stories of mysterious animals have captured humanity’s attention for centuries.","선박들을 바다 밑으로 끌고 간다고 전해지는 촉수가 달린 크라켄부터, 외딴 숲을 배회한다고 소문난 유인원 같은 생물인 빅풋에 이르기까지, 신비한 동물들에 대한 이야기는 수 세기 동안 인류의 관심을 사로잡았다."],[2,"No clear scientific evidence has proved their existence yet, but their long history in human culture raises an interesting question: What if some legendary animals are more than just myths?","아직 어떤 명확한 과학적 증거도 그들의 존재를 증명하지 못했지만, 인간 문화 속에서 그것들의 긴 역사는 흥미로운 질문을 제기하는데, 만약 몇몇 전설적인 동물들이 단순한 신화 이상의 존재라면 어떨까?"]],"w":"2번의 their existence(그들의 존재)는 1번에서 이야기한 mysterious animals(신비한 동물들)의 존재예요. 아직 어떤 과학적 증거도 그 동물들의 존재를 증명하지 못했다는 뜻이에요.","c":3},"h":"a7d8046e95"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"More than a quest for hidden animals, it reveals humanity’s appetite for mystery endures.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"숨겨진 동물들에 대한 탐구 이상으로, 그것은 미스터리에 대한 인류의 갈망이 지속된다는 것을 보여준다.","opts":["신비동물학은 숨은 동물을 찾는 데 성공했고, 그래서 인류가 만족하게 되었다.","신비동물학은 숨은 동물을 찾는 일일 뿐이라서, 미스터리에 대한 관심은 사라졌다.","신비동물학은 숨은 동물을 찾는 일을 넘어, 미스터리를 향한 인류의 갈망이 계속된다는 것을 보여 준다.","신비동물학은 숨은 동물보다 미스터리를 덜 중요하게 여긴다."],"r":{"a":"3) 신비동물학은 숨은 동물을 찾는 일을 넘어, 미스터리를 향한 인류의 갈망이 계속된다는 것을 보여 준다.","ev":"14번 문장","s":[[14,"More than a quest for hidden animals, it reveals humanity’s appetite for mystery endures.","숨겨진 동물들에 대한 탐구 이상으로, 그것은 미스터리에 대한 인류의 갈망이 지속된다는 것을 보여준다."]],"w":"More than a quest for ~는 '~을 찾는 일 이상으로'라는 뜻이고, 뒤에서 it(신비동물학)이 미스터리에 대한 인류의 갈망이 계속된다(endures)는 것을 보여 준다고 해요.","c":3},"h":"7ad19d9fb6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["회벨만스는 목격자 보고만으로도 모든 전설 속 동물이 존재한다는 것을 증명할 수 있다고 믿었다.","회벨만스는 역사적 기록, 지역 전설, 목격자 보고를 신중하게 분석하면 발견되지 않은 종을 가리킬 수도 있다고 믿었다.","회벨만스는 역사적 기록이 지역 전설에서 나왔기 때문에 쓸모없다고 생각했다.","회벨만스는 동물학자였지만 지역 전설과 목격자 보고를 거부했다."],"opts":["Heuvelmans believed that eyewitness reports alone could prove that every legendary animal exists.","Heuvelmans believed that careful analysis of historical records, local legends, and eyewitness reports might point to undiscovered species.","Heuvelmans thought historical records were useless because they came from local legends.","Heuvelmans was a zoologist who rejected local legends and eyewitness reports."],"r":{"a":"2) Heuvelmans believed that careful analysis of historical records, local legends, and eyewitness reports might point to undiscovered species.","ev":"5번 문장","s":[[5,"He believed that careful analysis of historical records, local legends, and eyewitness reports might point to undiscovered species.","그는 역사적 기록, 지역 전설, 그리고 목격자 보고에 대한 신중한 분석이 발견되지 않은 종을 가리킬 수도 있다고 믿었다."]],"w":"5번에서 회벨만스는 역사적 기록, 지역 전설, 목격자 보고를 신중하게 분석하면 발견되지 않은 종을 가리킬 수도 있다고 믿었어요. 나머지는 이 믿음과 다르거나 본문에 없는 내용이에요.","c":2},"h":"30f7c35f74"},{"n":9,"t":"sum","q":"Most scientists say that cryptozoology lacks (A) evidence and does not follow strict scientific (B).","ko":"대부분의 과학자는 신비동물학이 (A) 증거가 부족하고 엄격한 과학적 (B)을(를) 따르지 않는다고 말한다.","oko":["(A) 재미있는 / (B) 방법","(A) 믿을 만한 / (B) 이야기","(A) 값비싼 / (B) 이야기","(A) 재미있는 / (B) 이야기","(A) 믿을 만한 / (B) 방법"],"opts":["(A) funny / (B) methods","(A) reliable / (B) stories","(A) expensive / (B) stories","(A) funny / (B) stories","(A) reliable / (B) methods"],"r":{"a":"5) (A) reliable / (B) methods (믿을 만한 / 방법)","ev":"8번 문장","s":[[8,"Most scientists argue that it lacks reliable evidence and does not follow strict scientific methods.","대부분의 과학자는 그것이 신뢰할 만한 증거가 부족하고 엄격한 과학적 방법을 따르지 않는다고 주장한다."]],"w":"8번 문장 Most scientists argue that it lacks reliable evidence and does not follow strict scientific methods에서 가져왔어요. 과학자들이 말하는 문제는 믿을 만한(reliable) 증거가 부족하고 엄격한 과학적 방법(methods)을 따르지 않는다는 점이에요.","c":5},"h":"475f0fbc45"},{"n":10,"t":"fill","q":"In this sense, cryptozoology sits at the [A] of zoology, anthropology, and [B].","ko":"이런 의미에서, 신비동물학은 동물학, 인류학, 그리고 [B]의 [A]에 위치한다.","bank":["crossroads","folklore","testimony","specimens","influence","appetite"],"bko":{"crossroads":"교차점","folklore":"민속학","testimony":"증언","specimens":"표본(specimen의 복수형)","influence":"영향력","appetite":"갈망"},"r":{"a":"[A] crossroads (교차점), [B] folklore (민속학)","ev":"6번 문장","s":[[6,"In this sense, cryptozoology sits at the crossroads of zoology, anthropology, and folklore.","이런 의미에서, 신비동물학은 동물학, 인류학, 그리고 민속학의 교차점에 위치한다."]],"w":"6번 문장 In this sense, cryptozoology sits at the crossroads of zoology, anthropology, and folklore에서 가져왔어요. crossroads는 길이 만나는 교차점이고, 동물학·인류학과 나란히 놓인 학문 이름은 folklore(민속학)예요. 나머지는 학문 이름이 아니에요.","c":null},"h":"fd66f736ae"}]},{"u":3,"id":"ms2-03-4","no":4,"ko":"You Shall Not Pass!","items":[{"n":1,"t":"tf","q":"Stephen Curry gets a chance for a final shot with one second remaining in a basketball game.","ko":"스테픈 커리는 농구 경기 종료까지 1초가 남은 상황에서 마지막 슛을 할 기회를 얻는다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"With one second remaining in a basketball game, Stephen Curry gets a chance for a final shot.","농구 경기 종료까지 1초가 남은 상황에서, 스테픈 커리는 마지막 슛을 할 기회를 얻는다."]],"w":"1번 문장에서 경기 종료까지 1초가 남은 상황(With one second remaining)에 스테픈 커리가 마지막 슛의 기회를 얻는다고 해요.","c":"T"},"h":"bc92cf3f23"},{"n":2,"t":"tf","q":"At the end of the play, the shooter only has to pass the ball.","ko":"플레이의 마지막에, 슈터는 공을 패스하기만 하면 된다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"And finally, the shooter has to score!","그리고 마지막으로, 슈터는 득점해야 한다!"]],"w":"12번에서 And finally, the shooter has to score!라고 해요. 마지막 단계는 패스가 아니라 슈터가 득점하는 것이에요.","c":"F"},"h":"1e568f792a"},{"n":3,"t":"tf","q":"The pass must be delivered after the shooter is open and before the defenders get past the screeners.","ko":"패스는 슈터가 자유로워진 후, 그리고 수비수들이 스크리너들을 지나치기 전에 전달되어야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The pass has to be delivered right on time—after the shooter is open and before the defenders get past the screeners.","패스는 제때 전달되어야 하는데, 슈터가 자유로워진 후, 그리고 수비수들이 스크리너들을 지나치기 전이어야 한다."]],"w":"11번에서 패스는 슈터가 자유로워진 후(after the shooter is open), 수비수들이 스크리너들을 지나치기 전(before the defenders get past the screeners)에 제때 전달되어야 한다고 해요.","c":"T"},"h":"7e81559991"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (First, the attacking players should disguise the play so the opposing defenders can’t prepare for it.)","ko":"첫째, 공격 선수들은 상대 수비수들이 그것에 대비할 수 없도록 플레이를 위장해야 한다.","opts":["공개하다","연습하다","위장하다","무시하다"],"word":"disguise","r":{"a":"3) 위장하다","ev":"9번 문장","s":[[9,"First, the attacking players should disguise the play so the opposing defenders can’t prepare for it.","첫째, 공격 선수들은 상대 수비수들이 그것에 대비할 수 없도록 플레이를 위장해야 한다."]],"w":"9번에서 상대 수비수들이 대비하지 못하도록 플레이를 감춰야 한다는 뜻이에요. disguise = 위장하다, 감추다.","c":3},"h":"6e81555324"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This seemingly simple movement demands precise execution from all participants.)","ko":"이 겉보기에 단순한 움직임은 모든 참가자로부터 정확한 실행을 요구한다.","opts":["정확한","약간의","지루한","위험한"],"word":"precise","r":{"a":"1) 정확한","ev":"8번 문장","s":[[8,"This seemingly simple movement demands precise execution from all participants.","이 겉보기에 단순한 움직임은 모든 참가자로부터 정확한 실행을 요구한다."]],"w":"8번은 겉보기에는 단순하지만 모든 참가자가 아주 정확하게 실행해야 한다는 내용이에요. precise = 정확한, 정밀한.","c":1},"h":"7d9b67b2f4"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhile a typical screen play involves a single screener blocking a defender to create space for a shooter, the elevator screen is highly effective because it uses two screeners to assist the shooter.","ko":"밑줄 친 it이 가리키는 것은?","sko":"일반적인 스크린 플레이가 슈터를 위한 공간을 만들기 위해 수비수를 막는 단일 스크리너를 포함하는 반면, 엘리베이터 스크린은 슈터를 돕기 위해 두 명의 스크리너를 사용하기 때문에 매우 효과적이다.","opts":["일반적인 스크린 플레이","엘리베이터 스크린","수비수","슈터"],"r":{"a":"2) 엘리베이터 스크린","ev":"5번 문장","s":[[5,"While a typical screen play involves a single screener blocking a defender to create space for a shooter, the elevator screen is highly effective because it uses two screeners to assist the shooter.","일반적인 스크린 플레이가 슈터를 위한 공간을 만들기 위해 수비수를 막는 단일 스크리너를 포함하는 반면, 엘리베이터 스크린은 슈터를 돕기 위해 두 명의 스크리너를 사용하기 때문에 매우 효과적이다."]],"w":"because 뒤의 it uses two screeners to assist the shooter(그것은 슈터를 돕기 위해 두 명의 스크리너를 사용한다)에서 it은 바로 앞의 the elevator screen이에요. a typical screen play는 스크리너 한 명을 쓰는 것이라 달라요.","c":2},"h":"187d8cea30"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As the shooter cuts between them to receive the pass, the screeners quickly close the gap—like elevator doors slamming shut—preventing defenders from following the shooter.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"슈터가 패스를 받기 위해 그들 사이를 가로질러 갈 때, 스크리너들은 마치 엘리베이터 문이 쾅 닫히는 것처럼 빠르게 간격을 좁혀, 수비수들이 슈터를 따라가는 것을 막는다.","opts":["슈터가 두 스크리너 사이를 지나가면, 스크리너들이 엘리베이터 문처럼 빠르게 간격을 닫아 수비수가 슈터를 따라오지 못하게 한다.","스크리너들은 엘리베이터 문처럼 천천히 열려서 슈터가 지나가게 해 준다.","슈터는 엘리베이터에 타서 수비수를 따돌린 뒤 패스를 받는다.","수비수들이 스크리너들 사이로 들어가 슈터를 막는다."],"r":{"a":"1) 슈터가 두 스크리너 사이를 지나가면, 스크리너들이 엘리베이터 문처럼 빠르게 간격을 닫아 수비수가 슈터를 따라오지 못하게 한다.","ev":"7번 문장","s":[[7,"As the shooter cuts between them to receive the pass, the screeners quickly close the gap—like elevator doors slamming shut—preventing defenders from following the shooter.","슈터가 패스를 받기 위해 그들 사이를 가로질러 갈 때, 스크리너들은 마치 엘리베이터 문이 쾅 닫히는 것처럼 빠르게 간격을 좁혀, 수비수들이 슈터를 따라가는 것을 막는다."]],"w":"슈터가 패스를 받으려고 스크리너들 사이를 가로지르면, 스크리너들이 엘리베이터 문이 쾅 닫히듯 간격을 좁혀요. 그래서 수비수들이 슈터를 따라가지 못하게 돼요(preventing defenders from following the shooter).","c":1},"h":"815dfa8be3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["스크리너들은 멀리 떨어져 서서 수비수들이 슈터를 보지 못하게 한다.","스크리너들은 서로 가깝게 서서 슈터가 달려 지나갈 통로를 만든다.","슈터는 가만히 서 있고 스크리너들이 수비수에게 달려간다.","스크리너들이 슈터를 수비수들 사이로 밀어 넣어 슛을 쏘게 한다."],"opts":["The screeners stand far apart so the defenders cannot see the shooter.","The screeners stand close together and create a corridor for the shooter to run through.","The shooter stands still while the screeners run to the defenders.","The screeners push the shooter through the defenders to take a shot."],"r":{"a":"2) The screeners stand close together and create a corridor for the shooter to run through.","ev":"6번 문장","s":[[6,"The screeners position themselves close together, creating a corridor for the shooter to run through.","스크리너들은 서로 가깝게 위치하여 슈터가 달려 지나갈 통로를 만든다."]],"w":"6번에서 스크리너들은 서로 가깝게 위치하여(position themselves close together) 슈터가 달려 지나갈 통로(corridor)를 만들어요. 나머지는 본문에 없는 내용이에요.","c":2},"h":"8678f89854"},{"n":9,"t":"sum","q":"No defender (A) to guard Curry, thanks to one of the sport’s best (B): the elevator screen.","ko":"커리가 마지막 슛 기회를 얻을 때 아무 수비수도 그를 막으러 (A) 않는데, 이는 그 스포츠 최고의 (B) 중 하나인 엘리베이터 스크린 덕분이다.","oko":["(A) 숨지 / (B) 전략","(A) 달려오지 / (B) 실수","(A) 웃지 / (B) 실수","(A) 숨지 / (B) 실수","(A) 달려오지 / (B) 전략"],"opts":["(A) hides / (B) strategies","(A) rushes / (B) mistakes","(A) laughs / (B) mistakes","(A) hides / (B) mistakes","(A) rushes / (B) strategies"],"r":{"a":"5) (A) rushes / (B) strategies (달려오지 / 전략)","ev":"2번, 4번 문장","s":[[2,"Yet no defender rushes to guard the league’s greatest shooter.","그런데도 리그 최고의 슈터를 막으러 달려오는 수비수는 아무도 없다."],[4,"It was thanks to one of the sport’s best strategies: the elevator screen.","그것은 그 스포츠 최고의 전략 중 하나인 엘리베이터 스크린 덕분이었다."]],"w":"2번에서 Yet no defender rushes to guard the league’s greatest shooter라고 하고, 4번에서 It was thanks to one of the sport’s best strategies: the elevator screen이라고 해요. 막으러 달려오는(rushes) 수비수가 없었던 이유가 최고의 전략(strategies) 덕분이에요.","c":5},"h":"115eb1737e"},{"n":10,"t":"fill","q":"Then, the screeners must close the gap at the exact [A] to seal off defenders while avoiding offensive [B].","ko":"그다음, 스크리너들은 공격 [B]을(를) 피하면서 수비수들을 차단하기 위해 정확한 [A]에 간격을 좁혀야 한다.","bank":["moment","fouls","precise","simple","seemingly","quickly"],"bko":{"moment":"순간","fouls":"파울(foul의 복수형)","precise":"정확한","simple":"단순한","seemingly":"겉보기에","quickly":"빠르게"},"r":{"a":"[A] moment (순간), [B] fouls (파울)","ev":"10번 문장","s":[[10,"Then, the screeners must close the gap at the exact moment to seal off defenders while avoiding offensive fouls.","그다음, 스크리너들은 공격 파울을 피하면서 수비수들을 차단하기 위해 정확한 순간에 간격을 좁혀야 한다."]],"w":"10번 문장 Then, the screeners must close the gap at the exact moment to seal off defenders while avoiding offensive fouls에서 가져왔어요. the exact 뒤에는 명사 moment(순간)가, offensive 뒤에는 명사 fouls(파울)가 와요. 나머지는 형용사나 부사라서 이 자리에 올 수 없어요.","c":null},"h":"354f5b54d4"}]},{"u":4,"id":"ms2-04-1","no":1,"ko":"새똥 때문에 전쟁까지 일어났다고?","items":[{"n":1,"t":"tf","q":"Seabirds on the Chincha Islands could produce a lot of guano because they had plenty of fish to eat.","ko":"친차 제도의 바닷새들은 먹을 물고기가 많았기 때문에 많은 구아노를 생산할 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Seabirds there had an abundant supply of fish, producing massive amounts of guano.","그곳의 바닷새들은 풍부한 물고기 공급이 있었기에, 엄청난 양의 구아노를 생산했다."]],"w":"10번 문장에서 바닷새들은 풍부한 물고기 공급(abundant supply of fish)이 있어서 엄청난 양의 구아노를 생산했어요.","c":"T"},"h":"0eddd67331"},{"n":2,"t":"tf","q":"Heavy rain on the Chincha Islands helped guano pile up in deep layers.","ko":"친차 제도의 많은 비는 구아노가 깊은 층으로 쌓이는 데 도움이 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"At the same time, the islands’ arid climate meant there was little rain to wash these deposits away, allowing guano to accumulate in layers as deep as 60 meters.","동시에, 그 섬들의 건조한 기후는 이 퇴적물들을 씻어낼 비가 거의 없다는 것을 의미했고, 구아노가 최대 60미터 깊이까지 층으로 쌓일 수 있게 했다."]],"w":"11번 문장에서 건조한 기후 때문에 구아노를 씻어낼 비가 거의 없었고, 그래서 구아노가 쌓일 수 있었어요. 비가 많이 왔다는 말은 반대예요.","c":"F"},"h":"d53eb1b67a"},{"n":3,"t":"tf","q":"Guano was easy to get in large amounts because there was so much of it.","ko":"구아노는 양이 아주 많아서 대량으로 얻기 쉬웠다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"However, guano’s scarcity made it difficult to obtain in large quantities.","하지만, 구아노의 희소성은 그것을 대량으로 얻기 어렵게 만들었다."]],"w":"13번 문장에서 구아노의 희소성(scarcity) 때문에 대량으로 얻기 어려웠다고 해요. 쉽게 얻을 수 있었다는 말은 반대예요.","c":"F"},"h":"0e1b4cc985"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Guano contains high levels of nitrogen, which is essential for plant growth.)","ko":"구아노는 식물 성장에 필수적인 질소를 높은 수준으로 함유하고 있다.","opts":["해로운","필수적인","드문","사소한"],"word":"essential","r":{"a":"2) 필수적인","ev":"5번 문장","s":[[5,"Guano contains high levels of nitrogen, which is essential for plant growth.","구아노는 식물 성장에 필수적인 질소를 높은 수준으로 함유하고 있다."]],"w":"5번 문장에서 질소는 식물이 자라는 데 꼭 필요하다는 뜻으로 쓰였어요. essential = 필수적인, 꼭 필요한.","c":2},"h":"c29e508cd1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The Chincha Islands were uniquely suited to meet this demand.)","ko":"친차 제도는 이러한 수요를 충족시키기에 독특하게 적합했다.","opts":["적합한","반대하는","익숙한","관련 없는"],"word":"suited","r":{"a":"1) 적합한","ev":"9번 문장","s":[[9,"The Chincha Islands were uniquely suited to meet this demand.","친차 제도는 이러한 수요를 충족시키기에 독특하게 적합했다."]],"w":"9번 문장에서 친차 제도가 수요를 채우기에 알맞았다는 뜻이에요. suited to = ~에 적합한. 뒤의 to meet this demand와 이어 읽으세요.","c":1},"h":"4ca178c0ba"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAt the time, so many people wanted bird poop, or guano, that nations even fought wars over it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그 당시에는, 너무나 많은 사람들이 새 똥, 즉 구아노를 원해서 국가들이 그것을 두고 전쟁을 벌이기까지 했다.","opts":["새 똥(구아노)","1800년대","페루의 친차 제도","식물의 성장"],"r":{"a":"1) 새 똥(구아노)","ev":"3번 문장","s":[[3,"At the time, so many people wanted bird poop, or guano, that nations even fought wars over it.","그 당시에는, 너무나 많은 사람들이 새 똥, 즉 구아노를 원해서 국가들이 그것을 두고 전쟁을 벌이기까지 했다."]],"w":"3번 문장에서 사람들이 원한 것은 bird poop, or guano였고, 국가들은 바로 그것(it)을 두고 전쟁까지 벌였어요.","c":1},"h":"2083471437"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the eyes of European nations, the Chincha Islands of Peru came to be seen as a treasure trove.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"유럽 국가들의 눈에는, 페루의 친차 제도가 보물 창고로 여겨지게 되었다.","opts":["유럽 국가들은 페루의 친차 제도를 오래전부터 위험한 곳으로 여겼다.","유럽 국가들은 친차 제도가 별 가치 없는 섬이라고 생각하게 되었다.","유럽 국가들은 페루의 친차 제도를 보물이 가득한 곳처럼 여기게 되었다.","페루 사람들은 유럽 국가들을 보물 창고로 여기게 되었다."],"r":{"a":"3) 유럽 국가들은 페루의 친차 제도를 보물이 가득한 곳처럼 여기게 되었다.","ev":"8번 문장","s":[[8,"In the eyes of European nations, the Chincha Islands of Peru came to be seen as a treasure trove.","유럽 국가들의 눈에는, 페루의 친차 제도가 보물 창고로 여겨지게 되었다."]],"w":"came to be seen as는 '~로 여겨지게 되었다'이고 treasure trove는 보물 창고예요. 유럽 국가들의 눈에 친차 제도가 보물 창고처럼 보이게 되었다는 뜻이에요.","c":3},"h":"59ee978009"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["친차 제도의 바닷새들은 먹을 물고기가 부족해 구아노를 거의 만들지 못했다.","독일 탐험가 훔볼트는 구아노 샘플을 유럽으로 가져왔다.","1865년 친차 제도 전쟁은 스페인과 독일 사이에서만 벌어졌다.","19세기 서구 국가들은 토양 생산성을 높이는 데 어려움이 전혀 없었다."],"opts":["Seabirds on the Chincha Islands made almost no guano because they lacked fish.","Alexander von Humboldt, a German explorer, brought guano samples to Europe.","The Chincha Islands War of 1865 was fought only between Spain and Germany.","Western nations had no difficulty raising soil productivity in the 19th century."],"r":{"a":"2) Alexander von Humboldt, a German explorer, brought guano samples to Europe.","ev":"12번 문장","s":[[12,"This natural resource gained international attention when guano samples were brought to Europe by Alexander von Humboldt, a German naturalist and explorer.","이 천연 자원은 독일의 자연주의자이자 탐험가인 알렉산더 폰 훔볼트에 의해 구아노 샘플들이 유럽으로 가져와졌을 때 국제적인 관심을 얻었다."]],"w":"12번 문장에서 독일의 탐험가 훔볼트가 구아노 샘플을 유럽에 가져왔어요. 바닷새는 물고기가 풍부했고(10번), 1865년 전쟁은 스페인, 페루 등 남미 국가들 사이였으며(14번), 서구 국가들은 토양 생산성을 높이려고 고군분투했어요(6번).","c":2},"h":"982b817c4b"},{"n":9,"t":"sum","q":"Western nations had to feed rapidly growing (A), so nitrogen-rich resources became extremely (B).","ko":"서구 국가들은 급격히 증가하는 (A)을(를) 먹여 살려야 했고, 그래서 질소가 풍부한 자원은 매우 (B) 것이 되었다.","oko":["(A) 군대 / (B) 사소한","(A) 인구 / (B) 사소한","(A) 군대 / (B) 귀중한","(A) 동물 / (B) 사소한","(A) 인구 / (B) 귀중한"],"opts":["(A) armies / (B) trivial","(A) populations / (B) trivial","(A) armies / (B) valuable","(A) animals / (B) trivial","(A) populations / (B) valuable"],"r":{"a":"5) (A) populations / (B) valuable (인구 / 귀중한)","ev":"6~7번 문장","s":[[6,"During the 19th century, Western nations struggled to increase soil productivity to feed rapidly growing populations.","19세기 동안, 서구 국가들은 급격히 증가하는 인구를 먹여 살리기 위해 토양 생산성을 높이려고 고군분투했다."],[7,"As a result, nitrogen-rich resources became extremely valuable.","그 결과, 질소가 풍부한 자원들은 매우 귀중해졌다."]],"w":"6번에서 서구 국가들은 급격히 늘어나는 인구(populations)를 먹여 살리려고 토양 생산성을 높이려 애썼고, 7번에서 그 결과 질소가 풍부한 자원이 매우 귀중해졌다(valuable)고 해요. 군대나 사소한 것은 본문에 없어요.","c":5},"h":"5cbb0785a9"},{"n":10,"t":"fill","q":"As its value increased, [A] for control of guano-rich [B] intensified, eventually leading to armed conflicts such as the Chincha Islands War of 1865 between Spain, Peru, and other South American nations.","ko":"그것의 가치가 증가함에 따라, 구아노가 풍부한 [B]의 통제권을 위한 [A]이(가) 심화되었고, 결국 스페인, 페루, 그리고 다른 남미 국가들 사이의 1865년 친차 제도 전쟁과 같은 무력 충돌들로 이어졌다.","bank":["competition","regions","arid","massive","abundant","uniquely"],"bko":{"competition":"경쟁","regions":"지역(region의 복수형)","arid":"건조한","massive":"엄청난","abundant":"풍부한","uniquely":"독특하게"},"r":{"a":"[A] competition (경쟁), [B] regions (지역)","ev":"14번 문장","s":[[14,"As its value increased, competition for control of guano-rich regions intensified, eventually leading to armed conflicts such as the Chincha Islands War of 1865 between Spain, Peru, and other South American nations.","그것의 가치가 증가함에 따라, 구아노가 풍부한 지역들의 통제권을 위한 경쟁이 심화되었고, 결국 스페인, 페루, 그리고 다른 남미 국가들 사이의 1865년 친차 제도 전쟁과 같은 무력 충돌들로 이어졌다."]],"w":"14번 문장 As its value increased, competition for control of guano-rich regions intensified에서 가져왔어요. 가치가 오르자 구아노가 풍부한 지역(regions)을 차지하려는 경쟁(competition)이 심해졌다는 뜻이에요. 나머지는 형용사나 부사라서 명사 자리에 올 수 없어요.","c":null},"h":"3dd2967425"}]},{"u":4,"id":"ms2-04-2","no":2,"ko":"부먹파도 찍어 먹는다는 ‘이것’","items":[{"n":1,"t":"tf","q":"After draining the water, the boiled chickpeas are put in a blender.","ko":"물을 뺀 후, 삶은 병아리콩을 블렌더에 넣는다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Put the boiled chickpeas in a blender after draining the water.","물을 뺀 후 삶은 병아리콩을 블렌더에 넣는다."]],"w":"11번 문장에서 물을 뺀 후(after draining the water) 삶은 병아리콩을 블렌더에 넣는다고 해요.","c":"T"},"h":"8989cc6fc7"},{"n":2,"t":"tf","q":"Few people outside the Middle East enjoy hummus today.","ko":"오늘날 중동 밖에서 후무스를 즐기는 사람은 거의 없다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Nowadays, many people around the world enjoy hummus.","요즘에는 전 세계의 많은 사람들이 후무스를 즐긴다."]],"w":"6번 문장에서 요즘 전 세계의 많은 사람들이 후무스를 즐긴다고 해요. 중동 밖에서는 거의 즐기지 않는다는 말은 반대예요.","c":"F"},"h":"244a3d164c"},{"n":3,"t":"tf","q":"The ingredients are blended until all the water is gone.","ko":"재료들은 물이 모두 없어질 때까지 갈린다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"Blend the ingredients until you have a smooth and creamy mixture.","당신이 부드럽고 크림 같은 혼합물을 얻게 되기까지 재료들을 갈아준다."]],"w":"13번 문장에서 재료를 갈아 주는 기준은 물이 없어지는 것이 아니라 부드럽고 크림 같은 혼합물이 될 때까지(until you have a smooth and creamy mixture)예요.","c":"F"},"h":"7c33c66c90"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Which do you prefer, pouring sauce over food or dipping food in it? If you prefer the latter, you will enjoy dips.)","ko":"당신은 소스를 음식 위에 붓는 것과 음식을 소스에 찍는 것 중 무엇을 더 선호하는가? 만약 당신이 후자를 선호한다면, 당신은 딥을 좋아하게 될 것이다.","opts":["전자","후자","어느 쪽도 아닌 것","둘 다"],"word":"latter","r":{"a":"2) 후자","ev":"1~2번 문장","s":[[1,"Which do you prefer, pouring sauce over food or dipping food in it?","당신은 소스를 음식 위에 붓는 것과 음식을 소스에 찍는 것 중 무엇을 더 선호하는가?"],[2,"If you prefer the latter, you will enjoy dips because they are thick sauces that are made for dipping food in.","만약 당신이 후자를 선호한다면, 당신은 딥을 좋아하게 될 것인데, 그것들은 음식을 찍어 먹기 위해 만들어진 걸쭉한 소스이기 때문이다."]],"w":"1번에서 두 가지(붓는 것, 찍는 것)를 말했고 2번 the latter는 그중 뒤에 말한 것, 즉 찍는 것을 가리켜요. latter = 후자.","c":2},"h":"ae205d221d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Although hummus is sometimes eaten on its own, it is most commonly scooped up with other foods.)","ko":"비록 후무스가 때때로 그 자체로 소비되기도 하지만, 그것은 가장 일반적으로 다른 음식들과 함께 퍼 올려진다.","opts":["던져진","삶아진","퍼 올려진","얼려진"],"word":"scooped","r":{"a":"3) 퍼 올려진","ev":"5번 문장","s":[[5,"Although hummus is sometimes eaten on its own, it is most commonly scooped up with other foods.","비록 후무스가 때때로 그 자체로 소비되기도 하지만, 그것은 가장 일반적으로 다른 음식들과 함께 퍼 올려진다."]],"w":"5번 문장에서 후무스를 다른 음식(빵이나 야채)으로 떠서 먹는다는 뜻이에요. scoop up = 퍼 올리다.","c":3},"h":"5d4f10d60d"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nNow, enjoy your homemade hummus by dipping vegetables or bread into it!","ko":"밑줄 친 it이 가리키는 것은?","sko":"이제, 야채나 빵을 찍어 당신의 수제 후무스를 즐겨라!","opts":["수제 후무스","야채","빵","블렌더"],"r":{"a":"1) 수제 후무스","ev":"15번 문장","s":[[15,"Now, enjoy your homemade hummus by dipping vegetables or bread into it!","이제, 야채나 빵을 찍어 당신의 수제 후무스를 즐겨라!"]],"w":"15번 문장에서 야채나 빵을 찍는 대상은 앞에 나온 your homemade hummus(수제 후무스)예요.","c":1},"h":"7a3b21eb54"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s a piece of cake, isn’t it?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 식은 죽 먹기다, 그렇지 않은가?","opts":["이 요리는 디저트로 케이크를 곁들여 먹는다.","이 요리는 만들기가 매우 어렵다.","이 요리는 케이크보다 더 달다.","이 요리는 만들기가 아주 쉽다."],"r":{"a":"4) 이 요리는 만들기가 아주 쉽다.","ev":"14번 문장","s":[[14,"It’s a piece of cake, isn’t it?","그것은 식은 죽 먹기다, 그렇지 않은가?"]],"w":"a piece of cake는 '식은 죽 먹기', 즉 아주 쉬운 일이라는 말이에요. 앞의 조리 단계(10~13번)가 간단하다는 것을 정리해요.","c":4},"h":"cf2929214a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["딥은 음식 위에 붓는 묽은 소스이다.","글쓴이는 독자에게 후무스를 직접 만들어 보라고 권한다.","후무스는 20세기에 처음 만들어졌다.","후무스는 만들기 어려워서 인기가 적다."],"opts":["Dips are thin sauces that are poured over food.","The writer asks readers to try making hummus themselves.","Hummus was first created in the 20th century.","Hummus is hard to make, so it is not very popular."],"r":{"a":"2) The writer asks readers to try making hummus themselves.","ev":"9번 문장","s":[[9,"Why don’t you try it yourself?","당신 스스로 한번 시도해 보지 않겠는가?"]],"w":"9번 문장 Why don’t you try it yourself?는 직접 해 보라는 권유예요. 딥은 걸쭉한 소스이고(2번), 초기 조리법은 13세기까지 올라가며(4번), 조리법이 간단해 인기가 많다고 해요(7번).","c":2},"h":"38b938870b"},{"n":9,"t":"sum","q":"Hummus is a (A) dip made from chickpeas, and it (B) in the Middle East.","ko":"후무스는 병아리콩으로 만든 (A) 딥이고, 중동에서 (B)했다.","oko":["(A) 묽은 / (B) 유래","(A) 묽은 / (B) 사라졌다","(A) 단 / (B) 유래","(A) 걸쭉한 / (B) 사라졌다","(A) 걸쭉한 / (B) 유래"],"opts":["(A) thin / (B) originated","(A) thin / (B) disappeared","(A) sweet / (B) originated","(A) thick / (B) disappeared","(A) thick / (B) originated"],"r":{"a":"5) (A) thick / (B) originated","ev":"3~4번 문장","s":[[3,"A well-known example is hummus, a thick, creamy dip made from chickpeas.","잘 알려진 예시는 병아리콩으로 만든 걸쭉하고 크림 같은 딥인 후무스이다."],[4,"It originated in the Middle East, with early recipes dating back to the 13th century.","그것은 중동에서 유래했으며, 초기 조리법은 13세기까지 거슬러 올라간다."]],"w":"3번에서 후무스는 병아리콩으로 만든 걸쭉한(thick) 딥이고, 4번에서 중동에서 유래했다(originated)고 해요. 묽다, 달다, 사라졌다는 말은 본문에 없어요.","c":5},"h":"8ac128217e"},{"n":10,"t":"fill","q":"The primary reason for hummus’s [A] popularity is its [B] preparation method.","ko":"후무스의 [A] 인기의 주된 이유는 그것의 [B] 조리법이다.","bank":["widespread","simple","sometimes","creamy","minced","latter"],"bko":{"widespread":"광범위한","simple":"간단한","sometimes":"때때로","creamy":"크림 같은","minced":"다진","latter":"후자"},"r":{"a":"[A] widespread, [B] simple","ev":"7번 문장","s":[[7,"The primary reason behind its widespread popularity is its simple preparation method!","그것의 광범위한 인기의 주된 이유는 간단한 조리법이다!"]],"w":"7번 문장에서 its widespread popularity(광범위한 인기)의 주된 이유는 its simple preparation method(간단한 조리법)라고 해요. thick·creamy·minced는 후무스나 재료를 꾸미는 말이고, latter는 2번의 '후자'라 이 자리에 맞지 않아요.","c":null},"h":"45e51590d4"}]},{"u":4,"id":"ms2-04-3","no":3,"ko":"거절로 만든 최초의 열쇠","items":[{"n":1,"t":"tf","q":"Coleman worked as a manicurist during World War I.","ko":"콜먼은 제1차 세계대전 동안 손톱 관리사로 일했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Born in 1892, Coleman worked as a manicurist during World War I.","1892년에 태어난 콜먼은 제1차 세계대전 동안 손톱 관리사로 일했다."]],"w":"4번 문장에서 콜먼은 제1차 세계대전 동안 손톱 관리사로 일했다고 해요.","c":"T"},"h":"78f16c8523"},{"n":2,"t":"tf","q":"As a Black woman in the US, Coleman had a wide range of job opportunities.","ko":"미국에서 흑인 여성으로서, 콜먼은 다양한 직업 기회를 가지고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"As a Black woman in the US, her job opportunities were limited to service roles.","미국에서 흑인 여성으로서, 그녀의 직업 기회는 서비스 역할에 국한되었다."]],"w":"5번 문장에서 흑인 여성으로서 직업 기회가 서비스 역할에 국한되었다고 해요. 다양했다는 말은 반대예요.","c":"F"},"h":"52eabf1d55"},{"n":3,"t":"tf","q":"Coleman returned to the US a few months after she earned her pilot’s license.","ko":"콜먼은 비행사 면허를 취득한 몇 달 후 미국으로 돌아왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"A few months later, she returned to the US with a determination to enter the aviation industry.","몇 달 후, 그녀는 항공 산업에 진출하겠다는 결심을 가지고 미국으로 돌아왔다."]],"w":"12번 문장에서 몇 달 후(A few months later) 항공 산업에 진출하려는 결심으로 미국으로 돌아왔다고 해요. 바로 앞 11번에서 면허를 땄어요.","c":"T"},"h":"f5d8b8f29d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Despite the obstacles, Coleman earned her pilot’s license in 1921 and gained international recognition as a skilled aviator.)","ko":"그 장애물들에도 불구하고, 콜먼은 1921년에 비행사 면허를 취득했고 숙련된 비행사로서 국제적 인정을 얻었다.","opts":["기회","도움","장애물","결과"],"word":"obstacles","r":{"a":"3) 장애물","ev":"11번 문장","s":[[11,"Despite the obstacles, Coleman earned her pilot’s license in 1921 and gained international recognition as a skilled aviator.","그 장애물들에도 불구하고, 콜먼은 1921년에 비행사 면허를 취득했고 숙련된 비행사로서 국제적 인정을 얻었다."]],"w":"Despite(~에도 불구하고) 뒤에는 어려운 것이 와야 해요. 앞 10번에서 긴 여정과 프랑스어를 배우는 어려움을 말했으므로 obstacles = 장애물이에요.","c":3},"h":"7634398106"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This was a courageous decision, as it involved not only a long journey to France, but also the challenge of learning French.)","ko":"이것은 용기 있는 결정이었는데, 그 이유는 프랑스로의 긴 여정뿐만 아니라 프랑스어를 배우는 어려움도 수반했기 때문이다.","opts":["용기 있는","어리석은","쉬운","지루한"],"word":"courageous","r":{"a":"1) 용기 있는","ev":"10번 문장","s":[[10,"This was a courageous decision, as it involved not only a long journey to France, but also the challenge of learning French.","이것은 용기 있는 결정이었는데, 그 이유는 프랑스로의 긴 여정뿐만 아니라 프랑스어를 배우는 어려움도 수반했기 때문이다."]],"w":"10번 문장에서 긴 여정과 프랑스어를 배우는 어려움이 따르는 결정이라고 했으니, 그 결정을 한 것은 courageous = 용기 있는 일이에요.","c":1},"h":"41cf10f0c6"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nShe admired their achievements and developed a new ambition—to become a pilot!","ko":"밑줄 친 their가 가리키는 것은?","sko":"그녀는 그들의 업적을 존경했고 비행사가 되려는 새로운 야망을 키우게 되었다!","opts":["콜먼의 오빠와 친구들","미국의 비행 학교들","제1차 세계대전의 군인들","프랑스의 여성 비행사들"],"r":{"a":"4) 프랑스의 여성 비행사들","ev":"6~7번 문장","s":[[6,"It wasn’t until her brother returned from the war and spoke about the female pilots in France that everything changed.","그녀의 오빠가 전쟁에서 돌아와 프랑스의 여성 비행사들에 대해 이야기하고 나서야 비로소 모든 것이 바뀌었다."],[7,"She admired their achievements and developed a new ambition—to become a pilot!","그녀는 그들의 업적을 존경했고 비행사가 되려는 새로운 야망을 키우게 되었다!"]],"w":"6번에서 오빠가 이야기한 것은 the female pilots in France(프랑스의 여성 비행사들)이고, 7번 their는 그들의 업적을 존경했다는 뜻이에요.","c":4},"h":"3a442e1fde"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"She spent her whole life trying to get people to say yes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀는 사람들이 ‘예’라고 말하게 하기 위해 평생을 바쳤다.","opts":["그녀는 사람들에게 ‘예’라는 말을 듣는 것이 평생 쉬웠다.","그녀는 사람들이 ‘예’라고 말해 주도록 평생 애썼다.","그녀는 평생 사람들에게 ‘아니오’라고 말했다.","그녀는 평생 ‘예’라는 말을 한 번도 하지 않았다."],"r":{"a":"2) 그녀는 사람들이 ‘예’라고 말해 주도록 평생 애썼다.","ev":"3번 문장","s":[[3,"She spent her whole life trying to get people to say yes.","그녀는 사람들이 ‘예’라고 말하게 하기 위해 평생을 바쳤다."]],"w":"spend + 시간 + v-ing는 '~하는 데 시간을 보내다'이고, get people to say yes는 사람들이 '예'라고 말하게 하다예요. 허락과 성공을 얻으려 평생 애썼다는 뜻이에요.","c":2},"h":"0effb240b9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["콜먼은 프랑스로 가기 전에 미국의 비행 학교에서 비행을 배웠다.","콜먼은 에어쇼에서 공연한 뒤 비행을 그만두었다.","콜먼은 흑인 비행사들을 위한 비행 학교를 세우려고 자금을 모았다.","콜먼의 오빠가 프랑스에서 그녀에게 비행을 가르쳐 주었다."],"opts":["Coleman learned to fly at a flight school in the US before going to France.","Coleman gave up flying after performing in air shows.","Coleman raised funds to establish a flight school for Black aviators.","Coleman’s brother taught her how to fly in France."],"r":{"a":"3) Coleman raised funds to establish a flight school for Black aviators.","ev":"14번 문장","s":[[14,"In addition, as an activist, Coleman encouraged African Americans to become pilots, raising funds to establish a flight school to train Black aviators.","게다가, 콜먼은 활동가로서 흑인 비행사들을 훈련시키는 비행 학교를 설립하기 위한 자금을 모으면서 아프리카계 미국인들이 비행사가 되도록 장려했다."]],"w":"14번 문장에서 콜먼은 흑인 비행사들을 훈련시키는 비행 학교를 세우려고 자금을 모았어요. 미국 비행 학교에서는 거절당했고(8번), 에어쇼에서 곡예 비행을 하기 시작했으며(13번), 오빠는 프랑스 여성 비행사들 이야기를 해 주었을 뿐이에요(6번).","c":3},"h":"c0e79bedc7"},{"n":9,"t":"sum","q":"Coleman was (A) by flight schools in the US, so she (B) to France.","ko":"콜먼은 미국의 비행 학교들에게 (A), 그래서 프랑스로 (B).","oko":["(A) 받아들여졌고 / (B) 머물렀다","(A) 받아들여졌고 / (B) 갔다","(A) 거절당했고 / (B) 머물렀다","(A) 칭찬받았고 / (B) 갔다","(A) 거절당했고 / (B) 갔다"],"opts":["(A) accepted / (B) stayed","(A) accepted / (B) went","(A) rejected / (B) stayed","(A) praised / (B) went","(A) rejected / (B) went"],"r":{"a":"5) (A) rejected / (B) went","ev":"8~9번 문장","s":[[8,"But she was rejected from flight schools in the US due to both her race and gender.","그러나 그녀는 그녀의 인종과 성별 때문에 미국의 비행 학교들에서 거절당했다."],[9,"Thus, she went to France!","그래서 그녀는 프랑스로 갔다!"]],"w":"8번에서 콜먼은 인종과 성별 때문에 미국 비행 학교에서 거절당했고(rejected), 9번에서 Thus(그래서) 프랑스로 갔어요(went). 받아들여졌거나 칭찬받았다는 말, 머물렀다는 말은 본문과 달라요.","c":5},"h":"fe4737ac37"},{"n":10,"t":"fill","q":"She [A] performing in air shows as a [B] pilot.","ko":"그녀는 [B] 비행사로서 에어쇼에서 공연하는 것을 [A].","bank":["started","stunt","license","journey","ambition","determination"],"bko":{"started":"시작했다","stunt":"곡예(의)","license":"면허","journey":"여정","ambition":"야망","determination":"결심"},"r":{"a":"[A] started (시작했다), [B] stunt (곡예의)","ev":"13번 문장","s":[[13,"She started performing in air shows as a stunt pilot.","그녀는 곡예 비행사로 에어쇼에서 공연하기 시작했다."]],"w":"13번 문장 She started performing in air shows as a stunt pilot에서 가져왔어요. 주어 뒤에는 동사 started(시작했다)가, pilot 앞에는 stunt(곡예)가 와서 '곡예 비행사'가 돼요. 나머지는 명사라서 동사 자리에 올 수 없어요.","c":null},"h":"e1253abc24"}]},{"u":4,"id":"ms2-04-4","no":4,"ko":"Just a Dot. Just Everything.","items":[{"n":1,"t":"tf","q":"The photograph of Earth was taken by the spacecraft Voyager 1 in 1990.","ko":"지구의 사진은 1990년에 우주선 ‘보이저 1호’에 의해 촬영되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"This image was taken on February 14, 1990, by the spacecraft Voyager 1.","이 이미지는 1990년 2월 14일, 우주선 ‘보이저 1호’에 의해 촬영되었다."]],"w":"4번 문장에서 이 이미지는 1990년 2월 14일 우주선 ‘보이저 1호’에 의해 촬영되었다고 해요.","c":"T"},"h":"f8f3e268a7"},{"n":2,"t":"tf","q":"Earth appeared far outside the pale beam in the photograph.","ko":"지구는 사진 속 창백한 빛줄기에서 멀리 벗어나 보였다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"By chance, Earth fell within that beam, and the light made our planet appear even more trivial—almost lost within the vast darkness of space.","우연히도, 지구가 그 빛줄기 안에 들어왔고, 그 빛은 지구를 훨씬 더 사소하게 보이게 만들었는데, 광활한 우주의 어둠 속에서 거의 길을 잃은 것처럼 보였다."]],"w":"11번 문장에서 지구가 그 빛줄기 안에 들어왔다(Earth fell within that beam)고 해요. 빛줄기 밖에 있었다는 말은 반대예요.","c":"F"},"h":"8b5e488928"},{"n":3,"t":"tf","q":"The pale beam in the photo was created by sunlight scattering inside the camera lens.","ko":"사진 속 창백한 빛줄기는 카메라 렌즈 안에서 산란된 햇빛에 의해 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"When the image was captured, sunlight scattered inside the camera lens, creating the pale beam seen in the photograph.","사진이 찍혔을 때, 햇빛이 카메라 렌즈 안에서 산란되어 창백한 빛줄기를 사진에 만들어냈다."]],"w":"10번 문장에서 햇빛이 카메라 렌즈 안에서 산란되어 창백한 빛줄기를 만들어 냈다고 해요.","c":"T"},"h":"29d200c8a9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Inside it, a tiny blue dot appears—easy to overlook, almost insignificant.)","ko":"그 안에서, 아주 작은 푸른 점이 나타나는데, 간과하기 쉽고 거의 하찮아 보인다.","opts":["간과하다","발견하다","보호하다","촬영하다"],"word":"overlook","r":{"a":"1) 간과하다","ev":"2번 문장","s":[[2,"Inside it, a tiny blue dot appears—easy to overlook, almost insignificant.","그 안에서, 아주 작은 푸른 점이 나타나는데, 간과하기 쉽고 거의 하찮아 보인다."]],"w":"2번 문장에서 아주 작은 점이라 '못 보고 지나치기 쉽다'는 뜻이에요. 뒤의 almost insignificant(거의 하찮은)와도 이어져요. overlook = 간과하다.","c":1},"h":"88c5b7f4c5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Reflecting on this image, American astronomer Carl Sagan described it as a humbling self-portrait of humanity and its existence.)","ko":"이 사진을 되돌아보며, 미국의 천문학자 칼 세이건은 그것을 인류와 그 존재에 대한 겸허한 자화상이라고 묘사했다.","opts":["자랑스럽게 만드는","지루하게 하는","겸허하게 만드는","화나게 하는"],"word":"humbling","r":{"a":"3) 겸허하게 만드는","ev":"12번 문장","s":[[12,"Reflecting on this image, American astronomer Carl Sagan described it as a humbling self-portrait of humanity and its existence.","이 사진을 되돌아보며, 미국의 천문학자 칼 세이건은 그것을 인류와 그 존재에 대한 겸허한 자화상이라고 묘사했다."]],"w":"12번 문장에서 세이건은 작은 점으로 보이는 지구를 보며 인류가 겸손해진다고 말해요. humbling = 겸허하게 만드는.","c":3},"h":"a9336dfd18"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nIt was from this perspective that Sagan gave that small and ordinary-looking dot its name: the Pale Blue Dot.","ko":"밑줄 친 its가 가리키는 것은?","sko":"바로 이러한 관점에서 세이건은 그 작고 평범해 보이는 점에 이름을 붙였는데, 그것이 바로 ‘창백한 푸른 점’이다.","opts":["칼 세이건","그 작고 평범해 보이는 점","보이저 1호","태양계"],"r":{"a":"2) 그 작고 평범해 보이는 점","ev":"14번 문장","s":[[14,"It was from this perspective that Sagan gave that small and ordinary-looking dot its name: the Pale Blue Dot.","바로 이러한 관점에서 세이건은 그 작고 평범해 보이는 점에 이름을 붙였는데, 그것이 바로 ‘창백한 푸른 점’이다."]],"w":"14번 문장에서 세이건이 이름을 준 대상은 that small and ordinary-looking dot(그 작고 평범해 보이는 점)이고, its는 그 점의 이름을 말해요.","c":2},"h":"637b31e916"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even from a great distance, pointing a camera toward the Sun could damage the spacecraft’s instruments.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아주 먼 거리에서조차, 카메라를 태양 쪽으로 향하게 하는 것은 이 우주선의 기기들을 손상시킬 수 있었다.","opts":["멀리서는 카메라를 태양 쪽으로 향해도 우주선이 안전했다.","가까이 가면 카메라가 태양 때문에 고장 날 수 있었다.","카메라 때문에 태양이 손상될 수 있었다.","먼 거리에서도 카메라를 태양 쪽으로 돌리면 우주선의 기기가 손상될 수 있었다."],"r":{"a":"4) 먼 거리에서도 카메라를 태양 쪽으로 돌리면 우주선의 기기가 손상될 수 있었다.","ev":"8번 문장","s":[[8,"Even from a great distance, pointing a camera toward the Sun could damage the spacecraft’s instruments.","아주 먼 거리에서조차, 카메라를 태양 쪽으로 향하게 하는 것은 이 우주선의 기기들을 손상시킬 수 있었다."]],"w":"Even from a great distance는 '아주 먼 거리에서조차'예요. pointing a camera toward the Sun이 주어이고, 그것이 기기를 손상시킬 수 있었다(could damage)는 뜻이에요.","c":4},"h":"00a68307e4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["‘보이저 1호’는 임무의 대부분을 마친 뒤 태양계를 벗어날 준비를 하고 있었다.","‘보이저 1호’는 임무를 막 시작했을 때 사진을 찍었다.","NASA의 과학자들은 ‘보이저 1호’가 태양계를 벗어난 뒤에 사진을 찍기로 했다.","그 사진은 1995년 2월 14일에 촬영되었다."],"opts":["Voyager 1 was getting ready to leave the solar system after finishing most of its mission.","Voyager 1 took the photograph just after starting its mission.","NASA scientists decided to take the photograph after Voyager 1 left the solar system.","The photograph was taken on February 14, 1995."],"r":{"a":"1) Voyager 1 was getting ready to leave the solar system after finishing most of its mission.","ev":"5번 문장","s":[[5,"Having completed most of its assigned mission, Voyager 1 was preparing to pass beyond the solar system.","할당된 임무의 대부분을 완수한 후, ‘보이저 1호’는 태양계 너머로 지나갈 준비를 하고 있었다."]],"w":"5번 문장에서 임무의 대부분을 완수한 후 태양계 너머로 지나갈 준비를 하고 있었다고 해요. 6번에서 사진은 태양계를 떠나기 전에 찍기로 했고, 4번에서 촬영일은 1990년 2월 14일이에요.","c":1},"h":"713534bf7a"},{"n":9,"t":"sum","q":"NASA scientists decided to turn the camera back toward the (B) planets and take one (A) photograph of Earth.","ko":"NASA의 과학자들은 카메라를 다시 (B) 행성들 쪽으로 돌려 지구의 (A) 사진 한 장을 찍기로 했다.","oko":["(A) 첫 / (B) 내부","(A) 마지막 / (B) 외부","(A) 선명한 / (B) 외부","(A) 첫 / (B) 외부","(A) 마지막 / (B) 내부"],"opts":["(A) first / (B) inner","(A) final / (B) outer","(A) clear / (B) outer","(A) first / (B) outer","(A) final / (B) inner"],"r":{"a":"5) (A) final / (B) inner (마지막 / 내부)","ev":"6번 문장","s":[[6,"Before leaving the solar system, scientists at NASA decided to turn the camera back toward the inner planets and take one final photograph of  상을 받으러 무대에 올라간 직후 슬라임을 뒤집어썼다.","아이 선택 수상은 한국의 TV 방송국에 의해 개최된다.","슬라임은 수상자가 시상식의 진행자일 때에만 나온다."],"r":{"a":"2) Robert Downey Jr. was covered with slime right after going up on stage to accept his award.","ev":"2~3번 문장","s":[[2,"Hearing his name, he excitedly comes up on stage to accept his award.","그의 이름을 듣고, 그는 상을 받기 위해 흥분하여 무대 위로 올라간다."],[3,"Then out of nowhere, a massive amount of neon green slime covers him!","그때 난데없이, 엄청난 양의 네온 녹색 슬라임이 그를 덮친다!"]],"w":"2번에서 이름이 불린 로버트 다우니 주니어가 상을 받으러 무대에 올라가고, 3번에서 난데없이 슬라임이 그를 덮쳐요. 그는 상을 받는 수상자이고(1번), 방송국은 미국 방송국(5번)이며, 슬라임은 수상자와 진행자 모두에게 쓰여요(12번).","c":2},"h":"228a50892f"},{"n":9,"t":"sum","q":"A (A) amount of neon green slime suddenly covers a winner, which is a (B) scene at the Kids’ Choice Awards.","ko":"(A) 양의 네온 녹색 슬라임이 갑자기 수상자를 덮치는데, 이는 아이 선택 수상에서 (B) 장면이다.","opts":["(A) tiny / (B) common","(A) massive / (B) rare","(A) tiny / (B) rare","(A) massive / (B) dangerous","(A) massive / (B) common"],"oko":["(A) 아주 적은 / (B) 흔한","(A) 엄청난 / (B) 드문","(A) 아주 적은 / (B) 드문","(A) 엄청난 / (B) 위험한","(A) 엄청난 / (B) 흔한"],"r":{"a":"5) (A) massive / (B) common (엄청난 / 흔한)","ev":"3~4번 문장","s":[[3,"Then out of nowhere, a massive amount of neon green slime covers him!","그때 난데없이, 엄청난 양의 네온 녹색 슬라임이 그를 덮친다!"],[4,"Surprisingly, it’s a common scene at the Kids’ Choice Awards.","놀랍게도, 그것은 아이 선택 수상에서 흔한 장면이다."]],"w":"3번에서 엄청난 양(a massive amount)의 슬라임이 난데없이 수상자를 덮치고, 4번에서 놀랍게도 아이 선택 수상에서는 흔한(common) 장면이라고 해요. tiny, rare, dangerous는 본문과 맞지 않아요.","c":5},"h":"b1bc899588"},{"n":10,"t":"fill","q":"Award winners and even hosts can get covered with it at any [A], adding more fun and [B] to the awards.","ko":"수상자들과 심지어 진행자들도 어느 [A]에든 그것을 뒤집어쓸 수 있으며, 시상식에 더 많은 재미와 [B]을(를) 더한다.","bank":["moment","excitement","typical","iconic","blimp","voting"],"bko":{"moment":"순간","excitement":"흥분","typical":"전형적인","iconic":"상징적인","blimp":"비행선","voting":"투표"},"r":{"a":"[A] moment (순간), [B] excitement (흥분)","ev":"12번 문장","s":[[12,"Award winners and even hosts can get covered with it at any moment, adding more fun and excitement to the awards.","수상자들과 심지어 진행자들도 언제든지 그것을 뒤집어쓸 수 있으며, 시상식에 더 많은 재미와 흥분을 더한다."]],"w":"12번 문장 Award winners and even hosts can get covered with it at any moment, adding more fun and excitement to the awards에서 가져왔어요. at any moment는 '언제든지', fun and excitement는 '재미와 흥분'이에요. 나머지는 이 자리에 맞지 않는 형용사나 다른 뜻의 명사예요.","c":null},"h":"626638bd2e"}]},{"u":5,"id":"ms2-05-2","no":2,"ko":"도심 속 빈 땅에 씨앗 폭탄을 던져라!","items":[{"n":1,"t":"tf","q":"Guerrilla gardeners are workers officially approved by the city to take care of parks.","ko":"게릴라 정원사들은 공원을 관리하도록 시에서 공식적으로 승인받은 일꾼들이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Guerrilla gardeners are individuals or small groups who engage in unauthorized gardening, often transforming neglected urban areas into green spaces.","게릴라 정원사들은 허가받지 않은 정원 가꾸기에 참여하는 개인이나 소규모 그룹으로, 종종 방치된 도시 지역을 녹지 공간으로 변화시킨다."]],"w":"4번 문장에서 게릴라 정원사는 unauthorized gardening, 즉 허가받지 않은 정원 가꾸기에 참여하는 개인이나 소규모 그룹이라고 해요. 공식 승인을 받았다는 말은 반대예요.","c":"F"},"h":"1f7850fdc6"},{"n":2,"t":"tf","q":"The Green Guerillas threw seed bombs into vacant lots to turn them into gardens.","ko":"그린 게릴라는 공터를 정원으로 바꾸기 위해 공터에 씨앗 폭탄을 던졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"For example, in New York City, a group called the Green Guerillas began throwing seed bombs—mixtures of seeds and clay—into vacant lots to transform them into gardens.","예를 들어, 뉴욕시에서 '그린 게릴라'라고 불리는 한 그룹은 공터를 정원으로 바꾸기 위해 씨앗과 진흙의 혼합물인 씨앗 폭탄을 공터에 던지기 시작했다."]],"w":"6번 문장에서 그린 게릴라가 씨앗과 진흙의 혼합물인 씨앗 폭탄을 공터에 던져 정원으로 바꾸려 했다고 해요.","c":"T"},"h":"156593cd63"},{"n":3,"t":"tf","q":"The Liz Christy Community Garden was named after a mayor of New York City.","ko":"리즈 크리스티 커뮤니티 정원은 뉴욕시의 한 시장의 이름을 따서 지어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"This site became the Liz Christy Community Garden, taking its name from one of the group’s founders.","이 부지는 그 그룹의 설립자 중 한 명의 이름을 따서 '리즈 크리스티 커뮤니티 정원'이 되었다."]],"w":"8번 문장에서 정원은 시장이 아니라 그 그룹의 설립자 중 한 명의 이름을 땄다고 해요.","c":"F"},"h":"a6626adb0d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (And who put flower boxes in the windows of an abandoned building?)","ko":"그리고 누가 버려진 건물의 창문에 화분을 두었을까?","opts":["새로 지어진","유명한","버려진","깨끗한"],"word":"abandoned","r":{"a":"3) 버려진","ev":"2번 문장","s":[[2,"And who put flower boxes in the windows of an abandoned building?","그리고 누가 버려진 건물의 창문에 화분을 두었을까?"]],"w":"2번 문장은 3번에서 게릴라 정원사가 이런 곳에 화분을 둔다고 이어져요. 4번의 neglected(방치된) 도시 지역과 이어지는 말로, abandoned = 버려진.","c":3},"h":"1f0a7dc08e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The practice began as a form of protest against urban decay in the 1970s.)","ko":"그 관행은 1970년대 도시 쇠퇴에 대한 항의의 한 형태로 시작되었다.","opts":["성장","쇠퇴","관리","정화"],"word":"decay","r":{"a":"2) 쇠퇴","ev":"5번 문장","s":[[5,"The practice began as a form of protest against urban decay in the 1970s.","그 관행은 1970년대 도시 쇠퇴에 대한 항의의 한 형태로 시작되었다."]],"w":"항의(protest)의 대상이 되는 것이므로 좋은 상태가 아니라 나빠지는 상태예요. 4번의 방치된(neglected) 도시 지역과도 이어져요. decay = 쇠퇴, 부패.","c":2},"h":"6b02838f5b"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nIn 1974, their efforts were acknowledged by the city government, which agreed to rent them a large lot for the sum of $1 per month.","ko":"밑줄 친 which가 가리키는 것은?","opts":["그들의 노력","큰 부지","월 1달러","시 정부"],"sko":"1974년, 그들의 노력은 시 정부에 의해 인정받았고, 시 정부는 그들에게 월 1달러의 금액으로 큰 부지를 임대해 주는 것에 동의했다.","r":{"a":"4) 시 정부","ev":"7번 문장","s":[[7,"In 1974, their efforts were acknowledged by the city government, which agreed to rent them a large lot for the sum of $1 per month.","1974년, 그들의 노력은 시 정부에 의해 인정받았고, 시 정부는 그들에게 월 1달러의 금액으로 큰 부지를 임대해 주는 것에 동의했다."]],"w":"which 뒤의 agreed to rent(임대해 주는 것에 동의했다)의 주어가 되는 것은 노력이나 부지가 아니라 바로 앞에 나온 the city government예요.","c":4},"h":"f671a3bc76"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In fact, it has inspired hundreds of similar community garden projects across New York City over the past five decades.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그 정원은 지난 50년 동안 뉴욕시 전역의 수백 개의 비슷한 정원 프로젝트에 영감을 주었다.","그 정원은 뉴욕시 전역의 수백 개의 정원을 50년 전에 모두 없앴다.","뉴욕시의 수백 개 정원 프로젝트가 그 정원보다 먼저 시작되었다.","그 정원은 비슷한 프로젝트 없이 50년 동안 혼자 유지되었다."],"sko":"사실, 그것은 지난 50년 동안 뉴욕시 전역의 수백 개의 유사한 커뮤니티 정원 프로젝트에 영감을 주었다.","r":{"a":"1) 그 정원은 지난 50년 동안 뉴욕시 전역의 수백 개의 비슷한 정원 프로젝트에 영감을 주었다.","ev":"10번 문장","s":[[10,"In fact, it has inspired hundreds of similar community garden projects across New York City over the past five decades.","사실, 그것은 지난 50년 동안 뉴욕시 전역의 수백 개의 유사한 커뮤니티 정원 프로젝트에 영감을 주었다."]],"w":"has inspired는 '영감을 주어 왔다'는 뜻이고 over the past five decades는 지난 50년 동안이에요. 비슷한 프로젝트가 수백 개 생겼다는 내용이라 혼자 유지되었다는 말과 반대예요.","c":1},"h":"207770bc40"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The Green Guerillas stopped working after the city government refused to rent them land.","Guerrilla gardeners must receive the government’s permission before they plant anything.","The oldest community garden in the city still exists today.","The Liz Christy Community Garden closed down soon after the 1970s."],"oko":["시 정부가 땅을 임대해 주기를 거절한 뒤 그린 게릴라는 활동을 멈췄다.","게릴라 정원사들은 무엇이든 심기 전에 정부의 허락을 받아야 한다.","그 도시에서 가장 오래된 커뮤니티 정원은 오늘날에도 존재한다.","리즈 크리스티 커뮤니티 정원은 1970년대 직후에 문을 닫았다."],"r":{"a":"3) The oldest community garden in the city still exists today.","ev":"9번 문장","s":[[9,"It still exists today as the oldest community garden in the city.","그것은 오늘날에도 그 도시에서 가장 오래된 커뮤니티 정원으로 존재한다."]],"w":"9번 문장에서 리즈 크리스티 커뮤니티 정원은 오늘날에도 그 도시에서 가장 오래된 커뮤니티 정원으로 존재해요. 시 정부는 부지를 임대해 주었고(7번), 게릴라 정원사는 허가받지 않은 사람들이며(4번), 정원은 지금도 있어요(9번).","c":3},"h":"61f4f1fe65"},{"n":9,"t":"sum","q":"Guerrilla gardeners engage in (A) gardening, often transforming (B) urban areas into green spaces.","ko":"게릴라 정원사들은 (A) 정원 가꾸기에 참여하며, 종종 (B) 도시 지역을 녹지 공간으로 변화시킨다.","opts":["(A) unauthorized / (B) beautiful","(A) official / (B) neglected","(A) official / (B) beautiful","(A) expensive / (B) neglected","(A) unauthorized / (B) neglected"],"oko":["(A) 허가받지 않은 / (B) 아름다운","(A) 공식적인 / (B) 방치된","(A) 공식적인 / (B) 아름다운","(A) 값비싼 / (B) 방치된","(A) 허가받지 않은 / (B) 방치된"],"r":{"a":"5) (A) unauthorized / (B) neglected (허가받지 않은 / 방치된)","ev":"4번 문장","s":[[4,"Guerrilla gardeners are individuals or small groups who engage in unauthorized gardening, often transforming neglected urban areas into green spaces.","게릴라 정원사들은 허가받지 않은 정원 가꾸기에 참여하는 개인이나 소규모 그룹으로, 종종 방치된 도시 지역을 녹지 공간으로 변화시킨다."]],"w":"4번 문장 Guerrilla gardeners are individuals or small groups who engage in unauthorized gardening, often transforming neglected urban areas into green spaces에서 가져왔어요. 허가받지 않은(unauthorized) 정원 가꾸기를 하고, 방치된(neglected) 도시 지역을 녹지로 바꾼다는 뜻이에요.","c":5},"h":"4faea08a0f"},{"n":10,"t":"fill","q":"For example, in New York City, a group called the Green Guerillas began throwing seed bombs—[A] of seeds and [B]—into vacant lots to transform them into gardens.","ko":"예를 들어, 뉴욕시에서 ‘그린 게릴라’라고 불리는 한 그룹은 공터를 정원으로 바꾸기 위해 씨앗 폭탄(씨앗과 [B]의 [A])을 공터에 던지기 시작했다.","bank":["mixtures","clay","protest","decay","rent","founders"],"bko":{"mixtures":"혼합물(mixture의 복수형)","clay":"진흙","protest":"항의","decay":"쇠퇴","rent":"임대하다","founders":"설립자들"},"r":{"a":"[A] mixtures (혼합물), [B] clay (진흙)","ev":"6번 문장","s":[[6,"For example, in New York City, a group called the Green Guerillas began throwing seed bombs—mixtures of seeds and clay—into vacant lots to transform them into gardens.","예를 들어, 뉴욕시에서 '그린 게릴라'라고 불리는 한 그룹은 공터를 정원으로 바꾸기 위해 씨앗과 진흙의 혼합물인 씨앗 폭탄을 공터에 던지기 시작했다."]],"w":"6번 문장에서 씨앗 폭탄(seed bombs)은 mixtures of seeds and clay, 즉 씨앗과 진흙의 혼합물이라고 설명해요. mixtures는 복수형 명사이고(mixture의 복수형), clay는 재료 이름이에요. A와 B를 바꾸면 말이 안 돼요.","c":null},"h":"b7689d3dca"}]},{"u":5,"id":"ms2-05-3","no":3,"ko":"닿지도 않았는데 왜 끌려요?","items":[{"n":1,"t":"tf","q":"Most objects have more negative charges than positive charges.","ko":"대부분의 물체는 양전하보다 음전하를 더 많이 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Most objects have the same number of positive and negative charges.","대부분의 물체는 같은 수의 양전하와 음전하를 가지고 있다."]],"w":"3번 문장에서 대부분의 물체는 양전하와 음전하를 같은 수로 가진다고 해요. 음전하가 더 많다는 말은 본문과 달라요.","c":"F"},"h":"1a3e4d7bc0"},{"n":2,"t":"tf","q":"When a balloon is rubbed against hair, electrons move from the hair to the balloon.","ko":"풍선을 머리카락에 문지르면, 전자들은 머리카락에서 풍선으로 이동한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"For example, when you rub the balloon against your hair, electrons move from your hair to the balloon, giving it a negative charge and your hair a positive charge.","예를 들어, 당신이 풍선을 당신의 머리카락에 문지를 때, 전자들은 당신의 머리카락에서 풍선으로 이동하는데, 그것(풍선)에 음전하를 주고 당신의 머리카락에 양전하를 준다."]],"w":"6번 문장에 electrons move from your hair to the balloon이라고 그대로 나와요.","c":"T"},"h":"010fa5cf05"},{"n":3,"t":"tf","q":"Because similar charges attract each other, hair sticks to the balloon.","ko":"같은 전하끼리 서로 끌어당기기 때문에, 머리카락이 풍선에 달라붙는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"As opposite charges attract, your hair sticks to the balloon.","반대 전하는 서로 끌어당기므로, 당신의 머리카락은 풍선에 달라붙는다."]],"w":"7번 문장에서 머리카락이 달라붙는 것은 As opposite charges attract, 즉 반대 전하끼리 끌어당기기 때문이에요. 같은 전하끼리라는 말은 본문과 달라요.","c":"F"},"h":"b766849d65"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (As opposite charges attract, your hair sticks to the balloon.)","ko":"반대 전하는 서로 끌어당기므로, 당신의 머리카락은 풍선에 달라붙는다.","opts":["끌어당기다","밀어내다","없애다","바꾸다"],"word":"attract","r":{"a":"1) 끌어당기다","ev":"7번 문장","s":[[7,"As opposite charges attract, your hair sticks to the balloon.","반대 전하는 서로 끌어당기므로, 당신의 머리카락은 풍선에 달라붙는다."]],"w":"문장 뒤에서 머리카락이 풍선에 달라붙는다고 했으므로, 반대 전하끼리는 서로 끌어당겨요. attract = 끌어당기다.","c":1},"h":"2466d18b63"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (First, rub a plastic ruler with a wool cloth for several seconds, then slowly bring it near small bits of paper scattered on a table.)","ko":"먼저, 플라스틱 자를 양모 천으로 몇 초 동안 문지른 다음, 천천히 그것을 테이블에 흩어져 있는 종이 조각들 가까이 가져가라.","opts":["쌓여 있는","붙어 있는","접혀 있는","흩어져 있는"],"word":"scattered","r":{"a":"4) 흩어져 있는","ev":"9번 문장","s":[[9,"First, rub a plastic ruler with a wool cloth for several seconds, then slowly bring it near small bits of paper scattered on a table.","먼저, 플라스틱 자를 양모 천으로 몇 초 동안 문지른 다음, 천천히 그것을 테이블에 흩어져 있는 종이 조각들 가까이 가져가라."]],"w":"종이 조각들은 테이블 위 여기저기 작은 조각으로 놓여 있어서, 자를 가까이 가져가면 10번처럼 움직일 수 있어요. scattered = 흩어져 있는.","c":4},"h":"95725bcb8c"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nWhen the charged ruler comes close to the paper, which doesn’t carry a charge of its own, the positive parts inside the paper move closer, so the paper is pulled toward the ruler.","ko":"밑줄 친 which가 가리키는 것은?","opts":["자","양전하 부분","종이","전하"],"sko":"전하를 띤 자가 자체적으로 전하를 띠지 않은 종이에 가까워지면, 종이 내부의 양전하 부분이 더 가까이 이동하여 종이가 자 쪽으로 끌려간다.","r":{"a":"3) 종이","ev":"12번 문장","s":[[12,"When the charged ruler comes close to the paper, which doesn’t carry a charge of its own, the positive parts inside the paper move closer, so the paper is pulled toward the ruler.","전하를 띤 자가 자체적으로 전하를 띠지 않은 종이에 가까워지면, 종이 내부의 양전하 부분이 더 가까이 이동하여 종이가 자 쪽으로 끌려간다."]],"w":"which 뒤에 doesn’t carry a charge of its own(자체적으로 전하를 띠지 않는다)이 이어지는데, 이것은 자가 아니라 바로 앞에 나온 the paper를 설명하는 말이에요. 자는 음전하를 띠고 있어요(11번).","c":3},"h":"36436a899f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This shows how static electricity can make objects move without touching them.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["이것은 정전기가 물체를 만지지 않고도 움직이게 할 수 있음을 보여 준다.","이것은 물체를 만지면 정전기가 사라지는 이유를 보여 준다.","이것은 움직이는 물체가 정전기를 만드는 방법을 보여 준다.","이것은 정전기가 물체를 만져야만 움직이게 할 수 있음을 보여 준다."],"sko":"이것은 정전기가 어떻게 접촉 없이 물체들을 움직일 수 있는지를 보여준다.","r":{"a":"1) 이것은 정전기가 물체를 만지지 않고도 움직이게 할 수 있음을 보여 준다.","ev":"13번 문장","s":[[13,"This shows how static electricity can make objects move without touching them.","이것은 정전기가 어떻게 접촉 없이 물체들을 움직일 수 있는지를 보여준다."]],"w":"without touching them은 '그것들을 만지지 않고'라는 뜻이에요. 앞의 실험(8~12번)에서 자가 종이에 닿지 않고도 끌어당겼으므로, 접촉 없이 물체를 움직일 수 있다는 뜻이에요.","c":1},"h":"4b2422eb3b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Electrons are particles that have a positive charge.","Electrons move between two objects when they are rubbed together.","Rubbing a balloon on hair moves electrons from the balloon to the hair.","Most objects have an imbalance of charges before they are rubbed."],"oko":["전자는 양전하를 띤 입자이다.","두 물체를 서로 문지르면 전자가 두 물체 사이에서 이동한다.","풍선을 머리카락에 문지르면 전자가 풍선에서 머리카락으로 이동한다.","대부분의 물체는 문지르기 전에 전하의 불균형을 가지고 있다."],"r":{"a":"2) Electrons move between two objects when they are rubbed together.","ev":"3~4번 문장","s":[[3,"Most objects have the same number of positive and negative charges.","대부분의 물체는 같은 수의 양전하와 음전하를 가지고 있다."],[4,"But when two objects are rubbed together, negatively charged particles called electrons move from one to the other.","그러나 두 물체가 서로 문질러지면, 전자라고 불리는 음전하를 띤 입자들이 하나에서 다른 하나로 이동한다."]],"w":"4번 문장에서 두 물체를 서로 문지르면 전자가 하나에서 다른 하나로 이동해요. 전자는 음전하를 띤 입자이고(4번), 풍선과 머리카락에서는 머리카락에서 풍선으로 이동하며(6번), 문지르기 전에는 대부분 같은 수의 전하를 가져요(3번).","c":2},"h":"5b1790b996"},{"n":9,"t":"sum","q":"Here is a fun way to (A) static electricity in action: the paper pieces (B) up and stick to the ruler.","ko":"정전기가 작용하는 모습을 (A)하는 재미있는 방법은, 종이 조각들이 위로 (B) 자에 달라붙는 것을 보는 것이다.","opts":["(A) ignore / (B) jump","(A) witness / (B) sink","(A) avoid / (B) jump","(A) ignore / (B) sink","(A) witness / (B) jump"],"oko":["(A) 무시 / (B) 튀어 올라","(A) 목격 / (B) 가라앉아","(A) 회피 / (B) 튀어 올라","(A) 무시 / (B) 가라앉아","(A) 목격 / (B) 튀어 올라"],"r":{"a":"5) (A) witness / (B) jump (목격 / 튀어 올라)","ev":"8번, 10번 문장","s":[[8,"Here’s a fun way to witness static electricity in action.","여기 정전기가 작용하는 것을 목격하는 재미있는 방법이 있다."],[10,"You’ll see the paper pieces jump up and stick to the ruler.","당신은 종이 조각들이 위로 튀어 오르고 자에 달라붙는 것을 볼 것이다."]],"w":"8번 문장 Here’s a fun way to witness static electricity in action에서 witness는 '목격하다'예요. 10번 문장 You’ll see the paper pieces jump up and stick to the ruler에서 종이 조각들은 위로 튀어 오르고(jump up) 자에 달라붙어요. sink(가라앉다)는 본문과 맞지 않아요.","c":5},"h":"7260cbaaaf"},{"n":10,"t":"fill","q":"Rubbing the ruler [A] it [B] electrons, making it negatively charged.","ko":"자를 문지르는 것은 그것에 [B] 전자들을 [A], 자를 음전하를 띠게 만든다.","bank":["gives","extra","scattered","opposite","wool","particles"],"bko":{"gives":"준다(give의 3인칭 단수형)","extra":"추가의","scattered":"흩어진","opposite":"반대의","wool":"양모","particles":"입자들"},"r":{"a":"[A] gives (준다), [B] extra (추가의)","ev":"11번 문장","s":[[11,"This happens because rubbing the ruler gives it extra electrons, making it negatively charged.","이것은 자를 문지르는 것이 그것에 추가적인 전자들을 제공하여, 자를 음전하를 띠게 만들기 때문에 일어난다."]],"w":"11번 문장 This happens because rubbing the ruler gives it extra electrons, making it negatively charged에서 가져왔어요. 주어 rubbing the ruler 뒤에는 동사 gives(준다)가, electrons 앞에는 형용사 extra(추가의)가 와요. 나머지는 이 자리에 맞지 않아요.","c":null},"h":"b77ab5a2c1"}]},{"u":5,"id":"ms2-05-4","no":4,"ko":"Every History Book Has an Author.","items":[{"n":1,"t":"tf","q":"In Cabaret Crusades, puppets perform the scenes instead of human actors.","ko":"<카바레 크루세이즈>에서는 인간 배우들 대신 인형들이 장면을 연기한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Instead of human actors, the scenes in these films are performed by puppets, some with animal characteristics like cat ears or the long neck and teeth of camels.","인간 배우들 대신, 이 영화들에서의 장면들은 고양이 귀나 낙타의 긴 목과 이빨과 같은 동물적 특징을 가진 몇몇 인형들에 의해 연기된다."]],"w":"3번 문장에 Instead of human actors, the scenes in these films are performed by puppets라고 해요.","c":"T"},"h":"bbd2728a6f"},{"n":2,"t":"tf","q":"The European version of the Crusades is described as the definitive account of history.","ko":"유럽 버전의 십자군 전쟁은 역사의 확정적인 기록이라고 설명된다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"While the European version of the Crusades is the most widely known, it is only one interpretation, not the definitive one.","유럽 버전의 십자군 전쟁이 가장 널리 알려져 있지만, 그것은 단지 하나의 해석일 뿐이지, 확정적인 것이 아니다."]],"w":"5번 문장에서 유럽 버전은 가장 널리 알려져 있지만 only one interpretation, not the definitive one, 즉 하나의 해석일 뿐 확정적인 것은 아니라고 해요.","c":"F"},"h":"80bd07bee6"},{"n":3,"t":"tf","q":"The films draw attention to how unclear the line between facts and fiction is.","ko":"영화들은 사실과 허구 사이의 경계가 얼마나 불분명한지에 주목하게 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The movies also bring attention to the ambiguity between facts and fiction.","이 영화들은 또한 사실과 허구 사이의 모호함에 주목하도록 한다."]],"w":"7번 문장에서 영화는 the ambiguity between facts and fiction(사실과 허구 사이의 모호함)에 주목하게 한다고 해요. 모호함 = 경계가 불분명한 것이에요.","c":"T"},"h":"e37714a8f7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The films depict the Crusades, when European Christians battled Muslims for control of Jerusalem between 1095 and 1291.)","ko":"이 영화들은 십자군 전쟁을 묘사하는데, 이 전쟁은 1095년부터 1291년 사이에 유럽 기독교인들이 예루살렘 통제권을 두고 무슬림들과 싸웠던 때이다.","opts":["금지하다","번역하다","묘사하다","파괴하다"],"word":"depict","r":{"a":"3) 묘사하다","ev":"2번 문장","s":[[2,"The films depict the Crusades, when European Christians battled Muslims for control of Jerusalem between 1095 and 1291.","이 영화들은 십자군 전쟁을 묘사하는데, 이 전쟁은 1095년부터 1291년 사이에 유럽 기독교인들이 예루살렘 통제권을 두고 무슬림들과 싸웠던 때이다."]],"w":"영화가 십자군 전쟁을 어떻게 보여 주는지 말하는 문장이에요. 1번에서 이 영화들은 전쟁 영화 모음과 다르다고 했고, 영화는 전쟁을 그려 내요. depict = 묘사하다.","c":3},"h":"b77d1bbd58"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These themes urge viewers to question the objectivity of familiar historical narratives.)","ko":"이러한 주제들은 시청자들이 익숙한 역사적 이야기의 객관성에 의문을 제기하도록 촉구한다.","opts":["막는다","허락한다","속인다","촉구한다"],"word":"urge","r":{"a":"4) 촉구한다","ev":"11번 문장","s":[[11,"These themes urge viewers to question the objectivity of familiar historical narratives.","이러한 주제들은 시청자들이 익숙한 역사적 이야기의 객관성에 의문을 제기하도록 촉구한다."]],"w":"뒤의 to question(의문을 제기하도록)이 이어지는 것으로 보아, 시청자가 의문을 갖도록 재촉하는 뜻이에요. urge = 촉구하다.","c":4},"h":"6520614e27"},{"n":6,"t":"ref","q":"What does the underlined \"this idea\" refer to?\nPuppets represent this idea, since their strings symbolize manipulation.","ko":"밑줄 친 this idea가 가리키는 것은?","opts":["인형이 인간 배우보다 연기를 잘한다는 생각","역사는 완전히 객관적인 사실에만 기반하지는 않는다는 생각","유럽 버전의 십자군 전쟁만이 확정적이라는 생각","영화는 사실을 있는 그대로 보여 주어야 한다는 생각"],"sko":"인형들이 이 사상을 대변하는데, 이는 그들의 줄이 조작을 상징하기 때문이다.","r":{"a":"2) 역사는 완전히 객관적인 사실에만 기반하지는 않는다는 생각","ev":"8~9번 문장","s":[[8,"According to Shawky, history is not completely based on objective facts.","샤키에 따르면, 역사는 객관적인 사실에 완전히 기반하지 않는다."],[9,"Puppets represent this idea, since their strings symbolize manipulation.","인형들이 이 사상을 대변하는데, 이는 그들의 줄이 조작을 상징하기 때문이다."]],"w":"9번의 this idea는 바로 앞 8번에서 샤키가 말한 '역사는 객관적인 사실에 완전히 기반하지 않는다'는 생각이에요. 인형의 줄이 조작을 상징하기 때문에 인형이 그 생각을 대변해요.","c":2},"h":"eb4b8a2fd5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Just as the puppets can be controlled by outside forces, history can be shaped by those who tell it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["인형이 외부 세력에 조종되듯, 역사도 그것을 이야기하는 사람들에 의해 만들어질 수 있다.","인형이 역사를 이야기하듯, 외부 세력도 역사를 만들 수 있다.","역사가 사람들에 의해 조종되기 때문에, 인형도 외부 세력에 의해 형성된다.","인형을 조종하는 사람들은 역사를 이야기하는 사람들을 통제한다."],"sko":"인형들이 외부 세력에 의해 조종될 수 있는 것처럼, 역사는 그것을 이야기하는 사람들에 의해 형성될 수 있다.","r":{"a":"1) 인형이 외부 세력에 조종되듯, 역사도 그것을 이야기하는 사람들에 의해 만들어질 수 있다.","ev":"10번 문장","s":[[10,"Just as the puppets can be controlled by outside forces, history can be shaped by those who tell it.","인형들이 외부 세력에 의해 조종될 수 있는 것처럼, 역사는 그것을 이야기하는 사람들에 의해 형성될 수 있다."]],"w":"Just as ~는 '마치 ~처럼'이라는 비교예요. 인형이 외부 세력에 조종되는 것과 역사가 이야기하는 사람들에 의해 형성되는 것을 나란히 놓았어요. 나머지는 비교 대상이나 방향을 바꾼 내용이에요.","c":1},"h":"35654ae371"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Shawky’s films tell the story of the Crusades only from the European point of view.","Shawky says that history is based entirely on objective facts.","Shawky shows viewers a different viewpoint through the eyes of Arab historians.","Shawky’s films hide the ambiguity between facts and fiction."],"oko":["샤키의 영화는 십자군 전쟁 이야기를 유럽의 관점에서만 전한다.","샤키는 역사가 전적으로 객관적인 사실에 기반한다고 말한다.","샤키는 아랍 역사가들의 시선을 통해 시청자에게 다른 관점을 보여 준다.","샤키의 영화는 사실과 허구 사이의 모호함을 숨긴다."],"r":{"a":"3) Shawky shows viewers a different viewpoint through the eyes of Arab historians.","ev":"6번 문장","s":[[6,"By providing an alternate viewpoint through the lens of Arab historians, Shawky prompts viewers to consider a different perspective when evaluating history.","아랍 역사가들의 시선을 통해 대안적 관점을 제공함으로써, 샤키는 시청자들이 역사를 평가할 때 다른 관점을 고려하도록 촉구한다."]],"w":"6번 문장에서 샤키는 아랍 역사가들의 시선을 통해 대안적 관점을 제공해요. 유럽 관점만 쓴다는 말은 5~6번과 반대이고, 역사가 객관적 사실에만 기반한다는 말은 8번과 반대이며, 모호함에 주목하게 한다는 7번과 달리 숨기지 않아요.","c":3},"h":"f5160d357c"},{"n":9,"t":"sum","q":"These films (A) common themes in Shawky’s work, one of which is that there is no (B) perspective on the past.","ko":"이 영화들은 샤키의 작품에 나타나는 공통적인 주제들을 (A)하는데, 그중 하나는 과거에 대한 (B) 관점이 존재하지 않는다는 것이다.","opts":["(A) hide / (B) dangerous","(A) highlight / (B) cheap","(A) hide / (B) single","(A) ignore / (B) cheap","(A) highlight / (B) single"],"oko":["(A) 은폐 / (B) 위험한","(A) 강조 / (B) 값싼","(A) 은폐 / (B) 단일한","(A) 무시 / (B) 값싼","(A) 강조 / (B) 단일한"],"r":{"a":"5) (A) highlight / (B) single (강조 / 단일한)","ev":"4번 문장","s":[[4,"These films highlight common themes in Shawky’s work, one of which is that there is no single perspective on the past.","이 영화들은 샤키의 작품에 나타나는 공통적인 주제들을 강조하는데, 그중 하나는 과거에 대한 단일한 관점이 존재하지 않는다는 것이다."]],"w":"4번 문장 These films highlight common themes in Shawky’s work, one of which is that there is no single perspective on the past에서 가져왔어요. 영화들은 공통 주제를 강조하고(highlight), 그중 하나는 과거에 대한 단일한(single) 관점은 없다는 것이에요.","c":5},"h":"0e771a238d"},{"n":10,"t":"fill","q":"By providing an [A] viewpoint through the lens of Arab historians, Shawky [B] viewers to consider a different perspective.","ko":"아랍 역사가들의 시선을 통해 [A] 관점을 제공함으로써, 샤키는 시청자들이 다른 관점을 고려하도록 [B].","bank":["alternate","prompts","symbolize","evaluate","depict","strings"],"bko":{"alternate":"대안적인","prompts":"촉구한다","symbolize":"상징하다","evaluate":"평가하다","depict":"묘사하다","strings":"줄들"},"r":{"a":"[A] alternate, [B] prompts","ev":"6번 문장","s":[[6,"By providing an alternate viewpoint through the lens of Arab historians, Shawky prompts viewers to consider a different perspective when evaluating history.","아랍 역사가들의 시선을 통해 대안적 관점을 제공함으로써, 샤키는 시청자들이 역사를 평가할 때 다른 관점을 고려하도록 촉구한다."]],"w":"6번 문장에서 샤키는 아랍 역사가들의 시선으로 대안적(alternate) 관점을 제공하고, 시청자가 다른 관점을 고려하도록 촉구해요(prompts). symbolize·evaluate·depict는 동사원형이라 [B] 자리에 맞지 않고, strings는 명사라 두 빈칸 모두에 맞지 않아요.","c":null},"h":"769e608303"}]},{"u":6,"id":"ms2-06-1","no":1,"ko":"내 기억이 가짜라고?","items":[{"n":1,"t":"tf","q":"Misremembering things is not unusual.","ko":"무언가를 잘못 기억하는 것은 드문 일이 아니다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Misremembering something is a fairly common experience.","무언가를 잘못 기억하는 것은 상당히 흔한 경험이다."]],"w":"1번에서 잘못 기억하는 것은 상당히 흔한 경험(a fairly common experience)이라고 해요. 흔한 일이니 드문 일이 아니에요.","c":"T"},"h":"c86cd563f3"},{"n":2,"t":"tf","q":"The movie Shazaam starring Sinbad was a real film that many people watched.","ko":"신배드가 주연한 <샤잠>은 많은 사람들이 본 실제 영화였다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"For instance, some people recall a movie called Shazaam starring the comedian Sinbad, even though no such film was ever made.","예를 들어, 그런 영화는 결코 제작된 적이 없음에도 불구하고, 몇몇 사람들은 코미디언 신배드가 주연한 <샤잠>이라는 영화를 기억한다."]],"w":"7번에서 그런 영화는 결코 제작된 적이 없다(no such film was ever made)고 해요. 사람들이 기억할 뿐, 실제로 없는 영화예요.","c":"F"},"h":"eda581ed17"},{"n":3,"t":"tf","q":"Nelson Mandela was the president of South Africa from 1994 to 1999.","ko":"넬슨 만델라는 1994년부터 1999년까지 남아프리카 공화국의 대통령이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It is named after Nelson Mandela, who was the president of South Africa from 1994 to 1999.","그것은 넬슨 만델라의 이름을 따서 명명되었는데, 그는 1994년부터 1999년까지 남아프리카 공화국의 대통령이었다."]],"w":"4번에 who was the president of South Africa from 1994 to 1999가 그대로 있어요.","c":"T"},"h":"a83c4c01b5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This phenomenon is known as the Mandela effect.)","ko":"이 현상은 만델라 효과로 알려져 있다.","opts":["규칙","질병","현상","주장"],"word":"phenomenon","r":{"a":"3) 현상","ev":"3번 문장","s":[[3,"This phenomenon is known as the Mandela effect.","이 현상은 만델라 효과로 알려져 있다."]],"w":"2번의 '수천 명이 같은 잘못된 기억을 공유하는 일'을 3번에서 This phenomenon(이 현상)이라고 불러요. phenomenon = 현상.","c":3},"h":"079d626bbb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…even though he was later released and went on to become president.)","ko":"…그가 나중에 석방되어 대통령이 되었음에도 불구하고.","opts":["석방된","체포된","잊혀진","임명된"],"word":"released","r":{"a":"1) 석방된","ev":"11번 문장","s":[[11,"This led many to falsely remember that he had died while imprisoned, even though he was later released and went on to become president.","이는 많은 사람들이 그가 나중에 석방되어 대통령이 되었음에도 불구하고 그가 감옥에서 사망했다고 잘못 기억하게 했다."]],"w":"11번에서 사람들은 그가 감옥에서 죽었다고 기억하지만, 실제로는 나중에 감옥에서 나와(release = 석방하다) 대통령이 되었어요.","c":1},"h":"ff812413ad"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nIn addition, a film portrayed the death of another human rights activist in prison, and this may have influenced people’s memories of Mandela’s life.","ko":"밑줄 친 this가 가리키는 것은?","sko":"게다가, 한 영화가 감옥에서 다른 인권 활동가의 죽음을 묘사했는데, 이것이 만델라의 생애에 대한 사람들의 기억에 영향을 미쳤을 수 있다.","opts":["만델라가 2013년에 사망한 것","만델라가 대통령이 된 것","만델라가 오래 투옥된 것","영화가 감옥에서 다른 인권 활동가의 죽음을 묘사한 것"],"r":{"a":"4) 영화가 감옥에서 다른 인권 활동가의 죽음을 묘사한 것","ev":"10번 문장","s":[[10,"In addition, a film portrayed the death of another human rights activist in prison, and this may have influenced people’s memories of Mandela’s life.","게다가, 한 영화가 감옥에서 다른 인권 활동가의 죽음을 묘사했는데, 이것이 만델라의 생애에 대한 사람들의 기억에 영향을 미쳤을 수 있다."]],"w":"and this may have influenced ~에서 this는 바로 앞의 '한 영화가 감옥에서 다른 인권 활동가의 죽음을 묘사했다'는 내용을 가리켜요. 그것이 사람들의 기억에 영향을 미쳤을 수 있다는 말이에요.","c":4},"h":"711abc1591"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Although Mandela died in 2013, a large number of people remember him passing away in the 1980s while still in prison.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 만델라는 2013년에 사망했지만, 많은 사람들은 그가 여전히 감옥에 있던 1980년대에 사망했다고 기억한다.","opts":["만델라는 1980년대에 감옥에서 사망했는데, 사람들은 2013년이라고 잘못 기억한다.","만델라는 2013년에 사망했지만, 많은 사람들은 그가 1980년대에 감옥에서 사망했다고 기억한다.","만델라는 1980년대에 석방되었고, 많은 사람들은 그가 2013년에 사망했다고 안다.","만델라는 2013년에 감옥에서 사망했고, 사람들은 그 사실을 잊었다."],"r":{"a":"2) 만델라는 2013년에 사망했지만, 많은 사람들은 그가 1980년대에 감옥에서 사망했다고 기억한다.","ev":"5번 문장","s":[[5,"Although Mandela died in 2013, a large number of people remember him passing away in the 1980s while still in prison.","비록 만델라는 2013년에 사망했지만, 많은 사람들은 그가 여전히 감옥에 있던 1980년대에 사망했다고 기억한다."]],"w":"Although 뒤가 사실(2013년 사망)이고, 쉼표 뒤가 사람들의 기억(1980년대 감옥에서 사망)이에요. 사실과 기억이 서로 다르다는 문장이에요.","c":2},"h":"fcf14dd83d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["같은 잘못된 기억을 공유하는 일은 남아프리카 공화국 사람들 사이에서만 가능하다.","잘못된 기억은 한 번에 한 사람만 가질 수 있다.","수천 명의 서로 다른 사람들이 같은 잘못된 기억을 공유할 수 있다.","잘못된 기억을 공유하는 사람들은 모두 같은 영화를 본 사람들이다."],"opts":["Sharing the same false memory is possible only among people in South Africa.","A false memory can be held by only one person at a time.","Thousands of different people can share the same false memory.","People who share false memories have all seen the same film."],"r":{"a":"3) Thousands of different people can share the same false memory.","ev":"2번 문장","s":[[2,"But you would probably be shocked to learn that thousands of other people share the same false memory.","하지만 당신은 수천 명의 다른 사람들이 동일한 잘못된 기억을 공유한다는 것을 알게 된다면 아마도 충격을 받을 것이다."]],"w":"2번에서 수천 명의 다른 사람들이 동일한 잘못된 기억을 공유한다고 해요. 남아프리카 공화국 사람만 그렇다는 말(1)이나 한 사람만 갖는다는 말(2), 모두 같은 영화를 봤다는 말(4)은 본문에 없어요.","c":3},"h":"a70a035d7f"},{"n":9,"t":"sum","q":"Mandela’s long imprisonment and the limited media (A) may have contributed to (B) about his fate.","ko":"만델라의 오랜 투옥과 제한된 미디어 (A)은(는) 그의 운명에 대한 (B)에 기여했을 수 있다.","oko":["(A) 자금 / (B) 혼란","(A) 보도 / (B) 흥분","(A) 자금 / (B) 흥분","(A) 보도 / (B) 혼란","(A) 보도 / (B) 자랑스러움"],"opts":["(A) funding / (B) confusion","(A) coverage / (B) excitement","(A) funding / (B) excitement","(A) coverage / (B) confusion","(A) coverage / (B) pride"],"r":{"a":"4) (A) coverage / (B) confusion ((A) 보도 / (B) 혼란)","ev":"9번 문장","s":[[9,"In the case of Nelson Mandela, his long imprisonment and the limited media coverage during this period may have contributed to confusion about his fate.","넬슨 만델라의 경우, 그의 오랜 투옥과 이 기간 동안의 제한된 미디어 보도가 그의 운명에 대한 혼란에 기여했을 수 있다."]],"w":"9번에서 만델라의 오랜 투옥과 제한된 미디어 보도(coverage)가 그의 운명에 대한 혼란(confusion)에 기여했을 수 있다고 해요. 흥분이나 자랑스러움에 기여했다는 말은 없고, 자금(funding)은 본문에 나오지 않아요.","c":4},"h":"24db037840"},{"n":10,"t":"fill","q":"We tend to [A] in missing information with incorrect or [B] details.","ko":"우리는 누락된 정보를 잘못되거나 [B] 세부 사항으로 [A]은(는) 경향이 있다.","bank":["fill","unrelated","forget","remember","president","imprisoned"],"bko":{"fill":"채우다","unrelated":"관련 없는","forget":"잊다","remember":"기억하다","president":"대통령","imprisoned":"투옥된"},"r":{"a":"[A] fill, [B] unrelated","ev":"8번 문장","s":[[8,"The reason this happens is that we tend to fill in missing information with incorrect or unrelated details.","이것이 발생하는 이유는 우리가 누락된 정보를 잘못되거나 관련없는 세부 사항으로 채우는 경향이 있기 때문이다."]],"w":"8번에서 우리는 누락된 정보를 잘못되거나 관련 없는(unrelated) 세부 사항으로 채우는(fill in) 경향이 있다고 해요. 이것이 만델라 효과가 생기는 이유예요. 나머지 단어는 빈칸에 넣으면 문장이 말이 되지 않아요.","c":null},"h":"27b69cf2f1"}]},{"u":6,"id":"ms2-06-2","no":2,"ko":"식은 밥이 사람 잡아요!","items":[{"n":1,"t":"tf","q":"A student died in 2008 after eating food that had been left on his kitchen counter for five days.","ko":"한 학생이 2008년에 5일 동안 그의 부엌 조리대에 놓여 있던 음식을 먹은 후 사망했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In 2008, a 20-year-old student died after eating food that had been left on his kitchen counter for five days.","2008년에 한 20세 학생이 5일 동안 그의 부엌 조리대에 놓여 있던 음식을 먹은 후 사망했다."]],"w":"5번에 그대로 나와요. 음식이 5일 동안 조리대에 놓여 있었고, 그것을 먹은 학생이 사망했어요.","c":"T"},"h":"63aadd3b4a"},{"n":2,"t":"tf","q":"The bacterium Bacillus cereus itself is deadly to people.","ko":"바실러스 세레우스라는 박테리아는 그 자체로 사람에게 치명적이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Commonly found in uncooked rice, the bacterium itself is harmless, but its spores aren’t.","일반적으로 조리되지 않은 쌀에서 발견되는 그 박테리아 자체는 무해하지만, 그것의 포자들은 그렇지 않다."]],"w":"7번에서 박테리아 자체는 무해하고(harmless), 위험한 것은 그 포자(spores)라고 해요.","c":"F"},"h":"74d51b777c"},{"n":3,"t":"tf","q":"Foods such as pasta, potatoes, and beans can also cause fried rice syndrome.","ko":"파스타, 감자, 콩 같은 음식도 볶음밥 증후군을 유발할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Other carbohydrate-rich foods like pasta, potatoes, and beans can cause fried rice syndrome, too!","파스타, 감자, 콩과 같이 탄수화물이 풍부한 다른 음식들도 볶음밥 증후군을 유발할 수 있다!"]],"w":"11번에서 탄수화물이 풍부한 다른 음식인 파스타, 감자, 콩도 볶음밥 증후군을 일으킬 수 있다고 해요.","c":"T"},"h":"442086934d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…in extreme cases, they can even be deadly.)","ko":"…극단적인 경우에는, 그것들은 심지어 치명적일 수도 있다.","opts":["극단적인","평범한","드문","안전한"],"word":"extreme","r":{"a":"1) 극단적인","ev":"4번 문장","s":[[4,"Some leftovers can be far more dangerous than they appear, and in extreme cases, they can even be deadly.","일부 남은 음식들은 그것들이 보이는 것보다 훨씬 더 위험할 수 있으며, 극단적인 경우에는 심지어 치명적일 수도 있다."]],"w":"4번은 남은 음식이 보이는 것보다 위험하고, 'in extreme cases(극단적인 경우)'에는 치명적일 수도 있다는 내용이에요. extreme = 극단적인.","c":1},"h":"8cb42416ac"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…it’s not just rice that you need to be wary of.)","ko":"…당신이 주의해야 할 것은 쌀뿐만이 아니다.","opts":["감사하는","만족하는","주의하는","무관심한"],"word":"wary","r":{"a":"3) 주의하는","ev":"10번 문장","s":[[10,"According to experts, cooked rice shouldn’t be left at room temperature for more than two hours—and it’s not just rice that you need to be wary of.","전문가들에 따르면, 조리된 쌀은 두 시간 이상 실온에 놓아두어서는 안 되며, 당신이 주의해야 할 것은 쌀뿐만이 아니다."]],"w":"10번은 조심해야 할 음식이 쌀만이 아니라는 말이에요(it's not just rice). 그래서 be wary of는 '~을 주의하다'예요.","c":3},"h":"496be39717"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey can multiply and produce a deadly toxin if they’re heated and then left in the temperature “danger zone” of 4 to 60 degrees Celsius for too long.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 만약 가열된 후 섭씨 4~60도의 ‘위험구역’ 온도에 너무 오래 놓이면 증식하여 치명적인 독소를 생산할 수 있다.","opts":["그 포자들","조리된 쌀","독소","전문가들"],"r":{"a":"1) 그 포자들","ev":"8번 문장","s":[[8,"They can multiply and produce a deadly toxin if they’re heated and then left in the temperature “danger zone” of 4 to 60 degrees Celsius for too long.","그것들은 만약 가열된 후 섭씨 4~60도의 ‘위험구역’ 온도에 너무 오래 놓이면 증식하여 치명적인 독소를 생산할 수 있다."]],"w":"앞 문장 7번에서 박테리아 자체는 무해하지만 그 포자(spores)는 그렇지 않다고 했어요. 8번의 They는 그 포자들이고, 포자들이 가열된 뒤 위험구역에 오래 놓이면 증식해서 독소를 만들어요.","c":1,"k":"They = 그 포자들"},"pron":"They","h":"c3852bb80e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"After all, what harm could it do?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결국, 그것이 무슨 해를 끼칠 수 있겠는가?","opts":["그것이 어떤 해를 끼치는지 정말 궁금하다.","그렇게 해가 되는 것을 막을 방법이 있다.","그것이 해를 끼칠 리 없다고 생각할 수 있다.","그 해를 끼치는 사람이 누구인지 찾아야 한다."],"r":{"a":"3) 그것이 해를 끼칠 리 없다고 생각할 수 있다.","ev":"2번 문장","s":[[2,"After all, what harm could it do?","결국, 그것이 무슨 해를 끼칠 수 있겠는가?"]],"w":"이 문장은 답을 구하는 질문이 아니라 '무슨 해가 있겠어?'라고 해가 없다는 뜻을 담은 말이에요. 1번의 '괜찮다고 생각할지도 모른다'와 이어지고, 3번 But에서 뒤집혀요.","c":3},"h":"33bdc8931c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["재가열해도 포자가 고열을 견딜 수 있어서 문제가 없어지지 않는다.","재가열하면 문제가 언제나 완전히 없어진다.","음식을 다시 가열하면 포자는 곧바로 죽는다.","열은 포자가 견딜 수 없는 유일한 것이다."],"opts":["Reheating the food does not remove the problem because the spores can handle high heat.","Reheating the food always removes the problem completely.","The spores die as soon as the food is heated again.","Heat is the one thing that the spores cannot survive."],"r":{"a":"1) Reheating the food does not remove the problem because the spores can handle high heat. (재가열해도 포자가 고열을 견딜 수 있어서 문제가 없어지지 않는다.)","ev":"9번 문장","s":[[9,"Even reheating the food won’t eliminate the problem because the spores are capable of tolerating high heat.","심지어 음식을 재가열하는 것도 문제를 없애지 못하는데, 이는 포자들이 고열을 견딜 수 있기 때문이다."]],"w":"9번에서 재가열해도 문제를 없애지 못하는데, 포자가 고열을 견딜 수 있기 때문이라고 해요. 포자가 열에 죽는다거나 재가열이 문제를 완전히 없앤다는 말은 본문에 없어요.","c":1},"h":"144f59d298"},{"n":9,"t":"sum","q":"A student died of fried rice syndrome, a type of food (A) that is (B) by a bacterium called Bacillus cereus.","ko":"한 학생이 볶음밥 증후군, 즉 바실러스 세레우스라고 불리는 박테리아에 의해 (B)되는 (A)의 한 유형으로 사망했다.","oko":["(A) 식중독 / (B) 유발","(A) 식중독 / (B) 치료","(A) 알레르기 / (B) 유발","(A) 알레르기 / (B) 치료","(A) 식중독 / (B) 금지"],"opts":["(A) poisoning / (B) caused","(A) poisoning / (B) cured","(A) allergy / (B) caused","(A) allergy / (B) cured","(A) poisoning / (B) banned"],"r":{"a":"1) (A) poisoning / (B) caused ((A) 식중독 / (B) 유발)","ev":"6번 문장","s":[[6,"It turned out that he had succumbed to “fried rice syndrome,” a type of food poisoning caused by a bacterium called Bacillus cereus.","그것은 그가 ‘바실러스 세레우스’라는 박테리아에 의해 유발된 식중독의 한 유형인 ‘볶음밥 증후군’으로 사망했다는 것으로 판명되었다."]],"w":"6번에서 볶음밥 증후군은 바실러스 세레우스라는 박테리아에 의해 유발된(caused) 식중독(food poisoning)의 한 유형이라고 해요. 알레르기라는 말은 없고, 치료되거나 금지된다는 말도 없어요.","c":1},"h":"532264ebd0"},{"n":10,"t":"fill","q":"But it’s better to be [A] than [B].","ko":"그러나 [B] 것보다 [A] 것이 낫다.","bank":["safe","sorry","multiply","eliminate","tolerating","counter"],"bko":{"safe":"안전한","sorry":"후회하는","multiply":"증식하다","eliminate":"없애다","tolerating":"견디는 것","counter":"조리대"},"r":{"a":"[A] safe (안전한), [B] sorry (후회하는)","ev":"3번 문장","s":[[3,"But it’s better to be safe than sorry.","그러나 나중에 후회하는 것보다 조심하는 것이 낫다."]],"w":"3번은 후회하는(sorry) 것보다 조심하는(safe) 것이 낫다는 뜻의 문장이에요. 나머지 단어는 be 뒤의 빈칸에 넣으면 뜻이나 문법이 맞지 않아요.","c":null},"h":"75652bc963"}]},{"u":6,"id":"ms2-06-3","no":3,"ko":"표절이 아니라 절한 거야~","items":[{"n":1,"t":"tf","q":"In the movie scene at the beginning, a boy lifts a puppy high in the air.","ko":"처음의 영화 장면에서 한 소년이 강아지를 공중으로 높이 들어 올린다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"You’re watching a movie where a boy is given a puppy and lifts it high in the air.","당신은 한 소년이 강아지를 받고 그것을 공중으로 높이 들어 올리는 영화를 보고 있다."]],"w":"1번에서 소년이 강아지를 받고 그것을 공중으로 높이 들어 올려요(lifts it high in the air).","c":"T"},"h":"d77d1be728"},{"n":2,"t":"tf","q":"A scene can be an homage even if it is exactly the same as the original, with no change at all.","ko":"장면이 원작과 완전히 똑같아서 변화가 전혀 없더라도 오마주가 될 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"For a scene to be considered an homage, it should be a transparent reference, and it should involve a slight change from the original.","한 장면이 오마주로 간주되기 위해서 그것은 명백한 참조여야 하고, 원작으로부터의 약간의 변화를 포함해야 한다."]],"w":"7번에서 오마주로 여겨지려면 원작으로부터 약간의 변화를 포함해야 한다(involve a slight change)고 해요. 변화가 전혀 없는 것은 조건에 맞지 않아요.","c":"F"},"h":"2e260ae166"},{"n":3,"t":"tf"
