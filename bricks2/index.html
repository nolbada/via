<style>

    --bg:#11151d; --surface:#1a202b; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2b3344;

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;margin:0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto}
header h1{font-size:20px;line-height:1.3;margin:0 0 2px;font-weight:700;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 0;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;font:inherit;font-size:14px;padding:7px 12px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}

.tabs{display:flex;flex-direction:column;gap:8px;margin:18px 0 14px}

.tab b{display:block;font-size:15px}
.tab span{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab:focus-visible,.btn:focus-visible,.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:6px 2px 12px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.meta strong{color:var(--ink);font-size:16px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 2px 16px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.sec{margin:22px 2px 8px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.step.done{opacity:.72}
.top{display:flex;gap:10px;align-items:flex-start}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:6px;margin:1px 0 0;background:var(--bg);cursor:pointer;display:grid;place-content:center}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{min-width:0;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px 2px 6px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.sw{display:inline-block;flex:none}
.sw.hl{width:16px;height:8px;background:var(--hl);border-radius:2px}
.sw.ul{width:16px;height:0;border-bottom:2.5px solid var(--ul)}
.sw.ci{width:12px;height:12px;border:2px solid var(--ci);border-radius:50%}
.sw.sl{width:2px;height:13px;background:var(--sl);transform:rotate(18deg)}
.sw.ar{width:14px;height:0;border-bottom:2px solid var(--ar);position:relative}
.sw.ar::after{content:"";position:absolute;right:-1px;top:-4px;border:solid var(--ar);border-width:0 2px 2px 0;width:6px;height:6px;transform:rotate(-45deg)}
.sw.me{width:13px;height:11px;border:1.5px dashed var(--me);border-radius:2px}
.sw.an{width:auto;height:auto;color:var(--an);font-weight:700;line-height:1}
.at{font-size:12.5px;color:var(--muted);margin-bottom:4px;overflow-wrap:anywhere}
.at em{font-style:normal;font-weight:700;color:var(--ink)}
.q{margin:0;font-size:15px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:14px;padding:8px 14px;min-height:40px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.panel{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:14px}
.panel.help{background:var(--accent-soft)}
.panel.ans{border:1px solid var(--ok)}
.panel ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.panel li{overflow-wrap:anywhere}
.panel .w{font-weight:700}
.opt{padding:7px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0;padding-top:0}
.opt .en{font-weight:700;overflow-wrap:anywhere}
.opt .ko{margin-top:1px}
.opt .nt{color:var(--muted);font-size:13px}
.rq{font-size:11px;font-weight:700;color:#fff;background:var(--ci);border-radius:999px;padding:2px 8px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.wr{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-weight:700}
.wl{font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:2px}
.lockcard{display:none;border:1px dashed var(--muted);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-weight:700}
.qw.locked .lockcard{display:block}
.qw.locked .step{display:none}
.a1{font-weight:800;margin:0 0 8px}
.lb{font-size:12px;font-weight:800;color:var(--muted);margin:12px 0 6px;letter-spacing:.03em}
.evs{background:var(--accent-soft);border-radius:8px;padding:8px 10px;margin:0 0 6px}
.evs .en{font-weight:600;overflow-wrap:anywhere}.evs .ko{margin-top:2px;color:var(--muted)}
.evs .sn{display:inline-block;font-size:12px;font-weight:800;color:var(--accent);margin-right:6px}
.panel .wr{margin:12px 0 0}
.rs-btn{display:block;width:100%;margin:20px 0 8px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}

.rs-btn.go{display:block;text-align:center;text-decoration:none;border-color:var(--ok);color:var(--ok);background:var(--surface)}
.rs-btn.dis{text-align:center;color:var(--muted);border-style:dashed;cursor:default}
.xg{margin-top:20px}.xg .rs-btn{margin:0 0 8px}
.sq{margin:0 0 2px;font-size:16px}.sq u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}.gl{margin:2px 0 8px;color:var(--muted);font-size:14px}mark{background:var(--accent-soft);color:inherit;border-radius:3px;padding:0 2px}.evs.sm{opacity:.95;font-size:14px}.do{margin:6px 0 10px;display:grid;gap:4px}.do p{margin:0;font-size:14px;color:var(--muted);display:flex;align-items:center;gap:8px}.dt{flex:none;font-size:12px;font-weight:700;padding:1px 7px;border-radius:999px;background:var(--accent-soft);color:var(--accent)}.bl{display:inline-block;min-width:140px;border-bottom:1.5px solid var(--muted);height:1.2em}:root{--bk:#fbf0d3;--bk2:#fffaf0;--bkl:#e3c987;--bkt:#7a4b00;--bad:#b3261e;--badbg:#fde8e6;--okbg:#e2f3e5}@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bk:#2a2314;--bk2:#332b18;--bkl:#5b4a22;--bkt:#f0c36a;--bad:#ff9a90;--badbg:#3b2220;--okbg:#1f3324}}:root[data-theme="dark"]{--bk:#2a2314;--bk2:#332b18;--bkl:#5b4a22;--bkt:#f0c36a;--bad:#ff9a90;--badbg:#3b2220;--okbg:#1f3324}.bk{background:var(--bk);border:1px solid var(--bkl);border-radius:14px;padding:12px;margin:22px 0 14px;display:grid;gap:10px}.bkh{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;color:var(--bkt)}.bkh b{font-size:17px}.bkh span{font-size:13px}.bq{background:var(--bk2);border:1px solid var(--bkl);border-radius:10px;padding:10px 12px;display:grid;gap:8px;min-width:0}.bqh{display:flex;flex-wrap:wrap;align-items:center;gap:4px 8px}.bqat{font-size:12px;font-weight:700;padding:2px 9px;border-radius:999px;background:var(--bkt);color:var(--bk2)}.bqst{font-size:14px;font-weight:600}.ar{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 8px}.pl{font-size:12px;font-weight:700;padding:1px 8px;border-radius:999px;background:var(--okbg);color:var(--ok)}.al{font-size:17px}.at2{font-size:15px;font-weight:700}.ar .gl{flex-basis:100%;margin:0}.ops{display:grid;gap:2px}.op{display:flex;gap:6px;font-size:14px;padding:3px 6px;border-radius:6px}.op.ok{background:var(--okbg);font-weight:700}.ol{flex:none;min-width:1.4em}.og{color:var(--muted);font-weight:400}.fl{display:grid;gap:2px}.fr{display:flex;gap:8px;font-size:14px;padding:3px 6px;border-radius:6px}.fr.bad{background:var(--badbg);color:var(--bad);font-weight:700}.fk{flex:none;min-width:2.4em;font-weight:700;color:var(--muted)}.fr.bad .fk{color:var(--bad)}.fz{margin:0;font-size:14px}.bq .lb{margin-top:2px}
.back{display:inline-flex;align-items:center;font:inherit;font-size:14px;padding:7px 14px;margin:14px 0 6px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
</style>
</head>

<div class="wrap">
<header>

<script src="data.js"></script>
<script>
var KEY="bricks2";
var META={"secs":{"1":"Chapter 1","2":"Chapter 2","3":"Chapter 3","4":"Chapter 4","5":"Chapter 5","6":"Chapter 6","7":"Chapter 7","8":"Chapter 8","9":"Chapter 9","10":"Chapter 10"},"labs":{"b2-01-1":"Reading 1","b2-01-2":"Reading 2","b2-01-3":"Reading 3","b2-01-4":"Reading 4","b2-02-1":"Reading 1","b2-02-2":"Reading 2","b2-02-3":"Reading 3","b2-02-4":"Reading 4","b2-03-1":"Reading 1","b2-03-2":"Reading 2","b2-03-3":"Reading 3","b2-03-4":"Reading 4","b2-04-1":"Reading 1","b2-04-2":"Reading 2","b2-04-3":"Reading 3","b2-04-4":"Reading 4","b2-05-1":"Reading 1","b2-05-2":"Reading 2","b2-05-3":"Reading 3","b2-05-4":"Reading 4","b2-06-1":"Reading 1","b2-06-2":"Reading 2","b2-06-3":"Reading 3","b2-06-4":"Reading 4","b2-07-1":"Reading 1","b2-07-2":"Reading 2","b2-07-3":"Reading 3","b2-07-4":"Reading 4","b2-08-1":"Reading 1","b2-08-2":"Reading 2","b2-08-3":"Reading 3","b2-08-4":"Reading 4","b2-09-1":"Reading 1","b2-09-2":"Reading 2","b2-09-3":"Reading 3","b2-09-4":"Reading 4","b2-10-1":"Reading 1","b2-10-2":"Reading 2","b2-10-3":"Reading 3","b2-10-4":"Reading 4"}};
var LEGACY=["b1done"];
var TAGS={hl:"형광펜",ul:"밑줄",ci:"동그라미",sl:"슬래시",ar:"화살표",me:"여백 메모",an:"반의어"};
function localStorage_get(){try{var v=localStorage.getItem(KEY+"unit");if(v&&U[v])return v}catch(e){}return Object.keys(U)[0]}
var unit=localStorage_get();var P=U[unit];
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var cur=-1;
var done={};
try{done=JSON.parse(store.get(KEY+"done")||"{}")||{}}catch(e){done={}}
(function(){
  var ids={};Object.keys(U).forEach(function(k){U[k].forEach(function(r){ids[r.id]=1})});
  var moved=false;
  LEGACY.forEach(function(lk){var old={};try{old=JSON.parse(store.get(lk)||"{}")||{}}catch(e){old={}}
    Object.keys(old).forEach(function(k){var m=k.replace(/^o-/,"").match(/^(.*)-([sgq])\d+$/);if(!m||!ids[m[1]])return;
      if(done[k]==null){done[k]=old[k];moved=true}
      if(old[k]&&m[2]!=="s"&&k.indexOf("o-")!==0&&done["o-"+k]==null){done["o-"+k]=true;moved=true}})});
  if(moved)store.set(KEY+"done",JSON.stringify(done));
  var m=/[?&]r=([^&]+)/.exec(location.search);
  if(m){var id=decodeURIComponent(m[1]);Object.keys(U).forEach(function(k){U[k].forEach(function(p,i){if(p.id===id){unit=k;cur=i}})})}
})();
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function swatch(k){var s=el("span","sw "+k);if(k==="an")s.textContent="↔";s.setAttribute("aria-hidden","true");return s}
function secName(k){return (META.secs&&META.secs[k])||k}
function readName(p){return (META.labs&&META.labs[p.id])||String(p.no)}
var qbtns=[];
function allOpened(p){return true}
function examReady(p){return true}
function syncQ(){qbtns.forEach(function(b){b.disabled=!allOpened(P[cur])})}
function stepCard(p,s,i,kind){
  var key=p.id+"-"+kind+i;
  var c=el("div","step"+(done[key]?" done":""));
  var top=el("div","top");
  var cb=el("input","chk");cb.type="checkbox";cb.id="c-"+key;cb.checked=!!done[key];
  cb.setAttribute("aria-label",(i+1)+"번 완료");
  cb.addEventListener("change",function(){done[key]=cb.checked;c.classList.toggle("done",cb.checked);store.set(KEY+"done",JSON.stringify(done));progress()});
  top.appendChild(cb);
  var b=el("div","body");
  var tg=el("div","tags");
  if(s.req||kind==="q"||kind==="g"){tg.appendChild(el("span","rq","필수"))}
  s.tags.forEach(function(t){var g=el("span","tag");g.appendChild(swatch(t));g.appendChild(document.createTextNode(TAGS[t]));tg.appendChild(g)});
  b.appendChild(tg);
  var at=el("div","at");var em=el("em",null,s.at);at.appendChild(em);at.appendChild(document.createTextNode(" · "+s.st));
  b.appendChild(at);
  b.appendChild(el("p","q",s.q));
  var acts=el("div","acts");
  var hp=null,ap=null,hb=null,ab=null;
  if(s.help){
    hb=el("button","btn","도움");hb.type="button";hb.setAttribute("aria-expanded","false");acts.appendChild(hb);
    hp=el("div","panel help");hp.hidden=true;var ul=el("ul");
    s.help.forEach(function(h){var li=el("li");li.appendChild(el("span","w",h[0]));li.appendChild(document.createTextNode("  "+h[1]));ul.appendChild(li)});
    hp.appendChild(ul);
    hb.addEventListener("click",function(){hp.hidden=!hp.hidden;hb.setAttribute("aria-expanded",String(!hp.hidden))});
  }
  ab=el("button","btn",s.opts?"근거":"확인");ab.type="button";ab.setAttribute("aria-expanded","false");acts.appendChild(ab);
  ap=el("div","panel ans");ap.hidden=true;
  if(s.opts){
    ap.appendChild(el("div","a1",s.ans));
    if(s.ev&&s.ev.length){ap.appendChild(el("div","lb","근거 본문"));s.ev.forEach(function(n){var x=(p.S||{})[n];if(!x)return;var d=el("div","evs");var e=el("div","en");e.appendChild(el("span","sn",n+"번"));e.appendChild(document.createTextNode(x[0]));d.appendChild(e);d.appendChild(el("div","ko",x[1]));ap.appendChild(d)})}
    ap.appendChild(el("div","lb","선지별 설명"));
    s.opts.forEach(function(o){var d=el("div","opt");d.appendChild(el("div","en",o[0]+"  "+o[1]));d.appendChild(el("div","ko",o[2]));d.appendChild(el("div","nt",o[3]));ap.appendChild(d)});
  }else{
    s.ans.split("\n").forEach(function(l){var d=el("div",null,l);ap.appendChild(d)});
  }
  if(s.write&&s.write.length){var wb=el("div","wr");wb.appendChild(el("div","wl","책에 쓸 것"));s.write.forEach(function(l){wb.appendChild(el("div",null,l))});if(s.opts)ap.appendChild(wb);else ap.insertBefore(wb,ap.firstChild)}
  if(kind==="q"||kind==="g"){qbtns.push(ab);ab.disabled=!allOpened(p)}
  ab.addEventListener("click",function(){if(ab.disabled)return;ap.hidden=!ap.hidden;ab.setAttribute("aria-expanded",String(!ap.hidden));
    if(!ap.hidden){done["o-"+key]=true;if(!cb.checked){cb.checked=true;done[key]=true;c.classList.add("done")}if(kind==="s")syncQ()}
    store.set(KEY+"done",JSON.stringify(done));progress()});
  b.appendChild(acts);
  if(hp)b.appendChild(hp);
  b.appendChild(ap);
  top.appendChild(b);c.appendChild(top);
  return c;
}
function pieces(ch){return (ch.match(/[^.!?]+[.!?]*/g)||[ch]).map(function(t){return t.trim()}).filter(Boolean)}
function markRanges(en,ch){var rs=[];pieces(ch).forEach(function(t){var k=en.indexOf(t);if(k>=0)rs.push([k,k+t.length])});rs.sort(function(a,b){return a[0]-b[0]});return rs}
function sentRow(n,x,rs){
  var d=el("div","evs sm");var e=el("div","en");e.appendChild(el("span","sn",n+"번"));
  var pos=0;(rs||[]).forEach(function(r){if(r[0]<pos)return;e.appendChild(document.createTextNode(x[0].slice(pos,r[0])));e.appendChild(el("mark",null,x[0].slice(r[0],r[1])));pos=r[1]});
  e.appendChild(document.createTextNode(x[0].slice(pos)));d.appendChild(e);d.appendChild(el("div","ko","("+x[1]+")"));return d}
function coreCard(p,c,i){
  var key=p.id+"-c"+i;
  var card=el("div","step"+(done[key]?" done":""));
  var top=el("div","top");var b=el("div","body");
  var tg=el("div","tags");tg.appendChild(el("span","tag",c.t));b.appendChild(tg);
  b.appendChild(el("p","q",c.q));
  if(c.sent&&p.S&&p.S[c.sent]){var sx=p.S[c.sent];var sp=el("p","sq");var en=sx[0],hit=false;
    if(c.pron){var rx=new RegExp("\\b"+c.pron.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")+"\\b","i");var mm=rx.exec(en);if(mm){hit=true;sp.appendChild(document.createTextNode(en.slice(0,mm.index)));sp.appendChild(el("u",null,mm[0]));sp.appendChild(document.createTextNode(en.slice(mm.index+mm[0].length)))}}
    if(!hit)sp.textContent=en;b.appendChild(sp);b.appendChild(el("p","gl","("+sx[1]+")"))}
  var dd=el("div","do");
  var l1=el("p",null);l1.appendChild(el("span","dt","형광펜"));l1.appendChild(document.createTextNode(c.t==="지칭"?"본문에서 "+c.pron+" → 가리키는 말에 형광펜":"본문에서 답의 근거 표현에 형광펜"));dd.appendChild(l1);
  var l2=el("p",null);l2.appendChild(el("span","dt","빈칸"));l2.appendChild(document.createTextNode(c.t==="지칭"?c.pron+" = ":"답 : "));l2.appendChild(el("span","bl",""));dd.appendChild(l2);b.appendChild(dd);
  var acts=el("div","acts");var ab=el("button","btn","정답 확인");ab.type="button";ab.setAttribute("aria-expanded","false");acts.appendChild(ab);b.appendChild(acts);
  var ap=el("div","panel ans");ap.hidden=true;
  ap.appendChild(el("div","a1",c.a));
  ap.appendChild(el("div","lb","근거"));
  var rows=[];c.ev.forEach(function(n){var x=(p.S||{})[n];if(x)rows.push([n,x,markRanges(x[0],c.chunk)])});
  var hs=rows.filter(function(r){return r[2].length});if(hs.length)rows=hs;
  rows.forEach(function(r){ap.appendChild(sentRow(r[0],r[1],r[2]))});
  ab.addEventListener("click",function(){ap.hidden=!ap.hidden;ab.setAttribute("aria-expanded",String(!ap.hidden));ab.textContent=ap.hidden?"정답 확인":"닫기";
    if(!ap.hidden){done["o-"+key]=true;done[key]=true;card.classList.add("done")}store.set(KEY+"done",JSON.stringify(done));progress()});
  b.appendChild(ap);top.appendChild(b);card.appendChild(top);return card}
function atLabel(at){var m=/(\d+)쪽\s*·\s*(\d+번)/.exec(at||"");return m?"책 p."+m[1]+" · "+m[2]:(at||"")}
var CIR="①②③④⑤⑥";
function arRow(label,text,sub){var a=el("div","ar");a.appendChild(el("span","pl","정답"));if(label)a.appendChild(el("b","al",label));if(text)a.appendChild(el("span","at2",text));if(sub)a.appendChild(el("div","gl",sub));return a}
function bookCard(p,s){
  var card=el("div","bq");
  var h=el("div","bqh");h.appendChild(el("span","bqat",atLabel(s.at)));h.appendChild(el("span","bqst",s.st));card.appendChild(h);
  if(s.flow){
    var f=s.flow,ix=-1;(s.opts||[]).forEach(function(o,k){if(/^정답/.test(o[3]))ix=k});
    card.appendChild(arRow((ix>=0?CIR.charAt(ix)+" ":"")+"("+f.ans+")","흐름과 관계없는 문장"));
    var fl=el("div","fl");
    f.lines.forEach(function(L){var r=el("div","fr"+(L[0]===f.ans?" bad":""));r.appendChild(el("span","fk",/^[a-e]$/.test(L[0])?"("+L[0]+")":L[0]));r.appendChild(el("span","ft",L[1]));fl.appendChild(r)});
    card.appendChild(fl);
    var z=el("p","fz");z.appendChild(document.createTextNode("따라서 "));z.appendChild(el("b",null,"("+f.ans+")"));z.appendChild(document.createTextNode(" 는 어울리지 않는 얘기 — "+f.why));card.appendChild(z);
    return card}
  var lines=String(s.ans||"").split("\n");
  if(s.opts&&s.opts.length){
    var ok=s.opts.filter(function(o){return /^정답/.test(o[3])});
    var mark=ok.length>0&&ok.length<s.opts.length;
    if(ok.length===1){var o=ok[0];card.appendChild(arRow(o[0],o[1],o[2]!==o[1]?"("+o[2]+")":""))}
    else if(mark){card.appendChild(arRow(ok.map(function(o){return o[0]}).join(" "),""))}
    else card.appendChild(arRow("",lines[0],lines.slice(1).join(" ")));
    var ol=el("div","ops");
    s.opts.forEach(function(o){
      var tf=/^([TF])\b/.exec(o[3]||"");var good=(mark&&/^정답/.test(o[3]))||(tf&&tf[1]==="T");
      var r=el("div","op"+(good?" ok":""));r.appendChild(el("span","ol",tf?tf[1]:o[0]));
      var t=el("span","ot",o[1]);if(o[2]&&o[2]!==o[1]){var g=el("span","og"," ("+o[2]+")");t.appendChild(g)}
      r.appendChild(t);ol.appendChild(r)});
    card.appendChild(ol)}
  else{card.appendChild(arRow("",lines[0],lines.slice(1).join(" ")))}
  var ev=(s.ev||[]).filter(function(n){return p.S&&p.S[n]});
  if(ev.length){card.appendChild(el("div","lb","근거"));ev.forEach(function(n){card.appendChild(sentRow(n,p.S[n],null))})}
  return card}
function progress(){
  var p=P[cur],C=p.core||[],n=C.length,d=0,i;
  for(i=0;i<C.length;i++)if(done[p.id+"-c"+i])d++;
  var pc=document.getElementById("pc");if(pc)pc.textContent=d+" / "+n;
  var pb=document.getElementById("pb");if(pb)pb.style.width=(100*d/Math.max(n,1))+"%";
  var xg=document.getElementById("xg");
  if(xg){xg.textContent="";var a=el("a","rs-btn go","Exit test 응시");a.href="exit/?r="+encodeURIComponent(p.id);xg.appendChild(a)}
}
function render(){
  P=U[unit];if(cur>=P.length)cur=-1;
  var up=document.getElementById("units");up.textContent="";
  Object.keys(U).forEach(function(k){var b=el("button","ub",secName(k));b.type="button";b.setAttribute("aria-pressed",String(k===unit));
    b.addEventListener("click",function(){unit=k;cur=-1;try{localStorage.setItem(KEY+"unit",k)}catch(e){}render()});up.appendChild(b)});
  var tabs=document.getElementById("tabs");tabs.textContent="";
  P.forEach(function(p,i){
    var t=el("button","tab");t.type="button";t.setAttribute("role","tab");t.setAttribute("aria-selected",String(i===cur));
    t.appendChild(el("b",null,readName(p)));t.appendChild(el("span",null,p.ko));
    t.addEventListener("click",function(){cur=i;try{history.pushState({v:1},"")}catch(e){}render();window.scrollTo(0,0)});tabs.appendChild(t);
  });
  var inList=cur<0;up.style.display=inList?"":"none";tabs.style.display=inList?"":"none";
  if(inList){document.getElementById("sub").textContent=secName(unit);document.getElementById("view").textContent="";return}
  var p=P[cur],v=document.getElementById("view");document.getElementById("sub").textContent=secName(unit)+" · "+readName(p)+" · "+p.pg;v.textContent="";
  var bb=el("button","back","← "+secName(unit)+" 지문 목록");bb.type="button";
  bb.addEventListener("click",function(){if(history.state&&history.state.v){history.back()}else{cur=-1;render();window.scrollTo(0,0)}});v.appendChild(bb);
  var m=el("div","meta");var st=el("strong",null,p.ko);m.appendChild(st);var pc=el("span",null,"");pc.id="pc";m.appendChild(pc);v.appendChild(m);
  var bar=el("div","bar");var bi=el("i");bi.id="pb";bar.appendChild(bi);v.appendChild(bar);
  v.appendChild(el("div","sec","핵심 질문"));
  (p.core||[]).forEach(function(c,i){v.appendChild(coreCard(p,c,i))});
  if(p.qs&&p.qs.length){
    var pgs=[];p.qs.forEach(function(s){var m2=/(\d+)쪽/.exec(s.at||"");if(m2)pgs.push(+m2[1])});
    var lo=Math.min.apply(null,pgs),hi=Math.max.apply(null,pgs);
    var bk=el("div","bk");var bh=el("div","bkh");bh.appendChild(el("b",null,"책 문제 확인"));
    if(pgs.length)bh.appendChild(el("span",null,"책 p."+lo+(hi>lo?"–"+hi:"")));
    bh.appendChild(el("span",null,"문제를 푼 뒤 바로 답을 맞춰 보세요"));bk.appendChild(bh);
    p.qs.forEach(function(s){bk.appendChild(bookCard(p,s))});v.appendChild(bk)}
  var xg=el("div","xg");xg.id="xg";v.appendChild(xg);
  progress();
}
render();
window.addEventListener("popstate",function(){if(cur>=0){cur=-1;render();window.scrollTo(0,0)}});
</script>
