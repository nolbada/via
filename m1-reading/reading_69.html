 small paper garden all around me. There are leaves, fruits, and birds ... I am really happy,” he thought.","“나는 대부분 시간을 침대에 머물러 있지만, 온 주변에 작은 종이 정원을 만들었어. 나뭇잎, 과일, 그리고 새들이 있지 … 난 정말 행복해.”라고 그는 생각했다.",1],["Perhaps Matisse is still using scissors to cut out stars in heaven.","아마도 Matisse는 여전히 천국에서 별을 오리기 위해 가위를 사용하고 있을 것이다.",1],["Look at the night sky.","밤하늘을 봐.",0],["Some of the stars may come from his scissors.","별들 중 일부는 그의 가위에서 나온 것일지도 모른다.",0]];var RNUM=69;var TITLE_EN="Henri’s Scissors";var PASS_EN=["Henri’s Scissors","In a small town in France, there lived a young boy. His name was Henri Matisse. He liked to draw pictures. He drew pictures in the sand and in his books.","When Matisse grew up, he left his town and became an artist in Paris. He painted pictures day after day and year after year. He was happy with his life. More and more people began to notice him. They loved his paintings, and soon he became famous.","When Matisse became an old man, he fell ill. He could only lie in bed and sleep. He couldn’t paint at all. He could only paint in his dreams. When Matisse opened his eyes, they were full of sadness.","Luckily, before long, he could sit. A little later, he started to paint again. However, he realized that he couldn’t paint well anymore.","One day, Matisse got a brilliant idea. He picked up scissors, cut some paper, and made beautiful shapes. He cut out birds and flowers. He was drawing with SCISSORS! He said to himself, “My pleasure in cutting things grows and grows. Scissors gave me another chance.” Matisse cut paper all day.","Soon his room was full of shapes and colors.","“I stay in bed most of the time, but I made a small paper garden all around me. There are leaves, fruits, and birds ... I am really happy,” he thought.","Perhaps Matisse is still using scissors to cut out stars in heaven. Look at the night sky. Some of the stars may come from his scissors."];var PASS_KO=["Henri의 가위","프랑스의 작은 마을에 어린 소년이 살았다. 그의 이름은 Henri Matisse였다. 그는 그림 그리는 것을 좋아했다. 그는 모래와 그의 책에 그림을 그렸다.","Matisse가 어른이 되었을 때, 그는 마을을 떠나 파리에서 화가가 되었다. 그는 날마다, 해마다 그림을 그렸다. 그는 그의 삶에 행복해했다. 점점 더 많은 사람들이 그를 알아보기 시작했다. 그들은 그의 그림을 사랑했고 곧 그는 유명해졌다.","Matisse가 노인이 되었을 때, 그는 병에 걸렸다. 그는 침대에 누워 잠만 잘 수 있었다. 그는 그림을 전혀 그릴 수 없었다. 그는 오직 그의 꿈속에서만 그릴 수 있었다. Matisse가 눈을 떴을 때, 그의 눈은 슬픔으로 가득 차 있었다.","다행히도, 얼마 지나지 않아 그는 앉을 수 있었다. 조금 후에, 그는 다시 그림을 그리기 시작했다. 하지만 그는 더 이상 그림을 잘 그릴 수 없다는 것을 깨달았다.","어느 날, Matisse는 멋진 생각을 해냈다. 그는 가위를 집어 들어 종이를 자르고, 아름다운 모양을 만들었다. 그는 새와 꽃을 잘라 냈다. 그는 가위로 그림을 그리고 있었다! 그는 “무엇인가를 오려 내는 나의 기쁨이 더욱 커지고 있어. 가위는 내게 또 다른 기회를 주었어.”라고 자기 자신에게 말했다. Matisse는 하루 종일 종이를 잘랐다.","곧 그의 방은 모양과 색채로 가득 찼다.","“나는 대부분 시간을 침대에 머물러 있지만, 온 주변에 작은 종이 정원을 만들었어. 나뭇잎, 과일, 그리고 새들이 있지 … 난 정말 행복해.”라고 그는 생각했다.","아마도 Matisse는 여전히 천국에서 별을 오리기 위해 가위를 사용하고 있을 것이다. 밤하늘을 봐. 별들 중 일부는 그의 가위에서 나온 것일지도 모른다."];var DG=[{"dlg":[["Jun","Look. There are programs for teens in this museum.","봐. 이 박물관에 청소년을 위한 프로그램들이 있어."],["Lucy","Yeah. Let’s join one of them.","응. 그중 하나에 참여하자."],["Jun","That’s a good idea.","좋은 생각이야."],["Lucy","What do you think of “Art in Movies”? It sounds interesting.","“Art in Movies”는 어떻게 생각해? 재미있을 것 같아."],["Jun","“Art in Movies”? Umm, it’s too long. What about “Jobs in Art”?","“Art in Movies”? 음, 너무 길어. “Jobs in Art”는 어때?"],["Lucy","I like that. It starts at 11:00 in Room 5. Let’s hurry!","그거 좋다. 11시에 5호실에서 시작해. 서두르자!"]],"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Jun and Lucy are in a museum.","Jun and Lucy want to join a program for teens.","Jun likes “Art in Movies.”","“Jobs in Art” starts at 11:00.","Jun and Lucy will go to Room 5."],"a":2,"ans":"Jun likes “Art in Movies.”","evs":[["Jun: “Art in Movies”? Umm, it’s too long. What about “Jobs in Art”?","“Art in Movies”? 음, 너무 길어. “Jobs in Art”는 어때?"]],"ev":["Jun: “Art in Movies”? Umm, it’s too long. What about “Jobs in Art”?","“Art in Movies”? 음, 너무 길어. “Jobs in Art”는 어때?"],"memo":["Jun: “Art in Movies”? Umm, it’s too long. What about “Jobs in Art”?  (“Art in Movies”? 음, 너무 길어. “Jobs in Art”는 어때?)"]}]},{"dlg":[  else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';

function partHtml(p){

 P.groups.forEach(function(g){h+='<div class="grp">';

  if(g.pp)h+=ppHtml(g.pp,lock);

 });

 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';

function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';

  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }

function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';

 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;

function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}

});

 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
