<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* layout: day grid home, one question per screen, sentence is the hero */
:root{--bg:#f4f6f9;--card:#fff;--ink:#17202b;--sub:#5b6776;--line:#d9dfe7;--accent:#1f4fd1;--accent-ink:#fff;--ok:#16794a;--ok-bg:#e3f4ea;--bad:#b3261e;--bad-bg:#fbe7e5;--mark:#fff3b8;--font:'Noto Sans KR',system-ui,sans-serif;--serif:'Source Serif 4',Georgia,serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--ink:#e8edf3;--sub:#9aa7b6;--line:#2c3744;--accent:#7ea2ff;--accent-ink:#0c1220;--ok:#6fd3a0;--ok-bg:#12301f;--bad:#ff9b92;--bad-bg:#3a1916;--mark:#4a4113;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--ink:#e8edf3;--sub:#9aa7b6;--line:#2c3744;--accent:#7ea2ff;--accent-ink:#0c1220;--ok:#6fd3a0;--ok-bg:#12301f;--bad:#ff9b92;--bad-bg:#3a1916;--mark:#4a4113;color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:20px}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font-size:18px;margin:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top span,.sub{color:var(--sub);font-size:13px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:16px;min-width:0}
.tag{font-size:12px;letter-spacing:.06em;color:var(--sub)}
.tag b{color:var(--accent);font-weight:700}
.q{font-size:14px;color:var(--sub);margin:0}
.sent{font-family:var(--serif);font-size:20px;line-height:1.8;margin:0;text-align:left;word-break:keep-all}
.w{display:inline;padding:1px 2px;border-radius:4px}
.w.cl{background:var(--mark)}
.pick .w{cursor:pointer;border-bottom:1px dashed var(--sub)}
.pick .w:hover,.pick .w:focus-visible{background:var(--line);outline:2px solid var(--accent)}
.w.bad{background:var(--bad-bg);color:var(--bad)}
.w.good{background:var(--ok-bg);color:var(--ok);font-weight:600}
.blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--accent);text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:500;padding:12px 20px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.opt{flex:1 1 40%;text-align:center}
button.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
button.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.res{padding:12px 14px;border-radius:8px;font-weight:700}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.no{background:var(--bad-bg);color:var(--bad)}
.memo{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:15px}
.memo small{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.grid button{padding:8px 0;min-height:56px;display:grid;gap:0;line-height:1.2}
.grid small{font-size:11px;color:var(--sub)}
.grid .done{border-color:var(--ok);background:var(--ok-bg)}
.grid .done small{color:var(--ok)}
.grid .part{border-color:var(--bad)}
.grid .part small{color:var(--bad)}
.grid h2{grid-column:1/-1;font-size:13px;margin:6px 0 0;color:var(--sub);font-weight:500}
.done-card .score{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.list{display:grid;gap:6px;font-size:15px}
.steps{margin:0;padding-left:20px}
.note{font-size:12px;color:var(--sub);margin:0}
</style>

function start(n){cur={n:n,list:pickQs(n)};qi=0;score=0;wrong=[];show()}
function head(){document.getElementById('pos').textContent='Day '+cur.n+' 복습 '+(qi+1)+' / '+cur.list.length;document.getElementById('bar').style.width=(qi/cur.list.length*100)+'%'}
function words(tok,o){o=o||{};return tok.map(function(w,i){var c='w';if(o.cl&&i>=o.cl[0]&&i<o.cl[1])c+=' cl';if(o.good&&o.good.indexOf(i)>=0)c+=' good';if(o.bad===i)c+=' bad';
  var inner=(o.blank===i)?'<span class="blank">'+(o.fill?esc(o.fill):'&nbsp;&nbsp;&nbsp;&nbsp;')+'</span>':esc(w);
  return '<span class="'+c+'" data-i="'+i+'"'+(o.tap?' tabindex="0" role="button"':'')+'>'+inner+'</span>'}).join(' ')}
function card(tag,qtext,sent,extra){return '<div class="card'+(extra&&extra.pick?' pick':'')+'"><div class="tag">'+tag+'</div><p class="q">'+qtext+'</p><p class="sent" id="s">'+sent+'</p><div id="ex"></div></div>'}
function show(){head();var o=cur.list[qi],q=o.q,t=q.t,tag='문제 '+(qi+1);
 if(t==='struct_anc'){stage.innerHTML=card(tag+' &middot; <b>구조</b>','노란색 절은 앞의 어떤 말을 꾸밀까요? 그 말을 누르세요.',words(q.tok,{cl:q.clause,tap:1}),{pick:1});tapMode(function(i){return q.ans.indexOf(i)>=0},function(ok){return finish(ok,words(q.tok,{cl:q.clause,good:q.ans}),'꾸미는 말 = '+q.tok[q.ans[0]].replace(/[^A-Za-zÀ-ɏ'-]/g,'')+'. '+(q.note||''))})}
 else if(t==='struct_main'){stage.innerHTML=card(tag+' &middot; <b>구조</b>','이 문장 전체의 본동사를 누르세요.',words(q.tok,{tap:1}),{pick:1});tapMode(function(i){return q.ans.indexOf(i)>=0},function(ok){return finish(ok,words(q.tok,{good:q.ans}),'본동사: '+q.ans.slice().sort(function(a,b){return a-b}).map(function(i){return q.tok[i].replace(/[^A-Za-z'-]/g,'')}).join(' ')+'. '+(q.note||''))})}
 else if(t==='struct_adv'){stage.innerHTML=card(tag+' &middot; <b>구조</b>','노란색 부사절은 어떤 뜻으로 쓰였나요?',words(q.tok,{cl:q.clause}));optMode(q.opts,q.ans,function(ok){return finish(ok,words(q.tok,{cl:q.clause}),'이 부사절은 '+q.ans+'을 나타냅니다. '+(q.note||''))})}
 else if(t==='use_prep'){stage.innerHTML=card(tag+' &middot; <b>'+esc(q.verb)+'</b>','빈칸에 알맞은 말을 고르세요.',words(q.tok,{blank:q.bi}));optMode(q.opts,q.ans,function(ok){return finish(ok,words(q.tok,{blank:q.bi,fill:q.ans}),q.memo||('짝 전치사: '+q.verb))})}
 else if(t==='use_pair'){stage.innerHTML=card(tag+' &middot; <b>헷갈리는 동사</b>','빈칸에 들어갈 동사의 원형을 고르세요.',words(q.tok,{blank:q.bi}));optMode(q.opts,q.ans,function(ok){return finish(ok,words(q.tok,{good:[q.bi]}),q.verb+': '+(q.memo||''))})}
 else if(t==='use_t5'){t5(q,tag)}
}
function tapMode(isOk,done){var s=document.getElementById('s');function go(e){var w=e.target.closest('.w');if(!w)return;s.onclick=null;s.onkeydown=null;done(isOk(+w.dataset.i))}s.onclick=go;s.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e)}}}
function optMode(opts,ans,done){var ex=document.getElementById('ex');ex.className='row';ex.innerHTML=opts.map(function(x,i){return '<button class="opt" data-v="'+esc(x)+'">'+esc(x)+'</button>'}).join('');
 ex.querySelectorAll('button').forEach(function(b){b.onclick=function(){ex.querySelectorAll('button').forEach(function(x){x.disabled=true;if(x.dataset.v===ans)x.classList.add('ok')});if(b.dataset.v!==ans)b.classList.add('no');done(b.dataset.v===ans)}})}
function t5(q,tag){var tk=q.tok.slice(),bad=-1;if(q.wrong){tk.splice(q.vi+1,0,q.prep);bad=q.vi+1}
 stage.innerHTML=card(tag+' &middot; <b>'+esc(q.verb)+'</b>','이 문장이 맞나요?',words(tk))+'';
 var ex=document.getElementById('ex');ex.className='row';ex.innerHTML='<button id="y">맞아요</button><button id="n" class="main">틀렸어요</button>';
 function fin(ok,msg){finish(ok,words(tk,{bad:bad}),(q.memo||'')) ;var r=document.getElementById('res');if(r){r.textContent=msg}}
 document.getElementById('y').onclick=function(){fin(!q.wrong,q.wrong?'틀린 문장이었습니다.':'맞아요. 원문 그대로입니다.')};
 document.getElementById('n').onclick=function(){
  if(!q.wrong){fin(false,'이 문장은 맞는 문장입니다.');return}
  document.querySelector('.q').textContent='틀린 단어를 누르세요.';ex.innerHTML='';
  var s=document.getElementById('s');s.parentNode.classList.add('pick');s.innerHTML=words(tk,{tap:1});
  function go(e){var w=e.target.closest('.w');if(!w)return;s.onclick=null;s.onkeydown=null;var ok=(+w.dataset.i===bad);fin(ok,ok?'정답입니다.':'틀린 단어는 따로 있습니다.')}
  s.onclick=go;s.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e)}}}}
function finish(ok,sentHtml,expl){
 if(ok)score++;else wrong=wrong.concat(cur.list[qi].it.nos);
 document.getElementById('s').innerHTML=sentHtml;document.getElementById('s').parentNode.classList.remove('pick');
 var ex=document.getElementById('ex');if(ex.querySelector('.opt')){}else{ex.className='';ex.innerHTML=''}
 var h='<div class="res '+(ok?'ok':'no')+'" id="res">'+(ok?'정답입니다.':'아쉽습니다.')+'</div>';
 if(expl)h+='<div class="memo" style="margin-top:12px"><small>설명</small>'+esc(expl)+'</div>';
 h+='<div class="row" style="margin-top:12px"><button class="main" id="nx">'+(qi<cur.list.length-1?'다음':'결과 보기')+'</button></div>';
 var box=document.createElement('div');box.innerHTML=h;document.getElementById('s').parentNode.appendChild(box);
 document.getElementById('nx').onclick=function(){qi++;qi<cur.list.length?show():end()};
}
function end(){
 document.getElementById('bar').style.width='100%';document.getElementById('pos').textContent='Day '+cur.n+' 복습 완료';
 var st=load();var uniq=wrong.filter(function(v,i,a){return a.indexOf(v)===i}).sort(function(a,b){return a-b});
 st[cur.n]={score:score,total:cur.list.length,wrong:uniq,t:Date.now()};save(st);
 var h='<div class="card done-card"><div class="tag">학습 완료 &middot; Day '+cur.n+' 복습</div><div class="score">'+score+' / '+cur.list.length+'</div>';
 if(uniq.length){h+='<div class="list"><div>교재 Part 2 &middot; Day '+cur.n+' 복습 페이지에서 아래 번호 문장만 표시하세요.</div><div><b>'+uniq.join('번, ')+'번</b></div><ol class="steps"><li>빈칸에 이 문장에서 쓰인 동사의 뜻을 적는다.</li><li>본동사에 동그라미.</li><li>가장 안쪽 절에 괄호.</li></ol></div>'}
 else h+='<div>모두 맞았습니다. 교재에서 할 일은 없습니다.</div>';
 h+='<div class="row"><button id="again">다시 풀기</button><button class="main" id="hm">Day 목록</button></div></div>';
 stage.innerHTML=h;
 document.getElementById('again').onclick=function(){start(cur.n)};document.getElementById('hm').onclick=home;
}
home();
</script>
