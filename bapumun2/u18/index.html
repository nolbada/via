, "en": "or", "ko": "또는", "ok": false, "why": "or는 either와 짝이에요. neither와는 쓰지 않아요."}, {"n": "②", "en": "and", "ko": "그리고", "ok": false, "why": "and는 both와 짝이에요. neither와는 쓰지 않아요."}, {"n": "③", "en": "nor", "ko": "~도 아닌", "ok": true, "why": "neither A nor B를 만드는 짝이에요."}, {"n": "④", "en": "but", "ko": "그러나", "ok": false, "why": "but은 not A but B, not only A but also B에서 써요. neither와는 쓰지 않아요."}, {"n": "⑤", "en": "not", "ko": "~않다", "ok": false, "why": "not은 neither와 짝을 이루지 못해요."}], "pencil": "neither와 짝이 되는 말은 ___", "pencilKey": "nor", "page": 179, "sec": "s1"}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 02 not A but B, either A or B, neither A nor B", "type": "mc", "ans": "②", "concept": ["038"], "gap": "", "words": [["London", "런던"], ["Sydney", "시드니"], ["money", "돈"], ["time", "시간"]], "h1": "빈칸이 두 문장에 하나씩 있어요. 첫 문장은 '런던 또는 시드니 둘 중 한 곳'이고, 둘째 문장은 '돈이 아니라 시간'이라는 뜻이에요. 각각 어떤 짝꿍 표현인지 생각해 보세요.", "h2": "첫 문장에는 or가 있으니 either와 짝이에요. 둘째 문장의 not A but B에서 not 뒤 빈칸이 아니라 ___ 자리에 어떤 말이 올지 살펴보세요.", "why": "첫 문장은 either A or B(A 또는 B 둘 중 하나)예요. 둘째 문장은 not money but time(돈이 아니라 시간)이라서 either와 but을 써요.", "opts": [{"n": "①", "en": "either – or", "ko": "둘 중 하나 - 또는", "ok": false, "why": "둘째 문장에서 'not money or time'은 어색해요. not A but B로 써야 해요."}, {"n": "②", "en": "either – but", "ko": "둘 중 하나 - 그러나", "ok": true, "why": "첫 문장은 either A or B, 둘째 문장은 not A but B에서 but이 필요해서 맞아요."}, {"n": "③", "en": "neither – but", "ko": "둘 다 아닌 - 그러나", "ok": false, "why": "neither는 or가 아니라 nor와 짝이에요. 첫 문장의 or와 맞지 않아요."}, {"n": "④", "en": "neither – nor", "ko": "둘 다 아닌 - ~도 아닌", "ok": false, "why": "첫 문장에 or가 있어서 neither를 쓰면 틀려요."}, {"n": "⑤", "en": "both – neither", "ko": "둘 다 - 둘 다 아닌", "ok": false, "why": "첫 문장에 or가 있어서 both를 쓰면 틀려요."}], "pencil": "either는 or와, not은 ___ 와 짝이다", "pencilKey": "but", "page": 179, "sec": "s1"}, {"id": "S1-10", "step": 1, "no": 10, "qtype": "유형 02 not A but B, either A or B, neither A nor B", "type": "mc", "ans": "①", "concept": ["038"], "gap": "", "words": [["coffee", "커피"], ["juice", "주스"]], "h1": "'커피나 주스 둘 중 하나'라는 뜻을 만드는 표현이 무엇인지 먼저 정해요. 그다음 보기에서 짝이 맞게 쓰인 것을 찾아보세요.", "h2": "'A 또는 B 둘 중 하나'는 either와 or를 짝으로 써요. 보기마다 either, neither, not과 어떤 접속사가 짝을 이루는지 확인해 보세요.", "why": "'A 또는 B 둘 중 하나'는 either A or B예요. 그래서 either coffee or juice가 맞아요.", "opts": [{"n": "①", "en": "You can have either coffee or juice.", "ko": "너는 커피나 주스 중 하나를 마실 수 있다.", "ok": true, "why": "either A or B(A 또는 B 둘 중 하나)가 맞게 쓰였어요."}, {"n": "②", "en": "You can have neither coffee nor juice.", "ko": "너는 커피도 주스도 마실 수 없다.", "ok": false, "why": "neither A nor B는 '둘 다 아니다'라서 뜻이 달라요."}, {"n": "③", "en": "You can have not coffee but juice.", "ko": "너는 커피가 아니라 주스를 마실 수 있다.", "ok": false, "why": "not A but B는 '커피가 아니라 주스'라서 뜻이 달라요."}, {"n": "④", "en": "You can have either coffee nor juice.", "ko": "(어색한 문장) 커피나 주스", "ok": false, "why": "either는 nor가 아니라 or와 짝이에요."}, {"n": "⑤", "en": "You can have neither coffee but juice.", "ko": "(어색한 문장) 커피도 아닌 주스", "ok": false, "why": "neither는 but이 아니라 nor와 짝이에요."}], "pencil": "either와 짝이 되는 말은 ___", "pencilKey": "or", "page": 180, "sec": "s1"}, {"id": "S1-11", "step": 1, "no": 11, "qtype": "유형 02 not A but B, either A or B, neither A nor B", "type": "mc", "ans": "④", "concept": ["038", "099"], "gap": "", "words": [["password", "비밀번호"], ["bake", "굽다"], ["responsible for", "~에 책임이 있는"], ["repair", "고치다"]], "h1": "빈칸 앞에 Not Tom but Susie(Tom이 아니라 Susie)가 있어요. 이 말이 주어일 때 동사는 어느 쪽에 맞추는지 떠올려 보세요. 어색한 것을 고르는 문제예요.", "h2": "not A but B가 주어이면 동사는 but 뒤 말(B)에 맞춰요. Susie는 한 명이니까 단수예요. 복수 동사가 쓰인 보기를 찾아보세요.", "why": "주어는 B인 Susie(단수)에 맞춰요. 그래서 복수 동사 were를 쓴 ④가 어색하고 was baking이 되어야 해요.", "opts": [{"n": "①", "en": "knows the password", "ko": "비밀번호를 안다", "ok": false, "why": "knows는 단수 동사라서 Susie와 잘 맞아요."}, {"n": "②", "en": "answered the phone yesterday", "ko": "어제 전화를 받았다", "ok": false, "why": "과거 동사는 단수·복수 모양이 같아서 맞아요."}, {"n": "③", "en": "helped me to repair my computer", "ko": "내 컴퓨터를 고치는 걸 도와줬다", "ok": false, "why": "과거 동사라서 Susie와 잘 맞아요."}, {"n": "④", "en": "were baking some cookies for you", "ko": "너를 위해 쿠키를 굽고 있었다", "ok": true, "why": "were는 복수 동사예요. Susie는 한 명이라서 was를 써야 해요."}, {"n": "⑤", "en": "should be responsible for that matter", "ko": "그 일에 책임을 져야 한다", "ok": false, "why": "should 뒤에는 동사원형이 와서 단수·복수 걱정이 없어요."}], "pencil": "not A but B가 주어이면 동사는 ___ 에 맞춘다", "pencilKey": "B", "page": 180, "sec": "s1"}, {"id": "S1-12", "step": 1, "no": 12, "qtype": "유형 02 not A but B, either A or B, neither A nor B", "type": "write", "ans": "choose either the elevator or the stairs", "concept": ["038", "037-H1"], "gap": "", "words": [["elevator", "엘리베이터"], ["stairs", "계단"], ["choose", "고르다"]], "h1": "'엘리베이터나 계단 둘 중 하나를 선택할 수 있다'는 뜻이에요. 먼저 '둘 중 하나'를 말하는 짝꿍 표현을 정하고, 괄호 속 낱말에 짝을 붙여 보세요.", "h2": "can 뒤에는 동사원형이 와요. 「either A or B」에서 A와 B 자리에 같은 종류의 말(the elevator, the stairs)을 넣고, 동사 choose를 맨 앞에 써 보세요.", "why": "'A 또는 B 둘 중 하나'는 either A or B예요. 그래서 can choose either the elevator or the stairs가 돼요.", "opts": [], "pencil": "either A or B에서 A와 B는 ___ 한 말", "pencilKey": "같은 종류", "page": 180, "sec": "s1"}, {"id": "S1-13", "step": 1, "no": 13, "qtype": "유형 02 not A but B, either A or B, neither A nor B", "type": "write", "ans": "Neither, nor", "concept": ["038"], "gap": "", "words": [["come to school", "학교에 오다"]], "h1": "두 문장 모두 '오지 않았다'는 부정이에요. 'Bill도 Andy도 학교에 오지 않았다'로 합치는 짝꿍 표현을 떠올려 보세요.", "h2": "문장 맨 앞 빈칸에는 첫 글자를 대문자로 써요. 'A도 B도 아닌'을 만드는 두 낱말이 필요해요.", "why": "둘 다 오지 않았으니 neither A nor B(A도 B도 아닌)를 써요. 맨 앞이라서 Neither로 시작해요.", "opts": [], "pencil": "'A도 B도 아닌'은 ___ A ___ B", "pencilKey": "Neither / nor", "page": 180, "sec": "s1"}, {"id": "S1-14", "step": 1, "no": 14, "qtype": "유형 02 not A but B, either A or B, neither A nor B", "type": "write", "ans": "(1) ○ (2) ×, has to walk", "concept": ["038", "099"], "gap": "", "words": [["want to meet", "만나고 싶다(원형 want 원하다)"], ["walk the dog", "개를 산책시키다"], ["has to", "~해야 한다"]], "h1": "(1)과 (2) 모두 상관접속사가 주어예요. 동사가 either나 neither 뒤 말이 아니라 어느 쪽 말에 맞춰져 있는지 확인해 보세요.", "h2": "neither A nor B와 either A or B가 주어일 때 동사는 B에 맞춰요. (1)은 I, (2)는 he에 맞는 동사를 쓰고 있는지 살펴보세요.", "why": "(1)은 주어 B가 I라서 want to meet이 맞아요. (2)는 B가 he라서 have to가 아니라 has to walk로 고쳐야 해요.", "opts": [], "pencil": "either A or B가 주어이면 동사는 ___ 에 맞춘다", "pencilKey": "B", "page": 180, "sec": "s1"}, {"id": "S1-15", "step": 1, "no": 15, "qtype": "유형 03 상관접속사 통합형", "type": "mc", "ans": "②", "concept": ["038", "099"], "gap": "", "words": [["sugar", "설탕"], ["salt", "소금"], ["musical", "뮤지컬"], ["touching", "감동적인"], ["surprised at", "~에 놀란"]], "h1": "다섯 문장 모두 상관접속사가 있어요. 접속사 짝이 맞는지, 그리고 동사가 알맞은 쪽에 맞춰졌는지 하나씩 확인해 보세요.", "h2": "both A and B는 복수, 나머지는 A나 B 중 정해진 쪽에 동사를 맞춰요. neither는 nor와 짝이라는 것도 확인해 보세요.", "why": "②는 not only sugar but also salt로 짝이 맞고 동사도 필요 없어서 자연스러워요.", "opts": [{"n": "①", "en": "Both you and Paul is waiting for her.", "ko": "너와 Paul 둘 다 그녀를 기다리고 있다.", "ok": false, "why": "both A and B는 복수라서 is가 아니라 are를 써야 해요."}, {"n": "②", "en": "We need not only sugar but also salt.", "ko": "우리는 설탕뿐만 아니라 소금도 필요하다.", "ok": true, "why": "not only A but also B 짝이 맞고, 설탕과 소금이 같은 종류의 말이라 자연스러워요."}, {"n": "③", "en": "Either Harper or Angela want to go back.", "ko": "Harper나 Angela 둘 중 한 명이 돌아가고 싶어 한다.", "ok": false, "why": "either A or B는 B(Angela, 단수)에 맞춰 wants로 써야 해요."}, {"n": "④", "en": "The musical was neither interesting not touching.", "ko": "그 뮤지컬은 재미있지도 감동적이지도 않았다.", "ok": false, "why": "neither는 not이 아니라 nor와 짝이에요."}, {"n": "⑤", "en": "The teacher as well as the students were surprised at the news.", "ko": "학생들뿐만 아니라 선생님도 그 소식에 놀랐다.", "ok": false, "why": "A as well as B는 A(The teacher, 단수)에 맞춰 was를 써야 해요."}], "pencil": "neither A nor B에서 A, B를 이어 주는 말은 ___", "pencilKey": "nor", "page": 180, "sec": "s1"}, {"id": "S1-16", "step": 1, "no": 16, "qtype": "유형 03 상관접속사 통합형", "type": "mc", "ans": "④", "concept": ["038"], "gap": "", "words": [["price", "가격"], ["quality", "품질"], ["important", "중요한"]], "h1": "'가격과 품질 둘 다 중요하다'는 뜻이에요. 두 가지가 모두 중요하다는 뜻을 만드는 짝꿍 표현을 골라 보세요.", "h2": "문장에 are가 있어서 주어가 복수예요. 복수로 취급하는 상관접속사는 무엇일까요?", "why": "'둘 다'는 both A and B예요. 그래서 Both the price and the quality are important가 돼요.", "opts": [{"n": "①", "en": "Either – or", "ko": "둘 중 하나 - 또는", "ok": false, "why": "either A or B는 '둘 중 하나'라서 '둘 다'와 뜻이 달라요."}, {"n": "②", "en": "Not – but", "ko": "~가 아니라 - ~이다", "ok": false, "why": "not A but B는 '가격이 아니라 품질'처럼 한쪽만 말해서 뜻이 달라요."}, {"n": "③", "en": "Neither – nor", "ko": "둘 다 아닌", "ok": false, "why": "neither A nor B는 '둘 다 중요하지 않다'가 돼서 뜻이 반대예요."}, {"n": "④", "en": "Both – and", "ko": "둘 다", "ok": true, "why": "both A and B(A와 B 둘 다)가 우리말과 같은 뜻이에요."}, {"n": "⑤", "en": "As – well as", "ko": "(어색한 짝)", "ok": false, "why": "as well as는 한 덩어리로 써야 해서 이렇게 나눠 쓰지 않아요."}], "pencil": "'A와 B 둘 다'는 ___ A and B", "pencilKey": "both", "page": 180, "sec": "s1"}, {"id": "S1-17", "step": 1, "no": 17, "qtype": "유형 03 상관접속사 통합형", "type": "write", "ans": "(1) Both my cousin and I have a bike. (2) Neither Jill nor Sam sent a postcard to her.", "concept": ["038", "099"], "gap": "", "words": [["cousin", "사촌"], ["bike", "자전거"], ["send a postcard", "엽서를 보내다(원형 send 보내다)"]], "h1": "(1)은 둘 다 자전거가 있어요. (2)는 둘 다 엽서를 보내지 않았어요. 각각 어떤 짝꿍 표현이 알맞은지 정하고, 보기에서 두 낱말씩 골라 보세요.", "h2": "(1)은 긍정이라서 and와 짝을 이루는 말이, (2)는 부정이라서 nor와 짝을 이루는 말이 필요해요. 주어가 복수인지 B에 맞출지도 확인해 보세요.", "why": "(1)은 both A and B로 복수 취급해서 have를 써요. (2)는 neither A nor B로 B(Sam)에 맞추고 과거라서 sent를 써요.", "opts": [], "pencil": "둘 다 하지 않았으면 ___ A ___ B", "pencilKey": "neither / nor", "page": 180, "sec": "s1"}, {"id": "S1-18", "step": 1, "no": 18, "qtype": "유형 03 상관접속사 통합형", "type": "write", "ans": "She is not tired but sleepy.", "concept": ["038"], "gap": "", "words": [["tired", "피곤한"], ["sleepy", "졸린"]], "h1": "'피곤한 게 아니라 졸리다'는 뜻이에요. 앞의 말을 부정하고 뒤의 말을 말하는 짝꿍 표현을 떠올려 보세요.", "h2": "「not A but B」에서 A는 tired, B는 sleepy예요. 주어 She 다음에 be동사 현재형을 쓰고 6단어를 맞춰 보세요.", "why": "'A가 아니라 B'는 not A but B예요. 그래서 She is not tired but sleepy(여섯 단어)가 돼요.", "opts": [], "pencil": "'A가 아니라 B'는 ___ A ___ B", "pencilKey": "not / but", "page": 181, "sec": "s1"}, {"id": "S1-19", "step": 1, "no": 19, "qtype": "유형 04 명령문, and/or", "type": "mc", "ans": "①", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["study hard", "열심히 공부하다"], ["grade", "성적"]], "h1": "빈칸 앞은 '열심히 공부해라'라는 명령이고, 뒤는 '좋은 성적을 얻을 것이다'라는 결과예요. 명령대로 하면 좋은 일이 생기는 흐름이에요.", "h2": "명령문 뒤에는 and나 or를 쓰는데, 명령대로 하면 생기는 좋은 결과는 and로 이어요. 보기에서 이 뜻의 접속사를 찾아보세요.", "why": "'열심히 공부해라, 그러면 좋은 성적을 얻을 것이다'라서 「명령문, and ...」를 써요.", "opts": [{"n": "①", "en": "and", "ko": "그리고, 그러면", "ok": true, "why": "명령문, and ...(~해라, 그러면 ...할 것이다) 흐름이 맞아요."}, {"n": "②", "en": "but", "ko": "그러나", "ok": false, "why": "but은 앞뒤 뜻이 반대일 때 써서 이 흐름과 맞지 않아요."}, {"n": "③", "en": "or", "ko": "그렇지 않으면", "ok": false, "why": "or를 쓰면 '공부하지 않으면 좋은 성적을 얻는다'가 돼서 이상해요."}, {"n": "④", "en": "nor", "ko": "~도 아닌", "ok": false, "why": "nor는 neither와 짝이라서 이 문장에 쓰지 않아요."}, {"n": "⑤", "en": "that", "ko": "~라는 것", "ok": false, "why": "that은 명사절을 이끄는 말이라 명령문 뒤에 쓰지 않아요."}], "pencil": "명령문, ___ ...: ~해라, 그러면 ...할 것이다", "pencilKey": "and", "page": 181, "sec": "s1"}, {"id": "S1-20", "step": 1, "no": 20, "qtype": "유형 04 명령문, and/or", "type": "mc", "ans": "④", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["regret", "후회하다"], ["miss", "놓치다"], ["hand in", "제출하다"], ["angry", "화난"]], "h1": "다섯 문장 모두 명령문 뒤에 빈칸이 있어요. 각 문장이 '명령대로 하면 좋은 일'인지 '명령대로 안 하면 나쁜 일'인지 나눠 보세요. 다른 하나를 찾는 문제예요.", "h2": "나쁜 결과가 나오는 문장은 or, 좋은 결과가 나오는 문장은 and가 들어가요. 네 문장은 같은 접속사이고 한 문장만 달라요.", "why": "④만 '왼쪽으로 돌아라, 그러면 은행이 보일 것이다'라서 and가 들어가요. 나머지 네 문장은 나쁜 결과라서 or가 들어가요.", "opts": [{"n": "①", "en": "Don't buy the bag, ___ you will regret it.", "ko": "그 가방을 사지 마라, 그렇지 않으면 후회할 것이다.", "ok": false, "why": "나쁜 결과라서 or가 들어가요."}, {"n": "②", "en": "Speak loudly, ___ nobody will hear you.", "ko": "크게 말해라, 그렇지 않으면 아무도 네 말을 못 들을 것이다.", "ok": false, "why": "나쁜 결과라서 or가 들어가요."}, {"n": "③", "en": "Take the subway, ___ you'll miss the airplane.", "ko": "지하철을 타라, 그렇지 않으면 비행기를 놓칠 것이다.", "ok": false, "why": "나쁜 결과라서 or가 들어가요."}, {"n": "④", "en": "Turn left at the corner, ___ you can see the bank.", "ko": "모퉁이에서 왼쪽으로 돌아라, 그러면 은행이 보일 것이다.", "ok": true, "why": "좋은 결과라서 and가 들어가요. 나머지와 달라서 정답이에요."}, {"n": "⑤", "en": "Hand in your report by noon, ___ your teacher will be angry.", "ko": "정오까지 보고서를 내라, 그렇지 않으면 선생님이 화내실 것이다.", "ok": false, "why": "나쁜 결과라서 or가 들어가요."}], "pencil": "나쁜 결과가 오면 명령문, ___ ...", "pencilKey": "or", "page": 181, "sec": "s1"}, {"id": "S1-21", "step": 1, "no": 21, "qtype": "유형 04 명령문, and/or", "type": "mc", "ans": "③", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["water", "물을 주다"], ["plant", "식물"], ["lollipop", "막대사탕"], ["stop crying", "울음을 그치다"]], "h1": "두 문장의 뜻을 먼저 생각해 보세요. 첫 문장은 '물을 더 자주 줘라, 그렇지 않으면 식물이 죽는다'이고, 둘째는 '울음을 그쳐라, 그러면 사탕을 준다'예요.", "h2": "명령대로 하지 않으면 나쁜 일이 생기는 문장에는 or, 명령대로 하면 좋은 일이 생기는 문장에는 and를 써요. 순서대로 짝을 맞춰 보세요.", "why": "첫 문장은 안 하면 식물이 죽으니 or, 둘째 문장은 그치면 사탕을 주니 and가 맞아요. 그래서 or – and예요.", "opts": [{"n": "①", "en": "and – or", "ko": "그리고 - 또는", "ok": false, "why": "두 접속사가 서로 반대로 들어가서 뜻이 어색해요."}, {"n": "②", "en": "or – or", "ko": "또는 - 또는", "ok": false, "why": "둘째 문장은 '울음을 그치면 사탕을 준다'는 좋은 결과라서 and가 필요해요."}, {"n": "③", "en": "or – and", "ko": "그렇지 않으면 - 그러면", "ok": true, "why": "첫 문장은 나쁜 결과(or), 둘째 문장은 좋은 결과(and)라서 맞아요."}, {"n": "④", "en": "and – but", "ko": "그러면 - 그러나", "ok": false, "why": "첫 문장은 나쁜 결과라서 and가 틀리고 but도 쓰지 않아요."}, {"n": "⑤", "en": "but – and", "ko": "그러나 - 그러면", "ok": false, "why": "첫 문장에 but을 쓰면 뜻이 이어지지 않아요."}], "pencil": "좋은 결과는 and, 나쁜 결과는 ___", "pencilKey": "or", "page": 181, "sec": "s1"}, {"id": "S1-22", "step": 1, "no": 22, "qtype": "유형 04 명령문, and/or", "type": "write", "ans": "and", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["go to bed", "잠자리에 들다"], ["refreshed", "상쾌한"], ["next morning", "다음 날 아침"]], "h1": "'일찍 잠자리에 들어라, 그러면 기분이 상쾌할 것이다'라는 뜻이에요. 명령대로 하면 생기는 일이 좋은 일인지 나쁜 일인지 보세요.", "h2": "명령문 뒤에서 좋은 결과를 이어 주는 접속사를 떠올려 보세요. 명령문, ___ ... 모양이에요.", "why": "일찍 자면 상쾌해지는 좋은 결과라서 「명령문, and ...」를 써요.", "opts": [], "pencil": "좋은 결과는 명령문, ___ ...", "pencilKey": "and", "page": 181, "sec": "s1"}, {"id": "S1-23", "step": 1, "no": 23, "qtype": "유형 04 명령문, and/or", "type": "write", "ans": "or", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["close", "닫다"], ["rain", "비"], ["come in", "들어오다"]], "h1": "위 문장은 '창문을 닫지 않으면 비가 들어온다'예요. if ... not은 '~하지 않으면'이라는 뜻이니, 명령문으로 바꾸면 어떤 접속사가 필요할까요?", "h2": "'~하지 않으면'은 '그렇지 않으면'과 같은 뜻이에요. 명령문 뒤에서 이 뜻을 가진 접속사를 떠올려 보세요.", "why": "if you don't close(닫지 않으면)는 '닫아라, 그렇지 않으면'과 뜻이 같아요. 그래서 「명령문, or ...」를 써요.", "opts": [], "pencil": "if ... not = 명령문, ___ ...", "pencilKey": "or", "page": 181, "sec": "s1"}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 04 명령문, and/or", "type": "write", "ans": "Put on a coat, or you'll catch a cold.", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["put on", "입다"], ["coat", "외투"], ["catch a cold", "감기에 걸리다"]], "h1": "우리말은 '외투를 입어라, 그렇지 않으면 감기에 걸릴 것이다'예요. 먼저 명령문을 만들고 그 뒤에 어떤 접속사가 오는지 정해 보세요. 필요 없는 단어가 하나 있어요.", "h2": "'그렇지 않으면'을 뜻하는 접속사 or를 쓰면 and는 남아요. 「Put on a coat, or you'll catch a cold.」 순서로 놓아 보세요.", "why": "'입어라, 그렇지 않으면 ...할 것이다'는 명령문 뒤에 or를 써요. and는 쓰지 않는 단어예요.", "opts": [], "pencil": "'~해라, 그렇지 않으면 ...'은 명령문, ___ ...", "pencilKey": "or", "page": 181, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 04 명령문, and/or", "type": "write", "ans": "Be kind to others, and they will like you.", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["be kind to", "~에게 친절하다"], ["others", "다른 사람들"], ["like", "좋아하다"]], "h1": "우리말은 '다른 사람들에게 친절해라, 그러면 그들은 너를 좋아할 것이다'예요. 명령문부터 만들고, 그 뒤의 결과가 좋은 일인지 나쁜 일인지 보세요. 필요 없는 단어가 하나 있어요.", "h2": "명령문은 동사원형으로 시작해요. be동사의 원형으로 시작하는 명령문 다음에 좋은 결과를 이어 줄 접속사를 골라 보세요.", "why": "친절하면 좋아해 주는 좋은 결과라서 「명령문, and ...」를 써요. or는 쓰지 않는 단어예요.", "opts": [], "pencil": "좋은 결과는 명령문, ___ ...", "pencilKey": "and", "page": 181, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "both A and B, not only A but also B", "type": "mc", "ans": "④", "concept": ["038", "099"], "gap": "", "words": [["meet", "만나다"], ["party", "파티"], ["kind", "친절한"]], "h1": "문장 맨 앞의 Both A and B(Mike와 그의 형제)가 주어예요. 이 주어가 한 명인지 여러 명인지, 그리고 when I met(내가 만났을 때)로 보아 시제가 언제인지 보세요.", "h2": "both A and B는 항상 복수로 취급해요. 과거 시제에서 복수 주어와 쓰는 be동사의 과거형이 무엇인지 떠올려 보세요.", "why": "Both A and B는 복수 취급하고, 내가 그들을 만난 것은 과거라서 복수 과거형 were를 써요.", "opts": [{"n": "①", "en": "is", "ko": "~이다(단수 현재)", "ok": false, "why": "is는 단수 주어에 쓰는 현재형이에요. 주어가 복수이고 과거라서 맞지 않아요."}, {"n": "②", "en": "are", "ko": "~이다(복수 현재)", "ok": false, "why": "복수 주어에는 맞지만 현재형이에요. 이 문장은 과거라서 맞지 않아요."}, {"n": "③", "en": "was", "ko": "~였다(단수 과거)", "ok": false, "why": "was는 단수 주어에 쓰는 과거형이라 복수 주어와 맞지 않아요."}, {"n": "④", "en": "were", "ko": "~였다(복수 과거)", "ok": true, "why": "복수 주어와 과거 시제에 모두 맞아요."}, {"n": "⑤", "en": "have been", "ko": "~이었다(현재완료)", "ok": false, "why": "have been은 현재완료라서 '만났을 때'라는 과거 시점과 맞지 않아요."}], "pencil": "both A and B + 과거 be동사는 ___", "pencilKey": "were", "page": 182, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "both A and B, not only A but also B", "type": "mc", "ans": "④", "concept": ["038"], "gap": "", "words": [["office", "사무실"], ["clean", "깨끗한"], ["cheap", "싼"], ["as well as", "~뿐만 아니라 ...도"]], "h1": "원래 문장은 '사무실은 깨끗할 뿐만 아니라 싸다'예요. not only A but also B를 as well as로 바꾸면 낱말의 순서가 어떻게 되는지 확인해 보세요.", "h2": "A as well as B는 'B뿐만 아니라 A도'라는 뜻이에요. 그래서 not only A but also B와 A, B의 위치가 서로 바뀌어요.", "why": "not only clean but also cheap은 cheap as well as clean(싸고, 깨끗하기도 하다)과 같아요. 두 낱말이 바뀌어요.", "opts": [{"n": "①", "en": "The office is clean well as cheap.", "ko": "(어색한 문장) 사무실은 깨끗하다", "ok": false, "why": "well as라는 표현은 없어요. as well as로 써야 해요."}, {"n": "②", "en": "The office is as clean well as cheap.", "ko": "(어색한 문장) 사무실은 깨끗하다", "ok": false, "why": "as ... well as처럼 낱말이 나뉘어 있어서 틀려요."}, {"n": "③", "en": "The office is clean as well cheap as.", "ko": "(어색한 문장) 사무실은 깨끗하다", "ok": false, "why": "as well as 순서가 깨져서 틀려요."}, {"n": "④", "en": "The office is cheap as well as clean.", "ko": "사무실은 깨끗할 뿐만 아니라 싸다.", "ok": true, "why": "as well as 앞뒤 낱말이 서로 바뀌어서 같은 뜻이 돼요."}, {"n": "⑤", "en": "The office is as cheap well clean as.", "ko": "(어색한 문장) 사무실은 싸다", "ok": false, "why": "as well as 순서가 깨져서 틀려요."}], "pencil": "not only A but also B = B ___ ___ ___ A", "pencilKey": "as well as", "page": 182, "sec": "s2"}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "both A and B, not only A but also B", "type": "mc", "ans": "①", "concept": ["038"], "gap": "", "words": [["meet", "만나다"], ["go shopping", "쇼핑하러 가다"], ["watch a movie", "영화를 보다"], ["last weekend", "지난 주말"]], "h1": "두 빈칸을 따로 보세요. 첫 문장은 뒤에 and가 있고, 둘째 문장은 not only 뒤에 also가 있어요. 각각 짝이 되는 말을 떠올려 보세요.", "h2": "첫 빈칸은 'Chris와 Mary 둘 다'라서 both A and B예요. 둘째 빈칸은 not only A ___ also B에서 둘째 접속사를 찾는 칸이에요.", "why": "첫째는 both A and B(둘 다)라서 both가 와요. 둘째는 not only A but also B라서 but이 와요. 그래서 both – but이에요.", "opts": [{"n": "①", "en": "both – but", "ko": "둘 다 - 그러나", "ok": true, "why": "both A and B의 both, not only A but also B의 but이 모두 맞아요."}, {"n": "②", "en": "both – and", "ko": "둘 다 - 그리고", "ok": false, "why": "둘째 빈칸에 and가 오면 not only와 짝이 맞지 않아요."}, {"n": "③", "en": "either – but", "ko": "둘 중 하나 - 그러나", "ok": false, "why": "첫 문장에 and가 있어서 either를 쓰면 틀려요."}, {"n": "④", "en": "either – and", "ko": "둘 중 하나 - 그리고", "ok": false, "why": "either는 or와 짝이라서 and와 어울리지 않아요."}, {"n": "⑤", "en": "neither – or", "ko": "둘 다 아닌 - 또는", "ok": false, "why": "neither는 nor와 짝이라서 or와 어울리지 않아요."}], "pencil": "not only와 짝이 되는 말은 ___ also", "pencilKey": "but", "page": 182, "sec": "s2"}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "상관접속사 통합형", "type": "mc", "ans": "③", "concept": ["038", "099"], "gap": "", "words": [["meeting", "회의"], ["assistant", "조수"]], "h1": "빈칸에 들어갈 수 '없는' 것을 찾는 문제예요. 뒤의 동사가 are(복수)라서 주어가 복수여야 해요. 각 보기가 동사에 어떻게 맞추는지 살펴보세요.", "h2": "A as well as B는 동사를 A에 맞춰요. 보기 ③에서 A가 누구이고 그 사람이 단수인지 복수인지 확인해 보세요.", "why": "Mr. Min as well as you는 동사를 앞의 Mr. Min(한 명)에 맞춰서 is를 써야 해요. 그래서 복수 동사 are 앞에 올 수 없어요.", "opts": [{"n": "①", "en": "Both he and I", "ko": "그와 나 둘 다", "ok": false, "why": "both A and B는 복수라서 are와 어울려요."}, {"n": "②", "en": "Either we or they", "ko": "우리 또는 그들 둘 중 하나", "ok": false, "why": "동사를 B(they, 복수)에 맞춰서 are와 어울려요."}, {"n": "③", "en": "Mr. Min as well as you", "ko": "너뿐만 아니라 Mr. Min도", "ok": true, "why": "동사를 A(Mr. Min, 단수)에 맞춰서 is가 되어야 해요. are와는 맞지 않아서 정답이에요."}, {"n": "④", "en": "Neither Betty nor you", "ko": "Betty도 너도 아닌", "ok": false, "why": "동사를 B(you)에 맞춰서 are와 어울려요."}, {"n": "⑤", "en": "Not only Andy but also his assistants", "ko": "Andy뿐만 아니라 그의 조수들도", "ok": false, "why": "동사를 B(assistants, 복수)에 맞춰서 are와 어울려요."}], "pencil": "A as well as B가 주어이면 동사는 ___ 에 맞춘다", "pencilKey": "A", "page": 182, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "both A and B, not only A but also B", "type": "mc", "ans": "②", "concept": ["038", "099"], "gap": "", "words": [["sunglasses", "선글라스"], ["satisfied", "만족한"], ["result", "결과"], ["chef", "요리사"], ["manager", "관리자"]], "h1": "어색한 문장을 고르는 문제예요. 상관접속사로 연결된 말이 주어일 때 동사의 수와 인칭이 맞는지 보기마다 확인해 보세요.", "h2": "both A and B는 복수, not only A but also B와 either A or B는 B에 동사를 맞춰요. ②의 Both he and she 뒤 동사를 살펴보세요.", "why": "Both he and she는 복수 주어라서 are를 써야 해요. is를 쓴 ②가 어색해요.", "opts": [{"n": "①", "en": "I will buy either a pen or a cap for her.", "ko": "나는 그녀에게 펜이나 모자 중 하나를 사 줄 것이다.", "ok": false, "why": "either A or B에서 A, B가 같은 종류(명사)라서 맞아요."}, {"n": "②", "en": "Both he and she is wearing sunglasses.", "ko": "그와 그녀는 둘 다 선글라스를 쓰고 있다.", "ok": true, "why": "both A and B는 복수라서 is가 아니라 are를 써야 해요."}, {"n": "③", "en": "This chair is neither comfortable nor strong.", "ko": "이 의자는 편하지도 튼튼하지도 않다.", "ok": false, "why": "neither A nor B에서 A, B가 같은 종류(형용사)라서 맞아요."}, {"n": "④", "en": "Not only Lucas but also I am satisfied with the results.", "ko": "Lucas뿐만 아니라 나도 그 결과에 만족한다.", "ok": false, "why": "동사를 B(I)에 맞춰 am을 써서 맞아요."}, {"n": "⑤", "en": "Peter works not as a chef but as a manager in the restaurant.", "ko": "Peter는 그 식당에서 요리사가 아니라 관리자로 일한다.", "ok": false, "why": "not A but B에서 A, B가 같은 종류(as ~)라서 맞아요."}], "pencil": "both A and B + 현재 be동사는 ___", "pencilKey": "are", "page": 182, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "not A but B, either A or B, neither A nor B", "type": "mc", "ans": "③", "concept": ["038"], "gap": "", "words": [["open the file", "파일을 열다"], ["now", "지금"]], "h1": "'Cindy도 너도 ~할 수 없다'는 둘 다 부정하는 뜻이에요. 부정의 뜻이 들어 있는 상관접속사가 무엇인지 생각해 보세요.", "h2": "neither A nor B는 이미 부정이라서 뒤에 not이나 cannot을 또 쓰지 않아요. 보기에서 이 점도 확인해 보세요.", "why": "'A도 B도 아닌'은 neither A nor B예요. 이미 부정의 뜻이라서 can을 써서 can open이 돼요.", "opts": [{"n": "①", "en": "Either Cindy or you can open the file now.", "ko": "Cindy나 너 둘 중 한 명이 지금 파일을 열 수 있다.", "ok": false, "why": "either A or B는 '둘 중 하나'라서 뜻이 달라요."}, {"n": "②", "en": "Either Cindy nor you can open the file now.", "ko": "(어색한 문장) Cindy나 너", "ok": false, "why": "either는 nor가 아니라 or와 짝이에요."}, {"n": "③", "en": "Neither Cindy nor you can open the file now.", "ko": "Cindy도 너도 지금 파일을 열 수 없다.", "ok": true, "why": "neither A nor B(A도 B도 아닌)가 우리말과 같은 뜻이에요."}, {"n": "④", "en": "Neither Cindy nor you cannot open the file now.", "ko": "(어색한 문장) 둘 다 열 수 없지 않다", "ok": false, "why": "neither에 이미 부정이 들어 있는데 cannot으로 부정이 두 번 나와서 틀려요."}, {"n": "⑤", "en": "Not only Cindy but also you can open the file now.", "ko": "Cindy뿐만 아니라 너도 지금 파일을 열 수 있다.", "ok": false, "why": "not only A but also B는 '둘 다 할 수 있다'라서 뜻이 달라요."}], "pencil": "neither A nor B에는 이미 ___ 의 뜻이 있다", "pencilKey": "부정", "page": 182, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "명령문, and/or", "type": "mc", "ans": "④", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["hurry up", "서두르다"], ["arrive on time", "제시간에 도착하다"], ["exercise", "운동하다"], ["stay healthy", "건강을 유지하다"], ["sorry", "후회하는"]], "h1": "각 보기의 앞 문장과 뒤 문장이 '명령대로 하면 생길 일'인지 '명령대로 안 하면 생길 일'인지 생각하며 and와 or가 알맞은지 확인해 보세요.", "h2": "좋은 결과는 and, 나쁜 결과는 or로 이어요. 그런데 나쁜 결과 앞에 and가 있거나 좋은 결과 앞에 or가 있으면 어색해요.", "why": "'휴식을 취해라, 그러면 너무 피곤해질 것이다'는 뜻이 이상해요. 나쁜 결과가 오니까 and가 아니라 or가 필요해요.", "opts": [{"n": "①", "en": "Hurry up, and you'll arrive on time.", "ko": "서둘러라, 그러면 제시간에 도착할 것이다.", "ok": false, "why": "좋은 결과라서 and가 맞아요."}, {"n": "②", "en": "Exercise regularly, and you'll stay healthy.", "ko": "규칙적으로 운동해라, 그러면 건강을 유지할 것이다.", "ok": false, "why": "좋은 결과라서 and가 맞아요."}, {"n": "③", "en": "Be careful, or you'll be in danger.", "ko": "조심해라, 그렇지 않으면 위험해질 것이다.", "ok": false, "why": "나쁜 결과라서 or가 맞아요."}, {"n": "④", "en": "Take a break, and you'll get too tired.", "ko": "쉬어라, 그러면 너무 피곤해질 것이다.", "ok": true, "why": "나쁜 결과가 오는데 and를 써서 어색해요. or로 고쳐야 해요."}, {"n": "⑤", "en": "Listen to his advice, or you'll be sorry later.", "ko": "그의 충고를 들어라, 그렇지 않으면 나중에 후회할 것이다.", "ok": false, "why": "나쁜 결과라서 or가 맞아요."}], "pencil": "나쁜 결과에는 명령문, ___ ...", "pencilKey": "or", "page": 182, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "명령문, and/or", "type": "write", "ans": "or you will get", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["follow the signs", "표지판을 따라가다"], ["get lost", "길을 잃다"], ["mountain", "산"]], "h1": "위 문장은 '표지판을 따라가지 않으면 산에서 길을 잃을 것이다'예요. 이것을 명령문으로 바꾸면 'Follow the signs,' 뒤에 어떤 접속사가 와야 할까요?", "h2": "if you don't follow는 '따라가지 않으면'이라서 '그렇지 않으면'과 뜻이 같아요. 네 칸에 접속사, 주어, 조동사, 동사를 차례로 넣어 보세요.", "why": "'따라가지 않으면'은 '따라가라, 그렇지 않으면'과 같아요. 그래서 or you will get을 넣어요.", "opts": [], "pencil": "if ... not 문장은 명령문, ___ ... 로 바꾼다", "pencilKey": "or", "page": 183, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "명령문, and/or", "type": "write", "ans": "If you look around", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["look around", "둘러보다"], ["beautiful", "아름다운"], ["scenery", "경치"]], "h1": "윗문장은 「명령문, and ...」예요. 아랫문장은 같은 뜻을 쉼표 앞 부분만 다르게 나타내라는 뜻이에요. and를 쓰던 문장은 어떤 접속사로 바꿀 수 있을까요?", "h2": "「명령문, and ...(~해라, 그러면 ...)」는 '~하면 ...'이라는 뜻의 접속사 if를 쓴 문장으로 바꿀 수 있어요. 주어 you를 꼭 넣어 주세요.", "why": "「명령문, and ...」는 if를 써서 바꿀 수 있어요. Look around는 If you look around가 돼요.", "opts": [], "pencil": "명령문, and ... = ___ + 주어 + 동사, ...", "pencilKey": "If", "page": 183, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "명령문, and/or", "type": "write", "ans": "and you will catch the train", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["leave", "떠나다"], ["catch the train", "기차를 타다"]], "h1": "'지금 떠나라, 그러면 너는 그 기차를 탈 것이다'라는 뜻이에요. 명령대로 하면 생기는 좋은 결과가 뒤에 와요.", "h2": "좋은 결과를 이어 주는 접속사로 시작하고 그 뒤에 괄호 속 표현을 써서 주어와 will을 넣어 문장을 이어 보세요.", "why": "명령대로 하면 기차를 타는 좋은 결과라서 and를 써요. 그래서 'and you will catch the train'이에요.", "opts": [], "pencil": "좋은 결과는 명령문, ___ 주어 + will + 동사", "pencilKey": "and", "page": 183, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "명령문, and/or", "type": "write", "ans": "Turn the heat down, or the bread will burn. / Do your best, and you can pass the exam. / Press the red button, and the jewel box will open.", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["turn down", "줄이다"], ["heat", "불, 열"], ["burn", "타다"], ["do one's best", "최선을 다하다"], ["pass the exam", "시험에 합격하다"], ["jewel box", "보석함"]], "h1": "A에는 명령문 세 개, B에는 그 결과 세 개가 있어요. 각 명령문과 어울리는 결과를 짝지어 보세요. 나쁜 결과는 or, 좋은 결과는 and로 이어요.", "h2": "'불을 줄여라'와 어울리는 결과는 무엇일까요? 줄이지 않으면 빵이 타는 거예요. 나머지 두 문장은 해 보면 좋은 일이 생기는 쪽으로 이어 보세요.", "why": "불을 줄이지 않으면 빵이 타니 or, 최선을 다하면 합격하니 and, 빨간 버튼을 누르면 열리니 and로 이어요.", "opts": [], "pencil": "나쁜 결과는 ___, 좋은 결과는 and", "pencilKey": "or", "page": 183, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "not A but B, either A or B, neither A nor B", "type": "write", "ans": "either", "concept": ["038"], "gap": "", "words": [["go camping", "캠핑을 가다"], ["tomorrow", "내일"], ["weekend", "주말"]], "h1": "빈칸 뒤에 tomorrow or this weekend(내일 또는 이번 주말)가 있어요. 'A 또는 B 둘 중 하나'를 만드는 짝꿍 표현을 떠올려 보세요.", "h2": "뒤에 or가 있으니 or와 짝이 되는 말이 빈칸에 와야 해요. 'will go camping' 바로 뒤에 들어가는 말이에요.", "why": "or와 짝이 되어 '둘 중 하나'를 뜻하는 말은 either예요.", "opts": [], "pencil": "or와 짝이 되는 말은 ___", "pencilKey": "either", "page": 183, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "not A but B, either A or B, neither A nor B", "type": "write", "ans": "neither, but", "concept": ["038"], "gap": "", "words": [["chicken", "닭고기"], ["fish", "생선"], ["actor", "배우"], ["firefighter", "소방관"]], "h1": "첫 문장은 nor가 있어서 '닭고기도 생선도 좋아하지 않는다'는 뜻이에요. 둘째 문장은 '배우가 아니라 소방관'이라는 뜻이에요. 각각 짝꿍 표현을 떠올려 보세요.", "h2": "nor와 짝이 되는 말을 첫 칸에, 'not A ___ B'에서 B를 이어 주는 말을 둘째 칸에 써 보세요.", "why": "첫 문장은 neither A nor B(A도 B도 아닌), 둘째 문장은 not A but B(A가 아니라 B)라서 neither, but이에요.", "opts": [], "pencil": "nor와 짝 ___, not과 짝 ___", "pencilKey": "neither / but", "page": 183, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "not A but B, either A or B, neither A nor B", "type": "write", "ans": "Neither he nor you were polite to the old lady.", "concept": ["038", "099"], "gap": "", "words": [["genius", "천재"], ["polite", "예의 바른"], ["old lady", "나이 든 여성"], ["fool", "바보"]], "h1": "ⓐ와 ⓑ 중에서 상관접속사가 주어일 때 동사를 알맞게 쓴 것과 틀린 것을 가려 보세요. 동사가 어느 말에 맞춰져 있는지 확인해 보세요.", "h2": "neither A nor B가 주어이면 동사는 B에 맞춰요. ⓑ의 B는 you인데, you는 단수 동사 was와 쓰는 대상일까요?", "why": "neither A nor B는 동사를 B에 맞춰요. you에는 was가 아니라 were를 써야 해서 ⓑ를 고쳐요. ⓐ는 맞아요.", "opts": [], "pencil": "neither A nor B가 주어이면 동사는 ___ 에 맞춘다", "pencilKey": "B", "page": 183, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "not A but B, either A or B, neither A nor B", "type": "write", "ans": "Not Evan but I was absent from school.", "concept": ["038", "099"], "gap": "", "words": [["absent from", "~에 결석한"], ["school", "학교"]], "h1": "'Evan이 아니라 내가'라는 뜻이에요. 먼저 A와 B를 정하고, 주어가 여러 낱말로 이어지면 동사를 어느 쪽에 맞추는지 생각해 보세요. 필요 없는 낱말이 두 개 있어요.", "h2": "「Not A but B」가 주어이면 동사는 B에 맞춰요. 주어 B가 I이고 과거 시제일 때 쓰는 be동사 과거형이 무엇인지 떠올려 보세요.", "why": "'A가 아니라 B'는 not A but B예요. 동사는 B(I)에 맞춰 was를 써요. either와 were는 쓰지 않아요.", "opts": [], "pencil": "not A but B가 주어이면 동사는 ___ 에 맞춘다", "pencilKey": "B", "page": 183, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "not A but B, either A or B, neither A nor B", "type": "mc", "ans": "②", "concept": ["038"], "gap": "", "words": [["lose", "잃어버리다"], ["cap", "모자"], ["subway", "지하철"], ["park", "공원"]], "h1": "우리말은 '지하철이나 공원, 둘 중 한 곳에서 잃어버린 것 같다'예요. 두 장소 중 하나라는 뜻을 만드는 짝꿍 표현이 무엇인지 생각해 보세요.", "h2": "빈칸 사이에 on the subway와 in the park가 있어요. 두 장소를 'A 또는 B'로 이어 주는 짝을 골라 보세요.", "why": "'A 또는 B 둘 중 한 곳'은 either A or B예요. 그래서 either on the subway or in the park가 돼요.", "opts": [{"n": "①", "en": "not – but", "ko": "~가 아니라 - ~이다", "ok": false, "why": "'지하철이 아니라 공원'이라서 '둘 중 한 곳'과 뜻이 달라요."}, {"n": "②", "en": "either – or", "ko": "둘 중 하나 - 또는", "ok": true, "why": "'지하철 또는 공원 둘 중 한 곳'과 뜻이 같아요."}, {"n": "③", "en": "neither – nor", "ko": "둘 다 아닌", "ok": false, "why": "'둘 다 아니다'라서 뜻이 반대예요."}, {"n": "④", "en": "both – and", "ko": "둘 다", "ok": false, "why": "'둘 다에서 잃어버렸다'가 돼서 뜻이 달라요."}, {"n": "⑤", "en": "not only – but also", "ko": "~뿐만 아니라 ...도", "ok": false, "why": "'지하철뿐만 아니라 공원에서도'라서 뜻이 달라요."}], "pencil": "'A 또는 B 둘 중 하나'는 ___ A ___ B", "pencilKey": "either / or", "page": 184, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "not A but B, either A or B, neither A nor B", "type": "mc", "ans": "⑤", "concept": ["038", "037-H1"], "gap": "", "words": [["bookstore", "서점"], ["wait for", "~을 기다리다"], ["bus stop", "버스 정류장"]], "h1": "상관접속사가 이어 주는 말은 같은 종류의 말이어야 해요. 밑줄 친 부분 중 짝이 되는 앞뒤 표현이 서로 같은 모양인지 확인해 보세요.", "h2": "not the bookstore but at the bus stop에서 not 뒤는 the bookstore(명사구)예요. but 뒤도 같은 모양이어야 하는데 어떤 낱말이 더 붙어 있나요?", "why": "not 뒤는 the bookstore인데 but 뒤는 at the bus stop이라서 모양이 달라요. at을 빼고 the bus stop으로 맞춰야 해요.", "opts": [{"n": "①", "en": "neither", "ko": "둘 다 아닌", "ok": false, "why": "neither Frank nor Alice(Frank도 Alice도 아닌)로 짝이 맞아요."}, {"n": "②", "en": "was", "ko": "~이었다", "ok": false, "why": "neither A nor B는 동사를 B(Alice, 단수)에 맞춰서 was가 맞아요."}, {"n": "③", "en": "waiting for", "ko": "~을 기다리고 있는", "ok": false, "why": "were waiting for(~을 기다리고 있었다)로 쓰여서 맞아요."}, {"n": "④", "en": "not", "ko": "~가 아닌", "ok": false, "why": "not the bookstore but ...의 not이라서 맞아요."}, {"n": "⑤", "en": "at", "ko": "~에서", "ok": true, "why": "but 뒤가 not 뒤의 the bookstore와 같은 모양이어야 해서 at이 있으면 틀려요."}], "pencil": "상관접속사 앞뒤에는 ___ 모양의 말이 온다", "pencilKey": "같은", "page": 184, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "상관접속사 통합형", "type": "mc", "ans": "③", "concept": ["038", "099"], "gap": "", "words": [["article", "기사"], ["cabinet", "수납장"], ["sign language", "수화"], ["understand", "이해하다"]], "h1": "세 문장 모두 상관접속사가 있어요. (A)는 both A and B, (B)는 A as well as B, (C)는 either A or B예요. 동사를 각각 어느 쪽에 맞추는지 정리해 보세요.", "h2": "both A and B는 복수, A as well as B는 A에, either A or B는 B에 동사를 맞춰요. (B)에서 A는 the students, B는 the teacher예요. 동사를 어느 쪽에 맞추는지 확인해 보세요.", "why": "(A) both A and B는 복수라서 have예요. (B) A as well as B는 A(The students, 복수)에 맞춰 like예요. (C) either A or B는 B(George, 단수)에 맞춰 is예요.", "opts": [{"n": "①", "en": "has – like – are", "ko": "갖다 - 좋아하다 - ~이다", "ok": false, "why": "(A)는 복수라서 has가 아니라 have예요."}, {"n": "②", "en": "has – likes – is", "ko": "갖다 - 좋아하다 - ~이다", "ok": false, "why": "(A)는 복수라서 has가 틀리고 (B)는 복수 A라서 likes도 틀려요."}, {"n": "③", "en": "have – like – is", "ko": "갖다 - 좋아하다 - ~이다", "ok": true, "why": "(A) have, (B) like, (C) is가 모두 맞아요."}, {"n": "④", "en": "have – likes – is", "ko": "갖다 - 좋아하다 - ~이다", "ok": false, "why": "(B)는 A(The students, 복수)에 맞춰야 해서 likes가 틀려요."}, {"n": "⑤", "en": "have – like – are", "ko": "갖다 - 좋아하다 - ~이다", "ok": false, "why": "(C)는 B(George, 단수)에 맞춰서 are가 아니라 is예요."}], "pencil": "A as well as B는 동사를 ___ 에 맞춘다", "pencilKey": "A", "page": 184, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "both A and B, not only A but also B", "type": "mc", "ans": "②", "concept": ["038"], "gap": "", "words": [["frog", "개구리"], ["land", "땅, 육지"], ["worried about", "~을 걱정하는"], ["apply for", "~에 지원하다"]], "h1": "밑줄 친 상관접속사 표현이 짝이 맞게 쓰였는지 하나씩 확인해 보세요. 특히 both와 함께 쓰이는 짝이 맞는지 보세요.", "h2": "both는 and와, not only는 but also와, neither는 nor와 짝이에요. 보기 ②의 both와 짝이 된 접속사가 무엇인지 보세요.", "why": "both in water ___ on land에서 both A and B(둘 다)로 써야 해서 but이 아니라 and가 맞아요.", "opts": [{"n": "①", "en": "either a cooking or art class", "ko": "요리 수업이나 미술 수업 중 하나", "ok": false, "why": "either A or B 짝이 맞게 쓰였어요."}, {"n": "②", "en": "both in water but on land", "ko": "물속에서도 땅에서도", "ok": true, "why": "both와 짝이 되는 말은 and예요. but을 쓰면 틀려요."}, {"n": "③", "en": "Not only Ryan but also I am", "ko": "Ryan뿐만 아니라 나도 ~이다", "ok": false, "why": "not only A but also B이고 동사를 B(I)에 맞춰 am이라 맞아요."}, {"n": "④", "en": "Neither my mom nor my dad was", "ko": "엄마도 아빠도 ~이 아니었다", "ok": false, "why": "neither A nor B이고 동사를 B(dad, 단수)에 맞춰 was라서 맞아요."}, {"n": "⑤", "en": "Not Sophia but Mason applied", "ko": "Sophia가 아니라 Mason이 지원했다", "ok": false, "why": "not A but B 짝이 맞게 쓰였어요."}], "pencil": "both와 짝이 되는 말은 ___", "pencilKey": "and", "page": 184, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "both A and B, not only A but also B", "type": "mc", "ans": "⑤", "concept": ["038", "099"], "gap": "", "words": [["wise", "현명한"]], "h1": "'Rachel뿐만 아니라 너도'를 영어로 말할 때 쓰는 표현이 무엇인지 먼저 정하고, 주어가 둘일 때 동사를 어느 쪽에 맞추는지도 확인해 보세요.", "h2": "not only A but also B는 동사를 B에 맞춰요. 이 문장에서 B는 you예요. you와 쓰는 be동사 현재형을 떠올려 보세요.", "why": "'A뿐만 아니라 B도'는 not only A but also B이고 동사는 B(you)에 맞춰 are를 써요.", "opts": [{"n": "①", "en": "You as well as Rachel is wise.", "ko": "Rachel뿐만 아니라 너도 현명하다.", "ok": false, "why": "A as well as B는 동사를 A(You)에 맞춰 are로 써야 해요. is라서 틀려요."}, {"n": "②", "en": "Not Rachel but you are wise.", "ko": "Rachel이 아니라 너가 현명하다.", "ok": false, "why": "not A but B는 '~가 아니라'라서 뜻이 달라요."}, {"n": "③", "en": "Either Rachel or you are wise.", "ko": "Rachel이나 너 둘 중 한 명이 현명하다.", "ok": false, "why": "either A or B는 '둘 중 하나'라서 뜻이 달라요."}, {"n": "④", "en": "Neither Rachel nor you are wise.", "ko": "Rachel도 너도 현명하지 않다.", "ok": false, "why": "neither A nor B는 부정의 뜻이라서 뜻이 달라요."}, {"n": "⑤", "en": "Not only Rachel but also you are wise.", "ko": "Rachel뿐만 아니라 너도 현명하다.", "ok": true, "why": "우리말과 뜻이 같고 동사도 B(you)에 맞아요."}], "pencil": "not only A but also B가 주어이면 동사는 ___ 에 맞춘다", "pencilKey": "B", "page": 184, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "상관접속사 통합형", "type": "mc", "ans": "⑤", "concept": ["038"], "gap": "", "words": [["rainy", "비 오는"], ["windy", "바람 부는"], ["helmet", "헬멧"], ["gloves", "장갑"], ["exactly", "정확히"]], "h1": "네 문장에 들어갈 말을 하나씩 찾아서 보기에서 '어디에도 안 쓰이는 것'을 골라요. 각 문장의 짝꿍(앞뒤 접속사)을 먼저 찾아보세요.", "h2": "첫 문장은 rainy and windy라서 both, 둘째는 nor가 있어서 neither, 셋째는 but also가 있어서 not only, 넷째는 or가 있어서 either가 짝이에요. 남는 낱말이 정답이에요.", "why": "순서대로 both, nor, only, or가 들어가요. 그래서 보기 ⑤ but은 어디에도 쓰이지 않아요.", "opts": [{"n": "①", "en": "or", "ko": "또는", "ok": false, "why": "마지막 문장 either pink or purple에 들어가요."}, {"n": "②", "en": "only", "ko": "~만", "ok": false, "why": "셋째 문장 not only a helmet but also gloves에 들어가요."}, {"n": "③", "en": "both", "ko": "둘 다", "ok": false, "why": "첫째 문장 both rainy and windy에 들어가요."}, {"n": "④", "en": "nor", "ko": "~도 아닌", "ok": false, "why": "둘째 문장 Neither Sam nor Jessica에 들어가요."}, {"n": "⑤", "en": "but", "ko": "그러나", "ok": true, "why": "빈칸 어디에도 들어가지 않아요. 정답이에요."}], "pencil": "빈칸에 안 쓰이는 낱말을 찾으려면 문장마다 ___ 를 먼저 찾는다", "pencilKey": "짝꿍", "page": 184, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "both A and B, not only A but also B", "type": "write", "ans": "not → not only", "concept": ["038", "037-H1"], "gap": "", "words": [["thousands of", "수천의"], ["look for", "~을 찾다"], ["shelter", "쉼터, 피난처"], ["field", "들판"]], "h1": "밑줄 친 not 뒤에 water and food but also shelter가 이어져요. but also와 짝이 되는 표현이 어떤 모양인지 떠올려 보세요.", "h2": "but also 앞에는 not 한 낱말만이 아니라 not only가 와야 해요. 밑줄 친 부분을 어떻게 고쳐야 할까요?", "why": "not A but also B는 틀린 표현이고 not only A but also B로 써야 해요. 그래서 not을 not only로 고쳐요.", "opts": [], "pencil": "but also와 짝이 되는 말은 not ___", "pencilKey": "only", "page": 185, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "both A and B, not only A but also B", "type": "write", "ans": "Both children and adults love the amusement park.", "concept": ["038", "099"], "gap": "", "words": [["amusement park", "놀이공원"], ["adult", "어른"], ["child", "아이"], ["love", "아주 좋아하다"]], "h1": "'아이와 어른, 둘 다'라는 뜻이에요. 둘 다를 말하는 짝꿍 표현으로 문장을 시작해 보세요. 괄호 안에 both가 있어요.", "h2": "both A and B에서 A는 children, B는 adults예요. 이 주어는 복수 취급하니 동사 love는 그대로 써요. 'the'는 amusement park 앞에 붙여요.", "why": "'둘 다'는 both A and B예요. Both children and adults가 주어이고 love the amusement park이 이어져요.", "opts": [], "pencil": "both A and B가 주어이면 ___ 동사", "pencilKey": "복수", "page": 185, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "명령문, and/or", "type": "write", "ans": "or, and", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["watch your step", "발밑을 조심하다"], ["fall down", "넘어지다"], ["cook", "요리하다"], ["parents", "부모님"]], "h1": "두 문장 모두 명령문 뒤에 결과가 와요. 첫 문장은 '조심해라, 그렇지 않으면 넘어질지도 모른다'이고, 둘째는 '요리해라, 그러면 기뻐하실 것이다'예요.", "h2": "나쁜 결과가 오는 문장에는 or, 좋은 결과가 오는 문장에는 and를 써요. 순서대로 하나씩 넣어 보세요.", "why": "첫 문장은 안 하면 넘어질 수 있는 나쁜 결과라서 or, 둘째는 하면 기뻐하시는 좋은 결과라서 and를 써요.", "opts": [], "pencil": "나쁜 결과 ___, 좋은 결과 ___", "pencilKey": "or / and", "page": 185, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "명령문, and/or", "type": "write", "ans": "[모범답] Don't eat too much, or you'll have a stomachache.", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["eat too much", "너무 많이 먹다"], ["stomachache", "배탈, 복통"], ["have", "갖다, 겪다"]], "h1": "우리말은 '너무 많이 먹지 마라, 그렇지 않으면 배탈이 날 것이다'예요. 명령문 부분에 부정 명령문을 쓰라는 뜻이에요.", "h2": "부정 명령문은 Don't나 Do not으로 시작해요. 먹지 않는 것이 하지 않으면 나쁜 결과를 막는 내용이라서 뒤에는 어떤 접속사를 쓸지 정해 보세요.", "why": "부정 명령문 Don't eat too much 뒤에 나쁜 결과를 이어 주는 or를 써서 or you'll have a stomachache로 써요.", "opts": [], "pencil": "부정 명령문은 ___ 또는 Do not으로 시작한다", "pencilKey": "Don't", "page": 185, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "명령문, and/or", "type": "write", "ans": "[모범답] Follow me, and you'll find the way.", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["follow", "따라가다"], ["find the way", "길을 찾다"]], "h1": "우리말은 '나를 따라와라, 그러면 길을 찾을 것이다'예요. 따라가면 길을 찾는 좋은 결과가 생겨요.", "h2": "명령문은 동사원형으로 시작해요. 좋은 결과를 이어 주는 접속사 뒤에 주어 you와 will을 줄인 형태를 써 보세요.", "why": "따라가면 좋은 결과가 생기니 「명령문, and ...」로 써요. 그래서 Follow me, and you'll find the way예요.", "opts": [], "pencil": "좋은 결과는 명령문, ___ ...", "pencilKey": "and", "page": 185, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "명령문, and/or", "type": "write", "ans": "(1) If you don't have breakfast (2) Unless you have breakfast", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["have breakfast", "아침을 먹다"], ["hungry", "배고픈"], ["unless", "~하지 않으면"]], "h1": "주어진 문장은 'Have breakfast, or you'll get hungry soon'(아침을 먹어라, 그렇지 않으면 곧 배고플 것이다)이에요. (1)은 if, (2)는 unless를 써서 바꿔요.", "h2": "if에는 부정의 뜻이 없어서 명령문 내용을 부정으로 바꿔야 해요. unless 자체에 부정의 뜻이 있어서 명령문 내용을 그대로 긍정으로 써요.", "why": "'먹지 않으면'은 if you don't have breakfast, unless you have breakfast로 써요. unless에는 이미 '~하지 않으면'이 들어 있어요.", "opts": [], "pencil": "if ... not = ___ + 긍정", "pencilKey": "unless", "page": 185, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "명령문, and/or", "type": "write", "ans": "[모범답] or you'll be late for school", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["go to bed", "잠자리에 들다"], ["be late for school", "학교에 늦다"], ["watch TV", "TV를 보다"]], "h1": "Kate는 밤 11시인데 TV를 보고 있어요. 엄마가 하는 말은 '지금 당장 자라, 그렇지 않으면 학교에 늦을 거야'예요. 나쁜 결과를 이어 줄 접속사를 정해 보세요.", "h2": "빈칸에는 접속사와 나쁜 결과가 들어가요. 나쁜 결과를 이어 주는 접속사로 시작하고, '학교에 늦다'를 will 대신 줄임말로 써 보세요.", "why": "나쁜 결과를 말할 때는 or를 써요. 그래서 or you'll be late for school이 돼요.", "opts": [], "pencil": "나쁜 결과는 명령문, ___ ...", "pencilKey": "or", "page": 185, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "상관접속사 통합형", "type": "write", "ans": "You can either stay here or go with me.", "concept": ["038", "037-H1"], "gap": "", "words": [["stay", "머무르다"], ["go with", "~와 함께 가다"]], "h1": "'여기에 머물거나 나와 함께 갈 수 있다'는 두 가지 중 하나를 고르는 뜻이에요. 아홉 단어로 짝꿍 표현을 써서 문장을 만들어 보세요.", "h2": "either A or B에서 A와 B는 같은 모양의 말이어야 해요. stay here와 go with me처럼 둘 다 동사원형으로 시작하게 쓰면 돼요.", "why": "'A 또는 B 둘 중 하나'는 either A or B예요. can 뒤에 either stay here or go with me를 이어요.", "opts": [], "pencil": "either A or B에서 A와 B는 ___ 모양", "pencilKey": "같은", "page": 185, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "상관접속사 통합형", "type": "write", "ans": "(1) Both, and (2) Neither, nor (3) not only, but also", "concept": ["038"], "gap": "", "words": [["history", "역사"], ["science", "과학"], ["math", "수학"], ["music", "음악"]], "h1": "표에서 웃는 얼굴은 좋아하는 과목, 찡그린 얼굴은 싫어하는 과목이에요. (1)은 둘 다 좋아하는 것, (2)는 둘 다 싫어하는 것, (3)은 좋아하는 과목이 둘인 것이에요.", "h2": "(1) Ann과 Chris가 과학을 둘 다 좋아해요. (2) Ann과 Kelly는 둘 다 역사를 싫어해요. (3) Chris가 좋아하는 두 과목은 과학과 음악이에요. 각각 어떤 짝꿍 표현일까요?", "why": "(1)은 both A and B, (2)는 둘 다 싫어하니 neither A nor B, (3)은 not only science but also music으로 써요.", "opts": [], "pencil": "둘 다 ___ A and B, 둘 다 아닌 ___ A nor B", "pencilKey": "both / neither", "page": 185, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "흐름에 맞지 않는 명령문 고르기", "type": "mc", "ans": "③, ⑤", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["bus stop", "버스 정류장"], ["sunrise", "일출"], ["accident", "사고"], ["pasta", "파스타"], ["knowledge", "지식"]], "h1": "다섯 문장 모두 명령문 뒤에 and나 or가 와요. 각 문장의 뜻을 읽고 결과가 좋은 일인지 나쁜 일인지 따져서 접속사가 알맞은지 확인해 보세요. 어색한 것이 두 개예요.", "h2": "좋은 결과 앞에는 and, 나쁜 결과 앞에는 or가 와야 해요. 나쁜 결과인데 and이거나 좋은 결과인데 or인 문장을 찾아보세요.", "why": "③은 '천천히 운전해라, 그러면 사고가 날 수 있다'라서 어색하고(and를 or로), ⑤는 '매일 뉴스를 읽어라, 그렇지 않으면 지식을 많이 얻는다'라서 어색해요(or를 and로).", "opts": [{"n": "①", "en": "Run to the bus stop, or you won't see him.", "ko": "버스 정류장까지 뛰어라, 그렇지 않으면 그를 못 볼 것이다.", "ok": false, "why": "나쁜 결과라서 or가 맞아요."}, {"n": "②", "en": "Get up now, and you'll see the sunrise.", "ko": "지금 일어나라, 그러면 일출을 볼 것이다.", "ok": false, "why": "좋은 결과라서 and가 맞아요."}, {"n": "③", "en": "Drive slowly, and you may have an accident.", "ko": "천천히 운전해라, 그러면 사고가 날 수도 있다.", "ok": true, "why": "나쁜 결과인데 and를 써서 어색해요. or로 고쳐요."}, {"n": "④", "en": "Add more salt, and you'll make the pasta better.", "ko": "소금을 더 넣어라, 그러면 파스타가 더 맛있어질 것이다.", "ok": false, "why": "좋은 결과라서 and가 맞아요."}, {"n": "⑤", "en": "Read news online every day, or you'll get a lot of knowledge.", "ko": "매일 온라인으로 뉴스를 읽어라, 그렇지 않으면 많은 지식을 얻을 것이다.", "ok": true, "why": "좋은 결과인데 or를 써서 어색해요. and로 고쳐요."}], "pencil": "나쁜 결과에는 ___, 좋은 결과에는 and", "pencilKey": "or", "page": 186, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "어법상 어색한 문장의 개수", "type": "mc", "ans": "⑤", "concept": ["038", "099", "037-H1"], "gap": "", "words": [["surprised", "놀란"], ["scared", "겁먹은"], ["writer", "작가"], ["singer", "가수"], ["wash the dishes", "설거지하다"]], "h1": "ⓐ부터 ⓔ까지 문장을 하나씩 읽으면서 상관접속사의 짝, 같은 모양의 말, 동사의 수를 확인하고 틀린 것의 개수를 세어 보세요.", "h2": "ⓐ는 not A but B에서 A, B가 같은 모양인지, ⓑ는 both A and B의 동사 모양, ⓒ는 not only와 짝, ⓓ는 neither A nor B의 동사, ⓔ는 either와 짝을 확인해 보세요.", "why": "ⓐ, ⓑ, ⓒ, ⓔ 네 문장이 틀리고 ⓓ만 맞아요. 그래서 어색한 문장은 4개예요.", "opts": [{"n": "①", "en": "0", "ko": "0개", "ok": false, "why": "ⓐ, ⓑ, ⓒ, ⓔ가 틀려서 0개가 아니에요."}, {"n": "②", "en": "1", "ko": "1개", "ok": false, "why": "틀린 문장이 네 개라서 맞지 않아요."}, {"n": "③", "en": "2", "ko": "2개", "ok": false, "why": "틀린 문장이 네 개라서 맞지 않아요."}, {"n": "④", "en": "3", "ko": "3개", "ok": false, "why": "틀린 문장이 네 개라서 맞지 않아요."}, {"n": "⑤", "en": "4", "ko": "4개", "ok": true, "why": "ⓐ felt scared를 scared로, ⓑ likes를 like로, ⓒ and also를 but also로, ⓔ Either를 Neither로 고쳐야 해요."}], "pencil": "both A and B가 주어이면 동사는 ___ 취급", "pencilKey": "복수", "page": 186, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "잘못 고친 것 찾기", "type": "mc", "ans": "④", "concept": ["038", "099", "037-H1"], "gap": "", "words": [["brave", "용감한"], ["kind", "친절한"], ["travel", "여행하다"], ["Cambodia", "캄보디아"]], "h1": "밑줄 친 부분을 괄호 안처럼 고쳤을 때 그 고침이 맞는지 틀린지 판단하는 문제예요. 보기마다 고친 이유를 먼저 생각해 보세요.", "h2": "neither A nor B가 주어이면 동사는 B에 맞춰요. ④의 B는 he예요. he에 맞는 동사 모양이 이미 쓰였는지 확인해 보세요.", "why": "④는 동사를 B(he)에 맞춰서 plans가 이미 맞아요. plan으로 고치면 틀려요.", "opts": [{"n": "①", "en": "The man was brave as well as kindly. (→ kind)", "ko": "그 남자는 친절할 뿐만 아니라 용감했다.", "ok": false, "why": "as well as 앞뒤는 같은 품사여야 해서 kindly(부사)를 kind(형용사)로 고치는 게 맞아요."}, {"n": "②", "en": "You can either eat now and eat after the movie. (→ or)", "ko": "지금 먹거나 영화 후에 먹을 수 있다.", "ok": false, "why": "either와 짝은 or라서 and를 or로 고친 것이 맞아요."}, {"n": "③", "en": "Both fruit and vegetables are good for you. (→ 고칠 필요 없음)", "ko": "과일과 채소 둘 다 몸에 좋다.", "ok": false, "why": "both A and B는 복수라서 are가 맞고, 고칠 필요가 없다는 설명도 맞아요."}, {"n": "④", "en": "Neither you nor he plans to travel in Cambodia. (→ plan)", "ko": "너도 그도 캄보디아를 여행할 계획이 없다.", "ok": true, "why": "동사를 B(he)에 맞춰서 plans가 이미 맞아요. plan으로 고친 것이 잘못이에요."}, {"n": "⑤", "en": "Louis can play not only the violin but also the guitar. (→ 고칠 필요 없음)", "ko": "Louis는 바이올린뿐만 아니라 기타도 연주할 수 있다.", "ok": false, "why": "not only A but also B가 맞게 쓰여서 고칠 필요가 없어요."}], "pencil": "neither A nor B가 주어이면 동사는 ___ 에 맞춘다", "pencilKey": "B", "page": 186, "sec": "s4"}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "if 문장을 명령문으로 바꿔 쓰기", "type": "write", "ans": "Focus on your classes, or", "concept": ["037", "042"], "gap": "명령문, and/or 의 뜻(~해라, 그러면 / 그렇지 않으면)과 if, unless로 바꿔 쓰는 방법", "words": [["focus on", "~에 집중하다"], ["class", "수업"], ["grade", "성적"]], "h1": "윗문장은 'if you don't focus on your classes'(수업에 집중하지 않으면)예요. 같은 뜻을 명령문으로 바꿔 보세요. 명령문 뒤 접속사도 정해야 해요.", "h2": "'~하지 않으면'은 '~해라, 그렇지 않으면'과 같은 뜻이에요. 맨 앞 칸에는 명령문, 뒤 칸에  h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
