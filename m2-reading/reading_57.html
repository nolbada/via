rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"I went camping with Dad for the first time.","ko":"나는 처음으로 아빠와 캠핑을 갔다.","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"\"We're going to spending the day under nature's roof. So, we should understand nature with a special keys,\" Dad said.","ko":"\"우리는 자연의 지붕 아래에서 하루를 보낼 거야. 그래서 우리는 특별한 열쇠로 자연을 이해해야 해.\" 아빠가 말씀하셨다.","ok":false,"foot":[],"fixes":[{"wrong":"spending","right":"spend","partial":false,"at":[3],"point":"to부정사: to 뒤에는 동사원형 spend 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 spend 사용"},{"wrong":"keys","right":"key","partial":false,"at":[17],"point":"명사의 단수형: a 뒤에는 단수명사 key 사용","topic":"명사의 단수형","memo":"a 뒤에는 단수명사 key 사용"}]},{"n":3,"tag":null,"en":"\"Who's the key?\" I asked.","ko":"\"그 열쇠가 뭐예요?\" 내가 물었다.","ok":false,"foot":[],"fixes":[{"wrong":"Who's","right":"What's","partial":false,"at":[0],"point":"의문사: 사물을 묻는 의문사 What 사용","topic":"의문사","memo":"사물을 묻는 의문사 What 사용"}]},{"n":4,"tag":null,"en":"\"Science, Minho,\" Dad answered with an big smile.","ko":"\"과학이란다, 민호야.\" 아빠가 환하게 웃으며 대답하셨다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[5],"point":"관사 a/an: 자음 소리 big 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 big 앞에는 a 사용"}]},{"n":5,"tag":null,"en":"We pulled the tent out of it bag, and Dad look around.","ko":"우리는 가방에서 텐트를 꺼냈고, 아빠는 주위를 둘러보셨다.","ok":false,"foot":[],"fixes":[{"wrong":"it","right":"its","partial":false,"at":[6],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 its 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 its 사용"},{"wrong":"look","right":"looked","partial":false,"at":[10],"point":"과거시제: 앞 동사와 같이 과거형 looked 사용","topic":"과거시제","memo":"앞 동사와 같이 과거형 looked 사용"}]},{"n":6,"tag":null,"en":"\"What are you do, Dad?\"","ko":"\"아빠, 뭐 하세요?\"","ok":false,"foot":[],"fixes":[{"wrong":"do","right":"doing","partial":false,"at":[3],"point":"현재진행형: are 뒤에는 doing: do 아님","topic":"현재진행형","memo":"are 뒤에는 doing: do 아님"}]},{"n":7,"tag":null,"en":"\"I'm look for a place for the tent.\"","ko":"\"텐트를 칠 장소를 찾고 있단다.\"","ok":false  잘하셨다.","\"그거 어떻게 하셨어요, 아빠?\"","\"대부분의 돌은 물에 가라앉지. 하지만 네가 돌을 적절한 속도와 각도로 던지면, 돌은 튕기면서 멀리 갈 수 있어. 돌의 모양도 중요하단다. 더 좋은 돌을 고르고 더 나은 각도를 찾을 수 있겠니?\""];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["여자는 우주 구역이 별로 흥미롭지 않다고 말한다.","남자는 달에 대해 궁금해한다.","두 사람은 우주 구역에 먼저 가기로 한다.","과학관에는 구역이 하나뿐이다.","두 사람은 4D 영화관에 먼저 가기로 한다."],"a":2,"ans":"두 사람은 우주 구역에 먼저 가기로 한다.","evs":[["W: The space section. I'm really curious about the moon.","우주 구역이요. 저는 달이 정말 궁금해요."],["M: Then, let's go there first.","그럼 거기에 먼저 갑시다."]],"ev":["W: The space section. I'm really curious about the moon.","우주 구역이요. 저는 달이 정말 궁금해요."],"ow":["오답 ✕ — 여자는 'I'm really curious about the moon.'(저는 달이 정말 궁금해요.)이라고 했으므로 우주 구역에 흥미가 있다. 이 보기는 반대라서 틀림.","오답 ✕ — 달이 궁금하다고 말한 사람은 남자가 아니라 여자이다. 'W: The space section. I'm really curious about the moon.'(우주 구역이요. 저는 달이 정말 궁금해요.)이므로 틀림.","정답 ○ — 여자가 우주 구역(The space section)이라고 답하자 남자가 'Then, let's go there first.'(그럼 거기에 먼저 갑시다.)라고 했으므로 일치함.","오답 ✕ — 'There are many sections in this science museum.'(이 과학관에는 구역이 많이 있어요.)라고 했는데, 이 보기는 하나뿐이라고 해서 틀림.","오답 ✕ — 두 사람이 먼저 가기로 한 곳은 우주 구역이다. 4D 영화관에 대한 언급은 이 대화에 없어서 틀림."],"memo":["정답 ③: 두 사람은 우주 구역에 먼저 가기로 한다.","근거: Then, let's go there first.(그럼 거기에 먼저 갑시다.) — there는 the space section","함정: 달이 궁금하다고 한 사람은 남자가 아니라 여자다. ②는 ✕"],"why":"여자가 달이 궁금해 우주 구역을 고르고, 두 사람이 그곳에 먼저 가기로 한다."}],"dlg":[["W","There are many sections in this science museum.","이 과학관에는 구역이 많이 있어요."],["M","Yes. Where do you want to go first?","네. 어디에 먼저 가고 싶으세요?"],["W","The space section. I'm really curious about the moon.","우주 구역이요. 저는 달이 정말 궁금해요."],["M","Then, let's go there first.","그럼 거기에 먼저 갑시다."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Kate is satisfied with the campsite.","Kate's dad tells her about the rules they have to follow.","Kate and her dad must bring their trash back home.","People can make loud noises after 10 p.m. at the campsite.","There are campers who go to bed early at night."],"a":3,"ans":"People can make loud noises after 10 p.m. at the campsi [["M: Kate, do you know anything about the science camp this year?","Kate, 올해 과학 캠프에 대해 뭔가 알고 있니?"],["M: Yes, I am.","응, 갈 거야."]],"ev":["M: Kate, do you know anything about the science camp this year?","Kate, 올해 과학 캠프에 대해 뭔가 알고 있니?"],"ow":["오답 ✕ — 'It's from September 10th to 12th'(9월 10일부터 12일까지 열려)이므로 3일 동안 진행되는 것은 일치한다. 그래서 정답이 아님.","오답 ✕ — 'on the school field'(학교 운동장에서)와 일치한다. 그래서 정답이 아님.","오답 ✕ — 'There's a special talk about life in the sea.'(바다 생물에 관한 특별 강연이 있어.)와 일치한다. 그래서 정답이 아님.","오답 ✕ — 남자가 'I'm really curious about that.'(나 그게 정말 궁금해.)라고 하고 여자도 'Me, too.'(나도.)라고 했으므로 둘 다 관심이 있다. 그래서 정답이 아님.","정답 ○ — 여자가 'Are you going to go to the camp?'(너는 캠프에 갈 거니?)라고 묻자 남자가 'Yes, I am.'(응, 갈 거야.)이라고 했다. 참가하지 않을 것이라는 보기는 일치하지 않음."],"memo":["정답 ⑤: 남자는 이번 과학 캠프에 참가할 것이다(불일치 보기).","근거: Are you going to go to the camp? — Yes, I am.(너는 캠프에 갈 거니? — 응, 갈 거야.)","함정: 'Yes, I am.'은 간다는 뜻이다. 참가하지 않는다는 ⑤만 ✕"],"why":"남자는 과학 캠프에 갈 것이라고 대답했으므로 참가하지 않는다는 말은 틀리다."}],"dlg":[["M","Kate, do you know anything about the science camp this year?","Kate, 올해 과학 캠프에 대해 뭔가 알고 있니?"],["W","Yeah. It's from September 10th to 12th on the school field.","응. 9월 10일부터 12일까지 학교 운동장에서 열려."],["M","Are there any special programs at the camp?","캠프에 특별 프로그램이 있니?"],["W","Yes. There's a special talk about life in the sea.","응. 바다 생물에 관한 특별 강연이 있어."],["M","Oh, I'm really curious about that.","오, 나 그게 정말 궁금해."],["W","Me, too. Are you going to go to the camp?","나도. 너는 캠프에 갈 거니?"],["M","Yes, I am.","응, 갈 거야."],["W","Great. I'll see you there.","좋아. 거기서 보자."]]},{"qs":[{"n":4,"q":"여학생이 Kim 선생님에게 물어본 것은?","o":["과학 보고서의 주제","과학 보고서의 분량","과학 캠프의 날짜","과학 보고서 제출 기한","실험 도구를 빌리는 방법"],"a":3,"ans":"과학 보고서 제출 기한","evs":[["W: When is the due date for the science report?","과학 보고서 제출 기한이 언제예요?"],["M: You have to turn it in by Thursday.","목요일까지 제출해야 한단다."]],"ev":["W: When is the due date for the science report?","과학 보고서 제출 기한이 언제예요?"],"ow":["오답 ✕ — 여학생은 'When is the due date for the science report?'(과학 보고서 제출 기한이 언제예요?)라고 물었다. 주제를 물은 것이 아니라서 틀림.","오답 ✕ — 보고서 분량에 대한 질문은 지문에 없다. 가장 가까운 문장은 'When is the due date for the science report?'(제출 기한이 언제예요?)이다.","오답 ✕ — 과학 캠프는 이 대화에 나오지 않는다. 여학생은 과학 보고서의 기한을 물었다.","정답 ○ — 'When is the due date for the science report?'(과학 보고서 제출 기한이 언제예요?)라고 물었고 선생님이 'by Thursday'(목요일까지)라고 답하므로 맞음.","오답 ✕ — 실험 도구에 대한 언급은 지문에 없다. 질문 내용은 제출 기한(due date)이다."],"memo":["정답 ④: 과학 보고서 제출 기한","근거: When is the due date for the science report?(과학 보고서 제출 기한이 언제예요?)","함정: due date(기한)는 주제·분량이 아니다. 선생님 답은 by Thursday(목요일까지)"],"why":"여학생은 과학 보고서의 제출 기한(due date)을 물었다."}],"dlg":[["W","Mr. Kim, I have a question.","김 선생님, 질문이 있어요."],["M","Yes, what is it?","그래, 뭐니?"],["W","When is the due date for the science report?","과학 보고서 제출 기한이 언제예요?"],["M","You have to turn it in by Thursday.","목요일까지 제출해야 한단다."],["W","I see. Thank you.","알겠어요. 감사합니다."]]},{"qs":[{"n":5,"q":"What are the speakers going to do?","o":["They are going to make a robot.","They are going to look for the movie theater.","They are going to learn about the human body.","They are going to watch a movie about a robot.","They are going to read a book about the human body."],"a":3,"ans":"They are going to watch a movie about a robot.","evs":[["M: It's a movie about a tiny robot which is exploring our body.","우리 몸속을 탐험하는 아주 작은 로봇에 관한 영화야."],["W: Hmm, I'm really curious about the robot. Let's watch the movie together.","음, 나는 그 로봇이 정말 궁금해. 같이 그 영화를 보자."]],"ev":["M: It's a movie about a tiny robot which is exploring our body.","우리 몸속을 탐험하는 아주 작은 로봇에 관한 영화야."],"ow":["오답 ✕ — 로봇은 영화 속 소재일 뿐이다. 두 사람이 로봇을 만든다는 말은 지문에 없다. 가장 가까운 문장은 'a movie about a tiny robot'(아주 작은 로봇에 관한 영화)이다.","오답 ✕ — 'There's a 4D movie theater.'(4D 영화관이 있어.)라고 이미 영화관이 있다는 것을 알고 있으므로 영화관을 찾으러 가는 것이 아니다. 틀림.","오답 ✕ — 인체를 소개하는 영화이긴 하지만 두 사람이 하려는 일은 영화를 보는 것이다. 'Let's watch the movie together.'(같이 그 영화를 보자.)라고 했으므로 인체에 대해 배우러 가는 것이라는 보기는 틀림.","정답 ○ — 여자가 'I'm really curious about the robot. Let's watch the movie together.'(나는 그 로봇이 정말 궁금해. 같이 그 영화를 보자.)라고 하고 남자가 'Sure.'(좋아.)라고 했으므로 로봇에 관한 영화를 볼 것임.","오답 ✕ — 두 사람은 책이 아니라 영화를 보기로 했다. 책에 대한 언급은 지문에 없음."],"memo":["정답 ④: 로봇에 관한 영화를 볼 것이다.","근거: Let's watch the movie together.(같이 그 영화를 보자.) — a movie about a tiny robot","함정: 영화 내용(몸속 탐험)과 두 사람이 할 일(영화 보기)은 다르다. ③은 ✕"],"why":"두 사람은 4D 영화관에서 작은 로봇에 관한 영화를 같이 보기로 한다."}],"dlg":[["M","There's a 4D movie theater.","4D 영화관이 있어."],["W","Oh, really? What's playing there?","오, 정말? 거기서 무엇을 상영하니?"],["M","It's a movie about a tiny robot which is exploring our body.","우리 몸속을 탐험하는 아주 작은 로봇에 관한 영화야."],["W","Hmm, I'm really curious about the robot. Let's watch the movie together.","음, 나는 그 로봇이 정말 궁금해. 같이 그 영화를 보자."],["M","Sure.","좋아."]]}];var BG=[{"qs":[{"n":6,"q":"아빠가 말한 '특별한 열쇠(special key)'가 의미하는 것은?","o":["지도","텐트","호수","과학","용기"],"a":3,"ans":"과학","evs":[["So, we should understand nature with a special key,\" Dad said.","그래서 우리는 특별한 열쇠로 자연을 이해해야 해.\" 아빠가 말씀하셨다."],["\"Science, Minho,\" Dad answered with a big smile.","\"과학이란다, 민호야.\" 아빠가 환하게 웃으며 대답하셨다."]],"ev":["So, we should understand nature with a special key,\" Dad said.","그래서 우리는 특별한 열쇠로 자연을 이해해야 해.\" 아빠가 말씀하셨다."],"ow":["오답 ✕ — 아빠는 'What's the key?'(그 열쇠가 뭐예요?)라는 질문에 'Science'(과학)라고 답했다. 지도는 언급되지 않았으므로 틀림.","오답 ✕ — 텐트는 이 부분에서 열쇠가 아니다. 아빠가 'we should understand nature with a special key'(우리는 특별한 열쇠로 자연을 이해해야 해)라고 했고 그 열쇠는 과학이다.","오답 ✕ — 호수는 이 부분에 나오지 않는다. 열쇠는 자연을 이해하는 도구인 'Science'(과학)이다.","정답 ○ — 'What's the key?'(그 열쇠가 뭐예요?)라는 질문에 아빠가 'Science, Minho'(과학이란다, 민호야)라고 답했으므로 열쇠는 과학임.","오답 ✕ — 용기에 대한 언급은 지문에 없다. 아빠가 답한 열쇠는 'Science'(과학)이다."],"memo":["정답 ④: 특별한 열쇠 = 과학(science)","근거: \"Science, Minho,\" Dad answered with a big smile.(\"과학이란다, 민호야.\" 아빠가 웃으며 대답하셨다.)","함정: key는 진짜 열쇠가 아니라 자연을 이해하는 방법을 비유한 말이다."],"why":"아빠가 말한 특별한 열쇠는 자연을 이해하게 해 주는 과학이다."}],"pp":[["I went camping with Dad for the first time.","나는 처음으로 아빠와 캠핑을 갔다."],["\"We're going to spend the day under nature's roof.","\"우리는 자연의 지붕 아래에서 하루를 보낼 거야."],["So, we should understand nature with a special key,\" Dad said.","그래서 우리는 특별한 열쇠로 자연을 이해해야 해.\" 아빠가 말씀하셨다."],["\"What's the key?\"","\"그 열쇠가 뭐예요?\""],["I asked.","내가 물었다."],["\"Science, Minho,\" Dad answered with a big smile.","\"과학이란다, 민호야.\" 아빠가 환하게 웃으며 대답하셨다."]]},{"qs":[{"n":7,"q":"윗글의 내용과 일치하지 않는 것은?","o":["아빠는 텐트 칠 장소를 찾고 있었다.","오후에는 날씨가 매우 더울 것이다.","민호와 아빠가 호수에 다녀오는 데 약 4시간이 걸린다.","그림자는 태양과 같은 방향으로 움직인다.","민호는 태양과 그림자의 움직임을 생각하여 텐트를 칠 장소를 골랐다."],"a":3,"ans":"그림자는 태양과 같은 방향으로 움직인다.","evs":[["The sun moves from east to west, so the shadow moves from west to east.","태양은 동쪽에서 서쪽으로 움직여요, 그래서 그림자는 서쪽에서 동쪽으로 움직이죠."],["We will be back from the lake about 4 hours later.","우리는 약 4시간 후에 호수에서 돌아올 거란다."]],"ev":["The sun moves from east to west, so the shadow moves from west to east.","태양은 동쪽에서 서쪽으로 움직여요, 그래서 그림자는 서쪽에서 동쪽으로 움직이죠."],"ow":["오답 ✕ — 아빠가 'I'm looking for a place for the tent.'(텐트를 칠 장소를 찾고 있단다.)라고 했으므로 일치한다. 그래서 정답이 아님.","오답 ✕ — 민호가 'It's going to be very hot in the afternoon,'(오후에는 매우 더울 거예요.)라고 했고 아빠가 'Right.'(맞아.)라고 했으므로 일치한다. 그래서 정답이 아님.","오답 ✕ — 아빠가 'We will be back from the lake about 4 hours later.'(우리는 약 4시간 후에 호수에서 돌아올 거란다.)라고 했으므로 일치한다. 그래서 정답이 아님.","정답 ○ — 민호는 'The sun moves from east to west, so the shadow moves from west to east.'(태양은 동쪽에서 서쪽으로 움직여서 그림자는 서쪽에서 동쪽으로 움직여요.)라고 했다. 그림자는 태양과 반대 방향으로 움직이므로 같은 방향이라는 보기는 일치하지 않음.","오답 ✕ — 민호가 태양과 그림자의 움직임을 생각해 'the tent will be in the tree's shadow then'(그때 텐트가 나무 그림자 속에 있을 거예요)라고 했으므로 일치한다. 그래서 정답이 아님."],"memo":["정답 ④: 그림자는 태양과 반대 방향으로 움직인다(불일치 보기).","근거: The sun moves from east to west, so the shadow moves from west to east.(태양은 동→서, 그림자는 서→동으로 움직여요.)","함정: 태양과 그림자의 방향은 서로 반대. '같은 방향'이라고 한 ④만 ✕"],"why":"태양은 동쪽에서 서쪽으로, 그림자는 서쪽에서 동쪽으로 움직여 서로 방향이 반대이다."},{"n":8,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["movement - shadow","movement - lake","temperature - shadow","brightness - window","speed - branch"],"a":0,"ans":"movement - shadow","evs":[["Let's think about the movement of the sun to set up the tent.","텐트를 세우기 위해서 태양의 움직임에 대해 생각해 보자."],["If we put the tent here, the tent will be in  return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
