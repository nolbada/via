<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>그래머인사이드 L1</title>
<style>
*{box-sizing:border-box}
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211f;--sub:#5b6b67;--line:#dbe3e0;--a:#a21caf;--soft:#f8e1fb}
@media (prefers-color-scheme:dark){:root{--bg:#10171a;--card:#182125;--ink:#e8eeec;--sub:#9db0ab;--line:#2a3639;--a:#d946ef;--soft:#3a1140}}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:22px;margin:0 0 4px}
.sub{font-size:13px;color:var(--sub);margin:0 0 20px}
.ch{border:3px solid var(--a);background:var(--soft);border-radius:16px;padding:4px 12px 8px;margin:0 0 20px}
.ch h2{text-align:center;font-size:24px;font-weight:900;letter-spacing:.06em;color:#fff;background:var(--a);border-radius:12px;padding:12px 10px;margin:10px 0 12px}
.ch a{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--a);border-radius:10px;padding:18px 16px;margin-bottom:8px;color:var(--ink);text-decoration:none;font-size:17px;font-weight:700}
.ch a span{font-size:13px;font-weight:400;color:var(--sub)}
.ch a:active{background:var(--line)}
</style>
</head>
<body>
<main>
<h1>그래머인사이드 L1</h1>
<p class="sub">힌트 카드</p>
<div class="ch">
<h2>CHAPTER 01</h2>
<a href="https://nolbada.github.io/via/grammar-inside/l1-u01/">UNIT 01 힌트<span>be동사의 현재형과 과거형</span></a>
</div>
</main>
</body>
</html>
