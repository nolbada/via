<!doctype html>

<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}

.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}

.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Today is an special day. We are having us middle school reunion!","ko":"오늘은 특별한 날이다. 우리는 중학교 동창회를 갖는다!","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[2],"point":"관사 a/an: special은 자음 소리라 an이 아니라 a special 사용","topic":"관사 a/an","memo":"special은 자음 소리라 an이 아니라 a special 사용"},{"wrong":"us","right":"our","partial":false,"at":[8],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 our 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 our 사용"}]},{"n":2,"tag":null,"en":"We was in the same class 20 years ago. Now everybody have amazing jobs.","ko":"우리는 20년 전에 같은 반이었다. 지금은 모두가 놀랄 만한 직업을 가지고 있다.","ok":false,"foot":[],"fixes":[{"wrong":"was","right":"were","partial":false,"at":[1],"point":"be동사: 주어 We에는 were 사용","topic":"be동사","memo":"주어 We에는 were 사용"},{"wrong":"have","right":"has","partial":false,"at":[11],"point":"주어와 동사의 수일치: everybody는 단수 취급: has (have 아님)","topic":"주어와 동사의 수일치","memo":"everybody는 단수 취급: has (have 아님)"}]},{"n":3,"tag":null,"en":"Let's find out about them!","ko":"그것들에 대해 알아보자!","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"Eunji was in the photography club when we were in middle school. She loved take pictures.","ko":"은지는 우리가 중학교에 다닐 때 사진 동호회에 속해 있었다. 그녀는 사진 찍는 것을 정말 좋아했다.","ok":false,"foot":[],"fixes":[{"wrong":"take","right":"taking","partial":false,"at":[14],"point":"동명사: love 뒤에는 동명사 taking 사용","topic":"동명사","memo":"love 뒤에는 동명사 taking 사용"}]},{"n":5,"tag":null,"en":"Now she are a drone photographer. Drones can going almost anywhere.","ko":"지금 그녀는 드론 사진작가이다. 드론은 거의 어디든 갈 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[2],"point":"be동사의 현재형: 주어 she는 is (are 아님)","topic":"be동사의 현재형","memo":"주어 she는 is (are 아님)"},{"wrong":"going","right":"go","partial":false,"at":[8],"point":"조동사: 조동사 can 뒤에는 동사원형 go 사용","topic":"조동사","memo":"조동사 can 뒤에는 동사원형 go 사용"}]},{"n":6,"tag":null,"en":"So she can take pictures from high up on the sky. She captures great moments.","ko":"그래서 그녀는 하늘 높은  개와 이야기하기 위해 개의 소리를 인간의 언어로 바꿔주는 애플리케이션을 만들었다."],"a":3,"ans":"지민이는 이제 예의범절을 가르치는 선생님이 되었다.","evs":[["He is a teacher now.","그는 지금 선생님이다."],["He takes care of them and teaches manners to them.","그는 개를 돌보고 그들에게 예절을 가르친다."]],"ev":["He is a teacher now.","그는 지금 선생님이다."],"ow":["오답 ✕ — 'He was a dog lover and had three dogs.'(그는 개를 정말 좋아하는 사람이었고 세 마리의 개를 키웠다.)라고 했으므로 고양이 애호가가 아니라 개 애호가임.","오답 ✕ — 지민이는 'had three dogs'(세 마리의 개를 키웠다)라고 했으므로 두 마리가 아니라 세 마리임.","오답 ✕ — 'But he doesn't teach children. He teaches dogs!'(그러나 그는 아이들을 가르치지 않는다. 그는 개를 가르친다!)라고 했으므로 학생은 다양한 동물이 아니라 개이다.","정답 ○ — 'He is a teacher now.'(그는 지금 선생님이다.)와 'He takes care of them and teaches manners to them.'(그는 개를 돌보고 예절을 가르친다.)에 일치함.","오답 ✕ — 'he uses a special application'(그는 특별한 응용 프로그램을 사용한다)이라고만 했을 뿐, 지민이가 그것을 직접 만들었다는 말은 지문에 없음."],"memo":["정답 ④: 지민이는 이제 예의범절을 가르치는 선생님이다.","근거: He takes care of them and teaches manners to them.(개를 돌보고 예절을 가르친다.)","함정: ⑤는 앱을 '사용한다'고만 했지 '만들었다'는 말이 없어 ✕"],"why":"지민이는 개를 돌보고 예절을 가르치는 선생님이 되었다."},{"n":8,"q":"윗글의 내용을 요약하려고 한다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["drone - application","airplane - application","drone - robot","camera - application","balloon - machine"],"a":0,"ans":"drone - application","evs":[["Now she is a drone photographer.","지금 그녀는 드론 사진작가이다."],["When he talks with the dogs, he uses a special application.","그가 개들과 대화할 때, 그는 특별한 응용 프로그램을 사용한다."]],"ev":["Now she is a drone photographer.","지금 그녀는 드론 사진작가이다."],"ow":["정답 ○ — 'Now she is a drone photographer.'(지금 그녀는 드론 사진작가이다.)이므로 (A)는 drone이고, 'he uses a special application'(그는 특별한 응용 프로그램을 사용한다)이므로 (B)는 application임.","오답 ✕ — 'Drones can go almost anywhere.'(드론은 거의 어디든 갈 수 있다.)에서 은지가 하늘에서 사진을 찍는 도구는 비행기(airplane)가 아니라 드론임.","오답 ✕ — (A) drone은 맞지만, 지민이가 개와 대화할 때 쓰는 것은 'a special application'(특별한 응용 프로그램)이지 로봇(robot)이 아님.","오답 ✕ — (B) application은 맞지만, 은지는 'a drone photographer'(드론 사진작가)이므로 (A)는 camera가 아니라 drone임.","오답 ✕ — 'she can take pictures from high up in the sky'(하늘 높은 곳에서 사진을 찍을 수 있다)의 도구는 드론이고, 개와의 대화에는 'application'을 쓰므로 balloon, machine 모두 틀림."],"memo":["정답 ①: 은지는 drone(드론)으로 사진을 찍고, 지민이는 application(앱)으로 개와 대화한다.","근거: Now she is a drone photographer.(지금 그녀는 드론 사진작가이다.)","함정: ④는 '카메라'가 아니라 '드론'이 핵심이라 ✕"],"why":"은지의 도구는 드론(drone), 지민이의 도구는 특별한 응용 프로그램(application)이다.","sum":"Eunji uses a (A)______ to take pictures from high up in the sky, and Jimin uses a special (B)______ to understand his dogs.","lab":"완성된 요약문 : "}],"pp":[["Eunji was in the photography club when we were in middle school.","은지는 우리가 중학교에 다닐 때 사진 동호회에 속해 있었다."],["She loved taking pictures.","그녀는 사진 찍는 것을 정말 좋아했다."],["Now she is a drone photographer.","지금 그녀는 드론 사진작가이다."],["Drones can go almost anywhere.","드론은 거의 어디든 갈 수 있다."],["So she can take pictures from high up in the sky.","그래서 그녀는 하늘 높은 곳에서 사진을 찍을 수 있다."],["She captures great moments.","그녀는 멋진 순간들을 포착한다."],["Her pictures are amazing!","그녀의 사진들은 놀랍다!"],["How about Jimin?","지민이는 어떨까?"],["He was a dog lover and had three dogs.","그는 개를 정말 좋아하는 사람이었고 세 마리의 개를 키웠다."],["He is a teacher now.","그는 지금 선생님이다."],["But he doesn't teach children.","그러나 그는 아이들을 가르치지 않는다."],["He teaches dogs!","그는 개를 가르친다!"],["He takes care of them and teaches manners to them.","그는 개를 돌보고 그들에게 예절을 가르친다."],["When he talks with the dogs, he uses a special application.","그가 개들과 대화할 때, 그는 특별한 응용 프로그램을 사용한다."],["It translates dog sounds into human language.","그것은 개의 소리를 인간의 언어로 번역한다."],["He feels happy when he understands the dogs.","그는 개의 말을 알아들을 때 행복을 느낀다."]]},{"qs":[{"n":9,"q":"윗글의 Sohee에 관한 내용으로 알맞지 않은 것은?","o":["She is a tour guide.","She doesn't live in Korea.","She guides a VR world tour.","She guides tourists to dangerous places.","She can visit Mars in a VR world."],"a":1,"ans":"She doesn't live in Korea.","evs":[["But she doesn't leave Korea.","그러나 그녀는 한국을 떠나지 않는다."],["She guides tourists in a VR world!","그녀는 가상현실(VR) 세계에서 관광객들을 안내한다!"]],"ev":["But she doesn't leave Korea.","그러나 그녀는 한국을 떠나지 않는다."],"ow":["오답 ✕ — 'Sohee works as a tour guide.'(소희는 관광 가이드로 일한다.)와 일치하 document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
