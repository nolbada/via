ebsite now.","지금 학교 홈페이지를 확인해 보자."],["G","Okay.","좋아."]]},{"qs":[{"n":3,"q":"위 대화에서 Chat Together는 무엇인가?","o":["단체 채팅을 위한 앱","과학 실험 도구","영어 학습 교재","음악을 재생하는 앱","학교 홈페이지"],"a":0,"ans":"단체 채팅을 위한 앱","evs":[["B: It’s an app for group chat. With this app, you can easily share ideas with your group.","그건 단체 채팅을 위한 앱이야. 이 앱으로 너는 모둠원들과 쉽게 아이디어를 나눌 수 있어."]],"ev":["B: It’s an app for group chat. With this app, you can easily share ideas with your group.","그건 단체 채팅을 위한 앱이야. 이 앱으로 너는 모둠원들과 쉽게 아이디어를 나눌 수 있어."],"ow":["정답 ○ — 소년이 'It’s an app for group chat.'(그건 단체 채팅을 위한 앱이야.)이라고 설명했으므로 맞음.","오답 ✕ — 소녀가 과학 모둠 과제를 시작하기 어려워한 것은 맞지만, Chat Together는 'an app for group chat'(단체 채팅 앱)이지 실험 도구가 아니라서 틀림.","오답 ✕ — 영어 교재라는 말은 대화에 없음. 'you can easily share ideas with your group'(모둠원들과 쉽게 아이디어를 나눌 수 있어)이라고 했으므로 틀림.","오답 ✕ — 음악 앱이라는 말은 대화에 없음. 'an app for group chat'(단체 채팅을 위한 앱)이라서 틀림.","오답 ✕ — 학교 홈페이지는 이 대화에 나오지 않음(다른 대화에 나옴). 이 대화에서는 'an app for group chat'(단체 채팅 앱)이라고 했으므로 틀림."],"memo":["정답 ①: 단체 채팅을 위한 앱","근거: It’s an app for group chat.(그건 단체 채팅을 위한 앱이야.)","함정: ①과 달리 ②~⑤는 대화에 근거가 없는 보기"],"why":"Chat Together는 모둠원과 아이디어를 쉽게 나누는 단체 채팅 앱이다."}],"dlg":[["G","I’m not sure how to start my science group project.","내 과학 모둠 과제를 어떻게 시작해야 할지 모르겠어."],["B","Did you hear about “Chat Together”?","너 “Chat Together”에 대해 들어 봤어?"],["G","No, what is it?","아니, 그게 뭔데?"],["B","It’s an app for group chat. With this app, you can easily share ideas with your group.","그건 단체 채팅을 위한 앱이야. 이 앱으로 너는 모둠원들과 쉽게 아이디어를 나눌 수 있어."],["G","That sounds very helpful!","그거 정말 도움이 될 것 같다!"]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["소년은 소셜 미디어에서 여름방학이 세 달이나 될 것이라는 글을 읽었다.","소년의 친구들은 긴 여름방학에 대한 글을 읽고 신이 났다.","소녀는 긴 여름방학에 대한 게시글을 이상하다고 생각한다.","소년은 학교 홈페이지에서 긴 여름방학에 대한 정보를 찾지 못한다.","소녀와 소년은 긴 여름방학에 대해 소식을 확실히 알기 위해 담임 선생님에게 전화하기로 한다."],"a":4,"ans":"소녀와 소년은 긴 여름방학에 대해 소식을 확실히 알기 위해 담임 선생님에게 전화하기로 한다.","evs":[["G: Then, why don’t we ask our homeroom teacher?","그럼 우리 담임 선생님께 여쭤보는 게 어때?"],["B: Oh, that’s a good idea! Let’s go to the teacher’s office tomorrow!","오, 좋은 생각이야! 내일 교무실에 가 보자!"]],"ev":["G: Then, why don’t we ask our homeroom teacher?","그럼 우리 담임 선생님께 여쭤보는 게 어때?"],"ow":["오답 ✕ — 소년이 'I saw a post on social media last night.'(어젯밤에 소셜 미디어에서 게시글을 봤어.)라고 했고 'It’s going to be three months long!'(세 달이나 된대!)이라고 했으므로 일치함.","오답 ✕ — 소년이 'my friends are so happy about it'(내 친구들은 그것 때문에 정말 신이 났어)이라고 했으므로 일치함.","오답 ✕ — 소녀가 'That sounds strange.'(그거 이상하게 들리는데.)라고 했으므로 일치함.","오답 ✕ — 소년이 'There’s no information about a long summer vacation on the website.'(홈페이지에는 긴 여름방학에 대한 정보가 없어.)라고 했으므로 정보를 찾지 못했다는 보기는 일치함.","정답 ○ — 소녀가 'why don’t we ask our homeroom teacher?'(담임 선생님께 여쭤보는 게 어때?)라고 했고 소년이 'Let’s go to the teacher’s office tomorrow!'(내일 교무실에 가 보자!)라고 했으므로 전화하는 것이 아니라 교무실에 찾아가는 것이라서 일치하지 않음."],"memo":["정답 ⑤ (일치하지 않는 것): 담임 선생님께 전화하기로 한다(X) → 내일 교무실에 직접 가기로 함.","근거: Let’s go to the teacher’s office tomorrow!(내일 교무실에 가 보자!)","함정: ④ 홈페이지에 정보가 없다는 말은 대화와 일치해서 ✕"],"why":"두 사람은 담임 선생님께 전화하는 것이 아니라 내일 교무실에 가기로 했다."},{"n":5,"q":"위 대화의 주제로 알맞은 것은?","o":["a survey on the length of summer vacation","checking the truth behind a rumor","protecting a personal information","my summer vacation plans","social media etiquette"],"a":1,"ans":"checking the truth behind a rumor","evs":[["G: Hmm, I can’t believe it. We need to check the school website to make sure it’s true.","음, 믿을 수가 없어. 그게 사실인지 확인하려면 학교 홈페이지를 확인해 봐야 해."],["B: There’s no information about a long summer vacation on the website. But I’m still not sure.","홈페이지에는 긴 여름방학에 대한 정보가 없어. 하지만 아직 확실하지는 않아."]],"ev":["G: Hmm, I can’t believe it. We need to check the school website to make sure it’s true.","음, 믿을 수가 없어. 그게 사실인지 확인하려면 학교 홈페이지를 확인해 봐야 해."],"ow":["오답 ✕ — 설문 조사에 관한 말은 대화에 전혀 없음. 소년이 'I saw a post on social media'(소셜 미디어에서 게시글을 봤어)라고 했을 뿐이라서 틀림.","정답 ○ — 소문을 듣고 소녀가 'We need to check the school website to make sure it’s true.'(사실인지 확인하려면 홈페이지를 봐야 해.)라 하고 담임 선생님께도 물어보기로 했으므로 소문의 진실 확인하기가 주제임.","오답 ✕ — 개인 정보 보호에 대한 이야기는 대화에 없음. 두 사람은 'Everyone’s sharing it'(모두 릿)이라는 특정 소문을 의심하는 내용이라서 틀림.","오답 ✕ — 가짜 뉴스의 영향에 대한 내용은 없음. 이 부분은 소문이 이상하다고 보고 'Why don't we look into it together'(같이 조사해 보자)라고 하는 단계라서 틀림.","오답 ✕ — 초콜릿 메뉴가 화제이긴 하지만, 학생들이 초콜릿을 좋아한다는 말은 없고 뉴스를 의심하는 것이 중심이라서 틀림.","오답 ✕ — 'News that causes strong feelings can be fake.'(강한 감정을 불러일으키는 뉴스는 가짜일 수 있어.)가 나오지만 그 이유를 설명하는 글은 아니라서 틀림.","정답 ○ — 'But doesn't the news sound strange? I need to check this out.'(그 뉴스 좀 이상하지 않아? 내가 확인해 봐야겠어.)라고 했으므로 초콜릿 점심 메뉴 뉴스에 대한 의심이 제목으로 알맞음."],"memo":["정답 ⑤: Doubts About the Chocolate Lunch Menu News(초콜릿 점심 메뉴 뉴스에 대한 의심)","근거: But doesn't the news sound strange? I need to check this out.(그 뉴스 좀 이상하지 않아? 내가 확인해 봐야겠어.)","함정: ①은 가짜 뉴스 자체의 정의가 아니라 이 소문에 대한 의심이 중심이라서 ✕"],"why":"초콜릿 점심 메뉴 소식을 이상하게 여기고 확인하려는 내용이다."},{"n":7,"q":"윗글의 내용을 요약할 때, 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["strange - check","boring - ignore","scary - share","great - eat","strange - believe"],"a":0,"ans":"strange - check","evs":[["But doesn't the news sound strange?","그런데 그 뉴스 좀 이상하지 않아?"],["I need to check this out.","내가 확인해 봐야겠어."]],"ev":["But doesn't the news sound strange?","그런데 그 뉴스 좀 이상하지 않아?"],"ow":["정답 ○ — Grong이 'doesn't the news sound strange?'(그 뉴스 좀 이상하지 않아?)라고 했고 'I need to check this out.'(내가 확인해 봐야겠어.)라고 했으므로 strange - check가 맞음.","오답 ✕ — 'sound strange'(이상하게 들려)라고 했지 지루하다(boring)는 말이 아니고, 'I need to check this out'(확인해 봐야겠어)이라며 무시하지(ignore) 않으므로 틀림.","오답 ✕ — 무섭다(scary)는 말은 글에 없고, 'check this out'(확인하다)이라고 했지 공유하는(share) 것이 아니라서 틀림.","오답 ✕ — Grong은 뉴스가 이상하다고 했지 멋지다(great)고 하지 않았고 먹는다(eat)는 말도 없어서 틀림.","오답 ✕ — (A) strange는 맞지만 (B) believe가 틀림. Grong은 믿는 것이 아니라 'I need to check this out.'(확인해 봐야겠어.)라고 했으므로 틀림."],"memo":["정답 ①: strange - check","근거: doesn't the news sound strange? / I need to check this out.(뉴스가 이상하지 않아? / 확인해 봐야겠어.)","함정: ⑤ 믿는(believe) 것이 아니라 확인하는(check) 것이라서 ✕"],"why":"Grong은 초콜릿 메뉴 뉴스를 이상하게 여겨 확인하기로 한다.","sum":"Everyone is talking about the chocolate lunch menu, but Grong thinks the news sounds (A)______ and decides to (B)______ it out.","lab":"요약문 완성"
