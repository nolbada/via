var D=[{"n":1,"tag":null,"en":"In the early 1900s, many people explored newly lands. Ernest Shackleton was one of they.","ko":"1900년대 초, 많은 사람들이 새로운 땅을 탐험했다. Ernest Shackleton은 그들 중 한 명이었다.","ok":false,"foot":[],"fixes":[{"wrong":"newly","right":"new","partial":false,"at":[7],"point":"형용사와 부사: 명사 lands 앞에는 형용사 new 사용","topic":"형용사와 부사","memo":"명사 lands 앞에는 형용사 new 사용"},{"wrong":"they","right":"them","partial":false,"at":[14],"point":"인칭대명사의 격: 전치사 of 뒤에는 목적격 them 사용","topic":"인칭대명사의 격","memo":"전치사 of 뒤에는 목적격 them 사용"}]},{"n":2,"tag":null,"en":"He headed for Antarctica with a team of 28 man in August 1914.","ko":"그는 1914년 8월에 28명의 팀원들로 구성된 팀과 함께 남극 대륙으로 향했다.","ok":false,"foot":[],"fixes":[{"wrong":"man","right":"men","partial":false,"at":[9],"point":"불규칙 복수형: 28 뒤에는 복수 men 사용","topic":"불규칙 복수형","memo":"28 뒤에는 복수 men 사용"}]},{"n":3,"tag":null,"en":"On January 20, 1915, Shackleton's team was crossing the sea near Antarctica. Suddenly, the ship hit thick ice and got stucked.","ko":"1915년 1월 20일, Shackleton의 팀은 남극 대륙 근처 바다를 건너고 있었다. 갑자기 배가 두꺼운 얼음에 부딪혔고 갇혀버렸다.","ok":false,"foot":[],"fixes":[{"wrong":"stucked","right":"stuck","partial":false,"at":[20],"point":"불규칙 과거분사: get stuck: stuck은 stucked가 아님","topic":"불규칙 과거분사","memo":"get stuck: stuck은 stucked가 아님"}]},{"n":4,"tag":null,"en":"The men had to wait until the winter passed.","ko":"사람들은 겨울이 지나갈 때까지 기다려야 했다.","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":"1915.10 · 얼음에 갇힘","en":"Nine long months passed and the ice started melt. But, the ice broke the ship into pieces.","ko":"아홉 달이라는 긴 시간이 지나고 얼음이 녹기 시작했다. 하지만 얼음이 배를 산산조각 냈다.","ok":false,"foot":[],"fixes":[{"wrong":"melt","right":"melting","partial":false,"at":[8],"point":"동명사/to부정사: start 뒤에는 melting 또는 to melt 사용","topic":"동명사/to부정사","memo":"start 뒤에는 melting 또는 to melt 사용"}]},{"n":6,"tag":null,"en":"The ship started sinking. I ordered me men, \"Give up the ship.","ko":"배는 가라앉기 시작했다. 나는 팀원들에게 명령했다. \"그 배를 포기해라.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"my","partial":false,"at":[6],"point":"인칭대명사의 격: 명사 앞 소유격 my 사용","topic":"인칭대명사의 격","memo":"명사 앞 소유격 my 사용"}]},{"n":7,"tag":null,"en":"She's going down!\"","ko":"배가 가라앉고 있다!\"","ok":true,"foot":[],"fixes":[]},{"n":8,"tag":"1915.11 · 배가 가라앉음","en":"The ship has sank under the water today. We lost our home and we had to made a camp on the ice.","ko":"오늘 배가 물속에 가라앉아 버렸다. 우리는 집을 잃었고 얼음 위에 캠프를 만들어야 했다.","ok":false,"foot":[],"fixes":[{"wrong":"sank","right":"sunk","partial":false,"at":[3],"point":"현재완료: has 뒤에는 과거분사 sunk 사용","topic":"현재완료","memo":"has 뒤에는 과거분사 sunk 사용"},{"wrong":"made","right":"make","partial":false,"at":[16],"point":"to부정사: to 뒤 동사원형: make (made 아님)","topic":"to부정사","memo":"to 뒤 동사원형: make (made 아님)"}]},{"n":9,"tag":null,"en":"All I can do is to keep strongly for my men. My dream to go to Antarctica is broken, but I've set a new goal.","ko":"내가 할 수 있는 전부는 내 팀원들을 위해 강하게 버티는 것이다. 남극 대륙으로 가려던 나의 꿈은 깨졌지만, 나는 새로운 목표 하나를 세웠다.","ok":false,"foot":[],"fixes":[{"wrong":"strongly","right":"strong","partial":false,"at":[7],"point":"형용사와 부사: keep 뒤 보어 자리에는 형용사 strong 사용","topic":"형용사와 부사","memo":"keep 뒤 보어 자리에는 형용사 strong 사용"}]},{"n":10,"tag":null,"en":"I'll make my men to return home safely.","ko":"나는 내 팀원들이 안전하게 집으로 돌아갈 수 있도록 할 것이다.","ok":false,"foot":[],"fixes":[{"wrong":"to return","right":"return","partial":false,"at":[4],"point":"사역동사: make 뒤 목적보어는 원형 return 사용","topic":"사역동사","memo":"make 뒤 목적보어는 원형 return 사용"}]},{"n":11,"tag":"1916.4.15 · 섬 도착","en":"I had my men get on the three lifeboat to go at Elephant Island. We got to the island today.","ko":"Elephant Island에 가기 위해 나는 팀원들을 세 척의 구명보트에 타도록 했다. 우리는 오늘 그 섬에 도착했다.","ok":false,"foot":[],"fixes":[{"wrong":"lifeboat","right":"lifeboats","partial":false,"at":[8],"point":"명사의 복수형: three 뒤에는 복수 lifeboats 사용","topic":"명사의 복수형","memo":"three 뒤에는 복수 lifeboats 사용"},{"wrong":"at","right":"to","partial":false,"at":[11],"point":"기본전치사: '~로 가다'는 go to 사용","topic":"기본전치사","memo":"'~로 가다'는 go to 사용"}]},{"n":12,"tag":null,"en":"It took we 7 days on the sea to get to the island. And after 497 days, we finally standed on land again.","ko":"그 섬에 도착하는 데 우리는 바다 위에서 7일을 보냈다. 그리고 497일이 지난 후에야 우리는 마침내 땅 위에 다시 섰다.","ok":false,"foot":[],"fixes":[{"wrong":"we","right":"us","partial":false,"at":[2],"point":"인칭대명사의 격: 동사 took 뒤에는 목적격 us 사용","topic":"인칭대명사의 격","memo":"동사 took 뒤에는 목적격 us 사용"},{"wrong":"standed","right":"stood","partial":false,"at":[19],"point":"불규칙 과거형: stand의 과거형은 stood (standed 아님)","topic":"불규칙 과거형","memo":"stand의 과거형은 stood (standed 아님)"}]},{"n":13,"tag":null,"en":"But, there is no help on this island. There is few food to eat and the weather is so cold.","ko":"하지만 이 섬에서는 어떤 도움도 얻을 수 없다. 먹을 음식도 거의 없고 날씨는 매우 춥다.","ok":false,"foot":[],"fixes":[{"wrong":"few","right":"little","partial":false,"at":[10],"point":"수량 형용사: 셀 수 없는 food 앞에는 little 사용","topic":"수량 형용사","memo":"셀 수 없는 food 앞에는 little 사용"}]},{"n":14,"tag":"1916.4.24 · 출발 결심","en":"We can get help in South Georgia. The island is 1,300 kilometer away and a sea of death is in front for us.","ko":"우리는 South Georgia에서 도움을 받을 수 있다. 그 섬은 1,300 킬로미터나 떨어져 있고 죽음의 바다가 우리 앞에 있다.","ok":false,"foot":[],"fixes":[{"wrong":"kilometer","right":"kilometers","partial":false,"at":[11],"point":"명사의 복수형: 1,300 뒤에는 복수 kilometers 사용","topic":"명사의 복수형","memo":"1,300 뒤에는 복수 kilometers 사용"},{"wrong":"for","right":"of","partial":false,"at":[21],"point":"기본전치사: '~ 앞에'는 in front of 사용","topic":"기본전치사","memo":"'~ 앞에'는 in front of 사용"}]},{"n":15,"tag":null,"en":"But I should do this for my men. I set out for South Georgia today.","ko":"하지만 나의 팀원들을 위해 나는 이것을 해야 한다. 나는 오늘 South Georgia를 향해 떠난다.","ok":true,"foot":[],"fixes":[]}];var PP=[["In the early 1900s, many people explored new lands.","1900년대 초, 많은 사람들이 새로운 땅을 탐험했다.",1],["Ernest Shackleton was one of them.","Ernest Shackleton은 그들 중 한 명이었다.",0],["He headed for Antarctica with a team of 28 men in August 1914.","그는 1914년 8월에 28명의 팀원들로 구성된 팀과 함께 남극 대륙으로 향했다.",0],["On January 20, 1915, Shackleton's team was crossing the sea near Antarctica.","1915년 1월 20일, Shackleton의 팀은 남극 대륙 근처 바다를 건너고 있었다.",1],["Suddenly, the ship hit thick ice and got stuck.","갑자기 배가 두꺼운 얼음에 부딪혔고 갇혀버렸다.",0],["The men had to wait until the winter passed.","사람들은 겨울이 지나갈 때까지 기다려야 했다.",0],["October 28th, 1915","1915년 10월 28일",1],["Nine long months passed and the ice started melting.","아홉 달이라는 긴 시간이 지나고 얼음이 녹기 시작했다.",1],["But, the ice broke the ship into pieces.","하지만 얼음이 배를 산산조각 냈다.",0],["The ship started sinking.","배는 가라앉기 시작했다.",0],["I ordered my men, \"Give up the ship.","나는 팀원들에게 명령했다. \"그 배를 포기해라.",0],["She's going down!\"","배가 가라앉고 있다!\"",0],["November 21st, 1915","1915년 11월 21일",1],["The ship has sunk under the water today.","오늘 배가 물속에 가라앉아 버렸다.",1],["We lost our home and we had to make a camp on the ice.","우리는 집을 잃었고 얼음 위에 캠프를 만들어야 했다.",0],["All I can do is to keep strong for my men.","내가 할 수 있는 전부는 내 팀원들을 위해 강하게 버티는 것이다.",0],["My dream to go to Antarctica is broken, but I've set a new goal.","남극 대륙으로 가려던 나의 꿈은 깨졌지만, 나는 새로운 목표 하나를 세웠다.",0],["I'll make my men return home safely.","나는 내 팀원들이 안전하게 집으로 돌아갈 수 있도록 할 것이다.",0],["April 15th, 1916","1916년 4월 15일",1],["I had my men get on the three lifeboats to go to Elephant Island.","Elephant Island에 가기 위해 나는 팀원들을 세 척의 구명보트에 타도록 했다.",1],["We got to the island today.","우리는 오늘 그 섬에 도착했다.",0],["It took us 7 days on the sea to get to the island.","그 섬에 도착하는 데 우리는 바다 위에서 7일을 보냈다.",0],["And after 497 days, we finally stood on land again.","그리고 497일이 지난 후에야 우리는 마침내 땅 위에 다시 섰다.",0],["But, there is no help on this island.","하지만 이 섬에서는 어떤 도움도 얻을 수 없다.",0],["There is little food to eat and the weather is so cold.","먹을 음식도 거의 없고 날씨는 매우 춥다.",0],["April 24th, 1916","1916년 4월 24일",1],["We can get help in South Georgia.","우리는 South Georgia에서 도움을 받을 수 있다.",1],["The island is 1,300 kilometers away and a sea of death is in front of us.","그 섬은 1,300 킬로미터나 떨어져 있고 죽음의 바다가 우리 앞에 있다.",0],["But I should do this for my men.","하지만 나의 팀원들을 위해 나는 이것을 해야 한다.",0],["I set out for South Georgia today.","나는 오늘 South Georgia를 향해 떠난다.",0]];var RNUM=37;var TITLE_EN="Great Failure";var PASS_EN=["Great Failure","In the early 1900s, many people explored new lands. Ernest Shackleton was one of them. He headed for Antarctica with a team of 28 men in August 1914.","On January 20, 1915, Shackleton's team was crossing the sea near Antarctica. Suddenly, the ship hit thick ice and got stuck. The men had to wait until the winter passed.","October 28th, 1915","Nine long months passed and the ice started melting. But, the ice broke the ship into pieces. The ship started sinking. I ordered my men, \"Give up the ship. She's going down!\"","November 21st, 1915","The ship has sunk under the water today. We lost our home and we had to make a camp on the ice. All I can do is to keep strong for my men. My dream to go to Antarctica is broken, but I've set a new goal. I'll make my men return home safely.","April 15th, 1916","I had my men get on the three lifeboats to go to Elephant Island. We got to the island today. It took us 7 days on the sea to get to the island. And after 497 days, we finally stood on land again. But, there is no help on this island. There is little food to eat and the weather is so cold.","April 24th, 1916","We can get help in South Georgia. The island is 1,300 kilometers away and a sea of death is in front of us. But I should do this for my men. I set out for South Georgia today."];var PASS_KO=["위대한 실패","1900년대 초, 많은 사람들이 새로운 땅을 탐험했다. Ernest Shackleton은 그들 중 한 명이었다. 그는 1914년 8월에 28명의 팀원들로 구성된 팀과 함께 남극 대륙으로 향했다.","1915년 1월 20일, Shackleton의 팀은 남극 대륙 근처 바다를 건너고 있었다. 갑자기 배가 두꺼운 얼음에 부딪혔고 갇혀버렸다. 사람들은 겨울이 지나갈 때까지 기다려야 했다.","1915년 10월 28일","아홉 달이라는 긴 시간이 지나고 얼음이 녹기 시작했다. 하지만 얼음이 배를 산산조각 냈다. 배는 가라앉기 시작했다. 나는 팀원들에게 명령했다. \"그 배를 포기해라. 배가 가라앉고 있다!\"","1915년 11월 21일","오늘 배가 물속에 가라앉아 버렸다. 우리는 집을 잃었고 얼음 위에 캠프를 만들어야 했다. 내가 할 수 있는 전부는 내 팀원들을 위해 강하게 버티는 것이다. 남극 대륙으로 가려던 나의 꿈은 깨졌지만, 나는 새로운 목표 하나를 세웠다. 나는 내 팀원들이 안전하게 집으로 돌아갈 수 있도록 할 것이다.","1916년 4월 15일","Elephant Island에 가기 위해 나는 팀원들을 세 척의 구명보트에 타도록 했다. 우리는 오늘 그 섬에 도착했다. 그 섬에 도착하는 데 우리는 바다 위에서 7일을 보냈다. 그리고 497일이 지난 후에야 우리는 마침내 땅 위에 다시 섰다. 하지만 이 섬에서는 어떤 도움도 얻을 수 없다. 먹을 음식도 거의 없고 날씨는 매우 춥다.","1916년 4월 24일","우리는 South Georgia에서 도움을 받을 수 있다. 그 섬은 1,300 킬로미터나 떨어져 있고 죽음의 바다가 우리 앞에 있다. 하지만 나의 팀원들을 위해 나는 이것을 해야 한다. 나는 오늘 South Georgia를 향해 떠난다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["남자가 피아노 대회에 나갈 계획","남자의 피아노 대회 결과와 그에 대한 위로","여자가 피아노를 배우는 방법","남자가 대회에 나가지 않은 이유","여자의 피아노 연주 실수"],"a":1,"ans":"남자의 피아노 대회 결과와 그에 대한 위로","evs":[["M: I didn't do very well.","별로 잘하지 못했어."],["W: Don't worry. You'll do better next time.","걱정하지 마. 다음에는 더 잘할 거야."]],"ev":["M: I didn't do very well.","별로 잘하지 못했어."],"ow":["오답 ✕ — 'How did you do in the piano contest?'(피아노 대회에서 어떻게 했어?)처럼 이미 끝난 대회에 대한 이야기이다. 앞으로 나갈 계획 이야기는 아니다.","정답 ○ — 남자가 'I didn't do very well.'(별로 잘하지 못했어.)라고 했고 여자가 'Don't worry. You'll do better next time.'(걱정하지 마. 다음에는 더 잘할 거야.)라고 위로했으므로 맞다.","오답 ✕ — 피아노를 배우는 사람은 여자가 아니다. 여자는 대회 결과를 묻고 위로할 뿐이다.","오답 ✕ — 남자는 'I made too many mistakes.'(실수를 너무 많이 했어.)라고 했으므로 대회에 나갔다. 나가지 않은 이유가 아니다.","오답 ✕ — 실수를 한 사람은 여자가 아니라 남자이다. 남자가 'I made too many mistakes.'(실수를 너무 많이 했어.)라고 말했다."],"memo":["정답 ②: 남자의 피아노 대회 결과와 그에 대한 위로","근거: I didn't do very well. / You'll do better next time.(별로 잘하지 못했어. / 다음에는 더 잘할 거야.)","함정: ⑤ 실수한 사람은 여자가 아니라 남자이다. ✕"],"why":"남자가 피아노 대회를 잘 못 봐서 여자가 위로해 주는 대화이다."}],"dlg":[["W","How did you do in the piano contest?","피아노 대회에서 어떻게 했어?"],["M","I didn't do very well.","별로 잘하지 못했어."],["W","You practiced a lot. What happened?","너 연습 많이 했잖아. 무슨 일이 있었어?"],["M","I made too many mistakes.","실수를 너무 많이 했어."],["W","Don't worry. You'll do better next time.","걱정하지 마. 다음에는 더 잘할 거야."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Kate thinks today's school play was terrible.","The man thinks Kate's performance was great during the last practice.","Kate couldn't remember her lines from the beginning.","The man encourages Kate because anyone can make mistakes.","Kate hopes to do better next time."] 아니라 부서졌다. 불일치 문제이니 틀린 것을 고른다."],"why":"얼음이 배를 부수는 바람에 배가 탈출한 것이 아니라 가라앉기 시작했다."},{"n":7,"q":"다음은 윗글을 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["stuck - sinking","free - sinking","stuck - floating","lost - melting","safe - returning"],"a":0,"ans":"stuck - sinking","evs":[["Suddenly, the ship hit thick ice and got stuck.","갑자기 배가 두꺼운 얼음에 부딪혔고 갇혀버렸다."],["The ship started sinking.","배는 가라앉기 시작했다."]],"ev":["Suddenly, the ship hit thick ice and got stuck.","갑자기 배가 두꺼운 얼음에 부딪혔고 갇혀버렸다."],"ow":["정답 ○ — 'the ship hit thick ice and got stuck'(배가 두꺼운 얼음에 부딪혀 갇혀버렸다)와 'The ship started sinking.'(배는 가라앉기 시작했다.)이므로 stuck - sinking이다.","오답 ✕ — (B) sinking은 맞지만 (A) free(자유로운)는 틀리다. 배는 'got stuck'(갇혀버렸다) 상태였다.","오답 ✕ — (A) stuck은 맞지만 (B) floating(떠 있는)은 틀리다. 'The ship started sinking.'(배는 가라앉기 시작했다.)이므로 가라앉았다.","오답 ✕ — 배가 길을 잃은(lost) 것이 아니라 얼음에 갇혔고, 녹는(melting) 것은 얼음이지 배가 아니다.","오답 ✕ — 배는 안전(safe)하지 않았고, 'Give up the ship. She's going down!'(그 배를 포기해라. 배가 가라앉고 있다!)이므로 돌아가는(returning) 것도 아니다."],"memo":["정답 ①: stuck - sinking","근거: the ship hit thick ice and got stuck / The ship started sinking.(배가 얼음에 갇혔고 가라앉기 시작했다.)","함정: ③ 'floating(떠 있는)'은 가라앉았다는 내용과 반대이다. ✕"],"why":"배가 얼음에 갇혔다가 부서져 가라앉기 시작했다.","sum":"The ship hit thick ice and got (A), and later the ice broke it into pieces, so the ship started (B).","lab":"완성된 요약문 : "}],"pp":[["In the early 1900s, many people explored new lands.","1900년대 초, 많은 사람들이 새로운 땅을 탐험했다."],["Ernest Shackleton was one of them.","Ernest Shackleton은 그들 중 한 명이었다."],["He headed for Antarctica with a team of 28 men in August 1914.","그는 1914년 8월에 28명의 팀원들로 구성된 팀과 함께 남극 대륙으로 향했다."],["On January 20, 1915, Shackleton's team was crossing the sea near Antarctica.","1915년 1월 20일, Shackleton의 팀은 남극 대륙 근처 바다를 건너고 있었다."],["Suddenly, the ship hit thick ice and got stuck.","갑자기 배가 두꺼운 얼음에 부딪혔고 갇혀버렸다."],["The men had to wait until the winter passed.","사람들은 겨울이 지나갈 때까지 기다려야 했다."],["October 28th, 1915","1915년 10월 28일"],["Nine long months passed and the ice started melting."," 워 Elephant Island로 갔다.","Elephant Island에 가는 데 497일이 걸렸다.","Elephant Island에는 먹을 음식이 많았다.","Elephant Island에서 쉽게 도움을 받을 수 있었다.","Elephant Island는 날씨가 따뜻했다."],"a":0,"ans":"팀원들을 세 척의 구명보트에 태워 Elephant Island로 갔다.","evs":[["I had my men get on the three lifeboats to go to Elephant Island.","Elephant Island에 가기 위해 나는 팀원들을 세 척의 구명보트에 타도록 했다."],["But, there is no help on this island.","하지만 이 섬에서는 어떤 도움도 얻을 수 없다."]],"ev":["I had my men get on the three lifeboats to go to Elephant Island.","Elephant Island에 가기 위해 나는 팀원들을 세 척의 구명보트에 타도록 했다."],"ow":["정답 ○ — 'I had my men get on the three lifeboats to go to Elephant Island.'(Elephant Island에 가기 위해 팀원들을 세 척의 구명보트에 타도록 했다.)와 같다.","오답 ✕ — 'It took us 7 days on the sea to get to the island.'(그 섬에 도착하는 데 바다 위에서 7일을 보냈다.)라고 했다. 497일은 배가 갇힌 이후 땅을 밟기까지의 전체 시간이다.","오답 ✕ — 'There is little food to eat'(먹을 음식도 거의 없다)이라고 했으므로 음식이 많았다는 것은 틀리다.","오답 ✕ — 'there is no help on this island'(이 섬에서는 어떤 도움도 얻을 수 없다)이라고 했으므로 도움을 받을 수 없었다.","오답 ✕ — 'the weather is so cold'(날씨는 매우 춥다)라고 했으므로 따뜻하지 않았다."],"memo":["정답 ①: 세 척의 구명보트를 타고 Elephant Island로 갔다.","근거: I had my men get on the three lifeboats to go to Elephant Island.(팀원들을 세 척의 구명보트에 타도록 했다.)","함정: ② 497일이 아니라 바다 위에서 7일이 걸렸다. ✕"],"why":"구명보트 세 척으로 7일 만에 Elephant Island에 도착했지만 도움을 받을 수 없었다."}],"pp":[["April 15th, 1916","1916년 4월 15일"],["I had my men get on the three lifeboats to go to Elephant Island.","Elephant Island에 가기 위해 나는 팀원들을 세 척의 구명보트에 타도록 했다."],["We got to the island today.","우리는 오늘 그 섬에 도착했다."],["It took us 7 days on the sea to get to the island.","그 섬에 도착하는 데 우리는 바다 위에서 7일을 보냈다."],["And after 497 days, we finally stood on land again.","그리고 497일이 지난 후에야 우리는 마침내 땅 위에 다시 섰다."],["But, there is no help on this island.","하지만 이 섬에서는 어떤 도움도 얻을 수 없다."],["There is little food to eat and the weather is so cold.","먹을 음식도 거의 없고 날씨는 매우 춥다."]]},{"qs":[{"n":10,"q":"Shackleton이 South Georgia로 떠나기로 한 이유로 알맞은 것은?","o":["그곳에서 도움을 받아 팀원들을 구하기 위해서","새로운 땅을 탐험하기 위해서","가족을 만나기 위해서","새 배를 만들 재료를 구하기 위해서","겨울이  return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
