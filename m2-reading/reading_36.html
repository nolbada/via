rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Imagine this—you are do your homework at your desk. Suddenly, you remember that your mom asked you call her.","ko":"이런 상상을 해 보세요. 당신은 책상에서 숙제를 하고 있어요. 갑자기 엄마가 당신에게 전화하라고 요청했던 것이 기억나요.","ok":false,"foot":[],"fixes":[{"wrong":"do","right":"doing","partial":false,"at":[3],"point":"현재진행형: be동사 뒤 진행형은 -ing: doing (do 아님)","topic":"현재진행형","memo":"be동사 뒤 진행형은 -ing: doing (do 아님)"},{"wrong":"call","right":"to call","partial":false,"at":[17],"point":"to부정사: ask+목적어 뒤 to부정사: to call (call 아님)","topic":"to부정사","memo":"ask+목적어 뒤 to부정사: to call (call 아님)","alt":[16]}]},{"n":2,"tag":null,"en":"When you pick up your smartphone, a message pops up. It is for an new video from your favorite channel.","ko":"당신이 스마트폰을 집어 들 때, 메시지가 하나 떠요. 그것은 당신이 가장 좋아하는 채널의 새 영상에 대한 것이에요.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[13],"point":"관사 a/an: new는 자음 소리로 시작하므로 a 사용","topic":"관사 a/an","memo":"new는 자음 소리로 시작하므로 a 사용"}]},{"n":3,"tag":null,"en":"You watch the video and keep watching much other short videos. Then, you hear another sound.","ko":"당신은 그 영상을 시청하고 다른 많은 짧은 영상들을 계속 시청해요. 그러자 또 다른 소리가 들려요.","ok":false,"foot":[],"fixes":[{"wrong":"much","right":"many","partial":false,"at":[7],"point":"수량 형용사 many/much: 복수명사 videos 앞에는 many 사용","topic":"수량 형용사 many/much","memo":"복수명사 videos 앞에는 many 사용"}]},{"n":4,"tag":null,"en":"There is a sale on the shoes that you real want. You were going to ask your mom to buy them for you.","ko":"당신이 정말 갖고 싶은 신발이 할인 판매 중이에요. 당신은 엄마에게 그것을 사 달라고 부탁하려고 했었죠.","ok":false,"foot":[],"fixes":[{"wrong":"real","right":"really","partial":false,"at":[9],"point":"형용사와 부사: 동사 want를 꾸미는 말은 부사 really 사용","topic":"형용사와 부사","memo":"동사 want를 꾸미는 말은 부사 really 사용"}]},{"n":5,"tag":null,"en":"Wait, you forgot to call her two hour ago! If this story feels like your, you may have \"popcorn brain.\"","ko":"잠깐, 두 시간 전에 엄마에게 전화하는 것을 잊었네요! 만약 이 이야기가 당신의 이야기처럼 느껴진다면, 당신은 ‘팝콘 브레인’을 가지고 있을지도 몰라요.","ok":false,"foot":[],"fixes":[{"wrong":"hour","right":"hours","partial":false,"at":[7],"point":"명사의 복수형: two 뒤에는 복수명사 hours 사용","topic":"명사의 복수형","memo":"two 뒤에는 복수명사 hours 사용"},{"wrong":"your","right":"yours","partial":false,"at":[14],"point":"소유대명사: 뒤에 명사가 없으므로 소유대명사 yours 사용","topic":"소유대명사","memo":"뒤에 명사가 없으므로 소유대명사 yours 사용"}]},{"n":6,"tag":null,"en":"It is easy to experience popcorn brain when you does many things in the same time on your smartphone.","ko":"당신이 스마트폰으로 동시에 많은 일을 할 때 팝콘 브레인을 경험하기 쉬워요.","ok":false,"foot":[],"fixes":[{"wrong":"does","right":"do","partial":false,"at":[9],"point":"일반동사의 수일치: 주어 you에는 do: do (does 아님)","topic":"일반동사의 수일치","memo":"주어 you에는 do: do (does 아님)"},{"wrong":"in","right":"at","partial":false,"at":[12],"point":"기본전치사: at the same time: at (in 아님)","topic":"기본전치사","memo":"at the same time: at (in 아님)"}]},{"n":7,"tag":null,"en":"You keep moving down the screen and clicking, and many thoughts pop up quick, like popcorn in an pan!","ko":"당신이 계속 화면을 아래로 내리고 클릭하면, 마치 팬에 있는 팝콘처럼 많은 생각들이 빠르게 튀어나와요!","ok":false,"foot":[],"fixes":[{"wrong":"quick","right":"quickly","partial":false,"at":[13],"point":"형용사와 부사: 동사 pop up을 꾸미는 말은 부사 quickly 사용","topic":"형용사와 부사","memo":"동사 pop up을 꾸미는 말은 부사 quickly 사용"},{"wrong":"an","right":"a","partial":false,"at":[17],"point":"관사 a/an: pan은 자음 소리로 시작하므로 a 사용","topic":"관사 a/an","memo":"pan은 자음 소리로 시작하므로 a 사용"}]},{"n":8,"tag":null,"en":"If it happens at night, you may have trouble sleeping.","ko":"만약 이것이 밤에 일어나면, 당신은 잠드는 게 어려울지도 몰라요.","ok":true,"foot":[],"fixes":[]},{"n":9,"tag":null,"en":"More importantly, people with popcorn brain have trouble paying attentions. They cannot concentrate on one thing for a long time.","ko":"더 중요한 것은, 팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪어요. 그들은 한 가지 일에 오랜 시간 동안 집중할 수 없어요.","ok":false,"foot":[],"fixes":[{"wrong":"attentions","right":"attention","partial":false,"at":[9],"point":"셀 수 없는 명사: attention은 셀 수 없는 명사라 복수형 불가","topic":"셀 수 없는 명사","memo":"attention은 셀 수 없는 명사라 복수형 불가"}]},{"n":10,"tag":null,"en":"In a study, people was able to focus on one thing for 2.5 minutes in 2004. Nowadays, people can only concentrate for 47 second.","ko":"한 연구에서, 2004년에는 사람들이 한 가지 일에 2분 30초 동안 집중할 수 있었어요. 요즘에는 사람들이 단지 47초 동안만 집중할 수 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"was","right":"were","partial":false,"at":[4],"point":"be동사의 수일치: 주어 people(복수)에는 were 사용","topic":"be동사의 수일치","memo":"주어 people(복수)에는 were 사용"},{"wrong":"second","right":"seconds","partial":false,"at":[23],"point":"명사의 복수형: 47 뒤에는 복수명사 seconds 사용","topic":"명사의 복수형","memo":"47 뒤에는 복수명사 seconds 사용"}]},{"n":11,"tag":null,"en":"If you do not want to have popcorn brain, you need to make some changes. Here are some tips.","ko":"당신이 팝콘 브레인을 가지고 싶지 않다면 변화를 좀 줄 필요가 있어요. 여기에 몇 가지 조언이 있어요.","ok":true,"foot":[],"fixes":[]}];var PP=[["Imagine this—you are doing your homework at your desk.","이런 상상을 해 보세요. 당신은 책상에서 숙제를 하고 있어요.",1],["Suddenly, you remember that your mom asked you to call her.","갑자기 엄마가 당신에게 전화하라고 요청했던 것이 기억나요.",0],["When you pick up your smartphone, a message pops up.","당신이 스마트폰을 집어 들 때, 메시지가 하나 떠요.",0],["It is for a new video from your favorite channel.","그것은 당신이 가장 좋아하는 채널의 새 영상에 대한 것이에요.",0],["You watch the video and keep watching many other short videos.","당신은 그 영상을 시청하고 다른 많은 짧은 영상들을 계속 시청해요.",0],["Then, you hear another sound.","그러자 또 다른 소리가 들려요.",0],["There is a sale on the shoes that you really want.","당신이 정말 갖고 싶은 신발이 할인 판매 중이에요.",0],["You were going to ask your mom to buy them for you.","당신은 엄마에게 그것을 사 달라고 부탁하려고 했었죠.",0],["Wait, you forgot to call her two hours ago!","잠깐, 두 시간 전에 엄마에게 전화하는 것을 잊었네요!",0],["If this story feels like yours, you may have \"popcorn brain.\"","만약 이 이야기가 당신의 이야기처럼 느껴진다면, 당신은 ‘팝콘 브레인’을 가지고 있을지도 몰라요.",0],["It is easy to experience popcorn brain when you do many things at the same time on your smartphone.","당신이 스마트폰으로 동시에 많은 일을 할 때 팝콘 브레인을 경험하기 쉬워요.",1],["You keep moving down the screen and clicking, and many thoughts pop up quickly, like popcorn in a pan!","당신이 계속 화면을 아래로 내리고 클릭하면, 마치 팬에 있는 팝콘처럼 많은 생각들이 빠르게 튀어나와요!",0],["If it happens at night, you may have trouble sleeping.","만약 이것이 밤에 일어나면, 당신은 잠드는 게 어려울지도 몰라요.",0],["More importantly, people with popcorn brain have trouble paying attention.","더 중요한 것은, 팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪어요.",1],["They cannot concentrate on one thing for a long time.","그들은 한 가지 일에 오랜 시간 동안 집중할 수 없어요.",0],["In a study, people were able to focus on one thing for 2.5 minutes in 2004. Nowadays, people can only concentrate for 47 seconds.","한 연구에서, 2004년에는 사람들이 한 가지 일에 2분 30초 동안 집중할 수 있었어요. 요즘에는 사람들이 단지 47초 동안만 집중할 수 있어요.",0],["If you do not want to have popcorn brain, you need to make some changes.","당신이 팝콘 브레인을 가지고 싶지 않다면 변화를 좀 줄 필요가 있어요.",0],["Here are some tips.","여기에 몇 가지 조언이 있어요.",0]];var RNUM=36;var TITLE_EN="Do You Have Popcorn Brain?";var PASS_EN=["Do You Have Popcorn Brain?","Imagine this—you are doing your homework at your desk. Suddenly, you remember that your mom asked you to call her. When you pick up your smartphone, a message pops up. It is for a new video from your favorite channel. You watch the video and keep watching many other short videos. Then, you hear another sound. There is a sale on the shoes that you really want. You were going to ask your mom to buy them for you. Wait, you forgot to call her two hours ago! If this story feels like yours, you may have \"popcorn brain.\"","It is easy to experience popcorn brain when you do many things at the same time on your smartphone. You keep moving down the screen and clicking, and many thoughts pop up quickly, like popcorn in a pan! If it happens at night, you may have trouble sleeping.","More importantly, people with popcorn brain have trouble paying attention. They cannot concentrate on one thing for a long time. In a study, people were able to focus on one thing for 2.5 minutes in 2004. Nowadays, people can only concentrate for 47 seconds. If you do not want to have popcorn brain, you need to make some changes. Here are some tips."];var PASS_KO=["당신은 팝콘 브레인을 가지고 있나요?","이런 상상을 해 보세요. 당신은 책상에서 숙제를 하고 있어요. 갑자기 엄마가 당신에게 전화하라고 요청했던 것이 기억나요. 당신이 스마트폰을 집어 들 때, 메시지가 하나 떠요. 그것은 당신이 가장 좋아하는 채널의 새 영상에 대한 것이에요. 당신은 그 영상을 시청하고 다른 많은 짧은 영상들을 계속 시청해요. 그러자 또 다른 소리가 들려요. 당신이 정말 갖고 싶은 신발이 할인 판매 중이에요. 당신은 엄마에게 그것을 사 달라고 부탁하려고 했었죠. 잠깐, 두 시간 전에 엄마에게 전화하는 것을 잊었네요! 만약 이 이야기가 당신의 이야기처럼 느껴진다면, 당신은 ‘팝콘 브레인’을 가지고 있을지도 몰라요.","당신이 스마트폰으로 동시에 많은 일을 할 때 팝콘 브레인을 경험하기 쉬워요. 당신이 계속 화면을 아래로 내리고 클릭하면, 마치 팬에 있는 팝콘처럼 많은 생각들이 빠르게 튀어나와요! 만약 이것이 밤에 일어나면, 당신은 잠드는 게 어려울지도 몰라요.","더 중요한 것은, 팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪어요. 그들은 한 가지 일에 오랜 시간 동안 집중할 수 없어요. 한 연구에서, 2004년에는 사람들이 한 가지 일에 2분 30초 동안 집중할 수 있었어요. 요즘에는 사람들이 단지 47초 동안만 집중할 수 있어요. 당신이 팝콘 브레인을 가지고 싶지 않다면 변화를 좀 줄 필요가 있어요. 여기에 몇 가지 조언이 있어요."];var DG=[{"qs":[{"n":1,"q":"다음 담화를 읽고 답할 수 없는 질문은?","o":["When does the English speech contest begin?","Where will the contest be held?","What should students speak about at the contest?","How long should students speak at the contest?","What is the email address for handing out the file?"],"a":4,"ans":"What is the email address for handing out the file?","evs":[["W: It starts on July 2 at 3 p.m. in the Language Hall.","7월 2일 오후 3시에 어학관에서 시작합니다."],["W: Don't forget to email your presentation file by tonight.","오늘 밤까지 발표 파일을 이메일로 보내는 것을 잊지 마세요."]],"ev":["W: It starts on July 2 at 3 p.m. in the Language Hall.","7월 2일 오후 3시에 어학관에서 시작합니다."],"ow":["오답 ✕ — 답할 수 있는 질문이다. 'It starts on July 2 at 3 p.m.'(7월 2일 오후 3시에 시작합니다.)라고 했다. 답할 수 없는 질문을 고르는 문제의 답이 아님.","오답 ✕ — 답할 수 있는 질문이다. 'in the Language Hall'(어학관에서)이라고 했다. 답할 수 없는 질문을 고르는 문제의 답이 아님.","오답 ✕ — 답할 수 있는 질문이다. 'The topic is technology in our lives.'(주제는 우리 삶 속의 기술입니다.)라고 했다. 답할 수 없는 질문을 고르는 문제의 답이 아님.","오답 ✕ — 답할 수 있는 질문이다. 'Speeches should be 3 to 5 minutes long.'(발표는 3분에서 5분 길이여야 합니다.)라고 했다. 답할 수 없는 질문을 고르는 문제의 답이 아님.","정답 ○ — 'Don't forget to email your presentation file by tonight.'(오늘 밤까지 발표 파일을 이메일로 보내세요.)라고만 했을 뿐 이메일 주소는 담화에 나오지 않아 답할 수 없음."],"memo":["정답 ⑤: 파일을 보낼 이메일 주소는 무엇인가? (담화에 없음)","근거: Don't forget to email your presentation file by tonight.(오늘 밤까지 발표 파일을 이메일로 보내세요.)","함정: 이메일을 '보내라'는 말은 있어도 '주소'는 없다."],"why":"이메일로 파일을 보내라는 말은 있지만 이메일 주소는 나오지 않는다."}],"dlg":[["W","May I have your attention, please?","잠시 주목해 주시겠어요?"],["W","This is your English teacher, Ms. Seo.","영어 선생님인 서 선생님입니다."],["W","This is a reminder about the English speech contest.","영어 말하기 대회에 대한 안내입니다."],["W","It starts on July 2 at 3 p.m. in the Language Hall.","7월 2일 오후 3시에 어학관에서 시작합니다."],["W","Make sure you are on time.","꼭 시간을 지켜 주세요."],["W","The topic is technology in our lives.","주제는 우리 삶 속의 기술입니다."],["W","Speeches should be 3 to 5 minutes long.","발표는 3분에서 5분 길이여야 합니다."],["W","Don't forget to email your presentation file by tonight.","오늘 밤까지 발표 파일을 이메일로 보내는 것을 잊지 마세요."],["W","Thank you.","감사합니다."]]},{"qs":[{"n":2,"q":"위 대화의 주제로 알맞은 것은?","o":["스마트폰 사용 금지 명령","늦게 자는 것의 부정적 영향","Henry의 스마트폰 중독 문제","Henry의 수면 문제에 대한 조언","주말 스마트폰 사용 요구와 허가"],"a":3,"ans":"Henry의 수면 문제에 대한 조언","evs":[["W: You seem to go to bed late these days. Are you okay?","요즘 늦게 자는 것 같구나. 괜찮니?"],["W: Oh, boy. You need to stop using your smartphone after 10 p.m.","이런. 밤 10시 이후에는 스마트폰 사용을 멈춰야 해."]],"ev":["W: You seem to go to bed late these days. Are you okay?","요즘 늦게 자는 것 같구나. 괜찮니?"],"ow":["오답 ✕ — 엄마가 'You need to stop using your smartphone after 10 p.m.'(밤 10시 이후에는 스마트폰 사용을 멈춰야 해.)라고 했지만, 대화 전체는 명령이 아니라 수면 문제에 대한 조언과 상담이라서 주제로는 너무 좁음.","오답 ✕ — 늦게 자는 것의 나쁜 영향(건강 문제 등)을 설명하는 내용은 없다. 'I have trouble falling asleep.'(잠들기가 어려워요.)는 문제 상황이지 영향 설명이 아니라서 틀림.","오답 ✕ — 헨리가 'I just watch some short videos'(짧은 영상을 본다)라고 하지만 스마트폰 중독이라는 말은 나오지 않고, 중심은 수면 문제와 조언이라서 틀림.","정답 ○ — 헨리가 'I have trouble falling asleep.'(잠들기가 어려워요.)라고 하자 엄마가 'You need to stop using your smartphone after 10 p.m.'(밤 10시 이후에는 스마트폰 사용을 멈춰야 해.)라고 조언하므로 맞음.","오답 ✕ — 헨리가 'may I use my smartphone a little longer on the weekend?'(주말에는 조금 더 써도 될까요?)라고 묻고 허락받는 것은 대화 끝부분의 일부일 뿐이라서 주제로는 좁음."],"memo":["정답 ④: 헨리의 수면 문제에 대한 조언","근거: To be honest, I have trouble falling asleep.(솔직히, 잠들기가 어려워요.)","함정: ⑤ 주말 사용 허락은 대화 끝부분의 일부일 뿐이다. ✕"],"why":"잠들기 어려운 헨리에게 엄마가 스마트폰 사용을 조절하라고 조언한다."},{"n":3,"q":"What is Henry's request to his mother?","o":["enough sleep on weekdays","a new smartphone for school","a chance to make short videos","more free time on the weekend","more smartphone time on the weekend"],"a":4,"ans":"more smartphone time on the weekend","evs":[["B: Okay, I'll try... but may I use my smartphone a little longer on the weekend?","알겠어요, 노력해 볼게요... 그런데 주말에는 스마트폰을 조금 더 오래 써도 될까요?"],["W: Of course you can. Just make sure you don't use it too much.","물론이지. 너무 많이 쓰지 않도록만 해라."]],"ev":["B: Okay, I'll try... but may I use my smartphone a little longer on the weekend?","알겠어요, 노력해 볼게요... 그런데 주말에는 스마트폰을 조금 더 오래 써도 될까요?"],"ow":["오답 ✕ — 헨리는 'I have trouble falling asleep.'(잠들기가 어려워요.)라고 했을 뿐, 평일에 충분히 자게 해 달라고 부탁하지 않았다. 틀림.","오답 ✕ — 새 스마트폰을 사 달라는 말은 없다. 'may I use my smartphone a little longer'(스마트폰을 조금 더 오래 써도 될까요)는 지금 쓰는 폰의 사용 시간 이야기라서 틀림.","오답 ✕ — 헨리는 'I just watch some short videos'(짧은 영상을 본다)고만 했을 뿐, 영상을 만들 기회를 달라고 한 것이 아니라서 틀림.","오답 ✕ — 헨리가 부탁한 것은 일반적인 자유 시간이 아니라 'use my smartphone a little longer on the weekend'(주말에 스마트폰을 조금 더 오래 쓰는 것)이다. 틀림.","정답 ○ — 'may I use my smartphone a little longer on the weekend?'(주말에는 스마트폰을 조금 더 오래 써도 될까요?)라고 했으므로 주말에 더 많은 스마트폰 시간을 요청한 것이 맞음."],"memo":["정답 ⑤: 주말에 스마트폰을 더 오래 쓰게 해 달라는 요청","근거: may I use my smartphone a little longer on the weekend?(주말에는 스마트폰을 조금 더 오래 써도 될까요?)","함정: ④ free time(자유 시간)이 아니라 smartphone time(스마트폰 시간) ✕"],"why":"헨리는 엄마에게 주말에 스마트폰을 조금 더 쓰게 해 달라고 부탁한다."}],"dlg":[["W","Henry, you look tired. What's wrong?","헨리, 피곤해 보이네. 무슨 일이니?"],["B","I'm just tired, Mom. I went to bed late last night.","그냥 피곤해요, 엄마. 어젯밤에 늦게 잤어요."],["W","You seem to go to bed late these days. Are you okay?","요즘 늦게 자는 것 같구나. 괜찮니?"],["B","To be honest, I have trouble falling asleep.","솔직히, 잠들기가 어려워요."],["W","What do you usually do before going to bed?","보통 자기 전에 뭐 하니?"],["B","Nothing much. I just watch some short videos and check out social media on my smartphone.","별거 없어요. 스마트폰으로 짧은 영상을 좀 보고 SNS를 확인해요."],["W","Oh, boy. You need to stop using your smartphone after 10 p.m.","이런. 밤 10시 이후에는 스마트폰 사용을 멈춰야 해."],["B","Okay, I'll try... but may I use my smartphone a little longer on the weekend?","알겠어요, 노력해 볼게요... 그런데 주말에는 스마트폰을 조금 더 오래 써도 될까요?"],["W","Of course you can. Just make sure you don't use it too much.","물론이지. 너무 많이 쓰지 않도록만 해라."]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["여자아이는 전시관에 물을 가지고 들어갈 수 있다.","전시관에서는 음식이나 음료가 허용되지 않는다.","전시관에서는 사진을 찍을 수 없다.","도담 과학관은 입장료가 없다.","여자아이는 이미 전시를 다 보았다."],"a":1,"ans":"전시관에서는 음식이나 음료가 허용되지 않는다.","evs":[["M: I'm afraid not. No food or drink is allowed in the exhibition.","안 될 것 같아요. 전시관에서는 음식이나 음료가 허용되지 않아요."],["M: Feel free to take pictures.","편하게 사진을 찍으셔도 돼요."]],"ev":["M: I'm afraid not. No food or drink is allowed in the exhibition.","안 될 것 같아요. 전시관에서는 음식이나 음료가 허용되지 않아요."],"ow":["오답 ✕ — 직원이 'I'm afraid not.'(안 될 것 같아요.)이라고 했으므로 물을 가지고 들어갈 수 없다. 틀림.","정답 ○ — 직원이 'No food or drink is allowed in the exhibition.'(전시관에서는 음식이나 음료가 허용되지 않아요.)라고 했으므로 맞음.","오답 ✕ — 직원이 'Feel free to take pictures.'(편하게 사진을 찍으셔도 돼요.)라고 했으므로 사진을 찍을 수 있다. 틀림.","오답 ✕ — 입장료에 대한 언급은 대화에 없다. 가장 가까운 말은 'welcome to Dodam Science Museum'(도담 과학관에 오신 것을 환영합니다)뿐이라서 틀림.","오답 ✕ — 여자아이는 'Is it okay to bring some water to the exhibition?'(전시관에 물을 가지고 들어가도 되나요?)라고 물으므로 전시를 보러 들어가기 전이다. 틀림."],"memo":["정답 ②: 전시관에서는 음식이나 음료가 허용되지 않는다.","근거: No food or drink is allowed in the exhibition.(전시관에서는 음식이나 음료가 허용되지 않아요.)","함정: ③ 사진은 'Feel free to take pictures.'라서 찍어도 된다. ✕"],"why":"전시관에는 음식과 음료를 가져갈 수 없지만 사진은 자유롭게 찍을 수 있다."}],"dlg":[["M","Hello, welcome to Dodam Science Museum. How can I help you?","안녕하세요, 도담 과학관에 오신 것을 환영합니다. 무엇을 도와드릴까요?"],["G","Hi. I have a few questions. Is it okay to bring some water to the exhibition?","안녕하세요. 몇 가지 질문이 있어요. 전시관에 물을 가지고 들어가도 되나요?"],["M","I'm afraid not. No food or drink is allowed in the exhibition.","안 될 것 같아요. 전시관에서는 음식이나 음료가 허용되지 않아요."],["G","That's too bad. Is it okay to take pictures?","아쉽네요. 사진을 찍어도 되나요?"],["M","Feel free to take pictures.","편하게 사진을 찍으셔도 돼요."]]},{"qs":[{"n":5,"q":"Which is true about the dialogue?","o":["The boy says the girl cannot use the computer.","The boy tells the girl to log out after using the computer.","The library computer is not working now.","The girl must come back by 8.","The library is closed now."],"a":1,"ans":"The boy tells the girl to log out after using the computer.","evs":[["B: Sure, but make sure you log out after using it.","물론이지, 하지만 사용한 후에는 꼭 로그아웃해야 해."],["G: Is it okay to use the library computer?","도서관 컴퓨터를 사용해도 되나요?"]],"ev":["B: Sure, but make sure you log out after using it.","물론이지, 하지만 사용한 후에는 꼭 로그아웃해야 해."],"ow":["오답 ✕ — 소년이 'Sure'(물론이지)라고 답했으므로 여자아이는 컴퓨터를 사용해도 된다. 틀림.","정답 ○ — 소년이 'make sure you log out after using it'(사용한 후에는 꼭 로그아웃해야 해)이라고 했으므로 맞음.","오답 ✕ — 컴퓨터가 고장 났다는 말은 없다. 'Sure'(물론이지)라고 하며 사용을 허락했으므로 틀림.","오답 ✕ — 'come back by 8'(8시까지 돌아오라)이라는 말은 대화에 없다. 소년의 당부는 'log out'(로그아웃)이라서 틀림.","오답 ✕ — 도서관이 문을 닫았다는 말은 없고, 컴퓨터 사용을 허락했으므로 틀림."],"memo":["정답 ②: 소년은 사용 후 로그아웃하라고 당부한다.","근거: make sure you log out after using it(사용한 후에는 꼭 로그아웃해야 해)","함정: 'Sure, but ~'은 허락하되 조건을 붙이는 말이다."],"why":"도서관 컴퓨터는 사용해도 되지만 사용 후 로그아웃해야 한다."}],"dlg":[["G","Is it okay to use the library computer?","도서관 컴퓨터를 사용해도 되나요?"],["B","Sure, but make sure you log out after using it.","물론이지, 하지만 사용한 후에는 꼭 로그아웃해야 해."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["How to Get a Sale","Make Delicious Popcorn","Why Short Videos Are Popular","Do You Have a Popcorn Brain?","Why Do We Have a Popcorn Brain?"],"a":3,"ans":"Do You Have a Popcorn Brain?","evs":[["If this story feels like yours, you may have \"popcorn brain.\"","만약 이 이야기가 당신의 이야기처럼 느껴진다면, 당신은 ‘팝콘 브레인’을 가지고 있을지도 몰라요."],["You watch the video and keep watching many other short videos.","당신은 그 영상을 시청하고 다른 많은 짧은 영상들을 계속 시청해요."]],"ev":["If this story feels like yours, you may have \"popcorn brain.\"","만약 이 이야기가 당신의 이야기처럼 느껴진다면, 당신은 ‘팝콘 브레인’을 가지고 있을지도 몰라요."],"ow":["오답 ✕ — 'There is a sale on the shoes that you really want.'(정말 갖고 싶은 신발이 할인 판매 중이에요.)에서 sale이 나오지만 할인 받는 방법을 알려 주는 글이 아니라서 틀림.","오답 ✕ — popcorn은 'popcorn brain'이라는 이름 속 단어일 뿐, 팝콘 만드는 법을 설명하는 글이 아니라서 틀림.","오답 ✕ — 'keep watching many other short videos'(다른 많은 짧은 영상들을 계속 시청해요)가 나오지만 영상이 인기 있는 이유를 설명하는 글이 아니라서 틀림.","정답 ○ — 이야기를 들려준 뒤 'If this story feels like yours, you may have \"popcorn brain.\"'(이 이야기가 당신의 이야기처럼 느껴진다면, 팝콘 브레인일지도 몰라요.)라고 독자에게 묻는 글이므로 제목으로 알맞음.","오답 ✕ — 'Why do we have'(우리가 왜 갖는가)는 원인을 설명하는 제목인데, 이 부분은 이야기만 보여 주고 원인은 설명하지 않아서 틀림."],"memo":["정답 ④: Do You Have a Popcorn Brain?","근거: If this story feels like yours, you may have \"popcorn brain.\"","함정: ⑤ 원인을 설명하는 글이 아니라 독자에게 묻는 이야기이다. ✕"],"why":"이야기를 들려주고 독자에게 팝콘 브레인이 있는지 묻는 글이다."},{"n":7,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["call - videos","text - videos","call - messages","help - videos","visit - ads"],"a":0,"ans":"call - videos","evs":[["Suddenly, you remember that your mom asked you to call her.","갑자기 엄마가 당신에게 전화하라고 요청했던 것이 기억나요."],["You watch the video and keep watching many other short videos.","당신은 그 영상을 시청하고 다른 많은 짧은 영상들을 계속 시청해요."],["Wait, you forgot to call her two hours ago!","잠깐, 두 시간 전에 엄마에게 전화하는 것을 잊었네요!"]],"ev":["Suddenly, you remember that your mom asked you to call her.","갑자기 엄마가 당신에게 전화하라고 요청했던 것이 기억나요."],"ow":["정답 ○ — 'you forgot to call her two hours ago!'(두 시간 전에 엄마에게 전화하는 것을 잊었네요!)이므로 (A)는 call, 'keep watching many other short videos'(다른 많은 짧은 영상들을 계속 시청해요)이므로 (B)는 videos가 맞음.","오답 ✕ — (B) videos는 맞지만, 엄마가 요청한 것은 문자(text)가 아니라 'asked you to call her'(전화하라고 요청했다)이므로 (A)가 틀림.","오답 ✕ — (A) call은 맞지만, 계속 본 것은 메시지가 아니라 'many other short videos'(다른 많은 짧은 영상들)라서 (B)가 틀림. 메시지는 처음에 한 번 떴을 뿐이다.","오답 ✕ — (B) videos는 맞지만, 도와주는 것(help)이 아니라 'call her'(엄마에게 전화하다)를 잊었으므로 (A)가 틀림.","오답 ✕ — 엄마를 방문(visit)하는 이야기는 없고, 계속 본 것도 광고(ads)가 아니라 짧은 영상이라서 둘 다 틀림."],"memo":["정답 ①: call - videos","근거: you forgot to call her two hours ago!(두 시간 전에 엄마에게 전화하는 것을 잊었네요!)","함정: 메시지(message)는 한 번 떴을 뿐, 계속 본 것은 영상(videos)이다."],"why":"짧은 영상을 계속 보다가 엄마에게 전화하는 것을 잊었다.","sum":"In the story, a person forgot to (A)______ his or her mom because he or she kept watching many short (B)______ on the smartphone.","lab":"완성된 요약문 : "}],"pp":[["Imagine this—you are doing your homework at your desk.","이런 상상을 해 보세요. 당신은 책상에서 숙제를 하고 있어요."],["Suddenly, you remember that your mom asked you to call her.","갑자기 엄마가 당신에게 전화하라고 요청했던 것이 기억나요."],["When you pick up your smartphone, a message pops up.","당신이 스마트폰을 집어 들 때, 메시지가 하나 떠요."],["It is for a new video from your favorite channel.","그것은 당신이 가장 좋아하는 채널의 새 영상에 대한 것이에요."],["You watch the video and keep watching many other short videos.","당신은 그 영상을 시청하고 다른 많은 짧은 영상들을 계속 시청해요."],["Then, you hear another sound.","그러자 또 다른 소리가 들려요."],["There is a sale on the shoes that you really want.","당신이 정말 갖고 싶은 신발이 할인 판매 중이에요."],["You were going to ask your mom to buy them for you.","당신은 엄마에게 그것을 사 달라고 부탁하려고 했었죠."],["Wait, you forgot to call her two hours ago!","잠깐, 두 시간 전에 엄마에게 전화하는 것을 잊었네요!"],["If this story feels like yours, you may have \"popcorn brain.\"","만약 이 이야기가 당신의 이야기처럼 느껴진다면, 당신은 ‘팝콘 브레인’을 가지고 있을지도 몰라요."]]},{"qs":[{"n":8,"q":"윗글에서 'popcorn brain'이라는 이름이 붙은 이유로 알맞은 것은?","o":["많은 생각이 팬 속의 팝콘처럼 빠르게 튀어나오기 때문에","팝콘을 먹으면서 스마트폰을 보기 때문에","머리가 팝콘 모양으로 부풀어 오르기 때문에","팝콘 가게에서 처음 발견된 증상이기 때문에","팝콘처럼 달콤한 영상을 많이 보기 때문에"],"a":0,"ans":"많은 생각이 팬 속의 팝콘처럼 빠르게 튀어나오기 때문에","evs":[["You keep moving down the screen and clicking, and many thoughts pop up quickly, like popcorn in a pan!","당신이 계속 화면을 아래로 내리고 클릭하면, 마치 팬에 있는 팝콘처럼 많은 생각들이 빠르게 튀어나와요!"]],"ev":["You keep moving down the screen and clicking, and many thoughts pop up quickly, like popcorn in a pan!","당신이 계속 화면을 아래로 내리고 클릭하면, 마치 팬에 있는 팝콘처럼 많은 생각들이 빠르게 튀어나와요!"],"ow":["정답 ○ — 'many thoughts pop up quickly, like popcorn in a pan!'(마치 팬에 있는 팝콘처럼 많은 생각들이 빠르게 튀어나와요!)라고 했으므로 이름의 이유로 맞음.","오답 ✕ — 팝콘을 먹는다는 말은 본문에 없다. 팝콘은 생각이 튀어나오는 모습을 비유한 말('like popcorn in a pan')이라서 틀림.","오답 ✕ — 머리가 부풀어 오른다는 말은 없다. 'many thoughts pop up quickly'(많은 생각들이 빠르게 튀어나온다)는 생각 이야기라서 틀림.","오답 ✕ — 팝콘 가게에서 발견되었다는 언급은 본문에 없다. 'like popcorn in a pan'은 비유 표현일 뿐이라서 틀림.","오답 ✕ — 영상이 달콤하다는 말은 없다. 이름의 이유는 'many thoughts pop up quickly, like popcorn in a pan!'(생각이 팝콘처럼 빠르게 튀어나옴)이라서 틀림."],"memo":["정답 ①: 생각이 팬 속 팝콘처럼 빠르게 튀어나와서","근거: many thoughts pop up quickly, like popcorn in a pan!(많은 생각들이 팬 속 팝콘처럼 빠르게 튀어나와요!)","함정: 팝콘은 먹는 것이 아니라 '튀어나오는 모습'을 비유한 것 ✕"],"why":"팝콘 브레인은 생각이 팬 속 팝콘처럼 튀어나온다는 비유에서 나온 이름이다."},{"n":9,"q":"윗글의 내용과 일치하지 않는 것은?","o":["동시에 여러 가지 일을 하면 팝콘브레인을 경험할 확률이 높다.","밤에 여러 생각이 빠르게 튀어나온다면, 잠을 잘 못 잘 수도 있다.","요즘에는 사람들이 단지 47초 동안만 집중할 수 있다.","2004년에 한 연구는 사람들이 한 가지 일에 2분 5초 동안 집중할 수 있다는 것을 보여주었다.","팝콘 브레인을 예방하기 위해 변화가 필요하다."],"a":3,"ans":"2004년에 한 연구는 사람들이 한 가지 일에 2분 5초 동안 집중할 수 있다는 것을 보여주었다.","evs":[["In a study, people were able to focus on one thing for 2.5 minutes in 2004.","한 연구에서, 2004년에는 사람들이 한 가지 일에 2분 30초 동안 집중할 수 있었어요."]],"ev":["In a study, people were able to focus on one thing for 2.5 minutes in 2004.","한 연구에서, 2004년에는 사람들이 한 가지 일에 2분 30초 동안 집중할 수 있었어요."],"ow":["오답 ✕ — 이 보기는 일치한다. 'It is easy to experience popcorn brain when you do many things at the same time on your smartphone.'(스마트폰으로 동시에 많은 일을 할 때 팝콘 브레인을 경험하기 쉬워요.)라고 했다. 불일치 문제의 답이 아님.","오답 ✕ — 이 보기는 일치한다. 'If it happens at night, you may have trouble sleeping.'(밤에 일어나면 잠드는 게 어려울지도 몰라요.)라고 했다. 불일치 문제의 답이 아님.","오답 ✕ — 이 보기는 일치한다. 'Nowadays, people can only concentrate for 47 seconds.'(요즘에는 사람들이 단지 47초 동안만 집중할 수 있어요.)라고 했다. 불일치 문제의 답이 아님.","정답 ○ — 본문은 'people were able to focus on one thing for 2.5 minutes in 2004'(2004년에 2분 30초 동안 집중할 수 있었다)인데, 이 보기는 2분 5초라서 본문과 일치하지 않음.","오답 ✕ — 이 보기는 일치한다. 'If you do not want to have popcorn brain, you need to make some changes.'(팝콘 브레인을 가지고 싶지 않다면 변화를 좀 줄 필요가 있어요.)라고 했다. 불일치 문제의 답이 아님."],"memo":["정답 ④: 2004년 연구에서 집중 시간은 2분 5초가 아니라 2.5분(2분 30초)이다.","근거: people were able to focus on one thing for 2.5 minutes in 2004.","함정: 2.5 minutes = 2분 30초, 2분 5초와 다르다. ✕"],"why":"2004년에는 한 가지 일에 2분 30초(2.5분) 동안 집중할 수 있었다."},{"n":10,"q":"윗글의 주제로 알맞은 것은?","o":["팝콘 브레인의 문제점 연구 과정","팝콘 브레인의 집중력 저하 문제","집중력을 증가시키는 방법","팝콘 브레인의 필요성","집중력 저하의 원인"],"a":1,"ans":"팝콘 브레인의 집중력 저하 문제","evs":[["More importantly, people with popcorn brain have trouble paying attention.","더 중요한 것은, 팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪어요."],["Nowadays, people can only concentrate for 47 seconds.","요즘에는 사람들이 단지 47초 동안만 집중할 수 있어요."]],"ev":["More importantly, people with popcorn brain have trouble paying attention.","더 중요한 것은, 팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪어요."],"ow":["오답 ✕ — 'In a study, people were able to focus...'(한 연구에서...)라는 연구가 나오지만, 연구 과정을 설명하는 글이 아니라 집중력 결과를 보여 주는 예시일 뿐이라서 틀림.","정답 ○ — 'people with popcorn brain have trouble paying attention'(팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪는다)과 'only concentrate for 47 seconds'(47초만 집중할 수 있다)가 중심이므로 맞음.","오답 ✕ — 'Here are some tips.'(여기에 몇 가지 조언이 있어요.)는 다음 내용을 알리는 말일 뿐, 이 부분의 중심은 집중력을 높이는 방법이 아니라 집중력 저하 문제라서 틀림.","오답 ✕ — 팝콘 브레인은 'trouble paying attention'(집중하는 데 어려움)을 일으키는 부정적인 상태이므로 필요하다는 보기는 틀림.","오답 ✕ — 이 부분은 원인이 아니라 결과를 말한다. 'people with popcorn brain have trouble paying attention'(팝콘 브레인이 있으면 집중하기 어렵다)이 중심이므로 틀림."],"memo":["정답 ②: 팝콘 브레인의 집중력 저하 문제","근거: people with popcorn brain have trouble paying attention.(팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪어요.)","함정: ③ 방법(tips)은 다음에 이어질 내용이고 이 부분의 중심이 아니다. ✕"],"why":"팝콘 브레인이 있으면 오래 집중하지 못한다는 것이 중심 내용이다."}],"pp":[["It is easy to experience popcorn brain when you do many things at the same time on your smartphone.","당신이 스마트폰으로 동시에 많은 일을 할 때 팝콘 브레인을 경험하기 쉬워요."],["You keep moving down the screen and clicking, and many thoughts pop up quickly, like popcorn in a pan!","당신이 계속 화면을 아래로 내리고 클릭하면, 마치 팬에 있는 팝콘처럼 많은 생각들이 빠르게 튀어나와요!"],["If it happens at night, you may have trouble sleeping.","만약 이것이 밤에 일어나면, 당신은 잠드는 게 어려울지도 몰라요."],["More importantly, people with popcorn brain have trouble paying attention.","더 중요한 것은, 팝콘 브레인을 가진 사람들은 집중하는 데 어려움을 겪어요."],["They cannot concentrate on one thing for a long time.","그들은 한 가지 일에 오랜 시간 동안 집중할 수 없어요."],["In a study, people were able to focus on one thing for 2.5 minutes in 2004. Nowadays, people can only concentrate for 47 seconds.","한 연구에서, 2004년에는 사람들이 한 가지 일에 2분 30초 동안 집중할 수 있었어요. 요즘에는 사람들이 단지 47초 동안만 집중할 수 있어요."],["If you do not want to have popcorn brain, you need to make some changes.","당신이 팝콘 브레인을 가지고 싶지 않다면 변화를 좀 줄 필요가 있어요."],["Here are some tips.","여기에 몇 가지 조언이 있어요."]]}];

var secs=[],cur=null;
D.forEach(function(it,i){if(it.tag||!cur){cur={name:it.tag||'',items:[]};secs.push(cur)}cur.items.push(i)});
var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){done[+b.dataset.sub]=true;logA(+b.dataset.sub);render();
  var tot=0,fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
