<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩튜터 주니어 3 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"rj3-01-1","no":1,"ko":"프랑스의 급식은 어떨까?","items":[{"n":1,"t":"tf","q":"A school lunch in France begins with a vegetable dish such as salad.","ko":"프랑스의 학교 점심은 샐러드 같은 채소 요리로 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"French school lunches begin with a vegetable dish, such as salad.","프랑스 학교 점심은 샐러드와 같은 채소 요리로 시작한다."]],"w":"3번 문장에 French school lunches begin with a vegetable dish, such as salad가 있음. begin with는 ‘~로 시작하다’라서 본문과 일치.","c":"T"},"h":"3640407b89"},{"n":2,"t":"tf","q":"Fried food can be served every day in French school lunches.","ko":"프랑스 학교 점심에서 튀긴 음식은 매일 제공될 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"For example, fried food can only be served a few times each month.","예를 들어, 튀긴 음식은 단지 한 달에 몇 번만 제공될 수 있다."]],"w":"9번 문장에서 튀긴 음식은 only a few times each month(한 달에 몇 번만) 제공될 수 있다고 함. 매일 나온다는 말은 본문과 반대.","c":"F"},"h":"5b1591a270"},{"n":3,"t":"tf","q":"Vending machines have been banned in French schools to limit children’s access to unhealthy snacks.","ko":"프랑스 학교에서는 아이들이 건강에 좋지 않은 간식을 쉽게 접하지 못하게 하려고 자동판매기를 금지했다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"In order to limit children’s access to unhealthy snacks and soft drinks, vending machines have been banned.","어린이들이 건강에 좋지 않은 간식과 탄산음료에 접근하는 것을 제한하기 위해, 자동판매기는 금지되었다."]],"w":"12번 문장에서 아이들의 접근을 제한하려고(In order to limit children’s access) 자동판매기가 금지되었다고 함. 본문과 일치.","c":"T"},"h":"32186f07f9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In order to limit children’s access to unhealthy snacks and soft drinks, vending machines have been banned.)","ko":"(어린이들이 건강에 좋지 않은 간식과 탄산음료에 접근하는 것을) limit하기 위해, 자동판매기는 금지되었다.","opts":["늘리다","제한하다","도와주다","설명하다"],"word":"limit","r":{"a":"2) 제한하다","ev":"12번 문장","s":[[12,"In order to limit children’s access to unhealthy snacks and soft drinks, vending machines have been banned.","어린이들이 건강에 좋지 않은 간식과 탄산음료에 접근하는 것을 제한하기 위해, 자동판매기는 금지되었다."]],"w":"12번 문장에서 접근을 줄이려고 자동판매기를 금지했으니 limit는 ‘제한하다’. 늘리다는 반대 뜻.","c":2},"h":"721984af2e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Even ketchup is rarely served because of its high sugar content.)","ko":"심지어 케첩은 높은 설탕 content 때문에 좀처럼 제공되지 않는다.","opts":["가격","맛","크기","함유량"],"word":"content","r":{"a":"4) 함유량","ev":"11번 문장","s":[[11,"Even ketchup is rarely served because of its high sugar content.","심지어 케첩은 높은 설탕 함유량 때문에 좀처럼 제공되지 않는다."]],"w":"11번 문장에서 high sugar content는 설탕이 많이 ‘들어 있는 정도’, 즉 ‘함유량’. 케첩이 안 나오는 이유가 설탕이 많이 들어서라는 흐름.","c":4},"h":"4e4c46d9c1"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThis program might be strict, but it provides students with healthy meals and encourages them to develop healthy eating habits.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이 프로그램은 엄격할 수도 있지만, 그것은 학생들에게 건강한 식사를 제공하고 그들이 건강한 식습관을 기르도록 장려한다.","opts":["건강한 식사들","프로그램의 규칙들","학생들","학부모들"],"r":{"a":"3) 학생들","ev":"13번 문장","s":[[13,"This program might be strict, but it provides students with healthy meals and encourages them to develop healthy eating habits.","이 프로그램은 엄격할 수도 있지만, 그것은 학생들에게 건강한 식사를 제공하고 그들이 건강한 식습관을 기르도록 장려한다."]],"w":"encourage + 목적어 + to + 동사원형은 ‘~가 …하도록 장려하다’. 식습관을 기르는 사람은 앞에 나온 students(학생들).","c":3},"h":"a3c70f7eaa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But sometimes sweet treats like pies may be served.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 가끔 파이와 같은 달콤한 간식이 제공될 수도 있다.","opts":["파이 같은 달콤한 간식은 학교에서 매일 제공된다.","파이 같은 달콤한 간식이 가끔 제공될 수도 있다.","파이 같은 달콤한 간식은 학교에서 절대 제공되지 않는다.","학생들이 직접 파이를 만들어 점심으로 먹는다."],"r":{"a":"2) 파이 같은 달콤한 간식이 가끔 제공될 수도 있다.","ev":"7번 문장","s":[[7,"But sometimes sweet treats like pies may be served.","하지만 가끔 파이와 같은 달콤한 간식이 제공될 수도 있다."]],"w":"7번 문장의 sometimes는 ‘가끔’, may be served는 ‘제공될 수도 있다’. 그래서 파이 같은 간식이 가끔 나올 수 있다는 뜻. 매일 나오거나 절대 안 나온다는 말은 본문에 없음.","c":2},"h":"0a8f216fe8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["프랑스 학교에서는 아이들이 자동판매기에서 탄산음료를 살 수 있다.","프랑스 학교 점심은 항상 파이로 끝난다.","프랑스의 건강한 학교 점심은 네 가지 코스로 이루어져 있다.","프랑스 학교 점심은 치즈로 시작한다."],"opts":["Children in France can buy soft drinks from vending machines at school.","French school lunches always end with a pie.","Healthy school lunches in France have four courses.","French school lunches begin with cheese."],"r":{"a":"3) Healthy school lunches in France have four courses.","ev":"2번 문장","s":[[2,"In France, the government is addressing this issue by serving healthy school lunches with four courses.","프랑스에서 정부는 건강한 학교 점심을 네 가지 코스로 제공함으로써 이 문제를 다루고 있다."]],"w":"2번 문장에 healthy school lunches with four courses(네 가지 코스의 건강한 학교 점심)가 있음. 자동판매기는 금지(12번), 디저트는 보통 과일(6번), 점심은 채소 요리로 시작(3번)이라 나머지는 틀림.","c":3},"h":"a67aac1042"},{"n":9,"t":"sum","q":"Childhood obesity is a (A) problem around the world, so in French schools, drinks with a lot of sugar are usually not (B).","ko":"아동 비만은 전 세계에서 (A) 문제이므로, 프랑스 학교에서는 설탕이 많이 든 음료가 보통 (B) 않는다.","oko":["(A) 작은 / (B) 허용되지","(A) 심각한 / (B) 허용되지","(A) 작은 / (B) 발명되지","(A) 심각한 / (B) 발명되지","(A) 웃기는 / (B) 허용되지"],"opts":["(A) small / (B) allowed","(A) serious / (B) allowed","(A) small / (B) invented","(A) serious / (B) invented","(A) funny / (B) allowed"],"r":{"a":"2) (A) serious / (B) allowed","ev":"1번, 10번 문장","s":[[1,"Childhood obesity is becoming a serious problem around the world.","아동 비만은 전 세계에서 심각한 문제가 되고 있다."],[10,"Also, drinks containing large amounts of sugar are usually not allowed.","또한, 많은 양의 설탕이 포함된 음료는 보통 허용되지 않는다."]],"w":"1번 Childhood obesity is becoming a serious problem(아동 비만은 심각한 문제), 10번 drinks containing large amounts of sugar are usually not allowed(설탕이 많은 음료는 보통 허용되지 않는다)에서 가져옴. 그래서 serious와 allowed.","c":2},"h":"800b019f5c"},{"n":10,"t":"fill","q":"Next comes cheese, and [A] dessert. Dessert is normally [B] fruit.","ko":"다음은 치즈이고, [A] 디저트이다. 디저트는 보통 [B] 과일이다.","bank":["finally","fresh","strict","courses","habits","meals"],"bko":{"finally":"마지막으로","fresh":"신선한","strict":"엄격한","courses":"코스","habits":"습관","meals":"식사"},"r":{"a":"[A] finally (마지막으로), [B] fresh (신선한)","ev":"5~6번 문장","s":[[5,"Next comes cheese, and finally dessert.","다음은 치즈이고 마지막은 디저트이다."],[6,"Dessert is normally fresh fruit.","디저트는 보통 신선한 과일이다."]],"w":"5번 Next comes cheese, and finally dessert, 6번 Dessert is normally fresh fruit에서 가져옴. strict, courses, habits, meals는 두 자리 어디에도 뜻과 문법이 맞지 않음.","c":null},"h":"29305b6c4b"}]},{"u":1,"id":"rj3-01-2","no":2,"ko":"응원이 필요해!","items":[{"n":1,"t":"tf","q":"Peptoc was created by two teachers in California.","ko":"Peptoc은 캘리포니아의 두 선생님이 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Peptoc is a project created by two teachers in California who were inspired by the pure joy of their students.","Peptoc은 학생들의 순수한 기쁨에 영감을 받은 캘리포니아의 두 선생님이 만든 프로젝트이다."]],"w":"2번 문장에 a project created by two teachers in California가 있음. 본문과 일치.","c":"T"},"h":"5ed24e461c"},{"n":2,"t":"tf","q":"If you want to hear kids laughing happily, you should press 3.","ko":"아이들이 행복하게 웃는 소리를 듣고 싶으면 3번을 눌러야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"And if you want to hear kids laughing happily, press 4.","그리고 아이들이 행복하게 웃고 있는 것을 듣고 싶다면, 4번을 눌러라."]],"w":"9번 문장에서 아이들이 행복하게 웃는 소리를 들으려면 4번을 누른다고 함. 3번은 응원 연설(pep talk)이라 본문과 다름.","c":"F"},"h":"c2820645c7"},{"n":3,"t":"tf","q":"People learned about Peptoc quickly through social media.","ko":"사람들은 소셜 미디어를 통해 Peptoc에 대해 빠르게 알게 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"People quickly learned about Peptoc through social media.","사람들은 소셜 미디어를 통해 Peptoc에 대해 빠르게 알게 되었다."]],"w":"10번 문장에 People quickly learned about Peptoc through social media가 있음. 본문과 일치.","c":"T"},"h":"db0ca01d66"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The kids came up with various supportive messages and recorded them.)","ko":"아이들은 다양한 supportive 메시지를 생각해 내고 그것들을 녹음했다.","opts":["지루한","복잡한","힘을 주는","무서운"],"word":"supportive","r":{"a":"3) 힘을 주는","ev":"4번 문장","s":[[4,"The kids came up with various supportive messages and recorded them.","아이들은 다양한 힘을 주는 메시지를 생각해 내고 그것들을 녹음했다."]],"w":"4번 문장의 메시지들은 힘든 사람을 격려하려고 만든 것(3번). 그래서 supportive는 ‘힘을 주는’.","c":3},"h":"db782e36bb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Countless people have received joy from the kids’ messages.)","ko":"countless한 사람들이 아이들의 메시지로부터 기쁨을 받아 왔다.","opts":["거의 없는","셀 수 없이 많은","매우 어린","꽤 유명한"],"word":"Countless","r":{"a":"2) 셀 수 없이 많은","ev":"12번 문장","s":[[12,"Countless people have received joy from the kids’ messages, and the kids have learned about the power of kind words.","셀 수 없이 많은 사람들이 아이들의 메시지로부터 기쁨을 받았고, 아이들은 친절한 말의 힘에 대해 배우게 되었다."]],"w":"12번 문장에서 Countless people have received joy는 기쁨을 받은 사람이 ‘셀 수 없이 많다’는 뜻. 11번에서 시간당 700통이 넘는 전화가 왔다는 흐름과도 이어짐.","c":2},"h":"b7da68eda3"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nTwo days after the project started, it was getting more than 700 calls per hour.","ko":"밑줄 친 it이 가리키는 것은?","sko":"프로젝트가 시작된 지 이틀 후, 그것은 시간당 700통이 넘는 전화를 받았다.","opts":["소셜 미디어","두 선생님","아이들의 메시지들","Peptoc 프로젝트"],"r":{"a":"4) Peptoc 프로젝트","ev":"10~11번 문장","s":[[10,"People quickly learned about Peptoc through social media.","사람들은 소셜 미디어를 통해 Peptoc에 대해 빠르게 알게 되었다."],[11,"Two days after the project started, it was getting more than 700 calls per hour.","프로젝트가 시작된 지 이틀 후, 그것은 시간당 700통이 넘는 전화를 받았다."]],"w":"문장 앞에서 the project started라고 했고, 전화를 받는 것은 전화를 거는 대상인 Peptoc 프로젝트임. 10번 문장에서도 Peptoc이 소셜 미디어로 알려졌다고 함.","c":4},"h":"4954939de9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you’re having a hard day, pick up your phone and call Peptoc!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 힘든 하루를 보내고 있다면, 당신의 전화기를 들어 Peptoc에 전화해라!","opts":["힘든 날에는 Peptoc에 전화해 보라고 권하고 있다.","힘든 날에는 전화기를 꺼 두라고 권하고 있다.","Peptoc이 힘든 사람에게 먼저 전화를 걸어 줄 것이다.","전화기를 오래 들여다보면 하루가 힘들어진다고 말하고 있다."],"r":{"a":"1) 힘든 날에는 Peptoc에 전화해 보라고 권하고 있다.","ev":"1번 문장","s":[[1,"If you’re having a hard day, pick up your phone and call Peptoc!","만약 힘든 하루를 보내고 있다면, 당신의 전화기를 들어 Peptoc에 전화해라!"]],"w":"1번 문장 If you’re having a hard day(힘든 하루를 보내고 있다면), pick up your phone and call Peptoc(전화기를 들어 Peptoc에 전화해라)은 힘든 날 Peptoc에 전화해 보라는 권유.","c":1},"h":"efb4360bfb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["Peptoc에 전화한 사람은 번호를 골라 아이들의 메시지를 들을 수 있다.","Peptoc은 캘리포니아의 학생들이 시작했다.","메시지는 두 선생님이 직접 녹음했다.","사람들은 TV 뉴스를 통해 Peptoc을 알게 되었다."],"opts":["Callers to Peptoc can pick a number and listen to messages from children.","Peptoc was started by students in California.","The messages were recorded by the two teachers.","People learned about Peptoc through TV news."],"r":{"a":"1) Callers to Peptoc can pick a number and listen to messages from children.","ev":"2번, 4~5번, 10번 문장","s":[[2,"Peptoc is a project created by two teachers in California who were inspired by the pure joy of their students.","Peptoc은 학생들의 순수한 기쁨에 영감을 받은 캘리포니아의 두 선생님이 만든 프로젝트이다."],[4,"The kids came up with various supportive messages and recorded them.","아이들은 다양한 힘을 주는 메시지를 생각해 내고 그것들을 녹음했다."],[5,"When you call Peptoc, you can pick a number and listen to a message from the children.","Peptoc에 전화를 걸면 당신은 번호를 선택해 아이들의 메시지를 들을 수 있다."],[10,"People quickly learned about Peptoc through social media.","사람들은 소셜 미디어를 통해 Peptoc에 대해 빠르게 알게 되었다."]],"w":"5번 문장에서 전화하면 번호를 골라 아이들의 메시지를 들을 수 있다고 함. 만든 사람은 두 선생님(2번), 녹음은 아이들(4번), 알려진 방법은 소셜 미디어(10번)라 나머지는 틀림.","c":1},"h":"cde303377f"},{"n":9,"t":"sum","q":"Peptoc uses the kids’ (A) to (B) people who are having a hard day.","ko":"Peptoc은 힘든 하루를 보내고 있는 사람들을 (B) 위해 아이들의 (A)을(를) 사용한다.","oko":["(A) 옷 / (B) 격려하기","(A) 말 / (B) 격려하기","(A) 말 / (B) 귀찮게 하기","(A) 장난감 / (B) 귀찮게 하기","(A) 장난감 / (B) 격려하기"],"opts":["(A) clothes / (B) cheer","(A) words / (B) cheer","(A) words / (B) bother","(A) toys / (B) bother","(A) toys / (B) cheer"],"r":{"a":"2) (A) words / (B) cheer","ev":"1번, 3번 문장","s":[[1,"If you’re having a hard day, pick up your phone and call Peptoc!","만약 힘든 하루를 보내고 있다면, 당신의 전화기를 들어 Peptoc에 전화해라!"],[3,"They decided to use the kids’ words to cheer people up.","그들은 사람들을 격려하기 위해 아이들의 말을 사용하기로 결정했다."]],"w":"3번 They decided to use the kids’ words to cheer people up(아이들의 말을 사용해 사람들을 격려하기로 결정했다)에서 가져옴. 그래서 words와 cheer.","c":2},"h":"0e0fc0abb9"},{"n":10,"t":"fill","q":"If you are [A], press 1. If you need [B], press 2.","ko":"만약 당신이 [A] 상태라면, 1번을 눌러라. 만약 [B]이(가) 필요하다면, 2번을 눌러라.","bank":["frustrated","encouragement","happily","quickly","through","press"],"bko":{"frustrated":"좌절한","encouragement":"격려","happily":"행복하게","quickly":"빠르게","through":"~을 통해","press":"누르다"},"r":{"a":"[A] frustrated (좌절한), [B] encouragement (격려)","ev":"6~7번 문장","s":[[6,"If you are frustrated, press 1.","좌절감을 느낀다면, 1번을 눌러라."],[7,"If you need encouragement, press 2.","격려가 필요하다면, 2번을 눌러라."]],"w":"6번 If you are frustrated, press 1, 7번 If you need encouragement, press 2에서 가져옴. happily, quickly, through, press는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"6f0421fa4f"}]},{"u":1,"id":"rj3-01-3","no":3,"ko":"100년 동안의 비밀 이야기","items":[{"n":1,"t":"tf","q":"The time capsule will not be opened until the year 2114.","ko":"타임캡슐은 2114년이 될 때까지 열리지 않을 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Throughout the next 100 years, famous and well-respected authors will add an unread manuscript to a time capsule, which won’t be opened until 2114!","앞으로 100년 동안, 유명하고 존경받는 작가들이 읽지 않은 원고를 타임캡슐에 추가할 것인데, 그 타임캡슐은 2114년까지 열리지 않을 것이다!"]],"w":"2번 문장에 a time capsule, which won’t be opened until 2114가 있음. 본문과 일치.","c":"T"},"h":"a050f7302b"},{"n":2,"t":"tf","q":"The Future Library Trust decides the length and genre of each manuscript.","ko":"미래 도서관 단체가 각 원고의 길이와 장르를 정한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The length and genre of the work are up to them.","작품의 길이와 장르는 그들에게 달려 있다."]],"w":"5번 문장에서 작품의 길이와 장르는 작가들에게 달려 있다(up to them)고 함. 단체가 정한다는 말은 본문과 다름.","c":"F"},"h":"b1bb2e4d32"},{"n":3,"t":"tf","q":"The trees near the library will provide paper for the manuscripts.","ko":"도서관 근처의 나무들이 원고를 위한 종이를 제공할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The library has a forest nearby, and its trees will provide paper for the manuscripts when they are eventually printed out.","도서관 근처에 숲이 있는데, 그 숲의 나무들은 원고가 마침내 인쇄될 때 종이를 제공할 것이다."]],"w":"8번 문장에 its trees will provide paper for the manuscripts가 있음. 본문과 일치.","c":"T"},"h":"bf81778882"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When the writers submit the manuscripts, they only reveal the title.)","ko":"작가들이 원고를 제출할 때, 그들은 제목만 reveal한다.","opts":["숨기다","밝히다","바꾸다","잊다"],"word":"reveal","r":{"a":"2) 밝히다","ev":"4번 문장","s":[[4,"When the writers submit the manuscripts, they only reveal the title.","그 작가들이 원고를 제출할 때, 그들은 제목만 밝힌다."]],"w":"4번 문장은 작가가 원고 내용은 비밀로 하고 제목만 알린다는 흐름이라 reveal은 ‘밝히다, 드러내다’. 숨기다는 반대 뜻.","c":2},"h":"18010ac7f2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The Future Library Trust is inviting different outstanding writers to participate in the project annually.)","ko":"미래 도서관 단체는 매년 다양한 outstanding 작가들을 프로젝트에 참여하도록 초대하고 있다.","opts":["평범한","낯선","아직 유명하지 않은","뛰어난"],"word":"outstanding","r":{"a":"4) 뛰어난","ev":"3번 문장","s":[[3,"The Future Library Trust is inviting different outstanding writers to participate in the project annually.","미래 도서관 단체는 매년 다양한 우수한 작가들을 이 프로젝트에 참여하도록 초대하고 있다."]],"w":"3번 문장은 단체가 초대하는 작가들을 말하고, 2번에서 작가들이 famous and well-respected(유명하고 존경받는)라고 했으니 outstanding은 ‘뛰어난’.","c":4},"h":"73a72415c3"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThe only rule is that they cannot share their manuscripts with anyone, not even family members or editors.","ko":"밑줄 친 they가 가리키는 것은?","sko":"유일한 규칙은 그들이 원고를 누구와도, 심지어 가족 구성원이나 편집자에게조차 공유할 수 없다는 것이다.","opts":["직원들","편집자들","작가들","독자들"],"r":{"a":"3) 작가들","ev":"4번, 6번 문장","s":[[4,"When the writers submit the manuscripts, they only reveal the title.","그 작가들이 원고를 제출할 때, 그들은 제목만 밝힌다."],[6,"The only rule is that they cannot share their manuscripts with anyone, not even family members or editors.","유일한 규칙은 그들이 원고를 누구와도, 심지어 가족 구성원이나 편집자에게조차 공유할 수 없다는 것이다."]],"w":"공유하면 안 되는 원고(their manuscripts)를 가진 사람은 4번에서 원고를 제출하는 writers(작가들). 가족이나 편집자는 ‘공유하면 안 되는 대상’이에요.","c":3},"h":"de598c8dcc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"What stories may be waiting for future readers?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어떤 이야기들이 미래의 독자들을 기다리고 있을까?","opts":["100년 뒤 독자들이 어떤 이야기를 읽게 될지 궁금해하고 있다.","미래의 독자들이 이야기를 직접 쓰게 될 것이라고 말하고 있다.","미래의 독자들을 기다리는 이야기는 없다고 말하고 있다.","어떤 이야기도 남지 않을 것이라고 걱정하고 있다."],"r":{"a":"1) 100년 뒤 독자들이 어떤 이야기를 읽게 될지 궁금해하고 있다.","ev":"10번 문장","s":[[10,"What stories may be waiting for future readers?","어떤 이야기들이 미래의 독자들을 기다리고 있을까?"]],"w":"10번 문장 What stories may be waiting for future readers?는 ‘어떤 이야기들이 미래의 독자들을 기다리고 있을까?’라는 질문. 어떤 이야기일지 궁금해하는 뜻이고, 이야기가 없다고 단정하는 말은 아님.","c":1},"h":"a43da42623"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["이 프로젝트에는 작가 한 명만 참여한다.","작가들은 먼저 원고를 편집자에게 보여 줘야 한다.","그 도서관은 스웨덴에 있다.","미래 도서관 단체의 직원들조차 원고의 내용을 알지 못한다."],"opts":["Only one writer will join the project.","Writers must show their manuscripts to their editors first.","The library is in Sweden.","Even the staff at the Future Library Trust do not know the content of the manuscripts."],"r":{"a":"4) Even the staff at the Future Library Trust do not know the content of the manuscripts. (미래 도서관 단체의 직원들조차 원고의 내용을 알지 못한다.)","ev":"7번 문장","s":[[7,"The content isn’t known by the staff at the Future Library Trust either.","미래 도서관 단체의 직원도 그 내용을 알지 못한다."]],"w":"7번 문장 The content isn’t known by the staff at the Future Library Trust either(미래 도서관 단체의 직원도 그 내용을 알지 못한다)와 같은 내용. 여러 작가를 매년 초대하고(3번), 편집자에게도 공유할 수 없으며(6번), 도서관은 노르웨이에 있다(1번).","c":4},"h":"d64ac4f10f"},{"n":9,"t":"sum","q":"A library in Norway is working on a (A) (B) project.","ko":"노르웨이의 한 도서관은 (A) (B) 프로젝트를 진행하고 있다.","oko":["(A) 지루한 / (B) 한 세기 동안 지속되는","(A) 흥미로운 / (B) 하루짜리","(A) 지루한 / (B) 하루짜리","(A) 무서운 / (B) 한 세기 동안 지속되는","(A) 흥미로운 / (B) 한 세기 동안 지속되는"],"opts":["(A) boring / (B) century-long","(A) fascinating / (B) one-day","(A) boring / (B) one-day","(A) scary / (B) century-long","(A) fascinating / (B) century-long"],"r":{"a":"5) (A) fascinating / (B) century-long","ev":"1번 문장","s":[[1,"A library in Norway is working on a fascinating century-long project.","노르웨이의 한 도서관이 한 세기 동안 지속되는 흥미로운 프로젝트를 진행하고 있다."]],"w":"1번 A library in Norway is working on a fascinating century-long project(노르웨이의 한 도서관이 한 세기 동안 지속되는 흥미로운 프로젝트를 진행하고 있다)에서 가져옴. 그래서 fascinating과 century-long.","c":5},"h":"e094e7d5f9"},{"n":10,"t":"fill","q":"The hope is that in 100 years our [A] will still exist and still [B] reading.","ko":"바라는 바는 100년 후에 우리 [A]이(가) 여전히 존재하고 책을 읽는 것을 여전히 [B] 것이다.","bank":["society","enjoy","famous","unread","nearby","eventually"],"bko":{"society":"사회","enjoy":"즐기다","famous":"유명한","unread":"읽지 않은","nearby":"근처의","eventually":"마침내"},"r":{"a":"[A] society (사회), [B] enjoy (즐기다)","ev":"9번 문장","s":[[9,"The hope is that in 100 years our society will still exist and still enjoy reading.","바라는 바는 100년 후에 우리 사회가 여전히 존재하고 책을 읽는 것을 즐기는 것이다."]],"w":"9번 The hope is that in 100 years our society will still exist and still enjoy reading에서 가져옴. famous, unread, nearby, eventually는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"47030de90d"}]},{"u":1,"id":"rj3-01-4","no":4,"ko":"당신은 혼자가 아니에요","items":[{"n":1,"t":"tf","q":"Some national governments are working to make their citizens happier.","ko":"일부 중앙 정부는 시민들을 더 행복하게 만들기 위해 애쓰고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In fact, some national governments are working to make their citizens happier.","사실, 일부 중앙 정부는 그들의 시민들을 더 행복하게 만들기 위해 애쓰고 있다."]],"w":"2번 문장에 some national governments are working to make their citizens happier가 있음. 본문과 일치.","c":"T"},"h":"a1eec03409"},{"n":2,"t":"tf","q":"The UK has an official ministry of happiness like Bhutan and India.","ko":"영국은 부탄과 인도처럼 공식 행복 부처를 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"The United Arab Emirates, Bhutan, and India, for example, have official ministries of happiness.","예를 들어, 아랍에미리트와 부탄, 인도는 공식 행복 부처가 있다."],[4,"In the UK, on the other hand, the government is taking a slightly different approach.","반면에, 영국에서는 정부가 약간 다른 접근 방식을 취하고 있다."]],"w":"3번 문장에서 공식 행복 부처가 있는 나라는 아랍에미리트, 부탄, 인도이고, 4번 문장에서 영국은 약간 다른 접근 방식을 취한다고 함. 영국이 행복 부처를 가졌다는 말은 없음.","c":"F"},"h":"1ba029c5fa"},{"n":3,"t":"tf","q":"About 200,000 elderly people in the UK haven’t talked to any friends or relatives for more than a month.","ko":"영국의 약 200,000명의 노인들은 한 달 이상 어떤 친구나 친척과도 이야기하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"According to a study, about 200,000 elderly people in the UK haven’t spoken to any friends or relatives in more than a month.","한 연구에 따르면, 영국의 약 200,000명의 노인들이 한 달 이상 어떤 친구나 친척과도 말한 적이 없다."]],"w":"9번 문장에 about 200,000 elderly people in the UK haven’t spoken to any friends or relatives in more than a month가 있음. 본문과 일치.","c":"T"},"h":"4499dc93df"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Rather than promoting happiness, it is fighting unhappiness.)","ko":"행복을 promoting하기보다는, 그것은 불행과 맞서 싸우고 있다.","opts":["막다","고취하다","잊다","줄이다"],"word":"promoting","r":{"a":"2) 고취하다","ev":"5번 문장","s":[[5,"Rather than promoting happiness, it is fighting unhappiness.","행복을 고취하는 대신에, 그것은 불행과 맞서 싸우고 있다."]],"w":"5번은 다른 나라들이 행복을 높이는 쪽인 것과 대조해서 영국은 불행과 싸운다는 문장. 그래서 promote는 ‘고취하다, 촉진하다’.","c":2},"h":"71d7505124"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Because our high-tech society leads to less face-to-face contact, it threatens everyone.)","ko":"우리의 최첨단 사회가 더 적은 맞대면에 이르기 때문에, 그것은 모든 사람을 threatens한다.","opts":["돕다","웃게 하다","위협하다","가르치다"],"word":"threatens","r":{"a":"3) 위협하다","ev":"11번 문장","s":[[11,"Because our high-tech society leads to less face-to-face contact, it threatens everyone.","우리의 최첨단 사회가 더 적은 맞대면에 이르기 때문에, 그것은 모든 사람을 위협한다."]],"w":"11번 문장에서 대면 접촉이 줄면 외로움이 커지니 모든 사람에게 좋지 않은 영향을 준다는 흐름. threaten은 ‘위협하다’.","c":3},"h":"dcba26c1b7"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nIn 2018, the prime minister noted that loneliness affects millions of British people. So she appointed the first minister for loneliness.","ko":"밑줄 친 she가 가리키는 것은?","sko":"2018년에 수상은 외로움이 수백만 명의 영국인들에게 영향을 미치는 것에 주목했다. 그래서 그녀는 초대 외로움 담당 장관을 임명했다.","opts":["외로움 담당 장관","노인","연구자","수상"],"r":{"a":"4) 수상","ev":"6~7번 문장","s":[[6,"In 2018, the prime minister noted that loneliness affects millions of British people.","2018년에 수상은 외로움이 수백만 명의 영국인들에게 영향을 미치는 것에 주목했다."],[7,"So she appointed the first minister for loneliness.","그래서 그녀는 초대 외로움 담당 장관을 임명했다."]],"w":"장관을 임명한 사람이 she이고, 앞 문장에서 외로움에 주목한 사람은 the prime minister(수상). 외로움 담당 장관은 임명된 사람이라 she가 아님.","c":4},"h":"34f82265dc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The job of the minister for loneliness is to find ways to reach out to lonely people.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"외로움 담당 장관의 일은 외로운 사람들에게 접근하는 방법을 찾는 것이다.","opts":["장관의 일은 외로운 사람들에게 다가갈 방법을 찾는 것이다.","장관의 일은 외로운 사람들을 병원에 보내는 것이다.","장관의 일은 외로움에 대한 연구 결과를 발표하는 것이다.","장관의 일은 외로운 사람들에게서 벗어날 방법을 찾는 것이다."],"r":{"a":"1) 장관의 일은 외로운 사람들에게 다가갈 방법을 찾는 것이다.","ev":"8번 문장","s":[[8,"The job of the minister for loneliness is to find ways to reach out to lonely people.","외로움 담당 장관의 일은 외로운 사람들에게 접근하는 방법을 찾는 것이다."]],"w":"to find ways는 ‘방법을 찾는 것’, to reach out to lonely people은 ‘외로운 사람들에게 다가갈’. 병원, 연구 발표, 벗어나기는 본문에 없음.","c":1},"h":"0f036f7137"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["행복은 영국에서만 중요한 목표이다.","외로움은 노인에게만 영향을 미치는 것이 아니다.","영국에서 외로움은 노인에게만 영향을 미친다.","부탄에는 외로움 담당 장관이 있다."],"opts":["Happiness is an important goal only in the UK.","Loneliness affects not only older people.","Loneliness affects only elderly people in the UK.","Bhutan has a minister for loneliness."],"r":{"a":"2) Loneliness affects not only older people. (외로움은 노인에게만 영향을 미치는 것이 아니다.)","ev":"10번 문장","s":[[10,"Of course, loneliness doesn’t only affect older people.","물론, 외로움이 노인들에게만 영향을 미치는 것은 아니다."]],"w":"10번 문장 loneliness doesn’t only affect older people(외로움이 노인들에게만 영향을 미치는 것은 아니다)과 같은 내용. 1번(행복은 세계적 목표), 3번(아랍에미리트·부탄·인도는 행복 부처)과 달라서 나머지는 틀림.","c":2},"h":"2c86aef5f3"},{"n":9,"t":"sum","q":"Happiness is a (A) goal around the world, and the British government is working (B) to create a healthier, happier future.","ko":"행복은 전 세계에서 (A) 목표이고, 영국 정부는 더 건강하고 더 행복한 미래를 만들기 위해 (B) 일하고 있다.","oko":["(A) 드문 / (B) 열심히","(A) 공통의 / (B) 부주의하게","(A) 공통의 / (B) 열심히","(A) 드문 / (B) 부주의하게","(A) 비밀의 / (B) 열심히"],"opts":["(A) rare / (B) hard","(A) common / (B) carelessly","(A) common / (B) hard","(A) rare / (B) carelessly","(A) secret / (B) hard"],"r":{"a":"3) (A) common / (B) hard","ev":"1번, 12번 문장","s":[[1,"Happiness is a common goal around the world.","행복은 세계적으로 공통의 목표이다."],[12,"The British government is working hard to create a healthier, happier future for its citizens.","영국 정부는 시민들을 위한 더 건강하고 행복한 미래를 만들기 위해 열심히 일하고 있다."]],"w":"1번 Happiness is a common goal around the world(행복은 세계적으로 공통의 목표), 12번 working hard to create a healthier, happier future(더 건강하고 행복한 미래를 만들기 위해 열심히 일하고 있다)에서 가져옴.","c":3},"h":"b89f05ce54"},{"n":10,"t":"fill","q":"In the UK, on the other hand, the government is taking a [A] different [B].","ko":"반면에 영국에서는 정부가 [A] 다른 [B]을(를) 취하고 있다.","bank":["slightly","approach","reach","everyone","appointed","elderly"],"bko":{"slightly":"약간","approach":"접근 방식","reach":"닿다","everyone":"모든 사람","appointed":"임명했다(appoint의 과거형)","elderly":"나이가 지긋한"},"r":{"a":"[A] slightly (약간), [B] approach (접근 방식)","ev":"4번 문장","s":[[4,"In the UK, on the other hand, the government is taking a slightly different approach.","반면에, 영국에서는 정부가 약간 다른 접근 방식을 취하고 있다."]],"w":"4번 the government is taking a slightly different approach(정부가 약간 다른 접근 방식을 취하고 있다)에서 가져옴. reach, everyone, appointed, elderly는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"8508be27dc"}]},{"u":2,"id":"rj3-02-1","no":1,"ko":"이게 무슨 느낌이지?","items":[{"n":1,"t":"tf","q":"Stress, including extreme sadness, can activate the fight-or-flight response.","ko":"극심한 슬픔을 포함한 스트레스는 투쟁-도피 반응을 작동시킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This response is activated by stress, including extreme sadness.","이 반응은 극심한 슬픔을 포함한 스트레스에 의해 활성화된다."]],"w":"3번 문장에 This response is activated by stress, including extreme sadness가 있음. 본문과 일치.","c":"T"},"h":"8e4bcb0b98"},{"n":2,"t":"tf","q":"You can actually feel your throat opening wide.","ko":"당신은 목구멍이 크게 벌어지는 것을 실제로 느낄 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"You don’t actually feel this happen, but you can sense a change in the throat’s muscles.","당신은 실제로 이런 일이 발생한다고 느끼지 않지만, 목구멍의 근육에 변화를 느낄 수 있다."]],"w":"8번 문장에서 이런 일이 일어나는 것을 실제로는 느끼지 못하고(You don’t actually feel this happen), 근육의 변화만 느낄 수 있다고 함. 본문과 반대.","c":"F"},"h":"387b854f81"},{"n":3,"t":"tf","q":"Your brain sends a message to your throat to open wide.","ko":"당신의 뇌는 목구멍에 크게 벌리라는 메시지를 보낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Your brain sends a message to your throat, telling it to open wide.","당신의 뇌는 목구멍으로 메시지를 보내서 크게 벌리라고 말한다."]],"w":"6번 문장에 Your brain sends a message to your throat, telling it to open wide가 있음. 본문과 일치.","c":"T"},"h":"343ef0271c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Your brain thinks you might need to fight or run away soon, so it wants to deliver oxygen to your muscles.)","ko":"뇌는 곧 싸우거나 도망쳐야 할지도 모른다고 생각해서, 근육에 산소를 deliver하고 싶어 한다.","opts":["빼앗다","막다","전달하다","만들다"],"word":"deliver","r":{"a":"3) 전달하다","ev":"4번 문장","s":[[4,"Your brain thinks you might need to fight or run away soon, so it wants to deliver oxygen to your muscles.","당신의 뇌는 당신이 곧 싸우거나 도망쳐야 할지도 모른다고 생각해서, 그것은 당신의 근육에 산소를 전달하고 싶어 한다."]],"w":"4번 문장은 싸우거나 도망칠 때 근육에 산소가 필요하다는 흐름이라 deliver는 ‘전달하다’. 5번에서 그 산소를 몸 안으로 들여오는 이야기가 이어짐.","c":3},"h":"a151a95e5f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You don’t actually feel this happen, but you can sense a change in the throat’s muscles.)","ko":"당신은 이런 일이 일어나는 것을 실제로 느끼지 못하지만, 목구멍 근육의 변화를 sense할 수 있다.","opts":["지우다","느끼다","믿다","피하다"],"word":"sense","r":{"a":"2) 느끼다","ev":"8번 문장","s":[[8,"You don’t actually feel this happen, but you can sense a change in the throat’s muscles.","당신은 실제로 이런 일이 발생한다고 느끼지 않지만, 목구멍의 근육에 변화를 느낄 수 있다."]],"w":"8번 문장에서 but 앞은 ‘느끼지 못한다’, but 뒤는 ‘근육의 변화를 알아챌 수 있다’는 대조. sense는 ‘느끼다, 감지하다’.","c":2},"h":"f9aeffc387"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nWhen you’re about to cry, you may get a strange feeling like there’s a lump in your throat. The reason for this is your body’s fight-or-flight response.","ko":"밑줄 친 this가 가리키는 것은?","sko":"당신이 울려고 할 때 당신의 목구멍에 덩어리가 있는 것 같은 이상한 느낌을 받을 수 있다. 이것의 이유는 당신 몸의 투쟁-도피 반응 때문이다.","opts":["극심한 슬픔","몸의 투쟁-도피 반응","목구멍에 덩어리가 있는 것 같은 이상한 느낌","산소를 근육에 보내는 것"],"r":{"a":"3) 목구멍에 덩어리가 있는 것 같은 이상한 느낌","ev":"1~2번 문장","s":[[1,"When you’re about to cry, you may get a strange feeling like there’s a lump in your throat.","당신이 울려고 할 때 당신의 목구멍에 덩어리가 있는 것 같은 이상한 느낌을 받을 수 있다."],[2,"The reason for this is your body’s fight-or-flight response.","이것의 이유는 당신 몸의 투쟁-도피 반응 때문이다."]],"w":"1번 문장에서 울려고 할 때 목구멍에 덩어리가 있는 것 같은 이상한 느낌을 받는다고 했고, 2번 The reason for this is…(이것의 이유는…)의 this가 그 느낌을 가리킴.","c":3,"k":"this = 목구멍에 덩어리가 있는 것 같은 이상한 느낌"},"pron":"this","h":"988bf849e6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There isn’t anything in your throat.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신의 목구멍에는 아무것도 없다.","opts":["목구멍에는 실제로 아무것도 없다.","목구멍에 작은 덩어리가 하나 있다.","목구멍에 물이 가득 차 있다.","목구멍이 이미 다 나았다."],"r":{"a":"1) 목구멍에는 실제로 아무것도 없다.","ev":"11번 문장","s":[[11,"There isn’t anything in your throat.","당신의 목구멍에는 아무것도 없다."]],"w":"11번 문장 There isn’t anything in your throat은 ‘목구멍에는 아무것도 없다’는 뜻. 덩어리 같은 느낌은 있지만 실제로 걸린 것은 없음.","c":1},"h":"34d77a971d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["목구멍의 덩어리는 실제로 있는 물체이다.","투쟁-도피 반응은 행복할 때만 일어난다.","뇌는 먼저 몸 안으로 산소를 들여와야 한다.","뇌는 근육이 아니라 위에 산소를 보내고 싶어 한다."],"opts":["The lump in your throat is a real object.","The fight-or-flight response happens only when you are happy.","The brain first needs to bring oxygen into your body.","The brain wants to send oxygen to your stomach, not your muscles."],"r":{"a":"3) The brain first needs to bring oxygen into your body. (뇌는 먼저 몸 안으로 산소를 들여와야 한다.)","ev":"5번 문장","s":[[5,"To do this, it must first bring oxygen into your body.","이것을 하기 위해서 그것(뇌)은 먼저 당신의 몸으로 산소를 공급해야 한다."]],"w":"5번 문장 it must first bring oxygen into your body(그것은 먼저 몸으로 산소를 공급해야 한다)와 같은 내용. 덩어리는 실제로 없고(11번), 반응은 스트레스로 활성화되며(3번), 산소는 근육으로 보낸다(4번)고 했으니 나머지는 틀림.","c":3},"h":"38b7b78771"},{"n":9,"t":"sum","q":"Your body is just doing its (A), so the next time you get this feeling, don’t (B).","ko":"당신의 몸은 단지 제 (A)을(를) 하고 있을 뿐이므로, 다음에 이런 느낌이 들면 (B) 마라.","oko":["(A) 휴가 / (B) 걱정하지","(A) 역할 / (B) 수영하지","(A) 역할 / (B) 걱정하지","(A) 휴가 / (B) 수영하지","(A) 비밀 / (B) 걱정하지"],"opts":["(A) holiday / (B) worry","(A) job / (B) swim","(A) job / (B) worry","(A) holiday / (B) swim","(A) secret / (B) worry"],"r":{"a":"3) (A) job / (B) worry","ev":"10번, 12번 문장","s":[[10,"So the next time this occurs, don’t worry.","그러니 다음에 이런 일이 발생하면, 걱정하지 말아라."],[12,"Your body is just doing its job.","당신의 몸은 단지 제 역할을 하고 있을 뿐이다."]],"w":"10번 So the next time this occurs, don’t worry(다음에 이런 일이 생기면 걱정하지 말아라), 12번 Your body is just doing its job(당신의 몸은 단지 제 역할을 하고 있을 뿐이다)에서 가져옴.","c":3},"h":"3d4d00385c"},{"n":10,"t":"fill","q":"This is what [A] the lump-like [B].","ko":"이것이 바로 덩어리 같은 [B]을(를) [A] 것이다.","bank":["causes","sensation","enter","wide","actually","next"],"bko":{"causes":"일으키다(cause의 3인칭 단수형)","sensation":"느낌","enter":"들어가다","wide":"넓게","actually":"실제로","next":"다음의"},"r":{"a":"[A] causes (일으키다(cause의 3인칭 단수형)), [B] sensation (느낌)","ev":"9번 문장","s":[[9,"This is what causes the lump-like sensation.","이것이 그 덩어리 같은 느낌을 일으키는 것이다."]],"w":"9번 This is what causes the lump-like sensation(이것이 덩어리 같은 느낌을 일으키는 것이다)에서 가져옴. enter, wide, actually, next는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"83804802d8"}]},{"u":2,"id":"rj3-02-2","no":2,"ko":"아기들에게 더 많은 것은?","items":[{"n":1,"t":"tf","q":"When you were born, you had fewer bones than you have now.","ko":"당신은 태어났을 때 지금보다 더 적은 뼈를 가지고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"However, when you were born, you had a lot more bones!","하지만, 당신은 태어났을 때, 훨씬 더 많은 뼈를 가지고 있었다!"]],"w":"3번 문장에서 태어났을 때는 a lot more bones(훨씬 더 많은 뼈)를 가지고 있었다고 함. 본문과 반대.","c":"F"},"h":"e63aafeafa"},{"n":2,"t":"tf","q":"As a baby grows, some bones join together and become one bone.","ko":"아기가 자라면서 몇몇 뼈들은 합쳐져 하나의 뼈가 된다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"As a baby grows, some bones join together and become one bone.","아기가 자라면서, 몇몇 뼈들은 합쳐져 하나의 뼈가 된다."]],"w":"6번 문장에 As a baby grows, some bones join together and become one bone이 있음. 본문과 일치.","c":"T"},"h":"a3eb5cc372"},{"n":3,"t":"tf","q":"The joining of bones does not happen in places other than the skull.","ko":"뼈가 합쳐지는 일은 두개골 이외의 곳에서는 일어나지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"This also happens in other places, such as the spine.","이것은 또한 척추 같은 다른 장소들에서도 일어난다."]],"w":"10번 문장에서 이런 일은 척추 같은 다른 곳에서도 일어난다(also happens in other places, such as the spine)고 함. 본문과 다름.","c":"F"},"h":"d799f8e923"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Because of these changes, the number of bones continues decreasing until you have about 206.)","ko":"이러한 변화들 때문에, 뼈의 개수는 당신이 약 206개를 가질 때까지 계속 decreasing한다.","opts":["늘어나다","줄어들다","멈추다","나타나다"],"word":"decreasing","r":{"a":"2) 줄어들다","ev":"11번 문장","s":[[11,"Because of these changes, the number of bones continues decreasing until you have about 206.","이러한 변화들 때문에, 뼈의 개수는 당신이 약 206개를 가질 때까지 계속 줄어든다."]],"w":"11번 문장에서 300개 정도에서 206개가 될 때까지라고 했으니 뼈의 수가 ‘줄어든다’는 뜻. 13번에도 the number has decreased가 나옴.","c":2},"h":"ecf5b4e59e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A newborn baby has about 300 bones.)","ko":"newborn 아기는 약 300개의 뼈를 가지고 있다.","opts":["건강한","울고 있는","갓 태어난","귀여운"],"word":"newborn","r":{"a":"3) 갓 태어난","ev":"4번 문장","s":[[4,"A newborn baby has about 300 bones.","갓난아기는 약 300개의 뼈를 가지고 있다."]],"w":"3번에서 태어났을 때(when you were born) 더 많은 뼈를 가졌다고 하고, 4번에서 newborn baby가 300개라고 함. newborn은 ‘갓 태어난’.","c":3},"h":"0f0afd4a8b"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nFor example, a baby’s skull has many bones. This protects the baby’s head when it gets pressed and squeezed during childbirth.","ko":"밑줄 친 This가 가리키는 것은?","sko":"예를 들어, 아기의 두개골은 많은 뼈를 가지고 있다. 이것은 아기의 머리가 출산 동안 눌려지고 밀어 넣어질 때 그것을 보호한다.","opts":["두개골이 하나로 자라는 것","뼈가 206개인 것","아기가 태어나는 것","아기의 두개골에 뼈가 많은 것"],"r":{"a":"4) 아기의 두개골에 뼈가 많은 것","ev":"7~8번 문장","s":[[7,"For example, a baby’s skull has many bones.","예를 들어, 아기의 두개골은 많은 뼈를 가지고 있다."],[8,"This protects the baby’s head when it gets pressed and squeezed during childbirth.","이것은 아기의 머리가 출산 동안 눌려지고 밀어 넣어질 때 그것을 보호한다."]],"w":"This는 바로 앞 문장 7번의 ‘아기의 두개골에 뼈가 많은 것’. 뼈가 많은 덕분에 출산 때 눌리고 밀려도 머리를 보호할 수 있음.","c":4},"h":"5f32acb87c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, over time, the skull slowly grows together.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나, 시간이 흐르면서, 두개골은 천천히 자라서 하나로 된다.","opts":["시간이 지나면서 두개골이 천천히 하나로 붙는다.","시간이 지나면서 두개골이 천천히 여러 조각으로 갈라진다.","두개골은 태어날 때부터 하나의 뼈이다.","두개골은 시간이 지나면서 점점 부드러워진다."],"r":{"a":"1) 시간이 지나면서 두개골이 천천히 하나로 붙는다.","ev":"9번 문장","s":[[9,"However, over time, the skull slowly grows together.","그러나, 시간이 흐르면서, 두개골은 천천히 자라서 하나로 된다."]],"w":"9번 문장 over time(시간이 지나면서), the skull slowly grows together(두개골은 천천히 자라서 하나로 된다)는 여러 조각이던 두개골이 천천히 붙는다는 뜻.","c":1},"h":"1313254cbd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["뼈의 수는 약 206개가 될 때까지 계속 늘어난다.","사람은 태어날 때 약 206개의 뼈를 가지고 있다.","십 대와 어른은 아마 206개의 뼈를 가지고 있을 것이다.","어른은 약 300개의 뼈를 가지고 있다."],"opts":["The number of bones keeps increasing until you have about 206.","People are born with about 206 bones.","Teenagers and adults probably have 206 bones.","Adults have about 300 bones."],"r":{"a":"3) Teenagers and adults probably have 206 bones. (십 대와 어른은 아마 206개의 뼈를 가지고 있을 것이다.)","ev":"2번 문장","s":[[2,"If you are a teenager or older, you probably have 206.","만약 당신이 십 대거나 더 나이가 많다면, 당신은 아마 206개를 가지고 있을 것이다."]],"w":"2번 문장 If you are a teenager or older, you probably have 206(십 대거나 더 나이가 많다면 아마 206개를 가지고 있을 것이다)과 같은 내용. 갓난아기가 약 300개(4번)이고 자라면서 줄어드니(5번) 나머지는 틀림.","c":3},"h":"71e3ee10e1"},{"n":9,"t":"sum","q":"You have fewer bones than a baby, but you don’t need to be (A) because your bones have become (B).","ko":"당신은 아기보다 뼈가 더 적지만, 뼈가 (B) 되었기 때문에 (A)할 필요는 없다.","oko":["(A) 슬퍼 / (B) 더 약해지게","(A) 행복해 / (B) 더 강해지게","(A) 슬퍼 / (B) 더 강해지게","(A) 행복해 / (B) 더 약해지게","(A) 슬퍼 / (B) 더 짧아지게"],"opts":["(A) sad / (B) weaker","(A) happy / (B) stronger","(A) sad / (B) stronger","(A) happy / (B) weaker","(A) sad / (B) shorter"],"r":{"a":"3) (A) sad / (B) stronger","ev":"12~13번 문장","s":[[12,"Don’t be too sad.","너무 슬퍼하지 마라."],[13,"Even though the number has decreased, your bones have surely gotten stronger!","비록 개수는 감소했을지라도, 당신의 뼈는 확실히 더 강해졌다!"]],"w":"12번 Don’t be too sad(너무 슬퍼하지 마라), 13번 your bones have surely gotten stronger(당신의 뼈는 확실히 더 강해졌다)에서 가져옴. 그래서 sad와 stronger.","c":3},"h":"b0b43d80c3"},{"n":10,"t":"fill","q":"Do you [A] how many bones are in your [B]?","ko":"당신은 당신의 [B]에 몇 개의 뼈가 있는지 [A] 있는가?","bank":["know","body","together","slowly","surely","protects"],"bko":{"know":"알다","body":"몸","together":"함께","slowly":"천천히","surely":"확실히","protects":"보호하다(protect의 3인칭 단수형)"},"r":{"a":"[A] know (알다), [B] body (몸)","ev":"1번 문장","s":[[1,"Do you know how many bones are in your body?","당신은 당신의 몸에 몇 개의 뼈가 있는지 알고 있는가?"]],"w":"1번 Do you know how many bones are in your body?(당신은 당신의 몸에 몇 개의 뼈가 있는지 알고 있는가?)에서 가져옴. together, slowly, surely, protects는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"5b33677878"}]},{"u":2,"id":"rj3-02-3","no":3,"ko":"내 미모의 비결은 새우","items":[{"n":1,"t":"tf","q":"Flamingos are born with gray feathers.","ko":"홍학은 회색 깃털을 가지고 태어난다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"However, they are born with gray feathers.","하지만, 그들은 회색 깃털을 가지고 태어난다."]],"w":"2번 문장에 they are born with gray feathers가 있음. 본문과 일치.","c":"T"},"h":"723ea54199"},{"n":2,"t":"tf","q":"The color of an adult flamingo has nothing to do with the food it eats.","ko":"다 자란 홍학의 색은 그것이 먹는 먹이와 아무 관계가 없다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Adult flamingos are pink, orange, or white depending on the type of food that they eat.","다 자란 홍학은 그들이 먹는 먹이의 종류에 따라 분홍색이나 주황색, 흰색이다."]],"w":"4번 문장에서 다 자란 홍학의 색은 먹는 먹이의 종류에 따라(depending on the type of food) 달라진다고 함. 본문과 반대.","c":"F"},"h":"60d7a2d223"},{"n":3,"t":"tf","q":"Flamingos near the sea can be more colorful than flamingos near lakes.","ko":"바다 근처의 홍학은 호수 근처의 홍학보다 더 색채가 풍부할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"So you can see more colorful flamingos near the sea than near lakes.","그래서 당신은 호수 근처에서보다 바다 근처에서 더 색채가 풍부한 홍학을 볼 수 있다."]],"w":"9번 문장에 you can see more colorful flamingos near the sea than near lakes가 있음. 본문과 일치.","c":"T"},"h":"335289b5c8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Because of their beautiful feathers, flamingos are one of the most recognizable birds on Earth.)","ko":"아름다운 깃털 때문에 홍학은 지구에서 가장 recognizable한 새들 중 하나이다.","opts":["위험한","쉽게 알아볼 수 있는","흔하지 않은","조용한"],"word":"recognizable","r":{"a":"2) 쉽게 알아볼 수 있는","ev":"1번 문장","s":[[1,"Because of their beautiful feathers, flamingos are one of the most recognizable birds on Earth.","홍학은 아름다운 깃털 때문에 지구에서 가장 눈에 띄는 새들 중 하나이다."]],"w":"1번 문장은 아름다운 깃털 때문에 홍학이 눈에 띈다는 흐름이라 recognizable은 ‘쉽게 알아볼 수 있는’.","c":2},"h":"a7f468a2fb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (this pigment becomes a pink or orange color and then gets stored in the flamingos’ legs, bills, and feathers)","ko":"이 색소는 분홍색이나 주황색이 되고 그러고 나서 홍학의 다리와 부리, 깃털 속에 stored된다.","opts":["버려진","씻겨진","저장된","색칠된"],"word":"stored","r":{"a":"3) 저장된","ev":"7번 문장","s":[[7,"After flamingos eat these foods, this pigment becomes a pink or orange color and then gets stored in the flamingos’ legs, bills, and feathers.","홍학이 이 먹이들을 먹고 나면, 이 색소는 분홍색이나 주황색이 되고 그러고 나서 홍학의 다리와 부리, 깃털 속에 저장된다."]],"w":"7번 문장은 색소가 다리, 부리, 깃털 속에 ‘남아 있게 된다’는 흐름. gets stored는 ‘저장된다’.","c":3},"h":"68d1a8004a"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nMany other foods that people eat, like carrots and watermelons, also contain this pigment. However, people do not eat enough of them to change their skin color.","ko":"밑줄 친 them이 가리키는 것은?","sko":"당근과 수박 같은 사람들이 먹는 많은 다른 음식들도 또한 이 색소를 함유한다. 하지만, 사람들은 피부색을 바꿀 정도로 그것들의 충분한 양을 먹지는 않는다.","opts":["홍학들","당근과 수박 같은 음식들","사람들의 피부색","바다 생물들"],"r":{"a":"2) 당근과 수박 같은 음식들","ev":"10~11번 문장","s":[[10,"Many other foods that people eat, like carrots and watermelons, also contain this pigment.","당근과 수박 같은 사람들이 먹는 많은 다른 음식들도 또한 이 색소를 함유한다."],[11,"However, people do not eat enough of them to change their skin color.","하지만, 사람들은 피부색을 바꿀 정도로 그것들의 충분한 양을 먹지는 않는다."]],"w":"10번 문장에서 사람들이 먹는 다른 음식으로 carrots and watermelons(당근과 수박)를 들었고, 11번의 them(그것들)은 그 음식들을 가리킴.","c":2,"k":"them = 당근과 수박 같은 음식들"},"pron":"them","h":"0fb60b18ba"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The more of these sea creatures and plants flamingos eat, the pinker or more orange they become.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"홍학이 더 많은 이런 바다 생물과 식물들을 먹을수록, 그들은 더 진한 분홍색이나 주황색이 된다.","opts":["이런 바다 생물과 식물을 많이 먹을수록 더 진한 분홍색이나 주황색이 된다.","이런 바다 생물과 식물을 많이 먹을수록 점점 하얗게 변한다.","더 분홍색일수록 이런 바다 생물과 식물을 더 많이 먹는다.","이런 바다 생물과 식물을 적게 먹을수록 더 주황색이 된다."],"r":{"a":"1) 이런 바다 생물과 식물을 많이 먹을수록 더 진한 분홍색이나 주황색이 된다.","ev":"8번 문장","s":[[8,"The more of these sea creatures and plants flamingos eat, the pinker or more orange they become.","홍학이 더 많은 이런 바다 생물과 식물들을 먹을수록, 그들은 더 진한 분홍색이나 주황색이 된다."]],"w":"the + 비교급 ~, the + 비교급 …은 ‘~할수록 더 …하다’. 많이 먹는 것이 원인이고 더 진한 색이 결과임. 3번은 원인과 결과가 거꾸로이고 2번과 4번은 본문과 반대.","c":1},"h":"fc96fffc9f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["홍학은 분홍색으로 태어나서 회색으로 변한다.","새우와 해초는 홍학이 가장 좋아하는 먹이 중 일부이다.","홍학은 바다 생물을 먹지 않는다.","사람이 당근을 먹으면 피부색이 바뀐다."],"opts":["Flamingos are born pink and then turn gray.","Shrimp and seaweed are some of the foods flamingos like best.","Flamingos do not eat sea creatures.","People change their skin color when they eat carrots."],"r":{"a":"2) Shrimp and seaweed are some of the foods flamingos like best. (새우와 해초는 홍학이 가장 좋아하는 먹이 중 일부이다.)","ev":"5번 문장","s":[[5,"Some of their favorite foods are small sea creatures and plants such as shrimp and seaweed.","그들이 가장 좋아하는 먹이 중 몇몇은 새우와 해초 같은 작은 바다 생물과 식물이다."]],"w":"5번 문장 Some of their favorite foods are small sea creatures and plants such as shrimp and seaweed(가장 좋아하는 먹이 중 일부는 새우와 해초 같은 작은 바다 생물과 식물)와 같은 내용. 홍학은 회색 깃털로 태어나고(2번), 바다 생물을 먹으며(5번), 사람은 피부색이 바뀔 만큼 먹지 않는다(11번).","c":2},"h":"a38db07eef"},{"n":9,"t":"sum","q":"Adult flamingos are pink, orange, or (A), depending on the (B) of food that they eat.","ko":"다 자란 홍학은 그들이 먹는 먹이의 (B)에 따라 분홍색이나 주황색, 또는 (A)이다.","oko":["(A) 검은색 / (B) 종류","(A) 흰색 / (B) 가격","(A) 흰색 / (B) 종류","(A) 검은색 / (B) 가격","(A) 파란색 / (B) 종류"],"opts":["(A) black / (B) type","(A) white / (B) price","(A) white / (B) type","(A) black / (B) price","(A) blue / (B) type"],"r":{"a":"3) (A) white / (B) type","ev":"4번 문장","s":[[4,"Adult flamingos are pink, orange, or white depending on the type of food that they eat.","다 자란 홍학은 그들이 먹는 먹이의 종류에 따라 분홍색이나 주황색, 흰색이다."]],"w":"4번 Adult flamingos are pink, orange, or white depending on the type of food that they eat(다 자란 홍학은 먹는 먹이의 종류에 따라 분홍색이나 주황색, 흰색이다)에서 가져옴. 그래서 white와 type.","c":3},"h":"a2b7ad23d8"},{"n":10,"t":"fill","q":"These foods contain a [A] pigment that gives plants and [B] their color.","ko":"이 먹이들은 식물과 [B]에게 색을 주는 [A] 색소를 함유한다.","bank":["special","animals","depending","because","eat","become"],"bko":{"special":"특별한","animals":"동물들","depending":"~에 따라","because":"~때문에","eat":"먹다","become":"되다"},"r":{"a":"[A] special (특별한), [B] animals (동물들)","ev":"6번 문장","s":[[6,"These foods contain a special pigment that gives plants and animals their color.","이 먹이들은 동식물에 색을 주는 특별한 색소를 함유한다."]],"w":"6번 These foods contain a special pigment that gives plants and animals their color(이 먹이들은 동식물에 색을 주는 특별한 색소를 함유한다)에서 가져옴. depending, because, eat, become은 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"e53b2e5535"}]},{"u":2,"id":"rj3-02-4","no":4,"ko":"눈으로 말해요","items":[{"n":1,"t":"tf","q":"Bodyguards may wear sunglasses because they don’t want people to know where they are looking.","ko":"경호원들은 사람들이 그들이 어디를 보고 있는지 알기를 원하지 않아서 선글라스를 쓸지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"So, one of the reasons they wear sunglasses may be that they don’t want people to know where they are looking.","그래서 그들이 선글라스를 쓰는 이유 중 하나는 사람들이 그들이 어디를 보고 있는지 알기를 원하지 않기 때문일 수 있다."]],"w":"4번 문장에 they don’t want people to know where they are looking이 있음. 본문과 일치.","c":"T"},"h":"4735228cf3"},{"n":2,"t":"tf","q":"The white parts of chimpanzees’ eyes are larger than those of humans.","ko":"침팬지 눈의 흰자위는 사람의 눈의 흰자위보다 크다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"This is because the white parts of other primates’ eyes are so small that we can’t easily see their eye movements.","이는 다른 영장류의 눈의 흰자위가 매우 작아서 우리가 그들의 눈 움직임을 쉽게 볼 수 없기 때문이다."],[7,"On the other hand, the white parts of humans’ eyes are large.","반면에, 사람의 눈의 흰자위는 크다."]],"w":"6번에서 다른 영장류의 흰자위는 매우 작다고 하고, 7번에서 사람의 흰자위는 크다고 함. 본문과 반대.","c":"F"},"h":"a2baf6eb5c"},{"n":3,"t":"tf","q":"When we see what a person is looking at, we can guess what they plan to do next.","ko":"우리가 어떤 사람이 보고 있는 것을 볼 때, 우리는 그들이 다음에 무엇을 할 계획인지 추측할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"When we see what a person is looking at, we can guess what they are thinking and what they plan to do next.","우리가 어떤 사람이 보고 있는 것을 볼 때, 우리는 그들이 무엇을 생각하고 있는지와 다음에 무엇을 할 계획인지 추측할 수 있다."]],"w":"9번 문장에 we can guess what they are thinking and what they plan to do next가 있음. 본문과 일치.","c":"T"},"h":"9e4f710544"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When you see bodyguards, you’ll notice that they often wear dark sunglasses.)","ko":"경호원들을 보면 당신은 그들이 종종 어두운 선글라스를 쓰고 있다는 것을 notice할 것이다.","opts":["잊어버리다","알아차리다","무시하다","설명하다"],"word":"notice","r":{"a":"2) 알아차리다","ev":"1번 문장","s":[[1,"When you see bodyguards, you’ll notice that they often wear dark sunglasses.","경호원들을 보면 당신은 그들이 종종 어두운 선글라스를 쓰고 있다는 것을 알아차릴 것이다."]],"w":"1번 문장은 경호원을 보면 그들이 선글라스를 쓰고 있다는 사실이 눈에 들어온다는 흐름. notice는 ‘알아차리다’.","c":2},"h":"97b6d727f7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That’s probably why human eyes evolved to have large white parts.)","ko":"그것이 아마 사람의 눈이 큰 흰자위를 갖도록 evolved한 이유일 것이다.","opts":["숨었다","화났다","진화했다","도망쳤다"],"word":"evolved","r":{"a":"3) 진화했다","ev":"11번 문장","s":[[11,"That’s probably why human eyes evolved to have large white parts.","그것이 아마 사람의 눈이 진화하여 큰 흰자위를 갖게 된 이유일 것이다."]],"w":"11번은 협력하기 쉬우려고 사람의 눈이 큰 흰자위를 갖게 되었다는 결론. 오랜 시간에 걸쳐 변해 왔다는 뜻이라 evolve는 ‘진화하다’.","c":3},"h":"e8a86ef2f3"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nHowever, if chimpanzees were bodyguards, they wouldn’t need sunglasses! This is because the white parts of other primates’ eyes are so small that we can’t easily see their eye movements.","ko":"밑줄 친 This가 가리키는 것은?","sko":"그러나 만약 침팬지가 경호원이라면, 그들은 선글라스가 필요 없을 것이다! 이는 다른 영장류의 눈의 흰자위가 매우 작아서 우리가 그들의 눈 움직임을 쉽게 볼 수 없기 때문이다.","opts":["사람의 눈의 흰자위가 큰 것","경호원이 어두운 선글라스를 쓰는 것","우리가 침팬지의 눈 움직임을 쉽게 보는 것","침팬지가 경호원이라면 선글라스가 필요 없을 것이라는 것"],"r":{"a":"4) 침팬지가 경호원이라면 선글라스가 필요 없을 것이라는 것","ev":"5~6번 문장","s":[[5,"However, if chimpanzees were bodyguards, they wouldn’t need sunglasses!","그러나 만약 침팬지가 경호원이라면, 그들은 선글라스가 필요 없을 것이다!"],[6,"This is because the white parts of other primates’ eyes are so small that we can’t easily see their eye movements.","이는 다른 영장류의 눈의 흰자위가 매우 작아서 우리가 그들의 눈 움직임을 쉽게 볼 수 없기 때문이다."]],"w":"5번 문장에서 침팬지가 경호원이라면 선글라스가 필요 없을 것이라고 했고, 6번 This is because…(이는 …때문이다)의 This가 그 내용을 가리킴. 침팬지는 눈의 흰자위가 작아서 눈 움직임이 잘 안 보이기 때문.","c":4,"k":"This = 침팬지가 경호원이라면 선글라스가 필요 없을 것이라는 것"},"pron":"This","h":"a0827559e0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This allows us to see where a person’s eyes are pointed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 우리가 사람의 눈이 향해 있는 곳을 볼 수 있게 한다.","opts":["우리가 다른 사람의 눈을 손가락으로 가리킬 수 있게 한다.","우리가 사람의 눈을 더 크게 볼 수 있게 한다.","우리가 사람의 눈이 어디를 향하고 있는지 볼 수 있게 한다.","사람들이 자신의 눈이 향한 곳을 숨길 수 있게 한다."],"r":{"a":"3) 우리가 사람의 눈이 어디를 향하고 있는지 볼 수 있게 한다.","ev":"7~8번 문장","s":[[7,"On the other hand, the white parts of humans’ eyes are large.","반면에, 사람의 눈의 흰자위는 크다."],[8,"This allows us to see where a person’s eyes are pointed.","이는 우리가 사람의 눈이 향해 있는 곳을 볼 수 있게 한다."]],"w":"allow A to-v는 ‘A가 ~하게 하다’, where a person’s eyes are pointed는 ‘사람의 눈이 향해 있는 곳’. This는 7번의 큰 흰자위라서 눈이 향하는 곳이 잘 보인다는 뜻.","c":3},"h":"90a273b172"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["침팬지의 눈 움직임은 우리가 보기 쉽다.","우리의 눈은 우리의 주의가 어디에 있는지 다른 사람들에게 보여 줄 수 있다.","경호원은 자신이 어디를 보는지 보여 주려고 선글라스를 쓴다.","사람의 눈에는 작은 흰자위가 있다."],"opts":["Chimpanzees’ eye movements are easy for us to see.","Our eyes can show other people where our attention is.","Bodyguards wear sunglasses to show where they are looking.","Human eyes have small white parts."],"r":{"a":"2) Our eyes can show other people where our attention is. (우리의 눈은 우리의 주의가 어디에 있는지 다른 사람들에게 보여 줄 수 있다.)","ev":"3번 문장","s":[[3,"Our eyes clearly show where our focus lies.","우리의 눈은 우리의 초점이 어디에 있는지를 분명히 보여준다."]],"w":"3번 문장 Our eyes clearly show where our focus lies(우리의 눈은 우리의 초점이 어디에 있는지 분명히 보여 준다)와 같은 내용. 침팬지의 눈 움직임은 보기 어렵고(6번), 경호원은 보이지 않으려고 쓰며(4번), 사람의 흰자위는 크다(7번).","c":2},"h":"9e73f0c281"},{"n":9,"t":"sum","q":"When we see what a person is looking at, we can guess what they are thinking, and this helps us (A) (B) more easily.","ko":"우리가 어떤 사람이 보고 있는 것을 볼 때 그들의 생각을 추측할 수 있고, 이는 우리가 더 쉽게 (B) (A) 도록 돕는다.","oko":["(A) 일하 / (B) 혼자","(A) 다투 / (B) 함께","(A) 일하 / (B) 함께","(A) 다투 / (B) 혼자","(A) 잠자 / (B) 함께"],"opts":["(A) work / (B) alone","(A) argue / (B) together","(A) work / (B) together","(A) argue / (B) alone","(A) sleep / (B) together"],"r":{"a":"3) (A) work / (B) together","ev":"9~10번 문장","s":[[9,"When we see what a person is looking at, we can guess what they are thinking and what they plan to do next.","우리가 어떤 사람이 보고 있는 것을 볼 때, 우리는 그들이 무엇을 생각하고 있는지와 다음에 무엇을 할 계획인지 추측할 수 있다."],[10,"This helps us work together more easily.","이는 우리가 더 쉽게 함께 일하도록 돕는다."]],"w":"9번에서 다른 사람이 보는 것을 보면 그의 생각을 추측할 수 있다고 했고, 10번 This helps us work together more easily(이는 우리가 더 쉽게 함께 일하도록 돕는다)에서 가져옴. 그래서 work와 together.","c":3},"h":"6eec790ce7"},{"n":10,"t":"fill","q":"Our eyes [A] show where our [B] lies.","ko":"우리의 눈은 우리의 [B]이(가) 어디에 있는지 [A] 보여 준다.","bank":["clearly","focus","allows","because","pointed","wearing"],"bko":{"clearly":"분명히","focus":"초점","allows":"허락하다(allow의 3인칭 단수형)","because":"~때문에","pointed":"향해 있는","wearing":"입고 있는"},"r":{"a":"[A] clearly (분명히), [B] focus (초점)","ev":"3번 문장","s":[[3,"Our eyes clearly show where our focus lies.","우리의 눈은 우리의 초점이 어디에 있는지를 분명히 보여준다."]],"w":"3번 Our eyes clearly show where our focus lies(우리의 눈은 우리의 초점이 어디에 있는지 분명히 보여 준다)에서 가져옴. allows, because, pointed, wearing는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"fca2216d13"}]},{"u":3,"id":"rj3-03-1","no":1,"ko":"어디선가 진동이!","items":[{"n":1,"t":"tf","q":"Phantom vibration syndrome is a kind of illusion that fools the brain and body.","ko":"유령 진동 증후군은 뇌와 몸을 속이는 일종의 착각이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Phantom vibration syndrome is a kind of illusion that fools the brain and body.","유령 진동 증후군은 뇌와 몸을 속이는 일종의 착각이다."]],"w":"5번 문장에 a kind of illusion that fools the brain and body가 그대로 있어요. 뇌와 몸을 속이는 착각이라는 내용과 일치해요.","c":"T"},"h":"acb6d34414"},{"n":2,"t":"tf","q":"Scientists know exactly why phantom vibration syndrome happens.","ko":"과학자들은 유령 진동 증후군이 왜 일어나는지 정확히 안다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Scientists aren’t sure why it happens.","과학자들은 왜 그런 일이 일어나는지 확신하지 못한다."]],"w":"6번 문장에서 과학자들은 왜 그런 일이 일어나는지 확신하지 못한다(aren't sure)고 해요. 정확히 안다는 말은 반대예요.","c":"F"},"h":"2b64797ded"},{"n":3,"t":"tf","q":"Turning off your phone once in a while may make phantom vibrations disappear.","ko":"가끔 전화기를 끄면 유령 진동이 사라질 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"Try turning it off once in a while, and the phantom vibrations might disappear.","가끔 전원을 꺼보아라, 그러면 유령 진동이 사라질 수도 있다."]],"w":"13번 문장에서 가끔 전원을 꺼 보면 유령 진동이 사라질지도 모른다(might disappear)고 해요.","c":"T"},"h":"a2a7e1c71b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They feel that they must always respond to others.)","ko":"그들은 항상 다른 사람들에게 ( )해야 한다고 느낀다.","opts":["응답하다","무시하다","부탁하다","가르치다"],"word":"respond","r":{"a":"1) 응답하다","ev":"8~9번 문장","s":[[8,"Some people check their phone too often because they don’t want to miss a text message or a call.","어떤 사람들은 문자 메시지나 전화를 놓치는 것을 원하지 않기 때문에 그들의 전화기를 너무 자주 확인한다."],[9,"They feel that they must always respond to others.","그들은 그들이 항상 다른 사람들에게 응답해야 한다고 느낀다."]],"w":"8번에서 문자나 전화를 놓치기 싫어하는 사람들이 9번에서 다른 사람들에게 항상 respond해야 한다고 느껴요. 연락에 '답하다, 응답하다'라는 뜻이에요.","c":1},"h":"b5eaa94e5a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, the screen shows no phone calls, no messages, and no notifications.)","ko":"그러나, 그 화면은 어떤 전화, 문자 메시지, 그리고 ( )도 보여주지 않는다.","opts":["주소","배터리","사진","알림"],"word":"notifications","r":{"a":"4) 알림","ev":"1~2번 문장","s":[[1,"Your phone is vibrating in your pocket, so you reach in and take it out.","당신의 전화기가 주머니에서 진동하고 있어서 당신은 손을 뻗어 그것을 꺼낸다."],[2,"However, the screen shows no phone calls, no messages, and no notifications.","그러나, 그 화면은 어떤 전화, 문자 메시지, 그리고 알림도 보여주지 않는다."]],"w":"1번에서 진동이 와서 전화기를 꺼냈는데, 2번에서 화면에는 전화·문자와 함께 notifications가 없었어요. 전화기가 보내 주는 '알림'이에요.","c":4},"h":"e5809f5c05"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nPhantom vibration syndrome is a kind of illusion that fools the brain and body. Scientists aren’t sure why it happens.","ko":"밑줄 친 it이 가리키는 것은?","sko":"유령 진동 증후군은 뇌와 몸을 속이는 일종의 착각이다. 과학자들은 왜 그런 일이 일어나는지 확신하지 못한다.","opts":["과학자들의 실험","유령 진동 증후군","주머니 속 전화기","화면의 문자 메시지"],"r":{"a":"2) 유령 진동 증후군","ev":"5~6번 문장","s":[[5,"Phantom vibration syndrome is a kind of illusion that fools the brain and body.","유령 진동 증후군은 뇌와 몸을 속이는 일종의 착각이다."],[6,"Scientists aren’t sure why it happens.","과학자들은 왜 그런 일이 일어나는지 확신하지 못한다."]],"w":"5번 문장에서 Phantom vibration syndrome(유령 진동 증후군)을 소개했고, 6번 Scientists aren’t sure why it happens(과학자들은 왜 그런 일이 일어나는지 확신하지 못한다)의 it은 그 증후군을 가리킴.","c":2,"k":"it = 유령 진동 증후군"},"pron":"it","h":"ac6281d003"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If this is happening to you, maybe you are worrying about your phone too much.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 당신에게 이런 일이 일어난다면, 아마도 당신이 당신의 전화기에 대해 너무 많이 걱정하고 있는 것이다.","opts":["이런 일이 일어난다면 당신의 전화기가 고장 난 것이다.","이런 일이 일어난다면 당신은 전화기에 신경을 너무 적게 쓰는 것이다.","이런 일이 일어난다면 아마도 당신이 전화기를 너무 많이 걱정하는 것이다.","이런 일이 일어난다면 전화기가 당신을 걱정하는 것이다."],"r":{"a":"3) 이런 일이 일어난다면 아마도 당신이 전화기를 너무 많이 걱정하는 것이다.","ev":"12번 문장","s":[[12,"If this is happening to you, maybe you are worrying about your phone too much.","만약 당신에게 이런 일이 일어난다면, 아마도 당신이 당신의 전화기에 대해 너무 많이 걱정하고 있는 것이다."]],"w":"worry about은 '~에 대해 걱정하다', too much는 '너무 많이'예요. 전화기를 너무 걱정하고 있는 것일지도 모른다는 뜻이에요. 전화기가 고장 났다는 말은 없어요.","c":3},"h":"3c0226f802"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아무도 전화하거나 메시지를 보내지 않으면 전화기는 절대 진동하지 않는다.","한 이론은 스마트폰을 너무 많이 사용하는 것이 유령 진동을 일으킬 수 있다고 말한다.","진동은 전화기가 고장 났을 때만 느낄 수 있다.","유령 진동은 스마트폰을 사용하지 않는 사람들에게만 일어난다."],"opts":["A phone never vibrates when nobody calls or sends a message.","One theory says that too much smartphone use can cause phantom vibrations.","People feel a vibration only when the phone is broken.","Phantom vibrations happen only to people who do not use smartphones."],"r":{"a":"2) One theory says that too much smartphone use can cause phantom vibrations. (한 이론은 스마트폰을 너무 많이 사용하는 것이 유령 진동을 일으킬 수 있다고 말한다.)","ev":"7번 문장","s":[[7,"One theory says that it is caused by excessive smartphone use.","한 이론은 그것이 과도한 스마트폰 사용에 의해 일어난다고 말한다."]],"w":"7번 문장 One theory says that it is caused by excessive smartphone use(한 이론은 그것이 과도한 스마트폰 사용에 의해 일어난다고 말한다)와 같은 내용. 화면에 알림이 없어도 진동을 느끼는 것이 증후군이고(2번), 나머지는 본문에 없는 내용.","c":2},"h":"6abec9f0f2"},{"n":9,"t":"sum","q":"Some people check their phone too (A) because they don’t want to (B) a text message or a call.","ko":"어떤 사람들은 문자 메시지나 전화를 (B) 않으려고 전화기를 너무 (A) 확인한다.","oko":["(A) 드물게 / (B) 놓치지","(A) 자주 / (B) 망가뜨리지","(A) 자주 / (B) 놓치지","(A) 드물게 / (B) 망가뜨리지","(A) 결코 / (B) 놓치지"],"opts":["(A) rarely / (B) miss","(A) often / (B) break","(A) often / (B) miss","(A) rarely / (B) break","(A) never / (B) miss"],"r":{"a":"3) (A) often / (B) miss","ev":"8번 문장","s":[[8,"Some people check their phone too often because they don’t want to miss a text message or a call.","어떤 사람들은 문자 메시지나 전화를 놓치는 것을 원하지 않기 때문에 그들의 전화기를 너무 자주 확인한다."]],"w":"8번 Some people check their phone too often because they don’t want to miss a text message or a call(어떤 사람들은 문자 메시지나 전화를 놓치고 싶지 않아서 전화기를 너무 자주 확인한다)에서 가져옴. 그래서 often과 miss.","c":3},"h":"e2b3bc03e8"},{"n":10,"t":"fill","q":"Your phone is vibrating in your [A], so you [B] in and take it out.","ko":"당신의 전화기가 [A] 속에서 진동하고 있어서, 당신은 손을 [B] 그것을 꺼낸다.","bank":["pocket","reach","vibrating","excessive","always","happened"],"bko":{"pocket":"주머니","reach":"손을 뻗다","vibrating":"진동하는","excessive":"과도한","always":"항상","happened":"일어났다(happen의 과거형)"},"r":{"a":"[A] pocket (주머니), [B] reach (손을 뻗다)","ev":"1번 문장","s":[[1,"Your phone is vibrating in your pocket, so you reach in and take it out.","당신의 전화기가 주머니에서 진동하고 있어서 당신은 손을 뻗어 그것을 꺼낸다."]],"w":"1번 Your phone is vibrating in your pocket, so you reach in and take it out(전화기가 주머니에서 진동해서 손을 뻗어 꺼낸다)에서 가져옴. vibrating, excessive, always, happened는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"5260a0bb8f"}]},{"u":3,"id":"rj3-03-2","no":2,"ko":"감자의 활약","items":[{"n":1,"t":"tf","q":"Potatoes are used to make ink, medicine, and beauty products.","ko":"감자는 잉크, 약, 미용 제품을 만드는 데 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Potatoes are used to make ink, medicine, and beauty products, as well as food.","감자는 음식뿐만 아니라 잉크와 약, 미용 제품을 만드는 데도 사용된다."]],"w":"1번 문장에서 감자는 음식뿐만 아니라 잉크와 약, 미용 제품을 만드는 데도 사용된다고 해요.","c":"T"},"h":"3582a0bc70"},{"n":2,"t":"tf","q":"The Wi-Fi signal on airplanes has always been very strong.","ko":"비행기의 와이파이 신호는 항상 매우 강했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"However, this signal was not always very strong.","하지만, 이 신호가 항상 매우 강한 것은 아니었다."]],"w":"4번 문장에서 이 신호가 항상 매우 강한 것은 아니었다(was not always very strong)고 해요.","c":"F"},"h":"445990c761"},{"n":3,"t":"tf","q":"The engineers filled the seats of their plane with bags of potatoes.","ko":"기술자들은 그들의 비행기 좌석을 감자 자루들로 채웠다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"So, the engineers decided to fill the seats of their plane with bags of potatoes.","그래서, 그 기술자들은 그들의 비행기 좌석을 감자 자루들로 채우기로 결정했다."]],"w":"11번 문장에서 기술자들이 비행기 좌석을 감자 자루들로 채우기로 결정했다고 해요.","c":"T"},"h":"abb5a3e811"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...because the human body absorbs and reflects Wi-Fi signals.)","ko":"...인체가 와이파이 신호를 ( )하고 반사하기 때문에...","opts":["만들다","보내다","흡수하다","저장하다"],"word":"absorbs","r":{"a":"3) 흡수하다","ev":"6번 문장","s":[[6,"They needed a plane full of passengers for several weeks because the human body absorbs and reflects Wi-Fi signals.","인체가 와이파이 신호를 흡수하고 반사하기 때문에 그들은 승객으로 가득한 비행기 한 대가 몇 주 동안 필요했다."]],"w":"6번에서 사람의 몸은 와이파이 신호를 absorb하고 reflect(반사하다)한다고 해요. 신호를 받아들여 빨아들이는 '흡수하다'예요.","c":3},"h":"0ae998c050"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Thanks to those patient potatoes, the engineers discovered ways...)","ko":"그 ( ) 감자들 덕분에, 기술자들은 방법을 발견했다.","opts":["참을성 있는","환자인","화가 난","무거운"],"word":"patient","r":{"a":"1) 참을성 있는","ev":"7~8번, 12번 문장","s":[[7,"Of course, people can’t sit on a plane that long.","물론, 사람들은 그렇게 오랫동안 비행기에 앉아 있을 수 없다."],[8,"But potatoes can!","하지만 감자는 할 수 있다!"],[12,"Thanks to those patient potatoes, the engineers discovered ways to provide stronger Wi-Fi signals.","그 참을성 있는 감자들 덕분에, 기술자들은 더 강한 와이파이 신호를 제공하는 방법을 발견했다."]],"w":"감자는 사람처럼 오랫동안 앉아 있을 수 있었어요(7~8번). 그래서 12번에서 patient potatoes는 '참을성 있는 감자들'이에요. 병원의 '환자'라는 뜻이 아니에요.","c":1},"h":"985e431cc2"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nPotatoes contain water and minerals in amounts that are similar to those of the human body. Therefore, they affect Wi-Fi signals in the same way as a human passenger.","ko":"밑줄 친 they가 가리키는 것은?","sko":"감자는 인체의 것들과 비슷한 양의 수분과 무기질을 포함한다. 그러므로, 그것들은 사람 승객과 같은 방식으로 와이파이 신호에 영향을 미친다.","opts":["기술자들","승객들","항공사들","감자들"],"r":{"a":"4) 감자들","ev":"9~10번 문장","s":[[9,"Potatoes contain water and minerals in amounts that are similar to those of the human body.","감자는 인체의 것들과 비슷한 양의 수분과 무기질을 포함한다."],[10,"Therefore, they affect Wi-Fi signals in the same way as a human passenger.","그러므로, 그것들은 사람 승객과 같은 방식으로 와이파이 신호에 영향을 미친다."]],"w":"9번 문장의 주어가 Potatoes(감자)이고, 10번 Therefore, they affect Wi-Fi signals…의 they는 앞 문장의 감자들을 가리킴. 감자가 사람 몸과 비슷하니까 사람 승객과 같은 영향을 준다는 흐름.","c":4,"k":"they = 감자들"},"pron":"they","h":"30d3a11940"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But did you know that potatoes have also helped improve Wi-Fi signals on airplanes?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그런데 당신은 감자가 비행기에서의 와이파이 신호를 개선하는 것도 도왔다는 것을 알고 있었는가?","opts":["감자가 비행기의 와이파이 신호를 좋게 하는 데에도 도움을 주었다는 것을 아느냐고 묻고 있다.","감자가 비행기를 더 빠르게 날게 했다는 것을 아느냐고 묻고 있다.","비행기에서 감자를 먹으면 와이파이가 느려진다고 말하고 있다.","비행기에 감자를 싣는 것이 금지되어 있다고 말하고 있다."],"r":{"a":"1) 감자가 비행기의 와이파이 신호를 좋게 하는 데에도 도움을 주었다는 것을 아느냐고 묻고 있다.","ev":"2번 문장","s":[[2,"But did you know that potatoes have also helped improve Wi-Fi signals on airplanes?","그런데 당신은 감자가 비행기에서의 와이파이 신호를 개선하는 것도 도왔다는 것을 알고 있었는가?"]],"w":"2번 문장 did you know that potatoes have also helped improve Wi-Fi signals on airplanes?는 ‘감자가 비행기 와이파이 신호를 개선하는 것도 도왔다는 것을 알았는가?’라는 질문.","c":1},"h":"350856bff7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["비행기의 와이파이 신호는 언제나 매우 강했다.","감자는 음식으로만 사용될 수 있다.","기술자들은 비행기 와이파이를 개선하려고 실험하기로 했다.","기술자들은 몇 주 동안 실제 승객들로 신호를 실험했다."],"opts":["The Wi-Fi signal on airplanes was always very strong.","Potatoes can be used only as food.","The engineers decided to run tests to improve airplane Wi-Fi.","The engineers tested the signal with real passengers for several weeks."],"r":{"a":"3) The engineers decided to run tests to improve airplane Wi-Fi.","ev":"4~5번, 7번 문장","s":[[4,"However, this signal was not always very strong.","하지만, 이 신호가 항상 매우 강한 것은 아니었다."],[5,"To improve this technology, engineers decided to run some tests.","이 기술을 개선하기 위해, 기술자들이 몇 가지 실험을 하기로 결정했다."],[7,"Of course, people can’t sit on a plane that long.","물론, 사람들은 그렇게 오랫동안 비행기에 앉아 있을 수 없다."]],"w":"5번에서 기술자들은 이 기술을 개선하기 위해 실험하기로 결정했어요. 신호는 항상 강한 것은 아니었고(4번), 사람은 오래 앉을 수 없어서(7번) 실제 승객 대신 감자를 썼어요.","c":3},"h":"cc1dca790f"},{"n":9,"t":"sum","q":"Many (A) allow passengers to connect to the (B) through Wi-Fi.","ko":"많은 (A)은(는) 승객들이 와이파이를 통해 (B)에 접속하도록 허용한다.","oko":["(A) 학교 / (B) 인터넷","(A) 항공사 / (B) 주방","(A) 학교 / (B) 주방","(A) 병원 / (B) 인터넷","(A) 항공사 / (B) 인터넷"],"opts":["(A) schools / (B) Internet","(A) airlines / (B) kitchen","(A) schools / (B) kitchen","(A) hospitals / (B) Internet","(A) airlines / (B) Internet"],"r":{"a":"5) (A) airlines / (B) Internet","ev":"3번 문장","s":[[3,"Many airlines allow passengers to connect to the Internet through Wi-Fi.","많은 항공사들은 승객들이 와이파이를 통해 인터넷에 접속할 수 있게 한다."]],"w":"3번 Many airlines allow passengers to connect to the Internet through Wi-Fi(많은 항공사들은 승객들이 와이파이를 통해 인터넷에 접속할 수 있게 한다)에서 가져옴. 그래서 airlines와 Internet.","c":5},"h":"22bdd386a0"},{"n":10,"t":"fill","q":"Of course, people can’t [A] on a plane that [B].","ko":"물론, 사람들은 그렇게 [B] 비행기에 [A] 수 없다.","bank":["sit","long","stronger","engineers","minerals","therefore"],"bko":{"sit":"앉아 있다","long":"오랫동안","stronger":"더 강한","engineers":"기술자들","minerals":"무기질들","therefore":"그러므로"},"r":{"a":"[A] sit (앉아 있다), [B] long (오랫동안)","ev":"7번 문장","s":[[7,"Of course, people can’t sit on a plane that long.","물론, 사람들은 그렇게 오랫동안 비행기에 앉아 있을 수 없다."]],"w":"7번 Of course, people can’t sit on a plane that long(물론, 사람들은 그렇게 오랫동안 비행기에 앉아 있을 수 없다)에서 가져옴. stronger, engineers, minerals, therefore는 두 자리에 문법상 들어갈 수 없음.","c":null},"h":"3c43c660b0"}]},{"u":3,"id":"rj3-03-3","no":3,"ko":"공중의 저 공은 뭐지?","items":[{"n":1,"t":"tf","q":"Colorful balls on power lines are called marker balls.","ko":"송전선에 있는 알록달록한 공들은 표시구라고 불린다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They are known as “marker balls.”","그것들은 ‘표시구’로 알려져 있다."]],"w":"3번 문장에서 They are known as “marker balls.”라고 해요. 알록달록한 공들을 표시구라고 부른다는 내용과 일치해요.","c":"T"},"h":"baa42cb6f2"},{"n":2,"t":"tf","q":"Marker balls are only used in the mountains.","ko":"표시구는 산에서만 사용된다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"You may have noticed them over highways, in the mountains, near airports, or across rivers and valleys.","당신은 고속도로 위, 산속, 공항 근처, 혹은 강과 계곡을 가로지르는 그것들을 보았을지도 모른다."]],"w":"2번 문장에서 고속도로 위, 산속, 공항 근처, 강과 계곡 위 등 여러 곳에서 볼 수 있다고 해요. 산에서만이라는 말은 틀려요.","c":"F"},"h":"cb3b9491e3"},{"n":3,"t":"tf","q":"Orange and white are the colors used most often for marker balls.","ko":"주황색과 흰색은 표시구에 가장 자주 사용되는 색이다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"The most frequently used colors are orange and white, as they stand out the most.","가장 자주 사용되는 색은 주황색과 흰색인데, 이것들이 가장 눈에 잘 띄기 때문이다."]],"w":"9번 문장에서 가장 자주 사용되는 색은 주황색과 흰색이라고 해요. 눈에 가장 잘 띄기 때문이에요.","c":"T"},"h":"927a47ecff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Without them, the lines are nearly invisible.)","ko":"그것들이 없으면, 전선들은 거의 ( ).","opts":["눈에 띄는","보이지 않는","아름다운","위험한"],"word":"invisible","r":{"a":"2) 보이지 않는","ev":"5번 문장","s":[[5,"Without them, the lines are nearly invisible.","그것들이 없으면, 전선들은 거의 보이지 않는다."]],"w":"5번에서 표시구가 없으면 전선은 nearly invisible해요. 그래서 6번에서 비행기에게 문제가 된다고 해요. 눈에 보이지 않는다는 뜻이에요.","c":2},"h":"f3d01df8cd"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Even birds can run into power lines because they are so hard to spot.)","ko":"새들도 송전선을 ( )하기가 너무 어렵기 때문에 그것들에 부딪칠 수 있다.","opts":["발견하다","만들다","칠하다","치우다"],"word":"spot","r":{"a":"1) 발견하다","ev":"7번 문장","s":[[7,"Even birds can run into power lines because they are so hard to spot.","새들도 송전선을 발견하기가 너무 어렵기 때문에 그것들에 부딪칠 수 있다."]],"w":"새들이 전선에 부딪치는 이유가 so hard to spot이에요. 전선이 잘 눈에 들어오지 않아서 '발견하기' 어렵다는 뜻이에요. 4번에서도 조종사가 전선을 spot하도록 돕는다고 했어요.","c":1},"h":"e9b521d11f"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nHave you ever seen colorful balls attached to power lines? You may have noticed them over highways, in the mountains, near airports, or across rivers and valleys.","ko":"밑줄 친 them이 가리키는 것은?","sko":"송전선에 붙어 있는 알록달록한 공들을 본 적이 있는가? 당신은 고속도로 위, 산속, 공항 근처, 혹은 강과 계곡을 가로지르는 그것들을 보았을지도 모른다.","opts":["조종사들","송전선들","알록달록한 공들","고속도로들"],"r":{"a":"3) 알록달록한 공들","ev":"1~2번 문장","s":[[1,"Have you ever seen colorful balls attached to power lines?","송전선에 붙어 있는 알록달록한 공들을 본 적이 있는가?"],[2,"You may have noticed them over highways, in the mountains, near airports, or across rivers and valleys.","당신은 고속도로 위, 산속, 공항 근처, 혹은 강과 계곡을 가로지르는 그것들을 보았을지도 모른다."]],"w":"1번 문장에서 송전선에 붙어 있는 colorful balls(알록달록한 공들)를 본 적이 있느냐고 묻고, 2번 You may have noticed them…의 them은 그 공들을 가리킴.","c":3,"k":"them = 알록달록한 공들"},"pron":"them","h":"d2d72d7d46"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, if the colors don’t stand out from the landscape, other colors may be used instead.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 만약 그 색들이 풍경에서 눈에 띄지 않는다면, 대신 다른 색들이 사용될 수도 있다.","opts":["풍경에서 눈에 띄는 색은 절대 쓰이지 않는다.","풍경이 눈에 띄지 않으면 공은 쓰이지 않는다.","그 색들이 풍경에서 눈에 띄지 않으면 다른 색들이 대신 쓰일 수도 있다.","다른 색들이 항상 주황색과 흰색보다 먼저 쓰인다."],"r":{"a":"3) 그 색들이 풍경에서 눈에 띄지 않으면 다른 색들이 대신 쓰일 수도 있다.","ev":"10번 문장","s":[[10,"However, if the colors don’t stand out from the landscape, other colors may be used instead.","하지만 만약 그 색들이 풍경에서 눈에 띄지 않는다면, 대신 다른 색들이 사용될 수도 있다."]],"w":"stand out은 '눈에 띄다', instead는 '대신에'예요. 주황색과 흰색이 풍경 속에서 눈에 안 띄면 다른 색을 대신 쓸 수 있다는 뜻이에요.","c":3},"h":"83a3c91ca7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["조종사들은 표시구 없이도 전선을 쉽게 볼 수 있다.","표시구는 항상 파란색과 초록색이다.","헬리콥터만 전선을 찾기 어려워한다.","표시구는 조종사가 전선에 부딪치는 것을 피하도록 돕는다."],"opts":["Pilots can see power lines easily without marker balls.","Marker balls are always blue and green.","Only helicopters have trouble spotting power lines.","Marker balls help pilots avoid hitting power lines."],"r":{"a":"4) Marker balls help pilots avoid hitting power lines. (표시구는 조종사가 전선에 부딪치는 것을 피하도록 돕는다.)","ev":"4번 문장","s":[[4,"The purpose of the balls is to help pilots spot the power lines and avoid hitting them.","그 공들의 목적은 조종사들이 송전선을 발견하고 그것들과 부딪치는 것을 피하도록 돕는 것이다."]],"w":"4번 문장 The purpose of the balls is to help pilots spot the power lines and avoid hitting them(공의 목적은 조종사가 송전선을 발견하고 부딪치는 것을 피하도록 돕는 것)과 같은 내용. 표시구 없이는 전선이 거의 안 보이고(5번), 자주 쓰는 색은 주황색과 흰색이며(9번), 새도 부딪칠 수 있다(7번).","c":4},"h":"9cf961b8e9"},{"n":9,"t":"sum","q":"The marker balls are (A) inside because they need to be as (B) as possible.","ko":"표시구는 가능한 한 (B) 상태여야 하기 때문에 안이 (A) 있다.","oko":["(A) 가득 차 / (B) 무거운","(A) 비어 / (B) 무거운","(A) 가득 차 / (B) 가벼운","(A) 비어 / (B) 밝은","(A) 비어 / (B) 가벼운"],"opts":["(A) full / (B) heavy","(A) empty / (B) heavy","(A) full / (B) light","(A) empty / (B) bright","(A) empty / (B) light"],"r":{"a":"5) (A) empty / (B) light","ev":"12~13번 문장","s":[[12,"Actually, they are empty!","사실 그것들은 비어 있다!"],[13,"That’s because they need to be as light as possible.","그것들은 가능한 한 가벼워야 하기 때문이다."]],"w":"12번에서 공은 비어(empty) 있고, 13번에서 그 이유는 가능한 한 가벼워야(light) 하기 때문이라고 해요.","c":5},"h":"78108c709b"},{"n":10,"t":"fill","q":"For this [A], using colorful balls is [B].","ko":"이 [A](으)로, 알록달록한 공들을 사용하는 것은 [B]하다.","bank":["reason","important","avoid","instead","because","nearly"],"bko":{"reason":"이유","important":"중요한","avoid":"피하다","instead":"대신에","because":"~때문에","nearly":"거의"},"r":{"a":"[A] reason (이유), [B] important (중요한)","ev":"8번 문장","s":[[8,"For this reason, using colorful balls is important.","이 이유로, 알록달록한 공들을 사용하는 것은 중요하다."]],"w":"8번 For this reason, using colorful balls is important(이 이유로, 알록달록한 공들을 사용하는 것은
