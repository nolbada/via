attention only to information that supports their belief.","과학적인 설명을 보여 줘도, 그들은 증거를 무시하고 자신의 믿음을 뒷받침하는 정보에만 주의를 기울인다."]],"w":"2번에서 they ignore the evidence and pay attention only to information that supports their belief라고 함. 증거를 무시한다는 내용과 같음.","c":"T","ev":"2번 문장"},"h":"6a211b83a9"},{"n":2,"t":"tf","q":"Confirmation bias becomes weaker online.","ko":"확증 편향은 온라인에서 더 약해진다.","r":{"a":"F (본문과 다른 내용)","s":[[8,"Confirmation bias becomes stronger online.","확증 편향은 온라인에서 더 강해진다."]],"w":"8번에서 Confirmation bias becomes stronger online(온라인에서 더 강해진다)이라고 함. weaker(약해진다)는 반대.","c":"F","ev":"8번 문장"},"h":"4d1f773ee3"},{"n":3,"t":"tf","q":"Some people still believe the Earth is flat even today.","ko":"오늘날에도 어떤 사람들은 여전히 지구가 평평하다고 믿는다.","r":{"a":"T (본문과 맞는 내용)","s":[[1,"Even today, some people still believe the Earth is flat.","오늘날에도 어떤 사람들은 여전히 지구가 평평하다고 믿는다."]],"w":"1번에서 Even today, some people still believe the Earth is flat이라고 함. 선지와 같음.","c":"T","ev":"1번 문장"},"h":"b3e2e3a014"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (To overcome this bias, the first step is to notice it.)","ko":"이 편향을 ( ) 위해, 첫 단계는 그것을 알아차리는 것이다.","opts":["극복하기","시작하기","따라 하기","퍼뜨리기"],"word":"overcome","r":{"a":"1) 극복하기","s":[[11,"To overcome this bias, the first step is to notice it.","이 편향을 극복하려면, 첫 단계는 그것을 알아차리는 것이다."]],"w":"11번은 문제(편향)를 이겨 내는 방법을 말하는 문장. overcome this bias = 이 편향을 극복하다. 이어서 11~12번에 극복하는 단계(알아차리기, 질문하기)가 나옴.","c":1,"ev":"11번 문장"},"h":"72d59b72c1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... build a more balanced understanding of the world.)","ko":"... 세상에 대한 더 ( ) 이해를 쌓는 ...","opts":["한쪽으로 치우친","균형 잡힌","빠른","어려운"],"word":"balanced","r":{"a":"2) 균형 잡힌","s":[[13,"This will help us think clearly and build a more balanced understanding of the world.","이것은 우리가 명확하게 생각하고 세상에 대한 더 균형 잡힌 이해를 쌓는 데 도움이 될 것이다."]],"w":"13번은 11~12번의 해결책(다른 의견과 사실 고려)을 실천했을 때의 결과. 한쪽 면만 보던 것(9번)과 반대로 여러 면을 보는 이해라 balanced = 균형 잡힌.","c":2,"ev":"13번 문장"},"h":"aab90edec0"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis limits our understanding and increases divisions between groups.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 우리의 이해를 제한하고 집단 간의 분열을 키운다.","opts":["지구가 평평하다는 믿음","과학적인 설명들","알고리즘 때문에 문제의 한쪽 면만 보게 되는 것","새로운 증거를 찾아보는 것"],"r":{"a":"3) 알고리즘 때문에 문제의 한쪽 면만 보게 되는 것","s":[[9,"Algorithms recommend content based on what we already like, so we often see only one side of an issue.","알고리즘은 우리가 이미 좋아하는 것을 바탕으로 콘텐츠를 추천하기 때문에, 우리는 어떤 문제의 한쪽 면만 보게 되는 경우가 많다."],[10,"This limits our understanding and increases divisions between groups.","이것은 우리의 이해를 제한하고 집단 간의 분열을 키운다."]],"w":"10번의 This는 바로 앞 9번 내용, 즉 알고리즘이 좋아하는 것만 추천해서 한쪽 면만 보게 되는 것. 그 결과 이해가 제한되고 집단 간 분열이 커짐.","c":3,"ev":"9~10번 문장","k":"This = 알고리즘 때문에 문제의 한쪽 면만 보게 되는 것"},"pron":"This","h":"f2abbf562f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Our brain prefers familiar ideas and often refuses to change our beliefs because it requires mental effort.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리의 뇌는 익숙한 생각을 선호하고, 정신적 노력이 필요하기 때문에 우리의 믿음을 바꾸는 것을 자주 거부한다.","opts":["우리의 뇌는 새로운 생각을 좋아해서 믿음을 쉽게 바꾼다.","우리의 뇌는 노력이 필요 없어서 믿음을 자주 바꾼다.","우리의 뇌는 익숙한 생각을 싫어하고 믿음을 바꾸기를 좋아한다.","우리의 뇌는 익숙한 생각을 좋아하고, 정신적 노력이 필요한 믿음 바꾸기를 자주 거부한다."],"r":{"a":"4) 우리의 뇌는 익숙한 생각을 좋아하고, 정신적 노력이 필요한 믿음 바꾸기를 자주 거부한다.","s":[[4,"Our brain prefers familiar ideas and often refuses to change our beliefs because it requires mental effort.","우리의 뇌는 익숙한 생각을 선호하고, 정신적 노력이 필요하기 때문에 우리의 믿음을 바꾸는 것을 자주 거부한다."]],"w":"prefers familiar ideas는 '익숙한 생각을 선호', often refuses to change our beliefs는 '믿음을 바꾸기를 자주 거부'. because it requires mental effort는 바꾸는 데 정신적 노력이 필요하다는 이유.","c":4,"ev":"4번 문장"},"h":"0ad4ab4ce8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["믿음에 맞는 정보는 빠르게 받아들이고 잘 기억한다.","믿음에 반하는 정보는 기쁘게 받아들이고 잘 기억한다.","알고리즘은 우리가 싫어하는 콘텐츠를 보여 준다.","확증 편향은 온라인에서는 사라진다."],"opts":["We accept information that supports our beliefs quickly and remember it well.","We happily accept information that goes against our beliefs and remember it well.","Algorithms show us content that we dislike.","Confirmation bias disappears online."],"r":{"a":"1) 믿음에 맞는 정보는 빠르게 받아들이고 잘 기억한다.","s":[[5,"When information supports what we already believe, we accept it quickly, overlook errors, and remember it well.","정보가 우리가 이미 믿고 있는 것을 뒷받침하면, 우리는 그것을 빠르게 받아들이고, 오류를 못 본 척 넘어가며, 잘 기억한다."],[6,"But when information goes against our beliefs, we feel uncomfortable, look for faults, and forget it.","하지만 정보가 우리의 믿음에 반하면, 우리는 불편함을 느끼고, 결점을 찾으며, 그것을 잊어버린다."],[8,"Confirmation bias becomes stronger online.","확증 편향은 온라인에서 더 강해진다."],[9,"Algorithms recommend content based on what we already like, so we often see only one side of an issue.","알고리즘은 우리가 이미 좋아하는 것을 바탕으로 콘텐츠를 추천하기 때문에, 우리는 어떤 문제의 한쪽 면만 보게 되는 경우가 많다."]],"w":"5번에서 믿음을 뒷받침하는 정보는 accept it quickly, remember it well. ②는 6번(반하는 정보는 불편해하고 잊음)과 반대. ③은 9번(이미 좋아하는 것을 추천)과 반대. ④는 8번(온라인에서 더 강해짐)과 반대.","c":1,"ev":"5~6번, 8~9번 문장"},"h":"a75dfced5b"},{"n":9,"t":"sum","q":"After we notice the bias, we can (A) our views and consider other opinions with an (B) mind.","ko":"편향을 알아차린 후, 우리는 우리의 견해에 (A) 다른 의견을 (B) 마음으로 고려할 수 있다.","oko":["(A) 의문을 품고 / (B) 열린","(A) 그대로 받아들이고 / (B) 열린","(A) 의문을 품고 / (B) 닫힌","(A) 그대로 받아들이고 / (B) 닫힌","(A) 숨기고 / (B) 열린"],"opts":["(A) question / (B) open","(A) accept / (B) open","(A) question / (B) closed","(A) accept / (B) closed","(A) hide / (B) open"],"r":{"a":"1) (A) question / (B) open ((A) 의문을 품고 / (B) 열린)","s":[[12,"Then we can question our views and consider other opinions and facts with an open mind.","그런 다음 우리는 우리의 견해에 의문을 품고 열린 마음으로 다른 의견과 사실을 고려할 수 있다."]],"w":"12번에서 편향을 알아차린 다음 우리는 우리의 견해에 의문을 품고(question) 열린 마음(open mind)으로 다른 의견과 사실을 고려할 수 있다고 함.","c":1,"ev":"12번 문장"},"h":"604241d681"},{"n":10,"t":"fill","q":"But when information goes against our beliefs, we feel uncomfortable, look for [A], and [B] it.","ko":"하지만 정보가 우리의 믿음에 반하면, 우리는 불편함을 느끼고, [A]을(를) 찾으며, 그것을 [B].","bank":["faults","forget","familiar","mental","stronger","scientific"],"bko":{"faults":"결점","forget":"잊어버리다","familiar":"익숙한","mental":"정신적인","stronger":"더 강한","scientific":"과학적인"},"r":{"a":"[A] faults (결점), [B] forget (잊어버리다)","s":[[6,"But when information goes against our beliefs, we feel uncomfortable, look for faults, and forget it.","하지만 정보가 우리의 믿음에 반하면, 우리는 불편함을 느끼고, 결점을 찾으며, 그것을 잊어버린다."]],"w":"6번: 믿음에 반하는 정보는 불편함을 느끼고, 결점(faults)을 찾고, 그것을 잊어버린다(forget).","c":null,"ev":"6번 문장"},"h":"3442e42d53"}]},{"u":6,"id":"b4-06-3","no":3,"ko":"메기를 넣었더니 정어리가 살아 도착한 이유는?","items":[{"n":1,"t":"tf","q":"A fisherman put a few catfish into the tank with the sardines.","ko":"한 어부가 정어리가 있는 수조에 메기 몇 마리를 넣었다.","r":{"a":"T (본문과 맞는 내용)","s":[[5,"He placed a few catfish into the tank.","그는 메기 몇 마리를 수조에 넣었다."]],"w":"5번에서 He placed a few catfish into the tank라고 함. 메기 몇 마리를 수조에 넣었으므로 본문과 같음.","c":"T","ev":"5번 문장"},"h":"06353a210d"},{"n":2,"t":"tf","q":"The sardines always arrived at the market alive before the fisherman tried something new.","ko":"어부가 새로운 것을 시도하기 전에는 정어리들이 항상 살아서 시장에 도착했다.","r":{"a":"F (본문과 다른 내용)","s":[[3,"The fish often died on the way.","그 물고기들은 가는 도중에 자주 죽었다."]],"w":"3번에서 The fish often died on the way(가는 도중에 자주 죽었다)라고 함. 항상 살아서 도착했다는 말은 반대.","c":"F","ev":"3번 문장"},"h":"dacc8d9aa7"},{"n":3,"t":"tf","q":"Without pressure, people may become too relaxed and lose their drive.","ko":"압박이 없으면, 사람들은 너무 느슨해져서 의욕을 잃을 수 있다.","r":{"a":"T (본문과 맞는 내용)","s":[[11,"Without such pressure, people may become too relaxed and lose their drive.","그런 압박이 없으면, 사람들은 너무 느슨해져서 의욕을 잃을 수 있다."]],"w":"11번에서 Without such pressure, people may become too relaxed and lose their drive라고 함. 선지와 같은 내용.","c":"T","ev":"11번 문장"},"h":"8287f041b5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... the sardines stayed still in the tank and soon became weak and exhausted.)","ko":"... 정어리가 수조 안에서 가만히 있다가 곧 약해지고 ( ) ...","opts":["지치지 않은","활기찬","매우 지친","배고픈"],"word":"exhausted","r":{"a":"3) 매우 지친","s":[[2,"The problem was that the sardines stayed still in the tank and soon became weak and exhausted.","문제는 정어리가 수조 안에서 가만히 있다가 곧 약해지고 지쳐 버린다는 것이었다."],[3,"The fish often died on the way.","그 물고기들은 가는 도중에 자주 죽었다."]],"w":"2번에서 정어리가 가만히 있다가 weak and exhausted(약해지고 지침)가 되었고, 3번에서 도중에 자주 죽었다고 함. exhausted = 매우 지친. 활기찬은 반대.","c":3,"ev":"2~3번 문장"},"h":"bb374ded7a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The Catfish Effect, however, works best in moderation.)","ko":"하지만 메기 효과는 ( ) 가장 잘 작동한다.","opts":["적당할 때","지나칠 때","빠를 때","혼자일 때"],"word":"moderation","r":{"a":"1) 적당할 때","s":[[12,"The Catfish Effect, however, works best in moderation.","하지만 메기 효과는 적당할 때 가장 잘 작동한다."],[13,"Too much pressure can cause stress and worsen performance, but the right amount of challenge can help us grow.","너무 많은 압박은 스트레스를 일으키고 성과를 떨어뜨릴 수 있지만, 적절한 정도의 도전은 우리가 성장하는 데 도움이 될 수 있다."]],"w":"13번에서 too much pressure(너무 많은 압박)는 성과를 떨어뜨리고 the right amount of challenge(알맞은 정도)는 도움이 된다고 함. 그래서 in moderation = 적당할 때(적당함). 지나침은 반대.","c":1,"ev":"12~13번 문장"},"h":"08e2c31551"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIn business, it shows that competition can keep people engaged and improve their performance.","ko":"밑줄 친 it이 가리키는 것은?","sko":"사업에서, 그것은 경쟁이 사람들을 계속 몰두하게 하고 그들의 성과를 향상시킬 수 있음을 보여 준다.","opts":["메기 효과","정어리","수조","어부"],"r":{"a":"1) 메기 효과","s":[[7,"This strategy is known as the Catfish Effect.","이 전략은 메기 효과라고 알려져 있다."],[8,"Today, the term is used to describe how a little pressure or competition can keep people motivated.","오늘날 이 용어는 약간의 압박이나 경쟁이 어떻게 사람들의 동기를 계속 유지시킬 수 있는지를 설명하는 데 쓰인다."],[9,"In business, it shows that competition can keep people engaged and improve their performance.","사업에서, 그것은 경쟁이 사람들을 계속 몰두하게 하고 그들의 성과를 향상시킬 수 있음을 보여 준다."]],"w":"9번의 it은 경쟁이 사람들을 계속 몰두하게 하고 성과를 향상시킬 수 있음을 보여 주는 주어로, 7~8번에서 설명한 메기 효과(Catfish Effect).","c":1,"ev":"7~9번 문장","k":"it = 메기 효과"},"pron":"it","h":"d532d0ca9e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Likewise, a smart classmate can push other students to study harder.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마찬가지로, 똑똑한 반 친구는 다른 학생들이 더 열심히 공부하도록 자극할 수 있다.","opts":["똑똑한 반 친구는 다른 학생이 공부를 못하게 방해한다.","똑똑한 반 친구는 다른 학생들이 더 열심히 공부하도록 자극할 수 있다.","똑똑한 반 친구는 다른 학생이 쉬도록 도와준다.","다른 학생들은 똑똑한 반 친구를 따라 공부를 멈춘다."],"r":{"a":"2) 똑똑한 반 친구는 다른 학생들이 더 열심히 공부하도록 자극할 수 있다.","s":[[10,"Likewise, a smart classmate can push other students to study harder.","마찬가지로, 똑똑한 반 친구는 다른 학생들이 더 열심히 공부하도록 자극할 수 있다."]],"w":"push A to B는 'A가 B하도록 자극하다'. a smart classmate가 메기처럼 다른 학생이 study harder(더 열심히 공부)하게 만든다는 뜻.","c":2,"ev":"10번 문장"},"h":"82f9958a70"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["메기 효과는 사람들이 모든 경쟁을 피해야 한다는 뜻이다.","메기는 정어리를 잡아먹으려고 수조에 넣어졌다.","메기 효과는 약간의 압박이나 경쟁이 어떻게 사람들의 동기를 계속 유지시키는지를 설명한다.","어부들은 정어리 대신 메기를 팔았다."],"opts":["The Catfish Effect means that people should avoid all competition.","The catfish were put in the tank to eat the sardines.","The Catfish Effect describes how a little pressure or competition keeps people motivated.","The fishermen sold catfish instead of sardines."],"r":{"a":"3) The Catfish Effect describes how a little pressure or competition keeps people motivated. (메기 효과는 약간의 압박이나 경쟁이 어떻게 사람들의 동기를 계속 유지시키는지를 설명한다.)","s":[[5,"He placed a few catfish into the tank.","그는 메기 몇 마리를 수조에 넣었다."],[6,"The catfish chased the sardines, forcing them to swim constantly, so they arrived at the market alive and healthy.","메기가 정어리를 쫓아다니며 계속 헤엄치게 만들었고, 그래서 정어리들은 살아 있고 건강한 상태로 시장에 도착했다."],[7,"This strategy is known as the Catfish Effect.","이 전략은 메기 효과라고 알려져 있다."],[8,"Today, the term is used to describe how a little pressure or competition can keep people motivated.","오늘날 이 용어는 약간의 압박이나 경쟁이 어떻게 사람들의 동기를 계속 유지시킬 수 있는지를 설명하는 데 쓰인다."]],"w":"7~8번에서 메기 효과는 약간의 압박이나 경쟁이 사람들의 동기를 유지시킬 수 있다는 것을 설명하는 용어라고 함. ①은 경쟁을 피하자는 뜻이 아니고, ②는 6번에서 메기가 정어리를 쫓아다니게 하려고 넣은 것이며, ④는 본문에 없는 내용.","c":3,"ev":"5~8번 문장"},"h":"d61e06eb65"},{"n":9,"t":"sum","q":"Too much pressure can cause (A), but the right amount of (B) can help us grow.","ko":"너무 많은 압박은 (A)을(를) 일으킬 수 있지만, 적절한 정도의 (B)은(는) 우리가 성장하는 데 도움이 될 수 있다.","oko":["(A) 기쁨 / (B) 휴식","(A) 스트레스 / (B) 휴식","(A) 기쁨 / (B) 도전","(A) 에너지 / (B) 도전","(A) 스트레스 / (B) 도전"],"opts":["(A) joy / (B) rest","(A) stress / (B) rest","(A) joy / (B) challenge","(A) energy / (B) challenge","(A) stress / (B) challenge"],"r":{"a":"5) (A) stress / (B) challenge ((A) 스트레스 / (B) 도전)","s":[[13,"Too much pressure can cause stress and worsen performance, but the right amount of challenge can help us grow.","너무 많은 압박은 스트레스를 일으키고 성과를 떨어뜨릴 수 있지만, 적절한 정도의 도전은 우리가 성장하는 데 도움이 될 수 있다."]],"w":"13번: 너무 많은 압박은 스트레스(stress)를 일으키고 성과를 떨어뜨릴 수 있지만, 적절한 정도의 도전(challenge)은 우리가 성장하는 데 도움이 됨.","c":5,"ev":"13번 문장"},"h":"75bbb5fd21"},{"n":10,"t":"fill","q":"Long ago in [B], fishermen faced a problem when [A] live sardines to the market.","ko":"오래전 [B]에서, 어부들은 살아 있는 정어리를 시장으로 [A] 때 문제에 직면했다.","bank":["transporting","Norway","strategy","classmate","pressure","competition"],"bko":{"transporting":"운반하는(transport의 -ing)","Norway":"노르웨이","strategy":"전략","classmate":"반 친구","pressure":"압박","competition":"경쟁"},"r":{"a":"[A] transporting (운반하는(transport의 -ing)), [B] Norway (노르웨이)","s":[[1,"Long ago in Norway, fishermen faced a problem when transporting live sardines to the market.","오래전 노르웨이에서, 어부들은 살아 있는 정어리를 시장으로 운반할 때 문제에 직면했다."]],"w":"1번: 오래전 노르웨이(Norway)에서 어부들은 살아 있는 정어리를 시장으로 운반할(transporting) 때 문제에 직면했다.","c":null,"ev":"1번 문장"},"h":"ef98865d5c"}]},{"u":6,"id":"b4-06-4","no":4,"ko":"‘내가 틀렸나?’ 스스로를 의심하게 만드는 말의 정체는?","items":[{"n":1,"t":"tf","q":"In the play Gas Light, a husband secretly dims the gas lamps in the house.","ko":"연극 「가스등」에서 한 남편이 집 안의 가스등을 몰래 어둡게 한다.","r":{"a":"T (본문과 맞는 내용)","s":[[1,"In a 1938 play called Gas Light, a husband secretly dims the gas lamps in the house.","1938년의 연극 「가스등」에서, 한 남편이 집 안의 가스등을 몰래 어둡게 한다."]],"w":"1번에서 a husband secretly dims the gas lamps in the house라고 함. 남편이 몰래 가스등을 어둡게 하므로 본문과 같음.","c":"T","ev":"1번 문장"},"h":"42b803b995"},{"n":2,"t":"tf","q":"When the wife notices the lights getting darker, her husband agrees that they are darker.","ko":"아내가 불빛이 점점 어두워지는 것을 알아차리자, 남편은 불빛이 더 어두워졌다는 데 동의한다.","r":{"a":"F (본문과 다른 내용)","s":[[2,"When his wife notices the lights getting darker, he tells her that nothing has changed.","아내가 불빛이 점점 어두워지는 것을 알아차리자, 그는 그녀에게 아무것도 변하지 않았다고 말한다."]],"w":"2번에서 남편은 he tells her that nothing has changed(아무것도 변하지 않았다고 말함)라고 함. 동의한다는 말은 반대.","c":"F","ev":"2번 문장"},"h":"c65abf6c00"},{"n":3,"t":"tf","q":"Writing down your thoughts and talking to a professional counselor is advised.","ko":"자신의 생각을 적어 두고 전문 상담가와 이야기하는 것이 권해진다.","r":{"a":"T (본문과 맞는 내용)","s":[[10,"Write down your thoughts and talk to a professional counselor.","당신의 생각을 적어 두고 전문 상담가와 이야기하라."]],"w":"10번에서 Write down your thoughts and talk to a professional counselor라고 하며 대처법으로 권함. 선지와 같음.","c":"T","ev":"10번 문장"},"h":"caf9240d30"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A gaslighter may lie, deny the truth, or change a story to confuse another person and gain control.)","ko":"... 이야기를 바꿔서 다른 사람을 ( ) 통제력을 얻으려 할 수 있다.","opts":["돕고","혼란스럽게 하고","가르치고","만나고"],"word":"confuse","r":{"a":"2) 혼란스럽게 하고","s":[[6,"A gaslighter may lie, deny the truth, or change a story to confuse another person and gain control.","가스라이팅하는 사람은 거짓말을 하거나, 진실을 부정하거나, 이야기를 바꿔서 다른 사람을 혼란스럽게 하고 통제력을 얻으려 할 수 있다."],[7,"As a result, the victim may lose confidence and start thinking, “Maybe I’m wrong,” even when they are right.","그 결과, 피해자는 자신감을 잃고, 자신이 옳을 때조차도 ‘내가 틀렸나 봐’라고 생각하기 시작할 수 있다."]],"w":"6번에서 거짓말, 진실 부정, 이야기 바꾸기는 상대를 헷갈리게 하려는 행동. 7번에서 그 결과 피해자가 자신이 틀렸나 생각하게 되므로 confuse = 혼란스럽게 하다.","c":2,"ev":"6~7번 문장"},"h":"b381e398c7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As a result, the victim may lose confidence and start thinking, “Maybe I’m wrong,”...)","ko":"그 결과, ( )는 자신감을 잃고, ‘내가 틀렸나 봐’라고 생각하기 시작할 수 있다.","opts":["가해자","목격자","상담가","피해자"],"word":"victim","r":{"a":"4) 피해자","s":[[6,"A gaslighter may lie, deny the truth, or change a story to confuse another person and gain control.","가스라이팅하는 사람은 거짓말을 하거나, 진실을 부정하거나, 이야기를 바꿔서 다른 사람을 혼란스럽게 하고 통제력을 얻으려 할 수 있다."],[7,"As a result, the victim may lose confidence and start thinking, “Maybe I’m wrong,” even when they are right.","그 결과, 피해자는 자신감을 잃고, 자신이 옳을 때조차도 ‘내가 틀렸나 봐’라고 생각하기 시작할 수 있다."]],"w":"6번의 gaslighter(가스라이팅하는 사람)가 하는 행동을 당하는 쪽이 7번의 victim. 자신감을 잃는 쪽이므로 '피해자'.","c":4,"ev":"6~7번 문장"},"h":"9bae246560"},{"n":6,"t":"ref","q":"What does the underlined \"This strange story\" refer to?\nThis strange story later gave rise to the word “gaslighting.”","ko":"밑줄 친 This strange story가 가리키는 것은?","sko":"이 이상한 이야기는 훗날 ‘가스라이팅’이라는 단어를 탄생시켰다.","opts":["1938년 연극 「가스등」의 이야기","한 상담가가 들려준 이야기","친구들 사이에 떠도는 소문","가스 회사가 만든 광고"],"r":{"a":"1) 1938년 연극 「가스등」의 이야기","s":[[1,"In a 1938 play called Gas Light, a husband secretly dims the gas lamps in the house.","1938년의 연극 「가스등」에서, 한 남편이 집 안의 가스등을 몰래 어둡게 한다."],[4,"This strange story later gave rise to the word “gaslighting.”","이 이상한 이야기는 훗날 ‘가스라이팅’이라는 단어를 탄생시켰다."]],"w":"4번 This strange story는 앞에서 소개한 1938년 연극 「가스등」의 이야기. 그 이야기가 훗날 ‘가스라이팅’이라는 단어를 탄생시켰다고 함.","c":1,"ev":"1번, 4번 문장","k":"This strange story = 1938년 연극 「가스등」의 이야기"},"pron":"This strange story","h":"822b3dd198"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you feel this is happening to you, trust your feelings.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이런 일이 당신에게 일어나고 있다고 느낀다면, 당신의 감정을 믿어라.","opts":["이런 일이 자신에게 일어나고 있다고 느끼면 자신의 감정을 믿어야 한다.","이런 일이 일어나고 있다고 느끼면 자신의 감정을 무시해야 한다.","이런 일이 일어나고 있다고 느끼면 아무에게도 말하지 말아야 한다.","이런 일은 느낌일 뿐이므로 신경 쓰지 말아야 한다."],"r":{"a":"1) 이런 일이 자신에게 일어나고 있다고 느끼면 자신의 감정을 믿어야 한다.","s":[[9,"If you feel this is happening to you, trust your feelings.","이런 일이 당신에게 일어나고 있다고 느낀다면, 당신의 감정을 믿어라."]],"w":"trust your feelings는 당신의 감정을 믿으라는 뜻. If you feel this is happening to you는 이런 일이 당신에게 일어나고 있다고 느낀다면.","c":1,"ev":"9번 문장"},"h":"51b69896de"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["가스라이팅은 모르는 사람들 사이에서만 일어난다.","가스라이팅은 친구나 가족 구성원 사이에서도 일어날 수 있다.","신뢰는 가스라이팅하는 사람을 믿기 더 어렵게 만든다.","가스라이팅하는 사람은 자신이 통제하는 사람에게 항상 진실을 말한다."],"opts":["Gaslighting happens only between strangers.","Gaslighting can happen between friends or family members.","Trust makes it harder to believe a gaslighter.","Gaslighters always tell the truth to the people they control."],"r":{"a":"2) Gaslighting can happen between friends or family members. (가스라이팅은 친구나 가족 구성원 사이에서도 일어날 수 있다.)","s":[[6,"A gaslighter may lie, deny the truth, or change a story to confuse another person and gain control.","가스라이팅하는 사람은 거짓말을 하거나, 진실을 부정하거나, 이야기를 바꿔서 다른 사람을 혼란스럽게 하고 통제력을 얻으려 할 수 있다."],[8,"Gaslighting often happens between people who are close, like friends or family, because trust makes it easier to believe the gaslighter.","가스라이팅은 친구나 가족처럼 가까운 사람들 사이에서 자주 일어나는데, 신뢰가 가스라이팅하는 사람을 믿기 더 쉽게 만들기 때문이다."]],"w":"8번에서 가스라이팅은 친구나 가족처럼 가까운 사람들 사이에서 자주 일어난다고 함. ①은 가까운 사람 사이라는 8번과 반대, ③은 신뢰가 믿기 더 쉽게 만든다는 8번과 반대, ④는 6번에서 거짓말을 하거나 진실을 부정한다고 한 것과 반대.","c":2,"ev":"6번, 8번 문장"},"h":"be7f4cbfa3"},{"n":9,"t":"sum","q":"The word “gaslighting” refers to a (A) behavior that makes someone (B) their own thoughts and feelings.","ko":"‘가스라이팅’이라는 단어는 누군가가 자신의 생각과 감정을 (B) 만드는 (A) 행동을 가리킨다.","oko":["(A) 도움이 되는 / (B) 믿게","(A) 해로운 / (B) 믿게","(A) 도움이 되는 / (B) 의심하게","(A) 재미있는 / (B) 의심하게","(A) 해로운 / (B) 의심하게"],"opts":["(A) helpful / (B) trust","(A) harmful / (B) trust","(A) helpful / (B) doubt","(A) funny / (B) doubt","(A) harmful / (B) doubt"],"r":{"a":"5) (A) harmful / (B) doubt ((A) 해로운 / (B) 의심하게)","s":[[5,"The word refers to a harmful behavior that makes someone doubt their own thoughts and feelings.","그 단어는 누군가가 자신의 생각과 감정을 의심하게 만드는 해로운 행동을 가리킨다."]],"w":"5번: 그 단어는 누군가가 자신의 생각과 감정을 의심하게(doubt) 만드는 해로운(harmful) 행동을 가리킴.","c":5,"ev":"5번 문장"},"h":"c6ce561ef7"},{"n":10,"t":"fill","q":"He repeats this again and again, so she begins to [A] her own senses and eventually believes that she is going [B].","ko":"그가 이것을 계속 되풀이하자, 그녀는 자신의 감각을 [A] 시작하고 결국 자신이 [B] 상태가 되어 가고 있다고 믿게 된다.","bank":["question","crazy","story","lamps","confidence","behavior"],"bko":{"question":"의심하다(의문을 품다)","crazy":"미친","story":"이야기","lamps":"등불","confidence":"자신감","behavior":"행동"},"r":{"a":"[A] question (의심하다(의문을 품다)), [B] crazy (미친)","s":[[3,"He repeats this again and again, so she begins to question her own senses and eventually believes that she is going crazy.","그가 이것을 계속 되풀이하자, 그녀는 자신의 감각을 의심하기 시작하고 결국 자신이 미쳐 가고 있다고 믿게 된다."]],"w":"3번: 그녀는 자신의 감각을 의심하기(question) 시작하고 결국 자신이 미쳐(crazy) 가고 있다고 믿게 됨.","c":null,"ev":"3번 문장"},"h":"608eacde85"}]},{"u":7,"id":"b4-07-1","no":1,"ko":"우주에서 본 지구가 우주비행사의 마음을 바꾼 이유","items":[{"n":1,"t":"tf","q":"The astronauts see a tiny, beautiful blue ball floating in space when they look down at Earth.","ko":"우주비행사들은 지구를 내려다볼 때 우주에 떠 있는 작고 아름다운 푸른 공을 본다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"When astronauts look down at Earth from space, they do not see borders or countries.","우주비행사들이 우주에서 지구를 내려다볼 때, 그들은 국경이나 나라를 보지 못한다."],[4,"Instead, they see a tiny, beautiful blue ball like a “marble” floating in space.","대신, 그들은 우주에 떠 있는 '구슬'처럼 작고 아름다운 푸른 공을 본다."]],"w":"3번에서 국경이나 나라는 안 보이고, 4번에서 Instead(대신) 작고 아름다운 푸른 공 같은 지구가 보인다고 함. 본문과 일치.","c":"T"},"h":"45d3d73466"},{"n":2,"t":"tf","q":"Astronauts say that the rivalry between the U.S. and Russia still matters a lot.","ko":"우주비행사들은 미국과 러시아의 경쟁이 여전히 매우 중요하다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"However, astronauts who have made the journey say that rivalry no longer matters.","그러나 그 여정을 다녀온 우주비행사들은 이제 그런 경쟁은 중요하지 않다고 말한다."]],"w":"2번에서 우주를 다녀온 사람들은 rivalry no longer matters(경쟁은 더 이상 중요하지 않다)라고 함. 여전히 중요하다는 말은 반대.","c":"F"},"h":"75b6d9b10e"},{"n":3,"t":"tf","q":"Some astronauts write books about their experience and even start charities.","ko":"일부 우주비행사들은 자신의 경험에 대한 책을 쓰고 심지어 자선 단체를 설립하기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Some astronauts share their changed view by writing books about their experience, and even start charities to help others.","일부 우주비행사들은 자신의 경험에 대한 책을 써서 변화된 관점을 공유하고, 심지어 다른 사람들을 돕기 위해 자선 단체를 설립하기도 한다."]],"w":"10번에서 writing books(책을 쓰다)와 start charities(자선 단체를 설립하다)가 그대로 나옴.","c":"T"},"h":"f6a71dee42"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... have long been intense competitors in space exploration.)","ko":"... 우주 탐사에서 오랫동안 ( ) 경쟁자였다.","opts":["친근한","치열한","느긋한","조용한"],"word":"intense","r":{"a":"2) 치열한","ev":"1번 문장","s":[[1,"The U.S. and Russia have long been intense competitors in space exploration.","미국과 러시아는 오랫동안 우주 탐사에서 치열한 경쟁자였다."]],"w":"1번에서 intense competitors는 우주 탐사에서 서로 지지 않으려는 경쟁자. intense = 치열한, 강렬한. 친한이나 조용한은 경쟁과 어울리지 않음.","c":2},"h":"3f81c5ba4b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... concern for protecting the environment and promoting world peace often grows.)","ko":"... 환경을 보호하고 세계 평화를 ( ) 관심이 종종 커진다.","opts":["방해하는","숨기는","증진하는","끝내는"],"word":"promoting","r":{"a":"3) 증진하는","ev":"9번 문장","s":[[9,"As a result, concern for protecting the environment and promoting world peace often grows.","그 결과, 환경을 보호하고 세계 평화를 증진하려는 관심이 종종 커진다."]],"w":"9번에서 환경 보호와 함께 세계 평화를 promote하려는 관심이 커진다고 함. promote(증진하다)는 더 좋아지도록 힘쓴다는 뜻. 방해나 숨김은 반대.","c":3},"h":"733158e7c2"},{"n":6,"t":"ref","q":"What does the underlined \"This experience\" refer to?\nThis experience often creates a strong sense of connection to all living things and helps them realize that Earth must be protected.","ko":"밑줄 친 This experience가 가리키는 것은?","sko":"이 경험은 종종 모든 생명체와의 강한 유대감을 만들어 내고, 지구가 보호되어야 한다는 것을 깨닫도록 도와준다.","opts":["우주에서 지구를 바라본 경험","미국과 러시아가 경쟁한 경험","우주비행사 시험에 떨어진 경험","지구에서 책을 쓴 경험"],"r":{"a":"1) 우주에서 지구를 바라본 경험","ev":"7~8번 문장","s":[[7,"After viewing the planet from space, however, many come to understand that all humans share one home.","그러나 우주에서 지구를 본 후에는, 많은 사람들이 모든 인류가 하나의 집을 공유한다는 것을 이해하게 된다."],[8,"This experience often creates a strong sense of connection to all living things and helps them realize that Earth must be protected.","이 경험은 종종 모든 생명체와의 강한 유대감을 만들어 내고, 지구가 보호되어야 한다는 것을 깨닫도록 도와준다."]],"w":"8번의 This experience는 바로 앞 7번에서 말한, 우주에서 지구를 바라본 경험. 그 경험이 모든 생명체와의 유대감을 만들고 지구를 보호해야 한다는 것을 깨닫게 함.","c":1,"k":"This experience = 우주에서 지구를 바라본 경험"},"pron":"This experience","h":"11ed7cc888"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Before leaving Earth, astronauts may focus mainly on their own countries.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"지구를 떠나기 전에는, 우주비행사들은 주로 자기 나라에 집중할지도 모른다.","opts":["지구를 떠나기 전에 우주비행사들은 주로 자기 나라에 집중할 수 있다.","지구를 떠나기 전에 우주비행사들은 세계 평화에만 관심이 있다.","지구를 떠난 뒤에 우주비행사들은 자기 나라를 잊는다.","지구를 떠나기 전에 우주비행사들은 우주에 가기를 두려워한다."],"r":{"a":"1) 지구를 떠나기 전에 우주비행사들은 주로 자기 나라에 집중할 수 있다.","ev":"6번 문장","s":[[6,"Before leaving Earth, astronauts may focus mainly on their own countries.","지구를 떠나기 전에는, 우주비행사들은 주로 자기 나라에 집중할지도 모른다."]],"w":"Before leaving Earth는 지구를 떠나기 전에, may focus mainly on their own countries는 주로 자기 나라에 집중할지도 모른다.","c":1},"h":"f7a89e288e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["우주비행사들은 우주에서 나라 사이의 뚜렷한 국경을 볼 수 있다.","우주에서 지구를 보는 것은 우주비행사들의 마음을 깊이 바꾼다.","우주비행사들은 여행 후에 자기 나라만 생각한다.","우주비행사들은 지구를 내려다볼 때 아무것도 느끼지 못한다."],"opts":["Astronauts can see clear borders between countries from space.","Seeing Earth from space deeply changes the hearts of astronauts.","Astronauts think only about their own countries after the trip.","Astronauts do not feel anything when they look down at Earth."],"r":{"a":"2) Seeing Earth from space deeply changes the hearts of astronauts. (우주에서 지구를 보는 것은 우주비행사들의 마음을 깊이 바꾼다.)","ev":"3번, 5번, 7번 문장","s":[[3,"When astronauts look down at Earth from space, they do not see borders or countries.","우주비행사들이 우주에서 지구를 내려다볼 때, 그들은 국경이나 나라를 보지 못한다."],[5,"This view changes their hearts deeply.","이 광경은 그들의 마음을 깊이 바꾼다."],[7,"After viewing the planet from space, however, many come to understand that all humans share one home.","그러나 우주에서 지구를 본 후에는, 많은 사람들이 모든 인류가 하나의 집을 공유한다는 것을 이해하게 된다."]],"w":"5번에서 지구를 내려다보는 광경이 그들의 마음을 깊이 바꾼다고 함. ①은 3번(국경이나 나라를 보지 못함)과 반대, ③은 7번(모든 인류가 하나의 집을 공유한다고 이해함)과 반대, ④는 5번과 반대.","c":2},"h":"3ddf4826cb"},{"n":9,"t":"sum","q":"This change in astronauts’ thinking is called the (A) Effect, and it encourages us to (B) for one another.","ko":"우주비행사들의 생각에 일어난 이러한 변화는 (A) 효과라고 불리며, 그것은 우리가 서로를 (B) 격려한다.","oko":["(A) 구슬 / (B) 싸우도록","(A) 조망 / (B) 싸우도록","(A) 구슬 / (B) 돌보도록","(A) 우주 / (B) 기다리도록","(A) 조망 / (B) 돌보도록"],"opts":["(A) Marble / (B) fight","(A) Overview / (B) fight","(A) Marble / (B) care","(A) Space / (B) wait","(A) Overview / (B) care"],"r":{"a":"5) (A) Overview / (B) care ((A) 조망 / (B) 돌보도록)","ev":"11~12번 문장","s":[[11,"This change in their thinking is called the Overview Effect.","그들의 생각에 일어난 이러한 변화는 조망 효과(Overview Effect)라고 불린다."],[12,"It reminds us that we all live on the same small planet and encourages us to care for one another.","그것은 우리 모두가 같은 작은 행성에 살고 있다는 것을 상기시키고, 우리가 서로를 돌보도록 격려한다."]],"w":"11번에서 이 변화는 조망 효과(Overview Effect)라고 불리고, 12번에서 우리가 서로를 돌보도록(care for one another) 격려한다고 함.","c":5},"h":"5a64523732"},{"n":10,"t":"fill","q":"After viewing the planet from space, however, many come to understand that all [A] share one [B].","ko":"그러나 우주에서 지구를 본 후에는, 많은 사람들이 모든 [A]이(가) 하나의 [B]을(를) 공유한다는 것을 이해하게 된다.","bank":["humans","home","deeply","tiny","strong","floating"],"bko":{"humans":"인류(사람들)","home":"집","deeply":"깊이","tiny":"아주 작은","strong":"강한","floating":"떠 있는"},"r":{"a":"[A] humans (인류(사람들)), [B] home (집)","ev":"7번 문장","s":[[7,"After viewing the planet from space, however, many come to understand that all humans share one home.","그러나 우주에서 지구를 본 후에는, 많은 사람들이 모든 인류가 하나의 집을 공유한다는 것을 이해하게 된다."]],"w":"7번: 우주에서 지구를 본 후에는 모든 인류(humans)가 하나의 집(home)을 공유한다는 것을 이해하게 된다.","c":null},"h":"899def9470"}]},{"u":7,"id":"b4-07-2","no":2,"ko":"우리가 보는 별빛은 이미 과거의 빛이다?","items":[{"n":1,"t":"tf","q":"If a star is 100 light-years away, the light we see today left the star 100 years ago.","ko":"어떤 별이 100광년 떨어져 있다면, 오늘 우리가 보는 빛은 100년 전에 그 별을 떠난 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"For example, if a star is 100 light-years away, the light we see today left the star 100 years ago.","예를 들어, 어떤 별이 100광년 떨어져 있다면, 오늘 우리가 보는 빛은 100년 전에 그 별을 떠난 것이다."]],"w":"8번에 같은 문장이 그대로 나옴. 100광년 떨어진 별의 빛은 100년 걸려 도착하므로 100년 전에 출발한 빛을 보는 것.","c":"T"},"h":"c4db3e0d78"},{"n":2,"t":"tf","q":"Light travels so fast that it reaches us from a star instantly.","ko":"빛은 너무 빨라서 별에서 우리에게 즉시 도달한다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Light travels at about 300,000 kilometers per second, but space is so vast that even that speed isn’t enough for light to reach us instantly.","빛은 초속 약 30만 킬로미터로 이동하지만, 우주는 너무나 광대해서 그 속도로도 빛이 우리에게 즉시 도달하기에는 충분하지 않다."]],"w":"3번에서 빛이 빨라도 space is so vast(우주가 너무 광대해서) 즉시 도달하기에는 충분하지 않다고 함. 즉시 도달한다는 말은 반대.","c":"F"},"h":"4d69c6a9e8"},{"n":3,"t":"tf","q":"Most stars are close to Earth, so the delay lasts only a few seconds.","ko":"대부분의 별은 지구에 가까워서 지연은 몇 초밖에 되지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Most stars are incredibly far away from Earth, so this delay is not just a few seconds or minutes, but often dozens or even hundreds of years.","대부분의 별은 지구에서 엄청나게 멀리 떨어져 있어서, 이 지연은 단지 몇 초나 몇 분이 아니라 종종 수십 년, 심지어 수백 년이다."]],"w":"5번에서 대부분의 별은 incredibly far away(엄청나게 멀리)라서 지연이 몇 초가 아니라 수십 년, 수백 년이라고 함.","c":"F"},"h":"6ff4eb9352"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... space is so vast that even that speed isn’t enough...)","ko":"... 우주는 너무나 ( ) 그 속도로도 충분하지 않다.","opts":["좁은","어두운","광대한","조용한"],"word":"vast","r":{"a":"3) 광대한","ev":"3번 문장","s":[[3,"Light travels at about 300,000 kilometers per second, but space is so vast that even that speed isn’t enough for light to reach us instantly.","빛은 초속 약 30만 킬로미터로 이동하지만, 우주는 너무나 광대해서 그 속도로도 빛이 우리에게 즉시 도달하기에는 충분하지 않다."]],"w":"3번에서 빛이 아주 빨라도 모자랄 만큼 우주가 크다는 뜻. vast = 광대한, 아주 넓은. 좁은이나 어두운은 문맥과 맞지 않음.","c":3},"h":"f13ecb9461"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... the starlight we observe tonight began its journey in the past.)","ko":"... 오늘 밤 우리가 ( ) 별빛은 과거에 여정을 시작했다.","opts":["관측하는","계산하는","만드는","숨기는"],"word":"observe","r":{"a":"1) 관측하는","ev":"4번 문장","s":[[4,"This means the starlight we observe tonight began its journey in the past.","이는 오늘 밤 우리가 관측하는 별빛이 과거에 여정을 시작했다는 뜻이다."]],"w":"4번에서 우리가 밤하늘에서 보는 별빛을 observe한다고 했으니 '살펴보다, 관측하다'. 계산하거나 만드는 것이 아님.","c":1},"h":"00a119f260"},{"n":6,"t":"ref","q":"What does the underlined \"this large time delay\" refer to?\nAstronomers explain this large time delay using a unit called the light-year.","ko":"밑줄 친 this large time delay가 가리키는 것은?","sko":"천문학자들은 광년이라는 단위를 사용해 이 큰 시간 지연을 설명한다.","opts":["별빛이 우리에게 도달하기까지 걸리는 시간","천문학자들이 별을 연구하는 데 걸리는 시간","밤이 지나 아침이 오는 데 걸리는 시간","별이 새로 태어나는 데 걸리는 시간"],"r":{"a":"1) 별빛이 우리에게 도달하기까지 걸리는 시간","ev":"5~6번 문장","s":[[5,"Most stars are incredibly far away from Earth, so this delay is not just a few seconds or minutes, but often dozens or even hundreds of years.","대부분의 별은 지구에서 엄청나게 멀리 떨어져 있어서, 이 지연은 단지 몇 초나 몇 분이 아니라 종종 수십 년, 심지어 수백 년이다."],[6,"Astronomers explain this large time delay using a unit called the light-year.","천문학자들은 광년이라는 단위를 사용해 이 큰 시간 지연을 설명한다."]],"w":"6번의 this large time delay는 5번에서 말한, 별빛이 지구에 도달하기까지 몇 십 년, 몇 백 년씩 걸리는 시간 차이(지연).","c":1,"k":"this large time delay = 별빛이 우리에게 도달하기까지 걸리는 시간"},"pron":"this large time delay","h":"e136e1cced"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, we are actually seeing their past.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 사실 우리는 별의 과거를 보고 있다.","opts":["우리는 별을 지금 이 순간의 모습 그대로 보고 있다.","우리는 사실 별의 과거 모습을 보고 있다.","우리는 사실 별의 미래 모습을 보고 있다.","우리는 별을 전혀 볼 수 없다."],"r":{"a":"2) 우리는 사실 별의 과거 모습을 보고 있다.","ev":"2번 문장","s":[[2,"However, we are actually seeing their past.","그러나 사실 우리는 별의 과거를 보고 있다."]],"w":"we are actually seeing their past는 사실 우리는 별의 과거를 보고 있다는 뜻. However(그러나)는 1번의 \"지금 모습 그대로\"라는 느낌과 반대되는 내용을 이끎.","c":2},"h":"9496abccba"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["1광년은 빛이 1년 동안 이동하는 거리이다.","1광년은 별이 태어나는 데 걸리는 시간이다.","1광년은 하늘에 있는 별의 개수이다.","1광년은 빛이 1초 동안 이동하는 거리이다."],"opts":["A light-year is the distance that light travels in one year.","A light-year is the time that a star takes to be born.","A light-year is the number of stars in the sky.","A light-year is the distance that light travels in one second."],"r":{"a":"1) A light-year is the distance that light travels in one year. (1광년은 빛이 1년 동안 이동하는 거리이다.)","ev":"7번 문장","s":[[7,"A light-year is the distance that light travels in one year.","1광년은 빛이 1년 동안 이동하는 거리이다."]],"w":"7번에서 1광년은 빛이 1년 동안 이동하는 거리라고 함. ②③은 본문에 없는 내용이고, ④는 1년이 아니라 1초라서 틀림.","c":1},"h":"02ee653da4"},{"n":9,"t":"sum","q":"So every time we look up, we are seeing a piece of (A) shining in the (B) sky.","ko":"우리가 올려다볼 때마다, 우리는 (B) 하늘에서 빛나는 (A)의 한 조각을 보고 있다.","oko":["(A) 미래 / (B) 밝은","(A) 역사 / (B) 밝은","(A) 미래 / (B) 어두운","(A) 역사 / (B) 어두운","(A) 과학 / (B) 밝은"],"opts":["(A) future / (B) bright","(A) history / (B) bright","(A) future / (B) dark","(A) history / (B) dark","(A) science / (B) bright"],"r":{"a":"4) (A) history / (B) dark ((A) 역사 / (B) 어두운)","ev":"9번 문장","s":[[9,"So every time we look up, we are seeing a piece of history shining in the dark sky.","그래서 우리가 올려다볼 때마다, 우리는 어두운 하늘에서 빛나는 역사의 한 조각을 보고 있는 것이다."]],"w":"9번: 우리가 올려다볼 때마다 어두운(dark) 하늘에서 빛나는 역사(history)의 한 조각을 보고 있는 것이다.","c":4},"h":"4389dff1b5"},{"n":10,"t":"fill","q":"When we look at the [A] sky, it may [B] like we are seeing the stars as they are right now.","ko":"우리가 [A] 하늘을 볼 때, 별을 지금 이 순간의 모습 그대로 보고 있는 것처럼 [B] 수 있다.","bank":["night","seem","instantly","incredibly","tonight","delay"],"bko":{"night":"밤","seem":"~인 것 같다(처럼 보이다)","instantly":"즉시","incredibly":"엄청나게","tonight":"오늘 밤","delay":"지연"},"r":{"a":"[A] night (밤), [B] seem (~인 것 같다(처럼 보이다))","ev":"1번 문장","s":[[1,"When we look at the night sky, it may seem like we are seeing the stars as they are right now.","밤하늘을 볼 때, 우리가 별을 지금 이 순간의 모습 그대로 보고 있는 것처럼 느껴질 수 있다."]],"w":"1번: 밤(night)하늘을 볼 때, 별을 지금 이 순간의 모습 그대로 보고 있는 것처럼 보일(seem) 수 있다.","c":null},"h":"e33552eea6"}]},{"u":7,"id":"b4-07-3","no":3,"ko":"얇은 대기의 화성에서 헬리콥터가 날았다고?","items":[{"n":1,"t":"tf","q":"NASA sent a small helicopter called Ingenuity to Mars in 2021 to test a belief.","ko":"NASA는 한 믿음을 시험하기 위해 2021년에 인저뉴이티라는 작은 헬리콥터를 화성에 보냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"In 2021, NASA tested this belief by sending a small helicopter called Ingenuity to Mars.","2021년에 NASA는 인저뉴이티(Ingenuity)라는 작은 헬리콥터를 화성에 보내 이 믿음을 시험했다."]],"w":"4번에 In 2021, NASA tested this belief by sending a small helicopter called Ingenuity to Mars가 그대로 나옴.","c":"T"},"h":"770c132e1f"},{"n":2,"t":"tf","q":"The atmosphere of Mars is about as thick as Earth’s atmosphere.","ko":"화성의 대기는 지구의 대기만큼 두껍다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"It is about one percent as thick as Earth’s atmosphere.","그것은 지구 대기 두께의 약 1퍼센트이다."]],"w":"2번에서 화성 대기는 지구 대기의 약 1퍼센트 두께라고 함. 지구만큼 두껍다는 말은 반대.","c":"F"},"h":"06800628d4"},{"n":3,"t":"tf","q":"Ingenuity flew to Mars by itself without any help.","ko":"인저뉴이티는 아무 도움 없이 스스로 날아서 화성에 갔다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The helicopter traveled to Mars on a rover and was later placed on the planet’s surface.","그 헬리콥터는 탐사 로봇 차량(rover)에 실려 화성으로 이동했고, 나중에 행성의 표면에 내려졌다."]],"w":"5번에서 헬리콥터는 rover(탐사 로봇 차량)에 실려 화성으로 이동했다고 함. 스스로 날아간 것이 아님.","c":"F"},"h":"ed56bcec45"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It stayed steady in the air and then landed safely.)","ko":"그것은 공중에서 ( ) 머물다가 안전하게 착륙했다.","opts":["흔들리는","위험한","안정적인","느린"],"word":"steady","r":{"a":"3) 안정적인","ev":"9번 문장","s":[[9,"It stayed steady in the air and then landed safely.","그것은 공중에서 안정적으로 머물다가 안전하게 착륙했다."]],"w":"9번에서 공중에 머물다가 안전하게 착륙했으니 흔들리지 않았다는 뜻. steady = 안정적인. 흔들리는이나 위험한은 반대.","c":3},"h":"f1220107fc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (After this success, Ingenuity completed many more flights.)","ko":"이 성공 이후, 인저뉴이티는 더 많은 비행을 ( ).","opts":["취소했다","완수했다","시작했다","잃어버렸다"],"word":"completed","r":{"a":"2) 완수했다","ev":"11번 문장","s":[[11,"After this success, Ingenuity completed many more flights.","이 성공 이후, 인저뉴이티는 더 많은 비행을 완수했다."]],"w":"11번에서 첫 성공 뒤에 더 많은 비행을 끝까지 해냈다는 뜻. complete(완수하다) = 끝까지 해내다. 취소나 분실은 성공 이후 흐름과 맞지 않음.","c":2},"h":"83e4786fec"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nDuring its first test flight, Ingenuity lifted off using its own power.","ko":"밑줄 친 its가 가리키는 것은?","sko":"첫 시험 비행 동안, 인저뉴이티는 자체 동력을 사용해 떠올랐다.","opts":["인저뉴이티","NASA","탐사 로봇 차량","화성"],"r":{"a":"1) 인저뉴이티","ev":"8번 문장","s":[[8,"During its first test flight, Ingenuity lifted off using its own power.","첫 시험 비행 동안, 인저뉴이티는 자체 동력을 사용해 떠올랐다."]],"w":"8번에서 첫 시험 비행 동안 자체 동력을 사용해 떠오른 것은 인저뉴이티(Ingenuity). its는 인저뉴이티를 가리킴.","c":1,"k":"its = 인저뉴이티"},"pron":"its","h":"5f018bbb08"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because of this, scientists once believed that powered flight on Mars was almost impossible.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 때문에, 과학자들은 한때 화성에서의 동력 비행이 거의 불가능하다고 믿었다.","opts":["이 때문에 과학자들은 한때 화성에서 동력 비행이 거의 불가능하다고 생각했다.","이 때문에 과학자들은 화성에서 동력 비행이 아주 쉽다고 생각했다.","이 때문에 과학자들은 화성에서 헬리콥터를 만드는 것을 금지했다.","이 때문에 과학자들은 화성에 가는 것 자체가 불가능하다고 믿었다."],"r":{"a":"1) 이 때문에 과학자들은 한때 화성에서 동력 비행이 거의 불가능하다고 생각했다.","ev":"3번 문장","s":[[3,"Because of this, scientists once believed that powered flight on Mars was almost impossible.","이 때문에, 과학자들은 한때 화성에서의 동력 비행이 거의 불가능하다고 믿었다."]],"w":"scientists once believed that powered flight on Mars was almost impossible은 과학자들이 한때 화성에서의 동력 비행이 거의 불가능하다고 믿었다는 뜻. Because of this(이 때문에)는 앞 문장의 이유를 받음.","c":1},"h":"2f3783efd7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["화성의 대기는 지구 대기만큼 두껍다.","첫 시험 비행은 몇 분 동안 계속되었다.","첫 시험 비행은 몇 초뿐이었지만 다른 행성에서의 동력 비행이 가능하다는 것을 보여 주었다.","과학자들은 화성에서의 비행이 쉽다고 믿었다."],"opts":["The atmosphere of Mars is as thick as Earth’s atmosphere.","The first test flight continued for several minutes.","The first test flight lasted only a few seconds, but it showed that powered flight on another planet was possible.","Scientists believed that flight on Mars would be easy."],"r":{"a":"3) The first test flight lasted only a few seconds, but it showed that powered flight on another planet was possible.","ev":"10번 문장","s":[[10,"The flight lasted only a few seconds, but it showed that powered flight on another planet was possible.","그 비행은 단 몇 초 동안만 지속되었지만, 다른 행성에서의 동력 비행이 가능하다는 것을 보여 주었다."]],"w":"10번에서 첫 비행은 몇 초뿐이었지만 가능하다는 것을 보여 줬다고 함. 2번에서 대기는 1퍼센트 두께이고, 3번에서 과학자들은 불가능하다고 믿었음.","c":3},"h":"c485debf03"},{"n":9,"t":"sum","q":"To fly on Mars, Ingenuity was designed to be (A) and its blades could spin much (B) than helicopters on Earth.","ko":"화성에서 날기 위해 인저뉴이티는 (A) 설계되었고, 그 날개는 지구의 헬리콥터보다 훨씬 더 (B) 회전할 수 있었다.","oko":["(A) 무겁게 / (B) 느리게","(A) 무겁게 / (B) 빠르게","(A) 가볍게 / (B) 느리게","(A) 크게 / (B) 느리게","(A) 가볍게 / (B) 빠르게"],"opts":["(A) heavy / (B) slower","(A) heavy / (B) faster","(A) light / (B) slower","(A) large / (B) slower","(A) light / (B) faster"],"r":{"a":"5) (A) light / (B) faster ((A) 가볍게 / (B) 빠르게)","ev":"6~7번 문장","s":[[6,"To fly on Mars, Ingenuity was designed to be light and powered by strong batteries.","화성에서 날기 위해, 인저뉴이티는 가볍고 강력한 배터리로 움직이도록 설계되었다."],[7,"Also, its blades were able to spin much faster than helicopters on Earth.","또한, 그 날개는 지구의 헬리콥터보다 훨씬 더 빠르게 회전할 수 있었다."]],"w":"6번에서 인저뉴이티는 가볍게(light) 설계되었고, 7번에서 날개가 지구의 헬리콥터보다 훨씬 더 빠르게(faster) 회전할 수 있었다고 함.","c":5},"h":"4f50b01794"},{"n":10,"t":"fill","q":"These flights lasted [A] and helped scientists [B] Mars from the air.","ko":"이 비행들은 [A] 지속되었고 과학자들이 공중에서 화성을 [B] 것을 도왔다.","bank":["longer","explore","atmosphere","blades","impossible","rover"],"bko":{"longer":"더 오래","explore":"탐사하다","atmosphere":"대기","blades":"날개","impossible":"불가능한","rover":"탐사 로봇 차량"},"r":{"a":"[A] longer (더 오래), [B] explore (탐사하다)","ev":"12번 문장","s":[[12,"These flights lasted longer and helped scientists explore Mars from the air.","이 비행들은 더 오래 지속되었고 과학자들이 공중에서 화성을 탐사하는 것을 도왔다."]],"w":"12번: 이 비행들은 더 오래(longer) 지속되었고 과학자들이 공중에서 화성을 탐사하는(explore) 것을 도왔다.","c":null},"h":"de9bf33079"}]},{"u":7,"id":"b4-07-4","no":4,"ko":"우주비행사는 어떻게 우주로 갈 준비를 할까?","items":[{"n":1,"t":"tf","q":"Astronauts begin with about two years of basic training.","ko":"우주비행사들은 약 2년간의 기초 훈련으로 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They begin with about two years of basic training.","그들은 약 2년간의 기초 훈련으로 시작한다."]],"w":"2번에 They begin with about two years of basic training이 그대로 나옴.","c":"T"},"h":"1d20b08422"},{"n":2,"t":"tf","q":"Astronauts practice for spacewalks in a huge desert.","ko":"우주비행사들은 우주 유영을 준비하기 위해 거대한 사막에서 연습한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"To prepare for spacewalks, they practice underwater in a huge swimming pool.","우주 유영을 준비하기 위해, 그들은 거대한 수영장 안에서 물속 연습을 한다."]],"w":"6번에서 우주 유영을 준비하기 위해 거대한 수영장에서 물속 연습을 한다고 함. 사막은 나오지 않음.","c":"F"},"h":"35df8fa80b"},{"n":3,"t":"tf","q":"Astronauts repeat their mission tasks many times until they are ready to fly into space.","ko":"우주비행사들은 우주로 날아갈 준비가 될 때까지 임무 과제를 여러 번 반복한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Astronauts continue practicing for years and repeat their mission tasks many times until they are ready to fly into space.","우주비행사들은 수년 동안 계속 연습하고, 우주로 날아갈 준비가 될 때까지 임무 과제를 여러 번 반복한다."]],"w":"12번에 repeat their mission tasks many times until they are ready가 그대로 나옴.","c":"T"},"h":"29c5212897"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... astronauts prepare for their specific missions.)","ko":"... 우주비행사들은 자신의 ( ) 임무를 준비한다.","opts":["일반적인","구체적인","비밀의","쉬운"],"word":"specific","r":{"a":"2) 구체적인","ev":"4번 문장","s":[[4,"After this basic training, astronauts prepare for their specific missions.","이 기초 훈련 후에, 우주비행사들은 각자의 구체적인 임무를 준비한다."]],"w":"4번에서 기초 훈련 다음에 각자 맡은 임무를 준비한다는 뜻. specific = 구체적인, 정해진. 일반적인은 반대 느낌.","c":2},"h":"b254735a1f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... staying calm under pressure.)","ko":"... ( ) 속에서 침착함을 유지하는 것","opts":["속도","거리","높이","압박감"],"word":"pressure","r":{"a":"4) 압박감","ev":"9번 문장","s":[[9,"These fast jets help them practice making quick decisions and staying calm under pressure.","이 빠른 제트기는 그들이 빠른 결정을 내리고 압박감 속에서 침착함을 유지하는 것을 연습하도록 도와준다."]],"w":"9번에서 빠르게 결정하고 침착함을 유지해야 하는 상황이라 pressure = 압박감. 속도나 거리는 침착함과 어울리지 않음.","c":4},"h":"f07c79b7a7"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThe experience prepares them for unexpected situations during space missions.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그 경험은 우주 임무 중 예상치 못한 상황에 대비하게 해 준다.","opts":["우주비행사들","과학자들","관제 센터 직원들","훈련용 제트기들"],"r":{"a":"1) 우주비행사들","ev":"10번 문장","s":[[10,"The experience prepares them for unexpected situations during space missions.","그 경험은 우주 임무 중 예상치 못한 상황에 대비하게 해 준다."]],"w":"10번에서 그 경험은 우주 임무 중 예상치 못한 상황에 대비하게 해 주는데, 대비하게 되는 사람은 훈련을 받는 우주비행사들.","c":1,"k":"them = 우주비행사들"},"pron":"them","h":"ebde076460"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even after all this, their training is not over.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 모든 것을 거치고도, 그들의 훈련은 끝나지 않는다.","opts":["이 모든 훈련으로 우주비행사의 훈련이 완전히 끝났다.","이 모든 훈련은 너무 어려워서 포기하는 사람이 많다.","이 모든 훈련을 마친 뒤에도 우주비행사들의 훈련은 계속된다.","이 모든 훈련은 우주에 간 뒤에 시작된다."],"r":{"a":"3) 이 모든 훈련을 마친 뒤에도 우주비행사들의 훈련은 계속된다.","ev":"11~12번 문장","s":[[11,"Even after all this, their training is not over.","이 모든 것을 거치고도, 그들의 훈련은 끝나지 않는다."],[12,"Astronauts continue practicing for years and repeat their mission tasks many times until they are ready to fly into space.","우주비행사들은 수년 동안 계속 연습하고, 우주로 날아갈 준비가 될 때까지 임무 과제를 여러 번 반복한다."]],"w":"11번 not over는 '끝나지 않았다'. 12번에서 수년간 계속 연습하고 반복한다고 이어짐. 훈련이 끝났다거나 쉬운 훈련이라는 말은 본문에 없음.","c":3},"h":"d1626511b8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["기초 훈련은 약 2개월 동안 진행된다.","기초 훈련 동안 우주비행사들은 우주선 장비를 사용하고 수리하는 방법을 배운다.","우주비행사들은 T-38 제트기로 미세 중력에서 일하는 연습을 한다.","우주비행사들의
