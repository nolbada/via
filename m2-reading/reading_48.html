<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 48</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}

.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}

button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}

.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Last summer, I spended a month at my cousin's place in New York City.","ko":"지난여름 나는 뉴욕시의 사촌 집에서 한 달을 보냈다.","ok":false,"foot":[],"fixes":[{"wrong":"spended","right":"spent","partial":false,"at":[3],"point":"불규칙 과거형: spend의 과거형은 spent (spended 아님)","topic":"불규칙 과거형","memo":"spend의 과거형은 spent (spended 아님)"}]},{"n":2,"tag":null,"en":"Each days I enjoyed the city, and it was a unforgettable experience.","ko":"매일 나는 그 도시를 즐겼고 그것은 잊지 못할 경험이었다.","ok":false,"foot":[],"fixes":[{"wrong":"days","right":"day","partial":false,"at":[1],"point":"수량 형용사 each: each 뒤에는 단수명사 day 사용","topic":"수량 형용사 each","memo":"each 뒤에는 단수명사 day 사용"},{"wrong":"a","right":"an","partial":false,"at":[9],"point":"관사 a/an: unforgettable은 모음 소리로 시작하므로 an","topic":"관사 a/an","memo":"unforgettable은 모음 소리로 시작하므로 an"}]},{"n":3,"tag":null,"en":"New York City is famous for it high-rise buildings, but it also has beautifully parks.","ko":"뉴욕시는 고층 건물로 유명하지만, 아름다운 공원들도 있다.","ok":false,"foot":[],"fixes":[{"wrong":"it","right":"its","partial":false,"at":[6],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 its 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 its 사용"},{"wrong":"beautifully","right":"beautiful","partial":false,"at":[13],"point":"형용사와 부사: 명사 parks를 꾸미는 형용사 beautiful 사용","topic":"형용사와 부사","memo":"명사 parks를 꾸미는 형용사 beautiful 사용"}]},{"n":4,"tag":null,"en":"As my cousin's apartment was near Central Park, I often went there. I attended an free yoga class and rowed a boat on the lake.","ko":"내 사촌의 아파트가 센트럴 파크 근처에 있었기 때문에 나는 자주 거기에 갔다. 나는 무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[14],"point":"관사 a/an: free는 자음 소리로 시작하므로 a free","topic":"관사 a/an","memo":"free는 자음 소리로 시작하므로 a free"}]},{"n":5,"tag":null,"en":"Sometimes, I lay down on the grass and watched people passing by. I once saw a dog walker walking ten dog in the same time.","ko":"때때로 나는 잔디 위에 누워 사람들이 지나가는 것을 보았다. 한번은 도그 워커가 열 마리의 개를 동시에 산책시키는 것을 보았다.","ok":false,"foot":[],"fixes":[{"wrong":"dog","right":"dogs","partial":false,"at":[20],"point":"명사의 복수형: ten 뒤에는 복수명사 dogs 사용","topic":"명사의 복수형","memo":"ten 뒤에는 복수명사 dogs 사용"},{"wrong":"in","right":"at","partial":false,"at":[21],"point":"기본전치사: '동시에'는 at the same time 사용","topic":"기본전치사","memo":"'동시에'는 at the same time 사용"}]},{"n":6,"tag":null,"en":"It was amazing!","ko":"정말 놀라웠다!","ok":true,"foot":[],"fixes":[]},{"n":7,"tag":null,"en":"After spend time in the park, I often visited a famous bagel shop near the park. It haved more than 20 toppings.","ko":"나는 공원에서 시간을 보낸 후에 공원 근처의 유명한 베이글 가게에 자주 갔다. 거기에는 20개가 넘는 토핑이 있었다.","ok":false,"foot":[],"fixes":[{"wrong":"spend","right":"spending","partial":false,"at":[1],"point":"동명사: 전치사 After 뒤에는 동명사 spending 사용","topic":"동명사","memo":"전치사 After 뒤에는 동명사 spending 사용"},{"wrong":"haved","right":"had","partial":false,"at":[17],"point":"불규칙 과거형: have의 과거형은 had (haved 아님)","topic":"불규칙 과거형","memo":"have의 과거형은 had (haved 아님)"}]},{"n":8,"tag":null,"en":"Among the toppings that I tried, bacon and cheese were my favorites.","ko":"내가 먹어 본 토핑 중에서, 베이컨과 치즈는 내가 가장 좋아하는 것이었다.","ok":true,"foot":[],"fixes":[]},{"n":9,"tag":null,"en":"I enjoyed to visit museums such as the Met and MoMA. They had many famous works of art that I saw in art books.","ko":"나는 Met과 MoMA 같은 박물관에 가는 것을 즐겼다. 그것들은 내가 미술책에서 보았던 유명한 예술품들을 많이 소장했다.","ok":false,"foot":[],"fixes":[{"wrong":"to visit","right":"visiting","partial":false,"at":[2],"point":"동명사: enjoy 뒤에는 동명사 visiting 사용","topic":"동명사","memo":"enjoy 뒤에는 동명사 visiting 사용"}]},{"n":10,"tag":null,"en":"At the Met, there were a room full of paintings by Vincent van Gogh.","ko":"Met에는 Vincent van Gogh가 그린 그림들로 가득 찬 방이 있었다.","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[4],"point":"be동사의 수일치: a room은 단수: was (were 아님)","topic":"be동사의 수일치","memo":"a room은 단수: was (were 아님)"}]},{"n":11,"tag":null,"en":"I could not believes that I was looking at his works of art up close. In another rooms, I saw people copying Edgar Degas' paintings.","ko":"나는 내가 그의 작품들을 가까이에서 보고 있다는 것을 믿을 수 없었다. 다른 방에서는 사람들이 Edgar Degas의 그림을 따라 그리고 있는 것을 보았다.","ok":false,"foot":[],"fixes":[{"wrong":"believes","right":"believe","partial":false,"at":[3],"point":"조동사 뒤 동사원형: could not 뒤에는 동사원형: believe (believes 아님)","topic":"조동사 뒤 동사원형","memo":"could not 뒤에는 동사원형: believe (believes 아님)"},{"wrong":"rooms","right":"room","partial":false,"at":[17],"point":"수량 형용사 another: another 뒤에는 단수명사 room 사용","topic":"수량 형용사 another","memo":"another 뒤에는 단수명사 room 사용"}]},{"n":12,"tag":null,"en":"I also copied one of his paintings, Dancer. It was quite a special experience.","ko":"나도 그의 그림 중 하나인 <Dancer>를 따라 그렸다. 그것은 매우 특별한 경험이었다.","ok":true,"foot":[],"fixes":[]},{"n":13,"tag":null,"en":"Watching The Lion King on Broadway were the most unforgettable moment.","ko":"브로드웨이에서 <The Lion King>을 관람한 것은 가장 잊지 못할 순간이었다.","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[6],"point":"be동사의 수일치: 동명사구 주어는 단수 취급하여 was 사용","topic":"be동사의 수일치","memo":"동명사구 주어는 단수 취급하여 was 사용"}]},{"n":14,"tag":null,"en":"When I saw the colorfully stage, I felt like I was in the middle of a African jungle.","ko":"다채로운 무대를 보았을 때, 나는 마치 아프리카 정글 한가운데에 있는 것 같은 기분이 들었다.","ok":false,"foot":[],"fixes":[{"wrong":"colorfully","right":"colorful","partial":false,"at":[4],"point":"형용사와 부사: 명사 stage를 꾸미는 형용사 colorful 사용","topic":"형용사와 부사","memo":"명사 stage를 꾸미는 형용사 colorful 사용"},{"wrong":"a","right":"an","partial":false,"at":[15],"point":"관사 a/an: African은 모음 소리로 시작하므로 an","topic":"관사 a/an","memo":"African은 모음 소리로 시작하므로 an"}]},{"n":15,"tag":null,"en":"The actors danced like real animals and sang in perfect harmony.","ko":"배우들은 진짜 동물처럼 춤을 췄고 완벽한 조화를 이루어 노래를 불렀다.","ok":true,"foot":[],"fixes":[]},{"n":16,"tag":null,"en":"In the last scene, the hero Simba showed he baby lion to the world, and tears rolls down my face.","ko":"마지막 장면에서 주인공 Simba가 자신의 새끼 사자를 세상에 보여 주었는데, 눈물이 내 얼굴을 타고 흘러내렸다.","ok":false,"foot":[],"fixes":[{"wrong":"he","right":"his","par w in art books.","그것들은 내가 미술책에서 보았던 유명한 예술품들을 많이 소장했다.",0],["At the Met, there was a room full of paintings by Vincent van Gogh.","Met에는 Vincent van Gogh가 그린 그림들로 가득 찬 방이 있었다.",0],["I could not believe that I was looking at his works of art up close.","나는 내가 그의 작품들을 가까이에서 보고 있다는 것을 믿을 수 없었다.",0],["In another room, I saw people copying Edgar Degas' paintings.","다른 방에서는 사람들이 Edgar Degas의 그림을 따라 그리고 있는 것을 보았다.",0],["I also copied one of his paintings, Dancer.","나도 그의 그림 중 하나인 <Dancer>를 따라 그렸다.",0],["It was quite a special experience.","그것은 매우 특별한 경험이었다.",0],["Watching The Lion King on Broadway was the most unforgettable moment.","브로드웨이에서 <The Lion King>을 관람한 것은 가장 잊지 못할 순간이었다.",1],["When I saw the colorful stage, I felt like I was in the middle of an African jungle.","다채로운 무대를 보았을 때, 나는 마치 아프리카 정글 한가운데에 있는 것 같은 기분이 들었다.",0],["The actors danced like real animals and sang in perfect harmony.","배우들은 진짜 동물처럼 춤을 췄고 완벽한 조화를 이루어 노래를 불렀다.",0],["In the last scene, the hero Simba showed his baby lion to the world, and tears rolled down my face.","마지막 장면에서 주인공 Simba가 자신의 새끼 사자를 세상에 보여 주었는데, 눈물이 내 얼굴을 타고 흘러내렸다.",0],["When I came out, huge, colorful signs were shining brightly.","내가 밖으로 나왔을 때 크고 화려한 광고판들이 밝게 빛나고 있었다.",0],["At that moment, I knew I would never forget this amazing city.","그 순간 나는 이 멋진 도시를 결코 잊지 못할 것이라는 것을 알았다.",0]];var RNUM=48;var TITLE_EN="Living for a Month in New York City";var PASS_EN=["Living for a Month in New York City","Last summer, I spent a month at my cousin's place in New York City. Each day I enjoyed the city, and it was an unforgettable experience.","New York City is famous for its high-rise buildings, but it also has beautiful parks. As my cousin's apartment was near Central Park, I often went there. I attended a free yoga class and rowed a boat on the lake. Sometimes, I lay down on the grass and watched people passing by. I once saw a dog walker walking ten dogs at the same time. It was amazing!","After spending time in the park, I often visited a famous bagel shop near the park. It had more than 20 toppings. Among the toppings that I tried, bacon and cheese were my favorites.","I enjoyed visiting museums such as the Met and MoMA. They had many famous works of art that I saw in art books. At the Met, there was a room full of paintings by Vincent van Gogh. I could not believe that I was looking at his works of art up close. In another room, I saw people copying Edgar Degas' paintings. I also copied one of his paintings, Dancer. It was quite a special experience.","Watching The Lion King on Broadway was the most unforgettable moment. When I saw the colorful stage, I felt like I was in the middle of an African jungle. The actors danced like real animals and sang in perfect harmony. In the last scene, the hero Simba showed his baby lion to the world, and tears rolled down my face. When I came out, huge, colorful signs were shining brightly. At that moment, I knew I would never forget this amazing city."];var PASS_KO=["뉴욕시에서 한 달 살기","지난여름 나는 뉴욕시의 사촌 집에서 한 달을 보냈다. 매일 나는 그 도시를 즐겼고 그것은 잊지 못할 경험이었다.","뉴욕시는 고층 건물로 유명하지만, 아름다운 공원들도 있다. 내 사촌의 아파트가 센트럴 파크 근처에 있었기 때문에 나는 자주 거기에 갔다. 나는 무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다. 때때로 나는 잔디 위에 누워 사람들이 지나가는 것을 보았다. 한번은 도그 워커가 열 마리의 개를 동시에 산책시키는 것을 보았다. 정말 놀라웠다!","나는 공원에서 시간을 보낸 후에 공원 근처의 유명한 베이글 가게에 자주 갔다. 거기에는 20개가 넘는 토핑이 있었다. 내가 먹어 본 토핑 중에서, 베이컨과 치즈는 내가 가장 좋아하는 것이었다.","나는 Met과 MoMA 같은 박물관에 가는 것을 즐겼다. 그것들은 내가 미술책에서 보았던 유명한 예술품들을 많이 소장했다. Met에는 Vincent van Gogh가 그린 그림들로 가득 찬 방이 있었다. 나는 내가 그의 작품들을 가까이에서 보고 있다는 것을 믿을 수 없었다. 다른 방에서는 사람들이 Edgar Degas의 그림을 따라 그리고 있는 것을 보았다. 나도 그의 그림 중 하나인 <Dancer>를 따라 그렸다. 그것은 매우 특별한 경험이었다.","브로드웨이에서 <The Lion King>을 관람한 것은 가장 잊지 못할 순간이었다. 다채로운 무대를 보았을 때, 나는 마치 아프리카 정글 한가운데에 있는 것 같은 기분이 들었다. 배우들은 진짜 동물처럼 춤을 췄고 완벽한 조화를 이루어 노래를 불렀다. 마지막 장면에서 주인공 Simba가 자신의 새끼 사자를 세상에 보여 주었는데, 눈물이 내 얼굴을 타고 흘러내렸다. 내가 밖으로 나왔을 때 크고 화려한 광고판들이 밝게 빛나고 있었다. 그 순간 나는 이 멋진 도시를 결코 잊지 못할 것이라는 것을 알았다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["B knows a good restaurant near here.","The restaurant is next to the bank.","B has to turn right at the corner.","The restaurant is next to the park.","B asks how much the food is."],"a":1,"ans":"The restaurant is next to the bank.","evs":[["A: Go straight and turn left at the corner. It's next to the bank.","쭉 가서 모퉁이에서 왼쪽으로 돌아. 은행 옆에 있어."],["A: There is a good restaurant near here.","이 근처에 좋은 식당이 있어."]],"ev":["A: Go straight and turn left at the corner. It's next to the bank.","쭉 가서 모퉁이에서 왼쪽으로 돌아. 은행 옆에 있어."],"ow":["오답 ✕ — 'There is a good restaurant near here.'(이 근처에 좋은 식당이 있어.)라고 말한 사람은 A이다. B는 'How can I get there?'(거기에 어떻게 갈 수 있니?)라고 길을 물었으므로 틀림.","정답 ○ — A가 'It's next to the bank.'(은행 옆에 있어.)라고 했으므로 식당이 은행 옆에 있다는 보기가 일치한다.","오답 ✕ — A는 'turn left at the corner'(모퉁이에서 왼쪽으로 돌아)라고 했는데 이 보기는 오른쪽(right)이라고 해서 틀림.","오답 ✕ — 식당은 공원이 아니라 'next to the bank'(은행 옆)에 있다고 했으므로 틀림.","오답 ✕ — B는 'How can I get there?'(거기에 어떻게 갈 수 있니?)라고 가는 방법을 물었다. 음식 값을 묻지 않았으므로 틀림."],"memo":["정답 ②: 식당은 은행 옆에 있다.","근거: Go straight and turn left at the corner. It's next to the bank.(쭉 가서 모퉁이에서 왼쪽으로 돌아. 은행 옆에 있어.)","함정: ③은 오른쪽이 아니라 왼쪽(left)으로 돌라고 해서 ✕"],"why":"식당은 쭉 가서 모퉁이에서 왼쪽으로 돌면 나오는 은행 옆에 있다."}],"dlg":[["A","There is a good restaurant near here.","이 근처에 좋은 식당이 있어."],["B","How can I get there?","거기에 어떻게 갈 수 있니?"],["A","Go straight and turn left at the corner. It's next to the bank.","쭉 가서 모퉁이에서 왼쪽으로 돌아. 은행 옆에 있어."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["The traditional Dutch dolls are popular for tourists.","The girl wants to buy a doll in the blue dress.","The girl should pay 10 euros for a doll.","The girl doesn't need anything else except the doll.","The man recommends a seafood restaurant to the girl."],"a":3,"ans":"The girl doesn't need anything else except the doll.","evs":[["M: That'll be 10 euros. Anything else I can help you with?","10유로입니다. 더 도와드릴 것이 있나요?"],["G: Could you recommend a good restaurant around here?","이 근처에 좋은 식당을 추천해 주실 수 있나요?"]],"ev":["M: That'll be 10 euros. Anything else I can help you with?","10유로입니다. 더 도와드릴 것이 있나요?"],"ow":["오답 ✕ — 'They are popular items for tourists.'(관광객들에게 인기 있는 물건이에요.)라고 했으므로 일치한다.","오답 ✕ — 소녀가 'Can I have that doll in the blue dress?'(파란 드레스를 입은 저 인형을 살 수 있을까요?)라고 했으므로 일치한다.","오답 ✕ — 점원이 'That'll be 10 euros.'(10유로입니다.)라고 했으므로 일치한다.","정답 ○ — 점원이 'Anything else I can help you with?'(더 도와드릴 것이 있나요?)라고 묻자 소녀는 'Could you recommend a good restaurant around here?'(이 근처에 좋은 식당을 추천해 주실 수 있나요?)라고 했다. 인형 말고도 필요한 것이 있었으므로 일치하지 않는다.","오답 ✕ — 'There's a great seafood restaurant.'(아주 좋은 해산물 식당이 있어요.)라고 했으므로 일치한다."],"memo":["정답 ④: 소녀는 인형 말고도 식당 추천이 필요했다.","근거: Could you recommend a good restaurant around here?(이 근처에 좋은 식당을 추천해 주실 수 있나요?)","함정: ③은 10유로라고 했으므로 맞는 말(○)"],"why":"소녀는 인형을 산 뒤 식당 추천도 부탁했으므로 더 필요한 것이 없다는 말은 틀리다."},{"n":3,"q":"위 대화에서 소녀가 인형 값을 물은 뒤에 점원에게 부탁한 것은?","o":["To give her a discount","To wrap the doll as a gift","To recommend a good restaurant","To call a taxi for her","To show her a picture of the doll"],"a":2,"ans":"To recommend a good restaurant","evs":[["G: Could you recommend a good restaurant around here?","이 근처에 좋은 식당을 추천해 주실 수 있나요?"],["M: Sure. There's a great seafood restaurant. It's not far from here.","물론이죠. 아주 좋은 해산물 식당이 있어요. 여기서 멀지 않아요."]],"ev":["G: Could you recommend a good restaurant around here?","이 근처에 좋은 식당을 추천해 주실 수 있나요?"],"ow":["오답 ✕ — 대화에 할인을 요청하는 말은 없다. 점원이 'That'll be 10 euros.'(10유로입니다.)라고 하자 소녀는 다른 부탁을 한다.","오답 ✕ — 선물 포장을 부탁하는 말은 대화에 없다. 소녀가 부탁한 것은 'Could you recommend a good restaurant around here?'(이 근처에 좋은 식당을 추천해 주실 수 있나요?)이다.","정답 ○ — 소녀가 'Could you recommend a good restaurant around here?'(이 근처에 좋은 식당을 추천해 주실 수 있나요?)라고 부탁했고, 점원은 'There's a great seafood restaurant.'(아주 좋은 해산물 식당이 있어요.)라고 대답했다.","오답 ✕ — 택시를 불러 달라는 말은 없다. 소녀는 'How do I get there?'(거기에 어떻게 가나요?)라고 가는 방법을 물었다.","오답 ✕ — 인형 사진을 보여 달라는 말은 없다. 소녀가 이미 'that doll in the blue dress'(파란 드레스를 입은 저 인형)를 가리켜 사려고 하고 있다."],"memo":["정답 ③: 이 근처의 좋은 식당을 추천해 달라고 부탁했다.","근거: Could you recommend a good restaurant around here?(이 근처에 좋은 식당을 추천해 주실 수 있나요?)","함정: ①은 대화에 할인 얘기가 없어서 ✕"],"why":"소녀는 인형을 산 뒤 근처의 좋은 식당을 추천해 달라고 했다."}],"dlg":[["M","How can I help you?","무엇을 도와드릴까요?"],["G","Are these traditional Dutch dolls?","이것들이 네덜란드 전통 인형인가요?"],["M","Yes, they are. They are popular items for tourists.","네, 맞아요. 관광객들에게 인기 있는 물건이에요."],["G","Can I have that doll in the blue dress? How much is it?","파란 드레스를 입은 저 인형을 살 수 있을까요? 얼마예요?"],["M","That'll be 10 euros. Anything else I can help you with?","10유로입니다. 더 도와드릴 것이 있나요?"],["G","Could you recommend a good restaurant around here?","이 근처에 좋은 식당을 추천해 주실 수 있나요?"],["M","Sure. There's a great seafood restaurant. It's not far from here.","물론이죠. 아주 좋은 해산물 식당이 있어요. 여기서 멀지 않아요."],["G","How do I get there?","거기에 어떻게 가나요?"],["M","Just go straight ahead and turn right at the second corner. You'll see a big sign with a fish on it.","앞으로 쭉 가다가 두 번째 모퉁이에서 오른쪽으로 도세요. 물고기가 그려진 큰 간판이 보일 거예요."],["G","Thank you so much.","정말 고맙습니다."]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["The subway station is next to the bank.","The girl should turn left after three blocks.","The subway station is a ten-minute walk away.","The girl wants to go to the museum.","The man does not know the way."],"a":2,"ans":"The subway station is a ten-minute walk away.","evs":[["M: Not at all. It's just a ten-minute walk.","전혀요. 걸어서 10분밖에 안 걸려요."],["M: Let's see. Just go straight three blocks and turn right. It's next to the park.","어디 보자. 세 블록을 쭉 가서 오른쪽으로 도세요. 공원 옆에 있어요."]],"ev":["M: Not at all. It's just a ten-minute walk.","전혀요. 걸어서 10분밖에 안 걸려요."],"ow":["오답 ✕ — 'It's next to the park.'(공원 옆에 있어요.)라고 했는데 이 보기는 은행(bank) 옆이라고 해서 틀림.","오답 ✕ — 'Just go straight three blocks and turn right.'(세 블록을 쭉 가서 오른쪽으로 도세요.)라고 했는데 이 보기는 왼쪽이라고 해서 틀림.","정답 ○ — 남자가 'It's just a ten-minute walk.'(걸어서 10분밖에 안 걸려요.)라고 했으므로 일치한다.","오답 ✕ — 소녀는 'How do I get to the nearest subway station?'(가장 가까운 지하철역에 어떻게 가나요?)라고 물었다. 박물관이 아니라 지하철역에 가려는 것이다.","오답 ✕ — 남자는 'Just go straight three blocks and turn right.'(세 블록을 쭉 가서 오른쪽으로 도세요.)라고 자세히 알려 주었으므로 길을 안다."],"memo":["정답 ③: 지하철역은 걸어서 10분 거리이다.","근거: It's just a ten-minute walk.(걸어서 10분밖에 안 걸려요.)","함정: ①은 은행이 아니라 공원 옆에 있어서 ✕"],"why":"지하철역은 세 블록 가서 오른쪽으로 돌면 나오고 걸어서 10분 거리이다."}],"dlg":[["G","Excuse me, sir. How do I get to the nearest subway station?","실례합니다. 가장 가까운 지하철역에 어떻게 가나요?"],["M","Let's see. Just go straight three blocks and turn right. It's next to the park.","어디 보자. 세 블록을 쭉 가서 오른쪽으로 도세요. 공원 옆에 있어요."],["G","Go three blocks and turn right. Got it. Is it far from here?","세 블록 가서 오른쪽으로 돌라는 거죠. 알겠어요. 여기서 먼가요?"],["M","Not at all. It's just a ten-minute walk.","전혀요. 걸어서 10분밖에 안 걸려요."]]},{"qs":[{"n":5,"q":"다음 대화를 읽고 답할 수 없는 질문은?","o":["Where is the conversation taking place?","How long is the man planning to stay here?","What does the man want to know?","How much is using a city tour bus?","Why does the woman recommend a city tour bus?"],"a":3,"ans":"How much is using a city tour bus?","evs":[["W: Welcome to Bangkok Visitor Center. How can I help you?","방콕 관광 안내소에 오신 것을 환영합니다. 무엇을 도와드릴까요?"],["W: Why don't you take a city tour bus? You can see the whole city in just one ride.","시티 투어 버스를 타 보는 게 어때요? 한 번만 타면 도시 전체를 볼 수 있어요."]],"ev":["W: Welcome to Bangkok Visitor Center. How can I help you?","방콕 관광 안내소에 오신 것을 환영합니다. 무엇을 도와드릴까요?"],"ow":["오답 ✕ — 'Welcome to Bangkok Visitor Center.'(방콕 관광 안내소에 오신 것을 환영합니다.)에서 방콕 관광 안내소임을 알 수 있으므로 답할 수 있는 질문이다.","오답 ✕ — 'We're going to stay here for just one day.'(저희는 여기에 딱 하루만 머물 예정이에요.)에서 하루라고 답할 수 있다.","오답 ✕ — 'Could you recommend the best way to tour the city?'(도시를 관광하는 가장 좋은 방법을 추천해 주실 수 있나요?)에서 도시를 관광하는 가장 좋은 방법을 알고 싶어 한다고 답할 수 있다.","정답 ○ — 'Why don't you take a city tour bus?'(시티 투어 버스를 타 보는 게 어때요?)라고만 했을 뿐 시티 투어 버스의 요금은 나오지 않는다. 그래서 답할 수 없는 질문이다.","오답 ✕ — 'You can see the whole city in just one ride.'(한 번만 타면 도시 전체를 볼 수 있어요.)에서 이유를 답할 수 있다."],"memo":["정답 ④: 시티 투어 버스의 요금은 대화에 나오지 않는다.","근거: Why don't you take a city tour bus?(시티 투어 버스를 타 보는 게 어때요?)","함정: ⑤는 한 번만 타면 도시 전체를 볼 수 있다는 이유가 있어서 답할 수 있음"],"why":"대화에서 시티 투어 버스의 요금은 알 수 없다."}],"dlg":[["W","Welcome to Bangkok Visitor Center. How can I help you?","방콕 관광 안내소에 오신 것을 환영합니다. 무엇을 도와드릴까요?"],["M","Hi. We're going to stay here for just one day. Could you recommend the best way to tour the city?","안녕하세요. 저희는 여기에 딱 하루만 머물 예정이에요. 도시를 관광하는 가장 좋은 방법을 추천해 주실 수 있나요?"],["W","Why don't you take a city tour bus? You can see the whole city in just one ride.","시티 투어 버스를 타 보는 게 어때요? 한 번만 타면 도시 전체를 볼 수 있어요."],["M","That sounds great. Thanks!","좋네요. 고맙습니다!"]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 주제로 알맞은 것은?","o":["people's love for Central Park","the experience in a yoga class","the peaceful time at Central Park","the importance of having a park near","the people whom I met at Central Park"],"a":2,"ans":"the peaceful time at Central Park","evs":[["I attended a free yoga class and rowed a boat on the lake.","나는 무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다."],["Sometimes, I lay down on the grass and watched people passing by.","때때로 나는 잔디 위에 누워 사람들이 지나가는 것을 보았다."]],"ev":["I attended a free yoga class and rowed a boat on the lake.","나는 무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다."],"ow":["오답 ✕ — 센트럴 파크에 대한 사람들의 사랑을 말하는 글이 아니다. 글쓴이 개인의 경험을 쓴 글이며 'I often went there.'(나는 자주 거기에 갔다.)처럼 글쓴이의 이야기이다.","오답 ✕ — 'I attended a free yoga class'(나는 무료 요가 수업에 참여했고)는 공원에서 한 일 중 하나일 뿐이다. 요가 수업만으로는 글 전체를 담지 못해 너무 좁다.","정답 ○ — 'I attended a free yoga class and rowed a boat on the lake.'(무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다.), 'I lay down on the grass'(잔디 위에 누워)처럼 센트럴 파크에서 보낸 평화로운 시간을 이야기한다.","오답 ✕ — 공원이 가까이 있어야 하는 중요성에 대한 말은 없다. 'my cousin's apartment was near Central Park'(내 사촌의 아파트가 센트럴 파크 근처에 있었기 때문에)은 자주 간 이유일 뿐이다.","오답 ✕ — 'I once saw a dog walker walking ten dogs'(한번은 도그 워커가 열 마리의 개를 산책시키는 것을 보았다)는 사람을 본 것이지 만난 것이 아니다. 만난 사람들에 대한 글이 아니다."],"memo":["정답 ③: the peaceful time at Central Park (센트럴 파크에서의 평화로운 시간)","근거: I attended a free yoga class and rowed a boat on the lake.(무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다.)","함정: ②는 요가가 공원에서 한 일 중 하나일 뿐이라 너무 좁아서 ✕"],"why":"센트럴 파크에서 요가, 보트, 잔디밭 휴식 등으로 보낸 평화로운 시간을 쓴 글이다."}],"pp":[["New York City is famous for its high-rise buildings, but it also has beautiful parks.","뉴욕시는 고층 건물로 유명하지만, 아름다운 공원들도 있다."],["As my cousin's apartment was near Central Park, I often went there.","내 사촌의 아파트가 센트럴 파크 근처에 있었기 때문에 나는 자주 거기에 갔다."],["I attended a free yoga class and rowed a boat on the lake.","나는 무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다."],["Sometimes, I lay down on the grass and watched people passing by.","때때로 나는 잔디 위에 누워 사람들이 지나가는 것을 보았다."],["I once saw a dog walker walking ten dogs at the same time.","한번은 도그 워커가 열 마리의 개를 동시에 산책시키는 것을 보았다."],["It was amazing!","정말 놀라웠다!"]]},{"qs":[{"n":7,"q":"윗글의 내용과 일치하는 것은?","o":["The writer visited a bagel shop far from the park.","The bagel shop had only five toppings.","The writer often visited a famous bagel shop near the park after spending time in the park.","The writer's favorite toppings were tomato and onion.","The writer visited the bagel shop before going to the park."],"a":2,"ans":"The writer often visited a famous bagel shop near the park after spending time in the park.","evs":[["After spending time in the park, I often visited a famous bagel shop near the park.","나는 공원에서 시간을 보낸 후에 공원 근처의 유명한 베이글 가게에 자주 갔다."],["Among the toppings that I tried, bacon and cheese were my favorites.","내가 먹어 본 토핑 중에서, 베이컨과 치즈는 내가 가장 좋아하는 것이었다."]],"ev":["After spending time in the park, I often visited a famous bagel shop near the park.","나는 공원에서 시간을 보낸 후에 공원 근처의 유명한 베이글 가게에 자주 갔다."],"ow":["오답 ✕ — 'a famous bagel shop near the park'(공원 근처의 유명한 베이글 가게)라고 했는데 이 보기는 공원에서 멀다고 해서 틀림.","오답 ✕ — 'It had more than 20 toppings.'(거기에는 20개가 넘는 토핑이 있었다.)라고 했는데 이 보기는 다섯 개뿐이라고 해서 틀림.","정답 ○ — 'After spending time in the park, I often visited a famous bagel shop near the park.'(나는 공원에서 시간을 보낸 후에 공원 근처의 유명한 베이글 가게에 자주 갔다.)와 일치한다.","오답 ✕ — 'bacon and cheese were my favorites'(베이컨과 치즈는 내가 가장 좋아하는 것이었다)라고 했는데 이 보기는 토마토와 양파라고 해서 틀림.","오답 ✕ — 'After spending time in the park'(공원에서 시간을 보낸 후에)라고 했으므로 공원에 간 뒤에 베이글 가게에 갔다. 순서가 거꾸로이다."],"memo":["정답 ③: 글쓴이는 공원에서 시간을 보낸 function key(i,t){return i+':'+t}

function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';

  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';

 });

}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}

 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
