 and found a cottage.","어느 날, 그녀는 숲에서 산책을 하다가 한 오두막집을 발견했다.",1],["She knocked on the door, but there was no answer.","그녀는 문을 두드렸지만, 아무 대답이 없었다.",0],["It was getting dark, and it started to rain.","날이 어두워지고 있었고, 비가 내리기 시작했다.",0],["She opened the door and walked inside.","그녀는 문을 열고 안으로 걸어 들어갔다.",0],["There were three bowls of soup on a table.","식탁 위에는 수프 세 그릇이 있었다.",1],["She ate the smallest one and took selfies with a smile.","그녀는 가장 작은 그릇의 수프를 먹었고 미소를 지으며 셀피를 찍었다.",0],["There were also three chairs.","의자도 세 개 있었다.",0],["She jumped on the smallest one again and again.","그녀는 가장 작은 의자 위에서 몇 번이고 뛰었다.",0],["It broke, but she didn’t care.","의자가 부서졌지만, 그녀는 신경 쓰지 않았다.",0],["“It’s so fun!” shouted Goldilocks.","“너무 재미있어!”라고 Goldilocks가 외쳤다.",1],["She took selfies again and posted all the selfies on social media.","그녀는 다시 셀피를 찍었고 모든 셀피를 소셜 미디어에 올렸다.",1],["Then, she went upstairs and found three beds.","그런 다음, 그녀는 위층으로 올라가 침대 세 개를 발견했다.",0],["She felt tired and fell asleep in the smallest bed.","그녀는 피곤해서 가장 작은 침대에서 잠들었다.",0],["About an hour later, three bears came home.","약 한 시간 후에, 곰 세 마리가 집으로 돌아왔다.",1],["“Someone ate my soup and broke my chair!” cried Baby Bear.","“누군가 내 수프를 먹고 내 의자를 부서뜨렸어요!”라고 아기곰이 외쳤다.",1],["They went upstairs and saw Goldilocks.","그들은 위층으로 가서 Goldilocks를 봤다.",1],["Mother Bear found a phone next to Goldilocks.","엄마곰이 Goldilocks 옆에서 휴대폰을 발견했다.",0],["“This is terrible! Look at all these posts of our home,” shouted Mother Bear angrily.","“끔찍해! 우리 집에 관한 이 모든 게시물을 봐요.”라고 엄마곰이 화가 나서 외쳤다.",1],["Goldilocks jumped up in surprise.","Goldilocks는 놀라서 벌떡 일어났다.",1],["“You broke into our house and posted these pictures without our permission. Don’t you know these things are wrong?” said Father Bear.","“너는 우리 집에 침입해서 우리의 허락 없이 이 사진들을 올렸어. 너는 이런 것들이 잘못이라는 것을 모르니?”라고 아빠곰이 말했다.",1],["“Please forgive me. I’m so sorry, and I’ll clean your house every day until the end of the summer,” said Goldilocks.","“용서해 주세요. 정말 죄송해요, 여름이 끝날 때까지 매일 여러분 집을 청소할게요.” Goldilocks가 말했다.",1],["All summer long, Goldilocks worked hard.","여름 내내, Goldilocks는 열심히 일했다.",0],["On the last day, Goldilocks said to Father Bear, “I deleted all my posts of your cottage, so please don’t worry.”","마지막 날에 Goldilocks는 “오두막집에 관한 제 게시물을 모두 삭제했으니 걱정하지 마세요.”라고 아빠곰에게 말했다.",0],["“You still don’t understand. Other people already shared them on social media. Your posts will live on forever,” said Father Bear.","“너는 아직도 이해하지 못하는구나. 다른 사람들이 이미 소셜 미디어에 그것들을 공유했어. 너의 게시물은 영원히 남아 있을 거야.”라고 아빠곰이 말했다.",1],["“Oh, I didn’t think about that,” said Goldilocks.","“아, 그 생각은 하지 못했어요.”라고 Goldilocks가 말했다.",1],["“From now on, I’ll think twice before I press POST.”","“이제부터 ‘게시’를 누르기 전에 다시 생각할게요.”",0]];var RNUM=74;var TITLE_EN="Goldilocks Learns Her Lesson";var PASS_EN=["Goldilocks Learns Her Lesson","There was a little girl with golden hair in a small town. Her name was Goldilocks. She liked to share photos on social media. At first, she posted everyday things, but people didn’t give her many likes.","“What should I do to get more likes?” she thought. “I know! I should post funny pictures.”","Now, her posts were getting a lot of likes, and Goldilocks was happy. Her followers, however, soon got bored. So, she decided to post more shocking pictures.","One day, she was taking a walk in the forest and found a cottage. She knocked on the door, but there was no answer. It was getting dark, and it started to rain. She opened the door and walked inside.","There were three bowls of soup on a table. She ate the smallest one and took selfies with a smile. There were also three chairs. She jumped on the smallest one again and again. It broke, but she didn’t care.","“It’s so fun!” shouted Goldilocks.","She took selfies again and posted all the selfies on social media. Then, she went upstairs and found three beds. She felt tired and fell asleep in the smallest bed.","About an hour later, three bears came home.","“Someone ate my soup and broke my chair!” cried Baby Bear.","They went upstairs and saw Goldilocks. Mother Bear found a phone next to Goldilocks.","“This is terrible! Look at all these posts of our home,” shouted Mother Bear angrily.","Goldilocks jumped up in surprise.","“You broke into our house and posted these pictures without our permission. Don’t you know these things are wrong?” said Father Bear.","“Please forgive me. I’m so sorry, and I’ll clean your house every day until the end of the summer,” said Goldilocks.","“You still don’t understand. Other people already shared them on social media. Your posts will live on forever,” said Father Bear.","“Oh, I didn’t think about that,” said Goldilocks. “From now on, I’ll think twice before I press POST.”"];var PASS_KO=["Goldilocks가 교훈을 배우다","작은 마을에 금발의 어린 소녀가 있었다. 그녀의 이름은 Goldilocks였다. 그녀는 소셜 미디어에 사진을 공유하는 것을 좋아했다. 처음에, 그녀는 일상적인 것들을 올렸지만, 사람들은 그녀에게 ‘좋아요’를 많이 주지 않았다.","“어떻게 하면 더 많은 ‘좋아요’를 받을 수 있지?” 그녀는 생각했다. “알았다! 웃긴 사진들을 올려야겠어.”","이제, 그녀의 게시물은 많은 ‘좋아요’를 받고 있었고, Goldilocks는 행복했다. 하지만, 그녀의 팔로워들은 곧 지루해졌다. 그래서, 그녀는 더 충격적인 사진들을 올리기로 결심했다.","어느 날, 그녀는 숲에서 산책을 하다가 한 오두막집을 발견했다. 그녀는 문을 두드렸지만, 아무 대답이 없었다. 날이 어두워지고 있었고, 비가 내리기 시작했다. 그녀는 문을 열고 안으로 걸어 들어갔다.","식탁 위에는 수프 세 그릇이 있었다. 그녀는 가장 작은 그릇의 수프를 먹었고 미소를 지으며 셀피를 찍었다. 의자도 세 개 있었다. 그녀는 가장 작은 의자 위에서 몇 번이고 뛰었다. 의자가 부서졌지만, 그녀는 신경 쓰지 않았다.","“너무 재미있어!”라고 Goldilocks가 외쳤다.","그녀는 다시 셀피를 찍었고 모든 셀피를 소셜 미디어에 올렸다. 그런 다음, 그녀는 위층으로 올라가 침대 세 개를 발견했다. 그녀는 피곤해서 가장 작은 침대에서 잠들었다.","약 한 시간 후에, 곰 세 마리가 집으로 돌아왔다.","“누군가 내 수프를 먹고 내 의자를 부서뜨렸어요!”라고 아기곰이 외쳤다.","그들은 위층으로 가서 Goldilocks를 봤다. 엄마곰이 Goldilocks 옆에서 휴대폰을 발견했다.","“끔찍해! 우리 집에 관한 이 모든 게시물을 봐요.”라고 엄마곰이 화가 나서 외쳤다.","Goldilocks는 놀라서 벌떡 일어났다.","“너는 우리 집에 침입해서 우리의 허락 없이 이 사진들을 올렸어. 너는 이런 것들이 잘못이라는 것을 모르니?”라고 아빠곰이 말했다.","“용서해 주세요. 정말 죄송해요, 여름이 끝날 때까지 매일 여러분 집을 청소할게요.” Goldilocks가 말했다.","여름 내내, Goldilocks는 열심히 일했다. 마지막 날에 Goldilocks는 “오두막집에 관한 제 게시물을 모두 삭제했으니 걱정하지 마세요.”라고 아빠곰에게 말했다.","“너는 아직도 이해하지 못하는구나. 다른 사람들이 이미 소셜 미디어에 그것들을 공유했어. 너의 게시물은 영원히 남아 있을 거야.”라고 아빠곰이 말했다.","“아, 그 생각은 하지 못했어요.”라고 Goldilocks가 말했다. “이제부터 ‘게시’를 누르기 전에 다시 생각할게요.”"];var DG=[{"dlg":[["B function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});

function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){

var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}

 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
