"f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"pollution","a":"2","e":"② pollution: 오염, 공해","w":"① soil: 흙, 토양\n③ climate: 기후\n④ weather: 날씨","m":0,"s":"\"오염, 공해\"","c":["soil","pollution","climate","weather"],"mn":"오염, 공해","hk":"pollution(오염, 공해)은 pollute(오염시키다)의 명사형. soil(흙)·climate(기후)·weather(날씨)는 환경 단어지만 오염이 아닌 속임수.","ex":[["[[Air pollution]] is bad in big cities.","대도시에서는 [[대기 오염]]이 심하다."],["[[Water pollution]] harms fish.","[[수질 오염]]은 물고기에게 해롭다."],["We must reduce [[plastic pollution]].","우리는 [[플라스틱 오염]]을 줄여야 한다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"fuel","a":"fuel","e":"fuel 연료","k":"석탄은 화석 연료이다.","m":0,"s":"Coal is a fossil f______.","mn":"연료","hk":"fuel(연료)은 f-u-e-l, 모음 u와 e가 연달아 오는 철자. fossil fuel(화석 연료) 짝으로 기억.","ex":[["Cars [[need fuel]] to run.","차는 달리려면 [[연료가 필요하다]]."],["The price of [[fossil fuel]] went up.","[[화석 연료]] 가격이 올랐다."],["The plane [[ran out of fuel]].","그 비행기는 [[연료가 떨어졌다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"curious","a":"4","e":"curious (형) 호기심 많은 - curiously (부) 호기심 있게\n④ distinct (형) 뚜렷한, 구별되는 - distinctly (부) 뚜렷하게","w":"① cost (명) 비용, 값 - costly (형) 값비싼\n② friend (명) 친구 - friendly (형) 친절한, 다정한\n③ week (명) 주, 일주일 - weekly (형) 매주의","m":0,"s":"curious - curiously","c":["cost - costly","friend - friendly","week - weekly","distinct - distinctly"],"mn":"호기심 많은","hk":"형용사→부사 방향. curious(호기심 많은)-curiously(호기심 있게)와 distinct(뚜렷한)-distinctly(뚜렷하게)가 짝. 나머지는 명사에서 형용사로 가서 오답.","ex":[["The kids are [[curious about]] everything.","아이들은 모든 것에 [[호기심이 많다]].","curious (형) 호기심 많은"],["The cat looked at the box [[curiously]].","고양이는 상자를 [[호기심 있게]] 바라보았다.","curiously (부) 호기심 있게"],["There is [[a distinct difference]] between them.","둘 사이에는 [[뚜렷한 차이]]가 있다.","distinct (형) 뚜렷한, 구별되는"],["She spoke [[distinctly]] so everyone could hear.","그녀는 모두가 들을 수 있도록 [[또렷하게]] 말했다.","distinctly (부) 뚜렷하게"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"frequency","a":"3","e":"③ frequency: 빈도, 잦음","w":"① 밀도(density)\n② 지속 시간(duration)\n④ 정확성(accuracy)","m":0,"s":"frequency","c":["밀도","지속 시간","빈도, 잦음","정확성"],"mn":"빈도, 잦음","hk":"frequency(빈도)는 frequent(잦은)의 명사형으로 how often(얼마나 자주)을 나타냄. density(밀도)·duration(지속 시간)·accuracy(정확성)는 속임수.","ex":[["[[The frequency of earthquakes]] is rising.","[[지진의 빈도]]가 늘고 있다."],["Accidents happen [[with greater frequency]] at night.","사고는 밤에 [[더 높은 빈도로]] 일어난다."],["[[The frequency of trains]] has increased this year.","올해 [[기차의 운행 빈도]]가 늘었다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"accomplished","a":"1,4","e":"① achieved: 이루다, 성취하다 (achieve의 과거형)\n④ finished: 끝내다, 완료하다 (finish의 과거형) (몇 달간의 힘든 훈련 끝에, 그녀는 마침내 계획했던 것을 이루어 냈다.) / accomplish(완수하다, 해내다)의 유의어.","w":"② attempted: 시도하다 (attempt의 과거형)\n③ pursued: 추구하다 (pursue의 과거형)","k":"몇 달간의 힘든 훈련 끝에, 그녀는 마침내 계획했던 것을 이루어 냈다.","m":2,"s":"After months of hard training, she finally accomplished what she had planned.","h":"accomplished","c":["achieved","attempted","pursued","finished"],"mn":"완수하다, 해내다","wb":"accomplish","hk":"accomplish(완수하다)의 같은 편은 achieve(이루다)·finish(끝내다). attempt(시도하다)·pursue(추구하다)는 해내기 전 단계라 속임수.","ex":[["She worked hard to [[accomplish her goal]].","그녀는 [[목표를 이루려고]] 열심히 노력했다."],["We [[accomplished the task]] in two hours.","우리는 두 시간 만에 [[그 일을 해냈다]]."],["He [[accomplished many things]] before age thirty.","그는 서른 전에 [[많은 일을 이루었다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"explored","a":"4","e":"④ explored: 탐험하다, 둘러보다 (explore의 과거형) (그들은 모든 굴을 지도로 그리려고 손전등을 들고 어두운 동굴을 탐험했다.)","w":"① avoided: 피하다 (avoid의 과거형)\n② abandoned: 버리다, 포기하다 (abandon의 과거형)\n③ blocked: 막다, 차단하다 (block의 과거형)","k":"그들은 모든 굴을 지도로 그리려고 손전등을 들고 어두운 동굴을 탐험했다.","m":0,"s":"They ________ the dark cave with flashlights to map every tunnel.","c":["avoided","abandoned","blocked","explored"],"mn":"탐험하다, 둘러보다","hk":"explored(탐험했다)는 explore(탐험하다)의 과거형, explore a cave(동굴을 탐험하다) 짝. avoided(피했다)·blocked(막았다) 등은 흐름과 반대.","ex":[["They [[explored the island]] by boat.","그들은 배로 [[그 섬을 탐험했다]]."],["We [[explored the old town]] on foot.","우리는 걸어서 [[옛 도시를 둘러보았다]]."],["The kids [[explored the forest]] behind the house.","아이들은 집 뒤의 [[숲을 탐험했다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"perspective","a":"4","e":"④ viewpoint: 관점, 시각 (과학자의 관점에서, 그 실험은 완전한 성공이었다.) / perspective(관점, 시각)의 유의어.","w":"① purpose: 목적\n② impression: 인상\n③ belief: 믿음, 신념","k":"과학자의 관점에서, 그 실험은 완전한 성공이었다.","m":0,"s":"From a scientist's perspective, the experiment was a complete success.","h":"perspective","c":["purpose","impression","belief","viewpoint"],"mn":"관점, 시각","hk":"perspective(관점)와 같은 편은 viewpoint(관점, 시각). purpose(목적)·impression(인상)·belief(믿음)는 관점이 아닌 속임수.","ex":[["Try to see it [[from my perspective]].","그것을 [[내 관점에서]] 보도록 해 봐."],["A trip abroad gives you [[a new perspective]].","해외여행은 [[새로운 관점]]을 준다."],["[[From a child's perspective]], the world looks huge.","[[아이의 관점에서는]] 세상이 아주 커 보인다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"mammal","a":"4","e":"④ mammal: (동물 / 어미의 몸에서 나오는 젖을 먹는 / 어릴 때) 포유동물","w":"① insect: 곤충\n② reptile: 파충류\n③ bird: 새","k":"동물 / 어미의 몸에서 나오는 젖을 먹는 / 어릴 때","m":0,"s":"\"an animal that is fed milk from its mother's body when it is young\"","c":["insect","reptile","bird","mammal"],"mn":"포유동물","hk":"mammal(포유동물)은 젖을 먹여 키우는 동물. insect(곤충)·reptile(파충류)·bird(새)는 젖을 먹이지 않는 무리라 오답.","ex":[["A whale is a [[mammal]], not a fish.","고래는 물고기가 아니라 [[포유동물]]이다."],["[[Mammals]] feed their babies milk.","[[포유동물]]은 새끼에게 젖을 먹인다."],["The bat is [[the only flying mammal]].","박쥐는 [[날 수 있는 유일한 포유동물]]이다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"uniform","a":"uniform","e":"uniform 제복, 교복","k":"학생들은 교복을 입어야 한다.","m":0,"s":"Students must wear a u______.","mn":"제복, 교복","hk":"uniform(교복)은 uni(하나)로 시작, 같은 모양의 옷이라는 느낌. u-n-i-f-o-r-m 철자와 school uniform(교복) 짝.","ex":[["Students wear [[a school uniform]].","학생들은 [[교복]]을 입는다."],["The police officer wore [[a blue uniform]].","그 경찰관은 [[파란 제복]]을 입고 있었다."],["She [[put on her uniform]] and left.","그녀는 [[제복을 입고]] 떠났다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"penalizes","a":"1","e":"① penalizes: 처벌하다, 불리하게 하다 (penalize의 3인칭 단수형) (법은 위험한 운전을 무거운 벌금과 면허 정지로 처벌한다.)","w":"② permits: 허용하다 (permit의 3인칭 단수형)\n③ requires: 요구하다 (require의 3인칭 단수형)\n④ reports: 보고하다, 신고하다 (report의 3인칭 단수형)","k":"법은 위험한 운전을 무거운 벌금과 면허 정지로 처벌한다.","m":0,"s":"The law ________ dangerous driving with a heavy fine and a license suspension.","c":["penalizes","permits","requires","reports"],"mn":"처벌하다, 불리하게 하다","hk":"penalizes(처벌한다)는 penalize(처벌하다)의 3인칭 단수형, penalty(벌칙)와 한 가족. permits(허용한다)·requires(요구한다)·reports(보고한다)는 벌 아님.","ex":[["The referee [[penalizes rough play]].","심판은 [[거친 플레이를 처벌한다]]."],["Our school [[penalizes cheating]] strictly.","우리 학교는 [[부정행위를 엄격하게 처벌한다]]."],["The rule [[penalizes late students]] with extra work.","그 규칙은 추가 과제로 [[지각생을 처벌한다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"expression","a":"4","e":"④ expression: (사람의 얼굴에 나타나는 표정 / 보여주는 / 그들이 무엇을 느끼거나 생각하고 있는지를) 표현, 표정","w":"① mood: 기분, 분위기\n② appearance: 외모, 겉모습\n③ manner: 태도, 방식","k":"사람의 얼굴에 나타나는 표정 / 보여주는 / 그들이 무엇을 느끼거나 생각하고 있는지를","m":0,"s":"\"a look on a person's face that shows what they are feeling or thinking\"","c":["mood","appearance","manner","expression"],"mn":"표현, 표정","hk":"expression(표정, 표현)은 express(표현하다)의 명사형, face(얼굴)에 드러난 감정. mood(기분)·appearance(외모)·manner(태도)는 속임수 보기.","ex":[["He had [[a worried expression]] on his face.","그는 얼굴에 [[걱정스러운 표정]]을 띠고 있었다."],["Her face showed [[an expression of joy]].","그녀의 얼굴에는 [[기쁨의 표정]]이 드러났다."],["His [[facial expression]] changed quickly.","그의 [[얼굴 표정]]이 빠르게 바뀌었다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"term","a":"2","e":"①용어, 말 / ②학기 / ③용어, 말 / ④용어, 말 [②번만 의미가 다름]","k":"①과학자들은 지구 온난화를 설명하기 위해 '온실 효과'라는 용어를 사용한다.\n②우리 학교의 봄 학기는 7월 초에 끝난다.\n③'빅 데이터'라는 용어는 뉴스에서 흔한 말이 되었다.\n④법률 문서에서는 모든 용어가 명확하게 정의되어야 한다.","m":0,"c":["Scientists use the term \"greenhouse effect\" to explain global warming.","The spring term ends in early July at our school.","The term \"big data\" has become common in the news.","In legal writing, every term must be defined clearly."],"hc":"term|term|term|term","mn":"용어, 말 / 학기","hk":"term(용어, 학기)은 ②만 학기, 나머지는 용어. technical term(전문 용어)과 spring term(봄 학기)을 짝으로 구분.","ex":[["Scientists use the [[term]] 'climate change'.","과학자들은 '기후 변화'라는 [[용어]]를 사용한다.","term (명) 용어, 말"],["Every [[legal term]] must be defined clearly.","모든 [[법률 용어]]는 명확하게 정의되어야 한다.","term (명) 용어, 말"],["The [[spring term]] ends in July.","[[봄 학기]]는 7월에 끝난다.","term (명) 학기"]]}]},{"day":8,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"sketch","a":"1","e":"① sketch: (대충 그린 그림 / 빠르게 그리는 / 세부 묘사 없이 / 흔히 완성된 그림을 그리기 전에) 스케치, 초안","w":"② diagram: 도표, 도해\n③ outline: 개요, 윤곽\n④ portrait: 초상화","k":"대충 그린 그림 / 빠르게 그리는 / 세부 묘사 없이 / 흔히 완성된 그림을 그리기 전에","m":0,"s":"\"a rough drawing that someone makes quickly, without many details, often before making a finished picture\"","c":["sketch","diagram","outline","portrait"],"mn":"스케치, 초안","hk":"sketch(스케치)는 세부 없이 빠르게 그린 초안. diagram(도표)·outline(개요)·portrait(초상화)는 뜻이 달라 오답.","ex":[["He drew [[a quick sketch]] of the tree.","그는 나무의 [[빠른 스케치]]를 그렸다."],["[[Make a sketch]] before you paint.","그림을 그리기 전에 [[스케치를 하라]]."],["The artist drew [[a rough sketch]] first.","화가는 먼저 [[대충 그린 스케치]]를 그렸다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"reproduce","a":"3","e":"③ reproduce: 번식하다, 복제하다 (일부 식물들은 뿌리에서 새 식물을 키워 내며 씨앗 없이 번식한다.)","w":"① wither: 시들다\n② bloom: 꽃이 피다\n④ decay: 썩다, 부패하다","k":"일부 식물들은 뿌리에서 새 식물을 키워 내며 씨앗 없이 번식한다.","m":0,"s":"Some plants ________ without seeds by growing new plants from their roots.","c":["wither","bloom","reproduce","decay"],"mn":"번식하다, 복제하다","hk":"reproduce(번식하다)는 re(다시)+produce(만들어 내다)로 새 개체를 다시 만듦. wither(시들다)·bloom(꽃이 피다)·decay(썩다)는 번식이 아님.","ex":[["Rabbits [[reproduce quickly]].","토끼는 [[빠르게 번식한다]]."],["Fish [[reproduce by laying eggs]].","물고기는 [[알을 낳아 번식한다]]."],["Some plants [[reproduce without seeds]].","어떤 식물은 [[씨앗 없이 번식한다]]."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"complement","a":"1","e":"① complement: 보완물","w":"② 대체물(substitute)\n③ 필수품(necessity)\n④ 부속품(accessory)","m":0,"s":"complement","c":["보완물","대체물","필수품","부속품"],"mn":"보완물","hk":"complement(보완물)는 complete(완전하게 하다)와 한 가족, 부족한 곳을 채움. compliment(칭찬)와 철자 혼동 주의. substitute(대체물)는 갈아 끼움.","ex":[["The sauce is [[a perfect complement]] to the meal.","그 소스는 식사의 [[완벽한 보완물]]이다."],["A scarf is [[a nice complement]] to a coat.","스카프는 코트의 [[멋진 보완물]]이다."],["This app is [[a useful complement]] to the textbook.","이 앱은 교과서의 [[유용한 보완물]]이다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"tongue","a":"tongue","e":"tongue (명) 혀 / (명) 언어, 말","k":"그 요리사는 끓는 수프에 혀를 데어서 며칠 동안 아무 맛도 느낄 수 없었다.\n그녀는 해외에서 태어났지만, 한국어는 여전히 그녀의 모국어이다.","m":0,"s":"The chef burned his t______ on the boiling soup and could not taste anything for days.\nAlthough she was born abroad, Korean is still her mother t______.","mn":"혀 / 언어, 말","hk":"tongue(혀, 언어)은 한 단어로 두 뜻. 입 안의 tongue(혀)와 mother tongue(모국어) 짝으로 기억.","ex":[["Be careful not to burn [[your tongue]].","[[혀]]를 데지 않게 조심해라.","tongue (명) 혀"],["He bit [[his tongue]] by accident.","그는 실수로 [[혀]]를 깨물었다.","tongue (명) 혀"],["English is not her [[mother tongue]].","영어는 그녀의 [[모국어]]가 아니다.","tongue (명) 언어, 말"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"ban","a":"2,3","e":"② allow: 허락하다 (그 도시는 옛 시가지의 좁은 길에서 자동차를 금지하기로 결정했다.) / ban(금지하다)의 반의어.\n③ let: 허락하다, 하게 하다","w":"① forbid: 금지하다\n④ warn: 경고하다","k":"그 도시는 옛 시가지의 좁은 길에서 자동차를 금지하기로 결정했다.","m":2,"s":"The city decided to ban cars from the narrow streets of the old town.","h":"ban","c":["forbid","allow","let","warn"],"mn":"금지하다","hk":"ban(금지하다)의 반대편은 allow(허락하다)·let(허락하다). forbid(금지하다)는 같은 편이라 속임수, warn(경고하다)은 금지 전 단계.","ex":[["Many schools [[ban phones]] in class.","많은 학교가 수업 중 [[휴대폰을 금지한다]].","ban (동) 금지하다"],["Please [[allow me to]] help you.","제가 도와드리는 것을 [[허락해 주세요]].","allow (동) 허락하다"],["My mom [[lets me]] watch TV on weekends.","엄마는 주말에 내가 TV를 보도록 [[허락해 주신다]].","let (동) 허락하다, 하게 하다"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"profit","a":"1","e":"① loss: 손실, 적자 (그 작은 빵집은 작년에 큰 이익을 냈다.) / profit(이익, 흑자)의 반의어.","w":"② expense: 지출, 비용\n③ budget: 예산\n④ wage: 임금","k":"그 작은 빵집은 작년에 큰 이익을 냈다.","m":0,"s":"The small bakery made a large profit last year.","h":"profit","c":["loss","expense","budget","wage"],"mn":"이익, 흑자","hk":"profit(이익)의 반대편은 loss(손실). expense(지출)는 돈이 나가는 쪽의 속임수, budget(예산)·wage(임금)는 이익과 손실의 짝이 아님.","ex":[["The shop made [[a big profit]] this year.","그 가게는 올해 [[큰 이익]]을 냈다.","profit (명) 이익, 흑자"],["The farmer faced [[a big loss]] after the storm.","그 농부는 폭풍 뒤 [[큰 손실]]을 입었다.","loss (명) 손실, 적자"],["The shop sold the goods [[at a loss]].","그 가게는 물건을 [[손해를 보고]] 팔았다.","loss (명) 손실, 적자"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"screen","a":"screen","e":"screen 화면, 스크린","k":"컴퓨터 화면을 만지지 마라.","m":0,"s":"Don't touch the computer s______.","mn":"화면, 스크린","hk":"screen(화면)은 s-c-r-e-e-n, e가 두 개 연달아 오는 철자. computer screen(컴퓨터 화면) 짝으로 기억.","ex":[["Don't stare at [[the computer screen]] too long.","[[컴퓨터 화면]]을 너무 오래 쳐다보지 마라."],["My phone has [[a big screen]].","내 휴대폰은 [[큰 화면]]을 가지고 있다."],["The movie is on [[the big screen]] now.","그 영화는 지금 [[대형 스크린]]에서 상영 중이다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"decide","a":"4","e":"decide (동) 결정하다 - decisive (형) 결정적인\n④ compete (동) 경쟁하다 - competitive (형) 경쟁의, 경쟁력 있는","w":"① danger (명) 위험 - dangerous (형) 위험한\n② courage (명) 용기 - courageous (형) 용감한\n③ mystery (명) 신비, 수수께끼 - mysterious (형) 신비로운","m":0,"s":"decide - decisive","c":["danger - dangerous","courage - courageous","mystery - mysterious","compete - competitive"],"mn":"결정하다","hk":"동사→형용사 방향. decide(결정하다)-decisive(결정적인)와 compete(경쟁하다)-competitive(경쟁의)가 짝. danger(위험) 등 명사 출발은 오답.","ex":[["We need to [[decide quickly]].","우리는 [[빨리 결정해야]] 한다.","decide (동) 결정하다"],["It was [[a decisive victory]].","그것은 [[결정적인 승리]]였다.","decisive (형) 결정적인"],["Teams [[compete for]] the trophy.","팀들이 트로피를 두고 [[경쟁한다]].","compete (동) 경쟁하다"],["Soccer is [[a competitive sport]].","축구는 [[경쟁이 치열한 스포츠]]이다.","competitive (형) 경쟁의, 경쟁력 있는"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"anxiety","a":"4","e":"④ worry: 걱정, 근심 (다가오는 시험에 대한 그녀의 불안이 그녀를 밤새 잠 못 들게 했다.) / anxiety(불안, 걱정)의 유의어.","w":"① shame: 수치심\n② anger: 분노\n③ sorrow: 슬픔","k":"다가오는 시험에 대한 그녀의 불안이 그녀를 밤새 잠 못 들게 했다.","m":0,"s":"Her anxiety about the coming exam kept her awake all night.","h":"anxiety","c":["shame","anger","sorrow","worry"],"mn":"불안, 걱정","hk":"anxiety(불안)와 같은 편은 worry(걱정). shame(수치심)·anger(분노)·sorrow(슬픔)는 다른 감정이라 속임수. anxiety about(~에 대한 불안) 짝.","ex":[["She felt [[anxiety about the test]].","그녀는 [[시험에 대한 불안]]을 느꼈다."],["He tried to [[reduce his anxiety]].","그는 [[불안을 줄이려고]] 애썼다."],["Deep breaths can [[ease anxiety]].","심호흡은 [[불안을 덜어]] 줄 수 있다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"root","a":"root","e":"root 뿌리","k":"이 나무는 땅속 깊이 뻗어 있는 긴 뿌리 하나를 가지고 있다.","m":0,"s":"This tree has one long r______ that goes very deep into the ground.","mn":"뿌리","hk":"root(뿌리)는 r-o-o-t, o가 두 번 연달아 오는 철자. route(길, 경로)와 구분. tree root(나무 뿌리) 짝.","ex":[["[[The roots]] of the tree go deep.","나무의 [[뿌리]]는 깊이 뻗는다."],["Plants take water through [[their roots]].","식물은 [[뿌리]]를 통해 물을 흡수한다."],["Carrots are [[a root vegetable]].","당근은 [[뿌리채소]]이다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"dialogue","a":"2","e":"② dialogue: (두 명 이상의 사람들 사이의 대화 / 특히 책, 연극, 또는 영화 속의) 대화","w":"① narration: 서술, 내레이션\n③ speech: 연설\n④ comment: 논평, 언급","k":"두 명 이상의 사람들 사이의 대화 / 특히 책, 연극, 또는 영화 속의","m":0,"s":"\"a conversation between two or more people, especially in a book, play, or film\"","c":["narration","dialogue","speech","comment"],"mn":"대화","hk":"dialogue(대화)는 둘 이상이 주고받는 말, 끝 철자는 -ogue. narration(서술)은 한 사람이 들려주는 쪽, speech(연설)·comment(논평)도 주고받기가 아님.","ex":[["[[A short dialogue]] between two friends opens the book.","두 친구 사이의 [[짧은 대화]]로 책이 시작된다."],["They had [[an open dialogue]] about the problem.","그들은 그 문제에 대해 [[열린 대화]]를 나눴다."],["Read [[the dialogue]] with your partner.","짝과 함께 [[대화문]]을 읽어라."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"satisfy","a":"2","e":"② satisfy: 만족시키다 (그 신제품은 고객들을 만족시키지 못해서, 많은 고객이 환불을 요구했다.)\n※ concern(걱정시키다)·amuse(즐겁게 하다)·convince(설득하다)는 ‘환불을 요구했다’는 결과와 이어지지 않는다.","w":"① concern: 걱정시키다\n③ employ: 고용하다, 사용하다\n④ injure: 부상을 입히다, 해치다","k":"그 신제품은 고객들을 만족시키지 못해서, 많은 고객이 환불을 요구했다.","m":0,"s":"The new product did not ________ our customers, so many of them asked for a refund.","c":["concern","satisfy","employ","injure"],"mn":"만족시키다","hk":"satisfy(만족시키다)는 satisfy customers(고객을 만족시키다) 짝. concern(걱정시키다)·employ(고용하다)·injure(해치다)는 환불 요구로 이어지지 않음.","ex":[["The shop wants to [[satisfy its customers]].","그 가게는 [[고객을 만족시키고]] 싶어 한다."],["The result did not [[satisfy him]].","그 결과는 그를 [[만족시키지]] 못했다."],["This answer does not [[satisfy the teacher]].","이 답은 [[선생님을 만족시키지]] 못한다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"clinic","a":"2","e":"② clinic: 진료소, 개인 병원","w":"① agency: 대행사, 기관\n③ pharmacy: 약국\n④ laboratory: 실험실","m":0,"s":"\"진료소, 개인 병원\"","c":["agency","clinic","pharmacy","laboratory"],"mn":"진료소, 개인 병원","hk":"clinic(진료소)은 작은 병원으로 dental clinic(치과 진료소)처럼 씀. agency(대행사)·pharmacy(약국)·laboratory(실험실)는 진료하는 곳이 아닌 속임수.","ex":[["I went to [[a dental clinic]] today.","나는 오늘 [[치과]]에 갔다."],["The doctor works at [[a small clinic]].","그 의사는 [[작은 진료소]]에서 일한다."],["[[The clinic]] opens at nine.","[[그 진료소]]는 9시에 문을 연다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"alter","a":"2","e":"② change: 바꾸다, 변경하다 (그 디자이너는 쇼 전에 그 드레스를 수선해야 했다.) / alter(바꾸다, 변경하다)의 유의어.","w":"① divide: 나누다\n③ clean: 세탁하다, 깨끗이 하다\n④ delay: 미루다, 지연시키다","k":"그 디자이너는 쇼 전에 그 드레스를 수선해야 했다.","m":0,"s":"The designer had to alter the dress before the show.","h":"alter","c":["divide","change","clean","delay"],"mn":"바꾸다, 변경하다","hk":"alter(바꾸다)와 같은 편은 change(바꾸다). alter a dress(드레스를 수선하다)처럼 옷도 고침. divide(나누다)·clean(세탁하다)·delay(미루다)는 속임수.","ex":[["She had to [[alter the plan]].","그녀는 [[계획을 바꿔야]] 했다."],["The tailor will [[alter this jacket]].","재단사가 [[이 재킷을 수선해]] 줄 것이다."],["A small change can [[alter the result]].","작은 변화가 [[결과를 바꿀]] 수 있다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"turned","a":"4","e":"①돌리다 / ②돌리다 / ③돌다 / ④(어떤 상태가) 되다 [④번만 의미가 다름]","k":"①그녀는 자신의 의자를 창문 쪽으로 돌렸다.\n②오래된 자물쇠를 열려면 열쇠를 천천히 돌려라.\n③네가 페달을 더 세게 밟으면 바퀴가 더 빠르게 돈다.\n④따뜻한 주방에서 사흘이 지나자 그 우유는 시큼해졌다.","m":0,"c":["She turned her chair toward the window.","Turn the key slowly to open the old lock.","The wheels turn faster when you pedal harder.","The milk turned sour after three days in the warm kitchen."],"hc":"turned|Turn|turn|turned","mn":"돌리다 / (어떤 상태가) 되다","hk":"turned(돌렸다)는 turn(돌리다)의 과거형. ①②③은 돌리다·돌다인데 ④만 turn sour(시큼해지다)처럼 어떤 상태가 됨. 뒤에 형용사가 오면 되다.","ex":[["[[Turn your head]] to the left.","왼쪽으로 [[고개를 돌려라]].","turn (동) 돌리다"],["He [[turned the page]] and kept reading.","그는 [[페이지를 넘기고]] 계속 읽었다.","turn (동) 돌리다"],["The leaves [[turn red]] in autumn.","가을에 나뭇잎이 [[붉게 변한다]].","turn (동) (어떤 상태가) 되다"]]}]},{"day":9,"q":[{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"apology","a":"1","e":"apology (명) 사과 - apologize (동) 사과하다\n① critic (명) 비평가 - criticize (동) 비판하다","w":"② modern (형) 현대의 - modernize (동) 현대화하다\n③ special (형) 특별한 - specialize (동) 전문으로 하다\n④ civil (형) 시민의 - civilize (동) 문명화하다","m":0,"s":"apology - apologize","c":["critic - criticize","modern - modernize","special - specialize","civil - civilize"],"mn":"사과","hk":"명사→동사 방향. apology(사과)-apologize(사과하다)와 critic(비평가)-criticize(비판하다)가 짝. modern(현대의) 등 형용사 출발은 오답.","ex":[["He made [[an apology]] to his friend.","그는 친구에게 [[사과]]를 했다.","apology (명) 사과"],["I [[apologize for]] being late.","늦어서 [[사과드립니다]].","apologize (동) 사과하다"],["[[A film critic]] praised the movie.","[[영화 비평가]]가 그 영화를 칭찬했다.","critic (명) 비평가"],["Don't [[criticize]] others too quickly.","남을 너무 빨리 [[비판하지]] 마라.","criticize (동) 비판하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"ambitious","a":"1","e":"① ambitious: (강한 바람을 가지고 있는 / 성공하거나 권력을 갖거나 유명해지고 싶다는) 야심 있는","w":"② diligent: 부지런한\n③ loyal: 충성스러운\n④ humble: 겸손한","k":"강한 바람을 가지고 있는 / 성공하거나 권력을 갖거나 유명해지고 싶다는","m":0,"s":"\"having a strong wish to be successful, powerful, or famous\"","c":["ambitious","diligent","loyal","humble"],"mn":"야심 있는","hk":"ambitious(야심 있는)는 ambition(야망)의 형용사형. 성공·권력·명성을 강하게 바람. diligent(부지런한)·loyal(충성스러운)·humble(겸손한)은 정의와 어긋남.","ex":[["She is [[an ambitious student]].","그녀는 [[야심 있는 학생]]이다."],["He has [[ambitious goals]] for his team.","그는 팀을 위한 [[야심 찬 목표]]가 있다."],["They made [[an ambitious plan]].","그들은 [[야심 찬 계획]]을 세웠다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"market","a":"market","e":"market 시장\n※ marketplace도 ‘시장’이지만 stock marketplace라고는 쓰지 않는다. 주식 시장은 stock market.","k":"그 전쟁 소식이 전해진 후 주식 시장이 급락했다.","m":0,"s":"The stock m______ dropped sharply after the news about the war.","hk":"market(시장)은 m-a-r-k-e-t. 주식 시장은 stock market(주식 시장)이라 하고 stock marketplace(장터)라고는 안 씀.","ex":[["[[The stock market]] rose today.","오늘 [[주식 시장]]이 올랐다."],["We bought fruit at [[the market]].","우리는 [[시장]]에서 과일을 샀다."],["[[The job market]] is hard for young people.","청년들에게 [[취업 시장]]은 어렵다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"valueless","a":"2","e":"② valueless: 가치 없는, 하찮은","w":"① 대체할 수 없는(irreplaceable)\n③ 값비싼(expensive)\n④ (귀해서) 값을 매길 수 없는(priceless)","m":0,"s":"valueless","c":["대체할 수 없는","가치 없는, 하찮은","값비싼","(귀해서) 값을 매길 수 없는"],"mn":"가치 없는, 하찮은","hk":"valueless(가치 없는)는 value(가치)+less(~없는). priceless(값을 매길 수 없는)는 같은 less(~없는)인데 귀하다는 뜻이라 속임수.","ex":[["The torn ticket is [[valueless]] now.","그 찢어진 표는 이제 [[가치가 없다]]."],["The old coins were [[almost valueless]].","그 옛 동전들은 [[거의 가치가 없었다]]."],["His advice was [[valueless to]] me.","그의 조언은 내게 [[가치가 없었다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"truth","a":"truth","e":"truth 진실, 사실","k":"실수에 대한 진실을 나에게 말해라.","m":0,"s":"Tell me the t______ about the mistake.","mn":"진실, 사실","hk":"truth(진실)는 true(진실의)와 한 가족이지만 e가 빠지고 th가 붙음. t-r-u-t-h 철자와 tell the truth(진실을 말하다) 짝.","ex":[["Please [[tell the truth]].","제발 [[진실을 말해라]]."],["[[The truth]] about the accident came out.","사고에 대한 [[진실]]이 드러났다."],["There is some [[truth in]] his words.","그의 말에는 어느 정도 [[진실이 있다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"passage","a":"2","e":"② passage: (양쪽에 벽이 있는 길고 좁은 공간 / 한 장소를 다른 장소로 이어 주는 / 건물 안에서) 통로","w":"① staircase: 계단\n③ entrance: 입구\n④ basement: 지하실","k":"양쪽에 벽이 있는 길고 좁은 공간 / 한 장소를 다른 장소로 이어 주는 / 건물 안에서","m":0,"s":"\"a long narrow area with walls on both sides that connects one place to another inside a building\"","c":["staircase","passage","entrance","basement"],"mn":"통로","hk":"passage(통로)는 pass(지나가다)에서 나온 지나다니는 길. 건물 안 양쪽에 벽이 있는 길이 포인트. staircase(계단)·entrance(입구)·basement(지하실)는 속임수.","ex":[["[[A narrow passage]] led to the hall.","[[좁은 통로]]가 홀로 이어졌다."],["We walked down [[a dark passage]].","우리는 [[어두운 통로]]를 걸어 내려갔다."],["[[A secret passage]] connects the two rooms.","[[비밀 통로]]가 두 방을 연결한다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"performance","a":"4","e":"④ performance: 공연, 성과 (그 가수의 공연이 너무 감동적이어서 관객들이 울고 환호했다.)\n※ audience는 문장에 이미 나와 있어 정답이 될 수 없고, rehearsal(리허설)·costume(의상)은 관객을 울릴 수 없다.","w":"① audience: 관객, 청중\n② rehearsal: 리허설, 예행연습\n③ costume: 의상, 분장","k":"그 가수의 공연이 너무 감동적이어서 관객들이 울고 환호했다.","m":0,"s":"The singer's ________ was so moving that the audience cried and cheered.","c":["audience","rehearsal","costume","performance"],"mn":"공연, 성과","hk":"performance(공연)는 perform(공연하다)의 명사형. 관객이 우는 감동은 공연의 몫. rehearsal(리허설)·costume(의상)은 오답, audience(관객)는 이미 나옴.","ex":[["The band gave [[a great performance]].","그 밴드는 [[멋진 공연]]을 보여 주었다."],["We watched [[a live performance]] of the play.","우리는 그 연극의 [[실황 공연]]을 보았다."],["[[The team's performance]] improved this season.","이번 시즌 [[팀의 성과]]가 좋아졌다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"strike","a":"strike","e":"strike (동) 치다, 때리다 / (명) 파업","k":"번개는 한 번의 폭풍이 치는 동안 같은 높은 건물을 한 번 이상 칠 수 있다.\n그 공장 노동자들은 더 짧은 근무 시간을 요구하며 파업에 들어갔다.","m":0,"s":"Lightning can s______ the same tall building more than once during a single storm.\nThe factory workers went on s______ to demand shorter working hours.","mn":"치다, 때리다 / 파업","hk":"strike(치다, 파업)는 한 철자로 두 뜻. lightning strike(번개가 치다)와 go on strike(파업에 들어가다) 짝으로 기억.","ex":[["Lightning can [[strike a tree]].","번개는 [[나무를 칠]] 수 있다.","strike (동) 치다, 때리다"],["The ball [[struck the post]].","공이 [[기둥을 때렸다]].","strike (동) 치다, 때리다"],["The workers [[went on strike]].","노동자들이 [[파업에 들어갔다]].","strike (명) 파업"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"vanish","a":"2","e":"② disappear: 사라지다 (해가 뜨자마자 별들은 하늘에서 사라진다.) / vanish(사라지다, 자취를 감추다)의 유의어.","w":"① escape: 달아나다, 탈출하다\n③ spread: 퍼지다\n④ melt: 녹다","k":"해가 뜨자마자 별들은 하늘에서 사라진다.","m":0,"s":"The stars vanish from the sky as soon as the sun comes up.","h":"vanish","c":["escape","disappear","spread","melt"],"mn":"사라지다, 자취를 감추다","hk":"vanish(사라지다)와 같은 편은 disappear(사라지다). escape(달아나다)·spread(퍼지다)·melt(녹다)는 모습이 없어지는 뜻과 달라 속임수.","ex":[["The magician made the coin [[vanish]].","마술사는 동전을 [[사라지게]] 만들었다."],["The fog will [[vanish by noon]].","안개는 [[정오까지 사라질]] 것이다."],["Her smile began to [[vanish]].","그녀의 미소가 [[사라지기]] 시작했다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"reacted","a":"2","e":"② reacted: 반응하다 (react의 과거형) (그녀는 두 손으로 귀를 막으며 갑작스러운 소음에 빠르게 반응했다.)","w":"① objected: 반대하다 (object의 과거형)\n③ referred: 언급하다, 참조하다 (refer의 과거형)\n④ belonged: 속하다 (belong의 과거형)","k":"그녀는 두 손으로 귀를 막으며 갑작스러운 소음에 빠르게 반응했다.","m":0,"s":"She quickly ________ to the sudden noise by covering her ears with both hands.","c":["objected","reacted","referred","belonged"],"mn":"반응하다","hk":"reacted(반응했다)는 react(반응하다)의 과거형, react to(~에 반응하다) 짝. objected(반대했다)·referred(언급했다)·belonged(속했다)는 행동과 안 맞음.","ex":[["She [[reacted quickly to]] the news.","그녀는 그 소식에 [[재빨리 반응했다]]."],["The dog [[reacted to]] the loud sound.","개는 큰 소리에 [[반응했다]]."],["He [[reacted with a smile]].","그는 [[미소로 반응했다]]."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"theme","a":"2","e":"② theme: 주제, 테마","w":"① title: 제목\n③ plot: 줄거리\n④ setting: 배경","m":0,"s":"\"주제, 테마\"","c":["title","theme","plot","setting"],"mn":"주제, 테마","hk":"theme(주제)는 글 전체를 관통하는 중심 생각. title(제목)·plot(줄거리)·setting(배경)은 글의 다른 요소라 속임수. theme park(테마파크)도 같은 단어.","ex":[["[[The main theme]] of the book is love.","그 책의 [[중심 주제]]는 사랑이다."],["Our party has [[a space theme]].","우리 파티는 [[우주 테마]]를 가지고 있다."],["We went to [[a theme park]] last Sunday.","우리는 지난 일요일에 [[테마파크]]에 갔다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"rapid","a":"1,3","e":"① quick: 빠른, 신속한 (그 도시의 급속한 성장은 모두를 놀라게 했다.) / rapid(빠른, 급속한)의 유의어.\n③ fast: 빠른","w":"② steady: 꾸준한, 한결같은\n④ gradual: 점진적인","k":"그 도시의 급속한 성장은 모두를 놀라게 했다.","m":2,"s":"The rapid growth of the city surprised everyone.","h":"rapid","c":["quick","steady","fast","gradual"],"mn":"빠른, 급속한","hk":"rapid(급속한)와 같은 편은 quick(빠른)·fast(빠른). steady(꾸준한)·gradual(점진적인)은 천천히 변하는 쪽이라 반대 느낌.","ex":[["There was [[rapid growth]] in sales.","매출에 [[급속한 성장]]이 있었다."],["We saw [[a rapid change]] in the weather.","우리는 날씨의 [[급격한 변화]]를 보았다."],["She made [[rapid progress]] in English.","그녀는 영어에서 [[빠른 진전]]을 이루었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"aggressive","a":"1","e":"① passive: 수동적인, 소극적인 (그의 공격적인 말투는 방 안의 모든 사람을 불편하게 만들었다.) / aggressive(공격적인, 적극적인)의 반의어.","w":"② cheerful: 쾌활한\n③ selfish: 이기적인\n④ strict: 엄격한","k":"그의 공격적인 말투는 방 안의 모든 사람을 불편하게 만들었다.","m":0,"s":"His aggressive way of speaking made everyone in the room uncomfortable.","h":"aggressive","c":["passive","cheerful","selfish","strict"],"mn":"공격적인, 적극적인","hk":"aggressive(공격적인)의 반대편은 passive(수동적인). cheerful(쾌활한)·selfish(이기적인)·strict(엄격한)는 적극 대 소극의 짝이 아님.","ex":[["He is [[an aggressive player]].","그는 [[공격적인 선수]]이다.","aggressive (형) 공격적인, 적극적인"],["She plays [[a passive role]] in the group.","그녀는 모둠에서 [[수동적인 역할]]을 한다.","passive (형) 수동적인, 소극적인"],["Don't be [[passive]] in class.","수업에서 [[소극적이지]] 마라.","passive (형) 수동적인, 소극적인"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"deny","a":"1","e":"① admit: 인정하다, 자백하다 (그는 자신이 창문을 깼다는 것을 계속 부인했다.) / deny(부인하다, 부정하다)의 반의어.","w":"② refuse: 거절하다\n③ insist: 주장하다\n④ promise: 약속하다","k":"그는 자신이 창문을 깼다는 것을 계속 부인했다.","m":0,"s":"He continued to deny that he had broken the window.","h":"deny","c":["admit","refuse","insist","promise"],"mn":"부인하다, 부정하다","hk":"deny(부인하다)의 반대편은 admit(인정하다). refuse(거절하다)는 비슷해 보이는 속임수, insist(주장하다)·promise(약속하다)는 부인과 인정의 짝이 아님.","ex":[["She [[denied the rumor]].","그녀는 [[그 소문을 부인했다]].","deny (동) 부인하다, 부정하다"],["He [[admitted his mistake]].","그는 [[자기 실수를 인정했다]].","admit (동) 인정하다, 자백하다"],["I must [[admit]] that I was wrong.","내가 틀렸다는 것을 [[인정해야]] 한다.","admit (동) 인정하다, 자백하다"]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"stand","a":"3","e":"①서다 / ②서 있다 / ③참다, 견디다 / ④서 있다 [③번만 의미가 다름]","k":"①기차가 완전히 멈출 때까지 노란 선 뒤에 서 주세요.\n②그 조각상은 백 년 넘게 광장에 서 있다.\n③나는 옆집 공사장에서 나는 소음을 참을 수 없다.\n④높은 탑 하나가 그 옛 도시의 중심에 서 있다.","m":0,"c":["Please stand behind the yellow line until the train stops completely.","The statue has stood in the square for over a hundred years.","I cannot stand the noise from the construction site next door.","A tall tower stands at the center of the old city."],"hc":"stand|stood|stand|stands","mn":"서 있다 / 참다, 견디다","hk":"stand(서다)는 ①②④가 서 있다는 뜻인데 ③ cannot stand(참을 수 없다)만 참다, 견디다. 부정문의 can't stand(참을 수 없다) 짝.","ex":[["Please [[stand in line]].","[[줄을 서]] 주세요.","stand (동) 서다, 서 있다"],["A big tree [[stands next to]] our house.","큰 나무 한 그루가 우리 집 옆에 [[서 있다]].","stand (동) 서다, 서 있다"],["I can't [[stand the smell]].","나는 [[그 냄새를 참을]] 수 없다.","stand (동) 참다, 견디다"]]}]},{"day":10,"q":[{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"universe","a":"universe","e":"universe 우주, 만물","k":"과학자들은 우주의 나이가 약 138억 년이라고 추정한다.","m":0,"s":"Scientists estimate that the u______ is about 13.8 billion years old.","mn":"우주, 만물","hk":"universe(우주)는 uni(하나)로 시작, 끝은 s와 e. 앞부분이 같은 uniform(교복)과 철자를 비교해 챙기기.","ex":[["Scientists study [[the origin of the universe]].","과학자들은 [[우주의 기원]]을 연구한다."],["Our galaxy is a tiny part of [[the universe]].","우리 은하는 [[우주]]의 아주 작은 일부이다."],["[[The whole universe]] seemed quiet that night.","그날 밤 [[온 우주]]가 조용해 보였다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"drought","a":"3","e":"③ drought: 가뭄","w":"① frost: 서리\n② breeze: 산들바람\n④ flood: 홍수","m":0,"s":"\"가뭄\"","c":["frost","breeze","drought","flood"],"mn":"가뭄","hk":"drought(가뭄)는 비가 오래 오지 않는 현상. frost(서리)·breeze(산들바람)·flood(홍수)는 날씨 단어지만 뜻이 다름. flood(홍수)와 정반대 느낌.","ex":[["The farm suffered [[a long drought]].","그 농장은 [[긴 가뭄]]을 겪었다."],["[[A severe drought]] hurt the crops.","[[심한 가뭄]]이 농작물에 피해를 주었다."],["Rivers dried up during [[the drought]].","[[가뭄]] 동안 강이 말랐다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"shortage","a":"1","e":"① shortage: 부족, 결핍 (그 도시는 두 달 동안 비가 오지 않은 뒤 심각한 물 부족에 직면했다.)","w":"② balance: 균형\n③ storage: 저장, 보관\n④ supply: 공급","k":"그 도시는 두 달 동안 비가 오지 않은 뒤 심각한 물 부족에 직면했다.","m":0,"s":"The city faced a serious water ________ after two months without rain.","c":["shortage","balance","storage","supply"],"mn":"부족, 결핍","hk":"shortage(부족)는 water shortage(물 부족)로 기억. 철자 비슷한 storage(저장)와 구분하고, supply(공급)는 오히려 반대 방향.","ex":[["There is [[a food shortage]] in the area.","그 지역에는 [[식량 부족]]이 있다."],["[[A shortage of workers]] slowed the project.","[[일손 부족]]이 프로젝트를 늦췄다."],["The school has [[a shortage of teachers]].","그 학교는 [[교사 부족]]을 겪고 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"sympathy","a":"1","e":"① compassion: 연민, 동정심 (그녀는 화재로 집을 잃은 가족들에게 깊은 연민을 느꼈다.) / sympathy(동정, 연민)의 유의어.","w":"② respect: 존경\n③ admiration: 감탄, 존경\n④ affection: 애정","k":"그녀는 화재로 집을 잃은 가족들에게 깊은 연민을 느꼈다.","m":0,"s":"She felt deep sympathy for the families who had lost their homes in the fire.","h":"sympathy","c":["compassion","respect","admiration","affection"],"mn":"동정, 연민","hk":"sympathy(동정)와 같은 편은 compassion(연민). respect(존경)·admiration(감탄)·affection(애정)은 속임수. sympathy for(~에 대한 동정) 짝.","ex":[["I feel [[sympathy for]] the injured player.","나는 다친 선수에게 [[동정을 느낀다]]."],["She showed [[deep sympathy]] to her friend.","그녀는 친구에게 [[깊은 연민]]을 보였다."],["People sent [[words of sympathy]].","사람들은 [[위로의 말]]을 보냈다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"vague","a":"1","e":"① vague: 모호한, 애매한","w":"② 간결한(concise)\n③ 정확한(precise)\n④ 복잡한(complicated)","m":0,"s":"vague","c":["모호한, 애매한","간결한","정확한","복잡한"],"mn":"모호한, 애매한","hk":"vague(모호한)의 반대편은 precise(정확한). concise(간결한)·complicated(복잡한)는 느낌만 비슷한 속임수. vague answer(모호한 대답) 짝.","ex":[["He gave [[a vague answer]].","그는 [[모호한 대답]]을 했다."],["I have only [[a vague memory]] of it.","나는 그것에 대한 [[어렴풋한 기억]]만 있다."],["The rules are [[too vague]].","규칙이 [[너무 모호하다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"assume","a":"1","e":"① assume: (사실이라고) 추정하다, 생각하다 (방 안의 모든 사람이 너에게 동의한다고 추정하지 마라.)","w":"② confirm: 확인해 주다\n③ predict: 예측하다\n④ hesitate: 망설이다","k":"방 안의 모든 사람이 너에게 동의한다고 추정하지 마라.","m":0,"s":"Don't ________ that everyone in the room agrees with you.","c":["assume","confirm","predict","hesitate"],"mn":"(사실이라고) 추정하다, 생각하다","hk":"assume(추정하다)은 assume that(~라고 생각하다) 짝, 확인 없이 사실로 여김. confirm(확인해 주다)은 반대 느낌, predict(예측하다)·hesitate(망설이다)는 오답.","ex":[["Don't [[assume that]] he knows.","그가 안다고 [[추정하지]] 마라."],["I [[assume]] you are hungry.","나는 네가 배고프다고 [[생각한다]]."],["People often [[assume the worst]].","사람들은 흔히 [[최악을 가정한다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"obstacle","a":"4","e":"④ barrier: 장벽, 장애물 (새로운 나라로 이주할 때 언어는 심각한 장애물이 될 수 있다.) / obstacle(장애물, 방해물)의 유의어.","w":"① gap: 틈, 격차\n② boundary: 경계(선)\n③ shortcut: 지름길","k":"새로운 나라로 이주할 때 언어는 심각한 장애물이 될 수 있다.","m":0,"s":"Language can be a serious obstacle when you move to a new country.","h":"obstacle","c":["gap","boundary","shortcut","barrier"],"mn":"장애물, 방해물","hk":"obstacle(장애물)과 같은 편은 barrier(장벽). language barrier(언어 장벽) 짝. gap(틈)·boundary(경계)·shortcut(지름길)은 막는 것이 아닌 속임수.","ex":[["Fear is [[a big obstacle]].","두려움은 [[큰 장애물]]이다."],["She overcame [[every obstacle]].","그녀는 [[모든 장애물]]을 극복했다."],["Rocks were [[an obstacle in the road]].","바위들이 [[길의 장애물]]이었다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"colleague","a":"1","e":"① colleague: (당신과 같은 사무실이나 회사에서 일하는 사람) 동료","w":"② customer: 손님, 고객\n③ partner: 동업자, 짝\n④ neighbor: 이웃","k":"당신과 같은 사무실이나 회사에서 일하는 사람","m":0,"s":"\"a person who works at the same office or company as you\"","c":["colleague","customer","partner","neighbor"],"mn":"동료","hk":"colleague(동료)는 같은 직장에서 일하는 사람. customer(손님)·partner(동업자)·neighbor(이웃)는 같은 사무실이나 회사 소속이 아님.","ex":[["She is [[my colleague]] at the bank.","그녀는 은행에서 일하는 [[내 동료]]이다."],["I had lunch with [[a colleague]] today.","나는 오늘 [[동료]]와 점심을 먹었다."],["[[Colleagues]] helped her finish the report.","[[동료들]]이 그녀가 보고서를 끝내도록 도왔다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"abundant","a":"1,4","e":"① scarce: 부족한, 드문\n④ insufficient: 불충분한 (이 지역은 강수량이 풍부해서 농부들이 자기 밭을 걱정하는 일이 드물다.) / abundant(풍부한, 넘칠 만큼 많은)의 반의어.","w":"② sufficient: 충분한\n③ plentiful: 풍부한","k":"이 지역은 강수량이 풍부해서 농부들이 자기 밭을 걱정하는 일이 드물다.","m":2,"s":"Rainfall is abundant in this region, so farmers rarely worry about their fields.","h":"abundant","c":["scarce","sufficient","plentiful","insufficient"],"mn":"풍부한, 넘칠 만큼 많은","hk":"abundant(풍부한)의 반대편은 scarce(부족한)·insufficient(불충분한). plentiful(풍부한)·sufficient(충분한)는 같은 쪽이라 속임수.","ex":[["Fish are [[abundant in]] this lake.","이 호수에는 물고기가 [[풍부하다]].","abundant (형) 풍부한, 넘칠 만큼 많은"],["Water is [[scarce in]] the desert.","사막에는 물이 [[부족하다]].","scarce (형) 부족한, 드문"],["The evidence was [[insufficient]] to prove it.","증거가 그것을 증명하기에 [[불충분했다]].","insufficient (형) 불충분한"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"temporary","a":"2","e":"② permanent: 영구적인, 정규직의 (그 회사는 그에게 세 달 뒤에 끝나는 임시직을 제안했다.) / temporary(일시적인, 임시의)의 반의어.","w":"① momentary: 순간적인\n③ brief: 짧은, 잠깐의\n④ seasonal: 계절에 따른","k":"그 회사는 그에게 세 달 뒤에 끝나는 임시직을 제안했다.","m":0,"s":"The company offered him a temporary job that would end in three months.","h":"temporary","c":["momentary","permanent","brief","seasonal"],"mn":"일시적인, 임시의","hk":"temporary(일시적인)의 반대편은 permanent(영구적인). momentary(순간적인)·brief(짧은)는 같은 편이고, seasonal(계절에 따른)은 기간이 아닌 계절 이야기.","ex":[["He found [[a temporary job]].","그는 [[임시직]]을 구했다.","temporary (형) 일시적인, 임시의"],["She wants [[a permanent job]].","그녀는 [[정규직]]을 원한다.","permanent (형) 영구적인, 정규직의"],["The scar will be [[permanent]].","그 흉터는 [[영구적일]] 것이다.","permanent (형) 영구적인, 정규직의"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"race","a":"race","e":"race (명) 경주, 시합 / (명) 인종","k":"그 시즌의 마지막 경주는 갑작스러운 우박 폭풍이 트랙을 휩쓸고 지나간 뒤 취소되었다.\n많은 나라에는 고용주가 지원자를 인종 때문에 다르게 대우하는 것을 막는 법이 있다.","m":0,"s":"The final r______ of the season was canceled after a sudden hailstorm swept across the track.\nMany countries have laws that prevent employers from treating applicants differently because of their r______.","mn":"경주, 시합 / 인종","hk":"race(경주, 인종)는 한 철자로 두 뜻. run a race(경주를 하다)와 people of every race(모든 인종의 사람들)로 구분.","ex":[["She won [[the race]] easily.","그녀는 [[경주]]에서 쉽게 이겼다.","race (명) 경주, 시합"],["We watched [[a horse race]].","우리는 [[경마]]를 보았다.","race (명) 경주, 시합"],["People of [[every race]] live here.","[[모든 인종]]의 사람들이 여기 산다.","race (명) 인종"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"vary","a":"1","e":"vary (동) 다르다, 달라지다 - various (형) 다양한\n① rely (동) 의지하다 - reliable (형) 믿을 수 있는","w":"② beauty (명) 아름다움 - beautiful (형) 아름다운\n③ create (동) 창조하다 - creation (명) 창조, 창작물\n④ quick (형) 빠른 - quickly (부) 빠르게","m":0,"s":"vary - various","c":["rely - reliable","beauty - beautiful","create - creation","quick - quickly"],"mn":"다르다, 달라지다","hk":"동사→형용사 방향. vary(다르다)-various(다양한)와 rely(의지하다)-reliable(믿을 수 있는)이 짝. create(창조하다)-creation(창조물)은 명사로 끝나 오답.","ex":[["Prices [[vary from]] shop to shop.","가격은 가게마다 [[다르다]].","vary (동) 다르다, 달라지다"],["The store sells [[various kinds]] of shoes.","그 가게는 [[여러 종류의]] 신발을 판다.","various (형) 다양한"],["You can [[rely on]] me.","너는 나를 [[믿어도]] 된다.","rely (동) 의지하다"],["He is [[a reliable friend]].","그는 [[믿을 수 있는 친구]]이다.","reliable (형) 믿을 수 있는"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"harvest","a":"harvest","e":"harvest 수확, 수확물","k":"농부들은 올가을 유난히 많은 밀 수확을 축하했다.","m":0,"s":"The farmers celebrated an unusually large h______ of wheat this autumn.","mn":"수확, 수확물","hk":"harvest(수확)는 h-a-r-v-e-s-t, 가운데 rv가 붙어 나오는 철자. rice harvest(쌀 수확) 짝으로 기억.","ex":[["The farmers had [[a good harvest]].","농부들은 [[좋은 수확]]을 거두었다."],["Rain can ruin [[the rice harvest]].","비는 [[쌀 수확]]을 망칠 수 있다."],["[[The harvest festival]] is in October.","[[수확 축제]]는 10월에 열린다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"fatigue","a":"3","e":"③ fatigue: (극도로 피곤한 느낌 / 보통 힘든 일이나 운동을 한 뒤에 오는) 피로, 피곤","w":"① boredom: 지루함\n② illness: 병, 질환\n④ hunger: 배고픔, 굶주림","k":"극도로 피곤한 느낌 / 보통 힘든 일이나 운동을 한 뒤에 오는","m":0,"s":"\"a feeling of being extremely tired, usually after hard work or exercise\"","c":["boredom","illness","fatigue","hunger"],"mn":"피로, 피곤","hk":"fatigue(피로)는 힘든 일이나 운동 뒤의 극도로 피곤한 느낌. boredom(지루함)·illness(병)·hunger(배고픔)는 피곤함이 아닌 상태. 끝 철자 g-u-e 주의.","ex":[["He felt [[extreme fatigue]] after the race.","그는 경주 뒤 [[극심한 피로]]를 느꼈다."],["[[Muscle fatigue]] makes it hard to run.","[[근육 피로]]는 달리기를 어렵게 한다."],["Long trips can [[cause fatigue]].","긴 여행은 [[피로를 일으킬]] 수 있다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"note","a":"3","e":"①메모, 쪽지 / ②메모, 쪽지 / ③지폐 / ④메모, 쪽지 [③번만 의미가 다름]","k":"①네가 도착했을 때 내가 집에 없으면 책상 위에 메모를 남겨 줘.\n②나는 사물함에서 수업 후에 만나자고 하는 쪽지를 발견했다.\n③그는 그 책값을 내려고 점원에게 50파운드짜리 지폐를 건넸다.\n④그녀는 조언에 감사하기 위해 선생님께 짧은 쪽지를 썼다.","m":0,"c":["Please leave a note on the desk if I am not home when you arrive.","I found a note in my locker asking me to meet after school.","He handed the clerk a fifty-pound note to pay for the book.","She wrote a short note to thank her teacher for the advice."],"hc":"note|note|note|note","mn":"메모, 쪽지 / 지폐","hk":"note(메모, 지폐)는 ③만 지폐, 나머지는 짧은 메모·쪽지. leave a note(메모를 남기다)와 five-pound note(5파운드 지폐)로 구분.","ex":[["Please [[leave a note]] for me.","나를 위해 [[메모를 남겨]] 줘.","note (명) 메모, 쪽지"],["She passed me [[a small note]] in class.","그녀는 수업 중 내게 [[작은 쪽지]]를 건넸다.","note (명) 메모, 쪽지"],["He paid with [[a five-pound note]].","그는 [[5파운드 지폐]]로 계산했다.","note (명) 지폐"]]}]},{"day":11,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"crucial","a":"3","e":"③ vital: 필수적인, 매우 중요한 (충분한 수면을 취하는 것은 시험 주간의 학생들에게 매우 중요하다.) / crucial(결정적인, 매우 중요한)의 유의어.","w":"① trivial: 사소한, 하찮은\n② optional: 선택적인\n④ useful: 유용한","k":"충분한 수면을 취하는 것은 시험 주간의 학생들에게 매우 중요하다.","m":0,"s":"Getting enough sleep is crucial for students during exam week.","h":"crucial","c":["trivial","optional","vital","useful"],"mn":"결정적인, 매우 중요한","hk":"crucial(결정적인)은 vital(필수적인)과 같은 편. ct","evaluate"],"mn":"평가하다, 가늠하다","hk":"assess(평가하다)는 evaluate(평가하다)와 같은 편. compare(비교하다)·approve(승인하다)·inspect(점검하다)는 평가와 다른 행동 함정.","ex":[["Engineers came to [[assess the damage]].","기술자들이 [[피해를 평가하러]] 왔다."],["It is hard to [[assess progress]] in one week.","일주일 만에 [[성과를 평가하기]]는 어렵다."],["The test will [[assess your reading skill]].","그 시험은 [[너의 읽기 실력을 평가할]] 것이다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"candidate","a":"3","e":"③ candidate: (애쓰고 있는 사람 / 일자리에 뽑히거나 어떤 자리에 선출되려고) 후보자, 지원자","w":"① representative: 대표자\n② employee: 직원, 종업원\n④ volunteer: 자원봉사자","k":"애쓰고 있는 사람 / 일자리에 뽑히거나 어떤 자리에 선출되려고","m":0,"s":"\"a person who is trying to be chosen for a job or elected to a position\"","c":["representative","employee","candidate","volunteer"],"mn":"후보자, 지원자","hk":"일자리나 선출직을 얻으려고 애쓰는 사람은 candidate(후보자). representative(대표자)·employee(직원)·volunteer(자원봉사자)는 이미 그 자리에 있거나 돕는 사람.","ex":[["[[A presidential candidate]] gave a speech.","[[대통령 후보]]가 연설을 했다."],["Each [[job candidate]] had an interview.","각 [[입사 지원자]]는 면접을 봤다."],["She is [[a strong candidate for]] the prize.","그녀는 그 상의 [[유력한 후보]]이다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"disaster","a":"2","e":"② disaster: (지진이나 화재 같은 갑작스러운 사건 / 많은 사람들에게 큰 피해를 입히는) 재난, 참사","w":"① emergency: 비상사태\n③ conflict: 갈등, 충돌\n④ ceremony: 의식, 식","k":"지진이나 화재 같은 갑작스러운 사건 / 많은 사람들에게 큰 피해를 입히는","m":0,"s":"\"a sudden event such as an earthquake or a fire that causes great harm to many people\"","c":["emergency","disaster","conflict","ceremony"],"mn":"재난, 참사","hk":"지진이나 화재처럼 갑자기 큰 피해를 주는 일은 disaster(재난). emergency(비상사태)는 급한 상황일 뿐이고 conflict(갈등)·ceremony(의식)는 피해 사건이 아닌 함정.","ex":[["A flood is [[a natural disaster]].","홍수는 [[자연재해]]이다."],["The town recovered from [[the disaster]].","그 마을은 [[그 재난]]에서 회복했다."],["The fire turned into [[a major disaster]].","그 불은 [[큰 재난]]으로 번졌다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"procedure","a":"4","e":"④ procedure: 절차, 과정","w":"① preparation: 준비\n② permission: 허가\n③ proposal: 제안","m":0,"s":"\"절차, 과정\"","c":["preparation","permission","proposal","procedure"],"mn":"절차, 과정","hk":"procedure(절차)는 proceed(나아가다)와 한 가족으로 순서대로 나아가는 단계. preparation(준비)·permission(허가)·proposal(제안)은 모양만 비슷한 함정.","ex":[["Follow [[the safety procedure]] carefully.","[[안전 절차]]를 잘 따르세요."],["The doctor explained [[the procedure]] to him.","의사는 그에게 [[그 절차]]를 설명했다."],["What is [[the usual procedure]] for applying?","신청하는 [[일반적인 절차]]는 무엇인가요?"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"mass","a":"1","e":"mass (명) 덩어리, 다수 - massive (형) 거대한, 엄청난\n① instinct (명) 본능 - instinctive (형) 본능적인","w":"② attend (동) 참석하다 - attentive (형) 주의 깊은\n③ destroy (동) 파괴하다 - destructive (형) 파괴적인\n④ select (동) 선택하다 - selective (형) 선별적인","m":0,"s":"mass - massive","c":["instinct - instinctive","attend - attentive","destroy - destructive","select - selective"],"mn":"덩어리, 다수","hk":"mass(덩어리)→massive(거대한)는 명사에서 형용사. 정답 instinct(본능)→instinctive(본능적인)도 명사→형용사, 나머지는 동사에서 형용사 함정.","ex":[["[[A mass of dark clouds]] covered the sky.","[[짙은 먹구름 덩어리]]가 하늘을 덮었다.","mass (명) 덩어리, 다수"],["They built [[a massive wall]] around the castle.","그들은 성 둘레에 [[거대한 벽]]을 쌓았다.","massive (형) 거대한, 엄청난"],["Every animal has [[a survival instinct]].","모든 동물은 [[생존 본능]]이 있다.","instinct (명) 본능"],["Babies show [[an instinctive reaction]] to loud noise.","아기들은 큰 소리에 [[본능적인 반응]]을 보인다.","instinctive (형) 본능적인"]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"matter","a":"4","e":"①문제, 사안 / ②문제, 사안 / ③문제, 사안 / ④물질 [④번만 의미가 다름]","k":"①우리는 결정을 내리기 전에 그 사안을 한 시간 동안 논의했다.\n②돈이 직업을 고를 때 우리가 생각해야 할 유일한 문제는 아니다.\n③선생님은 제출하지 않은 숙제가 심각한 문제라고 말씀하셨다.\n④공기부터 돌에 이르기까지 우리 주변의 모든 것은 물질로 이루어져 있다.","m":0,"c":["We discussed the matter for an hour before making a decision.","Money is not the only matter we should think about when choosing a job.","The teacher said the missing homework was a serious matter.","Everything around us, from air to stone, is made of matter."],"hc":"matter|matter|matter|matter","mn":"문제, 사안 / 물질","hk":"matter(문제, 물질)에서 ④번만 made of(~로 이루어진)와 어울리는 물질 뜻. 나머지는 일·사안 뜻.","ex":[["It is [[a serious matter]] for the school.","그것은 학교에 [[심각한 문제]]이다.","matter (명) 문제, 사안"],["We will talk about [[the matter]] tomorrow.","우리는 내일 [[그 사안]]에 대해 이야기할 것이다.","matter (명) 문제, 사안"],["Water, ice, and steam are all [[forms of matter]].","물, 얼음, 수증기는 모두 [[물질의 형태]]이다.","matter (명) 물질"]]}]},{"day":13,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"capacity","a":"4","e":"④ capacity: (가장 큰 양 / 용기나 방이나 기계가 담을 수 있는) 수용력, 용량","w":"① dimension: 크기, 치수\n② quantity: 양, 수량\n③ density: 밀도","k":"가장 큰 양 / 용기나 방이나 기계가 담을 수 있는","m":0,"s":"\"the largest amount that a container, a room, or a machine is able to hold\"","c":["dimension","quantity","density","capacity"],"mn":"수용력, 용량","hk":"용기나 방이 담을 수 있는 가장 큰 양은 capacity(용량). dimension(크기)·quantity(양)·density(밀도)는 담는 한도가 아닌 다른 개념 함정.","ex":[["The bottle has [[a capacity of one liter]].","그 병은 [[1리터의 용량]]을 가진다."],["The hall was filled to [[capacity]].","그 홀은 [[정원]]까지 가득 찼다."],["The tank has [[a large capacity]].","그 탱크는 [[큰 용량]]을 가지고 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"obvious","a":"4","e":"④ apparent: 분명한, 명백한 (떨리는 그녀의 손을 보니 그녀가 전에 그렇게 많은 사람 앞에서 말해 본 적이 없다는 것이 분명했다.) / obvious(명백한, 분명한)의 유의어.","w":"① unlikely: ~할 것 같지 않은\n② questionable: 의심스러운\n③ uncertain: 확실하지 않은","k":"떨리는 그녀의 손을 보니 그녀가 전에 그렇게 많은 사람 앞에서 말해 본 적이 없다는 것이 분명했다.","m":0,"s":"It was obvious from her shaking hands that she had never spoken in front of so many people before.","h":"obvious","c":["unlikely","questionable","uncertain","apparent"],"mn":"명백한, 분명한","hk":"obvious(명백한)는 apparent(분명한)와 같은 편. unlikely(~할 것 같지 않은)·questionable(의심스러운)·uncertain(확실하지 않은)은 확실하지 않다는 반대 쪽.","ex":[["It is [[obvious that]] he is tired.","그가 피곤하다는 것은 [[분명하다]]."],["She made [[an obvious mistake]].","그녀는 [[명백한 실수]]를 했다."],["There is [[an obvious difference]] between the two.","둘 사이에는 [[뚜렷한 차이]]가 있다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"crop","a":"crop","e":"crop 작물, 수확물","k":"그 나라 남부 지역의 벼 작물 대부분이 7월의 폭우로 망가졌다.","m":0,"s":"Most of the rice c______ in the southern part of the country was destroyed by heavy rain in July.","mn":"작물, 수확물","hk":"crop(작물)은 네 글자로 짧은 단어. 거두는 harvest(수확)와 짝으로 기억: 수확한 작물.","ex":[["Farmers planted [[a new crop]] this spring.","농부들은 이번 봄 [[새 작물]]을 심었다."],["Rice is [[the main crop]] here.","쌀이 이곳의 [[주요 작물]]이다."],["Heavy rain damaged [[the corn crop]].","폭우가 [[옥수수 작물]]에 피해를 입혔다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"fine","a":"fine","e":"fine (명) 벌금 / (형) 훌륭한, 좋은","k":"소방 출구를 막는 운전자는 100달러의 벌금을 내야 한다.\n그 조리법은 값싼 재료 세 가지만 요구했지만, 요리사는 그것을 왕실 식탁에 어울릴 만한 훌륭한 요리로 바꿔 놓았다.","m":0,"s":"Drivers who block the fire exit must pay a f______ of one hundred dollars.\nThough the recipe called for only three cheap ingredients, the chef turned it into a f______ dish worthy of a royal table.","mn":"벌금 / 훌륭한, 좋은","hk":"fine(벌금, 훌륭한)은 명사면 벌금, 형용사면 훌륭한 뜻. 주차 위반 딱지 장면과 요리 칭찬 장면으로 구분.","ex":[["He paid [[a parking fine]] yesterday.","그는 어제 [[주차 벌금]]을 냈다.","fine (명) 벌금"],["The judge gave her [[a heavy fine]].","판사는 그녀에게 [[무거운 벌금]]을 물렸다.","fine (명) 벌금"],["We had [[a fine dinner]] at the new restaurant.","우리는 새 식당에서 [[훌륭한 저녁 식사]]를 했다.","fine (형) 훌륭한, 좋은"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"salary","a":"salary","e":"salary 봉급, 월급","k":"그녀의 새 직장은 그녀가 전에 벌던 것의 거의 두 배인 월급을 준다.","m":0,"s":"Her new job pays a monthly s______ that is almost twice what she earned before.","mn":"봉급, 월급","hk":"salary(월급)는 l이 하나뿐이고 끝은 -ary. 달마다 받는 돈이라 monthly(매달의)와 함께 기억.","ex":[["He earns [[a high salary]].","그는 [[높은 월급]]을 번다."],["My father got [[a salary increase]].","아버지는 [[월급 인상]]을 받으셨다."],["What is [[the starting salary]] for this job?","이 일의 [[초봉]]은 얼마인가요?"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"vertical","a":"2","e":"② horizontal: 수평의 (그 화가는 흰 캔버스 한가운데에 긴 수직선을 그었다.) / vertical(수직의, 세로의)의 반의어.","w":"① parallel: 평행한\n③ diagonal: 대각선의\n④ upright: 똑바로 선, 수직의","k":"그 화가는 흰 캔버스 한가운데에 긴 수직선을 그었다.","m":0,"s":"The artist drew a long vertical line down the center of the white canvas.","h":"vertical","c":["parallel","horizontal","diagonal","upright"],"mn":"수직의, 세로의","hk":"vertical(수직의)의 반대는 horizontal(수평의). parallel(평행한)·diagonal(대각선의)은 반대말이 아니고, upright(똑바로 선)는 같은 편 함정.","ex":[["Draw [[a vertical line]] on the paper.","종이에 [[수직선]]을 그어라.","vertical (형) 수직의, 세로의"],["The wall is [[almost vertical]].","그 벽은 [[거의 수직이다]].","vertical (형) 수직의, 세로의"],["Put the bar in [[a horizontal position]].","막대를 [[수평 위치]]에 놓아라.","horizontal (형) 수평의"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"merit","a":"2","e":"② merit: 장점","w":"① reward: 보상\n③ defect: 결점\n④ duty: 의무","m":0,"s":"merit","c":["보상","장점","결점","의무"],"mn":"장점","hk":"merit(장점)은 칭찬받을 만한 좋은 점. defect(결점)는 반대편, reward(보상)·duty(의무)는 점이 아니라 다른 개념 함정.","ex":[["The [[main merit]] of this plan is its low cost.","이 계획의 [[주요 장점]]은 낮은 비용이다."],["The idea has [[great merit]].","그 생각은 [[큰 장점]]이 있다."],["Each plan has [[its own merits]].","각 계획에는 [[나름의 장점들]]이 있다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"hypothesis","a":"4","e":"④ hypothesis: 가설","w":"① summary: 요약\n② definition: 정의\n③ analysis: 분석","m":0,"s":"\"가설\"","c":["summary","definition","analysis","hypothesis"],"mn":"가설","hk":"hypothesis(가설)는 실험으로 확인하기 전에 세우는 설명. summary(요약)·definition(정의)·analysis(분석)는 다른 활동 함정.","ex":[["The scientist tested [[her hypothesis]].","그 과학자는 [[자신의 가설]]을 시험했다."],["The results [[support the hypothesis]].","결과는 [[그 가설을 뒷받침한다]]."],["We need to [[form a hypothesis]] first.","우리는 먼저 [[가설을 세워야]] 한다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"hazard","a":"4","e":"hazard (명) 위험 요소 - hazardous (형) 위험한\n④ virtue (명) 미덕, 덕 - virtuous (형) 덕이 있는, 고결한","w":"① inform (동) 알리다, 알려 주다 - informative (형) 유익한, 정보를 주는\n② persuade (동) 설득하다 - persuasive (형) 설득력 있는\n③ offend (동) 기분을 상하게 하다 - offensive (형) 모욕적인, 공격적인","m":0,"s":"hazard - hazardous","c":["inform - informative","persuade - persuasive","offend - offensive","virtue - virtuous"],"mn":"위험 요소","hk":"hazard(위험 요소)→hazardous(위험한)는 명사에서 형용사. 정답 virtue(미덕)→virtuous(덕이 있는)도 명사→형용사, 나머지는 동사에서 형용사 함정.","ex":[["Smoking is [[a health hazard]].","흡연은 [[건강 위험 요소]]이다.","hazard (명) 위험 요소"],["[[Hazardous waste]] must be handled with care.","[[위험한 폐기물]]은 조심스럽게 다뤄야 한다.","hazardous (형) 위험한"],["Patience is [[a great virtue]].","인내는 [[큰 미덕]]이다.","virtue (명) 미덕, 덕"],["She led [[a virtuous life]].","그녀는 [[덕이 있는 삶]]을 살았다.","virtuous (형) 덕이 있는, 고결한"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"anticipate","a":"4","e":"④ anticipate: 예상하다, 예측하다 (기상 예보관들은 그 폭풍이 얼마나 빨리 방향을 바꿀지 예상할 수 없었다.)","w":"① appreciate: 진가를 알아보다, 감사하다\n② investigate: 조사하다\n③ participate: 참가하다","k":"기상 예보관들은 그 폭풍이 얼마나 빨리 방향을 바꿀지 예상할 수 없었다.","m":0,"s":"Weather forecasters could not ________ how quickly the storm would change direction.","c":["appreciate","investigate","participate","anticipate"],"mn":"예상하다, 예측하다","hk":"anticipate(예상하다)는 앞일을 미리 내다봄. appreciate(감사하다)·investigate(조사하다)·participate(참가하다)는 끝 모양만 닮은 함정.","ex":[["We [[anticipate heavy traffic]] today.","우리는 오늘 [[극심한 교통 체증을 예상한다]]."],["Nobody could [[anticipate the result]].","아무도 [[그 결과를 예상할]] 수 없었다."],["She [[anticipated his question]].","그녀는 [[그의 질문을 예상했다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"mechanic","a":"3","e":"③ mechanic: (직업이 기계를 수리하는 것인 사람 / 특히 자동차의 엔진을) 정비사, 수리공","w":"① architect: 건축가\n② inventor: 발명가\n④ operator: 운전자, 조작자","k":"직업이 기계를 수리하는 것인 사람 / 특히 자동차의 엔진을","m":0,"s":"\"a person whose job is to repair machines, especially the engines of cars\"","c":["architect","inventor","mechanic","operator"],"mn":"정비사, 수리공","hk":"기계, 특히 자동차 엔진을 고치는 직업인은 mechanic(정비사). architect(건축가)·inventor(발명가)·operator(조작자)는 고치는 사람이 아닌 함정.","ex":[["[[A car mechanic]] fixed our brakes.","[[자동차 정비사]]가 우리 브레이크를 고쳤다."],["I took my bike to [[the mechanic]].","나는 자전거를 [[정비사]]에게 가져갔다."],["He works as [[a mechanic]] at a garage.","그는 정비소에서 [[정비사]]로 일한다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"cease","a":"4","e":"④ halt: 중단하다, 멈추다 (정부는 안전 검사가 끝날 때까지 그 공장에 생산을 중단하라고 명령했다.) / cease(중단하다, 그치다)의 유의어.","w":"① resume: 재개하다\n② persist: 계속되다, 지속하다\n③ prolong: 연장하다","k":"정부는 안전 검사가 끝날 때까지 그 공장에 생산을 중단하라고 명령했다.","m":0,"s":"The government ordered the factory to cease production until the safety tests were complete.","h":"cease","c":["resume","persist","prolong","halt"],"mn":"중단하다, 그치다","hk":"cease(중단하다)와 halt(중단하다, 멈추다)는 같은 편. resume(재개하다)·persist(계속되다)·prolong(연장하다)은 계속하는 쪽 반대 함정.","ex":[["The noise suddenly [[ceased]].","소음이 갑자기 [[멈췄다]]."],["The factory will [[cease production]].","그 공장은 [[생산을 중단할]] 것이다."],["He asked them to [[cease talking]].","그는 그들에게 [[말을 멈추라고]] 요청했다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"ordinary","a":"2,3","e":"② extraordinary: 비범한, 대단한 (그는 인생의 대부분을 평범한 회사원으로 살았고, 아무도 그가 영웅이 되리라고 기대하지 않았다.) / ordinary(평범한, 보통의)의 반의어.\n③ unusual: 평범하지 않은, 특이한","w":"① usual: 평소의, 보통의\n④ familiar: 익숙한, 친숙한","k":"그는 인생의 대부분을 평범한 회사원으로 살았고, 아무도 그가 영웅이 되리라고 기대하지 않았다.","m":2,"s":"For most of his life he was an ordinary office worker, and nobody expected him to become a hero.","h":"ordinary","c":["usual","extraordinary","unusual","familiar"],"mn":"평범한, 보통의","hk":"ordinary(평범한)의 반대는 extraordinary(비범한)와 unusual(특이한), 정답 2개. usual(평소의)·familiar(익숙한)는 같은 편 함정.","ex":[["He lives [[an ordinary life]] in a small town.","그는 작은 마을에서 [[평범한 삶]]을 산다.","ordinary (형) 평범한, 보통의"],["She has [[extraordinary talent]] in music.","그녀는 음악에서 [[비범한 재능]]을 가지고 있다.","extraordinary (형) 비범한, 대단한"],["What [[an unusual name]]!","정말 [[특이한 이름]]이구나!","unusual (형) 평범하지 않은, 특이한"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"distribute","a":"1","e":"① distribute: 나눠 주다, 분배하다 (우리 동아리 학생들이 모든 급수대에서 주자들에게 무료 생수를 나눠 줄 것이다.)","w":"② consume: 소비하다, 먹다(마시다)\n③ gather: 모으다, 모이다\n④ collect: 모으다, 수집하다","k":"우리 동아리 학생들이 모든 급수대에서 주자들에게 무료 생수를 나눠 줄 것이다.","m":0,"s":"Students from our club will ________ free bottles of water to the runners at every station.","c":["distribute","consume","gather","collect"],"mn":"나눠 주다, 분배하다","hk":"distribute(나눠 주다)는 여러 사람에게 골고루 건넴. consume(소비하다)·gather(모으다)·collect(수집하다)는 쓰거나 모으는 쪽이라 방향이 다른 함정.","ex":[["Volunteers [[distribute food]] to the poor.","자원봉사자들이 가난한 사람들에게 [[음식을 나눠 준다]]."],["The teacher will [[distribute the tests]].","선생님이 [[시험지를 나눠 줄]] 것이다."],["The company will [[distribute free samples]].","그 회사는 [[무료 샘플을 나눠 줄]] 것이다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"account","a":"1","e":"①설명, 진술 / ②계좌 / ③계좌 / ④계좌 [①번만 의미가 다름]","k":"①그날 밤 일어난 일에 대한 그녀의 진술은 경찰 보고서와 일치하지 않았다.\n②그 회사는 지난 금요일에 내 계좌로 돈을 보냈다.\n③너는 그 은행의 어느 지점에서든 예금 계좌를 개설할 수 있다.\n④그는 돈이 들어왔는지 보려고 자신의 은행 계좌를 확인했다.","m":0,"c":["Her account of what happened that night did not agree with the police report.","The company sent the money to my account last Friday.","You can open a savings account at any office of that bank.","He looked at his bank account to see if the payment had arrived."],"hc":"account|account|account|account","mn":"계좌 / 설명, 진술","hk":"account(계좌, 진술)는 ①번만 사건을 설명하는 진술 뜻. ②③④는 모두 bank(은행)에 돈을 넣는 계좌.","ex":[["He gave the police [[an account of the accident]].","그는 경찰에게 [[사고에 대한 설명]]을 했다.","account (명) 설명, 진술"],["I opened [[a bank account]] today.","나는 오늘 [[은행 계좌]]를 만들었다.","account (명) 계좌"],["She saves money in [[a savings account]].","그녀는 [[저축 계좌]]에 돈을 모은다.","account (명) 계좌"]]}]},{"day":14,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"outcome","a":"2","e":"② outcome: 결과, 성과","w":"① outbreak: 발생, 발발\n③ outlook: 전망, 관점\n④ outline: 개요, 윤곽","m":0,"s":"\"결과, 성과\"","c":["outbreak","outcome","outlook","outline"],"mn":"결과, 성과","hk":"out(밖으로)+come(나오다)=outcome(결과), 밖으로 나온 것. outbreak(발생)·outlook(전망)·outline(개요)은 모양만 비슷한 함정.","ex":[["We are waiting for [[the outcome]] of the test.","우리는 시험 [[결과]]를 기다리고 있다."],["The meeting had [[a positive outcome]].","그 회의는 [[긍정적인 결과]]를 낳았다."],["No one knew [[the final outcome]].","아무도 [[최종 결과]]를 알지 못했다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"maximum","a":"2","e":"② minimum: 최소, 최저 (이 작은 엘리베이터에 탈 수 있는 최대 인원은 여덟 명이다.) / maximum(최대, 최고)의 반의어.","w":"① limit: 한계, 제한\n③ total: 합계, 총액\n④ margin: 여백, 여유","k":"이 작은 엘리베이터에 탈 수 있는 최대 인원은 여덟 명이다.","m":0,"s":"The maximum number of people allowed in this small elevator is eight.","h":"maximum","c":["limit","minimum","total","margin"],"mn":"최대, 최고","hk":"maximum(최대)의 반대는 minimum(최소). limit(한계)·total(합계)·margin(여백)은 최소가 아니라 다른 개념 함정.","ex":[["The bus carries [[a maximum of 40 people]].","그 버스는 [[최대 40명]]을 태운다.","maximum (명) 최대, 최고"],["This is [[the maximum]] we can pay.","이것이 우리가 낼 수 있는 [[최대치]]이다.","maximum (명) 최대, 최고"],["We need [[a minimum of three players]].","우리는 [[최소 세 명의 선수]]가 필요하다.","minimum (명) 최소, 최저"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"assemble","a":"4","e":"④ assemble: 조립하다, 모으다 (인부들은 수백 개의 금속 부품으로 무대를 조립하는 데 두 시간쯤 필요하다.)","w":"① remove: 제거하다, 치우다\n② dismantle: 분해하다, 해체하다\n③ decorate: 장식하다","k":"인부들은 수백 개의 금속 부품으로 무대를 조립하는 데 두 시간쯤 필요하다.","m":0,"s":"Workers need about two hours to ________ the stage from hundreds of metal parts.","c":["remove","dismantle","decorate","assemble"],"mn":"조립하다, 모으다","hk":"assemble(조립하다)은 부품을 모아 맞춤. remove(제거하다)·dismantle(분해하다)은 반대 방향, decorate(장식하다)는 조립이 아닌 함정.","ex":[["Dad helped me [[assemble the desk]].","아빠는 내가 [[책상을 조립하는]] 것을 도와주셨다."],["Workers [[assemble cars]] in this factory.","노동자들은 이 공장에서 [[자동차를 조립한다]]."],["The kids [[assemble a toy robot]] from small parts.","아이들은 작은 부품으로 [[장난감 로봇을 조립한다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"considerate","a":"1","e":"① thoughtful: 사려 깊은, 배려하는 (그녀가 안전하게 도착했다는 것을 그녀의 부모님께 전화해 알려 준 것은 그가 매우 사려 깊은 행동이었다.) / considerate(사려 깊은, 배려심 있는)의 유의어.","w":"② agreeable: 상냥한, 기분 좋은\n③ sincere: 진심 어린\n④ obedient: 순종적인","k":"그녀가 안전하게 도착했다는 것을 그녀의 부모님께 전화해 알려 준 것은 그가 매우 사려 깊은 행동이었다.","m":0,"s":"It was very considerate of him to call her parents and let them know she had arrived safely.","h":"considerate","c":["thoughtful","agreeable","sincere","obedient"],"mn":"사려 깊은, 배려심 있는","hk":"considerate(사려 깊은)는 thoughtful(사려 깊은)과 같은 편. agreeable(상냥한)·sincere(진심 어린)·obedient(순종적인)는 배려와 다른 성격 함정.","ex":[["He is [[a considerate person]].","그는 [[사려 깊은 사람]]이다."],["It was [[considerate]] of you to wait for me.","나를 기다려 준 것은 정말 [[사려 깊은]] 행동이었다."],["He is always [[considerate of others]].","그는 늘 [[다른 사람을 배려한다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"welfare","a":"welfare","e":"welfare 복지, 안녕","k":"그 새 법은 가난한 지역에 사는 아이들의 복지를 향상시키기 위해 작성되었다.","m":0,"s":"The new law was written to improve the w______ of children living in poor areas.","mn":"복지, 안녕","hk":"welfare(복지)는 well(잘)+fare(지냄)에서 온 말이지만 엘이 하나뿐인 철자. 잘 지내는 상태라서 복지·안녕.","ex":[["[[Child welfare]] is a top priority.","[[아동 복지]]는 최우선 과제이다."],["She works at [[a welfare center]].","그녀는 [[복지관]]에서 일한다."],["[[Animal welfare]] laws protect pets.","[[동물 복지]] 법은 반려동물을 보호한다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"exclude","a":"2","e":"② exclude: 제외하다, 배제하다 (그 새 규정은 열여섯 살 미만인 사람은 누구든 그 대회에서 제외할 것이다.)","w":"① welcome: 환영하다\n③ admit: 입장을 허락하다, 인정하다\n④ invite: 초대하다","k":"그 새 규정은 열여섯 살 미만인 사람은 누구든 그 대회에서 제외할 것이다.","m":0,"s":"The new rule will ________ anyone under sixteen from the contest.","c":["welcome","exclude","admit","invite"],"mn":"제외하다, 배제하다","hk":"exclude(제외하다)는 밖으로 내보내 못 들어오게 함. welcome(환영하다)·admit(입장을 허락하다)·invite(초대하다)는 들어오게 하는 반대 방향 함정.","ex":[["Don't [[exclude]] anyone from the game.","게임에서 아무도 [[제외하지]] 마라."],["The price [[excludes tax]].","그 가격은 [[세금을 제외한다]]."],["The list [[excludes children under five]].","그 목록은 [[다섯 살 미만 어린이를 제외한다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"license","a":"4","e":"④ license: (공식 문서 / 당신에게 허가를 주는 / 무언가를 소유하거나 하도록) 면허(증), 허가증","w":"① invitation: 초대(장)\n② receipt: 영수증\n③ contract: 계약(서)","k":"공식 문서 / 당신에게 허가를 주는 / 무언가를 소유하거나 하도록","m":0,"s":"\"an official document that gives you permission to own or do something\"","c":["invitation","receipt","contract","license"],"mn":"면허(증), 허가증","hk":"무언가를 소유하거나 할 허가를 주는 공식 문서는 license(면허증). invitation(초대장)·receipt(영수증)·contract(계약서)도 문서지만 허가가 아닌 함정.","ex":[["He passed the test and got [[a driver's license]].","그는 시험에 합격해 [[운전면허증]]을 땄다."],["You need [[a fishing license]] here.","여기서는 [[낚시 허가증]]이 필요하다."],["The shop lost [[its business license]].","그 가게는 [[영업 허가증]]을 잃었다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"respond","a":"2","e":"respond (동) 반응하다, 응답하다 - responsive (형) 반응이 빠른, 호응하는\n② construct (동) 건설하다, 구성하다 - constructive (형) 건설적인","w":"① success (명) 성공 - successful (형) 성공적인\n③ fault (명) 결점, 잘못 - faulty (형) 결함이 있는\n④ grace (명) 우아함, 품위 - graceful (형) 우아한","m":0,"s":"respond - responsive","c":["success - successful","construct - constructive","fault - faulty","grace - graceful"],"mn":"반응하다, 응답하다","hk":"respond(반응하다)→responsive(호응하는)는 동사에서 형용사. 정답 construct(건설하다)→constructive(건설적인)도 동사→형용사, 나머지는 명사에서 형용사 함정.","ex":[["Please [[respond to]] my email soon.","내 이메일에 곧 [[답해]] 주세요.","respond (동) 반응하다, 응답하다"],["The staff is [[responsive to]] customers.","직원들은 고객에게 [[잘 호응한다]].","responsive (형) 반응이 빠른, 호응하는"],["They plan to [[construct a bridge]] here.","그들은 여기에 [[다리를 건설할]] 계획이다.","construct (동) 건설하다, 구성하다"],["She gave me [[constructive advice]].","그녀는 내게 [[건설적인 조언]]을 해 주었다.","constructive (형) 건설적인"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"acquire","a":"3","e":"③ obtain: 얻다, 획득하다 (그 박물관이 그렇게 많은 옛 지도 소장품을 얻는 데 20년이 걸렸다.) / acquire(획득하다, 손에 넣다)의 유의어.","w":"① inherit: 물려받다, 상속하다\n② reserve: 예약하다, 비축하다\n④ deposit: 예치하다, 맡기다","k":"그 박물관이 그렇게 많은 옛 지도 소장품을 얻는 데 20년이 걸렸다.","m":0,"s":"It took the museum twenty years to acquire such a large collection of old maps.","h":"acquire","c":["inherit","reserve","obtain","deposit"],"mn":"획득하다, 손에 넣다","hk":"acquire(획득하다)는 obtain(얻다)과 같은 편. inherit(물려받다)·reserve(예약하다)·deposit(예치하다)는 얻는 방식이 달라 함정.","ex":[["She wants to [[acquire new skills]].","그녀는 [[새로운 기술을 익히고]] 싶어 한다."],["The company will [[acquire a small firm]].","그 회사는 [[작은 회사를 인수할]] 것이다."],["Children quickly [[acquire language]].","아이들은 빠르게 [[언어를 습득한다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"ceiling","a":"ceiling","e":"ceiling 천장","k":"물 한 방울이 천장에서 내 책상 위에 펼쳐져 있던 공책으로 떨어졌다.","m":0,"s":"A drop of water fell from the c______ onto the open notebook on my desk.","mn":"천장","hk":"ceiling(천장)은 c 뒤에 ei 순서(cei). 'i는 e 앞, 단 c 뒤는 e 먼저' 규칙의 대표 단어. 위쪽이라 floor(바닥)의 반대편.","ex":[["There is a spider on [[the ceiling]].","[[천장]]에 거미가 한 마리 있다."],["The room has [[a high ceiling]].","그 방은 [[높은 천장]]을 가지고 있다."],["[[A ceiling fan]] kept us cool.","[[천장 선풍기]]가 우리를 시원하게 해 주었다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"panel","a":"panel","e":"panel (명) 판, 널빤지 / (명) 심사위원단, 토론자단","k":"지난밤 폭풍이 부는 동안 울타리에서 나무판자 하나가 헐거워졌다.\n다섯 명의 전문가로 이루어진 심사위원단이 어느 디자인이 그 상을 받을 만한지 결정할 것이다.","m":0,"s":"A single wooden p______ had come loose from the fence during last night's storm.\nA p______ of five experts will decide which design deserves the prize.","mn":"판, 널빤지 / 심사위원단, 토론자단","hk":"panel(판, 심사위원단)은 한 단어 두 뜻. 울타리의 나무판은 물건이고, 전문가 다섯 명이 모인 쪽은 사람 모임.","ex":[["One [[wooden panel]] of the fence fell off.","울타리의 [[나무판]] 하나가 떨어졌다.","panel (명) 판, 널빤지"],["The house uses [[solar panels]].","그 집은 [[태양광 패널]]을 사용한다.","panel (명) 판, 널빤지"],["[[A panel of judges]] chose the winner.","[[심사위원단]]이 우승자를 골랐다.","panel (명) 심사위원단, 토론자단"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"rival","a":"4","e":"④ rival: (당신과 겨루는 사람이나 집단 / 스포츠, 사업, 또는 정치에서) 경쟁자, 경쟁 상대","w":"① assistant: 조수, 보조원\n② ally: 동맹자, 협력자\n③ successor: 후임자, 후계자","k":"당신과 겨루는 사람이나 집단 / 스포츠, 사업, 또는 정치에서","m":0,"s":"\"a person or group that competes against you in sport, business, or politics\"","c":["assistant","ally","successor","rival"],"mn":"경쟁자, 경쟁 상대","hk":"스포츠·사업·정치에서 나와 겨루는 사람은 rival(경쟁자). assistant(조수)·ally(동맹자)·successor(후임자)는 겨루는 상대가 아닌 함정.","ex":[["They are [[rival teams]].","그들은 [[경쟁 팀]]이다."],["He beat [[his old rival]] in the final.","그는 결승에서 [[오랜 라이벌]]을 이겼다."],["The two companies became [[business rivals]].","두 회사는 [[사업상 경쟁자]]가 되었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"conscious","a":"2,4","e":"② unaware: 알아차리지 못하는 (그녀는 그 위험을 충분히 의식하고 있었지만, 그래도 그 얼어붙은 비탈을 오르기로 했다.) / conscious(알아차리는, 의식하는)의 반의어.\n④ unconscious: 자각하지 못하는, 의식하지 못하는","w":"① mindful: 유념하는, 신경 쓰는\n③ alert: 경계하는, 조심성 있는","k":"그녀는 그 위험을 충분히 의식하고 있었지만, 그래도 그 얼어붙은 비탈을 오르기로 했다.","m":2,"s":"She was fully conscious of the danger, but she chose to climb the frozen slope anyway.","h":"conscious","c":["mindful","unaware","alert","unconscious"],"mn":"알아차리는, 의식하는","hk":"conscious(알아차리는)의 반대는 unaware(알아차리지 못하는)와 unconscious(의식하지 못하는), 정답 2개. mindful(유념하는)·alert(경계하는)는 같은 편 함정.","ex":[["He was [[conscious of]] his mistake.","그는 자신의 실수를 [[의식하고 있었다]].","conscious (형) 알아차리는, 의식하는"],["She was [[unaware of]] the danger.","그녀는 그 위험을 [[알지 못했다]].","unaware (형) 알아차리지 못하는"],["Many habits are [[unconscious]].","많은 습관은 [[무의식적이다]].","unconscious (형) 자각하지 못하는, 의식하지 못하는"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"fluent","a":"4","e":"④ fluent: 유창한","w":"① talkative: 수다스러운\n② frank: 솔직한\n③ awkward: 서투른","m":0,"s":"fluent","c":["수다스러운","솔직한","서투른","유창한"],"mn":"유창한","hk":"fluent(유창한)는 flow(흐르다)와 같은 뿌리로 말이 술술 흐름. talkative(수다스러운)는 말의 양일 뿐, awkward(서투른)는 반대 함정.","ex":[["She is [[fluent in]] English.","그녀는 영어가 [[유창하다]]."],["He speaks [[fluent Spanish]].","그는 [[유창한 스페인어]]를 말한다."],["Practice is the key to [[fluent speech]].","연습은 [[유창한 말하기]]의 열쇠이다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"issue","a":"3","e":"①문제, 쟁점 / ②문제, 쟁점 / ③(정기 간행물의) 호 / ④문제, 쟁점 [③번만 의미가 다름]","k":"①그 시장은 인터뷰 중에 주택 문제를 논의하기를 거부했다.\n②공장 내부의 안전은 노동자들에게 점점 커지는 문제가 되었다.\n③그 과학 잡지의 최신 호에는 블랙홀에 관한 긴 기사가 실려 있다.\n④기후 변화는 오늘날 세계가 직면한 가장 심각한 문제이다.","m":0,"c":["The mayor refused to discuss the housing issue during the interview.","Safety inside the factory has become a growing issue for the workers.","The latest issue of that science magazine has a long report on black holes.","Climate change is the most serious issue facing the world today."],"hc":"issue|issue|issue|issue","mn":"문제, 쟁점 / (정기 간행물의) 호","hk":"issue(문제, 호)는 ③번 magazine(잡지) 이야기만 간행물 호 뜻. 나머지는 housing(주택) 문제, safety(안전) 문제처럼 쟁점.","ex":[["That is [[a social issue]].","그것은 [[사회 문제]]이다.","issue (명) 문제, 쟁점"],["I bought [[the latest issue]] of the magazine.","나는 그 잡지의 [[최신 호]]를 샀다.","issue (명) (정기 간행물의) 호"],["Pollution is [[an important issue]].","오염은 [[중요한 문제]]이다.","issue (명) 문제, 쟁점"]]}]},{"day":15,"q":[{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"absorb","a":"3","e":"③ absorb: 흡수하다 (마른 땅은 단 몇 분 만에 놀라울 만큼 많은 양의 물을 흡수할 수 있다.)","w":"① repel: 밀어내다, 튕겨내다\n② reflect: 반사하다\n④ evaporate: 증발하다","k":"마른 땅은 단 몇 분 만에 놀라울 만큼 많은 양의 물을 흡수할 수 있다.","m":0,"s":"Dry ground can ________ a surprising amount of water in just a few minutes.","c":["repel","reflect","absorb","evaporate"],"mn":"흡수하다","hk":"absorb(흡수하다)는 스펀지처럼 빨아들임. repel(밀어내다)·reflect(반사하다)는 튕겨내는 반대 방향, evaporate(증발하다)는 날아감 함정.","ex":[["Plants [[absorb sunlight]].","식물은 [[햇빛을 흡수한다]]."],["A sponge can [[absorb water]].","스펀지는 [[물을 흡수할]] 수 있다."],["Dark clothes [[absorb heat]].","어두운 옷은 [[열을 흡수한다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"advance","a":"3","e":"③ retreat: 후퇴하다, 물러나다 (군인들은 새벽에 그 돌다리를 향해 천천히 전진하라는 명령을 받았다.) / advance(전진하다, 나아가다)의 반의어.","w":"① approach: 다가가다, 접근하다\n② proceed: 나아가다, 진행하다\n④ progress: 나아가다, 진전하다","k":"군인들은 새벽에 그 돌다리를 향해 천천히 전진하라는 명령을 받았다.","m":0,"s":"The soldiers were ordered to advance slowly toward the stone bridge at dawn.","h":"advance","c":["approach","proceed","retreat","progress"],"mn":"전진하다, 나아가다","hk":"advance(전진하다)의 반대는 retreat(후퇴하다). approach(다가가다)·proceed(나아가다)·progress(나아가다)는 같은 편 함정.","ex":[["The army began to [[advance]] at dawn.","군대는 새벽에 [[전진하기]] 시작했다.","advance (동) 전진하다, 나아가다"],["The team will [[advance to]] the final.","그 팀은 결승에 [[진출할]] 것이다.","advance (동) 전진하다, 나아가다"],["The enemy had to [[retreat]] from the hill.","적은 언덕에서 [[후퇴해야]] 했다.","retreat (동) 후퇴하다, 물러나다"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"conserve","a":"4","e":"④ preserve: 보존하다, 지키다 (그 새 법은 동해안을 따라 있는 숲을 보존하기 위한 것이다.) / conserve(보존하다, 보호하다)의 유의어.","w":"① replace: 대체하다, 교체하다\n② restore: 복원하다\n③ transform: 변형시키다, 바꾸다","k":"그 새 법은 동부 해안을 따라 있는 숲을 보존하기 위한 것이다.","m":0,"s":"The new law is meant to conserve the forests along the eastern coast.","h":"conserve","c":["replace","restore","transform","preserve"],"mn":"보존하다, 보호하다","hk":"conserve(보존하다)는 preserve(보존하다)와 같은 편. replace(대체하다)·restore(복원하다)·transform(변형시키다)은 지키는 게 아니라 바꾸는 쪽 함정.","ex":[["Parks help [[conserve nature]].","공원은 [[자연을 보존하는]] 데 도움이 된다."],["Groups work to [[conserve wildlife]].","단체들은 [[야생 동물을 보호하려고]] 노력한다."],["We should [[conserve forests]] for the future.","우리는 미래를 위해 [[숲을 보존해야]] 한다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"tension","a":"tension","e":"tension 긴장, 긴장 상태","k":"양측이 합의를 거부하면서 회의실 안의 긴장감이 커졌다.","m":0,"s":"The t______ in the meeting room grew as the two sides refused to agree.","mn":"긴장, 긴장 상태","hk":"tension(긴장)은 -tion이 아니라 -sion으로 끝나는 철자. 팽팽히 당겨진 긴장감.","ex":[["[[Tension grew]] between the two teams.","두 팀 사이에 [[긴장이 커졌다]]."],["She tried to [[reduce the tension]].","그녀는 [[긴장을 줄이려고]] 했다."],["[[Political tension]] is rising.","[[정치적 긴장]]이 높아지고 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"considerable","a":"4","e":"④ substantial: 상당한, 꽤 많은 (상당한 수의 학생들이 도서관 이용 시간이 더 길어지기를 원한다고 말했다.) / considerable(상당한, 꽤 많은)의 유의어.","w":"① minimal: 최소한의\n② relative: 상대적인\n③ partial: 부분적인","k":"상당한 수의 학생들이 도서관 이용 시간이 더 길어지기를 원한다고 말했다.","m":0,"s":"A considerable number of students said they wanted longer library hours.","h":"considerable","c":["minimal","relative","partial","substantial"],"mn":"상당한, 꽤 많은","hk":"considerable(상당한)은 substantial(상당한)과 같은 편. minimal(최소한의)은 정반대, relative(상대적인)·partial(부분적인)은 크기를 뜻하지 않는 함정.","ex":[["He spent [[a considerable amount of money]].","그는 [[상당한 액수의 돈]]을 썼다."],["The storm caused [[considerable damage]].","폭풍은 [[상당한 피해]]를 일으켰다."],["[[A considerable number of]] people came.","[[상당수의]] 사람들이 왔다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"appliance","a":"4","e":"④ appliance: (가정에서 쓰이는 기계 / 세탁기나 냉장고 같은) (가정용) 기기, 가전제품","w":"① furniture: 가구\n② vehicle: 차량, 탈것\n③ instrument: 기구, 도구","k":"가정에서 쓰이는 기계 / 세탁기나 냉장고 같은","m":0,"s":"\"a machine used in the home, such as a washing machine or a refrigerator\"","c":["furniture","vehicle","instrument","appliance"],"mn":"(가정용) 기기, 가전제품","hk":"세탁기·냉장고처럼 집에서 쓰는 기계는 appliance(가전제품). furniture(가구)·vehicle(차량)·instrument(기구)는 집 안 물건이어도 가전이 아닌 함정.","ex":[["Fridges are [[kitchen appliances]].","냉장고는 [[주방 가전]]이다."],["We bought [[a new appliance]] for the house.","우리는 집에 쓸 [[새 가전제품]]을 샀다."],["Turn off [[household appliances]] when you leave.","나갈 때는 [[가정용 기기]]를 꺼라."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"accumulate","a":"4","e":"④ accumulate: 쌓이다, 축적되다 (빈집의 선반에 먼지가 쌓이기 시작했다.)","w":"① dissolve: 녹다, 용해되다\n② scatter: 흩어지다, 흩뿌리다\n③ harden: 굳다, 단단해지다","k":"빈집의 선반에 먼지가 쌓이기 시작했다.","m":0,"s":"Dust began to ________ on the shelves of the empty house.","c":["dissolve","scatter","harden","accumulate"],"mn":"쌓이다, 축적되다","hk":"accumulate(쌓이다)는 조금씩 모여 늘어남. dissolve(녹다)·scatter(흩어지다)는 반대 방향, harden(굳다)은 상태 변화 함정.","ex":[["Snow began to [[accumulate]] on the road.","도로에 눈이 [[쌓이기]] 시작했다."],["Dust will [[accumulate]] if you don't clean.","청소하지 않으면 먼지가 [[쌓인다]]."],["She tried to [[accumulate wealth]].","그녀는 [[부를 축적하려고]] 노력했다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"efficient","a":"1,3","e":"① inefficient: 비효율적인\n③ wasteful: 낭비하는, 낭비적인 (그 낡은 난방 시스템은 그다지 효율적이지 않아서, 학교는 겨울마다 지나치게 많은 돈을 쓴다.) / efficient(효율적인, 낭비가 없는)의 반의어.","w":"② effective: 효과적인\n④ economical: 경제적인, 알뜰한","k":"그 낡은 난방 시스템은 그다지 효율적이지 않아서, 학교는 겨울마다 지나치게 많은 돈을 쓴다.","m":2,"s":"The old heating system is not very efficient, so the school spends far too much money every winter.","h":"efficient","c":["inefficient","effective","wasteful","economical"],"mn":"효율적인, 낭비가 없는","hk":"efficient(효율적인)의 반대는 inefficient(비효율적인)와 wasteful(낭비하는), 정답 2개. effective(효과적인)·economical(경제적인)은 같은 편 함정.","ex":[["This machine is [[very efficient]].","이 기계는 [[매우 효율적이다]].","efficient (형) 효율적인, 낭비가 없는"],["It is [[an inefficient way]] to study.","이것은 공부하는 [[비효율적인 방법]]이다.","inefficient (형) 비효율적인"],["Stop [[being wasteful]] with water.","물을 [[낭비하지]] 마라.","wasteful (형) 낭비하는, 낭비적인"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"portion","a":"portion","e":"portion 몫, 1인분","k":"의사는 그에게 매 끼니마다 더 적은 양을 먹으라고 말했다.","m":0,"s":"The doctor told him to eat a smaller p______ at each meal.","mn":"몫, 1인분","hk":"portion(몫, 1인분)은 끝 소리 '션'을 티·아이·오·엔으로 씀. 나눈 한 조각이라 part(부분)와 가까운 뜻.","ex":[["She ate [[a small portion]] of rice.","그녀는 [[적은 양]]의 밥을 먹었다."],["The restaurant serves [[large portions]].","그 식당은 [[푸짐한 1인분]]을 낸다."],["Each child got [[an equal portion]].","각 아이는 [[똑같은 몫]]을 받았다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"guilt","a":"1","e":"① guilt: (당신이 느끼는 괴로운 감정 / 당신이 알게 되었을 때 / 당신이 잘못된 일을 저질렀다는 것을) 죄책감","w":"② pity: 연민, 안타까움\n③ grief: 깊은 슬픔\n④ embarrassment: 당황, 창피함","k":"당신이 느끼는 괴로운 감정 / 당신이 알게 되었을 때 / 당신이 잘못된 일을 저질렀다는 것을","m":0,"s":"\"the unhappy feeling you have when you know you have done something wrong\"","c":["guilt","pity","grief","embarrassment"],"mn":"죄책감","hk":"잘못을 저질렀다는 걸 알 때 드는 괴로운 감정은 guilt(죄책감). pity(연민)는 남에 대한 감정, grief(깊은 슬픔)·embarrassment(당황)는 잘못 때문이 아닌 함정.","ex":[["She felt [[great guilt]] about lying.","그녀는 거짓말한 것에 [[큰 죄책감]]을 느꼈다."],["He could not hide [[his guilt]].","그는 [[자신의 죄책감]]을 숨길 수 없었다."],["[[Guilt]] kept him awake all night.","[[죄책감]] 때문에 그는 밤새 깨어 있었다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"firm","a":"firm","e":"firm (형) 단단한, 확고한 / (명) 회사","k":"밧줄을 단단히 잡아라, 그렇지 않으면 배가 부두에서 떠내려갈 것이다.\n해외에서 10년을 보낸 뒤, 그녀는 농부들에게 새로운 기술에 관해 조언하는 작은 회사에 합류했다.","m":0,"s":"Keep a f______ grip on the rope, or the boat will drift away from the dock.\nAfter ten years abroad, she joined a small f______ that advises farmers on new technology.","mn":"단단한, 확고한 / 회사","hk":"firm(단단한, 회사)은 품사에 따라 뜻이 갈림. 밧줄을 꽉 잡는 장면은 형용사 단단한, 사람들이 일하는 곳은 명사 회사.","ex":[["He kept [[a firm grip]] on the rope.","그는 밧줄을 [[단단히 잡았다]].","firm (형) 단단한, 확고한"],["He gave [[a firm answer]].","그는 [[단호한 대답]]을 했다.","firm (형) 단단한, 확고한"],["My uncle works for [[a law firm]].","삼촌은 [[법률 회사]]에서 일한다.","firm (명) 회사"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"fragile","a":"1","e":"① fragile: 부서지기 쉬운","w":"② sturdy: 튼튼한\n③ elastic: 신축성 있는\n④ waterproof: 방수가 되는","m":0,"s":"fragile","c":["부서지기 쉬운","튼튼한","신축성 있는","방수가 되는"],"mn":"부서지기 쉬운","hk":"fragile(부서지기 쉬운)는 택배 상자에 붙는 취급 주의 단어. sturdy(튼튼한)는 반대편, elastic(신축성 있는)·waterproof(방수가 되는)는 다른 성질 함정.","ex":[["Be careful with [[the fragile glass]].","[[깨지기 쉬운 유리]]를 조심해라."],["The old bridge is [[too fragile]].","그 낡은 다리는 [[너무 부서지기 쉽다]]."],["These cups are [[fragile]], so handle them gently.","이 컵들은 [[깨지기 쉬우니]] 살살 다뤄라."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"violent","a":"4","e":"violent (형) 폭력적인, 격렬한 - violence (명) 폭력\n④ absent (형) 결석한, 자리에 없는 - absence (명) 부재, 결석","w":"① recover (동) 회복하다 - recovery (명) 회복\n② withdraw (동) 인출하다, 철수하다 - withdrawal (명) 인출, 철수\n③ depart (동) 출발하다, 떠나다 - departure (명) 출발","m":0,"s":"violent - violence","c":["recover - recovery","withdraw - withdrawal","depart - departure","absent - absence"],"mn":"폭력적인, 격렬한","hk":"violent(폭력적인)→violence(폭력)는 형용사에서 명사. 정답 absent(결석한)→absence(결석)도 형용사→명사, 나머지는 동사에서 명사 함정.","ex":[["The movie has [[violent scenes]].","그 영화에는 [[폭력적인 장면]]이 있다.","violent (형) 폭력적인, 격렬한"],["We must stop [[school violence]].","우리는 [[학교 폭력]]을 막아야 한다.","violence (명) 폭력"],["He was [[absent from]] school today.","그는 오늘 학교에 [[결석했다]].","absent (형) 결석한, 자리에 없는"],["Her [[absence from class]] worried us.","[[수업 결석]]이 우리를 걱정시켰다.","absence (명) 부재, 결석"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"dispute","a":"3","e":"③ dispute: 논쟁, 분쟁","w":"① discussion: 논의, 토론\n② protest: 항의, 시위\n④ negotiation: 협상","m":0,"s":"\"논쟁, 분쟁\"","c":["discussion","protest","dispute","negotiation"],"mn":"논쟁, 분쟁","hk":"dispute(논쟁, 분쟁)는 의견이나 이익이 부딪혀 다투는 일. discussion(논의)은 차분한 대화, protest(항의)·negotiation(협상)은 다른 활동 함정.","ex":[["The two countries are in [[a dispute]] over land.","두 나라는 땅을 두고 [[분쟁]] 중이다."],["They settled [[the dispute]] peacefully.","그들은 [[그 분쟁]]을 평화롭게 해결했다."],["[[A long dispute]] ended last week.","[[오랜 분쟁]]이 지난주에 끝났다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"property","a":"1","e":"①속성, 성질 / ②재산 / ③재산 / ④재산 [①번만 의미가 다름]","k":"①소금은 물의 어는점을 낮추는 성질을 가지고 있다.\n②누군가 밤에 그 마당에 들어와 사유 재산을 훼손했다.\n③그 노인은 자신의 모든 재산을 막내딸에게 남겼다.\n④재판이 끝난 뒤, 두 형제는 재산을 똑같이 나누었다.","m":0,"c":["Salt has the property of lowering the freezing point of water.","Someone entered the yard at night and damaged private property.","The old man left all his property to his youngest daughter.","After the trial,
