"ko":"파란색 식물들은 매우 ( ) 때문에 연구 관심을 가장 많이 받았다.","opts":["흔한","드문","큰","비싼"],"word":"rare","r":{"a":"2) 드문","ev":"4번, 7번 문장","s":[[4,"Blue plants received the most research attention because they’re very rare.","파란색 식물들은 매우 드물기 때문에 연구 관심을 가장 많이 받았다."],[7,"For instance, in Australia, milkweed is an important food source for butterflies, and the grassy mat rushes are homes for the rare sun moth.","예를 들어, 호주에서 박주가리는 나비들에게 중요한 식량원이고, 풀이 무성한 니염토는 희귀한 태양 나방의 서식지이다."]],"w":"4번은 파란색 식물이 흔하지 않아서 오히려 관심을 가장 많이 받았다는 말. rare = 드문. 7번의 the rare sun moth(희귀한 태양 나방)도 같은 뜻. 흔한은 반대 뜻.","c":2},"h":"b7a6f01c17"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, some “ugly” plants deserve more attention for their role in nature.)","ko":"하지만, 일부 ‘못생긴’ 식물들은 자연에서의 역할 때문에 더 많은 관심을 ( ).","opts":["~을 받을 만하다","~을 피하다","~을 잃다","~을 바꾸다"],"word":"deserve","r":{"a":"1) ~을 받을 만하다","ev":"6번 문장","s":[[6,"However, some “ugly” plants deserve more attention for their role in nature.","하지만, 일부 ‘못생긴’ 식물들은 자연에서의 역할 때문에 더 많은 관심을 받을 만하다."]],"w":"6번 However 뒤에서 못생긴 식물도 자연에서 중요한 역할을 하므로 더 많은 관심을 ‘받을 자격이 있다’는 말. deserve = ~을 받을 만하다. 피하거나 잃는다는 뜻은 문장 흐름과 맞지 않음.","c":1},"h":"1de7fc16da"},{"n":6,"t":"ref","q":"What does the underlined “these plants” refer to?\nDespite their importance, these plants often get less attention from scientists due to their appearance.","ko":"밑줄 친 these plants가 가리키는 것은?","sko":"그것들의 중요성에도 불구하고, 이 식물들은 겉모습 때문에 과학자들로부터 종종 더 적은 관심을 받는다.","opts":["파란색 식물들","흰색, 빨간색, 분홍색 꽃들","박주가리와 니염토 같은 ‘못생긴’ 식물들","집 주변에 심은 모든 식물들"],"r":{"a":"3) 박주가리와 니염토 같은 ‘못생긴’ 식물들","ev":"6~8번 문장","s":[[6,"However, some “ugly” plants deserve more attention for their role in nature.","하지만, 일부 ‘못생긴’ 식물들은 자연에서의 역할 때문에 더 많은 관심을 받을 만하다."],[7,"For instance, in Australia, milkweed is an important food source for butterflies, and the grassy mat rushes are homes for the rare sun moth.","예를 들어, 호주에서 박주가리는 나비들에게 중요한 식량원이고, 풀이 무성한 니염토는 희귀한 태양 나방의 서식지이다."],[8,"Despite their importance, these plants often get less attention from scientists due to their appearance.","그것들의 중요성에도 불구하고, 이 식물들은 겉모습 때문에 과학자들로부터 종종 더 적은 관심을 받는다."]],"w":"8번은 Despite their importance(중요성에도 불구하고)로 시작하는데, 바로 앞 7번에서 중요한 역할을 한다고 소개한 박주가리와 니염토를 가리킴. 파란색·흰색·빨간색·분홍색 식물은 오히려 관심을 많이 받은 쪽이라 반대.","c":3},"h":"7a3e3a416a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Scientists can truly understand how important a species is only after thorough research.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"과학자들은 철저한 연구를 한 후에야 하나의 종이 얼마나 중요한지 진정으로 이해할 수 있다.","opts":["과학자들은 연구 없이도 종의 중요성을 알 수 있다.","중요한 종은 연구를 하면 사라진다.","과학자들은 종이 얼마나 중요한지 연구하기 전에만 이해할 수 있다.","철저한 연구를 한 뒤에야 과학자들은 한 종이 얼마나 중요한지 진정으로 이해할 수 있다."],"r":{"a":"4) 철저한 연구를 한 뒤에야 과학자들은 한 종이 얼마나 중요한지 진정으로 이해할 수 있다.","ev":"9번 문장","s":[[9,"Scientists can truly understand how important a species is only after thorough research.","과학자들은 철저한 연구를 한 후에야 하나의 종(種)이 얼마나 중요한지 진정으로 이해할 수 있다."]],"w":"only after thorough research는 ‘철저한 연구를 한 뒤에야’라는 뜻이라 연구가 먼저, 이해가 나중. 연구 없이 안다거나 연구 전에만 안다는 선지는 순서가 반대이고, 사라진다는 말은 본문에 없음.","c":4},"h":"0a653f2dc6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["파란색 식물은 흔해서 가장 많이 연구되었다.","호주에서 풀이 무성한 니염토는 희귀한 태양 나방의 서식지이다.","못생긴 식물들은 중요하지 않아서 연구되지 않는다.","초록색과 갈색 식물들이 흰색, 빨간색, 분홍색 꽃들보다 더 많이 연구되었다."],"opts":["Blue plants were studied the most because they are common.","In Australia, the grassy mat rushes are homes for the rare sun moth.","Ugly plants are not studied because they are not important.","Green and brown plants were studied more than white, red, and pink flowers."],"r":{"a":"2) In Australia, the grassy mat rushes are homes for the rare sun moth.","ev":"3~4번, 7~8번 문장","s":[[3,"White, red, and pink flowers were studied more than green and brown ones.","흰색, 빨간색, 분홍색 꽃들이 초록색과 갈색 식물들보다 더 많이 연구되었다."],[4,"Blue plants received the most research attention because they’re very rare.","파란색 식물들은 매우 드물기 때문에 연구 관심을 가장 많이 받았다."],[7,"For instance, in Australia, milkweed is an important food source for butterflies, and the grassy mat rushes are homes for the rare sun moth.","예를 들어, 호주에서 박주가리는 나비들에게 중요한 식량원이고, 풀이 무성한 니염토는 희귀한 태양 나방의 서식지이다."],[8,"Despite their importance, these plants often get less attention from scientists due to their appearance.","그것들의 중요성에도 불구하고, 이 식물들은 겉모습 때문에 과학자들로부터 종종 더 적은 관심을 받는다."]],"w":"7번에서 호주의 풀이 무성한 니염토는 희귀한 태양 나방의 집이라고 함. 파란색은 드물어서 많이 연구됐고(4번), 못생긴 식물은 중요한데도 덜 연구되며(8번), 초록색·갈색은 흰색·빨간색·분홍색보다 덜 연구됐으므로(3번) 나머지는 모두 본문과 다름.","c":2},"h":"0a6148caf4"},{"n":9,"t":"sum","q":"Blue plants received the most research attention because they are very (A), while green and brown plants received (B) attention.","ko":"파란색 식물들은 (A) 식물이기 때문에 연구 관심을 가장 많이 받았고, 초록색과 갈색 식물들은 (B) 관심을 받았다.","oko":["(A) 흔한 / (B) 더 많은","(A) 드문 / (B) 더 많은","(A) 못생긴 / (B) 더 많은","(A) 흔한 / (B) 더 적은","(A) 드문 / (B) 더 적은"],"opts":["(A) common / (B) more","(A) rare / (B) more","(A) ugly / (B) more","(A) common / (B) less","(A) rare / (B) less"],"r":{"a":"5) (A) rare / (B) less","ev":"3~4번 문장","s":[[3,"White, red, and pink flowers were studied more than green and brown ones.","흰색, 빨간색, 분홍색 꽃들이 초록색과 갈색 식물들보다 더 많이 연구되었다."],[4,"Blue plants received the most research attention because they’re very rare.","파란색 식물들은 매우 드물기 때문에 연구 관심을 가장 많이 받았다."]],"w":"4번에서 파란색 식물은 very rare(매우 드묾)라서 가장 많은 관심을 받았고, 3번에서 초록색과 갈색 식물은 흰색·빨간색·분홍색 꽃보다 덜 연구되었으므로 less. common이나 more로 바꾼 선지는 본문과 반대.","c":5},"h":"ed93d5db41"},{"n":10,"t":"fill","q":"Milkweed is an important food source for [A], but these plants often get less attention due to their [B].","ko":"박주가리는 [A]에게 중요한 식량원이지만, 이 식물들은 그들의 [B] 때문에 종종 더 적은 관심을 받는다.","bko":{"butterflies":"나비들","appearance":"겉모습, 외관","homes":"집들","rare":"드문","thorough":"철저한","deserve":"~을 받을 만하다"},"bank":["butterflies","appearance","homes","rare","thorough","deserve"],"r":{"a":"[A] butterflies, [B] appearance","ev":"7~8번 문장","s":[[7,"For instance, in Australia, milkweed is an important food source for butterflies, and the grassy mat rushes are homes for the rare sun moth.","예를 들어, 호주에서 박주가리는 나비들에게 중요한 식량원이고, 풀이 무성한 니염토는 희귀한 태양 나방의 서식지이다."],[8,"Despite their importance, these plants often get less attention from scientists due to their appearance.","그것들의 중요성에도 불구하고, 이 식물들은 겉모습 때문에 과학자들로부터 종종 더 적은 관심을 받는다."]],"w":"7번에서 박주가리는 butterflies(나비들)의 식량원이고, 8번에서 due to their appearance(겉모습 때문에) 관심을 덜 받는다고 함. homes(집들)는 니염토 이야기라 박주가리의 식량원이 아니고 겉모습 때문에 관심이 적은 것도 아님. rare(드문)·thorough(철저한)는 형용사, deserve(~을 받을 만하다)는 동사라서 이 빈칸들에 들어갈 수 없음.","c":null},"h":"40a671cb79"}]},{"u":6,"id":"rg4-06-1","no":1,"ko":"가장 달콤한 도시와 중력이 사라지는 도시","items":[{"n":1,"t":"tf","q":"The best slogans tell a story in a few powerful words.","ko":"최고의 슬로건은 몇 개의 강력한 단어로 이야기를 들려준다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The best slogans tell a story in a few powerful words.","최고의 슬로건은 몇 개의 강력한 단어로 이야기를 들려준다."]],"w":"2번 문장에 The best slogans tell a story in a few powerful words가 그대로 나옴. T.","c":"T"},"h":"e5fe514c00"},{"n":2,"t":"tf","q":"All city slogans are created by the city to attract tourists.","ko":"모든 도시 슬로건은 관광객을 끌어모으기 위해 시에 의해 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Some slogans are created by the city to attract tourists, while others are created by residents who noticed something interesting about the city life.","일부 슬로건은 관광객을 끌어모으기 위해 시(市)에 의해 만들어지는 반면, 다른 슬로건은 도시 생활에 대해 흥미로운 점을 알아차린 주민들에 의해 만들어진다."]],"w":"3번에서 일부 슬로건은 시가 관광객을 끌려고 만들지만(Some), 다른 슬로건(others)은 흥미로운 점을 알아차린 주민들이 만든다고 함. ‘모든’ 슬로건이 아니라서 F.","c":"F"},"h":"fa286e8f52"},{"n":3,"t":"tf","q":"“Down to earth” actually means being practical.","ko":"‘Down to earth’는 실제로는 현실적인 것을 의미한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"They played on the words “down to earth,” which actually means being practical, and the word “gravity.”","그들은 실제로는 현실적인 것을 의미하는 ‘down to earth’라는 말과 ‘gravity’라는 단어에 말장난을 쳤다."]],"w":"11번 문장에 down to earth, which actually means being practical이 나옴. 같은 내용이라 T.","c":"T"},"h":"1195cba953"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... others are created by residents who noticed something interesting about the city life.)","ko":"... 다른 슬로건은 도시 생활에 대해 흥미로운 점을 알아차린 ( )에 의해 만들어진다.","opts":["관광객들","주민들","시장들","학생들"],"word":"residents","r":{"a":"2) 주민들","ev":"3~4번 문장","s":[[3,"Some slogans are created by the city to attract tourists, while others are created by residents who noticed something interesting about the city life.","일부 슬로건은 관광객을 끌어모으기 위해 시(市)에 의해 만들어지는 반면, 다른 슬로건은 도시 생활에 대해 흥미로운 점을 알아차린 주민들에 의해 만들어진다."],[4,"What residents call the city can sometimes tell more about it.","주민들이 도시를 어떻게 부르는지는 때때로 그것에 대해 더 많은 것을 알려 줄 수 있다."]],"w":"3번에서 residents는 시(the city)와 짝을 이루는, 도시 생활을 직접 아는 사람들. 4번에서도 주민들이 도시를 부르는 이름을 말함. residents = 주민들. 관광객은 슬로건으로 끌어오는 대상이라 다름.","c":2},"h":"34273c1b62"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Some cities have used humor to celebrate their unique features and attractions.)","ko":"어떤 도시들은 독특한 특징과 명소를 ( ) 위해 유머를 사용해 왔다.","opts":["기념하다","숨기다","바꾸다","비교하다"],"word":"celebrate","r":{"a":"1) 기념하다","ev":"5번 문장","s":[[5,"Some cities have used humor to celebrate their unique features and attractions.","어떤 도시들은 독특한 특징과 명소를 기념하기 위해 유머를 사용해 왔다."]],"w":"5번은 도시가 자기만의 독특한 특징과 명소를 유머로 자랑스럽게 드러낸다는 말. celebrate = 기념하다, 축하하다. 숨기거나 바꾸면 특징을 알리려는 슬로건의 목적과 맞지 않음.","c":1},"h":"de8466ab90"},{"n":6,"t":"ref","q":"What does the underlined “They” refer to?\nThey played on the words “down to earth,” which actually means being practical, and the word “gravity.”","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 실제로는 현실적인 것을 의미하는 ‘down to earth’라는 말과 ‘gravity’라는 단어에 말장난을 쳤다.","opts":["허쉬 초콜릿 공장 사람들","관광객들","도시 정부 사람들","아이오와주 그래비티의 사람들"],"r":{"a":"4) 아이오와주 그래비티의 사람들","ev":"10~11번 문장","s":[[10,"People in Gravity, Iowa use the slogan “We’re Down to Earth. If Gravity Goes, We All Go.”","아이오와주에 있는 그래비티의 사람들은 “우리는 현실적이다(또는 지구에 내디뎠다). 그래비티(또는 중력)가 사라지면 우리 모두 사라진다.”라는 슬로건을 사용한다."],[11,"They played on the words “down to earth,” which actually means being practical, and the word “gravity.”","그들은 실제로는 현실적인 것을 의미하는 ‘down to earth’라는 말과 ‘gravity’라는 단어에 말장난을 쳤다."]],"w":"10번에서 슬로건 “We’re Down to Earth. If Gravity Goes, We All Go.”를 쓰는 사람들이 People in Gravity, Iowa. 11번의 They는 그 슬로건으로 말장난을 한 그래비티의 사람들. 허쉬는 7~9번의 다른 도시.","c":4},"h":"a6816a58e5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"What residents call the city can sometimes tell more about it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"주민들이 도시를 어떻게 부르는지는 때때로 그것에 대해 더 많은 것을 알려 줄 수 있다.","opts":["도시가 주민들을 부르는 이름은 때때로 주민에 대해 더 많이 알려 준다.","주민들은 도시를 절대 다른 이름으로 부르지 않는다.","주민들이 도시를 부르는 이름이 때로는 그 도시에 대해 더 많은 것을 알려 줄 수 있다.","도시에 대해 더 알고 싶으면 주민들을 직접 불러야 한다."],"r":{"a":"3) 주민들이 도시를 부르는 이름이 때로는 그 도시에 대해 더 많은 것을 알려 줄 수 있다.","ev":"3~4번 문장","s":[[3,"Some slogans are created by the city to attract tourists, while others are created by residents who noticed something interesting about the city life.","일부 슬로건은 관광객을 끌어모으기 위해 시(市)에 의해 만들어지는 반면, 다른 슬로건은 도시 생활에 대해 흥미로운 점을 알아차린 주민들에 의해 만들어진다."],[4,"What residents call the city can sometimes tell more about it.","주민들이 도시를 어떻게 부르는지는 때때로 그것에 대해 더 많은 것을 알려 줄 수 있다."]],"w":"What residents call the city는 ‘주민들이 도시를 부르는 것(이름)’. 부르는 쪽은 주민, 대상은 도시이고, tell more about it의 it도 도시. 주체와 대상이 바뀐 선지나 본문에 없는 내용은 오답.","c":3},"h":"2e09204293"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["허쉬는 아이오와주에 있다.","허쉬의 슬로건은 ‘지구상에서 가장 달콤한 곳’이다.","그래비티는 펜실베이니아주에 있다.","모든 도시 슬로건은 관광객들이 만든다."],"opts":["Hershey is in Iowa.","The slogan of Hershey is “The Sweetest Place On Earth.”","Gravity is in Pennsylvania.","All city slogans are created by tourists."],"r":{"a":"2) The slogan of Hershey is “The Sweetest Place On Earth.”","ev":"3번, 7번, 10번 문장","s":[[3,"Some slogans are created by the city to attract tourists, while others are created by residents who noticed something interesting about the city life.","일부 슬로건은 관광객을 끌어모으기 위해 시(市)에 의해 만들어지는 반면, 다른 슬로건은 도시 생활에 대해 흥미로운 점을 알아차린 주민들에 의해 만들어진다."],[7,"The slogan of Hershey, Pennsylvania is “The Sweetest Place On Earth.”","펜실베이니아주에 있는 허쉬의 슬로건은 “지구상에서 가장 달콤한 곳”이다."],[10,"People in Gravity, Iowa use the slogan “We’re Down to Earth. If Gravity Goes, We All Go.”","아이오와주에 있는 그래비티의 사람들은 “우리는 현실적이다(또는 지구에 내디뎠다). 그래비티(또는 중력)가 사라지면 우리 모두 사라진다.”라는 슬로건을 사용한다."]],"w":"7번에서 허쉬의 슬로건은 ‘The Sweetest Place On Earth’. 허쉬는 펜실베이니아주(7번), 그래비티는 아이오와주(10번), 슬로건은 시나 주민이 만든다(3번)라서 나머지는 모두 본문과 다름.","c":2},"h":"b15192a910"},{"n":9,"t":"sum","q":"The best slogans tell a (A) in a few powerful words, and some slogans are created by the city while others are created by (B).","ko":"최고의 슬로건은 몇 개의 강력한 단어로 (A)를 들려주고, 어떤 슬로건은 시가, 다른 슬로건은 (B)이(가) 만든다.","oko":["(A) 이야기 / (B) 관광객","(A) 농담 / (B) 주민","(A) 이야기 / (B) 주민","(A) 노래 / (B) 관광객","(A) 농담 / (B) 관광객"],"opts":["(A) story / (B) tourists","(A) joke / (B) residents","(A) story / (B) residents","(A) song / (B) tourists","(A) joke / (B) tourists"],"r":{"a":"3) (A) story / (B) residents","ev":"2~3번 문장","s":[[2,"The best slogans tell a story in a few powerful words.","최고의 슬로건은 몇 개의 강력한 단어로 이야기를 들려준다."],[3,"Some slogans are created by the city to attract tourists, while others are created by residents who noticed something interesting about the city life.","일부 슬로건은 관광객을 끌어모으기 위해 시(市)에 의해 만들어지는 반면, 다른 슬로건은 도시 생활에 대해 흥미로운 점을 알아차린 주민들에 의해 만들어진다."]],"w":"2번에서 최고의 슬로건은 a story를 들려주고, 3번에서 일부는 시, others는 residents가 만든다고 함. 관광객은 슬로건으로 끌어오려는 대상이지 만든 사람이 아니고, joke·song은 본문에 없는 말.","c":3},"h":"6225ba1db8"},{"n":10,"t":"fill","q":"Gravity’s slogan plays on the words “down to [A]” and “gravity,” and city slogans show the [B] identities and creativity of the people who live there.","ko":"그래비티의 슬로건은 ‘down to [A]’와 ‘gravity’라는 말로 말장난을 하고, 도시 슬로건들은 그곳에 사는 사람들의 [B] 정체성과 창의성을 보여 준다.","bko":{"earth":"지구, 땅","unique":"독특한","slogan":"슬로건","humor":"유머","tourists":"관광객들","chocolate":"초콜릿"},"bank":["earth","unique","slogan","humor","tourists","chocolate"],"r":{"a":"[A] earth, [B] unique","ev":"11~12번 문장","s":[[11,"They played on the words “down to earth,” which actually means being practical, and the word “gravity.”","그들은 실제로는 현실적인 것을 의미하는 ‘down to earth’라는 말과 ‘gravity’라는 단어에 말장난을 쳤다."],[12,"These city slogans show the unique identities and creativity of the people who live there.","이러한 도시 슬로건들은 그곳에 사는 사람들의 독특한 정체성과 창의성을 보여 준다."]],"w":"11번에서 말장난에 쓴 말은 “down to earth”와 “gravity”이고, 12번에서 슬로건은 사람들의 unique(독특한) identities and creativity를 보여 준다고 함. slogan(슬로건)·humor(유머)·tourists(관광객들)·chocolate(초콜릿)는 명사라서 ‘독특한’ 자리에 들어갈 수 없고, ‘down to ~’ 자리에도 맞지 않음.","c":null},"h":"89b7e6d90b"}]},{"u":6,"id":"rg4-06-2","no":2,"ko":"쌍둥이 3,000쌍이 모이는 마을 축제","items":[{"n":1,"t":"tf","q":"About 3,000 pairs of twins from around the world gather at Twins Days.","ko":"전 세계에서 온 약 3,000쌍의 쌍둥이들이 Twins Days에 모인다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It gathers about 3,000 pairs of twins from around the world.","그것은 전 세계에서 약 3,000쌍의 쌍둥이들을 모은다."]],"w":"2번 문장에 It gathers about 3,000 pairs of twins from around the world라고 나옴. 같은 내용이라 T.","c":"T"},"h":"f886f90e33"},{"n":2,"t":"tf","q":"The town of Twinsburg was named after a scientist who studied twins.","ko":"Twinsburg 마을은 쌍둥이를 연구한 과학자의 이름을 따서 지어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"The town is named after twin brothers who helped make the town.","그 마을은 그것을 만드는 것을 도운 쌍둥이 형제의 이름을 따서 지어졌다."]],"w":"3번 문장에서 마을은 마을을 만드는 것을 도운 twin brothers(쌍둥이 형제)의 이름을 따서 지어졌다고 함. 쌍둥이를 연구한 과학자는 본문에 나오지 않아 F.","c":"F"},"h":"25be21f25b"},{"n":3,"t":"tf","q":"Twins join contests, parades, talent shows, and group photos.","ko":"쌍둥이들은 대회, 퍼레이드, 장기 자랑, 그리고 단체 사진에 참여한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They join contests, parades, talent shows, and group photos.","그들은 대회, 퍼레이드, 장기 자랑, 그리고 단체 사진에 참여한다."]],"w":"6번 문장에 They join contests, parades, talent shows, and group photos가 그대로 나옴. T.","c":"T"},"h":"e696bc47ae"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It gathers about 3,000 pairs of twins from around the world.)","ko":"그것은 전 세계에서 약 3,000쌍의 쌍둥이들을 ( ).","opts":["나눈다","보낸다","모은다","숨긴다"],"word":"gathers","r":{"a":"3) 모은다","ev":"2번 문장","s":[[2,"It gathers about 3,000 pairs of twins from around the world.","그것은 전 세계에서 약 3,000쌍의 쌍둥이들을 모은다."]],"w":"2번은 전 세계에서 약 3,000쌍의 쌍둥이가 Twins Days로 온다는 말이라 gathers = 모은다. 4번에서 36쌍이 3,000쌍으로 성장했다는 흐름과도 이어짐. 나누거나 숨긴다는 뜻이 아님.","c":3},"h":"8bf3e55c88"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (During the festival, twins dress the same and participate in various activities.)","ko":"축제 동안, 쌍둥이들은 똑같이 옷을 입고 다양한 활동에 ( ).","opts":["참여하다","구경하다","거절하다","끝내다"],"word":"participate","r":{"a":"1) 참여하다","ev":"5~6번, 9번 문장","s":[[5,"During the festival, twins dress the same and participate in various activities.","축제 동안, 쌍둥이들은 똑같이 옷을 입고 다양한 활동에 참여한다."],[6,"They join contests, parades, talent shows, and group photos.","그들은 대회, 퍼레이드, 장기 자랑, 그리고 단체 사진에 참여한다."],[9,"Although they may line up for a long time to participate, twins enjoy the rewards and the chance to contribute to scientific research.","그들은 참여하기 위해 오랫동안 줄을 설 수도 있지만, 쌍둥이들은 보상과 과학 연구에 기여하는 기회를 즐긴다."]],"w":"5번에서 쌍둥이들이 다양한 활동에 참여하고, 6번에서 대회, 퍼레이드 등에 join한다고 설명함. 9번의 to participate도 같은 뜻. participate = 참여하다. 구경하거나 거절한다면 활동을 한다는 말과 맞지 않음.","c":1},"h":"e4fc59ec1d"},{"n":6,"t":"ref","q":"What does the underlined “They” refer to?\nThey may get a year’s worth of information in just four hours!","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 단 4시간 만에 1년 치의 정보를 얻을 수도 있다!","opts":["쌍둥이들","과학자들","축제 구경꾼들","마을 사람들"],"r":{"a":"2) 과학자들","ev":"10~11번 문장","s":[[10,"The scientists are also happy because this efficient process allows scientists to collect valuable data from a rare group.","과학자들은 이 효율적인 과정이 희귀한 집단으로부터 귀중한 자료를 모을 수 있게 해 주기 때문에 또한 행복하다."],[11,"They may get a year’s worth of information in just four hours!","그들은 단 4시간 만에 1년 치의 정보를 얻을 수도 있다!"]],"w":"10번에서 효율적인 과정으로 귀중한 자료를 모을 수 있게 된 쪽은 The scientists. 11번의 They는 그 과학자들이며, 자료와 정보를 얻는 사람은 과학자임. 쌍둥이들은 연구에 자원하는 쪽.","c":2},"h":"a5d733d99a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But there’s more to Twins Days than fun; it’s also an opportunity for scientific research.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 Twins Days에는 재미보다 더 중요한 것이 있는데, 그것은 또한 과학 연구를 위한 기회이다.","opts":["Twins Days는 재미가 전혀 없고 연구만 하는 행사이다.","Twins Days는 과학 연구 때문에 재미가 사라진 행사이다.","Twins Days에서 재미있는 것은 과학 연구뿐이다.","Twins Days는 재미뿐 아니라 과학 연구를 위한 기회이기도 하다."],"r":{"a":"4) Twins Days는 재미뿐 아니라 과학 연구를 위한 기회이기도 하다.","ev":"5~7번 문장","s":[[5,"During the festival, twins dress the same and participate in various activities.","축제 동안, 쌍둥이들은 똑같이 옷을 입고 다양한 활동에 참여한다."],[6,"They join contests, parades, talent shows, and group photos.","그들은 대회, 퍼레이드, 장기 자랑, 그리고 단체 사진에 참여한다."],[7,"But there’s more to Twins Days than fun; it’s also an opportunity for scientific research.","하지만 Twins Days에는 재미보다 더 중요한 것이 있는데, 그것은 또한 과학 연구를 위한 기회이다."]],"w":"there’s more to A than fun은 ‘A에는 재미 이상의 것이 있다’. 재미를 부정하는 것이 아니라 5~6번의 재미에 더해 또 하나(also)의 의미가 있다는 말. 재미가 없다·사라졌다는 선지는 본문과 다름.","c":4},"h":"c62fc0ff90"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Twins Days는 1976년에 3,000쌍의 쌍둥이로 시작했다.","쌍둥이들은 줄을 서야 해서 연구 참여를 즐기지 못한다.","과학자들은 이 과정 덕분에 희귀한 집단으로부터 귀중한 자료를 모을 수 있다.","Twinsburg 마을은 과학자의 이름을 따서 지어졌다."],"opts":["Twins Days began in 1976 with 3,000 pairs of twins.","Twins cannot enjoy the research because they have to line up.","This process allows scientists to collect valuable data from a rare group.","The town of Twinsburg was named after a scientist."],"r":{"a":"3) This process allows scientists to collect valuable data from a rare group.","ev":"3~4번, 9~10번 문장","s":[[3,"The town is named after twin brothers who helped make the town.","그 마을은 그것을 만드는 것을 도운 쌍둥이 형제의 이름을 따서 지어졌다."],[4,"The festival began in 1976 with just 36 pairs of twins and has grown fast since then.","그 축제는 1976년에 단 36쌍의 쌍둥이로 시작하여 그 이후로 빠르게 성장해 왔다."],[9,"Although they may line up for a long time to participate, twins enjoy the rewards and the chance to contribute to scientific research.","그들은 참여하기 위해 오랫동안 줄을 설 수도 있지만, 쌍둥이들은 보상과 과학 연구에 기여하는 기회를 즐긴다."],[10,"The scientists are also happy because this efficient process allows scientists to collect valuable data from a rare group.","과학자들은 이 효율적인 과정이 희귀한 집단으로부터 귀중한 자료를 모을 수 있게 해 주기 때문에 또한 행복하다."]],"w":"10번에서 효율적인 과정이 희귀한 집단으로부터 귀중한 자료를 모을 수 있게 해 준다고 함. 시작은 36쌍(4번), 쌍둥이들은 줄 서는 것을 감수하고 즐김(9번), 마을 이름은 쌍둥이 형제에게서 땄으므로(3번) 나머지는 모두 본문과 다름.","c":3},"h":"2a8261f6be"},{"n":9,"t":"sum","q":"During the festival, twins (A) the same and join various activities, and they also volunteer for (B) research.","ko":"축제 동안 쌍둥이들은 똑같이 (A) 다양한 활동에 참여하며, 또한 (B) 연구에 자원한다.","oko":["(A) 노래하고 / (B) 요리","(A) 옷을 입고 / (B) 요리","(A) 먹고 / (B) 과학","(A) 옷을 입고 / (B) 과학","(A) 노래하고 / (B) 과학"],"opts":["(A) sing / (B) cooking","(A) dress / (B) cooking","(A) eat / (B) scientific","(A) dress / (B) scientific","(A) sing / (B) scientific"],"r":{"a":"4) (A) dress / (B) scientific","ev":"5번, 7~8번 문장","s":[[5,"During the festival, twins dress the same and participate in various activities.","축제 동안, 쌍둥이들은 똑같이 옷을 입고 다양한 활동에 참여한다."],[7,"But there’s more to Twins Days than fun; it’s also an opportunity for scientific research.","하지만 Twins Days에는 재미보다 더 중요한 것이 있는데, 그것은 또한 과학 연구를 위한 기회이다."],[8,"In a large tent, twins volunteer for studies that help scientists learn about topics such as genetics and aging.","커다란 텐트에서, 쌍둥이들은 유전학과 노화와 같은 주제에 관해 과학자들이 배울 수 있도록 도와주는 연구에 자원한다."]],"w":"5번에서 twins dress the same(똑같이 옷을 입는다), 7~8번에서 scientific research를 위해 자원한다고 함. 그래서 dress와 scientific. sing, eat, cooking은 본문에 나오지 않는 말.","c":4},"h":"118ee56225"},{"n":10,"t":"fill","q":"This efficient process allows scientists to collect valuable data from a [A] group, and they may get a year’s worth of information in just four [B].","ko":"이 효율적인 과정은 과학자들이 [A] 집단으로부터 귀중한 자료를 모을 수 있게 해 주며, 그들은 단 4[B] 만에 1년 치의 정보를 얻을 수도 있다.","bko":{"rare":"희귀한","hours":"시간","twins":"쌍둥이","years":"해, 년","collect":"모으다","festival":"축제"},"bank":["rare","hours","twins","years","collect","festival"],"r":{"a":"[A] rare, [B] hours","ev":"10~11번 문장","s":[[10,"The scientists are also happy because this efficient process allows scientists to collect valuable data from a rare group.","과학자들은 이 효율적인 과정이 희귀한 집단으로부터 귀중한 자료를 모을 수 있게 해 주기 때문에 또한 행복하다."],[11,"They may get a year’s worth of information in just four hours!","그들은 단 4시간 만에 1년 치의 정보를 얻을 수도 있다!"]],"w":"10번에서 과학자들은 a rare(희귀한) group에서 자료를 모으고, 11번에서 단 four hours(4시간) 만에 1년 치 정보를 얻는다고 함. years(해, 년)는 ‘1년 치’와 헷갈리게 만든 함정이고, twins(쌍둥이)·festival(축제)은 ‘희귀한’ 자리에 맞지 않으며, collect(모으다)는 동사라서 ‘a ~ group’ 사이에 들어갈 수 없음.","c":null},"h":"30ce476903"}]},{"u":6,"id":"rg4-06-3","no":3,"ko":"붕대 없이 발견된 2,500년 된 악어 미라","items":[{"n":1,"t":"tf","q":"The crocodile mummies might be over 2,500 years old.","ko":"그 악어 미라들은 2,500년 이상 되었을지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They might be over 2,500 years old but were in great shape.","그것들은 2,500년 이상 되었을지도 모르지만 상태가 아주 좋았다."]],"w":"2번 문장에 They might be over 2,500 years old가 나옴. 같은 내용이라 T.","c":"T"},"h":"2e91f04b97"},{"n":2,"t":"tf","q":"Like most mummies, the crocodile mummies were wrapped in bandages.","ko":"대부분의 미라처럼, 그 악어 미라들도 붕대로 싸여 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Most mummies are wrapped in bandages, but these crocodiles weren’t.","대부분의 미라는 붕대로 싸여 있지만, 이 악어들은 그렇지 않았다."]],"w":"3번에서 대부분의 미라는 붕대로 싸여 있지만 these crocodiles weren’t(이 악어들은 그렇지 않았다)라고 함. 다른 점이 핵심이라 F.","c":"F"},"h":"2fd35adad5"},{"n":3,"t":"tf","q":"Ancient Egyptians asked Sobek to give good soil for their crops.","ko":"고대 이집트인들은 Sobek에게 농작물을 위한 좋은 토양을 달라고 요청했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Ancient Egyptians asked Sobek to give good soil for their crops and to keep them safe from dangerous reptiles.","고대 이집트인들은 Sobek에게 농작물을 위한 좋은 토양을 제공해 주고 위험한 파충류로부터 그들을 안전하게 보호해 주기를 요청했다."]],"w":"8번 문장에 Ancient Egyptians asked Sobek to give good soil for their crops가 나옴. 같은 내용이라 T.","c":"T"},"h":"cfb1858588"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Experts recently discovered ten crocodile mummies near the Nile River in Egypt.)","ko":"전문가들이 최근에 이집트 나일강 근처에서 악어 미라 열 구를 ( ).","opts":["잃어버렸다","발견했다","만들었다","팔았다"],"word":"discovered","r":{"a":"2) 발견했다","ev":"1번, 11번 문장","s":[[1,"Experts recently discovered ten crocodile mummies near the Nile River in Egypt.","전문가들이 최근에 이집트 나일강 근처에서 악어 미라 열 구를 발견했다."],[11,"This discovery gives us a new understanding of the ancient Egyptian religion and how these animals were used as offerings.","이 발견은 우리에게 고대 이집트의 종교와 이 동물들이 제물로 어떻게 사용되었는지에 대한 새로운 이해를 준다."]],"w":"1번에서 전문가들이 악어 미라를 찾아냈다는 말이고, 11번에서도 This discovery(이 발견)로 이어짐. discovered = 발견했다. 잃어버리거나 만든 것이 아니라 이미 있던 것을 찾아낸 것.","c":2},"h":"0bd0f49d3c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... or he might not answer their requests.)","ko":"... 그렇지 않으면 그가 그들의 ( )을 들어주지 않을지도 모른다.","opts":["명령","대답","요청","약속"],"word":"requests","r":{"a":"3) 요청","ev":"8~9번 문장","s":[[8,"Ancient Egyptians asked Sobek to give good soil for their crops and to keep them safe from dangerous reptiles.","고대 이집트인들은 Sobek에게 농작물을 위한 좋은 토양을 제공해 주고 위험한 파충류로부터 그들을 안전하게 보호해 주기를 요청했다."],[9,"They believed they had to give him something, or he might not answer their requests.","그들은 자신들이 그에게 무언가를 바쳐야 하며, 그렇지 않으면 그가 그들의 요청을 들어주지 않을지도 모른다고 믿었다."]],"w":"8번에서 이집트인들이 Sobek에게 좋은 토양과 안전을 asked(부탁했다)고 하고, 9번의 requests는 그 부탁들. requests = 요청. 신이 이집트인에게 내리는 명령이 아니라 이집트인이 신에게 하는 것.","c":3},"h":"6fe57eddb9"},{"n":6,"t":"ref","q":"What does the underlined “This” refer to?\nThis allowed the researchers to study them right away without using special technology.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 연구원들이 특별한 기술을 사용하지 않고 바로 그것들을 연구할 수 있게 했다.","opts":["악어 미라들이 나일강 근처에서 발견되었다는 것","연구원들이 특별한 기술을 가지고 있다는 것","악어 미라들이 2,500년 이상 되었다는 것","악어 미라들이 붕대로 싸여 있지 않았다는 것"],"r":{"a":"4) 악어 미라들이 붕대로 싸여 있지 않았다는 것","ev":"3~4번 문장","s":[[3,"Most mummies are wrapped in bandages, but these crocodiles weren’t.","대부분의 미라는 붕대로 싸여 있지만, 이 악어들은 그렇지 않았다."],[4,"This allowed the researchers to study them right away without using special technology.","이것은 연구원들이 특별한 기술을 사용하지 않고 바로 그것들을 연구할 수 있게 했다."]],"w":"4번의 This allowed ...는 바로 앞 3번의 내용을 가리킴: 이 악어들은 붕대로 싸여 있지 않았다. 붕대가 없어서 특별한 기술 없이 바로 연구할 수 있었다는 흐름. 위치(1번)나 나이(2번)는 연구를 쉽게 해 준 이유가 아님.","c":4},"h":"9b7fcceb61"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They believed they had to give him something, or he might not answer their requests.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 자신들이 그에게 무언가를 바쳐야 하며, 그렇지 않으면 그가 그들의 요청을 들어주지 않을지도 모른다고 믿었다.","opts":["그에게 무언가를 바치지 않으면 그가 요청을 들어주지 않을지도 모른다고 믿었다.","그에게 무언가를 바치면 요청이 반드시 거절된다고 믿었다.","요청을 들어주고 나면 그에게 무언가를 바쳐야 한다고 믿었다.","그가 무언가를 주지 않으면 사람들이 요청하지 않을 것이라고 믿었다."],"r":{"a":"1) 그에게 무언가를 바치지 않으면 그가 요청을 들어주지 않을지도 모른다고 믿었다.","ev":"8~9번 문장","s":[[8,"Ancient Egyptians asked Sobek to give good soil for their crops and to keep them safe from dangerous reptiles.","고대 이집트인들은 Sobek에게 농작물을 위한 좋은 토양을 제공해 주고 위험한 파충류로부터 그들을 안전하게 보호해 주기를 요청했다."],[9,"They believed they had to give him something, or he might not answer their requests.","그들은 자신들이 그에게 무언가를 바쳐야 하며, 그렇지 않으면 그가 그들의 요청을 들어주지 않을지도 모른다고 믿었다."]],"w":"or는 ‘그렇지 않으면’. 무언가를 바쳐야 하고(had to give), 안 그러면 그가 요청에 응하지 않을지도 모른다(might not answer)는 뜻. 바치면 거절된다·순서 바뀜·주는 쪽이 바뀐 선지는 본문과 다름.","c":1},"h":"1616325bca"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["악어 미라들은 붕대로 단단히 싸여 있었다.","Sobek은 종종 악어 머리를 가진 모습으로 보였다.","고대 이집트에서 동물 미라를 만드는 것은 드문 일이었다.","이집트에서 발견된 악어 미라는 100구였다."],"opts":["The crocodile mummies were tightly wrapped in bandages.","Sobek was often shown with a crocodile head.","Making animal mummies was rare in ancient Egypt.","One hundred crocodile mummies were found in Egypt."],"r":{"a":"2) Sobek was often shown with a crocodile head.","ev":"1번, 3번, 5번, 7번 문장","s":[[1,"Experts recently discovered ten crocodile mummies near the Nile River in Egypt.","전문가들이 최근에 이집트 나일강 근처에서 악어 미라 열 구를 발견했다."],[3,"Most mummies are wrapped in bandages, but these crocodiles weren’t.","대부분의 미라는 붕대로 싸여 있지만, 이 악어들은 그렇지 않았다."],[5,"In ancient Egypt, it was common to make animal mummies as offerings for the gods.","고대 이집트에서는, 신들에게 바치는 제물로서 동물 미라를 만드는 것이 흔했다."],[7,"Sobek was often shown with a crocodile head.","Sobek은 악어 머리를 가진 모습으로 종종 보였다."]],"w":"7번에서 Sobek은 악어 머리를 가진 모습으로 종종 보였다고 함. 악어 미라는 붕대가 없었고(3번), 동물 미라를 만드는 것은 흔했고(5번), 발견된 것은 열 구(1번)라서 나머지는 모두 본문과 다름.","c":2},"h":"6fcbf4d8f7"},{"n":9,"t":"sum","q":"In ancient Egypt, animal mummies were made as (A) for the gods, and the crocodile mummies might have been a way of asking the gods for (B).","ko":"고대 이집트에서 동물 미라는 신들에게 바치는 (A)로 만들어졌고, 악어 미라들은 신들에게 (B)을(를) 요청하는 방식이었을지도 모른다.","oko":["(A) 장난감 / (B) 도움","(A) 반려동물 / (B) 식량","(A) 제물 / (B) 도움","(A) 제물 / (B) 돈","(A) 장난감 / (B) 돈"],"opts":["(A) toys / (B) help","(A) pets / (B) food","(A) offerings / (B) help","(A) offerings / (B) money","(A) toys / (B) money"],"r":{"a":"3) (A) offerings / (B) help","ev":"5번, 10번 문장","s":[[5,"In ancient Egypt, it was common to make animal mummies as offerings for the gods.","고대 이집트에서는, 신들에게 바치는 제물로서 동물 미라를 만드는 것이 흔했다."],[10,"So, these crocodile mummies might have been their way of asking for help from the gods.","그래서, 이 악어 미라들은 신들로부터 도움을 요청하는 그들의 방식이었을지도 모른다."]],"w":"5번에서 동물 미라는 신들에게 바치는 offerings(제물)이고, 10번에서 악어 미라들은 신들로부터 help(도움)를 요청하는 방식이었을지도 모른다고 함. toys·pets·money는 본문에 나오지 않는 말.","c":3},"h":"14f6b5891b"},{"n":10,"t":"fill","q":"This discovery gives us a new [A] of the ancient Egyptian [B] and how these animals were used as offerings.","ko":"이 발견은 우리에게 고대 이집트의 [B]와 이 동물들이 제물로 어떻게 사용되었는지에 대한 새로운 [A]를 준다.","bko":{"understanding":"이해","religion":"종교","bandages":"붕대","reptiles":"파충류","technology":"기술","request":"요청"},"bank":["understanding","religion","bandages","reptiles","technology","request"],"r":{"a":"[A] understanding, [B] religion","ev":"11번 문장","s":[[11,"This discovery gives us a new understanding of the ancient Egyptian religion and how these animals were used as offerings.","이 발견은 우리에게 고대 이집트의 종교와 이 동물들이 제물로 어떻게 사용되었는지에 대한 새로운 이해를 준다."]],"w":"11번에서 이 발견은 고대 이집트의 religion(종교)과 동물이 제물로 쓰인 방식에 대한 new understanding(새로운 이해)을 준다고 함. bandages(붕대)·reptiles(파충류)·technology(기술)·request(요청)는 이 글의 다른 부분에 나오는 말이라 ‘새로운 ~’, ‘고대 이집트의 ~’ 뜻에 맞지 않음.","c":null},"h":"bf90590a65"}]},{"u":7,"id":"rg4-07-1","no":1,"ko":"물 한 컵으로 산호를 지킨다고?","items":[{"n":1,"t":"tf","q":"Scientists collect water or soil near coral reefs without harming the corals.","ko":"과학자들은 산호를 해치지 않으면서 산호초 근처의 물이나 토양을 수집한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They collect water or soil near the reefs to learn about the sea life there, without harming the corals.","그들은 산호를 손상시키지 않으면서, 산호초 근처의 해양 생물에 대해 알아내기 위해 그곳의 물이나 토양을 수집한다."]],"w":"6번 문장에 collect water or soil near the reefs ... without harming the corals가 그대로 나옴. 산호를 해치지 않고 모은다는 내용과 일치.","c":"T"},"h":"eec379e5dc"},{"n":2,"t":"tf","q":"Many coral reefs around the world are growing because the water is getting warmer.","ko":"바닷물이 더 따뜻해지고 있어서 전 세계의 많은 산호초가 자라고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"Coral is extremely sensitive to water temperature, but the water is getting warmer.","산호는 수온에 극도로 민감하지만, 바닷물은 점점 더 따뜻해지고 있다."],[3,"So, many of them around the world are dying.","그래서 전 세계의 많은 산호초가 죽어가고 있다."]],"w":"2번에서 산호는 수온에 극도로 민감한데 바닷물이 더 따뜻해진다고 하고, 3번에서 그래서 산호초가 죽어 가고 있다고 함. 자라는 게 아니라 죽어 가는 것이라 반대.","c":"F"},"h":"e902149642"},{"n":3,"t":"tf","q":"The DNA library will help scientists know where coral species live.","ko":"DNA 도서관은 과학자들이 산호 종이 어디에 사는지 알도록 도울 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"It will let the scientists know where various coral species live and which species are most threatened.","그것은 과학자들이 다양한 산호 종이 어디에 사는지와 어떤 종이 가장 위협받는지를 알 수 있게 해 줄 것이다."]],"w":"11번 문장에서 DNA 도서관이 과학자들에게 다양한 산호 종이 어디에 사는지 알게 해 줄 것이라고 함. 본문과 일치.","c":"T"},"h":"c7349c2e98"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Coral is extremely sensitive to water temperature, but the water is getting warmer.)","ko":"(산호는 수온에 극도로 ( )하지만, 바닷물은 점점 더 따뜻해지고 있다.)","opts":["둔감한","민감한","튼튼한","건강한"],"word":"sensitive","r":{"a":"2) 민감한","ev":"2번 문장","s":[[2,"Coral is extremely sensitive to water temperature, but the water is getting warmer.","산호는 수온에 극도로 민감하지만, 바닷물은 점점 더 따뜻해지고 있다."]],"w":"2번 문장에서 산호는 수온에 sensitive한데 바닷물이 따뜻해져서 산호초가 죽어 간다고 이어짐. 수온 변화에 약하다는 뜻이니 sensitive = 민감한. 둔감한은 반대 뜻.","c":2},"h":"5bb419bedf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They’re creating a large DNA library from various coral reefs.)","ko":"(그들은 ( ) 산호초로부터 대형 DNA 도서관을 만들고 있다.)","opts":["비슷한","작은","오래된","다양한"],"word":"various","r":{"a":"4) 다양한","ev":"9번 문장","s":[[9,"They’re creating a large DNA library from various coral reefs.","그들은 다양한 산호초로부터 대형 DNA 도서관을 만들고 있다."]],"w":"9번 문장에서 여러 산호초에서 DNA를 모아 큰 도서관을 만든다고 함. various = 다양한. 11번의 various coral species도 '여러 종류의 산호 종'이라는 뜻.","c":4},"h":"af240aaa45"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWith the help of eDNA, scientists can better understand which corals are in danger and the effects of climate change on them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"eDNA의 도움으로 과학자들은 어떤 산호들이 위험에 처했는지와 기후 변화가 그것들에 미치는 영향을 더 잘 이해할 수 있다.","opts":["위험에 처한 산호들","과학자들","기후 변화","eDNA 방법"],"r":{"a":"1) 위험에 처한 산호들","ev":"8번 문장","s":[[8,"With the help of eDNA, scientists can better understand which corals are in danger and the effects of climate change on them.","eDNA의 도움으로 과학자들은 어떤 산호들이 위험에 처했는지와 기후 변화가 그것들에 미치는 영향을 더 잘 이해할 수 있다."]],"w":"8번에서 which corals are in danger(어떤 산호들이 위험에 처했는지) 뒤의 the effects of climate change on them(기후 변화가 그것들에 미치는 영향)에서 them은 산호들. 과학자들이나 방법이 아님.","c":1},"h":"b874b98a1f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This means they can fix damaged reefs and protect the many types of life depending on them.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그들이 손상된 산호초를 복구할 수 있고 그것들에 의존하는 많은 종류의 생물을 보호할 수 있다는 것을 의미한다.","opts":["이것은 산호초가 스스로 고쳐지고 과학자들을 보호할 수 있다는 뜻이다.","이것은 과학자들이 산호초를 떠나 다른 생물에게 의존할 수 있다는 뜻이다.","이것은 손상된 산호초가 모두 저절로 살아난다는 뜻이다.","이것은 과학자들이 손상된 산호초를 복구하고 산호초에 의존하는 많은 생물을 보호할 수 있다는 뜻이다."],"r":{"a":"4) 이것은 과학자들이 손상된 산호초를 복구하고 산호초에 의존하는 많은 생물을 보호할 수 있다는 뜻이다.","ev":"12번 문장","s":[[12,"This means they can fix damaged reefs and protect the many types of life depending on them.","이것은 그들이 손상된 산호초를 복구할 수 있고 그것들에 의존하는 많은 종류의 생물을 보호할 수 있다는 것을 의미한다."]],"w":"12번의 they는 과학자들. can fix(fix: 고치다) damaged reefs(손상된 산호초), protect(protect: 보호하다) life depending on them(산호초에 의존하는 생물). 산호초가 과학자를 보호한다는 말은 없음.","c":4},"h":"f94eabb1ab"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["과학자들은 eDNA를 모으려고 일부 산호를 없애야 한다.","산호는 따뜻한 바닷물에서도 아주 잘 산다.","DNA 도서관은 여러 산호초로부터 만들어지고 있다.","과학자들은 이미 손상된 산호초를 모두 고쳤다."],"opts":["Scientists must destroy some corals to collect eDNA.","Corals can live very well in warmer water.","A DNA library is being made from various coral reefs.","Scientists have already fixed all the damaged reefs."],"r":{"a":"3) A DNA library is being made from various coral reefs.","ev":"9번 문장","s":[[9,"They’re creating a large DNA library from various coral reefs.","그들은 다양한 산호초로부터 대형 DNA 도서관을 만들고 있다."]],"w":"9번 문장: 다양한 산호초로부터 대형 DNA 도서관을 만들고 있음. 6번은 산호를 해치지 않는다고 했고, 2번은 산호가 수온에 민감하다고 했으며, 12번은 복구할 수 있다는 앞으로의 이야기라 모두 맞지 않음.","c":3},"h":"c30a29f6a4"},{"n":9,"t":"sum","q":"With eDNA, scientists can (A) corals without harming them and learn which corals are in (B).","ko":"eDNA로 과학자들은 산호를 해치지 않고 (A)할 수 있고 어떤 산호가 (B)에 처했는지 알 수 있다.","oko":["(A) 해치다 / (B) 안전","(A) 해치다 / (B) 위험","(A) 연구하다 / (B) 안전","(A) 무시하다 / (B) 위험","(A) 연구하다 / (B) 위험"],"opts":["(A) harm / (B) safety","(A) harm / (B) danger","(A) study / (B) safety","(A) ignore / (B) danger","(A) study / (B) danger"],"r":{"a":"5) (A) study / (B) danger","ev":"6, 8번 문장","s":[[6,"They collect water or soil near the reefs to learn about the sea life there, without harming the corals.","그들은 산호를 손상시키지 않으면서, 산호초 근처의 해양 생물에 대해 알아내기 위해 그곳의 물이나 토양을 수집한다."],[8,"With the help of eDNA, scientists can better understand which corals are in danger and the effects of climate change on them.","eDNA의 도움으로 과학자들은 어떤 산호들이 위험에 처했는지와 기후 변화가 그것들에 미치는 영향을 더 잘 이해할 수 있다."]],"w":"6번에서 해치지 않고 물이나 토양을 모아 바다 생물을 알아본다고 했으니 (A)는 study(연구하다). 8번에서 어떤 산호가 in danger(위험에 처한)인지 이해한다고 했으니 (B)는 danger. harm은 6번과 반대.","c":5},"h":"8ba4cab953"},{"n":10,"t":"fill","q":"Scientists are building a large DNA [A] of coral reefs, and it will show which coral species are most [B].","ko":"과학자들은 산호초의 대형 DNA [A]을 만들고 있고, 그것은 어떤 산호 종이 가장 [B]는지 보여 줄 것이다.","bko":{"library":"도서관(자료 모음)","threatened":"위협받는","soil":"토양, 흙","method":"방법","alive":"살아 있는","temperature":"온도"},"bank":["library","threatened","soil","method","alive","temperature"],"r":{"a":"[A] library, [B] threatened","ev":"9, 11번 문장","s":[[9,"They’re creating a large DNA library from various coral reefs.","그들은 다양한 산호초로부터 대형 DNA 도서관을 만들고 있다."],[11,"It will let the scientists know where various coral species live and which species are most threatened.","그것은 과학자들이 다양한 산호 종이 어디에 사는지와 어떤 종이 가장 위협받는지를 알 수 있게 해 줄 것이다."]],"w":"9번에서 DNA library(도서관)를 만들고, 11번에서 which species are most threatened(어떤 종이 가장 위협받는지)를 알게 해 준다고 함. soil(토양)은 6번에서 수집하는 것이고, alive(살아 있는)나 method(방법)는 이 문장에 어울리지 않음.","c":null},"h":"53a42d9148"}]},{"u":7,"id":"rg4-07-2","no":2,"ko":"귀여운 얼굴 뒤에 독을 숨긴 동물","items":[{"n":1,"t":"tf","q":"Slow lorises make their poison by licking glands on their arms.","ko":"늘보로리스는 팔에 있는 분비샘을 핥아서 독을 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Strangely, to produce the poison, they raise their arms above their head and quickly lick poisonous oil-producing glands on their arms.","이상하게도, 그들은 독을 만들기 위해 머리 위로 팔을 올려서 팔에 있는 독성 기름을 만드는 분비샘을 재빨리 핥는다."]],"w":"3번 문장에서 팔을 올려 poisonous oil-producing glands on their arms(팔에 있는 독성 기름 분비샘)를 핥는다고 함. 본문과 일치.","c":"T"},"h":"0a6c63c426"},{"n":2,"t":"tf","q":"Female slow lorises were bitten more often than males.","ko":"암컷 늘보로리스가 수컷보다 더 자주 물렸다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Males suffered more frequent bites than females.","수컷들이 암컷들보다 더 자주 물리는 일을 겪었다."]],"w":"8번 문장에서 수컷(Males)이 암컷보다 더 자주 물렸다고 함. 암컷과 수컷이 뒤바뀐 선지라 본문과 반대.","c":"F"},"h":"553137f6fd"},{"n":3,"t":"tf","q":"About 20% of the slow lorises in the study had new bite wounds.","ko":"연구 대상 늘보로리스 중 약 20%가 새로 생긴 물린 상처가 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"They noticed that 20% of them had new bite wounds, sometimes very serious.","그들은 늘보로리스의 20%가 새로 생긴 물린 상처가 있었는데, 때로는 매우 심각하다는 것을 알게 되었다."]],"w":"7번 문장에 20% of them had new bite wounds가 나옴. 숫자까지 본문과 일치.","c":"T"},"h":"a39511194f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Males suffered more frequent bites than females.)","ko":"(수컷들이 암컷들보다 ( ) 물리는 일을 겪었다.)","opts":["드문","빈번한","작은","심각한"],"word":"frequent","r":{"a":"2) 빈번한","ev":"8번 문장","s":[[8,"Males suffered more frequent bites than females.","수컷들이 암컷들보다 더 자주 물리는 일을 겪었다."]],"w":"8번 문장에서 수컷이 암컷보다 more frequent bites를 겪었다고 함. 더 자주 물렸다는 뜻이니 frequent = 빈번한. 드문은 반대 뜻.","c":2},"h":"5dc5dcc56e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…use their poison to fight over things like mates or territory.)","ko":"(…짝이나 ( ) 같은 것을 두고 싸우기 위해 독을 사용한다.)","opts":["음식","짝","영역","나이"],"word":"territory","r":{"a":"3) 영역","ev":"9번 문장","s":[[9,"These bite wounds showed that slow lorises are very protective of their own area and use their poison to fight over things like mates or territory.","이러한 물린 상처는 늘보로리스가 자기 영역에 대해 매우 방어적이며 짝이나 영역 같은 것을 두고 싸우기 위해 독을 사용한다는 것을 보여 주었다."]],"w":"9번 문장에서 mates(짝) or territory를 두고 싸운다고 함. 자기 영역을 지킨다는 앞부분(their own area)과 이어져서 territory = 영역.","c":3},"h":"6cc1eaaa0c"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThey found something surprising: these animals often use their poison on each other, which is unusual.","ko":"밑줄 친 which가 가리키는 것은?","sko":"그들은 놀라운 것을 발견했는데, 이 동물들은 종종 서로에게 독을 사용하며, 이는 흔치 않은 일이다.","opts":["늘보로리스가 귀여운 것","동물들이 서로에게 독을 사용하는 것","연구원들이 놀란 것","독이 이빨로 들어가는 것"],"r":{"a":"2) 동물들이 서로에게 독을 사용하는 것","ev":"6번 문장","s":[[6,"They found something surprising: these animals often use their poison on each other, which is unusual.","그들은 놀라운 것을 발견했는데, 이 동물들은 종종 서로에게 독을 사용하며, 이는 흔치 않은 일이다."]],"w":"which 앞에 these animals often use their poison on each other(동물들이 서로에게 독을 사용한다)가 있고, 그 일이 unusual(흔치 않은)하다는 뜻. which는 앞 내용 전체를 가리킴.","c":2},"h":"c5e7bb4306"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This study is important because it’s rare to see animals use poison against their own species.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 연구는 동물이 자신의 종을 향해 독을 사용하는 것을 보는 일이 드물기 때문에 중요하다.","opts":["이 연구는 늘보로리스의 독이 너무 약해서 중요하다.","이 연구는 동물들이 독을 쓰는 일이 아주 흔해서 중요하다.","이 연구는 늘보로리스가 같은 종을 보호해서 중요하다.","이 연구는 동물이 같은 종에게 독을 쓰는 일이 드물기 때문에 중요하다."],"r":{"a":"4) 이 연구는 동물이 같은 종에게 독을 쓰는 일이 드물기 때문에 중요하다.","ev":"10번 문장","s":[[10,"This study is important because it’s rare to see animals use poison against their own species.","이 연구는 동물이 자신의 종을 향해 독을 사용하는 것을 보는 일이 드물기 때문에 중요하다."]],"w":"because it's rare(드물기 때문에) to see animals use poison against their own species(같은 종에게 독을 쓰는 것). 드물기 때문에 중요한 것이지 흔해서가 아님.","c":4},"h":"ae3ce23cba"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["늘보로리스는 독을 오직 먹이를 사냥하는 데만 쓴다.","늘보로리스는 짝이나 영역을 두고 싸울 때 독을 쓴다.","늘보로리스는 아프리카에 산다.","암컷이 수컷보다 더 자주 물렸다."],"opts":["Slow lorises use their poison only to hunt for food.","Slow lorises use their poison to fight over mates or territory.","Slow lorises live in Africa.","Females were bitten more often than males."],"r":{"a":"2) Slow lorises use their poison to fight over mates or territory.","ev":"9번 문장","s":[[9,"These bite wounds showed that slow lorises are very protective of their own area and use their poison to fight over things like mates or territory.","이러한 물린 상처는 늘보로리스가 자기 영역에 대해 매우 방어적이며 짝이나 영역 같은 것을 두고 싸우기 위해 독을 사용한다는 것을 보여 주었다."]],"w":"9번 문장: 늘보로리스는 짝이나 영역을 두고 싸우기 위해 독을 씀. 11번에서 사냥만이 아니라고 했고, 1번은 아시아, 8번은 수컷이 더 자주 물렸다고 했으므로 나머지는 모두 본문과 다름.","c":2},"h":"19ca18c42f"},{"n":9,"t":"sum","q":"Researchers found that slow lorises use poison on (A), and they use it to (B) over mates or territory.","ko":"연구원들은 늘보로리스가 (A)에게 독을 쓰고, 짝이나 영역을 두고 (B)하기 위해 쓴다는 것을 알게 되었다.","oko":["(A) 다른 동물 / (B) 사냥","(A) 서로 / (B) 사냥","(A) 다른 동물 / (B) 싸우다","(A) 새끼 / (B) 싸우다","(A) 서로 / (B) 싸우다"],"opts":["(A) other animals / (B) hunt","(A) each other / (B) hunt","(A) other animals / (B) fight","(A) their babies / (B) fight","(A) each other / (B) fight"],"r":{"a":"5) (A) each other / (B) fight","ev":"6, 9번 문장","s":[[6,"They found something surprising: these animals often use their poison on each other, which is unusual.","그들은 놀라운 것을 발견했는데, 이 동물들은 종종 서로에게 독을 사용하며, 이는 흔치 않은 일이다."],[9,"These bite wounds showed that slow lorises are very protective of their own area and use their poison to fight over things like mates or territory.","이러한 물린 상처는 늘보로리스가 자기 영역에 대해 매우 방어적이며 짝이나 영역 같은 것을 두고 싸우기 위해 독을 사용한다는 것을 보여 주었다."]],"w":"6번에서 늘보로리스는 on each other(서로에게) 독을 쓴다고 했고, 9번에서 짝이나 영역을 두고 fight(싸우다)하기 위해 쓴다고 함. 사냥(hunt)이나 다른 동물, 새끼는 본문에 이 내용이 없음.","c":5},"h":"fa75df67f3"},{"n":10,"t":"fill","q":"Animals use poison for hunting, [A] themselves, and fighting [B] a species.","ko":"동물들은 사냥, 자기를 [A]하는 것, 그리고 한 종 [B]에서 싸우는 일에 독을 쓴다.","bko":{"protecting":"보호하기","within":"~ 안에서","raise":"들어 올리다","lick":"핥다","produce":"만들다","notice":"알아차리다"},"bank":["protecting","within","raise","lick","produce","notice"],"r":{"a":"[A] protecting, [B] within","ev":"11번 문장","s":[[11,"It helps us understand that animals use poison not only for hunting or protecting themselves but also for fighting within a species.","그것은 동물들이 사냥이나 자기 보호뿐만 아니라 같은 종 내에서 싸우는 데에도 독을 사용한다는 것을 우리가 이해하도록 도와준다."]],"w":"11번 문장에서 동물들은 hunting or protecting themselves(사냥이나 자기 보호)뿐 아니라 fighting within a species(같은 종 안에서 싸우는 일)에도 독을 쓴다고 함. raise(들어 올리다), lick(핥다), produce(만들다)는 3번에서 독을 만드는 동작이라 이 문장과 상관없음.","c":null},"h":"4a9523c37c"}]},{"u":7,"id":"rg4-07-3","no":3,"ko":"전기 없이 집을 식히는 사막의 굴뚝","items":[{"n":1,"t":"tf","q":"Many houses in Iran’s desert cities still use a cooling device that does not need electricity.","ko":"이란의 사막 도시에 있는 많은 집은 전기가 필요 없는 냉각 장치를 여전히 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"But in Iran’s desert cities, many houses still use a traditional, electricity-free cooling device known as a windcatcher.","그러나 이란의 사막 도시들에서는, 많은 집이 윈드캐처라고 알려진 전통적이고 전기를 사용하지 않는 냉각 장치를 여전히 사용한다."]],"w":"2번 문장에 many houses still use a traditional, electricity-free cooling device(전통적이고 전기를 쓰지 않는 냉각 장치)가 나옴. 본문과 일치.","c":"T"},"h":"e0830e2b9a"},{"n":2,"t":"tf","q":"A windcatcher is built under the floor of a house.","ko":"윈드캐처는 집의 바닥 아래에 지어진다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"A windcatcher is located on the roof or the tallest part of the house.","윈드캐처는 지붕 위나 집의 가장 높은 부분에 위치한다."]],"w":"5번 문장에서 윈드캐처는 지붕 위나 집의 가장 높은 부분에 있다고 함. 바닥 아래는 반대.","c":"F"},"h":"80ae2255b3"},{"n":3,"t":"tf","q":"The windcatcher has been a symbol of Iran for only a short time.","ko":"윈드캐처는 아주 짧은 시간 동안만 이란의 상징이었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The windcatcher has been one of the impressive symbols of Iran for a very long time.","윈드캐처는 매우 오랜 시간 동안 이란의 인상적인 상징 중 하나였다."]],"w":"4번 문장에서 for a very long time(매우 오랜 시간 동안) 이란의 인상적인 상징 중 하나였다고 함. 짧은 시간이라는 말은 반대.","c":"F"},"h":"52fae107d9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This pushes out the warm air through the opposite side of the windcatcher.)","ko":"(이것은 윈드캐처의 ( ) 면을 통해 따뜻한 공기를 밀어낸다.)","opts":["같은","높은","반대편의","열린"],"word":"opposite","r":{"a":"3) 반대편의","ev":"8번 문장","s":[[8,"This pushes out the warm air through the opposite side of the windcatcher.","이것은 윈드캐처의 반대편 면을 통해 따뜻한 공기를 밀어낸다."]],"w":"7번에서 시원한 바람이 들어오는 면과 달리, 8번에서는 따뜻한 공기가 나가는 쪽이라고 함. 들어오는 곳의 맞은편이므로 opposite = 반대편의.","c":3},"h":"30133e2258"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…this can reduce the temperature inside a building by 8°C to 12°C.)","ko":"(…이것은 건물 안의 온도를 섭씨 8도에서 12도까지 ( ) 수 있다.)","opts":["높이다","유지하다","측정하다","낮추다"],"word":"reduce","r":{"a":"4) 낮추다","ev":"9번 문장","s":[[9,"Studies show that this can reduce the temperature inside a building by 8°C to 12°C.","연구들은 이것이 건물 안의 온도를 섭씨 8도에서 12도까지 낮출 수 있다는 것을 보여 준다."]],"w":"윈드캐처가 시원한 공기를 내려보내고 따뜻한 공기를 밀어내니 온도는 내려감. 8도에서 12도까지 낮춘다는 뜻이라 reduce = 낮추다.","c":4},"h":"c60de67f7f"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis pushes out the warm air through the opposite side of the windcatcher.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 윈드캐처의 반대편 면을 통해 따뜻한 공기를 밀어낸다.","opts":["윈드캐처가 높은 곳의 바람을 받아 시원한 공기를 집 안으로 내려보내는 것","에어컨이 전기를 많이 쓰는 것","집의 지붕","고대 이집트의 미술품"],"r":{"a":"1) 윈드캐처가 높은 곳의 바람을 받아 시원한 공기를 집 안으로 내려보내는 것","ev":"7~8번 문장","s":[[7,"It catches the wind from high above and sends cool air down into the house below.","그것은 높은 곳에서 바람을 포착하여 아래 집 안으로 시원한 공기를 내려보낸다."],[8,"This pushes out the warm air through the opposite side of the windcatcher.","이것은 윈드캐처의 반대편 면을 통해 따뜻한 공기를 밀어낸다."]],"w":"7번에서 윈드캐처가 높은 곳에서 바람을 받아 시원한 공기를 집 안으로 내려보낸다고 함. 8번의 This는 그 일을 가리키고, 그 결과로 따뜻한 공기가 반대편으로 밀려남.","c":1},"h":"0f11ae1296"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This invention looks simple but is very technical.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 발명품은 간단해 보이지만 매우 기술적이다.","opts":["이 발명품은 겉보기에 복잡하지만 아주 간단하다.","이 발명품은 겉보기에는 간단하지만 매우 기술적이다.","이 발명품은 너무 단순해서 기술이 전혀 필요 없다.","이 발명품은 전기를 많이 써서 기술적이다."],"r":{"a":"2) 이 발명품은 겉보기에는 간단하지만 매우 기술적이다.","ev":"3번 문장","s":[[3,"This invention looks simple but is very technical.","이 발명품은 간단해 보이지만 매우 기술적이다."]],"w":"looks simple(간단해 보인다) but is very technical(하지만 매우 기술적이다). 앞뒤가 반대되는 but 문장이라 겉모습은 간단, 실제는 기술적. 2번에서 전기를 쓰지 않는다고 했으니 네 번째도 틀림.","c":2},"h":"6ea8aa7fa3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["윈드캐처는 전기를 써서 시원한 공기를 만든다.","윈드캐처는 사막 도시에서 찾아볼 수 없다.","윈드캐처는 집의 지하실에 설치된다.","윈드캐처는 사방에 열린 면이 있는 높은 굴뚝처럼 생겼다."],"opts":["A windcatcher uses electricity to make cool air.","Windcatchers cannot be found in desert cities.","A windcatcher is located in the basement of a house.","A windcatcher looks like a tall chimney with open sides."],"r":{"a":"4) A windcatcher looks like a tall chimney with open sides.","ev":"6번 문장","s":[[6,"It looks like a tall chimney with open sides around.","그것은 사방에 열린 면이 있는 높은 굴뚝처럼 보인다."]],"w":"6번 문장: 사방에 열린 면이 있는 높은 굴뚝처럼 보임. 2번에서 전기를 쓰지 않고 사막 도시에서 쓰며, 5번에서 지붕이나 가장 높은 곳에 있다고 했으므로 나머지는 모두 본문과 다름.","c":4},"h":"9d7858427b"},{"n":9,"t":"sum","q":"A windcatcher catches the wind and sends (A) air into the house, so the temperature inside can go (B).","ko":"윈드캐처는 바람을 받아 집 안으로 (A) 공기를 보내서, 안의 온도가 (B)갈 수 있다.","oko":["(A) 따뜻한 / (B) 올라","(A) 시원한 / (B) 올라","(A) 따뜻한 / (B) 내려","(A) 뜨거운 / (B) 올라","(A) 시원한 / (B) 내려"],"opts":["(A) warm / (B) up","(A) cool / (B) up","(A) warm / (B) down","(A) hot / (B) up","(A) cool / (B) down"],"r":{"a":"5) (A) cool / (B) down","ev":"7, 9번 문장","s":[[7,"It catches the wind from high above and sends cool air down into the house below.","그것은 높은 곳에서 바람을 포착하여 아래 집 안으로 시원한 공기를 내려보낸다."],[9,"Studies show that this can reduce the temperature inside a building by 8°C to 12°C.","연구들은 이것이 건물 안의 온도를 섭씨 8도에서 12도까지 낮출 수 있다는 것을 보여 준다."]],"w":"7번에서 cool air(시원한 공기)를 집 안으로 보낸다고 했고, 9번에서 건물 안 온도를 8도에서 12도까지 낮춘다고 함. 따라서 cool과 down. warm은 밖으로 밀려나가는 공기(8번).","c":5},"h":"dc0f776b0a"},{"n":10,"t":"fill","q":"The exact [A] of windcatchers is not clear, though they appear in [B] Egyptian art over 3,000 years old.","ko":"윈드캐처의 정확한 [A]은 분명하지 않지만, 그것은 3,000년이 넘은 [B] 이집트 미술품에 나타난다.","bko":{"origin":"기원","ancient":"고대의","modern":"현대의","symbol":"상징","chimney":"굴뚝","temple":"사원"},"bank":["origin","ancient","modern","symbol","chimney","temple"],"r":{"a":"[A] origin, [B] ancient","ev":"10번 문장","s":[[10,"The exact origin of windcatchers is not clear, though they appear in ancient Egyptian art over 3,000 years old.","윈드캐처의 정확한 기원은 분명하지 않지만, 3,000년이 넘은 고대 이집트의 미술품에 나타난다."]],"w":"10번 문장: The exact origin(정확한 기원)은 분명하지 않지만 ancient Egyptian art(고대 이집트 미술품)에 나타남. 3,000년이 넘은 미술품이니 modern(현대의)은 맞지 않고, symbol(상징)은 4번, chimney(굴뚝)는 6번, temple(사원)은 11번에 나오는 말.","c":null},"h":"3755b067f1"}]},{"u":8,"id":"rg4-08-1","no":1,"ko":"컴퓨터의 열로 수영장 물을 데운다고?","items":[{"n":1,"t":"tf","q":"Deep Green uses the heat from its data center to warm a pool.","ko":"Deep Green은 자사 데이터 센터에서 나오는 열로 수영장을 데운다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In the U.K., a start-up named Deep Green is using the waste heat from its data center to warm a pool in Devon.","영국에서는 Deep Green이라는 이름의 스타트업이 Devon에 있는 수영장 물을 데우기 위해 자사 데이터 센터에서 나오는 폐열을 이용하고 있다."]],"w":"3번 문장에 using the waste heat from its data center to warm a pool이 나옴. 본문과 일치.","c":"T"},"h":"59e249a0a4"},{"n":2,"t":"tf","q":"Deep Green’s data center is placed on the roof of the pool building.","ko":"Deep Green의 데이터 센터는 수영장 건물 지붕 위에 놓여 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"This center, about the size of a washing machine, has been installed underneath the pool.","세탁기 크기만 한 이 센터는 수영장 밑에 설치되었다."]],"w":"4번 문장에서 센터는 수영장 underneath(밑)에 설치되었다고 함. 지붕 위가 아니라 밑이라 반대.","c":"F"},"h":"7449a3d26f"},{"n":3,"t":"tf","q":"Deep Green also saves money by spending less on cooling its computers.","ko":"Deep Green도 컴퓨터를 식히는 데 돈을 덜 써서 돈을 절약한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Deep Green saves money too, by cutting expenses on cooling its computers.","Deep Green도 컴퓨터를 냉각하는 데 드는 비용을 줄여서 돈을 절약한다."]],"w":"9번 문장에서 cutting expenses on cooling its computers(컴퓨터 냉각에 드는 비용을 줄임)로 돈을 절약한다고 함. 본문과 일치.","c":"T"},"h":"2dc78d9d74"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The pool gets free heat, cutting its gas consumption by 62%.)","ko":"(수영장은 무료로 열을 얻어 가스 ( )를 62% 줄인다.)","opts":["생산","가격","소비","온도"],"word":"consumption","r":{"a":"3) 소비","ev":"8번 문장","s":[[8,"The pool gets free heat, cutting its gas consumption by 62%.","수영장은 무료로 열을 얻어 가스 소비를 62% 줄인다."]],"w":"8번에서 수영장이 공짜 열을 얻어서 gas consumption을 62% 줄인다고 함. 가스를 덜 쓰게 된다는 뜻이니 consumption = 소비.","c":3},"h":"23b66d00f5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It has computers surrounded by oil that captures their heat.)","ko":"(그곳에는 열을 가두는 기름으로 ( ) 컴퓨터들이 있다.)","opts":["가득 찬","떨어진","숨겨진","둘러싸인"],"word":"surrounded","r":{"a":"4) 둘러싸인","ev":"5번 문장","s":[[5,"It has computers surrounded by oil that captures their heat.","그곳에는 열을 가두는 기름으로 둘러싸인 컴퓨터들이 있다."]],"w":"5번에서 컴퓨터들이 기름 안에 있고 그 기름이 열을 가둠. 컴퓨터 둘레에 기름이 있는 모습이라 surrounded = 둘러싸인.","c":4},"h":"06bf93c99a"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nIt has computers surrounded by oil that captures their heat.","ko":"밑줄 친 their가 가리키는 것은?","sko":"그곳에는 열을 가두는 기름으로 둘러싸인 컴퓨터들이 있다.","opts":["수영장의 물","컴퓨터들","기름","수영장 직원들"],"r":{"a":"2) 컴퓨터들","ev":"5번 문장","s":[[5,"It has computers surrounded by oil that captures their heat.","그곳에는 열을 가두는 기름으로 둘러싸인 컴퓨터들이 있다."]],"w":"5번에서 기름이 가두는 열은 앞의 computers(컴퓨터들)가 내는 열. 그래서 their heat = 컴퓨터들의 열. 이 열이 6번에서 수영장 물을 데움.","c":2},"h":"a651ae396c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This smart setup helps both the pool and the data center.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 똑똑한 장치는 수영장과 데이터 센터 둘 다에게 도움이 된다.","opts":["이 영리한 장치는 수영장과 데이터 센터 둘 다에게 도움이 된다.","이 영리한 장치는 수영장에게만 도움이 되고 데이터 센터에는 해가 된다.","이 영리한 장치는 데이터 센터에게만 도움이 된다.","이 영리한 장치는 수영장과 데이터 센터 둘 다에게 비용이 든다."],"r":{"a":"1) 이 영리한 장치는 수영장과 데이터 센터 둘 다에게 도움이 된다.","ev":"7번 문장","s":[[7,"This smart setup helps both the pool and the data center.","이 똑똑한 장치는 수영장과 데이터 센터 둘 다에게 도움이 된다."]],"w":"helps both the pool and the data center = 수영장과 데이터 센터 둘 다 돕는다. 8번에서 수영장이, 9번에서 회사가 이득을 본다고 이어지므로 한쪽만 돕는다는 선지는 틀림.","c":1},"h":"5033888d49"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["Deep Green은 많은 수영장을 가진 큰 회사이다.","데이터 센터는 수영장만큼 크다.","데이터 센터는 세탁기 정도의 크기이다.","Deep Green은 다른 수영장에 이것을 적용할 계획이 없다."],"opts":["Deep Green is a large company that owns many pools.","The data center is as big as the pool.","The data center is about the size of a washing machine.","Deep Green has no plans to do this for other pools."],"r":{"a":"3) The data center is about the size of a washing machine.","ev":"4번 문장","s":[[4,"This center, about the size of a washing machine, has been installed underneath the pool.","세탁기 크기만 한 이 센터는 수영장 밑에 설치되었다."]],"w":"4번 문장: 센터는 about the size of a washing machine(세탁기 크기). 3번에서 Deep Green은 스타트업이라고 했고, 11번에서 더 많은 수영장에 적용할 계획이라고 했으므로 나머지는 틀림.","c":3},"h":"d184bd7583"},{"n":9,"t":"sum","q":"The pool gets (A) heat and uses less gas, while Deep Green saves money on (B) its computers.","ko":"수영장은 (A) 열을 얻어 가스를 덜 쓰고, Deep Green은 컴퓨터를 (B)하는 데 드는 돈을 아낀다.","oko":["(A) 비싼 / (B) 가열","(A) 무료의 / (B) 가열","(A) 비싼 / (B) 냉각","(A) 뜨거운 / (B) 가열","(A) 무료의 / (B) 냉각"],"opts":["(A) expensive / (B) heating","(A) free / (B) heating","(A) expensive / (B) cooling","(A) hot / (B) heating","(A) free / (B) cooling"],"r":{"a":"5) (A) free / (B) cooling","ev":"8~9번 문장","s":[[8,"The pool gets free heat, cutting its gas consumption by 62%.","수영장은 무료로 열을 얻어 가스 소비를 62% 줄인다."],[9,"Deep Green saves money too, by cutting expenses on cooling its computers.","Deep Green도 컴퓨터를 냉각하는 데 드는 비용을 줄여서 돈을 절약한다."]],"w":"8번: 수영장이 free heat(무료 열)를 얻어 가스 소비를 줄임. 9번: Deep Green은 cooling its computers(컴퓨터 냉각) 비용을 줄임. 비싼 열이나 가열 비용은 본문과 반대.","c":5},"h":"5835b8bb76"},{"n":10,"t":"fill","q":"Deep Green [A] to do this for more pools, which will help both itself and the [B].","ko":"Deep Green은 더 많은 수영장에 이것을 하려고 [A]하는데, 그것은 그 자체와 [B] 둘 다에 도움이 될 것이다.","bko":{"plans":"계획하다","environment":"환경","expenses":"비용","consumption":"소비","surrounds":"둘러싸다","installs":"설치하다"},"bank":["plans","environment","expenses","consumption","surrounds","installs"],"r":{"a":"[A] plans, [B] environment","ev":"11번 문장","s":[[11,"This idea is so good that Deep Green plans to do this for more pools, which will help both itself and the environment.","이 아이디어는 아주 훌륭해서 Deep Green은 더 많은 수영장에 이것을 실행할 계획인데, 그것은 그 자체와 환경 둘 다에 도움이 될 것이다."]],"w":"11번 문장: Deep Green plans to do this for more pools(더 많은 수영장에 이것을 할 계획)이고, 회사 자신과 environment(환경) 둘 다에 도움이 될 것이라고 함. expenses(비용)와 consumption(소비)은 8~9번 이야기고, to와 함께 쓸 동사는 plans(계획하다)가 알맞음.","c":null},"h":"816d935f37"}]},{"u":8,"id":"rg4-08-2","no":2,"ko":"달에도 시간대가 필요한 이유는?","items":[{"n":1,"t":"tf","q":"The country that launches a spaceship decides the time zone of its mission.","ko":"우주선을 발사하는 나라가 그 임무의 시간대를 결정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"That’s because the country that launches the spaceship decides it.","우주선을 발사하는 나라가 그것을 결정하기 때문이다."]],"w":"4번 문장에서 the country that launches the spaceship decides it(우주선을 발사하는 나라가 그것(시간대)을 결정한다)이라고 함. 본문과 일치.","c":"T"},"h":"5125e4bdc9"},{"n":2,"t":"tf","q":"The European Space Agency wants to make a special time zone for Mars.","ko":"유럽 우주국은 화성을 위한 특별한 시간대를 만들고 싶어 한다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"The European Space Agency (ESA) wants to make a special time zone for the moon.","유럽 우주국(ESA)은 달을 위한 특별한 시간대를 만들고 싶어 한다."]],"w":"1번 문장에서 special time zone for the moon(달을 위한 특별한 시간대)이라고 함. 화성이 아니라 달이라 틀림. 화성이나 다른 행성 이야기는 11번에서 나중에 나오는 것.","c":"F"},"h":"5b4c84e4fd"},{"n":3,"t":"tf","q":"Once a standard time system is made for the moon, it can also be made for other planets.","ko":"달의 표준 시간 체계가 만들어지면, 다른 행성을 위해서도 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"But once they set up a standard time system for the moon, they can quickly make and manage the same system for other planets too.","그러나 일단 달의 표준 시간 체계를 마련하면, 다른 행성들에서도 같은 체계를 빠르게 만들고 관리할 수 있다."]],"w":"11번 문장에서 일단 달의 표준 시간 체계를 마련하면 다른 행성의 같은 체계도 빠르게 만들고 관리할 수 있다고 함. 본문과 일치.","c":"T"},"h":"4c42ba8a19"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the country that launches the spaceship decides it.)","ko":"(…우주선을 ( ) 나라가 그것을 결정한다.)","opts":["발사하다","착륙하다","수리하다","관찰하다"],"word":"launches","r":{"a":"1) 발사하다","ev":"4번 문장","s":[[4,"That’s because the country that launches the spaceship decides it.","우주선을 발사하는 나라가 그것을 결정하기 때문이다."]],"w":"4번에서 어느 나라가 spaceship을 launch하느냐에 따라 시간대가 정해짐. 우주선을 우주로 쏘아 올리는 나라이니 launch = 발사하다.","c":1},"h":"66b837ffd4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…once they set up a standard time system for the moon…)","ko":"(…일단 그들이 달의 ( ) 시간 체계를 마련하면…)","opts":["특별한","위험한","표준의","작은"],"word":"standard","r":{"a":"3) 표준의","ev":"11번 문장","s":[[11,"But once they set up a standard time system for the moon, they can quickly make and manage the same system for other planets too.","그러나 일단 달의 표준 시간 체계를 마련하면, 다른 행성들에서도 같은 체계를 빠르게 만들고 관리할 수 있다."]],"w":"11번에서 달의 standard time system을 마련하면 다른 행성에서도 같은 체계를 만들 수 있다고 함. 모두가 같이 쓰는 기준 체계라서 standard = 표준의.","c":3},"h":"0668a16953"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey think it will help people from different countries work together on moon missions.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 그것이 다양한 나라의 사람들이 달 임무를 함께하는 것을 도울 것이라고 생각한다.","opts":["달에 사는 사람들","유럽 우주국(ESA)","우주선을 발사하는 나라들","다양한 나라의 사람들"],"r":{"a":"2) 유럽 우주국(ESA)","ev":"1~2번 문장","s":[[1,"The European Space Agency (ESA) wants to make a special time zone for the moon.","유럽 우주국(ESA)은 달을 위한 특별한 시간대를 만들고 싶어 한다."],[2,"They think it will help people from different countries work together on moon missions.","그들은 그것이 다양한 나라의 사람들이 달 임무를 함께하는 것을 도울 것이라고 생각한다."]],"w":"1번에서 유럽 우주국(ESA)이 달의 시간대를 만들고 싶어 한다고 했고, 2번에서 They think로 이어짐. 그래서 They = 유럽 우주국. '다양한 나라의 사람들'은 2번에서 도움을 받는 사람들임.","c":2},"h":"04b58fb146"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But once they set up a standard time system for the moon, they can quickly make and manage the same system for other planets too.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 일단 달의 표준 시간 체계를 마련하면, 다른 행성들에서도 같은 체계를 빠르게 만들고 관리할 수 있다.","opts":["달의 시간 체계를 만들면 다른 행성에서는 만들 수 없게 된다.","달의 시간 체계를 만들지 못하면 다른 행성에도 만들 수 있다.","달의 시간 체계를 만들면 오히려 지구의 시간이 바뀐다.","달의 표준 시간 체계가 마련되면 다른 행성에도 같은 체계를 빠르게 만들고 관리할 수 있다."],"r":{"a":"4) 달의 표준 시간 체계가 마련되면 다른 행성에도 같은 체계를 빠르게 만들고 관리할 수 있다.","ev":"11번 문장","s":[[11,"But once they set up a standard time system for the moon, they can quickly make and manage the same system for other planets too.","그러나 일단 달의 표준 시간 체계를 마련하면, 다른 행성들에서도 같은 체계를 빠르게 만들고 관리할 수 있다."]],"w":"once they set up(일단 마련하면) ... they can quickly make and manage the same system for other planets too(다른 행성에도 같은 체계를 빠르게 만들고 관리할 수 있다). 지구의 시간이 바뀐다는 말은 없음.","c":4},"h":"8c4896887c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["달의 시계는 지구의 시계보다 느리게 간다.","모든 달 임무는 이미 같은 시간대를 쓰고 있다.","달의 하루는 지구의 29.5일과 같다.","달의 하루는 지구의 하루보다 짧다."],"opts":["Clocks on the moon go slower than clocks on Earth.","Every moon mission already uses the same time zone.","A day on the moon is the same as 29.5 Earth days.","A day on the moon is shorter than a day on Earth."],"r":{"a":"3) A day on the moon is the same as 29.5 Earth days.","ev":"9번 문장","s":[[9,"Another problem is that a day on the moon is the same as 29.5 Earth days.","또 다른 문제는 달에서의 하루가 지구의 29.5일과 같다는 것이다."]],"w":"9번 문장: 달에서의 하루는 지구의 29.5일과 같음. 8번에서 달의 시계는 더 빨리 가고, 3번에서 임무마다 시간대가 다르며, 9번에서 하루가 훨씬 길다고 했으므로 나머지는 틀림.","c":3},"h":"3e19326b4c"},{"n":9,"t":"sum","q":"On the moon, clocks go (A) than on Earth, so it is (B) to know the correct time.","ko":"달에서는 시계가 지구보다 (A) 가기 때문에 정확한 시간을 알기가 (B).","oko":["(A) 느리게 / (B) 쉽다","(A) 느리게 / (B) 어렵다","(A) 빠르게 / (B) 쉽다","(A) 똑같이 / (B) 어렵다","(A) 빠르게 / (B) 어렵다"],"opts":["(A) slower / (B) easy","(A) slower / (B) hard","(A) faster / (B) easy","(A) the same / (B) hard","(A) faster / (B) hard"],"r":{"a":"5) (A) faster / (B) hard","ev":"8, 10번 문장","s":[[8,"Clocks on the moon go 56 microseconds faster than on Earth each day.","달에서의 시계는 지구에서보다 매일 56마이크로초 더 빨리 간다."],[10,"These problems make it hard to know the correct time on the moon.","이 문제들은 달에서의 정확한 시간을 알기 어렵게 만든다."]],"w":"8번: 달의 시계는 지구보다 매일 56마이크로초 faster(더 빨리) 감. 10번: 그래서 정확한 시간을 아는 것이 hard(어렵다). slower(더 느리게)나 the same(똑같이)은 8번과 다르고, easy(쉬운)는 10번과 반대.","c":5},"h":"15e7c53b5f"},{"n":10,"t":"fill","q":"A new [A] for time on the moon would make things easier for everyone, but finding the best way to make this happen is not [B].","ko":"달에서의 새로운 시간 [A]는 모두에게 일을 더 쉽게 만들겠지만, 이것을 실현할 최선의 방법을 찾는 것은 [B] 일이 아니다.","bko":{"system":"체계","easy":"쉬운","hard":"어려운","correct":"정확한","planet":"행성","special":"특별한"},"bank":["system","easy","hard","correct","planet","special"],"r":{"a":"[A] system, [B] easy","ev":"5~6번 문장","s":[[5,"A new system for time on the moon would make things easier for everyone.","달에서의 새로운 시간 체계는 모두에게 일을 더 쉽게 만들 것이다."],[6,"But finding the best way to make this happen is not easy.","하지만 이것을 실현하기 위한 최선의 방법을 찾는 것은 쉽지 않다."]],"w":"5번에서 A new system for time on the moon(달에서의 새로운 시간 체계)이 일을 더 쉽게 만들 것이라고 하고, 6번에서 But 뒤에 최선의 방법을 찾는 것은 not easy(쉽지 않다)라고 함. hard(어려운)를 넣으면 not hard가 되어 But의 대조가 깨짐. correct(정확한), planet(행성), special(특별한)은 이 자리에 맞지 않음.","c":null},"h":"f03fc9dea8"}]},{"u":8,"id":"rg4-08-3","no":3,"ko":"일부러 자신을 묶어 둔 영웅 이야기","items":[{"n":1,"t":"tf","q":"One group in the experiment was given strict deadlines.","ko":"실험에서 한 그룹은 엄격한 마감 기한이 주어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"One group was given strict deadlines, while another could turn in their reports anytime.","한 그룹은 엄격한 마감 기한이 주어진 반면, 또 다른 그룹은 리포트를 언제든 제출할 수 있었다."]],"w":"3번 문장에 One group was given strict deadlines가 그대로 나옴. 본문과 일치.","c":"T"},"h":"534d63c79b"},{"n":2,"t":"tf","q":"In the third group, the professor chose the deadlines for the students.","ko":"세 번째 그룹에서는 교수가 학생들을 위해 마감 기한을 정해 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In the third group, he allowed students to choose their own deadlines.","세 번째 그룹에서는, 그는 학생들이 각자 자신의 마감 기한을 선택하도록 허락했다."]],"w":"4번 문장에서 세 번째 그룹은 students가 own deadlines(자신의 마감 기한)를 choose(고르다)하도록 허락받았다고 함. 교수가 정해 준 것이 아니라 학생들이 직접 정함.","c":"F"},"h":"959a519846"},{"n":3,"t":"tf","q":"Ulysses did not want to hear the Sirens’ songs at all.","ko":"율리시스는 세이렌의 노래를 전혀 듣고 싶어 하지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Ulysses really wanted to hear Sirens’ songs, but Sirens were believed to use their songs to attract sailors and make their ships sink.","율리시스는 세이렌의 노래를 정말 듣고 싶었지만, 세이렌은 자신들의 노래로 선원들의 마음을 끌어 배를 가라앉게 하는 것으로 여겨졌다."]],
