<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 스타터 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<header><p style="margin:0 0 6px"><a href="../" style="font-weight:700;color:inherit">← 클래스 활동</a></p><h1>해커스 리딩스마트 스타터 2 Exit Test</h1><p class="sub">Reading별 10문항</p></header>

<script>
var P=[{"u":1,"id":"hs2-01-1","no":1,"ko":"오늘의 날씨는요~","items":[{"n":1,"t":"tf","q":"A closed pine cone means that it is going to rain soon.","ko":"닫힌 솔방울은 곧 비가 올 것이라는 것을 의미한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"If a pine cone is closed tight, it is going to rain soon.","만약 솔방울이 단단히 닫혀있다면, 곧 비가 올 것이다."]],"w":"6번 문장에서 솔방울이 단단히 닫혀 있으면 곧 비가 올 것이라고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"7471bf6cf3"},{"n":2,"t":"tf","q":"Pine cones open in the rain to spread their seeds.","ko":"솔방울은 씨앗을 퍼뜨리기 위해 비 오는 날에 열린다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"In dry weather, they open to spread their seeds.","건조한 날씨에는, 그것들은 씨앗들을 퍼뜨리기 위해 열린다."]],"w":"8번 문장에서 솔방울이 씨앗을 퍼뜨리려고 여는 때는 건조한 날씨(dry weather)예요. 비 오는 날이라는 말은 반대예요.","c":"F"},"h":"8f7c1768c4"},{"n":3,"t":"tf","q":"The wind carries the seeds of pine cones far away.","ko":"바람이 솔방울의 씨앗을 멀리 운반한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"The seeds are carried far away by the wind and set on the ground.","씨앗들은 바람에 의해 멀리 운반되어 땅에 놓인다."]],"w":"9번 문장에서 씨앗들은 바람에 의해 멀리 운반된다(carried far away by the wind)고 해요. 본문과 맞아요.","c":"T"},"h":"d014a944c5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Pine cones close to protect the seeds from getting wet.)","ko":"솔방울은 씨앗이 젖는 것으로부터 protect하기 위해 닫힌다.","opts":["퍼뜨리다","모으다","보호하다","씻다"],"word":"protect","r":{"a":"3) 보호하다","ev":"11번 문장","s":[[11,"When it is about to rain, pine cones close to protect the seeds from getting wet.","막 비가 오려고 할 때, 솔방울은 씨앗들을 젖는 것으로부터 보호하기 위해 닫힌다."]],"w":"비가 오려고 할 때 솔방울이 닫혀서 씨앗이 젖지 않게 해요. 그러니 protect는 '보호하다'예요.","c":3},"h":"6311fc4336"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Pine cones are nature’s weather forecasters!)","ko":"솔방울은 자연의 weather forecasters이다!","opts":["예보관","요리사","농부","경찰"],"word":"forecasters","r":{"a":"1) 예보관","ev":"2번 문장","s":[[2,"Pine cones are nature’s weather forecasters!","솔방울은 자연의 일기 예보관이다!"]],"w":"솔방울이 열리고 닫히는 모습으로 앞으로의 날씨를 알려 주니까 forecaster는 '예보관'이에요.","c":1},"h":"5df0354fd4"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt means the weather will be sunny and dry.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 날씨가 화창하고 건조할 것이라는 것을 의미한다.","opts":["열린 솔방울","뉴스","닫힌 솔방울","바람"],"r":{"a":"1) 열린 솔방울","ev":"4~5번 문장","s":[[4,"You see an open pine cone.","당신은 열린 솔방울을 본다."],[5,"It means the weather will be sunny and dry.","그것은 날씨가 화창하고 건조할 것이라는 것을 의미한다."]],"w":"4번에서 열린 솔방울을 본다고 했고, 5번 It은 그 열린 솔방울이 의미하는 것을 말해요. 닫힌 솔방울은 비가 온다는 뜻이에요(6번).","c":1},"h":"b0b0b8fdbe"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The next time you see a pine cone, check it for a weather report!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다음에 당신이 솔방울을 본다면, 일기 예보를 (얻기) 위해 그것을 확인해라!","opts":["솔방울을 볼 때마다 뉴스를 켜 보아라.","솔방울을 보면 땅에 심어 보아라.","솔방울이 닫혀 있으면 확인하지 말아라.","다음에 솔방울을 보면, 그것으로 날씨를 확인해 보아라."],"r":{"a":"4) 다음에 솔방울을 보면, 그것으로 날씨를 확인해 보아라.","ev":"12번 문장","s":[[12,"The next time you see a pine cone, check it for a weather report!","다음에 당신이 솔방울을 본다면, 일기 예보를 (얻기) 위해 그것을 확인해라!"]],"w":"check it for a weather report는 일기 예보를 얻으려고 솔방울을 확인하라는 말이에요. 뉴스는 볼 필요가 없다고 했어요(1번).","c":4},"h":"935cc61a9c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["솔방울은 화창하고 건조한 날씨에 닫힌다.","건조한 날씨에 씨앗은 솔방울 안에 그대로 머문다.","솔방울은 비가 오려고 할 때 닫힌다.","닫힌 솔방울은 날씨가 화창할 것이라는 뜻이다."],"opts":["Pine cones close in sunny and dry weather.","The seeds stay inside the pine cone in dry weather.","Pine cones close when it is about to rain.","A closed pine cone means the weather will be sunny."],"r":{"a":"3) Pine cones close when it is about to rain.","ev":"11번 문장","s":[[11,"When it is about to rain, pine cones close to protect the seeds from getting wet.","막 비가 오려고 할 때, 솔방울은 씨앗들을 젖는 것으로부터 보호하기 위해 닫힌다."]],"w":"11번 문장에서 비가 오려고 할 때 솔방울이 닫힌다고 해요. 건조할 때는 열리고(8번), 닫힌 솔방울은 비가 온다는 뜻이에요(6번).","c":3},"h":"dc0f19f443"},{"n":9,"t":"sum","q":"Pine cones (A) in dry weather to spread their seeds, and they (B) when it is about to rain to protect the seeds.","ko":"솔방울은 건조한 날씨에는 씨앗을 퍼뜨리기 위해 (A), 비가 오려고 할 때는 씨앗을 보호하기 위해 (B).","oko":["(A) 닫힌다 / (B) 열린다","(A) 닫힌다 / (B) 닫힌다","(A) 열린다 / (B) 열린다","(A) 자란다 / (B) 닫힌다","(A) 열린다 / (B) 닫힌다"],"opts":["(A) close / (B) open","(A) close / (B) close","(A) open / (B) open","(A) grow / (B) close","(A) open / (B) close"],"r":{"a":"5) (A) open / (B) close","ev":"8번, 11번 문장","s":[[8,"In dry weather, they open to spread their seeds.","건조한 날씨에는, 그것들은 씨앗들을 퍼뜨리기 위해 열린다."],[11,"When it is about to rain, pine cones close to protect the seeds from getting wet.","막 비가 오려고 할 때, 솔방울은 씨앗들을 젖는 것으로부터 보호하기 위해 닫힌다."]],"w":"8번에서 건조한 날씨에는 씨앗을 퍼뜨리려고 열리고(open), 11번에서 비가 오려고 할 때는 씨앗을 보호하려고 닫혀요(close).","c":5},"h":"c2e7f4eb1e"},{"n":10,"t":"fill","q":"The seeds are [A] far away by the wind and [B] into new trees.","ko":"씨앗들은 바람에 의해 멀리 [A], 새로운 나무로 [B].","bank":["carried","grow","protect","open","wet","soon"],"bko":{"carried":"운반된","grow":"자란다","protect":"보호하다","open":"열리다","wet":"젖은","soon":"곧"},"r":{"a":"[A] carried, [B] grow","ev":"9~10번 문장","s":[[9,"The seeds are carried far away by the wind and set on the ground.","씨앗들은 바람에 의해 멀리 운반되어 땅에 놓인다."],[10,"They grow into new trees.","그것들은 새로운 나무로 자란다."]],"w":"9번 The seeds are carried far away by the wind, 10번 They grow into new trees에서 가져왔어요. 나머지 단어는 이 문장에 들어가면 뜻이 맞지 않아요.","c":null},"h":"2651bb4211"}]},{"u":1,"id":"hs2-01-2","no":2,"ko":"세상에 이런 파이가?","items":[{"n":1,"t":"tf","q":"Because of the snow, people could not travel.","ko":"눈 때문에 사람들은 이동할 수 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The snow made travel impossible.","눈은 이동을 불가능하게 만들었다."]],"w":"5번 문장에서 눈이 이동을 불가능하게 만들었다(The snow made travel impossible)고 해요. 본문과 맞아요.","c":"T"},"h":"80ac9b3a0b"},{"n":2,"t":"tf","q":"The fisherman returned from the sea with only one type of fish.","ko":"어부는 오직 한 종류의 생선만 가지고 바다에서 돌아왔다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Luckily, a brave fisherman went out to sea and returned with seven types of fish!","운 좋게도, 한 용감한 어부가 바다로 나가서 일곱 종류의 생선을 가지고 돌아왔다!"]],"w":"7번 문장에서 어부는 일곱 종류의 생선(seven types of fish)을 가지고 돌아왔어요. 한 종류라는 말은 틀려요.","c":"F"},"h":"5b0c4bfbda"},{"n":3,"t":"tf","q":"Most people think pies are sweet desserts.","ko":"대부분의 사람들은 파이가 달콤한 디저트라고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Most people think pies are sweet desserts with fruit or chocolate inside.","대부분의 사람들은 파이가 안에 과일이나 초콜릿이 들어 있는 달콤한 디저트라고 생각한다."]],"w":"1번 문장에서 대부분의 사람들은 파이를 과일이나 초콜릿이 든 달콤한 디저트라고 생각한다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"f0e766f7c5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Luckily, a brave fisherman went out to sea.)","ko":"운 좋게도, 한 brave 어부가 바다로 나갔다.","opts":["겁 많은","용감한","게으른","나이 많은"],"word":"brave","r":{"a":"2) 용감한","ev":"7번 문장","s":[[7,"Luckily, a brave fisherman went out to sea and returned with seven types of fish!","운 좋게도, 한 용감한 어부가 바다로 나가서 일곱 종류의 생선을 가지고 돌아왔다!"]],"w":"눈 때문에 아무도 음식을 구하지 못할 때 바다로 나가 생선을 가져온 어부예요. 그러니 brave는 '용감한'이에요.","c":2},"h":"8e68062827"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He wanted to show the hungry people that the pie contained fish.)","ko":"그는 배고픈 사람들에게 그 파이에 생선이 contained 것을 보여주고 싶었다.","opts":["~을 요리했다","~을 버렸다","~이 들어 있었다","~을 팔았다"],"word":"contained","r":{"a":"3) ~이 들어 있었다","ev":"9번 문장","s":[[9,"He wanted to show the hungry people that the pie contained fish.","그는 배고픈 사람들에게 그 파이에 생선이 들어 있다는 것을 보여주고 싶었다."]],"w":"파이 안에 생선이 들어 있다는 것을 보여 주려고 생선 머리를 튀어나오게 했어요. 그러니 contain은 '~이 들어 있다'예요.","c":3},"h":"bd7e03fb79"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nHe baked a pie with them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그는 그것들로 파이를 구웠다.","opts":["일곱 종류의 생선","배고픈 사람들","파이 두 개","해안 마을 사람들"],"r":{"a":"1) 일곱 종류의 생선","ev":"7~8번 문장","s":[[7,"Luckily, a brave fisherman went out to sea and returned with seven types of fish!","운 좋게도, 한 용감한 어부가 바다로 나가서 일곱 종류의 생선을 가지고 돌아왔다!"],[8,"He baked a pie with them.","그는 그것들로 파이를 구웠다."]],"w":"7번에서 어부가 일곱 종류의 생선을 가지고 돌아왔고, 8번에서 그 생선으로 파이를 구웠어요. them은 그 생선들이에요.","c":1},"h":"b84106169d"},{"n":7,"t":"sense","q":"Which is th players holding the ball.","A team that drops the ball restarts the game.","The team with the fewest points wins the game."],"r":{"a":"3) A team that drops the ball restarts the game.","ev":"11번 문장","s":[[11,"And the team that dropped the ball restarts the game.","그리고 공을 떨어뜨린 팀이 경기를 다시 시작한다."]],"w":"11번에서 공을 떨어뜨린 팀이 경기를 다시 시작한다고 해요. 킨볼은 세 팀(3번), 공격수는 네 번째 선수(7번), 이기는 팀은 가장 많은 점수를 가진 팀(13번)이에요.","c":3},"h":"2aef51f36e"},{"n":9,"t":"sum","q":"In Kin-Ball, the (A) calls another team and hits the ball. If the named team (B) the ball, the other two teams get a point.","ko":"킨볼에서 (A)는 다른 팀을 부르고 공을 친다. 지명된 팀이 공을 (B) 다른 두 팀이 점수를 얻는다.","oko":["(A) 공격수 / (B) 잡으면","(A) 공 / (B) 잡으면","(A) 공격수 / (B) 숨기면","(A) 공 / (B) 떨어뜨리면","(A) 공격수 / (B) 떨어뜨리면"],"opts":["(A) striker / (B) catches","(A) ball / (B) catches","(A) striker / (B) hides","(A) ball / (B) drops","(A) striker / (B) drops"],"r":{"a":"5) (A) striker / (B) drops","ev":"8번, 10번 문장","s":[[8,"The striker calls another team and hits the ball.","공격수는 다른 팀을 부르고 공을 친다."],[10,"If they drop it, the other two teams get a point.","만약 그들이 그것을 떨어뜨리면, 다른 두 팀이 점수를 얻는다."]],"w":"8번에서 다른 팀을 부르고 공을 치는 것은 공격수(striker)이고, 10번에서 지명된 팀이 공을 떨어뜨리면(drops) 다른 두 팀이 점수를 얻어요. 잡으면 다른 팀 쪽으로 공을 쳐요(9번).","c":5},"h":"af8f422087"},{"n":10,"t":"fill","q":"Three players [A] up the giant ball together, and the fourth player is the [B].","ko":"세 명의 선수는 함께 거대한 공을 [A] 올리고, 네 번째 선수는 [B]이다.","bank":["hold","striker","earn","restart","players","team"],"bko":{"hold":"들다","striker":"공격수","earn":"얻다","restart":"다시 시작하다","players":"선수들","team":"팀"},"r":{"a":"[A] hold, [B] striker","ev":"6~7번 문장","s":[[6,"Three players hold up the giant ball together.","세 명의 선수는 함께 거대한 공을 들어 올린다."],[7,"The fourth player is a striker.","네 번째 선수는 공격수이다."]],"w":"6번 Three players hold up the giant ball, 7번 The fourth player is a striker에서 가져왔어요. 나머지 단어는 이 빈칸에 넣으면 뜻이 맞지 않아요.","c":null},"h":"de19c2e4c3"}]},{"u":2,"id":"hs2-02-1","no":1,"ko":"내 이름의 의미는…","items":[{"n":1,"t":"tf","q":"The Romans named Mercury after the god of speed.","ko":"로마인들은 속도의 신의 이름을 따서 Mercury의 이름을 지었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장에 They named it after the god of speed, Mercury.가 있어요. 빠르게 움직이는 행성에 속도의 신 이름을 붙였다는 내용과 일치해요.","c":"T","s":[[6,"They named it after the god of speed, Mercury.","그들은 속도의 신 Mercury의 이름을 따서 그것의 이름을 지었어요."]]},"h":"87531fb718"},{"n":2,"t":"tf","q":"Earth was named after a Roman god.","ko":"지구는 로마 신의 이름을 따서 이름 지어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","w":"11번 문장에서 Earth was not named after a god라고 해요. 신의 이름을 땄다는 말은 반대예요.","c":"F","s":[[11,"Earth was not named after a god.","지구는 신의 이름을 따서 이름 지어지지 않았어요."]]},"h":"49b06af8c1"},{"n":3,"t":"tf","q":"The name Earth came from an Old English word.","ko":"Earth라는 이름은 고대 영어 단어에서 유래했다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","w":"12번 문장에 It came from an Old English word that means “ground.”가 있어요. Earth라는 이름은 '땅'을 뜻하는 고대 영어 단어에서 왔어요.","c":"T","s":[[12,"It came from an Old English word that means “ground.”","그것은 ‘땅’을 의미하는 고대 영어 단어에서 유래했어요."]]},"h":"abba7e685f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They also noticed a planet that was red.)","ko":"그들은 또한 붉은 색인 행성을 알아차렸어요. (notice는 알아차리다)","opts":["잊어버렸다","이름 지었다","알아차렸다","떠나갔다"],"word":"noticed","r":{"a":"3) 알아차렸다","ev":"7번 문장","w":"7번 문장은 붉은 행성을 '알아차렸다'는 뜻이에요. notice(알아차리다)의 과거형이 noticed예요. 그래서 8번에서 전쟁의 신 Mars의 이름을 붙여요.","c":3,"s":[[7,"They also noticed a planet that was red.","그들은 또한 붉은 색인 행성을 알아차렸어요."]]},"h":"99cab8bdcf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Isn’t it the perfect name?)","ko":"완벽한 이름 아닌가요?","opts":["어려운","완벽한","오래된","위험한"],"word":"perfect","r":{"a":"2) 완벽한","ev":"13번 문장","w":"12번에서 지구라는 이름이 '땅'을 뜻하는 단어에서 왔다고 했어요. 그래서 13번에서 '딱 맞는, 완벽한 이름 아닌가요?'라고 물어요. perfect = 완벽한.","c":2,"s":[[13,"Isn’t it the perfect name?","완벽한 이름 아닌가요?"]]},"h":"289ce0fd8e"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThey named it after the god of speed, Mercury.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그들은 속도의 신 Mercury의 이름을 따서 그것의 이름을 지었어요.","opts":["속도의 신","매우 빠르게 움직이는 한 행성","고대 로마인들","붉은 색인 행성"],"r":{"a":"2) 매우 빠르게 움직이는 한 행성","ev":"5~6번 문장","w":"이름을 지어 준 대상은 5번에서 로마인들이 본 '매우 빠르게 움직이는 한 행성(one planet)'이에요. 속도의 신은 이름을 딴 쪽이고, 붉은 행성은 7번에서 따로 나와요.","c":2,"s":[[5,"For example, they saw one planet move very fast.","예를 들어, 그들은 한 행성이 매우 빠르게 움직이는 것을 보았어요."],[6,"They named it after the god of speed, Mercury.","그들은 속도의 신 Mercury의 이름을 따서 그것의 이름을 지었어요."]]},"h":"f74e5ce0c1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They thought red, the color of blood, was the color of this god.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 피의 색인 붉은색이 이 신의 색이라고 생각했죠.","opts":["그들은 피가 붉은 이유가 신 때문이라고 생각했다.","그들은 속도의 신이 붉은색을 싫어한다고 생각했다.","그들은 붉은 행성이 피처럼 뜨겁다고 생각했다.","그들은 피의 색인 붉은색이 전쟁의 신의 색이라고 생각했다."],"r":{"a":"4) 그들은 피의 색인 붉은색이 전쟁의 신의 색이라고 생각했다.","ev":"8~9번 문장","w":"8번에서 붉은 행성에 전쟁의 신 Mars의 이름을 붙였고, 9번에서 그 이유를 설명해요. 붉은색은 피의 색이라서 이 신(전쟁의 신)의 색이라고 생각했어요.","c":4,"s":[[8,"So they used the name of the god of war, Mars.","그래서 그들은 전쟁의 신 Mars의 이름을 사용했어요."],[9,"They thought red, the color of blood, was the color of this god.","그들은 피의 색인 붉은색이 이 신의 색이라고 생각했죠."]]},"h":"7604de9ee2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["로마인들은 지구에 신의 이름을 붙였다.","Mercury는 전쟁의 신의 이름이다.","Earth의 이름은 라틴어 단어에서 왔다.","Mars는 전쟁의 신의 이름을 딴 행성이다."],"opts":["The Romans named Earth after a god.","Mercury is the name of the god of war.","The name Earth came from a Latin word.","Mars was named after the god of war."],"r":{"a":"4) Mars was named after the god of war.","ev":"6~8번 문장, 11~12번 문장","w":"8번에서 붉은 행성에 전쟁의 신 Mars의 이름을 썼어요. 지구는 신의 이름을 딴 게 아니고(11번), Mercury는 속도의 신이에요(6번). Earth는 라틴어가 아니라 고대 영어 단어에서 왔어요(12번).","c":4,"s":[[6,"They named it after the god of speed, Mercury.","그들은 속도의 신 Mercury의 이름을 따서 그것의 이름을 지었어요."],[7,"They also noticed a planet that was red.","그들은 또한 붉은 색인 행성을 알아차렸어요."],[8,"So they used the name of the god of war, Mars.","그래서 그들은 전쟁의 신 Mars의 이름을 사용했어요."],[11,"Earth was not named after a god.","지구는 신의 이름을 따서 이름 지어지지 않았어요."],[12,"It came from an Old English word that means “ground.”","그것은 ‘땅’을 의미하는 고대 영어 단어에서 유래했어요."]]},"h":"60c7eba5e6"},{"n":9,"t":"sum","q":"The Romans named many planets after their (A). But the name of Earth came from an Old English word that means (B).","ko":"로마인들은 많은 행성의 이름을 그들의 (A)의 이름을 따서 지었다. 하지만 지구의 이름은 (B)를 의미하는 고대 영어 단어에서 유래했다.","oko":["(A) 왕 / (B) 땅","(A) 신 / (B) 하늘","(A) 친구 / (B) 바다","(A) 별 / (B) 물","(A) 신 / (B) 땅"],"opts":["(A) kings / (B) ground","(A) gods / (B) sky","(A) friends / (B) sea","(A) stars / (B) water","(A) gods / (B) ground"],"r":{"a":"5) (A) gods / (B) ground","ev":"4번 문장, 11~12번 문장","w":"4번에서 로마인들은 행성의 이름을 신들(gods)의 이름을 따서 지었어요. 12번에서 Earth는 '땅(ground)'을 의미하는 고대 영어 단어에서 왔어요.","c":5,"s":[[4,"The ancient Romans named many planets after their gods.","고대 로마인들은 그들의 신들의 이름을 따서 많은 행성의 이름을 지었어요."],[11,"Earth was not named after a god.","지구는 신의 이름을 따서 이름 지어지지 않았어요."],[12,"It came from an Old English word that means “ground.”","그것은 ‘땅’을 의미하는 고대 영어 단어에서 유래했어요."]]},"h":"d859717392"},{"n":10,"t":"fill","q":"The Romans named a fast planet after the god of [A] and a red planet after the god of [B].","ko":"로마인들은 빠른 행성은 [A]의 신의 이름을, 붉은 행성은 [B]의 신의 이름을 따서 지었다.","bank":["speed","war","ground","name","planet","color"],"bko":{"speed":"속도","war":"전쟁","ground":"땅","name":"이름","planet":"행성","color":"색"},"r":{"a":"[A] speed, [B] war","ev":"5~8번 문장","w":"5~6번에서 빠르게 움직이는 행성은 속도의 신(the god of speed) Mercury의 이름을 땄고, 7~8번에서 붉은 행성은 전쟁의 신(the god of war) Mars의 이름을 땄어요. ground는 지구의 이름과 관련된 말이라 맞지 않아요.","c":null,"s":[[5,"For example, they saw one planet move very fast.","예를 들어, 그들은 한 행성이 매우 빠르게 움직이는 것을 보았어요."],[6,"They named it after the god of speed, Mercury.","그들은 속도의 신 Mercury의 이름을 따서 그것의 이름을 지었어요."],[7,"They also noticed a planet that was red.","그들은 또한 붉은 색인 행성을 알아차렸어요."],[8,"So they used the name of the god of war, Mars.","그래서 그들은 전쟁의 신 Mars의 이름을 사용했어요."]]},"h":"3fafacc34f"}]},{"u":2,"id":"hs2-02-2","no":2,"ko":"‘구글’해 봐!","items":[{"n":1,"t":"tf","q":"Verbing means using a noun as a verb.","ko":"verbing은 명사를 동사로 사용하는 것을 뜻한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에 verbing: using a noun as a verb라고 있어요. 콜론(:) 뒤가 verbing의 뜻이에요.","c":"T","s":[[2,"This is an example of verbing: using a noun as a verb.","이것은 명사를 동사로 사용하는 동사화의 예시이다."]]},"h":"f220dbd5e0"},{"n":2,"t":"tf","q":"Gift, text, and friend were first used as verbs.","ko":"gift, text, friend는 처음에 동사로 사용되었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","w":"5번 문장에서 gift, text, friend는 원래 명사로만 사용되었다(originally used only as nouns)고 해요. 처음에 동사였다는 말은 반대예요.","c":"F","s":[[5,"For instance, gift, text, and friend were originally used only as nouns.","예를 들어, ‘gift’, ‘text’, 그리고 ‘friend’는 원래 명사로만 사용되었었다."]]},"h":"0f783695f6"},{"n":3,"t":"tf","q":"In English, it is very easy to turn a noun into a verb.","ko":"영어에서는 명사를 동사로 바꾸는 것이 매우 쉽다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","w":"9번 문장에 it is very easy to do in English가 있어요. it은 명사를 동사로 바꾸는 일이에요.","c":"T","s":[[9,"Also, it is very easy to do in English.","또한, 영어에서 그것은 매우 하기 쉽다."]]},"h":"20783bfa3f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Gift, text, and friend were originally used only as nouns.)","ko":"gift, text, friend는 원래 명사로만 사용되었다. (originally는 원래)","opts":["요즘","원래","가끔","곧바로"],"word":"originally","r":{"a":"2) 원래","ev":"5~6번 문장","w":"5번에서 '원래 명사로만 쓰였다'고 하고, 6번에서 But now(하지만 오늘날)로 지금은 동사로도 쓴다고 이어져요. originally = 원래, 처음에는.","c":2,"s":[[5,"For instance, gift, text, and friend were originally used only as nouns.","예를 들어, ‘gift’, ‘text’, 그리고 ‘friend’는 원래 명사로만 사용되었었다."],[6,"But now we use them as verbs, too.","하지만 오늘날 우리는 그것들을 동사로도 사용한다."]]},"h":"d4307f0d04"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It can make the meaning clearer.)","ko":"그것은 의미를 더 명확하게 만들 수 있다. (clear는 명확한)","opts":["더 짧은","더 어려운","더 조용한","더 명확한"],"word":"clearer","r":{"a":"4) 더 명확한","ev":"8번 문장","w":"8번은 명사를 동사로 바꾸는 이유(7번의 대답)예요. 이유가 되려면 의미가 더 '명확해진다'는 뜻이어야 해요. clearer = 더 명확한.","c":4,"s":[[8,"It can make the meaning clearer.","그것은 의미를 더 명확하게 만들 수 있다."]]},"h":"4f446666c9"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIt often happens in English.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것은 영어에서 종종 발생한다.","opts":["영어라는 언어","구글 검색","명사를 동사로 사용하는 것","동사를 명사로 바꾸는 것"],"r":{"a":"3) 명사를 동사로 사용하는 것","ev":"2~3번 문장","w":"2번에서 verbing(명사를 동사로 사용하는 것)을 소개했고, 3번의 It은 그것이 영어에서 종종 일어난다는 말이에요. 반대 방향(동사를 명사로)은 본문에 없어요.","c":3,"s":[[2,"This is an example of verbing: using a noun as a verb.","이것은 명사를 동사로 사용하는 동사화의 예시이다."],[3,"It often happens in English.","그것은 영어에서 종종 발생한다."]]},"h":"b7e98c6c10"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"All you have to do is put the noun in a verb position in the sentence.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 해야 하는 모든 것은 문장에서 명사를 동사 위치에 놓는 것이다.","opts":["명사를 문장의 동사 자리에 놓기만 하면 된다.","명사의 철자를 동사 모양으로 바꿔야 한다.","명사 앞에 동사를 하나 더 붙여야 한다.","문장에서 동사를 모두 없애야 한다."],"r":{"a":"1) 명사를 문장의 동사 자리에 놓기만 하면 된다.","ev":"10번 문장","w":"All you have to do is ~는 '~하기만 하면 된다'는 뜻이에요. 명사를 동사 자리에 놓기만 하면 돼요. 철자를 바꾼다는 말은 본문에 없어요.","c":1,"s":[[10,"All you have to do is put the noun in a verb position in the sentence.","당신이 해야 하는 모든 것은 문장에서 명사를 동사 위치에 놓는 것이다."]]},"h":"8c52c7060e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["gift, text, friend는 오늘날에도 명사로만 사용된다.","영어에서 동사화는 거의 일어나지 않는다.","영어는 변하지 않는 언어이다.","명사를 동사로 바꾸면 의미를 더 명확하게 만들 수 있다."],"opts":["Gift, text, and friend are used only as nouns today.","Verbing rarely happens in English.","The English language does not change.","Turning a noun into a verb can make the meaning clearer."],"r":{"a":"4) Turning a noun into a verb can make the meaning clearer.","ev":"3번 문장, 6번 문장, 8번 문장, 12번 문장","w":"8번에서 명사를 동사로 바꾸면 의미를 더 명확하게 만들 수 있다고 해요. gift, text, friend는 지금 동사로도 쓰이고(6번), 동사화는 영어에서 종종 일어나며(3번), 영어는 계속 변화해요(12번).","c":4,"s":[[3,"It often happens in English.","그것은 영어에서 종종 발생한다."],[6,"But now we use them as verbs, too.","하지만 오늘날 우리는 그것들을 동사로도 사용한다."],[8,"It can make the meaning clearer.","그것은 의미를 더 명확하게 만들 수 있다."],[12,"The English language keeps changing!","영어는 계속해서 변화한다!"]]},"h":"0e5ab8e885"},{"n":9,"t":"sum","q":"Many verbs began only as (A), but today we use them as (B), too.","ko":"많은 동사가 원래 (A)로만 시작했지만, 오늘날 우리는 그것들을 (B)로도 사용한다.","oko":["(A) 명사 / (B) 형용사","(A) 동사 / (B) 명사","(A) 형용사 / (B) 동사","(A) 동사 / (B) 형용사","(A) 명사 / (B) 동사"],"opts":["(A) nouns / (B) adjectives","(A) verbs / (B) nouns","(A) adjectives / (B) verbs","(A) verbs / (B) adjectives","(A) nouns / (B) verbs"],"r":{"a":"5) (A) nouns / (B) verbs","ev":"4번 문장, 6번 문장","w":"4번에서 많은 동사가 명사로 시작했다고 하고, 6번에서 오늘날은 그것들을 동사로도 사용한다고 해요. 그래서 (A)는 명사(nouns), (B)는 동사(verbs)예요.","c":5,"s":[[4,"In fact, many verbs began as nouns.","사실, 많은 동사가 명사로 시작되었다."],[6,"But now we use them as verbs, too.","하지만 오늘날 우리는 그것들을 동사로도 사용한다."]]},"h":"2209df5118"},{"n":10,"t":"fill","q":"Verbing can make the meaning [A], and it is easy because you only put the noun in a verb [B].","ko":"동사화는 의미를 [A] 만들 수 있고, 명사를 동사 [B]에 놓기만 하면 되기 때문에 쉽다.","bank":["clearer","position","harder","nouns","English","example"],"bko":{"clearer":"더 명확한","position":"자리, 위치","harder":"더 어려운","nouns":"명사들","English":"영어","example":"예시"},"r":{"a":"[A] clearer, [B] position","ev":"8번 문장, 10번 문장","w":"8번에서 의미를 더 명확하게(clearer) 만들 수 있다고 하고, 10번에서 명사를 동사 위치(position)에 놓기만 하면 된다고 해요. harder는 의미가 더 명확해진다는 내용과 반대예요.","c":null,"s":[[8,"It can make the meaning clearer.","그것은 의미를 더 명확하게 만들 수 있다."],[10,"All you have to do is put the noun in a verb position in the sentence.","당신이 해야 하는 모든 것은 문장에서 명사를 동사 위치에 놓는 것이다."]]},"h":"7f8b8b05e6"}]},{"u":2,"id":"hs2-02-3","no":3,"ko":"물방울무늬를 좋아하시나요?","items":[{"n":1,"t":"tf","q":"Most people did not like polka dots in the 1700s.","ko":"1700년대에 대부분의 사람들은 물방울무늬를 좋아하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","w":"4번 문장에 In the 1700s, most people did not like polka dots.가 있어요. 그대로 맞는 내용이에요.","c":"T","s":[[4,"In the 1700s, most people did not like polka dots.","1700년대에, 대부분의 사람들은 물방울무늬를 좋아하지 않았다."]]},"h":"83bcf9e365"},{"n":2,"t":"tf","q":"The pattern became popular in Asia in the 1800s.","ko":"그 무늬는 1800년대에 아시아에서 인기 있어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","w":"6번 문장에서 1800년대에 유럽(Europe)에서 인기 있어졌다고 해요. 아시아라는 말은 본문에 없어요.","c":"F","s":[[6,"In the 1800s, the pattern became popular in Europe.","1800년대에, 그 무늬는 유럽에서 인기 있어졌다."]]},"h":"948c6e335a"},{"n":3,"t":"tf","q":"Sewing machines could create perfect circles.","ko":"재봉틀은 완벽한 원을 만들어 낼 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~11번 문장","w":"10번에서 재봉틀이 발명되었다고 하고, 11번에서 They(재봉틀)는 완벽한 원을 만들어 낼 수 있었다고 해요.","c":"T","s":[[10,"Also, sewing machines were invented during this period.","또한, 이 시기 동안 재봉틀이 발명되었다."],[11,"They could create perfect circles.","그것들은 완벽한 원을 만들어 낼 수 있었다."]]},"h":"57ef1d04e1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (People thought the pattern matched the lively energy of the dance.)","ko":"사람들은 그 무늬가 그 춤의 활기찬 기운과 어울린다고 생각했다. (lively는 활기찬)","opts":["조용한","느린","활기찬","어두운"],"word":"lively","r":{"a":"3) 활기찬","ev":"8번 문장","w":"8번은 무늬가 춤의 기운과 어울린다는 말이에요. 춤의 기운과 어울린다고 했으니 '활기찬'이 알맞아요. lively = 활기찬.","c":3,"s":[[8,"People thought the pattern matched the lively energy of the dance.","사람들은 그 무늬가 그 춤의 활기찬 기운과 어울린다고 생각했다."]]},"h":"29717b1d44"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, sewing machines were invented during this period.)","ko":"또한, 이 시기 동안 재봉틀이 발명되었다. (invent는 발명하다)","opts":["팔렸다","수리되었다","사라졌다","발명되었다"],"word":"invented","r":{"a":"4) 발명되었다","ev":"10번 문장","w":"10번은 1800년대에 재봉틀이 생겼다는 말이에요. 이어지는 11번에서 재봉틀이 완벽한 원을 만들어 낼 수 있었다고 하니, '발명되었다'가 알맞아요. be invented = 발명되다.","c":4,"s":[[10,"Also, sewing machines were invented during this period.","또한, 이 시기 동안 재봉틀이 발명되었다."]]},"h":"7de8431b70"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was because of the polka dance.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 폴카 춤 때문이었다.","opts":["물방울무늬가 천연두를 떠올리게 한 일","1800년대에 물방울무늬가 유럽에서 인기 있어진 일","미니마우스가 드레스를 입은 일","사람들이 점을 싫어하게 된 일"],"r":{"a":"2) 1800년대에 물방울무늬가 유럽에서 인기 있어진 일","ev":"6~7번 문장","w":"7번의 It은 바로 앞 6번의 내용, 즉 1800년대에 그 무늬가 유럽에서 인기 있어진 일이에요. 그 이유가 폴카 춤이라는 말이에요.","c":2,"s":[[6,"In the 1800s, the pattern became popular in Europe.","1800년대에, 그 무늬는 유럽에서 인기 있어졌다."],[7,"It was because of the polka dance.","그것은 폴카 춤 때문이었다."]]},"h":"12302548cd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Spots made them think of diseases like smallpox.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"점들은 그들이 천연두와 같은 질병들을 떠올리게 했다.","opts":["점들을 보면 사람들은 천연두 같은 병이 떠올랐다.","점들 때문에 사람들이 천연두에 걸렸다.","점들이 천연두를 낫게 해 주었다.","사람들은 점을 보고 병을 고쳤다."],"r":{"a":"1) 점들을 보면 사람들은 천연두 같은 병이 떠올랐다.","ev":"5번 문장","w":"「make + 목적어 + 동사원형」은 'A가 ~하게 하다'예요. 점들이 사람들에게 질병을 '떠올리게(think of)' 했다는 뜻이고, 병에 걸렸다는 말은 아니에요.","c":1,"s":[[5,"Spots made them think of diseases like smallpox.","점들은 그들이 천연두와 같은 질병들을 떠올리게 했다."]]},"h":"f3da49d0b4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 무늬는 처음부터 인기가 있었다.","물방울무늬는 오늘날 거의 볼 수 없다.","1800년대 사람들은 그 무늬가 춤과 어울리지 않는다고 생각했다.","polka dots라는 이름은 춤에서 유래했다."],"opts":["The pattern was popular from the beginning.","Polka dots are rarely seen today.","People in the 1800s thought the pattern did not match the dance.","The name polka dots came from the dance."],"r":{"a":"4) The name polka dots came from the dance.","ev":"1번 문장, 3번 문장, 8~9번 문장","w":"9번에서 polka dots라는 이름도 폴카 춤에서 유래했다고 해요. 처음에는 인기가 없었고(3번), 오늘날 어디에나 있고(1번), 사람들은 무늬가 춤의 기운과 어울린다고 생각했어요(8번).","c":4,"s":[[1,"Today, polka dots are everywhere, from clothing to party decorations.","오늘날, 물방울무늬는 의류부터 파티 장식품들까지 어디에나 있다."],[3,"But the pattern wasn’t popular at first.","하지만 이 무늬는 처음에는 인기가 없었다."],[8,"People thought the pattern matched the lively energy of the dance.","사람들은 그 무늬가 그 춤의 활기찬 기운과 어울린다고 생각했다."],[9,"Even the name polka dots came from the dance.","물방울무늬라는 이름조차 그 춤에서 유래했다."]]},"h":"89aeb6672b"},{"n":9,"t":"sum","q":"Polka dots were (A) in the 1700s, but they became (B) in the 1800s.","ko":"물방울무늬는 1700년대에는 (A) 무늬였지만, 1800년대에는 (B) 무늬가 되었다.","oko":["(A) 인기 있는 / (B) 인기 있는","(A) 인기 없는 / (B) 인기 없는","(A) 인기 있는 / (B) 인기 없는","(A) 활기찬 / (B) 인기 있는","(A) 인기 없는 / (B) 인기 있는"],"opts":["(A) popular / (B) popular","(A) unpopular / (B) unpopular","(A) popular / (B) unpopular","(A) lively / (B) popular","(A) unpopular / (B) popular"],"r":{"a":"5) (A) unpopular / (B) popular","ev":"4번 문장, 6번 문장","w":"4번에서 1700년대에는 대부분의 사람들이 물방울무늬를 좋아하지 않았어요(인기 없음). 6번에서 1800년대에 유럽에서 인기 있어졌어요. (A)는 인기 없는(unpopular), (B)는 인기 있는(popular)이에요.","c":5,"s":[[4,"In the 1700s, most people did not like polka dots.","1700년대에, 대부분의 사람들은 물방울무늬를 좋아하지 않았다."],[6,"In the 1800s, the pattern became popular in Europe.","1800년대에, 그 무늬는 유럽에서 인기 있어졌다."]]},"h":"249edfbd03"},{"n":10,"t":"fill","q":"Sewing machines could create perfect [A], so more and more people [B] in love with polka dots.","ko":"재봉틀은 완벽한 [A]을 만들어 낼 수 있었고, 그래서 점점 더 많은 사람들이 물방울무늬와 사랑에 [B].","bank":["circles","fell","dance","energy","Europe","name"],"bko":{"circles":"원들","fell":"빠졌다","dance":"춤","energy":"기운","Europe":"유럽","name":"이름"},"r":{"a":"[A] circles, [B] fell","ev":"10~12번 문장","w":"11번에서 재봉틀은 완벽한 원(perfect circles)을 만들어 낼 수 있었고, 12번에서 점점 더 많은 사람들이 물방울무늬와 사랑에 빠졌다(fell in love)고 해요. 12번의 fell은 fall(빠지다)의 과거형이에요.","c":null,"s":[[10,"Also, sewing machines were invented during this period.","또한, 이 시기 동안 재봉틀이 발명되었다."],[11,"They could create perfect circles.","그것들은 완벽한 원을 만들어 낼 수 있었다."],[12,"More and more people fell in love with polka dots!","점점 더 많은 사람들이 물방울무늬와 사랑에 빠졌다!"]]},"h":"f66155689a"}]},{"u":3,"id":"hs2-03-1","no":1,"ko":"제가 대신 해보겠습니다","items":[{"n":1,"t":"tf","q":"The driver had heard Einstein’s lecture more than 30 times.","ko":"운전기사는 아인슈타인의 강의를 30번 이상 들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장에서 운전기사가 I have heard your lecture more than 30 times라고 말해요. 30번 이상 들었다는 내용과 일치해요.","c":"T","s":[[3,"“Professor Einstein, I have heard your lecture more than 30 times.","“아인슈타인 교수님, 저는 당신의 강의를 30번 이상 들어왔어요."]]},"h":"34c1e301ad"},{"n":2,"t":"tf","q":"Einstein put on the driver’s hat at the next university.","ko":"아인슈타인은 다음 대학에서 운전기사의 모자를 썼다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","w":"6번 문장에서 모자를 쓴 사람은 운전기사이고, 쓴 것도 아인슈타인의 모자예요. 주어와 모자 주인이 뒤바뀌었어요.","c":"F","s":[[6,"So at the next university, the driver put on Einstein’s hat as a disguise.","그래서 다음 대학에서, 운전기사는 아인슈타인의 모자를 변장 도구로 썼다."]]},"h":"5f8bc46380"},{"n":3,"t":"tf","q":"Einstein stood up and responded to the question at the end.","ko":"아인슈타인은 마지막에 일어서서 질문에 대답했다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","w":"13번 문장에 Einstein stood up and responded to the question이 그대로 나와요. 일치해요.","c":"T","s":[[13,"Then, Einstein stood up and responded to the question!","그러자, 아인슈타인이 일어서서 그 질문에 대답했다!"]]},"h":"34b30d483e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So at the next university, the driver put on Einstein’s hat as a disguise.)","ko":"그래서 다음 대학에서, 운전기사는 아인슈타인의 모자를 변장 도구로 썼다.","opts":["기념품","변장 도구","선물","명찰"],"word":"disguise","r":{"a":"2) 변장 도구","ev":"6번 문장","w":"운전기사가 아인슈타인처럼 보이려고 아인슈타인의 모자를 쓴 거예요. 그래서 disguise = 변장(도구)이에요.","c":2,"s":[[6,"So at the next university, the driver put on Einstein’s hat as a disguise.","그래서 다음 대학에서, 운전기사는 아인슈타인의 모자를 변장 도구로 썼다."]]},"h":"57867b62f9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (One day, his driver said something interesting.)","ko":"어느 날, 그의 운전기사가 흥미로운 무언가를 말했다.","opts":["지루한","위험한","슬픈","흥미로운"],"word":"interesting","r":{"a":"4) 흥미로운","ev":"2번 문장","w":"운전기사가 '내가 강의할 수 있다'는 뜻밖의 말을 꺼내요(3~4번). 그래서 interesting = 흥미로운이에요.","c":4,"s":[[2,"One day, his driver said something interesting.","어느 날, 그의 운전기사가 흥미로운 무언가를 말했다."]]},"h":"d4a5db2fce"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nEinstein decided to let him try.","ko":"밑줄 친 him이 가리키는 것은?","sko":"아인슈타인은 그가 시도하게 하기로 결정했다.","opts":["청중 한 명","아인슈타인","운전기사","질문한 사람"],"r":{"a":"3) 운전기사","ev":"2~5번 문장","w":"2~4번에서 내가 강의할 수 있다고 말한 사람은 운전기사예요. 아인슈타인이 그에게 해 보게 하기로 했으니 him = 운전기사예요.","c":3,"s":[[2,"One day, his driver said something interesting.","어느 날, 그의 운전기사가 흥미로운 무언가를 말했다."],[3,"“Professor Einstein, I have heard your lecture more than 30 times.","“아인슈타인 교수님, 저는 당신의 강의를 30번 이상 들어왔어요."],[4,"I think I can give the lecture.”","저는 제가 그 강의를 할 수 있다고 생각합니다.”"],[5,"Einstein decided to let him try.","아인슈타인은 그가 시도하게 하기로 결정했다."]]},"h":"9b98111f15"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Einstein was sitting with the audience and thought, ‘Oh, now we’re in trouble.’\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아인슈타인은 청중과 함께 앉아 있었고 “오, 이제 우리는 큰일 났군”이라고 생각했다.","opts":["아인슈타인은 청중과 함께 앉아서 이제 곤란해졌다고 생각했다.","아인슈타인은 무대에 서서 질문이 쉽다고 생각했다.","아인슈타인은 운전기사와 앉아서 큰일 났다고 대답했다.","아인슈타인은 청중에게 이제 곤란해졌다고 말했다."],"r":{"a":"1) 아인슈타인은 청중과 함께 앉아서 이제 곤란해졌다고 생각했다.","ev":"9번 문장","w":"was sitting with the audience는 청중과 앉아 있었다는 뜻이고, thought는 생각했다는 뜻이에요(말한 것이 아님). 어려운 질문이 나와서 곤란하다는 뜻이에요.","c":1,"s":[[9,"Einstein was sitting with the audience and thought, “Oh, now we’re in trouble.”","아인슈타인은 청중과 함께 앉아 있었고 “오, 이제 우리는 큰일 났군”이라고 생각했다."]]},"h":"162201f76f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아인슈타인은 한 대학에서만 강의를 했다.","운전기사는 자기 모자를 쓰고 강의를 했다.","아인슈타인은 무대 위에서 질문을 기다렸다.","강의가 끝나자 누군가가 매우 어려운 질문을 했다."],"opts":["Einstein gave his lecture at only one university.","The driver wore his own hat to give the lecture.","Einstein waited on the stage for the question.","Someone asked a very difficult question after the lecture."],"r":{"a":"4) Someone asked a very difficult question after the lecture.","ev":"8번 문장","w":"8번 문장에서 운전기사가 말을 끝내자 누군가가 아주 어려운 질문을 했어요. 아인슈타인은 여러 대학에서 강의했고(1번), 모자는 아인슈타인의 것이며(6번), 청중석에 앉아 있었어요(9번).","c":4,"s":[[8,"When he finished speaking, someone asked a very difficult question.","그가 말하는 것을 끝냈을 때, 누군가가 매우 어려운 질문을 했다."]]},"h":"37c3927468"},{"n":9,"t":"sum","q":"The driver put on Einstein’s hat and gave the (A). Then someone asked a very (B) question.","ko":"운전기사는 아인슈타인의 모자를 쓰고 (A)을 했다. 그러자 누군가가 매우 (B) 질문을 했다.","oko":["(A) 강의 / (B) 쉬운","(A) 질문 / (B) 어려운","(A) 모자 / (B) 지루한","(A) 강의 / (B) 어려운","(A) 대답 / (B) 간단한"],"opts":["(A) lecture / (B) easy","(A) question / (B) difficult","(A) hat / (B) boring","(A) lecture / (B) difficult","(A) answer / (B) simple"],"r":{"a":"4) (A) lecture / (B) difficult","ev":"6~8번 문장","w":"6~7번에서 운전기사가 아인슈타인의 강의(lecture)를 완벽하게 해요. 8번에서 누군가가 어려운(difficult) 질문을 해요.","c":4,"s":[[6,"So at the next university, the driver put on Einstein’s hat as a disguise.","그래서 다음 대학에서, 운전기사는 아인슈타인의 모자를 변장 도구로 썼다."],[7,"He gave Einstein’s lecture perfectly.","그는 아인슈타인의 강의를 완벽하게 했다."],[8,"When he finished speaking, someone asked a very difficult question.","그가 말하는 것을 끝냈을 때, 누군가가 매우 어려운 질문을 했다."]]},"h":"2318029a24"},{"n":10,"t":"fill","q":"Einstein [A] up from his seat and [B] to the question at the end.","ko":"아인슈타인은 마지막에 자리에서 [A] 질문에 [B].","bank":["stood","responded","waited","asked","finished","thought"],"bko":{"stood":"일어섰다 (stand up)","responded":"대답했다","asked":"물었다","finished":"끝냈다","thought":"생각했다","waited":"기다렸다"},"r":{"a":"[A] stood, [B] responded","ev":"13번 문장","w":"13번 문장 Einstein stood up and responded to the question에서 가져왔어요. stand up(일어서다)의 과거형이 stood up이고, respond to(~에 대답하다)가 알맞아요.","c":null,"s":[[13,"Then, Einstein stood up and responded to the question!","그러자, 아인슈타인이 일어서서 그 질문에 대답했다!"]]},"h":"41db08958a"}]},{"u":3,"id":"hs2-03-2","no":2,"ko":"버섯의 무한 변신","items":[{"n":1,"t":"tf","q":"Mycelia are grown in a lab to make mushroom leather.","ko":"균사체는 버섯 가죽을 만들기 위해 실험실에서 재배된다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번 문장에서 To make leather, mycelia are grown in a lab이라고 해요. 일치해요.","c":"T","s":[[5,"To make leather, mycelia are grown in a lab.","가죽을 만들기 위해, 균사체는 실험실에서 재배된다."]]},"h":"52611cf2b9"},{"n":2,"t":"tf","q":"A lot of water is used to make mushroom leather.","ko":"버섯 가죽을 만드는 데 많은 물이 사용된다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","w":"12번 문장에서 little water(물이 거의 없는)가 쓰인다고 해요. 많은 물이라는 말은 반대예요.","c":"F","s":[[12,"This is because little water is used for its production.","이는 그것의 생산에 물이 거의 사용되지 않기 때문이다."]]},"h":"459952f70c"},{"n":3,"t":"tf","q":"Adidas is using mushroom leather to make shoes.","ko":"아디다스는 신발을 만들기 위해 버섯 가죽을 사용하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","w":"13번 문장에 Famous brands like Adidas are now using mushroom leather to make shoes라고 해요. 일치해요.","c":"T","s":[[13,"Famous brands like Adidas are now using mushroom leather to make shoes!","아디다스와 같은 유명한 브랜드들은 신발을 만들기 위해 이제 버섯 가죽을 사용하고 있다!"]]},"h":"151de1422a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (As they grow, the threads combine and naturally form a solid foam.)","ko":"그것들이 자라면서, 줄기들이 결합하고 견고한 거품을 자연적으로 형성한다.","opts":["투명한","견고한","차가운","얇은"],"word":"solid","r":{"a":"2) 견고한","ev":"6번 문장","w":"줄기들이 결합해서 만들어진 거품이 이어서 압축되어 직물이 돼요(7번). 그러니 solid foam은 단단한(견고한) 거품이에요.","c":2,"s":[[6,"As they grow, the threads combine and naturally form a solid foam.","그것들이 자라면서, 줄기들이 결합하고 견고한 거품을 자연적으로 형성한다."]]},"h":"105d6b2011"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, it is very soft and good for sensitive skin.)","ko":"또한, 그것은 매우 부드럽고 민감한 피부에 좋다.","opts":["튼튼한","건조한","가벼운","민감한"],"word":"sensitive","r":{"a":"4) 민감한","ev":"10번 문장","w":"very soft(매우 부드러운)와 함께 피부에 좋다고 하니 sensitive skin은 민감한 피부예요. 튼튼한(strong)과 가벼운(lightweight)은 9번에 나오는 다른 단어예요.","c":4,"s":[[10,"Also, it is very soft and good for sensitive skin.","또한, 그것은 매우 부드럽고 민감한 피부에 좋다."]]},"h":"a20c02a5a9"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAs they grow, the threads combine and naturally form a solid foam.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그것들이 자라면서, 줄기들이 결합하고 견고한 거품을 자연적으로 형성한다.","opts":["실험실","직물","균사체","버섯 가죽"],"r":{"a":"3) 균사체","ev":"5~6번 문장","w":"5번에서 실험실에서 재배되는 것은 mycelia(균사체)예요. 자라는 것(they grow)은 균사체이고, 그 줄기들이 결합해요.","c":3,"s":[[5,"To make leather, mycelia are grown in a lab.","가죽을 만들기 위해, 균사체는 실험실에서 재배된다."],[6,"As they grow, the threads combine and naturally form a solid foam.","그것들이 자라면서, 줄기들이 결합하고 견고한 거품을 자연적으로 형성한다."]]},"h":"9bc179beff"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Mushrooms are not just used in delicious dishes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"버섯이 단지 맛있는 요리에만 사용되는 것은 아니다.","opts":["버섯은 맛있는 요리에만 쓰이는 것은 아니다.","버섯은 맛있는 요리에 전혀 쓰이지 않는다.","버섯은 요리에만 쓰여야 한다.","버섯은 요리에서 가장 맛있는 재료이다."],"r":{"a":"1) 버섯은 맛있는 요리에만 쓰이는 것은 아니다.","ev":"1번 문장","w":"not just는 '단지 ~만은 아닌'이에요. 요리에도 쓰이지만 다른 쓰임도 있다는 뜻이고, 다음 문장(2번)에서 가죽을 만드는 데도 쓰인다고 이어져요.","c":1,"s":[[1,"Mushrooms are not just used in delicious dishes.","버섯이 단지 맛있는 요리에만 사용되는 것은 아니다."]]},"h":"783f362eb9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["버섯 가죽은 주방에서 만들어진다.","거품은 저어져서 직물이 된다.","버섯 가죽은 무겁고 약하다.","균사체는 뿌리처럼 역할을 하는 버섯의 가는 줄기이다."],"opts":["Mushroom leather is made in a kitchen.","The foam is stirred to become a fabric.","Mushroom leather is heavy and weak.","Mycelia are thin threads that act like the roots of mushrooms."],"r":{"a":"4) Mycelia are thin threads that act like the roots of mushrooms.","ev":"4번 문장","w":"4번 문장에서 균사체는 뿌리처럼 역할을 하는 버섯의 가는 줄기라고 해요. 가죽은 실험실에서 만들어지고(5번), 거품은 압축되며(7번), 가볍고 튼튼해요(9번).","c":4,"s":[[4,"Mycelia are thin threads on mushrooms that act like their roots.","균사체는 뿌리와 같은 역할을 하는 버섯의 가는 줄기이다."]]},"h":"7b923f2989"},{"n":9,"t":"sum","q":"Mushroom leather is (A) and strong. It is also very soft, so it is good for (B) skin.","ko":"버섯 가죽은 (A) 튼튼하다. 또한 매우 부드러워서 (B) 피부에 좋다.","oko":["(A) 무거운 / (B) 민감한","(A) 가벼운 / (B) 민감한","(A) 가벼운 / (B) 건조한","(A) 무거운 / (B) 건조한","(A) 비싼 / (B) 민감한"],"opts":["(A) heavy / (B) sensitive","(A) lightweight / (B) sensitive","(A) lightweight / (B) dry","(A) heavy / (B) dry","(A) expensive / (B) sensitive"],"r":{"a":"2) (A) lightweight / (B) sensitive","ev":"9~10번 문장","w":"9번에서 lightweight and strong, 10번에서 very soft and good for sensitive skin이라고 해요. 무겁다(heavy)거나 비싸다는 말은 없어요.","c":2,"s":[[9,"It is lightweight and strong.","그것은 가볍고 튼튼하다."],[10,"Also, it is very soft and good for sensitive skin.","또한, 그것은 매우 부드럽고 민감한 피부에 좋다."]]},"h":"81e40920b7"},{"n":10,"t":"fill","q":"The threads [A] and form a foam, and then the foam is [B] and becomes a fabric.","ko":"줄기들이 [A] 거품을 형성하고, 그러고 나서 그 거품이 [B] 직물이 된다.","bank":["combine","pressed","lab","roots","fabric","dishes"],"bko":{"combine":"결합하다","pressed":"압축된","lab":"실험실","roots":"뿌리","fabric":"직물","dishes":"요리"},"r":{"a":"[A] combine, [B] pressed","ev":"6~7번 문장","w":"6번 the threads combine and ~ form a solid foam, 7번 the foam is pressed and becomes a fabric에서 가져왔어요. 거품이 되는 과정은 줄기의 결합이고, 직물이 되려면 압축돼요.","c":null,"s":[[6,"As they grow, the threads combine and naturally form a solid foam.","그것들이 자라면서, 줄기들이 결합하고 견고한 거품을 자연적으로 형성한다."],[7,"Then, the foam is pressed and becomes a fabric.","그러고 나서, 그 거품이 압축되어 직물이 된다."]]},"h":"eee0a913d8"}]},{"u":3,"id":"hs2-03-3","no":3,"ko":"아테나?! 아테네!","items":[{"n":1,"t":"tf","q":"The name of Athens came from a Greek myth.","ko":"아테네의 이름은 그리스 신화에서 유래했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장에서 It came from a Greek myth라고 해요. 도시의 이름이 신화에서 왔다는 내용과 일치해요.","c":"T","s":[[3,"It came from a Greek myth.","그것은 그리스 신화에서 유래했다."]]},"h":"716ded3dc3"},{"n":2,"t":"tf","q":"The water of Poseidon’s spring was sweet.","ko":"포세이돈의 샘물은 달콤했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","w":"8번 문장에서 샘의 물은 매우 짰다(very salty)고 해요. 달콤했다는 말은 반대예요.","c":"F","s":[[8,"But the water of the spring was very salty.","하지만 그 샘의 물은 매우 짰다."]]},"h":"8b97bb7f2c"},{"n":3,"t":"tf","q":"Many olive trees are found near Athens today.","ko":"오늘날 아테네 근처에서는 많은 올리브 나무가 발견된다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","w":"13번 문장에 Even today, many olive trees are found near Athens라고 그대로 나와요. 일치해요.","c":"T","s":[[13,"Even today, many olive trees are found near Athens.","오늘날에도, 많은 올리브 나무들이 아테네 근처에서 발견된다."]]},"h":"50def1d575"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They both wanted to be the guardian of the city.)","ko":"그들 둘 다 도시의 수호자가 되고 싶어 했다.","opts":["시민","수호자","여신","선물"],"word":"guardian","r":{"a":"2) 수호자","ev":"5번 문장","w":"아테나와 포세이돈 둘 다 되고 싶어 한 것이고, 뒤에서 선택된 아테나의 이름을 따라 도시 이름이 지어져요(12번). 그래서 guardian = 수호자예요.","c":2,"s":[[5,"They both wanted to be the guardian of the city.","그들 둘 다 도시의 수호자가 되고 싶어 했다."]]},"h":"57d0989cfa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But the water of the spring was very salty.)","ko":"하지만 그 샘의 물은 매우 짰다.","opts":["단","매운","신","짠"],"word":"salty","r":{"a":"4) 짠","ev":"8~9번 문장","w":"물이 짜서 사람들이 마실 수 없었다는 흐름이에요(9번). 그래서 salty = 짠이에요.","c":4,"s":[[8,"But the water of the spring was very salty.","하지만 그 샘의 물은 매우 짰다."],[9,"People couldn’t drink it.","사람들은 그것을 마실 수 없었다."]]},"h":"1cd4c5b692"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nPeople couldn’t drink it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"사람들은 그것을 마실 수 없었다.","opts":["올리브 나무","포세이돈","샘의 물","아테네"],"r":{"a":"3) 샘의 물","ev":"8~9번 문장","w":"마실 수 있는 것은 물이에요. 8번에서 샘의 물이 매우 짰다고 했고, 9번의 it은 그 물이에요.","c":3,"s":[[8,"But the water of the spring was very salty.","하지만 그 샘의 물은 매우 짰다."],[9,"People couldn’t drink it.","사람들은 그것을 마실 수 없었다."]]},"h":"f875caf9c8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Athena was chosen as the guardian, and the city was named after her.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아테나는 수호자로 선택되었고, 그 도시는 그녀의 이름을 따서 이름 지어졌다.","opts":["아테나는 수호자로 선택되었고, 도시는 그녀의 이름을 따서 지어졌다.","아테나는 도시의 이름을 따서 수호자가 되었다.","아테나는 수호자를 선택했고, 도시에 이름을 주었다.","아테나는 수호자로 선택되었지만, 도시는 포세이돈의 이름을 따랐다."],"r":{"a":"1) 아테나는 수호자로 선택되었고, 도시는 그녀의 이름을 따서 지어졌다.","ev":"12번 문장","w":"was chosen은 '선택되었다'(선택받은 쪽이 아테나)이고, was named after her는 '그녀의 이름을 따서 지어졌다'예요. 그래서 도시 이름이 Athens가 돼요.","c":1,"s":[[12,"Athena was chosen as the guardian, and the city was named after her.","아테나는 수호자로 선택되었고, 그 도시는 그녀의 이름을 따서 이름 지어졌다."]]},"h":"f32c640da0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["포세이돈이 올리브 나무를 심었다.","포세이돈의 샘물은 달콤해서 사람들이 좋아했다.","아테나와 포세이돈은 둘 다 도시의 수호자가 되고 싶어 했다.","아테네는 이탈리아의 수도이다."],"opts":["Poseidon planted an olive tree.","People loved the sweet water of Poseidon’s spring.","Athena and Poseidon both wanted to be the guardian of the city.","Athens is the capital of Italy."],"r":{"a":"3) Athena and Poseidon both wanted to be the guardian of the city.","ev":"5번 문장","w":"5번 문장에서 둘 다 수호자가 되고 싶어 했다고 해요. 올리브 나무는 아테나가 심었고(10번), 샘물은 짜서 마실 수 없었고(8~9번), 아테네는 그리스의 수도예요(1번).","c":3,"s":[[5,"They both wanted to be the guardian of the city.","그들 둘 다 도시의 수호자가 되고 싶어 했다."]]},"h":"d6e0fad3cf"},{"n":9,"t":"sum","q":"People couldn’t (A) the salty water of Poseidon’s spring. They (B) Athena’s olive tree because it gave them food and oil.","ko":"사람들은 포세이돈의 샘의 짠 물을 (A) 수 없었다. 그들은 음식과 기름을 주었기 때문에 아테나의 올리브 나무를 (B).","oko":["(A) 마실 / (B) 싫어했다","(A) 살 / (B) 좋아했다","(A) 찾을 / (B) 두려워했다","(A) 심을 / (B) 잊었다","(A) 마실 / (B) 좋아했다"],"opts":["(A) drink / (B) hated","(A) buy / (B) loved","(A) find / (B) feared","(A) plant / (B) forgot","(A) drink / (B) loved"],"r":{"a":"5) (A) drink / (B) loved","ev":"8~11번 문장","w":"8~9번에서 물이 짜서 마실(drink) 수 없었어요. 10~11번에서 올리브 나무가 음식과 기름을 줘서 사람들이 좋아했어요(loved).","c":5,"s":[[8,"But the water of the spring was very salty.","하지만 그 샘의 물은 매우 짰다."],[9,"People couldn’t drink it.","사람들은 그것을 마실 수 없었다."],[10,"On the other hand, Athena planted an olive tree.","반면에, 아테나는 올리브 나무를 심었다."],[11,"People loved the tree because it provided food and oil.","그것이 음식과 기름을 제공했기 때문에 사람들은 그 나무를 좋아했다."]]},"h":"2b0b44a742"},{"n":10,"t":"fill","q":"They tried to [A] the citizens with gifts, and Poseidon [B] a spring.","ko":"그들은 선물로 시민들의 마음을 [A] 위해 노력했고, 포세이돈은 샘을 [B].","bank":["attract","created","planted","drink","chosen","fought"],"bko":{"attract":"마음을 끌다","created":"만들어 냈다","planted":"심었다","drink":"마시다","chosen":"선택된","fought":"싸웠다"},"r":{"a":"[A] attract, [B] created","ev":"6~7번 문장","w":"6번 So they tried to attract the citizens with gifts와 7번 Poseidon created a spring에서 가져왔어요. tried to 뒤에는 동사원형 attract가 오고, 포세이돈의 선물은 샘을 만들어 낸 것(created)이에요.","c":null,"s":[[6,"So they tried to attract the citizens with gifts.","그래서 그들은 선물로 시민들의 마음을 끌기 위해 노력했다."],[7,"Poseidon created a spring.","포세이돈은 샘을 만들어 냈다."]]},"h":"72d202de56"}]},{"u":4,"id":"hs2-04-1","no":1,"ko":"종이와 가위만 있으면 돼!","items":[{"n":1,"t":"tf","q":"Henri Matisse was a great artist in the 20th century.","ko":"앙리 마티스는 20세기에 위대한 예술가였다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He was a great artist in the 20th century.","그는 20세기에 위대한 예술가였다."]],"w":"3번 문장에 He was a great artist in the 20th century.라고 그대로 나와요. 일치해요.","c":"T"},"h":"bdf26c6537"},{"n":2,"t":"tf","q":"Matisse could still go to the swimming pool when he made The Swimming Pool.","ko":"마티스는 <수영장>을 만들 때 아직 수영장에 갈 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Matisse wanted to make his own swimming pool with art because he couldn’t go to the swimming pool anymore.","마티스는 더 이상 수영장에 갈 수 없었기 때문에 예술로 그 자신만의 수영장을 만들고 싶어 했다."]],"w":"7번에서 마티스는 더 이상 수영장에 갈 수 없었기 때문에(he couldn’t go to the swimming pool anymore) 자기만의 수영장을 만들고 싶어 했어요. 갈 수 있었다는 말은 반대예요.","c":"F"},"h":"5b1e13d5cc"},{"n":3,"t":"tf","q":"Matisse began to cut color paper before he became weak.","ko":"마티스는 몸이 약해지기 전에 색종이를 자르기 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"When he got older, he became too weak to paint.","그가 더 나이가 들었을 때, 그는 그림을 그리기에 신체적으로 너무 약해졌다."],[5,"So he began to cut color paper and create shapes.","그래서 그는 색종이를 자르고 모양들을 만들기 시작했다."]],"w":"4번에서 몸이 너무 약해졌고, 5번에서 So(그래서) 색종이를 자르기 시작했어요. 약해진 뒤에 시작한 거라서 순서가 반대예요.","c":"F"},"h":"9a5d40ccc3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When he got older, he became too weak to paint.)","ko":"그가 더 나이가 들었을 때, 그는 그림을 그리기에 너무 약해졌다. (weak는 약한)","opts":["유명한","신체적으로 약한","매우 바쁜","아주 젊은"],"word":"weak","r":{"a":"2) 신체적으로 약한","ev":"4번 문장","s":[[4,"When he got older, he became too weak to paint.","그가 더 나이가 들었을 때, 그는 그림을 그리기에 신체적으로 너무 약해졌다."]],"w":"4번은 나이가 들어 그림을 그리기에 너무 약해졌다는 문장이에요. weak는 몸에 힘이 없는 '약한'이에요.","c":2},"h":"6679093753"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (One of his famous cut-out works is The Swimming Pool.)","ko":"그의 유명한 잘라낸 작품들 중 하나는 <수영장>이다. (famous는 유명한)","opts":["오래된","비싼","유명한","무서운"],"word":"famous","r":{"a":"3) 유명한","ev":"6번 문장","s":[[6,"One of his famous cut-out works is The Swimming Pool.","그의 유명한 잘라낸 작품들 중 하나는 <수영장>이다."]],"w":"6번은 마티스의 잘라낸 작품들 중 대표적인 하나로 <수영장>을 소개해요. 많은 사람이 아는 작품이라는 뜻의 famous는 '유명한'이에요.","c":3},"h":"3de3279b61"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThe people and animals look like they are swimming!","ko":"밑줄 친 they가 가리키는 것은?","sko":"그 사람들과 동물들은 마치 수영하고 있는 것처럼 보인다!","opts":["마티스와 친구들","그 사람들과 동물들","거실의 벽들","수영장의 학생들"],"r":{"a":"2) 그 사람들과 동물들","ev":"10번 문장","s":[[10,"The people and animals look like they are swimming!","그 사람들과 동물들은 마치 수영하고 있는 것처럼 보인다!"]],"w":"수영하는 것처럼 보이는 것은 앞에 나온 The people and animals(그 사람들과 동물들)예요. they가 그 둘을 다시 받았어요.","c":2},"h":"e1ac9b616f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Matisse found a fun way to bring the pool to him!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마티스는 수영장을 그에게 가져올 재미있는 방법을 찾았다!","opts":["마티스는 수영장을 그에게 가져올 재미있는 방법을 찾았다.","마티스는 수영장에 빨리 가는 방법을 찾았다.","마티스는 친구들을 수영장으로 데려갈 방법을 찾았다.","마티스는 수영장을 다른 사람에게 팔 방법을 찾았다."],"r":{"a":"1) 마티스는 수영장을 그에게 가져올 재미있는 방법을 찾았다.","ev":"11번 문장","s":[[11,"Matisse found a fun way to bring the pool to him!","마티스는 수영장을 그에게 가져올 재미있는 방법을 찾았다!"]],"w":"to bring the pool to him은 a fun way를 꾸며서 '수영장을 그에게 가져올 방법'이에요. 마티스가 수영장에 가는 게 아니라, 수영장이 그에게 오는 거예요.","c":1},"h":"680eb4e746"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마티스는 나이가 들자 예술 활동을 멈췄다.","마티스는 종이 모양들을 수영장 바닥에 붙였다.","마티스는 파란 종이로 사람들과 바다 동물들의 모양을 잘랐다.","마티스는 19세기의 위대한 예술가였다."],"opts":["Matisse stopped making art when he got older.","Matisse put the paper shapes on the floor of a swimming pool.","Matisse cut out shapes of people and sea animals with blue paper.","Matisse was a great artist in the 19th century."],"r":{"a":"3) Matisse cut out shapes of people and sea animals with blue paper.","ev":"8번 문장","s":[[8,"He cut out shapes of people and sea animals with blue paper.","그는 파란색 종이로 사람들과 바다 동물들의 모양을 잘랐다."]],"w":"8번 문장 내용과 같아요. 마티스는 나이가 들어서도 모양을 만들며 작업을 이어 갔고(5번), 모양들은 거실 벽에 붙였고(9번), 20세기 예술가예요(3번).","c":3},"h":"5509e1ca49"},{"n":9,"t":"sum","q":"When Matisse got older, he became too (A) to paint, so he began to (B) color paper.","ko":"마티스는 나이가 들어 그림을 그리기에 너무 (A)해져서 색종이를 (B)하기 시작했다.","oko":["(A) 강한 / (B) 자르다","(A) 약한 / (B) 던지다","(A) 유명한 / (B) 그리다","(A) 약한 / (B) 자르다","(A) 젊은 / (B) 사다"],"opts":["(A) strong / (B) cut","(A) weak / (B) throw","(A) famous / (B) paint","(A) weak / (B) cut","(A) young / (B) buy"],"r":{"a":"4) (A) weak / (B) cut","ev":"4~5번 문장","s":[[4,"When he got older, he became too weak to paint.","그가 더 나이가 들었을 때, 그는 그림을 그리기에 신체적으로 너무 약해졌다."],[5,"So he began to cut color paper and create shapes.","그래서 그는 색종이를 자르고 모양들을 만들기 시작했다."]],"w":"4번에서 too weak to paint(그림을 그리기에 너무 약한)였고, 5번에서 so(그래서) cut color paper(색종이를 자르다) 하기 시작했어요.","c":4},"h":"2ab78cd241"},{"n":10,"t":"fill","q":"Matisse cut out blue paper [B] and put them on his living room walls to make his own swimming [A].","ko":"마티스는 파란 종이 [B]을 오려 내 거실 벽에 붙여서 그 자신만의 수영 [A]을 만들었다.","bank":["pool","shapes","weak","famous","older","century"],"bko":{"pool":"수영장","shapes":"모양들","weak":"약한","famous":"유명한","older":"더 나이 든","century":"세기"},"r":{"a":"[A] pool, [B] shapes","ev":"7~9번 문장","s":[[7,"Matisse wanted to make his own swimming pool with art because he couldn’t go to the swimming pool anymore.","마티스는 더 이상 수영장에 갈 수 없었기 때문에 예술로 그 자신만의 수영장을 만들고 싶어 했다."],[8,"He cut out shapes of people and sea animals with blue paper.","그는 파란색 종이로 사람들과 바다 동물들의 모양을 잘랐다."],[9,"Then, he put them on his living room walls.","그러고 나서, 그는 그것들을 그의 거실 벽에 붙였다."]],"w":"7번에서 마티스는 자기만의 수영장(pool)을 만들고 싶어 했고, 8번에서 파란 종이로 모양들(shapes)을 오렸고, 9번에서 그것들을 거실 벽에 붙였어요.","c":null},"h":"d8c7f00de2"}]},{"u":4,"id":"hs2-04-2","no":2,"ko":"너무 신경 쓰지 마~","items":[{"n":1,"t":"tf","q":"A student wore an ugly T-shirt to school in a study.","ko":"한 연구에서 한 학생이 학교에 못생긴 티셔츠를 입고 갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"In a study, a student wore an ugly T-shirt to school.","한 연구에서, 한 학생이 학교에 못생긴 티셔츠를 입고 갔다."]],"w":"4번 문장에 a student wore an ugly T-shirt to school이 그대로 나와요. 일치해요.","c":"T"},"h":"1a204a29f1"},{"n":2,"t":"tf","q":"More than half of the students noticed the T-shirt.","ko":"절반이 넘는 학생들이 그 티셔츠를 알아차렸다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"However, more than half of the students didn’t notice the T-shirt!","하지만, 절반이 넘는 학생들이 그 티셔츠를 알아차리지 않았다!"]],"w":"6번에서 절반이 넘는 학생들이 티셔츠를 알아차리지 않았다(didn’t notice)고 해요. 알아차렸다는 말은 반대예요.","c":"F"},"h":"0fed8cd746"},{"n":3,"t":"tf","q":"You always see your own changes.","ko":"당신은 항상 당신 자신의 변화들을 본다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"This is natural because you always see your own changes.","당신은 항상 당신 자신의 변화들을 보기 때문에 이것은 자연스럽다."]],"w":"9번 문장 because you always see your own changes에 나와요. 그래서 자기에게 집중하는 것이 자연스럽다고 해요.","c":"T"},"h":"3a90068bbd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, more than half of the students didn’t notice the T-shirt!)","ko":"하지만, 절반이 넘는 학생들이 그 티셔츠를 알아차리지 않았다! (notice는 알아차리다)","opts":["잊어버리다","알아차리다","만들다","빌리다"],"word":"notice","r":{"a":"2) 알아차리다","ev":"6번 문장","s":[[6,"However, more than half of the students didn’t notice the T-shirt!","하지만, 절반이 넘는 학생들이 그 티셔츠를 알아차리지 않았다!"]],"w":"티셔츠를 입은 학생은 모두가 볼 것이라 생각했지만, 절반이 넘는 학생은 그것을 알아차리지 못했다는 내용이에요. notice는 '알아차리다'예요.","c":2},"h":"ec7cc7f08a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Well, you focus so much on yourself.)","ko":"자, 당신은 당신 자신에게 너무 많이 집중한다. (focus는 집중하다)","opts":["걱정하다","지켜보다","집중하다","기억하다"],"word":"focus","r":{"a":"3) 집중하다","ev":"8번 문장","s":[[8,"Well, you focus so much on yourself.","자, 당신은 당신 자신에게 너무 많이 집중한다."]],"w":"7번의 '왜 조명 효과가 생기는가?'에 대한 대답이에요. 자기 자신에게 너무 많이 집중하기 때문이라는 뜻의 focus on은 '~에 집중하다'예요.","c":3},"h":"e1a9912726"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAnd you think others also see them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그리고 당신은 다른 사람들 또한 그것들을 본다고 생각한다.","opts":["다른 사람들","못생긴 티셔츠들","반의 학생들","당신 자신의 변화들"],"r":{"a":"4) 당신 자신의 변화들","ev":"9~10번 문장","s":[[9,"This is natural because you always see your own changes.","당신은 항상 당신 자신의 변화들을 보기 때문에 이것은 자연스럽다."],[10,"And you think others also see them.","그리고 당신은 다른 사람들 또한 그것들을 본다고 생각한다."]],"w":"9번에서 당신이 항상 보는 것은 your own changes(당신 자신의 변화들)예요. 10번의 them이 바로 그것이고, others는 보는 사람이라 them이 아니에요.","c":4},"h":"3bc1111969"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You may think people pay attention to you more than they actually do.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신은 사람들이 실제로 그러한 것보다 당신에게 더 많이 주의를 기울인다고 생각할지도 모른다.","opts":["당신은 사람들이 실제보다 당신에게 더 많이 주의를 기울인다고 생각할지도 모른다.","사람들은 실제로 당신에게 아주 많은 주의를 기울이고 있다.","당신은 사람들이 실제보다 당신에게 덜 주의를 기울인다고 생각할지도 모른다.","당신은 사람들에게 더 많은 주의를 기울여야 한다."],"r":{"a":"1) 당신은 사람들이 실제보다 당신에게 더 많이 주의를 기울인다고 생각할지도 모른다.","ev":"2번 문장","s":[[2,"You may think people pay attention to you more than they actually do.","당신은 사람들이 실제로 그러한 것보다 당신에게 더 많이 주의를 기울인다고 생각할지도 모른다."]],"w":"more than they actually do는 '그들이 실제로 하는 것보다 더 많이'예요. 실제로는 덜 신경 쓰는데, 더 신경 쓴다고 생각할 수 있다는 말이에요.","c":1},"h":"7b6f2ab360"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["연구에서 학생은 멋진 티셔츠를 입었다.","다른 사람들은 자기 자신에게만 관심을 가진다.","반의 모든 학생이 그 티셔츠를 알아차렸다.","자신의 변화를 보는 것은 자연스럽지 않다."],"opts":["The student in the study wore a nice T-shirt.","Other people only care about themselves.","Everyone in class noticed the ugly T-shirt.","Seeing your own changes is not natural."],"r":{"a":"2) Other people only care about themselves.","ev":"12번 문장","s":[[12,"They only care about themselves.","그들은 그들 자신에게만 관심을 가진다."]],"w":"12번에서 They only care about themselves라고 해요. 티셔츠는 못생겼고(4번), 절반 넘는 학생이 못 알아챘고(6번), 자기 변화를 보는 것은 자연스럽다고(9번) 했어요.","c":2},"h":"fc9cce6e4a"},{"n":9,"t":"sum","q":"We (A) so much on ourselves, but others only (B) about themselves.","ko":"우리는 우리 자신에게 너무 많이 (A)하지만, 다른 사람들은 오로지 그들 자신에 대해서만 (B)한다.","oko":["(A) 잊는다 / (B) 숨긴다","(A) 웃는다 / (B) 관심을 가진다","(A) 집중한다 / (B) 관심을 가진다","(A) 집중한다 / (B) 비웃는다","(A) 걱정한다 / (B) 지켜본다"],"opts":["(A) forget / (B) hide","(A) laugh / (B) care","(A) focus / (B) care","(A) focus / (B) laugh","(A) worry / (B) watch"],"r":{"a":"3) (A) focus / (B) care","ev":"8번, 12번 문장","s":[[8,"Well, you focus so much on yourself.","자, 당신은 당신 자신에게 너무 많이 집중한다."],[12,"They only care about themselves.","그들은 그들 자신에게만 관심을 가진다."]],"w":"8번에서 you focus so much on yourself, 12번에서 They only care about themselves라고 해요. 나는 나에게 집중하고, 남들도 자기에게만 관심이 있다는 뜻이에요.","c":3},"h":"9532b9607e"},{"n":10,"t":"fill","q":"A student [A] an ugly T-shirt to school, but more than half of the students did not [B] it.","ko":"한 학생이 학교에 못생긴 티셔츠를 [A] 갔지만, 절반이 넘는 학생들은 그것을 [B] 못했다.","bank":["wore","notice","worry","happen","natural","spotlight"],"bko":{"wore":"입었다","notice":"알아차리다","worry":"걱정하다","happen":"발생하다","natural":"자연스러운","spotlight":"조명, 주목"},"r":{"a":"[A] wore, [B] notice","ev":"4번, 6번 문장","s":[[4,"In a study, a student wore an ugly T-shirt to school.","한 연구에서, 한 학생이 학교에 못생긴 티셔츠를 입고 갔다."],[6,"However, more than half of the students didn’t notice the T-shirt!","하지만, 절반이 넘는 학생들이 그 티셔츠를 알아차리지 않았다!"]],"w":"4번에서 학생이 못생긴 티셔츠를 입었고(wore), 6번에서 절반이 넘는 학생들이 그것을 알아차리지 않았어요(didn’t notice).","c":null},"h":"c5fd24f32f"}]},{"u":4,"id":"hs2-04-3","no":3,"ko":"둥둥둥, 흥이 난다!","items":[{"n":1,"t":"tf","q":"The djembe makes three different sounds.","ko":"젬베는 세 가지 다른 소리를 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The djembe makes three different sounds: bass, tone, and slap.","젬베는 베이스, 톤, 그리고 슬랩이라는 세 가지 다른 소리를 낸다."]],"w":"5번 문장에서 젬베는 bass, tone, slap의 세 가지 다른 소리를 낸다고 해요. 일치해요.","c":"T"},"h":"09faa11a67"},{"n":2,"t":"tf","q":"To make bass sounds, you hit the edge of the djembe.","ko":"베이스 소리를 내기 위해서는 젬베의 가장자리를 친다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"To make bass sounds, hit the center of the djembe wit
