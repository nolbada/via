 about what I can’t do, I’d still be in the hospital.”","사람들이 그에게 어떻게 이 모든 일을 할 수 있는지 물으면, 그는 “만일 내가 할 수 없는 것에 대해서만 생각한다면, 나는 아직도 병원에 있을 겁니다.”라고 말한다."]],"w":"If I thought only about ~, I'd still be in the hospital.은 '할 수 없는 것만 생각한다면 아직도 병원에 있을 것'이라는 가정이에요. 지금은 할 수 있는 것을 생각하기 때문에 병원 밖에서 도전하고 있다는 뜻이에요.","c":2},"h":"f5203422aa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Peter's accident happened while he was kayaking.","Peter could walk again after two operations.","Peter became the first paraplegic to kayak the Grand Canyon.","Peter stopped playing sports because of his accident."],"oko":["Peter의 사고는 그가 카약을 타던 중에 일어났다.","Peter는 두 번의 수술 후에 다시 걸을 수 있게 되었다.","Peter는 카약을 타고 그랜드 캐니언을 간 최초의 하반신 마비 환자가 되었다.","Peter는 사고 때문에 운동을 그만두었다."],"r":{"a":"3) Peter became the first paraplegic to kayak the Grand Canyon.","ev":"1번, 3번, 4번, 7번 문장","s":[[1,"Peter Hershorn, a young skier, had a terrible accident while attempting a big jump.","스키어(스키 타는 사람)인 젊은 Peter Hershorn(피터 허숀)은 큰 점프를 시도하던 중 끔찍한 사고를 당했다."],[3,"Although Peter had two operations, he still couldn’t walk.","Peter는 두 차례의 수술을 받기는 했지만, 여전히 걸을 수 없었다."],[4,"But he loved sports, so he tried to find one that he could do.","그러나 그는 운동을 매우 좋아해서 자신이 할 수 있는 운동을 찾기 위해 노력했다."],[7,"Peter then took a kayaking trip down the Colorado River and became the first paraplegic to kayak the Grand Canyon.","Peter는 그 후 Colorado(콜로라도)강을 따라 카약 여행을 했고, 카약을 타고 그랜드 캐니언을 간 최초의 하반신 마비 환자가 되었다."]],"w":"7번 문장에서 Peter는 그랜드 캐니언을 카약으로 간 최초의 하반신 마비 환자가 되었어요. 사고는 점프를 하다가 일어났고(1번), 수술 후에도 걸을 수 없었고(3번), 운동을 계속했어요(4번).","c":3},"h":"0b4a330b55"},{"n":9,"t":"sum","q":"Peter (A) sports, so he (B) to find one that he could do.","ko":"Peter는 운동을 (A), 그래서 자신이 할 수 있는 운동을 찾으려고 (B).","opts":["(A) loved / (B) tried","(A) loved / (B) refused","(A) hated / (B) tried","(A) hated / (B) refused","(A) loved / (B) forgot"],"oko":["(A) 매우 좋아했고 / (B) 노력했다","(A) 매우 좋아했고 / (B) 거부했다","(A) 싫어했고 / (B) 노력했다","(A) 싫어했고 / (B) 거부했다","(A) 매우 좋아했고 / (B) 잊어버렸다"],"r":{"a":"1) (A) loved / (B) tried ((A) 매우 좋아했고 / (B) 노력했다)","ev":"4번 문장","s":[[4,"But he loved sports, so he tried to find one that he could do.","그러나 그는 운동을 매우 좋아해서 자신이 할 수 있는 운동을 찾기 위해 노력했다."]],"w":"4번 문장은 “그는 운동을 매우 좋아해서(loved) 자신이 할 수 있는 운동을 찾기 위해 노력했다(tried)”는 뜻이에요.","c":1},"h":"b56e616308"},{"n":10,"t":"fill","q":"[A] Peter [B] two operations, he still couldn’t walk.","ko":"[A] Peter는 두 차례의 수술을 [B], 여전히 걸을 수 없었다.","bank":["Although","had","broken","legs","yachts","jump"],"bko":{"Although":"비록 ~이지만","had":"받았다(have의 과거)","broken":"부러진","legs":"다리들","yachts":"요트들","jump":"점프"},"r":{"a":"[A] Although (비록 ~이지만), [B] had (받았다(have의 과거))","ev":"3번 문장","s":[[3,"Although Peter had two operations, he still couldn’t walk.","Peter는 두 차례의 수술을 받기는 했지만, 여전히 걸을 수 없었다."]],"w":"3번 문장은 “Peter는 두 차례의 수술을 받기는 했지만, 여전히 걸을 수 없었다”는 뜻이에요. Although는 “비록 ~이지만”이고, had two operations는 “두 차례의 수술을 받았다”예요.","c":null},"h":"ce08af7219"}]},{"u":9,"id":"nl3-09-2","no":2,"ko":"맥도날드 로고가 푸른색이라고?","items":[{"n":1,"t":"tf","q":"Most people easily recognize the McDonald’s logo.","ko":"대부분의 사람들은 맥도날드의 로고를 쉽게 알아본다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Most people easily recognize the company’s logo: two golden arches shaped like a big “M.”","대부분의 사람들은 맥도날드의 로고를 쉽게 알아본다. 그것은 바로 커다란 ‘M’ 모양으로 만들어진 두 개의 황금색 아치다."]],"w":"2번 문장에서 대부분의 사람들이 맥도날드의 로고를 쉽게 알아본다고 해요.","c":"T"},"h":"8ec67d50b4"},{"n":2,"t":"tf","q":"The golden arches at the McDonald’s in Sedona are red.","ko":"Sedona의 맥도날드에 있는 황금색 아치는 빨간색이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"But at the McDonald’s in Sedona, Arizona, the golden arches are actually blue.","하지만 Arizona(애리조나)주의 Sedona(세도나)에 있는 맥도날드에서는 이 황금색의 아치가 실제로 푸른색이다."]],"w":"3번 문장에서 Sedona의 맥도날드 아치는 푸른색(blue)이라고 해요. 빨간색이라는 말은 틀려요.","c":"F"},"h":"9e7e6bfa19"},{"n":3,"t":"tf","q":"Sedona is famous for its natural beauty.","ko":"Sedona는 자연의 아름다움으로 유명하다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Sedona is located in the desert and is famous for its natural beauty.","Sedona는 사막에 있으며 자연의 아름다움으로 유명하다."]],"w":"4번 문장에서 Sedona는 사막에 있고 자연의 아름다움으로 유명하다고 해요.","c":"T"},"h":"6e14be5212"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Most people easily recognize the company’s logo: two golden arches shaped like a big “M.”)","ko":"대부분의 사람들은 맥도날드의 로고를 쉽게 ~한다. (recognize = ?)","opts":["알아보다","바꾸다","잊다","만들다"],"word":"recognize","r":{"a":"1) 알아보다","ev":"2번 문장","s":[[2,"Most people easily recognize the company’s logo: two golden arches shaped like a big “M.”","대부분의 사람들은 맥도날드의 로고를 쉽게 알아본다. 그것은 바로 커다란 ‘M’ 모양으로 만들어진 두 개의 황금색 아치다."]],"w":"2번 문장에서 사람들이 로고를 쉽게 recognize한다고 했어요. 로고를 보면 맥도날드인 줄 안다는 뜻이라서 '알아보다'예요.","c":1},"h":"9450bf059a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (City leaders, however, worried that a big golden “M” would ruin the view.)","ko":"도시 지도자들은 커다란 황금색 M이 경관을 ~할까 봐 걱정했다. (ruin = ?)","opts":["돋보이게 하다","망치다","설명하다","감추다"],"word":"ruin","r":{"a":"2) 망치다","ev":"6번 문장","s":[[6,"City leaders, however, worried that a big golden “M” would ruin the view.","그러나 도시의 지도자들은 커다란 황금색 ‘M’이 경관을 망칠까 봐 걱정했다."]],"w":"6번 문장에서 지도자들은 황금색 M이 경관을 망칠까 봐 걱정했어요. 그래서 7번에서 어울리는 색으로 바꿨어요.","c":2},"h":"397df1d378"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nToday, tourists often visit the Sedona McDonald’s just to see its unique sign.","ko":"밑줄 친 its가 가리키는 것은?","sko":"오늘날 여행객들은 오로지 이 독특한 간판을 보기 위해서 Sedona의 맥도날드를 자주 방문한다.","pron":"its","opts":["Sedona의 맥도날드","Arizona 주","여행객들","맥도날드 본사"],"r":{"a":"1) Sedona의 맥도날드","ev":"9번 문장","s":[[9,"Today, tourists often visit the Sedona McDonald’s just to see its unique sign.","오늘날 여행객들은 오로지 이 독특한 간판을 보기 위해서 Sedona의 맥도날드를 자주 방문한다."]],"w":"its unique sign은 “그것의 독특한 간판”이에요. 여행객들이 보러 가는 곳은 the Sedona McDonald’s이므로, its = the Sedona McDonald’s예요.","c":1,"k":"its = Sedona의 맥도날드"},"h":"1f7b7bc3b7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They chose a greenish-blue color known as turquoise.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 청록색으로 알려진 녹청색을 선정했다.","opts":["그들은 청록색으로 알려진 녹청색을 선택했다.","그들은 청록색을 싫어해서 다른 색으로 바꾸었다.","그들은 청록색을 처음으로 만들어 냈다.","그들은 청록색이라는 이름의 도시를 선택했다."],"r":{"a":"1) 그들은 청록색으로 알려진 녹청색을 선택했다.","ev":"8번 문장","s":[[8,"They chose a greenish-blue color known as turquoise.","그들은 청록색으로 알려진 녹청색을 선정했다."]],"w":"chose는 “선택했다”이고, a greenish-blue color known as turquoise는 “청록색으로 알려진 녹청색”이라는 뜻이에요.","c":1},"h":"d649572e9d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The Sedona McDonald’s uses the same golden arches as other restaurants.","City leaders wanted the golden “M” to be even bigger.","McDonald’s decided to open a restaurant in Sedona in the early 1990s.","Sedona is located near the ocean."],"oko":["Sedona의 맥도날드는 다른 매장과 똑같은 황금색 아치를 쓴다.","도시 지도자들은 황금색 M이 더 커지기를 바랐다.","맥도날드는 1990년대 초에 Sedona에 매장을 열기로 결정했다.","Sedona는 바다 근처에 있다."],"r":{"a":"3) McDonald’s decided to open a restaurant in Sedona in the early 1990s.","ev":"3~6번 문장","s":[[3,"But at the McDonald’s in Sedona, Arizona, the golden arches are actually blue.","하지만 Arizona(애리조나)주의 Sedona(세도나)에 있는 맥도날드에서는 이 황금색의 아치가 실제로 푸른색이다."],[4,"Sedona is located in the desert and is famous for its natural beauty.","Sedona는 사막에 있으며 자연의 아름다움으로 유명하다."],[5,"McDonald’s decided to open a restaurant there in the early 1990s.","맥도날드는 1990년대 초에 그곳에 매장을 열기로 결정했다."],[6,"City leaders, however, worried that a big golden “M” would ruin the view.","그러나 도시의 지도자들은 커다란 황금색 ‘M’이 경관을 망칠까 봐 걱정했다."]],"w":"5번 문장에서 맥도날드는 1990년대 초에 Sedona에 매장을 열기로 결정했어요. Sedona의 아치는 푸른색이고(3번), 지도자들은 M이 경관을 망칠까 걱정했고(6번), Sedona는 사막에 있어요(4번).","c":3},"h":"32ddad53f6"},{"n":9,"t":"sum","q":"So McDonald’s (A) to use a color that (B) fits the natural landscape.","ko":"그래서 맥도날드는 자연경관과 (B) 어울리는 색을 사용하는 데 (A).","opts":["(A) agreed / (B) better","(A) agreed / (B) never","(A) refused / (B) better","(A) refused / (B) never","(A) wanted / (B) better"],"oko":["(A) 동의했다 / (B) 더 잘","(A) 동의했다 / (B) 결코 안","(A) 거절했다 / (B) 더 잘","(A) 거절했다 / (B) 결코 안","(A) 원했다 / (B) 더 잘"],"r":{"a":"1) (A) agreed / (B) better ((A) 동의했다 / (B) 더 잘)","ev":"7번 문장","s":[[7,"So McDonald’s agreed to use a color that better fits the natural landscape.","그래서 맥도날드는 자연경관과 더 잘 어울리는 색을 사용하는 데 동의했다."]],"w":"7번 문장은 맥도날드가 자연경관과 더 잘(better) 어울리는 색을 사용하는 데 동의했다(agreed)는 뜻이에요.","c":1},"h":"dc73963b91"},{"n":10,"t":"fill","q":"There are tens of thousands of McDonald’s [A] restaurants all across the [B].","ko":"전 [B]에 수만 개의 맥도날드 [A] 음식점이 있다.","bank":["fast-food","world","often","decided","visit","fits"],"bko":{"fast-food":"패스트푸드의","world":"세계","often":"자주","decided":"결정했다","visit":"방문하다","fits":"어울리다"},"r":{"a":"[A] fast-food (패스트푸드의), [B] world (세계)","ev":"1번 문장","s":[[1,"There are tens of thousands of McDonald’s fast-food restaurants all across the world.","전 세계에 수만 개의 맥도날드 패스트푸드점이 있다."]],"w":"1번 문장은 “전 세계에 수만 개의 맥도날드 패스트푸드점이 있다”는 뜻이에요. fast-food restaurants는 “패스트푸드점”이고, all across the world는 “전 세계에 걸쳐”예요.","c":null},"h":"7d8a1bdfe4"}]},{"u":9,"id":"nl3-09-3","no":3,"ko":"내가 영화에 투자할 수 있다니!","items":[{"n":1,"t":"tf","q":"The filmmakers have an interesting story and talented actors.","ko":"영화 제작자들에게는 재미있는 이야기와 재능 있는 배우들이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"To make a great movie, an interesting story and talented actors are needed.","훌륭한 영화를 만들기 위해서는 재미있는 이야기와 재능 있는 배우들이 필요합니다."],[2,"Luckily, we have those!","다행히 우리에게는 그것들이 있습니다!"]],"w":"1번에서 훌륭한 영화에는 재미있는 이야기와 재능 있는 배우가 필요하다고 하고, 2번에서 다행히 우리에게 그것들이 있다고 해요.","c":"T"},"h":"3aad499da1"},{"n":2,"t":"tf","q":"The filmmakers say they already have enough money to make the movie.","ko":"영화 제작자들은 영화를 만들 돈이 이미 충분하다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"Lots of money is also needed.","또한 많은 돈이 필요합니다."],[4,"Unfortunately, we don’t have that!","불행하게도, 우리에게는 돈이 없습니다!"]],"w":"3번에서 많은 돈이 필요하다고 했고, 4번에서 불행하게도 우리에게는 그것이 없다고 해요. 돈이 충분하다는 말은 틀려요.","c":"F"},"h":"82ff22b3f9"},{"n":3,"t":"tf","q":"The movie is about a woman who moves to a small town.","ko":"영화는 작은 마을로 이사한 한 여성에 관한 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"What our movie is about: It is a short film about a woman who moves to a small town.","무엇에 관한 영화인가: 이 영화는 작은 마을로 이사한 한 여성에 관한 단편 영화입니다."]],"w":"8번 문장에서 영화는 작은 마을로 이사한 한 여성에 관한 단편 영화라고 해요.","c":"T"},"h":"ede8d1b538"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (What we need: We will use the crowdfunding money to rent cameras and lights.)","ko":"우리는 크라우드 펀딩으로 모은 돈을 카메라와 조명을 ~하는 데 사용할 것이다. (rent = ?)","opts":["고장 내다","팔다","빌리다","만들다"],"word":"rent","r":{"a":"3) 빌리다","ev":"11번 문장","s":[[11,"What we need: We will use the crowdfunding money to rent cameras and lights.","우리는 무엇이 필요한가: 우리는 크라우드 펀딩으로 모은 돈을 카메라와 조명을 대여하는 데 사용할 것입니다."]],"w":"11번 문장에서 모인 돈은 카메라와 조명을 빌리는(rent) 데 써요. 사 오는 것이 아니라 잠시 빌려서 쓰는 거예요.","c":3},"h":"eb40dbe1cb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is a touching story, but it is also funny.)","ko":"이것은 ~ 이야기지만, 재미도 있다. (touching = ?)","opts":["지루한","감동적인","무서운","복잡한"],"word":"touching","r":{"a":"2) 감동적인","ev":"10번 문장","s":[[10,"It is a touching story, but it is also funny.","이것은 감동적인 이야기지만, 재미도 있습니다."]],"w":"10번 문장에서 touching story이지만 funny하기도 하다고 해요. touching은 마음을 움직이는 '감동적인'이라는 뜻이에요.","c":2},"h":"45937672d5"},{"n":6,"t":"ref","q":"What does the underlined \"She\" refer to?\nShe meets many interesting people and has some exciting experiences.","ko":"밑줄 친 She가 가리키는 것은?","sko":"그녀는 많은 흥미로운 사람들을 만나고 신나는 경험을 합니다.","pron":"She","opts":["영화 속 여성","영화 제작자들","영화 관객들","크라우드 펀딩 참여자들"],"r":{"a":"1) 영화 속 여성","ev":"9번 문장","s":[[9,"She meets many interesting people and has some exciting experiences.","그녀는 많은 흥미로운 사람들을 만나고 신나는 경험을 합니다."]],"w":"영화 소개에서 작은 마을로 이사한 여성이 많은 사람을 만나고 신나는 경험을 한다고 해요. 이야기 속에서 사람들을 만나는 She는 영화 속 그 여성이에요.","c":1,"k":"She = 영화 속 여성"},"h":"2ad368dba9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of a few people donating thousands of dollars each, thousands of people donate a few dollars each!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"수천 달러씩 기부하는 소수의 사람들 대신, 수천 명의 사람들이 몇 달러씩 기부하는 것이죠!","opts":["소수의 사람이 몇 달러씩 내는 대신, 수천 명이 수천 달러씩 낸다.","수천 명이 수천 달러씩 내는 대신, 소수의 사람이 몇 달러씩 낸다.","소수의 사람이 수천 달러씩 내는 대신, 수천 명이 몇 달러씩 낸다.","한 사람이 수천 달러를 내는 대신, 수천 명이 한 번에 모두 낸다."],"r":{"a":"3) 소수의 사람이 수천 달러씩 내는 대신, 수천 명이 몇 달러씩 낸다.","ev":"7번 문장","s":[[7,"Instead of a few people donating thousands of dollars each, thousands of people donate a few dollars each!","수천 달러씩 기부하는 소수의 사람들 대신, 수천 명의 사람들이 몇 달러씩 기부하는 것이죠!"]],"w":"Instead of ~는 '~ 대신에'예요. 소수의 사람이 큰돈(수천 달러)을 내는 방식 대신, 수천 명이 소액(몇 달러)을 내는 방식이 크라우드 펀딩이라는 뜻이에요.","c":3},"h":"6198f96c84"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["People who donate $20 or less will get an autographed photo of Ann Roberts.","The movie is a long drama about a man.","The filmmakers do not need any money to make the movie.","Only rich people can help the movie."],"oko":["20달러 이하를 기부한 사람들은 Ann Roberts의 사인이 있는 사진을 받을 것이다.","그 영화는 한 남자에 관한 긴 드라마이다.","제작자들은 영화를 만드는 데 돈이 전혀 필요하지 않다.","부자들만 그 영화를 도울 수 있다."],"r":{"a":"1) People who donate $20 or less will get an autographed photo of Ann Roberts. (20달러 이하를 기부한 사람들은 Ann Roberts의 사인이 있는 사진을 받을 것이다.)","ev":"14번 문장","s":[[14,"If you donate $20 or less, you will get an autographed photo of the main actor, Ann Roberts.","당신이 20달러 혹은 그보다 적게 기부한다면, 주연 배우 Ann Roberts(앤 로버츠)의 사인이 있는 사진을 받게 됩니다."]],"w":"14번 문장에서 20달러 혹은 그보다 적게 기부하면 주연 배우 Ann Roberts의 사인이 있는 사진을 받는다고 해요.","c":1},"h":"f020df92a3"},{"n":9,"t":"sum","q":"Crowdfunding is one (A) of (B) money.","ko":"크라우드 펀딩은 자금을 (B) 한 가지 (A)이다.","opts":["(A) way / (B) raising","(A) way / (B) wasting","(A) game / (B) raising","(A) game / (B) wasting","(A) way / (B) losing"],"oko":["(A) 방법 / (B) 모으는","(A) 방법 / (B) 낭비하는","(A) 게임 / (B) 모으는","(A) 게임 / (B) 낭비하는","(A) 방법 / (B) 잃는"],"r":{"a":"1) (A) way / (B) raising ((A) 방법 / (B) 모으는)","ev":"6번 문장","s":[[6,"Crowdfunding is one way of raising money.","크라우드 펀딩은 자금을 모으는 한 가지 방법입니다."]],"w":"6번 문장은 크라우드 펀딩이 자금을 모으는(raising money) 한 가지 방법(way)이라는 뜻이에요.","c":1},"h":"4d0db57f3c"},{"n":10,"t":"fill","q":"We will also need to [A] food for our [B].","ko":"우리는 또한 우리 [B]을(를) 위한 음식을 [A] 필요가 있을 것입니다.","bank":["buy","staff","arrive","happen","exciting","funny"],"bko":{"buy":"사다","staff":"제작진, 직원","arrive":"도착하다","happen":"일어나다","exciting":"신나는","funny":"웃긴"},"r":{"a":"[A] buy (사다), [B] staff (제작진, 직원)","ev":"12번 문장","s":[[12,"We will also need to buy food for our staff.","우리는 또한 제작진의 음식을 구매해야 할 것입니다."]],"w":"12번 문장은 “우리는 또한 제작진을 위한 음식을 구매해야 할 것입니다”라는 뜻이에요. need to buy는 “사야 한다”이고, staff는 “제작진, 직원”이에요.","c":null},"h":"ac6edbbc99"}]},{"u":9,"id":"nl3-09-4","no":4,"ko":"화가 날 땐 이렇게 해 보세요","items":[{"n":1,"t":"tf","q":"It is better for your emotional health to keep your anger inside.","ko":"화를 속으로 억누르는 것이 당신의 정서 건강에 더 낫다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It is better for your emotional health to express anger in an effective way.","효과적인 방법으로 화를 표출하는 것이 당신의 정서 건강에 더 낫다."]],"w":"6번 문장에서 효과적인 방법으로 화를 표현하는 것이 정서 건강에 더 낫다고 해요. 속으로 억누르라는 말은 반대예요.","c":"F"},"h":"f8b3d5ddaa"},{"n":2,"t":"tf","q":"Many people still believe that being anger-free is good for emotional health.","ko":"많은 사람들은 화가 없는 상태가 정서 건강에 좋다고 여전히 믿는다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Many people still believe being anger-free is good for one’s emotional health.","많은 사람들이 화가 없는 상태가 자신의 정서 건강에 좋다고 여전히 믿는다."]],"w":"4번 문장에서 많은 사람들이 화가 없는 상태가 정서 건강에 좋다고 여전히 믿는다고 해요. 하지만 5번에서 사실은 그렇지 않다고 해요.","c":"T"},"h":"4eea478ab1"},{"n":3,"t":"tf","q":"You should avoid the words never or always when you express your anger.","ko":"화를 표현할 때는 ‘절대’나 ‘언제나’라는 말을 피해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"You should also avoid name-calling, insults, and using the words never or always.","당신은 또한 욕설이나 모욕, 그리고 ‘절대’나 ‘언제나’와 같은 말을 쓰는 것을 피해야 한다."]],"w":"14번 문장에서 욕설, 모욕, 그리고 never나 always 같은 말을 쓰는 것을 피해야 한다고 해요.","c":"T"},"h":"dcd0d61139"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Do you yell or hit things?)","ko":"당신은 ~하는가, 아니면 무언가를 때리는가? (yell = ?)","opts":["속삭이다","웃다","소리치다","도망가다"],"word":"yell","r":{"a":"3) 소리치다","ev":"2번 문장","s":[[2,"Do you yell or hit things?","소리를 지르거나 무언가를 때리는가?"]],"w":"2번 문장에서 yell or hit things는 화가 났을 때 하는 행동이에요. 때리는 것과 나란히 나오는 yell은 '소리치다'예요.","c":3},"h":"8ce96bc826"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If you express your anger effectively, it will improve not only your emotional health but also your ability to communicate with others.)","ko":"화를 효과적으로 표현한다면 정서 건강과 의사소통 능력을 ~할 것이다. (improve = ?)","opts":["해치다","잊게 하다","줄이다","향상시키다"],"word":"improve","r":{"a":"4) 향상시키다","ev":"15번 문장","s":[[15,"If you express your anger effectively, it will improve not only your emotional health but also your ability to communicate with others.","당신이 화를 효과적으로 표현한다면, 그것은 당신의 정서 건강뿐만 아니라 다른 사람들과 의사소통하는 능력도 향상시킬 수 있을 것이다."]],"w":"15번 문장에서 화를 효과적으로 표현하면 정서 건강뿐 아니라 의사소통 능력도 좋아져요. improve는 '향상시키다'예요.","c":4},"h":"36f74108c4"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThe best way is to express anger in clear statements that don’t blame other people.","ko":"밑줄 친 that이 이끄는 말이 꾸며 주는 것은?","sko":"가장 좋은 방법은 다른 사람을 비난하지 않는 명확한 진술로 화를 표현하는 것이다.","opts":["화(anger)","명확한 진술(clear statements)","다른 사람들","정서 건강"],"r":{"a":"2) 명확한 진술(clear statements)","ev":"7번 문장","s":[[7,"The best way is to express anger in clear statements that don’t blame other people.","가장 좋은 방법은 다른 사람을 비난하지 않는 명확한 진술로 화를 표현하는 것이다."]],"w":"7번 문장에서 that don’t blame other people은 바로 앞의 clear statements를 꾸며 줘요. 그래서 '다른 사람을 비난하지 않는 명확한 진술'이라고 읽어요.","c":2},"h":"3e62074c7d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Saying “I” instead of “you” shows that you are not blaming the other person.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"‘너’ 대신에 ‘나’라고 말하는 것은 당신이 다른 사람을 비난하지 않고 있음을 보여 준다.","opts":["‘나’ 대신 ‘너’라고 말해야 상대를 비난하지 않는 것이다.","‘너’와 ‘나’는 상대를 비난하는 정도에 아무 차이가 없다.","‘너’ 대신 ‘나’라고 말하면 상대를 비난하지 않고 있음이 드러난다.","‘나’라고 말하는 것은 자신을 비난하고 있다는 것을 보여 준다."],"r":{"a":"3) ‘너’ 대신 ‘나’라고 말하면 상대를 비난하지 않고 있음이 드러난다.","ev":"12번 문장","s":[[12,"Saying “I” instead of “you” shows that you are not blaming the other person.","‘너’ 대신에 ‘나’라고 말하는 것은 당신이 다른 사람을 비난하지 않고 있음을 보여 준다."]],"w":"Saying “I” instead of “you”는 ‘너’ 대신 ‘나’라고 말하는 것이에요. 그렇게 하면 상대를 비난하지 않는다는 것을 보여 줘요.","c":3},"h":"c40d5595ad"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["You should say what you want the other person to do.","You should call the other person names when you are angry.","Using the words never and always helps you win the argument.","Holding in your anger is the best way to protect your emotional health."],"oko":["상대방이 무엇을 하기를 원하는지 말해야 한다.","화가 났을 때 상대방에게 욕을 해야 한다.","‘절대’와 ‘언제나’라는 말을 쓰면 논쟁에서 이길 수 있다.","화를 참는 것이 정서 건강을 지키는 가장 좋은 방법이다."],"r":{"a":"1) You should say what you want the other person to do.","ev":"6번, 9번, 14번 문장","s":[[6,"It is better for your emotional health to express anger in an effective way.","효과적인 방법으로 화를 표출하는 것이 당신의 정서 건강에 더 낫다."],[9,"You should also say what you want the other person to do.","당신은 또한 다른 사람이 무엇을 하기를 원하는지 말해야 한다."],[14,"You should also avoid name-calling, insults, and using the words never or always.","당신은 또한 욕설이나 모욕, 그리고 ‘절대’나 ‘언제나’와 같은 말을 쓰는 것을 피해야 한다."]],"w":"9번 문장에서 다른 사람이 무엇을 하기를 원하는지 말해야 한다고 해요. 욕설은 피해야 하고(14번), never·always도 피해야 하며(14번), 화를 억누르는 것보다 효과적으로 표현하는 것이 더 낫다고 해요(6번).","c":1},"h":"70be2c3d10"},{"n":9,"t":"sum","q":"Say that you are (A) and explain the (B) why.","ko":"당신이 (A) 것을 말하고 그 (B)을(를) 설명해라.","opts":["(A) upset / (B) reason","(A) upset / (B) price","(A) sleepy / (B) reason","(A) sleepy / (B) price","(A) hungry / (B) reason"],"oko":["(A) 화가 난 / (B) 이유","(A) 화가 난 / (B) 가격","(A) 졸린 / (B) 이유","(A) 졸린 / (B) 가격","(A) 배고픈 / (B) 이유"],"r":{"a":"1) (A) upset / (B) reason ((A) 화가 난 / (B) 이유)","ev":"8번 문장","s":[[8,"Say that you are upset and explain the reason why.","당신이 화가 났다는 것을 말하고 그 이유를 설명해라."]],"w":"8번 문장은 “당신이 화가 났다(upset)는 것을 말하고 그 이유(reason)를 설명해라”라는 뜻이에요.","c":1},"h":"b13f897112"},{"n":10,"t":"fill","q":"This way, you can explain your [A] without [B] the other person.","ko":"이런 방식으로, 당신은 다른 사람을 [B] 않고 당신의 [A]을(를) 설명할 수 있다.","bank":["feelings","attacking","quickly","clearly","always","never"],"bko":{"feelings":"기분, 감정들","attacking":"공격하는(attack의 -ing형)","quickly":"빠르게","clearly":"분명하게","always":"언제나","never":"절대 ~않는"},"r":{"a":"[A] feelings (기분, 감정들), [B] attacking (공격하는(attack의 -ing형))","ev":"13번 문장","s":[[13,"This way, you can explain your feelings without attacking the other person.","이런 방식으로, 당신은 다른 사람을 공격하지 않고 당신의 기분을 설명할 수 있다."]],"w":"13번 문장은 “이런 방식으로, 다른 사람을 공격하지 않고 당신의 기분을 설명할 수 있다”는 뜻이에요. without 뒤에는 동사의 -ing형이 와서 attacking이에요.","c":null},"h":"37ed593dae"}]},{"u":10,"id":"nl3-10-1","no":1,"ko":"영웅이 된 비둘기","items":[{"n":1,"t":"tf","q":"The story of the pigeon happened during World War I.","ko":"그 비둘기 이야기는 제1차 세계 대전 중에 일어났다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It happened during World War I.","그것은 제1차 세계 대전 중에 일어났다."]],"w":"2번 문장에서 이야기가 제1차 세계 대전 중에 일어났다고 해요.","c":"T"},"h":"d260e046a0"},{"n":2,"t":"tf","q":"Cher Ami was the first pigeon that the soldiers sent.","ko":"Cher Ami는 병사들이 처음으로 보낸 비둘기였다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Finally, they sent their last pigeon, Cher Ami, which means “dear friend” in French.","마침내, 그들은 자신들의 마지막 비둘기인 Cher Ami(셰르 아미)를 보냈는데, 그것은 프랑스어로 ‘소중한 친구’를 의미한다."]],"w":"6번 문장에서 병사들은 자신들의 마지막(last) 비둘기인 Cher Ami를 보냈어요. 처음이라는 말은 틀려요.","c":"F"},"h":"cf7e9b2694"},{"n":3,"t":"tf","q":"Cher Ami kept flying even though he was shot.","ko":"Cher Ami는 총에 맞았는데도 계속 날았다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Like the other pigeons, Cher Ami was shot, but he kept flying and delivered his message.","다른 비둘기들처럼 Cher Ami도 총에 맞았지만, 계속 날아서 메시지를 전달했다."]],"w":"7번 문장에서 Cher Ami는 총에 맞았지만 계속 날아서(kept flying) 메시지를 전달했어요.","c":"T"},"h":"638c06fe55"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (During a big battle, some American soldiers were trapped.)","ko":"큰 전투를 치르는 동안, 몇 명의 미군들이 ~ 있었다. (trapped = ?)","opts":["도착해","갇혀","훈련받고","도망쳐"],"word":"trapped","r":{"a":"2) 갇혀","ev":"4번 문장","s":[[4,"During a big battle, some American soldiers were trapped.","큰 전투를 치르는 동안, 몇 명의 미군들이 갇혀 있었다."]],"w":"4번 문장에서 병사들이 도움을 요청하려고 비둘기를 보냈다고 이어지므로(5번) 병사들은 갇힌 상태였어요. trap(가두다)의 수동형이라 '갇혀 있었다'예요.","c":2},"h":"8f7b997183"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Even though he was seriously wounded and blinded in one eye, Cher Ami flew 25 miles in 25 minutes and saved almost 200 lives.)","ko":"비록 심하게 ~ 한쪽 눈이 멀었지만, Cher Ami는 25분 만에 25마일을 날았다. (wounded = ?)","opts":["화난","피곤한","기쁜","다친"],"word":"wounded","r":{"a":"4) 다친","ev":"8번 문장","s":[[8,"Even though he was seriously wounded and blinded in one eye, Cher Ami flew 25 miles in 25 minutes and saved almost 200 lives.","비록 심하게 다치고 한쪽 눈이 멀었지만, Cher Ami는 25분 만에 25마일을 날아서 거의 200명의 목숨을 구했다."]],"w":"8번 문장의 seriously wounded and blinded in one eye는 심하게 다치고 한쪽 눈이 멀었다는 뜻이에요. wounded는 '다친'이라는 뜻이에요.","c":4},"h":"4e3565b713"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nHere is a touching story about a special pigeon that saved people’s lives.","ko":"밑줄 친 that이 가리키는 것은?","sko":"여기 사람들의 목숨을 구한 특별한 비둘기에 관한 감동적인 이야기가 있다.","pron":"that","opts":["특별한 비둘기","이야기","전쟁","사람들"],"r":{"a":"1) 특별한 비둘기","ev":"1번 문장","s":[[1,"Here is a touching story about a special pigeon that saved people’s lives.","여기 사람들의 목숨을 구한 특별한 비둘기에 관한 감동적인 이야기가 있다."]],"w":"that saved people’s lives는 “사람들의 목숨을 구한”이라는 뜻이에요. 목숨을 구한 것은 바로 앞의 a special pigeon(특별한 비둘기)이므로 that = a special pigeon이에요.","c":1,"k":"that = 특별한 비둘기"},"h":"6ee9700dfd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They tried to send pigeons with a message asking for help, but each one was shot by the enemy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 도움을 요청하는 메시지와 함께 비둘기를 보내려고 노력했지만, 비둘기들은 한 마리씩 적군이 쏜 총에 맞았다.","opts":["그들은 도움을 요청하는 메시지와 함께 비둘기를 보내려 했지만, 비둘기들은 한 마리씩 적에게 총을 맞았다.","그들은 도움을 요청하는 메시지를 비둘기 없이 직접 보내려 했지만 실패했다.","그들은 비둘기를 한 마리씩 적에게 선물로 보내려 했다.","그들은 비둘기들이 모두 무사히 도착해서 도움을 받았다."],"r":{"a":"1) 그들은 도움을 요청하는 메시지와 함께 비둘기를 보내려 했지만, 비둘기들은 한 마리씩 적에게 총을 맞았다.","ev":"5번 문장","s":[[5,"They tried to send pigeons with a message asking for help, but each one was shot by the enemy.","그들은 도움을 요청하는 메시지와 함께 비둘기를 보내려고 노력했지만, 비둘기들은 한 마리씩 적군이 쏜 총에 맞았다."]],"w":"tried to send pigeons with a message asking for help는 “도움을 요청하는 메시지와 함께 비둘기를 보내려고 했다”는 뜻이고, each one was shot by the enemy는 “한 마리씩 적에게 총을 맞았다”는 뜻이에요.","c":1},"h":"0fc2459c44"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Pigeons were used to carry messages at that time.","Pigeons were used to carry food at that time.","Pigeons were not used at all at that time.","Pigeons were used to fight the enemy at that time."],"oko":["그 당시에 비둘기는 메시지를 전달하는 데 이용되었다.","그 당시에 비둘기는 음식을 나르는 데 이용되었다.","그 당시에 비둘기는 전혀 이용되지 않았다.","그 당시에 비둘기는 적과 싸우는 데 이용되었다."],"r":{"a":"1) Pigeons were used to carry messages at that time. (그 당시에 비둘기는 메시지를 전달하는 데 이용되었다.)","ev":"3번 문장","s":[[3,"At that time, pigeons were used to carry messages.","그 당시에, 비둘기는 메시지를 전달하는 데 이용되었다."]],"w":"3번 문장에서 그 당시에 비둘기는 메시지를 전달하는 데 이용되었다고 해요.","c":1},"h":"5979960977"},{"n":9,"t":"sum","q":"(A) the other pigeons, Cher Ami was shot, but he kept flying and (B) his message.","ko":"다른 비둘기들 (A) Cher Ami도 총에 맞았지만, 계속 날아서 메시지를 (B).","opts":["(A) Like / (B) delivered","(A) Like / (B) lost","(A) Unlike / (B) delivered","(A) Unlike / (B) lost","(A) Like / (B) hid"],"oko":["(A) 처럼 / (B) 전달했다","(A) 처럼 / (B) 잃어버렸다","(A) 와 달리 / (B) 전달했다","(A) 와 달리 / (B) 잃어버렸다","(A) 처럼 / (B) 숨겼다"],"r":{"a":"1) (A) Like / (B) delivered ((A) 처럼 / (B) 전달했다)","ev":"7번 문장","s":[[7,"Like the other pigeons, Cher Ami was shot, but he kept flying and delivered his message.","다른 비둘기들처럼 Cher Ami도 총에 맞았지만, 계속 날아서 메시지를 전달했다."]],"w":"7번 문장은 “다른 비둘기들처럼(Like) Cher Ami도 총에 맞았지만, 계속 날아서 메시지를 전달했다(delivered)”는 뜻이에요.","c":1},"h":"7a0668df43"},{"n":10,"t":"fill","q":"Finally, they sent their [A] pigeon, Cher Ami, which means “dear friend” in [B].","ko":"마침내, 그들은 자신들의 [A] 비둘기인 Cher Ami를 보냈는데, 그것은 [B](으)로 ‘소중한 친구’를 의미한다.","bank":["last","French","carry","lives","flew","during"],"bko":{"last":"마지막의","French":"프랑스어","carry":"나르다","lives":"목숨들","flew":"날았다","during":"~ 동안"},"r":{"a":"[A] last (마지막의), [B] French (프랑스어)","ev":"6번 문장","s":[[6,"Finally, they sent their last pigeon, Cher Ami, which means “dear friend” in French.","마침내, 그들은 자신들의 마지막 비둘기인 Cher Ami(셰르 아미)를 보냈는데, 그것은 프랑스어로 ‘소중한 친구’를 의미한다."]],"w":"6번 문장은 “마침내, 그들은 자신들의 마지막 비둘기인 Cher Ami를 보냈는데, 그것은 프랑스어로 ‘소중한 친구’를 의미한다”는 뜻이에요.","c":null},"h":"e52b63b8f9"}]},{"u":10,"id":"nl3-10-2","no":2,"ko":"배불뚝이 물고기","items":[{"n":1,"t":"tf","q":"A blowfish can blow itself up when it is faced with danger.","ko":"복어는 위험에 직면하면 자신을 부풀릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"All of these names come from their most impressive characteristic: when they are faced with danger, they can blow themselves up like a balloon.","이 이름들은 모두 그들의 가장 인상적인 특징에서 유래한 것인데, 그것은 그들이 위험에 직면했을 때 풍선처럼 자신을 부풀릴 수 있다는 것이다."]],"w":"2번 문장에서 복어는 위험에 직면하면 풍선처럼 자신을 부풀릴 수 있다고 해요.","c":"T"},"h":"89e8726588"},{"n":2,"t":"tf","q":"In the ocean, a blowfish fills its stomach up with air to blow itself up.","ko":"바다에서 복어는 배를 공기로 가득 채워 자신을 부풀린다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"If they are in the ocean, they do this by filling their stomach up with water.","그들은 바다에 있으면 배를 물로 가득 채움으로써 이렇게 한다."]],"w":"3번 문장에서 바다에 있을 때는 배를 물(water)로 채운다고 해요. 공기는 땅 위로 올려졌을 때 쓰는 방법이에요(4번).","c":"F"},"h":"af8f0e3ecb"},{"n":3,"t":"tf","q":"Most enemies are surprised by the sudden change, so the blowfish can escape.","ko":"대부분의 적들은 갑작스러운 변화에 놀라고, 그래서 복어는 도망칠 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Most of their enemies are so surprised by this sudden change that the blowfish are able to escape.","그들의 적 대부분이 이런 갑작스러운 변화에 너무 놀라서 복어는 도망칠 수 있게 된다."]],"w":"5번 문장에서 대부분의 적이 이 갑작스러운 변화에 너무 놀라서 복어가 도망칠 수 있다고 해요.","c":"T"},"h":"40efd5309a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Most of their enemies are so surprised by this sudden change that the blowfish are able to escape.)","ko":"그들의 적 대부분이 이런 ~ 변화에 너무 놀라서 복어는 도망칠 수 있다. (sudden = ?)","opts":["느린","익숙한","갑작스러운","즐거운"],"word":"sudden","r":{"a":"3) 갑작스러운","ev":"5번 문장","s":[[5,"Most of their enemies are so surprised by this sudden change that the blowfish are able to escape.","그들의 적 대부분이 이런 갑작스러운 변화에 너무 놀라서 복어는 도망칠 수 있게 된다."]],"w":"5번 문장에서 복어가 갑자기 부푸는 변화에 적들이 놀란다고 했어요. sudden change는 '갑작스러운 변화'예요.","c":3},"h":"270ee54f54"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The bodies of blowfish contain a more powerful defense than the ability to suddenly get bigger—a poison that can be deadly.)","ko":"복어의 몸에는 ~ 수 있는 독이 들어 있다. (deadly = ?)","opts":["치명적인","약한","귀여운","유명한"],"word":"deadly","r":{"a":"1) 치명적인","ev":"7번 문장","s":[[7,"The bodies of blowfish contain a more powerful defense than the ability to suddenly get bigger—a poison that can be deadly.","복어의 몸에는 갑자기 더 커지는 능력보다 더 강력한 방어법이 있는데, 그것은 바로 치명적일 수 있는 독이다."]],"w":"7번 문장의 poison that can be deadly는 목숨을 잃게 할 수도 있는 독이라는 뜻이에요. deadly는 '치명적인'이에요.","c":1},"h":"fdade0cee8"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nAll of these names come from their most impressive characteristic: when they are faced with danger, they can blow themselves up like a balloon.","ko":"밑줄 친 their가 가리키는 것은?","sko":"이 이름들은 모두 그들의 가장 인상적인 특징에서 유래한 것인데, 그것은 그들이 위험에 직면했을 때 풍선처럼 자신을 부풀릴 수 있다는 것이다.","pron":"their","opts":["복어","이름들","적들","풍선"],"r":{"a":"1) 복어","ev":"2번 문장","s":[[2,"All of these names come from their most impressive characteristic: when they are faced with danger, they can blow themselves up like a balloon.","이 이름들은 모두 그들의 가장 인상적인 특징에서 유래한 것인데, 그것은 그들이 위험에 직면했을 때 풍선처럼 자신을 부풀릴 수 있다는 것이다."]],"w":"their most impressive characteristic은 “그들의 가장 인상적인 특징”이에요. 위험할 때 풍선처럼 부풀 수 있는 것은 복어(blowfish)이므로 their = blowfish예요.","c":1,"k":"their = 복어"},"h":"1064d90f13"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But if they still attack, they will get another unpleasant surprise.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 적들이 여전히 공격한다면, 그들은 또 다른 불쾌한 놀라운 일을 당하게 될 것이다.","opts":["그러나 적들이 여전히 공격한다면, 그들은 또 다른 불쾌한 놀라운 일을 당하게 될 것이다.","그러나 적들이 도망가면, 복어는 또 다른 즐거운 놀라운 일을 당하게 될 것이다.","그러나 복어가 공격한다면, 적들은 도망갈 수 있게 될 것이다.","그러나 적들이 여전히 놀란다면, 복어는 불쾌한 일을 당하게 될 것이다."],"r":{"a":"1) 그러나 적들이 여전히 공격한다면, 그들은 또 다른 불쾌한 놀라운 일을 당하게 될 것이다.","ev":"6번 문장","s":[[6,"But if they still attack, they will get another unpleasant surprise.","그러나 적들이 여전히 공격한다면, 그들은 또 다른 불쾌한 놀라운 일을 당하게 될 것이다."]],"w":"if they still attack은 “그들이 여전히 공격한다면”이고, another unpleasant surprise는 “또 다른 불쾌한 놀라운 일”이에요. 이 문장의 they는 복어를 공격하는 적들이에요.","c":1},"h":"2ec6b0a879"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["A blowfish can blow itself up with air when it is brought onto land.","Blowfish have only one name.","The poison of a blowfish is not dangerous.","Blowfish’s enemies are never surprised by the change."],"oko":["복어는 땅 위로 올려지면 공기로 몸을 부풀릴 수 있다.","복어에게는 이름이 하나뿐이다.","복어의 독은 위험하지 않다.","복어의 적들은 그 변화에 결코 놀라지 않는다."],"r":{"a":"1) A blowfish can blow itself up with air when it is brought onto land.","ev":"1번, 4번, 5번, 7번 문장","s":[[1,"Blowfish are known by many names, including balloonfish, bubblefish, and swellfish.","복어는 balloonfish, bubblefish, swellfish를 포함하여 여러 이름으로 알려져 있다."],[4,"But if they’re brought onto land, they can do the same thing with air.","그러나 땅 위로 올려지면 공기를 가지고 똑같이 할 수 있다."],[5,"Most of their enemies are so surprised by this sudden change that the blowfish are able to escape.","그들의 적 대부분이 이런 갑작스러운 변화에 너무 놀라서 복어는 도망칠 수 있게 된다."],[7,"The bodies of blowfish contain a more powerful defense than the ability to suddenly get bigger—a poison that can be deadly.","복어의 몸에는 갑자기 더 커지는 능력보다 더 강력한 방어법이 있는데, 그것은 바로 치명적일 수 있는 독이다."]],"w":"4번 문장에서 땅 위로 올려지면 공기로 똑같이 할 수 있다고 해요. 복어는 여러 이름이 있고(1번), 독은 치명적일 수 있고(7번), 대부분의 적은 놀라요(5번).","c":1},"h":"a8dd8bbf26"},{"n":9,"t":"sum","q":"Blowfish are (A) by many names, (B) balloonfish, bubblefish, and swellfish.","ko":"복어는 balloonfish, bubblefish, swellfish를 (B) 여러 이름으로 (A).","opts":["(A) known / (B) including","(A) known / (B) excluding","(A) hidden / (B) including","(A) hidden / (B) excluding","(A) known / (B) avoiding"],"oko":["(A) 알려져 있다 / (B) 포함하여","(A) 알려져 있다 / (B) 제외하고","(A) 숨겨져 있다 / (B) 포함하여","(A) 숨겨져 있다 / (B) 제외하고","(A) 알려져 있다 / (B) 피하여"],"r":{"a":"1) (A) known / (B) including ((A) 알려져 있다 / (B) 포함하여)","ev":"1번 문장","s":[[1,"Blowfish are known by many names, including balloonfish, bubblefish, and swellfish.","복어는 balloonfish, bubblefish, swellfish를 포함하여 여러 이름으로 알려져 있다."]],"w":"1번 문장은 복어가 balloonfish, bubblefish, swellfish를 포함하여(including) 여러 이름으로 알려져 있다(are known)는 뜻이에요.","c":1},"h":"a698784f38"},{"n":10,"t":"fill","q":"If they are in the ocean, they [B] this by filling their stomach up with [A].","ko":"그들은 바다에 있으면 배를 [A](으)로 가득 채움으로써 이렇게 [B].","bank":["water","do","land","names","danger","escape"],"bko":{"water":"물","do":"하다","land":"땅","names":"이름들","danger":"위험","escape":"도망치다"},"r":{"a":"[A] water (물), [B] do (하다)","ev":"3번 문장","s":[[3,"If they are in the ocean, they do this by filling their stomach up with water.","그들은 바다에 있으면 배를 물로 가득 채움으로써 이렇게 한다."]],"w":"3번 문장은 바다에 있으면 배를 물로 가득 채움으로써 그렇게 한다는 뜻이에요. do this는 “이렇게 하다”이고, with water는 “물로”예요.","c":null},"h":"81e5374116"}]},{"u":10,"id":"nl3-10-3","no":3,"ko":"주인님을 위해 제가 할게요!","items":[{"n":1,"t":"tf","q":"The robot is controlled by a man who is about 100 kilometers away.","ko":"그 로봇은 약 100킬로미터 떨어져 있는 사람에 의해 조종된다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"But this robot is being controlled by a man who is about 100 kilometers away.","그러나 이 로봇은 약 100킬로미터 떨어져 있는 사람에 의해 조종되고 있다."]],"w":"4번 문장에서 이 로봇은 약 100킬로미터 떨어져 있는 사람에 의해 조종되고 있다고 해요.","c":"T"},"h":"ab60433c2b"},{"n":2,"t":"tf","q":"The man who controls the robot is not paralyzed at all.","ko":"로봇을 조종하는 사람은 전혀 마비되지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Even more surprising, the man is completely paralyzed.","더욱 놀라운 점은, 그 사람은 완전히 마비되어 있다는 것이다."]],"w":"5번 문장에서 그 사람은 완전히 마비되어 있다고 해요. 마비되지 않았다는 말은 반대예요.","c":"F"},"h":"e0789bfedd"},{"n":3,"t":"tf","q":"The robot was created by a Swiss scientist.","ko":"그 로봇은 스위스 과학자에 의해 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"This amazing robot was created by a Swiss scientist named José del R. Millán.","이 놀라운 로봇은 José del R. Millán(호세 델 R. 밀란)이라는 스위스 과학자에 의해 만들어졌다."]],"w":"7번 문장에서 이 로봇은 José del R. Millán이라는 스위스 과학자가 만들었다고 해요.","c":"T"},"h":"e50f7aa90d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A small, round robot moves through a crowded office.)","ko":"작고 둥근 로봇이 ~ 사무실을 돌아다닌다. (crowded = ?)","opts":["조용한","붐비는","어두운","작은"],"word":"crowded","r":{"a":"2) 붐비는","ev":"1~2번 문장","s":[[1,"A small, round robot moves through a crowded office.","작고 둥근 로봇이 혼잡한 사무실을 돌아다닌다."],[2,"It bumps into people and furniture as it travels from one side of the room to the other.","그것은 방의 한쪽에서 다른 쪽으로 이동할 때 사람과 가구에 부딪힌다."]],"w":"1번에서 로봇이 지나다니는 사무실이 crowded하고, 2번에서 로봇이 사람과 가구에 부딪힌다고 해요. 사람이 많아 복잡하다는 뜻의 '붐비는'이에요.","c":2},"h":"d4d96cb2ae"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It contains special software that can actually read a person’s thoughts.)","ko":"그것에는 사람의 생각을 읽을 수 있는 특수한 소프트웨어가 ~. (contains = ?)","opts":["고친다","판다","들어 있다","없앤다"],"word":"contains","r":{"a":"3) 들어 있다","ev":"8번 문장","s":[[8,"It contains special software that can actually read a person’s thoughts.","그것에는 실제로 사람의 생각을 읽을 수 있는 특수한 소프트웨어가 들어 있다."]],"w":"8번 문장에서 로봇이 contains special software라고 해요. 로봇 안에 소프트웨어가 들어 있다는 뜻이에요.","c":3},"h":"031e46cc23"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nPeople simply have to think commands, and the robot will follow them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"사람들은 명령을 생각하기만 하면 되고, 로봇은 그것을 따르게 된다.","opts":["사람들","뇌파","소프트웨어","명령"],"r":{"a":"4) 명령","ev":"9번 문장","s":[[9,"People simply have to think commands, and the robot will follow them.","사람들은 명령을 생각하기만 하면 되고, 로봇은 그것을 따르게 된다."]],"w":"9번 문장에서 사람들은 명령(commands)을 생각하기만 하면 되고, 로봇이 그것들(them)을 따른다고 해요.","c":4},"h":"0415594156"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It can be used to do simple tasks, such as picking up objects and communicating with others.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"로봇은 물건을 집고 다른 이들과 의사소통하는 것과 같은 간단한 일을 하는 데 사용될 수 있다.","opts":["로봇은 물건을 집는 것 같은 복잡한 일만 할 수 있다.","로봇은 다른 사람과 의사소통하는 것을 막는 데 쓰인다.","로봇은 물건을 집고 다른 이들과 의사소통하는 것과 같은 간단한 일에 쓰일 수 있다.","사람들은 물건을 집을 때 이 로봇을 쓸 수 없다."],"r":{"a":"3) 로봇은 물건을 집고 다른 이들과 의사소통하는 것과 같은 간단한 일에 쓰일 수 있다.","ev":"10번 문장","s":[[10,"It can be used to do simple tasks, such as picking up objects and communicating with others.","로봇은 물건을 집고 다른 이들과 의사소통하는 것과 같은 간단한 일을 하는 데 사용될 수 있다."]],"w":"such as는 '~와 같은'이라는 뜻이에요. 물건 집기와 의사소통은 로봇이 할 수 있는 간단한 일의 예예요.","c":3},"h":"ba3b6dce48"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The robot stays still in a quiet house.","The man controlling the robot is in the same room as it.","The man controls the robot with his brain waves.","The robot follows commands only when people speak out loud."],"oko":["그 로봇은 조용한 집에서 가만히 서 있다.","로봇을 조종하는 사람은 로봇과 같은 방에 있다.","그 사람은 자신의 뇌파로 로봇을 조종한다.","그 로봇은 사람들이 큰 소리로 말할 때에만 명령을 따른다."],"r":{"a":"3) The man controls the robot with his brain waves. (그 사람은 자신의 뇌파로 로봇을 조종한다.)","ev":"6번 문장","s":[[6,"He is controlling the robot with his brain waves!","그는 자신의 뇌파로 로봇을 조종하고 있다!"]],"w":"6번 문장에서 그는 자신의 뇌파로 로봇을 조종하고 있다고 해요. 4번 문장에서 그 사람은 약 100킬로미터 떨어져 있다고 했으니 같은 방에 있다는 2번은 틀려요.","c":3},"h":"1b0f197245"},{"n":9,"t":"sum","q":"The robot (A) into people and furniture as it (B) from one side of the room to the other.","ko":"그 로봇은 방의 한쪽에서 다른 쪽으로 (B) 때 사람과 가구에 (A).","opts":["(A) bumps / (B) travels","(A) bumps / (B) sleeps","(A) jumps / (B) travels","(A) jumps / (B) sleeps","(A) bumps / (B) disappears"],"oko":["(A) 부딪힌다 / (B) 이동할","(A) 부딪힌다 / (B) 잠잘","(A) 뛰어오른다 / (B) 이동할","(A) 뛰어오른다 / (B) 잠잘","(A) 부딪힌다 / (B) 사라질"],"r":{"a":"1) (A) bumps / (B) travels ((A) 부딪힌다 / (B) 이동할)","ev":"2번 문장","s":[[2,"It bumps into people and furniture as it travels from one side of the room to the other.","그것은 방의 한쪽에서 다른 쪽으로 이동할 때 사람과 가구에 부딪힌다."]],"w":"2번 문장은 로봇이 방의 한쪽에서 다른 쪽으로 이동할(travels) 때 사람과 가구에 부딪힌다(bumps into)는 뜻이에요.","c":1},"h":"4bde9591f0"},{"n":10,"t":"fill","q":"Hopefully, this [A] will make life [B] for people who are paralyzed.","ko":"바라건대 이 [A]이(가) 마비된 사람들을 위해 생활을 더욱 [B] 만들어 줄 것이다.","bank":["technology","easier","follow","think","actually","simply"],"bko":{"technology":"기술","easier":"더 쉬운, 더 수월한","follow":"따르다","think":"생각하다","actually":"실제로","simply":"단순히"},"r":{"a":"[A] technology (기술), [B] easier (더 쉬운, 더 수월한)","ev":"11번 문장","s":[[11,"Hopefully, this technology will make life easier for people who are paralyzed.","바라건대 이 기술이 마비된 사람들을 위해 생활을 더욱 수월하게 만들어 줄 것이다."]],"w":"11번 문장은 “바라건대 이 기술이 마비된 사람들을 위해 생활을 더욱 수월하게 만들어 줄 것이다”는 뜻이에요. make life easier는 “생활을 더 수월하게 만들다”예요.","c":null},"h":"4616bb768e"}]},{"u":10,"id":"nl3-10-4","no":4,"ko":"달걀은 생각보다 강해요","items":[{"n":1,"t":"tf","q":"An egg doesn’t break when you squeeze it between your forefinger and thumb from top to bottom.","ko":"달걀을 집게손가락과 엄지손가락으로 위아래에서 쥐어도 깨지지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"Put your forefinger on the top of the egg and your thumb on the bottom.","집게손가락을 달걀의 맨 위에 놓고 엄지손가락을 맨 아래에 두어라."],[4,"No matter how hard you squeeze, the egg won’t break!","당신이 아무리 세게 쥐어도, 달걀은 깨지지 않을 것이다!"]],"w":"3번에서 집게손가락을 맨 위, 엄지손가락을 맨 아래에 놓고, 4번에서 아무리 세게 쥐어도 달걀은 깨지지 않는다고 해요.","c":"T"},"h":"152da9d8f0"},{"n":2,"t":"tf","q":"Eggs are strongest at their sides.","ko":"달걀은 옆면에서 가장 강하다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Eggs are strongest at the top and bottom.","달걀은 맨 위와 맨 아래 부분에서 가장 강하다."]],"w":"12번 문장에서 달걀은 맨 위와 맨 아래에서 가장 강하다고 해요. 옆면이라는 말은 틀려요.","c":"F"},"h":"7fc5963a08"},{"n":3,"t":"tf","q":"Chefs hit eggs on the side of a bowl when they want to cook with them.","ko":"요리사들은 달걀로 요리하려고 할 때 그릇의 한쪽에 달걀을 친다.","r":{"a":"T (본문과 맞는 내용)","ev":"15번 문장","s":[[15,"That’s why chefs hit eggs on the side of a bowl when they want to cook with them.","그래서 요리사들이 달걀로 요리하려고 할 때 그릇의 한쪽에 달걀을 치는 것이다."]],"w":"15번 문장에서 요리사들이 달걀로 요리하려고 할 때 그릇의 한쪽에 달걀을 친다고 해요.","c":"T"},"h":"ac8c15dfed"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If you squeeze the entire egg, it will not break.)","ko":"달걀 ~ 쥔다면 그것은 깨지지 않을 것이다. (entire = ?)","opts":["작은","깨진","오래된","전체의"],"word":"entire","r":{"a":"4) 전체의","ev":"6~7번 문장","s":[[6,"If you squeeze the entire egg, it will not break.","달걀 전체를 쥔다면 그것은 깨지지 않을 것이다."],[7,"However, if you only press against one side, it will probably break.","그러나 한쪽만 누르면 아마도 달걀은 깨질 것이다."]],"w":"6번에서 달걀 전체를 쥐면 안 깨지고, 7번에서 한쪽만 누르면 깨진다고 해요. 한쪽(one side)과 대비되는 entire는 '전체의'예요.","c":4},"h":"48d4486344"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, when that pressure is focused on one spot, the egg is more likely to break.)","ko":"그러나 그 압력이 한 지점에 ~ 달걀은 더 쉽게 깨질 것이다. (focused = ?)","opts":["집중된","사라진","약해진","반복된"],"word":"focused","r":{"a":"1) 집중된","ev":"13~14번 문장","s":[[13,"And because they are curved, pressure is spread out across their entire surface.","그리고 곡선으로 되어 있기 때문에, 압력이 달걀의 전체 표면으로 분산된다."],[14,"However, when that pressure is focused on one spot, the egg is more likely to break.","그러나 그 압력이 한 지점에 집중되면, 달걀은 더 쉽게 깨질 것이다."]],"w":"13번에서 압력이 전체 표면으로 퍼진다(spread out)고 했고, 14번에서 However 한 지점에 focused되면 더 잘 깨진다고 해요. 퍼지는 것과 반대로 한 곳에 '집중된'이라는 뜻이에요.","c":1},"h":"2c710b37a7"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nThe secret is their curved shape. It is similar to an arch, a shape often used in buildings because of its strength.","ko":"밑줄 친 It이 가리키는 것은?","sko":"비밀은 그것의 곡선 모양이다. 그것은 내구력 때문에 건물에 자주 사용되는 모양인 아치와 비슷하다.","pron":"It","opts":["건물","달걀의 곡선 모양","그릇의 가장자리","달걀 껍데기를 깨는 일"],"r":{"a":"2) 달걀의 곡선 모양","ev":"10~11번 문장","s":[[10,"The secret is their curved shape.","비밀은 그것의 곡선 모양이다."],[11,"It is similar to an arch, a shape often used in buildings because of its strength.","그것은 내구력 때문에 건물에 자주 사용되는 모양인 아치와 비슷하다."]],"w":"10번 문장에서 비밀은 달걀의 곡선 모양(curved shape)이라고 해요. 11번 문장의 It is similar to an arch는 “그것은 아치와 비슷하다”는 뜻이므로 It = 달걀의 곡선 모양이에요.","c":2,"k":"It = 달걀의 곡선 모양"},"h":"7a31663903"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Unless you want to clean up a mess, don’t try this!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"난장판을 치우고 싶지 않다면 이것을 시도하지 마라!","opts":["난장판을 치우고 싶다면 이것을 시도하지 마라.","난장판을 치우고 싶지 않아도 이것을 꼭 시도해라.","난장판을 치우고 싶지 않다면 이것을 시도하지 마라.","이것을 시도해야 난장판이 치워진다."],"r":{"a":"3) 난장판을 치우고 싶지 않다면 이것을 시도하지 마라.","ev":"8번 문장","s":[[8,"Unless you want to clean up a mess, don’t try this!","난장판을 치우고 싶지 않다면 이것을 시도하지 마라!"]],"w":"Unless you want to ~는 '~하고 싶지 않다면'이에요(= If you don’t want to ~). 난장판을 치우고 싶지 않다면 이것을 시도하지 말라는 뜻이에요.","c":3},"h":"8768b4731f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Eggs are actually very strong.","Eggs are weaker than most people think.","Eggs break easily when you hold them in your hand.","Eggs are strong only when they are cooked."],"oko":["달걀은 사실 아주 강하다.","달걀은 대부분의 사람들이 생각하는 것보다 약하다.","달걀은 손에 쥐면 쉽게 깨진다.","달걀은 익혔을 때에만 강하다."],"r":{"a":"1) Eggs are actually very strong. (달걀은 사실 아주 강하다.)","ev":"1번 문장","s":[[1,"Most people think eggs break easily, but they’re actually very strong.","대부분의 사람들은 달걀이 쉽게 깨진다고 생각하지만, 사실 달걀은 아주 강하다."]],"w":"1번 문장에서 대부분의 사람들은 달걀이 쉽게 깨진다고 생각하지만 사실 달걀은 아주 강하다고 해요.","c":1},"h":"3776be2c7f"},{"n":9,"t":"sum","q":"However, if you only (A) against one side, it will (B) break.","ko":"그러나 한쪽만 (A) 달걀은 (B) 깨질 것이다.","opts":["(A) press / (B) probably","(A) press / (B) never","(A) hide / (B) probably","(A) hide / (B) never","(A) press / (B) hardly"],"oko":["(A) 누르면 / (B) 아마도","(A) 누르면 / (B) 절대","(A) 숨기면 / (B) 아마도","(A) 숨기면 / (B) 절대","(A) 누르면 / (B) 거의 ~않게"],"r":{"a":"1) (A) press / (B) probably ((A) 누르면 / (B) 아마도)","ev":"7번 문장","s":[[7,"However, if you only press against one side, it will probably break.","그러나 한쪽만 누르면 아마도 달걀은 깨질 것이다."]],"w":"7번 문장은 “그러나 한쪽만 누르면(press) 아마도(probably) 달걀은 깨질 것이다”는 뜻이에요.","c":1},"h":"869e95e26d"},{"n":10,"t":"fill","q":"Next, place the egg in the [A] of your hand and [B] your fingers around it.","ko":"다음으로, 달걀을 손의 [A]에 놓고 그 주위를 손가락으로 [B].","bank":["center","wrap","strongest","similar","often","together"],"bko":{"center":"가운데, 중앙","wrap":"감싸다","strongest":"가장 강한","similar":"비슷한","often":"자주","together":"함께"},"r":{"a":"[A] center (가운데, 중앙), [B] wrap (감싸다)","ev":"5번 문장","s":[[5,"Next, place the egg in the center of your hand and wrap your fingers around it.","다음으로, 달걀을 손 가운데에 놓고 그 주위를 손가락으로 감싸라."]],"w":"5번 문장은 “다음으로, 달걀을 손 가운데에 놓고 그 주위를 손가락으로 감싸라”는 뜻이에요. in the center of ~는 “~의 가운데에”이고, wrap은 “감싸다”예요.","c":null},"h":"68f5959be1"}]}];
