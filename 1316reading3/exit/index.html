<style>

.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}

.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}

<script>
var P=[{"u":1,"id":"nl3-01-1","no":1,"ko":"우주 비행사들은 어떻게 필기할까?","items":[{"n":1,"t":"tf","q":"Paul Fisher invented a pen that didn’t need gravity to work.","ko":"Paul Fisher는 작동하는 데 중력이 필요 없는 펜을 발명했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In 1965, a man named Paul Fisher invented a pen that didn’t need gravity to work.","1965년, Paul Fisher(폴 피셔)라는 한 남자가 (제대로) 기능하는 데 중력이 필요 없는 펜을 발명했다."]],"w":"6번 문장에서 Paul Fisher가 invent(발명하다)한 펜은 중력이 필요 없는 펜이라고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"f74f9690c7"},{"n":2,"t":"tf","q":"Ballpoint pens work well in space without gravity.","ko":"볼펜은 중력이 없는 우주에서도 잘 작동한다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"Ballpoint pens didn’t work either.","볼펜도 제 기능을 못 했다."],[5,"That’s because they need gravity to make the ink flow onto the paper.","잉크가 종이 위로 흐르게 하려면 볼펜은 중력을 필요로 하기 때문이다."]],"w":"4번에서 볼펜도 제 기능을 못 했다고 하고, 5번에서 잉크를 흐르게 하려면 중력이 필요하다고 해요. 우주에서 잘 작동한다는 말은 반대예요.","c":"F"},"h":"8e3b913863"},{"n":3,"t":"tf","q":"NASA started using the pen before Fisher named it the Space Pen.","ko":"NASA가 그 펜을 사용하기 시작한 뒤에 Fisher가 그것에 Space Pen이라는 이름을 붙였다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"After NASA started using the pen, Fisher named it the Space Pen.","NASA가 그 펜을 사용하기 시작한 후에, Fisher는 그것에 Space Pen이라는 이름을 붙였다."]],"w":"11번 After NASA started using the pen, Fisher named it the Space Pen. NASA가 먼저 쓰기 시작했고, 그 후에 Fisher가 이름을 붙였어요.","c":"T"},"h":"908110991a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But the tips broke off and floated dangerously around the spacecraft.)","ko":"하지만 (연필심) 끝이 부러져서 우주선 곳곳을 위험하게 ( ). (floated의 뜻은?)","word":"floated","opts":["가라앉았다","굴러떨어졌다","떠다녔다","얼어붙었다"],"r":{"a":"3) 떠다녔다","ev":"3번 문장","s":[[3,"But the tips broke off and floated dangerously around the spacecraft.","하지만 (연필심) 끝이 부러져서 우주선 곳곳을 위험하게 떠다녔다."]],"w":"3번에서 부러진 연필심 끝이 우주선 곳곳을 위험하게 돌아다녔다고 해요. float(떠다니다)의 과거형 floated = 떠다녔다예요.","c":3},"h":"bcbfab9b2d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Now it can be purchased by anyone.)","ko":"이제 그것은 누구나 ( ) 수 있다. (purchased의 뜻은?)","word":"purchased","opts":["수리된","구입된","발명된","금지된"],"r":{"a":"2) 구입된","ev":"13번 문장","s":[[13,"Now it can be purchased by anyone.","이제 그것은 누구나 구입할 수 있다."]],"w":"13번에서 Space Pen은 이제 누구나 살 수 있다고 해요. purchase(구입하다)의 수동 be purchased = 구입되다예요.","c":2},"h":"fe2096ebd1"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIn the early days of the space program, they used pencils.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"우주 프로그램 초기에, 그들은 연필을 사용했다.","opts":["연필들","우주선들","우주 비행사들","종이들"],"r":{"a":"3) 우주 비행사들","ev":"2번 문장","s":[[2,"In the early days of the space program, they used pencils.","우주 프로그램 초기에, 그들은 연필을 사용했다."]],"w":"2번 문장의 they(그들)는 연필을 사용한 사람들이에요. 연필을 쓰는 것은 우주 비행사들이에요. 연필, 우주선, 종이는 연필을 '사용'할 수 없어요.","c":3,"k":"they = 우주 비행사들"},"pron":"they","h":"c57021d3b5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When astronauts need to write on paper, what do they do?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우주 비행사들은 종이에 (글씨를) 써야 할 때 무엇을 할까?","opts":["우주 비행사들이 종이에 써야 할 때 무엇을 하는지 묻고 있다.","우주 비행사들은 종이가 필요 없다고 말하고 있다.","우주 비행사들이 언제 우주로 가는지 묻고 있다.","우주 비행사들이 종이를 어디서 사는지 묻고 있다."],"r":{"a":"1) 우주 비행사들이 종이에 써야 할 때 무엇을 하는지 묻고 있다.","ev":"1번 문장","s":[[1,"When astronauts need to write on paper, what do they do?","우주 비행사들은 종이에 (글씨를) 써야 할 때 무엇을 할까?"]],"w":"When astronauts need to write on paper, what do they do?는 '우주 비행사들은 종이에 써야 할 때 무엇을 할까?'라는 질문이에요. need to write는 '써야 한다', what do they do는 '그들은 무엇을 하나'예요.","c":1},"h":"7226b9feaa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Pencils did not break in a spacecraft.","Paul Fisher invented the pen in 1956.","The Space Pen has been used on many space missions.","The Space Pen can be bought only by NASA."],"oko":["연필은 우주선 안에서 부러지지 않았다.","Paul Fisher는 1956년에 그 펜을 발명했다.","Space Pen은 많은 우주 임무에 사용되어 왔다.","Space Pen은 NASA만 구입할 수 있다."],"r":{"a":"3) The Space Pen has been used on many space missions. (Space Pen은 많은 우주 임무에 사용되어 왔다.)","ev":"12번 문장","s":[[12,"It has been used on many space missions.","그것은 많은 우주에서의 임무에 사용되어 왔다."]],"w":"12번에서 Space Pen이 많은 우주 임무에 사용되어 왔다고 해요. 연필심은 부러졌고(3번), 펜은 1965년에 발명됐어요(6번).","c":3},"h":"5f6869726b"},{"n":9,"t":"sum","q":"Paul Fisher made the ink (A) so that the pen could be used in space or even (B).","ko":"Paul Fisher는 잉크를 (A) 만들어서, 그 펜이 우주나 심지어 (B)에서도 사용될 수 있게 했다.","opts":["(A) thicker / (B) underwater","(A) thinner / (B) underwater","(A) thicker / (B) outdoors","(A) thinner / (B) outdoors","(A) thicker / (B) underground"],"oko":["(A) 더 걸쭉한 / (B) 물속","(A) 더 묽은 / (B) 물속","(A) 더 걸쭉한 / (B) 야외","(A) 더 묽은 / (B) 야외","(A) 더 걸쭉한 / (B) 지하"],"r":{"a":"1) (A) thicker / (B) underwater ((A) 더 걸쭉한 / (B) 물속)","ev":"9~10번 문장","s":[[9,"To solve this problem, he made the ink thicker.","이 문제를 해결하기 위해 그는 잉크를 더 걸쭉하게 만들었다."],[10,"This allowed the pen to be used in space or even underwater.","이것은 그 펜이 우주나 심지어 물속에서도 사용될 수 있게 했다."]],"w":"9번에서 Fisher가 잉크를 더 걸쭉하게(thicker) 만들었고, 10번에서 그 덕분에 펜을 우주나 심지어 물속(underwater)에서도 쓸 수 있게 됐어요.","c":1},"h":"c8ca0b287f"},{"n":10,"t":"fill","q":"It kept ink in a special [A] container. However, the ink sometimes [B] out.","ko":"그것은 잉크를 특수한 [A] 용기에 담아 두었다. 하지만 그 잉크는 가끔 [B].","bank":["sealed","leaked","quickly","dangerously","carefully","gently"],"bko":{"sealed":"밀봉된","leaked":"새어 나왔다","quickly":"빠르게","dangerously":"위험하게","carefully":"조심스럽게","gently":"부드럽게"},"r":{"a":"[A] sealed (밀봉된), [B] leaked (새어 나왔다)","ev":"7~8번 문장","s":[[7,"It kept ink in a special sealed container.","그것은 특수한 밀폐 용기에 잉크를 담아 두었다."],[8,"However, the ink sometimes leaked out.","하지만 그 잉크는 가끔 새어 나왔다."]],"w":"7번에서 펜은 특수한 밀봉된(sealed) 용기에 잉크를 담아 두었고, 8번에서 잉크가 가끔 새어 나왔다(leaked)고 해요. leaked는 leak(새다)의 과거형이에요.","c":null},"h":"e42669527e"}]},{"u":1,"id":"nl3-01-2","no":2,"ko":"바닥에 떨어진 음식을 먹겠다고?","items":[{"n":1,"t":"tf","q":"A scientist placed bread on a dirty floor to find out whether the five-second rule is true.","ko":"한 과학자가 5초의 법칙이 사실인지 알아내기 위해 더러운 바닥에 빵을 놓았다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"To find out, a scientist placed some bread on a dirty floor for different lengths of time.","(이를) 알아내기 위해 한 과학자가 시간의 길이를 달리하여 더러운 바닥에 빵을 놓아 두었다."]],"w":"5번 문장에서 To find out(알아내기 위해) 과학자가 시간의 길이를 달리해 더러운 바닥에 빵을 놓아 두었다고 해요.","c":"T"},"h":"8886948c7a"},{"n":2,"t":"tf","q":"The scientist found that time is an important factor for bacteria on food.","ko":"그 과학자는 음식 위의 박테리아에 시간이 중요한 요인이라는 것을 발견했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"He found that time is not an important factor when food is exposed to bacteria.","그는 음식이 박테리아에 노출될 때, 시간은 중요한 요인이 아니라는 것을 발견했다."]],"w":"7번에서 음식이 박테리아에 노출될 때 시간은 중요한 요인이 아니라고(is not an important factor) 해요. 반대로 말한 진술이에요.","c":"F"},"h":"daa29c8d70"},{"n":3,"t":"tf","q":"The scientist checked the bread for bacteria.","ko":"그 과학자는 빵에 박테리아가 있는지 살펴보았다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Then he checked it for bacteria.","그러고 나서 그는 박테리아가 있는지 빵을 살펴보았다."]],"w":"6번 Then he checked it for bacteria. check A for B는 'A에 B가 있는지 살펴보다'예요. it = 빵이에요.","c":"T"},"h":"e89bf0a4ec"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Have you ever eaten food that you accidentally dropped on the floor?)","ko":"( ) 바닥에 떨어뜨린 음식을 먹어 본 적이 있는가? (accidentally의 뜻은?)","word":"accidentally","opts":["일부러","뜻하지 않게","빠르게","조용히"],"r":{"a":"2) 뜻하지 않게","ev":"1번 문장","s":[[1,"Have you ever eaten food that you accidentally dropped on the floor?","뜻하지 않게 바닥에 떨어뜨린 음식을 먹어 본 적이 있는가?"]],"w":"1번은 바닥에 떨어뜨린 음식을 말해요. 일부러 떨어뜨린 게 아니라 실수로 떨어뜨린 것이라서 accidentally = 뜻하지 않게, 우연히예요.","c":2},"h":"e472ddb5a5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He found that time is not an important factor when food is exposed to bacteria.)","ko":"그는 음식이 박테리아에 ( ) 때, 시간은 중요한 요인이 아니라는 것을 발견했다. (exposed의 뜻은?)","word":"exposed","opts":["보호된","씻긴","숨겨진","노출된"],"r":{"a":"4) 노출된","ev":"7번 문장","s":[[7,"He found that time is not an important factor when food is exposed to bacteria.","그는 음식이 박테리아에 노출될 때, 시간은 중요한 요인이 아니라는 것을 발견했다."]],"w":"음식이 박테리아에 닿는 상황이에요. expose(노출시키다)의 수동 be exposed to ~ = ~에 노출되다예요.","c":4},"h":"a720ae4a10"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIn fact, according to the so-called “five-second rule,” food is safe to eat if it has been on the floor for less than five seconds.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"실제로, 소위 ‘5초의 법칙’에 따르면, 음식이 바닥에 5초 미만으로 떨어져 있었으면 먹어도 안전하다.","opts":["음식","5초의 법칙","바닥","과학자"],"r":{"a":"1) 음식","ev":"3번 문장","s":[[3,"In fact, according to the so-called “five-second rule,” food is safe to eat if it has been on the floor for less than five seconds.","실제로, 소위 ‘5초의 법칙’에 따르면, 음식이 바닥에 5초 미만으로 떨어져 있었으면 먹어도 안전하다."]],"w":"it has been on the floor에서 바닥에 놓여 있었던 것은 food(음식)예요. 5초의 법칙은 '음식이 바닥에 5초 미만으로 있으면 안전하다'는 내용이에요.","c":1,"k":"it = 음식"},"pron":"it","h":"12b1dffa19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, is this really true?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 이것이 정말 사실일까?","opts":["하지만 이것이 정말 사실인지 의문을 던지고 있다.","하지만 이것이 확실히 사실이라고 말하고 있다.","하지만 이것이 언제 일어났는지 묻고 있다.","하지만 이것이 누구의 생각인지 묻고 있다."],"r":{"a":"1) 하지만 이것이 정말 사실인지 의문을 던지고 있다.","ev":"4번 문장","s":[[4,"However, is this really true?","하지만 이것이 정말 사실일까?"]],"w":"However, is this really true?는 '하지만 이것이 정말 사실일까?'예요. 앞에서 말한 내용이 진짜인지 의문을 던지는 문장이에요.","c":1},"h":"cf91642006"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The scientist placed bread on a table.","The scientist checked the bread for sugar.","Food can become unsafe to eat the moment bacteria get on it.","Dropped food is always safe to eat."],"oko":["그 과학자는 탁자 위에 빵을 놓았다.","그 과학자는 빵에 설탕이 있는지 살펴보았다.","음식은 박테리아가 묻는 순간 먹기에 안전하지 않게 될 수 있다.","떨어뜨린 음식은 언제나 먹어도 안전하다."],"r":{"a":"3) Food can become unsafe to eat the moment bacteria get on it. (음식은 박테리아가 묻는 순간 먹기에 안전하지 않게 될 수 있다.)","ev":"7~8번 문장","s":[[7,"He found that time is not an important factor when food is exposed to bacteria.","그는 음식이 박테리아에 노출될 때, 시간은 중요한 요인이  반대예요.","c":"F"},"h":"a6b17fc51d"},{"n":2,"t":"tf","q":"The left side of the face shows more emotion.","ko":"얼굴의 왼쪽 면은 더 많은 감정을 보여 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Thus, the left side of the face shows more emotion.","따라서 얼굴의 왼쪽 면은 더 많은 감정을 보여 준다."]],"w":"7번 Thus, the left side of the face shows more emotion. 우뇌가 몸의 왼쪽과 감정을 통제하기 때문이에요.","c":"T"},"h":"66633f8142"},{"n":3,"t":"tf","q":"Most painters are left-handed.","ko":"대부분의 화가들은 왼손잡이이다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Another reason is that most painters are right-handed.","또 다른 이유는 대부분의 화가들이 오른손잡이라는 것이다."]],"w":"9번에서 대부분의 화가들이 오른손잡이(right-handed)라고 해요. 왼손잡이라는 말은 반대예요.","c":"F"},"h":"dc073c0d33"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You will notice that most portraits show the left side of the person’s face.)","ko":"당신은 대부분의 초상화가 인물의 얼굴 왼쪽 면을 보여 주고 있다는 점을 ( ) 것이다. (notice의 뜻은?)","word":"notice","opts":["잊다","알아차리다","그리다","통제하다"],"r":{"a":"2) 알아차리다","ev":"2번 문장","s":[[2,"You will notice that most portraits show the left side of the person’s face.","당신은 대부분의 초상화가 인물의 얼굴 왼쪽 면을 보여 주고 있다는 점을 알아차리게 될 것이다."]],"w":"초상화를 자세히 보면 왼쪽 면을 보여 준다는 사실을 알게 된다는 문장이에요. notice = 알아차리다, 알아채다예요.","c":2},"h":"0cf0b88e78"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That makes it easier for them to draw the left side of a subject.)","ko":"그것은 그들이 피사체의 왼쪽 면을 그리는 것을 더 쉽게 만든다. (subject의 뜻은?)","word":"subject","opts":["과목","주제","대상","질문"],"r":{"a":"3) 대상","ev":"10번 문장","s":[[10,"That makes it easier for them to draw the left side of a subject.","그것은 그들이 피사체의 왼쪽 면을 그리는 것을 더 쉽게 만든다."]],"w":"화가가 그리는 것은 사람이에요. 여기서 subject는 그림의 대상(그려지는 사람)이라는 뜻이고, 학교 ‘과목’이나 글의 ‘주제’ 뜻이 아니에요.","c":3},"h":"6c3de16cab"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nFor this reason, people look better when their left side is shown.","ko":"밑줄 친 their이(가) 가리키는 것은?","sko":"이러한 이유로, 사람들은 그들의 왼쪽 면이 보여질 때 더 나아 보인다.","opts":["사람들","화가들","초상화들","뇌의 오른쪽 부분"],"r":{"a t.","마침내, 그들은 그 프로젝트의 비효율성을 깨닫고 그것에 자금을 대는 것을 중단하기로 결정했다."]],"w":"14번에서 마침내(Finally) 프로젝트의 비효율성을 깨닫고 자금을 대는 것을 중단하기로 결정했다고 해요.","c":"T"},"h":"8b5a8d364f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, when there is no hope of success, giving up can be a wise decision.)","ko":"그러나 성공의 희망이 없을 때는 포기하는 것이 ( ) 결정이 될 수 있다. (wise의 뜻은?)","word":"wise","opts":["어리석은","현명한","빠른","위험한"],"r":{"a":"2) 현명한","ev":"3번 문장","s":[[3,"However, when there is no hope of success, giving up can be a wise decision.","그러나 성공의 희망이 없을 때는 포기하는 것이 현명한 결정이 될 수 있다."]],"w":"However로 시작해 ‘계속 노력하라’는 말과 반대되는 주장이에요. 희망이 없을 때 포기하는 것은 좋은 결정이라는 뜻이라 wise = 현명한이에요.","c":2},"h":"4757fe8d09"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The project was clearly a mistake.)","ko":"그 프로젝트는 ( ) 실수였다. (clearly의 뜻은?)","word":"clearly","opts":["천천히","아마도","분명히","가끔"],"r":{"a":"3) 분명히","ev":"11번 문장","s":[[11,"The project was clearly a mistake.","그 프로젝트는 명백히 실수였다."]],"w":"콩코드 프로젝트가 비싸고 문제가 많았다는 10번에 이어, 11번은 그것이 의심할 여지 없이 실수였다는 뜻이에요. clearly = 분명히, 명백히예요.","c":3},"h":"ddc41a1f8c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAlthough the plane was fast and beautiful, it was expensive and had many problems.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"비록 그 비행기는 빠르고 아름다웠지만, 그것은 비싸고 많은 문제점이 있었다.","opts":["콩코드 비행기","그 프로젝트의 비용","1960년대","많은 사람들"],"r":{"a":"1) 콩코드 비행기","ev":"9~10번 문장","s":[[9,"The Concorde was an airplane built in the 1960s by France and Britain.","콩코드는 1960년대에 프랑스와 영국에 의해 만들어진 비행기이다."],[10,"Although the plane was fast and beautiful, it was expensive and had many problems.","비록 그 비행기는 빠르고 아름다웠지만, 비싸고 많은 문제점이 있었다."]],"w":"10번의 it은 앞에 나온 the plane(비행기)이에요. 빠르고 아름다웠지만 비싸고 문제가 많았던 것은 콩코드 비행기예요.","c":1,"k":"it = 콩코드 비행기"},"pron":"it","h":"20d148f844"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It would have been better if they had known when to quit.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들이 언제 그만둘지를 알았더라면 더 좋았을 것이다.", = 다른 동물과 구별되는 독특한(고유한) 특징이에요.","c":2},"h":"8af03c9214"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For these reasons, Shaw classified it as a special kind of mammal that lays eggs.)","ko":"이러한 이유로, Shaw는 그것을 알을 낳는 특별한 종류의 포유류로 ( ). (classified의 뜻은?)","word":"classified","opts":["발견했다","그렸다","팔았다","분류했다"],"r":{"a":"4) 분류했다","ev":"10번 문장","s":[[10,"For these reasons, Shaw classified it as a special kind of mammal that lays eggs.","이러한 이유로, Shaw는 그것을 알을 낳는 특별한 종류의 포유류로 분류했다."]],"w":"classify A as B는 ‘A를 B로 분류하다’예요. 앞의 특징들을 보고 오리너구리를 특별한 포유류의 한 종류로 나눈 거예요.","c":4},"h":"636e87b956"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey believe it can provide clues about how mammals evolved from reptiles.","ko":"밑줄 친 They이(가) 가리키는 것은?","sko":"그들은 그것이 어떻게 포유류가 파충류로부터 진화했는지에 대한 단서를 제공할 수 있다고 믿는다.","opts":["과학자들","오리너구리들","호주 사람들","파충류들"],"r":{"a":"1) 과학자들","ev":"11~12번 문장","s":[[11,"Scientists continue to study the platypus today.","오늘날에도 과학자들은 오리너구리를 계속 연구하고 있다."],[12,"They believe it can provide clues about how mammals evolved from reptiles.","그들은 그것이 어떻게 포유류가 파충류로부터 진화했는지에 대한 단서를 제공할 수 있다고 믿는다."]],"w":"11번에서 오늘날에도 과학자들(Scientists)이 오리너구리를 계속 연구한다고 하고, 12번에서 그들(They)이 오리너구리(it)가 단서를 제공할 수 있다고 믿어요.","c":1},"h":"7b9d408b02"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It had a bill like a duck’s, a tail like a beaver’s, and feet like an otter’s.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 오리의 것과 같은 부리, 비버의 것과 같은 꼬리, 그리고 수달의 것과 같은 발을 가졌다.","opts":["그것은 오리의 꼬리, 비버의 발, 수달의 부리를 가졌다.","그것은 오리의 부리, 비버의 꼬리, 수달의 발을 가졌다.","그것은 부리, 꼬리, 발이 모두 오리의 것이었다.","그것은 오리와 비버와 수달을 함께 데리고 있었다."],"r":{"a":"2) 그것은 오리의 부리, 비버의 꼬리, 수달의 발을 가졌다.","ev":"3번 문장","s":[[3,"It had a bill like a duck’s, a tail like a beaver’s, and feet like an otter’s.","그것은 오리의 것과 같은 부리, 비버의 것과 같은 꼬리, 그리고 수달의 것과 같은 발을 가졌다."]],"w":"a duck’s 뒤에는 bill, a beaver’s 뒤에는 tail, an otter’s 뒤에는 feet이 생략되어 있어요. 부리 = 오리, 꼬리 = 비버, 발 = 수달이에요.","c":2},"h":"f4fc646d67"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Shaw received the specimen from Africa.","The platypus gives birth to babies like most mammals.","Scientists have stopped studying the platypus.","The platypus has fur and feeds its babies with milk."],"oko":["Shaw는 아프리카에서 표본을 받았다.","오리너구리는 대부분의 포유류처럼 새끼를 낳는다.","과학자들은 오리너구리를 연구하는 것을 그만두었다.","오리너구리는 털이 있고 새끼에게 모유를 먹인다."],"r":{"a":"4) The platypus has fur and feeds its babies with milk. (오리너구리는 털이 있고 새끼에게 모유를 먹인다.)","ev":"7번 문장","s":[[7,"It has fur and feeds its babies with milk.","그것은 털이 있고 새끼에게 모유를 먹인다."]],"w":"7번에서 오리너구리는 털이 있고 새끼에게 젖을 먹인다고 해요. 표본은 호주에서 왔고(2번), 과학자들은 지금도 계속 연구하고 있어요(11번).","c":4},"h":"bab0413bc1"},{"n":9,"t":"sum","q":"But it has (A) feet and lays eggs like (B) or reptiles.","ko":"하지만 그것은 (A) 발을 가지고 있고 (B)나 파충류처럼 알을 낳는다.","opts":["(A) webbed / (B) birds","(A) webbed / (B) fish","(A) short / (B) birds","(A) short / (B) fish","(A) webbed / (B) cats"],"oko":["(A) 물갈퀴가 달린 / (B) 새","(A) 물갈퀴가 달린 / (B) 물고기","(A) 짧은 / (B) 새","(A) 짧은 / (B) 물고기","(A) 물갈퀴가 달린 / (B) 고양이"],"r":{"a":"1) (A) webbed / (B) birds ((A) 물갈퀴가 달린 / (B) 새)","ev":"8번 문장","s":[[8,"But it has webbed feet and lays eggs like birds or reptiles.","하지만 그것은 새나 파충류처럼 물갈퀴가 달린 발을 가지고 있고 알을 낳는다."]],"w":"8번에서 오리너구리는 새나 파충류처럼 물갈퀴가 달린(webbed) 발을 가지고 있고 알을 낳는다고 해요. birds는 bird(새)의 복수형이에요.","c":1},"h":"447e90dd1d"},{"n":10,"t":"fill","q":"But as he received more [A], he began to [B] it was a real animal—the platypus.","ko":"하지만 그는 더 많은 [A]을(를) 받으면서 그것이 오리너구리라는 진짜 동물이라는 것을 [B] 시작했다.","bank":["samples","realize","under","because","between","during"],"bko":{"samples":"견본","realize":"깨닫다","under":"~ 아래에","because":"왜냐하면","between":"~ 사이에","during":"~ 동안"},"r":{"a":"[A] samples (견본), [B] realize (깨닫다)","ev":"5번 문장","s":[[5,"But as he received more samples, he began to realize it was a real animal—the platypus.","하지만 그가 더 많은 견본을 받으면서 그는 그것이 오리너구리라는 진짜 동물이라는 것을 깨닫기 시작했다."]],"w":"5번에서 Shaw는 더 많은 견본(samples)을 받으면서 그것이 진짜 동물이라는 것을 깨닫기(realize) 시작했어요. samples는 sample(견본)의 복수형이에요.","c":null},"h":"5739633c81"}]},{"u":2,"id":"nl3-02-3","no":3,"ko":"익숙한 것이 언제나 옳은 것은 아니에요","items":[{"n":1,"t":"tf","q":"Most schools and organizations around the world use the first map.","ko":"전 세계 대부분의 학교와 기관은 첫 번째 지도를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Most schools and organizations around the world use the first one.","전 세계 대부분의 학교와 기관들이 첫 번째 지도를 사용한다."]],"w":"3번에서 전 세계 대부분의 학교와 기관이 첫 번째 지도를 쓴다고 해요.","c":"T"},"h":"51f0d2527f"},{"n":2,"t":"tf","q":"On the second map, Europe is in the center.","ko":"두 번째 지도에서는 유럽이 중앙에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"And Europe is no longer in the center.","그리고 유럽이 더 이상 중앙에 있지 않다."]],"w":"13번에서 두 번째 지도에서는 유럽이 더 이상(no longer) 중앙에 있지 않다고 해요. 유럽이 중앙에 있는 것은 첫 번째 지도예요(9번).","c":"F"},"h":"3be5f618b6"},{"n":3,"t":"tf","q":"The first map was created nearly 500 years ago.","ko":"첫 번째 지도는 거의 500년 전에 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"That’s because the map was created nearly 500 years ago, and Europe was very powerful at that time.","이는 그 지도가 거의 500년 전에 만들어졌고, 그 당시 유럽은 아주 강력했기 때문이다."]],"w":"10번에서 그 지도(첫 번째 지도)는 거의 500년 전에 만들어졌고, 그때 유럽은 아주 강력했다고 해요.","c":"T"},"h":"1da928103f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The first one probably looks familiar, but the second one might look strange.)","ko":"첫 번째 것은 아마도 ( ) 보이지만, 두 번째 것은 낯설게 보일 것이다. (familiar의 뜻은?)","word":"familiar","opts":["낯선","정확한","익숙한","위험한"],"r":{"a":"3) 익숙한","ev":"2번 문장","s":[[2,"The first one probably looks familiar, but the second one might look strange.","첫 번째 것은 아마도 익숙해 보이지만, 두 번째 것은 낯설게 보일 것이다."]],"w":"familiar와 but으로 대비되는 말이 strange(낯선)예요. 그러니 familiar = 익숙한이에요. 대부분의 학교가 쓰는 지도라 우리에게 익숙해요(3번).","c":3},"h":"1eace656ff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Actually, neither map is completely accurate.)","ko":"사실 둘 중 어느 지도도 완전히 ( ) 않다. (accurate의 뜻은?)","word":"accurate","opts":["오래된","정확한","유명한","어려운"],"r":{"a":"2) 정확한","ev":"6번 문장","s":[[6,"Actually, neither map is completely accurate.","사실 둘 중 어느 지도도 완전히 정확하지 않다."]],"w":"6번 뒤에서 첫 번째 지도는 모양은 맞고 크기는 틀리며, 두 번째 지도는 반대예요. 그래서 어느 지도도 완전히 ‘정확하지’ 않다는 뜻이라 accurate = 정확한이에요.","c":2},"h":"cf4a79f5ad"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhy did they make the change?","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"그들은 왜 (지도를) 바꿨을까?","opts":["지도들","보스턴 공립 학교들","대륙들","두 번째 지도"],"r":{"a":"2) 보스턴 공립 학교들","ev":"5번 문장","s":[[5,"Why did they make the change?","그들은 왜 (지도를) 바꿨을까?"]],"w":"Why did they make the change?에서 they는 지도를 바꾼 주체예요. 4번에서 보스턴의 공립 학교들이 이제 두 번째 지도를 쓴다고 했으니 they는 보스턴 공립 학교들이에요.","c":2,"k":"they = 보스턴 공립 학교들"},"pron":"they","h":"4a65b34983"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The second map, however, was made in the late 1800s.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 두 번째 지도는 1800년대 후반에 만들어졌다.","opts":["그러나 두 번째 지도는 1800년대 초반에 만들어졌다.","그러나 두 번째 지도는 19세기가 끝나 가던 무렵에 만들어졌다.","그러나 두 번째 지도는 1800년대 후반에 사라졌다.","그러나 두 번째 지도는 이제 막 만들어지고 있다."],"r":{"a":"2) 그러나 두 번째 지도는 19세기가 끝나 가던 무렵에 만들어졌다.","ev":"11번 문장","s":[[11,"The second map, however, was made in the late 1800s.","그러나 두 번째 지도는 1800년대 후반에 만들어졌다."]],"w":"The second map, however, was made in the late 1800s.는 '그러나 두 번째 지도는 1800년대 후반에 만들어졌다'예요. late는 '후반의', made는 make(만들다)의 과거분사로 수동태(was made)예요.","c":2},"h":"d1247252a9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Boston public schools still use the first map.","On the first map, Europe looks larger than it really is.","The first map was created about 50 years ago.","On the first map, the other continents are larger than Europe."],"oko":["보스턴 공립 학교들은 여전히 첫 번째 지도를 사용한다.","첫 번째 지도에서 유럽은 실제보다 더 크게 보인다.","첫 번째 지도는 약 50년 전에 만들어졌다.","첫 번째 지도에서 다른 대륙들이 유럽보다 더 크다."],"r":{"a":"2) On the first map, Europe looks larger than it really is. (첫 번째 지도에서 유럽은 실제보다 더 크게 보인다.)","ev":"8번 문장","s":[[8,"But their size is not—Europe is larger and the other continents are smaller.","그러나 대륙들의 크기는 그렇지 않은데, 유럽은 (실제보다) 더 크고 다른 대륙들은 더 작다."]],"w":"8번에서 첫 번째 지도는 유럽이 실제보다 더 크게(larger) 그려져 있다고 해요. 보스턴 학교들은 이제 두 번째 지도를 써요(4번).","c":2},"h":"e13f29d991"},{"n":9,"t":"sum","q":"On the first map, the (A) of the continents is correct, but their (B) is not.","ko":"첫 번째 지도에서 대륙의 (A)은(는) 정확하지만, 그것들의 (B)은(는) 그렇지 않다.","opts":["(A) size / (B) shape","(A) shape / (B) color","(A) color / (B) size","(A) size / (B) color","(A) shape / (B) size"],"oko":["(A) 크기 / (B) 모양","(A) 모양 / (B) 색","(A) 색 / (B) 크기","(A) 크기 / (B) 색","(A) 모양 / (B) 크기"],"r":{"a":"5) (A) shape / (B) size","ev":"7~8번 문장","s":[[7,"On the first map, the shape of the continents is correct.","첫 번째 지도에서, 대륙들의 모양은 정확하다."],[8,"But their size is not—Europe is larger and the other continents are smaller.","그러나 대륙들의 크기는 그렇지 않은데, 유럽은 (실제보다) 더 크고 다른 대륙들은 더 작다."]],"w":"7번에서 첫 번째 지도의 대륙 모양(shape)은 정확하고, 8번에서 크기(size)는 그렇지 않다고 해요.","c":5},"h":"5f4686d8c2"},{"n":10,"t":"fill","q":"Teachers at Boston public schools believe this map offers their [A] a new [B] of the world.","ko":"보스턴 공립 학교의 교사들은 이 지도가 자신들의 [A]에게 세계에 대한 새로운 [B]을(를) 제공한다고 믿는다.","bank":["students","view","quickly","under","because","between"],"bko":{"students":"학생들","view":"시각","quickly":"빠르게","under":"~ 아래에","because":"왜냐하면","between":"~ 사이에"},"r":{"a":"[A] students (학생들), [B] view (시각)","ev":"14번 문장","s":[[14,"Teachers at Boston public schools believe this map offers their students a new view of the world.","보스턴의 공립 학교 교사들은 이 지도가 학생들에게 세계에 대한 새로운 시각을 제공한다고 믿는다."]],"w":"14번에서 보스턴 공립 학교의 교사들은 이 지도가 자신들의 학생들(students)에게 세계에 대한 새로운 시각(view)을 준다고 믿어요. students는 student(학생)의 복수형이에요.","c":null},"h":"3f8bca7097"}]},{"u":2,"id":"nl3-02-4","no":4,"ko":"흑인 사무라이를 아세요?","items":[{"n":1,"t":"tf","q":"Yasuke was thirty centimeters taller than most Japanese men at that time.","ko":"Yasuke는 그 당시 대부분의 일본 남자들보다 30센티미터 더 컸다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The first was his height—he was thirty centimeters taller than most Japanese men at that time.","첫 번째는 그의 키였는데, 그는 그 당시 대부분의 일본 남자들보다 30센티미터나 더 컸다."]],"w":"6번에서 그의 키가 그 당시 대부분의 일본 남자들보다 30센티미터나 더 컸다고 해요.","c":"T"},"h":"b213a2374d"},{"n":2,"t":"tf","q":"Nobunaga knew at once that Yasuke’s dark skin was his natural color.","ko":"Nobunaga는 Yasuke의 어두운 피부가 타고난 색이라는 것을 바로 알았다.","r":{"a":"F (본문과 다른 내용)","ev":"9~11번 문장","s":[[9,"So Nobunaga thought that his skin was painted.","그래서 Nobunaga는 그의 피부에 색이 칠해져 있었다고 여겼다."],[10,"He asked him to scrub the paint off his skin.","그는 Yasuke에게 그의 피부에서 물감을 문질러 닦으라고 요청했다."],[11,"But it was really his natural color.","하지만 그것은 정말 그의 타고난 색이었다."]],"w":"9번에서 Nobunaga는 Yasuke의 피부에 색이 칠해졌다고 생각했고, 10번에서 물감을 닦으라고 했어요. 타고난 색이라는 건 11번에서야 밝혀져요.","c":"F"},"h":"2e64d6192a"},{"n":3,"t":"tf","q":"Nobunaga gave Yasuke the title of the first foreign samurai.","ko":"Nobunaga는 Yasuke에게 최초의 외국인 사무라이라는 칭호를 주었다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"He made him his personal bodyguard and gave him the title of the first foreign samurai.","그는 Yasuke를 자신의 개인 호위무사로 삼았고, 최초의 외국인 사무라이라는 칭호를 주었다."]],"w":"13번에서 Nobunaga가 Yasuke를 개인 호위무사로 삼고 최초의 외국인 사무라이라는 칭호를 주었다고 해요.","c":"T"},"h":"33f2123b7c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He stood out for two reasons.)","ko":"그는 두 가지 이유에서 ( ). (stood out의 뜻은?)","word":"stood out","opts":["앉아 있었다","달아났다","눈에 띄었다","화를 냈다"],"r":{"a":"3) 눈에 띄었다","ev":"5번 문장","s":[[5,"He stood out for two reasons.","그는 두 가지 이유에서 눈에 띄었다."]],"w":"5번 뒤에서 두 이유로 큰 키와 어두운 피부가 나와요. 다른 사람들과 달라서 눈에 띈다는 뜻이라 stand out = 눈에 띄다예요.","c":3},"h":"dc70b3ac3f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (After Nobunaga’s death, Yasuke disappeared.)","ko":"Nobunaga가 죽은 후, Yasuke는 ( ). (disappeared의 뜻은?)","word":"disappeared","opts":["사라졌다","돌아왔다","승리했다","결혼했다"],"r":{"a":"1) 사라졌다","ev":"16번 문장","s":[[16,"After Nobunaga’s death, Yasuke disappeared.","Nobunaga가 죽은 후, Yasuke는 사라졌다."]],"w":"16번 다음 17번에서 아무도 그에게 무슨 일이 일어났는지 모른다고 해요. 그러니 disappear(사라지다)의 과거형 disappeared = 사라졌다예요.","c":1},"h":"645fe8bb9c"},{"n":6,"t":"ref","q":"What does the underlined \"his\" refer to?\nYasuke overcame prejudice in a foreign country, and his story reminds us that people should not be judged based on their appearance or background.","ko":"밑줄 친 his이(가) 가리키는 것은?","sko":"Yasuke는 외국에서 편견을 극복했고, 그의 이야기는 우리에게 사람들은 외모나 배경으로 판단되어서는 안 된다는 것을 상기시킨다.","opts":["Nobunaga","일본 남자들","아프리카 사람들","Yasuke"],"r":{"a":"4) Yasuke","ev":"18번 문장","s":[[18,"Yasuke overcame prejudice in a foreign country, and his story reminds us that people should not be judged based on their appearance or background.","Yasuke는 외국에서 편견을 극복했고, 그의 이야기는 우리에게 사람들은 외모나 배경으로 판단되어서는 안 된다는 것을 상기시킨다."]],"w":"his story는 '그의 이야기'예요. 이 문장에서 편견을 극복한 사람은 주어인 Yasuke이므로 his는 Yasuke를 가리켜요.","c":4,"k":"his = Yasuke"},"pron":"his","h":"d48ffb0fe6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Nobody knows what happened to him.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아무도 그에게 무슨 일이 일어났는지 모른다.","opts":["아무도 그에게 무슨 일을 했는지 모른다.","아무도 그에게 무슨 일이 일어났는지 모른다.","모든 사람이 그에게 일어난 일을 안다.","아무도 그가 무엇을 알았는지 모른다."],"r":{"a":"2) 아무도 그에게 무슨 일이 일어났는지 모른다.","ev":"16~17번 문장","s":[[16,"After Nobunaga’s death, Yasuke disappeared.","Nobunaga가 죽은 후, Yasuke는 사라졌다."],[17,"Nobody knows what happened to him.","아무도 그에게 무슨 일이 일어났는지 모른다."]],"w":"what happened to him은 ‘그에게 무슨 일이 일어났는지’라는 뜻이에요. Nobody knows는 ‘아무도 모른다’이고, 앞 16번에서 Yasuke가 사라졌어요.","c":2},"h":"31a93f219d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Yasuke was shorter than most Japanese men.","Yasuke was a rival of Nobunaga.","Nobunaga’s goal was to unite Japan.","Yasuke became famous in Africa after Nobunaga’s death."],"oko":["Yasuke는 대부분의 일본 남자들보다 키가 작았다.","Yasuke는 Nobunaga의 경쟁자였다.","Nobunaga의 목표는 일본을 통일하는 것이었다.","Yasuke는 Nobunaga의 죽음 후 아프리카에서 유명해졌다."],"r":{"a":"3) Nobunaga’s goal was to unite Japan. (Nobunaga의 목표는 일본을 통일하는 것이었다.)","ev":"3번 문장","s":[[3,"His goal was to unite Japan.","그의 목표는 일본을 통일하는 것이었다."]],"w":  other robotic animals.","그때부터 그는 여러 다른 로봇 동물들을 만들어 왔다."]],"w":"8번에 Since then, he has made many other robotic animals가 그대로 나와요.","c":"T"},"h":"416adfbed6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day he got an interesting request.)","ko":"어느 날 그는 흥미로운 ( ? )을 받았다.","word":"request","opts":["경고","선물","실수","요청"],"r":{"a":"4) 요청","ev":"3번 문장","s":[[3,"One day he got an interesting request.","어느 날 그는 흥미로운 요청을 받았다."]],"w":"3번에서 흥미로운 request를 받았다고 하고, 4~6번에서 경찰이 부탁한 내용이 나와요. 그래서 ‘요청’이에요.","c":4},"h":"bab5946d91"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If they shoot at the robotic animals, police officers hiding nearby can arrest them.)","ko":"그들이 그 로봇 동물들에게 총을 쏘면, 근처에 숨어있는 경찰들이 그들을 ( ? ) 수 있다.","word":"arrest","opts":["구해 주다","체포하다","도와주다","가르치다"],"r":{"a":"2) 체포하다","ev":"11번 문장","s":[[11,"If they shoot at the robotic animals, police officers hiding nearby can arrest them.","그들이 그 로봇 동물들에게 총을 쏘면, 근처에 숨어 있는 경찰들이 그들을 체포할 수 있다."]],"w":"불법 사냥꾼이 총을 쏘면 경찰이 할 수 있는 일이고, 12번에서 그래서 사냥꾼들이 caught(잡혔다)고 해요. arrest는 ‘체포하다’예요.","c":2},"h":"0df7ef6a52"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThis makes illegal hunters think that they are real.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이것은 밀렵꾼들이 로봇 동물을 진짜라고 생각하게 만든다.","opts":["경찰관들","불법 사냥꾼들","로봇 동물들","사냥꾼에게 죽은 동물들"],"r":{"a":"3) 로봇 동물들","ev":"9~10번 문장","s":[[9,"Their ears, tails, and legs can be moved by remote control.","그 동물들의 귀와 꼬리, 다리는 원격으로 조종될 수 있다."],[10,"This makes illegal hunters think that they are real.","이것은 밀렵꾼들이 로봇 동물을 진짜라고 생각하게 만든다."]],"w":"진짜라고 생각되는 대상은 사냥꾼이 아니라 움직이는 로봇 동물들이에요. 9번 Their ears, tails, and legs가 가리키는 그 동물들이에요.","c":3},"h":"8276626f19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The police wanted to use a stuffed deer to catch people who were hunting illegally.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"경찰이 불법으로 사냥하는 사람들을 잡기 위해 박제된 사슴을 이용하고 싶어 했다.","opts":["경찰은 불법으로 사냥하는 사람들을 잡으려고 박제된 사슴을 이용하고 싶어 했다.","경찰은 박제된 사슴을 사냥하려는 사람들을 도와주고 싶어 했다.","경찰은 불법 사냥꾼들이 박제된 사슴을 만드는 것을 막고 싶어 했다.","경찰은 사슴을 사냥해서 박제로 만들고 싶어 했다."],"r":{"a":"1) 경찰은 불법으로 사냥하는 사람들을 잡으려고 박제된 사슴을 이용하고 싶어 했다.","ev":"4번 문장","s":[[4,"The police wanted to use a stuffed deer to catch people who were hunting illegally.","경찰이 불법으로 사냥하는 사람들을 잡기 위해 박제된 사슴을 이용하고 싶어 했다."]],"w":"The police wanted to use a stuffed deer to catch people who were hunting illegally.는 '경찰이 불법으로 사냥하는 사람들을 잡으려고 박제된 사슴을 이용하고 싶어 했다'예요. to catch는 목적(~하기 위해)을 나타내요.","c":1},"h":"86dac9caa0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["경찰관들은 로봇 동물 안에 숨어 있다.","200명이 넘는 불법 사냥꾼들이 로봇 동물 덕분에 잡혔다.","로봇 동물은 전혀 움직일 수 없다.","Wolslegel은 처음에 사냥꾼들을 위해 로봇 사슴을 만들었다."],"opts":["Police officers hide inside the robotic animals.","More than 200 illegal hunters have been caught thanks to the robotic animals.","The robotic animals cannot be moved at all.","Wolslegel first made a robotic deer for hunters."],"r":{"a":"2) More than 200 illegal hunters have been caught thanks to the robotic animals. (200명이 넘는 불법 사냥꾼들이 로봇 동물 덕분에 잡혔다.)","ev":"12번 문장","s":[[12,"So far, more than 200 illegal hunters have been caught thanks to Wolslegel’s robotic animals.","지금까지 Wolslegel의 로봇 동물 덕분에 200명이 넘는 밀렵꾼들이 검거되어 왔다."]],"w":"12번에서 지금까지 Wolslegel의 로봇 동물 덕분에 200명이 넘는 밀렵꾼들이 검거되어 왔다고 해요.","c":2},"h":"70e5c770f6"},{"n":9,"t":"sum","q":"Their (A), tails, and legs can be moved by remote (B).","ko":"그 동물들의 (A)와(과) 꼬리, 다리는 원격 (B)(으)로 움직여질 수 있다.","oko":["(A) 귀 / (B) 조종","(A) 귀 / (B) 목소리","(A) 눈 / (B) 조종","(A) 눈 / (B) 목소리","(A) 뿔 / (B) 조종"],"opts":["(A) ears / (B) control","(A) ears / (B) voice","(A) eyes / (B) control","(A) eyes / (B) voice","(A) horns / (B) control"],"r":{"a":"1) (A) ears / (B) control ((A) 귀 / (B) 조종)","ev":"9번 문장","s":[[9,"Their ears, tails, and legs can be moved by remote control.","그 동물들의 귀와 꼬리, 다리는 원격으로 조종될 수 있다."]],"w":"9번에서 그 동물들의 귀(ears)와 꼬리, 다리는 원격 조종(control)으로 움직여질 수 있다고 해요.","c":1},"h":"2a93e27e21"},{"n":10,"t":"fill","q":"He stuffs animals [A] by hunters so they can be [B].","ko":"그는 사냥꾼들에 의해 [A] 동물들을 박제로 만들어서 [B] 수 있도록 한다.","bank":["killed","displayed","quickly","under","because","during"],"bko":{"killed":"죽은","displayed":"전시될","quickly":"빠르게","under":"~ 아래에","because":"왜냐하면","during":"~ 동안"},"r":{"a":"[A] killed (죽은), [B] displayed (전시될)","ev":"2번 문장","s":[[2,"He stuffs animals killed by hunters so they can be displayed.","그는 사냥꾼들에 의해 죽은 동물들을 박제로 만들어서 전시될 수 있도록 한다."]],"w":"2번에서 그는 사냥꾼들에 의해 죽은(killed) 동물들을 박제로 만들어서 전시될(displayed) 수 있도록 한다고 해요. killed는 kill(죽이다)의 과거분사로 '죽임을 당한'이라는 뜻이에요.","c":null},"h":"ed7f3256a7"}]},{"u":4,"id":"nl3-04-2","no":2,"ko":"악마의 독약인 줄 알았더니 …","items":[{"n":1,"t":"tf","q":"The Persian king had his servants harvest grapes and store them in a basement.","ko":"페르시아 왕은 하인들에게 포도를 수확해서 지하실에 저장하도록 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"So he had his servants harvest grapes and store them in a basement.","그래서 그는 하인들에게 포도를 수확해서 그것들을 지하실에 저장하도록 했다."]],"w":"4번에 같은 내용이 나와요. had his servants harvest and store는 하인들에게 시켰다는 뜻이에요.","c":"T"},"h":"a608420a24"},{"n":2,"t":"tf","q":"People knew the process that turns fruit into alcohol.","ko":"사람들은 과일을 알코올로 바꾸는 과정을 알고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"People didn’t know about the process that turns fruit into alcohol.","사람들은 과일이 알코올로 변하는 과정에 대해 알지 못했다."]],"w":"6번에서 People didn’t know about the process라고 해요. 몰랐기 때문에 7번처럼 오해했어요.","c":"F"},"h":"da63ddf420"},{"n":3,"t":"tf","q":"The queen did not die after she ate the grapes.","ko":"여왕은 포도를 먹은 후에도 죽지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"However, after eating the grapes, she didn’t die.","그러나 그 포도를 먹은 후에, 그녀는 죽지 않았다."]],"w":"11번에서 after eating the grapes, she didn’t die라고 해요.","c":"T"},"h":"dc41ad0f86"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So he had his servants harvest grapes and store them in a basement.)","ko":"그래서 그는 하인들에게 포도를 ( ? ) 그것들을 지하실에 저장하도록 했다.","word":"harvest","opts":["팔다","수확하다","씻다","던지다"],"r":{"a":"2) 수확하다","ev":"4번 문장","s":[[4,"So he had his servants harvest grapes and store them in a basement.","그래서 그는 하인들에게 포도를 수확해서 그것들을 지하실에 저장하도록 했다."]],"w":"포도를 수확해서(harvest) 지하실에 저장한다(store)는 흐름이에요. 먼저 열매를 따서 모으는 일이므로 ‘수확하다’예요.","c":2},"h":"213311f1f6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (She couldn’t stand the pain and decided to take the “poison” in the basement to kill herself.)","ko":"그녀는 고통을 ( ? ) 수 없었고, 목숨을 끊기 위해 지하실에 있는 ‘독’을 먹기로 결심했다.","word":"stand","opts":["서다","무시하다","느끼다","참다"],"r":{"a":"4) 참다","ev":"10번 문장","s":[[10,"She couldn’t stand the pain and decided to take the “poison” in the basement to kill herself.","그녀는 고통을 참을 수 없었고, 목숨을 끊기 위해 지하실에 있는 ‘독’을 먹기로 결심했다."]],"w":"couldn’t stand the pain 뒤에 목숨을 끊으려 결심했다고 이어져요. 여기서 stand는 ‘서다’가 아니라 ‘참다, 견디다’예요.","c":4},"h":"d92e2e5a40"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nThe queen concluded that what she ate was a good thing and spread the news.","ko":"밑줄 친 she이(가) 가리키는 것은?","sko":"왕비는 그녀가 먹은 것이 좋은 것이라는 결론을 내렸고 그 소식을 (널리) 퍼트렸다.","opts":["페르시아 왕","여왕","하인들","사람들"],"r":{"a":"2) 여왕","ev":"13번 문장","s":[[13,"The queen concluded that what she ate was a good thing and spread the news.","왕비는 그녀가 먹은 것이 좋은 것이라는 결론을 내렸고 그 소식을 (널리) 퍼트렸다."]],"w":"she는 앞의 the queen(여왕)을 가리켜요. 자신이 먹은 것이 좋은 것이라는 결론을 내린 사람은 여왕이에요.","c":2,"k":"she = 여왕"},"pron":"she","h":"3c5c685f36"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So they believed evil spirits in the basement were trying to poison the king.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 그들은 지하실에 있는 악한 영혼들이 왕을 독살하려 한다고 믿었다.","opts":["그래서 그들은 지하실의 악한 영혼들이 왕을 독살하려 한다고 믿었다.","그래서 그들은 왕이 지하실의 영혼들을 독살하려 한다고 믿었다.","그래서 그들은 지하실에 독이 없다고 믿었다.","그래서 그들은 악한 영혼들이 왕을 도와주고 있다고 믿었다."],"r":{"a":"1) 그래서 그들은 지하실의 악한 영혼들이 왕을 독살하려 한다고 믿었다.","ev":"7번 문장","s":[[7,"So they believed evil spirits in the basement were trying to poison the king.","그래서 그들은 지하실에 있는 악한 영혼들이 왕을 독살하려 한다고 믿었다."]],"w":"So they believed evil spirits in the basement were trying to poison the king.은 '지하실의 악한 영혼들이 왕을 독살하려 한다고 믿었다'예요. poison은 여기서 '독살하다'라는 동사예요.","c":1},"h":"6e8775b33e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["하인들은 독을 마시려고 지하실 문을 열었다.","왕은 지하실의 포도를 먹고 죽었다.","여왕은 자신이 먹은 것이 나쁜 것이라고 생각했다.","하인들은 지하실을 폐쇄해 버렸다."],"opts":["The servants opened the basement door to drink the poison.","The king died after eating the grapes in the basement.","The queen thought that what she ate was a bad thing.","The servants closed off the basement."],"r":{"a":"4) The servants closed off the basement. (하인들은 지하실을 폐쇄해 버렸다.)","ev":"8번 문장","s":[[8,"Finally, the servants closed off the basement.","마침내 하인들은 지하실을 폐쇄해 버렸다."]],"w":"8번에서 마침내 하인들이 지하실을 폐쇄해 버렸다(closed off)고 해요.","c":4},"h":"0c3f2cbd9b"},{"n":9,"t":"sum","q":"The Persian queen had a chronic (A) around that (B).","ko":"페르시아 여왕은 그 (B) 즈음에 만성적인 (A)이(가) 있었다.","oko":["(A) 두통 / (B) 시기","(A) 두통 / (B) 장소","(A) 치통 / (B) 시기","(A) 치통 / (B) 장소","(A) 미소 / (B) 시기"],"opts":["(A) headache / (B) time","(A) headache / (B) place","(A) toothache / (B) time","(A) toothache / (B) place","(A) smile / (B) time"],"r":{"a":"1) (A) headache / (B) time ((A) 두통 / (B) 시기)","ev":"9번 문장","s":[[9,"Around that time, the Persian queen had a chronic headache.","그 즈음에 페르시아 여왕은 만성적인 두통이 있었다."]],"w":"9번에서 그 즈음에 페르시아 여왕은 만성적인 두통(headache)이 있었다고 해요. around that time은 '그 즈음에'라는 뜻이에요.","c":1},"h":"ef78709edc"},{"n":10,"t":"fill","q":"Instead, the queen [A] her energy and felt [B].","ko":"그 대신에 여왕은 힘을 [A], 기분이 [B].","bank":["regained","happy","died","basement","poison","grapes"],"bko":{"regained":"되찾았다","happy":"좋은","died":"죽었다","basement":"지하실","poison":"독","grapes":"포도"},"r":{"a":"[A] regained, [B] happy","ev":"12번 문장","s":[[12,"Instead, she regained her energy and felt happy.","그 대신에 그녀는 힘을 되찾았고, 기분이 좋아졌다."]],"w":"12번에서 Instead, she regained her energy and felt happy라고 해요. regain은 ‘되찾다’라서 힘을 되찾았다는 뜻이 되고, felt 뒤에는 기분을 나타내는 happy(기분 좋은)가 와요. died(죽었다)는 11번에서 죽지 않았다고 했으므로 틀려요.","c":null},"h":"7771fb22cb"}]},{"u":4,"id":"nl3-04-3","no":3,"ko":"마지노선의 숨겨진 진짜 의미는?","items":[{"n":1,"t":"tf","q":"The Maginot Line was named after a leader of the French army.","ko":"마지노선은 프랑스 군대의 지도자의 이름을 따왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It was named after a leader of the French army, André Maginot.","그것은 프랑스 군대의 지도자 André Maginot(앙드레 마지노)의 이름을 따왔다."]],"w":"3번에 It was named after a leader of the French army, André Maginot이라고 나와요.","c":"T"},"h":"9abd860833"},{"n":2,"t":"tf","q":"The Maginot Line was strengthened on the border with Belgium.","ko":"마지노선은 벨기에와의 국경에서 강화되었다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"It was strengthened on the border with Germany, but not on the one with Belgium.","그 방어선은 독일과의 국경에는 강화되었지만, 벨기에와의 국경에는 그렇지 않았다."]],"w":"9번에서 독일과의 국경에는 강화되었지만, 벨기에와의 국경에는 그렇지 않았다(but not on the one with Belgium)고 해요.","c":"F"},"h":"ba1568ca77"},{"n":3,"t":"tf","q":"The German army marched through the forest and then invaded France.","ko":"독일군은 숲을 가로질러 행군하였고, 그다음에 프랑스를 침략했다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"But during World War II, the German army invaded Belgium, marched through the forest, and then invaded France.","하지만 제2차 세계 대전 동안 독일군은 벨기에를 침략하여 숲을 가로질러 행군하였고, 그다음에 프랑스를 침략했다."]],"w":"11번에서 독일군이 벨기에를 침략하고 숲을 가로질러 행군하였고 그다음에 프랑스를 침략했다고 해요.","c":"T"},"h":"89f32762bf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It was strengthened on the border with Germany, but not on the one with Belgium.)","ko":"그 방어선은 독일과의 국경에는 ( ? ), 벨기에와의 국경에는 그렇지 않았다.","word":"strengthened","opts":["약해진","강화된","허물어진","감춰진"],"r":{"a":"2) 강화된","ev":"9번 문장","s":[[9,"It was strengthened on the border with Germany, but not on the one with Belgium.","그 방어선은 독일과의 국경에는 강화되었지만, 벨기에와의 국경에는 그렇지 않았다."]],"w":"독일과의 국경에는 방어를 더 튼튼하게 했다는 뜻이에요. but not on the one with Belgium은 벨기에 쪽은 그러지 않았다는 말이라서 ‘강화된’이에요.","c":2},"h":"6393957b43"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But during World War II, the German army invaded Belgium, marched through the forest, and then invaded France.)","ko":"하지만 제2차 세계 대전 동안 독일군은 벨기에를 ( ? ) 숲을 가로질러 행군하였고, 그다음에 프랑스를 ( ? ).","word":"invaded","opts":["방어했다","도망쳤다","침략했다","도와주었다"],"r":{"a":"3) 침략했다","ev":"11번 문장","s":[[11,"But during World War II, the German army invaded Belgium, marched through the forest, and then invaded France.","하지만 제2차 세계 대전 동안 독일군은 벨기에를 침략하여 숲을 가로질러 행군하였고, 그다음에 프랑스를 침략했다."]],"w":"독일군이 벨기에와 프랑스로 들어가 마지노선을 피했다고 해서, invade는 ‘쳐들어가다, 침략하다’예요.","c":3},"h":"a3a8060891"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey simply avoided the Maginot Line, so it wasn’t helpful at all.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 마지노선을 간단히 피해서, 마지노선은 전혀 도움이 되지 않았다.","opts":["독일군","프랑스 정부","벨기에 사람들","프랑스 군인들"],"r":{"a":"1) 독일군","ev":"11~12번 문장","s":[[11,"But during World War II, the German army invaded Belgium, marched through the forest, and then invaded France.","하지만 제2차 세계 대전 동안 독일군은 벨기에를 침략하여 숲을 가로질러 행군하였고, 그다음에 프랑스를 침략했다."],[12,"They simply avoided the Maginot Line, so it wasn’t helpful at all.","그들은 마지노선을 간단히 피해서, 마지노선은 전혀 도움이 되지 않았다."]],"w":"11번에서 독일군이 벨기에를 침략하고 숲을 지나 프랑스를 침략했고, 12번 They가 그 독일군이에요. 마지노선을 피한 쪽은 독일군이에요.","c":1},"h":"4cd878bbe0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Today, the phrase “Maginot Line” is used to describe something that provides a false sense of security.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘날 ‘마지노선’이라는 말은 거짓된 안도감을 주는 무언가를 묘사하는 데 사용된다.","opts":["오늘날 ‘마지노선’은 진짜 안전을 보장하는 것을 말할 때 쓴다.","오늘날 ‘마지노선’은 프랑스와 독일의 국경을 가리킬 때만 쓴다.","오늘날 ‘마지노선’은 위험을 미리 알려 주는 것을 말할 때 쓴다.","오늘날 ‘마지노선’이라는 말은 사실은 안전하지 않은데 안심하게 만드는 것을 말할 때 쓴다."],"r":{"a":"4) 오늘날 ‘마지노선’이라는 말은 사실은 안전하지 않은데 안심하게 만드는 것을 말할 때 쓴다.","ev":"13번 문장","s":[[13,"Today, the phrase “Maginot Line” is used to describe something that provides a false sense of security.","오늘날 ‘마지노선’이라는 어구는 거짓된 안도감을 주는 무언가를 묘사하는 데 사용된다."]],"w":"false sense of security는 ‘거짓된 안도감’이에요. 안전하지 않은데 안전하다고 느끼게 하는 것을 말할 때 마지노선이라고 불러요.","c":4},"h":"61563ca2a6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마지노선은 짓는 데 돈이 적게 들었다.","마지노선에는 군인들을 이동시키기 위한 지하 열차가 있었다.","마지노선은 독일을 공격하려고 지어졌다.","마지노선은 프랑스와 벨기에의 국경을 따라 지어졌다."],"opts":["The Maginot Line was cheap to build.","The Maginot Line had an underground train for moving soldiers.","The Maginot Line was built to attack Germany.","The Maginot Line was built along the French-Belgian border."],"r":{"a":"2) The Maginot Line had an underground train for moving soldiers.","ev":"1, 2, 4, 6번 문장","s":[[1,"The Maginot Line was built along the French-German border during the 1930s.","마지노선은 1930년대 동안 프랑스와 독일의 국경을 따라 지어졌다."],[2,"Its purpose was to protect France from German attacks.","그것의 목적은 독일의 공격으로부터 프랑스를 보호하는 것이었다."],[4,"The line was expensive to build.","그 방어선은 건설하기에 비쌌다."],[6,"It even had an underground train for moving soldiers around.","그것에는 심지어 군인들을 주변으로 이동시키기 위한 지하 열차도 있었다."]],"w":"6번에서 군인들을 옮기는 지하 열차가 있었다고 해요. 4번에서 짓는 데 비쌌고, 2번에서 독일의 공격에서 프랑스를 보호하려는 것이었고, 1번에서 프랑스-독일 국경을 따라 지어졌어요.","c":2},"h":"3883453f32"},{"n":9,"t":"sum","q":"The Maginot Line was made of (A) and 55 million tons of (B).","ko":"마지노선은 (A)와(과) 5,500만 톤의 (B)(으)로 만들어졌다.","oko":["(A) 콘크리트 / (B) 강철","(A) 콘크리트 / (B) 나무","(A) 종이 / (B) 강철","(A) 종이 / (B) 나무","(A) 유리 / (B) 강철"],"opts":["(A) concrete / (B) steel","(A) concrete / (B) wood","(A) paper / (B) steel","(A) paper / (B) wood","(A) glass / (B) steel"],"r":{"a":"1) (A) concrete / (B) steel ((A) 콘크리트 / (B) 강철)","ev":"7번 문장","s":[[7,"It seemed that Germany couldn’t destroy the line, as it was made of concrete and 55 million tons of steel.","콘크리트와 5,500만 톤의 강철로 만들어졌기 때문에 독일은 그 방어선을 파괴할 수 없을 것 같았다."]],"w":"7번에서 마지노선은 콘크리트(concrete)와 5,500만 톤의 강철(steel)로 만들어졌다고 해요.","c":1},"h":"97b93b9b3f"},{"n":10,"t":"fill","q":"The French government [A] that the thick forest between France and Belgium would act as a natural [B].","ko":"프랑스 정부는 프랑스와 벨기에 사이의 울창한 숲이 자연적인 [B] 역할을 할 것이라고 [A].","bank":["believed","barrier","quic l and plant species must constantly evolve to survive.)","ko":"그의 개념은 동식물 종은 살아남기 위해 ( ? ) 진화해야 한다는 것이다.","word":"constantly","opts":["가끔","끊임없이","갑자기","천천히"],"r":{"a":"2) 끊임없이","ev":"6번 문장","s":[[6,"His idea states that animal and plant species must constantly evolve to survive.","그의 개념은 동식물 종은 살아남기 위해 끊임없이 진화해야 한다는 것이다."]],"w":"종이 살아남으려면 계속 진화해야 한다는 뜻이에요. 7번에서 서로 경쟁하기 때문이라고 하니 ‘끊임없이’가 알맞아요.","c":2},"h":"177547dd1d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, when one species adapts to the environment, other ones also must adapt in response.)","ko":"따라서 한 종이 환경에 ( ? ) 다른 종도 대응하여 ( ? ) 한다.","word":"adapts","opts":["적응하다","경쟁하다","사라지다","사냥하다"],"r":{"a":"1) 적응하다","ev":"8번 문장","s":[[8,"So, when one species adapts to the environment, other ones also must adapt in response.","따라서 한 종이 환경에 적응하면 다른 종도 대응하여 적응해야 한다."]],"w":"환경에 맞게 맞춰 간다는 뜻이에요. 9번에서 이것을 하지 못하면 사라진다고 해서, adapt는 ‘적응하다’예요.","c":1},"h":"733ab8faeb"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThus, when humans discovered them, they were easy to hunt.","ko":"밑줄 친 they가 가리키는 것은?","sko":"따라서 인간이 도도새를 발견했을 때, 도도새들은 사냥하기에 쉬웠다.","opts":["인간들","포식자들","도도새들","영양들"],"r":{"a":"3) 도도새들","ev":"10~11번 문장","s":[[10,"For example, dodos had no predators, so they didn’t need to develop strong wings to fly.","예를 들어, 도도새는 포식자가 없어서 날 수 있는 튼튼한 날개를 발달시킬 필요가 없었다."],[11,"Thus, when humans discovered them, they were easy to hunt.","따라서 인간이 도도새를 발견했을 때, 도도새들은 사냥하기에 쉬웠다."]],"w":"10번에서 도도새는 포식자가 없어 날개를 발달시킬 필요가 없었다고 해요. 11번 them과 they는 도도새들이고, 사냥하기 쉬웠던 것도 도도새예요.","c":3},"h":"acf2d11c90"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If a species fails to do this, it will disappear.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 한 종이 적응하는 데 실패하면 그 종은 사라질 것이다.","opts":["어떤 종이 이것을 하면 그 종은 사라질 것이다.","어떤 종이 사라지면 이것을 하지 못할 것이다.","어떤 종이 이것을 하지 못하면 다른 종이 사라질 것이다.","어떤 종이 이것을 하지 못하면 그 종은 사라질 것이다."],"r":{"a":"4) 어떤 종이 이것을 하지 못하면 그 종은 사라질 것이다.","ev":"8~9번 문장","s":[[8,"So, when one species adapts to the environment, other ones also must adapt in response.","따라서 한 종이 환경에 적응하면 다른 종도 대응하여 적응해야 한다."],[9,"If a species fails to do this, it will disappear.","만약 한 종이 적응하는 데 실패하면 그 종은 사라질 것이다."]],"w":"fail to-v는 ‘~하지 못하다’이고 this는 8번의 adapt in response예요. 적응하지 못한 그 종(it)이 사라진다는 뜻이에요.","c":4},"h":"56c7022312"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["붉은 여왕 효과는 종이 진화할 필요가 없다고 말한다.","Alice는 세상보다 더 빠르게 앞으로 나아갔다.","미국의 생물학자 Leigh Van Valen이 붉은 여왕 효과를 제시했다.","붉은 여왕 효과는 한국의 과학자가 제시했다."],"opts":["The Red Queen effect says that species do not need to evolve.","Alice moved forward faster than the world did.","American biologist Leigh Van Valen suggested the Red Queen effect.","The Red Queen effect was suggested by a Korean scientist."],"r":{"a":"3) American biologist Leigh Van Valen suggested the Red Queen effect. (미국의 생물학자 Leigh Van Valen이 붉은 여왕 효과를 제시했다.)","ev":"5번 문장","s":[[5,"Thinking this, American biologist Leigh Van Valen suggested an idea called the Red Queen effect.","이렇게 생각하여 미국의 생물학자 Leigh Van Valen(리 반 베일런)은 붉은 여왕 효과라고 불리는 개념을 제시했다."]],"w":"5번에서 미국의 생물학자 Leigh Van Valen이 붉은 여왕 효과라는 개념을 제시했다고 해요.","c":3},"h":"e1c89a8f48"},{"n":9,"t":"sum","q":"Our world is (A) to Alice’s world of (B).","ko":"우리의 세상은 Alice의 (B)의 세상과 (A).","oko":["(A) 비슷하다 / (B) 이상한 나라","(A) 비슷하다 / (B) 네버랜드","(A) 다르다 / (B) 이상한 나라","(A) 다르다 / (B) 네버랜드","(A) 반대이다 / (B) 이상한 나라"],"opts":["(A) similar / (B) Wonderland","(A) similar / (B) Neverland","(A) different / (B) Wonderland","(A) different / (B) Neverland","(A) opposite / (B) Wonderland"],"r":{"a":"1) (A) similar / (B) Wonderland ((A) 비슷하다 / (B) 이상한 나라)","ev":"4번 문장","s":[[4,"Our world is similar to Alice’s world of Wonderland.","우리의 세상은 Alice의 ‘이상한 나라’의 세상과 비슷하다."]],"w":"4번에서 우리의 세상은 Alice의 이상한 나라(Wonderland)의 세상과 비슷하다(similar)고 해요.","c":1},"h":"75b38803a8"},{"n":10,"t":"fill","q":"So, they are [A] [B] today!","ko":"그래서 그들은 오늘날까지 [A] [B]!","bank":["still","alive","under","because","during","between"],"bko":{"still":"여전히","alive":"살아 있다","under":"~ 아래에","because":"왜냐하면","during":"~ 동안","between":"~ 사이에"},"r":{"a":"[A] still (여전히), [B] alive (살아 있다)","ev":"14번 문장","s":[[14,"So, they are still alive today!","그래서 그들은 오늘날까지 여전히 살아 있다!"]],"w":"14번에서 영양은 변화했기 때문에 오늘날까지 여전히(still) 살아 있다(alive)고 해요.","c":null},"h":"ff8c865281"}]},{"u":5,"id":"nl3-05-1","no":1,"ko":"생명의 간식, Plumpy’Nut","items":[{"n":1,"t":"tf","q":"Plumpy’Nut contains peanut butter and powdered milk.","ko":"Plumpy’Nut에는 땅콩버터와 분유가 들어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Plumpy’Nut is a mixture of peanut butter, powdered milk, sugar, and vegetable oil in a small packet.","Plumpy’Nut은 작은 팩에 든 땅콩버터, 분유, 설탕, 그리고 식물성 기름의 혼합물이다."]],"w":"4번 문장에서 Plumpy’Nut은 땅콩버터, 분유, 설탕, 식물성 기름의 혼합물이라고 해요. 땅콩버터와 분유가 들어 있는 것이 맞아요.","c":"T"},"h":"9a9f455222"},{"n":2,"t":"tf","q":"A child dies from hunger every few hours around the world.","ko":"전 세계적으로 몇 시간마다 한 명의 아이가 굶주림으로 죽는다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Around the world, a child dies from hunger every few seconds.","전 세계적으로 몇 초마다 한 명의 아이가 굶주림으로 죽는다."]],"w":"1번 문장에서는 몇 시간(hours)이 아니라 몇 초(seconds)마다 한 명이 굶주림으로 죽는다고 해요.","c":"F"},"h":"0efa45058e"},{"n":3,"t":"tf","q":"The writer says Plumpy’Nut might be the answer to the problem of hungry children.","ko":"글쓴이는 Plumpy’Nut이 배고픈 아이들 문제의 답일 수도 있다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"What can we do to help them?","그들을 돕기 위해 우리가 무엇을 할 수 있을까?"],[3,"Plumpy’Nut might be the answer.","Plumpy’Nut(플럼피넛)이 그 답일 수도 있다."]],"w":"2번에서 아이들을 어떻게 도울지 묻고, 3번에서 Plumpy’Nut이 그 답일 수도 있다(might be the answer)고 해요.","c":"T"},"h":"dfc1b3ad3a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Around the world, a child dies from hunger every few seconds.)","ko":"전 세계적으로 몇 초마다 한 명의 아이가 ( ? )으로 죽는다. (hunger의 뜻은?)","word":"hunger","opts":["피로","굶주림","추위","두려움"],"r":{"a":"2) 굶주림","ev":"1번 문장","s":[[1,"Around the world, a child dies from hunger every few seconds.","전 세계적으로 몇 초마다 한 명의 아이가 굶주림으로 죽는다."]],"w":"1번 문장은 아이가 hunger 때문에 죽는다고 하고, 3번 이후 배고픈 아이들을 돕는 제품이 나와요. hunger = 굶주림이에요.","c":2},"h":"671287adb2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In emergency cases, Plumpy’Nut can help hungry children add weight quickly and regain their health.)","ko":"긴급 상황에서 Plumpy’Nut은 배고픈 아이들의 체중을 빠르게 늘게 하고 건강을 ( ? ) 것을 도울 수 있다. (regain의 뜻은?)","word":"regain","opts":["잃어버리다","나누어 주다","되찾다, 회복하다","기다리다"],"r":{"a":"3) 되찾다, 회복하다","ev":"6번 문장","s":[[6,"In emergency cases, Plumpy’Nut can help hungry children add weight quickly and regain their health.","긴급 상황에서 Plumpy’Nut은 배고픈 아이들의 체중을 빠르게 늘게 하고 건강을 회복하도록 도울 수 있다."]],"w":"6번 문장에서 아이들이 체중을 늘리고 건강을 regain한다고 해요. 건강을 잃는 것이 아니라 다시 찾는 것이니 '되찾다, 회복하다'예요.","c":3},"h":"12a4ebe89e"},{"n":6,"t":"ref","q":"What does the underlined \"who\" refer to?\nPlumpy’Nut was a big help to children who were sick and hungry.","ko":"밑줄 친 who가 가리키는 것은?","sko":"Plumpy’Nut은 아프고 배고픈 아이들에게 큰 도움이 되었다.","opts":["Plumpy’Nut","아이들","유니세프","니제르"],"r":{"a":"2) 아이들","ev":"8번 문장","s":[[8,"Plumpy’Nut was a big help to children who were sick and hungry.","Plumpy’Nut은 아프고 배고픈 아이들에게 큰 도움이 되었다."]],"w":"who 이하(were sick and hungry)는 바로 앞의 children을 꾸며 줘요. 아프고 배고팠던 것은 아이들이에요.","c":2},"h":"a07c55e58a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This small product may not sound like much; however, it can make the difference between life and death for thousands of children.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 작은 제품은 대단한 것처럼 들리지 않을지도 모른다. 그러나 그것은 수천 명의 아이들의 생사에 차이를 만들어 낼 수 있다.","opts":["이 제품은 너무 작아서 수천 명의 아이들에게 쓸 수 없다.","이 제품은 작지만 수천 명의 아이들에게 아무 차이도 만들지 못한다.","이 제품은 대단해 보여서 수천 명의 아이들이 좋아한다.","이 제품은 작아 보이지만 수천 명의 아이들이 사느냐 죽느냐를 가를 수 있다."],"r":{"a":"4) 이 제품은 작아 보이지만 수천 명의 아이들이 사느냐 죽느냐를 가를 수 있다.","ev":"5번 문장","s":[[5,"This small product may not sound like much; however, it can make the difference between life and death for thousands of children.","이 작은 제품은 대단한 것처럼 들리지 않을지도 모른다. 그러나 그것은 수천 명의 아이들의 생사에 차이를 만들어 낼 수 있다."]],"w":"however를 기준으로 앞은 '대단해 보이지 않는다', 뒤는 '수천 명의 생사를 가를 수 있다'예요. 작아 보여도 효과가 크다는 뜻이에요.","c":4},"h":"c67daa0782"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Plumpy’Nut is sold in a large bottle.","Plumpy’Nut helps hungry children lose weight quickly.","There was a food crisis in Niger from 2005 to 2006.","UNICEF has stopped giving out Plumpy’Nut."],"oko":["Plumpy’Nut은 큰 병에 담겨 팔린다.","Plumpy’Nut은 배고픈 아이들의 체중이 빨리 줄도록 돕는다.","2005년부터 2006년까지 니제르에서 식량 위기가 있었다.","유니세프는 Plumpy’Nut을 나누어 주는 것을 중단했다."],"r":{"a":"3) There was a food crisis in Niger from 2005 to 2006. (2005년부터 2006년까지 니제르에서 식량 위기가 있었다.)","ev":"7번 문장","s":[[7,"From 2005 to 2006, there was a food crisis in the African nation of Niger.","2005년부터 2006년까지 아프리카 국가인 Niger(니제르)에서 식량 위기가 있었다."]],"w":"7번에서 2005년부터 2006년까지 아프리카 니제르에서 식량 위기가 있었다고 해요.","c":3},"h":"2451863605"},{"n":9,"t":"sum","q":"Plumpy’Nut also has (A) and vegetable oil, and it comes in a small (B).","ko":"Plumpy’Nut에는 (A)와(과) 식물성 기름도 들어 있고, 작은 (B)에 담겨 있다.","opts":["(A) sugar / (B) packet","(A) sugar / (B) bottle","(A) salt / (B) packet","(A) salt / (B) bottle","(A) rice / (B) packet"],"oko":["(A) 설탕 / (B) 팩","(A) 설탕 / (B) 병","(A) 소금 / (B) 팩","(A) 소금 / (B) 병","(A) 쌀 / (B) 팩"],"r":{"a":"1) (A) sugar / (B) packet ((A) 설탕 / (B) 팩)","ev":"4번 문장","s":[[4,"Plumpy’Nut is a mixture of peanut butter, powdered milk, sugar, and vegetable oil in a small packet.","Plumpy’Nut은 작은 팩에 든 땅콩버터, 분유, 설탕, 그리고 식물성 기름의 혼합물이다."]],"w":"4번에서 Plumpy’Nut은 땅콩버터, 분유, 설탕(sugar), 식물성 기름이 작은 팩(packet)에 든 혼합물이라고 해요.","c":1},"h":"2c7a15b974"},{"n":10,"t":"fill","q":"Today, many organizations, including UNICEF, are [A] and giving out the product to [B] lives.","ko":"오늘날 유니세프를 포함한 많은 단체들이 생명을 [B] 위해 이 제품을 [A] 나누어 주고 있다.","bank":["buying","save","quickly","under","because","during"],"bko":{"buying":"구매하고","save":"구하다","quickly":"빠르게","under":"~ 아래에","because":"왜냐하면","during":"~ 동안"},"r":{"a":"[A] buying (구매하고), [B] save (구하다)","ev":"9번 문장","s":[[9,"Today, many organizations, including UNICEF, are buying and giving out the product to save lives.","오늘날 유니세프를 포함한 많은 단체들이 생명을 구하기 위해 이 제품을 구매하여 나누어 주고 있다."]],"w":"9번에서 많은 단체들이 생명을 구하기(save) 위해 이 제품을 구매하고(buying) 나누어 주고 있다고 해요.","c":null},"h":"8c64d93254"}]},{"u":5,"id":"nl3-05-2","no":2,"ko":"이런 안경 봤어?","items":[{"n":1,"t":"tf","q":"Adspecs is a pair of glasses filled with liquid.","ko":"Adspecs는 액체로 채워진 안경이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It’s all thanks to an invention called Adspecs, which is a pair of glasses filled with liquid.","그것은 모두 Adspecs(애드스펙스)라고 불리는 발명품 덕분인데, 그것은 액체로 채워진 안경이다."]],"w":"3번 문장에서 Adspecs는 액체로 채워진 안경(a pair of glasses filled with liquid)이라고 해요.","c":"T"},"h":"032ea5975c"},{"n":2,"t":"tf","q":"Adspecs are very difficult to use.","ko":"Adspecs는 사용하기 매우 어렵다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"These glasses are easy to use.","이 안경은 사용하기 쉽다."]],"w":"4번 문장에서 이 안경은 사용하기 쉽다(easy to use)고 해요. 어렵다는 말은 반대 내용이에요.","c":"F"},"h":"a47b663327"},{"n":3,"t":"tf","q":"There are not many eye doctors in the poor countries that the writer talks about.","ko":"글쓴이가 말하는 가난한 나라에는 안과 의사가 많지 않다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"This is great news for people in poor countries where there aren’t many eye doctors.","이것은 안과 의사가 많지 않은 가난한 나라의 사람들에게 엄청난 소식이다."]],"w":"2번 문장에서 가난한 나라에는 안과 의사가 많지 않다(there aren’t many eye doctors)고 해요.","c":"T"},"h":"b6d6bb6637"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is possible to get a perfect pair of glasses without any doctors or expensive equipment.)","ko":"의사나 고가의 ( ? ) 없이도 완전한 안경을 갖는 것이 가능하다. (equipment의 뜻은?)","word":"equipment","opts":["의사","장비, 용품","약","안경점"],"r":{"a":"2) 장비, 용품","ev":"1번 문장","s":[[1,"It is possible to get a perfect pair of glasses without any doctors or expensive equipment.","의사나 고가의 장비 없이도 완전한 안경을 갖는 것이 가능하다."]],"w":"1번 문장에서 equipment는 doctors와 함께 '없이도 가능하다'고 한 것이에요. expensive(값비싼)가 앞에 있으니 비싼 장비, 용품이라는 뜻이에요.","c":2},"h":"fd7c8f4d24"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (An organization called Global Vision 2020 is distributing Adspecs to poor countries.)","ko":"Global Vision 2020이라는 단체가 Adspecs를 가난한 나라에 ( ? )하고 있다. (distributing의 뜻은?)","word":"distributing","opts":["만드는","수리하는","빌려 가는","나누어 주는"],"r":{"a":"4) 나누어 주는","ev":"9번 문장","s":[[9,"An organization called Global Vision 2020 is distributing Adspecs to poor countries.","Global Vision(글로벌 비전) 2020이라는 단체가 Adspecs를 가난한 나라에 배포하고 있다."]],"w":"9번 문장에서 단체가 Adspecs를 가난한 나라에 보내 준다는 뜻이에요. distribute = 나누어 주다, 배포하다예요.","c":4},"h":"b58c08d11a"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nYou simply put them on and look at an eye chart on the wall.","ko":"밑줄 친 them이 가리키는 것은?","sko":"단순히 그 안경을 착용하고 벽에 있는 시력 검사표를 보기만 하면 된다.","opts":["안경","시력 검사표","기름","가난한 나라"],"r":{"a":"1) 안경","ev":"4~5번 문장","s":[[4,"These glasses are easy to use.","이 안경은 사용하기 쉽다."],[5,"You simply put them on and look at an eye chart on the wall.","단순히 그 안경을 착용하고 벽에 있는 시력 검사표를 보기만 하면 된다."]],"w":"4번에서 these glasses(이 안경)를 이야기했고, 5번에서 그것을 착용한다(put them on)고 해요. 시력 검사표는 그다음에 보는 것이에요.","c":1},"h":"91ed73fa12"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now the glasses are ready to wear!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이제 안경은 착용할 준비가 되었다!","opts":["이제 그 안경은 착용할 준비가 다 되었다.","이제 그 안경은 버려야 할 때가 되었다.","이제 그 안경은 막 만들어지기 시작했다.","이제 그 안경은 의사에게 보낼 준비가 되었다."],"r":{"a":"1) 이제 그 안경은 착용할 준비가 다 되었다.","ev":"8번 문장","s":[[8,"Now the glasses are ready to wear!","이제 안경은 착용할 준비가 되었다!"]],"w":"Now the glasses are ready to wear!는 '이제 안경은 착용할 준비가 되었다!'예요. be ready to-v는 '~할 준비가 되다'예요.","c":1},"h":"2e93eee817"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Adspecs can be used only by doctors.","Clear oil is pumped into the lenses of Adspecs.","You pump air into the lenses of the glasses.","Global Vision 2020 sells Adspecs to rich countries."],"oko":["Adspecs는 의사만 사용할 수 있다.","Adspecs의 렌즈 안에 투명한 기름을 주입한다.","안경 렌즈 안에 공기를 주입한다.","Global Vision 2020은 Adspecs를 부유한 나라에 판매한다."],"r":{"a":"2) Clear oil is pumped into the lenses of Adspecs. (Adspecs의 렌즈 안에 투명한 기름을 주입한다.)","ev":"6번 문장","s":[[6,"Then you begin pumping clear oil into the lenses of the glasses.","그러고 나서 안경의 렌즈 안으로 투명한 기름을 주입하기 시작한다."]],"w":"6번에서 안경의 렌즈 안으로 투명한 기름(clear oil)을 주입한다고 해요.","c":2},"h":"f6dd3d724e"},{"n":9,"t":"sum","q":"When you can (A) the eye chart clearly, you (B) pumping.","ko":"시력 검사표를 뚜렷하게 (A) 수 있을 때, 주입을 (B).","opts":["(A) see / (B) stop","(A) see / (B) start","(A) hide / (B) stop","(A) hide / (B) start","(A) draw / (B) stop"],"oko":["(A) 볼 / (B) 멈춘다","(A) 볼 / (B) 시작한다","(A) 숨길 / (B) 멈춘다","(A) 숨길 / (B) 시작한다","(A) 그릴 / (B) 멈춘다"],"r":{"a":"1) (A) see / (B) stop ((A) 볼 / (B) 멈춘다)","ev":"7번 문장","s":[[7,"When you can see the eye chart clearly, you stop pumping.","시력 검사표가 뚜렷하게 보일 때 주입을 멈춘다."]],"w":"7번에서 시력 검사표가 뚜렷하게 보일 때(see) 주입을 멈춘다(stop)고 해요.","c":1},"h":"0c36ad5a34"},{"n":10,"t":"fill","q":"They [A] to help poor children throughout the world live better [B] with perfect vision.","ko":"그들은 전 세계의 가난한 아이들이 완벽한 시력으로 더 나은 [B]을(를) 살도록 돕기를 [A].","bank":["hope","lives","under","because","during","between"],"bko":{"hope":"바라다","lives":"삶","under":"~ 아래에","because":"왜냐하면","during":"~ 동안","between":"~ 사이에"},"r":{"a":"[A] hope (바라다), [B] lives (삶)","ev":"10번 문장","s":[[10,"They hope to help poor children throughout the world live better lives with perfect vision.","그들은 전 세계의 가난한 아이들이 완벽한 시력으로 더 나은 삶을 살도록 돕기를 바란다."]],"w":"10번에서 그들은 가난한 아이들이 더 나은 삶(lives)을 살도록 돕기를 바란다(hope)고 해요. lives는 life(삶)의 복수형이에요.","c":null},"h":"dd516d9d49"}]},{"u":5,"id":"nl3-05-3","no":3,"ko":"삐! 이 뉴스는 ‘가짜’입니다","items":[{"n":1,"t":"tf","q":"Many people read the news online and share it through social media sites.","ko":"많은 사람들이 온라인으로 뉴스를 읽고 소셜 미디어 사이트를 통해 공유한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"These days many people read the news online and share it through social media sites.","요즘 많은 사람들이 온라인으로 뉴스를 읽고 그것을 소셜 미디어 사이트를 통해 공유한다."]],"w":"1번 문장에서 요즘 많은 사람들이 온라인으로 뉴스를 읽고 소셜 미디어 사이트로 공유한다고 해요.","c":"T"},"h":"f39acffb26"},{"n":2,"t":"tf","q":"Fake news looks very different from real news.","ko":"가짜 뉴스는 진짜 뉴스와 매우 다르게 보인다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Fake news looks just like real news, but it isn’t true.","가짜 뉴스는 꼭 진짜 뉴스처럼 보이지만, 그것은 사실이 아니다."]],"w":"3번 문장에서 가짜 뉴스는 꼭 진짜 뉴스처럼 보인다(looks just like real news)고 해요. 그래서 헷갈리는 거예요.","c":"F"},"h":"0c1d734487"},{"n":3,"t":"tf","q":"Fake news about Clinton spread widely on the internet.","ko":"Clinton에 관한 가짜 뉴스가 인터넷에 널리 퍼졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"At that time, fake news about Clinton spread widely on the internet.","그 당시, Clinton에 관한 가짜 뉴스가 인터넷에 널리 퍼졌다."]],"w":"6번 문장에서 그 당시 Clinton에 관한 가짜 뉴스가 인터넷에 널리 퍼졌다고 해요.","c":"T"},"h":"92ff6e998e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For example, this became a major problem when Donald Trump and Hillary Clinton competed for the presidency.)","ko":"예를 들어, 이것은 Donald Trump와 Hillary Clinton이 대통령직을 두고 경쟁했을 때 ( ? ) 문제가 되었다. (major의 뜻은?)","word":"major","opts":["작은","주요한, 중대한","재미있는","오래된"],"r":{"a":"2) 주요한, 중대한","ev":"5번 문장","s":[[5,"For example, this became a major problem when Donald Trump and Hillary Clinton competed for the presidency.","예를 들어, 이것은 Donald Trump(도널드 트럼프)와 Hillary Clinton(힐러리 클린턴)이 대통령직을 두고 경쟁했을 때 중대한 문제가 되었다."]],"w":"5번 문장은 가짜 뉴스가 대통령 선거 때 문제가 되었다는 예예요. 선거에 영향을 줄 수 있는 큰 문제니까 major = 주요한, 중대한이에요.","c":2},"h":"3eed29ea52"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (At that time, fake news about Clinton spread widely on the internet.)","ko":"그 당시, Clinton에 관한 가짜 뉴스가 인터넷에 널리 ( ? ). (spread의 뜻은?)","word":"spread","opts":["숨었다","줄어들었다","퍼졌다","사라졌다"],"r":{"a":"3) 퍼졌다","ev":"6번 문장","s":[[6,"At that time, fake news about Clinton spread widely on the internet.","그 당시, Clinton에 관한 가짜 뉴스가 인터넷에 널리 퍼졌다."]],"w":"6번 문장은 가짜 뉴스가 인터넷에 widely(널리) spread했다고 해요. 8번에서 그 확산을 막지 않았다고 비난받는 것을 보면 '퍼졌다'가 맞아요.","c":3},"h":"3226442149"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nFor example, one of them now checks the facts in news stories and labels the ones that are not true.","ko":"밑줄 친 them이 가리키는 것은?","sko":"예를 들어, 그 회사들 중 하나는 이제 뉴스 기사에 있는 사실을 확인하고 사실이 아닌 뉴스 기사에 표시를 해서 분류한다.","opts":["독자들","가짜 뉴스들","선거들","인터넷 회사들"],"r":{"a":"4) 인터넷 회사들","ev":"9~10번 문장","s":[[9,"Since that time, these companies have taken steps to fight fake news.","그때 이후로, 이 회사들은 가짜 뉴스와 싸우기 위한 조치들을 취해 왔다."],[10,"For example, one of them now checks the facts in news stories and labels the ones that are not true.","예를 들어, 그 회사들 중 하나는 이제 뉴스 기사에 있는 사실을 확인하고 사실이 아닌 뉴스 기사에 표시를 해서 분류한다."]],"w":"9번에서 these companies(이 회사들)가 조치를 취해 왔다고 하고, 10번의 For example 뒤에서 그 중 하나(one of them)가 하는 일을 말해요.","c":4},"h":"11f5934ae0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Considering that Clinton lost, it is possible that the news had an effect on the election.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Clinton이 졌다는 것을 고려하면, 그 뉴스가 선거에 영향을 미쳤을 가능성이 있다.","opts":["Clinton이 이겼으니 그 뉴스는 선거와 관계가 없었다.","Clinton이 졌다는 점을 생각하면, 그 뉴스가 선거에 영향을 주었을 수도 있다.","그 뉴스 때문에 Clinton이 졌다는 것이 확실히 증명되었다.","선거에서 졌기 때문에 Clinton이 그 뉴스를 만들었다."],"r":{"a":"2) Clinton이 졌다는 점을 생각하면, 그 뉴스가 선거에 영향을 주었을 수도 있다.","ev":"7번 문장","s":[[7,"Considering that Clinton lost, it is possible that the news had an effect on the election.","Clinton이 졌다는 것을 고려하면, 그 뉴스가 선거에 영향을 미쳤을 가능성이 있다."]],"w":"it is possible that ~은 ‘~일 가능성이 있다’는 뜻이라서 확실히 증명되었다는 말이 아니에요. Clinton이 졌다는 점을 고려해 영향을 주었을 수도 있다는 뜻이에요.","c":2},"h":"a7d08aa8fe"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Internet companies have never tried to stop fake news.","Nobody blamed internet companies for the spread of fake news.","Many people blamed internet companies for not stopping fake news.","Fake news is easy to tell from real news."],"oko":["인터넷 회사들은 가짜 뉴스를 막으려고 한 적이 없다.","아무도 가짜 뉴스의 확산에 대해 인터넷 회사들을 비난하지 않았다.","많은 사람들이 가짜 뉴스를 막지 않은 것에 대해 인터넷 회사들을 비난했다.","가짜 뉴스는 진짜 뉴스와 구별하기 쉽다."],"r":{"a":"3) Many people blamed internet companies for not stopping fake news. (많은 사람들이 가짜 뉴스를 막지 않은 것에 대해 인터넷 회사들을 비난했다.)","ev":"8번 문장","s":[[8,"Afterward, many people blamed internet companies for not stopping the spread of fake news.","나중에 많은 사람들이 가짜 뉴스의 확산을 막지 않은 것에 대해 인터넷 회사들을 비난했다."]],"w":"8번에서 나중에 많은 사람들이 가짜 뉴스의 확산을 막지 않은 것에 대해 인터넷 회사들을 비난했다(blamed)고 해요.","c":3},"h":"89203a6167"},{"n":9,"t":"sum","q":"Some people write fake news to make readers (A), so we must be (B) about what we read.","ko":"어떤 사람들은 독자를 (A)하게 만들려고 가짜 뉴스를 쓰므로, 우리는 읽는 것에 대해 (B)해야 한다.","opts":["(A) happy / (B) careless","(A) confused / (B) careless","(A) happy / (B) careful","(A) interested / (B) careless","(A) confused / (B) careful"],"oko":["(A) 행복한 / (B) 부주의한","(A) 혼란스러운 / (B) 부주의한","(A) 행복한 / (B) 조심하는","(A) 흥미로운 / (B) 부주의한","(A) 혼란스러운 / (B) 조심하는"],"r":{"a":"5) (A) confused / (B) careful","ev":"4번, 11번 문장","s":[[4,"Some people write it in order to make readers confused about what is really happening.","어떤 사람들은 독자들이 실제로 일어나고 있는 일과 헷갈리게 하려고 가짜 뉴스를 작성한다."],[11,"Despite these positive actions, we must be careful not to believe everything that we read.","이러한 긍정적인 조치들에도 불구하고, 우리는 우리가 읽는 것을 모두 믿지 않도록 주의해야 한다."]],"w":"4번에서 가짜 뉴스를 쓰는 목적이 독자를 헷갈리게(confused) 만들기 위해서라고 하고, 11번에서 읽는 것을 모두 믿지 않도록 조심해야(careful) 한다고 해요.","c":5},"h":"10a0428747"},{"n":10,"t":"fill","q":"Since that time, these companies have [A] [B] to fight fake news.","ko":"그때 이후로, 이 회사들은 가짜 뉴스와 싸우기 위한 [B]을(를) [A].","bank":["taken","steps","quickly","under","because","during"],"bko":{"taken":"취해 왔다","steps":"조치들","quickly":"빠르게","under":"~ 아래에","because":"왜냐하면","during":"~ 동안"},"r":{"a":"[A] taken (취해 왔다), [B] steps (조치들)","ev":"9번 문장","s":[[9,"Since that time, these companies have taken steps to fight fake news.","그때 이후로, 이 회사들은 가짜 뉴스와 싸우기 위한 조치들을 취해 왔다."]],"w":"9번에서 그때 이후로 이 회사들은 가짜 뉴스와 싸우기 위한 조치들(steps)을 취해 왔다(have taken)고 해요. taken은 take(취하다)의 과거분사로, have taken은 현재완료예요.","c":null},"h":"69e29d8c9c"}]},{"u":5,"id":"nl3-05-4","no":4,"ko":"브로치에 그렇게 깊은 뜻이?","items":[{"n":1,"t":"tf","q":"Madeleine Albright was the first female US secretary of state.","ko":"Madeleine Albright는 최초의 여성 미국 국무장관이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"She was the first female US secretary of state and the US ambassador to the United Nations.","그녀는 최초의 여성 미국 국무장관이자 유엔 미국 대사였다."]],"w":"2번 문장에서 그녀는 최초의 여성 미국 국무장관(the first female US secretary of state)이었다고 해요.","c":"T"},"h":"953639d0db"},{"n":2,"t":"tf","q":"Albright usually wore a brooch on the right side of her blouse or jacket.","ko":"Albright는 보통 블라우스나 재킷의 오른쪽에 브로치를 착용했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Albright usually wore a brooch on the left side of her blouse or jacket.","Albright는 보통 블라우스나 재킷의 왼쪽에 브로치를 착용했다."]],"w":"4번 문장에서 보통 왼쪽(left side)에 브로치를 착용했다고 해요. 오른쪽이라는 말은 틀려요.","c":"F"},"h":"ab33b6e672"},{"n":3,"t":"tf","q":"Albright wore a balloon-shaped brooch when she felt things were going well.","ko":"Albright는 일이 잘 되어간다고 느꼈을 때 풍선 모양 브로치를 착용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"She also owned a brooch shaped like a balloon.","그녀는 또한 풍선처럼 생긴 브로치도 소장했다."],[10,"She would wear it when she felt that things were going well.","그녀는 일이 잘 되어간다고 느꼈을 때 그것을 착용하곤 했다."]],"w":"9번에서 풍선 모양 브로치를 가지고 있었다고 하고, 10번에서 일이 잘 되어 간다고 느낄 때 그것을 착용하곤 했다고 해요.","c":"T"},"h":"0a919e0057"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She wanted to show that she was going to be tough and aggressive.)","ko":"그녀는 자신이 냉정하고 ( ? ) 것임을 보여 주고자 했다. (aggressive의 뜻은?)","word":"aggressive","opts":["공격적인","친절한","조용한","느긋한"],"r":{"a":"1) 공격적인","ev":"7번 문장","s":[[7,"She wanted to show that she was going to be tough and aggressive.","그녀는 자신이 냉정하고 공격적일 것임을 보여 주고자 했다."]],"w":"7번 문장은 벌 모양 브로치로 보여 주려던 마음이에요. tough와 함께 나오고, 8번의 따뜻함·친선과 반대되는 마음이라서 aggressive = 공격적인이에요.","c":1},"h":"308f905993"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In all, Albright owned more than 200 brooches.)","ko":"Albright는 모두 200개 이상의 브로치를 ( ? ). (owned의 뜻은?)","word":"owned","opts":["잃어버렸다","소유했다","팔았다","빌렸다"],"r":{"a":"2) 소유했다","ev":"11번 문장","s":[[11,"In all, Albright owned more than 200 brooches.","Albright는 모두 200개 이상의 브로치를 소장했다."]],"w":"11번 문장은 브로치를 모두 200개 넘게 가지고 있었다는 말이에요. own(소유하다)의 과거형 owned = 소유했다예요.","c":2},"h":"ca6ad92bda"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nDuring negotiations, she would choose which brooch to wear based on the specific situation.","ko":"밑줄 친 she이(가) 가리키는 것은?","sko":"협상 중에, 그녀는 특정 상황에 따라 어떤 브로치를 착용할지 고르곤 했다.","opts":["Albright","Yasser Arafat","김대중 대통령","한 대사"],"r":{"a":"1) Albright","ev":"5번 문장","s":[[5,"During negotiations, she would choose which brooch to wear based on the specific situation.","협상 중에, 그녀는 특정 상황에 따라 어떤 브로치를 착용할지 고르곤 했다."]],"w":"she는 앞에 나온 Albright를 가리켜요. 협상 중에 상황에 맞는 브로치를 고른 사람은 Albright예요.","c":1,"k":"she = Albright"},"pron":"she","h":"7eea8c2eec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, she was also known for the unique way she used brooches to show her feelings.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그런데 그녀는 자신의 감정을 나타내기 위해 브로치를 사용한 독특한 방식으로도 알려져 있다.","opts":["그녀는 감정을 숨기기 위해 브로치를 쓰는 것으로 알려졌다.","그녀는 브로치를 만드는 독특한 기술로 알려졌다.","그녀는 다른 사람들의 감정을 읽는 독특한 방법으로 알려졌다.","그녀는 자신의 감정을 나타내려고 브로치를 사용한 독특한 방식으로도 알려졌다."],"r":{"a":"4) 그녀는 자신의 감정을 나타내려고 브로치를 사용한 독특한 방식으로도 알려졌다.","ev":"3번 문장","s":[[3,"However, she was also known for the unique way she used brooches to show her feelings.","그런데 그녀는 자신의 감정을 나타내기 위해 브로치를 사용한 독특한 방식으로도 알려져 있다."]],"w":"to show her feelings는 ‘감정을 보여 주기 위해’라는 뜻이고, the unique way she used brooches는 ‘그녀가 브로치를 사용한 독특한 방식’이에요.","c":4},"h":"73e3376aef"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Albright owned fewer than 100 brooches.","Albright wore a sun-shaped brooch when she met President Kim Dae-jung.","Albright wore a sun-shaped brooch to look tough and aggressive.","Albright never changed her brooch during negotiations."],"oko":["Albright는 브로치를 100개보다 적게 소장했다.","Albright는 김대중 대통령을 만났을 때 해 모양 브로치를 착용했다.","Albright는 냉정하고 공격적으로 보이려고 해 모양 브로치를 착용했다.","Albright는 협상 중에 브로치를 한 번도 바꾸지 않았다."],"r":{"a":"2) Albright wore a sun-shaped brooch when she met President Kim Dae-jung. (Albright는 김대중 대통령을 만났을 때 해 모양 브로치를 착용했다.)","ev":"8번 문장","s":[[8,"On the other hand, when she met South Korean President Kim Dae-jung, she wore a sun-shaped brooch to express warmth and friendliness.","반면에, 대한민국의 김대중 대통령을 만났을 때는 온정과 친선을 표현하기 위해 해 모양의 브로치를 착용했다."]],"w":"8번에서 Albright는 김대중 대통령을 만났을 때 온정과 친선을 표현하려고 해 모양 브로치를 착용했다고 해요.","c":2},"h":"4c7817eec0"},{"n":9,"t":"sum","q":"She wore a (A)-shaped brooch when she met the Palestinian (B) Yasser Arafat.","ko":"그녀는 팔레스타인의 (B) Yasser Arafat를 만났을 때 (A) 모양의 브로치를 착용했다.","opts":["(A) bee / (B) leader","(A) bee / (B) singer","(A) star / (B) leader","(A) star / (B) singer","(A) heart / (B) leader"],"oko":["(A) 벌 / (B) 지도자","(A) 벌 / (B) 가수","(A) 별 / (B) 지도자","(A) 별 / (B) 가수","(A) 하트 / (B) 지도자"],"r":{"a":"1) (A) bee / (B) leader ((A) 벌 / (B) 지도자)","ev":"6번 문장","s":[[6,"When she met the Palestinian leader Yasser Arafat, for example, she wore a bee-shaped brooch.","예를 들어, 팔레스타인의 지도자 Yasser Arafat(야세르 아라파트)를 만났을 때는 벌 모양의 브로치를 착용했다."]],"w":"6번에서 Albright는 팔레스타인의 지도자(leader) Yasser Arafat를 만났을 때 벌(bee) 모양의 브로치를 착용했다고 해요.","c":1},"h":"0255853b3e"},{"n":10,"t":"fill","q":"During her political career, she made good use of this [A]. The brooches sent [B] messages in a light-hearted way.","ko":"정치인으로서의 경력 동안, 그녀는 이 [A]을 잘 이용했다. 그 브로치들은 [B] 메시지를 경쾌한 방식으로 전달했다.","bank":["collection","serious","negotiation","ambassador","enemy","balloon"],"bko":{"collection":"소장품","serious":"진지한","negotiation":"협상","ambassador":"대사","enemy":"적","balloon":"풍선"},"r":{"a":"[A] collection, [B] serious","ev":"12~13번 문장","s":[[12,"During her political career, she made good use of this collection.","정치인으로서의 경력 동안, 그녀는 이 소장품을 잘 이용했다."],[13,"The brooches sent serious messages in a
