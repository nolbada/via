<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 스타터 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"hs1-01-1","no":1,"ko":"왜 ‘돼지’ 저금통일까?","items":[{"n":1,"t":"tf","q":"In the 15th century, people in Europe kept their money in pots.","ko":"15세기에 유럽 사람들은 돈을 항아리에 보관했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","w":"4번 문장에 people kept(keep 보관하다의 과거형) their money in pots가 그대로 있어요. 돈을 항아리에 보관했다는 내용과 같아요.","c":"T","s":[[4,"In the 15th century in Europe, people kept their money in pots.","15세기에 유럽에서, 사람들은 그들의 돈을 항아리들에 보관했다."]]},"h":"21ef65d6dd"},{"n":2,"t":"tf","q":"In the 15th century, “pygg” sounded like “pig.”","ko":"15세기에 ‘pygg’는 ‘피그’처럼 들렸다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번 문장에서 그 당시 ‘pygg’는 ‘pug(퍼그)’처럼 들렸어요. ‘pig’처럼 말하기 시작한 건 시간이 흐른 뒤예요(9번).","c":"F","s":[[7,"At that time, “pygg” sounded like “pug.”","그 당시에, ‘pygg’는 ‘퍼그’처럼 들렸다."]]},"h":"aef5285498"},{"n":3,"t":"tf","q":"Piggy banks are used today because of a play on words.","ko":"돼지 저금통은 말장난 때문에 오늘날 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","w":"12번 문장에 because of a play on words(말장난 때문에)가 있어요. 소리가 비슷해서 돼지 저금통이 생겼다는 결론이에요.","c":"T","s":[[12,"So we use piggy banks today because of a play on words!","그래서 우리는 말장난 때문에 오늘날 돼지 저금통을 사용한다!"]]},"h":"c3aeb29925"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (English people had a clever idea.)","ko":"영국 사람들은 기발한 생각이 떠올랐다. (clever는 기발한)","opts":["지루한","기발한","위험한","오래된"],"word":"clever","r":{"a":"2) 기발한","ev":"10~11번 문장","w":"영국 사람들이 떠올린 '기발한 생각'은 돈 항아리를 귀여운 작은 돼지처럼 만들자는 것이에요(11번). 그래서 clever는 '기발한'이에요.","c":2,"s":[[10,"In the 19th century, English people had a clever idea.","19세기에, 영국 사람들은 기발한 생각이 떠올랐다."],[11,"They asked potters to make money jars look like cute little pigs.","그들은 도예가들에게 돈 항아리를 귀여운 작은 돼지처럼 보이게 만들 것을 부탁했다."]]},"h":"e76a082fb7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Maybe you collect coins in your piggy bank.)","ko":"어쩌면 당신은 돼지 저금통에 동전을 모을지도 모른다. (collect는 모으다)","opts":["버리다","세다","숨기다","모으다"],"word":"collect","r":{"a":"4) 모으다","ev":"2번 문장","w":"돼지 저금통에는 동전을 모아요. collect는 '모으다'예요. 버리거나 숨기는 건 저금통의 쓰임이 아니에요.","c":4,"s":[[2,"Maybe you collect coins in your piggy bank.","어쩌면 당신은 돼지 저금통에 동전을 모을지도 모른다."]]},"h":"3257164ca0"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhy is it a pig and not a cat or dog?","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것은 왜 고양이나 개가 아니라 돼지인가?","opts":["돼지 저금통","동전","항아리","영어 단어"],"r":{"a":"1) 돼지 저금통","ev":"1~3번 문장","w":"1~2번에서 계속 돼지 저금통(piggy bank)을 이야기해요. 3번의 it은 그 돼지 저금통이에요. 왜 고양이나 개가 아니라 돼지냐고 묻는 거예요.","c":1,"s":[[1,"Do you have a piggy bank?","당신은 돼지 저금통을 가지고 있는가?"],[2,"Maybe you collect coins in your piggy bank.","어쩌면 당신은 돼지 저금통에 동전을 모을지도 모른다."],[3,"Why is it a pig and not a cat or dog?","그것은 왜 고양이나 개가 아니라 돼지인가?"]]},"h":"6fbef59bb1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Over time, the language changed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시간이 흐르며, 언어가 변했다.","opts":["시간이 지나자 사람들이 말하기를 멈췄다.","시간이 오래 걸려서 언어를 배웠다.","시간이 흐르면서 말이 달라졌다.","언어는 시간이 지나도 변하지 않았다."],"r":{"a":"3) 시간이 흐르면서 말이 달라졌다.","ev":"8번 문장","w":"Over time은 시간이 흐르며, the language changed는 언어가 변했다는 뜻이에요. 그래서 pygg의 소리도 달라졌어요(9번).","c":3,"s":[[8,"Over time, the language changed.","시간이 흐르며, 언어가 변했다."]]},"h":"f8e7906a28"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["15세기에 유럽 사람들은 돈을 나무 상자에 보관했다.","시간이 흐르며 사람들은 ‘pygg’를 ‘피그’처럼 말하기 시작했다.","15세기에 도예가들이 돼지 모양 항아리를 만들었다.","영국 사람들은 돼지 저금통을 처음부터 돼지 모양으로 만들었다."],"opts":["In the 15th century, people in Europe kept their money in wooden boxes.","Over time, people started saying “pygg” like “pig.”","Potters made pig-shaped jars in the 15th century.","English people made piggy banks in the shape of pigs from the start."],"r":{"a":"2) Over time, people started saying “pygg” like “pig.”","ev":"8~9번 문장","w":"8~9번에서 시간이 흐르며 ‘pygg’를 ‘pig’처럼 말하기 시작했어요. 나무 상자가 아니라 항아리(4번)이고, 돼지 모양 항아리는 19세기에 나왔어요(10~11번).","c":2,"s":[[8,"Over time, the language changed.","시간이 흐르며, 언어가 변했다."],[9,"People started saying “pygg” like “pig.”","사람들은 ‘pygg’를 ‘피그’처럼 말하기 시작했다."]]},"h":"04668e1355"},{"n":9,"t":"sum","q":"Over time, the sound of “pygg” (A) , and people began to say it like (B) .","ko":"시간이 흐르며 ‘pygg’의 소리가 (A)했고, 사람들은 그것을 (B)처럼 말하기 시작했다.","oko":["(A) 그대로였고 / (B) 퍼그","(A) 변했고 / (B) 퍼그","(A) 사라졌고 / (B) 피그","(A) 그대로였고 / (B) 피그","(A) 변했고 / (B) 피그"],"opts":["(A) stayed / (B) pug","(A) changed / (B) pug","(A) disappeared / (B) pig","(A) stayed / (B) pig","(A) changed / (B) pig"],"r":{"a":"5) (A) changed / (B) pig","ev":"7~9번 문장","w":"7번에서 처음에는 pug처럼 들렸는데, 8번에서 언어가 변했고(changed), 9번에서 pig처럼 말하기 시작했어요.","c":5,"s":[[7,"At that time, “pygg” sounded like “pug.”","그 당시에, ‘pygg’는 ‘퍼그’처럼 들렸다."],[8,"Over time, the language changed.","시간이 흐르며, 언어가 변했다."],[9,"People started saying “pygg” like “pig.”","사람들은 ‘pygg’를 ‘피그’처럼 말하기 시작했다."]]},"h":"efce2fd4b5"},{"n":10,"t":"fill","q":"English people asked potters to make money jars look like [A] , so today we use [B] banks because of a play on words.","ko":"영국 사람들은 도예가들에게 돈 항아리를 [A]처럼 보이게 만들어 달라고 부탁했고, 그래서 오늘날 우리는 말장난 때문에 [B] 저금통을 사용한다.","bank":["pigs","piggy","cats","clay","pots","orange"],"bko":{"pigs":"돼지들","piggy":"돼지 모양의","cats":"고양이들","clay":"점토","pots":"항아리들","orange":"주황색"},"r":{"a":"[A] pigs, [B] piggy","ev":"10~12번 문장","w":"11번에서 돈 항아리를 귀여운 작은 돼지(pigs)처럼 만들어 달라고 했고, 12번에서 그래서 piggy banks(돼지 저금통)를 쓴다고 해요. cats는 3번에서 돼지와 비교한 동물일 뿐이에요.","c":null,"s":[[10,"In the 19th century, English people had a clever idea.","19세기에, 영국 사람들은 기발한 생각이 떠올랐다."],[11,"They asked potters to make money jars look like cute little pigs.","그들은 도예가들에게 돈 항아리를 귀여운 작은 돼지처럼 보이게 만들 것을 부탁했다."],[12,"So we use piggy banks today because of a play on words!","그래서 우리는 말장난 때문에 오늘날 돼지 저금통을 사용한다!"]]},"h":"8d405f49d8"}]},{"u":1,"id":"hs1-01-2","no":2,"ko":"멋을 위한 게 아니에요","items":[{"n":1,"t":"tf","q":"Remy the rat hides under the chef’s hat when he cooks.","ko":"생쥐 래미는 요리할 때 요리사의 모자 아래에 숨는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","w":"2번에서 래미가 요리할 때 어디에 숨는지 묻고, 3번에서 요리사의 높은 하얀 모자 아래라고 답해요.","c":"T","s":[[2,"Where does the rat, Remy, hide when he cooks?","생쥐인 래미는 요리할 때 어디에 숨는가?"],[3,"Under the chef’s tall white hat!","요리사의 높은 하얀 모자 아래이다!"]]},"h":"1cf9dd0ecf"},{"n":2,"t":"tf","q":"The chef with the shortest hat was the most skilled person in the kitchen.","ko":"가장 낮은 모자를 쓴 요리사가 주방에서 가장 숙련된 사람이었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번에서 가장 숙련된 사람은 가장 높은(tallest) 모자를 쓴 요리사예요. 낮은(shortest) 모자는 반대예요.","c":"F","s":[[7,"So the chef with the tallest hat was the most skilled person in the kitchen.","그래서 가장 높은 모자를 쓴 요리사는 주방에서 가장 숙련된 사람이었다."]]},"h":"b61cb9a173"},{"n":3,"t":"tf","q":"A hat with 100 folds meant the chef could cook 100 eggs.","ko":"100개의 주름을 가진 모자는 요리사가 계란 100개를 요리할 수 있다는 뜻이었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","w":"10번에서 100개의 주름은 계란을 100가지 방법(100 ways)으로 요리할 수 있다는 뜻이에요. 계란 100개가 아니에요.","c":"F","s":[[10,"For example, a hat with 100 folds meant the chef could cook an egg in 100 ways!","예를 들어, 100개의 주름을 가진 모자는 요리사가 100가지 방법으로 계란을 요리할 수 있었다는 것을 의미했다!"]]},"h":"e3d4143628"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A tall hat meant the chef had lots of experience.)","ko":"높은 모자는 요리사가 많은 경험을 가지고 있다는 것을 의미했다. (experience는 경험)","opts":["실수","기억","경험","재료"],"word":"experience","r":{"a":"3) 경험","ev":"6~7번 문장","w":"높은 모자는 요리사가 많은 경험을 가지고 있다는 뜻이고(6번), 그래서 가장 높은 모자를 쓴 요리사가 가장 숙련된 사람이에요(7번). experience는 '경험'이에요.","c":3,"s":[[6,"A tall hat meant the chef had lots of experience.","높은 모자는 요리사가 많은 경험을 가지고 있다는 것을 의미했다."],[7,"So the chef with the tallest hat was the most skilled person in the kitchen.","그래서 가장 높은 모자를 쓴 요리사는 주방에서 가장 숙련된 사람이었다."]]},"h":"30b6cd34af"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This traditional chef’s hat once told a lot about the chef.)","ko":"이 전통적인 요리사 모자는 한때 요리사에 대해 많은 것을 말해주었다. (traditional은 전통적인)","opts":["현대적인","전통적인","특별한","비싼"],"word":"traditional","r":{"a":"2) 전통적인","ev":"4번 문장","w":"4번의 this traditional chef’s hat은 옛날부터 이어 온 전통 방식의 요리사 모자를 말해요. 그래서 traditional은 '전통적인'이에요.","c":2,"s":[[4,"This traditional chef’s hat once told a lot about the chef.","이 전통적인 요리사 모자는 한때 요리사에 대해 많은 것을 말해주었다."]]},"h":"d3e2efc96b"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nWhere does the rat, Remy, hide when he cooks?","ko":"밑줄 친 he가 가리키는 것은?","sko":"생쥐인 래미는 요리할 때 어디에 숨는가?","opts":["영화 <라따뚜이>","요리사","모자","생쥐 래미"],"r":{"a":"4) 생쥐 래미","ev":"2번 문장","w":"2번 문장에서 hide(숨다)와 cook(요리하다)의 주어는 the rat, Remy예요. he는 그 생쥐 래미를 받아요. 영화 제목이나 요리사가 아니에요.","c":4,"s":[[2,"Where does the rat, Remy, hide when he cooks?","생쥐인 래미는 요리할 때 어디에 숨는가?"]]},"h":"df331fccd0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The height of the hat showed the chef’s rank in the kitchen.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모자의 높이는 주방에서 요리사의 지위를 보여주었다.","opts":["모자의 높이를 보면 주방에서 요리사의 지위를 알 수 있었다.","모자가 높을수록 요리사의 키가 컸다.","주방의 높이에 따라 모자 모양이 달랐다.","모든 요리사는 같은 높이의 모자를 썼다."],"r":{"a":"1) 모자의 높이를 보면 주방에서 요리사의 지위를 알 수 있었다.","ev":"5번 문장","w":"showed the chef’s rank는 요리사의 지위를 보여 줬다는 뜻이에요. 키가 아니라 지위를 말해요.","c":1,"s":[[5,"The height of the hat showed the chef’s rank in the kitchen.","모자의 높이는 주방에서 요리사의 지위를 보여주었다."]]},"h":"626ef6aa0b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["가장 낮은 모자가 가장 높은 지위를 보여주었다.","래미는 요리사의 높은 모자 위에 앉아 있다.","요리사 모자의 주름에도 의미가 있었다.","모자의 높이는 요리사의 나이를 보여주었다."],"opts":["The shortest hat showed the highest rank.","Remy sits on top of the chef’s tall hat.","The folds in a chef’s hat had meaning, too.","The height of the hat showed the chef’s age."],"r":{"a":"3) The folds in a chef’s hat had meaning, too.","ev":"8번 문장","w":"8번에서 모자의 주름들도 의미를 갖고 있었다고 해요. 높이는 나이가 아니라 지위를 보여 줬고(5번), 래미는 모자 위가 아니라 아래에 숨어요(3번).","c":3,"s":[[8,"The folds in the hat also had meaning.","모자의 주름들 또한 의미를 갖고 있었다."]]},"h":"e4d247d3ce"},{"n":9,"t":"sum","q":"The height of a chef’s hat showed his (A) , and the chef with the tallest hat was the most (B) person in the kitchen.","ko":"요리사 모자의 높이는 그의 (A)를 보여주었고, 가장 높은 모자를 쓴 요리사는 주방에서 가장 (B) 사람이었다.","oko":["(A) 나이 / (B) 유명한","(A) 지위 / (B) 젊은","(A) 지위 / (B) 지친","(A) 나이 / (B) 숙련된","(A) 지위 / (B) 숙련된"],"opts":["(A) age / (B) famous","(A) rank / (B) young","(A) rank / (B) tired","(A) age / (B) skilled","(A) rank / (B) skilled"],"r":{"a":"5) (A) rank / (B) skilled","ev":"5번, 7번 문장","w":"5번에서 모자 높이는 지위(rank)를 보여 주고, 7번에서 가장 높은 모자를 쓴 요리사는 가장 숙련된(skilled) 사람이에요.","c":5,"s":[[5,"The height of the hat showed the chef’s rank in the kitchen.","모자의 높이는 주방에서 요리사의 지위를 보여주었다."],[7,"So the chef with the tallest hat was the most skilled person in the kitchen.","그래서 가장 높은 모자를 쓴 요리사는 주방에서 가장 숙련된 사람이었다."]]},"h":"448c31c420"},{"n":10,"t":"fill","q":"Each [A] on the hat represented a chef’s mastered [B] .","ko":"모자의 각각의 [A]는 요리사의 숙달된 [B]를 나타냈다.","bank":["fold","recipe","height","egg","rank","kitchen"],"bko":{"fold":"주름","recipe":"요리법","height":"높이","egg":"계란","rank":"지위","kitchen":"주방"},"r":{"a":"[A] fold, [B] recipe","ev":"8~9번 문장","w":"8~9번에서 모자의 주름(fold) 하나는 요리사가 숙달한 요리법(recipe)을 나타내요. 높이(height)와 지위(rank)는 5번의 이야기라서 주름과는 상관없어요.","c":null,"s":[[8,"The folds in the hat also had meaning.","모자의 주름들 또한 의미를 갖고 있었다."],[9,"Each fold represented a chef’s mastered recipe.","각각의 주름은 요리사의 숙달된 요리법을 나타냈다."]]},"h":"2c41d2b21f"}]},{"u":1,"id":"hs1-01-3","no":3,"ko":"누구나 안전하게~","items":[{"n":1,"t":"tf","q":"The card reader is on the ground of the crosswalk.","ko":"카드 판독기는 횡단보도 바닥에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번에서 카드 판독기는 신호등 기둥(traffic light pole)에 있어요. 바닥이 아니에요.","c":"F","s":[[7,"At crosswalks, there is a card reader on the traffic light pole.","횡단보도에는, 신호등 기둥에 카드판독기가 있다."]]},"h":"b23312d2e6"},{"n":2,"t":"tf","q":"Many elderly people cannot cross the street in time.","ko":"연세가 드신 많은 분들은 제시간에 길을 건널 수 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장에 many elderly people ... cannot cross the street in time이 그대로 있어요. 그래서 이 문제를 해결할 제도가 필요해요.","c":"T","s":[[3,"But many elderly people and people with disabilities cannot cross the street in time.","하지만 연세가 드신 분들과 장애를 가진 많은 사람들은 제시간에 길을 건널 수 없다."]]},"h":"1496fc524d"},{"n":3,"t":"tf","q":"Green Man Plus is a system in Japan.","ko":"Green Man Plus는 일본에 있는 제도이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","w":"4번에서 이 제도가 있는 나라는 싱가포르(Singapore)예요. 일본이 아니에요.","c":"F","s":[[4,"In Singapore, there is a system to solve this problem.","싱가포르에는, 이 문제를 해결할 제도가 있다."]]},"h":"f442e4ddc7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But many elderly people and people with disabilities cannot cross the street in time.)","ko":"하지만 연세가 드신 많은 분들과 장애를 가진 사람들은 제시간에 길을 건널 수 없다. (elderly는 연세가 드신)","opts":["어린","연세가 드신","키가 큰","힘이 센"],"word":"elderly","r":{"a":"2) 연세가 드신","ev":"3번, 6번 문장","w":"3번에서 elderly people은 길을 제시간에 건너기 힘든 사람들이고, 6번에서 60세 이상의 사람들이 특별한 카드를 가져요. 그래서 elderly는 '연세가 드신'이에요.","c":2,"s":[[3,"But many elderly people and people with disabilities cannot cross the street in time.","하지만 연세가 드신 분들과 장애를 가진 많은 사람들은 제시간에 길을 건널 수 없다."],[6,"People over 60 years old and people with disabilities have special cards.","60세 이상의 사람들과 장애가 있는 사람들은 특별한 카드를 가지고 있다."]]},"h":"3432451097"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In Singapore, there is a system to solve this problem.)","ko":"싱가포르에는, 이 문제를 해결할 제도가 있다. (solve는 해결하다)","opts":["만들다","설명하다","발견하다","해결하다"],"word":"solve","r":{"a":"4) 해결하다","ev":"3~4번 문장","w":"3번에서 연세 드신 분들이 길을 제시간에 건너지 못하는 문제가 나오고, 4번에서 이 문제를 해결할 제도가 있다고 해요. solve는 '해결하다'예요.","c":4,"s":[[3,"But many elderly people and people with disabilities cannot cross the street in time.","하지만 연세가 드신 분들과 장애를 가진 많은 사람들은 제시간에 길을 건널 수 없다."],[4,"In Singapore, there is a system to solve this problem.","싱가포르에는, 이 문제를 해결할 제도가 있다."]]},"h":"394222bde7"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nPeople tap their cards on it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"사람들은 그것에 카드를 가볍게 가져다 댄다.","opts":["신호등","특별한 카드","카드 판독기","횡단보도"],"r":{"a":"3) 카드 판독기","ev":"7~8번 문장","w":"7번에서 신호등 기둥에 카드 판독기(a card reader)가 있다고 했고, 8번에서 카드를 그곳에 대요. it은 카드 판독기예요.","c":3,"s":[[7,"At crosswalks, there is a card reader on the traffic light pole.","횡단보도에는, 신호등 기둥에 카드판독기가 있다."],[8,"People tap their cards on it.","사람들은 그것에 카드를 가볍게 가져다 댄다."]]},"h":"7354d66065"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When the light turns green, you can cross the street.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"불이 초록색으로 바뀌면, 당신은 길을 건너도 된다.","opts":["신호등이 초록색으로 바뀌면 길을 건널 수 있다.","신호등이 빨간색이 되면 길을 건널 수 있다.","길을 건너면 신호등이 초록색으로 바뀐다.","초록색 불이 켜지면 길을 건너면 안 된다."],"r":{"a":"1) 신호등이 초록색으로 바뀌면 길을 건널 수 있다.","ev":"2번 문장","w":"When the light turns green은 '불이 초록색으로 바뀌면'이고, you can cross는 '건널 수 있다'예요. 초록불이 먼저이고 그 다음에 건너요.","c":1,"s":[[2,"When the light turns green, you can cross the street.","불이 초록색으로 바뀌면, 당신은 길을 건너도 된다."]]},"h":"193d6012c8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["모든 사람이 12초 더 긴 초록불을 받는다.","싱가포르의 신호등은 항상 3초 동안 빨간색이다.","사람들은 카드를 버스에 가볍게 가져다 댄다.","60세 이상의 사람들과 장애가 있는 사람들은 특별한 카드를 가지고 있다."],"opts":["Everyone gets 12 more seconds of green light.","Traffic lights in Singapore are always red for 3 seconds.","People tap their cards on a bus.","People over 60 years old and people with disabilities have special cards."],"r":{"a":"4) People over 60 years old and people with disabilities have special cards.","ev":"6번 문장","w":"6번에서 60세 이상의 사람들과 장애가 있는 사람들이 특별한 카드를 가져요. 초록불이 늘어나는 것은 카드를 댄 사람들뿐이고(8~9번), 카드는 신호등 기둥의 판독기에 대요(7~8번).","c":4,"s":[[6,"People over 60 years old and people with disabilities have special cards.","60세 이상의 사람들과 장애가 있는 사람들은 특별한 카드를 가지고 있다."]]},"h":"252f012b6c"},{"n":9,"t":"sum","q":"Many (A) people cannot cross the street in time, so Singapore has a (B) to solve this problem.","ko":"연세가 드신 많은 (A) 사람들은 제시간에 길을 건널 수 없어서, 싱가포르에는 이 문제를 해결할 (B)가 있다.","oko":["(A) 젊은 / (B) 제도","(A) 연세가 드신 / (B) 다리","(A) 바쁜 / (B) 제도","(A) 젊은 / (B) 다리","(A) 연세가 드신 / (B) 제도"],"opts":["(A) young / (B) system","(A) elderly / (B) bridge","(A) busy / (B) system","(A) young / (B) bridge","(A) elderly / (B) system"],"r":{"a":"5) (A) elderly / (B) system","ev":"3~4번 문장","w":"3번에서 연세가 드신 분들(elderly people)이 제시간에 건너기 어렵다고 했고, 4번에서 이 문제를 해결할 제도(system)가 싱가포르에 있다고 해요.","c":5,"s":[[3,"But many elderly people and people with disabilities cannot cross the street in time.","하지만 연세가 드신 분들과 장애를 가진 많은 사람들은 제시간에 길을 건널 수 없다."],[4,"In Singapore, there is a system to solve this problem.","싱가포르에는, 이 문제를 해결할 제도가 있다."]]},"h":"e2dbbcfeda"},{"n":10,"t":"fill","q":"When people [A] their cards on the card reader, the traffic light stays [B] for 3 to 12 more seconds.","ko":"사람들이 카드 판독기에 카드를 가볍게 [A]면, 신호등은 3초에서 12초 더 [B]인 상태를 유지한다.","bank":["tap","green","red","cross","pole","safely"],"bko":{"tap":"가볍게 가져다 대다","green":"초록색","red":"빨간색","cross":"건너다","pole":"기둥","safely":"안전하게"},"r":{"a":"[A] tap, [B] green","ev":"8~9번 문장","w":"8번에서 사람들이 카드를 가볍게 가져다 대고(tap), 9번에서 신호등이 초록색(green)인 상태를 3초에서 12초 더 유지해요. red는 반대예요.","c":null,"s":[[8,"People tap their cards on it.","사람들은 그것에 카드를 가볍게 가져다 댄다."],[9,"Then, the traffic light stays green for 3 to 12 more seconds.","그러면, 신호등은 3초에서 12초 더 초록색인 상태를 유지한다."]]},"h":"71e83c0a0a"}]},{"u":2,"id":"hs1-02-1","no":1,"ko":"날 이길 수 없을 걸?","items":[{"n":1,"t":"tf","q":"A winner will likely choose the same thing in the next round.","ko":"승자는 다음 판에 아마도 같은 것을 선택할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"A winner will likely choose the same thing in the next round.","승자는 다음 판에 아마도 같은 것을 선택할 것이다."]],"w":"8번 문장에 그대로 나와요. 이긴 사람은 다음 판에도 같은 것(the same thing)을 낼 가능성이 커요.","c":"T"},"h":"72972f5266"},{"n":2,"t":"tf","q":"A loser will often keep using the same thing.","ko":"패자는 종종 같은 것을 계속 사용할 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"However, a loser will switch to a different one.","하지만, 패자는 다른 것으로 바꿀 것이다."]],"w":"9번 문장에서 패자는 다른 것으로 바꾼다(will switch to a different one)고 했어요. 같은 것을 계속 낸다는 건 승자의 행동이에요.","c":"F"},"h":"1a02cf5268"},{"n":3,"t":"tf","q":"There is a secret winning strategy for rock-paper-scissors.","ko":"가위바위보에는 비밀의 이기는 전략이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"There is a secret winning strategy!","비밀의 이기는 전략이 있다!"]],"w":"6번 문장에 There is a secret winning strategy!라고 나와요.","c":"T"},"h":"b1b4ff0f9a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, a loser will switch to a different one.)","ko":"하지만, 패자는 다른 것으로 바꿀 것이다. (switch는 바꾸다)","opts":["지킨다","멈춘다","바꾼다","잊는다"],"word":"switch","r":{"a":"3) 바꾼다","ev":"9번 문장","s":[[9,"However, a loser will switch to a different one.","하지만, 패자는 다른 것으로 바꿀 것이다."]],"w":"승자는 같은 것을 또 내지만 However(하지만) 패자는 to a different one(다른 것으로) 간다고 했으니 switch는 '바꾸다'예요.","c":3},"h":"fe6a19bfd1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You might think, “I’m unlucky today.”)","ko":"당신은 ‘나는 오늘 운이 없어’라고 생각할지도 모른다. (unlucky는 운이 없는)","opts":["운이 없는","행복한","피곤한","화가 난"],"word":"unlucky","r":{"a":"1) 운이 없는","ev":"2~4번 문장","s":[[2,"In the first round, you lose.","첫 번째 판에서, 당신은 진다."],[3,"Next round, you lose again.","다음 판에서, 당신은 또 진다."],[4,"You might think, “I’m unlucky today.”","당신은 ‘나는 오늘 운이 없어’라고 생각할지도 모른다."]],"w":"2~3번에서 계속 졌어요. 그래서 '오늘 운이 없다(unlucky)'고 생각할 수 있다는 말이에요.","c":1},"h":"930ec3e60d"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nHowever, a loser will switch to a different one.","ko":"밑줄 친 one이 가리키는 것은?","sko":"하지만, 패자는 다른 것으로 바꿀 것이다.","opts":["승자","패자","게임 이름","(바위·보·가위 중) 선택하는 것"],"r":{"a":"4) (바위·보·가위 중) 선택하는 것","ev":"8~9번 문장","s":[[8,"A winner will likely choose the same thing in the next round.","승자는 다음 판에 아마도 같은 것을 선택할 것이다."],[9,"However, a loser will switch to a different one.","하지만, 패자는 다른 것으로 바꿀 것이다."]],"w":"one은 같은 말을 반복하지 않으려고 쓴 말이에요. 8번 문장의 thing(선택하는 것)을 대신해서, 패자가 '다른 것'으로 바꾼다는 뜻이에요.","c":4},"h":"d9d9ee0fce"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This will often follow the order of the game’s name, rock-paper-scissors.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 종종 가위바위보라는 게임 이름의 순서를 따를 것이다.","opts":["이것은 가위바위보라는 게임 이름을 자주 바꿀 것이다.","이것은 종종 가위바위보라는 게임 이름의 순서를 따를 것이다.","이것은 게임 이름과 달리 순서가 없을 것이다.","이것은 게임 이름을 순서대로 외우게 만들 것이다."],"r":{"a":"2) 이것은 종종 가위바위보라는 게임 이름의 순서를 따를 것이다.","ev":"10번 문장","s":[[10,"This will often follow the order of the game’s name, rock-paper-scissors.","이것은 종종 가위바위보라는 게임 이름의 순서를 따를 것이다."]],"w":"follow the order of ~는 '~의 순서를 따르다'예요. 패자가 바꾸는 방식이 바위 → 보 → 가위 순서를 따른다는 뜻이에요.","c":2},"h":"221af6c3a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["승자는 다음 판에 보통 다른 것으로 바꾼다.","패자는 항상 같은 것을 다시 낸다.","바위로 진 사람은 아마도 다음에 보를 낼 것이다.","글 속 ‘당신’은 첫 판에서 이기고 다음 판에서 졌다."],"opts":["A winner will usually switch to a different thing in the next round.","A loser always uses the same thing again.","A person who loses with rock will likely use paper next.","You won the first round and lost the next round."],"r":{"a":"3) A person who loses with rock will likely use paper next.","ev":"11~12번 문장","s":[[11,"Let’s say someone loses with “rock.”","누군가가 ‘바위’로 진다고 가정해 보자."],[12,"This person will likely use “paper” next.","이 사람은 아마도 다음에 ‘보’를 사용할 것이다."]],"w":"11~12번 문장과 같아요. 바위로 지면 다음에는 보를 낼 가능성이 커요. 승자는 같은 것을 내고(8번), 패자는 바꾸며(9번), 글 속 '당신'은 두 판 모두 졌어요(2~3번).","c":3},"h":"68f7c0329a"},{"n":9,"t":"sum","q":"A winner will likely (A) the same thing in the next round, but a loser will (B) to a different one.","ko":"승자는 다음 판에 같은 것을 (A)할 것이지만, 패자는 다른 것으로 (B)할 것이다.","oko":["(A) 바꾼다 / (B) 머문다","(A) 선택한다 / (B) 머문다","(A) 피한다 / (B) 바꾼다","(A) 바꾼다 / (B) 바꾼다","(A) 선택한다 / (B) 바꾼다"],"opts":["(A) change / (B) stay","(A) choose / (B) stay","(A) avoid / (B) switch","(A) change / (B) switch","(A) choose / (B) switch"],"r":{"a":"5) (A) choose / (B) switch","ev":"8~9번 문장","s":[[8,"A winner will likely choose the same thing in the next round.","승자는 다음 판에 아마도 같은 것을 선택할 것이다."],[9,"However, a loser will switch to a different one.","하지만, 패자는 다른 것으로 바꿀 것이다."]],"w":"8번에서 승자는 같은 것을 선택하고(choose), 9번에서 패자는 다른 것으로 바꿔요(switch). 승자가 바꾸거나 패자가 머문다는 건 반대예요.","c":5},"h":"4683b5f687"},{"n":10,"t":"fill","q":"A person who loses with “rock” will likely use [A] next, so keep these [B] in mind.","ko":"‘바위’로 진 사람은 다음에 [A]를 사용할 것이므로, 이 [B]을 명심해라.","bank":["paper","patterns","scissors","luck","prizes","rock"],"bko":{"paper":"보","patterns":"패턴","scissors":"가위","luck":"행운","prizes":"상","rock":"바위"},"r":{"a":"[A] paper, [B] patterns","ev":"11~13번 문장","s":[[11,"Let’s say someone loses with “rock.”","누군가가 ‘바위’로 진다고 가정해 보자."],[12,"This person will likely use “paper” next.","이 사람은 아마도 다음에 ‘보’를 사용할 것이다."],[13,"If you want to win, keep these patterns in mind!","만약 당신이 이기고 싶다면, 이 패턴들을 명심해라!"]],"w":"12번에서 바위로 진 사람은 다음에 paper(보)를 쓰고, 13번에서 이 patterns(패턴)를 명심하라고 해요. scissors(가위)는 바위 다음이 아니라 보 다음 순서예요.","c":null},"h":"17fed3c9bf"}]},{"u":2,"id":"hs1-02-2","no":2,"ko":"바다에 사과 두 조각이?!","items":[{"n":1,"t":"tf","q":"According to scientists, water went into the cracks of the rock.","ko":"과학자들에 따르면, 물이 바위의 틈 안으로 들어갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Scientists say seawater got inside the cracks of the rock.","과학자들은 바닷물이 바위의 틈 안으로 들어갔다고 말한다."]],"w":"6번 문장에서 과학자들이 바닷물이 바위의 틈 안으로 들어갔다고 말해요.","c":"T"},"h":"1fa7ef17c3"},{"n":2,"t":"tf","q":"In the legend, the two gods worked together to carry the rock.","ko":"전설에서, 두 신은 함께 힘을 합쳐 바위를 옮겼다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"They fought over the rock.","그들은 바위를 두고 싸웠다."],[12,"They each pulled one side of the rock.","그들은 각자 바위의 한쪽을 잡아당겼다."]],"w":"11번에서 두 신은 바위를 두고 싸웠고(fought over), 12번에서 각자 한쪽을 잡아당겼어요. 힘을 합쳐 옮긴 것이 아니에요.","c":"F"},"h":"1546a0882b"},{"n":3,"t":"tf","q":"The Split Apple Rock is near the shore of Australia.","ko":"Split Apple Rock은 호주의 해안 가까이에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"There is an unusual rock near the shore of New Zealand.","뉴질랜드의 해안 가까이에 특이한 바위가 있다."]],"w":"1번 문장에서 바위는 뉴질랜드(New Zealand)의 해안 가까이에 있다고 해요. 호주가 아니에요.","c":"F"},"h":"702b5a4c12"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When the weather got cold, the seawater froze and expanded.)","ko":"날씨가 추워졌을 때, 바닷물은 얼었고 팽창했다. (expand는 팽창하다)","opts":["녹았다"," 가 바위를 갈랐다고 말한다.","전설에서는 두 신이 바위를 두고 싸웠다.","전설에서는 한 과학자가 바위를 갈랐다."],"opts":["The Split Apple Rock looks like an orange.","Scientists say strong waves broke the rock.","In the legend, two gods fought over the rock.","In the legend, a scientist broke the rock."],"r":{"a":"3) In the legend, two gods fought over the rock.","ev":"2, 6, 10, 11번 문장","s":[[2,"It looks like an apple.","그것은 사과처럼 보인다."],[6,"Scientists say seawater got inside the cracks of the rock.","과학자들은 바닷물이 바위의 틈 안으로 들어갔다고 말한다."],[10,"There were two powerful gods.","두 명의 강한 신이 있었다."],[11,"They fought over the rock.","그들은 바위를 두고 싸웠다."]],"w":"10~11번 문장과 같아요. 바위는 사과처럼 보이고(2번), 과학자들은 얼어서 팽창한 바닷물을 이유로 말해요(6~8번). 전설에는 신들이 나와요.","c":3},"h":"5839ca60f0"},{"n":9,"t":"sum","q":"Scientists say (A) water broke the rock, and a legend says two gods each (B) one side of it.","ko":"과학자들은 (A) 물이 바위를 갈랐다고 말하고, 전설은 두 신이 각자 그 한쪽을 (B)했다고 말한다.","oko":["(A) 뜨거운 / (B) 잡아당겼다","(A) 언 / (B) 색칠했다","(A) 언 / (B) 잡아당겼다","(A) 뜨거운 / (B) 색칠했다","(A) 더러운 / (B) 잡아당겼다"],"opts":["(A) hot / (B) pulled","(A) frozen / (B) painted","(A) frozen / (B) pulled","(A) hot / (B) painted","(A) dirty / (B) pulled"],"r":{"a":"3) (A) frozen / (B) pulled","ev":"7, 8, 12번 문장","s":[[7,"When the weather got cold, the seawater froze and expanded.","날씨가 추워졌을 때, 바닷물은 얼었고 팽창했다."],[8,"The frozen water broke the rock in half.","언 물이 바위를 반으로 갈랐다."],[12,"They each pulled one side of the rock.","그들은 각자 바위의 한쪽을 잡아당겼다."]],"w":"7~8번에서 바닷물이 얼어(frozen) 바위를 갈랐고, 12번에서 신들이 각자 한쪽을 잡아당겼어요(pulled).","c":3},"h":"861b3d0210"},{"n":10,"t":"fill","q":"There are [A] stories about how the rock was formed: one from scientists and one [B] about gods.","ko":"바위가 어떻게 형성되었는지에 대한 [A]개의 이야기가 있다. 하나는 과학자들의 것이고 하나는 신들에 대한 [B]이다.","bank":["two","legend","apple","shore","frozen","crack"],"bko":{"two":"두","legend":"전설","apple":"사과","shore":"해안","frozen":"언","crack":"틈"},"r":{"a":"[A] two, [B] legend","ev":"9, 15번 문장","s":[[9,"But there is also a legend about the rock.","그러나 그 바위에 대한 전설도 있다."],[15,"Between these two stories, which one do you believe?","이 두 이야기 중에서, 당신은 어떤 것을 믿는가?"]],"w":"9번에서 과학자들의 설명 말고 또 하나, 바위에 대한 legend(전설)가 있다고 하고, 15번에서 these two stories(이 두 이야기)라고 했어요.","c":null},"h":"36528b63ed"}]},{"u":2,"id":"hs1-02-3","no":3,"ko":"소중한 너에게","items":[{"n":1,"t":"tf","q":"Beth’s grandfather held up a gold bracelet and asked if she wanted it.","ko":"Beth의 할아버지는 금팔찌를 들고 그녀가 그것을 갖고 싶은지 물었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He held up a shiny gold bracelet and asked, “Would you like to have this?”","그는 반짝이는 금팔찌를 들고 “이것을 갖고 싶니?”라고 물었다."]],"w":"3번 문장에서 할아버지가 shiny gold bracelet(반짝이는 금팔찌)을 들고 갖고 싶은지 물었어요.","c":"T"},"h":"7dabf9ff86"},{"n":2,"t":"tf","q":"The bracelet lost its value when it got dirty.","ko":"팔찌는 더러워졌을 때 가치를 잃었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"“You want the bracelet because it doesn’t lose its value,” he said.","“팔찌가 가치를 잃지 않기 때문에 네가 그것을 원하는 거란다”라고 그가 말했다."]],"w":"10번 문장에서 팔찌는 가치를 잃지 않는다(doesn’t lose its value)고 했어요.","c":"F"},"h":"95d2164845"},{"n":3,"t":"tf","q":"Beth did not want the bracelet after it got dirty.","ko":"Beth는 팔찌가 더러워진 뒤에는 그것을 원하지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"He picked it up and asked, “Do you still want this?”","그는 그것을 주워서 “여전히 이것을 갖고 싶니?”라고 물었다."],[8,"“Of course,” Beth replied.","“물론이에요”라고 Beth가 대답했다."]],"w":"7번에서 할아버지가 여전히 갖고 싶은지 묻자 8번에서 Beth는 Of course(물론이에요)라고 대답했어요. 여전히 원했어요.","c":"F"},"h":"7b05a9214f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Her grandfather nodded.)","ko":"그녀의 할아버지는 고개를 끄덕였다. (nod는 고개를 끄덕이다)","opts":["고개를 저었다","손을 흔들었다","고개를 끄덕였다","눈을 감았다"],"word":"nodded","r":{"a":"3) 고개를 끄덕였다","ev":"8~10번 문장","s":[[8,"“Of course,” Beth replied.","“물론이에요”라고 Beth가 대답했다."],[9,"Her grandfather nodded.","그녀의 할아버지는 고개를 끄덕였다."],[10,"“You want the bracelet because it doesn’t lose its value,” he said.","“팔찌가 가치를 잃지 않기 때문에 네가 그것을 원하는 거란다”라고 그가 말했다."]],"w":"Beth가 Of course라고 대답하자(8번) 할아버지가 nodded 한 뒤 '네가 원하는 건 가치를 잃지 않기 때문'이라고 말해요(10번). 동의하는 행동 "],"r":{"a":"1) Beth was upset because of unkind things some classmates said.","ev":"1, 7, 14번 문장","s":[[1,"One day, Beth was upset because some classmates said unkind things about her.","어느 날, Beth는 몇몇 반 친구들이 그녀에 대해 불쾌한 말을 해서 속상했다."],[7,"He picked it up and asked, “Do you still want this?”","그는 그것을 주워서 “여전히 이것을 갖고 싶니?”라고 물었다."],[14,"Beth smiled and hugged her grandfather.","Beth는 미소 지었고 그녀의 할아버지를 껴안았다."]],"w":"1번 문장과 같아요. 할아버지는 팔찌를 흙에 떨어뜨렸다가 다시 주웠고(5번, 7번), 팔찌는 할아버지가 보여 준 거예요(3번). 마지막에 Beth는 미소 지었어요(14번).","c":1},"h":"a1b03a75b8"},{"n":9,"t":"sum","q":"Beth’s grandfather showed that her (A) never changes, just like the (B) that she still wanted when it was dirty.","ko":"Beth의 할아버지는 그녀의 (A)이/가 절대 변하지 않는다는 것을, 더러워졌을 때도 그녀가 여전히 원했던 (B)처럼 보여 주었다.","oko":["(A) 기분 / (B) 팔찌","(A) 가치 / (B) 흙","(A) 친구들 / (B) 팔찌","(A) 가치 / (B) 반 친구들","(A) 가치 / (B) 팔찌"],"opts":["(A) mood / (B) bracelet","(A) value / (B) dirt","(A) friends / (B) bracelet","(A) value / (B) classmates","(A) value / (B) bracelet"],"r":{"a":"5) (A) value / (B) bracelet","ev":"10~13번 문장","s":[[10,"“You want the bracelet because it doesn’t lose its value,” he said.","“팔찌가 가치를 잃지 않기 때문에 네가 그것을 원하는 거란다”라고 그가 말했다."],[11,"“You are the same.","“너도 똑같아."],[12,"You have great value.","너는 큰 가치가 있어."],[13,"And your value never changes.”","그리고 너의 가치는 절대 변하지 않는단다.”"]],"w":"10번에서 팔찌는 가치를 잃지 않고, 11~13번에서 Beth도 같다고 하며 그 value(가치)는 절대 변하지 않는다고 해요. 더러워졌어도 원한 것은 흙이 아니라 팔찌예요.","c":5},"h":"5706461a68"},{"n":10,"t":"fill","q":"The grandfather [A] the bracelet in the dirt, and the bracelet got [B].","ko":"할아버지는 팔찌를 흙에 [A], 팔찌는 [B] 상태가 되었다.","bank":["dropped","dirty","shiny","nodded","upset","kind"],"bko":{"dropped":"떨어뜨렸다","dirty":"더러운","shiny":"반짝이는","upset":"속상한","kind":"친절한","nodded":"고개를 끄덕였다"},"r":{"a":"[A] dropped, [B] dirty","ev":"5~6번 문장","s":[[5,"Then, he took her outside and dropped the bracelet in the dirt.","그러고 나서, 그는 그녀를 밖으로 데리고 나가서 팔찌를 흙에 떨어뜨렸다."],[6,"The bracelet got dirty.","그 팔찌가 더러워졌다."]],"w":"5번에서 할아버지가 팔찌를 흙에 dropped(떨어뜨렸다)하고, 6번에서 팔찌가 dirty(더러워졌다). 흙에 떨어졌으니 shiny(반짝이는)는 맞지 않고, nodded(고개를 끄덕였다)는 팔찌를 흙에 두는 행동이 아니에요.","c":null},"h":"e6df985f43"}]},{"u":3,"id":"hs1-03-1","no":1,"ko":"도구를 쓰자","items":[{"n":1,"t":"tf","q":"The sport spread across Europe over time.","ko":"그 스포츠는 시간이 흐르며 유럽 전체로 퍼졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Over time, the sport spread across Europe.","시간이 흐르며, 그 스포츠는 유럽 전체에 걸쳐 퍼졌다."]],"w":"5번 문장에 Over time, the sport spread across Europe.가 나와요. 시간이 흐르며 유럽 전체로 퍼졌다는 내용과 같아요.","c":"T"},"h":"bd49c5cd50"},{"n":2,"t":"tf","q":"The balls players used were made of metal.","ko":"선수들이 사용한 공은 금속으로 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"But players felt uncomfortable because the balls were made of wood.","하지만 공들이 나무로 만들어졌기 때문에 선수들은 불편하다고 느꼈다."]],"w":"6번 문장에서 공은 나무(wood)로 만들어졌다고 해요. 금속이 아니에요.","c":"F"},"h":"b6570824c6"},{"n":3,"t":"tf","q":"The gloves players wore had webbing between the fingers.","ko":"선수들이 낀 장갑은 손가락 사이에 그물망이 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"The gloves had webbing between the fingers.","그 장갑은 손가락 사이에 그물망이 있었다."]],"w":"9번 문장에 The gloves had webbing between the fingers.가 그대로 나와요.","c":"T"},"h":"1ac2fdcc59"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They were hard and hurt players’ hands.)","ko":"그것들은 단단했고 선수들의 손을 다치게 했다. (hurt는 다치게 하다)","opts":["부드러운","단단한","가벼운","둥근"],"word":"hard","r":{"a":"2) 단단한","ev":"6~7번 문장","s":[[6,"But players felt uncomfortable because the balls were made of wood.","하지만 공들이 나무로 만들어졌기 때문에 선수들은 불편하다고 느꼈다."],[7,"They were hard and hurt players’ hands.","그것들은 단단했고 선수들의 손을 다치게 했다."]],"w":"6번에서 공이 나무로 만들어졌다고 했고, 그래서 선수들의 손을 다치게 했어요. 손을 다치게 하는 공은 부드러운 게 아니라 단단한 공이에요. hard = 단단한.","c":2},"h":"3cc6585f6a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To protect their hands, players began wearing leather gloves.)","ko":"그들의 손을 보호하기 위해, 선수들은 가죽 장갑을 끼기 시작했다.","opts":["공격하다","연결하다","퍼뜨리다","보호하다"],"word":"protect","r":{"a":"4) 보호하다","ev":"8번 문 (B) larger"],"oko":["(A) 움직인다 / (B) 더 거칠고","(A) 움직인다 / (B) 더 부드럽고","(A) 숨긴다 / (B) 더 부드럽고","(A) 산다 / (B) 더 둥글고","(A) 닦는다 / (B) 더 크고"],"r":{"a":"2) (A) move / (B) smoother","ev":"8~10번 문장","s":[[8,"Over many years, the waves move the glass around.","수년에 걸쳐, 파도는 유리를 이리저리 움직인다."],[9,"They cause the glass to rub against the sand.","그것들은 유리가 모래에 문질러지게 한다."],[10,"This makes it smoother and rounder.","이것은 그것을 더 부드럽고 더 둥글게 만든다."]],"w":"8번에서 파도가 유리를 움직이고(move), 10번에서 유리가 더 부드럽고 둥글어져요(smoother). 숨기거나(hide) 사거나(buy) 닦는(clean) 내용은 없어요.","c":2},"h":"1da87f0292"},{"n":10,"t":"fill","q":"Sea glass is often used in [A], and people call it “mermaid’s tears” because of its [B].","ko":"바다 유리는 [A]에 종종 사용되고, 사람들은 그것의 [B] 때문에 ‘인어의 눈물’이라고 부른다.","bank":["jewelry","beauty","ocean","stone","wave","trash"],"bko":{"jewelry":"장신구","beauty":"아름다움","ocean":"바다","stone":"돌","wave":"파도","trash":"쓰레기"},"r":{"a":"[A] jewelry, [B] beauty","ev":"12~13번 문장","s":[[12,"Sea glass is often used in jewelry.","바다 유리는 장신구에 종종 사용된다."],[13,"When you see its beauty, you’ll understand why people call sea glass “mermaid’s tears”!","당신이 그것의 아름다움을 보면, 왜 사람들이 바다 유리를 ‘인어의 눈물’이라고 부르는지 이해할 것이다!"]],"w":"12번에서 바다 유리는 장신구(jewelry)에 종종 사용된다고 하고, 13번에서 그 아름다움(beauty)을 보면 왜 인어의 눈물이라고 부르는지 이해할 것이라고 해요.","c":null},"h":"5d3972f14a"}]},{"u":4,"id":"hs1-04-2","no":2,"ko":"제 곰 인형을 살려주세요","items":[{"n":1,"t":"tf","q":"Ted is a new friend of Emily.","ko":"Ted는 Emily의 새 친구이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"He is an old friend.","그는 오래된 친구예요."]],"w":"4번 문장에서 Ted는 an old friend(오래된 친구)라고 해요. 새 친구(new)가 아니에요.","c":"F"},"h":"4c0e013853"},{"n":2,"t":"tf","q":"The teddy bear doctor will wear gloves and a mask.","ko":"곰 인형 의사는 장갑과 마스크를 착용할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"I will wear doctor’s gloves and a mask.","저는 의사 장갑과 마스크를 착용할 거예요."]],"w":"14번 문장에서 I will wear doctor’s gloves and a mask라고 해요. 의사가 장갑과 마스크를 착용한다는 내용과 일치해요.","c":"T"},"h":"af4f9b805d"},{"n":3,"t":"tf","q":"Emily will receive photos of Ted before the surgery.","ko":"Emily는 수술 전에 Ted의 사진을 받을 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"16번 문장","s":[[16,"After the surgery, you will receive progress photos of Ted’s recovery.","수술 후에, 당신은 Ted의 회복 경과 사진들을 받을 거예요."]],"w":"16번 문장에서 After the surgery(수술 후에) 회복 경과 사진을 받는다고 해요. 수술 전이 아니에요.","c":"F"},"h":"7d06bd979c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But my dog, Bailey, ripped him yesterday.)","ko":"하지만 제 강아지 Bailey가 어제 그를 찢어버렸어요. (rip은 찢다)","opts":["씻겼다","안았다","숨겼다","찢었다"],"word":"ripped","r":{"a":"4) 찢었다","ev":"5~6번 문장","s":[[5,"But my dog, Bailey, ripped him yesterday.","하지만 제 강아지 Bailey가 어제 그를 찢어버렸어요."],[6,"Can you fix him?","그를 고쳐 주실 수 있나요?"]],"w":"5번에서 강아지가 Ted에게 한 일 때문에 6번에서 Emily가 '고쳐 주실 수 있나요?'라고 물어요. 고쳐야 할 만큼 망가졌다는 뜻이니 '찢었다'가 알맞아요. rip = 찢다.","c":4},"h":"060cbee89a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (First, I’m going to ask you about his appearance when you first met him.)","ko":"우선, 저는 당신에게 그를 처음 만났을 때의 그의 생김새에 대해 물어볼 거예요. (appearance는 생김새)","opts":["나이","생김새","주소","가격"],"word":"appearance","r":{"a":"2) 생김새","ev":"11~12번 문장","s":[[11,"First, I’m going to ask you about his appearance when you first met him.","우선, 저는 당신에게 그를 처음 만났을 때의 그의 생김새에 대해 물어볼 거예요."],[12,"I want to make him look like that again.","저는 그가 다시 그렇게 보이도록 만들고 싶어요."]],"w":"11번에서 처음 만났을 때의 appearance를 묻고, 12번에서 그가 다시 그렇게 보이게 만들고 싶다고 해요. 어떻게 '보이는지'를 묻는 것이니 '생김새'예요.","c":2},"h":"81500e23a2"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nI want to make him look like that again.","ko":"밑줄 친 him이 가리키는 것은?","opts":["Bailey(강아지)","Emily","곰 인형 의사","Ted(곰 인형)"],"sko":"저는 그가 다시 그렇게 보이도록 만들고 싶어요.","r":{"a":"4) Ted(곰 인형)","ev":"11~12번 문장","s":[[11,"First, I’m going to ask you about his appearance when you first met him.","우선, 저는 당신에게 그를 처음 만났을 때의 그의 생김새에 대해 물어볼 거예요."],[12,"I want to make him look like that again.","저는 그가 다시 그렇게 보이도록 만들고 싶어요."]],"w":"11번에서 his appearance, him은 Ted를 말해요. 12번의 him도 같은 Ted예요. 의사는 Ted를 처음 모습으로 되돌리고 싶어 해요.","c":4},"h":"1d7d610da9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You must be sad.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["당신은 슬픈 것 같아 보이지 않아요.","당신은 슬프겠네요.","당신은 슬퍼해서는 안 돼요.","당신은 슬픈 척을 하고 있어요."],"sko":"당신은 슬플 것이 틀림없어요(슬프겠네요).","r":{"a":"2) 당신은 슬프겠네요.","ev":"8번 문장","s":[[8,"You must be sad.","당신은 슬플 것이 틀림없어요(슬프겠네요)."]],"w":"must be는 '~임에 틀림없다'라는 뜻이라 '슬플 것이 틀림없다', 즉 '슬프겠네요'예요. 곰 인형이 찢어졌으니 의사가 Emily의 마음을 알아주는 말이에요.","c":2},"h":"abdc895b95"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The doctor will first ask about how Ted looked.","Emily will do the surgery for Ted herself.","Emily will not be able to play with Ted again.","The doctor already fixed Ted yesterday."],"oko":["의사는 먼저 Ted가 어떻게 생겼었는지 물어볼 것이다.","Emily가 직접 Ted의 수술을 할 것이다.","Emily는 다시는 Ted와 놀 수 없을 것이다.","의사는 어제 이미 Ted를 고쳤다."],"r":{"a":"1) The doctor will first ask about how Ted looked.","ev":"11번 문장","s":[[11,"First, I’m going to ask you about his appearance when you first met him.","우선, 저는 당신에게 그를 처음 만났을 때의 그의 생김새에 대해 물어볼 거예요."]],"w":"11번에서 의사는 먼저(First) Ted를 처음 만났을 때의 생김새를 물어볼 거라고 해요. 수술은 의사가 하고(13번), Emily는 곧 Ted와 놀 수 있으며(18번), 어제는 강아지가 Ted를 찢은 날이에요(5번).","c":1},"h":"64b7f4a3a8"},{"n":9,"t":"sum","q":"The doctor will do a surgery to (A) Ted, and Emily will be able to (B) with him soon.","ko":"의사는 Ted를 (A)하려고 수술을 할 것이고, Emily는 곧 그와 (B)할 수 있을 것이다.","opts":["(A) fix / (B) sleep","(A) break / (B) play","(A) fix / (B) play","(A) lose / (B) play","(A) buy / (B) study"],"oko":["(A) 고치다 / (B) 자다","(A) 부수다 / (B) 놀다","(A) 고치다 / (B) 놀다","(A) 잃어버리다 / (B) 놀다","(A) 사다 / (B) 공부하다"],"r":{"a":"3) (A) fix / (B) play","ev":"13번, 18번 문장","s":[[13,"Next, I will do a surgery.","그다음에, 저는 수술을 할 거예요."],[18,"And you will be able to play with him soon!","그리고 당신은 곧 그와 함께 놀 수 있을 거예요!"]],"w":"13번에서 의사가 수술을 하고, 18번에서 Emily가 곧 Ted와 함께 놀 수 있다고 해요. 수술은 Ted를 고치기 위한 것이에요(fix).","c":3},"h":"34b8cf2be3"},{"n":10,"t":"fill","q":"The doctor will use special [A] like thread and [B].","ko":"의사는 실과 [B] 같은 특별한 [A]을 사용할 것이다.","bank":["tools","needles","gloves","mask","photos","plan"],"bko":{"tools":"도구","needles":"바늘","gloves":"장갑","mask":"마스크","photos":"사진","plan":"계획"},"r":{"a":"[A] tools, [B] needles","ev":"15번 문장","s":[[15,"I will use special tools like thread and needles.","저는 실과 바늘과 같은 특별한 도구들을 사용할 거예요."]],"w":"15번에서 I will use special tools like thread and needles라고 해요. 장갑과 마스크는 14번에서 입고 쓰는 것이라 이 문장의 빈칸에 맞지 않아요.","c":null},"h":"0d9aaaaedd"}]},{"u":4,"id":"hs1-04-3","no":3,"ko":"알레그로, 크레셴도!","items":[{"n":1,"t":"tf","q":"The words orchestra and opera came from Italian.","ko":"orchestra와 opera라는 단어는 이탈리아어에서 유래했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But they actually came from Italian!","하지만 그것들은 사실 이탈리아어에서 유래했다!"]],"w":"3번 문장에서 they(orchestra와 opera)는 사실 이탈리아어에서 유래했다고 해요. 영어 단어라는 생각(2번)은 틀린 생각이에요.","c":"T"},"h":"8f51258f5c"},{"n":2,"t":"tf","q":"Italians used English words on music scores.","ko":"이탈리아인들은 음악 악보에 영어 단어를 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"They used Italian words on music scores to describe the changes in speed and volume of music.","그들은 음악의 속도와 음량의 변화를 묘사하기 위해 음악 악보에 이탈리아어 단어들을 사용했다."]],"w":"8번 문장에서 이탈리아인들은 악보에 Italian words(이탈리아어 단어들)를 사용했다고 해요. 영어 단어가 아니에요.","c":"F"},"h":"4c203e2615"},{"n":3,"t":"tf","q":"Concerto and sonata are Italian names.","ko":"콘체르토와 소나타는 이탈리아어 이름이다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"They gave them Italian names, such as concerto and sonata.","그들은 그것들에 ‘콘체르토’와 ‘소나타’와 같은 이탈리아어 이름을 주었다."]],"w":"11번 문장에서 작곡가들은 악곡들에 이탈리아어 이름을 주었고, 그 예가 concerto와 sonata예요.","c":"T"},"h":"c6350f54ff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They used Italian words on music scores to describe the changes in speed and volume of music.)","ko":"그들은 음악의 속도와 음량의 변화를 묘사하기 위해 음악 악보에 이탈리아어 단어들을 사용했다. (describe는 묘사하다)","opts":["숨기다","묘사하다","잊다","팔다"],"word":"describe","r":{"a":"2) 묘사하다","ev":"8~9번 문장","s":[[8,"They used Italian words on music scores to describe the changes in speed and volume of music.","그들은 음악의 속도와 음량의 변화를 묘사하기 위해 음악 악보에 이탈리아어 단어들을 사용했다."],[9,"For example, they used allegro (fast) and crescendo (louder).","예를 들어, 그들은 ‘알레그로(빠르게)’와 ‘크레셴도(더 크게)’를 사용했다."]],"w":"악보에 쓴 allegro(빠르게), crescendo(더 크게) 같은 단어는 속도와 음량의 변화를 '나타내는' 말이에요. 그래서 describe는 '묘사하다'예요.","c":2},"h":"0dc0d0d4fa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He created the modern system of writing down music around 1026.)","ko":"그는 1026년쯤 음악을 기록하는 현대의 시스템을 만들었다. (modern은 현대의)","opts":["오래된","작은","비싼","현대의"],"word":"modern","r":{"a":"4) 현대의","ev":"5~6번 문장","s":[[5,"It all started with the Italian monk Guido d’Arezzo.","그것은 모두 이탈리아의 수도승 Guido d’Arezzo로부터 시작했다."],[6,"He created the modern system of writing down music around 1026.","그는 1026년쯤 음악을 기록하는 현대의 시스템을 만들었다."]],"w":"6번은 Guido가 만든 시스템을 the modern system(현대의 시스템)이라고 소개해요. old(오래된)와 반대 방향의 말이에요. modern = 현대의.","c":4},"h":"bdb1b4a9e2"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey gave them Italian names, such as concerto and sonata.","ko":"밑줄 친 them이 가리키는 것은?","opts":["이탈리아어 단어들","이탈리아 작곡가들","새로운 유형의 악곡들","음악 악보들"],"sko":"그들은 그것들에 ‘콘체르토’와 ‘소나타’와 같은 이탈리아어 이름을 주었다.","r":{"a":"3) 새로운 유형의 악곡들","ev":"10~11번 문장","s":[[10,"Also, Italian composers created new types of compositions.","또한, 이탈리아 작곡가들은 새로운 유형의 악곡들을 창작했다."],[11,"They gave them Italian names, such as concerto and sonata.","그들은 그것들에 ‘콘체르토’와 ‘소나타’와 같은 이탈리아어 이름을 주었다."]],"w":"11번의 They는 작곡가들이고, them은 그들이 창작한 new types of compositions(새로운 유형의 악곡들)예요. 악곡들에 concerto, sonata 같은 이름을 준 거예요.","c":3},"h":"384f547e20"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Later, other Italians used this system, too.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["나중에 다른 이탈리아인들도 이 시스템을 사용했다.","나중에 다른 이탈리아인들은 이 시스템을 거부했다.","나중에 이탈리아인들이 새로운 시스템을 만들었다.","나중에 이 시스템은 영어를 쓰는 나라에서만 사용되었다."],"sko":"나중에, 다른 이탈리아인들 또한 이 시스템을 사용했다.","r":{"a":"1) 나중에 다른 이탈리아인들도 이 시스템을 사용했다.","ev":"7번 문장","s":[[7,"Later, other Italians used this system, too.","나중에, 다른 이탈리아인들 또한 이 시스템을 사용했다."]],"w":"Later는 '나중에', other Italians는 '다른 이탈리아인들', too는 '또한'이에요. 6번에서 Guido가 만든 시스템을 다른 이탈리아인들도 사용했다는 뜻이에요.","c":1},"h":"2ed87246f6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Guido d’Arezzo created the modern system around 1926.","Allegro means fast and crescendo means louder.","Allegro means slow and crescendo means quieter.","Composers gave English names to concerto and sonata."],"oko":["Guido d’Arezzo는 1926년쯤 현대의 시스템을 만들었다.","알레그로는 빠르게, 크레셴도는 더 크게라는 뜻이다.","알레그로는 느리게, 크레셴도는 더 작게라는 뜻이다.","작곡가들은 콘체르토와 소나타에 영어 이름을 주었다."],"r":{"a":"2) Allegro means fast and crescendo means louder.","ev":"9번 문장","s":[[9,"For example, they used allegro (fast) and crescendo (louder).","예를 들어, 그들은 ‘알레그로(빠르게)’와 ‘크레셴도(더 크게)’를 사용했다."]],"w":"9번에서 allegro는 fast(빠르게), crescendo는 louder(더 크게)라고 해요. Guido는 1026년쯤(6번)이고, 이름은 이탈리아어 이름이에요(11번).","c":2},"h":"a372c48d9d"},{"n":9,"t":"sum","q":"An Italian monk (A) the modern system of writing down music, and other (B) used it later.","ko":"이탈리아의 한 수도승이 음악을 기록하는 현대의 시스템을 (A)했고, 나중에 다른 (B)도 그것을 사용했다.","opts":["(A) lost / (B) Italians","(A) created / (B) English people","(A) destroyed / (B) composers","(A) sold / (B) monks","(A) created / (B) Italians"],"oko":["(A) 잃어버렸다 / (B) 이탈리아인들","(A) 만들었다 / (B) 영국 사람들","(A) 파괴했다 / (B) 작곡가들","(A) 팔았다 / (B) 수도승들","(A) 만들었다 / (B) 이탈리아인들"],"r":{"a":"5) (A) created / (B) Italians","ev":"5~7번 문장","s":[[5,"It all started with the Italian monk Guido d’Arezzo.","그것은 모두 이탈리아의 수도승 Guido d’Arezzo로부터 시작했다."],[6,"He created the modern system of writing down music around 1026.","그는 1026년쯤 음악을 기록하는 현대의 시스템을 만들었다."],[7,"Later, other Italians used this system, too.","나중에, 다른 이탈리아인들 또한 이 시스템을 사용했다."]],"w":"6번에서 수도승 Guido가 시스템을 만들었고(created), 7번에서 다른 이탈리아인들(Italians)도 그것을 사용했다고 해요.","c":5},"h":"5979f977d8"},{"n":10,"t":"fill","q":"Italians used words on music scores to describe changes in [A] and volume, like allegro and [B].","ko":"이탈리아인들은 [A]와 음량의 변화를 묘사하려고 악보에 단어를 사용했고, 알레그로와 [B] 같은 말이 그 예이다.","bank":["speed","crescendo","sonata","history","opera","language"],"bko":{"speed":"속도","crescendo":"크레셴도(더 크게)","sonata":"소나타","history":"역사","opera":"오페라","language":"언어"},"r":{"a":"[A] speed, [B] crescendo","ev":"8~9번 문장","s":[[8,"They used Italian words on music scores to describe the changes in speed and volume of music.","그들은 음악의 속도와 음량의 변화를 묘사하기 위해 음악 악보에 이탈리아어 단어들을 사용했다."],[9,"For example, they used allegro (fast) and crescendo (louder).","예를 들어, 그들은 ‘알레그로(빠르게)’와 ‘크레셴도(더 크게)’를 사용했다."]],"w":"8번에서 이탈리아어는 속도(speed)와 음량(volume)의 변화를 묘사하는 데 쓰였고, 9번에서 그 예로 allegro와 crescendo가 나와요. sonata는 11번에서 악곡의 이름이에요.","c":null},"h":"255593163c"}]},{"u":5,"id":"hs1-05-1","no":1,"ko":"또 낚였네, 낚였어!","items":[{"n":1,"t":"tf","q":"Many websites use clickbait to get more visitors and make more money.","ko":"많은 웹사이트들은 더 많은 방문자와 더 많은 돈을 얻으려고 낚시성 링크를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6~7번 문장","s":[[6,"Many websites use clickbait.","많은 웹사이트들이 낚시성 링크를 사용한다."],[7,"They use it to attract more visitors and make more money.","그들은 더 많은 방문자를 끌어들이고 더 많은 돈을 벌기 위해 그것을 사용한다."]],"w":"6번에서 많은 웹사이트가 clickbait를 쓴다고 하고, 7번에서 더 많은 방문자를 끌어들이고 더 많은 돈을 벌기 위해서라고 해요.","c":"T"},"h":"f06f43d659"},{"n":2,"t":"tf","q":"After you click a clickbait link, the content is always related to the title.","ko":"낚시성 링크를 클릭하면, 내용은 항상 제목과 관련이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"When you click the link, you’ll see that the content is not related to the title.","그 링크를 클릭하면, 당신은 내용이 제목과 관련이 없다는 것을 알게 될 것이다."]],"w":"9번에서 클릭하면 내용이 제목과 관련이 없다는 것을 알게 될 것이라고 해요. '항상 관련이 있다'는 반대 내용이에요.","c":"F"},"h":"9abc76ce27"},{"n":3,"t":"tf","q":"A virus could be installed on your computer after you click a clickbait link.","ko":"낚시성 링크를 클릭한 뒤 당신의 컴퓨터에 바이러스가 설치될 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"A virus could even be installed on your computer.","심지어 당신의 컴퓨터에 바이러스가 설치될 수도 있다."]],"w":"11번에 A virus could even be installed on your computer가 있어요. 심지어 컴퓨터에 바이러스가 설치될 수도 있다는 뜻이에요.","c":"T"},"h":"c01fe75670"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They use it to attract more visitors ...)","ko":"그들은 더 많은 방문자를 ~하려고 그것을 사용한다. (attract는 끌어들이다)","opts":["쫓아내다","숨기다","끌어들이다","잃다"],"word":"attract","r":{"a":"3) 끌어들이다","ev":"7번 문장","s":[[7,"They use it to attract more visitors and make more money.","그들은 더 많은 방문자를 끌어들이고 더 많은 돈을 벌기 위해 그것을 사용한다."]],"w":"웹사이트가 낚시성 링크를 쓰는 이유가 더 많은 방문자와 돈이에요. 그러니 방문자를 '끌어들이다'가 맞아요. attract = 끌어들이다.","c":3},"h":"95f89090e3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (And unwanted advertisements might pop up.)","ko":"그리고 ~ 광고들이 나타날 수 있다. (unwanted는 원하지 않는)","opts":["값비싼","원치 않는","재미있는","새로운"],"word":"unwanted","r":{"a":"2) 원치 않는","ev":"10번 문장","s":[[10,"And unwanted advertisements might pop up.","그리고 원치 않는 광고들이 나타날 수 있다."]],"w":"클릭했을 때 생기는 나쁜 일을 말하는 문장이에요. want(원하다)에 un-이 붙어서 unwanted는 '원치 않는'이에요.","c":2},"h":"94f99b59a2"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey use it to attract more visitors and make more money.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 더 많은 방문자를 끌어들이고 더 많은 돈을 벌기 위해 그것을 사용한다.","opts":["헤드라인들","방문자들","광고들","많은 웹사이트들"],"r":{"a":"4) 많은 웹사이트들","ev":"6~7번 문장","s":[[6,"Many websites use clickbait.","많은 웹사이트들이 낚시성 링크를 사용한다."],[7,"They use it to attract more visitors and make more money.","그들은 더 많은 방문자를 끌어들이고 더 많은 돈을 벌기 위해 그것을 사용한다."]],"w":"6번에서 Many websites use clickbait라고 했고, 7번에서 They가 그 웹사이트들을 받아요. 방문자는 끌어들이는 대상이에요.","c":4},"h":"287b119084"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So if a headline seems too good, do not click it!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러므로 헤드라인이 너무 좋게 보인다면, 그것을 클릭하지 말아라!","opts":["너무 좋아 보이는 헤드라인은 클릭하지 말아야 한다.","헤드라인이 좋을수록 더 빨리 클릭해야 한다.","헤드라인은 너무 길게 쓰면 안 된다.","좋은 헤드라인은 클릭하기 전에 저장해 두어야 한다."],"r":{"a":"1) 너무 좋아 보이는 헤드라인은 클릭하지 말아야 한다.","ev":"12번 문장","s":[[12,"So if a headline seems too good, do not click it!","그러므로 헤드라인이 너무 좋게 보인다면, 그것을 클릭하지 말아라!"]],"w":"too good은 '너무 좋은'이고 do not click it은 '그것을 클릭하지 말아라'예요. 나머지 선지는 본문에 없는 내용이에요.","c":1},"h":"94d277fd56"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["낚시성 링크는 학생들이 공부하도록 돕는 광고이다.","낚시성 링크는 항상 제목과 관련이 있다.","낚시성 링크는 헤드라인으로 바로 당신의 관심을 끈다.","낚시성 링크는 인터넷에서 찾기 어렵다."],"opts":["Clickbait is an ad that helps students study.","Clickbait is always related to its title.","Clickbait grabs your attention right away with a headline.","Clickbait is hard to find on the Internet."],"r":{"a":"3) Clickbait grabs your attention right away with a headline.","ev":"5번 문장","s":[[5,"Clickbait grabs your attention right away with a headline.","낚시성 링크는 헤드라인으로 바로 당신의 관심을 끈다."]],"w":"5번에서 clickbait는 헤드라인으로 바로 관심을 끈다고 해요. 공부를 도와주지도 않고(1번 선지), 내용은 제목과 관련이 없고(9번), 찾기 어렵다는 말도 없어요.","c":3},"h":"7cafcb3113"},{"n":9,"t":"sum","q":"A clickbait headline sounds very (A), but the content is (B) the title.","ko":"낚시성 링크의 헤드라인은 매우 (A)하게 들리지만, 내용은 제목과 (B).","oko":["(A) 지루한 / (B) 관련이 있다","(A) 좋은 / (B) 관련이 없다","(A) 무서운 / (B) 같다","(A) 좋은 / (B) 비슷하다","(A) 긴 / (B) 관련이 없다"],"opts":["(A) boring / (B) related to","(A) good / (B) not related to","(A) scary / (B) the same as","(A) good / (B) similar to","(A) long / (B) not related to"],"r":{"a":"2) (A) good / (B) not related to","ev":"9번, 12번 문장","s":[[9,"When you click the link, you’ll see that the content is not related to the title.","그 링크를 클릭하면, 당신은 내용이 제목과 관련이 없다는 것을 알게 될 것이다."],[12,"So if a headline seems too good, do not click it!","그러므로 헤드라인이 너무 좋게 보인다면, 그것을 클릭하지 말아라!"]],"w":"12번에서 헤드라인이 too good(너무 좋은)이라고 하고, 9번에서 내용이 제목과 관련이 없다고 해요. 그래서 (A) good, (B) not related to예요.","c":2},"h":"4347cff9d0"},{"n":10,"t":"fill","q":"Clicking a clickbait link can bring [A] advertisements, and a [B] could even be installed on your computer.","ko":"낚시성 링크를 클릭하면 [A] 광고가 나타나고, 심지어 컴퓨터에 [B]가 설치될 수도 있다.","bank":["unwanted","virus","visitors","headline","money","title"],"bko":{"unwanted":"원치 않는","virus":"바이러스","visitors":"방문자들","headline":"헤드라인","money":"돈","title":"제목"},"r":{"a":"[A] unwanted, [B] virus","ev":"10~11번 문장","s":[[10,"And unwanted advertisements might pop up.","그리고 원치 않는 광고들이 나타날 수 있다."],[11,"A virus could even be installed on your computer.","심지어 당신의 컴퓨터에 바이러스가 설치될 수도 있다."]],"w":"10번에서 unwanted advertisements(원치 않는 광고)가 나타나고, 11번에서 컴퓨터에 virus(바이러스)가 설치될 수 있다고 해요. visitors, money는 7번에서 웹사이트가 얻고 싶은 것이에요.","c":null},"h":"7d01b5be0d"}]},{"u":5,"id":"hs1-05-2","no":2,"ko":"모기의 숨겨진 비밀","items":[{"n":1,"t":"tf","q":"A mosquito bites you with only one long needle.","ko":"모기는 한 개의 긴 바늘만으로 당신을 문다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"You might think it used one long needle to bite you.","당신은 그것이 당신을 물기 위해 한 개의 긴 바늘을 사용했다고 생각할지도 모른다."],[3,"But a mosquito’s mouth is actually hiding six needles inside!","하지만 모기의 입은 사실 안에 여섯 개의 바늘을 숨기고 있다!"]],"w":"2번의 '한 개의 긴 바늘'은 그렇게 생각할지도 모른다는 생각일 뿐이고, 3번에서 모기의 입 안에는 사실 여섯 개의 바늘이 있다고 해요.","c":"F"},"h":"ab10741aa0"},{"n":2,"t":"tf","q":"Two needles are like drills and make a hole in the skin.","ko":"두 개의 바늘은 드릴 같으며 피부에 구멍을 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"Two are like drills.","두 개는 드릴 같다."],[6,"They make a hole in the skin to find blood vessels.","그것들은 혈관을 찾기 위해 피부에 구멍을 만든다."]],"w":"5번에서 두 개는 드릴 같다고 하고, 6번에서 그 두 개가 혈관을 찾기 위해 피부에 구멍을 만든다고 해요.","c":"T"},"h":"049646c602"},{"n":3,"t":"tf","q":"The mosquito’s saliva makes the bite less itchy.","ko":"모기의 타액은 물린 곳을 덜 간지럽게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"The mosquito’s saliva makes a bump on your skin.","모기의 타액은 당신의 피부에 혹을 만든다."],[12,"It also makes the bite so itchy!","그것은 또한 물린 상처를 매우 간지럽게 만든다!"]],"w":"12번에서 모기의 타액은 물린 곳을 so itchy(매우 간지럽게) 만든다고 해요. 덜 간지럽다는 말은 반대예요.","c":"F"},"h":"a8af74033c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then, the fifth needle sucks up the blood.)","ko":"그러고 나서, 다섯 번째 바늘은 피를 ~한다. (suck up은 빨아 먹다)","opts":["뿜어낸다","던진다","빨아 먹는다","자른다"],"word":"sucks","r":{"a":"3) 빨아 먹는다","ev":"8~9번 문장","s":[[8,"Then, the fifth needle sucks up the blood.","그러고 나서, 다섯 번째 바늘은 피를 빨아 먹는다."],[9,"It is just like a straw!","그것은 마치 빨대 같다!"]],"w":"바로 뒤 9번에서 빨대(straw) 같다고 했어요. 빨대로 하는 일이니 피를 '빨아 먹는다'가 맞아요. suck = 빨아 먹다.","c":3},"h":"65f5b01fac"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It also makes the bite so itchy!)","ko":"그것은 또한 물린 상처를 매우 ~하게 만든다. (itchy는 간지러운)","opts":["간지러운","차가운","딱딱한","시끄러운"],"word":"itchy","r":{"a":"1) 간지러운","ev":"12번 문장","s":[[12,"It also makes the bite so itchy!","그것은 또한 물린 상처를 매우 간지럽게 만든다!"]],"w":"모기에 물린 곳은 간질간질해요. 물린 상처를 itchy하게 만든다는 말이니 '간지러운'이에요.","c":1},"h":"8a78cd30f5"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nThe last one puts the mosquito’s saliva into your body.","ko":"밑줄 친 one이 가리키는 것은?","sko":"마지막 것은 모기의 타액을 당신의 몸에 넣는다.","opts":["모기","바늘","피","구멍"],"r":{"a":"2) 바늘","ev":"4번, 10번 문장","s":[[4,"Each needle has a special purpose.","각각의 바늘은 특별한 용도를 가지고 있다."],[10,"The last one puts the mosquito’s saliva into your body.","마지막 것은 모기의 타액을 당신의 몸에 넣는다."]],"w":"The last one은 '마지막 바늘'이에요. 4번의 Each needle에서 needle이 나왔고, 같은 말을 반복하지 않으려고 one을 썼어요.","c":2},"h":"92711e9a21"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Another pair keeps this hole open.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다른 한 쌍은 이 구멍을 계속 열려 있게 한다.","opts":["두 쌍의 바늘이 구멍을 파고 있다.","다른 한 쌍이 이 구멍을 닫아 버린다.","다른 한 쌍이 새 구멍을 하나 더 만든다.","다른 한 쌍이 이 구멍을 계속 열려 있게 한다."],"r":{"a":"4) 다른 한 쌍이 이 구멍을 계속 열려 있게 한다.","ev":"7번 문장","s":[[7,"Another pair keeps this hole open.","다른 한 쌍은 이 구멍을 계속 열려 있게 한다."]],"w":"keep + 구멍 + open은 '구멍을 열린 상태로 계속 있게 하다'예요. 닫는다(2번 선지)나 새 구멍을 만든다(3번 선지)는 말은 없어요.","c":4},"h":"f815abf6a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마지막 바늘은 타액을 당신의 몸에 넣는다.","두 개의 바늘은 빨대 같다.","여섯 개의 바늘 모두가 혈관을 찾는 데 쓰인다.","타액은 물린 곳을 덜 간지럽게 만든다."],"opts":["The last needle puts saliva into your body.","Two needles are like straws.","All six needles are used to find blood vessels.","The saliva makes the bite less itchy."],"r":{"a":"1) The last needle puts saliva into your body.","ev":"10번 문장","s":[[10,"The last one puts the mosquito’s saliva into your body.","마지막 것은 모기의 타액을 당신의 몸에 넣는다."]],"w":"10번에서 마지막 바늘이 모기의 타액을 우리 몸에 넣는다고 해요. 빨대 같은 것은 다섯 번째 바늘이고(9번), 혈관을 찾는 것은 드릴 같은 두 개이고(5~6번), 타액은 오히려 더 간지럽게 해요(12번).","c":1},"h":"cdf920da35"},{"n":9,"t":"sum","q":"A mosquito’s mouth has six (A). Each one has a different (B), such as making a hole, sucking blood, and putting in saliva.","ko":"모기의 입에는 여섯 개의 (A)가 있다. 각각은 구멍 만들기, 피 빨기, 타액 넣기 같은 서로 다른 (B)이 있다.","oko":["(A) 날개 / (B) 색깔","(A) 바늘 / (B) 크기","(A) 바늘 / (B) 용도","(A) 구멍 / (B) 용도","(A) 빨대 / (B) 속도"],"opts":["(A) wings / (B) color","(A) needles / (B) size","(A) needles / (B) purpose","(A) holes / (B) purpose","(A) straws / (B) speed"],"r":{"a":"3) (A) needles / (B) purpose","ev":"3~4번 문장","s":[[3,"But a mosquito’s mouth is actually hiding six needles inside!","하지만 모기의 입은 사실 안에 여섯 개의 바늘을 숨기고 있다!"],[4,"Each needle has a special purpose.","각각의 바늘은 특별한 용도를 가지고 있다."]],"w":"3번에서 입 안에 여섯 개의 needles가 있다고 하고, 4번에서 각각 special purpose(특별한 용도)가 있다고 해요.","c":3},"h":"d8fa3aac5b"},{"n":10,"t":"fill","q":"The mosquito’s saliva makes a [A] on your skin and makes the bite so [B].","ko":"모기의 타액은 당신의 피부에 [A]을 만들고 물린 곳을 매우 [B]하게 만든다.","bank":["bump","itchy","needle","blood","straw","hole"],"bko":{"bump":"혹","itchy":"간지러운","needle":"바늘","blood":"피","straw":"빨대","hole":"구멍"},"r":{"a":"[A] bump, [B] itchy","ev":"11~12번 문장","s":[[11,"The mosquito’s saliva makes a bump on your skin.","모기의 타액은 당신의 피부에 혹을 만든다."],[12,"It also makes the bite so itchy!","그것은 또한 물린 상처를 매우 간지럽게 만든다!"]],"w":"11번에서 타액이 피부에 a bump(혹)를 만들고, 12번에서 물린 곳을 so itchy(매우 간지럽게) 만든다고 해요. hole은 6번에서 드릴 같은 바늘이 만드는 구멍이에요.","c":null},"h":"fc8c8f0c58"}]},{"u":5,"id":"hs1-05-3","no":3,"ko":"간질간질, 찌릿찌릿!","items":[{"n":1,"t":"tf","q":"The “funny bone” is actually a nerve, not a bone.","ko":"‘funny bone’은 뼈가 아니라 사실 신경이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6~7번 문장","s":[[6,"It is not a bone.","그것은 뼈가 아니다."],[7,"It is actually a nerve.","그것은 사실 신경이다."]],"w":"6번에서 뼈가 아니라고 하고, 7번에서 사실은 신경이라고 해요.","c":"T"},"h":"ceb5810951"},{"n":2,"t":"tf","q":"Most nerves in the body are not protected by anything.","ko":"신체의 대부분의 신경은 그 어떤 것에 의해서도 보호받지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Most nerves in the body are protected by fat or muscle.","신체의 대부분의 신경은 지방이나 근육에 의해 보호받는다."]],"w":"10번에서 대부분의 신경은 지방이나 근육에 의해 보호받는다고 해요. 아무것에도 보호받지 않는 것은 자신경이에요(11번).","c":"F"},"h":"a36292b8ec"},{"n":3,"t":"tf","q":"When you hit the spot, the ulnar nerve is pressed against the bone near it.","ko":"그곳을 부딪치면, 자신경이 근처의 뼈에 눌린다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"So when you hit this spot, the nerve is directly pressed against the nearby bone.","그래서 당신이 이곳을 부딪치면, 그 신경이 근처의 뼈에 직접적으로 눌린다."]],"w":"12번에서 이곳을 부딪치면 신경이 근처의 뼈에 직접적으로 눌린다고 해요.","c":"T"},"h":"1438028d1b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It controls the movement of your hands.)","ko":"그것은 당신의 손의 움직임을 ~한다. (controls는 통제하다)","opts":["만든다","통제한다","느낀다","부러뜨린다"],"word":"controls","r":{"a":"2) 통제한다","ev":"9번 문장","s":[[9,"It controls the movement of your hands.","그것은 당신의 손의 움직임을 통제한다."]],"w":"자신경이 손의 움직임에 대해 하는 일이에요. 움직임을 다스리고 조절하니 '통제한다'가 맞아요. control = 통제하다.","c":2},"h":"adb98b1c85"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But the nerve pain usually disappears quickly!)","ko":"하지만 그 신경통은 보통 빨리 ~한다. (disappears는 사라지다)","opts":["나타난다","커진다","변한다","사라진다"],"word":"disappears","r":{"a":"4) 사라진다","ev":"14번 문장","s":[[14,"But the nerve pain usually disappears quickly!","하지만 그 신경통은 보통 빨리 사라진다!"]],"w":"13번에서 아플 수 있다고 한 뒤 But으로 반대 이야기를 해요. 통증이 빨리 '사라진다'는 뜻이에요. disappear = 사라지다.","c":4},"h":"88aa77f019"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt controls the movement of your hands.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 당신의 손의 움직임을 통제한다.","opts":["자신경","팔꿈치","책상 가장자리","전기 충격"],"r":{"a":"1) 자신경","ev":"8~9번 문장","s":[[8,"It’s called the ulnar nerve.","그것은 자신경이라고 불린다."],[9,"It controls the movement of your hands.","그것은 당신의 손의 움직임을 통제한다."]],"w":"8번 It’s called the ulnar nerve의 It이 funny bone이고 이름이 자신경이에요. 9번의 It도 같은 자신경이에요.","c":1},"h":"aee851a029"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, the ulnar nerve is not protected by anything.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 자신경은 그 어떤 것에 의해서도 보호받지 않는다.","opts":["자신경은 지방과 근육이 모두 보호해 준다.","자신경은 다른 신경보다 훨씬 많이 보호받는다.","자신경은 그 어떤 것으로도 보호받지 않는다.","자신경은 아무것도 보호하지 않는다."],"r":{"a":"3) 자신경은 그 어떤 것으로도 보호받지 않는다.","ev":"11번 문장","s":[[11,"However, the ulnar nerve is not protected by anything.","하지만, 자신경은 그 어떤 것에 의해서도 보호받지 않는다."]],"w":"is not protected by anything은 '그 어떤 것에 의해서도 보호받지 않는다'예요. 10번에서 대부분의 신경은 지방이나 근육의 보호를 받는다고 했으니 반대 이야기가 이어져요.","c":3},"h":"ed54269c81"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["자신경은 당신의 팔에 있는 뼈이다.","funny bone을 부딪쳐서 생긴 신경통은 보통 빨리 사라진다.","지방이 자신경을 보호한다.","funny bone은 쉽게 부러진다."],"opts":["The ulnar nerve is a bone in your arm.","The nerve pain from the funny bone usually goes away quickly.","Fat protects the ulnar nerve.","The funny bone breaks easily."],"r":{"a":"2) The nerve pain from the funny bone usually goes away quickly.","ev":"14번 문장","s":[[14,"But the nerve pain usually disappears quickly!","하지만 그 신경통은 보통 빨리 사라진다!"]],"w":"14번에서 신경통은 보통 빨리 사라진다고 해요. 자신경은 뼈가 아니고(6~7번), 지방은 자신경을 보호하지 않고(11번), funny bone은 절대 부러지지 않아요(5번).","c":2},"h":"856a170b69"},{"n":9,"t":"sum","q":"When you hit your “funny bone”, you feel a light electric shock, because it is actually a (A), not a (B).","ko":"‘funny bone’을 부딪치면 가벼운 전기 충격 같은 느낌이 드는 것은, 그것이 사실 (B)가 아니라 (A)이기 때문이다.","oko":["(A) 뼈 / (B) 신경","(A) 근육 / (B) 뼈","(A) 지방 / (B) 신경","(A) 신경 / (B) 뼈","(A) 신경 / (B) 근육"],"opts":["(A) bone / (B) nerve","(A) muscle / (B) bone","(A) fat / (B) nerve","(A) nerve / (B) bone","(A) nerve / (B) muscle"],"r":{"a":"4) (A) nerve / (B) bone","ev":"3번, 6~7번 문장","s":[[3,"It is like a light electric shock.","그것은 가벼운 전기 충격 같다."],[6,"It is not a bone.","그것은 뼈가 아니다."],[7,"It is actually a nerve.","그것은 사실 신경이다."]],"w":"3번에서 가벼운 전기 충격 같다고 하고, 6~7번에서 뼈(bone)가 아니라 신경(nerve)이라고 해요.","c":4},"h":"278b4fc3a1"},{"n":10,"t":"fill","q":"The ulnar nerve is not [A] by anything, so when you hit this spot, the nerve is directly [B] against the nearby bone.","ko":"자신경은 그 어떤 것에도 [A]받지 않아서, 이곳을 부딪치면 신경이 근처의 뼈에 직접적으로 [B].","bank":["protected","pressed","controlled","broken","nearby","painful"],"bko":{"protected":"보호받는","pressed":"눌리는","controlled":"통제되는","broken":"부러진","nearby":"근처의","painful":"고통스러운"},"r":{"a":"[A] protected, [B] pressed","ev":"11~12번 문장","s":[[11,"However, the ulnar nerve is not protected by anything.","하지만, 자신경은 그 어떤 것에 의해서도 보호받지 않는다."],[12,"So when you hit this spot, the nerve is directly pressed against the nearby bone.","그래서 당신이 이곳을 부딪치면, 그 신경이 근처의 뼈에 직접적으로 눌린다."]],"w":"11번에서 자신경은 not protected(보호받지 않는다)이고, 12번에서 그래서 신경이 뼈에 directly pressed(직접 눌린다)고 해요. broken은 5번에서 funny bone이 절대 부러지지 않는다는 말에 나와요.","c":null},"h":"d0bf6d84d7"}]},{"u":6,"id":"hs1-06-1","no":1,"ko":"소원을 빌어봐요","items":[{"n":1,"t":"tf","q":"A shooting star is a real star in space.","ko":"별똥별은 우주에 있는 진짜 별이다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"But unlike its name, a shooting star is not a star.","그러나 그것의 이름과 달리, 별똥별은 별이 아니다."]],"w":"2번 문장에서 별똥별은 별이 아니라고(is not a star) 했어요. 진짜 별이라는 말은 반대예요.","c":"F"},"h":"9cbd25955f"},{"n":2,"t":"tf","q":"A piece of dust causes friction when it enters Earth’s atmosphere.","ko":"먼지 조각은 지구의 대기로 들어갈 때 마찰을 일으킨다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"When a piece of dust enters Earth’s atmosphere, it causes friction.","먼지 조각이 지구의 대기로 들어갈 때, 그것은 마찰을 일으킨다."]],"w":"4번 문장에 When a piece of dust enters Earth’s atmosphere, it causes friction이 그대로 나와요.","c":"T"},"h":"471c6eb7c2"},{"n":3,"t":"tf","q":"Many shooting stars fall at once only three times every year.","ko":"많은 별똥별들이 한 번에 떨어지는 일은 매년 세 번뿐이다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"Sometimes, many shooting stars fall at once.","때때로, 많은 별똥별들이 한 번에 떨어진다."],[10,"This happens about 30 times every year.","이것은 매년 약 30번 발생한다."]],"w":"10번 문장에서 이런 일은 매년 약 30번(about 30 times) 일어난다고 했어요. 세 번이 아니에요.","c":"F"},"h":"47bd296f32"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (it causes friction)","ko":"마찰을 일으킨다 (friction은 어떤 뜻?)","opts":["속도","온도","마찰","무게"],"word":"friction","r":{"a":"3) 마찰","ev":"4번 문장","s":[[4,"When a piece of dust enters Earth’s atmosphere, it causes friction.","먼지 조각이 지구의 대기로 들어갈 때, 그것은 마찰을 일으킨다."]],"w":"먼지 조각이 대기로 들어갈 때 생기는 것이 friction이에요. 이 마찰 때문에 먼지가 타서 번쩍여요. friction = 마찰.","c":3},"h":"140dd64282"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It burns up and produces a bright flash in the sky.)","ko":"그것은 타버리고 하늘에 밝은 번쩍임을 (produce는 어떤 뜻?)","opts":["만들어 낸다","없앤다","가린다","따라간다"],"word":"produces","r":{"a":"1) 만들어 낸다","ev":"5번 문장","s":[[5,"It burns up and produces a bright flash in the sky.","그것은 타버리고 하늘에 밝은 번쩍임을 만들어 낸다."]],"w":"타버리는 먼지 조각이 밝은 번쩍임을 '만들어 내는' 거예요. produce = 만들어 내다.","c":1},"h":"1fda71549d"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen a piece of dust enters Earth’s atmosphere, it causes friction.","ko":"밑줄 친 it이 가리키는 것은?","opts":["지구의 대기","먼지 조각","우주 암석","별똥별 달력"],"sko":"먼지 조각이 지구의 대기로 들어갈 때, 그것은 마찰을 일으킨다.","r":{"a":"2) 먼지 조각","ev":"3~4번 문장","s":[[3,"In space, small pieces of dust fall from space rocks.","우주에서, 작은 먼지 조각들이 우주 암석으로부터 떨어진다."],[4,"When a piece of dust enters Earth’s atmosphere, it causes friction.","먼지 조각이 지구의 대기로 들어갈 때, 그것은 마찰을 일으킨다."]],"w":"마찰을 일으키는 것은 대기로 들어간 먼지 조각이에요. 4번 문장의 a piece of dust를 it으로 받았어요.","c":2},"h":"b28da5dadf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The light can disappear before you think of a wish!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["빛은 소원을 생각한 뒤에야 사라질 수 있다.","빛은 소원을 비는 동안 계속 남아 있다.","빛은 소원을 생각해 내기 전에 사라질 수 있다.","빛은 소원을 이루어 주고 사라진다."],"sko":"그 빛은 당신이 소원을 생각해 내기 전에 사라질 수 있다!","r":{"a":"3) 빛은 소원을 생각해 내기 전에 사라질 수 있다.","ev":"8번 문장","s":[[8,"The light can disappear before you think of a wish!","그 빛은 당신이 소원을 생각해 내기 전에 사라질 수 있다!"]],"w":"before는 '~하기 전에'예요. 소원을 생각해 내기도 전에 빛이 사라질 수 있다는 뜻이에요.","c":3},"h":"307dadafbb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["A shooting star is a big star falling to Earth.","Dust falls from space rocks only on Earth.","The light of a shooting star lasts for many hours.","A shooting star is a bright flash in the sky."],"oko":["별똥별은 지구로 떨어지는 큰 별이다.","먼지 조각은 지구에서만 우주 암석으로부터 떨어진다.","별똥별의 빛은 몇 시간 동안 계속된다.","별똥별은 하늘에서 보이는 밝은 번쩍임이다."],"r":{"a":"4) A shooting star is a bright flash in the sky.","ev":"5~6번 문장","s":[[5,"It burns up and produces a bright flash in the sky.","그것은 타버리고 하늘에 밝은 번쩍임을 만들어 낸다."],[6,"This flash is a shooting star.","이 번쩍임이 별똥별이다."]],"w":"5~6번에서 타버린 먼지 조각이 하늘에 만든 밝은 번쩍임이 별똥별이라고 해요. 큰 별이 아니고(2번), 먼지는 우주에서 떨어지며(3번), 빛은 금방 사라질 수 있어요(8번).","c":4},"h":"c1542baab7"},{"n":9,"t":"sum","q":"Small pieces of dust fall from space rocks. When one enters Earth’s (A), it burns up and makes a bright (B).","ko":"우주 암석에서 작은 먼지 조각이 떨어진다. 그것이 지구의 (A)로 들어가면 타서 밝은 (B)을 만든다.","opts":["(A) calendar / (B) flash","(A) atmosphere / (B) wish","(A) ocean / (B) shadow","(A) atmosphere / (B) rock","(A) atmosphere / (B) flash"],"oko":["(A) 달력 / (B) 번쩍임","(A) 대기 / (B) 소원","(A) 바다 / (B) 그림자","(A) 대기 / (B) 암석","(A) 대기 / (B) 번쩍임"],"r":{"a":"5) (A) atmosphere / (B) flash","ev":"3~5번 문장","s":[[3,"In space, small pieces of dust fall from space rocks.","우주에서, 작은 먼지 조각들이 우주 암석으로부터 떨어진다."],[4,"When a piece of dust enters Earth’s atmosphere, it causes friction.","먼지 조각이 지구의 대기로 들어갈 때, 그것은 마찰을 일으킨다."],[5,"It burns up and produces a bright flash in the sky.","그것은 타버리고 하늘에 밝은 번쩍임을 만들어 낸다."]],"w":"4번에서 지구의 대기(atmosphere)로 들어가고, 5번에서 타면서 밝은 번쩍임(flash)을 만들어요.","c":5},"h":"0f9e131613"},{"n":10,"t":"fill","q":"A shooting star has a [A] speed, so its light can [B] before you think of a wish.","ko":"별똥별은 [A] 속도를 가지고 있어서, 그 빛은 당신이 소원을 생각해 내기 전에 [B]할 수 있다.","bank":["high","disappear","slow","burn","dust","wish"],"bko":{"high":"빠른, 높은","disappear":"사라지다","slow":"느린","burn":"타다","wish":"소원","dust":"먼지"},"r":{"a":"[A] high, [B] disappear","ev":"7~8번 문장","s":[[7,"You might be surprised by its high speed.","당신은 그것의 빠른 속도에 놀랄지도 모른다."],[8,"The light can disappear before you think of a wish!","그 빛은 당신이 소원을 생각해 내기 전에 사라질 수 있다!"]],"w":"7번에서 빠른 속도(high speed)에 놀랄지도 모른다고 했고, 8번에서 그래서 소원을 생각해 내기 전에 빛이 사라질(disappear) 수 있다고 해요. slow는 반대 뜻이에요.","c":null},"h":"be9deae5e1"}]},{"u":6,"id":"hs1-06-2","no":2,"ko":"범인은 바로 너!","items":[{"n":1,"t":"tf","q":"A diamond necklace was stolen from a mansion.","ko":"다이아몬드 목걸이가 저택에서 도난당했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"One night, a diamond necklace was stolen from a big mansion.","어느 날 밤, 큰 저택에서 다이아몬드 목걸이가 도난당했다."]],"w":"1번 문장에 a diamond necklace was stolen from a big mansion이 나와요.","c":"T"},"h":"ed367cf472"},{"n":2,"t":"tf","q":"The butler told the detective that he did not see the thief.","ko":"집사는 형사에게 자신이 도둑을 보지 못했다고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"The butler told him that he saw the thief.","집사는 그에게 도둑을 봤다고 말했다."],[6,"“I saw the thief from behind.","“저는 뒤에서 도둑을 봤습니다."]],"w":"5번에서 집사는 도둑을 봤다고(he saw the thief) 말했고, 6번에서도 뒤에서 도둑을 봤다고 했어요. 보지 못했다는 말은 반대예요.","c":"F"},"h":"36d4e172d1"},{"n":3,"t":"tf","q":"The detective arrested the butler.","ko":"형사는 집사를 체포했다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Then, he arrested the butler.","그러고 나서, 그는 집사를 체포했다."]],"w":"11번 문장에 Then, he arrested the butler가 나와요. he는 형사예요.","c":"T"},"h":"bfc56c2912"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He started to look for clues.)","ko":"그는 단서를 찾기 시작했다. (clue는 어떤 뜻?)","opts":["열쇠","단서","선물","소문"],"word":"clues","r":{"a":"2) 단서","ev":"3번 문장","s":[[3,"He started to look for clues.","그는 단서를 찾기 시작했다."]],"w":"형사가 도둑을 잡으려고 찾는 것이므로 clue는 '단서'예요.","c":2},"h":"a83359c942"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then, he arrested the butler.)","ko":"그러고 나서, 그는 집사를 (arrest는 어떤 뜻?)","opts":["도와줬다","초대했다","놓아줬다","체포했다"],"word":"arrested","r":{"a":"4) 체포했다","ev":"10~11번 문장","s":[[10,"You are lying!”","당신은 거짓말하고 있군요!”라고 소리쳤다."],[11,"Then, he arrested the butler.","그러고 나서, 그는 집사를 체포했다."]],"w":"형사가 집사의 거짓말을 알아챈 뒤에 한 일이에요. arrest = 체포하다.","c":4},"h":"2331669bfb"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe was running away with the necklace in his hand.","ko":"밑줄 친 He가 가리키는 것은?","opts":["형사","집사","도둑","저택 주인"],"sko":"그는 목걸이를 손에 들고 도망치고 있었습니다.","r":{"a":"3) 도둑","ev":"6~7번 문장","s":[[6,"“I saw the thief from behind.","“저는 뒤에서 도둑을 봤습니다."],[7,"He was running away with the necklace in his hand.","그는 목걸이를 손에 들고 도망치고 있었습니다."]],"w":"목걸이를 손에 들고 도망치던 사람은 집사가 뒤에서 봤다는 도둑이에요. 6번의 the thief를 7번에서 He로 받았어요.","c":3},"h":"09db8e416c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The detective shouted, “You can’t see that from behind.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["당신은 앞에서 그것을 볼 수 없어요.","당신은 뒤에서 그것을 볼 수 없어요.","나는 뒤에서 그것을 볼 수 없어요.","당신은 뒤에서 도둑을 쫓을 수 없어요."],"sko":"형사는 “당신은 그것을 뒤에서 볼 수 없어요.”라고 소리쳤다.","r":{"a":"2) 당신은 뒤에서 그것을 볼 수 없어요.","ev":"9번 문장","s":[[9,"The detective shouted, “You can’t see that from behind.","형사는 “당신은 그것을 뒤에서 볼 수 없어요."]],"w":"can’t see that from behind는 '뒤에서 그것을 볼 수 없다'예요. 말하는 사람은 형사이고, 듣는 사람(you)은 집사예요.","c":2},"h":"d0e77811f0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The detective visited the mansion at night.","The butler saw the thief from the front.","The detective believed that the butler was telling the truth.","The butler said the thief was wearing a red bow tie."],"oko":["형사는 밤에 저택을 방문했다.","집사는 도둑을 앞에서 봤다.","형사는 집사가 진실을 말한다고 믿었다.","집사는 도둑이 빨간 나비넥타이를 하고 있었다고 말했다."],"r":{"a":"4) The butler said the thief was wearing a red bow tie.","ev":"6~8번 문장","s":[[6,"“I saw the thief from behind.",
