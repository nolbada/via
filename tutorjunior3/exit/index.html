들을 [B] 것으로 믿어진다.","bank":["architectural","based","walls","shade","tourists","residents"],"bko":{"architectural":"건축","based":"기반으로 한","walls":"벽들","shade":"그늘","tourists":"관광객들","residents":"주민들"},"r":{"a":"[A] architectural (건축), [B] based (기반으로 한)","ev":"4번 문장","s":[[4,"This architectural style is believed to be based on ancient Arabic cave homes.","이 건축 양식은 고대 아랍 동굴 집들을 기반으로 한 것으로 믿어진다."]],"w":"4번 This architectural style is believed to be based on ancient Arabic cave homes에서 가져왔어요. style을 꾸미는 형용사 architectural, be 뒤에서 on과 함께 쓰이는 based가 정답이에요. be based on은 ‘~에 기반을 두다’예요.","c":null},"h":"e4279f6326"}]},{"u":10,"id":"rj3-10-2","no":2,"ko":"우리 집이 사라졌어","items":[{"n":1,"t":"tf","q":"Trulli were built with rocks but without cement.","ko":"trulli는 돌로 지어졌지만 시멘트 없이 지어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They were built with rocks but without cement or other materials for holding the rocks together.","그것들은 돌들로 지어졌지만, 그 돌들을 접합하기 위한 시멘트나 다른 재료들 없이 지어졌다."]],"w":"3번 문장에서 trulli는 돌로 지어졌고, 돌을 붙이는 시멘트나 다른 재료는 쓰지 않았다고 해요.","c":"T"},"h":"8904835775"},{"n":2,"t":"tf","q":"Common people in the 17th century could easily pay the high tax on their houses.","ko":"17세기의 서민들은 집에 대한 높은 세금을 쉽게 낼 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"In the 17th century, people had to pay a high tax on their houses.","17세기에, 사람들은 그들의 집에 대한 높은 세금을 내야 했다."],[7,"Common people could not afford it.","서민들은 그것을 감당할 형편이 되지 않았다."]],"w":"6번에서 높은 세금을 내야 했고, 7번에서 서민들은 그것을 감당할 형편이 되지 않았다(could not afford it)고 해요. 쉽게 낼 수 있었다는 말은 반대예요.","c":"F"},"h":"055244f78b"},{"n":3,"t":"tf","q":"Houses like trulli can be seen in Alberobello, Spain.","ko":"trulli 같은 집들은 스페인의 Alberobello에서 볼 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"You can see houses like this, called trulli, in Alberobello, Italy.","당신은 trulli라고 불리는 이와 같은 집들을 이탈리아의 Alberobello에서 볼 수 있다."]],"w":"2번 문장에서 trulli는 이탈리아(Italy)의 Alberobello에서 볼 수 있다고 해요. 스페인이라는 말은 틀려요.","c":"F"},"h":"d563857904"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In order to trick the government, they built these special houses.)","ko":"( ) 위해, 그들은 이 특별한 집들을 지었다.","opts":["돕다","설득하다","속이다","초대하다"],"word":"trick","r":{"a":"3) 속이다","ev":"8번 문장","s":[[8,"In order to trick the government, they built these special houses.","정부를 속이기 위해, 그들은 이 특별한 집들을 지었다."]],"w":"8번은 서민들이 세금을 낼 수 없어서 정부를 상대로 꾀를 쓴 이야기예요. 9~10번에서 집을 분해했다가 다시 합하는 방법이 나오므로 trick은 '속이다'예요.","c":3},"h":"c61cab6331"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Today, trulli are so well preserved that they are still used as homes.)","ko":"오늘날, trulli는 매우 잘 ( ) 있어서 그것들은 아직도 집으로 사용된다.","opts":["보존되어","버려져","새로 지어져","팔려"],"word":"preserved","r":{"a":"1) 보존되어","ev":"11번 문장","s":[[11,"Today, trulli are so well preserved that they are still used as homes.","오늘날, trulli는 매우 잘 보존되어 있어서 그것들은 아직도 집으로 사용된다."]],"w":"11번에서 so ~ that은 '매우 ~해서 …하다'예요. 아직도 집으로 쓰일 만큼 잘 지켜져 왔다는 뜻이라 preserved는 '보존된'이에요.","c":1},"h":"9817259a44"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nImagine houses that you can take apart and then put back together.","ko":"밑줄 친 that이 가리키는 것은?","sko":"당신이 분해하고 나서 다시 합할 수 있는 집들을 상상해 봐라.","opts":["집들","당신","시멘트","돌들"],"r":{"a":"1) 집들","ev":"1번 문장","s":[[1,"Imagine houses that you can take apart and then put back together.","당신이 분해하고 나서 다시 합할 수 있는 집들을 상상해 봐라."]],"w":"1번 문장은 ‘당신이 분해하고 나서 다시 합할 수 있는 집들을 상상해 봐라’는 뜻이에요. that 이하는 앞의 houses(집들)를 설명하므로 that은 houses를 가리켜요.","c":1,"k":"that = 집들"},"pron":"that","h":"ebbff3753b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Builders simply placed the rocks on top of each other!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"집을 짓는 사람들은 단지 돌들을 서로의 위에 두었다!","opts":["건축가들은 돌들을 시멘트로 서로 붙였다.","건축가들은 단지 돌들을 서로의 위에 얹었다.","건축가들은 돌들을 서로 멀리 떨어뜨려 놓았다.","건축가들은 돌들을 모두 집 아래에 묻었다."],"r":{"a":"2) 건축가들은 단지 돌들을 서로의 위에 얹었다.","ev":"3~4번 문장","s":[[3,"They were built with rocks but without cement or other materials for holding the rocks together.","그것들은 돌들로 지어졌지만, 그 돌들을 접합하기 위한 시멘트나 다른 재료들 없이 지어졌다."],[4,"Builders simply placed the rocks on top of each other!","집을 짓는 사람들은 단지 돌들을 서로의 위에 두었다!"]],"w":"placed the rocks on top of each other는 '돌들을 서로의 위에 얹었다'예요. 3번에서 돌을 붙이는 시멘트는 쓰지 않았다고 했으므로 시멘트로 붙였다는 말은 틀려요.","c":2},"h":"fee3ab0d47"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["trulli는 시멘트와 다른 재료로 지어졌다.","trulli는 정부 일꾼들에 의해 지어졌다.","trulli는 오늘날 집으로 사용될 수 없다.","trulli는 세계 문화유산으로 지정되어 있다."],"opts":["Trulli were built with cement and other materials.","Trulli were built by government workers.","Trulli cannot be used as homes today.","Trulli have been designated a World Heritage Site."],"r":{"a":"4) Trulli have been designated a World Heritage Site.","ev":"3, 8, 11, 13번 문장","s":[[3,"They were built with rocks but without cement or other materials for holding the rocks together.","그것들은 돌들로 지어졌지만, 그 돌들을 접합하기 위한 시멘트나 다른 재료들 없이 지어졌다."],[8,"In order to trick the government, they built these special houses.","정부를 속이기 위해, 그들은 이 특별한 집들을 지었다."],[11,"Today, trulli are so well preserved that they are still used as homes.","오늘날, trulli는 매우 잘 보존되어 있어서 그것들은 아직도 집으로 사용된다."],[13,"They have even been designated a World Heritage Site.","그것들은 심지어 세계 문화유산으로 지정되어 있다."]],"w":"13번에서 trulli는 세계 문화유산(World Heritage Site)으로 지정되어 있다고 해요. 시멘트는 쓰지 않았고(3번), 서민들이 지었고(8번), 지금도 집으로 쓰여요(11번).","c":4},"h":"e4db676e9b"},{"n":9,"t":"sum","q":"When they (A) the government workers were coming to the town, they (B) took their houses apart.","ko":"정부 일꾼들이 마을로 오고 있다는 것을 그들이 (A) 때, 그들은 (B) 집을 분해했다.","oko":["(A) 들었을 / (B) 천천히","(A) 잊었을 / (B) 재빨리","(A) 들었을 / (B) 재빨리","(A) 잊었을 / (B) 천천히","(A) 거절했을 / (B) 재빨리"],"opts":["(A) heard / (B) slowly","(A) forgot / (B) quickly","(A) heard / (B) quickly","(A) forgot / (B) slowly","(A) refused / (B) quickly"],"r":{"a":"3) (A) heard / (B) quickly ((A) 들었을 / (B) 재빨리)","ev":"9번 문장","s":[[9,"When they heard the government workers were coming to the town, they quickly took their houses apart.","정부에서 일하는 사람들이 마을로 오고 있다는 것을 그들이 들었을 때, 그들은 재빨리 그들의 집을 분해했다."]],"w":"9번 문장에서 정부 일꾼들이 마을로 오고 있다는 것을 들으면(heard) 재빨리(quickly) 집을 분해했다고 해요. 천천히 했다거나 잊었다거나 거절했다는 말은 없어요.","c":3},"h":"d47572475f"},{"n":10,"t":"fill","q":"There is an [A] [B] behind this unique style.","ko":"이 독특한 방식 뒤에는 [A] [B]이(가) 있다.","bank":["interesting","story","rocks","cement","tourists","builders"],"bko":{"interesting":"흥미로운","story":"이야기","rocks":"돌들","cement":"시멘트","tourists":"관광객들","builders":"집을 짓는 사람들"},"r":{"a":"[A] interesting (흥미로운), [B] story (이야기)","ev":"5번 문장","s":[[5,"There is an interesting story behind this unique style.","이 독특한 방식 뒤에는 흥미로운 이야기가 있다."]],"w":"5번 There is an interesting story behind this unique style에서 가져왔어요. an 뒤에서 명사 story를 꾸미는 형용사 interesting이 와야 해요. 나머지는 명사라 형용사 자리에 들어갈 수 없어요.","c":null},"h":"e64dd905c3"}]},{"u":10,"id":"rj3-10-3","no":3,"ko":"두 발 아래 3만 명이!","items":[{"n":1,"t":"tf","q":"Derinkuyu was found by a man under his house in 1963.","ko":"Derinkuyu는 1963년에 한 남자가 그의 집 아래에서 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1, 3번 문장","s":[[1,"In 1963, a man found a secret room beneath his house in Cappadocia, Türkiye.","1963년에, 튀르키예의 Cappadocia에서 한 남자가 그의 집 아래에 있는 비밀의 방을 발견했다."],[3,"This was the discovery of Derinkuyu, an ancient underground city.","이는 고대 지하 도시인 Derinkuyu의 발견이었다."]],"w":"1번에서 1963년에 한 남자가 집 아래의 비밀의 방을 발견했고, 3번에서 그것이 Derinkuyu 발견이었다고 해요.","c":"T"},"h":"84576c1820"},{"n":2,"t":"tf","q":"The underground city has only three floors.","ko":"그 지하 도시는 층이 세 개뿐이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The city has eighteen floors and reaches a depth of 85 meters.","그 도시는 18개의 층이 있고 85m의 깊이에 이른다."]],"w":"4번 문장에서 이 도시는 18개의 층(eighteen floors)이 있고 깊이가 85m에 이른다고 해요. 세 개뿐이라는 말은 틀려요.","c":"F"},"h":"8ede1b33e9"},{"n":3,"t":"tf","q":"1,500 tunnels brought fresh air to even the deepest floor.","ko":"1,500개의 터널이 가장 깊은 층까지도 맑은 공기를 들여왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"There was fresh, flowing water, and 1,500 tunnels brought fresh air to even the deepest floor.","흐르는 신선한 물이 있었고, 1,500개의 터널이 심지어 가장 깊은 층까지도 맑은 공기를 들여왔다."]],"w":"10번 문장에 그대로 나와요. 터널들이 가장 깊은 층까지도 맑은 공기를 들여왔어요.","c":"T"},"h":"4fba4e3365"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 1963, a man found a secret room beneath his house in Cappadocia, Türkiye.)","ko":"1963년에, 튀르키예의 Cappadocia에서 한 남자가 그의 집 ( ) 있는 비밀의 방을 발견했다.","opts":["~ 위에","~ 옆에","~ 아래에","~ 뒤쪽에"],"word":"beneath","r":{"a":"3) ~ 아래에","ev":"1번 문장","s":[[1,"In 1963, a man found a secret room beneath his house in Cappadocia, Türkiye.","1963년에, 튀르키예의 Cappadocia에서 한 남자가 그의 집 아래에 있는 비밀의 방을 발견했다."]],"w":"1번에서 남자는 자기 집 아래에서 비밀의 방을 발견했고, 그 방이 다른 방으로 이어져 지하 도시가 되었어요(2~3번). 그래서 beneath는 '~ 아래에'예요.","c":3},"h":"d415348a62"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is big enough to hold about 30,000 people.)","ko":"그것은 약 30,000명의 사람들을 ( ) 만큼 충분히 크다.","opts":["수용할","숨길","던질","무너뜨릴"],"word":"hold","r":{"a":"1) 수용할","ev":"5번 문장","s":[[5,"It is big enough to hold about 30,000 people.","그것은 약 30,000명의 사람들을 수용할 만큼 충분히 크다."]],"w":"5번은 도시가 얼마나 큰지 말하는 문장이에요. 약 30,000명이 들어갈 수 있다는 뜻이라 hold는 '(사람을) 수용하다'예요. 4번의 층수·깊이와 이어져요.","c":1},"h":"812255ebf9"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt also included shops, schools, churches, and space for farm animals.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 또한 상점과 학교, 교회, 그리고 가축을 위한 공간을 포함했다.","opts":["연구자들","지하 도시 Derinkuyu","한 남자의 집","고고학자들"],"r":{"a":"2) 지하 도시 Derinkuyu","ev":"9~11번 문장","s":[[9,"Unlike what you might expect, the old underground city was probably quite comfortable.","당신이 예상할지도 모르는 것과는 다르게, 그 오래된 지하 도시는 아마도 꽤 편안했을 것이다."],[10,"There was fresh, flowing water, and 1,500 tunnels brought fresh air to even the deepest floor.","흐르는 신선한 물이 있었고, 1,500개의 터널이 심지어 가장 깊은 층까지도 맑은 공기를 들여왔다."],[11,"It also included shops, schools, churches, and space for farm animals.","그것은 또한 상점과 학교, 교회, 그리고 가축을 위한 공간을 포함했다."]],"w":"11번의 It also included shops, schools...는 앞에서 계속 이야기한 지하 도시 Derinkuyu예요. 9~10번에서 편안했다고 한 도시에 상점과 학교도 있었다는 내용이에요.","c":2},"h":"0020197bf6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Unlike what you might expect, the old underground city was probably quite comfortable.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 예상할지도 모르는 것과는 다르게, 그 오래된 지하 도시는 아마도 꽤 편안했을 것이다.","opts":["당신이 예상하는 대로, 그 오래된 지하 도시는 아마도 꽤 불편했을 것이다.","당신이 예상할지도 모르는 것과는 달리, 그 오래된 지하 도시는 확실히 매우 위험했다.","당신이 예상할지도 모르는 것과 같이, 그 지하 도시는 새로 지어져서 편안했다.","당신이 예상할지도 모르는 것과는 달리, 그 오래된 지하 도시는 아마도 꽤 편안했을 것이다."],"r":{"a":"4) 당신이 예상할지도 모르는 것과는 달리, 그 오래된 지하 도시는 아마도 꽤 편안했을 것이다.","ev":"9번 문장","s":[[9,"Unlike what you might expect, the old underground city was probably quite comfortable.","당신이 예상할지도 모르는 것과는 다르게, 그 오래된 지하 도시는 아마도 꽤 편안했을 것이다."]],"w":"Unlike what you might expect는 '예상과는 달리'예요. 그래서 지하 도시가 불편할 것 같다는 예상과 반대로 probably quite comfortable, 즉 아마도 꽤 편안했다는 뜻이에요. 위험했다는 말은 없고, 도시는 새로 지은 것이 아니라 오래된 도시예요.","c":4},"h":"eff543838d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고고학자들은 이미 그 도시의 모든 부분을 찾았다.","고고학자들은 아직도 그 도시의 새로운 부분을 찾고 있다.","그 도시는 너무 작아서 많은 사람을 수용할 수 없다.","그 도시는 1963년에 고고학자들에 의해 발견되었다."],"opts":["Archaeologists have already found every part of the city.","Archaeologists are still finding new parts of the city.","The city is too small to hold many people.","The city was discovered by archaeologists in 1963."],"r":{"a":"2) Archaeologists are still finding new parts of the city.","ev":"1, 5, 12번 문장","s":[[1,"In 1963, a man found a secret room beneath his house in Cappadocia, Türkiye.","1963년에, 튀르키예의 Cappadocia에서 한 남자가 그의 집 아래에 있는 비밀의 방을 발견했다."],[5,"It is big enough to hold about 30,000 people.","그것은 약 30,000명의 사람들을 수용할 만큼 충분히 크다."],[12,"The city is so big that archaeologists are still finding new parts!","그 도시는 매우 커서 고고학자들은 아직도 새로운 부분들을 찾아내고 있다!"]],"w":"12번에서 도시가 너무 커서 고고학자들이 아직도 새로운 부분을 찾아내고 있다고 해요. 도시는 약 30,000명을 수용할 만큼 크고(5번), 1963년에 발견한 사람은 고고학자가 아니라 한 남자예요(1번).","c":2},"h":"e217883c8b"},{"n":9,"t":"sum","q":"The heavy stone doors of Derinkuyu could be (A) like wheels to (B) the city from the inside.","ko":"Derinkuyu의 무거운 바위 문들은 도시를 안쪽에서 (B)하기 위해 바퀴처럼 (A) 수 있었다.","oko":["(A) 굴려질 / (B) 열","(A) 칠해질 / (B) 봉쇄","(A) 굴려질 / (B) 파괴","(A) 들어 올려질 / (B) 열","(A) 굴려질 / (B) 봉쇄"],"opts":["(A) rolled / (B) open","(A) painted / (B) seal","(A) rolled / (B) destroy","(A) lifted / (B) open","(A) rolled / (B) seal"],"r":{"a":"5) (A) rolled / (B) seal","ev":"8번 문장","s":[[8,"The doors, made of heavy stones, can be rolled like wheels to seal the city from the inside.","그 문들은 무거운 바위로 만들어졌는데, 도시를 안쪽에서 봉쇄하기 위해 바퀴처럼 굴려질 수 있었다."]],"w":"8번에서 문들은 무거운 바위로 만들어졌고 바퀴처럼 굴려질(rolled) 수 있었으며, 도시를 안쪽에서 봉쇄하기(seal) 위한 것이었어요. 문을 열거나 도시를 파괴하는 것이 아니에요.","c":5},"h":"12098c8f46"},{"n":10,"t":"fill","q":"Some researchers think it was a [A] to hide from [B] because it has special doors.","ko":"어떤 연구자들은 그것이 특별한 문들이 있기 때문에 [B](으)로부터 숨는 [A](이)었다고 생각한다.","bank":["place","enemies","wheels","floors","tunnels","comfortable"],"bko":{"place":"장소","enemies":"적들","wheels":"바퀴들","floors":"층들","tunnels":"터널들","comfortable":"편안한"},"r":{"a":"[A] place (장소), [B] enemies (적들)","ev":"7번 문장","s":[[7,"Some researchers think it was a place to hide from enemies because it has special doors.","어떤 연구자들은 그것이 특별한 문들이 있기 때문에 적으로부터 숨는 장소였다고 생각한다."]],"w":"7번 Some researchers think it was a place to hide from enemies because it has special doors에서 가져왔어요. a 뒤에는 단수 명사 place, hide from 뒤에는 ‘적들’이 와요. 나머지는 복수 명사나 형용사라 a 뒤에 올 수 없거나 뜻이 맞지 않아요.","c":null},"h":"4585e3cef0"}]},{"u":10,"id":"rj3-10-4","no":4,"ko":"싸워보지도 못하고 지다니","items":[{"n":1,"t":"tf","q":"Finn built a causeway to cross the sea to Scotland.","ko":"Finn은 스코틀랜드로 바다를 건너기 위해 둑길을 지었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"There is a sea between Scotland and Ireland.","스코틀랜드와 아일랜드 사이에는 바다가 있다."],[5,"So Finn built a causeway and started to cross it.","그래서 Finn은 둑길을 짓고 그것을 건너기 시작했다."]],"w":"4번에서 스코틀랜드와 아일랜드 사이에는 바다가 있고, 5번에서 Finn이 둑길을 짓고 그것을 건너기 시작했다고 해요.","c":"T"},"h":"84140faeff"},{"n":2,"t":"tf","q":"Finn thought he could easily defeat Benadonner.","ko":"Finn은 자신이 Benadonner를 쉽게 이길 수 있다고 생각했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"On the way to Scotland, he saw Benadonner and realized that his rival was too large to defeat!","스코틀랜드로 가는 길에, 그는 Benadonner를 보았고 그의 경쟁자가 너무 커서 이길 수 없다는 것을 깨달았다!"]],"w":"6번 문장에서 Finn은 Benadonner가 너무 커서 이길 수 없다(too large to defeat)는 것을 깨달아요. 쉽게 이긴다고 생각했다는 말은 반대예요.","c":"F"},"h":"06f8299fa3"},{"n":3,"t":"tf","q":"Benadonner thought the baby was Finn’s son.","ko":"Benadonner는 그 아기가 Finn의 아들이라고 생각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"When Benadonner came to Ireland and found the baby, he thought the baby was Finn’s son.","Benadonner가 아일랜드에 와서 그 아기를 발견했을 때, 그는 그 아기가 Finn의 아들이라고 생각했다."]],"w":"9번 문장에 그대로 나와요. Benadonner는 아기를 Finn의 아들이라고 생각했어요. 사실 그 아기는 Finn 본인이에요.","c":"T"},"h":"b3258dee59"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (According to the legend, Finn MacCool, an Irish giant, decided to go to fight his Scottish rival, Benadonner.)","ko":"그 전설에 따르면, 아일랜드 거인인 Finn MacCool은 그의 스코틀랜드 ( )인 Benadonner와 싸우러 가기로 결심했다.","opts":["친구","가족","경쟁자","이웃"],"word":"rival","r":{"a":"3) 경쟁자","ev":"3번 문장","s":[[3,"According to the legend, Finn MacCool, an Irish giant, decided to go to fight his Scottish rival, Benadonner.","그 전설에 따르면, 아일랜드 거인인 Finn MacCool은 그의 스코틀랜드 경쟁자인 Benadonner와 싸우러 가기로 결심했다."]],"w":"3번에서 Finn은 Benadonner와 싸우러 가기로 결심해요. 싸울 상대이므로 rival은 '경쟁자'예요. 6번에서도 Finn이 his rival(Benadonner)이 너무 커서 이길 수 없다고 깨달아요.","c":3},"h":"088d5ddc7e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Cleverly, she dressed him like a baby and laid him in a huge cradle.)","ko":"영리하게, 그녀는 그를 아기처럼 옷을 입혀서 거대한 ( )에 눕혔다.","opts":["둑길","아기 침대","옷장","절벽"],"word":"cradle","r":{"a":"2) 아기 침대","ev":"8번 문장","s":[[8,"Cleverly, she dressed him like a baby and laid him in a huge cradle.","영리하게, 그녀는 그를 아기처럼 옷을 입혀서 거대한 아기 침대에 눕혔다."]],"w":"8번에서 Finn의 아내는 Finn에게 아기처럼 옷을 입히고 거대한 cradle에 눕혔어요. 9번에서 Benadonner가 '아기'를 발견하는 것과 이어지므로 cradle은 '아기 침대'예요.","c":2},"h":"99f5a22802"},{"n":6,"t":"ref","q":"What does the underlined \"his\" refer to?\nFinn came back and told his wife.","ko":"밑줄 친 his가 가리키는 것은?","sko":"Finn은 돌아왔고 그의 아내에게 이야기했다.","opts":["Finn","Benadonner","Finn의 아들","거인의 아내"],"r":{"a":"1) Finn","ev":"7번 문장","s":[[7,"Finn came back and told his wife.","Finn은 돌아왔고 그의 아내에게 이야기했다."]],"w":"7번 문장은 ‘Finn은 돌아왔고 his 아내에게 이야기했다’는 뜻이에요. 돌아와서 이야기한 사람이 Finn이므로 his는 Finn을 가리켜요.","c":1,"k":"his = Finn"},"pron":"his","h":"8cc2661b48"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Giant’s Causeway is what remains.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Giant’s Causeway는 남아 있는 것이다.","opts":["Giant’s Causeway는 남아 있는 것이다.","Giant’s Causeway는 새로 만들어진 것이다.","Giant’s Causeway는 완전히 사라져 버린 것이다.","Giant’s Causeway는 Finn이 짓고 싶어 했던 것이다."],"r":{"a":"1) Giant’s Causeway는 남아 있는 것이다.","ev":"13번 문장","s":[[13,"The Giant’s Causeway is what remains.","Giant’s Causeway는 남아 있는 것이다."]],"w":"The Giant’s Causeway is what remains는 ‘Giant’s Causeway는 남아 있는 것이다’라는 뜻이에요. what remains는 ‘남아 있는 것’이에요. 앞에서 Benadonner가 둑길을 파괴해서 일부가 남은 거예요.","c":1},"h":"27593a3e65"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Finn은 Benadonner가 오는 것을 막으려고 둑길을 파괴했다.","Benadonner는 아일랜드에 남아서 Finn과 싸웠다.","Benadonner는 집으로 달려가면서 그의 뒤로 둑길을 파괴했다.","Benadonner는 Finn의 아내를 만나러 가기 위해 둑길을 지었다."],"opts":["Finn destroyed the causeway to stop Benadonner from coming.","Benadonner stayed in Ireland and fought with Finn.","Benadonner ran home and destroyed the causeway behind him.","Benadonner built the causeway to visit Finn’s wife."],"r":{"a":"3) Benadonner ran home and destroyed the causeway behind him.","ev":"5, 12~13번 문장","s":[[5,"So Finn built a causeway and started to cross it.","그래서 Finn은 둑길을 짓고 그것을 건너기 시작했다."],[12,"Benadonner ran home quickly, destroying the causeway behind him.","Benadonner는 그의 뒤로 그 둑길을 파괴하면서 빠르게 집으로 달려갔다."],[13,"The Giant’s Causeway is what remains.","Giant’s Causeway는 남아 있는 것이다."]],"w":"12번에서 Benadonner는 집으로 빠르게 달려가면서 뒤의 둑길을 파괴했고, 13번에서 남은 것이 지금의 Giant's Causeway라고 해요. 둑길을 지은 것은 Finn이에요(5번).","c":3},"h":"3b98fbb278"},{"n":9,"t":"sum","q":"On the northeast coast of Northern Ireland, about 40,000 (A) columns of (B) make an amazing landscape of cliffs.","ko":"북아일랜드의 북동쪽 해안에서, (B)(으)로 이루어진 약 40,000개의 (A) 기둥들이 놀라운 절벽 풍경을 만든다.","oko":["(A) 둥근 / (B) 현무암","(A) 육각형의 / (B) 모래","(A) 육각형의 / (B) 현무암","(A) 둥근 / (B) 모래","(A) 정사각형의 / (B) 현무암"],"opts":["(A) round / (B) basalt","(A) hexagonal / (B) sand","(A) hexagonal / (B) basalt","(A) round / (B) sand","(A) square / (B) basalt"],"r":{"a":"3) (A) hexagonal / (B) basalt ((A) 육각형의 / (B) 현무암)","ev":"1번 문장","s":[[1,"On the northeast coast of Northern Ireland, about 40,000 hexagonal columns of basalt make an amazing landscape of cliffs.","북아일랜드의 북동쪽 해안에, 약 40,000개의 육각형의 현무암 기둥들이 놀라운 절벽 풍경을 만든다."]],"w":"1번 문장에서 북아일랜드의 북동쪽 해안에 약 40,000개의 육각형의(hexagonal) 현무암(basalt) 기둥들이 놀라운 절벽 풍경을 만든다고 해요. 둥글거나 정사각형인 기둥, 모래는 본문에 없어요.","c":3},"h":"f8955e1324"},{"n":10,"t":"fill","q":"This area is [A] the Giant’s Causeway, a name that is [B] on an Irish legend.","ko":"이 지역은 Giant’s Causeway(거인의 둑길)라고 [A] 그 이름은 아일랜드 전설에 [B] 것이다.","bank":["called","based","legend","wife","sea","giant"],"bko":{"called":"불리며","based":"근거한","legend":"전설","wife":"아내","sea":"바다","giant":"거인"},"r":{"a":"[A] called (불리며), [B] based (근거한)","ev":"2번 문장","s":[[2,"This area is called the Giant’s Causeway, a name that is based on an Irish legend.","이 지역은 아일랜드 전설에 근거한 이름인, Giant’s Causeway(거인의 둑길)라고 불린다."]],"w":"2번 This area is called the Giant’s Causeway, a name that is based on an Irish legend에서 가져왔어요. is called ~는 ‘~라고 불린다’, is based on ~는 ‘~에 근거한다’는 뜻이에요. 나머지는 명사라 be동사 뒤의 이 자리에 들어갈 수 없어요.","c":null},"h":"49ddf6a980"}]}];

function lnk(txt,href,pri){var a=document.createElement("a");a.textContent=txt;a.href=href;if(pri)a.className="pri";return a}
function navBar(){var d=document.createElement("div");d.className="nav";d.appendChild(lnk("홈으로","../",true));d.appendChild(lnk("Exit test 목록","./"));return d}
function testHead(p){var d=document.createElement("div");d.className="top";
  var k=document.createElement("span");k.className="tk";k.textContent="EXIT TEST";d.appendChild(k);
  var h=document.createElement("h1");h.textContent=secName(p.u)+" · "+readName(p);d.appendChild(h);
  var s=document.createElement("p");s.className="sub";s.textContent=p.ko;d.appendChild(s);return d}

var cur=null,ans={},done={};
var LAB={tf:"T / F",vocab:"어휘",ref:"지칭",sense:"문장 이해",match:"내용 일치",sum:"요약문 (A)(B)",fill:"요약문 완성"};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c]})}
function pr(){return P.filter(function(p){return p.id===cur})[0]}
function answered(p,it){var a=(ans[p.id]||{})[it.n];if(it.t==="fill")return a&&a[0]&&a[1];return a!=null&&a!==""}
function setAns(p,it,v){ans[p.id]=ans[p.id]||{};ans[p.id][it.n]=v}
function view(){var p=pr(),v=document.getElementById("view");v.innerHTML="";var fin=!!done[p.id];v.appendChild(testHead(p));
 if(fin){var d0=done[p.id],pass=d0.s*10>=70,wr0=p.items.filter(function(it){return !d0.ok[it.n]}).map(function(it){return it.n});var bn=el("div","banner "+(pass?"pass":"fail"));bn.id="bn";bn.appendChild(el("span","vd",pass?"PASS":"FAIL"));bn.appendChild(el("span","sc",(d0.s*10)+"점 ("+d0.s+" / 10)"));bn.appendChild(el("span","wr",wr0.length?"틀린 문항: "+wr0.join(", ")+"번":"전 문항 정답"));bn.appendChild(el("span","rule",pass?"70점 이상 통과":"70점 미만: 클래스카드 추가학습을 하세요."));bn.appendChild(navBar());v.appendChild(bn)}
 var box=el("div",fin?"locked":"");
 p.items.forEach(function(it){
  var q=el("section","q");var h=el("div","qh");h.appendChild(el("span","qn",it.n));h.appendChild(el("span",null,LAB[it.t]));var okm=fin?done[p.id].ok[it.n]:null;if(fin){h.appendChild(el("span","mk "+(okm?"o1":"x1"),okm?"O":"X"));if(!okm)q.className+=" wrong"}q.appendChild(h);
  var qt=el("p","qt");
  if(it.t==="fill"){var parts=it.q.split(/(\[A\]|\[B\])/);parts.forEach(function(s){if(s==="[A]"||s==="[B]"){var k=s==="[A]"?0:1;var sel=el("select");var o0=el("option",null,s);o0.value="";sel.appendChild(o0);it.bank.forEach(function(w){var o=el("option",null,w);o.value=w;sel.appendChild(o)});var cu=(ans[p.id]||{})[it.n];if(cu&&cu[k])sel.value=cu[k];sel.onchange=function(){var c=((ans[p.id]||{})[it.n]||["",""]).slice();c[k]=sel.value;setAns(p,it,c);foot()};qt.appendChild(sel)}else qt.appendChild(document.createTextNode(s))});q.appendChild(qt)}
  else{if(it.t==="vocab"&&it.word){qt.innerHTML=esc(it.q).replace(esc(it.word),"<b>"+esc(it.word)+"</b>")}else qt.textContent=it.q;q.appendChild(qt)}
  if(it.t==="tf"){var g=el("div","tf");["T","F"].forEach(function(x){var b=el("button","o",x);b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===x));b.onclick=function(){setAns(p,it,x);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.opts){var g=el("div","opts");it.opts.forEach(function(t,i){var b=el("button","o");b.innerHTML="<i>"+(i+1)+"</i><span></span>";b.lastChild.textContent=t;b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===i+1));b.onclick=function(){setAns(p,it,i+1);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.t==="fill"){q.appendChild(el("p","bank","보기: "+it.bank.join(" / ")))}
  if(fin){var pk=(ans[p.id]||{})[it.n];if(it.t==="tf"){Array.prototype.forEach.call(q.querySelector(".tf").children,function(b){var v=b.textContent;if(v===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(v===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}else if(it.opts){Array.prototype.forEach.call(q.querySelector(".opts").children,function(b,i){if(i+1===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(i+1===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}}
  if(fin&&it.r){var rv=el("div","rv");
   var z1=el("div","zone z-tr");z1.appendChild(el("h4",null,"한글 해석"));
   function ln(l,t){var p2=el("p","ln");p2.appendChild(el("b",null,l));p2.appendChild(document.createTextNode(t));z1.appendChild(p2)}
   if(it.ko)ln("문제",it.ko);if(it.sko)ln("문장",it.sko);
   if(it.oko){var ol=el("ol");it.oko.forEach(function(x){ol.appendChild(el("li",null,x))});var lb=el("p","ln");lb.appendChild(el("b",null,"선택지"));z1.appendChild(lb);z1.appendChild(ol)}
   if(it.bko){var bl=el("p","ln");bl.appendChild(el("b",null,"보기 단어"));bl.appendChild(document.createTextNode(it.bank.map(function(w){return w+" "+(it.bko[w]||"")}).join(" / ")));z1.appendChild(bl)}
   if(z1.children.length>1)rv.appendChild(z1);
   var z2=el("div","zone z-an");z2.appendChild(el("h4",null,"정답 · 해설"));z2.appendChild(el("p","ra","정답: "+it.r.a));z2.appendChild(el("div","rl","교재 근거 ("+it.r.ev+")"));it.r.s.forEach(function(x){var d=el("div","rs");var e=el("span","en");e.appendChild(el("span","sn",x[0]+"번"));e.appendChild(document.createTextNode(x[1]));d.appendChild(e);d.appendChild(el("span","ko",x[2]));z2.appendChild(d)});z2.appendChild(el("div","rl","정리"));z2.appendChild(el("p","rw",it.r.w));rv.appendChild(z2);if(okm){rv.style.display="none";var tg=el("button","tgl","해설 보기");tg.onclick=function(){var s=rv.style.display==="none";rv.style.display=s?"block":"none";tg.textContent=s?"해설 닫기":"해설 보기"};q.appendChild(tg)}q.appendChild(rv)}
  box.appendChild(q)});
 v.appendChild(box);
 var sb=el("div","sbar");sb.id="sbar";v.appendChild(sb);foot();
 if(fin)showScore(p)}
function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
function showScore(p){var sb=document.getElementById("sbar");sb.innerHTML="";var d=done[p.id];var c=el("div","score");c.appendChild(el("span",null,readName(p)+" 점수"));c.appendChild(el("b",null,(d.s*10)+"점"));c.appendChild(el("span",null,d.s+" / 10 문항"));sb.style.display="block";sb.appendChild(c);sb.appendChild(navBar())}
boot();

function picker(){var v=document.getElementById("view");v.innerHTML="";
  var t=document.createElement("div");t.className="top";
  t.innerHTML='<span class="tk">EXIT TEST</span><h1></h1><p class="sub">Reading별 10문항</p>';t.querySelector("h1").textContent=document.title.replace(/ Exit Test$/,"");v.appendChild(t);
  var last=null;
  P.forEach(function(p){
    if(p.u!==last){last=p.u;var g=document.createElement("div");g.className="grp";g.textContent=secName(p.u);v.appendChild(g)}
    var ok=ready(p.id);
    var r=document.createElement(ok?"a":"div");r.className="pk"+(ok?"":" lk");if(ok)r.href="?r="+encodeURIComponent(p.id);
    var l=document.createElement("div");var b=document.createElement("b");b.textContent=readName(p);var s=document.createElement("span");s.className="t";s.textContent=p.ko;l.appendChild(b);l.appendChild(s);r.appendChild(l);
    var st=document.createElement("span");st.className="st";st.textContent=ok?"응시 가능":"잠김";r.appendChild(st);v.appendChild(r)});
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("홈으로","../",true));v.appendChild(n)}
function gate(p){var v=document.getElementById("view");v.innerHTML="";v.appendChild(testHead(p));
  var g=document.createElement("div");g.className="gate";g.innerHTML="<b>아직 응시할 수 없어요</b><p>지문 읽기와 문제 선지를 모두 마친 뒤에 열려요.</p>";v.appendChild(g);
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("이 Reading으로 돌아가기","../?r="+encodeURIComponent(p.id),true));n.appendChild(lnk("Exit test 목록","./"));v.appendChild(n)}
function boot(){var m=/[?&]r=([^&]+)/.exec(location.search);
  if(m){var id=decodeURIComponent(m[1]);var p=P.filter(function(x){return x.id===id})[0];
    if(p){cur=id;if(!ready(id)){gate(p);return}view();return}}
  picker()}
