ity, struggling to move forward under the weight of their unresolved pasts.","일부 개인들은 해결되지 않은 과거의 부담 아래서 앞으로 나아가기 위해 고군분투하며 불안정의 순환에 갇힌 자신을 발견한다."]],"w":"11번 문장에서 일부 개인들은 해결되지 않은 과거의 부담 아래서 불안정의 순환에 갇힌 자신을 발견한다고 해요.","c":"T"},"h":"9e5d8329be"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (..., unable to find closure or understand why their loved ones vanished.)","ko":"…종결을 찾지 못하거나 왜 그들의 사랑하는 사람들이 사라졌는지 이해하지 못한다.","opts":["시작","종결","경쟁","환영"],"word":"closure","r":{"a":"2) 종결","ev":"12번 문장","s":[[12,"The families left behind also suffer the emotional toll of these decisions, unable to find closure or understand why their loved ones vanished.","남겨진 가족들 또한 이러한 결정에 따른 감정적 대가를 치르며, 종결을 찾지 못하거나 왜 그들의 사랑하는 사람들이 사라졌는지 이해하지 못한다."]],"w":"남겨진 가족들은 사랑하는 사람이 왜 사라졌는지 알지 못해서 마음의 정리를 하지 못해요. closure = 종결, 마음의 정리예요.","c":2},"h":"3ef676a650"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (..., often driven by overwhelming shame or societal expectations, ...)","ko":"…종종 압도적인 수치심이나 사회적 기대에 의해 주도되는…","opts":["압도적인","사소한","즐거운","일시적인"],"word":"overwhelming","r":{"a":"1) 압도적인","ev":"3번 문장","s":[[3,"This phenomenon allows individuals to escape the pressures of modern society, often driven by overwhelming shame or societal expectations, and essentially reset their lives.","이 현상은 개인들이 종종 압도적인 수치심이나 사회적 기대에 의해 주도되는 현대 사회의 압박에서 벗어나 본질적으로 그들의 삶을 재설정할 수 있게 해준다."]],"w":"사회를 떠나게 만들 만큼 큰 수치심이라는 뜻이에요. overwhelming = 압도적인.","c":1},"h":"aa45d953f1"},{"n":6,"t":"ref","q":"What does the underlined \"this idea\" refer to?\nIn Japan, this idea is a reality for many who choose to undergo Jouhatsu, or human evaporation.","ko":"밑줄 친 this idea가 가리키는 것은?","sko":"일본에서, 이 아이디어는 ‘조하츠’, 즉 인간 증발을 겪기로 선택한 많은 사람에게 현실이다.","opts":["이혼 후 새 가정을 꾸리는 것","외국으로 이민 가는 것","직장에서 승진하는 것","모든 것을 뒤로하고 사회에서 완전히 사라져 새롭게 시작하는 것"],"r":{"a":"4) 모든 것을 뒤로하고 사회에서 완전히 사라져 새롭게 시작하는 것","ev":"1~2번 문장","s":[[1,"Have you ever considered disappearing from society entirely, leaving everything behind to start fresh?","모든 것을 뒤로하고 새롭게 시작하기 위해 사회에서 완전히 사라지는 것을 고려해 본 적이 있는가?"],[2,"In Japan, this idea is a reality for many who choose to undergo Jouhatsu, or human evaporation.","일본에서, 이 아이디어는 ‘조하츠’, 즉 인간 증발을 겪기로 선택한 많은 사람에게 현실이다."]],"w":"1번이 ‘모든 것을 뒤로하고 사회에서 완전히 사라져 새롭게 시작하는 것을 고려해 본 적이 있는가?’라는 질문이에요. 2번 this idea가 그 아이디어를 받아 일본에서는 현실이라고 말해요.","c":4},"h":"8a04e7a50b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Despite the seemingly complete erasure of their past lives, Jouhatsu does not always lead to a fresh start.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들의 과거 삶이 겉보기에는 완전히 지워진 것 같음에도 불구하고, ‘조하츠’가 항상 새로운 시작으로 이어지는 것은 아니다.","opts":["과거의 삶이 완전히 지워졌기 때문에, 조하츠는 언제나 새로운 시작으로 이어진다.","과거의 삶이 지워진 것처럼 보이지 않지만, 조하츠는 항상 새로운 시작이 된다.","과거의 삶이 겉보기에 완전히 지워진 것 같아도, 조하츠가 항상 새로운 시작으로 이어지는 것은 아니다.","과거의 삶이 완전히 지워졌지만, 조하츠는 아무에게도 새로운 시작이 되지 못한다."],"r":{"a":"3) 과거의 삶이 겉보기에 완전히 지워진 것 같아도, 조하츠가 항상 새로운 시작으로 이어지는 것은 아니다.","ev":"10번 문장","s":[[10,"Despite the seemingly complete erasure of their past lives, Jouhatsu does not always lead to a fresh start.","그들의 과거 삶이 겉보기에는 완전히 지워진 것 같음에도 불구하고, ‘조하츠’가 항상 새로운 시작으로 이어지는 것은 아니다."]],"w":"Despite는 ‘~에도 불구하고’이고, seemingly는 ‘겉보기에는’이에요. does not always는 ‘항상 ~인 것은 아니다’라는 부분 부정이라 ‘아무에게도 되지 못한다’는 뜻이 아니에요.","c":3},"h":"c5f6ce86bb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사라진 사람들은 예전 이름을 그대로 쓰며 같은 지역으로 옮겨진다.","야반도주 서비스 비용은 사람 수, 소유물의 양, 이동 거리에 따라 달라진다.","당국은 조하츠가 불법이므로 모든 사건을 조사한다.","일본에서는 매년 약 1,000명이 증발한다."],"opts":["The vanished people keep their old names and move to the same area.","The cost of night moving services depends on the people, possessions, and distance involved.","Authorities investigate every case of Jouhatsu because it is illegal.","About 1,000 people evaporate in Japan every year."],"r":{"a":"2) The cost of night moving services depends on the people, possessions, and distance involved.","ev":"7번 문장","s":[[7,"Many pay companies that offer night moving services to help them disappear, with costs varying depending on the number of people involved, how many possessions they have, and how far they wish to go.","많은 사람이 그들이 사라지는 것을 돕기 위해 야반도주 서비스를 제공하는 회사에 돈을 지불하는데, 비용은 관련된 사람의 수, 그들이 가진 소유물의 양, 그리고 그들이 얼마나 멀리 가기를 원하느냐에 따라 달라진다."]],"w":"7번에서 비용이 관련된 사람의 수, 소유물의 양, 가려는 거리에 따라 달라진다고 해요. 사라진 사람은 새 이름으로 새 지역에 가고(8번), 당국은 조사할 근거가 없고(9번), 매년 약 10만 명이 증발해요(6번).","c":2},"h":"ba2694bbfb"},{"n":9,"t":"sum","q":"People in Japan use Jouhatsu to (A) social pressures, but they and their families may still (B).","ko":"일본 사람들은 사회적 압박을 (A)하려고 조하츠를 이용하지만, 그들과 그들의 가족은 여전히 (B)할 수 있다.","oko":["(A) 마주하다 / (B) 기뻐하다","(A) 벗어나다 / (B) 기뻐하다","(A) 마주하다 / (B) 고통받다","(A) 벗어나다 / (B) 잊다","(A) 벗어나다 / (B) 고통받다"],"opts":["(A) face / (B) celebrate","(A) escape / (B) celebrate","(A) face / (B) suffer","(A) escape / (B) forget","(A) escape / (B) suffer"],"r":{"a":"5) (A) escape / (B) suffer","ev":"3번, 12번 문장","s":[[3,"This phenomenon allows individuals to escape the pressures of modern society, often driven by overwhelming shame or societal expectations, and essentially reset their lives.","이 현상은 개인들이 종종 압도적인 수치심이나 사회적 기대에 의해 주도되는 현대 사회의 압박에서 벗어나 본질적으로 그들의 삶을 재설정할 수 있게 해준다."],[12,"The families left behind also suffer the emotional toll of these decisions, unable to find closure or understand why their loved ones vanished.","남겨진 가족들 또한 이러한 결정에 따른 감정적 대가를 치르며, 종결을 찾지 못하거나 왜 그들의 사랑하는 사람들이 사라졌는지 이해하지 못한다."]],"w":"3번에서 조하츠는 현대 사회의 압박에서 벗어나게(escape) 해 줘요. 12번에서 남겨진 가족들은 감정적 대가를 치르며(suffer) 11번에서는 본인도 불안정에 갇혀요.","c":5},"h":"48df7bb34f"},{"n":10,"t":"fill","q":"Today, about 100,000 people in Japan evaporate [A], and the most common reasons include financial [B], job loss, and relationship issues.","ko":"오늘날 일본에서는 매년 약 10만 명이 증발하는데, 가장 흔한 이유는 재정적 [B], 실직, 그리고 관계 문제를 포함한다. ([A]는 ‘매년’에 해당)","bank":["annually","difficulties","phenomenon","stigma","possessions","closure"],"bko":{"annually":"매년","difficulties":"어려움","phenomenon":"현상","stigma":"낙인","possessions":"소유물","closure":"종결"},"r":{"a":"[A] annually, [B] difficulties","ev":"6번 문장","s":[[6,"Today, about 100,000 people in Japan evaporate annually; the most common reasons include financial difficulties, job loss, and relationship issues.","오늘날, 일본에서는 매년 약 10만 명의 사람들이 증발하는데, 가장 흔한 이유는 재정적 어려움, 실직, 그리고 관계 문제를 포함한다."]],"w":"6번에서 일본에서는 매년(annually) 약 10만 명이 증발하고, 가장 흔한 이유는 재정적 어려움(financial difficulties), 실직, 관계 문제예요. phenomenon, stigma, possessions, closure는 이 문장에 들어가지 않고 다른 문장에 나와요.","c":null},"h":"b13fbc6658"}]}];

function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
