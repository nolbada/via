rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "Club News · Spreading Cheer Everywhere", "en": "Let's meeting Fly High, our school's cheerleading club.", "ko": "우리 학교의 응원 동아리 Fly High를 만나봅시다.", "ok": false, "foot": ["1cheerleading 치어리딩; 응원"], "fixes": [{"wrong": "meeting", "right": "meet", "partial": false, "at": [1], "point": "Let's(=Let us) 뒤에는 동사원형 사용", "topic": "어법", "memo": "Let's(=Let us) 뒤에는 동사원형 사용"}]}, {"n": 2, "tag": null, "en": "The club started from an idea who one student had two years ago.", "ko": "그 동아리는 2년 전 한 학생이 낸 아이디어에서 시작되었습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "who", "right": "that", "partial": false, "at": [6], "point": "관계대명사: 선행사 idea(사물)이므로 who 대신 that(또는 which) 사용", "topic": "관계대명사", "memo": "선행사 idea(사물)이므로 who 대신 that(또는 which) 사용"}]}, {"n": 3, "tag": null, "en": "Now, there are 10 girls and 6 boys in the club. Each member has special energies.", "ko": "이제는, 그 동아리에 10명의 소녀와 6명의 소년이 있습니다. 각 멤버는 특별한 에너지를 가지고 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "energies", "right": "energy", "partial": false, "at": [15], "point": "어휘: energy(에너지)는 셀 수 없는 명사이므로 복수형 사용 불가", "topic": "어휘", "memo": "energy(에너지)는 셀 수 없는 명사이므로 복수형 사용 불가"}]}, {"n": 4, "tag": null, "en": "Do you remembers the recent school basketball game? After two quarters, our team were losing by 20 points. During halftime, Fly High came on the court.", "ko": "여러분은 최근 학교 농구 경기를 기억하나요? 2쿼터 후에, 우리 팀은 20점 차이로 지고 있었습니다. 하프 타임 동안, Fly High가 코트에 나왔습니다.", "ok": false, "foot": ["1quarter (농구 등 경기의) 쿼터, ~회"], "fixes": [{"wrong": "remembers", "right": "remember", "partial": false, "at": [2], "point": "조동사 Do 뒤에는 동사원형 remember 사용", "topic": "어법", "memo": "조동사 Do 뒤에는 동사원형 remember 사용"}, {"wrong": "were", "right": "was", "partial": false, "at": [13], "point": "수일치: team은 단수 취급하는 집합명사이므로 was 사용", "topic": "수일치", "memo": "team은 단수 취급하는 집합명사이므로 was 사용"}]}, {"n": 5, "tag": null, "en": "They performed as wonderful as a professional cheer team.", "ko": "그들은 프로 응원팀만큼 멋지게 공연했습니다.", "ok": false, "foot": [], "fix fe 사용", "topic": "5형식 keep+목적어+형용사보어", "memo": "safe 사용"}]}, {"n": 30, "tag": null, "en": "So, if you see Carebot, don't be shy and says hello.", "ko": "그러니, 만약 여러분이 Carebot을 본다면, 수줍어하지 말고 인사해 주세요.\"", "ok": false, "foot": [], "fixes": [{"wrong": "says", "right": "say", "partial": false, "at": [9], "point": "명령문의 병렬구조: don't be와 마찬가지로 동사원형 say 사용", "topic": "명령문의 병렬구조", "memo": "don't be와 마찬가지로 동사원형 say 사용"}]}];var PP=[["Let's meet Fly High, our school's cheerleading club.", "우리 학교의 응원 동아리 Fly High를 만나봅시다.", 0], ["The club started from an idea that one student had two years ago.", "그 동아리는 2년 전 한 학생이 낸 아이디어에서 시작되었습니다.", 0], ["Now, there are 10 girls and 6 boys in the club. Each member has special energy.", "이제는, 그 동아리에 10명의 소녀와 6명의 소년이 있습니다. 각 멤버는 특별한 에너지를 가지고 있습니다.", 0], ["Do you remember the recent school basketball game? After two quarters, our team was losing by 20 points. During halftime, Fly High came on the court.", "여러분은 최근 학교 농구 경기를 기억하나요? 2쿼터 후에, 우리 팀은 20점 차이로 지고 있었습니다. 하프 타임 동안, Fly High가 코트에 나왔습니다.", 0], ["They performed as wonderfully as a professional cheer team.", "그들은 프로 응원팀만큼 멋지게 공연했습니다.", 0], ["They flipped in the air and made a human pyramid. The crowd cheered so loudly that the whole gym shook.", "그들은 공중에서 돌았고 인간 피라미드를 만들었습니다. 관중이 너무 크게 응원해서 체육관 전체가 흔들렸습니다.", 0], ["Then they shouted, \"Never give up!\" And guess what? Our team won the game in the end.", "그러고 나서 그들은 \"절대 포기하지 마!\"라고 외쳤습니다. 그리고 어떻게 되었을까요? 결국에는 우리 팀이 그 경기에서 이겼습니다.", 0], ["Jina, the captain of the club, said, \"I can flip in the air because I trust my club members.", "그 동아리의 회장인 지나는 말했습니다, \"나는 동아리 멤버들을 믿기 때문에 공중에서 돌 수 있어요.", 0], ["When I see the crowd cheering and screaming, I feel proud.", "관중들이 응원하고 소리치는 것을 볼 때, 나는 자랑스럽습니다.", 0], ["Fly High is the best part of my middle school life!\" You can watch Fly High doing their performance at the school festival next week.", "Fly High는 나의 중학교 생활 중 최고의 부분입니다!\" 다음 주 학교 축제에서 Fly High가 공연하는 것을 볼 수 있습니다.", 0], ["Come and feel their energy!", "오셔서 그들의 에너지를 느껴 보세요!", 0], ["What do you do with your money?", "당신은 당신의 돈으로 무엇을 하나요?", 0], ["Do you save it or spend it?", "그것을 저축하나요 아니면 소비하나요?", 0], ["We asked the following questions to 100 students from our school.", "우리는 우리 학교 학생 100명에게 다음의 질문을 했습니다.", 0], ["Let's look at the results.", "그 결과를 살펴봅시다.", 0], ["Do you have a spending plan? What do you spend the most money on?", "당신은 지출 계획을 가지고 있나요? 당신은 무엇에 가장 많은 돈을 소비하나요?", 0], ["Do you save money?", "당신은 돈을 저축하나요?", 0], ["Surprisingly, the survey showed that only 15 out of 100 students had a spending plan.", "놀랍게도, 그 설문 조사는 100명의 학생들 중 오직 15명만이 지출 계획을 가지고 있다는 것을 보여 주었습니다.", 0], ["The survey also showed what the students spent the most money on.", "그 설문 조사는 또한 그 학생들이 무엇에 가장 많은 돈을 소비하는지 보여 주었습니다.", 0], ["Food was chosen by the largest number of students.", "음식이 가장 많은 수의 학생들의 선택을 받았습니다.", 0], ["Transportation followed food.", "교통이 음식의 뒤를 이었습니다.", 0], ["Although 80 percent of 3rd-year students saved money, only 30 percent of 1st-year students saved money.", "또한, 3학년 학생의 80%는 돈을 저축했지만, 1학년 학생의 겨우 30%만이 돈을 저축했습니다.", 0], ["Money doesn't grow on trees.", "돈은 나무에서 자라지 않습니다.", 0], ["It is very important to plan your spending!", "여러분의 소비를 계획하는 것은 매우 중요합니다!", 0], ["Everyone needs good spending habits.", "모든 사람은 좋은 지출 습관이 필요하지요.", 0], ["Next week, every student will get a money diary.", "다음 주에, 모든 학생들은 용돈 기입장을 받게 될 것입니다.", 0], ["Come and meet Carebot, our new AI healthcare robot, in the school nurse's office. What can Carebot do?", "오셔서 학교 보건실에서 우리의 새로운 인공 지능 건강 관리 로봇인 Carebot을 만나 보세요. Carebot이 무엇을 할 수 있을까요?", 0], ["It can check the students' health condition and give them advice.", "그것은 학생들의 건강 상태를 확인하고 그들에게 조언을 해 줄 수 있습니다.", 0], ["Our school nurse, Ms. Kang, says, \"Carebot is working hard to keep everyone healthy and safe.", "우리의 보건 선생님인 강 선생님은 말씀하십니다, \"Carebot은 모두를 건강하고 안전하게 하고자 열심히 일하고 있습니다.", 0], ["So, if you see Carebot, don't be shy and say hello.", "그러니, 만약 여러분이 Carebot을 본다면, 수줍어하지 말고 인사해 주세요.\"", 0]];var RNUM=55;var TITLE_EN="Voice of Teens";var PASS_EN=["Voice of Teens", "Let's meet Fly High, our school's cheerleading club. The club started from an idea that one student had two years ago. Now, there are 10 girls and 6 boys in the club. Each member has special energy. Do you remember the recent school basketball game? After two quarters, our team was losing by 20 points. During halftime, Fly High came on the court. They performed as wonderfully as a professional cheer team. They flipped in the air and made a human pyramid. The crowd cheered so loudly that the whole gym shook. Then they shouted, \"Never give up!\" And guess what? Our team won the game in the end.", "Jina, the captain of the club, said, \"I can flip in the air because I trust my club members. When I see the crowd cheering and screaming, I feel proud. Fly High is the best part of my middle school life!\" You can watch Fly High doing their performance at the school festival next week. Come and feel their energy!", "What do you do with your money? Do you save it or spend it? We asked the following questions to 100 students from our school. Let's look at the results. Do you have a spending plan? What do you spend the most money on? Do you save money? Surprisingly, the survey showed that only 15 out of 100 students had a spending plan. The survey also showed what the students spent the most money on. Food was chosen by the largest number of students. Transportation followed food. Although 80 percent of 3rd-year students saved money, only 30 percent of 1st-year students saved money.", "Money doesn't grow on trees. It is very important to plan your spending! Everyone needs good spending habits. Next week, every student will get a money diary.", "Come and meet Carebot, our new AI healthcare robot, in the school nurse's office. What can Carebot do? It can check the students' health condition and give them advice. Our school nurse, Ms. Kang, says, \"Carebot is working hard to keep everyone healthy and safe. So, if you see Carebot, don't be shy and say hello."];var PASS_KO=["십 대들의 목소리", "우리 학교의 응원 동아리 Fly High를 만나봅시다. 그 동아리는 2년 전 한 학생이 낸 아이디어에서 시작되었습니다. 이제는, 그 동아리에 10명의 소녀와 6명의 소년이 있습니다. 각 멤버는 특별한 에너지를 가지고 있습니다. 여러분은 최근 학교 농구 경기를 기억하나요? 2쿼터 후에, 우리 팀은 20점 차이로 지고 있었습니다. 하프 타임 동안, Fly High가 코트에 나왔습니다. 그들은 프로 응원팀만큼 멋지게 공연했습니다. 그들은 공중에서 돌았고 인간 피라미드를 만들었습니다. 관중이 너무 크게 응원해서 체육관 전체가 흔들렸습니다. 그러고 나서 그들은 \"절대 포기하지 마!\"라고 외쳤습니다. 그리고 어떻게 되었을까요? 결국에는 우리 팀이 그 경기에서 이겼습니다.", "그 동아리의 회장인 지나는 말했습니다, \"나는 동아리 멤버들을 믿기 때문에 공중에서 돌 수 있어요. 관중들이 응원하고 소리치는 것을 볼 때, 나는 자랑스럽습니다. Fly High는 나의 중학교 생활 중 최고의 부분입니다!\" 다음 주 학교 축제에서 Fly High가 공연하는 것을 볼 수 있습니다. 오셔서 그들의 에너지를 느껴 보세요!", "당신은 당신의 돈으로 무엇을 하나요? 그것을 저축하나요 아니면 소비하나요? 우리는 우리 학교 학생 100명에게 다음의 질문을 했습니다. 그 결과를 살펴봅시다. 당신은 지출 계획을 가지고 있나요? 당신은 무엇에 가장 많은 돈을 소비하나요? 당신은 돈을 저축하나요? 놀랍게도, 그 설문 조사는 100명의 학생들 중 오직 15명만이 지출 계획을 가지고 있다는 것을 보여 주었습니다. 그 설문 조사는 또한 그 학생들이 무엇에 가장 많은 돈을 소비하는지 보여 주었습니다. 음식이 가장 많은 수의 학생들의 선택을 받았습니다. 교통이 음식의 뒤를 이었습니다. 또한, 3학년 학생의 80%는 돈을 저축했지만, 1학년 학생의 겨우 30%만이 돈을 저축했습니다.", "돈은 나무에서 자라지 않습니다. 여러분의 소비를 계획하는 것은 매우 중요합니다! 모든 사람은 좋은 지출 습관이 필요하지요. 다음 주에, 모든 학생들은 용돈 기입장을 받게 될 것입니다.", "오셔서 학교 보건실에서 우리의 새로운 인공 지능 건강 관리 로봇인 Carebot을 만나 보세요. Carebot이 무엇을 할 수 있을까요? 그것은 학생들의 건강 상태를 확인하고 그들에게 조언을 해 줄 수 있습니다. 우리의 보건 선생님인 강 선생님은 말씀하십니다, \"Carebot은 모두를 건강하고 안전하게 하고자 열심히 일하고 있습니다. 그러니, 만약 여러분이 Carebot을 본다면, 수줍어하지 말고 인사해 주세요.\""];var DG=[{"dlg": [["Jake", "Ms. Hong, may I come in?", "홍 선생님, 들어가도 될까요?"], ["Ms. Hong", "Sure, Jake. What's wrong?", "물론이지, Jake. 무슨 일 있니?"], ["Jake", "I feel stressed about the exams next week.", "다음 주 시험 때문에 스트레스를 받아요."], ["Ms. Hong", "Oh, no. How often do you feel this way?", "저런. 얼마나 자주 그렇게 느끼니?"], ["Jake", "Almost every time I think about exams.", "시험에 대해 생각할 때마다 거의 매번이요."], ["Ms. Hong", "I understand. It's important to manage your stress during exams.", "이해해. 시험 기간에는 스트레스를 관리하는 것이 중요하단다."], ["Jake", "But I don't know how. What should I do?", "하지만 방법을 모르겠어요. 어떻게 해야 하나요?"], ["Ms. Hong", "You can take a walk and get some fresh air. Also, you c
