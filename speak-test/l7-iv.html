<!DOCTYPE html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>7과 구술 면접</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:"Malgun Gothic","Apple SD Gothic Neo",sans-serif;background:#1d2733;color:#eef1f4}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 60px}
h1{font-size:22px;letter-spacing:1px;margin:6px 0 4px}
.sub{font-size:14px;color:#9fb0c0;margin-bottom:18px}
.card{background:#f7f6f2;color:#222;border-radius:10px;padding:18px;margin-bottom:14px}
.dark{background:#273445;color:#eef1f4}
.tag{display:inline-block;font-size:13px;background:#2f4858;color:#fff;border-radius:4px;padding:2px 8px;margin-right:6px}
.tag.d{background:#7a4b2a}
.ctx{background:#fff;border:1px solid #ddd9cf;border-radius:8px;padding:12px;font-size:17px;line-height:1.7;margin:10px 0}
.ctx b{background:#ffe27a;padding:0 2px}
.q{font-size:21px;line-height:1.6;margin:10px 0}
input[type=text]{width:100%;font-size:18px;padding:12px;border:1px solid #bbb;border-radius:8px}
button{font-family:inherit;font-size:18px;border:0;border-radius:8px;padding:15px 18px;background:#c9a227;color:#222;width:100%;margin-top:12px}
button.g{background:#3a4a5d;color:#eef1f4}
.bar{height:8px;background:#3a4a5d;border-radius:4px;overflow:hidden;margin-top:10px}
.bar i{display:block;height:100%;width:0;background:#c9a227}
.bar.rec i{background:#d9503c}
.state{text-align:center;font-size:18px;margin-top:12px;min-height:26px}
.timer{font-size:34px;text-align:center;font-variant-numeric:tabular-nums}
.heard{min-height:50px;margin-top:10px;padding:10px;border:1px dashed #6d7f93;border-radius:8px;font-size:16px;line-height:1.5;color:#c9d3dd}
.crit{font-size:14px;line-height:1.7;color:#c9d3dd}
.row{border-top:1px solid #e3e0d6;padding:10px 0;font-size:16px;line-height:1.6}
.row:first-child{border-top:0}
.ok{color:#1f7a4d;font-weight:bold}.no{color:#b3402f;font-weight:bold}
.small{font-size:14px;color:#666}
.hide{display:none}
</style>
</head>
<body>
<div class="wrap">
<h1>7과 구술 면접</h1>
<div class="sub">ORAL INTERVIEW &middot; Lesson 7 &middot; 8문항</div>

<div id="s-name" class="card dark">
 <div class="crit">질문이 나오면 5초 뒤 자동으로 녹음이 시작됩니다. 한 문항에 한 번만 답할 수 있습니다.<br>
 채점은 문장을 그대로 외웠는지가 아니라 핵심어가 들어 있는지를 봅니다. 한국어든 영어든 괜찮고, 핵심어가 같은 뜻이면 인정됩니다. 마지막 화면에서 내 해설지로 이동합니다.</div>
 <input type="text" id="name" placeholder="이름" autocomplete="off" style="margin-top:12px">
 <button id="btn-start">면접 시작</button>
 <div id="kakao" class="hide crit" style="margin-top:12px">카카오톡 안에서는 마이크가 막힐 수 있습니다.<button id="btn-ext" class="g">다른 브라우저로 열기</button></div>
 <div id="nosupport" class="hide crit" style="margin-top:12px;color:#ff9b8a">이 브라우저는 음성인식을 지원하지 않습니다. 크롬으로 열어 주세요.</div>
</div>

<div id="s-q" class="hide">
 <div class="card">
  <div><span class="tag" id="tag"></span><span class="small" id="prog"></span></div>
  <div class="ctx" id="ctx"></div>
  <div class="q" id="qtext"></div>
 </div>
 <div class="card dark">
  <div class="state" id="state"></div>
  <div class="bar" id="bar"><i id="fill"></i></div>
  <div class="heard" id="heard"></div>
  <button id="btn-done" class="g hide">답변 끝</button>
  <button id="btn-rec" class="hide">녹음 시작</button>
 </div>
</div>

<div id="s-end" class="hide">
 <div class="card" id="summary"></div>
 <button id="btn-review">내 해설지 보기</button>
 <button id="btn-reset" class="g">다음 학생</button>
</div>
</div>
<script src="l7-data.js"></script>
<script>
const READY=5, LIMIT=20, SILENCE=2500;
const norm=s=>(s||"").toLowerCase().replace(/[\s.,!?'"“”‘’~·\-]/g,"");
function judge(it,text){const t=norm(text);if(it.free)return{pass:t.length>=it.min,hit:[]};
 const hit=it.keys.map(g=>g.some(w=>t.includes(norm(w))));return{pass:hit.filter(Boolean).length>=it.need,hit};}
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function pickDistinct(cat,n){const out=[],used={};shuffle(Q.filter(q=>q.cat===cat)).forEach(q=>{if(out.length<n&&!used[q.grp]){used[q.grp]=1;out.push(q);}});return out;}
function draw(){const r=pickDistinct("본문",4),d=pickDistinct("대화문",3),t=shuffle(Q.filter(q=>q.cat==="생각"))[0];
 const mix=[];for(let i=0;i<4;i++){mix.push(r[i]);if(d[i])mix.push(d[i]);}return mix.concat([t]);}
const $=id=>document.getElementById(id);
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
let name="",picks=[],idx=0,results=[],rec=null,heard="",tries=0,tReady=null,tRec=null,tSil=null,t0=0,finished=false;
if(/KAKAOTALK/i.test(navigator.userAgent)){$("kakao").classList.remove("hide");}
$("btn-ext").onclick=()=>{location.href="kakaotalk://web/openExternal?url="+encodeURIComponent(location.href);};
if(!SR)$("nosupport").classList.remove("hide");
function esc(s){return s.replace(/&/g,"&amp;").replace(/</g,"&lt;");}
function showQ(){const it=picks[idx];heard="";tries=0;finished=false;
 $("s-q").classList.remove("hide");
 $("tag").textContent=it.cat==="생각"?"생각 묻기":it.cat+" · "+it.type;
 $("prog").textContent=(idx+1)+" / "+picks.length;
 let c=P[it.p].slice(it.r[0],it.r[1]).map(esc).join(it.cat==="대화문"?"<br>":" ");
 if(it.mk)c=c.split(esc(it.mk)).join("<b>"+esc(it.mk)+"</b>");
 $("ctx").innerHTML=c;$("qtext").textContent=it.q;$("heard").textContent="";
 $("btn-done").classList.add("hide");$("btn-rec").classList.add("hide");
 ready();}
function setBar(p,r){$("fill").style.width=p+"%";$("bar").className="bar"+(r?" rec":"");}
function ready(){let s=READY;$("state").textContent="준비 "+s+"초 · 질문을 읽으세요";setBar(0,false);
 clearInterval(tReady);tReady=setInterval(()=>{s--;setBar((READY-s)/READY*100,false);
  if(s<=0){clearInterval(tReady);startRec();}else $("state").textContent="준비 "+s+"초 · 질문을 읽으세요";},1000);}
function startRec(){heard="";finished=false;$("heard").textContent="";
 try{rec=new SR();}catch(e){manual();return;}
 rec.lang="ko-KR";rec.continuous=true;rec.interimResults=true;
 rec.onresult=e=>{let t="";for(let i=0;i<e.results.length;i++)t+=e.results[i][0].transcript+" ";heard=t.trim();$("heard").textContent=heard;
  clearTimeout(tSil);tSil=setTimeout(()=>finishTry(),SILENCE);};
 rec.onerror=e=>{if(e.error==="not-allowed"||e.error==="service-not-allowed"){manual();}};
 rec.onend=()=>{if(!finished&&t0&&Date.now()-t0<LIMIT*1000-300){try{rec.start();}catch(e){}}};
 try{rec.start();}catch(e){manual();return;}
 t0=Date.now();$("btn-done").classList.remove("hide");$("btn-rec").classList.add("hide");
 $("state").textContent="녹음 중 · 말씀하세요";setBar(0,true);
 clearInterval(tRec);tRec=setInterval(()=>{const p=(Date.now()-t0)/(LIMIT*1000)*100;setBar(Math.min(p,100),true);
  if(p>=100)finishTry();},200);}
function manual(){clearInterval(tReady);$("state").textContent="녹음 시작 버튼을 눌러 주세요";$("btn-rec").classList.remove("hide");}
$("btn-rec").onclick=()=>{$("btn-rec").classList.add("hide");startRec();};
$("btn-done").onclick=()=>finishTry();
function stopAll(){finished=true;clearInterval(tRec);clearInterval(tReady);clearTimeout(tSil);t0=0;try{rec&&rec.stop();}catch(e){}$("btn-done").classList.add("hide");}
function finishTry(){if(finished)return;stopAll();
 if(!heard&&tries<1){tries++;$("state").textContent="소리가 인식되지 않았습니다. 다시 한 번 말씀하세요.";setTimeout(()=>{finished=false;startRec();},1500);return;}
 const it=picks[idx],j=judge(it,heard);
 results.push({id:it.id,pass:j.pass?1:0,hit:j.hit.map(h=>h?1:0),said:heard});
 $("state").textContent="답변이 기록되었습니다";setBar(100,false);
 setTimeout(()=>{idx++;if(idx<picks.length)showQ();else showEnd();},1400);}
function reviewURL(){const d={n:name,a:results.map(r=>[r.id,r.pass,r.said,r.hit.join("")])};
 return "l7-review.html#d="+btoa(unescape(encodeURIComponent(JSON.stringify(d))));}
function showEnd(){$("s-q").classList.add("hide");$("s-end").classList.remove("hide");
 const scored=results.filter((r,i)=>picks[i].cat!=="생각"),ok=scored.filter(r=>r.pass).length;
 let h="<div style='font-size:20px;margin-bottom:8px'>"+esc(name)+" 면접 결과 &nbsp; <b>"+ok+" / "+scored.length+"</b></div>";
 results.forEach((r,i)=>{const it=picks[i];let line;
  if(it.cat==="생각")line="<span class='small'>기록</span> "+esc(r.said||"(인식된 말 없음)");
  else{const m=it.keys.map((g,k)=>r.hit[k]?g[0]:null).filter(Boolean);
   line=(r.pass?"<span class='ok'>통과</span>":"<span class='no'>다시 확인</span>")+" <span class='small'>인정된 핵심어: "+(m.length?m.map(esc).join(", "):"없음")+"</span>";}
  h+="<div class='row'><div class='small'>"+(i+1)+". "+esc(it.cat+" · "+it.type)+"</div>"+esc(it.q)+"<br>"+line+"</div>";});
 $("summary").innerHTML=h;}
$("btn-review").onclick=()=>{location.href=reviewURL();};
$("btn-reset").onclick=()=>location.reload();
$("btn-start").onclick=()=>{name=$("name").value.trim();if(!name){$("name").focus();return;}
 if(!SR)return;picks=draw();idx=0;results=[];$("s-name").classList.add("hide");
 navigator.mediaDevices&&navigator.mediaDevices.getUserMedia?navigator.mediaDevices.getUserMedia({audio:true}).then(s=>{s.getTracks().forEach(t=>t.stop());showQ();}).catch(()=>{showQ();}):showQ();};
</script>
</body>
</html>
