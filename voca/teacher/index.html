<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주성고 어휘 함정 피하기 - 선생님용</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../app.css">
</head>
<body>
<main class="wrap">
  <header><div class="brand">동남비타민영어학원 · 선생님용</div><h1>어휘 <em>함정</em> 피하기</h1>
  <p class="sub">학생 링크 모음과 학생 기록 코드 읽기</p></header>
  <section class="panel"><h2>학생 링크 <span id="cnt"></span></h2><div class="rows" id="links"></div></section>
  <section class="panel tool"><h2>학생 기록 코드 읽기</h2>
    <p class="note">구글 시트 '현황' 탭의 '코드' 칸 값을 복사해 붙여넣으세요. 이 화면은 읽기만 하고 아무것도 저장하지 않습니다.</p>
    <textarea id="in" placeholder="V1. 로 시작하는 코드"></textarea>
    <div class="btnrow"><button class="btn pri" id="go">읽기</button></div>
    <div id="out" style="margin-top:12px"></div></section>
</main>
<script src="../data/index.js"></script>
<script>
(function(){
  var reg=window.VOCAREG||[],base=location.href.replace(/teacher\/.*$/,'');
  window.VOCADATA=window.VOCADATA||{};
  var left=reg.length;
  function ready(){render()}
  reg.forEach(function(r){var s=document.createElement('script');s.src='../data/'+r.id+'.js';s.onload=s.onerror=function(){if(--left===0)ready()};document.head.appendChild(s)});
  if(!reg.length)ready();
  function render(){
    var core=null;
    var s=document.createElement('script');s.src='../app.js';s.onload=function(){core=window.VocaCore;wire(core)};document.head.appendChild(s);
    document.getElementById('cnt').textContent=reg.length+'개 묶음';
    document.getElementById('links').innerHTML=reg.map(function(r){
      var u=base+r.id+'/';
      return '<div class="row" style="display:grid;gap:4px"><div><b>'+r.school+' · '+r.title+'</b></div><div style="word-break:break-all"><a href="'+u+'">'+u+'</a></div>'+
        '<div class="btnrow" style="margin-top:0"><button class="btn" data-u="'+u+'">주소 복사</button></div></div>';
    }).join('');
    document.getElementById('links').onclick=function(ev){var b=ev.target.closest('button[data-u]');if(!b)return;
      try{navigator.clipboard.writeText(b.getAttribute('data-u')).then(function(){b.textContent='복사됨'},function(){b.textContent='직접 복사해 주세요'})}catch(e){b.textContent='직접 복사해 주세요'}};
  }
  function wire(core){
    document.getElementById('go').onclick=function(){
      var out=document.getElementById('out');
      try{
        var o=core.decode(document.getElementById('in').value),B=window.VOCADATA[o.id];
        if(!B)throw new Error('이 코드의 묶음('+o.id+')을 찾을 수 없어요');
        var G=core.build(B),st=o.s,h='<div class="rows"><div class="row"><span>학생</span><b>'+core.esc(st.name||'이름 없음')+'</b></div>';
        Object.keys(G.L).forEach(function(l){
          var L=G.L[l],c=core.counts(st,L),im=core.immunity(st,L);
          h+='<div class="row"><span>'+l+'과 연결 '+L.edges.length+'개</span><b>새것 '+c[0]+' · 보는 중 '+c[1]+' · 익힘 '+c[2]+' · 정복 '+c[3]+'</b></div>'+
             '<div class="row"><span>'+l+'과 오늘 푼 수 / 낚시 면역률</span><b>'+core.todayN(st,l)+' / '+(im===null?'-':im+'%')+'</b></div>';
        });
        h+='</div>';
        var rec=(st.recent||[]).slice(0,6).map(function(r){
          var L=G.L[r.l],t='';
          if(r.k==='b'){var b=L.broken.filter(function(x){return x.n===r.n&&x.g===r.g})[0];if(b)t=r.l+'과 '+r.n+'번 · '+core.esc(b.why)}
          else{var e=L.edges.filter(function(x){return x.id===r.id})[0];if(e)t='연결 오답 · '+core.relLine(G,e.b,e.a,e.t,'hub')}
          return t?'<li>'+t+'</li>':'';
        }).join('');
        if(rec)h+='<h2 style="font-size:15px;margin:14px 0 6px">최근 걸린 낚시</h2><ul class="miss">'+rec+'</ul>';
        out.innerHTML=h;
      }catch(e){out.innerHTML='<div class="fb no">읽지 못했어요: '+core.esc(e.message)+'</div>'}
    };
  }
})();
</script>
</body>
</html>
