<script>
var D=[{"n": 1, "tag": "Potatoes Come to Europe", "en": "Thousands of years ago, potatoes were first grow by people in the Andes mountains region.", "ko": "수천 년 전에 감자는 안데스산맥 지역의 사람들에 의해 처음 재배되었다.", "ok": false, "foot": [], "fixes": [{"wrong": "grow", "right": "grown", "partial": false, "at": [7], "point": "수동태: be동사(were) 뒤에는 과거분사 grown 사용", "topic": "수동태", "memo": "be동사(were) 뒤에는 과거분사 grown 사용"}]}, {"n": 2, "tag": null, "en": "When Spanish people took off this region in the 16th century, they first learn about potatoes.", "ko": "스페인 사람들이 16세기에 이 지역을 장악했을 때 그들은 처음 감자에 대해 알게 되었다.", "ok": false, "foot": [], "fixes": [{"wrong": "took off", "right": "took over", "partial": false, "at": [3], "point": "어휘: take off(이륙하다/벗다)가 아니라 '장악하다'라는 뜻의 take over 사용", "topic": "어휘", "memo": "take off(이륙하다/벗다)가 아니라 '장악하다'라는 뜻의 take over 사용"}, {"wrong": "learn", "right": "learned", "partial": false, "at": [13], "point": "시제: 과거 시제 문맥이므로 동사원형이 아닌 과거형 learned 사용", "topic": "시제", "memo": "과거 시제 문맥이므로 동사원형이 아닌 과거형 learned 사용"}]}, {"n": 3, "tag": null, "en": "They brought them to Europe because of they were a good food source.", "ko": "감자가 좋은 식량원이었기 때문에 그들은 감자를 유럽으로 가져왔다.", "ok": false, "foot": [], "fixes": [{"wrong": "because of", "right": "because", "partial": false, "at": [5], "point": "어법: 뒤에 주어+동사가 있는 절이 오므로 because of가 아닌 because 사용", "topic": "어법", "memo": "뒤에 주어+동사가 있는 절이 오므로 because of가 아닌 because 사용"}]}, {"n": 4, "tag": null, "en": "However, potatoes were not welcomed at first.", "ko": "하지만 감자는 처음에 환영받지 못했다.", "ok": true, "foot": [], "fixes": []}, {"n": 5, "tag": null, "en": "People did not try to grow and eating them because they looked strangely.", "ko": "사람들은 감자가 이상하게 생겼기 때문에 그것을 재배해 먹으려고 하지 않았다.", "ok": false, "foot": [], "fixes": [{"wrong": "eating", "right": "eat", "partial": false, "at": [7], "point": "병렬구조: try to 뒤에 grow and (to) eat가 병렬로 연결되므로 동사원형 eat 사용", "topic": "병렬구조", "memo": "try to 뒤에 grow and (to) eat가 병렬로 연결되므로 동사원형 eat 사용"}, {"wrong": "strangely", "right": "strange", "partial": false, "at": [12], "point": "어법: 감각동사 looked의 보어 자리이므로 부사가 아닌 형용사 strange 사용", "topic": "어법", "memo": "감각동사 looked의 보어 자리이므로 부사가 아닌 형용사 strange 사용"}]}, {"n": 6, "tag": null, "en": "They also thought potatoes brings diseases, so they gave them to pigs.", "ko": "그들은 또한 감자가 병을 가져온다고 생각해서 그것을 돼지에게 주었다.", "ok": false, "foot": [], "fixes": [{"wrong": "brings", "right": "brought", "partial": false, "at": [4], "point": "시제: 과거 시제 이야기이므로 현재형 brings가 아닌 과거형 brought 사용", "topic": "시제", "memo": "과거 시제 이야기이므로 현재형 brings가 아닌 과거형 brought 사용"}]}, {"n": 7, "tag": "The Potato King", "en": "A great food short happened in Prussia in 1744.", "ko": "1744년에 프로이센에서 대기근이 발생했다.", "ok": false, "foot": [], "fixes": [{"wrong": "short", "right": "shortage", "partial": false, "at": [3], "point": "어휘: 형용사 short(짧은)가 아니라 명사 shortage(부족) 사용", "topic": "어휘", "memo": "형용사 short(짧은)가 아니라 명사 shortage(부족) 사용"}]}, {"n": 8, "tag": null, "en": "People did not have enough food eating.", "ko": "사람들은 먹을 식량이 충분치 않았다.", "ok": false, "foot": [], "fixes": [{"wrong": "eating", "right": "to eat", "partial": false, "at": [6], "point": "to부정사의 형용사적 용법: enough food를 뒤에서 꾸며 '먹을 충분한 음식'이라는 의미이므로 to eat 사용", "topic": "to부정사의 형용사적 용법", "memo": "enough food를 뒤에서 꾸며 '먹을 충분한 음식'이라는 의미이므로 to eat 사용"}]}, {"n": 9, "tag": null, "en": "Frederick the Great wanted his people grow and eat potatoes.", "ko": "Frederick 대왕은 백성들이 감자를 재배해 먹기를 원했다.", "ok": false, "foot": [], "fixes": [{"wrong": "grow", "right": "to grow", "partial": false, "at": [6], "point": "5형식: want + 목적어 + to부정사 구조이므로 동사원형이 아닌 to grow 사용", "topic": "5형식", "memo": "want + 목적어 + to부정사 구조이므로 동사원형이 아닌 to grow 사용"}]}, {"n": 10, "tag": null, "en": "He planted a large field of potatoes, but nobody was interesting.", "ko": "그는 커다란 감자밭을 일궜지만, 아무도 관심이 없었다.", "ok": false, "foot": [], "fixes": [{"wrong": "interesting", "right": "interested", "partial": false, "at": [10], "point": "어휘: 감정을 느끼는 대상(nobody)이므로 interesting이 아닌 interested 사용", "topic": "어휘", "memo": "감정을 느끼는 대상(nobody)이므로 interesting이 아닌 interested 사용"}]}, {"n": 11, "tag": null, "en": "The king did not give up, and he came up with an idea.", "ko": "왕은 포기하지 않았고, 한 가지 아이디어를 생각해 냈다.", "ok": true, "foot": [], "fixes": []}, {"n": 12, "tag": null, "en": "He named potatoes a royalty vegetable and orders his soldiers to guard the potato field.", "ko": "그는 감자를 왕실의 채소라고 이름 짓고 자신의 병사들에게 감자밭을 지키라고 명령했다.", "ok": false, "foot": [], "fixes": [{"wrong": "royalty", "right": "royal", "partial": false, "at": [4], "point": "어휘: 명사 royalty가 아니라 vegetable을 꾸미는 형용사 royal 사용", "topic": "어휘", "memo": "명사 royalty가 아니라 vegetable을 꾸미는 형용사 royal 사용"}, {"wrong": "orders", "right": "ordered", "partial": false, "at": [7], "point": "시제: 과거 시제 문맥이므로 현재형 orders가 아닌 과거형 ordered 사용", "topic": "시제", "memo": "과거 시제 문맥이므로 현재형 orders가 아닌 과거형 ordered 사용"}]}, {"n": 13, "tag": null, "en": "This made people curiously, and some even tried to steal potatoes at night.", "ko": "이것은 사람들에게 호기심을 유발했고, 몇몇 사람들은 심지어 밤에 감자를 훔치려고 했다.", "ok": false, "foot": [], "fixes": [{"wrong": "curiously", "right": "curious", "partial": false, "at": [3], "point": "5형식: make + 목적어 + 목적격보어 구조에서 보어는 부사가 아닌 형용사 curious 사용", "topic": "5형식", "memo": "make + 목적어 + 목적격보어 구조에서 보어는 부사가 아닌 형용사 curious 사용"}]}, {"n": 14, "tag": null, "en": "Soon, many and more people started to grow and eat potatoes.", "ko": "곧 점점 더 많은 사람들이 감자를 재배해 먹기 시작했다.", "ok": false, "foot": [], "fixes": [{"wrong": "many and more", "right": "more and more", "partial": false, "at": [1], "point": "비교급: '점점 더 ~한'은 비교급 and 비교급(more and more) 형태로 반복해서 사용", "topic": "비교급", "memo": "'점점 더 ~한'은 비교급 and 비교급(more and more) 형태로 반복해서 사용"}]}, {"n": 15, "tag": "Potato Flowers, a Royal Fashion", "en": "When potatoes were first introducing in France, French people did not liked them as well.", "ko": "감자가 처음 프랑스에 들어왔을 때 프랑스 사람들도 감자를 좋아하지 않았다.", "ok": false, "foot": [], "fixes": [{"wrong": "introducing", "right": "introduced", "partial": false, "at": [4], "point": "수동태: be동사(were) 뒤에는 과거분사 ", 0]];var RNUM=58;var TITLE_EN="Potatoes: Once an Unpopular Vegetable";var PASS_EN=["Potatoes: Once an Unpopular Vegetable", "Thousands of years ago, potatoes were first grown by people in the Andes mountains region. When Spanish people took over this region in the 16th century, they first learned about potatoes. They brought them to Europe because they were a good food source. However, potatoes were not welcomed at first. People did not try to grow and eat them because they looked strange. They also thought potatoes brought diseases, so they gave them to pigs.", "A great food shortage happened in Prussia in 1744. People did not have enough food to eat. Frederick the Great wanted his people to grow and eat potatoes. He planted a large field of potatoes, but nobody was interested. The king did not give up, and he came up with an idea. He named potatoes a royal vegetable and ordered his soldiers to guard the potato field. This made people curious, and some even tried to steal potatoes at night. Soon, more and more people started to grow and eat potatoes.", "When potatoes were first introduced in France, French people did not like them as well. Because France also had food shortages, one government official told King Louis XVI about the successful case in Prussia. He advised the king to wear potato flowers on his jacket. The king took his advice, and the queen also wore some in her hair. People started to follow this royal fashion. As a result, people began to like potatoes and started to grow and eat them. Thanks to such efforts, potatoes were finally accepted in Europe and began to spread worldwide. They have now become one of the most popular vegetables in the world."];var PASS_KO=["감자: 한때 인기 없었던 채소", "수천 년 전에 감자는 안데스산맥 지역의 사람들에 의해 처음 재배되었다. 스페인 사람들이 16세기에 이 지역을 장악했을 때 그들은 처음 감자에 대해 알게 되었다. 감자가 좋은 식량원이었기 때문에 그들은 감자를 유럽으로 가져왔다. 하지만 감자는 처음에 환영받지 못했다. 사람들은 감자가 이상하게 생겼기 때문에 그것을 재배해 먹으려고 하지 않았다. 그들은 또한 감자가 병을 가져온다고 생각해서 그것을 돼지에게 주었다.", "1744년에 프로이센에서 대기근이 발생했다. 사람들은 먹을 식량이 충분치 않았다. Frederick 대왕은 백성들이 감자를 재배해 먹기를 원했다. 그는 커다란 감자밭을 일궜지만, 아무도 관심이 없었다. 왕은 포기하지 않았고, 한 가지 아이디어를 생각해 냈다. 그는 감자를 왕실의 채소라고 이름 짓고 자신의 병사들에게 감자밭을 지키라고 명령했다. 이것은 사람들에게 호기심을 유발했고, 몇몇 사람들은 심지어 밤에 감자를 훔치려고 했다. 곧 점점 더 많은 사람들이 감자를 재배해 먹기 시작했다.", "감자가 처음 프랑스에 들어왔을 때 프랑스 사람들도 감자를 좋아하지 않았다. 프랑스도 식량 부족을 겪었기 때문에, 한 정부 관료는 루이 16세 왕에게 프로이센의 성공적인 사례에 대해 말했다. 그는 왕에게 재킷에 감자꽃을 꽂으라고 조언했다. 왕은 그의 조언을 받아들였고 왕비도 머리에 감자꽃을 꽂았다. 사람들은 이러한 왕실의 패션을 따라 하기 시작했다. 그 결과 사람들은 감자를 좋아하기 시작했고 그것을 재배해 먹기 시작했다. 그러한 노력 덕분에 감자는 마침내 유럽에서 받아들여졌고 전 세계로 퍼져 나가기 시작했다. 그것은 이제 세계에서 가장 인기 있는 채소 중 하나가 되었다."];var DG=[{"dlg": [["M", "Good morning! How can I help you today?", "안녕하세요! 오늘 무엇을 도와드릴까요?"], ["W", "Hi! I want to buy some apples. I’m going to make apple jam.", "안녕하세요! 사과를 좀 사고 싶어요. 사과잼을 만들 거예요."], ["M", "How about these ones? They’re very sweet and perfect for apple jam.", "이건 어떠세요? 아주 달아서 사과잼 만들기에 딱이에요."], ["W", "They look great. I’d like two boxes, please.", "좋아 보이네요. 두 상자 주세요."], ["M", "Sure. That’ll be 20 dollars.", "네. 20달러입니다."], ["W", "Here you are. By the way, could you do me a favor?", "여기 있어요. 그런데 부탁 하나 들어주실 수 있나요?"], ["M", "Sure. What is it?", "물론이죠. 뭔가요?"], ["W", "Could you help me carry these boxes to my car?", "이 상자들을 제 차까지 옮기는 걸 도와주실 수 있나요?"], ["M", "I’m sorry, but I can’t leave my stand. You can use this cart to move them.", "죄송하지만 제가 가게를 비울 수가 없어요. 이 카트를 써서 옮기시면 돼요."], ["W", "Thanks. I’ll bring it back when I’m done.", "고마워요. 다 쓰고 나면 다시 가져다 놓을게요."]], "qs": [{"n": 1, "q": "위 대화의 여자가 남자에게 부탁한 일로 알맞은 것은?", "o": ["to choose sweeter apples", "to make apple jam for her", "to carry the boxes to her car", "to give her another fruit box", "to return the cart to the stand"], "a": 2, "ans": "to carry the boxes to her car", "evs": [["W: Here you are. By the way, could you do me a favor?", "여기 있어요. 그런데 부탁 하나 들어주실 수 있나요?"], ["W: Could you help me carry these boxes to my car?", "이 상자들을 제 차까지 옮기는 걸 도와주실 수 있나요?"]], "ev": ["W: Here you are. By the way, could you do me a favor?", "여기 있어요. 그런데 부탁 하나 들어주실 수 있나요
