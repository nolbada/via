cross a group of wild goat in a field.", "ko": "17세기에 영국 군대가 아일랜드를 공격하고 있었을 때, 그들은 들판에서 야생 염소 떼와 마주쳤다.", "ok": false, "foot": [], "fixes": [{"wrong": "on", "right": "in", "partial": false, "at": [7], "point": "기본전치사: \"~세기에\"는 전치사 in 사용", "topic": "기본전치사", "memo": "\"~세기에\"는 전치사 in 사용"}, {"wrong": "goat", "right": "goats", "partial": false, "at": [18], "point": "a group of + 복수명사: a group of 뒤에는 복수명사 goats 사용", "topic": "a group of + 복수명사", "memo": "a group of 뒤에는 복수명사 goats 사용"}]}, {"n": 7, "tag": null, "en": "Much of the goats ran away to the mountains, but one goats ran toward the village.", "ko": "대부분의 염소는 산으로 도망을 갔지만 염소 한 마리는 마을 쪽으로 달렸다.", "ok": false, "foot": [], "fixes": [{"wrong": "Much", "right": "Most", "partial": false, "at": [0], "point": "수량 형용사 most/much: 셀 수 있는 goats 앞에는 Most of 사용", "topic": "수량 형용사 most/much", "memo": "셀 수 있는 goats 앞에는 Most of 사용"}, {"wrong": "goats", "right": "goat", "partial": false, "at": [11], "point": "one + 단수명사: one 뒤에는 단수명사 goat 사용", "topic": "one + 단수명사", "memo": "one 뒤에는 단수명사 goat 사용"}]}, {"n": 8, "tag": null, "en": "When the villagers saw the tired and scared goat, they realized that danger were coming.", "ko": "마을 사람들은 지치고 겁에 질린 염소를 보았을 때 위험이 다가오고 있다는 것을 깨달았다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [13], "point": "be동사의 과거형: 단수 주어 danger: was (were 아님)", "topic": "be동사의 과거형", "memo": "단수 주어 danger: was (were 아님)"}]}, {"n": 9, "tag": null, "en": "Thanks to the goat, the villagers were able to prepare and protect themself.", "ko": "그 염소 덕분에 마을 사람들은 (공격에) 대비하고 자신들을 보호할 수 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "themself", "right": "themselves", "partial": false, "at": [12], "point": "재귀대명사: 주어 the villagers의 재귀대명사는 themselves 사용", "topic": "재귀대명사", "memo": "주어 the villagers의 재귀대명사는 themselves 사용"}]}, {"n": 10, "tag": null, "en": "Since then, people in Killorglin have celebrated wild goats with this festival.", "ko": "그 이후로, 킬로글린의 사람들은 이 축제로 야생 염소를 기념해 왔다.", "ok": true, "foot": [], "fixes": []}, {"n": 11, "tag": null, "en": "At the festival, people crowns a goat to show thanks to it. They also give it a lot of food and take good care of it.", "ko": "축제에서 사람들은 염소에게 감사를 표하기 위해 왕관을 씌워 준다. 그들은 또한 염소에게 많은 먹이를 주고 잘 돌봐준다.", "ok": false, "foot": [], "fixes": [{"wrong": "crowns", "right": "crown", "partial": false, "at": [4], "point": "일반동사 현재형: 복수 주어 people: crown (crowns 아님)", "topic": "일반동사 현재형", "memo": "복수 주어 people: crown (crowns 아님)"}]}, {"n": 12, "tag": null, "en": "People then parade, dance, and sing.", "ko": "그런 다음 사람들은 퍼레이드를 하고 춤추며 노래를 부른다.", "ok": true, "foot": [], "fixes": []}, {"n": 13, "tag": "네팔 · 개 축제", "en": "People say, \"Every dog have its day.\" In Nepal, this saying are literally true.", "ko": "사람들은 \"모든 개는 자신들의 날이 있다.\"라고 한다. 네팔에서 이 격언은 문자 그대로 사실이다.", "ok": false, "foot": [], "fixes": [{"wrong": "have", "right": "has", "partial": false, "at": [4], "point": "3인칭 단수 현재형: Every dog(단수): has (have 아님)", "topic": "3인칭 단수 현재형", "memo": "Every dog(단수): has (have 아님)"}, {"wrong": "are", "right": "is", "partial": false, "at": [11], "point": "be동사의 현재형: 단수 주어 saying: is (are 아님)", "topic": "be동사의 현재형", "memo": "단수 주어 saying: is (are 아님)"}]}, {"n": 14, "tag": null, "en": "Dogs have been an important part of Nepalese culture for hundreds of years.", "ko": "개는 수백 년 동안 네팔 문화의 중요한 일부였다.", "ok": true, "foot": [], "fixes": []}, {"n": 15, "tag": null, "en": "The Nepalese believe that dogs are helper of the god of death and guide souls at heaven.", "ko": "네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다.", "ok": false, "foot": [], "fixes": [{"wrong": "helper", "right": "helpers", "partial": false, "at": [6], "point": "명사의 복수형: dogs를 설명하므로 복수 helpers 사용", "topic": "명사의 복수형", "memo": "dogs를 설명하므로 복수 helpers 사용"}, {"wrong": "at", "right": "to", "partial": false, "at": [15], "point": "기본전치사: \"천국으로\"는 방향 전치사 to 사용", "topic": "기본전치사", "memo": "\"천국으로\"는 방향 전치사 to 사용"}]}, {"n": 16, "tag": null, "en": "Because this belief, Nepal has a specially day to celebrate dogs. This dog festival usually take place in October or November.", "ko": "이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다. 이 개 축제는 보통 10월이나 11월에 열린다.", "ok": false, "foot": [], "fixes": [{"wrong": "this", "right": "of this", "partial": false, "at": [1], "point": "접속사와 전치사: 뒤에 명사구(this belief)가 오면 Because of 사용", "topic": "접속사와 전치사", "memo": "뒤에 명사구(this belief)가 오면 Because of 사용", "alt": [0]}, {"wrong": "specially", "right": "special", "partial": false, "at": [6], "point": "형용사와 부사: 명사 day를 꾸미는 형용사 special 사용", "topic": "형용사와 부사", "memo": "명사 day를 꾸미는 형용사 special 사용"}, {"wrong": "take", "right": "takes", "partial": false, "at": [15], "point": "3인칭 단수 현재형: 단수 주어 festival: takes (take 아님)", "topic": "3인칭 단수 현재형", "memo": "단수 주어 festival: takes (take 아님)"}]}, {"n": 17, "tag": null, "en": "On this day, people give dogs flower necklaces and delicious food.", "ko": "이날 사람들은 개에게 꽃목걸이와 맛있는 먹이를 준다.", "ok": true, "foot": [], "fixes": []}, {"n": 18, "tag": null, "en": "They also put an red mark on dogs' foreheads to wish them good lucks. They even bow to dogs to showing them love and thanks.", "ko": "그들은 또한 개에게 행운을 빌어 주기 위해 그것의 이마에 빨간색 마크를 찍는다. 그들은 심지어 개에게 사랑과 감사를 표하기 위해 고개 숙여 인사하기도 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [3], "point": "관사 a/an: 자음 소리로 시작하는 red 앞에는 a 사용", "topic": "관사 a/an", "memo": "자음 소리로 시작하는 red 앞에는 a 사용"}, {"wrong": "lucks", "right": "luck", "partial": false, "at": [13], "point": "셀 수 없는 명사: luck은 셀 수 없는 명사라서 lucks 쓰지 않음", "topic": "셀 수 없는 명사", "memo": "luck은 셀 수 없는 명사라서 lucks 쓰지 않음"}, {"wrong": "showing", "right": "show", "partial": false, "at": [20], "point": "to부정사: to 뒤에는 동사원형: show (showing 아님)", "topic": "to부정사", "memo": "to 뒤에는 동사원형: show (showing 아님)"}]}];var PP=[["Some animals have been our friends for thousands of years.", "어떤 동물들은 수천 년 동안 우리의 친구였다.", 1], ["They have helped and protected us.", "그들은 우리를 돕고 보호해 왔다.", 0], ["To celebrate these animal friends, people in Irel "Because of this belief, Nepal has a special day to celebrate dogs.", "이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다.", 0], ["This dog festival usually takes place in October or November.", "이 개 축제는 보통 10월이나 11월에 열린다.", 0], ["On this day, people give dogs flower necklaces and delicious food.", "이날 사람들은 개에게 꽃목걸이와 맛있는 먹이를 준다.", 0], ["They also put a red mark on dogs' foreheads to wish them good luck.", "그들은 또한 개에게 행운을 빌어 주기 위해 그것의 이마에 빨간색 마크를 찍는다.", 0], ["They even bow to dogs to show them love and thanks.", "그들은 심지어 개에게 사랑과 감사를 표하기 위해 고개 숙여 인사하기도 한다.", 0]];var RNUM=28;var TITLE_EN="Festivals for Our Animal Friends";var PASS_EN=["Festivals for Our Animal Friends", "Some animals have been our friends for thousands of years. They have helped and protected us. To celebrate these animal friends, people in Ireland and Nepal hold special festivals every year. These festivals show a strong bond between humans and animals.", "Wild Goat Festival in Ireland", "Every year from August 10 to 12, people in Killorglin hold a festival to celebrate wild goats. There is one story about the festival's beginning. When the English army was attacking Ireland in the 17th century, they came across a group of wild goats in a field. Most of the goats ran away to the mountains, but one goat ran toward the village. When the villagers saw the tired and scared goat, they realized that danger was coming. Thanks to the goat, the villagers were able to prepare and protect themselves.", "Since then, people in Killorglin have celebrated wild goats with this festival. At the festival, people crown a goat to show thanks to it. They also give it a lot of food and take good care of it. People then parade, dance, and sing.", "Dog Festival in Nepal", "People say, \"Every dog has its day.\" In Nepal, this saying is literally true. Dogs have been an important part of Nepalese culture for hundreds of years. The Nepalese believe that dogs are helpers of the god of death and guide souls to heaven. Because of this belief, Nepal has a special day to celebrate dogs. This dog festival usually takes place in October or November. On this day, people give dogs flower necklaces and delicious food. They also put a red mark on dogs' foreheads to wish them good luck. They even bow to dogs to show them love and thanks."];var PASS_KO=["우리의 동물 친구들을 위한 축제들", "어떤 동물들은 수천 년 동안 우리의 친구였다. 그들은 우리를 돕고 보호해 왔다. 이러한 동물 친구들을 기념하기 위해 아일랜드와 네팔의 사람들은 매년 특별한 축제를 연다. 이러한 축제는 인간과 동물들 간의 강한 유대를 보여 준다.", "아일랜드의 야생 염소 축제", "매년 8월 10일부터 12일까지 킬로글린의 사람들은 야생 염소를 기리기 위해 축제를 연다. 그 축제의 시작에 대한 한 가지 일화가 있다. 17세기에 영국 군대가 아일랜드를 공격하고 있었을 때, 그들은 들판에서 야생 염소 떼와 마주쳤다. 대부분의 염소는 산으로 도망을 갔지만 염소 한 마리는 마을 쪽으로 달렸다. 마을 사람들은 지치고 겁에 질린 염소를 보았을 때 위험이 다가오고 있다는 것을 깨달았다. 그 염소 덕분에 마을 사람들은 (공격에) 대비하고 자신들을 보호할 수 있었다.", "그 이후로, 킬로글린의 사람들은 이 축제로 야생 염소를 기념해 왔다. 축제에서 사람들은 염소에게 감사를 표하기 위해 왕관을 씌워 준다. 그들은 또한 염소에게 많은 먹이를 주고 잘 돌봐준다. 그런 다음 사람들은 퍼레이드를 하고 춤추며 노래를 부른다.", "네팔의 개 축제", "사람들은 \"모든 개는 자신들의 날이 있다.\"라고 한다. 네팔에서 이 격언은 문자 그대로 사실이다. 개는 수백 년 동안 네팔 문화의 중요한 일부였다. 네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다. 이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다. 이 개 축제는 보통 10월이나 11월에 열린다. 이날 사람들은 개에게 꽃목걸이와 맛있는 먹이를 준다. 그들은 또한 개에게 행운을 빌어 주기 위해 그것의 이마에 빨간색 마크를 찍는다. 그들은 심지어 개에게 사랑과 감사를 표하기 위해 고개 숙여 인사하기도 한다."];

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}

 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];

   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0001'+f.right+'\u0002');return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
