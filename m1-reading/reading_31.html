ver your nose and mouth with a wet cloth. Then you should get outside quickly.","젖은 천으로 코와 입을 가려야 해. 그러고 나서 빨리 밖으로 나가야 해."],["G","I understand.","이해했어."],["B","Also, you should use the stairs.","또 계단을 이용해야 해."],["G","Okay. I’ll remember those tips and be careful during a fire.","알겠어. 그 방법들을 기억하고 불이 났을 때 조심할게."]]},{"qs":[{"n":3,"q":"위 대화에서 여자가 Jim에게 속도를 줄이라고 말한 이유는?","o":["They are late for school.","They are in a school zone.","The road is slippery.","A car is coming from behind.","Jim is not wearing a seat belt."],"a":1,"ans":"They are in a school zone.","evs":[["W: You are driving too fast. We are in a school zone. You should slow down.","당신은 너무 빨리 운전하고 있어요. 우리는 스쿨존에 있어요. 속도를 줄여야 해요."]],"ev":["W: You are driving too fast. We are in a school zone. You should slow down.","당신은 너무 빨리 운전하고 있어요. 우리는 스쿨존에 있어요. 속도를 줄여야 해요."],"ow":["오답 ✕ — 대화에 학교에 늦었다는 말은 없음. 여자는 'You are driving too fast.'(당신은 너무 빨리 운전하고 있어요.)라고 했지 지각을 걱정한 것이 아니라서 틀림.","정답 ○ — 여자가 'We are in a school zone. You should slow down.'(우리는 스쿨존에 있어요. 속도를 줄여야 해요.)라고 했으므로 스쿨존이라서 속도를 줄이라고 한 것임.","오답 ✕ — 길이 미끄럽다는 말은 이 대화에 없음. 가장 가까운 문장은 'You are driving too fast.'(너무 빨리 운전하고 있어요.)인데 이는 과속 이야기라서 틀림.","오답 ✕ — 뒤에서 차가 온다는 말은 없음. 여자는 'You are driving too fast.'(너무 빨리 운전하고 있어요.)라고만 해서 틀림.","오답 ✕ — 안전벨트 이야기는 대화에 나오지 않음. 이유는 'We are in a school zone.'(우리는 스쿨존에 있어요.)이라서 틀림."],"memo":["정답 ②: 스쿨존에 있기 때문이다(They are in a school zone).","근거: We are in a school zone. You should slow down.(우리는 스쿨존에 있어요. 속도를 줄여야 해요.)","함정: ④ 뒤에서 차가 온다는 말은 없어서 ✕"],"why":"스쿨존에는 아이들이 많아서 속도를 줄여야 한다."}],"dlg":[["W","Jim, be careful!","짐, 조심해요!"],["M","What’s the matter?","무슨 일이에요?"],["W","You are driving too fast. We are in a school zone. You should slow down.","당신은 너무 빨리 운전하고 있어요. 우리는 스쿨존에 있어요. 속도를 줄여야 해요."],["M","Oh, you are right. There are many children around here. Thank you.","아, 맞아요. 이 근처에는 아이들이 많이 있네요. 고마워요."]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["Lucas는 헬멧을 쓰지 않겠다고 했다.","Amy는 자전거 도로 표지판을 보지 못했다.","Lucas는 차가 오고 있다고 Amy에게 먼저 알려 주었다.","Lucas는 자전거 도로 표지판을 보라고 말했다.","두 사람은 인도에서 자전거를 타기로 했다."],"a":3,"ans":"Lucas는 자전거 도로 표지판을 보라고 말했다.","evs":[["B: Thank you. Oh, look at that sign. There is a bike lane over there.","B: 고마워. 오, 저 표지판 좀 봐. 저기에 자전거 도로가 있어."]],"ev":["B: Thank you. Oh, look at that sign. There is a bike lane over there.","B: 고마워. 오, 저 표지판 좀 봐. 저기에 자전거 도로가 있어."],"ow":["오답 ✕ — Lucas는 'Okay, I will.'(알겠어, 그럴게.)이라고 했으므로 헬멧을 쓰겠다고 한 것이다.","오답 ✕ — Amy는 'Yes, I see it.'(응, 보여.)이라고 했으므로 표지판을 보았다.","오답 ✕ — 'A car is coming.'(차가 오고 있어.)이라고 알려 준 사람은 Amy(G)이다.","정답 ○ — Lucas는 'Oh, look at that sign. There is a bike lane over there.'(오, 저 표지판 좀 봐. 저기에 자전거 도로가 있어.)라고 말했으므로 맞다.","오답 ✕ — 'We should ride our bikes in the bike lane.'(우리는 자전거 도로에서 자전거를 타야 해.)라고 했으므로 인도가 아니라 자전거 도로이다."],"memo":["정답 ④: Lucas는 자전거 도로 표지판을 보라고 말했다.","근거: Oh, look at that sign. There is a bike lane over there.(저 표지판 좀 봐. 저기에 자전거 도로가 있어.)","함정: ③ 차를 조심하라고 한 사람은 Amy라서 ✕"],"why":"Lucas가 자전거 도로 표지판을 발견해 알려 준다."},{"n":5,"q":"위 대화에서 Amy가 Lucas에게 한 말로 알맞은 것은?","o":["헬멧을 먼저 써야 한다.","자전거를 타지 말고 걸어가야 한다.","인도에서 자전거를 타야 한다.","차가 와도 빨리 달려야 한다.","표지판은 신경 쓰지 말아야 한다."],"a":0,"ans":"헬멧을 먼저 써야 한다.","evs":[["G: Sure! But you should put on a helmet first.","물론이지! 그런데 먼저 헬멧을 써야 해."],["G: Yes, I see it. We should ride our bikes in the bike lane.","응, 보여. 우리는 자전거 도로에서 자전거를 타야 해."]],"ev":["G: Sure! But you should put on a helmet first.","물론이지! 그런데 먼저 헬멧을 써야 해."],"ow":["정답 ○ — Amy가 'But you should put on a helmet first.'(그런데 먼저 헬멧을 써야 해.)라고 말했으므로 맞음.","오답 ✕ — 걸어가자는 말은 없음. 마지막에 'Okay. Let’s go.'(알겠어. 가자.)라고 하고 'We should ride our bikes in the bike lane.'(자전거 도로에서 타야 해.)라고 했으므로 자전거를 타는 상황이라서 틀림.","오답 ✕ — Amy는 'We should ride our bikes in the bike lane.'(우리는 자전거 도로에서 자전거를 타야 해.)라고 했는데, 이 보기는 인도라고 해서 틀림.","오답 ✕ — Amy는 'A car is coming. You should watch out for cars.'(차가 오고 있어. 차를 조심해야 해.)라고 했는데, 이 보기는 빨리 달리라고 해서 반대로 말해 틀림.","오답 ✕ — 표지판을 본 사람은 Lucas이고 'There is a bike lane over there.'(저기에 자전거 도로가 있어.)라고 했으며, Amy는 'Yes, I see it.'(응, 보여.)이라고 맞장구쳤으므로 틀림."],"memo": 의 내용과 일치하지 않는 것은?","o":["Jinho got an ankle injury in PE class.","Minji slipped when she ran down the stairs.","Sora spilled her soup on Jaemin's arm.","Students get the most injuries on their fingers.","Accidents can happen when students play sports or walk."],"a":2,"ans":"Sora spilled her soup on Jaemin's arm.","evs":[["(12:30 p.m., Lunchtime) Sora picked up a bowl of hot soup.","(오후 12:30, 점심시간) 소라는 뜨거운 국그릇을 집었어."],["Sora spilled the hot soup on her arm.","소라는 팔에 뜨거운 국을 쏟았어."]],"ev":["(12:30 p.m., Lunchtime) Sora picked up a bowl of hot soup.","(오후 12:30, 점심시간) 소라는 뜨거운 국그릇을 집었어."],"ow":["오답 ✕ — 'He injured his ankle!'(그는 발목에 부상을 입었어!)이고 장면이 'PE class'(체육 시간)이므로 일치함. 그래서 정답이 아님.","오답 ✕ — 'She ran down the stairs and slipped!'(그녀는 계단을 뛰어 내려갔고 미끄러졌어!)라고 했으므로 일치함. 그래서 정답이 아님.","정답 ○ — 'Sora spilled the hot soup on her arm.'(소라는 팔에 뜨거운 국을 쏟았어.)에서 팔은 Sora 자신의 팔이므로, Jaemin의 팔에 쏟았다는 보기는 일치하지 않음.","오답 ✕ — 'Students injure their fingers (23%), ankles (22%), and knees (6%).'에서 손가락이 23%로 가장 높으므로 일치함. 그래서 정답이 아님.","오답 ✕ — 'Students get injuries when they play soccer... Accidents also happen when students are walking (12%)!'라고 했으므로 운동하거나 걸을 때 사고가 날 수 있다는 보기는 일치함."],"memo":["정답 ③ (일치하지 않는 것): Sora는 Jaemin의 팔이 아니라 자기 팔에 국을 쏟았다.","근거: Sora spilled the hot soup on her arm.(소라는 팔에 뜨거운 국을 쏟았어.)","함정: ④ 손가락 23%로 가장 많아서 맞는 말 → ✕"],"why":"국을 쏟은 곳은 Sora 자신의 팔이다."},{"n":8,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Most school accidents happen in PE classes.","Basketball causes 15% of school injuries.","The most common injury is a knee injury.","Students sometimes get hurt when they're walking.","Students can get injured during break time."],"a":2,"ans":"The most common injury is a knee injury.","evs":[["Students injure their fingers (23%), ankles (22%), and knees (6%).","학생들은 손가락(23%), 발목(22%), 그리고 무릎(6%)에 부상을 입어."]],"ev":["Students injure their fingers (23%), ankles (22%), and knees (6%).","학생들은 손가락(23%), 발목(22%), 그리고 무릎(6%)에 부상을 입어."],"ow":["오답 ✕ — 'Many school accidents happen in PE classes (44%
