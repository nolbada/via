t to do great work for the world. I can't wait to get out of here.\" The smallest pea said, \"Good for you. I'm too small. What can I do?\" The others cheered, \"There will be something that you can do! You'll find it.\"","One day, the pod broke open. The wind blew the smallest pea up into the air. It flew and landed on a tiny space by the window of a house. Soil built up, and the tiny pea sank into it.","A young girl lived with her mom in the house. Her mom had to work from early morning to late evening. The girl was very sick and stayed in bed all day. One day, the girl asked, \"Mom, what is the green thing by the window?\" \"Oh, it's a pea plant! It is as little as a baby's finger. Where did it come from?\" asked Mom. The girl looked at the little plant in wonder.","Every day, the girl went to the window to see the plant. It grew taller and taller. It became as tall as a small tree after a few weeks. \"How pretty and healthy you are! When I sit in the sun to see you, I feel healthier, too!\" The girl became stronger and happier day by day.","One evening, the girl shouted, \"You must see this, Mom! It's the most wonderful thing!\" A little flower blossomed on the pea plant. It was a beautiful pink flower. \"Thank you, little plant. You are the friend I have waited for!\" The little pea was as happy as the girl. It finally found the thing which it could do."];var PASS_KO=["완두콩 꽃","다섯 개의 작은 완두콩이 꼬투리 속에서 함께 살았다. 가장 큰 완두콩이 말했다. \"세상은 어떤 것 같아? 난 세상을 위해 훌륭한 일을 하고 싶어. 나는 빨리 여기서 나가고 싶어.\" 가장 작은 완두콩이 말했다. \"좋겠다. 난 너무 작아. 내가 무엇을 할 수 있겠어?\" 다른 콩들이 응원했다. \"네가 할 수 있는 일이 있을 거야! 넌 그것을 찾을 거야.\"","어느 날, 그 꼬투리가 터져 열렸다. 바람이 가장 작은 완두콩을 공중으로 날려 보냈다. 그것은 날아서 어느 집 창문 옆의 작은 공간에 내려앉았다. 흙이 쌓이자 그 작은 완두콩은 그 속으로 가라앉았다.","그 집에는 한 어린 소녀가 어머니와 함께 살고 있었다. 그녀의 어머니는 이른 아침부터 늦은 저녁까지 일해야 했다. 소녀는 매우 아파서 하루 종일 침대에 누워 있었다. 어느 날, 소녀가 \"엄마, 창문 옆에 있는 저 초록색 물건이 뭐예요?\"라고 물었다. \"오, 이건 완두콩 식물이네! 그건 아기의 손가락만큼이나 작구나. 이게 어디에서 온 것일까?\" 엄마가 물으셨다. 소녀는 경이롭게 그 작은 식물을 바라보았다.","매일 소녀는 그 식물을 보기 위해 창문으로 갔다. 그것은 점점 더 키가 자랐다. 몇 주가 지나자 그것은 작은 나무만큼 키가 커졌다. \"너는 정말 예쁘고 건강하구나! 너를 보기 위해 햇볕에 앉아 있을 때, 나도 더 건강해지는 것 같아!\" 소녀는 날이 갈수록 더 강해지고 행복해졌다.","어느 날 저녁, 소녀가 외쳤다. \"엄마, 이거를 꼭 봐야 해요! 그것은 가장 멋진 거예요!\" 작은 꽃이 완두콩 식물에 피어 있었다. 그것은 아름다운 분홍색 꽃이었다. \"고마워, 꼬마 식물아. 네가 바로 내가 기다려 왔던 친구야!\" 작은 완두콩은 소녀만큼 행복했다. 그것은 마침내 자신이 할 수 있는 일을 찾았다."];var DG=[{"qs":[{"n":1,"q":"다음 대화의 주제로 알맞은 것은?","o":["next week's school trip","the new space museum","the woman's dream job","the woman's interest in rockets","the man's plan for a school trip"],"a":0,"ans":"next week's school trip","evs":[["W: Did you hear about our school trip next week?","다음 주 우리 학교 현장 학습에 대해 들었니?"],["M: Sounds like a fun place. I'm looking forward to the school trip.","재미있는 곳 같다. 나는 현장 학습이 기대돼."]],"ev":["W: Did you hear about our school trip next week?","다음 주 우리 학교 현장 학습에 대해 들었니?"],"ow":["정답 ○ — 'Did you hear about our school trip next week?'(다음 주 우리 학교 현장 학습에 대해 들었니?)로 시작해 'I'm looking forward to the school trip.'(나는 현장 학습이 기대돼.)으로 끝나므로 다음 주 현장 학습이 주제이다.","오답 ✕ — 우주 박물관은 'we're going to the space museum'(우리는 우주 박물관에 갈 거야)에서 현장 학습의 목적지로 나올 뿐이다. 박물관 자체가 새로 생겼다는 이야기는 없어서 틀림.","오답 ✕ — 여자의 꿈의 직업에 대한 이야기는 대화에 없다. 'We can go inside a real rocket there.'(거기에서 진짜 로켓 안에 들어가 볼 수 있어.)는 현장 학습에서 할 수 있는 일이라서 틀림.","오답 ✕ — 여자가 로켓에 관심이 있다는 말은 없다. 로켓은 'We can go inside a real rocket there.'(거기에서 진짜 로켓 안에 들어가 볼 수 있어.)처럼 현장 학습 장소의 볼거리일 뿐이라 틀림.","오답 ✕ — 'our school trip'(우리 학교 현장 학습)이라고 했으므로 남자 혼자의 계획이 아니라 두 사람이 함께 가는 학교 행사이다. 그래서 틀림."],"memo":["정답 ①: 대화의 주제는 다음 주 현장 학습이다.","근거: Did you hear about our school trip next week?(다음 주 우리 학교 현장 학습에 대해 들었니?)","함정: ⑤ our school trip이므로 남자만의 계획이 아니다 ✕"],"why":"다음 주에 갈 우주 박물관 현장 학습에 대해 이야기하는 대화이다."}],"dlg":[["W","Did you hear about our school trip next week?","다음 주 우리 학교 현장 학습에 대해 들었니?"],["M","Yeah, we're going to the space museum.","응, 우리는 우주 박물관에 갈 거야."],["W","Right. We can go inside a real rocket there.","맞아. 거기에서 진짜 로켓 안에 들어가 볼 수 있어."],["M","Sounds like a fun place. I'm looking forward to the school trip.","재미있는 곳 같다. 나는 현장 학습이 l be something that you can do!","네가 할 수 있는 일이 있을 거야!"]],"ev":["I want to do great work for the world.","난 세상을 위해 훌륭한 일을 하고 싶어."],"ow":["오답 ✕ — 완두콩들이 어떻게 자라는지 보여 주는 글이 아니다. 이 부분에서는 꼬투리 속 완두콩들이 'What is the world like?'(세상은 어떤 것 같아?)라며 대화하고 있어서 틀림.","오답 ✕ — 다섯 완두콩이 각자 모험을 하는 이야기가 아니다. 'The wind blew the smallest pea up into the air.'(바람이 가장 작은 완두콩을 공중으로 날려 보냈다.)처럼 가장 작은 완두콩 하나의 이야기라서 틀림.","오답 ✕ — 'Five little peas lived together in a pod.'(다섯 개의 작은 완두콩이 꼬투리 속에서 함께 살았다.)라고 했지만 사이좋게 지내는 비결은 나오지 않아 틀림.","오답 ✕ — 'What is the world like?'(세상은 어떤 것 같아?)라는 말이 있지만 세상에 대한 궁금증을 나열하는 글이 아니다. 가장 큰 완두콩의 꿈과 작은 완두콩에 대한 응원이 중심이라 틀림.","정답 ○ — 가장 큰 완두콩은 'I want to do great work for the world.'(난 세상을 위해 훌륭한 일을 하고 싶어.)라는 꿈을 말하고, 다른 콩들은 'There will be something that you can do!'(네가 할 수 있는 일이 있을 거야!)라며 가장 작은 완두콩을 격려한다."],"memo":["정답 ⑤: 한 완두콩의 꿈과 가장 작은 완두콩에 대한 격려","근거: I want to do great work for the world.(난 세상을 위해 훌륭한 일을 하고 싶어.) / There will be something that you can do!(네가 할 수 있는 일이 있을 거야!)","함정: ④ 세상에 대한 궁금증은 일부일 뿐 중심 내용이 아니다 ✕"],"why":"큰 완두콩의 꿈과 작은 완두콩을 응원하는 말이 중심이다."},{"n":7,"q":"윗글의 내용과 일치하는 것은?","o":["The biggest pea wanted to stay inside the pod as long as possible.","The smallest pea was worried about its size.","Four peas made fun of the smallest pea and said it could do nothing.","Some of the peas flew into the air because of strong wind.","The biggest pea fell into the place by the window of a house."],"a":1,"ans":"The smallest pea was worried about its size.","evs":[["I'm too small.","난 너무 작아."],["What can I do?\"","내가 무엇을 할 수 있겠어?”"]],"ev":["I'm too small.","난 너무 작아."],"ow":["오답 ✕ — 가장 큰 완두콩은 'I can't wait to get out of here.'(나는 빨리 여기서 나가고 싶어.)라고 했는데, 이 보기는 가능한 오래 꼬투리 안에 있고 싶어 했다고 해서 틀림.","정답 ○ — 가장 작은 완두콩이 'I'm too small. What can I do?'(난 너무 작아. 내가 무엇을 할 수 있겠어?)라고 했으므로 자신의 크기를 걱정한 것이 맞다.","오답 ✕ — 다른 콩들은 놀리지 않고 'There will be something that you can do!'(네가 할 수 있는 일이 있을 거야!)라며 응원했는데, 이 보기는 놀렸다고 해서 틀림.","오답 ✕ — 본문에는 'The wind blew the smallest pea up into the air.'(바람이 가장 작은 완두콩을 공중으로 날려 보냈다.)라고 했으므로 날아간 것은 가장 작은 완두콩 하나이다. 이 보기는 일부 콩들이 날아갔다고 해서 틀림.","오답 ✕ — 창문 옆의 작은 공간에 내려앉은 것은 'It flew and landed on a tiny space by the window of a house.'에서 가장 작은 완두콩이다. 가장 큰 완두콩이라는 보기는 틀림."],"memo":["정답 ②: 가장 작은 완두콩은 자신의 크기를 걱정했다.","근거: I'm too small. What can I do?(난 너무 작아. 내가 무엇을 할 수 있겠어?)","함정: ⑤ 창문 옆에 내려앉은 것은 가장 큰 완두콩이 아니라 가장 작은 완두콩 ✕"],"why":"가장 작은 완두콩은 자신이 너무 작다고 걱정한다."}],"pp":[["Five little peas lived together in a pod.","다섯 개의 작은 완두콩이 꼬투리 속에서 함께 살았다."],["The biggest pea said, \"What is the world like?","가장 큰 완두콩이 말했다. \"세상은 어떤 것 같아?"],["I want to do great work for the world.","난 세상을 위해 훌륭한 일을 하고 싶어."],["I can't wait to get out of here.\"","나는 빨리 여기서 나가고 싶어.\""],["The smallest pea said, \"Good for you.","가장 작은 완두콩이 말했다. \"좋겠다."],["I'm too small.","난 너무 작아."],["What can I do?\"","내가 무엇을 할 수 있겠어?\""],["The others cheered, \"There will be something that you can do!","다른 콩들이 응원했다. \"네가 할 수 있는 일이 있을 거야!"],["You'll find it.\"","넌 그것을 찾을 거야.\""],["One day, the pod broke open.","어느 날, 그 꼬투리가 터져 열렸다."],["The wind blew the smallest pea up into the air.","바람이 가장 작은 완두콩을 공중으로 날려 보냈다."],["It flew and landed on a tiny space by the window of a house.","그것은 날아서 어느 집 창문 옆의 작은 공간에 내려앉았다."],["Soil built up, and the tiny pea sank into it.","흙이 쌓이자 그 작은 완두콩은 그 속으로 가라앉았다."]]},{"qs":[{"n":8,"q":"윗글의 제목으로 알맞은 것은?","o":["A Lonely Little Pea and a Girl","A Plant Diary about the Little Pea","When a Sick Girl Met a Tiny Pea Plant","The Short Life of the Little Pea and the Girl","What Things Are Needed to Grow a Pea Plant"],"a":2,"ans":"When a Sick Girl Met a Tiny Pea Plant","evs":[["The girl was very sick and stayed in bed all day.","소녀는 매우 아파서 하루 종일 침대에 누워 있었다."],["Every day, the girl went to the window to see the plant.","매일 소녀는 그 식물을 보기 위해 창문으로 갔다."]],"ev":["The girl was very sick and stayed in bed all day.","소녀는 매우 아파서 하루 종일 침대에 누워 있었다."],"ow":["오답 ✕ — 완두콩이 외롭다는 내용은 없다. 마지막에 'The little pea was as happy as the girl.'(작은 완두콩은 소녀만큼 행복했다.)이라고 했으므로 외로운 이야기가 아니라서 틀림.","오답
