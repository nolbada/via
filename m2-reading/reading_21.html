<script>
var D=[{"n": 1, "tag": null, "en": "Welcome to the School Heroes Awards! I'm the student president, Eunho Choi.", "ko": "학교 영웅상 시상식에 오신 것을 환영합니다! 저는 학생회장 최은호입니다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "During the school day, we see our friends and teachers most of the times.", "ko": "학교생활을 하는 동안에, 우리는 대부분의 시간을 우리의 친구들과 선생님들을 보며 보냅니다.", "ok": false, "foot": [], "fixes": [{"wrong": "times", "right": "time", "partial": false, "at": [13], "point": "관용 표현: most of the time(대부분의 경우)은 단수 time 사용", "topic": "관용 표현", "memo": "most of the time(대부분의 경우)은 단수 time 사용"}]}, {"n": 3, "tag": null, "en": "But there are other people who play roles behind of the scenes! Today, we have awards to present to three of these hero.", "ko": "하지만 보이지 않는 곳에서 역할을 하는 다른 분들이 계십니다! 오늘, 우리는 이 영웅들 중 세 분께 상을 드리려고 합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "of the", "right": "the", "partial": false, "at": [9], "point": "기본전치사: behind 뒤에는 of 없이 바로 명사구", "topic": "기본전치사", "memo": "behind 뒤에는 of 없이 바로 명사구"}, {"wrong": "hero", "right": "heroes", "partial": false, "at": [22], "point": "지시형용사와 복수명사: these 뒤에는 복수명사 heroes 사용", "topic": "지시형용사와 복수명사", "memo": "these 뒤에는 복수명사 heroes 사용"}]}, {"n": 4, "tag": null, "en": "Drum roll, please! The first winner is the facilities manager, Mr. Kim!", "ko": "드럼 롤 부탁드립니다! 첫 번째 수상자는 시설 관리자이신 김 선생님입니다!", "ok": true, "foot": [], "fixes": []}, {"n": 5, "tag": null, "en": "He take care of our school buildings. Do you remember last summer?", "ko": "그분은 우리 학교 건물을 관리하십니다. 지난여름을 기억하시나요?", "ok": false, "foot": [], "fixes": [{"wrong": "take", "right": "takes", "partial": false, "at": [1], "point": "3인칭 단수 현재형: 주어 He에는 takes 사용", "topic": "3인칭 단수 현재형", "memo": "주어 He에는 takes 사용"}]}, {"n": 6, "tag": null, "en": "Some air conditioners broke down, and it became very heat. However, Mr. Kim came right away and fix them.", "ko": "에어컨 몇 대가 고장 나서 정말 더웠었죠. 하지만 김 선생님이 바로 오셔서 그것들을 고쳐 주셨습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "heat", "right": "hot", "partial": false, "at": [9], "point": "형용사와 명사의 품사: became 뒤 보어 자리에는 형용사 hot 사용", "topic": "형용사와 명사의 품사", "memo": "became 뒤 보어 자리에는 형용사 hot 사용"}, {"wrong": "fix", "right": "fixed", "partial": false, "at": [17], "point": "과거 시제: came과 병렬인 과거형: fixed", "topic": "과거 시제", "memo": "came과 병렬인 과거형: fixed"}]}, {"n": 7, "tag": null, "en": "He works hard to making our school a great place for studying.", "ko": "그분은 우리 학교를 공부하기에 좋은 곳으로 만들기 위해 열심히 일하십니다.", "ok": false, "foot": [], "fixes": [{"wrong": "making", "right": "make", "partial": false, "at": [4], "point": "to부정사: to 뒤는 동사원형: to make", "topic": "to부정사", "memo": "to 뒤는 동사원형: to make"}]}, {"n": 8, "tag": null, "en": "\"I love working for our students. If you have a questions about the school facilities, feel freely to ask me!\"", "ko": "\"저는 우리 학생들을 위해 일하는 것이 정말 좋습니다. 만약 학교 시설에 대해 궁금한 점이 있다면, 주저하지 말고 저에게 물어보세요!\"", "ok": false, "foot": [], "fixes": [{"wrong": "questions", "right": "question", "partial": false, "at": [10], "point": "a/an 뒤 단수명사: a 뒤에는 단수명사 question 사용", "topic": "a/an 뒤 단수명사", "memo": "a 뒤에는 단수명사 question 사용"}, {"wrong": "freely", "right": "free", "partial": false, "at": [16], "point": "형용사와 부사: feel 뒤 보어 자리에는 형용사 free 사용", "topic": "형용사와 부사", "memo": "feel 뒤 보어 자리에는 형용사 free 사용"}]}, {"n": 9, "tag": null, "en": "- Mr. Kim", "ko": "- 김 선생님", "ok": true, "foot": [], "fixes": []}, {"n": 10, "tag": null, "en": "The next award goes at … the leader of the cafeteria staff, Ms. Lee! Many students say our school lunches are the most good.", "ko": "다음 상은… 급식실 직원 리더이신 이 선생님께 드립니다! 많은 학생들이 우리 학교 점심이 최고라고 말합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "at", "right": "to", "partial": false, "at": [4], "point": "기본전치사: \"~에게 돌아가다\"는 go to 사용", "topic": "기본전치사", "memo": "\"~에게 돌아가다\"는 go to 사용"}, {"wrong": "most good", "right": "best", "partial": false, "at": [22], "point": "최상급: good의 최상급은 the best 사용", "topic": "최상급", "memo": "good의 최상급은 the best 사용"}]}, {"n": 11, "tag": null, "en": "Ms. Lee prepares fresh and delicious meals for us every days. At lunchtime, she serve us food with a big smile.", "ko": "이 선생님은 매일 우리에게 신선하고 맛있는 식사를 준비해 주십니다. 점심시간에는 환하게 미소 지으며 우리에게 음식을 나눠 주십니다.", "ok": false, "foot": [], "fixes": [{"wrong": "days", "right": "day", "partial": false, "at": [10], "point": "every 뒤 단수명사: every 뒤에는 단수명사 day 사용", "topic": "every 뒤 단수명사", "memo": "every 뒤에는 단수명사 day 사용"}, {"wrong": "serve", "right": "serves", "partial": false, "at": [14], "point": "3인칭 단수 현재형: 주어 she는 3인칭 단수: serves", "topic": "3인칭 단수 현재형", "memo": "주어 she는 3인칭 단수: serves"}]}, {"n": 12, "tag": null, "en": "After the students leaves the cafeteria, she washes the dishes and cleans the cafeteria.", "ko": "학생들이 급식실을 떠난 후에는, 설거지를 하시고 급식실을 청소하십니다.", "ok": false, "foot": [], "fixes": [{"wrong": "leaves", "right": "leave", "partial": false, "at": [3], "point": "수일치: 주어 students(복수)에는 leave 사용", "topic": "수일치", "memo": "주어 students(복수)에는 leave 사용"}]}, {"n": 13, "tag": null, "en": "\"I'm happy when students enjoys their lunches. I'm proud to serve delicious and healthily food.\"", "ko": "\"학생들이 점심을 맛있게 먹을 때 저는 행복합니다. 맛있고 건강한 음식을 제공할 수 있어서 자랑스럽습니다.\"", "ok": false, "foot": [], "fixes": [{"wrong": "enjoys", "right": "enjoy", "partial": false, "at": [4], "point": "일반동사의 수일치: 주어 students는 복수: enjoy", "topic": "일반동사의 수일치", "memo": "주어 students는 복수: enjoy"}, {"wrong": "healthily", "right": "healthy", "partial": false, "at": [13], "point": "형용사와 부사: 명사 food를 꾸미는 형용사 healthy 사용", "topic": "형용사와 부사", "memo": "명사 food를 꾸미는 형용사 healthy 사용"}]}, {"n": 14, "tag": null, "en": "- Ms. Lee", "ko": "- 이 선생님", "ok": true, "foot": [], "fixes": []}];var PP=[["Welcome to the School Heroes Awards!", "학교 영웅상 시상식에 오신 것을 환영합니다!", 1], ["I'm the student president, Eunho Choi.", "저는 학생회장 최은호입니다.", 0], ["During the school day, we see our friends and teachers most of the time.", "학교생활을 하는 동안에, 우리는 대부분의 시간을 우리의 친구들과 선생님들을 보며 보냅니다.", 0], ["But there are other people who play roles behind the scenes!", "하지만 보이지 않는 곳에서 역할을 하는 다른 분들이 계십니다!", 0], ["Today, we have awards to present to three of these heroes.", "오늘, 우리는 이 영웅들 중 세 분께 상을 드리려고 합니다.", 0], ["Drum roll, please!", "드럼 롤 부탁드립니다!", 1], ["The first winner is the facilities manager, Mr. Kim!", "첫 번째 수상자는 시설 관리자이신 김 선생님입니다!", 0], ["He takes care of our school buildings.", "그분은 우리 학교 건물을 관리하십니다.", 0], ["Do you remember last summer?", "지난여름을 기억하시나요?", 0], ["Some air conditioners broke down, and it became very hot.", "에어컨 몇 대가 고장 나서 정말 더웠었죠.", 0], ["However, Mr. Kim came right away and fixed them.", "하지만 김 선생님이 바로 오셔서 그것들을 고쳐 주셨습니다.", 0], ["He works hard to make our school a great place for studying.", "그분은 우리 학교를 공부하기에 좋은 곳으로 만들기 위해 열심히 일하십니다.", 0], ["\"I love working for our students.", "\"저는 우리 학생들을 위해 일하는 것이 정말 좋습니다.", 1], ["If you have a question about the school facilities, feel free to ask me!\"", "만약 학교 시설에 대해 궁금한 점이 있다면, 주저하지 말고 저에게 물어보세요!\"", 0], ["- Mr. Kim", "- 김 선생님", 1], ["The next award goes to … the leader of the cafeteria staff, Ms. Lee!", "다음 상은… 급식실 직원 리더이신 이 선생님께 드립니다!", 1], ["Many students say our school lunches are the best.", "많은 학생들이 우리 학교 점심이 최고라고 말합니다.", 0], ["Ms. Lee prepares fresh and delicious meals for us every day.", "이 선생님은 매일 우리에게 신선하고 맛있는 식사를 준비해 주십니다.", 0], ["At lunchtime, she serves us food with a big smile.", "점심시간에는 환하게 미소 지으며 우리에게 음식을 나눠 주십니다.", 0], ["After the students leave the cafeteria, she washes the dishes and cleans the cafeteria.", "학생들이 급식실을 떠난 후에는, 설거지를 하시고 급식실을 청소하십니다.", 0], ["\"I'm happy when students enjoy their lunches.", "\"학생들이 점심을 맛있게 먹을 때 저는 행복합니다.", 1], ["I'm proud to serve delicious and healthy food.\"", "맛있고 건강한 음식을 제공할 수 있어서 자랑스럽습니다.\"", 0], ["- Ms. Lee", "- 이 선생님", 1]];var RNUM=21;var TITLE_EN="The School Heroes Awards";var PASS_EN=["The School Heroes Awards", "Welcome to the School Heroes Awards! I'm the student president, Eunho Choi. During the school day, we see our friends and teachers most of the time. But there are other people who play roles behind the scenes! Today, we have awards to present to three of these heroes.", "Drum roll, please! The first winner is the facilities manager, Mr. Kim! He takes care of our school buildings. Do you remember last summer? Some air conditioners broke down, and it became very hot. However, Mr. Kim came right away and fixed them. He works hard to make our school a great place for studying.", "\"I love working for our students. If you have a question about the school facilities, feel free to ask me!\"", "- Mr. Kim", "The next award goes to … the leader of the cafeteria staff, Ms. Lee! Many students say our school lunches are the best. Ms. Lee prepares fresh and delicious meals for us every day. At lunchtime, she serves us food with a big smile. After the students leave the cafeteria, she washes the dishes and cleans the cafeteria.", "\"I'm happy when students enjoy their lunches. I'm proud to serve delicious and healthy food.\"", "- Ms. Lee"];var PASS_KO=["학교 영웅상", "학교 영웅상 시상식에 오신 것을 환영합니다! 저는 학생회장 최은호입니다. 학교생활을 하는 동안에, 우리는 대부분의 시간을 우리의 친구들과 선생님들을 보며 보냅니다. 하지만 보이지 않는 곳에서 역할을 하는 다른 분들이 계십니다! 오늘, 우리는 이 영웅들 중 세 분께 상을 드리려고 합니다.", "드럼 롤 부탁드립니다! 첫 번째 수상자는 시설 관리자이신 김 선생님입니다! 그분은 우리 학교 건물을 관리하십니다. 지난여름을 기억하시나요? 에어컨 몇 대가 고장 나서 정말 더웠었죠. 하지만 김 선생님이 바로 오셔서 그것들을 고쳐 주셨습니다. 그분은 우리 학교를 공부하기에 좋은 곳으로 만들기 위해 열심히 일하십니다.", "\"저는 우리 학생들을 위해 일하는 것이 정말 좋습니다. 만약 학교 시설에 대해 궁금한 점이 있다면, 주저하지 말고 저에게 물어보세요!\"", "- 김 선생님", "다음 상은… 급식실 직원 리더이신 이 선생님께 드립니다! 많은 학생들이 우리 학교 점심이 최고라고 말합니다. 이 선생님은 매일 우리에게 신선하고 맛있는 식사를 준비해 주십니다. 점심시간에는 환하게 미소 지으며 우리에게 음식을 나눠 주십니다. 학생들이 급식실을 떠난 후에는, 설거지를 하시고 급식실을 청소하십니다.", "\"학생들이 점심을 맛있게 먹을 때 저는 행복합니다. 맛있고 건강한 음식을 제공할 수 있어서 자랑스럽습니다.\"", "- 이 선생님"];
