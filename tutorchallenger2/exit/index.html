ce because their spacecraft breaks.","ko":"영화 「그래비티」에서 우주 비행사들은 우주선이 부서지기 때문에 우주를 표류한다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"In the film Gravity, two astronauts accidentally drift off into space when the rope that attaches their spacesuits to their spacecraft breaks while they are on a spacewalk.","영화 「그래비티」에서 두 명의 우주 비행사는 그들이 우주 유영을 하는 동안 그들의 우주복을 우주선에 부착해 주는 줄이 끊어질 때 뜻하지 않게 우주를 표류하게 된다."]],"w":"1번 문장에서 끊어지는 것은 우주선이 아니라 우주복을 우주선에 이어 주는 줄(the rope)이에요. 줄이 끊길 때 우주 비행사들이 떠내려가요.","c":"F"},"h":"25b68073ac"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…might end up descending toward Earth…)","ko":"…결국 지구 쪽으로 내려오게 될 수도 있다.","opts":["위로 올라가는","내려오는(하강하는)","멈춰 서는","빙글빙글 도는"],"word":"descending","r":{"a":"2) 내려오는(하강하는)","ev":"5번 문장","s":[[5,"They wouldn’t be able to get back to their spacecraft and might end up descending toward Earth, eventually burning up in the atmosphere.","그들은 우주선으로 돌아갈 수 없으며, 결국 지구로 하강해 마침내 대기층에서 불타버리게 될 수도 있다."]],"w":"5번 문장은 우주선으로 돌아가지 못하고 지구를 향해 내려오다가 대기층에서 불탄다는 내용이에요. descend(하강하다)가 '내려오다'라는 뜻이에요.","c":2},"h":"90e481a475"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…astronauts are equipped with enough oxygen…)","ko":"…우주 비행사들은 충분한 산소를 갖추고 있다.","opts":["갖추고 있는","필요로 하지 않는","잃어버린","나누어 주는"],"word":"equipped","r":{"a":"1) 갖추고 있는","ev":"8번 문장","s":[[8,"The jetpack has three pounds of fuel, and astronauts are equipped with enough oxygen to breathe for seven and a half hours.","제트팩에는 3파운드의 연료가 들어 있고, 우주 비행사들은 7시간 반 동안 호흡할 수 있는 충분한 산소를 갖추고 있다."]],"w":"8번 문장은 우주 비행사가 7시간 반 동안 숨 쉴 산소를 갖추고 있다는 내용이에요. be equipped with는 '~을 갖추고 있다'예요.","c":1},"h":"f44f8ccefa"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nFirst, the jetpack stops the astronauts from spinning around and around, and then it provides them with the ability to navigate through space.","ko":"밑줄 친 them가 가리키는 것은?","sko":"우선, 제트팩은 우주 비행사들이 계속해서 도는 것을 막아 주고, 그러고 나서 제트팩은 우주 비행사들이 우주를 움직여 다닐 수 있는 능력을 제공해 준다.","opts":["우주 비행사들","제트팩들","우주선들","연료와 산소"],"r":{"a":"1) 우주 비행사들","ev":"7번 문장","s":[[7,"First, the jetpack stops the astronauts from spinning around and around, and then it provides them with the ability to navigate through space.","우선, 제트팩은 우주 비행사들이 계속해서 도는 것을 막아 주고, 그러고 나서 제트팩은 우주 비행사들이 우주를 움직여 다닐 수 있는 능력을 제공해 준다."]],"w":"7번 문장에서 제트팩이 the astronauts를 도는 것에서 막아 주고, then it provides them with the ability라고 해요. them은 앞에 나온 the astronauts예요.","c":1},"h":"febfdcadfb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If this really happened, the astronauts would float away helplessly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만일 이런 일이 실제로 일어난다면, 우주 비행사들은 어찌할 도리 없이 떠돌아다니게 될 것이다.","opts":["이런 일은 이미 자주 일어나서 우주 비행사들이 떠돌아다니고 있다.","우주 비행사들은 스스로 방향을 바꾸어 우주선으로 돌아올 것이다.","만일 이런 일이 실제로 일어난다면, 우주 비행사들은 어찌할 도리 없이 떠돌아다니게 될 것이다.","이런 일이 일어나도 우주 비행사들은 떠돌아다니지 않을 것이다."],"r":{"a":"3) 만일 이런 일이 실제로 일어난다면, 우주 비행사들은 어찌할 도리 없이 떠돌아다니게 될 것이다.","ev":"3번 문장","s":[[3,"If this really happened, the astronauts would float away helplessly.","만일 이런 일이 실제로 일어난다면, 우주 비행사들은 어찌할 도리 없이 떠돌아다니게 될 것이다."]],"w":"If this really happened ~ would float away는 '만약 일어난다면 떠돌아다니게 될 것이다'라는 가정이에요. 이미 일어났다는 말도, 스스로 돌아온다는 말도 아니에요.","c":3},"h":"b534a15aff"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우주 비행사들은 발차기와 팔다리 흔들기로 우주에서 방향을 바꿀 수 있다.","제트팩이 없는 우주 비행사들도 우주선으로 안전하게 돌아올 수 있다.","SAFER는 「그래비티」 같은 영화에만 나오는 제트팩이다.","제트팩은 우주 비행사들이 우주선으로 안전하게 돌아오도록 돕는다."],"opts":["Astronauts can change direction in space by kicking and waving.","Astronauts without a jetpack could safely return to their spacecraft.","SAFER is a jetpack that only appears in movies like Gravity.","The jetpack helps astronauts return safely to the spacecraft."],"r":{"a":"4) The jetpack helps astronauts return safely to the spacecraft.","ev":"9번 문장","s":[[9,"With these jetpacks, astronauts can return safely to the spacecraft!","이 제트팩을 이용하여 우주 비행사들은 우주선으로 안전하게 돌아올 수 있다!"]],"w":"9번에서 제트팩을 이용하면 우주선으로 안전하게 돌아올 수 있다고 해요. 발차기로는 방향을 못 바꾸고(4번), 제트팩이 없으면 돌아갈 수 없으며(5번), SAFER는 NASA가 실제로 착용하게 하는 제트팩이에요(6번).","c":4},"h":"731809d298"},{"n":9,"t":"sum","q":"They wouldn’t be able to get back to their spacecraft and might end up descending toward Earth, (A) burning up in the (B).","ko":"그들은 우주선으로 돌아갈 수 없고, 지구로 하강해 (A) (B)에서 불타 버리게 될 수도 있다.","opts":["(A) eventually / (B) atmosphere","(A) eventually / (B) ocean","(A) happily / (B) atmosphere","(A) happily / (B) ocean","(A) never / (B) atmosphere"],"oko":["(A) 결국 / (B) 대기","(A) 결국 / (B) 바다","(A) 행복하게 / (B) 대기","(A) 행복하게 / (B) 바다","(A) 결코 / (B) 대기"],"r":{"a":"1) (A) eventually / (B) atmosphere ((A) 결국 / (B) 대기)","ev":"5번 문장","s":[[5,"They wouldn’t be able to get back to their spacecraft and might end up descending toward Earth, eventually burning up in the atmosphere.","그들은 우주선으로 돌아갈 수 없으며, 결국 지구로 하강해 마침내 대기층에서 불타버리게 될 수도 있다."]],"c":1,"k":null},"h":"d8e4879f28"},{"n":10,"t":"fill","q":"Among astronauts, this [A] is [B] “going overboard.”","ko":"우주 비행사들 사이에서 이 [A]은(는) ‘오버보드에 처한다’라고 [B].","bank":["situation","called","oxygen","fuel","attached","spinning"],"bko":{"situation":"상황","called":"불린다 (call의 과거분사)","oxygen":"산소","fuel":"연료","attached":"부착된 (attach의 과거분사)","spinning":"도는 것"},"r":{"a":"[A] situation (상황), [B] called (불린다 (call의 과거분사))","ev":"2번 문장","s":[[2,"Among astronauts, this situation is called “going overboard.”","우주 비행사들 사이에서 이런 상황은 ‘오버보드에 처한다’라고 불린다."]],"c":null,"k":null},"h":"8db9f122bd"}]},{"u":4,"id":"ch2-04-2","no":2,"ko":"들어올 순 있어도, 나갈 순 없다","items":[{"n":1,"t":"tf","q":"The exhaust fans remove air from a closed-off room and create a vacuum effect.","ko":"배기 송풍기는 밀폐된 방에서 공기를 빼내어 진공 효과를 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The exhaust fans steadily remove air from the closed-off room, creating a vacuum effect.","배기 송풍기는 밀폐된 방으로부터 공기를 지속적으로 제거하며, 진공 효과를 만들어낸다."]],"w":"6번 문장에 The exhaust fans steadily remove air from the closed-off room, creating a vacuum effect가 있어요. 공기를 지속적으로 빼내서 진공 효과를 만든다는 내용이에요.","c":"T"},"h":"c2e7fda674"},{"n":2,"t":"tf","q":"HEPA filters are optional in negative pressure rooms.","ko":"HEPA 필터는 음압 병실에서 선택 사항이다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Additionally, high-efficiency particulate air (HEPA) filters must be used.","추가적으로, 고성능 미립자 공기(HEPA) 필터가 반드시 사용되어야 한다."]],"w":"10번 문장에서 HEPA 필터는 반드시 사용되어야 한다(must be used)고 해요. 선택 사항이라는 말은 반대예요.","c":"F"},"h":"e17f9b81f6"},{"n":3,"t":"tf","q":"Negative pressure rooms keep their doors and windows open to keep the pressure low.","ko":"음압 병실은 압력을 낮게 유지하려고 문과 창문을 열어 둔다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"To maintain low pressure, these rooms must also be tightly sealed, with secure doors, windows, and openings.","낮은 압력을 유지하기 위해, 이 방들은 반드시 안전한 문, 창문, 틈새로 단단히 밀폐되어 있어야 한다."]],"w":"12번 문장에서 낮은 압력을 유지하려면 문, 창문, 틈새로 단단히 밀폐되어야 한다(tightly sealed)고 해요. 열어 둔다는 말은 반대예요.","c":"F"},"h":"76da4e84a9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…air from the surrounding environment is pulled into the room to equalize the pressure…)","ko":"…압력을 평형이 되게 하려고 주변 환경의 공기가 방 안으로 빨려 들어온다…","opts":["높이다","낮추다","같게 하다(평형을 이루게 하다)","측정하다"],"word":"equalize","r":{"a":"3) 같게 하다(평형을 이루게 하다)","ev":"7번 문장","s":[[7,"As a result, when a door is opened or a breach occurs, air from the surrounding environment is pulled into the room to equalize the pressure, preventing contaminants from spreading to other spaces.","그 결과, 문이 열리거나 틈이 생길 때, 압력이 평형을 이루기 위해 주변 환경으로부터 공기가 방 안으로 빨려 들어와 오염물질이 다른 장소로 퍼지는 것을 막는다."]],"w":"7번 문장은 방 안 압력이 낮으니 바깥 공기가 들어와 압력을 같게 맞춘다는 내용이에요. equalize는 '같게 하다, 평형을 이루게 하다'예요.","c":3},"h":"5ac6835fc3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…these advanced filters are essential to trapping bacteria and viruses.)","ko":"…이 선진 필터는 박테리아와 바이러스를 걸러내는 데 필수적이다.","opts":["필수적인","값비싼","불필요한","위험한"],"word":"essential","r":{"a":"1) 필수적인","ev":"11번 문장","s":[[11,"Being able to capture at least 99.97% of particles as small as 0.3 micrometers, these advanced filters are essential to trapping bacteria and viruses.","이 선진 필터는 0.3마이크로미터만큼 작은 입자를 최소 99.97%까지 포집할 수 있어, 박테리아와 바이러스를 걸러내는 데 필수적이다."]],"w":"11번 문장은 필터가 박테리아와 바이러스를 걸러내는 데 꼭 필요하다는 내용이에요. essential은 '필수적인'이에요.","c":1},"h":"90c47042b3"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThe answer lies in negative pressure rooms, which were widely used during the COVID-19 pandemic.","ko":"밑줄 친 which이(가) 가리키는 것은?","sko":"그 해답은 음압 병실에 있는데, 이 병실들은 코로나19 유행병 동안 널리 사용되었다.","opts":["음압 병실","해답","코로나19","병원"],"pron":"which","r":{"a":"1) 음압 병실","ev":"2번 문장","s":[[2,"The answer lies in negative pressure rooms, which were widely used during the COVID-19 pandemic.","그 해답은 음압 병실에 있는데, 이 병실들은 코로나19 유행병 동안 널리 사용되었다."]],"c":1,"k":"which = 음압 병실"},"h":"5ac8bf8ee5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"How do hospitals stop the spread of infectious diseases among patients, despite being full of germs?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"세균으로 가득함에도 불구하고, 어떻게 병원들은 환자들간의 전염병의 확산을 막을까?","opts":["병원은 세균을 없애려고 어떻게 환자들 사이를 돌아다닐까?","병원은 세균으로 가득한데도 어떻게 환자들 사이에 전염병이 퍼지는 것을 막을까?","병원에서 환자들은 세균 때문에 왜 전염병에 걸릴까?","병원은 세균이 가득해서 전염병을 막을 수 없는 이유가 무엇일까?"],"r":{"a":"2) 병원은 세균으로 가득한데도 어떻게 환자들 사이에 전염병이 퍼지는 것을 막을까?","ev":"1번 문장","s":[[1,"How do hospitals stop the spread of infectious diseases among patients, despite being full of germs?","세균으로 가득함에도 불구하고, 어떻게 병원들은 환자들간의 전염병의 확산을 막을까?"]],"w":"1번은 '세균이 가득한데도(despite) 전염병 확산을 어떻게 막는가'를 묻는 문장이에요. 방법을 묻는 질문이고, 막을 수 없다는 뜻이 아니에요.","c":2},"h":"b3e5b760d6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["음압 병실의 환기 시스템에는 배기 송풍기, 흡기 통풍구, 공기 압력 측정기가 포함된다.","배기 송풍기는 바깥 공기를 밀폐된 방 안으로 밀어 넣는다.","문이 열리면 방 안의 공기가 주변 환경으로 쏟아져 나간다.","HEPA 필터는 작은 입자의 아주 일부만 포집할 수 있다."],"opts":["The ventilation system of a negative pressure room includes exhaust fans, intake vents, and air pressure monitors.","The exhaust fans push outside air into the closed-off room.","When a door is opened, air inside the room rushes out to the surrounding environment.","HEPA filters can capture only a small part of the tiny particles."],"r":{"a":"1) The ventilation system of a negative pressure room includes exhaust fans, intake vents, and air pressure monitors.","ev":"5, 6, 7, 11번 문장","s":[[5,"This is achieved through a specially-designed ventilation system, which includes exhaust fans, intake vents, and air pressure monitors.","이것은 배기 송풍기, 흡기 통풍구, 공기 압력 측정기를 포함한 특수 설계된 환기 시스템을 통해 이루어진다."],[6,"The exhaust fans steadily remove air from the closed-off room, creating a vacuum effect.","배기 송풍기는 밀폐된 방으로부터 공기를 지속적으로 제거하며, 진공 효과를 만들어낸다."],[7,"As a result, when a door is opened or a breach occurs, air from the surrounding environment is pulled into the room to equalize the pressure, preventing contaminants from spreading to other spaces.","그 결과, 문이 열리거나 틈이 생길 때, 압력이 평형을 이루기 위해 주변 환경으로부터 공기가 방 안으로 빨려 들어와 오염물질이 다른 장소로 퍼지는 것을 막는다."],[11,"Being able to capture at least 99.97% of particles as small as 0.3 micrometers, these advanced filters are essential to trapping bacteria and viruses.","이 선진 필터는 0.3마이크로미터만큼 작은 입자를 최소 99.97%까지 포집할 수 있어, 박테리아와 바이러스를 걸러내는 데 필수적이다."]],"w":"5번에서 환기 시스템에 배기 송풍기, 흡기 통풍구, 공기 압력 측정기가 들어 있다고 해요. 송풍기는 공기를 빼내고(6번), 문이 열리면 바깥 공기가 안으로 들어오며(7번), HEPA 필터는 입자를 99.97% 이상 포집해요(11번).","c":1},"h":"a8bb9b5fb0"},{"n":9,"t":"sum","q":"For negative pressure rooms to be (A), several key design (B) are necessary.","ko":"음압 병실이 (A)이기 위해서는 몇 가지 중요한 설계 (B)이(가) 필요하다.","opts":["(A) effective / (B) features","(A) effective / (B) mistakes","(A) empty / (B) features","(A) empty / (B) mistakes","(A) dangerous / (B) features"],"oko":["(A) 효과적 / (B) 요소","(A) 효과적 / (B) 실수","(A) 텅 빈 / (B) 요소","(A) 텅 빈 / (B) 실수","(A) 위험한 / (B) 요소"],"r":{"a":"1) (A) effective / (B) features ((A) 효과적 / (B) 요소)","ev":"8번 문장","s":[[8,"For negative pressure rooms to be effective, several key design features are necessary.","음압 병실이 효과적이기 위해선, 몇 가지 중요한 설계 요소가 필요하다."]],"c":1,"k":null},"h":"80a640c6cb"},{"n":10,"t":"fill","q":"Air pressure monitors are needed to [A] measure and [B] the pressure difference between the room and its surroundings.","ko":"공기 압력 측정기는 방과 주변 환경 사이의 압력 차이를 [A] 측정하고 [B]하기 위해 필요하다.","bank":["continuously","display","filters","vents","windows","particles"],"bko":{"continuously":"계속해서","display":"표시하다","filters":"필터","vents":"통풍구","windows":"창문","particles":"입자"},"r":{"a":"[A] continuously (계속해서), [B] display (표시하다)","ev":"9번 문장","s":[[9,"Air pressure monitors are needed to continuously measure and display the pressure difference between the room and its surroundings.","방과 주변 환경 사이의 압력 차이를 지속적으로 측정하고 표시하기 위한 공기 압력 측정기가 필요하다."]],"c":null,"k":null},"h":"c880baa0f8"}]},{"u":4,"id":"ch2-04-3","no":3,"ko":"가까워질수록 높아지는 것들","items":[{"n":1,"t":"tf","q":"The Doppler Effect was first explained by Christian Doppler in 1842.","ko":"도플러 효과는 1842년 크리스티안 도플러에 의해 처음 설명되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This is the Doppler Effect, first explained by Christian Doppler in 1842.","이것은 1842년 크리스티안 도플러에 의해 처음 설명된, 도플러 효과이다."]],"w":"3번 문장에 first explained by Christian Doppler in 1842가 그대로 있어요.","c":"T"},"h":"1a17b5f40d"},{"n":2,"t":"tf","q":"When an object moves away from us, its light waves are squeezed and shift toward the blue end of the spectrum.","ko":"물체가 우리에게서 멀어지면 그 빛의 파동은 압축되어 스펙트럼의 파란색 끝 쪽으로 이동한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"When an object moves away from us, the light waves stretch, causing a shift toward the red end of the spectrum, also known as redshift.","물체가 우리로부터 멀어질 때, 빛의 파동은 늘어나면서 스펙트럼의 빨간색 끝 쪽으로의 이동이 일어나는데, 이를 적색편이라고 한다."]],"w":"9번 문장에서 물체가 멀어지면 빛의 파동은 늘어나서(stretch) 빨간색 끝 쪽으로 이동한다고 해요. 압축되어 파란 쪽으로 가는 것은 다가올 때(10번)예요.","c":"F"},"h":"52d1de049a"},{"n":3,"t":"tf","q":"Lower frequencies produce higher pitches.","ko":"더 낮은 주파수는 더 높은 음을 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"If sources have higher frequencies, they produce higher pitches; lower frequencies produce lower pitches.","만약 (소리의) 근원이 높은 주파수를 가지고 있다면, 그들은 높은 음을 만들고, 낮은 주파수는 낮은 음을 만든다."]],"w":"5번 문장에서 높은 주파수는 높은 음을, 낮은 주파수는 낮은 음을 만든다고 해요. 낮은 주파수가 높은 음을 만든다는 말은 반대예요.","c":"F"},"h":"94d8fa814b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…as the observer and source move relative to each other.)","ko":"…관찰자와 근원이 서로 상대적으로 이동할 때…","opts":["따로따로","상대적으로(서로에 대해)","갑자기","아주 빠르게"],"word":"relative","r":{"a":"2) 상대적으로(서로에 대해)","ev":"4번 문장","s":[[4,"It is the change in wave frequency as the observer and source move relative to each other.","이는 관찰자와 (소리의) 근원이 서로 상대적으로 이동할 때 파동의 주파수에서의 변화이다."]],"w":"4번 문장은 관찰자와 소리의 근원이 서로에 대해 움직이는 상황이에요. relative to each other는 '서로에 대해 상대적으로'라는 뜻이에요.","c":2},"h":"35e1aa6534"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Conversely, as it moves away, the waves travel farther to reach your ears…)","ko":"반대로, 소방차가 멀어질 때, 파동은 당신의 귀에 닿으려고 더 멀리 이동한다…","opts":["게다가","그 결과","반대로","예를 들어"],"word":"Conversely","r":{"a":"3) 반대로","ev":"7번 문장","s":[[7,"Conversely, as it moves away, the waves travel farther to reach your ears, resulting in stretched waves, and ultimately, a lower pitch.","반대로, 소방차가 멀어질 때, 파동이 당신의 귀에 도달하기 위해 멀리 이동하는데, 그 결과 늘어난 파동이 되고 결국 낮은 음이 난다."]],"w":"6번은 다가올 때 파동이 압축된다는 내용이고, 7번은 멀어질 때 파동이 늘어난다는 반대 상황이에요. Conversely는 '반대로'라는 뜻이에요.","c":3},"h":"e896a50320"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nWhen the fire truck approaches, its sound waves are squeezed, increasing the frequency, and ultimately, the pitch.","ko":"밑줄 친 its이(가) 가리키는 것은?","sko":"소방차가 다가올 때, 그것의 소리의 파동은 압축되어 주파수를 증가시키고 결국 음을 높인다.","opts":["소방차","관찰자","파동","소리"],"pron":"its","r":{"a":"1) 소방차","ev":"6번 문장","s":[[6,"When the fire truck approaches, its sound waves are squeezed, increasing the frequency, and ultimately, the pitch.","소방차가 다가올 때, 그것의 소리의 파동은 압축되어 주파수를 증가시키고 결국 음을 높인다."]],"c":1,"k":"its = 소방차"},"h":"9c9695c76c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"How interesting that it sounds higher-pitched as it approaches and lower as it moves away.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"소리가 다가올 때는 고음으로 들리고, 멀어질 때는 저음으로 들린다는 것은 얼마나 흥미로운가.","opts":["소리가 다가올 때는 저음으로 들리고, 멀어질 때는 고음으로 들린다는 것은 흥미롭다.","소방차 소리는 다가올 때 더 크게 들린다는 것은 흥미롭다.","소방차가 빨리 다가올수록 소리가 높아진다는 것은 흥미롭다.","소리가 다가올 때는 고음으로 들리고, 멀어질 때는 저음으로 들린다는 것은 흥미롭다."],"r":{"a":"4) 소리가 다가올 때는 고음으로 들리고, 멀어질 때는 저음으로 들린다는 것은 흥미롭다.","ev":"2번 문장","s":[[2,"How interesting that it sounds higher-pitched as it approaches and lower as it moves away.","소리가 다가올 때는 고음으로 들리고, 멀어질 때는 저음으로 들린다는 것은 얼마나 흥미로운가."]],"w":"2번은 다가올 때 higher-pitched(음이 높게), 멀어질 때 lower(낮게) 들린다는 내용이에요. 반대로 쓰거나, 소리의 크기·속도로 바꾸면 틀려요.","c":4},"h":"b1816e8692"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["소방차의 소리 파동은 소방차가 가까워지면 늘어난다.","적색편이는 물체가 우리 쪽으로 다가올 때 일어난다.","물체가 우리 쪽으로 다가오면 그 압축된 빛의 파동은 스펙트럼의 파란색 끝 쪽으로 이동한다.","천문학자들은 도플러 효과를 소리 파동에만 이용한다."],"opts":["The sound waves of a fire truck become stretched when it comes closer.","Redshift occurs when an object moves toward us.","When an object comes toward us, its compressed light waves move toward the blue end of the spectrum.","Astronomers use the Doppler Effect only for sound waves."],"r":{"a":"3) When an object comes toward us, its compressed light waves move toward the blue end of the spectrum.","ev":"6, 9, 10, 11번 문장","s":[[6,"When the fire truck approaches, its sound waves are squeezed, increasing the frequency, and ultimately, the pitch.","소방차가 다가올 때, 그것의 소리의 파동은 압축되어 주파수를 증가시키고 결국 음을 높인다."],[9,"When an object moves away from us, the light waves stretch, causing a shift toward the red end of the spectrum, also known as redshift.","물체가 우리로부터 멀어질 때, 빛의 파동은 늘어나면서 스펙트럼의 빨간색 끝 쪽으로의 이동이 일어나는데, 이를 적색편이라고 한다."],[10,"On the other hand, blueshift occurs when the compressed waves of an approaching object move toward the blue end of the spectrum.","반면, 청색편이는 다가오는 물체의 압축된 파동이 스펙트럼의 파란색 끝 쪽으로 이동할 때 발생한다."],[11,"Astronomers apply these shifts to understand the movement of objects in space, making it crucial for charting the universe.","천문학자들은 우주에서 물체의 움직임을 이해하기 위해 이러한 변화를 적용하며, 이것은 우주를 지도화하는 데 중요해진다."]],"w":"10번에서 다가오는 물체의 압축된 파동은 파란색 끝 쪽으로 이동한다고 해요. 가까워지면 파동은 압축되고(6번), 적색편이는 멀어질 때 일어나며(9번), 천문학자들은 빛의 변화를 이용해요(11번).","c":3},"h":"aadaf97b1c"},{"n":9,"t":"sum","q":"While you’re (A) down a (B), you hear a fire truck’s siren.","ko":"당신이 (B)을(를) 따라 (A) 있는 동안, 당신은 소방차 사이렌 소리를 듣는다.","opts":["(A) walking / (B) street","(A) walking / (B) sea","(A) swimming / (B) street","(A) swimming / (B) sea","(A) sleeping / (B) sea"],"oko":["(A) 걷고 / (B) 거리","(A) 걷고 / (B) 바다","(A) 수영하고 / (B) 거리","(A) 수영하고 / (B) 바다","(A) 자고 / (B) 바다"],"r":{"a":"1) (A) walking / (B) street ((A) 걷고 / (B) 거리)","ev":"1번 문장","s":[[1,"While you’re walking down a street, you hear a fire truck’s siren.","당신이 거리를 걷고 있는 동안, 당신은 소방차 사이렌 소리를 듣는다."]],"c":1,"k":null},"h":"64938a9ad1"},{"n":10,"t":"fill","q":"The Doppler Effect can [A] us make sense of everyday [B] as well as complex scientific research.","ko":"도플러 효과는 우리가 복잡한 과학 연구뿐만 아니라 일상적인 [B]을(를) 이해하도록 [A] 수 있다.","bank":["help","experiences","produce","occur","spectrum","observer"],"bko":{"help":"돕다","experiences":"경험","produce":"만들어 내다","occur":"발생하다","spectrum":"스펙트럼","observer":"관찰자"},"r":{"a":"[A] help (돕다), [B] experiences (경험)","ev":"12번 문장","s":[[12,"The Doppler Effect can help us make sense of everyday experiences as well as complex scientific research.","도플러 효과는 우리가 복잡한 과학 연구뿐만 아니라 일상적인 경험을 이해하는 것을 도울 수 있다."]],"c":null,"k":null},"h":"35ec9a32c2"}]},{"u":4,"id":"ch2-04-4","no":4,"ko":"수능:ON 짧은 어구 빈칸 추론","items":[{"n":1,"t":"tf","q":"The satellite carries a fishing net, and the satellite is launched into space.","ko":"인공위성은 어망을 달고 우주로 발사된다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"They will attach a thin metal fishing net to a satellite and then launch the satellite into space.","그들은 인공위성에 얇은 금속제 어망을 부착한 다음에 그 인공위성을 우주로 발사할 것이다."]],"w":"9번 문장에 They will attach a thin metal fishing net to a satellite and then launch the satellite into space가 있어요. 어망을 인공위성에 붙인 다음 그 위성을 우주로 발사한다는 내용이에요.","c":"T"},"h":"7c313902e6"},{"n":2,"t":"tf","q":"The net and the junk will turn into new satellites when they enter the Earth’s atmosphere.","ko":"그물과 쓰레기는 지구의 대기권에 진입하면 새로운 인공위성으로 바뀐다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"The net and the junk will burn up as they enter the Earth’s atmosphere.","그 그물과 쓰레기는 지구의 대기권에 진입할 때 불타 없어지게 된다."]],"w":"12번 문장에서 그물과 쓰레기는 대기권에 진입할 때 불타 없어진다(burn up)고 해요. 새 인공위성이 된다는 말은 없어요.","c":"F"},"h":"bbabda1249"},{"n":3,"t":"tf","q":"Scientists estimate that there are about 37,000 pieces of space debris in the Earth’s orbit.","ko":"과학자들은 지구 궤도에 약 3만 7천 개의 우주 쓰레기 조각이 있다고 추정한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In fact, scientists estimate that there are 370,000 pieces of space debris up there.","실제로, 과학자들은 그곳에 37만 개의 우주 쓰레기 조각이 있다고 추정한다."]],"w":"4번 문장에서 과학자들이 추정하는 우주 쓰레기는 37만 개(370,000)예요. 3만 7천 개가 아니에요.","c":"F"},"h":"107d6ab88c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…scientists estimate that there are 370,000 pieces of space debris up there.)","ko":"…과학자들은 그곳에 37만 개의 우주 쓰레기 조각이 있다고 추정한다.","opts":["제거하다","발사하다","추정하다","부착하다"],"word":"estimate","r":{"a":"3) 추정하다","ev":"4번 문장","s":[[4,"In fact, scientists estimate that there are 370,000 pieces of space debris up there.","실제로, 과학자들은 그곳에 37만 개의 우주 쓰레기 조각이 있다고 추정한다."]],"w":"4번 문장은 과학자들이 우주 쓰레기가 37만 개쯤 있다고 대략 헤아려 말하는 내용이에요. estimate는 '추정하다'예요.","c":3},"h":"6cc6e23ad3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Several weeks later the net, charged with electricity, will be pulled down…)","ko":"몇 주 후, 전기로 충전된 그 그물은 당겨 내려지게 될 것이다…","opts":["충전된","부러진","젖은","얼어붙은"],"word":"charged","r":{"a":"1) 충전된","ev":"11번 문장","s":[[11,"Several weeks later the net, charged with electricity, will be pulled down by the Earth’s magnetic field.","몇 주 후, 전기로 충전된 그 그물은 지구 자기장에 의해서 당겨지게 될 것이다."]],"w":"11번 문장에서 그물은 전기(electricity)로 채워진 상태로 지구 자기장에 당겨져요. charge는 '충전하다'라서 charged with electricity는 '전기로 충전된'이에요.","c":1},"h":"a276cd70bd"},{"n":6,"t":"ref","q":"What does the underlined \"we\" refer to?\nThis could be a big problem, as we rely on satellites for many important things, like GPS, international phone connections, television signals, and weather forecasts.","ko":"밑줄 친 we이(가) 가리키는 것은?","sko":"이것은 큰 문제일 수 있는데, 우리가 GPS, 국제 전화 연결, 텔레비전 신호 그리고 일기 예보와 같은 많은 중요한 것들을 인공위성에 의존하고 있기 때문이다.","opts":["일본의 우주 과학자들","인공위성을 이용하는 사람들","어망 회사","인공위성들"],"pron":"we","r":{"a":"2) 인공위성을 이용하는 사람들","ev":"7번 문장","s":[[7,"This could be a big problem, as we rely on satellites for many important things, like GPS, international phone connections, television signals, and weather forecasts.","이것은 큰 문제일 수 있는데, 우리가 GPS, 국제 전화 연결, 텔레비전 신호 그리고 일기 예보와 같은 많은 중요한 것들을 인공위성에 의존하고 있기 때문이다."]],"c":2,"k":"we = 인공위성을 이용하는 사람들"},"h":"a24ae2aebe"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"To deal with this, Japanese space scientists and a 100-year-old fishing net company came up with a brilliant idea.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이를 해결하기 위해, 일본의 우주 과학자들과 백 년의 전통을 가진 한 어망 회사가 멋진 아이디어를 내놓았다.","opts":["일본의 우주 과학자들이 백 년 된 어망 회사 때문에 이 문제를 겪었다.","이를 해결하기 위해, 일본의 우주 과학자들과 백 년의 전통을 가진 한 어망 회사가 멋진 아이디어를 내놓았다.","일본의 우주 과학자들이 백 년 된 어망 회사의 아이디어를 거절했다.","백 년 된 어망 회사가 이 문제를 일으켜서 우주 과학자들이 화를 냈다."],"r":{"a":"2) 이를 해결하기 위해, 일본의 우주 과학자들과 백 년의 전통을 가진 한 어망 회사가 멋진 아이디어를 내놓았다.","ev":"8번 문장","s":[[8,"To deal with this, Japanese space scientists and a 100-year-old fishing net company came up with a brilliant idea.","이를 해결하기 위해, 일본의 우주 과학자들과 백 년의 전통을 가진 한 어망 회사가 멋진 아이디어를 내놓았다."]],"w":"To deal with this는 '이 문제를 해결하기 위해'이고, came up with a brilliant idea는 '멋진 아이디어를 내놓았다'예요. 문제를 해결하려고 과학자들과 어망 회사가 함께 아이디어를 낸 거예요.","c":2},"h":"7d8d0952f5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["인공위성은 일기 예보에만 사용된다.","그물은 지구의 대기권에 진입하기 전에 우주에서 불타 없어질 것이다.","그물은 인공위성이 궤도에 도달한 뒤에 날려 보내질 것이다.","어망은 바다에서 전혀 사용되지 않는다."],"opts":["Satellites are used only for weather forecasts.","The net will burn up in space before it enters the Earth’s atmosphere.","The net will be released after the satellite reaches its orbit.","Fishing nets are never used in the ocean."],"r":{"a":"3) The net will be released after the satellite reaches its orbit.","ev":"1, 7, 10, 12번 문장","s":[[1,"Fishing nets are commonly used in the ocean.","어망은 흔히 바다에서 사용된다."],[7,"This could be a big problem, as we rely on satellites for many important things, like GPS, international phone connections, television signals, and weather forecasts.","이것은 큰 문제일 수 있는데, 우리가 GPS, 국제 전화 연결, 텔레비전 신호 그리고 일기 예보와 같은 많은 중요한 것들을 인공위성에 의존하고 있기 때문이다."],[10,"Once the satellite is in orbit, the net will be released to collect space junk.","그 인공위성이 궤도에 진입하면, 그물은 우주 쓰레기를 수거하기 위해 날려 보내질 것이다."],[12,"The net and the junk will burn up as they enter the Earth’s atmosphere.","그 그물과 쓰레기는 지구의 대기권에 진입할 때 불타 없어지게 된다."]],"w":"10번에서 인공위성이 궤도에 들어서면(Once the satellite is in orbit) 그물을 날려 보낸다고 해요. 인공위성은 GPS, 전화, TV, 일기 예보 등에 쓰이고(7번), 그물은 대기권에 진입할 때 불타며(12번), 어망은 바다에서 흔히 쓰여요(1번).","c":3},"h":"e5e4fc682e"},{"n":9,"t":"sum","q":"In this way, a simple fishing net will make space much (A) and (B)!","ko":"이런 방법으로, 단순한 어망이 우주를 훨씬 더 (A) 더 (B) 만들어 줄 것이다!","opts":["(A) cleaner / (B) safer","(A) dirtier / (B) safer","(A) cleaner / (B) riskier","(A) dirtier / (B) riskier","(A) darker / (B) safer"],"oko":["(A) 깨끗하고 / (B) 안전하게","(A) 더럽고 / (B) 안전하게","(A) 깨끗하고 / (B) 위험하게","(A) 더럽고 / (B) 위험하게","(A) 어둡고 / (B) 안전하게"],"r":{"a":"1) (A) cleaner / (B) safer ((A) 깨끗하고 / (B) 안전하게)","ev":"13번 문장","s":[[13,"In this way, a simple fishing net will make space much cleaner and safer!","이런 방법으로, 단순한 어망이 우주를 훨씬 더 깨끗하고 안전하게 만들어 줄 것이다!"]],"c":1,"k":null},"h":"6c4fdae5fd"},{"n":10,"t":"fill","q":"A [A] would result in thousands more pieces of debris, possibly [B] other satellites.","ko":"한 번의 [A](으)로 수천 개의 더 많은 잔해가 생기고, 아마도 다른 인공위성을 [B]할 수도 있다.","bank":["crash","destroying","forecast","signal","company","electricity"],"bko":{"crash":"충돌","destroying":"파괴하는 것","forecast":"예보","signal":"신호","company":"회사","electricity":"전기"},"r":{"a":"[A] crash (충돌), [B] destroying (파괴하는 것)","ev":"6번 문장","s":[[6,"A crash would result in thousands more pieces of debris, possibly destroying other satellites.","한 번의 충돌로 수천 개의 더 많은 잔해가 생길 것이며, 아마도 다른 인공위성을 파괴할 수도 있다."]],"c":null,"k":null},"h":"214873671e"}]},{"u":5,"id":"ch2-05-1","no":1,"ko":"딱 한 번만 팔았을 뿐인데","items":[{"n":1,"t":"tf","q":"At closing time, the new employee told the manager that he had made only one sale.","ko":"문을 닫을 시간에 신입 사원은 관리자에게 자신이 판매를 한 건만 성사시켰다고 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"At closing time, when the manager inquired how many sales the man had made, he replied that he had made a single sale.","문을 닫을 시간에, 관리자가 그 남자가 판매를 몇 건이나 성사시켰는지 물었을 때, 그는 한 건의 판매만 성사시켰다고 대답했다."]],"w":"3번 문장에 he replied that he had made a single sale(한 건의 판매만 성사시켰다고 대답했다)이라고 나와요. a single sale은 only one sale과 같은 말이에요.","c":"T"},"h":"846de2b7cf"},{"n":2,"t":"tf","q":"The manager was pleased because most of the other employees had made only a few sales.","ko":"관리자는 대부분의 다른 직원들이 판매를 몇 건밖에 성사시키지 못해서 기뻐했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The manager turned red with rage and shouted that most of the other employees had made dozens of sales worth hundreds of dollars.","관리자는 매우 화가 나서 얼굴이 붉어졌고 대부분의 다른 직원들은 수백 달러어치의 판매 수십 건을 성사시켰다고 큰 소리로 말했다."]],"w":"4번 문장에서 다른 직원들은 판매를 수십 건(dozens of sales) 성사시켰고, 관리자는 기뻐한 것이 아니라 화가 나서 얼굴이 붉어졌어요(turned red with rage).","c":"F"},"h":"5ddff8ab15"},{"n":3,"t":"tf","q":"The employee sold the customer a speedboat after telling him where the biggest fish are.","ko":"직원은 가장 큰 물고기가 어디에 있는지 고객에게 알려 준 뒤 그에게 고속 모터보트를 팔았다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Then, after I informed him that the biggest fish are in the middle of the lake, I sold him a new speedboat.","그러고 나서, 제가 그분에게 가장 큰 물고기가 호수 가운데에 있다고 알려 드린 후에, 저는 그분에게 새 고속 모터보트를 팔았습니다."]],"w":"9번 문장에 after I informed him that the biggest fish are in the middle of the lake, I sold him a new speedboat가 있어요. 물고기가 호수 가운데에 있다고 알려 준 뒤에 보트를 판 거예요.","c":"T"},"h":"60815f6db5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The manager laughed skeptically and replied, “We shall see.”)","ko":"관리자는 웃으며 대답했다. “두고 봅시다.” (밑줄 친 단어의 뜻은?)","opts":["기쁘게","회의적으로","부끄러워하며","고마워하며"],"word":"skeptically","r":{"a":"2) 회의적으로","ev":"1~2번 문장","s":[[1,"A confident new employee at the region’s largest department store told his manager at the beginning of his first shift, “I’m the world’s greatest salesperson.”","지역 최대의 백화점의 한 자신감 있는 신입 사원은 그의 첫 교대 근무를 시작할 때 관리자에게 말했다. “저는 세계 최고의 영업 사원입니다.”"],[2,"The manager laughed skeptically and replied, “We shall see.”","관리자는 회의적으로 웃으며 대답했다. “두고 봅시다.”"]],"w":"1번에서 신입 사원이 ‘세계 최고의 영업 사원’이라고 큰소리쳤어요. 이에 관리자가 “We shall see(두고 봅시다)”라고 한 건 아직 믿지 못한다는 뜻이에요. skeptically = 회의적으로.","c":2},"h":"032f28eb81"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…and I convinced him that fishing is the best remedy for a headache.)","ko":"…그리고 저는 그분에게 낚시가 두통의 최고 치료제라고 했습니다. (밑줄 친 단어의 뜻은?)","opts":["무시했다","화나게 했다","도와주었다","확신시켰다"],"word":"convinced","r":{"a":"4) 확신시켰다","ev":"13번 문장","s":[[13,"“Actually, he came in to buy some aspirin, and I convinced him that fishing is the best remedy for a headache,” answered the employee.","“사실은, 그분은 아스피린을 좀 사러 오셨고, 저는 그분에게 낚시가 두통의 최고 치료제라고 확신시켜드렸습니다.”라고 그 사원이 대답했다."]],"w":"아스피린을 사러 온 손님에게 ‘낚시가 두통의 최고 치료제’라고 믿게 만든 장면이에요. convince(확신시키다, 납득시키다)의 과거형이 convinced예요.","c":4},"h":"c4c1fbce0d"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nAnd since he was worried that his vehicle wasn’t powerful enough to tow the boat, I sold him a new four-wheel-drive SUV.”","ko":"밑줄 친 he가 가리키는 것은?","sko":"그리고 그분이 자신의 차량이 그 보트를 끌 만큼 충분히 강력하지 않다고 걱정하셨기 때문에, 저는 그분에게 신형 사륜구동 SUV를 판매했습니다.”","opts":["그 고객","관리자","신입 사원","다른 직원들"],"r":{"a":"1) 그 고객","ev":"9~10번 문장","s":[[9,"Then, after I informed him that the biggest fish are in the middle of the lake, I sold him a new speedboat.","그러고 나서, 제가 그분에게 가장 큰 물고기가 호수 가운데에 있다고 알려 드린 후에, 저는 그분에게 새 고속 모터보트를 팔았습니다."],[10,"And since he was worried that his vehicle wasn’t powerful enough to tow the boat, I sold him a new four-wheel-drive SUV.”","그리고 그분이 자신의 차량이 그 보트를 끌 만큼 충분히 강력하지 않다고 걱정하셨기 때문에, 저는 그분에게 신형 사륜구동 SUV를 판매했습니다.”"]],"w":"걱정한 사람은 보트를 산 고객이에요. 말하는 직원은 스스로를 I로 쓰고 있어서(I sold him), he는 직원이 아니에요. 고객이 자기 차가 보트를 끌 만큼 힘이 약할까 걱정한 거예요.","c":1},"h":"a05da1f9a2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A customer wanted to purchase a fishing rod, and you sold him all that?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"한 고객이 낚싯대를 사고 싶어 했는데, 당신은 그분에게 그 모든 것을 판매했다고요?","opts":["고객이 낚싯대를 사려고 해서 당신은 낚싯대만 팔았다는 말이군요.","고객이 모든 물건을 사고 싶어 했는데 당신은 낚싯대만 팔았다는 거죠?","고객은 낚싯대 하나를 사려 했는데, 당신은 그 모든 것을 팔았다는 겁니까?","고객이 낚싯대를 사고 나서 다른 물건을 모두 환불했다는 겁니까?"],"r":{"a":"3) 고객은 낚싯대 하나를 사려 했는데, 당신은 그 모든 것을 팔았다는 겁니까?","ev":"12번 문장","s":[[12,"A customer wanted to purchase a fishing rod, and you sold him all that?” asked the manager.","한 고객이 낚싯대를 사고 싶어 했는데, 당신은 그분에게 그 모든 것을 판매했다고요?”라고 관리자가 물었다."]],"w":"관리자의 말은 고객이 원래 낚싯대(a fishing rod)만 사려 했다는 짐작과, 당신이 그 모든 것(all that)을 팔았냐는 놀람이 합쳐진 문장이에요. 낚싯대만 팔았다거나 환불했다는 내용은 없어요.","c":3},"h":"7ec662b1e2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["관리자는 그 남자가 판매를 한 건만 했다는 말을 듣고 기쁘게 웃었다.","고객은 자신의 차량이 보트를 끌 수 없을까 봐 걱정해서 SUV를 샀다.","고객은 직원이 가장 큰 물고기에 대해 알려 주기 전에 고속 모터보트를 샀다.","고객은 낚싯대를 사러 가게에 왔고, 직원은 그에게 아스피린도 팔았다."],"opts":["The manager laughed happily when he heard that the man had made only one sale.","The customer bought an SUV because he worried that his vehicle could not tow the boat.","The customer bought the speedboat before the employee told him about the biggest fish.","The customer came to the store to buy a fishing rod, and the employee sold him aspirin too."],"r":{"a":"2) The customer bought an SUV because he worried that his vehicle could not tow the boat.","ev":"4, 9~10, 13번 문장","s":[[4,"The manager turned red with rage and shouted that most of the other employees had made dozens of sales worth hundreds of dollars.","관리자는 매우 화가 나서 얼굴이 붉어졌고 대부분의 다른 직원들은 수백 달러어치의 판매 수십 건을 성사시켰다고 큰 소리로 말했다."],[9,"Then, after I informed him that the biggest fish are in the middle of the lake, I sold him a new speedboat.","그러고 나서, 제가 그분에게 가장 큰 물고기가 호수 가운데에 있다고 알려 드린 후에, 저는 그분에게 새 고속 모터보트를 팔았습니다."],[10,"And since he was worried that his vehicle wasn’t powerful enough to tow the boat, I sold him a new four-wheel-drive SUV.”","그리고 그분이 자신의 차량이 그 보트를 끌 만큼 충분히 강력하지 않다고 걱정하셨기 때문에, 저는 그분에게 신형 사륜구동 SUV를 판매했습니다.”"],[13,"“Actually, he came in to buy some aspirin, and I convinced him that fishing is the best remedy for a headache,” answered the employee.","“사실은, 그분은 아스피린을 좀 사러 오셨고, 저는 그분에게 낚시가 두통의 최고 치료제라고 확신시켜드렸습니다.”라고 그 사원이 대답했다."]],"w":"10번에서 고객이 차가 보트를 끌지 못할까 걱정해서 SUV를 샀어요. ①은 4번에서 관리자가 화가 났으므로 틀려요. ③은 9번에서 물고기 이야기를 들려준 뒤에 보트를 팔았으므로 틀려요. ④는 13번에서 고객은 아스피린을 사러 왔으므로 틀려요.","c":2},"h":"d4e3659778"},{"n":9,"t":"sum","q":"A (A) new employee at the region’s (B) department store told his manager, “I’m the world’s greatest salesperson.”","ko":"(A) 신입 사원이 그 지역의 (B) 백화점에서 관리자에게 “저는 세계 최고의 영업 사원입니다.”라고 말했다.","opts":["(A) confident / (B) largest","(A) confident / (B) smallest","(A) shy / (B) largest","(A) shy / (B) smallest","(A) angry / (B) smallest"],"oko":["(A) 자신감 있는 / (B) 가장 큰","(A) 자신감 있는 / (B) 가장 작은","(A) 수줍은 / (B) 가장 큰","(A) 수줍은 / (B) 가장 작은","(A) 화난 / (B) 가장 작은"],"r":{"a":"1) (A) confident / (B) largest ((A) 자신감 있는 / (B) 가장 큰)","ev":"1번 문장","s":[[1,"A confident new employee at the region’s largest department store told his manager at the beginning of his first shift, “I’m the world’s greatest salesperson.”","지역 최대의 백화점의 한 자신감 있는 신입 사원은 그의 첫 교대 근무를 시작할 때 관리자에게 말했다. “저는 세계 최고의 영업 사원입니다.”"]],"c":1,"k":null},"h":"1b81fc2a91"},{"n":10,"t":"fill","q":"“Well, first I sold the customer a fishing rod, [A] with some expensive fishing [B].","ko":"“음, 처음에 저는 고객에게 낚싯대 하나를 몇 가지 비싼 낚시 [B]와(과) [A] 팔았습니다.","bank":["along","gear","apart","against","headac f the sentence?\n\"If he could succeed despite his struggles, so can you!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그가 어려움에도 불구하고 성공할 수 있었다면, 당신도 할 수 있다!","opts":["그가 어려움 때문에 성공하지 못했다면, 당신도 할 수 없다!","그가 성공했으니, 당신은 어려움을 겪지 않을 것이다!","그는 어려움이 있었기 때문에 성공했고, 당신은 그럴 수 없다!","그가 힘든 일을 겪고도 성공할 수 있었다면, 당신도 마찬가지로 성공할 수 있다!"],"r":{"a":"4) 그가 힘든 일을 겪고도 성공할 수 있었다면, 당신도 마찬가지로 성공할 수 있다!","ev":"14번 문장","s":[[14,"If he could succeed despite his struggles, so can you!","그가 어려움에도 불구하고 성공할 수 있었다면, 당신도 할 수 있다!"]],"w":"despite his struggles는 ‘어려움에도 불구하고’이고, so can you는 ‘당신도 그렇다(성공할 수 있다)’예요. 어려움이 성공의 원인이라거나 당신은 할 수 없다는 말이 아니에요.","c":4},"h":"26c341842f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Lee returned to Korea to receive treatment for his injuries.","Lee changed the ramen to be spicier for Norwegians.","Lee became a chef at a popular hotel after receiving a cooking license.","Lee began importing ramen to Norway before he visited Korea."],"oko":["이 씨는 치료를 받으려고 한국으로 돌아갔다.","이 씨는 노르웨이인들을 위해 라면을 더 맵게 바꾸었다.","이 씨는 요리사 자격증을 받은 뒤 유명 호텔의 요리사가 되었다.","이 씨는 한국을 방문하기 전에 노르웨이로 라면을 수입하기 시작했다."],"r":{"a":"3) Lee became a chef at a popular hotel after receiving a cooking license. (이 씨는 요리사 자격증을 받은 뒤 유명 호텔의 요리사가 되었다.)","ev":"5번 문장","s":[[5,"After receiving a cooking license, he became a chef at a popular hotel.","요리사 자격증을 받은 뒤, 그는 유명 호텔의 요리사가 되었다."]],"c":3,"k":null},"h":"d52f8bb093"},{"n":9,"t":"sum","q":"As a child, Chul-Ho Lee was (A) injured during the Korean (B).","ko":"어렸을 때, 이철호는 한국 (B) 중에 (A) 부상을 당했다.","opts":["(A) badly / (B) War","(A) badly / (B) Festival","(A) happily / (B) War","(A) happily / (B) Festival","(A) slightly / (B) Festival"],"oko":["(A) 심하게 / (B) 전쟁","(A) 심하게 / (B) 축제","(A) 행복하게 / (B) 전쟁","(A) 행복하게 / (B) 축제","(A) 가볍게 / (B) 축제"],"r":{"a":"1) (A) badly / (B) War ((A) 심하게 / (B) 전쟁)","ev":"1번 문장","s":[[1,"As a child, Chul-Ho Lee was badly injured during the Korean War.","어렸을 때, 이철호는 한국 전쟁 중에 심하게 부상을 당했다."]],"c":1,"k":null},"h":"a9911cccb5"},{"n":10,"t":"fill","q":"So next time you feel [A], [B] the Ramen King of Norway.","ko":"그러니 다음에 당신이 [A] 때 노르웨이의 라면 왕을 [B]하라.","bank":["discouraged","remember","license","hotel","brand","flavor"],"bko":{"discouraged":"좌절한","remember":"기억하다","license":"자격증","hotel":"호텔","brand":"브랜드","flavor":"맛"},"r":{"a":"[A] discouraged (좌절한), [B] remember (기억하다)","ev":"13번 문장","s":[[13,"So next time you feel discouraged, remember the Ramen King of Norway.","그러니 다음에 당신이 좌절감을 느낄 때 노르웨이의 라면 왕을 기억하라."]],"c":null,"k":null},"h":"f888ce670c"}]},{"u":5,"id":"ch2-05-3","no":3,"ko":"당신의 간식이 작아지는 진짜 이유","items":[{"n":1,"t":"tf","q":"Inflation is mainly characterized by a decrease in the size of products.","ko":"인플레이션은 주로 제품 크기가 줄어드는 것을 특징으로 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"While most people are familiar with inflation, which is characterized by price increases, shrinkflation is its strategic variation.","대부분의 사람들은 가격 상승을 특징으로 하는 인플레이션에 익숙하지만, 슈링크플레이션은 그것의 전략적인 변형이다."]],"w":"5번 문장에 inflation, which is characterized by price increases(가격 상승을 특징으로 하는 인플레이션)라고 나와요. 크기가 줄어드는 것은 슈링크플레이션이에요.","c":"F"},"h":"a35d629286"},{"n":2,"t":"tf","q":"Manufacturers must clearly show the product’s weight or volume on the front of the packaging.","ko":"제조업체는 제품의 무게나 부피를 포장지 앞면에 명확하게 표시해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The only requirement for manufacturers is to clearly display the product’s weight or volume on the front of the packaging, though consumers can easily overlook this information while shopping.","제조업체에 대한 유일한 필요 조건은 제품의 무게나 부피를 포장지 앞면에 명확하게 표시하는 것이지만, 소비자들은 쇼핑하는 동안 이 정보를 쉽게 간과할 수 있다."]],"w":"11번 문장에서 제조업체에 대한 유일한 필요 조건은 제품의 무게나 부피를 포장지 앞면에 명확하게 표시하는 것이라고 해요.","c":"T"},"h":"ec3d071d1c"},{"n":3,"t":"tf","q":"The feeling that a snack has become smaller is just a trick of the consumer’s imagination.","ko":"간식이 작아졌다는 느낌은 소비자의 상상이 만든 속임수일 뿐이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"If so, you’re not alone, and it’s not your imagination playing tricks on you.","만약 그렇다면, 당신만 그런 게 아니며, 그것은 당신을 속이는 당신의 상상이 아니다."]],"w":"3번 문장에 it’s not your imagination playing tricks on you(그것은 당신을 속이는 당신의 상상이 아니다)라고 나와요. 상상이 아니라 실제 현상이에요.","c":"F"},"h":"323376fc02"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Shrinkflation is frequently viewed as a deceptive strategy…)","ko":"슈링크플레이션은 흔히 [  ] 전략으로 여겨진다… (밑줄 친 단어의 뜻은?)","opts":["정직한","기만적인","유익한","우연한"],"word":"deceptive","r":{"a":"2) 기만적인","ev":"7~8번 문장","s":[[7,"Shrinkflation is frequently viewed as a deceptive strategy because consumers are usually unaware of the reduced product size and are misled by the perceived price stability.","슈링크플레이션은 소비자들이 종종 감소된 제품의 크기를 인식하지 못하고, 인지된 가격 안정성에 의해 오해하게 되기 때문에 기만적인 전략으로서 자주 간주된다."],[8,"However, if consumers notice, they are likely to feel cheated.","그러나, 만약 소비자들이 이를 알아차리면, 그들은 속았다고 느낄 가능성이 크다."]],"w":"7번에서 소비자가 줄어든 크기를 모르고 가격 안정에 속는다고 했고, 8번에서 알아차리면 속았다고 느낀다고 했어요. 그래서 deceptive = 기만적인, 속이는.","c":2},"h":"6b4b6aa341"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Being mindful of product sizes can facilitate smarter decision-making…)","ko":"제품 크기에 주의를 기울이는 것이 더 똑똑한 결정을 [  ] 수 있다… (밑줄 친 단어의 뜻은?)","opts":["가능하게 하다","방해하다","설명하다","제한하다"],"word":"facilitate","r":{"a":"1) 가능하게 하다","ev":"13번 문장","s":[[13,"Being mindful of product sizes can facilitate smarter decision-making and prevent you from getting the short end of the stick.","제품 크기에 주의를 기울이는 것이 더 똑똑한 결정을 가능하게 하고, 당신이 손해를 보는 것을 막을 수 있다."]],"w":"크기에 주의를 기울이는 것은 더 똑똑한 결정에 도움이 되고 손해를 막아 줘요. 그래서 facilitate = 가능하게 하다, 쉽게 만들다.","c":1},"h":"5c391bd5f2"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHowever, if consumers notice, they are likely to feel cheated.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"그러나, 만약 소비자들이 이를 알아차리면, 그들은 속았다고 느낄 가능성이 크다.","opts":["기업들","소비자들","제조업체","슈링크플레이션"],"pron":"they","r":{"a":"2) 소비자들","ev":"8번 문장","s":[[8,"However, if consumers notice, they are likely to feel cheated.","그러나, 만약 소비자들이 이를 알아차리면, 그들은 속았다고 느낄 가능성이 크다."]],"c":2,"k":"they = 소비자들"},"h":"cb531bdcca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So next time you’re shopping, don’t just glance at the price—check the size and quantity as well.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 다음번에 당신이 쇼핑할 때는, 가격만 힐끗 보지 말고 크기와 양도 확인해라.","opts":["쇼핑할 때는 가격은 보지 말고 크기와 양만 확인해라.","쇼핑할 때는 가격을 빨리 확인하고 바로 사라.","쇼핑할 때는 가격만 힐끗 보지 말고 크기와 양도 확인해라.","쇼핑할 때는 크기와 양을 확인하는 대신 가격만 비교해라."],"r":{"a":"3) 쇼핑할 때는 가격만 힐끗 보지 말고 크기와 양도 확인해라.","ev":"12번 문장","s":[[12,"So next time you’re shopping, don’t just glance at the price—check the size and quantity as well.","그래서 다음번에 당신이 쇼핑할 때는, 가격만 힐끗 보지 말고 크기와 양도 확인해라."]],"w":"don’t just glance at the price는 ‘가격만 힐끗 보지 마라’, check the size and quantity as well은 ‘크기와 양도 확인해라’예요. as well은 ‘~도 또한’이라서 가격을 아예 보지 말라는 말이 아니에요.","c":3},"h":"1873ce5014"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["슈링크플레이션은 제품 크기는 그대로 두고 가격을 올린다.","슈링크플레이션을 엄격하게 금지하는 법이 있다.","소비자들은 보통 제품이 작아진 것을 바로 알아챈다.","기업들은 가격을 올리는 대신 제품의 크기나 양을 줄인다."],"opts":["Shrinkflation raises the price of a product while keeping its size the same.","There is a strict law that forbids shrinkflation.","Consumers usually notice right away that a product has become smaller.","Companies reduce the size or quantity of a product instead of raising its price."],"r":{"a":"4) Companies reduce the size or quantity of a product instead of raising its price.","ev":"6~7, 10번 문장","s":[[6,"Rather than raising prices, companies reduce the size or quantity of a product.","가격을 올리기 보단, 기업들은 제품의 크기나 양을 줄인다."],[7,"Shrinkflation is frequently viewed as a deceptive strategy because consumers are usually unaware of the reduced product size and are misled by the perceived price stability.","슈링크플레이션은 소비자들이 종종 감소된 제품의 크기를 인식하지 못하고, 인지된 가격 안정성에 의해 오해하게 되기 때문에 기만적인 전략으로서 자주 간주된다."],[10,"Currently, there are no specific laws prohibiting it.","현재로서, 이를 금지하는 특별한 법은 없다."]],"w":"6번에서 가격을 올리기보다 제품의 크기나 양을 줄인다고 해요. ①은 크기와 가격이 반대로 쓰였어요. ②는 10번에서 금지하는 특별한 법이 없다고 했어요. ③은 7번에서 소비자들이 보통 줄어든 크기를 모른다고 했어요.","c":4},"h":"4b9e28d68d"},{"n":9,"t":"sum","q":"At least once, you might have eaten a snack and (A), “Wasn’t this (B) before?”","ko":"적어도 한 번은, 당신이 간식을 먹으면서 ‘예전에 이게 (B) 않았나?’라고 (A) 지도 모른다.","opts":["(A) wondered / (B) bigger","(A) wondered / (B) louder","(A) shouted / (B) bigger","(A) shouted / (B) louder","(A) slept / (B) bigger"],"oko":["(A) 궁금해했을 / (B) 더 크지","(A) 궁금해했을 / (B) 더 시끄럽지","(A) 소리쳤을 / (B) 더 크지","(A) 소리쳤을 / (B) 더 시끄럽지","(A) 잤을 / (B) 더 크지"],"r":{"a":"1) (A) wondered / (B) bigger ((A) 궁금해했을 / (B) 더 크지)","ev":"1번 문장","s":[[1,"At least once, you might have eaten a snack and wondered, “Wasn’t this bigger before?”","적어도 한 번은, 당신이 간식을 먹으면서 ‘예전에 이게 더 크지 않았나?’라고 궁금해했을 지도 모른다."]],"c":1,"k":null},"h":"042ad4b08d"},{"n":10,"t":"fill","q":"Perhaps your bag of chips felt [A], or your favorite candy bar seemed smaller than you [B].","ko":"아마도 당신의 과자 봉지가 [A] 느껴지거나, 당신이 가장 좋아하는 사탕 바가 당신이 [B] 것보다 더 작아진 것처럼 보였을 것이다.","bank":["lighter","remember","bag","quantity","price","strategy"],"bko":{"lighter":"더 가벼운","remember":"기억하다","bag":"봉지","quantity":"양","price":"가격","strategy":"전략"},"r":{"a":"[A] lighter (더 가벼운), [B] remember (기억하다)","ev":"2번 문장","s":[[2,"Perhaps your bag of chips felt lighter, or your favorite candy bar seemed smaller than you remember.","아마도 당신의 과자 봉지가 더 가볍게 느껴지거나, 당신이 가장 좋아하는 사탕 바가 당신이 기억하는 것보다 더 작아진 것처럼 보였을 것이다."]],"c":null,"k":null},"h":"33c9f5c529"}]},{"u":5,"id":"ch2-05-4","no":4,"ko":"수능:ON 무관한 문장","items":[{"n":1,"t":"tf","q":"Shoppers who had fewer choices of jams were happier with the tasting.","ko":"더 적은 종류의 잼 중에서 고른 쇼핑객들이 시식에 더 행복했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Those who had fewer choices were happier with the tasting.","더 적은 선택 항목을 가진 사람들이 맛볼 때 더 행복했다."]],"w":"5번 문장에 Those who had fewer choices were happier with the tasting(더 적은 선택 항목을 가진 사람들이 맛볼 때 더 행복했다)이라고 나와요.","c":"T"},"h":"467f6fee9e"},{"n":2,"t":"tf","q":"According to the research, having many choices usually makes people more cheerful.","ko":"연구에 따르면, 많은 선택 항목을 가지는 것은 대개 사람들을 더 쾌활하게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"According to research by psychologists David Myers and Robert Lane, having too many choices often makes people depressed.","심리학자 데이비드 마이어스와 로버트 레인의 연구에 따르면, 너무 많은 선택 항목을 가지는 것은 자주 사람들을 우울하게 만든다."]],"w":"3번 문장에 having too many choices often makes people depressed(너무 많은 선택 항목은 자주 사람들을 우울하게 만든다)라고 나와요. 쾌활해지는 것이 아니라 우울해져요.","c":"F"},"h":"55ba9a4de8"},{"n":3,"t":"tf","q":"People nearly always say that they want more choices.","ko":"사람들은 거의 항상 더 많은 선택 항목을 원한다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The ironic thing about this is that people nearly always say they want more choices.","이에 관한 역설적인 점은 사람들이 거의 항상 더 많은 선택 항목을 원한다고 말한다는 것이다."]],"w":"7번 문장에 people nearly always say they want more choices라고 나와요. 말하는 것과 실제(8번)는 반대라서 역설이에요.","c":"T"},"h":"d9164342a7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, there may be a price to pay in terms of happiness.)","ko":"그러나 행복의 관점에서는 치러야 할 [  ]이(가) 있을지도 모른다. (밑줄 친 단어의 뜻은?)","opts":["가격","대가","상품","할인"],"word":"price","r":{"a":"2) 대가","ev":"2번 문장","s":[[2,"However, there may be a price to pay in terms of happiness.","그러나 행복의 관점에서는 치러야 할 대가가 있을지도 모른다."]],"w":"선택 항목이 많으면 자유가 늘지만, 행복의 관점에서는 치러야 할 것이 있다는 흐름이에요. 여기서 price는 물건의 ‘가격’이 아니라 ‘대가’예요.","c":2},"h":"bd91b0fb37"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This allows customers to feel more relaxed, prompting easier decisions…)","ko":"이것은 고객들이 더 편안함을 느끼게 하고, 더 쉬운 결정을 [  ]… (밑줄 친 단어의 뜻은?)","opts":["막으며","미루며","촉진하며","설명하며"],"word":"prompting","r":{"a":"3) 촉진하며","ev":"10번 문장","s":[[10,"This allows customers to feel more relaxed, prompting easier decisions and leaving them more satisfied with their choices.","이것은 고객들이 더 편안함을 느끼게 하고, 더 쉬운 결정을 촉구하고 그 선택에 더 만족하게 만든다."]],"w":"선택 항목이 적으면 고객이 편안해지고, 그 결과 결정이 더 쉬워져요. 그래서 prompt = 촉구하다, 촉진하다(결정을 이끌어 내다).","c":3},"h":"d3c5812982"},{"n":6,"t":"ref","q":"What does the underlined \"those\" refer to?\nEven more surprisingly, the ones with a smaller selection purchased jam 31% of the time, while those with a wider range of choices only purchased jam 3% of the time.","ko":"밑줄 친 those가 가리키는 것은?","sko":"훨씬 더 놀랍게도, 더 적은 선택 항목을 가진 사람들은 전체 경우의 31%에서 잼을 구매한 반면, 더 넓은 범위의 선택 항목을 가진 사람들은 전체 경우의 3%에서만 잼을 구매했다.","opts":["선택 항목이 많은 쇼핑객들","선택 항목이 적은 쇼핑객들","잼을 파는 가게 주인들","실험을 한 연구자들"],"r":{"a":"1) 선택 항목이 많은 쇼핑객들","ev":"6번 문장","s":[[6,"Even more surprisingly, the ones with a smaller selection purchased jam 31% of the time, while those with a wider range of choices only purchased jam 3% of the time.","훨씬 더 놀랍게도, 더 적은 선택 항목을 가진 사람들은 전체 경우의 31%에서 잼을 구매한 반면, 더 넓은 범위의 선택 항목을 가진 사람들은 전체 경우의 3%에서만 잼을 구매했다."]],"w":"those with a wider range of choices는 ‘더 넓은 범위의 선택 항목을 가진 사람들’이고, 앞의 the ones with a smaller selection과 대조되는 집단이에요. while 앞은 적은 쪽(31%), 뒤는 많은 쪽(3%)이에요.","c":1},"h":"4f10ca6147"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Yet, the more options they have, the more paralyzed they become.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 선택 항목이 더 많아질수록 그들은 더 무력해진다.","opts":["선택 항목이 많을수록 사람들은 더 자유로워진다.","선택 항목이 적을수록 사람들은 더 무력해진다.","사람들은 선택 항목이 있어도 무력해지지 않는다.","선택 항목이 많아질수록 사람들은 더 무력해진다."],"r":{"a":"4) 선택 항목이 많아질수록 사람들은 더 무력해진다.","ev":"8번 문장","s":[[8,"Yet, the more options they have, the more paralyzed they become.","그러나 선택 항목이 더 많아질수록 그들은 더 무력해진다."]],"w":"「the more ~, the more …」는 ‘~할수록 더 …하다’예요. 선택 항목(options)이 많아질수록 무력함(paralyzed)이 커진다는 뜻이고, 선택 항목이 적을 때나 자유로워지는 것과는 관계가 없어요.","c":4},"h":"25439e4607"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["심리학자들은 많은 선택 항목이 사람들을 더 차분하게 만든다고 밝혔다.","실험에서 모든 쇼핑객은 같은 수의 잼을 맛보았다.","연구자들은 24개의 잼을 맛본 쇼핑객들과 6개를 맛본 쇼핑객들을 비교했다.","고를 잼이 더 적은 쇼핑객들이 잼을 더 적게 샀다."],"opts":["Psychologists found that having more choices makes people calmer.","Every shopper in the experiment tasted the same number of jams.","The researchers compared shoppers who tasted 24 jams with those who tasted 6.","Shoppers with fewer jams to choose from bought less jam."],"r":{"a":"3) The researchers compared shoppers who tasted 24 jams with those who tasted 6.","ev":"3~4, 6번 문장","s":[[3,"According to research by psychologists David Myers and Robert Lane, having too many choices often makes people depressed.","심리학자 데이비드 마이어스와 로버트 레인의 연구에 따르면, 너무 많은 선택 항목을 가지는 것은 자주 사람들을 우울하게 만든다."],[4,"Researchers gave some shoppers 24 choices of jams to taste and others only 6 choices.","연구자들이 어떤 쇼핑객들에게는 24개의 잼을 맛보게 했고, 다른 사람들에게는 오직 6개만 맛보게 했다."],[6,"Even more surprisingly, the ones with a smaller selection purchased jam 31% of the time, while those with a wider range of choices only purchased jam 3% of the time.","훨씬 더 놀랍게도, 더 적은 선택 항목을 가진 사람들은 전체 경우의 31%에서 잼을 구매한 반면, 더 넓은 범위의 선택 항목을 가진 사람들은 전체 경우의 3%에서만 잼을 구매했다."]],"w":"4번에서 어떤 쇼핑객에게는 잼 24개, 다른 쇼핑객에게는 6개를 맛보게 했어요. ①은 3번에서 많은 선택 항목은 사람들을 우울하게 만든다고 했어요. ②는 4번의 24개와 6개가 서로 달랐어요. ④는 6번에서 선택 항목이 적은 쪽이 31%, 많은 쪽이 3%가 샀으므로 반대예요.","c":3},"h":"00cf69102a"},{"n":9,"t":"sum","q":"This allows customers to feel more relaxed, prompting easier decisions and (A) them more (B) with their choices.","ko":"이것은 고객들이 더 편안함을 느끼게 하고, 더 쉬운 결정을 촉구하며, 그들을 자신의 선택에 더 (B) 상태로 (A).","opts":["(A) leaving / (B) satisfied","(A) leaving / (B) worried","(A) leaving / (B) angry","(A) keeping / (B) worried","(A) keeping / (B) angry"],"oko":["(A) 둔다 / (B) 만족한","(A) 둔다 / (B) 걱정하는","(A) 둔다 / (B) 화난","(A) 유지시킨다 / (B) 걱정하는","(A) 유지시킨다 / (B) 화난"],"r":{"a":"1) (A) leaving / (B) satisfied ((A) 둔다 / (B) 만족한)","ev":"10번 문장","s":[[10,"This allows customers to feel more relaxed, prompting easier decisions and leaving them more satisfied with their choices.","이것은 고객들이 더 편안함을 느끼게 하고, 더 쉬운 결정을 촉구하고 그 선택에 더 만족하게 만든다."]],"c":1,"k":null},"h":"30fa6fd6f3"},{"n":10,"t":"fill","q":"The overabundance of options in today’s [A] gives you more [B] of choice.","ko":"오늘날 [A]에서 선택 항목의 과잉은 당신에게 더 많은 선택의 [B]을(를) 준다.","bank":["marketplace","freedom","jam","tasting","psychologist","customer"],"bko":{"marketplace":"시장","freedom":"자유","jam":"잼","tasting":"시식","psychologist":"심리학자","customer":"고객"},"r":{"a":"[A] marketplace (시장), [B] freedom (자유)","ev":"1번 문장","s":[[1,"The overabundance of options in today’s marketplace gives you more freedom of choice.","오늘날 시장에서 선택 항목의 과잉은 당신에게 더 많은 선택의 자유를 준다."]],"c":null,"k":null},"h":"eaa48faa03"}]},{"u":6,"id":"ch2-06-1","no":1,"ko":"손이 모자라? 해결 완료!","items":[{"n":1,"t":"tf","q":"Sensors on the wearer’s big toes tell the Thumb to move when they are pressed.","ko":"착용자의 엄지발가락에 있는 센서는 눌리면 Thumb에게 움직이라고 알려 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Wireless sensors on each wearer’s big toes signal the Thumb to move when pressed down.","착용자의 각 엄지 발가락에 장착되는 무선 센서들이 눌리면 Thumb에게 움직이라고 신호를 보낸다."]],"w":"6번 문장에서 센서가 눌리면(when pressed down) Thumb에게 움직이라고 신호를 보낸다고 해요.","c":"T"},"h":"69d0ec469c"},{"n":2,"t":"tf","q":"The left toe moves the Thumb across the palm.","ko":"왼발 엄지발가락은 Thumb을 손바닥을 가로질러 움직이게 한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The right toe moves the Thumb across the palm, while the left toe moves it toward the fingers.","오른발 엄지발가락은 Thumb이 손바닥을 가로질러 움직이게 하고, 왼발 엄지발가락은 Thumb을 손가락 쪽으로 움직이게 한다."]],"w":"7번 문장에서 손바닥을 가로질러 움직이게 하는 것은 오른발(right toe)이에요. 왼발은 손가락 쪽으로 움직이게 해요.","c":"F"},"h":"d535938b4f"},{"n":3,"t":"tf","q":"Medical workers such as surgeons could find the Third Thumb helpful because they can handle more devices.","ko":"외과 의사 같은 의료 종사자들은 더 많은 장치를 다룰 수 있기 때문에 Third Thumb을 도움이 된다고 생각할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Surgeons and dental hygienists, for example, would also find it useful because they could handle more devices in their hands.","외과 의사들과 치과 위생사들은, 예를 들어서, 그들의 손 안에서 더 많은 장치를 다룰 수 있기 때문에 그것을 유용하다고 생각할 것이다."]],"w":"11번 문장에서 외과 의사와 치과 위생사도 더 많은 장치를 다룰 수 있어서 유용하다고 생각할 거라고 해요.","c":"T"},"h":"3dfc57bac0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The Third Thumb is worn on the side of the palm next to the pinky and resembles a sixth finger.)","ko":"Third Thumb은 새끼손가락 옆 손바닥 측면에 착용되고 여섯 번째 손가락과 비슷하다.","opts":["대신했다","가렸다","닮았다","앞섰다"],"word":"resembles","r":{"a":"3) 닮았다","ev":"5번 문장","s":[[5,"The Third Thumb is worn on the side of the palm next to the pinky and resembles a sixth finger.","Third Thumb은 새끼손가락 옆에 있는 손바닥 측면에 착용되고 여섯 번째 손가락과 비슷하다."]],"w":"여섯 번째 손가락 '같은' 모양이라는 말이에요. resemble = 닮다.","c":3},"h":"1f0a6b8e2d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The Third Thumb can help people regain their motor skills.)","ko":"Third Thumb은 사람들이 운동 기능을 되찾도록 도울 수 있다.","opts":["되찾다","잃다","바꾸다","숨기다"],"word":"regain","r":{"a":"1) 되찾다","ev":"12번 문장","s":[[12,"The Third Thumb can help people regain their motor skills and more efficiently complete everyday tasks.","Third Thumb은 사람들이 운동 기능을 되찾고 일상적인 업무를 더 효율적으로 수행할 수 있도록 도울 수 있다."]],"w":"기능이 떨어진 사람들(10번)이 운동 기능을 다시 갖게 돕는다는 뜻이라 regain = 되찾다예요.","c":1},"h":"ea9f504362"},{"n":6,"t":"ref","q":"What does the underlined \"These\" refer to?\nThese include people with disabilities, such as paralysis, and reduced functioning caused by injuries and conditions.","ko":"밑줄 친 These가 가리키는 것은?","sko":"이는 마비와 같은 장애와 부상과 질환에 의해 발생한 기능 저하가 있는 사람들을 포함한다.","opts":["Third Thumb을 만든 연구원들","추가적인 도움이 필요한 사람들","엄지발가락에 붙은 센서들","손으로 다룰 수 있는 장치들"],"r":{"a":"2) 추가적인 도움이 필요한 사람들","ev":"9~10번 문장","s":[[9,"British product designer, Dani Clode and researchers at Cambridge University created the Third Thumb hoping to provide a tool for people who need extra assistance.","영국의 제품 디자이너인, 다니 클로드와 케임브리지 대학의 연구원들은 추가적인 도움이 필요한 사람들에게 도구를 제공하기를 희망하면서 Third Thumb을 만들었다."],[10,"These include people with disabilities, such as paralysis, and reduced functioning caused by injuries and conditions.","이는 마비와 같은 장애와 부상과 질환에 의해 발생한 기능 저하가 있는 사람들을 포함한다."]],"w":"9번 끝의 people who need extra assistance(추가적인 도움이 필요한 사람들)에 장애와 기능 저하가 있는 사람들이 포함된다고 이어져요.","c":2},"h":"7e1f9b2fed"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This incredible tool pushes the boundaries between technology and the human body.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 놀라운 도구는 기술과 인간의 신체 사이의 경계를 허물어뜨린다.","opts":["이 도구는 기술이 인간의 신체와 완전히 분리되어 있음을 보여 준다.","이 도구는 기술이 인간의 신체를 대신할 수 없다는 것을 증명한다.","이 도구는 인간의 신체가 기술에서 비롯되었음을 설명한다.","이 도구 덕분에 기술과 인간의 신체를 가르던 경계가 허물어지고 있다."],"r":{"a":"4) 이 도구 덕분에 기술과 인간의 신체를 가르던 경계가 허물어지고 있다.","ev":"13번 문장","s":[[13,"This incredible tool pushes the boundaries between technology and the human body.","이 놀라운 도구는 기술과 인간의 신체 사이의 경계를 허물어뜨린다."]],"w":"push the boundaries는 경계를 넘어서 넓힌다는 뜻이에요. 기술과 신체를 가르던 선이 흐려진다는 4번이 맞아요.","c":4},"h":"ac32367a0f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Thumb의 힘은 발가락 움직임의 속도가 결정한다.","Third Thumb은 손등에 착용된다.","발가락이 가하는 압력의 양이 Thumb의 힘을 결정한다.","Third Thumb은 발가락 위에 착용된다."],"opts":["The speed of the toes’ movement decides the Thumb’s strength.","The Third Thumb is worn on the back of the hand.","The amount of pressure from the toes decides how strong the Thumb is.","The Third Thumb is worn on the user’s big toe."],"r":{"a":"3) The amount of pressure from the toes decides how strong the Thumb is.","ev":"5번, 8번 문장","s":[[5,"The Third Thumb is worn on the side of the palm next to the pinky and resembles a sixth finger.","Third Thumb은 새끼손가락 옆에 있는 손바닥 측면에 착용되고 여섯 번째 손가락과 비슷하다."],[8,"The amount of pressure applied by the toes determines the Thumb’s strength, and the speed of their movement controls its quickness.","발가락이 가하는 압력의 양은 Thumb의 힘을 결정하고, 그들의(발가락의) 움직임의 속도는 그것의(Thumb의) 빠르기를 조절한다."]],"w":"8번에서 힘(strength)은 압력의 양이 정하고, 속도는 빠르기(quickness)를 조절해요. 5번에서 Thumb은 손바닥 측면에 착용되고, 발가락에는 센서가 있어요.","c":3},"h":"b580446476"},{"n":9,"t":"sum","q":"The Third Thumb was developed to (A) the function of the hand, and it helps people (B) everyday tasks more efficiently.","ko":"Third Thumb은 손의 기능을 (A) 위해 개발되었고, 사람들이 일상적인 업무를 더 효율적으로 (B) 도와준다.","oko":["(A) 줄이다 / (B) 완수하다","(A) 신장시키다 / (B) 잊다","(A) 숨기다 / (B) 피하다","(A) 신장시키다 / (B) 완수하다","(A) 줄이다 / (B) 피하다"],"opts":["(A) reduce / (B) complete","(A) boost / (B) forget","(A) hide / (B) avoid","(A) boost / (B) complete","(A) reduce / (B) avoid"],"r":{"a":"4) (A) boost / (B) complete (신장시키다 / 완수하다)","ev":"4번, 12번 문장","s":[[4,"This robotic thumb was developed to boost the function of the hand.","이 로봇 엄지손가락은 손의 기능을 신장시키기 위해 개발되었다."],[12,"The Third Thumb can help people regain their motor skills and more efficiently complete everyday tasks.","Third Thumb은 사람들이 운동 기능을 되찾고 일상적인 업무를 더 효율적으로 수행할 수 있도록 도울 수 있다."]],"w":"4번에서 이 로봇 엄지손가락은 손의 기능을 신장시키기(boost) 위해 개발되었고, 12번에서 사람들이 일상적인 업무를 더 효율적으로 수행하도록(complete) 도울 수 있다고 해요.","c":4},"h":"6aa2fb4a4e"},{"n":10,"t":"fill","q":"While we can’t grow new body parts, [A] at the University of Cambridge have developed an innovative [B]: the Third Thumb.","ko":"우리가 새로운 신체 부위를 자라게 할 수는 없지만, 케임브리지 대학의 [A]은(는) Third Thumb이라는 획기적인 [B]을(를) 개발했다.","bank":["researchers","solution","pressure","strength","palm","quickness"],"bko":{"researchers":"연구원들","solution":"해결책","pressure":"압력","strength":"힘","palm":"손바닥","quickness":"빠르기"},"r":{"a":"[A] researchers (연구원들), [B] solution (해결책)","ev":"3번 문장","s":[[3,"While we can’t grow new body parts, researchers at the University of Cambridge have developed an innovative solution: the Third Thumb.","우리가 새로운 신체 부위를 자라게 할 수는 없지만, 케임브리지 대학의 연구원들은 획기적인 해결책인 Third Thumb을 개발했다."]],"w":"3번에서 새로운 신체 부위를 자라게 할 수는 없지만, 케임브리지 대학의 연구원들(researchers)이 획기적인 해결책(solution)인 Third Thumb을 개발했다고 해요. pressure, strength, palm, quickness는 작동 방식 설명(5~8번)에 나오는 말이에요.","c":null},"h":"648c265c33"}]},{"u":6,"id":"ch2-06-2","no":2,"ko":"수술실에 울려 퍼진 음악 소리","items":[{"n":1,"t":"tf","q":"Dan Fabbio had a tumor in the part of the brain related to music.","ko":"댄 파비오는 음악과 관련된 뇌 부위에 종양이 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Fabbio had a tumor located in the part of the brain involved in making and listening to music.","파비오는 음악을 만들고 듣는 것과 관련된 뇌 부위에 위치하는 종양이 있었다."]],"w":"4번 문장에서 종양이 음악을 만들고 듣는 것과 관련된 뇌 부위에 위치해 있다고 해요.","c":"T"},"h":"12eac55d0f"},{"n":2,"t":"tf","q":"The doctors made a three-dimensional map of Fabbio’s brain in a single day.","ko":"의사들은 파비오의 뇌에 대한 3차원 지도를 하루 만에 만들었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Doctors hoped to remove it without affecting Fabbio’s musical abilities, so they spent months making a three-dimensional map of his brain.","의사들은 파비오의 음악적 능력에 영향을 미치지 않고 그 종양을 제거하기를 바랐고, 그래서 그들은 그의 뇌에 대한 3차원 지도를 만드는 데 수개월을 보냈다."]],"w":"5번 문장에서 의사들은 지도를 만드는 데 수개월(months)을 보냈어요. 하루 만이 아니에요.","c":"F"},"h":"7dc8a019ed"},{"n":3,"t":"tf","q":"While Fabbio hummed during the surgery, the doctors learned which areas of the brain to avoid.","ko":"파비오가 수술 중에 콧노래를 부르는 동안, 의사들은 뇌의 어느 영역을 피할지 알게 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"This activity showed the doctors exactly which areas of the brain to avoid.","이 활동은 의사들에게 정확히 뇌의 어느 영역을 피할지 보여주었다."]],"w":"9번 문장에서 This activity(수술 중 콧노래를 부르게 한 활동)가 의사들에게 피해야 할 뇌 영역을 정확히 보여 주었다고 해요.","c":"T"},"h":"820ac6f785"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (While a team of doctors operates on his brain, a patient hums songs and plays the saxophone.)","ko":"의료진이 그의 뇌를 수술하는 동안, 한 환자는 노래를 hum하고 색소폰을 연주한다.","opts":["큰 소리로 외친다","노래를 만든다","콧노래를 부른다","귀로만 듣는다"],"word":"hums","r":{"a":"3) 콧노래를 부른다","ev":"1번 문장","s":[[1,"While a team of doctors operates on his brain, a patient hums songs and plays the saxophone.","의료진이 한 환자의 뇌를 수술하는 동안, 그 환자는 콧노래를 부르고 색소폰을 연주한다."]],"w":"수술 중인 환자가 입으로 노래를 흥얼거리는 장면이에요(6번에서도 hummed them). hum = 콧노래를 부르다.","c":3},"h":"e55c726705"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Although the map was useful, the cautious doctors decided to keep Fabbio awake during the surgery.)","ko":"비록 지도는 유용했지만, 신중한 의사들은 수술 동안 파비오를 깨어 있게 하기로 결정했다.","opts":["신중한","서두르는","겁이 없는","지친"],"word":"cautious","r":{"a":"1) 신중한","ev":"8번 문장","s":[[8,"Although the map was useful, the cautious doctors decided to keep Fabbio awake during the surgery, asking him to hum songs occasionally.","비록 이 지도는 유용했지만, 신중한 의사들은 파비오가 수술 동안 깨어 있게 하기로 결정했고, 가끔 그에게 콧노래를 불러달라고 요청했다."]],"w":"지도가 있어도 한 번 더 확인하려고 환자를 깨워 두는 의사들이므로 '신중한(조심스러운)'이 알맞아요.","c":1},"h":"e7a93f22cd"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThey brought his saxophone into the operating room and had him play a song on it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그들은 그의 색소폰을 수술실에 가져와 그가 그것으로 노래를 연주하게 했다.","opts":["수술실","종양","노래","색소폰"],"r":{"a":"4) 색소폰","ev":"11번 문장","s":[[11,"They brought his saxophone into the operating room and had him play a song on it.","그들은 그의 색소폰을 수술실에 가져와 그가 그 색소폰으로 노래를 연주하게 했다."]],"w":"play a song on it은 '그것으로 노래를 연주하다'예요. 연주할 수 있는 것은 앞의 his saxophone이에요.","c":4,"k":"it = 색소폰"},"pron":"it","h":"38beccebd4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This helped the doctors locate the parts of his brain related to music.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 의사들이 음악과 관련된 뇌 영역을 찾도록 도와주었다.","opts":["이 일 때문에 의사들은 음악과 관련된 뇌 영역을 건드리게 되었다.","이 일은 의사들이 음악과 관련된 뇌 영역의 위치를 찾는 데 도움이 되었다.","의사들은 이 일을 이용해 음악과 관련 없는 뇌 영역을 제거했다.","이 일은 의사들이 파비오의 노래 실력을 평가하는 데 도움이 되었다."],"r":{"a":"2) 이 일은 의사들이 음악과 관련된 뇌 영역의 위치를 찾는 데 도움이 되었다.","ev":"7번 문장","s":[[7,"This helped the doctors locate the parts of his brain related to music.","이것은 의사들이 음악과 관련된 뇌 영역을 찾도록 도와주었다."]],"w":"help + 목적어 + 동사원형 구조라 '의사들이 영역을 찾는 것을 도왔다'는 뜻이에요. 건드리거나 제거했다는 말은 없어요.","c":2},"h":"9c17803dd4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파비오는 수술 내내 잠들어 있었다.","파비오는 의사들이 MRI 스캔을 하는 동안 노래를 듣고 흥얼거렸다.","의사들은 수술을 시작할 때 파비오에게 테스트를 했다.","의사들은 수술이 끝난 뒤에 뇌 지도를 만들었다."],"opts":["Fabbio was asleep during the whole surgery.","Fabbio listened to songs and hummed them while the doctors performed MRI scans.","The doctors gave Fabbio a test at the beginning of the operation.","The doctors made the map of the brain after the surgery was over."],"r":{"a":"2) Fabbio listened to songs and hummed them while the doctors performed MRI scans.","ev":"6번 문장","s":[[6,"While the doctors performed MRI scans on his brain, Fabbio listened to songs and hummed them.","파비오는 의사들이 그의 뇌에 MRI 스캔을 하는 동안 노래를 듣고 나서 흥얼거렸다."]],"w":"6번 문장에서 의사들이 MRI 스캔을 하는 동안 파비오는 노래를 듣고 흥얼거렸어요. 수술 중에는 깨어 있었고(8번), 테스트는 수술이 끝날 무렵(10번)이며, 지도는 수술 전에 만들었어요(5번).","c":2},"h":"22fa9b2a8b"},{"n":9,"t":"sum","q":"The doctors and nurses (A) Fabbio’s performance because he played the song (B).","ko":"의사들과 간호사들은 파비오가 노래를 (B) 연주했기 때문에 그의 연주에 (A).","oko":["(A) 무시했다 / (B) 완벽하게","(A) 박수를 쳤다 / (B) 형편없이","(A) 비판했다 / (B) 부주의하게","(A) 무시했다 / (B) 형편없이","(A) 박수를 쳤다 / (B) 완벽하게"],"opts":["(A) ignored / (B) perfectly","(A) applauded / (B) badly","(A) criticized / (B) carelessly","(A) ignored / (B) badly","(A) applauded / (B) perfectly"],"r":{"a":"5) (A) applauded / (B) perfectly (박수를 쳤다 / 완벽하게)","ev":"12번 문장","s":[[12,"He played the song perfectly, and the doctors and nurses happily applauded his performance.","그는 그 노래를 완벽히 연주했고, 의사들과 간호사들은 그의 연주에 행복하게 박수를 쳤다."]],"w":"12번에서 파비오가 노래를 완벽하게(perfectly) 연주했고, 의사들과 간호사들이 그의 연주에 박수를 쳤다(applauded)고 해요.","c":5},"h":"9efbeb27a6"},{"n":10,"t":"fill","q":"In the [A], the surgery was a great [B].","ko":"[A]에는 수술이 대단한 [B]이(가) 되었다.","bank":["end","success","talent","map","saxophone","tumor"],"bko":{"end":"끝","success":"성공","talent":"재능","map":"지도","saxophone":"색소폰","tumor":"종양"},"r":{"a":"[A] end (끝), [B] success (성공)","ev":"13번 문장","s":[[13,"In the end, the surgery was a great success.","결국, 수술은 대성공이었다."]],"w":"13번에서 결국(In the end) 수술은 대성공(a great success)이었다고 해요. talent, map, saxophone, tumor는 앞부분에 나오는 다른 말이에요.","c":null},"h":"d44f9224fa"}]},{"u":6,"id":"ch2-06-3","no":3,"ko":"제로 칼로리의 함정","items":[{"n":1,"t":"tf","q":"Zero-calorie drinks keep the same sweet taste as sugary drinks but have far fewer calories.","ko":"제로 칼로리 음료는 설탕 음료와 같은 단맛을 유지하면서 칼로리는 훨씬 적다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"These diet-friendly beverages maintain the same sweet taste as their sugary counterparts but contain considerably fewer calories.","이러한 다이어트 친화적인 음료는 설탕이 들어간 음료와 같은 달콤한 맛을 유지하면서 상당히 적은 칼로리를 포함한다."]],"w":"2번 문장에서 설탕이 들어간 음료와 같은 달콤한 맛을 유지하지만 상당히 적은 칼로리를 포함한다고 해요.","c":"T"},"h":"c7a1397c59"},{"n":2,"t":"tf","q":"Artificial sweeteners lower people’s appetite and lead them to eat less.","ko":"인공 감미료는 사람들의 식욕을 낮추고 덜 먹게 이끈다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Studies have shown that such sweeteners stimulate appetite and lead to higher consumption of foods containing an excessive amount of fat and calories.","연구는 이러한 감미료가 식욕을 자극하고 과도한 양의 지방과 칼로리를 포함하는 음식의 더 많은 섭취를 이끈다는 것을 보여줬다."]],"w":"6번 문장에서 감미료는 식욕을 자극하고(stimulate) 지방과 칼로리가 많은 음식의 섭취를 늘린다고 해요.","c":"F"},"h":"5edc004ecd"},{"n":3,"t":"tf","q":"Diabetes is a disease in which the body cannot control the sugar in the blood properly.","ko":"당뇨병은 신체가 혈액 속의 당을 제대로 조절하지 못하는 질병이다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Over time, cravings for sweet and fatty foods can contribute to weight gain and conditions like diabetes, a disease where the body cannot regulate the sugar in the blood properly.","시간이 지나면, 달고 지방이 많은 음식에 대한 갈망이 체중 증가와 당뇨병과 같은 질환의 원인이 될 수 있는데, 이는 신체가 혈액 내 당을 제대로 조절할 수 없는 질병이다."]],"w":"9번 문장의 a disease where the body cannot regulate the sugar in the blood properly와 같은 뜻이에요.","c":"T"},"h":"add2e3d2e1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The food industry promotes zero-calorie drinks as a healthier alternative to traditional soda.)","ko":"식품 산업은 제로 칼로리 음료를 전통적인 탄산음료에 대한 더 건강한 대안으로서 promote한다.","opts":["금지하다","홍보하다","비교하다","줄이다"],"word":"promotes","r":{"a":"2) 홍보하다","ev":"4번 문장","s":[[4,"The food industry promotes zero-calorie drinks as a healthier alternative to traditional soda, but in reality, they can negatively impact normal bodily functions.","식품 산업은 제로 칼로리 음료를 전통적인 탄산음료에 대한 더 건강한 대안으로서 홍보하지만, 실제로 그들은 정상적인 신체 기능에 부정적으로 영향을 미칠 수 있다."]],"w":"식품 산업이 제로 칼로리 음료를 '더 건강한 대안'이라고 알린다는 흐름이라 promote = 홍보하다예요. 뒤의 but in reality로 실제와 달랐음이 이어져요.","c":2},"h":"6014b16832"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These sweeteners also disrupt the release of satiety hormones.)","ko":"이 감미료는 또한 포만감 호르몬의 분비를 disrupt한다.","opts":["돕다","늘리다","만들다","방해하다"],"word":"disrupt","r":{"a":"4) 방해하다","ev":"7번 문장","s":[[7,"These sweeteners also disrupt the release of satiety hormones, which regulate hunger by signaling the brain to stop eating.","이 감미료는 또한 포만감 호르몬의 분비를 방해하는데, 이 호르몬은 뇌에게 먹는 것을 멈추라는 신호를 보냄으로써 배고픔을 조절한다."]],"w":"호르몬이 제대로 나와야 '그만 먹어' 신호가 가는데, 분비가 방해되면 계속 먹게 되므로 disrupt = 방해하다예요.","c":4},"h":"bd902c411c"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThe sweetness in these drinks comes from artificial sweeteners like aspartame, which is around 200 times sweeter than regular white sugar.","ko":"밑줄 친 which가 가리키는 것은?","sko":"이러한 음료 속의 단맛은 아스파탐과 같은 인공 감미료로부터 나오며, 이는 일반적인 흰 설탕보다 약 200배 더 달콤하다.","opts":["흰 설탕","음료 속의 단맛","아스파탐","슈퍼마켓"],"r":{"a":"3) 아스파탐","ev":"5번 문장","s":[[5,"The sweetness in these drinks comes from artificial sweeteners like aspartame, which is around 200 times sweeter than regular white sugar.","이러한 음료 속의 단맛은 아스파탐과 같은 인공 감미료로부터 나오며, 이는 일반적인 흰 설탕보다 약 200배 더 달콤하다."]],"w":"which is가 단수이고 바로 앞의 aspartame을 덧붙여 설명하는 계속적 용법이에요. 200배 달다고 비교된 것도 흰 설탕이 아니라 아스파탐이에요.","c":3},"h":"329675df0f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, if you regularly consume zero-calorie drinks, understand that they carry risks just like traditional sodas.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서, 제로 칼로리 음료를 자주 섭취한다면, 그들이 전통적인 탄산음료처럼 위험을 내포하고 있다는 것을 이해해라.","opts":["제로 칼로리 음료를 자주 마신다면 그것도 탄산음료처럼 위험이 있다는 것을 알아야 한다.","제로 칼로리 음료를 마시면 전통적인 탄산음료의 위험을 피할 수 있다.","제로 칼로리 음료는 탄산음료와 달리 마셔도 위험이 전혀 없다.","탄산음료를 자주 마신다면 제로 칼로리 음료로 바꾸는 것이 안전하다."],"r":{"a":"1) 제로 칼로리 음료를 자주 마신다면 그것도 탄산음료처럼 위험이 있다는 것을 알아야 한다.","ev":"10번 문장","s":[[10,"So, if you regularly consume zero-calorie drinks, understand that they carry risks just like traditional sodas.","따라서, 제로 칼로리 음료를 자주 섭취한다면, 그들이 전통적인 탄산음료처럼 위험을 내포하고 있다는 것을 이해해라."]],"w":"just like traditional sodas는 '전통적인 탄산음료처럼'이에요. 제로 칼로리 음료도 탄산음료와 같은 위험을 지닌다는 뜻이라 나머지는 반대예요.","c":1},"h":"b225babb39"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["제로 칼로리 음료는 설탕 음료보다 단맛이 약하다.","인공 감미료는 사람들이 배부르게 느껴 덜 먹게 한다.","제로 칼로리 음료를 마신 사람들은 음식을 더 먹어야 한다고 느낄 수 있다.","제로 칼로리 음료는 당뇨병을 막아 준다."],"opts":["Zero-calorie drinks taste less sweet than sugary drinks.","Artificial sweeteners make people feel full and eat less.","People who drink zero-calorie drinks may feel they need to eat more.","Zero-calorie drinks protect people from diabetes."],"r":{"a":"3) People who drink zero-calorie drinks may feel they need to eat more.","ev":"8번 문장","s":[[8,"Consequently, people who consume drinks that contain artificial sweeteners feel compelled to increase their food intake to alleviate their appetite.","결과적으로, 인공 감미료를 포함한 음료를 섭취하는 사람들은 그들의 식욕을 완화시키기 위해 그들의 음식 섭취를 늘려야 한다고 느낀다."]],"w":"8번 문장에서 인공 감미료를 포함한 음료를 마신 사람들은 식욕을 달래려고 음식 섭취를 늘려야 한다고 느껴요. 단맛은 같고(2번), 포만감 호르몬은 방해되며(7번), 당뇨병의 원인이 될 수 있어요(9번).","c":3},"h":"94f7265922"},{"n":9,"t":"sum","q":"Zero-calorie drinks seem (A) for weight loss, but they can (B) normal bodily functions.","ko":"제로 칼로리 음료는 체중 감소에 (A) 것처럼 보이지만, 정상적인 신체 기능에 (B) 수 있다.","oko":["(A) 해로운 / (B) 돕다","(A) 유익한 / (B) 개선하다","(A) 해로운 / (B) 해를 끼치다","(A) 쓸모없는 / (B) 지원하다","(A) 유익한 / (B) 해를 끼치다"],"opts":["(A) harmful / (B) help","(A) beneficial / (B) improve","(A) unhealthy / (B) harm","(A) useless / (B) support","(A) beneficial / (B) harm"],"r":{"a":"5) (A) beneficial / (B) harm (유익한 / 해를 끼치다)","ev":"3번, 4번 문장","s":[[3,"Although they seem beneficial for weight loss, did you know that they may have the opposite effect?","비록 그들은 체중 감소에 유익해 보일지라도, 반대의 효과를 가질 수 있다는 것을 알고 있었는가?"],[4,"The food industry promotes zero-calorie drinks as a healthier alternative to traditional soda, but in reality, they can negatively impact normal bodily functions.","식품 산업은 제로 칼로리 음료를 전통적인 탄산음료에 대한 더 건강한 대안으로서 홍보하지만, 실제로 그들은 정상적인 신체 기능에 부정적으로 영향을 미칠 수 있다."]],"w":"3번에서 체중 감소에 유익해 보인다고(seem beneficial) 했고, 4번에서 실제로는 정상적인 신체 기능에 부정적으로 영향을 미칠 수 있다고 해요.","c":5},"h":"aacd4c6e4f"},{"n":10,"t":"fill","q":"These days, it’s [A] to see zero-calorie drinks [B] in supermarkets.","ko":"최근에는 제로 칼로리 음료가 슈퍼마켓에서 [B] 모습을 보는 일이 [A] 일이다.","bank":["common","advertised","calories","appetite","risks","hormones"],"bko":{"common":"흔한","advertised":"광고된(advertise의 과거분사)","calories":"칼로리","appetite":"식욕","risks":"위험","hormones":"호르몬"},"r":{"a":"[A] common (흔한), [B] advertised (광고된)","ev":"1번 문장","s":[[1,"These days, it’s common to see zero-calorie drinks advertised in supermarkets.","최근에, 슈퍼마켓에서 제로 칼로리 음료가 광고되는 것을 보는 것은 흔하다."]],"w":"1번에서 요즘 슈퍼마켓에서 제로 칼로리 음료가 광고되는 것을 보는 일은 흔하다(common)고 해요. calories, appetite, risks, hormones는 뒤에 나오는 다른 말이에요.","c":null},"h":"7813ed6227"}]},{"u":6,"id":"ch2-06-4","no":4,"ko":"수능:ON 글의 순서","items":[{"n":1,"t":"tf","q":"Jack began by contacting 200 medical professionals to ask for help.","ko":"잭은 도움을 요청하려고 200명의 전문 의료진에게 연락하는 것으로 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"He started by contacting 200 medical professionals to seek assistance.","그는 도움을 요청하기 위해 200명의 전문 의료진에게 연락함으로써 시작했다."]],"w":"6번 문장에서 잭은 도움을 구하기 위해 200명의 전문 의료진에게 연락하는 것으로 시작했다고 해요.","c":"T"},"h":"c553444d51"},{"n":2,"t":"tf","q":"Jack examined 8,000 proteins in a laboratory at his own home.","ko":"잭은 자기 집에 있는 연구실에서 8천 개의 단백질을 조사했다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Using the doctor’s lab, Jack carefully examined 8,000 proteins found in human blood.","그 의사의 연구실을 사용해서 잭은 사람의 혈액에서 발견되는 8천 개의 단백질을 주의 깊게 조사하였다."]],"w":"9번 문장에서 잭이 사용한 것은 자기 집이 아니라 멘토가 된 의사의 연구실(the doctor’s lab)이에요.","c":"F"},"h":"907e794596"},{"n":3,"t":"tf","q":"Jack’s new test costs only three cents and takes five minutes.","ko":"잭의 새 검사는 비용이 단 3센트이고 5분이 걸린다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Jack used this protein to create a new test for diagnosing pancreatic cancer that costs just three cents, takes five minutes, and is nearly 100% accurate.","잭은 췌장암을 진단하기 위한 단 3센트의 비용이 들고, 5분이 걸리며, 거의 100% 정확한 새로운 검사를 만들기 위해 이 단백질을 이용했다."]],"w":"11번 문장에서 새 검사가 단 3센트의 비용이 들고 5분이 걸리며 거의 100% 정확하다고 해요.","c":"T"},"h":"5d35bec9ad"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, he was rejected 199 times.)","ko":"그러나, 그는 199번 거절당했다.","opts":["받아들여졌다","거절당했다","칭찬받았다","초대받았다"],"word":"rejected","r":{"a":"2) 거절당했다","ev":"7번 문장","s":[[7,"However, he was rejected 199 times.","그러나, 그는 199번 거절당했다."]],"w":"However로 앞의 기대(도움을 구함)와 반대되는 일이 나와요. 200명 중 199번이 도움을 받지 못한 것이므로 rejected = 거절당했다예요.","c":2},"h":"c85813344d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Unfortunately, the tools used to detect pancreatic cancer were expensive and unreliable.)","ko":"불행히도, 췌장암을 발견하는 데 사용되는 도구들은 비싸고 unreliable했다.","opts":["믿을 만한","값비싼","정확한","믿을 수 없는"],"word":"unreliable","r":{"a":"4) 믿을 수 없는","ev":"4번 문장","s":[[4,"Unfortunately, the tools used to detect pancreatic cancer were expensive and unreliable.","불행히도, 췌장암을 발견하는 데 사용되는 도구들은 비싸고 믿을만하지 못했다."]],"w":"Unfortunately로 나쁜 점을 말하는 문장이에요. reliable(믿을 만한)에 부정 접두사 un-이 붙어 '믿을 수 없는'이 되고, expensive(비싼)는 이미 앞에 따로 있어요.","c":4},"h":"c98c477ba5"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nFinally, after endless hours of hard work, he discovered what he was searching for—a protein that revealed pancreatic cancer even in its earliest stages.","ko":"밑줄 친 that이(가) 가리키는 것은?","sko":"마침내, 끝없는 시간의 노력 끝에, 그는 그가 찾던 것, 즉, 가장 초기 단계에서도 췌장암을 밝혀 주는 단백질을 발견했다.","opts":["끝없는 시간의 노력","단백질","췌장암","가장 초기 단계"],"r":{"a":"2) 단백질","ev":"10번 문장","s":[[10,"Finally, after endless hours of hard work, he discovered what he was searching for—a protein that revealed pancreatic cancer even in its earliest stages.","마침내, 끝없는 시간의 노력 끝에, 그는 그가 찾던 것, 즉, 가장 초기 단계에서도 췌장암을 밝혀 주는 단백질을 발견했다."]],"w":"10번에서 that revealed 앞에 있는 a protein(단백질)을 설명하는 말이에요. 가장 초기 단계에서도 췌장암을 밝혀 주는 단백질이라는 뜻이에요.","c":2,"k":"that = 단백질"},"pron":"that","h":"2385c36fcf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Just when Jack was about to give up, a doctor at Johns Hopkins School of Medicine agreed to be his mentor.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"잭이 막 포기하려던 바로 그때, 존스 홉킨스 의과대학의 의사 한 명이 그의 멘토가 되는 것에 동의했다.","opts":["잭이 포기하고 나서 한참 뒤에 한 의사가 그의 멘토가 되어 주었다.","잭이 포기하려던 바로 그때 한 의사가 그의 멘토가 되는 데 동의했다.","잭은 멘토를 만난 뒤에야 포기하려는 마음을 먹었다.","한 의사가 막 포기하려던 때 잭을 자신의 멘토로 삼으려 했다."],"r":{"a":"2) 잭이 포기하려던 바로 그때 한 의사가 그의 멘토가 되는 데 동의했다.","ev":"8번 문장","s":[[8,"Just when Jack was about to give up, a doctor at Johns Hopkins School of Medicine agreed to be his mentor.","잭이 막 포기하려던 바로 그때, 존스 홉킨스 의과대학의 의사 한 명이 그의 멘토가 되는 것에 동의했다."]],"w":"Just when ~ was about to give up은 '막 포기하려던 바로 그때'예요. 포기하기 전에 멘토가 생긴 것이고, 멘토가 되기로 한 쪽은 의사예요.","c":2},"h":"38716a235c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["잭은 인텔 국제과학기술경진대회에서 졌다.","잭은 상을 받았지만 그의 검사는 어떤 생명도 구할 수 없다.","잭은 자신의 업적으로 과학 경진대회의 수상자로 이름을 올렸다.","잭은 연구를 시작하기 전에 상을 받았다."],"opts":["Jack lost the Intel International Science & Engineering Fair.","Jack won a prize, but his test cannot save any lives.","Jack was named the winner of a science fair for his work.","Jack received the prize before he started his research."],"r":{"a":"3) Jack was named the winner of a science fair for his work.","ev":"12번 문장","s":[[12,"For his amazing work, Jack was named the winner of the Intel International Science & Engineering Fair, but more importantly, he invented something that has the potential to save countless lives.","그의 놀라운 업적으로, 잭은 인텔 국제과학기술경진대회의 수상자로 이름을 올렸지만 더욱 중요한 것은, 그는 수많은 생명을 구할 수 있는 가능성을 가진 무언가를 발명했다는 것이다."]],"w":"12번 문장에서 놀라운 업적으로 대회의 수상자로 이름을 올렸고, 수많은 생명을 구할 가능성이 있는 것을 발명했다고 해요. 상은 연구를 마친 뒤에 받은 것이에요.","c":3},"h":"fcfcc21f03"},{"n":9,"t":"sum","q":"A close friend of Jack’s family (A) of pancreatic cancer, and this sad event (B) Jack to do research.","ko":"잭 가족의 친한 친구가 췌장암으로 (A), 이 슬픈 일이 잭이 조사를 하도록 (B).","oko":["(A) 치료되었다 / (B) 동기를 부여했다","(A) 죽었다 / (B) 막았다","(A) 죽었다 / (B) 동기를 부여했다","(A) 치료되었다 / (B) 무시했다","(A) 죽었다 / (B) 무시했다"],"opts":["(A) was cured / (B) motivated","(A) died / (B) stopped","(A) died / (B) motivated","(A) was cured / (B) ignored","(A) died / (B) ignored"],"r":{"a":"3) (A) died / (B) motivated (죽었다 / 동기를 부여했다)","ev":"1번, 2번 문장","s":[[1,"Jack Andraka was just 15 years old when a close friend of his family died of pancreatic cancer.","잭 안드라카는 가족의 친한 친구 한 명이 췌장암으로 죽었을 때 겨우 15살이었다."],[2,"Motivated by this tragedy, he conducted some research and learned that pancreatic cancer is usually found too late.","이 비극적인 사건이 이유가 되어, 그는 약간의 조사를 했고 췌장암이 대개 너무 늦게 발견된다는 것을 알게 되었다."]],"w":"1번에서 가족의 친한 친구가 췌장암으로 죽었고(died), 2번에서 이 비극적인 사건이 이유가 되어(Motivated) 잭이 조사를 했다고 해요.","c":3},"h":"7ac1e22822"},{"n":10,"t":"fill","q":"If it were [A] early, the patient’s chance of [B] would be much higher.","ko":"만약 그것이 일찍 [A] 경우라면 환자의 [B] 가능성은 훨씬 높아질 것이다.","bank":["found","survival","proteins","stages","mentors","tools"],"bko":{"found":"발견된(find의 과거분사)","survival":"생존","proteins":"단백질들","stages":"단계들","mentors":"멘토들","tools":"도구들"},"r":{"a":"[A] found (발견된), [B] survival (생존)","ev":"3번 문장","s":[[3,"If it were found early, the patient’s chance of survival would be much higher.","만약 췌장암이 빨리 발견된다면 환자의 생존 가능성은 훨씬 높아질 것이었다."]],"w":"3번에서 췌장암이 일찍 발견된다면(found early) 환자의 생존(survival) 가능성이 훨씬 높아질 것이라고 해요. proteins, stages, mentors, tools는 다른 문장에 나오는 말이에요.","c":null},"h":"bd2e417c66"}]},{"u":7,"id":"ch2-07-1","no":1,"ko":"역대 가장 똑똑한 의사","items":[{"n":1,"t":"tf","q":"A doctor would need much more time than most doctors really spend to read every new medical paper.","ko":"의사가 모든 새로운 의학 논문을 읽으려면 대부분의 의사가 실제로 쓰는 시간보다 훨씬 더 많은 시간이 필요할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"7~8번 문장","s":[[7,"If you wanted to read every new medical paper that was published, you would need 160 hours of free time every week.","만약 여러분이 발행된 모든 새로운 의학 논문을 읽기를 원한다면, 여러분은 매주 160시간이라는 여가 시간이 필요할 것이다."],[8,"In reality, most doctors spend five hours a month or less reading medical papers.","실제로는, 대부분의 의사들이 의학 논문을 읽는 데 한 달에 5시간 이하를 보낸다."]],"w":"7번에서 새로 나온 논문을 모두 읽으려면 매주 160시간이 필요하다고 해요. 8번에서는 실제로 대부분의 의사가 의학 논문을 읽는 데 한 달에 5시간 이하를 쓴다고 해요. 필요한 시간이 실제로 쓰는 시간보다 훨씬 많으니 맞는 말이에요.","c":"T"},"h":"05167a4072"},{"n":2,"t":"tf","q":"American doctors make about 1.5 million medication mistakes every year because they are not well trained.","ko":"미국 의사들은 훈련이 잘 되어 있지 않아서 매년 약 150만 번의 의료 실수를 한다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"Doctors in the US are highly trained and have access to all the latest equipment.","미국의 의사들은 훈련이 잘되어 있고 모든 최신 장비에 접근할 수 있다."],[5,"Despite this, it is estimated that American doctors make about 1.5 million medication mistakes every year.","이에도 불구하고, 미국 의사들은 매년 약 150만 번의 의료 실수를 한다고 추정된다."]],"w":"4번에서 미국 의사들은 훈련이 잘 되어 있고(highly trained) 최신 장비도 쓸 수 있다고 해요. 5번 Despite this(이에도 불구하고)로 그런데도 실수를 한다고 하니, 훈련이 부족해서라는 이유는 본문과 달라요.","c":"F"},"h":"a343394f77"},{"n":3,"t":"tf","q":"The passage says that AI cannot show concern or care like humans can.","ko":"글에 따르면 AI는 인간이 할 수 있는 것처럼 배려나 보살핌을 보여줄 수 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Of course, there is a downside in that AI cannot show concern or care like humans can.","물론, AI는 인간이 할 수 있는 것처럼 배려나 보살핌을 보여줄 수 없다는 점에서 불리한 면이 있다."]],"w":"11번에 there is a downside in that AI cannot show concern or care like humans can이라고 있어요. AI가 인간처럼 배려나 보살핌을 보여 줄 수 없다는 점이 불리한 면이라는 뜻이에요.","c":"T"},"h":"84188bb7bb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, there are some tasks that are simply too intricate for our brains to handle well.)","ko":"그러나, 그저 너무 복잡해서 우리의 두뇌가 다룰 수 없는 몇 가지 일들이 있다.","opts":["단순한","오래된","복잡한","위험한"],"word":"intricate","r":{"a":"3) 복잡한","ev":"2번 문장","s":[[2,"However, there are some tasks that are simply too intricate for our brains to handle well.","그러나, 그저 너무 복잡해서 우리의 두뇌가 다룰 수 없는 몇 가지 일들이 있다."]],"w":"2번은 두뇌가 잘 다루지 못하는 일이 있다는 내용이에요. 그래서 too intricate(너무 ~해서 …할 수 없다)는 ‘복잡한’이어야 자연스러워요. 반대말 ‘단순한’이면 두뇌가 쉽게 다룰 수 있다는 뜻이 되어 앞뒤가 맞지 않아요.","c":3},"h":"0b48bb50ba"},{"n":5,"t":"vocab","q":"
