", "right": "system", "partial": false, "at": [7], "point": "명사의 복수형: a 뒤에는 단수명사 system 사용", "topic": "명사의 복수형", "memo": "a 뒤에는 단수명사 system 사용"}, {"wrong": "them", "right": "they", "partial": false, "at": [9], "point": "인칭대명사의 격: 주어 자리에는 주격 they 사용", "topic": "인칭대명사의 격", "memo": "주어 자리에는 주격 they 사용"}]}, {"n": 7, "tag": null, "en": "Hula is a language through body movements, and it has pass down stories from one generation to the next.", "ko": "훌라는 몸의 움직임을 통한 언어로, 한 세대에서 다음 세대로 이야기를 전해 왔습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "pass", "right": "passed", "partial": false, "at": [10], "point": "현재완료: 현재완료는 has + 과거분사: has passed (pass 아님)", "topic": "현재완료", "memo": "현재완료는 has + 과거분사: has passed (pass 아님)"}]}, {"n": 8, "tag": null, "en": "Now it's time to dance! Remember that you become a storyteller when you dance hula.", "ko": "이제 춤을 출 시간이에요! 훌라를 출 때는 당신이 이야기꾼이 된다는 것을 기억하세요.", "ok": true, "foot": [], "fixes": []}, {"n": 9, "tag": null, "en": "You tell a story with your hands, foot, and hips. Oh, you need to take off your shoes and socks!", "ko": "당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요. 아, 신발과 양말을 벗어야 해요!", "ok": false, "foot": [], "fixes": [{"wrong": "foot", "right": "feet", "partial": false, "at": [7], "point": "불규칙 복수형: foot의 복수형은 feet", "topic": "불규칙 복수형", "memo": "foot의 복수형은 feet"}]}, {"n": 10, "tag": null, "en": "Hula is always done barefoot.", "ko": "훌라는 항상 맨발로 하거든요.", "ok": true, "foot": [], "fixes": []}, {"n": 11, "tag": null, "en": "Let's starts with the hand gestures. Every gestures in hula has a meaning.", "ko": "손동작부터 시작할게요. 훌라의 모든 동작에는 의미가 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "starts", "right": "start", "partial": false, "at": [1], "point": "Let's 제안문: Let's 뒤에는 동사원형 start 사용", "topic": "Let's 제안문", "memo": "Let's 뒤에는 동사원형 start 사용"}, {"wrong": "gestures", "right": "gesture", "partial": false, "at": [7], "point": "every + 단수명사: Every 뒤에는 단수명사 gesture 사용", "topic": "every + 단수명사", "memo": "Every 뒤에는 단수명사 gesture 사용"}]}, {"n": 12, "tag": null, "en": "Wave yours fingers while you move your arms up and down. This gesture is called ua at the Hawaiian language, and it mean \"rain.\"", "ko": "팔을 위아래로 움직이면서 손가락을 흔들어 보세요. 이 동작은 하와이어로 'ua'라고 불리고, '비'를 뜻해요.", "ok": false, "foot": [], "fixes": [{"wrong": "yours", "right": "your", "partial": false, "at": [1], "point": "인칭대명사의 격: 명사 앞 소유격 your 사용 (yours 아님)", "topic": "인칭대명사의 격", "memo": "명사 앞 소유격 your 사용 (yours 아님)"}, {"wrong": "at", "right": "in", "partial": false, "at": [16], "point": "기본전치사: '~어로'는 in the Hawaiian language", "topic": "기본전치사", "memo": "'~어로'는 in the Hawaiian language"}, {"wrong": "mean", "right": "means", "partial": false, "at": [22], "point": "3인칭 단수 현재형: 주어 it에는 means 사용", "topic": "3인칭 단수 현재형", "memo": "주어 it에는 means 사용"}]}, {"n": 13, "tag": null, "en": "What about the sun? Hawaiians makes a circle with their arms above their heads.", "ko": "태양은 어떨까요? 하와이 사람들은 팔을 머리 위로 올려 원을 만들어요.", "ok": false, "foot": [], "fixes": [{"wrong": "makes", "right": "make", "partial": false, "at": [5], "point": "주어와 동사의 수일치: 주어 Hawaiians(복수)는 동사원형: make (makes 아님)", "topic": "주어와 동사의 수일치", "memo": "주어 Hawaiians(복수)는 동사원형: make (makes 아님)"}]}, {"n": 14, "tag": null, "en": "That's ka lā, the \"sun.\" These gestures are so simple that you can easy remember them.", "ko": "그것이 '태양'인 'ka lā'입니다. 이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "easy", "right": "easily", "partial": false, "at": [13], "point": "형용사와 부사: 동사 remember를 꾸밀 때는 부사 easily 사용", "topic": "형용사와 부사", "memo": "동사 remember를 꾸밀 때는 부사 easily 사용"}]}, {"n": 15, "tag": null, "en": "Next, bend your knees a few and step from side to side. While you step to the side, move your hips natural.", "ko": "다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요. 옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요.", "ok": false, "foot": [], "fixes": [{"wrong": "few", "right": "little", "partial": false, "at": [5], "point": "수량 형용사: '조금'은 a little 사용 (a few는 가산명사용)", "topic": "수량 형용사", "memo": "'조금'은 a little 사용 (a few는 가산명사용)"}, {"wrong": "natural", "right": "naturally", "partial": false, "at": [21], "point": "형용사와 부사: 동사 move를 꾸밀 때는 부사 naturally 사용", "topic": "형용사와 부사", "memo": "동사 move를 꾸밀 때는 부사 naturally 사용"}]}, {"n": 16, "tag": null, "en": "Now move your hands with your hips and foots!", "ko": "이제 엉덩이와 발과 함께 손을 움직이세요!", "ok": false, "foot": [], "fixes": [{"wrong": "foots", "right": "feet", "partial": false, "at": [8], "point": "불규칙 복수형: foot의 복수형은 feet", "topic": "불규칙 복수형", "memo": "foot의 복수형은 feet"}]}, {"n": 17, "tag": null, "en": "Well, time's up! That's all for today.", "ko": "자, 시간이 다 되었네요! 오늘은 여기까지예요.", "ok": true, "foot": [], "fixes": []}, {"n": 18, "tag": null, "en": "Remember that hula are not just a dance. Hula is a language and a way of storytelling, so it is importantly to Hawaiians.", "ko": "훌라는 단순한 춤이 아니라는 것을 기억하세요. 훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다.", "ok": false, "foot": [], "fixes": [{"wrong": "are", "right": "is", "partial": false, "at": [3], "point": "be동사 수일치: 단수 주어 hula에는 is 사용", "topic": "be동사 수일치", "memo": "단수 주어 hula에는 is 사용"}, {"wrong": "importantly", "right": "important", "partial": false, "at": [20], "point": "형용사와 부사: be동사 뒤 보어 자리에는 형용사 important 사용", "topic": "형용사와 부사", "memo": "be동사 뒤 보어 자리에는 형용사 important 사용"}]}, {"n": 19, "tag": null, "en": "As an hula teacher, I always tries to continue the history and culture of Hawaii. If you want to learn more, come to my next class.", "ko": "훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력합니다. 더 배우고 싶으시다면 제 다음 수업에 오세요.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [1], "point": "관사 a/an: 자음 소리 hula 앞에는 a 사용", "topic": "관사 a/an", "memo": "자음 소리 hula 앞에는 a 사용"}, {"wrong": "tries", "right": "try", "partial": false, "at": [6], "point": "3인칭 단수 현재형: 주어 I에는 try (3인칭 아님)", "topic": "3인칭 단수 현재형", "memo": "주어 I에는 try (3인칭 아님)"}]}, {"n": 20, "tag": null, "en": "Everyone are welcome. Aloha!", "ko": "모두 환영해요. 알로하!", "ok": false, "foot": [], "fixes": [{"wrong": "are", "right": "is" ka lā'입니다.", 0], ["These gestures are so simple that you can easily remember them.", "이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요.", 0], ["Next, bend your knees a little and step from side to side.", "다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요.", 1], ["While you step to the side, move your hips naturally.", "옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요.", 0], ["Now move your hands with your hips and feet!", "이제 엉덩이와 발과 함께 손을 움직이세요!", 0], ["Well, time's up!", "자, 시간이 다 되었네요!", 1], ["That's all for today.", "오늘은 여기까지예요.", 0], ["Remember that hula is not just a dance.", "훌라는 단순한 춤이 아니라는 것을 기억하세요.", 0], ["Hula is a language and a way of storytelling, so it is important to Hawaiians.", "훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다.", 0], ["As a hula teacher, I always try to continue the history and culture of Hawaii.", "훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력합니다.", 0], ["If you want to learn more, come to my next class.", "더 배우고 싶으시다면 제 다음 수업에 오세요.", 0], ["Everyone is welcome.", "모두 환영해요.", 0], ["Aloha!", "알로하!", 0]];var RNUM=39;var TITLE_EN="Hula, More than Just a Dance";var PASS_EN=["Hula, More than Just a Dance", "Aloha! Welcome to Hawaii! Aloha means \"hello\" or \"goodbye\" in the Hawaiian language. I'm Malia, and I'm your hula teacher for today. Have you heard of hula before? How much do you know about hula? Before we start our lesson, I want to tell you about it.", "Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time. The early Hawaiians didn't have a writing system, so they used hula to tell stories. Hula is a language through body movements, and it has passed down stories from one generation to the next.", "Now it's time to dance! Remember that you become a storyteller when you dance hula. You tell a story with your hands, feet, and hips. Oh, you need to take off your shoes and socks! Hula is always done barefoot.", "Let's start with the hand gestures. Every gesture in hula has a meaning. Wave your fingers while you move your arms up and down. This gesture is called ua in the Hawaiian language, and it means \"rain.\" What about the sun? Hawaiians make a circle with their arms above their heads. That's ka lā, the \"sun.\" These gestures are so simple that you can easily remember them.", "Next, bend your knees a little and step from side to side. While you step to the side, move your hips naturally. Now move your hands with your hips and feet!", "Well, time's up! That's all for today. Remember that hula is not just a dance. Hula is a language and a way of storytelling, so it is important to Hawaiians. As a hula teacher, I always try to continue the history and culture of Hawaii. If you want to learn more, come to my next class. Everyone is welcome. Aloha!"];var PASS_KO=["단순한 춤 그 이상인 훌라", "알로하! 하와이에 오신 것을 환영해요! '알로하'는 하와이어로 '안녕하세요' 또는 '안녕히 가세요'라는 뜻이에요. 저는 Malia이고 오늘 당신의 훌라 선생님이에요. 훌라에 대해 전에 들어 본 적이 있나요? 훌라에 대해 얼마나 알고 있나요? 수업을 시작하기 전에 그것에 대해 말씀드리고 싶어요.", "훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요. 초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요. 훌라는 몸의 움직임을 통한 언어로, 한 세대에서 다음 세대로 이야기를 전해 왔습니다.", "이제 춤을 출 시간이에요! 훌라를 출 때는 당신이 이야기꾼이 된다는 것을 기억하세요. 당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요. 아, 신발과 양말을 벗어야 해요! 훌라는 항상 맨발로 하거든요.", "손동작부터 시작할게요. 훌라의 모든 동작에는 의미가 있어요. 팔을 위아래로 움직이면서 손가락을 흔들어 보세요. 이 동작은 하와이어로 'ua'라고 불리고, '비'를 뜻해요. 태양은 어떨까요? 하와이 사람들은 팔을 머리 위로 올려 원을 만들어요. 그것이 '태양'인 'ka lā'입니다. 이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요.", "다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요. 옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요. 이제 엉덩이와 발과 함께 손을 움직이세요!", "자, 시간이 다 되었네요! 오늘은 여기까지예요. 훌라는 단순한 춤이 아니라는 것을 기억하세요. 훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다. 훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력합니다. 더 배우고 싶으시다면 제 다음 수업에 오세요. 모두 환영해요. 알로하!"];
var BG=[{"qs": [{"n": 6, "q": "윗글의 내용과 일치하는 것은?", "o": ["The early Hawaiians recorded stories in writing.", "Hula is a dance that was made recently.", "Malia is a swimming teacher today.", "Hula is a traditional dance from Hawaii and has been a part of Hawaiian life for a long time.", "Aloha means \"thank you\" in the Hawaiian language."], "a": 3, "ans": "Hula is a traditional dance from Hawaii and has been a part of Hawaiian life for a long time.", "ko": ["초기 하와이인들은 문자로 이야기를 기록했다.", "훌라는 최근에 만들어진 춤이다.", "Malia는 오늘 수영 선생님이다.", "훌라는 하와이의 전통 춤으로 오랫동안 하와이 생활의 일부였다.", "알로하는 하와이어로 '감사합니다'라는 뜻이다."], "ow": ["오답 ✕ — 본문에는 \"The early Hawaiians didn't have a writing system, so they used hula to tell stories.\"(초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요.)라고 했는데 이 보기는 문자로 기록했다고 해서 틀림.", "오답 ✕ — 본문에는 \"it has been a part of Hawaiian life for a long time\"(오랫동안 하와이 생활의 일부였어요)라고 했는데 이 보기는 최근에 만들어졌다고 해서 틀림.", "오답 ✕ — 본문에는 \"I'm Malia, and I'm your hula teacher for today.\"(저는 Malia이고 오늘 당신의 훌라 선생님이에요.)라고 했는데 이 보기는 수영 선생님이라고 해서 틀림.", "정답 ○ — \"Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.\"(훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요.)라고 했으므로 맞음.", "오답 ✕ — 본문에는 \"Aloha means 'hello' or 'goodbye' in the Hawaiian language.\"(알로하는 하와이어로 '안녕하세요' 또는 '안녕히 가세요'라는 뜻이에요.)라고 했는데 이 보기는 '감사합니다'라고 해서 틀림."], "memo": ["정답 ④: Hula is a traditional dance from Hawaii and has been a part of Hawaiian life for a long time.(훌라는 하와이의 전통 춤으로 오랫동안 하와이 생활의 일부였다.)", "근거: Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.(훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요.)", "함정: Aloha means \"thank you\" in the Hawaiian language.(알로하는 '감사합니다'라는 뜻이다.)는 본문의 \"hello\" or \"goodbye\"(안녕하세요 또는 안녕히 가세요)와 달라서 ✕"], "evs": [["Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.", "훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요."]], "ev": ["Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.", "훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요."], "why": "훌라는 하와이의 전통 춤으로 오랫동안 하와이 사람들의 생활의 일부였다."}, {"n": 7, "q": "윗글의 내용을 요약한 문장의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?", "o": ["writing - stories", "counting - jokes", "writing - lies", "farming - songs", "voting - rules"], "a": 0, "ans": "writing - stories", "evs": [["The early Hawaiians didn't have a writing system, so they used hula to tell stories.", "초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요."]], "ev": ["The early Hawaiians didn't have a writing system, so they used hula to tell stories.", "초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요."], "ow": ["정답 ○ — \"The early Hawaiians didn't have a writing system, so they used hula to tell stories.\"(초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요.)에 그대로 맞음.", "오답 ✕ — 본문의 \"writing system\"(문자 체계)이 아니라 counting(셈하기)이라고 했고, 훌라로 전한 것도 \"stories\"(이야기)이지 jokes(농담)가 아니라서 둘 다 틀림.", "오답 ✕ — (A) writing은 맞지만, 훌라로 전한 것은 \"stories\"(이야기)이지 lies(거짓말)가 아니라서 틀림.", "오답 ✕ — 본문에는 \"didn't have a writing system\"(문자가 없었다)이라고 했는데 이 보기는 farming(농사)이라고 하고, 전한 것도 songs(노래)라고 해서 둘 다 틀림.", "오답 ✕ — 본문에는 \"didn't have a writing system\"(문자가 없었다)이라고 했는데 이 보기는 voting(투표)이라고 하고, rules(규칙)를 전한다는 말도 없어서 둘 다 틀림."], "memo": ["정답 ①: writing(문자) - stories(이야기)", "근거: didn't have a writing system, so they used hula to tell stories(문자가 없어서 이야기를 하기 위해 훌라를 사용했다)", "함정: (A)만 맞고 (B)가 틀린 ③ lies에 주의 ✕"], "why": "문자가 없던 초기 하와이인들은 훌라로 이야기를 전했다.", "sum": "The early Hawaiians didn't have a (A)________ system, so they used hula to tell (B)________.", "lab": "완성된 요약문 : ", "ko": ["쓰기 - 이야기", "세기 - 농담", "쓰기 - 거짓말", "농사 - 노래", "투표 - 규칙"]}], "pp": [["Aloha!", "알로하!"], ["Welcome to Hawaii!", "하와이에 오신 것을 환영해요!"], ["Aloha means \"hello\" or \"goodbye\" in the Hawaiian language.", "'알로하'는 하와이어로 '안녕하세요' 또는 '안녕히 가세요'라는 뜻이에요."], ["I'm Malia, and I'm your hula teacher for today.", "저는 Malia이고 오늘 당신의 훌라 선생님이에요."], ["Have you heard of hula before?", "훌라에 대해 전에 들어 본 적이 있나요?"], ["How much do you know about hula?", "훌라에 대해 얼마나 알고 있나요?"], ["Before we start our lesson, I want to tell you about it.", "수업을 시작하기 전에 그것에 대해 말씀드리고 싶어요."], ["Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.", "훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요."], ["The early Hawaiians didn't have a writing system, so they used hula to tell stories.", "초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요."], ["Hula is a language through body movements, and it has passed down stories from one generation to the next.", "훌라는 몸의 움직임을 통한 언어로, 한 세대에서 다음 세대로 이야기를 전해 왔습니다."]]}, {"qs": [{"n": 8, "q": "윗글의 제목으로 알맞은 것은?", "o": ["Two Types of Hula", "How Did the Hula Start?", "Why Is the Hula Popular?", "Let's Learn to Dance the Hula", "The Meaning of Hula Gestures"], "a": 3, "ans": "Let's Learn to Dance the Hula", "evs": [["Now it's time to dance!", "이제 춤을 출 시간이에요!"], ["Let's start with the hand gestures.", "손동작부터 시작할게요."]], "ev": ["Now it's time to dance!", "이제 춤을 출 시간이에요!"], "ow": ["오답 ✕ — 훌라의 종류가 두 가지라는 내용은 본문에 없다. 대신 \"Let's start with the hand gestures.\"(손동작부터 시작할게요.)처럼 순서대로 춤을 배워 나가서 틀림.", "오답 ✕ — 훌라가 어떻게 시작되었는지는 앞부분의 설명이고, 이 글은 \"Now it's time to dance!\"(이제 춤을 출 시간이에요!)이라며 춤을 직접 배우는 수업이라서 틀림.", "오답 ✕ — 훌라가 왜 인기가 있는지에 대한 이야기는 없다. 가장 가까운 문장은 \"it is important to Hawaiians\"(하와이 사람들에게 중요하다)인데 인기가 아니라 중요성을 말하는 것임.", "정답 ○ — \"Now it's time to dance!\"(이제 춤을 출 시간이에요!)라며 손동작, 발동작, 엉덩이 움직임을 차례로 가르치므로 훌라 춤을 배워 보자는 제목이 알맞음.", "오답 ✕ — 손동작의 의미(ua는 비, ka lā는 태양)는 글의 일부일 뿐, 발동작과 엉덩이 움직임(\"bend your knees a little and step from side to side\")까지 다루는 전체 내용에 비해 너무 좁아서 틀림."], "memo": ["정답 ④ Let's Learn to Dance the Hula(훌라 춤을 배워 보자)", "근거: Now it's time to dance!(이제 춤을 출 시간이에요!)", "함정: ⑤ 손동작의 의미는 글의 일부일 뿐이라 너무 좁다 ✕"], "why": "손, 발, 엉덩이 동작을 차례로 배우는 훌라 수업이므로 제목은 Let's Learn to Dance the Hula이다.", "ko": ["두 가지 종류의 훌라", "훌라는 어떻게 시작되었을까?", "훌라는 왜 인기가 있을까?", "훌라 춤을 배워 보자", "훌라 손동작의 의미"]}, {"n": 9, "q": "윗글의 내용과 일치하는 것은?", "o": ["The movements of hula have no special meaning.", "Waving your fingers while moving your arms up and down means \"sun.\"", "Making a circle with your arms above your head is ka lā, which means \"sun.\"", "Hula is danced with shoes on.", "Only the hands are used when dancing hula."], "a": 2, "ans": "Making a circle with your arms above your head is ka lā, which means \"sun.\"", "ko": ["훌라의 동작에는 특별한 의미가 없다.", "팔을 위아래로 움직이며 손가락을 흔드는 동작은 '태양'을 뜻한다.", "팔로 머리 위에 원을 만드는 동작은 'ka lā'로 '태양'을 뜻한다.", "훌라는 신발을 신고 춘다.", "훌라를 출 때는 손만 사용한다."], "ow": ["오답 ✕ — 본문에는 \"Every gesture in hula has a meaning.\"(훌라의 모든 동작에는 의미가 있어요.)라고 했는데 이 보기는 의미가 없다고 해서 틀림.", "오답 ✕ — 본문에는 \"This gesture is called ua in the Hawaiian language, and it means 'rain.'\"(이 동작은 하와이어로 'ua'라고 불리고, '비'를 뜻해요.)라고 했는데 이 보기는 태양이라고 해서 틀림.", "정답 ○ — \"Hawaiians make a circle with their arms above their heads. That's ka lā, the 'sun.'\"(하와이 사람들은 팔을 머리 위로 올려 원을 만들어요. 그것이 '태양'인 'ka lā'입니다.)라고 했으므로 맞음.", "오답 ✕ — 본문에는 \"Hula is always done barefoot.\"(훌라는 항상 맨발로 하거든요.)라고 했는데 이 보기는 신발을 신고 춘다고 해서 틀림.", "오답 ✕ — 본문에는 \"You tell a story with your hands, feet, and hips.\"(당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요.)라고 했는데 이 보기는 손만 사용한다고 해서 틀림."], "memo": ["정답 ③: Making a circle with your arms above your head is ka lā, which means \"sun.\"(팔로 머리 위에 원을 만드는 동작은 'ka lā'로 '태양'을 뜻한다.)", "근거: Hawaiians make a circle with their arms above their heads. That's ka lā, the \"sun.\"(하와이 사람들은 팔을 머리 위로 올려 원을 만들어요. 그것이 '태양'인 'ka lā'입니다.)", "함정: Waving your fingers while moving your arms up and down means \"sun.\"(손가락을 흔드는 동작은 '태양')은 ua이고 뜻이 \"rain\"(비)이라서 ✕"], "evs": [["Hawaiians make a circle with their arms above their heads.", "하와이 사람들은 팔을 머리 위로 올려 원을 만들어요."], ["That's ka lā, the \"sun.\"", "그것이 '태양'인 'ka lā'입니다."]], "ev": ["Hawaiians make a circle with their arms above their heads.", "하와이 사람들은 팔을 머리 위로 올려 원을 만들어요."], "why": "팔로 머리 위에 원을 만드는 동작이 태양(ka lā)을 뜻한다."}, {"n": 10, "q": "윗글의 내용을 요약한 문장의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?", "o": ["language - Hawaiians", "game - tourists", "language - teachers", "song - children", "sport - Koreans"], "a": 0, "ans": "language - Hawaiians", "evs": [["Hula is a language and a way of storytelling, so it is important to Hawaiians.", "훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다."]], "ev": ["Hula is a language and a way of storytelling, so it is important to Hawaiians.", "훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다."], "ow": ["정답 ○ — \"Hula is a language and a way of storytelling, so it is important to Hawaiians.\"(훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다.)에 그대로 맞음.", "오답 ✕ — 본문에는 \"Hula is a language\"(훌라는 언어이다)라고 했는데 이 보기는 game(게임)이라고 하고, 중요한 대상도 \"Hawaiians\"(하와이 사람들)이지 tourists(관광객)가 아니라서 둘 다 틀림.", "오답 ✕ — (A) language는 맞지만, 본문에는 \"it is important to Hawaiians\"(하와이 사람들에게 중요하다)라고 했는데 이 보기는 teachers(선생님들)라고 해서 틀림.", "오답 ✕ — 본문에는 \"Hula is a language\"(훌라는 언어이다)라고 했는데 이 보기는 song(노래)이라고 하고, 중요한 대상도 children(어린이)이 아니라서 둘 다 틀림.", "오답 ✕ — 본문에는 \"Hula is a language\"(훌라는 언어이다)라고 했는데 이 보기는 sport(운동)라고 하고, 중요한 대상도 \"Hawaiians\"가 아니라 Koreans(한국인)라서 둘 다 틀림."], "memo": ["정답 ①: language(언어) - Hawaiians(하와이 사람들)", "근거: Hula is a language and a way of storytelling, so it is important to Hawaiians.(훌라는 언어이자 이야기하는 방법이어서 하와이 사람들에게 중요하다.)", "함정: (A)만 맞고 (B)가 틀린 ③ teachers에 주의 ✕"], "why": "훌라는 춤을 넘어 언어이자 이야기를 전하는 방법이라 하와이 사람들에게 중요하다.", "sum": "Hula is not just a dance but a (A)________ and a way of storytelling, so it is important to (B)________.", "lab": "완성된 요약문 : ", "ko": ["언어 - 하와이 사람들", "게임 - 관광객들", "언어 - 선생님들", "노래 - 아이들", "운동 - 한국 사람들"], "note": {"en": "Hula is not just a dance but a language and a way of storytelling, so it is important to Hawaiians.", "ko": "훌라는 단순한 춤이 아니라 언어이자 이야기를 전하는 방법이어서 하와이 사람들에게 중요하다.", "words": [["language", "언어"], ["Hawaiians", "하와이 사람 (Hawaiian의 복수형)"]]}}], "pp": [["Now it's time to dance!", "이제 춤을 출 시간이에요!"], ["Remember that you become a storyteller when you dance hula.", "훌라를 출 때는 당신이 이야기꾼이 된다는 것을 기억하세요."], ["You tell a story with your hands, feet, and hips.", "당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요."], ["Oh, you need to take off your shoes and socks!", "아, 신발과 양말을 벗어야 해요!"], ["Hula is always done barefoot.", "훌라는 항상 맨발로 하거든요."], ["Let's start with the hand gestures.", "손동작부터 시작할게요."], ["Every gesture in hula has a meaning.", "훌라의 모든 동작에는 의미가 있어요."], ["Wave your fingers while you move your arms up and down.", "팔을 위아래로 움직이면서 손가락을 흔들어 보세요."], ["This gesture is called ua in the Hawaiian language, and it means \"rain.\"", "이 동작은 하와이어로 'ua'라고 불리고, '비'를 뜻해요."], ["What about the sun?", "태양은 어떨까요?"], ["Hawaiians make a circle with their arms above their heads.", "하와이 사람들은 팔을 머리 위로 올려 원을 만들어요."], ["That's ka lā, the \"sun.\"", "그것이 '태양'인 'ka lā'입니다."], ["These gestures are so simple that you can easily remember them.", "이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요."], ["Next, bend your knees a little and step from side to side.", "다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요."], ["While you step to the side, move your hips naturally.", "옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요."], ["Now move your hands with your hips and feet!", "이제 엉덩이와 발과 함께 손을 움직이세요!"], ["Well, time's up!", "자, 시간이 다 되었네요!"], ["That's all for today.", "오늘은 여기까지예요."], ["Remember that hula is not just a dance.", "훌라는 단순한 춤이 아니라는 것을 기억하세요."], ["Hula is a language and a way of storytelling, so it is important to Hawaiians.", "훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다."], ["As a hula teacher, I always try to continue the history and culture of Hawaii.", "훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력합니다."], ["If you want to learn more, come to my next class.", "더 배우고 싶으시다면 제 다음 수업에 오세요."], ["Everyone is welcome.", "모두 환영해요."], ["Aloha!", "알로하!"]]}];

 });

function aDone(){return secs.every(function(S,si){return done[si]})}

 h+='<div class="sent'+(lock?' locked':'')+'" id="s'+i+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt" lang="en">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}

 });

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}

function fixedHtml(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0001'+f.right+'\u0002');return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0001'+f.right+'\u0002'+trail].concat(Array(n-1).fill('\u0000')))});
 });

function diffHtml(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){

   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0003'+f.wrong+'\u0004'+(R?' '+R:'')+trail].concat(Array(n-1).fill('\u0000')))});
 });
