<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}

.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}

.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}

.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Last summer, I spend a month at my cousin’s place in New York City.", "ko": "지난여름 나는 뉴욕시의 사촌 집에서 한 달을 보냈다.", "ok": false, "foot": [], "fixes": [{"wrong": "spend", "right": "spent", "partial": false, "at": [3], "point": "시제: Last summer라는 과거 시점 부사구와 함께 쓰였으므로 과거시제 spent 사용", "topic": "시제", "memo": "Last summer라는 과거 시점 부사구와 함께 쓰였으므로 과거시제 spent 사용"}]}, {"n": 2, "tag": null, "en": "Each day I enjoyed the city, and I called it an unforgettable experiences.", "ko": "매일 나는 그 도시를 즐겼고, 나는 그것을 잊지 못할 경험이라고 불렀다.", "ok": false, "foot": [], "fixes": [{"wrong": "experiences", "right": "experience", "partial": false, "at": [12], "point": "5형식(목적격보어): 목적어 it(단수)을 설명하는 명사 보어이므로 단수형 experience 사용", "topic": "5형식(목적격보어)", "memo": "목적어 it(단수)을 설명하는 명사 보어이므로 단수형 experience 사용"}]}, {"n": 3, "tag": null, "en": "New York City is famous for its high-rise buildings, but it also has beautiful parks.", "ko": "뉴욕시는 고층 건물로 유명하지만, 아름다운 공원들도 있다.", "ok": true, "foot": ["1high-rise 고층의"], "fixes": []}, {"n": 4, "tag": null, "en": "As my cousin’s apartment was nearby Central Park, I often go there.", "ko": "내 사촌의 아파트가 센트럴 파크 근처에 있었기 때문에 나는 자주 거기에 갔다.", "ok": false, "foot": [], "fixes": [{"wrong": "nearby", "right": "near", "partial": false, "at": [5], "point": "어휘/전치사: nearby는 전치사로 쓰일 수 없으므로 near 사용", "topic": "어휘/전치사", "memo": "nearby는 전치사로 쓰일 수 없으므로 near 사용"}, {"wrong": "go", "right": "went", "partial": false, "at": [10], "point": "시제: 과거 서술이므로 과거시제 went 사용", "topic": "시제", "memo": "과거 서술이므로 과거시제 went 사용"}]}, {"n": 5, "tag": null, "en": "I attended a free yoga class and rowing a boat on the lake.", "ko": "나는 무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다.", "ok": false, "foot": [], "fixes": [{"wrong": "rowing", "right": "rowed", "partial": false, "at": [7], "point": "병렬구조: and로 연결된 두 동사는 같은 형태(과거형) attended, rowed 사용", "topic": "병렬구조", "memo": "and로 연결된 두 동사는 같은 형태(과거형) attended, rowed 사용"}]}, {"n": 6, "tag": null, "en": "Sometimes, I lied down on the grass and watched people to pass by.", "ko": "때때로 나는 잔디 위에 누워 사람들이 지나가는 것을 보았다.", "ok": false, "foot": [], "fixes": [{"wrong": "lied", "right": "lay", "partial": false, "at": [2], "point": "어휘: '눕다'의 과거형은 lay (lied는 '거짓말했다'라는 뜻의 lie-lied-lied)", "topic": "어휘", "memo": "'눕다'의 과거형은 lay (lied는 '거짓말했다'라는 뜻의 lie-lied-lied)"}, {"wrong": "to pass", "right": "passing", "partial": false, "at": [10], "point": "5형식(지각동사): watch는 지각동사이므로 목적격보어로 동사원형이나 v-ing 사용 (to부정사 불가)", "topic": "5형식(지각동사)", "memo": "watch는 지각동사이므로 목적격보어로 동사원형이나 v-ing 사용 (to부정사 불가)"}]}, {"n": 7, "tag": null, "en": "I once saw a dog walker to walk ten dogs at the same time.", "ko": "한번은 도그 워커가 열 마리의 개를 동시에 산책시키는 것을 보았다.", "ok": false, "foot": [], "fixes": [{"wrong": "to walk", "right": "walking", "partial": false, "at": [6], "point": "5형식(지각동사): see는 지각동사이므로 목적격보어로 동사원형이나 v-ing 사용 (to부정사 불가)", "topic": "5형식(지각동사)", "memo": "see는 지각동사이므로 목적격보어로 동사원형이나 v-ing 사용 (to부정사 불가)"}]}, {"n": 8, "tag": null, "en": "I could not imagine how did the dog walker manage to control so many dogs alone.", "ko": "나는 그 도그 워커가 어떻게 그렇게 많은 개를 혼자 통제하는지 상상할 수 없었다.", "ok": false, "foot": [], "fixes": [{"wrong": "how did the dog walker manage", "right": "how the dog walker managed", "partial": false, "at": [4], "point": "간접의문문: 의문사(how)가 이끄는 간접의문문은 <의문사+주어+동사> 어순 사용 (did 불필요)", "topic": "간접의문문", "memo": "의문사(how)가 이끄는 간접의문문은 <의문사+주어+동사> 어순 사용 (did 불필요)"}]}, {"n": 9, "tag": null, "en": "After spent time in the park, I often visited a famous bagel shop near the park.", "ko": "나는 공원에서 시간을 보낸 후에 공원 근처의 유명한 베이글 가게에 자주 갔다.", "ok": false, "foot": [], "fixes": [{"wrong": "spent", "right": "spending", "partial": false, "at": [1], "point": "전치사 뒤에는 동명사 사용: After + spending", "topic": "전치사 뒤에는 동명사 사용", "memo": "After + spending"}]}, {"n": 10, "tag": null, "en": "It had more than 20 toppings.", "ko": "거기에는 20개가 넘는 토핑이 있었다.", "ok": true, "foot": ["1toppings (음식 위에 얹는) 토핑"], "fixes": []}, {"n": 11, "tag": null, "en": "Among the toppings who I tried, bacon and cheese were my favorites.", "ko": "내가 먹어 본 토핑 중에서, 베이컨과 치즈는 내가 가장 좋아하는 것이었다.", "ok": false, "foot": [], "fixes": [{"wrong": "who", "right": "that/which", "partial": false, "at": [3], "point": "목적격 관계대명사: 선행사가 사물(toppings)이므로 that/which 사용 (who는 사람에게만 사용)", "topic": "목적격 관계대명사", "memo": "선행사가 사물(toppings)이므로 that/which 사용 (who는 사람에게만 사용)"}]}, {"n": 12, "tag": null, "en": "I enjoyed to visit museum such as the Met and MoMA.", "ko": "나는 Met과 MoMA 같은 박물관들에 가는 것을 즐겼다.", "ok": false, "foot": [], "fixes": [{"wrong": "to visit", "right": "visiting", "partial": false, "at": [2], "point": "동명사 vs to부정사: enjoy는 목적어로 동명사만 취함", "topic": "동명사 vs to부정사", "memo": "enjoy는 목적어로 동명사만 취함"}, {"wrong": "museum", "right": "museums", "partial": false, "at": [4], "point": "수일치: such as 뒤에 복수 예시가 이어지므로 복수형 museums 사용", "topic": "수일치", "memo": "such as 뒤에 복수 예시가 이어지므로 복수형 museums 사용"}]}, {"n": 13, "tag": null, "en": "They had much famous works of art that I saw in art books.", "ko": "그것들은 내가 미술책에서 보았던 유명한 예술품들을 많이 소장했다.", "ok": false, "foot": [], "fixes": [{"wrong": "much", "right": "many", "partial": false, "at": [2], "point": "수량형용사: 셀 수 있는 명사 works 앞에는 many 사용 (much는 불가산명사에 사용)", "topic": "수량형용사", "memo": "셀 수 있는 명사 works 앞에는 many 사용 (much는 불가산명사에 사용)"}]}, {"n": 14, "tag": null, "en": "At the Met, there were a room full of paintings by Vincent van Gogh.", "ko": "Met에는 Vincent van Gogh가 그린 그림들로 가득 찬 방이 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [4], "point": "수일치: 주어 a room(단수)에 맞춰 동사 was 사용", "topic": "수일치", "memo": "주어 a room(단수)에 맞춰 동사 was 사용"}]}, {"n": 15, "tag": null, "en": "I could not believe that I am looking at his works of art up close.", "ko": "나는 내가 그의 작품들을 가까이에서 보고 있었다는 것을 믿을 수 없었다.", "ok": false, "foot": [], "fixes": [{"wrong": "am", "right": "was", "partial": false, "at": [6], "point": "시제일치: 주절이 과거(could)이므로 종속절도 과거시제 was 사용", "topic": "시제일치", "memo": "주절이 과거(could)이므로 종속절도 과거시제 was 사용"}]}, {"n": 16, "tag": null, "en": "In another room, I e.", "그것은 매우 특별한 경험이었다.", 0], ["Watching The Lion King on Broadway was the most unforgettable moment.", "브로드웨이에서 <The Lion King>을 관람한 것은 가장 잊지 못할 순간이었다.", 0], ["When I saw the colorful stage, I felt like I was in the middle of an African jungle.", "다채로운 무대를 보았을 때, 나는 마치 아프리카 정글 한가운데에 있는 것 같은 기분이 들었다.", 0], ["The actors danced like real animals and sang in perfect harmony.", "배우들은 진짜 동물처럼 춤을 췄고 완벽한 조화를 이루어 노래를 불렀다.", 0], ["In the last scene, the hero Simba showed his baby lion to the world, and tears rolled down my face.", "마지막 장면에서 주인공 Simba가 자신의 새끼 사자를 세상에 보여 주었는데, 눈물이 내 얼굴을 타고 흘러내렸다.", 0], ["When I came out, huge, colorful signs were shining brightly.", "내가 밖으로 나왔을 때 크고 화려한 광고판들이 밝게 빛나고 있었다.", 0], ["Since that day, I have never forgotten this amazing city.", "그날 이후로 나는 이 멋진 도시를 결코 잊은 적이 없다.", 0]];var RNUM=48;var TITLE_EN="Living for a Month in New York City";var PASS_EN=["Living for a Month in New York City", "Last summer, I spent a month at my cousin’s place in New York City. Each day I enjoyed the city, and I called it an unforgettable experience. New York City is famous for its high-rise buildings, but it also has beautiful parks. As my cousin’s apartment was near Central Park, I often went there. I attended a free yoga class and rowed a boat on the lake. Sometimes, I lay down on the grass and watched people passing by. I once saw a dog walker walking ten dogs at the same time. I could not imagine how the dog walker managed to control so many dogs alone. After spending time in the park, I often visited a famous bagel shop near the park. It had more than 20 toppings. Among the toppings that I tried, bacon and cheese were my favorites. I enjoyed visiting museums such as the Met and MoMA. They had many famous works of art that I saw in art books. At the Met, there was a room full of paintings by Vincent van Gogh. I could not believe that I was looking at his works of art up close. In another room, I saw people copying Edgar Degas’ paintings. I also copied one of his paintings, Dancer. It was quite a special experience. Watching The Lion King on Broadway was the most unforgettable moment. When I saw the colorful stage, I felt like I was in the middle of an African jungle. The actors danced like real animals and sang in perfect harmony. In the last scene, the hero Simba showed his baby lion to the world, and tears rolled down my face. When I came out, huge, colorful signs were shining brightly. Since that day, I have never forgotten this amazing city."];var PASS_KO=["뉴욕시에서 한 달 살기", "지난여름 나는 뉴욕시의 사촌 집에서 한 달을 보냈다. 매일 나는 그 도시를 즐겼고, 나는 그것을 잊지 못할 경험이라고 불렀다. 뉴욕시는 고층 건물로 유명하지만, 아름다운 공원들도 있다. 내 사촌의 아파트가 센트럴 파크 근처에 있었기 때문에 나는 자주 거기에 갔다. 나는 무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다. 때때로 나는 잔디 위에 누워 사람들이 지나가는 것을 보았다. 한번은 도그 워커가 열 마리의 개를 동시에 산책시키는 것을 보았다. 나는 그 도그 워커가 어떻게 그렇게 많은 개를 혼자 통제하는지 상상할 수 없었다. 나는 공원에서 시간을 보낸 후에 공원 근처의 유명한 베이글 가게에 자주 갔다. 거기에는 20개가 넘는 토핑이 있었다. 내가 먹어 본 토핑 중에서, 베이컨과 치즈는 내가 가장 좋아하는 것이었다. 나는 Met과 MoMA 같은 박물관들에 가는 것을 즐겼다. 그것들은 내가 미술책에서 보았던 유명한 예술품들을 많이 소장했다. Met에는 Vincent van Gogh가 그린 그림들로 가득 찬 방이 있었다. 나는 내가 그의 작품들을 가까이에서 보고 있었다는 것을 믿을 수 없었다. 다른 방에서는 사람들이 Edgar Degas의 그림을 따라 그리고 있는 것을 보았다. 나도 그의 그림 중 하나인 <Dancer>를 따라 그렸다. 그것은 매우 특별한 경험이었다. 브로드웨이에서 <The Lion King>을 관람한 것은 가장 잊지 못할 순간이었다. 다채로운 무대를 보았을 때, 나는 마치 아프리카 정글 한가운데에 있는 것 같은 기분이 들었다. 배우들은 진짜 동물처럼 춤을 췄고 완벽한 조화를 이루어 노래를 불렀다. 마지막 장면에서 주인공 Simba가 자신의 새끼 사자를 세상에 보여 주었는데, 눈물이 내 얼굴을 타고 흘러내렸다. 내가 밖으로 나왔을 때 크고 화려한 광고판들이 밝게 빛나고 있었다. 그날 이후로 나는 이 멋진 도시를 결코 잊은 적이 없다."];var DG=[{"dlg": [["M", "How can I help you?", "무엇을 도와드릴까요?"], ["G", "Are these traditional Dutch dolls?", "이것들이 네덜란드 전통 인형인가요?"], ["M", "Yes, they are. They are popular items for tourists.", "네, 맞아요. 관광객들에게 인기 있는 물건이에요."], ["G", "Can I have that doll in the blue dress? How much is it?", "파란 드레스를 입은 저 인형을 살 수 있을까요? 얼마예요?"], ["M", "That’ll be 10 euros. Anything else I can help you with?", "10유로입니다. 더 도와드릴 것이 있나요?"], ["G", "Could you recommend a good restaurant around here?", "이 근처에 좋은 식당을 추천해 주실 수 있나요?"], ["M", "Sure. There’s a
