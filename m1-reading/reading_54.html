<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}

.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Every days, we produce lots of waste, and the Earth are getting sicker and sicker. Do you want to save the Earth?","ko":"매일 우리는 많은 쓰레기를 만들고, 지구는 점점 더 병들고 있습니다. 여러분은 지구를 구하고 싶나요?","ok":false,"foot":[],"fixes":[{"wrong":"days","right":"day","partial":false,"at":[1],"point":"명사의 단수형: every 뒤에는 단수명사 day 사용","topic":"명사의 단수형","memo":"every 뒤에는 단수명사 day 사용"},{"wrong":"are","right":"is","partial":false,"at":[10],"point":"be동사의 긍정문: 주어 the Earth(단수)에는 is 사용","topic":"be동사의 긍정문","memo":"주어 the Earth(단수)에는 is 사용"}]},{"n":2,"tag":null,"en":"Then, join the zero-waste challenge, and share you stories.","ko":"그렇다면 제로 웨이스트 챌린지에 동참하고 여러분의 이야기를 공유해 주세요.","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[7],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 your 사용"}]},{"n":3,"tag":"음식물 쓰레기 줄이기","en":"Olivia: My birthday was last Saturday, and my family and I eated out. There were lots of leftovers, but we brought them home.","ko":"Olivia: 내 생일은 지난 토요일이었고, 가족들과 나는 외식을 했어. 남은 음식이 많아서 우리는 그것들을 집으로 가져왔어.","ok":false,"foot":[],"fixes":[{"wrong":"eated","right":"ate","partial":false,"at":[11],"point":"불규칙 과거형: eat의 과거형은 ate (eated 아님)","topic":"불규칙 과거형","memo":"eat의 과거형은 ate (eated 아님)"}]},{"n":4,"tag":null,"en":"The next day, I maked a nice lunch out of them. FYI, you can find great cooking ideas for leftovers on the Internet.","ko":"그다음 날, 나는 그것들로 맛있는 점심을 만들었어. 참고로, 인터넷에서 남은 음식을 위한 멋진 요리 아이디어를 찾을 수 있어.","ok":false,"foot":[],"fixes":[{"wrong":"maked","right":"made","partial":false,"at":[4],"point":"불규칙 과거형: make의 과거형은 made (maked 아님)","topic":"불규칙 과거형","memo":"make의 과거형은 made (maked 아님)"}]},{"n":5,"tag":"재사용하기","en":"Domingo: My dog teared my bag. I wanted to buy a new one, but I thought again.","ko":"Domingo: 내 개가 내 가방을 찢었어. 나는 새것을 사고 싶었지만, 다시 생각해 봤어.","ok":false,"foot":[],"fixes":[{"wrong":"teared","right":"tore","partial":false,"at":[3],"point":"불규칙 과거형: tear의 과거형은 tore (teared 아님)","topic":"불규칙 과거형","memo":"tear의 과거형은 tore (teared 아님)"}]},{"n":6,"tag":null,"en":"I learned that reusing is importantly for zero-waste living. So, I decided to fix it and reuse it.","ko":"나는 재사용이 제로 웨이스트 생활에 중요하다고 배웠어. 그래서 나는 그것을 수선해서 재사용하기로 결심했어.","ok":false,"foot":[],"fixes":[{"wrong":"importantly","right":"important","partial":false,"at":[5],"point":"형용사와 부사: be동사 보어는 형용사 important 사용","topic":"형용사와 부사","memo":"be동사 보어는 형용사 important 사용"}]},{"n":7,"tag":null,"en":"I'm not very good in sewing, and I don't think that the bag looks perfectly. I guess it's all right.","ko":"나는 바느질을 아주 잘하지 못하고, 가방이 완벽해 보인다고 생각하진 않아. 그래도 괜찮은 것 같아.","ok":false,"foot":[],"fixes":[{"wrong":"in","right":"at","partial":false,"at":[4],"point":"기본전치사: '~을 잘하는'은 good at 사용","topic":"기본전치사","memo":"'~을 잘하는'은 good at 사용"},{"wrong":"perfectly","right":"perfect","partial":false,"at":[14],"point":"형용사와 부사: looks 뒤 보어는 형용사 perfect 사용","topic":"형용사와 부사","memo":"looks 뒤 보어는 형용사 perfect 사용"}]},{"n":8,"tag":null,"en":"Challenge 03 Say No to Single-Use Plastic","ko":"챌린지 03 일회용 플라스틱 사용을 반대하세요","ok":true,"foot":[],"fixes":[]},{"n":9,"tag":null,"en":"Emma: I often uses food delivery services, but today I didn't.","ko":"Emma: 나는 종종 음식 배달 서비스를 이용하는데, 오늘은 이용하지 않았어.","ok":false,"foot":[],"fixes":[{"wrong":"uses","right":"use","partial":false,"at":[3],"point":"일반동사의 현재형: 주어 I에는 use 사용","topic":"일반동사의 현재형","memo":"주어 I에는 use 사용"}]},{"n":10,"tag":null,"en":"Instead, I walked to me favorite restaurant with an reusable container and picked up the food.","ko":"대신, 재사용할 수 있는 용기를 가지고 내가 가장 좋아하는 식당에 걸어가서 음식을 가져왔어.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"my","partial":false,"at":[4],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 my 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 my 사용"},{"wrong":"an","right":"a","partial":false,"at":[8],"point":"관사 a/an: 자음 소리 reusable 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 reusable 앞에는 a 사용"}]},{"n":11,"tag":null,"en":"I heard that plastic never go away completely. I didn't use many single-use plastic today.","ko":"플라스틱은 절대로 완전히 없어지지 않는다고 들었어. 나는 오늘 어떤 일회용 플라스틱도 사용하지 않았어.","ok":false,"foot":[],"fixes":[{"wrong":"go","right":"goes","partial":false,"at":[5],"point":"3인칭 단수 현재형: 주어 plastic은 단수: goes (go 아님)","topic":"3인칭 단수 현재형","memo":"주어 plastic은 단수: goes (go 아님)"},{"wrong":"many","right":"any","partial":false,"at":[11],"point":"수량 형용사 any/many: 셀 수 없는 plastic 앞에는 any 사용","topic":"수량 형용사 any/many","memo":"셀 수 없는 plastic 앞에는 any 사용"}]},{"n":12,"tag":null,"en":"I felt good!","ko":"기분이 좋았어!","ok":true,"foot":[],"fixes":[]},{"n":13,"tag":"재활용하기","en":"Minsu: Yesterday, I took some plastic and glass bottles to an recycling machine near my house.","ko":"민수: 어제 나는 플라스틱과 유리병 몇 개를 집 근처에 있는 재활용 기계에 가져갔어.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[10],"point":"관사 a/an: 자음 소리 recycling 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 recycling 앞에는 a 사용"}]},{"n":14,"tag":null,"en":"I put them into the machine one by one, and I got some points in return. Who can I do with those points?","ko":"나는 그것들을 하나씩 기계에 집어넣었고, 대가로 포인트를 받았어. 그 포인트로 무엇을 할 수 있냐고?","ok":false,"foot":[],"fixes":[{"wrong":"Who","right":"What","partial":false,"at":[16],"point":"의문사: '무엇'을 묻는 What 사용 (Who 아님)","topic":"의문사","memo":"'무엇'을 묻는 What 사용 (Who 아님)"}]},{"n":15,"tag":null,"en":"Well, I can use them like moneys. Don't you think that's cool?","ko":"음, 나는 그것들을 돈처럼 사용할 수 있어. 멋지다고 생각하지 않니?","ok":false,"foot":[],"fixes":[{"wrong":"moneys","right":"money","partial":false,"at":[6],"point":"셀 수 없는 명사: money는 셀 수 없는 명사라 -s 안 붙임","topic":"셀 수 없는 명사","memo":"money는 셀 수 없는 명사라 -s 안 붙임"}]}];var PP=[["Every day, we produce lots of waste, and the Earth is getting sicker and sicker.","매일 우리는 많은 쓰레기를 만들고, 지구는 점점 더 병들고 있습니다.",1],["Do you want to save the Earth?","여러분은 지구를 구하고 싶나요?",0],["Then, join the zero-waste challenge, and share your stories.","그렇다면 제로 웨이스트 챌린지에 동참하고 여러분의 이야기를 공유해 주세요.",0],["Challenge 01 Reduce Food Waste","챌린지 01 음식물 쓰레기를 줄이세요",1],["Olivia: My birthday was last Saturday, and my family and I ate out.","Olivia: 내 생일은 지난 토요일이었고, 가족들과 나는 외식을 했어.",1],["There were lots of leftovers, but we brought them home.","남은 음식이 많아서 우리는 그것들을 집으로 가져왔어.",0],["The next day, I made a nice lunch out of them.","그다음 날, 나는 그것들로 맛있는 점심을 만들었어.",0],["FYI, you can find great cooking ideas for leftovers on the Internet.","참고로, 인터넷에서 남은 음식을 위한 멋진 요리 아이디어를 찾을 수 있어.",0],["Challenge 02 Reuse","챌린지 02 재사용하세요",1],["Domingo: My dog tore my bag.","Domingo: 내 개가 내 가방을 찢었어.",1],["I wanted to buy a new one, but I thought again.","나는 새것을 사고 싶었지만, 다시 생각해 봤어.",0],["I learned that reusing is important for zero-waste living.","나는 재사용이 제로 웨이스트 생활에 중요하다고 배웠어.",0],["So, I decided to fix it and reuse it.","그래서 나는 그것을 수선해서 재사용하기로 결심했어.",0],["I'm not very good at sewing, and I don't think that the bag looks perfect.","나는 바느질을 아주 잘하지 못하고, 가방이 완벽해 보인다고 생각하진 않아.",0],["I guess it's all right.","그래도 괜찮은 것 같아.",0],["Challenge 03 Say No to Single-Use Plastic","챌린지 03 일회용 플라스틱 사용을 반대하세요",1],["Emma: I often use food delivery services, but today I didn't.","Emma: 나는 종종 음식 배달 서비스를 이용하는데, 오늘은 이용하지 않았어.",1],["Instead, I walked to my favorite restaurant with a reusable container and picked up the food.","대신, 재사용할 수 있는 용기를 가지고 내가 가장 좋아하는 식당에 걸어가서 음식을 가져왔어.",0],["I heard that plastic never goes away completely.","플라스틱은 절대로 완전히 없어지지 않는다고 들었어.",0],["I didn't use any single-use plastic today.","나는 오늘 어떤 일회용 플라스틱도 사용하지 않았어.",0],["I felt good!","기분이 좋았어!",0],["Challenge 04 Recycle","챌린지 04 재활용하세요",1],["Minsu: Yesterday, I took some plastic and glass bottles to a recycling machine near my house.","민수: 어제 나는 플라스틱과 유리병 몇 개를 집 근처에 있는 재활용 기계에 가져갔어.",1],["I put them into the machine one by one, and I got some points in return.","나는 그것들을 하나씩 기계에 집어넣었고, 대가로 포인트를 받았어.",0],["What can I do with those points?","그 포인트로 무엇을 할 수 있냐고?",0],["Well, I can use them like money.","음, 나는 그것들을 돈처럼 사용할 수 있어.",0],["Don't you think that's cool?","멋지다고 생각하지 않니?",0]];var RNUM=54;var TITLE_EN="Join the Zero-Waste Challenge";var PASS_EN=["Join the Zero-Waste Challenge","Every day, we produce lots of waste, and the Earth is getting sicker and sicker. Do you want to save the Earth? Then, join the zero-waste challenge, and share your stories.","Challenge 01 Reduce Food Waste","Olivia: My birthday was last Saturday, and my family and I ate out. There were lots of leftovers, but we brought them home. The next day, I made a nice lunch out of them. FYI, you can find great cooking ideas for leftovers on the Internet.","Challenge 02 Reuse","Domingo: My dog tore my bag. I wanted to buy a new one, but I thought again. I learned that reusing is important for zero-waste living. So, I decided to fix it and reuse it. I'm not very good at sewing, and I don't think that the bag looks perfect. I guess it's all right.","Challenge 03 Say No to Single-Use Plastic","Emma: I often use food delivery services, but today I didn't. Instead, I walked to my favorite restaurant with a reusable container and picked up the food. I heard that plastic never goes away completely. I didn't use any single-use plastic today. I felt good!","Challenge 04 Recycle","Minsu: Yesterday, I took some plastic and glass bottles to a recycling machine near my house. I put them into the machine one by one, and I got some points in return. What can I do with those points? Well, I can use them like money. Don't you think that's cool?"];var PASS_KO=["제로 웨이스트 챌린지에 동참하세요","매일 우리는 많은 쓰레기를 만들고, 지구는 점점 더 병들고 있습니다. 여러분은 지구를 구하고 싶나요? 그렇다면 제로 웨이스트 챌린지에 동참하고 여러분의 이야기를 공유해 주세요.","챌린지 01 음식물 쓰레기를 줄이세요","Olivia: 내 생일은 지난 토요일이었고, 가족들과 나는 외식을 했어. 남은 음식이 많아서 우리는 그것들을 집으로 가져왔어. 그다음 날, 나는 그것들로 맛있는 점심을 만들었어. 참고로, 인터넷에서 남은 음식을 위한 멋진 요리 아이디어를 찾을 수 있어.","챌린지 02 재사용하세요","Domingo: 내 개가 내 가방을 찢었어. 나는 새것을 사고 싶었지만, 다시 생각해 봤어. 나는 재사용이 제로 웨이스트 생활에 중요하다고 배웠어. 그래서 나는 그것을 수선해서 재사용하기로 결심했어. 나는 바느질을 아주 잘하지 못하고, 가방이 완벽해 보인다고 생각하진 않아. 그래도 괜찮은 것 같아.","챌린지 03 일회용 플라스틱 사용을 반대하세요","Emma: 나는 종종 음식 배달 서비스를 이용하는데, 오늘은 이용하지 않았어. 대신, 재사용할 수 있는 용기를 가지고 내가 가장 좋아하는 식당에 걸어가서 음식을 가져왔어. 플라스틱은 절대로 완전히 없어지지 않는다고 들었어. 나는 오늘 어떤 일회용 플라스틱도 사용하지 않았어. 기분이 좋았어!","챌린지 04 재활용하세요","민수: 어제 나는 플라스틱과 유리병 몇 개를 집 근처에 있는 재활용 기계에 가져갔어. 나는 그것들을 하나씩 기계에 집어넣었고, 대가로 포인트를 받았어. 그 포인트로 무엇을 할 수 있냐고? 음, 나는 그것들을 돈처럼 사용할 수 있어. 멋지다고 생각하지 않니?"];var DG=[{"qs":[{"n":1,"q":"What can't the girl use inside the café?","o":["glass cups","plastic straws","reusable cups","portable tumblers","single-use plastic cups"],"a":4,"ans":"single-use plastic cups","evs":[["M: I’m sorry, but we don’t use single-use plastic cups inside the café.","죄송하지만, 저희는 카페 안에서는 일회용 플라스틱 컵을 사용하지 않아요."],["G: Oh, I see.","아, 알겠어요."]],"ev":["M: I’m sorry, but we don’t use single-use plastic cups inside the café.","죄송하지만, 저희는 카페 안에서는 일회용 플라스틱 컵을 사용하지 않아요."],"ow":["오답 ✕ — 점원은 일회용 플라스틱 컵만 안 된다고 했고, 여자가 'not in a glass'(유리잔 말고)라고 했으므로 유리잔은 카페 안에서 문제없이 쓸 수 있어서 틀림.","오답 ✕ — 대화에 플라스틱 빨대 이야기는 나오지 않음. 점원이 쓰지 않는다고 한 것은 'single-use plastic cups'(일회용 플라스틱 컵)라서 틀림.","오답 ✕ — 대화에 다회용 컵이 안 된다는 말은 없음. 안 된다고 한 것은 일회용 컵이라서 틀림.","오답 ✕ — 휴대용 텀블러에 대한 언급은 대화에 없음. 점원이 막은 것은 'single-use plastic cups'(일회용 플라스틱 컵)라서 틀림.","정답 ○ — 점원이 'we don’t use single-use plastic cups inside the café'(저희는 카페 안에서는 일회용 플라스틱 컵을 사용하지 않아요)라고 했으므로 여자가 카페 안에서 쓸 수 없는 것은 일회용 플라스틱 컵임."],"memo":["정답 ⑤: single-use plastic cups(일회용 플라스틱 컵)","근거: we don’t use single-use plastic cups inside the café(저희는 카페 안에서는 일회용 플라스틱 컵을 사용하지 않아요)","함정: ①은 여자가 'not in a glass'라고 한 것이지 유리잔을 못 쓴다는 말이 아니라서 ✕"],"why":"카페 안에서는 일회용 플라스틱 컵을 쓸 수 없다."}],"dlg":[["M","For here or to go?","여기서 드실 건가요, 가져가실 건가요?"],["G","For here, please. And can you please put my smoothie in a plastic cup, not in a glass?","여기서 먹을게요. 그리고 제 스무디를 유리잔 말고 플라스틱 컵에 담아 주시겠어요?"],["M","I’m sorry, but we don’t use single-use plastic cups inside the café.","죄송하지만, 저희는 카페 안에서는 일회용 플라스틱 컵을 사용하지 않아요."],["G","Oh, I see.","아, 알겠어요."]]},{"qs":[{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["유나는 플로깅을 하고 있다.","Alex는 플로깅의 의미를 모른다.","유나의 동아리는 토요일 아침에 모인다.","Alex는 유나의 동아리에 가입하기로 한다.","유나가 들고 있는 쓰레기봉투는 무겁다."],"a":3,"ans":"Alex는 유나의 동아리에 가입하기로 한다.","evs":[["G: Yes. We plog together every Saturday morning from 10 to 12. Interested?","응. 우리는 매주 토요일 아침 10시부터 12시까지 함께 플로깅을 해. 관심 있어?"],["B: Well, I’ll think about it.","글쎄, 생각해 볼게."]],"ev":["G: Yes. We plog together every Saturday morning from 10 to 12. Interested?","응. 우리는 매주 토요일 아침 10시부터 12시까지 함께 플로깅을 해. 관심 있어?"],"ow":["오답 ✕ — 유나가 'I’m plogging with my club members.'(나는 동아리 친구들과 플로깅을 하고 있어.)라고 했으므로 유나가 플로깅을 하고 있다는 보기는 일치함.","오답 ✕ — Alex가 'Excuse me?'(뭐라고?)라고 되물었으므로 플로깅의 뜻을 몰랐던 것이 맞아서 일치함.","오답 ✕ — 유나가 'We plog together every Saturday morning from 10 to 12.'(우리는 매주 토요일 아침 10시부터 12시까지 함께 플로깅을 해.)라고 했으므로 일치함.","정답 ○ — Alex는 'Well, I’ll think about it.'(글쎄, 생각해 볼게.)이라고만 했고 가입하겠다고 하지 않았으므로, 가입하기로 했다는 보기는 일치하지 않음.","오답 ✕ — 유나가 'can you please help me with this trash bag? It’s heavy.'(이 쓰레기봉투 드는 것 좀 도와줄래? 무거워.)라고 했으므로 봉투가 무겁다는 보기는 일치함."],"memo":["정답 ④ (일치하지 않는 것): Alex는 동아리 가입을 결정하지 않았다(생각해 보겠다고만 함).","근거: Well, I’ll think about it.(글쎄, 생각해 볼게.)","함정: '일치하지 않는 것'이라 나머지 4개는 맞는 말 → ✕"],"why":"Alex는 가입한다고 하지 않고 생각해 본다고만 했다."},{"n":3,"q":"What will Alex do after the conversation?","o":["He will go jogging.","He will go plogging.","He will pick up trash around him.","He will take out Yuna's trash bag.","He will help Yuna with the trash bag."],"a":4,"ans":"He will help Yuna with the trash bag.","evs":[["G: OK. By the way, can you please help me with this trash bag? It’s heavy.","알겠어. 그런데 이 쓰레기봉투 드는 것 좀 도와줄래? 무거워."],["B: Sure. No problem.","물론이지. 문제없어."]],"ev":["G: OK. By the way, can you please help me with this trash bag? It’s heavy.","알겠어. 그런데 이 쓰레기봉투 드는 것 좀 도와줄래? 무거워."],"ow":["오답 ✕ — 조깅은 'Plogging. It means jogging and picking up trash at the same time.'(플로깅은 조깅하면서 쓰레기를 줍는 것)이라는 설명에만 나오고, Alex가 조깅하러 간다는 말은 없어서 틀림.","오답 ✕ — Alex는 'Well, I’ll think about it.'(글쎄, 생각해 볼게.)이라고만 했으므로 플로깅을 하러 가겠다고 한 것이 아니라서 틀림.","오답 ✕ — 쓰레기를 줍는다는 말은 플로깅의 뜻 설명일 뿐 Alex의 계획이 아니라서 틀림. Alex는 유나의 부탁에 'Sure. No problem.'(물론이지. 문제없어.)이라고 했음.","오답 ✕ — 유나가 부탁한 것은 쓰레기봉투를 '버리는 것'이 아니라 'help me with this trash bag'(쓰레기봉투 드는 것 좀 도와줘)이라서 틀림.","정답 ○ — 유나가 'can you please help me with this trash bag?'(이 쓰레기봉투 드는 것 좀 도와줄래?)라고 부탁하자 Alex가 'Sure. No problem.'(물론이지. 문제없어.)이라고 했으므로 봉투 드는 것을 도울 것임."],"memo":["정답 ⑤: Alex는 유나의 쓰레기봉투를 도와줄 것이다.","근거: can you please help me with this trash bag?(이 쓰레기봉투 드는 것 좀 도와줄래?) / Sure. No problem.(물론이지.)","함정: ②는 Alex가 'I’ll think about it'(생각해 볼게)이라고만 해서 ✕"],"why":"유나의 부탁에 Alex가 도와주겠다고 대답했다."}],"dlg":[["B","Hi, Yuna. What are you doing here?","안녕, 유나야. 여기서 뭐 하고 있어?"],["G","Hi, Alex. I’m plogging with my club members.","안녕, Alex. 나는 동아리 친구들과 플로깅을 하고 있어."],["B","Excuse me?","뭐라고?"],["G","Plogging. It means jogging and picking up trash at the same time.","플로깅. 그건 조깅하면서 동시에 쓰레기를 줍는 것을 뜻해."],["B","Sounds cool! So you’re a member of a plogging club.","멋지다! 그럼 너는 플로깅 동아리 회원이구나."],["G","Yes. We plog together every Saturday morning from 10 to 12. Interested?","응. 우리는 매주 토요일 아침 10시부터 12시까지 함께 플로깅을 해. 관심 있어?"],["B","Well, I’ll think about it.","글쎄, 생각해 볼게."],["G","OK. By the way, can you please help me with this trash bag? It’s heavy.","알겠어. 그런데 이 쓰레기봉투 드는 것 좀 도와줄래? 무거워."],["B","Sure. No problem.","물론이지. 문제없어."]]},{"qs":[{"n":4,"q":"위 대화에서 아빠가 가방을 고쳐 주기로 한 때는?","o":["지금 바로","저녁 식사를 한 직후","내일 아침","다음 주말","소녀가 돌아온 후"],"a":1,"ans":"저녁 식사를 한 직후","evs":[["M: Now? I’m cooking dinner.","지금? 아빠는 저녁을 만들고 있는데."],["M: I’ll do it right after dinner.","저녁 식사 바로 후에 해 줄게."]],"ev":["M: Now? I’m cooking dinner.","지금? 아빠는 저녁을 만들고 있는데."],"ow":["오답 ✕ — 소녀가 가방을 고쳐 달라고 하자 아빠는 'Now? I’m cooking dinner.'(지금? 아빠는 저녁을 만들고 있는데.)라고 했으므로 지금 바로 고쳐 주는 것이 아니라서 틀림.","정답 ○ — 아빠가 'I’ll do it right after dinner.'(저녁 식사 바로 후에 해 줄게.)라고 했으므로 저녁 식사를 한 직후가 맞음.","오답 ✕ — 내일 아침이라는 말은 대화에 없음. 아빠는 'right after dinner'(저녁 식사 바로 후)라고 했으므로 틀림.","오답 ✕ — 다음 주말이라는 말은 대화에 없음. 가장 가까운 문장인 'I’ll do it right after dinner.'(저녁 식사 바로 후에 해 줄게.)와 달라서 틀림.","오답 ✕ — 소녀가 돌아온 뒤라는 말은 대화에 없음. 아빠는 저녁 식사 후라고 했으므로 틀림."],"memo":["정답 ②: 저녁 식사를 한 직후","근거: I’ll do it right after dinner.(저녁 식사 바로 후에 해 줄게.)","함정: ①은 아빠가 지금은 저녁을 만들고 있어서(Now? I’m cooking dinner.) ✕"],"why":"지금은 저녁을 만드는 중이라 식사 직후에 고쳐 주겠다고 했다."}],"dlg":[["G","Dad, can you please fix my bag?","아빠, 제 가방 좀 고쳐 주실 수 있어요?"],["M","Now? I’m cooking dinner.","지금? 아빠는 저녁을 만들고 있는데."],["G","Oh, I see. Then, when can you fix it?","아, 알겠어요. 그럼 언제 고쳐 주실 수 있어요?"],["M","I’ll do it right after dinner.","저녁 식사 바로 후에 해 줄게."]]},{"qs":[{"n":5,"q":"위 대화에서 소녀가 소년에게 부탁한 것은?","o":["식당에 가서 음식을 가져오는 것","집에서 요리를 해 주는 것","같이 외식하러 가는 것","마트에서 음식 재료를 사 오는 것","배달 앱으로 음식을 주문하는 것"],"a":0,"ans":"식당에 가서 음식을 가져오는 것","evs":[["G: I’m sorry, but I don’t want to go out now. Can you please go to a restaurant and pick up some food?","미안한데, 나는 지금 나가고 싶지 않아. 식당에 가서 음식을 좀 가져와 줄래?"],["B: Sure. No problem.","물론이지. 문제없어."]],"ev":["G: I’m sorry, but I don’t want to go out now. Can you please go to a restaurant and pick up some food?","미안한데, 나는 지금 나가고 싶지 않아. 식당에 가서 음식을 좀 가져와 줄래?"],"ow":["정답 ○ — 소녀가 'Can you please go to a restaurant and pick up some food?'(식당에 가서 음식을 좀 가져와 줄래?)라고 했으므로 맞음.","오답 ✕ — 요리를 해 달라는 말은 없음. 소녀는 'pick up some food'(음식을 가져와 줘)라고 했으므로 틀림.","오답 ✕ — 외식하자고 한 사람은 소년('Let’s eat out.')이고, 소녀는 'I don’t want to go out now.'(지금은 나가고 싶지 않아.)라며 거절했으므로 틀림.","오답 ✕ — 'there’s no food at home'(집에 음식이 없어)이라고 했지만 재료를 사 오라고 부탁한 것은 아니고 식당 음식을 가져와 달라고 했으므로 틀림.","오답 ✕ — 배달 앱 이야기는 대화에 전혀 나오지 않음. 소녀는 'go to a restaurant'(식당에 가서)라고 직접 가져오라고 했으므로 틀림."],"memo":["정답 ①: 식당에 가서 음식을 가져오는 것","근거: Can you please go to a restaurant and pick up some food?(식당에 가서 음식을 좀 가져와 줄래?)","함정: ③은 외식하자고 한 사람이 소년이고 소녀는 나가기 싫다고 해서 ✕"],"why":"나가기 싫은 소녀가 소년에게 식당 음식을 가져와 달라고 부탁했다."}],"dlg":[["G","I’m so hungry, but there’s no food at home.","나 너무 배고픈데 집에 음식이 없어."],["B","I know. Let’s eat out.","그러게. 외식하자."],["G","I’m sorry, but I don’t want to go out now. Can you please go to a restaurant and pick up some food?","미안한데, 나는 지금 나가고 싶지 않아. 식당에 가서 음식을 좀 가져와 줄래?"],["B","Sure. No problem.","물론이지. 문제없어."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 앞부분에서 글쓴이가 독자에게 하라고 한 것은?","o":["음식을 더 많이 만들어 먹기","제로 웨이스트 챌린지에 참여하고 이야기를 공유하기","새 물건을
