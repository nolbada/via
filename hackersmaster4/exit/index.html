학생들은 사회적 [B]에 빠질 수 있다.","bank":["efficiency","isolation","assumption","excessive","accordingly","crucial"],"bko":{"efficiency":"효율성","isolation":"고립","assumption":"생각, 가정","excessive":"과도한","accordingly":"그에 따라","crucial":"중요한"},"r":{"a":"[A] efficiency, [B] isolation","ev":"5번 문장","s":[[5,"While high tech prioritizes efficiency through the use of digital platforms that provide easy and instant access to information, an excessive reliance on devices may result in social isolation and decreased engagement for students.","하이테크는 정보에 쉽고 즉각적인 접근을 제공하는 디지털 플랫폼의 사용을 통해 효율성을 우선시하지만, 기기에 대한 과도한 의존은 학생들에게 사회적 고립과 참여도 감소를 초래할 수 있다."]],"w":"5번 문장의 'prioritizes efficiency'와 'social isolation'에서 가져왔어요. 나머지 단어는 명사 자리에 어울리지 않거나 뜻이 맞지 않아요.","c":null},"h":"b261ca822f"}]},{"u":5,"id":"ms4-05-4","no":4,"ko":"From Runway to Ruin","items":[{"n":1,"t":"tf","q":"Models in the Atacama Desert fashion show wear brand-new clothes made in Chile.","ko":"아타카마 사막 패션쇼의 모델들은 칠레에서 만든 새 옷을 입는다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Models wearing discarded clothes from Europe, Asia, and North America parade through piles of trash.","유럽, 아시아, 북미에서 버려진 옷을 입은 모델들이 쓰레기 더미 사이를 행진한다."]],"w":"2번 문장에서 모델들은 유럽, 아시아, 북미에서 버려진 옷(discarded clothes)을 입고 쓰레기 더미 사이를 행진해요.","c":"F"},"h":"f39e420bcf"},{"n":2,"t":"tf","q":"Estimates say that about 39,000 tons of clothing are added to the desert every year.","ko":"추정치에 따르면 매년 약 39,000톤의 의류가 사막에 추가된다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"However, estimates suggest that around 39,000 tons are added annually, forming rubbish mounds so massive that they can be seen from space.","그러나 추정치에 따르면 매년 약 39,000톤이 추가되어, 우주에서도 볼 수 있을 만큼 거대한 쓰레기 언덕을 형성한다고 한다."]],"w":"5번 문장에서 추정치로는 매년 약 39,000톤이 추가된다(around 39,000 tons are added annually)고 해요.","c":"T"},"h":"f7d5449ee9"},{"n":3,"t":"tf","q":"The Chilean government’s efforts will stop similar sites from appearing around the world.","ko":"칠레 정부의 노력은 전 세계에 비슷한 장소가 생기는 것을 막을 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Although the Chilean government is taking steps to clean up the Atacama Desert, its efforts will have no impact on similar sites sprouting up around the planet.","비록 칠레 정부가 아타카마 사막을 정화하기 위한 조치를 취하고 있지만, 그 노력은 지구 곳곳에 생겨나고 있는 유사한 장소들에는 아무런 영향을 미치지 못할 것이다."]],"w":"12번 문장에서 정부의 노력은 지구 곳곳에 생겨나는 비슷한 장소에는 아무런 영향을 미치지 못할 것(will have no impact)이라고 해요.","c":"F"},"h":"e903a631cf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (..., illegally dumped in the desert when they cannot be resold.)","ko":"... 다시 팔리지 않으면 사막에 불법으로 투기된다.","opts":["수출된","투기된, 버려진","판매된","보관된"],"word":"dumped","r":{"a":"2) 투기된, 버려진","ev":"7번 문장","s":[[7,"Out-of-style garments are imported into Chile and then illegally dumped in the desert when they cannot be resold.","유행이 지난 의류들은 칠레로 수입된 후 다시 팔리지 않으면 사막에 불법으로 투기된다."]],"w":"옷이 다시 팔릴 수 없을 때 사막에 불법으로 처리되는 상황이에요. dump = 버리다, dumped = 버려진, 투기된.","c":2},"h":"b9905106f4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Toxic chemicals from polyester and other synthetic materials seep into the soil and groundwater.)","ko":"폴리에스터와 다른 합성 소재에서 나온 독성 화학 물질이 토양과 지하수로 스며든다.","opts":["스며든다","증발한다","쌓인다","얼어붙는다"],"word":"seep","r":{"a":"1) 스며든다","ev":"9번 문장","s":[[9,"Toxic chemicals from polyester and other synthetic materials seep into the soil and groundwater.","폴리에스터와 다른 합성 소재에서 나온 독성 화학 물질이 토양과 지하수로 스며든다."]],"w":"독성 화학 물질이 토양과 지하수 속으로 'seep into', 즉 서서히 흘러 들어가는 뜻이에요. seep = 스며들다.","c":1},"h":"8389a67bc8"},{"n":6,"t":"ref","q":"What does the underlined \"those\" refer to?\nMuch of the waste is the unsold inventory of major clothing retailers, especially those driving fast-fashion trends.","ko":"밑줄 친 those가 가리키는 것은?","sko":"폐기물의 대부분은 주요 의류 소매업체, 특히 패스트패션 트렌드를 주도하는 업체들의 팔리지 않은 재고이다.","opts":["패스트패션을 사는 소비자들","팔리지 않은 재고","의류 소매업체들","사막 지역 주민들"],"r":{"a":"3) 의류 소매업체들","ev":"6번 문장","s":[[6,"Much of the waste is the unsold inventory of major clothing retailers, especially those driving fast-fashion trends.","폐기물의 대부분은 주요 의류 소매업체, 특히 패스트패션 트렌드를 주도하는 업체들의 팔리지 않은 재고이다."]],"w":"those driving fast-fashion trends는 '패스트패션 트렌드를 이끄는 업체들'이에요. 바로 앞의 복수 명사 clothing retailers(의류 소매업체들)를 가리켜요.","c":3},"h":"2bdfd2e8a9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Making matters worse, the discarded clothing sometimes catches fire accidentally or is burned intentionally in an attempt to get rid of it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"설상가상으로, 버려진 옷들은 때때로 우연히 불이 붙거나 그것을 제거하려는 시도로 의도적으로 태워지기도 한다.","opts":["버려진 옷은 모두 의도적으로 태워져서 재활용된다.","버려진 옷은 소방관들이 일부러 불을 꺼서 치워진다.","다행히도 버려진 옷은 불에 타지 않아 오염 물질이 나오지 않는다.","설상가상으로 버려진 옷은 가끔 우연히 불이 붙거나, 없애려고 일부러 태워지기도 한다."],"r":{"a":"4) 설상가상으로 버려진 옷은 가끔 우연히 불이 붙거나, 없애려고 일부러 태워지기도 한다.","ev":"10번 문장","s":[[10,"Making matters worse, the discarded clothing sometimes catches fire accidentally or is burned intentionally in an attempt to get rid of it.","설상가상으로, 버려진 옷들은 때때로 우연히 불이 붙거나 그것을 제거하려는 시도로 의도적으로 태워지기도 한다."]],"w":"Making matters worse는 '설상가상으로', accidentally는 '우연히', intentionally는 '의도적으로'예요. 불이 붙는 경우와 일부러 태우는 경우 둘 다 나쁜 일로 이어지고 재활용과는 관련이 없어요.","c":4},"h":"77ea6a9b21"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["패션쇼는 재활용 소재로 만든 옷을 팔려는 목적이다.","사막에 버려진 의류의 정확한 양은 알려져 있다.","버려진 옷을 태우면 주민들의 건강에 해로운 오염 물질이 나온다.","패스트패션 소매업체는 팔리지 않은 옷을 모두 모아 다시 쓴다."],"opts":["The fashion show aims to sell clothes made from recycled materials.","The exact amount of clothing dumped in the desert is known.","Burning the discarded clothing releases pollutants that harm residents’ health.","Fast-fashion retailers collect all unsold clothes and reuse them."],"r":{"a":"3) Burning the discarded clothing releases pollutants that harm residents’ health.","ev":"10~11번 문장","s":[[10,"Making matters worse, the discarded clothing sometimes catches fire accidentally or is burned intentionally in an attempt to get rid of it.","설상가상으로, 버려진 옷들은 때때로 우연히 불이 붙거나 그것을 제거하려는 시도로 의도적으로 태워지기도 한다."],[11,"In either case, large amounts of pollutants are released into the atmosphere, causing respiratory illnesses and other health problems for area residents.","어느 경우든, 다량의 오염 물질이 대기로 방출되어 지역 주민들에게 호흡기 질환과 기타 건강 문제를 일으킨다."]],"w":"10~11번 문장에서 옷이 타면 오염 물질이 대기로 나와 주민들에게 호흡기 질환과 건강 문제를 일으킨다고 해요. 패션쇼의 목적은 인식을 높이는 것이고(3번), 정확한 양은 알 수 없고(4번), 팔리지 않은 재고는 사막에 버려져요(6~7번).","c":3},"h":"e09f579f35"},{"n":9,"t":"sum","q":"Unwanted fast-fashion clothing is (A) in the Atacama Desert, and the writer says that (B) must stop buying short-lived fashion.","ko":"원치 않는 패스트패션 옷은 아타카마 사막에 (A)되고, 필자는 (B)가 수명이 짧은 패션 구매를 멈춰야 한다고 말한다.","oko":["(A) 팔린다 / (B) 소비자","(A) 정화된다 / (B) 정부","(A) 버려진다 / (B) 모델","(A) 정화된다 / (B) 소매업체","(A) 버려진다 / (B) 소비자"],"opts":["(A) sold / (B) consumers","(A) cleaned / (B) governments","(A) dumped / (B) models","(A) cleaned / (B) retailers","(A) dumped / (B) consumers"],"r":{"a":"5) (A) dumped / (B) consumers","ev":"7·13번 문장","s":[[7,"Out-of-style garments are imported into Chile and then illegally dumped in the desert when they cannot be resold.","유행이 지난 의류들은 칠레로 수입된 후 다시 팔리지 않으면 사막에 불법으로 투기된다."],[13,"The only real solution is for consumers to cease consumption of short-lived fashion and pressure the clothing industry into adopting sustainable business practices.","유일한 진정한 해결책은 소비자들이 수명이 짧은 패션의 소비를 중단하고 의류 산업이 지속 가능한 사업 관행을 채택하도록 압력을 가하는 것이다."]],"w":"7번 문장에서 팔리지 않는 옷이 사막에 버려지고(dumped), 13번에서 소비자들이 수명이 짧은 패션의 소비를 중단해야 한다고 해요.","c":5},"h":"af9915a3ed"},{"n":10,"t":"fill","q":"Toxic chemicals from synthetic clothes [A] into the soil and groundwater, and the burning causes [B] illnesses in local residents.","ko":"합성 소재 옷의 독성 화학 물질은 토양과 지하수로 [A], 옷을 태우면 주민들에게 [B] 질환이 생긴다.","bank":["seep","respiratory","parade","barren","annually","resold"],"bko":{"seep":"스며들다","respiratory":"호흡기의","parade":"행진하다","barren":"황량한","annually":"매년","resold":"다시 팔린"},"r":{"a":"[A] seep, [B] respiratory","ev":"9·11번 문장","s":[[9,"Toxic chemicals from polyester and other synthetic materials seep into the soil and groundwater.","폴리에스터와 다른 합성 소재에서 나온 독성 화학 물질이 토양과 지하수로 스며든다."],[11,"In either case, large amounts of pollutants are released into the atmosphere, causing respiratory illnesses and other health problems for area residents.","어느 경우든, 다량의 오염 물질이 대기로 방출되어 지역 주민들에게 호흡기 질환과 기타 건강 문제를 일으킨다."]],"w":"9번의 'seep into the soil and groundwater'와 11번의 'respiratory illnesses'에서 가져왔어요. parade·barren·annually·resold는 문장의 뜻과 어울리지 않아요.","c":null},"h":"79ab3378ff"}]},{"u":6,"id":"ms4-06-1","no":1,"ko":"멈출 수 없는 춤의 저주","items":[{"n":1,"t":"tf","q":"Frau Troffea started dancing in Strasbourg in 1518.","ko":"Frau Troffea는 1518년에 스트라스부르에서 춤을 추기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In 1518, a woman named Frau Troffea abruptly started dancing in Strasbourg, a city in modern-day France.","1518년, Frau Troffea라는 이름의 한 여성이 현대 프랑스의 도시인 스트라스부르에서 갑자기 춤을 추기 시작했다."]],"w":"3번 문장에 In 1518, a woman named Frau Troffea abruptly started dancing in Strasbourg가 그대로 나와요.","c":"T"},"h":"b68ede94f5"},{"n":2,"t":"tf","q":"Doctors prescribed rest to cure the dancing plague.","ko":"의사들은 춤추는 전염병을 고치려고 휴식을 처방했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"To expel the contaminated substance, doctors prescribed a treatment they believed would be effective: more movement.","오염된 물질을 배출하기 위해, 의사들은 효과적이라 믿었던 치료법을 처방했는데, 바로 더 많은 움직임이었다."]],"w":"7번 문장에서 처방한 치료법은 휴식이 아니라 more movement(더 많은 움직임)예요. 오염된 피를 내보내려고 오히려 더 움직이게 했어요.","c":"F"},"h":"3f998347fd"},{"n":3,"t":"tf","q":"Today, stress is regarded as the most probable cause of the outbreak.","ko":"오늘날 스트레스가 발병의 가장 유력한 원인으로 여겨진다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Today, overwhelming stress is regarded as the most probable cause for the outbreak, as Europeans at the time faced starvation from famine, flooding, multiple contagious diseases, and the constant threat of war.","오늘날, 압도적인 스트레스가 그 발병의 가장 유력한 원인으로 간주되는데, 당시 유럽인들은 기근으로 인한 굶주림, 홍수, 다수의 전염병, 그리고 끊임없는 전쟁의 위협에 직면해 있었기 때문이다."]],"w":"10번 문장에서 overwhelming stress(압도적인 스트레스)가 the most probable cause로 간주된다고 해요.","c":"T"},"h":"1bff5a76bf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She twisted, jumped, and jerked her arms uncontrollably through the streets.)","ko":"그녀는 거리 곳곳에서 통제할 수 없이 몸을 비틀고, 점프하고, 팔을 홱홱 움직였다.","opts":["천천히","통제할 수 없이","조용히","즐겁게"],"word":"uncontrollably","r":{"a":"2) 통제할 수 없이","ev":"4번 문장","s":[[4,"She twisted, jumped, and jerked her arms uncontrollably through the streets.","그녀는 거리 곳곳에서 통제할 수 없이 몸을 비틀고, 점프하고, 팔을 홱홱 움직였다."]],"w":"4번에서 Troffea는 스스로 멈출 수 없는 듯 몸을 비틀고 점프하고 팔을 홱홱 움직였어요. uncontrollably는 통제할 수 없이라는 뜻이에요.","c":2},"h":"e92e96a2e2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...while some tragically perished from heart attacks or strokes.)","ko":"...반면 일부는 비극적으로 심장마비나 뇌졸중으로 ...했다.","opts":["회복했다","도망쳤다","고통받았다","사망했다"],"word":"perished","r":{"a":"4) 사망했다","ev":"8번 문장","s":[[8,"The city erected stages and hired musicians, and the mania persisted for two months until many collapsed from extreme exhaustion, while some tragically perished from heart attacks or strokes.","도시는 무대를 세우고 음악가들을 고용했고, 그 광기는 많은 사람이 극심한 탈진으로 쓰러질 때까지 두 달 동안 지속되었다. 반면 일부는 비극적으로 심장마비나 뇌졸중으로 사망했다."]],"w":"8번에서 perish는 심장마비나 뇌졸중이라는 원인과 tragically(비극적으로)에 이어져 '사망하다'라는 뜻이에요. 앞 절의 collapsed(쓰러졌다)와 while로 대조되어 더 심한 결과가 나와요.","c":4},"h":"4ff082cfe3"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nLocal doctors struggled to identify what caused this incomprehensible event, and then finally diagnosed the victims with “hot blood,” a condition they believed resulted from contaminated blood trapped in the body.","ko":"밑줄 친 they가 가리키는 것은?","sko":"지역 의사들은 이 이해할 수 없는 사건의 원인이 무엇인지 밝혀내느라 고군분투했고, 마침내 희생자들을 “뜨거운 피”라고 진단했는데, 그들은 이것이 체내에 갇힌 오염된 피에서 비롯된 질환이라고 믿었다.","opts":["희생자들","도시 사람들","지역 의사들","음악가들"],"r":{"a":"3) 지역 의사들","ev":"6번 문장","s":[[6,"Local doctors struggled to identify what caused this incomprehensible event, and then finally diagnosed the victims with “hot blood,” a condition they believed resulted from contaminated blood trapped in the body.","지역 의사들은 이 이해할 수 없는 사건의 원인이 무엇인지 밝혀내느라 고군분투했고, 마침내 희생자들을 “뜨거운 피”라고 진단했는데, 그들은 이것이 체내에 갇힌 오염된 피에서 비롯된 질환이라고 믿었다."]],"w":"hot blood가 오염된 피에서 생겼다고 '믿은' 사람은 진단을 내린 쪽, 즉 이 문장의 주어인 Local doctors예요. 가장 가까운 명사 victims(희생자들)에 속지 않도록 주의하세요.","c":3},"h":"2c90cb65fd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But lacking definitive evidence, this remains only a theory, leaving the dancing plague an enigma in history.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 결정적인 증거가 부족하여, 이것은 단지 이론으로만 남아 있고, 춤추는 전염병을 역사의 수수께끼로 남겨두고 있다.","opts":["결정적인 증거가 없어서 이 설명은 이론일 뿐이고, 춤추는 전염병은 여전히 수수께끼로 남아 있다.","결정적인 증거가 충분해서 이 설명은 사실로 확인되었고, 춤추는 전염병의 수수께끼는 풀렸다.","이 설명이 이론에서 사실로 바뀌면서 춤추는 전염병은 역사에서 사라졌다.","증거가 없어서 춤추는 전염병은 실제로 일어나지 않은 일로 결론 났다."],"r":{"a":"1) 결정적인 증거가 없어서 이 설명은 이론일 뿐이고, 춤추는 전염병은 여전히 수수께끼로 남아 있다.","ev":"11번 문장","s":[[11,"But lacking definitive evidence, this remains only a theory, leaving the dancing plague an enigma in history.","그러나 결정적인 증거가 부족하여, 이것은 단지 이론으로만 남아 있고, 춤추는 전염병을 역사의 수수께끼로 남겨두고 있다."]],"w":"lacking definitive evidence는 '결정적 증거가 부족해서'라는 뜻이에요. 그래서 스트레스 설명은 이론일 뿐이고, 춤추는 전염병은 수수께끼(enigma)로 남아요. 사건 자체가 없었다는 말은 아니에요(2~5번에 기록이 있어요).","c":1},"h":"acd581acea"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이 현상은 그 세기 동안 스트라스부르에서만 나타났다.","이 사건은 의사들이 원인을 밝혀낸 즉시 끝났다.","오늘날 전문가들은 동화가 이 사건의 원인이라고 본다.","이 현상은 같은 세기에 다른 유럽 지역에서도 나타났다."],"opts":["The phenomenon appeared only in Strasbourg throughout the century.","The event ended as soon as doctors found its cause.","Experts today believe that a fairy tale caused the event.","The phenomenon also appeared in other European regions in the same century."],"r":{"a":"4) The phenomenon also appeared in other European regions in the same century.","ev":"9번 문장","s":[[9,"This bizarre phenomenon also appeared in other European regions throughout the century.","이 기이한 현상은 그 세기 내내 다른 유럽 지역에서도 나타났다."]],"w":"9번에서 이 기이한 현상이 그 세기 내내 다른 유럽 지역에서도 나타났다고 해요. 의사들은 원인을 끝내 밝혀내지 못했고(6번), 오늘날의 추정 원인은 동화가 아니라 스트레스예요(10번).","c":4},"h":"bffe3de564"},{"n":9,"t":"sum","q":"In 1518, the dancing plague (A) from one woman in Strasbourg to hundreds of people, and today its most probable cause is thought to be (B).","ko":"1518년, 춤추는 전염병은 스트라스부르의 한 여성에게서 수백 명에게 (A)했고, 오늘날 그 가장 유력한 원인은 (B)로 여겨진다.","oko":["(A) 끝났다 / (B) 스트레스","(A) 퍼졌다 / (B) 동화","(A) 멈췄다 / (B) 오염된 피","(A) 퍼졌다 / (B) 여름 더위","(A) 퍼졌다 / (B) 스트레스"],"opts":["(A) ended / (B) stress","(A) spread / (B) fairy tales","(A) stopped / (B) blood","(A) spread / (B) summer heat","(A) spread / (B) stress"],"r":{"a":"5) (A) spread / (B) stress","ev":"5번, 10번 문장","s":[[5,"While Troffea’s weird movements in the summer heat terrified many, something peculiar happened: a number of individuals began mirroring her erratic postures, and soon, about 400 men and women were affected by this “dancing plague!”","여름의 열기 속에서 Troffea의 기이한 움직임은 많은 사람들을 공포에 떨게 했지만, 뭔가 특이한 일이 일어났다: 많은 사람들이 그녀의 괴상한 자세를 따라 하기 시작했고, 곧 약 400명의 남녀가 이 “춤추는 전염병”에 의해 영향을 받았다!"],[10,"Today, overwhelming stress is regarded as the most probable cause for the outbreak, as Europeans at the time faced starvation from famine, flooding, multiple contagious diseases, and the constant threat of war.","오늘날, 압도적인 스트레스가 그 발병의 가장 유력한 원인으로 간주되는데, 당시 유럽인들은 기근으로 인한 굶주림, 홍수, 다수의 전염병, 그리고 끊임없는 전쟁의 위협에 직면해 있었기 때문이다."]],"w":"5번에서 한 사람의 춤을 따라 하는 사람이 늘어 약 400명이 영향을 받았으니 spread(퍼지다)예요. 10번에서 오늘날 가장 유력한 원인은 stress예요. 오염된 피는 당시 의사들의 믿음(6번), 여름 더위는 5번의 배경일 뿐 원인이 아니에요.","c":5},"h":"df5c606ad4"},{"n":10,"t":"fill","q":"To expel the contaminated [A], doctors prescribed more [B].","ko":"오염된 [A]을(를) 내보내려고, 의사들은 더 많은 [B]을(를) 처방했다.","bank":["substance","movement","rest","music","stress","stages"],"bko":{"substance":"물질","movement":"움직임","rest":"휴식","music":"음악","stress":"스트레스","stages":"무대"},"r":{"a":"[A] substance, [B] movement","ev":"7번 문장","s":[[7,"To expel the contaminated substance, doctors prescribed a treatment they believed would be effective: more movement.","오염된 물질을 배출하기 위해, 의사들은 효과적이라 믿었던 치료법을 처방했는데, 바로 더 많은 움직임이었다."]],"w":"7번 To expel the contaminated substance, doctors prescribed a treatment ...: more movement에서 가져왔어요. rest(휴식)는 처방한 것과 반대이고, music(음악)과 stages(무대)는 8번에서 도시가 따로 준비한 것, stress(스트레스)는 10번의 원인이에요.","c":null},"h":"e3d1016c61"}]},{"u":6,"id":"ms4-06-2","no":2,"ko":"새우도 지구도 포기 못 해","items":[{"n":1,"t":"tf","q":"The Shrimpbox looks like a shipping container with two large water tanks inside.","ko":"슈림프박스는 안에 큰 물탱크 두 개가 있는 선박용 컨테이너처럼 생겼다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Invented in 2018, the Shrimpbox resembles a shipping container with two large water tanks inside.","2018년에 발명된 슈림프박스는 내부에 두 개의 큰 물탱크가 있는 선박용 컨테이너와 닮았다."]],"w":"3번 문장에 resembles a shipping container with two large water tanks inside가 그대로 나와요.","c":"T"},"h":"099be3d9cc"},{"n":2,"t":"tf","q":"The Shrimpbox is mainly controlled by human workers.","ko":"슈림프박스는 주로 사람 작업자가 제어한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"These complex systems are controlled by artificial intelligence (AI), with the aim of optimizing conditions for shrimp production.","이러한 복잡한 시스템은 새우 생산을 위한 조건을 최적화하는 것을 목표로 인공지능(AI)에 의해 제어된다."]],"w":"5번 문장에서 이 시스템은 인공지능(AI)이 제어한다고 해요. 6번에서도 사람의 개입은 거의 없다고 해요.","c":"F"},"h":"625fd0bdb7"},{"n":3,"t":"tf","q":"A single Shrimpbox can produce up to 1,500 kilograms of shrimp a year.","ko":"슈림프박스 하나는 1년에 최대 1,500킬로그램의 새우를 생산할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The technology has proven highly effective, with a single Shrimpbox capable of producing up to 1,500 kilograms of shrimp annually with little human involvement.","이 기술은 매우 효과적인 것으로 입증되어, 단 하나의 슈림프박스로 인간의 개입이 거의 없이 연간 최대 1,500 킬로그램의 새우를 생산할 수 있다."]],"w":"6번 문장의 with a single Shrimpbox capable of producing up to 1,500 kilograms of shrimp annually와 일치해요.","c":"T"},"h":"d39f302ec8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the Shrimpbox resembles a shipping container with two large water tanks inside.)","ko":"...슈림프박스는 내부에 두 개의 큰 물탱크가 있는 선박용 컨테이너와 ...","opts":["~을 대체한다","~와 닮았다","~을 운반한다","~보다 크다"],"word":"resembles","r":{"a":"2) ~와 닮았다","ev":"3번 문장","s":[[3,"Invented in 2018, the Shrimpbox resembles a shipping container with two large water tanks inside.","2018년에 발명된 슈림프박스는 내부에 두 개의 큰 물탱크가 있는 선박용 컨테이너와 닮았다."]],"w":"3번에서 슈림프박스의 생김새를 컨테이너에 빗대어 말해요. resemble은 '~을 닮다'예요.","c":2},"h":"2c357f5245"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...than a conventional shrimp farm.)","ko":"...기존의 새우 양식장보다 ...","opts":["거대한","해로운","기존의","새로운"],"word":"conventional","r":{"a":"3) 기존의","ev":"10번 문장","s":[[10,"The end result is that the Shrimpbox uses a smaller amount of natural resources and produces fewer ecologically harmful byproducts than a conventional shrimp farm.","그 최종 결과는 슈림프박스가 기존 새우 양식장보다 더 적은 양의 천연자원을 사용하고 생태학적으로 해로운 부산물을 더 적게 생산한다는 것이다."]],"w":"10번은 슈림프박스와 기존 양식장을 비교해요. 1번에서 말한 전통적으로 양식하는 방식과 같은 뜻이라 conventional은 '기존의, 전통적인'이에요.","c":3},"h":"8dd2ea0c65"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThis is primarily achieved by employing a recirculating aquaculture system (RAS), which recycles over 95 percent of the water.","ko":"밑줄 친 which가 가리키는 것은?","sko":"이것은 주로 95퍼센트 이상의 물을 재활용하는 순환 양식 시스템(RAS)을 채택함으로써 달성된다.","opts":["슈림프박스","환경적 영향","95퍼센트의 물","순환 양식 시스템(RAS)"],"r":{"a":"4) 순환 양식 시스템(RAS)","ev":"8번 문장","s":[[8,"This is primarily achieved by employing a recirculating aquaculture system (RAS), which recycles over 95 percent of the water.","이것은 주로 95퍼센트 이상의 물을 재활용하는 순환 양식 시스템(RAS)을 채택함으로써 달성된다."]],"w":"which 앞에 쉼표가 있어 바로 앞의 RAS를 보충 설명해요. 물을 재활용하는 주체는 순환 양식 시스템이에요. 바로 뒤의 the water는 재활용되는 대상이라 가리키는 말이 아니에요.","c":4},"h":"e1536964bd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Perhaps the most significant advantage of Shrimpbox is that it minimizes the environmental impact of shrimp farming.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아마도 슈림프박스의 가장 중요한 장점은 새우 양식의 환경적 영향을 최소화한다는 점일 것이다.","opts":["슈림프박스의 가장 큰 장점은 새우 양식이 환경에 미치는 영향을 최소로 줄인다는 점일 것이다.","슈림프박스의 가장 큰 장점은 새우 양식의 생산량을 최대로 늘린다는 점이다.","슈림프박스는 환경에 미치는 영향 때문에 새우 양식에서 장점을 잃었다.","슈림프박스는 새우 양식의 환경적 영향을 줄이는 가장 값비싼 장치이다."],"r":{"a":"1) 슈림프박스의 가장 큰 장점은 새우 양식이 환경에 미치는 영향을 최소로 줄인다는 점일 것이다.","ev":"7번 문장","s":[[7,"Perhaps the most significant advantage of Shrimpbox is that it minimizes the environmental impact of shrimp farming.","아마도 슈림프박스의 가장 중요한 장점은 새우 양식의 환경적 영향을 최소화한다는 점일 것이다."]],"w":"minimizes the environmental impact는 환경적 영향을 최소화한다는 뜻이에요. 장점이 생산량 증가라거나 환경 때문에 장점을 잃었다는 말은 없고, 가격 이야기도 본문에 없어요.","c":1},"h":"1802ba1138"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["슈림프박스에는 새우에게 먹이를 주려고 많은 일꾼이 필요하다.","슈림프박스는 2008년에 발명되었다.","슈림프박스에는 물의 온도, 산소 함량, 산도를 모니터링하는 센서가 있다.","슈림프박스의 시스템은 물의 50퍼센트 미만을 재활용한다."],"opts":["A Shrimpbox needs many workers to feed the shrimp.","The Shrimpbox was invented in 2008.","The Shrimpbox has sensors that monitor the temperature, oxygen content, and acidity of the water.","The Shrimpbox system recycles less than 50 percent of the water."],"r":{"a":"3) The Shrimpbox has sensors that monitor the temperature, oxygen content, and acidity of the water.","ev":"4번 문장","s":[[4,"Each unit includes fully automated feed dispensers as well as sensors to monitor the temperature, oxygen content, and acidity level of the water.","각 장치에는 완전 자동화된 사료 배급기뿐만 아니라 물의 온도, 산소 함량, 산도 수준을 모니터링하는 센서가 포함되어 있다."]],"w":"4번에서 센서가 temperature, oxygen content, acidity level을 모니터링한다고 해요. 먹이도 자동 배급기가 주고(4번), 발명은 2018년(3번), 물은 95퍼센트 이상 재활용해요(8번).","c":3},"h":"6aeb5e9ca2"},{"n":9,"t":"sum","q":"The Shrimpbox (A) the environmental impact of shrimp farming, so it uses (B) natural resources than a conventional shrimp farm.","ko":"슈림프박스는 새우 양식의 환경적 영향을 (A)해서, 기존 새우 양식장보다 (B) 천연자원을 사용한다.","oko":["(A) 늘려서 / (B) 더 많은","(A) 최소화해서 / (B) 더 많은","(A) 늘려서 / (B) 더 적은","(A) 무시해서 / (B) 더 적은","(A) 최소화해서 / (B) 더 적은"],"opts":["(A) increases / (B) more","(A) minimizes / (B) more","(A) increases / (B) less","(A) ignores / (B) less","(A) minimizes / (B) less"],"r":{"a":"5) (A) minimizes / (B) less","ev":"7번, 10번 문장","s":[[7,"Perhaps the most significant advantage of Shrimpbox is that it minimizes the environmental impact of shrimp farming.","아마도 슈림프박스의 가장 중요한 장점은 새우 양식의 환경적 영향을 최소화한다는 점일 것이다."],[10,"The end result is that the Shrimpbox uses a smaller amount of natural resources and produces fewer ecologically harmful byproducts than a conventional shrimp farm.","그 최종 결과는 슈림프박스가 기존 새우 양식장보다 더 적은 양의 천연자원을 사용하고 생태학적으로 해로운 부산물을 더 적게 생산한다는 것이다."]],"w":"7번에서 환경적 영향을 최소화한다(minimizes)고 하고, 10번에서 그 결과 기존 양식장보다 더 적은 천연자원을 쓴다고 해요. 그래서 (A) minimizes, (B) less예요.","c":5},"h":"5f111ac5e5"},{"n":10,"t":"fill","q":"Special [A] in the tanks consume the [B] produced by the shrimp, so harmful chemicals are not needed.","ko":"탱크 안의 특수한 [A]이(가) 새우가 배출한 [B]을(를) 소비해서, 해로운 화학 물질이 필요하지 않다.","bank":["algae","waste","temperature","container","sensors","tanks"],"bko":{"algae":"조류","waste":"노폐물","temperature":"온도","container":"컨테이너","sensors":"센서","tanks":"탱크"},"r":{"a":"[A] algae, [B] waste","ev":"9번 문장","s":[[9,"Furthermore, harmful chemicals do not need to be added to keep the water clean because the tanks used in the system include special algae that consume the waste produced by the shrimp.","게다가, 이 시스템에 사용된 탱크에 새우가 배출한 노폐물을 소비하는 특수 조류가 포함되어 있기 때문에 물을 깨끗하게 유지하기 위해 해로운 화학 물질을 첨가할 필요가 없다."]],"w":"9번에서 탱크에 포함된 특수 조류(algae)가 새우가 만든 노폐물(waste)을 소비해요. temperature와 sensors는 4번의 센서 이야기, container는 3번의 생김새, tanks는 이미 문장에 나온 말이라 알맞지 않아요.","c":null},"h":"677555909b"}]},{"u":6,"id":"ms4-06-3","no":3,"ko":"생일보다 더 중요한 날이 있다?!","items":[{"n":1,"t":"tf","q":"A name day is a celebration of a saint that a person is named after.","ko":"이름날은 사람의 이름이 유래된 성인을 기념하는 날이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"A name day is the celebration of a saint someone is named after.","이름날은 누군가의 이름이 유래된 성인을 기념하는 날이다."]],"w":"4번 문장이 이름날을 the celebration of a saint someone is named after라고 정의해요.","c":"T"},"h":"ed2b1fc9ef"},{"n":2,"t":"tf","q":"Only a few days in the Greek Orthodox calendar honor saints.","ko":"그리스 정교회 달력에서 성인을 기리는 날은 며칠뿐이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The Greek Orthodox Church follows a calendar dedicated to saints, with almost every day honoring at least one of them.","그리스 정교회는 성인들에게 헌정된 달력을 따르는데, 거의 매일이 그들 중 적어도 한 명을 기린다."]],"w":"5번 문장에서 거의 매일(almost every day)이 적어도 한 명의 성인을 기린다고 해요. 며칠뿐이라는 말은 반대예요.","c":"F"},"h":"6b0b530850"},{"n":3,"t":"tf","q":"On a name day, a person may host an “open home” for friends and family.","ko":"이름날에는 친구와 가족을 위해 ‘열린 집’을 주최할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Traditionally, you host an “open home,” letting friends and family visit.","전통적으로, 당신은 친구와 가족이 방문하도록 하는 ‘열린 집’을 주최한다."]],"w":"7번 문장에서 전통적으로 친구와 가족이 방문하도록 하는 열린 집을 주최한다고 해요.","c":"T"},"h":"2af87bf87e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A Greek girl named Sofia is surrounded by loved ones ...)","ko":"소피아라는 그리스 소녀가 사랑하는 사람들에게 ...","opts":["둘러싸여 있다","쫓겨나 있다","소개되어 있다","떨어져 있다"],"word":"surrounded","r":{"a":"1) 둘러싸여 있다","ev":"1번 문장","s":[[1,"A Greek girl named Sofia is surrounded by loved ones wishing her well and offering her delicious foods, even though it’s not her birthday.","소피아라는 그리스 소녀가 생일이 아님에도 불구하고 그녀의 안녕을 빌어주고 맛있는 음식을 권하는 사랑하는 사람들에게 둘러싸여 있다."]],"w":"1번에서 소피아 곁에 안녕을 빌고 음식을 권하는 사랑하는 사람들이 있어요. be surrounded by는 '~에 둘러싸여 있다'예요.","c":1},"h":"a72e1906d5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...it’s customary to wish them a Chronia Polla ...)","ko":"...그들에게 크로니아 폴라를 전하는 것이 관례이다.","opts":["금지된","관례인","어려운","불필요한"],"word":"customary","r":{"a":"2) 관례인","ev":"13번 문장","s":[[13,"To properly acknowledge this vital occasion, it’s customary to wish them a Chronia Polla, an expression of goodwill and health.","이 중요한 행사를 제대로 기념하기 위해, 그들에게 호의와 건강의 표현인, 크로니아 폴라를 전하는 것이 관례이다."]],"w":"13번은 이름날을 제대로 기념하려고 Chronia Polla를 건네는 것을 말해요. 12번에서 이름날을 잊으면 무례하다고 했으니 건네는 일은 당연한 관례예요. customary는 '관례적인'이에요.","c":2},"h":"b4bfb60673"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt’s a way to strengthen their relationship with God and honor the saint after whom they are named.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 하나님과의 관계를 강화하고 자신의 이름이 유래된 성인을 기리는 방법이다.","opts":["그리스 정교회","그들의 생일","그들의 이름날","성인과 하나님"],"r":{"a":"3) 그들의 이름날","ev":"9~10번 문장","s":[[9,"For Greek Orthodox Christians, their name day is more significant than their birthday.","그리스 정교회 기독교인들에게 이름날은 생일보다 더 중요하다."],[10,"It’s a way to strengthen their relationship with God and honor the saint after whom they are named.","그것은 하나님과의 관계를 강화하고 자신의 이름이 유래된 성인을 기리는 방법이다."]],"w":"하나님과의 관계를 강화하고 성인을 기리는 방법은 9번에서 생일보다 더 중요하다고 한 their name day예요. 바로 앞 문장의 birthday는 비교의 대상일 뿐이에요.","c":3},"h":"9e6d437db8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Interestingly, many Greek elderly don’t even know their exact birthdate, but only their name day.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"흥미롭게도, 많은 그리스 노인들은 정확한 생년월일은 모르고 오직 이름날만 알고 있다.","opts":["많은 그리스 노인들은 이름날을 몰라서 생일만 기념한다.","그리스 노인들은 생일과 이름날을 모두 정확히 기억한다.","그리스 노인들은 이름날이 생일보다 덜 중요하다고 생각한다.","많은 그리스 노인들은 정확한 생일은 모르고 이름날만 안다."],"r":{"a":"4) 많은 그리스 노인들은 정확한 생일은 모르고 이름날만 안다.","ev":"11번 문장","s":[[11,"Interestingly, many Greek elderly don’t even know their exact birthdate, but only their name day.","흥미롭게도, 많은 그리스 노인들은 정확한 생년월일은 모르고 오직 이름날만 알고 있다."]],"w":"don’t even know their exact birthdate, but only their name day는 정확한 생년월일은 모르고 이름날만 안다는 뜻이에요. 이름날을 모른다거나 덜 중요하게 여긴다는 말은 반대예요.","c":4},"h":"7098ee0b93"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이름날에는 주최자가 손님들을 위해 음식과 음료를 전부 준비한다.","이름날 선물로 꽃은 받을 수 없다.","이름날 선물에는 이름이나 태어난 계절을 상징하는 꽃이 있을 수 있다.","그리스에서 이름날은 생일보다 덜 중요하게 여겨진다."],"opts":["The host prepares all the food and drinks for the guests on a name day.","Flowers cannot be received as name day gifts.","Name day gifts may include flowers symbolizing a person’s name or birth season.","In Greece, name days are considered less important than birthdays."],"r":{"a":"3) Name day gifts may include flowers symbolizing a person’s name or birth season.","ev":"8번 문장","s":[[8,"Guests bring food and drinks and give you gifts such as flowers symbolizing your name or birth season, or a small icon featuring the saint you were named after.","손님들은 음식과 음료를 가져오고 당신의 이름이나 태어난 계절을 상징하는 꽃, 또는 당신의 이름이 유래된 성인이 그려진 작은 성화와 같은 선물을 준다."]],"w":"8번에서 선물은 이름이나 태어난 계절을 상징하는 꽃, 또는 성인이 그려진 작은 성화라고 해요. 음식과 음료는 손님이 가져오고(8번), 이름날은 생일보다 더 중요해요(9번).","c":3},"h":"26d9595d95"},{"n":9,"t":"sum","q":"A name day is considered (A) than a birthday for Greek Orthodox Christians, and forgetting it is thought to be (B).","ko":"그리스 정교회 기독교인에게 이름날은 생일보다 (A)하다고 여겨지고, 이름날을 잊는 것은 (B)한 일로 여겨진다.","oko":["(A) 덜 중요 / (B) 무례","(A) 더 중요 / (B) 정중","(A) 더 중요 / (B) 재미있는","(A) 덜 중요 / (B) 정중","(A) 더 중요 / (B) 무례"],"opts":["(A) less important / (B) rude","(A) more important / (B) polite","(A) more important / (B) funny","(A) less important / (B) polite","(A) more important / (B) rude"],"r":{"a":"5) (A) more important / (B) rude","ev":"9번, 12번 문장","s":[[9,"For Greek Orthodox Christians, their name day is more significant than their birthday.","그리스 정교회 기독교인들에게 이름날은 생일보다 더 중요하다."],[12,"While forgetting an individual’s birthday is generally deemed permissible in Greece, committing a similar oversight on their name day is considered highly discourteous.","그리스에서는 개인의 생일을 잊어버리는 것이 일반적으로는 허용되는 것으로 여겨지지만, 그들의 이름날에 비슷한 실수를 저지르는 것은 매우 무례한 것으로 간주된다."]],"w":"9번에서 이름날은 생일보다 더 중요하다고 해요. 12번에서 생일을 잊는 것은 허용되지만 이름날을 잊는 것은 매우 무례한(highly discourteous) 일이라고 해요.","c":5},"h":"3f7f2c1b45"},{"n":10,"t":"fill","q":"Since Greece is a deeply [A] country, the majority of Greeks are named after [B].","ko":"그리스는 독실한 [A] 국가이기 때문에, 대다수의 그리스인은 [B]의 이름을 따서 이름을 짓는다.","bank":["Christian","saints","ancient","birthdays","gifts","calendars"],"bko":{"Christian":"기독교의","saints":"성인들","ancient":"고대의","birthdays":"생일들","gifts":"선물들","calendars":"달력들"},"r":{"a":"[A] Christian, [B] saints","ev":"6번 문장","s":[[6,"Since Greece is a deeply Christian country, with approximately 90 percent of the population adhering to Christianity, the majority of Greeks are named after saints.","그리스는 인구의 약 90퍼센트가 기독교를 믿는 독실한 기독교 국가이기 때문에, 대다수의 그리스인은 성인의 이름을 따서 이름을 짓는다."]],"w":"6번 문장 Since Greece is a deeply Christian country ... the majority of Greeks are named after saints에서 가져왔어요. ancient는 본문에 나오지 않고, birthdays·gifts·calendars는 이름을 따르는 대상이 아니에요.","c":null},"h":"b0a12a8bc8"}]},{"u":6,"id":"ms4-06-4","no":4,"ko":"Built for the Hunt, Broken by the Desk","items":[{"n":1,"t":"tf","q":"Participants who self-reported ADHD behaviors were more efficient in foraging scenarios that required constant movement.","ko":"ADHD 행동을 자가 보고한 참가자들은 끊임없는 움직임을 요구하는 채집 시나리오에서 더 효율적이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The test results indicated that participants who self-reported ADHD behaviors demonstrated greater efficiency in foraging scenarios requiring constant movement and swift decision-making.","실험 결과는 ADHD 행동을 자가 보고한 참가자들이 끊임없는 움직임과 신속한 의사결정을 필요로 하는 채집 시나리오에서 더 큰 효율성을 보였음을 나타냈다."]],"w":"5번 문장이 demonstrated greater efficiency in foraging scenarios requiring constant movement and swift decision-making이라고 해요.","c":"T"},"h":"dd21679b5a"},{"n":2,"t":"tf","q":"ADHD-related traits may have offered evolutionary advantages in past environments.","ko":"ADHD 관련 특성들은 과거 환경에서 진화적 이점을 제공했을지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"While often seen as negative today, ADHD-related traits may have offered evolutionary advantages in past environments.","오늘날에는 종종 부정적으로 보이지만, ADHD 관련 특성들은 과거 환경에서 진화적 이점을 제공했을지도 모른다."]],"w":"2번 문장에서 오늘날에는 부정적으로 보이지만 과거 환경에서는 진화적 이점을 제공했을지도 모른다고 해요.","c":"T"},"h":"d7a15e3204"},{"n":3,"t":"tf","q":"In the study, participants played an online game in which they hunted animals.","ko":"이 연구에서 참가자들은 동물을 사냥하는 온라인 게임을 했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"A study published in the Proceedings of the Royal Society B investigated this idea by having participants play an online berry-picking game.","영국 왕립학회 회보 B에 발표된 한 연구는 참가자들이 온라인 베리 따기 게임을 하게 함으로써 이 의견(가설)을 연구했다."]],"w":"4번 문장에서 참가자들이 한 게임은 동물 사냥이 아니라 online berry-picking game(온라인 베리 따기 게임)이에요.","c":"F"},"h":"2451981642"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the prevalence of ADHD traits in modern populations ...)","ko":"...현대 인구에서 ADHD 특성의 ...","opts":["만연함","가격","부족","발견"],"word":"prevalence","r":{"a":"1) 만연함","ev":"7번 문장","s":[[7,"These evolutionary insights imply that the prevalence of ADHD traits in modern populations—found in 11 percent of children and 4 percent of adults—could be remnants of adaptive behaviors from our nomadic lifestyles in ancient hunter-gatherer societies.","이러한 진화적 통찰은 현대 인구에서 아동의 약 11퍼센트와 성인의 약 4퍼센트에게서 발견되는 ADHD 특성의 만연함이 고대 수렵 채집 사회의 유목 생활 방식에서 비롯된 적응 행동의 잔재일 수 있음을 시사한다."]],"w":"7번에서 prevalence는 현대 인구에서 아동의 11퍼센트, 성인의 4퍼센트에게서 발견된다는 비율 이야기와 이어져서 '널리 퍼져 있음, 만연함'이에요.","c":1},"h":"d56510b30f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (With the advent of sedentary agricultural societies, ...)","ko":"정착 농경 사회의 도래와 함께, ...","opts":["유목하는","정착 생활의","고대의","산업화된"],"word":"sedentary","r":{"a":"2) 정착 생활의","ev":"8번 문장","s":[[8,"With the advent of sedentary agricultural societies, the same traits may have become less compatible with structured, repetitive tasks.","정착 농경 사회의 도래와 함께, 동일한 특성들은 구조화되고 반복적인 작업과는 잘 맞지 않게 되었을지도 모른다."]],"w":"8번의 sedentary는 agricultural societies(농경 사회)를 꾸미는데, 3·7번의 nomadic(유목의)과 대비되어 '한곳에 정착해 사는'이라는 뜻이에요.","c":2},"h":"06332130de"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIn situations designed to mimic the conditions faced by ancient gatherers, they were quicker to abandon depleted berry patches and gathered more berries overall compared to those without such traits.","ko":"밑줄 친 they가 가리키는 것은?","sko":"고대 채집가들이 직면했던 조건을 모방하도록 설계된 상황에서, 그들은 베리가 고갈된 채집 지점을 더 빨리 포기했고 그러한 특성이 없는 사람들에 비해 전체적으로 더 많은 베리를 모았다.","opts":["고대 채집가들","그러한 특성이 없는 사람들","연구를 진행한 연구자들","ADHD 행동을 자가 보고한 참가자들"],"r":{"a":"4) ADHD 행동을 자가 보고한 참가자들","ev":"5~6번 문장","s":[[5,"The test results indicated that participants who self-reported ADHD behaviors demonstrated greater efficiency in foraging scenarios requiring constant movement and swift decision-making.","실험 결과는 ADHD 행동을 자가 보고한 참가자들이 끊임없는 움직임과 신속한 의사결정을 필요로 하는 채집 시나리오에서 더 큰 효율성을 보였음을 나타냈다."],[6,"In situations designed to mimic the conditions faced by ancient gatherers, they were quicker to abandon depleted berry patches and gathered more berries overall compared to those without such traits.","고대 채집가들이 직면했던 조건을 모방하도록 설계된 상황에서, 그들은 베리가 고갈된 채집 지점을 더 빨리 포기했고 그러한 특성이 없는 사람들에 비해 전체적으로 더 많은 베리를 모았다."]],"w":"6번의 they는 앞 문장(5번)의 주어인 participants who self-reported ADHD behaviors예요. ancient gatherers는 조건을 흉내 낸 대상이고, those without such traits는 비교 대상이에요.","c":4},"h":"40562ada00"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Understanding this evolutionary context can provide a more nuanced view of ADHD, recognizing that behaviors deemed problematic today may have once played a crucial role in human survival.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 진화적 맥락을 이해하는 것은 ADHD에 대한 더 미묘한 관점을 제공할 수 있으며, 오늘날 문제로 여겨지는 행동들이 한때는 인간 생존에 중요한 역할을 했을 수도 있음을 인식하게 한다.","opts":["진화적 맥락을 알면 ADHD가 현대에 와서 새로 생긴 질환임을 확인할 수 있다.","오늘날 문제로 여겨지는 행동이 인간의 생존을 위협한 적이 있음을 알 수 있다.","오늘날 문제로 여겨지는 행동도 한때는 인간의 생존에 중요한 역할을 했을 수 있음을 이해하면 ADHD를 더 섬세하게 볼 수 있다.","ADHD에 대한 시각은 바뀔 필요가 없으며 과거의 역할은 중요하지 않다."],"r":{"a":"3) 오늘날 문제로 여겨지는 행동도 한때는 인간의 생존에 중요한 역할을 했을 수 있음을 이해하면 ADHD를 더 섬세하게 볼 수 있다.","ev":"9번 문장","s":[[9,"Understanding this evolutionary context can provide a more nuanced view of ADHD, recognizing that behaviors deemed problematic today may have once played a crucial role in human survival.","이러한 진화적 맥락을 이해하는 것은 ADHD에 대한 더 미묘한 관점을 제공할 수 있으며, 오늘날 문제로 여겨지는 행동들이 한때는 인간 생존에 중요한 역할을 했을 수도 있음을 인식하게 한다."]],"w":"more nuanced view는 더 섬세한 관점이고, 문제로 여겨지는 행동이 한때 생존에 중요한 역할(crucial role)을 했을 수 있다는 내용이에요. 새로운 질환이라거나 생존을 위협했다는 말은 없어요.","c":3},"h":"d5c65e5a6c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["ADHD 특성이 있는 사람은 환경에 빠르게 적응하는 능력이 필요 없는 사회에 적합했다.","유목 수렵 채집 사회에서는 환경적 자극에 빠르게 적응하고 반응하는 능력이 필수적이었다.","수렵 채집 사회 사람들은 대부분 한곳에 정착해 살았다.","ADHD 관련 특성은 오늘날 언제나 장점으로 여겨진다."],"opts":["People with ADHD traits were suited to societies that did not need quick adaptation.","In nomadic hunter-gatherer societies, quickly adapting and responding to environmental stimuli was essential.","Most hunter-gatherers lived settled in one place.","ADHD-related traits are always seen as advantages today."],"r":{"a":"2) In nomadic hunter-gatherer societies, quickly adapting and responding to environmental stimuli was essential.","ev":"3번 문장","s":[[3,"According to the “hunter versus farmer” hypothesis in evolutionary psychiatry, individuals with ADHD traits may have been better suited to nomadic hunter-gatherer societies, where the ability to quickly adapt and respond to environmental stimuli was essential.","진화 정신의학의 “사냥꾼 대 농부” 가설에 따르면, ADHD 특성을 가진 개인들은 환경적 자극에 빠르게 적응하고 반응하는 능력이 필수적이었던 유목 수렵 채집 사회에 더 적합했을 수 있다."]],"w":"3번에서 유목 수렵 채집 사회에서는 환경적 자극에 빠르게 적응하고 반응하는 능력이 필수적이었다고 해요. 그 사회는 유목 사회라 한곳에 정착하지 않았고, ADHD 특성은 오늘날 종종 부정적으로 보여요(2번).","c":2},"h":"a867a9ba52"},{"n":9,"t":"sum","q":"ADHD traits may be remnants of (A) behaviors from nomadic life, but they became (B) compatible with structured, repetitive tasks after farming began.","ko":"ADHD 특성은 유목 생활에서 비롯된 (A) 행동의 잔재일 수 있지만, 농경이 시작된 뒤에는 구조화되고 반복적인 작업과 (B) 맞게 되었다.","oko":["(A) 해로운 / (B) 더","(A) 적응적인 / (B) 더","(A) 해로운 / (B) 덜","(A) 적응적인 / (B) 덜","(A) 현대적인 / (B) 덜"],"opts":["(A) harmful / (B) more","(A) adaptive / (B) more","(A) harmful / (B) less","(A) adaptive / (B) less","(A) modern / (B) less"],"r":{"a":"4) (A) adaptive / (B) less","ev":"7~8번 문장","s":[[7,"These evolutionary insights imply that the prevalence of ADHD traits in modern populations—found in 11 percent of children and 4 percent of adults—could be remnants of adaptive behaviors from our nomadic lifestyles in ancient hunter-gatherer societies.","이러한 진화적 통찰은 현대 인구에서 아동의 약 11퍼센트와 성인의 약 4퍼센트에게서 발견되는 ADHD 특성의 만연함이 고대 수렵 채집 사회의 유목 생활 방식에서 비롯된 적응 행동의 잔재일 수 있음을 시사한다."],[8,"With the advent of sedentary agricultural societies, the same traits may have become less compatible with structured, repetitive tasks.","정착 농경 사회의 도래와 함께, 동일한 특성들은 구조화되고 반복적인 작업과는 잘 맞지 않게 되었을지도 모른다."]],"w":"7번에서 ADHD 특성은 유목 생활에서 비롯된 adaptive behaviors의 잔재일 수 있다고 해요. 8번에서 농경 사회가 되자 구조화되고 반복적인 작업과 less compatible하게 되었다고 해요.","c":4},"h":"1e6e2084df"},{"n":10,"t":"fill","q":"ADHD is [A] by impulsivity, hyperactivity, and [B].","ko":"ADHD는 충동성, 과잉 행동, [B](으)로 [A].","bank":["characterized","inattention","evolutionary","hypothesis","abandon","nomadic"],"bko":{"characterized":"특징지어지는","inattention":"부주의","evolutionary":"진화적인","hypothesis":"가설","abandon":"포기하다","nomadic":"유목의"},"r":{"a":"[A] characterized, [B] inattention","ev":"1번 문장","s":[[1,"Attention-Deficit/Hyperactivity Disorder (ADHD) is characterized by impulsivity, hyperactivity, and inattention.","주의력 결핍 과잉 행동 장애(ADHD)는 충동성, 과잉 행동, 부주의가 특징이다."]],"w":"1번 문장 ADHD is characterized by impulsivity, hyperactivity, and inattention에서 가져왔어요. [B]는 impulsivity, hyperactivity와 같은 종류의 명사인 inattention이어야 해요. hypothesis는 3번에 나오지만 ADHD의 특징이 아니에요.","c":null},"h":"653f04a1d4"}]},{"u":7,"id":"ms4-07-1","no":1,"ko":"옷장은 가볍게, 스타일은 완벽하게","items":[{"n":1,"t":"tf","q":"A capsule wardrobe is a collection of just 10 to 20 interchangeable clothing items.","ko":"캡슐 옷장은 서로 바꿔 입을 수 있는 10~20개의 의류 아이템으로 이루어진 컬렉션이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A capsule wardrobe would be the best solution for you; it is a curated collection of just 10 to 20 interchangeable clothing items designed to maximize outfit options while minimizing clutter.","캡슐 옷장이 당신에게 최고의 해결책이 될 것인데, 이것은 어수선함을 최소화하면서 옷차림 옵션을 극대화하도록 고안된, 서로 바꿔 입을 수 있는 10~20개의 의류 아이템으로 엄선된 컬렉션이다."]],"w":"2번 문장에서 캡슐 옷장은 just 10 to 20 interchangeable clothing items(딱 10~20개의 서로 바꿔 입을 수 있는 옷)의 컬렉션이라고 해요.","c":"T"},"h":"302c3e713a"},{"n":2,"t":"tf","q":"The concept of a capsule wardrobe first appeared in 1985 when Donna Karan released her collection.","ko":"캡슐 옷장 개념은 도나 카란이 컬렉션을 출시한 1985년에 처음 나타났다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"This minimalist fashion approach originated in the 1970s when Susie Faux introduced the concept at her London boutique, Wardrobe, after noticing that customers were spending money on low-quality, trendy pieces that quickly went out of style.","이 미니멀리스트 패션 접근법은 1970년대 수지 포가 자신의 런던 부티크 Wardrobe에서 고객들이 금방 유행이 지나는 저품질의 트렌디한 옷에 돈을 쓰고 있다는 것을 알아차린 후 이 개념을 도입했을 때 시작되었다."],[4,"The idea gained mainstream popularity in 1985 when designer Donna Karan released her “Seven Easy Pieces” collection, featuring versatile items for working women to wear for any occasion.","이 아이디어는 일하는 여성들이 어떤 상황에서도 입을 수 있는 다용도 아이템을 특징으로 하는 “Seven Easy Pieces” 컬렉션을 1985년 디자이너 도나 카란이 출시했을 때 주류의 인기를 얻었다."]],"w":"처음 시작은 3번의 1970년대(수지 포)예요. 1985년은 4번에서 도나 카란 덕분에 주류의 인기를 얻은 때라서, '처음 나타났다'는 말이 틀려요.","c":"F"},"h":"5bb7b1222c"},{"n":3,"t":"tf","q":"A capsule wardrobe lowers expenses by reducing impulse purchases.","ko":"캡슐 옷장은 충동구매를 줄여서 지출을 줄여 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"A capsule wardrobe saves time by eliminating decision fatigue, minimizes expenses by reducing impulse purchases, and helps the environment by encouraging sustainable consumption.","캡슐 옷장은 결정 피로를 없애 시간을 절약하고, 충동구매를 줄여 지출을 최소화하며, 지속 가능한 소비를 장려함으로써 환경에 도움을 준다."]],"w":"9번에서 minimizes expenses by reducing impulse purchases(충동구매를 줄여 지출을 최소화한다)라고 해요.","c":"T"},"h":"e567d76676"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...invest in high-quality pieces with timeless designs...)","ko":"...유행을 타지 않는 디자인의 고품질 옷에 투자하라.","opts":["일시적인","값싼","유행을 타지 않는","화려한"],"word":"timeless","r":{"a":"3) 유행을 타지 않는","ev":"7번 문장","s":[[7,"If you need to add items, invest in high-quality pieces with timeless designs in neutral colors that mix and match easily and can be dressed up or down.","만약 아이템을 추가해야 한다면, 쉽게 섞어 입을 수 있고 격식을 차리거나 편하게 입을 수 있는, 무채색에 유행을 타지 않는 디자인의 고품질 옷에 투자하라."]],"w":"7번에서 timeless designs in neutral colors는 오래 입어도 어색하지 않은 디자인이에요. 3번의 '금방 유행이 지나는 옷'과 반대 개념이에요. timeless = 유행을 타지 않는.","c":3},"h":"5810454321"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...and resolutely get rid of the rest.)","ko":"...나머지는 단호하게 처분하라.","opts":["단호하게","조심스럽게","천천히","마지못해"],"word":"resolutely","r":{"a":"1) 단호하게","ev":"6번 문장","s":[[6,"Begin by auditing your closet—identify the pieces you love and wear regularly, and resolutely get rid of the rest.","당신의 옷장을 점검하는 것으로 시작하라, 즉 당신이 사랑하고 정기적으로 입는 옷들을 가려내고, 나머지는 단호하게 처분하라."]],"w":"6번에서 좋아하고 자주 입는 옷만 남기고 나머지는 처분하라고 해요. 망설이지 말고 확실하게 하라는 뜻이라 resolutely = 단호하게예요.","c":1},"h":"dfb4f0fdbd"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThis minimalist fashion approach originated in the 1970s when Susie Faux introduced the concept at her London boutique, Wardrobe, after noticing that customers were spending money on low-quality, trendy pieces that quickly went out of style.","ko":"밑줄 친 마지막 that이 가리키는 것은?","sko":"이 미니멀리스트 패션 접근법은 1970년대 수지 포가 자신의 런던 부티크에서 고객들이 금방 유행이 지나는 저품질의 트렌디한 옷에 돈을 쓰고 있다는 것을 알아차린 후 이 개념을 도입했을 때 시작되었다.","opts":["런던 부티크 Wardrobe","저품질의 트렌디한 옷","수지 포의 개념","돈을 쓰는 고객들"],"r":{"a":"2) 저품질의 트렌디한 옷","ev":"3번 문장","s":[[3,"This minimalist fashion approach originated in the 1970s when Susie Faux introduced the concept at her London boutique, Wardrobe, after noticing that customers were spending money on low-quality, trendy pieces that quickly went out of style.","이 미니멀리스트 패션 접근법은 1970년대 수지 포가 자신의 런던 부티크 Wardrobe에서 고객들이 금방 유행이 지나는 저품질의 트렌디한 옷에 돈을 쓰고 있다는 것을 알아차린 후 이 개념을 도입했을 때 시작되었다."]],"w":"that quickly went out of style은 '금방 유행이 지나는'이라는 뜻으로, 바로 앞의 low-quality, trendy pieces(저품질의 트렌디한 옷)를 꾸며요. 유행이 지나는 것은 옷이에요.","c":2},"h":"3d0b3bde7f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The benefits extend beyond a tidy closet.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 장점은 단순히 옷장이 정돈되는 것에 그치지 않는다.","opts":["캡슐 옷장의 장점은 옷장이 정돈되는 것 하나뿐이다.","캡슐 옷장의 장점은 옷장 정리를 잘 하는 사람에게만 생긴다.","캡슐 옷장의 장점은 옷장이 정돈되는 것 말고도 더 있다.","캡슐 옷장은 옷장이 너무 정돈되어 오히려 불편하다."],"r":{"a":"3) 캡슐 옷장의 장점은 옷장이 정돈되는 것 말고도 더 있다.","ev":"8번 문장","s":[[8,"The benefits extend beyond a tidy closet.","그 장점은 단순히 옷장이 정돈되는 것에 그치지 않는다."]],"w":"extend beyond A는 'A를 넘어서 퍼지다', 즉 A에 그치지 않는다는 뜻이에요. 그래서 정돈된 옷장 말고도 장점이 더 있다는 말이고, 9번에서 그 장점들이 이어져요.","c":3},"h":"f22065cb5c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["새 옷을 추가하기 전에 먼저 유행하는 색을 고르라고 한다.","사랑하고 자주 입는 옷만 남기고 나머지는 처분하라고 한다.","추가하는 옷은 값이 싸고 디자인이 화려한 것을 고르라고 한다.","옷을 추가한 다음에 옷장을 점검하라고 한다."],"opts":["It tells you to choose trendy colors before adding new clothes.","It tells you to keep the pieces you love and wear regularly and get rid of the rest.","It tells you to add cheap items with bold designs.","It tells you to audit your closet after adding new items."],"r":{"a":"2) It tells you to keep the pieces you love and wear regularly and get rid of the rest.","ev":"6~7번 문장","s":[[6,"Begin by auditing your closet—identify the pieces you love and wear regularly, and resolutely get rid of the rest.","당신의 옷장을 점검하는 것으로 시작하라, 즉 당신이 사랑하고 정기적으로 입는 옷들을 가려내고, 나머지는 단호하게 처분하라."],[7,"If you need to add items, invest in high-quality pieces with timeless designs in neutral colors that mix and match easily and can be dressed up or down.","만약 아이템을 추가해야 한다면, 쉽게 섞어 입을 수 있고 격식을 차리거나 편하게 입을 수 있는, 무채색에 유행을 타지 않는 디자인의 고품질 옷에 투자하라."]],"w":"6번에서 사랑하고 정기적으로 입는 옷을 가려내고 나머지를 처분하라고 해요. 7번은 옷을 추가할 때 유행을 타지 않는 고품질 옷을 고르라고 하고, 점검(audit)은 추가보다 먼저(Begin by) 하는 일이에요.","c":2},"h":"00e2b4968b"},{"n":9,"t":"sum","q":"A capsule wardrobe is a small collection of clothes that can be (A), and it saves (B) as well as helps the environment.","ko":"캡슐 옷장은 (A)할 수 있는 소수의 옷 컬렉션이고, 환경에 도움이 될 뿐 아니라 (B)을 절약해 준다.","oko":["(A) 섞어 입을 / (B) 시간과 돈","(A) 섞어 입을 / (B) 옷장 공간","(A) 팔 / (B) 시간과 돈","(A) 버릴 / (B) 유행","(A) 빌릴 / (B) 옷장 공간"],"opts":["(A) mixed and matched / (B) time and money","(A) mixed and matched / (B) closet space","(A) sold / (B) time and money","(A) thrown away / (B) trends","(A) borrowed / (B) closet space"],"r":{"a":"1) (A) mixed and matched / (B) time and money","ev":"2, 9번 문장","s":[[2,"A capsule wardrobe would be the best solution for you; it is a curated collection of just 10 to 20 interchangeable clothing items designed to maximize outfit options while minimizing clutter.","캡슐 옷장이 당신에게 최고의 해결책이 될 것인데, 이것은 어수선함을 최소화하면서 옷차림 옵션을 극대화하도록 고안된, 서로 바꿔 입을 수 있는 10~20개의 의류 아이템으로 엄선된 컬렉션이다."],[9,"A capsule wardrobe saves time by eliminating decision fatigue, minimizes expenses by reducing impulse purchases, and helps the environment by encouraging sustainable consumption.","캡슐 옷장은 결정 피로를 없애 시간을 절약하고, 충동구매를 줄여 지출을 최소화하며, 지속 가능한 소비를 장려함으로써 환경에 도움을 준다."]],"w":"2번에서 서로 바꿔 입을 수 있는 소수의 옷이라고 했고, 9번에서 시간을 절약하고(saves time) 지출을 줄이며(minimizes expenses) 환경에 도움을 준다고 해요. 옷장 공간 절약은 본문에 없어요.","c":1},"h":"4f0e8c4616"},{"n":10,"t":"fill","q":"Begin by [A] your closet to find the pieces you wear regularly, and invest in [B] pieces with timeless designs.","ko":"옷장을 [A]하여 정기적으로 입는 옷을 가려내고, 유행을 타지 않는 디자인의 [B] 옷에 투자하라.","bank":["auditing","high-quality","trendy","impulse","clutter","fatigue"],"bko":{"auditing":"점검하는 것","high-quality":"고품질의","trendy":"유행하는","impulse":"충동","clutter":"어수선함","fatigue":"피로"},"r":{"a":"[A] auditing, [B] high-quality","ev":"6~7번 문장","s":[[6,"Begin by auditing your closet—identify the pieces you love and wear regularly, and resolutely get rid of the rest.","당신의 옷장을 점검하는 것으로 시작하라, 즉 당신이 사랑하고 정기적으로 입는 옷들을 가려내고, 나머지는 단호하게 처분하라."],[7,"If you need to add items, invest in high-quality pieces with timeless designs in neutral colors that mix and match easily and can be dressed up or down.","만약 아이템을 추가해야 한다면, 쉽게 섞어 입을 수 있고 격식을 차리거나 편하게 입을 수 있는, 무채색에 유행을 타지 않는 디자인의 고품질 옷에 투자하라."]],"w":"6번 Begin by auditing your closet, 7번 invest in high-quality pieces with timeless designs에서 가져왔어요. trendy는 3번에서 금방 유행이 지나는 옷이라 timeless 디자인과 맞지 않고, impulse·clutter·fatigue는 [A]·[B] 어느 쪽에도 뜻이 맞지 않아요.","c":null},"h":"5fdf8c1a7c"}]},{"u":7,"id":"ms4-07-2","no":2,"ko":"경계가 사라진 세상","items":[{"n":1,"t":"tf","q":"Netflix is entering the game industry.","ko":"넷플릭스는 게임 산업에 진출하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Netflix is entering the game industry, Tesla sells insurance products, and Sony makes cars.","넷플릭스는 게임 산업에 진출하고 있고, 테슬라는 보험 상품을 판매하며, 소니는 자동차를 만든다."]],"w":"1번 문장에 Netflix is entering the game industry(넷플릭스는 게임 산업에 진출하고 있다)가 그대로 나와요.","c":"T"},"h":"20fc5a0473"},{"n":2,"t":"tf","q":"In the past, companies usually worked in many different fields at once.","ko":"과거에 기업들은 보통 여러 다른 분야에서 동시에 일했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In the past, companies specialized in narrowly defined fields: banks handled money, media agencies produced entertainment.","과거에 기업들은 좁게 정의된 분야를 전문으로 했는데, 은행은 돈을 다루었고, 미디어 대행사는 오락물을 제작했다."]],"w":"4번에서 과거 기업들은 좁게 정의된 분야를 전문으로 했다(specialized in narrowly defined fields)고 해요. 여러 분야에서 동시에 일했다는 말은 반대예요.","c":"F"},"h":"898bacaacc"},{"n":3,"t":"tf","q":"Stan Davis and Christopher Meyer first introduced the term “Big Blur” in 1999.","ko":"스탠 데이비스와 크리스토퍼 마이어는 1999년에 '빅 블러'라는 용어를 처음 소개했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"First introduced by Stan Davis and Christopher Meyer in 1999, the term refers to the blurring of industry boundaries, where once-distinct sectors now overlap.","1999년 스탠 데이비스와 크리스토퍼 마이어에 의해 처음 소개된 이 용어는 산업 경계가 흐릿해지는 현상, 즉 한때 뚜렷이 달랐던 부문들이 이제는 서로 겹치는 현상을 말한다."]],"w":"3번에서 First introduced by Stan Davis and Christopher Meyer in 1999(1999년 스탠 데이비스와 크리스토퍼 마이어에 의해 처음 소개된)라고 해요.","c":"T"},"h":"44da25fc33"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These all exemplify the “Big Blur” phenomenon.)","ko":"이 모든 것은 '빅 블러' 현상을 전형적으로 보여준다.","opts":["전형적으로 보여주다","예측하다","반대하다","숨기다"],"word":"exemplify","r":{"a":"1) 전형적으로 보여주다","ev":"2번 문장","s":[[2,"These all exemplify the “Big Blur” phenomenon.","이 모든 것은 “빅 블러” 현상을 전형적으로 보여준다."]],"w":"1번의 세 회사 사례가 빅 블러 현상의 예라는 문장이에요. 예를 보여 준다는 뜻이라 exemplify = 전형적으로 보여주다.","c":1},"h":"c8ee506852"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...may gradually become more valuable as well.)","ko":"...또한 점차 더 중요해질 수 있다.","opts":["갑자기","점차","절대로","이미"],"word":"gradually","r":{"a":"2) 점차","ev":"11번 문장","s":[[11,"As boundaries continue to fade, the ability to adapt and connect ideas across different fields may gradually become more valuable as well.","경계가 계속 희미해짐에 따라, 적응해 나가는 능력과 다양한 분야의 아이디어를 연결하는 능력 또한 점차 더 중요해질 수 있다."]],"w":"11번은 경계가 계속 희미해짐에 따라 능력이 '더 중요해질 수 있다'는 문장이에요. 서서히 변하는 모습이라 gradually = 점차.","c":2},"h":"9a15e60270"},{"n":6,"t":"ref","q":"What does the underlined \"those boundaries\" refer to?\nBut with the emergence of the Fourth Industrial Revolution, a new era of living and working driven by artificial intelligence and cloud computing, those boundaries started to fade.","ko":"밑줄 친 those boundaries가 가리키는 것은?","sko":"그러나 인공지능과 클라우드 컴퓨팅에 의해 주도되는 생활과 업무 방식의 새로운 시대인 4차 산업혁명의 출현과 함께, 그러한 경계들은 희미해지기 시작했다.","opts":["국가 사이의 경계","산업 사이의 경계","기업 내부 부서 사이의 경계","도시와 시골 사이의 경계"],"r":{"a":"2) 산업 사이의 경계","ev":"3~5번 문장","s":[[3,"First introduced by Stan Davis and Christopher Meyer in 1999, the term refers to the blurring of industry boundaries, where once-distinct sectors now overlap.","1999년 스탠 데이비스와 크리스토퍼 마이어에 의해 처음 소개된 이 용어는 산업 경계가 흐릿해지는 현상, 즉 한때 뚜렷이 달랐던 부문들이 이제는 서로 겹치는 현상을 말한다."],[4,"In the past, companies specialized in narrowly defined fields: banks handled money, media agencies produced entertainment.","과거에 기업들은 좁게 정의된 분야를 전문으로 했는데, 은행은 돈을 다루었고, 미디어 대행사는 오락물을 제작했다."],[5,"But with the emergence of the Fourth Industrial Revolution, a new era of living and working driven by artificial intelligence and cloud computing, those boundaries started to fade.","그러나 인공지능과 클라우드 컴퓨팅에 의해 주도되는 생활과 업무 방식의 새로운 시대인 4차 산업혁명의 출현과 함께, 그러한 경계들은 희미해지기 시작했다."]],"w":"3번에서 빅 블러는 industry boundaries(산업 경계)가 흐려지는 것이라고 했고, 4번에서 과거에는 기업들이 좁은 분야만 전문으로 했다고 해요. 5번의 those boundaries는 그 분야 사이의 경계, 즉 산업 사이의 경계예요.","c":2},"h":"3ae997d145"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is thus important for businesses to remain adaptable and open to integration.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서 기업들이 적응력을 유지하고 통합에 개방적인 것이 중요하다.","opts":["따라서 기업은 다른 분야와 합치는 일을 피하는 것이 중요하다.","따라서 기업은 변화에 맞춰 적응하고 다른 분야와의 통합에 열려 있는 것이 중요하다.","따라서 기업은 한 가지 분야에만 집중하는 것이 중요하다.","따라서 기업은 새로운 경쟁자를 모두 인수하는 것이 중요하다."],"r":{"a":"2) 따라서 기업은 변화에 맞춰 적응하고 다른 분야와의 통합에 열려 있는 것이 중요하다.","ev":"8번 문장","s":[[8,"It is thus important for businesses to remain adaptable and open to integration.","따라서 기업들이 적응력을 유지하고 통합에 개방적인 것이 중요하다."]],"w":"remain adaptable은 적응력을 유지하는 것이고, open to integration은 통합에 열려 있다는 뜻이에요. 통합을 피하거나 한 분야에만 집중하라는 말은 반대이고, 경쟁자를 인수하라는 내용은 본문에 없어요.","c":2},"h":"aca0a6ab8f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["병원들은 AI 알고리즘 사용을 거부한다.","구글 같은 기술 기업들은 건강 추적 서비스를 제공한다.","의료 기관은 건강 추적 서비스를 독점하고 있다.","병원과 기술 기업의 일은 전혀 겹치지 않는다."],"opts":["Hospitals refuse to use AI algorithms.","Tech firms like Google provide health-tracking services.","Medical institutions still keep health-tracking services only for themselves.","The work of hospitals and tech firms never overlaps."],"r":{"a":"2) Tech firms like Google provide health-tracking services.","ev":"6번 문장","s":[[6,"Hospitals utilize AI algorithms to detect potential health complications, while tech firms like Google provide health-tracking services once exclusive to medical institutions.","병원들은 잠재적인 건강 합병증을 감지하기 위해 AI 알고리즘을 활용하는 반면, 구글과 같은 기술 기업들은 한때 의료 기관의 전유물이었던 건강 추적 서비스를 제공한다."]],"w":"6번에서 병원은 AI 알고리즘을 활용하고, 구글 같은 기술 기업은 한때 의료 기관의 전유물이던 건강 추적 서비스를 제공한다고 해요. 그래서 일이 겹치고 있어요.","c":2},"h":"75d38ca831"},{"n":9,"t":"sum","q":"The Big Blur brings new (A) for innovation, but companies also face competition from new entrants, and it may change the kinds of (B) people value.","ko":"빅 블러는 혁신을 위한 새로운 (A)를 가져오지만 기업은 새로운 진입자와의 경쟁도 겪고, 사람들이 중요하게 여기는 (B)도 바꿀 수 있다.","oko":["(A) 제한 / (B) 기술","(A) 기회 / (B) 상품 가격","(A) 기회 / (B) 기술","(A) 기회 / (B) 건물","(A) 위험 / (B) 상품 가격"],"opts":["(A) restrictions / (B) skills","(A) opportunities / (B) product prices","(A) opportunities / (B) skills","(A) opportunities / (B) buildings","(A) risks / (B) product prices"],"r":{"a":"3) (A) opportunities / (B) skills","ev":"7, 10번 문장","s":[[7,"While the Big Blur offers new opportunities for innovation and job creation, organizations face competition not only from traditional rivals but also from new entrants originating from different industries.","빅 블러는 혁신과 일자리 창출을 위한 새로운 기회를 제공하지만, 조직들은 전통적인 경쟁자뿐만 아니라 다른 산업에서 비롯된 새로운 진입자들과의 경쟁에도 직면한다."],[10,"The Big Blur may be influencing not only industries, but also the kinds of skills and ways of thinking people value.","빅 블러 현상은 산업뿐만 아니라 사람들이 중요하게 여기는 기술과 사고방식에도 영향을 미치고 있을지도 모른다."]],"w":"7번에서 빅 블러는 혁신과 일자리 창출의 기회(opportunities)를 준다고 했고, 10번에서 사람들이 중요하게 여기는 기술(skills)과 사고방식에도 영향을 줄 수 있다고 해요. 제한, 위험, 상품 가격, 건물은 본문에 근거가 없어요.","c":3},"h":"2ee9c4097c"},{"n":10,"t":"fill","q":"In a Big Blur society, the ability to think across disciplines is just as [A] as deep [B].","ko":"빅 블러 사회에서 여러 분야를 넘나들며 생각하는 능력은 깊은 [B]만큼이나 [A].","bank":["valuable","expertise","entrants","boundary","industries","opportunities"],"bko":{"valuable":"가치 있는","expertise":"전문 지식","entrants":"진입자들","boundary":"경계","industries":"산업들","opportunities":"기회들"},"r":{"a":"[A] valuable, [B] expertise","ev":"9번 문장","s":[[9,"In a Big Blur society, the ability to think across disciplines is just as valuable as deep expertise.","빅 블러 사회에서, 여러 분야를 넘나들며 생각하는 능력은 깊은 전문 지식만큼이나 가치가 있다."]],"w":"9번 In a Big Blur society, the ability to think across disciplines is just as valuable as deep expertise에서 가져왔어요. [A]는 형용사 자리라 valuable만 들어가고, [B]는 deep(깊은)과 이어지는 명사 자리예요. entrants, boundary, industries, opportunities는 '깊은 ~'과 뜻이 맞지 않아요.","c":null},"h":"f863965d4a"}]},{"u":7,"id":"ms4-07-3","no":3,"ko":"아무리 그래도 챙길 건 챙겨야지!","items":[{"n":1,"t":"tf","q":"The pharaohs of ancient Egypt were buried in tombs located in the Valley of the Kings.","ko":"고대 이집트의 파라오들은 '왕들의 계곡'에 있는 무덤에 묻혔다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"For several hundred years, the pharaohs, the kings of ancient Egypt, were buried in elaborate and ornate tombs located in an area that has come to be known as the Valley of the Kings.","수백 년 동안, 고대 이집트의 왕인 파라오들은 ‘왕들의 계곡’이라고 알려지게 된 지역에 위치한 정교하고 화려한 무덤에 매장되었다."]],"w":"1번에서 파라오들이 Valley of the Kings라고 알려지게 된 지역에 위치한 정교하고 화려한 무덤에 매장되었다고 해요.","c":"T"},"h":"15def6ebab"},{"n":2,"t":"tf","q":"The officials refused to deliver bread to the workers.","ko":"관리들은 노동자들에게 빵을 전달하기를 거부했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Wanting progress on the tombs to continue, the officials mandated that bread be delivered to the men.","무덤에 대한 진척이 계속되기를 원했기 때문에, 관리들은 그 사람들에게 빵을 전달하라고 지시했다."]],"w":"6번에서 관리들은 무덤 작업이 계속되기를 원해서 노동자들에게 빵을 전달하라고 지시했어요(mandated that bread be delivered). 거부한 것이 아니에요.","c":"F"},"h":"a980224e7a"},{"n":3,"t":"tf","q":"The workers continued to strike whenever they felt they were being exploited.","ko":"노동자들은 착취당하고 있다고 느낄 때마다 계속 파업했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"After that incident, the workers continued to strike whenever they felt they were being exploited, which put pressure on the officials to give them full rations and fair treatment.","그 사건 이후, 노동자들은 착취당하고 있다고 느낄 때마다 파업을 계속했고, 이는 관리들이 그들에게 완전한 배급과 공정한 대우를 제공하도록 압력을 가했다."]],"w":"8번에서 the workers continued to strike whenever they felt they were being exploited(착취당한다고 느낄 때마다 파업을 계속했다)라고 해요.","c":"T"},"h":"76b8b8f37f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...they marched to the local officials and proclaimed, “We are hungry!”)","ko":"...그들은 지역 관리들에게 행진하여 “우리는 배가 고프다!”라고 선언했다.","opts":["속삭였다","선언했다","사과했다","부인했다"],"word":"proclaimed","r":{"a":"2) 선언했다","ev":"4번 문장","s":[[4,"Instead of performing their assigned tasks, they marched to the local officials and proclaimed, “We are hungry!”","할당된 업무를 수행하는 대신, 그들은 지역 관리들에게 행진하여 “우리는 배가 고프다!”라고 선언했다."]],"w":"노동자들이 관리들 앞에서 \"We are hungry!\"라고 크게 알리는 장면이에요. 공개적으로 말하는 것이라 proclaim = 선언하다.","c":2},"h":"a7c2398866"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Eventually, they had to yield to the workers’ demands.)","ko":"결국, 그들은 노동자들의 요구에 굴복해야 했다.","opts":["맞서 싸우다","굴복하다","무시하다","거부하다"],"word":"yield","r":{"a":"2) 굴복하다","ev":"9번 문장","s":[[9,"Eventually, they had to yield to the workers’ demands.","결국, 그들은 노동자들의 요구에 굴복해야 했다."]],"w":"8번에서 압력을 받은 관리들이 결국 노동자들의 요구를 들어줘야 했다는 문장이에요. 요구에 지고 따르는 것이라 yield to = ~에 굴복하다.","c":2},"h":"6c9c35dfc3"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nHaving waited 18 days to receive their regular payment of grain, which the workers typically used to make bread as their main food source, they laid down their tools and refused to work.","ko":"밑줄 친 which가 가리키는 것은?","sko":"주식인 빵을 만드는 데 주로 사용했던 곡물에 대한 정기적인 급여를 받기 위해 18일을 기다린 후, 그들은 도구를 내려놓고 일하기를 거부했다.","opts":["도구","곡물","18일","무덤"],"r":{"a":"2) 곡물","ev":"3번 문장","s":[[3,"Having waited 18 days to receive their regular payment of grain, which the workers typically used to make bread as their main food source, they laid down their tools and refused to work.","주식인 빵을 만드는 데 주로 사용했던 곡물에 대한 정기적인 급여를 받기 위해 18일을 기다린 후, 그들은 도구를 내려놓고 일하기를 거부했다."]],"w":"which 뒤에 the workers typically used to make bread(노동자들이 빵을 만드는 데 주로 사용했다)가 이어져요. 빵의 재료는 곡물(grain)이에요.","c":2},"h":"f1e17ef39c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The workers’ demands were simple: they would only resume their duties when they received payment for the work they had already completed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"노동자들의 요구는 간단했는데, 그들은 이미 완료한 작업에 대한 급여를 받을 때에만 일을 다시 시작하겠다는 것이었다.","opts":["노동자들은 급여와 상관없이 일을 다시 시작하겠다고 했다.","노동자들은 앞으로 할 일에 대한 급여를 미리 받아야 일을 시작하겠다고 했다.","노동자들은 이미 한 일의 급여를 받으면 일을 다시 시작하겠다고 했다.","노동자들은 관리들이 사과해야만 일을 다시 시작하겠다고 했다."],"r":{"a":"3) 노동자들은 이미 한 일의 급여를 받으면 일을 다시 시작하겠다고 했다.","ev":"5번 문장","s":[[5,"The workers’ demands were simple: they would only resume their duties when they received payment for the work they had already completed.","노동자들의 요구는 간단했는데, 그들은 이미 완료한 작업에 대한 급여를 받을 때에만 일을 다시 시작하겠다는 것이었다."]],"w":"only when ~은 '~할 때에만'이고, the work they had already completed는 이미 끝낸 일이에요. 그래서 이미 한 일의 급여를 받아야 일을 다시 시작한다는 뜻이에요. 앞으로 할 일의 급여나 관리의 사과는 나오지 않아요.","c":3},"h":"02b5d60490"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["노동자들은 빵을 받은 후에도 며칠 동안 일하지 않았다.","관리들은 빵 대신 돈을 주기로 했다.","노동자들은 제안이 받아들일 만하다고 여겨 다음 날 일터로 돌아갔다.","노동자들은 파라오가 직접 찾아온 뒤에야 일터로 돌아갔다."],"opts":["The workers stayed away from work for several days after getting bread.","The officials decided to give money instead of bread.","The workers thought the offer was acceptable and returned to work the next day.","The workers returned to work only after the pharaoh visited them."],"r":{"a":"3) The workers thought the offer was acceptable and returned to work the next day.","ev":"6~7번 문장","s":[[6,"Wanting progress on the tombs to continue, the officials mandated that bread be delivered to the men.","무덤에 대한 진척이 계속되기를 원했기 때문에, 관리들은 그 사람들에게 빵을 전달하라고 지시했다."],[7,"Because the workers considered their offer to be acceptable, they returned to their work the next day.","노동자들이 그들의 제안을 받아들일 만하다고 여겼기 때문에, 그들은 다음 날 작업에 복귀했다."]],"w":"6번에서 관리들이 빵을 전달하라고 지시했고, 7번에서 노동자들이 그 제안을 받아들일 만하다고 여겨 다음 날 복귀했어요. 돈을 주기로 했다는 말, 며칠 동안 일하지 않았다는 말, 파라오가 찾아왔다는 말은 본문에 없어요.","c":3},"h":"7ce287b99a"},{"n":9,"t":"sum","q":"The workers who did not receive their (A) for 18 days stopped working, and their action became a (B) for others to follow.","ko":"18일 동안 (A)을 받지 못한 노동자들은 일을 멈췄고, 그들의 행동은 다른 사람들이 따를 (B)이 되었다.","oko":["(A) 급여 / (B) 실수","(A) 명령 / (B) 선례","(A) 도구 / (B) 처벌","(A) 급여 / (B) 선례","(A) 휴가 / (B) 대출"],"opts":["(A) payment / (B) mistake","(A) orders / (B) precedent","(A) tools / (B) punishment","(A) payment / (B) precedent","(A) holidays / (B) loan"],"r":{"a":"4) (A) payment / (B) precedent","ev":"3, 10번 문장","s":[[3,"Having waited 18 days to receive their regular payment of grain, which the workers typically used to make bread as their main food source, they laid down their tools and refused to work.","주식인 빵을 만드는 데 주로 사용했던 곡물에 대한 정기적인 급여를 받기 위해 18일을 기다린 후, 그들은 도구를 내려놓고 일하기를 거부했다."],[10,"For the first time in history, workers proved what could be accomplished when they stood up for themselves, establishing a precedent for others to follow.","역사상 처음으로, 노동자들은 그들이 스스로를 위해 일어섰을 때 무엇이 성취될 수 있는지를 증명했고, 다른 사람들이 따를 선례를 확립했다."]],"w":"3번에서 18일을 기다려도 정기적인 급여(payment)를 받지 못해 일을 멈췄고, 10번에서 이 일이 다른 사람들이 따를 선례(precedent)가 되었다고 해요. 명령, 도구, 휴가는 18일 동안 받지 못한 것이 아니고, 실수·처벌·대출은 본문에 없어요.","c":4},"h":"c248538a38"},{"n":10,"t":"fill","q":"After that, the workers continued to [A] whenever they felt exploited, which put [B] on the officials.","ko":"그 후 노동자들은 착취당한다고 느낄 때마다 계속 [A]했고, 이는 관리들에게 [B]을 가했다.","bank":["strike","pressure","ration","precedent","incident","tombs"],"bko":{"strike":"파업하다","pressure":"압력","ration":"배급량","precedent":"선례","incident":"사건","tombs":"무덤"},"r":{"a":"[A] strike, [B] pressure","ev":"8번 문장","s":[[8,"After that incident, the workers continued to strike whenever they felt they were being exploited, which put pressure on the officials to give them full rations and fair treatment.","그 사건 이후, 노동자들은 착취당하고 있다고 느낄 때마다 파업을 계속했고, 이는 관리들이 그들에게 완전한 배급과 공정한 대우를 제공하도록 압력을 가했다."]],"w":"8번 the workers continued to strike whenever they felt they were being exploited, which put pressure on the officials에서 가져왔어요. [A]는 동사 자리라 strike만 맞고, [B]는 put ~ on(~에 가하다)과 이어지는 pressure가 맞아요. ration, precedent, incident, tombs는 put ~ on the officials와 뜻이 이어지지 않아요.","c":null},"h":"480926f837"}]},{"u":7,"id":"ms4-07-4","no":4,"ko":"Counting Without Counting","items":[{"n":1,"t":"tf","q":"A musical phrase is commonly built from four measures, and it may expand into eight.","ko":"음악 구절은 일반적으로 4마디로 구성되며 8마디로 확장될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A musical phrase is commonly built from four measures, which may then expand into eight.","하나의 음악 구절은 일반적으로 4마디로 구성되며, 이는 8마디로 확장될 수 있다."]],"w":"2번에서 A musical phrase is commonly built from four measures, which may then expand into eight(4마디로 구성되고 8마디로 확장될 수 있다)라고 해요.","c":"T"},"h":"ec93d25baa"},{"n":2,"t":"tf","q":"This profound stability originates from music itself rather than from the way humans move and think.","ko":"이러한 깊은 안정감은 인간이 움직이고 생각하는 방식이 아니라 음악 자체에서 비롯된다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"This profound stability originates not intrinsically from music itself, but from the fundamental mechanisms governing human locomotion and cognition.","이러한 깊은 안정감은 음악 자체에서 본질적으로 비롯되는 것이 아니라, 인간의 이동과 인지를 지배하는 근본적인 메커니즘에서 비롯된다."]],"w":"5번은 안정감이 음악 자체에서 본질적으로 비롯되는 것이 아니라(not intrinsically from music itself), 인간의 이동과 인지를 지배하는 근본적인 메커니즘에서 비롯된다고 해요. 원인을 정반대로 말한 문장이에요.","c":"F"},"h":"1259dfbef8"},{"n":3,"t":"tf","q":"Four beats are long enough to register as a pattern yet short enough to maintain tension.","ko":"4박자는 패턴으로 인식되기에 충분히 길지만 긴장을 유지하기에 충분히 짧다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The brain seems to favor this structure too, as four beats are long enough to register as a pattern yet short enough to maintain tension, while eight beats provide a sense of completion.","뇌 또한 이 구조를 선호하는 것으로 보이는데, 4박자는 패턴으로 인식되기에 충분히 길지만 긴장을 유지하기에 충분히 짧은 반면, 8박자는 완결감을 제공하기 때문이다."]],"w":"8번에서 four beats are long enough to register as a pattern yet short enough to maintain tension이라고 해요.","c":"T"},"h":"7d04be3061"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...relying more on intuition than calculation to know when to begin and when to conclude.)","ko":"...언제 시작하고 언제 끝낼지 알기 위해 계산보다는 직관에 더 의존한다.","opts":["직관","계산","훈련","기억"],"word":"intuition","r":{"a":"1) 직관","ev":"4번 문장","s":[[4,"Performers experience this feeling as well, relying more on intuition than calculation to know when to begin and when to conclude.","연주자들 또한 이 느낌을 경험하며, 언제 시작하고 언제 끝낼지 알기 위해 계산보다는 직관에 더 의존한다."]],"w":"4번은 연주자들이 계산 대신 무엇에 더 기댄다는 문장이에요. 3번에서 숫자를 세지 않아도 다음에 올 것을 느낀다고 했으니, 세지 않고도 아는 감각인 intuition = 직관이에요.","c":1},"h":"6cb69baef7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...odd-numbered rhythms often feel unstable and demand greater attention from the listener.)","ko":"...홀수 리듬은 종종 불안정하게 느껴지며 청취자에게 더 큰 주의를 요구한다.","opts":["제공하다","거절하다","요구하다","줄이다"],"word":"demand","r":{"a":"3) 요구하다","ev":"9번 문장","s":[[9,"By contrast, odd-numbered rhythms often feel unstable and demand greater attention from the listener.","대조적으로, 홀수 리듬은 종종 불안정하게 느껴지며 청취자에게 더 큰 주의를 요구한다."]],"w":"홀수 리듬은 불안정해서 듣는 사람이 더 집중해야 한다는 뜻이에요. 주의를 필요로 한다는 의미라 demand = 요구하다.","c":3},"h":"4787780d6e"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nListeners do not consciously count these numbers, but they still have a natural sense of what comes next.","ko":"밑줄 친 they가 가리키는 것은?","sko":"청취자들은 이 숫자를 의식적으로 세지 않지만, 여전히 다음에 무엇이 올지에 대한 자연스러운 감각을 가지고 있다.","opts":["숫자들","청취자들","멜로디들","마디들"],"r":{"a":"2) 청취자들","ev":"3번 문장","s":[[3,"Listeners do not consciously count these numbers, but they still have a natural sense of what comes next.","청취자들은 이 숫자를 의식적으로 세지 않지만, 여전히 다음에 무엇이 올지에 대한 자연스러운 감각을 가지고 있다."]],"w":"문장의 주어는 Listeners이고, 'but they still have ~'에서 대조되는 두 동작(세지 않음 / 감각이 있음)의 주체가 같아요. 그래서 they는 청취자들이에요.","c":2},"h":"34b92c5d19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These effects stand out, however, precisely because a familiar four-beat structure already exists as a reference.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 이러한 효과들은 친숙한 4박자 구조가 이미 기준점으로 존재하기 때문에 정확히 두드러진다.","opts":["불규칙한 리듬은 4박 구조를 없앨 때에만 효과가 있다.","친숙한 4박 구조가 기준으로 있기 때문에 불규칙한 리듬의 효과가 두드러진다.","4박 구조는 불규칙한 리듬 때문에 친숙해졌다.","친숙한 구조가 없을 때 불규칙한 리듬의 효과가 가장 두드러진다."],"r":{"a":"2) 친숙한 4박 구조가 기준으로 있기 때문에 불규칙한 리듬의 효과가 두드러진다.","ev":"12번 문장","s":[[12,"These effects stand out, however, precisely because a familiar four-beat structure already exists as a reference.","그러나 이러한 효과들은 친숙한 4박자 구조가 이미 기준점으로 존재하기 때문에 정확히 두드러진다."]],"w":"precisely because ~는 '바로 ~하기 때문에'로, 이유가 기준(reference)이 되는 4박 구조예요. 기준이 있어서 벗어난 효과가 눈에 띈다는 뜻이에요. 구조를 없애야 한다는 말, 원인과 결과를 바꾼 말, 기준이 없을 때 두드러진다는 말은 모두 틀려요.","c":2},"h":"06909ef688"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["음악 구절의 4마디는 8마디로 확장될 수 없다.","4와 8은 신체가 따르기에 가장 편안한 단위가 된다.","8박자는 긴장을 유지하기에 4박자보다 더 적합하다.","홀수 리듬은 청취자에게 가장 안정적으로 느껴진다."],"opts":["Four measures can never expand into eight.","Four and eight become the most comfortable units for the body to follow.","Eight beats are better than four beats at maintaining tension.","Odd-numbered rhythms feel the most stable to listeners."],"r":{"a":"2) Four and eight become the most comfortable units for the body to follow.","ev":"7번 문장","s":[[7,"As these patterns expand, four and eight become the most comfortable units for the body to follow.","이러한 패턴이 확장됨에 따라, 4와 8은 신체가 따르기에 가장 편안한 단위가 된다."]],"w":"7번에서 이 패턴이 확장되면서 4와 8이 신체가 따르기에 가장 편안한 단위가 된다고 해요. 4마디는 8마디로 확장될 수 있고(2번), 긴장을 유지하는 것은 4박자이며 8박자는 완결감을 주고(8번), 홀수 리듬은 불안정하게 느껴져요(9번).","c":2},"h":"913dab4c01"},{"n":9,"t":"sum","q":"Not all music aims for (A) alone, so jazz and experimental music use (B) rhythms to add tension and movement.","ko":"모든 음악이 (A)만을 목표로 하는 것은 아니어서, 재즈와 실험 음악은 긴장과 움직임을 더하기 위해 (B) 리듬을 사용한다.","oko":["(A) 안정성 / (B) 규칙적인","(A) 계산 / (B) 불규칙한","(A) 안정성 / (B) 불규칙한","(A) 직관 / (B) 친숙한","(A) 완결감 / (B) 반복되는"],"opts":["(A) stability / (B) regular","(A) calculation / (B) irregular","(A) stability / (B) irregular","(A) intuition / (B) familiar","(A) completion / (B) repeated"],"r":{"a":"3) (A) stability / (B) irregular","ev":"10~11번 문장","s":[[10,"For this reason, not all music aims for stability alone.","이러한 이유로, 모든 음악이 안정성만을 목표로 하는 것은 아니다."],[11,"Jazz and experimental music frequently use irregular rhythms to introduce tension and movement.","재즈와 실험 음악은 긴장과 움직임을 도입하기 위해 불규칙한 리듬을 자주 사용한다."]],"w":"10번에서 모든 음악이 stability(안정성)만을 목표로 하지는 않는다고 했고, 11번에서 재즈와 실험 음악은 긴장과 움직임을 위해 irregular(불규칙한) 리듬을 쓴다고 해요. 규칙적인 리듬은 긴장을 만들지 못하고, 계산·직관·완결감은 10번의 내용이 아니에요.","c":3},"h":"e719d34dc2"},{"n":10,"t":"fill","q":"Music feels stable not because the [A] themselves are special, but because it reflects human [B].","ko":"음악이 안정적으로 느껴지는 것은 [A] 자체가 특별해서가 아니라 인간의 [B]를 반영하기 때문이다.","bank":["numbers","perception","stability","tension","completion","calculation"],"bko":{"numbers":"숫자","perception":"인식, 지각","stability":"안정감","tension":"긴장","completion":"완결감","calculation":"계산"},"r":{"a":"[A] numbers, [B] perception","ev":"13~14번 문장","s":[[13,"In the end, music feels stable in fours and eights not because the numbers themselves are special, but because human bodies and brains already move and think in such rhythms.","결국, 음악이 4와 8에서 안정적으로 느껴지는 것은 숫자 자체가 특별해서가 아니라, 인간의 신체와 뇌가 이미 그러한 리듬으로 움직이고 생각하기 때문이다."],[14,"Music does not simply follow numbers; rather, it reflects human perception.","음악은 단순히 숫자를 따르는 것이 아니라, 오히려 인간의 지각을 반영한다."]],"w":"13번 not because the numbers themselves are special과 14번 it reflects human perception에서 가져왔어요. themselves는 복수 명사를 받으므로 [A]에는 numbers가 맞아요. [B]에는 perception이 맞고, calculation은 4번에서 연주자가 직관보다 덜 의존한다고 한 것이라 맞지 않아요. stability, tension, completion은 둘 중 어디에 넣어도 뜻이 이어지지 않아요.","c":null},"h":"bd05f9e5ce"}]},{"u":8,"id":"ms4-08-1","no":1,"ko":"말 한마디에 AI가 달라져!","items":[{"n":1,"t":"tf","q":"AI can generate a vast amount of data at a remarkable speed.","ko":"AI는 놀라운 속도로 방대한 양의 데이터를 생성할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"AI is a powerful tool capable of generating a vast amount of data at a remarkable speed.","AI는 놀라운 속도로 방대한 양의 데이터를 생성할 수 있는 강력한 도구이다."]],"w":"10번에 AI는 놀라운 속도로 방대한 양의 데이터를 생성할 수 있는 강력한 도구(capable of generating a vast amount of data at a remarkable speed)라고 나와요.","c":"T"},"h":"64d4435f5e"},{"n":2,"t":"tf","q":"A prompt does not need any background information because the AI already knows the expected outcome.","ko":"AI가 이미 예상되는 결과를 알고 있으므로 프롬프트에는 배경 정보가 필요 없다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"The prompt should also contain the context necessary for the AI program to comprehend the anticipated outcome.","프롬프트는 또한 AI 프로그램이 예상되는 결과를 이해하는 데 필요한 맥락을 포함해야 한다."],[8,"This might take the form of relevant background information, concrete examples, or a comprehensive set of parameters.","이것은 관련된 배경 정보, 구체적인 예시, 또는 포괄적인 매개변수 세트의 형태를 취할 수 있다."]],"w":"7번에서 AI가 예상되는 결과를 이해하려면 프롬프트에 맥락이 필요하다고 하고, 8번에서 그 맥락이 배경 정보 등의 형태라고 해요. 필요 없다는 말은 반대예요.","c":"F"},"h":"dd70381506"},{"n":3,"t":"tf","q":"A prompt should state the format and tone that the user wants in the response.","ko":"프롬프트는 사용자가 응답에서 원하는 형식과 어조를 밝혀야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Finally, the prompt should identify the desired format and tone of the response to make certain that it corresponds to the user’s expectations.","마지막으로, 프롬프트는 사용자의 기대에 부합하는지 확인하기 위해 응답의 원하는 형식과 어조를 식별해야 한다."]],"w":"9번에서 프롬프트는 응답의 원하는 형식과 어조(desired format and tone)를 정해야 한다고 해요.","c":"T"},"h":"37d6e728a0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the task must be accurately explained with precise language that avoids any ambiguous phrasing.)","ko":"작업이 모호한 표현을 피하는 정밀한 언어로 정확하게 설명되어야 한다. (precise는 정밀한)","opts":["모호한","복잡한","정밀한","간단한"],"word":"precise","r":{"a":"3) 정밀한","ev":"6번 문장","s":[[6,"Most importantly, the task must be accurately explained with precise language that avoids any ambiguous phrasing.","가장 중요하게는, 작업이 모호한 표현을 피하는 정밀한 언어로 정확하게 설명되어야 한다."]],"w":"precise language는 avoids any ambiguous phrasing(모호한 표현을 피하는)이 꾸며 주는 말이라 ‘모호한’의 반대인 정밀한이에요.","c":3},"h":"d35073298f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Simultaneously, new careers in the AI industry are emerging, such as prompt engineering.)","ko":"동시에, 프롬프트 엔지니어링과 같은 새로운 직업들이 AI 산업에서 등장하고 있다. (emerge는 나타나다)","opts":["사라지고 있다","나타나고 있다","변하지 않고 있다","느려지고 있다"],"word":"emerging","r":{"a":"2) 나타나고 있다","ev":"2번 문장","s":[[2,"Simultaneously, new careers in the AI industry are emerging, such as prompt engineering.","동시에, 프롬프트 엔지니어링과 같은 새로운 직업들이 AI 산업에서 등장하고 있다."]],"w":"new careers(새로운 직업)가 AI 산업에 생기고 있다는 뜻이라 ‘나타나고 있다’가 맞아요. emerge = 나타나다.","c":2},"h":"e10c37a66d"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHowever, the quality of its output is dependent on the input it receives from the user.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그러나, 그 결과물의 품질은 그것이 사용자로부터 받는 입력에 달려 있다.","opts":["AI","사용자","품질","프롬프트 엔지니어"],"r":{"a":"1) AI","ev":"10~11번 문장","s":[[10,"AI is a powerful tool capable of generating a vast amount of data at a remarkable speed.","AI는 놀라운 속도로 방대한 양의 데이터를 생성할 수 있는 강력한 도구이다."],[11,"However, the quality of its output is dependent on the input it receives from the user.","그러나, 그 결과물의 품질은 그것이 사용자로부터 받는 입력에 달려 있다."]],"w":"입력을 받아서 결과물(output)을 내놓는 것은 AI예요. 10번에서 AI를 설명하고, 11번에서 its output, it receives로 이어 받아요. 입력을 주는 쪽은 사용자(the user)예요.","c":1},"h":"79770f1a08"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Artificial intelligence (AI) is fundamentally reshaping the job market, with routine tasks increasingly being automated.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"인공지능(AI)은 일상적인 업무가 점점 더 자동화되면서 근본적으로 직업 시장을 재편하고 있다.","opts":["AI는 직업 시장에 영향을 주지 않고 일상 업무만 조금 돕고 있다.","AI가 직업 시장을 바꾸는 바람에 일상적인 업무는 오히려 늘고 있다.","AI 때문에 모든 직업이 사라지고 있다.","AI는 일상적인 업무를 점점 자동화하면서 직업 시장을 근본적으로 바꾸고 있다."],"r":{"a":"4) AI는 일상적인 업무를 점점 자동화하면서 직업 시장을 근본적으로 바꾸고 있다.","ev":"1번 문장","s":[[1,"Artificial intelligence (AI) is fundamentally reshaping the job market, with routine tasks increasingly being automated.","인공지능(AI)은 일상적인 업무가 점점 더 자동화되면서 근본적으로 직업 시장을 재편하고 있다."]],"w":"with routine tasks increasingly being automated는 ‘일상적인 업무가 점점 자동화되면서’라는 뜻이에요. 업무가 늘어난다거나 모든 직업이 사라진다는 말은 없어요.","c":4},"h":"dc54fd065f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["미리 만든 프롬프트가 있으면 AI가 필요 없다.","프롬프트를 쓰면 AI의 결과물 양이 줄어든다.","잘 만든 프롬프트는 데이터 분석 같은 분야에서 AI의 성능을 높인다.","프롬프트 엔지니어링은 AI 산업에서 가장 오래된 직업이다."],"opts":["Prompts make AI unnecessary once they are written.","Using prompts reduces the amount of output AI produces.","Skillfully crafted prompts can improve AI performance in fields such as data analysis.","Prompt engineering is the oldest career in the AI industry."],"r":{"a":"3) Skillfully crafted prompts can improve AI performance in fields such as data analysis.","ev":"4번 문장","s":[[4,"Skillfully crafted prompts enhance the performance of AI, greatly increasing its utility for a wide variety of applications, including content creation, data analysis, and problem-solving.","솜씨 좋게 만들어진 프롬프트는 AI의 성능을 향상시켜, 콘텐츠 제작, 데이터 분석, 문제 해결을 포함한 광범위한 응용 분야에서 그것의 유용성을 크게 증가시킨다."]],"w":"4번에서 솜씨 좋게 만든 프롬프트는 AI의 성능을 향상시키고, 데이터 분석을 포함한 여러 응용 분야에서 유용성을 크게 높인다고 해요. 나머지는 본문에 없는 내용이에요. 프롬프트 엔지니어링은 오히려 새로 생겨나는 직업이에요(2번).","c":3},"h":"0a8867cf46"},{"n":9,"t":"sum","q":"Because the quality of AI’s output depends on the user’s input, a prompt should use (A) language and include context so that the AI gives a (B) response.","ko":"AI 결과물의 품질은 사용자의 입력에 달려 있으므로, 프롬프트는 (A)한 언어를 쓰고 맥락을 담아야 AI가 (B)한 응답을 준다.","oko":["(A) 모호 / (B) 적절","(A) 정밀 / (B) 예측 불가능","(A) 짧고 쉬운 / (B) 빠른","(A) 정밀 / (B) 지루","(A) 정밀 / (B) 적절"],"opts":["(A) ambiguous / (B) appropriate","(A) precise / (B) unpredictable","(A) simple / (B) fast","(A) precise / (B) boring","(A) precise / (B) appropriate"],"r":{"a":"5) (A) precise / (B) appropriate","ev":"3번, 6~7번, 11번 문장","s":[[3,"Prompt engineering is the practice of designing and refining specific instructions—called “prompts”—for AI programs in order to generate appropriate outputs.","프롬프트 엔지니어링은 적절한 결과물을 생성하기 위해 AI 프로그램을 위한 “프롬프트”라고 불리는 구체적인 지시 사항을 설계하고 다듬는 작업이다."],[6,"Most importantly, the task must be accurately explained with precise language that avoids any ambiguous phrasing.","가장 중요하게는, 작업이 모호한 표현을 피하는 정밀한 언어로 정확하게 설명되어야 한다."],[7,"The prompt should also contain the context necessary for the AI program to comprehend the anticipated outcome.","프롬프트는 또한 AI 프로그램이 예상되는 결과를 이해하는 데 필요한 맥락을 포함해야 한다."],[11,"However, the quality of its output is dependent on the input it receives from the user.","그러나, 그 결과물의 품질은 그것이 사용자로부터 받는 입력에 달려 있다."]],"w":"6번은 모호한 표현을 피하는 정밀한 언어(precise language), 7번은 맥락을 요구하고, 3번은 프롬프트의 목적이 적절한 결과물(appropriate outputs)을 얻는 것이라고 해요. 11번은 품질이 입력에 달렸다는 근거예요.","c":5},"h":"e52d8c0c34"},{"n":10,"t":"fill","q":"AI is reshaping the job market, and new [A] such as prompt engineering are [B] in the AI industry.","ko":"AI는 직업 시장을 재편하고 있고, 프롬프트 엔지니어링과 같은 새로운 [A]이 AI 산업에서 [B].","bank":["careers","emerging","industries","instructions","shrinking","ambiguous"],"bko":{"careers":"직업","emerging":"생겨나는","industries":"산업","instructions":"지시 사항","shrinking":"줄어드는","ambiguous":"모호한"},"r":{"a":"[A] careers, [B] emerging","ev":"1~2번 문장","s":[[1,"Artificial intelligence (AI) is fundamentally reshaping the job market, with routine tasks increasingly being automated.","인공지능(AI)은 일상적인 업무가 점점 더 자동화되면서 근본적으로 직업 시장을 재편하고 있다."],[2,"Simultaneously, new careers in the AI industry are emerging, such as prompt engineering.","동시에, 프롬프트 엔지니어링과 같은 새로운 직업들이 AI 산업에서 등장하고 있다."]],"w":"2번에서 new careers(새로운 직업)가 생겨나고(are emerging) 있다고 해요. industries는 이미 AI industry로 나온 말이고, shrinking(줄어드는)은 ‘새로 생긴다’와 반대예요.","c":null},"h":"f5e5d08897"}]},{"u":8,"id":"ms4-08-2","no":2,"ko":"공식 스폰서인 척 숟가락 얹기!","items":[{"n":1,"t":"tf","q":"Visa paid $40 million to be the official credit card of the 2012 London Olympics.","ko":"Visa는 2012년 런던 올림픽의 공식 신용카드가 되기 위해 4천만 달러를 지불했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"For instance, Visa paid $40 million to be the official credit card of the 1994 Winter Olympics in Norway.","예를 들어, Visa는 1994년 노르웨이 동계 올림픽의 공식 신용카드가 되기 위해 4천만 달러를 지불했다."]],"w":"7번에서 Visa가 공식 신용카드가 된 것은 1994년 노르웨이 동계 올림픽이에요. 2012년 런던 올림픽은 11번 비츠 바이 드레 사례에 나오는 행사예요.","c":"F"},"h":"adb0d0be27"},{"n":2,"t":"tf","q":"In ambush marketing, a brand tries to gain attention without actually paying for sponsorships.","ko":"앰부시 마케팅에서 브랜드는 실제로 후원 비용을 내지 않고 관심을 얻으려 한다
