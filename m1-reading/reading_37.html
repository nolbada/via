 be an artwork, too.","박스 테이프도 예술 작품이 될 수 있습니다.",1],["Artists put a piece of tape on glass and add another piece of tape on it.","예술가들은 유리 위에 한 조각의 테이프를 붙이고 그 위에 또 다른 조각의 테이프를 붙입니다.",0],["This way, they can make dark or bright colors.","이런 식으로, 그들은 어두운색이나 밝은색을 만들 수 있습니다.",0],["Look at the man's face.","남자의 얼굴을 보세요.",0],["Isn't it interesting?","흥미롭지 않나요?",0],["Give it a try.","한번 시도해 보세요.",0],["Lastly, your heartbeat can be art, too!","마지막으로, 여러분의 심장 박동도 예술이 될 수 있습니다!",1],["At Pulse Park, your heartbeat makes a great art show.","Pulse Park에서, 여러분의 심장 박동은 멋진 예술 쇼를 만듭니다.",0],["Hold the special sensors in the park.","공원에 있는 특수 센서를 잡으세요.",0],["Then, your heartbeat changes into lights.","그러면, 여러분의 심장 박동은 빛으로 바뀝니다.",0],["Like this, you can see everyone's heartbeats on different lights.","이처럼, 여러분은 모든 사람의 심장 박동을 다른 빛으로 볼 수 있습니다.",0],["Look, the lights are dancing!","보세요, 불빛들이 춤을 추고 있습니다!",0],["Did you enjoy your visit?","방문이 즐거우셨나요?",1],["There is no end to art.","예술에는 끝이 없습니다.",0],["Just try new things.","그저 새로운 것을 시도해 보세요.",0],["Next time, I will show you a different art style.","다음번에는 제가 여러분에게 다른 예술 스타일을 보여드릴게요.",0],["See you next time.","다음에 또 만나요.",0]];var RNUM=37;var TITLE_EN="Everything Can Be Art!";var PASS_EN=["Everything Can Be Art!","Hello, everyone. I'm Artro, your A.I. art guide. Look around you. Art is everywhere. Everything can be art. Follow me. I'll give you some examples.","Can a shadow become an artwork? Look at this. The shadow of this cup makes an elephant. It's your turn. Choose a shadow, and draw interesting things around the shadow. Your shadow can be art.","Box tape can be an artwork, too. Artists put a piece of tape on glass and add another piece of tape on it. This way, they can make dark or bright colors. Look at the man's face. Isn't it interesting? Give it a try.","Lastly, your heartbeat can be art, too! At Pulse Park, your heartbeat makes a great art show. Hold the special sensors in the park. Then, your heartbeat changes into lights. Like th
