rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

야 한다.",0],["They will need them to survive in the wild.","그들은 야생에서 살아남기 위해 이 기술들이 필요할 것이다.",0],["I really wanted to be part of the project.","나는 그 프로젝트에 정말 참여하고 싶었다.",0],["Luckily, I got the chance.","다행히 나는 기회를 얻었다.",0],["I just ran some errands in the training class today, but the experience made me so excited.","나는 오늘 훈련 수업에서 그저 몇 가지 심부름을 했을 뿐이지만, 그 경험은 나를 매우 설레게 했다.",0]];var RNUM=4;var TITLE_EN="Live Freely and Happily Ever After!";var PASS_EN=["Live Freely and Happily Ever After!","You can work with NGOs as a teenager. It is a great way to learn about social issues and make the world better. Are you interested? Then, read Inho's blog below.","JAN 5","I grew up in Jeju-do, so I had many chances to see dolphins. Then, I learned that many dolphins are in danger. Some are even endangered. I thought I should do something. So, I searched the Internet and found an NGO, Dolphin Lovers. It does various activities such as cleaning up beaches and helping dolphins. After some thought, I joined it today.","JAN 20","Many dolphins get sick or even die because of plastic waste and fishing nets, so cleaning up beaches is important. There was a beach cleanup party today, and I took part in it. Cleaning up the beach was not easy, but I enjoyed it. Oh, I saw Aunt Sumi there. She is also a member of Dolphin Lovers. What a small world!","FEB 14","This afternoon, I took part in a training class for Halla and Olle, two dolphins in an aquarium in Jeju-do. The latest project of Dolphin Lovers is to return them to the sea. For this, Halla and Olle first need to learn some skills. They will need them to survive in the wild. I really wanted to be part of the project. Luckily, I got the chance. I just ran some errands in the training class today, but the experience made me so excited."];var PASS_KO=["자유롭고 행복하게 오래오래 살기를!","여러분은 십 대 청소년으로서 NGO와 함께 활동할 수 있습니다. 그것은 사회 문제에 대해 배우고 세상을 더 좋게 만드는 좋은 방법입니다. 관심이 있나요? 그렇다면 아래에서 인호의 블로그를 읽어보세요.","1월 5일","나는 제주도에서 자라서 돌고래를 볼 기회가 많았다. 그러다 많은 돌고래들이 위험에 처해 있다는 것을 알았다. 일부는 심지어 멸종 위기에 처해 있다. 나는 무언가 해야겠다고 생각했다. 그래서 인터넷을 검색하다가 NGO인 Dolphin Lovers를 찾았다. 이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다. 고민 끝에, 나는 오늘 이곳에 가입했다.","1월 20일","많은 돌고래들이 플라스틱 쓰레기와 어망 때문에 병에 걸리거나 심지어 죽기도 하므로 해변을 청소하는 것은 중요하다. 오늘 해변 청소 모임이 있었고, 나는 그 모임에 참가했다. 해변을 청소하는 일이 쉽지는 않았지만 즐거웠다. 아, 그곳에서 나는 수미 이모를 만났다. 그녀도 Dolphin Lovers 회원이다. 세상이 참 좁다!","2월 14일","오늘 오후에 나는 제주도의 한 수족관에 있는 돌고래 두 마리, 한라와 올레의 훈련 수업에 참여했다. Dolphin Lovers의 최근 프로젝트는 그들을 바다로 돌려보내는 것이다. 이를 위해 한라와 올레는 먼저 몇 가지 기술을 배워야 한다. 그들은 야생에서 살아남기 위해 이 기술들이 필요할 것이다. 나는 그 프로젝트에 정말 참여하고 싶었다. 다행히 나는 기회를 얻었다. 나는 오늘 훈련 수업에서 그저 몇 가지 심부름을 했을 뿐이지만, 그 경험은 나를 매우 설레게 했다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["A는 지난 주말에 댄스 대회에 참가했다.","B는 A에게 춤을 보여 달라고 부탁한다.","A는 이번 주말에 댄스 대회가 있다.","B는 댄스 대회에 관심이 없다고 말한다.","A는 B에게 대회에 같이 가자고 한다."],"a":2,"ans":"A는 이번 주말에 댄스 대회가 있다.","evs":[["I have a dance contest this weekend.","나는 이번 주말에 댄스 대회가 있어."],["Really? I hope you do well.","정말? 잘하길 바라."]],"ev":["I have a dance contest this weekend.","나는 이번 주말에 댄스 대회가 있어."],"ow":["오답 ✕ — A는 'I have a dance contest this weekend.'(나는 이번 주말에 댄스 대회가 있어.)라고 했는데, 이 보기는 지난 주말에 참가했다고 해서 틀림.","오답 ✕ — 춤을 보여 달라는 말은 없다. B는 'I hope you do well.'(잘하길 바라.)라고 응원했을 뿐이라 틀림.","정답 ○ — A가 'I have a dance contest this weekend.'(나는 이번 주말에 댄스 대회가 있어.)라고 했으므로 맞음.","오답 ✕ — B는 'Really? I hope you do well.'(정말? 잘하길 바라.)라고 했으므로 관심이 있고 응원하는 것이라 틀림.","오답 ✕ — 같이 가자는 말은 없다. A는 대회가 있다고 알리고 'Thanks.'(고마워.)라고 답했을 뿐이라 틀림."],"memo":["정답 ③: A는 이번 주말에 댄스 대회가 있다.","근거: I have a dance contest this weekend.(나는 이번 주말에 댄스 대회가 있어.)","함정: B의 'I hope you do well.'은 응원(희망 표현)이지 같이 가자는 제안이 아님"],"why":"A는 이번 주말 댄스 대회가 있고 B는 잘하길 바란다고 응원한다."}],"dlg":[["A","I have a dance contest this weekend.","나는 이번 주말에 댄스 대회가 있어."],["B","Really? I hope you do well.","정말? 잘하길 바라."],["A","Thanks.","고마워."]]},{"qs":[{"n":2,"q":"Chris의 기분으로 알맞은 것은?","o":["지루하다","약간 긴장된다","화가 난다","자랑스럽다","피곤하다"],"a":1,"ans":"약간 긴장된다","evs":[["Good, but I'm a little nervous.","좋아요, 하지만 조금 긴장돼요."],["You'll be all right. I hope you make lots of friends, soon.","괜찮을 거야. 곧 친구를 많이 사귀길 바란다."]],"ev":["Good, but I'm a little nervous.","좋아요, 하지만 조금 긴장돼요."],"ow":["오답 ✕ — Chris는 \"Good, but I'm a little nervous.\"(좋아요, 하지만 조금 긴장돼요.)라고 했는데, 지루하다는 말은 없어 틀림.","정답 ○ — Chris가 \"I'm a little nervous.\"(조금 긴장돼요.)라고 했으므로 맞음. 선생님도 \"You'll be all right.\"(괜찮을 거야.)라고 달래 주었다.","오답 ✕ — 화가 났다는 말은 없다. Chris는 \"I hope so, too. Thank you, Ms. Lee.\"(저도 그러길 바라요. 감사합니다.)라고 고마워했다.","오답 ✕ — 자랑스럽다는 말은 없다. Chris는 \"I'm a little nervous.\"(조금 긴장돼요.)라고 말했다.","오답 ✕ — 피곤하다는 말은 없다. 가장 가까운 문장은 \"Good, but I'm a little nervous.\"(좋아요, 하지만 조금 긴장돼요.)이다."],"memo":["정답 ②: 약간 긴장된다 (a little nervous)","근거: Good, but I'm a little nervous.(좋아요, 하지만 조금 긴장돼요.)","함정: 'Good'(좋아요)만 보고 기분이 편하다고 고르면 ✕, 뒤에 but이 있음"],"why":"개학 첫날 Chris는 조금 긴장했고 선생님은 응원해 준다."}],"dlg":[["Ms. Lee","Today is the first day of school. How's it going, Chris?","오늘은 개학 첫날이구나. 어떻게 지내고 있니, 크리스?"],["Chris","Good, but I'm a little nervous.","좋아요, 하지만 조금 긴장돼요."],["Ms. Lee","You'll be all right. I hope you make lots of friends, soon.","괜찮을 거야. 곧 친구를 많이 사귀길 바란다."],["Chris","I hope so, too. Thank you, Ms. Lee.","저도 그러길 바라요. 감사합니다, 이 선생님."]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["소미는 방금 VANK라는 NGO에 가입했다.","VANK의 목적은 한국을 세계에 알리는 것이다.","소미는 한국 역사와 문화에 관심이 있다.","Hopkins 선생님은 소미가 VANK에 가입한 것은 딱 맞는 선택이었다고 생각한다.","소미는 영어 실력에 자신감을 보인다."],"a":4,"ans":"소미는 영어 실력에 자신감을 보인다.","evs":[["Well, I just joined the NGO VANK. Remember? You once talked about it in class.","음, 저 방금 NGO인 VANK에 가입했어요. 기억하세요? 수업 시간에 한 번 말씀하셨잖아요."],["Of course, I do. Its main goal is to introduce Korea to the world.","물론 기억하지. 그곳의 주된 목표는 한국을 세계에 알리는 거란다."],["You know, I'm interested in Korean history and culture.","아시다시피, 저는 한국 역사와 문화에 관심이 있어요."],["Then, it's the perfect choice for you. So, what are you worried about?","그렇다면 너에게 딱 맞는 선택이구나. 그럼, 뭐가 걱정이니?"],["Well, it's just … my English is not good enough.","음, 그냥… 제 영어가 충분히 좋지 않아서요."]],"ev":["Well, I just joined the NGO VANK. Remember? You once talked about it in class.","음, 저 방금 NGO인 VANK에 가입했어요. 기억하세요? 수업 시간에 한 번 말씀하셨잖아요."],"ow":["오답 ✕ — 소미가 \"I just joined the NGO VANK.\"(저 방금 NGO인 VANK에 가입했어요.)라고 했으므로 일치하는 보기임. 일치하지 않는 것을 찾는 문제라 답이 아님.","오답 ✕ — \"Its main goal is to introduce Korea to the world.\"(그곳의 주된 목표는 한국을 세계에 알리는 거란다.)라고 했으므로 일치하는 보기임. 답이 아님.","오답 ✕ — 소미가 \"I'm interested in Korean history and culture.\"(저는 한국 역사와 문화에 관심이 있어요.)라고 했으므로 일치하는 보기임. 답이 아님.","오답 ✕ — 선생님이 \"Then, it's the perfect choice for you.\"(그렇다면 너에게 딱 맞는 선택이구나.)라고 했으므로 일치하는 보기임. 답이 아님.","정답 ○ — 소미는 \"my English is not good enough\"(제 영어가 충분히 좋지 않아서요)라고 했으므로 영어 실력에 자신감이 없음. 자신감을 보인다는 보기는 일치하지 않음."],"memo":["정답 ⑤: 소미는 영어 실력에 자신감을 보인다. (본문과 다름)","근거: my English is not good enough.(제 영어가 충분히 좋지 않아서요.)","함정: 소미의 걱정은 영어 실력이고, 자신감이 아니라 걱정을 보임"],"why":"소미는 영어가 충분히 좋지 않다고 걱정하므로 자신감이 있다는 말은 틀리다."},{"n":4,"q":"소미가 걱정하는 것으로 알맞은 것은?","o":["VANK에 가입하는 방법","영어 실력이 충분하지 않은 것","한국 역사 시험","홉킨스 선생님과의 관계","새 친구를 사귀는 것"],"a":1,"ans":"영어 실력이 충분하지 않은 것","evs":[["Then, it's the perfect choice for you. So, what are you worried about?","그렇다면 너에게 딱 맞는 선택이구나. 그럼, 뭐가 걱정이니?"],["Well, it's just … my English is not good enough.","음, 그냥… 제 영어가 충분히 좋지 않아서요."]],"ev":["Then, it's the perfect choice for you. So, what are you worried about?","그렇다면 너에게 딱 맞는 선택이구나. 그럼, 뭐가 걱정이니?"],"ow":["오답 ✕ — 소미는 이미 \"I just joined the NGO VANK.\"(방금 VANK에 가입했어요.)라고 했으므로 가입 방법이 걱정은 아니라서 틀림.","정답 ○ — 선생님이 \"what are you worried about?\"(뭐가 걱정이니?)라고 묻자 소미는 \"my English is not good enough\"(제 영어가 충분히 좋지 않아서요)라고 답했으므로 맞음.","오답 ✕ — 한국 역사는 소미의 관심사('I'm interested in Korean history and culture.')이지 걱정이 아니라서 틀림.","오답 ✕ — 선생님과의 관계에 대한 걱정은 나오지 않는다. 선생님은 \"Your English is OK.\"(네 영어는 괜찮아.)라고 격려해 주었다.","오답 ✕ — 친구를 사귀는 것에 대한 언급이 없다. 소미의 걱정은 영어 실력이다."],"memo":["정답 ②: 영어 실력이 충분하지 않은 것","근거: Well, it's just … my English is not good enough.(제 영어가 충분히 좋지 않아서요.)","함정: 한국 역사는 걱정이 아니라 소미의 관심사"],"why":"소미의 걱정은 영어 실력이 충분하지 않다는 것이다."}],"dlg":[["M","You look a little worried, Somi.","소미야, 너 조금 걱정스러워 보이는구나."],["G","Well, 험이 있어."],["G","Good luck, Minsu. I hope you do well on it.","행운을 빌어, 민수야. 시험을 잘 보길 바라."],["B","Thanks, but I'm a little nervous. I don't think I'm well prepared.","고마워, 그런데 조금 긴장돼. 준비가 잘 된 것 같지 않아."],["G","Don't worry. You'll do fine.","걱정하지 마. 너는 잘할 거야."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["My Happy Moments with Dolphins","Various Activities in Dolphin Lovers","Why Are Dolphins Endangered?","Why Did I Join Dolphin Lovers?","How Can I Join an NGO?"],"a":3,"ans":"Why Did I Join Dolphin Lovers?","evs":[["Then, I learned that many dolphins are in danger.","그러다 많은 돌고래들이 위험에 처해 있다는 것을 알았다."],["I thought I should do something.","나는 무언가 해야겠다고 생각했다."],["So, I searched the Internet and found an NGO, Dolphin Lovers.","그래서 인터넷을 검색하다가 NGO인 Dolphin Lovers를 찾았다."],["After some thought, I joined it today.","고민 끝에, 나는 오늘 이곳에 가입했다."]],"ev":["Then, I learned that many dolphins are in danger.","그러다 많은 돌고래들이 위험에 처해 있다는 것을 알았다."],"ow":["오답 ✕ — 본문은 'Then, I learned that many dolphins are in danger.'(그러다 많은 돌고래들이 위험에 처해 있다는 것을 알았다.)처럼 돌고래의 위기가 시작이고, 즐거운 순간을 모은 글이 아니라서 틀림.","오답 ✕ — 'It does various activities such as cleaning up beaches and helping dolphins.'(이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다.)는 한 문장일 뿐 글 전체의 중심이 아니라서 너무 좁아서 틀림.","오답 ✕ — 'Some are even endangered.'(일부는 심지어 멸종 위기에 처해 있다.)가 나오지만 멸종 이유를 설명하지 않고 가입하게 된 과정을 말하는 글이라 틀림.","정답 ○ — 'I thought I should do something.'(나는 무언가 해야겠다고 생각했다.)에서 'I joined it today.'(오늘 이곳에 가입했다.)까지 돌고래를 위해 Dolphin Lovers에 가입한 이유를 쓴 글이므로 맞음.","오답 ✕ — 'I joined it today.'(고민 끝에, 나는 오늘 이곳에 가입했다.)라고 가입했다는 사실만 말할 뿐 NGO에 가입하는 방법을 설명하지 않아 틀림."],"memo":["정답 ④: Why Did I Join Dolphin Lovers?","근거: I thought I should do something.(나는 무언가 해야겠다고 생각했다.) → I joined it today.(오늘 이곳에 가입했다.)","함정: ⑤는 가입 '방법'이 아니라 가입한 '이유'를 쓴 글이라 ✕"],"why":"돌고래가 위험에 처한 것을 알고 Dolphin Lovers에 가입하게 된 이유를 쓴 글이다."},{"n":7,"q":"Dolphin Lovers가 하는 활동으로 본문에 나온 것은?","o":["돌고래 쇼 열기","해변 청소하기","수족관 운영하기","돌고래 먹이 팔기","어망 만들기"],"a":1,"ans":"해변 청소하기","evs":[["It does various activities such as cleaning up beaches and helping dolphins.","이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다."]],"ev":["It does various activities such as cleaning up beaches and helping dolphins.","이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다."],"ow":["오답 ✕ — 지문에 돌고래 쇼에 대한 언급이 없다. 가장 가까운 문장은 'It does various activities such as cleaning up beaches and helping dolphins.'(해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다.)이다.","정답 ○ — 'It does various activities such as cleaning up beaches and helping dolphins.'(이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다.)라고 했으므로 맞음.","오답 ✕ — 수족관 운영은 나오지 않는다. 'It does various activities such as cleaning up beaches'(해변 청소 같은 활동을 한다)라고만 했다.","오답 ✕ — 돌고래 먹이를 판다는 언급이 없다. 'helping dolphins'(돌고래 돕기)는 먹이를 파는 활동이 아니라서 틀림.","오답 ✕ — 어망은 돌고래가 다치거나 죽는 원인으로만 나오고, 단체가 어망을 만든다는 말은 없어 틀림."],"memo":["정답 ②: 해변 청소하기","근거: It does various activities such as cleaning up beaches and helping dolphins.","함정: 'helping dolphins'는 돌고래 돕기이지 돌고래 쇼가 아님"],"why":"Dolphin Lovers는 해변 청소하기와 돌고래 돕기 같은 활동을 한다."}],"pp":[["JAN 5","1월 5일"],["I grew up in Jeju-do, so I had many chances to see dolphins.","나는 제주도에서 자라서 돌고래를 볼 기회가 많았다."],["Then, I learned that many dolphins are in danger.","그러다 많은 돌고래들이 위험에 처해 있다는 것을 알았다."],["Some are even endangered.","일부는 심지어 멸종 위기에 처해 있다."],["I thought I should do something.","나는 무언가 해야겠다고 생각했다."],["So, I searched the Internet and found an NGO, Dolphin Lovers.","그래서 인터넷을 검색하다가 NGO인 Dolphin Lovers를 찾았다."],["It does various activities such as cleaning up beaches and helping dolphins.","이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다."],["After some thought, I joined it today.","고민 끝에, 나는 오늘 이곳에 가입했다."]]},{"qs":[{"n":8,"q":"윗글의 내용을 요약한 아래 문장의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["paper - cleanup","food - birthday","plastic - birthday","plastic - cleanup","metal - dance"],"a":3,"ans":"plastic - cleanup","evs":[["Many dolphins get sick or even die because of plastic waste and fishing nets, so cleaning up beaches is important.","많은 돌고래들이 플라스틱 쓰레기와 어망 때문에 병에 걸리거나 심지어 죽기도 하므로 해변을 청소하는 것은 중요하다."],["There was a beach cleanup party today, and I took part in it.","오늘 해변 청소 모임이 있었고, 나는 그 모임에 참가했다."]],"ev":["Many dolphins get sick or even die because of plastic waste and fishing nets, so cleaning up beaches is important.","많은 돌고래들이 플라스틱 쓰레기와 어망 때문에 병에 걸리거나 심지어 죽기도 하므로 해변을 청소하는 것은 중요하다."],"ow":["오답 ✕ — 본문은 'because of plastic waste and fishing nets'(플라스틱 쓰레기와 어망 때문에)라고 했으므로 (A)는 paper(종이)가 아니라 plastic이라 틀림. (B) cleanup은 맞지만 (A)가 틀림.","오답 ✕ — 돌고래가 아픈 이유는 음식(food)이 아니라 plastic waste이고, 모임도 'beach cleanup party'(해변 청소 모임)이지 birthday가 아니라서 틀림.","오답 ✕ — (A) plastic은 맞지만 'There was a beach cleanup party today'(오늘 해변 청소 모임이 있었다)라고 했으므로 birthday(생일)는 틀림.","정답 ○ — 'plastic waste and fishing nets'(플라스틱 쓰레기와 어망)와 'There was a beach cleanup party today, and I took part in it.'(오늘 해변 청소 모임이 있었고 나는 참가했다.)에 맞음.","오답 ✕ — 본문의 원인은 metal(금속)이 아니라 plastic waste이고 모임도 dance(춤) 모임이 아니라 cleanup 모임이라 틀림."],"memo":["정답 ④: plastic - cleanup","근거: Many dolphins get sick or even die because of plastic waste and fishing nets","함정: 모임은 파티지만 목적은 해변 청소(cleanup)"],"why":"플라스틱 쓰레기와 어망 때문에 돌고래가 위험해서 인호는 해변 청소 모임에 참가했다.","sum":"Many dolphins get sick or die because of (A) waste and fishing nets, so Inho took part in a beach (B) party.","lab":"완성된 요약문 : "}],"pp":[["JAN 20","1월 20일"],["Many dolphins get sick or even die because of plastic waste and fishing nets, so cleaning up beaches is important.","많은 돌고래들이 플라스틱 쓰레기와 어망 때문에 병에 걸리거나 심지어 죽기도 하므로 해변을 청소하는 것은 중요하다."],["There was a beach cleanup party today, and I took part in it.","오늘 해변 청소 모임이 있었고, 나는 그 모임에 참가했다."],["Cleaning up the beach was not easy, but I enjoyed it.","해변을 청소하는 일이 쉽지는 않았지만 즐거웠다."],["Oh, I saw Aunt Sumi there.","아, 그곳에서 나는 수미 이모를 만났다."],["She is also a member of Dolphin Lovers.","그녀도 Dolphin Lovers 회원이다."],["What a small world!","세상이 참 좁다!"]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하지 않는 것은?","o":["한라와 올레는 제주도의 한 수족관에 사는 돌고래다.","Dolphin Lovers는 한라와 올레를 바다로 돌려보내는 프로젝트를 진행 중이다.","바다로 돌아가 생존하기 위해 한라와 올레는 몇 가지 기술을 배워야 한다.","인호는 한라와 올레의 훈련 수업에 일원이 되는 기회를 얻었다.","훈련 수업에서
