<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>주니어 리딩튜터 스타터 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.gl{margin:2px 0 10px;color:var(--muted);font-size:14px}.gl2{color:var(--muted);font-weight:400;font-size:.92em}.sq{margin:0 0 2px;font-size:16px}.sq u{text-decoration-thickness:2px;text-underline-offset:3px;font-weight:700}.rw{margin:6px 0;font-weight:700}
</style>

<script>
var P=[{"u":1,"id":"rt2-01-1","no":1,"ko":"크래커도 숨을 쉬어요","items":[{"n":1,"t":"tf","q":"All crackers have holes.","ko":"모든 크래커에는 구멍이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"They all have holes.","그것들은 모두 구멍들을 가지고 있다."]],"w":"5번 문장에 They all have holes가 있어요. 모양과 맛이 달라도 모든 크래커에 구멍이 있다는 내용과 같아요.","c":"T"},"h":"f7ceef52a8"},{"n":2,"t":"tf","q":"Crackers have only one flavor.","ko":"크래커는 맛이 한 가지뿐이다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"They have different flavors.","그것들은 여러 가지 맛이 있다."]],"w":"2번 문장에서 크래커는 different flavors(여러 가지 맛)를 가지고 있다고 해요. 한 가지뿐이라는 말은 반대예요.","c":"F"},"h":"1648aa0626"},{"n":3,"t":"tf","q":"Cracker dough is heated in an oven.","ko":"크래커 반죽은 오븐에서 가열된다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The dough is heated in an oven.","반죽이 오븐에서 가열된다."]],"w":"8번 문장에 The dough is heated in an oven이 그대로 있어요. is heated는 '가열된다'는 뜻이에요.","c":"T"},"h":"0fc05b2f96"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Crackers are a popular snack.)","ko":"크래커는 인기 있는 간식이다.","opts":["값비싼","건강한","오래된","인기 있는"],"word":"popular","r":{"a":"4) 인기 있는","ev":"1번 문장","s":[[1,"Crackers are a popular snack.","크래커는 인기 있는 간식이다."]],"w":"1번 문장은 크래커를 소개하는 첫 문장이에요. 맛과 모양이 여러 가지로 많이 찾는 간식이라서 popular는 '인기 있는'이에요.","c":4},"h":"238b8a59bb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then the bubbles get bigger and pop.)","ko":"그러면 기포는 더 커지며 터진다.","opts":["녹는다","가라앉는다","펑 하고 터진다","차가워진다"],"word":"pop","r":{"a":"3) 펑 하고 터진다","ev":"9번 문장","s":[[9,"Then the bubbles get bigger and pop.","그러면 기포는 더 커지며 터진다."]],"w":"9번에서 기포가 커지다가 어떻게 되는지 보면 돼요. 기포(공기 방울)는 커지다가 펑 하고 터져요. pop = 펑 하고 터지다.","c":3},"h":"994c913fbe"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt makes tiny holes in the crackers.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 크래커에 아주 작은 구멍들을 만든다.","opts":["오븐","특별한 기계","크래커","반죽"],"r":{"a":"2) 특별한 기계","ev":"11~12번 문장","s":[[11,"So a special machine is used.","그래서 한 특별한 기계가 사용된다."],[12,"It makes tiny holes in the crackers.","그것은 크래커에 아주 작은 구멍들을 만든다."]],"c":2,"k":"It = 특별한 기계"},"h":"bf23b91390","pron":"It"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But they have one thing in common.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그것들은 한 가지를 공통적으로 가지고 있다.","opts":["하지만 그것들은 한 가지 공통점을 가지고 있다.","하지만 그것들은 서로 전혀 닮은 점이 없다.","하지만 그것들은 한 가지만 먹을 수 있다.","하지만 그것들은 모두 한 가지 맛이다."],"r":{"a":"1) 하지만 그것들은 한 가지 공통점을 가지고 있다.","ev":"4번 문장","s":[[4,"But they have one thing in common.","하지만 그것들은 한 가지를 공통적으로 가지고 있다."]],"c":1},"h":"78cc5fe933"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["모든 크래커는 모양과 크기가 똑같다.","크래커 반죽에는 기포가 전혀 없다.","크래커는 다양한 모양과 크기로 나온다.","특별한 기계는 크래커를 달콤하게 만든다."],"opts":["All crackers have the same shape and size.","Cracker dough has no air bubbles.","Crackers come in many shapes and sizes.","A special machine makes crackers sweet."],"r":{"a":"3) Crackers come in many shapes and sizes. (크래커는 다양한 모양과 크기로 나온다.)","ev":"3번 문장","s":[[3,"There are many shapes and sizes, too.","많은 모양과 크기도 있다."]],"c":3},"h":"3c30934c4f"},{"n":9,"t":"sum","q":"When the bubbles in the dough get (A) and pop, crackers get a (B) shape.","ko":"반죽 속 기포가 (A) 터지면, 크래커는 (B) 모양이 된다.","oko":["A 더 작아져서 / B 완벽한","A 더 커져서 / B 아주 작은","A 더 작아져서 / B 이상한","A 더 커져서 / B 이상한","A 더 커져서 / B 둥근"],"opts":["(A) smaller / (B) perfect","(A) bigger / (B) tiny","(A) smaller / (B) strange","(A) bigger / (B) strange","(A) bigger / (B) round"],"r":{"a":"4) (A) bigger / (B) strange (A 더 커져서 / B 이상한)","ev":"9~10번 문장","s":[[9,"Then the bubbles get bigger and pop.","그러면 기포는 더 커지며 터진다."],[10,"This gives crackers a strange shape.","이것은 크래커를 이상한 모양으로 만든다."]],"c":4},"h":"3d11595493"},{"n":10,"t":"fill","q":"The air comes out [A] the holes, so the crackers stay [B] and perfect.","ko":"공기가 구멍들을 [A] 나오고, 그래서 크래커는 [B] 완벽하게 유지된다.","bank":["through","flat","tiny","strange","then","finally"],"bko":{"through":"통해","flat":"평평하고","tiny":"아주 작은","strange":"이상한","then":"그러면","finally":"마침내"}, ","s":[[6,"It starts at 6 a.m. and continues for 24 hours.","그것은 오전 6시에 시작해서 24시간 동안 계속된다."]],"w":"6번 문장에 It starts at 6 a.m. and continues for 24 hours라고 그대로 나와요.","c":"T"},"h":"d3b7d9327e"},{"n":2,"t":"tf","q":"On Nyepi, planes fly and restaurants open as usual.","ko":"녜삐에도 비행기는 날고 식당은 평소처럼 연다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"No planes fly and no restaurants open.","비행기가 날지 않고 식당은 열지 않는다."]],"w":"10번에서 No planes fly and no restaurants open이라고 해요. 비행기도 날지 않고 식당도 열지 않아요.","c":"F"},"h":"51e3b74ec2"},{"n":3,"t":"tf","q":"Most people around the world celebrate the New Year quietly.","ko":"세계 대부분의 사람들은 새해를 조용히 기념한다.","r":{"a":"F (본문과 다른 내용)","ev":"1~2번 문장","s":[[1,"Most people around the world have lively New Year’s parties.","세계 대부분의 사람들이 활기 넘치는 새해 파티를 한다."],[2,"But the Balinese welcome their New Year differently.","그러나 발리 사람들은 새해를 다르게 맞이한다."]],"w":"1번에서 세계 대부분의 사람들은 활기 넘치는 새해 파티를 한다고 하고, 2번에서 발리 사람들만 새해를 다르게 맞이한다고 해요.","c":"F"},"h":"87a6688754"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (On this day, people clear their minds.)","ko":"이날, 사람들은 마음을 깨끗하게 한다.","opts":["복잡하게 만든다","닫는다","깨끗하게 한다","가르친다"],"word":"clear","r":{"a":"3) 깨끗하게 한다","ev":"7~8번 문장","s":[[7,"On this day, people clear their minds.","이날, 사람들은 마음을 깨끗하게 한다."],[8,"They don’t make any noise.","그들은 어떠한 소리도 내지 않는다."]],"w":"7번 뒤 8번에서 사람들이 어떤 소리도 내지 않는다고 해요. 마음을 깨끗하게 비운다는 뜻이에요.","c":3},"h":"7346e5a3ed"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They celebrate it with Nyepi!)","ko":"그들은 그것을 녜삐로 celebrate한다!","opts":["슬퍼하다","기념하다","잊다","끝내다"],"word":"celebrate","r":{"a":"2) 기념하다","ev":"3번 문장","s":[[3,"They celebrate it with Nyepi!","그들은 그것을 녜삐로 기념한다!"]],"w":"2번에서 발리 사람들은 새해를 다르게 맞이한다고 했고, 3번은 그 방법이 Nyepi라고 말해요. 새해를 녜삐로 '기념한다'는 뜻이에요. (celebrate = 기념하다, 축하하다)","c":2},"h":"f480d4a81a"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThey celebrate it with Nyepi!","ko":"밑줄 친 it이 가리키는 것은?","sko":"그들은 그것을 녜삐로 보낸다!","opts":["세계 대부분 사람들의 새해 파티","발리 사람들의 새해","녜삐라는 침묵의 날","발리의 달력"],"r":{"a":"2) 발리 사람들의 새해","ev":"2~3번 문장","s":[[2,"But the Balinese welcome their New Year differently.","그러나 발리 사람들은 새해를 다르게 맞이한다."],[3,"They celebrate it with Nyepi!","그들은 그것을 녜삐로 기념한다!"]],"c":2,"k":"it = 발리 사람들의 새해"},"pron":"it","h":"b16eefd560"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This helps keep the balance between nature and humans.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 자연과 인간 사이의 균형을 유지하는 것을 돕는다.","opts":["이것은 자연과 인간을 서로 멀어지게 한다.","이것은 자연과 인간 사이의 균형을 유지하는 것을 돕는다.","이것은 인간이 자연보다 더 강해지게 한다.","이것은 자연이 인간을 대신해 일하게 한다."],"r":{"a":"2) 이것은 자연과 인간 사이의 균형을 유지하는 것을 돕는다.","ev":"8~9번 문장","s":[[8,"They don’t make any noise.","그들은 어떠한 소리도 내지 않는다."],[9,"This helps keep the balance between nature and humans.","이는 자연과 인간 사이의 균형을 유지하는 것을 돕는다."]],"c":2},"h":"148c7690fa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["발리 사람들은 시끄러운 새해 파티를 한다.","녜삐는 사카 달력의 마지막 날에 열린다.","녜삐는 24시간 동안 계속된다.","녜삐에 식당들은 밤늦게까지 문을 연다."],"opts":["The Balinese have loud New Year’s parties.","Nyepi is held on the last day of the saka calendar.","Nyepi continues for 24 hours.","Restaurants stay open late on Nyepi."],"r":{"a":"3) Nyepi continues for 24 hours. (녜삐는 24시간 동안 계속된다.)","ev":"2, 5, 6, 10번 문장","s":[[2,"But the Balinese welcome their New Year differently.","그러나 발리 사람들은 새해를 다르게 맞이한다."],[5,"It takes place on the first day of the Balinese saka calendar.","그것은 발리식 ‘사카’ 달력의 첫날에 이루어진다."],[6,"It starts at 6 a.m. and continues for 24 hours.","그것은 오전 6시에 시작해서 24시간 동안 계속된다."],[10,"No planes fly and no restaurants open.","비행기가 날지 않고 식당은 열지 않는다."]],"c":3},"h":"130cb57072"},{"n":9,"t":"sum","q":"On Nyepi, people stay (A) and do not make any (B).","ko":"녜삐에 사람들이 머무는 곳: (A) / 내지 않는 것: 어떠한 (B)","oko":["A 야외 / B 소리","A 실내 / B 돈","A 혼자 / B 소리","A 야외 / B 평화","A 실내 / B 소리"],"opts":["(A) outdoors / (B) noise","(A) indoors / (B) money","(A) alone / (B) noise","(A) outdoors / (B) peace","(A) indoors / (B) noise"],"r":{"a":"5) (A) indoors / (B) noise (A 실내 / B 소리)","ev":"8, 11번 문장","s":[[8,"They don’t make any noise.","그들은 어떠한 소리도 내지 않는다."],[11,"People should stay indoors on Nyepi.","녜삐에 사람들은 실내에 머물러야 한다."]],"c":5},"h":"b14dc19fb5"},{"n":10,"t":"fill","q":"If all is quiet on Nyepi, [A] think no one is there and leave, and this brings good [B] to Bali.","ko":"녜삐에 모두가 조용하면 [A]은(는) 아무도 없다고 생각해서 떠나고, 이것은 발리에 좋은 [B]을(를) 가져다준다.","bank":["demons","luck","quiet","fooled","indoors","there"],"bko":{"demons":"악령","luck":"행운","quiet":"조용한","fooled":"속은","indoors":"실내에서","there":"그곳에"},"r":{"a":"[A] demons (악령), [B] luck (행운)","ev":"12~14번 문장","s":[[12,"The Balinese think demons will be fooled if all is quiet on Nyepi.","발리 사람들은 녜삐에 모두가 조용하면 악령이 속을 거라고 생각한다."],[13,"The demons will think no one is there and leave.","악령은 그곳에 아무도 없다고 생각해서 떠날 것이다."],[14,"This will bring good luck and peace to Bali.","이것이 발리에 행운과 평화를 가져다줄 것이다."]],"c":null},"h":"453b8e3e2b"}]},{"u":4,"id":"rt2-04-1","no":1,"ko":"아래로 더 아래로","items":[{"n":1,"t":"tf","q":"Players stand about 10 steps away from each other at the start.","ko":"선수들은 시작할 때 서로 약 10걸음 떨어져 선다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"First, find a partner.","먼저, 짝을 찾아라."],[4,"Stand about 10 steps away from each other.","서로 약 10걸음 정도 떨어져 서라."]],"w":"4번에 Stand about 10 steps away from each other가 나와요. 먼저 짝을 찾은 뒤(3번) 그렇게 서요.","c":"T"},"h":"3863e047af"},{"n":2,"t":"tf","q":"A player takes a step back when he or she drops the ball.","ko":"선수는 공을 떨어뜨리면 한 걸음 뒤로 물러난다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"If no one drops the ball for a long time, each player takes a step back.","만약 아무도 오랫동안 그 공을 떨어뜨리지 않으면, 각 선수는 한 걸음 뒤로 물러난다."],[7,"However, if you drop the ball, you must go down on one knee.","하지만, 당신이 그 공을 떨어뜨리면, 한쪽 무릎을 꿇어야 한다."]],"w":"한 걸음 뒤로 물러나는 것은 오랫동안 아무도 공을 떨어뜨리지 않을 때예요(6번). 공을 떨어뜨리면 한쪽 무릎을 꿇어요(7번).","c":"F"},"h":"5529b251da"},{"n":3,"t":"tf","q":"The name of the game is Down, Down, Down.","ko":"그 게임의 이름은 다운, 다운, 다운이다.","r" ":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is called Bosco Verticale.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 보스코 베르티칼레라고 불린다.","opts":["이탈리아의 밀라노라는 도시","밀라노에 있는 유명한 녹색 건물","건축가들","야외 정원의 식물"],"r":{"a":"2) 밀라노에 있는 유명한 녹색 건물","ev":"10~11번 문장","s":[[10,"One of the most famous green buildings is in Milan, Italy.","가장 유명한 녹색 건물 중 하나는 이탈리아의 밀라노에 있다."],[11,"It is called Bosco Verticale.","그것은 보스코 베르티칼레라고 불린다."]],"c":2,"k":"It = 밀라노에 있는 유명한 녹색 건물"},"pron":"It","h":"d99a189e3d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So people in cities have found a new place for plants and trees — high above their heads.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 도시의 사람들은 식물과 나무를 위한 새로운 장소를 찾았는데, 바로 머리 위 높은 곳이다.","opts":["도시 사람들은 식물과 나무를 위한 새로운 장소를 머리 위 높은 곳에서 찾았다.","도시 사람들은 식물과 나무를 땅 밑에 심을 새로운 장소를 찾았다.","도시 사람들은 머리 위에 있는 식물과 나무를 모두 없애 버렸다.","도시 사람들은 식물과 나무 없이 사는 새로운 방법을 찾았다."],"r":{"a":"1) 도시 사람들은 식물과 나무를 위한 새로운 장소를 머리 위 높은 곳에서 찾았다.","ev":"7번 문장","s":[[7,"So people in cities have found a new place for plants and trees — high above their heads.","그래서 도시의 사람들은 식물과 나무를 위한 새로운 장소를 찾았는데, 바로 머리 위 높은 곳이다."]],"c":1},"h":"7f50a8d70f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대부분의 도시에는 땅 위에 식물을 위한 공간이 많다.","보스코 베르티칼레는 이탈리아의 로마에 있다.","식물과 나무는 도시를 더 덥게 만든다.","보스코 베르티칼레라는 이름은 ‘수직의 숲’을 의미한다."],"opts":["Most cities have a lot of space for plants on the ground.","Bosco Verticale is in Rome, Italy.","Plants and trees make cities hotter.","The name Bosco Verticale means “the vertical forest.”"],"r":{"a":"4) The name Bosco Verticale means “the vertical forest.” (보스코 베르티칼레라는 이름은 ‘수직의 숲’을 의미한다.)","ev":"10~12번 문장","s":[[10,"One of the most famous green buildings is in Milan, Italy.","가장 유명한 녹색 건물 중 하나는 이탈리아의 밀라노에 있다."],[11,"It is called Bosco Verticale.","그것은 보스코 베르티칼레라고 불린다."],[12,"Its name means “the vertical forest.”","그것의 이름은 ‘수직의 숲’을 의미한다."]],"c":4},"h":"5baf02ccc3"},{"n":9,"t":"sum","q":"Plants and trees clean the (A) and prevent (B) by absorbing rain.","ko":"식물과 나무는 (A)을(를) 깨끗하게 하고 빗물을 흡수해서 (B)을(를) 막는다.","oko":["A 공기 / B 홍수","A 물 / B 홍수","A 공기 / B 소음","A 땅 / B 화재","A 빛 / B 비"],"opts":["(A) air / (B) flooding","(A) water / (B) flooding","(A) air / (B) noise","(A) ground / (B) fire","(A) light / (B) rain"],"r":{"a":"1) (A) air / (B) flooding (A 공기 / B 홍수)","ev":"4~5번 문장","s":[[4,"They clean the air.","그것들은 공기를 깨끗하게 한다."],[5,"They also prevent flooding by absorbing rain.","그것들은 또한 빗물을 흡수함으로써 홍수를 방지한다."]],"c":1},"h":"992b1cc6eb"},{"n":10,"t":"fill","q":"Sometimes, plants and trees [A] homes for animals and help people [B].","ko":"때때로 식물과 나무는 동물들에게 서식지를 [A]하고 사람들의 [B]을(를) 돕는다.","bank":["provide","relax","absorb","crowded","famous","grown"],"bko":{"provide":"제공","relax":"휴식","absorb":"흡수","crowded":"혼잡","famous":"유명","grown":"성장"},"r":{"a":"[A] provide (제공), [B] relax (휴식)","ev":"6번 문장","s":[[6,"Sometimes, they provide homes for animals and help people relax.","때때로 그것들은 동물들에게 서식지를 제공하고 사람들이 휴식하도록 돕는다."]],"c":null},"h":"eb68f3dbac"}]},{"u":6,"id":"rt2-06-1","no":1,"ko":"후~ 생일 축하해","items":[{"n":1,"t":"tf","q":"The ancient Greeks gave gifts to Artemis, the goddess of the moon.","ko":"고대 그리스인들은 달의 여신인 아르테미스에게 선물을 바쳤다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"They gave gifts to Artemis, the goddess of the moon.","그들은 달의 여신인 아르테미스에게 선물을 바쳤다."]],"w":"5번에서 They gave gifts to Artemis, the goddess of the moon이라고 해요. They는 4번의 고대 그리스인들이에요.","c":"T"},"h":"54b09f61eb"},{"n":2,"t":"tf","q":"German parents served a cake with the same number of candles as the child’s age.","ko":"독일 부모는 아이의 나이와 같은 수의 초를 꽂은 케이크를 내어 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Parents served a cake with the same number of candles as the child’s age plus one.","부모는 아이의 나이에 하나를 더한 것과 같은 수의 초를 꽂아 케이크를 내어 주었다."]],"w":"11번에서 아이의 나이에 하나를 더한(plus one) 수의 초를 꽂았다고 해요. 나이와 같은 수가 아니라 하나 더 많아요.","c":"F"},"h":"0f2d13f297"},{"n":3,"t":"tf","q":"Some people believed that smoke from candles carried prayers to heaven.","ko":"어떤 사람들은 초에서 나온 연기가 기도를 하늘로 실어 나른다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Some people believed that smoke from candles carried prayers to heaven.","어떤 사람들은 초에서 나온 연기가 기도를 하늘로 실어 나른다고 믿었다."]],"w":"8번에 그대로 나오는 내용이에요.","c":"T"},"h":"d3ac4b89f2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Cake with candles is a fun birthday tradition.)","ko":"초를 꽂은 케이크는 재미있는 생일 전통이다.","opts":["전통","요리","놀이","선물"],"word":"tradition","r":{"a":"1) 전통","ev":"1~2번 문장","s":[[1,"Cake with candles is a fun birthday tradition.","초를 꽂은 케이크는 재미있는 생일 전통이다."],[2,"But how did it begin?","그런데 그것이 어떻게 시작되었을까?"]],"w":"1번에서 초를 꽂은 케이크는 재미있는 생일 tradition이라고 하고, 2번에서 그것이 어떻게 시작됐는지 물어요. 오래 이어져 온 관습이니 tradition = 전통.","c":1},"h":"3462562e6f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In the 1700s they started celebrating children’s birthdays with cake.)","ko":"1700년대에 그들은 케이크로 아이들의 생일을 축하하기 시작했다.","opts":["준비하는","숨기는","축하하는","파는"],"word":"celebrating","r":{"a":"3) 축하하는","ev":"10번 문장","s":[[10,"In the 1700s they started celebrating children’s birthdays with cake.","1700년대에 그들은 케이크로 아이들의 생일을 축하하기 시작했다."]],"w":"10번은 아이들의 생일을 케이크로 기념하고 즐기기 시작했다는 뜻이에요. celebrate = 축하하다.","c":3},"h":"fc4f7196c1"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIn the 1700s they started celebrating children’s birthdays with cake.","ko":"밑줄 친 they가 가리키는 것은?","sko":"1700년대에 그들은 케이크로 아이들의 생일을 축하하기 시작했다.","opts":["독일인들","고대 그리스인들","아르테미스와 달의 여신","아이들"],"r":{"a":"1) 독일인들","ev":"9~10번 문장","s":[[9,"However, Germans probably made cake with candles a birthday tradition.","그러나 아마도 독일인들이 초를 꽂은 케이크를 생일 전통으로 만들었을 것이다."],[10,"In the 1700s they started celebrating children’s birthdays with cake.","1700년대에 그들은 케이크로 아이들의 생일을 축하하기 시작했다."]],"c":1,"k":"they = 독일인들"},"h":"0d755465cf","pron":"they"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The ancient Greeks were probably the first to put candles on cake.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아마도 고대 그리스인들이 케이크에 초를 꽂은 최초의 사람들이었을 것이다.","opts":["고대 그리스인들은 케이크를 처음 만든 사람들이었을 것이다.","고대 그리스인들은 아마도 케이크에 초를 처음 꽂은 사람들이었을 것이다.","고대 그리스인들은 케이크에 초를 꽂지 않았을 것이다.","고대 그리스인들은 케이크를 가장 많이 먹은 사람들이었을 것이다."],"r":{"a":"2) 고대 그리스인들은 아마도 케이크에 초를 처음 꽂은 사람들이었을 것이다.","ev":"4번 문장","s":[[4,"The ancient Greeks were probably the first to put candles on cake.","아마도 고대 그리스인들이 케이크에 초를 꽂은 최초의 사람들이었을 것이다."]],"c":2},"h":"b311e50be0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["초를 꽂은 케이크는 1700년대 독일에서 시작되었다.","그리스인들은 아르테미스에게 초가 없는 큰 케이크를 바쳤다.","초에서 나온 빛이 소원을 달로 실어 날랐다.","초를 꽂은 케이크는 고대 그리스로 거슬러 올라간다."],"opts":["Cake with candles began in Germany in the 1700s.","The Greeks gave Artemis big cakes without candles.","Light from candles carried wishes to the moon.","Cake with candles goes back to ancient Greece."],"r":{"a":"4) Cake with candles goes back to ancient Greece. (초를 꽂은 케이크는 고대 그리스로 거슬러 올라간다.)","ev":"3, 6, 8번 문장","s":[[3,"Cake with candles dates back to ancient Greece.","초를 꽂은 케이크는 고대 그리스로 거슬러 올라간다."],[6,"They gave her small cakes with candles.","그들은 그녀에게 초를 꽂은 작은 케이크를 바쳤다."],[8,"Some people believed that smoke from candles carried prayers to heaven.","어떤 사람들은 초에서 나온 연기가 기도를 하늘로 실어 나른다고 믿었다."]],"c":4},"h":"7c34a967c9"},{"n":9,"t":"sum","q":"Parents served a cake with candles as many as the child’s age plus (A), which showed their hope that the children would live (B).","ko":"부모는 아이의 나이에 (A)을(를) 더한 수의 초를 꽂은 케이크를 내어 주었고, 이는 아이들이 더 (B) 살기를 바라는 마음을 나타냈다.","oko":["A 하나 / B 오래","A 하나 / B 짧게","A 둘 / B 오래","A 둘 / B 짧게","A 열 / B 행복하게"],"opts":["(A) one / (B) longer","(A) one / (B) shorter","(A) two / (B) longer","(A) two / (B) shorter","(A) ten / (B) happily"],"r":{"a":"1) (A) one / (B) longer (A 하나 / B 오래)","ev":"11~12번 문장","s":[[11,"Parents served a cake with the same number of candles as the child’s age plus one.","부모는 아이의 나이에 하나를 더한 것과 같은 수의 초를 꽂아 케이크를 내어 주었다."],[12,"It represented the parents’ hope for their children to live longer.","그것은 아이들이 더 오래 살기를 바라는 부모의 바람을 나타냈다."]],"c":1},"h":"8564caa97f"},{"n":10,"t":"fill","q":"The candles [A] the cakes [B] like the moon.","ko":"초는 케이크를 달처럼 [B] [A].","bank":["made","glow","Greece","goddess","parents","heaven"],"bko":{"made":"만들었다(make의 과거)","glow":"빛나게","Greece":"그리스","goddess":"여신","parents":"부모","heaven":"하늘"},"r":{"a":"[A] made (만들었다(make의 과거)), [B] glow (빛나게)","ev":"7번 문장","s":[[7,"The candles made the cakes glow like the moon.","초는 케이크를 달처럼 빛나게 만들었다."]],"c":null},"h":"b44b55cb8b"}]},{"u":6,"id":"rt2-06-2","no":2,"ko":"앗, 뜨거워!","items":[{"n":1,"t":"tf","q":"Scientists compared the effects of ice and other cures for burns.","ko":"과학자들은 화상에 대한 얼음과 다른 치료법의 효과를 비교했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Some scientists compared the treatment effects of ice and other cures.","몇몇 과학자들이 얼음과 다른 치료법의 치료 효과를 비교했다."]],"w":"5번에서 Some scientists compared the treatment effects of ice and other cures라고 해요.","c":"T"},"h":"b2eaeaa407"},{"n":2,"t":"tf","q":"Ice helped burns get better faster.","ko":"얼음은 화상이 더 빨리 낫도록 도왔다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"They found ice actually made the burn get better more slowly.","그들은 얼음이 실제로는 화상을 더 느리게 낫도록 한다는 것을 발견했다."]],"w":"6번에서 얼음은 실제로는 화상을 더 느리게(more slowly) 낫도록 했다고 해요. 더 빨리 낫게 한 것이 아니에요.","c":"F"},"h":"2cc0015a9e"},{"n":3,"t":"tf","q":"You should see a doctor right away for every minor burn.","ko":"가벼운 화상은 모두 바로 진찰을 받아야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"In this way, you can treat most minor burns at home.","이 방법으로, 대부분의 가벼운 화상을 집에서 치료할 수 있다."]],"w":"12번에서 대부분의 가벼운 화상은 집에서 치료할 수 있다고 해요. 2주가 지나도 낫지 않을 때 진찰을 받으라고 해요(13번).","c":"F"},"h":"ac376540a5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You run to get some ice to ease the pain.)","ko":"당신은 통증을 가라앉힐 얼음을 가지러 뛴다.","opts":["늘리다","덜어 주다","만들다","숨기다"],"word":"ease","r":{"a":"2) 덜어 주다","ev":"2번 문장","s":[[2,"You run to get some ice to ease the pain.","당신은 통증을 가라앉힐 얼음을 가지러 뛴다."]],"w":"2번은 통증을 줄이려고 얼음을 가지러 뛴다는 말이에요. ease the pain = 통증을 덜어 주다(가라앉히다).","c":2},"h":"667e7fc25e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, how can we treat a burn?)","ko":"그렇다면, 우리는 어떻게 화상을 치료할 수 있을까?","opts":["치료하다","비교하다","망치다","숨기다"],"word":"treat","r":{"a":"1) 치료하다","ev":"8번 문장","s":[[8,"So, how can we treat a burn?","그렇다면, 우리는 어떻게 화상을 치료할 수 있을까?"]],"w":"8번 질문 뒤에 9번부터 화상을 치료하는 방법이 이어져요. treat = 치료하다.","c":1},"h":"e74b76f9ff"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey found ice actually made the burn get better more slowly.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 얼음이 실제로는 화상을 더 느리게 낫도록 한다는 것을 발견했다.","opts":["화상을 입은 사람들","몇몇 과학자들","의사들","얼음 조각들"],"r":{"a":"2) 몇몇 과학자들","ev":"5~6번 문장","s":[[5,"Some scientists compared the treatment effects of ice and other cures.","몇몇 과학자들이 얼음과 다른 치료법의 치료 효과를 비교했다."],[6,"They found ice actually made the burn get better more slowly.","그들은 얼음이 실제로는 화상을 더 느리게 낫도록 한다는 것을 발견했다."]],"c":2,"k":"They = 몇몇 과학자들"},"h":"d548f3e034","pron":"They"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, see a doctor if your skin doesn’t get better in two weeks.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 피부가 2주가 지나도록 낫지 않으면 진찰을 받아라.","opts":["피부가 2주가 지나도 낫지 않으면 진찰을 받아라.","피부가 2주 안에 나으면 진찰을 받아라.","2주 동안은 의사를 만나지 마라.","피부가 나으면 2주 동안 약을 먹어라."],"r":{"a":"1) 피부가 2주가 지나도 낫지 않으면 진찰을 받아라.","ev":"13번 문장","s":[[13,"However, see a doctor if your skin doesn’t get better in two weeks.","그러나 피부가 2주가 지나도록 낫지 않으면 진찰을 받아라."]],"c":1},"h":"a180d2f300"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["얼음은 화상이 더 빨리 낫게 했다.","화상 입은 곳을 뜨거운 물 아래에 두어야 한다.","얼음은 동상과 심각한 피부 손상을 일으켰다.","가벼운 화상은 항상 병원에서 치료해야 한다."],"opts":["Ice made the burn get better faster.","You should put the burn under hot water.","Ice caused frostbite and serious skin damage.","Minor burns must always be treated in a hospital."],"r":{"a":"3) Ice caused frostbite and serious skin damage. (얼음은 동상과 심각한 피부 손상을 일으켰다.)"  내용)","ev":"12번 문장","s":[[12,"Some people believed they meant bad luck.","어떤 사람들은 그것들이 불운을 의미한다고 믿었다."]],"w":"12번에서 Some people believed they meant bad luck이라고 해요. they는 죽은 고래들이에요.","c":"T"},"h":"1bf75d2090"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She continued to remove the layers of paint.)","ko":"그녀는 물감의 겹들을 계속해서 제거했다.","opts":["멈췄다","시작했다","거절했다","계속했다"],"word":"continued","r":{"a":"4) 계속했다","ev":"8번 문장","s":[[8,"She continued to remove the layers of paint.","그녀는 물감의 겹들을 계속해서 제거했다."]],"w":"8번은 물감을 벗겨 내는 일을 멈추지 않고 이어 갔다는 뜻이에요. 그 결과 9번에서 고래가 나타나요. continue = 계속하다.","c":4},"h":"460a81a7eb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Researchers said dead whales were an unpleasant subject for the people of that time.)","ko":"연구가들은 그 당시의 사람들에게 죽은 고래가 불쾌한 대상이었다고 말했다.","opts":["불쾌한","아름다운","흥미로운","안전한"],"word":"unpleasant","r":{"a":"1) 불쾌한","ev":"11~12번 문장","s":[[11,"Researchers said dead whales were an unpleasant subject for the people of that time.","연구가들은 그 당시의 사람들에게 죽은 고래가 불쾌한 대상이었다고 말했다."],[12,"Some people believed they meant bad luck.","어떤 사람들은 그것들이 불운을 의미한다고 믿었다."]],"w":"11번 뒤에 12번에서 죽은 고래가 불운을 의미한다고 믿었다고 해요. 그러니 unpleasant = 불쾌한(기분이 좋지 않은)이에요.","c":1},"h":"54d3f18350"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSome people believed they meant bad luck.","ko":"밑줄 친 they가 가리키는 것은?","sko":"어떤 사람들은 그것들이 불운을 의미한다고 믿었다.","opts":["죽은 고래들","연구가들","그 당시의 사람들","복원 전문가들"],"r":{"a":"1) 죽은 고래들","ev":"11~12번 문장","s":[[11,"Researchers said dead whales were an unpleasant subject for the people of that time.","연구가들은 그 당시의 사람들에게 죽은 고래가 불쾌한 대상이었다고 말했다."],[12,"Some people believed they meant bad luck.","어떤 사람들은 그것들이 불운을 의미한다고 믿었다."]],"c":1,"k":"they = 죽은 고래들"},"h":"b85cb80d19","pron":"they"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So it is likely that the whale was covered up.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 고래가 완전히 가려졌을 가능성이 있다.","opts":["그래서 고래가 해변으로 올라왔을 것이 확실
