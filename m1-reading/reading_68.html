o": "복수 주어 They는 eat (eats 아님)"}]}, {"n": 6, "tag": "크리스마스섬 붉은게", "en": "On Christmas Island, red crabs live in forests, not in the water.", "ko": "크리스마스섬에서 붉은게는 물속이 아니라 숲에서 산다.", "ok": true, "foot": [], "fixes": []}, {"n": 7, "tag": null, "en": "However, when the rainy season begins on October, millions of red crabs march toward the ocean to laying eggs.", "ko": "하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다.", "ok": false, "foot": [], "fixes": [{"wrong": "on", "right": "in", "partial": false, "at": [6], "point": "기본전치사: '~월에'는 전치사 in 사용", "topic": "기본전치사", "memo": "'~월에'는 전치사 in 사용"}, {"wrong": "laying", "right": "lay", "partial": false, "at": [17], "point": "to부정사: to 뒤에는 동사원형 lay 사용", "topic": "to부정사", "memo": "to 뒤에는 동사원형 lay 사용"}]}, {"n": 8, "tag": null, "en": "During these period, they are all over the place, and the whole island turns redly.", "ko": "이 기간 동안에는 그들이 모든 곳에 걸쳐 있어서 섬 전체가 붉게 변한다.", "ok": false, "foot": [], "fixes": [{"wrong": "these", "right": "this", "partial": false, "at": [1], "point": "지시형용사: 단수명사 period에는 this 사용", "topic": "지시형용사", "memo": "단수명사 period에는 this 사용"}, {"wrong": "redly", "right": "red", "partial": false, "at": [14], "point": "형용사와 부사: turns 뒤 보어는 형용사 red 사용", "topic": "형용사와 부사", "memo": "turns 뒤 보어는 형용사 red 사용"}]}, {"n": 9, "tag": null, "en": "People close some roads and build bridges to protect them. With their help, the crabs move to the ocean safe.", "ko": "사람들은 그들을 보호하기 위해 일부 도로를 폐쇄하고 다리를 놓는다. 사람들의 도움으로 게들은 바다로 안전하게 이동한다.", "ok": false, "foot": [], "fixes": [{"wrong": "safe", "right": "safely", "partial": false, "at": [19], "point": "형용사와 부사: 동사 move 수식은 부사 safely 사용", "topic": "형용사와 부사", "memo": "동사 move 수식은 부사 safely 사용"}]}, {"n": 10, "tag": null, "en": "Golden Jellyfish in Jellyfish Lake, Palau", "ko": "팔라우의 젤리피시 호수에 사는 황금해파리", "ok": true, "foot": [], "fixes": []}, {"n": 11, "tag": null, "en": "Jellyfish Lake in Palau is home to golden jellyfish. Every day, they moves across the lake and then swim back.", "ko": "팔라우의 젤리피시 호수는 황금해파리의 집이다. 매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다.", "ok": false, "foot": [], "fixes": [{"wrong": "moves", "right": "move", "partial": false, "at": [12], "point": "일반동사의 현재형: 복수 주어 they는 move (moves 아님)", "topic": "일반동사의 현재형", "memo": "복수 주어 they는 move (moves 아님)"}]}, {"n": 12, "tag": null, "en": "Why do they travel every day? They follow the sun to get energies from it.", "ko": "왜 그들은 매일 여행을 할까? 그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다.", "ok": false, "foot": [], "fixes": [{"wrong": "energies", "right": "energy", "partial": false, "at": [12], "point": "셀 수 없는 명사: energy는 셀 수 없는 명사", "topic": "셀 수 없는 명사", "memo": "energy는 셀 수 없는 명사"}]}, {"n": 13, "tag": null, "en": "When the sun rises in the morning, the jellyfish begin to swimming toward the sun.", "ko": "아침에 태양이 뜨면, 황금해파리들은 태양 쪽으로 헤엄치기 시작한다.", "ok": false, "foot": [], "fixes": [{"wrong": "swimming", "right": "swim", "partial": false, "at": [11], "point": "to부정사: to 뒤에는 동사원형 swim 사용", "topic": "to부정사", "memo": "to 뒤에는 동사원형 swim 사용"}]}, {"n": 14, "tag": null, "en": "In the afternoon, they travel back and wait for the next morning.", "ko": "오후에는 다시 돌아와 다음 날 아침을 기다린다.", "ok": true, "foot": [], "fixes": []}];var PP=[["Do you know animals also leave their homes and travel?", "동물들도 자신의 집을 떠나 여행한다는 것을 알고 있는가?", 1], ["Many animals travel for different reasons.", "많은 동물이 다양한 이유로 여행한다.", 0], ["Let's find out more!", "더 알아보도록 하자!", 0], ["Fruit Bats in Africa", "아프리카에 사는 과일박쥐", 1], ["From October to December, millions of fruit bats fly to Zambia's Kasanka National Park.", "10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다.", 1], ["These bats come from all over Africa.", "이 박쥐들은 아프리카의 전 지역에서 온다.", 0], ["Why do they travel to the park?", "왜 그들이 그 공원으로 여행을 하는 것일까?", 0], ["They go there to eat wild fruit.", "그들은 야생 과일을 먹기 위해 그곳에 간다.", 0], ["They are big eaters.", "그들은 대식가이다.", 0], ["They eat more than their weight in a night.", "그들은 하룻밤에 자신의 몸무게보다 더 많은 양을 먹는다.", 0], ["Red Crabs on Christmas Island", "크리스마스섬의 붉은게", 1], ["On Christmas Island, red crabs live in forests, not in the water.", "크리스마스섬에서 붉은게는 물속이 아니라 숲에서 산다.", 1], ["However, when the rainy season begins in October, millions of red crabs march toward the ocean to lay eggs.", "하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다.", 0], ["During this period, they are all over the place, and the whole island turns red.", "이 기간 동안에는 그들이 모든 곳에 걸쳐 있어서 섬 전체가 붉게 변한다.", 0], ["People close some roads and build bridges to protect them.", "사람들은 그들을 보호하기 위해 일부 도로를 폐쇄하고 다리를 놓는다.", 0], ["With their help, the crabs move to the ocean safely.", "사람들의 도움으로 게들은 바다로 안전하게 이동한다.", 0], ["Golden Jellyfish in Jellyfish Lake, Palau", "팔라우의 젤리피시 호수에 사는 황금해파리", 1], ["Jellyfish Lake in Palau is home to golden jellyfish.", "팔라우의 젤리피시 호수는 황금해파리의 집이다.", 1], ["Every day, they move across the lake and then swim back.", "매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다.", 0], ["Why do they travel every day?", "왜 그들은 매일 여행을 할까?", 0], ["They follow the sun to get energy from it.", "그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다.", 0], ["When the sun rises in the morning, the jellyfish begin to swim toward the sun.", "아침에 태양이 뜨면, 황금해파리들은 태양 쪽으로 헤엄치기 시작한다.", 0], ["In the afternoon, they travel back and wait for the next morning.", "오후에는 다시 돌아와 다음 날 아침을 기다린다.", 0]];var RNUM=68;var TITLE_EN="Why Do Animals Travel?";var PASS_EN=["Why Do Animals Travel?", "Do you know animals also leave their homes and travel? Many animals travel for different reasons. Let's find out more!", "Fruit Bats in Africa", "From October to December, millions of fruit bats fly to Zambia's Kasanka National Park. These bats come from all over Africa. Why do they travel to the park? They go there to eat wild fruit. They are big eaters. They eat more than their weight in a night.", "Red Crabs on Christmas Island", "On Christmas Island, red crabs live in forests, not in the water. However, when the rainy season begins in October, millions of red crabs march toward the ocean to lay eggs. During this period, they are all over the place, and the whole island turns red. People close some roads and build bridges to protect them. With their help, the crabs move to the ocean safely.", "Golden Jellyfish in Jellyfish Lake, Palau", "Jellyfish Lake in Palau is home to golden jellyfish. Every day, they move across the lake and then swim back. Why do they travel every day? They follow the sun to get energy from it. When the sun rises in the morning, the jellyfish begin to swim toward the sun. In the afternoon, they travel back and wait for the next morning."];var PASS_KO=["왜 동물들이 여행을 할까?", "동물들도 자신의 집을 떠나 여행한다는 것을 알고 있는가? 많은 동물이 다양한 이유로 여행한다. 더 알아보도록 하자!", "아프리카에 사는 과일박쥐", "10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다. 이 박쥐들은 아프리카의 전 지역에서 온다. 왜 그들이 그 공원으로 여행을 하는 것일까? 그들은 야생 과일을 먹기 위해 그곳에 간다. 그들은 대식가이다. 그들은 하룻밤에 자신의 몸무게보다 더 많은 양을 먹는다.", "크리스마스섬의 붉은게", "크리스마스섬에서 붉은게는 물속이 아니라 숲에서 산다. 하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다. 이 기간 동안에는 그들이 모든 곳에 걸쳐 있어서 섬 전체가 붉게 변한다. 사람들은 그들을 보호하기 위해 일부 도로를 폐쇄하고 다리를 놓는다. 사람들의 도움으로 게들은 바다로 안전하게 이동한다.", "팔라우의 젤리피시 호수에 사는 황금해파리", "팔라우의 젤리피시 호수는 황금해파리의 집이다. 매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다. 왜 그들은 매일 여행을 할까? 그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다. 아침에 태양이 뜨면, 황금해파리들은 태양 쪽으로 헤엄치기 시작한다. 오후에는 다시 돌아와 다음 날 아침을 기다린다."];
var BG=[{"qs": [{"n": 6, "q": "윗글의 내용과 일치하는 것은?", "o": ["Unlike people, most animals rarely leave their homes.", "Most animals that leave home have the same reason.", "At a certain time of year, millions of fruit bats come to a national park in Zambia.", "Fruit bats travel from only a few countries in Africa.", "Fruit bats eat less than their weight in a night."], "a": 2, "ans": "At a certain time of year, millions of fruit bats come to a national park in Zambia.", "ko": ["사람들과 달리, 대부분의 동물들은 집을 거의 떠나지 않는다.", "집을 떠나는 동물들의 대부분은 동일한 이유를 갖고 있다.", "특정 기간이 되면, 수백만 마리의 과일박쥐들이 잠비아의 국립공원으로 온다.", "과일박쥐들은 아프리카의 일부 나라에서부터 이동해 온다.", "과일박쥐들은 하룻밤에 그들의 몸무게보다 적게 먹는다."], "ow": ["오답 ✕ — 본문은 'Do you know animals also leave their homes and travel?'(동물들도 자신의 집을 떠나 여행한다는 것을 알고 있는가?)로 시작한다. 동물들이 집을 떠나 여행한다는 내용이라 틀림.", "오답 ✕ — 'Many animals travel for different reasons.'(많은 동물이 다양한 이유로 여행한다.)라고 했는데, 이 보기는 동일한 이유라고 해서 틀림.", "정답 ○ — 'From October to December, millions of fruit bats fly to Zambia's Kasanka National Park.'(10월부터 12월 사이에 수백만 마리의 과일박쥐가 카산카 국립공원으로 날아간다.)라고 했으므로 본문과 일치한다.", "오답 ✕ — 'These bats come from all over Africa.'(이 박쥐들은 아프리카의 전 지역에서 온다.)라고 했는데, 이 보기는 일부 나라에서만 온다고 해서 틀림.", "오답 ✕ — 'They eat more than their weight in a night.'(그들은 하룻밤에 자신의 몸무게보다 더 많이 먹는다.)라고 했는데, 이 보기는 적게 먹는다고 해서 틀림."], "memo": ["정답 ③: At a certain time of year, millions of fruit bats come to a national park in Zambia.(특정 기간이 되면 수백만 마리의 과일박쥐가 잠비아의 국립공원으로 온다.)", "근거: From October to December, millions of fruit bats fly to Zambia's Kasanka National Park.(10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다.)", "함정: ⑤ Fruit bats eat less than their weight in a night.(하룻밤에 몸무게보다 적게 먹는다) ✕ 본문은 more than(~보다 많이)이다."], "evs": [["From October to December, millions of fruit bats fly to Zambia's Kasanka National Park.", "10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다."], ["These bats come from all over Africa.", "이 박쥐들은 아프리카의 전 지역에서 온다."]], "ev": ["From October to December, millions of fruit bats fly to Zambia's Kasank
