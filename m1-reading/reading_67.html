var D=[{"n": 1, "tag": null, "en": "Hi! I am an plastic duck and I am a bath toys.", "ko": "안녕! 나는 플라스틱 오리이고 목욕 장난감이야.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [3], "point": "관사 a/an: plastic은 자음 소리로 시작하므로 a 사용", "topic": "관사 a/an", "memo": "plastic은 자음 소리로 시작하므로 a 사용"}, {"wrong": "toys", "right": "toy", "partial": false, "at": [11], "point": "a + 단수명사: a 뒤에는 단수명사 toy 사용", "topic": "a + 단수명사", "memo": "a 뒤에는 단수명사 toy 사용"}]}, {"n": 2, "tag": null, "en": "But look! I is not in a bathroom.", "ko": "하지만, 봐! 나는 목욕탕에 있지 않아.", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "am", "partial": false, "at": [3], "point": "be동사의 현재형: 주어 I에는 am 사용", "topic": "be동사의 현재형", "memo": "주어 I에는 am 사용"}]}, {"n": 3, "tag": null, "en": "I am in the middle on the ocean. How did I get here?", "ko": "나는 바다 한가운데 있어. 내가 여기에 어떻게 오게 됐을까?", "ok": false, "foot": [], "fixes": [{"wrong": "on", "right": "of", "partial": false, "at": [5], "point": "기본전치사: \"~의 한가운데\"는 in the middle of 사용", "topic": "기본전치사", "memo": "\"~의 한가운데\"는 in the middle of 사용"}]}, {"n": 4, "tag": null, "en": "I were from a factory with other ducks. People made we with plastic because it is light and lasts long.", "ko": "나는 다른 오리들과 함께 공장에서 왔어. 사람들은 플라스틱이 가볍고 오래 가기 때문에 그것으로 우리를 만들었어.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [1], "point": "be동사의 과거형: 주어 I의 과거형은 was: was (were 아님)", "topic": "be동사의 과거형", "memo": "주어 I의 과거형은 was: was (were 아님)"}, {"wrong": "we", "right": "us", "partial": false, "at": [10], "point": "인칭대명사의 목적격: 동사 made 뒤에는 목적격 us 사용", "topic": "인칭대명사의 목적격", "memo": "동사 made 뒤에는 목적격 us 사용"}]}, {"n": 5, "tag": null, "en": "People put us in boxes and we goed out to sea. But the boxes falled into the ocean in an accident.", "ko": "사람들은 우리를 상자 속에 넣었고 우리는 바다로 나갔지. 그러나 그 상자들이 사고로 바다에 빠진 거야.", "ok": false, "foot": [], "fixes": [{"wrong": "goed", "right": "went", "partial": false, "at": [7], "point": "불규칙 과거형: go의 과거형은 went (goed 아님)", "topic": "불규칙 과거형", "memo": "go의 과거형은 went (goed 아님)"}, {"wrong": "falled", "right": "fell", "partial": false, "at": [14], "point": "불규칙 과거형: fall의 과거형은 fell (falled 아님)", "topic": "불규칙 과거형", "memo": "fall의 과거형은 fell (falled 아님)"}]}, {"n": 6, "tag": null, "en": "Luckily, we could gets out of the boxes. The wind was strong, so the waves took us apart.", "ko": "운 좋게도, 우리는 상자들 밖으로 나올 수 있었어. 바람이 강해서 파도가 우리를 떨어뜨려 놓았어.", "ok": false, "foot": [], "fixes": [{"wrong": "gets", "right": "get", "partial": false, "at": [3], "point": "조동사 뒤 동사원형: 조동사 could 뒤에는 동사원형 get 사용", "topic": "조동사 뒤 동사원형", "memo": "조동사 could 뒤에는 동사원형 get 사용"}]}, {"n": 7, "tag": null, "en": "In the ocean, I met a lots of sea animals. But many of them was in trouble.", "ko": "바다에서 나는 많은 바다 동물을 만났어. 하지만 그들 중 많은 이들이 어려움에 빠져 있었어.", "ok": false, "foot": [], "fixes": [{"wrong": "lots", "right": "lot", "partial": false, "at": [6], "point": "수량 표현: \"많은\"은 a lot of (lots of) 사용", "topic": "수량 표현", "memo": "\"많은\"은 a lot of (lots of) 사용"}, {"wrong": "was", "right": "were", "partial": false, "at": [14], "point": "be동사의 수일치: 주어 many(복수)에는 were 사용", "topic": "be동사의 수일치", "memo": "주어 many(복수)에는 were 사용"}]}, {"n": 8, "tag": null, "en": "One time, I meeted a sea turtle in a fishing net. \"Get me out of this,\" the sea turtle cried.", "ko": "한번은, 내가 낚시 그물에 걸린 바다거북을 만났어. “이것으로부터 나를 꺼내 줘,”라고 바다거북이 외쳤지.", "ok": false, "foot": [], "fixes": [{"wrong": "meeted", "right": "met", "partial": false, "at": [3], "point": "불규칙 과거형: meet의 과거형은 met (meeted 아님)", "topic": "불규칙 과거형", "memo": "meet의 과거형은 met (meeted 아님)"}]}, {"n": 9, "tag": null, "en": "I wanted to help, but I couldn't. I was so sadly.", "ko": "나는 도와주고 싶었지만 할 수 없었어. 나는 매우 슬펐어.", "ok": false, "foot": [], "fixes": [{"wrong": "sadly", "right": "sad", "partial": false, "at": [10], "point": "형용사와 부사: be동사 뒤 보어 자리에는 형용사 sad 사용", "topic": "형용사와 부사", "memo": "be동사 뒤 보어 자리에는 형용사 sad 사용"}]}, {"n": 10, "tag": null, "en": "Then the waves took me to a giant trash island. I saw a lot of plastic waste.", "ko": "그때 파도가 나를 거대한 쓰레기 섬으로 데리고 갔어. 나는 많은 플라스틱 쓰레기를 보았지.", "ok": true, "foot": [], "fixes": []}, {"n": 11, "tag": null, "en": "I wanted get out of there.", "ko": "나는 그곳에서 벗어나고 싶었어.", "ok": false, "foot": [], "fixes": [{"wrong": "get", "right": "to get", "partial": false, "at": [2], "point": "to부정사: wanted 뒤에는 to get(to부정사) 사용", "topic": "to부정사", "memo": "wanted 뒤에는 to get(to부정사) 사용", "alt": [1]}]}, {"n": 12, "tag": null, "en": "One day, a strong storm freed me. After week, I finally reached land.", "ko": "어느 날, 강한 폭풍이 나를 빼내 주었어. 몇 주 후에, 나는 마침내 육지에 도착했지.", "ok": false, "foot": [], "fixes": [{"wrong": "week", "right": "weeks", "partial": false, "at": [8], "point": "명사의 복수형: 단수 week 앞에는 관사가 필요하므로 복수 weeks 사용", "topic": "명사의 복수형", "memo": "단수 week 앞에는 관사가 필요하므로 복수 weeks 사용"}]}, {"n": 13, "tag": null, "en": "There were a lot of people at the beach. Oh, someone picked I up.", "ko": "해변에는 많은 사람들이 있었어. 아, 누군가가 나를 집어 들었어.", "ok": false, "foot": [], "fixes": [{"wrong": "I", "right": "me", "partial": false, "at": [12], "point": "인칭대명사의 목적격: 동사 picked 뒤에는 목적격 me 사용", "topic": "인칭대명사의 목적격", "memo": "동사 picked 뒤에는 목적격 me 사용"}]}, {"n": 14, "tag": null, "en": "\"Where am I going now?,\" I thought.", "ko": "“나는 지금 어디로 가고 있는 걸까?”라고 나는 생각했어.", "ok": true, "foot": [], "fixes": []}, {"n": 15, "tag": null, "en": "How a long journey! I am finally in a bathtub with these boy, Mike.", "ko": "정말 긴 여행이었어! 나는 드디어 Mike라는 이 소년과 함께 욕조에 있어.", "ok": false, "foot": [], "fixes": [{"wrong": "How", "right": "What", "partial": false, "at": [0], "point": "감탄문: \"What a + 형용사 + 명사\" 어순이므로 What 사용", "topic": "감탄문", "memo": "\"What a + 형용사 + 명사\" 어순이므로 What 사용"}, {"wrong": "these", "right": "this", "partial": false, "at": [11], "point": "지시형용사 this/these: 단수명사 boy이므로 this 사용", "topic": "지시형용사 this/these", "memo": "단수명사 boy이므로 this 사용"}]}, {"n": 16, "tag": null, "en": "How luckily I am! But sometimes I think about my others duck friends.", "ko": "나는 얼마나 운이 좋은지! 그러나 때때로 나는 나의 다른 오리 친구들을 생각해.", "ok": false, "foot": [], "fixes": [{"wrong": "luckily", "right": "lucky", "partial": false, "at": [1], "point": "형용사와 부사: How 뒤에는 형용사 lucky 사용", "topic": "형용사와 부사", "memo": "How 뒤에는 형용사 lucky 사용"}, {"wrong": "others", "right": "other", "partial": false, "at": [10], "point": "수량 한정사 other/others: 명사 앞에는 other 사용 (others는 단독 대명사)", "topic": "수량 한정사 other/others", "memo": "명사 앞에는 other 사용 (others는 단독 대명사)"}]}, {"n": 17, "tag": null, "en": "Are they still in the ocean? I hope to see they all someday.", "ko": "그들은 아직도 바다에 있을까? 나는 언젠가 그들 모두를 만나기를 바라.", "ok": false, "foot": [], "fixes": [{"wrong": "they", "right": "them", "partial": false, "at": [10], "point": "인칭대명사의 목적격: 동사 see 뒤에는 목적격 them 사용", "topic": "인칭대명사의 목적격", "memo": "동사 see 뒤에는 목적격 them 사용"}]}];var PP=[["Hi!", "안녕!", 1], ["I am a plastic duck and I am a bath toy.", "나는 플라스틱 오리이고 목욕 장난감이야.", 0], ["But look!", "하지만, 봐!", 0], ["I am not in a bathroom.", "나는 목욕탕에 있지 않아.", 0], ["I am in the middle of the ocean.", "나는 바다 한가운데 있어.", 0], ["How did I get here?", "내가 여기에 어떻게 오게 됐을까?", 0], ["I was from a factory with other ducks.", "나는 다른 오리들과 함께 공장에서 왔어.", 1], ["People made us with plastic because it is light and lasts long.", "사람들은 플라스틱이 가볍고 오래 가기 때문에 그것으로 우리를 만들었어.", 0], ["People put us in boxes and we went out to sea.", "사람들은 우리를 상자 속에 넣었고 우리는 바다로 나갔지.", 0], ["But the boxes fell into the ocean in an accident.", "그러나 그 상자들이 사고로 바다에 빠진 거야.", 0], ["Luckily, we could get out of the boxes.", "운 좋게도, 우리는 상자들 밖으로 나올 수 있었어.", 1], ["The wind was strong, so the waves took us apart.", "바람이 강해서 파도가 우리를 떨어뜨려 놓았어.", 0], ["In the ocean, I met a lot of sea animals.", "바다에서 나는 많은 바다 동물을 만났어.", 0], ["But many of them were in trouble.", "하지만 그들 중 많은 이들이 어려움에 빠져 있었어.", 0], ["One time, I met a sea turtle in a fishing net.", "한번은, 내가 낚시 그물에 걸린 바다거북을 만났어.", 0], ["\"Get me out of this,\" the sea turtle cried.", "“이것으로부터 나를 꺼내 줘,”라고 바다거북이 외쳤지.", 0], ["I wanted to help, but I couldn't.", "나는 도와주고 싶었지만 할 수 없었어.", 0], ht.", "What a long journey! I am finally in a bathtub with this boy, Mike. How lucky I am! But sometimes I think about my other duck friends. Are they still in the ocean? I hope to see them all someday."];var PASS_KO=["얼마나 운이 좋은 오리인가!", "안녕! 나는 플라스틱 오리이고 목욕 장난감이야. 하지만, 봐! 나는 목욕탕에 있지 않아. 나는 바다 한가운데 있어. 내가 여기에 어떻게 오게 됐을까?", "나는 다른 오리들과 함께 공장에서 왔어. 사람들은 플라스틱이 가볍고 오래 가기 때문에 그것으로 우리를 만들었어. 사람들은 우리를 상자 속에 넣었고 우리는 바다로 나갔지. 그러나 그 상자들이 사고로 바다에 빠진 거야.", "운 좋게도, 우리는 상자들 밖으로 나올 수 있었어. 바람이 강해서 파도가 우리를 떨어뜨려 놓았어. 바다에서 나는 많은 바다 동물을 만났어. 하지만 그들 중 많은 이들이 어려움에 빠져 있었어. 한번은, 내가 낚시 그물에 걸린 바다거북을 만났어. “이것으로부터 나를 꺼내 줘,”라고 바다거북이 외쳤지. 나는 도와주고 싶었지만 할 수 없었어. 나는 매우 슬펐어.", "그때 파도가 나를 거대한 쓰레기 섬으로 데리고 갔어. 나는 많은 플라스틱 쓰레기를 보았지. 나는 그곳에서 벗어나고 싶었어.", "어느 날, 강한 폭풍이 나를 빼내 주었어. 몇 주 후에, 나는 마침내 육지에 도착했지. 해변에는 많은 사람들이 있었어. 아, 누군가가 나를 집어 들었어. “나는 지금 어디로 가고 있는 걸까?”라고 나는 생각했어.", "정말 긴 여행이었어! 나는 드디어 Mike라는 이 소년과 함께 욕조에 있어. 나는 얼마나 운이 좋은지! 그러나 때때로 나는 나의 다른 오리 친구들을 생각해. 그들은 아직도 바다에 있을까? 나는 언젠가 그들 모두를 만나기를 바라."];

 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt" lang="en">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function fixedHtml(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0001'+f.right+'\u0002');return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+'\u0001'+f.right+'\u0002'+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return esc(tk.join(' ').replace(/ ?\u0000/g,'')).replace(/\u0001/g,'<mark>').replace(/\u0002/g,'</mark>')}
function noteHtml(i){
 var it=D[i],wp=wrongPicks(i);
 if(it.ok){return '<div class="ac s1"><div class="ac-top fine"><b>맞는 문장</b><span class="ac-a">어법 오류 없음</span>'+(wp?'<span class="ac-x">고른 곳은 틀린 곳이 아니에요</span>':'')+'</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 var h='<div class="ac s1"><div class="ac-top'+(all?' g':'')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+'</b>'+(wp?'<span class="ac-x">틀리게 고른 곳 '+wp+'개</span>':'')+'</div>';
 h+='<div class="fixs-l">고친 문장</div><div class="fixs" lang="en">'+fixedHtml(it)+'</div>';
 it.fixes.forEach(function(f,k){var ok=foundFix(i,k);
  h+='<div class="fc '+(ok?'f':'m')+'"><div><span class="tg2">'+(ok?'찾음':'놓침')+'</span>'+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr" lang="en">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt" lang="en">'+esc(f.right)+'</span></div><div class="fcb">'+pointHtml(f)+'</div></div>'});
 return h+'<div style="height:12px"></div></div>';
}
function critHtml(f){var w=f.wrong.split(/\s+/),r=f.right.split(/\s+/);
 if(f.alt&&f.alt.length)return '<div class="crit">빠진 말 문제 : 빠진 자리 양옆 어느 단어를 눌러도 정답으로 인정</div>';
 if(w.length==2&&r.length==2&&w.slice().sort().join()==r.slice().sort().join()&&w.join()!=r.join())return '<div class="crit">어순 문제 : 옮겨진 말과 짝이 되는 단어, 어느 쪽을 눌러도 정답으로 인정</div>';return ''}
function pointHtml(f){var p=f.point,ix=p.indexOf(':');return (ix>0&&ix<24?'<b>'+esc(p.slice(0,ix))+'</b> : '+esc(p.slice(ix+1).trim()):'<b>'+esc(f.topic)+'</b> : '+esc(p))+critHtml(f)}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 return '<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
}
function load(){try{var v=localStorage.getItem(BK);return v==null?null:+v}catch(e){return null}}
function save(n){try{var b=load();if(b==null||n>b)localStorage.setItem(BK,n)}catch(e){}}
function ppHtml(pp){
 return '<div class="dlg"><div class="who">'+en(TITLE_EN)+' &middot; '+en(pp[0][0])+'</div><div class="ln"><div class="en" lang="en">'+esc(pp.slice(1).map(function(p){return p[0]}).join(' '))+'</div></div></div>';
}
function qVisible(i){if(!aDone())return false;for(var j=0;j<i;j++){var s=qst[QL[j].n];if(!(s&&s.adv))return false}return true}
function stepQHtml(){
 if(!aDone())return '';
 var h='<div class="stage">2 · 본문 '+QL.length+'문제</div>',lastG=null;
 for(var i=0;i<QL.length;i++){
  if(!qVisible(i))break;
  var q=QL[i];
  if(q.g!==lastG){if(q.g.pp)h+=ppHtml(q.g.pp);lastG=q.g}
  h+=qCard(i);
 }
 if(allAdv())h+=resultHtml();
 return h;
}
function optText(q,j){return q.ko?en(q.o[j]):esc(q.o[j])}
function doneRow(q){return '<div class="qd" id="q'+q.n+'"><span class="qn">'+q.dn+'</span><span>정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<span class="qk">'+esc(q.ko[q.a])+'</span>':'')+'</div>'}
function postHtml(q,st){var n=q.note;
 return '<div class="post"><div class="ph">노트에 쓰기 &middot; 요약문 완성</div><div class="pl" lang="en">'+esc(n.en)+'</div><div class="pk">'+esc(n.ko)+'</div><div class="pw">'+n.words.map(function(w){return '<span lang="en">'+esc(w[0])+'</span> = '+esc(w[1])}).join(' &nbsp;&middot;&nbsp; ')+'</div>'+(st.wrote?'<div class="pd">작성 완료</div>':'<button type="button" data-wrote="'+q.n+'">노트에 썼어요</button>')+'</div>';
}
function qCard(i){
 var q=QL[i],st=qst[q.n]||(qst[q.n]={w:[],ok:0,adv:0,t0:Date.now(),t1:0,wrote:0});
 if(st.adv&&!q.note&&!st.w.length)return doneRow(q);
 var h='<div class="q" id="q'+q.n+'"><div class="qt"><span class="lbl">'+LABEL+'</span><span class="qn">'+q.dn+'</span>'+neg(q.q)+'</div>';
 if(q.sum)h+='<div class="sumbox" lang="en">'+esc(q.sum)+'</div>';
 if(!st.w.length){
  q.o.forEach(function(t,j){
   h+='<div class="opt'+(st.ok&&j===q.a?' good':'')+'"'+(st.ok?'':' data-q="'+q.n+'" data-o="'+j+'"')+'><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>';
  });
  if(st.ok&&q.note)h+=postHtml(q,st);
  return h+'</div>';
 }
 return h+'</div>'+wrongCard(q,st);
}
function wrongCard(q,st){
 var h='<div class="ac"><div class="ac-top"><b>오답</b><span class="ac-a">정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<div class="ac-k">'+esc(q.ko[q.a])+'</div>':'')+'</div>';
 var isEv=function(t){return q.evs.some(function(e){return t===e[0]||(t.length>8&&t.indexOf(e[0])>=0)})};
 if(q.g.pp){
  h+='<div class="ac-sec">본문</div><div class="pass">';
  q.g.pp.forEach(function(p,ix){if(ix===0)return;h+='<div class="pl1"><div class="e" lang="en">'+(isEv(p[0])?'<mark>'+esc(p[0])+'</mark>':esc(p[0]))+'</div><div class="k">'+esc(p[1])+'</div></div>'});
  h+='</div>';
 } else {
  h+='<div class="ac-sec">본문 근거</div><div class="pass">';
  q.evs.forEach(function(e){h+='<div class="pl1"><div class="e" lang="en"><mark>'+esc(e[0])+'</mark></div><div class="k">'+esc(e[1])+'</div></div>'});
  h+='</div>';
 }
 h+='<div class="ac-sec">보기 풀이</div>';
 q.o.forEach(function(t,j){var isA=j===q.a,isW=st.w.indexOf(j)>=0;
  h+='<div class="oc'+(isA?' g':isW?' r':'')+'"><div class="oh"><span class="cn">'+CN[j]+'</span><div class="ot">'+(q.ko?en(t):esc(t))+(q.ko?'<div class="okr">'+esc(q.ko[j])+'</div>':'')+'</div>'+(isA?'<span class="tg">정답</span>':isW?'<span class="tg">내가 고름</span>':'')+'</div><div class="why">'+reasonHtml(q.ow[j])+'</div></div>';
 });
 var tr=(q.memo||[]).filter(function(l){return /^함정/.test(l)})[0];
 if(tr)h+='<div class="trap"><b>함정</b> '+esc(tr.replace(/^함정\s*:\s*/,'').replace(/\s*✕/g,''))+'</div>';
 if(!st.ok){
  h+='<div class="fix"><div class="fh">고쳐 보기</div>';
  q.o.forEach(function(t,j){var xx=st.w.indexOf(j)>=0;h+='<div class="opt'+(xx?' xx':'')+'" data-q="'+q.n+'" data-o="'+j+'"><span class="cn">'+CN[j]+'</span><span>'+(q.ko?en(t):esc(t))+'</span></div>'});
  h+='</div>';
 } else {
  h+='<div class="fixed">정답 '+CN[q.a]+'</div>';
  if(q.note)h+=postHtml(q,st);
  else if(!st.adv)h+='<div class="nx"><button type="button" data-next="'+q.n+'">다음 문제</button></div>';
 }
 return h+'</div>';
}
function fcount(){return QL.filter(function(q){var s=qst[q.n];return s&&s.ok&&!s.w.length}).length}
function fastInfo(){
 var s1=[];secs.forEach(function(S,si){if(s1t[si]!=null&&s1t[si]<1500*S.items.length)s1.push(S.name||('구간 '+(si+1)))});
 var q2=[];QL.forEach(function(q){var s=qst[q.n];if(s&&s.t1&&s.t1-s.t0<2500)q2.push(q.dn)});
 return{s1:s1,q2:q2};
}
function resultHtml(){
 var f=fcount(),fx=QL.reduce(function(a,q){return a+qst[q.n].w.length},0),fi=fastInfo();
 var h='<div class="stage">완료</div><div class="res"><div class="rl">처음에 맞힌 문제</div><div class="rpct">'+f+'<small> / '+QL.length+'</small></div>';
 h+='<table class="rtb">'+QL.map(function(q){var s=qst[q.n];return '<tr><td>'+q.dn+'번</td><td>'+(s.w.length?'틀림':'처음에 맞힘')+'</td></tr>'}).join('')+'</table>';
 h+='<div class="rl">총 학습 시간 '+fmtT(TM.act)+'</div>';
 h+='<div class="chip'+(chk?' on':'')+'">'+(chk?'선생님 확인 완료':'선생님 확인 대기')+'</div>';
 if(TEACH){
  h+='<div class="tp"><b>선생님용</b><div>빠른 제출 : '+((fi.s1.length||fi.q2.length)?'<span class="fl">'+(fi.s1.length?'오류 찾기 '+fi.s1.join(', ')+' ':'')+(fi.q2.length?'문제 '+fi.q2.join(', ')+'번':'')+'</span>':'없음')+'</div><div>첫 시도 정답 '+f+'/'+QL.length+'· 틀린 횟수 '+fx+'</div><div style="margin-top:8px"><button type="button" data-chk="1">'+(chk?'확인 취소':'노트 확인 완료')+'</button></div></div>';
 }
 h+='<div style="margin-top:14px"><a href="./" style="display:inline-block;background:var(--pri);color:#fff;text-decoration:none;font-weight:700;padding:9px 20px;border-radius:8px">M1 Reading 목록으로</a></div>';
 return h+'</div>';
}
function lognote(q){var n=q.note;wlog('s','2단계 · 요약문 완성',[{n:q.dn,a:'정답 '+CN[q.a]+' '+q.ans,m:[n.en,n.ko].concat(n.words.map(function(w){return w[0]+' = '+w[1]}))}])}
function pickOpt(n,j){var q=qById(n),st=qst[n];if(!st||st.ok)return;if(!st.t1)st.t1=Date.now();
 if(j===q.a){st.ok=1;if(q.note)lognote(q);if(!st.w.length&&!q.note){setTimeout(function(){advQ(n)},700)}}
 else if(st.w.indexOf(j)<0){st.w.push(j);st.ok=1;if(q.note)lognote(q)}
 var y=window.scrollY;render();window.scrollTo(0,y);
}
function advQ(n){var st=qst[n];if(!st||st.adv)return;st.adv=1;if(allAdv()){tmFlush();TM.done=1}
 render();var ix=QL.indexOf(qById(n)),nx=ix<QL.length-1?QL[ix+1]:null,el=nx?document.getElementById('q'+nx.n):document.querySelector('.res');
 if(el){var ty=el.getBoundingClientRect().top+window.pageYOffset-8;window.scrollTo(0,ty);setTimeout(function(){window.scrollTo(0,el.getBoundingClientRect().top+window.pageYOffset-8)},60)}
}
document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){var sb=+b.dataset.sub;s1t[sb]=Date.now()-mark;mark=Date.now();done[sb]=true;render();
  var fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(aDone())save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'});return}
 var o=e.target.closest('.opt[data-q]');if(o){pickOpt(+o.dataset.q,+o.dataset.o);return}
 var nx=e.target.closest('button[data-next]');if(nx){advQ(+nx.dataset.next);return}
 var wr=e.target.closest('button[data-wrote]');if(wr){var qn=+wr.dataset.wrote;qst[qn].wrote=1;advQ(qn);return}
 var ck=e.target.closest('button[data-chk]');if(ck){chk=chk?0:1;var y2=window.scrollY;render();window.scrollTo(0,y2);return}
});
function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){if(window.__bsR)return;try{var any=Object.keys(sel).length||Object.keys(qst).length||Object.keys(done).length;
 if(any)localStorage.setItem(PK,JSON.stringify({v:2,sel:sel,done:done,qst:qst,chk:chk,s1t:s1t,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+(allAdv()?1:0);var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');
 if(n>=2){rs[RNUM]={p:Math.round(fcount()*100/QL.length),ok:1,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}
 localStorage.setItem('m1-res',JSON.stringify(rs));
 if(any){st[RNUM]=(n>=2?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none';
 try{if(any)BSYNC(RNUM,JSON.parse(localStorage.getItem(PK)),n>=2?3:n,n>=2)}catch(e){}}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv&&sv.v===2){sel=sv.sel||{};done=sv.done||{};qst=sv.qst||{};chk=sv.chk||0;s1t=sv.s1t||{};if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}}}catch(e){}
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}try{BSYNC(RNUM,null,0,true)}catch(x){}sel={};done={};qst={};chk=0;s1t={};mark=Date.now();TM={act:0,lv:0,lt:0,done:0};_last=Date.now();render();window.scrollTo(0,0)}}});
render();

</script></body></html>
