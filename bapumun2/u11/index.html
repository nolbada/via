 필요해요. 집단의 범위가 정해지지 않은 경우예요. 동사 like에 s가 없다는 점도 보세요.", "why": "범위가 정해지지 않은 여럿 중에서 일부와 또 다른 일부를 말할 때는 some과 others를 써요. 동사 like(좋아하다)가 복수형이라 others가 맞아요.", "opts": [{"n": "①", "en": "other", "ko": "다른", "ok": false, "why": "단독으로 대명사 역할을 하지 못해요."}, {"n": "②", "en": "the other", "ko": "나머지 하나", "ok": false, "why": "둘 중 나머지 하나를 뜻해서 막연한 여럿과 맞지 않아요."}, {"n": "③", "en": "ones", "ko": "(그런) 것들", "ok": false, "why": "같은 종류의 물건을 대신하는 말이라 사람 이야기와 맞지 않아요."}, {"n": "④", "en": "another", "ko": "또 다른 하나", "ok": false, "why": "단수라서 복수 동사 like와 맞지 않아요."}, {"n": "⑤", "en": "others", "ko": "또 다른 일부", "ok": true, "why": "Some과 짝이 되어 맞아요."}], "pencil": "막연한 여럿 중 일부와 다른 일부는 some, ___로 말한다", "pencilKey": "others", "page": 110, "sec": "s1"}, {"id": "S1-11", "step": 1, "no": 11, "qtype": "유형 02 짝을 이루는 부정대명사", "type": "mc", "ans": "③", "concept": ["048"], "gap": "대상 집단의 범위가 정해져 있는지(the others)와 막연한지(others)에 따라 부정대명사를 고르는 기준을 알려 주는 개념", "words": [["pair of socks", "양말 한 켤레"], ["drawer", "서랍"], ["sister's", "언니(여동생)의 것"], ["the others", "(여럿 중) 나머지 전부"]], "h1": "서랍에 양말이 여섯 켤레 있는데 두 켤레는 언니 것이에요. 나머지는 내 것이라는 문장이에요. 여섯 켤레는 정해진 수예요.", "h2": "두 켤레를 빼고 남은 것은 모두 몇 켤레인지 계산해 보세요. 정해진 수에서 일부를 뺀 나머지 전부를 가리키는 말을 찾으세요. 동사 are도 힌트예요.", "why": "정해진 여섯 켤레 중 두 켤레를 빼면 나머지 네 켤레 전부가 남아요. 정해진 집단의 나머지 전부는 the others예요.", "opts": [{"n": "①", "en": "ones", "ko": "(그런) 것들", "ok": false, "why": "같은 종류의 막연한 것들이라 '나머지 전부'가 아니에요."}, {"n": "②", "en": "the other", "ko": "나머지 하나", "ok": false, "why": "하나만 가리키는데 남은 것은 여러 켤레예요."}, {"n": "③", "en": "the others", "ko": "나머지 전부", "ok": true, "why": "정해진 집단의 나머지 전부라서 맞아요."}, {"n": "④", "en": "another", "ko": "또 다른 하나", "ok": false, "why": "단수라서 복수 동사 are와 맞지 않아요."}, {"n": "⑤", "en": "some", "ko": "몇몇", "ok": false, "why": "'나머지 전부'가 아니라 일부만 뜻해요."}], "pencil": "정해진 집단의 나머지 전부는 ___로 가리킨다", "pencilKey": "the others", "page": 110, "sec": "s1"}, {"id": "S1-12", "step": 1, "no": 12, "qtype": "유형 02 짝을 이루는 부정대명사", "type": "write", "ans": "another", "concept": ["047", "048"], "gap": "", ", "ko": "어느 날 나는 한 젊은 남자를 만났다.", "ok": false, "why": "'어느'를 뜻하는 말이에요."}, {"n": "⑤", "en": "I want an apple. May I take one?", "ko": "나는 사과가 먹고 싶다. 하나 가져가도 될까?", "ok": true, "why": "앞의 an apple을 대신하는 부정대명사라 맞아요."}], "pencil": "앞에 나온 명사를 대신하는 one은 ___대명사이다", "pencilKey": "부정", "page": 114, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "부정대명사 one의 쓰임", "type": "mc", "ans": "③", "concept": ["047", "048-H1"], "gap": "", "words": [["cheap", "값싼"], ["expensive", "비싼"], ["pants", "바지"], ["This is a cheap car", "이것은 값싼 차이다"], ["and that is an expensive one", "저것은 비싼 것이다"], ["I need to buy new ones", "나는 새것들을 사야 한다"]], "h1": "<보기> This is a cheap car, and that is an expensive one.의 one은 car를 대신해요. 같은 쓰임을 찾으세요.", "h2": "<보기>의 one은 앞에 나온 명사와 같은 종류의 것을 대신하는 말이에요. 숫자나 '한 명'이 아니라 명사를 대신하는지 확인하세요.", "why": "③ I need to buy new ones.의 ones는 pants(바지)를 대신하는 부정대명사예요. <보기>의 one과 같은 쓰임이에요.", "opts": [{"n": "①", "en": "Vincent van Gogh's famous painting, The Potato Eaters, is one good example.", "ko": "고흐의 유명한 그림 <감자 먹는 사람들>은 좋은 예 중 하나이다.", "ok": false, "why": "'하나의'라는 뜻이라 다른 쓰임이에요."}, {"n": "②", "en": "Some say one thing, others another.", "ko": "어떤 사람들은 한 가지를 말하고 다른 사람들은 다른 것을 말한다.", "ok": false, "why": "'한 가지'라는 숫자 뜻이에요."}, {"n": "③", "en": "All of my pants are very old. I need to buy new ones.", "ko": "내 바지가 다 낡았다. 새것들을 사야 한다.", "ok": true, "why": "앞의 pants를 대신하는 부정대명사라 맞아요."}, {"n": "④", "en": "We treated the dog as one of our family.", "ko": "우리는 그 개를 가족의 한 명으로 대했다.", "ok": false, "why": "'한 명'이라는 뜻이라 다른 쓰임이에요."}, {"n": "⑤", "en": "The baby girl is just one year old.", "ko": "그 여자 아기는 겨우 한 살이다.", "ok": false, "why": "숫자 1을 뜻해요."}], "pencil": "앞에 나온 명사를 대신하는 복수 부정대명사는 ___이다", "pencilKey": "ones", "page": 114, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "it과 one 구별", "type": "mc", "ans": "①", "concept": ["047"], "gap": "", "words": [["pan", "팬, 냄비"], ["spare battery", "여분의 배터리"], ["lose", "잃어버리다"], ["one", "(같은 종류의) 막연한 하나"], ["I need a large pan", "나는 큰
