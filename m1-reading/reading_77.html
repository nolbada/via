<style>

.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"When you watches a movie, what do you pay attention to? The story, the actors, or the music? What about the sounds?","ko":"당신은 영화를 볼 때 무엇에 주목하나요? 줄거리, 배우, 아니면 음악? 소리는 어떤가요?","ok":false,"foot":[],"fixes":[{"wrong":"watches","right":"watch","partial":false,"at":[2],"point":"수일치: 주어 you는 3인칭 단수가 아니므로 동사원형 watch 사용","topic":"수일치","memo":"주어 you는 3인칭 단수가 아니므로 동사원형 watch 사용"}]},{"n":2,"tag":null,"en":"Last week, I had a short interview with Emma Han, a famous Foley artist.","ko":"지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다.","ok":true,"foot":["1Foley artist 폴리 아티스트(영화 음향효과를 만드는 전문가)"],"fixes":[]},{"n":3,"tag":"질문 1","en":"Hello, Ms. Han. Can you say me about your job?","ko":"안녕하세요, Han 선생님. 당신의 직업에 관해 말해 주시겠어요?","ok":false,"foot":[],"fixes":[{"wrong":"say","right":"tell","partial":false,"at":[5],"point":"4형식(수여동사): say는 4형식으로 쓸 수 없고, '~에게 말해주다'는 tell + 목적어 사용","topic":"4형식(수여동사)","memo":"say는 4형식으로 쓸 수 없고, '~에게 말해주다'는 tell + 목적어 사용"}]},{"n":4,"tag":"Emma Han","en":"Sure! Foley artists create various sounds for movies because actual sounds is not enough clear for movie scenes.","ko":"그러죠! 폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[11],"point":"수일치: 주어 sounds(복수)에 맞춰 동사 are 사용","topic":"수일치","memo":"주어 sounds(복수)에 맞춰 동사 are 사용"},{"wrong":"enough clear","right":"clear enough","partial":false,"at":[13],"point":"어순: enough는 형용사 뒤에 위치하므로 clear enough","topic":"어순","memo":"enough는 형용사 뒤에 위치하므로 clear enough"}]},{"n":5,"tag":null,"en":"Let's saying there's a rainy scene.","ko":"비 오는 장면이 있다고 가정해 봅시다.","ok":false,"foot":[],"fixes":[{"wrong":"saying","right":"say","partial":false,"at":[1],"point":"Let's 뒤에는 동사원형 사용 (Let's + 동사원형)","topic":"Let's 뒤에는 동사원형 사용 (Let's + 동사원형)","memo":""}]},{"n":6,"tag":null,"en":"The actual sounds of rain are too soft, so we has to make rain sounds and add them to the scene.","ko":"실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요.","ok":false,"foot":[],"fixes":[{"wrong":"has","right":"have","partial":false,"at":[10],"point":"조동사 have to: 주어 we(복수)에는 have to 사용","topic":"조동사 have to","memo":"주어 we(복수)에는 have to 사용"}]},{"n":7,"tag":"질문 2","en":"How does you make sounds?","ko":"어떻게 소리를 만드나요?","ok":false,"foot":[],"fixes":[{"wrong":"does","right":"do","partial":false,"at":[1],"point":"수일치: 주어 you에는 do 사용 (does는 3인칭 단수 주어에 사용)","topic":"수일치","memo":"주어 you에는 do 사용 (does는 3인칭 단수 주어에 사용)"}]},{"n":8,"tag":"Emma Han","en":"I use all kinds of everyday objects in funny and creative ways.","ko":"저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다.","ok":false,"foot":[],"fixes":[{"wrong":"funny","right":"fun","partial":false,"at":[8],"point":"어휘: funny(우스꽝스러운)가 아니라 fun(재미있는)을 사용해 creative와 병렬구조","topic":"어휘","memo":"funny(우스꽝스러운)가 아니라 fun(재미있는)을 사용해 creative와 병렬구조"}]},{"n":9,"tag":null,"en":"For example, I fry a bacon to create rain sounds.","ko":"예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요.","ok":false,"foot":[],"fixes":[{"wrong":"a bacon","right":"bacon","partial":false,"at":[4],"point":"관사/어휘: bacon은 셀 수 없는 명사이므로 부정관사 a를 쓰지 않음","topic":"관사/어휘","memo":"bacon은 셀 수 없는 명사이므로 부정관사 a를 쓰지 않음"}]},{"n":10,"tag":null,"en":"For the sounds of ice skate, I move a pairs of scissors across a desk.","ko":"얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요.","ok":false,"foot":[],"fixes":[{"wrong":"ice skate","right":"ice skating","partial":false,"at":[4],"point":"전치사(of) 뒤에는 동명사 skating 사용","topic":"전치사(of) 뒤에는 동명사 skating 사용","memo":""},{"wrong":"a pairs","right":"a pair","partial":false,"at":[8],"point":"어휘: a 뒤에는 단수명사 pair 사용 (of 뒤 scissors는 복수형 유지)","topic":"어휘","memo":"a 뒤에는 단수명사 pair 사용 (of 뒤 scissors는 복수형 유지)"}]},{"n":11,"tag":null,"en":"To make the sounds of a horse walk, I hit two coconut shell together.","ko":"말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.","ok":false,"foot":[],"fixes":[{"wrong":"walk","right":"walking","partial":false,"at":[7],"point":"전치사(of) 뒤에는 동명사 walking 사용 (a horse walking)","topic":"전치사(of) 뒤에는 동명사 walking 사용 (a horse walking)","memo":""},{"wrong":"shell","right":"shells","partial":false,"at":[12],"point":"어휘/수일치: coconut shells는 두 개이므로 복수형 shells 사용","topic":"어휘/수일치","memo":"coconut shells는 두 개이므로 복수형 shells 사용"}]},{"n":12,"tag":"질문 3","en":"How interesting! What can we do to becoming a Foley artist?","ko":"정말 흥미롭네요! 우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?","ok":false,"foot":[],"fixes":[{"wrong":"becoming","right":"become","partial":false,"at":[7],"point":"to부정사: to 뒤에는 동사원형 사용 (to become)","topic":"to부정사","memo":"to 뒤에는 동사원형 사용 (to become)"}]},{"n":13,"tag":"Emma Han","en":"You can just start by playing with sounds.","ko":"여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요.","ok":true,"foot":[],"fixes":[]},{"n":14,"tag":null,"en":"You doesn't have to use special tools to make different sounds.","ko":"다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.","ok":false,"foot":[],"fixes":[{"wrong":"doesn't","right":"don't","partial":false,"at":[1],"point":"조동사 have to: 주어 You에는 don't have to 사용","topic":"조동사 have to","memo":"주어 You에는 don't have to 사용"}]},{"n":15,"tag":null,"en":"Just try with everyday objects. Hits your desk with a pen and then with a pencil.","ko":"그냥 일상적인 물건들로 시도해 보세요. 책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요.","ok":false,"foot":[],"fixes":[{"wrong":"Hits","right":"Hit","partial":false,"at":[5],"point":"명령문은 동사원형으로 시작 (Hit)","topic":"명령문은 동사원형으로 시작 (Hit)","memo":""}]},{"n":16,"tag":null,"en":"The two sounds is not same.","ko":"이 두 가지 소리는 같지 않아요.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[3],"point":"수일치: 주어 sounds(복수)에 맞춰 동사 are 사용","topic":"수일치","memo":"주어 sounds(복수)에 맞춰 동사 are 사용"},{"wrong":"same","right":"the same","partial":false,"at":[5],"point":"관용표현: '같다'는 정관사를 붙여 the same으로 사용","topic":"관용표현","memo":"'같다'는 정관사를 붙여 the same으로 사용"}]},{"n":17,"tag":null,"en":"You should pay attention more to every sound around you.","ko":"여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다.","ok":false,"foot":[],"fixes":[{"wrong":"attention more","right":"more attention","partial":false,"at":[3],"point":"비교급: mor  너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요.",0],["Q. How do you make sounds?","질문: 어떻게 소리를 만드나요?",1],["I use all kinds of everyday objects in fun and creative ways.","저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다.",1],["For example, I fry bacon to create rain sounds.","예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요.",0],["For the sounds of ice skating, I move a pair of scissors across a desk.","얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요.",0],["To make the sounds of a horse walking, I hit two coconut shells together.","말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.",0],["Q. How interesting!","질문: 정말 흥미롭네요!",1],["What can we do to become a Foley artist?","우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?",0],["You can just start by playing with sounds.","여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요.",1],["You don’t have to use special tools to make different sounds.","다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.",0],["Just try with everyday objects.","그냥 일상적인 물건들로 시도해 보세요.",0],["Hit your desk with a pen and then with a pencil.","책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요.",0],["The two sounds are not the same.","이 두 가지 소리는 같지 않아요.",0],["You should pay more attention to every sound around you.","여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다.",0],["Then, you can find new ways of creating sounds.","그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.",0],["Q. It sounds like an interesting job.","질문: 흥미로운 직업 같아요.",1],["Thank you for the interview, Ms. Han.","인터뷰해 주셔서 감사합니다, Han 선생님.",0],["Thank you for having me.","저를 인터뷰해 주셔서 감사합니다.",1]];var RNUM=77;var TITLE_EN="Behind Movie Sounds";var PASS_EN=["Behind Movie Sounds","Interview with Emma Han","When you watch a movie, what do you pay attention to? The story, the actors, or the music? What about the sounds? Last week, I had a short interview with Emma Han, a famous Foley artist.","Q. Hello, Ms. Han. Can you tell me about your job?","Sure! Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes. Let’s say there’s a rainy scene. The actual sounds of rain are too soft, so we have to make rain sounds and add them to the scene.","Q. How do you make sounds?","I use all kinds of everyday objects in fun and creative ways. For example, I fry bacon to create rain sounds. For the sounds of ice skating, I move a pair of scissors across a desk. To make the sounds of a horse walking, I hit two coconut shells together.","Q. How interesting! What can we do to become a Foley artist?","You can just start by playing with sounds. You don’t have to use special tools to make different sounds. Just try with everyday objects. Hit your desk with a pen and then with a pencil. The two sounds are not the same. You should pay more attention to every sound around you. Then, you can find new ways of creating sounds.","Q. It sounds like an interesting job. Thank you for the interview, Ms. Han.","Thank you for having me."];var PASS_KO=["영화 음향의 뒤에서","- Emma Han과의 인터뷰","당신은 영화를 볼 때 무엇에 주목하나요? 줄거리, 배우, 아니면 음악? 소리는 어떤가요? 지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다.","질문: 안녕하세요, Han 선생님. 당신의 직업에 관해 말해 주시겠어요?","그러죠! 폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요. 비 오는 장면이 있다고 가정해 봅시다. 실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요.","질문: 어떻게 소리를 만드나요?","저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다. 예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요. 얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요. 말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.","질문: 정말 흥미롭네요! 우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?","여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요. 다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요. 그냥 일상적인 물건들로 시도해 보세요. 책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요. 이 두 가지 소리는 같지 않아요. 여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다. 그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.","질문: 흥미로운 직업 같아요. 인터뷰해 주셔서 감사합니다, Han 선생님.","저를 인터뷰해 주셔서 감사합니다."];var DG=[{"dlg":[["B","That’s a great drawing, Harin. You look like a designer.","정말 멋진 그림이야, 하린아. 너 디자이너 같아 보여."],["G","Thanks! My dream is to become a fashion designer. I want to have my own show in Paris.","고마워! 내 꿈은 패션 디자이너가 되는 거야. 나는 파리에서 내 쇼를 열고 싶어."],["B","That’s a great dream.","멋진 꿈이다."],["G","What about you, Jake? What do  else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});

render();
