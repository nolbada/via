<style>

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":"2099년 10월 25일","en":"Hohyun's school goed on a field trip to the Moon.","ko":"호현이의 학교는 달로 체험 학습을 갔습니다.","ok":false,"foot":[],"fixes":[{"wrong":"goed","right":"went","partial":false,"at":[2],"point":"불규칙 과거형: go의 과거형은 went (goed 아님)","topic":"불규칙 과거형","memo":"go의 과거형은 went (goed 아님)"}]},{"n":2,"tag":null,"en":"When the spaceship reached space, everyone experienced zero gravity and began to float.","ko":"우주선이 우주에 도달했을 때, 모두가 무중력 상태를 경험하며 떠다니기 시작했습니다.","ok":true,"foot":[],"fixes":[]},{"n":3,"tag":null,"en":"Hohyun pushed Yuchan with he finger, and Yuchan went sail through the cabin! Kyujin stood upside down on the ceiling.","ko":"호현이는 유찬이를 손가락으로 밀었고, 유찬이는 선실 안을 떠다녔습니다! 규진이는 천장에 거꾸로 섰습니다.","ok":false,"foot":[],"fixes":[{"wrong":"he","right":"his","partial":false,"at":[4],"point":"인칭대명사의 소유격: finger 앞에는 소유격 his 사용","topic":"인칭대명사의 소유격","memo":"finger 앞에는 소유격 his 사용"},{"wrong":"sail","right":"sailing","partial":false,"at":[9],"point":"go + -ing: '~하며 가다'는 went sailing 사용","topic":"go + -ing","memo":"'~하며 가다'는 went sailing 사용"}]},{"n":4,"tag":null,"en":"Sihyun was standing on the wall. Everyone felt comfortably because there is no up or down in space.","ko":"시현이는 벽에 서 있었습니다. 우주에서는 위아래가 없기 때문에 모두가 편안하게 느꼈습니다.","ok":false,"foot":[],"fixes":[{"wrong":"comfortably","right":"comfortable","partial":false,"at":[8],"point":"형용사와 부사: felt 뒤 보어 자리에는 형용사 comfortable 사용","topic":"형용사와 부사","memo":"felt 뒤 보어 자리에는 형용사 comfortable 사용"}]},{"n":5,"tag":null,"en":"Lunch was soup and potatoes in special packages. Plates are not use in space, so everyone ate directly from the packages.","ko":"점심은 특별한 포장 용기에 담긴 수프와 감자였습니다. 우주에서는 접시를 사용할 수 없어서 모두 포장 용기에서 바로 음식을 먹었습니다.","ok":false,"foot":[],"fixes":[{"wrong":"use","right":"used","partial":false,"at":[11],"point":"수동태: be동사 + 과거분사 used 사용","topic":"수동태","memo":"be동사 + 과거분사 used 사용"}]},{"n":6,"tag":null,"en":"It was possible to fixing the package on the table because there were magnet on both the package and the table.","ko":"포  it's not very strong.","다행히 그리 강하지 않아요.",0],["We will be okay if we keep still.\"","가만히 있으면 괜찮을 거예요.\"",0],["She was right.","선생님이 옳았습니다.",0],["The moonquake soon went away.","월진은 곧 사라졌습니다.",0],["\"Now, let's go and explore the craters,\" said Ms. Lee.","\"이제 분화구를 탐험하러 갑시다,\" 이 선생님이 말했습니다.",0],["\"Craters are made when space rocks crash into the Moon.","\"분화구는 우주 암석이 달에 충돌할 때 만들어져요.",0],["Like the footprints, the craters don't change much because the Moon has no air.\"","발자국처럼, 달에는 공기가 없어서 분화구도 거의 변하지 않아요.\"",0]];var RNUM=52;var TITLE_EN="A Field Trip to the Moon";var PASS_EN=["A Field Trip to the Moon","October 25, 2099","Hohyun's school went on a field trip to the Moon. When the spaceship reached space, everyone experienced zero gravity and began to float. Hohyun pushed Yuchan with his finger, and Yuchan went sailing through the cabin! Kyujin stood upside down on the ceiling. Sihyun was standing on the wall. Everyone felt comfortable because there is no up or down in space.","Lunch was soup and potatoes in special packages. Plates are not used in space, so everyone ate directly from the packages. It was possible to fix the package on the table because there were magnets on both the package and the table. \"Keep your food on the table magnet, everyone,\" said Ms. Lee, the homeroom teacher. \"If it floats away, it may damage the spaceship.\"","The spaceship landed on the Moon. Everyone jumped out and landed slowly because the Moon has low gravity. It was easy to jump high on the Moon. When Sihyun jumped, she went over Kyujin's head! \"Be careful,\" said Ms. Lee. \"It's fun to jump in low gravity, but you can get hurt if you bump into each other. Now, everyone, come here and let's take a look at the footprints of the Apollo astronauts!\" The footprints were over 100 years old, but they still looked perfect. \"It's because there's no wind or rain on the Moon,\" Ms. Lee explained.","Then suddenly, the ground began to shake. \"An earthquake!\" shouted Sihyun. \"Calm down, everyone,\" said Ms. Lee. \"It's actually a moonquake. Luckily, it's not very strong. We will be okay if we keep still.\" She was right. The moonquake soon went away. \"Now, let's go and explore the craters,\" said Ms. Lee. \"Craters are made when space rocks crash into the Moon. Like the footprints, the craters don't change much because the Moon has no air.\""];var PASS_KO=["달로의 체험 학습","2099년 10월 25일","호현이의 학교는 달로 체험 학습을 갔습니다. 우주선이 우주에 도달했을 때, 모두가 무중력 상태를 경험하며 떠다니기 시작했습니다. 호현이는 유찬이를 손가락으로 밀었고, 유찬이는 선실 안을 떠다녔습니다! 규진이는 천장에 거꾸로 섰습니다. 시현이는 벽에 서 있었습니다. 우주에서는 위아래가 없기 때문에 모두가 편안하게 느꼈습니다.","점심은 특별한 포장 용기에 담긴 수프와 감자였습니다. 우주에서는 접시를 사용할 수 없어서 모두 포장 용기에서 바로 음식을 먹었습니다. 포장 용기와 테이블에는 모두 자석이 있어서 포장 용기를 테이블에 고정할 수 있었습니다. \"모두 테이블 자석 위에 음식을 올려 두세요,\"라고 담임 선생님인 이 선생님이 말씀하셨습니다. \"음식이 떠다니면 우주선에 손상을 줄 수도 있어요.\"","우주선이 달에 착륙했습니다. 달은 낮은 중력을 갖고 있어서 모두 밖으로 뛰어나가서 천천히 착지했습니다. 달에서는 높이 점프하는 것이 쉬웠습니다. 시현이는 점프하면서 규진이의 머리 위로 날아갔습니다! \"조심하세요,\" 이 선생님이 말했습니다. \"낮은 중력에서 점프하는 건 재미있지만, 서로 부딪히면 다칠 수 있어요. 자, 이제 모두 이리로 와서 아폴로 우주 비행사들의 발자국을 봅시다!\" 그 발자국들은 100년이 넘었지만, 여전히 완벽해 보였습니다. \"그건 달에 바람이나 비가 없기 때문이에요,\" 이 선생님이 설명했습니다.","그때 갑자기 땅이 흔들리기 시작했습니다. \"지진이야!\" 시현이가 외쳤습니다. \"진정하세요, 여러분,\" 이 선생님이 말했습니다. \"그건 사실 월진이에요. 다행히 그리 강하지 않아요. 가만히 있으면 괜찮을 거예요.\" 선생님이 옳았습니다. 월진은 곧 사라졌습니다. \"이제 분화구를 탐험하러 갑시다,\" 이 선생님이 말했습니다. \"분화구는 우주 암석이 달에 충돌할 때 만들어져요. 발자국처럼, 달에는 공기가 없어서 분화구도 거의 변하지 않아요.\""];var DG=[{"qs":[{"n":1,"q":"위 담화를 읽고 답할 수 없는 질문은?","o":["Who did the girl watch a cartoon about Mars with?","What has the girl dreamed of?","How many times did the girl go to space camps?","What is the girl doing to go to Mars in the future?","How long will the girl stay in Mars?"],"a":2,"ans":"How many times did the girl go to space camps?","evs":[["G: When I was a child, I watched a cartoon about a trip to Mars with my dad.","저는 어렸을 때 아빠와 함께 화성 여행에 관한 만화를 봤어요."],["G: I studied a lot and went to space camps.","저는 공부를 많이 했고 우주 캠프에도 갔어요."]],"ev":["G: When I was a child, I watched a cartoon about a trip to Mars with my dad.","저는 어렸을 때 아빠와 함께 화성 여행에 관한 만화를 봤어요."],"ow":["오답 ✕ — 'I watched a cartoon about a trip to Mars with my dad.'(아빠와 함께 화성 여행에 관한 만화를 봤어요.)라고 했으므로 아빠와 봤다는 것을 알 수 있다.","오답 ✕ — 'I've dreamed of going to space.'(우주에 가는 것을 꿈꿔 왔어요.)라고 했으므로 우주에 가는 것을 꿈꿨다는 것을 알 수 있다.","정답 ○ — 'I studied a lot and went to space camps.'(공부를 많이 했고 우주 캠프에도 갔어요.)라고만 했을 뿐 몇 번 갔는지는 나오지 않아 답할 수 없다.","오답 ✕ — 'I'm training to go to Mars in 10 years.'(10년 후에 화성에 가기 위해 훈련하고 있어요.)라고 했으므로 훈련하고 있다는 것을 알 수 있다.","오답 ✕ — 'I will stay there for about 20 months.'(그곳에서 약 20개월 동안 머물 거예요.)라고 했으므로 머무는 기간을 알 수 있다."],"memo":["정답 ③: 우주 캠프에 몇 번 갔는지는 알 수 없다.","근거: I studied a lot and went to space camps.(공부를 많이 했고 우주 캠프에도 갔어요.)에는 횟수가 없다.","함정: ⑤ 20개월은 'about 20 months'로 나와 있다 ✕"],"why":"우주 캠프에 갔다는 말만 있고, 몇 번 갔는지는 알 수 없다."},{"n":2,"q":"소녀의 말을 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["dreamed - training","dreamed - sleeping","afraid - training","tired - camping","forgotten - waiting"],"a":0,"ans":"dreamed - training","evs":[["G: Since then, I've dreamed of going to space.","그때부터 저는 우주에 가는 것을 꿈꿔 왔어요."],["G: I'm training to go to Mars in 10 years.","저는 10년 후에 화성에 가기 위해 훈련하고 있어요."]],"ev":["G: Since then, I've dreamed of going to space.","그때부터 저는 우주에 가는 것을 꿈꿔 왔어요."],"ow":["정답 ○ — 'Since then, I've dreamed of going to space.'(그때부터 우주에 가는 것을 꿈꿔 왔어요.)와 'I'm training to go to Mars in 10 years.'(10년 후에 화성에 가기 위해 훈련하고 있어요.)에 맞는 dreamed - training이다.","오답 ✕ — (A)는 맞지만 'sleeping'(자는 중)은 틀리다. 소녀는 'I'm training to go to Mars'(화성에 가기 위해 훈련하고 있어요)라고 했다.","오답 ✕ — 'I can't wait!'(정말 기대돼요!)라고 했으므로 두려워하는(afraid) 것이 아니라 기대하고 있다.","오답 ✕ — 'I studied a lot'(공부를 많이 했고)이라고 했을 뿐 피곤하다는 말은 없고, 우주 캠프는 과거에 간 곳이다.","오답 ✕ — 'Since then, I've dreamed of going to space.'(그때부터 꿈꿔 왔어요.)라고 했으므로 꿈을 잊은(forgotten) 것이 아니다."],"memo":["정답 ①: dreamed - training","근거: I've dreamed of going to space.(우주에 가는 것을 꿈꿔 왔어요.) / I'm training to go to Mars(화성에 가기 위해 훈련하고 있어요)","함정: ③ I can't wait!는 기대된다는 뜻이라 afraid(두려운)와 반대 ✕"],"why":"소녀는 어릴 때부터 우주를 꿈꿔 왔고, 지금은 화성에 가기 위해 훈련하고 있다.","sum":"Since she watched a cartoon about Mars as a child, the girl has (A)________ of going to space, and now she is (B)________ to go to Mars.","lab":"완성된 요약문 : "}],"dlg":[["G","Do you think it is possible to live on Mars?","여러분은 화성에서 사는 것이 가능하다고 생각하나요?"],["G","When I was a child, I watched a cartoon about a trip to Mars with my dad. Since then, I've dreamed of going to space.","저는 어렸을 때 아빠와 함께 화성 여행에 관한 만화를 봤어요. 그때부터 저는 우주에 가는 것을 꿈꿔 왔어요."],["G","I studied a lot and went to space camps. Now my dream is coming true.","저는 공부를 많이 했고 우주 캠프에도 갔어요. 이제 제 꿈이 이루어지고 있어요."],["G","I'm training to go to Mars in 10 years. I will stay there for about 20 months. I can't wait!","저는 10년 후에 화성에 가기 위해 훈련하고 있어요. 저는 그곳에서 약 20개월 동안 머물 거예요. 정말 기대돼요!"]]},{"qs":[{"n":3,"q":"위 대화의 주제로 알맞은 것은?","o":["legends about a supermoon","information about a supermoon","ways to see a supermoon better","a trip to the moon in the future","how to take pictures of the moon"],"a":1,"ans":"information about a supermoon","evs":[["M: Yes, that's a supermoon. When the moon is closest to the Earth, it looks bigger and brighter than usual.","그래, 저게 슈퍼문이야. 달이 지구에 가장 가까이 있을 때, 평소보다 더 크고 밝아 보인단다."],["M: Yes, but we can only see a supermoon a few times a year.","응, 하지만 슈퍼문은 1년에 몇 번밖에 볼 수 없어."]],"ev":["M: Yes, that's a supermoon. When the moon is closest to the Earth, it looks bigger and brighter than usual.","그래, 저게 슈퍼문이야. 달이 지구에 가장 가까이 있을 때, 평소보다 더 크고 밝아 보인단다."],"ow":["오답 ✕ — 슈퍼문에 얽힌 전설(legends)은 나오지 않는다. 'that's a supermoon'(저게 슈퍼문이야)이라며 사실을 설명한다.","정답 ○ — 'When the moon is closest to the Earth, it looks bigger and brighter than usual.'(달이 지구에 가장 가까울 때 더 크고 밝아 보여.)와 'we can only see a supermoon a few times a year'(1년에 몇 번만 볼 수 있어)처럼 슈퍼문에 대한 정보가 주제이다.","오답 ✕ — 더 잘 보는 방법은 나오지 않는다. 'Let's check. Ah, it's in December.'(확인해 보자. 아, 12월이구나.)는 다음 슈퍼문 시기일 뿐이다.","오답 ✕ — 달로 여행을 간다는 말은 없다. 'Look at the moon!'(달 좀 봐!)처럼 달을 바라보는 상황이다.","오답 ✕ — 'I want to take a picture of it.'(사진으로 찍고 싶어요.)는 마지막 일부이고, 사진 찍는 방법은 나오지 않는다."],"memo":["정답 ②: 슈퍼문에 대한 정보","근거: When the moon is closest to the Earth, it looks bigger and brighter than usual.(달이 지구에 가장 가까울 때 평소보다 더 크고 밝아 보여.)","함정: ⑤ 사진은 마지막에 잠깐 나올 뿐이다 ✕"],"why":"슈퍼문이 무엇이고 언제 볼 수 있는지 설명하는 대화이다."},{"n":4,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["When the moon is closest to the Earth, a supermoon happens.","A supermoon looks larger than usual.","A supermoon can be seen yearly.","The next supermoon is next year.","The speakers are going to take a picture of the supermoon."],"a":3,"ans":"The next supermoon is next year.","evs":[["G: I see. So, when can we see the next supermoon?","그렇군요. 그럼 다음 슈퍼문은 언제 볼 수 있어요?"],["M: Let's check. Ah, it's in December.","확인해 보자. 아, 12월이구나."]],"ev":["G: I see. So, when can we see the next supermoon?","그렇군요. 그럼 다음 슈퍼문은 언제 볼 수 있어요?"],"ow":["오답 ✕ — 'When the moon is closest to the Earth'(달이 지구에 가장 가까이 있을 때)라고 했으므로 일치한다.","오답 ✕ — 'it looks bigger and brighter than usual'(평소보다 더 크고 밝아 보인다)이라고 했으므로 일치한다.","오답 ✕ — 'Is it possible to see a supermoon every year?'(매년 볼 수 있어요?)에 'Yes, but we can only see a supermoon a few times a year.'(응, 하지만 1년에 몇 번밖에 볼 수 없어.)라고 했으므로 매년 볼 수 있다는 보기는 일치한다.","정답 ○ — 다음 슈퍼문은 'Let's check. Ah, it's in December.'(확인해 보자. 아, 12월이구나.)라고 했으므로 내년이 아니라 12월이다. 보기는 일치하지 않는다.","오답 ✕ — 'Let's take a picture together with the moon.'(달과 함께 같이 사진을 찍자.)라고 했으므로 일치한다."],"memo":["정답 ④: 다음 슈퍼문은 내년이 아니라 12월이다.","근거: Let's check. Ah, it's in December.(확인해 보자. 아, 12월이구나.)","함정: ③ 매년 볼 수 있지만 1년에 몇 번뿐이다(일치) ✕"],"why":"다음 슈퍼문은 12월이므로 내년이라는 보기가 틀렸다."},{"n":5,"q":"Why does a supermoon look bigger and brighter than usual?","o":["Because the moon is closest to the Earth.","Because the moon is far from the Earth.","Because it is December.","Because people take pictures of it.","Because it appears only a few times a year."],"a":0,"ans":"Because the moon is closest to the Earth.","evs":[["M: Yes, that's a supermoon. When the moon is closest to the Earth, it looks bigger and brighter than usual.","그래, 저게 슈퍼문이야. 달이 지구에 가장 가까이 있을 때, 평소보다 더 크고 밝아 보인단다."]],"ev":["M: Yes, that's a supermoon. When the moon is closest to the Earth, it looks bigger and brighter than usual.","그래, 저게 슈퍼문이야. 달이 지구에 가장 가까이 있을 때, 평소보다 더 크고 밝아 보인단다."],"ow":["정답 ○ — 'When the moon is closest to the Earth, it looks bigger and brighter than usual.'(달이 지구에 가장 가까이 있을 때, 평소보다 더 크고 밝아 보인다.)라고 했다.","오답 ✕ — 'closest to the Earth'(지구에 가장 가까울 때)이므로 멀리 있을 때가 아니라 반대다.","오답 ✕ — 12월은 'Ah, it's in December.'(12월이구나.)처럼 다음 슈퍼문이 보이는 시기일 뿐 크고 밝은 이유가 아니다.","오답 ✕ — 사진은 소녀가 찍고 싶다고 한 것일 뿐 이유와 관계없다. 'I want to take a picture of it.'(사진으로 찍고 싶어요.)","오답 ✕ — 'we can only see a supermoon a few times a year'(1년에 몇 번만 볼 수 있다)는 횟수에 대한 설명이고 크고 밝은 이유가 아니다."],"memo":["정답 ①: 달이 지구에 가장 가까이 있기 때문이다.","근거: When the moon is closest to the Earth, it looks bigger and brighter than usual.(달이 지구에 가장 가까울 때 평소보다 더 크고 밝아 보인다.)","함정: ② closest(가장 가까운)를 far(먼)로 바꾼 보기 ✕"],"why":"달이 지구에 가장 가까울 때 슈퍼문이 더 크고 밝아 보인다."}],"dlg":[["M","Look at the moon!","달 좀 봐!"],["G","Wow! It's so big and bright.","와! 정말 크고 밝아요."],["M","Yes, that's a supermoon. When the moon is closest to the Earth, it looks bigger and brighter than usual.","그래, 저게 슈퍼문이야. 달이 지구에 가장 가까이 있을 때, 평소보다 더 크고 밝아 보인단다."],["G","Oh, that's surprising! Is it possible to see a supermoon every year?","오, 놀라워요! 슈퍼문은 매년 볼 수 있어요?"],["M","Yes, but we can only see a supermoon a few times a year.","응, 하지만 슈퍼문은 1년에 몇 번밖에 볼 수 없어."],["G","I see. So, when can we see the next supermoon?","그렇군요. 그럼 다음 슈퍼문은 언제 볼 수 있어요?"],["M","Let's check. Ah, it's in December.","확인해 보자. 아, 12월이구나."],["G","That's interesting! I want to take a picture of it.","흥미롭네요! 저는 그걸 사진으로 찍고 싶어요."],["M","Sure. Let's take a picture together with the moon.","그래. 달과 함께 같이 사진을 찍자."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["Danger of Walking in Space","Imagination of Travel to the Moon","No Up or Down: Floating in Space","Preparation for the Trip to the Moon","How is It Possible to Float on the Moon?"],"a":2,"ans":"No Up or Down: Floating in Space","evs":[["When the spaceship reached space, everyone experienced zero gravity and began to float.","우주선이 우주에 도달했을 때, 모두가 무중력 상태를 경험하며 떠다니기 시작했습니다."],["Everyone felt comfortable because there is no up or down in space.","우주에서는 위아래가 없기 때문에 모두가 편안하게 느꼈습니다."]],"ev":["When the spaceship reached space, everyone experienced zero gravity and began to float.","우주선이 우주에 도달했을 때, 모두가 무중력 상태를 경험하며 떠다니기 시작했습니다."],"ow":["오답 ✕ — 'Everyone felt comfortable'(모두가 편안하게 느꼈습니다)라고 했으므로 위험하다는 내용이 아니다.","오답 ✕ — 상상이 아니라 'Hohyun's school went on a field trip to the Moon.'(호현이의 학교는 달로 체험 학습을 갔습니다.)처럼 실제로 떠다니는 경험을 그린 글이다.","정답 ○ — 'everyone experienced zero gravity and began to float'(모두 무중력 상태를 경험하며 떠다니기 시작했다)와 'there is no up or down in space'(우주에는 위아래가 없다)가 핵심이므로 위아래가 없는 우주에서 떠다니는 이야기이다.","오답 ✕ — 여행 준비 과정은 나오지 않는다. 'When the spaceship reached space'(우주선이 우주에 도달했을 때)의 이후 모습이다.","오답 ✕ — 달에서 떠다니는 이야기가 아니다. 떠다닌 곳은 'in space'(우주)이고, 달에는 'low gravity'(낮은 중력)가 있다."],"memo":["정답 ③: No Up or Down: Floating in Space(위아래가 없다: 우주에서 떠다니기)","근거: everyone experienced zero gravity and began to float(모두 무중력을 경험하며 떠다니기 시작했다)","함정: ⑤ 떠다닌 곳은 달이 아니라 우주(space)이다 ✕"],"why":"무중력의 우주에서는 위아래가 없어 모두 떠다닌다는 내용이다."}],"pp":[["October 25, 2099","2099년 10월 25일"],["Hohyun's school went on a field trip to the Moon.","호현이의 학교는 달로 체험 학습을 갔습니다."],["When the spaceship reached space, everyone experienced zero gravity and began to float.","우주선이 우주에 도달했을 때, 모두가 무중력 상태를 경험하며 떠다니기 시작했습니다."],["Hohyun pushed Yuchan with his finger, and Yuchan went sailing through the cabin!","호현이는 유찬이를 손가락으로 밀었고, 유찬이는 선실 안을 떠다녔습니다!"],["Kyujin stood upside down on the ceiling.","규진이는 천장에 거꾸로 섰습니다."],["Sihyun was standing on the wall.","시현이는 벽에 서 있었습니다."],["Everyone felt comfortable because there is no up or down in space.","우주에서는 위아래가 없기 때문에 모두가 편안하게 느꼈습니다."]]},{"qs":[{"n":7,"q":"윗글의 제목으로 알맞은 것은?","o":["Eat Enough Food in Space","How to Cook Food in Space","Lunch Time in Space with Magnets","Limitation on Kinds of Food in Space","Minimize the Amount of Food on the Moon"],"a":2,"ans":"Lunch Time in Space with Magnets","evs":[["Lunch was soup and potatoes in special packages.","점심은 특별한 포장 용기에 담긴 수프와 감자였습니다."],["It was possible to fix the package on the table because there were magnets on both the package and the table.","포장 용기와 테이블에는 모두 자석이 있어서 포장 용기를 테이블에 고정할 수 있었습니다."]],"ev":["Lunch was soup and potatoes in special packages.","점심은 특별한 포장 용기에 담긴 수프와 감자였습니다."],"ow":["오답 ✕ — 충분히 먹어야 한다는 말은 없다. 'Lunch was soup and potatoes in special packages.'(점심은 수프와 감자였다.)라는 점심 모습이다.","오답 ✕ — 우주에서 요리하는 방법은 나오지 않는다. 포장 용기에 담긴 음식을 먹는 이야기이다.","정답 ○ — 점심 시간에 'there were magnets on both the package and the table'(포장 용기와 테이블에 자석이 있었다)라서 음식을 고정했으므로 자석과 함께하는 우주에서의 점심 시간이다.","오답 ✕ — 음식 종류를 제한한다는 말은 없다. 'soup and potatoes'(수프와 감자)는 그날의 점심일 뿐이다.","오답 ✕ — 'Keep your food on the table magnet, everyone'(음식을 테이블 자석 위에 두세요)이지 음식의 양을 줄이라는 말이 아니고, 장소도 달이 아니라 우주선 안이다."],"memo":["정답 ③: Lunch Time in Space with Magnets(자석과 함께하는 우주에서의 점심)","근거: there were magnets on both the package and the table(포장 용기와 테이블에 모두 자석이 있었다)","함정: ② 요리법이 아니라 먹는 방법 이야기 ✕"],"why":"우주에서는 자석으로 음식 포장 용기를 테이블에 고정해서 점심을 먹는다."}],"pp":[["Lunch was soup and potatoes in special packages.","점심은 특별한 포장 용기에 담긴 수프와 감자였습니다."],["Plates are not used in space, so everyone ate directly from the packages.","우주에서는 접시를 사용할 수 없어서 모두 포장 용기에서 바로 음식을 먹었습니다."],["It was possible to fix the package on the table because there were magnets on both the package and the table.","포장 용기와 테이블에는 모두 자석이 있어서 포장 용기를 테이블에 고정할 수 있었습니다."],["\"Keep your food on the table magnet, everyone,\" said Ms. Lee, the homeroom teacher.","\"모두 테이블 자석 위에 음식을 올려 두세요,\"라고 담임 선생님인 이 선생님이 말씀하셨습니다."],["\"If it floats away, it may damage the spaceship.\"","\"음식이 떠다니면 우주선에 손상을 줄 수도 있어요.\""]]},{"qs":[{"n":8,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Everyone landed slowly on the Moon.","Jumping high on the Moon was simple.","There were footprints on the Moon.","The footprints were not clear.","It does not rain on the Moon."],"a":3,"ans":"The footprints were not clear.","evs":[["The footprints were over 100 years old, but they still looked perfect.","그 발자국들은 100년이 넘었지만, 여전히 완벽해 보였습니다."],["It's because there's no wind or rain on the Moon,\" Ms. Lee explained.","그건 달에 바람이나 비가 없기 때문이에요,\"라고 이 선생님이 설명했습니다."]],"ev":["The footprints were over 100 years old, but they still looked perfect.","그 발자국들은 100년이 넘었지만, 여전히 완벽해 보였습니다."],"ow":["오답 ✕ — 'Everyone jumped out and landed slowly because the Moon has low gravity.'(달은 낮은 중력을 갖고 있어서 모두 천천히 착지했다.)라고 했으므로 일치한다.","오답 ✕ — 'It was easy to jump high on the Moon.'(달에서는 높이 점프하는 것이 쉬웠습니다.)라고 했으므로 일치한다.","오답 ✕ — 'let's take a look at the footprints of the Apollo astronauts!'(아폴로 우주 비행사들의 발자국을 봅시다!)라고 했으므로 달에 발자국이 있다는 보기는 일치한다.","정답 ○ — 발자국은 100년이 넘었지만 'they still looked perfect'(여전히 완벽해 보였습니다)라고 했으므로 선명했다. 선명하지 않았다는 보기는 일치하지 않는다.","오답 ✕ — 'there's no wind or rain on the Moon'(달에는 바람이나 비가 없다)이라고 했으므로 일치한다."],"memo":["정답 ④: 발자국은 100년이 넘어도 여전히 완벽해 보였다(선명했다).","근거: The footprints were over 100 years old, but they still looked perfect.(발자국은 100년이 넘었지만 여전히 완벽해 보였다.)","함정: 달에는 바람과 비가 없어서 발자국이 변하지 않는다 ✕"],"why":"달의 발자국은 바람과 비가 없어서 100년이 넘어도 완벽해 보인다."}],"pp":[["The spaceship landed on the Moon.","우주선이 달에 착륙했습니다."],["Everyone jumped out and landed slowly because the Moon has low gravity.","달은 낮은 중력을 갖고 있어서 모두 밖으로 뛰어나가서 천천히 착지했습니다."],["It was easy to jump high on the Moon.","달에서는 높이 점프하는 것이 쉬웠습니다."],["When Sihyun jumped, she went over Kyujin's head!","시현이는 점프하면서 규진이의 머리 위로 날아갔습니다!"],["\"Be careful,\" said Ms. Lee.","\"조심하세요,\" 이 선생님이 말했습니다."],["\"It's fun to jump in low gravity, but you can get hurt if you bump into each other.","\"낮은 중력에서 점프하는 건 재미있지만, 서로 부딪히면 다칠 수 있어요."],["Now, everyone, come here and let's take a look at the footprints of the Apollo astronauts!\"","자, 이제 모두 이리로 와서 아폴로 우주 비행사들의 발자국을 봅시다!\""],["The footprints were over 100 years old, but they still looked perfect.","그 발자국들은 100년이 넘었지만, 여전히 완벽해 보였습니다."],["\"It's because there's no wind or rain on the Moon,\" Ms. Lee explained.","\"그건 달에 바람이나 비가 없기 때 var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';

 });

}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}

 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});

function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){

 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){

   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';

function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
