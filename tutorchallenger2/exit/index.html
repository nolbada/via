<script>
var P=[{"u":1,"id":"ch2-01-1","no":1,"ko":"손을 들어 모두, 샤카!","items":[{"n":1,"t":"tf","q":"The word shaka probably comes from an expression that means an insult.","ko":"‘샤카’라는 말은 아마도 모욕을 뜻하는 표현에서 나왔다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The term shaka itself is probably a variation on the common expression “shark eye,” which is a compliment paid to show respect.","‘샤카’라는 용어 자체는 아마도 존경심을 나타내기 위해 바쳐지는 찬사인 ‘상어의 눈’이라는 흔한 표현의 변형일 것이다."]],"w":"6번에서 ‘shark eye’는 존경심을 나타내려고 건네는 찬사(compliment)라고 해요. 모욕(insult)은 정반대 뜻이에요.","c":"F"},"h":"8493f0e0dd"},{"n":2,"t":"tf","q":"Even businessmen use the shaka as a friendly gesture.","ko":"사업가들도 샤카를 다정한 제스처로 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"From businessmen to surfers, everyone uses this friendly gesture.","사업가에서부터 서퍼들에 이르기까지, 모든 사람들이 이 다정한 제스처를 사용한다."]],"w":"3번에서 사업가에서 서퍼들에 이르기까지 모든 사람이 이 다정한 제스처를 쓴다고 해요. 사업가도 포함돼요.","c":"T"},"h":"2457a8bef7"},{"n":3,"t":"tf","q":"The first step in making a shaka is to open your hand wide.","ko":"샤카를 만드는 첫 번째 단계는 손을 활짝 펴는 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"The first step is to make a fist.","첫 번째 단계는 주먹을 쥐는 것이다."]],"w":"10번에서 첫 번째 단계는 주먹을 쥐는 것(make a fist)이에요. 손을 활짝 펴는 게 아니에요.","c":"F"},"h":"bbbcf180c8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If you ever visit Hawaii, the locals will probably greet you with an unusual hand gesture and the words “shaka brah.”)","ko":"당신이 언젠가 하와이를 방문한다면, 현지인들은 아마도 독특한 손짓과 ‘샤카 브라’라는 말로 당신을 (   ) 것이다.","opts":["무시하다","맞이하다","가르치다","따라가다"],"word":"greet","r":{"a":"2) 맞이하다","ev":"1번 문장","s":[[1,"If you ever visit Hawaii, the locals will probably greet you with an unusual hand gesture and the words “shaka brah.”","당신이 언젠가 하와이를 방문한다면, 현지인들은 아마도 독특한 손짓과 ‘샤카 브라’라는 말로 당신을 맞이할 것이다."]],"w":"1번은 하와이에 가면 현지인들이 독특한 손짓과 ‘샤카 브라’라는 말로 당신을 ( ) 것이라는 내용이에요. 인사하는 장면이라 greet는 ‘맞이하다, 인사하다’예요. greet → greet(맞이하다).","c":2},"h":"cdb8e3c9a4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (No one is sure where the shaka first originated, ...)","ko":"누구도 ‘샤카’가 처음에 어디에서 (   ) 확신하지 못하지만, ...","opts":["끝났는지","사라졌는지","유래했는지","팔렸는지"],"word":"originated","r":{"a":"3) 유래했는지","ev":"5번 문장","s":[[5,"No one is sure where the shaka first originated, but the most common theory is that it stems from beach culture.","누구도 ‘샤카’가 처음에 어디에서 유래했는지 확신하지 못하지만, 가장 일반적인 이론은 그것이 해변 문화에서 비롯한다는 것이다."]],"w":"5번에서 where the shaka first originated는 ‘샤카가 처음에 어디에서 생겨났는지’예요. 뒤에서 가장 흔한 이론은 해변 문화에서 비롯한다(stems from)고 하니, originate는 ‘유래하다, 비롯되다’예요.","c":3},"h":"d6debbefa2"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe shaka gesture became popular in the 1960s thanks to local celebrity Lippy Espinda, who used it in television advertisements.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"샤카 제스처는 1960년대에 지역 유명 인사인 리피 에스핀다 덕분에 인기를 얻게 되었는데, 그는 이것을 텔레비전 광고에서 사용했다.","opts":["리피 에스핀다","샤카 제스처","텔레비전 광고","1960년대"],"pron":"it","r":{"a":"2) 샤카 제스처","ev":"7번 문장","s":[[7,"The shaka gesture became popular in the 1960s thanks to local celebrity Lippy Espinda, who used it in television advertisements.","샤카 제스처는 1960년대에 지역 유명 인사인 리피 에스핀다 덕분에 인기를 얻게 되었는데, 그는 이것을 텔레비전 광고에서 사용했다."]],"c":2,"k":"it = 샤카 제스처"},"h":"39514b37e8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"From then on, everyone began using the shaka as a friendly show of goodwill.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그때부터 모든 사람들이 ‘샤카’를 다정한 호의의 표시로 사용하기 시작했다.","opts":["그때부터 샤카는 광고에서만 쓰이게 되었다.","그때부터 아무도 샤카를 호의의 표시로 쓰지 않았다.","그때까지 모든 사람들이 샤카를 호의의 표시로 써 왔다.","그때부터 모든 사람들이 샤카를 다정한 호의의 표시로 쓰기 시작했다."],"r":{"a":"4) 그때부터 모든 사람들이 샤카를 다정한 호의의 표시로 쓰기 시작했다.","ev":"8번 문장","s":[[8,"From then on, everyone began using the shaka as a friendly show of goodwill.","그때부터 모든 사람들이 ‘샤카’를 다정한 호의의 표시로 사용하기 시작했다."]],"w":"From then on은 ‘그때부터’, began using은 ‘쓰기 시작했다’(begin 시작하다)예요. 그래서 그때부터 모든 사람이 쓰기 시작했다는 ④가 맞아요. ③은 ‘그때까지 써 왔다’여서 반대예요.","c":4},"h":"d927e914c4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The shaka is used only by surfers in Hawaii.","The last step of making a shaka is to move your hand as if writing the letter “J.”","People in Hawaii stopped using the shaka after the 1960s.","The word shaka comes from the name of a famous surfer."],"oko":["샤카는 하와이에서 서퍼들만 사용한다.","샤카를 만드는 마지막 단계는 마치 문자 ‘J’를 쓰는 것처럼 손을 움직이는 것이다.","하와이 사람들은 1960년대 이후 샤카를 쓰지 않게 되었다.","샤카라는 말은 유명한 서퍼의 이름에서 나왔다."],"r":{"a":"2) The last step of making a shaka is to move your hand as if writing the letter “J.” (샤카를 만드는 마지막 단계는 마치 문자 ‘J’를 쓰는 것처럼 손을 움직이는 것이다.)","ev":"13번 문장","s":[[13,"Finally, move it as if writing the letter “J.”","마지막으로 마치 문자 ‘J’를 쓰는 것처럼 손을 움직여라."]],"c":2,"k":null},"h":"161f8990a6"},{"n":9,"t":"sum","q":"The shaka is (A) throughout Hawaii, and it helps to create (B) among different ethnic groups.","ko":"샤카는 하와이 전역에서 (A) 서로 다른 민족들 사이에 (B)을(를) 만드는 데 도움이 된다.","opts":["(A) secret / (B) harmony","(A) popular / (B) competition","(A) rare / (B) fear","(A) formal / (B) harmony","(A) popular / (B) harmony"],"oko":["(A) 비밀스러운 / (B) 조화","(A) 인기 있는 / (B) 경쟁","(A) 드문 / (B) 두려움","(A) 격식 있는 / (B) 조화","(A) 인기 있는 / (B) 조화"],"r":{"a":"5) (A) popular / (B) harmony ((A) 인기 있는 / (B) 조화)","ev":"2번, 4번 문장","s":[[2,"This warm welcome, known as the shaka, is popular throughout the islands.","‘샤카’라고 알려진 이 따뜻한 환영은, 하와이 제도 전체에 걸쳐 인기가 있다."],[4,"It helps to promote peace and harmony among the wide range of ethnic groups living there.","이것은 그곳에 살고 있는 다양한 민족들 사이에서 평화와 조화를 증진하도록 돕는다."]],"c":5,"k":null},"h":"9dd41fb269"},{"n":10,"t":"fill","q":"Then, [A] your hand so that your [B] is facing towards you.","ko":"그러고 나서 [B]이(가) 당신 쪽을 향하도록 손을 [A].","bank":["turn","palm","visit","promote","ethnic","theory"],"bko":{"turn":"돌리다","palm":"손바닥","visit":"방문하다","promote":"촉진하다","ethnic":"민족의","theory":"이론"},"r":{"a":"[A] turn (돌리다), [B] palm (손바닥)","ev":"12번 문장","s":[[12,"Then, turn your hand so that your palm is facing towards you.","그러고 나서 당신의 손바닥이 당신 쪽을 향하도록 손을 돌려라."]],"c":null,"k":null},"h":"3e5f8638b3"}]},{"u":1,"id":"ch2-01-2","no":2,"ko":"보기만 해도 아찔해요!","items":[{"n":1,"t":"tf","q":"The temple has twenty chambers connected by narrow stairs and bridges.","ko":"이 절에는 좁은 계단과 다리로 연결된 20개의 방이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"The temple features forty chambers connected by narrow stairs and bridges.","이 절은 좁은 계단과 다리로 연결된 40개의 방을 특징으로 한다."]],"w":"8번에서 이 절은 좁은 계단과 다리로 연결된 40개의 방(forty chambers)을 가졌다고 해요. 20개가 아니에요.","c":"F"},"h":"5726b01a5c"},{"n":2,"t":"tf","q":"The temple’s high position keeps it safe from floods of a nearby river.","ko":"이 절의 높은 위치는 인근 강의 홍수로부터 절을 안전하게 지켜 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"One reason is that the elevated location protects the temple from the floods of the nearby river.","한 가지 이유는 높은 위치가 이 절을 인근 강의 홍수로부터 보호해 준다는 것이다."]],"w":"11번에서 높은 위치가 이 절을 인근 강의 홍수로부터 보호해 준다(protects)고 해요.","c":"T"},"h":"86ea4f068a"},{"n":3,"t":"tf","q":"The slender wooden poles carry most of the temple’s weight.","ko":"가느다란 나무 기둥들이 이 절 무게의 대부분을 견딘다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It is easy to assume that these poles play a key role in supporting the structure; however, the temple was actually constructed in a way that lets the rock face carry the majority of the weight.","그 기둥들이 구조물을 지탱하는 데 중요한 역할을 한다고 추측하기 쉽지만, 그 절은 실제로 암석 면이 무게의 대부분을 견디는 방법으로 건설되었다."]],"w":"6번에서 기둥이 중요한 역할을 한다고 추측하기 쉽지만, 실제로는 암석 면(the rock face)이 무게의 대부분을 견딘다고 해요.","c":"F"},"h":"bdc2eab14b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Despite looking fragile, the Hanging Temple has remarkably been “hanging” there for about fifteen hundred years!)","ko":"(   ) 보이는데도, 이 현공사는 놀랍게도 약 1,500년 동안 그곳에 ‘매달려’ 있었다!","opts":["단단한","부서지기 쉬운","거대한","따뜻한"],"word":"fragile","r":{"a":"2) 부서지기 쉬운","ev":"4번 문장","s":[[4,"Despite looking fragile, the Hanging Temple has remarkably been “hanging” there for about fifteen hundred years!","부서지기 쉬워 보이지만, 이 현공사는 놀랍게도 약 1,500년 동안 그곳에 ‘매달려’ 있었다!"]],"w":"Despite(~에도 불구하고)는 뒤와 반대되는 내용을 이끌어요. 1,500년 동안 매달려 있었다는 놀라운 사실과 반대로, 겉보기에는 쉽게 부서질 듯 보인다는 뜻이라 fragile은 ‘부서지기 쉬운’이에요.","c":2},"h":"6a8746ce5c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Ironically, this once-remote place has become a popular tourist attraction.)","ko":"역설적이게도, 한때 (   ) 장소였던 이곳은 인기 있는 관광 명소가 되었다.","opts":["외딴","붐비는","유명한","새로운"],"word":"remote","r":{"a":"1) 외딴","ev":"13번 문장","s":[[13,"Ironically, this once-remote place has become a popular tourist attraction.","역설적이게도, 한때 외딴 장소였던 이곳은 인기 있는 관광 명소가 되었다."]],"w":"13번은 한때 remote였던 곳이 지금은 인기 있는 관광 명소가 되었다는 역설이에요. 관광객이 몰리는 것과 반대되는 말이어야 하므로 remote는 ‘외딴’이에요.","c":1},"h":"a1a9d79cb8"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nAnother is its tranquil setting, which creates an ideal place for meditation and the search for inner peace.","ko":"밑줄 친 which이(가) 가리키는 것은?","sko":"또 다른 이유는 평온한 환경으로, 그것은 명상과 내면의 평화 추구를 위해 이상적인 장소를 만들어 준다.","opts":["명상","평온한 환경","이상적인 장소","내면의 평화"],"r":{"a":"2) 평온한 환경","ev":"12번 문장","s":[[12,"Another is its tranquil setting, which creates an ideal place for meditation and the search for inner peace.","또 다른 이유는 평온한 환경으로, 그것은 명상과 내면의 평화 추구를 위해 이상적인 장소를 만들어 준다."]],"w":"which 앞에 쉼표가 있고 바로 앞 명사구가 its tranquil setting(평온한 환경)이에요. which는 이 환경을 덧붙여 설명하며, 그 환경이 명상과 내면의 평화를 위한 이상적인 장소를 만들어 준다는 뜻이에요.","c":2},"h":"d551cb2143"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Renowned for its location, the temple is ingeniously built into a cliff more than seventy-five meters above the ground.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것의 위치로 유명한 이 절은, 땅 위로 75미터 이상 떨어진 절벽에 기발하게 지어졌다.","opts":["이 절은 땅에서 75미터 아래의 절벽에 기발하게 지어졌다.","이 절은 위치 때문에 유명해지지 못한 채 땅 위에 지어졌다.","이 절은 75미터도 안 되는 낮은 절벽에 기발하게 지어졌다.","위치로 유명한 이 절은 땅 위 75미터가 넘는 절벽에 기발하게 지어졌다."],"r":{"a":"4) 위치로 유명한 이 절은 땅 위 75미터가 넘는 절벽에 기발하게 지어졌다.","ev":"3번 문장","s":[[3,"Renowned for its location, the temple is ingeniously built into a cliff more than seventy-five meters above the ground.","그것의 위치로 유명한 이 절은, 땅 위로 75미터 이상 떨어진 절벽에 기발하게 지어졌다."]],"w":"Renowned for its location은 ‘위치로 유명한’이고, more than seventy-five meters above the ground는 ‘땅 위 75미터 넘게’예요. 그래서 위치로 유명하고 지상 75미터 넘는 절벽에 지어졌다는 ④가 맞아요.","c":4},"h":"90402af109"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이 절은 깊은 계곡의 바닥에 있다.","이 절에는 한 종교만을 위한 조각상이 있다.","이 절에는 세 가지 신앙 체계를 기리는 87개의 조각상이 있다.","이 절의 암석 면은 약해서 무게를 전혀 견디지 못한다."],"opts":["The temple is located at the bottom of a deep valley.","The temple has statues for only one religion.","The temple has eighty-seven statues that honor three belief systems.","The temple’s rock face is too weak to carry any weight."],"r":{"a":"3) The temple has eighty-seven statues that honor three belief systems.","ev":"9번 문장","s":[[9,"It also integrates three religions—Buddhism, Taoism, and Confucianism—and is home to eighty-seven statues that honor these belief systems.","이 절은 또한 불교, 도교, 유교라는 세 가지 종교를 통합하면서, 이 신앙 체계를 기리는 87개의 조각상의 보금자리이다."]],"w":"9번에서 불교, 도교, 유교 세 종교를 통합하고 이 신앙 체계들을 기리는 87개의 조각상이 있다고 해요. 절은 땅 위 높은 절벽에 있고(3번), 암석 면이 무게의 대부분을 견뎌요(6번).","c":3},"h":"5d0420ed3c"},{"n":9,"t":"sum","q":"The (A) of the Hanging Temple is just as (B) as its exterior.","ko":"현공사의 (A)은(는) 외관만큼이나 (B)다.","opts":["(A) interior / (B) distinct","(A) interior / (B) ordinary","(A) river / (B) distinct","(A) stairs / (B) boring","(A) bridge / (B) ordinary"],"oko":["(A) 내부 / (B) 독특하","(A) 내부 / (B) 평범하","(A) 강 / (B) 독특하","(A) 계단 / (B) 지루하","(A) 다리 / (B) 평범하"],"r":{"a":"1) (A) interior / (B) distinct ((A) 내부 / (B) 독특하)","ev":"7번 문장","s":[[7,"The interior of the temple is just as distinct as its exterior.","이 절의 내부는 외관만큼이나 독특하다."]],"c":1,"k":null},"h":"65b7fba44d"},{"n":10,"t":"fill","q":"The temple’s secret is its [A] design, which includes slender wooden poles [B] in the rock.","ko":"이 절의 비밀은 암석 안에 [B] 가느다란 나무 기둥들을 포함하는 [A] 설계이다.","bank":["unique","embedded","river","cliff","religion","weight"],"bko":{"unique":"독특한","embedded":"박힌","river":"강","cliff":"절벽","religion":"종교","weight":"무게"},"r":{"a":"[A] unique (독특한), [B] embedded (박힌)","ev":"5번 문장","s":[[5,"The secret is its unique architectural design, which includes slender wooden poles that are embedded in the rock and function as the foundation.","그 비밀은 독특한 건축 설계에 있는데, 그것은 암석 안에 박혀서 기반으로서 역할을 하는 가느다란 나무 기둥들을 포함한다."]],"c":null,"k":null},"h":"9aac1abd4e"}]},{"u":1,"id":"ch2-01-3","no":3,"ko":"‘무’시’무’시한 축제","items":[{"n":1,"t":"tf","q":"Noche de Rabanos was started by farmers about ten years ago.","ko":"Noche de Rabanos는 약 10년 전에 농부들이 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It was started more than 100 years ago by merchants at the town plaza.","그것은 100년도 더 전에 마을 광장에서 상인들에 의해 시작되었다."]],"w":"5번에서 이 행사는 100년도 더 전에 마을 광장의 상인들(merchants)이 시작했다고 해요. 10년 전, 농부가 아니에요.","c":"F"},"h":"6e68d7b237"},{"n":2,"t":"tf","q":"The special radishes can weigh as much as three kilograms.","ko":"특별한 무는 무게가 3kg까지 나가기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"These radishes, which can weigh as much as three kilograms, are harvested on December 18.","무게가 무려 3kg나 되기도 하는 이 무는 12월 18일에 수확된다."]],"w":"12번에서 이 무는 can weigh as much as three kilograms(무게가 무려 3kg나 되기도 한다)라고 해요.","c":"T"},"h":"3d24b3d6f8"},{"n":3,"t":"tf","q":"The person who carves the best radish wins a small prize of 300 pesos.","ko":"최고의 무를 조각하는 사람은 300페소의 작은 상을 받는다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"The person who carves the best radish wins a grand prize of over 30,000 pesos.","최고의 무를 조각하는 사람은 30,000페소가 넘는 상금을 받는다."]],"w":"14번에서 최고의 무를 조각하는 사람은 30,000페소가 넘는 큰 상(grand prize)을 받는다고 해요. 작은 상이 아니에요.","c":"F"},"h":"132844e6b0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Hoping to attract Christmas shoppers, they would carve designs into the bright red skin of radishes.)","ko":"크리스마스 쇼핑객들을 (   ) 바라며, 그들은 무의 밝은 붉은색 껍질에 무늬를 새겨 넣곤 했다.","opts":["쫓아내기를","가르치기를","끌어모으기를","속이기를"],"word":"attract","r":{"a":"3) 끌어모으기를","ev":"6번 문장","s":[[6,"Hoping to attract Christmas shoppers, they would carve designs into the bright red skin of radishes.","크리스마스 쇼핑객들을 끌어모으기를 바라며, 그들은 무의 밝은 붉은색 껍질에 무늬를 새겨 넣곤 했다."]],"w":"상인들이 무에 무늬를 새긴 것은 쇼핑객들이 가게로 오게 하려는 목적이에요. attract는 ‘끌어모으다, 끌어당기다’예요.","c":3},"h":"89846f2263"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In 1897, Noche de Rabanos became an official holiday in Oaxaca.)","ko":"1897년에, Noche de Rabanos는 와하카의 (   ) 공휴일이 되었다.","opts":["공식적인","비밀스러운","오래된","위험한"],"word":"official","r":{"a":"1) 공식적인","ev":"9번 문장","s":[[9,"In 1897, Noche de Rabanos became an official holiday in Oaxaca.","1897년에, Noche de Rabanos는 와하카의 공휴일이 되었다."]],"w":"holiday(공휴일) 앞에 오는 official은 ‘공식적인’이에요. 5~8번에서 상인들의 행사로 시작되어, 1897년에 나라가 인정하는 공휴일이 되었다는 흐름이에요.","c":1},"h":"6086632804"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey bought the carved radishes and placed them in the center of the table at Christmas dinner.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"그들은 조각된 무를 사서 그것들을 크리스마스 저녁 식탁 가운데에 놓았다.","opts":["사람들","조각된 무","크리스마스 저녁 식사","마을 광장의 상인들"],"r":{"a":"2) 조각된 무","ev":"8번 문장","s":[[8,"They bought the carved radishes and placed them in the center of the table at Christmas dinner.","그들은 조각된 무를 사서 그것들을 크리스마스 저녁 식탁 가운데에 놓았다."]],"w":"They bought the carved radishes and placed them…에서 사서 식탁 가운데에 놓은 것은 조각된 무예요. them은 the carved radishes를 받아요. 산 사람(They)은 사람들이에요.","c":2},"h":"15b284bcdd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But south of the border, in Oaxaca, Mexico, there is a different carving tradition that happens around Christmas instead of Halloween.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 국경 남쪽, 멕시코의 와하카에는, 핼러윈 대신에 크리스마스 무렵에 벌어지는 다른 조각 전통이 있다.","opts":["멕시코 와하카에는 핼러윈 무렵에 벌어지는 다른 조각 전통이 있다.","와하카의 조각 전통은 미국의 호박등 전통과 같은 시기에 벌어진다.","멕시코에는 크리스마스 무렵에 하는 조각 전통이 하나도 없다.","멕시코 와하카에는 핼러윈이 아니라 크리스마스 무렵에 벌어지는 다른 조각 전통이 있다."],"r":{"a":"4) 멕시코 와하카에는 핼러윈이 아니라 크리스마스 무렵에 벌어지는 다른 조각 전통이 있다.","ev":"2번 문장","s":[[2,"But south of the border, in Oaxaca, Mexico, there is a different carving tradition that happens around Christmas instead of Halloween.","하지만 국경 남쪽, 멕시코의 와하카에는, 핼러윈 대신에 크리스마스 무렵에 벌어지는 다른 조각 전통이 있다."]],"w":"But south of the border는 ‘하지만 국경 남쪽’, instead of Halloween은 ‘핼러윈 대신’이에요. 그래서 핼러윈이 아니라 크리스마스 무렵에 벌어지는 다른 조각 전통이라는 ④가 맞아요.","c":4},"h":"933179e6d4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["조각 대회에는 유명한 예술가들만 참가한다.","이 행사는 12월 18일에 열린다.","조각에 쓰는 무는 보통 무보다 더 크고 식용이 아니다.","조각에 쓰는 무는 보통 무보다 작다."],"opts":["Only famous artists take part in the carving.","The event takes place on December 18.","The radishes used for carving are larger than normal and not for food.","The radishes used for carving are smaller than normal."],"r":{"a":"3) The radishes used for carving are larger than normal and not for food.","ev":"11번 문장","s":[[11,"They use special radishes that are larger than normal and not used for food.","그들은 보통 무보다 더 크고 식용이 아닌 특별한 무를 사용한다."]],"w":"11번에서 조각용 무는 보통보다 더 크고 식용이 아닌 특별한 무라고 해요. 조각은 지역 예술가와 아마추어가 하고(10번), 행사는 12월 23일에 열리며(4번), 12월 18일은 무를 수확하는 날이에요(12번).","c":3},"h":"af848edf11"},{"n":9,"t":"sum","q":"As a (A) Halloween tradition, people in the United States carve (B) faces into pumpkins.","ko":"(A) 핼러윈 전통으로서, 미국 사람들은 호박에 (B) 얼굴을 새긴다.","opts":["(A) beloved / (B) scary","(A) beloved / (B) smiling","(A) forgotten / (B) scary","(A) strange / (B) funny","(A) forgotten / (B) happy"],"oko":["(A) 사랑받는 / (B) 무서운","(A) 사랑받는 / (B) 웃는","(A) 잊힌 / (B) 무서운","(A) 낯선 / (B) 우스운","(A) 잊힌 / (B) 행복한"],"r":{"a":"1) (A) beloved / (B) scary ((A) 사랑받는 / (B) 무서운)","ev":"1번 문장","s":[[1,"As a beloved Halloween tradition, people in the United States carve scary faces into pumpkins to create jack-o’-lanterns.","사랑받는 핼러윈 전통으로서, 미국인들은 호박에 무서운 얼굴을 새겨서 호박등을 만든다."]],"c":1,"k":null},"h":"0516ef9571"},{"n":10,"t":"fill","q":"The radishes are harvested early so that the carvers have a few days to [A] on their creations before [B] them in the plaza.","ko":"무를 일찍 수확해서 조각가들은 광장에서 작품을 [B]하기 전에 작품에 공을 들일 며칠을 [A]한다.","bank":["work","exhibiting","harvest","buy","harvesting","winning"],"bko":{"work":"공들이다","exhibiting":"전시하는 것","harvest":"수확하다","buy":"사다","harvesting":"수확하는 것","winning":"이기는 것"},"r":{"a":"[A] work (공들이다), [B] exhibiting (전시하는 것)","ev":"13번 문장","s":[[13,"This gives the carvers a few days to work on their creations before exhibiting them in the town plaza.","이것은 조각가들이 마을 광장에서 그것들을 전시하기 전에 그들의 작품에 공을 들일 며칠을 준다."]],"c":null,"k":null},"h":"0666e9ccc5"}]},{"u":1,"id":"ch2-01-4","no":4,"ko":"수능:ON 주제 · 제목","items":[{"n":1,"t":"tf","q":"Visitors can enter the mine only by walking down a long tunnel.","ko":"방문객들은 긴 터널을 걸어 내려가야만 광산에 들어갈 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Visitors can enter by taking an elevator or walking down a long tunnel.","방문객들은 엘리베이터를 타거나 긴 터널을 걸어 내려가서 입장할 수 있다."]],"w":"4번에서 엘리베이터를 타거나(taking an elevator) 긴 터널을 걸어 내려가서 입장할 수 있다고 해요. ‘터널로만’이 아니에요.","c":"F"},"h":"7d865a7e53"},{"n":2,"t":"tf","q":"The bottom of the mine has a Ferris wheel and a bowling alley.","ko":"광산의 바닥에는 대회전 관람차와 볼링장이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"There is a sports arena, a Ferris wheel, a bowling alley, and even a miniature golf course.","그곳에는 스포츠 경기장과 대회전 관람차, 볼링장, 그리고 미니 골프 코스까지 있다."]],"w":"9번에서 스포츠 경기장, 대회전 관람차(Ferris wheel), 볼링장(bowling alley), 미니 골프 코스가 있다고 해요.","c":"T"},"h":"42f8e6b9de"},{"n":3,"t":"tf","q":"The mine looks like a modern factory.","ko":"광산은 현대적인 공장처럼 보인다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The mine looks like something from a fairytale.","광산은 동화에 나오는 것처럼 보인다."]],"w":"11번에서 광산은 동화(fairytale)에 나오는 것처럼 보인다고 해요. 현대적인 공장이라는 말은 없어요.","c":"F"},"h":"d1bc46e752"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The mine is about 12 degrees Celsius year round and the air’s humidity remains at approximately 80%.)","ko":"광산은 일 년 내내 약 섭씨 12도이고, 공기의 습도는 (   ) 80%로 유지된다.","opts":["정확히","겨우","대략","적어도"],"word":"approximately","r":{"a":"3) 대략","ev":"5번 문장","s":[[5,"The mine is about 12 degrees Celsius year round and the air’s humidity remains at approximately 80%.","광산은 일 년 내내 약 섭씨 12도이고, 공기의 습도는 대략 80%로 유지된다."]],"w":"5번의 앞부분에 about 12 degrees(약 12도)가 있고, 습도에도 비슷한 말인 approximately가 쓰였어요. about처럼 ‘대략’이라는 뜻이에요.","c":3},"h":"da9b73385b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People can also check out the original mining equipment or rent a boat to take a tour of an underground lake.)","ko":"사람들은 또한 초기의 채굴 장비를 확인하거나 지하 호수를 관광하기 위해 배를 (   ) 수도 있다.","opts":["고치다","빌리다","만들다","씻다"],"word":"rent","r":{"a":"2) 빌리다","ev":"10번 문장","s":[[10,"People can also check out the original mining equipment or rent a boat to take a tour of an underground lake.","사람들은 또한 초기의 채굴 장비를 확인하거나 지하 호수를 관광하기 위해 배를 빌릴 수도 있다."]],"w":"to take a tour(관광하기 위해)라는 목적이 이어져요. 관광객이 배를 타려고 하는 일이라 rent는 ‘빌리다’예요.","c":2},"h":"85f3ba6dcf"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThe bottom of the mine, which is covered by a layer of salt, offers visitors many fun things to do.","ko":"밑줄 친 which이(가) 가리키는 것은?","sko":"광산의 바닥은 소금층으로 덮여 있는데, 방문객들에게 할 수 있는 많은 재미있는 것들을 제공한다.","opts":["광산의 바닥","소금층","방문객들","재미있는 것들"],"pron":"which","r":{"a":"1) 광산의 바닥","ev":"8번 문장","s":[[8,"The bottom of the mine, which is covered by a layer of salt, offers visitors many fun things to do.","광산의 바닥은 소금층으로 덮여 있는데, 방문객들에게 할 수 있는 많은 재미있는 것들을 제공한다."]],"c":1,"k":"which = 광산의 바닥"},"h":"2a84f3e16e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, however, it has been turned into an underground museum and theme park!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나, 현재 그곳은 지하 박물관이자 테마 파크로 바뀌었다!","opts":["그곳은 지금도 소금 광산으로만 쓰이고 있다.","그곳은 지하 박물관이었다가 지금은 소금 광산이 되었다.","그곳은 박물관과 테마 파크를 짓기 위해 문을 닫았다.","그러나 현재 그곳은 지하 박물관이자 테마 파크로 바뀌었다."],"r":{"a":"4) 그러나 현재 그곳은 지하 박물관이자 테마 파크로 바뀌었다.","ev":"3번 문장","s":[[3,"Now, however, it has been turned into an underground museum and theme park!","그러나, 현재 그곳은 지하 박물관이자 테마 파크로 바뀌었다!"]],"w":"Now, however는 ‘그러나 지금은’이고, has been turned into는 ‘~로 바뀌었다’예요. 그래서 옛 광산이 지금은 지하 박물관과 테마 파크가 되었다는 ④가 맞아요. ②는 순서가 반대예요.","c":4},"h":"21f555399e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["투르다 소금 광산은 처음부터 테마 파크로 지어졌다.","광산의 습도는 계절에 따라 크게 달라진다.","그곳은 로마인들이 판 큰 소금 광산이었다.","방문객들은 걸어서만 입장할 수 있다."],"opts":["The Turda salt mine was built as a theme park from the start.","The humidity of the mine changes greatly with the seasons.","The place was once a large salt mine dug by the Romans.","Visitors can enter only on foot."],"r":{"a":"3) The place was once a large salt mine dug by the Romans.","ev":"2번 문장","s":[[2,"The place was once a large salt mine that was dug by the Romans long ago.","그 장소는 오래전에 로마인들이 파 놓은 한때는 거대한 소금 광산이었던 곳이다."]],"w":"2번에서 그곳은 한때 로마인들이 오래전에 판 큰 소금 광산이었다고 해요. 처음부터 테마 파크는 아니고(3번), 습도는 약 80%로 유지되며(5번), 엘리베이터로도 입장해요(4번).","c":3},"h":"69922a30ab"},{"n":9,"t":"sum","q":"In Romania, there is a surprising (A) attraction located 120 meters (B) the ground near the city of Turda.","ko":"루마니아에는 투르다 시 인근 땅 (B) 120미터에 위치한 놀라운 (A) 명소가 있다.","opts":["(A) tourist / (B) beneath","(A) tourist / (B) above","(A) dangerous / (B) beneath","(A) dangerous / (B) above","(A) ordinary / (B) above"],"oko":["(A) 관광 / (B) 아래","(A) 관광 / (B) 위","(A) 위험한 / (B) 아래","(A) 위험한 / (B) 위","(A) 평범한 / (B) 위"],"r":{"a":"1) (A) tourist / (B) beneath ((A) 관광 / (B) 아래)","ev":"1번 문장","s":[[1,"In Romania, there is a surprising tourist attraction located 120 meters beneath the ground near the city of Turda.","루마니아에는 투르다 시 인근 지하 120미터에 위치한 놀라운 관광 명소가 있다."]],"c":1,"k":null},"h":"16759d3b5b"},{"n":10,"t":"fill","q":"An interesting [A] of old and new, the Turda salt mine is a great example of how places from the past can be [B] back to life.","ko":"옛것과 새것의 흥미로운 [A]인 투르다 소금 광산은 과거의 장소가 어떻게 다시 [B] 수 있는지의 좋은 예이다.","bank":["combination","brought","sent","dug","humidity","dust"],"bko":{"combination":"조합","brought":"되살려진 (bring의 과거분사)","sent":"보내진 (send의 과거분사)","dug":"파진 (dig의 과거분사)","humidity":"습도","dust":"먼지"},"r":{"a":"[A] combination (조합), [B] brought (되살려진 (bring의 과거분사))","ev":"12번 문장","s":[[12,"An interesting combination of old and new, the Turda salt mine is a great example of how places from the past can be brought back to life.","옛것과 새것의 흥미로운 조합인 투르다 소금 광산은 과거의 장소가 어떻게 되살려지는지의 좋은 예이다."]],"c":null,"k":null},"h":"c42d07b1b9"}]},{"u":2,"id":"ch2-02-1","no":1,"ko":"이 색, 무슨 소리야?","items":[{"n":1,"t":"tf","q":"The eyeborg is an electronic eye that Harbisson wears on his head.","ko":"아이보그는 하비슨이 머리에 쓰는 전자 눈이다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"It functions as an electronic eye that Harbisson wears on his head.","그것은 하비슨이 머리에 쓰는 전자 눈으로서의 기능을 한다."]],"w":"7번 문장에 an electronic eye that Harbisson wears on his head가 그대로 있어요. 하비슨이 머리에 쓰는 전자 눈이라는 내용과 일치해요.","c":"T"},"h":"1e98295cb0"},{"n":2,"t":"tf","q":"The information is sent to a chip at the front of Harbisson’s head.","ko":"정보는 하비슨의 머리 앞쪽에 있는 칩으로 보내진다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"This information is then sent to a chip at the back of Harbisson’s head.","그러고 나서 이 정보는 그의 머리 뒤쪽 칩으로 보내진다."]],"w":"9번 문장에서 정보는 머리의 앞쪽(front)이 아니라 뒤쪽(the back of Harbisson’s head)에 있는 칩으로 보내져요.","c":"F"},"h":"64d8ae2afb"},{"n":3,"t":"tf","q":"Harbisson was born with normal vision, but he lost it later.","ko":"하비슨은 정상적인 시력을 가지고 태어났지만 나중에 그것을 잃었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Born completely color blind, Harbisson could only perceive shades of gray.","완전히 색맹으로 태어나서, 하비슨은 회색의 색조만 감지할 수 있었다."]],"w":"5번 문장에서 하비슨은 완전히 색맹으로 태어나(Born completely color blind) 회색의 색조만 감지할 수 있었어요. 정상 시력을 잃은 것이 아니에요.","c":"F"},"h":"8e28b83e70"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This may seem peculiar, but this reflects how Neil Harbisson experiences the world on a daily basis.)","ko":"이것은 이상해 보이지만, 닐 하비슨이 매일 세상을 어떻게 경험하는지 나타낸다. (peculiar의 뜻은?)","opts":["흔한","편리한","이상한","값비싼"],"word":"peculiar","r":{"a":"3) 이상한","ev":"3번 문장","s":[[3,"This may seem peculiar, but this reflects how Neil Harbisson experiences the world on a daily basis.","이것은 이상해 보이지만, 닐 하비슨이 매일 세상을 어떻게 경험하는지 나타낸다."]],"w":"3번 문장은 but으로 이어져요. '이상해 보이지만(peculiar) 사실은 그의 일상'이라는 흐름이라, peculiar는 '이상한, 기이한'이에요.","c":3},"h":"83d0880ede"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…led to the development of an innovative device known as an eyeborg.)","ko":"…‘아이보그’라고 알려진 한 획기적인 장치를 개발하는 것으로 이어졌다. (innovative의 뜻은?)","opts":["평범한","획기적인","불편한","값싼"],"word":"innovative","r":{"a":"2) 획기적인","ev":"6번 문장","s":[[6,"However, meeting computer scientist Adam Montandon led to the development of an innovative device known as an eyeborg.","그러나, 컴퓨터 과학자인 아담 몬탠던을 만난 것은 ‘아이보그’라고 알려진 한 획기적인 장치를 개발하는 것으로 이어졌다."]],"w":"6번은 색맹이던 하비슨이 소리로 색을 듣게 해 주는 장치를 만든 이야기예요. 새롭고 앞서간 장치라는 뜻이므로 innovative는 '획기적인'이에요.","c":2},"h":"e53ec9059d"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nHe advocates expanding our natural senses by integrating them with technology.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그는 기술과 통합하여 우리의 타고난 감각을 확장하는 것을 지지한다.","opts":["다른 사람들","유사한 장치들","새로운 시각","우리의 타고난 감각"],"r":{"a":"4) 우리의 타고난 감각","ev":"15번 문장","s":[[15,"He advocates expanding our natural senses by integrating them with technology.","그는 기술과 통합하여 우리의 타고난 감각을 확장하는 것을 지지한다."]],"w":"기술과 통합하는 대상은 '확장하려는' 우리의 타고난 감각(our natural senses)이에요. integrate them with technology = 감각들을 기술과 통합하다.","c":4},"h":"0a2a1874e9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Remarkably, his eyeborg has made him even more sensitive to colors than someone with normal vision.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"놀랍게도, 그의 아이보그는 그가 정상적인 시력을 가진 사람보다 색에 더 민감해지도록 했다.","opts":["아이보그 덕분에 하비슨은 정상 시력인 사람보다 색에 더 민감해졌다.","정상 시력인 사람이 하비슨보다 색에 더 민감하다.","아이보그를 쓰고 하비슨은 정상적인 시력을 되찾았다.","아이보그 때문에 하비슨은 색을 덜 느끼게 되었다."],"r":{"a":"1) 아이보그 덕분에 하비슨은 정상 시력인 사람보다 색에 더 민감해졌다.","ev":"12번 문장","s":[[12,"Remarkably, his eyeborg has made him even more sensitive to colors than someone with normal vision.","놀랍게도, 그의 아이보그는 그가 정상적인 시력을 가진 사람보다 색에 더 민감해지도록 했다."]],"w":"made him even more sensitive ~ than someone with normal vision은 정상 시력인 사람보다도 색에 더 민감하게 만들었다는 뜻이에요. 비교 대상(정상 시력인 사람)과 방향(더 민감)을 정확히 봐야 해요.","c":1},"h":"36e2beef89"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["하비슨은 아이보그를 박물관에 팔 계획이다.","하비슨은 아이보그를 자기 혼자만 쓰고 싶어 한다.","하비슨은 다른 사람들도 아이보그와 비슷한 장치를 쓸 수 있기를 바란다.","하비슨은 사람들이 기술 사용을 그만두기를 바란다."],"opts":["Harbisson plans to sell the eyeborg to museums.","Harbisson wants to keep his eyeborg only for himself.","Harbisson hopes other people can use devices similar to the eyeborg.","Harbisson wants people to stop using technology."],"r":{"a":"3) Harbisson hopes other people can use devices similar to the eyeborg.","ev":"14번 문장","s":[[14,"Harbisson hopes to provide others with the access to similar devices.","하비슨은 다른 사람들에게 유사한 장치에 이용 권한을 제공하기를 바란다."]],"w":"14번 문장에서 하비슨은 다른 사람들에게 유사한 장치에 대한 이용 권한을 제공하기를 바란다고 해요. 박물관에 판다거나 혼자만 쓴다는 말은 없고, 15번에서는 오히려 기술로 감각을 확장하자고 해요.","c":3},"h":"a234130ae1"},{"n":9,"t":"sum","q":"Harbisson uses the eyeborg to (A) colors as sounds, and he believes that technology can give us a new (B) on the world.","ko":"하비슨은 아이보그로 색을 소리로 (A)하며, 기술이 우리에게 세상에 대한 새로운 (B)를 줄 수 있다고 믿는다.","oko":["(A) 두려워한다 / (B) 규칙","(A) 숨긴다 / (B) 시각","(A) 섞는다 / (B) 가격","(A) 듣는다 / (B) 시각","(A) 듣는다 / (B) 규칙"],"opts":["(A) fear / (B) rule","(A) hide / (B) perspective","(A) mix / (B) price","(A) hear / (B) perspective","(A) hear / (B) rule"],"r":{"a":"4) (A) hear / (B) perspective","ev":"8번, 10번, 16번 문장","s":[[8,"Once it detects color frequencies, it changes them into sound frequencies.","그것이 색상 주파수를 감지하면, 그것은 그것들을 음향 주파수로 변환한다."],[10,"The transmission of waves through his skull allows him to hear the sounds.","그의 두개골을 지나는 이 음파의 전송은 그가 소리를 듣도록 해준다."],[16,"He believes it can give us a new perspective on the world, making our lives much more exciting!","그는 그것이 우리의 삶을 훨씬 더 흥미롭게 만들면서 우리에게 세상에 대한 새로운 시각을 줄 수 있다고 믿는다!"]],"w":"8번과 10번에서 아이보그는 색상 주파수를 소리로 바꾸어 하비슨이 소리를 듣게 해 줘요(hear). 16번에서 기술이 세상에 대한 새로운 시각(perspective)을 줄 수 있다고 믿어요. (A)가 맞아도 (B)가 rule 같은 말이면 본문과 달라요.","c":4},"h":"21bbd90c1f"},{"n":10,"t":"fill","q":"For Harbisson, an art gallery becomes an [A] experience like a concert, and he can also detect [B] light such as ultraviolet.","ko":"하비슨에게 미술관은 콘서트 같은 [A] 경험이 되고, 그는 자외선 같은 [B] 빛도 감지할 수 있다.","bank":["auditory","invisible","visible","sensitive","normal","gray"],"bko":{"auditory":"청각의","invisible":"보이지 않는","visible":"눈에 보이는","sensitive":"민감한","normal":"정상적인","gray":"회색의"},"r":{"a":"[A] auditory, [B] invisible","ev":"11번, 13번 문장","s":[[11,"Consequently, for Harbisson, visiting an art gallery becomes an auditory experience comparable to attending a concert, while shopping at a supermarket parallels listening to a live DJ performance.","결과적으로, 하비슨에게는, 미술관에 가는 것이 콘서트 가는 것에 맞먹는 청각의 경험이 되고, 슈퍼마켓에서 장을 보는 것은 라이브 DJ 공연을 듣는 것과 유사하다."],[13,"In addition to the millions of shades along the visible light spectrum, he can also detect invisible light such as ultraviolet.","가시광선 스펙트럼에 있는 수백만 가지 색조 외에도, 그는 자외선과 같은 보이지 않는 빛도 감지할 수 있다."]],"w":"11번에서 미술관은 콘서트에 맞먹는 auditory experience(청각의 경험)가 된다고 해요. 13번에서 자외선은 invisible light(보이지 않는 빛)로 소개돼요. visible은 자외선이 '보이지 않는' 빛이라는 13번과 어긋나요.","c":null},"h":"2df0837055"}]},{"u":2,"id":"ch2-02-2","no":2,"ko":"머리카락으로 밝힌 미스터리","items":[{"n":1,"t":"tf","q":"Beethoven wanted his health issues to be studied and shared with the public.","ko":"베토벤은 자신의 건강 문제가 연구되고 대중과 공유되기를 바랐다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Before his death, however, he expressed a desire for his health issues to be studied and shared with the public.","하지만, 그의 죽음 이전에, 그는 그의 건강 문제가 연구되고 대중과 공유되기를 바라는 바람을 표현했다."]],"w":"2번 문장에서 베토벤은 죽기 전에 자신의 건강 문제가 연구되고 대중과 공유되기를 바라는 바람을 표현했어요.","c":"T"},"h":"99239a64ea"},{"n":2,"t":"tf","q":"The researchers believe that lead poisoning alone caused Beethoven’s death.","ko":"연구원들은 납 중독만이 베토벤의 죽음을 일으켰다고 믿는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"However, the researchers don’t think that his death was caused solely by lead poisoning, though it likely did contribute to his deafness and digestive issues.","그러나, 연구원들은 그것이 그의 청각 장애와 소화 문제에 기여했을 가능성이 있다고 하더라도, 그의 죽음이 오로지 납 중독으로 야기되었다고 생각하지는 않는다."]],"w":"8번 문장에서 연구원들은 그의 죽음이 오로지(solely) 납 중독으로 야기되었다고 생각하지 않아요. 납 중독은 청각 장애와 소화 문제에 기여했을 가능성이 있을 뿐이에요.","c":"F"},"h":"16b8b01394"},{"n":3,"t":"tf","q":"Beethoven felt hopeless as a composer because of his hearing loss.","ko":"베토벤은 청력 손실 때문에 작곡가로서 절망적인 감정을 느꼈다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"In a letter he wrote, Beethoven admitted to feeling hopeless as a composer because of his hearing loss.","그가 작성한 편지에서, 베토벤은 그의 청력 손실 때문에 작곡가로서 절망적인 감정을 느꼈다고 인정했다."]],"w":"11번 문장에서 베토벤은 편지에 청력 손실 때문에 작곡가로서 절망적인 감정을 느꼈다고 인정했어요.","c":"T"},"h":"1dd07a2716"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The analysis also uncovered evidence that Beethoven dealt with a liver disease late in his life.)","ko":"그 분석은 또한 베토벤이 말년에 간 질병을 앓았다는 증거를 (uncover)했다. (uncovered의 뜻은?)","opts":["숨겼다","밝혀냈다","지웠다","만들어 냈다"],"word":"uncovered","r":{"a":"2) 밝혀냈다","ev":"9번 문장","s":[[9,"The analysis also uncovered evidence that Beethoven dealt with a liver disease late in his life.","그 분석은 또한 베토벤이 그의 말년에 간 질병을 앓았다는 증거를 드러냈다."]],"w":"9번에서 분석이 베토벤이 간 질병을 앓았다는 증거를 '새로 알아냈다'는 흐름이에요. uncover는 덮개(cover)를 벗긴다는 뜻에서 '밝혀내다, 알아내다'가 돼요. 3번 문장의 uncover more information도 같은 뜻이에요.","c":2},"h":"de17cba3b8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…likely because he drank wine sweetened with lead.)","ko":"…그가 납으로 단맛을 낸 와인을 마셨기 때문일 것이다. (sweetened의 뜻은?)","opts":["단맛을 낸","쓴맛을 없앤","차갑게 식힌","오래 보관한"],"word":"sweetened","r":{"a":"1) 단맛을 낸","ev":"7번 문장","s":[[7,"According to the results, Beethoven’s lead levels were extremely high, likely because he drank wine sweetened with lead.","결과들에 따르면, 베토벤의 납 수치는 극도로 높았는데, 그가 납으로 단맛을 낸 와인을 마셨기 때문일 것이다."]],"w":"sweet는 '달다'이고 sweeten은 '단맛을 내다'예요. sweetened with lead는 앞의 wine을 꾸며서 '납으로 단맛을 낸 와인'이라는 뜻이에요.","c":1},"h":"1225e2bc32"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nEvery piece of information that we uncover about Beethoven provides insight into how he turned his pain into music.","ko":"밑줄 친 he이(가) 가리키는 것은?","sko":"우리가 베토벤에 대해서 알아낸 모든 정보는 그가 어떻게 그의 고통을 음악으로 승화했는지에 대한 통찰력을 제공한다.","opts":["연구원들","베토벤","우리","정보"],"pron":"he","r":{"a":"2) 베토벤","ev":"13번 문장","s":[[13,"Every piece of information that we uncover about Beethoven provides insight into how he turned his pain into music.","우리가 베토벤에 대해서 알아낸 모든 정보는 그가 어떻게 그의 고통을 음악으로 승화했는지에 대한 통찰력을 제공한다."]],"c":2,"k":"he = 베토벤"},"h":"7ee275ec00"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Yet he didn’t want to die until he had composed all the music he was inspired to make.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그는 모든 곡을 작곡하기도 전에 죽기를 바랐다.","그는 더 이상 음악을 만들고 싶지 않아서 일찍 죽기를 바랐다.","그는 영감을 받지 못해 작곡을 포기하고 죽고 싶어 했다.","그렇지만 그는 만들도록 영감을 받은 모든 음악을 작곡할 때까지 죽고 싶지 않았다."],"r":{"a":"4) 그렇지만 그는 만들도록 영감을 받은 모든 음악을 작곡할 때까지 죽고 싶지 않았다.","ev":"12번 문장","s":[[12,"Yet he didn’t want to die until he had composed all the music he was inspired to make.","그렇지만 그는 그가 만들기로 영감을 받은 모든 음악을 작곡할 때까지 죽고 싶지 않았다."]],"c":4,"k":null},"h":"1cc88affb8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["베토벤은 자신의 건강 정보를 대중과 공유하기를 거부했다.","연구원들은 베토벤의 건강에 대해 더 알아내기 위해 그의 모발을 연구했다.","베토벤은 물만 마셨기 때문에 납 수치가 낮았다.","베토벤은 청력을 잃은 것을 기뻐했다."],"opts":["Beethoven refused to share his health information with the public.","Researchers studied Beethoven’s hair to learn more about his health.","Beethoven’s lead levels were low because he drank only water.","Beethoven felt happy about losing his hearing."],"r":{"a":"2) Researchers studied Beethoven’s hair to learn more about his health.","ev":"3번 문장","s":[[3,"Recently, researchers set out to uncover more information on Beethoven’s health issues by conducting a DNA analysis of his hair.","최근, 연구원들은 그의 모발 DNA 분석을 하는 것을 통해 베토벤의 건강 문제에 대한 추가 정보를 밝혀내기 위해 착수했다."]],"w":"3번 문장에서 연구원들은 베토벤의 건강 문제에 대한 정보를 더 밝혀내기 위해 그의 모발 DNA 분석을 했어요. 베토벤은 공유되기를 바랐고(2번), 납 수치는 매우 높았고(7번), 청력 손실에 절망했어요(11번).","c":2},"h":"6619636502"},{"n":9,"t":"sum","q":"Beethoven (A) from lead poisoning (B) the end of his life.","ko":"베토벤은 생의 끝 (B) 납 중독으로 (A).","opts":["(A) suffered / (B) near","(A) recovered / (B) near","(A) suffered / (B) after","(A) recovered / (B) after","(A) benefited / (B) near"],"oko":["(A) 고통받았다 / (B) 가까이","(A) 회복했다 / (B) 가까이","(A) 고통받았다 / (B) 이후에","(A) 회복했다 / (B) 이후에","(A) 이익을 얻었다 / (B) 가까이"],"r":{"a":"1) (A) suffered / (B) near ((A) 고통받았다 / (B) 가까이)","ev":"6번 문장","s":[[6,"The analysis revealed that Beethoven suffered from lead poisoning near the end of his life.","그 분석은 베토벤이 그의 말년에 가까이에 납 중독으로 고통받았다는 것을 드러냈다."]],"c":1,"k":null},"h":"c9d303e4e7"},{"n":10,"t":"fill","q":"They also hoped to [A] the [B] cause of his death.","ko":"그들은 또한 그의 죽음의 [B] 원인을 [A]하기를 희망했다.","bank":["discover","primary","wine","hair","letter","music"],"bko":{"discover":"발견하다","primary":"주된","wine":"와인","hair":"머리카락","letter":"편지","music":"음악"},"r":{"a":"[A] discover (발견하다), [B] primary (주된)","ev":"5번 문장","s":[[5,"They also hoped to discover the primary cause of his death.","그들은 또한 그의 죽음의 주요 원인도 발견하길 희망했다."]],"c":null,"k":null},"h":"e5c44812d0"}]},{"u":2,"id":"ch2-02-3","no":3,"ko":"길을 잃지 않는 마을","items":[{"n":1,"t":"tf","q":"Residents of Hogewey can visit shops, cafés, restaurants, and even a movie theater in the village.","ko":"Hogewey의 거주민들은 마을 안에서 상점, 카페, 음식점, 그리고 심지어 영화관까지 방문할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Unlike typical nursing homes, it’s a whole village where residents can visit shops, cafés, restaurants, and even a movie theater.","보통의 요양원과 달리, 그곳은 거주민들이 상점, 카페, 음식점, 그리고 심지어 영화관을 방문할 수 있는 온전한 마을이다."]],"w":"4번 문장에서 거주민들은 상점, 카페, 음식점, 그리고 영화관을 방문할 수 있어요.","c":"T"},"h":"b525ce3ea6"},{"n":2,"t":"tf","q":"Each apartment in Hogewey is used by one resident alone.","ko":"Hogewey의 각 아파트는 거주민 한 명이 혼자 쓴다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Six to eight residents share each apartment in the village’s 27 residential buildings.","6명에서 8명의 거주민이 마을의 27개 주거용 건물에서 각각의 아파트를 공유한다."]],"w":"9번 문장에서 6명에서 8명의 거주민이 각각의 아파트를 함께 써요(share). 한 명이 혼자 쓰는 것이 아니에요.","c":"F"},"h":"263e18da57"},{"n":3,"t":"tf","q":"The cost per resident at Hogewey is not much higher than at traditional nursing homes.","ko":"Hogewey의 거주민당 비용은 전통적인 요양원보다 크게 더 비싸지 않다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Surprisingly, the cost per resident is not that much higher than at traditional nursing homes.","놀랍게도, 각 거주민당 비용은 전통적인 요양원에서보다 그렇게 크게 더 비싸지는 않다."]],"w":"10번 문장에서 거주민당 비용은 전통적인 요양원보다 그렇게 크게 더 높지 않다고 해요.","c":"T"},"h":"82bfc12fdc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They tend to wander around a lot, and, because of their memory problems, they easily forget where they are.)","ko":"그들은 많이 돌아다니는 경향이 있고, 기억력 문제 때문에 쉽게 자신이 어디에 있는지 잊는다. (wander의 뜻은?)","opts":["잠을 자다","노래하다","돌아다니다","요리하다"],"word":"wander","r":{"a":"3) 돌아다니다","ev":"2번 문장","s":[[2,"They tend to wander around a lot, and, because of their memory problems, they easily forget where they are.","그들은 많이 돌아다니는 경향이 있고, 기억력 문제 때문에 그들은 자신이 어디에 있는지 쉽게 잊는다."]],"w":"2번에서 환자들은 wander around a lot 하다가 자기 위치를 잊는다고 해요. 5번의 wander around(원하는 만큼 돌아다닐 자유)와 같은 뜻으로 '돌아다니다, 배회하다'예요.","c":3},"h":"2758f33df0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Hogewey accommodates more than 180 residents and is staffed by about 250 employees.)","ko":"Hogewey는 180명 이상의 거주민들을 수용하고 약 250명의 직원들로 구성되어 있다. (accommodates의 뜻은?)","opts":["거부하다","판매하다","수리하다","수용하다"],"word":"accommodates","r":{"a":"4) 수용하다","ev":"8번 문장","s":[[8,"Hogewey accommodates more than 180 residents and is staffed by about 250 employees.","Hogewey는 180명 이상의 거주민들을 수용하고 약 250명의 직원들로 구성되어 있다."]],"w":"8번은 마을의 규모를 소개하는 문장이에요. more than 180 residents(180명 이상의 거주민)를 받아들여 지낼 수 있게 한다는 뜻이므로 accommodate는 '수용하다'예요.","c":4},"h":"271bae6c27"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSo if residents get lost or confused, there’s always someone there to assist them.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"그래서 거주민들이 길을 잃거나 혼란스러워하면, 그곳에는 항상 그들을 도와줄 누군가가 있다.","opts":["거주민들","누군가","길","직원들"],"pron":"them","r":{"a":"1) 거주민들","ev":"7번 문장","s":[[7,"So if residents get lost or confused, there’s always someone there to assist them.","그래서 거주민들이 길을 잃거나 혼란스러워하면, 그곳에는 항상 그들을 도와줄 누군가가 있다."]],"c":1,"k":"them = 거주민들"},"h":"63e10de026"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Nurses and other employees wear normal clothes and behave like villagers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["간호사들은 하얀 가운을 입고 환자들과 거리를 둔다.","직원들은 마을 사람들을 돌보기 위해 특별한 제복을 입는다.","마을 사람들이 간호사 옷을 입고 직원으로 일한다.","간호사들과 다른 직원들은 평상복을 입고 마을 사람들처럼 행동한다."],"r":{"a":"4) 간호사들과 다른 직원들은 평상복을 입고 마을 사람들처럼 행동한다.","ev":"6번 문장","s":[[6,"Nurses and other employees wear normal clothes and behave like villagers.","간호사들과 다른 직원들은 일상복을 입고 마을 사람들처럼 행동한다."]],"c":4,"k":null},"h":"070f7c6308"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Hogewey는 2009년에 벨기에에 설립되었다.","거주민은 안전을 위해 아파트 안에 머물러야 한다.","Hogewey는 전통적인 요양원보다 훨씬 더 비싸다.","Hogewey는 환자들에게 그들이 잃어버렸던 자유의 일부를 누릴 수 있는 환경을 제공한다."],"opts":["Hogewey was established in Belgium in 2009.","Residents must stay inside their apartments to be safe.","Hogewey is much more expensive than traditional nursing homes.","Hogewey gives patients an environment where they can enjoy some of the freedoms they had lost."],"r":{"a":"4) Hogewey gives patients an environment where they can enjoy some of the freedoms they had lost.","ev":"11번 문장","s":[[11,"Above all, Hogewey provides patients with a comfortable environment where they can enjoy some of the freedoms they had lost in their daily lives.","무엇보다도, Hogewey는 환자들에게 그들이 일상 생활 속에서 잃어버린 자유의 일부를 즐길 수 있는 편안한 환경을 제공한다."]],"w":"11번 문장에서 Hogewey는 환자들이 일상 생활 속에서 잃어버린 자유의 일부를 즐길 수 있는 편안한 환경을 제공해요. 설립 장소는 네덜란드(3번), 거주민은 마음껏 돌아다닐 수 있고(5번), 비용은 크게 비싸지 않아요(10번).","c":4},"h":"1227590dd3"},{"n":9,"t":"sum","q":"Taking (A) of people with Alzheimer’s disease requires a lot of (B).","ko":"알츠하이머병 환자들을 (A) 일은 많은 (B)을(를) 필요로 한다.","opts":["(A) care / (B) effort","(A) care / (B) luck","(A) advantage / (B) effort","(A) advantage / (B) luck","(A) pictures / (B) effort"],"oko":["(A) 돌보는 / (B) 노력","(A) 돌보는 / (B) 행운","(A) 이용하는 / (B) 노력","(A) 이용하는 / (B) 행운","(A) 사진을 찍는 / (B) 노력"],"r":{"a":"1) (A) care / (B) effort ((A) 돌보는 / (B) 노력)","ev":"1번 문장","s":[[1,"Taking care of people with Alzheimer’s disease requires a lot of effort.","알츠하이머병 환자들을 돌보는 일은 많은 노력을 필요로 한다."]],"c":1,"k":null},"h":"f94b9ae47f"},{"n":10,"t":"fill","q":"Hogewey provides patients with a [A] environment and lets its residents live in a normal [B].","ko":"Hogewey는 환자들에게 [A] 환경을 제공하고 거주민들이 평범한 [B]에서 살게 한다.","bank":["comfortable","community","freedom","traditional","expensive","residential"],"bko":{"comfortable":"편안한","community":"공동체","freedom":"자유","traditional":"전통적인","expensive":"비싼","residential":"주거용의"},"r":{"a":"[A] comfortable, [B] community","ev":"11~12번 문장","s":[[11,"Above all, Hogewey provides patients with a comfortable environment where they can enjoy some of the freedoms they had lost in their daily lives.","무엇보다도, Hogewey는 환자들에게 그들이 일상 생활 속에서 잃어버린 자유의 일부를 즐길 수 있는 편안한 환경을 제공한다."],[12,"Moreover, Hogewey is changing how people think about Alzheimer’s by allowing its residents to live in a normal community.","게다가, Hogewey는 거주민들이 평범한 공동체에 살도록 허용함으로써 사람들이 알츠하이머병에 관해 어떻게 생각하는지를 바꾸고 있다."]],"w":"11번에서 Hogewey는 환자들에게 comfortable environment(편안한 환경)를 제공하고, 12번에서 거주민들이 normal community(평범한 공동체)에서 살도록 허용해요. traditional과 expensive는 4번, 10번 내용과 어긋나요.","c":null},"h":"bb8a9fcb02"}]},{"u":2,"id":"ch2-02-4","no":4,"ko":"수능:ON 요지 · 주장","items":[{"n":1,"t":"tf","q":"Having too much information makes it hard to choose which soup to buy.","ko":"정보가 너무 많으면 어떤 수프를 살지 고르기가 어렵다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"There’s too much data here for you to struggle with: calories, price, salt content, taste, packaging, and so on.","여기에 칼로리, 가격, 소금 함유량, 맛, 포장, 기타 등 당신이 고심해야 할 너무 많은 정보가 있다."]],"w":"2번 문장에서 수프를 고를 때 고심해야 할 정보(칼로리, 가격, 소금 함유량 등)가 너무 많다고 해요.","c":"T"},"h":"4cb5ef4d1c"},{"n":2,"t":"tf","q":"A robot would choose a soup easily because it can see which details matter more.","ko":"로봇은 어떤 세부 사항이 더 중요한지 알 수 있어서 수프를 쉽게 고를 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"If you were a robot, you would be stuck here all day trying to make a decision, with no obvious way to trade off which details matter more.","만약 당신이 로봇이라면, 어떤 세부 사항이 더 중요한지에 대해 균형을 유지할 만한 분명한 방법이 없는 채로 당신은 결정하느라 애쓰면서 하루 종일 여기에 매여 있을 것이다."]],"w":"3번 문장에서 로봇이라면 어떤 세부 사항이 더 중요한지 균형을 잡을 분명한 방법이 없어서 하루 종일 결정하느라 매여 있을 것이라고 해요.","c":"F"},"h":"da7ba19304"},{"n":3,"t":"tf","q":"Your mouth may water when you think about a soup you ate before.","ko":"전에 먹었던 수프를 생각하면 입에 군침이 돌 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Thinking about your budget might make your palms sweat, or your mouth might water thinking about the last time you consumed the chicken noodle soup, or noting the excessive creaminess of the other soup might give you a stomachache.","당신의 예산에 관해 생각하는 것은 당신의 손바닥에 땀이 나게 할 수도 있고, 당신이 지난번에 치킨 누들 수프를 먹었던 것에 대해 생각하며 당신의 입에서 군침이 돌 수도 있고, 또는 또 다른 수프의 지나친 느끼함을 알아차리는 것이 당신의 속을 불편하게 만들지도 모른다."]],"w":"6번 문장에서 지난번에 치킨 누들 수프를 먹었던 것에 대해 생각하면 입에서 군침이 돌 수도 있다고 해요.","c":"T"},"h":"4dc3a54921"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…with no obvious way to trade off which details matter more.)","ko":"…어떤 세부 사항이 더 중요한지에 대해 균형을 유지할 만한 분명한 방법이 없는 채로… (obvious의 뜻은?)","opts":["위험한","값싼","분명한","오래된"],"word":"obvious","r":{"a":"3) 분명한","ev":"3번 문장","s":[[3,"If you were a robot, you would be stuck here all day trying to make a decision, with no obvious way to trade off which details matter more.","만약 당신이 로봇이라면, 어떤 세부 사항이 더 중요한지에 대해 균형을 유지할 만한 분명한 방법이 없는 채로 당신은 결정하느라 애쓰면서 하루 종일 여기에 매여 있을 것이다."]],"w":"3번에서 로봇은 어떤 세부 사항이 더 중요한지 가를 '분명한' 방법이 없어서 결정을 못 해요. no obvious way = 분명한 방법이 없는.","c":3},"h":"dcb74f7da6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…allowing you to tip the balance in one direction or the other.)","ko":"…당신이 한 쪽으로 또는 다른 쪽으로 균형이 기울도록 한다. (tip의 뜻은?)","opts":["팁을 주다","기울이다","닦다","흘리다"],"word":"tip","r":{"a":"2) 기울이다","ev":"8번 문장","s":[[8,"Your bodily experience helps your brain to quickly place a value on soup A and another on soup B, allowing you to tip the balance in one direction or the other.","당신의 신체 경험은 당신의 두뇌가 재빨리 A 수프에 하나의 가치를 부여하고, B 수프에는 또 다른 가치를 부여하게 하는 것을 도우며, 당신으로 하여금 한 쪽으로 또는 다른 쪽으로 균형이 기울도록 한다."]],"w":"8번의 tip the balance는 저울을 한쪽으로 '기울이다'라는 뜻이에요. 몸의 경험으로 한쪽 수프에 마음이 기울어 결정한다는 흐름이에요. 식당에서 주는 '팁'과는 뜻이 달라요.","c":2},"h":"6afb2e268b"},{"n":6,"t":"ref","q":"What does the underlined \"the other\" refer to?\nYou simulate your experience with one soup, and then the other.","ko":"밑줄 친 the other이(가) 가리키는 것은?","sko":"당신은 하나의 수프로, 그런 다음 또 다른 수프로 당신의 경험을 모의실험 해본다.","opts":["다른 수프","다른 경험","다른 캔","다른 사람"],"pron":"the other","r":{"a":"1) 다른 수프","ev":"7번 문장","s":[[7,"You simulate your experience with one soup, and then the other.","당신은 하나의 수프로, 그런 다음 또 다른 수프로 당신의 경험을 모의실험 해본다."]],"c":1,"k":"the other = 다른 수프"},"h":"582442dec7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You don’t just extract the data from soup cans, you feel the data.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신은 수프 캔으로부터 단지 정보를 추출하는 것이 아니라, 그 정보를 느끼는 것이다.","opts":["당신은 수프 캔에서 정보를 뽑아내기만 하고 느끼지는 못한다.","당신은 수프 캔의 정보를 느끼기보다 오직 계산만 한다.","당신은 수프 캔에서 정보를 뽑아내는 데 그치지 않고 그 정보를 느낀다.","당신은 수프 캔에서 정보를 뽑아내지 않고 그냥 먹어 버린다."],"r":{"a":"3) 당신은 수프 캔에서 정보를 뽑아내는 데 그치지 않고 그 정보를 느낀다.","ev":"9번 문장","s":[[9,"You don’t just extract the data from soup cans, you feel the data.","당신은 수프 캔으로부터 단지 정보를 추출하는 것이 아니라, 그 정보를 느끼는 것이다."]],"w":"not just A, ~ B 구조예요. 단지 정보를 뽑아내는(extract) 것이 아니라 느끼기도(feel) 한다는 뜻이에요. 이 글은 몸의 반응이 정보를 느끼게 해 준다고 말해요.","c":3},"h":"66d5f42fc2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["두뇌는 몸의 도움 없이 결정을 내린다.","당신의 신체 경험은 두뇌가 각각의 수프에 가치를 부여하도록 돕는다.","손바닥에 땀이 나는 것은 당신이 수프의 맛을 좋아한다는 것을 보여 준다.","당신은 캔에 적힌 모든 글자를 읽은 뒤에야 수프를 고를 수 있다."],"opts":["The brain makes a decision without any help from the body.","Your bodily experience helps your brain place a value on each soup.","Sweaty palms show that you like the taste of the soup.","You can choose a soup only after reading every word on the can."],"r":{"a":"2) Your bodily experience helps your brain place a value on each soup.","ev":"8번 문장","s":[[8,"Your bodily experience helps your brain to quickly place a value on soup A and another on soup B, allowing you to tip the balance in one direction or the other.","당신의 신체 경험은 당신의 두뇌가 재빨리 A 수프에 하나의 가치를 부여하고, B 수프에는 또 다른 가치를 부여하게 하는 것을 도우며, 당신으로 하여금 한 쪽으로 또는 다른 쪽으로 균형이 기울도록 한다."]],"w":"8번 문장에서 신체 경험이 두뇌가 수프 A와 B에 각각 가치를 매기도록 돕는다고 해요. 손바닥의 땀은 예산에 대한 걱정이고(6번), 두뇌는 몸의 도움을 받아요(8번).","c":2},"h":"dc399aead3"},{"n":9,"t":"sum","q":"Take the (A) of which (B) of soup to buy.","ko":"어떤 (B)의 수프를 살지에 대한 (A)을(를) 하라.","opts":["(A) choice / (B) kind","(A) choice / (B) cost","(A) voice / (B) kind","(A) voice / (B) cost","(A) taste / (B) kind"],"oko":["(A) 선택 / (B) 종류","(A) 선택 / (B) 비용","(A) 목소리 / (B) 종류","(A) 목소리 / (B) 비용","(A) 맛 / (B) 종류"],"r":{"a":"1) (A) choice / (B) kind ((A) 선택 / (B) 종류)","ev":"1번 문장","s":[[1,"Take the choice of which kind of soup to buy.","어떤 종류의 수프를 살지를 선택하라."]],"c":1,"k":null},"h":"31e986309b"},{"n":10,"t":"fill","q":"And that’s what the [A] from your body is able to [B] you.","ko":"그리고 그것은 당신의 신체로부터 나오는 [A]이(가) 당신에게 [B]할 수 있는 것이다.","bank":["feedback","give","robot","budget","packaging","calories"],"bko":{"feedback":"피드백","give":"주다","robot":"로봇","budget":"예산","packaging":"포장","calories":"칼로리"},"r":{"a":"[A] feedback (피드백), [B] give (주다)","ev":"5번 문장","s":[[5,"And that’s what the feedback from your body is able to give you.","그리고 그것은 당신의 신체로부터 나오는 피드백이 당신에게 제공할 수 있는 것이다."]],"c":null,"k":null},"h":"406f0efda6"}]},{"u":3,"id":"ch2-03-1","no":1,"ko":"크림 전쟁의 숨은 영웅","items":[{"n":1,"t":"tf","q":"Nightingale was sent to a British hospital in Turkey in 1854 to make conditions there better.","ko":"나이팅게일은 1854년에 터키에 있는 영국군 병원의 환경을 더 낫게 만들기 위해 파견되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Nightingale was sent to a British hospital in Turkey in 1854 in order to improve its conditions.","나이팅게일은 1854년에 터키에 있는 한 영국군 병원의 환경을 개선하기 위해 그곳으로 파견되었다."]],"w":"4번에서 터키의 영국군 병원에 1854년 파견된 목적이 in order to improve its conditions(그곳의 환경을 개선하기 위해)예요. make conditions better와 같은 뜻이에요.","c":"T"},"h":"a176534762"},{"n":2,"t":"tf","q":"At first, most people believed that unsanitary conditions caused most of the deaths.","ko":"처음에 대부분의 사람들은 비위생적인 환경이 대부분의 사망을 일으켰다고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"It was commonly believed that most of the deaths were due to shortages of food and medicine.","대부분의 사망은 식량과 약품 부족 때문이라고 흔히 여겨졌다."],[10,"However, Nightingale found that the real cause was unsanitary conditions.","그러나, 나이팅게일은 실제 원인은 비위생적인 환경이라는 것을 알아냈다."]],"w":"9번에서 사람들이 흔히 믿은 원인은 식량과 약품 부족이에요. 비위생적인 환경은 10번에서 나이팅게일이 알아낸 실제 원인이에요. 두 내용이 뒤바뀌었어요.","c":"F"},"h":"f654c163bb"},{"n":3,"t":"tf","q":"In Nightingale’s days, charts were already commonly used to show numbers.","ko":"나이팅게일 시대에는 숫자를 보여 주기 위해 도표가 이미 흔히 사용되었다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"Charts weren’t commonly used in those days, but they had a powerful impact.","도표는 그 당시에 흔히 사용되지 않았지만, 강력한 영향력을 가졌다."]],"w":"14번에서 도표는 그 당시에 흔히 사용되지 않았다(weren’t commonly used)고 해요. 다만 영향력은 강했어요.","c":"F"},"h":"a1ea162300"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Nightingale was asked to present this information to the queen and her council.)","ko":"나이팅게일은 이 정보를 여왕과 의회에 (제시하라는) 요청을 받았다. (present의 뜻은?)","opts":["선물하다","제시하다","숨기다","거절하다"],"word":"present","r":{"a":"2) 제시하다","ev":"11번 문장","s":[[11,"Nightingale was asked to present this information to the queen and her council.","나이팅게일은 이러한 정보를 여왕과 의회에 제시하라는 요청을 받았다."]],"w":"여왕과 의회 앞에 사망 원인에 대한 정보를 내놓는 상황이에요. 이때 present는 '선물하다'가 아니라 '제시하다, 보여 주다'예요.","c":2},"h":"dcca6e9747"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Many injured soldiers were dying in the hospital, which was suffering from shortages of food and medicine, …)","ko":"많은 부상병들이 그 병원에서 죽어가고 있었는데, 그곳은 식량과 약품 부족 등으로 …","opts":["자랑하고 있는","옮겨지고 있는","돕고 있는","시달리고 있는"],"word":"suffering","r":{"a":"4) 시달리고 있는","ev":"5번 문장","s":[[5,"Many injured soldiers were dying in the hospital, which was suffering from shortages of food and medicine, an overworked staff, and unclean conditions.","많은 부상병들이 그 병원에서 죽어가고 있었는데, 그곳은 식량과 약품 부족, 직원들의 업무 과다, 그리고 불결한 환경에 시달리고 있었다."]],"w":"which는 병원이고, 뒤에 식량·약품 부족, 업무 과다, 불결한 환경 같은 나쁜 일들이 나열돼요. suffer from은 '~으로 고통받다, 시달리다'예요.","c":4},"h":"e8c4a15588"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nAlthough Florence Nightingale is best known as the founder of modern nursing, she was also a skilled statistician.","ko":"밑줄 친 she이(가) 가리키는 것은?","sko":"플로렌스 나이팅게일은 근대 간호학의 창시자로 가장 잘 알려져 있지만, 그녀는 또한 숙련된 통계학자이기도 했다.","opts":["플로렌스 나이팅게일","여왕","근대 간호학","터키의 병원"],"pron":"she","r":{"a":"1) 플로렌스 나이팅게일","ev":"1번 문장","s":[[1,"Although Florence Nightingale is best known as the founder of modern nursing, she was also a skilled statistician.","플로렌스 나이팅게일은 근대 간호학의 창시자로 가장 잘 알려져 있지만, 그녀는 또한 숙련된 통계학자이기도 했다."]],"c":1,"k":"she = 플로렌스 나이팅게일"},"h":"a75383e745"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Despite this success, Nightingale worried that similar situations would occur in the future.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 성공에도 불구하고, 나이팅게일은 비슷한 상황이 앞으로도 발생할 것을 우려했다.","opts":["성공을 거두었지만 앞으로도 비슷한 일이 생길까 봐 걱정했다.","성공했기 때문에 앞으로 아무 걱정이 없었다.","비슷한 일이 이미 생겼던 것을 후회했다.","성공 때문에 사람들이 그녀를 걱정하게 되었다."],"r":{"a":"1) 성공을 거두었지만 앞으로도 비슷한 일이 생길까 봐 걱정했다.","ev":"7번 문장","s":[[7,"Despite this success, Nightingale worried that similar situations would occur in the future.","이러한 성공에도 불구하고, 나이팅게일은 비슷한 상황이 앞으로도 발생할 것을 우려했다."]],"w":"Despite는 '~에도 불구하고'예요. 성공했지만(Despite this success) 앞으로 비슷한 상황이 생길까 걱정했다(worried that ~ would occur in the future)는 뜻이에요.","c":1},"h":"1dec355679"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["나이팅게일은 숫자를 나열해서 읽는 것만으로 여왕을 설득하기에 충분하다고 생각했다.","나이팅게일은 숫자를 도표로 만들면 더 분명해진다고 생각해서 도표로 정리했다.","나이팅게일은 여왕과 의회에 숫자를 보여 주지 않기로 했다.","나이팅게일은 사망에 관한 숫자가 없어서 도표를 만들었다."],"opts":["Nightingale thought that a list of numbers was enough to persuade the queen.","Nightingale arranged the numbers into charts to make them clearer.","Nightingale decided not to show the numbers to the queen and her council.","Nightingale made charts because there were no numbers about the deaths."],"r":{"a":"2) Nightingale arranged the numbers into charts to make them clearer.","ev":"12~13번 문장","s":[[12,"She knew that simply reading a list of numbers wasn’t enough.","그녀는 그저 나열된 숫자를 읽는 것만으로는 충분하지 않다는 것을 알았다."],[13,"So she arranged the numbers into charts to make them clearer.","그래서 그녀는 그것들을 더 분명하게 만들기 위해 숫자들을 도표로 작성했다."]],"w":"12번에서 숫자 목록을 읽는 것만으로는 충분하지 않다고 알았고, 13번에서 숫자를 도표로 정리했어요. 다른 선지는 본문과 어긋나요. 숫자 목록만으로는 충분하지 않다고 했고(12번), 숫자를 보여 주지 않은 것이 아니라 도표로 정리해서 보여 주었어요(13번).","c":2},"h":"f8751edb9a"},{"n":9,"t":"sum","q":"Nightingale used (A) to figure out why so many people died in the (B) War.","ko":"나이팅게일은 왜 그렇게 많은 사람들이 (B) 전쟁에서 죽었는지 알아내기 위해 (A)을(를) 활용했다.","opts":["(A) statistics / (B) Crimean","(A) statistics / (B) Korean","(A) stories / (B) Crimean","(A) stories / (B) Korean","(A) maps / (B) Korean"],"oko":["(A) 통계학 / (B) 크림","(A) 통계학 / (B) 한국","(A) 이야기 / (B) 크림","(A) 이야기 / (B) 한국","(A) 지도 / (B) 한국"],"r":{"a":"1) (A) statistics / (B) Crimean ((A) 통계학 / (B) 크림)","ev":"2번 문장","s":[[2,"Nightingale used statistics to figure out why so many people died in the Crimean War.","나이팅게일은 왜 그렇게 많은 사람들이 크림 전쟁에서 죽었는지 알아내기 위해 통계학을 활용했다."]],"c":1,"k":null},"h":"cd6b055b92"},{"n":10,"t":"fill","q":"Nightingale and her team [A] the hospital, so the death rates of wounded soldiers were [B].","ko":"나이팅게일과 그녀의 팀이 병원을 [A]해서, 부상병들의 사망률이 [B].","bank":["improved","lowered","raised","ignored","closed","moved"],"bko":{"improved":"개선했다","lowered":"낮아졌다","raised":"높아졌다","ignored":"무시했다","closed":"문을 닫았다","moved":"옮겼다"},"r":{"a":"[A] improved, [B] lowered","ev":"6번 문장","s":[[6,"By the time the war ended in 1856, Nightingale and her team had successfully improved the hospital, significantly lowering the death rates of wounded soldiers.","1856년에 전쟁이 끝날 때쯤에는, 나이팅게일과 그녀의 팀이 그 병원을 성공적으로 개선해서, 부상병들의 사망률을 상당히 낮추었다."]],"w":"6번에서 팀이 병원을 successfully improved(성공적으로 개선했다)하고 그 결과 사망률을 낮추었어요(lowering the death rates). raised(높아졌다)는 반대 뜻이고, ignored·closed·moved는 글에 없는 내용이에요.","c":null},"h":"ebb864e0fa"}]},{"u":3,"id":"ch2-03-2","no":2,"ko":"전쟁 속의 또 다른 비극","items":[{"n":1,"t":"tf","q":"About 3 million people starved to death in Bengal in the end.","ko":"결국 약 3백만 명의 사람들이 벵골에서 굶어 죽었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"In the end, approximately 3 million people starved to death in Bengal.","결국, 거의 3백만 명에 달하는 사람들이 벵골에서 굶어 죽었다."]],"w":"9번에서 In the end, approximately 3 million people starved to death in Bengal이라고 해요. 결국 약 3백만 명이 굶어 죽었다는 내용과 같아요.","c":"T"},"h":"8cfb3f5914"},{"n":2,"t":"tf","q":"In 1943, almost no rice was being grown in other parts of India.","ko":"1943년에 인도의 다른 지방에서는 쌀이 거의 재배되지 않고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"There was plenty of rice being grown in other parts of India, but most of it was being exported to feed British soldiers.","인도의 다른 지방에서는 많은 양의 쌀이 재배되고 있었지만, 그 대부분은 영국 병사들을 먹이기 위해 수출되고 있었다."]],"w":"6번에서 인도의 다른 지방에서는 많은 양의 쌀(plenty of rice)이 재배되고 있었다고 해요. 다만 대부분이 영국 병사들을 위해 수출되고 있었어요.","c":"F"},"h":"a3f0d18089"},{"n":3,"t":"tf","q":"In 1943, Bengal was ruled by Britain and was suffering from a serious famine.","ko":"1943년에 벵골은 영국의 지배를 받았고 심각한 기근으로 고통받고 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In 1943, Bengal was ruled by Britain and was suffering from a serious famine.","1943년, 벵골은 영국의 지배를 받고 있었고, 심각한 기근으로 고통받고 있었다."]],"w":"5번이 그대로 이 내용이에요. 벵골은 영국의 지배를 받았고 심각한 기근에 시달렸어요.","c":"T"},"h":"56aa04ed7c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In fact, he is considered to be partially responsible for millions of deaths in Bengal …)","ko":"사실, 그는 벵골에서 있었던 수백만 명의 사망에 부분적으로 (책임이 있다고) 여겨진다. (responsible의 뜻은?)","opts":["자랑스러운","관심이 없는","책임이 있는","용서받은"],"word":"responsible","r":{"a":"3) 책임이 있는","ev":"4번 문장","s":[[4,"In fact, he is considered to be partially responsible for millions of deaths in Bengal, a region in northeastern India.","사실, 그는 인도 북동부에 있는 지역인 벵골에서 있었던 수백만 명의 사망에 부분적으로 책임이 있다고 여겨진다."]],"w":"millions of deaths(수백만 명의 사망)와 함께 쓰였고, 3번에서 처칠에 대한 비판이 시작됐어요. responsible for는 '~에 책임이 있는'이에요.","c":3},"h":"dce15e4fb0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… but he also turned down offers from the United States and Canada to provide food.)","ko":"… 식량을 제공하겠다는 미국과 캐나다의 제의 역시 (거절했다). (turned down의 뜻은?)","opts":["거절했다","받아들였다","더 늘렸다","찾아냈다"],"word":"turned down","r":{"a":"1) 거절했다","ev":"7번 문장","s":[[7,"Not only did Churchill refuse to send some of this rice to Bengal, but he also turned down offers from the United States and Canada to provide food.","처칠은 이 쌀의 일부를 벵골에 보내는 것을 거부했을 뿐만 아니라 식량을 제공하겠다는 미국과 캐나다의 제의 역시 거절했다."]],"w":"앞에서 쌀을 보내는 것을 refuse(거부하다)했다고 했고, but he also로 이어져요. 식량을 주겠다는 제의도 거절한 거예요. turn down = 거절하다.","c":1},"h":"e6a9f63598"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nInstead, he turned his back on the people of Bengal and let them die.","ko":"밑줄 친 them이 가리키는 것은?","sko":"대신, 그는 벵골 사람들에게 등을 돌리고 그들이 죽게 내버려 두었다.","opts":["연합군","영국 병사들","미국과 캐나다 사람들","벵골 사람들"],"r":{"a":"4) 벵골 사람들","ev":"11번 문장","s":[[11,"Instead, he turned his back on the people of Bengal and let them die.","대신, 그는 벵골 사람들에게 등을 돌리고 그들이 죽게 내버려 두었다."]],"w":"let them die는 '그들이 죽게 내버려 두었다'예요. 바로 앞에서 처칠이 등을 돌린 대상이 the people of Bengal이니 them은 벵골 사람들이에요.","c":4},"h":"238a69a519"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"His reason was that he feared enemy soldiers who were near Bengal would take the food.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 이유는 벵골 근처에 있는 적군이 그 식량을 빼앗을 것을 처칠이 두려워했기 때문이다.","opts":["그 이유는 벵골 사람들이 식량을 영국 병사에게서 빼앗을까 두려웠기 때문이다.","그 이유는 벵골 근처의 적군이 그 식량을 빼앗을까 두려웠기 때문이다.","그 이유는 식량이 모자라서 적군을 먹일 수 없었기 때문이다.","그 이유는 미국이 식량을 벵골에 보낼까 두려웠기 때문이다."],"r":{"a":"2) 그 이유는 벵골 근처의 적군이 그 식량을 빼앗을까 두려웠기 때문이다.","ev":"8번 문장","s":[[8,"His reason was that he feared enemy soldiers who were near Bengal would take the food.","그 이유는 벵골 근처에 있는 적군이 그 식량을 빼앗을 것을 처칠이 두려워했기 때문이다."]],"w":"feared(두려워했다)의 내용이 enemy soldiers who were near Bengal would take the food예요. 벵골 근처의 적군이 식량을 가져갈까 걱정한 거예요.","c":2},"h":"38cad2888f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["처칠은 영국의 수상으로서 연합군을 승리로 이끄는 것을 도왔다.","처칠은 어려운 시기에 영국을 분열시켰다.","처칠은 미국의 수상으로서 전쟁을 이끌었다.","처칠은 2차 세계대전의 지도자로 여겨지지 않았다."],"opts":["As the Prime Minister, Churchill helped lead the Allied Forces to victory.","Churchill divided the United Kingdom during difficult times.","Churchill led the war as the Prime Minister of the United States.","Churchill was not viewed as a leader of World War II by anyone."],"r":{"a":"1) As the Prime Minister, Churchill helped lead the Allied Forces to victory.","ev":"1~2번 문장","s":[[1,"Many people view Winston Churchill as one of the greatest leaders of World War II.","많은 사람들이 윈스턴 처칠을 2차 세계대전의 가장 위대한 지도자 중 한 명으로 여긴다."],[2,"As the Prime Minister of the United Kingdom, he held his country together during difficult times and helped to lead the Allied Forces to victory.","영국의 수상으로서, 처칠은 어려운 시기에 자신의 나라를 하나로 단결시키고 연합군을 승리로 이끄는 것을 도왔다."]],"w":"2번에서 영국의 수상으로서 나라를 단결시키고 연합군을 승리로 이끄는 것을 도왔다고 해요. 1번에서 많은 사람이 그를 위대한 지도자로 여긴다고 하니 '아무도 지도자로 보지 않았다'는 틀려요.","c":1},"h":"f03cca529a"},{"n":9,"t":"sum","q":"Many people regard Churchill as a (A) leader, but some see him as (B) because he put his country before human lives.","ko":"많은 사람들은 처칠을 (A) 지도자로 여기지만, 어떤 사람들은 그가 나라를 사람의 생명보다 앞세웠기 때문에 그를 (B) 사람으로 본다.","oko":["(A) 약한 / (B) 무정한","(A) 위대한 / (B) 너그러운","(A) 위대한 / (B) 무정한","(A) 잔인한 / (B) 위대한","(A) 용감한 / (B) 수줍은"],"opts":["(A) weak / (B) heartless","(A) great / (B) generous","(A) great / (B) heartless","(A) cruel / (B) great","(A) brave / (B) shy"],"r":{"a":"3) (A) great / (B) heartless","ev":"3번, 12번 문장","s":[[3,"But not everyone saw Churchill as a great man, especially not those living in areas colonized by the British Empire.","그러나 모두가 처칠을 위대한 사람으로 여기는 것은 아니었는데 특히 대영제국에 의해 식민화된 지역에 사는 사람들이 그러했다."],[12,"Because he coldly decided to put his country before human lives, some people view him as a heartless and cruel man.","그가 자신의 나라를 사람의 생명보다 우선시하기로 냉정하게 결정했기 때문에 어떤 사람들은 그를 무정하고 잔인한 사람으로 여긴다."]],"w":"3번 not everyone saw Churchill as a great man에서 많은 사람은 그를 위대한 지도자로 보았다는 것을 알 수 있고, 12번에서 어떤 사람들은 그를 heartless and cruel(무정하고 잔인한)하다고 여겨요. 나라를 생명보다 앞세운 사람이 너그럽다고 할 수는 없어요.","c":3},"h":"9e9b3b2db8"},{"n":10,"t":"fill","q":"Although Churchill had no way of [A] the famine, he could have [B] the number of victims.","ko":"비록 처칠에게 기근을 [A] 방법이 있던 것은 아니었지만, 그는 희생자의 수를 [B] 수도 있었다.","bank":["preventing","reduced","exporting","ruling","starved","feared"],"bko":{"preventing":"막는","reduced":"줄일","exporting":"수출하는","ruling":"지배하는","starved":"굶주린","feared":"두려워한"},"r":{"a":"[A] preventing (막는), [B] reduced (줄일)","ev":"10번 문장","s":[[10,"Although Churchill had no way of preventing the famine, he could have reduced the number of victims.","비록 처칠에게 기근을 예방할 수 있는 방법이 있던 것은 아니었지만, 그는 희생자의 수를 줄일 수도 있었다."]],"w":"no way of preventing the famine은 '기근을 막을 방법이 없다'이고, could have reduced the number of victims는 '희생자 수를 줄일 수도 있었다'예요. 나머지 단어는 이 자리에서 뜻이 맞지 않아요.","c":null},"h":"f877132069"}]},{"u":3,"id":"ch2-03-3","no":3,"ko":"‘미친 척’이 만든 진짜 변화","items":[{"n":1,"t":"tf","q":"When she was 23, Nellie Bly already worked as a journalist in Pittsburgh.","ko":"23살 때 넬리 블라이는 이미 피츠버그에서 기자로 일하고 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In 1887, 23-year-old Nellie Bly already had a career as a journalist in the small city of Pittsburgh.","1887년에, 23살의 넬리 블라이는 소도시 피츠버그에서 이미 기자로서의 경력이 있었다."]],"w":"1번에서 1887년에 23살의 블라이는 소도시 피츠버그에서 이미 기자로서의 경력이 있었다고 해요.","c":"T"},"h":"51eb828d1e"},{"n":2,"t":"tf","q":"Most of the stories Bly was asked to write in Pittsburgh were meant for all readers.","ko":"블라이가 피츠버그에서 쓰도록 요청받은 기사 대부분은 모든 독자를 위한 것이었다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"However, most of the stories she was asked to write were directed only at women.","그러나, 그녀가 작성하도록 요청받은 기사 대부분은 여성들만을 겨냥하고 있었다."]],"w":"2번에서 기사 대부분이 여성들만을 겨냥했다(directed only at women)고 해요. 모든 독자를 위한 기사는 그녀가 꿈꾸던 것(3번)이에요.","c":"F"},"h":"3e3180d776"},{"n":3,"t":"tf","q":"Bly pretended to be mentally ill for a month to get inside the hospital.","ko":"블라이는 병원에 들어가기 위해 한 달 동안 정신병이 있는 척했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"In order to get inside, Bly pretended to be mentally ill for 10 days.","병원에 잠입하기 위해, 블라이는 열흘 동안 정신병이 있는 척했다."]],"w":"6번에서 정신병이 있는 척한 기간은 열흘(10 days)이에요. 한 달이 아니에요.","c":"F"},"h":"34dc50b9e8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… Bly decided to break the world record for the fastest trip around the world.)","ko":"블라이는 가장 빠른 세계 일주 기록을 (깨기로) 결심했다. (break의 뜻은?)","opts":["고치다","깨다","멈추다","나누다"],"word":"break","r":{"a":"2) 깨다","ev":"9번 문장","s":[[9,"Later, after reading the famous book Around the World in 80 Days, Bly decided to break the world record for the fastest trip around the world.","이후에, 『80일간의 세계 일주』라는 유명한 책을 읽은 후에, 블라이는 가장 빠른 세계 일주 기록을 깨기로 결심했다."]],"w":"world record(세계 기록)와 함께 쓰이면 break는 '기록을 깨다'예요. 가장 빠른 기록을 새로 세우려는 도전이에요.","c":2},"h":"cd727e0941"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The story that she wrote about her experience was published as a six-part series, …)","ko":"그녀가 자신의 경험에 대해 쓴 기사는 여섯 부분으로 나누어진 시리즈로 (출간되었고), … (published의 뜻은?)","opts":["지워졌고","번역되었고","숨겨졌고","출간되었고"],"word":"published","r":{"a":"4) 출간되었고","ev":"7번 문장","s":[[7,"The story that she wrote about her experience was published as a six-part series, and it made her one of America’s most famous journalists.","그녀가 자신의 경험에 대해 쓴 기사는 여섯 부분으로 나누어진 시리즈로 출간되었고, 그것은 그녀를 미국의 가장 유명한 기자 중 한 명으로 만들었다."]],"w":"기사가 six-part series(여섯 부분의 시리즈)로 세상에 나왔고 그 덕분에 유명해졌어요. publish는 '출간하다, 발행하다'예요.","c":4},"h":"4edef9d453"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nBly dreamed of writing important stories for all readers, so she moved to New York and tried to find work at the New York World, which was one of the nation’s leading newspapers at that time.","ko":"밑줄 친 which가 가리키는 것은?","sko":"블라이는 모든 독자들에게 중요한 기사를 쓰는 것을 꿈꿔서, 뉴욕으로 이주해 『뉴욕 월드』에서 일자리를 구하려고 했는데, 이곳은 당시에 그 나라의 대표 신문사 중 하나였다.","opts":["뉴욕","피츠버그","『뉴욕 월드』","모든 독자들"],"r":{"a":"3) 『뉴욕 월드』","ev":"3번 문장","s":[[3,"Bly dreamed of writing important stories for all readers, so she moved to New York and tried to find work at the New York World, which was one of the nation’s leading newspapers at that time.","블라이는 모든 독자들에게 중요한 기사를 쓰는 것을 꿈꿔서, 뉴욕으로 이주해 『뉴욕 월드』에서 일자리를 구하려고 했는데, 이곳은 당시에 그 나라의 대표 신문사 중 하나였다."]],"w":"which 앞의 the New York World를 덧붙여 설명하는 말이에요. 당시 그 나라의 대표 신문사 중 하나였던 것은 신문사인 『뉴욕 월드』예요.","c":3},"h":"4bf86c89b5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It also helped start a new style of reporting called investigative journalism.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 또한 탐사 보도라고 불리는 새로운 형태의 보도를 시작하는 데도 일조했다.","opts":["그 기사는 탐사 보도라는 새로운 형태의 보도가 시작되는 데 도움이 되었다.","그 기사는 탐사 보도를 하지 못하게 막았다.","그 기사는 오래된 보도 방식을 그대로 따랐다.","그 기사는 탐사 보도를 가르치는 학교를 세웠다."],"r":{"a":"1) 그 기사는 탐사 보도라는 새로운 형태의 보도가 시작되는 데 도움이 되었다.","ev":"8번 문장","s":[[8,"It also helped start a new style of reporting called investigative journalism.","그것은 또한 탐사 보도라고 불리는 새로운 형태의 보도를 시작하는 데도 일조했다."]],"w":"helped start a new style of reporting은 '새로운 형태의 보도를 시작하는 데 일조했다'예요. called investigative journalism은 그 새로운 보도 방식의 이름이에요.","c":1},"h":"8311604e8f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["블라이는 72일 만에 세계 일주를 끝내고 기록을 세웠다.","블라이는 80일이 걸려 세계 일주를 끝냈다.","블라이는 세계 일주를 끝내지 못했다.","블라이는 세계 일주 기록을 세우기 전에 그 경험을 책으로 썼다."],"opts":["Bly completed the trip in just 72 days and set the record.","Bly completed the trip around the world in 80 days.","Bly could not finish the trip around the world.","Bly wrote a book about the trip before she set the record."],"r":{"a":"1) Bly completed the trip in just 72 days and set the record.","ev":"10번 문장","s":[[10,"Completing the trip in just 72 days, she set the record and then wrote a book about the experience.","단지 72일 만에 여행을 끝낸 후에, 그녀는 기록을 세우고 나서 그 경험에 대해 책 한 권을 썼다."]],"w":"10번에서 단 72일 만에 여행을 끝내고 기록을 세운 다음 그 경험에 대해 책을 썼다고 해요. 80일은 책 제목의 숫자일 뿐이고, 책은 기록을 세운 뒤에 썼어요.","c":1},"h":"2e82460c7c"},{"n":9,"t":"sum","q":"Bly’s story about the hospital made her (A), and she is remembered today as a (B) woman.","ko":"병원에 관한 블라이의 기사는 그녀를 (A)로 만들었고, 그녀는 오늘날 (B) 여성으로 기억된다.","oko":["(A) 무명인 / (B) 용감한","(A) 유명한 / (B) 수줍은","(A) 은퇴한 / (B) 부유한","(A) 가난한 / (B) 조용한","(A) 유명한 / (B) 용감한"],"opts":["(A) unknown / (B) brave","(A) famous / (B) shy","(A) retired / (B) rich","(A) poor / (B) quiet","(A) famous / (B) brave"],"r":{"a":"5) (A) famous / (B) brave","ev":"7번, 11번 문장","s":[[7,"The story that she wrote about her experience was published as a six-part series, and it made her one of America’s most famous journalists.","그녀가 자신의 경험에 대해 쓴 기사는 여섯 부분으로 나누어진 시리즈로 출간되었고, 그것은 그녀를 미국의 가장 유명한 기자 중 한 명으로 만들었다."],[11,"Today, Bly is remembered as both an important journalist and a brave woman.","오늘날, 블라이는 영향력이 큰 기자이자 용감한 여성으로 기억된다."]],"w":"7번에서 그 기사가 그녀를 미국의 가장 유명한 기자 중 한 명으로 만들었고, 11번에서 중요한 기자이자 용감한 여성으로 기억된다고 해요.","c":5},"h":"9d96c3c7e8"},{"n":10,"t":"fill","q":"He asked her to investigate a local mental hospital with a bad [A] for [B] patients poorly.","ko":"그는 그녀에게 환자들을 형편없이 [B](으)로 나쁜 [A]을(를) 가진 지역 정신병원을 조사해 달라고 요청했다.","bank":["reputation","treating","career","series","journalist","newspaper"],"bko":{"reputation":"평판","treating":"대하는 것","career":"경력","series":"시리즈","journalist":"기자","newspaper":"신문"},"r":{"a":"[A] reputation (평판), [B] treating (대하는 것)","ev":"5번 문장","s":[[5,"He asked her to investigate a local mental hospital with a bad reputation for treating patients poorly.","그는 그녀에게 환자들을 형편없이 대하는 것으로 악명 높은 지역 정신병원을 조사해달라고 요청했다."]],"c":null,"k":null},"h":"eb0a5d8b4f"}]},{"u":3,"id":"ch2-03-4","no":4,"ko":"수능:ON 도표","items":[{"n":1,"t":"tf","q":"In both 2023 and 2024, there were more Korean visitors than foreign visitors at the two palaces.","ko":"2023년과 2024년 두 해 모두, 두 궁에는 외국인 방문자보다 한국인 방문자가 더 많았다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"During both 2023 and 2024, the two palaces had more Korean visitors than foreign visitors.","2023년과 2024년 두 해 모두, 두 궁은 한국인 방문자 수가 외국인 방문자 수보다 많았다."]],"w":"4번에서 2023년과 2024년 두 해 모두 두 궁에 한국인 방문자가 외국인 방문자보다 많았다고 해요.","c":"T"},"h":"f6aeb9030c"},{"n":2,"t":"tf","q":"From 2023 to 2024, the number of Korean visitors to Changgyeonggung Palace increased, while that to Deoksugung Palace decreased.","ko":"2023년부터 2024년까지 창경궁의 한국인 방문자 수는 증가한 반면, 덕수궁의 한국인 방문자 수는 감소했다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"While the number of Korean visitors to Changgyeonggung Palace decreased from 2023 to 2024, the number of Korean visitors to Deoksugung Palace increased during the same period.","2023년부터 2024년까지 창경궁의 한국인 방문자 수는 감소한 반면, 같은 기간 동안 덕수궁의 한국인 방문자 수는 증가했다."]],"w":"3번에서는 창경궁의 한국인 방문자 수가 감소(decreased)했고 덕수궁은 증가(increased)했어요. 두 궁의 증감이 뒤바뀌었어요.","c":"F"},"h":"9a2ace3456"},{"n":3,"t":"tf","q":"In 2023, foreign visitors made up about half of the total visitors to Changgyeonggung Palace.","ko":"2023년에 외국인 방문자는 창경궁 총 방문자의 약 절반을 차지했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In 2023, the number of foreign visitors to Changgyeonggung Palace made up only about 10 percent of the total visitors that year.","2023년에 창경궁의 외국인 방문자 수는 그해 총 방문자 수의 겨우 10%를 차지했다."]],"w":"5번에서 2023년 창경궁의 외국인 방문자 수는 그해 총 방문자 수의 겨우 약 10퍼센트(only about 10 percent)를 차지했다고 해요. 절반이 아니에요.","c":"F"},"h":"9c48bd74ae"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The tables above show the number of Korean and foreign visitors to Korean palaces …)","ko":"위 도표는 한국의 궁을 찾은 한국인과 (외국인) 방문자의 수를 보여 준다. (foreign의 뜻은?)","opts":["오래된","지역의","외국의","유명한"],"word":"foreign","r":{"a":"3) 외국의","ev":"1번 문장","s":[[1,"The tables above show the number of Korean and foreign visitors to Korean palaces in 2023 and 2024.","위 도표는 2023년과 2024년에 한국의 궁에 방문한 한국인 방문자와 외국인 방문자의 수를 보여 준다."]],"w":"Korean(한국인)과 짝을 이루어 방문자를 나누고 있어요. 한국인과 대비되는 방문자는 외국의(foreign) 방문자예요.","c":3},"h":"9de5cc2187"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (While the number of Korean visitors to Changgyeonggung Palace decreased from 2023 to 2024, …)","ko":"창경궁의 한국인 방문자 수는 2023년부터 2024년까지 (줄어든) 반면, … (decreased의 뜻은?)","opts":["늘었다","줄었다","바뀌었다","멈췄다"],"word":"decreased","r":{"a":"2) 줄었다","ev":"3번 문장","s":[[3,"While the number of Korean visitors to Changgyeonggung Palace decreased from 2023 to 2024, the number of Korean visitors to Deoksugung Palace increased during the same period.","2023년부터 2024년까지 창경궁의 한국인 방문자 수는 감소한 반면, 같은 기간 동안 덕수궁의 한국인 방문자 수는 증가했다."]],"w":"While은 대조예요. 뒤에서 덕수궁 한국인 방문자 수가 increased(늘었다)라고 하니, 앞의 decreased는 반대로 '줄었다'예요.","c":2},"h":"9504a1bc21"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nFor the two-year period of 2023 to 2024, the overall total number of visitors to Deoksugung Palace was larger than that to Changgyeonggung Palace.","ko":"밑줄 친 that이 가리키는 것은?","sko":"2023년부터 2024년까지 2년의 기간 동안 덕수궁의 총 방문자 수는 창경궁의 총 방문자 수보다 컸다.","opts":["덕수궁","2년의 기간","총 방문자 수","창경궁"],"r":{"a":"3) 총 방문자 수","ev":"2번 문장","s":[[2,"For the two-year period of 2023 to 2024, the overall total number of visitors to Deoksugung Palace was larger than that to Changgyeonggung Palace.","2023년부터 2024년까지 2년의 기간 동안 덕수궁의 총 방문자 수는 창경궁의 총 방문자 수보다 컸다."]],"w":"덕수궁의 총 방문자 수와 창경궁의 총 방문자 수를 비교하는 문장이에요. 같은 말을 반복하지 않으려고 that을 써서 the overall total number of visitors를 받았어요.","c":3},"h":"6a9044007c"},{"n":7,"t":"sense","q":"Which is the best mea
