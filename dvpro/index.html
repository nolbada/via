<title>더블보카 Pro 유의어 반의어</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--fs:1.28;
  --bg:#f3efe6; --card:#fffdf8; --ink:#1f2a2e; --sub:#5b6a6e; --line:#e2dccd;
  --accent:#1f6f6b; --accent-ink:#ffffff; --accent-soft:#dcefec;
  --good:#1f7a4d; --good-bg:#d9f0e3; --bad:#b3372f; --bad-bg:#f8dcd8; --miss:#2b5fa8; --miss-bg:#dce8f8;
  --chip:#f1ece0; --star:#b9820a; --shadow:0 8px 24px rgba(31,42,46,.10);
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12191b; --card:#1b2528; --ink:#eef2f1; --sub:#9db0b3; --line:#2c393c;
  --accent:#58c2b9; --accent-ink:#0d1c1b; --accent-soft:#1d3a39;
  --good:#6fd6a0; --good-bg:#1c3a2b; --bad:#ff8f86; --bad-bg:#432220; --miss:#8fb7f0; --miss-bg:#1f2f48;
  --chip:#243134; --star:#f0c24a; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12191b; --card:#1b2528; --ink:#eef2f1; --sub:#9db0b3; --line:#2c393c;
  --accent:#58c2b9; --accent-ink:#0d1c1b; --accent-soft:#1d3a39;
  --good:#6fd6a0; --good-bg:#1c3a2b; --bad:#ff8f86; --bad-bg:#432220; --miss:#8fb7f0; --miss-bg:#1f2f48;
  --chip:#243134; --star:#f0c24a; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark; }
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:calc(14px*var(--fs));line-height:1.5;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 8px}
.top b{font-family:"DM Serif Display",serif;font-weight:400;font-size:calc(18px*var(--fs));letter-spacing:.2px}
.top span{color:var(--sub);font-size:calc(12px*var(--fs));font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.deck{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;gap:12px}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;min-width:0;height:100%}
.card{height:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow-y:auto;overflow-x:hidden;padding:22px 20px 26px;position:relative}
.no{font-size:calc(12px*var(--fs));letter-spacing:.14em;color:var(--sub);font-variant-numeric:tabular-nums}
.head{font-family:"DM Serif Display",serif;font-size:calc(30px*var(--fs));line-height:1.1;margin:6px 0 4px;white-space:nowrap;min-width:0}
.ask{margin:14px 0 6px;font-weight:700;font-size:calc(15px*var(--fs))}
mark{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:0 3px}
.hrow{display:flex;align-items:center;gap:12px}
.spk{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--chip);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.spk svg{width:20px;height:20px}
.kan{border-top:1px dashed var(--line);padding:14px 0 6px}
.kan:first-of-type{border-top:0}
.tag{display:inline-block;font-size:calc(11px*var(--fs));font-weight:700;color:var(--accent);background:var(--accent-soft);border-radius:999px;padding:2px 10px;margin-right:6px}
.sense{font-weight:500;font-size:calc(13px*var(--fs))}
.q{font-size:calc(13px*var(--fs));color:var(--sub);margin:8px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:14px;padding:9px 10px;font:inherit;font-size:calc(14px*var(--fs));font-weight:500;text-align:left;cursor:pointer;min-width:0;word-break:break-word}
.opt{position:relative;padding-right:34px}
.osp{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);border-radius:50%}
.opt small{display:block;font-weight:400;font-size:calc(11px*var(--fs));color:var(--sub);margin-top:2px;min-height:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.opt.miss{border-color:var(--miss);background:var(--miss-bg)}
.opt[disabled]{cursor:default}
.go{margin-top:14px;width:100%;border:0;border-radius:14px;padding:13px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}
.go[disabled]{opacity:.35;cursor:default}
.res{margin-top:12px;font-weight:700}
.res.ok{color:var(--good)} .res.no2{color:var(--bad)}
.back .lock{filter:blur(7px);pointer-events:none;user-select:none}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill{border-radius:999px;padding:3px 10px;font-size:calc(13px*var(--fs));font-weight:500}
.pill{border:0;font-family:inherit;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.pill svg{flex:0 0 auto}
.pill.s{background:var(--good-bg);color:var(--good)}
.pill.a{background:var(--bad-bg);color:var(--bad)}
.pill em{font-style:normal;font-weight:400;opacity:.85;margin-left:4px;font-size:calc(11px*var(--fs))}
.lab{font-size:calc(11px*var(--fs));letter-spacing:.08em;color:var(--sub);margin:16px 0 4px;font-weight:700}
.ex{background:var(--chip);border-radius:14px;padding:11px 13px;margin:6px 0}
.ex b{display:block;font-weight:500;font-size:calc(14px*var(--fs))}
.ex span{color:var(--sub);font-size:calc(13px*var(--fs))}
.timing{font-size:calc(14px*var(--fs));font-weight:500;line-height:1.5}
.other{color:var(--sub);font-size:calc(13px*var(--fs))}
.note{font-size:calc(13px*var(--fs));margin:3px 0;color:var(--ink)}
.note b{font-weight:700;color:var(--accent)}
.navb{display:flex;gap:8px;margin-top:10px}
.navb button{flex:1;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:12px;padding:10px;font:inherit;cursor:pointer}
.navb button[disabled]{opacity:.35}
.end h2{font-family:"DM Serif Display",serif;font-weight:400;font-size:calc(28px*var(--fs));margin:6px 0}
.miss-list{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0}
.miss-list button{border:1px solid var(--bad);background:var(--bad-bg);color:var(--bad);border-radius:999px;padding:5px 12px;font:inherit;cursor:pointer}
.reset{margin-top:20px;width:100%;border:1px solid var(--line);background:transparent;color:var(--sub);border-radius:14px;padding:12px;font:inherit;cursor:pointer}
.reset.arm{border-color:var(--bad);color:var(--bad)}
.homec{margin:auto 0;display:flex;flex-direction:column;gap:12px;padding:20px 0}
#days,#home{overflow-y:auto;overscroll-behavior:contain;-webkit-overflow-scrolling:touch}
#days .homec,#home .homec{padding-bottom:calc(28px + env(safe-area-inset-bottom,0px))}
.homec h1{font-family:"DM Serif Display",serif;font-weight:400;font-size:calc(44px*var(--fs));line-height:1.05;margin:0 0 10px}
.big{border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:18px;padding:18px;font:inherit;text-align:left;cursor:pointer;box-shadow:var(--shadow)}
.big b{display:block;font-size:calc(18px*var(--fs))}
.big span{color:var(--sub);font-size:calc(13px*var(--fs))}
.trow{display:flex;gap:8px}
.trow .big{flex:1;text-align:center;font-weight:700;padding:16px 8px}
.home-btn{border:1px solid var(--line);background:var(--card);color:var(--sub);border-radius:10px;padding:4px 10px;font:inherit;font-size:calc(12px*var(--fs));cursor:pointer}
.timer{font-variant-numeric:tabular-nums;font-weight:700;color:var(--ink)!important;font-size:calc(15px*var(--fs))!important}
.timer.low{color:var(--bad)!important}
.ritem{border-top:1px solid var(--line);padding:9px 0;font-size:calc(13px*var(--fs))}
.ritem .st{font-weight:700}
.ritem.ok .st{color:var(--good)}
.ritem.bad .st{color:var(--bad)}
.mine{font-size:calc(12px*var(--fs));color:var(--sub)}
.big[disabled]{opacity:.45;cursor:default}
.starb{position:absolute;top:12px;right:14px;border:0;background:none;font-size:calc(24px*var(--fs));line-height:1;color:var(--sub);cursor:pointer;padding:4px}
.starb.on,.starb2.on{color:var(--star)}
.starb2{float:right;border:0;background:none;font-size:calc(18px*var(--fs));line-height:1;color:var(--sub);cursor:pointer;padding:0 2px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:calc(15px*var(--fs));margin:8px 0}
.msg{font-size:calc(13px*var(--fs));color:var(--bad);min-height:18px}
.tsec{margin-top:26px;border-top:1px dashed var(--line);padding-top:12px}
.sub2{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:inherit;cursor:pointer}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
.dbtn{position:relative;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 0;font:inherit;font-size:calc(15px*var(--fs));font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.dbtn i{position:absolute;top:3px;right:6px;font-style:normal;font-size:calc(10px*var(--fs));font-weight:700;color:var(--bad)}

.prog{margin:4px 0 14px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.prog .big2{font-size:calc(26px*var(--fs));font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.prog .big2 small{font-size:calc(13px*var(--fs));font-weight:500;color:var(--sub);margin-left:4px}
.prog .psub{font-size:calc(12px*var(--fs));color:var(--sub);margin-top:2px;font-variant-numeric:tabular-nums}
.prog .bar{height:8px;border-radius:99px;background:var(--chip);margin-top:10px;overflow:hidden}
.prog .bar b{display:block;height:100%;background:var(--accent);border-radius:99px}
.dbtn.dn{background:var(--accent-soft);border-color:var(--accent)}
</style>

<div class="app" id="days">
  <div class="homec">
    <div class="no">쎄듀 더블보카 Pro · 유의어 · 반의어</div>
    <h1>더블보카 Pro</h1>
    <div class="prog" id="prog"></div>
    <div class="dgrid" id="dgrid"></div>
    <button class="big" id="mAllStar" type="button"><b>내 오답 모음</b><span id="mAllStarN"></span></button>
  </div>
</div>
<div class="app" id="home" hidden>
  <div class="homec">
    <div class="no">유의어 · 반의어</div>
    <h1 id="dayh">Day 01</h1>
    <button class="big" id="mLearn" type="button"><b>학습</b><span>퀴즈로 익히기</span></button>
    <button class="big" id="mPrac" type="button"><b>연습</b><span>랜덤 섞기 · 제출 후 채점</span></button>
    <button class="big" id="mStar" type="button"><b>틀린 문제만 연습</b><span id="mStarN"></span></button>
    <button class="big" id="mExam" type="button"><b>시험</b><span>1회 · 타임어택</span></button>
    <button class="home-btn" id="hbd" type="button" style="align-self:flex-start">Day 목록</button>
  </div>
</div>
<div class="app" id="learn" hidden>
  <div class="top"><b id="lt">Day 01</b><span id="cnt"></span><button class="home-btn" id="hb1" type="button">처음으로</button></div>
  <div class="bar"><i id="bar"></i></div>
  <div class="deck" id="deck"></div>
  <div class="navb"><button id="prev">이전</button><button id="next">다음</button></div>
</div>
<div class="app" id="testv" hidden></div>

<script>
/* 통합 오답노트 연결 스크립트: WN.add([{w,m,src,how,ask}]) 단어 전송, WN.hw(level,day,score) 숙제 기록, WN.gate(cb) 이름 확인 */
(function(W){
  if(W.WN)return;
  if(/[?&]t=1(&|$)/.test(W.location.search)){W.TEACHER_MODE=true;W.WN={add:function(){return Promise.resolve(false)},hw:function(){return Promise.resolve(false)},gate:function(cb){cb()},flush:function(){return Promise.resolve(false)},name:function(){return'선생님'}};return}
  var URL_=W.WN_URL||'https://script.google.com/macros/s/AKfycbzc2ei1hfWwFPviIFZndCLPchR7NRlrUtY9IqZ6mL2sruJxshFJMpGaKp3LeHHUEl6Apg/exec',PIN='6900',QK='wn_q',HK='wn_hq';
  function ls(){try{return W.localStorage}catch(e){return null}}
  function g(k){var l=ls();try{return l&&l.getItem(k)}catch(e){return null}}
  function s(k,v){var l=ls();try{l&&l.setItem(k,v)}catch(e){}}
  function name(){return(g('wn_name')||g('recm_name')||g('rec_name')||'').replace(/\s+/g,'')}
  function jq(k){try{return JSON.parse(g(k)||'[]')}catch(e){return[]}}
  function post(b){return fetch(URL_,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(b),keepalive:true}).then(function(r){return r.json()})}
  var busy=false,again=false;
  function flush(){
    var n=name(),Q=jq(QK),H=jq(HK);
    if(busy){again=true;return Promise.resolve(false)}
    if(!n||(!Q.length&&!H.length))return Promise.resolve(false);
    busy=true;var p=Promise.resolve();
    if(Q.length){var items=[];Q.forEach(function(b){items=items.concat(b)});
      p=p.then(function(){return post({act:'add',name:n,pin:PIN,items:items}).then(function(r){if(r&&r.ok)s(QK,JSON.stringify(jq(QK).slice(Q.length)))})})}
    H.forEach(function(h){p=p.then(function(){return post({act:'hw',name:n,pin:PIN,level:h.level,day:h.day,score:h.score}).then(function(r){if(r&&r.ok)s(HK,JSON.stringify(jq(HK).filter(function(x){return!(x.level===h.level&&x.day===h.day&&x.score===h.score)})))})})});
    return p.then(function(){busy=false;if(again){again=false;flush()}return true},function(){busy=false;again=false;return false});
  }
  function gate(cb){
    if(name()){cb();flush();return}
    var d=document.createElement('div');
    d.style.cssText='position:fixed;inset:0;z-index:99999;background:Canvas;color:CanvasText;display:flex;align-items:center;justify-content:center;padding:20px;font-family:-apple-system,"Apple SD Gothic Neo","Noto Sans KR","Malgun Gothic",system-ui,sans-serif';
    d.innerHTML='<div style="width:100%;max-width:420px"><div style="font-size:22px;font-weight:800;margin-bottom:12px">이름</div><input id="wng" type="text" autocomplete="off" style="width:100%;font-size:18px;padding:12px;border:1px solid #8885;border-radius:12px;background:Canvas;color:CanvasText"><button id="wnb" style="width:100%;margin-top:10px;padding:13px;border:0;border-radius:12px;font-size:16px;font-weight:700;background:#2f7d5b;color:#fff">시작</button><div id="wnm" style="margin-top:8px;font-size:14px;opacity:.7;min-height:20px"></div></div>';
    document.body.appendChild(d);
    var b=d.querySelector('#wnb'),m=d.querySelector('#wnm'),i=d.querySelector('#wng');
    function go(){var v=(i.value||'').replace(/\s+/g,'');if(!v)return;b.disabled=true;m.textContent='확인 중...';
      post({act:'list',name:v,pin:PIN}).then(function(r){
        if(r&&r.ok){s('wn_name',v);d.remove();cb();flush()}
        else{b.disabled=false;m.textContent='등록된 이름이 아니에요.'}
      },function(){b.disabled=false;m.textContent='연결이 안 됐어요. 인터넷을 확인해 주세요.'})}
    b.onclick=go;i.onkeydown=function(e){if(e.key==='Enter')go()};i.focus();
  }
  W.WN={add:function(items){
    if(!items||!items.length)return Promise.resolve(false);
    var Q=jq(QK);Q.push(items);s(QK,JSON.stringify(Q));return flush();
  },hw:function(level,day,score){
    var H=jq(HK);H.push({level:level,day:day,score:score});s(HK,JSON.stringify(H));return flush();
  },gate:gate,flush:flush,name:name};
  flush();
})(window);

</script>

function detectZoom(){
  try{
    var s=document.createElement('span');
    s.style.cssText='position:absolute;visibility:hidden;white-space:nowrap;left:-9999px;top:0;font:100px sans-serif';
    s.textContent='mmmmmmmmmm';document.body.appendChild(s);
    var w=s.getBoundingClientRect().width;document.body.removeChild(s);
    var cx=document.createElement('canvas').getContext('2d');cx.font='100px sans-serif';
    var cw=cx.measureText('mmmmmmmmmm').width;
    return cw>0?w/cw:1;
  }catch(e){return 1}
}

function opts(k,h,ki,salt){
  var all=[];k.syn.forEach(function(x){all.push({w:x[0],g:x[1],r:'s'})});
  k.ant.forEach(function(x){all.push({w:x[0],g:x[1],r:'a'})});
  k.dis.forEach(function(x){all.push({w:x[0],g:x[1],r:'d'})});
  all.forEach(function(o){o.ok=(kind(k)=='syn'?o.r=='s':o.r=='a')});
  return shuf(all,h+ki+(salt||''));
}
function state(wi){return st[wi]||(st[wi]={k:W[wi].kan.map(function(){return{sel:{},done:false}})})}
function wordDone(wi){return state(wi).k.every(function(x){return x.done})}
function wordOK(wi){var S=state(wi);return W[wi].kan.every(function(k,ki){var o=opts(k,W[wi].h,ki);return S.k[ki].done&&o.every(function(x){return !!S.k[ki].sel[x.w+'|'+x.g]==x.ok})})}

      var box=el('div','kan'),ks=S.k[ki];

      var hint=el('div','','<span class="tag">'+k.pos+'</span>'+(mk?'<span class="tag">'+mk+'</span>':''));
      box.appendChild(hint);
      function reveal(){if(hint.querySelector('.sense'))return;hint.insertAdjacentHTML('beforeend','<span class="sense">'+esc(k.sense.replace(/^[❶❷❸❹❺❻]+\s*/,''))+'</span>')}
      box.appendChild(el('div','q',kind(k)=='syn'?'뜻이 비슷한 것을 모두 고르시오.':'뜻이 반대인 것을 모두 고르시오.'));

        b.type='button';if(o.w.length>10)b.style.gridColumn='1 / -1';b.appendChild(optSpk(o.w,k.pos));
        function paint(){
          b.className='opt';
          var sel=!!ks.sel[key];

          b.disabled=true;
          if(sel&&o.ok)b.className='opt good';else if(sel&&!o.ok)b.className='opt bad';else if(!sel&&o.ok)b.className='opt miss';

        }

        b._paint=paint;grid.appendChild(b);
      });

        res.className='res '+(ok?'ok':'no2');res.textContent=ok?'정답':'오답';
        update();refreshBack(wi);
      };
      if(ks.done){go.style.display='none';reveal();[].forEach.call(grid.children,function(b){b._paint()});var ok=os.every(function(o){return !!ks.sel[o.w+'|'+o.g]==o.ok});res.className='res '+(ok?'ok':'no2');res.textContent=ok?'정답':'오답'}
      box.appendChild(go);box.appendChild(res);c1.appendChild(box);
    });

    s2.appendChild(c2);deck.appendChild(s2);fillBack(wi,c2);
  });

function recordResults(items,exam){
  var m=wrongMap();items.forEach(function(it){if(exam||anySel(it))markDone(it.di)});
  items.forEach(function(it){
    var k=ikey(it),ok=itemOK(it);it.note='';
    if(!exam&&!anySel(it))return;
    if(ok){if(k in m){m[k]++;if(m[k]>=2){delete m[k];it.note='오답 모음에서 빠짐'}else it.note='오답 모음 · 연속 정답 '+m[k]+'/2'}}
    else{m[k]=0;it.note='오답 모음 · 연속 정답 0/2';if(exam)wnSend(it,exam)}

function progStat(){

    var hm=el('button','reset','처음으로');hm.type='button';hm.onclick=goHome;c.appendChild(hm);
  }else{
    var l=el('button','sub2','학습으로 복습');l.type='button';l.onclick=startLearn;c.appendChild(l);
    var r=el('button','reset','처음으로');r.type='button';r.onclick=goDays;c.appendChild(r);
  }
  wrap.appendChild(c);tv.appendChild(wrap);
}
