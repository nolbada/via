to have relationships only with people they actually like.","또한 그들은 자신이 실제로 좋아하는 사람들하고만 관계를 맺는 경향이 있다."]],"w":"tend to-v는 ~하는 경향이 있다예요. only with people they actually like는 자신이 실제로 좋아하는 사람하고만이라는 뜻이에요.","c":2},"h":"0879d3ac9e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["FOMO는 소외되는 것에 대한 즐거움을 뜻한다.","FOMO를 겪는 사람들이 JOMO를 겪는 사람들보다 삶에 더 만족한다.","디지털 디톡스는 기기를 더 자주 사용하는 것이다.","JOMO를 겪는 사람들은 시간과 에너지를 더 효율적으로 사용한다."],"opts":["FOMO means the joy of missing out.","People with FOMO are more satisfied with their lives than people with JOMO.","A digital detox means using your devices more often.","People with JOMO use their time and energy more efficiently."],"r":{"a":"4) People with JOMO use their time and energy more efficiently.","ev":"1, 5, 7, 9, 15번 문장","s":[[1,"FOMO stands for the “fear of missing out.”","FOMO(포모)는 ‘(참석하지 않아서) 놓치는 것에 대한 두려움’을 의미한다."],[5,"In contrast, JOMO stands for the “joy of missing out.”","그에 반해서 JOMO(조모)는 ‘소외되는 것에 대한 즐거움’을 의미한다."],[7,"People with JOMO focus on themselves, so they are more satisfied with their lives.","JOMO를 겪는 사람들은 자신에게 집중해서 자신의 삶에 더 만족한다."],[9,"As a result, they use their time and energy more efficiently.","그 결과, 그들은 자신의 시간과 에너지를 더 효율적으로 사용한다."],[15,"This involves taking a break from your devices.","이것은 당신이 (스마트) 기기로부터 잠시 쉬는 것을 포함한다."]],"w":"9번에서 JOMO인 사람은 시간과 에너지를 더 효율적으로 써요. 1번 FOMO는 두려움이고, 7번에서 삶에 더 만족하는 쪽은 JOMO이며, 15번 디지털 디톡스는 기기를 쉬는 것이에요.","c":4},"h":"f0322e5327"},{"n":9,"t":"sum","q":"FOMO is the (A) of missing out, but people with JOMO enjoy (B) and are more satisfied with their lives.","ko":"FOMO는 놓치는 것에 대한 (A)이지만, JOMO를 겪는 사람들은 (B)을 즐기고 자신의 삶에 더 만족한다.","oko":["(A) 즐거움 / (B) 파티에 참석하는 것","(A) 즐거움 / (B) 혼자 시간을 보내는 것","(A) 두려움 / (B) 혼자 시간을 보내는 것","(A) 두려움 / (B) 파티에 참석하는 것","(A) 분노 / (B) 잠자는 것"],"opts":["(A) joy / (B) joining parties","(A) joy / (B) spending time alone","(A) fear / (B) spending time alone","(A) fear / (B) joining parties","(A) anger / (B) sleeping"],"r":{"a":"3) (A) fear / (B) spending time alone","ev":"1, 5, 6, 7번 문장","s":[[1,"FOMO stands for the “fear of missing out.”","FOMO(포모)는 ‘(참석하지 않아서) 놓치는 것에 대한 두려움’을 의미한다."],[5,"In contrast, JOMO stands for the “joy of missing out.”","그에 반해서 JOMO(조모)는 ‘소외되는 것에 대한 즐거움’을 의미한다."],[6,"It refers to the pleasure of spending time alone instead of joining social activities.","그것은 사교적인 활동에 참여하는 대신에 혼자서 시간을 보내는 즐거움을 말한다."],[7,"People with JOMO focus on themselves, so they are more satisfied with their lives.","JOMO를 겪는 사람들은 자신에게 집중해서 자신의 삶에 더 만족한다."]],"w":"1번에서 FOMO는 fear(두려움)이고, 6~7번에서 JOMO는 혼자 시간을 보내는 즐거움이며 그래서 삶에 더 만족해요.","c":3},"h":"ab292a9bb2"},{"n":10,"t":"fill","q":"You can start JOMO by saying [A] and by trying a digital [B].","ko":"당신은 [A]라고 말하는 것과 디지털 [B]을 시도하는 것으로 JOMO를 시작할 수 있다.","bank":["no","detox","alone","party","phone","social"],"bko":{"no":"아니오","detox":"디톡스","party":"파티","phone":"전화기","social":"사교적인","alone":"혼자"},"r":{"a":"[A] no, [B] detox","ev":"12, 14번 문장","s":[[12,"You can start by saying “no.”","당신은 ‘아니오’라고 말함으로써 (JOMO를) 시작할 수 있다."],[14,"You can also try a digital detox.","또한 디지털 디톡스를 시도해 볼 수 있다."]],"w":"12번 start by saying “no”와 14번 try a digital detox에서 가져왔어요. alone(혼자)은 JOMO의 모습(6번)이지만 saying 뒤에는 어울리지 않고, party·phone·social은 [B]의 digital 뒤에 오는 말로 맞지 않아요.","c":null},"h":"43c4acecc4"}]},{"u":8,"id":"nl2-08-1","no":1,"ko":"채소, 대신 길러 드립니다!","items":[{"n":1,"t":"tf","q":"Vegetables taste best when you pick them yourself.","ko":"채소는 직접 딸 때 가장 맛이 좋다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"And they taste best when you pick them yourself.","그리고 당신이 직접 그것을 딸 때 가장 맛이 좋다."]],"w":"2번 문장에 they taste best when you pick them yourself(직접 딸 때 가장 맛이 좋다)가 나와요. 그래서 맞는 말이에요.","c":"T"},"h":"d724678ba6"},{"n":2,"t":"tf","q":"The plants in the garden get light from the sun.","ko":"정원의 식물들은 태양으로부터 빛을 얻는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"The plants get oxygen and fertilizer from the water, and they get light from lamps.","식물들은 물에서 산소와 비료를 얻고 램프로부터 빛을 얻는다."]],"w":"8번 문장에서 식물은 램프(lamps)로부터 빛을 얻는다고 해요. 태양이 아니에요.","c":"F"},"h":"0dbfb1591e"},{"n":3,"t":"tf","q":"Shoppers can buy fresh vegetables only in summer.","ko":"쇼핑객들은 여름에만 신선한 채소를 살 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Shoppers like the garden because they can buy fresh vegetables even in winter.","쇼핑객들은 심지어 겨울에도 신선한 채소를 살 수 있기 때문에 그 정원을 좋아한다."]],"w":"9번 문장에서 쇼핑객들은 심지어 겨울에도(even in winter) 신선한 채소를 살 수 있다고 해요. 여름에만이라는 말은 틀려요.","c":"F"},"h":"ee7c961bbf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The garden looks like a supermarket refrigerator.)","ko":"그 정원은 슈퍼마켓의 ~처럼 생겼다.","opts":["오븐","냉장고","진열대","카트"],"word":"refrigerator","r":{"a":"2) 냉장고","ev":"6번 문장","s":[[6,"The garden looks like a supermarket refrigerator.","그 정원은 슈퍼마켓의 냉장고처럼 생겼다."]],"w":"채소를 신선하게 키우는 정원이 슈퍼마켓 안에 있는 모양이에요. 6번에서 그 정원이 어떻게 생겼는지 설명하는 말이 refrigerator, 즉 냉장고예요.","c":2},"h":"7ee9658967"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (it doesn't have to transport vegetables from far away)","ko":"그것은 먼 곳에서 채소를 ~하지 않아도 된다.","opts":["키우다","씻다","팔다","운송하다"],"word":"transport","r":{"a":"4) 운송하다","ev":"10번 문장","s":[[10,"And the supermarket saves money because it doesn’t have to transport vegetables from far away.","그리고 슈퍼마켓은 먼 곳에서 채소를 운송해 오지 않아도 되기 때문에 돈을 절약한다."]],"w":"슈퍼마켓은 채소를 안에서 키우니까 from far away(먼 곳에서) 채소를 실어 오지 않아도 돼요. 그래서 transport는 운송하다예요.","c":4},"h":"feaff98779"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat's because there is a vegetable garden inside the Metro supermarket.","ko":"밑줄 친 That가 가리키는 것은?","sko":"Metro 슈퍼마켓 안에 채소 정원이 있기 때문이다.","opts":["베를린에 살면 정원이 없어도 문제가 되지 않는 것","채소를 직접 따서 먹는 것","슈퍼마켓의 냉장고","겨울에 채소를 사는 것"],"r":{"a":"1) 베를린에 살면 정원이 없어도 문제가 되지 않는 것","ev":"4~5번 문장","s":[[4,"If you live in Berlin, it’s not a problem!","만약 당신이 베를린에 살고 있다면 문제가 되지 않는다!"],[5,"That’s because there is a vegetable garden inside the Metro supermarket.","Metro(메트로) 슈퍼마켓 안에 채소 정원이 있기 때문이다."]],"w":"That's because 뒤에는 이유가 나와요. 바로 앞 4번에서 베를린에 살면 문제가 되지 않는다고 했고, 5번은 그 이유를 말해요.","c":1},"h":"cf559116d4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Inside it, plants grow in water instead of soil.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 안에는 식물들이 흙 대신 물속에서 자란다.","opts":["그 안에서 식물은 흙과 물 모두 없이 자란다.","그 안에서 식물은 물 대신 흙에서 자란다.","그 안에서 식물은 흙 대신 물속에서 자란다.","그 안에서 식물은 물을 주지 않고 흙에서만 자란다."],"r":{"a":"3) 그 안에서 식물은 흙 대신 물속에서 자란다.","ev":"7번 문장","s":[[7,"Inside it, plants grow in water instead of soil.","그 안에는 식물들이 흙 대신 물속에서 자란다."]],"w":"instead of soil은 흙 대신이라는 뜻이에요. 그러니 흙이 아니라 물속에서 자라는 거예요.","c":3},"h":"d7e2b117b2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Metro 정원은 슈퍼마켓 밖에 있는 큰 밭이다.","정원의 식물들은 물에서 산소와 비료를 얻는다.","쇼핑객들은 겨울에는 신선한 채소를 살 수 없다.","슈퍼마켓은 먼 곳에서 채소를 옮겨 오느라 돈이 더 든다."],"opts":["The Metro garden is a big field outside the supermarket.","The plants in the garden get oxygen and fertilizer from the water.","Shoppers cannot buy fresh vegetables in winter.","The supermarket spends more money to move vegetables from far away."],"r":{"a":"2) The plants in the garden get oxygen and fertilizer from the water.","ev":"5, 8, 9, 10번 문장","s":[[5,"That’s because there is a vegetable garden inside the Metro supermarket.","Metro(메트로) 슈퍼마켓 안에 채소 정원이 있기 때문이다."],[8,"The plants get oxygen and fertilizer from the water, and they get light from lamps.","식물들은 물에서 산소와 비료를 얻고 램프로부터 빛을 얻는다."],[9,"Shoppers like the garden because they can buy fresh vegetables even in winter.","쇼핑객들은 심지어 겨울에도 신선한 채소를 살 수 있기 때문에 그 정원을 좋아한다."],[10,"And the supermarket saves money because it doesn’t have to transport vegetables from far away.","그리고 슈퍼마켓은 먼 곳에서 채소를 운송해 오지 않아도 되기 때문에 돈을 절약한다."]],"w":"8번에서 식물은 물에서 산소와 비료를 얻어요. 5번 정원은 슈퍼마켓 안에 있고, 9번에서 겨울에도 살 수 있으며, 10번에서 먼 곳에서 운송하지 않아 돈을 절약해요.","c":2},"h":"1499fe9bfe"},{"n":9,"t":"sum","q":"Shoppers like the garden because they can buy fresh vegetables even in (A), and the supermarket saves money because it doesn't have to (B) vegetables from far away.","ko":"쇼핑객들은 (A)에도 신선한 채소를 살 수 있어서 정원을 좋아하고, 슈퍼마켓은 먼 곳에서 채소를 (B)하지 않아도 되어 돈을 절약한다.","oko":["(A) 여름 / (B) 사다","(A) 겨울 / (B) 씻다","(A) 봄 / (B) 운송하다","(A) 가을 / (B) 요리하다","(A) 겨울 / (B) 운송하다"],"opts":["(A) summer / (B) buy","(A) winter / (B) wash","(A) spring / (B) transport","(A) autumn / (B) cook","(A) winter / (B) transport"],"r":{"a":"5) (A) winter / (B) transport","ev":"9~10번 문장","s":[[9,"Shoppers like the garden because they can buy fresh vegetables even in winter.","쇼핑객들은 심지어 겨울에도 신선한 채소를 살 수 있기 때문에 그 정원을 좋아한다."],[10,"And the supermarket saves money because it doesn’t have to transport vegetables from far away.","그리고 슈퍼마켓은 먼 곳에서 채소를 운송해 오지 않아도 되기 때문에 돈을 절약한다."]],"w":"9번에서 쇼핑객은 even in winter(겨울에도) 신선한 채소를 살 수 있고, 10번에서 슈퍼마켓은 먼 곳에서 채소를 transport(운송)하지 않아도 돼요.","c":5},"h":"aa02116315"},{"n":10,"t":"fill","q":"In the garden, plants grow in [A] instead of soil, and they get light from [B].","ko":"정원에서 식물들은 흙 대신 [A]에서 자라고, [B]로부터 빛을 얻는다.","bank":["water","lamps","soil","Berlin","oxygen","fertilizer"],"bko":{"water":"물","lamps":"램프","soil":"흙","oxygen":"산소","fertilizer":"비료","Berlin":"베를린"},"r":{"a":"[A] water, [B] lamps","ev":"7~8번 문장","s":[[7,"Inside it, plants grow in water instead of soil.","그 안에는 식물들이 흙 대신 물속에서 자란다."],[8,"The plants get oxygen and fertilizer from the water, and they get light from lamps.","식물들은 물에서 산소와 비료를 얻고 램프로부터 빛을 얻는다."]],"w":"7번 grow in water instead of soil, 8번 get light from lamps에서 가져왔어요. soil은 이미 문장 속 '~ 대신' 뒤에 나오는 말이라 [A]가 될 수 없고, oxygen·fertilizer는 물에서 얻는 것이지 빛의 출처가 아니에요.","c":null},"h":"e4682a5c1d"}]},{"u":8,"id":"nl2-08-2","no":2,"ko":"무시무시한 화장품","items":[{"n":1,"t":"tf","q":"Many cosmetics used to contain lead.","ko":"많은 화장품에 납이 들어 있곤 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Many cosmetics used to contain lead, which is poisonous.","많은 화장품에 납이 들어 있곤 했는데, 그것에는 독성이 있다."]],"w":"3번 문장에 Many cosmetics used to contain lead가 그대로 나와요. used to-v는 ~하곤 했다는 뜻이에요.","c":"T"},"h":"e7a0d37812"},{"n":2,"t":"tf","q":"In ancient Greece, women wanted to have very dark skin.","ko":"고대 그리스에서 여자들은 매우 어두운 피부를 갖기를 원했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In ancient Greece, it was fashionable for women to have very pale skin.","고대 그리스에서는 여자들이 매우 창백한 피부를 갖는 것이 유행했다."]],"w":"4번 문장에서 고대 그리스에서는 매우 창백한(pale) 피부가 유행했다고 해요. 어두운 피부가 아니에요.","c":"F"},"h":"7cf76a0a87"},{"n":3,"t":"tf","q":"European women used belladonna juice to make their pupils smaller.","ko":"유럽 여성들은 동공을 더 작게 만들기 위해 벨라도나 즙을 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"European women used the juice from this plant to make their pupils bigger during the Renaissance period.","르네상스 시대에 유럽 여성들은 동공을 더 크게 만들기 위해 이 식물로부터 나온 즙을 사용했다."]],"w":"9번 문장에서 동공을 더 크게(bigger) 만들려고 즙을 썼다고 해요. 작게가 아니에요.","c":"F"},"h":"36286a422c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many cosmetics used to contain lead, which is poisonous.)","ko":"많은 화장품에 납이 들어 있곤 했는데, 그것에는 ~.","opts":["값비싼","아름다운","독성이 있는","가벼운"],"word":"poisonous","r":{"a":"3) 독성이 있는","ev":"2~3번 문장","s":[[2,"Some cosmetics, however, were dangerous or even deadly!","그러나 어떤 화장품은 위험하거나 생명에 치명적이기까지 했다!"],[3,"Many cosmetics used to contain lead, which is poisonous.","많은 화장품에 납이 들어 있곤 했는데, 그것에는 독성이 있다."]],"w":"2번에서 위험하거나 치명적인 화장품이 있었다고 했고, 3번에서 그 이유로 든 납이 poisonous예요. 그래서 몸에 해로운 독성이 있다는 뜻이에요.","c":3},"h":"715141e9de"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Regular use of belladonna led to poor vision and sometimes blindness.)","ko":"벨라도나의 ~ 사용은 나쁜 시력과 때로는 실명으로 이어졌다.","opts":["잦은, 자주 하는","드문","한 번뿐인","오래된"],"word":"Regular","r":{"a":"1) 잦은, 자주 하는","ev":"6, 10번 문장","s":[[6,"After using it regularly, many women suffered from serious side effects, such as headaches, stomachaches and dizziness.","그것을 자주 사용한 후에 많은 여성들이 두통, 복통, 현기증과 같은 심각한 부작용에 시달렸다."],[10,"Regular use of belladonna led to poor vision and sometimes blindness.","벨라도나의 잦은 사용은 나쁜 시력과 때로는 실명으로 이어졌다."]],"w":"6번에서 자주 쓴 후 부작용이 생겼다고 해요. 10번의 regular use도 자주 쓴다는 뜻이라서, 그 결과 시력이 나빠지고 실명까지 이어졌어요.","c":1},"h":"8e6c2a3b28"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAfter using it regularly, many women suffered from serious side effects, such as headaches, stomachaches and dizziness.","ko":"밑줄 친 it가 가리키는 것은?","sko":"그것을 자주 사용한 후에 많은 여성들이 두통, 복통, 현기증과 같은 심각한 부작용에 시달렸다.","opts":["납","얼굴 파우더","창백한 피부","그리스"],"r":{"a":"2) 얼굴 파우더","ev":"5~6번 문장","s":[[5,"To achieve this, they used a face powder that was made from lead, egg whites, and wax.","이것을 이루기 위해 그들은 납, 달걀흰자, 왁스로 만들어진 파우더를 사용했다."],[6,"After using it regularly, many women suffered from serious side effects, such as headaches, stomachaches and dizziness.","그것을 자주 사용한 후에 많은 여성들이 두통, 복통, 현기증과 같은 심각한 부작용에 시달렸다."]],"w":"부작용을 일으킨 것은 직접 쓴 물건이에요. 바로 앞 5번에서 납, 달걀흰자, 왁스로 만든 face powder를 썼다고 했으니, it은 그 파우더예요.","c":2},"h":"7fcc57a57b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Some cosmetics, however, were dangerous or even deadly!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 어떤 화장품은 위험하거나 생명에 치명적이기까지 했다!","opts":["모든 화장품은 아주 안전했다.","일부 화장품은 값이 비싸거나 구하기 어려웠다.","일부 화장품은 위험했지만 목숨을 위협하지는 않았다.","일부 화장품은 위험했고 심지어 목숨을 앗아갈 정도였다."],"r":{"a":"4) 일부 화장품은 위험했고 심지어 목숨을 앗아갈 정도였다.","ev":"2번 문장","s":[[2,"Some cosmetics, however, were dangerous or even deadly!","그러나 어떤 화장품은 위험하거나 생명에 치명적이기까지 했다!"]],"w":"dangerous or even deadly는 위험하거나 심지어 목숨을 앗아갈 정도라는 뜻이에요. even은 더 심한 정도를 덧붙이는 말이라서 목숨을 위협하지 않았다는 말은 틀려요.","c":4},"h":"b4ef529260"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["화장품은 역사 속에서 한 번도 쓰인 적이 없다.","고대 그리스의 파우더는 꽃으로만 만들어졌다.","유럽 여성들은 동공을 더 크게 하려고 벨라도나 즙을 썼다.","벨라도나는 시력을 좋아지게 하는 식물이다."],"opts":["Cosmetics have never been used in history.","The face powder in ancient Greece was made only from flowers.","European women used belladonna juice to make their pupils bigger.","Belladonna is a plant that makes eyesight better."],"r":{"a":"3) European women used belladonna juice to make their pupils bigger.","ev":"1, 5, 9, 10번 문장","s":[[1,"Throughout history, many cultures have used cosmetics.","역사를 통틀어 많은 문화권에서 화장품을 사용해 왔다."],[5,"To achieve this, they used a face powder that was made from lead, egg whites, and wax.","이것을 이루기 위해 그들은 납, 달걀흰자, 왁스로 만들어진 파우더를 사용했다."],[9,"European women used the juice from this plant to make their pupils bigger during the Renaissance period.","르네상스 시대에 유럽 여성들은 동공을 더 크게 만들기 위해 이 식물로부터 나온 즙을 사용했다."],[10,"Regular use of belladonna led to poor vision and sometimes blindness.","벨라도나의 잦은 사용은 나쁜 시력과 때로는 실명으로 이어졌다."]],"w":"9번에서 유럽 여성들은 동공을 더 크게 하려고 즙을 썼어요. 1번 화장품은 오래 쓰였고, 5번 파우더는 납, 달걀흰자, 왁스로 만들어졌으며, 10번 벨라도나는 시력을 나쁘게 했어요.","c":3},"h":"ccfddfc35d"},{"n":9,"t":"sum","q":"In the past, some cosmetics were (A) because they contained poisonous things such as lead and belladonna, but cosmetics are much (B) today.","ko":"과거에 일부 화장품은 납이나 벨라도나 같은 독성 물질이 들어 있어서 (A)했지만, 오늘날 화장품은 훨씬 더 (B)다.","oko":["(A) 값쌌 / (B) 안전하","(A) 안전했 / (B) 위험하","(A) 아름다웠 / (B) 차갑","(A) 인기 있었 / (B) 드물","(A) 위험했 / (B) 안전하"],"opts":["(A) cheap / (B) safer","(A) safe / (B) more dangerous","(A) beautiful / (B) colder","(A) popular / (B) rarer","(A) dangerous / (B) safer"],"r":{"a":"5) (A) dangerous / (B) safer","ev":"2, 3, 8, 11번 문장","s":[[2,"Some cosmetics, however, were dangerous or even deadly!","그러나 어떤 화장품은 위험하거나 생명에 치명적이기까지 했다!"],[3,"Many cosmetics used to contain lead, which is poisonous.","많은 화장품에 납이 들어 있곤 했는데, 그것에는 독성이 있다."],[8,"Another dangerous ingredient was belladonna, a poisonous plant.","또 다른 위험한 (화장품) 재료는 독성 식물인 벨라도나였다."],[11,"Thankfully, cosmetics are much safer today.","다행히 오늘날 화장품은 훨씬 더 안전하다."]],"w":"2번에서 일부 화장품은 dangerous or deadly였고, 3번과 8번에서 납과 벨라도나가 독성 재료예요. 11번에서 오늘날은 훨씬 더 안전하다(safer)고 해요.","c":5},"h":"a6562b0bfd"},{"n":10,"t":"fill","q":"Regular use of belladonna led to poor [A] and sometimes [B].","ko":"벨라도나의 잦은 사용은 나쁜 [A]과 때로는 [B]으로 이어졌다.","bank":["vision","blindness","lead","pupils","powder","wax"],"bko":{"vision":"시력","blindness":"실명","lead":"납","pupils":"동공","powder":"파우더","wax":"왁스"},"r":{"a":"[A] vision, [B] blindness","ev":"10번 문장","s":[[10,"Regular use of belladonna led to poor vision and sometimes blindness.","벨라도나의 잦은 사용은 나쁜 시력과 때로는 실명으로 이어졌다."]],"w":"10번 문장 led to poor vision and sometimes blindness에서 가져왔어요. pupils는 9번에서 즙으로 크게 만드는 눈동자 이야기라 poor 뒤에 쓸 수 없어요.","c":null},"h":"5e43d9d1b2"}]},{"u":8,"id":"nl2-08-3","no":3,"ko":"쓰레기로 만든 옷을 입은 남자","items":[{"n":1,"t":"tf","q":"Robin Greenfield wore real trash for a month.","ko":"Robin Greenfield는 한 달 동안 진짜 쓰레기를 입었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He wore real trash for a month!","한 달 동안 진짜 쓰레기를 입은 것이다!"]],"w":"3번 문장 He wore real trash for a month!가 그대로 나와요.","c":"T"},"h":"1e6c5d099c"},{"n":2,"t":"tf","q":"Greenfield has always been an environmental activist.","ko":"Greenfield는 항상 환경 운동가였다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Greenfield wasn’t always an activist.","Greenfield가 항상 (환경) 운동가였던 것은 아니었다."]],"w":"5번 문장에서 Greenfield wasn't always an activist(항상 운동가였던 것은 아니었다)라고 해요. 항상 운동가였다는 말은 반대예요.","c":"F"},"h":"03888fb986"},{"n":3,"t":"tf","q":"Greenfield hoped that people would think about their waste after seeing him.","ko":"Greenfield는 사람들이 자신을 본 후 자신들이 만드는 쓰레기에 대해 생각하기를 바랐다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"He hoped that people would think about the waste they produce after seeing him.","그는 사람들이 자신을 본 후 그들이 만들어 내는 쓰레기에 대해 생각하기를 바랐다."]],"w":"10번 문장에서 사람들이 자신을 본 후 그들이 만드는 쓰레기에 대해 생각하기를 바랐다고 해요.","c":"T"},"h":"78d996b0d4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (he used a special strategy to get people's attention)","ko":"그는 사람들의 관심을 얻기 위해 특별한 ~을 이용했다.","opts":["우연한 일","특별한 계획, 전략","장난","불평"],"word":"strategy","r":{"a":"2) 특별한 계획, 전략","ev":"2~3번 문장","s":[[2,"One time, he used a special strategy to get people’s attention.","한때 그는 사람들의 관심을 얻기 위해서 특별한 전략을 이용했다."],[3,"He wore real trash for a month!","한 달 동안 진짜 쓰레기를 입은 것이다!"]],"w":"2번에서 관심을 얻으려고 strategy를 썼고, 3번에서 그 내용이 한 달 동안 쓰레기를 입는 거예요. 목적을 이루려고 짠 계획이라서 전략이에요.","c":2},"h":"56dcc2961e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (he realized the seriousness of environmental problems)","ko":"그는 환경 문제의 ~을 깨달았다.","opts":["즐거움","가벼움","새로움","심각성"],"word":"seriousness","r":{"a":"4) 심각성","ev":"7~8번 문장","s":[[7,"But after reading some books and watching some documentaries, he realized the seriousness of environmental problems.","하지만 몇 권의 책을 읽고 다큐멘터리를 보고 난 후 환경 문제의 심각성을 깨달았다."],[8,"He decided to wear trash because most people don’t know how much waste they produce.","그는 대부분의 사람들이 자신이 얼마나 많은 쓰레기를 만들어 내는지 모르기 때문에 쓰레기를 입기로 결심했다."]],"w":"7번에서 책과 다큐멘터리를 본 뒤 환경 문제의 seriousness를 깨달았고, 그래서 8번에서 쓰레기를 입기로 결심해요. 문제가 얼마나 심각한지를 말해요.","c":4},"h":"b175ca7b08"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nHe did this to show how much waste people produce every day.","ko":"밑줄 친 this가 가리키는 것은?","sko":"그는 사람들이 날마다 얼마나 많은 쓰레기를 만들어 내는지 보여 주기 위해 이런 일을 했다.","opts":["한 달 동안 진짜 쓰레기를 입은 것","책을 읽은 것","돈을 버는 것","다큐멘터리를 만든 것"],"r":{"a":"1) 한 달 동안 진짜 쓰레기를 입은 것","ev":"3~4번 문장","s":[[3,"He wore real trash for a month!","한 달 동안 진짜 쓰레기를 입은 것이다!"],[4,"He did this to show how much waste people produce every day.","그는 사람들이 날마다 얼마나 많은 쓰레기를 만들어 내는지 보여 주기 위해 이런 일을 했다."]],"w":"쓰레기가 얼마나 많은지 보여 주려고 한 일은 바로 앞 3번의 쓰레기를 입은 일이에요.","c":1},"h":"a93d9a93b5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He decided to wear trash because most people don't know how much waste they produce.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 대부분의 사람들이 자신이 얼마나 많은 쓰레기를 만들어 내는지 모르기 때문에 쓰레기를 입기로 결심했다.","opts":["그는 사람들이 쓰레기를 너무 잘 알아서 쓰레기를 입기로 했다.","그는 쓰레기 옷이 편해서 입기로 결심했다.","그는 대부분의 사람들이 자신이 만드는 쓰레기의 양을 모르기 때문에 쓰레기를 입기로 결심했다.","그는 쓰레기를 팔아 돈을 벌려고 쓰레기를 입기로 결심했다."],"r":{"a":"3) 그는 대부분의 사람들이 자신이 만드는 쓰레기의 양을 모르기 때문에 쓰레기를 입기로 결심했다.","ev":"8번 문장","s":[[8,"He decided to wear trash because most people don’t know how much waste they produce.","그는 대부분의 사람들이 자신이 얼마나 많은 쓰레기를 만들어 내는지 모르기 때문에 쓰레기를 입기로 결심했다."]],"w":"because 뒤가 이유예요. 대부분의 사람들이 자신이 얼마나 많은 쓰레기를 만들어 내는지 모른다는 것이 이유이고, 편해서나 돈을 벌려고라는 말은 없어요.","c":3},"h":"6726671c33"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Greenfield는 어릴 때부터 환경 운동가였다.","Greenfield는 자신이 한 달 동안 만든 모든 쓰레기를 비닐봉지 옷에 넣었다.","Greenfield는 책을 읽고 다큐멘터리를 본 뒤에도 환경 문제를 가볍게 생각했다.","Greenfield는 작은 변화로는 아무 차이도 만들 수 없다고 말한다."],"opts":["Greenfield was an activist from childhood.","Greenfield added all the trash he made in a month to a suit of plastic bags.","Greenfield thought environmental problems were not serious after reading books and watching documentaries.","Greenfield says small changes cannot make any difference."],"r":{"a":"2) Greenfield added all the trash he made in a month to a suit of plastic bags.","ev":"5, 7, 9, 11번 문장","s":[[5,"Greenfield wasn’t always an activist.","Greenfield가 항상 (환경) 운동가였던 것은 아니었다."],[7,"But after reading some books and watching some documentaries, he realized the seriousness of environmental problems.","하지만 몇 권의 책을 읽고 다큐멘터리를 보고 난 후 환경 문제의 심각성을 깨달았다."],[9,"He made a suit out of plastic bags and then added every piece of trash that he produced for a month.","그는 비닐봉지로 옷을 만들고 나서 한 달 동안 자신이 만들어 낸 모든 쓰레기 조각을 넣었다."],[11,"According to Greenfield, it could make a huge difference if people just make small changes.","Greenfield에 따르면, 사람들이 작은 변화를 만들기만 하면 큰 차이를 가져올 수 있다."]],"w":"9번에서 비닐봉지로 옷을 만들고 한 달 동안 만든 쓰레기를 넣었어요. 5번 처음부터 운동가는 아니었고, 7번에서 환경 문제의 심각성을 깨달았으며, 11번에서 작은 변화도 큰 차이를 만들 수 있다고 해요.","c":2},"h":"b583fd0246"},{"n":9,"t":"sum","q":"Greenfield wore a suit made of his own (A) for a month to make people think about the waste they (B).","ko":"Greenfield는 사람들이 자신이 (B)하는 쓰레기에 대해 생각하게 하려고 한 달 동안 자신의 (A)로 만든 옷을 입었다.","oko":["(A) 책 / (B) 읽","(A) 옷 / (B) 팔","(A) 돈 / (B) 모으","(A) 쓰레기 / (B) 만들어 내","(A) 음식 / (B) 먹"],"opts":["(A) books / (B) read","(A) clothes / (B) sell","(A) money / (B) save","(A) trash / (B) produce","(A) food / (B) eat"],"r":{"a":"4) (A) trash / (B) produce","ev":"3, 4, 9, 10번 문장","s":[[3,"He wore real trash for a month!","한 달 동안 진짜 쓰레기를 입은 것이다!"],[4,"He did this to show how much waste people produce every day.","그는 사람들이 날마다 얼마나 많은 쓰레기를 만들어 내는지 보여 주기 위해 이런 일을 했다."],[9,"He made a suit out of plastic bags and then added every piece of trash that he produced for a month.","그는 비닐봉지로 옷을 만들고 나서 한 달 동안 자신이 만들어 낸 모든 쓰레기 조각을 넣었다."],[10,"He hoped that people would think about the waste they produce after seeing him.","그는 사람들이 자신을 본 후 그들이 만들어 내는 쓰레기에 대해 생각하기를 바랐다."]],"w":"3번과 9번에서 한 달 동안 만든 쓰레기로 옷을 만들어 입었고, 4번과 10번에서 사람들이 만들어 내는(produce) 쓰레기를 생각하게 하려는 거예요.","c":4},"h":"869a604caa"},{"n":10,"t":"fill","q":"According to Greenfield, it could make a huge [A] if people just make [B] changes.","ko":"Greenfield에 따르면, 사람들이 [B] 변화를 만들기만 하면 큰 [A]를 가져올 수 있다.","bank":["difference","small","month","activist","documentary","plastic"],"bko":{"difference":"차이","small":"작은","month":"달, 한 달","activist":"운동가","documentary":"다큐멘터리","plastic":"플라스틱"},"r":{"a":"[A] difference, [B] small","ev":"11번 문장","s":[[11,"According to Greenfield, it could make a huge difference if people just make small changes.","Greenfield에 따르면, 사람들이 작은 변화를 만들기만 하면 큰 차이를 가져올 수 있다."]],"w":"11번 문장 make a huge difference if people just make small changes에서 가져왔어요. 나머지 단어는 이 문장의 뜻(작은 변화가 큰 차이를 만든다)과 맞지 않아요.","c":null},"h":"4d8593b3b0"}]},{"u":8,"id":"nl2-08-4","no":4,"ko":"태풍에도 이름이 있어요","items":[{"n":1,"t":"tf","q":"When a country had two typhoons at the same time, people got confused.","ko":"한 나라에 두 개의 태풍이 동시에 오면, 사람들은 혼란스러워했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When a country had two typhoons at the same time, people got confused.","한 나라에 두 개의 태풍이 동시에 오면, 사람들은 혼란스러워했다."]],"w":"3번 문장에 그대로 나와요. 태풍이 두 개인데 이름이 없으니 어느 태풍인지 알 수 없었어요.","c":"T"},"h":"e83b97d1af"},{"n":2,"t":"tf","q":"At first, forecasters named typhoons after flowers.","ko":"처음에 예보관들은 꽃의 이름을 따서 태풍의 이름을 지었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"At first, they named typhoons after real people.","처음에 그들은 실제 사람의 이름을 따서 태풍의 이름을 지었다."]],"w":"6번 문장에서 처음에는 실제 사람의 이름(real people)을 따서 지었다고 해요. 꽃은 9번 오늘날 이야기에 나와요.","c":"F"},"h":"424ab35344"},{"n":3,"t":"tf","q":"The names for typhoons are used one by one.","ko":"태풍의 이름들은 하나씩 차례로 쓰인다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The names are used one by one.","그 이름들은 하나씩 차례로 쓰인다."]],"w":"11번 문장 The names are used one by one에서 가져온 내용이에요.","c":"T"},"h":"49d2a79470"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (People got confused.)","ko":"사람들은 ~했다.","opts":["혼란스러워했다","즐거워했다","화가 났다","피곤해했다"],"word":"confused","r":{"a":"1) 혼란스러워했다","ev":"3~4번 문장","s":[[3,"When a country had two typhoons at the same time, people got confused.","한 나라에 두 개의 태풍이 동시에 오면, 사람들은 혼란스러워했다."],[4,"They didn’t know which typhoon the forecasters were talking about.","그들은 예보관들이 어떤 태풍에 대해 말하고 있는지 알지 못했다."]],"w":"3~4번에서 태풍이 두 개인데 어느 태풍인지 알지 못했어요. 헷갈린 상태가 confused예요.","c":1},"h":"5f7eb1ff05"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (“Ellen is wandering around the Pacific”)","ko":"\"Ellen이 태평양 주위를 ~고 있습니다.\"","opts":["빠르게 달리","멈춰 서","목적지 없이 떠돌아다니","사라지"],"word":"wandering","r":{"a":"3) 목적지 없이 떠돌아다니","ev":"8번 문장","s":[[8,"This way, they could say things like, “Ellen is wandering around the Pacific,” or “David is becoming weaker and weaker.”","이런 식으로, 그들은 “Ellen이 태평양 주위를 떠돌아다니고 있습니다.”라거나 “David는 점점 더 약해지고 있습니다.”와 같이 말할 수 있었다."]],"w":"8번은 태풍을 사람 이름으로 부르면 이렇게 말할 수 있다는 예예요. 태풍이 태평양 주위를 정해진 목적지 없이 움직이는 모습이라서 wander는 떠돌아다니다예요.","c":3},"h":"45f9eb0d35"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nSometimes, they named them after famous people they didn't like.","ko":"밑줄 친 them가 가리키는 것은?","sko":"때때로 그들은 자신이 좋아하지 않는 유명인들의 이름을 따서 태풍의 이름을 지었다.","opts":["유명인들","태풍들","예보관들","실제 사람들"],"r":{"a":"2) 태풍들","ev":"6~7번 문장","s":[[6,"At first, they named typhoons after real people.","처음에 그들은 실제 사람의 이름을 따서 태풍의 이름을 지었다."],[7,"Sometimes, they named them after famous people they didn’t like.","때때로 그들은 자신이 좋아하지 않는 유명인들의 이름을 따서 태풍의 이름을 지었다."]],"w":"이름을 따서 지어 주는 대상은 이름이 없던 태풍이에요. 6번에서 they named typhoons라고 했고, 7번의 them은 그 typhoons예요.","c":2},"h":"f9e014c5af"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"After all of the names are used, the weather forecasters go back to the first name.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 이름들이 모두 사용된 후에, 일기 예보관들은 첫 번째 이름으로 되돌아간다.","opts":["이름이 모두 사용된 후에 예보관들은 이름 짓기를 멈춘다.","이름이 다 쓰이면 예보관들은 140개의 새 이름을 만든다.","이름이 모두 사용되기 전에 예보관들은 첫 번째 이름으로 돌아간다.","이름이 모두 사용된 후에 예보관들은 첫 번째 이름으로 되돌아간다."],"r":{"a":"4) 이름이 모두 사용된 후에 예보관들은 첫 번째 이름으로 되돌아간다.","ev":"12번 문장","s":[[12,"After all of the names are used, the weather forecasters go back to the first name.","그 이름들이 모두 사용된 후에, 일기 예보관들은 첫 번째 이름으로 되돌아간다."]],"w":"go back to the first name은 첫 번째 이름으로 되돌아간다는 뜻이에요. After all of the names are used는 이름이 모두 사용된 뒤라서 사용되기 전이라는 말은 틀려요.","c":4},"h":"3858fd0633"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["태풍에는 처음부터 항상 이름이 있었다.","태풍의 이름들은 목록에서 하나씩 차례로 쓰인다.","처음에 예보관들은 꽃의 이름으로만 태풍의 이름을 지었다.","이름이 모두 사용되면 예보관들은 태풍 이름 짓기를 멈춘다."],"opts":["Typhoons have always had names.","Typhoon names are used one by one from a list.","At first, forecasters named typhoons only after flowers.","After all the names are used, forecasters stop naming typhoons."],"r":{"a":"2) Typhoon names are used one by one from a list.","ev":"1, 6, 11, 12번 문장","s":[[1,"Until the late 1800s, typhoons were not given names.","1800년대 후반까지, 태풍에 이름이 부여되지 않았다."],[6,"At first, they named typhoons after real people.","처음에 그들은 실제 사람의 이름을 따서 태풍의 이름을 지었다."],[11,"The names are used one by one.","그 이름들은 하나씩 차례로 쓰인다."],[12,"After all of the names are used, the weather forecasters go back to the first name.","그 이름들이 모두 사용된 후에, 일기 예보관들은 첫 번째 이름으로 되돌아간다."]],"w":"11번에서 이름은 목록에서 하나씩 차례로 써요. 1번 처음에는 이름이 없었고, 6번 처음에는 실제 사람 이름을 땄고, 12번 다 쓰면 첫 번째 이름으로 되돌아가요.","c":2},"h":"d886909a05"},{"n":9,"t":"sum","q":"Forecasters needed to give each typhoon a (A) because people got (B) when two typhoons came at the same time.","ko":"두 개의 태풍이 동시에 오면 사람들이 (B)해서 예보관들은 각 태풍에 (A)을 붙여야 했다.","oko":["(A) 가격 / (B) 기뻐","(A) 이름 / (B) 기뻐","(A) 이름 / (B) 피곤해","(A) 번호 / (B) 화가 나","(A) 이름 / (B) 혼란스러워"],"opts":["(A) price / (B) happy","(A) name / (B) happy","(A) name / (B) tired","(A) number / (B) angry","(A) name / (B) confused"],"r":{"a":"5) (A) name / (B) confused","ev":"3~5번 문장","s":[[3,"When a country had two typhoons at the same time, people got confused.","한 나라에 두 개의 태풍이 동시에 오면, 사람들은 혼란스러워했다."],[4,"They didn’t know which typhoon the forecasters were talking about.","그들은 예보관들이 어떤 태풍에 대해 말하고 있는지 알지 못했다."],[5,"So weather forecasters needed to give a name to each typhoon.","그래서 일기 예보관들은 각각의 태풍에 이름을 붙여야 했다."]],"w":"3~4번에서 태풍이 동시에 두 개 오면 사람들이 혼란스러워했고(confused), 5번에서 그래서 각 태풍에 이름(name)을 붙여야 했어요.","c":5},"h":"d382c03824"},{"n":10,"t":"fill","q":"If a typhoon causes a lot of [A], the name is not used [B].","ko":"어떤 태풍이 많은 [A]를 초래하면, 그 이름은 [B] 사용되지 않는다.","bank":["damage","again","names","typhoon","ago","forecasters"],"bko":{"damage":"피해","again":"다시","names":"이름들","typhoon":"태풍","forecasters":"예보관들","ago":"전에"},"r":{"a":"[A] damage, [B] again","ev":"13번 문장","s":[[13,"If a typhoon causes a lot of damage, the name is not used again.","만약 어떤 태풍이 많은 피해를 초래하면 그 이름은 다시 사용되지 않는다."]],"w":"13번 문장 causes a lot of damage, the name is not used again에서 가져왔어요. instead(대신에)는 14번에서 새 이름을 고를 때 쓰는 말이고, 나머지 단어는 [A]나 [B] 자리에 뜻이 통하지 않아요.","c":null},"h":"03ebd356e2"}]},{"u":9,"id":"nl2-09-1","no":1,"ko":"물고기들도 콧구멍이 있다고?","items":[{"n":1,"t":"tf","q":"A fish can smell through openings in its head.","ko":"물고기는 머리에 있는 구멍을 통해 냄새를 맡을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"A fish can smell through two or four openings in its head.","물고기는 머리에 있는 두 개 또는 네 개의 구멍을 통해 냄새를 맡을 수 있다."]],"w":"3번 문장에서 물고기는 머리에 있는 두 개 또는 네 개의 구멍으로 냄새를 맡는다고 해요.","c":"T"},"h":"446493215a"},{"n":2,"t":"tf","q":"Every fish has a weaker sense of smell than humans.","ko":"모든 물고기는 인간보다 후각이 약하다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"In fact, some fish have a sense of smell that is 500 times more powerful than a human’s!","사실 어떤 물고기들은 인간의 후각보다 500배나 더 강력한 후각을 가지고 있다!"]],"w":"5번 문장에서 어떤 물고기들은 인간의 후각보다 500배 더 강력한 후각을 가졌다고 해요. 약하다는 말은 반대예요.","c":"F"},"h":"46ed09fc92"},{"n":3,"t":"tf","q":"The openings called nares work much like our noses.","ko":"콧구멍이라 불리는 그 구멍은 우리의 코와 거의 같은 방식으로 기능한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"These openings, called nares, act much in the same way as our noses do.","콧구멍이라 불리는 이 구멍은 우리의 코가 하는 것과 거의 같은 방식으로 기능한다."]],"w":"4번 문장에서 nares라 불리는 구멍이 우리 코가 하는 것과 거의 같은 방식으로 기능한다고 해요.","c":"T"},"h":"2b64cc2162"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This strong sense of smell helps fish locate food, ...)","ko":"이 강력한 후각은 물고기가 음식의 ~을 돕는다. (locate = ?)","opts":["숨기다","(위치를) 찾아내다","버리다","만들다"],"word":"locate","r":{"a":"2) (위치를) 찾아내다","ev":"6번 문장","s":[[6,"This strong sense of smell helps fish locate food, sense danger, or find their way home.","이 강력한 후각은 물고기가 음식의 위치를 찾고, 위험을 감지하거나, 혹은 집으로 가는 길을 찾는 데 도움을 준다."]],"w":"6번 문장에서 후각이 돕는 일은 음식을 찾고, 위험을 감지하고, 집 가는 길을 찾는 거예요. locate food는 음식의 위치를 찾아내는 거예요.","c":2},"h":"7d07dc02b8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Fish can pick up even very weak smells in the water.)","ko":"물고기는 물속의 매우 희미한 냄새까지도 ~ 수 있다.","opts":["들어 올린다","놓친다","지워 버린다","알아챈다"],"word":"pick up","r":{"a":"4) 알아챈다","ev":"7번 문장","s":[[7,"Fish can pick up even very weak smells in the water.","물고기는 물속의 매우 희미한 냄새까지도 알아챌 수 있다."]],"w":"pick up은 여기서 물건을 드는 게 아니라 냄새를 알아챈다는 뜻이에요. 8번의 상어도 멀리서 피 냄새를 맡아 내요.","c":4},"h":"8a3911a2b2"},{"n":6,"t":"ref","q":"What does the underlined \"These openings\" refer to?\nThese openings, called nares, act much in the same way as our noses do.","ko":"밑줄 친 These openings가 가리키는 것은?","sko":"콧구멍이라 불리는 이 구멍은 우리의 코가 하는 것과 거의 같은 방식으로 기능한다.","opts":["물고기 머리에 있는 두 개 또는 네 개의 구멍","사람의 콧구멍","물속에 생긴 구멍","물고기의 입"],"r":{"a":"1) 물고기 머리에 있는 두 개 또는 네 개의 구멍","ev":"3~4번 문장","s":[[3,"A fish can smell through two or four openings in its head.","물고기는 머리에 있는 두 개 또는 네 개의 구멍을 통해 냄새를 맡을 수 있다."],[4,"These openings, called nares, act much in the same way as our noses do.","콧구멍이라 불리는 이 구멍은 우리의 코가 하는 것과 거의 같은 방식으로 기능한다."]],"w":"3번에서 물고기가 머리의 두 개 또는 네 개의 구멍으로 냄새를 맡는다고 했고, 4번의 These openings가 그 구멍을 다시 가리켜요.","c":1},"h":"2b3ebea67e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The sense of smell is one of a fish's most important abilities.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"후각은 물고기의 가장 중요한 능력 중 하나이다.","opts":["후각은 물고기의 유일한 능력이다.","물고기는 후각보다 시각이 더 중요하다.","후각은 물고기의 가장 중요한 능력 중 하나이다.","후각은 물고기에게 중요하지 않은 능력이다."],"r":{"a":"3) 후각은 물고기의 가장 중요한 능력 중 하나이다.","ev":"9번 문장","s":[[9,"The sense of smell is one of a fish’s most important abilities.","후각은 물고기의 가장 중요한 능력 중 하나이다."]],"w":"one of ~는 '~ 중 하나'예요. 가장 중요한 능력들 중 하나라는 말이라서 유일하다는 말도, 중요하지 않다는 말도 틀려요.","c":3},"h":"af44ec4898"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Fish cannot smell because they have no nose.","A fish's sense of smell helps it find its way home.","All fish have a sense of smell 500 times weaker than humans'.","Sharks can smell blood only when there is a lot of it."],"oko":["물고기는 코가 없어서 냄새를 맡지 못한다.","물고기의 후각은 집으로 가는 길을 찾는 데 도움을 준다.","모든 물고기는 인간보다 500배 약한 후각을 가지고 있다.","상어는 피가 많을 때만 피 냄새를 맡을 수 있다."],"r":{"a":"2) A fish's sense of smell helps it find its way home.","ev":"3번, 5번, 6번, 8번 문장","s":[[3,"A fish can smell through two or four openings in its head.","물고기는 머리에 있는 두 개 또는 네 개의 구멍을 통해 냄새를 맡을 수 있다."],[5,"In fact, some fish have a sense of smell that is 500 times more powerful than a human’s!","사실 어떤 물고기들은 인간의 후각보다 500배나 더 강력한 후각을 가지고 있다!"],[6,"This strong sense of smell helps fish locate food, sense danger, or find their way home.","이 강력한 후각은 물고기가 음식의 위치를 찾고, 위험을 감지하거나, 혹은 집으로 가는 길을 찾는 데 도움을 준다."],[8,"For example, sharks can smell blood from far away, even if there is only one drop of blood in a huge amount of seawater.","예를 들어, 상어는 엄청난 양의 바닷물 속에 단 한 방울의 피가 있더라도, 멀리서 피 냄새를 맡을 수 있다."]],"w":"6번에서 후각이 집으로 가는 길을 찾는 것을 돕는다고 해요. 물고기는 머리의 구멍으로 냄새를 맡고(3번), 일부 물고기는 인간보다 500배 강하고(5번), 상어는 피 한 방울도 맡아요(8번).","c":2},"h":"a04baabd6f"},{"n":9,"t":"sum","q":"Fish can notice very (A) smells. For example, a shark can smell a drop of (B) from far away.","ko":"물고기는 매우 (A) 냄새도 알아챈다. 예를 들어 상어는 멀리서도 한 방울의 (B) 냄새를 맡는다.","opts":["(A) strong / (B) blood","(A) weak / (B) water","(A) sweet / (B) food","(A) bad / (B) salt","(A) weak / (B) blood"],"oko":["(A) 강한 / (B) 피","(A) 희미한 / (B) 물","(A) 달콤한 / (B) 음식","(A) 나쁜 / (B) 소금","(A) 희미한 / (B) 피"],"r":{"a":"5) (A) weak / (B) blood","ev":"7~8번 문장","s":[[7,"Fish can pick up even very weak smells in the water.","물고기는 물속의 매우 희미한 냄새까지도 알아챌 수 있다."],[8,"For example, sharks can smell blood from far away, even if there is only one drop of blood in a huge amount of seawater.","예를 들어, 상어는 엄청난 양의 바닷물 속에 단 한 방울의 피가 있더라도, 멀리서 피 냄새를 맡을 수 있다."]],"w":"7번에서 아주 희미한(weak) 냄새까지 알아챈다고 하고, 8번에서 상어가 피(blood) 한 방울의 냄새를 맡는다고 해요. water는 냄새가 나는 곳일 뿐이에요.","c":5},"h":"45b3d72b5f"},{"n":10,"t":"fill","q":"Some fish have a [A] sense of smell, which helps them find their way [B].","ko":"어떤 물고기는 [A] 후각을 가지고 있어서 [B]으로 가는 길을 찾는 데 도움을 받는다.","bank":["powerful","home","weak","danger","drop","openings"],"bko":{"powerful":"강력한","home":"집","weak":"약한","danger":"위험","drop":"방울","openings":"구멍"},"r":{"a":"[A] powerful, [B] home","ev":"5~6번 문장","s":[[5,"In fact, some fish have a sense of smell that is 500 times more powerful than a human’s!","사실 어떤 물고기들은 인간의 후각보다 500배나 더 강력한 후각을 가지고 있다!"],[6,"This strong sense of smell helps fish locate food, sense danger, or find their way home.","이 강력한 후각은 물고기가 음식의 위치를 찾고, 위험을 감지하거나, 혹은 집으로 가는 길을 찾는 데 도움을 준다."]],"w":"5번에서 어떤 물고기는 인간보다 500배 더 강력한(powerful) 후각을 가지고 있고, 6번에서 그 후각이 집으로 가는 길(their way home)을 찾는 것을 돕는다고 해요. weak는 반대 뜻이에요.","c":null},"h":"46ceaf6b23"}]},{"u":9,"id":"nl2-09-2","no":2,"ko":"이젠 사용 금지!","items":[{"n":1,"t":"tf","q":"An artist and a college professor decided to change a parking sign in Boston.","ko":"보스턴에서 한 예술가와 대학 교수는 주차 표지판을 바꾸기로 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In Boston, an artist and a college professor decided to change the sign for parking spaces for people with disabilities.","보스턴에서 한 예술가와 대학 교수는 장애인을 위한 주차장을 나타내는 표지판을 바꾸기로 결심했다."]],"w":"2번 문장에서 보스턴의 예술가와 대학 교수가 장애인을 위한 주차 표지판을 바꾸기로 결심했다고 해요.","c":"T"},"h":"ff11061ac4"},{"n":2,"t":"tf","q":"They put the new stickers only in New York.","ko":"그들은 새 스티커를 뉴욕에만 붙였다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Then they started putting stickers with the new design all over Boston.","그런 후 그들은 보스턴 전역에 새로운 디자인으로 된 스티커를 붙이기 시작했다."]],"w":"7번 문장에서 스티커는 보스턴 전역(all over Boston)에 붙였다고 해요. 뉴욕은 8번에서 새 이미지를 채택한 도시로 나와요.","c":"F"},"h":"57feb71320"},{"n":3,"t":"tf","q":"Cities such as New York and Hartford officially used the new image.","ko":"뉴욕과 하트퍼드 같은 도시들은 공식적으로 새 이미지를 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Soon, cities such as New York and Hartford officially adopted this image.","곧 뉴욕과 하트퍼드 같은 도시에서 공식적으로 이 이미지를 채택했다."]],"w":"8번 문장에서 뉴욕과 하트퍼드 같은 도시가 공식적으로 이 이미지를 채택했다(adopted)고 해요.","c":"T"},"h":"affd4b350e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They thought the symbol in the old sign was too static.)","ko":"그들은 오래된 표지판 속 상징이 너무 ~하다고 생각했다.","opts":["화려한","정적인","복잡한","오래된"],"word":"static","r":{"a":"2) 정적인","ev":"3번, 6번 문장","s":[[3,"They thought the symbol in the old sign was too static.","그들은 오래된 표지판 속 상징이 너무 정적이라고 생각했다."],[6,"So they created a new design featuring a person in a moving wheelchair.","그래서 그들은 움직이는 휠체어를 탄 사람을 특징으로 하는 새로운 디자인을 만들어 냈다."]],"w":"static은 움직임이 없다는 뜻이에요. 6번에서 새 디자인은 움직이는(moving) 휠체어를 담았다고 해서 static과 반대돼요.","c":2},"h":"23ce226b05"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Soon, cities such as New York and Hartford officially adopted this image.)","ko":"곧 뉴욕과 하트퍼드 같은 도시들이 이 이미지를 공식적으로 ~했다.","opts":["거절했다","만들었다","채택했다","잊었다"],"word":"adopted","r":{"a":"3) 채택했다","ev":"8번 문장","s":[[8,"Soon, cities such as New York and Hartford officially adopted this image.","곧 뉴욕과 하트퍼드 같은 도시에서 공식적으로 이 이미지를 채택했다."]],"w":"8번에서 도시들이 새 표지판 이미지를 공식적으로 받아들여 쓰기 시작한 거예요. 9번에서 이 표지판이 인식을 바꾸길 바랐다고 하니 거절한 게 아니에요. adopt = 채택하다.","c":3},"h":"0e866d9836"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThey believed that it could strengthen the stereotype that people with disabilities are not active.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그들은 그것이 장애인들이 활동적이지 않다는 고정 관념을 강화할 수 있다고 여겼다.","opts":["휠체어","오래된 표지판 속 상징","새 디자인의 스티커","장애인 주차 공간"],"r":{"a":"2) 오래된 표지판 속 상징","ev":"3~4번 문장","s":[[3,"They thought the symbol in the old sign was too static.","그들은 오래된 표지판 속 상징이 너무 정적이라고 생각했다."],[4,"They believed that it could strengthen the stereotype that people with disabilities are not active.","그들은 그것이 장애인들이 활동적이지 않다는 고정 관념을 강화할 수 있다고 여겼다."]],"w":"3번에서 오래된 표지판 속 상징(the symbol in the old sign)이 너무 정적이라고 했고, 4번의 it이 그 상징을 가리켜요.","c":2},"h":"e26e5bebd3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They wanted people to view wheelchairs simply as tools that help people with disabilities.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 사람들이 휠체어를 단순히 장애인을 돕는 도구라고 여기길 바랐다.","opts":["사람들이 휠체어를 단순히 장애인을 돕는 도구로 여기기를 바랐다.","사람들이 휠체어를 직접 타 보기를 바랐다.","장애인들이 휠체어 대신 다른 도구를 쓰기를 바랐다.","휠체어를 더 많이 팔기를 바랐다."],"r":{"a":"1) 사람들이 휠체어를 단순히 장애인을 돕는 도구로 여기기를 바랐다.","ev":"5번 문장","s":[[5,"They wanted people to view wheelchairs simply as tools that help people with disabilities.","그들은 사람들이 휠체어를 단순히 장애인을 돕는 도구라고 여기길 바랐다."]],"w":"view A as B는 A를 B로 여기다예요. 휠체어를 장애인을 돕는 도구로 보길 바랐다는 말이에요.","c":1},"h":"a66c3560f5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["They designed a sign for a school bus.","Only Boston ever used the new image.","The new design shows a person in a moving wheelchair.","They wanted people to see wheelchairs as a problem."],"oko":["그들은 스쿨버스용 표지판을 디자인했다.","보스턴만 새 이미지를 사용했다.","새 디자인은 움직이는 휠체어를 탄 사람을 보여 준다.","그들은 사람들이 휠체어를 문제로 보길 바랐다."],"r":{"a":"3) The new design shows a person in a moving wheelchair.","ev":"2번, 5번, 6번, 8번 문장","s":[[2,"In Boston, an artist and a college professor decided to change the sign for parking spaces for people with disabilities.","보스턴에서 한 예술가와 대학 교수는 장애인을 위한 주차장을 나타내는 표지판을 바꾸기로 결심했다."],[5,"They wanted people to view wheelchairs simply as tools that help people with disabilities.","그들은 사람들이 휠체어를 단순히 장애인을 돕는 도구라고 여기길 바랐다."],[6,"So they created a new design featuring a person in a moving wheelchair.","그래서 그들은 움직이는 휠체어를 탄 사람을 특징으로 하는 새로운 디자인을 만들어 냈다."],[8,"Soon, cities such as New York and Hartford officially adopted this image.","곧 뉴욕과 하트퍼드 같은 도시에서 공식적으로 이 이미지를 채택했다."]],"w":"6번에서 새 디자인은 움직이는 휠체어를 탄 사람을 담았어요. 바꾼 것은 주차 표지판이고(2번), 뉴욕 등 다른 도시도 채택했고(8번), 휠체어는 도구로 보길 바랐어요(5번).","c":3},"h":"a966103e8d"},{"n":9,"t":"sum","q":"The old sign's symbol was too (A), so it could (B) the stereotype that people with disabilities are not active.","ko":"오래된 표지판 속 상징은 너무 (A)해서, 장애인이 활동적이지 않다는 고정 관념을 (B)할 수 있었다.","opts":["(A) active / (B) strengthen","(A) static / (B) weaken","(A) colorful / (B) strengthen","(A) static / (B) strengthen","(A) moving / (B) weaken"],"oko":["(A) 활동적인 / (B) 강화하다","(A) 정적인 / (B) 약하게 하다","(A) 화려한 / (B) 강화하다","(A) 정적인 / (B) 강화하다","(A) 움직이는 / (B) 약하게 하다"],"r":{"a":"4) (A) static / (B) strengthen","ev":"3~4번 문장","s":[[3,"They thought the symbol in the old sign was too static.","그들은 오래된 표지판 속 상징이 너무 정적이라고 생각했다."],[4,"They believed that it could strengthen the stereotype that people with disabilities are not active.","그들은 그것이 장애인들이 활동적이지 않다는 고정 관념을 강화할 수 있다고 여겼다."]],"w":"3번에서 상징이 너무 정적(static)이라고 했고, 4번에서 그것이 고정 관념을 강화할(strengthen) 수 있다고 여겼어요. weaken은 반대 뜻이에요.","c":4},"h":"045c8ee14c"},{"n":10,"t":"fill","q":"They created a new design with a [A] wheelchair, and the cities hoped it would change people's [B].","ko":"그들은 [A] 휠체어를 담은 새 디자인을 만들었고, 도시들은 그것이 사람들의 [B]을 바꾸길 바랐다.","bank":["moving","perceptions","static","stickers","adopted","tools"],"bko":{"moving":"움직이는","perceptions":"인식","static":"정적인","stickers":"스티커","adopted":"채택했다","tools":"도구"},"r":{"a":"[A] moving, [B] perceptions","ev":"6번, 9번 문장","s":[[6,"So they created a new design featuring a person in a moving wheelchair.","그래서 그들은 움직이는 휠체어를 탄 사람을 특징으로 하는 새로운 디자인을 만들어 냈다."],[9,"The cities hoped that the sign would change people’s perceptions of people with disabilities.","이런 도시들은 이 표지판이 장애인에 대한 사람들의 인식을 변화시키길 바랐다."]],"w":"6번에서 새 디자인은 움직이는(moving) 휠체어를 탄 사람이고, 9번에서 도시들은 사람들의 인식(perceptions)이 바뀌길 바랐어요. static은 오래된 상징의 특징이에요.","c":null},"h":"03bc1e1a31"}]},{"u":9,"id":"nl2-09-3","no":3,"ko":"끝이 아닌 새로운 시작을 위해!","items":[{"n":1,"t":"tf","q":"Some children carry their favorite doll or toy everywhere.","ko":"어떤 아이들은 가장 좋아하는 인형이나 장난감을 어디든지 갖고 다닌다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Many children have a favorite doll or toy that they carry everywhere.","많은 아이들이 어디든지 갖고 다니는 가장 좋아하는 인형이나 장난감을 가지고 있다."]],"w":"1번 문장에서 많은 아이들이 어디든지 갖고 다니는 가장 좋아하는 인형이나 장난감이 있다고 해요.","c":"T"},"h":"cc651136ec"},{"n":2,"t":"tf","q":"The workers fixed the children's toys with new toys from a store.","ko":"직원들은 가게에서 산 새 장난감의 부품으로 아이들의 장난감을 고쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Then they fixed the children’s toys with parts from the donated toys.","그런 후 그들은 기부받은 장난감들의 부품으로 아이들의 장난감을 고쳤다."]],"w":"7번 문장에서 기부받은 장난감들의 부품으로 고쳤다고 해요. 가게에서 산 새 장난감이 아니에요.","c":"F"},"h":"5f412abae7"},{"n":3,"t":"tf","q":"The campaign is still going on now.","ko":"그 캠페인은 지금도 계속되고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"The campaign has come to an end now.","이제 캠페인은 종료되었다."]],"w":"12번 문장에서 캠페인은 이제 종료되었다(has come to an end)고 해요.","c":"F"},"h":"dc5ea2e652"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They collected old toys through donations.)","ko":"그들은 ~을 통해 낡은 장난감들을 모았다.","opts":["판매","교환","기부","대여"],"word":"donations","r":{"a":"3) 기부","ev":"6~7번 문장","s":[[6,"They collected old toys through donations.","그들은 기부를 통해 낡은 장난감들을 수집했다."],[7,"Then they fixed the children’s toys with parts from the donated toys.","그런 후 그들은 기부받은 장난감들의 부품으로 아이들의 장난감을 고쳤다."]],"w":"6번에서 낡은 장난감을 모은 방법이 donations예요. 7번에서 그 기부받은 장난감의 부품으로 수리하니 donation은 기부예요.","c":3},"h":"4140a05edb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The campaign also had a more serious purpose.)","ko":"이 캠페인은 또한 더 ~ 목적이 있었다.","opts":["재미있는","진지한","쉬운","새로운"],"word":"serious","r":{"a":"2) 진지한","ev":"8~9번 문장","s":[[8,"The campaign also had a more serious purpose.","이 캠페인은 또한 더 진지한 목적이 있었다."],[9,"Not enough people in Japan donate organs.","일본에는 장기 기증을 하는 사람들이 충분하지 않다."]],"w":"8번 뒤의 9번에서 장기 기증자가 부족하다는 사회 문제를 말해요. 그래서 장난감 수리보다 더 진지한(serious) 목적이에요.","c":2},"h":"a891c62782"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut it gained global attention and succeeded in increasing awareness about the importance of organ donations.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만 그것은 세계적인 주목을 받았고, 장기 기증의 중요성에 대한 의식을 높이는 데 성공했다.","opts":["장난감 부품","도쿄의 두 직원","장기 기증자","그 캠페인"],"r":{"a":"4) 그 캠페인","ev":"12~13번 문장","s":[[12,"The campaign has come to an end now.","이제 캠페인은 종료되었다."],[13,"But it gained global attention and succeeded in increasing awareness about the importance of organ donations.","하지만 그것은 세계적인 주목을 받았고, 장기 기증의 중요성에 대한 의식을 높이는 데 성공했다."]],"w":"12번에서 The campaign이 종료되었다고 하고, 13번의 But it이 그 캠페인을 이어받아요. 주목을 받고 의식을 높이는 데 성공한 것도 캠페인이에요.","c":4},"h":"1fbbd7696e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That's why two workers in Tokyo started a campaign to fix these toys.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 바로 도쿄에서 일하는 두 명의 직원이 이러한 장난감들을 고치기 위해 캠페인을 시작하게 된 이유이다.","opts":["그 때문에 도쿄의 두 직원이 이 장난감들을 고치는 캠페인을 시작했다.","도쿄의 두 직원은 장난감을 고치다가 그 이유를 알게 되었다.","도쿄의 두 직원은 이 장난감들을 고치려고 캠페인을 그만두었다.","그 이유는 도쿄의 두 직원이 장난감을 새로 만들어 팔았기 때문이다."],"r":{"a":"1) 그 때문에 도쿄의 두 직원이 이 장난감들을 고치는 캠페인을 시작했다.","ev":"4~5번 문장","s":[[4,"For a child, this can be very sad.","아이에게 이것은 매우 슬플 수 있다."],[5,"That’s why two workers in Tokyo started a campaign to fix these toys.","그것이 바로 도쿄에서 일하는 두 명의 직원이 이러한 장난감들을 고치기 위해 캠페인을 시작하게 된 이유이다."]],"w":"That's why는 '그것이 ~하는 이유다, 그래서 ~했다'예요. 4번에서 장난감이 망가져 아이가 슬퍼서 그 때문에 수리 캠페인을 시작한 거예요.","c":1},"h":"bc3963aec5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Children's toys never fall apart.","Japan has too many organ donors.","The campaign did not get any attention.","The campaign made more people aware of organ donations."],"oko":["아이들의 장난감은 절대 망가지지 않는다.","일본에는 장기 기증자가 너무 많다.","그 캠페인은 아무런 주목도 받지 못했다.","그 캠페인은 더 많은 사람들이 장기 기증을 알게 했다."],"r":{"a":"4) The campaign made more people aware of organ donations.","ev":"2번, 9번, 13번 문장","s":[[2,"Over time, however, these toys begin to fall apart.","그러나 시간이 지날수록 이 장난감은 너덜너덜해지기 시작한다."],[9,"Not enough people in Japan donate organs.","일본에는 장기 기증을 하는 사람들이 충분하지 않다."],[13,"But it gained global attention and succeeded in increasing awareness about the importance of organ donations.","하지만 그것은 세계적인 주목을 받았고, 장기 기증의 중요성에 대한 의식을 높이는 데 성공했다."]],"w":"13번에서 캠페인이 장기 기증의 중요성에 대한 의식을 높이는 데 성공했다고 해요. 장난감은 시간이 지나면 낡고(2번), 일본은 기증자가 부족하고(9번), 세계적인 주목을 받았어요(13번).","c":4},"h":"048ce83ac1"},{"n":9,"t":"sum","q":"Two workers collected old toys through (A) and used their parts to (B) the children's toys.","ko":"두 직원은 (A)을 통해 낡은 장난감을 모으고 그 부품으로 아이들의 장난감을 (B)했다.","opts":["(A) money / (B) fix","(A) donations / (B) fix","(A) donations / (B) sell","(A) shops / (B) buy","(A) games / (B) break"],"oko":["(A) 돈 / (B) 고치다","(A) 기부 / (B) 고치다","(A) 기부 / (B) 팔다","(A) 가게 / (B) 사다","(A) 게임 / (B) 망가뜨리다"],"r":{"a":"2) (A) donations / (B) fix","ev":"6~7번 문장","s":[[6,"They collected old toys through donations.","그들은 기부를 통해 낡은 장난감들을 수집했다."],[7,"Then they fixed the children’s toys with parts from the donated toys.","그런 후 그들은 기부받은 장난감들의 부품으로 아이들의 장난감을 고쳤다."]],"w":"6번에서 기부(donations)를 통해 낡은 장난감을 모았고, 7번에서 그 부품으로 아이들의 장난감을 고쳤어요(fix).","c":2},"h":"7a7290f16f"},{"n":10,"t":"fill","q":"Not enough people in Japan [A] organs, so the workers hoped to [B] the organ donor rates in their country.","ko":"일본에는 장기를 [A]하는 사람들이 충분하지 않아서, 직원들은 자국의 장기 기증자 비율을 [B]하기를 바랐다.","bank":["donate","increase","collect","fix","carry","lower"],"bko":{"donate":"기증하다","increase":"높이다","collect":"모으다","fix":"고치다","carry":"갖고 다니다","lower":"낮추다"},"r":{"a":"[A] donate, [B] increase","ev":"9번, 11번 문장","s":[[9,"Not enough people in Japan donate organs.","일본에는 장기 기증을 하는 사람들이 충분하지 않다."],[11,"By finding new parts for damaged toys, the workers hoped to increase the organ donor rates in their country.","망가진 장난감을 위한 새 부품을 찾음으로써 두 직원은 자국의 장기 기증자 비율을 높이고 싶어 했다."]],"w":"9번에서 일본에는 장기를 기증하는(donate) 사람이 충분하지 않다고 하고, 11번에서 직원들은 기증자 비율을 높이기(increase) 바랐어요. lower는 반대 뜻이에요.","c":null},"h":"7224d9999c"}]},{"u":9,"id":"nl2-09-4","no":4,"ko":"이상하다, 분명 따뜻했는데?","items":[{"n":1,"t":"tf","q":"The cold and warm spots on your skin sense the outside temperature.","ko":"피부의 냉점과 온점은 외부의 온도를 감지한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"These spots sense the outside temperature and control changes in your skin’s temperature.","이 점들은 외부의 온도를 감지하고 피부의 온도 변화를 조절한다."]],"w":"6번 문장에서 이 점들(These spots)이 외부의 온도를 감지하고 피부의 온도 변화를 조절한다고 해요.","c":"T"},"h":"309bb3142f"},{"n":2,"t":"tf","q":"The average temperature of a person's hands is higher than that of the head.","ko":"사람 손의 평균 온도는 머리의 평균 온도보다 높다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"The average temperature of a person’s hands is 31 degrees Celsius.","사람 손의 평균 온도는 섭씨 31도이다."],[10,"But the average temperature of a person’s head is 36 degrees Celsius.","그러나 사람 머리의 평균 온도는 섭씨 36도이다."]],"w":"9번에서 손은 31도이고 10번에서 머리는 36도예요. 머리가 더 높으니 손이 더 높다는 말은 틀려요.","c":"F"},"h":"e6d711ef6f"},{"n":3,"t":"tf","q":"On a cold day, the gap between the hands and the head gets smaller.","ko":"추운 날에는 손과 머리의 온도 차이가 작아진다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"On a cold day, this gap becomes even bigger because your hands get colder more quickly than your head does.","추운 날에는 손이 머리보다 더 빨리 차가워지기 때문에 이 격차는 훨씬 더 커진다."]],"w":"11번 문장에서 추운 날에는 이 격차가 훨씬 더 커진다(even bigger)고 해요. 작아진다는 말은 반대예요.","c":"F"},"h":"f8300c9a31"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These spots sense the outside temperature ...)","ko":"이 점들은 외부의 온도를 ~한다.","opts":["만든다","감지한다","바꾼다","피한다"],"word":"sense","r":{"a":"2) 감지한다","ev":"5~6번 문장","s":[[5,"It’s because you have cold and warm spots on your skin.","그것은 당신이 피부에 냉점과 온점을 가지고 있기 때문이다."],[6,"These spots sense the outside temperature and control changes in your skin’s temperature.","이 점들은 외부의 온도를 감지하고 피부의 온도 변화를 조절한다."]],"w":"5번에서 피부에 냉점과 온점이 있다고 했고, 6번에서 그 점들이 외부 온도를 알아차려요. sense는 여기서 감지하다예요.","c":2},"h":"fae9820113"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The average temperature of a person's hands is 31 degrees Celsius.)","ko":"사람 손의 ~ 온도는 섭씨 31도이다.","opts":["최고의","평균의","최저의","비슷한"],"word":"average","r":{"a":"2) 평균의","ev":"9~10번 문장","s":[[9,"The average temperature of a person’s hands is 31 degrees Celsius.","사람 손의 평균 온도는 섭씨 31도이다."],[10,"But the average temperature of a person’s head is 36 degrees Celsius.","그러나 사람 머리의 평균 온도는 섭씨 36도이다."]],"w":"9번 손 31도와 10번 머리 36도는 사람들의 보통 온도를 말해요. average는 평균의라는 뜻이에요.","c":2},"h":"6203164e03"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nBecause of this, the temperature difference between your skin and the outside environment is important.","ko":"밑줄 친 this가 가리키는 것은?","sko":"이것 때문에 당신의 피부와 외부 환경 간의 온도 차이가 중요하다.","opts":["손이 물에 닿는 것","머리를 감는 것","물의 온도가 낮아지는 것","점들이 외부 온도를 감지하고 피부 온도 변화를 조절하는 것"],"r":{"a":"4) 점들이 외부 온도를 감지하고 피부 온도 변화를 조절하는 것","ev":"6~7번 문장","s":[[6,"These spots sense the outside temperature and control changes in your skin’s temperature.","이 점들은 외부의 온도를 감지하고 피부의 온도 변화를 조절한다."],[7,"Because of this, the temperature difference between your skin and the outside environment is important.","이것 때문에 당신의 피부와 외부 환경 간의 온도 차이가 중요하다."]],"w":"7번의 this는 바로 앞 6번 문장 내용이에요. 점들이 외부 온도를 감지하고 피부 온도 변화를 조절하기 때문에 피부와 외부의 온도 차이가 중요해요.","c":4},"h":"908652b732"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Depending on your skin's temperature, the same outside temperature can feel either warm or cold.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신의 피부의 온도에 따라 같은 외부 온도도 따뜻하거나 차갑게 느껴질 수 있다.","opts":["피부의 온도에 따라 같은 외부 온도도 따뜻하거나 차갑게 느껴질 수 있다.","외부 온도가 달라지면 피부가 따뜻하거나 차갑게 변한다.","같은 외부 온도는 누구에게나 똑같이 느껴진다.","피부가 따뜻하면 외부 온도는 항상 차갑게 느껴진다."],"r":{"a":"1) 피부의 온도에 따라 같은 외부 온도도 따뜻하거나 차갑게 느껴질 수 있다.","ev":"8번 문장","s":[[8,"Depending on your skin’s temperature, the same outside temperature can feel either warm or cold.","당신의 피부의 온도에 따라 같은 외부 온도도 따뜻하거나 차갑게 느껴질 수 있다."]],"w":"depending on은 ~에 따라예요. 기준은 피부의 온도이고, 같은 외부 온도가 때에 따라 따뜻하게도 차갑게도 느껴질 수 있다는 뜻이에요.","c":1},"h":"31c54c0ea2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Hands and head have the same average temperature.","The skin has no spots that sense temperature.","A person's head is warmer than the hands on average.","Water always feels the same on hands and head."],"oko":["손과 머리의 평균 온도는 같다.","피부에는 온도를 감지하는 점이 없다.","사람의 머리는 평균적으로 손보다 더 따뜻하다.","물은 손과 머리에서 늘 똑같이 느껴진다."],"r":{"a":"3) A person's head is warmer than the hands on average.","ev":"5번, 9번, 10번, 12번 문장","s":[[5,"It’s because you have cold and warm spots on your skin.","그것은 당신이 피부에 냉점과 온점을 가지고 있기 때문이다."],[9,"The average temperature of a person’s hands is 31 degrees Celsius.","사람 손의 평균 온도는 섭씨 31도이다."],[10,"But the average temperature of a person’s head is 36 degrees Celsius.","그러나 사람 머리의 평균 온도는 섭씨 36도이다."],[12,"So, in the winter, the same water can feel cold on your head, but warm on your hands.","그래서 겨울에는 같은 물이라도 머리는 차갑게 느껴질 수 있지만, 손은 따뜻하게 느껴질 수 있는 것이다."]],"w":"9~10번에서 손은 31도, 머리는 36도라서 머리가 평균적으로 더 따뜻해요. 피부에는 냉점·온점이 있고(5번), 같은 물도 손과 머리에서 다르게 느껴져요(12번).","c":3},"h":"f0e1ab6367"},{"n":9,"t":"sum","q":"In the winter, the same water can feel (A) on your hands but (B) on your head.","ko":"겨울에는 같은 물이 손에서는 (A)하게, 머리에서는 (B)하게 느껴질 수 있다.","opts":["(A) cold / (B) warm","(A) warm / (B) warm","(A) cold / (B) cold","(A) hot / (B) cold","(A) warm / (B) cold"],"oko":["(A) 차갑게 / (B) 따뜻하게","(A) 따뜻하게 / (B) 따뜻하게","(A) 차갑게 / (B) 차갑게","(A) 뜨겁게 / (B) 차갑게","(A) 따뜻하게 / (B) 차갑게"],"r":{"a":"5) (A) warm / (B) cold","ev":"2번, 3번, 12번 문장","s":[[2,"When you touch the water with your hand, it feels warm.","손으로 물을 만졌을 때 물이 따뜻하게 느껴진다."],[3,"But when it hits your head, it feels very cold.","그러나 물이 머리에 닿자 매우 차갑게 느껴진다."],[12,"So, in the winter, the same water can feel cold on your head, but warm on your hands.","그래서 겨울에는 같은 물이라도 머리는 차갑게 느껴질 수 있지만, 손은 따뜻하게 느껴질 수 있는 것이다."]],"w":"12번에서 같은 물이 머리에서는 차갑고(cold), 손에서는 따뜻하다(warm)고 해요. 2~3번의 손은 warm, 머리는 cold와도 같아요.","c":5},"h":"6458337486"},{"n":10,"t":"fill","q":"The same water feels different because we have cold and warm [A] on our [B].","ko":"같은 물이 다르게 느껴지는 것은 우리 [B] 위에 차갑고 따뜻한 [A]이 있기 때문이다.","bank":["spots","skin","water","gap","average","environment"],"bko":{"spots":"점, 부위","skin":"피부","water":"물","gap":"격차","average":"평균의","environment":"환경"},"r":{"a":"[A] spots, [B] skin","ev":"4~5번 문장","s":[[4,"Why is this?","왜 이런 것일까?"],[5,"It’s because you have cold and warm spots on your skin.","그것은 당신이 피부에 냉점과 온점을 가지고 있기 때문이다."]],"w":"4번에서 '왜 이런 것일까?'라고 묻고, 5번에서 피부(skin)에 냉점과 온점(cold and warm spots)이 있기 때문이라고 답해요. 물, 격차, 평균의, 환경은 이 빈칸에 들어갈 수 없어요.","c":null},"h":"c402b4b902"}]},{"u":10,"id":"nl2-10-1","no":1,"ko":"다 같은 ‘빨간색’이 아니랍니다","items":[{"n":1,"t":"tf","q":"Pantone's \"color of the year\" influences decisions in the fashion and beauty industries.","ko":"Pantone의 ‘올해의 색상’은 패션과 미용 산업의 결정에 영향을 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Its annual “color of the year” influences many decisions in the fashion and beauty industries.","Pantone이 해마다 선정하는 ‘올해의 색상’은 패션과 미용 산업의 많은 결정들에 영향을 준다."]],"w":"3번 문장에서 Pantone의 올해의 색상이 패션과 미용 산업의 많은 결정에 영향을 준다고 해요.","c":"T"},"h":"e9ed67692f"},{"n":2,"t":"tf","q":"Each color has several different numbers.","ko":"각각의 색상에는 여러 개의 서로 다른 번호가 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Each color has been given its own unique number.","각각의 색상에는 고유의 번호가 부여되어 왔다."]],"w":"6번 문장에서 각각의 색상에는 고유의 번호(its own unique number) 하나가 부여되었다고 해요.","c":"F"},"h":"fdb2d05896"},{"n":3,"t":"tf","q":"Pantone has identified fewer than 2,000 colors.","ko":"Pantone은 2천 가지가 안 되는 색상을 식별했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The company has identified over 2,000 different solid colors.","이 회사는 2천여 가지가 넘는 서로 다른 단색을 식별해 왔다."]],"w":"5번 문장에서 Pantone은 2천여 가지가 넘는(over 2,000) 단색을 식별했다고 해요.","c":"F"},"h":"ad43ce39fc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... a company that designates one special color each year.)","ko":"매년 하나의 특별한 색상을 ~하는 회사","opts":["팔다","지정하다","지우다","섞다"],"word":"designates","r":{"a":"2) 지정하다","ev":"1번, 3번 문장","s":[[1,"Although there are countless different colors, there is a company that designates one special color each year.","수많은 서로 다른 색상이 존재하지만, (그중에서도) 매년 하나의 특별한 색상을 지정하는 한 회사가 있다."],[3,"Its annual “color of the year” influences many decisions in the fashion and beauty industries.","Pantone이 해마다 선정하는 ‘올해의 색상’은 패션과 미용 산업의 많은 결정들에 영향을 준다."]],"w":"1번에서 회사가 해마다 한 가지 특별한 색을 정한다고 하고, 3번에서 그 올해의 색상이 산업에 영향을 줘요. designate는 지정하다예요.","c":2},"h":"8bd2c16436"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Each color has been given its own unique number.)","ko":"각각의 색상에는 ~ 번호가 부여되어 왔다.","opts":["흔한","오래된","고유의","복잡한"],"word":"unique","r":{"a":"3) 고유의","ev":"6번, 9번 문장","s":[[6,"Each color has been given its own unique number.","각각의 색상에는 고유의 번호가 부여되어 왔다."],[9,"This allows everyone to know the exact color they’re talking about.","이것은 그들이 말하고 있는 정확한 색상을 모든 사람이 알게 해 준다."]],"w":"6번에서 색마다 자기만의 번호를 가져요. 그래서 9번처럼 번호만 말해도 정확한 색을 알 수 있어요. unique는 고유의예요.","c":3},"h":"7402f7bdc3"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis allows everyone to know the exact color they're talking about.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 그들이 말하고 있는 정확한 색상을 모든 사람이 알게 해 준다.","opts":["색을 고유 번호로 부르는 것","빨간색을 더 어둡게 만드는 것","인쇄업자가 색을 섞는 것","올해의 색상을 정하는 것"],"r":{"a":"1) 색을 고유 번호로 부르는 것","ev":"8~9번 문장","s":[[8,"For example, instead of calling a color “dark red,” they can call it “19-1664.”","예를 들어, 한 색상을 ‘검붉은색’이라 부르는 대신에 그들은 그것을 ‘19-1664’라고 부를 수 있다."],[9,"This allows everyone to know the exact color they’re talking about.","이것은 그들이 말하고 있는 정확한 색상을 모든 사람이 알게 해 준다."]],"w":"8번에서 '검붉은색' 대신 번호 '19-1664'로 부를 수 있다고 하고, 9번의 This가 그 내용을 받아요. 그래서 모든 사람이 정확한 색을 알게 돼요.","c":1},"h":"3fb610b20f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Pantone is also known for its color matching system.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Pantone은 또한 색상을 매칭해 주는 시스템으로 알려져 있다.","opts":["Pantone은 색상을 사고파는 회사로 알려져 있다.","Pantone은 색상 이름을 바꾸는 것으로 알려져 있다.","Pantone은 색상 디자이너를 가르치는 것으로 알려져 있다.","Pantone은 또한 색상을 매칭해 주는 시스템으로 알려져 있다."],"r":{"a":"4) Pantone은 또한 색상을 매칭해 주는 시스템으로 알려져 있다.","ev":"3~4번 문장","s":[[3,"Its annual “color of the year” influences many decisions in the fashion and beauty industries.","Pantone이 해마다 선정하는 ‘올해의 색상’은 패션과 미용 산업의 많은 결정들에 영향을 준다."],[4,"Pantone is also known for its color matching system.","Pantone은 또한 색상을 매칭해 주는 시스템으로 알려져 있다."]],"w":"be known for는 ~로 알려져 있다예요. 3번의 올해의 색상에 더해(also) 색상 매칭 시스템으로도 알려져 있다는 뜻이에요.","c":4},"h":"4feae509b1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Pantone chooses a special color every month.","Pantone's system helps everyone know exactly which color is being talked about.","Only fashion designers use Pantone's system.","Pantone gives the same number to many colors."],"oko":["Pantone은 매달 특별한 색상을 정한다.","Pantone의 시스템은 모든 사람이 어떤 색을 말하는지 정확히 알게 도와준다.","패션 디자이너만 Pantone의 시스템을 사용한다.","Pantone은 많은 색상에 같은 번호를 부여한다."],"r":{"a":"2) Pantone's system helps everyone know exactly which color is being talked about.","ev":"1번, 6번, 7번, 9번 문장","s":[[1,"Although there are countless different colors, there is a company that designates one special color each year.","수많은 서로 다른 색상이 존재하지만, (그중에서도) 매년 하나의 특별한 색상을 지정하는 한 회사가 있다."],[6,"Each color has been given its own unique number.","각각의 색상에는 고유의 번호가 부여되어 왔다."],[7,"This system is very helpful for cosmetics companies, fashion designers, web designers, printers, and other professionals.","이 시스템은 화장품 회사, 패션 디자이너, 웹 디자이너, 인쇄업자 및 다른 전문가들에게 매우 도움이 된다."],[9,"This allows everyone to know the exact color they’re talking about.","이것은 그들이 말하고 있는 정확한 색상을 모든 사람이 알게 해 준다."]],"w":"9번에서 시스템 덕분에 모든 사람이 말하고 있는 정확한 색을 안다고 해요. 특별한 색은 매년(each year) 정하고(1번), 색마다 고유 번호가 있고(6번), 패션 디자이너 말고 다른 전문가도 쓰니(7번) 나머지는 틀려요.","c":2},"h":"c5a0d58445"},{"n":9,"t":"sum","q":"Pantone has identified over 2,000 different (A) colors and given each color its own (B).","ko":"Pantone은 2천여 가지가 넘는 서로 다른 (A) 색상을 식별해 각각에 고유의 (B)을 부여했다.","opts":["(A) solid / (B) name","(A) dark / (B) number","(A) unique / (B) price","(A) bright / (B) name","(A) solid / (B) number"],"oko":["(A) 단색 / (B) 이름","(A) 어두운 / (B) 번호","(A) 고유의 / (B) 가격","(A) 밝은 / (B) 이름","(A) 단색 / (B) 번호"],"r":{"a":"5) (A) solid / (B) number","ev":"5~6번 문장","s":[[5,"The company has identified over 2,000 different solid colors.","이 회사는 2천여 가지가 넘는 서로 다른 단색을 식별해 왔다."],[6,"Each color has been given its own unique number.","각각의 색상에는 고유의 번호가 부여되어 왔다."]],"w":"5번에서 2천여 가지가 넘는 단색(solid colors)을 식별했고, 6번에서 각 색에 고유 번호(number)를 부여했어요. 이름이 아니라 번호예요.","c":5},"h":"285bbf544a"},{"n":10,"t":"fill","q":"Instead of calling a color \"dark red,\" they can call it by its [A], so everyone can know the [B] color they're talking about.","ko":"‘검붉은색’이라 부르는 대신 그 색의 [A](으)로 부를 수 있어서, 모든 사람이 말하고 있는 [B] 색상을 알 수 있다.","bank":["number","exact","countless","annual","fashion","global"],"bko":{"number":"번호","exact":"정확한","countless":"셀 수 없이 많은","annual":"매년의","fashion":"패션","global":"세계적인"},"r":{"a":"[A] number, [B] exact","ev":"8~9번 문장","s":[[8,"For example, instead of calling a color “dark red,” they can call it “19-1664.”","예를 들어, 한 색상을 ‘검붉은색’이라 부르는 대신에 그들은 그것을 ‘19-1664’라고 부를 수 있다."],[9,"This allows everyone to know the exact color they’re talking about.","이것은 그들이 말하고 있는 정확한 색상을 모든 사람이 알게 해 준다."]],"w":"8번에 e air.","화산이 폭발하면 공기 중으로 재를 내뿜는다."]],"w":"2번에서 화산이 폭발하면 재를 공기 중으로 내뿜어요. erupt는 화산이 분출하다, 폭발하다예요.","c":3},"h":"ff6a0ca102"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The nutrients found in ash improve the quality of the soil ...)","ko":"재에서 발견되는 ~은 토질을 향상시킨다.","opts":["소음","영양분","온도","그림자"],"word":"nutrients","r":{"a":"2) 영양분","ev":"4번 문장","s":[[4,"The nutrients found in ash improve the quality of the soil and help plants grow.","재에서 발견되는 영양분은 토질을 향상시키고 식물이 자라도록 돕는다."]],"w":"4번에서 재 속의 nutrients가 토질을 좋게 하고 식물이 자라도록 도와요. 그래서 영양분이에요.","c":2},"h":"e4d752dd2f"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen the heat is below ground, it helps to create hot springs.","ko":"밑줄 친 it이 가리키는 것은?","sko":"열이 지면 아래에 있으면, 온천이 만들어지는 데 도움이 된다.","opts":["화산","온천","열","재"],"r":{"a":"3) 열","ev":"6~7번 문장","s":[[6,"Another benefit of volcanoes is that they produce a lot of heat and energy.","화산의 또 다른 이점은 화산이 많은 열과 에너지를 생산한다는 것이다."],[7,"When the heat is below ground, it helps to create hot springs.","열이 지면 아래에 있으면, 온천이 만들어지는 데 도움이 된다."]],"w":"7번에서 When the heat is below ground라고 하고, 쉼표 뒤의 it이 그 the heat를 가리켜요. 열이 지면 아래에 있으면 온천이 만들어지는 데 도움이 돼요.","c":3},"h":"022db3b523"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Volcanoes make it possible for us to live on Earth!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"화산은 우리가 지구에 사는 것을 가능하게 해 준다!","opts":["화산은 우리가 지구를 떠나게 만든다.","화산 때문에 우리는 지구에서 살기 어렵다.","우리는 화산 위에서만 살 수 있다.","화산은 우리가 지구에서 사는 것을 가능하게 해 준다."],"r":{"a":"4) 화산은 우리가 지구에서 사는 것을 가능하게 해 준다.","ev":"9~10번 문장","s":[[9,"The most important benefit of all is that volcanoes have produced most of the Earth’s air and water.","이 모든 것 중 가장 중요한 이점은 화산이 지구의 공기와 물의 대부분을 만들어 왔다는 것이다."],[10,"Volcanoes make it possible for us to live on Earth!","화산은 우리가 지구에 사는 것을 가능하게 해 준다!"]],"w":"make it possible for A to-v는 A가 ~하는 것을 가능하게 한다는 뜻이에요. 9번에서 화산이 공기와 물의 대부분을 만들었기 때문이에요.","c":4},"h":"74ec58840c"},{"n":8,"t":"match","q":"Which is the same as the uce a lot of heat and [A], and many countries have begun to use it to make [B].","ko":"화산은 많은 열과 [A]을(를) 만들어 내고, 많은 나라가 그것을 이용해 [B]을(를) 만들기 시작했다.","bank":["energy","electricity","ash","farmers","quality","plants"],"bko":{"energy":"에너지","electricity":"전기","ash":"재","farmers":"농부들","quality":"질","plants":"식물"},"r":{"a":"[A] energy, [B] electricity","ev":"6번, 8번 문장","s":[[6,"Another benefit of volcanoes is that they produce a lot of heat and energy.","화산의 또 다른 이점은 화산이 많은 열과 에너지를 생산한다는 것이다."],[8,"What’s more, many countries around the world have even begun to use volcanic energy to make electricity.","게다가 세계의 많은 나라들이 심지어 전기를 만들기 위해 화산 에너지를 사용하기 시작했다."]],"w":"6번에서 화산은 많은 열과 에너지(energy)를 생산하고, 8번에서 많은 나라가 그 화산 에너지로 전기(electricity)를 만들기 시작했다고 해요.","c":null},"h":"61f52b9ad9"}]},{"u":10,"id":"nl2-10-4","no":4,"ko":"전기차, Yes or No","items":[{"n":1,"t":"tf","q":"The writer says an electric car can be charged at home overnight.","ko":"글쓴이는 전기차를 집에서 하룻밤 동안 충전할 수 있다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"You can just charge the car at your home overnight, and it will be ready in the morning.","집에서 하룻밤만 충전하면 아침에는 (달릴) 준비가 될 겁니다."]],"w":"8번 문장에서 집에서 하룻밤만 충전하면 아침에는 준비가 된다고 해요.","c":"T"},"h":"fadfae5622"},{"n":2,"t":"tf","q":"Suzie wants to buy an electric car.","ko":"수지는 전기차를 사고 싶어 한다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"I want her to buy an electric car, but she doesn’t want to.","저는 누나가 전기차를 사면 좋겠는데, 누나는 원하지 않아요."]],"w":"2번 문장에서 글쓴이는 누나가 전기차를 사면 좋겠지만 누나는 원하지 않는다(she doesn't want to)고 해요.","c":"F"},"h":"5edd6795d7"},{"n":3,"t":"tf","q":"It takes only a few minutes to add 40 to 45 miles' worth of electricity to an electric car.","ko":"전기차에 40~45마일 어치의 전기를 넣는 데는 몇 분밖에 걸리지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"15번 문장","s":[[15,"It takes about an hour to add 40 to 45 miles’ worth of electricity to an electric car.","전기차에 40~45마일 어치의 전기를 넣는 데 약 한 시간이나 걸려요."]],"w":"15번 문장에서 40~45마일 어치의 전기를 넣는 데 약 한 시간이 걸린다고 해요. 몇 분이 걸리는 건 16번의 휘발유 자동차 주유예요.","c":"F"},"h":"616745f6fb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Suzie: In my opinion, electric cars are inconvenient.)","ko":"수지: 내 생각에 전기차는 ~해요.","opts":["편리한","불편한","저렴한","조용한"],"word":"inconvenient","r":{"a":"2) 불편한","ev":"11~12번 문장","s":[[11,"Suzie: In my opinion, electric cars are inconvenient.","제가 생각하기에 전기차는 불편해요."],[12,"Compared to gas stations, there aren’t many charging stations available.","주유소와 비교하면 이용 가능한 충전소가 많이 없어요."]],"w":"수지는 11번에서 전기차가 inconvenient하다고 하고, 12번에서 충전소가 많지 않다고 이유를 들어요. 그래서 inconvenient는 불편한이에요. 편리한(convenient)과 반대예요.","c":2},"h":"d820a9e046"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Compared to gas stations, there aren't many charging stations available.)","ko":"주유소와 비교하면 ~ 충전소가 많지 않다.","opts":["이용 가능한","위험한","오래된","비싼"],"word":"available","r":{"a":"1) 이용 가능한","ev":"12~13번 문장","s":[[12,"Compared to gas stations, there aren’t many charging stations available.","주유소와 비교하면 이용 가능한 충전소가 많이 없어요."],[13,"So that might be a problem when I go on road trips.","그래서 장거리 자동차 여행을 할 때 그것이 문제가 될 수도 있어요."]],"w":"12번에서 충전소가 많지 않다고 하고, 13번에서 장거리 여행을 할 때 문제가 될 수 있다고 해요. 그래서 available은 이용할 수 있는이에요.","c":1},"h":"9e8d1366e0"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nSo that might be a problem when I go on road trips.","ko":"밑줄 친 that이 가리키는 것은?","sko":"그래서 장거리 자동차 여행을 할 때 그것이 문제가 될 수도 있어요.","opts":["주유소가 많다는 것","이용 가능한 충전소가 많지 않다는 것","전기차가 소음이 적다는 것","여행을 자주 간다는 것"],"r":{"a":"2) 이용 가능한 충전소가 많지 않다는 것","ev":"12~13번 문장","s":[[12,"Compared to gas stations, there aren’t many charging stations available.","주유소와 비교하면 이용 가능한 충전소가 많이 없어요."],[13,"So that might be a problem when I go on road trips.","그래서 장거리 자동차 여행을 할 때 그것이 문제가 될 수도 있어요."]],"w":"13번의 that은 바로 앞 12번(주유소에 비해 이용 가능한 충전소가 많지 않다)이에요. 그래서 장거리 여행에서 문제가 될 수 있어요.","c":2},"h":"b78357759f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you have an electric car, you don't need to go to a gas station.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 전기차를 갖고 있다면 주유소에 갈 필요도 없어요.","opts":["전기차가 있으면 주유소에 꼭 가야 한다.","주유소에 가면 전기차를 살 수 있다.","전기차가 있으면 주유소에 갈 필요가 없다.","전기차가 있어도 주유소에서 충전해야 한다."],"r":{"a":"3) 전기차가 있으면 주유소에 갈 필요가 없다.","ev":"7~8번 문장","s":[[7,"If you have an electric car, you don’t need to go to a gas station.","당신이 전기차를 갖고 있다면 주유소에 갈 필요도 없어요."],[8,"You can just charge the car at your home overnight, and it will be ready in the morning.","집에서 하룻밤만 충전하면 아침에는 (달릴) 준비가 될 겁니다."]],"w":"don't need to ~는 ~할 필요가 없다는 뜻이에요. 8번에서 집에서 하룻밤 충전하면 된다고 이어져요.","c":3},"h":"ba1d623b28"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Electric cars make more noise than gas-powered cars.","Electric cars pollute the air like gas-powered cars.","There are more charging stations than gas stations.","A gas-powered car only takes a few minutes to fill up its tank."],"oko":["전기차는 휘발유 자동차보다 소음을 더 많이 낸다.","전기차는 휘발유 자동차처럼 공기를 오염시킨다.","충전소가 주유소보다 더 많다.","휘발유 자동차는 연료통을 채우는 데 몇 분밖에 걸리지 않는다."],"r":{"a":"4) A gas-powered car only takes a few minutes to fill up its tank.","ev":"5번, 10번, 12번, 16번 문장","s":[[5,"They also don’t make as much noise as gas-powered cars.","또한 휘발유 자동차만큼 소음을 많이 내지도 않아요."],[10,"Unlike gas-powered cars, electric cars don’t pollute the air.","휘발유 자동차와 달리 전기차는 공기를 오염시키지 않아요."],[12,"Compared to gas stations, there aren’t many charging stations available.","주유소와 비교하면 이용 가능한 충전소가 많이 없어요."],[16,"However, with a gas-powered car, it only takes a few minutes to fill up the tank.","하지만 휘발유 자동차로는 연료통을 가득 채우는 데 단 몇 분밖에 걸리지 않아요."]],"w":"16번에서 휘발유 자동차는 연료통을 가득 채우는 데 몇 분밖에 안 걸린다고 해요. 전기차는 소음이 적고(5번), 공기를 오염시키지 않고(10번), 충전소는 주유소보다 적어요(12번).","c":4},"h":"36754e1517"},{"n":9,"t":"sum","q":"The writer says electric cars drive (A) and make less (B) than gas-powered cars.","ko":"글쓴이는 전기차가 (A) 달리고 휘발유 자동차보다 (B)을 덜 낸다고 말한다.","opts":["(A) slowly / (B) noise","(A) smoothly / (B) money","(A) quickly / (B) heat","(A) loudly / (B) noise","(A) smoothly / (B) noise"],"oko":["(A) 느리게 / (B) 소음","(A) 부드럽게 / (B) 돈","(A) 빠르게 / (B) 열","(A) 시끄럽게 / (B) 소음","(A) 부드럽게 / (B) 소음"],"r":{"a":"5) (A) smoothly / (B) noise","ev":"4~5번 문장","s":[[4,"Me: Electric cars drive smoothly.","전기차는 부드럽게 가요."],[5,"They also don’t make as much noise as gas-powered cars.","또한 휘발유 자동차만큼 소음을 많이 내지도 않아요."]],"w":"4번에서 전기차는 부드럽게(smoothly) 달리고, 5번에서 휘발유 자동차만큼 소음(noise)을 많이 내지 않는다고 해요.","c":5},"h":"c7e314926d"},{"n":10,"t":"fill","q":"Unlike gas-powered cars, electric cars don't [A] the air, so they are better for the [B].","ko":"휘발유 자동차와 달리 전기차는 공기를 [A]하지 않아서 [B]에 더 이롭다.","bank":["pollute","environment","charge","tank","hour","road"],"bko":{"pollute":"오염시키다","environment":"환경","charge":"충전하다","tank":"연료통","hour":"시간","road":"도로"},"r":{"a":"[A] pollute, [B] environment","ev":"9~10번 문장","s":[[9,"They are also much better for the environment.","전기차는 또한 환경에 훨씬 이로워요."],[10,"Unlike gas-powered cars, electric cars don’t pollute the air.","휘발유 자동차와 달리 전기차는 공기를 오염시키지 않아요."]],"w":"10번에서 전기차는 휘발유 자동차와 달리 공기를 오염시키지(pollute) 않는다고 하고, 9번에서 그래서 환경(environment)에 훨씬 이롭다고 해요. 충전하다, 연료통, 시간, 도로는 이 빈칸에 맞지 않아요.","c":null},"h":"342d071dc0"}]}];

function units(){var u=document.getElementById("units");u.innerHTML="";UNITS.forEach(function(i){var b=el("button","ub","Section "+i);b.setAttribute("aria-pressed",String(i===unit));b.onclick=function(){unit=i;cur=null;units();tabs();view()};u.appendChild(b)})}

function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
