/ 수업의 일부분을 완전히 이해하지 못했기 때문에","nat":"그녀는 수업의 일부 내용을 완전히 이해하지 못해서 복습 시간에 손을 들었다."},{"id":"35-4","n":4,"en":"They raised money for the sick children / after a news report showed / how they were living without any care.","ko":"그들은 아픈 아이들을 위해 돈을 모금했다 / 뉴스 보도가 보여준 후에 / 그들이 어떤 돌봄도 없이 살고 있는지를","nat":"그들은 한 뉴스 보도가 아픈 아이들이 아무런 보살핌 없이 살고 있는 모습을 보여 준 뒤 그 아이들을 위해 모금을 했다."},{"id":"35-5","n":5,"en":"While some people prefer dogs, / others choose to raise cats / because they are more independent / and easier to take care of.","ko":"어떤 사람들은 개를 선호하는 반면, / 다른 사람들은 고양이를 기르기를 선택한다 / 그들이 더 독립적이기 때문에 / 그리고 돌보기 더 쉽기 때문에","nat":"어떤 사람들은 개를 좋아하지만, 다른 사람들은 고양이가 더 독립적이고 돌보기 쉬워서 고양이를 기르기로 한다."},{"id":"35-6","n":6,"en":"I put my phone into my backpack / before leaving / because I often forget things / when I'm in a hurry.","ko":"나는 핸드폰을 배낭에 넣었다 / 떠나기 전에 / 내가 종종 물건들을 잊어버리기 때문에 / 내가 급할 때","nat":"나는 서두를 때 물건을 자주 잊어버려서 나가기 전에 휴대폰을 가방에 넣었다."},{"id":"35-7","n":7,"en":"Before going home, / every student puts all the trash into the bin / so that the classroom will stay neat / and ready for the next day.","ko":"집에 가기 전에, / 모든 학생들은 모든 쓰레기를 쓰레기통에 넣는다 / 교실이 깔끔하게 유지되도록 / 그리고 다음날을 위해 준비되도록","nat":"집에 가기 전에 모든 학생은 교실이 깔끔하고 다음 날을 맞을 준비가 된 상태로 유지되도록 쓰레기를 모두 쓰레기통에 넣는다."}]},{"d":36,"s":[{"id":"36-1","n":1,"en":"Can you account for / how the window got broken / even though no one was around?","ko":"너는 설명할 수 있니 / 창문이 어떻게 깨졌는지를 / 아무도 주변에 없었는데도","nat":"아무도 주변에 없었는데 창문이 어떻게 깨졌는지 설명할 수 있니?"},{"id":"36-2","n":2,"en":"As group projects account for 40% of the final grade, / students should divide the work / and try their best.","ko":"조별 과제가 기말 성적의 40%를 차지하므로, / 학생들은 작업을 나누어야 한다 / 그리고 최선을 다해야 한다","nat":"조별 과제가 최종 성적의 40퍼센트를 차지하므로 학생들은 일을 나누고 최선을 다해야 한다."},{"id":"36-3","n":3,"en":"She didn't account for / how long the reading part would take / because she thought it would be easy.","ko":"그녀는 고려하지 않았다 / 읽기 부분이 얼마나 오래 걸릴지를 / 그것이 쉬울 것이라고 생각했기 때문에","nat":"그녀는 읽기 부분이 쉬울 것이라고 생각해서 그것이 얼마나 오래 걸릴지 고려하지 않았다."},{"id":"36-4","n":4,"en":"You need to take into account the weather / before hiking / because you might need to change your plan.","ko":"너는 날씨를 고려해야 한다 / 등산하기 전에 / 네가 계획을 바꿔야 할 수도 있기 때문에","nat":"계획을 바꿔야 할 수도 있으니 등산하기 전에 날씨를 고려해야 한다."},{"id":"36-5","n":5,"en":"He is used to walking to school every day, / even when the weather is bad, / since he doesn't like crowded buses in the morning.","ko":"그는 매일 학교까지 걷는 것에 익숙하다, / 날씨가 나쁠 때도, / 그가 아침에 붐비는 버스를 좋아하지 않기 때문에","nat":"그는 아침에 붐비는 버스를 좋아하지 않아서 날씨가 나쁠 때조차 매일 학교까지 걷는 데 익숙하다."},{"id":"36-6","n":6,"en":"They are used to going to the library before exams, / because studying at home / often makes them sleepy.","ko":"그들은 시험 전에 도서관에 가는 것에 익숙하다, / 집에서 공부하는 것이 / 종종 그들을 졸리게 만들기 때문에","nat":"그들은 집에서 공부하면 졸릴 때가 많아서 시험 전에 도서관에 가는 것에 익숙하다."},{"id":"36-7","n":7,"en":"The app is used to train students / to choose the right word in a short time.","ko":"그 앱은 학생들을 훈련시키는데 사용된다 / 짧은 시간에 올바른 단어를 선택하도록","nat":"그 앱은 학생들이 짧은 시간에 알맞은 단어를 고르도록 훈련시키는 데 쓰인다."}]},{"d":37,"s":[{"id":"37-1","n":1,"en":"She inquired / if she could get a refund / in case the train was delayed.","ko":"그녀는 문의했다 / 그녀가 환불을 받을 수 있는지를 / 기차가 연착되는 경우에","nat":"그녀는 기차가 연착될 경우 환불을 받을 수 있는지 문의했다."},{"id":"37-2","n":2,"en":"They inquired / if they could reserve a study room in the library / to work on their group project together.","ko":"그들은 문의했다 / 도서관에서 스터디룸을 예약할 수 있는지를 / 조별 과제를 함께 하기 위해","nat":"그들은 조별 과제를 함께 하기 위해 도서관 스터디룸을 예약할 수 있는지 문의했다."},{"id":"37-3","n":3,"en":"The program requires even more technical computer skills / than we first expected.","ko":"그 프로그램은 훨씬 더 많은 기술적 컴퓨터 기술을 요구한다 / 우리가 처음 예상했던 것보다","nat":"그 프로그램은 우리가 처음에 예상했던 것보다 훨씬 더 전문적인 컴퓨터 기술을 요구한다."},{"id":"37-4","n":4,"en":"Compared to older versions, / the current system requires users / to follow more detailed password rules.","ko":"이전 버전들과 비교했을 때, / 현재 시스템은 사용자들에게 요구한다 / 더 자세한 비밀번호 규칙을 따르도록","nat":"이전 버전들과 비교하면 현재의 시스템은 사용자들에게 더 상세한 비밀번호 규칙을 따르도록 요구한다."},{"id":"37-5","n":5,"en":"The banana, left in the fridge for days, / turned completely black / and became too soft to eat.","ko":"그 바나나는, 며칠 동안 냉장고에 방치된, / 완전히 검게 변했다 / 그리고 먹기에 지나치게 부드러워졌다","nat":"냉장고에 며칠 동안 놓아둔 바나나는 완전히 까맣게 변하고 먹기에는 너무 물러졌다."},{"id":"37-6","n":6,"en":"By turning a simple plastic bottle into a flower vase, / she made her desk look more colorful and fresh.","ko":"간단한 플라스틱 병을 꽃병으로 바꿈으로써, / 그녀는 자신의 책상을 더 화려하고 생기있게 보이게 만들었다","nat":"그녀는 평범한 플라스틱 병을 꽃병으로 바꿔서 책상이 더 다채롭고 산뜻해 보이게 만들었다."},{"id":"37-7","n":7,"en":"I turned the living room into a quiet reading space / so that I could make reading / a part of my daily routine.","ko":"나는 거실을 조용한 독서 공간으로 바꿨다 / 내가 독서를 만들 수 있도록 / 나의 일상 생활 습관의 일부로","nat":"나는 독서를 일상의 일부로 만들 수 있도록 거실을 조용한 독서 공간으로 바꿨다."}]},{"d":38,"s":[{"id":"38-1","n":1,"en":"Although both books are about history, / this one reads more easily, / using storytelling / to help readers understand better.","ko":"두 책 모두 역사에 관한 것이지만, / 이 책이 더 쉽게 읽힌다, / 스토리텔링을 사용하여 / 독자들이 더 잘 이해할 수 있도록 돕기 위해","nat":"두 책 모두 역사에 관한 것이지만, 이 책은 독자들이 더 잘 이해하도록 이야기 방식을 활용해서 더 쉽게 읽힌다."},{"id":"38-2","n":2,"en":"The sign reads, “Do not enter,” / and it tells people / not to go past the gate.","ko":"그 표지판은 “출입금지”라고 적혀있다, / 그리고 그것은 사람들에게 말한다 / 문을 지나가지 말라고","nat":"그 표지판에는 \"들어가지 마라\"라고 쓰여 있고, 사람들에게 문을 지나가지 말라고 알려 준다."},{"id":"38-3","n":3,"en":"Despite leaving home later than usual, / he was able to reach the bus stop just in time / by taking a shortcut.","ko":"평소보다 늦게 집을 나섰음에도 불구하고, / 그는 버스 정류장에 딱 맞춰 도착할 수 있었다 / 지름길을 택함으로써","nat":"그는 평소보다 늦게 집을 나섰지만 지름길로 가서 제시간에 버스 정류장에 도착할 수 있었다."},{"id":"38-4","n":4,"en":"Although the path was steep, / she reached the summit before sunrise, / which allowed her / to capture the beauty of the morning sky.","ko":"길이 가팔랐지만, / 그녀는 일출 전에 정상에 도달했다, / 그리고 이것은 그녀가 할 수 있게 해주었다 / 아침 하늘의 아름다움을 포착하는 것을","nat":"길이 가팔랐지만 그녀는 해가 뜨기 전에 정상에 도착했고, 덕분에 아침 하늘의 아름다움을 담을 수 있었다."},{"id":"38-5","n":5,"en":"They finally arrived at the hotel / after getting lost, / so they decided to stay in / to rest and recharge.","ko":"그들은 마침내 호텔에 도착했다 / 길을 잃은 후에, / 그래서 그들은 안에 머물기로 결정했다 / 쉬고 재충전하기 위해","nat":"그들은 길을 잃은 끝에 마침내 호텔에 도착했고, 그래서 밖에 나가지 않고 쉬면서 재충전하기로 했다."},{"id":"38-6","n":6,"en":"They added more chairs to the room / so that everyone could have a seat.","ko":"그들은 방에 의자를 더 추가했다 / 모든 사람이 자리를 가질 수 있도록","nat":"그들은 모두가 앉을 수 있도록 방에 의자를 더 놓았다."},{"id":"38-7","n":7,"en":"The loud music coming from outside / added to my headache, / so I closed the window / to block the noise.","ko":"밖에서 나오는 시끄러운 음악이 / 내 두통에 더해졌다, / 그래서 나는 창문을 닫았다 / 소음을 차단하기 위해","nat":"밖에서 들려오는 시끄러운 음악 때문에 두통이 더 심해져서 나는 소음을 막으려고 창문을 닫았다."}]},{"d":39,"s":[{"id":"39-1","n":1,"en":"She demanded to speak with the manager / because she was not satisfied with the service she received.","ko":"그녀는 매니저와 이야기할 것을 요구했다 / 그녀가 받은 서비스에 만족하지 않았기 때문에","nat":"그녀는 받은 서비스에 만족하지 못해서 매니저와 이야기하겠다고 요구했다."},{"id":"39-2","n":2,"en":"She demanded a change in the schedule / after she realized / that two of her classes overlapped.","ko":"그녀는 일정 변경을 요구했다 / 그녀가 깨달은 후에 / 그녀의 두 수업이 겹친다는 것을","nat":"그녀는 자신의 수업 두 개가 겹친다는 것을 깨달은 뒤 일정 변경을 요구했다."},{"id":"39-3","n":3,"en":"The coach demanded / that the players arrive on time / so that they could warm up properly / before the match started.","ko":"코치는 요구했다 / 선수들이 시간에 맞춰 오라고 / 그들이 제대로 준비운동을 할 수 있도록 / 경기가 시작되기 전에","nat":"코치는 경기가 시작되기 전에 선수들이 제대로 준비 운동을 할 수 있도록 제시간에 도착하라고 요구했다."},{"id":"39-4","n":4,"en":"She is known as a great team leader in group projects, / and some classmates say / her leadership makes group work more enjoyable.","ko":"그녀는 조별 과제에서 훌륭한 팀 리더로 알려져 있다, / 그리고 몇몇 급우들은 말한다 / 그녀의 리더십이 조별 작업을 더 즐겁게 만든다고","nat":"그녀는 조별 과제에서 훌륭한 팀 리더로 알려져 있으며, 일부 반 친구들은 그녀의 리더십이 조별 활동을 더 즐겁게 만든다고 말한다."},{"id":"39-5","n":5,"en":"Seoul is known as the capital of Korea, / attracting many tourists / who want to see both modern buildings and old palaces.","ko":"서울은 한국의 수도로 알려져 있다, / 많은 관광객들을 끌어들이며 / 현대적인 건물들과 오래된 궁궐들을 모두 보고 싶어하는","nat":"서울은 한국의 수도로 알려져 있으며, 현대적인 건물과 오래된 궁궐을 모두 보고 싶어 하는 많은 관광객을 끌어들인다."},{"id":"39-6","n":6,"en":"His phone went dead during the call, / so he quickly borrowed a classmate's phone / to call back and explain the situation.","ko":"그의 핸드폰이 통화 중에 꺼졌다, / 그래서 그는 급히 급우의 핸드폰을 빌렸다 / 다시 전화해서 상황을 설명하기 위해","nat":"통화 도중에 그의 휴대폰이 꺼져서 그는 다시 전화해 상황을 설명하려고 재빨리 반 친구의 휴대폰을 빌렸다."},{"id":"39-7","n":7,"en":"The food went bad, / even in the fridge, / so we cleaned out the fridge / and threw away everything / that was too old.","ko":"음식이 상했다, / 냉장고 안에서도, / 그래서 우리는 냉장고를 청소했다 / 그리고 모든 것을 버렸다 / 너무 오래된","nat":"냉장고 안에서조차 음식이 상해서 우리는 냉장고를 싹 치우고 너무 오래된 것은 모두 버렸다."}]},{"d":40,"s":[{"id":"40-1","n":1,"en":"The concert will take place in the school gym / after the final exams, / giving everyone something exciting to enjoy.","ko":"콘서트는 학교 체육관에서 열릴 것이다 / 기말고사 후에, / 모든 사람에게 즐길 수 있는 흥미진진한 무언가를 주면서","nat":"그 콘서트는 기말고사 뒤에 학교 체육관에서 열릴 것이며, 모두에게 즐길 만한 신나는 시간을 줄 것이다."},{"id":"40-2","n":2,"en":"An accident happened near the school this morning, / and although it looked serious at first, / no students or teachers were hurt.","ko":"오늘 아침 학교 근처에서 사고가 일어났다, / 그리고 처음엔 심각해 보였지만, / 학생이나 선생님 중 아무도 다치지 않았다","nat":"오늘 아침 학교 근처에서 사고가 일어났는데, 처음에는 심각해 보였지만 다친 학생이나 교사는 없었다."},{"id":"40-3","n":3,"en":"An earthquake that happened in this area last year / made many people practice evacuation drills / at home or school.","ko":"작년에 이 지역에서 발생한 지진이 / 많은 사람들로 하여금 대피 훈련을 연습하게 만들었다 / 집이나 학교에서","nat":"작년에 이 지역에서 일어난 지진 때문에 많은 사람들이 집이나 학교에서 대피 훈련을 하게 되었다."},{"id":"40-4","n":4,"en":"He can't stand waiting in line / when it's very hot, / as the heat makes him feel impatient.","ko":"그는 줄 서서 기다리는 것을 참을 수 없다 / 매우 더울 때, / 더위가 그를 참을성 없게 만들기 때문에","nat":"그는 더위 때문에 초조해져서 날씨가 매우 더울 때 줄 서서 기다리는 것을 참지 못한다."},{"id":"40-5","n":5,"en":"She couldn't stand being in a crowded room / with loud music, / so she went outside / to get some fresh air.","ko":"그녀는 붐비는 방에 있는 것을 참을 수 없었다 / 시끄러운 음악이 있는, / 그래서 그녀는 밖으로 나갔다 / 신선한 공기를 마시기 위해","nat":"그녀는 시끄러운 음악이 나오는 붐비는 방에 있는 것을 참을 수 없어서 신선한 공기를 쐬러 밖으로 나갔다."},{"id":"40-6","n":6,"en":"We divided the large chocolate cake / into eight pieces, / which allowed everyone at the party / to have a taste.","ko":"우리는 큰 초콜릿 케이크를 나누었다 / 8조각으로, / 그리고 이것은 파티의 모든 사람이 / 맛을 볼 수 있게 해주었다","nat":"우리는 큰 초콜릿 케이크를 여덟 조각으로 나누었고, 덕분에 파티에 있는 모두가 맛을 볼 수 있었다."},{"id":"40-7","n":7,"en":"Before starting the discussion, / the teacher divided the class / into four small groups / based on students' interests.","ko":"토론을 시작하기 전에, / 선생님은 학급을 나누었다 / 4개의 소그룹으로 / 학생들의 관심사에 기반하여","nat":"토론을 시작하기 전에 선생님은 학생들의 관심사에 따라 학급을 네 개의 작은 모둠으로 나누었다."}]},{"d":41,"s":[{"id":"41-1","n":1,"en":"The long civil war cost the country so many innocent lives / that people still remember the pain it caused.","ko":"긴 내전은 그 나라가 너무나 많은 무고한 생명을 잃게 해서 / 사람들은 여전히 그것이 야기한 고통을 기억한다","nat":"그 긴 내전은 이 나라에서 너무나 많은 무고한 목숨을 앗아가, 사람들은 지금도 그 전쟁이 남긴 고통을 기억한다."},{"id":"41-2","n":2,"en":"Even though he was winning until the final round, / his mistake on the last question / cost him a chance / to become the champion.","ko":"그가 마지막 라운드까지 이기고 있었음에도 불구하고, / 마지막 문제에서의 그의 실수가 / 그에게 기회를 잃게 했다 / 챔피언이 될","nat":"그는 마지막 라운드까지 이기고 있었지만, 마지막 문제에서의 실수 때문에 챔피언이 될 기회를 놓치고 말았다."},{"id":"41-3","n":3,"en":"After getting rid of the trash, / we opened the windows / to let fresh air in.","ko":"쓰레기를 치운 후, / 우리는 창문을 열었다 / 신선한 공기를 들어오게 하기 위해","nat":"쓰레기를 치운 뒤, 우리는 신선한 공기가 들어오도록 창문을 열었다."},{"id":"41-4","n":4,"en":"I got rid of my old school bag / and bought a new one / designed for students with heavy schedules.","ko":"나는 내 낡은 책가방을 버렸다 / 그리고 새 것을 샀다 / 많은 스케줄을 가진 학생들을 위해 설계된","nat":"나는 낡은 책가방을 버리고, 빡빡한 일정을 소화하는 학생들을 위해 만들어진 새 가방을 샀다."},{"id":"41-5","n":5,"en":"They fixed the mirror / to the wall in the hallway / to make it easier for everyone to use.","ko":"그들은 거울을 고정시켰다 / 복도의 벽에 / 모든 사람이 사용하기 더 쉽게 만들기 위해","nat":"그들은 모두가 더 쉽게 쓸 수 있도록 복도 벽에 거울을 고정했다."},{"id":"41-6","n":6,"en":"Even though it took some time, / she fixed the toy / so that her little brother could enjoy it again.","ko":"시간이 좀 걸렸지만, / 그녀는 장난감을 고쳤다 / 그녀의 남동생이 다시 그것을 즐길 수 있도록","nat":"시간이 좀 걸렸지만, 그녀는 어린 남동생이 그 장난감을 다시 가지고 놀 수 있도록 고쳐 주었다."},{"id":"41-7","n":7,"en":"Before the teacher comes in, / I need to fix this problem / that I noticed while checking my answers.","ko":"선생님이 들어오시기 전에, / 나는 이 문제를 해결해야 한다 / 내가 내 답을 확인하는 동안 발견한","nat":"선생님이 들어오시기 전에, 나는 답을 확인하다가 알아챈 이 문제를 고쳐야 한다."}]},{"d":42,"s":[{"id":"42-1","n":1,"en":"After seeing how clean the room was, / my mom commended my brother / for cleaning it / without being told.","ko":"방이 얼마나 깨끗한지 본 후, / 엄마는 내 남동생을 칭찬하셨다 / 그것을 청소한 것에 대해 / 말을 듣지 않고도","nat":"방이 얼마나 깨끗한지 본 엄마는 내 형제가 시키지 않았는데도 방을 청소한 것을 칭찬했다."},{"id":"42-2","n":2,"en":"We commended the team / for their great effort / although the result wasn't what they hoped for.","ko":"우리는 팀을 칭찬했다 / 그들의 훌륭한 노력에 대해 / 결과가 그들이 바란 것이 아니었지만","nat":"결과가 그들이 바랐던 것은 아니었지만, 우리는 그 팀의 훌륭한 노력을 칭찬했다."},{"id":"42-3","n":3,"en":"He commanded his dog, / which was jumping around excitedly, / to sit / before giving it a treat.","ko":"그는 자신의 개에게 명령했다, / 신나게 뛰어다니고 있던, / 앉으라고 / 그에게 간식을 주기 전에","nat":"그는 신이 나서 이리저리 뛰어다니는 개에게 간식을 주기 전에 앉으라고 명령했다."},{"id":"42-4","n":4,"en":"The officer commanded us / to leave the building / after the alarm went off, / but it was a false alarm.","ko":"경찰관은 우리에게 명령했다 / 건물을 떠나라고 / 경보가 울린 후, / 하지만 그것은 허위 경보였다","nat":"경보가 울린 뒤 그 경찰관은 우리에게 건물에서 나가라고 명령했지만, 그것은 오보였다."},{"id":"42-5","n":5,"en":"To grow properly, / plants depend not only on sunlight / but also on water and soil.","ko":"제대로 자라기 위해, / 식물들은 햇빛뿐만 아니라 / 물과 토양에도 의존한다","nat":"식물이 제대로 자라려면 햇빛뿐만 아니라 물과 흙에도 의존한다."},{"id":"42-6","n":6,"en":"To avoid being late, / I depend on my alarm clock / and set it carefully every night.","ko":"늦는 것을 피하기 위해, / 나는 내 알람시계에 의존한다 / 그리고 매일 밤 신중하게 맞춘다","nat":"늦지 않으려고 나는 알람시계에 의존하며, 매일 밤 알람을 조심스럽게 맞춰 둔다."},{"id":"42-7","n":7,"en":"I rely on my phone's navigation / whenever I visit somewhere new.","ko":"나는 내 휴대폰의 내비게이션에 의존한다 / 새로운 곳을 방문할 때마다","nat":"나는 새로운 곳에 갈 때마다 휴대폰 내비게이션에 의존한다."}]},{"d":43,"s":[{"id":"43-1","n":1,"en":"He didn't appreciate the joke / until someone told him / what it really meant.","ko":"그는 그 농담을 이해하지 못했다 / 누군가가 그에게 말해줄 때까지 / 그것이 정말로 무엇을 의미하는지","nat":"그는 누군가가 그 농담이 정말 무슨 뜻인지 말해주기 전까지는 그 농담의 진가를 알아보지 못했다."},{"id":"43-2","n":2,"en":"While walking through the gallery, / she stopped / to appreciate a painting / that caught her eye.","ko":"갤러리를 거닐면서, / 그녀는 멈췄다 / 그림을 감상하기 위해 / 그녀의 시선을 사로잡은","nat":"갤러리를 걷던 그녀는 눈길을 끈 그림 한 점을 감상하려고 걸음을 멈췄다."},{"id":"43-3","n":3,"en":"She appreciated / that her friend took the time / to make something special just for her.","ko":"그녀는 고마워했다 / 그녀의 친구가 시간을 들인 것을 / 오직 그녀만을 위해 특별한 무언가를 만들기 위해","nat":"그녀는 친구가 오직 자기만을 위해 특별한 무언가를 만들어 주려고 시간을 내 준 것에 고마워했다."},{"id":"43-4","n":4,"en":"The book is composed of ten short stories / written by famous authors, / making it both enjoyable and meaningful to read.","ko":"그 책은 10편의 단편 소설로 구성되어 있다 / 유명한 작가들이 쓴, / 그것을 읽기에 즐겁고 의미 있게 만들면서","nat":"그 책은 유명 작가들이 쓴 짧은 이야기 열 편으로 구성되어 있어, 읽기에 즐겁고도 의미가 있다."},{"id":"43-5","n":5,"en":"The air we breathe / is composed of gases / that are important for both people and nature.","ko":"우리가 숨쉬는 공기는 / 기체들로 구성되어 있다 / 사람과 자연 모두에게 중요한","nat":"우리가 숨 쉬는 공기는 사람과 자연 모두에게 중요한 기체들로 이루어져 있다."},{"id":"43-6","n":6,"en":"He confused the red button / with the green one, / which caused the machine to stop working.","ko":"그는 빨간 버튼을 혼동했다 / 초록 버튼과, / 그리고 이것이 기계가 작동을 멈추게 만들었다","nat":"그는 빨간 버튼을 초록 버튼으로 착각했고, 그 때문에 기계가 작동을 멈췄다."},{"id":"43-7","n":7,"en":"It was their first day, / so it wasn't surprising / that they confused our classroom / with the one upstairs.","ko":"그들의 첫날이었다, / 그래서 놀랄 일이 아니었다 / 그들이 우리 교실을 혼동한 것은 / 위층에 있는 것과","nat":"그날은 그들의 첫날이었으니, 우리 교실을 위층 교실로 착각한 것도 놀랄 일이 아니었다."}]},{"d":44,"s":[{"id":"44-1","n":1,"en":"I entered the bus, / tapped my card, / and luckily found a seat / by the window.","ko":"나는 버스에 탔다, / 카드를 찍었다, / 그리고 운 좋게 자리를 찾았다 / 창가에","nat":"나는 버스에 타서 카드를 찍었고, 운 좋게도 창가 자리를 찾았다."},{"id":"44-2","n":2,"en":"We entered the store, / browsed the snack aisle for a while, / and chose a few items / that looked good.","ko":"우리는 가게에 들어갔다, / 과자 코너를 잠시 둘러봤다, / 그리고 몇 개의 물건을 선택했다 / 맛있어 보이는","nat":"우리는 가게에 들어가 한동안 과자 코너를 둘러보고, 괜찮아 보이는 것 몇 가지를 골랐다."},{"id":"44-3","n":3,"en":"Because he was running out of mobile data, / he took advantage of the free Wi-Fi / at the café.","ko":"그의 모바일 데이터가 떨어져가고 있었기 때문에, / 그는 무료 와이파이를 이용했다 / 카페에서","nat":"모바일 데이터가 거의 떨어져 가던 그는 카페의 무료 와이파이를 이용했다."},{"id":"44-4","n":4,"en":"She took advantage of the sale / not only to save money, / but also to upgrade her old shoes.","ko":"그녀는 세일을 이용했다 / 돈을 절약하기 위해서 뿐만 아니라, / 그녀의 오래된 신발을 업그레이드하기 위해서","nat":"그녀는 돈을 아낄 뿐 아니라 낡은 신발을 더 좋은 것으로 바꾸려고 할인 행사를 이용했다."},{"id":"44-5","n":5,"en":"Because their weekdays are filled with work, / they took advantage of the weekend / to spend time with their grandparents.","ko":"그들의 평일은 일로 가득 차 있기 때문에, / 그들은 주말을 이용했다 / 그들의 조부모님과 시간을 보내기 위해","nat":"평일에는 일이 가득했기 때문에, 그들은 주말을 이용해 조부모님과 시간을 보냈다."},{"id":"44-6","n":6,"en":"Seeing the house in a mess, / he blamed his dog / without knowing what really happened.","ko":"집이 엉망인 것을 보고, / 그는 자신의 개를 탓했다 / 정말로 무슨 일이 일어났는지 모른 채","nat":"집이 엉망인 것을 본 그는 실제로 무슨 일이 있었는지도 모른 채 자기 개를 탓했다."},{"id":"44-7","n":7,"en":"Though others said it wasn't my fault, / I blamed myself for the mistake / and couldn't stop thinking about it.","ko":"다른 사람들이 내 잘못이 아니라고 말했지만, / 나는 그 실수에 대해 나 자신을 탓했다 / 그리고 그것에 대해 생각하는 것을 멈출 수 없었다","nat":"다른 사람들은 내 잘못이 아니라고 말했지만, 나는 그 실수로 나 자신을 탓했고 그 생각을 멈출 수 없었다."}]},{"d":45,"s":[{"id":"45-1","n":1,"en":"She persuaded her daughter / to eat more vegetables / for a healthier diet / that would support her growth and energy.","ko":"그녀는 그녀의 딸을 설득했다 / 더 많은 야채를 먹도록 / 더 건강한 식단을 위해 / 그녀의 성장과 에너지를 지원할","nat":"그녀는 딸의 성장과 활력에 도움이 될 더 건강한 식단을 위해 딸에게 채소를 더 먹으라고 설득했다."},{"id":"45-2","n":2,"en":"They persuaded him / to try something new, / such as joining a music club, / because they believed / it would help him discover his hidden talents.","ko":"그들은 그를 설득했다 / 새로운 것을 시도하도록, / 음악 동아리에 가입하는 것과 같은, / 왜냐하면 그들은 믿었기 때문이다 / 그것이 그의 숨겨진 재능을 발견하는데 도움이 될 것이라고","nat":"그들은 그가 숨겨진 재능을 발견하는 데 도움이 될 것이라고 믿었기 때문에, 음악 동아리에 가입하는 것 같은 새로운 일을 해 보라고 그를 설득했다."},{"id":"45-3","n":3,"en":"I look forward to meeting my friends this weekend / and playing games all day, / especially the new ones / we planned to try together.","ko":"나는 이번 주말에 친구들을 만나는 것을 기대한다 / 그리고 하루 종일 게임하는 것을, / 특히 새로운 것들을 / 우리가 함께 시도하기로 계획한","nat":"나는 이번 주말에 친구들을 만나 하루 종일 게임하기를 고대하고 있고, 특히 우리가 함께 해 보기로 계획한 새 게임들이 기대된다."},{"id":"45-4","n":4,"en":"I look forward to watching the new movie, / not only because it's based on my favorite novel / but also because it stars actors I really like.","ko":"나는 새 영화를 보는 것을 기대한다, / 내가 좋아하는 소설을 바탕으로 했기 때문뿐만 아니라 / 내가 정말 좋아하는 배우들이 주연을 맡기 때문이기도 하다","nat":"그 새 영화는 내가 가장 좋아하는 소설이 원작일 뿐 아니라 내가 정말 좋아하는 배우들이 출연해서, 나는 영화를 보기를 고대한다."},{"id":"45-5","n":5,"en":"She looks forward to going on a school trip / to Jeju Island for the first time / even though she feels a little nervous about flying.","ko":"그녀는 수학여행을 가는 것을 기대한다 / 처음 제주도로 / 비록 그녀가 비행기를 타는 것에 대해 약간 긴장하지만","nat":"그녀는 비행기를 타는 것이 조금 긴장되기는 하지만, 처음으로 제주도로 수학여행을 가는 것을 고대한다."},{"id":"45-6","n":6,"en":"She studies every day / to keep up with her classmates / and avoid falling behind, / especially in subjects like math and science.","ko":"그녀는 매일 공부한다 / 급우들을 따라가기 위해 / 그리고 뒤처지는 것을 피하기 위해, / 특히 수학과 과학 같은 과목에서","nat":"그녀는 특히 수학과 과학 같은 과목에서 반 친구들을 따라가고 뒤처지지 않으려고 매일 공부한다."},{"id":"45-7","n":7,"en":"He runs so fast on the track / that I can't keep up with him, / despite my daily practice.","ko":"그는 트랙에서 너무 빨리 달려서 / 나는 그를 따라갈 수 없다, / 나의 매일의 연습에도 불구하고","nat":"그는 트랙에서 너무 빨리 달려서, 매일 연습하는데도 나는 그를 따라갈 수 없다."}]},{"d":46,"s":[{"id":"46-1","n":1,"en":"She imagines becoming a famous chef / by opening her own restaurant in the city / to share her cultural heritage / through traditional Korean dishes.","ko":"그녀는 유명한 요리사가 되는 것을 상상한다 / 도시에 자신의 레스토랑을 여는 것으로써 / 자신의 문화 유산을 나누기 위해 / 전통 한국 요리를 통해","nat":"그녀는 도시에 자신의 식당을 열어 전통 한식으로 자신의 문화유산을 나누며 유명한 요리사가 되는 모습을 상상한다."},{"id":"46-2","n":2,"en":"A scientist imagines herself / discovering a new star / through her powerful telescope, / which would change the future of astronomy.","ko":"한 과학자는 자신을 상상한다 / 새로운 별을 발견하는 것을 / 그녀의 강력한 망원경을 통해, / 그리고 이것은 천문학의 미래를 바꿀 것이다","nat":"한 과학자가 성능 좋은 망원경으로 새로운 별을 발견하는 자신의 모습을 상상하는데, 그 일은 천문학의 미래를 바꿀 것이다."},{"id":"46-3","n":3,"en":"A musician imagines / that his melody brings people together / whenever it is played in public places, / even if they come from different backgrounds.","ko":"한 음악가는 상상한다 / 자신의 멜로디가 사람들을 하나로 모으는 것을 / 공공장소에서 연주될 때마다, / 그들이 다른 배경에서 왔을지라도","nat":"한 음악가는 자신의 멜로디가 공공장소에서 연주될 때마다, 서로 다른 배경에서 온 사람들이라도 하나로 모은다고 상상한다."},{"id":"46-4","n":4,"en":"The next station is Express Bus Terminal. / Doors will open on the right. / You can transfer to Lines 3, 7, and 9 here.","ko":"다음 역은 고속터미널입니다. / 문이 오른쪽으로 열립니다. / 여기서 3호선, 7호선, 9호선으로 갈아타실 수 있습니다","nat":"다음 역은 고속버스터미널이다. 문은 오른쪽에서 열린다. 이곳에서 3호선, 7호선, 9호선으로 환승할 수 있다."},{"id":"46-5","n":5,"en":"The hospital lacked the tools / needed for the surgery, / so the patient was transferred / to a bigger facility / for better care.","ko":"병원은 도구가 부족했다 / 수술에 필요한, / 그래서 환자는 이송되었다 / 더 큰 시설로 / 더 나은 치료를 위해","nat":"그 병원에는 수술에 필요한 도구가 부족해서, 환자는 더 나은 치료를 받기 위해 더 큰 시설로 옮겨졌다."},{"id":"46-6","n":6,"en":"Reading that book transformed / how I think about success: / it's not about money or fame, / but about doing / what really matters to me.","ko":"그 책을 읽는 것은 바꿔놓았다 / 성공에 대해 내가 생각하는 방식을: / 그것은 돈이나 명예에 관한 것이 아니라, / 하는 것에 관한 것이다 / 나에게 정말로 중요한을","nat":"그 책을 읽고 성공에 대한 내 생각이 바뀌었다. 성공은 돈이나 명성이 아니라 나에게 정말 중요한 일을 하는 것이다."},{"id":"46-7","n":7,"en":"Social media has transformed / not only how we talk to friends / but also how we have fun with them online, / like watching videos or playing games together.","ko":"소셜 미디어는 바꿔놓았다 / 우리가 친구들과 대화하는 방식뿐만 아니라 / 우리가 온라인에서 그들과 즐거운 시간을 보내는 방식도, / 비디오를 보거나 함께 게임하는 것처럼","nat":"소셜 미디어는 우리가 친구들과 대화하는 방식뿐 아니라, 영상을 보거나 함께 게임을 하는 것처럼 온라인에서 친구들과 즐기는 방식까지 바꿔 놓았다."}]},{"d":47,"s":[{"id":"47-1","n":1,"en":"Even if you order only one item, / they still charge $5 extra / for fast delivery.","ko":"당신이 하나의 물건만 주문해도, / 그들은 여전히 5달러를 추가로 청구한다 / 빠른 배송을 위해","nat":"한 가지 물건만 주문해도, 빠른 배송에는 여전히 5달러가 추가로 청구된다."},{"id":"47-2","n":2,"en":"The referee charged the player / with breaking the rules, / which affected the final score.","ko":"심판은 그 선수를 기소했다 / 규칙을 위반한 것으로, / 그리고 이것은 최종 점수에 영향을 주었다","nat":"심판은 규칙을 어겼다는 이유로 그 선수를 문책했고, 그 일은 최종 점수에 영향을 미쳤다."},{"id":"47-3","n":3,"en":"I always charge my phone at night, / which helps me avoid low battery / during school.","ko":"나는 항상 밤에 내 핸드폰을 충전한다, / 그리고 이것은 내가 배터리 부족을 피하는 데 도움이 된다 / 학교에 있는 동안","nat":"나는 항상 밤에 휴대폰을 충전하는데, 덕분에 학교에서 배터리가 부족해지는 일을 피할 수 있다."},{"id":"47-4","n":4,"en":"They didn't complain / and put up with the wait, / knowing the dish was worth it.","ko":"그들은 불평하지 않았다 / 그리고 기다림을 참아냈다, / 그 요리가 그럴 가치가 있다는 것을 알고 있어서","nat":"그들은 그 음식이 기다릴 만한 가치가 있다는 것을 알았기에 불평하지 않고 기다림을 참았다."},{"id":"47-5","n":5,"en":"We've been patient, / but the internet is now too slow / to put up with.","ko":"우리는 참아왔다, / 하지만 인터넷이 이제 너무 느리다 / 참기에는","nat":"우리는 참을성 있게 기다려 왔지만, 인터넷은 이제 참고 쓰기에는 너무 느리다."},{"id":"47-6","n":6,"en":"They planned ahead and left early, / but the heavy traffic prevented them / from getting to the meeting on time.","ko":"그들은 미리 계획하고 일찍 떠났다, / 하지만 심한 교통 체증이 그들을 막았다 / 회의에 시간에 맞게 도착하는 것을","nat":"그들은 미리 계획해서 일찍 출발했지만, 극심한 교통 체증 때문에 회의에 제시간에 도착하지 못했다."},{"id":"47-7","n":7,"en":"The flu not only prevented her / from going to school / but also kept her / from taking the test.","ko":"독감은 그녀를 막았을 뿐만 아니라 / 학교에 가는 것을 / 또한 그녀를 막았다 / 시험을 보는 것을","nat":"독감 때문에 그녀는 학교에 가지 못했을 뿐 아니라 시험도 치르지 못했다."}]},{"d":48,"s":[{"id":"48-1","n":1,"en":"Students who lack proper sleep / often find it almost impossible / to attend to the lesson / with full concentration.","ko":"충분한 수면이 부족한 학생들은 / 종종 거의 불가능하다고 생각한다 / 수업에 집중하는 것을 / 완전한 집중력으로","nat":"잠이 부족한 학생들은 온전히 집중해서 수업에 주의를 기울이는 것이 거의 불가능하다고 느끼는 경우가 많다."},{"id":"48-2","n":2,"en":"A doctor attended to the injured players / after the game, / checking their conditions one by one / to determine whether hospital treatment was needed.","ko":"의사가 부상당한 선수들을 돌봤다 / 경기 후에, / 그들의 상태를 하나씩 확인하며 / 병원 치료가 필요한지 판단하기 위해","nat":"한 의사가 경기 후에 부상당한 선수들을 돌보며, 병원 치료가 필요한지 판단하기 위해 상태를 하나하나 확인했다."},{"id":"48-3","n":3,"en":"The illness was attended by a high fever, / a sore throat, and a dry cough, / which made it difficult / for the patient to sleep properly.","ko":"그 질병에는 고열이 수반되었다, / 목 아픔, 그리고 마른 기침이, / 그리고 이것은 어렵게 만들었다 / 환자가 제대로 잠을 자는 것을","nat":"그 병에는 고열, 인후통, 마른기침이 동반되어 환자가 제대로 잠을 자기 어려웠다."},{"id":"48-4","n":4,"en":"This chair is made of plastic / for outdoor use, / so it's convenient to carry and set up / when you go on short weekend trips.","ko":"이 의자는 플라스틱으로 만들어졌다 / 야외 사용을 위해, / 그래서 휴대하고 설치하기 편리하다 / 짧은 주말 여행을 갈 때","nat":"이 의자는 야외용 플라스틱으로 만들어져서, 짧은 주말 여행을 갈 때 들고 다니고 설치하기 편리하다."},{"id":"48-5","n":5,"en":"That toy car on the shelf is made of metal, / which not only gives it a more solid and realistic feel / but also makes it more appealing to collectors.","ko":"선반에 있는 그 장난감 자동차는 금속으로 만들어졌다, / 그리고 이것은 더 단단하고 현실적인 느낌을 줄 뿐만 아니라 / 또한 수집가들에게 더 매력적으로 만든다","nat":"선반 위의 저 장난감 자동차는 금속으로 만들어졌는데, 그 덕분에 더 단단하고 사실적인 느낌이 날 뿐 아니라 수집가들에게도 더 매력적이다."},{"id":"48-6","n":6,"en":"He replaced his wet socks / with dry ones / after the rain, / which helped him focus better / for the rest of the day.","ko":"그는 젖은 양말을 교체했다 / 마른 것으로 / 비가 온 후에, / 그리고 이것은 그가 더 잘 집중하는 데 도움이 되었다 / 하루의 나머지 시간 동안","nat":"그는 비가 온 뒤 젖은 양말을 마른 양말로 갈아 신었고, 덕분에 하루의 남은 시간 동안 더 잘 집중할 수 있었다."},{"id":"48-7","n":7,"en":"We replaced the picture on the wall / with a family photo / that includes all three generations, / taken during our last gathering / at our grandparents' house.","ko":"우리는 벽에 있는 그림을 교체했다 / 가족 사진으로 / 3세대 모두가 포함된, / 그리고 그것은 우리의 마지막 모임 동안 찍혔다 / 할머니.할아버지 댁에서","nat":"우리는 벽에 걸린 그림을 세 세대가 모두 담긴 가족사진으로 바꿨는데, 그 사진은 조부모님 댁에서 마지막으로 모였을 때 찍은 것이다."}]},{"d":49,"s":[{"id":"49-1","n":1,"en":"We approached the mountain / before sunset, / feeling both tired and excited / as the sky slowly turned orange / behind the distant hills.","ko":"우리는 산에 접근했다 / 해가 지기 전에, / 피곤하면서도 흥분된 기분을 느끼며 / 하늘이 서서히 주황색으로 변하면서 / 멀리 있는 언덕들 뒤에서","nat":"우리는 해가 지기 전에 산에 다가갔고, 먼 언덕 뒤로 하늘이 서서히 주황빛으로 물드는 동안 피곤하면서도 신이 났다."},{"id":"49-2","n":2,"en":"After staying on the sofa, / napping all afternoon, / the small cat approached the bowl of warm milk / with its tail high in the air.","ko":"소파에 있은 후, / 오후 내내 낮잠을 잔 후, / 작은 고양이가 따뜻한 우유 그릇에 다가갔다 / 꼬리를 공중에 높이 치켜세우며","nat":"작은 고양이는 오후 내내 소파 위에서 낮잠을 자고 난 뒤, 꼬리를 높이 세우고 따뜻한 우유 그릇으로 다가갔다."},{"id":"49-3","n":3,"en":"Juice is made from fresh fruit / like oranges and apples, / without adding sugar or artificial colors, / to offer a healthier choice for consumers.","ko":"주스는 신선한 과일로 만들어진다 / 오렌지와 사과 같은, / 설탕이나 인공 색소를 첨가하지 않고, / 소비자들에게 더 건강한 선택을 제공하기 위해","nat":"주스는 소비자에게 더 건강한 선택지를 제공하기 위해 설탕이나 인공 색소를 넣지 않고 오렌지나 사과 같은 신선한 과일로 만든다."},{"id":"49-4","n":4,"en":"Cheese is made from fresh milk / at the dairy farm, / and temperature and humidity are closely controlled / throughout the process.","ko":"치즈는 신선한 우유로 만들어진다 / 낙농장에서, / 그리고 온도와 습도가 면밀히 조절된다 / 과정 전반에 걸쳐서","nat":"치즈는 낙농장에서 신선한 우유로 만들어지며, 그 과정 내내 온도와 습도가 세심하게 관리된다."},{"id":"49-5","n":5,"en":"I ran out of energy / after playing soccer / in the hot sun / for over an hour, / which made the rest of the day / feel much harder than usual.","ko":"나는 에너지가 떨어졌다 / 축구를 한 후 / 뜨거운 햇볕 아래서 / 한 시간 넘게, / 그리고 이것은 하루의 나머지를 만들었다 / 평소보다 훨씬 더 힘들게 느껴지게","nat":"나는 뜨거운 햇볕 아래에서 한 시간 넘게 축구를 하고 나서 기운이 다 떨어졌고, 그 때문에 남은 하루가 평소보다 훨씬 더 힘들게 느껴졌다."},{"id":"49-6","n":6,"en":"She ran out of time / while taking the English test / and couldn't finish the last two questions, / which made her feel frustrated / after the exam.","ko":"그녀는 시간이 부족했다 / 영어 시험을 치르는 동안 / 그리고 마지막 두 문제를 끝낼 수 없었다, / 그리고 이것은 그녀를 좌절감을 느끼게 만들었다 / 시험 후에","nat":"그녀는 영어 시험을 보다가 시간이 부족해 마지막 두 문제를 끝내지 못했고, 그 일로 시험이 끝난 뒤 좌절감을 느꼈다."},{"id":"49-7","n":7,"en":"When he ran out of paper / while printing his report, / he used the blank side of old worksheets / and wrote a brief explanation for the teacher.","ko":"그가 종이가 떨어졌을 때 / 리포트를 인쇄하는 동안, / 그는 오래된 학습지의 빈 면을 사용했다 / 그리고 선생님을 위한 간단한 설명을 썼다","nat":"그는 보고서를 인쇄하다가 종이가 떨어지자 오래된 활동지의 빈 면을 사용했고, 선생님께 드리는 짧은 설명을 적었다."}]},{"d":50,"s":[{"id":"50-1","n":1,"en":"After noticing that several groups had similar ideas, / I proposed a different topic to my team / to help us stand out.","ko":"여러 그룹이 비슷한 아이디어를 가지고 있다는 것을 알아챈 후, / 나는 우리 팀에게 다른 주제를 제안했다 / 우리가 눈에 띄도록 돕기 위해","nat":"여러 모둠이 비슷한 아이디어를 갖고 있다는 것을 알아챈 뒤, 나는 우리가 돋보일 수 있도록 팀에 다른 주제를 제안했다."},{"id":"50-2","n":2,"en":"Even though she usually prefers home-cooked meals, / Mom proposed eating out for lunch / at the new restaurant / that opened last week.","ko":"그녀는 보통 집에서 만든 음식을 선호하지만, / 엄마는 점심을 밖에서 먹자고 제안했다 / 새 식당에서 / 지난주에 문을 연","nat":"엄마는 평소 집밥을 더 좋아하지만, 지난주에 문을 연 새 식당에서 점심을 먹자고 제안했다."},{"id":"50-3","n":3,"en":"He proposed that the students help clean the classroom together / since they made a mess / during the art activity.","ko":"그는 학생들이 함께 교실을 청소하는 것을 도울 것을 제안했다 / 그들이 어지럽혔기 때문에 / 미술 활동 중에","nat":"그는 학생들이 미술 활동 중에 교실을 어질러 놓았으니 함께 교실 청소를 도와야 한다고 제안했다."},{"id":"50-4","n":4,"en":"He showed off his artwork / at the school exhibition, / where several teachers stopped / to compliment his use of color and detail.","ko":"그는 자신의 작품을 자랑했다 / 학교 전시회에서, / 그곳에서 여러 선생님들이 멈췄다 / 그의 색깔과 디테일 사용을 칭찬하기 위해","nat":"그는 학교 전시회에서 자신의 작품을 뽐냈고, 그곳에서 몇몇 선생님들이 걸음을 멈추고 그의 색 사용과 세부 표현을 칭찬했다."},{"id":"50-5","n":5,"en":"After practicing every day for two weeks, / they showed off their dance / at the school festival, / a performance that showed not just skill, but passion.","ko":"매일 2주 동안 연습한 후, / 그들은 춤을 선보였다 / 학교 축제에서, / 단지 기술뿐만 아니라 열정도 보여준 공연인","nat":"두 주 동안 매일 연습한 뒤, 그들은 학교 축제에서 춤을 선보였는데, 그것은 실력뿐 아니라 열정까지 보여 준 공연이었다."},{"id":"50-6","n":6,"en":"The hotel provided visitors with free breakfast / even though it was a budget hotel, / unlike many others in the same price range.","ko":"호텔은 방문객들에게 무료 아침식사를 제공했다 / 저예산 호텔임에도 불구하고, / 같은 가격대의 다른 많은 호텔들과는 달리","nat":"그 호텔은 저가 호텔인데도 방문객들에게 무료 아침 식사를 제공했는데, 같은 가격대의 다른 많은 호텔과는 달랐다."},{"id":"50-7","n":7,"en":"The nurse provided the patient with care and support / during the recovery process, / which was especially important / after such a difficult surgery.","ko":"간호사는 환자에게 돌봄과 지원을 제공했다 / 회복 과정 동안, / 그리고 이것은 특히 중요했다 / 그렇게 어려운 수술 후에","nat":"그 간호사는 회복 과정 동안 환자에게 보살핌과 지원을 제공했고, 이는 그렇게 어려운 수술 뒤에 특히 중요했다."}]},{"d":51,"s":[{"id":"51-1","n":1,"en":"I adapted to wearing glasses / more easily than I thought, / especially after choosing a frame / that was light and comfortable.","ko":"나는 안경 착용에 적응했다 / 생각했던 것보다 더 쉽게, / 특히 프레임을 선택한 후 / 가볍고 편안한","nat":"나는 안경 쓰는 데 생각보다 더 쉽게 적응했는데, 특히 가볍고 편한 테를 고른 뒤에 그랬다."},{"id":"51-2","n":2,"en":"Some desert plants adapt to dry weather / not only by storing water in their thick stems, / but also by reducing the surface area of their leaves / to minimize water loss.","ko":"일부 사막 식물들은 건조한 날씨에 적응한다 / 두꺼운 줄기에 물을 저장할 뿐만 아니라, / 또한 잎의 표면적을 줄임으로써 / 물 손실을 최소화하기 위해","nat":"일부 사막 식물은 두꺼운 줄기에 물을 저장할 뿐만 아니라 물 손실을 최소화하려고 잎의 표면적을 줄임으로써 건조한 날씨에 적응한다."},{"id":"51-3","n":3,"en":"After visiting the animal shelter several times, / they adopted a puppy / that had been rescued from the streets / and was still recovering from a minor injury.","ko":"동물 보호소를 여러 번 방문한 후에, / 그들은 강아지를 입양했다 / 거리에서 구조되었던 / 그리고 아직 가벼운 부상에서 회복 중이던","nat":"동물 보호소를 여러 번 방문한 끝에, 그들은 길거리에서 구조되어 아직 가벼운 부상에서 회복 중이던 강아지를 입양했다."},{"id":"51-4","n":4,"en":"To fight traffic-related air pollution, / many cities adopted green policies / such as car-free zones and better public transportation.","ko":"교통 관련 대기 오염과 싸우기 위해, / 많은 도시들이 친환경 정책을 채택했다 / 차 없는 구역과 더 나은 대중교통 같은","nat":"교통으로 인한 대기 오염에 맞서려고 많은 도시가 차 없는 구역이나 더 나은 대중교통 같은 친환경 정책을 채택했다."},{"id":"51-5","n":5,"en":"At the end of the school ceremony, / our principal presented the awards / to the top students from each grade / while the audience watched and clapped for the winners.","ko":"학교 행사가 끝날 때, / 우리 교장선생님이 상을 수여했다 / 각 학년의 우수 학생들에게 / 참석자들이 우승자들을 보고 박수를 치는 동안","nat":"학교 행사가 끝날 무렵 교장 선생님은 각 학년의 우수한 학생들에게 상을 수여했고, 청중은 그 모습을 지켜보며 수상자들에게 박수를 보냈다."},{"id":"51-6","n":6,"en":"They carefully presented the product / on social media platforms / where visual content spreads quickly / among young users.","ko":"그들은 제품을 신중하게 소개했다 / 소셜 미디어 플랫폼에서 / 그곳에서 시각적 콘텐츠가 빠르게 퍼진다 / 젊은 사용자들 사이에서","nat":"그들은 시각적 콘텐츠가 젊은 이용자들 사이에서 빠르게 퍼지는 소셜 미디어 플랫폼에서 그 제품을 신중하게 소개했다."},{"id":"51-7","n":7,"en":"Despite her efforts to plan ahead, / the project still presented her with stress / due to tight deadlines.","ko":"미리 계획하려는 그녀의 노력에도 불구하고, / 프로젝트는 여전히 그녀에게 스트레스를 안겨주었다 / 빡빡한 마감일 때문에","nat":"미리 계획하려고 애썼는데도 그 프로젝트는 빠듯한 마감 때문에 여전히 그녀에게 스트레스를 안겨 주었다."}]},{"d":52,"s":[{"id":"52-1","n":1,"en":"Although the room was small, / the desk finally fit in it / after I rearranged some of the furniture.","ko":"비록 방이 작았지만, / 책상은 마침내 그 안에 들어갔다 / 내가 가구 일부를 재배치한 후에","nat":"방은 작았지만, 내가 가구 몇 개를 다시 배치하자 책상이 마침내 그 안에 들어갔다."},{"id":"52-2","n":2,"en":"The shoes, which I ordered based only on reviews and size charts, / fit me better than I expected.","ko":"신발은, 리뷰와 사이즈 표만 보고 주문한, / 내가 예상했던 것보다 더 잘 맞았다","nat":"후기와 사이즈 표만 보고 주문한 신발이 예상보다 더 잘 맞았다."},{"id":"52-3","n":3,"en":"The gentle sound of the music fits the quiet café / and makes the place feel warm and comfortable.","ko":"음악의 부드러운 소리가 조용한 카페에 어울린다 / 그리고 그 장소를 따뜻하고 편안하게 느끼게 만든다","nat":"음악의 부드러운 소리는 조용한 카페와 잘 어울리고, 그곳을 따뜻하고 편안하게 느껴지게 한다."},{"id":"52-4","n":4,"en":"I took charge of walking and feeding the dog / while my parents were visiting my grandparents for the afternoon.","ko":"나는 개를 산책시키고 먹이는 일을 맡았다 / 부모님이 오후에 조부모님을 방문하는 동안","nat":"부모님이 오후 동안 조부모님을 방문하신 사이, 나는 개를 산책시키고 먹이 주는 일을 맡았다."},{"id":"52-5","n":5,"en":"She took charge of the noisy class / during the teacher's absence, / but she struggled to get everyone to stay quiet.","ko":"그녀는 시끄러운 반을 맡았다 / 선생님이 안 계신 동안, / 하지만 그녀는 모두를 조용히 있게 하는 데 애를 먹었다","nat":"그녀는 선생님이 안 계신 동안 시끄러운 반을 맡았지만, 모두를 조용히 시키느라 애를 먹었다."},{"id":"52-6","n":6,"en":"Many experts say / that very young babies often fail to distinguish red from green / before their visual system fully develops.","ko":"많은 전문가들이 말한다 / 아주 어린 아기들은 종종 빨간색과 초록색을 구별하지 못한다고 / 그들의 시각 시스템이 완전히 발달하기 전에","nat":"많은 전문가들은 매우 어린 아기들이 시각 체계가 완전히 발달하기 전에는 빨간색과 초록색을 구별하지 못하는 경우가 많다고 말한다."},{"id":"52-7","n":7,"en":"She gradually learned to distinguish right from wrong / through repeated mistakes, / and each mistake taught her something important.","ko":"그녀는 점차 옳고 그름을 구별하는 것을 배웠다 / 반복된 실수를 통해, / 그리고 각각의 실수가 그녀에게 중요한 것을 가르쳐 주었다","nat":"그녀는 거듭된 실수를 통해 옳고 그름을 구별하는 법을 서서히 배웠고, 실수 하나하나가 그녀에게 중요한 무언가를 가르쳐 주었다."}]},{"d":53,"s":[{"id":"53-1","n":1,"en":"Although she kept saying it was true, / she finally admitted lying / after the teacher asked her several times.","ko":"그녀가 그것이 사실이라고 계속 말했지만, / 그녀는 마침내 거짓말했다고 인정했다 / 선생님이 여러 번 묻고 난 후","nat":"그녀는 사실이라고 계속 우겼지만, 선생님이 여러 번 묻자 결국 거짓말했음을 인정했다."},{"id":"53-2","n":2,"en":"I admitted forgetting his birthday / and gave him a late gift / to show I was truly sorry.","ko":"나는 그의 생일을 잊었다고 인정했다 / 그리고 그에게 늦은 선물을 주었다 / 내가 정말 미안하다는 것을 보여주기 위해","nat":"나는 그의 생일을 잊었다고 인정하고, 정말 미안하다는 마음을 보여 주려고 늦게나마 선물을 주었다."},{"id":"53-3","n":3,"en":"The novel is based on the author's childhood experiences / that shaped her view of the world, / showing how hard work and family support / helped her succeed.","ko":"그 소설은 작가의 어린 시절 경험을 바탕으로 한다 / 그녀의 세계관을 형성한, / 어떻게 열심히 일하는 것과 가족의 지지가 / 그녀가 성공하는 데 도움이 되었는지 보여주면서","nat":"그 소설은 작가가 세상을 보는 관점을 형성한 어린 시절 경험을 바탕으로 하며, 노력과 가족의 지원이 그녀의 성공에 어떻게 도움이 되었는지를 보여 준다."},{"id":"53-4","n":4,"en":"The research report is based on survey results / that were collected from 500 students / in order to understand / how they use digital devices for learning.","ko":"연구 보고서는 설문조사 결과를 바탕으로 한다 / 500명의 학생들로부터 수집된 / 이해하기 위해 / 그들이 학습을 위해 디지털 기기를 어떻게 사용하는지를","nat":"그 연구 보고서는 학생들이 학습에 디지털 기기를 어떻게 사용하는지 이해하기 위해 500명의 학생에게서 수집한 설문 결과를 바탕으로 한다."},{"id":"53-5","n":5,"en":"Changing schools usually means making new friends, / which can lead to unexpected emotional challenges / and personal growth.","ko":"학교를 바꾸는 것은 보통 새로운 친구를 만드는 것을 의미한다, / 그리고 이것은 예상치 못한 감정적 도전으로 이어질 수 있다 / 그리고 개인적 성장으로","nat":"학교를 옮기면 보통 새 친구를 사귀게 되는데, 이는 예상치 못한 정서적 어려움과 개인적 성장으로 이어질 수 있다."},{"id":"53-6","n":6,"en":"This result means / that we need to try again / with a different approach next time, / even if it means stepping out of our comfort zone / to explore unfamiliar solutions.","ko":"이 결과는 의미한다 / 우리가 다시 시도해야 한다는 것을 / 다음에는 다른 접근법으로, / 비록 그것이 우리의 안전지대에서 벗어나는 것을 의미할지라도 / 익숙하지 않은 해결책을 탐구하기 위해","nat":"이 결과는 다음번에는 다른 방식으로 다시 시도해야 한다는 뜻이며, 낯선 해결책을 찾기 위해 안전지대를 벗어나야 하더라도 마찬가지다."},{"id":"53-7","n":7,"en":"She meant to send the email earlier, / but when she finally realized that the deadline had passed, / she apologized / and asked if there was still a way to submit it.","ko":"그녀는 이메일을 더 일찍 보내려고 했다, / 하지만 마침내 마감이 지났다는 것을 깨달았을 때, / 그녀는 사과했다 / 그리고 아직 그것을 제출할 방법이 있는지 물었다","nat":"그녀는 그 이메일을 더 일찍 보내려 했지만, 마감이 지났다는 것을 뒤늦게 깨닫고는 사과하며 아직 제출할 방법이 있는지 물었다."}]},{"d":54,"s":[{"id":"54-1","n":1,"en":"He became more confident through practice / because each attempt showed him / he was getting better.","ko":"그는 연습을 통해 더 자신감을 갖게 되었다 / 각각의 시도가 그에게 보여주었기 때문에 / 그가 더 나아지고 있다는 것을","nat":"그는 연습을 통해 더 자신감을 갖게 되었는데, 시도할 때마다 자신이 나아지고 있음을 알 수 있었기 때문이다."},{"id":"54-2","n":2,"en":"Bright colors really become her, / so she wears them / during important events / to express confidence and positivity.","ko":"밝은 색깔이 정말 그녀에게 잘 어울린다, / 그래서 그녀는 그것들을 입는다 / 중요한 행사 중에 / 자신감과 긍정성을 표현하기 위해.","nat":"밝은 색이 그녀에게 정말 잘 어울려서, 그녀는 자신감과 긍정적인 마음을 표현하려고 중요한 행사에서 밝은 색 옷을 입는다."},{"id":"54-3","n":3,"en":"Teaching students / how to reduce their carbon footprint / through actions such as turning off lights and recycling at school / contributes to helping them care more about the environment.","ko":"학생들을 가르치는 것은 / 그들의 탄소 발자국을 줄이는 방법을 / 학교에서 불을 끄고 재활용하는 것과 같은 행동을 통해 / 그들이 환경을 더 관심 갖도록 돕는 데 기여한다","nat":"학생들에게 학교에서 불 끄기나 재활용 같은 행동으로 탄소 발자국을 줄이는 방법을 가르치는 것은 학생들이 환경에 더 관심을 갖도록 돕는 데 기여한다."},{"id":"54-4","n":4,"en":"Maintaining a healthy sleep routine throughout the week / contributes to consistent focus during classes / for students with heavy study schedules.","ko":"일주일 내내 건강한 수면 습관을 유지하는 것은 / 수업 중 일관된 집중력에 기여한다 / 과중한 학습 일정을 가진 학생들에게","nat":"한 주 내내 건강한 수면 습관을 유지하면 공부 일정이 빡빡한 학생들이 수업 시간에 꾸준히 집중하는 데 도움이 된다."},{"id":"54-5","n":5,"en":"Reading different types of literature every day, / including fiction, nonfiction, and poetry, / contributes to improving both language proficiency and critical reading skills.","ko":"매일 다양한 종류의 문학을 읽는 것은, / 소설, 비소설, 시를 포함하여, / 언어 능력과 비판적 읽기 기술 모두를 향상시키는 데 기여한다","nat":"소설, 논픽션, 시를 비롯한 다양한 종류의 글을 매일 읽는 것은 언어 능력과 비판적 읽기 능력을 함께 키우는 데 도움이 된다."},{"id":"54-6","n":6,"en":"We must separate used batteries and electronic waste / from regular trash / to prevent harmful substances from polluting the environment.","ko":"우리는 폐배터리와 전자폐기물을 분리해야 한다 / 일반 쓰레기로부터 / 유해 물질이 환경을 오염시키는 것을 방지하기 위해","nat":"유해 물질이 환경을 오염시키지 않도록 우리는 다 쓴 배터리와 전자 폐기물을 일반 쓰레기와 분리해야 한다."},{"id":"54-7","n":7,"en":"Recognizing the potential dangers / of having a parking lot near a playground, / the school built a protective fence / to separate the two areas completely.","ko":"잠재적 위험을 인식하여 / 놀이터 근처에 주차장이 있는 것의, / 학교는 보호 울타리를 설치했다 / 두 구역을 완전히 분리하기 위해","nat":"학교는 놀이터 근처에 주차장이 있을 때의 잠재적 위험을 깨닫고, 두 구역을 완전히 분리하기 위해 보호 울타리를 세웠다."}]},{"d":55,"s":[{"id":"55-1","n":1,"en":"He denied using his phone during class, / saying he had turned it off / before the lesson started.","ko":"그는 수업 중에 휴대폰을 사용한 것을 부인했다, / 그것을 꺼뒀다고 말하며 / 수업이 시작되기 전에","nat":"그는 수업 중에 휴대전화를 썼다는 것을 부인하며, 수업이 시작되기 전에 꺼 두었다고 말했다."},{"id":"55-2","n":2,"en":"She denied / that she was late on purpose, / and explained / that her phone alarm didn't go off, / which was very unusual for her.","ko":"그녀는 부인했다 / 일부러 늦었다는 것을, / 그리고 설명했다 / 휴대폰 알람이 울리지 않았다고, / 그리고 이것은 그녀에게 매우 이례적인 일이었다","nat":"그녀는 일부러 늦은 것이 아니라고 부인하면서, 휴대전화 알람이 울리지 않았다고 설명했는데, 이는 그녀에게 매우 드문 일이었다."},{"id":"55-3","n":3,"en":"They were contented with just playing board games at home / even though their friends were excited about the amusement park trip.","ko":"그들은 집에서 보드게임만 하는 것으로 만족했다 / 친구들이 놀이공원 여행에 신나 했음에도 불구하고","nat":"친구들은 놀이공원 나들이에 들떠 있었지만, 그들은 집에서 보드게임만 하는 것으로도 만족했다."},{"id":"55-4","n":4,"en":"She is contented with her seat by the window, / saying the view helps her relax / even though the aisle seats are easier / to get in and out of.","ko":"그녀는 창가 자리에 만족한다, / 경치가 그녀가 긴장을 푸는 데 도움이 된다고 말하며 / 비록 통로 쪽 좌석이 더 쉽지만 / 드나들기에는","nat":"그녀는 통로 쪽 좌석이 드나들기 더 편한데도, 경치를 보면 긴장이 풀린다며 창가 자리에 만족한다."},{"id":"55-5","n":5,"en":"Let's not refer to that topic anymore, / no matter how kindly or casually it's mentioned.","ko":"그 주제를 더 이상 언급하지 말자, / 아무리 친절하게 또는 가볍게 언급되더라도","nat":"아무리 다정하거나 가볍게 언급된다 해도 그 주제는 더 이상 거론하지 말자."},{"id":"55-6","n":6,"en":"The teacher referred the student to the counselor / not only to discuss the behavior changes, / but also to ensure consistent emotional guidance.","ko":"교사는 학생을 상담사에게 의뢰했다 / 행동 변화를 논의하기 위해서뿐만 아니라, / 일관된 정서적 지도를 보장하기 위해서도","nat":"선생님은 행동 변화를 논의하려는 것뿐 아니라 일관된 정서 지도를 보장하기 위해서도 그 학생을 상담사에게 보냈다."},{"id":"55-7","n":7,"en":"In science class, / “H₂O” refers to water, / which is widely used in chemical and biological processes.","ko":"과학 수업에서, / “H₂O“는 물을 가리킨다, / 그리고 이것은 화학적, 생물학적 과정에서 널리 사용된다","nat":"과학 수업에서 \"H₂O\"는 물을 가리키며, 물은 화학적·생물학적 과정에 널리 쓰인다."}]},{"d":56,"s":[{"id":"56-1","n":1,"en":"Due to a recent security update, / students now need a newly issued password / to access tomorrow morning's online class.","ko":"최근 보안 업데이트로 인해, / 학생들은 이제 새로 발급된 비밀번호가 필요하다 / 내일 아침 온라인 수업에 접속하기 위해","nat":"최근 보안 업데이트로 인해 학생들은 이제 내일 아침 온라인 수업에 접속하려면 새로 발급된 비밀번호가 필요하다."},{"id":"56-2","n":2,"en":"As digital technology advances, / more people around the world access news through smartphones / to keep up with the latest information.","ko":"디지털 기술이 발전함에 따라, / 전 세계 더 많은 사람들이 스마트폰을 통해 뉴스에 접근한다 / 최신 정보를 따라잡기 위해","nat":"디지털 기술이 발전하면서 전 세계의 더 많은 사람이 최신 정보를 놓치지 않으려고 스마트폰으로 뉴스를 접한다."},{"id":"56-3","n":3,"en":"To assess the result properly, / researchers must obtain comprehensive and accurate data / from multiple sources.","ko":"결과를 제대로 평가하기 위해, / 연구자들은 포괄적이고 정확한 데이터를 얻어야 한다 / 여러 출처로부터","nat":"결과를 제대로 평가하려면 연구자들은 여러 출처에서 포괄적이고 정확한 데이터를 확보해야 한다."},{"id":"56-4","n":4,"en":"The coach assessed each player's performance / not only to plan future training sessions / but also to determine lineup changes / for upcoming games.","ko":"코치는 각 선수의 성과를 평가했다 / 미래 훈련 일정을 계획하기 위해서뿐만 아니라 / 라인업 변경을 결정하기 위해서도 / 다가오는 경기를 위한","nat":"코치는 앞으로의 훈련 일정을 짜려는 것뿐 아니라 다가오는 경기의 라인업 변경을 정하기 위해서도 각 선수의 경기력을 평가했다."},{"id":"56-5","n":5,"en":"He exchanged dollars for euros in advance / because he thought it might be hard / to find a currency exchange abroad.","ko":"그는 미리 달러를 유로로 환전했다 / 그가 어려울 수도 있다고 생각했기 때문에 / 해외에서 환전소를 찾는 것이","nat":"그는 해외에서 환전소를 찾기 어려울지도 모른다고 생각해서 미리 달러를 유로로 환전했다."},{"id":"56-6","n":6,"en":"I exchanged the T-shirt for a larger size / as I preferred a looser fit / for everyday wear.","ko":"나는 티셔츠를 더 큰 사이즈로 교환했다 / 나는 더 느슨한 핏을 선호했기 때문에 / 일상복으로","nat":"나는 평소에 입을 옷은 더 헐렁한 핏이 좋아서 티셔츠를 더 큰 사이즈로 교환했다."},{"id":"56-7","n":7,"en":"She exchanged her seat for one near the aisle / because she didn't want to disturb others / when going to the restroom.","ko":"그녀는 자신의 자리를 통로 근처 자리로 바꿨다 / 그녀는 다른 사람들을 방해하고 싶지 않았기 때문에 / 화장실에 갈 때","nat":"그녀는 화장실에 갈 때 다른 사람들에게 방해가 되고 싶지 않아서 자리를 통로 근처 자리로 바꿨다."}]},{"d":57,"s":[{"id":"57-1","n":1,"en":"Cheating on the test won't pay in the long run, / even if you get a high score this time, / since you didn't actually understand the material.","ko":"시험에서 부정행위를 하는 것은 장기적으로 도움이 되지 않을 것이다, / 네가 이번에 높은 점수를 받더라도, / 실제로 너는 내용을 이해하지 못했기 때문에","nat":"이번에 높은 점수를 받더라도 실제로는 그 내용을 이해하지 못했기 때문에, 시험에서 부정행위를 하는 것은 장기적으로 득이 되지 않는다."},{"id":"57-2","n":2,"en":"Although he usually uses a credit card, / he paid the taxi driver the fare in cash / after asking for a receipt.","ko":"그는 평소 신용카드를 사용하지만, / 그는 택시 기사에게 요금을 현금으로 지불했다 / 영수증을 요청한 후에","nat":"그는 보통 신용카드를 사용하지만, 영수증을 요청한 뒤 택시 기사에게 요금을 현금으로 냈다."},{"id":"57-3","n":3,"en":"My mom paid me / for helping her finish the garden work / that took all afternoon.","ko":"엄마는 나에게 돈을 주셨다 / 엄마가 정원 일을 끝내도록 도와준 것에 대해 / 오후 내내 걸린","nat":"엄마는 오후 내내 걸린 정원 일을 끝내도록 도와준 대가로 나에게 돈을 주셨다."},{"id":"57-4","n":4,"en":"Seeing our team's leader suddenly freeze from stage fright, / I had to substitute for him / with no time to prepare.","ko":"우리 팀 리더가 무대 공포증으로 갑자기 얼어버리는 것을 보고, / 나는 그를 대신해야 했다 / 준비할 시간도 없이","nat":"우리 팀 리더가 무대 공포증 때문에 갑자기 얼어붙는 것을 보고, 나는 준비할 시간도 없이 그를 대신해야 했다."},{"id":"57-5","n":5,"en":"When I realized / we had run out of sugar while baking, / I had to substitute honey for it, / which surprisingly made the cookies taste even better.","ko":"내가 깨달았을 때 / 우리가 베이킹하는 동안 설탕이 떨어졌다는 것을 / 나는 꿀로 그것을 대체해야 했다 / 그리고 놀랍게도 그것이 쿠키를 훨씬 더 맛있게 만들었다","nat":"베이킹을 하다가 설탕이 다 떨어졌다는 것을 깨닫고 나서, 나는 설탕 대신 꿀을 써야 했는데, 놀랍게도 그 덕분에 쿠키가 훨씬 더 맛있어졌다."},{"id":"57-6","n":6,"en":"He quit playing soccer after the injury / because his doctor explained / that even light training could worsen the condition.","ko":"그는 부상 후 축구를 그만뒀다 / 그의 의사가 설명했기 때문에 / 가벼운 훈련조차도 상태를 악화시킬 수 있다고","nat":"의사가 가벼운 훈련조차 상태를 악화시킬 수 있다고 설명했기 때문에, 그는 부상 이후 축구를 그만두었다."},{"id":"57-7","n":7,"en":"Even though her friend highly recommended the book, / she quit reading it / after losing interest in the first few chapters.","ko":"친구가 그 책을 강력히 추천했음에도 불구하고, / 그녀는 그것을 읽기를 포기했다 / 처음 몇 장에서 흥미를 잃은 후","nat":"친구가 그 책을 강력히 추천했지만, 그녀는 처음 몇 장에서 흥미를 잃은 뒤 그 책 읽기를 그만두었다."}]},{"d":58,"s":[{"id":"58-1","n":1,"en":"Although the rain wasn't heavy, / I objected to going out / because I didn't want my clothes to get wet.","ko":"비가 심하지 않았지만, / 나는 외출하는 것을 반대했다 / 왜냐하면 나는 옷이 젖는 것을 원하지 않았기 때문에","nat":"비가 심하게 오지는 않았지만, 나는 옷이 젖는 것이 싫어서 외출하는 것에 반대했다."},{"id":"58-2","n":2,"en":"We objected to taking the test on Monday, / arguing that we needed at least one more day / to prepare properly.","ko":"우리는 월요일 시험을 치르는 것에 반대했다, / 우리는 최소 하루가 더 필요하다고 주장하며 / 제대로 준비하기 위해","nat":"우리는 제대로 준비하려면 적어도 하루가 더 필요하다고 주장하며 월요일에 시험을 보는 것에 반대했다."},{"id":"58-3","n":3,"en":"My brother prefers soccer to baseball, / especially when he plays with his friends / after school.","ko":"내 남동생은 야구보다 축구를 선호한다, / 특히 친구들과 함께 할 때 / 방과 후에","nat":"내 형제는 야구보다 축구를 더 좋아하는데, 특히 방과 후에 친구들과 함께 놀 때 그렇다."},{"id":"58-4","n":4,"en":"She prefers staying home to going out / because crowded places make her feel tired.","ko":"그녀는 외출하는 것보다 집에 있는 것을 선호한다 / 붐비는 장소가 그녀를 피곤하게 만들기 때문에","nat":"붐비는 장소에 가면 피곤해지기 때문에, 그녀는 외출하는 것보다 집에 있는 것을 더 좋아한다."},{"id":"58-5","n":5,"en":"Although they had different opinions, / they settled the problem / by talking to each other.","ko":"그들이 다른 의견을 가지고 있었지만, / 그들은 문제를 해결했다 / 서로 대화를 통해","nat":"그들은 의견이 서로 달랐지만, 서로 대화를 나누어 문제를 해결했다."},{"id":"58-6","n":6,"en":"Since the hot sun made him even more exhausted after running, / he sat on the chair / to settle his breathing / without saying a word.","ko":"뜨거운 태양이 달리기 후 그를 더욱 지치게 만들었기 때문에, / 그는 의자에 앉았다 / 호흡을 진정시키기 위해 / 말 한마디 없이","nat":"달린 뒤에 뜨거운 햇볕 때문에 더욱 지친 그는, 한마디도 하지 않고 의자에 앉아 숨을 골랐다."},{"id":"58-7","n":7,"en":"Although they had lived in the busy city for many years, / they left it and settled in a small village / near the mountains.","ko":"비록 그들이 번잡한 도시에서 여러 해 동안 살았지만, / 그들은 그곳을 떠나 작은 마을에 정착했다 / 산 근처의","nat":"그들은 여러 해 동안 번잡한 도시에서 살았지만, 그곳을 떠나 산 근처의 작은 마을에 정착했다."}]},{"d":59,"s":[{"id":"59-1","n":1,"en":"We finally gave up waiting for the bus / and decided to walk home / although we were tired.","ko":"우리는 마침내 버스 기다리기를 포기했다 / 그리고 걸어서 집에 가기로 결정했다 / 비록 우리가 피곤했지만","nat":"우리는 피곤했지만 마침내 버스를 기다리는 것을 포기하고 집까지 걸어가기로 했다."},{"id":"59-2","n":2,"en":"I gave up trying to fix the broken bike / and decided to take it to the repair shop / which my friend recommended / for their fast service.","ko":"나는 고장난 자전거를 고치려는 시도를 포기했다 / 그리고 수리점에 가져가기로 결정했다 / 친구가 추천한 / 빠른 서비스 때문에","nat":"나는 고장 난 자전거를 직접 고치려는 것을 포기하고, 친구가 서비스가 빠르다며 추천한 수리점에 가져가기로 했다."},{"id":"59-3","n":3,"en":"The new machine saved the workers some effort / by completing the task / from start to finish on its own.","ko":"새로운 기계는 작업자들의 노력을 절약해 주었다 / 작업을 완료함으로써 / 처음부터 끝까지 혼자서","nat":"그 새 기계는 작업을 처음부터 끝까지 혼자 힘으로 끝내서 노동자들의 수고를 덜어 주었다."},{"id":"59-4","n":4,"en":"She saved her friend a seat / in the front row / which had a better view and sound.","ko":"그녀는 친구를 위해 자리를 맡아두었다 / 앞줄에 / 더 좋은 시야와 음향을 가진","nat":"그녀는 전망과 음향이 더 좋은 앞줄에 친구의 자리를 맡아 주었다."},{"id":"59-5","n":5,"en":"The lifeguard bravely saved the drowning child / after he noticed / that the boy's mother was screaming for help / on the shore.","ko":"인명구조원은 용감하게 익사하는 아이를 구했다 / 그가 알아차린 후 / 그 소년의 어머니가 도움을 요청하며 소리치고 있다는 것을 / 해안에서","nat":"구조대원은 그 소년의 어머니가 해안에서 도와 달라고 소리치고 있는 것을 알아차린 뒤, 물에 빠진 아이를 용감하게 구했다."},{"id":"59-6","n":6,"en":"Polar bears can't survive / if global warming continues to melt the sea ice, / which means we must keep working / to protect the environment.","ko":"북극곰은 생존할 수 없다 / 지구 온난화가 계속해서 바다 얼음을 녹인다면, / 그리고 이것은 우리가 계속 노력해야 한다는 것을 의미한다 / 환경을 보호하기 위해","nat":"지구온난화가 계속 바다 얼음을 녹이면 북극곰은 살아남을 수 없고, 이는 우리가 환경을 보호하기 위해 계속 노력해야 한다는 뜻이다."},{"id":"59-7","n":7,"en":"Even though the land was dry / because it rarely rained, / the seed managed to survive.","ko":"땅이 건조했지만 / 비가 거의 내리지 않았기 때문에, / 씨앗은 어떻게든 생존했다","nat":"비가 거의 내리지 않아 땅이 건조했지만, 그 씨앗은 가까스로 살아남았다."}]},{"d":60,"s":[{"id":"60-1","n":1,"en":"Although there might be some changes, / the teacher will confirm our exam schedule / by tomorrow morning / after reviewing all the details carefully.","ko":"약간의 변경사항이 있을 수 있지만, / 선생님은 우리 시험 일정을 확정할 것이다 / 내일 아침까지 / 모든 세부사항을 주의 깊게 검토한 후","nat":"약간의 변경이 있을 수도 있지만, 선생님은 모든 세부 사항을 꼼꼼히 검토한 뒤 내일 아침까지 우리의 시험 일정을 확정할 것이다."},{"id":"60-2","n":2,"en":"Before making any travel plans, / she wants to confirm the exact flight time / to avoid any confusion about the departure / that can affect our entire trip.","ko":"여행 계획을 세우기 전에, / 그녀는 정확한 비행 시간을 확인하고 싶어한다 / 출발에 대한 혼란을 피하기 위해 / 우리 전체 여행에 영향을 줄 수 있는","nat":"그녀는 여행 계획을 세우기 전에, 전체 여행에 영향을 줄 수 있는 출발 관련 혼란을 피하려고 정확한 비행 시간을 확인하고 싶어 한다."},{"id":"60-3","n":3,"en":"We need to conform to traffic rules / for everyone's safety on the road / when driving in busy areas / where accidents happen more frequently.","ko":"우리는 교통법규를 준수해야 한다 / 도로에서 모든 사람의 안전을 위해 / 분주한 지역에서 운전할 때 / 사고가 더 자주 발생하는","nat":"사고가 더 자주 일어나는 붐비는 지역에서 운전할 때는, 도로 위 모든 사람의 안전을 위해 교통 규칙을 따라야 한다."},{"id":"60-4","n":4,"en":"Although the process is expensive, / the new building will conform to safety standards / for earthquake protection / in order to pass all the inspections / that are required by law.","ko":"비록 과정이 비용이 많이 들지만, / 새 건물은 안전 기준을 준수할 것이다 / 지진 보호를 위한 / 모든 검사를 통과하기 위해 / 법에 의해 요구되는","nat":"그 과정은 비용이 많이 들지만, 새 건물은 법으로 요구되는 모든 검사를 통과하기 위해 지진 방호를 위한 안전 기준에 부합하게 지어질 것이다."},{"id":"60-5","n":5,"en":"Although students were disappointed, / the school decided to postpone holding the sports festival / due to bad weather conditions / that were affecting the entire region.","ko":"학생들이 실망했지만, / 학교는 체육대회 개최를 연기하기로 결정했다 / 악천후 조건으로 인해 / 전 지역에 영향을 미치고 있는","nat":"학생들은 실망했지만, 학교는 지역 전체에 영향을 주고 있던 악천후 때문에 스포츠 축제를 연기하기로 했다."},{"id":"60-6","n":6,"en":"Before making any final decisions, / the company chose to postpone launching the new product / for safety reasons / after discovering some problems / during the testing phase.","ko":"최종 결정을 내리기 전에, / 회사는 신제품 출시를 연기하기로 선택했다 / 안전상의 이유로 / 몇 가지 문제를 발견한 후 / 테스트 단계에서","nat":"그 회사는 최종 결정을 내리기 전에, 테스트 단계에서 몇 가지 문제를 발견한 뒤 안전상의 이유로 신제품 출시를 연기하기로 했다."},{"id":"60-7","n":7,"en":"Even though the deadline is approaching, / we should postpone discussing this topic / until next week, / which will give everyone more time / to think about the details.","ko":"마감일이 다가오고 있지만, / 우리는 이 주제에 대해 논의하는 것을 연기해야 한다 / 다음 주까지, / 그리고 이것은 모든 사람에게 더 많은 시간을 줄 것이다 / 세부 사항에 대해 생각할","nat":"마감일이 다가오고 있지만, 이 주제에 대한 논의는 다음 주로 미루는 것이 좋겠고, 그러면 모두가 세부 사항을 생각할 시간이 더 생길 것이다."}]},{"d":61,"s":[{"id":"61-1","n":1,"en":"They long for weekends / not just for rest, / but for the comfort / that comes from spending time with friends.","ko":"그들은 주말을 갈망한다 / 단지 휴식을 위해서가 아니라, / 안락함을 위해 / 친구들과 시간을 보내는 것에서 오는","nat":"그들은 단지 쉬기 위해서만이 아니라, 친구들과 시간을 보내며 느끼는 편안함 때문에도 주말을 간절히 기다린다."},{"id":"61-2","n":2,"en":"During the long rainy season, / they long for sunny mornings / when they can enjoy walking to school / without worrying about wet shoes or heavy umbrellas.","ko":"긴 장마철 동안, / 그들은 화창한 아침을 갈망한다 / 학교까지 걸어가는 것을 즐길 수 있는 / 젖은 신발이나 무거운 우산을 걱정하지 않고","nat":"기나긴 장마철에는, 젖은 신발이나 무거운 우산을 걱정하지 않고 학교까지 걸어가는 것을 즐길 수 있는 화창한 아침이 간절히 그리워진다."},{"id":"61-3","n":3,"en":"With limited time and ingredients, / he changed the leftover rice into fried rice / that looked like something from a restaurant.","ko":"제한된 시간과 재료로, / 그는 남은 밥을 볶음밥으로 바꿨다 / 레스토랑에서 나온 것 같아 보이는","nat":"한정된 시간과 재료로 그는 남은 밥을 식당에서 나온 것처럼 보이는 볶음밥으로 만들어 냈다."},{"id":"61-4","n":4,"en":"He changed his room into a quiet study place / by placing his desk for better focus / and adding a lamp / that was easy on the eyes.","ko":"그는 자신의 방을 조용한 공부 장소로 바꿨다 / 더 나은 집중을 위해 책상을 배치함으로써 / 그리고 조명을 추가함으로써 / 눈에 편한","nat":"그는 집중이 더 잘되도록 책상을 배치하고 눈이 편안한 램프를 더해서 자신의 방을 조용한 공부 공간으로 바꾸었다."},{"id":"61-5","n":5,"en":"To encourage children to read more, / the library will hold a book fair this weekend / and invite schools / to join reading activities.","ko":"아이들이 더 많이 읽도록 격려하기 위해, / 도서관은 이번 주말에 책 박람회를 열 것이다 / 그리고 학교들을 초대할 것이다 / 독서 활동에 참여하도록","nat":"아이들이 책을 더 많이 읽도록 장려하기 위해, 도서관은 이번 주말에 도서 박람회를 열고 학교들을 독서 활동에 초대할 것이다."},{"id":"61-6","n":6,"en":"This rope is strong enough / to hold not only the weight of the heavy box but also a tent / on a windy day.","ko":"이 밧줄은 충분히 강하다 / 무거운 상자의 무게뿐만 아니라 텐트도 지탱할 수 있을 만큼 / 바람이 부는 날에","nat":"이 밧줄은 튼튼해서 바람 부는 날에도 무거운 상자의 무게뿐만 아니라 텐트까지 지탱할 수 있다."},{"id":"61-7","n":7,"en":"She couldn't hold her anger / during the meeting / because the decision seemed unfair, / but made an effort / to control her voice / and choose her words more carefully.","ko":"그녀는 분노를 참을 수 없었다 / 회의 중에 / 그 결정이 불공평해 보였기 때문에, / 하지만 노력했다 / 그녀의 목소리를 조절하려고 / 그리고 말을 더 신중하게 선택하려고","nat":"그녀는 그 결정이 불공평해 보여서 회의 중에 화를 참을 수 없었지만, 목소리를 조절하고 말을 더 신중하게 고르려고 노력했다."}]},{"d":62,"s":[{"id":"62-1","n":1,"en":"The little frog that lived by the garden / quickly leaped into the clear pond / behind the house / when it heard the footsteps / coming closer.","ko":"정원 옆에 살고 있던 작은 개구리는 / 맑은 연못으로 빠르게 뛰어들었다 / 집 뒤편의 / 그것이 발걸음 소리를 들었을 때 / 가까이 다가오는","nat":"정원 옆에 살던 작은 개구리는 발소리가 점점 가까워지는 것을 듣자 재빨리 집 뒤의 맑은 연못으로 뛰어들었다."},{"id":"62-2","n":2,"en":"When she saw the large dog coming toward her, / she quickly leaped over the wooden fence / that surrounded her backyard.","ko":"그녀가 큰 개가 자신을 향해 다가오는 것을 봤을 때, / 그녀는 나무 울타리를 빠르게 뛰어넘었다 / 그녀의 뒷마당을 둘러싸고 있는","nat":"그녀는 큰 개가 자신에게 다가오는 것을 보자 뒷마당을 둘러싼 나무 울타리를 재빨리 뛰어넘었다."},{"id":"62-3","n":3,"en":"Although the weather was challenging this year, / farmers who worked hard all season / successfully reaped golden wheat / from their fields.","ko":"올해 날씨가 혹독했지만, / 온 계절 동안 열심히 일한 농부들은 / 성공적으로 황금빛 밀을 수확했다 / 그들의 밭에서","nat":"올해는 날씨가 힘들었지만, 시즌 내내 열심히 일한 농부들은 밭에서 황금빛 밀을 무사히 수확했다."},{"id":"62-4","n":4,"en":"Although some subjects are difficult, / good students who study regularly / continue to reap the benefits / that reading books provides / for their academic success.","ko":"일부 과목들이 어렵지만, / 규칙적으로 공부하는 좋은 학생들은 / 계속해서 혜택을 거둔다 / 책 읽기가 제공하는 / 그들의 학업 성공을 위해","nat":"어려운 과목도 있지만, 꾸준히 공부하는 우수한 학생들은 책 읽기가 학업 성공에 가져다주는 이점을 계속 누린다."},{"id":"62-5","n":5,"en":"The skilled doctor treats sick patients / with special medicine / to help them recover quickly / from their illness.","ko":"숙련된 의사는 아픈 환자들을 치료한다 / 특별한 약으로 / 그들이 빠르게 회복하도록 돕기 위해 / 질병으로부터","nat":"숙련된 의사는 아픈 환자들이 병에서 빨리 회복하도록 특별한 약으로 치료한다."},{"id":"62-6","n":6,"en":"Children should treat elderly people / as wise teachers, / showing respect / for the knowledge / they have gained / over many years.","ko":"아이들은 노인들을 대해야 한다 / 현명한 선생님으로, / 존경을 보이며 / 지식에 대해 / 그들이 얻은 / 오랜 세월에 걸쳐.","nat":"아이들은 나이 든 분들이 오랜 세월 쌓아 온 지식에 존경을 표하며 그분들을 현명한 스승으로 대해야 한다."},{"id":"62-7","n":7,"en":"Mom treats us to ice cream / that we love / on hot summer days / because she knows / that cold treats make us happy.","ko":"엄마는 우리에게 아이스크림을 사주신다 / 우리가 좋아하는 / 더운 여름날에 / 왜냐하면 엄마는 알고 계시기 때문에 / 차가운 간식이 우리를 행복하게 한다는 것을","nat":"엄마는 차가운 간식이 우리를 행복하게 한다는 것을 아시기 때문에, 더운 여름날이면 우리가 좋아하는 아이스크림을 사 주신다."}]},{"d":63,"s":[{"id":"63-1","n":1,"en":"Although cold weather can inhibit plant growth / that depends on warm temperatures, / some plants have adapted to survive in harsh conditions.","ko":"추운 날씨가 식물 성장을 억제할 수 있지만 / 따뜻한 온도에 의존하는, / 일부 식물들은 혹독한 환경에서 생존하도록 적응했다","nat":"추운 날씨는 따뜻한 기온에 의존하는 식물의 성장을 억제할 수 있지만, 일부 식물들은 혹독한 환경에서도 살아남도록 적응해 왔다."},{"id":"63-2","n":2,"en":"Because the new policy, / introduced to protect the environment, / inhibits people from using plastic bags, / many of them have started bringing reusable bags / when they go shopping.","ko":"새로운 정책이, / 환경을 보호하기 위해 도입된, / 사람들이 비닐봉지를 사용하는 것을 막기 때문에, / 그들 중 많은 사람들이 재사용 가능한 가방을 가져오기 시작했다 / 그들이 쇼핑하러 갈 때","nat":"환경을 보호하기 위해 도입된 새 정책이 비닐봉지 사용을 막고 있어서, 많은 사람들이 쇼핑하러 갈 때 재사용 가능한 가방을 가져오기 시작했다."},{"id":"63-3","n":3,"en":"Polar bears inhabit the Arctic regions, / but global warming threatens their habitat so much / that they must travel farther / to hunt for seals.","ko":"북극곰들은 북극 지역에 서식한다, / 하지만 지구 온난화가 그들의 서식지를 너무 많이 위협해서 / 그들은 더 멀리 이동해야 할 정도로 / 물개를 사냥하기 위해","nat":"북극곰은 북극 지역에 서식하지만, 지구온난화가 서식지를 심하게 위협해서 바다표범을 사냥하려면 더 멀리 이동해야 한다."},{"id":"63-4","n":4,"en":"Many wild animals that need protection / inhabit this national park / established in 1995, / which means / that people who visit / must be very careful / not to disturb them.","ko":"보호가 필요한 많은 야생동물들이 / 이 국립공원에 서식한다 / 1995년에 설립된, / 그리고 이것은 의미한다 / 방문하는 사람들이 / 매우 조심해야 한다는 것을 / 그들을 방해하지 않도록","nat":"보호가 필요한 많은 야생동물이 1995년에 지정된 이 국립공원에 살고 있으므로, 방문객은 동물들을 방해하지 않도록 매우 조심해야 한다."},{"id":"63-5","n":5,"en":"This book that teachers recommend / relates ancient history / to modern problems / because past events repeat / in different forms / across various cultures.","ko":"선생님들이 추천하는 이 책은 / 고대사를 연관시킨다 / 현대 문제들과 / 왜냐하면 과거 사건들이 반복되기 때문에 / 다른 형태로 / 다양한 문화에 걸쳐","nat":"교사들이 추천하는 이 책은, 과거의 사건이 다양한 문화에서 다른 형태로 반복되기 때문에 고대 역사를 현대의 문제와 연결 짓는다."},{"id":"63-6","n":6,"en":"The research relates exercise / to better memory / because physical activity increases brain function, / which means / that even light exercise like walking / can make a difference.","ko":"연구는 운동을 연관시킨다 / 더 나은 기억력과 / 신체 활동이 뇌 기능을 증가시키기 때문에, / 그리고 이것은 의미한다 / 걷기 같은 가벼운 운동조차도 / 차이를 만들 수 있다는 것을","nat":"그 연구는 신체 활동이 뇌 기능을 높이기 때문에 운동이 기억력 향상과 관련 있다고 보며, 이는 걷기 같은 가벼운 운동도 차이를 만들 수 있다는 뜻이다."},{"id":"63-7","n":7,"en":"The professor relates math concepts / to real-life situations / because students need practical examples / so that even difficult topics become easier to learn.","ko":"교수는 수학 개념을 연관시킨다 / 실생활 상황과 / 학생들이 실용적인 예시를 필요로 하기 때문에 / 어려운 주제들조차도 배우기 더 쉬워지도록","nat":"그 교수는 학생들에게 실용적인 예시가 필요하므로, 어려운 주제도 더 쉽게 배울 수 있도록 수학 개념을 실생활 상황과 연결한다."}]},{"d":64,"s":[{"id":"64-1","n":1,"en":"The guide introduced tourists / to local culture and history, / explaining / that understanding the background / makes travel more meaningful / and helps them leave / with deeper appreciation.","ko":"가이드는 관광객들을 소개했다 / 지역 문화와 역사에, / 설명하며 / 배경을 이해하는 것이 / 여행을 더 의미 있게 만든다고 / 그리고 그들이 떠나는 것을 돕는다고 / 더 깊은 이해를 가지고","nat":"그 가이드는 관광객들에게 지역 문화와 역사를 소개하며, 배경을 이해하면 여행이 더 의미 있어지고 더 깊은 감상을 안고 떠나는 데 도움이 된다고 설명했다."},{"id":"64-2","n":2,"en":"Although children want to eat only tasty food / that they enjoy, / parents should introduce children / to healthy eating habits early / because good nutrition affects their growth and development.","ko":"아이들이 맛있는 음식만 먹고 싶어하지만 / 그들이 즐기는, / 부모들은 아이들을 소개시켜야 한다 / 일찍 건강한 식습관에 / 좋은 영양이 그들의 성장과 발달에 영향을 미치기 때문에","nat":"아이들은 자기가 좋아하는 맛있는 음식만 먹고 싶어 하지만, 좋은 영양이 성장과 발달에 영향을 주기 때문에 부모는 건강한 식습관을 일찍부터 알려 주어야 한다."},{"id":"64-3","n":3,"en":"Students were excited / when the teacher introduced a new student to the class / on Monday morning, / which made the new student feel welcome / from the first day.","ko":"학생들은 흥분했다 / 선생님이 새 학생을 반에 소개했을 때 / 월요일 아침에, / 그리고 이것은 새 학생이 환영받는다고 느끼게 했다 / 첫날부터","nat":"월요일 아침에 선생님이 반에 새 학생을 소개하자 학생들은 신이 났고, 덕분에 새 학생은 첫날부터 환영받는 느낌을 받았다."},{"id":"64-4","n":4,"en":"Many experts believe / that it takes weeks / to adjust to living in a different country with new customs, / which explains / why many people often feel homesick / during their first month.","ko":"많은 전문가들이 믿는다 / 몇 주가 걸린다고 / 새로운 관습이 있는 다른 나라에서 사는 것에 적응하는 데 / 그리고 그것은 설명한다 / 왜 많은 사람들이 종종 향수를 느끼는지를 / 첫 달 동안","nat":"많은 전문가들은 새로운 관습을 가진 다른 나라에서 사는 데 적응하려면 몇 주가 걸린다고 보며, 이는 많은 사람들이 첫 달에 자주 향수병을 느끼는 이유를 설명해 준다."},{"id":"64-5","n":5,"en":"Most teenagers struggle / to adjust to getting up early for school / because they stay up late, / so they should learn / to manage their time better / and go to bed earlier.","ko":"대부분의 십대들은 고생한다 / 학교를 위해 일찍 일어나는 것에 적응하는 데 / 그들이 늦게까지 깨어 있기 때문에, / 그래서 그들은 배워야 한다 / 그들의 시간을 더 잘 관리하는 것을 / 그리고 더 일찍 잠자리에 드는 것을","nat":"대부분의 십대는 늦게까지 깨어 있어서 등교를 위해 일찍 일어나는 데 적응하느라 힘들어하니, 시간을 더 잘 관리하고 더 일찍 자는 법을 배워야 한다."},{"id":"64-6","n":6,"en":"Compared to traditional bulbs, / LED lights give off bright light / but use less electricity, / so many people choose them for their homes / to save money on electric bills.","ko":"전통적인 전구와 비교하여, / LED 조명은 밝은 빛을 발한다 / 하지만 더 적은 전기를 사용한다, / 그래서 많은 사람들이 그들의 집을 위해 그것들을 선택한다 / 전기 요금을 절약하기 위해","nat":"LED 조명은 전통적인 전구에 비해 밝은 빛을 내면서도 전기를 덜 사용하기 때문에, 많은 사람들이 전기 요금을 아끼려고 집에 LED 조명을 선택한다."},{"id":"64-7","n":7,"en":"Many people enjoy walking / when the flowers give off a sweet smell in the park / early in the morning, / and elderly people especially love this quiet time / before the day gets busy.","ko":"많은 사람들이 걷는 것을 즐긴다 / 꽃들이 공원에서 달콤한 향기를 풍길 때 / 이른 아침에, / 그리고 노인들은 특히 이 조용한 시간을 좋아한다 / 하루가 바빠지기 전에","nat":"많은 사람들은 이른 아침 공원에서 꽃들이 달콤한 향기를 풍길 때 걷는 것을 즐기고, 나이 든 사람들은 특히 하루가 바빠지기 전의 이 조용한 시간을 아주 좋아한다."}]}];

 return x.o.slice(0,6).map((o,i)=>{const A=o[2]>o[1]?'<s>'+esc(sj(x.k,[o[1],o[2]]))+'</s>':'',B=o[4]>o[3]?'<u>'+esc(sj(x.c,[o[3],o[4]]))+'</u>':'';
  const tag=o[0]=='replace'?'바뀜':o[0]=='delete'?'빠짐':'추가';const k=ko[i]||{};
  const KA=k.a_ko?'<s>'+esc(k.a_ko)+'</s>':'',KB=k.b_ko?'<u>'+esc(k.b_ko)+'</u>':'';
  return '<div class="chg"><span class="cn">'+(i+1)+'</span><span class="cc">'+tag+'</span> '+A+(A&&B?' &rarr; ':'')+B+((KA||KB)?'<div class="ck">'+KA+(KA&&KB?' &rarr; ':'')+KB+'</div>':'')+'</div>'}).join('')}
const WD=['일','월','화','수','목','금','토'];
const p2=n=>String(n).padStart(2,'0');
function stampHtml(d,v){return '<div class="stp"><div class="stt">Day '+d+' 7문장 노트 완성</div><div class="std">'+v.m+'/'+v.d+'('+v.w+') '+p2(v.h)+':'+p2(v.i)+'</div><div class="small">V SIGNAL Y · 비타민 영어클리닉</div></div>'}
const wordsOf=s=>s.en.replace(/ \/ /g,' ').split(' ');
function ans(s){const parts=s.en.split(' / ');const G=new Set();let c=0;parts.forEach((p,i)=>{c+=p.split(' ').length;if(i<parts.length-1)G.add(c-1)});return G}
function home(){const dn=DAYS.filter(D=>S['D'+D.d]).length;
 let h=wlStrip()+'<h1>오늘의 7문장</h1><p class="sub">책 Day의 7문장을 스스로 슬래시로 끊고 해석한 뒤 정답을 맞춰 봅니다. 1번부터 7번까지 차례로 동사 치기, 슬래시를 하고 정답을 확인합니다. cf. 문장을 만나면 노트 정리가 이어집니다. 통과 기준은 정답률 90% 이상이고, 못 넘으면 결과 화면에 "한번 더"가 나옵니다. 완성 '+dn+'/'+DAYS.length+'일.</p><div class="card"><div class="chips">';
 h+=DAYS.map(D=>{const k=D.s.filter(s=>S[s.id]&&S[s.id].s).length;return '<button class="chip'+(S['D'+D.d]?' done':'')+'" data-d="'+D.d+'">'+D.d+'<small>'+(S['D'+D.d]?S['D'+D.d].m+'/'+S['D'+D.d].d+'('+S['D'+D.d].w+')':k+'/7')+'</small></button>'}).join('')+'</div></div>';
 $.innerHTML=h;$.querySelectorAll('.chip').forEach(b=>b.onclick=()=>openDay(+b.dataset.d));window.scrollTo(0,0)}
let ST={};
const isDone=id=>!!(S[id]&&S[id].s);
function openDay(d){const D=DAYS.find(x=>x.d==d);
 let h='<div class="top"><button class="back" id="bk">&larr; 목록</button><span class="small" style="color:var(--mu);font-size:13px">Day '+d+'</span></div>';

 h+=D.s.map(s=>'<div class="sc" id="sc-'+s.id+'" hidden></div>').join('');

 const first=D.s.find(q=>!isDone(q.id));
 D.s.forEach(q=>{if(isDone(q.id)||q===first||ST[q.id])show(D,q.id)});
 $.querySelectorAll('.sb').forEach(b=>b.onclick=()=>{const id=b.dataset.s;const c=document.getElementById('sc-'+id);if(c.hidden)show(D,id);c.scrollIntoView({behavior:'smooth',block:'start'})});

function mkNote(D,s,AVs,st){
 const W=wordsOf(s),miss=[],ext=[],clean=w=>w.replace(/[.,;:!?“”"]/g,'');
 AVs.forEach(i=>{if(!st.v.has(i))miss.push(clean(W[i]))});st.v.forEach(i=>{if(!AVs.has(i))ext.push(clean(W[i]))});
 const A=ans(s);let gmiss=0;A.forEach(i=>{if(!st.g.has(i))gmiss++});
 const vs=vgroups(s.id).map(g=>g.map(i=>clean(W[i])).join(' ')).join(', '),L=[];
 if(miss.length||ext.length){L.push('동사는 '+esc(vs)+' 입니다.');if(miss.length)L.push('놓친 동사: '+esc(miss.join(', ')));if(ext.length)L.push('동사가 아닌데 고른 것: '+esc(ext.join(', ')))}
 if(gmiss>=2)L.push('끊어 읽기: 슬래시는 의미 덩어리 사이에 넣습니다. 위 문장의 / 표시가 정답입니다.');
 const rows=s.en.split(' / ').map((e,i)=>'<div class="rw"><div class="re">'+esc(e)+'</div><div class="rk">'+esc(s.ko.split(' / ')[i]||'')+'</div></div>').join('');
 return {id:'d'+s.id,src:'day',title:'Day '+D.d+' · '+s.n+'번',html:'<p class="sec">틀린 곳</p><ul class="wul">'+L.map(x=>'<li>'+x+'</li>').join('')+'</ul><p class="sec">직독직해</p>'+rows+'<div class="nat"><b>자연스러운 해석</b>'+esc(s.nat)+'</div>'+dnote(s.id)};
}
function scoreHtml(D){const m=D.s.reduce((a,q)=>a+((S[q.id]&&S[q.id].m)||0),0),T=D.s.reduce((a,q)=>a+((S[q.id]&&S[q.id].t)||0),0),acc=T?Math.max(0,(T-m)/T):1,ok=acc>=0.9;
 return '<div class="scr"><div class="scb '+(ok?'ok':'no')+'">정답률 '+Math.floor(acc*100)+'% · '+(ok?'통과':'한번 더')+'</div>'+(m?'<div class="scl">실수 '+m+'개</div>':'<div class="scl perf">Perfect!</div>')+'<div class="scl sm">통과 기준 : 정답률 90% 이상</div></div>'}
function todayHtml(D){
 return '<div class="tdy"><div class="tdh">오늘의 문장 · 오답노트에 옮겨 써요</div>'+D.s.map(s=>'<div class="tdi"><div class="tdn">'+D.d+'일 · '+s.n+'번</div>'+s.en.split(' / ').map((e,i)=>'<div class="rw"><div class="re">'+esc(e)+'</div><div class="rk">'+esc(s.ko.split(' / ')[i]||'')+'</div></div>').join('')+'<div class="nat"><b>자연스러운 해석</b>'+esc(s.nat)+'</div>'+dnote(s.id)+cfInline(s.id)+'</div>').join('')+'</div>'}
function noteBlockY(D){
 const ids=new Set(D.s.map(q=>'d'+q.id)),n=(wlGet()[wlD()]||[]).filter(e=>ids.has(e.id)).length;
 return '<div class="wbox"><div class="wt">오늘 오답노트</div>'+(n?'<p class="wsub">틀린 문장 '+n+'개. 노트에 쓸 내용이 준비되어 있습니다.</p><a class="nbtn" href="note.html">오늘 오답노트 열기</a>':(D.s.some(q=>S[q.id]&&S[q.id].w)?'<p class="wnone">오답노트는 푼 날에만 열립니다. 이 Day의 틀린 문장은 오늘 기록에 없습니다.</p>':'<p class="wnone">이 Day에서 틀린 문장이 없습니다. 오답노트에 쓸 내용이 없습니다.</p>'))+'<button class="tgl" id="tg">오늘의 문장 다시보기</button><div id="tgb" hidden>'+todayHtml(D)+'</div></div>'}
function wrongHtml(D){const L=D.s.filter(q=>S[q.id]&&S[q.id].w);
 if(!L.length)return '<div class="wbox"><div class="wt">오늘 틀린 문장</div><p class="wnone">오늘 틀린 문장이 없습니다. 모두 잘 해냈어요.</p></div>';
 return '<div class="wbox"><div class="wt">오늘 틀린 문장 '+L.length+'개</div><p class="wsub">오답 노트에 영어 문장과 해석을 옮겨 적으세요.</p>'+L.map(q=>'<div class="wrow"><span class="wn">'+q.n+'번</span><div><div class="wen">'+esc(q.en.replace(/ \/ /g,' '))+'</div><div class="wko">'+esc(q.nat||q.ko)+'</div>'+(S[q.id].r?'<div class="wwhy">틀린 부분: '+esc(S[q.id].r)+'</div>':'')+'</div></div>').join('')+'</div>'}
document.addEventListener('click',function(e){const t=e.target.closest&&e.target.closest('#tg');if(t){const b=document.getElementById('tgb');b.hidden=!b.hidden;t.textContent=b.hidden?'오늘의 문장 다시보기':'접기'}});
function stampInner(D){const d=D.d,st=S['D'+d];const all=D.s.every(q=>isDone(q.id));
 return st?stampHtml(d,st)+scoreHtml(D)+noteBlockY(D):'<button class="btn'+(all?'':' dis')+'" id="mk"'+(all?'':' disabled')+'>Day '+d+' 7문장 노트 완성</button>'+(all?'':'<p class="small">7문장을 모두 확인하면 완성 도장을 받을 수 있습니다.</p>')}
function wireStamp(D){const d=D.d;const mk=document.getElementById('mk');if(mk)mk.onclick=()=>{const n=new Date();const v={m:n.getMonth()+1,d:n.getDate(),w:WD[n.getDay()],h:n.getHours(),i:n.getMinutes()};S['D'+d]=v;save();document.getElementById('st').innerHTML=stampHtml(d,v)+scoreHtml(D)+noteBlockY(D)}}
function cfInline(id){const x=CF.find(y=>y.id==id);if(!x)return '';return '<div class="cfn"><p class="sec">cf. 노트</p><p class="hint">이 문장은 노트에 정리하는 문장입니다. 아래 [이해하기]는 읽기만 하고, 맨 아래 [노트 필기] 상자만 노트에 옮겨 적으세요.</p><p class="sec2">이해하기 (읽기만)</p>'+card(x)+fbox(id)+'</div>'}
function show(D,id){const c=document.getElementById('sc-'+id);c.hidden=false;const s=D.s.find(q=>q.id==id);
 if(!ST[id])ST[id]={v:new Set(),g:new Set(),p:0,r:false,done:isDone(id)&&false};
 const st=ST[id];
 if(isDone(id)&&!st.r&&!st.redo){c.innerHTML='<div class="card"><div class="nh"><b>Day '+D.d+' · '+s.n+'번</b><span class="badge">완료</span></div><p class="ctl">이 문장은 확인을 마쳤습니다.</p><button class="fx" data-redo="1">다시 해 보기</button></div>';const r=c.querySelector('[data-redo]');r.onclick=()=>{st.redo=true;st.v=new Set();st.g=new Set();st.p=0;st.r=false;show(D,id)};return}
 c.innerHTML=sentCard(D,s,st);wire(D,s,st,c)}
function sentCard(D,s,st){const W=wordsOf(s);const A=ans(s);const AV=new Set(VB[s.id]||[]);
 let h='<div class="card"><div class="nh"><b>Day '+D.d+' · '+s.n+'번</b>'+(st.done?'<span class="badge">완료</span>':'')+'</div>';
 if(!st.r&&st.p==0){
  h+='<p class="lab"><span class="pill p-key">1) 동사 치기</span></p><div class="wrd">'+W.map((w,i)=>'<button class="vw'+(st.v.has(i)?' on':'')+'" data-v="'+i+'">'+esc(w)+'</button>').join(' ')+'</div>'+
  '<p class="ctl">동사를 모두 누르면 자동으로 다음으로 넘어갑니다. 조동사와 본동사, 구동사(handed in)는 한 번만 눌러도 함께 선택됩니다.</p><button class="btn dis nx" disabled>다음: 슬래시 긋기</button>';
 }else if(!st.r){
  h+='<p class="lab"><span class="pill p-key">2) 슬래시로 끊어 읽기</span></p><div class="wrd">'+W.map((w,i)=>'<span class="vw'+(st.v.has(i)?' on':'')+'">'+esc(w)+'</span>'+(i<W.length-1?'<button class="gp'+(st.g.has(i)?' on':'')+'" data-g="'+i+'"></button>':'')).join('')+'</div>'+
  '<p class="ctl">끊어 읽을 곳을 누르면 슬래시가 들어가고, 다 끊으면 정답이 자동으로 열립니다.</p><p class="step">슬래시 단위로 한글 직역과 자연스러운 해석은 노트에 연필로 씁니다.</p><button class="btn dis rv" disabled>정답 보기</button><p class="ctl lk"></p><button class="fx bk1">동사 다시 고르기</button>';
 }else{
  const vc=i=>{const a=AV.has(i),m=st.v.has(i);return a&&m?'vok':a?'vms':m?'vex':''};
  h+='<p class="lab"><span class="pill p-nat">정답과 비교</span></p><div class="wrd">'+W.map((w,i)=>{const t='<span class="vw '+vc(i)+((SF[s.id]||[]).includes(i)?' sft':'')+'">'+esc(w)+'</span>';if(i<W.length-1){const a=A.has(i),m=st.g.has(i);const c=a&&m?'ok':a?'miss':m?'ex':'';return t+'<button class="gp '+c+'" disabled></button>'}return t}).join('')+'</div>'+
  '<p class="ctl">밑줄이 동사입니다. 초록은 맞힌 동사, 노랑은 놓친 동사, 빨강 취소선은 동사가 아닌데 고른 것입니다. 슬래시는 초록이 같이 끊은 곳, 노랑이 놓친 곳, 빨강이 더 끊은 곳입니다. 끊는 위치가 조금 달라도 의미 덩어리로 읽었다면 괜찮습니다. 연한 점선은 동사 뒤에 늘 붙어 다니는 전치사로, 동사로 세지는 않지만 함께 외우면 좋습니다.</p>'+
  '<p class="sec">직독직해</p>'+s.en.split(' / ').map((e,i)=>'<div class="rw"><div class="re">'+esc(e)+'</div><div class="rk">'+esc(s.ko.split(' / ')[i]||'')+'</div></div>').join('')+
  '<div class="nat"><b>자연스러운 해석</b>'+esc(s.nat)+'</div>'+dnote(s.id)+cfInline(s.id)+(st.done?'':'<button class="btn dn">'+(CF.some(x=>x.id==s.id)?'노트 정리 끝, 다음 문장':'비교 끝, 다음 문장')+'</button>');
 }
 return h+'</div>'}
const ADV=new Set(['not','never','always','often','also','still','just','only','already','even','really','finally','ever','now','then','almost','sometimes','usually','rarely','hardly','soon','nearly','quickly','carefully','n\'t','either','too','both']);
const AUXS=new Set(['is','are','was','were','be','been','being','am','have','has','had','do','does','did','can','could','will','would','shall','should','may','might','must','cannot','dont','didnt','doesnt','cant','couldnt','wont','wouldnt','shouldnt','mustnt','isnt','arent','wasnt','werent','havent','hasnt','hadnt','lets']);
const PARTS=new Set(['in','out','up','off','on','forward','over','down','away','back','along','around','through']);
const cl=w=>w.toLowerCase().replace(/[.,;!?]/g,'').replace(/[’']/g,'');
const isAux=w=>{const c=cl(w);return AUXS.has(c)||/(s|re|ve|ll|d)$/.test(c)&&/[’']/.test(w)};
const PRON=new Set(['i','you','he','she','it','we','they','this','that','there']);
function vgroups(id){const v=(VB[id]||[]).slice().sort((a,b)=>a-b);const tk=wordsOf(DAYS.flatMap(d=>d.s).find(q=>q.id==id));const G=[];let cur=[];
 v.forEach(i=>{if(!cur.length){cur=[i];return}const last=cur[cur.length-1];let ok=false;
  if(/[,“]$/.test(tk[last])||/^[“"]/.test(tk[i])){G.push(cur);cur=[i];return}
  if(i==last+1)ok=isAux(tk[last])||!isAux(tk[i]);
  else if(i-last<=3&&isAux(tk[last])){ok=true;for(let k=last+1;k<i;k++){const w=cl(tk[k]);if(!(ADV.has(w)||(k==last+1&&i-last>=2&&PRON.has(w))||/ly$/.test(w)||(w=='to'&&/^(have|has|had)$/.test(cl(tk[last])))))ok=false}}
  if(ok)cur.push(i);else{G.push(cur);cur=[i]}});if(cur.length)G.push(cur);return G}
function wire(D,s,st,c){const id=s.id;
 const GR=vgroups(id);const NV=GR.length,NG=ans(s).size;const unitOf=i=>GR.find(g=>g.includes(i))||[i];
 const units=()=>{const seen=new Set();st.v.forEach(i=>seen.add(unitOf(i).join(',')));return seen.size};
 const q=sel=>c.querySelector(sel),qa=sel=>c.querySelectorAll(sel);
 const chkv=()=>{const nx=q('.nx');if(!nx)return;const ok=st.v.size>=1;nx.disabled=!ok;nx.classList.toggle('dis',!ok)};
 qa('.vw[data-v]').forEach(b=>b.onclick=()=>{const i=+b.dataset.v;const u=unitOf(i);const on=u.every(x=>st.v.has(x));u.forEach(x=>on?st.v.delete(x):st.v.add(x));u.forEach(x=>{const e=q('.vw[data-v="'+x+'"]');if(e)e.classList.toggle('on',!on)});chkv();if(units()==NV)setTimeout(()=>{if(!st.r&&st.p==0&&units()==NV){st.p=1;show(D,id)}},450)});chkv();
 const nx=q('.nx');if(nx)nx.onclick=()=>{st.p=1;show(D,id)};
 const bk1=q('.bk1');if(bk1)bk1.onclick=()=>{st.p=0;show(D,id)};
 const chk=()=>{const rv=q('.rv');if(!rv)return;const ok=st.g.size>=1;rv.disabled=!ok;rv.classList.toggle('dis',!ok);const lk=q('.lk');if(lk)lk.style.display=ok?'none':''};
 qa('.gp[data-g]').forEach(b=>b.onclick=()=>{const i=+b.dataset.g;st.g.has(i)?st.g.delete(i):st.g.add(i);b.classList.toggle('on');chk();if(st.g.size==NG)setTimeout(()=>{if(!st.r&&st.p==1&&st.g.size==NG){st.r=true;show(D,id)}},450)});chk();
 const rv=q('.rv');if(rv)rv.onclick=()=>{st.r=true;show(D,id)};
 const dn=q('.dn');if(dn)dn.onclick=()=>{const AVs=new Set(VB[id]||[]),As=ans(s);let vm=0,gm=0;AVs.forEach(i=>{if(!st.v.has(i))vm++});st.v.forEach(i=>{if(!AVs.has(i))vm++});As.forEach(i=>{if(!st.g.has(i))gm++});const bad=vm>0||gm>=2;if(bad)wlPut(mkNote(D,s,AVs,st));const pv=S[id]||{};S[id]={s:1,t:NV+NG,m:Math.max(pv.m||0,vm+gm),w:(pv.w||bad)?1:0,r:[vm?'동사':'',gm>=2?'끊어 읽기':''].filter(Boolean).join(', ')||pv.r||''};save();st.done=true;show(D,id);
  const nb=document.querySelector('.sb[data-s="'+id+'"]');if(nb)nb.classList.add('done');
  const nxt=D.s.find(q2=>!isDone(q2.id));
  if(nxt){show(D,nxt.id);document.getElementById('sc-'+nxt.id).scrollIntoView({behavior:'smooth',block:'start'})}
  else{const stp=document.getElementById('st');stp.innerHTML=stampInner(D);wireStamp(D);stp.scrollIntoView({behavior:'smooth',block:'center'})}}}
home();
</script></body></html>
