 "ko": "~도 아닌", "ok": false, "why": "neither와 짝으로 쓰는 말이라서 틀려요."}, {"n": "③", "en": "either", "ko": "둘 중 하나", "ok": false, "why": "either는 or와 짝이라서 틀려요."}, {"n": "④", "en": "neither", "ko": "둘 다 아닌", "ok": false, "why": "nor와 짝이고 부정의 뜻이라 안전했다는 내용과 맞지 않아요."}, {"n": "⑤", "en": "not only", "ko": "~뿐만 아니라", "ok": false, "why": "but also와 짝이라서 틀려요."}], "pencil": "both는 ___와 짝을 이룬다", "pencilKey": "and", "page": 150, "sec": "s1"}, {"id": "S1-16", "step": 1, "no": 16, "qtype": "유형 03 상관접속사", "type": "mc", "ans": "②", "concept": ["038"], "gap": "", "words": [["stay with", "~와 함께 지내다"]], "h1": "두 문장은 '나와 함께 지낼 수 있다'와 '또는 Lily와 지낼 수 있다'예요. 둘 중 하나를 고르는 뜻이에요.", "h2": "둘 중 하나를 고르는 뜻의 상관접속사를 쓰고, A와 B 자리에 with me, with Lily가 같은 모양으로 들어가야 해요.", "why": "'나와 또는 Lily와'는 either A or B(A 또는 B 둘 중 하나)로 써요. with me와 with Lily를 같은 모양으로 맞춰요.", "opts": [{"n": "①", "en": "You can stay both me and Lily.", "ko": "너는 나와 Lily 둘 다 지낼 수 있다.", "ok": false, "why": "both는 and와 짝이고 문장 구조도 틀려요."}, {"n": "②", "en": "You can stay either with me or with Lily.", "ko": "너는 나와 함께 있거나 Lily와 함께 있을 수 있다.", "ok": true, "why": "either A or B로 알맞게 연결했어요."}, {"n": "③", "en": "You can stay neither with me nor with Lily.", "ko": "너는 나와도 Lily와도 함께 있을 수 없다.", "ok": false, "why": "부정의 뜻이 되어 원래 문장과 달라요."}, {"n": "④", "en": "You can stay not with me but with Lily.", "ko": "너는 나와 있는 게 아니라 Lily와 있을 수 있다.", "ok": false, "why": "'나와는 안 되고 Lily와만'이라는 뜻이라 원래 문장과 달라요."}, {"n": "⑤", "en": "You can stay with me as well as Lily.", "ko": "너는 Lily뿐만 아니라 나와도 지낼 수 있다.", "ok": false, "why": "'둘 중 하나'가 아니라 '둘 다'의 뜻이라서 달라요."}], "pencil": "둘 중 하나를 고르는 뜻은 ___ A or B로 쓴다", "pencilKey": "either", "page": 150, "sec": "s1"}, {"id": "S1-17", "step": 1, "no": 17, "qtype": "유형 03 상관접속사", "type": "mc", "ans": "①", "concept": ["038"], "gap": "", "words": [["cartoon", "만화"], ["lie", "거짓말하다(과거 lied)"], ["several", "여러 번의"]], "h1": "두 문장 모두 not only, not just 같은 말이 앞에 있어요. 이 말과 짝을 이루는 접속사를 찾아요.", "h2": "'A뿐만 아니라 B도'와 'A가 아니라 B'를 나타내는 두 표현의 뒷부분이 같은 말이에요. 뒤 말이 같은 한 단어예요.", "why": "not only A but (also) B와 not A but B 둘 다 but으로 연결해요.", "opts": [{"n": "①", "en": "but", "ko": "그러나", "ok": true, "why": "두 구문 모두 but과 짝이라서 맞아요."}, {"n": "②", "en": "and", "ko": "그리고", "ok": false, "why": "not only와는 짝이 되지 않아요."}, {"n": "③", "en": "or", "ko": "또는", "ok": false, "why": "either와 짝이라서 틀려요."}, {"n": "④", "en": "nor", "ko": "~도 아닌", "ok": false, "why": "neither와 짝이라서 틀려요."}, {"n": "⑤", "en": "for", "ko": "왜냐하면", "ok": false, "why": "이유의 접속사라서 뜻이 맞지 않아요."}], "pencil": "not only A ___ also B 라는 짝을 이룬다", "pencilKey": "but", "page": 151, "sec": "s1"}, {"id": "S1-18", "step": 1, "no": 18, "qtype": "유형 03 상관접속사", "type": "mc", "ans": "③", "concept": ["037-H1", "038"], "gap": "", "words": [["felt", "느꼈다(원형 feel 느끼다)"], ["nervous", "긴장한"], ["excited", "신이 난"], ["joyful", "기쁜"], ["relaxed", "느긋한"]], "h1": "both A and B에서 A와 B는 같은 모양이어야 해요. 그리고 felt(원형 feel 느끼다) 뒤에는 어떤 품사가 오는지 떠올려 보세요.", "h2": "feel(느끼다)은 감각동사라서 뒤에 형용사가 와요. 빈칸 두 개가 모두 형용사인 보기를 찾으세요. -ly로 끝나는 말은 부사일 수 있어요.", "why": "feel 뒤에는 형용사가 오고, both A and B에서 A와 B는 같은 품사여야 해요. nervous와 excited가 둘 다 형용사예요.", "opts": [{"n": "①", "en": "angry – sadly", "ko": "화난 – 슬프게", "ok": false, "why": "sadly는 부사라서 틀려요."}, {"n": "②", "en": "happily – sadly", "ko": "행복하게 – 슬프게", "ok": false, "why": "둘 다 부사라서 feel 뒤에 쓸 수 없어요."}, {"n": "③", "en": "nervous – excited", "ko": "긴장한 – 신이 난", "ok": true, "why": "둘 다 형용사라서 맞아요."}, {"n": "④", "en": "joyful – angrily", "ko": "기쁜 – 화나서", "ok": false, "why": "angrily는 부사라서 틀려요."}, {"n": "⑤", "en": "relaxed – joy", "ko": "느긋한 – 기쁨", "ok": false, "why": "relaxed는 형용사인데 joy는 명사라서 짝이 안 맞아요."}], "pencil": "both A and B에서 A와 B는 ___가 같아야 한다", "pencilKey": "품사", "page": 151, "sec": "s1"}, {"id": "S1-19", "step": 1, "no": 19, "qtype": "유형 03 상관접속사", "type": "mc", "ans": "③", "concept": ["038"], "gap": "", "words": [["favorite", "가장 좋아하는"], ["subject", "과목"], ["science", "과학"], ["history", "역사"]], "h1": "B의 말에서 '과학도 역사도 아니고 수학을 제일 좋아한다'는 내용을 찾아보세요. 두 개를 모두 부정하고 있어요.", "h2": ": "'A와 B 둘 다'를 뜻하는 상관접속사는 첫 칸과 둘째 칸이 짝이에요. 첫 칸은 A 앞에, 둘째 칸은 A와 B 사이에 들어가요.", "why": "'A와 B 둘 다'는 both A and B예요. both the advantages and disadvantages가 돼요.", "opts": [], "pencil": "'A와 B 둘 다'는 ___ A and B이다", "pencilKey": "both", "page": 151, "sec": "s1"}, {"id": "S1-22", "step": 1, "no": 22, "qtype": "유형 03 상관접속사", "type": "write", "ans": "either", "concept": ["038"], "gap": "", "words": [["French", "프랑스 사람"], ["Italian", "이탈리아 사람"]], "h1": "B의 말은 'Eva는 프랑스 사람이거나 이탈리아 사람인 것 같다'는 뜻이에요. 둘 중 하나라는 뜻이 필요해요.", "h2": "빈칸 뒤에 or이 있으니 or와 짝이 되는 말을 쓰세요.", "why": "'프랑스인 또는 이탈리아인 둘 중 하나'이므로 either A or B를 써서 either French or Italian이 돼요.", "opts": [], "pencil": "'A 또는 B 둘 중 하나'는 ___ A or B이다", "pencilKey": "either", "page": 151, "sec": "s1"}, {"id": "S1-23", "step": 1, "no": 23, "qtype": "유형 03 상관접속사", "type": "write", "ans": "This laptop is not only cheap but also very useful.", "concept": ["038", "037-H1"], "gap": "", "words": [["laptop", "노트북"], ["cheap", "값이 싼"], ["useful", "유용한"]], "h1": "'가격이 쌀 뿐만 아니라 매우 유용하다'는 not only A but also B를 쓰는 문장이에요. be동사 뒤에 A와 B를 넣어요.", "h2": "주어는 This laptop이고 동사는 is예요. A와 B 자리에는 cheap(값이 싼)과 very useful(매우 유용한)처럼 같은 종류의 말이 와요.", "why": "This laptop is로 시작하고 not only cheap but also very useful로 이어요. 두 말 모두 형용사예요.", "opts": [], "pencil": "not only A but also B에서 A와 B는 ___가 같은 말이다", "pencilKey": "품사", "page": 151, "sec": "s1"}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 03 상관접속사", "type": "write", "ans": "I as well as Wendy have to do the work.", "concept": ["038-2", "038"], "gap": "", "words": [["as well as", "~뿐만 아니라 ...도"], ["have to", "~해야 한다"]], "h1": "not only A but also B와 B as well as A는 같은 뜻이에요. 두 문장에서 어떤 말이 앞으로 가는지 보세요.", "h2": "Not only Wendy but also I에서 but also 뒤에 있던 I가 as well as 문장에서는 맨 앞으로 와요. 그리고 동사는 맨 앞에 온 말에 맞춰요.", "why": "not only A but also B는 B as well as A로 바꿔요. 주어 I에 맞게 have to를 그대로 써서 I as well as Wendy have to do the work.가 돼요.", "opts": [], "pencil": "not only A but also B는 ___ as well as A로 바꿔 쓴다", "pencilKey": "B", "page": 151, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 03 상관접속사", "type": "mc", "ans": "④", "concept": ["038"], "gap": "", "words": [["principal", "교장"], ["dive", "뛰어들다"], ["popular", "인기 있는"]], "h1": "상관접속사가 주어일 때 동사가 어느 쪽에 맞는지 문장마다 확인해 보세요. 어색한 문장을 고르는 문제예요.", "h2": "neither A nor B, either A or B는 동사를 B에 맞춰요. both A and B는 늘 복수예요. 문장마다 B와 동사의 수가 맞는지 비교해 보세요.", "why": "neither I nor he에서 B는 he(3인칭 단수)라서 are가 아니라 is여야 해요.", "opts": [{"n": "①", "en": "Brenda as well as I is from Busan, Korea.", "ko": "나뿐만 아니라 Brenda도 한국 부산 출신이다.", "ok": false, "why": "B as well as A에서 동사는 맨 앞의 Brenda에 맞추니 is가 맞아요."}, {"n": "②", "en": "Either you or she has to pay for lunch.", "ko": "너 또는 그녀 둘 중 한 명이 점심값을 내야 한다.", "ok": false, "why": "B인 she에 맞춰 has가 맞아요."}, {"n": "③", "en": "She's not the principal but a math teacher.", "ko": "그녀는 교장이 아니라 수학 선생님이다.", "ok": false, "why": "not A but B가 올바르게 쓰였어요."}, {"n": "④", "en": "Neither I nor he are going to dive first.", "ko": "나도 그도 먼저 뛰어들지 않을 것이다.", "ok": true, "why": "B인 he에 맞춰 is going이어야 해서 어색해요."}, {"n": "⑤", "en": "Both Yuna and Jessica are popular among boys.", "ko": "Yuna와 Jessica 둘 다 남자아이들 사이에서 인기가 있다.", "ok": false, "why": "both A and B는 복수라서 are가 맞아요."}], "pencil": "neither A nor B가 주어이면 동사는 ___에 맞춘다", "pencilKey": "B", "page": 151, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "②", "concept": ["038"], "gap": "", "words": [["favorite", "가장 좋아하는"], ["beef", "소고기"], ["chicken", "닭고기"], ["outdoor", "야외의"]], "h1": "다섯 문장의 접속사와 동사의 수를 하나씩 확인하세요. 어색한 문장을 고르는 문제예요.", "h2": "both A and B가 주어이면 동사를 단수로 받을까요, 복수로 받을까요? 문장마다 주어와 동사의 수를 살펴보세요.", "why": "both A and B는 A와 B가 합쳐져서 항상 복수예요. 그래서 is가 아니라 are여야 해요.", "opts": [{"n": "①", "en": "It's an old car, but it's very fast.", "ko": "그것은 오래된 차지만 매우 빠르다.", "ok": false, "why": "앞뒤가 반대 내용이라서 but이 알맞아요."}, {"n": "②", "en": "Both swimming and skiing is my favorite sports.", "ko": "수영과 스키 둘 다 내가 가장 좋아하는 스포츠다.", "ok": true, "why": "both A and B는 복수 취급해서 is가 아니라 are여야 해요."}, {"n": "③", "en": "Which do you like better, beef or chicken?", "ko": "소고기와 닭고기 중 어느 것을 더 좋아하니?", "ok": false, "why": "둘 중 하나를 고르는 질문이라 or가 맞아요."}, {"n": "④", "en": "She is rich, but she is not always happy.", "ko": "그녀는 부유하지만 항상 행복한 것은 아니다.", "ok": false, "why": "반대 내용이라 but이 맞아요."}, {"n": "⑤", "en": "Neither Jason nor I like doing outdoor activities.", "ko": "Jason도 나도 야외 활동을 좋아하지 않는다.", "ok": false, "why": "동사를 B인 I에 맞춰 like가 맞아요."}], "pencil": "both A and B가 주어이면 동사는 ___로 받는다", "pencilKey": "복수", "page": 152, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "④", "concept": ["037"], "gap": "", "words": [["wave at", "~에게 손을 흔들다(과거 waved at)"], ["pretend", "~인 척하다"], ["notice", "알아차리다"], ["password", "비밀번호"], ["log in", "로그인하다"]], "h1": "첫 문장은 '손을 흔들었다'와 '모른 척했다'의 관계, 둘째 문장은 '비밀번호를 잊었다'와 '로그인하지 못했다'의 관계를 따져 보세요.", "h2": "앞뒤가 반대이면 but, 앞이 이유이고 뒤가 결과이면 so를 써요. 두 문장이 각각 어느 경우인지 정하세요.", "why": "손을 흔들었는데 모른 척했다는 반대 내용이라서 but이고, 비밀번호를 잊어서 로그인을 못 했다는 원인과 결과라서 so예요.", "opts": [{"n": "①", "en": "or – but", "ko": "또는 – 그러나", "ok": false, "why": "첫 빈칸에 or는 뜻이 맞지 않아요."}, {"n": "②", "en": "and – but", "ko": "그리고 – 그러나", "ok": false, "why": "첫 빈칸은 반대 내용이라 and는 어색해요."}, {"n": "③", "en": "but – for", "ko": "그러나 – 왜냐하면", "ok": false, "why": "둘째 문장은 이유가 아니라 결과라서 for는 틀려요."}, {"n": "④", "en": "but – so", "ko": "그러나 – 그래서", "ok": true, "why": "반대와 결과의 뜻이 모두 맞아요."}, {"n": "⑤", "en": "so – or", "ko": "그래서 – 또는", "ok": false, "why": "첫 빈칸에 so는 맞지 않아요."}], "pencil": "앞이 원인이고 뒤가 결과이면 ___를 쓴다", "pencilKey": "so", "page": 152, "sec": "s2"}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "③", "concept": ["038", "037-H1"], "gap": "", "words": [["expert", "전문가"], ["reflect", "반영하다"], ["character", "성격"], ["effect", "영향"]], "h1": "밑줄 친 not only와 짝을 이루는 말이 있어야 해요. 뒤에서 짝이 되는 표현을 찾아보세요.", "h2": "'A뿐만 아니라 B도'는 not only A but also B로 써요. 밑줄 친 각 부분이 이 짝에 맞는지 확인하세요.", "why": "not only와 짝은 but also인데 and also로 썼어요. and를 but으로 고쳐야 해요.", "opts": [{"n": "①", "en": "not only", "ko": "~뿐만 아니라", "ok": false, "why": "not only A but also B의 앞부분이라 맞아요."}, {"n": "②", "en": "reflect our character", "ko": "우리의 성격을 반영하다", "ok": false, "why": "A 자리에 들어간 동사구라서 맞아요."}, {"n": "③", "en": "and also", "ko": "그리고 또한", "ok": true, "why": "not only와 짝은 but also라서 and를 but으로 고쳐야 해서 어색해요."}, {"n": "④", "en": "have a great effect", "ko": "큰 영향을 미치다", "ok": false, "why": "B 자리에 A와 같은 동사구라서 맞아요."}, {"n": "⑤", "en": "on us", "ko": "우리에게", "ok": false, "why": "전치사 on이 문장에 맞게 쓰였어요."}], "pencil": "not only와 짝이 되는 말은 ___ also이다", "pencilKey": "but", "page": 152, "sec": "s2"}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "①", "concept": ["038"], "gap": "", "words": [["courage", "용기"], ["faith", "신뢰"]], "h1": "우리말은 '용기가 아니라 신뢰'예요. 둘 중 하나를 부정하고 하나를 고르는 뜻이에요.", "h2": "'A가 아니라 B'를 말하는 짝 표현을 떠올려 보세요. 보기 중 같은 뜻의 짝이 하나만 있어요.", "why": "'A가 아니라 B'는 not A but B예요. not courage but faith가 돼요.", "opts": [{"n": "①", "en": "not courage but faith", "ko": "용기가 아니라 신뢰", "ok": true, "why": "'A가 아니라 B'라서 맞아요."}, {"n": "②", "en": "both courage and faith", "ko": "용기와 신뢰 둘 다", "ok": false, "why": "'둘 다'라는 뜻이라 틀려요."}, {"n": "③", "en": "courage as well as faith", "ko": "신뢰뿐만 아니라 용기도", "ok": false, "why": "'둘 다'라는 뜻이라 틀려요."}, {"n": "④", "en": "either courage or faith", "ko": "용기 또는 신뢰 둘 중 하나", "ok": false, "why": "'둘 중 하나'라는 뜻이라 틀려요."}, {"n": "⑤", "en": "not only faith but also courage", "ko": "신뢰뿐만 아니라 용기도", "ok": false, "why": "'둘 다'라는 뜻이라 틀려요."}], "pencil": "'A가 아니라 B'는 not A ___ B로 쓴다", "pencilKey": "but", "page": 152, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "「명령문, and/or ~」 / 상관접속사", "type": "mc", "ans": "⑤", "concept": ["042-2", "038"], "gap": "", "words": [["slow down", "속도를 줄이다"], ["crash", "충돌하다"], ["catch a cold", "감기에 걸리다(과거 caught a cold)"], ["refuse", "거절하다"], ["invitation", "초대"]], "h1": "다섯 문장에서 빈칸에 들어가는 접속사를 하나씩 정해 보세요. 나머지 넷과 다른 하나를 찾아요.", "h2": "나쁜 결과를 말하는 명령문에는 or가 들어가요. either와 not only처럼 짝으로 쓰는 표현은 짝이 되는 말이 정해져 있어요. 문장마다 빈칸에 들어갈 말을 정해 보세요.", "why": "①~④는 모두 or가 들어가고, ⑤는 not only A but also B라서 but이 들어가요.", "opts": [{"n": "①", "en": "Slow down, ___ you might crash.", "ko": "속도를 줄여라, 안 그러면 충돌할 수도 있어.", "ok": false, "why": "나쁜 결과라서 or가 들어가요."}, {"n": "②", "en": "Hurry up, ___ you'll be late for the meeting.", "ko": "서둘러라, 안 그러면 회의에 늦을 거야.", "ok": false, "why": "나쁜 결과라서 or가 들어가요."}, {"n": "③", "en": "Dry your wet hair, ___ you'll catch a cold.", "ko": "젖은 머리를 말려라, 안 그러면 감기에 걸릴 거야.", "ok": false, "why": "나쁜 결과라서 or가 들어가요."}, {"n": "④", "en": "You can either accept ___ refuse the invitation.", "ko": "너는 그 초대를 받아들이거나 거절할 수 있다.", "ok": false, "why": "either A or B라서 or가 들어가요."}, {"n": "⑤", "en": "The 2002 World Cup was held not only in Korea ___ also in Japan.", "ko": "2002 월드컵은 한국뿐만 아니라 일본에서도 열렸다.", "ok": true, "why": "not only A but also B라서 but이 들어가요. 나머지 넷과 달라요."}], "pencil": "not only A ___ also B에는 but이 들어간다", "pencilKey": "but", "page": 152, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "①", "concept": ["037", "038"], "gap": "", "words": [["release", "발표하다"], ["for some reason", "어떤 이유로"], ["hardly", "거의 ~않다"], ["either", "둘 중 하나"]], "h1": "세 빈칸을 하나씩 풀어요. 첫째는 either와 짝이고, 둘째와 셋째는 앞뒤 문장 관계를 보세요.", "h2": "둘째 문장은 팔이 아프다는 원인과 가방을 못 든다는 결과예요. 셋째 문장은 영화를 두 번 봤다는 것과 거의 기억나지 않는다는 것이 서로 반대예요.", "why": "either 뒤에는 or, 원인과 결과에는 so, 반대 내용에는 but이 들어가서 or – so – but이에요.", "opts": [{"n": "①", "en": "or – so – but", "ko": "또는 – 그래서 – 그러나", "ok": true, "why": "세 빈칸이 모두 맞아요."}, {"n": "②", "en": "but – and – for", "ko": "그러나 – 그리고 – 왜냐하면", "ok": false, "why": "첫 빈칸은 either와 짝인 or여야 해서 틀려요."}, {"n": "③", "en": "for – or – and", "ko": "왜냐하면 – 또는 – 그리고", "ok": false, "why": "첫 빈칸이 either와 짝이 아니라서 틀려요."}, {"n": "④", "en": "nor – and – or", "ko": "~도 아닌 – 그리고 – 또는", "ok": false, "why": "첫 빈칸이 either와 짝이 아니라서 틀려요."}, {"n": "⑤", "en": "but – nor – so", "ko": "그러나 – ~도 아닌 – 그래서", "ok": false, "why": "첫 빈칸이 either와 짝이 아니라서 틀려요."}], "pencil": "either 뒤에는 짝인 ___가 온다", "pencilKey": "or", "page": 152, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "③", "concept": ["038", "042"], "gap": "", "words": [["mix", "섞다"], ["cycle", "자전거를 타다"], ["jog", "조깅하다"], ["opinion", "의견"], ["punish", "벌주다"]], "h1": "다섯 문장의 접속사 짝과 동사의 수를 모두 확인하세요. 어색한 문장 하나를 고르는 문제예요.", "h2": "neither가 있을 때 뒤에 오는 짝 말은 무엇일까요? 짝 표현과 동사의 수가 맞는지 문장마다 살펴보세요.", "why": "neither A nor B(A도 B도 아닌)가 되어야 해서 or를 nor로 고쳐야 해요.", "opts": [{"n": "①", "en": "Mix white with red, and you'll get pink.", "ko": "흰색을 빨간색과 섞어라, 그러면 분홍색을 얻을 거야.", "ok": false, "why": "좋은 결과라서 and가 맞아요."}, {"n": "②", "en": "Ian enjoys cycling as well as jogging.", "ko": "Ian은 조깅뿐만 아니라 자전거 타기도 즐긴다.", "ok": false, "why": "cycling과 jogging이 같은 모양이라 맞아요."}, {"n": "③", "en": "I'm neither for or against your opinion.", "ko": "나는 너의 의견에 찬성하지도 반대하지도 않는다.", "ok": true, "why": "neither와 짝은 nor라서 or를 nor로 고쳐야 해서 어색해요."}, {"n": "④", "en": "Unless you do your homework, you'll be punished.", "ko": "숙제를 하지 않으면 벌을 받을 것이다.", "ok": false, "why": "unless 뒤에 not 없이 맞게 썼어요."}, {"n": "⑤", "en": "Either I or my brother has to visit our grandparents.", "ko": "나 또는 내 형제 둘 중 한 명이 조부모님을 방문해야 한다.", "ok": false, "why": "B인 my brother에 맞춰 has가 맞아요."}], "pencil": "neither의 짝은 ___이다", "pencilKey": "nor", "page": 152, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "「명령문, and/or ~」", "type": "write", "ans": "Wake up now, or you will miss the school bus.", "concept": ["042-2"], "gap": "", "words": [["wake up", "일어나다"], ["miss", "놓치다"]], "h1": "'일어나라, 그렇지 않으면 놓칠 것이다'라는 뜻이에요. 긍정 명령문으로 시작하고, 조건대로 10단어로 써요.", "h2": "wake up(일어나다)을 명령문으로 쓰고, 접속사 뒤에 '학교버스를 놓칠 것이다'를 이어요. 앞의 now도 잊지 마세요.", "why": "나쁜 결과가 뒤에 오므로 「명령문, or ~」를 써요. Wake up now(원형 wake up 일어나다), or you will miss(원형 miss 놓치다) the school bus.가 돼요.", "opts": [], "pencil": "「명령문, ___ you will ~」는 '~해라, 그렇지 않으면'이라는 뜻이다", "pencilKey": "or", "page": 153, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "「명령문, and/or ~」", "type": "write", "ans": "don't stop → stop [또는 Unless → If]", "concept": ["042"], "gap": "", "words": [["stop", "그만두다"], ["fast food", "패스트푸드"], ["unless", "~하지 않으면"]], "h1": "원래 문장은 「명령문, or ~」예요. 이것을 unless 문장으로 바꾼 부분에서 어색한 말을 찾으세요.", "h2": "unless는 이미 '~하지 않으면'이라는 부정의 뜻이 있어요. 그런데 뒤에 또 부정하는 말이 있지는 않은지 확인하세요.", "why": "unless 안에 이미 부정의 뜻이 있어서 don't를 또 쓰면 안 돼요. don't stop을 stop으로 고치거나 Unless를 If로 바꿔요.", "opts": [], "pencil": "unless 뒤에는 ___을 또 쓰지 않는다", "pencilKey": "부정어", "page": 153, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "neither", "concept": ["038"], "gap": "", "words": [["holiday", "휴가"], ["trip", "여행"]], "h1": "Susan은 시간도 돈도 없었다는 뜻이에요. 빈칸 뒤에 nor가 이미 있어요.", "h2": "nor와 짝을 이루는 말을 쓰세요. '둘 다 아닌'이라는 뜻이에요.", "why": "'시간도 돈도 없다'는 neither A nor B예요. neither time nor money가 돼요.", "opts": [], "pencil": "nor와 짝이 되는 말은 ___이다", "pencilKey": "neither", "page": 153, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "(1) or → and (2) is → are", "concept": ["038"], "gap": "", "words": [["participate", "참가하다"], ["plan", "계획하다"]], "h1": "'둘 다'라는 뜻의 상관접속사가 맞게 쓰였는지, 그리고 동사의 수가 맞는지 두 곳을 확인하세요.", "h2": "both의 짝 접속사는 무엇인지 떠올려 보세요. 그리고 both A and B가 주어일 때 동사는 단수일까요, 복수일까요?", "why": "both는 and와 짝이라서 or를 and로 고쳐요. both A and B는 복수 취급이라서 is를 are로 고쳐요.", "opts": [], "pencil": "both A and B가 주어이면 동사는 ___이다", "pencilKey": "복수", "page": 153, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "either eat out or order", "concept": ["038"], "gap": "", "words": [["eat out", "외식하다"], ["order", "주문하다"], ["online", "온라인으로"]], "h1": "'외식할 수 있다'와 '온라인으로 주문할 수 있다' 둘 중 하나를 고르는 뜻이에요. 두 문장을 한 문장으로 합쳐요.", "h2": "'A 또는 B 둘 중 하나'를 뜻하는 짝 표현을 쓰고, A와 B에는 같은 모양의 동사를 넣어요.", "why": "either A or B로 쓰고, can 뒤이니 동사원형을 써서 either eat out or order가 돼요.", "opts": [], "pencil": "'A 또는 B 둘 중 하나'는 either A ___ B이다", "pencilKey": "or", "page": 153, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "Both Kate and Tim seem", "concept": ["038"], "gap": "", "words": [["satisfied", "만족한"], ["seem", "~처럼 보이다"]], "h1": "Kate도 Tim도 만족해 보인다는 두 문장이에요. 둘을 모두 포함하는 상관접속사를 쓰세요.", "h2": "'둘 다'를 나타내는 상관접속사를 쓰면 동사 seems는 어떻게 바뀔까요?", "why": "both A and B는 복수 취급이라서 seems를 seem(원형 seem ~처럼 보이다)으로 써요.", "opts": [], "pencil": "both A and B가 주어이면 동사는 ___ 취급한다", "pencilKey": "복수", "page": 153, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "Sam as well as I likes watching cartoon movies.", "concept": ["038-2", "038"], "gap": "", "words": [["as well as", "~뿐만 아니라 ...도"], ["cartoon", "만화"]], "h1": "'나뿐만 아니라 Sam도'를 as well as로 쓰면 A와 B가 앞뒤로 어떻게 놓이는지 보세요. but also 뒤에 올 말이 맨 앞에 가요.", "h2": "B as well as A에서 동사는 B에 맞춰요. 맨 앞에 오는 사람은 Sam이에요. Sam은 3인칭 단수니까 동사 모양은 어떻게 될까요?", "why": "Sam as well as I가 주어이고 동사는 Sam에 맞춰요. 그래서 likes(원형 like 좋아하다)가 돼요.", "opts": [], "pencil": "B as well as A가 주어이면 동사는 ___에 맞춘다", "pencilKey": "B", "page": 153, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "Neither Andy nor I was invited to her birthday party.", "concept": ["038"], "gap": "", "words": [["invite", "초대하다"], ["birthday party", "생일 파티"]], "h1": "조건은 Neither로 시작, 과거 수동태, 10단어예요. 수동태는 be동사와 과거분사를 써요.", "h2": "과거 수동태는 was나 were에 과거분사를 붙여요. neither A nor B의 동사는 B에 맞춰요. B는 I예요.", "why": "neither A nor B로 쓰고 B가 I라서 was invited(원형 invite 초대하다)를 써요. neither 자체가 부정이라 not은 쓰지 않아요.", "opts": [], "pencil": "neither A nor B에서 동사는 ___에 맞춘다", "pencilKey": "B", "page": 153, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "④", "concept": ["037-2", "037", "037-H1"], "gap": "", "words": [["blanket", "담요"], ["good at", "~을 잘하다"], ["faster", "더 빨리"]], "h1": "다섯 문장의 접속사가 앞뒤 내용에 맞는지, 짝 표현이 맞는지 하나씩 보세요. 옳은 문장 하나를 고르는 문제예요.", "h2": "접속사가 앞뒤 내용(반대, 이유, 원인과 결과, 선택)에 맞는지, 짝 표현의 앞뒤 모양이 같은지 문장마다 점검해 보세요.", "why": "추워서(원인) 담요를 덮었다(결과)이므로 so가 알맞아요. 나머지는 접속사나 모양이 틀렸어요.", "opts": [{"n": "①", "en": "I will buy not a book and a notebook.", "ko": "나는 책이 아니라 공책을 살 것이다.", "ok": false, "why": "not A but B로 써야 해서 and를 but으로 고쳐야 해요."}, {"n": "②", "en": "I'm really hungry, or I haven't eaten all day.", "ko": "나는 정말 배고프다, 왜냐하면 하루 종일 아무것도 먹지 않았기 때문이다.", "ok": false, "why": "뒤 문장이 이유라서 or가 아니라 for가 알맞아요."}, {"n": "③", "en": "Who runs faster, Jake and his brother?", "ko": "누가 더 빨리 달리니, Jake니 그의 동생이니?", "ok": false, "why": "둘 중 고르는 질문이라서 and가 아니라 or여야 해요."}, {"n": "④", "en": "She felt cold, so she pulled the blanket over her.", "ko": "그녀는 추워서 담요를 끌어 덮었다.", "ok": true, "why": "원인과 결과라서 so가 맞아요."}, {"n": "⑤", "en": "Jennifer is good at not only singing but also to dance.", "ko": "Jennifer는 노래를 잘할 뿐만 아니라 춤도 잘 춘다.", "ok": false, "why": "singing과 같은 모양인 dancing으로 고쳐야 해요."}], "pencil": "원인과 결과를 이을 때는 ___를 쓴다", "pencilKey": "so", "page": 154, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "⑤", "concept": ["038"], "gap": "", "words": [["Australia", "호주"], ["either", "~도 또한 (부정문에서)"], ["have been to", "~에 가 본 적이 있다"]], "h1": "대화에서 Jean과 Alex가 호주에 가 봤는지 각각 확인하세요.", "h2": "Alex는 No라고 했고, Jean은 either를 써서 '나도 안 가 봤다'고 했어요. 두 사람 모두에 대해 어떤 상태인지 정리해 보세요.", "why": "두 사람 모두 호주에 가 본 적이 없어요. 둘 다 아니라는 뜻은 neither A nor B예요.", "opts": [{"n": "①", "en": "Both Jean and Alex have been to Australia.", "ko": "Jean과 Alex 둘 다 호주에 가 본 적이 있다.", "ok": false, "why": "둘 다 가 본 적이 없어서 틀려요."}, {"n": "②", "en": "Either Jean or Alex has been to Australia.", "ko": "Jean 또는 Alex 둘 중 한 명은 호주에 가 본 적이 있다.", "ok": false, "why": "둘 다 가 본 적이 없어서 틀려요."}, {"n": "③", "en": "Jean as well as Alex has been to Australia.", "ko": "Alex뿐만 아니라 Jean도 호주에 가 본 적이 있다.", "ok": false, "why": "둘 다 가 본 적이 없어서 틀려요."}, {"n": "④", "en": "Not Jean but Alex has been to Australia.", "ko": "Jean이 아니라 Alex가 호주에 가 본 적이 있다.", "ok": false, "why": "Alex도 가 본 적이 없어서 틀려요."}, {"n": "⑤", "en": "Neither Jean nor Alex has been to Australia.", "ko": "Jean도 Alex도 호주에 가 본 적이 없다.", "ok": true, "why": "둘 다 가 본 적이 없다는 내용과 맞아요."}], "pencil": "'A도 B도 아닌'은 ___ A nor B로 쓴다", "pencilKey": "neither", "page": 154, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "①", "concept": ["038", "037-H1"], "gap": "", "words": [["reach", "도착하다"], ["stair", "계단"], ["pleased", "기쁜"], ["exercise", "운동하다"], ["lose weight", "살을 빼다"]], "h1": "ⓐ부터 ⓓ까지 영어 문장이 우리말과 같은 뜻이고 문법도 맞는지 하나씩 확인하세요.", "h2": "neither 안에는 이미 부정의 뜻이 있어요. '~가 아니라 ...'는 not A but B로 나타내요. ⓐ~ⓓ를 이 점에 비춰 점검해 보세요.", "why": "ⓐ는 either A or B에서 by 뒤에 -ing 모양이 둘 다 있어서 맞고, ⓑ는 Both A and B가 맞아요. ⓒ는 부정이 겹쳤고 ⓓ는 so를 but으로 고쳐야 해요.", "opts": [{"n": "①", "en": "ⓐ, ⓑ", "ko": "ⓐ와 ⓑ", "ok": true, "why": "두 문장 모두 맞아요."}, {"n": "②", "en": "ⓑ, ⓒ", "ko": "ⓑ와 ⓒ", "ok": false, "why": "ⓒ에 doesn't와 neither가 같이 있어서 틀려요."}, {"n": "③", "en": "ⓑ, ⓓ", "ko": "ⓑ와 ⓓ", "ok": false, "why": "ⓓ는 so가 아니라 not A but B라서 but이어야 해서 틀려요."}, {"n": "④", "en": "ⓐ, ⓓ", "ko": "ⓐ와 ⓓ", "ok": false, "why": "ⓓ가 틀려요."}, {"n": "⑤", "en": "ⓒ, ⓓ", "ko": "ⓒ와 ⓓ", "ok": false, "why": "둘 다 틀린 문장이에요."}], "pencil": "neither A nor B에는 이미 ___의 뜻이 있어서 not을 또 쓰지 않는다", "pencilKey": "부정", "page": 154, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "②", "concept": ["037", "038"], "gap": "", "words": [["blame", "탓하다"], ["reply", "대답"], ["smart", "똑똑한"], ["funny", "재미있는"], ["eat out", "외식하다"]], "h1": "각 문장에 들어갈 접속사가 무엇인지 하나씩 정해 보세요. but이 들어갈 수 없는 것을 고르는 문제예요.", "h2": "neither가 쓰인 문장의 짝은 무엇일까요? 짝 표현에 but이 들어가는지 확인하세요.", "why": "②는 neither A nor B라서 nor가 들어가야 하고 but은 안 돼요.", "opts": [{"n": "①", "en": "It is not you ___ me who is to blame.", "ko": "탓할 사람은 네가 아니라 나다.", "ok": false, "why": "not A but B라서 but이 들어갈 수 있어요."}, {"n": "②", "en": "I neither said ___ did anything in reply.", "ko": "나는 대답으로 아무 말도 하지도 아무것도 하지도 않았다.", "ok": true, "why": "neither A nor B라서 nor가 들어가야 해요. but은 들어갈 수 없어서 정답이에요."}, {"n": "③", "en": "Ted is not only smart ___ also funny.", "ko": "Ted는 똑똑할 뿐만 아니라 재미있기도 하다.", "ok": false, "why": "not only A but also B라서 but이 들어가요."}, {"n": "④", "en": "We eat out on Sunday, ___ not often.", "ko": "우리는 일요일에 외식을 하지만 자주는 아니다.", "ok": false, "why": "반대 내용이라서 but이 들어가요."}, {"n": "⑤", "en": "My sister hated the movie, ___ I thought it was great.", "ko": "내 여동생은 그 영화를 싫어했지만 나는 훌륭하다고 생각했다.", "ok": false, "why": "반대 내용이라서 but이 들어가요."}], "pencil": "neither의 짝은 ___이고 but이 아니다", "pencilKey": "nor", "page": 154, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "②", "concept": ["038-2", "038"], "gap": "", "words": [["niece", "조카딸"], ["chess", "체스"], ["allow", "허락하다"], ["injure", "다치게 하다"]], "h1": "상관접속사가 주어인 문장마다 동사가 어느 말에 맞았는지 확인하세요.", "h2": "B as well as A일 때 동사는 맨 앞에 쓴 말에 맞춰요. as well as가 쓰인 문장에서 맨 앞에 있는 말과 동사의 수가 맞는지 보세요.", "why": "맨 앞 주어는 Mike(한 명)라서 동사는 is여야 해요. 그런데 are를 썼어요.", "opts": [{"n": "①", "en": "Either you or Ben has been hiding the truth.", "ko": "너 또는 Ben 둘 중 한 명이 진실을 숨겨 왔다.", "ok": false, "why": "B인 Ben에 맞춰 has been이 맞아요."}, {"n": "②", "en": "Mike as well as my nieces are really good at chess.", "ko": "내 조카딸들뿐만 아니라 Mike도 체스를 아주 잘한다.", "ok": true, "why": "동사는 맨 앞의 Mike(단수)에 맞춰 are가 아니라 is여야 해서 어색해요."}, {"n": "③", "en": "Both her dog and my dog are females.", "ko": "그녀의 개와 내 개 둘 다 암컷이다.", "ok": false, "why": "both A and B는 복수라서 are가 맞아요."}, {"n": "④", "en": "Not only Lydia but also I was not allowed to enter the room.", "ko": "Lydia뿐만 아니라 나도 그 방에 들어가도록 허락받지 못했다.", "ok": false, "why": "B인 I에 맞춰 was가 맞아요."}, {"n": "⑤", "en": "Neither the driver nor the passengers were injured.", "ko": "운전사도 승객들도 다치지 않았다.", "ok": false, "why": "B인 passengers(복수)에 맞춰 were가 맞아요."}], "pencil": "B as well as A가 주어이면 동사는 맨 앞의 ___에 맞춘다", "pencilKey": "B", "page": 154, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": 데 도움이 될 거야.", "ok": false, "why": "좋은 결과라서 and예요."}, {"n": "③", "en": "Put on sunscreen, ___ you'll get a sunburn.", "ko": "자외선 차단제를 발라라, 안 그러면 햇볕에 탈 거야.", "ok": true, "why": "나쁜 결과라서 or가 들어가요. 나머지와 달라서 정답이에요."}, {"n": "④", "en": "Wear your helmet, ___ you can protect yourself when you fall over.", "ko": "헬멧을 써라, 그러면 넘어질 때 몸을 보호할 수 있어.", "ok": false, "why": "좋은 결과라서 and예요."}, {"n": "⑤", "en": "Burn more calories than you consume, ___ you'll lose weight.", "ko": "섭취하는 것보다 더 많은 칼로리를 태워라, 그러면 살이 빠질 거야.", "ok": false, "why": "좋은 결과라서 and예요."}], "pencil": "나쁜 결과가 오면 「명령문, ___ ~」를 쓴다", "pencilKey": "or", "page": 154, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "「명령문, and/or ~」", "type": "write", "ans": "Unless you make a reservation in advance, you'll have to wait one hour or more.", "concept": ["042-2", "042"], "gap": "", "words": [["reservation", "예약"], ["in advance", "미리"], ["have to", "~해야 한다"]], "h1": "「명령문, or ~」를 주어진 단어 Unless로 시작하는 문장으로 바꿔요. 명령문에 주어를 붙여 절로 만들어요.", "h2": "「명령문, or ~」는 unless가 이끄는 절로 바꿀 수 있어요. unless 뒤에는 not을 쓰지 않아요. 뒤 문장은 그대로 써요.", "why": "Make a reservation in advance는 unless절 안에서 you make a reservation in advance가 돼요. 뒤 문장은 그대로예요.", "opts": [], "pencil": "「명령문, or ~」는 ___절로 바꿔 쓸 수 있다", "pencilKey": "unless", "page": 155, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "「명령문, and/or ~」", "type": "write", "ans": "(1) If you are not honest with him (2) Unless you are honest with him", "concept": ["042-2"], "gap": "", "words": [["honest", "정직한"], ["forgive", "용서하다"]], "h1": "「명령문, or ~」와 같은 뜻의 문장을 두 가지 접속사로 써요. 첫째 줄은 부정이 필요하고 둘째 줄은 필요 없어요.", "h2": "If를 쓸 때는 not이 들어가고, unless를 쓸 때는 not을 쓰지 않아요. 두 문장 모두 뒤 문장은 그대로 써요.", "why": "첫째는 If you are not honest with him, 둘째는 Unless you are honest with him이에요. unless에는 이미 부정이 들어 있어요.", "opts": [], "pencil": "If ... not은 ___ 하나로 바꿔 쓸 수 있다", "pencilKey": "unless", "page": 155, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "(1) not only, but also (2) as well as", "concept": ["038"], "gap": "", "words": [["humid", "습한"], ["Southeast Asia", "동남아시아"]], "h1": "'더울 뿐만 아니라 습하다'를 두 가지 방식으로 써요. 첫째는 not only로 시작하는 짝, 둘째는 세 단어 표현이에요.", "h2": "첫째 문장은 not only A but also B, 둘째 문장은 B as well as A로 써요. 둘째 문장에서는 A와 B의 자리가 바뀌니 hot과 humid 중 어느 것이 먼저 나오는지 보세요.", "why": "첫째는 not only hot but also humid이고 둘째는 humid as well as hot이에요.", "opts": [], "pencil": "not only A but also B는 B ___ ___ ___ A와 같다", "pencilKey": "as well as", "page": 155, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "visit → visiting", "concept": ["037-H1"], "gap": "", "words": [["search", "검색하다"], ["library", "도서관"]], "h1": "or로 이어진 세 가지 방법을 나란히 써 보세요. 같은 모양이 아닌 것을 찾으세요.", "h2": "by 뒤에는 -ing 모양이 와요. reading, searching과 or 뒤에 있는 동사의 모양을 비교해 보세요.", "why": "by reading, searching, or visiting처럼 -ing로 맞춰야 해서 visit를 visiting으로 고쳐요.", "opts": [], "pencil": "or로 이어진 말은 ___ 모양이 같아야 한다", "pencilKey": "같은", "page": 155, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "Chris as well as I enjoys watching horror movies and scaring people.", "concept": ["038-2", "038", "037-H1"], "gap": "", "words": [["horror movie", "공포 영화"], ["scare", "놀라게 하다"], ["enjoy", "즐기다"]], "h1": "'나뿐만 아니라 Chris도'를 as well as로 쓰는 문제예요. 누가 맨 앞에 오는지, 그리고 enjoy 뒤에 오는 모양을 보세요.", "h2": "동사는 맨 앞에 온 사람에 맞춰요. enjoy(즐기다) 뒤에는 동명사(-ing)가 오고, 두 개가 and로 이어져요.", "why": "Chris가 맨 앞이라서 enjoys를 쓰고, enjoy 뒤에 watching과 scaring을 and로 이어요.", "opts": [], "pencil": "B as well as A가 주어이면 동사는 ___에 맞춘다", "pencilKey": "B", "page": 155, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "The actress is popular not only in Korea but also in many other countries.", "concept": ["038"], "gap": "", "words": [["actress", "여배우"], ["popular", "인기 있는"], ["country", "나라"]], "h1": "두 문장을 하나로 합치는 문제예요. 한국에서 인기 있다는 정보와 다른 나라에서도 인기 있다는 정보가 모두 들어가요.", "h2": "not only A but also B에서 A와 B는 같은 모양이어야 해요. 두 장소를 나타내는 말이 모양이 같도록 앞에 in을 붙이세요.", "why": "not only in Korea but also in many other countries로 같은 모양을 맞춰서 이어요.", "opts": [], "pencil": "not only A but also B에서 A와 B는 ___ 모양으로 쓴다", "pencilKey": "같은", "page": 155, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "Either Henry or his brother has spread the rumor.", "concept": ["038"], "gap": "", "words": [["spread", "퍼뜨리다"], ["rumor", "소문"]], "h1": "Henry 또는 그의 동생 둘 중 한 명이 소문을 퍼뜨렸다는 뜻이에요. 둘 중 하나를 고르는 짝 표현을 쓰세요.", "h2": "either A or B의 동사는 B에 맞춰요. B는 his brother예요. 현재완료의 have/has 중에서 고르세요.", "why": "Either Henry or his brother로 시작하고 B에 맞춰 has spread(원형 spread 퍼뜨리다)를 써요.", "opts": [], "pencil": "either A or B에서 동사는 ___에 맞춘다", "pencilKey": "B", "page": 155, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "등위접속사 / 상관접속사", "type": "write", "ans": "Emilia was neither shocked nor disappointed by the news.", "concept": ["038"], "gap": "", "words": [["shock", "충격을 주다"], ["disappoint", "실망시키다"], ["news", "소식"]], "h1": "충격을 받지도 않고 실망하지도 않았다는 두 부정문이 있어요. 괄호 안 단어로 하나로 합치세요.", "h2": "neither A nor B에는 이미 부정의 뜻이 있어서 was not은 쓰지 않아요. A와 B에는 같은 모양을 써요.", "why": "was neither shocked nor disappointed(원형 shock 충격을 주다, disappoint 실망시키다)로 써요. 두 말이 같은 모양의 과거분사예요.", "opts": [], "pencil": "neither A nor B에는 이미 ___의 뜻이 있다", "pencilKey": "부정", "page": 155, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "⑤", "concept": ["037", "038"], "gap": "", "words": [["avoid", "피하다"], ["unnecessary", "불필요한"], ["waste", "낭비하다"], ["gain", "얻다"], ["fame", "명성"], ["importance", "중요성"]], "h1": "네 문장의 빈칸에 들어가는 접속사를 하나씩 정하세요. 그리고 보기 ①~⑤ 중 한 번도 쓰이지 않은 말을 찾아요.", "h2": "ⓐ는 나쁜 결과를 말하는 명령문, ⓑ는 both의 짝, ⓒ는 neither의 짝, ⓓ는 not only의 짝이에요.", "why": "ⓐ는 or, ⓑ는 and, ⓒ는 nor, ⓓ는 but이 들어가서 so만 한 번도 쓰이지 않아요.", "opts": [{"n": "①", "en": "and", "ko": "그리고", "ok": false, "why": "ⓑ에 들어가서 쓰였어요."}, {"n": "②", "en": "or", "ko": "또는", "ok": false, "why": "ⓐ에 들어가서 쓰였어요."}, {"n": "③", "en": "but", "ko": "그러나", "ok": false, "why": "ⓓ에 들어가서 쓰였어요."}, {"n": "④", "en": "nor", "ko": "~도 아닌", "ok": false, "why": "ⓒ에 들어가서 쓰였어요."}, {"n": "⑤", "en": "so", "ko": "그래서", "ok": true, "why": "어느 빈칸에도 들어가지 않아서 정답이에요."}], "pencil": "neither A ___ B, both A ___ B처럼 짝 표현이 정해져 있다", "pencilKey": "nor, and", "page": 156, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "등위접속사 / 상관접속사", "type": "mc", "ans": "①", "concept": ["038"], "gap": "", "words": [["lie", "거짓말하다"], ["responsible", "책임이 있는"], ["accident", "사고"], ["decorate", "장식하다"], ["warmth", "따뜻함"], ["protection", "보호"]], "h1": "ⓐ부터 ⓔ까지 상관접속사의 짝과 동사의 수를 하나씩 확인하세요.", "h2": "neither A nor B와 both A and B가 주어일 때의 동사, not only A but also B에서 A와 B의 모양을 문장마다 점검하세요.", "why": "ⓐ와 ⓒ가 맞아요. ⓑ는 speaks를 speak로, ⓓ는 am을 are로, ⓔ는 protect를 명사 모양으로 고쳐야 해요.", "opts": [{"n": "①", "en": "ⓐ, ⓒ", "ko": "ⓐ와 ⓒ", "ok": true, "why": "두 문장 모두 맞아요."}, {"n": "②", "en": "ⓑ, ⓓ", "ko": "ⓑ와 ⓓ", "ok": false, "why": "둘 다 동사의 수가 틀려요."}, {"n": "③", "en": "ⓐ, ⓑ, ⓒ", "ko": "ⓐ와 ⓑ와 ⓒ", "ok": false, "why": "ⓑ가 틀려요."}, {"n": "④", "en": "ⓑ, ⓒ, ⓔ", "ko": "ⓑ와 ⓒ와 ⓔ", "ok": false, "why": "ⓑ와 ⓔ가 틀려요."}, {"n": "⑤", "en": "ⓒ, ⓓ, ⓔ", "ko": "ⓒ와 ⓓ와 ⓔ", "ok": false, "why": "ⓓ와 ⓔ가 틀려요."}], "pencil": "neither A nor B가 주어이면 동사는 ___에 맞춘다", "pencilKey": "B", "page": 156, "sec": "s4"}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "「명령문, and/or ~」", "type": "write", "ans": "Arrive on time, or you may not be allowed to take the test. / Unless you arrive on time, you may not be allowed to take the test.", "concept": ["042-2", "042"], "gap": "", "words": [["arrive", "도착하다"], ["on time", "제시간에"], ["allow", "허락하다"], ["take a test", "시험을 보다"]], "h1": "If you don't ~로 된 문장을 두 가지 방식으로 바꿔요. 첫째는 긍정 명령문으로 시작하고, 둘째는 부사절을 앞에 써요.", "h2": "첫째는 「명령문, or ~」로 쓰고, 둘째는 unless가 이끄는 절을 앞에 써요. unless 뒤에는 not을 쓰지 않아요.", "why": "If you don't arrive는 '도착하지 않으면'이에요. 그래서 Arrive on time, or ...와 Unless you arrive on time, ...로 바꿔요.", "opts": [], "penci    if(d.words&&d.words.length){h+='<div class="lab">단어 뜻</div><div class="chips">'+d.words.map(function(w){return '<span><b>'+esc(w[0])+'</b> '+esc(w[1])+'</span>'}).join("")+'</div>'}
   if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
   if(r.h<2)h+='<button class="btn g" onclick="useHint(\''+d.id+'\',2)">아직 막혀요 · 한 걸음 더</button>';
  }
  if(r.h>=2)h+='<div class="hint two">'+hl(d.h2)+'</div>';
  if(d.type==="mc"){
   var labs=d.opts.map(function(o){return o.n});
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[];
   h+='<div class="choices'+(labs.length===2?' two':'')+'">'+labs.map(function(l){return '<button class="ch" style="'+(multi&&sel.indexOf(l)>=0?'background:var(--soft);border-color:var(--a)':'')+'" onclick="'+(multi?'tog':'pick')+'(\''+d.id+'\',\''+l+'\')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+=multi?'<div class="meter">정답이 두 개예요. 모두 누른 뒤 확인을 눌러요</div><button class="btn p" onclick="confirmMulti(\''+d.id+'\')">확인</button>':'<div class="meter">책의 답을 골라 누르면 바로 확인돼요</div>';
  }else{
   h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div>';
   h+='<button class="btn p" onclick="showW(\''+d.id+'\')">정답 확인</button>';
  }
 }else{
  h+=answerView(d,r);
 }
 h+='</div>';
 h+='<div class="nav">'+(st.idx>0?'<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>':'')+'<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button></div>';
 app.innerHTML=h;
}
function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
