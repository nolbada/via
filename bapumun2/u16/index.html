 둘째 빈칸은 선행사 없는 what이에요."}, {"n": "②", "en": "what ‒ what", "ko": "~하는 것 – ~하는 것", "ok": false, "why": "첫 빈칸 앞에 선행사 the movie가 있어서 what이 안 돼요."}, {"n": "③", "en": "that – that", "ko": "~인 – ~인", "ok": false, "why": "둘째 빈칸에는 꾸밀 선행사가 없어서 that이 안 돼요."}, {"n": "④", "en": "what ‒ that", "ko": "~하는 것 – ~인", "ok": false, "why": "첫 빈칸에는 what이 안 되고 둘째 빈칸에는 that이 안 돼요."}, {"n": "⑤", "en": "which – that", "ko": "~인 – ~인", "ok": false, "why": "첫 빈칸 which는 가능하지만 둘째 빈칸에 that은 안 돼요."}], "pencil": "선행사가 있으면 that, 없으면 ___", "pencilKey": "what", "page": 164, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "관계대명사 what", "type": "mc", "ans": "⑤", "concept": ["085", "082", "084"], "gap": "", "words": [["backpack", "배낭"], ["unique", "독특한"], ["pocket", "주머니"], ["aunt", "이모, 고모"], ["birthday gift", "생일 선물"]], "h1": "빈칸 바로 앞에 선행사 the backpack이 있어요. 빈칸에 어떤 절이 오면 backpack을 꾸밀 수 있는지 보기마다 확인하세요.", "h2": "선행사 뒤에는 whose, that, which로 시작하는 절이나, 관계대명사가 생략된 절이 올 수 있어요. 선행사 없이 '~하는 것'을 뜻하는 말로 시작하는 절은 올 수 없어요.", "why": "⑤ what I want to get...은 선행사를 품은 절이라 앞에 the backpack이 있으면 쓸 수 없어요. 나머지는 모두 backpack을 꾸밀 수 있어요.", "opts": [{"n": "①", "en": "whose design is unique", "ko": "그 디자인이 독특한", "ok": false, "why": "whose + 명사로 backpack을 꾸밀 수 있어요."}, {"n": "②", "en": "that I saw at the store", "ko": "내가 가게에서 본", "ok": false, "why": "목적격 that절이 backpack을 꾸밀 수 있어요."}, {"n": "③", "en": "which has many pockets", "ko": "주머니가 많은", "ok": false, "why": "주격 which절이 backpack을 꾸밀 수 있어요."}, {"n": "④", "en": "my aunt bought for me last year", "ko": "이모가 작년에 내게 사 준", "ok": false, "why": "목적격 관계대명사가 생략된 절이 backpack을 꾸밀 수 있어요."}, {"n": "⑤", "en": "what I want to get as a birthday gift", "ko": "내가 생일 선물로 받고 싶은 것", "ok": true, "why": "what절은 선행사를 품고 있어서 backpack 뒤에 올 수 없어요."}], "pencil": "선행사 바로 뒤에는 ___ 절이 올 수 없다", "pencilKey": "what", "page": 164, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "관계대명사 what", "type": "mc", "ans": "①, ②", "concept": ["085", "084", "082"], "gap": "", "words": [["all", "전부"], ["keep awake", "깨어 있게 하다"], ["loud", "큰"], ["enjoy", "즐기다"], ["stage", "무대"], ["top", "꼭대기"], ["be covered with", "~로 덮이다"]], "h1": "자연스러운 것을 '모두' 고르는 문제예요. 다섯 문장에서 that, what 앞에 선행사가 있는지, 뒤에 빠진 말이 있는지 하나씩 확인하세요.", "h2": "틀린 문장은 what 앞에 선행사가 있거나, that 앞에서 '~하는 것'이 필요하거나, that 뒤에 명사가 오는 경우예요. 하나씩 해당하는지 살펴보세요.", "why": "①은 all이 선행사라 that이 맞고, ②는 What절이 주어라서 맞아요. ③은 that을 what으로, ④는 what을 who로, ⑤는 that을 whose로 고쳐야 해요.", "opts": [{"n": "①", "en": "Those things are all that I have.", "ko": "저것들이 내가 가진 전부이다.", "ok": true, "why": "선행사 all 뒤에는 that을 써서 맞아요."}, {"n": "②", "en": "What kept him awake was the loud sound from the TV.", "ko": "그를 깨어 있게 한 것은 TV의 큰 소리였다.", "ok": true, "why": "'~한 것'이라서 What이 맞아요."}, {"n": "③", "en": "Action movies are that Mr. Baker enjoys watching.", "ko": "액션 영화는 Baker 씨가 즐겨 보는 것이다.", "ok": false, "why": "선행사 없는 '~하는 것'이라서 that이 아니라 what이어야 해요."}, {"n": "④", "en": "The boy what is dancing on the stage is my brother.", "ko": "무대에서 춤추고 있는 소년은 내 남동생이다.", "ok": false, "why": "선행사 The boy가 있어서 what이 아니라 who 또는 that이어야 해요."}, {"n": "⑤", "en": "Look at the mountain that top is covered with snow.", "ko": "꼭대기가 눈으로 덮인 산을 봐.", "ok": false, "why": "that 뒤에 명사 top이 와서 whose여야 해요."}], "pencil": "자연스러운 문장은 선행사 all 뒤 ___, 선행사 없는 주어 What절", "pencilKey": "that", "page": 164, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "관계대명사 what vs. 의문사 what", "type": "mc", "ans": "③", "concept": ["085", "085-H2", "094"], "gap": "", "words": [["right now", "지금 당장"], ["take a short break", "잠깐 쉬다"], ["cause", "일으키다"], ["kind of music", "음악의 종류"], ["happen", "일어나다"], ["bring", "가져오다"]], "h1": "<보기>의 What은 '우리가 지금 원하는 것'이라는 뜻이에요. 보기마다 what을 '~하는 것'으로 풀 수 있는지, '무엇'으로 풀어야 하는지 따져 보세요.", "h2": "관계대명사 what은 '~하는 것'으로 풀리고, 의문사 what은 '무엇, 무슨, 어떤'으로 풀려요. <보기>와 같은 쪽을 고르세요.", "why": "③ what happened to the animals는 '그 동물들에게 일어난 일'로 풀려서 <보기>와 같은 관계대명사예요. 나머지는 의문사예요.", "opts": [{"n": "①", "en": "What caused the car accident?", "ko": "무엇이 그 자동차 사고를 일으켰니?", "ok": false, "why": "'무엇이'라고 묻는 의문사예요."}, {"n": "②", "en": "I asked Daniel what kind of music he liked.", "ko": "나는 Daniel에게 어떤 종류의 음악을 좋아하는지 물었다.", "ok": false, "why": "'어떤'이라는 의문사예요."}, {"n": "③", "en": "We will discuss what happened to the animals.", "ko": "우리는 그 동물들에게 일어난 일을 논의할 것이다.", "ok": true, "why": "'일어난 일'이라서 <보기>와 같은 관계대명사예요."}, {"n": "④", "en": "She wonders what time the bank closes today.", "ko": "그녀는 오늘 은행이 몇 시에 닫는지 궁금해한다.", "ok": false, "why": "'몇 시'라는 의문사예요."}, {"n": "⑤", "en": "I'm not sure what he will bring to school.", "ko": "나는 그가 학교에 무엇을 가져올지 잘 모르겠다.", "ok": false, "why": "'무엇을'이라는 의문사예요."}], "pencil": "'~하는 것'으로 풀리면 관계대명사, '무엇, 어떤'이면 ___", "pencilKey": "의문사", "page": 164, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "관계대명사 what vs. 의문사 what", "type": "mc", "ans": "⑤", "concept": ["085", "085-H2", "094"], "gap": "", "words": [["robot", "로봇"], ["important", "중요한"], ["safety", "안전"], ["free time", "여가 시간"], ["subject", "과목"], ["enjoy", "즐기다"]], "h1": "다섯 문장의 what을 '~하는 것'으로 풀 수 있는지 '어떤, 무엇'으로 풀어야 하는지 하나씩 해석해 보세요. 나머지 넷과 다른 하나를 찾는 문제예요.", "h2": "의문사 what은 간접의문문에서 '무엇, 어떤'이라는 뜻으로 쓰여요. what 바로 뒤에 명사가 붙어 '어떤 ~'로 풀리는 문장이 있는지 보세요.", "why": "⑤ what subject는 '어떤 과목'이라는 뜻의 의문사예요. 나머지는 '~하는 것'이라는 뜻의 관계대명사예요.", "opts": [{"n": "①", "en": "The robot is what my uncle made last year.", "ko": "그 로봇은 내 삼촌이 작년에 만든 것이다.", "ok": false, "why": "'삼촌이 만든 것'이라서 관계대명사예요."}, {"n": "②", "en": "I think Claire can give him what he needs.", "ko": "나는 Claire가 그에게 그가 필요한 것을 줄 수 있다고 생각한다.", "ok": false, "why": "'그가 필요한 것'이라서 관계대명사예요."}, {"n": "③", "en": "What is important is your safety.", "ko": "중요한 것은 너의 안전이다.", "ok": false, "why": "'중요한 것'이라서 관계대명사예요."}, {"n": "④", "en": "Listening to music is what I do in my free time.", "ko": "음악 듣기는 내가 여가 시간에 하는 것이다.", "ok": false, "why": "'내가 하는 것'이라서 관계대명사예요."}, {"n": "⑤", "en": "I don't know what subject she enjoys most at school.", "ko": "나는 그녀가 학교에서 어떤 과목을 가장 좋아하는지 모른다.", "ok": true, "why": "'어떤 과목'이라는 의문사예요. 나머지와 달라서 정답이에요."}], "pencil": "wha    h+='<div class="hint">'+hl(d.h1)+'</div>';
   if(d.words&&d.words.length){h+='<div class="lab">단어 뜻</div><div class="chips">'+d.words.map(function(w){return '<span><b>'+esc(w[0])+'</b> '+esc(w[1])+'</span>'}).join("")+'</div>'}
   if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
   if(r.h<2)h+='<button class="btn g" onclick="useHint(\''+d.id+'\',2)">아직 막혀요 · 한 걸음 더</button>';
  }
  if(r.h>=2)h+='<div class="hint two">'+hl(d.h2)+'</div>';
  if(d.type==="mc"){
   var labs=d.opts.map(function(o){return o.n});
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[];
   h+='<div class="choices'+(labs.length===2?' two':'')+'">'+labs.map(function(l){return '<button class="ch" style="'+(multi&&sel.indexOf(l)>=0?'background:var(--soft);border-color:var(--a)':'')+'" onclick="'+(multi?'tog':'pick')+'(\''+d.id+'\',\''+l+'\')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+=multi?'<div class="meter">정답이 두 개예요. 모두 누른 뒤 확인을 눌러요</div><button class="btn p" onclick="confirmMulti(\''+d.id+'\')">확인</button>':'<div class="meter">책의 답을 골라 누르면 바로 확인돼요</div>';
  }else{
   h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div>';
   h+='<button class="btn p" onclick="showW(\''+d.id+'\')">정답 확인</button>';
  }
 }else{
  h+=answerView(d,r);
 }
 h+='</div>';
 h+='<div class="nav">'+(st.idx>0?'<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>':'')+'<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button></div>';
 app.innerHTML=h;
}
function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
