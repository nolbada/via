ent Georges Pompidou wanted a new kind of cultural space in Paris가 있음. 같은 내용이라 일치.","c":"T"},"h":"50e3ca38f8"},{"n":2,"t":"tf","q":"Builders hid the pipes, wires, and metal frames inside the building.","ko":"시공자들은 배관, 전선, 철제 뼈대를 건물 안에 숨겼다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Instead of hiding its pipes, wires, and metal frames, builders put them on the outside.","배관, 전선, 철제 뼈대를 숨기는 대신, 시공자들은 그것들을 바깥쪽에 두었다."]],"w":"4번 문장은 Instead of hiding(숨기는 대신) 그것들을 on the outside(바깥쪽에) 두었다고 함. 숨겼다는 것은 반대임.","c":"F"},"h":"1d7842b268"},{"n":3,"t":"tf","q":"The Centre Pompidou is one of the most famous cultural centers in the world.","ko":"퐁피두 센터는 세계에서 가장 유명한 문화 센터 중 하나이다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"It is one of the most famous cultural centers in the world.","그곳은 세계에서 가장 유명한 문화 센터 중 하나이다."]],"w":"10번 문장에 It is one of the most famous cultural centers in the world가 있음. It은 퐁피두 센터. 내용이 일치함.","c":"T"},"h":"1289ab91af"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But today, the Centre Pompidou attracts millions of visitors each year.)","ko":"하지만 오늘날 퐁피두 센터는 해마다 수백만 명의 방문객을 ...","opts":["쫓아낸다","건설한다","끌어들인다","숨긴다"],"word":"attracts","r":{"a":"3) 끌어들인다","ev":"8~9번 문장","s":[[8,"At first, people were shocked by its strange look.","처음에는 사람들이 그 낯선 모습에 충격을 받았다."],[9,"But today, the Centre Pompidou attracts millions of visitors each year.","하지만 오늘날 퐁피두 센터는 해마다 수백만 명의 방문객을 끌어들인다."]],"w":"8번에서 처음에는 충격을 받았지만, 9번의 But 뒤에서 오늘날 수백만 방문객이 온다고 함. attract(끌어들이다)는 사람들이 찾아오게 만든다는 뜻.","c":3},"h":"b8aa868777"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The building's open spaces are used for exhibitions, concerts, ...)","ko":"건물의 트인 공간은 ..., 콘서트, ...에 쓰인다","opts":["수업","여행","공연 연습","전시회"],"word":"exhibitions","r":{"a":"4) 전시회","ev":"6번 문장","s":[[6,"The building’s open spaces are used for exhibitions, concerts, a huge library, and even Europe’s largest modern art museum.","건물의 트인 공간은 전시회, 콘서트, 거대한 도서관, 심지어 유럽에서 가장 큰 현대 미술관에 쓰인다."]],"w":"6번 문장은 트인 공간의 쓰임을 나열함. exhibitions는 미술품 등을 보여 주는 '전시회'이고, 뒤에 concerts, library, art museum이 이어지는 것과도 어울림.","c":4},"h":"dbcb2f32a0"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe architects wanted it to be a small cultural town where people could enjoy many activities in one place.","ko":"밑줄 친 it이 가리키는 것은?","sko":"건축가들은 그곳이 사람들이 한곳에서 많은 활동을 즐길 수 있는 작은 문화 도시가 되기를 바랐다.","opts":["프랑스 대통령","퐁피두 센터","거대한 도서관","콘서트"],"r":{"a":"2) 퐁피두 센터","ev":"3, 6~7번 문장","s":[[3,"Architects turned his dream into a unique building: the Centre Pompidou.","건축가들은 그의 꿈을 독특한 건물인 퐁피두 센터로 바꾸어 놓았다."],[6,"The building’s open spaces are used for exhibitions, concerts, a huge library, and even Europe’s largest modern art museum.","건물의 트인 공간은 전시회, 콘서트, 거대한 도서관, 심지어 유럽에서 가장 큰 현대 미술관에 쓰인다."],[7,"The architects wanted it to be a small cultural town where people could enjoy many activities in one place.","건축가들은 그곳이 사람들이 한곳에서 많은 활동을 즐길 수 있는 작은 문화 도시가 되기를 바랐다."]],"w":"3번에서 건축가들이 만든 건물이 Centre Pompidou이고, 6~7번이 이 건물의 공간을 설명함. 7번의 it은 건축가들이 작은 문화 도시처럼 만들고 싶어 한 그 건물.","c":2},"h":"a101905877"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This unusual “inside-out” design makes the interior open and flexible.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 독특한 '안팎이 뒤바뀐' 설계는 내부를 트이고 유연하게 만든다.","opts":["이 낯선 설계는 내부를 좁고 딱딱하게 만든다.","이 설계는 건물 바깥을 막아서 닫아 놓는다.","이 독특한 안팎이 뒤바뀐 설계는 내부를 트이고 유연하게 만든다.","이 설계는 안에 있는 것을 모두 숨겨 준다."],"r":{"a":"3) 이 독특한 안팎이 뒤바뀐 설계는 내부를 트이고 유연하게 만든다.","ev":"4~5번 문장","s":[[4,"Instead of hiding its pipes, wires, and metal frames, builders put them on the outside.","배관, 전선, 철제 뼈대를 숨기는 대신, 시공자들은 그것들을 바깥쪽에 두었다."],[5,"This unusual “inside-out” design makes the interior open and flexible.","이 독특한 '안팎이 뒤바뀐' 설계는 내부를 트이고 유연하게 만든다."]],"w":"5번의 make A open and flexible은 'A를 트이고 유연하게 만든다'는 뜻. 4번에서 숨기는 대신 바깥에 두었다고 했으니 숨겨 준다는 말은 반대임.","c":3},"h":"75ea653658"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["트인 공간은 전시회, 콘서  the Centre Pompidou attracts millions of visitors. 처음의 충격과 오늘날의 인기가 But으로 대비됨.","c":2},"h":"dbac643c78"},{"n":10,"t":"fill","q":"Builders put the pipes, wires, and metal frames on the [A], so the interior becomes open and [B].","ko":"시공자들은 배관, 전선, 철제 뼈대를 [A]쪽에 두어 내부가 트이고 [B]해졌다.","bank":["outside","flexible","famous","shocked","library","hidden"],"bko":{"outside":"바깥","flexible":"유연한","famous":"유명한","shocked":"충격을 받은","library":"도서관","hidden":"숨겨진"},"r":{"a":"[A] outside, [B] flexible","ev":"4~5번 문장","s":[[4,"Instead of hiding its pipes, wires, and metal frames, builders put them on the outside.","배관, 전선, 철제 뼈대를 숨기는 대신, 시공자들은 그것들을 바깥쪽에 두었다."],[5,"This unusual “inside-out” design makes the interior open and flexible.","이 독특한 '안팎이 뒤바뀐' 설계는 내부를 트이고 유연하게 만든다."]],"w":"4번 문장 put them on the outside, 5번 문장 makes the interior open and flexible. hidden은 4번의 hiding(숨기는)과 반대 방향이라 오답.","c":null},"h":"f66896950e"}]},{"u":3,"id":"b3-03-4","no":4,"ko":"쓰레기 벽돌로 5일 만에 집을 짓는다고?","items":[{"n":1,"t":"tf","q":"Plastic waste takes about 500 years to break down.","ko":"플라스틱 쓰레기는 분해되는 데 약 500년이 걸린다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It pollutes land and oceans, and takes about 500 years to break down.","그것은 땅과 바다를 오염시키고, 분해되는 데 약 500년이 걸린다."]],"w":"2번 문장에 takes about 500 years to break down이 있음. 분해되는 데 약 500년이라는 내용과 일치.","c":"T"},"h":"b24561222b"},{"n":2,"t":"tf","q":"Each brick weighs about 80 to 100 kilograms.","ko":"벽돌 하나의 무게는 약 80~100킬로그램이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Each brick weighs about 8 to 10 kilograms and is durable enough to withstand an earthquake.","벽돌 하나의 무게는 약 8~10킬로그램이며, 지진을 견딜 만큼 튼튼하다."]],"w":"7번 문장은 Each brick weighs about 8 to 10 kilograms(약 8~10킬로그램)라고 함. 80~100킬로그램은 숫자가 다름.","c":"F"},"h":"36a2e97df1"},{"n":3,"t":"tf","q":"The bricks snap together like LEGO pieces.","ko":"벽돌은 레고 조각처럼 딱 맞물린다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The bricks snap together like LEGO pieces.","벽돌은 레고 조각처럼 딱 맞물린다."]],"w":"8번 문장에 The bricks snap together like LEGO pieces가 있음. snap together는 '딱 맞물려 끼워지다'라는 뜻. 내용이 일치함.","c":"T"},"h":"5dc9dede04"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... is durable enough to withstand an earthquake.)","ko":"... 지진을 ... 만큼 튼튼하다","opts":["무너뜨리다","견디다","피하다","옮기다"],"word":"withstand","r":{"a":"2) 견디다","ev":"7번 문장","s":[[7,"Each brick weighs about 8 to 10 kilograms and is durable enough to withstand an earthquake.","벽돌 하나의 무게는 약 8~10킬로그램이며, 지진을 견딜 만큼 튼튼하다."]],"w":"7번 문장은 벽돌이 durable(튼튼한)하다는 말에 이어 지진을 withstand한다고 함. 튼튼하다는 말과 이어지므로 withstand = 견디다.","c":2},"h":"539ade9d5f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... without special tools or skilled workers.)","ko":"특별한 도구나 ... 기술자 없이","opts":["서투른","지친","어린","숙련된"],"word":"skilled","r":{"a":"4) 숙련된","ev":"9번 문장","s":[[9,"This lets people build houses quickly without special tools or skilled workers.","이 덕분에 사람들은 특별한 도구나 숙련된 기술자 없이도 집을 빠르게 지을 수 있다."]],"w":"9번 문장은 레고처럼 맞물려서 특별한 도구나 skilled workers 없이도 집을 지을 수 있다는 내용. 기술이 뛰어난 일꾼이 필요 없다는 뜻이므로 skilled = 숙련된.","c":4},"h":"34ad22818f"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis lets people build houses quickly without special tools or skilled workers.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이 덕분에 사람들은 특별한 도구나 숙련된 기술자 없이도 집을 빠르게 지을 수 있다.","opts":["플라스틱 쓰레기가 땅을 오염시키는 것","벽돌이 레고 조각처럼 맞물리는 것","집을 짓는 데 약 5일이 걸리는 것","벽돌에 특수한 재료를 더하는 것"],"r":{"a":"2) 벽돌이 레고 조각처럼 맞물리는 것","ev":"8~9번 문장","s":[[8,"The bricks snap together like LEGO pieces.","벽돌은 레고 조각처럼 딱 맞물린다."],[9,"This lets people build houses quickly without special tools or skilled workers.","이 덕분에 사람들은 특별한 도구나 숙련된 기술자 없이도 집을 빠르게 지을 수 있다."]],"w":"9번 문장의 This는 바로 앞 8번 문장의 내용(The bricks snap together like LEGO pieces)을 가리킴. 맞물린다 → 특별한 도구나 기술자 없이도 집을 지을 수 있다는 결과로 이어짐.","c":2},"h":"38a77a9780"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The outside even looks like a regular brick house.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"겉모습도 일반 벽돌집처럼 보이기까지 한다.","opts":["겉모습도 평범한 벽돌집처럼 보이기까지 한다.","바깥에서 보면 벽돌집과 완전히 달라 보인다.","바깥에는 평범한 벽돌집이 한 채 더 있다.","벽돌집은 바깥보다 안이 더 예쁘다."],"r":{"a":"1) 겉모습도 평범한 벽돌집처럼 보이기까지 한다.","ev":"12번 문장","s":[[12,"The outside even looks like a regular brick house.","겉모습도 일반 벽돌집처럼 보이기까지 한다."]],"w":"The outside는 겉모습, looks like는 ~처럼 보이다, even은 '~하기까지'라는 놀라움을 나타냄. 평범한 벽돌집과 겉모습이 닮았다는 말이라 달라 보인다는 말은 반대.","c":1},"h":"d4c9befc81"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["플라스틱 쓰레기가 분해되는 데는 며칠밖에 안 걸린다.","플라스틱 벽돌집은 전통적인 집보다 비용이 더 든다.","벽돌을 만들 때 플라스틱 쓰레기를 고무와 섞어 틀에 넣고 누른다.","특별한 도구와 숙련된 기술자가 있어야 집을 지을 수 있다."],"opts":["Plastic waste takes only a few days to break down.","A plastic brick house costs more than a traditional house.","To make the bricks, plastic waste is mixed with rubber and pressed into molds.","Special tools and skilled workers are needed to build the houses."],"r":{"a":"3) To make the bricks, plastic waste is mixed with rubber and pressed into molds.","ev":"2, 5, 9, 11번 문장","s":[[2,"It pollutes land and oceans, and takes about 500 years to break down.","그것은 땅과 바다를 오염시키고, 분해되는 데 약 500년이 걸린다."],[5,"To make the bricks, plastic waste like bottle caps and food boxes is mixed with rubber and pressed into molds.","벽돌을 만들려면, 병뚜껑과 음식 상자 같은 플라스틱 쓰레기를 고무와 섞어 틀에 넣고 눌러 찍는다."],[9,"This lets people build houses quickly without special tools or skilled workers.","이 덕분에 사람들은 특별한 도구나 숙련된 기술자 없이도 집을 빠르게 지을 수 있다."],[11,"Each house costs less than 7,000 dollars, which is much cheaper than traditional homes.","집 한 채의 비용은 7,000달러도 안 되며, 이는 전통적인 집보다 훨씬 저렴하다."]],"w":"5번 문장과 일치. 1번은 2번(약 500년)과 반대, 2번은 11번(훨씬 저렴)과 반대, 4번은 9번(특별한 도구나 숙련된 기술자 없이)과 반대.","c":3},"h":"a493f6aa07"},{"n":9,"t":"sum","q":"A house made of plastic bricks takes about (A) days to build and costs (B) than traditional homes.","ko":"플라스틱 벽돌집은 짓는 데 약 (A)일이 걸리고, 전통적인 집보다 비용이 (B).","oko":["(A) 5 / (B) 더 적게 든다","(A) 50 / (B) 더 적게 든다","(A) 5 / (B) 더 많이 든다","(A) 50 / (B) 더 많이 든다","(A) 500 / (B) 더 적게 든다"],"opts":["(A) 5 / (B) less","(A) 50 / (B) less","(A) 5 / (B) more","(A) 50 / (B) more","(A) 500 / (B) less"],"r":{"a":"1) (A) 5 / (B) less","ev":"10~11번 문장","s":[[10,"It takes about 5 days to build a house.","집 한 채를 짓는 데 약 5일이 걸린다."],[11,"Each house costs less than 7,000 dollars, which is much cheaper than traditional homes.","집 한 채의 비용은 7,000달러도 안 되며, 이는 전통적인 집보다 훨씬 저렴하다."]],"w":"10번 문장에서 집 한 채를 짓는 데 약 5일이 걸림. 11번 문장에서 7,000달러도 안 되며 much cheaper than traditional homes(훨씬 저렴)함. 그래서 5일, 더 적게(less) 든다.","c":1},"h":"234cdbbd56"},{"n":10,"t":"fill","q":"Over 3,000 tons of plastic [A] have already been [B] to build these valuable homes.","ko":"3,000톤이 넘는 플라스틱 [A]이(가) 이 값진 집들을 짓는 데 이미 [B]되었다.","bank":["waste","recycled","durable","skilled","rubber","molds"],"bko":{"waste":"쓰레기","recycled":"재활용된","durable":"튼튼한","skilled":"숙련된","rubber":"고무","molds":"틀"},"r":{"a":"[A] waste, [B] recycled","ev":"13번 문장","s":[[13,"Over 3,000 tons of plastic waste have already been recycled to build these valuable homes.","3,000톤이 넘는 플라스틱 쓰레기가 이 값진 집들을 짓는 데 이미 재활용되었다."]],"w":"13번 문장 Over 3,000 tons of plastic waste have already been recycled to build these valuable homes. rubber, molds는 5번 만드는 과정에 나오는 말이라 이 문장과 맞지 않음.","c":null},"h":"e7a391e7e5"}]},{"u":4,"id":"b3-04-1","no":1,"ko":"도망 못 가는 식물의 비밀 무기는?","items":[{"n":1,"t":"tf","q":"The scent plants release when they are hurt is the same scent you notice when grass is cut.","ko":"식물이 다쳤을 때 내보내는 냄새는 풀을 벨 때 우리가 맡는 냄새와 같다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"When they are hurt or stressed, they release fresh, green scents into the air.","식물은 다치거나 스트레스를 받으면, 싱그러운 풀 냄새를 공기 중으로 내보낸다."],[3,"This is the same scent you notice when grass is cut.","이것은 풀을 벨 때 우리가 맡는 것과 같은 냄새이다."]],"w":"3번 문장에 This is the same scent you notice when grass is cut이 있고, This는 2번의 식물이 다쳤을 때 내보내는 싱그러운 풀 냄새. 내용이 일치함.","c":"T"},"h":"fe054b8e13"},{"n":2,"t":"tf","q":"The damaged leaf's scent keeps parasitic wasps away from the caterpillar.","ko":"상처 입은 잎의 냄새는 기생 말벌이 애벌레에게 가지 못하게 막는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"This smell attracts parasitic wasps.","이 냄새는 기생 말벌을 끌어들인다."]],"w":"7번 문장은 This smell attracts parasitic wasps(이 냄새가 기생 말벌을 끌어들인다)라고 함. 쫓아낸다는 것은 반대임.","c":"F"},"h":"6a985e946d"},{"n":3,"t":"tf","q":"Nearby poplars quickly produce bitter substances after they smell the scent.","ko":"근처의 포플러들은 그 냄새를 맡은 뒤 재빨리 쓴 물질을 만들어 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Nearby poplars smell this scent and quickly produce bitter substances in their leaves to keep insects away.","근처의 포플러들은 이 냄새를 맡고, 곤충을 쫓아내려고 잎에 쓴 물질을 재빨리 만들어 낸다."]],"w":"12번 문장에 Nearby poplars smell this scent and quickly produce bitter substances in their leaves가 있음. 냄새를 맡고 쓴 물질을 만든다는 내용과 일치.","c":"T"},"h":"13506d1f46"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... they release fresh, green scents into the air.)","ko":"... 그것들은 싱그러운 풀 냄새를 공기 중으로 ...","opts":["빨아들인다","내보낸다","감춘다","바꾼다"],"word":"release","r":{"a":"2) 내보낸다","ev":"2번 문장","s":[[2,"When they are hurt or stressed, they release fresh, green scents into the air.","식물은 다치거나 스트레스를 받으면, 싱그러운 풀 냄새를 공기 중으로 내보낸다."]],"w":"2번 문장은 식물이 다치면 냄새를 into the air(공기 중으로) 내보낸다는 내용. 3번에서 그 냄새를 우리가 맡을 수 있다고 하므로 release = 내보내다(방출하다).","c":2},"h":"adbf4119b6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... quickly produce bitter substances in their leaves to keep insects away.)","ko":"... 곤충을 쫓아내려고 잎에 ... 물질을 재빨리 만든다","opts":["달콤한","시큼한","쓴","향긋한"],"word":"bitter","r":{"a":"3) 쓴","ev":"12번 문장","s":[[12,"Nearby poplars smell this scent and quickly produce bitter substances in their leaves to keep insects away.","근처의 포플러들은 이 냄새를 맡고, 곤충을 쫓아내려고 잎에 쓴 물질을 재빨리 만들어 낸다."]],"w":"12번 문장은 곤충이 잎을 먹지 못하게 쫓아내려는 물질. 곤충이 싫어할 맛이니 bitter = 쓴. 달콤하거나 향긋하면 곤충을 오히려 부를 것.","c":3},"h":"cac5f69422"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen a poplar tree is attacked by insects, it releases a scent into the air.","ko":"밑줄 친 it이 가리키는 것은?","sko":"포플러 나무가 곤충의 공격을 받으면, 공기 중으로 냄새를 내보낸다.","opts":["포플러 나무","곤충","공기","기생 말벌"],"r":{"a":"1) 포플러 나무","ev":"11번 문장","s":[[11,"When a poplar tree is attacked by insects, it releases a scent into the air.","포플러 나무가 곤충의 공격을 받으면, 공기 중으로 냄새를 내보낸다."]],"w":"11번 문장에서 곤충의 공격을 받는 것은 a poplar tree이고, 냄새를 내보내는 주어 it도 그 나무. 곤충은 공격하는 쪽이라 냄새를 내보내지 않음.","c":1},"h":"8934b4be59"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By using these scent signals, plants protect themselves quietly but effectively.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이런 냄새 신호를 이용해, 식물은 조용하지만 효과적으로 스스로를 지킨다.","opts":["식물은 냄새 신호를 써서 시끄럽지만 효과적으로 스스로를 지킨다.","식물은 냄새 신호 때문에 조용히 보호받지 못한다.","식물은 냄새 신호를 없애서 스스로를 지킨다.","식물은 이런 냄새 신호를 이용해 조용하지만 효과적으로 스스로를 지킨다."],"r":{"a":"4) 식물은 이런 냄새 신호를 이용해 조용하지만 효과적으로 스스로를 지킨다.","ev":"13번 문장","s":[[13,"By using these scent signals, plants protect themselves quietly but effectively.","이런 냄새 신호를 이용해, 식물은 조용하지만 효과적으로 스스로를 지킨다."]],"w":"By using ~는 '~을 이용해서'이고 quietly but effectively는 '조용하지만 효과적으로'. 냄새는 소리가 아니므로 시끄럽다는 말은 틀림.","c":4},"h":"0fb36caefd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["기생 말벌은 식물의 잎에 알을 낳는다.","애벌레가 식물을 갉아 먹으면 상처 입은 잎이 냄새를 내보낸다.","포플러는 곤충을 끌어들이려고 쓴 물질을 만든다.","식물은 큰 소리를 내어 도움을 청한다."],"opts":["Parasitic wasps lay their eggs on the plant's leaves.","When a caterpillar chews on a plant, the damaged leaf releases a scent.","Poplars make bitter substances to attract insects.","Plants make loud sounds to call for help."],"r":{"a":"2) When a caterpillar chews on a plant, the damaged leaf releases a scent.","ev":"6, 8, 12~13번 문장","s":[[6,"For example, when a caterpillar chews on a plant, the damaged leaf releases a scent.","예를 들어, 애벌레가 식물을 갉아 먹으면, 상처 입은 잎이 냄새를 내보낸다."],[8,"The wasps lay their eggs on the caterpillar, and the young wasps feed on it.","그 말벌은 애벌레에게 알을 낳고, 어린 말벌들은 그 애벌레를 먹고 자란다."],[12,"Nearby poplars smell this scent and quickly produce bitter substances in their leaves to keep insects away.","근처의 포플러들은 이 냄새를 맡고, 곤충을 쫓아내려고 잎에 쓴 물질을 재빨리 만들어 낸다."],[13,"By using these scent signals, plants protect themselves quietly but effectively.","이런 냄새 신호를 이용해, 식물은 조용하지만 효과적으로 스스로를 지킨다."]],"w":"6번 문장과 일치. 1번은 8번(알을 낳는 곳은 애벌레)과 다름, 3번은 12번(곤충을 쫓아내려고)과 반대, 4번은 13번(조용히)과 반대.","c":2},"h":"a680adae2b"},{"n":9,"t":"sum","q":"A damaged plant's scent attracts (A) wasps, which lay eggs on the (B), so further damage to the plant is reduced.","ko":"상처 입은 식물의 냄새는 (A) 말벌을 끌어들이고, 그 말벌이 (B)에게 알을 낳아 식물이 입는 추가 피해가 줄어든다.","oko":["(A) 도움이 되는 / (B) 식물","(A) 기생하는 / (B) 잎","(A) 쓴 / (B) 애벌레","(A) 기생하는 / (B) 애벌레","(A) 쓴 / (B) 잎"],"opts":["(A) helpful / (B) plant","(A) parasitic / (B) leaf","(A) bitter / (B) caterpillar","(A) parasitic / (B) caterpillar","(A) bitter / (B) leaf"],"r":{"a":"4) (A) parasitic / (B) caterpillar","ev":"7~9번 문장","s":[[7,"This smell attracts parasitic wasps.","이 냄새는 기생 말벌을 끌어들인다."],[8,"The wasps lay their eggs on the caterpillar, and the young wasps feed on it.","그 말벌은 애벌레에게 알을 낳고, 어린 말벌들은 그 애벌레를 먹고 자란다."],[9,"This process reduces further damage to the plant.","이 과정은 식물이 입는 추가 피해를 줄여 준다."]],"w":"7번 문장 attracts parasitic wasps, 8번 문장 The wasps lay their eggs on the caterpillar. 알을 낳는 곳은 식물의 잎이 아니라 애벌레이고, 9번에서 그 결과 식물의 추가 피해가 줄어듦.","c":4},"h":"49e82a89af"},{"n":10,"t":"fill","q":"When a poplar tree is attacked by insects, it [A] a scent, and nearby poplars quickly produce [B] substances to keep insects away.","ko":"포플러 나무가 곤충의 공격을 받으면 냄새를 [A], 근처의 포플러들은 곤충을 쫓아내려고 [B] 물질을 재빨리 만든다.","bank":["releases","bitter","fresh","damaged","attracts","parasitic"],"bko":{"releases":"내보낸다","bitter":"쓴","fresh":"싱그러운","damaged":"상처 입은","attracts":"끌어들인다","parasitic":"기생하는"},"r":{"a":"[A] releases, [B] bitter","ev":"11~12번 문장","s":[[11,"When a poplar tree is attacked by insects, it releases a scent into the air.","포플러 나무가 곤충의 공격을 받으면, 공기 중으로 냄새를 내보낸다."],[12,"Nearby poplars smell this scent and quickly produce bitter substances in their leaves to keep insects away.","근처의 포플러들은 이 냄새를 맡고, 곤충을 쫓아내려고 잎에 쓴 물질을 재빨리 만들어 낸다."]],"w":"11번 문장 it releases a scent into the air(냄새를 내보낸다), 12번 문장 produce bitter substances. attracts는 7번 말벌 이야기, fresh는 2번 냄새 설명에 쓰인 말이라 이 문장에는 맞지 않음.","c":null},"h":"1ac7bcbc56"}]},{"u":4,"id":"b3-04-2","no":2,"ko":"고속열차의 소음을 잡아 준 작은 새","items":[{"n":1,"t":"tf","q":"Early bullet trains were fast, but they had a serious problem with noise.","ko":"초기 고속열차는 빨랐지만 소음이라는 심각한 문제가 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Early bullet trains were fast, but they had a serious problem with noise.","초기 고속열차는 빨랐지만 소음이라는 심각한 문제가 있었다."]],"w":"2번 문장에 Early bullet trains were fast, but they had a serious problem with noise가 있음. 빠르지만 소음 문제가 있었다는 내용과 일치.","c":"T"},"h":"97bdd298ca"},{"n":2,"t":"tf","q":"The engineer redesigned the front of the train by himself.","ko":"그 기술자는 혼자서 열차의 앞부분을 다시 설계했다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"His team redesigned the front of the train.","그의 팀은 열차의 앞부분을 다시 설계했다."]],"w":"11번 문장은 His team redesigned the front of the train(그의 팀이 앞부분을 다시 설계했다)이라고 함. 혼자서 했다는 말은 본문에 없고 팀이 했다는 내용과 다름.","c":"F"},"h":"8f0b5f5cce"},{"n":3,"t":"tf","q":"The beak-like shape made the trains quieter, faster, and more energy-efficient.","ko":"부리 같은 모양은 열차를 더 조용하고, 더 빠르고, 에너지 효율이 더 좋게 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"The beak-like shape made the trains quieter, faster, and more energy-efficient.","부리 같은 모양 덕분에 열차는 더 조용하고, 더 빠르고, 에너지 효율이 더 좋아졌다."]],"w":"12번 문장에 The beak-like shape made the trains quieter, faster, and more energy-efficient가 있음. 내용이 그대로 일치.","c":"T"},"h":"49c057a0c8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... an engineer who loved birdwatching was observing a kingfisher.)","ko":"... 새 관찰을 좋아하는 한 기술자가 물총새를 ...","opts":["잡는","그리는","쫓는","관찰하는"],"word":"observing","r":{"a":"4) 관찰하는","ev":"6~7번 문장","s":[[6,"One day, an engineer who loved birdwatching was observing a kingfisher.","어느 날, 새 관찰을 좋아하는 한 기술자가 물총새를 관찰하고 있었다."],[7,"He noticed that when it dove into water beak first, it made almost no splash.","그는 물총새가 부리부터 물속으로 뛰어들 때 물이 거의 튀지 않는다는 것을 알아차렸다."]],"w":"6번 문장의 기술자는 birdwatching(새 관찰)을 좋아하고, 7번에서 그가 notice(알아차리다)한 것이 나옴. 눈여겨보며 살피고 있었다는 뜻이므로 observe = 관찰하다.","c":4},"h":"4317f8193e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Its long, narrow beak helped it move smoothly through water.)","ko":"길고 ... 부리는 그것이 물속을 부드럽게 움직이도록 도왔다","opts":["가느다란","넓은","짧은","무거운"],"word":"narrow","r":{"a":"1) 가느다란","ev":"8번 문장","s":[[8,"Its long, narrow beak helped it move smoothly through water.","길고 가느다란 부리는 물총새가 물속을 부드럽게 헤치고 나아가도록 도왔다."]],"w":"8번 문장의 beak는 long(긴)과 함께 쓰여 물을 부드럽게 가르는 부리. 물을 매끄럽게 가르려면 좁고 가느다란 모양이어야 하므로 narrow = 좁은, 가느다란.","c":1},"h":"c2bfd9eb59"},{"n":6,"t":"ref","q":"What does the underlined \"That\" refer to?\nThat gave him an idea.","ko":"밑줄 친 That이 가리키는 것은?","sko":"그것은 그에게 한 가지 생각을 떠오르게 했다.","opts":["열차가 터널에서 나올 때 쾅 소리가 나는 것","물총새의 길고 가느다란 부리가 물속을 부드럽게 움직이게 해 준 것","그의 팀이 열차 앞부분을 다시 설계한 것","기술자가 새 관찰을 좋아하는 것"],"r":{"a":"2) 물총새의 길고 가느다란 부리가 물속을 부드럽게 움직이게 해 준 것","ev":"7~9번 문장","s":[[7,"He noticed that when it dove into water beak first, it made almost no splash.","그는 물총새가 부리부터 물속으로 뛰어들 때 물이 거의 튀지 않는다는 것을 알아차렸다."],[8,"Its long, narrow beak helped it move smoothly through water.","길고 가느다란 부리는 물총새가 물속을 부드럽게 헤치고 나아가도록 도왔다."],[9,"That gave him an idea.","그것은 그에게 한 가지 생각을 떠오르게 했다."]],"w":"9번의 That은 바로 앞 7~8번 내용, 곧 물총새가 부리부터 뛰어들면 물이 거의 튀지 않고 긴 부리가 물속을 부드럽게 나아가게 한다는 것. 이것이 열차 아이디어(10번)로 이어짐.","c":2},"h":"248bbc2a01"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"What if trains could cut through the air like the kingfisher cuts through water?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"열차도 물총새가 물을 가르듯이 공기를 가를 수 있다면 어떨까?","opts":["열차가 물속을 달린다면 어떨까?","물총새가 열차처럼 공기를 가른다면 어떨까?","열차도 물총새가 물을 가르듯이 공기를 가를 수 있다면 어떨까?","물총새가 열차를 물속으로 끌고 간다면 어떨까?"],"r":{"a":"3) 열차도 물총새가 물을 가르듯이 공기를 가를 수 있다면 어떨까?","ev":"10번 문장","s":[[10,"What if trains could cut through the air like the kingfisher cuts through water?","열차도 물총새가 물을 가르듯이 공기를 가를 수 있다면 어떨까?"]],"w":"What if ~?는 '~라면 어떨까?'. 가르는 주체는 열차(trains)이고, 물총새는 물을 가르는 비교 대상. 주어를 바꾼 선지들은 틀림.","c":3},"h":"19b2c57caa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["물총새가 부리부터 물에 뛰어들 때 물이 거의 튀지 않는다.","물총새의 넓고 짧은 부리는 큰 물보라를 일으킨다.","부리 모양의 앞부분 때문에 열차는 더 시끄러워졌다.","기술자는 열차를 관찰하다가 아이디어를 얻었다."],"opts":["A kingfisher makes almost no splash when it dives into water beak first.","A kingfisher's wide, short beak makes a big splash.","The beak-like front made the trains noisier.","The engineer got the idea while observing a train."],"r":{"a":"1) A kingfisher makes almost no splash when it dives into water beak first.","ev":"6~8, 12번 문장","s":[[6,"One day, an engineer who loved birdwatching was observing a kingfisher.","어느 날, 새 관찰을 좋아하는 한 기술자가 물총새를 관찰하고 있었다."],[7,"He noticed that when it dove into water beak first, it made almost no splash.","그는 물총새가 부리부터 물속으로 뛰어들 때 물이 거의 튀지 않는다는 것을 알아차렸다."],[8,"Its long, narrow beak helped it move smoothly through water.","길고 가느다란 부리는 물총새가 물속을 부드럽게 헤치고 나아가도록 도왔다."],[12,"The beak-like shape made the trains quieter, faster, and more energy-efficient.","부리 같은 모양 덕분에 열차는 더 조용하고, 더 빠르고, 에너지 효율이 더 좋아졌다."]],"w":"7번 문장과 일치. 2번은 7~8번(긴 부리, 물이 거의 안 튐)과 반대, 3번은 12번(더 조용해짐)과 반대, 4번은 6번(물총새를 관찰하다가)과 다름.","c":1},"h":"b371e19f6a"},{"n":9,"t":"sum","q":"The (A)-like shape of the train front made trains quieter, faster, and more energy-efficient, which is an example of biomimicry, learning from (B).","ko":"열차 앞부분의 (A) 같은 모양은 열차를 더 조용하고, 더 빠르고, 에너지 효율이 좋게 했으며, 이것은 (B)에서 배우는 생체모방의 예이다.","oko":["(A) 날개 / (B) 자연","(A) 부리 / (B) 기술자","(A) 부리 / (B) 자연","(A) 꼬리 / (B) 책","(A) 날개 / (B) 터널"],"opts":["(A) wing / (B) nature","(A) beak / (B) engineers","(A) beak / (B) nature","(A) tail / (B) books","(A) wing / (B) tunnels"],"r":{"a":"3) (A) beak / (B) nature","ev":"12~13번 문장","s":[[12,"The beak-like shape made the trains quieter, faster, and more energy-efficient.","부리 같은 모양 덕분에 열차는 더 조용하고, 더 빠르고, 에너지 효율이 더 좋아졌다."],[13,"This is a great example of biomimicry, learning from nature to solve human challenges.","이것은 자연에서 배워 인간의 과제를 해결하는 생체모방의 훌륭한 예이다."]],"w":"12번 문장 The beak-like shape, 13번 문장 biomimicry, learning from nature. 부리 모양과 자연에서 배움이 정답. 날개·꼬리는 본문에 나오지 않음.","c":3},"h":"4cb3c9ee5d"},{"n":10,"t":"fill","q":"When trains came out of tunnels, they made a loud [A], which [B] people nearby and passengers inside.","ko":"열차가 터널에서 나올 때 크게 [A] 소리가 났고, 그것이 근처 사람들과 열차 안의 승객들을 [B].","bank":["boom","disturbed","tunnel","beak","solution","observed"],"bko":{"boom":"쾅 하는 소리","disturbed":"방해했다","tunnel":"터널","beak":"부리","solution":"해결책","observed":"관찰했다"},"r":{"a":"[A] boom, [B] disturbed","ev":"3~4번 문장","s":[[3,"When trains came out of tunnels, they made a loud boom.","열차가 터널에서 나올 때 크게 쾅 하는 소리가 났다."],[4,"It disturbed people nearby and passengers inside.","그 소리는 근처에 사는 사람들과 열차 안의 승객들을 방해했다."]],"w":"3번 문장 they made a loud boom, 4번 문장 It disturbed people nearby and passengers inside. tunnel은 3번에 나오지만 소리 이름이 아니고, beak·observed는 6~8번 물총새 이야기라 맞지 않음.","c":null},"h":"96b324319a"}]},{"u":4,"id":"b3-04-3","no":3,"ko":"수십 년이 지나도 기름 냄새가 남은 바다","items":[{"n":1,"t":"tf","q":"The Exxon Valdez hit a reef in Prince William Sound in Alaska.","ko":"엑손 발데즈호는 알래스카의 프린스 윌리엄 해협에서 암초에 부딪쳤다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The Exxon Valdez oil tanker hit a reef in Prince William Sound in Alaska.","유조선 엑손 발데즈호가 알래스카의 프린스 윌리엄 해협에서 암초에 부딪쳤다."]],"w":"2번 문장에 The Exxon Valdez oil tanker hit a reef in Prince William Sound in Alaska가 있음. 장소와 사건이 모두 일치.","c":"T"},"h":"5335435184"},{"n":2,"t":"tf","q":"The killer whales returned soon after the oil spill.","ko":"범고래들은 기름 유출 직후 곧 돌아왔다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Some killer whales disappeared and never returned.","일부 범고래는 사라져서 돌아오지 않았다."]],"w":"11번 문장은 Some killer whales disappeared and never returned(일부 범고래는 사라져서 돌아오지 않았다)라고 함. 곧 돌아왔다는 것은 반대임.","c":"F"},"h":"2ca5479f5c"},{"n":3,"t":"tf","q":"Even after decades, the smell of oil can still come up in some areas.","ko":"수십 년이 지난 뒤에도 일부 지역에서는 여전히 기름 냄새가 올라올 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Even after decades, just a small wave still brings up the smell of oil in some areas.","수십 년이 지난 뒤에도, 작은 파도만 쳐도 일부 지역에서는 여전히 기름 냄새가 올라온다."]],"w":"12번 문장에 Even after decades, just a small wave still brings up the smell of oil이 있음. 수십 년이 지나도 기름 냄새가 남아 있다는 내용과 일치.","c":"T"},"h":"3931da773e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (On March 24, 1989, a terrible disaster took place in the U.S.)","ko":"1989년 3월 24일, 미국에서 끔찍한 ...이(가) 일어났다","opts":["재난","축제","발견","계획"],"word":"disaster","r":{"a":"1) 재난","ev":"1~3번 문장","s":[[1,"On March 24, 1989, a terrible disaster took place in the U.S.","1989년 3월 24일, 미국에서 끔찍한 재난이 일어났다."],[2,"The Exxon Valdez oil tanker hit a reef in Prince William Sound in Alaska.","유조선 엑손 발데즈호가 알래스카의 프린스 윌리엄 해협에서 암초에 부딪쳤다."],[3,"It spilled nearly 42 million liters of crude oil.","그 배는 거의 4,200만 리터의 원유를 쏟았다."]],"w":"1번의 terrible disaster 뒤에 2~3번에서 배가 암초에 부딪쳐 원유를 쏟은 사건이 이어짐. 끔찍한 사건이므로 disaster = 재난.","c":1},"h":"2f52a0d2bb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Thousands of workers and volunteers rushed to help.)","ko":"수천 명의 작업자와 자원봉사자가 도우러 ...","opts":["천천히 걸어갔다","망설였다","서둘러 달려왔다","돌아갔다"],"word":"rushed","r":{"a":"3) 서둘러 달려왔다","ev":"6번 문장","s":[[6,"Thousands of workers and volunteers rushed to help.","수천 명의 작업자와 자원봉사자가 도우러 달려왔다."]],"w":"6번 문장은 큰 사고 뒤에 작업자와 자원봉사자가 도우러 왔다는 내용. 급한 상황이라 rush(서둘러 가다)가 알맞음.","c":3},"h":"07ee8196eb"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nOn Alaska's rocky beaches, they washed sea otters with soap.","ko":"밑줄 친 they가 가리키는 것은?","sko":"알래스카의 바위투성이 해변에서, 그들은 해달을 비누로 씻겼다.","opts":["해달들","수천 명의 작업자와 자원봉사자","범고래들","바닷새들"],"r":{"a":"2) 수천 명의 작업자와 자원봉사자","ev":"6~7번 문장","s":[[6,"Thousands of workers and volunteers rushed to help.","수천 명의 작업자와 자원봉사자가 도우러 달려왔다."],[7,"On Alaska’s rocky beaches, they washed sea otters with soap.","알래스카의 바위투성이 해변에서, 그들은 해달을 비누로 씻겼다."]],"w":"7번의 they는 앞 문장(6번)에서 도우러 달려온 workers and volunteers. 해달은 씻김을 당한 쪽(washed의 대상)이라 they가 아님.","c":2},"h":"b147dba95e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Exxon Valdez spill shows how one accident can cause lasting damage to an ecosystem.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"엑손 발데즈호 유출 사고는 하나의 사고가 생태계에 얼마나 오래가는 피해를 줄 수 있는지 보여 준다.","opts":["엑손 발데즈호 사고 뒤 생태계는 금방 회복되었다.","하나의 사고는 생태계에 아무 영향도 줄 수 없다.","엑손 발데즈호는 생태계를 지키려고 만든 배이다.","엑손 발데즈호 유출은 하나의 사고가 생태계에 오래가는 피해를 줄 수 있음을 보여 준다."],"r":{"a":"4) 엑손 발데즈호 유출은 하나의 사고가 생태계에 오래가는 피해를 줄 수 있음을 보여 준다.","ev":"12~13번 문장","s":[[12,"Even after decades, just a small wave still brings up the smell of oil in some areas.","수십 년이 지난 뒤에도, 작은 파도만 쳐도 일부 지역에서는 여전히 기름 냄새가 올라온다."],[13,"The Exxon Valdez spill shows how one accident can cause lasting damage to an ecosystem.","엑손 발데즈호 유출 사고는 하나의 사고가 생태계에 얼마나 오래가는 피해를 줄 수 있는지 보여 준다."]],"w":"lasting damage는 '오래가는 피해'. 12번에서 수십 년 뒤에도 기름 냄새가 남는다고 했으니 금방 회복되었다는 말은 반대.","c":4},"h":"eb393b46c0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["기름은 약 20킬로미터의 해안선에 퍼졌다.","작업자들은 물을 전혀 쓰지 않고 해변을 청소했다.","도움이 오기 전에 많은 동물이 죽었다.","사고는 1989년에 캐나다에서 일어났다."],"opts":["The oil spread across only about 20 kilometers of coastline.","Workers cleaned the beaches without using any water.","Many animals died before help arrived.","The accident took place in Canada in 1989."],"r":{"a":"3) Many animals died before help arrived.","ev":"1, 4, 8, 10번 문장","s":[[1,"On March 24, 1989, a terrible disaster took place in the U.S.","1989년 3월 24일, 미국에서 끔찍한 재난이 일어났다."],[4,"The oil spread across more than 2,000 kilometers of coastline.","기름은 2,000킬로미터가 넘는 해안선에 걸쳐 퍼졌다."],[8,"They also dug up oily sand and sprayed hot water to clean oil off the rocks.","그들은 또 기름 묻은 모래를 파내고 뜨거운 물을 뿌려 바위에서 기름을 씻어 냈다."],[10,"Many animals died before help arrived, including over 300 harbor seals, 2,800 sea otters, and 250,000 seabirds.","도움이 오기 전에 많은 동물이 죽었는데, 항구 바다표범 300마리가 넘게, 해달 2,800마리, 바닷새 25만 마리가 포함되었다."]],"w":"10번 문장과 일치. 1번은 4번(2,000킬로미터가 넘게)과 다름, 2번은 8번(뜨거운 물을 뿌림)과 반대, 4번은 1번(미국에서 일어남)과 다름.","c":3},"h":"450e773faf"},{"n":9,"t":"sum","q":"Before help arrived, many animals (A), and some killer whales (B) and never returned.","ko":"도움이 오기 전에 많은 동물이 (A)했고, 일부 범고래는 (B)하여 돌아오지 않았다.","oko":["(A) 탈출했고 / (B) 사라져","(A) 죽었고 / (B) 사라져","(A) 자랐고 / (B) 나타나","(A) 죽었고 / (B) 나타나","(A) 탈출했고 / (B) 나타나"],"opts":["(A) escaped / (B) disappeared","(A) died / (B) disappeared","(A) grew / (B) appeared","(A) died / (B) appeared","(A) escaped / (B) appeared"],"r":{"a":"2) (A) died / (B) disappeared","ev":"10~11번 문장","s":[[10,"Many animals died before help arrived, including over 300 harbor seals, 2,800 sea otters, and 250,000 seabirds.","도움이 오기 전에 많은 동물이 죽었는데, 항구 바다표범 300마리가 넘게, 해달 2,800마리, 바닷새 25만 마리가 포함되었다."],[11,"Some killer whales disappeared and never returned.","일부 범고래는 사라져서 돌아오지 않았다."]],"w":"10번 문장 Many animals died before help arrived, 11번 문장 Some killer whales disappeared and never returned. 따라서 died와 disappeared.","c":2},"h":"1516de514b"},{"n":10,"t":"fill","q":"The Exxon Valdez [A] nearly 42 million liters of crude oil, and the accident caused lasting damage to an [B].","ko":"엑손 발데즈호는 거의 4,200만 리터의 원유를 [A], 그 사고는 [B]에 오래가는 피해를 주었다.","bank":["spilled","ecosystem","rushed","rocky","volunteers","disaster"],"bko":{"spilled":"쏟았다","ecosystem":"생태계","rushed":"서둘러 갔다","rocky":"바위투성이의","volunteers":"자원봉사자들","disaster":"재난"},"r":{"a":"[A] spilled, [B] ecosystem","ev":"3, 13번 문장","s":[[3,"It spilled nearly 42 million liters of crude oil.","그 배는 거의 4,200만 리터의 원유를 쏟았다."],[13,"The Exxon Valdez spill shows how one accident can cause lasting damage to an ecosystem.","엑손 발데즈호 유출 사고는 하나의 사고가 생태계에 얼마나 오래가는 피해를 줄 수 있는지 보여 준다."]],"w":"3번 문장 It spilled nearly 42 million liters of crude oil, 13번 문장 lasting damage to an ecosystem. rushed, rocky 등은 6~7번의 구조 활동 설명에 쓰인 말임.","c":null},"h":"e8ef8397b9"}]},{"u":4,"id":"b3-04-4","no":4,"ko":"화산이 터진 뒤 오히려 시작되는 것은?","items":[{"n":1,"t":"tf","q":"After a volcano erupts, everything is covered in gray ash.","ko":"화산이 폭발한 뒤에는 모든 것이 회색 재로 뒤덮인다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"After a volcano erupts, everything is covered in gray ash.","화산이 폭발한 뒤에는 모든 것이 회색 재로 뒤덮인다."]],"w":"1번 문장에 After a volcano erupts, everything is covered in gray ash가 있음. 폭발 뒤 회색 재로 덮인다는 내용과 일치.","c":"T"},"h":"cbb4a8d87e"},{"n":2,"t":"tf","q":"The nutrients in volcanic soil promote shallow roots.","ko":"화산 토양의 영양분은 얕은 뿌리를 촉진한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"These nutrients promote deep roots and help crops develop rich flavors.","이 영양분은 깊은 뿌리를 키우고 작물이 풍부한 맛을 내도록 돕는다."]],"w":"8번 문장은 These nutrients promote deep roots(깊은 뿌리를 촉진한다)라고 함. 얕은 뿌리라고 한 것은 반대임.","c":"F"},"h":"c3654be340"},{"n":3,"t":"tf","q":"Hawaiian macadamia nuts are known for their sweet, buttery flavor.","ko":"하와이의 마카다미아 너트는 달콤하고 고소한 맛으로 알려져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Grapes from Mount Etna in Italy are famous for producing flavorful wines, and Hawaiian macadamia nuts are known for their sweet, buttery flavor.","이탈리아 에트나산의 포도는 풍미 좋은 와인을 만드는 것으로 유명하고, 하와이의 마카다미아 너트는 달콤하고 고소한 맛으로 알려져 있다."]],"w":"12번 문장에 Hawaiian macadamia nuts are known for their sweet, buttery flavor가 있음. 내용이 그대로 일치.","c":"T"},"h":"12d06ef17e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Although volcanoes seem destructive, they leave behind rich soil that supports new life.)","ko":"화산은 ...으로 보이지만, 새로운 생명을 지탱하는 비옥한 흙을 남긴다","opts":["도움이 되는","조용한","파괴적인","아름다운"],"word":"destructive","r":{"a":"3) 파괴적인","ev":"13번 문장","s":[[13,"Although volcanoes seem destructive, they leave behind rich soil that supports new life.","화산은 파괴적으로 보이지만, 새로운 생명을 지탱하는 비옥한 흙을 남긴다."]],"w":"13번 문장 Although 뒤에 '~으로 보이지만 비옥한 흙을 남긴다'는 반전이 있음. 1~2번의 재로 뒤덮인 끝처럼 보이는 모습이므로 destructive = 파괴적인.","c":3},"h":"ecc8780b01"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These nutrients promote deep roots and help crops develop rich flavors.)","ko":"이 영양분은 깊은 뿌리를 ... 작물이 풍부한 맛을 내도록 돕는다","opts":["막는다","촉진한다","잊는다","판다"],"word":"promote","r":{"a":"2) 촉진한다","ev":"8번 문장","s":[[8,"These nutrients promote deep roots and help crops develop rich flavors.","이 영양분은 깊은 뿌리를 키우고 작물이 풍부한 맛을 내도록 돕는다."]],"w":"8번 문장은 영양분이 좋은 뿌리와 맛을 만들도록 돕는다는 내용. help와 나란히 쓰였으니 promote = 촉진하다, 잘 자라게 하다.","c":2},"h":"ef9eb89483"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis creates healthy conditions for crops to grow.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 작물이 자라기에 건강한 조건을 만든다.","opts":["재가 회색으로 뒤덮이는 것","화산이 폭발하는 것","포도로 와인을 만드는 것","흙이 건조할 때는 물을 머금고 폭우에는 물이 잘 빠지는 것"],"r":{"a":"4) 흙이 건조할 때는 물을 머금고 폭우에는 물이 잘 빠지는 것","ev":"9~10번 문장","s":[[9,"The soil also holds water well during dry periods and drains easily during heavy rain.","그 흙은 또 건조한 시기에는 물을 잘 머금고 폭우가 올 때는 물이 잘 빠진다."],[10,"This creates healthy conditions for crops to grow.","이것은 작물이 자라기에 건강한 조건을 만든다."]],"w":"10번의 This는 바로 앞 9번 내용, 곧 흙이 건조한 때는 물을 잘 머금고 폭우가 올 때는 물이 잘 빠지는 것. 그것이 작물에게 건강한 조건이 됨.","c":4},"h":"30be3a267e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, it is actually the start of new life.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 사실 그것은 새로운 생명의 시작이다.","opts":["그러나 사실은 새로운 생명이 시작되는 때이다.","그래서 그것은 생명의 끝이다.","하지만 그것은 회색 재가 시작되는 것이다.","그러나 그것은 새로운 생명을 끝내 버린다."],"r":{"a":"1) 그러나 사실은 새로운 생명이 시작되는 때이다.","ev":"2~3번 문장","s":[[2,"It looks like the end of life around the volcano.","그것은 화산 주변 생명의 끝처럼 보인다."],[3,"However, it is actually the start of new life.","하지만 사실 그것은 새로운 생명의 시작이다."]],"w":"2번에서 생명의 끝처럼 보인다고 한 뒤, However(그러나)로 뒤집어 actually(사실은) 새 생명의 시작이라고 함. 끝이라고 하는 선지는 3번과 반대.","c":1},"h":"da98316742"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["화산재에는 미네랄이 거의 없다.","화산 지역의 흙은 농사에 알맞지 않다.","화산재에는 중요한 미네랄이 많이 들어 있다.","화산 토양은 건조한 시기에 물을 머금지 못한다."],"opts":["Volcanic ash has few minerals.","Volcanic soil is poor for farming.","Volcanic ash has many important minerals.","Volcanic soil cannot hold water during dry periods."],"r":{"a":"3) Volcanic ash has many important minerals.","ev":"4, 6, 9번 문장","s":[[4,"Volcanic ash has many important minerals.","화산재에는 중요한 미네랄이 많이 들어 있다."],[6,"This process forms a dark, rich soil for farming.","이 과정은 농사에 알맞은 검고 비옥한 흙을 만든다."],[9,"The soil also holds water well during dry periods and drains easily during heavy rain.","그 흙은 또 건조한 시기에는 물을 잘 머금고 폭우가 올 때는 물이 잘 빠진다."]],"w":"4번 문장과 일치. 1번은 4번과 반대, 2번은 6번(농사에 알맞은 비옥한 흙)과 반대, 4번은 9번(건조한 시기에 물을 잘 머금음)과 반대.","c":3},"h":"400e44616a"},{"n":9,"t":"sum","q":"Rain and wind break down volcanic ash, so the (A) are released and form a (B) soil for farming.","ko":"비와 바람이 화산재를 분해하면 (A)이(가) 방출되어 농사에 알맞은 (B) 흙을 이룬다.","oko":["(A) 동물 / (B) 비옥한","(A) 미네랄 / (B) 메마른","(A) 뿌리 / (B) 메마른","(A) 작물 / (B) 건조한","(A) 미네랄 / (B) 비옥한"],"opts":["(A) animals / (B) rich","(A) minerals / (B) poor","(A) roots / (B) poor","(A) crops / (B) dry","(A) minerals / (B) rich"],"r":{"a":"5) (A) minerals / (B) rich","ev":"5~6번 문장","s":[[5,"As rain and wind break down the ash, these minerals are released and mix with the ground.","비와 바람이 재를 잘게 분해하면서, 이 미네랄들이 방출되어 땅과 섞인다."],[6,"This process forms a dark, rich soil for farming.","이 과정은 농사에 알맞은 검고 비옥한 흙을 만든다."]],"w":"5번 문장 these minerals are released and mix with the ground, 6번 문장 forms a dark, rich soil for farming. 따라서 minerals와 rich.","c":5},"h":"efcd03f48a"},{"n":10,"t":"fill","q":"The soil holds [A] well during dry periods and drains easily during heavy rain, which creates healthy conditions for [B] to grow.","ko":"그 흙은 건조한 시기에 [A]을(를) 잘 머금고 폭우가 올 때는 잘 빠져서, [B]이(가) 자라기에 건강한 조건을 만든다.","bank":["water","crops","ash","wind","flavors","volcano"],"bko":{"water":"물","crops":"작물","ash":"재","wind":"바람","flavors":"맛","volcano":"화산"},"r":{"a":"[A] water, [B] crops","ev":"9~10번 문장","s":[[9,"The soil also holds water well during dry periods and drains easily during heavy rain.","그 흙은 또 건조한 시기에는 물을 잘 머금고 폭우가 올 때는 물이 잘 빠진다."],[10,"This creates healthy conditions for crops to grow.","이것은 작물이 자라기에 건강한 조건을 만든다."]],"w":"9번 문장 holds water well during dry periods, 10번 문장 healthy conditions for crops to grow. ash·wind·volcano는 이 문장의 빈칸에 넣으면 뜻이 맞지 않고, flavors는 8번에서 작물이 내는 맛으로 나온 말이라 '자라는 대상'이 아님.","c":null},"h":"968307d8ba"}]},{"u":5,"id":"b3-05-1","no":1,"ko":"'죽음의 상인'이라 불린 남자가 노벨상을 만든 이유","items":[{"n":1,"t":"tf","q":"A newspaper correctly reported that Alfred had died.","ko":"한 신문은 알프레드가 죽었다고 정확하게 보도했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"When Alfred’s brother died, it mistakenly reported that Alfred had died instead.","알프레드의 형이 죽었을 때, 그 신문은 알프레드가 대신 죽었다고 잘못 보도했다."]],"w":"6번 문장에서 죽은 사람은 알프레드의 형이에요. 신문이 알프레드가 죽었다고 잘못 보도한(mistakenly reported) 거라서 '정확하게'는 틀려요.","c":"F"},"h":"f52562741f"},{"n":2,"t":"tf","q":"Alfred hoped that dynamite would help with mining and building.","ko":"알프레드는 다이너마이트가 채굴과 건축에 도움이 되기를 바랐다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He hoped his invention would help with mining and building.","그는 자신의 발명품이 채굴과 건축에 도움이 되기를 바랐다."]],"w":"3번 문장에 He hoped his invention would help with mining and building이 그대로 있어요. his invention이 다이너마이트예요.","c":"T"},"h":"aa015416c4"},{"n":3,"t":"tf","q":"Alfred left his money to make weapons for the world.","ko":"알프레드는 세상을 위해 무기를 만들도록 자신의 돈을 남겼다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"He decided to leave all his money to create prizes for people who bring the greatest benefit to the world.","그는 세상에 가장 큰 이익을 가져다주는 사람들을 위한 상을 만들기 위해 자신의 모든 돈을 남기기로 결심했다."]],"w":"11번 문장에서 돈을 남긴 목적은 상을 만들어 세상에 큰 이익을 주는 사람들에게 주는 것이에요. 무기를 만드는 일이 아니에요.","c":"F"},"h":"fb6b9e56c6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When Alfred's brother died, it mistakenly reported that Alfred had died instead.)","ko":"알프레드의 형이 죽었을 때, 그 신문은 알프레드가 대신 죽었다고 mistakenly 보도했다.","opts":["일부러","정확하게","잘못하여","재빠르게"],"word":"mistakenly","r":{"a":"3) 잘못하여","ev":"5~6번 문장","s":[[5,"In 1888, a newspaper made a big mistake.","1888년에 한 신문이 큰 실수를 했다."],[6,"When Alfred’s brother died, it mistakenly reported that Alfred had died instead.","알프레드의 형이 죽었을 때, 그 신문은 알프레드가 대신 죽었다고 잘못 보도했다."]],"w":"5번에서 신문이 '큰 실수(a big mistake)'를 했다고 해요. 6번의 mistakenly는 그 실수에서 나온 말로 '잘못하여'예요.","c":3},"h":"5452021799"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Today, the Nobel Prize honors great achievements in many fields.)","ko":"오늘날 노벨상은 여러 분야의 위대한 업적을 기린다(honors).","opts":["숨기다","금지하다","바꾸다","기리다"],"word":"honors","r":{"a":"4) 기리다","ev":"12번 문장","s":[[12,"Today, the Nobel Prize honors great achievements in many fields like peace, science, and literature, just as Alfred wished.","오늘날 노벨상은 알프레드가 바란 대로 평화, 과학, 문학 같은 여러 분야의 위대한 업적을 기린다."]],"w":"노벨상은 위대한 업적을 이룬 사람에게 주는 상이에요. honor(기리다)는 훌륭한 일을 높이 인정한다는 뜻이에요.","c":4},"h":"59a33e0e31"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHowever, it was also used in war to harm people.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만 그것은 전쟁에서 사람들을 해치는 데에도 사용되었다.","opts":["노벨상","다이너마이트","신문","채굴"],"r":{"a":"2) 다이너마이트","ev":"3~4번 문장","s":[[3,"He hoped his invention would help with mining and building.","그는 자신의 발명품이 채굴과 건축에 도움이 되기를 바랐다."],[4,"However, it was also used in war to harm people.","하지만 그것은 전쟁에서 사람들을 해치는 데에도 사용되었다."]],"w":"3번에서 알프레드가 도움이 되기를 바란 his invention이 다이너마이트예요. 4번의 it은 그 발명품이 전쟁에도 쓰였다는 말이에요.","c":2},"h":"f4792c5473"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He didn't want to be remembered that way.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 그런 식으로 기억되고 싶지 않았다.","opts":["그는 사람들이 자신을 죽음의 상인으로 기억하는 것을 원하지 않았다.","그는 사람들이 자신을 전혀 기억하지 않기를 바랐다.","그는 자신의 형이 기억되기를 원하지 않았다.","그는 기억하는 방법을 배우고 싶지 않았다."],"r":{"a":"1) 그는 사람들이 자신을 죽음의 상인으로 기억하는 것을 원하지 않았다.","ev":"8~10번 문장","s":[[8,"It even called him “The Merchant of Death.”","그것은 심지어 그를 “죽음의 상인”이라고 불렀다."],[9,"Alfred was shocked and deeply saddened.","알프레드는 충격을 받았고 깊이 슬퍼했다."],[10,"He didn’t want to be remembered that way.","그는 그런 식으로 기억되고 싶지 않았다."]],"w":"that way는 8번의 '죽음의 상인'이라는 별명이에요. 충격을 받은 알프레드가 그런 모습으로 기억되기 싫었다는 뜻이에요.","c":1},"h":"3ed7fd3d6d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["신문은 알프레드가 가난한 사람들을 도와 부자가 되었다고 썼다.","알프레드는 죽음의 상인이라고 불린 것을 자랑스러워했다.","알프레드는 자신의 돈으로 노벨상을 만들었다.","노벨상은 평화 분야에만 주어진다."],"opts":["The newspaper said Alfred became rich by helping poor people.","Alfred was proud to be called \"The Merchant of Death.\"","Alfred used his money to create the Nobel Prizes.","The Nobel Prize is given only for peace."],"r":{"a":"3) Alfred used his money to create the Nobel Prizes.","ev":"7, 9, 11~12번 문장","s":[[7,"The article said that he became rich by making weapons.","그 기사는 그가 무기를 만들어 부자가 되었다고 말했다."],[9,"Alfred was shocked and deeply saddened.","알프레드는 충격을 받았고 깊이 슬퍼했다."],[11,"He decided to leave all his money to create prizes for people who bring the greatest benefit to the world.","그는 세상에 가장 큰 이익을 가져다주는 사람들을 위한 상을 만들기 위해 자신의 모든 돈을 남기기로 결심했다."],[12,"Today, the Nobel Prize honors great achievements in many fields like peace, science, and literature, just as Alfred wished.","오늘날 노벨상은 알프레드가 바란 대로 평화, 과학, 문학 같은 여러 분야의 위대한 업적을 기린다."]],"w":"11번에서 알프레드는 모든 돈으로 상을 만들기로 했어요. 신문은 무기로 부자가 됐다고 했고(7번), 알프레드는 충격을 받았고(9번), 상은 평화·과학·문학 등 여러 분야에 주어져요(12번).","c":3},"h":"cd81deba4d"},{"n":9,"t":"sum","q":"A newspaper called Alfred \"The Merchant of Death,\" so he felt (A). He decided to leave his money to create prizes for people who bring the greatest (B) to the world.","ko":"신문이 알프레드를 “죽음의 상인”이라고 불러서 그는 (A)했다. 그는 세상에 가장 큰 (B)을 가져다주는 사람들을 위한 상을 만들려고 돈을 남기기로 했다.","oko":["(A) 자랑스러워한다 / (B) 이익","(A) 충격을 받는다 / (B) 돈","(A) 행복해한다 / (B) 전쟁","(A) 충격을 받는다 / (B) 위험","(A) 충격을 받는다 / (B) 이익"],"opts":["(A) proud / (B) benefit","(A) shocked / (B) money","(A) happy / (B) war","(A) shocked / (B) danger","(A) shocked / (B) benefit"],"r":{"a":"5) (A) shocked / (B) benefit","ev":"8~9, 11번 문장","s":[[8,"It even called him “The Merchant of Death.”","그것은 심지어 그를 “죽음의 상인”이라고 불렀다."],[9,"Alfred was shocked and deeply saddened.","알프레드는 충격을 받았고 깊이 슬퍼했다."],[11,"He decided to leave all his money to create prizes for people who bring the greatest benefit to the world.","그는 세상에 가장 큰 이익을 가져다주는 사람들을 위한 상을 만들기 위해 자신의 모든 돈을 남기기로 결심했다."]],"w":"8~9번에서 죽음의 상인이라 불리고 충격을 받았어요(shocked). 그래서 11번에서 세상에 큰 이익(benefit)을 주는 사람들을 위한 상을 만들기로 했어요.","c":5},"h":"668fd2ab27"},{"n":10,"t":"fill","q":"Today, the Nobel Prize honors great [A] in many fields, and Alfred's name is now a symbol of [B].","ko":"오늘날 노벨상은 여러 분야의 위대한 [A]을 기리고, 알프레드의 이름은 이제 [B]의 상징이다.","bank":["achievements","peace","weapons","newspaper","mining","war"],"bko":{"achievements":"업적","peace":"평화","weapons":"무기","newspaper":"신문","mining":"채굴","war":"전쟁"},"r":{"a":"[A] achievements, [B] peace","ev":"12~13번 문장","s":[[12,"Today, the Nobel Prize honors great achievements in many fields like peace, science, and literature, just as Alfred wished.","오늘날 노벨상은 알프레드가 바란 대로 평화, 과학, 문학 같은 여러 분야의 위대한 업적을 기린다."],[13,"Through these awards, his name is now a symbol of peace.","이 상들을 통해 그의 이름은 이제 평화의 상징이 되었다."]],"w":"12번에서 노벨상이 기리는 것은 위대한 업적(achievements), 13번에서 알프레드의 이름은 평화(peace)의 상징이 되었어요. weapons와 war는 처음에 그가 비난받은 이유라서 반대예요.","c":null},"h":"6d7e5537f7"}]},{"u":5,"id":"b3-05-2","no":2,"ko":"구멍 없는 공 모양이었던 도넛, 구멍은 누가 뚫었을까?","items":[{"n":1,"t":"tf","q":"Early donuts always cooked evenly.","ko":"초기 도넛은 항상 고르게 익었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"They did not always cook evenly because the outside could cook too fast while the inside could stay raw.","바깥쪽은 너무 빨리 익고 안쪽은 날것으로 남을 수 있어서, 도넛은 항상 고르게 익지는 않았다."]],"w":"8번에서 초기 도넛은 항상 고르게 익지는 않았다고 해요. 겉은 너무 빨리 익고 속은 날것으로 남을 수 있었어요.","c":"F"},"h":"d3cb2d665f"},{"n":2,"t":"tf","q":"Dutch settlers brought their version of fried dough to America in the early 1700s.","ko":"네덜란드 정착민들은 1700년대 초에 자기들의 튀긴 반죽 음식을 미국에 가져왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"In the early 1700s, Dutch settlers brought their version of fried dough to America.","1700년대 초, 네덜란드 정착민들이 튀긴 반죽으로 만든 자기들의 음식을 미국에 가져왔다."]],"w":"4번 문장에 그대로 나와요. 이 일이 지금 도넛의 시작이었어요(5번).","c":"T"},"h":"ccff3daf32"},{"n":3,"t":"tf","q":"Hanson Gregory was a Dutch settler who came to America in the early 1700s.","ko":"한센 그레고리는 1700년대 초에 미국으로 온 네덜란드 정착민이었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"One day in the 1800s, an American sailor named Hanson Gregory came up with a clever idea.","1800년대 어느 날, 한센 그레고리라는 이름의 미국인 선원이 기발한 생각을 떠올렸다."]],"w":"10번에서 한센 그레고리는 1800년대의 미국인 선원이에요. 1700년대 초에 온 네덜란드 정착민은 4번에서 나오는 다른 사람들이에요.","c":"F"},"h":"57146ecc5e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He cut a hole in the center of his donuts so the dough would cook more evenly throughout.)","ko":"그는 반죽이 전체적으로 더 evenly 익도록 도넛 가운데에 구멍을 냈다.","opts":["고르게","빠르게","조용히","달콤하게"],"word":"evenly","r":{"a":"1) 고르게","ev":"8, 11번 문장","s":[[8,"They did not always cook evenly because the outside could cook too fast while the inside could stay raw.","바깥쪽은 너무 빨리 익고 안쪽은 날것으로 남을 수 있어서, 도넛은 항상 고르게 익지는 않았다."],[11,"He cut a hole in the center of his donuts so the dough would cook more evenly throughout.","그는 반죽이 전체적으로 더 고르게 익도록 도넛 가운데에 구멍을 냈다."]],"w":"8번에서 겉은 빨리 익고 속은 날것인 것이 문제였어요. 11번은 그 문제를 해결하려고 전체가 고르게(evenly) 익게 한 거예요.","c":1},"h":"05d7a07cc7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Over time, people tried different ways to improve donuts.)","ko":"시간이 지나면서, 사람들은 도넛을 improve하는 여러 방법을 시도했다.","opts":["숨기다","팔다","개선하다","비교하다"],"word":"improve","r":{"a":"3) 개선하다","ev":"8~9번 문장","s":[[8,"They did not always cook evenly because the outside could cook too fast while the inside could stay raw.","바깥쪽은 너무 빨리 익고 안쪽은 날것으로 남을 수 있어서, 도넛은 항상 고르게 익지는 않았다."],[9,"Over time, people tried different ways to improve donuts.","시간이 지나면서, 사람들은 도넛을 개선하는 여러 방법을 시도했다."]],"w":"8번에서 도넛에 문제가 있었어요. 그래서 사람들이 문제를 해결해 더 낫게 만들려고 했으니 improve는 '개선하다'예요.","c":3},"h":"fa215a3416"},{"n":6,"t":"ref","q":"What does the underlined \"That simple trick\" refer to?\nThat simple trick gave us the classic ring-shaped donut we enjoy today.","ko":"밑줄 친 That simple trick이 가리키는 것은?","sko":"그 간단한 요령이 오늘날 우리가 즐기는 고전적인 고리 모양 도넛을 우리에게 주었다.","opts":["도넛에 과일을 채운 것","도넛을 공 모양으로 만든 것","반죽을 더 오래 튀긴 것","도넛 가운데에 구멍을 낸 것"],"r":{"a":"4) 도넛 가운데에 구멍을 낸 것","ev":"11~12번 문장","s":[[11,"He cut a hole in the center of his donuts so the dough would cook more evenly throughout.","그는 반죽이 전체적으로 더 고르게 익도록 도넛 가운데에 구멍을 냈다."],[12,"That simple trick gave us the classic ring-shaped donut we enjoy today.","그 간단한 요령이 오늘날 우리가 즐기는 고전적인 고리 모양 도넛을 우리에게 주었다."]],"w":"고리 모양 도넛을 만들어 낸 요령은 11번에서 도넛 가운데에 구멍을 낸 일이에요.","c":4},"h":"b072b6e9dc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They did not always cook evenly because the outside could cook too fast while the inside could stay raw.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"바깥쪽은 너무 빨리 익고 안쪽은 날것으로 남을 수 있어서, 도넛은 항상 고르게 익지는 않았다.","opts":["도넛은 항상 안쪽부터 먼저 익었다.","겉은 너무 빨리 익고 속은 덜 익을 수 있어서 항상 고르게 익지는 않았다.","도넛은 겉과 속이 항상 같은 속도로 익었다.","겉은 늦게 익고 속은 타 버려서 항상 고르게 익지 않았다."],"r":{"a":"2) 겉은 너무 빨리 익고 속은 덜 익을 수 있어서 항상 고르게 익지는 않았다.","ev":"8번 문장","s":[[8,"They did not always cook evenly because the outside could cook too fast while the inside could stay raw.","바깥쪽은 너무 빨리 익고 안쪽은 날것으로 남을 수 있어서, 도넛은 항상 고르게 익지는 않았다."]],"w":"while 앞은 겉이 너무 빨리 익는다는 말이고 뒤는 속이 날것으로 남는다는 말이에요. 그래서 겉과 속의 익는 정도가 달랐어요.","c":2},"h":"00d6b268b4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["도넛은 언제나 가운데에 구멍이 있었다.","초기 도넛은 고리 모양이었다.","네덜란드 정착민들이 도넛에 구멍을 냈다.","초기 도넛은 과일, 견과류, 향신료로 속이 채워져 있었다."],"opts":["Donuts have always had a hole in the middle.","Early donuts were shaped like rings.","Dutch settlers cut a hole in their donuts.","Early donuts were filled with fruit, nuts, or spices."],"r":{"a":"4) Early donuts were filled with fruit, nuts, or spices.","ev":"2, 6, 10~11번 문장","s":[[2,"But donuts didn’t always look this way.","하지만 도넛이 항상 이런 모양이었던 것은 아니다."],[6,"These early donuts were shaped like balls and filled with fruit, nuts, or spices.","이 초기 도넛은 공 모양이었고 과일, 견과류, 또는 향신료로 속이 채워져 있었다."],[10,"One day in the 1800s, an American sailor named Hanson Gregory came up with a clever idea.","1800년대 어느 날, 한센 그레고리라는 이름의 미국인 선원이 기발한 생각을 떠올렸다."],[11,"He cut a hole in the center of his donuts so the dough would cook more evenly throughout.","그는 반죽이 전체적으로 더 고르게 익도록 도넛 가운데에 구멍을 냈다."]],"w":"6번에서 초기 도넛은 공 모양이고 속을 채웠다고 해요. 구멍을 낸 사람은 네덜란드 정착민이 아니라 한센 그레고리예요(10~11번).","c":4},"h":"273a2f8d1c"},{"n":9,"t":"sum","q":"Early donuts did not (A) evenly because the inside stayed raw, so Hanson Gregory made a (B) in the center.","ko":"초기 도넛은 속이 날것으로 남아서 고르게 (A)지 못했고, 그래서 한센 그레고리는 가운데에 (B)을 냈다.","oko":["(A) 익다 / (B) 공","(A) 보이다 / (B) 구멍","(A) 익다 / (B) 구멍","(A) 익다 / (B) 속 재료","(A) 튀기다 / (B) 설탕"],"opts":["(A) cook / (B) ball","(A) look / (B) hole","(A) cook / (B) hole","(A) cook / (B) filling","(A) fry / (B) sugar"],"r":{"a":"3) (A) cook / (B) hole","ev":"8, 11번 문장","s":[[8,"They did not always cook evenly because the outside could cook too fast while the inside could stay raw.","바깥쪽은 너무 빨리 익고 안쪽은 날것으로 남을 수 있어서, 도넛은 항상 고르게 익지는 않았다."],[11,"He cut a hole in the center of his donuts so the dough would cook more evenly throughout.","그는 반죽이 전체적으로 더 고르게 익도록 도넛 가운데에 구멍을 냈다."]],"w":"8번에서 초기 도넛은 고르게 익지(cook) 않았고, 11번에서 한센 그레고리가 가운데에 구멍(hole)을 내어 해결했어요.","c":3},"h":"6b3ad44c46"},{"n":10,"t":"fill","q":"Dutch settlers brought fried dough to America in the early 1700s, and the early donuts were [A] like [B].","ko":"1700년대 초 네덜란드 정착민들이 튀긴 반죽을 미국에 가져왔고, 초기 도넛은 [B]처럼 [A] 상태였다.","bank":["shaped","balls","rings","filled","holes","sailors"],"bko":{"shaped":"모양이 만들어진","balls":"공","rings":"고리","filled":"채워진","holes":"구멍","sailors":"선원"},"r":{"a":"[A] shaped, [B] balls","ev":"4, 6번 문장","s":[[4,"In the early 1700s, Dutch settlers brought their version of fried dough to America.","1700년대 초, 네덜란드 정착민들이 튀긴 반죽으로 만든 자기들의 음식을 미국에 가져왔다."],[6,"These early donuts were shaped like balls and filled with fruit, nuts, or spices.","이 초기 도넛은 공 모양이었고 과일, 견과류, 또는 향신료로 속이 채워져 있었다."]],"w":"6번 These early donuts were shaped like balls에서 가져왔어요. rings(고리)와 holes(구멍)는 한센 그레고리 이후의 도넛 모양이에요.","c":null},"h":"c6b3f140eb"}]},{"u":5,"id":"b3-05-3","no":3,"ko":"치마가 짧아진 이유, 불편함에서 시작된 미니스커트","items":[{"n":1,"t":"tf","q":"The tight skirts of the 1950s made it hard to walk or sit.","ko":"1950년대의 꽉 끼는 치마는 걷거나 앉기 힘들게 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"These skirts looked stylish but made it hard to walk or sit.","이 치마들은 멋있어 보였지만 걷거나 앉기 힘들게 만들었다."]],"w":"2번 문장에 made it hard to walk or sit이 그대로 있어요. 멋있어 보였지만 불편했어요.","c":"T"},"h":"987f596e0e"},{"n":2,"t":"tf","q":"Both adults and teenage girls loved the miniskirt.","ko":"어른과 십 대 소녀들 모두 미니스커트를 좋아했다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Though many adults didn’t like it, teenage girls accepted the new style.","많은 어른들은 그것을 좋아하지 않았지만, 십 대 소녀들은 새로운 스타일을 받아들였다."]],"w":"11번에서 many adults didn't like it이라고 해요. 십 대 소녀들만 받아들였어요.","c":"F"},"h":"7a8ff20531"},{"n":3,"t":"tf","q":"Around 1962, some bold girls began wearing skirts nearly 20 centimeters above the knee.","ko":"1962년경, 몇몇 대담한 소녀들이 무릎 위 거의 20센티미터 치마를 입기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Around 1962, some bold girls, called “Ya-Ya girls,” began wearing skirts nearly 20 centimeters above the knee.","1962년경, “야야 걸스”라고 불리는 몇몇 대담한 소녀들이 무릎 위 거의 20센티미터까지 오는 치마를 입기 시작했다."]],"w":"6번에 그대로 나와요. 이 소녀들이 Ya-Ya girls(야야 걸스)예요.","c":"T"},"h":"d0a2f615d0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Young British women welcomed the change.)","ko":"영국의 젊은 여성들은 그 변화를 welcomed.","opts":["거부했다","환영했다","무시했다","걱정했다"],"word":"welcomed","r":{"a":"2) 환영했다","ev":"3~5번 문장","s":[[3,"This discomfort led young women to look for new, freer styles.","이 불편함은 젊은 여성들이 새롭고 더 자유로운 스타일을 찾도록 이끌었다."],[4,"In the early 1960s, shorter skirts about 2.5 centimeters above the knee appeared.","1960년대 초, 무릎 위 약 2.5센티미터까지 오는 더 짧은 치마가 등장했다."],[5,"Young British women welcomed the change.","영국의 젊은 여성들은 그 변화를 환영했다."]],"w":"3번에서 젊은 여성들이 새롭고 더 자유로운 스타일을 찾았어요. 짧은 치마가 나오자 반긴 거예요. welcome = 환영하다.","c":2},"h":"5f7009cdfa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This new style challenged the old fashion rules of the time.)","ko":"이 새로운 스타일은 당시의 오래된 패션 규칙에 challenged.","opts":["따랐다","잊었다","즐겼다","도전했다"],"word":"challenged","r":{"a":"4) 도전했다","ev":"6~7번 문장","s":[[6,"Around 1962, some bold girls, called “Ya-Ya girls,” began wearing skirts nearly 20 centimeters above the knee.","1962년경, “야야 걸스”라고 불리는 몇몇 대담한 소녀들이 무릎 위 거의 20센티미터까지 오는 치마를 입기 시작했다."],[7,"This new style challenged the old fashion rules of the time.","이 새로운 스타일은 당시의 오래된 패션 규칙에 도전했다."]],"w":"6번처럼 아주 짧은 치마는 기존 규칙을 깨는 것이었어요. 그래서 7번은 오래된 규칙에 도전했다(challenge)는 뜻이에요.","c":4},"h":"43542e311f"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThough many adults didn't like it, teenage girls accepted the new style.","ko":"밑줄 친 it이 가리키는 것은?","sko":"많은 어른들은 그것을 좋아하지 않았지만, 십 대 소녀들은 새로운 스타일을 받아들였다.","opts":["어른들","메리 퀀트","미니스커트","기성복 매장"],"r":{"a":"3) 미니스커트","ev":"10~11번 문장","s":[[10,"By turning this youth trend into ready-to-wear fashion, she helped popularize the miniskirt.","이 젊은이들의 유행을 기성복 패션으로 바꿈으로써, 그녀는 미니스커트를 대중화하는 데 도움을 주었다."],[11,"Though many adults didn’t like it, teenage girls accepted the new style.","많은 어른들은 그것을 좋아하지 않았지만, 십 대 소녀들은 새로운 스타일을 받아들였다."]],"w":"어른들이 싫어한 것은 10번에서 대중화된 미니스커트예요. 그래서 it은 미니스커트(새로운 스타일)예요.","c":3},"h":"583befc8a6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"She believed that clothing should allow women to move freely.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀는 옷이 여성들을 자유롭게 움직일 수 있게 해 주어야 한다고 믿었다.","opts":["그녀는 옷이 여성들의 움직임을 자유롭게 해야 한다고 믿었다.","그녀는 여성들이 옷을 자유롭게 고를 수 없다고 믿었다.","그녀는 옷이 여성들을 멋있어 보이게만 하면 된다고 믿었다.","그녀는 여성들이 움직이지 않는 것이 자유라고 믿었다."],"r":{"a":"1) 그녀는 옷이 여성들의 움직임을 자유롭게 해야 한다고 믿었다.","ev":"9번 문장","s":[[9,"She believed that clothing should allow women to move freely.","그녀는 옷이 여성들을 자유롭게 움직일 수 있게 해 주어야 한다고 믿었다."]],"w":"allow women to move freely는 여성들이 자유롭게 움직이도록 해 준다는 뜻이에요. 2번에서 불편한 치마를 문제로 삼은 것과 이어져요.","c":1},"h":"b80e3f636b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["메리 퀀트는 미니스커트를 싫어했다.","1960년대 초 영국의 젊은 여성들은 짧은 치마를 싫어했다.","미니스커트는 영국에서만 인기를 끌었다.","미니스커트는 걷고, 뛰고, 춤추기를 더 쉽게 만들었다."],"opts":["Mary Quant did not like the miniskirt.","Young British women disliked shorter skirts in the early 1960s.","The miniskirt stayed popular only in the U.K.","The miniskirt made it easier to walk, run, and dance."],"r":{"a":"4) The miniskirt made it easier to walk, run, and dance.","ev":"5, 10, 12~13번 문장","s":[[5,"Young British women welcomed the change.","영국의 젊은 여성들은 그 변화를 환영했다."],[10,"By turning this youth trend into ready-to-wear fashion, she helped popularize the miniskirt.","이 젊은이들의 유행을 기성복 패션으로 바꿈으로써, 그녀는 미니스커트를 대중화하는 데 도움을 주었다."],[12,"The style made it easier to walk, run, and dance.","그 스타일은 걷고, 뛰고, 춤추기를 더 쉽게 만들었다."],[13,"The miniskirt soon spread beyond the U.K. and became a global trend.","미니스커트는 곧 영국을 넘어 퍼져 세계적인 유행이 되었다."]],"w":"12번에 그대로 나와요. 메리 퀀트는 미니스커트를 대중화했고(10번), 젊은 여성들은 짧은 치마를 환영했고(5번), 미니스커트는 세계적인 유행이 되었어요(13번).","c":4},"h":"99c081e1ae"},{"n":9,"t":"sum","q":"Because tight skirts were (A), young women wanted freer styles. Mary Quant turned this youth trend into ready-to-wear fashion and helped (B) the miniskirt.","ko":"꽉 끼는 치마가 (A)해서 젊은 여성들은 더 자유로운 스타일을 원했다. 메리 퀀트는 이 젊은이들의 유행을 기성복 패션으로 바꾸어 미니스커트를 (B)하는 데 도움을 주었다.","oko":["(A) 싼 / (B) 숨기다","(A) 불편한 / (B) 대중화하다","(A) 불편한 / (B) 따라 하다","(A) 아름다운 / (B) 대중화하다","(A) 편안한 / (B) 막다"],"opts":["(A) cheap / (B) hide","(A) uncomfortable / (B) popularize","(A) uncomfortable / (B) copy","(A) beautiful / (B) popularize","(A) comfortable / (B) stop"],"r":{"a":"2) (A) uncomfortable / (B) popularize","ev":"2~3, 10번 문장","s":[[2,"These skirts looked stylish but made it hard to walk or sit.","이 치마들은 멋있어 보였지만 걷거나 앉기 힘들게 만들었다."],[3,"This discomfort led young women to look for new, freer styles.","이 불편함은 젊은 여성들이 새롭고 더 자유로운 스타일을 찾도록 이끌었다."],[10,"By turning this youth trend into ready-to-wear fashion, she helped popularize the miniskirt.","이 젊은이들의 유행을 기성복 패션으로 바꿈으로써, 그녀는 미니스커트를 대중화하는 데 도움을 주었다."]],"w":"2~3번에서 꽉 끼는 치마가 불편해서(uncomfortable) 새 스타일을 찾았어요. 10번에서 메리 퀀트가 미니스커트를 대중화하는(popularize) 데 도움을 주었어요.","c":2},"h":"d5043ad856"},{"n":10,"t":"fill","q":"The miniskirt soon spread beyond the U.K. and became a [A] trend, and it made it [B] to walk, run, and dance.","ko":"미니스커트는 곧 영국을 넘어 퍼져 [A] 유행이 되었고, 걷고 뛰고 춤추기를 [B] 만들었다.","bank":["global","easier","harder","local","tight","old"],"bko":{"global":"세계적인","easier":"더 쉬운","harder":"더 어려운","local":"지역의","tight":"꽉 끼는","old":"오래된"},"r":{"a":"[A] global, [B] easier","ev":"12~13번 문장","s":[[12,"The style made it easier to walk, run, and dance.","그 스타일은 걷고, 뛰고, 춤추기를 더 쉽게 만들었다."],[13,"The miniskirt soon spread beyond the U.K. and became a global trend.","미니스커트는 곧 영국을 넘어 퍼져 세계적인 유행이 되었다."]],"w":"13번 became a global trend, 12번 made it easier to walk, run, and dance에서 가져왔어요. harder는 1950년대 꽉 끼는 치마의 단점(2번)이라 반대예요.","c":null},"h":"c782db8ddd"}]},{"u":5,"id":"b3-05-4","no":4,"ko":"뉴욕의 첫 이름은 뉴암스테르담이었다고?","items":[{"n":1,"t":"tf","q":"Henry Hudson found rivers full of beavers.","ko":"헨리 허드슨은 비버로 가득한 강들을 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"There, he found rivers full of beavers.","그곳에서 그는 비버로 가득한 강들을 발견했다."]],"w":"3번 문장에 그대로 나와요. 이 발견이 비버 털가죽 무역의 출발점이에요.","c":"T"},"h":"b36438a7c8"},{"n":2,"t":"tf","q":"The Dutch took over the settlement in 1664.","ko":"네덜란드는 1664년에 그 정착지를 점령했다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"In 1664, a British fleet arrived and took over the settlement.","1664년, 영국 함대가 도착해 그 정착지를 점령했다."]],"w":"11번에서 1664년에 정착지를 점령한 쪽은 영국 함대예요. 네덜란드는 점령당한 쪽이에요.","c":"F"},"h":"2f975f15d1"},{"n":3,"t":"tf","q":"The Dutch West India Company was established to control the fur trade.","ko":"네덜란드 서인도 회사는 모피 무역을 통제하기 위해 설립되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"To control the fur trade, the Dutch government established the Dutch West India Company in 1621.","모피 무역을 통제하기 위해, 네덜란드 정부는 1621년에 네 ns.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 이름은 그 후 지금까지 그대로 남아 있으며, 도시의 식민지 기원을 보여 준다.","opts":["그 이름은 지금까지 바뀌지 않았고, 도시가 식민지로 시작했음을 보여 준다.","그 이름은 곧 사라졌고, 도시의 식민지 기원은 잊혔다.","그 이름은 여러 번 바뀌었고, 도시의 식민지 기원을 숨긴다.","그 이름은 영국에서만 쓰였고, 도시의 새로운 시작을 말해 준다."],"r":{"a":"1) 그 이름은 지금까지 바뀌지 않았고, 도시가 식민지로 시작했음을 보여 준다.","ev":"12~13번 문장","s":[[12,"They renamed it New York in honor of the Duke of York.","그들은 요크 공작을 기리는 뜻으로 그곳을 뉴욕이라고 다시 이름 지었다."],[13,"That name has remained ever since, reflecting the city’s colonial origins.","그 이름은 그 후 지금까지 그대로 남아 있으며, 도시의 식민지 기원을 보여 준다."]],"w":"has remained ever since는 그 후로 계속 남아 있다는 뜻이고, reflecting ~은 식민지에서 시작한 도시의 기원을 보여 준다는 뜻이에요.","c":1},"h":"030f9d9d90"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["헨리 허드슨은 영국 탐험가였다.","영국은 요크 공작을 기리려고 뉴암스테르담을 뉴욕이라고 다시 이름 지었다.","네덜란드 서인도 회사는 1664년에 설립되었다.","네덜란드는 맨해튼 북쪽 끝에 정착민들을 보냈다."],"opts":["Henry Hudson was a British explorer.","The British renamed New Amsterdam in honor of the Duke of York.","The Dutch West India Company was established in 1664.","The Dutch sent settlers to the northern tip of Manhattan."],"r":{"a":"2) The British renamed New Amsterdam in honor of the Duke of York.","ev":"2, 5~6, 12번 문장","s":[[2,"In 1609, a Dutch explorer named Henry Hudson explored the northeastern coast of North America near present-day New York.","1609년, 헨리 허드슨이라는 이름의 네덜란드 탐험가가 오늘날의 뉴욕 근처 북아메리카 북동부 해안을 탐험했다."],[5,"To control the fur trade, the Dutch government established the Dutch West India Company in 1621.","모피 무역을 통제하기 위해, 네덜란드 정부는 1621년에 네덜란드 서인도 회사를 설립했다."],[6,"Soon, the Dutch sent settlers to the southern tip of Manhattan to strengthen their control over the region.","곧 네덜란드는 그 지역에 대한 통제를 강화하기 위해 맨해튼 남쪽 끝에 정착민들을 보냈다."],[12,"They renamed it New York in honor of the Duke of York.","그들은 요크 공작을 기리는 뜻으로 그곳을 뉴욕이라고 다시 이름 지었다."]],"w":"12번에 그대로 나와요. 허드슨은 네덜란드 탐험가(2번), 회사는 1621년(5번), 정착민은 맨해튼 남쪽 끝(6번)이에요.","c":2},"h":"9452d74066"},{"n":9,"t":"sum","q":"The Dutch settled New Amsterdam to control the fur (A), but the British (B) the settlement in 1664 and renamed it New York.","ko":"네덜란드는 모피 (A)을 통제하려고 뉴암스테르담에 정착했지만, 영국이 1664년에 그 정착지를 (B)하고 뉴욕이라고 다시 이름 지었다.","oko":["(A) 전쟁 / (B) 떠났다","(A) 무역 / (B) 떠났다","(A) 전쟁 / (B) 점령했다","(A) 시장 / (B) 팔았다","(A) 무역 / (B) 점령했다"],"opts":["(A) war / (B) left","(A) trade / (B) left","(A) war / (B) took over","(A) market / (B) sold","(A) trade / (B) took over"],"r":{"a":"5) (A) trade / (B) took over","ev":"5~7, 11~12번 문장","s":[[5,"To control the fur trade, the Dutch government established the Dutch West India Company in 1621.","모피 무역을 통제하기 위해, 네덜란드 정부는 1621년에 네덜란드 서인도 회사를 설립했다."],[6,"Soon, the Dutch sent settlers to the southern tip of Manhattan to strengthen their control over the region.","곧 네덜란드는 그 지역에 대한 통제를 강화하기 위해 맨해튼 남쪽 끝에 정착민들을 보냈다."],[7,"They named the area New Amsterdam.","그들은 그 지역을 뉴암스테르담이라고 이름 지었다."],[11,"In 1664, a British fleet arrived and took over the settlement.","1664년, 영국 함대가 도착해 그 정착지를 점령했다."],[12,"They renamed it New York in honor of the Duke of York.","그들은 요크 공작을 기리는 뜻으로 그곳을 뉴욕이라고 다시 이름 지었다."]],"w":"5번에서 모피 무역(trade)을 통제하려 했고, 11~12번에서 영국이 정착지를 점령하고(took over) 뉴욕이라고 다시 이름 지었어요.","c":5},"h":"7378474a47"},{"n":10,"t":"fill","q":"In 1609, Henry Hudson found rivers full of [A], and since their fur was highly [B] in Europe, he reported this to merchants.","ko":"1609년 헨리 허드슨은 [A]로 가득한 강들을 발견했고, 그 털가죽이 유럽에서 매우 [B] 때문에 이를 상인들에게 보고했다.","bank":["beavers","valued","settlers","explorer","renamed","fleet"],"bko":{"beavers":"비버","valued":"귀하게 여겨지는","settlers":"정착민","explorer":"탐험가","renamed":"다시 이름 지어진","fleet":"함대"},"r":{"a":"[A] beavers, [B] valued","ev":"2~4번 문장","s":[[2,"In 1609, a Dutch explorer named Henry Hudson explored the northeastern coast of North America near present-day New York.","1609년, 헨리 허드슨이라는 이름의 네덜란드 탐험가가 오늘날의 뉴욕 근처 북아메리카 북동부 해안을 탐험했다."],[3,"There, he found rivers full of beavers.","그곳에서 그는 비버로 가득한 강들을 발견했다."],[4,"Since beaver fur was highly valued in Europe, Hudson reported his discovery to merchants in Amsterdam.","비버 털가죽이 유럽에서 매우 귀하게 여겨졌기 때문에, 허드슨은 자신의 발견을 암스테르담의 상인들에게 보고했다."]],"w":"3번 rivers full of beavers, 4번 beaver fur was highly valued in Europe에서 가져왔어요. settlers와 fleet는 이야기의 뒷부분(6번, 11번)에 나와요.","c":null},"h":"04dd8c16eb"}]},{"u":6,"id":"b3-06-1","no":1,"ko":"차이콥스키가 〈호두까기 인형〉에 쓰려고 찾아낸 악기","items":[{"n":1,"t":"tf","q":"The celesta looks like a small piano.","ko":"첼레스타는 작은 피아노처럼 생겼다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It looked like a small piano, but inside were rows of metal bars.","그것은 작은 피아노처럼 생겼지만, 안에는 금속 막대들이 줄지어 있었다."]],"w":"4번 문장에 It looked like a small piano가 그대로 있어요. 안에는 금속 막대가 줄지어 있어요.","c":"T"},"h":"42ecb0c141"},{"n":2,"t":"tf","q":"The sound of the celesta was loud and heavy.","ko":"첼레스타의 소리는 크고 무거웠다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The sound was soft, clear, and bell-like.","그 소리는 부드럽고, 맑고, 종소리 같았다."]],"w":"6번에서 소리는 soft, clear, bell-like(부드럽고 맑고 종소리 같음)라고 해요. 크고 무겁다는 말과 반대예요.","c":"F"},"h":"082c98bc52"},{"n":3,"t":"tf","q":"The Sugar Plum Fairy danced to the sound of the celesta.","ko":"설탕 요정은 첼레스타의 소리에 맞춰 춤을 추었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"In 1892, at the premiere of The Nutcracker, the Sugar Plum Fairy danced to the magical sound of the celesta.","1892년, 〈호두까기 인형〉의 초연에서, 설탕 요정은 첼레스타의 마법 같은 소리에 맞춰 춤을 추었다."]],"w":"10번에 그대로 나와요. 〈호두까기 인형〉 초연 장면이에요.","c":"T"},"h":"2dd137832f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (he needed a sound that felt magical, light, and sparkling.)","ko":"그는 마법 같고, 가볍고, sparkling 느낌의 소리가 필요했다.","opts":["반짝이는","어두운","시끄러운","무거운"],"word":"sparkling","r":{"a":"1) 반짝이는","ev":"2번 문장","s":[[2,"For one scene, he needed a sound that felt magical, light, and sparkling.","한 장면을 위해, 그는 마법 같고, 가볍고, 반짝이는 느낌의 소리가 필요했다."]],"w":"magical, light와 함께 나온 말이에요. 가볍고 마법 같은 소리와 어울리는 '반짝이는'이 알맞아요. 종소리 같은 6번 설명과도 이어져요.","c":1},"h":"8543fd9ccf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The audience had never heard anything like it and was amazed by the sound.)","ko":"관객은 그런 소리를 들어 본 적이 없었고 그 소리에 amazed.","opts":["지루한","화난","피곤한","놀란"],"word":"amazed","r":{"a":"4) 놀란","ev":"11번 문장","s":[[11,"The audience had never heard anything like it and was amazed by the sound.","관객은 그런 소리를 들어 본 적이 없었고 그 소리에 놀랐다."]],"w":"처음 듣는 소리를 들었으니 놀랐다는 뜻이에요. be amazed = 놀라다. 12번에서 첼레스타가 세계적 관심을 얻는 것과 이어져요.","c":4},"h":"1fea39a816"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAt the time, the celesta was little known, so Tchaikovsky wanted to use it before any other composer.","ko":"밑줄 친 it이 가리키는 것은?","sko":"당시 첼레스타는 거의 알려지지 않았기 때문에, 차이콥스키는 다른 어떤 작곡가보다 먼저 그것을 사용하고 싶었다.","opts":["피아노","첼레스타","금속 막대","발레 공연"],"r":{"a":"2) 첼레스타","ev":"3, 8번 문장","s":[[3,"That year in Paris, Tchaikovsky came across a new instrument called the celesta.","그해 파리에서, 차이콥스키는 첼레스타라는 새로운 악기를 우연히 발견했다."],[8,"At the time, the celesta was little known, so Tchaikovsky wanted to use it before any other composer.","당시 첼레스타는 거의 알려지지 않았기 때문에, 차이콥스키는 다른 어떤 작곡가보다 먼저 그것을 사용하고 싶었다."]],"w":"차이콥스키가 다른 작곡가보다 먼저 쓰고 싶어 한 것은 같은 문장 앞쪽의 the celesta예요.","c":2},"h":"4ea86b6ca2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Thanks to this piece, the celesta gained worldwide attention.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 작품 덕분에, 첼레스타는 세계적인 관심을 얻었다.","opts":["이 작품 때문에 첼레스타는 더 이상 연주되지 않았다.","이 작품은 첼레스타 덕분에 세계적인 관심을 얻었다.","이 작품 덕분에 첼레스타가 전 세계의 주목을 받게 되었다.","이 작품 이후 첼레스타는 피아노로 바뀌었다."],"r":{"a":"3) 이 작품 덕분에 첼레스타가 전 세계의 주목을 받게 되었다.","ev":"10, 12번 문장","s":[[10,"In 1892, at the premiere of The Nutcracker, the Sugar Plum Fairy danced to the magical sound of the celesta.","1892년, 〈호두까기 인형〉의 초연에서, 설탕 요정은 첼레스타의 마법 같은 소리에 맞춰 춤을 추었다."],[12,"Thanks to this piece, the celesta gained worldwide attention.","이 작품 덕분에, 첼레스타는 세계적인 관심을 얻었다."]],"w":"Thanks to this piece는 '이 작품 덕분에'이고, 주어는 the celesta예요. 관심을 얻은 쪽은 작품이 아니라 첼레스타예요.","c":3},"h":"0b821c252d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["첼레스타는 차이콥스키가 발견했을 때 이미 유명했다.","차이콥스키는 첼레스타를 가장 먼저 사용한 작곡가가 되고 싶었다.","관객은 첼레스타의 소리를 좋아하지 않았다.","첼레스타는 작은 북처럼 생겼다."],"opts":["The celesta was already famous when Tchaikovsky found it.","Tchaikovsky wanted to be the first composer to use the celesta.","The audience did not like the sound of the celesta.","The celesta looks like a small drum."],"r":{"a":"2) Tchaikovsky wanted to be the first composer to use the celesta.","ev":"4, 8, 11번 문장","s":[[4,"It looked like a small piano, but inside were rows of metal bars.","그것은 작은 피아노처럼 생겼지만, 안에는 금속 막대들이 줄지어 있었다."],[8,"At the time, the celesta was little known, so Tchaikovsky wanted to use it before any other composer.","당시 첼레스타는 거의 알려지지 않았기 때문에, 차이콥스키는 다른 어떤 작곡가보다 먼저 그것을 사용하고 싶었다."],[11,"The audience had never heard anything like it and was amazed by the sound.","관객은 그런 소리를 들어 본 적이 없었고 그 소리에 놀랐다."]],"w":"8번에서 다른 어떤 작곡가보다 먼저 사용하고 싶어 했어요. 첼레스타는 거의 알려지지 않았고(8번), 관객은 놀랐고(11번), 작은 피아노처럼 생겼어요(4번).","c":2},"h":"84576cdf2b"},{"n":9,"t":"sum","q":"When a key of the celesta is pressed, a small hammer strikes a (A), making a soft, clear, (B) sound.","ko":"첼레스타의 건반을 누르면 작은 망치가 (A)를 쳐서 부드럽고 맑은 (B) 소리를 낸다.","oko":["(A) 줄 / (B) 종소리 같은","(A) 막대 / (B) 큰","(A) 북 / (B) 종소리 같은","(A) 막대 / (B) 무거운","(A) 막대 / (B) 종소리 같은"],"opts":["(A) string / (B) bell-like","(A) bar / (B) loud","(A) drum / (B) bell-like","(A) bar / (B) heavy","(A) bar / (B) bell-like"],"r":{"a":"5) (A) bar / (B) bell-like","ev":"4~6번 문장","s":[[4,"It looked like a small piano, but inside were rows of metal bars.","그것은 작은 피아노처럼 생겼지만, 안에는 금속 막대들이 줄지어 있었다."],[5,"When a key was pressed, a small hammer struck a bar.","건반을 누르면, 작은 망치가 막대를 쳤다."],[6,"The sound was soft, clear, and bell-like.","그 소리는 부드럽고, 맑고, 종소리 같았다."]],"w":"5번에서 작은 망치가 막대(bar)를 쳐요. 6번에서 소리는 부드럽고 맑고 종소리 같아요(bell-like).","c":5},"h":"0d1f6b05f1"},{"n":10,"t":"fill","q":"The [A] was amazed by the sound, and thanks to this piece, the celesta gained worldwide [B].","ko":"[A]은 그 소리에 놀랐고, 이 작품 덕분에 첼레스타는 세계적인 [B]을 얻었다.","bank":["audience","attention","bar","premiere","piano","hammer"],"bko":{"audience":"관객","attention":"관심","premiere":"초연","piano":"피아노","hammer":"망치","bar":"막대"},"r":{"a":"[A] audience, [B] attention","ev":"11~12번 문장","s":[[11,"The audience had never heard anything like it and was amazed by the sound.","관객은 그런 소리를 들어 본 적이 없었고 그 소리에 놀랐다."],[12,"Thanks to this piece, the celesta gained worldwide attention.","이 작품 덕분에, 첼레스타는 세계적인 관심을 얻었다."]],"w":"11번에서 놀란 쪽은 관객(audience), 12번에서 첼레스타가 얻은 것은 세계적인 관심(attention)이에요. hammer(망치)와 bar(막대)는 소리를 내는 부품이라서 놀라거나 관심을 얻는 쪽이 될 수 없어요.","c":null},"h":"1f621924d3"}]},{"u":6,"id":"b3-06-2","no":2,"ko":"버섯 뿌리로 만든 가죽이 있다고?","items":[{"n":1,"t":"tf","q":"Mushroom leather is made from mycelium.","ko":"버섯 가죽은 균사체로 만들어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Specifically, it is made from mycelium, which is the root-like part of a mushroom.","구체적으로, 그것은 버섯의 뿌리 같은 부분인 균사체로 만들어진다."]],"w":"3번에서 소재는 mycelium으로 만들어진다고 해요. mycelium은 버섯의 뿌리 같은 부분이에요.","c":"T"},"h":"3ab872cfd5"},{"n":2,"t":"tf","q":"Mycelium feels rough and weak.","ko":"균사체는 거칠고 약하게 느껴진다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It feels soft but strong, like real leather.","그것은 진짜 가죽처럼 부드러우면서도 튼튼하게 느껴진다."]],"w":"5번에서 균사체는 soft but strong(부드럽지만 튼튼함)하다고 해요. 거칠고 약하다는 말은 반대예요.","c":"F"},"h":"03c6961ad1"},{"n":3,"t":"tf","q":"Products like belts and wallets can be made from mushroom leather.","ko":"벨트와 지갑 같은 제품이 버섯 가죽으로 만들어질 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Products like belts and wallets can be made from it.","벨트와 지갑 같은 제품들이 그것으로 만들어질 수 있다."]],"w":"10번에 그대로 나와요. 11번에서 진짜 가죽만큼 좋다고 해요.","c":"T"},"h":"49fa04d9f4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (people grow mycelium in a nutrient-rich liquid.)","ko":"사람들은 nutrient-rich 액체에서 균사체를 키운다.","opts":["영양이 부족한","영양분이 풍부한","아주 뜨거운","끈적끈적한"],"word":"nutrient-rich","r":{"a":"2) 영양분이 풍부한","ev":"6번 문장","s":[[6,"To make mushroom leather, people grow mycelium in a nutrient-rich liquid.","버섯 가죽을 만들기 위해, 사람들은 영양분이 풍부한 액체에서 균사체를 키운다."]],"w":"균사체를 키우는 액체니까 자라는 데 필요한 영양분이 가득한 액체예요. -rich는 '~이 풍부한'이라는 뜻이에요.","c":2},"h":"a6fcbc990b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This sheet can be dyed to create different textures and colors.)","ko":"이 시트는 다양한 textures와 색을 만들기 위해 염색될 수 있다.","opts":["질감","무게","가격","냄새"],"word":"textures","r":{"a":"1) 질감","ev":"9번 문장","s":[[9,"This sheet can be dyed to create different textures and colors.","이 시트는 다양한 질감과 색을 만들기 위해 염색될 수 있다."]],"w":"색과 함께 나오는 말이고, 시트가 다른 느낌으로 만들어진다는 내용이라 texture는 질감(만졌을 때의 느낌)이에요.","c":1},"h":"598174c70b"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey look and feel just as good as real leather.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 진짜 가죽만큼 보기에도 만져 보기에도 좋다.","opts":["식물들","균사체의 실들","벨트와 지갑 같은 제품들","건조된 시트"],"r":{"a":"3) 벨트와 지갑 같은 제품들","ev":"10~11번 문장","s":[[10,"Products like belts and wallets can be made from it.","벨트와 지갑 같은 제품들이 그것으로 만들어질 수 있다."],[11,"They look and feel just as good as real leather.","그것들은 진짜 가죽만큼 보기에도 만져 보기에도 좋다."]],"w":"10번에서 벨트와 지갑 같은 제품들(Products)을 말했고, 11번의 They가 그 제품들을 받아요.","c":3},"h":"30ed5d61bf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That means we can look stylish and protect the environment at the same time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 우리가 멋져 보이면서 동시에 환경을 보호할 수 있다는 뜻이다.","opts":["우리는 환경을 지키려면 멋을 포기해야 한다.","우리는 멋과 환경 보호 중 하나만 고를 수 있다.","우리는 환경을 지키려고 새 옷을 많이 사야 한다.","우리는 멋져 보이면서 동시에 환경을 보호할 수 있다."],"r":{"a":"4) 우리는 멋져 보이면서 동시에 환경을 보호할 수 있다.","ev":"12~14번 문장","s":[[12,"Mushroom leather is one exciting example of eco-friendly fashion.","버섯 가죽은 친환경 패션의 흥미로운 예 중 하나이다."],[13,"Other plants, like cacti and pineapples, are also being used to make new materials.","선인장과 파인애플 같은 다른 식물들도 새로운 소재를 만드는 데 사용되고 있다."],[14,"That means we can look stylish and protect the environment at the same time.","그것은 우리가 멋져 보이면서 동시에 환경을 보호할 수 있다는 뜻이다."]],"w":"at the same time은 '동시에'예요. 친환경 소재로 만든 패션이라면 멋과 환경 보호를 둘 다 할 수 있다는 결론이에요.","c":4},"h":"a13e4da86e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["균사체는 버섯 가죽으로 만든 평평한 시트이다.","버섯 가죽을 만들려고 균사체를 영양분이 풍부한 액체에서 키운다.","버섯 가죽은 진짜 가죽보다 보기에 좋지 않다.","친환경 소재를 만드는 데는 버섯만 사용된다."],"opts":["Mycelium is the flat sheet made from mushroom leather.","Mycelium is grown in a nutrient-rich liquid to make leather.","Mushroom leather looks worse than real leather.","Only mushrooms are used to make eco-friendly materials."],"r":{"a":"2) Mycelium is grown in a nutrient-rich liquid to make leather.","ev":"3, 6, 11, 13번 문장","s":[[3,"Specifically, it is made from mycelium, which is the root-like part of a mushroom.","구체적으로, 그것은 버섯의 뿌리 같은 부분인 균사체로 만들어진다."],[6,"To make mushroom leather, people grow mycelium in a nutrient-rich liquid.","버섯 가죽을 만들기 위해, 사람들은 영양분이 풍부한 액체에서 균사체를 키운다."],[11,"They look and feel just as good as real leather.","그것들은 진짜 가죽만큼 보기에도 만져 보기에도 좋다."],[13,"Other plants, like cacti and pineapples, are also being used to make new materials.","선인장과 파인애플 같은 다른 식물들도 새로운 소재를 만드는 데 사용되고 있다."]],"w":"6번에서 균사체를 영양분이 풍부한 액체에서 키워요. 균사체는 버섯의 뿌리 같은 부분(3번)이고, 제품은 진짜 가죽만큼 좋으며(11번), 선인장과 파인애플도 쓰여요(13번).","c":2},"h":"3038e6ebf5"},{"n":9,"t":"sum","q":"After growing for two to three weeks, the mycelium layer is (A) and dried into a flat sheet, which can be (B) to make different colors.","ko":"2~3주 동안 자란 뒤, 균사체 층은 (A) 건조되어 평평한 시트가 되며, 이 시트는 다양한 색을 만들기 위해 (B)될 수 있다.","oko":["(A) 잘려 / (B) 염색","(A) 눌려 / (B) 세탁","(A) 키워져 / (B) 염색","(A) 잘려 / (B) 세탁","(A) 눌려 / (B) 염색"],"opts":["(A) cut / (B) dyed","(A) pressed / (B) washed","(A) grown / (B) dyed","(A) cut / (B) washed","(A) pressed / (B) dyed"],"r":{"a":"5) (A) pressed / (B) dyed","ev":"7~9번 문장","s":[[7,"For two to three weeks, it grows a thick, fluffy layer.","2~3주 동안, 그것은 두껍고 보송보송한 층을 만들어 낸다."],[8,"Then, this layer is pressed and dried into a flat sheet.","그런 다음, 이 층은 눌려서 건조되어 평평한 시트가 된다."],[9,"This sheet can be dyed to create different textures and colors.","이 시트는 다양한 질감과 색을 만들기 위해 염색될 수 있다."]],"w":"8번에서 층은 눌려서(pressed) 말려 시트가 되고, 9번에서 이 시트는 염색될(dyed) 수 있어요.","c":5},"h":"a4f4dd28ec"},{"n":10,"t":"fill","q":"Other plants, like cacti and pineapples, are also being used to make new [A], so we can look stylish and protect the [B].","ko":"선인장과 파인애플 같은 다른 식물들도 새로운 [A]를 만드는 데 사용되어서, 우리는 멋져 보이면서 [B]을 보호할 수 있다.","bank":["materials","environment","stylish","flat","strong","real"],"bko":{"materials":"소재","environment":"환경","stylish":"멋진","flat":"평평한","strong":"튼튼한","real":"진짜의"},"r":{"a":"[A] materials, [B] environment","ev":"13~14번 문장","s":[[13,"Other plants, like cacti and pineapples, are also being used to make new materials.","선인장과 파인애플 같은 다른 식물들도 새로운 소재를 만드는 데 사용되고 있다."],[14,"That means we can look stylish and protect the environment at the same time.","그것은 우리가 멋져 보이면서 동시에 환경을 보호할 수 있다는 뜻이다."]],"w":"13번에서 다른 식물로 새로운 소재(materials)를 만든다고 하고, 14번에서 멋과 환경(environment) 보호를 함께 할 수 있다고 해요.","c":null},"h":"b3131c823e"}]},{"u":6,"id":"b3-06-3","no":3,"ko":"딱딱한 귀족 초상화를 부드럽게 바꾼 여성 화가","items":[{"n":1,"t":"tf","q":"Most painters in 18th-century France were women.","ko":"18세기 프랑스의 대부분의 화가는 여성이었다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"In 18th-century France, most painters were men.","18세기 프랑스에서 대부분의 화가는 남자였다."]],"w":"1번에서 대부분의 화가는 남자(men)였다고 해요. 그래서 비제 르 브룅 같은 여성 화가는 드문 경우예요.","c":"F"},"h":"5db471bb35"},{"n":2,"t":"tf","q":"Vigée Le Brun used soft smiles and natural poses in her portraits.","ko":"비제 르 브룅은 자신의 초상화에서 부드러운 미소와 자연스러운 자세를 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Instead of following stiff and formal rules, she used soft smiles and natural poses.","경직되고 격식 차린 규칙을 따르는 대신, 그녀는 부드러운 미소와 자연스러운 자세를 사용했다."]],"w":"8번에 그대로 나와요. 경직되고 격식 차린 규칙을 따르는 대신 쓴 방식이에요.","c":"T"},"h":"0a147c8975"},{"n":3,"t":"tf","q":"Marie Antoinette asked Vigée Le Brun to be her official portrait painter.","ko":"마리 앙투아네트는 비제 르 브룅에게 자신의 공식 초상화가가 되어 달라고 요청했다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"She recognized Vigée Le Brun’s talent and asked her to be her official portrait painter.","그녀는 비제 르 브룅의 재능을 알아보고 자신의 공식 초상화가가 되어 달라고 그녀에게 요청했다."]],"w":"13번에 asked her to be her official portrait painter가 나와요. 왕비가 재능을 알아보고 요청한 거예요.","c":"T"},"h":"8dd116afb4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These portraits looked grand but were often stiff and cold.)","ko":"이 초상화들은 웅장해 보였지만 종종 stiff하고 차가웠다.","opts":["경직된","부드러운","따뜻한","밝은"],"word":"stiff","r":{"a":"1) 경직된","ev":"4, 8번 문장","s":[[4,"These portraits looked grand but were often stiff and cold.","이 초상화들은 웅장해 보였지만 종종 경직되고 차가웠다."],[8,"Instead of following stiff and formal rules, she used soft smiles and natural poses.","경직되고 격식 차린 규칙을 따르는 대신, 그녀는 부드러운 미소와 자연스러운 자세를 사용했다."]],"w":"4번에서 차갑다(cold)와 함께 나온 말이에요. 8번의 soft smiles(부드러운 미소)와 정반대라서 stiff는 '경직된, 딱딱한'이에요.","c":1},"h":"71df025578"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (She recognized Vigée Le Brun's talent and asked her to be her official portrait painter.)","ko":"그녀는 비제 르 브룅의 재능을 recognized하고 공식 초상화가가 되어 달라고 요청했다.","opts":["의심했다","숨겼다","알아보았다","거절했다"],"word":"recognized","r":{"a":"3) 알아보았다","ev":"13번 문장","s":[[13,"She recognized Vigée Le Brun’s talent and asked her to be her official portrait painter.","그녀는 비제 르 브룅의 재능을 알아보고 자신의 공식 초상화가가 되어 달라고 그녀에게 요청했다."]],"w":"재능을 알아보았기 때문에 공식 초상화가로 요청한 거예요. recognize = 알아보다, 인정하다.","c":3},"h":"aee5410018"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nOne of them was Queen Marie Antoinette.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그들 중 한 명이 마리 앙투아네트 왕비였다.","opts":["화가들","초상화들","남자 화가들","귀족 여성들"],"r":{"a":"4) 귀족 여성들","ev":"11~12번 문장","s":[[11,"Because of this unique style, many noblewomen admired Vigée Le Brun’s work.","이런 독특한 스타일 때문에, 많은 귀족 여성들이 비제 르 브룅의 작품을 칭찬했다."],[12,"One of them was Queen Marie Antoinette.","그들 중 한 명이 마리 앙투아네트 왕비였다."]],"w":"11번에서 비제 르 브룅의 작품을 칭찬한 many noblewomen(많은 귀족 여성들)이 12번에서 them으로 이어져요. 마리 앙투아네트 왕비도 그중 한 명이에요.","c":4},"h":"5ece2a05b0"},{"n":7,"t":"sense","
