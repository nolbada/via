var D=[{"n":1,"tag":"8월 1일 · 하와이 도착","en":"After a nine-hours flight, my family finally arrived at the international airport in Honolulu.","ko":"아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다.","ok":false,"foot":[],"fixes":[{"wrong":"nine-hours","right":"nine-hour","partial":false,"at":[2],"point":"복합 형용사: 하이픈 복합 형용사의 명사는 단수 hour 사용","topic":"복합 형용사","memo":"하이픈 복합 형용사의 명사는 단수 hour 사용"}]},{"n":2,"tag":null,"en":"When we came through the gate, I heard someone calling me name. My cousin Soobin and her family were waiting for us.","ko":"우리가 게이트를 통과했을 때, 나는 누군가 내 이름을 부르는 소리를 들었다. 내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"my","partial":false,"at":[10],"point":"인칭대명사의 소유격: name 앞에는 소유격 my 사용","topic":"인칭대명사의 소유격","memo":"name 앞에는 소유격 my 사용"}]},{"n":3,"tag":null,"en":"When we saw each others, we hugged and jumped together in a circles. Then Soobin putted a pretty flower necklace around my neck.","ko":"우리가 서로를 보았을 때, 우리는 껴안고 함께 원을 그리며 뛰었다. 그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다.","ok":false,"foot":[],"fixes":[{"wrong":"others","right":"other","partial":false,"at":[4],"point":"each other: each other는 항상 other 단수형 사용","topic":"each other","memo":"each other는 항상 other 단수형 사용"},{"wrong":"circles","right":"circle","partial":false,"at":[12],"point":"명사의 복수형: a 뒤에는 단수명사 circle 사용","topic":"명사의 복수형","memo":"a 뒤에는 단수명사 circle 사용"},{"wrong":"putted","right":"put","partial":false,"at":[15],"point":"불규칙 과거형: put의 과거형은 put (putted 아님)","topic":"불규칙 과거형","memo":"put의 과거형은 put (putted 아님)"}]},{"n":4,"tag":null,"en":"She called it a lei and said that \"lei\" means \"warm welcome.\"","ko":"그녀는 그것을 '레이(lei)'라고 불렀고 \"lei\"는 '따뜻한 환영'을 의미한다고 말했다.","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":null,"en":"We visited Diamond Head first. It is a famously hiking place.","ko":"우리는 먼저 다이아몬드 헤드를 방문했다. 그곳은 유명한 하이킹 장소이다.","ok":false,"foot":[],"fixes":[{"wrong":"famously","right":"famous","partial":false,"at":[8],"point":"형용사와 부사: 명사 hiking place 앞에는 형용사 famous 사용","topic":"형용사와 부사","memo":"명사 hiking place 앞에는 형용사 famous 사용"}]},{"n":6,"tag":null,"en":"My uncle told us how it got its name. On the past, people mistook its shiny rocks for diamonds.","ko":"삼촌이 우리에게 그것이 어떻게 그런 이름을 갖게 되었는지 말해 주셨다. 과거에, 사람들은 그것의 반짝이는 돌들을 다이아몬드로 착각했다.","ok":false,"foot":[],"fixes":[{"wrong":"On","right":"In","partial":false,"at":[9],"point":"기본전치사: '과거에'는 In the past 사용","topic":"기본전치사","memo":"'과거에'는 In the past 사용"}]},{"n":7,"tag":null,"en":"So, they named the place Diamond Head. How interesting!","ko":"그래서 그들은 그 장소를 다이아몬드 헤드라고 이름 붙였다. 정말 흥미로웠다!","ok":true,"foot":[],"fixes":[]},{"n":8,"tag":null,"en":"The view from the top were amazing. Soobin and I took much pictures there!","ko":"정상에서 바라본 경치는 정말 놀라웠다. 수빈이와 나는 거기서 많은 사진을 찍었다!","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[5],"point":"be동사의 수일치: 주어 The view(단수)에는 was 사용","topic":"be동사의 수일치","memo":"주어 The view(단수)에는 was 사용"},{"wrong":"much","right":"many","partial":false,"at":[11],"point":"수량 형용사: 셀 수 있는 pictures 앞에는 many 사용","topic":"수량 형용사","memo":"셀 수 있는 pictures 앞에는 many 사용"}]},{"n":9,"tag":"8월 2일 · 문화 센터","en":"Today we goed to a culture center. We learned about traditional Hawaiian culture there.","ko":"오늘 우리는 문화 센터에 갔다. 우리는 거기에서 하와이 전통문화에 대해 배웠다.","ok":false,"foot":[],"fixes":[{"wrong":"goed","right":"went","partial":false,"at":[2],"point":"불규칙 과거형: go의 과거형은 went (goed 아님)","topic":"불규칙 과거형","memo":"go의 과거형은 went (goed 아님)"}]},{"n":10,"tag":null,"en":"First, we learned what some Hawaiian words means. \"Aloha\" is used to say \"hello\" or \"goodbye,\" and \"mahalo\" means \"thank you.\"","ko":"먼저, 우리는 몇몇 하와이 단어들이 무엇을 의미하는지 배웠다. \"Aloha\"는 '안녕' 또는 '잘 가'라는 인사를 하는 데 사용되고, \"mahalo\"는 '고마워'를 의미한다.","ok":false,"foot":[],"fixes":[{"wrong":"means","right":"mean","partial":false,"at":[7],"point":"주어와 동사의 수일치: 주어 words(복수)는 동사원형: mean (means 아님)","topic":"주어와 동사의 수일치","memo":"주어 words(복수)는 동사원형: mean (means 아님)"}]},{"n":11,"tag":null,"en":"Then it was hula dance time! Surprisingly, many of the movement stood for things in nature.","ko":"그 다음은 훌라 춤 시간이었다! 놀랍게도, 많은 동작들이 자연의 것들을 상징했다.","ok":false,"foot":[],"fixes":[{"wrong":"movement","right":"movements","partial":false,"at":[10],"point":"명사의 복수형: many of the 뒤에는 복수명사 movements 사용","topic":"명사의 복수형","memo":"many of the 뒤에는 복수명사 movements 사용"}]},{"n":12,"tag":null,"en":"For example, if you raise you arms above your head in a circle, it stand for the moon.","ko":"예를 들어, 팔을 머리 위로 원을 그리며 들면, 그것은 달을 의미한다.","ok":false,"foot":[],"fixes":[{"wrong":"you","right":"your","partial":false,"at":[5],"point":"인칭대명사의 소유격: arms 앞에는 소유격 your 사용","topic":"인칭대명사의 소유격","memo":"arms 앞에는 소유격 your 사용"},{"wrong":"stand","right":"stands","partial":false,"at":[14],"point":"3인칭 단수 현재형: 주어 it에는 stands 사용","topic":"3인칭 단수 현재형","memo":"주어 it에는 stands 사용"}]},{"n":13,"tag":null,"en":"When I danced hula, I could felt the Hawaiian people's love for nature.","ko":"훌라 춤을 출 때, 나는 하와이 사람들의 자연에 대한 사랑을 느낄 수 있었다.","ok":false,"foot":[],"fixes":[{"wrong":"felt","right":"feel","partial":false,"at":[6],"point":"조동사 뒤 동사원형: 조동사 could 뒤에는 동사원형: feel (felt 아님)","topic":"조동사 뒤 동사원형","memo":"조동사 could 뒤에는 동사원형: feel (felt 아님)"}]},{"n":14,"tag":null,"en":"On the way back to Soobin's house, we saw a big, beautiful rainbow. Soobin explained, \"You can see often rainbows in Hawaii.","ko":"수빈이네 집으로 돌아가는 길에, 우리는 크고 아름다운 무지개를 보았다. 수빈이는 \"하와이에서는 무지개를 자주 볼 수 있어.","ok":false,"foot":[],"fixes":[{"wrong":"see often","right":"often see","partial":false,"at":[17],"point":"빈도부사의 위치: 빈도부사 often은 일반동사 see 앞에 위치","topic":"빈도부사의 위치","memo":"빈도부사 often은 일반동사 see 앞에 위치"}]},{"n":15,"tag":null,"en":"So, Hawaii is called the Rainbow State.\"","ko":"그래서 하와이는 '무지개 주'라고 불려.\"라고 설명해 주었다.","ok":true,"foot":[],"fixes":[]}];var PP=[["Monday, August 1","8월 1일 월요일",1],["After a nine-hour flight, my family finally arrived at the international airport in Honolulu.","아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다.",1],["When we came through the gate, I heard someone calling my name.","우 ,["Soobin explained, \"You can often see rainbows in Hawaii.","수빈이는 \"하와이에서는 무지개를 자주 볼 수 있어.",0],["So, Hawaii is called the Rainbow State.\"","그래서 하와이는 '무지개 주'라고 불려.\"라고 설명해 주었다.",0]];var RNUM=51;var TITLE_EN="Yeji's Family Trip to the Rainbow State";var PASS_EN=["Yeji's Family Trip to the Rainbow State","Monday, August 1","After a nine-hour flight, my family finally arrived at the international airport in Honolulu. When we came through the gate, I heard someone calling my name. My cousin Soobin and her family were waiting for us. When we saw each other, we hugged and jumped together in a circle. Then Soobin put a pretty flower necklace around my neck. She called it a lei and said that \"lei\" means \"warm welcome.\"","We visited Diamond Head first. It is a famous hiking place. My uncle told us how it got its name. In the past, people mistook its shiny rocks for diamonds. So, they named the place Diamond Head. How interesting! The view from the top was amazing. Soobin and I took many pictures there!","Tuesday, August 2","Today we went to a culture center. We learned about traditional Hawaiian culture there.","First, we learned what some Hawaiian words mean. \"Aloha\" is used to say \"hello\" or \"goodbye,\" and \"mahalo\" means \"thank you.\"","Then it was hula dance time! Surprisingly, many of the movements stood for things in nature. For example, if you raise your arms above your head in a circle, it stands for the moon. When I danced hula, I could feel the Hawaiian people's love for nature.","On the way back to Soobin's house, we saw a big, beautiful rainbow. Soobin explained, \"You can often see rainbows in Hawaii. So, Hawaii is called the Rainbow State.\""];var PASS_KO=["예지의 무지개 주 가족 여행","8월 1일 월요일","아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다. 우리가 게이트를 통과했을 때, 나는 누군가 내 이름을 부르는 소리를 들었다. 내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다. 우리가 서로를 보았을 때, 우리는 껴안고 함께 원을 그리며 뛰었다. 그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다. 그녀는 그것을 '레이(lei)'라고 불렀고 \"lei\"는 '따뜻한 환영'을 의미한다고 말했다.","우리는 먼저 다이아몬드 헤드를 방문했다. 그곳은 유명한 하이킹 장소이다. 삼촌이 우리에게 그것이 어떻게 그런 이름을 갖게 되었는지 말해 주셨다. 과거에, 사람들은 그것의 반짝이는 돌들을 다이아몬드로 착각했다. 그래서 그들은 그 장소를 다이아몬드 헤드라고 이름 붙였다. 정말 흥미로웠다! 정상에서 바라본 경치는 정말 놀라웠다. 수빈이와 나는 거기서 많은 사진을 찍었다!","8월 2일 화요일","오늘 우리는 문화 센터에 갔다. 우리는 거기에서 하와이 전통문화에 대해 배웠다.","먼저, 우리는 몇몇 하와이 단어들이 무엇을 의미하는지 배웠다. \"Aloha\"는 '안녕' 또는 '잘 가'라는 인사를 하는 데 사용되고, \"mahalo\"는 '고마워'를 의미한다.","그 다음은 훌라 춤 시간이었다! 놀랍게도, 많은 동작들이 자연의 것들을 상징했다. 예를 들어, 팔을 머리 위로 원을 그리며 들면, 그것은 달을 의미한다. 훌라 춤을 출 때, 나는 하와이 사람들의 자연에 대한 사랑을 느낄 수 있었다.","수빈이네 집으로 돌아가는 길에, 우리는 크고 아름다운 무지개를 보았다. 수빈이는 \"하와이에서는 무지개를 자주 볼 수 있어. 그래서 하와이는 '무지개 주'라고 불려.\"라고 설명해 주었다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["choosing a travel destination","making travel plans for Australia","recommending a travel destination","famous tourist attractions in Australia","the history of the Sydney Opera House"],"a":1,"ans":"making travel plans for Australia","evs":[["Dad, let's plan our trip to Australia!","아빠, 우리 호주 여행을 계획해요!"],["I'd like to visit the Sydney Opera House.","시드니 오페라 하우스에 가고 싶어요."],["Then how about taking a tour of the Sydney Opera House on the first day? We can learn about the history of the building.","그럼 첫째 날에 시드니 오페라 하우스 투어를 하는 게 어떠니? 그 건물의 역사에 대해 배울 수 있단다."]],"ev":["Dad, let's plan our trip to Australia!","아빠, 우리 호주 여행을 계획해요!"],"ow":["오답 ✕ — 'Where would you like to go?'(어디에 가고 싶니?)라는 질문은 있지만 여행지를 고르는 대화는 아니에요. 이미 호주(Australia)로 정하고 계획을 세우는 중이에요.","정답 ○ — 'Dad, let's plan our trip to Australia!'(아빠, 우리 호주 여행을 계획해요!)로 시작해 첫째 날 투어와 오페라 표까지 계획을 세우므로 '호주 여행 계획 세우기'가 주제예요.","오답 ✕ — 아빠가 투어를 제안하는 것은 'how about taking a tour'(투어를 하는 게 어떠니?)처럼 여행 일정 제안이에요. 여행지를 추천하는 대화는 아니에요.","오답 ✕ — 시드니 오페라 하우스가 나오지만 호주의 유명한 관광지들을 소개하는 대화는 아니에요. 하나의 장소를 가기로 한 계획이에요.","오답 ✕ — 'We can learn about the history of the building.'(그 건물의 역사에 대해 배울 수 있단다)라는 말만 나오고 역사를 설명하지는 않아요. 너무 좁은 보기예요."],"memo":["정답: ② making travel plans for Australia (호주 여행 계획 세우기)","근거: Dad, let's plan our trip to Australia!(아빠, 우리 호주 여행을 계획해요!)","함정: ③ 여행지를 추천하는 대화가 아니라 일정을 짜는 대화라서 ✕"],"why":"유미와 아빠가 호주 여행 일정을 계획하는 대화이다."},{"n":2,"q":"위 대화를 읽고 답할 수 없는 질문은?","o":["What does the girl ask her dad to do?","What does Dad suggest doing on the first day?","How many times a week are performances held at the Sydney Opera House?","What kind of performance does the girl want to see?","What will Dad do after the conversation?"],"a":2,"ans":"How many times a week are performances held at the Sydney Opera House?","evs":[["Dad, let's plan our trip to Australia!","아빠, 우리 호주 여행을 계획해요!"],["Then how about taking a tour of the Sydney Opera House on the first day? We can learn about the history of the building.","그럼 첫째 날에 시드니 오페라 하우스 투어를 하는 게 어떠니? 그 건물의 역사에 대해 배울 수 있단다."],["I want to see an opera.","저는 오페라를 보고 싶어요."],["Okay. I'll look for tickets to an opera.","좋아. 내가 오페라 표를 알아볼게."]],"ev":["Dad, let's plan our trip to Australia!","아빠, 우리 호주 여행을 계획해요!"],"ow":["오답 ✕ — 소녀가 'Dad, let's plan our trip to Australia!'(아빠, 우리 호주 여행을 계획해요!)라고 했으므로 여행 계획을 세우자고 요청했다는 것을 알 수 있어요.","오답 ✕ — 아빠가 'how about taking a tour of the Sydney Opera House on the first day?'(첫째 날에 시드니 오페라 하우스 투어를 하는 게 어떠니?)라고 했으므로 알 수 있어요.","정답 ○ — 공연이 일주일에 몇 번 열리는지에 대한 말은 대화에 없어요. 가장 가까운 문장인 'We can buy tickets to an opera or a classical music concert.'(오페라나 클래식 음악회 표를 살 수 있단다)에도 횟수는 나오지 않아요.","오답 ✕ — 소녀가 'I want to see an opera.'(저는 오페라를 보고 싶어요)라고 했으므로 보고 싶은 공연을 알 수 있어요.","오답 ✕ — 아빠가 'I'll look for tickets to an opera.'(내가 오페라 표를 알아볼게)라고 했으므로 대화 후 할 일을 알 수 있어요."],"memo":["정답: ③ 공연이 일주일에 몇 번 열리는지는 대화에 없음","근거: We can buy tickets to an opera or a classical music concert.(오페라나 클래식 음악회 표를 살 수 있단다.) — 횟수는 안 나옴","함정: ⑤ 아빠는 오페라 표를 알아보겠다고 했어 (I'll look for tickets)"],"why":"공연이 일주일에 몇 번 열리는지는 대화에 나오지 않는다."}],"dlg":[["G","Dad, let's plan our trip to Australia!","아빠, 우리 호주 여행을 계획해요!"],["M","Okay, Yumi. Where would you like to go?","좋아, 유미야. 어디에 가고 싶니?"],["G","I'd like to visit the Sydney Opera House.","시드니 오페라 하우스에 가고 싶어요."],["M","Then how about taking a tour of the Sydney Opera House on the first day? We can learn about the history o ":[["G","What are you looking at?","뭘 보고 있니?"],["B","I'm looking at pictures of Japan. I'm going to go there with my family.","일본 사진을 보고 있어. 나는 가족과 함께 그곳에 갈 거야."],["G","That's great. What do you want to see there?","멋지다. 거기서 뭘 보고 싶니?"],["B","We want to see traditional places like the one in this picture. We're planning to stay in a traditional house, too.","우리는 이 사진에 있는 곳 같은 전통적인 장소를 보고 싶어. 전통 가옥에서 묵을 계획이기도 해."],["G","That sounds amazing! I hope I can go there someday.","멋지다! 나도 언젠가 거기 가 볼 수 있으면 좋겠어."]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Many people came to the lantern festival in Thailand.","The boy is excited to see the lanterns.","People want bad luck to go away by flying lanterns.","The boy made a wish about his grades.","The boy and the woman flew their lantern together."],"a":3,"ans":"The boy made a wish about his grades.","evs":[["Okay. I'd like to wish for our family's happiness.","좋아요. 저는 우리 가족의 행복을 빌고 싶어요."],["People send away bad luck with the lanterns and make wishes.","사람들은 등불로 나쁜 운을 멀리 보내고 소원을 빌어."]],"ev":["Okay. I'd like to wish for our family's happiness.","좋아요. 저는 우리 가족의 행복을 빌고 싶어요."],"ow":["오답 ✕ — 소년이 'There are already a lot of people here.'(벌써 여기에 사람이 많아요)라고 했으므로 많은 사람이 왔다는 말은 맞아요.","오답 ✕ — 여자가 'I'm excited to see the bright lanterns in the sky.'(하늘에 떠오른 밝은 등불을 보게 되어 설레)라고 하자 소년이 'Me too!'(저도요!)라고 했으므로 소년도 설레요. 일치해요.","오답 ✕ — 'People send away bad luck with the lanterns and make wishes.'(사람들은 등불로 나쁜 운을 멀리 보내고 소원을 빌어)라고 했으므로 일치해요.","정답 ○ — 소년의 소원은 'I'd like to wish for our family's happiness.'(우리 가족의 행복을 빌고 싶어요)예요. 성적에 대한 소원이라는 말은 대화와 달라서 일치하지 않아요.","오답 ✕ — 여자가 'I bought a lantern for us'(우리를 위한 등불을 샀어)라고 하고 'Are you ready to fly our lantern?'(우리 등불을 날릴 준비 됐니?)이라고 했으므로 함께 날렸어요. 일치해요."],"memo":["정답: ④ 소년이 성적에 대한 소원을 빌었다는 말은 ✕","근거: I'd like to wish for our family's happiness.(저는 우리 가족의 행복을 빌고 싶어요.)","함정: 소원은 grades(성적)가 아니라 family's happiness(가족의 행복)야"],"why":"소년은 성적이 아니라 가족의 행복을 소원으로 빌었다."}],"dlg":[["W","We're finally here, the lantern festival in Thailand!","우리 드디어 도착했어, 태국의 등불 축제야!"],["B","There are already a lot of people here.","벌써 여기에 사람이 많아요."],["W","Yes. I'm excited to see the bright lanterns in the sky.","그래. 나는 하늘에 떠오른 밝은 등불을 보게 되어 설레."],["B","Me too! But why do people fly lanterns?","저도요! 그런데 사람들은 왜 등불을 날리나요?"],["W","People send away bad luck with the lanterns and make wishes.","사람들은 등불로 나쁜 운을 멀리 보내고 소원을 빌어."],["B","That's interesting!","흥미로워요!"],["W","Yes. I bought a lantern for us, too. Let's make a wish!","그래. 우리를 위한 등불도 샀어. 소원을 빌어 보자!"],["B","Okay. I'd like to wish for our family's happiness.","좋아요. 저는 우리 가족의 행복을 빌고 싶어요."],["W","That's a wonderful wish. Are you ready to fly our lantern? 3, 2, 1, go!","멋진 소원이구나. 우리 등불을 날릴 준비 됐니? 3, 2, 1, 출발!"],["B","Wow, it's beautiful. I really hope our wish comes true.","와, 아름다워요. 우리 소원이 꼭 이루어지면 좋겠어요."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["The girl is writing a report about France.","The girl is just taking a break.","The girl wants to stay by the ocean in France.","The boy is also planning a trip to France.","The boy thinks the water in the picture looks dirty."],"a":2,"ans":"The girl wants to stay by the ocean in France.","evs":[["I'm planning my trip to France.","나는 프랑스 여행을 계획하고 있어."],["I'd like to stay at a place by the ocean and spend some time at the beach.","바닷가에 있는 곳에서 묵으면서 해변에서 시간을 보내고 싶어."],["Wow, the water looks bright blue in this picture.","와, 이 사진에서 물이 밝은 파란색으로 보여."]],"ev":["I'm planning my trip to France.","나는 프랑스 여행을 계획하고 있어."],"ow":["오답 ✕ — 소녀는 'I'm planning my trip to France.'(나는 프랑스 여행을 계획하고 있어)라고 했어요. 보고서를 쓰는 것이 아니라 여행 계획을 세우는 중이에요.","오답 ✕ — 소년이 무엇을 하냐고 묻자 소녀는 쉬는 중이라고 하지 않고 'I'm planning my trip to France.'(프랑스 여행을 계획하고 있어)라고 답했어요.","정답 ○ — 소녀는 'I'd like to stay at a place by the ocean and spend some time at the beach.'(바닷가에 있는 곳에서 묵으면서 해변에서 시간을 보내고 싶어)라고 했으므로 바다 근처에서 지내고 싶어 해요.","오답 ✕ — 여행을 계획하는 사람은 소녀예요. 소년은 'I hope you have a nice trip!'(즐거운 여행이 되길 바라!)이라고 응원해 주었을 뿐이에요.","오답 ✕ — 소년은 'the water looks bright blue in this picture'(사진에서 물이 밝은 파란색으로 보여)라고 했어요. 더럽다는 말은 없고 오히려 아름답다고 했어요."],"memo":["정답: ③ 소녀는 프랑스에서 바다 근처에 머물고 싶어 한다","근거: I'd like to stay at a place by the ocean and spend some time at the beach.(바닷가에 있는 곳에서 묵고 해변에서 시간을 보내고 싶어.)","함정: ④ 여행을 가는 사람은 소녀이고 소년은 응원만 해서 ✕"],"why":"소녀는 프랑스에서 바닷가에 머물며 해변에서 시간을 보내고 싶어 한다."}],"dlg":[["B","What are you doing?","뭐 하고 있니?"],["G","I'm planning my trip to France.","나는 프랑스 여행을 계획하고 있어."],["B","That sounds exciting! What would you like to do there?","신나겠다! 거기서 뭘 하고 싶니?"],["G","I'd like to stay at a place by the ocean and spend some time at the beach.","바닷가에 있는 곳에서 묵으면서 해변에서 시간을 보내고 싶어."],["B","Wow, the water looks bright blue in this picture.","와, 이 사진에서 물이 밝은 파란색으로 보여."],["G","Yes. It looks really beautiful.","응. 정말 아름다워 보여."],["B","I hope you have a nice trip!","즐거운 여행이 되길 바라!"]]}];var BG=[{"qs":[{"n":6,"q":"How did Diamond Head get its name?","o":["People mistook its shiny rocks for diamonds.","A man named Diamond first climbed it.","Diamonds were sold there a long time ago.","It looks like a giant diamond ring.","A hiking club named it after a famous song."],"a":0,"ans":"People mistook its shiny rocks for diamonds.","evs":[["In the past, people mistook its shiny rocks for diamonds.","과거에, 사람들은 그것의 반짝이는 돌들을 다이아몬드로 착각했다."],["So, they named the place Diamond Head.","그래서 그들은 그 장소를 다이아몬드 헤드라고 이름 붙였다."]],"ev":["In the past, people mistook its shiny rocks for diamonds.","과거에, 사람들은 그것의 반짝이는 돌들을 다이아몬드로 착각했다."],"ow":["정답 ○ — 'In the past, people mistook its shiny rocks for diamonds.'(과거에 사람들은 그곳의 반짝이는 돌들을 다이아몬드로 착각했다)와 'So, they named the place Diamond Head.'(그래서 그 장소를 다이아몬드 헤드라고 이름 붙였다)에 해당해요.","오답 ✕ — 본문에는 Diamond라는 이름의 사람이 나오지 않아요. 이름의 이유는 'mistook its shiny rocks for diamonds'(반짝이는 돌을 다이아몬드로 착각했다)예요.","오답 ✕ — 다이아몬드를 팔았다는 말은 없어요. 다이아몬드가 아니라 다이아몬드로 착각한 돌이었어요('mistook ... for diamonds').","오답 ✕ — 반지처럼 생겼다는 말은 본문에 없어요. 이름은 모양이 아니라 반짝이는 돌 때문에 붙었어요.","오답 ✕ — 하이킹 모임이 이름을 붙였다는 말은 본문에 없어요. 'people mistook its shiny rocks for diamonds'가 이유예요."],"memo":["정답: ① 반짝이는 돌을 다이아몬드로 착각해서 (mistook A for B)","근거: People mistook its shiny rocks for diamonds. So, they named the place Diamond Head.(반짝이는 돌을 다이아몬드로 착각해서 다이아몬드 헤드라고 이름 붙였다.)","함정: mistook A for B는 'A를 B로 착각하다'라는 뜻이야"],"why":"반짝이는 돌을 다이아몬드로 착각해서 다이아몬드 헤드라는 이름이 붙었다."},{"n":7,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Yeji's family arrived in Honolulu after a nine-hour flight.","Soobin and her family were waiting for Yeji's family.","Soobin put a flower necklace around Yeji's neck.","Diamond Head is a famous hiking place.","Yeji and Soobin didn't take any pictures at Diamond Head."],"a":4,"ans":"Yeji and Soobin didn't take any pictures at Diamond Head.","evs":[["After a nine-hour flight, my family finally arrived at the international airport in Honolulu.","아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다."],["My cousin Soobin and her family were waiting for us.","내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다."],["Then Soobin put a pretty flower necklace around my neck.","그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다."],["It is a famous hiking place.","그곳은 유명한 하이킹 장소이다."],["Soobin and I took many pictures there!","수빈이와 나는 거기서 많은 사진을 찍었다!"]],"ev":["After a nine-hour flight, my family finally arrived at the international airport in Honolulu.","아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다."],"ow":["오답 ✕ — 'After a nine-hour flight, my family finally arrived at the international airport in Honolulu.'(아홉 시간의 비행 끝에 우리 가족은 호놀룰루 국제공항에 도착했다)라고 했으므로 일치해요.","오답 ✕ — 'My cousin Soobin and her family were waiting for us.'(내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다)라고 했으므로 일치해요.","오답 ✕ — 'Then Soobin put a pretty flower necklace around my neck.'(수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다)라고 했으므로 일치해요.","오답 ✕ — 'It is a famous hiking place.'(그곳은 유명한 하이킹 장소이다)라고 했으므로 일치해요.","정답 ○ — 'Soobin and I took many pictures there!'(수빈이와 나는 거기서 많은 사진을 찍었다!)라고 했어요. 사진을 하나도 찍지 않았다는 이 보기는 본문과 달라서 일치하지 않아요."],"memo":["정답: ⑤ 사진을 찍지 않았다는 말은 ✕ (많은 사진을 찍음)","근거: Soobin and I took many pictures there!(수빈이와 나는 거기서 많은 사진을 찍었다!)","함정: 레이(lei)는 꽃목걸이이고 '따뜻한 환영'이라는 뜻이야"],"why":"예지와 수빈이는 다이아몬드 헤드에서 많은 사진을 찍었다."}],"pp":[["Monday, August 1","8월 1일 월요일"],["After a nine-hour flight, my family finally arrived at the international airport in Honolulu.","아홉 시간의 비행 끝에, 우리 가족은 마침내 호놀룰루 국제공항에 도착했다."],["When we came through the gate, I heard someone calling my name.","우리가 게이트를 통과했을 때, 나는 누군가 내 이름을 부르는 소리를 들었다."],["My cousin Soobin and her family were waiting for us.","내 사촌 수빈이와 그녀의 가족이 우리를 기다리고 있었다."],["When we saw each other, we hugged and jumped together in a circle.","우리가 서로를 보았을 때, 우리는 껴안고 함께 원을 그리며 뛰었다."],["Then Soobin put a pretty flower necklace around my neck.","그때 수빈이가 내 목에 예쁜 꽃목걸이를 걸어주었다."],["She called it a lei and said that \"lei\" means \"warm welcome.\"","그녀는 그것을 '레이(lei)'라고 불렀고 \"lei\"는 '따뜻한 환영'을 의미한다고 말했다."],["We visited Diamond Head first.","우리는 먼저 다이아몬드 헤드를 방문했다."],["It is a famous hiking place.","그곳은 유명한 하이킹 장소이다."],["My uncle told us how it got its name.","삼촌이 우리에게 그것이 어떻게 그런 이름을 갖게 되었는지 말해 주셨다."],["In the past, people mistook its shiny rocks for diamonds.","과거에, 사람들은 그것의 반짝이는 돌들을 다이아몬드로 착각했다."],["So, they named the place Diamond Head.","그래서 그들은 그 장소를 다이아몬드 헤드라고 이름 붙였다."],["How interesting!","정말 흥미로웠다!"],["The view from the top was amazing.","정상에서 바라본 경치는 정말 놀라웠다."],["Soobin and I took many pictures there!","수빈이와 나는 거기서 많은 사진을 찍었다!"]]},{"qs":[{"n":8,"q":"What does it mean in hula when you raise your arms above your head in a circle?","o":["the moon","the sun","a flower","the rain","a rainbow"],"a":0,"ans":"the moon","evs":[["Surprisingly, many of the movements stood for things in nature.","놀랍게도, 많은 동작들이 자연의 것들을 상징했다."],["For example, if you raise your arms above your head in a circle, it stands for the moon.","예를 들어, 팔을 머리 위로 원을 그리며 들면, 그것은 달을 의미한다."]],"ev":["Surprisingly, many of the movements stood for things in nature.","놀랍게도, 많은 동작들이 자연의 것들을 상징했다."],"ow":["정답 ○ — 'if you raise your arms above your head in a circle, it stands for the moon.'(팔을 머리 위로 원을 그리며 들면 그것은 달을 의미한다)라고 했어요.","오답 ✕ — 본문에서 원을 그리며 팔을 드는 동작은 'the moon'(달)이라고 했어요. 해(sun)는 var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}

  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
