<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>브릭스 리딩 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"b1-01-1","no":1,"ko":"꼬리를 일부러 떼어 내는 도마뱀, 왜?","items":[{"n":1,"t":"tf","q":"A lizard drops its tail to get away when it is attacked.","ko":"도마뱀은 공격받으면 도망치려고 꼬리를 떼어 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"When one of these lizards is attacked, it drops its tail to get away.","이 도마뱀들 중 하나가 공격받으면, 그 도마뱀은 도망치려고 꼬리를 떼어 낸다."]],"w":"5번 문장에 it drops its tail to get away가 그대로 있어요. 공격받으면 도망치려고 꼬리를 떼어 낸다는 내용과 일치해요.","c":"T"},"h":"c8e1f1f730"},{"n":2,"t":"tf","q":"The tail stops moving as soon as it falls off.","ko":"꼬리는 떨어지자마자 움직임을 멈춘다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The tail keeps moving even after it falls off.","꼬리는 떨어져 나간 후에도 계속 움직인다."]],"w":"6번 문장에서 꼬리는 떨어진 후에도 계속 움직인다(keeps moving even after it falls off)고 해요. 멈춘다는 말은 반대예요.","c":"F"},"h":"c4430ae097"},{"n":3,"t":"tf","q":"Predators often go for the bright tail first.","ko":"포식자들은 흔히 밝은 꼬리를 먼저 노린다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"Some lizards have a tail that is brighter or more colorful than the rest of their body.","일부 도마뱀은 몸의 나머지 부분보다 더 밝거나 더 화려한 색의 꼬리를 가지고 있다."],[4,"So predators often go for the tail first.","그래서 포식자들은 흔히 꼬리를 먼저 노린다."]],"w":"3번에서 꼬리가 더 밝고 화려하다고 했고, 4번에서 그래서 포식자들은 흔히 꼬리를 먼저 노린다고 해요.","c":"T"},"h":"0711da2f2c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This confuses the predator.)","ko":"이것은 포식자를 혼란스럽게 한다. (confuse는 혼란스럽게 하다)","opts":["도와준다","쫓아낸다","혼란스럽게 한다","잠들게 한다"],"word":"confuses","r":{"a":"3) 혼란스럽게 한다","ev":"6~7번 문장","s":[[6,"The tail keeps moving even after it falls off.","꼬리는 떨어져 나간 후에도 계속 움직인다."],[7,"This confuses the predator.","이것은 포식자를 혼란스럽게 한다."]],"w":"6번에서 떨어진 꼬리가 계속 움직여요. 그래서 포식자가 어느 쪽을 봐야 할지 헷갈리는 거예요. confuse = 혼란스럽게 하다.","c":3},"h":"d940887fda"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When one of these lizards is attacked, ...)","ko":"이 도마뱀들 중 하나가 공격받으면, ...","opts":["공격받는","도움받는","발견되는","먹이를 받는"],"word":"attacked","r":{"a":"1) 공격받는","ev":"5번 문장","s":[[5,"When one of these lizards is attacked, it drops its tail to get away.","이 도마뱀들 중 하나가 공격받으면, 그 도마뱀은 도망치려고 꼬리를 떼어 낸다."]],"w":"5번 문장은 포식자가 도마뱀을 공격하는 상황이에요. is attacked는 '공격받다'이고, 그래서 꼬리를 떼어 도망쳐요.","c":1},"h":"2337148fb3"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhen a predator gets too close, they can drop their tails!","ko":"밑줄 친 they가 가리키는 것은?","sko":"포식자가 너무 가까이 다가오면, 그들은 꼬리를 떼어 낼 수 있다!","opts":["포식자들","일부 도마뱀","도마뱀의 꼬리","위험한 동물"],"r":{"a":"2) 일부 도마뱀","ev":"1~2번 문장","s":[[1,"Some lizards have an amazing way to get away from danger.","일부 도마뱀은 위험에서 벗어나는 놀라운 방법을 가지고 있다."],[2,"When a predator gets too close, they can drop their tails!","포식자가 너무 가까이 다가오면, 그들은 꼬리를 떼어 낼 수 있다!"]],"w":"꼬리를 떼는 쪽은 포식자가 아니라 도마뱀이에요. 1번 Some lizards를 2번에서 they로 받았어요.","c":2},"h":"7139afe7d8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A new tail grows back in a few weeks or months.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"새 꼬리는 몇 주 또는 몇 달 안에 다시 자란다.","opts":["새 꼬리는 몇 년이 지나야 겨우 자란다.","새 꼬리는 하루 만에 다시 자란다.","떨어진 꼬리가 몇 주 뒤에 다시 붙는다.","새 꼬리는 몇 주 또는 몇 달 안에 다시 자란다."],"r":{"a":"4) 새 꼬리는 몇 주 또는 몇 달 안에 다시 자란다.","ev":"9번 문장","s":[[9,"A new tail grows back in a few weeks or months.","새 꼬리는 몇 주 또는 몇 달 안에 다시 자란다."]],"w":"a few weeks or months는 몇 주 또는 몇 달이에요. 몇 년도 하루도 아니고, 떨어진 꼬리가 다시 붙는 게 아니라 새 꼬리가 자라는 거예요.","c":4},"h":"db442bc09c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["포식자는 보통 몸 색이 어두운 도마뱀을 먼저 노린다.","떨어진 꼬리가 계속 움직여서 포식자가 혼란스러워한다.","도마뱀은 꼬리를 떼면 다시는 새 꼬리가 나지 않는다.","도마뱀은 도망치기 위해 포식자에게 먼저 다가간다."],"opts":["Predators usually go for the dark body of a lizard first.","The moving tail confuses the predator.","A lizard never grows a new tail after dropping it.","A lizard goes close to a predator to get away."],"r":{"a":"2) The moving tail confuses the predator.","ev":"6~7번 문장","s":[[6,"The tail keeps moving even after it falls off.","꼬리는 떨어져 나간 후에도 계속 움직인다."],[7,"This confuses the predator.","이것은 포식자를 혼란스럽게 한다."]],"w":"6~7번에서 떨어진 꼬리가 계속 움직이고 그것이 포식자를 혼란스럽게 해요. 포식자는 밝은 꼬리를 먼저 노리고(3~4번), 새 꼬리는 다시 자라요(9번).","c":2},"h":"8042792c37"},{"n":9,"t":"sum","q":"When a lizard is attacked, it (A) its tail. The tail keeps moving, so the predator is (B) and the lizard can escape.","ko":"도마뱀은 공격받으면 꼬리를 (A)한다. 꼬리가 계속 움직여서 포식자는 (B)하고 도마뱀은 도망칠 수 있다.","oko":["(A) 감춘다 / (B) 기뻐한다","(A) 먹는다 / (B) 혼란스러워한다","(A) 떼어 낸다 / (B) 화가 난다","(A) 키운다 / (B) 지친다","(A) 떼어 낸다 / (B) 혼란스러워한다"],"opts":["(A) hides / (B) happy","(A) eats / (B) confused","(A) drops / (B) angry","(A) grows / (B) tired","(A) drops / (B) confused"],"r":{"a":"5) (A) drops / (B) confused","ev":"5~8번 문장","s":[[5,"When one of these lizards is attacked, it drops its tail to get away.","이 도마뱀들 중 하나가 공격받으면, 그 도마뱀은 도망치려고 꼬리를 떼어 낸다."],[7,"This confuses the predator.","이것은 포식자를 혼란스럽게 한다."],[8,"Then the lizard has time to escape.","그러면 도마뱀은 도망칠 시간을 얻는다."]],"w":"5번에서 꼬리를 떼어 내고(drops), 7번에서 포식자가 혼란스러워해요(confused). 그 사이 도마뱀은 도망쳐요(8번).","c":5},"h":"93563ac613"},{"n":10,"t":"fill","q":"When attacked, a lizard [A] its tail, and the [B] tail confuses the predator.","ko":"공격받으면 도마뱀은 꼬리를 [A]하고, [B] 꼬리는 포식자를 혼란스럽게 한다.","bank":["drops","moving","colorful","grows","escape","attacked"],"bko":{"drops":"떼어 내다","moving":"움직이는","colorful":"화려한","grows":"자라다","escape":"도망치다","attacked":"공격받은"},"r":{"a":"[A] drops, [B] moving","ev":"5~7번 문장","s":[[5,"When one of these lizards is attacked, it drops its tail to get away.","이 도마뱀들 중 하나가 공격받으면, 그 도마뱀은 도망치려고 꼬리를 떼어 낸다."],[6,"The tail keeps moving even after it falls off.","꼬리는 떨어져 나간 후에도 계속 움직인다."],[7,"This confuses the predator.","이것은 포식자를 혼란스럽게 한다."]],"w":"5번 it drops its tail, 6번 The tail keeps moving, 7번 This confuses the predator에서 가져왔어요. colorful은 꼬리 색 설명(3번)이라 포식자를 혼란스럽게 하는 내용과 맞지 않아요.","c":null},"h":"86ac485811"}]},{"u":1,"id":"b1-01-2","no":2,"ko":"새끼를 낳는 건 수컷? 해마의 놀라운 육아법","items":[{"n":1,"t":"tf","q":"The female seahorse puts her eggs into the male's pouch.","ko":"암컷 해마는 알을 수컷의 주머니에 넣는다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"During mating, the female puts her eggs into a special pouch on the male’s belly.","짝짓기를 하는 동안, 암컷은 수컷의 배에 있는 특별한 주머니에 알을 넣는다."]],"w":"3번 문장에 the female puts her eggs into a special pouch on the male's belly가 있음. 암컷이 수컷의 주머니에 알을 넣는다는 내용과 일치.","c":"T"},"h":"6364314c99"},{"n":2,"t":"tf","q":"The eggs hatch outside the pouch.","ko":"알들은 주머니 밖에서 부화한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The eggs hatch inside the pouch, and the babies keep growing.","알들은 주머니 안에서 부화하고, 새끼들은 계속 자란다."]],"w":"6번 문장에 The eggs hatch inside the pouch라고 함. 주머니 밖이 아니라 안에서 부화하므로 틀린 진술.","c":"F"},"h":"881721ab9a"},{"n":3,"t":"tf","q":"The female can make more eggs because the male carries the eggs.","ko":"수컷이 알을 품기 때문에 암컷은 더 많은 알을 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Because the male carries the eggs in his pouch, the female can rest and make more eggs.","수컷이 알들을 주머니에 품고 있기 때문에, 암컷은 쉬면서 더 많은 알을 만들 수 있다."]],"w":"8번 문장에 Because the male carries the eggs in his pouch, the female can rest and make more eggs가 있음. 수컷이 품는 덕분에 암컷이 알을 더 만들 수 있다는 내용과 일치.","c":"T"},"h":"01bf1bca3a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? The eggs hatch inside the pouch, and the babies keep growing.","ko":"알들은 주머니 안에서 hatch하고, 새끼들은 계속 자란다.","opts":["썩다","사라지다","부화하다","얼어붙다"],"word":"hatch","r":{"a":"3) 부화하다","ev":"6번 문장","s":[[6,"The eggs hatch inside the pouch, and the babies keep growing.","알들은 주머니 안에서 부화하고, 새끼들은 계속 자란다."]],"w":"알이 주머니 안에서 hatch한 뒤 babies(새끼들)가 계속 자란다고 했으니, 알에서 새끼가 나오는 것. hatch = 부화하다(알에서 깨어나다).","c":3},"h":"894d23c571"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? Inside this pouch, the eggs get oxygen and nutrients as they grow.","ko":"이 주머니 안에서, 알들은 자라면서 산소와 nutrients를 얻는다.","opts":["햇빛","영양분","소금","온도"],"word":"nutrients","r":{"a":"2) 영양분","ev":"4번 문장","s":[[4,"Inside this pouch, the eggs get oxygen and nutrients as they grow.","이 주머니 안에서, 알들은 자라면서 산소와 영양분을 얻는다."]],"w":"알이 자라는 동안 oxygen(산소)과 함께 얻는 것이므로, 자라는 데 필요한 영양분. nutrients = 영양분.","c":2},"h":"a8e84f33af"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThe male carries them for about two to four weeks.","ko":"밑줄 친 them이 가리키는 것은?","sko":"수컷은 약 2주에서 4주 동안 알들을 품고 다닌다.","opts":["알들","암컷 해마들","주머니들","새끼 물고기들"],"r":{"a":"1) 알들","ev":"4~5번 문장","s":[[4,"Inside this pouch, the eggs get oxygen and nutrients as they grow.","이 주머니 안에서, 알들은 자라면서 산소와 영양분을 얻는다."],[5,"The male carries them for about two to four weeks.","수컷은 약 2주에서 4주 동안 알들을 품고 다닌다."]],"w":"4번 문장에서 주머니 안에 있는 것이 the eggs. 5번의 them은 수컷이 2~4주 동안 품는 그 알들. 암컷은 알을 넣기만 하고 품는 것은 수컷임.","c":1},"h":"564d6fd264"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It's a smart way to help them survive in the wild.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 해마가 야생에서 살아남도록 돕는 영리한 방법이다.","opts":["야생에서 해마를 쉽게 찾는 영리한 방법이다.","해마가 더 멀리 헤엄치게 돕는 영리한 방법이다.","해마가 더 크게 자라게 하는 영리한 방법이다.","해마가 야생에서 살아남도록 돕는 영리한 방법이다."],"r":{"a":"4) 해마가 야생에서 살아남도록 돕는 영리한 방법이다.","ev":"10번 문장","s":[[10,"It’s a smart way to help them survive in the wild.","그것은 해마가 야생에서 살아남도록 돕는 영리한 방법이다."]],"w":"help them survive in the wild = 그들이 야생에서 살아남도록 돕다. 찾기, 헤엄치기, 크기에 대한 말은 본문에 없음.","c":4},"h":"9caadd0c0a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["암컷이 알을 품고 다니며 새끼를 낳는다.","알은 주머니 밖에서 영양분을 얻는다.","수컷은 새끼들이 튼튼해지면 물속으로 내보낸다.","암컷은 알을 만들지 못하고 계속 쉰다."],"opts":["The female carries the eggs and gives birth.","The eggs get nutrients outside the pouch.","The male pushes the babies out into the water when they are strong enough.","The female cannot make eggs and keeps resting."],"r":{"a":"3) The male pushes the babies out into the water when they are strong enough.","ev":"7번 문장","s":[[7,"When they are strong enough, the male pushes them out into the water.","새끼들이 충분히 튼튼해지면, 수컷은 그들을 물속으로 밀어낸다."]],"w":"7번 문장에서 새끼들이 충분히 튼튼해지면 수컷이 물속으로 밀어낸다고 함. 알을 품고 낳는 것은 수컷이고, 영양분은 주머니 안에서 얻으며, 암컷은 쉬면서 알을 더 만듦.","c":3},"h":"ce74b519f3"},{"n":9,"t":"sum","q":"The male seahorse (A) the eggs in his pouch, so the female can (B) and make more eggs.","ko":"수컷 해마가 알을 주머니에 (A)하기 때문에, 암컷은 (B)하며 더 많은 알을 만들 수 있다.","oko":["(A) 버린다 / (B) 일한다","(A) 숨긴다 / (B) 헤엄친다","(A) 먹는다 / (B) 쉰다","(A) 품는다 / (B) 달아난다","(A) 품는다 / (B) 쉰다"],"opts":["(A) throws away / (B) work","(A) hides / (B) swim","(A) eats / (B) rest","(A) carries / (B) escape","(A) carries / (B) rest"],"r":{"a":"5) (A) carries / (B) rest","ev":"8번 문장","s":[[8,"Because the male carries the eggs in his pouch, the female can rest and make more eggs.","수컷이 알들을 주머니에 품고 있기 때문에, 암컷은 쉬면서 더 많은 알을 만들 수 있다."]],"w":"8번 문장에 the male carries the eggs, the female can rest and make more eggs가 있음. 따라서 carries(품다)와 rest(쉬다).","c":5},"h":"e6f6cf8c7a"},{"n":10,"t":"fill","q":"The male seahorse [A] the eggs, so the female can [B] and make more eggs.","ko":"수컷 해마가 알을 [A]하기 때문에, 암컷은 [B]하며 더 많은 알을 만들 수 있다.","bko":{"carries":"품고 다닌다","rest":"쉬다","hatch":"부화하다","grow":"자라다","push":"밀다","survive":"살아남다"},"bank":["carries","hatch","rest","grow","push","survive"],"r":{"a":"[A] carries, [B] rest","ev":"8번 문장","s":[[8,"Because the male carries the eggs in his pouch, the female can rest and make more eggs.","수컷이 알들을 주머니에 품고 있기 때문에, 암컷은 쉬면서 더 많은 알을 만들 수 있다."]],"w":"8번 문장 Because the male carries the eggs, the female can rest and make more eggs에서 가져옴. hatch, grow, push는 알과 새끼에게 일어나는 일이라 맞지 않음.","c":null},"h":"ad3107807a"}]},{"u":1,"id":"b1-01-3","no":3,"ko":"고양이 혀가 사포 같은 이유는?","items":[{"n":1,"t":"tf","q":"A cat's tongue feels rough, almost like sandpaper.","ko":"고양이의 혀는 거의 사포처럼 거칠게 느껴진다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"A cat’s tongue feels rough, almost like sandpaper.","고양이의 혀는 거의 사포처럼 거칠게 느껴진다."]],"w":"3번 문장에 rough, almost like sandpaper가 그대로 있음. 거칠다는 내용과 일치.","c":"T"},"h":"80db8fae6f"},{"n":2,"t":"tf","q":"Papillae are made of soft hair.","ko":"파필레는 부드러운 털로 만들어져 있다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"These hooks are made of keratin.","이 돌기들은 케라틴으로 만들어져 있다."]],"w":"5번 문장에서 파필레(돌기)는 케라틴으로 만들어졌다고 함. 부드러  sentence?\n\"With this tiny tool, cats are ready to live and hunt in the wild.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 작은 도구 덕분에, 고양이는 야생에서 살고 사냥할 준비가 되어 있다.","opts":["작은 도구가 없어서 고양이는 사냥을 못 한다.","고양이는 야생에서 직접 도구를 만들어 쓴다.","고양이는 작은 동물만 사냥할 수 있다.","혀의 작은 돌기 덕분에 고양이는 야생에서 살고 사냥할 수 있다."],"r":{"a":"4) 혀의 작은 돌기 덕분에 고양이는 야생에서 살고 사냥할 수 있다.","ev":"7번, 12번 문장","s":[[7,"Papillae have many uses.","파필레는 쓰임이 많다."],[12,"With this tiny tool, cats are ready to live and hunt in the wild.","이 작은 도구 덕분에, 고양이는 야생에서 살고 사냥할 준비가 되어 있다."]],"w":"this tiny tool은 파필레(혀의 작은 돌기). 이것이 있어서 야생에서 살고 사냥할 준비가 된다는 뜻. 도구를 만든다거나 작은 동물만 사냥한다는 말은 없음.","c":4},"h":"61c105ddc6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["고양이가 핥으면 사람은 부드러운 느낌을 받는다.","파필레는 먼지와 빠진 털을 잡아 털을 깨끗하게 한다.","파필레는 모래로 만들어져 있다.","파필레는 물 마실 때만 쓰인다."],"opts":["A cat's lick feels soft to people.","Papillae catch dirt and loose hair to clean the fur.","Papillae are made of sand.","Papillae are used only for drinking."],"r":{"a":"2) 파필레는 먼지와 빠진 털을 잡아 털을 깨끗하게 한다.","ev":"9~10번 문장","s":[[9,"They catch dirt and loose hair when cats groom themselves.","고양이가 몸단장을 할 때 먼지와 빠진 털을 잡아낸다."],[10,"This lets cats clean their fur effectively.","이것은 고양이가 털을 효과적으로 깨끗하게 하도록 해 준다."]],"w":"9~10번 문장과 일치. ①은 2번에서 부드럽지 않다고 했고, ③은 5번에서 케라틴이라 했으며, ④는 쓰임이 여러 가지라고 함(7번).","c":2},"h":"2203199108"},{"n":9,"t":"sum","q":"A cat's tongue feels (A) because of papillae, and papillae help cats (B) their fur and hold prey.","ko":"고양이의 혀는 파필레 때문에 (A)하게 느껴지고, 파필레는 고양이가 털을 (B)하고 먹이를 붙잡도록 돕는다.","oko":["(A) 부드럽게 / (B) 깨끗이 한다","(A) 거칠게 / (B) 더럽힌다","(A) 거칠게 / (B) 깨끗이 한다","(A) 부드럽게 / (B) 더럽힌다","(A) 매끄럽게 / (B) 잃는다"],"opts":["(A) soft / (B) clean","(A) rough / (B) dirty","(A) rough / (B) clean","(A) soft / (B) dirty","(A) smooth / (B) lose"],"r":{"a":"3) (A) rough / (B) clean","ev":"3~4번, 10~11번 문장","s":[[3,"A cat’s tongue feels rough, almost like sandpaper.","고양이의 혀는 거의 사포처럼 거칠게 느껴진다."],[4,"This is because it is covered with tiny, claw-shaped hooks called papillae.","이것은 혀가 파필레라고 불리는, 갈고리 모양의 작은 돌기로 덮여 있기 때문이다."],[10,"This lets cats clean their fur effectively.","이것은 고양이가 털을 효과적으로 깨끗하게 하도록 해 준다."],[11,"They also help cats hold prey and scrape meat from bones more easily while eating.","또한 먹는 동안 고양이가 먹이를 붙잡고 뼈에서 고기를 더 쉽게 긁어내도록 돕는다."]],"w":"3~4번에서 파필레로 덮여 거칠게(rough) 느껴진다고 하고, 10번에서 털을 깨끗하게(clean) 한다고 함. 11번에서 먹이를 붙잡는 것을 돕는다고 함.","c":3},"h":"947a473a24"},{"n":10,"t":"fill","q":"A cat's tongue is covered with tiny [A] that make it feel [B], and they help cats clean their fur.","ko":"고양이의 혀는 작은 [A]로 덮여 있어 [B]하게 느껴지고, 그것들은 고양이가 털을 깨끗이 하도록 돕는다.","bko":{"hooks":"갈고리","rough":"거친","soft":"부드러운","brush":"솔","prey":"먹잇감","bones":"뼈"},"bank":["hooks","rough","soft","brush","prey","bones"],"r":{"a":"[A] hooks, [B] rough","ev":"3~4번 문장","s":[[3,"A cat’s tongue feels rough, almost like sandpaper.","고양이의 혀는 거의 사포처럼 거칠게 느껴진다."],[4,"This is because it is covered with tiny, claw-shaped hooks called papillae.","이것은 혀가 파필레라고 불리는, 갈고리 모양의 작은 돌기로 덮여 있기 때문이다."]],"w":"3번에서 혀가 거칠게(rough) 느껴진다고 하고, 4번에서 그 이유가 작은 갈고리 모양 돌기(hooks)로 덮여 있기 때문이라고 함. soft는 2번에서 아니라고 했고, brush·prey·bones는 문장 뜻이 맞지 않음.","c":null},"h":"978f30892c"}]},{"u":1,"id":"b1-01-4","no":4,"ko":"숲속의 얼룩말? 사슴? 정체는 오카피!","items":[{"n":1,"t":"tf","q":"Okapis sleep only about two hours a day.","ko":"오카피는 하루에 겨우 두 시간 정도만 잔다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Okapis sleep only about two hours a day.","오카피는 하루에 겨우 두 시간 정도만 잔다."]],"w":"11번 문장에 sleep only about two hours a day(하루에 겨우 두 시간 정도만 잔다)가 그대로 나옴. 본문과 일치.","c":"T"},"h":"5bd948bf75"},{"n":2,"t":"tf","q":"Okapis live together in large groups in the forest.","ko":"오카피는 숲에서 큰 무리를 지어 함께 산다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"They also live alone, move silently, and make sounds too low for humans to hear.","또한 혼자 살고, 조용히 움직이며, 사람이 듣기에는 너무 낮은 소리를 낸다."]],"w":"13번 문장에 live alone(혼자 산다)이라고 함. 무리를 지어 산다는 말은 반대 내용.","c":"F"},"h":"19d6caf4bb"},{"n":3,"t":"tf","q":"The tongue of an okapi can help it grab 게 생겼지만 사는 방식은 평범하다.","오카피가 사는 방식을 아는 사람은 거의 없다.","오카피가 살아가는 방식은 생김새보다 훨씬 더 특이하다."],"r":{"a":"4) 오카피가 살아가는 방식은 생김새보다 훨씬 더 특이하다.","ev":"10번 문장","s":[[10,"Even more unusual is how it lives.","훨씬 더 특이한 것은 오카피가 살아가는 방식이다."]],"w":"Even more unusual은 '훨씬 더 특이한'이라는 뜻. 앞에서 생김새가 독특하다고 했는데, 사는 방식은 그보다 더 특이하다는 말. 평범하다는 보기는 반대.","c":4},"h":"c107bd8d52"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 같은 것은?","oko":["오카피는 길고 파란 혀를 가지고 있다.","오카피는 중앙아프리카의 사막에 산다.","오카피는 기린보다 얼룩말과 더 가까운 친척이다.","오카피는 1800년 이전에 발견되었다."],"opts":["Okapis have long, blue tongues.","Okapis live in the deserts of Central Africa.","Okapis are closer relatives of zebras than giraffes.","Okapis were discovered before 1800."],"r":{"a":"1) Okapis have long, blue tongues.","ev":"6~8번, 14번 문장","s":[[6,"This unique animal lives deep in the rainforests of Central Africa.","이 독특한 동물은 중앙아프리카의 열대우림 깊은 곳에 산다."],[7,"It looks like a mix of animals, but it’s actually a close relative of the giraffe.","여러 동물을 섞어 놓은 것처럼 보이지만, 사실은 기린과 가까운 친척이다."],[8,"Like giraffes, it has a long neck and a long, blue tongue.","기린처럼 목이 길고 파란색의 긴 혀를 가지고 있다."],[14,"Because of these secretive habits, okapis were not officially discovered until 1901.","이런 비밀스러운 습성 때문에 오카피는 1901년이 되어서야 공식적으로 발견되었다."]],"w":"8번에 a long, blue tongue이 나옴. 6번은 사막이 아니라 열대우림, 7번은 얼룩말이 아니라 기린의 친척, 14번은 1901년에야 공식적으로 발견되었다고 해서 틀림.","c":1},"h":"2d39afa044"},{"n":9,"t":"sum","q":"Okapis look like a mix of animals, but they are (A) relatives of giraffes, and their (B) habits kept them from being discovered until 1901.","ko":"오카피는 여러 동물을 섞은 것처럼 보이지만 기린의 (A) 친척이고, 그들의 (B) 습성 때문에 1901년까지 발견되지 않았다.","oko":["(A) 먼 / (B) 비밀스러운","(A) 가까운 / (B) 시끄러운","(A) 먼 / (B) 시끄러운","(A) 가까운 / (B) 비밀스러운","(A) 가까운 / (B) 친근한"],"opts":["(A) distant / (B) secretive","(A) close / (B) noisy","(A) distant / (B) noisy","(A) close / (B) secretive","(A) close / (B) friendly"],"r":{"a":"4) (A) close / (B) secretive","ev":"7번, 13~14번 문장","s":[[7,"It looks like a mix of animals, but it’s actually a close relative of the giraffe.","여러 동물을 섞어 놓은 것처럼 보이지만, 사실은 기린과 가까운 친척이다."],[14,"Because of these secretive habits, okapis were not officially discovered until 1901.","이런 비밀스러운 습성 때문에 오카피는 1901년이 되어서야 공식적으로 발견되었다."]],"w":"7번에서 기린과 close relative(가까운 친척), 14번에서 secretive habits(비밀스러운 습성) 때문에 늦게 발견됨. 시끄럽다·친근하다는 조용히 움직인다는 내용과 반대.","c":4},"h":"3ff7005208"},{"n":10,"t":"fill","q":"Because okapis live [A] and move silently, they were not [B] discovered until 1901.","ko":"오카피는 [A] 살고 조용히 움직이기 때문에 1901년이 되어서야 [B] 발견되었다.","bko":{"alone":"혼자","officially":"공식적으로","unusual":"특이한","soft":"부드러운","lightest":"가장 가벼운","deer":"사슴"},"bank":["alone","officially","unusual","soft","lightest","deer"],"r":{"a":"[A] alone, [B] officially","ev":"13~14번 문장","s":[[13,"They also live alone, move silently, and make sounds too low for humans to hear.","또한 혼자 살고, 조용히 움직이며, 사람이 듣기에는 너무 낮은 소리를 낸다."],[14,"Because of these secretive habits, okapis were not officially discovered until 1901.","이런 비밀스러운 습성 때문에 오카피는 1901년이 되어서야 공식적으로 발견되었다."]],"w":"13번 They also live alone(혼자 산다), 14번 not officially discovered until 1901(1901년에야 공식적으로 발견)에서 가져옴. unusual, soft, lightest는 형용사, deer는 명사라 [A](live 뒤 부사 자리)와 [B](not 뒤 부사 자리)에 맞지 않음.","c":null},"h":"49ecc6398d"}]},{"u":2,"id":"b1-02-1","no":1,"ko":"의자에 앉아서도 되는 요가?","items":[{"n":1,"t":"tf","q":"You should sit on a chair with your back straight and both feet flat on the floor.","ko":"등을 곧게 펴고 두 발을 바닥에 평평하게 둔 채 의자에 앉아야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Sit on a chair with your back straight and both feet flat on the floor.","등을 곧게 펴고 두 발을 바닥에 평평하게 둔 채 의자에 앉아라."]],"w":"3번 문장에 Sit on a chair with your back straight and both feet flat on the floor가 그대로 있어요. 등은 곧게, 발은 바닥에 평평하게 두는 자세와 일치해요.","c":"T"},"h":"d3743bc5eb"},{"n":2,"t":"tf","q":"In the Chair Raised Hands Pose, you lower your arms while you breathe in.","ko":"의자 팔 올리기 자세에서는 숨을 들이쉬면서 팔을 내린다.","r":{"a":"F (본문과 다른 내용)","ev":"10번, 12번 문장","s":[[10,"Sit tall and breathe in as you raise your arms.","몸을 곧게 펴고 앉아 팔을 올리면서 숨을 들이쉬어라."],[12,"Then, breathe out and lower your arms.","그다음, 숨을 내쉬며 팔을 내려라."]],"w":"숨을 들이쉴 때는 팔을 올리고(10번), 숨을 내쉴 때 팔을 내려요(12번). 들이쉬면서 내린다는 말은 반대예요.","c":"F"},"h":"1a41c186b6"},{"n":3,"t":"tf","q":"In the Chair Cat-Cow Stretch, you repeat the movements five times.","ko":"의자 고양이-소 스트레칭에서는 동작을 다섯 번 반복한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Repeat five times.","다섯 번 반복하라."]],"w":"9번 문장 Repeat five times가 소 자세와 고양이 자세 다음에 나와요. 다섯 번 반복한다는 내용과 일치해요.","c":"T"},"h":"8166b430de"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Chair yoga is an easy way to stretch your body with a chair.)","ko":"체어 요가는 의자를 이용해 몸을 쭉 늘리는 쉬운 방법이다. (stretch는 쭉 늘리다)","opts":["씻다","숨기다","쭉 늘리다","던지다"],"word":"stretch","r":{"a":"3) 쭉 늘리다","ev":"1번 문장","s":[[1,"Chair yoga is an easy way to stretch your body with a chair.","체어 요가는 의자를 이용해 몸을 쭉 늘리는 쉬운 방법이다."]],"w":"체어 요가는 의자에 앉아 몸을 늘려 주는 운동이에요. 그래서 stretch는 '(몸을) 쭉 늘리다'예요.","c":3},"h":"d8ac26138e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Breathe in and arch your back.)","ko":"숨을 들이쉬며 등을 활처럼 휘어라.","opts":["활처럼 휘다","둥글게 말다","끌어당기다","반복하다"],"word":"arch","r":{"a":"1) 활처럼 휘다","ev":"5번, 7번 문장","s":[[5,"Breathe in and arch your back.","숨을 들이쉬며 등을 활처럼 휘어라."],[7,"Then, breathe out and round your back.","그다음, 숨을 내쉬며 등을 둥글게 말아라."]],"w":"5번의 arch는 숨을 들이쉬며 등을 휘는 소 자세 동작이에요. 7번의 round(둥글게 말다)는 반대로 고양이 자세 동작이라 헷갈리지 않게 구분해요.","c":1},"h":"e339998e0b"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is the cow position.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 소 자세이다.","opts":["의자에 앉는 자세","숨을 들이쉬며 등을 활처럼 휘는 동작","숨을 내쉬며 등을 둥글게 마는 동작","다섯 번 반복하는 것"],"r":{"a":"2) 숨을 들이쉬며 등을 활처럼 휘는 동작","ev":"5~6번 문장","s":[[5,"Breathe in and arch your back.","숨을 들이쉬며 등을 활처럼 휘어라."],[6,"This is the cow position.","이것이 소 자세이다."]],"w":"This는 바로 앞 5번 문장의 동작(숨을 들이쉬며 등을 휘는 것)이에요. 숨을 내쉬며 등을 마는 동작은 7번이고 그건 고양이 자세예요.","c":2},"h":"3e823a8bb7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Pull your shoulders down as you stretch your arms toward the ceiling.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"팔을 천장 쪽으로 뻗으면서 어깨를 아래로 당겨라.","opts":["어깨를 위로 올리면서 팔을 바닥 쪽으로 내려라.","팔을 내리면서 어깨를 천장 쪽으로 뻗어라.","어깨를 앞으로 밀면서 팔을 가슴에 모아라.","팔을 천장 쪽으로 뻗으면서 어깨를 아래로 당겨라."],"r":{"a":"4) 팔을 천장 쪽으로 뻗으면서 어깨를 아래로 당겨라.","ev":"11번 문장","s":[[11,"Pull your shoulders down as you stretch your arms toward the ceiling.","팔을 천장 쪽으로 뻗으면서 어깨를 아래로 당겨라."]],"w":"pull your shoulders down은 어깨를 아래로 당기라는 뜻이고, stretch your arms toward the ceiling은 팔을 천장 쪽으로 뻗으라는 뜻이에요. 팔은 위로, 어깨는 아래로 가요.","c":4},"h":"3042433336"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["의자 요가는 바닥에 앉아서만 할 수 있다.","고양이 자세에서는 숨을 들이쉬며 등을 활처럼 휜다.","고양이 자세에서는 숨을 내쉬며 등을 둥글게 만다.","팔 올리기 자세에서는 팔을 아래로 뻗으며 어깨를 올린다."],"opts":["Chair yoga can only be done sitting on the floor.","In the cat position, you breathe in and arch your back.","In the cat position, you breathe out and round your back.","In the Raised Hands Pose, you stretch your arms down and lift your shoulders."],"r":{"a":"3) In the cat position, you breathe out and round your back.","ev":"7~8번 문장","s":[[7,"Then, breathe out and round your back.","그다음, 숨을 내쉬며 등을 둥글게 말아라."],[8,"This is the cat position.","이것이 고양이 자세이다."]],"w":"7~8번에서 숨을 내쉬며 등을 둥글게 마는 동작이 고양이 자세예요. 등을 활처럼 휘는 것은 소 자세(5~6번)이고, 체어 요가는 의자에 앉아서 해요(1번).","c":3},"h":"1a5117fe52"},{"n":9,"t":"sum","q":"By doing chair yoga every day, you can (A) better, (B) stress, and feel more relaxed.","ko":"체어 요가를 매일 하면 더 잘 (A)하고, 스트레스를 (B)하며, 더 편안함을 느낄 수 있다.","oko":["(A) 먹다 / (B) 줄이다","(A) 자다 / (B) 늘리다","(A) 걷다 / (B) 줄이다","(A) 자다 / (B) 줄이다","(A) 달리다 / (B) 만들다"],"opts":["(A) eat / (B) reduce","(A) sleep / (B) increase","(A) walk / (B) reduce","(A) sleep / (B) reduce","(A) run / (B) make"],"r":{"a":"4) (A) sleep / (B) reduce","ev":"14번 문장","s":[[14,"By doing these stretches every day, you can sleep better, reduce stress, and feel more relaxed.","이 스트레칭을 매일 하면, 잠을 더 잘 자고, 스트레스를 줄이고, 더 편안하게 느낄 수 있다."]],"w":"14번에서 매일 스트레칭을 하면 잠을 더 잘 자고(sleep better) 스트레스를 줄일 수 있다(reduce stress)고 해요.","c":4},"h":"ef9bbd0f47"},{"n":10,"t":"fill","q":"In the cow position, you [A] your back as you breathe in. In the cat position, you [B] your back as you breathe out.","ko":"소 자세에서는 숨을 들이쉬며 등을 [A]하고, 고양이 자세에서는 숨을 내쉬며 등을 [B]한다.","bank":["arch","round","raise","lower","pull","repeat"],"bko":{"arch":"활처럼 휘다","round":"둥글게 말다","raise":"올리다","lower":"내리다","pull":"당기다","repeat":"반복하다"},"r":{"a":"[A] arch, [B] round","ev":"5~8번 문장","s":[[5,"Breathe in and arch your back.","숨을 들이쉬며 등을 활처럼 휘어라."],[6,"This is the cow position.","이것이 소 자세이다."],[7,"Then, breathe out and round your back.","그다음, 숨을 내쉬며 등을 둥글게 말아라."],[8,"This is the cat position.","이것이 고양이 자세이다."]],"w":"5~6번에서 숨을 들이쉬며 등을 활처럼 휘는(arch) 것이 소 자세, 7~8번에서 숨을 내쉬며 등을 둥글게 마는(round) 것이 고양이 자세예요. raise·lower·pull은 팔과 어깨 동작에 나오는 말이에요.","c":null},"h":"4c00ce735c"}]},{"u":2,"id":"b1-02-2","no":2,"ko":"차만 타면 어지러운 진짜 이유는?","items":[{"n":1,"t":"tf","q":"Feeling dizzy and wanting to throw up is called motion sickness.","ko":"어지러움을 느끼고 토하고 싶어지는 것을 멀미라고 부른다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"They may feel dizzy and want to throw up.","그들은 어지러움을 느끼고 토하고 싶어질 수 있다."],[3,"This is called motion sickness.","이것은 멀미라고 불린다."]],"w":"2번에서 어지러움을 느끼고 토하고 싶어질 수 있다고 하고, 3번에서 이것을 멀미(motion sickness)라고 부른다고 해요.","c":"T"},"h":"757fbf753e"},{"n":2,"t":"tf","q":"Motion sickness happens when your eyes get mixed signals from your brain.","ko":"멀미는 눈이 뇌로부터 뒤섞인 신호를 받을 때 일어난다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It happens when your brain gets mixed signals from your body.","그것은 뇌가 몸으로부터 뒤섞인 신호를 받을 때 일어난다."]],"w":"4번 문장에서 뒤섞인 신호를 받는 쪽은 뇌(your brain)이고, 신호는 몸(your body)에서 와요. 눈과 뇌의 관계를 반대로 말했어요.","c":"F"},"h":"d1e993fa34"},{"n":3,"t":"tf","q":"Riding in a car, boat, or airplane can be uncomfortable for some people.","ko":"자동차, 배, 비행기를 타는 것은 어떤 사람들에게는 불편할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"For some people, riding in a car, boat, or airplane can be uncomfortable.","어떤 사람들에게는 자동차, 배, 또는 비행기를 타는 것이 불편할 수 있다."]],"w":"1번 문장 For some people, riding in a car, boat, or airplane can be uncomfortable과 같은 내용이에요.","c":"T"},"h":"5b9b4dafd1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They may feel dizzy and want to throw up.)","ko":"그들은 어지러움을 느끼고 토하고 싶어질 수 있다. (dizzy는 어지러운)","opts":["어지러운","졸린","배고픈","화난"],"word":"dizzy","r":{"a":"1) 어지러운","ev":"2번 문장","s":[[2,"They may feel dizzy and want to throw up.","그들은 어지러움을 느끼고 토하고 싶어질 수 있다."]],"w":"탈것을 타고 불편한 사람들의 증상이에요. 토하고 싶다는 말과 이어지니 dizzy는 '어지러운'이에요.","c":1},"h":"be24071eb0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Your eyes see something still, but your body can feel movement.)","ko":"당신의 눈은 가만히 있는 무언가를 보지만, 당신의 몸은 움직임을 느낄 수 있다.","opts":["아직도","가만히 있는","빠르게 움직이는","아주 큰"],"word":"still","r":{"a":"2) 가만히 있는","ev":"6번 문장","s":[[6,"Your eyes see something still, but your body can feel movement.","당신의 눈은 가만히 있는 무언가를 보지만, 당신의 몸은 움직임을 느낄 수 있다."]],"w":"but 뒤에서 몸은 움직임(movement)을 느낀다고 해요. 그러니 눈이 보는 것은 반대로 움직이지 않는 것이에요. 여기서 still은 '아직도'가 아니라 '가만히 있는'이에요.","c":2},"h":"70f07dea61"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis helps your brain understand that you are moving.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 뇌가 당신이 움직이고 있다는 것을 이해하도록 도와준다.","opts":["멀미가 나기 시작하는 것","물을 마시는 것","창밖을 바라보는 것","화면을 계속 보는 것"],"r":{"a":"3) 창밖을 바라보는 것","ev":"8~9번 문장","s":[[8,"If you start to feel motion sickness, try looking out the window.","멀미가 나기 시작하면, 창밖을 바라보도록 해 보라."],[9,"This helps your brain understand that you are moving.","이것은 뇌가 당신이 움직이고 있다는 것을 이해하도록 도와준다."]],"w":"8번에서 멀미가 나기 시작하면 창밖을 바라보라고 해요. 9번의 This는 그 행동이고, 그러면 뇌가 움직이는 중이라는 것을 이해해요.","c":3},"h":"61daba4b7a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This can confuse your brain and make you feel unwell.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 뇌를 혼란스럽게 하고 당신이 몸이 안 좋다고 느끼게 만들 수 있다.","opts":["이것은 뇌를 쉬게 하고 몸을 건강하게 만들어 줄 수 있다.","이것은 눈을 아프게 해서 책을 못 읽게 만들 수 있다.","이것은 뇌가 신호를 더 빨리 받게 도와줄 수 있다.","이것은 뇌를 헷갈리게 하고 몸이 안 좋게 느껴지게 할 수 있다."],"r":{"a":"4) 이것은 뇌를 헷갈리게 하고 몸이 안 좋게 느껴지게 할 수 있다.","ev":"7번 문장","s":[[7,"This can confuse your brain and make you feel unwell.","이것은 뇌를 혼란스럽게 하고 당신이 몸이 안 좋다고 느끼게 만들 수 있다."]],"w":"confuse는 혼란스럽게 하다, feel unwell은 몸이 안 좋다고 느끼다예요. 뇌가 혼란스러워지고 몸이 안 좋아진다는 뜻이에요.","c":4},"h":"c0e75d21c1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["물을 마시고 맑은 공기를 쐬면 기분이 나아지는 데 도움이 될 수 있다.","멀미는 비행기에서만 생긴다.","이동 중에 책을 읽으면 뇌가 쉬게 된다.","창밖을 보면 뇌가 더 혼란스러워진다."],"opts":["Drinking water and getting fresh air can help you feel better.","Motion sickness only happens on airplanes.","Reading a book while traveling helps your brain relax.","Looking out the window makes your brain more confused."],"r":{"a":"1) Drinking water and getting fresh air can help you feel better.","ev":"1번, 8~10번 문장","s":[[1,"For some people, riding in a car, boat, or airplane can be uncomfortable.","어떤 사람들에게는 자동차, 배, 또는 비행기를 타는 것이 불편할 수 있다."],[8,"If you start to feel motion sickness, try looking out the window.","멀미가 나기 시작하면, 창밖을 바라보도록 해 보라."],[9,"This helps your brain understand that you are moving.","이것은 뇌가 당신이 움직이고 있다는 것을 이해하도록 도와준다."],[10,"Drinking water and getting fresh air can also help you feel better.","물을 마시고 맑은 공기를 쐬는 것도 기분이 나아지도록 도와줄 수 있다."]],"w":"10번에 물을 마시고 맑은 공기를 쐬면 도움이 된다고 나와요. 멀미는 자동차·배·비행기에서 생길 수 있고(1번), 창밖을 보면 뇌가 움직임을 이해해요(8~9번).","c":1},"h":"dcf7f433a6"},{"n":9,"t":"sum","q":"When your brain gets mixed (A) from your body, it becomes (B) and you can feel unwell.","ko":"뇌가 몸으로부터 뒤섞인 (A)를 받으면, 뇌는 (B)해지고 몸이 안 좋다고 느낄 수 있다.","oko":["(A) 책 / (B) 행복한","(A) 신호 / (B) 편안한","(A) 물 / (B) 혼란스러운","(A) 창문 / (B) 가만히 있는","(A) 신호 / (B) 혼란스러운"],"opts":["(A) books / (B) happy","(A) signals / (B) relaxed","(A) water / (B) confused","(A) windows / (B) still","(A) signals / (B) confused"],"r":{"a":"5) (A) signals / (B) confused","ev":"4번, 7번 문장","s":[[4,"It happens when your brain gets mixed signals from your body.","그것은 뇌가 몸으로부터 뒤섞인 신호를 받을 때 일어난다."],[7,"This can confuse your brain and make you feel unwell.","이것은 뇌를 혼란스럽게 하고 당신이 몸이 안 좋다고 느끼게 만들 수 있다."]],"w":"4번에서 뇌가 몸으로부터 뒤섞인 신호(mixed signals)를 받을 때 멀미가 일어난다고 해요. 7번에서 이것이 뇌를 혼란스럽게 하고(confuse) 몸이 안 좋게 만든다고 해요.","c":5},"h":"e8f4743e03"},{"n":10,"t":"fill","q":"Your eyes see something [A], but your body can feel [B].","ko":"당신의 눈은 [A] 있는 무언가를 보지만, 당신의 몸은 [B]을 느낄 수 있다.","bank":["still","movement","moving","signals","window","water"],"bko":{"still":"가만히 있는","movement":"움직임","moving":"움직이는","signals":"신호","window":"창문","water":"물"},"r":{"a":"[A] still, [B] movement","ev":"6번 문장","s":[[6,"Your eyes see something still, but your body can feel movement.","당신의 눈은 가만히 있는 무언가를 보지만, 당신의 몸은 움직임을 느낄 수 있다."]],"w":"6번 문장 그대로예요. 눈은 가만히 있는(still) 것을 보고 몸은 움직임(movement)을 느껴요. moving은 '움직이는'이라 눈이 보는 것과 반대가 되어 틀려요.","c":null},"h":"41b0b2b5c9"}]},{"u":2,"id":"b1-02-3","no":3,"ko":"코가 막히면 음식이 왜 밍밍할까?","items":[{"n":1,"t":"tf","q":"Your tongue has tiny sensors that help you notice different tastes.","ko":"혀에는 서로 다른 맛을 알아차리도록 돕는 작은 감지기가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Your tongue has tiny sensors that help you notice different tastes.","혀에는 서로 다른 맛을 알아차리도록 돕는 작은 감지기가 있다."]],"w":"3번 문장에 tiny sensors가 그대로 나와요. 혀의 작은 감지기가 서로 다른 맛을 알아차리게 돕는다는 내용과 일치해요.","c":"T"},"h":"ea05e0446e"},{"n":2,"t":"tf","q":"Your tongue plays an important role in tasting food, but your nose does not.","ko":"혀는 음식의 맛을 느끼는 데 중요한 역할을 하지만, 코는 그렇지 않다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"That’s because your nose plays an important role in tasting food.","그것은 코가 음식의 맛을 느끼는 데 중요한 역할을 하기 때문이다."]],"w":"2번 문장에서 중요한 역할을 한다고 한 것은 코(your nose)예요. 코는 역할이 없다는 말은 본문과 달라요.","c":"F"},"h":"954659cc62"},{"n":3,"t":"tf","q":"If you hold your nose, an apple and an onion can taste almost the same.","ko":"코를 잡으면, 사과와 양파가 거의 같은 맛이 날 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~12번 문장","s":[[10,"Close your eyes and hold your nose.","눈을 감고 코를 잡아라."],[11,"Eat a small piece of an apple, then an onion.","사과 한 조각을 먹고, 그다음 양파를 먹어 보아라."],[12,"Without your sense of smell, they can taste almost the same!","후각이 없으면, 그것들은 거의 같은 맛이 날 수 있다!"]],"w":"10번에서 코를 잡고, 11번에서 사과와 양파를 먹으면, 12번에서 후각이 없어서 둘이 거의 같은 맛이 날 수 있다고 해요.","c":"T"},"h":"dac9945ef7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When you have a cold and your nose is blocked, food often tastes plain.)","ko":"코감기에 걸려 코가 막히면, 음식이 흔히 밍밍한 맛이 난다. (plain은 밍밍한)","opts":["매운","밍밍한","달콤한","신선한"],"word":"plain","r":{"a":"2) 밍밍한","ev":"1~2번 문장","s":[[1,"When you have a cold and your nose is blocked, food often tastes plain.","코감기에 걸려 코가 막히면, 음식이 흔히 밍밍한 맛이 난다."],[2,"That’s because your nose plays an important role in tasting food.","그것은 코가 음식의 맛을 느끼는 데 중요한 역할을 하기 때문이다."]],"w":"코가 막히면 냄새 신호가 없어서 맛이 약하게 느껴져요. 그래서 plain은 '밍밍한, 아무 맛이 안 나는'이에요.","c":2},"h":"20e171c318"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Your brain combines these two signals to help you enjoy the full flavor.)","ko":"뇌는 이 두 신호를 합쳐서 당신이 온전한 풍미를 즐기도록 돕는다.","opts":["나누다","숨기다","합치다","바꾸다"],"word":"combines","r":{"a":"3) 합치다","ev":"7번 문장","s":[[7,"Your brain combines these two signals to help you enjoy the full flavor.","뇌는 이 두 신호를 합쳐서 당신이 온전한 풍미를 즐기도록 돕는다."]],"w":"뇌가 코의 냄새 신호와 혀의 맛 신호 두 가지를 하나로 합쳐 온전한 풍미를 만들어요. combine = 합치다.","c":3},"h":"c2ee4f5846"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut taste alone does not allow you to experience full flavor because much of it comes from smell.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만 맛만으로는 온전한 풍미를 경험할 수 없는데, 풍미의 많은 부분이 냄새에서 오기 때문이다.","opts":["혀가 느끼는 맛","온전한 풍미","음식의 모양","사과와 양파"],"r":{"a":"2) 온전한 풍미","ev":"5번 문장","s":[[5,"But taste alone does not allow you to experience full flavor because much of it comes from smell.","하지만 맛만으로는 온전한 풍미를 경험할 수 없는데, 풍미의 많은 부분이 냄새에서 오기 때문이다."]],"w":"much of it comes from smell은 '그것의 많은 부분이 냄새에서 온다'는 말이에요. 앞에 나온 full flavor(온전한 풍미)를 받아요.","c":2},"h":"f3c180563c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without your sense of smell, they can taste almost the same!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"후각이 없으면, 그것들은 거의 같은 맛이 날 수 있다!","opts":["후각이 없으면 그것들은 전혀 맛이 나지 않는다.","후각이 없으면 그것들은 아주 다른 맛이 난다.","냄새를 더 잘 맡으면 맛을 느끼지 못할 수 있다.","후각이 없으면 그것들은 거의 비슷한 맛이 날 수 있다."],"r":{"a":"4) 후각이 없으면 그것들은 거의 비슷한 맛이 날 수 있다.","ev":"12번 문장","s":[[12,"Without your sense of smell, they can taste almost the same!","후각이 없으면, 그것들은 거의 같은 맛이 날 수 있다!"]],"w":"without your sense of smell은 후각이 없으면이고, taste almost the same은 거의 같은 맛이 난다예요. 맛이 아예 없어지는 것은 아니에요.","c":4},"h":"938c1348ba"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["음식의 냄새는 코로 이동해 혀와 함께 작용한다.","혀는 한 가지 맛만 알아차릴 수 있다.","냄새는 음식의 풍미와 아무 상관이 없다.","음식의 냄새는 귀로 이동해 뇌에 전달된다."],"opts":["The smell of food travels to the nose and works together with the tongue.","The tongue can notice only one taste.","Smell has nothing to do with the flavor of food.","The smell of food travels to the ears and then to the brain."],"r":{"a":"1) The smell of food travels to the nose and works together with the tongue.","ev":"6번 문장","s":[[6,"When you eat, the smell of the food travels to your nose and works together with your tongue.","음식을 먹을 때, 음식의 냄새가 코로 이동해 혀와 함께 작용한다."]],"w":"6번에서 음식의 냄새가 코로 이동해 혀와 함께 작용한다고 해요. 혀는 서로 다른 맛을 알아차리고(3번), 풍미의 많은 부분이 냄새에서 와요(5번).","c":1},"h":"8f1f16838a"},{"n":9,"t":"sum","q":"Your brain (A) the signals from your tongue and nose, so food seems (B) when your nose is blocked.","ko":"뇌는 혀와 코의 신호를 (A)하기 때문에, 코가 막히면 음식이 (B) 것처럼 느껴진다.","oko":["(A) 나눈다 / (B) 맛있는","(A) 숨긴다 / (B) 맛이 없는","(A) 합친다 / (B) 매운","(A) 막는다 / (B) 신선한","(A) 합친다 / (B) 맛이 없는"],"opts":["(A) divides / (B) delicious","(A) hides / (B) tasteless","(A) combines / (B) spicy","(A) blocks / (B) fresh","(A) combines / (B) tasteless"],"r":{"a":"5) (A) combines / (B) tasteless","ev":"7~8번 문장","s":[[7,"Your brain combines these two signals to help you enjoy the full flavor.","뇌는 이 두 신호를 합쳐서 당신이 온전한 풍미를 즐기도록 돕는다."],[8,"That’s why food seems tasteless when your nose is blocked.","그래서 코가 막히면 음식이 아무 맛이 없는 것처럼 느껴진다."]],"w":"7번에서 뇌가 두 신호를 합치고(combines), 8번에서 그래서 코가 막히면 음식이 맛이 없는 것처럼(tasteless) 느껴진다고 해요.","c":5},"h":"d1ff3e0c39"},{"n":10,"t":"fill","q":"[A] alone does not allow you to experience full flavor because much of it comes from [B].","ko":"[A]만으로는 온전한 풍미를 경험할 수 없는데, 풍미의 많은 부분이 [B]에서 오기 때문이다.","bank":["taste","smell","onion","brain","flavor","signals"],"bko":{"taste":"맛","smell":"냄새","brain":"뇌","flavor":"풍미","signals":"신호","onion":"양파"},"r":{"a":"[A] taste, [B] smell","ev":"5번 문장","s":[[5,"But taste alone does not allow you to experience full flavor because much of it comes from smell.","하지만 맛만으로는 온전한 풍미를 경험할 수 없는데, 풍미의 많은 부분이 냄새에서 오기 때문이다."]],"w":"5번 문장 그대로예요. 혀의 맛(taste)만으로는 온전한 풍미를 경험할 수 없고, 풍미의 많은 부분이 냄새(smell)에서 와요.","c":null},"h":"1993e4ee6d"}]},{"u":2,"id":"b1-02-4","no":4,"ko":"똑같아 보이는 눈물, 사실은 세 종류?","items":[{"n":1,"t":"tf","q":"Basal tears are always in your eyes to keep them wet and clean.","ko":"기초 눈물은 눈을 촉촉하고 깨끗하게 유지하기 위해 항상 눈에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They are always there to keep your eyes wet and clean.","그것들은 눈을 촉촉하고 깨끗하게 유지하기 위해 항상 그곳에 있다."]],"w":"4번 문장에 They are always there to keep your eyes wet and clean이 그대로 있어요. 기초 눈물은 항상 눈을 촉촉하고 깨끗하게 지켜 줘요.","c":"T"},"h":"8b510a0b19"},{"n":2,"t":"tf","q":"Reflex tears appear when you feel strong emotions.","ko":"반사 눈물은 강한 감정을 느낄 때 나타난다.","r":{"a":"F (본문과 다른 내용)","ev":"8번, 10번 문장","s":[[8,"They come out of your eyes when something bothers your eyes, like smoke or onions.","그것들은 연기나 양파처럼 무언가가 눈을 괴롭힐 때 눈에서 나온다."],[10,"Emotional tears appear when you feel strong emotions.","감정 눈물은 당신이 강한 감정을 느낄 때 나타난다."]],"w":"강한 감정을 느낄 때 나오는 것은 감정 눈물(10번)이에요. 반사 눈물은 연기나 양파처럼 눈을 괴롭히는 것이 있을 때 나와요(8번).","c":"F"},"h":"1ee073435b"},{"n":3,"t":"tf","q":"Emotional tears can help you reduce stress.","ko":"감정 눈물은 스트레스를 줄이는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"These tears can help reduce stress and make you feel better.","이 눈물들은 스트레스를 줄이고 기분이 나아지게 도와줄 수 있다."]],"w":"12번 문장에서 These tears(감정 눈물)가 스트레스를 줄이고 기분이 나아지게 도와줄 수 있다고 해요.","c":"T"},"h":"805482c6a8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These tears act like a shield. They block dirt and dust.)","ko":"이 눈물들은 방패처럼 작용한다. 그것들은 먼지와 티끌을 막는다.","opts":["방패","거울","우산","지도"],"word":"shield","r":{"a":"1) 방패","ev":"5~6번 문장","s":[[5,"These tears act like a shield.","이 눈물들은 방패처럼 작용한다."],[6,"They block dirt and dust.","그것들은 먼지와 티끌을 막는다."]],"w":"먼지와 티끌을 막는다는 6번 문장과 이어져요. 눈을 지켜 주는 방패처럼 작용한다는 뜻이라 shield = 방패예요.","c":1},"h":"bc9c6365f6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They come out of your eyes when something bothers your eyes, like smoke or onions.)","ko":"그것들은 연기나 양파처럼 무언가가 눈을 괴롭힐 때 눈에서 나온다.","opts":["도와주다","괴롭히다","웃게 하다","닮다"],"word":"bothers","r":{"a":"2) 괴롭히다","ev":"8번 문장","s":[[8,"They come out of your eyes when something bothers your eyes, like smoke or onions.","그것들은 연기나 양파처럼 무언가가 눈을 괴롭힐 때 눈에서 나온다."]],"w":"연기나 양파는 눈을 따갑게 하는 것들이에요. 그래서 눈을 괴롭히는 것이 있을 때 반사 눈물이 나와요. bother = 괴롭히다.","c":2},"h":"951ad5b41c"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey wash away harmful things and help fight bacteria.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 해로운 것들을 씻어 내고 세균과 싸우는 것을 돕는다.","opts":["기초 눈물","감정 눈물","반사 눈물","연기와 양파"],"r":{"a":"3) 반사 눈물","ev":"8~9번 문장","s":[[8,"They come out of your eyes when something bothers your eyes, like smoke or onions.","그것들은 연기나 양파처럼 무언가가 눈을 괴롭힐 때 눈에서 나온다."],[9,"They wash away harmful things and help fight bacteria.","그것들은 해로운 것들을 씻어 내고 세균과 싸우는 것을 돕는다."]],"w":"8번에서 연기나 양파 같은 것이 눈을 괴롭힐 때 나오는 눈물(반사 눈물)을 They로 받았어요. 9번의 They도 같은 반사 눈물이에요.","c":3},"h":"f81734f81e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Each type of tear does something different, but together they help keep you healthy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"각각의 눈물 종류는 서로 다른 일을 하지만, 함께 당신의 건강을 지켜 준다.","opts":["모든 눈물은 같은 일을 하며 따로 있을 때 건강에 좋다.","눈물의 종류는 달라도 하는 일은 모두 같다.","한 가지 종류의 눈물만 건강을 지켜 준다.","눈물마다 하는 일은 다르지만, 함께 건강을 지켜 준다."],"r":{"a":"4) 눈물마다 하는 일은 다르지만, 함께 건강을 지켜 준다.","ev":"13번 문장","s":[[13,"Each type of tear does something different, but together they help keep you healthy.","각각의 눈물 종류는 서로 다른 일을 하지만, 함께 당신의 건강을 지켜 준다."]],"w":"does something different는 서로 다른 일을 한다는 뜻이고, together they help keep you healthy는 함께 건강을 지켜 준다는 뜻이에요.","c":4},"h":"5af3086727"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["기초 눈물은 방패처럼 먼지와 티끌을 막는다.","반사 눈물은 행복할 때만 나타난다.","감정 눈물은 연기가 눈에 들어갈 때 나온다.","기초 눈물은 양파를 썰 때만 나타난다."],"opts":["Basal tears block dirt and dust like a shield.","Reflex tears appear only when you feel happy.","Emotional tears come out when smoke gets in your eyes.","Basal tears appear only when you cut onions."],"r":{"a":"1) Basal tears block dirt and dust like a shield.","ev":"5~6번 문장","s":[[5,"These tears act like a shield.","이 눈물들은 방패처럼 작용한다."],[6,"They block dirt and dust.","그것들은 먼지와 티끌을 막는다."]],"w":"5~6번에서 기초 눈물이 방패처럼 먼지와 티끌을 막는다고 해요. 연기·양파는 반사 눈물(8번), 행복·슬픔 같은 감정은 감정 눈물(10~11번)이에요.","c":1},"h":"f8e5cd3ff2"},{"n":9,"t":"sum","q":"Reflex tears come out when something (A) your eyes, and they (B) away harmful things.","ko":"반사 눈물은 무언가가 눈을 (A)할 때 나오고, 해로운 것들을 (B).","oko":["(A) 도와줄 / (B) 숨긴다","(A) 씻어 줄 / (B) 가져온다","(A) 보호할 / (B) 모은다","(A) 괴롭힐 / (B) 키운다","(A) 괴롭힐 / (B) 씻어 낸다"],"opts":["(A) helps / (B) hide","(A) cleans / (B) bring","(A) protects / (B) collect","(A) bothers / (B) grow","(A) bothers / (B) wash"],"r":{"a":"5) (A) bothers / (B) wash","ev":"8~9번 문장","s":[[8,"They come out of your eyes when something bothers your eyes, like smoke or onions.","그것들은 연기나 양파처럼 무언가가 눈을 괴롭힐 때 눈에서 나온다."],[9,"They wash away harmful things and help fight bacteria.","그것들은 해로운 것들을 씻어 내고 세균과 싸우는 것을 돕는다."]],"w":"8번에서 무언가가 눈을 괴롭힐 때(bothers) 반사 눈물이 나오고, 9번에서 해로운 것들을 씻어 낸다(wash away)고 해요.","c":5},"h":"5af9edd78a"},{"n":10,"t":"fill","q":"Emotional tears appear when you feel strong [A], and they can help reduce [B].","ko":"감정 눈물은 강한 [A]을 느낄 때 나타나고, [B]를 줄이는 데 도움이 될 수 있다.","bank":["emotions","stress","bacteria","dirt","shield","healthy"],"bko":{"emotions":"감정","stress":"스트레스","bacteria":"세균","dirt":"먼지","shield":"방패","healthy":"건강한"},"r":{"a":"[A] emotions, [B] stress","ev":"10번, 12번 문장","s":[[10,"Emotional tears appear when you feel strong emotions.","감정 눈물은 당신이 강한 감정을 느낄 때 나타난다."],[12,"These tears can help reduce stress and make you feel better.","이 눈물들은 스트레스를 줄이고 기분이 나아지게 도와줄 수 있다."]],"w":"10번에서 감정 눈물은 강한 감정(emotions)을 느낄 때 나타나고, 12번에서 스트레스(stress)를 줄이는 데 도움이 된다고 해요. bacteria와 dirt는 반사·기초 눈물과 관련된 말이에요.","c":null},"h":"65a353e081"}]},{"u":3,"id":"b1-03-1","no":1,"ko":"한 번 먹으면 또 먹고 싶은 간식, 스모어","items":[{"n":1,"t":"tf","q":"The family sat around the campfire.","ko":"가족은 모닥불 주위에 앉았다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"We sat around the campfire, and my sister said, “We’re making s’mores!”","우리는 모닥불 주위에 앉았고, 내 여자 형제가 \"우리 스모어 만들 거야!\"라고 말했다."]],"w":"2번 문장에 We sat around the campfire가 그대로 나와요. 모닥불 주위에 앉았다는 내용과 일치해요.","c":"T"},"h":"3efd094d7f"},{"n":2,"t":"tf","q":"The writer had made s'mores many times before.","ko":"글쓴이는 전에 스모어를 여러 번 만들어 본 적이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"I had never made one before, so I watched her do it first.","나는 전에 스모어를 한 번도 만들어 본 적이 없어서, 그녀가 하는 것을 먼저 지켜보았다."]],"w":"3번 문장은 I had never made one before(전에 한 번도 만들어 본 적이 없다)예요. 그래서 먼저 여자 형제가 하는 것을 지켜봤어요.","c":"F"},"h":"d70f2e871f"},{"n":3,"t":"tf","q":"The word \"s'more\" comes from \"some more.\"","ko":"\"s'more\"라는 단어는 \"some more\"에서 나왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"My sister said that the word “s’more” comes from “some more.”","내 여자 형제는 \"s'more\"라는 단어가 \"some more\"에서 나왔다고 말했다."]],"w":"8번 문장에서 여자 형제가 the word s'more comes from some more(s'more라는 단어는 some more에서 나왔다)라고 말해요.","c":"T"},"h":"abc7685380"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The warm marshmallow and melted chocolate were sweet and gooey.)","ko":"따뜻한 마시멜로와 녹은 초콜릿은 달콤하고 끈적했다.","opts":["얼어붙은","차가운","녹은","부서진"],"word":"melted","r":{"a":"3) 녹은","ev":"7번 문장","s":[[7,"The warm marshmallow and melted chocolate were sweet and gooey.","따뜻한 마시멜로와 녹은 초콜릿은 달콤하고 끈적했다."]],"w":"마시멜로는 따뜻했고 초콜릿은 불의 열로 흐물흐물해졌어요. 그래서 끈적하다(gooey)고 했어요. melted는 melt(녹다)에서 온 말로, 녹은이에요.","c":3},"h":"8fd1158247"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the treat is so delicious that people always want more.)","ko":"그 간식은 너무 맛있어서 사람들이 항상 더 원한다.","opts":["지루한","맛있는","짠","무거운"],"word":"delicious","r":{"a":"2) 맛있는","ev":"9번 문장","s":[[9,"This is because the treat is so delicious that people always want more.","이는 그 간식이 너무 맛있어서 사람들이 항상 더 원하기 때문이다."]],"w":"사람들이 항상 더 원할 만큼 좋은 맛이라는 말이에요. 그래서 delicious는 맛있는이에요.","c":2},"h":"4a78d5caa9"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThen she placed it on a graham cracker.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그런 다음 그녀는 그것을 그레이엄 크래커 위에 올려놓았다.","opts":["모닥불","막대","구운 마시멜로","초콜릿"],"r":{"a":"3) 구운 마시멜로","ev":"4~5번 문장","s":[[4,"She put a marshmallow on her stick and roasted it over the fire.","그녀는 마시멜로를 막대에 올려 불 위에서 구웠다."],[5,"Then she placed it on a graham cracker.","그런 다음 그녀는 그것을 그레이엄 크래커 위에 올려놓았다."]],"w":"4번에서 마시멜로를 막대에 올려 구웠고, 5번에서 그 구운 마시멜로를 크래커 위에 올려요. 초콜릿은 6번에서야 더해져요.","c":3},"h":"4ede1fd03f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is because the treat is so delicious that people always want more.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 그 간식이 너무 맛있어서 사람들이 항상 더 원하기 때문이다.","opts":["그 간식이 아주 맛있어서 사람들이 늘 더 먹고 싶어 한다.","그 간식이 너무 달아서 사람들이 한 입만 먹는다.","사람들이 많이 먹어서 그 간식이 맛있어졌다.","그 간식이 너무 맛이 없어서 사람들이 더 만들지 않는다."],"r":{"a":"1) 그 간식이 아주 맛있어서 사람들이 늘 더 먹고 싶어 한다.","ev":"9번 문장","s":[[9,"This is because the treat is so delicious that people always want more.","이는 그 간식이 너무 맛있어서 사람들이 항상 더 원하기 때문이다."]],"w":"so ~ that …은 너무 ~해서 …한다는 뜻이에요. 너무 맛있어서 사람들이 더 원한다는 내용이 첫 번째 선지예요.","c":1},"h":"6f531c6a79"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["글쓴이는 전에 스모어를 여러 번 만들어 보았다.","먹고 나서 글쓴이는 곧바로 하나 더 먹고 싶었다.","여자 형제는 초콜릿을 막대에 올려 구웠다.","가족은 지난달에 캠핑을 갔다."],"opts":["The writer had made s'mores many times before.","After eating one, the writer wanted another right away.","The sister put chocolate on a stick and roasted it.","The family went camping last month."],"r":{"a":"2) After eating one, the writer wanted another right away.","ev":"3, 11번 문장","s":[[3,"I had never made one before, so I watched her do it first.","나는 전에 스모어를 한 번도 만들어 본 적이 없어서, 그녀가 하는 것을 먼저 지켜보았다."],[11,"After I ate mine, I wanted another one right away.","내 것을 먹고 나서, 나는 곧바로 하나 더 먹고 싶었다."]],"w":"11번 문장에서 먹고 나서 곧바로 하나 더 원했다고 해요. 3번에서 전에 만들어 본 적이 없었고, 4번에서 막대에 올려 구운 건 마시멜로이며, 1번에서 캠핑은 지난 주말이었어요.","c":2},"h":"83d18e27fa"},{"n":9,"t":"sum","q":"The s'more was so (A) that the writer wanted (B) one right away.","ko":"스모어는 너무 (A)해서 글쓴이는 곧바로 (B) 하나를 원했다.","oko":["(A) 쓴 / (B) 또 다른","(A) 맛있는 / (B) 아무","(A) 차가운 / (B) 첫 번째","(A) 무거운 / (B) 더 적은","(A) 맛있는 / (B) 또 다른"],"opts":["(A) bitter / (B) another","(A) delicious / (B) any","(A) cold / (B) the first","(A) heavy / (B) fewer","(A) delicious / (B) another"],"r":{"a":"5) (A) delicious / (B) another","ev":"9, 11번 문장","s":[[9,"This is because the treat is so delicious that people always want more.","이는 그 간식이 너무 맛있어서 사람들이 항상 더 원하기 때문이다."],[11,"After I ate mine, I wanted another one right away.","내 것을 먹고 나서, 나는 곧바로 하나 더 먹고 싶었다."]],"w":"9번에서 간식이 너무 맛있어서(delicious) 사람들이 더 원한다고 했고, 11번에서 글쓴이도 하나 더(another one) 원했어요.","c":5},"h":"bc4ab45d1e"},{"n":10,"t":"fill","q":"My sister [A] a marshmallow over the fire and added [B] before putting on another cracker.","ko":"내 여자 형제는 불 위에서 마시멜로를 [A]하고 다른 크래커를 올리기 전에 [B]을 더했다.","bank":["roasted","chocolate","delicious","another","watched","campfire"],"bko":{"roasted":"구웠다","chocolate":"초콜릿","delicious":"맛있는","another":"또 다른","watched":"지켜보았다","campfire":"모닥불"},"r":{"a":"[A] roasted, [B] chocolate","ev":"4~6번 문장","s":[[4,"She put a marshmallow on her stick and roasted it over the fire.","그녀는 마시멜로를 막대에 올려 불 위에서 구웠다."],[5,"Then she placed it on a graham cracker.","그런 다음 그녀는 그것을 그레이엄 크래커 위에 올려놓았다."],[6,"She added a piece of chocolate and put another cracker on top.","그녀는 초콜릿 한 조각을 더하고 그 위에 크래커 하나를 더 올렸다."]],"w":"4번에서 마시멜로를 불 위에서 구웠고(roasted), 6번에서 초콜릿(chocolate)을 더한 뒤 크래커를 올려요. watched는 글쓴이가 한 행동이라 여자 형제와 맞지 않아요.","c":null},"h":"60d055b9c7"}]},{"u":3,"id":"b1-03-2","no":2,"ko":"타이어 회사가 만든 맛집 안내서의 시작","items":[{"n":1,"t":"tf","q":"The Michelin brothers made the guide to make people want to drive more.","ko":"미쉐린 형제는 사람들이 더 많이 운전하고 싶게 하려고 안내서를 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"So they made a free guide to make people want to drive more.","그래서 그들은 사람들이 더 많이 운전하고 싶어지게 하려고 무료 안내서를 만들었다."]],"w":"4번 문장에 a free guide to make people want to drive more가 그대로 나와요.","c":"T"},"h":"05a412f691"},{"n":2,"t":"tf","q":"André decided to stop making the guide after he saw it under a table leg.","ko":"앙드레는 탁자 다리 밑에 있는 안내서를 본 뒤 안내서 만들기를 그만두기로 했다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"André realized that people didn’t care about free things.","앙드레는 사람들이 무료인 것들을 중요하게 여기지 않는다는 것을 깨달았다."],[9,"He decided to make the guide better and try to sell it.","그는 안내서를 더 좋게 만들어 팔아 보기로 결심했다."]],"w":"8~9번에서 앙드레는 무료인 것을 사람들이 소중히 여기지 않는다는 걸 깨닫고, 안내서를 더 좋게 만들어 팔기로 했어요. 그만두기로 한 게 아니에요.","c":"F"},"h":"7f445ab068"},{"n":3,"t":"tf","q":"In 1926, the guide added a star system to rate restaurants.","ko":"1926년에 그 안내서는 식당을 평가하는 별점 제도를 추가했다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"In 1926, the guide added a star system to rate restaurants.","1926년에 그 안내서는 식당을 평가하는 별점 제도를 추가했다."]],"w":"11번 문장과 같은 내용이에요. 1926년에 식당을 평가하는 별점 제도가 추가되었어요.","c":"T"},"h":"100b265fe8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 1900, André and Édouard Michelin owned a tire company in France.)","ko":"1900년에 앙드레와 에두아르 미쉐린은 프 gans.","The mixture is put into a pig's stomach.","Hunters used an animal's stomach because they had no pots or pans.","In the past, people could keep meat for a long time."],"r":{"a":"3) Hunters used an animal's stomach because they had no pots or pans.","ev":"11번 문장","s":[[11,"Since they had no pots or pans on hand, they used the animal’s stomach to cook the mixture.","손에 냄비나 팬이 없었기 때문에, 그들은 동물의 위를 이용해 그 혼합물을 요리했다."]],"w":"11번 문장과 같아요. 5번에서 해기스는 내장으로 만들고, 6번에서 양의 위에 넣으며, 8번에서 옛날 사람들은 고기를 오래 보관할 수 없었어요.","c":3},"h":"8f5ab207e6"},{"n":9,"t":"sum","q":"In the past, organs (A) very fast, so hunters cooked them in an animal's (B).","ko":"옛날에는 내장이 매우 빨리 (A) 사냥꾼들은 동물의 (B) 안에서 그것들을 요리했다.","oko":["(A) 자랐다 / (B) 냄비","(A) 상했다 / (B) 위","(A) 말랐다 / (B) 팬","(A) 상했다 / (B) 냄비","(A) 얼었다 / (B) 위"],"opts":["(A) grew / (B) pot","(A) spoiled / (B) stomach","(A) dried / (B) pan","(A) spoiled / (B) pot","(A) froze / (B) stomach"],"r":{"a":"2) (A) spoiled / (B) stomach","ev":"9, 11번 문장","s":[[9,"Organs spoiled very fast.","내장은 매우 빨리 상했다."],[11,"Since they had no pots or pans on hand, they used the animal’s stomach to cook the mixture.","손에 냄비나 팬이 없었기 때문에, 그들은 동물의 위를 이용해 그 혼합물을 요리했다."]],"w":"9번에서 내장이 빨리 상했고(spoiled), 11번에서 냄비나 팬이 없어 동물의 위(stomach)를 이용해 요리했어요.","c":2},"h":"6f4a849902"},{"n":10,"t":"fill","q":"Haggis is made by mixing [A] with oats, onions, and spices, and it became a proud [B] of Scottish tradition.","ko":"해기스는 [A]을 귀리, 양파, 향신료와 섞어서 만들고, 스코틀랜드 전통의 자랑스러운 [B]이 되었다.","bank":["organs","symbol","hunt","stomach","culture","pots"],"bko":{"organs":"내장","symbol":"상징","hunt":"사냥","stomach":"위","culture":"문화","pots":"냄비"},"r":{"a":"[A] organs, [B] symbol","ev":"5, 13번 문장","s":[[5,"It’s made by mixing the organs with oats, onions, and spices.","그것은 내장을 귀리, 양파, 향신료와 섞어서 만든다."],[13,"What started as a practical idea has become a proud symbol of Scottish tradition.","실용적인 생각으로 시작된 것이 스코틀랜드 전통의 자랑스러운 상징이 되었다."]],"w":"5번에서 내장(organs)을 섞어 만든다고 하고, 13번에서 자랑스러운 상징(symbol)이 되었다고 해요. stomach는 혼합물을 담는 곳이고, culture는 4번에 나오지만 13번 문장의 빈칸과 맞지 않아요.","c":null},"h":"c69c0a26f9"}]},{"u":3,"id":"b1-03-4","no":4,"ko":"라면 포장지에 적힌 스코빌, 매운맛은 어떻게 잴까?","items":[{"n":1,"t":"tf","q":"The Scoville Scale shows how spicy food is.","ko":"스코빌 척도는 음식이 얼마나 매운지를 보여 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"This scale shows how spicy food is.","이 척도는 음식이 얼마나 매운지를 보여 준다."]],"w":"2번 문장 This scale shows how spicy food is와 같은 내용이에요.","c":"T"},"h":"2419a67725"},{"n":2,"t":"tf","q":"The Scoville Scale was created in 1990 by Wilbur Scoville.","ko":"스코빌 척도는 1990년에 윌버 스코빌에 의해 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The scale was created in 1912 by Wilbur Scoville.","그 척도는 1912년에 윌버 스코빌에 의해 만들어졌다."]],"w":"4번 문장에서 스코빌 척도는 1912년에 만들어졌다고 해요. 1990년이 아니에요.","c":"F"},"h":"d55017d77d"},{"n":3,"t":"tf","q":"Today, machines are used to measure spiciness.","ko":"오늘날에는 기계를 이용해 매운 정도를 측정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Today, machines are used to measure spiciness.","오늘날에는 기계를 이용해 매운 정도를 측정한다."]],"w":"11번 문장 Today, machines are used to measure spiciness와 같은 내용이에요.","c":"T"},"h":"b264fc8c19"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He wanted to measure how spicy peppers are.)","ko":"그는 고추가 얼마나 매운지를 측정하고 싶었다.","opts":["섞다","맛보다","측정하다","키우다"],"word":"measure","r":{"a":"3) 측정하다","ev":"5번 문장","s":[[5,"He wanted to measure how spicy peppers are.","그는 고추가 얼마나 매운지를 측정하고 싶었다."]],"w":"스코빌이 하려던 일은 고추가 얼마나 매운지 알아내는 거예요. 그래서 척도를 만들었어요(4번). measure는 측정하다예요.","c":3},"h":"055fddbe42"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They make the Scoville scale more reliable and easier to use.)","ko":"그것들은 스코빌 척도를 더 믿을 만하고 사용하기 쉽게 만든다.","opts":["비싼","느린","위험한","믿을 만한"],"word":"reliable","r":{"a":"4) 믿을 만한","ev":"11~12번 문장","s":[[11,"Today, machines are used to measure spiciness.","오늘날에는 기계를 이용해 매운 정도를 측정한다."],[12,"They make the Scoville scale more reliable and easier to use.","기계는 스코빌 척도를 더 믿을 만하고 사용하기 쉽게 만든다."]],"w":"기계를 쓰면 척도가 더 정확해지고 쓰기도 쉬워져요. 그래서 reliable은 믿을 만한이에요.","c":4},"h":"ee4015d2a8"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey make the Scoville scale more reliable and easier to use.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 스코빌 척도를 더 믿을 만하고 사용하기 쉽게 만든다.","opts":["고추들","기계들","사람들","라면 포장지들"],"r":{"a":"2) 기계들","ev":"11~12번 문장","s":[[11,"Today, machines are used to measure spiciness.","오늘날에는 기계를 이용해 매운 정도를 측정한다."],[12,"They make the Scoville scale more reliable and easier to use.","기계는 스코빌 척도를 더 믿을 만하고 사용하기 쉽게 만든다."]],"w":"12번의 They는 바로 앞 11번에서 말한 machines(기계들)예요. 기계가 척도를 더 믿을 만하고 쓰기 쉽게 만들어요.","c":2},"h":"2468eeb839"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The higher the number was, the spicier the food was.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"수치가 높을수록 그 음식은 더 매웠다.","opts":["수치가 높을수록 음식은 더 매웠다.","수치가 높을수록 음식은 덜 매웠다.","수치가 낮을수록 음식은 더 매웠다.","음식이 매울수록 물을 덜 더했다."],"r":{"a":"1) 수치가 높을수록 음식은 더 매웠다.","ev":"10번 문장","s":[[10,"The higher the number was, the spicier the food was.","수치가 높을수록 그 음식은 더 매웠다."]],"w":"the higher ~, the spicier …은 ~할수록 더 …하다는 뜻이에요. 수치와 매운 정도가 같이 올라가요.","c":1},"h":"410b1bd788"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["스코빌은 고추 추출물을 소금물과 섞었다.","물은 음식이 차가워질 때까지 더해졌다.","물을 더한 횟수가 스코빌 수치가 되었다.","기계는 스코빌 척도를 사용하기 더 어렵게 만든다."],"opts":["Scoville mixed pepper extracts with salt water.","Water was added until the food became cold.","The number of times water was added became the Scoville number.","Machines make the scale harder to use."],"r":{"a":"3) The number of times water was added became the Scoville number.","ev":"9번 문장","s":[[9,"The number of times water was added became the Scoville number.","물을 더한 횟수가 스코빌 수치가 되었다."]],"w":"9번 문장과 같아요. 7번에서 섞은 것은 설탕물이고, 8번에서 물은 열기가 안 느껴질 때까지 더했으며, 12번에서 기계는 척도를 쓰기 쉽게 해 줘요.","c":3},"h":"2c5e30d198"},{"n":9,"t":"sum","q":"Scoville mixed pepper extracts with sugar water and kept adding (A) until no heat was felt. The number of (B) water was added became the Scoville number.","ko":"스코빌은 고추 추출물을 설탕물과 섞고 열기가 느껴지지 않을 때까지 (A)을 계속 더했다. 물을 더한 (B)가 스코빌 수치가 되었다.","oko":["(A) 소금 / (B) 사람들","(A) 물 / (B) 고추들","(A) 설탕 / (B) 기계들","(A) 열기 / (B) 해","(A) 물 / (B) 횟수"],"opts":["(A) salt / (B) people","(A) water / (B) peppers","(A) sugar / (B) machines","(A) heat / (B) years","(A) water / (B) times"],"r":{"a":"5) (A) water / (B) times","ev":"7~9번 문장","s":[[7,"Spicy pepper extracts were mixed with sugar water and tasted.","매운 고추 추출물을 설탕물과 섞어서 맛보았다."],[8,"Water was added again and again until no heat was felt.","열기가 느껴지지 않을 때까지 물을 계속 더했다."],[9,"The number of times water was added became the Scoville number.","물을 더한 횟수가 스코빌 수치가 되었다."]],"w":"8번에서 열기가 느껴지지 않을 때까지 물(water)을 더했고, 9번에서 물을 더한 횟수(times)가 스코빌 수치가 되었어요.","c":5},"h":"ca8ea8010d"},{"n":10,"t":"fill","q":"The [A] the Scoville number is, the spicier the food is, and today [B] are used to measure spiciness.","ko":"스코빌 수치가 [A]수록 음식은 더 맵고, 오늘날에는 [B]가 매운 정도를 측정하는 데 쓰인다.","bank":["higher","machines","lower","peppers","water","packets"],"bko":{"higher":"더 높은","machines":"기계들","lower":"더 낮은","peppers":"고추들","water":"물","packets":"포장지들"},"r":{"a":"[A] higher, [B] machines","ev":"10~11번 문장","s":[[10,"The higher the number was, the spicier the food was.","수치가 높을수록 그 음식은 더 매웠다."],[11,"Today, machines are used to measure spiciness.","오늘날에는 기계를 이용해 매운 정도를 측정한다."]],"w":"10번에서 수치가 높을수록(higher) 더 맵다고 하고, 11번에서 오늘날 기계(machines)로 측정한다고 해요. lower는 반대 뜻이고, peppers와 water는 방법에 나오는 재료예요.","c":null},"h":"043b0a7c08"}]},{"u":4,"id":"b1-04-1","no":1,"ko":"한 소년이 1부터 100까지 더한 비밀","items":[{"n":1,"t":"tf","q":"A 10-year-old boy solved the problem very quickly.","ko":"열 살 소년이 그 문제를 아주 빠르게 풀었다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장에 a 10-year-old boy solved this problem very quickly가 있어요. 열 살 소년이 문제를 빠르게 풀었다는 내용과 일치해요.","c":"T","ev":"2번 문장","s":[[2,"In the 1780s in Germany, a 10-year-old boy solved this problem very quickly.","1780년대 독일에서, 열 살 소년이 이 문제를 아주 빠르게 풀었다."]]},"h":"92123a66af"},{"n":2,"t":"tf","q":"Most students found the answer quickly by adding the numbers.","ko":"대부분의 학생들은 수를 더해서 답을 빠르게 찾았다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 대부분의 학생은 각 수를 하나씩 더하느라 오랜 시간이 걸렸다(took a long time)고 해요. 빠르게 찾았다는 말은 반대예요.","c":"F","ev":"4번 문장","s":[[4,"Most students took a long time, adding each number one by one.","대부분의 학생들은 각 수를 하나씩 더하느라 오랜 시간이 걸렸다."]]},"h":"3ea5f44691"},{"n":3,"t":"tf","q":"Gauss said that 101 times 50 is 5,050.","ko":"가우스는 101 곱하기 50이 5,050이라고 말했다.","r":{"a":"T (본문과 맞는 내용)","w":"9번 문장에서 소년이 101 times 50 is 5,050이라고 말해요. 그대로 일치하는 내용이에요.","c":"T","ev":"9번 문장","s":[[9,"Then he said, “101 times 50 is 5,050.”","그러고 나서 그는 \"101 곱하기 50은 5,050입니다.\"라고 말했다."]]},"h":"f9743e4cab"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The teacher was amazed by his smart idea.)","ko":"선생님은 그의 똑똑한 생각에 깜짝 놀랐다.","opts":["지루한","화가 난","깜짝 놀란","부끄러운"],"word":"amazed","r":{"a":"3) 깜짝 놀란","w":"선생님이 소년의 똑똑한 생각(smart idea)을 보고 어떤 기분이었는지 생각해 보세요. 감탄할 만한 풀이라서 amazed는 깜짝 놀랐다는 뜻이에요.","c":3,"ev":"10번 문장","s":[[10,"The teacher was amazed by his smart idea.","선생님은 그의 똑똑한 생각에 깜짝 놀랐다."]]},"h":"21be2bf3e0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But one boy quietly looked out the window.)","ko":"하지만 한 소년은 조용히 창밖을 바라보았다.","opts":["시끄럽게","조용히","급하게","화내며"],"word":"quietly","r":{"a":"2) 조용히","w":"다른 학생들이 열심히 더하는 동안 이 소년은 창밖만 바라보았어요. quietly는 소리 없이 조용히라는 뜻이에요.","c":2,"ev":"5번 문장","s":[[5,"But one boy quietly looked out the window.","하지만 한 소년은 조용히 창밖을 바라보았다."]]},"h":"36a6b22fd7"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe had already found the answer: 5,050.","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 이미 답인 5,050을 찾아냈다.","opts":["수학 선생님","대부분의 학생들","다른 반 학생","창밖을 바라보던 한 소년"],"r":{"a":"4) 창밖을 바라보던 한 소년","w":"6번 He 바로 앞 5번 문장의 주인공은 조용히 창밖을 본 한 소년(one boy)이에요. 그 소년이 이미 답을 찾은 거예요.","c":4,"ev":"5~6번 문장","s":[[5,"But one boy quietly looked out the window.","하지만 한 소년은 조용히 창밖을 바라보았다."],[6,"He had already found the answer: 5,050.","그는 이미 답인 5,050을 찾아냈다."]]},"h":"eaa968c35b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"His trick later became a well-known formula: n(n+1)/2.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그의 요령은 훗날 잘 알려진 공식 n(n+1)/2이 되었다.","opts":["그의 요령은 훗날 잘 알려진 공식이 되었다.","그의 요령은 아무에게도 알려지지 않았다.","그는 이미 있던 공식을 외워서 문제를 풀었다.","그의 공식은 선생님이 처음 만들었다."],"r":{"a":"1) 그의 요령은 훗날 잘 알려진 공식이 되었다.","w":"became a well-known formula는 잘 알려진 공식이 되었다는 뜻이에요. 소년의 요령이 나중에 공식이 된 것이지, 공식을 외워 푼 것도 선생님이 만든 것도 아니에요.","c":1,"ev":"12번 문장","s":[[12,"His trick later became a well-known formula: n(n+1)/2.","그의 요령은 훗날 잘 알려진 공식 n(n+1)/2이 되었다."]]},"h":"d76253225a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대부분의 학생들이 소년보다 답을 더 빨리 찾았다.","선생님은 학급에 쉬운 문제를 냈다.","소년은 이미 답을 찾은 뒤에 칠판 앞으로 갔다.","소년은 1부터 100까지 수를 하나씩 모두 더했다."],"opts":["Most students found the answer faster than the boy.","The teacher gave the class an easy question.","The boy had already found the answer before he went to the board.","The boy added every number from 1 to 100 one by one."],"r":{"a":"3) The boy had already found the answer before he went to the board.","w":"6번에서 소년은 이미 답을 찾았고, 7번에서 칠판으로 가서 보여 줘요. 학생들은 오래 걸렸고(4번), 문제는 어려웠고(3번), 소년은 하나씩 더하지 않았어요(8번).","c":3,"ev":"5~7번 문장","s":[[5,"But one boy quietly looked out the window.","하지만 한 소년은 조용히 창밖을 바라보았다."],[6,"He had already found the answer: 5,050.","그는 이미 답인 5,050을 찾아냈다."],[7,"He went to the board and showed how:","그는 칠판으로 가서 어떻게 풀었는지 보여 주었다."]]},"h":"2f053b38d7"},{"n":9,"t":"sum","q":"Most students took a long time (A) the numbers one by one, but one boy had already (B) the answer.","ko":"대부분의 학생들은 수를 하나씩 (A)하느라 오래 걸렸지만, 한 소년은 이미 답을 (B)했다.","oko":["(A) 빼는 / (B) 잃어버렸다","(A) 세는 / (B) 숨겼다","(A) 더하는 / (B) 찾아냈다","(A) 곱하는 / (B) 잊었다","(A) 쓰는 / (B) 물었다"],"opts":["(A) subtracting / (B) lost","(A) counting / (B) hidden","(A) adding / (B) found","(A) multiplying / (B) forgotten","(A) writing / (B) asked"],"r":{"a":"3) (A) adding / (B) found","w":"4번에서 학생들은 각 수를 하나씩 더하느라(adding) 오래 걸렸고, 6번에서 소년은 이미 답을 찾았어요(found). 곱하기는 소년이 9번에서 쓴 계산이라 (A)에 맞지 않아요.","c":3,"ev":"4번, 6번 문장","s":[[4,"Most students took a long time, adding each number one by one.","대부분의 학생들은 각 수를 하나씩 더하느라 오랜 시간이 걸렸다."],[6,"He had already found the answer: 5,050.","그는 이미 답인 5,050을 찾아냈다."]]},"h":"b592c4cccd"},{"n":10,"t":"fill","q":"The boy made 50 [A] of numbers, and the teacher was [B] by his smart idea.","ko":"소년은 수를 50[A]으로 묶었고, 선생님은 그의 똑똑한 생각에 [B]했다.","bank":["pairs","amazed","answer","board","quietly","formula"],"bko":{"pairs":"쌍","amazed":"깜짝 놀란","answer":"답","board":"칠판","quietly":"조용히","formula":"공식"},"r":{"a":"[A] pairs, [B] amazed","w":"8번에서 수가 50쌍(50 pairs) 있다고 했고, 10번에서 선생님이 그의 똑똑한 생각에 놀랐어요(amazed). answer, board, formula는 글에 나오지만 이 빈칸 뜻과 맞지 않아요.","c":null,"ev":"8번, 10번 문장","s":[[8,"He explained that there were 50 pairs of numbers, and each pair made 101.","그는 수가 50쌍 있고, 각 쌍이 101이 된다고 설명했다."],[10,"The teacher was amazed by his smart idea.","선생님은 그의 똑똑한 생각에 깜짝 놀랐다."]]},"h":"4d76358cbd"}]},{"u":4,"id":"b1-04-2","no":2,"ko":"소시지로 스마트폰을 쓸 수 있는 이유","items":[{"n":1,"t":"tf","q":"You can play games on a phone screen with a sausage.","ko":"소시지로 폰 화면에서 게임을 할 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장에서 소시지로 누르고, 쓸어 넘기고, 심지어 게임도 할 수 있다(play games)고 해요. 본문과 일치해요.","c":"T","ev":"2번 문장","s":[[2,"You can tap, swipe, or even play games with it.","소시지로 화면을 누르고, 쓸어 넘기고, 심지어 게임도 할 수 있다."]]},"h":"c59b1025ee"},{"n":2,"t":"tf","q":"The screen finds where you touched by sensing the heat of your finger.","ko":"화면은 손가락의 열을 감지해서 만진 곳을 알아낸다.","r":{"a":"F (본문과 다른 내용)","w":"8번 문장에서 화면이 감지하는 것은 열이 아니라 전기적 변화(electric change)예요. 열이라는 말은 본문에 없어요.","c":"F","ev":"8번 문장","s":[[8,"The screen senses this electric change and finds where you touched.","화면은 이 전기적 변화를 감지해서 당신이 만진 곳을 알아낸다."]]},"h":"d853329f1d"},{"n":3,"t":"tf","q":"Any object that carries electricity can work on a touchscreen.","ko":"전기를 전달하는 모든 물체는 터치스크린에서 작동할 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"10 할 수 있다."],[10,"In fact, any object that carries electricity can work on a touchscreen.","사실, 전기를 전달하는 모든 물체는 터치스크린에서 작동할 수 있다."]]},"h":"b02eeef805"},{"n":10,"t":"fill","q":"When a finger touches the screen, small electric [A] move into the finger and back to the phone, and the screen [B] this change.","ko":"손가락이 화면에 닿으면, 작은 전기 [A]이 손가락으로 갔다가 폰으로 돌아오고, 화면은 이 변화를 [B]한다.","bank":["charges","senses","layer","games","salt","strange"],"bko":{"charges":"전하","senses":"감지하다","layer":"층","games":"게임","salt":"소금","strange":"이상한"},"r":{"a":"[A] charges, [B] senses","w":"6~7번에서 작은 전하들(charges)이 손가락과 폰 사이를 흐르고, 8번에서 화면이 그 전기적 변화를 감지해요(senses). salt는 전하가 움직이게 돕는 것이지 움직이는 대상이 아니에요.","c":null,"ev":"6~8번 문장","s":[[6,"When your finger touches it, the water and salt in your skin allow small electric charges to move.","손가락이 화면에 닿으면, 피부 속의 물과 소금이 작은 전하들이 움직이게 해 준다."],[7,"These charges flow into your finger and back to the phone.","이 전하들은 손가락으로 흘러 들어갔다가 다시 휴대폰으로 흐른다."],[8,"The screen senses this electric change and finds where you touched.","화면은 이 전기적 변화를 감지해서 당신이 만진 곳을 알아낸다."]]},"h":"39ac001504"}]},{"u":4,"id":"b1-04-3","no":3,"ko":"직선보다 곡선이 더 빠른 길","items":[{"n":1,"t":"tf","q":"There are two paths from a high point to a low point.","ko":"높은 지점에서 낮은 지점까지 가는 길이 두 개 있다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장이 그대로 two paths from a high point to a low point를 말해요. 직선과 곡선 두 길이에요.","c":"T","ev":"1번 문장","s":[[1,"There are two paths from a high point to a low point: a straight line and a curved line.","높은 지점에서 낮은 지점까지 가는 길이 두 개 있는데, 직선과 곡선이다."]]},"h":"b4fa537129"},{"n":2,"t":"tf","q":"Most people think the curved path is faster.","ko":"대부분의 사람들은 곡선 길이 더 빠르다고 생각한다.","r":{"a":"F (본문과 다른 내용)","w":"3번 문장에서 대부분의 사람들은 직선이 가장 짧아서 더 빠르다고 생각해요. 곡선이라는 말은 반대예요.","c":"F","ev":"3번 문장","s":[[3,"Most people think the straight line is faster because it is the shortest.","대부분의 사람들은 직선이 가장 짧기 때문에 더 빠르다고 생각한다."]]},"h":"f3a45107a5"},{"n":3,"t":"tf","q":"At the start, the curved path is steeper than the straight line."
