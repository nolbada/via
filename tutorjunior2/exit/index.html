s paintings.","여기에 그의 그림들에 관한 흥미로운 이야기가 있다."]],"w":"2번은 모네의 그림들에 관한 '흥미로운' 이야기가 나온다고 알려 줘요. 그래서 3번부터 법정에서 일어난 재미있는 일이 시작돼요. interesting = 흥미로운.","c":2},"h":"6de687314b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They wanted the judge to decide which one was really painted by Monet.)","ko":"그들은 어떤 것이 정말 모네에 의해 그려진 것인지 판사가 ( ) 주기를 원했다.","opts":["그리다","잊다","보여 주다","결정하다"],"word":"decide","r":{"a":"4) 결정하다","ev":"6번 문장","s":[[6,"They wanted the judge to decide which one was really painted by Monet.","그들은 어떤 것이 정말 모네에 의해 그려진 것인지 판사가 결정해 주기를 원했다."]],"w":"사람들은 어느 그림이 진짜 모네의 그림인지 판사가 정해 주기를 원했어요. decide = 결정하다예요.","c":4},"h":"59f342af27"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nEach of them said their painting had been painted by Monet.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그들 각자는 자신의 그림이 모네에 의해 그려졌다고 말했다.","opts":["그림들","판사들","몇몇 사람들","프랑스 화가들"],"r":{"a":"3) 몇몇 사람들","ev":"3~4번 문장","s":[[3,"One day, several people brought paintings to court.","어느 날, 몇몇 사람들이 법정으로 그림들을 가져왔다."],[4,"Each of them said their painting had been painted by Monet.","그들 각자는 자신의 그림이 모네에 의해 그려졌다고 말했다."]],"w":"3번에서 several people(몇몇 사람들)이 그림을 법정에 가져왔다고 했고, 4번의 them은 이 사람들을 가리켜요. 그림은 their painting으로 따로 나와요.","c":3},"h":"734f4e40dd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"All of the paintings showed the same scene, but each one was a little different.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 그림들은 모두 같은 풍경을 보여주고 있었지만, 각각은 조금 달랐다.","opts":["모든 그림이 같은 풍경이었지만 각각 조금씩 달랐다.","모든 그림이 완전히 똑같은 모양이었다.","그림마다 풍경이 전혀 달랐다.","그림 중 단 하나만 같은 풍경이었다."],"r":{"a":"1) 모든 그림이 같은 풍경이었지만 각각 조금씩 달랐다.","ev":"5번 문장","s":[[5,"All of the paintings showed the same scene, but each one was a little different.","그 그림들은 모두 같은 풍경을 보여주고 있었지만, 각각은 조금 달랐다."]],"w":"All of the paintings showed the same scene은 모든 그림이 같은 풍경이라는 뜻이고, each one was a little different는 각각 조금씩 달랐다는 뜻이에요.","c":1},"h":"00fe3ed13e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["판사는 미술에 대해 거의 알지 못했다.","판사는 미술에 대해 많이 알고 있었다.","판사는 그림들을 보지 않았다.","판사는 모네라는 이름의 화가였다."],"opts":["The judge knew little about art.","The judge knew a lot about art.","The judge did not look at the paintings.","The judge was a painter named Monet."],"r":{"a":"2) The judge knew a lot about art. (판사는 미술에 대해 많이 알고 있었다.)","ev":"7번 문장","s":[[7,"The judge knew a lot about art.","그 판사는 미술에 대해 많이 알고 있었다."]],"w":"7번에서 그 판사는 미술에 대해 많이 알고 있었다(knew a lot about art)고 해요.","c":2},"h":"d7f2db9e41"},{"n":9,"t":"sum","q":"Monet painted the same place at different times of the day to (A) the (B) of light.","ko":"모네는 빛의 (B)을(를) (A)기 위해 하루 중 각기 다른 시간에 같은 장소를 그렸다.","oko":["(A) 담아내 / (B) 변화","(A) 담아내 / (B) 끝","(A) 멈추 / (B) 변화","(A) 멈추 / (B) 끝","(A) 숨기 / (B) 색"],"opts":["(A) capture / (B) change","(A) capture / (B) end","(A) stop / (B) change","(A) stop / (B) end","(A) hide / (B) color"],"r":{"a":"1) (A) capture / (B) change ((A) 담아내 / (B) 변화)","ev":"9번 문장","s":[[9,"Monet painted the same place at different times of the day to capture the change of light.","모네는 빛의 변화를 담아내기 위해 하루 중 각기 다른 시간에 같은 장소를 그렸다."]],"w":"9번에서 모네는 빛의 변화(change)를 담아내기(capture) 위해 하루 중 각기 다른 시간에 같은 장소를 그렸다고 해요.","c":1},"h":"117dd178d2"},{"n":10,"t":"fill","q":"For example, his most famous [A] of art show water lilies in his [B] at different times of the day.","ko":"예를 들어, 그의 가장 유명한 미술 [A]은(는) 하루 중 각기 다른 시간에 그의 [B]에 있는 수련들을 보여준다.","bank":["works","garden","painted","brought","knew","wanted"],"bko":{"works":"작품들","garden":"정원","painted":"그렸다(paint의 과거)","brought":"가져왔다(bring의 과거)","knew":"알았다(know의 과거)","wanted":"원했다(want의 과거)"},"r":{"a":"[A] works (작품들), [B] garden (정원)","ev":"10번 문장","s":[[10,"For example, his most famous works of art show water lilies in his garden at different times of the day.","예를 들어, 그의 가장 유명한 미술 작품들은 하루 중 각기 다른 시간에 그의 정원에 있는 수련들을 보여준다."]],"w":"10번 문장에서 가장 유명한 미술 작품들(works)은 그의 정원(garden)에 있는 수련들을 보여준다고 해요. 나머지 단어는 famous 뒤나 in his 뒤에 들어가면 말이 안 돼요.","c":null},"h":"46ded6b7c2"}]},{"u":10,"id":"rj2-10-3","no":3,"ko":"제가 아는 그 악기가 맞나요?!","items":[{"n":1,"t":"tf","q":"William Close invented the Earth Harp in 1999.","ko":"William Close는 1999년에 Earth Harp를 발명했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Musician William Close invented it in 1999.","음악가 William Close가 1999년에 그것을 발명했다."]],"w":"3번 문장에 Musician William Close invented it in 1999가 있어요. it은 2번의 Earth Harp예요.","c":"T"},"h":"d712d0e9c8"},{"n":2,"t":"tf","q":"The Earth Harp has a small metal base.","ko":"Earth Harp는 작은 금속 하부를 갖고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The harp has a large wooden base.","그 하프는 나무로 된 큰 하부를 갖고 있다."]],"w":"6번 문장에서 하프는 나무로 된 큰 하부(a large wooden base)를 갖고 있다고 해요. 작고 금속이라는 말은 틀려요.","c":"F"},"h":"ddb6175c0e"},{"n":3,"t":"tf","q":"The musician stands near the base of the instrument.","ko":"음악가는 악기의 하부 가까이에 선다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"The musician stands on the stage near the base of the instrument.","그 음악가는 무대 위에서 악기의 하부에 가까이 선다."]],"w":"10번 문장에서 음악가는 무대 위에서 악기의 하부 가까이(near the base)에 선다고 해요.","c":"T"},"h":"b2ac997dff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Strings stretch from the base for hundreds of meters.)","ko":"현들은 하부로부터 수백 미터나 ( ).","opts":["뻗어 있다","멈춰 있다","줄어든다","깨진다"],"word":"stretch","r":{"a":"1) 뻗어 있다","ev":"8번 문장","s":[[8,"Strings stretch from the base for hundreds of meters.","현들은 하부로부터 수백 미터나 뻗어 있다."]],"w":"8번은 현들이 하부에서 수백 미터나 '뻗어' 있다는 뜻이에요. 그래서 9번처럼 극장, 빌딩, 계곡의 꼭대기까지 닿을 수 있어요. stretch = 뻗다.","c":1},"h":"f5c10662f4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This is usually set on a stage.)","ko":"이것은 보통 무대 위에 ( ).","opts":["던져지다","놓이다","팔리다","깨지다"],"word":"set","r":{"a":"2) 놓이다","ev":"7번 문장","s":[[7,"This is usually set on a stage.","이것은 보통 무대 위에 놓인다."]],"w":"7번의 This는 6번의 나무로 된 큰 하부예요. 그 하부가 보통 무대 위에 '놓인다'는 뜻이에요. set = 놓다, is set = 놓인다.","c":2},"h":"3eec22bf03"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are attached to the tops of theaters, buildings, and even valleys.","ko":"밑줄 친 \"They\"가 가리키는 것은?","sko":"그것들은 극장과 빌딩, 그리고 심지어 계곡의 꼭대기에 부착된다.","opts":["현들","극장들","계곡들","음악가들"],"r":{"a":"1) 현들","ev":"8~9번 문장","s":[[8,"Strings stretch from the base for hundreds of meters.","현들은 하부로부터 수백 미터나 뻗어 있다."],[9,"They are attached to the tops of theaters, buildings, and even valleys.","그것들은 극장과 빌딩, 그리고 심지어 계곡의 꼭대기에 부착된다."]],"w":"9번의 They는 바로 앞 8번 문장의 Strings(현들)를 가리켜요. 하부에서 수백 미터나 뻗은 현들이 극장, 빌딩, 계곡의 꼭대기에 붙어 있다는 뜻이에요.","c":1,"k":"They = 현들"},"pron":"They","h":"05dbff84ce"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Earth Harp is still listed in the Guinness World Records as the longest stringed instrument.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Earth Harp는 여전히 가장 긴 현악기로 기네스 세계 기록에 등재되어 있다.","opts":["Earth Harp는 가장 짧은 현악기로 기록에 올라 있다.","Earth Harp는 지금도 가장 긴 현악기로 기네스 세계 기록에 올라 있다.","Earth Harp는 더 이상 기네스 세계 기록에 올라 있지 않다.","Earth Harp는 기네스 세계 기록을 깨기 위해 만들어졌다."],"r":{"a":"2) Earth Harp는 지금도 가장 긴 현악기로 기네스 세계 기록에 올라 있다.","ev":"5번 문장","s":[[5,"The Earth Harp is still listed in the Guinness World Records as the longest stringed instrument.","Earth Harp는 여전히 가장 긴 현악기로 기네스 세계 기록에 등재되어 있다."]],"w":"is still listed in은 '여전히 ~에 올라 있다'이고, as the longest stringed instrument는 '가장 긴 현악기로서'예요.","c":2},"h":"6404c9a061"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["음악가는 기름이 묻은 금속 장갑을 낀다.","음악가는 끈적끈적한 송진이 묻은 면장갑을 낀다.","음악가는 장갑 없이 Earth Harp를 연주한다.","음악가는 종이로 만든 장갑을 낀다."],"opts":["The musician wears metal gloves coated with oil.","The musician wears cotton gloves coated with sticky resin.","The musician plays the Earth Harp without gloves.","The musician wears gloves made of paper."],"r":{"a":"2) The musician wears cotton gloves coated with sticky resin. (음악가는 끈적끈적한 송진이 묻은 면장갑을 낀다.)","ev":"11번 문장","s":[[11,"He wears cotton gloves coated with sticky resin.","그는 끈적끈적한 송진이 묻은 면장갑을 낀다."]],"w":"11번에서 그는 끈적끈적한 송진이 묻은 면장갑(cotton gloves)을 낀다고 해요.","c":2},"h":"b48fe6f843"},{"n":9,"t":"sum","q":"He (A) his hands along the strings and causes them to (B).","ko":"그는 현들을 따라 손을 (A) 현들이 (B)하게 한다.","oko":["(A) 움직이고 / (B) 진동","(A) 움직이고 / (B) 끊어지게","(A) 떨어뜨리고 / (B) 진동","(A) 떨어뜨리고 / (B) 끊어지게","(A) 숨기고 / (B) 멈추게"],"opts":["(A) runs / (B) vibrate","(A) runs / (B) break","(A) drops / (B) vibrate","(A) drops / (B) break","(A) hides / (B) stop"],"r":{"a":"1) (A) runs / (B) vibrate ((A) 움직이고 / (B) 진동)","ev":"12번 문장","s":[[12,"He runs his hands along the strings and causes them to vibrate.","그는 현들을 따라 그의 손을 움직이고 그것(현)들을 진동하게 한다."]],"w":"12번에서 그는 현들을 따라 손을 움직이고(runs) 현들을 진동하게(vibrate) 한다고 해요.","c":1},"h":"c0d9fd634f"},{"n":10,"t":"fill","q":"William Close [A] buildings and natural spaces into enormous [B].","ko":"William Close는 빌딩과 자연 공간들을 거대한 [B](으)로 [A].","bank":["turns","harps","wooden","sticky","deeper","longest"],"bko":{"turns":"바꾼다","harps":"하프들","wooden":"나무로 된","sticky":"끈적끈적한","deeper":"더 깊은","longest":"가장 긴"},"r":{"a":"[A] turns, [B] harps","ev":"4번 문장","s":[[4,"He turns buildings and natural spaces into enormous harps.","그는 빌딩과 자연 공간들을 거대한 하프로 바꾼다."]],"w":"4번 He turns buildings and natural spaces into enormous harps에서 가져왔어요. [A]는 turn A into B의 동사 자리이고, [B]는 enormous가 꾸미는 명사 자리예요.","c":null},"h":"39c97a9a4f"}]},{"u":10,"id":"rj2-10-4","no":4,"ko":"왜 이런 별명이?","items":[{"n":1,"t":"tf","q":"Night Watch is one of Rembrandt’s most famous works.","ko":"<야경>은 렘브란트의 가장 유명한 작품들 중 하나이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It is Night Watch, one of Rembrandt’s most famous works.","그것은 렘브란트의 가장 유명한 작품들 중 하나인 <야경(夜警)>이다."]],"w":"2번 문장에 It is Night Watch, one of Rembrandt’s most famous works가 있어요.","c":"T"},"h":"b5e47101f3"},{"n":2,"t":"tf","q":"In the 1940s, more layers of varnish were added to the painting.","ko":"1940년대에 그 그림에는 더 많은 겹의 니스가 덧칠되었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"In the 1940s, however, the layers of varnish were removed and the colors were restored to their original condition.","하지만, 1940년대에 여러 겹의 니스가 제거되었고, 색들은 그것들의 원래 상태로 복원되었다."]],"w":"11번 문장에서 1940년대에는 여러 겹의 니스가 제거되었고(were removed) 색들이 복원되었어요. 더 덧칠했다는 말은 반대예요.","c":"F"},"h":"d4e3a1aacb"},{"n":3,"t":"tf","q":"The layers of varnish made the painting look dark.","ko":"여러 겹의 니스는 그 그림이 어두워 보이게 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"This made the painting look dark.","이것은 그 그림이 어두워 보이게 했다."]],"w":"9번 문장에서 This(니스를 덧칠한 일)가 그림이 어두워 보이게 했다(made the painting look dark)고 해요.","c":"T"},"h":"d667896f28"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Naturally, people thought the painting showed a nighttime event.)","ko":"( ), 사람들은 그 그림이 밤에 일어난 일을 보여준다고 생각했다.","opts":["우연히","당연히","불행히도","천천히"],"word":"Naturally","r":{"a":"2) 당연히","ev":"9~10번 문장","s":[[9,"This made the painting look dark.","이것은 그 그림이 어두워 보이게 했다."],[10,"Naturally, people thought the painting showed a nighttime event.","자연스럽게, 사람들은 그 그림이 밤에 일어난 일을 보여준다고 생각했다."]],"w":"9번에서 그림이 어두워 보였으니, 사람들이 밤 장면이라고 생각한 것은 당연한 반응이에요. Naturally = 당연히, 자연스럽게예요.","c":2},"h":"0a474840d4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In the 1940s, however, the layers of varnish were removed.)","ko":"하지만, 1940년대에 여러 겹의 니스가 ( ).","opts":["덧칠했다","제거되었다","보호되었다","설명되었다"],"word":"removed","r":{"a":"2) 제거되었다","ev":"11번 문장","s":[[11,"In the 1940s, however, the layers of varnish were removed and the colors were restored to their original condition.","하지만, 1940년대에 여러 겹의 니스가 제거되었고, 색들은 그것들의 원래 상태로 복원되었다."]],"w":"10번에서는 니스 때문에 밤 풍경이라고 생각했는데, 11번의 however 이후에는 색이 원래 상태로 복원되었어요. 니스가 없어져야 하니 were removed = 제거되었다예요.","c":2},"h":"42a285dfd6"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSo people started using the name Night Watch because it seemed to describe the painting well.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그래서 사람들은 그것이 그 그림을 잘 설명하는 것 같았기 때문에 <야경>이라는 이름을 사용하기 시작했다.","opts":["그 그림","렘브란트","<야경>이라는 이름","그림의 진짜 이름"],"r":{"a":"3) <야경>이라는 이름","ev":"4~5번 문장","s":[[4,"Its real name is very long.","그것의 진짜 이름은 매우 길다."],[5,"So people started using the name Night Watch because it seemed to describe the painting well.","그래서 사람들은 그것이 그 그림을 잘 설명하는 것 같았기 때문에 <야경>이라는 이름을 사용하기 시작했다."]],"w":"4번에서 진짜 이름은 아주 길다고 했어요. 5번에서 사람들이 쓰기 시작한 이름이 Night Watch이고, because it seemed to describe the painting well의 it은 그 이름을 가리켜요. 그림을 설명하는 것 같은 것은 이름이에요.","c":3},"h":"7d2301acf0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Actually, it is not a night scene at all!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사실, 그것은 밤 풍경이 전혀 아니다!","opts":["사실, 그것은 밤 풍경과 조금 비슷하다.","사실, 그것은 밤에만 볼 수 있는 그림이다.","사실, 그것은 밤 풍경이 맞다.","사실, 그것은 밤 풍경이 전혀 아니다."],"r":{"a":"4) 사실, 그것은 밤 풍경이 전혀 아니다.","ev":"6~7번 문장","s":[[6,"However, it turns out that the nickname is wrong!","하지만, 그 별명은 잘못된 것으로 밝혀진다!"],[7,"Actually, it is not a night scene at all!","사실, 그것은 밤 풍경이 전혀 아니다!"]],"w":"not ~ at all은 '전혀 ~ 아니다'라는 뜻이에요. 6번에서 별명이 잘못되었다고 했고, 7번에서 이 그림은 밤 풍경이 전혀 아니라고 해요.","c":4},"h":"7c25912fb4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그림의 진짜 이름은 아주 짧다.","그림을 먼지로부터 보호하기 위해 여러 겹의 니스가 덧칠되었다.","그림은 오늘날 <Day Watch>라고 이름 붙여져 있다.","렘브란트가 죽기 전에 그림에 니스가 덧칠되었다."],"opts":["The real name of the painting is very short.","Layers of varnish were added to protect the painting from dirt.","The painting is named Day Watch today.","Varnish was added to the painting before Rembrandt died."],"r":{"a":"2) Layers of varnish were added to protect the painting from dirt. (그림을 먼지로부터 보호하기 위해 여러 겹의 니스가 덧칠되었다.)","ev":"8번 문장","s":[[8,"After Rembrandt’s death, layers of varnish were added to the painting to protect it from dirt.","렘브란트의 사망 후에, 그것을 먼지로부터 보호하기 위해 여러 겹의 니스가 그림에 덧칠해졌다."]],"w":"8번에서 렘브란트의 사망 후에 그림을 먼지로부터 보호하기 위해 여러 겹의 니스가 덧칠되었다고 해요.","c":2},"h":"0b1a72621f"},{"n":9,"t":"sum","q":"Soon, there were (A) to (B) its nickname to “Day Watch.”","ko":"곧, 그것의 별명을 ‘Day Watch’로 (B)하려는 (A)들이 있었다.","oko":["(A) 노력 / (B) 변경","(A) 노력 / (B) 유지","(A) 실수 / (B) 변경","(A) 실수 / (B) 유지","(A) 규칙 / (B) 삭제"],"opts":
