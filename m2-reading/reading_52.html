uake soon went away.", "“Now, let’s go and explore the craters,” said Ms. Lee. “Craters are made when space rocks crash into the Moon.” “Like the footprints, the craters don't change much because the Moon has no air.”"];var PASS_KO=["달로의 체험 학습", "호현이의 학교는 달로 체험 학습을 갔습니다. 우주선이 우주에 도달했을 때, 모두가 무중력 상태를 경험하며 떠다니기 시작했습니다. 호현이는 유찬이를 손가락으로 밀었고, 모두는 유찬이가 선실 안을 떠다니는 모습을 지켜보았습니다. 규진이는 천장에 거꾸로 섰습니다. 시현이는 벽에 서 있었습니다. 우주에서는 위아래가 없기 때문에 모두가 편안하게 느꼈습니다.", "점심은 특별한 포장 용기에 담긴 수프와 감자였습니다. 우주에서는 접시를 사용할 수 없어서 모두 포장 용기에서 바로 음식을 먹었습니다. 포장 용기와 테이블에는 모두 자석이 있어서 포장 용기를 테이블에 고정할 수 있었습니다. “모두 테이블 자석 위에 음식을 올려 두세요,”라고 담임 선생님인 이 선생님이 말씀하셨습니다. “음식이 떠다니면 우주선에 손상을 줄 수도 있어요.”", "우주선이 달에 착륙했습니다. 달은 낮은 중력을 갖고 있어서 모두 밖으로 뛰어나가서 천천히 착지했습니다. 달의 중력이 매우 낮아서 높이 점프하는 것이 쉬웠습니다. 시현이는 점프하면서 규진이의 머리 위로 날아갔습니다! “조심하세요,” 이 선생님이 말했습니다. “낮은 중력에서 점프하는 건 재미있지만, 서로 부딪히면 다칠 수 있어요.” “자, 이제 모두 이리로 와서 아폴로 우주 비행사들의 발자국을 봅시다!” 그 발자국들은 100년이 넘었지만, 여전히 완벽해 보였습니다. “그건 달에 바람이나 비가 없기 때문이에요,” 이 선생님이 설명했습니다.", "그때 갑자기 땅이 흔들리기 시작했습니다. “지진이야!” 시현이가 외쳤습니다. “진정하세요, 여러분,” 이 선생님이 말했습니다. “그건 사실 월진이에요. 다행히 지구의 지진만큼 강하지는 않아요.” “가만히 있으면 괜찮을 거예요.” 선생님이 옳았습니다. 월진은 곧 사라졌습니다.", "“이제 분화구를 탐험하러 갑시다,” 이 선생님이 말했습니다. “분화구는 우주 암석이 달에 충돌할 때 만들어져요.” “발자국처럼, 달에는 공기가 없어서 분화구도 거의 변하지 않아요.”"];var DG=[{"dlg": [["M", "Look at the moon!", "달 좀 봐!"], ["G", "Wow! It’s so big and bright.", "와! 정말 크고 밝아요."], ["M", "Yes, that’s a supermoon. When the moon is closest to the Earth, it looks bigger and brighter than usual.", "그래, 저게 슈퍼문이야. 달이 지구에 가장 가까이 있을 때, 평소보다 더 크고 밝아 보인단다."], ["G", "Oh, that’s surprising! Is it possible to see a supermoon every year?", "오, 놀라워요! 슈퍼문은 매년 볼 수 있어요?"], ["M", "Yes, but we can only see a supermoon a few times a year.", "응, 하지만 슈퍼문은 1년에 몇 번밖에 볼 수 없어."], ["G", "I see. So, when can we see the next supermoon?", "그렇군요. 그럼 다음 슈퍼문은 언제 볼 수 있어요?"], ["M", "Let’s check. Ah, it’s in December.", "확인해 보자. 아, 12월이구나."], ["G", "That’s interesting! I want to take a picture of it.", "흥미롭네요! 저는 그걸 사진으로 찍고 싶어요."], ["M", "Sure. Let’s take a picture togethe
