an to take pictures.","ko":"그는 사진을 찍기 시작했다.","ok":true,"foot":[],"fixes":[]},{"n":8,"tag":null,"en":"Dr. Schofield: Unbelievable! There is so many people here.","ko":"Schofield 박사: 믿을 수 없어! 여기엔 정말 많은 사람들이 있어.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[4],"point":"be동사: 복수 many people 앞에는 There are 사용","topic":"be동사","memo":"복수 many people 앞에는 There are 사용"}]},{"n":9,"tag":null,"en":"I hope the world will learn about this important event through me pictures.","ko":"내 사진을 통해 세계가 이 중요한 사건에 대해 알게 되기를 바라.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"my","partial":false,"at":[11],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 my 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 my 사용"}]},{"n":10,"tag":null,"en":"Do you know Seok Hopil? His English name were Frank W.","ko":"당신은 석호필을 아는가? 그의 영어 이름은 Frank W.","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[8],"point":"be동사: 단수 주어 name에는 was 사용","topic":"be동사","memo":"단수 주어 name에는 was 사용"}]},{"n":11,"tag":null,"en":"Schofield, but he loved him Korean name. It sounded similar to his real name, and it also had a good meaning.","ko":"Schofield였지만, 그는 자신의 한국 이름을 사랑했다. 그 이름은 그의 본명과 비슷하게 들렸고 좋은 의미도 담고 있었다.","ok":false,"foot":[],"fixes":[{"wrong":"him","right":"his","partial":false,"at":[4],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 his 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 his 사용"}]},{"n":12,"tag":null,"en":"Dr. Schofield was a Canadian doctor, and he first came to Korea at 1916 to teach medicine.","ko":"Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다.","ok":false,"foot":[],"fixes":[{"wrong":"at","right":"in","partial":false,"at":[12],"point":"기본전치사: 연도 앞에는 전치사 in 사용","topic":"기본전치사","memo":"연도 앞에는 전치사 in 사용"}]},{"n":13,"tag":null,"en":"He wanted to teach in Korean, so he began to learn Korean right away.","ko":"그는 한국어로 가르치고 싶어서, 곧바로 한국어를 배우기 시작했다.","ok":true,"foot":[],"fixes":[]},{"n":14,"tag":null,"en":"He studied so hard that he was able to teach in Korean after only a a in 1916 to teach medicine.","Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다.",1],["He wanted to teach in Korean, so he began to learn Korean right away.","그는 한국어로 가르치고 싶어서, 곧바로 한국어를 배우기 시작했다.",0],["He studied so hard that he was able to teach in Korean after only a few years.","그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다.",0],["He believed that every country has the right to be independent, so he helped the Korean independence movement.","그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다.",0],["On March 1, 1919, Dr. Schofield heard people shouting for Korean independence in Tapgol Park.","1919년 3월 1일, Schofield 박사는 탑골 공원에서 사람들이 한국의 독립을 외치는 소리를 들었다.",1],["He took pictures of the event with his camera.","그는 카메라로 그 사건의 사진을 찍었다.",0],["He then wrote an article about the historic event and sent it to foreign newspapers with his pictures.","그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다.",0],["Dr. Schofield's fight for Korean independence didn't stop even after the March 1st Movement.","한국 독립을 위한 Schofield 박사의 투쟁은 3·1운동 이후에도 멈추지 않았다.",1],["He continued to write about the terrible situation in Korea for foreign newspapers.","그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다.",0],["He was under the watchful eye of the Japanese police, so he had to go back to Canada in 1920.","그는 일본 경찰의 감시를 받게 되어 1920년에 캐나다로 돌아가야 했다.",0]];var RNUM=54;var TITLE_EN="Dr. Schofield, a Foreigner Who Loved Korea";var PASS_EN=["Dr. Schofield, a Foreigner Who Loved Korea","On February 28, 1919, a man came to Dr. Schofield's house.","A man: Dr. Schofield, I have a special favor to ask you.","Dr. Schofield: What can I do for you?","A man: Many people are going to gather tomorrow for the independence of Korea. Could you take pictures of the event and share them with the world?","At 2 p.m. on March 1, Dr. Schofield was hiding in a building and saw a large group of people gathering outside. He began to take pictures.","Dr. Schofield: Unbelievable! There are so many people here. I hope the world will learn about this important event through my pictures.","Do you know Seok Hopil? His English name was Frank W. Schofield, but he loved his Korean name. It sounded similar to his real name, and it also had a good meaning.","Dr. Schofield was a Canadian doctor, and he first came to Korea in 1916 to teach medicine. He wanted to teach in Korean, so he began to learn Korean right away. He studied so hard that he was able to teach in Korean after only a few years. He believed that every country has the right to be independent, so he helped the Korean independence movement.","On March 1, 1919, Dr. Schofield heard people shouting for Korean independence in Tapgol Park. He took pictures of the event with his camera. He then wrote an article about the historic event and sent it to foreign newspapers with his pictures.","Dr. Schofield's fight for Korean independence didn't stop even after the March 1st Movement. He continued to write about the terrible situation in Korea for foreign newspapers. He was under the watchful eye of the Japanese police, so he had to go back to Canada in 1920."];var PASS_KO=["Schofield 박사, 한국을 사랑한 외국인","1919년 2월 28일, 한 남자가 Schofield 박사의 집에 왔다.","남자: Schofield 박사님, 특별한 부탁이 있습니다.","Schofield 박사: 제가 무엇을 해 드릴까요?","남자: 내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다. 그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?","3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다. 그는 사진을 찍기 시작했다.","Schofield 박사: 믿을 수 없어! 여기엔 정말 많은 사람들이 있어. 내 사진을 통해 세계가 이 중요한 사건에 대해 알게 되기를 바라.","당신은 석호필을 아는가? 그의 영어 이름은 Frank W. Schofield였지만, 그는 자신의 한국 이름을 사랑했다. 그 이름은 그의 본명과 비슷하게 들렸고 좋은 의미도 담고 있었다.","Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다. 그는 한국어로 가르치고 싶어서, 곧바로 한국어를 배우기 시작했다. 그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다. 그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다.","1919년 3월 1일, Schofield 박사는 탑골 공원에서 사람들이 한국의 독립을 외치는 소리를 들었다. 그는 카메라로 그 사건의 사진을 찍었다. 그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다.","한국 독립을 위한 Schofield 박사의 투쟁은 3·1운동 이후에도 멈추지 않았다. 그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다. 그는 일본 경찰의 감시를 받게 되어 1920년에 캐나다로 돌아가야 했다."];var DG=[{"qs":[{"n":1,"q":"위 대화를 읽고 답할 수 없는 질문은?","o":["Why does Somi need Liam's help?","Whom was Somi thinking about as the subject of her essay?","When does Somi have to hand in her essay?","What was Audrey Hepburn's job?","Whom did Audrey Hepburn especially do volunteer work for?"],"a":2,"ans":"When does Somi have to hand in her essay?","evs":[["Liam, can you please help me? I need to find some books for my homework.","Liam, 나 좀 도와줄래? 숙제 때문에 책을 좀 찾아야 해."],["I was thinking about Dr. Schweitzer, but can you recommend someone else for me?","Schweitzer 박사에 대해 쓸까 생각했는데, 다른 사람을 추천해 줄 수 있니?"],["She did a lot of volunteer work, especially for children.","그녀는 특히 어린이들을 위해 많은 자원봉사를 했어."]],"ev":["Liam, can you please help me? I need to find some books for my homework.","Liam, 나 좀 도와줄래? 숙제 때문에 책을 좀 찾아야 해."],"ow":["오답 ✕ — 'I need to find some books for my homework.'(숙제 때문에 책을 좀 찾아야 해.)라고 했으므로 소미가 Liam의 도움이 필요한 이유는 답할 수 있다. 정답이 아님.","오답 ✕ — 'I was thinking about Dr. Schweitzer'(Schweitzer 박사에 대해 쓸까 생각했는데)라고 했으므로 에세이 주제로 생각한 사람은 답할 수 있다. 정답이 아님.","정답 ○ — 소미가 에세이를 써야 한다고 했지만 'I need to write an essay.'(에세이를 써야 하거든.)에 제출 날짜는 나오지 않는다. 그래서 답할 수 없는 질문이다.","오답 ✕ — 'I know she was a famous actor'(유명한 배우였다는 건 알지만)라고 했으므로 Audrey Hepburn의 직업은 답할 수 있다. 정답이 아님.","오답 ✕ — 'She did a lot of volunteer work, especially for children.'(그녀는 특히 어린이들을 위해 많은 자원봉사를 했어.)라고 했으므로 특히 도운 대상은 어린이이다. 답할 수 있어서 정답이 아님."],"memo":["정답 ③: 에세이 제출 날짜는 알 수 없다.","근거: I need to write an essay.(에세이를 써야 하거든.)에는 언제까지 내는지가 없다.","함정: 에세이를 써야 한다는 말은 있어도 '언제'는 나오지 않는다"],"why":"에세이를 써야 한다는 말은 있지만 제출 날짜는 대화에 나오지 않는다."},{"n":2,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["소미는 숙제를 위해 Liam에게 도움을 요청한다.","소미는 다른 사람들을 도운 유명인에 대한 에세이를 써야 한다.","소미는 Schweitzer 박사에 관한 에세이를 쓰려고 생각하고 있다.","소미는 Audrey Hepburn이 유명한 배우라는 것을 알고 있다.","Audrey Hepburn은 특히 난민들을 돕기 위해 많은 자원봉사를 했다."],"a":4,"ans":"Audrey Hepburn은 특히 난민들을 돕기 위해 많은 자원봉사를 했다.","evs":[["She did a lot of volunteer work, especially for children.","그녀는 특히 어린이들을 위해 많은 자원봉사를 했어."],["I know she was a famous actor, but what did she do to help others?","유명한 배우였다는 건 알지만, 그녀는 다른 사람들을 돕기 위해 무엇을 했니?"]],"ev":["She did a lot of volunteer work, especially for children.","그녀는 특히 어린이들을 위해 많은 자원봉사를 했어."],"ow":["오답 ✕ — 'Liam, can you please help me?'(Liam, 나 좀 도와줄래?)라고 했으므로 소미가 숙제를 위해 Liam에게 도움을 요청한다는 말은 일치한다.","오답 ✕ — 'I'm looking for books on famous people who helped others.'(다른 사람들을 도운 유명한 사람들에 관한 책을 찾고 있어.)라고 했으므로 일치한다.","오답 ✕ — 'I was thinking about Dr. Schweitzer'(Schweitzer 박사에 대해 쓸까 생각했는데)라고 했으므로 일치한다.","오답 ✕ — 'I know she was a famous actor'(그녀가 유명한 배우였다는 건 알지만)라고 했으므로 일치한다.","정답 ○ — 'She did a lot of volunteer work, especially for children.'(그녀는 특히 어린이들을 위해 많은 자원봉사를 했어.)라고 했다. 난민이라는 말은 없어서 일치하지 않는다."],"memo":["정답 ⑤(일치하지 않는 것): 특히 난민들을 위해 자원봉사했다 ✕","근거: She did a lot of volunteer work, especially for children.(특히 어린이들을 위해 많은 자원봉사를 했어.)","함정: 도운 대상은 난민이 아니라 어린이(children)이다"],"why":"Audrey Hepburn이 특히 도운 대상은 난민이 아니라 어린이이다."}],"dlg":[["G","Liam, can you please help me? I need to find some books for my homework.","Liam, 나 좀 도와줄래? 숙제 때문에 책을 좀 찾아야 해."],["B","What kinds of books are you looking for, Somi?","어떤 종류의 책을 찾고 있니, 소미야?"],["G","I'm looking for books on famous people who helped others. I need to write an essay.","다른 사람들을 도운 유명한 사람들에 관한 책을 찾고 있어. 에세이를 써야 하거든."],["B","Who do you want to write about?","누구에 대해 쓰고 싶니?"],["G","I was thinking about Dr. Schweitzer, but can you recommend someone else for me?","Schweitzer 박사에 대해 쓸까 생각했는데, 다른 사람을 추천해 줄 수 있니?"],["B","What about Audrey Hepburn?","Audrey Hepburn은 어때?"],["G","I know she was a famous actor, but what did she do to help others?","유명한 배우였다는 건 알지만, 그녀는 다른 사람들을 돕기 위해 무엇을 했니?"],["B","She did a lot of volunteer work, especially for children.","그녀는 특히 어린이들을 위해 많은 자원봉사를 했어."],["G","Really? Then, I can write about her. Thank you!","정말? 그러면 그녀에 대해 쓸 수 있겠다. 고마워!"]]},{"qs":[{"n":3,"q":"다음 담화의 목적으로 알맞은 것은?","o":["to promote a piano concert","to introduce a famous pianist","to recommend a touching movie","to emphasize the value of rl to do?","o":["recommend a science magazine","sell a science magazine","write about science","find a science teacher","borrow a science book"],"a":0,"ans":"recommend a science magazine","evs":[["I'm really interested in science. Can you recommend a science magazine for me?","저는 과학에 정말 관심이 있어요. 과학 잡지를 추천해 주실 수 있나요?"]],"ev":["I'm really interested in science. Can you recommend a science magazine for me?","저는 과학에 정말 관심이 있어요. 과학 잡지를 추천해 주실 수 있나요?"],"ow":["정답 ○ — 소년은 'Can you recommend a science magazine for me?'(과학 잡지를 추천해 주실 수 있나요?)라고 했으므로 과학 잡지를 추천해 달라고 부탁한 것이다.","오답 ✕ — 소년은 잡지를 사려는 손님이다. 'Can you recommend a science magazine for me?'(과학 잡지를 추천해 주실 수 있나요?)라서 파는 것이 아니라 추천을 부탁했다.","오답 ✕ — 과학에 대해 글을 써 달라는 말은 없다. 소년은 'I'm really interested in science.'(저는 과학에 정말 관심이 있어요.)라고 했을 뿐이다.","오답 ✕ — 과학 선생님을 찾는 말은 없다. 'Can you recommend a science magazine for me?'(과학 잡지를 추천해 주실 수 있나요?)라서 틀림.","오답 ✕ — 책을 빌려 달라는 말은 없고, 잡지를 추천해 달라고 했다. 그래서 틀림."],"memo":["정답 ①: 과학 잡지를 추천해 달라고 했다.","근거: Can you recommend a science magazine for me?(과학 잡지를 추천해 주실 수 있나요?)","함정: sell(팔다)이 아니라 recommend(추천하다)다"],"why":"소년은 과학에 관심이 있어서 과학 잡지를 추천해 달라고 부탁했다."}],"dlg":[["B","What kinds of magazines do you have?","어떤 종류의 잡지가 있나요?"],["G","We have all kinds of magazines.","모든 종류의 잡지가 있어요."],["B","I'm really interested in science. Can you recommend a science magazine for me?","저는 과학에 정말 관심이 있어요. 과학 잡지를 추천해 주실 수 있나요?"],["G","Sure. You'll love this one, Teen's Science.","물론이죠. 이 'Teen's Science'를 아주 좋아하실 거예요."]]},{"qs":[{"n":5,"q":"What book does the girl recommend?","o":["The Time Machine","Journey to the Moon","The Magic Telescope","Robot Dreams","Space School"],"a":0,"ans":"The Time Machine","evs":[["How about The Time Machine? I think it's the best.","'타임머신'은 어때? 나는 그것이 최고라고 생각해."]],"ev":["How about The Time Machine? I think it's the best.","'타임머신'은 어때? 나는 그것이 최고라고 생각해."],"ow":["정답 ○ — 소녀는 'How about The Time Machine? I think it's the best.'(타임머신은 어때? 나는 그것이 최고라고 생각해.)라고 추천했다.","오답 ✕ — 'Journey to the Moon'은 대화에 나오지 않는 책이다. 소녀가 추천한 책은 'The Time Machine'이다.","오답 ✕ — 'The Magic Telescope'는 대화에 나오지 않는다. 소녀의 추천은 'How about The Time Machine?'이다.","오답 ✕ — 'Robot Dreams'는 대화에 나오지 않는 제목이다. 소녀는 'The Time Machine'을 추천했다.","오답 ✕ — 'Space School'은 대화에 나오지 않는다. 가장 가까운 문장은 'How about The Time Machine?'(타임머신은 어때?)이다."],"memo":["정답 ①: The Time Machine","근거: How about The Time Machine? I think it's the best.(타임머신은 어때? 나는 그것이 최고라고 생각해.)","함정: 다른 제목들은 대화에 나오지 않는다"],"why":"소녀는 공상 과학 소설로 'The Time Machine'을 추천했다."}],"dlg":[["B","What kinds of books do you usually read?","너는 보통 어떤 종류의 책을 읽니?"],["G","I usually read sci-fi novels.","나는 보통 공상 과학 소설을 읽어."],["B","Then, can you recommend a good sci-fi novel for me?","그럼, 나에게 좋은 공상 과학 소설을 추천해 줄 수 있니?"],["G","How about The Time Machine? I think it's the best.","'타임머신'은 어때? 나는 그것이 최고라고 생각해."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하지 않는 것은?","o":["한 남자가 1919년 2월 28일에 Schofield 박사의 집을 방문했다.","Schofield 박사는 다음 날 있을 한국의 독립을 위한 사건의 사진을 찍어달라고 요청받았다.","Schofield 박사는 3월 1일 오후 2시에 건물 안에 숨어 있었다.","Schofield 박사는 밖에 많은 사람이 모여드는 모습을 보았다.","Schofield 박사는 자신의 글을 통해 세계가 이 역사적인 사건을 알게 되기를 바랐다."],"a":4,"ans":"Schofield 박사는 자신의 글을 통해 세계가 이 역사적인 사건을 알게 되기를 바랐다.","evs":[["At 2 p.m. on March 1, Dr. Schofield was hiding in a building and saw a large group of people gathering outside.","3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다."],["I hope the world will learn about this important event through my pictures.","내 사진을 통해 세계가 이 중요한 사건에 대해 알게 되기를 바라."]],"ev":["At 2 p.m. on March 1, Dr. Schofield was hiding in a building and saw a large group of people gathering outside.","3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다."],"ow":["오답 ✕ — 'On February 28, 1919, a man came to Dr. Schofield's house.'(1919년 2월 28일, 한 남자가 Schofield 박사의 집에 왔다.)라고 했으므로 일치한다.","오답 ✕ — 'Could you take pictures of the event and share them with the world?'(그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?)라고 했으므로 일치한다.","오답 ✕ — 'Dr. Schofield was hiding in a building'(Schofield 박사는 한 건물에 숨어 있었다)이라고 했으므로 3월 1일 오후 2시에 건물 안에 숨어 있었다는 말은 일치한다.","오답 ✕ — 'saw a large group of people gathering outside'(밖에 많은 사람들이 모여드는 것을 보았다)라고 했으므로 일치한다.","정답 ○ — 박사는 'through my pictures'(내 사진을 통해)라고 했다. 자신의 글을 통해서라는 보기는 일치하지 않는다."],"memo":["정답 ⑤(일치하지 않는 것): 자신의 글을 통해 알려지길 바랐다 ✕","근거: I hope the world will learn about this important event through my pictures.(내 사진을 통해 세계가 이 중요한 사건에 대해 알게 되기를 바라.)","함정: 이 부분에서는 '글(article)'이 아니라 '사진(pictures)'이다"],"why":"Schofield 박사는 글이 아니라 사진을 통해 세계가 3·1운동을 알기를 바랐다."},{"n":7,"q":"Why did a man come to Dr. Schofield's house on February 28, 1919?","o":["to ask him to take pictures of the independence event","to invite him to a party","to give him a camera as a gift","to ask him to teach medicine","to tell him to leave Korea"],"a":0,"ans":"to ask him to take pictures of the independence event","evs":[["Many people are going to gather tomorrow for the independence of Korea.","내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다."],["Could you take pictures of the event and share them with the world?","그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?"]],"ev":["Many people are going to gather tomorrow for the independence of Korea.","내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다."],"ow":["정답 ○ — 남자는 'Could you take pictures of the event and share them with the world?'(그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?)라고 부탁했다.","오답 ✕ — 'I have a special favor to ask you.'(특별한 부탁이 있습니다.)라고 했을 뿐 파티에 초대하는 내용은 없어서 틀림.","오답 ✕ — 남자는 부탁하러 왔고 선물을 주러 온 것이 아니다. 'Could you take pictures of the event'(그 사건의 사진을 찍어 주실 수 있으세요?)라서 틀림.","오답 ✕ — 의학을 가르쳐 달라는 부탁은 없다. 남자의 부탁은 독립을 위한 모임의 사진을 찍는 것이다.","오답 ✕ — 'Many people are going to gather tomorrow for the independence of Korea.'(내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다.)라고 했을 뿐 떠나라는 말은 없어서 틀림."],"memo":["정답 ①: 독립 관련 행사를 사진으로 찍어 달라고 부탁하려고","근거: Could you take pictures of the event and share them with the world?(그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?)","함정: special favor(특별한 부탁)의 내용이 바로 사진 촬영이다"],"why":"남자는 독립을 위한 모임을 사진으로 찍어 세계에 알려 달라고 부탁하러 왔다."}],"pp":[["On February 28, 1919, a man came to Dr. Schofield's house.","1919년 2월 28일, 한 남자가 Schofield 박사의 집에 왔다."],["A man: Dr. Schofield, I have a special favor to ask you.","남자: Schofield 박사님, 특별한 부탁이 있습니다."],["Dr. Schofield: What can I do for you?","Schofield 박사: 제가 무엇을 해 드릴까요?"],["A man: Many people are going to gather tomorrow for the independence of Korea.","남자: 내일 한국의 독립을 위해 많은 사람들이 모일 예정입니다."],["Could you take pictures of the event and share them with the world?","그 사건의 사진을 찍어서 세계에 알려 주실 수 있으세요?"],["At 2 p.m. on March 1, Dr. Schofield was hiding in a building and saw a large group of people gathering outside.","3월 1일 오후 2시, Schofield 박사는 한 건물에 숨어 있으면서 밖에 많은 사람들이 모여드는 것을 보았다."],["He began to take pictures.","그는 사진을 찍기 시작했다."],["Dr. Schofield: Unbelievable!","Schofield 박사: 믿을 수 없어!"],["There are so many people here.","여기엔 정말 많은 사람들이 있어."],["I hope the world will learn about this important event through my pictures.","내 사진을 통해 세계가 이 중요한 사건에 대해 알게 되기를 바라."]]},{"qs":[{"n":8,"q":"윗글의 목적으로 알맞은 것은?","o":["to encourage us to follow Dr. Schofield's belief","to explain Dr. Schofield's way to learn Korean","to tell us about Dr. Schofield's Korean name","to let us know Dr. Schofield's medical skills","to show us Dr. Schofield's love for Korea"],"a":4,"ans":"to show us Dr. Schofield's love for Korea","evs":[["He believed that every country has the right to be independent, so he helped the Korean independence movement.","그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다."],["Dr. Schofield's fight for Korean independence didn't stop even after the March 1st Movement.","한국 독립을 위한 Schofield 박사의 투쟁은 3·1운동 이후에도 멈추지 않았다."]],"ev":["He believed that every country has the right to be independent, so he helped the Korean independence movement.","그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다."],"ow":["오답 ✕ — 글은 박사가 한국의 독립운동을 도왔다는 사실을 전할 뿐 우리에게 그의 믿음을 따르라고 권하는 말은 없어서 틀림.","오답 ✕ — 'he began to learn Korean right away'(곧바로 한국어를 배우기 시작했다)가 나오지만 한국어 학습법을 설명하는 글은 아니라서 틀림.","오답 ✕ — 'he loved his Korean name'(그는 자신의 한국 이름을 사랑했다)이 나오지만 한국 이름은 글 앞부분 일부분일 뿐이라서 틀림.","오답 ✕ — 'Dr. Schofield was a Canadian doctor'(Schofield 박사는 캐나다 의사였다)는 소개일 뿐 의학 실력을 알리는 글은 아니라서 틀림.","정답 ○ — 한국 이름을 사랑하고 한국어를 배우고 'he helped the Korean independence movement'(한국의 독립운동을 도왔다)이며 3·1운동 이후에도 계속 글을 썼으므로 한국에 대한 사랑을 보여 주려는 글이다."],"memo":["정답 ⑤: Schofield 박사의 한국 사랑을 보여 주기 위해","근거: he loved his Korean name(그는 자신의 한국 이름을 사랑했다) / he helped the Korean independence movement(한국의 독립운동을 도왔다)","함정: ③ 한국 이름 이야기는 한국 사랑을 보여 주는 한 예일 뿐"],"why":"한국 이름, 한국어 공부, 독립운동 지원으로 박사의 한국 사랑을 보여 주는 글이다."},{"n":9,"q":"윗글의 제목으로 알맞은 것은?","o":["Life in Korea Under Japanese Rule","How Did Korea Become Independent?","Background of the March 1st Movement","The Japanese Police Against Dr. Schofield","A Canadian Doctor Who Helped Korean Independence"],"a":4,"ans":"A Canadian Doctor Who Helped Korean Independence","evs":[["Dr. Schofield was a Canadian doctor, and he first came to Korea in 1916 to teach medicine.","Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다."],["He believed that every country has the right to be independent, so he helped the Korean independence movement.","그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다."]],"ev":["Dr. Schofield was a Canadian doctor, and he first came to Korea in 1916 to teach medicine.","Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다."],"ow":["오답 ✕ — 일본 통치 아래 한국의 삶 전체를 다루지는 않는다. 'terrible situation in Korea'(한국의 참혹한 상황)는 박사가 쓴 글의 내용 중 일부라서 틀림.","오답 ✕ — 한국이 어떻게 독립했는지는 이 글에 나오지 않는다. 박사는 독립운동을 '도왔다'(helped)고만 했다.","오답 ✕ — 3·1운동의 배경을 설명하는 글이 아니라 'Dr. Schofield heard people shouting for Korean independence'(Schofield 박사는 사람들이 독립을 외치는 소리를 들었다)처럼 박사의 행동을 다룬다. 그래서 틀림.","오답 ✕ — 'he had to go back to Canada in 1920'(1920년에 캐나다로 돌아가야 했다)는 감시를 받은 결과일 뿐 일본 경찰이 주제가 아니라서 틀림.","정답 ○ — 'Dr. Schofield was a Canadian doctor'(캐나다 의사)이며 'he helped the Korean independence movement'(한국의 독립운동을 도왔다)이므로 한국 독립을 도운 캐나다인 의사가 제목으로 알맞다."],"memo":["정답 ⑤: A Canadian Doctor Who Helped Korean Independence","근거: Dr. Schofield was a Canadian doctor ... he helped the Korean independence movement.(캐나다 의사 ... 한국의 독립운동을 도왔다.)","함정: ④ 일본 경찰은 박사가 떠나게 된 이유일 뿐 중심이 아니다"],"why":"한국의 독립을 도운 캐나다 의사 Schofield 박사의 이야기이다."},{"n":10,"q":"Why did Dr. Schofield have to go back to Canada in 1920?","o":["He wanted to open a hospital there.","He was under the watchful eye of the Japanese police.","He got sick in Korea.","He lost his camera.","He wanted to teach Korean there."],"a":1,"ans":"He was under the watchful eye of the Japanese police.","evs":[["He was under the watchful eye of the Japanese police, so he had to go back to Canada in 1920.","그는 일본 경찰의 감시를 받게 되어 1920년에 캐나다로 돌아가야 했다."]],"ev":["He was under the watchful eye of the Japanese police, so he had to go back to Canada in 1920.","그는 일본 경찰의 감시를 받게 되어 1920년에 캐나다로 돌아가야 했다."],"ow":["오답 ✕ — 병원을 열기 위해서라는 말은 없다. 'he had to go back to Canada in 1920'(1920년에 캐나다로 돌아가야 했다)라고 한 이유는 감시를 받았기 때문이다.","정답 ○ — 'He was under the watchful eye of the Japanese police, so he had to go back to Canada in 1920.'(그는 일본 경찰의 감시를 받게 되어 1920년에 캐나다로 돌아가야 했다.)이므로 맞다.","오답 ✕ — 아팠다는 말은 본문에 없다. 이유는 'under the watchful eye of the Japanese police'(일본 경찰의 감시를 받게 되어)이다.","오답 ✕ — 카메라를 잃었다는 말은 없다. 박사는 'He took pictures of the event with his camera.'(그는 카메라로 그 사건의 사진을 찍었다.)라고 했다.","오답 ✕ — 캐나다에서 한국어를 가르치려 했다는 말은 없다. 한국어는 한국에서 의학을 가르치려고 배웠다."],"memo":["정답 ②: 일본 경찰의 감시를 받아서","근거: He was under the watchful eye of the Japanese police, so he had to go back to Canada in 1920.","함정: so(그래서) 앞의 문장이 캐나다로 돌아간 이유다"],"why":"박사는 일본 경찰의 감시를 받아 1920년에 캐나다로 돌아가야 했다."}],"pp":[["Do you know Seok Hopil?","당신은 석호필을 아는가?"],["His English name was Frank W.","그의 영어 이름은 Frank W."],["Schofield, but he loved his Korean name.","Schofield였지만, 그는 자신의 한국 이름을 사랑했다."],["It sounded similar to his real name, and it also had a good meaning.","그 이름은 그의 본명과 비슷하게 들렸고 좋은 의미도 담고 있었다."],["Dr. Schofield was a Canadian doctor, and he first came to Korea in 1916 to teach medicine.","Schofield 박사는 캐나다 의사였고, 의학을 가르치기 위해 1916년에 한국에 처음 왔다."],["He wanted to teach in Korean, so he began to learn Korean right away.","그는 한국어로 가르치고 싶어서, 곧바로 한국어를 배우기 시작했다."],["He studied so hard that he was able to teach in Korean after only a few years.","그는 매우 열심히 공부해서 몇 년 만에 한국어로 가르칠 수 있게 되었다."],["He believed that every country has the right to be independent, so he helped the Korean independence movement.","그는 모든 나라는 독립할 권리가 있다고 믿었기에 한국의 독립운동을 도왔다."],["On March 1, 1919, Dr. Schofield heard people shouting for Korean independence in Tapgol Park.","1919년 3월 1일, Schofield 박사는 탑골 공원에서 사람들이 한국의 독립을 외치는 소리를 들었다."],["He took pictures of the event with his camera.","그는 카메라로 그 사건의 사진을 찍었다."],["He then wrote an article about the historic event and sent it to foreign newspapers with his pictures.","그 후 그는 이 역사적인 사건에 대한 기사를 써서 사진과 함께 외국 신문사에 보냈다."],["Dr. Schofield's fight for Korean independence didn't stop even after the March 1st Movement.","한국 독립을 위한 Schofield 박사의 투쟁은 3·1운동 이후에도 멈추지 않았다."],["He continued to write about the terrible situation in Korea for foreign newspapers.","그는 외국 신문에 한국의 참혹한 상황에 대해 계속해서 글을 썼다."],["He was under the watchful eye of the Japanese police, so he had to go back to Canada in 1920.","그는 일본 경찰의 감시를 받게 되어 1920년에 캐나다로 돌아가야 했다."]]}];

 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
