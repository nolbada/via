rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "Subin · 런던 여행기", "en": "I can’t wait telling you about my trip to London.", "ko": "런던으로 다녀온 나의 여행에 대해 너에게 어서 말해 주고 싶다.", "ok": false, "foot": [], "fixes": [{"wrong": "telling", "right": "to tell", "partial": false, "at": [3], "point": "동명사 vs to부정사: can’t wait 뒤에는 to부정사 사용", "topic": "동명사 vs to부정사", "memo": "can’t wait 뒤에는 to부정사 사용"}]}, {"n": 2, "tag": null, "en": "The flight took 15 hours from Incheon.", "ko": "비행은 인천에서부터 15시간이 걸렸다.", "ok": true, "foot": [], "fixes": []}, {"n": 3, "tag": null, "en": "When I met my friend Amelia at the airport, I was so exciting.", "ko": "내가 내 친구 Amelia를 공항에서 만났을 때, 나는 매우 신이 났다.", "ok": false, "foot": [], "fixes": [{"wrong": "exciting", "right": "excited", "partial": false, "at": [12], "point": "어법: 감정을 느끼는 주체(I)를 설명하므로 과거분사 excited 사용 (exciting은 감정을 유발하는 대상에 사용)", "topic": "어법", "memo": "감정을 느끼는 주체(I)를 설명하므로 과거분사 excited 사용 (exciting은 감정을 유발하는 대상에 사용)"}]}, {"n": 4, "tag": null, "en": "I have know her since I was 10 years old.", "ko": "내가 10살이었을 때부터 나는 그녀와 알고 지냈다.", "ok": false, "foot": [], "fixes": [{"wrong": "know", "right": "known", "partial": false, "at": [2], "point": "현재완료: have 뒤에는 과거분사 known 사용", "topic": "현재완료", "memo": "have 뒤에는 과거분사 known 사용"}]}, {"n": 5, "tag": null, "en": "She took me to many place in London. Come with I on my amazing trip!", "ko": "그녀는 나를 런던의 많은 곳에 데려가 주었다. 나의 굉장한 여행에 나와 함께 가 봐!", "ok": false, "foot": [], "fixes": [{"wrong": "place", "right": "places", "partial": false, "at": [5], "point": "어법: many 뒤에는 복수명사 places 사용", "topic": "어법", "memo": "many 뒤에는 복수명사 places 사용"}, {"wrong": "I", "right": "me", "partial": false, "at": [10], "point": "인칭대명사 격: 전치사 with 뒤에는 목적격 me 사용", "topic": "인칭대명사 격", "memo": "전치사 with 뒤에는 목적격 me 사용"}]}, {"n": 6, "tag": "Beautiful Palace", "en": "We got on the famous red bus who took we to Buckingham Palace.", "ko": "우리는 우리를 버킹엄 궁전으로 데려다준 그 유명한 빨간 버스에 올라탔다.", "ok": false, "foot": ["1Buckingham Palace 버킹엄 궁전 (영국 왕실 공식 궁전)"], "fixes": [{"wrong": "who", "rig al", "en": "Next, we goed to Camden Market.", "ko": "다음으로, 우리는 캠던 마켓에 갔다.", "ok": false, "foot": ["1Camden Market 런던의 유명한 노천 시장"], "fixes": [{"wrong": "goed", "right": "went", "partial": false, "at": [2], "point": "어법: go의 과거형은 불규칙 변화형 went 사용", "topic": "어법", "memo": "go의 과거형은 불규칙 변화형 went 사용"}]}, {"n": 13, "tag": null, "en": "This market knows for its food from around the world.", "ko": "이 시장은 세계 곳곳의 음식으로 알려져 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "knows", "right": "is known", "partial": false, "at": [2], "point": "수동태: 시장이 알려지는 대상이므로 be동사 + p.p.(is known) 사용", "topic": "수동태", "memo": "시장이 알려지는 대상이므로 be동사 + p.p.(is known) 사용"}]}, {"n": 14, "tag": null, "en": "Amelia told me try the fish and chips.", "ko": "Amelia는 나에게 피시앤칩스를 먹어 보라고 말했다.", "ok": false, "foot": [], "fixes": [{"wrong": "try", "right": "to try", "partial": false, "at": [3], "point": "어법: tell + 목적어 + to부정사 구조이므로 to try 사용", "topic": "어법", "memo": "tell + 목적어 + to부정사 구조이므로 to try 사용"}]}, {"n": 15, "tag": null, "en": "I thought, “How strangely! I have eat fish many times. But I’ve never tried it with potato chips.”", "ko": "나는 생각했다, “이상하네! 나는 생선을 여러 번 먹어 봤어. 하지만 나는 감자칩과 함께 먹어 본 적은 없어.”", "ok": false, "foot": [], "fixes": [{"wrong": "strangely", "right": "strange", "partial": false, "at": [3], "point": "어휘/어법: 감탄문 How + 형용사(strange) 구조 (strangely는 부사)", "topic": "어휘/어법", "memo": "감탄문 How + 형용사(strange) 구조 (strangely는 부사)"}, {"wrong": "eat", "right": "eaten", "partial": false, "at": [6], "point": "현재완료: have 뒤에는 과거분사 eaten 사용", "topic": "현재완료", "memo": "have 뒤에는 과거분사 eaten 사용"}]}, {"n": 16, "tag": null, "en": "But when the food came out, I founded out that they call French fries “chips” in London!", "ko": "그러나 음식이 나왔을 때, 나는 그들이 런던에서 프렌치프라이(감자튀김)를 ‘칩스’라고 부른다는 것을 알게 되었다!", "ok": false, "foot": [], "fixes": [{"wrong": "founded", "right": "found", "partial": false, "at": [7], "point": "어법: find의 과거형은 불규칙 변화형 found 사용", "topic": "어법", "memo": "find의 과거형은 불규칙 변화형 found 사용"}]}, {"n": 17, "tag": null, known for its food from around the world.", "이 시장은 세계 곳곳의 음식으로 알려져 있다.", 0], ["Amelia told me to try the fish and chips.", "Amelia는 나에게 피시앤칩스를 먹어 보라고 말했다.", 0], ["I thought, “How strange! I have eaten fish many times. But I’ve never tried it with potato chips.”", "나는 생각했다, “이상하네! 나는 생선을 여러 번 먹어 봤어. 하지만 나는 감자칩과 함께 먹어 본 적은 없어.”", 0], ["But when the food came out, I found out that they call French fries “chips” in London!", "그러나 음식이 나왔을 때, 나는 그들이 런던에서 프렌치프라이(감자튀김)를 ‘칩스’라고 부른다는 것을 알게 되었다!", 0], ["After a yummy British meal, we walked around the market.", "맛있는 영국 음식을 먹은 후, 우리는 시장을 돌아다녔다.", 0], ["We saw the most famous red phone booth in London and took more pictures.", "우리는 런던에서 가장 유명한 빨간색 공중전화 부스를 보았고 더 많은 사진을 찍었다.", 0], ["Then I bought a pretty plate for my mom. What a fun day!", "그러고 나서 나는 엄마를 위해 예쁜 접시를 하나 샀다. 정말 재밌는 하루였다!", 0], ["London often has rainy weather.", "런던은 비가 자주 온다.", 0], ["It rained a little today, but Amelia didn’t have an umbrella.", "오늘은 비가 조금 내렸지만, Amelia는 우산을 가지고 있지 않았다.", 0], ["She said that most Londoners use umbrellas only for heavy rain.", "그녀는 대부분의 런던 사람들이 폭우에만 우산을 사용한다고 말했다.", 0], ["I was surprised to hear that.", "나는 그 말을 듣고 놀랐다.", 0], ["I asked Amelia to take me to King’s Cross Station.", "나는 Amelia에게 나를 킹스 크로스 역으로 데려가 달라고 부탁했다.", 0], ["I wanted to see this train station because of the Harry Potter movies. They were filmed at this station.", "나는 ‘해리 포터’ 영화 때문에 이 기차역을 보고 싶었다. 그것들은 이 역에서 촬영되었다.", 0], ["Look! We found Platform 9¾!", "봐라! 우리는 9와 3/4 승강장을 찾았다!", 0], ["Amelia and I pretended we were in the movies. We took lots of selfies.", "Amelia와 나는 우리가 영화 속에 나오는 척했다. 우리는 많은 셀카를 찍었다.", 0], ["If you look carefully, can you find the secret way to Hogwarts?", "만약 네가 주의 깊게 살펴본다면, 너는 호그와트로 가는 비밀 통로를 찾을 수 있니?", 0], ["It was time to go home.", "집에 갈 시간이 되었다.", 0], ["Amelia said, “Let’s take the tube.” I asked, “What’s the tube?”", "Amelia는 “튜브를 타자.”라고 말했다. 나는 “튜브가 뭐야?”라고 물었다.", 0], ["She told me, “In London, we call the subway the tube. That’s because the subway tunnels are round like a tube.”", "그녀는 나에게 말했다, “런던에서는, 지하철을 튜브라고 불러. 그것은 지하철 터널들이 관[통]처럼 원형이기 때문이야.”", 0], ["On the tube, Amelia asked me, “Red is something special in London. Did you see many red things?”", "튜브에서, Amelia가 내게 물었다, “빨간색은 런던의 특별한 색이야. 너는 빨간 것들을 많이 봤니?”", 0], ["I certainly did! How many red things can you spot in my photos?", "나는 확실히 그랬다! 너는 내 사진에서 빨간 것들을 몇 개나 발견할 수 있니?", 0]];var RNUM=35;var TITLE_EN="See You in London!";var PASS_EN=["See You in London!", "I can’t wait to tell you about my trip to London. The flight took 15 hours from Incheon. When I met my friend Amelia at the airport, I was so excited. I have known her since I was 10 years old. She took me to many places in London. Come with me on my amazing trip!", "We got on the famous red bus that took us to Buckingham Palace. The King and his family live there. We saw the King’s Guard. The guards were wearing red jackets and tall black hats. We took pictures near them, but they didn’t smile or move. They were like statues!", "Next, we went to Camden Market. This market is known for its food from around the world. Amelia told me to try the fish and chips. I thought, “How strange! I have eaten fish many times. But I’ve never tried it with potato chips.” But when the food came out, I found out that they call French fries “chips” in London! After a yummy British meal, we walked around the market. We saw the most famous red phone booth in London and took more pictures. Then I bought a pretty plate for my mom. What a fun day!", "London often has rainy weather. It rained a little today, but Amelia didn’t have an umbrella. She said that most Londoners use umbrellas only for heavy rain. I was surprised to hear that. I asked Amelia to take me to King’s Cross Station. I wanted to see this train station because of the Harry Potter movies. They were filmed at this station. Look! We found Platform 9¾! Amelia and I pretended we were in the movies. We took lots of selfies. If you look carefully, can you find the secret way to Hogwarts?", "It was time to go home. Amelia said, “Let’s take the tube.” I asked, “What’s the tube?” She told me, “In London, we call the subway the tube. That’s because the subway tunnels are round like a tube.” On the tube, Amelia asked me, “Red is something special in London. Did you see many red things?” I certainly did! How many red things can you spot in my photos?"];var PASS_KO=["런던에서 만나!", "런던으로 다녀온 나의 여행에 대해 너에게 어서 말해 주고 싶다. 비행은 인천에서부터 15시간이 걸렸다. 내가 내 친구 Amelia를 공항에서 만났을 때, 나는 매우 신이 났다. 내가 10살이었을 때부터 나는 그녀와 알고 지냈다. 그녀는 나를 런던의 많은 곳에 데려가 주었다. 나의 굉장한 여행에 나와 함께 가 봐!", "우리는 우리를 버킹엄 궁전으로 데려다준 그 유명한 빨간 버스에 올라탔다. 왕과 그의 가족이 그곳에 산다. 우리는 국왕 근위대를 보았다. 근위병들은 빨간색 재킷과 높은 검은색 모자를 쓰고 있었다. 우리는 그들 근처에서 사진을 찍었지만, 그들은 웃거나 움직이지 않았다. 그들은 조각상들 같았다!", "다음으로, 우리는 캠던 마켓에 갔다. 이 시장은 세계 곳곳의 음식으로 알려져 있다. Amelia는 나에게 피시앤칩스를 먹어 보라고 말했다. 나는 생각했다, “이상하네! 나는 생선을 여러 번 먹어 봤어. 하지만 나는 감자칩과 함께 먹어 본 적은 없어.” 그러나 음식이 나왔을 때, 나는 그들이 런던에서 프렌치프라이(감자튀김)를 ‘칩스’라고 부른다는 것을 알게 되었다! 맛있는 영국 음식을 먹은 후, 우리는 시장을 돌아다녔다. 우리는 런던에서 가장 유명한 빨간색 공중전화 부스를 보았고 더 많은 사진을 찍었다. 그러고 나서 나는 엄마를 위해 예쁜 접시를 하나 샀다. 정말 재밌는 하루였다!", "런던은 비가 자주 온다. 오늘은 비가 조금 내렸지만, Amelia는 우산을 가지고 있지 않았다. 그녀는 대부분의 런던 사람들이 폭우에만 우산을 사용한다고 말했다. 나는 그 말을 듣고 놀랐다. 나는 Amelia에게 나를 킹스 크로스 역으로 데려가 달라고 부탁했다. 나는 ‘해리 포터’ 영화 때문에 이 기차역을 보고 싶었다. 그것들은 이 역에서 촬영되었다. 봐라! 우리는 9와 3/4 승강장을 찾았다! Amelia와 나는 우리가 영화 속에 나오는 척했다. 우리는 많은 셀카를 찍었다. 만약 네가 주의 깊게 살펴본다면, 너는 호그와트로 가는 비밀 통로를 찾을 수 있니?", "집에 갈 시간이 되었다. Amelia는 “튜브를 타자.”라고 말했다. 나는 “튜브가 뭐야?”라고 물었다. 그녀는 나에게 말했다, “런던에서는, 지하철을 튜브라고 불러. 그것은 지하철 터널들이 관[통]처럼 원형이기 때문이야.” 튜브에서, Amelia가 내게 물었다, “빨간색은 런던의 특별한 색이야. 너는 빨간 것들을 많이 봤니?” 나는 확실히 그랬다! 너는 내 사진에서 빨간 것들을 몇 개나 발견할 수 있니?"];var DG=[{"dlg": [["G", "Hi, Jinsu. Can I ask you something?", "안녕, 진수야. 뭐 하나 물어봐도 될까?"], ["B", "Sure, Sara. What’s up?", "물론이지, Sara. 무슨 일이야?"], ["G", "Mark, my friend from Canada, wants to experience Korean culture.", "캐나다에서 온 내 친구 Mark가 한국 문화를 경험하고 싶어 해."], ["B", "How about taking him to the traditional market in our town? There are lots of things to eat and see.", "그를 우리 동네 전통 시장에 데려가는 게 어때? 먹을 것과 볼 것이 많이 있어."], ["G", "That’s a good idea! How can I get there?", "좋은 생각이야! 거기에 어떻게 가?"], ["B", "Take the No. 11 bus in front of the school and get off at the fifth stop.", "학교 앞에서 11번 버스를 타고 다섯 번째 정류장에서 내려."], ["G", "Okay. How long will it take to get to the market?", "알았어. 시장까지 가는 데 얼마나 걸려?"], ["B", "It will take about 20 minutes.", "약 20분 걸릴 거야."], ["G", "All right. Thanks.", "알았어. 고마워."], ["B", "No problem. Have a good time with your friend!", "천만에. 친구와 좋은 시간 보내!"]], "qs": [{"n": 1, "q": "위 대화를 읽고 알 수 없는 것은?", "o": ["Mark의 국적", "진수가 전통 시장을 추천하는 이유", "전통 시장에서 가장 인기 있는 먹거리", "전통 시장에 가는 방법", "시장까지 버스로 가는 데 걸리는 소요 시간"], "a": 2, "evs": [["B: How about taking him to the traditional market in our town? There are lots of things to eat and see.", "그를 우리 동네 전통 시장에 데려가는 게 어때? 먹을 것과 볼 것이 많이 있어."]], "ans": "전통 시장에서 가장 인기 있는 먹거리", "ev": ["B: How about taking him to the traditional market in our town? There are lots of things to eat and see.", "그를 우리 동네 전통 시장에 데려가는 게 어때? 먹을 것과 볼 것이 많이 있어."], "memo": ["B: How about taking him to the traditional market in our town? There are lots of things to eat and see.  (그를 우리 동네 전통 시장에 데려가는 게 어때? 먹을 것과 볼 것이 많이 있어.)"]}]}, {"dlg": [["Clerk", "Hi, may I help you?", "안녕하세요, 도와드릴까요?"], ["Hana", "Yes. How can I get to Central Station?", "네. 중앙역에 어떻게 가나요?"], ["Clerk", "There are two ways. You can take the bus or the train.", "두 가지 방법이 있어요. 버스나 기차를 타시면 돼요."], ["Hana", "Which one is faster?", "어느 것이 더 빠른가요?"], ["Clerk", "At this time of day, there’s a lot of traffic around the airport. So, the train is faster.", "하루 중 이 시간에는 공항 주변에 교통량이 많아요. 그래서 기차가 더 빨라요."], ["Hana", "I see. How long will it take?", "그렇군요. 얼마나 걸릴까요?"], ["Clerk", "It will take about 30 minutes.", "약 30분 걸릴 거예요."], ["Hana", "Great. Where can I take the train?", "좋아요. 기차는 어디에서 탈 수 있나요?"], ["Clerk", "Go that way and follow the sign for the train.", "저쪽으로 가서 기차 표지판을 따라가세요."], ["Hana", "Okay. Thanks for your help.", "알겠어요. 도와주셔서 감
