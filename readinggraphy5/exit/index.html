를 계기로 이 직업에 새 사람들이 많이 들어왔다."],"r":{"a":"1) 그가 은퇴하면서 이 독특한 직업은 끝을 맺었다.","ev":"11번 문장","s":[[11,"His retirement marked the end of this unique job.","그의 은퇴는 이 독특한 직업의 끝을 알렸다."]],"w":"11번 문장 His retirement marked the end of this unique job. (그의 은퇴는 이 독특한 직업의 끝을 알렸다)","c":1},"h":"61fa3a5c17"},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","h":"666f421433","ko":"본문의 내용과 일치하는 것은?","oko":["노커 어퍼는 절대 변하지 않는 고정 요금을 받았다.","알람 시계는 산업혁명 이전에 보편화되었다.","노커 어퍼라는 직업은 1940년대에 모든 곳에서 사라졌다.","노커 어퍼는 사람들을 깨우려고 막대, 부드러운 망치, 또는 완두콩 총을 들고 다녔다."],"opts":["Knocker-uppers received a fixed fee that never changed.","Alarm clocks became common before the Industrial Revolution.","The job of the knocker-upper disappeared everywhere in the 1940s.","Knocker-uppers carried sticks, soft hammers, or pea shooters to wake people."],"r":{"a":"4) Knocker-uppers carried sticks, soft hammers, or pea shooters to wake people.","ev":"4번 문장","s":[[4,"As the sun began to rise, knocker-uppers walked through the streets carrying long sticks, soft hammers, or pea shooters.","해가 뜨기 시작할 때, 노커 어퍼는 긴 막대, 부드러운 재질의 망치, 또는 완두콩 총을 든 채 거리를 걸었다."]],"w":"4번 문장 carrying long sticks, soft hammers, or pea shooters. 1은 7번(varied)과 반대, 2는 8번(1940~50년대)과 어긋남, 3은 9번(일부 지역은 1970년대까지)과 반대.","c":4}},{"n":9,"t":"sum","q":"Alarm clocks and (A) became common, so the job of the knocker-upper became (B) popular.","ko":"알람 시계와 (A)이(가) 보편화되자, 노커 어퍼라는 직업은 (B) 인기 있게 되었다.","oko":["(A) 전기 / (B) 덜","(A) 전기 / (B) 더","(A) 막대 / (B) 덜","(A) 망치 / (B) 더","(A) 막대 / (B) 더"],"opts":["(A) electricity / (B) less","(A) electricity / (B) more","(A) sticks / (B) less","(A) hammers / (B) more","(A) sticks / (B) more"],"r":{"a":"1) (A) electricity / (B) less ((A) 전기 / (B) 덜)","ev":"8번 문장","s":[[8,"By the 1940s and 1950s, alarm clocks and electricity became common and made the job less popular.","1940년대와 1950년대쯤에는, 알람 시계와 전기가 보편화되었고 그 직업을 덜 인기 있게 만들었다."]],"w":"8번 문장 alarm clocks and electricity became common and made the job less popular.","c":1},"h":"9bfcae923c"},{"n":10,"t":"fill","q":"During the Industrial Revolution in Britain, many workers [A] [B] waking up on time for work.","ko":"영국의 산업혁명 당시, 많은 노동자들이 출근 시간에 맞춰 일어나는 데 [B]이(가) [A].","bko":{"needed":"필요했다 (need의 과거형)","help":"도움","varied":"달라졌다 (vary의 과거형)","retired":"은퇴했다 (retire의 과거형)","fee":"요금","windows":"창문들 (window의 복수형)"},"bank":["needed","help","varied","retired","fee","windows"],"r":{"a":"[A] needed (필요했다 (need의 과거형)), [B] help (도움)","ev":"2번 문장","s":[[2,"During the Industrial Revolution in Britain, many workers needed help waking up on time for work.","영국의 산업혁명 당시, 많은 노동자들이 출근 시간에 맞춰 일어나는 데 도움이 필요했다."]],"w":"2번 문장 \"many workers needed help waking up on time for work\"에서 가져옴. [A]는 workers 뒤 과거형 동사, [B]는 그 목적어 명사.","c":null},"h":"7ee58aa9fe"}]},{"u":3,"id":"r07","no":7,"ko":"상상 속 반려견을 직접 만난다면?","items":[{"n":1,"t":"tf","q":"Parents take a photo of the drawing their child made.","h":"a6c58c7f2e","ko":"부모가 아이가 그린 그림의 사진을 찍는다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Here’s how it works: kids draw their dream dog, and parents take a photo of the drawing.","이렇게 진행된다: 아이들이 꿈에 그리던 개를 그리고, 부모가 그 그림의 사진을 찍는다."]],"w":"4번 문장에 kids draw their dream dog, and parents take a photo of the drawing. 부모가 그림 사진을 찍음.","c":"T"}},{"n":2,"t":"tf","q":"Rescue Doodle matches a drawing with a dog in a faraway country.","h":"e86980f6cd","ko":"Rescue Doodle은 그림을 먼 나라에 있는 개와 연결시킨다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Using advanced AI technology, the program matches the drawing with an adoptable dog in nearby shelters.","첨단 AI 기술을 활용하여, 그 프로그램은 그림을 인근 보호소에 있는 입양 가능한 개와 연결시켜 준다."]],"w":"6번 문장에서 연결 대상은 nearby shelters의 입양 가능한 개. 먼 나라가 아니라 근처 보호소.","c":"F"}},{"n":3,"t":"tf","q":"About three million dogs enter shelters in the United States each year.","h":"d751538a00","ko":"미국에서는 매년 약 300만 마리의 개가 보호소에 들어간다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Each year, about three million dogs enter shelters across the United States.","매년, 약 300만 마리의 개가 미국 전역의 보호소에 들어온다."]],"w":"10번 문장에 Each year, about three million dogs enter shelters across the United States. 그대로 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Rescue Doodle matches the drawing with an adoptable dog in nearby shelters.","h":"4ea65fe347","ko":"Rescue Doodle은 그림을 근처 보호소의 입양 가능한 개와 연결한다.","opts":["사랑스러운","입양할 수 있는","길 잃은","훈련된"],"word":"adoptable","r":{"a":"2) 입양할 수 있는","ev":"6번 문장","s":[[6,"Using advanced AI technology, the program matches the drawing with an adoptable dog in nearby shelters.","첨단 AI 기술을 활용하여, 그 프로그램은 그림을 인근 보호소에 있는 입양 가능한 개와 연결시켜 준다."]],"w":"adoptable = adopt(입양하다)에 -able(~할 수 있는)이 붙은 형용사. 보호소의 개이므로 '입양할 수 있는'.","c":2}},{"n":5,"t":"vocab","q":"Once a match is found, families can visit the shelter to meet the dog.","ko":"일치하는 개가 발견되면, 가족들은 그 개를 만나러 보호소를 방문할 수 있다.","opts":["성냥","시합, 경기","일치하는 것, 짝","경기장"],"word":"match","r":{"a":"3) 일치하는 것, 짝","ev":"7번 문장","s":[[7,"Once a match is found, families can visit the shelter to meet the dog.","일치하는 개가 발견되면, 가족들은 그 개를 만나기 위해 보호소를 방문할 수 있다."]],"w":"match는 다의어. 여기서는 그림과 연결된 개, 즉 '일치하는 것'이라는 명사 뜻. '시합'은 문맥에 맞지 않음.","c":3},"h":"5e61f9ffb6"},{"n":6,"t":"ref","q":"In sentence 8, 'They' refers to ___.","ko":"8번 문장의 They가 가리키는 것은?","sko":"그들은 그 개가 자신들의 생활 방식, 에너지 수준, 그리고 기존의 가족 구성원인 사람과 반려동물 모두와 얼마나 잘 맞는지를 신중하게 고려한다.","opts":["근처 보호소 직원들","입양을 기다리는 개들","프로그램을 만든 개발자들","보호소를 방문한 가족들"],"r":{"a":"4) 보호소를 방문한 가족들","ev":"7~8번 문장","s":[[7,"Once a match is found, families can visit the shelter to meet the dog.","일치하는 개가 발견되면, 가족들은 그 개를 만나기 위해 보호소를 방문할 수 있다."],[8,"They carefully consider how well the dog suits their lifestyle, energy level, and existing family members, both human and pet.","그들은 그 개가 자신들의 생활 방식, 에너지 수준, 그리고 기존의 가족 구성원인 사람과 반려동물 모두와 얼마나 잘 맞는지를 신중하게 고려한다."]],"w":"7번 문장의 families can visit the shelter 다음에 They가 이어짐. 개가 자신들의 생활 방식에 맞는지 따져 보는 주체는 가족.","c":4},"h":"e63d48872b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As long as everything goes smoothly, they get to bring their dream dog home!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모든 것이 순조롭게 진행되면, 그들은 꿈에 그리던 개를 집에 데려가게 된다!","opts":["모든 과정이 순조로운 한, 꿈의 개를 집으로 데려올 수 있음","모든 것이 순조롭든 아니든 개를 집으로 데려가야 함","개를 집에 데려온 뒤에야 모든 것이 순조로워짐","꿈의 개를 찾으면 곧바로 순조롭게 입양이 끝남"],"r":{"a":"1) 모든 과정이 순조로운 한, 꿈의 개를 집으로 데려올 수 있음","ev":"9번 문장","s":[[9,"As long as everything goes smoothly, they get to bring their dream dog home!","모든 것이 순조롭게 진행되면, 그들은 꿈에 그리던 개를 집에 데려가게 된다!"]],"w":"as long as = ~하기만 하면. 순조롭다는 조건이 충족될 때 집에 데려올 수 있다는 뜻. 조건이 있다는 점이 핵심.","c":1},"h":"159b4e9065"},{"n":8,"t":"match","q":"Which is consistent with the passage?","ko":"글의 내용과 일치하는 것은?","oko":["부모가 개를 그리고, 아이들이 사진을 보낸다.","그 프로그램은 18,000건이 넘는 성공적인 연결을 이루어 왔다.","가족들은 일치하는 개가 발견되는 즉시 그 개를 입양해야 한다.","Rescue Doodle은 작은 한 마을에서만 운영된다."],"opts":["Parents draw the dog, and kids send the photo.","The program has helped make more than 18,000 successful matches.","Families must adopt the dog right after a match is found.","Rescue Doodle works only in one small town."],"r":{"a":"2) The program has helped make more than 18,000 successful matches. (그 프로그램은 18,000건이 넘는 성공적인 연결을 이루어 왔다.)","ev":"12번 문장","s":[[12,"Since its launch, the program has facilitated over 18,000 successful matches.","프로그램의 출시 이후, 그것은 18,000건 이상의 성공적인 연결을 가능하게 해왔다."]],"w":"12번 문장 the program has facilitated over 18,000 successful matches. ①은 4~5번(아이가 그리고 부모가 사진을 보냄)과 반대, ③은 9번과 어긋나고 ④는 13번(전국)과 어긋남.","c":2},"h":"89b0186ac3"},{"n":9,"t":"sum","q":"Rescue Doodle uses (A) ___ to match kids' drawings with dogs, helping shelter dogs find (B) ___.","h":"32ea2c6ca7","ko":"Rescue Doodle은 (A)를 이용해 아이들의 그림을 개와 연결하고, 보호소 개들이 (B)를 찾도록 돕는다.","oko":["(A) 보호소 지도 / (B) 사랑 넘치는 가정","(A) 인간 자원봉사자 / (B) 새 장난감","(A) AI 기술 / (B) 의료 처치","(A) AI 기술 / (B) 사랑 넘치는 가정","(A) 문자 메시지 / (B) 훈련 학교"],"opts":["(A) a shelter map / (B) loving homes","(A) human volunteers / (B) new toys","(A) AI technology / (B) medical care","(A) AI technology / (B) loving homes","(A) text messages / (B) training schools"],"r":{"a":"4) (A) AI technology / (B) loving homes","ev":"6번, 11번 문장","s":[[6,"Using advanced AI technology, the program matches the drawing with an adoptable dog in nearby shelters.","첨단 AI 기술을 활용하여, 그 프로그램은 그림을 인근 보호소에 있는 입양 가능한 개와 연결시켜 준다."],[11,"Rescue Doodle not only helps these dogs find loving homes but also helps families adopt their dream dog through a fun, engaging process.","Rescue Doodle은 이러한 개들이 사랑 넘치는 가정을 찾도록 도울 뿐만 아니라 가족들이 재미있고 흥미로운 과정을 통해 꿈꾸던 개를 입양하도록 돕는다."]],"w":"6번 문장에서 advanced AI technology로 그림과 개를 연결하고, 11번 문장에서 이 개들이 loving homes를 찾도록 돕는다고 함. text message는 사진을 보내는 수단일 뿐 연결 도구가 아님.","c":4}},{"n":10,"t":"fill","q":"Many imagine their [A] furry friend, often [B] their imagination into drawings.","ko":"많은 아이들은 그들의 [A] 털북숭이 친구를 상상하며, 종종 그들의 상상을 그림으로 [B].","bko":{"finding":"찾는 (find의 -ing형)","ideal":"이상적인","visiting":"방문하는 (visit의 -ing형)","turning":"바꾸는 (turn의 -ing형)","adopting":"입양하는 (adopt의 -ing형)","matching":"짝짓는 (match의 -ing형)"},"bank":["finding","ideal","visiting","turning","adopting","matching"],"r":{"a":"[A] ideal (이상적인), [B] turning (바꾸는 (turn의 -ing형))","ev":"2번 문장","s":[[2,"Many imagine their ideal furry friend, often turning their imagination into drawings.","많은 아이들은 그들의 이상적인 털북숭이 친구를 상상하며, 종종 그들의 상상을 그림으로 나타낸다."]],"w":"2번 문장 \"Many imagine their ideal furry friend, often turning their imagination into drawings.\"에서 가져옴. [A]는 friend를 꾸미는 형용사, [B]는 turning ... into(~으로 바꾸다).","c":null},"h":"37df495c19"}]},{"u":3,"id":"r08","no":8,"ko":"깜빡 속았지? 그냥 내 장식이야!","items":[{"n":1,"t":"tf","q":"Plants in the South African desert have a long rainy season.","h":"a9b6dc086d","ko":"남아프리카 사막의 식물들은 긴 우기를 가진다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"With only a short rainy season, they must quickly grow flowers, attract pollinators, and produce seeds before water ⓑ runs out.","짧은 우기 때문에, 그것들은 물이 고갈되기 전에 빠르게 꽃을 피우고, 꽃가루 매개체를 유인하며, 씨앗을 생산해야 한다."]],"w":"2번 문장에 With only a short rainy season. 우기가 짧음.","c":"F"}},{"n":2,"t":"tf","q":"The South African daisy creates fake female flies on its petals.","h":"463d7b3b0d","ko":"남아프리카 데이지는 꽃잎에 가짜 암컷 파리를 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It uses bright colors and sweet smells to attract pollinators, but it also has another ⓒ brilliant trick: creating fake female flies on its petals!","그것은 꽃가루 매개체를 유인하는 데 밝은색과 달콤한 냄새를 사용하지만, 또 다른 탁월한 속임수도 가지고 있는데, 바로 꽃잎 위에 가짜 암컷 파리를 만들어내는 것이다!"]],"w":"4번 문장에 creating fake female flies on its petals. 그대로 일치.","c":"T"}},{"n":3,"t":"tf","q":"The male fly succeeds in mating with the fake fly.","h":"d3ce0c7e9f","ko":"수컷 파리는 가짜 파리와 짝짓기에 성공한다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"The male fly lands on the flower and attempts to mate with the fake fly.","수컷 파리는 꽃에 내려앉아 가짜 파리와 짝짓기하려고 시도한다."],[7,"While its efforts fail, the daisy ⓔ benefits by collecting pollen from the male fly.","그것의 노력이 실패하는 동안, 데이지는 수컷 파리로부터 꽃가루를 얻어 이익을 얻는다."]],"w":"6번 문장은 시도(attempts)이고 7번 문장에서 efforts fail. 짝짓기는 실패하고 데이지만 꽃가루를 얻음.","c":"F"}},{"n":4,"t":"vocab","q":"Among them, it’s the South African daisy that has adapted best to this harsh environment.","h":"7ab6fa3b72","ko":"그중에서 이 혹독한 환경에 가장 잘 적응한 것은 바로 남아프리카 데이지이다.","opts":["아름다운","혹독한","조용한","익숙한"],"word":"harsh","r":{"a":"2) 혹독한","ev":"3번 문장","s":[[3,"Among them, it’s the South African daisy that has adapted best to this harsh environment.","그중에서도, 이 혹독한 환경에 가장 잘 적응한 것은 바로 남아프리카 데이지이다."]],"w":"harsh = 혹독한, 열악한. 건조하고 비가 짧은 사막 환경을 가리킴. 1번 문장의 dry, tough와 같은 흐름.","c":2}},{"n":5,"t":"vocab","q":"This clever trick enables the daisy to secure its existence in the challenging environment.","h":"c2bdd0c827","ko":"이 영리한 속임수는 데이지가 힘든 환경에서 자신의 존재를 지킬 수 있게 해 준다.","opts":["나누다","묶어 고정하다","포기하다","지키다, 확보하다"],"word":"secure","r":{"a":"4) 지키다, 확보하다","ev":"8번 문장","s":[[8,"This clever trick enables the daisy to secure its existence in the challenging environment.","이 기발한 속임수는 힘든 환경에서도 데이지가 자신의 존재를 지켜낼 수 있게 해준다."]],"w":"secure는 동사로 '지키다; 확보하다'. 존재(existence)를 지키는 문맥. '안전한'은 형용사 뜻이라 품사가 맞지 않음.","c":4}},{"n":6,"t":"ref","q":"In sentence 3, 'them' refers to ___.","h":"69ac8c1112","ko":"3번 문장의 them이 가리키는 것은?","sko":"그중에서도, 가장 잘 적응한 것은 바로 남아프리카 데이지이다","opts":["사막의 식물들","꽃가루 매개체들","암컷 파리들","우기의 날들"],"r":{"a":"1) 사막의 식물들","ev":"1~3번 문장","s":[[1,"In the dry desert of South Africa, plants face tough competition for ⓐ survival.","남아프리카의 건조한 사막에서, 식물들은 생존을 위한 치열한 경쟁에 직면한다."],[2,"With only a short rainy season, they must quickly grow flowers, attract pollinators, and produce seeds before water ⓑ runs out.","짧은 우기 때문에, 그것들은 물이 고갈되기 전에 빠르게 꽃을 피우고, 꽃가루 매개체를 유인하며, 씨앗을 생산해야 한다."],[3,"Among them, it’s the South African daisy that has adapted best to this harsh environment.","그중에서도, 이 혹독한 환경에 가장 잘 적응한 것은 바로 남아프리카 데이지이다."]],"w":"3번 문장은 그중에서 데이지가 가장 잘 적응했다는 내용. 데이지는 식물이므로 them은 1~2번 문장의 plants. 바로 앞 pollinators가 아님에 주의.","c":1}},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The male fly lands on the flower and attempts to mate with the fake fly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"수컷 파리는 꽃에 내려앉아 가짜 파리와 짝짓기하려고 시도한다.","opts":["수컷 파리가 꽃에 내려앉아 가짜 파리와 짝짓기를 시도한다.","수컷 파리가 꽃에서 날아가 진짜 파리를 찾는다.","암컷 파리가 꽃에 내려앉아 꽃가루를 모은다.","수컷 파리가 가짜 파리를 먹으려고 한다."],"r":{"a":"1) 수컷 파리가 꽃에 내려앉아 가짜 파리와 짝짓기를 시도한다.","ev":"6번 문장","s":[[6,"The male fly lands on the flower and attempts to mate with the fake fly.","수컷 파리는 꽃에 내려앉아 가짜 파리와 짝짓기하려고 시도한다."]],"w":"6번 문장 The male fly lands on the flower and attempts to mate with the fake fly.","c":1},"h":"9c7eb5f7f8"},{"n":8,"t":"match","q":"Which is consistent with the passage?","ko":"글의 내용과 일치하는 것은?","oko":["꽃가루 매개체는 오직 가짜 파리에게만 끌린다.","가짜 파리는 납작하고 털이 많은 돌기가 없다.","데이지는 자기 위에 내려앉은 수컷 파리에게서 꽃가루를 얻는다.","수컷 파리는 꽃잎 위의 가짜 파리를 무시한다."],"opts":["Pollinators are attracted only by the fake flies.","The fake flies look flat and have no hairy bumps.","The daisy gets pollen from the male fly that lands on it.","Male flies ignore the fake flies on the petals."],"r":{"a":"3) The daisy gets pollen from the male fly that lands on it. (데이지는 자기 위에 내려앉은 수컷 파리에게서 꽃가루를 얻는다.)","ev":"4~7번 문장","s":[[4,"It uses bright colors and sweet smells to attract pollinators, but it also has another ⓒ brilliant trick: creating fake female flies on its petals!","그것은 꽃가루 매개체를 유인하는 데 밝은색과 달콤한 냄새를 사용하지만, 또 다른 탁월한 속임수도 가지고 있는데, 바로 꽃잎 위에 가짜 암컷 파리를 만들어내는 것이다!"],[6,"The male fly lands on the flower and attempts to mate with the fake fly.","수컷 파리는 꽃에 내려앉아 가짜 파리와 짝짓기하려고 시도한다."],[7,"While its efforts fail, the daisy ⓔ benefits by collecting pollen from the male fly.","그것의 노력이 실패하는 동안, 데이지는 수컷 파리로부터 꽃가루를 얻어 이익을 얻는다."]],"w":"7번 문장 the daisy benefits by collecting pollen from the male fly. ①은 4번(밝은 색·냄새로도 유인), ②는 5번(입체적인 가짜 파리), ④는 6번(수컷이 짝짓기를 시도)과 어긋남.","c":3},"h":"432417e40d"},{"n":9,"t":"sum","q":"In the dry desert, plants must quickly (A) flowers and produce (B) before water runs out.","ko":"건조한 사막의 식물들은 물이 고갈되기 전에 빠르게 꽃을 (A)고 (B)을(를) 생산해야 한다.","oko":["(A) 피우다 / (B) 씨앗","(A) 피우다 / (B) 비","(A) 자르다 / (B) 씨앗","(A) 자르다 / (B) 비","(A) 숨기다 / (B) 비"],"opts":["(A) grow / (B) seeds","(A) grow / (B) rain","(A) cut / (B) seeds","(A) cut / (B) rain","(A) hide / (B) rain"],"r":{"a":"1) (A) grow / (B) seeds ((A) 피우다 / (B) 씨앗)","ev":"2번 문장","s":[[2,"With only a short rainy season, they must quickly grow flowers, attract pollinators, and produce seeds before water ⓑ runs out.","짧은 우기 때문에, 그것들은 물이 고갈되기 전에 빠르게 꽃을 피우고, 꽃가루 매개체를 유인하며, 씨앗을 생산해야 한다."]],"w":"2번 문장 they must quickly grow flowers, attract pollinators, and produce seeds before water runs out.","c":1},"h":"3c8878deab"},{"n":10,"t":"fill","q":"In the dry desert of South Africa, plants face [A] competition for [B].","ko":"남아프리카의 건조한 사막에서, 식물들은 [B]을(를) 위한 [A] 경쟁에 직면한다.","bko":{"survival":"생존","tough":"치열한, 힘든","attract":"유인하다","lands":"내려앉는다 (land의 3인칭 단수)","mate":"짝짓기하다","smells":"냄새들 (smell의 복수형)"},"bank":["survival","tough","attract","lands","mate","smells"],"r":{"a":"[A] tough (치열한, 힘든), [B] survival (생존)","ev":"1번 문장","s":[[1,"In the dry desert of South Africa, plants face tough competition for ⓐ survival.","남아프리카의 건조한 사막에서, 식물들은 생존을 위한 치열한 경쟁에 직면한다."]],"w":"1번 문장 \"plants face tough competition for survival\"에서 가져옴. [A]는 competition을 꾸미는 형용사, [B]는 for 뒤 명사.","c":null},"h":"a556f1ca94"}]},{"u":3,"id":"r09","no":9,"ko":"둘 다 잘해야 진짜 챔피언","items":[{"n":1,"t":"tf","q":"Chessboxing players alternate between chess rounds and boxing rounds.","h":"97e87f34d1","ko":"체스복싱 선수들은 체스 라운드와 복싱 라운드를 번갈아 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In chessboxing, players are divided into weight classes and alternate between chess and boxing rounds.","체스복싱에서는, 선수들이 체급으로 나뉘며 체스와 복싱 라운드를 번갈아 해야 합니다."]],"w":"5번 문장에 alternate between chess and boxing rounds. 그대로 일치.","c":"T"}},{"n":2,"t":"tf","q":"A chessboxing match ends only when a player wins by knockout.","h":"5ef7c32c60","ko":"체스복싱 경기는 한 선수가 녹아웃으로 이길 때만 끝난다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The match continues until a player wins in either game — by checkmate, knockout (KO), or resignation.","경기는 한 선수가 체크메이트, 녹아웃(KO), 또는 기권으로 어느 한 시합에서든 승리할 때까지 계속됩니다."]],"w":"6번 문장에서 승리 방법은 checkmate, knockout, resignation 세 가지. 녹아웃만이 아님.","c":"F"}},{"n":3,"t":"tf","q":"Competitors must have a chess rating and boxing experience to compete in an official match.","h":"699e5ff6dc","ko":"공식 경기에 나가려면 체스 등급과 복싱 경험이 있어야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"To compete in an official match, competitors must have a recognized chess rating and experience in boxing.","공식 경기에 출전하려면, 참가자는 공인된 체스 등급과 복싱 경험이 있어야 합니다."]],"w":"7번 문장에 must have a recognized chess rating and experience in boxing. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Players alternate between chess and boxing rounds.","h":"7fb601b537","ko":"선수들은 체스 라운드와 복싱 라운드를 번갈아 한다.","opts":["대신하다","선택하다","번갈아 하다","반복을 피하다"],"word":"alternate","r":{"a":"3) 번갈아 하다","ev":"5번 문장","s":[[5,"In chessboxing, players are divided into weight classes and alternate between chess and boxing rounds.","체스복싱에서는, 선수들이 체급으로 나뉘며 체스와 복싱 라운드를 번갈아 해야 합니다."]],"w":"alternate between A and B = A와 B를 번갈아 하다. 체스와 복싱 라운드가 교대로 진행되는 뜻.","c":3}},{"n":5,"t":"vocab","q":"Chess is quiet and strategic, while boxing is loud and physical.","h":"467e3311b2","ko":"체스는 조용하고 전략적인 반면, 복싱은 시끄럽고 격렬하다.","opts":["물리학의","육체적인, 몸을 쓰는","정신적인","경제적인"],"word":"physical","r":{"a":"2) 육체적인, 몸을 쓰는","ev":"9번 문장","s":[[9,"Chess is quiet and strategic, while boxing is loud and physical.","체스는 조용하고 전략적인 반면, 복싱은 소리가 크고 육체적입니다."]],"w":"while로 체스(quiet, strategic)와 복싱(loud, physical)을 대비. physical은 여기서 '몸을 쓰는, 육체적인'. 물리학 뜻은 문맥에 맞지 않음.","c":2}},{"n":6,"t":"ref","q":"In sentence 11, 'it' refers to ___.","h":"95ff27bfbb","ko":"11번 문장의 it이 가리키는 것은?","sko":"한 번 움직이면, 되돌릴 수 없습니다","opts":["한 번의 움직임","체스 말 하나","하나의 경기","오랜 연습"],"r":{"a":"1) 한 번의 움직임","ev":"11번 문장","s":[[11,"In both, every move counts — once you make it, there’s no turning back.","둘 다에서, 매 움직임이 중요합니다 — 한 번 움직이면, 되돌릴 수 없습니다."]],"w":"앞 절 every move counts의 move를 받음. 한 번 움직임을 하면(make it) 되돌릴 수 없다는 뜻.","c":1}},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Suddenly, the table is cleared away, the players put on their gloves, and the match shifts to boxing!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"갑자기, 테이블이 치워지고, 선수들이 장갑을 끼며, 경기가 복싱으로 바뀝니다!","opts":["갑자기 테이블이 치워지고 선수들이 장갑을 끼면서 경기가 복싱으로 바뀐다.","갑자기 선수들이 장갑을 벗고 경기가 체스로 바뀐다.","갑자기 관객들이 테이블을 치우고 경기장 밖으로 나간다.","갑자기 타이머가 울려 경기가 완전히 끝난다."],"r":{"a":"1) 갑자기 테이블이 치워지고 선수들이 장갑을 끼면서 경기가 복싱으로 바뀐다.","ev":"3번 문장","s":[[3,"Suddenly, the table is cleared away, the players put on their gloves, and the match shifts to boxing!","갑자기, 테이블이 치워지고, 선수들이 장갑을 끼며, 경기가 복싱으로 바뀝니다!"]],"w":"3번 문장 the table is cleared away, the players put on their gloves, and the match shifts to boxing.","c":1},"h":"64e2f23efa"},{"n":8,"t":"match","q":"Which is consistent with the passage?","ko":"글의 내용과 일치하는 것은?","oko":["체스복싱은 같은 나이의 선수들끼리만 한다.","체스복싱은 지능과 힘의 궁극적인 시험으로 설명된다.","체스와 복싱은 둘 다 약간의 연습만 요구한다.","그 스포츠는 세계복싱협회가 관리한다."],"opts":["Chessboxing is played only by players of the same age.","Chessboxing is described as the ultimate test of intelligence and strength.","Chess and boxing both demand only a little practice.","The sport is governed by the World Boxing Association."],"r":{"a":"2) Chessboxing is described as the ultimate test of intelligence and strength. (체스복싱은 지능과 힘의 궁극적인 시험으로 설명된다.)","ev":"13번 문장","s":[[13,"Chessboxing is the ultimate test of intelligence and strength.","체스복싱은 지능과 힘의 궁극적인 시험입니다."]],"w":"13번 문장 Chessboxing is the ultimate test of intelligence and strength. ①은 5번(체급으로 나뉨), ③은 10번(수년간의 연습), ④는 4번(세계 체스복싱 기구)과 어긋남.","c":2},"h":"4f20dcc9cd"},{"n":9,"t":"sum","q":"Chess and boxing look (A) at first, but both demand intense (B) and years of practice to master.","ko":"체스와 복싱은 처음에는 (A) 것처럼 보이지만, 둘 다 강한 (B)과(와) 수년간의 연습을 요구한다.","oko":["(A) 비슷한 / (B) 운","(A) 다른 / (B) 운","(A) 비슷한 / (B) 집중","(A) 지루한 / (B) 돈","(A) 다른 / (B) 집중"],"opts":["(A) similar / (B) luck","(A) different / (B) luck","(A) similar / (B) focus","(A) boring / (B) money","(A) different / (B) focus"],"r":{"a":"5) (A) different / (B) focus ((A) 다른 / (B) 집중)","ev":"8번, 10번 문장","s":[[8,"At first glance, chess and boxing seem like complete opposites.","처음 봐서는, 체스와 복싱은 완전히 반대인 것처럼 보입니다."],[10,"Yet, both demand intense focus, stamina, and years of practice to master.","그러나, 둘 다 숙달하기 위해서는 강한 집중력, 체력, 그리고 수년간의 연습을 필요로 합니다."]],"w":"8번 문장 chess and boxing seem like complete opposites(정반대처럼 보임), 10번 문장 both demand intense focus ... and years of practice.","c":5},"h":"191fffd76f"},{"n":10,"t":"fill","q":"This blend of [A] and similarities makes chessboxing a perfect [B] sport.","ko":"이러한 [A]와(과) 유사점의 조합은 체스복싱을 완벽한 [B] 스포츠로 만듭니다.","bko":{"opposites":"반대되는 점들","gloves":"장갑들 (glove의 복수형)","resignation":"기권, 사임","officially":"공식적으로","hybrid":"혼합의, 하이브리드","timer":"타이머"},"bank":["opposites","gloves","resignation","officially","hybrid","timer"],"r":{"a":"[A] opposites (반대되는 점들), [B] hybrid (혼합의, 하이브리드)","ev":"12번 문장","s":[[12,"This blend of opposites and similarities makes chessboxing a perfect hybrid sport.","이러한 반대되는 점과 유사점의 조합은 체스복싱을 완벽한 하이브리드 스포츠로 만듭니다."]],"w":"12번 문장 \"This blend of opposites and similarities makes chessboxing a perfect hybrid sport.\"에서 가져옴. [A]는 and similarities와 짝이 되는 명사, [B]는 sport를 꾸미는 형용사.","c":null},"h":"5cae0251a4"}]},{"u":4,"id":"r10","no":10,"ko":"내 꿈에서는 내가 결정해!","items":[{"n":1,"t":"tf","q":"Unlike ordinary dreams, lucid dreaming allows you to take control of the story.","h":"53638e92ac","ko":"일반 꿈과 달리 자각몽에서는 이야기를 통제할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Unlike ordinary dreams, lucid dreaming allows you to ⓐ take control of the story.","일반적인 꿈과 달리, 자각몽은 당신이 이야기를 통제할 수 있게 한다."]],"w":"3번 문장 그대로. Unlike ordinary dreams 뒤에 take control of the story가 나옴.","c":"T"}},{"n":2,"t":"tf","q":"Lucid dreaming usually occurs during a deep sleep stage.","h":"db70809f31","ko":"자각몽은 보통 깊은 수면 단계에서 발생한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Lucid dreaming usually occurs during REM sleep, a light sleep stage when dreams are the most vivid.","자각몽은 보통 꿈이 가장 생생한 얕은 수면 단계인 렘수면 중에 발생한다."]],"w":"5번 문장은 REM sleep, a light sleep stage(얕은 수면 단계)라고 함. deep으로 바꾼 것이 오류.","c":"F"}},{"n":3,"t":"tf","q":"Athletes use lucid dreams as a mental space to rehearse their techniques.","h":"33ba151bee","ko":"운동선수들은 자각몽을 기술을 예행연습하는 정신적 공간으로 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"In the same way, athletes use lucid dreams as a mental space to rehearse and refine their techniques.","마찬가지로, 운동선수들은 자각몽을 그들의 기술을 연습하고 개선하는 정신적 공간으로 활용한다."]],"w":"12번 문장에 mental space to rehearse and refine their techniques가 그대로 나옴.","c":"T"}},{"n":4,"t":"vocab","q":"Choose the meaning of the underlined word in the sentence: \"a light sleep stage when dreams are the most vivid.\"","h":"cd6e99fd5a","ko":"밑줄 친 단어의 뜻: \"꿈이 가장 생생한 얕은 수면 단계\"","opts":["조용한","희미한","생생한","짧은"],"word":"vivid","r":{"a":"3) 생생한","ev":"5번 문장","s":[[5,"Lucid dreaming usually occurs during REM sleep, a light sleep stage when dreams are the most vivid.","자각몽은 보통 꿈이 가장 생생한 얕은 수면 단계인 렘수면 중에 발생한다."]],"w":"vivid = 생생한, 선명한. REM 수면은 꿈이 가장 생생한 단계라는 문맥. 희미한(faint)은 반대 뜻.","c":3}},{"n":5,"t":"vocab","q":"Choose the meaning of the underlined word \"state\" in sentence 6: \"This self-aware dream state offers meaningful benefits.\"","h":"bc039879b7","ko":"6번 문장 \"이 자각하는 꿈의 상태는 의미 있는 이점을 제공한다\"에서 밑줄 단어의 뜻","opts":["주(州)","상태","목표","나라"],"word":"state","r":{"a":"2) 상태","ev":"6번 문장","s":[[6,"This self-aware dream state offers meaningful ⓑ benefits.","이 자각하는 꿈의 상태는 의미 있는 이점들을 제공한다."]],"w":"state는 '주, 나라, 말하다' 등 여러 뜻이 있으나 dream state는 꿈의 상태. 문맥상 '상태'.","c":2}},{"n":6,"t":"ref","q":"In sentence 8, \"They\" refers to","h":"aa223d49aa","ko":"8번 문장의 They가 가리키는 것은?","sko":"그들은 스트레스가 많은 시나리오를 중립적이거나 심지어 긍정적인 시나리오로 바꿀 수 있다.","opts":["악몽을 자주 꾸는 사람들","예술가와 작가들","스트레스를 주는 상황들","운동선수들"],"r":{"a":"1) 악몽을 자주 꾸는 사람들","ev":"7~8번 문장","s":[[7,"For those who frequently experience nightmares, realizing that they are dreaming allows them to reshape their dreams as they wish.","악몽을 자주 경험하는 사람들에게는, 자신이 꿈을 꾸고 있다는 것을 깨닫는 것이 그들이 원하는 대로 꿈을 고칠 수 있게 해준다."],[8,"They can transform stressful scenarios into neutral or even positive ones.","그들은 스트레스가 많은 시나리오를 중립적이거나 심지어 긍정적인 시나리오로 바꿀 수 있다."]],"w":"7번 문장의 주인공은 악몽을 자주 꾸는 사람들(those who frequently experience nightmares). 8번 They는 그들을 받음. 스트레스 상황은 transform의 대상(목적어).","c":1}},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Artists and writers often gain inspiration by exploring fresh ideas and unique stories in their lucid dreams.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"예술가와 작가들은 그들의 자각몽 속에서 신선한 아이디어와 독특한 이야기를 탐구하며 종종 영감을 얻는다.","opts":["예술가와 작가들은 자각몽에서 신선한 아이디어와 독특한 이야기를 탐구하며 영감을 얻곤 한다.","예술가와 작가들은 자각몽 때문에 영감을 잃곤 한다.","예술가와 작가들은 꿈을 꾸지 않아야 영감을 얻는다.","예술가와 작가들은 자각몽에서 오래된 이야기만 되풀이해서 본다."],"r":{"a":"1) 예술가와 작가들은 자각몽에서 신선한 아이디어와 독특한 이야기를 탐구하며 영감을 얻곤 한다.","ev":"11번 문장","s":[[11,"Artists and writers often gain inspiration by exploring fresh ideas and unique stories in their lucid dreams.","예술가와 작가들은 그들의 자각몽 속에서 신선한 아이디어와 독특한 이야기를 탐구하며 종종 영감을 얻는다."]],"w":"11번 문장 Artists and writers often gain inspiration by exploring fresh ideas and unique stories in their lucid dreams.","c":1},"h":"56e1b08b7b"},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","ko":"본문과 일치하는 것은?","oko":["자각몽은 항상 가장 깊은 수면 단계에서 일어난다.","꿈은 현실의 기술에 전혀 영향을 주지 않는다.","꿈속에 있으면서 자신이 꿈을 꾸고 있다는 것을 깨닫는 것을 자각몽이라고 한다.","자각몽은 대부분의 사람들에게 악몽을 더 스트레스 받게 만든다."],"opts":["Lucid dreaming always happens during the deepest sleep stage.","Dreams have no effect on real-life skills at all.","Realizing that you are dreaming while still in a dream is called lucid dreaming.","Lucid dreaming makes nightmares more stressful for most people."],"r":{"a":"3) Realizing that you are dreaming while still in a dream is called lucid dreaming. (꿈속에 있으면서 자신이 꿈을 꾸고 있다는 것을 깨닫는 것을 자각몽이라고 한다.)","ev":"1~2번 문장","s":[[1,"Have you ever realized you were dreaming while still in a dream?","당신은 여전히 꿈속에 있으면서 꿈을 꾸고 있다는 것을 깨달은 적이 있는가?"],[2,"This experience is called lucid dreaming.","이러한 경험은 자각몽이라고 불린다."]],"w":"1~2번 문장 꿈속에서 꿈을 꾸고 있다는 것을 깨닫는 경험이 lucid dreaming. ①은 5번(얕은 수면 단계인 렘수면), ④는 7~8번(악몽을 긍정적으로 바꿈)과 어긋남.","c":3},"h":"44ab03c8d2"},{"n":9,"t":"sum","q":"In a lucid dream, you might choose to (A), explore a magical world, or meet your favorite (B).","ko":"자각몽에서 당신은 (A)거나, 마법의 세계를 탐험하거나, 가장 좋아하는 (B)을(를) 만나는 것을 선택할 수도 있다.","oko":["(A) 날다 / (B) 연예인","(A) 떨어지다 / (B) 연예인","(A) 날다 / (B) 적","(A) 숨다 / (B) 적","(A) 떨어지다 / (B) 낯선 사람"],"opts":["(A) fly / (B) celebrity","(A) fall / (B) celebrity","(A) fly / (B) enemy","(A) hide / (B) enemy","(A) fall / (B) stranger"],"r":{"a":"1) (A) fly / (B) celebrity ((A) 날다 / (B) 연예인)","ev":"4번 문장","s":[[4,"You might choose to fly, explore a magical world, or meet your favorite celebrity.","당신은 날거나, 마법의 세계를 탐험하거나, 가장 좋아하는 연예인을 만나는 것을 선택할 수도 있다."]],"w":"4번 문장 You might choose to fly, explore a magical world, or meet your favorite celebrity.","c":1},"h":"03aec76371"},{"n":10,"t":"fill","q":"Lucid dreaming also [A] [B] and skill development.","ko":"자각몽은 또한 [B]과(와) 기술 개발을 [A].","bko":{"occurs":"일어난다 (occur의 3인칭 단수)","nightmares":"악몽들 (nightmare의 복수형)","scenarios":"시나리오들 (scenario의 복수형)","boosts":"촉진한다 (boost의 3인칭 단수)","creativity":"창의력","refine":"개선하다"},"bank":["occurs","nightmares","scenarios","boosts","creativity","refine"],"r":{"a":"[A] boosts (촉진한다 (boost의 3인칭 단수)), [B] creativity (창의력)","ev":"10번 문장","s":[[10,"Lucid dreaming also ⓓ boosts creativity and skill development.","자각몽은 또한 창의력과 기술 개발을 촉진한다."]],"w":"10번 문장 \"Lucid dreaming also boosts creativity and skill development.\"에서 가져옴. [A]는 dreaming 뒤 목적어를 받는 3인칭 단수 동사, [B]는 and skill development와 짝인 명사.","c":null},"h":"da9ed3738a"}]},{"u":4,"id":"r11","no":11,"ko":"발바닥으로 예측할 수 있어요","items":[{"n":1,"t":"tf","q":"Elephants can detect storms up to 100 kilometers away.","h":"f5dac3415d","ko":"코끼리는 최대 100km 떨어진 폭풍을 감지할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Guided by this natural ‘ground vibration radar,’ elephants can detect storms up to 100 kilometers away and anticipate rainfall even before it arrives.","이 자연적인 ‘지면 진동 레이더’의 안내를 받아, 코끼리는 최대 100킬로미터 떨어진 폭풍을 감지하고 비가 내리기도 전에 강우를 예측할 수 있다."]],"w":"7번 문장 detect storms up to 100 kilometers away 그대로.","c":"T"}},{"n":2,"t":"tf","q":"Elephants use their trunks to sense vibrations from distant thunder or rainfall.","h":"13131f9790","ko":"코끼리는 먼 곳의 천둥이나 비에서 오는 진동을 코로 감지한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Elephants use ⓑ their feet to sense low-frequency vibrations from distant thunder or rainfall.","코끼리는 먼 거리의 천둥이나 강우로부터 오는 저주파 진동을 감지하기 위해 그들의 발을 사용한다."]],"w":"4번 문장은 use their feet(발). 코(trunks)로 바꾼 것이 오류.","c":"F"}},{"n":3,"t":"tf","q":"Elephants sometimes lift one foot off the ground to find the source of a vibration.","h":"697a2045cb","ko":"코끼리는 때때로 진동의 근원을 찾으려고 한 발을 땅에서 든다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"To enhance ⓓ their senses and pinpoint the vibration’s source, elephants sometimes lift one foot off the ground and press another deeper into the earth.","그들의 감각을 향상시키고 진동의 근원을 정확히 찾아내기 위해, 코끼리는 때때로 한 발을 땅에서 들어 올려 다른 발을 땅속으로 더 깊숙이 누른다."]],"w":"6번 문장: To pinpoint the vibration's source, elephants sometimes lift one foot off the ground.","c":"T"}},{"n":4,"t":"vocab","q":"Choose the meaning of the underlined word in the sentence: \"pick up these faint signals.\"","h":"c1b89d97c4","ko":"밑줄 친 단어의 뜻: \"이 희미한 신호들을 포착한다\"","opts":["희미한","강한","무거운","시끄러운"],"word":"faint","r":{"a":"1) 희미한","ev":"5번 문장","s":[[5,"The thick, fatty pads under their feet pick up these faint signals, and special nerve endings in their feet detect ⓒ them.","그들의 발 아래의 두껍고 지방이 많은 패드는 이 희미한 신호들을 포착하고, 그들의 발에 있는 특수 신경 말단은 그것들을 감지한다."]],"w":"faint = 희미한. 발바닥이 약한 신호까지 잡아낸다는 문맥. 책 단어목록에도 faint 희미한.","c":1}},{"n":5,"t":"vocab","q":"Choose the meaning of the underlined word in the sentence: \"The thick, fatty pads ... pick up these faint signals.\"","h":"075672cd15","ko":"밑줄 친 pick up의 문맥상 뜻: \"두껍고 지방이 많은 패드가 이 희미한 신호들을 ~한다\"","opts":["집어 올리다","차로 데리러 가다","점점 나아지다","포착하다"],"word":"pick up","r":{"a":"4) 포착하다","ev":"5번 문장","s":[[5,"The thick, fatty pads under their feet pick up these faint signals, and special nerve endings in their feet detect ⓒ them.","그들의 발 아래의 두껍고 지방이 많은 패드는 이 희미한 신호들을 포착하고, 그들의 발에 있는 특수 신경 말단은 그것들을 감지한다."]],"w":"pick up은 다의어(집어 올리다, 데리러 가다, 나아지다, 포착하다). 신호가 목적어이므로 '포착하다'.","c":4}},{"n":6,"t":"ref","q":"In sentence 3, \"them\" refers to","ko":"3번 문장의 them이 가리키는 것은?","sko":"하지만 아프리카의 코끼리는 그들이 생존하도록 돕는 특별한 능력을 가지고 있는데, 바로 그들이 땅을 통해 자연의 신호를 읽을 수 있다는 것이다!","opts":["아프리카의 코끼리","다른 야생동물","자연의 신호","건기의 비"],"r":{"a":"1) 아프리카의 코끼리","ev":"3번 문장","s":[[3,"But elephants in Africa have a special ability that helps ⓐ them survive: they can read nature’s signals through the ground!","하지만 아프리카의 코끼리는 그들이 생존하도록 돕는 특별한 능력을 가지고 있는데, 바로 그들이 땅을 통해 자연의 신호를 읽을 수 있다는 것이다!"]],"w":"3번 문장 elephants in Africa have a special ability that helps them survive에서 them은 바로 앞의 elephants.","c":1,"k":"them = 아프리카의 코끼리"},"pron":"them","h":"4ee4f8aac5"},{"n":7,"t":"sense","q":"What does sentence 2, \"it goes without saying that survival is a daily struggle,\" mean?","h":"9108832c1d","ko":"2번 문장 \"생존이 매일의 힘든 일이라는 것은 말할 필요도 없다\"의 의미로 알맞은 것은?","sko":"생존이 일상적인 어려움이라는 것은 말할 것도 없다","opts":["생존이 매일 힘들다는 것은 당연하다","생존 문제는 매일 쉽게 해결된다","동물들은 말없이 매일 싸운다","생존의 어려움은 말로 설명하기 어렵다"],"r":{"a":"1) 생존이 매일 힘들다는 것은 당연하다","ev":"2번 문장","s":[[2,"With little water and intense heat, it goes without saying that survival is a daily struggle.","아주 적은 물과 극심한 더위로 인해, 생존이 일상적인 어려움이라는 것은 말할 것도 없다."]],"w":"it goes without saying that ~ = ~은 말할 필요도 없다(당연하다). 물이 거의 없고 열기가 극심하니 생존이 힘든 것은 당연하다는 뜻.","c":1}},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","h":"e636a72b95","ko":"본문과 일치하는 것은?","oko":["코끼리는 진동의 근원을 찾으려면 두 발을 모두 땅에 대고 있어야 한다.","코끼리는 비가 내리기도 전에 강우가 다가오는 것을 감지할 수 있다.","코끼리는 발 패드가 두껍기 때문에 희미한 신호를 포착하지 못한다.","코끼리는 폭풍을 감지하면 물에서 멀어진다."],"opts":["Elephants must put both feet on the ground to find a vibration's source.","Elephants can sense rainfall coming even before it arrives.","Elephants cannot pick up faint signals because their pads are thick.","Elephants move away from water when they detect a storm."],"r":{"a":"2) Elephants can sense rainfall coming even before it arrives.","ev":"7번 문장","s":[[7,"Guided by this natural ‘ground vibration radar,’ elephants can detect storms up to 100 kilometers away and anticipate rainfall even before it arrives.","이 자연적인 ‘지면 진동 레이더’의 안내를 받아, 코끼리는 최대 100킬로미터 떨어진 폭풍을 감지하고 비가 내리기도 전에 강우를 예측할 수 있다."]],"w":"7번 문장: anticipate rainfall even before it arrives. ①은 6번(한 발은 들고 한 발은 누름), ③은 5번(두꺼운 패드가 신호를 포착), ④는 8번(물 쪽으로 이동)과 반대.","c":2}},{"n":9,"t":"sum","q":"The (A) season in Africa brings (B) challenges for wildlife.","ko":"아프리카의 (A) 계절은 야생동물에게 (B) 어려움을 가져온다.","oko":["(A) 건조한 / (B) 극심한","(A) 건조한 / (B) 쉬운","(A) 우기의 / (B) 극심한","(A) 우기의 / (B) 쉬운","(A) 추운 / (B) 쉬운"],"opts":["(A) dry / (B) extreme","(A) dry / (B) easy","(A) rainy / (B) extreme","(A) rainy / (B) easy","(A) cold / (B) easy"],"r":{"a":"1) (A) dry / (B) extreme ((A) 건조한 / (B) 극심한)","ev":"1번 문장","s":[[1,"The dry season in Africa brings extreme challenges for wildlife.","아프리카의 건기는 야생동물에게 극심한 어려움을 가져온다."]],"w":"1번 문장 The dry season in Africa brings extreme challenges for wildlife.","c":1},"h":"bc0eb4829d"},{"n":10,"t":"fill","q":"This early warning allows the [A] to move toward water and increase their [B] of survival even in the harshest conditions.","ko":"이러한 조기 경보는 코끼리 [A]이(가) 물 쪽으로 이동하게 하고 가장 혹독한 환경에서조차도 그들의 생존 [B]을(를) 높일 수 있게 한다.","bko":{"radar":"레이더","herd":"무리","thunder":"천둥","chances":"가능성, 기회들 (chance의 복수형)","nerve":"신경","source":"근원"},"bank":["radar","herd","thunder","chances","nerve","source"],"r":{"a":"[A] herd (무리), [B] chances (가능성, 기회들 (chance의 복수형))","ev":"8번 문장","s":[[8,"This early warning allows the herd to move toward water and increase ⓔ their chances of survival even in the harshest conditions.","이러한 조기 경보는 코끼리 무리가 물 쪽으로 이동하게 하고 가장 혹독한 환경에서조차도 그들의 생존 가능성을 높일 수 있게 한다."]],"w":"8번 문장 \"allows the herd to move toward water and increase their chances of survival\"에서 가져옴. [A]는 allows 뒤 to move의 주체, [B]는 increase의 목적어 명사.","c":null},"h":"6c910a11b0"}]},{"u":4,"id":"r12","no":12,"ko":"낯선 이가 남기는 따뜻함 한 잔","items":[{"n":1,"t":"tf","q":"People who felt lucky or grateful would pay for an extra coffee.","h":"1deac7ed4d","ko":"운이 좋거나 감사함을 느낀 사람들은 커피를 한 잔 더 계산하곤 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When someone felt lucky or grateful, they would pay for an extra coffee at their local cafe.","누군가가 운이 좋거나 감사하다고 느낄 때, 그들은 지역 카페에서 커피 한 잔 값을 더 지불했다."]],"w":"6번 문장 When someone felt lucky or grateful, they would pay for an extra coffee.","c":"T"}},{"n":2,"t":"tf","q":"Suspended coffee is a tradition where people leave a paid coffee for a friend.","h":"1ecb81e2e3","ko":"유예된 커피는 사람들이 친구를 위해 값을 낸 커피를 남겨 두는 전통이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It’s a heartwarming tradition where people leave a paid coffee for a stranger.","그것은 사람들이 낯선 이에게 줄 커피를 미리 계산해 두는, 마음을 따뜻하게 하는 전통이다."]],"w":"3번 문장은 for a stranger(낯선 사람). friend로 바꾼 것이 오류.","c":"F"}},{"n":3,"t":"tf","q":"Today, only cafes follow the tradition of suspended coffee.","h":"38e4acf719","ko":"오늘날 카페만이 유예된 커피 전통을 따른다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Some restaurants now offer suspended meals, and bakeries do the same with bread.","일부 레스토랑들은 이제 서스펜디드 식사를 제공하고, 빵집들은 같은 방식으로 빵을 제공한다."]],"w":"10번 문장: restaurants가 suspended meals를, bakeries가 bread로 같은 일을 함. 카페만이 아님.","c":"F"}},{"n":4,"t":"vocab","q":"Choose the dictionary meaning of the underlined verb: \"someone who couldn't afford one.\"","h":"d37d86ddae","ko":"밑줄 친 동사 afford의 사전적 뜻은? (\"한 잔을 살 여유가 없는 사람\")","opts":["~을 거절하다","~을 빌리다","~을 기억하다","~할 여유가 있다, ~을 살 형편이 되다"],"word":"afford","r":{"a":"4) ~할 여유가 있다, ~을 살 형편이 되다","ev":"7번 문장","s":[[7,"This coffee was suspended, ready to be given to someone who couldn’t afford one.","이 커피는 유예된 상태로, 커피 한 잔을 살 여유가 없는 사람에게 주어질 준비가 되어 있었다."]],"w":"afford = ~을 지불할 여유가 있다. couldn't afford one = 한 잔 살 여유가 없는.","c":4}},{"n":5,"t":"vocab","q":"Choose the meaning of the underlined word in the sentence: \"people leave a paid coffee for a stranger.\"","h":"80fb96d7c8","ko":"밑줄 친 leave의 문맥상 뜻: \"사람들이 낯선 사람을 위해 값을 낸 커피를 ~한다\"","opts":["떠나다","남겨 두다","허락하다","잊다"],"word":"leave","r":{"a":"2) 남겨 두다","ev":"3번 문장","s":[[3,"It’s a heartwarming tradition where people leave a paid coffee for a stranger.","그것은 사람들이 낯선 이에게 줄 커피를 미리 계산해 두는, 마음을 따뜻하게 하는 전통이다."]],"w":"leave는 다의어(떠나다, 남겨 두다). 목적어가 a paid coffee이므로 '남겨 두다'.","c":2}},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nEconomic hardships made life difficult for many people in Naples, yet they still found ways to help one another.","ko":"밑줄 친 they가 가리키는 것은?","sko":"경제적 고난이 나폴리의 많은 사람들의 삶을 힘들게 했지만, 그들은 여전히 서로를 도울 방법을 찾았다.","opts":["경제적 고난","나폴리의 많은 사람들","커피를 파는 카페 주인들","이탈리아의 군인들"],"r":{"a":"2) 나폴리의 많은 사람들","ev":"5번 문장","s":[[5,"Economic hardships made life difficult for many people in Naples, yet they still found ways to help one another.","경제적 고난이 나폴리의 많은 사람들의 삶을 힘들게 했지만, 그들은 여전히 서로를 도울 방법을 찾았다."]],"w":"5번 문장 Economic hardships made life difficult for many people in Naples, yet they still found ways to help one another. they는 어려움을 겪은 나폴리의 많은 사람들.","c":2,"k":"they = 나폴리의 많은 사람들"},"pron":"they","h":"262dfdc022"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The tradition is believed to have started in early 20th-century Naples, Italy and gained popularity during World War II.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 전통은 20세기 초 이탈리아 나폴리에서 시작되어 제2차 세계대전 동안 인기를 얻은 것으로 여겨진다.","opts":["그 전통은 20세기 초 나폴리에서 생겨났고, 세계대전이 벌어진 시기에 널리 알려졌다고 전해진다.","그 전통은 제2차 세계대전이 끝난 뒤에야 나폴리에서 시작된 것으로 여겨진다.","그 전통은 나폴리에서 시작되어 20세기 초에 사라진 것으로 여겨진다.","그 전통은 이탈리아가 아닌 다른 나라에서 시작된 것으로 알려져 있다."],"r":{"a":"1) 그 전통은 20세기 초 나폴리에서 생겨났고, 세계대전이 벌어진 시기에 널리 알려졌다고 전해진다.","ev":"4번 문장","s":[[4,"The tradition is believed to have started in early 20th-century Naples, Italy and gained popularity during World War II.","그 전통은 20세기 초 이탈리아 나폴리에서 시작되어 제2차 세계대전 동안 인기를 얻은 것으로 여겨진다."]],"w":"4번 문장 started in early 20th-century Naples, Italy and gained popularity during World War II.","c":1},"h":"4ee90b73fc"},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","ko":"본문과 일치하는 것은?","oko":["그 전통은 나폴리에만 머물러 있다.","그 전통은 다른 도시와 나라로 퍼졌다.","커피는 값을 낸 사람이 직접 마셔야 했다.","그 전통은 최근 몇 년 사이에 시작되었다."],"opts":["The tradition has stayed only in Naples.","The tradition has spread to other cities and countries.","The coffee had to be drunk by the person who paid for it.","The tradition began in recent years."],"r":{"a":"2) The tradition has spread to other cities and countries. (그 전통은 다른 도시와 나라로 퍼졌다.)","ev":"11번 문장","s":[[11,"This generous act has even spread to other cities and countries.","이 관대한 행동은 다른 도시와 나라로도 퍼졌다."]],"w":"11번 문장 This generous act has even spread to other cities and countries. ①은 11번과 반대, ③은 3·7번(낯선 사람에게 줌), ④는 4번(20세기 초 시작)과 어긋남.","c":2},"h":"4ba9b657b3"},{"n":9,"t":"sum","q":"Today, the suspended coffee tradition (A) and has (B) beyond coffee.","ko":"오늘날 서스펜디드 커피 전통은 (A) 커피를 넘어 (B).","oko":["(A) 이어져 오고 / (B) 확장되었다","(A) 이어져 오고 / (B) 사라졌다","(A) 끝났고 / (B) 확장되었다","(A) 끝났고 / (B) 사라졌다","(A) 멈췄고 / (B) 줄어들었다"],"opts":["(A) continues / (B) expanded","(A) continues / (B) disappeared","(A) ended / (B) expanded","(A) ended / (B) disappeared","(A) stopped / (B) shrunk"],"r":{"a":"1) (A) continues / (B) expanded ((A) 이어져 오고 / (B) 확장되었다)","ev":"9번 문장","s":[[9,"Today, the tradition continues and has expanded beyond coffee.","오늘날, 그 전통은 계속되어 커피의 범위를 넘어서 확장되었다."]],"w":"9번 문장 Today, the tradition continues and has expanded beyond coffee.","c":1},"h":"b83c151a8c"},{"n":10,"t":"fill","q":"It is spreading [A] that [B] with every step.","ko":"그것은 [A]을(를) 퍼뜨리고 있으며, 그것은 매 걸음마다 [B].","bko":{"gentle":"상냥한","multiplies":"늘어난다 (multiply의 3인칭 단수)","generous":"관대한","kindness":"친절","afford":"~할 여유가 있다","leave":"남기다"},"bank":["gentle","multiplies","generous","kindness","afford","leave"],"r":{"a":"[A] kindness (친절), [B] multiplies (늘어난다 (multiply의 3인칭 단수))","ev":"12번 문장","s":[[12,"It is spreading kindness that multiplies with every step.","그것은 매 걸음마다 커져 가는 친절을 퍼뜨리고 있다."]],"w":"12번 문장 \"It is spreading kindness that multiplies with every step.\"에서 가져옴. [A]는 spreading의 목적어 명사, [B]는 that 뒤 3인칭 단수 동사.","c":null},"h":"9ab61592ff"}]},{"u":5,"id":"r13","no":13,"ko":"브라질의 유령 도로","items":[{"n":1,"t":"tf","q":"The BR-319 highway was built to connect remote areas of the Amazon to the rest of Brazil.","h":"4158014a2c","ko":"BR-319 고속도로는 아마존의 외딴 지역을 브라질의 나머지 지역과 연결하려고 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"The BR-319 highway, also known as the Road of Ghosts, is a 900-km-long road meant to connect remote areas of the Amazon to the rest of Brazil.","유령의 도로라고도 알려진 BR-319 고속도로는, 아마존의 외딴 지역을 브라질의 나머지 지역과 연결하도록 의도된 900km 길이의 도로이다."]],"w":"1번 문장에 meant to connect remote areas of the Amazon to the rest of Brazil이 나옴. 본문과 일치.","c":"T"}},{"n":2,"t":"tf","q":"The BR-319 was completed in the 1980s.","h":"ebe0c7bd5c","ko":"BR-319는 1980년대에 완공되었다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"When construction was completed in the 1970s, it attracted many people with the promise of cheap farmland and economic opportunities.","1970년대에 건설이 완료되었을 때, 그것은 저렴한 농지와 경제적 기회라는 약속과 함께 많은 사람들을 불러들였다."]],"w":"2번 문장에 completed in the 1970s로 나옴. 1980년대가 아니라 1970년대.","c":"F"}},{"n":3,"t":"tf","q":"Critics fear that a new road will expose the land to more deforestation and illegal activities.","h":"b8e39c265c","ko":"비판자들은 새 도로가 땅을 더 많은 삼림 벌채와 불법 활동에 노출시킬까 봐 두려워한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"(C) They fear that a new road will expose the land to more deforestation and illegal activities, threatening the rainforest and local communities.","(C) 그들은 새로운 도로가 토지를 더 많은 삼림 벌채와 불법 활동들에 노출시켜서, 열대우림과 지역 사회를 위협할 것이라고 우려한다."]],"w":"10번 문장에 They(=Critics) fear that a new road will expose the land to more deforestation and illegal activities가 나옴. 본문과 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word in this context? (Faulty construction and lack of maintenance caused the road to break down quickly.)","h":"063ca9f2e7","ko":"본문에 쓰인 밑줄 친 faulty의 뜻을 고르시오.","opts":["믿을 수 있는","결함이 있는","값싼","고립된"],"word":"Faulty","r":{"a":"2) 결함이 있는","ev":"4번 문장","s":[[4,"Faulty construction and lack of maintenance caused the road to break down quickly.","부실 공사와 유지 보수의 부족은 도로를 빠르게 무너지게 했다."]],"w":"4번 문장 Faulty construction은 '결함이 있는 건설'. 이 때문에 도로가 빨리 망가졌다는 흐름.","c":2}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (Eventually, the road became nearly unusable, leaving small towns along the route isolated and neglected.)","h":"06bcb692ea","ko":"본문에 쓰인 밑줄 친 isolated의 뜻을 고르시오.","opts":["값싼","번화한","고립된","불법적인"],"word":"isolated","r":{"a":"3) 고립된","ev":"6번 문장","s":[[6,"Eventually, the road became nearly unusable, leaving small towns along the route isolated and neglected.","결국, 그 도로는 거의 사용할 수 없게 되었고, 그 결과 그 길을 따라 위치한 작은 마을들은 고립되고 방치되었다."]],"w":"6번 문장 small towns ... isolated and neglected는 '고립되고 방치된'. isolated는 remote(외딴)와 비슷한 뜻. 바로 옆의 neglected(방치된)와 구별.","c":3}},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSupporters argue that it will bring growth to nearby villages, improve regional connections, and even boost the national economy.","ko":"밑줄 친 it이 가리키는 것은?","opts":["도로를 재건하는 일","지지자들","비판자들","인근 마을들"],"r":{"a":"1) 도로를 재건하는 일","ev":"7번, 9번 문장","s":[[7,"Today, Brazil’s government plans to rebuild the BR-319, and this has started a big debate.","오늘날, 브라질 정부는 BR-319를 재건할 계획이며, 이것은 큰 논쟁을 일으켰다."],[9,"(B) Supporters argue that it will bring growth to nearby villages, improve regional connections, and even boost the national economy.","(B) 지지자들은 그것이 인근의 지역 마을들을 발전시키고, 지역 간 연결을 개선하며, 심지어 국가 경제를 신장시킬 것이라고 주장한다."]],"w":"9번 문장 Supporters argue that it will bring growth ...에서 it은 7번 문장의 BR-319를 재건하는 일(도로 재건)을 가리킴.","c":1,"k":"it = 도로를 재건하는 일"},"sko":"지지자들은 그것이 인근의 지역 마을들을 발전시키고, 지역 간 연결을 개선하며, 심지어 국가 경제를 신장시킬 것이라고 주장한다.","pron":"it","h":"6459677f40"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Amazon’s heavy rains and fast-growing plants made the damage even worse.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아마존의 폭우와 빠르게 자라는 식물들은 그 손상을 더욱 악화시켰다.","opts":["아마존의 폭우와 빠르게 자라는 식물들 때문에 도로의 손상이 더 심해졌다.","아마존의 폭우와 식물들 덕분에 도로의 손상이 줄어들었다.","아마존의 폭우가 그치자 도로가 완전히 복구되었다.","아마존의 식물들이 도로를 새로 만들어 주었다."],"r":{"a":"1) 아마존의 폭우와 빠르게 자라는 식물들 때문에 도로의 손상이 더 심해졌다.","ev":"5번 문장","s":[[5,"Amazon’s heavy rains and fast-growing plants made the damage even worse.","아마존의 폭우와 빠르게 자라는 식물들은 그 손상을 더욱 악화시켰다."]],"w":"5번 문장 Amazon’s heavy rains and fast-growing plants made the damage even worse.","c":1},"h":"4564382737"},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["BR-319는 1970년대 이후 줄곧 완벽한 상태를 유지해 왔다.","정부는 그 도로를 그대로 두기로 결정했다.","시간이 지나면서 BR-319는 열악한 상태에 빠졌다.","모든 사람이 그 계획이 좋은 생각이라는 데 동의한다."],"opts":["The BR-319 has stayed in perfect condition since the 1970s.","The government has decided to leave the road as it is.","The BR-319 fell into poor condition as time went by.","Everyone agrees that the plan is a good idea."],"r":{"a":"3) The BR-319 fell into poor condition as time went by. (시간이 지나면서 BR-319는 열악한 상태에 빠졌다.)","ev":"3번 문장","s":[[3,"But over time, the BR-319 fell into poor condition.","하지만 시간이 지나면서, BR-319는 열악한 상태에 빠졌다."]],"w":"3번 문장 But over time, the BR-319 fell into poor condition. ①은 3번과 반대, ②는 7번(정부가 재건 계획), ④는 8~9번(비판자와 지지자의 의견이 갈림)과 어긋남.","c":3},"h":"830d3081b7"},{"n":9,"t":"sum","q":"Brazil’s government plans to (A) the BR-319, and this has started a big (B).","ko":"브라질 정부는 BR-319를 (A) 계획이며, 이것은 큰 (B)을(를) 일으켰다.","oko":["(A) 재건할 / (B) 논쟁","(A) 재건할 / (B) 휴일","(A) 폐쇄할 / (B) 논쟁","(A) 폐쇄할 / (B) 휴일","(A) 페인트칠할 / (B) 합의"],"opts":["(A) rebuild / (B) debate","(A) rebuild / (B) holiday","(A) close / (B) debate","(A) close / (B) holiday","(A) paint / (B) agreement"],"r":{"a":"1) (A) rebuild / (B) debate ((A) 재건할 / (B) 논쟁)","ev":"7번 문장","s":[[7,"Today, Brazil’s government plans to rebuild the BR-319, and this has started a big debate.","오늘날, 브라질 정부는 BR-319를 재건할 계획이며, 이것은 큰 논쟁을 일으켰다."]],"w":"7번 문장 Brazil’s government plans to rebuild the BR-319, and this has started a big debate.","c":1},"h":"0f2428910f"},{"n":10,"t":"fill","q":"The future of the BR-319 remains [A], but one thing is clear: its [B] could change the Amazon forever, for better or worse.","ko":"BR-319의 미래는 여전히 [A]지만, 한 가지는 분명하다: 바로 그것의 [B]이(가) 더 좋은 방향이든, 더 나쁜 방향이든 아마존을 영원히 바꿀 수 있다는 점이다.","bko":{"uncertain":"불확실하다","reconstruction":"재건","farmland":"농지","highway":"고속도로","rainforest":"열대우림","villages":"마을들 (village의 복수형)"},"bank":["uncertain","reconstruction","farmland","highway","rainforest","villages"],"r":{"a":"[A] uncertain (불확실하다), [B] reconstruction (재건)","ev":"11번 문장","s":[[11,"The future of the BR-319 remains uncertain, but one thing is clear: its reconstruction could change the Amazon forever, for better or worse.","BR-319의 미래는 여전히 불확실하지만, 한 가지는 분명하다: 바로 그것의 재건이 더 좋은 방향이든, 더 나쁜 방향이든 아마존을 영원히 바꿀 수 있다는 점이다."]],"w":"11번 문장 \"The future of the BR-319 remains uncertain ... its reconstruction could change the Amazon forever\"에서 가져옴. [A]는 remains 뒤 형용사, [B]는 its 뒤 주어 명사.","c":null},"h":"5845db0139"}]},{"u":5,"id":"r14","no":14,"ko":"바누아투만의 특별한 장소","items":[{"n":1,"t":"tf","q":"Visitors dive 3 meters down to reach the Underwater Post Office.","h":"c6184cb66e","ko":"방문객들은 수중 우체국에 가기 위해 3미터 아래로 잠수한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"(B) Then, dive 3 meters down to reach the Underwater Post Office.","(B) 그런 다음, 3미터 아래로 잠수하여 수중 우체국에 도착하세요."]],"w":"6번 문장에 Then, dive 3 meters down to reach the Underwater Post Office가 나옴. 본문과 일치.","c":"T"}},{"n":2,"t":"tf","q":"The staff stamp postcards with a mark that washes away in water.","h":"79de67b9d2","ko":"직원들은 물에 씻겨 나가는 표식을 엽서에 찍는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"(A) There, the underwater postal staff will stamp your postcard with a special engraved mark, which won’t wash away in water, and send it on its way.","(A) 그곳에서, 수중 우체국 직원은 물에 씻겨 나가지 않는 특별하게 새겨진 도장을 여러분의 엽서에 찍어 그것을 발송할 것입니다."]],"w":"5번 문장에 a special engraved mark, which won't wash away in water로 나옴. 씻겨 나가지 않는 표식이라 반대.","c":"F"}},{"n":3,"t":"tf","q":"Visitors can also swim with colorful tropical fish near the post office.","h":"0f1da780b3","ko":"방문객들은 우체국 근처에서 알록달록한 열대어와 함께 수영할 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"While there, you can also explore vibrant coral gardens and swim with colorful tropical fish.","그곳에 있는 동안, 여러분은 또한 생기 넘치는 산호 정원을 탐험하고 다채로운 열대어와 함께 수영할 수 있습니다."]],"w":"9번 문장에 you can also explore vibrant coral gardens and swim with colorful tropical fish가 나옴. 본문과 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Purchase waterproof postcards at the Hideaway Island Resort gift shop, and write your message using waterproof markers or pens.)","h":"ea68018e73","ko":"본문에 쓰인 밑줄 친 waterproof의 뜻을 고르시오.","opts":["값비싼","활기찬","새겨진","방수의"],"word":"waterproof","r":{"a":"4) 방수의","ev":"4번 문장","s":[[4,"Purchase waterproof postcards at the Hideaway Island Resort gift shop, and write your message using waterproof markers or pens.","Hideaway 섬 리조트의 선물 가게에서 방수 엽서를 구매하고, 방수 마커나 펜을 사용하여 여러분의 메시지를 작성하세요."]],"w":"4번 문장 waterproof postcards는 '방수 엽서'. 물속에서 쓰기 위한 엽서라는 흐름. 활기찬(vibrant), 새겨진(engraved)은 다른 단어의 뜻.","c":4}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (There, the underwater postal staff will stamp your postcard with a special engraved mark, which won’t wash away in water, and send it on its way.)","h":"abfad10623","ko":"본문에 쓰인 밑줄 친 stamp의 문맥상 뜻을 고르시오.","opts":["찢다","도장을 찍다","발로 쾅쾅 밟다","포장하다"],"word":"stamp","r":{"a":"2) 도장을 찍다","ev":"5번 문장","s":[[5,"(A) There, the underwater postal staff will stamp your postcard with a special engraved mark, which won’t wash away in water, and send it on its way.","(A) 그곳에서, 수중 우체국 직원은 물에 씻겨 나가지 않는 특별하게 새겨진 도장을 여러분의 엽서에 찍어 그것을 발송할 것입니다."]],"w":"5번 문장 the staff will stamp your postcard with a special engraved mark에서 stamp는 동사. 엽서에 표식을 '도장 찍다'. 명사 '우표' 뜻과 혼동 주의.","c":2}},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSince 2003, it has welcomed nearly 100,000 visitors annually and has earned a reputation as a must-visit destination!","ko":"밑줄 친 it이 가리키는 것은?","opts":["바누아투의 수중 우체국","태평양","선물 가게","수중 우체국 직원들"],"r":{"a":"1) 바누아투의 수중 우체국","ev":"2~3번 문장","s":[[2,"Visit Vanuatu’s Underwater Post Office, located just off the coast of Hideaway Island, and send postcards beneath the crystal-clear waters of the Pacific.","Hideaway 섬 해안에서 약간 떨어진 곳에 위치한 바누아투의 수중 우체국을 방문하여 태평양의 아주 깨끗한 물속에서 엽서를 보내보세요."],[3,"Since 2003, it has welcomed nearly 100,000 visitors annually and has earned a reputation as a must-visit destination!","2003년부터, 그곳은 매년 거의 10만 명의 방문객을 맞이하며 꼭 가 봐야 할 여행지로 명성을 얻어왔습니다!"]],"w":"2번 문장의 바누아투의 수중 우체국을 3번 문장에서 it으로 받음(2003년부터 매년 약 10만 명이 방문).","c":1,"k":"it = 바누아투의 수중 우체국"},"sko":"2003년부터, 그곳은 매년 거의 10만 명의 방문객을 맞이하며 꼭 가 봐야 할 여행지로 명성을 얻어왔습니다!","pron":"it","h":"ff815538d3"},{"n":7,"t":"sense","q":"Which is the closest in meaning to sentence 10? 'Thanks to Vanuatu's Marine Park laws, the area is well protected...'","h":"af81c29c18","ko":"10번 문장(Thanks to Vanuatu's Marine Park laws, the area is well protected)과 의미가 가장 가까운 것은?","sko":"바누아투의 해양 공원법 덕분에, 이 지역은 잘 보호되어 있다.","opts":["법 때문에 방문객이 줄었다","야생 동물이 많아서 법이 생겼다","바누아투의 해양 공원 법 덕분에 그 지역이 잘 보호된다","그 지역이 보호되지 않아 환경이 파괴되고 있다"],"r":{"a":"3) 바누아투의 해양 공원 법 덕분에 그 지역이 잘 보호된다","ev":"10번 문장","s":[[10,"Thanks to Vanuatu’s Marine Park laws, the area is well protected, thereby preserving its stunning environment and wildlife for everyone to enjoy.","바누아투의 해양 공원법 덕분에, 이 지역은 잘 보호되어 있으며, 그 결과 모두가 즐길 수 있도록 눈부시게 아름다운 환경과 야생동물을 보존하고 있습니다."]],"w":"Thanks to ~는 '~ 덕분에'. 해양 공원 법이 원인, 지역이 잘 보호됨이 결과. 원인과 결과를 뒤집은 ②에 주의.","c":3}},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["방문객들은 리조트에서 바다 쪽으로 50미터 떨어진 곳까지 보트를 탄다.","그곳은 2013년에 문을 열었고 매년 약 1만 명의 방문객을 맞이한다.","엽서는 방문객이 섬을 떠난 뒤에야 보낼 수 있다.","그곳은 어떤 섬에서도 멀리 떨어진 태평양 한가운데에 서 있다."],"opts":["Visitors take a boat ride 50 meters offshore from the resort.","It opened in 2013 and welcomes about 10,000 visitors a year.","Postcards can be sent only after visitors leave the island.","It stands in the middle of the Pacific, far from any island."],"r":{"a":"1) Visitors take a boat ride 50 meters offshore from the resort. (방문객들은 리조트에서 바다 쪽으로 50미터 떨어진 곳까지 보트를 탄다.)","ev":"7번 문장","s":[[7,"(C) Once your card is ready, take a boat ride 50 meters offshore from the resort.","(C) 여러분의 엽서가 준비되면, 리조트에서 바다 쪽으로 50미터 떨어진 곳까지 보트를 타고 가세요."]],"w":"7번 문장 take a boat ride 50 meters offshore from the resort. ②는 3번(2003년부터 약 10만 명), ③은 4~5번, ④는 2번(Hideaway 섬 해안 근처)과 어긋남.","c":1},"h":"c08c87718c"},{"n":9,"t":"sum","q":"Visitors can be a part of (A) by sending a postcard from the world’s (B) underwater post office.","ko":"방문객들은 세계 (B) 수중 우체국에서 엽서를 보내 (A)의 한 부분이 될 수 있다.","oko":["(A) 역사 / (B) 최초의","(A) 역사 / (B) 마지막의","(A) 과학 / (B) 최초의", at the prison stay quiet when something unusual happens.","Using geese as guards is not a new idea.","The geese guards patrol the area outside the prison's outer walls."],"r":{"a":"3) Using geese as guards is not a new idea. (거위를 경비원으로 이용하는 것은 새로운 생각이 아니다.)","ev":"12번 문장","s":[[12,"Using geese as guards isn’t a new idea.","거위를 경비원으로 이용하는 것은 새로운 개념이 아니다."]],"w":"12번 문장 Using geese as guards isn’t a new idea. ①은 13~16번(중국·스코틀랜드에서도 사용), ②는 9번(이상하면 울어댐), ④는 4번(울타리와 외벽 사이)과 어긋남.","c":3},"h":"fbc91026a7"},{"n":9,"t":"sum","q":"Geese are (A) and fearless, so they work as (B) guards in places such as prisons, borders, and warehouses.","h":"28fe953485","ko":"거위는 (A)고 두려움을 모르기 때문에 교도소, 국경, 창고 같은 곳에서 (B) 경비원으로 일한다.","oko":["(A) 시끄러운 / (B) 믿을 만한","(A) 시끄러운 / (B) 게으른","(A) 조용한 / (B) 믿을 만한","(A) 조용한 / (B) 게으른","(A) 약한 / (B) 믿을 만한"],"opts":["(A) loud / (B) reliable","(A) loud / (B) lazy","(A) quiet / (B) reliable","(A) quiet / (B) lazy","(A) weak / (B) reliable"],"r":{"a":"1) (A) loud / (B) reliable","ev":"8번, 17~18번 문장","s":[[8,"They’re loud, fearless, and always on high alert.","그들은 시끄럽고, 두려움이 없으며, 항상 높은 경계 태세이다."],[17,"From prisons to borders and whisky warehouses, these honking birds prove they’re more than just farm animals.","교도소부터 국경, 그리고 위스키 창고까지, 이 꽥꽥거리는 새들은 그들이 단순한 농장 동물 그 이상임을 증명한다."],[18,"They’re clever, loud, and surprisingly reliable security guards!","그들은 영리하고, 시끄러우며, 놀랍도록 믿을 만한 보안 경비원이다!"]],"w":"8번 문장: They're loud, fearless → (A) loud. 18번 문장: surprisingly reliable security guards → (B) reliable. 거위는 시끄럽다고 했으므로 quiet은 반대.","c":1}},{"n":10,"t":"fill","q":"Their honks are so [A] and clear that prison guards can [B] them echoing across the grounds.","ko":"그들의 울음소리는 매우 [A] 또렷해서 교도관들은 그 소리가 교도소 부지 전체에 울려 퍼지는 것을 [B] 수 있다.","bko":{"hear":"듣다","sharp":"날카로운","hiss":"쉬익 소리를 내다","patrol":"순찰하다","defend":"방어하다","escape":"탈출하다"},"bank":["hear","sharp","hiss","patrol","defend","escape"],"r":{"a":"[A] sharp (날카로운), [B] hear (듣다)","ev":"10번 문장","s":[[10,"Their honks are so sharp and clear that prison guards can hear them echoing across the grounds.","그들의 울음소리는 매우 날카롭고 또렷해서 교도관들은 그 소리가 교도소 부지 전체에 울려 퍼지는 것을 들을 수 있다."]],"w":"10번 문장 \"Their honks are so sharp and clear that prison guards can hear them echoing\"에서 가져옴. [A]는 so 뒤 형용사, [B]는 can 뒤 동사원형(소리를 듣다).","c":null},"h":"72be7aac27"}]},{"u":6,"id":"r16","no":16,"ko":"우주 미션 중에 이런 일이!","items":[{"n":1,"t":"tf","q":"The Soviet Union collapsed while Krikalev was on his space mission.","h":"9e90a574be","ko":"소련은 Krikalev가 우주 임무를 수행하는 동안 붕괴되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, during his mission, the Soviet Union collapsed, and everything changed.","그러나, 그의 임무 중 소련이 붕괴되었고, 모든 것이 바뀌었다."]],"w":"3번 문장에 during his mission, the Soviet Union collapsed 라고 나옴. 임무 중 소련 붕괴는 사실.","c":"T"}},{"n":2,"t":"tf","q":"Krikalev returned to Earth earlier than planned.","h":"a6907c3f3b","ko":"Krikalev는 계획보다 일찍 지구로 돌아왔다.","r":{"a":"F (본문과 다른 내용)","ev":"1번, 10번 문장","s":[[1,"In 1991, Sergei Krikalev, a Soviet astronaut, left Earth for a five-month mission on the Mir space station.","1991년, 소련의 우주비행사 Sergei Krikalev는 미르 우주 정거장에서의 5개월간의 임무를 위해 지구를 떠났다."],[10,"After 311 days in space — more than twice the planned time — Krikalev finally returned to Earth.","계획된 시간의 두 배가 넘는 311일을 우주에서 보낸 후, Krikalev는 마침내 지구로 돌아왔다."]],"w":"원래 계획은 five-month(1번)였고 실제로는 311일 뒤에 돌아옴(10번). 일찍이 아니라 계획의 두 배 넘게 늦게 돌아옴.","c":"F"}},{"n":3,"t":"tf","q":"Krikalev chose to stay because no one else could take care of the station.","h":"6b480e54a5","ko":"Krikalev는 정거장을 돌볼 다른 사람이 없어서 남기로 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6~7번 문장","s":[[6,"Krikalev had the option to return using an escape capsule, but with no one else to maintain the station, it could have suffered serious damage.","Krikalev는 탈출 캡슐을 사용하여 돌아올 선택지가 있었지만, 그 정거장을 유지 관리할 다른 사람 없이는, 그것은 심각한 손상을 입을 수도 있었다."],[7,"So he decided to remain.","그래서 그는 남기로 결정했다."]],"w":"6번 문장에 no one else to maintain the station, 7번 문장에 So he decided to remain 이 나옴. 관리할 사람이 없어서 남기로 한 것이므로 사실.","c":"T"}},{"n":4,"t":"vocab","q":"His job was to conduct experiments and maintain the station.","h":"86033ae101","ko":"그의 임무는 실험을 수행하고 정거장을 유지·관리하는 것이었다.","opts":["취소하다","수행하다, 실시하다","설명하다","방문하다"],"word":"conduct","r":{"a":"2) 수행하다, 실시하다","ev":"2번 문장","s":[[2,"His job was to conduct experiments and maintain the station.","그의 임무는 실험을 수행하고 정거장을 유지 관리하는 것이었다."]],"w":"conduct experiments = 실험을 수행하다[실시하다]. 임무 내용을 말하는 문장이라 수행하다가 알맞음.","c":2}},{"n":5,"t":"vocab","q":"a highly respected figure in the history of space exploration","h":"433c0c3c5c","ko":"우주 탐사 역사에서 매우 존경받는 (   )","opts":["숫자","모양","인물","그림"],"word":"figure","r":{"a":"3) 인물","ev":"12번 문장","s":[[12,"Krikalev’s commitment and courage during such a difficult time have made him a highly respected figure in the history of space exploration.","그런 어려운 시기 동안의 Krikalev의 헌신과 용기는 우주 탐험의 역사에서 그를 매우 존경받는 인물로 만들었다."]],"w":"figure는 숫자·모양 등 여러 뜻이 있지만 여기서는 respected figure = 존경받는 인물. 사람을 꾸미는 말이라 인물.","c":3}},{"n":6,"t":"ref","q":"What does “its” refer to? — “By then, his country no longer existed, and his salary in rubles had lost much of its value.”","ko":"“its”가 가리키는 것은? — 그 무렵, 그의 조국은 더 이상 존재하지 않았고, 그의 루블 급여는 가치를 많이 잃었다.","sko":"그 무렵, 그의 조국은 더 이상 존재하지 않았고, 그의 루블 급여는 가치를 많이 잃었다.","opts":["his country","his salary","the Soviet Union","Krikalev’s health"],"r":{"a":"2) his salary","ev":"11번 문장","s":[[11,"By then, his country no longer existed, and his salary in rubles had lost much of its value.","그 무렵, 그의 조국은 더 이상 존재하지 않았고, 그의 루블 급여는 가치를 많이 잃었다."]],"w":"11번 문장 his salary in rubles had lost much of its value에서 its는 가치를 잃은 his salary.","c":2,"k":"its = his salary"},"pron":"its","h":"26e373e92b"},{"n":7,"t":"sense","q":"[5번 문장] “… the answer was always, ‘You’ll have to wait a bit longer.’”","ko":"[5번 문장] 대답은 늘 “당신은 조금 더 기다려야 할 것이다”였다. 이 문장이 보여 주는 상황은?","sko":"대답은 항상 “당신은 조금 더 기다려야 할 것이다.”였다.","opts":["귀환이 계속 미뤄지기만 했다","곧 돌아올 수 있다는 확답을 받았다","기다리는 것을 포기하고 스스로 떠났다","달마다 새로운 임무를 받았다"],"r":{"a":"1) 귀환이 계속 미뤄지기만 했다","ev":"5번 문장","s":[[5, 했고, 2002년에는 그 마을이 완전히 버려졌다."]],"w":"4번 문장: 1990년대에는 사람들이 떠나기 시작했고(began leaving), 완전히 버려진 것은 2002년. 시기를 바꾼 오답.","c":"F"}},{"n":3,"t":"tf","q":"A viewing platform opened in Houtouwan in 2017.","h":"3e526d27a6","ko":"Houtouwan에는 2017년에 전망대가 문을 열었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"A viewing platform opened in 2017, and hiking trails guide visitors through its winding alleys and overgrown ruins.","2017년에 전망대가 개장되었고, 하이킹 코스는 구불구불한 골목길과 무성하게 자란 폐허를 따라 관광객들을 안내한다."]],"w":"11번 문장에 A viewing platform opened in 2017 이 나옴.","c":"T"}},{"n":4,"t":"vocab","q":"its remote location made life difficult","h":"23125064ca","ko":"그 마을의 (   ) 위치는 생활을 힘들게 했다","opts":["유명한","외진, 외딴","위험한","가까운"],"word":"remote","r":{"a":"2) 외진, 외딴","ev":"3번 문장","s":[[3,"However, its remote location made life difficult, and work opportunities were limited.","그러나, 그것의 외딴 위치는 생활을 어렵게 했고, 일자리는 제한적이었다."]],"w":"remote = 외진, 외딴. 생활이 힘들고 일자리가 제한되었다는 내용과 연결되어 외딴 위치.","c":2}},{"n":5,"t":"vocab","q":"winding alleys","h":"f8d2ec82d6","ko":"(   ) 골목","opts":["좁고 어두운","막다른","구불구불한","가파른"],"word":"winding","r":{"a":"3) 구불구불한","ev":"11번 문장","s":[[11,"A viewing platform opened in 2017, and hiking trails guide visitors through its winding alleys and overgrown ruins.","2017년에 전망대가 개장되었고, 하이킹 코스는 구불구불한 골목길과 무성하게 자란 폐허를 따라 관광객들을 안내한다."]],"w":"winding = 구불구불한. 하이킹 코스가 구불구불한 골목과 폐허를 지나 안내한다는 문장.","c":3}},{"n":6,"t":"ref","q":"What does “its” refer to? — “In 2015, stunning photos of the village went viral online, attracting tourists eager to explore its mysterious beauty.”","ko":"“its”가 가리키는 것은? — 2015년, 그 마을의 굉장히 아름다운 사진들이 온라인에서 널리 퍼지면서, 그것의 신비로운 아름다움을 탐험하기를 열망하는 관광객들을 끌어들였다.","sko":"2015년, 그 마을의 굉장히 아름다운 사진들이 온라인에서 널리 퍼지면서, 그것의 신비로운 아름다움을 탐험하기를 열망하는 관광객들을 끌어들였다.","opts":["Shanghai","nature","the tourists","the village"],"r":{"a":"4) the village","ev":"9번 문장","s":[[9,"In 2015, stunning photos of the village went viral online, attracting tourists eager to explore its mysterious beauty.","2015년, 그 마을의 굉장히 아름다운 사진  says the chef is the real reason airplane food tastes bad.","h":"a9b74fa9f3","ko":"필자는 요리사가 기내식 맛이 나쁜 진짜 이유라고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"1~2번 문장","s":[[1,"Airplane food often gets a bad reputation, but the truth is, it’s not the chef’s fault.","기내식은 종종 안 좋은 평판을 받지만, 사실 그것은 요리사의 잘못이 아니다."],[2,"The real reason lies in science.","진짜 이유는 과학에 있다."]],"w":"1번에서 it's not the chef's fault, 2번에서 진짜 이유는 science라고 함. 요리사 탓이 아니므로 F.","c":"F"}},{"n":3,"t":"tf","q":"Sweet and salty flavors weaken by approximately 30% on a plane.","h":"92f6923d98","ko":"비행기 안에서는 단맛과 짠맛이 약 30% 약해진다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"As a result, sweet and salty flavors weaken by approximately 30%.","결과적으로, 단맛과 짠맛이 약 30퍼센트 정도 약해진다."]],"w":"5번 문장에 sweet and salty flavors weaken by approximately 30%가 나옴. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Airlines know these challenges, so they adjust their recipes.","h":"977b1807a9","ko":"항공사들은 이런 어려움을 알고 있어서 조리법을 조절한다.","opts":["포기하다","비판하다","조절하다","주문하다"],"word":"adjust","r":{"a":"3) 조절하다","ev":"9번 문장","s":[[9,"Airlines know these challenges, so they adjust their recipes by adding extra salt, sugar, and bold flavors.","항공사는 이러한 어려움을 잘 알고 있어서, 추가적인 소금, 설탕과 강렬한 맛을 더하여 조리법을 조절한다."]],"w":"adjust는 동사 '조절하다, 맞추다'. 9번에서 소금·설탕을 더 넣어 조리법을 맞춘다는 흐름.","c":3}},{"n":5,"t":"vocab","q":"People eating with loud background noise rate food less sweet or salty.","h":"37511e8240","ko":"시끄러운 배경 소음 속에서 먹는 사람들은 음식을 덜 달거나 덜 짜다고 평가한다.","opts":["평가하다","달리다","주문하다","요리하다"],"word":"rate","r":{"a":"1) 평가하다","ev":"7번 문장","s":[[7,"Studies reveal that people eating with loud background noise rate food less sweet or salty than when eating in silence.","연구는 시끄러운 배경 소음 속에서 식사하는 사람들이 고요함 속에서 식사할 때에 비해 음식을 덜 달거나 덜 짜다고 평가한다는 것을 보여준다."]],"w":"rate는 명사 '속도, 요금'으로도 쓰이지만 여기서는 동사 '평가하다'. rate food less sweet = 음식을 덜 달다고 평가함.","c":1}},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nSome airlines even test recipes in simulated cabins to develop recipes that could dsides.","그 시스템은 재난 현장, 지방 진료소, 그리고 환자 병상과 같은 다양한 환경에 도입될 것으로 예상된다."]],"w":"11번 문장 The system is expected to be adopted in various settings such as disaster sites, rural clinics, and patient bedsides. ①은 8번(버블 안으로 팔을 넣음), ③은 11번, ④는 9번(분해해서 재사용)과 어긋남.","c":2},"h":"fcd293fba1"},{"n":9,"t":"sum","q":"SurgiField has (A) potential and is ready to make a global impact on (B).","ko":"SurgiField는 (A) 가능성을 지니고 있으며 (B) 분야에 전 세계적 영향을 미칠 준비가 되어 있다.","oko":["(A) 무한한 / (B) 의료","(A) 무한한 / (B) 스포츠","(A) 거의 없는 / (B) 의료","(A) 거의 없는 / (B) 스포츠","(A) 제한된 / (B) 관광"],"opts":["(A) unlimited / (B) healthcare","(A) unlimited / (B) sports","(A) little / (B) healthcare","(A) little / (B) sports","(A) limited / (B) tourism"],"r":{"a":"1) (A) unlimited / (B) healthcare ((A) 무한한 / (B) 의료)","ev":"12번 문장","s":[[12,"With ⓔ unlimited potential ahead, SurgiField is ready to make a global impact on healthcare.","무한한 가능성을 앞에 두고, SurgiField는 보건 의료 분야에 전 세계적 영향을 미칠 준비가 되어 있다."]],"w":"12번 문장 With unlimited potential ahead, SurgiField is ready to make a global impact on healthcare.","c":1},"h":"97c46d7202"},{"n":10,"t":"fill","q":"When surgery is [A], the patient lies inside the transparent, [B] bubble.","ko":"수술이 [A] 때, 환자는 투명한 [B] 버블 안에 눕는다.","bko":{"sealed":"밀폐된","battery":"배터리","required":"필요한","backpack":"배낭","armholes":"팔 구멍들","procedure":"수술, 절차"},"bank":["sealed","battery","required","backpack","armholes","procedure"],"r":{"a":"[A] required (필요한), [B] sealed (밀폐된)","ev":"6번 문장","s":[[6,"When surgery is required, the patient lies inside the transparent, sealed bubble.","수술이 필요할 때, 환자는 투명한 밀폐된 버블 안에 눕는다."]],"w":"6번 문장 \"When surgery is required, the patient lies inside the transparent, sealed bubble.\"에서 가져옴. [A]는 is 뒤 형용사/분사, [B]는 bubble을 꾸미는 분사.","c":null},"h":"fb54da2e9a"}]},{"u":7,"id":"r21","no":21,"ko":"느리게, 준비, 출발!","items":[{"n":1,"t":"tf","q":"The snail racing event will be held this Saturday.","h":"f7610f3a45","ko":"달팽이 경주 행사는 이번 토요일에 열린다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Thi
