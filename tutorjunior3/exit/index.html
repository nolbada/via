than sunlight가 원인이고, moonbows look white instead of colored가 결과예요. 원인과 결과를 바꾸거나, ‘사람의 눈이 약하다’는 말은 본문에 없어요.","c":2},"h":"51d9107189"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["달무지개는 무지개보다 더 흔하다.","달무지개는 사람의 눈에 무지개만큼 화려한 색으로 보인다.","달무지개에는 어두운 하늘과 밝은 태양이 필요하다.","달무지개를 보려면 달이 보는 사람 뒤에 있어야 한다."],"opts":["Moonbows are more common than rainbows.","Moonbows look as colorful as rainbows to human eyes.","A moonbow needs a dark sky and a bright sun.","To see a moonbow, the moon must be behind the viewer."],"r":{"a":"4) To see a moonbow, the moon must be behind the viewer.","ev":"6번, 10~12번 문장","s":[[6,"However, because moonlight is weaker than sunlight, moonbows look white instead of colored to human eyes.","하지만, 달빛은 햇빛보다 더 약하기 때문에, 달무지개는 사람의 눈에 유채색 대신 하얀색으로 보인다."],[10,"Also, a dark sky is necessary.","또한, 어두운 하늘이 필요하다."],[11,"Finally, the moon must be behind the viewer.","마지막으로, 달은 보는 사람 뒤에 있어야 한다."],[12,"Because of all these requirements, moonbows are much less common than rainbows.","이 모든 요건들 때문에, 달무지개는 무지개보다 훨씬 덜 흔하다."]],"w":"11번에서 달은 보는 사람 뒤에 있어야 한다고 해요. 달무지개는 훨씬 덜 흔하고(12번), 하얗게 보이며(6번), 필요한 것은 밝은 태양이 아니라 밝은 달과 어두운 하늘이에요(9~10번).","c":4},"h":"d40e364fa9"},{"n":9,"t":"sum","q":"Moonbows require many (A), so they are much (B) common than rainbows.","ko":"달무지개는 많은 (A)을 필요로 해서 무지개보다 훨씬 덜 흔하다.","oko":["(A) 색깔 / (B) 더","(A) 조건 / (B) 더","(A) 무지개 / (B) 덜","(A) 태양 / (B) 덜","(A) 조건 / (B) 덜"],"opts":["(A) colors / (B) more","(A) conditions / (B) more","(A) rainbows / (B) less","(A) suns / (B) less","(A) conditions / (B) less"],"r":{"a":"5) (A) conditions / (B) less","ev":"12~13번 문장","s":[[12,"Because of all these requirements, moonbows are much less common than rainbows.","이 모든 요건들 때문에, 달무지개는 무지개보다 훨씬 덜 흔하다."],[13,"That is why we do not see them often.","그것이 우리가 그것들을 자주 보지 못하는 이유이다."]],"w":"12번에서 이 모든 요건(requirements = 조건) 때문에 달무지개는 무지개보다 훨씬 덜(less) 흔하다고 하고, 13번에서 그래서 자주 못 본다고 해요. ‘더(more) 흔하다’는 반대예요.","c":5},"h":"34e7d34ada"},{"n":10,"t":"fill","q":"To see a moonbow, the air must have enough [A], and the moon must be behind the [B].","ko":"달무지개를 보려면 공기에 충분한 [A]이 있어야 하고, 달은 보는 [B] 뒤에 있어야 한다.","bank":["moisture","viewer","white","lunar","weaker","often"],"bko":{"moisture":"수분, 습기","viewer":"보는 사람","white":"하얀색의","lunar":"달의","weaker":"더 약한","often":"자주"},"r":{"a":"[A] moisture, [B] viewer","ev":"8번, 11번 문장","s":[[8,"First, the air needs to have enough moisture in it, like when or right after it rains, or when you are near a waterfall or the sea.","첫째, 비가 올 때나 온 직후, 또는 당신이 폭포나 바다 근처에 있을 때와 같이, 공기가 그 안에 충분한 수분을 가지고 있을 필요가 있다."],[11,"Finally, the moon must be behind the viewer.","마지막으로, 달은 보는 사람 뒤에 있어야 한다."]],"w":"8번 the air needs to have enough moisture in it, 11번 the moon must be behind the viewer에서 가져왔어요. white·lunar·weaker는 형용사, often은 부사라 명사가 필요한 [A], [B]에 들어갈 수 없어요.","c":null},"h":"2e334c27bd"}]},{"u":6,"id":"rj3-06-4","no":4,"ko":"세계 지도를 바꾸는 바닷속 화산","items":[{"n":1,"t":"tf","q":"Surtsey is a volcanic island near Iceland.","ko":"Surtsey는 아이슬란드 근처의 화산섬이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"One example is Surtsey, a volcanic island near Iceland.","한 가지 예는 아이슬란드 근처의 화산섬인 Surtsey이다."]],"w":"3번 문장에 Surtsey, a volcanic island near Iceland라고 나와요. 본문과 같은 내용이에요.","c":"T"},"h":"71dc8cb769"},{"n":2,"t":"tf","q":"The eruption of Surtsey lasted for less than a year.","ko":"Surtsey의 분출은 1년이 채 안 되게 계속되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The eruption lasted for more than three years, and the island grew to a size of 2.7 km2.","그 분출은 3년 이상 계속되었고, 그 섬은 2.7km2의 크기까지 커졌다."]],"w":"7번 문장에서 분출은 3년 이상(more than three years) 계속되었다고 해요. 1년이 안 된다는 말은 틀려요.","c":"F"},"h":"7b6da3706f"},{"n":3,"t":"tf","q":"Surtsey was named after the god of the sea in Nordic myths.","ko":"Surtsey는 북유럽 신화의 바다의 신의 이름을 따서 이름 지어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"It was named after the god of fire in Nordic myths, Surtr.","그것은 Surtr라는 북유럽 신화의 불의 신의 이름을 따서 이름 지어졌다."]],"w":"8번 문장에서 Surtsey는 북유럽 신화의 ‘불의 신’ Surtr의 이름을 따서 지어졌다고 해요. 바다의 신이 아니에요.","c":"F"},"h":"508fe5017a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He saw hot lava coming up to the surface of the water.)","ko":"그는 뜨거운 용암이 물의 ( )으로 솟아 나오고 있는 것을 보았다.","opts":["깊이","바닥","구석","표면"],"word":"surface","r":{"a":"4) 표면","ev":"5~6번 문장","s":[[5,"He saw hot lava coming up to the surface of the water.","그는 뜨거운 용암이 수면으로 솟아 나오고 있는 것을 보았다."],[6,"This formed a small island in the sea.","이것은 바다에 작은 섬을 형성했다."]],"w":"5번에서 용암이 물속에서 위로 솟아 나오고, 6번에서 그것이 바다에 작은 섬을 만들어요. 섬이 되려면 물 위로 나와야 하니 surface = 표면, 수면이에요.","c":4},"h":"010b67ddd8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…how plants and animals from other places settle on new land.)","ko":"…다른 곳으로부터 온 식물들과 동물들이 새로운 땅에 ( )하는 방법…","opts":["해결","정착","떠남","사라짐"],"word":"settle","r":{"a":"2) 정착","ev":"11번 문장","s":[[11,"Also, it has been protected since its birth because it allows scientists to observe how plants and animals from other places settle on new land.","또한, 그것은 과학자들이 다른 곳으로부터 온 식물들과 동물들이 새로운 땅에 정착하는 방법을 관찰하도록 허락하기 때문에 그것의 출현 이래로 보호되어 왔다."]],"w":"11번은 다른 곳에서 온 식물과 동물이 새로 생긴 땅에서 어떻게 되는지를 관찰한다는 내용이에요. 새 땅에 자리 잡는다는 뜻이라 settle = 정착하다예요(‘해결하다’ 뜻이 아니에요).","c":2},"h":"a0ed19f1a1"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis formed a small island in the sea.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 바다에 작은 섬을 형성했다.","opts":["아이슬란드","섬의 이름","뜨거운 용암이 수면으로 솟아 나온 것","유네스코의 결정"],"r":{"a":"3) 뜨거운 용암이 수면으로 솟아 나온 것","ev":"5~6번 문장","s":[[5,"He saw hot lava coming up to the surface of the water.","그는 뜨거운 용암이 수면으로 솟아 나오고 있는 것을 보았다."],[6,"This formed a small island in the sea.","이것은 바다에 작은 섬을 형성했다."]],"w":"This는 바로 앞 5번에서 어부가 본 장면, 즉 뜨거운 용암이 수면으로 솟아 나온 것이에요. 그 결과 바다에 작은 섬이 만들어졌어요.","c":3},"h":"97fec16904"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because of the island’s great scientific value, UNESCO named it a World Heritage Site in 2008.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 섬의 대단한 과학적 가치 때문에, 유네스코는 그것을 2008년에 세계 문화유산으로 지정했다.","opts":["섬의 과학적 가치가 대단해서 유네스코는 2008년에 그것을 세계 문화유산으로 지정했다.","유네스코가 지정한 뒤에야 그 섬은 과학적 가치를 갖게 되었다.","섬의 과학적 가치가 낮아서 유네스코는 2008년에 지정을 취소했다.","유네스코는 2008년에 이 섬의 이름을 새로 지었다."],"r":{"a":"1) 섬의 과학적 가치가 대단해서 유네스코는 2008년에 그것을 세계 문화유산으로 지정했다.","ev":"12번 문장","s":[[12,"Because of the island’s great scientific value, UNESCO named it a World Heritage Site in 2008.","그 섬의 대단한 과학적 가치 때문에, 유네스코는 그것을 2008년에 세계 문화유산으로 지정했다."]],"w":"Because of ~는 이유를 나타내고, name A B는 ‘A를 B로 지정하다’예요. 가치가 이유이고 세계 문화유산 지정이 결과예요. 원인과 결과를 뒤집은 선지는 틀려요.","c":1},"h":"ae4dff0d6e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["어부는 1999년에 처음 그곳에서 화산 활동을 보았다.","Surtsey는 과학자들의 연구 장소가 된 적이 없다.","지구는 발달을 모두 마쳐서 더 이상 변하지 않는다.","Surtsey는 섬이 어떻게 형성되고 발달하는지에 관한 정보를 제공해 왔다."],"opts":["A fisherman first saw volcanic activity there in 1999.","Surtsey has never been a place of study for scientists.","Earth has finished developing, so it does not change anymore.","Surtsey has provided information on how islands form and develop."],"r":{"a":"4) Surtsey has provided information on how islands form and develop.","ev":"1~2번, 4번, 9~10번 문장","s":[[1,"Did you know Earth is still developing?","당신은 지구가 여전히 발달하고 있다는 것을 알고 있었는가?"],[2,"Every day, earthquakes and volcanoes are creating new land or changing the existing landscape.","매일, 지진과 화산이 새로운 땅을 만들거나 기존의 풍경을 바꾸고 있다."],[4,"A fisherman first saw volcanic activity there on November 14, 1963.","1963년 11월 14일에 한 어부가 처음으로 그곳에서의 화산 활동을 보았다."],[9,"From the start, Surtsey has been a place of study for scientists.","처음부터, Surtsey는 과학자들을 위한 연구 장소가 되어 왔다."],[10,"It has provided information on how islands form and develop.","그것은 어떻게 섬이 형성되고 발달하는지에 관한 정보를 제공해 왔다."]],"w":"10번에서 Surtsey가 섬이 형성되고 발달하는 방법에 관한 정보를 제공해 왔다고 해요. 어부가 본 것은 1963년이고(4번), 처음부터 연구 장소였고(9번), 지구는 아직도 변하고 있어요(1~2번).","c":4},"h":"d162ab4656"},{"n":9,"t":"sum","q":"Surtsey has been protected because scientists can observe how (A) and animals from other places settle on new (B).","ko":"Surtsey는 과학자들이 다른 곳에서 온 (A)과 동물이 새로운 (B)에 정착하는 방법을 관찰할 수 있기 때문에 보호되어 왔다.","oko":["(A) 화산 / (B) 바다","(A) 사람 / (B) 땅","(A) 식물 / (B) 바다","(A) 바위 / (B) 땅","(A) 식물 / (B) 땅"],"opts":["(A) volcanoes / (B) sea","(A) people / (B) land","(A) plants / (B) sea","(A) rocks / (B) land","(A) plants / (B) land"],"r":{"a":"5) (A) plants / (B) land","ev":"11번 문장","s":[[11,"Also, it has been protected since its birth because it allows scientists to observe how plants and animals from other places settle on new land.","또한, 그것은 과학자들이 다른 곳으로부터 온 식물들과 동물들이 새로운 땅에 정착하는 방법을 관찰하도록 허락하기 때문에 그것의 출현 이래로 보호되어 왔다."]],"w":"11번에서 과학자들은 다른 곳에서 온 식물(plants)과 동물이 새로운 땅(new land)에 정착하는 방법을 관찰해요. 사람·바위·화산·바다는 그 자리에 들어간다는 말이 없어요.","c":5},"h":"fc3f499034"},{"n":10,"t":"fill","q":"He saw hot [A] coming up to the surface of the water, and this [B] a small island in the sea.","ko":"그는 뜨거운 [A]이 수면으로 솟아 나오는 것을 보았고, 이것은 바다에 작은 섬을 [B].","bank":["lava","formed","fisherman","surface","island","Iceland"],"bko":{"lava":"용암","formed":"형성했다","fisherman":"어부","surface":"표면","island":"섬","Iceland":"아이슬란드"},"r":{"a":"[A] lava, [B] formed","ev":"5~6번 문장","s":[[5,"He saw hot lava coming up to the surface of the water.","그는 뜨거운 용암이 수면으로 솟아 나오고 있는 것을 보았다."],[6,"This formed a small island in the sea.","이것은 바다에 작은 섬을 형성했다."]],"w":"5번 He saw hot lava coming up to the surface of the water, 6번 This formed a small island in the sea에서 가져왔어요. 나머지는 모두 명사라 동사 자리인 [B]에 들어갈 수 없어요.","c":null},"h":"ddc7054262"}]},{"u":7,"id":"rj3-07-1","no":1,"ko":"귀여운 건 못 참지!","items":[{"n":1,"t":"tf","q":"We may cry tears of joy when our brain is balancing our feelings.","ko":"우리는 우리의 뇌가 우리의 감정의 균형을 잡고 있을 때 기쁨의 눈물을 흘릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"This is what is happening when we cry tears of joy or burst into nervous laughter.","이것은 우리가 기쁨의 눈물을 흘리거나 긴장의 웃음을 터뜨릴 때 일어나는 일이다."],[10,"It’s simply our brain balancing our feelings.","그저 우리의 뇌가 우리의 감정의 균형을 잡아주는 것이다."]],"w":"9번에서 기쁨의 눈물을 흘리거나 긴장의 웃음을 터뜨릴 때 일어나는 일이라고 했고, 10번에서 그것은 우리 뇌가 감정의 균형을 잡아 주는 것이라고 해요.","c":"T"},"h":"03981bfc41"},{"n":2,"t":"tf","q":"Cute aggression is harmful, so we should stop feeling it.","ko":"귀여운 공격성은 해로워서 우리는 그것을 느끼는 것을 멈춰야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Cute aggression is normal and harmless.","귀여운 공격성은 정상적이고 무해하다."]],"w":"4번 문장에서 귀여운 공격성은 normal and harmless(정상적이고 무해하다)라고 해요. 해롭다는 말과 멈춰야 한다는 말은 본문과 달라요.","c":"F"},"h":"fc713ac46e"},{"n":3,"t":"tf","q":"People who want to squeeze a cute puppy’s ears or paws may have experienced cute aggression.","ko":"귀여운 강아지의 귀나 발을 꼭 쥐고 싶은 사람들은 귀여운 공격성을 경험했을지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"Do you want to squeeze its ears or paws?","그것의 귀나 발을 꼭 쥐고 싶은가?"],[3,"If so, you may have experienced something known as cute aggression.","그렇다면 당신은 귀여운 공격성으로 알려진 것을 경험했을지도 모른다."]],"w":"2번에서 귀나 발을 꼭 쥐고 싶은지 묻고, 3번에서 그렇다면 귀여운 공격성으로 알려진 것을 경험했을지도 모른다고 해요.","c":"T"},"h":"6698e64098"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It is actually a common reaction to seeing something adorable.)","ko":"그것은 실제로 ( ) 것을 본 것에 대한 흔한 반응이다.","opts":["무서운","이상한","사랑스러운","지루한"],"word":"adorable","r":{"a":"3) 사랑스러운","ev":"5번 문장","s":[[5,"It is actually a common reaction to seeing something adorable.","그것은 실제로 사랑스러운 것을 본 것에 대한 흔한 반응이다."]],"w":"귀여운 공격성은 강아지처럼 귀여운 것을 볼 때 나오는 반응이에요. 그래서 adorable은 '사랑스러운'이에요.","c":3},"h":"2a05cb51c2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When one emotion becomes too intense, it makes us express the opposite feeling.)","ko":"한 감정이 너무 강렬해지면, 그것은 우리가 정반대의 감정을 ( )하도록 만든다.","opts":["숨기다","표현하다","잊다","기다리다"],"word":"express","r":{"a":"2) 표현하다","ev":"8~9번 문장","s":[[8,"When one emotion becomes too intense, it makes us express the opposite feeling.","한 감정이 너무 강렬해지면 그것은 우리가 정반대의 감정을 표현하도록 만든다."],[9,"This is what is happening when we cry tears of joy or burst into nervous laughter.","이것은 우리가 기쁨의 눈물을 흘리거나 긴장의 웃음을 터뜨릴 때 일어나는 일이다."]],"w":"기쁜데 눈물이 나는 것처럼 정반대의 감정이 겉으로 나타나는 이야기예요(9번). 그래서 express는 '표현하다'예요.","c":2},"h":"ecce62f3d5"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is what is happening when we cry tears of joy or burst into nervous laughter.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 우리가 기쁨의 눈물을 흘리거나 긴장의 웃음을 터뜨릴 때 일어나는 일이다.","opts":["한 감정이 너무 강렬해질 때 정반대의 감정을 표현하게 되는 것","귀여운 강아지를 보고 놀라는 것","강아지의 귀를 꼭 쥐는 것","뇌가 쉬는 것"],"r":{"a":"1) 한 감정이 너무 강렬해질 때 정반대의 감정을 표현하게 되는 것","ev":"8~9번 문장","s":[[8,"When one emotion becomes too intense, it makes us express the opposite feeling.","한 감정이 너무 강렬해지면 그것은 우리가 정반대의 감정을 표현하도록 만든다."],[9,"This is what is happening when we cry tears of joy or burst into nervous laughter.","이것은 우리가 기쁨의 눈물을 흘리거나 긴장의 웃음을 터뜨릴 때 일어나는 일이다."]],"w":"기쁜데 눈물이 나거나 긴장해서 웃음이 터지는 것은 8번에서 말한 '감정이 너무 강렬할 때 정반대의 감정이 나오는 일'의 예예요. 그래서 This는 8번 내용을 가리켜요.","c":1},"h":"9242dc3c18"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Don’t be surprised if you feel like pinching a cute puppy’s cheek.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"귀여운 강아지의 볼을 꼬집고 싶은 마음이 들더라도 놀라지 마라.","opts":["귀여운 강아지의 볼을 꼬집으면 강아지가 놀랄 것이다.","귀여운 강아지를 보고 놀라는 사람은 꼬집힐 것이다.","강아지의 볼을 꼬집고 싶은 사람은 놀라야 한다.","귀여운 강아지의 볼을 꼬집고 싶은 마음이 들어도 놀랄 필요 없다."],"r":{"a":"4) 귀여운 강아지의 볼을 꼬집고 싶은 마음이 들어도 놀랄 필요 없다.","ev":"12번 문장","s":[[12,"Don’t be surprised if you feel like pinching a cute puppy’s cheek.","귀여운 강아지의 볼을 꼬집고 싶은 마음이 들더라도 놀라지 마라."]],"w":"feel like pinching은 '꼬집고 싶다'이고 Don't be surprised는 '놀라지 마라'예요. 꼬집고 싶은 마음은 놀랄 일이 아니라는 뜻이에요.","c":4},"h":"0f3d6b2b89"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["귀여운 공격성은 사람들이 강아지를 볼 때만 생긴다.","귀여운 공격성은 사랑스러운 것을 볼 때 나오는 흔한 반응이다.","귀여운 공격성은 사람에게 상처를 주는 드문 병이다.","사람들은 귀여운 것을 싫어하기 때문에 귀여운 공격성을 느낀다."],"opts":["Cute aggression happens only when people see a puppy.","Cute aggression is a common reaction to seeing something adorable.","Cute aggression is a rare illness that hurts people.","People feel cute aggression because they dislike cute things."],"r":{"a":"2) Cute aggression is a common reaction to seeing something adorable.","ev":"4~5번 문장","s":[[4,"Cute aggression is normal and harmless.","귀여운 공격성은 정상적이고 무해하다."],[5,"It is actually a common reaction to seeing something adorable.","그것은 실제로 사랑스러운 것을 본 것에 대한 흔한 반응이다."]],"w":"5번에서 귀여운 공격성은 사랑스러운 것을 볼 때 나오는 흔한 반응이라고 해요. 강아지에게만 생기는 것이 아니고, 드문 병도 아니에요(4번에서 무해하다고 해요). 귀여운 것을 싫어한다는 말도 본문에 없어요.","c":2},"h":"f5ff5e5a56"},{"n":9,"t":"sum","q":"When we see something extremely (A), our brain creates feelings of (B) to prevent us from being overwhelmed.","ko":"우리가 극도로 (A)한 것을 보면, 우리의 뇌는 압도당하는 것을 막기 위해 (B)한 감정을 만든다.","oko":["(A) 무서운 / (B) 공격성","(A) 귀여운 / (B) 웃음","(A) 슬픈 / (B) 기쁨","(A) 무서운 / (B) 웃음","(A) 귀여운 / (B) 공격성"],"opts":["(A) scary / (B) aggression","(A) cute / (B) laughter","(A) sad / (B) joy","(A) scary / (B) laughter","(A) cute / (B) aggression"],"r":{"a":"5) (A) cute / (B) aggression","ev":"11번 문장","s":[[11,"So, when we see something extremely cute, our brain creates feelings of aggression to prevent us from being overwhelmed by the cuteness.","그래서 우리가 극도로 귀여운 것을 볼 때 우리의 뇌는 우리가 귀여움에 압도당하는 것을 막기 위해 공격적인 감정을 만든다."]],"w":"11번에서 극도로 귀여운 것을 보면(cute) 뇌가 공격적인 감정(aggression)을 만들어 귀여움에 압도당하는 것을 막는다고 해요. 웃음이나 기쁨이 아니라 공격성이에요.","c":5},"h":"cdbac7d08c"},{"n":10,"t":"fill","q":"Our brain wants to keep our [A] balanced, so when one emotion becomes too [B], it makes us express the opposite feeling.","ko":"우리의 뇌는 우리의 [A]이 균형 잡히게 유지하기를 원해서, 한 감정이 너무 [B]해지면 정반대의 감정을 표현하도록 만든다.","bank":["emotions","intense","cheeks","paws","puppies","cuteness"],"bko":{"emotions":"감정들","intense":"강렬한","cheeks":"볼들","paws":"발들","puppies":"강아지들","cuteness":"귀여움"},"r":{"a":"[A] emotions, [B] intense","ev":"7~8번 문장","s":[[7,"Our brain wants to keep our emotions balanced at all times.","우리의 뇌는 항상 우리의 감정이 균형 잡히게 유지하기를 원한다."],[8,"When one emotion becomes too intense, it makes us express the opposite feeling.","한 감정이 너무 강렬해지면 그것은 우리가 정반대의 감정을 표현하도록 만든다."]],"w":"7번에서 뇌는 우리의 감정(emotions)이 균형 잡히기를 원하고, 8번에서 한 감정이 너무 강렬해지면(intense) 반대 감정을 표현하게 한다고 해요. cheeks, paws, puppies는 균형을 맞추는 대상이 아니고, [B]는 '너무 ~해지면'에 맞는 형용사여야 해요.","c":null},"h":"ab698036c5"}]},{"u":7,"id":"rj3-07-2","no":2,"ko":"내 둥지를 받아줘!","items":[{"n":1,"t":"tf","q":"A male bowerbird chews berries or charcoal and mixes them with saliva.","ko":"수컷 바우어새는 딸기류 열매나 숯을 씹어서 침과 섞는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Next, it chews berries or charcoal, mixing them with saliva.","다음으로, 그것은 딸기류 열매나 숯을 침과 섞으면서 씹는다."]],"w":"6번 문장에 chews berries or charcoal, mixing them with saliva가 그대로 나와요. 딸기류 열매나 숯을 씹어 침과 섞는다는 내용과 일치해요.","c":"T"},"h":"ecaf4807bc"},{"n":2,"t":"tf","q":"The male bowerbird uses only natural things to decorate its bower.","ko":"수컷 바우어새는 바우어를 장식하는 데 자연물만 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Some will even gather small pieces of colorful plastic or glass.","몇몇은 심지어 형형색색의 플라스틱이나 유리의 작은 조각들을 모으기도 할 것이다."]],"w":"10번에서 일부 수컷은 형형색색의 플라스틱이나 유리 조각까지 모은다고 해요. 자연물만 쓴다는 말은 본문과 달라요.","c":"F"},"h":"ac07db5a10"},{"n":3,"t":"tf","q":"Female bowerbirds stay in one bower and wait for the male.","ko":"암컷 바우어새들은 한 바우어에 머물며 수컷을 기다린다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Female bowerbirds then wander around from bower to bower.","그러고 나서 암컷 바우어새들은 바우어에서 바우어로 이리저리 돌아다닌다."]],"w":"11번에서 암컷 바우어새들은 바우어에서 바우어로 이리저리 돌아다닌다(wander around from bower to bower)고 해요. 한곳에 머문다는 말은 반대예요.","c":"F"},"h":"93e9dc7531"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It then arranges them into a bower.)","ko":"그러고 나서 그것은 그것들을 배열하여 바우어로 ( ).","opts":["던지다","배열하다","먹다","부수다"],"word":"arranges","r":{"a":"2) 배열하다","ev":"5번 문장","s":[[5,"It then arranges them into a bower and sometimes even makes a path leading up to it.","그러고 나서 그것은 그것들을 배열하여 바우어로 만들고 심지어 때때로 그것으로 이어지는 길을 만든다."]],"w":"수컷은 나뭇가지들(them)을 모아 바우어 모양으로 놓아요. 그래서 arrange는 '배열하다'예요.","c":2},"h":"f32719f031"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Female bowerbirds then wander around from bower to bower.)","ko":"그러고 나서 암컷 바우어새들은 바우어에서 바우어로 ( ).","opts":["잠을 자다","숨다","날아오르다","이리저리 돌아다니다"],"word":"wander","r":{"a":"4) 이리저리 돌아다니다","ev":"11~12번 문장","s":[[11,"Female bowerbirds then wander around from bower to bower.","그러고 나서 암컷 바우어새들은 바우어에서 바우어로 이리저리 돌아다닌다."],[12,"They look at the decorations and taste the paint.","그것들은 장식을 보고 페인트를 맛본다."]],"w":"암컷이 바우어를 하나씩 옮겨 가며 장식을 보고 페인트를 맛봐요(12번). 그래서 wander around는 '이리저리 돌아다니다'예요.","c":4},"h":"6d37dbde46"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey look at the decorations and taste the paint.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 장식을 보고 페인트를 맛본다.","opts":["암컷 바우어새들","수컷 바우어새들","작은 나뭇가지들","조개껍데기와 돌멩이들"],"r":{"a":"1) 암컷 바우어새들","ev":"11~12번 문장","s":[[11,"Female bowerbirds then wander around from bower to bower.","그러고 나서 암컷 바우어새들은 바우어에서 바우어로 이리저리 돌아다닌다."],[12,"They look at the decorations and taste the paint.","그것들은 장식을 보고 페인트를 맛본다."]],"w":"11번 문장의 주어가 Female bowerbirds(암컷 바우어새들)이고, 12번의 They는 그 암컷들을 받아요. 장식하는 쪽은 수컷이지만 보고 맛보는 쪽은 암컷이에요.","c":1},"h":"ec75cd7eb2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Most birds attract mates with their beautiful feathers or songs.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"대부분의 새들은 그것들의 아름다운 깃털이나 노래로 짝의 마음을 끈다.","opts":["대부분의 새는 짝에게서 아름다운 깃털과 노래를 빼앗는다.","몇몇 새만이 깃털이나 노래로 짝의 마음을 끈다.","대부분의 새는 아름다운 깃털이나 노래로 짝의 마음을 끈다.","대부분의 새는 깃털과 노래 없이 짝을 찾는다."],"r":{"a":"3) 대부분의 새는 아름다운 깃털이나 노래로 짝의 마음을 끈다.","ev":"1번 문장","s":[[1,"Most birds attract mates with their beautiful feathers or songs.","대부분의 새들은 그것들의 아름다운 깃털이나 노래로 짝의 마음을 끈다."]],"w":"Most birds는 '대부분의 새', attract mates는 '짝의 마음을 끌다'예요. 깃털이나 노래가 그 방법이라는 뜻이고, 이어지는 2번에서 바우어새는 이와 다르다고 해요.","c":3},"h":"01cf21b8ad"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["수컷 바우어새는 짝짓기 철 한가운데에서 바우어를 짓는다.","수컷 바우어새는 작은 나뭇가지를 모아 바우어로 배열한다.","암컷 바우어새가 짝을 끌기 위해 바우어를 짓는다.","바우어새는 아름다운 노래를 불러 짝의 마음을 끈다."],"opts":["The male bowerbird builds a bower in the middle of mating season.","The male bowerbird gathers small sticks and arranges them into a bower.","The female bowerbird builds a bower to attract a mate.","The bowerbird sings beautiful songs to attract a mate."],"r":{"a":"2) The male bowerbird gathers small sticks and arranges them into a bower.","ev":"4~5번 문장","s":[[4,"At the start of mating season, the male bowerbird begins to gather small sticks.","짝짓기 철의 시작에, 수컷 바우어새는 작은 나뭇가지들을 모으기 시작한다."],[5,"It then arranges them into a bower and sometimes even makes a path leading up to it.","그러고 나서 그것은 그것들을 배열하여 바우어로 만들고 심지어 때때로 그것으로 이어지는 길을 만든다."]],"w":"4번에서 수컷은 작은 나뭇가지를 모으고, 5번에서 그것들을 바우어로 배열해요. 시작은 짝짓기 철의 시작(4번)이고, 짓는 쪽은 수컷이며, 노래가 아니라 바우어로 짝의 마음을 끌어요(2~3번).","c":2},"h":"30ee805cd8"},{"n":9,"t":"sum","q":"When female bowerbirds find a (A) that they like, they choose that male to be their (B).","ko":"암컷 바우어새들은 마음에 드는 (A)를 발견하면, 그 수컷을 그들의 (B)로 선택한다.","oko":["(A) 노래 / (B) 짝","(A) 바우어 / (B) 적","(A) 깃털 / (B) 짝","(A) 노래 / (B) 적","(A) 바우어 / (B) 짝"],"opts":["(A) song / (B) mate","(A) bower / (B) enemy","(A) feather / (B) mate","(A) song / (B) enemy","(A) bower / (B) mate"],"r":{"a":"5) (A) bower / (B) mate","ev":"13번 문장","s":[[13,"When they find a bower that they like, they choose that male to be their mate!","그것들이 자신이 좋아하는 바우어를 발견하면, 그것들은 그 수컷을 그것들의 짝으로 선택한다!"]],"w":"13번에서 암컷은 마음에 드는 바우어(bower)를 발견하면 그 수컷을 짝(mate)으로 선택해요. 노래나 깃털이 아니라 바우어이고, 적이 아니라 짝이에요.","c":5},"h":"25e76a1e1e"},{"n":10,"t":"fill","q":"The mixture is used as [A] for the bower’s walls, and the bird decorates its bower with brightly [B] objects.","ko":"그 혼합물은 바우어의 벽을 위한 [A]로 사용되고, 새는 밝은 [B] 물건들로 바우어를 장식한다.","bank":["paint","colored","songs","mate","path","season"],"bko":{"paint":"페인트","colored":"빛깔의, 색이 칠해진","songs":"노래들","mate":"짝","path":"길","season":"철"},"r":{"a":"[A] paint, [B] colored","ev":"7~8번 문장","s":[[7,"Then, this mixture is used as paint for the bower’s walls.","그러고 나서, 이 혼합물은 바우어의 벽을 위한 페인트로 사용된다."],[8,"Finally, it begins to decorate its bower with brightly colored objects.","마지막으로, 그것은 밝은 빛깔의 물건들로 그것의 바우어를 장식하기 시작한다."]],"w":"7번에서 열매·숯과 침을 섞은 혼합물은 바우어 벽의 페인트(paint)로 쓰여요. 8번에서는 밝은 빛깔의(brightly colored) 물건으로 바우어를 장식해요. songs·mate·path·season은 벽에 쓰는 재료도 아니고 objects를 꾸미는 말도 아니에요.","c":null},"h":"430fa71df5"}]},{"u":7,"id":"rj3-07-3","no":3,"ko":"4kg을 먹어 치우는 0.1cm의 그들","items":[{"n":1,"t":"tf","q":"Beetles have been around for over 200 million years.","ko":"딱정벌레는 2억 년 이상 동안 있어 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Beetles are natural cleaners that have been around for over 200 million years.","딱정벌레는 2억 년 이상 동안 있어 온 타고난 청소부들이다."]],"w":"6번 문장에서 딱정벌레는 2억 년 이상 동안 있어 온 타고난 청소부들이라고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"a0b4bee49d"},{"n":2,"t":"tf","q":"Scientists can get bones with some damage thanks to the beetles.","ko":"과학자들은 딱정벌레 덕분에 어느 정도 손상된 뼈를 얻을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"Thanks to these new workers, scientists can get clean and undamaged bones.","이 새로운 일꾼들 덕분에, 과학자들은 깨끗하고 손상되지 않은 뼈들을 얻을 수 있다."]],"w":"14번에서 딱정벌레 덕분에 과학자들은 깨끗하고 손상되지 않은(undamaged) 뼈를 얻을 수 있다고 해요. 손상된 뼈라는 말은 반대예요.","c":"F"},"h":"94aee8bb24"},{"n":3,"t":"tf","q":"The beetles eat the bones of dead animals only.","ko":"딱정벌레는 죽은 동물의 뼈만 먹는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Moreover, they eat the dead bodies of animals, except for the bones.","게다가, 그들은 뼈들을 제외하고 동물의 사체를 먹는다."]],"w":"8번에서 딱정벌레는 뼈를 제외하고(except for the bones) 동물의 사체를 먹는다고 해요. 뼈만 먹는다는 말은 반대예요.","c":"F"},"h":"d814d25bb0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They eat animal waste.)","ko":"그들은 동물 ( )을 먹는다.","opts":["낭비","배설물","뼈","가죽"],"word":"waste","r":{"a":"2) 배설물","ev":"6~7번 문장","s":[[6,"Beetles are natural cleaners that have been around for over 200 million years.","딱정벌레는 2억 년 이상 동안 있어 온 타고난 청소부들이다."],[7,"They eat animal waste.","그들은 동물 배설물을 먹는다."]],"w":"6번에서 딱정벌레는 청소부라고 했어요. 청소부가 먹는 waste는 '낭비'가 아니라 동물이 남긴 '배설물'이에요.","c":2},"h":"be0683abe9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The beetles eat all the other body parts and leave the bones untouched.)","ko":"딱정벌레들은 사체의 모든 다른 부분을 먹고 뼈들을 ( ) 상태로 둔다.","opts":["훼손되지 않은","사라진","더러운","부러진"],"word":"untouched","r":{"a":"1) 훼손되지 않은","ev":"13~14번 문장","s":[[13,"However, the beetles eat all the other body parts and leave the bones untouched.","하지만, 딱정벌레들은 사체의 모든 다른 부분을 먹고 뼈들을 훼손되지 않은 상태로 둔다."],[14,"Thanks to these new workers, scientists can get clean and undamaged bones.","이 새로운 일꾼들 덕분에, 과학자들은 깨끗하고 손상되지 않은 뼈들을 얻을 수 있다."]],"w":"14번에서 과학자들은 손상되지 않은(undamaged) 뼈를 얻는다고 해요. 그래서 untouched는 '훼손되지 않은'이에요.","c":1},"h":"f4291e9b7e"},{"n":6,"t":"ref","q":"What does the underlined \"those chemicals\" refer to?\nUnfortunately, those chemicals could damage the bones.","ko":"밑줄 친 those chemicals가 가리키는 것은?","sko":"유감스럽게도, 그 화학 물질들은 뼈들을 손상시킬 수 있었다.","opts":["딱정벌레가 먹는 동물의 배설물","딱정벌레가 먹지 않는 동물의 뼈","과학자들이 가죽과 근육을 제거하려고 쓰던 강한 화학 물질","박물관의 새로운 일꾼들"],"r":{"a":"3) 과학자들이 가죽과 근육을 제거하려고 쓰던 강한 화학 물질","ev":"11~12번 문장","s":[[11,"In the past, scientists used strong chemicals to remove the skin and muscle from the bones of animals they wanted to study.","과거에, 과학자들은 그들이 연구하기를 원하는 동물의 뼈들에서 가죽과 근육을 제거하기 위해 강한 화학 물질들을 사용했다."],[12,"Unfortunately, those chemicals could damage the bones.","유감스럽게도, 그 화학 물질들은 뼈들을 손상시킬 수 있었다."]],"w":"11번에서 과학자들이 뼈에서 가죽과 근육을 제거하려고 strong chemicals(강한 화학 물질)를 썼다고 했고, 12번의 those chemicals가 바로 그것을 받아요.","c":3},"h":"046542a6e7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In addition to working at museums, these beetles also work for scientists.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"박물관에서 일하는 것뿐만 아니라, 이 딱정벌레들은 또한 과학자들을 위해서도 일한다.","opts":["이 딱정벌레들은 박물관에서 일하는 대신 과학자들을 위해서만 일한다.","박물관에서 일하는 과학자들이 이 딱정벌레들을 돕는다.","이 딱정벌레들은 과학자들이 일하는 박물관에서 길러진다.","이 딱정벌레들은 박물관에서 일할 뿐 아니라 과학자들을 위해서도 일한다."],"r":{"a":"4) 이 딱정벌레들은 박물관에서 일할 뿐 아니라 과학자들을 위해서도 일한다.","ev":"10번 문장","s":[[10,"In addition to working at museums, these beetles also work for scientists.","박물관에서 일하는 것뿐만 아니라, 이 딱정벌레들은 또한 과학자들을 위해서도 일한다."]],"w":"In addition to ~는 '~뿐만 아니라, ~ 외에도'예요. 박물관에서 일하는 것에 더해 과학자들을 위해서도 일한다는 뜻이에요. '대신'이나 '~만'이 아니에요.","c":4},"h":"5b0236159c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["박물관의 일꾼들은 동물의 뼈를 깨끗이 닦는 사람들이다.","박물관의 일꾼들은 딱정벌레여서 불평하지 않는다.","박물관의 일꾼들은 사체를 먹는 일에 대해 불평한다.","박물관의 일꾼들은 동물의 배설물을 먹는 로봇이다."],"opts":["The workers at the museum are people who clean animal bones.","The workers at the museum never complain because they are beetles.","The workers at the museum complain about eating dead bodies.","The workers at the museum are robots that eat animal waste."],"r":{"a":"2) The workers at the museum never complain because they are beetles.","ev":"4~5번 문장","s":[[4,"It sounds scary, but the workers never complain.","그것은 무섭게 들리지만, 그 일꾼들은 절대 불평하지 않는다."],[5,"That is because they are beetles.","그것은 그들이 딱정벌레이기 때문이다."]],"w":"4번에서 일꾼들은 절대 불평하지 않고, 5번에서 그 이유는 그들이 딱정벌레이기 때문이라고 해요. 사람도 로봇도 아니고 불평하지도 않아요.","c":2},"h":"6c37717188"},{"n":9,"t":"sum","q":"In the past, scientists used strong chemicals that could (A) bones, but now beetles eat the other body parts and leave the bones (B).","ko":"과거에 과학자들은 뼈를 (A)할 수 있는 강한 화학 물질을 썼지만, 지금은 딱정벌레가 다른 몸 부분을 먹고 뼈를 (B) 상태로 둔다.","oko":["(A) 깨끗하게 / (B) 훼손되지 않은","(A) 손상시킬 / (B) 손상된","(A) 보호할 / (B) 훼손되지 않은","(A) 보호할 / (B) 손상된","(A) 손상시킬 / (B) 훼손되지 않은"],"opts":["(A) clean / (B) untouched","(A) damage / (B) damaged","(A) protect / (B) untouched","(A) protect / (B) damaged","(A) damage / (B) untouched"],"r":{"a":"5) (A) damage / (B) untouched","ev":"11~13번 문장","s":[[11,"In the past, scientists used strong chemicals to remove the skin and muscle from the bones of animals they wanted to study.","과거에, 과학자들은 그들이 연구하기를 원하는 동물의 뼈들에서 가죽과 근육을 제거하기 위해 강한 화학 물질들을 사용했다."],[12,"Unfortunately, those chemicals could damage the bones.","유감스럽게도, 그 화학 물질들은 뼈들을 손상시킬 수 있었다."],[13,"However, the beetles eat all the other body parts and leave the bones untouched.","하지만, 딱정벌레들은 사체의 모든 다른 부분을 먹고 뼈들을 훼손되지 않은 상태로 둔다."]],"w":"12번에서 화학 물질은 뼈를 손상시킬(damage) 수 있었어요. 13번에서 딱정벌레는 뼈를 훼손되지 않은(untouched) 상태로 둬요.","c":5},"h":"12e2a313f5"},{"n":10,"t":"fill","q":"The beetles used by the museum are only about 10 mm [A], but surprisingly they can [B] about 4 kg a week.","ko":"그 박물관에 의해 사용되는 딱정벌레들은 겨우 약 10mm [A]이지만, 놀랍게도 일주일에 약 4kg을 [B] 수 있다.","bank":["long","eat","heavy","bones","waste","museum"],"bko":{"long":"긴","eat":"먹다","heavy":"무거운","bones":"뼈들","waste":"배설물","museum":"박물관"},"r":{"a":"[A] long, [B] eat","ev":"9번 문장","s":[[9,"The beetles used by the museum are only about 10 mm long, but surprisingly they can eat about 4 kg a week!","그 박물관에 의해 사용되는 딱정벌레들은 길이가 겨우 10mm 정도이지만, 놀랍게도 그들은 일주일에 4kg 가량을 먹을 수 있다!"]],"w":"9번에서 길이가 겨우 10mm 정도(long)이지만 일주일에 4kg을 먹을(eat) 수 있다고 해요. mm는 길이 단위라서 heavy가 아니고, bones·waste·museum은 can 뒤에 오는 동사가 아니에요.","c":null},"h":"84a0af2b13"}]},{"u":7,"id":"rj3-07-4","no":4,"ko":"변신 완료! 정말 감쪽같죠?","items":[{"n":1,"t":"tf","q":"The mimic octopus lives in the sea near Indonesia.","ko":"흉내 문어는 인도네시아 근처의 바다에 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This animal is the mimic octopus, and it lives in the sea near Indonesia.","이 동물은 흉내 문어이고, 그것은 인도네시아 근처의 바다에 산다."]],"w":"3번 문장에서 흉내 문어는 인도네시아 근처의 바다에 산다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"a81d822939"},{"n":2,"t":"tf","q":"The mimic octopus has a hard shell and strong bones.","ko":"흉내 문어는 단단한 껍데기와 튼튼한 뼈를 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The mimic octopus does not have a shell or bones.","흉내 문어는 껍질이나 뼈를 가지고 있지 않다."]],"w":"4번에서 흉내 문어는 껍데기나 뼈를 가지고 있지 않다고 해요. 가지고 있다는 말은 반대예요.","c":"F"},"h":"5b43cf26a2"},{"n":3,"t":"tf","q":"The damselfish swim away because they like sea snakes.","ko":"자리돔은 바다뱀을 좋아해서 헤엄쳐 가 버린다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The damselfish swim away because they are often eaten by sea snakes.","자리돔은 자주 바다뱀에 의해 먹히기 때문에 헤엄쳐 가 버린다."]],"w":"9번에서 자리돔이 헤엄쳐 가는 이유는 바다뱀에게 자주 먹히기 때문이에요. 좋아해서가 아니에요.","c":"F"},"h":"572e94d1d7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is one reason why it has developed a unique way of protecting itself.)","ko":"이는 그것이 스스로를 보호하는 ( ) 방법을 발달시킨 한 가지 이유이다.","opts":["평범한","독특한","위험한","오래된"],"word":"unique","r":{"a":"2) 독특한","ev":"5번 문장","s":[[5,"This is one reason why it has developed a unique way of protecting itself; it tries to look like other sea animals.","이는 그것이 스스로를 보호하는 독특한 방법을 발달시킨 한 가지 이유인데, 그것은 다른 바다 동물들처럼 보이려고 노력한다."]],"w":"껍데기도 뼈도 없어서 다른 바다 동물처럼 보이려는 방법이라고 해요. 흔한 방법이 아니라 이 문어만의 방법이라서 unique는 '독특한'이에요.","c":2},"h":"1e1f022c42"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It takes the shape of a poisonous flatfish to avoid any sudden attacks.)","ko":"그것은 어떤 갑작스런 공격이든 피하기 위해 ( ) 넙치류 물고기의 형태를 취한다.","opts":["맛있는","느린","아주 큰","독이 있는"],"word":"poisonous","r":{"a":"4) 독이 있는","ev":"7번 문장","s":[[7,"For example, when it wants to move around quickly, it takes the shape of a poisonous flatfish to avoid any sudden attacks.","예를 들어, 그것이 빠르게 돌아다니고 싶을 때, 그것은 어떤 갑작스런 공격이든 피하기 위해 독이 있는 넙치류 물고기의 형태를 취한다."]],"w":"공격을 피하려고 취하는 형태이므로 건드리기 무서운 물고기여야 해요. poisonous는 '독이 있는'이에요.","c":4},"h":"6dbfb9638d"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nAlso, when a damselfish comes near, it will change its shape into that of a sea snake.","ko":"밑줄 친 that이 가리키는 것은?","sko":"또한, 자리돔이 가까이 오면 그것은 자신의 형태를 바다뱀의 그것(형태)으로 바꿀 것이다.","opts":["흉내 문어의 색","형태(모양)","자리돔","바다"],"r":{"a":"2) 형태(모양)","ev":"8번 문장","s":[[8,"Also, when a damselfish comes near, it will change its shape into that of a sea snake.","또한, 자리돔이 가까이 오면 그것은 자신의 형태를 바다뱀의 그것(형태)으로 바꿀 것이다."]],"w":"that of a sea snake는 ‘바다뱀의 그것’이라는 뜻이에요. 앞에 나온 its shape의 shape(형태)를 반복하지 않으려고 that으로 바꿔 썼어요.","c":2},"h":"061fb3d852"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Many animals change color to hide from predators.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"많은 동물들은 포식자들로부터 숨기 위해 색을 바꾼다.","opts":["포식자들은 숨기 위해 색을 바꾼다.","많은 동물들은 색을 바꾸기 위해 포식자로부터 숨는다.","많은 동물들은 포식자들로부터 숨기 위해 색을 바꾼다.","몇몇 동물만 포식자에게 보이려고 색을 바꾼다."],"r":{"a":"3) 많은 동물들은 포식자들로부터 숨기 위해 색을 바꾼다.","ev":"1번 문장","s":[[1,"Many animals change color to hide from predators.","많은 동물들은 포식자들로부터 숨기 위해 색을 바꾼다."]],"w":"to hide from predators는 '포식자들로부터 숨기 위해'라는 목적이에요. 색을 바꾸는 것이 방법이고, 숨는 것이 목적이에요.","c":3},"h":"2704c0a511"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["흉내 문어는 색뿐만 아니라 형태도 바꾼다.","흉내 문어는 포식자로부터 숨기 위해서만 색을 바꾼다.","흉내 문어는 자리돔이 가까이 오면 넙치류 물고기로 변한다.","흉내 문어는 인도네시아 근처에서 단단한 껍데기 속에 산다."],"opts":["The mimic octopus changes not only its color but also its shape.","The mimic octopus changes its color only to hide from predators.","The mimic octopus changes into a flatfish when a damselfish comes near.","The mimic octopus lives in a hard shell near Indonesia."],"r":{"a":"1) The mimic octopus changes not only its color but also its shape.","ev":"6번 문장","s":[[6,"It mimics different creatures in different situations by changing not only its color but also its shape.","그것은 그것의 색뿐만 아니라 형태도 바꿈으로써, 각기 다른 상황들에서 다른 생명체들을 흉내 낸다."]],"w":"6번에서 색뿐만 아니라 형태도 바꾼다고 해요. 색만 바꾸는 것이 아니고(6번), 자리돔이 오면 바다뱀으로 변하며(8번), 껍데기가 없어요(4번).","c":1},"h":"7bc8630da2"},{"n":9,"t":"sum","q":"When the mimic octopus wants to move around quickly, it takes the shape of a (A). When a damselfish comes near, it changes into a (B).","ko":"흉내 문어는 빠르게 돌아다니고 싶을 때 (A)의 형태를 취한다. 자리돔이 가까이 오면 (B)로 변한다.","oko":["(A) 바다뱀 / (B) 넙치류 물고기","(A) 자리돔 / (B) 바다뱀","(A) 넙치류 물고기 / (B) 자리돔","(A) 바다뱀 / (B) 자리돔","(A) 넙치류 물고기 / (B) 바다뱀"],"opts":["(A) sea snake / (B) flatfish","(A) damselfish / (B) sea snake","(A) flatfish / (B) damselfish","(A) sea snake / (B) damselfish","(A) flatfish / (B) sea snake"],"r":{"a":"5) (A) flatfish / (B) sea snake","ev":"7~8번 문장","s":[[7,"For example, when it wants to move around quickly, it takes the shape of a poisonous flatfish to avoid any sudden attacks.","예를 들어, 그것이 빠르게 돌아다니고 싶을 때, 그것은 어떤 갑작스런 공격이든 피하기 위해 독이 있는 넙치류 물고기의 형태를 취한다."],[8,"Also, when a damselfish comes near, it will change its shape into that of a sea snake.","또한, 자리돔이 가까이 오면 그것은 자신의 형태를 바다뱀의 그것(형태)으로 바꿀 것이다."]],"w":"7번에서 빠르게 돌아다닐 때는 독이 있는 넙치류 물고기(flatfish)의 형태를 취하고, 8번에서 자리돔이 가까이 오면 바다뱀(sea snake)의 형태로 바꿔요. 두 동물이 서로 바뀌면 안 돼요.","c":5},"h":"5d9f7467dc"},{"n":10,"t":"fill","q":"In this way, the mimic octopus can [A] safe from predators, and “master of [B]” is a great nickname for it.","ko":"이런 식으로, 흉내 문어는 포식자들로부터 안전하게 [A] 수 있고, ‘[B]의 달인’은 그것에게 훌륭한 별명이다.","bank":["stay","transformation","mimic","flatfish","poisonous","nickname"],"bko":{"stay":"계속 ~하게 있다","transformation":"변신, 변화","mimic":"흉내 내다","flatfish":"넙치류 물고기","poisonous":"독이 있는","nickname":"별명"},"r":{"a":"[A] stay, [B] transformation","ev":"10~11번 문장","s":[[10,"In this way, the mimic octopus can stay safe from predators.","이런 식으로, 흉내 문어는 포식자들로부터 계속 안전할 수 있다."],[11,"Surely “master of transformation” is a great nickname for it.","확실히 ‘변신의 달인’은 그것에게 훌륭한 별명이다."]],"w":"10번에서 흉내 문어는 포식자로부터 안전하게 계속 있을 수 있다(can stay safe)고 하고, 11번에서 ‘변신의 달인(master of transformation)’이 훌륭한 별명이라고 해요. mimic은 can 뒤에 와도 safe와 이어지지 않고, flatfish·poisonous·nickname은 [A], [B] 자리에 뜻이 맞지 않아요.","c":null},"h":"e26851731f"}]},{"u":8,"id":"rj3-08-1","no":1,"ko":"말을 타는 어부들?","items":[{"n":1,"t":"tf","q":"Horseback shrimp fishing is now practiced by only about 15 to 20 people.","ko":"승마 새우잡이는 지금은 약 15명에서 20명의 사람들에 의해서만 행해진다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, it is now practiced by about 15 to 20 people.","그러나, 지금은 약 15명에서 20명의 사람들에 의해서만 행해진다."]],"w":"3번 문장에서 지금은 약 15명에서 20명의 사람들에 의해 행해진다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"276b1e2d75"},{"n":2,"t":"tf","q":"The shrimp fishers wear bright red clothing.","ko":"새우잡이들은 밝은 빨간색 옷을 입는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"They wear rubber boots and bright yellow waterproof clothing.","그들은 고무 부츠와 밝은 노란색 방수 옷을 입는다."]],"w":"5번에서 새우잡이들은 고무 부츠와 밝은 노란색(bright yellow) 방수 옷을 입는다고 해요. 빨간색이라는 말은 달라요.","c":"F"},"h":"1b6f40589c"},{"n":3,"t":"tf","q":"The fishing takes place only at high tide.","ko":"낚시는 만조 때에만 이루어진다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The fishing takes place 90 minutes before and after low tide.","낚시는 썰물 전후 90분 동안 일어난다."]],"w":"9번에서 낚시는 썰물(low tide) 전후 90분 동안 이루어진다고 해요. 만조 때에만 한다는 말은 달라요.","c":"F"},"h":"351ffc6d46"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They are ideal for this job because they are strong and calm.)","ko":"그들은 힘이 세고 침착해서 이 일에 ( )이다.","opts":["위험한","어울리지 않는","이상적인","느린"],"word":"ideal","r":{"a":"3) 이상적인","ev":"7번 문장","s":[[7,"They are ideal for this job because they are strong and calm.","그들은 힘이 세고 침착해서 이 일에 이상적이다."]],"w":"말이 힘이 세고 침착하다는 것은 이 일에 알맞다는 이유예요. 그래서 ideal은 '이상적인'이에요.","c":3},"h":"f234806034"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The participant who catches the most shrimp gets to lead the next day’s parade!)","ko":"새우를 가장 많이 잡는 ( )은 다음 날의 퍼레이드를 이끌게 된다!","opts":["참가자","심판","관객","주최자"],"word":"participant","r":{"a":"1) 참가자","ev":"11~12번 문장","s":[[11,"On the first day, there is a shrimp-catching competition.","첫째 날에는 새우 잡기 대회가 있다."],[12,"The participant who catches the most shrimp gets to lead the next day’s parade!","새우를 가장 많이 잡는 참가자가 다음 날의 퍼레이드를 이끌게 된다!"]],"w":"11번에서 새우 잡기 대회가 있다고 했어요. 그 대회에서 새우를 잡는 사람이므로 participant는 '참가자'예요.","c":1},"h":"890dcbe3ae"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThey ride Brabant horses into water that goes up to the horses’ chest.","ko":"밑줄 친 that이 가리키는 것은?","sko":"그들은 Brabant 말들을 타고 말들의 가슴까지 오는 물속으로 들어간다.","opts":["말들","새우잡이들","그물","물"],"r":{"a":"4) 물","ev":"6번 문장","s":[[6,"They ride Brabant horses into water that goes up to the horses’ chest.","그들은 Brabant 말들을 타고 말들의 가슴까지 오는 물속으로 들어간다."]],"w":"that goes up to the horses' chest는 '말들의 가슴까지 오는'이라는 뜻이에요. 가슴까지 오는 것은 물이므로 that은 바로 앞의 water를 받아요.","c":4},"h":"a135b8a5bc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This used to be a common practice along the coast of the North Sea.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 북해의 해안을 따라 흔한 관습이었다.","opts":["이것은 예전에 북해의 해안을 따라 흔한 관습이었다.","이것은 지금도 북해의 해안을 따라 흔한 관습이다.","이것은 북해의 해안을 따라 처음 생긴 관습이다.","이것은 앞으로 북해의 해안을 따라 흔해질 관습이다."],"r":{"a":"1) 이것은 예전에 북해의 해안을 따라 흔한 관습이었다.","ev":"2번 문장","s":[[2,"This used to be a common practice along the coast of the North Sea.","이것은 북해의 해안을 따라 흔한 관습이었다."]],"w":"used to + 동사원형은 '예전에는 ~였다'라는 뜻이에요. 3번 However가 이어져서 지금은 15~20명만 한다고 말하므로 지금은 흔하지 않아요.","c":1},"h":"4e53bac0a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["지역 새우잡이들은 매일 겨울에 모인다.","지역 새우잡이들은 6월 말부터 9월 초까지 일주일에 두 번 모인다.","지역 새우잡이들은 6월 말에 일 년에 한 번만 모인다.","지역 새우잡이들은 봄에 한 달에 두 번 모인다."],"opts":["Local shrimp fishers gather every day in winter.","Local shrimp fishers gather twice a week from late June to early September.","Local shrimp fishers gather only once a year in late June.","Local shrimp fishers gather twice a month in spring."],"r":{"a":"2) Local shrimp fishers gather twice a week from late June to early September.","ev":"4번 문장","s":[[4,"From late June to early September, local shrimp fishers gather twice a week.","6월 말부터 9월 초까지, 지역 새우잡이들은 일주일에 두 번씩 모인다."]],"w":"4번에서 6월 말부터 9월 초까지 일주일에 두 번 모인다고 해요. 매일도, 일 년에 한 번도, 한 달에 두 번도 아니에요. 겨울이나 봄이 아니라 여름 무렵이에요.","c":2},"h":"5efa5c8cb3"},{"n":9,"t":"sum","q":"Every year in late June, a two-day (A) is held. On the first day, there is a shrimp-catching competition, and the winner leads the next day’s (B).","ko":"매년 6월 말에 이틀 간의 (A)가 열린다. 첫째 날에는 새우 잡기 대회가 있고, 우승자는 다음 날의 (B)를 이끈다.","oko":["(A) 축제 / (B) 대회","(A) 수업 / (B) 퍼레이드","(A) 시장 / (B) 대회","(A) 시장 / (B) 썰물","(A) 축제 / (B) 퍼레이드"],"opts":["(A) festival / (B) competition","(A) lesson / (B) parade","(A) market / (B) competition","(A) market / (B) tide","(A) festival / (B) parade"],"r":{"a":"5) (A) festival / (B) parade","ev":"10~12번 문장","s":[[10,"Every year, a two-day Shrimp Festival is held in late June.","매년, 이틀 간의 새우 축제가 6월 말에 열린다."],[11,"On the first day, there is a shrimp-catching competition.","첫째 날에는 새우 잡기 대회가 있다."],[12,"The participant who catches the most shrimp gets to lead the next day’s parade!","새우를 가장 많이 잡는 참가자가 다음 날의 퍼레이드를 이끌게 된다!"]],"w":"10번에서 매년 6월 말에 이틀 간의 새우 축제(Festival)가 열려요. 12번에서 우승자는 다음 날의 퍼레이드(parade)를 이끌어요. 대회는 첫째 날 일이라서 (B)가 아니에요.","c":5},"h":"313a8bd98a"},{"n":10,"t":"fill","q":"They ride Brabant horses into water that goes up to the horses’ [A] and pull [B] through the water to catch the shrimp.","ko":"그들은 Brabant 말들을 타고 말들의 [A]까지 오는 물속으로 들어가 새우를 잡기 위해 물속으로 [B]을 당긴다.","bank":["chest","nets","festival","parade","competition","tide"],"bko":{"chest":"가슴","nets":"그물들","festival":"축제","parade":"퍼레이드","competition":"대회","tide":"조수, 물때"},"r":{"a":"[A] chest, [B] nets","ev":"6, 8번 문장","s":[[6,"They ride Brabant horses into water that goes up to the horses’ chest.","그들은 Brabant 말들을 타고 말들의 가슴까지 오는 물속으로 들어간다."],[8,"They pull nets through the water to catch the shrimp.","그들은 새우를 잡기 위해 물속으로 그물을 당긴다."]],"w":"6번에서 물은 말들의 가슴(chest)까지 오고, 8번에서 새우를 잡기 위해 물속에서 그물(nets)을 끌어요. festival·parade·competition·tide는 말의 몸 부위도 아니고 끌어당기는 도구도 아니에요.","c":null},"h":"72c6128072"}]},{"u":8,"id":"rj3-08-2","no":2,"ko":"일 년에 한 번, 영혼과 만나자","items":[{"n":1,"t":"tf","q":"The Day of the Dead is actually a joyful holiday for remembering dead relatives.","ko":"망자의 날은 사실 고인이 된 친척들을 추모하기 위한 즐거운 명절이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"However, it is actually a joyful Mexican holiday for remembering dead relatives.","하지만, 그것은 사실 고인이 된 친척들을 추모하기 위한 즐거운 멕시코 명절이다."]],"w":"2번에서 However 뒤에 사실은 고인이 된 친척들을 추모하기 위한 즐거운 멕시코 명절이라고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"a7e1ee34c4"},{"n":2,"t":"tf","q":"Families place food and drink on the tables for themselves to eat and drink.","ko":"가족들은 자신들이 먹고 마시도록 탁자 위에 음식과 음료를 둔다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"They place food and drink on these tables for the spirits of their loved ones to eat and drink.","그들은 이 탁자 위에 사랑하는 친척들의 영혼이 먹고 마실 음식과 음료를 둔다."]],"w":"5번에서 음식과 음료는 사랑하는 친척들의 영혼(spirits)이 먹고 마시도록 두는 거예요. 가족들 자신을 위한 것이라는 말은 달라요.","c":"F"},"h":"ba80c9f039"},{"n":3,"t":"tf","q":"The Day of the Dead is a holiday with very little food.","ko":"망자의 날은 음식이 아주 적은 명절이다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Like other holidays, it is full of food.","다른 명절과 마찬가지로, 그것은 음식으로 가득하다."]],"w":"3번에서 다른 명절처럼 음식으로 가득하다(full of food)고 해요. 음식이 적다는 말은 반대예요.","c":"F"},"h":"0f37c575ba"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, it is actually a joyful Mexican holiday for remembering dead relatives.)","ko":"하지만, 그것은 사실 고인이 된 친척들을 추모하기 위한 ( ) 멕시코 명절이다.","opts":["슬픈","즐거운","조용한","무서운"],"word":"joyful","r":{"a":"2) 즐거운","ev":"1~2번 문장","s":[[1,"The Day of the Dead sounds scary.","망자의 날은 무섭게 들린다."],[2,"However, it is actually a joyful Mexican holiday for remembering dead relatives.","하지만, 그것은 사실 고인이 된 친척들을 추모하기 위한 즐거운 멕시코 명절이다."]],"w":"1번에서 무섭게 들린다고 했지만 However로 반대 내용이 이어져요. 그래서 joyful은 '즐거운'이에요.","c":2},"h":"ddbf414d35"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Nearly everyone eats this bread during the holiday to remember their dead relatives.)","ko":"거의 모든 사람이 그들의 고인이 된 친척들을 ( )하기 위해 그 명절 동안 이 빵을 먹는다.","opts":["잊어버리다","만나다","추모하다","놀리다"],"word":"remember","r":{"a":"3) 추모하다","ev":"2번, 11번 문장","s":[[2,"However, it is actually a joyful Mexican holiday for remembering dead relatives.","하지만, 그것은 사실 고인이 된 친척들을 추모하기 위한 즐거운 멕시코 명절이다."],[11,"Nearly everyone eats this bread during the holiday to remember their dead relatives.","거의 모든 사람이 그들의 고인이 된 친척들을 추모하기 위해 그 명절 동안 이 빵을 먹는다."]],"w":"이 명절은 돌아가신 친척들을 기리는 날이에요(2번). 그래서 remember는 '기억하다'를 넘어 '추모하다'예요.","c":3},"h":"b574d29656"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey also decorate these tables with candles, and skulls made of sugar.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 또한 초와, 설탕으로 만든 해골로 이 탁자를 장식한다.","opts":["고인이 된 친척들","가족들","아이들","영혼들"],"r":{"a":"2) 가족들","ev":"4, 6번 문장","s":[[4,"Families celebrate this holiday by setting up small tables for their dead relatives.","가족들은 고인이 된 친척들을 위한 작은 탁자를 마련함으로써 이 명절을 기념한다."],[6,"They also decorate these tables with candles, and skulls made of sugar.","그들은 또한 초와, 설탕으로 만든 해골로 이 탁자를 장식한다."]],"w":"4번에서 탁자를 마련하는 사람들은 Families(가족들)예요. 6번의 They는 그 가족들을 받아서 탁자를 초와 설탕 해골로 장식해요.","c":2},"h":"0649967d10"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These sugar skulls are not always meant to be eaten.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 설탕 해골들이 항상 먹히려고 의도되는 것은 아니다.","opts":["이 설탕 해골은 항상 먹도록 만들어진다.","이 설탕 해골은 절대 먹을 수 없다.","이 설탕 해골은 가끔만 탁자 위에 놓인다.","이 설탕 해골은 항상 먹으려고 만드는 것은 아니다."],"r":{"a":"4) 이 설탕 해골은 항상 먹으려고 만드는 것은 아니다.","ev":"7~8번 문장","s":[[7,"These sugar skulls are not always meant to be eaten.","이 설탕 해골들이 항상 먹히려고 의도되는 것은 아니다."],[8,"However, children are often allowed to enjoy this sweet candy.","하지만, 아이들은 흔히 이 달콤한 사탕을 먹도록 허락된다."]],"w":"not always는 '항상 ~인 것은 아니다'라는 부분 부정이에요. 먹으려고 만드는 경우도 있지만 항상은 아니라는 뜻이고, 8번에서 아이들은 먹도록 허락돼요.","c":4},"h":"6c654dcf49"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["가족들은 고인이 된 친척들을 위해 작은 탁자를 마련한다.","가족들은 살아 있는 친척들을 위해 큰 탁자를 마련한다.","가족들은 음식 없이 이 명절을 기념한다.","가족들은 아이들만을 위해 작은 탁자를 마련한다."],"opts":["Families set up small tables for their dead relatives.","Families set up large tables for their living relatives.","Families celebrate this holiday without any food.","Families set up small tables only for the children."],"r":{"a":"1) Families set up small tables for their dead relatives.","ev":"3~4번 문장","s":[[3,"Like other holidays, it is full of food.","다른 명절과 마찬가지로, 그것은 음식으로 가득하다."],[4,"Families celebrate this holiday by setting up small tables for their dead relatives.","가족들은 고인이 된 친척들을 위한 작은 탁자를 마련함으로써 이 명절을 기념한다."]],"w":"4번에서 가족들은 고인이 된 친척들을 위한 작은 탁자를 마련한다고 해요. 큰 탁자도, 살아 있는 친척을 위한 것도, 아이들만을 위한 것도 아니에요. 음식도 있어요(3번).","c":1},"h":"94945a0f31"},{"n":9,"t":"sum","q":"Families decorate the tables with candles and sugar (A), and children are often allowed to (B) this sweet candy.","ko":"가족들은 탁자를 초와 설탕 (A)로 장식하고, 아이들은 흔히 이 달콤한 사탕을 (B)하도록 허락된다.","oko":["(A) 빵 / (B) 즐기다","(A) 해골 / (B) 던지다","(A) 꽃 / (B) 즐기다","(A) 해골 / (B) 즐기다","(A) 빵 / (B) 던지다"],"opts":["(A) bread / (B) enjoy","(A) skulls / (B) throw","(A) flowers / (B) enjoy","(A) skulls / (B) enjoy","(A) bread / (B) throw"],"r":{"a":"4) (A) skulls / (B) enjoy","ev":"6~8번 문장","s":[[6,"They also decorate these tables with candles, and skulls made of sugar.","그들은 또한 초와, 설탕으로 만든 해골로 이 탁자를 장식한다."],[7,"These sugar skulls are not always meant to be eaten.","이 설탕 해골들이 항상 먹히려고 의도되는 것은 아니다."],[8,"However, children are often allowed to enjoy this sweet candy.","하지만, 아이들은 흔히 이 달콤한 사탕을 먹도록 허락된다."]],"w":"6번에서 탁자를 초와 설탕으로 만든 해골(skulls)로 장식해요. 8번에서 아이들은 이 달콤한 사탕을 즐기도록(enjoy) 허락돼요. 빵은 9번에서 따로 나오고, 던진다는 내용은 없어요.","c":4},"h":"ee05e27f3b"},{"n":10,"t":"fill","q":"The food most [A] found on the tables is Day of the Dead bread, and these round, sweet loaves are [B] with the shapes of bones on top.","ko":"이 탁자에서 가장 [A] 발견되는 음식은 망자의 날 빵이고, 이 둥글고 달콤한 빵 덩이는 위에 뼈 모양을 얹은 채로 [B].","bank":["commonly","baked","joyful","sugar","celebrate","spirits"],"bko":{"commonly":"흔히","baked":"구워진","joyful":"즐거운","sugar":"설탕","celebrate":"기념하다","spirits":"영혼들"},"r":{"a":"[A] commonly, [B] baked","ev":"9~10번 문장","s":[[9,"The food most commonly found on these tables is Day of the Dead bread.","이 탁자에서 가장 흔히 발견되는 음식은 망자의 날 빵이다."],[10,"These round, sweet loaves are baked with the shapes of bones on top.","이 둥글고 달콤한 빵 덩이는 위에 뼈 모양(의 반죽)을 얹은 채로 구워진다."]],"w":"9번에서 탁자에서 가장 흔히(commonly) 발견되는 음식이 망자의 날 빵이라고 하고, 10번에서 이 빵이 뼈 모양을 얹어 구워진다(baked)고 해요. joyful·sugar·celebrate·spirits는 most 뒤에 오는 부사도, are 뒤에 오는 과거분사도 아니에요.","c":null},"h":"9af975f9da"}]},{"u":8,"id":"rj3-08-3","no":3,"ko":"문만 여는 것이 아니야","items":[{"n":1,"t":"tf","q":"In ancient Greece and Rome, people believed that keys unlocked the door between heaven and earth.","ko":"고대 그리스와 로마에서 사람들은 열쇠가 하늘과 땅 사이의 문을 연다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They believed that keys unlocked the door between heaven and earth.","그들은 열쇠가 하늘과 땅 사이의 문을 연다고 믿었다."]],"w":"4번 문장에서 그들은 열쇠가 하늘과 땅 사이의 문을 연다고 믿었다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"61c4df1e78"},{"n":2,"t":"tf","q":"In Japan, people believed that tying two keys together created a lucky charm.","ko":"일본에서 사람들은 두 개의 열쇠를 함께 묶는 것이 행운의 부적을 만든다고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"In Japan, people believed that tying three keys together created a lucky charm.","일본에서, 사람들은 세 개의 열쇠를 함께 묶는 것이 행운의 부적을 만드는 것이라고 믿었다."]],"w":"6번에서 일본에서는 세 개(three)의 열쇠를 함께 묶는 것이 행운의 부적을 만든다고 믿었어요. 두 개라는 말은 달라요.","c":"F"},"h":"55787c7b2f"},{"n":3,"t":"tf","q":"Some Romany people think that a door key over their bed gives them nightmares.","ko":"몇몇 집시들은 침대 위의 문 열쇠가 그들에게 악몽을 준다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"They also think that this keeps people from having nightmares.","그들은 또한 이것이 사람들이 악몽을 꾸는 것을 막아 준다고 생각한다."]],"w":"10번에서 그들은 이것이 사람들이 악몽을 꾸는 것을 막아 준다(keeps people from having nightmares)고 생각해요. 악몽을 준다는 말은 반대예요.","c":"F"},"h":"0fe3531578"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In Japan, people believed that tying three keys together created a lucky charm.)","ko":"일본에서, 사람들은 세 개의 열쇠를 함께 ( ) 것이 행운의 부적을 만드는 것이라고 믿었다.","opts":["풀기","자르기","묶기","던지기"],"word":"tying","r":{"a":"3) 묶기","ev":"6번 문장","s":[[6,"In Japan, people believed that tying three keys together created a lucky charm.","일본에서, 사람들은 세 개의 열쇠를 함께 묶는 것이 행운의 부적을 만드는 것이라고 믿었다."]],"w":"세 개의 열쇠를 한데 모아 행운의 부적으로 만든다는 이야기예요. 그래서 tying은 '묶는 것'이에요.","c":3},"h":"e9dfe8e0de"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The three keys were said to unlock the doors to love, money, and well-being.)","ko":"그 세 개의 열쇠들은 사랑과 돈, ( )으로 가는 문을 연다고 전해졌다.","opts":["질병","행복","가난","여행"],"word":"well-being","r":{"a":"2) 행복","ev":"7번 문장","s":[[7,"The three keys were said to unlock the doors to love, money, and well-being.","그 세 개의 열쇠들은 사랑과 돈, 행복으로 가는 문을 연다고 전해졌다."]],"w":"사랑과 돈과 함께 나오는 좋은 것이에요. 열쇠가 열어 주는 좋은 문이므로 well-being은 '행복'이에요.","c":2},"h":"342668e91c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThey think that it helps them sleep well.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그들은 그것이 그들을 잘 자게 도와준다고 생각한다.","opts":["동유럽","침대","금속 고리를 가진 문 열쇠","악몽"],"r":{"a":"3) 금속 고리를 가진 문 열쇠","ev":"8~9번 문장","s":[[8,"Some Romany people in Eastern Europe hang a door key with a metal ring over their bed.","동유럽의 몇몇 집시들은 금속 고리를 가진 문 열쇠를 그들의 침대 위에 걸어 둔다."],[9,"They think that it helps them sleep well.","그들은 그것이 그들을 잘 자게 도와준다고 생각한다."]],"w":"8번에서 집시들이 침대 위에 거는 것은 a door key예요. 잠을 잘 자게 도와주는 것도 그 열쇠여서 9번의 it은 a door key를 가리켜요.","c":3},"h":"fded93c6b9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They also saw them as symbols for remembering the past and looking forward to the future.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 또한 그것들을 과거를 기억하고 미래를 고대하는 상징으로 보았다.","opts":["그들은 열쇠를 과거를 잊고 미래를 걱정하는 상징으로 보았다.","그들은 열쇠를 미래만 고대하는 상징으로 보았다.","그들은 열쇠를 과거에 일어난 일을 숨기는 도구로 보았다.","그들은 열쇠를 과거를 기억하고 미래를 고대하는 상징으로 보았다."],"r":{"a":"4) 그들은 열쇠를 과거를 기억하고 미래를 고대하는 상징으로 보았다.","ev":"5번 문장","s":[[5,"They also saw them as symbols for remembering the past and looking forward to the future.","그들은 또한 그것들을 과거를 기억하고 미래를 고대하는 상징으로 보았다."]],"w":"see A as B는 'A를 B로 보다'예요. remembering the past는 '과거를 기억하는 것', looking forward to the future는 '미래를 고대하는 것'이에요.","c":4},"h":"eb569f2029"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대부분의 사람들은 열쇠를 특별한 문화에서만 쓰는 이상한 도구로 생각한다.","대부분의 사람들은 열쇠를 문을 열거나 시동을 거는 데 쓴다.","열쇠는 문을 잠그거나 비행기를 모는 데 쓰인다.","열쇠로는 자동차에 시동을 걸 수 없다."],"opts":["Most people think that keys are strange tools used only in special cultures.","Most people use keys to unlock doors or start cars.","Keys are used to lock doors or fly airplanes.","Keys cannot be used to start cars."],"r":{"a":"2) Most people use keys to unlock doors or start cars.","ev":"1번 문장","s":[[1,"To most people, keys are common tools that are used to unlock doors or start cars.","대부분의 사람들에게, 열쇠는 문을 열거나 자동차 시동을 거는 데 사용되는 흔한 도구이다."]],"w":"1번에서 대부분의 사람들에게 열쇠는 문을 열거나 자동차 시동을 거는 데 쓰이는 흔한 도구라고 해요. 이상한 도구도 아니고, 비행기와도 상관없으며, 자동차 시동도 걸 수 있어요.","c":2},"h":"efa71898ab"},{"n":9,"t":"sum","q":"Some Romany people hang a door key with a metal ring over their (A) because they think it helps them (B) well.","ko":"몇몇 집시들은 그것이 그들이 잘 (B)하는 데 도움이 된다고 생각해서 금속 고리를 가진 문 열쇠를 (A) 위에 걸어 둔다.","oko":["(A) 문 / (B) 먹다","(A) 침대 / (B) 먹다","(A) 문 / (B) 자다","(A) 자동차 / (B) 자다","(A) 침대 / (B) 자다"],"opts":["(A) door / (B) eat","(A) bed / (B) eat","(A) door / (B) sleep","(A) car / (B) sleep","(A) bed / (B) sleep"],"r":{"a":"5) (A) bed / (B) sleep","ev":"8~9번 문장","s":[[8,"Some Romany people in Eastern Europe hang a door key with a metal ring over their bed.","동유럽의 몇몇 집시들은 금속 고리를 가진 문 열쇠를 그들의 침대 위에 걸어 둔다."],[9,"They think that it helps them sleep well.","그들은 그것이 그들을 잘 자게 도와준다고 생각한다."]],"w":"8번에서 열쇠를 침대(bed) 위에 걸어 두고, 9번에서 그것이 잘 자게(sleep well) 도와준다고 생각해요. 문 위나 자동차 위가 아니고, 먹는 것과도 관계없어요.","c":5},"h":"ae167d5d01"},{"n":10,"t":"fill","q":"In ancient Greece and Rome, people thought that keys allowed their [A] to reach the [B].","ko":"고대 그리스와 로마에서, 사람들은 열쇠들이 그들의 [A]가 [B]에게 도달하게 한다고 생각했다.","bank":["prayers","gods","doors","cars","tools","nightmares"],"bko":{"prayers":"기도들","gods":"신들","doors":"문들","cars":"자동차들","tools":"도구들","nightmares":"악몽들"},"r":{"a":"[A] prayers, [B] gods","ev":"3번 문장","s":[[3,"In ancient Greece and Rome, people thought that keys allowed their prayers to reach the gods.","고대 그리스와 로마에서, 사람들은 열쇠들이 그들의 기도가 신에게 도달하게 한다고 생각했다."]],"w":"3번에서 고대 그리스·로마 사람들은 열쇠가 자신들의 기도(prayers)가 신들(gods)에게 도달하게 한다고 생각했어요. doors·cars·tools는 신에게 닿는 대상이 아니고, nightmares는 10번의 다른 이야기예요.","c":null},"h":"248daafb6b"}]},{"u":8,"id":"rj3-08-4","no":4,"ko":"물 맞으면 복이 와요","items":[{"n":1,"t":"tf","q":"People wash statues of the Buddha during Songkran.","ko":"사람들은 송끄란 동안 불상을 닦는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"People clean their homes and wash statues of the Buddha.","사람들은 그들의 집을 청소하고 불상을 닦는다."]],"w":"6번 문장에서 사람들은 그들의 집을 청소하고 불상(statues of the Buddha)을 닦는다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"8787d58214"},{"n":2,"t":"tf","q":"Only Thai people come to watch and join the action.","ko":"오직 태국 사람들만 그 행동을 구경하고 참여하러 온다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"People from all around the world head to Thailand to watch and participate in the action.","전 세계의 사람들이 그 행동을 구경하고 참여하기 위해 태국으로 향한다."]],"w":"9번에서 전 세계(all around the world)의 사람들이 구경하고 참여하러 태국으로 향한다고 해요. 태국 사람들만이라는 말은 달라요.","c":"F"},"h":"7f727e0a89"},{"n":3,"t":"tf","q":"People pour water on the hands of children as a sign of respect.","ko":"사람들은 존경의 표시로 아이들의 손에 물을 붓는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"They also pour water on the hands of the elderly as a sign of respect.","그들은 또한 존경의 표시로서 어르신들의 손에 물을 붓는다."]],"w":"7번에서 존경의 표시로 물을 붓는 대상은 어르신들(the elderly)이에요. 아이들이 아니에요.","c":"F"},"h":"1636bb0b66"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Over time, this has evolved into a giant water fight where people splash strangers with water.)","ko":"시간이 지나면서, 이것은 사람들이 낯선 사람들에게 물을 ( ) 거대한 물싸움으로 발전했다.","opts":["닦는","끼얹는","마시는","얼리는"],"word":"splash","r":{"a":"2) 끼얹는","ev":"8번 문장","s":[[8,"Over time, this has evolved into a giant water fight where people splash strangers with water.","시간이 지나면서, 이것은 사람들이 낯선 사람들에게 물을 끼얹는 거대한 물싸움으로 발전했다."]],"w":"물싸움이 되었다고 했으니 물을 던지듯 끼얹는 동작이에요. 그래서 splash는 '(물을) 끼얹다'예요.","c":2},"h":"5feff62ac4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People from all around the world head to Thailand to watch and participate in the action.)","ko":"전 세계의 사람들이 그 행동을 구경하고 참여하기 위해 태국으로 ( ).","opts":["숨는다","돌아온다","도망친다","향한다"],"word":"head","r":{"a":"4) 향한다","ev":"9번 문장","s":[[9,"People from all around the world head to Thailand to watch and participate in the action.","전 세계의 사람들이 그 행동을 구경하고 참여하기 위해 태국으로 향한다."]],"w":"구경하고 참여하기 위해 태국으로 간다는 뜻이에요. 여기서 head는 '머리'가 아니라 '향하다'예요.","c":4},"h":"7d755f795a"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is supposed to chase away bad things.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 나쁜 것들을 쫓아내는 것으로 여겨진다.","opts":["송끄란 동안 물을 퍼붓거나 끼얹는 것","태국의 달력","새해","불상"],"r":{"a":"1) 송끄란 동안 물을 퍼붓거나 끼얹는 것","ev":"10~11번 문장","s":[[10,"Throwing and splashing water during Songkran is a kind of blessing.","송끄란 동안 물을 퍼붓거나 끼얹는 것은 일종의 축복이다."],[11,"It is supposed to chase away bad things.","그것은 나쁜 것들을 쫓아내는 것으로 여겨진다."]],"w":"10번에서 송끄란 동안 물을 퍼붓거나 끼얹는 것이 일종의 축복이라고 했고, 11번의 It은 그 행동을 받아요. 나쁜 것을 쫓아내는 것은 달력이나 불상이 아니라 물을 끼얹는 행동이에요.","c":1},"h":"600d43b274"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It also allows good things to come during the new year!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 또한 새해 동안 좋은 것들이 오게 한다!","opts":["그것은 또한 새해 동안 나쁜 것들이 오게 한다.","그것은 또한 새해가 끝난 뒤에만 좋은 것들이 오게 한다.","그것은 또한 새해 동안 좋은 것들이 오게 한다.","그것은 또한 새해 동안 좋은 것들이 오는 것을 막는다."],"r":{"a":"3) 그것은 또한 새해 동안 좋은 것들이 오게 한다.","ev":"12번 문장","s":[[12,"It also allows good things to come during the new year!","그것은 또한 새해 동안 좋은 것들이 오게 한다!"]],"w":"allow A to come은 'A가 오게 해 주다'예요. good things가 새해 동안 온다는 뜻이고, 바로 앞 11번의 나쁜 것을 쫓아낸다는 말과 짝을 이뤄요.","c":3},"h":"96e30be897"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["송끄란은 낯선 사람들과 싸우기만 하는 축제이다.","송끄란은 음식을 많이 먹는 축제이다.","송끄란은 물 없이 즐기는 축제이다.","송끄란은 깨끗이 하고 새로 시작하는 것에 관한 축제이다."],"opts":["Songkran is a festival only for fighting with strangers.","Songkran is a festival about eating a lot of food.","Songkran is a festival enjoyed without any water.","Songkran is a festival about cleaning and making a new start."],"r":{"a":"4) Songkran is a festival about cleaning and making a new start.","ev":"5번 문장","s":[[5,"The festival is about cleaning and making a new start.","그 축제는 깨끗이 하고 새로운 시작을 하는 것에 관한 것이다."]],"w":"5번에서 송끄란은 깨끗이 하고 새로운 시작을 하는 것에 관한 축제라고 해요. 싸우기만 하는 축제도 아니고(6~7번), 음식 이야기는 없으며, 물이 중심이에요(2번).","c":4},"h":"0de2823d42"},{"n":9,"t":"sum","q":"Songkran is Thailand’s traditional (A) celebration, and it takes place in (B), when the new year starts based on the Thai calendar.","ko":"송끄란은 태국의 전통적인 (A) 축하 행사이고, 태국 달력에 근거해 새해가 시작되는 (B)에 열린다.","oko":["(A) 생일 / (B) 4월","(A) 새해 / (B) 12월","(A) 추수 / (B) 4월","(A) 생일 / (B) 12월","(A) 새해 / (B) 4월"],"opts":["(A) birthday / (B) April","(A) New Year’s / (B) December","(A) harvest / (B) April","(A) birthday / (B) December","(A) New Year’s / (B) April"],"r":{"a":"5) (A) New Year’s / (B) April","ev":"3~4번 문장","s":[[3,"It is Songkran, Thailand’s traditional New Year’s celebration.","그것은 태국의 전통적인 새해 축하 행사인 송끄란이다."],[4,"This exciting festival takes place in April, when the new year starts based on the Thai calendar.","이 신나는 축제는 4월에 개최되는데, 그때 태국 달력에 근거하여 새해가 시작된다."]],"w":"3번에서 송끄란은 태국의 전통적인 새해(New Year's) 축하 행사이고, 4번에서 태국 달력에 따라 새해가 시작되는 4월(April)에 열린다고 해요.","c":5},"h":"166c4d9ef1"},{"n":10,"t":"fill","q":"Throwing water during Songkran is supposed to chase away [A] things and allow [B] things to come during the new year.","ko":"송끄란 동안 물을 끼얹는 것은 [A] 것들을 쫓아내고 새해 동안 [B] 것들이 오게 한다고 여겨진다.","bank":["bad","good","buckets","statues","strangers","respect"],"bko":{"bad":"나쁜","good":"좋은","buckets":"양동이들","statues":"조각상들","strangers":"낯선 사람들","respect":"존경"},"r":{"a":"[A] bad, [B] good","ev":"11~12번 문장","s":[[11,"It is supposed to chase away bad things.","그것은 나쁜 것들을 쫓아내는 것으로 여겨진다."],[12,"It also allows good things to come during the new year!","그것은 또한 새해 동안 좋은 것들이 오게 한다!"]],"w":"11번에서 물을 끼얹는 것은 나쁜 것들(bad things)을 쫓아내고, 12번에서 새해 동안 좋은 것들(good things)이 오게 한다고 해요. 두 빈칸이 바뀌면 뜻이 반대가 되고, buckets·statues·strangers·respect는 things 앞에서 꾸며 주는 말이 아니에요.","c":null},"h":"cc554b87c1"}]},{"u":9,"id":"rj3-09-1","no":1,"ko":"기저귀의 대변신!","items":[{"n":1,"t":"tf","q":"Scientists added used diapers to concrete to replace some of the sand.","ko":"과학자들은 모래 일부를 대체하기 위해 콘크리트에 사용한 기저귀를 넣었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They added used diapers to replace some of the sand in concrete.","그들은 콘크리트의 모래 일부를 대체하기 위해 사용한 기저귀를 넣었다."]],"w":"6번 문장에 They added used diapers to replace some of the sand in concrete가 그대로 나와요. 모래 일부를 사용한 기저귀로 바꿔 넣었다는 내용과 일치해요.","c":"T"},"h":"6cb202dfab"},{"n":2,"t":"tf","q":"Used diapers were put into concrete without being cleaned.","ko":"사용한 기저귀는 세탁되지 않은 채로 콘크리트에 넣어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Used diapers were collected, cleaned, and cut into small pieces.","사용한 기저귀를 모으고, 세탁하고, 작은 조각들로 잘랐다."]],"w":"7번 문장에서 사용한 기저귀는 모으고(collected), 세탁하고(cleaned), 작은 조각으로 잘랐다(cut)고 해요. 세탁하지 않았다는 말은 본문과 달라요.","c":"F"},"h":"d889fb9043"},{"n":3,"t":"tf","q":"Researchers are also trying to find out how well the new concrete can block out heat and sound.","ko":"연구원들은 또한 새 콘크리트가 열과 소리를 얼마나 잘 차단하는지 알아내려고 노력하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Researchers are also trying to find out how well the new concrete can block out heat and sound.","연구원들은 또한 그 새로운 콘크리트가 얼마나 열과 소리를 잘 차단할 수 있는지 알아내기 위해 노력하고 있다."]],"w":"12번 문장에 그대로 나와요. 연구원들은 새 콘크리트의 열·소리 차단 능력을 알아내려고 노력 중이에요.","c":"T"},"h":"4190a609ba"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, there is a limited amount of sand on earth.)","ko":"하지만, 지구에는 ( ) 양의 모래가 있다.","opts":["무한한","제한된","깨끗한","흔한"],"word":"limited","r":{"a":"2) 제한된","ev":"3번 문장","s":[[3,"However, there is a limited amount of sand on earth.","하지만, 지구에는 제한된 양의 모래가 있다."]],"w":"3번에서 However(하지만)로 문제가 시작돼요. 지구의 모래가 한정되어 있다는 뜻이라 limited는 '제한된, 한정된'이에요. 4번의 채굴 문제와 이어져요.","c":2},"h":"e7d0cbc2d8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists had a creative solution to this problem.)","ko":"과학자들은 이 문제에 대한 ( ) 해결책을 가지고 있었다.","opts":["위험한","평범한","느린","창의적인"],"word":"creative","r":{"a":"4) 창의적인","ev":"5번 문장","s":[[5,"Scientists had a creative solution to this problem.","과학자들은 이 문제에 대한 창의적인 해결책을 가지고 있었다."]],"w":"5번은 기저귀를 콘크리트에 넣는다는 새로운 아이디어를 소개하는 문장이에요. 그래서 creative는 '창의적인'이에요. '평범한'은 오히려 반대 뜻이에요.","c":4},"h":"6dba0ac61b"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAfter all, there are too many used diapers, and they are basically free.","ko":"밑줄 친 they가 가리키는 것은?","sko":"무엇보다 사용한 기저귀들은 너무 많고, 그것들은 기본적으로 공짜이다.","opts":["과학자들","새 콘크리트","사용한 기저귀들","지구의 모래"],"r":{"a":"3) 사용한 기저귀들","ev":"11번 문장","s":[[11,"After all, there are too many used diapers, and they are basically free.","무엇보다 사용한 기저귀들은 너무 많고, 그것들은 기본적으로 공짜이다."]],"w":"11번 문장은 사용한 기저귀가 너무 많고 '그것들이' 기본적으로 공짜라는 내용이에요. 같은 문장 앞쪽의 복수 명사 used diapers를 가리켜요. concrete는 단수라서 they가 될 수 없어요.","c":3},"h":"f52fd5cc22"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Researchers are also trying to find out how well the new concrete can block out heat and sound.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"연구원들은 또한 그 새로운 콘크리트가 얼마나 열과 소리를 잘 차단할 수 있는지 알아내기 위해 노력하고 있다.","opts":["연구원들은 새 콘크리트가 열과 소리를 얼마나 잘 차단하는지 알아내려고 노력하고 있다.","연구원들은 새 콘크리트가 열과 소리 때문에 망가지는지 알아냈다.","연구원들은 열과 소리를 내는 기계를 만들려고 노력하고 있다.","연구원들은 새 콘크리트가 열과 소리를 얼마나 많이 내는지 조사하고 있다."],"r":{"a":"1) 연구원들은 새 콘크리트가 열과 소리를 얼마나 잘 차단하는지 알아내려고 노력하고 있다.","ev":"12번 문장","s":[[12,"Researchers are also trying to find out how well the new concrete can block out heat and sound.","연구원들은 또한 그 새로운 콘크리트가 얼마나 열과 소리를 잘 차단할 수 있는지 알아내기 위해 노력하고 있다."]],"w":"block out은 '차단하다'예요. 12번은 새 콘크리트가 열과 소리를 막는 정도를 알아보는 중이라는 뜻이에요. 나머지는 '열과 소리를 내는' 것이 되어 반대예요.","c":1},"h":"4a5ce40ffc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["연구원들은 기저귀 콘크리트가 기존 콘크리트보다 더 약하다는 것을 발견했다.","과학자들은 콘크리트의 모래를 전부 기저귀로 바꿨다.","연구원들은 모래와 기저귀 조각을 다르게 섞어 실험했다.","모래를 채굴하는 것은 동물들이 서식지를 지키도록 돕는다."],"opts":["Researchers found that diaper concrete was weaker than traditional concrete.","Scientists replaced all of the sand in concrete with diapers.","Researchers tested different mixes of sand and diaper pieces.","Mining sand helps animals keep their habitat."],"r":{"a":"3) Researchers tested different mixes of sand and diaper pieces.","ev":"4, 6, 8~9번 문장","s":[[4,"Also, mining sand is bad for the environment and can lead to the loss of animals’ habitat.","또한, 모래를 채굴하는 것은 환경에 해롭고 동물들의 서식지 손실로 이어질 수 있다."],[6,"They added used diapers to replace some of the sand in concrete.","그들은 콘크리트의 모래 일부를 대체하기 위해 사용한 기저귀를 넣었다."],[8,"The researchers tested different mixes of sand and diaper pieces.","연구원들은 모래와 기저귀 조각들의 다른 혼합물들을 실험했다."],[9,"They discovered that the safety and strength of the new concrete were as good as traditional concrete.","그들은 새로운 콘크리트의 안전성과 강도가 기존의 콘크리트만큼 좋다는 것을 발견했다."]],"w":"8번에서 연구원들은 모래와 기저귀 조각의 여러 가지 혼합물을 실험했어요. 기저귀 콘크리트는 기존 콘크리트만큼 좋았고(9번), 모래는 '일부'만 바꿨고(6번), 모래 채굴은 서식지를 잃게 할 수 있어요(4번).","c":3},"h":"4057cc05f9"},{"n":9,"t":"sum","q":"Sand for concrete is (A) on earth, so scientists mixed used diapers into concrete. The new concrete was as (B) as traditional concrete.","ko":"콘크리트에 쓰는 모래는 지구에 (A)해서 과학자들은 콘크리트에 사용한 기저귀를 섞었다. 새 콘크리트는 기존 콘크리트만큼 (B)했다.","oko":["(A) 끝이 없다 / (B) 튼튼","(A) 한정되어 있다 / (B) 약","(A) 한정되어 있다 / (B) 튼튼","(A) 싸다 / (B) 약","(A) 끝이 없다 / (B) 약"],"opts":["(A) endless / (B) strong","(A) limited / (B) weak","(A) limited / (B) strong","(A) cheap / (B) weak","(A) endless / (B) weak"],"r":{"a":"3) (A) limited / (B) strong","ev":"3, 6, 9번 문장","s":[[3,"However, there is a limited amount of sand on earth.","하지만, 지구에는 제한된 양의 모래가 있다."],[6,"They added used diapers to replace some of the sand in concrete.","그들은 콘크리트의 모래 일부를 대체하기 위해 사용한 기저귀를 넣었다."],[9,"They discovered that the safety and strength of the new concrete were as good as traditional concrete.","그들은 새로운 콘크리트의 안전성과 강도가 기존의 콘크리트만큼 좋다는 것을 발견했다."]],"w":"3번에서 지구의 모래는 limited(한정된)라고 하고, 그래서 6번에서 모래 일부를 기저귀로 바꿨어요. 9번에서 새 콘크리트의 강도(strength)가 기존만큼 좋았다고 하므로 (B)는 strong이에요.","c":3},"h":"eed1aeb965"},{"n":10,"t":"fill","q":"There are too [A] used diapers, and they are basically [B]. So using them in concrete could make it cheaper to build houses.","ko":"너무 [A] 사용한 기저귀가 있고, 그것들은 기본적으로 [B]이다. 그래서 콘크리트에 그것들을 쓰면 집을 짓는 것이 더 저렴해질 수 있다.","bank":["many","free","limited","expensive","strong","creative"],"bko":{"many":"많은","free":"공짜인","limited":"한정된","expensive":"비싼","strong":"튼튼한","creative":"창의적인"},"r":{"a":"[A] many, [B] free","ev":"10~11번 문장","s":[[10,"Adding diapers and reducing sand in concrete could make it cheaper to build houses.","기저귀를 넣어 콘크리트의 모래를 줄이는 것은 집을 짓는 것을 더 저렴하게 만들 수 있다."],[11,"After all, there are too many used diapers, and they are basically free.","무엇보다 사용한 기저귀들은 너무 많고, 그것들은 기본적으로 공짜이다."]],"w":"11번에 there are too many used diapers, and they are basically free가 있어요. 그래서 10번에서 집 짓기가 더 저렴해질 수 있다고 해요. limited(한정된)와 expensive(비싼)는 '너무 많고 공짜'라는 내용과 반대예요.","c":null},"h":"ad5b4a5f79"}]},{"u":9,"id":"rj3-09-2","no":2,"ko":"지구를 살릴 조그만 영웅","items":[{"n":1,"t":"tf","q":"A beekeeper found that waxworms had eaten holes in a plastic bag.","ko":"양봉가는 벌집 나방 애벌레가 비닐봉지를 갉아 먹어 구멍을 낸 것을 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"After putting them in a plastic bag, she found that they had eaten holes in the bag!","그것들을 비닐봉지에 넣은 뒤에, 그녀는 그것들이 봉지를 갉아 먹어 구멍을 낸 것을 발견했다!"]],"w":"6번 문장에서 양봉가가 애벌레를 비닐봉지에 넣은 뒤, 애벌레들이 봉지를 갉아 구멍을 낸 것(had eaten holes)을 발견했어요.","c":"T"},"h":"6bb7a86c36"},{"n":2,"t":"tf","q":"Waxworms usually eat plastic in beehives.","ko":"벌집 나방 애벌레는 보통 벌집에서 플라스틱을 먹는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Waxworms usually eat the wax in beehives.","벌집 나방 애벌레는 보통 벌집의 밀랍을 먹는다."]],"w":"5번 문장에서 애벌레가 보통 먹는 것은 벌집의 밀랍(wax)이에요. 플라스틱을 먹는다는 말은 본문과 달라요.","c":"F"},"h":"309e1f7e54"},{"n":3,"t":"tf","q":"Scientists have already made sprays that work like waxworm saliva.","ko":"과학자들은 이미 벌집 나방 애벌레의 타액처럼 작용하는 스프레이를 만들었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Scientists hope to create sprays that work like waxworm saliva.","과학자들은 벌집 나방 애벌레의 타액처럼 작용하는 스프레이를 만들길 희망한다."]],"w":"11번 문장에서 과학자들은 그런 스프레이를 만들기를 '희망한다'(hope to create)고 해요. 이미 만들었다는 말은 틀려요.","c":"F"},"h":"e0ca670f83"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A solution to these problems, however, may have been discovered by accident.)","ko":"하지만, 이런 문제들에 대한 한 해결책이 ( ) 발견되었을지도 모른다.","opts":["계획","우연","노력","허락"],"word":"accident","r":{"a":"2) 우연","ev":"3번 문장","s":[[3,"A solution to these problems, however, may have been discovered by accident.","하지만, 이런 문제들에 대한 한 해결책이 우연히 발견되었을지도 모른다."]],"w":"3번은 해결책이 계획해서 찾은 것이 아니라 뜻밖에 발견되었을지도 모른다는 말이에요. 그래서 by accident는 '우연히'예요. 4~6번에서 양봉가가 우연히 이 사실을 알게 돼요.","c":2},"h":"eeabfdde94"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To find out more, scientists conducted an experiment.)","ko":"더 알아내기 위해서, 과학자들은 실험을 ( ).","opts":["취소했다","구경했다","실시했다","상상했다"],"word":"conducted","r":{"a":"3) 실시했다","ev":"7번 문장","s":[[7,"To find out more, scientists conducted an experiment.","더 알아내기 위해서, 과학자들은 실험을 했다."]],"w":"7번에서 과학자들은 더 알아내려고 실험을 했어요. 8번에서 실험 내용(애벌레 100마리를 비닐봉지에 넣음)이 이어지므로 conduct는 '(실험을) 하다, 실시하다'예요.","c":3},"h":"faeaab2834"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAfter putting them in a plastic bag, she found that they had eaten holes in the bag!","ko":"밑줄 친 they가 가리키는 것은?","sko":"그것들을 비닐봉지에 넣은 뒤에, 그녀는 그것들이 봉지를 갉아 먹어 구멍을 낸 것을 발견했다!","opts":["양봉가","벌집의 벌들","비닐봉지","벌집 나방 애벌레들"],"r":{"a":"4) 벌집 나방 애벌레들","ev":"4~6번 문장","s":[[4,"One day, a beekeeper who is also a scientist removed some waxworms from her beehives.","어느 날, 과학자이기도 한 한 양봉가가 그녀의 벌집에서 몇 마리의 벌집 나방 애벌레를 제거했다."],[5,"Waxworms usually eat the wax in beehives.","벌집 나방 애벌레는 보통 벌집의 밀랍을 먹는다."],[6,"After putting them in a plastic bag, she found that they had eaten holes in the bag!","그것들을 비닐봉지에 넣은 뒤에, 그녀는 그것들이 봉지를 갉아 먹어 구멍을 낸 것을 발견했다!"]],"w":"6번에서 양봉가가 애벌레들을 비닐봉지에 넣었고(them), 그 애벌레들이 봉지를 갉아 구멍을 낸 거예요. 4~5번의 waxworms를 가리켜요. she(양봉가)는 단수라서 they가 될 수 없어요.","c":4},"h":"4202db2961"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The waxworms ate 92 milligrams of plastic in 12 hours, which is more than 1,000 times faster than any other creature.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 벌집 나방 애벌레들은 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 이상 더 빠르다.","opts":["벌집 나방 애벌레 1,000마리가 12시간 동안 플라스틱 92밀리그램을 먹었다.","벌집 나방 애벌레는 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 넘게 느리다.","벌집 나방 애벌레는 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 넘게 빠르다.","벌집 나방 애벌레는 92시간 동안 12밀리그램의 플라스틱을 먹었다."],"r":{"a":"3) 벌집 나방 애벌레는 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 넘게 빠르다.","ev":"8~9번 문장","s":[[8,"They put 100 waxworms in a plastic bag.","그들은 비닐봉지 하나에 벌집 나방 애벌레 100마리를 넣었다."],[9,"The waxworms ate 92 milligrams of plastic in 12 hours, which is more than 1,000 times faster than any other creature.","그 벌집 나방 애벌레들은 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 이상 더 빠르다."]],"w":"which 앞은 12시간 동안 92밀리그램의 플라스틱을 먹었다는 내용이고, which 뒤는 다른 생물보다 1,000배 넘게 '빠르다'예요. 8번에서 애벌레는 100마리를 썼고, 숫자 12와 92의 자리도 바뀌면 안 돼요.","c":3},"h":"2f40d1bb40"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 양봉가는 과학자가 아니었다.","벌집 나방 애벌레는 유리병에 구멍을 냈다.","과학자들은 실험을 위해 벌집 나방 애벌레 100마리를 비닐봉지에 넣었다.","벌집 나방 애벌레는 다른 생물처럼 플라스틱을 천천히 먹었다."],"opts":["The beekeeper was not a scientist.","Waxworms ate holes in a glass jar.","Scientists put 100 waxworms in a plastic bag for an experiment.","Waxworms ate plastic slowly, like other creatures."],"r":{"a":"3) Scientists put 100 waxworms in a plastic bag for an experiment.","ev":"4, 6, 7~9번 문장","s":[[4,"One day, a beekeeper who is also a scientist removed some waxworms from her beehives.","어느 날, 과학자이기도 한 한 양봉가가 그녀의 벌집에서 몇 마리의 벌집 나방 애벌레를 제거했다."],[6,"After putting them in a plastic bag, she found that they had eaten holes in the bag!","그것들을 비닐봉지에 넣은 뒤에, 그녀는 그것들이 봉지를 갉아 먹어 구멍을 낸 것을 발견했다!"],[7,"To find out more, scientists conducted an experiment.","더 알아내기 위해서, 과학자들은 실험을 했다."],[8,"They put 100 waxworms in a plastic bag.","그들은 비닐봉지 하나에 벌집 나방 애벌레 100마리를 넣었다."],[9,"The waxworms ate 92 milligrams of plastic in 12 hours, which is more than 1,000 times faster than any other creature.","그 벌집 나방 애벌레들은 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 이상 더 빠르다."]],"w":"7번에서 과학자들이 더 알아내려고 실험을 했고, 8번에서 그 실험을 위해 애벌레 100마리를 비닐봉지에 넣었어요. 양봉가는 과학자이기도 했고(4번), 구멍이 난 것은 비닐봉지이고(6번), 애벌레는 다른 생물보다 훨씬 빨랐어요(9번).","c":3},"h":"ee6a01baa3"},{"n":9,"t":"sum","q":"Plastic waste takes a (A) time to break down, but waxworms can eat plastic much (B) than other creatures.","ko":"플라스틱 쓰레기는 분해되는 데 (A) 시간이 걸리지만, 벌집 나방 애벌레는 다른 생물보다 플라스틱을 훨씬 (B) 먹을 수 있다.","oko":["(A) 짧은 / (B) 더 느리게","(A) 짧은 / (B) 더 빠르게","(A) 긴 / (B) 더 느리게","(A) 빠른 / (B) 더 빠르게","(A) 긴 / (B) 더 빠르게"],"opts":["(A) short / (B) slower","(A) short / (B) faster","(A) long / (B) slower","(A) quick / (B) faster","(A) long / (B) faster"],"r":{"a":"5) (A) long / (B) faster","ev":"2, 9번 문장","s":[[2,"Moreover, this plastic waste stays in landfills, for too long before breaking down.","게다가, 이 플라스틱 쓰레기는 분해되기 전에 너무 오래 쓰레기 매립지에 남는다."],[9,"The waxworms ate 92 milligrams of plastic in 12 hours, which is more than 1,000 times faster than any other creature.","그 벌집 나방 애벌레들은 12시간 동안 92밀리그램의 플라스틱을 먹었고, 이는 다른 어떤 생물보다 1,000배 이상 더 빠르다."]],"w":"2번에서 플라스틱 쓰레기는 분해되기 전에 너무 오래(too long) 매립지에 남는다고 해요. 9번에서 애벌레는 다른 생물보다 1,000배 넘게 빠르게 플라스틱을 먹어요. 그래서 (A)는 long, (B)는 faster예요.","c":5},"h":"376bd26328"},{"n":10,"t":"fill","q":"The waxworms’ [A] causes plastic to break down quickly, so scientists hope to create [B] that work like it.","ko":"벌집 나방 애벌레의 [A]은 플라스틱이 빠르게 분해되게 해서, 과학자들은 그것처럼 작용하는 [B]를 만들길 희망한다.","bank":["saliva","sprays","wax","holes","bags","experiment"],"bko":{"saliva":"타액","sprays":"스프레이","wax":"밀랍","holes":"구멍","bags":"봉지","experiment":"실험"},"r":{"a":"[A] saliva, [B] sprays","ev":"10~11번 문장","s":[[10,"The waxworms’ secret is their saliva —it causes plastic to quickly break down.","벌집 나방 애벌레의 비결은 타액인데 그것은 플라스틱이 빠르게 분해되게 한다."],[11,"Scientists hope to create sprays that work like waxworm saliva.","과학자들은 벌집 나방 애벌레의 타액처럼 작용하는 스프레이를 만들길 희망한다."]],"w":"10번에서 애벌레의 비결은 타액(saliva)이고, 그것이 플라스틱이 빠르게 분해되게 해요. 11번에서 과학자들은 그 타액처럼 작용하는 스프레이(sprays)를 만들길 희망해요. wax는 애벌레가 보통 먹는 것(5번)이라 [A]에 맞지 않아요.","c":null},"h":"e250d3b917"}]},{"u":9,"id":"rj3-09-3","no":3,"ko":"결국, 되돌아온다","items":[{"n":1,"t":"tf","q":"The Soviet government changed the direction of two rivers to send water to cotton fields.","ko":"소련 정부는 목화밭에 물을 보내기 위해 두 강의 방향을 바꾸었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"They changed the direction of two rivers flowing into the Aral Sea, a salt lake.","그들은 소금 호수인 아랄 해로 흐르는 두 강의 방향을 바꾸었다."],[3,"They did this in order to make water flow into nearby cotton fields.","그들은 물이 근처의 목화밭으로 흘러가도록 하기 위해 이렇게 했다."]],"w":"2번에서 두 강의 방향을 바꾸었고, 3번에서 물이 근처 목화밭으로 흘러가게 하려고 했다고 해요.","c":"T"},"h":"11e1a5be5b"},{"n":2,"t":"tf","q":"The Aral Sea is now bigger than its original size.","ko":"아랄 해는 지금 원래 크기보다 더 크다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The sea has shrunk to 10% of its original size in the past 60 years, and the region has been destroyed.","그 바다는 과거 60년 동안 원래 크기의 10%로 줄어들었고, 그 지역은 파괴되었다."]],"w":"6번 문장에서 바다는 원래 크기의 10%로 줄어들었다(has shrunk to 10%)고 해요. 더 커졌다는 말은 반대예요.","c":"F"},"h":"e114b0ab00"},{"n":3,"t":"tf","q":"The wind carried salty sand across the land.","ko":"바람이 소금기 있는 모래를 육지 전역으로 옮겼다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"It was picked up by the wind and carried across the land.","그것은 바람에 의해 집어 올려져 육지 전역으로 옮겨졌다."]],"w":"8번 문장에서 소금기 있는 모래가 바람에 의해 집어 올려져 육지 전역으로 옮겨졌다(carried across the land)고 해요.","c":"T"},"h":"3441997432"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the 1960s, the Soviet government made a terrible decision.)","ko":"1960년대에, 소련 정부는 끔찍한 ( )을 내렸다.","opts":["결정","경고","발표","실수"],"word":"decision","r":{"a":"1) 결정","ev":"1번 문장","s":[[1,"In the 1960s, the Soviet government made a terrible decision.","1960년대에, 소련 정부는 끔찍한 결정을 내렸다."]],"w":"1번 문장의 made a terrible decision은 '끔찍한 결정을 내렸다'예요. 2번에서 그 결정이 강의 방향을 바꾼 것이라고 알려 줘요.","c":1},"h":"9c7de6ea24"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This ruined farmers’ fields and made people sick.)","ko":"이는 농부들의 밭을 ( ) 사람들을 병들게 만들었다.","opts":["가꾸었고","넓혔고","망쳤고","팔았고"],"word":"ruined","r":{"a":"3) 망쳤고","ev":"9번 문장","s":[[9,"This ruined farmers’ fields and made people sick.","이는 농부들의 밭을 망쳤고 사람들을 병들게 만들었다."]],"w":"9번에서 소금기 있는 모래가 퍼져 농부들의 밭이 못 쓰게 되고 사람들이 병들었어요. 병들게 한 것과 이어지는 말이라 ruined는 '망쳤다'예요.","c":3},"h":"c03ee685b3"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nThey did this in order to make water flow into nearby cotton fields.","ko":"밑줄 친 this가 가리키는 것은?","sko":"그들은 물이 근처의 목화밭으로 흘러가도록 하기 위해 이렇게 했다.","opts":["목화를 새로 심은 것","소금 호수를 새로 만든 것","아랄 해가 마르기 시작한 것","두 강의 방향을 바꾼 것"],"r":{"a":"4) 두 강의 방향을 바꾼 것","ev":"2~3번 문장","s":[[2,"They changed the direction of two rivers flowing into the Aral Sea, a salt lake.","그들은 소금 호수인 아랄 해로 흐르는 두 강의 방향을 바꾸었다."],[3,"They did this in order to make water flow into nearby cotton fields.","그들은 물이 근처의 목화밭으로 흘러가도록 하기 위해 이렇게 했다."]],"w":"3번의 did this는 앞 2번에서 소련 정부가 한 일을 가리켜요. 두 강의 방향을 바꾸었고, 그 목적이 물을 목화밭으로 흐르게 하는 것(in order to ~)이에요. 아랄 해가 마르기 시작한 것은 그 뒤의 결과예요(5번).","c":4},"h":"eee764d546"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It reminds us that we should never destroy nature for human gain.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 우리에게 우리가 인간의 이득을 위해 자연을 파괴하면 절대 안 된다는 것을 상기시킨다.","opts":["그것은 우리에게 인간의 이득을 위해 자연을 절대 파괴해서는 안 된다는 것을 상기시킨다.","그것은 우리에게 인간의 이득을 위해서라면 자연을 바꿔도 된다는 것을 보여 준다.","그것은 우리에게 자연이 회복되는 데 60년이 걸린다는 것을 알려 준다.","그것은 우리에게 더 많은 강을 만들어야 한다는 것을 상기시킨다."],"r":{"a":"1) 그것은 우리에게 인간의 이득을 위해 자연을 절대 파괴해서는 안 된다는 것을 상기시킨다.","ev":"10~11번 문장","s":[[10,"Today, the destruction of the Aral Sea is considered one of the most tragic environmental disasters in human history.","오늘날, 아랄 해의 파괴는 인류 역사에서 가장 비극적인 환경 재해들 중 하나로 여겨진다."],[11,"It reminds us that we should never destroy nature for human gain.","그것은 우리에게 우리가 인간의 이득을 위해 자연을 파괴하면 절대 안 된다는 것을 상기시킨다."]],"w":"11번의 should never destroy nature는 '자연을 절대 파괴하면 안 된다'는 뜻이에요. 인간의 이득(human gain)을 위해서라도 안 된다는 교훈이고, 60년은 바다가 줄어든 기간이에요(6번).","c":1},"h":"38eb1c4f95"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아랄 해는 원래 크기로 회복되었다.","바람 때문에 농부들의 밭이 더 좋아졌다.","소련 정부는 바다를 돕기 위해 강을 바꾸었다.","아랄 해의 파괴는 최악의 환경 재해 중 하나로 여겨진다."],"opts":["The Aral Sea has recovered to its original size.","Farmers’ fields became better because of the wind.","The Soviet government changed the rivers to help the sea.","The destruction of the Aral Sea is considered one of the worst environmental disasters."],"r":{"a":"4) The destruction of the Aral Sea is considered one of the worst environmental disasters.","ev":"2~3, 6, 9~10번 문장","s":[[2,"They changed the direction of two rivers flowing into the Aral Sea, a salt lake.","그들은 소금 호수인 아랄 해로 흐르는 두 강의 방향을 바꾸었다."],[3,"They did this in order to make water flow into nearby cotton fields.","그들은 물이 근처의 목화밭으로 흘러가도록 하기 위해 이렇게 했다."],[6,"The sea has shrunk to 10% of its original size in the past 60 years, and the region has been destroyed.","그 바다는 과거 60년 동안 원래 크기의 10%로 줄어들었고, 그 지역은 파괴되었다."],[9,"This ruined farmers’ fields and made people sick.","이는 농부들의 밭을 망쳤고 사람들을 병들게 만들었다."],[10,"Today, the destruction of the Aral Sea is considered one of the most tragic environmental disasters in human history.","오늘날, 아랄 해의 파괴는 인류 역사에서 가장 비극적인 환경 재해들 중 하나로 여겨진다."]],"w":"10번에서 아랄 해의 파괴는 가장 비극적인 환경 재해들 중 하나로 여겨진다고 해요. 바다는 10%로 줄었고(6번), 밭은 망가졌고(9번), 강은 목화밭에 물을 대려고 바꾸었어요(2~3번).","c":4},"h":"381f787207"},{"n":9,"t":"sum","q":"The Soviet government (A) the rivers flowing into the Aral Sea, and as a result the sea has (B).","ko":"소련 정부는 아랄 해로 흐르는 강을 (A)했고, 그 결과 바다는 (B)했다.","oko":["(A) 보호 / (B) 줄어들었다","(A) 바꿨다 / (B) 커졌다","(A) 보호 / (B) 커졌다","(A) 바꿨다 / (B) 줄어들었다","(A) 지었다 / (B) 가득 찼다"],"opts":["(A) protected / (B) shrunk","(A) changed / (B) grown","(A) protected / (B) grown","(A) changed / (B) shrunk","(A) built / (B) filled"],"r":{"a":"4) (A) changed / (B) shrunk","ev":"2, 5~6번 문장","s":[[2,"They changed the direction of two rivers flowing into the Aral Sea, a salt lake.","그들은 소금 호수인 아랄 해로 흐르는 두 강의 방향을 바꾸었다."],[5,"The Aral Sea began to dry up.","아랄 해는 마르기 시작했다."],[6,"The sea has shrunk to 10% of its original size in the past 60 years, and the region has been destroyed.","그 바다는 과거 60년 동안 원래 크기의 10%로 줄어들었고, 그 지역은 파괴되었다."]],"w":"2번에서 정부는 강의 방향을 바꾸었어요(changed). 5~6번에서 바다는 마르기 시작해 원래 크기의 10%로 줄어들었어요(shrunk). 보호했다거나 커졌다는 말은 본문과 반대예요.","c":4},"h":"b5632cf2db"},{"n":10,"t":"fill",
