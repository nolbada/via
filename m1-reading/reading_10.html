"],"memo":["정답 ③: 세 사람은 동아리 포스터를 보고 있다(영화 포스터 ✕).","근거: These are club posters.(이건 동아리 포스터야.)","함정: 일치하지 않는 것 찾기! ③ movie가 아니라 club poster"],"why":"포스터는 영화 포스터가 아니라 동아리 포스터이다."},{"n":4,"q":"위 대화의 내용으로 알 수 있는 것은?","o":["Kate는 만화 캐릭터를 그린다.","준호는 이미 농구 동아리에 가입했다.","민지는 준호에게 만화 동아리가 잘 맞을 것 같다고 말했다.","준호와 민지는 오늘 처음 만났다.","동아리 포스터는 Kate가 직접 만들었다."],"a":2,"ans":"민지는 준호에게 만화 동아리가 잘 맞을 것 같다고 말했다.","evs":[["Junho: I like cartoons. I draw cartoon characters.","나는 만화를 좋아해. 나는 만화 캐릭터를 그려."],["Minji: Oh, then this cartoon club is perfect for you!","오, 그럼 이 만화 동아리가 너에게 딱이야!"]],"ev":["Junho: I like cartoons. I draw cartoon characters.","나는 만화를 좋아해. 나는 만화 캐릭터를 그려."],"ow":["오답 ✕ — 'I draw cartoon characters.'(나는 만화 캐릭터를 그려.)라고 말한 사람은 Kate가 아니라 준호이다. 그래서 틀림.","오답 ✕ — 준호는 'Oh, do you like basketball?'(오, 너희는 농구를 좋아하니?)라고 물었을 뿐, 농구 동아리에 가입했다는 말은 없다. 지문에 그런 언급이 없어 틀림.","정답 ○ — 준호가 만화를 좋아하고 만화 캐릭터를 그린다고 하자 민지가 'This cartoon club is perfect for you!'(이 만화 동아리가 너에게 딱이야!)라고 했으므로 맞다.","오답 ✕ — 준호가 'Good morning, Minji!'(좋은 아침이야, 민지야!)라고 먼저 인사하는 것으로 보아 둘은 이미 아는 사이이다. 처음 만난 사이는 준호와 Kate이다.","오답 ✕ — Kate는 'These are club posters.'(이건 동아리 포스터야.)라고 했을 뿐, 포스터를 직접 만들었다는 언급은 없다. 그래서 틀림."],"memo":["정답 ③: 민지는 준호에게 만화 동아리가 잘 맞을 것 같다고 말했다.","근거: this cartoon club is perfect for you!(이 만화 동아리가 너에게 딱이야!)","함정: ④ 처음 만난 사이는 준호와 Kate이고 민지는 아니다 ✕"],"why":"민지가 만화를 좋아하는 준호에게 만화 동아리가 딱이라고 말한다."}],"dlg":[["Junho","Good morning, Minji!","좋은 아침이야, 민지야!"],["Minji","Hi, Junho! Oh, this is my friend Kate.","안녕, 준호야! 아, 이쪽은 내 친구 Kate야."],["Junho","Hello, Kate. My name is Junho. Nice to meet you.","안녕, Kate. 내 이름은 준호야. 만나서 반가워."],["Kate","Nice to meet you, too.","나도 만나서 반가워."],["Junho","What are these posters?","이 포스터들은 뭐야?"],["Kate","These are club posters. Minji and I like this basketball club!","이건 동아리 포스터야. 민지와 나는 이 농구 동아리가 좋아!"],["Junho","Oh, do you like basketball?","오, 너희는 농구를 좋아하니?"],["Minji","Yes, we do. Kate and I play basketball every weekend.","응, 좋아해. Kate와 나는 주말마다 농구를 해."],["Junho","Wow, that's cool.","와, 멋지다."],["Kate","What do you like, Junho?","너는 무엇을 좋아해, 준호야?"],["Junho","I like cartoons. I draw cartoon characters.","나는 만화를 좋아해. 나는 만화 캐릭터를 그려."],["Minji","Oh, then this cartoon club is perfect for you!","오, 그럼 이 만화 동아리가 너에게 딱이야!"]]},{"qs":[{"n":5,"q":"위 대화의 주제로 알맞은 것은?","o":["자기소개","주말 계획","오늘의 날씨","동아리 활동","좋아하는 운동"],"a":4,"ans":"좋아하는 운동","evs":[["G: What sports do you like?","너는 어떤 운동을 좋아하니?"],["B: I like baseball. Do you like baseball, too?","나는 야구를 좋아해. 너도 야구를 좋아하니?"]],"ev":["G: What sports do you like?","너는 어떤 운동을 좋아하니?"],"ow":["오답 ✕ — 대화에서 자기소개나 이름을 말하는 부분은 없다. 'What sports do you like?'(너는 어떤 운동을 좋아하니?)처럼 좋아하는 운동을 묻고 답하므로 틀림.","오답 ✕ — 주말에 무엇을 할지에 대한 언급이 없다. 'I like baseball.'(나는 야구를 좋아해.)처럼 좋아하는 운동 이야기이므로 틀림.","오답 ✕ — 날씨에 대한 이야기는 전혀 없고, 'What sports do you like?'(너는 어떤 운동을 좋아하니?)가 대화의 중심이라 틀림.","오답 ✕ — 'I'm on the school baseball team.'(나는 학교 야구팀이야.)이라는 말이 나오지만 이는 야구를 좋아한다는 설명일 뿐이다. 대화 전체의 주제는 좋아하는 운동이라서 틀림.","정답 ○ — 'What sports do you like?'(너는 어떤 운동을 좋아하니?)에 'I like baseball.'(나는 야구를 좋아해.)이라고 답하며 야구 이야기를 하므로 주제는 좋아하는 운동이다."],"memo":["정답 ⑤: 대화의 주제는 좋아하는 운동이다.","근거: What sports do you like?(너는 어떤 운동을 좋아하니?) — I like baseball.(나는 야구를 좋아해.)","함정: ④ 학교 야구팀 이야기는 세부 내용일 뿐이다 ✕"],"why":"좋아하는 운동(야구)을 묻고 답하는 대화이다."}],"dlg":[["G","What sports do you like?","너는 어떤 운동을 좋아하니?"],["B","I like baseball. Do you like baseball, too?","나는 야구를 좋아해. 너도 야구를 좋아하니?"],["G","Yes. I'm on the school baseball team.","응. 나는 학교 야구팀이야."],["B","Wow! That's really cool.","와! 정말 멋지다."]]}];var BG=[{"qs":[{"n":6,"q":"윗글 Colin의 말에서 알 수 있는 것은?","o":["Colin은 자신을 유리에 비유했다.","Colin은 대화 중에 자기 이야기만 많이 한다.","Colin의 친구 준호는 Colin에게 자주 고민을 털어놓는다.","준호는 Colin의 농담을 가장 좋아한다.","Colin은 친구들과 대화하는 것을 좋아하지 않는다."],"a":2,"ans":"Colin의 친구 준호는 Colin에게 자주 고민을 털어놓는다.","evs":[["My friend Junho always shares his worries with me.","제 친구 준호는 항상 그의 고민을 저에게 공유합니다."],["He likes my sweet and kind words.","그는 저의 상냥하고 친절한 말을 좋아합니다."]],"ev":["My friend Junho always shares his worries with me.","제 친구 준호는 항상 그의 고민을 저에게 공유합니다."],"ow":["오답 ✕ — 본문에는 'I am cotton candy.'(저는 솜사탕입니다.)라고 했는데, 이 보기는 유리에 비유했다고 해서 틀림. 유리에 비유한 사람은 Greg이다.","오답 ✕ — 본문에는 'During conversations, I listen to them well.'(대화 동안, 저는 그들의 말을 잘 들어 줍니다.)라고 했는데, 이 보기는 자기 이야기만 많이 한다고 해서 틀림.","정답 ○ — 'My friend Junho always shares his worries with me.'(제 친구 준호는 항상 그의 고민을 저에게 공유합니다.)라고 했으므로 준호가 자주 고민을 털어놓는다는 보기가 맞다.","오답 ✕ — 본문에는 'He likes my sweet and kind words.'(그는 저의 상냥하고 친절한 말을 좋아합니다.)라고 했는데, 이 보기는 농담을 좋아한다고 해서 틀림. 농담에 대한 언급은 없다.","오답 ✕ — 본문에는 'I also enjoy conversations with my friends.'(저는 또한 제 친구들과의 대화를 즐깁니다.)라고 했는데, 이 보기는 대화를 좋아하지 않는다고 해서 틀림."],"memo":["정답 ③: 준호는 Colin에게 자주 고민을 털어놓는다.","근거: My friend Junho always shares his worries with me.(제 친구 준호는 항상 그의 고민을 저에게 공유합니다.)","함정: ⑤ 친구들과의 대화를 즐긴다(enjoy)고 했으므로 ✕"],"why":"Colin은 잘 들어 주는 친구라서 준호가 항상 고민을 털어놓는다."},{"n":7,"q":"다음은 윗글 Colin의 자기소개를 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["cotton candy - friendly","cotton candy - shy","glass - friendly","honeybee - kind","ice cream - loud"],"a":0,"ans":"cotton candy - friendly","evs":[["I am cotton candy.","저는 솜사탕입니다."],["I am sweet and friendly.","저는 상냥하고 친절합니다."]],"ev":["I am cotton candy.","저는 솜사탕입니다."],"ow":["정답 ○ — 'I am cotton candy.'(저는 솜사탕입니다.)라고 했고 'I am sweet and friendly.'(저는 상냥하고 친절합니다.)라고 했으므로 cotton candy - friendly가 맞다.","오답 ✕ — cotton candy는 맞지만, Colin은 'I smile a lot.'(저는 많이 웃습니다.)라고 했으므로 수줍은(shy) 사람이 아니라 친절한(friendly) 사람이다.","오답 ✕ — friendly는 맞지만, 'I am cotton candy.'(저는 솜사탕입니다.)라고 했으므로 유리(glass)가 아니다. 유리는 Greg가 자신을 비유한 사물이다.","오답 ✕ — kind는 어울리지만 꿀벌(honeybee)은 Hani가 자신을 비유한 것이다. Colin은 'I am cotton candy.'(저는 솜사탕입니다.)라고 했다.","오답 ✕ — 본문에 아이스크림은 나오지 않고, 'I am sweet and friendly.'(저는 상냥하고 친절합니다.)라고 했으므로 시끄럽다(loud)는 말도 맞지 않는다."],"memo":["정답 cotton candy - friendly: 솜사탕처럼 상냥하고 친절하다.","근거: I am cotton candy.(저는 솜사탕입니다.) / I am sweet and friendly.(저는 상냥하고 친절합니다.)","함정: glass는 Greg, honeybee는 Hani가 쓴 비유 ✕"],"why":"Colin은 솜사탕처럼 상냥하고 친절하다고 자신을 소개한다.","sum":"Colin compares himself to (A)______ because he is sweet and (B)______.","lab":"완성된 요약문 : "}],"pp":[["Hi, I am Colin.","안녕하세요, 저는 Colin입니다."],["I am cotton candy.","저는 솜사탕입니다."],["I am sweet and friendly.","저는 상냥하고 친절합니다."],["I smile a lot.","저는 많이 웃습니다."],["I also enjoy conversations with my friends.","저는 또한 제 친구들과의 대화를 즐깁니다."],["During conversations, I listen to them well.","대화 동안, 저는 그들의 말을 잘 들어 줍니다."],["My friend Junho always shares his worries with me.","제 친구 준호는 항상 그의 고민을 저에게 공유합니다."],["He likes my sweet and kind words.","그는 저의 상냥하고 친절한 말을 좋아합니다."]]},{"qs":[{"n":8,"q":"윗글 Greg의 말에서 알 수 있는 것은?","o":["Greg는 자신을 솜사탕에 비유했다.","Greg는 거짓말을 아주 잘한다.","Greg의 친구들은 Greg의 생각을 읽기 어려워한다.","Greg의 얼굴에는 감정이 그대로 드러난다.","Greg는 팀 스포츠를 즐긴다."],"a":3,"ans":"Greg의 얼굴에는 감정이 그대로 드러난다.","evs":[["Like glass, my face shows my feelings.","유리처럼, 제 얼굴은 제 감정을 보여 줍니다."],["My friends read my thoughts easily.","제 친구들은 제 생각을 쉽게 읽습니다."]],"ev":["Like glass, my face shows my feelings.","유리처럼, 제 얼굴은 제 감정을 보여 줍니다."],"ow":["오답 ✕ — 본문에는 'I am glass.'(저는 유리입니다.)라고 했는데, 이 보기는 솜사탕에 비유했다고 해서 틀림. 솜사탕은 Colin의 비유이다.","오답 ✕ — 본문에는 'So, I am a bad liar.'(그래서 저는 거짓말을 잘 못합니다.)라고 했는데, 이 보기는 거짓말을 아주 잘한다고 해서 틀림.","오답 ✕ — 본문에는 'My friends read my thoughts easily.'(제 친구들은 제 생각을 쉽게 읽습니다.)라고 했는데, 이 보기는 읽기 어려워한다고 해서 틀림.","정답 ○ — 'Like glass, my face shows my feelings.'(유리처럼, 제 얼굴은 제 감정을 보여 줍니다.)라고 했으므로 얼굴에 감정이 그대로 드러난다는 보기가 맞다.","오답 ✕ — 팀 스포츠를 즐긴다고 말한 사람은 Hani이다. Greg의 글에는 스포츠에 대한 언급이 없어 틀림."],"memo":["정답 ④: Greg의 얼굴에는 감정이 그대로 드러난다.","근거: Like glass, my face shows my feelings.(유리처럼, 제 얼굴은 제 감정을 보여 줍니다.)","함정: ③ 친구들이 생각을 '쉽게(easily)' 읽는다고 했으므로 ✕"],"why":"Greg는 유리처럼 얼굴에 감정이 드러나 거짓말을 잘 못한다."}],"pp":[["Hello, my name is Greg.","안녕하세요, 제 이름은 Greg입니다."],["I am glass.","저는 유리입니다."],["Glass shows everything clearly.","유리는 모든 것을 분명히 보여 줍니다."],["Like glass, my face shows my feelings.","유리처럼, 제 얼굴은 제 감정을 보여 줍니다."],["So, I am a bad liar.","그래서 저는 거짓말을 잘 못합니다."],["Sometimes I lie, but it never works.","가끔 저는 거짓말을 하지만, 전혀 통하지 않습니다."],["My friends read my thoughts easily.","제 친구들은 제 생각을 쉽게 읽습니다."],["That i var secs=[],cur=null;
D.forEach(function(it,i){if(it.tag||!cur){cur={name:it.tag||'',items:[]};secs.push(cur)}cur.items.push(i)});
var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});

  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';

 });
 h+='</div></div>';

 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});

 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
