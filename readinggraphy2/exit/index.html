축하 행사는 매우 오래된 ‘전통’처럼 느껴진다.","opts":["규칙","전통","발명품","숙제"],"word":"tradition","r":{"a":"2) 전통","ev":"2~3번 문장","s":[[2,"Birthday celebrations feel like a very old tradition.","생일 축하 행사는 매우 오래된 전통처럼 느껴진다."],[3,"But people only started this tradition around 100 years ago!","하지만 사람들은 고작 100년쯤 전에 이 전통을 시작했다!"]],"w":"2번에서 생일 축하 행사가 아주 오래된 tradition처럼 느껴진다고 하고, 3번에서 사람들이 ‘이 전통을 시작했다(started this tradition)’고 함. 오래 이어져 온 풍습이므로 tradition은 전통.","c":2},"h":"a53467947b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Families began to have fewer kids, so each kid was able to get more attention.)","ko":"가족들이 더 적은 수의 아이들을 갖기 시작했고, 그래서 각각의 아이는 더 많은 ‘관심’을 받을 수 있었다.","opts":["선물","용돈","관심","나이"],"word":"attention","r":{"a":"3) 관심","ev":"8번 문장","s":[[8,"Families began to have fewer kids, so each kid was able to get more attention.","가족들이 더 적은 수의 아이들을 갖기 시작했고, 그 결과 각각의 아이는 더 많은 관심을 받을 수 있었다."]],"w":"8번에서 아이 수가 줄어서(fewer kids) 각 아이가 more attention을 받았다고 함. 아이가 적어지면 부모의 관심을 더 받게 된다는 흐름이라 attention은 관심. 선물이나 용돈은 나오지 않음. began은 begin(시작하다)의 과거형.","c":3},"h":"a3642622ae"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWe all know the “Happy Birthday” song and sing it at birthday parties.","ko":"밑줄 친 it이 가리키는 것은?","sko":"우리는 모두 ‘생일 축하’ 노래를 알고 있으며, 생일 파티에서 그 노래를 부른다.","opts":["생일 파티","‘생일 축하’ 노래","전통","케이크"],"r":{"a":"2) ‘생일 축하’ 노래","ev":"1번 문장","s":[[1,"We all know the “Happy Birthday” song and sing it at birthday parties.","우리는 모두 ‘생일 축하’ 노래를 알고 있으며, 생일 파티에서 그 노래를 부른다."]],"w":"1번 문장: 생일 축하 노래를 알고 그 노래를 부른다.","c":2,"k":"it = ‘생일 축하’ 노래"},"pron":"it","h":"14938618c1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even though birthday parties have a short history, they’re now a big part of our lives.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 생일 파티는 짧은 역사를 가지고 있지만, 그것들은 이제 우리 삶의 큰 부분을 차지한다.","opts":["생일 파티는 역사가 짧지만 지금은 우리 삶의 큰 부분이다.","생일 파티는 역사가 길어서 우리 삶의 큰 부분이다.","생일 파티는 역사가 짧아서 점점 사라지고 있다.","생일 파티는 우리 삶과 아무 관계가 없다."],"r":{"a":"1) 생일 파티는 역사가 짧지만 지금은 우리 삶의 큰 부분이다.","ev":"12번 문장","s":[[12,"Even though birthday parties have a short history, they’re now a big part of our lives.","비록 생일 파티는 짧은 역사를 가지고 있지만, 그것들은 이제 우리 삶의 큰 부분을 차지한다."]],"w":"Even though는 ‘비록 ~이지만’이라서 앞뒤 내용이 반대됨. 생일 파티는 짧은 역사를 가지고 있지만(앞), 지금은 우리 삶의 큰 부분이다(뒤). 역사가 길다는 것은 2~3번의 ‘오래된 느낌’과 헷갈리게 만든 함정.","c":1},"h":"b121f334ce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["19세기 중반에 가족들은 더 많은 아이를 갖기 시작했다.","생일 카드는 19세기 이전에 흔해졌다.","19세기 중반쯤부터 상황이 바뀌기 시작했다.","19세기 이전에는 모든 사람이 자신의 생일 파티를 했다."],"opts":["Families began to have more kids in the mid-19th century.","Birthday cards became common before the 19th century.","Things began to change around the mid-19th century.","Everyone had their own birthday party before the 19th century."],"r":{"a":"3) Things began to change around the mid-19th century. (19세기 중반쯤부터 상황이 바뀌기 시작했다.)","ev":"7번 문장","s":[[7,"But around the mid-19th century, things changed.","그러나 19세기 중반쯤 되자, 상황이 바뀌었다."]],"w":"7번 문장: 19세기 중반쯤 상황이 바뀌었다.","c":3},"h":"26f8d435f0"},{"n":9,"t":"sum","q":"Birthday parties can (A) how much we (B) our friends and family.","ko":"생일 파티는 우리가 친구들과 가족을 얼마나 많이 (B) (A) 수 있다.","oko":["(A) 숨길 / (B) 사랑하는지","(A) 보여줄 / (B) 사랑하는지","(A) 보여줄 / (B) 미워하는지","(A) 잊을 / (B) 사랑하는지","(A) 보여줄 / (B) 잃는지"],"opts":["(A) hide / (B) love","(A) show / (B) love","(A) show / (B) hate","(A) forget / (B) love","(A) show / (B) lose"],"r":{"a":"2) (A) show / (B) love ((A) 보여줄 / (B) 사랑하는지)","ev":"13번 문장","s":[[13,"They can show how much we love our friends and family.","그것들은 우리가 친구들과 가족을 얼마나 많이 사랑하는지 보여줄 수 있다."]],"w":"13번 문장: 우리가 친구들과 가족을 얼마나 사랑하는지 보여줄 수 있다.","c":2},"h":"95dd8f1d75"},{"n":10,"t":"fill","q":"Before the 19th century, birthday celebrations were only for [A] people or national [B].","ko":"19세기 이전에는 생일 축하 행사가 오직 [A] 사람들이나 국가 [B]들을 위한 것이었다.","bko":{"rich":"부유한","heroes":"영웅들","kids":"아이들","candles":"초","cards":"카드","parents":"부모님"},"bank":["rich","heroes","kids","candles","cards","parents"],"r":{"a":"[A] rich, [B] heroes","ev":"5번 문장","s":[[5,"Before the 19th century, in the U.S., birthday celebrations were only for rich people or national heroes.","19세기 이전 미국에서, 생일 축하 행사는 오직 부자나 국가 영웅들을 위한 것이었다."]],"w":"5번에서 19세기 이전 미국의 생일 축하 행사는 오직 rich people(부자)이나 national heroes(국가 영웅들)를 위한 것이었음. kids, candles, cards는 8~11번(19세기 중반 이후) 이야기라서 이 문장과 맞지 않음.","c":null},"h":"bdf22658f3"}]},{"u":11,"id":"rg2-11-2","no":2,"ko":"스트레스가 쌓일 땐 벽에 붙은 파리가 되어 보세요","items":[{"n":1,"t":"tf","q":"Scientists at Ohio University found out that the fly on the wall method is effective.","ko":"오하이오 대학교의 과학자들은 벽에 붙은 파리 방법이 효과적이라는 것을 알아냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Scientists at Ohio University did a study and found out that this method is effective.","오하이오 대학교의 과학자들은 연구를 했고, 이 방법이 효과적이라는 것을 알아냈어요."]],"w":"4번 문장에 Scientists at Ohio University did a study and found out that this method is effective라고 나옴. 같은 내용이라 T. found는 find(찾다, 알아내다)의 과거형.","c":"T"},"h":"bf262b5f89"},{"n":2,"t":"tf","q":"The fly on the wall method makes you get caught up in bad feelings.","ko":"벽에 붙은 파리 방법은 여러분이 나쁜 감정에 사로잡히게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It stops you from getting caught up in bad feelings.","그것은 여러분이 나쁜 감정에 사로잡히지 않게 막아줘요."]],"w":"7번에서 이 방법은 나쁜 감정에 사로잡히지 않게 ‘막아 준다(stops you from getting caught up in bad feelings)’고 함. 사로잡히게 만든다는 진술은 반대라서 F. stop은 막다.","c":"F"},"h":"e3b0fb338d"},{"n":3,"t":"tf","q":"The fly on the wall method can be done only at home.","ko":"벽에 붙은 파리 방법은 집에서만 할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"This method can be done anywhere at any time and is great for reducing stress.","이 방법은 언제 어디서든 할 수 있고 스트레스를 줄이는 데 아주 좋아요."]],"w":"9번에서 이 방법은 anywhere at any time(언제 어디서든) 할 수 있다고 함. 집에서만 할 수 있다는 말은 틀려서 F.","c":"F"},"h":"438b6d7884"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists at Ohio University did a study and found out that this method is effective.)","ko":"오하이오 대학교의 과학자들은 연구를 했고, 이 방법이 ‘효과적’이라는 것을 알아냈다.","opts":["효과적인","쓸모없는","위험한","어려운"],"word":"effective","r":{"a":"1) 효과적인","ev":"3~5번 문장","s":[[3,"The “fly on the wall” method might sound funny, but it really works!","‘벽에 붙은 파리’ 방법은 우습게 들릴지도 모르지만, 실제로 효과가 있어요!"],[4,"Scientists at Ohio University did a study and found out that this method is effective.","오하이오 대학교의 과학자들은 연구를 했고, 이 방법이 효과적이라는 것을 알아냈어요."],[5,"People who tried it felt less angry and were also able to do their tasks 30% better.","이 방법을 시도해 본 사람들은 화가 덜 난다고 느꼈고 그들의 일을 30% 더 잘할 수 있었어요."]],"w":"3번에서 방법이 실제로 효과가 있다(really works)고 했고, 5번에서 화가 덜 나고 일도 30% 더 잘했다고 함. 4번의 effective는 효과적인. 쓸모없거나 위험하다는 내용은 나오지 않음.","c":1},"h":"78f9ab8440"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When you’re upset, seeing things from the outside can help you.)","ko":"여러분이 ‘속상할’ 때, 외부에서 상황을 바라보는 것이 도움이 될 수 있다.","opts":["신나는","졸린","속상한","배고픈"],"word":"upset","r":{"a":"3) 속상한","ev":"6~7번 문장","s":[[6,"When you’re upset, seeing things from the outside can help you.","여러분이 속상할 때, 외부에서 상황을 바라보는 것이 도움이 될 수 있어요."],[7,"It stops you from getting caught up in bad feelings.","그것은 여러분이 나쁜 감정에 사로잡히지 않게 막아줘요."]],"w":"6번 뒤 7번에서 나쁜 감정에 사로잡히지 않게 해 준다고 함. 그러니 upset은 마음이 상하고 나쁜 감정이 드는 상태, 즉 속상한. 신나는 상태에서는 이 방법이 필요하지 않음.","c":3},"h":"726fa3347b"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe “fly on the wall” method might sound funny, but it really works!","ko":"밑줄 친 it이 가리키는 것은?","sko":"‘벽에 붙은 파리’ 방법은 우습게 들릴지도 모르지만, 실제로 효과가 있어요!","opts":["화난 감정","‘벽에 붙은 파리’ 방법","연구","보안용 카메라"],"r":{"a":"2) ‘벽에 붙은 파리’ 방법","ev":"3번 문장","s":[[3,"The “fly on the wall” method might sound funny, but it really works!","‘벽에 붙은 파리’ 방법은 우습게 들릴지도 모르지만, 실제로 효과가 있어요!"]],"w":"3번 문장: 방법이 우습게 들릴지 몰라도 실제로 효과가 있음.","c":2,"k":"it = ‘벽에 붙은 파리’ 방법"},"pron":"it","h":"a1ade08b44"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of being a fly on the wall, you could also be a cloud in the sky, or a security camera.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"벽에 붙은 파리 대신에, 여러분은 하늘의 구름이나 보안용 카메라가 될 수도 있어요.","opts":["벽에 붙은 파리와 함께 구름과 카메라를 키울 수 있다.","하늘의 구름은 벽에 붙은 파리를 싫어한다.","보안용 카메라가 구름과 파리를 찍을 수 있다.","벽에 붙은 파리 대신 하늘의 구름이나 보안용 카메라가 되어 볼 수도 있다."],"r":{"a":"4) 벽에 붙은 파리 대신 하늘의 구름이나 보안용 카메라가 되어 볼 수도 있다.","ev":"8번 문장","s":[[8,"Instead of being a fly on the wall, you could also be a cloud in the sky, or a security camera.","벽에 붙은 파리 대신에, 여러분은 하늘의 구름이나 보안용 카메라가 될 수도 있어요."]],"w":"Instead of ~는 ‘~ 대신에’. 벽에 붙은 파리 대신 하늘의 구름이나 보안용 카메라가 될 수도 있다는 뜻으로, 바깥에서 지켜보는 다른 모습을 상상해도 된다는 말. 나머지 선지는 본문에 없는 내용.","c":4},"h":"9cc8461a3b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["이 방법은 과학자들만 사용할 수 있다.","이 방법은 특별한 장소에서 해야 한다.","자신을 ‘벽에 붙은 파리’로 상상하는 것은 여러분을 돕는 간단한 비결이다.","여러분은 파리가 아니라 구름이라고 상상해야 한다."],"opts":["The method can only be used by scientists.","The method must be done in a special place.","Imagining yourself as a “fly on the wall” is a simple trick to help you.","You should imagine yourself as a cloud, not as a fly."],"r":{"a":"3) Imagining yourself as a “fly on the wall” is a simple trick to help you. (자신을 ‘벽에 붙은 파리’로 상상하는 것은 여러분을 돕는 간단한 비결이다.)","ev":"2번 문장","s":[[2,"Here’s a simple trick to help you: Imagine yourself as a “fly on the wall.”","여기 여러분을 도와줄 간단한 비결이 있어요: 자신을 ‘벽에 붙은 파리’로 상상해 보세요."]],"w":"2번 문장: 자신을 벽에 붙은 파리로 상상하는 것이 간단한 비결.","c":3},"h":"a2a618f76f"},{"n":9,"t":"sum","q":"People who tried the “fly on the wall” method felt (A) angry and did their tasks (B).","ko":"‘벽에 붙은 파리’ 방법을 시도해 본 사람들은 화가 (A) 난다고 느꼈고 일을 (B) 했다.","oko":["(A) 더 / (B) 더 잘","(A) 덜 / (B) 더 못","(A) 덜 / (B) 더 잘","(A) 더 / (B) 더 못","(A) 덜 / (B) 더 느리게"],"opts":["(A) more / (B) better","(A) less / (B) worse","(A) less / (B) better","(A) more / (B) worse","(A) less / (B) slower"],"r":{"a":"3) (A) less / (B) better","ev":"5번 문장","s":[[5,"People who tried it felt less angry and were also able to do their tasks 30% better.","이 방법을 시도해 본 사람들은 화가 덜 난다고 느꼈고 그들의 일을 30% 더 잘할 수 있었어요."]],"w":"5번에서 방법을 시도한 사람들은 less angry(화가 덜 난다)고 느꼈고 일을 30% better(더 잘) 할 수 있었음. 그래서 (A) less, (B) better. more나 worse는 반대 뜻.","c":3},"h":"599f4816ee"},{"n":10,"t":"fill","q":"Are you [A] too much [B]?","ko":"여러분은 너무 많은 [B]을(를) [A] 있나요?","bko":{"feeling":"느끼고","stress":"스트레스","method":"방법","scientists":"과학자들","camera":"카메라","cloud":"구름"},"bank":["feeling","stress","method","scientists","camera","cloud"],"r":{"a":"[A] feeling (느끼고), [B] stress (스트레스)","ev":"1번 문장","s":[[1,"Are you feeling too much stress?","여러분은 너무 많은 스트레스를 받고 있나요?"]],"w":"1번 문장: Are you feeling too much stress?","c":null},"h":"a5efe29103"}]},{"u":11,"id":"rg2-11-3","no":3,"ko":"돌고래가 몰아 주는 물고기, 브라질 어부의 특별한 친구","items":[{"n":1,"t":"tf","q":"The water in Laguna is not clear, so fishers have a hard time finding fish on their own.","ko":"Laguna의 물은 맑지 않아서, 어부들은 혼자 물고기를 찾는 데 어려움을 겪는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The water is not clear there, so fishers have a hard time finding the fish on their own.","그곳의 물은 맑지 않아서, 어부들은 혼자 물고기를 찾는 데 어려움을 겪는다."]],"w":"2번 문장에 The water is not clear there, so fishers have a hard time finding the fish on their own이라고 나옴. 같은 내용이라 T.","c":"T"},"h":"bed628a691"},{"n":2,"t":"tf","q":"The dolphins never take fish from the fishers’ nets.","ko":"돌고래들은 어부들의 그물에서 물고기를 절대 가져가지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The dolphins also become better at finding fish and sometimes take fish from the fishers’ nets!","돌고래들도 물고기를 찾는 것을 더 잘하게 되며, 때로는 어부의 그물에서 물고기를 가져가기도 한다!"]],"w":"7번에서 돌고래들이 때로는(sometimes) 어부들의 그물에서 물고기를 가져간다(take fish from the fishers’ nets)고 함. never(절대 ~않는다)는 본문과 반대라 F.","c":"F"},"h":"9036df66b2"},{"n":3,"t":"tf","q":"There are now more fish than before.","ko":"이제 예전보다 물고기가 더 많다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"There are now fewer fish than before.","이제 예전보다 물고기의 수가 더 적다."]],"w":"10번에서 There are now fewer fish than before라고 함. fewer(더 적은 수의)이지 more가 아니므로 F. 물고기가 줄어서 돌고래의 삶도 힘들어지고 있음.","c":"F"},"h":"0acb93dfff"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But thankfully, the dolphins help them with a special dive!)","ko":"하지만 ‘다행히도’, 돌고래들이 특별한 잠수로 그들을 도와준다!","opts":["다행히도","불행히도","천천히","조용히"],"word":"thankfully","r":{"a":"1) 다행히도","ev":"2~3번 문장","s":[[2,"The water is not clear there, so fishers have a hard time finding the fish on their own.","그곳의 물은 맑지 않아서, 어부들은 혼자 물고기를 찾는 데 어려움을 겪는다."],[3,"But thankfully, the dolphins help them with a special dive!","하지만 다행히도, 돌고래들이 특별한 잠수로 그들을 도와준다!"]],"w":"2번에서 어부들이 물고기를 찾기 어려운 상황이라고 했는데, 3번 But 뒤에서 돌고래들이 도와줌. 좋은 일이 생겼으니 thankfully는 다행히도. 불행히도(unfortunately)는 반대 뜻.","c":1},"h":"97fdd0aed0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Polluted water is harming the dolphins.)","ko":"‘오염된’ 물이 돌고래들을 해치고 있다.","opts":["맑은","차가운","오염된","따뜻한"],"word":"Polluted","r":{"a":"3) 오염된","ev":"8~9번 문장","s":[[8,"However, life is becoming tough for the dolphins.","그러나, 돌고래들에게 삶은 힘들어지고 있다."],[9,"Polluted water is harming the dolphins.","오염된 물이 돌고래들을 해치고 있다."]],"w":"8번에서 돌고래의 삶이 힘들어지고 있다고 했고, 9번은 그 이유로 Polluted water가 돌고래를 해치고 있다고 함. 돌고래를 해치는 물이므로 polluted는 오염된. 맑은 물은 해치지 않고, 2번에서도 물이 맑지 않다고 했음.","c":3},"h":"2326ecbb94"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt lets the fishers know when to throw their nets.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 어부들이 언제 그물을 던져야 하는지 알게 해 준다.","opts":["Laguna의 맑은 물","돌고래의 특별한 잠수","어부의 그물","과학자들의 관찰"],"r":{"a":"2) 돌고래의 특별한 잠수","ev":"3~4번 문장","s":[[3,"But thankfully, the dolphins help them with a special dive!","하지만 다행히도, 돌고래들이 특별한 잠수로 그들을 도와준다!"],[4,"It lets the fishers know when to throw their nets.","그것은 어부들이 언제 그물을 던져야 하는지 알게 해 준다."]],"w":"4번의 It lets the fishers know when to throw their nets 바로 앞 3번에서 돌고래들이 special dive(특별한 잠수)로 어부들을 도와준다고 함. 그 잠수가 어부들에게 그물 던질 때를 알려 줌. 그물은 던지는 대상이고 과학자들의 관찰은 5번 내용.","c":2},"h":"78d9c017d2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If more people understand the importance of this friendship between fishers and dolphins, they might help to protect it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 더 많은 사람들이 어부들과 돌고래들 사이의 이 우정의 중요성을 이해한다면, 그들은 그것을 보호하는 데 도움을 줄지도 모른다.","opts":["어부와 돌고래의 우정은 이미 사람들에게 잘 보호받고 있다.","사람들이 돌고래를 많이 잡으면 우정이 더 깊어진다.","돌고래가 사람들의 중요성을 이해하면 어부를 도울 것이다.","더 많은 사람들이 이 우정의 중요성을 이해하면 그것을 보호하는 데 도움을 줄지도 모른다."],"r":{"a":"4) 더 많은 사람들이 이 우정의 중요성을 이해하면 그것을 보호하는 데 도움을 줄지도 모른다.","ev":"11번 문장","s":[[11,"If more people understand the importance of this friendship between fishers and dolphins, they might help to protect it.","만약 더 많은 사람들이 어부들과 돌고래들 사이의 이 우정의 중요성을 이해한다면, 그들은 그것을 보호하는 데 도움을 줄지도 모른다."]],"w":"If more people understand ~, they might help to protect it에서 If는 ‘만약 ~한다면’, it은 어부와 돌고래의 우정. 사람들이 우정의 중요성을 이해하면 그것을 보호하는 데 도울지도 모른다는 뜻. 이미 보호받는다는 말은 없고, 이해하는 쪽은 돌고래가 아니라 사람들.","c":4},"h":"d72bacdfc7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["어부들은 돌고래와 함께 일할 때 더 적은 물고기를 찾는다.","Laguna의 물은 맑아서 어부들이 쉽게 물고기를 찾는다.","돌고래들에게 삶은 힘들어지고 있다.","과학자들은 이 우정에 대해 흥미로운 것을 하나도 발견하지 못했다."],"opts":["Fishers find fewer fish when they work with dolphins.","The water in Laguna is clear, so fishers easily find fish.","Life is becoming tough for the dolphins.","Scientists did not find anything interesting about this friendship."],"r":{"a":"3) Life is becoming tough for the dolphins. (돌고래들에게 삶은 힘들어지고 있다.)","ev":"8번 문장","s":[[8,"However, life is becoming tough for the dolphins.","그러나, 돌고래들에게 삶은 힘들어지고 있다."]],"w":"8번 문장: 돌고래들에게 삶은 힘들어지고 있다.","c":3},"h":"ab5ac72870"},{"n":9,"t":"sum","q":"In Laguna, some fishers have (A) dolphins as their special (B).","ko":"Laguna의 일부 어부들에게는 (A) 돌고래들이 특별한 (B)이다.","oko":["(A) 야생의 / (B) 친구들","(A) 졸린 / (B) 친구들","(A) 야생의 / (B) 적들","(A) 야생의 / (B) 일꾼들","(A) 작은 / (B) 친구들"],"opts":["(A) wild / (B) friends","(A) sleepy / (B) friends","(A) wild / (B) enemies","(A) wild / (B) workers","(A) small / (B) friends"],"r":{"a":"1) (A) wild / (B) friends ((A) 야생의 / (B) 친구들)","ev":"1번 문장","s":[[1,"In Laguna, Brazil, some fishers have special friends — wild dolphins!","브라질 Laguna에서, 일부 어부들은 특별한 친구를 가지고 있다 — 야생 돌고래들이다!"]],"w":"1번 문장: 일부 어부들은 특별한 친구, 야생 돌고래를 가지고 있음.","c":1},"h":"0837e4f2bf"},{"n":10,"t":"fill","q":"When the fishers and dolphins work [A], the fishers [B] more fish.","ko":"어부들과 돌고래들이 [A] 일할 때, 어부들은 더 많은 물고기를 [B].","bko":{"together":"함께","catch":"잡는다","clear":"맑은","nets":"그물들","special":"특별한","dive":"잠수"},"bank":["together","catch","clear","nets","special","dive"],"r":{"a":"[A] together (함께), [B] catch (잡는다)","ev":"6번 문장","s":[[6,"When the fishers and dolphins work together, the fishers catch more fish.","어부들과 돌고래들이 함께 일할 때, 어부들은 더 많은 물고기를 잡는다."]],"w":"6번 문장: 함께 일할 때 어부들은 더 많은 물고기를 잡는다.","c":null},"h":"fb2fdd62cd"}]},{"u":12,"id":"rg2-12-1","no":1,"ko":"포르투갈 사람들이 대구에 푹 빠진 이유","items":[{"n":1,"t":"tf","q":"Portuguese people eat more than 100,000 tons of salted dried cod every year.","ko":"포르투갈 사람들은 매년 소금에 절인 말린 대구를 10만 톤 이상 먹는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They eat more than 100,000 tons of salted dried cod every year.","그들은 매년 소금에 절인 말린 대구를 10만 톤 이상 먹는다."]],"w":"2번 문장에 They eat more than 100,000 tons of salted dried cod every year라고 나옴. 같은 내용이라 T.","c":"T"},"h":"5689530f57"},{"n":2,"t":"tf","q":"Most of the cod that people in Portugal eat nowadays comes from Portugal.","ko":"요즘 포르투갈 사람들이 먹는 대구의 대부분은 포르투갈에서 온다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Nowadays, most of the cod that people in Portugal eat actually comes from Norway.","요즘에, 포르투갈 사람들이 먹는 대부분의 대구는 사실 노르웨이에서 온다."]],"w":"7번에서 요즘 포르투갈 사람들이 먹는 대부분의 대구는 사실 노르웨이(Norway)에서 온다고 함. 포르투갈에서 온다는 진술은 틀려서 F.","c":"F"},"h":"cae0d87a35"},{"n":3,"t":"tf","q":"In the 1930s, Portuguese fishermen traveled to Norway and Greenland just to catch cod.","ko":"1930년대에, 포르투갈 어부들은 오직 대구를 잡기 위해 노르웨이와 그린란드에 갔다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"In the 1930s, Portuguese fishermen traveled to Canada and Greenland just to catch cod.","1930년대에, 포르투갈 어부들은 오직 대구를 잡기 위해 캐나다와 그린란드에 갔다."]],"w":"6번에서 포르투갈 어부들이 간 곳은 Canada(캐나다)와 Greenland(그린란드)였음. 노르웨이는 7번에서 요즘 대구가 오는 나라라서 헷갈리게 섞은 함정. 그래서 F. traveled는 travel(가다, 여행하다)의 과거형.","c":"F"},"h":"acb2748c84"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Portuguese people started eating cod in the 1300s when Portugal traded salt for codfish with England.)","ko":"포르투갈 사람들은 1300년대에 포르투갈이 영국과 소금을 대구로 ‘교환하면서’ 대구를 먹기 시작했다.","opts":["선물하다","교환하다, 거래하다","훔치다","요리하다"],"word":"traded","r":{"a":"2) 교환하다, 거래하다","ev":"5번 문장","s":[[5,"Portuguese people started eating cod in the 1300s when Portugal traded salt for codfish with England.","포르투갈 사람들은 1300년대에 포르투갈이 영국과 소금을 대구로 교환하면서 대구를 먹기 시작했다."]],"w":"5번에서 포르투갈이 영국에 소금을 주고 대구를 받았다는 흐름. trade A for B는 ‘A를 B와 교환하다’라서 trade는 교환하다, 거래하다. 훔치거나 요리한다는 내용은 나오지 않음.","c":2},"h":"e8b48effab"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Eating codfish is a big part of Portuguese culture.)","ko":"대구를 먹는 것은 포르투갈 ‘문화’의 큰 부분을 차지한다.","opts":["문화","경제","날씨","언어"],"word":"culture","r":{"a":"1) 문화","ev":"10~11번 문장","s":[[10,"But it’s not just about the taste.","하지만 그것은 단지 맛 때문만은 아니다."],[11,"Eating codfish is a big part of Portuguese culture.","대구를 먹는 것은 포르투갈 문화의 큰 부분을 차지한다."]],"w":"10번에서 대구는 단지 맛 때문만이 아니라고 했고, 11번에서 대구를 먹는 것이 포르투갈의 culture의 큰 부분이라고 함. 12~13번의 대구 요리, 크리스마스이브 식사 이야기도 문화에 해당. 그래서 culture는 문화.","c":1},"h":"a07456c897"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWell, one reason is that it tastes great.","ko":"밑줄 친 it이 가리키는 것은?","sko":"자, 한 가지 이유는 그것이 굉장히 맛있다는 것이다.","opts":["대구","포르투갈","노르웨이","소금"],"r":{"a":"1) 대구","ev":"8~9번 문장","s":[[8,"Why do people in Portugal love cod so much?","포르투갈 사람들은 대구를 왜 그렇게 좋아할까?"],[9,"Well, one reason is that it tastes great.","자, 한 가지 이유로는 대구의 맛이 굉장히 좋기 때문이다."]],"w":"8번에서 대구를 왜 좋아하는지 묻고, 9번 it은 대구.","c":1,"k":"it = 대구"},"pron":"it","h":"55e87dc241"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But it’s not just about the taste.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그것은 단지 맛 때문만은 아니다.","opts":["대구는 맛이 없지만 포르투갈 사람들은 그래도 먹는다.","포르투갈 사람들은 맛 때문에만 대구를 좋아한다.","대구의 맛은 포르투갈 사람들에게 전혀 상관이 없다.","포르투갈 사람들이 대구를 좋아하는 이유는 맛뿐만이 아니다."],"r":{"a":"4) 포르투갈 사람들이 대구를 좋아하는 이유는 맛뿐만이 아니다.","ev":"9~10번 문장","s":[[9,"Well, one reason is that it tastes great.","자, 한 가지 이유로는 대구의 맛이 굉장히 좋기 때문이다."],[10,"But it’s not just about the taste.","하지만 그것은 단지 맛 때문만은 아니다."]],"w":"9번에서 맛이 좋은 것을 한 가지 이유로 말했고, 10번 But it’s not just about the taste는 ‘하지만 맛 때문만은 아니다’라는 뜻. 맛도 이유이지만 그것만이 전부는 아님. 11번에서 두 번째 이유(문화)가 나옴.","c":4},"h":"a952213dd9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["포르투갈 사람들은 1930년대에 대구를 먹기 시작했다.","포르투갈 사람들은 대구 먹는 것을 아주 좋아한다.","소금에 절인 말린 대구는 겨울에만 먹는다.","포르투갈 사람들은 대구 요리를 좋아하지 않는다."],"opts":["Portuguese people started eating cod in the 1930s.","People in Portugal really love to eat cod.","Salted dried cod is eaten only in winter.","Portuguese people do not like cod dishes."],"r":{"a":"2) People in Portugal really love to eat cod. (포르투갈 사람들은 대구 먹는 것을 아주 좋아한다.)","ev":"1번 문장","s":[[1,"In Portugal, people really love to eat cod.","포르투갈에서, 사람들은 대구 먹는 것을 아주 좋아한다."]],"w":"1번 문장: 포르투갈 사람들은 대구 먹는 것을 아주 좋아한다.","c":2},"h":"7bfd117d59"},{"n":9,"t":"sum","q":"Portuguese people especially love having cod on Christmas Eve with (A), eggs, and (B).","ko":"포르투갈 사람들은 특히 크리스마스이브에 (A), 달걀, 그리고 (B)와(과) 함께 대구를 먹는 것을 아주 좋아한다.","oko":["(A) 쌀밥 / (B) 감자","(A) 양배추 / (B) 빵","(A) 양배추 / (B) 감자","(A) 양파 / (B) 감자","(A) 양배추 / (B) 쌀밥"],"opts":["(A) rice / (B) potatoes","(A) cabbage / (B) bread","(A) cabbage / (B) potatoes","(A) onions / (B) potatoes","(A) cabbage / (B) rice"],"r":{"a":"3) (A) cabbage / (B) potatoes ((A) 양배추 / (B) 감자)","ev":"13번 문장","s":[[13,"They especially love having cod on Christmas Eve with cabbage, eggs, and potatoes.","그들은 특히 크리스마스이브에 양배추, 달걀, 그리고 감자와 함께 대구를 먹는 것을 아주 좋아한다."]],"w":"13번 문장: 크리스마스이브에 양배추, 달걀, 감자와 함께 대구를 먹는다.","c":3},"h":"611ccc8912"},{"n":10,"t":"fill","q":"Portuguese people have [A] cod dishes for a long [B].","ko":"포르투갈 사람들은 오랜 [B] 동안 대구 요리를 [A].","bko":{"enjoyed":"즐겨 왔다","time":"시간","tons":"톤(무게 단위)","nowadays":"요즘","excited":"신나는","Eve":"이브(전날)"},"bank":["enjoyed","time","tons","nowadays","excited","Eve"],"r":{"a":"[A] enjoyed (즐겨 왔다), [B] time (시간)","ev":"12번 문장","s":[[12,"Portuguese people have enjoyed cod dishes for a long time.","포르투갈 사람들은 오랫동안 대구 요리를 즐겨 왔다."]],"w":"12번 문장: have enjoyed cod dishes for a long time.","c":null},"h":"a6f08b8eba"}]},{"u":12,"id":"rg2-12-2","no":2,"ko":"공룡 뼈에도 나이테가 있다고요?","items":[{"n":1,"t":"tf","q":"The T. rex gained around 15 to 20 kg per week.","ko":"티라노사우루스는 매주 약 15에서 20kg씩 체중이 늘었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The T. rex gained around 15 to 20 kg per week.","티라노사우루스는 매주 약 15에서 20kg씩 체중이 늘었다."]],"w":"5번 문장에 The T. rex gained around 15 to 20 kg per week라고 나옴. 같은 내용이라 T. gained는 gain(체중이 늘다)의 과거형.","c":"T"},"h":"61271bcd1e"},{"n":2,"t":"tf","q":"Mammals keep growing fast even after they become adults.","ko":"포유류는 성인이 된 후에도 계속 빠르게 성장한다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Then, they stop growing when they are adults.","그 후, 그들은 성인이 되면 성장하는 것을 멈춘다."]],"w":"2번에서 포유류는 어릴 때 빠르게 자라다가(1번), 성인이 되면 성장을 멈춘다(they stop growing when they are adults)고 함. 계속 자란다는 진술은 반대라서 F. stop은 멈추다.","c":"F"},"h":"b8f771750a"},{"n":3,"t":"tf","q":"A newly discovered dinosaur reached its full size when it was a teenager.","ko":"새롭게 발견된 공룡은 청소년기에 완전한 크기에 이르렀다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"These bones showed that it didn’t reach its full size until it was in its 30s or 40s!","이 뼈들은 그 공룡이 30대나 40대가 되기 전까지는 완전한 크기에 이르지 못했다는 것을 보여 주었다!"]],"w":"14번에서 새롭게 발견된 공룡은 30대나 40대가 되기 전까지는 완전한 크기에 이르지 못했다고 함. 청소년기에 다 자란 것이 아니므로 F. reached는 reach(이르다)의 과거형.","c":"F"},"h":"45501b613f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But others that reached a similar size took longer in order to grow.)","ko":"하지만 비슷한 크기에 ‘이른’ 다른 공룡들은 성장하기 위해 더 오래 걸렸다.","opts":["이르다, 도달하다","피하다","가르치다","잃다"],"word":"reach","r":{"a":"1) 이르다, 도달하다","ev":"11~12번 문장","s":[[11,"Some, like the T. rex, grew quickly when they were young.","티라노사우루스와 같은 어떤 공룡들은 어릴 때 빠르게 성장했다."],[12,"But others that reached a similar size took longer in order to grow.","하지만 비슷한 크기에 이른 다른 공룡들은 성장하기 위해 더 오래 걸렸다."]],"w":"11~12번은 어떤 공룡은 어릴 때 빨리 자랐고 비슷한 크기에 이른 다른 공룡들은 더 오래 걸렸다는 내용. 크기에 ‘이르다’는 뜻이라 reach는 이르다, 도달하다. 14번에도 reach its full size(완전한 크기에 이르다)로 나옴.","c":1},"h":"a78d49885c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The scientists also studied bones from a newly discovered dinosaur.)","ko":"그 과학자들은 또한 새롭게 ‘발견된’ 공룡에서 나온 뼈들을 연구했다.","opts":["오래된","잃어버린","발견된","팔린"],"word":"discovered","r":{"a":"3) 발견된","ev":"13~14번 문장","s":[[13,"The scientists also studied bones from a newly discovered dinosaur.","그 과학자들은 또한 새롭게 발견된 공룡에서 나온 뼈들을 연구했다."],[14,"These bones showed that it didn’t reach its full size until it was in its 30s or 40s!","이 뼈들은 그 공룡이 30대나 40대가 되기 전까지는 완전한 크기에 이르지 못했다는 것을 보여 주었다!"]],"w":"13번에서 과학자들이 newly discovered dinosaur의 뼈를 연구했다고 함. newly는 ‘새롭게’, discovered는 ‘발견된’이라 새롭게 발견된 공룡. 오래되었거나 잃어버렸다는 뜻이 아님.","c":3},"h":"1178542f79"},{"n":6,"t":"ref","q":"What does the underlined \"These rings\" refer to?\nThese rings help us understand how dinosaurs grew over time.","ko":"밑줄 친 These rings가 가리키는 것은?","sko":"이 둥근 선들은 공룡이 시간이 지남에 따라 어떻게 성장했는지를 우리가 이해하도록 도와준다.","opts":["나무의 가지","공룡 뼈에 있는 둥근 선들","티라노사우루스의 체중","11개의 서로 다른 공룡"],"r":{"a":"2) 공룡 뼈에 있는 둥근 선들","ev":"8~9번 문장","s":[[8,"Just like tree rings, dinosaur bones also have rings.","꼭 나무의 나이테처럼, 공룡의 뼈에도 둥근 선들이 있다."],[9,"These rings help us understand how dinosaurs grew over time.","이 둥근 선들은 공룡이 시간이 지남에 따라 어떻게 성장했는지를 우리가 이해하도록 도와준다."]],"w":"9번의 These rings는 바로 앞 8번의 rings, 즉 공룡 뼈에도 있는 둥근 선들(나이테 같은 무늬)이다. 그 선이 공룡이 어떻게 성장했는지 알려 줌. 나무의 나이테는 비교를 위한 말이고, 체중은 5번 내용.","c":2},"h":"3e2aadd63a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"After studying these rings, the scientists found an answer.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 둥근 선들을 연구한 후, 과학자들은 답을 찾았다.","opts":["둥근 선들을 연구한 뒤에, 과학자들은 답을 알아냈다.","둥근 선들을 연구하기 전에, 과학자들은 이미 답을 알고 있었다.","둥근 선들을 연구했지만, 과학자들은 답을 찾지 못했다.","둥근 선들을 연구한 뒤에, 과학자들은 새로운 질문만 만들었다."],"r":{"a":"1) 둥근 선들을 연구한 뒤에, 과학자들은 답을 알아냈다.","ev":"10번 문장","s":[[10,"After studying these rings, the scientists found an answer.","이 둥근 선들을 연구한 후, 과학자들은 답을 찾았다."]],"w":"10번 문장: 둥근 선들을 연구한 후 과학자들은 답을 찾았다.","c":1},"h":"fc33fc8a5e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["과학자들은 11개의 서로 다른 종류의 공룡 뼈를 연구했다.","모든 공룡은 티라노사우루스만큼 빠르게 성장했다.","공룡의 뼈에는 둥근 선이 전혀 없다.","티라노사우루스는 청소년기에 느리게 성장했다."],"opts":["Scientists studied the bones of 11 different types of dinosaurs.","All dinosaurs grew as fast as the T. rex.","Dinosaur bones do not have any rings.","The T. rex grew slowly when it was a teenager."],"r":{"a":"1) Scientists studied the bones of 11 different types of dinosaurs.","ev":"4번, 7~8번, 11~12번 문장","s":[[4,"Scientists knew that the meat-eating Tyrannosaurus rex grew very fast when it was a teenager.","과학자들은 육식 공룡인 티라노사우루스가 청소년기에 매우 빠르게 성장했다는 것을 알고 있었다."],[7,"To find this out, some scientists studied the bones of 11 different types of dinosaurs.","이를 알아내기 위해, 몇몇 과학자들은 11개의 서로 다른 종류의 공룡 뼈를 연구했다."],[8,"Just like tree rings, dinosaur bones also have rings.","꼭 나무의 나이테처럼, 공룡의 뼈에도 둥근 선들이 있다."],[11,"Some, like the T. rex, grew quickly when they were young.","티라노사우루스와 같은 어떤 공룡들은 어릴 때 빠르게 성장했다."],[12,"But others that reached a similar size took longer in order to grow.","하지만 비슷한 크기에 이른 다른 공룡들은 성장하기 위해 더 오래 걸렸다."]],"w":"7번에서 과학자들이 11개의 서로 다른 종류의 공룡 뼈를 연구했음. 모든 공룡이 T. rex처럼 빠르지는 않았고(12번), 공룡 뼈에도 둥근 선이 있으며(8번), T. rex는 청소년기에 매우 빠르게 성장했음(4번)이라 나머지는 모두 다름.","c":1},"h":"15c504ed51"},{"n":9,"t":"sum","q":"Some dinosaurs, like the T. rex, grew (A) when they were (B).","ko":"티라노사우루스와 같은 어떤 공룡들은 (B) 때 (A) 성장했다.","oko":["(A) 느리게 / (B) 어릴","(A) 빠르게 / (B) 어릴","(A) 빠르게 / (B) 늙은","(A) 빠르게 / (B) 아플","(A) 느리게 / (B) 늙은"],"opts":["(A) slowly / (B) young","(A) quickly / (B) young","(A) quickly / (B) old","(A) quickly / (B) sick","(A) slowly / (B) old"],"r":{"a":"2) (A) quickly / (B) young ((A) 빠르게 / (B) 어릴)","ev":"11번 문장","s":[[11,"Some, like the T. rex, grew quickly when they were young.","티라노사우루스와 같은 어떤 공룡들은 어릴 때 빠르게 성장했다."]],"w":"11번 문장: T. rex처럼 어떤 공룡들은 어릴 때 빠르게 성장했다.","c":2},"h":"0466743977"},{"n":10,"t":"fill","q":"But they weren’t [A] if other dinosaurs grew in the [B] way.","ko":"그러나 그들은 다른 공룡들이 [B] 방식으로 성장했는지 [A] 상태가 아니었다.","bko":{"sure":"확신하는","same":"같은","rings":"둥근 선들","bones":"뼈들","years":"해(복수형)","teenager":"청소년"},"bank":["sure","same","rings","bones","years","teenager"],"r":{"a":"[A] sure (확신하는), [B] same (같은)","ev":"6번 문장","s":[[6,"But they weren’t sure if other dinosaurs grew in the same way.","그러나 그들은 다른 공룡들이 같은 방식으로 성장했는지 확신할 수 없었다."]],"w":"6번 문장: 다른 공룡들이 같은 방식으로 성장했는지 확신하지 못했다.","c":null},"h":"1c254b780e"}]},{"u":12,"id":"rg2-12-3","no":3,"ko":"문어가 조개껍데기를 던진 진짜 이유","items":[{"n":1,"t":"tf","q":"The scientists watched 10 octopuses for 24 hours by using cameras.","ko":"과학자들은 카메라를 사용해 10마리의 문어를 24시간 동안 관찰했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"By using cameras, they watched 10 octopuses for 24 hours.","카메라를 사용해, 그들은 24시간 동안 10마리의 문어를 관찰했다."]],"w":"2번 문장에 By using cameras, they watched 10 octopuses for 24 hours라고 나옴. they는 1번의 과학자들이라 T. watched는 watch(관찰하다)의 과거형.","c":"T"},"h":"84d152b513"},{"n":2,"t":"tf","q":"The darker the octopuses’ skin became, the worse they threw.","ko":"문어의 피부가 어두워질수록, 그것들은 더 못 던졌다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The darker their skin became, the better they threw.","그것들의 피부가 어두워질수록, 그것들은 더 잘 던졌다."]],"w":"7번에서 The darker their skin became, the better they threw라고 함. ‘더 잘(better)’ 던졌는데 ‘더 못(worse)’ 던졌다고 바꾼 진술이라 F. the 비교급 ~, the 비교급 …은 ‘~할수록 더 …하다’.","c":"F"},"h":"778a61c0b5"},{"n":3,"t":"tf","q":"The octopuses were trying to stop having relationships with each other.","ko":"문어들은 서로 관계를 끊으려고 노력하고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Either way, they were trying to build relationships with each other.","어느 쪽이든, 그것들은 서로 관계를 맺으려고 노력하고 있었다."]],"w":"11번에서 문어들은 서로 relationships를 build(맺다)하려고 노력하고 있었다고 함. 끊으려 한 것이 아니라 맺으려 한 것이므로 F. were trying은 try(노력하다)의 과거진행형.","c":"F"},"h":"f9b0d2a7b2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This wasn’t an accident. They were hitting other octopuses on purpose.)","ko":"이것은 ‘우연’이 아니었다. 그것들은 다른 문어들을 고의로 맞히고 있었다.","opts":["계획","우연, 사고","실험","선물"],"word":"accident","r":{"a":"2) 우연, 사고","ev":"4~5번 문장","s":[[4,"This wasn’t an accident.","이것은 우연이 아니었다."],[5,"They were hitting other octopuses on purpose.","그것들은 다른 문어들을 고의로 맞히고 있었다."]],"w":"4번의 accident는 바로 뒤 5번 on purpose(고의로)와 반대되는 말. 일부러가 아니라 ‘우연히’ 생긴 일이라 accident는 우연, 사고. 5번의 hitting은 hit(맞히다)의 진행형.","c":2},"h":"53bcf7f838"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, they even copied each other’s throwing actions.)","ko":"또한, 그것들은 심지어 서로의 던지는 동작을 ‘따라 했다’.","opts":["숨겼다","멈췄다","따라 했다","가르쳤다"],"word":"copied","r":{"a":"3) 따라 했다","ev":"8~9번 문장","s":[[8,"Also, they even copied each other’s throwing actions.","또한, 그것들은 심지어 서로의 던지는 동작을 따라 하기도 했다."],[9,"When one octopus lifted a leg to throw, the other did the same thing.","한 마리의 문어가 던지기 위해 다리를 들어 올렸을 때, 다른 한 마리도 같은 동작을 했다."]],"w":"9번에서 한 마리가 던지려고 다리를 들어 올리자 다른 한 마리도 같은 동작(the same thing)을 했음. 같은 동작을 했으니 copy는 따라 하다. copied는 copy의 과거형.","c":3},"h":"8876dd721b"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSo, if you see octopuses throwing things at each other, you can guess they might be friends even if they seem angry at each other!","ko":"밑줄 친 they가 가리키는 것은?","sko":"그러니, 만약 당신이 문어들이 서로에게 물건을 던지는 모습을 본다면, 그것들이 서로에게 화난 것처럼 보여도 친구일지도 모른다고 추측할 수 있다!","opts":["문어들","여러분","과학자들","카메라들"],"r":{"a":"1) 문어들","ev":"13번 문장","s":[[13,"So, if you see octopuses throwing things at each other, you can guess they might be friends even if they seem angry at each other!","그러니, 만약 당신이 문어들이 서로에게 물건을 던지는 모습을 본다면, 그것들이 서로에게 화난 것처럼 보여도 친구일지도 모른다고 추측할 수 있다!"]],"w":"13번 문장: 문어들이 서로에게 물건을 던지면 그것들(they)이  피곤하다 / (B) 무례한","(A) 겁난다 / (B) 호기심 많은"],"opts":["(A) happy / (B) social","(A) mad / (B) shy","(A) mad / (B) social","(A) tired / (B) rude","(A) scared / (B) curious"],"r":{"a":"3) (A) mad / (B) social","ev":"10번, 12번 문장","s":[[10,"By throwing things, octopuses could show that they’re mad or they just want to talk to others.","물건을 던짐으로써, 문어들은 자신들이 화가 났거나 다른 문어들과 이야기하고 싶어 한다는 것을 보여 줄 수 있었다."],[12,"This behavior shows that octopuses are social animals.","이 행동은 문어가 사회적인 동물이라는 것을 보여 준다."]],"w":"10번에서 문어들이 물건을 던져 자신들이 mad(화났다)거나 다른 문어들과 이야기하고 싶다는 것을 보여 줄 수 있었고, 12번에서 이 행동이 문어가 social(사회적인) 동물임을 보여 준다고 함. 행복하거나 피곤하다는 말은 나오지 않고, shy나 rude는 본문과 맞지 않음.","c":3},"h":"a5abd367ff"},{"n":10,"t":"fill","q":"Scientists in [A] did an interesting [B] with octopuses.","ko":"[A]의 과학자들은 문어로 흥미로운 [B]을(를) 했다.","bko":{"Australia":"호주","experiment":"실험","hours":"시간들","skin":"피부","shells":"조개껍데기들","cameras":"카메라들"},"bank":["Australia","experiment","hours","skin","shells","cameras"],"r":{"a":"[A] Australia (호주), [B] experiment (실험)","ev":"1번 문장","s":[[1,"Scientists in Australia did an interesting experiment with octopuses.","호주의 과학자들은 문어로 흥미로운 실험을 했다."]],"w":"1번 문장: 호주의 과학자들은 문어로 흥미로운 실험을 했다.","c":null},"h":"2ead1ddc33"}]}];
