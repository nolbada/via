 insulin은 음식을 에너지로 바꾸는 과정에 참여하는 호르몬이라고 해요. 푸드 코마는 많은 양을 먹어 생기는 극심한 피로 상태이고(4번), 수치를 급격히 올리는 것은 고GI 음식이며(9번), 물은 분해를 더 효과적으로 돕는다고 해요(13번).","c":2},"h":"1a904bd18b"},{"n":9,"t":"sum","q":"A food coma is a (A) of extreme tiredness after a big meal, and it can be (B) by eating low GI foods and drinking water.","ko":"푸드 코마는 푸짐한 식사 후 극심한 피로의 (A)이며, 저혈당 지수의 음식을 먹고 물을 마시면 (B) 수 있다.","oko":["(A) 보상 / (B) 피할","(A) 상태 / (B) 늘어날","(A) 습관 / (B) 미뤄질","(A) 상태 / (B) 피할","(A) 약 / (B) 일으켜질"],"opts":["(A) reward / (B) avoided","(A) state / (B) increased","(A) habit / (B) delayed","(A) state / (B) avoided","(A) medicine / (B) caused"],"r":{"a":"4) (A) state / (B) avoided","ev":"4번, 11번, 14번 문장","s":[[4,"A food coma is a state of extreme tiredness caused by eating a generous serving of food.","푸드 코마는 많은 양의 음식을 먹음으로써 야기되는 극심한 피로 상태이다."],[11,"To combat post-meal fatigue, consume foods with a low GI, such as fruit, leafy vegetables, beans, and wholegrain bread.","식사 후 피로를 방지하기 위해서는, 과일, 잎 채소, 콩, 통밀 빵과 같은 저혈당 지수의 음식을 섭취해라."],[14,"So, if you want to avoid slipping into a food coma, eat a balanced meal and drink plenty of water.","그러므로, 푸드 코마에 빠지는 것을 피하고 싶다면, 균형 잡힌 식사를 먹고 충분한 물을 마셔라."]],"w":"4번 문장에서 food coma는 극심한 피로의 ‘상태(state)’예요. 11~14번에서 저혈당 지수 음식과 물, 균형 잡힌 식사로 푸드 코마를 피할 수 있다고 해요. reward·habit·medicine은 본문에 없고, increased·caused는 방법의 효과와 반대예요.","c":4},"h":"d8a8f420b3"},{"n":10,"t":"fill","q":"Water helps the body [A] nutrients and reduces the [B] on the digestive system.","ko":"물은 몸이 영양소를 [A] 도와주고 소화 체계의 [B]을(를) 줄여 준다.","bank":["absorb","workload","insulin","coma","signal","portion"],"bko":{"absorb":"흡수하다","workload":"부담","insulin":"인슐린","coma":"혼수상태","signal":"신호","portion":"1인분"},"r":{"a":"[A] absorb, [B] workload","ev":"13번 문장","s":[[13,"It allows the body to break down food more effectively, helping the body absorb nutrients and reducing the workload on the digestive system.","물은 몸이 음식을 더 효과적으로 분해하게 하며, 영양소를 흡수하는 데 도움을 주고 소화 체계의 부담을 줄여 준다."]],"w":"13번 문장은 물이 몸이 영양소를 흡수하게(absorb) 돕고 소화 체계의 부담(workload)을 줄여 준다는 뜻이에요. insulin·coma·signal·portion은 이 두 빈칸에 넣으면 뜻이 통하지 않아요.","c":null},"h":"68c59c3cc8"}]},{"u":6,"id":"ch3-06-4","no":4,"ko":"수능:ON 글의 순서","items":[{"n":1,"t":"tf","q":"People who grow their own vegetables can eat fresh food without driving long distances to supermarkets.","ko":"자기만의 채소를 재배하는 사람들은 슈퍼마켓으로 먼 거리를 운전해 가지 않고도 신선한 식품을 먹을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"By growing their own vegetables, people can eat fresh, healthy food without driving long distances to supermarkets.","그들만의 채소를 재배함으로써, 사람들은 슈퍼마켓으로 먼 거리를 운전해 가지 않고도 신선하고 건강에 좋은 식품을 먹을 수 있다."]],"w":"11번 문장에서 직접 채소를 재배하면 슈퍼마켓까지 먼 거리를 운전하지 않고도 신선하고 건강에 좋은 식품을 먹을 수 있다고 해요. 본문과 맞아요.","c":"T"},"h":"2cbcb725a0"},{"n":2,"t":"tf","q":"Before Fare & Square opened, fewer than half of the city’s families had to travel long distances to buy food.","ko":"페어 앤드 스퀘어가 문을 열기 전에는, 그 도시 가정의 절반 미만이 식품을 사기 위해 먼 거리를 이동해야 했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Before Fare & Square opened, it was estimated that more than half of the city’s families had to travel long distances to purchase food.","페어 앤드 스퀘어가 문을 열기 전에는, 그 도시 가정의 절반 이상이 식품을 사기 위해 먼 거리를 이동해야만 했다고 추산되었다."]],"w":"7번 문장에서는 가정의 ‘절반 이상(more than half)’이 먼 거리를 이동해야 했다고 해요. ‘절반 미만(fewer than half)’은 본문과 달라요.","c":"F"},"h":"0ceb7d58c7"},{"n":3,"t":"tf","q":"The fight against food deserts is taking place only in Chester.","ko":"식품 사막에 대한 투쟁은 오직 체스터에서만 일어나고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The fight against food deserts is also taking place in another city.","식품 사막에 대한 투쟁은 또 다른 도시에서도 일어나고 있다."]],"w":"9번 문장에서 식품 사막에 대한 투쟁이 ‘또 다른 도시(another city)’에서도 일어나고 있다고 해요. ‘오직 체스터에서만’은 본문과 달라요.","c":"F"},"h":"9c800bc168"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…few affordable places for people to shop for food.)","ko":"(사람들이 식품을 살 …한 장소가 거의 없는 지역…)","opts":["알맞은 가격의","오래된","위험한","화려한"],"word":"affordable","r":{"a":"1) 알맞은 가격의","ev":"3번 문장","s":[[3,"This is an area where there are few affordable places for people to shop for food.","이곳은 사람들이 식품을 살 알맞은 장소가 거의 없는 지역이다."]],"w":"3번 문장은 식품 사막이 사람들이 식품을 살 수 있는 알맞은 장소가 거의 없는 지역이라는 말이에요. affordable은 ‘(가격이) 알맞은, 이용할 수 있는’이에요. 오래되거나 위험하거나 화려하다는 말은 본문에 없어요.","c":1},"h":"c39c8f91ad"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Ironically, in America, these food deserts are often found…)","ko":"(…, 미국에서 이 식품 사막은 종종 발견된다…)","opts":["다행히도","당연히","역설적이게도","갑자기"],"word":"Ironically","r":{"a":"3) 역설적이게도","ev":"4번 문장","s":[[4,"Ironically, in America, these food deserts are often found in the places where most of the nation’s food is grown.","역설적이게도, 미국에서 이 식품 사막은 전국 식품의 대부분이 재배되는 곳에서 종종 발견된다."]],"w":"4번 문장은 식품이 가장 많이 재배되는 곳에서 오히려 식품 사막이 발견된다는 뜻밖의 내용이에요. Ironically는 ‘역설적이게도’예요. ‘당연히’는 반대 느낌이에요.","c":3},"h":"0f2be08881"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nCalled Fare & Square, it is located in Chester, a small city in Pennsylvania…","ko":"밑줄 친 it이 가리키는 것은?","sko":"페어 앤드 스퀘어(Fare & Square) 라고 불리는 이것은 10년 이상 식료품점이 없었던 펜실베이니아의 작은 도시인 체스터에 위치하고 있다.","opts":["식품 사막","펜실베이니아","식료품점","정부 지원의 비영리 슈퍼마켓"],"r":{"a":"4) 정부 지원의 비영리 슈퍼마켓","ev":"5~6번 문장","s":[[5,"To deal with this situation, a government-supported nonprofit supermarket was created.","이 상황을 해결하기 위해, 정부 지원의 비영리 슈퍼마켓이 만들어졌다."],[6,"Called Fare & Square, it is located in Chester, a small city in Pennsylvania that hadn’t had a grocery store for more than ten years.","페어 앤드 스퀘어(Fare & Square) 라고 불리는 이것은 10년 이상 식료품점이 없었던 펜실베이니아의 작은 도시인 체스터에 위치하고 있다."]],"w":"6번 문장은 Fare & Square라고 불리는 it이 체스터에 위치한다는 말이에요. 앞의 5번 문장에서 만들어진 것은 정부 지원의 비영리 슈퍼마켓이므로 it은 그 슈퍼마켓이에요. 식품 사막은 문제 상황이고, 펜실베이니아는 위치 설명에 나오는 곳이에요.","c":4},"h":"7f4cbcdd7b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, all of the city’s residents now have easy access to the food they need.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나, 이제는 그 도시 주민 모두가 그들이 필요로 하는 식품을 쉽게 얻을 수 있다.","opts":["이제 그 도시에는 식품을 파는 곳이 하나도 없다.","그 도시의 주민 대부분은 여전히 먼 거리를 가야 식품을 살 수 있다.","이제 그 도시의 모든 주민이 필요한 식품을 쉽게 얻을 수 있다.","그 도시의 주민들은 식품이 필요하지 않게 되었다."],"r":{"a":"3) 이제 그 도시의 모든 주민이 필요한 식품을 쉽게 얻을 수 있다.","ev":"8번 문장","s":[[8,"However, all of the city’s residents now have easy access to the food they need.","그러나, 이제는 그 도시 주민 모두가 그들이 필요로 하는 식품을 쉽게 얻을 수 있다."]],"w":"8번 문장은 문을 연 뒤에는 도시 주민 모두가 필요한 식품을 쉽게 구할 수 있다는 뜻이에요. 7번의 문 열기 전 상황(먼 거리를 이동)과 대비되는 내용이에요.","c":3},"h":"ada9b5e11b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사막은 비가 많이 와서 많은 식물이 자라는 지역이다.","사막은 비가 거의 오지 않아 거의 아무것도 자라지 않는 지역이다.","사막은 큰 슈퍼마켓이 많은 곳이다.","사막은 펜실베이니아에 있는 작은 도시이다."],"opts":["A desert is an area with a lot of rain where many plants grow.","A desert is an area with little rain where almost nothing grows.","A desert is a place with many large supermarkets.","A desert is a small city in Pennsylvania."],"r":{"a":"2) A desert is an area with little rain where almost nothing grows. (사막은 비가 거의 오지 않아 거의 아무것도 자라지 않는 지역이다.)","ev":"1번 문장","s":[[1,"A desert is an area where there is little rain and almost nothing grows.","사막은 비가 거의 오지 않고 거의 아무것도 자라지 않는 곳이다."]],"w":"1번 문장에서 사막(desert)은 비가 거의 오지 않고 거의 아무것도 자라지 않는 지역이라고 해요. 나머지는 본문과 반대이거나 본문에 없는 내용이에요.","c":2},"h":"1f123970ec"},{"n":9,"t":"sum","q":"The One Seed Chicago Project gives people (A) so they can (B) their own small vegetable gardens.","ko":"원 시드 시카고 프로젝트는 사람들에게 (A)을(를) 줘서 그들이 자신만의 작은 채소 밭을 (B) 수 있게 한다.","oko":["(A) 씨앗 / (B) 팔","(A) 씨앗 / (B) 시작할","(A) 동전 / (B) 시작할","(A) 책 / (B) 나눌","(A) 자동차 / (B) 닫을"],"opts":["(A) seeds / (B) sell","(A) seeds / (B) start","(A) coins / (B) start","(A) books / (B) share","(A) cars / (B) close"],"r":{"a":"2) (A) seeds / (B) start ((A) 씨앗 / (B) 시작할)","ev":"10번 문장","s":[[10,"The One Seed Chicago Project helps people living in the city by giving them seeds so they can start their own small vegetable gardens.","원 시드 시카고 프로젝트는 그 도시에 살고 있는 사람들에게 그들만의 작은 채소밭을 시작할 수 있도록 씨앗을 나눠줌으로써 그들을 돕는다."]],"w":"10번 문장에서 원 시드 시카고 프로젝트는 사람들에게 씨앗(seeds)을 주어 작은 채소 밭을 시작(start)할 수 있게 도와요. coins·books·cars는 본문에 없고, sell·share·close는 뜻이 맞지 않아요.","c":2},"h":"c89b2e1237"},{"n":10,"t":"fill","q":"Although these two projects won’t [A] the problem of food deserts, they are the first [B] to assuring that all people can get healthy food no matter where they live.","ko":"이 두 프로젝트가 식품 사막 문제를 [A] 수는 없겠지만, 그것들은 모든 사람이 어디에 살든 건강한 식품을 얻도록 보장하는 첫 [B]이다.","bank":["solve","step","garden","city","travel","open"],"bko":{"solve":"해결하다","step":"단계, 걸음","garden":"정원, 밭","city":"도시","travel":"이동하다","open":"열다"},"r":{"a":"[A] solve (해결하다), [B] step (단계, 걸음)","ev":"12번 문장","s":[[12,"Although these two projects won’t solve the problem of food deserts, they are the first step to assuring that all people can get healthy food no matter where they live.","비록 이 두 프로젝트가 식품 사막 문제를 해결하지는 못하겠지만, 그것들은 그들이 어디에 살든지 간에, 모든 사람이 건강에 좋은 식품을 구할 수 있도록 보장하는 첫걸음이다."]],"w":"12번 문장은 두 프로젝트가 식품 사막 문제를 해결(solve)하지는 못하겠지만 그것을 향한 첫 단계(step)라는 뜻이에요. garden·city·travel·open은 빈칸에 넣으면 문장이 성립하지 않아요.","c":null},"h":"c7c97e5a3c"}]},{"u":7,"id":"ch3-07-1","no":1,"ko":"17년마다 나타나요","items":[{"n":1,"t":"tf","q":"All the cicada species mentioned in the passage have life cycles that fit the pattern of prime numbers.","ko":"이 글에 나온 모든 매미 종은 소수의 패턴에 들어맞는 생활 주기를 가진다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Incredibly, these cicada species all fit into the pattern of prime numbers.","놀랍게도, 이 매미 종들은 모두 소수(素數)의 패턴에 들어맞는다."]],"w":"3번에서 이 매미 종들이 모두 소수의 패턴에 들어맞는다고 해요(17년, 13년, 7년). 본문과 맞아요.","c":"T"},"h":"0efef80e20"},{"n":2,"t":"tf","q":"Basing their life cycles on prime numbers helps cicadas meet their predators more often.","ko":"생활 주기를 소수에 기반을 두는 것은 매미가 천적을 더 자주 만나게 해 준다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"This allows cicadas to avoid encountering predators for long periods of time.","이것은 매미들이 오랜 기간 동안 포식자들을 마주치지 않게 해준다."]],"w":"8번에서 소수 주기는 매미가 오랜 기간 동안 포식자를 마주치지 않게 해 준다고 해요. ‘더 자주 만난다’는 반대예요.","c":"F"},"h":"e284577edc"},{"n":3,"t":"tf","q":"If a cicada’s life cycle is 17 years and its predator’s is 3 years, they meet every 17 years.","ko":"만약 매미의 생활 주기가 17년이고 천적의 주기가 3년이라면, 그들은 17년마다 만난다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"For instance, if the cycle of the cicada is 17 years and that of a natural predator is 3 years, they can only meet once every 51 years.","예를 들어, 만약 매미의 주기가 17년이고 천적의 주기가 3년이라면, 그들은 51년마다 오직 한 번만 만날 수 있다."]],"w":"9번에서 그들은 51년마다 오직 한 번만 만날 수 있다고 해요. 17년마다가 아니에요.","c":"F"},"h":"fcfb230e3c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the area is invaded by billions of insects known as “17-year cicadas.”)","ko":"(…그 지역은 ‘17년 매미’로 알려진 곤충 수십억 마리에 의해 …)","opts":["보호받는","버려지는","침입을 받는","청소되는"],"word":"invaded","r":{"a":"3) 침입을 받는","ev":"1번 문장","s":[[1,"Every 17 years in the eastern United States, an amazing natural phenomenon occurs—the area is invaded by billions of insects known as “17-year cicadas.”","미국 동부에서는 17년마다 놀라운 자연 현상이 발생한다. 그 지역은 ‘17년 매미’로 알려진 곤충 수십억 마리에 의해 침입을 받는다."]],"w":"1번은 17년마다 곤충(매미) 수십억 마리가 그 지역에 몰려든다는 내용이에요. 그래서 is invaded는 ‘침입을 받는다’예요(invade 침입하다). 보호받거나 청소되는 상황이 아니에요.","c":3},"h":"919f580edb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, why do cicadas appear all at once at prime-numbered intervals?)","ko":"(그렇다면, 매미들은 왜 소수 …으로 한꺼번에 나타나는 걸까?)","opts":["간격","크기","속도","장소"],"word":"intervals","r":{"a":"1) 간격","ev":"4번 문장","s":[[4,"So, why do cicadas appear all at once at prime-numbered intervals?","그렇다면, 매미들은 왜 소수 간격으로 한꺼번에 나타나는 걸까?"]],"w":"4번은 매미가 17년, 13년, 7년처럼 일정한 해 간격으로 한꺼번에 나타나는 이유를 묻는 질문이에요. interval = 간격(일이 반복되는 사이의 시간)이에요.","c":1},"h":"ffa0ec2803"},{"n":6,"t":"ref","q":"What does the underlined \"those\" refer to?\nAlso, by basing their life cycles on prime numbers, they ensure that their life cycles are different from those of their natural predators.","ko":"밑줄 친 those가 가리키는 것은?","sko":"또한 그들의 생활 주기를 소수에 기반을 둠으로써, 그들은 자신들의 생활 주기가 천적의 생활 주기와 다르도록 보장한다.","opts":["소수 (prime numbers)","생활 주기 (life cycles)","천적들 (natural predators)","매미들 (cicadas)"],"r":{"a":"2) 생활 주기 (life cycles)","ev":"7번 문장","s":[[7,"Also, by basing their life cycles on prime numbers, they ensure that their life cycles are different from those of their natural predators.","또한 그들의 생활 주기를 소수에 기반을 둠으로써, 그들은 자신들의 생활 주기가 천적의 생활 주기와 다르도록 보장한다."]],"w":"those는 앞에서 이미 나온 복수 명사를 다시 쓰지 않으려고 대신하는 말이에요. 7번은 매미의 life cycles가 천적의 life cycles와 다르다는 비교라서 those = life cycles예요. 천적들 자체와 비교하는 것이 아니에요.","c":2},"h":"5a43630996"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"First, with the calculation that their natural predators cannot eat billions of cicadas at once, cicadas appear all at the same time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"첫째로, 그들의 천적이 한꺼번에 수십억 마리의 매미를 먹을 수 없다는 계산하에, 매미들은 모두 동시에 나타난다.","opts":["매미들은 천적이 먹기 좋도록 한 마리씩 따로 나타난다.","매미들은 천적이 수십억 마리를 먹을 수 있다고 계산해서 동시에 나타난다.","매미들은 천적이 나타나는 때를 계산하여 그 뒤에 나타난다.","매미들은 천적이 한꺼번에 다 먹을 수 없을 만큼 많은 수가 동시에 나타난다."],"r":{"a":"4) 매미들은 천적이 한꺼번에 다 먹을 수 없을 만큼 많은 수가 동시에 나타난다.","ev":"6번 문장","s":[[6,"First, with the calculation that their natural predators cannot eat billions of cicadas at once, cicadas appear all at the same time.","첫째로, 그들의 천적이 한꺼번에 수십억 마리의 매미를 먹을 수 없다는 계산하에, 매미들은 모두 동시에 나타난다."]],"w":"6번은 ‘천적이 수십억 마리를 한꺼번에 먹을 수 없다’는 계산 아래 매미들이 동시에 나타난다는 뜻이에요. 한 마리씩 따로 나타나거나 천적이 다 먹을 수 있다는 것은 반대예요.","c":4},"h":"dad4d1e8e0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["17년 주기의 매미는 미국 남부에 나타난다.","미국 동부의 매미는 13년과 7년 주기를 가진다.","13년과 7년 주기의 매미는 미국의 남부에서 발견된다.","미국에서는 한 종류의 매미만 발견된다."],"opts":["Cicadas with a 17-year life cycle appear in the southern part of the United States.","Cicadas in the eastern United States have 13-year and 7-year life cycles.","Cicadas with 13-year and 7-year life cycles are found in the southern part of the United States.","Only one kind of cicada is found in the United States."],"r":{"a":"3) Cicadas with 13-year and 7-year life cycles are found in the southern part of the United States.","ev":"1~2번 문장","s":[[1,"Every 17 years in the eastern United States, an amazing natural phenomenon occurs—the area is invaded by billions of insects known as “17-year cicadas.”","미국 동부에서는 17년마다 놀라운 자연 현상이 발생한다. 그 지역은 ‘17년 매미’로 알려진 곤충 수십억 마리에 의해 침입을 받는다."],[2,"A similar occurrence can be witnessed in the southern part of the country, where “13-year cicadas” and “7-year cicadas” are found.","비슷한 사건이 이 나라의 남부에서도 목격되는데, 그곳에서는 ‘13년 매미’와 ‘7년 매미’가 발견된다."]],"w":"2번에서 남부에서는 13년 매미와 7년 매미가 발견된다고 해요. 17년 매미는 1번의 동부에 나타나므로 동부와 남부의 매미는 서로 달라요. 미국에는 여러 종류가 있어요.","c":3},"h":"6c95a29e78"},{"n":9,"t":"sum","q":"Cicadas appear all at once in life cycles based on prime numbers, which helps them (A) their natural predators and so (B) their species.","ko":"매미는 소수에 기반을 둔 생활 주기로 한꺼번에 나타나는데, 이는 매미가 천적을 (A) 그렇게 해서 자신의 종족을 (B) 데 도움이 된다.","oko":["(A) 끌어들이다 / (B) 해치다","(A) 피하다 / (B) 바꾸다","(A) 먹이다 / (B) 잃다","(A) 만나다 / (B) 보존하다","(A) 피하다 / (B) 보존하다"],"opts":["(A) attract / (B) harm","(A) avoid / (B) change","(A) feed / (B) lose","(A) meet / (B) preserve","(A) avoid / (B) preserve"],"r":{"a":"5) (A) avoid / (B) preserve","ev":"5번, 7번, 8번 문장","s":[[5,"This is actually the cicada’s way of preserving its own species.","이것은 사실 자신의 종족을 보존하는 매미의 방식이다."],[7,"Also, by basing their life cycles on prime numbers, they ensure that their life cycles are different from those of their natural predators.","또한 그들의 생활 주기를 소수에 기반을 둠으로써, 그들은 자신들의 생활 주기가 천적의 생활 주기와 다르도록 보장한다."],[8,"This allows cicadas to avoid encountering predators for long periods of time.","이것은 매미들이 오랜 기간 동안 포식자들을 마주치지 않게 해준다."]],"w":"5번에서 이것은 종족을 보존하는 매미의 방식이라고 하고, 7~8번에서 소수 주기가 천적과 주기를 달리해 마주치지 않게 해 준다고 해요. 그래서 (A)는 avoid(피하다), (B)는 preserve(보존하다)예요.","c":5},"h":"6e93628501"},{"n":10,"t":"fill","q":"The sound of billions of cicadas singing at once reminds some people of a [A] movie, but people in some parts of North America feel [B] because they won’t have to hear them again for another 17 years.","ko":"동시에 울어대는 수십억 마리의 매미 소리는 일부 사람들에게 [A] 영화를 연상시키지만, 북미의 일부 지역 사람들은 17년 동안 매미 소리를 다시 듣지 않아도 되므로 마음이 [B] 기분이다.","bank":["horror","comforted","species","interval","cycle","calculation"],"bko":{"horror":"공포","comforted":"위안을 받은","species":"종(種)","interval":"간격","cycle":"주기","calculation":"계산"},"r":{"a":"[A] horror, [B] comforted","ev":"10~11번 문장","s":[[10,"The sound of billions of cicadas singing at once reminds some people of a horror movie.","동시에 울어대는 수십억 마리의 매미 소리는 일부 사람들에게 공포 영화를 연상시킨다."],[11,"But in some parts of North America, people are comforted by the fact that they won’t have to hear them again for another 17 years.","하지만 북미의 일부 지역에서, 사람들은 그들이 17년 동안 매미 소리를 다시 듣지 않아도 될 거라는 사실에 위안을 받는다."]],"w":"10번에서 매미 소리가 공포 영화(a horror movie)를 연상시킨다고 하고, 11번에서 17년 동안 다시 듣지 않아도 되어 위안을 받는다(comforted)고 해요. 나머지 단어는 ‘~ movie’나 ‘feel ~’ 자리에 맞지 않아요.","c":null},"h":"2fd2d2441f"}]},{"u":7,"id":"ch3-07-2","no":2,"ko":"고양이 혀의 비밀","items":[{"n":1,"t":"tf","q":"Genetic influences on taste might have played an important role in food selection in both humans and animals.","ko":"맛에 미치는 유전적 영향은 인간과 동물 모두의 먹이 선택에서 중요한 역할을 했을지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In the process of evolution, genetic influences on taste might have played an important role in food selection and nutrition in both humans and animals.","진화의 과정에서, 미각에 미치는 유전적인 영향은 인간과 동물 모두에게 먹이 선택과 영양에 있어 중요한 역할을 했을지도 모른다."]],"w":"5번에서 맛에 대한 유전적 영향이 인간과 동물 모두에게 먹이 선택과 영양에 중요한 역할을 했을지도 모른다고 해요(might have played). 본문과 맞아요.","c":"T"},"h":"58283d56b0"},{"n":2,"t":"tf","q":"The brains of mammals receive taste signals directly from the stomach.","ko":"포유류의 뇌는 위에서 직접 미각 신호를 받는다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The brains of all mammals receive taste signals from the tongue’s receptor cells.","모든 포유류의 뇌는 혀에 있는 수용기 세포로부터 미각 신호를 받는다."]],"w":"6번에서 뇌는 혀(tongue)의 수용기 세포로부터 미각 신호를 받는다고 해요. 위에서 받는다는 것은 본문과 달라요.","c":"F"},"h":"2104944fc1"},{"n":3,"t":"tf","q":"There is still no proof that cats prefer meat because they cannot taste sweet foods.","ko":"고양이가 단 음식의 맛을 느끼지 못해서 육식을 더 좋아한다는 증거는 아직 없다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"Now there’s proof!","이제 증거가 있다!"],[3,"According to a study, cats lack a key taste receptor gene that is needed to detect sweet stimuli.","한 연구에 의하면, 고양이에게는 단맛의 자극을 감지하는 데 필요한 핵심적인 미각 수용기 유전자가 없다."]],"w":"2번에서 Now there’s proof!라고 하고, 3번에서 연구에 따르면 고양이에게 단맛을 감지하는 유전자가 없다고 해요. 증거가 이미 나왔으므로 ‘아직 없다’는 틀려요.","c":"F"},"h":"31c2cb81a1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…steering them toward a diet rich in protein and fat rather than carbohydrates.)","ko":"(…고양이를 탄수화물보다는 단백질과 지방이 풍부한 식단 쪽으로 …)","opts":["막는","이끄는","잊는","줄이는"],"word":"steering","r":{"a":"2) 이끄는","ev":"4번 문장","s":[[4,"This missing gene is likely responsible for the evolution of cats’ carnivorous behavior, steering them toward a diet rich in protein and fat rather than carbohydrates.","이 빠진 유전자가 고양이의 육식 습성의 진화의 원인이 되어 탄수화물보다는 단백질과 지방이 풍부한 식단으로 유도했을 가능성이 높다."]],"w":"4번은 빠진 유전자가 육식 습성 진화의 원인이고, 고양이를 단백질과 지방이 풍부한 식단 쪽으로 이끌었다는 말이에요. steer = 이끌다, 몰다. 막거나 줄이는 방향이 아니에요.","c":2},"h":"c919640252"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…50 to 100 receptor cells that represent the five major tastes…)","ko":"(…다섯 가지 주요한 맛을 …하는 50개에서 100개의 수용기 세포…)","opts":["숨기는","제한하는","바꾸는","대표하는"],"word":"represent","r":{"a":"4) 대표하는","ev":"8번 문장","s":[[8,"In humans, each taste bud is made up of 50 to 100 receptor cells that represent the five major tastes: salty, sour, sweet, bitter and umami.","인간의 경우, 각각의 미뢰는 짠맛, 신맛, 단맛, 쓴맛 그리고 감칠맛의 다섯 가지 주요한 맛을 대표하는 50개에서 100개의 수용기 세포로 구성되어 있다."]],"w":"8번은 미뢰 하나가 50~100개의 수용기 세포로 이루어져 있고, 이 세포들이 짠맛·신맛·단맛·쓴맛·감칠맛 다섯 가지 주요한 맛을 나타낸다는 뜻이에요. represent = 대표하다, 나타내다.","c":4},"h":"bb75096c91"},{"n":6,"t":"ref","q":"What does the underlined \"These cells\" refer to?\nThese cells are joined together to form taste buds.","ko":"밑줄 친 These cells가 가리키는 것은?","sko":"이 세포들이 함께 모여서 미뢰를 구성한다.","opts":["수용기 세포 (receptor cells)","뇌의 신경 세포 (nerve cells)","단맛 유전자 (the gene)","미뢰 (taste buds)"],"r":{"a":"1) 혀의 수용기 세포 (receptor cells)","ev":"6~7번 문장","s":[[6,"The brains of all mammals receive taste signals from the tongue’s receptor cells.","모든 포유류의 뇌는 혀에 있는 수용기 세포로부터 미각 신호를 받는다."],[7,"These cells are joined together to form taste buds.","이 세포들이 함께 모여서 미뢰를 구성한다."]],"w":"These cells는 바로 앞 6번의 the tongue’s receptor cells(혀의 수용기 세포)를 가리켜요. 이 세포들이 모여 미뢰를 이루는 것이므로 미뢰는 결과이고 These cells가 아니에요. 뇌는 6번에서 신호를 ‘받는’ 쪽이에요.","c":1},"h":"d92ffbe813"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"According to a study, cats lack a key taste receptor gene that is needed to detect sweet stimuli.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"한 연구에 의하면, 고양이에게는 단맛의 자극을 감지하는 데 필요한 핵심적인 미각 수용기 유전자가 없다.","opts":["한 연구에 따르면, 고양이는 단맛을 느끼기 위해 필요한 유전자를 너무 많이 가지고 있다.","한 연구에 따르면, 고양이는 단맛을 감지하는 유전자가 있어서 단 음식을 좋아한다.","한 연구에 따르면, 고양이는 단맛 자극을 감지하는 데 필요한 핵심 유전자가 없다.","한 연구에 따르면, 고양이는 단맛 대신 쓴맛을 감지하는 데 필요한 유전자가 없다."],"r":{"a":"3) 한 연구에 따르면, 고양이는 단맛 자극을 감지하는 데 필요한 핵심 유전자가 없다.","ev":"3번 문장","s":[[3,"According to a study, cats lack a key taste receptor gene that is needed to detect sweet stimuli.","한 연구에 의하면, 고양이에게는 단맛의 자극을 감지하는 데 필요한 핵심적인 미각 수용기 유전자가 없다."]],"w":"3번은 연구에 따르면 고양이에게 단맛 자극을 감지하는 데 필요한 핵심 미각 수용기 유전자가 ‘없다’는 뜻이에요(lack = ~이 없다). ‘너무 많다’, ‘있다’는 반대이고, ‘쓴맛’은 본문과 달라요.","c":3},"h":"31f6d5aa2e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고양이는 단 음식의 맛을 느끼지 못하는 유일한 동물이다.","집 고양이는 단 음식의 맛을 느낄 수 있다는 점에서 사자, 호랑이, 표범과 다르다.","고양이는 단 음식의 맛을 좋아하기 때문에 고기를 더 좋아한다.","사자, 호랑이, 표범처럼 고양이도 단 음식의 맛을 느끼지 못하기 때문에 육식을 좋아한다고 오랫동안 짐작되어 왔다."],"opts":["Cats are the only animals that cannot taste sweet foods.","Domestic cats are different from lions, tigers, and leopards in that they can taste sweet foods.","Cats prefer meat because they like the taste of sweet foods.","It has long been suspected that cats, like lions, tigers, and leopards, prefer meat because they cannot taste sweet foods."],"r":{"a":"4) It has long been suspected that cats, like lions, tigers, and leopards, prefer meat because they cannot taste sweet foods.","ev":"1번 문장","s":[[1,"It has long been suspected that domestic cats, along with lions, tigers, and leopards, prefer eating meat because they cannot taste sweet foods.","사자, 호랑이, 표범과 마찬가지로, 집 고양이는 단 음식의 맛을 느끼지 못하기 때문에 육식을 더 좋아하는 것이라고 오랫동안 여겨져 왔다."]],"w":"1번에서 집 고양이는 사자, 호랑이, 표범과 마찬가지로 단 음식의 맛을 느끼지 못해서 육식을 더 좋아한다고 오랫동안 짐작되어 왔다고 해요. 고양이만 그런 것이 아니고, 단맛을 좋아해서 고기를 먹는 것도 아니에요.","c":4},"h":"2b1059bb5f"},{"n":9,"t":"sum","q":"The missing taste gene is likely responsible for the (A) of cats’ (B) behavior.","ko":"빠져 있는 미각 유전자는 고양이의 (B) 행동의 (A)에 책임이 있을 가능성이 높다.","oko":["(A) 진화 / (B) 육식성의","(A) 진화 / (B) 졸린","(A) 죽음 / (B) 육식성의","(A) 비용 / (B) 상냥한","(A) 모양 / (B) 화려한"],"opts":["(A) evolution / (B) carnivorous","(A) evolution / (B) sleepy","(A) death / (B) carnivorous","(A) cost / (B) friendly","(A) shape / (B) colorful"],"r":{"a":"1) (A) evolution / (B) carnivorous ((A) 진화 / (B) 육식성의)","ev":"4번 문장","s":[[4,"This missing gene is likely responsible for the evolution of cats’ carnivorous behavior, steering them toward a diet rich in protein and fat rather than carbohydrates.","이 빠진 유전자가 고양이의 육식 습성의 진화의 원인이 되어 탄수화물보다는 단백질과 지방이 풍부한 식단으로 유도했을 가능성이 높다."]],"w":"4번 문장에서 이 빠진 유전자가 고양이의 육식성(carnivorous) 행동이 진화(evolution)한 데 책임이 있을 가능성이 높다고 해요. death·cost·shape와 sleepy·friendly·colorful은 본문에 없어요.","c":1},"h":"e7003769ba"},{"n":10,"t":"fill","q":"Ancient cats that lacked sweetness taste buds had a higher [A] rate than other cats, and over time, these meat-eating cats [B] while others died out.","ko":"단맛 미뢰가 없던 고대 고양이들은 다른 고양이들보다 [A]율이 더 높았고, 시간이 지나면서 다른 고양이들이 멸종한 반면 이 육식 고양이들은 [B].","bank":["survival","remained","gene","mammal","bud","cell"],"bko":{"survival":"생존","remained":"살아남았다","gene":"유전자","mammal":"포유류","bud":"미뢰","cell":"세포"},"r":{"a":"[A] survival, [B] remained","ev":"9~10번 문장","s":[[9,"Scientists believe that, for some reason, ancient cats that lacked sweetness taste buds had a higher survival rate than other cats.","과학자들은 어떤 이유에서인지 단맛 미뢰가 없는 고대의 고양이들이 다른 고양이들보다 더 높은 생존율을 보였다고 믿는다."],[10,"Over time, these meat-eating cats remained while others died out.","시간이 지나면서, 다른 고양이들은 멸종된 반면에, 이 육식 고양이들은 살아남았다."]],"w":"9번에서 단맛 미뢰가 없던 고대 고양이들의 생존율(survival rate)이 더 높았다고 하고, 10번에서 이 육식 고양이들은 살아남았다(remained)고 해요. 나머지 단어는 ‘higher ~ rate’나 동사 자리에 맞지 않아요.","c":null},"h":"81605e354d"}]},{"u":7,"id":"ch3-07-3","no":3,"ko":"동굴로 향하는 코끼리","items":[{"n":1,"t":"tf","q":"Elephants go to the caves of Mount Elgon because salt-rich rocks are plentiful there.","ko":"엘곤 산의 동굴에는 소금이 풍부한 암석이 많아서 코끼리들이 그곳에 간다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Thus, they undertake an expedition with their family groups to the caves of Mount Elgon, where salt-rich rocks are plentiful.","그래서 그들은 가족과 함께 엘곤 산의 동굴로 탐험을 떠나는데, 그곳에는 소금이 풍부한 암석이 많다."]],"w":"5번에서 코끼리들은 소금이 풍부한 암석이 많은 엘곤 산의 동굴로 탐험을 떠난다고 해요. 본문과 맞아요.","c":"T"},"h":"5d3b5216cc"},{"n":2,"t":"tf","q":"The first explorers of the site realized that elephants had made the markings in the caves.","ko":"이 장소의 최초 탐험가들은 동굴의 자국을 코끼리가 만들었다는 것을 알아차렸다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"The first explorers of the site believed these markings to be signs of ancient Egyptian mining activity, but wildlife specialists observing the caves discovered that it was not humans who made these marks but elephants, which continue to visit the caves!","이 장소의 최초 탐험가들은 이 자국들을 고대 이집트의 채굴 활동의 흔적이라 생각했지만, 동굴을 관찰하던 야생동물 전문가들은 이 자국들을 만든 것이 인간이 아니라, 그 동굴을 계속해서 방문하는 코끼리들이라는 것을 밝혀냈다!"]],"w":"2번에서 최초 탐험가들은 이 자국이 고대 이집트의 채굴 흔적이라고 믿었어요. 코끼리가 만든 것임을 밝힌 쪽은 나중에 동굴을 관찰한 야생동물 전문가들이에요.","c":"F"},"h":"9c92aa5555"},{"n":3,"t":"tf","q":"On the way to the caves, elephants face no danger from other animals.","ko":"동굴로 가는 길에 코끼리들은 다른 동물로부터 아무런 위험도 겪지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The elephants’ journey is especially unusual because of the danger involved, including the risk of predation by animals like hyenas and leopards along the way.","코끼리들의 여정은 여정 동안 하이에나나 표범과 같은 동물에게 잡아 먹힐 위험을 포함하여 수반되는 위험 때문에 특히 이례적이다."]],"w":"7번에서 가는 길에 하이에나나 표범 같은 동물에게 잡아 먹힐 위험이 있다고 해요. ‘위험이 없다’는 반대예요.","c":"F"},"h":"d1f0f7b105"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the herds near Mount Elgon reside in the rainforest and have an abundant food supply…)","ko":"(…엘곤 산 근처의 무리들은 열대우림에 살며 …한 식량 공급량을 가지고 있다…)","opts":["부족한","풍부한","위험한","불규칙한"],"word":"abundant","r":{"a":"2) 풍부한","ev":"3번 문장","s":[[3,"While most elephants inhabit the plains of Africa, the herds near Mount Elgon reside in the rainforest and have an abundant food supply thanks to the humid climate.","대부분의 코끼리는 아프리카의 평원에 서식하는 반면, 엘곤 산 근처의 무리들은 열대우림에 살며, 습한 기후 덕분에 식량 공급량이 풍부하다."]],"w":"3번은 습한 기후 덕분에 열대우림의 코끼리 무리가 abundant food supply를 가진다고 해요. 4번의 However에서 소금만 부족해지는 반전이 생기므로, 먹이는 풍부하다는 뜻이에요(abundant = 풍부한).","c":2},"h":"6bcf2ca3c9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…chip off rough chunks of the cave wall, which they subsequently eat.)","ko":"(…동굴 벽의 거친 …을 깨고, 그것을 그 후에 먹는다.)","opts":["가루","그림","물방울","덩어리"],"word":"chunks","r":{"a":"4) 덩어리","ev":"6번 문장","s":[[6,"Occasionally, they must go as far as 150 meters into the dark caves to find salt, and then they use their tusks to chip off rough chunks of the cave wall, which they subsequently eat.","때때로, 코끼리들은 소금을 찾기 위해 어두운 동굴 안으로 150미터만큼 멀리 들어가야 하고, 이후 그들은 동굴 벽의 거친 조각을 깨기 위해 자신의 상아를 사용하며, 이후 그것들을 먹는다."]],"w":"6번에서 코끼리는 상아로 동굴 벽에서 거친 chunks를 깨어 내어 먹어요. 상아로 깨어 낸 것이므로 chunk = 덩어리(큰 조각)예요.","c":4},"h":"c1230cbbe9"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nIn addition, the caves are littered with substantial cracks and holes that the elephants could fall into due to the complete darkness.","ko":"밑줄 친 that이 가리키는 것은?","sko":"게다가 완전한 어두움으로 인해 동굴 안은 코끼리들이 빠질 수 있는 큰 균열과 구멍이 여기저기 나 있다.","opts":["큰 균열과 구멍 (cracks and holes)","코끼리들 (the elephants)","동굴 (the caves)","완전한 어둠 (the complete darkness)"],"r":{"a":"1) 큰 균열과 구멍 (cracks and holes)","ev":"8번 문장","s":[[8,"In addition, the caves are littered with substantial cracks and holes that the elephants could fall into due to the complete darkness.","게다가 완전한 어두움으로 인해 동굴 안은 코끼리들이 빠질 수 있는 큰 균열과 구멍이 여기저기 나 있다."]],"w":"that은 관계대명사로, 앞의 cracks and holes를 꾸며 줘요. ‘코끼리들이 빠질 수 있는 균열과 구멍’이라는 뜻이라 that = cracks and holes예요. elephants는 that절의 주어로 따로 나와요.","c":1},"h":"579c86c49a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, heavy rainfall washes away the salt from the plants and soil they eat, resulting in a lack of the necessary amount of salt in their diets.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 폭우는 그들이 먹는 식물과 토양에서 소금을 씻어내는데, 그 결과 그들의 식단에 필요한 소금의 양이 부족해진다.","opts":["폭우 때문에 식물이 자라지 못해서 코끼리들이 먹을 것이 없다.","코끼리들이 소금을 너무 많이 먹어서 병에 걸린다.","폭우가 코끼리가 먹는 식물과 토양에서 소금을 씻어 내서 식단에 필요한 소금이 부족해진다.","폭우가 동굴 속 암석에서 소금을 씻어 내서 코끼리들이 동굴에 갈 수 없다."],"r":{"a":"3) 폭우가 코끼리가 먹는 식물과 토양에서 소금을 씻어 내서 식단에 필요한 소금이 부족해진다.","ev":"4번 문장","s":[[4,"However, heavy rainfall washes away the salt from the plants and soil they eat, resulting in a lack of the necessary amount of salt in their diets.","하지만 폭우는 그들이 먹는 식물과 토양에서 소금을 씻어내는데, 그 결과 그들의 식단에 필요한 소금의 양이 부족해진다."]],"w":"4번은 폭우가 식물과 토양의 소금을 씻어 내고, 그 결과 코끼리의 식단에 필요한 소금이 부족해진다는 뜻이에요. 식량 자체가 없는 것(3번에서는 풍부하다고 함)도, 소금을 너무 많이 먹는 것도, 동굴의 소금이 씻겨 나가는 것도 아니에요.","c":3},"h":"ec3e34d038"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["엘곤 산은 이집트와 우간다 사이에 있다.","동굴의 구멍은 고대 광부들이 곡괭이로 만든 것이다.","엘곤 산 기슭의 동굴에는 곡괭이로 만든 것처럼 보이는 구멍이 있는 긴 고랑이 있다.","그 동굴들은 구멍이나 고랑이 전혀 없어서 유명하다."],"opts":["Mount Elgon is located between Egypt and Uganda.","The holes in the caves were made by ancient miners with picks.","The caves at the base of Mount Elgon have long furrows with holes that look like they were made by picks.","The caves are famous because they contain no holes or furrows."],"r":{"a":"3) The caves at the base of Mount Elgon have long furrows with holes that look like they were made by picks.","ev":"1번 문장","s":[[1,"The base of Mount Elgon, which borders Uganda and Kenya, is home to a series of caves that have captivated the world due to their long furrows with holes that look like they were made by picks.","우간다와 케냐의 국경을 접하는 엘곤 산 기슭은, 마치 곡괭이로 만든 것처럼 보이는 구멍이 있는 긴 고랑들 때문에 전 세계의 마음을 사로잡은 일련의 동굴들의 터전이다."]],"w":"1번에서 엘곤 산은 우간다와 케냐의 국경에 접해 있고, 그 기슭의 동굴에는 곡괭이로 만든 것처럼 ‘보이는’ 구멍이 있는 긴 고랑이 있다고 해요. 실제로 구멍을 만든 것은 광부가 아니라 코끼리예요(2번).","c":3},"h":"b9e92c60d2"},{"n":9,"t":"sum","q":"Elephants travel to the caves with their (A) groups and use their (B) to break off pieces of the cave wall.","ko":"코끼리들은 (A) 무리와 함께 동굴로 가서 (B)(으)로 동굴 벽의 조각을 떼어 낸다.","oko":["(A) 가족 / (B) 코","(A) 사냥 / (B) 상아","(A) 가족 / (B) 상아","(A) 학교 / (B) 발","(A) 친구 / (B) 눈"],"opts":["(A) family / (B) trunks","(A) hunting / (B) tusks","(A) family / (B) tusks","(A) school / (B) feet","(A) friend / (B) eyes"],"r":{"a":"3) (A) family / (B) tusks ((A) 가족 / (B) 상아)","ev":"5~6번 문장","s":[[5,"Thus, they undertake an expedition with their family groups to the caves of Mount Elgon, where salt-rich rocks are plentiful.","그래서 그들은 가족과 함께 엘곤 산의 동굴로 탐험을 떠나는데, 그곳에는 소금이 풍부한 암석이 많다."],[6,"Occasionally, they must go as far as 150 meters into the dark caves to find salt, and then they use their tusks to chip off rough chunks of the cave wall, which they subsequently eat.","때때로, 코끼리들은 소금을 찾기 위해 어두운 동굴 안으로 150미터만큼 멀리 들어가야 하고, 이후 그들은 동굴 벽의 거친 조각을 깨기 위해 자신의 상아를 사용하며, 이후 그것들을 먹는다."]],"w":"5번 문장에서 코끼리들은 가족 무리(family groups)와 함께 동굴로 가고, 6번 문장에서 상아(tusks)로 동굴 벽의 거친 덩어리를 떼어 낸다고 해요. 코(trunks)나 발·눈을 쓴다는 말은 없어요.","c":3},"h":"85fbc70374"},{"n":10,"t":"fill","q":"In spite of the many dangers, the elephants [A] in their [B] for the sake of supplementing their diets!","ko":"많은 위험에도 불구하고, 코끼리들은 식단을 보충하기 위해서 그들의 [B]을(를) [A].","bank":["persist","venture","reside","holes","meters","darkness"],"bko":{"persist":"계속하다","venture":"모험(어려운 일)","reside":"거주하다","holes":"구멍들","meters":"미터","darkness":"어둠"},"r":{"a":"[A] persist (계속하다), [B] venture (모험(어려운 일))","ev":"9번 문장","s":[[9,"In spite of the many dangers, the elephants persist in their venture for the sake of supplementing their diets!","많은 위험에도 불구하고, 코끼리들은 그들의 식단을 보충하기 위해서 그들의 여정을 계속한다!"]],"w":"9번 문장은 많은 위험에도 코끼리들이 식단을 보충하려고 그 모험(venture)을 계속한다(persist)는 뜻이에요. reside·holes·meters·darkness는 빈칸에 넣으면 뜻이 이어지지 않아요.","c":null},"h":"855ba158f6"}]},{"u":7,"id":"ch3-07-4","no":4,"ko":"수능:ON 문장 삽입","items":[{"n":1,"t":"tf","q":"The dolphins work together to gather the sardines into a round group.","ko":"돌고래들은 정어리들을 둥근 무리로 모으기 위해 협력한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"They team up to collect the sardines into a round group, called a “bait ball.”","그들은 정어리들을 둥근 형태의 무리로 모으기 위해 협력하는데, 이것은 ‘미끼 덩어리’라고 불린다."]],"w":"7번에서 돌고래들이 정어리를 둥근 무리인 ‘미끼 덩어리’로 모으려고 협력한다(team up)고 해요. 본문과 맞아요.","c":"T"},"h":"049391aaa4"},{"n":2,"t":"tf","q":"The sardines swim along the coast of South Africa in winter.","ko":"정어리들은 겨울에 남아프리카 공화국의 해안을 따라 헤엄친다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Every summer millions of little sardines swim along the coast of South Africa in a giant group.","매년 여름 수백만 마리의 작은 정어리들이 남아프리카 공화국의 해안을 따라 큰 무리를 지어 헤엄친다."]],"w":"1번에서 정어리들은 매년 여름(Every summer)에 해안을 따라 헤엄친다고 해요. 겨울이 아니에요.","c":"F"},"h":"86c704cbec"},{"n":3,"t":"tf","q":"Birds stay away from the water when the dolphins push the sardines up.","ko":"돌고래들이 정어리들을 위로 몰고 갈 때 새들은 물에서 멀리 떨어져 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"And when the dolphins push the sardines to the top of the water, flocks of birds waiting to catch them can take advantage of the sudden opportunity.","그리고 돌고래들이 정어리들을 수면 위로 몰고 갔을 때, 정어리를 잡기 위해 기다리던 새 떼는 이 갑작스러운 기회를 이용할 수 있다."],[10,"Thousands of birds soar and dive into the water, creating another spectacle.","수천 마리의 새들이 날아올랐다가 물속으로 다이빙하고, 이것은 또 다른 장관을 만들어낸다."]],"w":"9번과 10번에서 돌고래가 정어리를 수면으로 몰면 새 떼가 기회를 이용해 수천 마리가 날아올랐다가 물속으로 다이빙한다고 해요. 물에서 멀리 떨어져 있는 것이 아니에요.","c":"F"},"h":"c81b7abd53"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Once the sardines are rounded up, it is easy for the dolphins to snatch them.)","ko":"(일단 정어리들이 둥글게 모이면, 돌고래들이 그것들을 …기는 쉽다.)","opts":["놓아주기","낚아채기","세어 보기","길러 내기"],"word":"snatch","r":{"a":"2) 낚아채기","ev":"8번 문장","s":[[8,"Once the sardines are rounded up, it is easy for the dolphins to snatch them.","일단 정어리들이 둥글게 모이면, 돌고래들이 그것들을 낚아채기는 쉽다."]],"w":"8번은 정어리들이 둥글게 모이고 나면 돌고래가 정어리를 잡기 쉽다는 뜻이에요. snatch = 낚아채다, 와락 붙잡다. 놓아주거나 기르는 상황이 아니에요.","c":2},"h":"6eb5015624"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They travel in an enormous group that can be miles in length…)","ko":"(그들은 길이로는 수 마일에 달할 수 있는 …한 떼를 이루어 이동한다.)","opts":["거대한","사소한","조용한","투명한"],"word":"enormous","r":{"a":"1) 거대한","ev":"4번 문장","s":[[4,"They travel in an enormous group that can be miles in length, up to a mile in width, and over thirty meters deep.","그들은 길이로는 수 마일, 폭으로는 최대 1마일, 그리고 30미터 이상의 깊이에 달할 수 있는 거대한 떼를 이루어 이동한다."]],"w":"4번은 떼가 길이로 수 마일, 폭 최대 1마일, 깊이 30미터 이상이라고 해요. 그만큼 크므로 enormous = 거대한이에요.","c":1},"h":"ccc5d91d9f"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis amazing migration is kind of a mystery, but it certainly gets all the animals nearby excited.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이 놀라운 이동은 일종의 미스터리이지만, 그것은 확실히 주변의 모든 동물들을 흥분하게 만든다.","opts":["이 놀라운 이동 (This amazing migration)","미스터리 (a mystery)","주변의 동물들 (the animals nearby)","남아프리카 해안 (the coast of South Africa)"],"r":{"a":"1) 이 놀라운 이동 (This amazing migration)","ev":"2번 문장","s":[[2,"This amazing migration is kind of a mystery, but it certainly gets all the animals nearby excited.","이 놀라운 이동은 일종의 미스터리지만, 확실히 주변의 모든 동물들을 흥분하게 한다."]],"w":"it은 ‘주변의 모든 동물들을 흥분하게 만드는’ 주어예요. 앞에서 이야기하던 ‘이 놀라운 이동(This amazing migration)’이 동물들을 흥분하게 하는 거예요. 동물들이나 해안은 흥분을 일으키는 쪽이 아니에요.","c":1,"k":"it = 이 놀라운 이동 (This amazing migration)"},"pron":"it","h":"e15c396ce4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"People enjoy the event, and they all agree it’s one of the most amazing sights they’ve ever seen.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사람들은 그 행사를 즐기고, 그들 모두 그것이 지금까지 본 가장 놀라운 광경 중 하나라는 데 동의한다.","opts":["사람들은 그 행사를 즐기며, 모두 그것이 지금까지 본 가장 놀라운 광경 중 하나라고 말한다.","사람들은 그 행사가 지루하다고 말하고 모두 일찍 집으로 돌아간다.","사람들 중 일부만 그 행사를 즐기고, 나머지는 별로라고 생각한다.","사람들은 그 행사를 즐기지만, 전에도 많이 봐서 놀랍지 않다고 말한다."],"r":{"a":"1) 사람들은 그 행사를 즐기며, 모두 그것이 지금까지 본 가장 놀라운 광경 중 하나라고 말한다.","ev":"13번 문장","s":[[13,"People enjoy the event, and they all agree it’s one of the most amazing sights they’ve ever seen.","사람들은 그 행사를 즐기며, 그것이 그들이 본 가장 놀라운 광경 중의 하나라는 데에 모두 동의한다."]],"w":"13번 문장은 사람들이 그 행사를 즐기고, 모두 지금까지 본 가장 놀라운 광경 중 하나라고 입을 모은다는 뜻이에요. 지루하다거나 일부만 즐긴다거나 놀랍지 않다는 말은 없어요.","c":1},"h":"97ac503a59"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["정어리들은 동부 해안에서 알을 낳은 뒤 아굴라스 퇴로 헤엄친다.","정어리들은 남부 연안에서 알을 낳은 뒤 남아프리카 공화국의 동부 해안으로 헤엄친다.","정어리들은 알을 낳은 뒤 아굴라스 퇴를 결코 떠나지 않는다.","정어리들은 알을 낳기 전에 남아프리카 공화국의 서부 해안으로 헤엄친다."],"opts":["The sardines lay their eggs on the eastern coast and then swim to the Agulhas Bank.","The sardines lay their eggs off the southern coast and then swim to the eastern coast of South Africa.","The sardines never leave the Agulhas Bank after laying their eggs.","The sardines swim to the western coast of South Africa before laying their eggs."],"r":{"a":"2) The sardines lay their eggs off the southern coast and then swim to the eastern coast of South Africa.","ev":"3번 문장","s":[[3,"After laying their eggs in the Agulhas Bank off the southern coast, the sardines swim to the eastern coast of South Africa.","남부 연안의 아굴라스 퇴(堆)에서 산란을 한 후, 정어리들은 남아프리카 공화국의 동부 해안으로 헤엄친다."]],"w":"3번에서 정어리들은 남부 연안의 아굴라스 퇴에서 알을 낳은 뒤 남아프리카 공화국의 동부 해안으로 헤엄친다고 해요. 알을 낳는 곳과 가는 곳이 뒤바뀌거나, 서부로 가거나, 계속 머문다는 것은 모두 틀려요.","c":2},"h":"5d5e9ee861"},{"n":9,"t":"sum","q":"Tens of thousands of hungry animals hurry to the sardine run, making it Earth’s (A) event for (B).","ko":"굶주린 수만 마리의 동물들이 정어리 떼의 이동으로 몰려들며, 이는 (B)에게 지구에서 (A) 행사가 된다.","oko":["(A) 가장 큰 / (B) 농부","(A) 가장 작은 / (B) 포식자","(A) 가장 큰 / (B) 포식자","(A) 가장 조용한 / (B) 아이들","(A) 가장 오래된 / (B) 선원"],"opts":["(A) biggest / (B) farmers","(A) smallest / (B) predators","(A) biggest / (B) predators","(A) quietest / (B) children","(A) oldest / (B) sailors"],"r":{"a":"3) (A) biggest / (B) predators ((A) 가장 큰 / (B) 포식자)","ev":"5번 문장","s":[[5,"Tens of thousands of animals hungry for sardines hurry to the area, including dolphins, whales, gannets, sailfish, and many kinds of sharks, as well as orcas and seals—making it Earth’s biggest event for predators.","정어리에 굶주린 수만 마리의 동물들이 그 지역으로 서둘러 가는데, 여기에는 범고래와 물개뿐 아니라 돌고래, 고래, 부비새류, 돛새치, 그리고 많은 종류의 상어들이 포함되어, 그것이 포식자들을 위한 지구의 가장 큰 행사가 되게 한다."]],"w":"5번 문장에서 정어리를 노리는 수만 마리의 동물이 몰려들어 그곳이 지구에서 포식자(predators)에게 가장 큰(biggest) 행사가 된다고 해요. 나머지 단어는 본문과 맞지 않아요.","c":3},"h":"4b909f35c2"},{"n":10,"t":"fill","q":"Many people come to watch the sardine run from [A], and some bring snorkeling [B] to swim under the waves.","ko":"많은 사람들이 [A]에서 정어리 떼의 이동을 보려고 오고, 몇몇은 파도 아래에서 수영하려고 스노클링 [B]을(를) 가져온다.","bank":["boats","equipment","sardines","spectacle","flocks","whales"],"bko":{"boats":"배","equipment":"장비","sardines":"정어리","spectacle":"광경","flocks":"떼","whales":"고래"},"r":{"a":"[A] boats, [B] equipment","ev":"11~12번 문장","s":[[11,"Many people come to watch the sardine run from boats.","많은 사람들이 배에서 정어리 떼의 이동을 보려고 온다."],[12,"Some bring snorkeling equipment to swim under the waves among all the excited fish.","몇몇은 파도 아래에서 그 모든 흥분한 물고기들 사이에서 수영을 하기 위해 스노클링 장비를 가져온다."]],"w":"11번에서 많은 사람들이 배(boats)에서 정어리 떼의 이동을 보려고 온다고 하고, 12번에서 몇몇은 스노클링 장비(equipment)를 가져온다고 해요. 나머지 단어는 ‘from ~’과 ‘snorkeling ~’ 자리에 의미상 맞지 않아요.","c":null},"h":"498f328341"}]},{"u":8,"id":"ch3-08-1","no":1,"ko":"물방울무늬의 여왕","items":[{"n":1,"t":"tf","q":"When she was a child, Yayoi imagined that the flowers in a large field were talking to her.","ko":"어린 시절, 야요이는 커다란 꽃밭의 꽃들이 자신에게 이야기하고 있다고 상상했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"As she was standing in the middle of a large field of flowers, she imagined she could hear the flowers talking to her.","그녀가 커다란 꽃밭 가운데 서 있었을 때, 그녀는 꽃들이 그녀에게 이야기하고 있는 것을 들을 수 있다고 상상했다."]],"w":"4번 문장에서 커다란 꽃밭 한가운데 서 있던 그녀가 꽃들이 자신에게 이야기하고 있다고 상상했다고 해요. 3번에서 이것이 어린 시절의 경험이라고 했으니 본문과 맞아요.","c":"T"},"h":"f4f7ee8875"},{"n":2,"t":"tf","q":"Yayoi makes only Infinity Rooms and does not make paintings or clothes.","ko":"야요이는 인피니티 룸만 만들고 회화나 옷은 만들지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Besides these rooms, Yayoi also creates paintings, drawings, clothes, and other objects, all of which she covers in dots.","이 방 이외에, 야요이는 또한 회화, 소묘, 옷, 그리고 다른 물건들을 만드는데, 이 모든 것을 그녀는 점으로 뒤덮는다."]],"w":"10번 문장에서 이 방 이외에 회화, 소묘, 옷, 다른 물건들도 만든다고 했어요. ‘만 만든다’는 본문과 달라요.","c":"F"},"h":"6ecc2477fc"},{"n":3,"t":"tf","q":"A Japanese artist named Yayoi Kusama is often called “the princess of polka dots.”","ko":"야요이 쿠사마라는 한 일본인 예술가는 흔히 ‘물방울무늬의 여왕’이라고 불린다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"A Japanese artist named Yayoi Kusama is often called “the princess of polka dots.”","야요이 쿠사마라는 한 일본인 예술가는 흔히 ‘물방울무늬의 여왕’이라고 불린다."]],"w":"1번 문장이 그대로 말하는 내용이에요. 일본인 예술가 야요이 쿠사마는 흔히 ‘물방울무늬의 여왕’이라고 불려요.","c":"T"},"h":"15e3747ddc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…dark rooms filled with mirrors and small flashing lights…)","ko":"(…거울과 작은 …등으로 가득 찬 어두운 방…)","opts":["꺼진","깨진","반짝이는","무거운"],"word":"flashing","r":{"a":"3) 반짝이는","ev":"9번 문장","s":[[9,"When people enter one of these dark rooms filled with mirrors and small flashing lights, they feel as though they were standing in the middle of an endless space.","사람들이 거울과 반짝이는 작은 등들로 가득 찬 이 어두운 방 중 한 곳에 들어갈 때 그들은 마치 끝없는 공간 한가운데에 서 있는 것처럼 느낀다."]],"w":"9번 문장은 거울과 작은 등으로 가득 찬 어두운 방을 말해요. 어두운 방 안의 작은 등이니 flashing은 ‘반짝이는’이에요. flash(번쩍이다)에서 온 말이에요.","c":3},"h":"812b3c9841"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…became part of the city’s art scene…)","ko":"(…그 도시의 예술 …의 일부가 되었다…)","opts":["분야, 세계","풍경","장면","소란"],"word":"scene","r":{"a":"1) 분야, 세계","ev":"7번 문장","s":[[7,"Later, in the 1950s, she moved to New York and became part of the city’s art scene, meeting famous artists like Andy Warhol.","이후에, 1950년대에, 그녀는 뉴욕으로 이주했고 앤디 워홀과 같은 유명한 예술가들을 만나면서, 그 도시 예술계의 일부가 되었다."]],"w":"7번 문장은 뉴욕으로 이주해 유명한 예술가들을 만나면서 그 도시 예술의 한 ‘분야, 세계’에 들어갔다는 뜻이에요. 그래서 art scene은 예술계예요. scene이 ‘풍경’이나 ‘장면’으로 쓰인 것이 아니에요.","c":1},"h":"e8253f67c3"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis is because all of her artwork has one thing in common; it is covered in dots.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이는 그녀의 모든 미술품이 점으로 덮여 있다는 한 가지 공통점이 있기 때문이다.","opts":["야요이 쿠사마","그녀의 모든 미술품","한 가지 공통점","물방울무늬의 여왕"],"r":{"a":"2) 그녀의 모든 미술품","ev":"2번 문장","s":[[2,"This is because all of her artwork has one thing in common; it is covered in dots.","이는 그녀의 모든 미술품이 점으로 덮여 있다는 한 가지 공통점이 있기 때문이다."]],"w":"점으로 ‘덮여 있는’ 것은 그녀의 모든 미술품이에요. it은 세미콜론(;) 앞의 all of her artwork를 가리켜요. ‘한 가지 공통점’이 덮여 있는 것이 아니에요.","c":2},"h":"2d6faf973e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Looking around, she felt as though she were standing in a field of endless dots.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"주위를 둘러봤을 때, 그녀는 마치 끝없는 점으로 이루어진 들판에 서 있는 것 같았다.","opts":["둘러보니 실제로 끝없는 점들로 이루어진 들판에 서 있었다.","점으로 이루어진 들판을 둘러보며 그것을 그림으로 그리고 싶다고 느꼈다.","끝없는 들판에 서서 점을 하나씩 세어 보고 있다고 상상했다.","둘러보았을 때, 마치 끝없는 점들로 이루어진 들판에 서 있는 것 같은 느낌이 들었다."],"r":{"a":"4) 둘러보았을 때, 마치 끝없는 점들로 이루어진 들판에 서 있는 것 같은 느낌이 들었다.","ev":"5번 문장","s":[[5,"Looking around, she felt as though she were standing in a field of endless dots.","주위를 둘러봤을 때, 그녀는 마치 끝없는 점으로 이루어진 들판에 서 있는 것 같았다."]],"w":"as though she were standing ~은 ‘마치 ~에 서 있는 것 같았다’라는 뜻이에요. 실제로 점들의 들판에 서 있었던 것(1번)은 아니고, 점을 그리고 싶다거나(2번) 점을 센다는(3번) 내용도 없어요.","c":4},"h":"74f7246ad9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["인피니티 룸은 거울이 없는 밝은 방이다.","야요이는 뉴욕으로 이주한 뒤에야 예술가가 되기로 결심했다.","인피니티 룸은 사람들이 어린 시절 야요이가 꽃밭에서 느낀 것과 같은 감정을 경험하게 해 준다.","야요이는 지구가 우주보다 크다는 것을 보여 주려고 점을 쓴다."],"opts":["The Infinity Rooms are bright rooms with no mirrors.","Yayoi decided to become an artist only after she moved to New York.","The Infinity Rooms let people experience the same feeling Yayoi had as a child in the field of flowers.","Yayoi uses dots to show that the Earth is bigger than the universe."],"r":{"a":"3) The Infinity Rooms let people experience the same feeling Yayoi had as a child in the field of flowers.","ev":"8번 문장","s":[[8,"Yayoi is best known for her special Infinity Rooms, which allow people to experience the same feeling she had as a child standing in the field of flowers.","야요이는 그녀의 특별한 <인피니티 룸>으로 가장 잘 알려져 있는데, 이것은 사람들이 그녀가 어린 시절 꽃밭에 서 있던 때 느낀 것과 똑같은 감정을 경험하도록 해 준다."]],"w":"8번 문장에서 인피니티 룸은 사람들이 어린 야요이가 꽃밭에서 느낀 것과 똑같은 감정을 경험하게 해 준다고 했어요. 인피니티 룸은 어둡고 거울이 있는 방이고(9번), 예술가가 되기로 한 것은 뉴욕에 가기 전이며(3~7번), 점을 쓰는 것은 지구가 우주의 작은 점임을 상징하기 위해서예요(11번).","c":3},"h":"818745b5cd"},{"n":9,"t":"sum","q":"A strange event in Yayoi Kusama’s childhood had a powerful (A) on her and (B) her to become an artist.","ko":"야요이 쿠사마의 어린 시절의 이상한 사건은 그녀에게 강력한 (A)을(를) 주었고 그녀가 예술가가 되도록 (B).","oko":["(A) 영향 / (B) 영감을 주었다","(A) 비용 / (B) 영감을 주었다","(A) 영향 / (B) 막았다","(A) 가격 / (B) 경고했다","(A) 문제 / (B) 가르쳤다"],"opts":["(A) impact / (B) inspired","(A) cost / (B) inspired","(A) impact / (B) stopped","(A) price / (B) warned","(A) problem / (B) taught"],"r":{"a":"1) (A) impact / (B) inspired ((A) 영향 / (B) 영감을 주었다)","ev":"3번, 6번 문장","s":[[3,"It started with a strange experience in her childhood that had a powerful impact on her.","그것은 그녀에게 강렬한 영향을 미친, 그녀의 어린 시절의 이상한 경험에서 시작되었다."],[6,"This inspired her to become an artist.","이것은 그녀가 예술가가 되도록 영감을 주었다."]],"w":"3번 문장에서 어린 시절의 이상한 경험이 그녀에게 강력한 영향(impact)을 주었고, 6번 문장에서 이것이 그녀가 예술가가 되도록 영감을 주었다(inspired)고 해요. cost·price·problem은 본문에 없고 stopped·warned·taught도 맞지 않아요.","c":1},"h":"5a7e56185b"},{"n":10,"t":"fill","q":"Yayoi covers her artwork in dots to [A] the fact that the Earth is just one small dot in our [B] universe.","ko":"야요이는 지구가 우리의 [B] 우주 속 작은 점 하나일 뿐이라는 사실을 [A] 위해 작품을 점으로 덮는다.","bank":["symbolize","enormous","rooms","lights","artist","mirrors"],"bko":{"symbolize":"상징하다","enormous":"거대한","rooms":"방","lights":"불빛","artist":"예술가","mirrors":"거울"},"r":{"a":"[A] symbolize (상징하다), [B] enormous (거대한)","ev":"11번 문장","s":[[11,"She does this to symbolize the fact that the Earth is just one small dot in our enormous universe.","그녀는 우리의 거대한 우주에서 지구는 그저 하나의 작은 점이라는 사실을 상징하기 위해 이렇게 한다."]],"w":"11번 문장은 지구가 우리의 거대한(enormous) 우주 속 작은 점 하나라는 사실을 상징하려고(symbolize) 점을 쓴다는 뜻이에요. rooms·lights·artist·mirrors는 빈칸에 넣으면 문장이 성립하지 않아요.","c":null},"h":"84d80ef1b6"}]},{"u":8,"id":"ch3-08-2","no":2,"ko":"커피 한 잔의 전쟁","items":[{"n":1,"t":"tf","q":"In Germany, there were laws and taxes made to discourage people from drinking coffee.","ko":"독일에는 사람들이 커피를 마시지 못하게 하려고 만들어진 법과 세금이 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"As a result, there were laws and taxes designed to discourage coffee drinking.","결과적으로, 커피 마시는 것을 자제시키려 만들어진 법과 세금이 있었다."]],"w":"3번 문장에서 커피 마시는 것을 자제시키려고 만들어진 법과 세금이 있었다고 해요. 본문과 맞아요.","c":"T"},"h":"25c163ce77"},{"n":2,"t":"tf","q":"In the Coffee Cantata, the father tells his daughter that she can have both marriage and coffee.","ko":"「커피 칸타타」에서 아버지는 딸에게 결혼과 커피를 둘 다 가져도 된다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"He tries to break her habit by telling her that she has to choose between getting married and drinking coffee.","그는 그녀에게 결혼하는 것과 커피를 마시는 것 중에서 선택을 해야 한다고 말함으로써 그녀의 습관을 없애려고 한다."]],"w":"6번 문장에서 아버지는 딸에게 결혼하는 것과 커피를 마시는 것 중에서 선택해야 한다고 말해요. 둘 다 가져도 된다는 말은 본문과 반대예요.","c":"F"},"h":"252b76eaea"},{"n":3,"t":"tf","q":"The Coffee Cantata is a comical operetta about a traditional father and his coffee-drinking daughter.","ko":"「커피 칸타타」는 전통적인 아버지와 커피를 마시는 딸에 관한 재미있는 오페레타이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"It was a comical operetta about a traditional father and his modern, coffee-drinking daughter.","그것은 전통적인 아버지와 커피를 마시는 현대적인 딸에 관한 재미있는 오페레타였다."]],"w":"5번 문장이 말하는 내용이에요. 「커피 칸타타」는 전통적인 아버지와 커피를 마시는 현대적인 딸에 관한 재미있는 오페레타예요.","c":"T"},"h":"e086cc4e39"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…many Germans, who distrusted foreign influences on their culture…)","ko":"(…자기 문화에 대한 외국의 영향을 …한 많은 독일 사람들…)","opts":["신뢰한","불신한","모방한","환영한"],"word":"distrusted","r":{"a":"2) 불신한","ev":"2번 문장","s":[[2,"Before that time, many Germans, who distrusted foreign influences on their culture, saw coffee as a threat to their preferred local drink, beer.","그 시대 이전에는 많은 독일 사람들이 그들의 문화에 대한 외국의 영향력을 불신하여, 커피를 그들이 선호하는 현지 음료인 맥주에 대한 위협으로 여겼다."]],"w":"2번 문장에서 이 독일인들은 커피를 맥주에 대한 위협으로 보았어요. 외국의 영향을 믿지 못해서 그렇게 본 것이니 distrusted는 ‘불신했다’예요. trust(신뢰하다) 앞에 dis-가 붙은 말이에요.","c":2},"h":"b3f69a0f9b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Although most of Europe had embraced the habit of drinking coffee by the 17th century…)","ko":"(대부분의 유럽이 17세기 즈음에 커피 마시는 습관을 …했지만…)","opts":["껴안았다","거부했다","받아들였다","잊어버렸다"],"word":"embraced","r":{"a":"3) 받아들였다","ev":"1번 문장","s":[[1,"Although most of Europe had embraced the habit of drinking coffee by the 17th century, it wasn’t until the second half of the 18th century that it was accepted in Germany.","비록 대부분의 유럽에서 17세기 즈음에는 커피 마시는 습관을 받아들이게 되었지만, 그것이 독일에서 받아들여진 것은 18세기 후반이 되어서였다."]],"w":"1번 문장은 대부분의 유럽이 17세기에 커피 마시는 습관을 이미 ‘받아들였다’는 뜻이에요. 독일은 18세기 후반에야 받아들였다는 대조가 이어지니, embraced는 몸으로 껴안은 것이 아니라 ‘받아들이다’예요.","c":3},"h":"24ac60603a"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThe Coffee Cantata, which was originally performed at a popular German coffee shop, had a simple message for its audiences: there’s nothing wrong with drinking coffee.","ko":"밑줄 친 which가 가리키는 것은?","sko":"「커피 칸타타」는 원래 독일의 한 인기 있는 커피숍에서 공연되었는데, 관객들을 위한 간단한 메시지를 담고 있었다. 커피를 마시는 데에는 아무 문제가 없다는 것이다.","opts":["독일의 커피숍","「커피 칸타타」","간단한 메시지","독일의 관객들"],"r":{"a":"2) 「커피 칸타타」","ev":"11번 문장","s":[[11,"The Coffee Cantata, which was originally performed at a popular German coffee shop, had a simple message for its audiences: there’s nothing wrong with drinking coffee.","「커피 칸타타」는 원래 독일의 한 인기 있는 커피숍에서 공연되었는데, 관객들을 위한 간단한 메시지를 담고 있었다. 커피를 마시는 데에는 아무 문제가 없다는 것이다."]],"w":"which was originally performed at a popular German coffee shop에서 ‘공연된’ 것은 바로 앞의 The Coffee Cantata예요. 커피숍은 공연된 장소이고, 메시지는 뒤에 나오는 내용이에요.","c":2},"h":"b7ccb52605"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But as much as she loves coffee, the daughter does not want to go through life unmarried.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그녀는 자신이 커피를 사랑하는 만큼이나, 결혼하지 않은 채로 살기를 원하지는 않는다.","opts":["딸은 커피를 사랑하는 것보다 결혼하지 않는 삶을 더 원한다.","딸은 커피를 사랑하지만 결혼한 삶이 불행해질까 봐 걱정한다.","딸은 결혼하기를 원하지만 커피를 사랑하지는 않는다.","딸은 커피를 아주 사랑하지만, 결혼하지 못한 채 평생을 사는 것은 원하지 않는다."],"r":{"a":"4) 딸은 커피를 아주 사랑하지만, 결혼하지 못한 채 평생을 사는 것은 원하지 않는다.","ev":"8번 문장","s":[[8,"But as much as she loves coffee, the daughter does not want to go through life unmarried.","하지만 그녀는 자신이 커피를 사랑하는 만큼이나, 결혼하지 않은 채로 살기를 원하지는 않는다."]],"w":"But as much as she loves coffee는 ‘커피를 사랑하는 만큼이나’라는 뜻이고, 뒤에서 결혼하지 않은 채 살고 싶지는 않다고 해요. 그래서 커피 사랑보다 독신을 원한다는 선지(1번)와는 반대예요.","c":4},"h":"7fa1e1fb6f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["1732년에 바흐는 「커피 칸타타」로 ‘커피 전쟁’에 관여하게 되었다.","「커피 칸타타」는 독일인들이 커피를 끊게 설득하려고 쓰였다.","독일은 유럽에서 커피를 가장 먼저 받아들인 나라였다.","바흐의 작품은 커피를 좋아하는 사람들 앞에서만 공연되었다."],"opts":["In 1732, Bach became involved in the “coffee wars” with his Coffee Cantata.","The Coffee Cantata was written to persuade Germans to stop drinking coffee.","Germany was the first country in Europe to accept coffee.","Bach’s work was performed only for people who loved coffee."],"r":{"a":"1) In 1732, Bach became involved in the “coffee wars” with his Coffee Cantata.","ev":"4번 문장","s":[[4,"In 1732, the legendary composer Johann Sebastian Bach became involved in these “coffee wars” with his Coffee Cantata.","1732년, 전설적인 작곡가 요한 제바스티안 바흐는 그의 「커피 칸타타」로 이 ‘커피 전쟁’에 개입하게 되었다."]],"w":"4번 문장에서 1732년에 바흐가 「커피 칸타타」로 ‘커피 전쟁’에 관여하게 되었다고 해요. 「커피 칸타타」의 메시지는 커피에 문제가 없다는 것이고(11번), 독일은 유럽 대부분보다 늦게 커피를 받아들였으며(1번), 작품은 커피를 좋아하는 사람과 싫어하는 사람 모두를 즐겁게 했어요(12번).","c":1},"h":"d2df3bdc45"},{"n":9,"t":"sum","q":"Bach’s Coffee Cantata dealt with the generational differences of the time in a (A) way, and it (B) both coffee-loving and coffee-hating Germans.","ko":"바흐의 「커피 칸타타」는 그 시대의 세대 차이를 (A) 방식으로 다루었고, 커피를 좋아하는 독일인과 싫어하는 독일인 모두를 (B).","oko":["(A) 진지한 / (B) 화나게 했다","(A) 가혹한 / (B) 경고했다","(A) 유머러스한 / (B) 즐겁게 했다","(A) 유머러스한 / (B) 불쾌하게 했다","(A) 비밀스러운 / (B) 즐겁게 했다"],"opts":["(A) serious / (B) angered","(A) harsh / (B) warned","(A) humorous / (B) entertained","(A) humorous / (B) offended","(A) secret / (B) entertained"],"r":{"a":"3) (A) humorous / (B) entertained","ev":"12번 문장","s":[[12,"By telling a tale that pointed out the generational differences of the time in a humorous way, Bach’s work amused and entertained both coffee-loving and coffee-hating Germans.","그 시대의 세대 차이를 지적하는 이야기를 유머러스한 방식으로 말함으로써, 바흐의 작품은 커피를 좋아하는 독일인들과 커피를 싫어하는 독일인들 모두를 재미있고 즐겁게 해주었다."]],"w":"12번 문장에서 바흐의 작품은 세대 차이를 유머러스한(humorous) 방식으로 이야기해서 커피를 좋아하는 독일인과 싫어하는 독일인 모두를 즐겁게 했어요(entertained). 진지하거나(serious) 화나게 했다(angered)는 본문과 반대예요.","c":3},"h":"435726891a"},{"n":10,"t":"fill","q":"The daughter secretly explains that she won’t [A] anyone who tries to keep her [B] from coffee.","ko":"딸은 자신을 커피에서 [B] 떼어 놓으려는 누구와도 [A] 생각이 없다고 몰래 설명한다.","bank":["marry","away","coffee","sweet","taste","threat"],"bko":{"marry":"결혼하다","away":"멀리","coffee":"커피","sweet":"달콤한","taste":"맛","threat":"협박"},"r":{"a":"[A] marry, [B] away","ev":"10번 문장","s":[[10,"However, she secretly explains to the men her father introduces that she won’t marry anyone who tries to keep her away from coffee.","하지만, 그녀는 자신의 아버지가 소개하는 남자들에게 자신을 커피에서 멀어지게 하려는 누구와도 결혼하지 않겠다고 몰래 설명한다."]],"w":"10번에서 딸은 몰래 커피에서 자신을 멀리(away) 두려는 누구와도 결혼하지(marry) 않겠다고 말해요. coffee, sweet, taste, threat는 이 두 빈칸에 문법상·의미상 맞지 않아요.","c":null},"h":"15fd2bcc75"}]},{"u":8,"id":"ch3-08-3","no":3,"ko":"바나나, 걸면 작품이 된다","items":[{"n":1,"t":"tf","q":"The banana sold at the auction was probably the most expensive piece of fruit ever sold.","ko":"경매에서 팔린 그 바나나는 아마도 지금까지 팔린 것 중 가장 비싼 과일이었을 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It’s likely the most expensive piece of fruit ever sold.","그것은 아마도 지금까지 팔린 것 중에 가장 비싼 과일 조각이었을 것이다."]],"w":"4번 문장이 그대로 말하는 내용이에요. 그 바나나는 아마도 지금까지 팔린 것 중 가장 비싼 과일 조각이었을 것이라고 해요.","c":"T"},"h":"e52f411cb8"},{"n":2,"t":"tf","q":"Comedian, the banana artwork, was created by a performance artist named David Datuna.","ko":"바나나 작품 「코미디언」은 데이비드 다투나라는 행위 예술가가 만들었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The banana is a conceptual work of art titled Comedian, and it was created by an Italian artist named Maurizio Cattelan.","그 바나나는 「코미디언」이라고 제목이 붙여진 개념 미술 작품인데, 마우리치오 카텔란이라고 하는 한 이탈리아 예술가에 의해 만들어졌다."]],"w":"5번 문장에서 「코미디언」을 만든 사람은 마우리치오 카텔란이라는 이탈리아 예술가예요. 다투나는 10번에서 바나나를 먹은 행위 예술가로 나와요.","c":"F"},"h":"96e14f66cc"},{"n":3,"t":"tf","q":"At a 2019 art fair in Miami, a performance artist took the banana off the wall and ate it in front of attendees.","ko":"2019년 마이애미의 한 미술 박람회에서, 한 행위 예술가가 벽에서 바나나를 떼어 내 참석자들 앞에서 먹었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"At a 2019 art fair in Miami, performance artist David Datuna shocked attendees when he unexpectedly grabbed the banana from the wall and ate it in front of them.","2019년 마이애미에서 열린 미술 박람회에서 행위 예술가인 데이비드 다투나는 참석자들 앞에서 예기치 않게 벽에서 바나나를 집어서 먹어서 그들을 놀라게 했다."]],"w":"10번 문장에서 행위 예술가 데이비드 다투나가 참석자들 앞에서 벽에서 바나나를 집어서 먹었다고 해요. 본문과 맞아요.","c":"T"},"h":"ab490e3921"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…it forces viewers to confront questions regarding the financial value of art…)","ko":"(…그것이 관객들로 하여금 예술의 금전적 가치에 관한 질문을 …하도록 강요하기 때문에…)","opts":["피하다","직면하다","잊다","허락하다"],"word":"confront","r":{"a":"2) 직면하다","ev":"7번 문장","s":[[7,"Some believe that the work serves as a thoughtful commentary on modern culture because it forces viewers to confront questions regarding the financial value of art and its role in society.","어떤 사람들은 그 작품이 관객들로 하여금 예술의 금전적 가치와 그것의 사회에서의 역할에 관한 질문을 마주하도록 강요하기 때문에 현대 문화에 관한 사려 깊은 논의로 기능한다고 믿는다."]],"w":"7번 문장은 이 작품이 관객들을 예술의 금전적 가치와 사회에서의 역할에 관한 질문 앞에 서게 한다는 뜻이에요. 질문을 피하게 하는 것이 아니라 마주하게 하는 것이라 confront는 ‘직면하다, 맞서다’예요.","c":2},"h":"45318419fa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Comedian is an intriguing piece of work because it blurs the lines between art and everyday life.)","ko":"(「코미디언」은 예술과 일상 생활 사이의 경계를 흐리기 때문에 …한 작품이다.)","opts":["지루한","평범한","아주 흥미로운","값싼"],"word":"intriguing","r":{"a":"3) 아주 흥미로운","ev":"12번 문장","s":[[12,"Comedian is an intriguing piece of work because it blurs the lines between art and everyday life.","「코미디언」은 예술과 일상 생활 사이의 경계를 흐리기 때문에 아주 흥미로운 작품이다."]],"w":"12번 문장은 「코미디언」이 예술과 일상의 경계를 흐리게 하기 때문에 intriguing한 작품이라고 해요. 13번에서 사고를 자극하고 논쟁과 웃음을 일으킨다고 하니 ‘아주 흥미로운’이 알맞아요.","c":3},"h":"5cea3ce8ca"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe auction of the banana isn’t the only time it has been involved in a surprising situation.","ko":"밑줄 친 it이 가리키는 것은?","sko":"바나나 경매가 그것이 놀라운 상황에 연루되어 온 유일한 경우는 아니었다.","opts":["미술 박람회","경매장","놀라운 상황","그 바나나 작품"],"r":{"a":"4) 그 바나나 작품","ev":"9번 문장","s":[[9,"The auction of the banana isn’t the only time it has been involved in a surprising situation.","바나나 경매가 그것이 놀라운 상황에 연루되어 온 유일한 경우는 아니었다."]],"w":"놀라운 상황에 ‘연루되어 온’ 것은 바나나 작품이에요. 이 문장은 바나나의 경매가 놀라운 일의 유일한 경우가 아니라는 뜻이고, 이어지는 10번에서 바나나가 박람회에서 먹힌 일이 나와요.","c":4},"h":"eec1369654"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Others, on the other hand, argue that it makes art seem meaningless.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다른 사람들은, 반면에, 그것이 예술을 의미 없는 것으로 보이게 만든다고 주장한다.","opts":["다른 사람들은 그것이 예술을 의미 없는 것처럼 보이게 만든다고 주장한다.","다른 사람들은 예술이 의미 없는 것이 되기를 바란다고 말한다.","다른 사람들은 그 작품 때문에 의미 있는 예술이 모두 사라졌다고 주장한다.","다른 사람들은 예술을 의미 없게 만든 사람이 관객이라고 비판한다."],"r":{"a":"1) 다른 사람들은 그것이 예술을 의미 없는 것처럼 보이게 만든다고 주장한다.","ev":"8번 문장","s":[[8,"Others, on the other hand, argue that it makes art seem meaningless.","다른 사람들은, 반면에, 그것이 예술을 의미 없는 것으로 보이게 만든다고 주장한다."]],"w":"argue that it makes art seem meaningless는 ‘그것이 예술을 의미 없어 보이게 만든다고 주장한다’예요. 예술이 의미 없는 것이 되기를 바란다(2번)거나 의미 있는 예술이 모두 사라졌다(3번), 관객이 원인이라는(4번) 내용은 없어요.","c":1},"h":"6e4b8c2a6b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["「코미디언」은 2019년에 경매에서 620만 달러에 팔렸다.","카텔란이 2019년에 「코미디언」을 처음 전시했을 때, 무엇이 예술인지에 대한 열띤 논쟁이 시작되었다.","작품을 본 모든 사람은 그것이 훌륭한 예술이라는 데 동의했다.","다투나는 마이애미 박람회에서 바나나를 샀다."],"opts":["Comedian was sold at an auction in 2019 for $6.2 million.","When Cattelan first displayed Comedian in 2019, it started a heated debate about what art is.","Everyone who saw the work agreed that it was a great piece of art.","Datuna bought the banana at the Miami art fair."],"r":{"a":"2) When Cattelan first displayed Comedian in 2019, it started a heated debate about what art is.","ev":"6번 문장","s":[[6,"When he first displayed the work in 2019, it went viral and sparked heated debates over what can be considered art.","그가 2019년에 처음 그 작품을 전시했을 때, 그것은 입소문을 탔고 예술로 간주될 수 있는 것이 무엇인가에 대한 열띤 논쟁을 촉발했다."]],"w":"6번 문장에서 카텔란이 2019년에 처음 작품을 전시했을 때 무엇이 예술로 간주될 수 있는가를 두고 열띤 논쟁이 일었다고 해요. 620만 달러에 팔린 것은 2024년이고(3번), 모두가 훌륭한 예술이라고 하지는 않았으며(7~8번), 다투나는 바나나를 사지 않고 먹었어요(10번).","c":2},"h":"5155c86447"},{"n":9,"t":"sum","q":"An art (A) at a New York auction (B) $6.2 million for a banana taped to a wall.","ko":"뉴욕의 한 경매에서 한 미술품 (A)이(가) 벽에 테이프로 붙인 바나나에 620만 달러를 (B).","oko":["(A) 수집가 / (B) 지불했다","(A) 수집가 / (B) 훔쳤다","(A) 선생님 / (B) 지불했다","(A) 도둑 / (B) 거절했다","(A) 가수 / (B) 이겼다"],"opts":["(A) collector / (B) paid","(A) collector / (B) stole","(A) teacher / (B) paid","(A) thief / (B) refused","(A) singer / (B) won"],"r":{"a":"1) (A) collector / (B) paid ((A) 수집가 / (B) 지불했다)","ev":"3번 문장","s":[[3,"During an auction held at a renowned New York City auction house on November 20, 2024, an art collector paid $6.2 million for a banana taped to a wall.","2024년 11월 20일, 어느 유명한 뉴욕시 경매장에서 열린 한 경매 중에, 한 미술품 수집가가 벽에 테이프로 붙여진 바나나에 620만 달러를 지불했다."]],"w":"3번 문장에서 미술품 수집가(art collector)가 경매에서 벽에 테이프로 붙인 바나나에 620만 달러를 지불했다(paid)고 해요. teacher·thief·singer는 본문에 없고 stole·refused·won도 맞지 않아요.","c":1},"h":"8d9c84f7d8"},{"n":10,"t":"fill","q":"Would you ever [A] spending millions of [B] on a piece of fruit?","ko":"과일 한 개에 수백만 [B]을(를) 쓰는 것을 [A] 적이 있는가?","bank":["consider","dollars","artist","viral","taped","wall"],"bko":{"consider":"고려하다","dollars":"달러","artist":"예술가","viral":"입소문이 난","taped":"테이프로 붙인","wall":"벽"},"r":{"a":"[A] consider (고려하다), [B] dollars (달러)","ev":"1번 문장","s":[[1,"Would you ever consider spending millions of dollars on a piece of fruit?","당신은 과일 한 조각에 수백만 달러를 지불하는 것을 고려해 본 적이 있는가?"]],"w":"1번 문장은 과일 한 개에 수백만 달러(dollars)를 쓰는 것을 고려해(consider) 본 적이 있느냐고 묻는 문장이에요. artist·viral·taped·wall은 빈칸에 넣으면 문장이 성립하지 않아요.","c":null},"h":"feb1776a60"}]},{"u":8,"id":"ch3-08-4","no":4,"ko":"수능:ON 긴 어구 빈칸 추론","items":[{"n":1,"t":"tf","q":"At first glance, a team’s home ground seems to offer more perceived resources, such as fans and facilities.","ko":"언뜻 보기에는, 팀의 홈그라운드가 팬과 시설 같은 인식된 자원을 더 많이 제공하는 것처럼 보인다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"At first glance, the home ground would appear to provide greater perceived resources such as fans and home field facilities.","언뜻 보기에는, 홈그라운드는 팬, 홈 구장의 시설과 같은 인식된 자원을 더 많이 제공하는 것처럼 보이기 마련이다."]],"w":"2번 문장에서 언뜻 보기에는 홈그라운드가 팬과 홈 구장의 시설 같은 인식된 자원을 더 많이 제공하는 것처럼 보인다고 해요. 본문과 맞아요.","c":"T"},"h":"ffc2dd1c6e"},{"n":2,"t":"tf","q":"Athletes tend to feel less confident when they are surrounded by familiar routines and encouraging supporters.","ko":"선수들은 익숙한 동선과 용기를 북돋아 주는 지지자들에게 둘러싸여 있을 때 자신감이 덜하다고 느끼는 경향이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Athletes may feel more confident and motivated when surrounded by familiar routines and encouraging supporters.","선수들은 익숙한 동선과 용기를 북돋아주는 지지자들에 둘러 쌓여 있을 때 더 자신감 있고 동기 부여된 느낌이 들지도 모른다."]],"w":"3번 문장에서 선수들은 익숙한 동선과 용기를 북돋아 주는 지지자들에게 둘러싸여 있을 때 더 자신감 있고 동기 부여된 느낌이 들 수 있다고 해요. ‘덜하다’는 반대예요.","c":"F"},"h":"c3943883ed"},{"n":3,"t":"tf","q":"Perceived demands and resources are said to play a role in the home field advantage.","ko":"인식된 부담과 자원이 홈 이점에서 역할을 한다고 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"One dynamic that can change dramatically in sport is the concept of the home field advantage, in which perceived demands and resources seem to play a role.","스포츠에서 극적으로 바뀔 수 있는 한 가지 역학은 홈 이점이라는 개념으로, 여기에서는 인식된 부담과 자원이 역할을 하는 것처럼 보인다."]],"w":"1번 문장에서 홈 이점이라는 개념 안에서 인식된 부담과 자원이 역할을 하는 것처럼 보인다고 해요. 본문과 맞아요.","c":"T"},"h":"cf38b7f702"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…familiar routines and encouraging supporters)","ko":"(…익숙한 동선과 …… 지지자들…)","opts":["용기를 북돋아 주는","실망시키는","비판하는","무관심한"],"word":"encouraging","r":{"a":"1) 용기를 북돋아 주는","ev":"3번 문장","s":[[3,"Athletes may feel more confident and motivated when surrounded by familiar routines and encouraging supporters.","선수들은 익숙한 동선과 용기를 북돋아주는 지지자들에 둘러 쌓여 있을 때 더 자신감 있고 동기 부여된 느낌이 들지도 모른다."]],"w":"3번 문장은 선수들이 지지자들에게 둘러싸여 있을 때 더 자신감 있고 동기 부여된 느낌이 든다는 내용이에요. 그러니 이 지지자들은 힘을 주는 사람들이라 encouraging은 ‘용기를 북돋아 주는’이에요.","c":1},"h":"463a72bddb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the success percentage for home teams seems to drop in the final games of the playoffs…)","ko":"(…우승 결정전의 마지막 경기에서 홈 팀의 성공률이 …하는 것처럼 보인다…)","opts":["오르다","감소하다","유지되다","시작되다"],"word":"drop","r":{"a":"2) 감소하다","ev":"4번 문장","s":[[4,"However, researchers Roy Baumeister and Andrew Steinhilber were among the first to point out that these competitive factors can change; for example, the success percentage for home teams seems to drop in the final games of the playoffs or World Series.","하지만, 연구원 로이 바우마이스터와 앤드루 스타인힐버는 이러한 경쟁력이 있는 요소들이 바뀔 수도 있다고 처음으로 지적한 사람 중 하나였다. 예를 들어, 우승 결정전이나 월드 시리즈의 마지막 경기에서 홈 팀들의 성공률은 떨어지는 것처럼 보인다."]],"w":"4번 문장은 경쟁 요소가 바뀔 수 있다는 예로, 마지막 경기에서 홈 팀의 성공률이 낮아진다는 내용이에요. 5번에서 팬이 부담이 된다고 이어지니 drop은 ‘떨어지다, 감소하다’예요.","c":2},"h":"6a0070d5e7"},{"n":6,"t":"ref","q":"What does the underlined \"those circumstances\" refer to?\nFans can become part of the perceived demands rather than resources under those circumstances.","ko":"밑줄 친 those circumstances가 가리키는 것은?","sko":"이러한 상황에서 팬들은 자원보다는 인식된 부담의 일부가 될 수 있다.","opts":["팬들이 홈 구장에서 응원하는 모든 상황","우승 결정전이나 월드 시리즈의 마지막 경기처럼 홈 팀의 성공률이 떨어지는 상황","원정 팀이 경기장에 늦게 도착하는 상황","선수들이 익숙한 동선에 둘러싸인 상황"],"r":{"a":"2) 우승 결정전이나 월드 시리즈의 마지막 경기처럼 홈 팀의 성공률이 떨어지는 상황","ev":"4~5번 문장","s":[[4,"However, researchers Roy Baumeister and Andrew Steinhilber were among the first to point out that these competitive factors can change; for example, the success percentage for home teams seems to drop in the final games of the playoffs or World Series.","하지만, 연구원 로이 바우마이스터와 앤드루 스타인힐버는 이러한 경쟁력이 있는 요소들이 바뀔 수도 있다고 처음으로 지적한 사람 중 하나였다. 예를 들어, 우승 결정전이나 월드 시리즈의 마지막 경기에서 홈 팀들의 성공률은 떨어지는 것처럼 보인다."],[5,"Fans can become part of the perceived demands rather than resources under those circumstances.","이러한 상황에서 팬들은 자원보다는 인식된 부담의 일부가 될 수 있다."]],"w":"those circumstances는 바로 앞 4번 문장의 우승 결정전이나 월드 시리즈의 마지막 경기처럼 홈 팀의 성공률이 떨어지는 상황이에요. 그런 상황에서는 팬이 자원이 아니라 부담의 일부가 된다고 해요.","c":2},"h":"8c9cb1c689"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, researchers Roy Baumeister and Andrew Steinhilber were among the first to point out that these competitive factors can change; for example, the success percentage for home teams seems to drop in the final games of the playoffs or World Series.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 연구원 로이 바우마이스터와 앤드루 스타인힐버는 이러한 경쟁력이 있는 요소들이 바뀔 수도 있다고 처음으로 지적한 사람 중 하나였다. 예를 들어, 우승 결정전이나 월드 시리즈의 마지막 경기에서 홈 팀들의 성공률은 떨어지는 것처럼 보인다.","opts":["연구원들은 경쟁 요소가 바뀌지 않는다는 것을 처음으로 밝혔고, 홈 팀은 마지막 경기에서 항상 성공한다.","연구원들은 경쟁 요소가 바뀔 수 있다고 처음 지적한 사람들이 아니었고, 홈 팀의 성공률은 마지막 경기에서 오른다.","연구원들은 경쟁 요소가 바뀔 수 있다고 처음으로 지적한 사람 중 하나였고, 예를 들어 마지막 경기에서 홈 팀의 성공률은 떨어지는 듯하다.","연구원들은 홈 팀이 마지막 경기에서 원정 팀보다 늘 유리하다고 처음 지적했다."],"r":{"a":"3) 연구원들은 경쟁 요소가 바뀔 수 있다고 처음으로 지적한 사람 중 하나였고, 예를 들어 마지막 경기에서 홈 팀의 성공률은 떨어지는 듯하다.","ev":"4번 문장","s":[[4,"However, researchers Roy Baumeister and Andrew Steinhilber were among the first to point out that these competitive factors can change; for example, the success percentage for home teams seems to drop in the final games of the playoffs or World Series.","하지만, 연구원 로이 바우마이스터와 앤드루 스타인힐버는 이러한 경쟁력이 있는 요소들이 바뀔 수도 있다고 처음으로 지적한 사람 중 하나였다. 예를 들어, 우승 결정전이나 월드 시리즈의 마지막 경기에서 홈 팀들의 성공률은 떨어지는 것처럼 보인다."]],"w":"were among the first to point out that ~은 ‘~라고 처음으로 지적한 사람들 중 하나였다’예요. 이어서 예로 마지막 경기에서 홈 팀의 성공률이 떨어지는 것처럼 보인다고 해요. 오르거나(2번), 늘 유리하거나(4번), 바뀌지 않는다(1번)는 내용은 본문과 반대예요.","c":3},"h":"eb1dd28577"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["연구원들은 홈 팬이 마지막 경기에서 늘 홈 팀의 승리를 돕는다고 말한다.","연구원들은 팀의 성공률이 한 해 동안 전혀 변하지 않는다고 말한다.","홈그라운드는 원정보다 인식된 자원을 더 적게 제공한다.","어떤 상황에서는 홈 팬이 팀에게 자원이 아니라 부담의 일부가 될 수 있다."],"opts":["Researchers say home fans always help the home team win the final games.","Researchers say a team’s success percentage never changes during the year.","Home ground gives players fewer perceived resources than away games.","In some situations, home fans can become part of the pressure on a team instead of a resource."],"r":{"a":"4) In some situations, home fans can become part of the pressure on a team instead of a resource.","ev":"5번 문장","s":[[5,"Fans can become part of the perceived demands rather than resources under those circumstances.","이러한 상황에서 팬들은 자원보다는 인식된 부담의 일부가 될 수 있다."]],"w":"5번 문장에서 그런 상황에서는 팬이 자원이 아니라 인식된 부담의 일부가 될 수 있다고 해요. 연구원들은 홈 팬이 늘 도움이 된다고 하지 않았고(4번), 성공률은 마지막 경기에서 떨어질 수 있으며(4번), 홈그라운드는 자원을 더 많이 제공하는 것처럼 보여요(2번).","c":4},"h":"ff2e9cb251"},{"n":9,"t":"sum","q":"The home field advantage is one (A) that can change (B) in sport.","ko":"홈 이점은 스포츠에서 (B) 변할 수 있는 하나의 (A)이다.","oko":["(A) 역학(요소) / (B) 극적으로","(A) 역학(요소) / (B) 천천히","(A) 규칙 / (B) 극적으로","(A) 가격 / (B) 결코 ~않게","(A) 상 / (B) 조용히"],"opts":["(A) dynamic / (B) dramatically","(A) dynamic / (B) slowly","(A) rule / (B) dramatically","(A) price / (B) never","(A) prize / (B) quietly"],"r":{"a":"1) (A) dynamic / (B) dramatically ((A) 역학(요소) / (B) 극적으로)","ev":"1번 문장","s":[[1,"One dynamic that can change dramatically in sport is the concept of the home field advantage, in which perceived demands and resources seem to play a role.","스포츠에서 극적으로 바뀔 수 있는 한 가지 역학은 홈 이점이라는 개념으로, 여기에서는 인식된 부담과 자원이 역할을 하는 것처럼 보인다."]],"w":"1번 문장에서 스포츠에서 극적으로(dramatically) 바뀔 수 있는 하나의 요소(dynamic)가 홈 이점이라고 해요. slowly·never·quietly는 ‘dramatically’와 뜻이 달라 틀리고, rule·price·prize는 본문에 없어요.","c":1},"h":"faf1191be7"},{"n":10,"t":"fill","q":"A team that is [A] at the start of the year will often [B] a road trip to reduce perceived demands and pressures.","ko":"연초에 [A] 팀은 인식된 부담과 압박을 줄이기 위해 원정 경기를 흔히 [B].","bank":["struggling","welcome","resources","routines","percentage","factors"],"bko":{"struggling":"고전하는","welcome":"반기다","resources":"자원","routines":"동선","percentage":"비율","factors":"요소"},"r":{"a":"[A] struggling, [B] welcome","ev":"6번 문장","s":[[6,"This change in perception can also explain why a team that’s struggling at the start of the year will often welcome a road trip to reduce perceived demands and pressures.","이러한 인식의 변화는 왜 연초에 고전하는 팀이 인식된 부담과 압박을 줄이기 위해 길을 떠나는 것(원정 경기를 가는 것)을 보통 반기기 마련인지 또한 설명할 수 있다."]],"w":"6번에서 연초에 고전하는(struggling) 팀은 인식된 부담과 압박을 줄이기 위해 원정 경기를 자주 반긴다(welcome)고 해요. resources, routines, percentage, factors는 이 두 빈칸에 문법상·의미상 맞지 않아요.","c":null},"h":"d7cab765f0"}]},{"u":9,"id":"ch3-09-1","no":1,"ko":"호수는 어디로 갔을까","items":[{"n":1,"t":"tf","q":"The region where Lake Chad is located has experienced consistent drops in rainfall.","ko":"차드 호수가 있는 지역은 강우량이 지속적으로 줄어드는 것을 겪었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"First of all, global warming over the last few decades has played a part, with the region where the lake is located experiencing consistent drops in rainfall levels.","우선, 지난 수십 년에 걸친 지구 온난화가 일조하여, 그 호수가 위치한 지역은 지속적인 강우량 감소를 겪었다."]],"w":"5번 문장에 the region where the lake is located experiencing consistent drops in rainfall levels(그 호수가 위치한 지역은 지속적인 강우량 감소를 겪었다)가 있어요. 본문과 같은 내용이에요.","c":"T"},"h":"bc5eb2a7bc"},{"n":2,"t":"tf","q":"Lake Chad’s water has evaporated more slowly than the water of deeper lakes because the lake is very shallow.","ko":"차드 호수는 매우 얕기 때문에 그 물이 깊은 호수의 물보다 더 느리게 증발해 왔다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The fact that the lake is very shallow means that its water has evaporated more quickly than that of deeper lakes.","호수가 매우 얕다는 사실은 그것의 물이 깊은 호수의 물보다 더 빨리 증발한다는 것을 뜻한다."]],"w":"7번 문장은 얕은 호수의 물이 깊은 호수의 물보다 ‘더 빨리(more quickly)’ 증발했다고 해요. 느리게 증발했다는 말은 반대예요.","c":"F"},"h":"ac1cb39ded"},{"n":3,"t":"tf","q":"Today, around 20 million people are believed to depend on Lake Chad.","ko":"오늘날 약 2천만 명의 사람들이 차드 호수에 의존한다고 여겨진다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Today, it is believed that around 20 million people depend on it.","오늘날, 약 2천만 명의 사람들이 그 호수에 의존하고 있다고 여겨진다."]],"w":"11번 문장에 around 20 million people depend on it(약 2천만 명이 그 호수에 의존한다)이 그대로 있어요.","c":"T"},"h":"bad6957c1f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… a range of factors are most likely responsible for the change.)","ko":"… 다양한 요인들이 그 변화의 원인인 것 같다.","opts":["원인이 되는","상관없는","기록하는","반대하는"],"word":"responsible","r":{"a":"1) 원인이 되는","ev":"4번 문장","s":[[4,"The reports explain that a range of factors are most likely responsible for the change.","보고는 다양한 요인들이 그 변화의 원인인 것 같다고 설명한다."]],"w":"4번은 줄어든 변화의 이유를 설명하려는 문장이에요. be responsible for는 여기서 ‘~의 원인이 되다’라는 뜻이에요. 사전에서 ‘책임이 있는’으로만 외우면 헷갈려요.","c":1},"h":"2cbf6e4779"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… the lake may be able to sustain human populations for a while longer, …)","ko":"… 호수가 잠깐 동안은 인구를 부양할 수 있을지도 모르지만, …","opts":["멸종시키다","옮기다","부양하다","의심하다"],"word":"sustain","r":{"a":"3) 부양하다","ev":"14번 문장","s":[[14,"Moreover, while the lake may be able to sustain human populations for a while longer, the rich wildlife surrounding the lake is expected to die out in the near future.","게다가, 호수가 잠깐 동안은 인구를 부양할 수 있을지도 모르지만, 호수 주위의 풍부한 야생 생물은 가까운 미래에 멸종될 것으로 예상된다."]],"w":"while 뒤의 내용은 ‘호수가 사람들을 잠깐은 더 먹여 살릴 수 있을지도 모른다’는 뜻이에요. 뒤의 주절에서 야생 생물이 멸종된다(die out)고 대비하니, sustain은 ‘(생명을) 유지하다, 부양하다’예요.","c":3},"h":"a0d503d8af"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey expect global warming to get worse and believe competition over water resources will become more intense.","ko":"밑줄 친 They가 가리키는 것은?","opts":["주민들","연구원들","여섯 국가의 정부들","야생 생물"],"sko":"그들은 지구 온난화가 더 악화될 것이라고 예상하며, 수자원에 대한 경쟁이 더 치열해질 것이라고 믿는다.","r":{"a":"2) 연구원들","ev":"12~13번 문장","s":[[12,"Unfortunately, the researchers are not optimistic about the future.","안타깝게도, 연구원들은 미래에 대해 낙관적이지 않다."],[13,"They expect global warming to get worse and believe competition over water resources will become more intense.","그들은 지구 온난화가 더 악화될 것이라고 예상하며, 수자원에 대한 경쟁이 더 치열해질 것이라고 믿는다."]],"w":"12번의 the researchers(연구원들)가 낙관적이지 않다고 하고, 13번의 They가 그 연구원들을 받아서 무엇을 예상하는지 이어서 말해요.","c":2},"h":"a08a5e8152"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"What’s worse, projections show that this trend will continue, leaving the lake as little more than a puddle in a few years.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["예측에 따르면 호수는 몇 년 안에 물웅덩이보다 훨씬 커질 것이다.","이 추세가 계속되면 몇 년 안에 호수는 물웅덩이 정도밖에 남지 않게 된다.","예측이 틀려서 호수는 곧 원래 크기로 돌아올 것이다.","호수 근처에 작은 물웅덩이가 새로 많이 생기게 된다."],"sko":"더 심각하게는, 예측에 따르면 이러한 추세가 계속될 것이며, 몇 년 안에 호수는 물웅덩이에 지나지 않을 것이라고 한다.","r":{"a":"2) 이 추세가 계속되면 몇 년 안에 호수는 물웅덩이 정도밖에 남지 않게 된다.","ev":"3번 문장","s":[[3,"What’s worse, projections show that this trend will continue, leaving the lake as little more than a puddle in a few years.","더 심각하게는, 예측에 따르면 이러한 추세가 계속될 것이며, 몇 년 안에 호수는 물웅덩이에 지나지 않을 것이라고 한다."]],"w":"little more than a puddle은 ‘물웅덩이에 지나지 않는’이라는 뜻이에요. 추세가 계속되면 몇 년 안에 호수가 물웅덩이 정도만 남는다는 말이라 2번이 맞아요. 1번과 3번은 반대이고, 4번은 본문에 없어요.","c":2},"h":"c10c983089"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Lake Chad has recently grown larger because of heavy rains.","The population in the region has been decreasing in recent years.","The lake has been a precious source of water for people in six countries.","Researchers expect competition over water to become weaker."],"oko":["차드 호수는 최근 많은 비 때문에 더 커졌다.","그 지역의 인구는 최근 몇 년 동안 줄어들고 있다.","그 호수는 여섯 국가 사람들에게 소중한 수원이 되어 왔다.","연구원들은 물에 대한 경쟁이 약해질 것으로 예상한다."],"r":{"a":"3) The lake has been a precious source of water for people in six countries.","ev":"2번, 9번, 10번, 13번 문장","s":[[2,"Now, reports from NASA researchers indicate that it has shrunk by nearly 95 percent since 1963.","지금, 나사(NASA) 연구원들의 보고는 1963년 이래로 차드 호수가 95퍼센트 가까이 줄어들었다는 것을 보여 준다."],[9,"The population in the region has increased dramatically in recent years, meaning many more people are relying on the lake to fill their water needs.","그 지역의 인구는 최근 몇 년 동안 급격히 증가했는데, 이는 더 많은 사람들이 그들의 물 수요를 충족하기 위해 그 호수에 의존하고 있다는 것을 의미한다."],[10,"The lake has traditionally been a precious source of water for people across six countries— Sudan, Chad, Niger, Nigeria, Cameroon, and the Central African Republic.","그 호수는 전통적으로 수단, 차드, 니제르, 나이지리아, 카메룬, 그리고 중앙 아프리카 공화국, 이 여섯 국가의 사람들에게 소중한 수원이 되어 왔다."],[13,"They expect global warming to get worse and believe competition over water resources will become more intense.","그들은 지구 온난화가 더 악화될 것이라고 예상하며, 수자원에 대한 경쟁이 더 치열해질 것이라고 믿는다."]],"w":"10번에서 호수는 전통적으로 여섯 국가 사람들에게 소중한 수원이었어요. 호수는 95퍼센트 가까이 줄었고(2번), 인구는 급격히 늘었고(9번), 물 경쟁은 더 치열해질 것(13번)이라 나머지는 틀려요.","c":3},"h":"9290943ce1"},{"n":9,"t":"sum","q":"Lake Chad has (A) sharply for several reasons, and researchers are (B) about its future.","ko":"차드 호수는 여러 이유로 급격히 (A)했고, 연구원들은 그 미래에 대해 (B)이다.","opts":["(A) grown / (B) hopeful","(A) moved / (B) pessimistic","(A) shrunk / (B) pessimistic","(A) shrunk / (B) hopeful","(A) grown / (B) worried"],"oko":["(A) 커졌다 / (B) 희망적이다","(A) 이동했다 / (B) 비관적이다","(A) 줄어들었다 / (B) 비관적이다","(A) 줄어들었다 / (B) 희망적이다","(A) 커졌다 / (B) 걱정스럽다"],"r":{"a":"3) (A) shrunk / (B) pessimistic","ev":"2번, 12번 문장","s":[[2,"Now, reports from NASA researchers indicate that it has shrunk by nearly 95 percent since 1963.","지금, 나사(NASA) 연구원들의 보고는 1963년 이래로 차드 호수가 95퍼센트 가까이 줄어들었다는 것을 보여 준다."],[12,"Unfortunately, the researchers are not optimistic about the future.","안타깝게도, 연구원들은 미래에 대해 낙관적이지 않다."]],"w":"2번에서 호수는 95퍼센트 가까이 줄었고(shrunk), 12번에서 연구원들은 미래에 대해 낙관적이지 않다(not optimistic)고 해요. 즉 (A)는 shrunk, (B)는 낙관의 반대인 pessimistic이에요.","c":3},"h":"9c0ee149e2"},{"n":10,"t":"fill","q":"The change in Lake Chad is caused by global warming, its [A] geographical features, and [B] use of water.","ko":"차드 호수의 변화는 지구 온난화, 그 호수 [A] 지리적 특징, 그리고 [B] 물 사용 때문에 일어난다.","bank":["particular","excessive","consistent","dramatic","precious","responsible"],"bko":{"particular":"특유의","excessive":"과도한","consistent":"변함없는","dramatic":"급격한","precious":"소중한","responsible":"책임이 있는"},"r":{"a":"[A] particular, [B] excessive","ev":"5번, 6번, 8번 문장","s":[[5,"First of all, global warming over the last few decades has played a part, with the region where the lake is located experiencing consistent drops in rainfall levels.","우선, 지난 수십 년에 걸친 지구 온난화가 일조하여, 그 호수가 위치한 지역은 지속적인 강우량 감소를 겪었다."],[6,"Secondly, the particular geographical features of the lake have contributed to the problem.","둘째로, 그 호수 특유의 지리적 특징이 그 문제의 한 원인이 되었다."],[8,"The final reason is excessive use of water for drinking and farming.","마지막 이유는 식수와 농업을 위한 과도한 물의 사용이다."]],"w":"원인 세 가지 중 5번은 지구 온난화, 6번은 ‘호수 특유의(particular) 지리적 특징’, 8번은 ‘과도한(excessive) 물 사용’이에요. consistent는 5번에서 강우량 감소 앞에 쓰였지, 지리적 특징을 꾸미는 말이 아니에요.","c":null},"h":"dfb8f301ff"}]},{"u":9,"id":"ch3-09-2","no":2,"ko":"우리 식량에 무슨 일이?","items":[{"n":1,"t":"tf","q":"The experiments included food crops such as wheat, rice, and potatoes.","ko":"실험은 밀, 쌀, 감자와 같은 식용 작물을 포함했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The results of the experiments showed that important changes took place in a wide category of plants that includes wheat, rice, potatoes, and other food crops we depend on.","실험 결과는 밀, 쌀, 감자와 우리가 의존하는 기타 식용 작물을 포함하는 폭넓은 작물 범주에서 중요한 변화가 발생했다는 것을 보여 주었다."]],"w":"8번에서 실험 결과가 밀, 쌀, 감자와 우리가 의존하는 기타 식용 작물을 포함하는 폭넓은 작물 범주에서 중요한 변화가 있었다고 해요. 본문과 맞는 내용이에요.","c":"T"},"h":"c3974dd12e"},{"n":2,"t":"tf","q":"All scientists believe that crops with fewer nutrients are the only reason for the drop in nutrition.","ko":"모든 과학자들은 영양분이 적은 작물이 영양 하락의 유일한 이유라고 믿는다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"Some scientists believe this is related to the use of crops that produce more food but contain fewer nutrients.","일부 과학자들은 이것이 더 많은 식량을 생산하지만 더 적은 영양분을 포함하는 식용 작물의 사용과 관련 있다고 믿는다."],[5,"However, others suggest it has been caused by the increase of carbon dioxide (CO2) in the air over the same period.","그러나, 다른 과학자들은 그것이 같은 기간 동안 대기 중 이산화탄소의 증가에 의해 야기되었다고 시사한다."]],"w":"4번은 일부 과학자들(Some scientists)의 의견이고, 5번에서 However, others(다른 과학자들)는 이산화탄소 증가가 원인이라고 해요. 모든 과학자가 같은 생각도 아니고, 유일한 이유도 아니에요.","c":"F"},"h":"ec2b80799d"},{"n":3,"t":"tf","q":"Many people around the world already find it hard to get enough nutrition in their daily diets.","ko":"전 세계의 많은 사람들은 이미 매일의 식사에서 충분한 영양을 얻기 어렵다고 느낀다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Although more studies need to be done, this could potentially lead to an environmental disaster, as many people around the world already struggle to get enough nutrition in their daily diets.","비록 더 많은 연구가 행해져야 하지만, 이것은 잠재적으로 환경 재난으로 이어질 수 있는데, 왜냐하면 전 세계의 많은 사람들이 이미 매일의 식사에서 충분한 영양을 얻기 위해 고군분투하고 있기 때문이다."]],"w":"10번의 as 뒤에 many people around the world already struggle to get enough nutrition(전 세계의 많은 사람들이 이미 충분한 영양을 얻기 위해 고군분투한다)이 있어요.","c":"T"},"h":"6d56916b3c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This has been demonstrated in experiments in which plants were grown …)","ko":"이것은 식물이 재배된 실험들에서 ____되었다.","opts":["숨겨졌다","바뀌었다","입증되었다","취소되었다"],"word":"demonstrated","r":{"a":"3) 입증되었다","ev":"6~7번 문장","s":[[6,"Although plants require CO2 to grow, a large increase in CO2 seems to have a negative effect on them.","비록 식물이 자라는 데 이산화탄소가 필요하지만, 이산화탄소의 큰 증가는 식물에 부정적인 영향을 미치는 것처럼 보인다."],[7,"This has been demonstrated in experiments in which plants were grown in an indoor space with high CO2 levels.","이
