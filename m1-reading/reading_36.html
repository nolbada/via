ave a plan B.","우리는 차선책이 있어요.",0],["Our plan B is taking the train.”","우리의 차선책은 기차를 타는 거예요.”라고 말했다.",0],["Dad said, “Great!","아빠는 “훌륭해!",0],["You had another plan.","너는 또 다른 계획이 있었구나.",0],["Thanks to you, we can be there in time.”","네 덕분에 그곳에 제시간에 갈 수 있겠다.”라고 말씀하셨다.",0],["So we took the train, and it even had a special ondol room!","그래서 우리는 기차를 탔는데, 그 기차는 특별한 온돌방까지 갖추고 있었다!",0],["Dad and I really enjoyed riding on the train.","아빠와 나는 그 기차를 타는 것을 정말 즐겼다.",0],["We got there in time.","우리는 그곳에 시간 안에 도착했다.",0],["Hooray!","만세!",0],["We had another problem.","우리에게는 또 다른 문제가 있었다.",1],["There was no strawberry cake at the bakery.","빵집에 딸기 케이크가 없었다.",0],["We got a carrot cake instead.","우리는 대신 당근 케이크를 샀다.",0],["Finally, we met Grandma at the seafood restaurant.","마침내, 우리는 해산물 식당에서 할머니를 만났다.",0],["She loved the food, even the carrot cake!","할머니는 음식을 아주 좋아하셨고, 당근 케이크까지 좋아하셨다!",0],["Her birthday party was a big success.","할머니의 생신 파티는 대성공이었다.",0],["Lastly, we went to the studio.","마지막으로, 우리는 사진관에 갔다.",0],["We put on school uniforms for fun.","우리는 재미로 교복을 입었다.",0],["I said, “Grandma, you look like a student in that uniform.”","나는 “할머니, 그 교복을 입으시니 학생 같아 보여요.”라고 말했다.",0],["We took very nice pictures together.","우리는 함께 아주 멋진 사진들을 찍었다.",0],["My grandma looked so happy.","할머니는 매우 행복해 보이셨다.",0],["She said, “Thank you for everything today. I love you so much!”","할머니는 “오늘 모든 게 고맙구나. 할머니가 정말 많이 사랑한단다!”라고 말씀하셨다.",0],["My plan did not work out perfectly, but I was not upset.","나의 계획은 완벽하게 풀리지는 않았지만, 나는 속상하지 않았다.",1],["I had another plan.","나에게는 또 다른 계획이 있었다.",0],["Plan B was great, too!","차선책도 훌륭했다!",1]];var RNUM=36;var TITLE_EN="Plan B Was Great, Too!";var PASS_EN=["Plan B Was Great, Too!","This Saturday is my grandma’s birthday. Dad and I will visit her in Gunsan. Dad usually makes plans for our family trips, but I will make a plan this time!","My Plan","First, I need bus tickets! I will buy tickets for the first bus from Suwon to Gunsan. The streets will not be busy early in the morning.","Second, I will get a birthday cake! I will buy a strawberry cake at a famous bakery in Gunsan. My grandma loves strawberries.","Third, I will prepare for my grandma’s birthday party! I will find a nice seafood restaurant.","Fourth, we will take family pictures! Taking family photos in a studio will be great. I’m so excited!","On Grandma’s Birthday","My plan looked perfect. But Dad and I woke up late and missed the bus. I said, “It’s okay, Dad. We have a plan B. Our plan B is taking the train.” Dad said, “Great! You had another plan. Thanks to you, we can be there in time.” So we took the train, and it even had a special ondol room! Dad and I really enjoyed riding on the train. We got there in time. Hooray!","We had another problem. There was no strawberry cake at the bakery. We got a carrot cake instead. Finally, we met Grandma at the seafood restaurant. She loved the food, even the carrot cake! Her birthday party was a big success.","My plan did not work out perfectly, but I was not upset. I had another plan. Plan B was great, too!"];var PASS_KO=["차선책도 좋았어요!","이번 토요일은 나의 할머니의 생신이다. 아빠와 나는 군산에 계신 할머니를 방문할 것이다. 아빠가 보통 우리 가족여행의 계획을 세우시지만, 이번에는 내가 계획을 세울 것이다!","나의 계획","첫 번째, 나는 버스표가 필요하다! 나는 수원에서 군산으로 가는 첫 버스표를 살 것이다. 이른 아침에는 길이 막히지 않을 것이다.","두 번째, 나는 생일 케이크를 살 것이다! 나는 군산에서 유명한 빵집에서 딸기 케이크를 살 것이다. 할머니는 딸기를 무척 좋아하신다.","세 번째, 나는 할머니의 생신 파티를 준비할 것이다! 나는 좋은 해산물 식당을 찾을 것이다.","네 번째, 우리는 가족사진을 찍을 것이다! 사진관에서 가족사진을 찍는 것은 멋질 것이다. 나는 정말 기대된다!","할머니 생신날","나의 계획은 완벽해 보였다. 그러나 아빠와 나는 늦게 일어나서 버스를 놓쳤다. 나는 “괜찮아요, 아빠. 우리는 차선책이 있어요. 우리의 차선책은 기차를 타는 거예요.”라고 말했다. 아빠는 “훌륭해! 너는 또 다른 계획이 있었구나. 네 덕분에 그곳에 제시간에 갈 수 있겠다.”라고 말씀하셨다. 그래서 우리는 기차를 탔는데, 그 기차는 특별한 온돌방까지 갖추고 있었다! 아빠와 나는 그 기차를 타는 것을 정말 즐겼다. 우리는 그곳에 시간 안에 도착했다. 만세!","우리에게는 또 다른 문제가 있었다. 빵집에 딸기 케이크가 없었다. 우리는 대신 당근 케이크를 샀다. 마침내, 우리는 해산물 식당에서 할머니를 만났다. 할머니는 음식을 아주 좋아하셨고, 당근 케이크까지 좋아하셨다! 할머니의 생신 파티는 대성공이었다.","마지막으로, 우리는 사진관에 갔다. 우리는 재미로 교복을 입었다. 나는 “할머니, 그 교복을 입으시니 학생 같아 보여요.”라고 말했다. 우리는 함께 아주 멋진 사진들을 찍었다. 할머니는 매우 행복해 보이셨다. 할머니는 “오늘 모든 게 고맙
