var D=[{"n": 1, "tag": null, "en": "An new school year started! You can makes new friends and be a good friend to others, too.", "ko": "새로운 학년이 시작되었습니다! 여러분은 새로운 친구를 사귀고, 다른 이들에게 좋은 친구가 될 수도 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "An", "right": "A", "partial": false, "at": [0], "point": "관사 a/an: new는 자음 소리라 a new 사용", "topic": "관사 a/an", "memo": "new는 자음 소리라 a new 사용"}, {"wrong": "makes", "right": "make", "partial": false, "at": [7], "point": "조동사: 조동사 can 뒤에는 동사원형 make 사용", "topic": "조동사", "memo": "조동사 can 뒤에는 동사원형 make 사용"}]}, {"n": 2, "tag": null, "en": "What kind of friend do you want to be? Three student will tell you their stories.", "ko": "여러분은 어떤 종류의 친구가 되고 싶은가요? 세 학생이 여러분에게 그들의 이야기를 들려줄 겁니다.", "ok": false, "foot": [], "fixes": [{"wrong": "student", "right": "students", "partial": false, "at": [10], "point": "명사의 복수형: Three 뒤에는 복수명사 students 사용", "topic": "명사의 복수형", "memo": "Three 뒤에는 복수명사 students 사용"}]}, {"n": 3, "tag": "보라 · 친구의 기쁨", "en": "I want to be someone who is happy about my friends' good news. Minji and me are both interested in art.", "ko": "나는 친구의 좋은 소식에 기뻐하는 사람이 되고 싶어요. 민지와 나는 둘 다 미술에 관심이 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "me", "right": "I", "partial": false, "at": [15], "point": "인칭대명사의 주격: 주어 자리에는 주격 I 사용", "topic": "인칭대명사의 주격", "memo": "주어 자리에는 주격 I 사용"}]}, {"n": 4, "tag": null, "en": "When she won first prize in the school's art competition, I felt jealously. I couldn't congratulate her at first.", "ko": "그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요. 처음에 나는 그녀를 축하할 수 없었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "jealously", "right": "jealous", "partial": false, "at": [12], "point": "형용사와 부사: feel 뒤 보어는 형용사 jealous 사용", "topic": "형용사와 부사", "memo": "feel 뒤 보어는 형용사 jealous 사용"}]}, {"n": 5, "tag": null, "en": "But I knew she worked really hard. Final, I congratulated her, and she was happy about it.", "ko": "하지만 나는 그녀가 정말 열심히 노력한 것을 알았어요. 결국 나는 그녀를 축하해 주었고 그녀는 그것을 기뻐했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "Final", "right": "Finally", "partial": false, "at": [7], "point": "형용사와 부사: 문장을 꾸미는 부사 Finally 사용", "topic": "형용사와 부사", "memo": "문장을 꾸미는 부사 Finally 사용"}]}, {"n": 6, "tag": "강민 · 솔직한 충고", "en": "I want to be a friend who gives honest advices. One of my friends were always late.", "ko": "나는 솔직한 충고를 해주는 친구가 되고 싶어요. 내 친구 중 하나는 항상 늦었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "advices", "right": "advice", "partial": false, "at": [9], "point": "셀 수 없는 명사: advice는 셀 수 없어 복수형 안 씀", "topic": "셀 수 없는 명사", "memo": "advice는 셀 수 없어 복수형 안 씀"}, {"wrong": "were", "right": "was", "partial": false, "at": [14], "point": "be동사의 수일치: 주어 One(단수)이므로 was (were 아님)", "topic": "be동사의 수일치", "memo": "주어 One(단수)이므로 was (were 아님)"}]}, {"n": 7, "tag": null, "en": "People has to wait for him, and it made everyone upset. So, I decided to talk to him.", "ko": "사람들은 그를 기다려야 했고, 그게 모두를 속상하게 만들었어요. 그래서 나는 그에게 이야기하기로 마음을 먹었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "has", "right": "had", "partial": false, "at": [1], "point": "동사의 수일치: 주어 People(복수)은 have to (has 아님)", "topic": "동사의 수일치", "memo": "주어 People(복수)은 have to (has 아님)"}]}, {"n": 8, "tag": null, "en": "\"Can you please being on time?\" I said.", "ko": "나는 \"시간을 지켜주겠니?\" 라고 말했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "being", "right": "be", "partial": false, "at": [3], "point": "조동사: Can you 뒤에는 동사원형 be 사용", "topic": "조동사", "memo": "Can you 뒤에는 동사원형 be 사용"}]}, {"n": 9, "tag": null, "en": "\"We want fully enjoy our time together.\" Talking to my friend about this problem were not easy.", "ko": "\"우리는 우리의 시간을 온전히 함께 즐기고 싶어. 이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요.", "ok": false, "foot": [], "fixes": [{"wrong": "fully", "right": "to fully", "partial": false, "at": [2], "point": "to부정사: want 뒤에는 to부정사 to enjoy 사용", "topic": "to부정사", "memo": "want 뒤에는 to부정사 to enjoy 사용", "alt": [1]}, {"wrong": "were", "right": "was", "partial": false, "at": [14], "point": "be동사: 동명사 주어 Talking은 단수라 was 사용", "topic": "be동사", "memo": "동명사 주어 Talking은 단수라 was 사용"}]}, {"n": 10, "tag": null, "en": "But thankfully, he understood. Now he is always on time!", "ko": "하지만 고맙게도 그는 이해했어요. 이제 그는 항상 시간을 지켜요!", "ok": true, "foot": [], "fixes": []}, {"n": 11, "tag": "시연 · 힘든 친구 격려", "en": "I try to cheer up my friends when them are having a hard time. One day, Jisu posted, \"It was a hard day,\" on her social media.", "ko": "나는 친구들이 힘든 시간을 보낼 때 그들을 격려하려 노력해요. 어느 날 지수가 자신의 소셜 미디어에 \"힘든 하루였다.\"라고 게시했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "them", "right": "they", "partial": false, "at": [8], "point": "인칭대명사의 주격: 주어 자리에는 주격 they 사용", "topic": "인칭대명사의 주격", "memo": "주어 자리에는 주격 they 사용"}]}, {"n": 12, "tag": null, "en": "I wanted to do something to made her happy. So, I bought her chocolate cookies, her favorite snack.", "ko": "나는 그녀를 기쁘게 하기 위해 무언가를 하고 싶었어요. 그래서 나는 그녀가 제일 좋아하는 간식인 초콜릿 쿠키를 그녀에게 사주었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "made", "right": "make", "partial": false, "at": [6], "point": "to부정사: to 뒤에는 동사원형 make 사용", "topic": "to부정사", "memo": "to 뒤에는 동사원형 make 사용"}]}, {"n": 13, "tag": null, "en": "Then we watched a movie that had an funny story and took pictures together at a photo booths.", "ko": "그런 다음 우리는 재미있는 이야기로 된 영화를 보고, 사진 촬영 부스에서 함께 사진을 찍었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [7], "point": "관사 a/an: funny는 자음 소리라 a funny 사용", "topic": "관사 a/an", "memo": "funny는 자음 소리라 a funny 사용"}, {"wrong": "booths", "right": "booth", "partial": false, "at": [17], "point": "명사의 복수형: a 뒤에는 단수명사 booth 사용", "topic": "명사의 복수형", "memo": "a 뒤에는 단수명사 booth 사용"}]}, {"n": 14, "tag": null, "en": "We had a great time, and she said she felt more better.", "ko": "우리는 좋은 시간을 보냈고, 그녀는 기분이 나아졌다고 말했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "more better", "right": "better", "partial": false, "at": [10], "point": "비교급: better는 이미 비교급이라 more 불필요", "topic": "비교급", "memo": "better는 이미 비교급이라 more 불필요"}]}];var PP=[["A new school year started!", "새로운 학년이 시작되었습니다!", 1], ["You can make new friends and be a good friend to others, too.", "여러분은 새로운 친구를 사귀고, 다른 이들에게 좋은 친구가 될 수도 있습니다.", 0], ["What kind of friend do you want to be?", "여러분은 어떤 종류의 친구가 되고 싶은가요?", 0], ["Three students will tell you their stories.", "세 학생이 여러분에게 그들의 이야기를 들려줄 겁니다.", 0], ["Bora", "보라", 1], ["I want to be someone who is happy about my friends' good news.", "나는 친구의 좋은 소식에 기뻐하는 사람이 되고 싶어요.", 1], ["Minji and I are both interested in art.", "민지와 나는 둘 다 미술에 관심이 있어요.", 0], ["When she won first prize in the school's art competition, I felt jealous.", "그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요.", 0], ["I couldn't congratulate her at first.", "처음에 나는 그녀를 축하할 수 없었어요.", 0], ["But I knew she worked really hard.", "하지만 나는 그녀가 정말 열심히 노력한 것을 알았어요.", 0], ["Finally, I congratulated her, and she was happy about it.", "결국 나는 그녀를 축하해 주었고 그녀는 그것을 기뻐했어요.", 0], ["Kangmin", "강민", 1], ["I want to be a friend who gives honest advice.", "나는 솔직한 충고를 해주는 친구가 되고 싶어요.", 1], ["One of my friends was always late.", "내 친구 중 하나는 항상 늦었어요.", 0], ["People had to wait for him, and it made everyone upset.", "사람들은 그를 기다려야 했고, 그게 모두를 속상하게 만들었어요.", 0], ["So, I decided to talk to him.", "그래서 나는 그에게 이야기하기로 마음을 먹었어요.", 0], ["\"Can you please be on time?\"", "나는 \"시간을 지켜주겠니?\"", 1], ["I said.", "라고 말했어요.", 0], ["\"We want to fully enjoy our time together.\"", "\"우리는 우리의 시간을 온전히 함께 즐기고 싶어.", 0], ["Talking to my friend about this problem was not easy.", "이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요.", 0], ["But thankfully, he understood.", "하지만 고맙게도 그는 이해했어요.", 0], ["Now he is always on time!", "이제 그는 항상 시간을 지켜요!", 0], ["Siyeon", "시연", 1], ["I try to cheer up my friends when they are having a hard time.", "나는 친구들이 힘든 시간을 보낼 때 그들을 격려하려 노력해요.", 1], ["One day, Jisu posted, \"It was a hard day,\" on her social media.", "어느 날 지수가 자신의 소셜 미디어에 \"힘든 하루였다.\"라고 게시했어요.", 0], ["I wanted to do something to make her happy.", "나는 그녀를 기쁘게 하기 위해 무언가를 하고 싶었어요.", 0], ["So, I bought her chocolate cookies, her favorite snack.", "그래서 나는 그녀가 제일 좋아하는 간식인 초콜릿 쿠키를 그녀에게 사주었어요.", 0], ["Then we watched a movie that had a funny story and took pictures together at a photo booth.", "그런 다음 우리는 재미있는 이야기로 된 영화를 보고, 사진 촬영 부스에서 함께 사진을 찍었어요.", 0], ["We had a great time, and she said she felt better.", "우리는 좋은 시간을 보냈고, 그녀는 기분이 나아졌다고 말했어요.", 0]];var RNUM=1;var TITLE_EN="What Kind of Friend Are You?";var PASS_EN=["What Kind of Friend Are You?", "A new school year started! You can make new friends and be a good friend to others, too. What kind of friend do you want to be? Three students will tell you their stories.", "Bora", "I want to be someone who is happy about my friends' good news. Minji and I are both interested in art. When she won first prize in the school's art competition, I felt jealous. I couldn't congratulate her at first. But I knew she worked really hard. Finally, I congratulated her, and she was happy about it.", "Kangmin", "I want to be a friend who gives honest advice. One of my friends was always late. People had to wait for him, and it made everyone upset. So, I decided to talk to him.", "\"Can you please be on time?\" I said. \"We want to fully enjoy our time together.\" Talking to my friend about this problem was not easy. But thankfully, he understood. Now he is always on time!", "Siyeon", "I try to cheer up my friends when they are having a hard time. One day, Jisu posted, \"It was a hard day,\" on her social media. I wanted to do something to make her happy. So, I bought her chocolate cookies, her favorite snack. Then we watched a movie that had a funny story and took pictures together at a photo booth. We had a great time, and she said she felt better."];var PASS_KO=["당신은 어떤 종류의 친구인가요?", "새로운 학년이 시작되었습니다! 여러분은 새로운 친구를 사귀고, 다른 이들에게 좋은 친구가 될 수도 있습니다. 여러분은 어떤 종류의 친구가 되고 싶은가요? 세 학생이 여러분에게 그들의 이야기를 들려줄 겁니다.", "보라", "나는 친구의 좋은 소식에 기뻐하는 사람이 되고 싶어요. 민지와 나는 둘 다 미술에 관심이 있어요. 그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요. 처음에 나는 그녀를 축하할 수 없었어요. 하지만 나는 그녀가 정말 열심히 노력한 것을 알았어요. 결국 나는 그녀를 축하해 주었고 그녀는 그것을 기뻐했어요.", "강민", "나는 솔직한 충고를 해주는 친구가 되고 싶어요. 내 친구 중 하나는 항상 늦었어요. 사람들은 그를 기다려야 했고, 그게 모두를 속상하게 만들었어요. 그래서 나는 그에게 이야기하기로 마음을 먹었어요.", "나는 \"시간을 지켜주겠니?\" 라고 말했어요. \"우리는 우리의 시간을 온전히 함께 즐기고 싶어. 이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요. 하지만 고맙게도 그는 이해했어요. 이제 그는 항상 시간을 지켜요!", "시연", "나는 친구들이 힘든 시간을 보낼 때 그들을 격려하려 노력해요. 어느 날 지수가 자신의 소셜 미디어에 \"힘든 하루였다.\"라고 게시했어요. 나는 그녀를 기쁘게 하기 위해 무언가를 하고 싶었어요. 그래서 나는 그녀가 제일 좋아하는 간식인 초콜릿 쿠키를 그녀에게 사주었어요. 그런 다음 우리는 재미있는 이야기로 된 영화를 보고, 사진 촬영 부스에서 함께 사진을 찍었어요. 우리는 좋은 시간을 보냈고, 그녀는 기분이 나아졌다고 말했어요."];
var BG=[{"qs": [{"n": 6, "q": "다음 글의 내용과 일치하지 않는 것은?", "o": ["It's the beginning of a new school year.", "Bora and Minji have an interest in art.", "At first, Bora was happy with Minji's first prize.", "Minji tried hard in the school's art competition.", "Bora congratulated Minji in the end."], "a": 2, "ans": "At first, Bora was happy with Minji's first prize.", "evs": [["When she won first prize in the school's art competition, I felt jealous.", "그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요."], ["I couldn't congratulate her at first.", "처음에 나는 그녀를 축하할 수 없었어요."]], "ev": ["When she won first prize in the school's art competition, I felt jealous.", "그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요."], "ow": ["오답 ✕ — 본문에 'A new school year started!'(새로운 학년이 시작되었습니다!)라고 했으므로 이 보기는 본문과 일치한다. 일치하지 않는 것을 고르는 문제라서 틀림.", "오답 ✕ — 본문에 'Minji and I are both interested in art.'(민지와 나는 둘 다 미술에 관심이 있어요.)라고 했으므로 이 보기는 본문과 일치해서 틀림.", "정답 ○ — 본문에는 'I felt jealous. I couldn't congratulate her at first.'(나는 질투가 났어요. 처음에 나는 그녀를 축하할 수 없었어요.)라고 했는데, 이 보기는 처음에 기뻐했다고 해서 본문과 일치하지 않는다.", "오답 ✕ — 본문에 'I knew she worked really hard.'(나는 그녀가 정말 열심히 노력한 것을 알았어요.)라고 했으므로 이 보기는 본문과 일치해서 틀림.", "오답 ✕ — 본문에 'Finally, I congratulated her'(결국 나는 그녀를 축하해 주었고)라고 했으므로 이 보기는 본문과 일치해서 틀림."], "memo": ["정답 ③: 보라는 처음에는 민지의 우승을 기뻐하지 못했다(질투함).", "근거: I felt jealous. I couldn't congratulate her at first.(나는 질투가 났어요. 처음에 나는 그녀를 축하할 수 없었어요.)", "함정: 일치하지 않는 것 찾기! at first(처음에)는 질투, finally(결국)는 축하"], "why": "보라는 처음에는 질투가 나서 민지의 우승을 축하하지 못했다.", "ko": ["새 학년이 시작되는 때이다.", "보라와 민지는 미술에 관심이 있다.", "처음에 보라는 민지의 1등 상을 기뻐했다.", "민지는 학교 미술 대회에서 열심히 노력했다.", "보라는 결국 민지를 축하해 주었다."]}, {"n": 7, "q": "다음은 윗글 Bora의 이야기를 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?", "o": ["jealous - congratulated", "jealous - ignored", "proud - congratulated", "angry - thanked", "sad - invited"], "a": 0, "ans": "jealous - congratulated", "evs": [["When she won first prize in the school's art competition, I felt jealous.", "그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요."], ["Finally, I congratulated her, and she was happy about it.", "결국 나는 그녀를 축하해 주었고 그녀는 그것을 기뻐했어요."]], "ev": ["When she won first prize in the school's art competition, I felt jealous.", "그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요."], "ow": ["정답 ○ — 'I felt jealous'(나는 질투가 났어요)이므로 (A)는 jealous이고, 'Finally, I congratulated her'(결국 나는 그녀를 축하해 주었고)이므로 (B)는 congratulated이다.", "오답 ✕ — jealous는 맞지만, 보라는 끝까지 무시한(ignored) 것이 아니라 'Finally, I congratulated her'(결국 나는 그녀를 축하해 주었고)라고 했다.", "오답 ✕ — congratulated는 맞지만, 처음 느낀 감정은 자랑스러움(proud)이 아니라 'I felt jealous.'(나는 질투가 났어요.)이다.", "오답 ✕ — 화가 났다(angry)는 말은 없고, 'I congratulated her'(나는 그녀를 축하해 주었다)이지 고마워한(thanked) 것도 아니라서 틀림.", "오답 ✕ — 슬펐다(sad)는 말도, 민지를 초대했다(invited)는 말도 본문에 없다. 'I felt jealous.'(질투가 났어요.)와 맞지 않아 틀림."], "memo": ["정답 jealous - congratulated: 처음엔 질투했지만 결국 축하해 주었다.", "근거: I felt jealous.(나는 질투가 났어요.) / Finally, I congratulated her(결국 나는 그녀를 축하해 주었고)", "함정: 처음 감정은 proud가 아니라 jealous ✕"], "why": "보라는 질투를 이기고 결국 민지의 우승을 축하해 주었다.", "sum": "Bora felt (A)______ when Minji won first prize, but in the end she (B)______ her.", "lab": "완성된 요약문 : ", "ko": ["질투하는 - 축하했다", "질투하는 - 무시했다", "자랑스러운 - 축하했다", "화난 - 고마워했다", "슬픈 - 초대했다"], "note": {"en": "Bora felt jealous when Minji won first prize, but in the end she congratulated her.", "ko": "보라는 민지가 1등상을 받았을 때 질투했지만, 결국에는 민지를 축하해 주었다.", "words": [["jealous", "질투하는, 시기하는"], ["congratulated", "축하하다 (congratulate의 과거형)"]]}}], "pp": [["A new school year started!", "새로운 학년이 시작되었습니다!"], ["You can make new friends and be a good friend to others, too.", "여러분은 새로운 친구를 사귀고, 다른 이들에게 좋은 친구가 될 수도 있습니다."], ["What kind of friend do you want to be?", "여러분은 어떤 종류의 친구가 되고 싶은가요?"], ["Three students will tell you their stories.", "세 학생이 여러분에게 그들의 이야기를 들려줄 겁니다."], ["Bora", "보라"], ["I want to be someone who is happy about my friends' good news.", "나는 친구의 좋은 소식에 기뻐하는 사람이 되고 싶어요."], ["Minji and I are both interested in art.", "민지와 나는 둘 다 미술에 관심이 있어요."], ["When she won first prize in the school's art competition, I felt jealous.", "그녀가 학교
