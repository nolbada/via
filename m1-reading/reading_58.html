var D=[{"n":1,"tag":null,"en":"Lesein Mutunkei are a young man from Kenya. He loves playing soccer, and he cares about the environment.","ko":"Lesein Mutunkei는 케냐의 청년이다. 그는 축구하는 것을 정말 좋아하고 환경에 대해 관심이 있다.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[2],"point":"be동사 수일치·과거: 주어 Lesein Mutunkei(단수): is (are 아님)","topic":"be동사 수일치·과거","memo":"주어 Lesein Mutunkei(단수): is (are 아님)"}]},{"n":2,"tag":null,"en":"In the past, people on Kenya cut down a lot of tree for farming. Every days, more than 50 soccer fields of forest land disappeared.","ko":"과거에 케냐 사람들은 농사를 위해 많은 나무를 베었다. 매일 50개 이상의 축구 경기장 크기의 숲이 사라졌다.","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"in","partial":false,"at":[4],"point":"기본전치사: '케냐에 있는'은 전치사 in 사용","topic":"기본전치사","memo":"'케냐에 있는'은 전치사 in 사용"},{"wrong":"tree","right":"trees","partial":false,"at":[11],"point":"명사의 복수형: a lot of 뒤 복수명사 trees 사용","topic":"명사의 복수형","memo":"a lot of 뒤 복수명사 trees 사용"},{"wrong":"days","right":"day","partial":false,"at":[15],"point":"every + 단수명사: Every 뒤에는 단수명사 day 사용","topic":"every + 단수명사","memo":"Every 뒤에는 단수명사 day 사용"}]},{"n":3,"tag":null,"en":"He was shocked. He wanted to do something for the forests.","ko":"그는 충격을 받았다. 그는 숲을 위해 무언가 하고 싶었다.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"He came up with a idea. It was to planting one tree for each goal in his soccer games.","ko":"그는 아이디어를 하나 생각해 냈다. 그것은 자신의 축구 경기에서 골을 하나 넣을 때마다 나무를 한 그루씩 심는 것이었다.","ok":false,"foot":[],"fixes":[{"wrong":"a","right":"an","partial":false,"at":[4],"point":"관사 a/an: 모음 소리 idea 앞에는 an 사용","topic":"관사 a/an","memo":"모음 소리 idea 앞에는 an 사용"},{"wrong":"planting","right":"plant","partial":false,"at":[9],"point":"to부정사: be to + 동사원형: to plant (planting 아님)","topic":"to부정사","memo":"be to + 동사원형: to plant (planting 아님)"}]},{"n":5,"tag":null,"en":"Before long, he decided to start the Trees for Goals campaign with others.","ko":"오래지 않아, 그는 다른 사람들과 Trees for Goals 캠페인을 시작하기로 결심했다.","ok":true,"foot":[],"fixes occer team members joined his campaign and planted eleven trees for each goal.","그의 축구팀 동료들도 그의 캠페인에 참여했고, 골을 하나 넣을 때마다 열한 그루의 나무를 심었다.",0],["Eleven trees stood for the eleven players on a soccer team.","열한 그루의 나무는 축구팀의 열한 명의 선수들을 상징했다.",0],["Soon, his school baseball team also joined.","곧, 그의 학교 야구팀 또한 캠페인에 참여했다.",0],["Thanks to the campaign, his school planted nearly 1,500 trees around Nairobi.","캠페인 덕분에 그의 학교는 나이로비 주변에 거의 1,500그루의 나무를 심었다.",0],["Now, Lesein's dream is to run his campaign across Kenya and then across Africa.","이제 Lesein의 꿈은 자신의 캠페인을 케냐 전역에서, 그러고 나서 아프리카 전역에서 진행하는 것이다.",1],["He even hopes to work with world-famous soccer players.","그는 심지어 세계적으로 유명한 축구 선수들과 함께 일하기를 희망한다.",0],["Then, more people will join the campaign, and the world will become greener!","그러면 더 많은 사람들이 캠페인에 참여할 것이고, 세상은 더욱 푸르게 될 것이다!",0],["Lesein said, \"There is an African story about a small bird in a forest fire.","Lesein은 \"아프리카에는 산불이 났을 때 작은 새에 관한 이야기가 있습니다.",1],["During the fire, this small bird brought water and tried to put out the fire.","불이 난 동안 이 작은 새는 물을 가져와 불을 끄려고 노력했어요.",0],["Like this little bird, I want to do something for the environment.","이 작은 새처럼 저도 환경을 위해 무언가를 하고 싶습니다.",0],["Small actions can make a big difference.\"","작은 행동들이 큰 변화를 가져올 수 있으니까요.\"라고 말했다.",0]];var RNUM=58;var TITLE_EN="Trees for Goals";var PASS_EN=["Trees for Goals","Lesein Mutunkei is a young man from Kenya. He loves playing soccer, and he cares about the environment.","In the past, people in Kenya cut down a lot of trees for farming. Every day, more than 50 soccer fields of forest land disappeared. He was shocked. He wanted to do something for the forests.","He came up with an idea. It was to plant one tree for each goal in his soccer games. Before long, he decided to start the Trees for Goals campaign with others. His soccer team members joined his campaign and planted eleven trees for each goal. Eleven trees stood for the eleven players on a soccer team. Soon, his school baseball team also joined. Thanks to the campaign, his school planted nearly 1,500 trees around Nairobi.","Now, Lesein's dream is to run his campaign across Kenya and then across Africa. He even hopes to work with world-famous soccer players. Then, more people will join the campaign, and the world will become greener!","Lesein said, \"There is an African story about a small bird in a forest fire. During the fire, this small bird brought water and tried to put out the fire. Like this little bird, I want to do something for the environment. Small actions can make a big difference.\""];var PASS_KO=["골을 넣으면 나무를","Lesein Mutunkei는 케냐의 청년이다. 그는 축구하는 것을 정말 좋아하고 환경에 대해 관심이 있다.","과거에 케냐 사람들은 농사를 위해 많은 나무를 베었다. 매일 50개 이상의 축구 경기장 크기의 숲이 사라졌다. 그는 충격을 받았다. 그는 숲을 위해 무언가 하고 싶었다.","그는 아이디어를 하나 생각해 냈다. 그것은 자신의 축구 경기에서 골을 하나 넣을 때마다 나무를 한 그루씩 심는 것이었다. 오래지 않아, 그는 다른 사람들과 Trees for Goals 캠페인을 시작하기로 결심했다. 그의 축구팀 동료들도 그의 캠페인에 참여했고, 골을 하나 넣을 때마다 열한 그루의 나무를 심었다. 열한 그루의 나무는 축구팀의 열한 명의 선수들을 상징했다. 곧, 그의 학교 야구팀 또한 캠페인에 참여했다. 캠페인 덕분에 그의 학교는 나이로비 주변에 거의 1,500그루의 나무를 심었다.","이제 Lesein의 꿈은 자신의 캠페인을 케냐 전역에서, 그러고 나서 아프리카 전역에서 진행하는 것이다. 그는 심지어 세계적으로 유명한 축구 선수들과 함께 일하기를 희망한다. 그러면 더 많은 사람들이 캠페인에 참여할 것이고, 세상은 더욱 푸르게 될 것이다!","Lesein은 \"아프리카에는 산불이 났을 때 작은 새에 관한 이야기가 있습니다. 불이 난 동안 이 작은 새는 물을 가져와 불을 끄려고 노력했어요. 이 작은 새처럼 저도 환경을 위해 무언가를 하고 싶습니다. 작은 행동들이 큰 변화를 가져올 수 있으니까요.\"라고 말했다."];var DG=[{"qs":[{"n":1,"q":"Why does the girl tell Seho to eat everything on his plate?","o":["Wasting food is bad for the environment.","The bulgogi is too expensive.","Seho's mom will be angry.","Seho needs to grow taller.","The bulgogi will get cold soon."],"a":0,"ans":"Wasting food is bad for the environment.","evs":[["G: Well, you should eat everything on your plate. Wasting food is really bad for the environment.","음, 접시에 있는 것은 다 먹어야 해. 음식을 버리는 것은 환경에 정말 나빠."]],"ev":["G: Well, you should eat everything on your plate. Wasting food is really bad for the environment.","음, 접시에 있는 것은 다 먹어야 해. 음식을 버리는 것은 환경에 정말 나빠."],"ow":["정답 ○ — 소녀는 'Wasting food is really bad for the environment.'(음식을 버리는 것은 환경에 정말 나빠.)라고 이유를 말했으므로 정답.","오답 ✕ — 소녀는 'Wasting food is really bad for the environment.'라고만 했고, 불고기가 비싸다는 말은 대화에 없다.","오답 ✕ — 세호가 'You sound like my mom!'(우리 엄마처럼 말하네!)이라고 한 것일 뿐, 엄마가 화낼 것이라는 말은 없다.","오답 ✕ — 키가 크려면 먹어야 한다는 말은 대화에 없다. 이유는 환경 때문이다.","오답 ✕ — 음식이 식는다는 말은 대화에 없다. 소녀는 음식을 버리는 것이 환경에 나쁘다고 했다."],"memo":["정답 ①: 음식을 버리는 것은 환경에 나쁘기 때문이다.","근거: Wasting food is really bad for the environment.(음식을 버리는 것은 환경에 정말 나빠.)","함정: ③은 세호가 엄마 같다고 한 말을 이유로 착각한 것이라 ✕"],"why":"음식을 버리는 것이 환경에 나쁘기 때문에 접시의 음식을 다 먹으라고 했다."},{"n":2,"q":"What does Seho promise to do?","o":["to save some food for later","to share bulgogi with his mom","to eat all of the food on his plate","to thank his mom for great bulgogi","to take less food on his plate next time"],"a":2,"ans":"to eat all of the food on his plate","evs":[["B: You sound like my mom! Don't worry. I'll finish everything on my plate.","우리 엄마처럼 말하네! 걱정하지 마. 접시에 있는 건 다 먹을게."]],"ev":["B: You sound like my mom! Don't worry. I'll finish everything on my plate.","우리 엄마처럼 말하네! 걱정하지 마. 접시에 있는 건 다 먹을게."],"ow":["오답 ✕ — 세호는 'I'll finish everything on my plate.'(접시에 있는 건 다 먹을게.)라고 했으므로 나중을 위해 음식을 남겨 두겠다는 것이 아니라서 틀림.","오답 ✕ — 세호는 'You sound like my mom!'(우리 엄마처럼 말하네!)이라고 했을 뿐, 엄마와 불고기를 나눠 먹겠다고 약속하지 않았다.","정답 ○ — 세호가 'I'll finish everything on my plate.'(접시에 있는 건 다 먹을게.)라고 했으므로 접시의 음식을 모두 먹겠다고 약속한 것이다.","오답 ✕ — 엄마에게 감사한다는 말은 없다. 'You sound like my mom!'은 소녀가 엄마처럼 말한다는 뜻이다.","오답 ✕ — 'I think I took too much bulgogi.'(불고기를 너무 많이 가져온 것 같아.)라고 했지만 다음에 덜 가져오겠다는 약속은 하지 않았고, 지금 다 먹겠다고 했다."],"memo":["정답 ③: 세호는 접시에 있는 음식을 다 먹겠다고 약속했다.","근거: I'll finish everything on my plate.(접시에 있는 건 다 먹을게.)","함정: ⑤는 다음에 덜 가져오겠다는 말이 아니라 지금 다 먹겠다는 말이라 ✕"],"why":"세호는 접시의 음식을 다 먹겠다고 약속했다."}],"dlg":[["G","Wow, Seho, that's a lot of food on your plate.","와, 세호야, 접시에 음식이 정말 많구나."],["B","I think I took too much bulgogi.","불고기를 너무 많이 가져온 것 같아."],["G","Well, you should eat everything on your plate. Wasting food is really bad for the environment.","음, 접시에 있는 것은 다 먹어야 해. 음식을 버리는 것은 환경에 정말 나빠."],["B","You sound like my mom! Don't worry. I'll finish everything on my plate.","우리 엄마처럼 말하네! 걱정하지 마. 접시에 있는 건 다 먹을게."]]},{"qs":[{"n":3,"q":"위 대화의 주제로 가장 알맞은 것은?","o":["the cleanest beach in town","getting ready for a beach cleanup","useful items for cleaning the streets","a fun beach time under the sunny sky","sharing common interests between friends"],"a":1,"ans":"getting ready for a beach cleanup","evs":[["G: There's a beach cleaning event tomorrow. Do you want to join us, Gijun?","내일 해변 청소 행사가 있어. 기준아, 우리와 함께할래?"],["B: Okay, I will bring my own gloves.","알겠어, 내 장갑은 내가 가져갈게."],["G: Great! Don't forget to bring your hat.","좋아! 모자 가져오는 것 잊지 마."]],"ev":["G: There's a beach cleaning event tomorrow. Do you want to join us, Gijun?","내일 해변 청소 행사가 있어. 기준아, 우리와 함께할래?"],"ow":["오답 ✕ — 대화에는 'There's a beach cleaning event tomorrow.'(내일 해변 청소 행사가 있어.)라는 말은 있지만 가장 깨끗한 해변을 소개하는 내용이 아니라서 틀림.","정답 ○ — 'Do you want to join us, Gijun?'(기준아, 우리와 함께할래?), 'I will bring my own gloves.'(내 장갑은 내가 가져갈게.), 'Don't forget to bring your hat.'(모자 가져오는 것 잊지 마.)처럼 해변 청소 준비에 대한 대화이다.","오답 ✕ — 장갑과 모자가 나오지만 거리를 청소하는 데 쓸 물건을 설명하는 것이 아니라 해변 청소 행사를 준비하는 이야기라서 틀림.","오답 ✕ — 'It's going to be sunny tomorrow.'(내일은 화창할 거야.)는 한 문장일 뿐이고, 해변에서 즐겁게 노는 이야기가 아니라 청소 행사 준비 이야기이다.","오답 ✕ — 두 사람이 공통 관심사를 나누는 대화가 아니라, 행사 참여를 권하고 준비물을 확인하는 대화라서 틀림."],"memo":["정답 ②: 해변 청소 행사를 준비하는 이야기이다.","근거: Do you want to join us, Gijun?(기준아, 우리와 함께할래?) / I will bring my own gloves.(내 장갑은 내가 가져갈게.)","함정: ④는 날씨 한 문장만 보고 고르면 ✕"],"why":"해변 청소 행사에 참여하고 필요한 준비물을 챙기는 내용의 대화이다."},{"n":4,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["소녀는 기준에게 내일 행사에 함께 하고 싶은지 묻고 있다.","기준이는 내일 행사에 참여할 것이다.","해변 청소 행사는 오후 9시에 시작한다.","기준이는 자신의 장갑을 가져올 것이다.","내일 날씨는 화창할 것이다."],"a":2,"ans":"해변 청소 행사는 오후 9시에 시작한다.","evs":[["G: It's at nine in the morning.","오전 9시야."],["B: Okay, I will bring my own gloves.","알겠어, 내 장갑은 내가 가져갈게."]],"ev":["G: It's at nine in the morning.","오전 9시야."],"ow":["일치 — 'Do you want to join us, Gijun?'(기준아, 우리와 함께할래?)이라고 물었으므로 소녀가 기준이에게 행사에 함께하고 싶은지 묻고 있다.","일치 — 기준이는 'Sounds good.'(좋아.)이라고 했고 장갑을 가져가겠다고 했으므로 행사에 참여할 것이다.","정답 ○ (불일치) — 'It's at nine in the morning.'(오전 9시야.)이라고 했는데 이 보기는 오후 9시라고 해서 틀림.","일치 — 'Okay, I will bring my own gloves.'(알겠어, 내 장갑은 내가 가져갈게.)라고 했으므로 맞다.","일치 — 'It's going to be sunny tomorrow.'(내일은 화창할 거야.)라고 했으므로 맞다."],"memo":["정답 ③: 행사는 오후 9시가 아니라 오전 9시에 시작한다.","근거: It's at nine in the morning.(오전 9시야.)","함정: ④는 I will bring my own gloves.와 일치"],"why":"해변 청소 행사는 오전 9시에 시작하므로 오후 9시라는 말이 틀리다."}],"dlg":[["G","There's a beach cleaning event tomorrow. Do you want to join us, Gijun?","내일 해변 청소 행사가 있어. 기준아, 우리와 함께할래?"],["B","Sounds good. What time is it going to start?","좋아. 몇 시에 시작할 예정이야?"],["G","It's at nine in the morning.","오전 9시야."],["B","Okay, I will bring my own gloves.","알겠어, 내 장갑은 내가 가져갈게."],["G","Great! Don't forget to bring your hat. It's going to be sunny tomorrow.","좋아! 모자 가져오는 것 잊지 마. 내일은 화창할 거야."]]},{"qs":[{"n":5,"q":"What will the boy look for on the online?","o":["a nice hat","a used shirt","a new pair of shoes","a birthday gift for Kate","the nearest second-hand store"],"a":1,"ans":"a used shirt","evs":[["W: I think you should buy used clothes.","중고 옷을 사는 게 좋을 것 같구나."],["B: Okay, then, I'll look for second-hand online stores.","알겠어요, 그럼 온라인 중고 가게를 찾아볼게요."]],"ev":["W: I think you should buy used clothes.","중고 옷을 사는 게 좋을 것 같구나."],"ow":["오답 ✕ — 대화에 모자는 나오지 않는다. 소년에게 필요한 것은 'a nice shirt'(멋진 셔츠)이다.","정답 ○ — 엄마가 'I think you should buy used clothes.'(중고 옷을 사는 게 좋을 것 같구나.)라고 했고 소년이 'I'll look for second-hand online stores.'(온라인 중고 가게를 찾아볼게요.)라고 했으므로 중고 셔츠를 찾을 것이다.","오답 ✕ — 신발은 대화에 나오지 않는다. 소년은 'I don't have a nice shirt.'(멋진 셔츠가 없어요.)라고 했다.","오답 ✕ — 생일 파티는 케이트의 것이고, 소년이 찾는 것은 선물이 아니라 파티에 입고 갈 셔츠이다.","오답 ✕ — 소년이 찾는 것은 가장 가까운 중고 가게가 아니라 'second-hand online stores'(온라인 중고 가게)에서 파는 중고 셔츠이다."],"memo":["정답 ②: 소년은 온라인에서 중고 셔츠를 찾을 것이다.","근거: I'll look for second-hand online stores.(온라인 중고 가게를 찾아볼게요.)","함정: ⑤는 가게를 찾는 것이 아니라 가게에서 파는 셔츠를 찾는 것이라 ✕"],"why":"소년은 중고 옷을 사라는 엄마의 말에 따라 온라인에서 중고 셔츠를 찾을 것이다."}],"dlg":[["B","Mom, I'm going to Kate's birthday party this weekend, but I don't have a nice shirt. I need to buy a new one.","엄마, 저 이번 주말에 케이트의 생일 파티에 가는데 멋진 셔츠가 없어요. 새 것을 사야 해요."],["W","I think you buy too many clothes. You also throw them away too often.","너는 옷을 너무 많이 사는 것 같구나. 너무 자주 버리기도 하고."],["B","Fashion changes quickly, and clothes are so cheap these days.","유행은 빨리 바뀌고, 요즘에는 옷이 아주 싸요."],["W","Fast fashion is bad for the Earth.","패스트 패션은 지구에 나빠."],["B","Then, what should I do? I still need a nice shirt.","그럼 제가 어떻게 해야 하죠? 그래도 멋진 셔츠는 필요해요."],["W","I think you should buy used clothes.","중고 옷을 사는 게 좋을 것 같구나."],["B","Okay, then, I'll look for second-hand online stores.","알겠어요, 그럼 온라인 중고 가게를 찾아볼게요."],["W","That's a good idea, but don't forget to check the seller reviews.","좋은 생각이야, 하지만 판매자 후기를 확인하는 것을 잊지 마."]]}];var BG=[{"qs":[{"n":6,"q":"What was Lesein's idea for the forests?","o":["to plant one tree for each goal in his soccer games","to stop playing soccer and become a farmer","to cut down fewer trees on his farm","to build a new soccer field in the forest","to sell trees to soccer players"],"a":0,"ans":"to plant one tree for each goal in his soccer games","evs":[["He came up with an idea.","그는 아이디어를 하나 생각해 냈다."],["It was to plant one tree for each goal in his soccer games.","그것은 자신의 축구 경기에서 골을 하나 넣을 때마다 나무를 한 그루씩 심는 것이었다."]],"ev":["He came up with an idea.","그는 아이디어를 하나 생각해 냈다."],"ow":["정답 ○ — 'It was to plant one tree for each goal in his soccer games.'(그것은 자신의 축구 경기에서 골을 하나 넣을 때마다 나무를 한 그루씩 심는 것이었다.)라고 했으므로 정답.","오답 ✕ — 'He loves playing soccer'(그는 축구하는 것을 정말 좋아한다)라고 했으므로 축구를 그만둔다는 것은 틀림. 축구를 하면서 나무를 심는 것이 아이디어이다.","오답 ✕ — 케냐 사람들이 'cut down a lot of trees for farming'(농사를 위해 많은 나무를 베었다)고 했지만, 레세인의 아이디어는 농사 방법을 바꾸는 것이 아니라 나무를 심는 것이다.","오답 ✕ — 축구장을 짓는다는 말은 본문에 없다. 'Every day, more than 50 soccer fields of forest land disappeared.'는 사라진 숲의 크기를 축구장에 비유한 말이다.","오답 ✕ — 나무를 판다는 말은 본문에 없다. 골을 넣을 때마다 나무를 심는 것이 아이디어이다."],"memo":["정답 ①: 축구 경기에서 골을 넣을 때마다 나무를 한 그루씩 심는 것","근거: It was to plant one tree for each goal in his soccer games.(그것은 자신의 축구 경기에서 골을 하나 넣을 때마다 나무를 한 그루씩 심는 것이었다.)","함정: ④는 축구장이 사라진 숲의 크기를 비유한 말인데 헷갈린 것이라 ✕"],"why":"레세인의 아이디어는 골을 넣을 때마다 나무를 한 그루 심는 것이었다."},{"n":7,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["trees - plant","trees - cut","fields - plant","animals - plant","farms - cut"],"a":0,"ans":"trees - plant","evs":[["In the past, people in Kenya cut down a lot of trees for farming.","과거에 케냐 사람들은 농사를 위해 많은 나무를 베었다."],["It was to plant one tree for each goal in his soccer games.","그것은 자신의 축구 경기에서 골을 하나 넣을 때마다 나무를 한 그루씩 심는 것이었다."]],"ev":["In the past, people in Kenya cut down a lot of trees for farming.","과거에 케냐 사람들은 농사를 위해 많은 나무를 베었다."],"ow":["정답 ○ — 'people in Kenya cut down a lot of trees for farming'(케냐 사람들은 농사를 위해 많은 나무를 베었다)이므로 (A)는 trees이고, 'plant one tree for each goal'(골마다 나무를 한 그루 심는다)이므로 (B)는 plant이다.","오답 ✕ — (A) trees는 맞지만, 레세인은 나무를 베는(cut) 것이 아니라 'plant one tree'(나무를 한 그루 심는다)고 했다.","오답 ✕ — 본문은 'cut down a lot of trees'(많은 나무를 베었다)라고 했지 들판(fields)이 베어졌다고 하지 않았다. (B) plant만 맞다.","오답 ✕ — 베어진 것은 동물이 아니라 'a lot of trees'(많은 나무)이다. (B) plant만 맞다.","오답 ✕ — 베어진 것은 농장(farms)이 아니라 나무이고, 레세인은 나무를 베는 것이 아니라 심는다."],"memo":["정답 ①: 케냐에서 많은 나무(trees)를 베어서, 레세인은 나무를 심기(plant)로 했다.","근거: people in Kenya cut down a lot of trees for farming(케냐 사람들은 농사를 위해 많은 나무를 베었다)","함정: ②는 cut과 plant를 반대로 쓴 것이라 ✕"],"why":"나무가 많이 베어지자 레세인은 골 하나마다 나무 한 그루를 심기로 했다.","sum":"In Kenya, a lot of (A) ______ were cut down for farming, so Lesein decided to (B) ______ one tree for each goal.","lab":"완성된 요약문 : "}],"pp":[["Lesein Mutunkei is a young man from Kenya.","Lesein Mutunkei는 케냐의 청년이다."],["He loves playing soccer, and he cares about the environment.","그는 축구하는 것을 정말 좋아하고 환경에 대해 관심이 있다."],["In the past, people in Kenya cut down a lot of trees for farming.","과거에 케냐 사람들은 농사를 위해 많은 나무를 베었다."],["Every day, more than 50 soccer fields of forest land disappeared.","매일 50개 이상의 축구 경기
