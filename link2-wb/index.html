CC("CH","A",[
 ["(It / That) is not easy to exercise every day.","It","It is not easy to exercise every day.","매일 운동하는 것은 쉽지 않다.",
  a1+" 아래 가주어 설명을 보세요.","1) 진짜 주어는 뒤의 to exercise every day(매일 운동하는 것)예요.  2) 앞 자리에서 이 긴 주어를 대신 받는 말이 필요해요.","I로 시작하는 두 글자예요.","가주어 it + 진주어 to V"],
 ["You don’t need (be / to be) a millionaire to be happy.","to be","You don’t need to be a millionaire to be happy.","행복해지기 위해 백만장자일 필요는 없다.",
  a2+"의 ‘want, need, decide...’ 줄을 보세요.","1) need(필요하다)는 목적어로 to부정사만 쓰는 동사예요.  2) a millionaire(백만장자)가 되는 것이 필요하다는 내용이에요.","to 다음에 be(~이다)가 와요. 두 단어예요.","need to be (need는 to V만)"],
 ["Eric decided (to not / not to) quit his job.","not to","Eric decided not to quit his job.","에릭은 직장을 그만두지 않기로 결심했다.",
  a2+" 아래 ‘to부정사의 부정’ 설명을 보세요.","1) decided(원형 decide: 결정하다) 뒤에 to부정사가 와요.  2) 부정하고 싶을 때 not의 위치가 정해져 있어요.","not이 to 앞에 오는 쪽이에요. 두 번째 보기예요.","부정은 not to V"],
 ["The room was too cold for me to (sleep / sleep in).","sleep in","The room was too cold for me to sleep in.","그 방은 내가 자기에는 너무 추웠다.",
  b2+"를 보세요. to부정사 뒤에 전치사가 필요한 경우를 확인해요.","1) 방(room)은 ‘안에서’ 자는 곳이에요.  2) sleep(자다)은 자동사라서 목적어 ‘방’을 연결하려면 전치사가 필요해요.","두 번째 보기예요. 끝에 두 글자 전치사가 붙어요.","명사 + to V + 전치사 (sleep in)"],
 ["She has too much housework to (do / do with).","do","She has too much housework to do.","그녀는 해야 할 집안일이 너무 많다.",
  b2+"를 보세요. 전치사가 필요한지 따져 봐요.","1) housework(집안일)는 do(하다)의 목적어예요.  2) do는 목적어를 바로 받는 타동사라서 전치사 없이 연결돼요.","첫 번째 보기예요. 두 글자 동사 하나만 써요.","do는 타동사 → 전치사 불필요"],
 ["We ordered (cold something / something cold) to drink.","something cold","We ordered something cold to drink.","우리는 마실 차가운 것을 주문했다.",
  b1+" 아래 ‘-thing + 형용사 + to부정사’ 순서를 보세요.","1) something(어떤 것)처럼 -thing으로 끝나는 말은 형용사를 뒤에 놓아요.  2) cold(차가운)가 앞인지 뒤인지 정해 봐요.","두 번째 보기예요. s로 시작해요.","something cold to drink (순서 주의)"],
 ["I looked on the web (finding / to find) the answer.","to find","I looked on the web to find the answer.","나는 답을 찾기 위해 인터넷을 검색했다.",
  c1+"을 보세요. 행동의 이유를 말해 주는 to부정사예요.","1) looked on the web(인터넷을 찾아봤다)은 이미 끝난 행동이에요.  2) 그 목적을 설명하려면 -ing가 아니라 다른 모양이 필요해요.","두 번째 보기예요. to로 시작해요.","동작 + to V = ~하기 위해"],
 ["It was careless (of / for) him to say such a thing.","of","It was careless of him to say such a thing.","그런 말을 하다니 그는 부주의했다.",
  d1+"의 성격 형용사 목록을 보세요.","1) careless(부주의한)는 사람의 성격을 평가하는 말이에요.  2) 이런 형용사 뒤에서는 for가 아니라 다른 전치사를 써요.","o로 시작하는 두 글자예요.","careless of him (성격은 of)"]
]);
WW("CH","B",FX,[
 ["To make new friends <u>are</u> exciting.","is","To make new friends is exciting.","새 친구를 사귀는 것은 신나는 일이다.",
  a1+" 예문 아래 빨간 글씨 ‘단수 취급’ 설명을 보세요.","1) 주어 To make new friends(새 친구를 사귀는 것)는 하나의 일이에요.  2) 중간의 friends가 복수여도 흔들리지 마세요.","are(원형 be) 대신 두 글자 단수형이에요.","To make friends → is (단수)"],
 ["It is important <u>maintain</u> a healthy diet.","to maintain","It is important to maintain a healthy diet.","건강한 식단을 유지하는 것은 중요하다.",
  a1+"을 펴세요. It ~ to V 모양을 확인해요.","1) It is important(중요한) 뒤에는 ‘무엇이 중요한지’가 와요.  2) 그 부분이 진주어라서 to부정사 모양이어야 해요.","maintain(유지하다) 앞에 t로 시작하는 두 글자를 더해요.","It is important to maintain"],
 ["There was not enough light <u>reading</u> a book.","to read","There was not enough light to read a book.","책을 읽을 만큼 충분한 빛이 없었다.",
  b1+"를 보세요. 명사 뒤에서 ‘~할’이라고 꾸미는 말이에요.","1) light(빛)가 ‘무엇을 할’ 빛인지 뒤에서 설명해요.  2) 명사 뒤에서 꾸밀 때는 -ing가 아니라 다른 모양을 써요.","reading에서 -ing를 떼고 앞에 t로 시작하는 두 글자를 붙여요.","enough light to read = 읽을 빛"],
 ["Do you have <u>important anything</u> to add?","anything important","Do you have anything important to add?","덧붙일 중요한 것이 있나요?",
  b1+" 아래 ‘-thing + 형용사 + to부정사’ 설명을 보세요.","1) anything(어떤 것)처럼 -thing으로 끝나는 말은 형용사가 뒤에 와요.  2) 두 단어의 순서가 거꾸로예요.","두 단어의 순서만 바꿔요. a로 시작하는 말이 먼저예요.","anything important to add"],
 ["Mark came here in order <u>find</u> a job.","to find","Mark came here in order to find a job.","마크는 일자리를 구하기 위해 여기에 왔다.",
  c1+" 아래 in order to 설명을 보세요.","1) ‘~하기 위해서’를 강조할 때 쓰는 in order 뒤에는 한 단어가 더 필요해요.  2) 그 단어를 붙이면 in order to + 동사원형이 돼요.","in order 뒤에 빠진 두 글자 단어를 find(찾다) 앞에 더해요.","in order to find = 구하기 위해"],
 ["It was kind <u>for you</u> to help them.","of you","It was kind of you to help them.","그들을 도와주다니 너는 친절했다.",
  d1+"의 성격 형용사 목록을 보세요.","1) kind(친절한)는 사람의 성격을 말하는 형용사예요.  2) 이 목록에 있는 형용사 뒤에서는 for 대신 다른 전치사를 써요.","for를 o로 시작하는 두 글자로 바꿔요.","kind → of + 목적격"],
 ["It is strange <u>to him</u> to get so angry.","for him","It is strange for him to get so angry.","그가 그렇게 화를 내는 것은 이상하다.",
  d1+"를 보세요. to부정사의 행동 주체를 나타내는 모양이에요.","1) 화를 내는 사람은 him(그)이에요. 이 사람은 to get angry의 의미상의 주어예요.  2) 의미상의 주어 앞에는 전치사가 필요한데 to는 아니에요.","to를 f로 시작하는 세 글자로 바꿔요.","strange 같은 일의 상태 → for + 목적격"],
 ["He is <u>enough old</u> to watch this movie.","old enough","He is old enough to watch this movie.","그는 이 영화를 볼 만큼 충분히 나이가 들었다.",
  d3+"를 보세요. enough의 위치를 확인해요.","1) ‘~할 만큼 충분히 …한’에서 enough는 형용사를 뒤에서 꾸며요.  2) 지금은 enough가 old 앞에 있어요.","두 단어의 순서를 바꿔요. o로 시작하는 말이 먼저예요.","old enough to watch (순서 주의)"]
]);
WW("CH","C","(우리말과 일치하도록 ( ) 안의 말을 바르게 배열하시오) ",[
 ["살얼음판 위를 걷는 것은 매우 위험하다. (walk / it / to / is / very dangerous)<br>___ on thin ice.","It is very dangerous to walk","It is very dangerous to walk on thin ice.","살얼음 위를 걷는 것은 매우 위험하다.",
  a1+" 아래 가주어 설명을 보세요.","1) 주어가 길어서 가주어를 앞에 쓰고 진주어는 뒤로 보내는 문장이에요.  2) 앞에 이미 ‘on thin ice’가 따로 있으니 빈칸에는 동사 walk(걷다)까지만 들어가요.","I로 시작하는 여섯 단어예요. 가주어와 동사 다음에 보어(very dangerous), 진주어는 맨 뒤예요.","It is dangerous to walk = 걷는 건 위험",["walk","it","to","is","very dangerous"]],
 ["나는 무엇을 해야 할지 모르겠다. (what / don’t / know / do / to / I)<br>___.","I don’t know what to do","I don’t know what to do.","나는 무엇을 해야 할지 모르겠다.",
  a4+" 표에서 what 줄을 보세요.","1) 주어는 I, 동사는 don’t know(모르겠다)예요.  2) 모르는 내용은 ‘무엇을 할지’라는 의문사 + to부정사 덩어리예요.","I로 시작하는 여섯 단어예요. 의문사 바로 뒤에 to + 동사원형 덩어리가 붙어요.","I don’t know what to do",["what","don’t","know","do","to","I"]],
 ["우리 부모님은 너를 만나서 행복할 것이다. (be / happy / my parents / meet / will / to / you)<br>___.","My parents will be happy to meet you","My parents will be happy to meet you.","우리 부모님은 너를 만나서 기뻐하실 것이다.",
  c2+"을 보세요. happy 같은 감정 형용사 뒤에 오는 모양이에요.","1) 주어는 my parents(우리 부모님)이고 미래라서 will be가 필요해요.  2) 기쁜 이유(너를 만나는 것)는 happy 뒤에 to부정사로 이어요.","M으로 시작하는 여덟 단어예요. will 뒤에는 동사원형 be가 오고, 감정 형용사 뒤에 to부정사가 붙어요.","happy to meet you = 만나서 기쁜",["be","happy","my parents","meet","will","to","you"]],
 ["수영은 배우기에 쉽지 않다. (easy / to / swimming / is / not / learn)<br>___.","Swimming is not easy to learn","Swimming is not easy to learn.","수영은 배우기에 쉽지 않다.",
  c4+"을 보세요. easy 같은 형용사 뒤의 to부정사예요.","1) 주어는 swimming(수영)이고 be동사 is와 not이 이어져요.  2) 쉽지 않은 점이 ‘배우기에’라는 뜻이라 형용사 뒤에 to + 동사원형을 붙여요.","S로 시작하는 여섯 단어예요. not은 is 바로 뒤에, to부정사는 형용사 easy(쉬운) 뒤에 와요.","not easy to learn = 배우기 쉽지 않다",["easy","to","swimming","is","not","learn"]]
]);

CC("CH","SA",[
 ["The water is (to / too / so) cold to swim in.","too","The water is too cold to swim in.","그 물은 너무 차가워서 수영할 수 없다.",
  d2+"를 보세요. 뒤에 to부정사가 이어지는 구문이에요.","1) cold(차가운) 뒤에 that절이 아니라 to swim in이 바로 와요.  2) ‘너무 ~해서 …할 수 없다’ 구문의 첫 단어를 골라요.","t로 시작하는 세 글자예요. to와 헷갈리지 마세요.","too cold to swim in"],
 ["Can you tell me (what / how / where) to get to the nearest subway station?","how","Can you tell me how to get to the nearest subway station?","가장 가까운 지하철역에 가는 방법을 알려 주시겠어요?",
  a4+" 표에서 how 줄을 보세요.","1) to get to the nearest subway station은 ‘가장 가까운 지하철역에 가다’예요.  2) 묻는 내용은 장소가 아니라 ‘가는 방법’이에요.","h로 시작하는 세 글자예요.","how + to V = ~하는 방법"],
 ["There are lots of benches to sit (to / on / with) in this area.","on","There are lots of benches to sit on in this area.","이 지역에는 앉을 벤치가 많이 있다.",
  b2+"의 표를 펴세요. sit(앉다)처럼 목적어를 바로 못 받는 동사 뒤에 어떤 전치사가 붙는지 봐요.","1) benches(벤치들)는 ‘위에’ 앉는 것이에요.  2) sit(앉다)은 자동사라서 전치사가 필요해요.","o로 시작하는 두 글자예요.","명사 + to V + 전치사 (sit on)"],
 ["We were (to / so / too) busy that we couldn’t do any sightseeing.","so","We were so busy that we couldn’t do any sightseeing.","우리는 너무 바빠서 관광을 전혀 할 수 없었다.",
  d2+" 아래 ‘so ~ that’ 설명을 보세요.","1) busy(바쁜) 뒤에 that we couldn’t… 절이 나와요.  2) that절과 짝이 되는 말을 골라요.","s로 시작하는 두 글자예요.","so busy that ~ couldn’t"],
 ["It was polite (of / for / to) him to offer his seat to the old woman.","of","It was polite of him to offer his seat to the old woman.","노부인에게 자리를 양보하다니 그는 공손했다.",
  d1+"의 성격 형용사 목록을 보세요.","1) polite(공손한)는 사람의 성격을 말하는 형용사예요.  2) 이런 형용사 뒤에는 for 대신 다른 전치사를 써요.","o로 시작하는 두 글자예요.","polite → of + 목적격"],
 ["He promised (bring / bringing / to bring) me a souvenir from Greece.","to bring","He promised to bring me a souvenir from Greece.","그는 내게 그리스에서 기념품을 가져다주겠다고 약속했다.",
  a2+"의 ‘promise’ 예문을 보세요.","1) promised(원형 promise: 약속하다)는 목적어로 to부정사를 써요.  2) -ing나 동사원형만 쓰면 안 돼요.","세 번째 보기예요. to로 시작해요.","promise + to V"],
 ["She is (to old enough / old enough to / enough old to) live on her own.","old enough to","She is old enough to live on her own.","그녀는 혼자 살 만큼 충분히 나이를 먹었다.",
  d3+"를 보세요. enough의 위치를 확인해요.","1) enough는 형용사 뒤에 와요.  2) 그 뒤에 to + 동사원형이 이어져요.","가운데 보기예요. o로 시작해요.","old enough to live on her own"],
 ["I left the house early (in order / in order not / not in order) to be late.","in order not","I left the house early in order not to be late.","나는 늦지 않기 위해 일찍 집을 나섰다.",
  c1+" 아래 in order to 설명과 p.58 POINT 2의 ‘to부정사의 부정’을 함께 보세요.","1) left(원형 leave: 떠나다)는 늦지 않으려고 한 행동이에요.  2) ‘~하지 않기 위해’는 in order와 to 사이에 부정어가 들어가요.","가운데 보기예요. in order 다음에 not이 와요.","in order not to V"]

WW("CH","SB",FX2,[
 ["<u>To save</u> a lot of money is my goal this year.","O","To save a lot of money is my goal this year.","많은 돈을 모으는 것이 올해 내 목표이다.",
  a1+"을 보세요. 주어 자리의 to부정사예요.","1) 문장의 주어가 To save a lot of money(많은 돈을 모으는 것)예요.  2) to + 동사원형 모양이 맞고 동사 is와도 어울려요.","올바른 문장이에요. O예요.","주어 to V + 단수 동사 (이 문장은 O)"],
 ["She refused <u>answer</u> my questions.","to answer","She refused to answer my questions.","그녀는 내 질문에 대답하기를 거부했다.",
  a2+"을 보세요. 목적어로 to부정사를 쓰는 동사예요.","1) refused(원형 refuse: 거부하다) 뒤에 동사가 그냥 나와 있어요.  2) ‘~하기를 거부하다’처럼 할 일이 오는 자리에는 필요한 말이 하나 빠졌어요.","answer(대답하다) 앞에 t로 시작하는 두 글자를 더해요.","refuse + to V"],
 ["My father wants to learn <u>how cook to</u>.","how to cook","My father wants to learn how to cook.","우리 아버지는 요리하는 법을 배우고 싶어 하신다.",
  a4+" 표에서 how 줄을 보세요.","1) ‘요리하는 법’은 how로 시작하는 덩어리예요.  2) 의문사 뒤에 to + 동사원형이 오는데 지금은 to의 자리가 틀렸어요.","세 단어의 순서만 고쳐요. 의문사가 맨 앞, cook(요리하다)은 맨 끝이에요.","how + to V (to는 동사 앞)"],
 ["He gave me a pen <u>to write with</u>.","O","He gave me a pen to write with.","그는 내게 쓸 펜을 주었다.",
  b2+"의 표를 펴세요. 도구를 ‘가지고’ 쓸 때 어떤 전치사가 남는지 확인해요.","1) pen(펜)은 ‘가지고’ 쓰는 도구예요.  2) write(쓰다) 뒤에 도구를 나타내는 전치사가 있는지 확인해요.","with가 제대로 있어요. O예요.","a pen to write with (이 문장은 O)"],
 ["The children wore a heavy coat <u>so as to keep</u> warm.","O","The children wore a heavy coat so as to keep warm.","아이들은 따뜻하게 지내기 위해 두꺼운 코트를 입었다.",
  c1+" 아래 ‘in order to(= so as to)’ 설명을 보세요.","1) wore(원형 wear: 입다)는 어떤 목적으로 입었는지 말해 줘요.  2) 목적을 강조할 때는 in order to 말고도 so as to를 쓸 수 있어요.","so as to도 올바른 표현이에요. O예요.","so as to V = in order to V (O)"],
 ["I want to find <u>fun something</u> to watch this weekend.","something fun","I want to find something fun to watch this weekend.","나는 이번 주말에 볼 재미있는 것을 찾고 싶다.",
  b1+" 아래 ‘-thing + 형용사 + to부정사’를 보세요.","1) something처럼 -thing으로 끝나는 말은 형용사를 뒤에 놓아요.  2) fun(재미있는)과 something의 순서가 거꾸로예요.","두 단어의 순서를 바꿔요. s로 시작하는 말이 먼저예요.","something fun to watch"],
 ["His question was too difficult <u>to answer</u>.","O","His question was too difficult to answer.","그의 질문은 너무 어려워서 대답할 수 없었다.",
  d2+"를 보세요. too ~ to ~ 구문이에요.","1) too difficult(너무 어려운) 뒤에 to answer가 바로 이어져요.  2) too ~ to V 구문 그대로 쓰여 있어요.","올바른 문장이에요. O예요.","too + 형용사 + to V (이 문장은 O)"],
 ["He didn’t run <u>enough fast</u> to win the race.","fast enough","He didn’t run fast enough to win the race.","그는 경주에서 이길 만큼 충분히 빨리 달리지 못했다.",
  d3+"를 보세요. enough의 위치를 확인해요.","1) fast(빠르게)는 부사예요. enough는 부사 뒤에서 꾸며 줘요.  2) 지금은 enough가 fast 앞에 있어요.","두 단어의 순서를 바꿔요. f로 시작하는 말이 먼저예요.","부사 + enough + to V"]
]);
WW("CH","SC","(우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오) ",[
 ["그녀는 기차에서 읽을 책을 한 권 빌렸다. (borrow, read)<br>She ___ on the train.","borrowed a book to read","She borrowed a book to read on the train.","그녀는 기차에서 읽을 책을 한 권 빌렸다.",
  b1+"를 보세요. 명사 뒤에서 ‘~할’이라고 꾸미는 모양이에요.","1) 과거 이야기라서 borrow(빌리다)의 시제를 맞춰야 해요.  2) ‘읽을 책’은 a book 뒤에 to부정사를 붙여요. book은 read의 목적어라서 전치사는 필요 없어요.","b로 시작하는 과거형으로 시작하는 다섯 단어예요. ‘한 권’은 관사 a로 나타내요.","명사 + to V (타동사는 전치사 없음)"],
 ["너를 다시 봐서 기쁘다. (glad, see)<br>I ___.","am glad to see you again","I am glad to see you again.","너를 다시 봐서 기쁘다.",
  c2+"을 보세요. glad(기쁜)는 감정 형용사예요.","1) 현재 이야기라서 be동사 am으로 시작해요.  2) 기쁜 원인이 ‘너를 다시 본 것’이니 to부정사를 이어요.","am으로 시작하는 여섯 단어예요. ‘다시’는 again으로 맨 끝에 와요.","am glad to see you again"],
 ["눈이 올 만큼 충분히 춥지 않다. (cold, snow)<br>It ___.","is not[isn’t] cold enough to snow","It is not[isn’t] cold enough to snow.","눈이 올 만큼 충분히 춥지 않다.",
  d3+"를 보세요. 부정문과 enough의 위치를 함께 확인해요.","1) 날씨를 말할 때는 주어 It을 쓰고 부정문은 be동사 뒤에 not을 붙여요.  2) ‘~할 만큼 충분히 추운’은 형용사 뒤에 enough를 놓아요.","is로 시작해요. is not은 isn’t로 줄여 써도 돼요. e로 시작하는 단어는 cold(추운) 바로 뒤에 와요.","be not + 형용사 + enough + to V"],
 ["이 스웨터는 너무 작아서 내가 입을 수 없다. (too, small, wear)<br>This sweater ___.","is too small for me to wear","This sweater is too small for me to wear.","이 스웨터는 너무 작아서 내가 입을 수 없다.",
  d2+" 아래 ‘too ~ for 목적격 to V’ 예문을 보세요.","1) ‘너무 ~해서 …할 수 없다’는 too + 형용사 + to V 구문이에요.  2) 입는 사람이 문장 주어(스웨터)와 다르므로 의미상의 주어가 필요해요. ‘나’를 나타내야 해요.","is로 시작하는 일곱 단어예요. ‘내가’는 for + 목적격으로 to부정사 바로 앞에 둬요.","too + 형용사 + for 목적격 + to V"],
 ["Brian은 그의 딸에게 주기 위해 테디베어를 샀다. (buy, a teddy bear, give)<br>Brian ___ to his daughter.","bought a teddy bear to give","Brian bought a teddy bear to give to his daughter.","Brian은 그의 딸에게 주기 위해 테디베어를 샀다.",
  b1+"와 p.62 POINT 1 ‘목적’을 함께 보세요.","1) 과거 이야기라서 buy(사다)의 과거형을 써요.  2) 산 물건은 a teddy bear(테디베어)예요. 그 뒤에 ‘주기 위해’라는 목적을 to부정사로 이어요.","b로 시작하는 과거형으로 시작하는 여섯 단어예요. 주어진 give(주다)는 t로 시작하는 두 글자와 함께 써요.","동작 + 명사 + to V (~하려고)"]
]);

C(1,"A",1,"밑줄 친 동명사의 역할을 고르시오.<br><u>Baking</u> cookies is a fun activity.",["주어","목적어","보어"],"주어","Baking cookies is a fun activity.","쿠키를 굽는 것은 재미있는 활동이다.",
 "본책 p.74 POINT 1 ‘주어 역할’ 을 펴 보세요.",
 "1) 밑줄 친 말이 문장 맨 앞에서 시작해요.  2) 뒤에 is(원형 be: ~이다)가 나오니, ‘~하는 것은’으로 풀리는 자리인지 따져 봐요.",
 "문장의 맨 앞, is 앞에 있어요. ‘~은/는’ 자리이니 보기 중 첫 번째 말이에요.",
 "문장 맨 앞 동명사 = 주어 (~하는 것은)");
C(1,"A",2,"밑줄 친 동명사의 역할을 고르시오.<br>She likes <u>singing</u> pop songs.",["주어","목적어","보어"],"목적어","She likes singing pop songs.","그녀는 팝송을 부르는 것을 좋아한다.",
 "본책 p.74 POINT 2 ‘목적어 역할’ 첫 번째 예문을 보세요.",
 "1) likes(원형 like: 좋아하다) 바로 뒤에 밑줄 친 말이 있어요.  2) 좋아하는 ‘대상’이 무엇인지 알려 주는 말이니 어떤 역할일까요?",
 "동사 뒤에서 ‘~하는 것을’로 해석돼요. 보기에서 주어와 보어는 지워요.",
 "동사 뒤 동명사 = 목적어 (~하는 것을)");
C(1,"A",3,"밑줄 친 동명사의 역할을 고르시오.<br>My hobby is <u>writing</u> stories.",["주어","목적어","보어"],"보어","My hobby is writing stories.","내 취미는 이야기를 쓰는 것이다.",
 "본책 p.74 POINT 3 ‘보어 역할’ 의 예문 Tina’s hobby is … 를 비교해 보세요.",
 "1) 문장의 주어는 My hobby(내 취미)예요.  2) is(원형 be: ~이다) 뒤에서 주어가 ‘무엇인지’ 설명해 주고 있어요.",
 "be동사 뒤에서 주어를 설명하니 ‘~하는 것(이다)’로 해석돼요. 보기 중 마지막 말이에요.",
 "be동사 뒤 동명사 = 보어 (~하는 것이다)");
C(1,"A",4,"밑줄 친 동명사의 역할을 고르시오.<br><u>Smoking</u> causes lung cancer.",["주어","목적어","보어"],"주어","Smoking causes lung cancer.","흡연은 폐암을 일으킨다.",
 "본책 p.74 POINT 1 ‘주어 역할’ 을 펴 보세요.",
 "1) 밑줄 친 말이 문장 맨 처음에 있어요.  2) 뒤의 causes(원형 cause: 일으키다)가 이 말이 ‘하는’ 행동이에요. 누가 일으키는지 생각해 봐요.",
 "동사 causes 앞에서 동작을 하는 쪽이에요. ‘~하는 것은’으로 풀리는 첫 번째 보기예요.",
 "동사 앞 동명사는 주어, 단수 취급");
C(1,"A",5,"밑줄 친 동명사의 역할을 고르시오.<br><u>Being</u> part of a school play is exciting.",["주어","목적어","보어"],"주어","Being part of a school play is exciting.","학교 연극의 일원이 되는 것은 신나는 일이다.",
 "본책 p.74 POINT 1 의 ‘주어로 쓰인 동명사(구)는 단수 취급’ 설명을 보세요.",
 "1) Being part of a school play 가 길게 한 덩어리로 문장 앞에 있어요.  2) 뒤의 is(원형 be: ~이다)가 이 덩어리를 받아요. 덩어리가 어떤 자리일까요?",
 "긴 동명사구가 is 앞에 있으니 ‘~하는 것은’이에요. 보기 중 첫 번째 말이에요.",
 "동명사구가 문장 앞이면 주어 (is로 받음)");
C(1,"A",6,"밑줄 친 동명사의 역할을 고르시오.<br>Adam is good at <u>dancing</u>.",["주어","목적어","보어"],"목적어","Adam is good at dancing.","Adam은 춤추는 것을 잘한다.",
 "본책 p.74 POINT 2 ‘목적어 역할’ 의 두 번째 예문(전치사의 목적어)을 보세요.",
 "1) 밑줄 친 말 바로 앞에 at(~에)이 있어요.  2) be good at 의 at은 전치사예요. 전치사 뒤에 온 말은 무슨 역할일까요?",
 "전치사 뒤에 오는 명사 자리는 ‘목적어’ 라고 불러요. 두 번째 보기예요.",
 "전치사 뒤 동명사 = 전치사의 목적어");
C(1,"A",7,"밑줄 친 동명사의 역할을 고르시오.<br>His favorite pastime is <u>fishing</u>.",["주어","목적어","보어"],"보어","His favorite pastime is fishing.","그가 가장 좋아하는 소일거리는 낚시하는 것이다.",
 "본책 p.74 POINT 3 ‘보어 역할’ 을 펴 보세요.",
 "1) 주어는 His favorite pastime(그가 가장 좋아하는 소일거리)이에요.  2) is(원형 be: ~이다) 뒤에서 그 소일거리가 ‘무엇인지’ 말해 줘요.",
 "주어와 같은 것을 설명하는 말이니 ‘~하는 것이다’로 풀려요. 세 번째 보기예요.",
 "주어 = 동명사일 때, 동명사는 보어");
C(1,"A",8,"밑줄 친 동명사의 역할을 고르시오.<br>He doesn’t enjoy <u>reading</u> magazines.",["주어","목적어","보어"],"목적어","He doesn’t enjoy reading magazines.","그는 잡지 읽는 것을 즐기지 않는다.",
 "본책 p.74 POINT 2 ‘목적어 역할’ 첫 번째 예문(동사의 목적어)을 보세요.",
 "1) enjoy(즐기다) 뒤에 밑줄 친 말이 와요.  2) 무엇을 즐기는지 알려 주는 말이에요. 그러면 ‘~을/를’에 해당해요.",
 "동사 enjoy 바로 뒤에 있어요. ‘~하는 것을’로 풀리니 두 번째 보기예요.",
 "enjoy 뒤 동명사 = 동사의 목적어");

 "본책 p.74 POINT 4 표에서 feel like + v-ing 를 찾아보세요.",

 "e로 시작해서 -ing로 끝나는 6글자예요. 끝의 e는 빼고 ing를 붙여요.",
 "feel like + v-ing (~하고 싶다)");
W(1,"B",2,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>He keeps ___ money for his dream car. (save)","saving","He keeps saving money for his dream car.","그는 꿈의 자동차를 위해 계속 돈을 모으고 있다.",
 "본책 p.74 POINT 2 ‘목적어 역할’ 과 p.76 POINT 1 의 동사 목록을 비교해 보세요.",
 "1) keeps(원형 keep: 계속하다) 뒤에 ‘무엇을 계속하는지’ 가 와요.  2) keep은 동명사를 목적어로 하는 동사예요. save(모으다)를 어떻게 바꿀까요?",
 "s로 시작하고 -ing로 끝나는 6글자예요. save의 끝 e를 빼고 ing를 붙여요.",
 "keep + v-ing (계속 ~하다)");
W(1,"B",3,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>We arrived in Australia after ___ all night. (fly)","flying","We arrived in Australia after flying all night.","우리는 밤새 비행한 후에 호주에 도착했다.",

 "1) 과거 이야기이니 find(발견하다)의 과거형을 써요. find는 불규칙이에요.  2) 그림은 ‘그려진’ 수동이고, by Picasso 어구가 붙어서 명사 뒤에 와요.","f로 시작하는 5글자 + some pictures + paint에 -ed를 붙인 말이에요.","수동 + by ~ → 명사 뒤 과거분사 (pictures painted by ~)"],
 ["경쾌하게 휘파람을 불면서 그는 집까지 자전거를 탔다. (whistle cheerfully, ride one’s bike)<br>→ ___ home.","Whistling cheerfully, he rode his bike","Whistling cheerfully, he rode his bike home.","경쾌하게 휘파람을 불면서, 그는 집까지 자전거를 탔다.",
 "본책 p.90 ‘분사구문의 의미’(2번) 표에서 ‘동시동작’을 펴세요.",
 "1) 휘파람을 부는 것과 자전거를 타는 것이 동시에 일어나요.  2) 분사구문(~하면서) 뒤에 주어 he와 과거 동사를 쓴 주절이 와요. ride는 불규칙 과거형이에요.","빈칸은 6단어예요. W로 시작하는 9글자 분사로 시작하고, 주절 동사는 ride의 과거형(r로 시작, 4글자), one’s는 주어에 맞게 바꿔요.","동시동작 분사구문 + 주절 (Whistling ~, he rode ~)"],
 ["천천히 걸으면서, 나는 그 마을의 아름다움을 감상할 수 있었다. (walk quickly, notice)<br>→ ___ the beauty of the town.","Walking slowly, I could appreciate","Walking slowly, I could appreciate the beauty of the town.","천천히 걸으면서, 나는 그 마을의 아름다움을 감상할 수 있었다.",
 "본책 p.90 ‘분사구문의 의미’(2번) 표에서 ‘동시동작’을 펴세요.",
 "1) 걸으면서 감상하는 동시동작이에요. 우리말은 ‘천천히’예요. 문제 괄호의 quickly(빠르게), notice(알아차리다)는 우리말과 뜻이 달라서, 해설 정답은 우리말(천천히, 감상하다)에 맞춰 써요.  2) 분사구문 뒤에 주어 I와 could + 동사원형이 와요.","빈칸은 5단어예요. W로 시작하는 분사 + ‘천천히’ 부사, 쉼표 뒤에는 I could + a로 시작하는 10글자 동사원형이에요.","동시동작 → Walking ~, I could ~"],
 ["집을 나서기 전에, 우리는 모든 창문을 닫았다. (leave the house, close)<br>→ Before ___ all the windows.","leaving the house, we closed","Before leaving the house, we closed all the windows.","집을 나서기 전에, 우리는 모든 창문을 닫았다.",
 "본책 p.90 ‘분사구문의 의미’(2번) 맨 아래 메모를 펴세요. 접속사를 남기는 분사구문이 나와 있어요.",
 "1) Before(~ 전에)가 이미 앞에 있어요. 그 뒤에는 분사를 써요.  2) 집을 나서는 사람은 we예요. 쉼표 뒤에 we + 과거 동사의 주절이 와요.","빈칸은 5단어예요. l로 시작하는 7글자 분사 + the house, 쉼표 뒤에 주어 + c로 시작하는 6글자 과거형이에요.","접속사 남긴 분사구문 → Before + v-ing, 주절"]
].forEach((r,i)=>W("CH","SC",i+1,"우리말과 일치하도록 ( ) 안의 말과 분사를 이용하여 문장을 완성하시오.<br>"+r[0],r[1],r[2],r[3],r[4],r[5],r[6],r[7]));

V(1,"A",[
 ["I (found / was found) my glasses in my backpack.","found","I found my glasses in my backpack.","나는 내 배낭에서 안경을 찾았다.","POINT 1 ‘수동태의 형태와 의미’ 첫 설명을 펴세요.",
  "1) 문장에 I(나)와 my glasses(내 안경)가 있어요. 안경을 찾는 행동을 한 사람은 누구일까요?  2) 주어가 직접 행동하면 동사만, 행동을 당하면 ‘be동사 + p.p.’를 써요.","I가 직접 찾은 거예요. be동사가 없는 첫 번째 보기예요. find(찾다)의 과거형이에요.","주어가 직접 행동 = 능동 → 동사만"],
 ["This beach (visits / is visited) by lots of people every summer.","is visited","This beach is visited by lots of people every summer.","이 해변은 매년 여름 많은 사람들에 의해 방문된다.","POINT 1 ‘수동태의 형태와 의미’와 POINT 2 시제 표를 펴세요.",
  "1) 해변(This beach)이 사람들을 방문할 수 있을까요, 아니면 방문을 당할까요?  2) 뒤에 by lots of people(많은 사람들에 의해)이 있어요. every summer(매년 여름)는 현재 시제 단서예요.","주어가 방문을 ‘당해요’. be동사 현재형 + 과거분사가 들어간 두 번째 보기예요.","by ~가 보이면 수동태 (is + p.p.)"],
 ["My grandfather (built / was built) this house forty years ago.","built","My grandfather built this house forty years ago.","우리 할아버지께서 40년 전에 이 집을 지으셨다.","POINT 1 ‘수동태의 형태와 의미’ 첫 설명을 펴세요.",
  "1) 주어는 My grandfather(우리 할아버지)이고 뒤에 this house(이 집)가 목적어로 있어요.  2) 사람인 주어가 집을 짓는 행동을 했나요, 당했나요?  3) 동사 뒤에 목적어가 바로 오면 능동태예요.","할아버지가 집을 지은 거예요. be동사가 없는 쪽이에요. build(짓다)의 과거형이에요.","동사 뒤에 목적어가 바로 오면 능동태"],
 ["The telescope (is / was) invented in the seventeenth century.","was","The telescope was invented in the seventeenth century.","망원경은 17세기에 발명되었다.","POINT 2 ‘수동태의 시제’ 표(과거시제 줄)를 펴세요.",
  "1) invented(invent, 발명하다의 과거분사)가 있으니 수동태예요. be동사를 골라야 해요.  2) in the seventeenth century(17세기에)는 옛날 일이에요. 현재일까요, 과거일까요?","옛날 일이니까 be동사도 과거형이에요. 세 글자로 w로 시작해요.","과거 시점 + 수동태 → was/were + p.p."],
 ["The batteries (are included / are including) with the toy.","are included","The batteries are included with the toy.","그 장난감에는 건전지가 포함되어 있다.","POINT 1 ‘수동태의 형태와 의미’ 첫 설명을 펴세요.",
  "1) The batteries(건전지들)가 장난감에 ‘포함되는’ 걸까요, ‘포함하는’ 걸까요?  2) 건전지는 포함시킴을 당하는 쪽이에요. 수동태는 be동사 뒤에 과거분사(p.p.)를 써요.","be동사 뒤에 -ing가 아니라 -ed 꼴이 오는 첫 번째 보기예요.","수동태 = be + p.p. (be + -ing 아님)"],
 ["The pizza will (is / be) delivered soon.","be","The pizza will be delivered soon.","그 피자는 곧 배달될 것이다.","POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) will(~할 것이다) 바로 뒤에 올 말을 골라요.  2) will 뒤에는 동사원형이 와요. be동사의 원형은 무엇인가요?  3) 그 뒤에 delivered(배달된)가 이어져요.","원형 be예요. 두 글자로 b로 시작해요.","will + be + p.p. (미래 수동태)"],
 ["Michael will (coach / be coached) the team.","coach","Michael will coach the team.","Michael은 그 팀을 지도할 것이다.","POINT 2 ‘수동태의 시제’ 표(미래시제 줄)와 POINT 1을 펴세요.",
  "1) will 뒤에 동사가 와요. 주어 Michael이 the team(그 팀)을 지도하는 쪽일까요, 지도받는 쪽일까요?  2) 뒤에 by ~도 없고 the team이 목적어로 바로 와요.","Michael이 팀을 지도하는 거라서 능동이에요. be가 없는 첫 번째 보기예요. coach는 ‘지도하다’예요.","will 뒤 + 목적어 있음 → 동사원형(능동)"],
 ["The dinner is (preparing / being prepared) by the chefs.","being prepared","The dinner is being prepared by the chefs.","저녁 식사는 요리사들에 의해 준비되고 있다.","POINT 2 ‘수동태의 시제’ 표(진행형 줄)를 펴세요.",
  "1) is 뒤에 올 말을 골라요. 저녁 식사는 준비되는 쪽이에요.  2) by the chefs(요리사들에 의해)가 있으니 수동태예요.  3) ‘~되고 있는 중’이라는 진행형 수동태 모양을 떠올려요.","be동사 + being + p.p. 모양이에요. 두 번째 보기예요.","진행 수동태 = be + being + p.p."]
],"본책 p.102 ");

X(1,"B",[
 ["The file is <u>being send</u> right now.","being sent","The file is being sent right now.","그 파일은 지금 전송되고 있다.","POINT 2 ‘수동태의 시제’ 표(진행형 줄)를 펴세요.",
  "1) right now(바로 지금)는 진행 중이라는 단서예요.  2) 파일은 보내지는 쪽이라 수동태 진행형이에요. 모양은 ‘be + being + p.p.’예요.  3) send(보내다)의 과거분사가 맞는지 봐요.","send(보내다)는 불규칙 동사예요. being 뒤 단어를 s로 시작해 t로 끝나는 네 글자로 바꿔요.","진행 수동태 = being + p.p. (send-sent-sent)"],
 ["She <u>was put</u> the trash outside.","put","She put the trash outside.","그녀는 쓰레기를 밖에 내놓았다.","POINT 1 ‘수동태의 형태와 의미’를 펴세요.",
  "1) 그녀(She)가 쓰레기를 내놓은 걸까요, 쓰레기가 내놓아진 걸까요?  2) 뒤에 the trash(쓰레기)라는 목적어가 바로 와 있어요.  3) 목적어가 바로 오면 능동태 문장이에요.","was를 지우고 동사만 남겨요. put은 현재·과거·과거분사가 모두 같은 모양이에요.","put-put-put (목적어 있으면 능동)"],
 ["The 2022 World Cup <u>held</u> in Qatar.","was held","The 2022 World Cup was held in Qatar.","2022년 월드컵은 카타르에서 개최되었다.","POINT 1 ‘수동태의 형태와 의미’와 POINT 2 과거시제 줄을 펴세요.",
  "1) World Cup(월드컵)은 개최하는 쪽일까요, 개최되는 쪽일까요?  2) 2022년 일이니 과거예요. 수동태에는 be동사가 꼭 필요해요.","held 앞에 과거 be동사를 한 개 붙여요. 주어가 단수예요.","수동태는 be동사 필수 → was + held"],
 ["We <u>were invite</u> to Dan and Lisa’s wedding.","were invited","We were invited to Dan and Lisa’s wedding.","우리는 Dan과 Lisa의 결혼식에 초대되었다.","POINT 1 ‘수동태의 형태와 의미’를 펴세요.",
  "1) were(be동사의 과거형) 뒤에는 p.p.(과거분사)가 와야 해요.  2) invite(초대하다)는 규칙 동사예요. 과거분사는 어떻게 만들까요?","invite 끝에 d 한 글자만 붙여요.","be + p.p. (규칙동사는 -ed/-d)"],
 ["The work <u>will finish</u> soon.","will be finished","The work will be finished soon.","그 일은 곧 끝날 것이다.","POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) will이 있으니 미래예요. 일(The work)은 끝내지는 쪽이라 수동태가 필요해요.  2) 미래 수동태 모양을 표에서 찾아요.","will 뒤에 be를 넣고 finish를 과거분사로 바꿔요.","will + be + p.p."],
 ["My car <u>is being repaired</u> at the time.","was being repaired","My car was being repaired at the time.","그때 내 차는 수리되고 있는 중이었다.","POINT 2 ‘수동태의 시제’ 표(진행형 줄)를 펴세요.",
  "1) 진행 수동태 모양(be + being + p.p.)은 맞아요. 그런데 at the time(그때)은 과거를 나타내요.  2) 어느 부분을 시제에 맞게 바꿔야 할까요?","is를 과거형 be동사로 바꿔요. 주어 My car는 단수예요.","at the time(그때) → was being + p.p."],
 ["The magazine <u>publishes</u> once a month.","is published","The magazine is published once a month.","그 잡지는 한 달에 한 번 출간된다.","POINT 1 ‘수동태의 형태와 의미’를 펴세요.",
  "1) 잡지(The magazine)는 출간하는 쪽일까요, 출간되는 쪽일까요?  2) once a month(한 달에 한 번)는 현재 시제 단서예요.","is 뒤에 publish(출간하다)를 과거분사로 바꿔 써요.","잡지·책은 출간되는 쪽 → is + p.p."],
 ["He <u>was written</u> the novel last year.","wrote","He wrote the novel last year.","그는 작년에 그 소설을 썼다.","POINT 1 ‘수동태의 형태와 의미’를 펴세요.",
  "1) the novel(그 소설)이 목적어로 바로 와 있어요.  2) He가 소설을 쓴 사람일까요, 쓰여진 대상일까요?  3) last year(작년)니까 과거예요.","was written을 write(쓰다)의 과거형 한 단어로 바꿔요. w로 시작해요.","write-wrote-written (능동 과거는 wrote)"]
],"본책 p.102 ");

X(1,"C",[
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>Young children love this TV show.","This TV show is loved by young children.","This TV show is loved by young children.","이 TV 프로그램은 어린 아이들에게 사랑받는다.","POINT 1 ‘수동태의 형태와 의미’의 바꾸는 순서를 펴세요.",
  "1) 목적어(this TV show)를 맨 앞 주어로 보내요.  2) 동사 love(사랑하다)는 ‘be동사 + p.p.’로 바꿔요. 원래 문장이 현재이고 새 주어가 단수예요.  3) 원래 주어는 ‘by + 목적격’ 자리로 가요.","be동사는 i로 시작하는 두 글자예요. love(사랑하다)는 -d만 붙이면 과거분사가 돼요.","목적어 → 주어, 동사 → be + p.p., 주어 → by ~"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>Van Gogh painted this picture.","This picture was painted by Van Gogh.","This picture was painted by Van Gogh.","이 그림은 Van Gogh에 의해 그려졌다.","POINT 1과 POINT 2 과거시제 줄을 펴세요.",
  "1) 목적어 this picture(이 그림)가 새 주어가 돼요.  2) painted(paint, 그리다의 과거형)이니 be동사도 과거예요.  3) Van Gogh는 by 뒤에 써요.","be동사는 w로 시작하는 세 글자예요. painted는 모양이 그대로 과거분사로 쓰여요.","과거 능동 → was/were + p.p. + by"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>The students will recycle these bottles.","These bottles will be recycled by the students.","These bottles will be recycled by the students.","이 병들은 학생들에 의해 재활용될 것이다.","POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) these bottles(이 병들)가 새 주어예요.  2) will recycle(재활용할 것이다)은 미래예요. 미래 수동태는 will 뒤에 be + p.p.를 써요.  3) the students는 by 뒤로 보내요.","will 뒤에 b로 시작하는 두 글자를 넣고, recycle(재활용하다)은 -d를 붙인 과거분사로 써요.","will + be + p.p. + by ~"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>A cheetah is chasing a zebra.","A zebra is being chased by a cheetah.","A zebra is being chased by a cheetah.","얼룩말이 치타에게 쫓기고 있다.","POINT 2 ‘수동태의 시제’ 표(진행형 줄)를 펴세요.",
  "1) is chasing(chase, 쫓다)는 진행 중이에요. 진행형 수동태는 ‘be + being + p.p.’예요.  2) 목적어 a zebra가 새 주어예요.","be동사는 원래 문장의 is를 그대로 두고, 그 뒤에 b로 시작하는 다섯 글자 + chase(쫓다)의 과거분사를 써요.","지금 하는 중 + 당함 → being + p.p."],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>Sharon and Jacob were washing the dog.","The dog was being washed by Sharon and Jacob.","The dog was being washed by Sharon and Jacob.","그 개는 Sharon과 Jacob에 의해 씻겨지고 있었다.","POINT 2 ‘수동태의 시제’ 표(진행형 줄)를 펴세요.",
  "1) were washing(wash, 씻기다)은 과거 진행형이에요.  2) 새 주어 The dog은 단수예요. 그래서 were가 아닌 단수 과거 be동사를 써요.  3) 과거 진행 수동태 = be + being + p.p.","be동사는 w로 시작하는 세 글자 과거형이에요. 그 뒤에 being, 그리고 wash(씻기다)의 과거분사가 와요.","주어 단수 + 과거 진행 → was being + p.p."]
],"본책 p.102 ");

X(1,"SA",[
 ["(보기: schedule, bite, hold, translate, tell, paint, serve) 단, 한 번씩만 쓸 것<br>Adrian ___ by a dog yesterday.","was bitten","Adrian was bitten by a dog yesterday.","Adrian은 어제 개에게 물렸다.","POINT 1과 POINT 2 과거시제 줄을 펴세요.",
  "1) by a dog(개에 의해)가 있으니 Adrian은 당하는 쪽이에요.  2) yesterday(어제)는 과거 단서예요.  3) 보기 중 ‘물다’ 뜻의 단어를 골라 과거분사로 써요.","bite(물다)는 불규칙 동사예요. 과거분사는 b로 시작하는 여섯 글자예요. 앞에 be동사 과거형이 필요해요.","bite-bit-bitten (was + p.p.)",["schedule","bite","hold","translate","tell","paint","serve"]],
 ["(보기: schedule, bite, hold, translate, tell, paint, serve) 단, 한 번씩만 쓸 것<br>Her novels ___ into Korean in 2010.","were translated","Her novels were translated into Korean in 2010.","그녀의 소설들은 2010년에 한국어로 번역되었다.","POINT 1과 POINT 2 과거시제 줄을 펴세요.",
  "1) Her novels(그녀의 소설들)는 번역되는 쪽이에요.  2) 소설이 복수이고 in 2010(2010년에)은 과거예요. be동사의 수와 시제를 맞춰요.","보기 중 ‘번역하다’ 단어의 과거분사 앞에 복수 과거 be동사를 써요.","복수 + 과거 수동태 → were + p.p.",["schedule","bite","hold","translate","tell","paint","serve"]],
 ["(보기: schedule, bite, hold, translate, tell, paint, serve) 단, 한 번씩만 쓸 것<br>They will ___ the old school building during summer vacation.","paint","They will paint the old school building during summer vacation.","그들은 여름 방학 동안 그 오래된 학교 건물을 칠할 것이다.","POINT 2 ‘수동태의 시제’ 표(미래시제 줄)와 POINT 1을 펴세요.",
  "1) They will 바로 뒤, 그리고 the old school building이라는 목적어가 와요.  2) 목적어가 뒤에 바로 있으면 수동태가 아니라 능동태예요.","will 뒤라서 동사원형이에요. ‘칠하다’ 뜻의 보기예요. p로 시작해요.","will + 동사원형 + 목적어 (능동)",["schedule","bite","hold","translate","tell","paint","serve"]],
 ["(보기: schedule, bite, hold, translate, tell, paint, serve) 단, 한 번씩만 쓸 것<br>I ___ an amazing story by my grandmother.","was told","I was told an amazing story by my grandmother.","나는 할머니께 놀라운 이야기를 들었다.","POINT 1 ‘수동태의 형태와 의미’를 펴세요.",
  "1) by my grandmother(할머니에 의해)가 있으니 I는 이야기를 듣는 쪽이에요.  2) 보기 중 ‘말해 주다’ 뜻의 동사를 골라요.  3) 과거 수동태로 써요.","tell은 불규칙 동사예요. tell-told-told이고 앞에 I에 맞는 과거 be동사를 써요.","tell-told-told (I was + p.p.)",["schedule","bite","hold","translate","tell","paint","serve"]],
 ["(보기: schedule, bite, hold, translate, tell, paint, serve) 단, 한 번씩만 쓸 것<br>The fireworks festival will ___ next week.","be held","The fireworks festival will be held next week.","불꽃놀이 축제는 다음 주에 열릴 것이다.","POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) 축제는 ‘개최되는’ 쪽이에요.  2) will 뒤에 올 동사 부분은 ‘be + p.p.’예요.  3) 보기 중 ‘개최하다’ 뜻의 단어예요.","두 단어예요. 첫 단어는 b로 시작하고 hold의 과거분사가 뒤에 와요(h로 시작).","will + be + p.p. (hold-held-held)",["schedule","bite","hold","translate","tell","paint","serve"]],
 ["(보기: schedule, bite, hold, translate, tell, paint, serve) 단, 한 번씩만 쓸 것<br>Let’s hurry. The next train to Paris ___ to leave at 10:00.","is scheduled","Let’s hurry. The next train to Paris is scheduled to leave at 10:00.","서두르자. 파리행 다음 기차는 10시에 출발할 예정이다.","POINT 1 ‘수동태의 형태와 의미’를 펴세요.",
  "1) 기차는 ‘정해지는’ 쪽이에요. 시간표에 의해 예정되는 거예요.  2) to leave at 10:00(10시에 떠나도록)이 뒤에 와요.  3) 지금 시제 단서(next train)로 현재예요.","두 단어예요. be동사 현재형 다음에 ‘예정하다’ 뜻의 과거분사(s로 시작)를 써요.","be scheduled to ~ = ~할 예정이다",["schedule","bite","hold","translate","tell","paint","serve"]],
 ["(보기: schedule, bite, hold, translate, tell, paint, serve) 단, 한 번씩만 쓸 것<br>Breakfast ___ from 7:00 to 10:00 a.m. at the hotel every day.","is served","Breakfast is served from 7:00 to 10:00 a.m. at the hotel every day.","아침 식사는 호텔에서 매일 오전 7시부터 10시까지 제공된다.","POINT 1과 POINT 2 현재시제 줄을 펴세요.",
  "1) Breakfast(아침 식사)는 제공되는 쪽이에요.  2) every day(매일)는 현재 시제 단서예요.  3) 보기 중 ‘제공하다, 차려 주다’ 뜻의 단어예요.","be동사 현재형 + serve(제공하다)의 과거분사예요. 두 단어예요.","현재 수동태 = am/are/is + p.p.",["schedule","bite","hold","translate","tell","paint","serve"]]
],"본책 p.102 ");
// ===== UNIT 1 심화 B (p.51) =====
X(1,"SB",[
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>Her dress <u>was made</u> in Italy.","O","Her dress was made in Italy.","그녀의 드레스는 이탈리아에서 만들어졌다.","POINT 1 ‘수동태의 형태와 의미’를 펴세요.",
  "1) 드레스(Her dress)는 만드는 쪽일까요, 만들어지는 쪽일까요?  2) 수동태는 ‘be동사 + p.p.’예요. was made가 이 모양인지 봐요.","was는 be동사 과거형, made는 make(만들다)의 과거분사예요(make-made-made). 두 부분이 다 규칙에 맞으면 O를 써요.","물건이 만들어짐 → was made (O)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>The doors <u>will locked</u> at nine o’clock.","will be locked","The doors will be locked at nine o’clock.","그 문들은 9시에 잠길 것이다.","POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) 문(The doors)은 잠가지는 쪽이에요.  2) will 뒤에 바로 p.p.가 와 있어요. 빠진 부분이 있어요.","will 다음에 be 한 단어를 넣어요.","will + be + p.p. (be 빠뜨리지 않기)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>Our car <u>is being wash</u> right now.","is being washed","Our car is being washed right now.","우리 차는 지금 세차되고 있다.","POINT 2 ‘수동태의 시제’ 표(진행형 줄)를 펴세요.",
  "1) right now(지금)라서 진행형 수동태예요.  2) ‘be + being + p.p.’ 중 틀린 곳이 있어요. 끝 단어를 봐요.","마지막 단어 wash(씻다)를 과거분사로 바꿔요. -ed를 붙여요.","being 뒤는 p.p. (규칙동사는 끝에 -ed)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>This beautiful song <u>was written by</u> Emma.","O","This beautiful song was written by Emma.","이 아름다운 노래는 Emma에 의해 쓰여졌다.","POINT 1 ‘수동태의 형태와 의미’를 펴세요.",
  "1) 노래(song)는 쓰이는 쪽이에요.  2) write(쓰다)의 과거분사가 맞는지, 행위자 앞에 by가 있는지 확인해요.","write(쓰다)는 write-wrote-written이에요. be동사 뒤 과거분사, 행위자 앞 by가 둘 다 맞으면 O를 써요.","행위자는 by + 목적격 (O)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>The table and chairs <u>will deliver</u> on Monday.","will be delivered","The table and chairs will be delivered on Monday.","그 탁자와 의자들은 월요일에 배달될 것이다.","POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) 탁자와 의자는 배달되는 쪽이에요.  2) will 뒤에 동사원형만 있어요. 능동 모양이에요.","will 다음에 be를 넣고 deliver(배달하다)를 과거분사로 바꿔요.","will + be + p.p. (배달되는 물건)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>His room <u>is cleaned</u> by his mother every day.","O","His room is cleaned by his mother every day.","그의 방은 매일 그의 어머니에 의해 청소된다.","POINT 1과 POINT 2 현재시제 줄을 펴세요.",
  "1) 방(His room)은 청소되는 쪽이에요.  2) every day(매일)는 현재 시제 단서예요. is cleaned가 맞는 모양인지 봐요.","주어가 단수이고 현재니까 is + p.p.가 맞는 모양인지 확인해요. 맞으면 O를 써요.","현재 수동태 is + p.p. (O)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>James Cameron <u>was directed</u> the movie <i>Avatar</i>.","directed","James Cameron directed the movie Avatar.","James Cameron이 영화 아바타를 감독했다.","POINT 1 ‘수동태의 형태와 의미’를 펴세요.",
  "1) 영화 Avatar라는 목적어가 바로 뒤에 있어요.  2) James Cameron은 감독한 사람이에요. 능동일까요, 수동일까요?","was를 빼고 direct(감독하다)의 과거형 한 단어만 써요.","목적어가 뒤에 오면 능동 (was 삭제)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>The tables <u>were being setting</u> when we entered the dining room.","were being set","The tables were being set when we entered the dining room.","우리가 식당에 들어갔을 때 식탁들이 차려지고 있었다.","POINT 2 ‘수동태의 시제’ 표(진행형 줄)를 펴세요.",
  "1) 식탁(The tables)은 차려지는 쪽이에요.  2) 과거 진행 수동태는 ‘be + being + p.p.’예요. being 뒤에 -ing를 또 쓸 수는 없어요.","set(놓다, 차리다)은 현재·과거·과거분사가 같은 모양이에요. -ing를 떼고 과거분사 세 글자로 바꿔요.","being 뒤는 p.p. (set-set-set)"]
],"본책 p.102 ");
// ===== UNIT 1 심화 C (p.51) =====
X(1,"SC",[
 ["능동태는 수동태 문장으로, 수동태는 능동태 문장으로 바꿔 쓰시오.<br>Dr. Green will give the lecture.","The lecture will be given by Dr. Green.","The lecture will be given by Dr. Green.","그 강의는 Dr. Green에 의해 진행될 것이다.","POINT 1과 POINT 2 미래시제 줄을 펴세요.",
  "1) 능동태 문장이에요. 목적어 the lecture(강의)를 새 주어로 보내요.  2) will give(주다, 하다)는 will + be + p.p.로 바꿔요.  3) Dr. Green은 by 뒤로 가요.","give(주다)는 give-gave-given이에요. will 뒤에 b로 시작하는 두 글자 + 과거분사(g로 시작)를 써요.","능동 → 수동: will + be + p.p. + by"],
 ["능동태는 수동태 문장으로, 수동태는 능동태 문장으로 바꿔 쓰시오.<br>Some houses were damaged by the storm.","The storm damaged some houses.","The storm damaged some houses.","폭풍이 몇몇 집들에 피해를 입혔다.","POINT 1 ‘수동태의 형태와 의미’의 바꾸는 순서를 펴세요.",
  "1) 이번에는 수동태를 능동태로 바꿔요. by 뒤 the storm(폭풍)이 새 주어예요.  2) some houses(몇몇 집들)는 목적어가 돼요.  3) were damaged는 과거 능동 동사로 돌려요.","동사는 damage(손상시키다)의 과거형 한 단어예요. 문장 전체는 네 단어예요.","수동 → 능동: by 뒤 = 주어, be + p.p. = 동사"],
 ["능동태는 수동태 문장으로, 수동태는 능동태 문장으로 바꿔 쓰시오.<br>Your books are read by both children and adults.","Both children and adults read your books.","Both children and adults read your books.","어린이와 어른 모두 당신의 책을 읽는다.","POINT 1 ‘수동태의 형태와 의미’의 바꾸는 순서를 펴세요.",
  "1) by 뒤 both children and adults(어린이와 어른 모두)가 새 주어예요.  2) your books는 목적어로 가요.  3) are read는 현재 능동 동사로 바꿔요.","주어가 복수예요. 현재형이니까 read(읽다) 원형 그대로 써요.","수동 → 능동: by 뒤를 주어로, be p.p. → 동사"],
 ["능동태는 수동태 문장으로, 수동태는 능동태 문장으로 바꿔 쓰시오.<br>He was being followed by a stranger.","A stranger was following him.","A stranger was following him.","한 낯선 사람이 그를 따라가고 있었다.","POINT 2 ‘수동태의 시제’ 표(진행형 줄)를 펴세요.",
  "1) was being followed(쫓기고 있었다)는 과거 진행 수동태예요.  2) 이걸 능동으로 바꾸면 ‘was + -ing’ 진행형이 돼요.  3) He는 목적격 him으로 바꿔요.","be동사 과거형은 주어 a stranger(단수)에 맞춰요. follow(따라가다)는 -ing를 붙이고, he는 목적격(h로 시작하는 세 글자)으로 바꿔요.","과거 진행 수동 → 능동: was + -ing"],
 ["능동태는 수동태 문장으로, 수동태는 능동태 문장으로 바꿔 쓰시오.<br>The police arrested the robber yesterday.","The robber was arrested by the police yesterday.","The robber was arrested by the police yesterday.","강도는 어제 경찰에 의해 체포되었다.","POINT 1과 POINT 2 과거시제 줄을 펴세요.",
  "1) 능동태를 수동태로 바꿔요. 목적어 the robber(강도)가 새 주어예요.  2) arrested(arrest, 체포하다의 과거형)이므로 과거 수동태 was + p.p.예요.  3) yesterday는 문장 끝에 그대로 두어요.","be동사는 w로 시작하는 세 글자 과거형이에요. yesterday(어제)는 by ~ 뒤, 맨 끝에 둬요.","과거 능동 → was + p.p. + by ~"]
],"본책 p.102 ");
// ===== UNIT 2 기본 A (p.52) =====
V(2,"A",[
 ["The phone (was not / not was) answered by my sister.","was not","The phone was not answered by my sister.","그 전화는 내 여동생에 의해 받아지지 않았다.","POINT 1 ‘부정문과 의문문’ 수동태의 부정문 줄을 펴세요.",
  "1) 수동태의 부정문은 be동사 뒤에 not을 붙여요.  2) 두 보기 중 not이 be동사 앞인지 뒤인지 봐요.","was가 먼저 나오는 첫 번째 보기예요.","be동사 + not + p.p. (부정문)"],
 ["Why (is the door / the door is) closed?","is the door","Why is the door closed?","왜 문이 닫혀 있나요?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) 의문사 Why(왜)가 문장 맨 앞에 있어요.  2) 의문사가 있는 의문문은 ‘의문사 + be동사 + 주어 + p.p.’ 순서예요.","be동사가 주어(the door)보다 먼저 오는 첫 번째 보기예요.","의문사 + be + 주어 + p.p. ~?"],
 ["(Did / Was) the hotel built a long time ago?","Was","Was the hotel built a long time ago?","그 호텔은 오래 전에 지어졌나요?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) built는 build(짓다)의 과거분사예요. 수동태에는 be동사가 필요해요.  2) a long time ago(오래 전에)는 과거 시점이에요.","Did는 일반 동사 의문문에 써요. 이 문장에는 맞지 않아요. 두 번째 보기예요.","수동태 의문문 = be동사 + 주어 + p.p."],
 ["The window (was / did) not broken by Chris.","was","The window was not broken by Chris.","그 창문은 Chris에 의해 깨지지 않았다.","POINT 1 ‘부정문과 의문문’ 수동태의 부정문 줄을 펴세요.",
  "1) broken은 break(깨뜨리다)의 과거분사예요.  2) 수동태는 be동사 + not + p.p. 순서예요. not 앞에 올 말은?","be동사 과거형이에요. w로 시작하는 세 글자예요.","수동태 부정문엔 did 대신 be동사"],
 ["(Have / Was) your bike stolen yesterday?","Was","Was your bike stolen yesterday?","네 자전거가 어제 도난당했니?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) yesterday(어제)는 과거 단서예요.  2) stolen은 steal(훔치다)의 과거분사예요. 수동태 의문문은 be동사를 주어 앞에 써요.","과거 단수 be동사예요. 두 번째 보기예요.","수동태 의문문(과거) = Was/Were + 주어 + p.p."],
 ["The patients must (be / are) treated with care.","be","The patients must be treated with care.","환자들은 조심스럽게 치료받아야 한다.","POINT 2 ‘조동사가 있는 문장의 수동태’ 표를 펴세요.",
  "1) must(~해야 한다)는 조동사예요.  2) 조동사 뒤에는 동사원형이 와요. 조동사가 있는 수동태는 ‘조동사 + be + p.p.’예요.","조동사 뒤에 are 같은 활용형은 못 와요. 원형 두 글자 be예요.","조동사 + be + p.p."],
 ["Where should the food (be / being) kept?","be","Where should the food be kept?","음식은 어디에 보관해야 하나요?","POINT 2 ‘조동사가 있는 문장의 수동태’ 표를 펴세요.",
  "1) should(~해야 한다)는 조동사예요.  2) 조동사 뒤에는 동사원형을 써요. 의문문은 ‘조동사 + 주어 + be + p.p.’ 순서예요.","동사원형은 두 글자 b로 시작해요. -ing 모양이 아니에요.","조동사 의문문 = 조동사 + 주어 + be + p.p."],
 ["The schedule (cannot be / can be not) changed.","cannot be","The schedule cannot be changed.","그 일정은 바뀔 수 없다.","POINT 2 ‘조동사가 있는 문장의 수동태’ 표(부정문 줄)를 펴세요.",
  "1) 조동사가 있는 수동태의 부정문은 ‘조동사 + not + be + p.p.’예요.  2) not이 be 앞인지 뒤인지 봐요.","not이 be보다 앞에 오는 첫 번째 보기예요. can의 부정은 cannot이에요.","조동사 + not + be + p.p."]
],"본책 p.104 ");

X(2,"B",[
 ["우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>왜 비행기가 지연되었나요? (delay)<br>___ ___ the flight ___?","Why, was, delayed","Why was the flight delayed?","왜 비행기가 지연되었나요?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) ‘왜’를 뜻하는 의문사가 맨 앞이에요.  2) 의문사 다음에 be동사, 그 뒤에 주어 the flight, 마지막에 p.p. 순서예요.  3) 비행기가 이미 지연된 일이니 과거예요.","첫 칸은 ‘왜’ 뜻의 의문사(W로 시작), 둘째 칸은 be동사 과거형, 셋째 칸은 delay(지연시키다)의 과거분사예요.","의문사 + be + 주어 + p.p."],
 ["우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>Jamie가 의사의 진료를 받았나요? (see)<br>___ Jamie ___ by a doctor?","Was, seen","Was Jamie seen by a doctor?","Jamie가 의사의 진료를 받았나요?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) Jamie는 진료를 ‘받은’ 쪽이라 수동태예요.  2) 의문문이라 be동사가 주어 앞에 나와요.  3) 뒤에 by a doctor(의사에 의해)가 있어요.","첫 칸은 과거 단수 be동사예요. 둘째 칸은 see(보다)의 과거분사로 s로 시작하는 네 글자예요.","수동태 의문문 = Was + 주어 + p.p. (see-saw-seen)"],
 ["우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>이 태블릿은 수리될 수 있나요? (can, fix)<br>___ this tablet ___ ___?","Can, be fixed","Can this tablet be fixed?","이 태블릿은 수리될 수 있나요?","POINT 2 ‘조동사가 있는 문장의 수동태’ 표(의문문 줄)를 펴세요.",
  "1) 조동사 can(~할 수 있다)이 있는 의문문이에요.  2) 순서는 ‘조동사 + 주어 + be + p.p.’예요.","첫 칸 조동사, 둘째 칸 be, 셋째 칸 fix(고치다)의 과거분사예요.","조동사 + 주어 + be + p.p. ~?"],
 ["우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>그의 소포는 제시간에 도착하지 않았다. (deliver)<br>His package ___ ___ ___ on time.","was not delivered","His package was not delivered on time.","그의 소포는 제시간에 배달되지 않았다.","POINT 1 ‘부정문과 의문문’ 수동태의 부정문 줄을 펴세요.",
  "1) 소포(His package)는 배달되는 쪽이라 수동태예요.  2) 이미 지난 일이니 과거예요.  3) 부정문은 be동사 뒤에 not을 넣어요.","세 칸이에요. be동사 과거형, not, deliver(배달하다)의 과거분사 순서예요.","과거 수동 부정: was not + p.p."]
],"본책 p.104 ");

X(2,"C",[
 ["지시대로 바꿔 쓰시오. (부정문으로)<br>I was impressed by his speech.","I was not[wasn’t] impressed by his speech.","I was not impressed by his speech.","나는 그의 연설에 감명받지 않았다.","POINT 1 ‘부정문과 의문문’ 수동태의 부정문 줄을 펴세요.",
  "1) 수동태의 부정문은 be동사 바로 뒤에 not을 붙여요.  2) 이 문장의 be동사는 무엇인지 찾아요.","was 바로 뒤에 not을 넣어요. 줄여 쓰면 wasn’t예요.","be동사 + not + p.p. (was not)"],
 ["지시대로 바꿔 쓰시오. (의문문으로)<br>The website was attacked by hackers.","Was the website attacked by hackers?","Was the website attacked by hackers?","그 웹사이트는 해커들에게 공격받았나요?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) 수동태의 의문문은 be동사를 주어 앞으로 보내요.  2) 문장 끝에는 물음표를 써요.","was를 맨 앞으로 옮기고 첫 글자를 대문자로 바꿔요. 나머지는 그대로예요.","be동사 + 주어 + p.p. ~?"],
 ["지시대로 바꿔 쓰시오. (부정문으로)<br>This printer is used very often.","This printer is not[isn’t] used very often.","This printer is not used very often.","이 프린터는 매우 자주 사용되지는 않는다.","POINT 1 ‘부정문과 의문문’ 수동태의 부정문 줄을 펴세요.",
  "1) 부정문은 be동사 뒤에 not이에요.  2) 이 문장에서 be동사는 is예요.","is와 used 사이에 not을 넣어요.","is not[isn’t] + p.p."],
 ["지시대로 바꿔 쓰시오. (부정문으로)<br>She may be promoted this year.","She may not be promoted this year.","She may not be promoted this year.","그녀는 올해 승진하지 않을지도 모른다.","POINT 2 ‘조동사가 있는 문장의 수동태’ 표(부정문 줄)를 펴세요.",
  "1) may(~일지도 모른다)는 조동사예요.  2) 조동사가 있는 수동태의 부정문은 ‘조동사 + not + be + p.p.’예요.","not은 be 앞, may 바로 뒤에 넣어요.","may not be + p.p. (~않을지도)"],
 ["지시대로 바꿔 쓰시오. (의문문으로)<br>He was picked for the soccer team.","Was he picked for the soccer team?","Was he picked for the soccer team?","그는 축구팀에 뽑혔나요?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) be동사를 주어 앞으로 보내요.  2) 주어는 He예요. 문장 중간에 오면 소문자로 써요.","첫 단어는 대문자 W로 시작하는 be동사, 둘째 단어는 소문자 주어예요. 물음표로 끝내요.","Was + 주어 + p.p. ~? (대문자 주의)"]
],"본책 p.104 ");

V(2,"SA",[
 ["These boxes should (aren’t be / not be / don’t be) moved outside.","not be","These boxes should not be moved outside.","이 상자들은 밖으로 옮겨져서는 안 된다.","POINT 2 ‘조동사가 있는 문장의 수동태’ 표(부정문 줄)를 펴세요.",
  "1) should는 조동사예요.  2) 조동사가 있는 수동태의 부정문은 ‘조동사 + not + be + p.p.’예요.  3) 조동사 바로 뒤에 올 말을 골라요.","not이 먼저, be가 나중이에요. aren’t나 don’t는 조동사 뒤에 못 와요. 두 번째 보기예요.","should not be + p.p. (~되면 안 됨)"],
 ["You (don’t allowed / aren’t allowed / don’t be allowed) to take photos here.","aren’t allowed","You aren’t allowed to take photos here.","여기서는 사진을 찍는 것이 허용되지 않는다.","POINT 1 ‘부정문과 의문문’ 수동태의 부정문 줄을 펴세요.",
  "1) allowed(허락된)는 p.p.예요. 수동태에는 be동사가 필요해요.  2) 수동태의 부정문은 be동사 + not + p.p.예요. 주어 You에 맞는 be동사를 찾아요.","don’t는 일반 동사의 부정이에요. are not의 줄임말이 들어간 두 번째 보기예요.","수동태 부정 = be동사 + not (don’t 아님)"],
 ["Are these windows (close / closed / closing) at night?","closed","Are these windows closed at night?","이 창문들은 밤에 닫혀 있나요?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) 의문문은 ‘be동사 + 주어 + p.p.’예요.  2) 창문(windows)은 닫힘을 당하는 쪽이에요.","Are 뒤에는 과거분사가 와요. close(닫다)의 과거분사로 -d가 붙은 보기예요.","Are + 주어 + p.p. ~?"],
 ["Will a prize (is / be / being) given to the winner of the contest?","be","Will a prize be given to the winner of the contest?","대회의 우승자에게 상이 주어질까요?","POINT 2 ‘조동사가 있는 문장의 수동태’ 표(의문문 줄)를 펴세요.",
  "1) Will(~할 것이다)은 조동사예요.  2) 의문문은 ‘조동사 + 주어 + be + p.p.’예요.  3) 조동사 뒤에는 동사원형이에요.","be동사의 원형이에요. 두 글자 b로 시작해요.","Will + 주어 + be + p.p. ~?"],
 ["Why (was he / he was / be he) punished by his father?","was he","Why was he punished by his father?","그는 왜 아버지에게 벌을 받았나요?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) 의문사 Why 뒤에 오는 순서를 떠올려요.  2) 의문사가 있는 수동태 의문문은 ‘의문사 + be동사 + 주어 + p.p.’예요.","be동사가 주어 앞에 나오는 첫 번째 보기예요.","Why + was + he + p.p. (왜 ~됐나)"],
 ["(What are you / What you are / Are you what) interested in?","What are you","What are you interested in?","너는 무엇에 관심이 있니?","POINT 1 ‘부정문과 의문문’ 수동태 의문문 줄과 p.106 UNIT 3의 be interested in 표를 함께 펴세요.",
  "1) ‘be interested in(~에 관심이 있다)’의 의문문이에요.  2) 의문사가 맨 앞에 와요.  3) 그 뒤에 be동사, 주어 순서예요.","What 다음에 be동사 are, 그 다음에 주어 you예요. 첫 번째 보기예요.","What + be + 주어 + interested in?"],
 ["Your laundry should (is / be / being) done by now.","be","Your laundry should be done by now.","당신의 빨래는 지금쯤이면 되어 있어야 한다.","POINT 2 ‘조동사가 있는 문장의 수동태’ 표를 펴세요.",
  "1) should는 조동사예요. 뒤에 동사원형이 와요.  2) 수동태 모양은 ‘조동사 + be + p.p.’예요. done은 do의 과거분사예요.","원형 두 글자예요. b로 시작해요.","should + be + p.p. (do-did-done)"],
 ["The report will (finished / be finished / being finished) by tomorrow.","be finished","The report will be finished by tomorrow.","그 보고서는 내일까지 끝나 있을 것이다.","POINT 2 ‘조동사가 있는 문장의 수동태’ 표를 펴세요.",
  "1) will 다음에 올 말이에요. 보고서는 끝내지는 쪽이에요.  2) 조동사 뒤에는 ‘be + p.p.’를 써요.","be와 finished가 함께 있는 두 번째 보기예요.","미래 수동태에서 be 빠뜨리기 금지"]
],"본책 p.104 ");

X(2,"SB",[
 ["( ) 안의 말을 이용하여 수동태 문장을 완성하시오.<br>Jake asked her several questions, but his questions ___ ___ ___. (not, answer)","were not answered","Jake asked her several questions, but his questions were not answered.","Jake는 그녀에게 몇 가지 질문을 했지만, 그의 질문들은 대답되지 않았다.","POINT 1 ‘부정문과 의문문’ 수동태의 부정문 줄을 펴세요.",
  "1) 질문(questions)은 대답을 ‘받는’ 쪽이에요. 수동태예요.  2) 앞 문장이 과거(asked)이고 주어가 복수예요.  3) 부정문은 be동사 + not + p.p.예요.","세 칸이에요. 복수 과거 be동사, not, answer(대답하다)의 과거분사 순서예요.","be동사 + not + p.p. (복수 과거: were)"],
 ["( ) 안의 말을 이용하여 수동태 문장을 완성하시오.<br>They say a big storm is coming. The field trip ___ ___ ___. (may, postpone)","may be postponed","They say a big storm is coming. The field trip may be postponed.","큰 폭풍이 오고 있다고 한다. 현장 학습은 연기될지도 모른다.","POINT 2 ‘조동사가 있는 문장의 수동태’ 표(긍정문 줄)를 펴세요.",
  "1) 현장 학습(The field trip)은 연기되는 쪽이에요.  2) 조동사 may(~일지도 모른다)가 있으니 ‘조동사 + be + p.p.’ 순서예요.","세 칸이에요. 첫 칸은 주어진 조동사예요. 마지막 칸은 postpone(연기하다)의 과거분사예요.","조동사 + be + p.p. (may be postponed)"],
 ["( ) 안의 말을 이용하여 수동태 문장을 완성하시오.<br>___ Spanish ___ in Mexico? (use)","Is, used","Is Spanish used in Mexico?","스페인어는 멕시코에서 사용되나요?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) 스페인어(Spanish)는 사용되는 쪽이에요.  2) 의문문은 be동사가 맨 앞이에요. 시제 단서는 없고 일반적인 사실이니 현재예요.","첫 칸은 be동사 현재형(i로 시작), 둘째 칸은 use(사용하다)의 과거분사예요.","현재 수동태 의문문 = Is + 주어 + p.p."],
 ["( ) 안의 말을 이용하여 수동태 문장을 완성하시오.<br>Tracy is sad because she ___ ___ ___ to Jeff’s party last Saturday. (not, invite)","was not invited","Tracy is sad because she was not invited to Jeff’s party last Saturday.","Tracy는 지난 토요일 Jeff의 파티에 초대받지 못해서 슬프다.","POINT 1 ‘부정문과 의문문’ 수동태의 부정문 줄을 펴세요.",
  "1) last Saturday(지난 토요일)는 과거예요.  2) she는 초대받지 못한 쪽이에요.  3) 부정문은 be동사 + not + p.p.예요.","세 칸이에요. 단수 과거 be동사, not, invite(초대하다)의 과거분사 순서예요.","과거 수동태 부정 = was not + p.p."]
],"본책 p.104 ");
// ===== UNIT 2 심화 C (p.53) =====
X(2,"SC",[
 ["지시대로 바꿔 쓰시오. (부정문으로)<br>These vegetables should be kept in the refrigerator.","These vegetables should not[shouldn’t] be kept in the refrigerator.","These vegetables should not be kept in the refrigerator.","이 채소들은 냉장고에 보관되어서는 안 된다.","POINT 2 ‘조동사가 있는 문장의 수동태’ 표(부정문 줄)를 펴세요.",
  "1) 조동사가 있는 수동태의 부정문 공식을 표에서 찾아요.  2) not이 들어갈 자리는 조동사와 be 사이예요.","should 바로 뒤에 not을 넣어요. 줄이면 shouldn’t예요.","should not[shouldn’t] + be + p.p. 부정"],
 ["지시대로 바꿔 쓰시오. (의문문으로)<br>The pills should be stored in a cool and dry area.","Should the pills be stored in a cool and dry area?","Should the pills be stored in a cool and dry area?","그 알약들은 시원하고 건조한 곳에 보관되어야 하나요?","POINT 2 ‘조동사가 있는 문장의 수동태’ 표(의문문 줄)를 펴세요.",
  "1) 조동사 의문문은 ‘조동사 + 주어 + be + p.p. ~?’예요.  2) 조동사를 맨 앞으로 옮겨요.","조동사를 대문자 S로 시작하게 맨 앞에 두고, 주어 뒤에는 원래 있던 두 단어(b로 시작)를 그대로 이어요.","Should + 주어 + be + p.p. ~?"],
 ["지시대로 바꿔 쓰시오. (부정문으로)<br>The new library will be built on this site next year.","The new library will not[won’t] be built on this site next year.","The new library will not be built on this site next year.","새 도서관은 내년에 이 부지에 지어지지 않을 것이다.","POINT 2 ‘조동사가 있는 문장의 수동태’ 표(부정문 줄)를 펴세요.",
  "1) will(~할 것이다)도 조동사예요.  2) 조동사 뒤, be 앞에 not을 넣어요.","will 바로 뒤에 not을 넣어요. 줄이면 won’t예요.","will not[won’t] + be + p.p."],
 ["지시대로 바꿔 쓰시오. (부정문으로)<br>This washing machine was made in Germany.","This washing machine was not[wasn’t] made in Germany.","This washing machine was not made in Germany.","이 세탁기는 독일에서 만들어지지 않았다.","POINT 1 ‘부정문과 의문문’ 수동태의 부정문 줄을 펴세요.",
  "1) 조동사가 없는 수동태예요. be동사 뒤에 not을 붙여요.  2) be동사는 was예요.","was와 made 사이에 not을 넣어요. 줄이면 wasn’t예요.","was not made = 만들어지지 않았다"],
 ["지시대로 바꿔 쓰시오. (의문문으로)<br>Clara was given a ticket for running a red light.","Was Clara given a ticket for running a red light?","Was Clara given a ticket for running a red light?","Clara는 신호 위반으로 딱지를 받았나요?","POINT 1 ‘부정문과 의문문’ 수동태의 의문문 줄을 펴세요.",
  "1) be동사 was를 주어 앞으로 보내요.  2) Clara는 이름이라 대문자를 유지해요.  3) 문장 끝은 물음표예요.","첫 단어는 대문자 W로 시작하는 be동사예요. 그 뒤 순서는 ‘주어 + p.p. + 나머지’예요.","Was Clara given ~? 의문문은 be 먼저"]
],"본책 p.104 ");
// ===== UNIT 3 기본 A (p.54) =====
V(3,"A",[
 ["Our flight (arrived / was arrived) an hour ahead of schedule.","arrived","Our flight arrived an hour ahead of schedule.","우리 비행기는 예정보다 한 시간 일찍 도착했다.","POINT 2 ‘수동태로 쓰이지 않는 동사’ 자동사 줄을 펴세요.",
  "1) arrive(도착하다) 뒤에는 목적어가 없어요.  2) 목적어가 없는 동사는 수동태로 바꿀 수 없어요.","be동사가 없는 첫 번째 보기예요.","자동사(arrive)는 수동태 불가"],
 ["She (resembles / is resembled) her sister.","resembles","She resembles her sister.","그녀는 여동생을 닮았다.","POINT 2 ‘수동태로 쓰이지 않는 동사’ 소유·상태 동사 줄을 펴세요.",
  "1) resemble(닮다)은 상태를 나타내는 동사예요.  2) 이런 동사는 목적어가 있어도 수동태로 쓰지 않아요.","be동사가 없고, 주어가 she라서 끝에 -s가 붙은 첫 번째 보기예요.","상태 동사(resemble)는 수동태 안 씀"],
 ["The game (put off / was put off) because of the rain.","was put off","The game was put off because of the rain.","그 경기는 비 때문에 연기되었다.","POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) 경기(The game)는 연기되는 쪽이에요.  2) put off(미루다)는 두 단어가 한 덩어리 동사구예요.  3) 동사구의 동사 부분만 be + p.p.로 바꾸고 off는 그대로 둬요.","be동사가 앞에 붙은 두 번째 보기예요.","동사구 수동태 = be + p.p. + 전치사/부사"],
 ["My science book (disappeared / was disappeared).","disappeared","My science book disappeared.","내 과학책이 사라졌다.","POINT 2 ‘수동태로 쓰이지 않는 동사’ 자동사 줄을 펴세요.",
  "1) disappear(사라지다)는 목적어를 갖지 않는 자동사예요.  2) 목적어가 없으면 수동태로 만들 수 없어요.","be가 붙지 않은 첫 번째 보기예요.","disappear는 자동사 → 수동태 X"],
 ["My brother’s shoes (fit / were fit) me well.","fit","My brother’s shoes fit me well.","내 남동생의 신발은 나에게 잘 맞는다.","POINT 2 ‘수동태로 쓰이지 않는 동사’ 소유·상태 동사 줄을 펴세요.",
  "1) fit(맞다)은 상태를 나타내는 타동사예요.  2) 소유·상태 동사는 목적어(me)가 있어도 수동태로 쓰지 않아요.","be동사가 없는 첫 번째 보기예요.","fit·have·suit 등 상태 동사는 능동"],
 ["The shopping mall was filled (by / with) teenagers.","with","The shopping mall was filled with teenagers.","쇼핑몰은 십 대들로 가득 차 있었다.","POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) be filled ___ ~는 ‘~로 가득 차다’는 뜻의 정해진 표현이에요.  2) 표에서 filled 뒤에 오는 전치사를 확인해요.","w로 시작하는 네 글자예요.","be filled with ~(~로 가득 차다)"],
 ["We are worried (to / about) your health.","about","We are worried about your health.","우리는 당신의 건강이 걱정된다.","POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) be worried ___ ~는 ‘~에 대해 걱정하다’라는 정해진 표현이에요.  2) 표에서 worried 뒤 전치사를 찾아요.","a로 시작하는 다섯 글자예요.","be worried about ~(~을 걱정하다)"],
 ["I am interested (in / with) learning French.","in","I am interested in learning French.","나는 프랑스어를 배우는 것에 관심이 있다.","POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) be interested ___ ~는 ‘~에 관심이 있다’는 정해진 표현이에요.  2) 표에서 interested 뒤 전치사를 확인해요.","i로 시작하는 두 글자예요.","be interested in ~(~에 관심 있다)"]
],"본책 p.106 ");
// ===== UNIT 3 기본 B (p.54) =====
X(3,"B",[
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>A truck ran over a deer last night.<br>→ A deer ___ by a truck last night.","was run over","A deer was run over by a truck last night.","사슴 한 마리가 어젯밤 트럭에 치였다.","POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) run over(차로 치다)는 한 덩어리 동사구예요.  2) 빈칸에는 ‘be동사 + p.p. + over’ 전체가 들어가요.  3) last night(어젯밤)이니 과거예요.","세 단어예요. 과거 be동사, run의 과거분사(run-ran-run), 그리고 over예요.","동사구 수동태: be + p.p. + 전치사/부사"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>Henry’s aunt and uncle brought him up.<br>→ Henry ___ by his aunt and uncle.","was brought up","Henry was brought up by his aunt and uncle.","Henry는 그의 이모와 삼촌에 의해 길러졌다.","POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) bring up(기르다)은 한 덩어리 동사구예요.  2) him이 새 주어 Henry가 되고 시제는 과거예요.  3) up을 빠뜨리지 않아요.","세 단어예요. 과거 be동사, bring의 과거분사(bring-brought-brought), up이에요.","bring up → be brought up"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>Irene’s daughter looks up to her.<br>→ Irene ___ by her daughter.","is looked up to","Irene is looked up to by her daughter.","Irene은 그녀의 딸에게 존경받는다.","POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) look up to(존경하다)는 세 단어짜리 동사구예요.  2) looks가 현재이므로 수동태도 현재예요.  3) 뒤의 up to까지 모두 남겨요.","네 단어예요. be동사 현재형(i로 시작), look의 과거분사, 그리고 up to를 빠뜨리지 않아요.","look up to → be looked up to"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>My friends laughed at my idea.<br>→ My idea ___ by my friends.","was laughed at","My idea was laughed at by my friends.","내 아이디어는 내 친구들에게 비웃음을 당했다.","POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) laugh at(비웃다)은 동사구예요.  2) laughed는 과거이고 새 주어 My idea는 단수예요.  3) at을 빠뜨리지 않아요.","세 단어예요. 단수 과거 be동사, laugh(비웃다)의 과거분사, 그리고 a로 시작하는 전치사예요.","laugh at → be laughed at"]
],"본책 p.106 ");
// ===== UNIT 3 기본 C (p.54) =====
X(3,"C",[
 ["우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그 아기는 그의 삼촌에 의해 돌봐졌다. (his uncle / was / the baby / after / looked / by)","The baby was looked after by his uncle.","The baby was looked after by his uncle.","그 아기는 그의 삼촌에 의해 돌봐졌다.","POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) 주어는 ‘그 아기’예요. 문장을 대문자로 시작해요.  2) 동사구 look after(돌보다)는 ‘was looked after’ 모양으로 붙여 써요.  3) ‘~에 의해’ by 뒤에 행위자 his uncle이 와요.","The baby로 시작해요. 동사 덩어리는 세 단어이고 전치사 after를 빠뜨리지 않아요.","동사구 수동태 → 전치사 남기기 + by",["his uncle","was","the baby","after","looked","by"]],
 ["우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>나는 내 새 헤어스타일에 만족한다. (satisfied / I / am / with / hairstyle / my new)","I am satisfied with my new hairstyle.","I am satisfied with my new hairstyle.","나는 내 새 헤어스타일에 만족한다.","POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) be satisfied with(~에 만족하다)는 정해진 표현이에요.  2) 주어 I 뒤에 be동사를 써요.  3) with 뒤에 만족하는 대상이 와요.","I am으로 시작해요. 그다음 ‘만족한’ 뜻의 단어와 짝 전치사를 붙여요.","be satisfied with ~(~에 만족하다)",["satisfied","I","am","with","hairstyle","my new"]],
 ["우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>작은 토끼가 Alice 앞에 나타났다. (a / small / appeared / in front of / rabbit / Alice)","A small rabbit appeared in front of Alice.","A small rabbit appeared in front of Alice.","작은 토끼가 Alice 앞에 나타났다.","POINT 2 ‘수동태로 쓰이지 않는 동사’ 자동사 줄을 펴세요.",
  "1) appear(나타나다)는 목적어가 없는 자동사예요.  2) 그래서 was appeared처럼 수동태로 쓰지 않아요.  3) 주어 A small rabbit 다음에 동사, 그 뒤 장소 표현이에요.","A small rabbit으로 시작해요. 동사는 be동사 없이 한 단어예요.","자동사 appear는 능동으로만",["a","small","appeared","in front of","rabbit","Alice"]],
 ["우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그들은 그들의 승리에 놀랐다. (surprised / they / were / their victory / at)","They were surprised at their victory.","They were surprised at their victory.","그들은 그들의 승리에 놀랐다.","POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) be surprised at(~에 놀라다)은 정해진 표현이에요.  2) 주어 They 뒤에 be동사 과거형을 써요.  3) at 뒤에 놀란 이유가 와요.","They로 시작해요. be동사 다음에 ‘놀란’ 뜻의 단어와 짝 전치사(a로 시작)가 와요.","be surprised at ~(~에 놀라다)",["surprised","they","were","their victory","at"]],
 ["우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>내 남동생의 신발은 진흙으로 덮여 있었다. (were / shoes / in / covered / my brother’s / mud)","My brother’s shoes were covered in mud.","My brother’s shoes were covered in mud.","내 남동생의 신발은 진흙으로 덮여 있었다.","POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) be covered with[in](~로 덮여 있다) 표현이에요.  2) 주어는 my brother’s shoes(복수)이므로 be동사는 복수 과거예요.  3) 마지막에 덮은 것(mud)이 와요.","My brother’s shoes로 시작해요. be동사 + ‘덮인’ 뜻의 단어 + 두 글자 전치사 순서예요.","be covered in[with] ~(~로 덮여 있다)",["were","shoes","in","covered","my brother’s","mud"]]
],"본책 p.106 ");
// ===== UNIT 3 심화 A (p.55) =====
X(3,"SA",[
 ["(보기: happen, lack, bring up, be satisfied with, be covered with) 단, 과거시제로 쓸 것<br>He ___ confidence and courage.","lacked","He lacked confidence and courage.","그는 자신감과 용기가 부족했다.","POINT 2 ‘수동태로 쓰이지 않는 동사’ 소유·상태 동사 줄을 펴세요.",
  "1) 뒤의 confidence and courage(자신감과 용기)가 목적어예요.  2) 보기 중 ‘~이 부족하다’ 뜻의 동사를 골라요.  3) 과거시제로 써요.","lack은 상태 동사라서 수동태로 쓰지 않아요. 그냥 -ed만 붙여 l로 시작하는 단어를 써요.","lack(~이 부족하다)은 능동 (lacked)",["happen","lack","bring up","be satisfied with","be covered with"]],
 ["(보기: happen, lack, bring up, be satisfied with, be covered with) 단, 과거시제로 쓸 것<br>She ___ in a big family.","was brought up","She was brought up in a big family.","그녀는 대가족에서 자랐다.","POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) ‘자라다’는 ‘길러지다’로 생각하면 수동태예요.  2) 보기의 동사구 bring up(기르다)을 써요.  3) 과거시제이고 주어는 She예요.","세 단어예요. 단수 과거 be동사, bring(가져오다)의 과거분사(b로 시작), 그리고 up이에요.","bring up → was brought up(자랐다)",["happen","lack","bring up","be satisfied with","be covered with"]],
 ["(보기: happen, lack, bring up, be satisfied with, be covered with) 단, 과거시제로 쓸 것<br>I wasn’t sure what ___ to her.","happened","I wasn’t sure what happened to her.","나는 그녀에게 무슨 일이 일어났는지 확신하지 못했다.","POINT 2 ‘수동태로 쓰이지 않는 동사’ 자동사 줄을 펴세요.",
  "1) what ___ to her(그녀에게 무슨 일이 ~했는지)에서 what이 주어예요.  2) 목적어가 없는 자동사예요. 수동태가 아니에요.","h로 시작하는 보기의 과거형이에요. 여덟 글자예요.","happen은 자동사 → 수동태 불가",["happen","lack","bring up","be satisfied with","be covered with"]],
 ["(보기: happen, lack, bring up, be satisfied with, be covered with) 단, 과거시제로 쓸 것<br>The old book ___ dust.","was covered with","The old book was covered with dust.","그 오래된 책은 먼지로 덮여 있었다.","POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) 책은 먼지로 덮여 있는 쪽이에요.  2) be covered with[in](~로 덮여 있다)을 과거로 써요.  3) 주어 The old book은 단수예요.","세 단어예요. 단수 과거 be동사 + covered + w로 시작하는 전치사예요.","be covered with ~(~로 덮여 있다)",["happen","lack","bring up","be satisfied with","be covered with"]],
 ["(보기: happen, lack, bring up, be satisfied with, be covered with) 단, 과거시제로 쓸 것<br>My parents ___ my test score.","were satisfied with","My parents were satisfied with my test score.","우리 부모님은 내 시험 점수에 만족하셨다.","POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) 부모님이 점수에 ‘만족하다’는 뜻이에요.  2) 보기의 be satisfied with를 과거로 바꿔요.  3) 주어 My parents는 복수예요.","세 단어예요. 복수 과거 be동사로 시작하고 satisfied with가 이어져요.","be satisfied with(만족하다) 복수 과거 were",["happen","lack","bring up","be satisfied with","be covered with"]]
],"본책 p.106 ");

X(3,"SB",[
 ["주어진 문장을 수동태 문장으로 바꿔 쓰고, 우리말 해석을 완성하시오.<br>Jina looked after the kitten for a week.<br>The kitten ___ by Jina for a week. / 그 고양이는 일주일 동안 Jina에 의해 ___.","was looked after / 돌봐졌다","The kitten was looked after by Jina for a week. / 그 고양이는 일주일 동안 Jina에 의해 돌봐졌다.","그 새끼 고양이는 일주일 동안 Jina에게 돌봐졌다.","POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) look after(돌보다)는 동사구예요.  2) 영어 빈칸에는 ‘be + p.p. + after’ 전체를 써요.  3) 우리말은 ‘~에 의해 ~되었다’ 꼴로 마무리해요.","영어는 세 단어(be동사 과거 + look의 과거분사 + 전치사)예요. 한글은 ‘돌’로 시작해 ‘~졌다’로 끝나요.","look after → was looked after (돌봐졌다)"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰고, 우리말 해석을 완성하시오.<br>The manager put off the meeting yesterday.<br>The meeting ___ by the manager yesterday. / 그 회의는 어제 관리자에 의해 ___.","was put off / 연기되었다[미뤄졌다]","The meeting was put off by the manager yesterday. / 그 회의는 어제 관리자에 의해 연기되었다.","그 회의는 어제 관리자에 의해 연기되었다.","POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) put off(연기하다)는 동사구예요.  2) 영어 빈칸에는 be동사 과거 + p.p. + off를 써요.  3) 한글은 ‘미루다’의 수동 표현이에요.","영어는 세 단어(be동사 과거 + 과거분사 + 부사)예요. put은 현재·과거·과거분사가 모두 같아요. 한글은 ‘연’ 또는 ‘미’로 시작해요.","put off → was put off (연기되었다)"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰고, 우리말 해석을 완성하시오.<br>Many people look up to the brave firefighter.<br>The brave firefighter ___ by many people. / 그 용감한 소방관은 많은 사람들에 의해 ___.","is looked up to / 존경받는다","The brave firefighter is looked up to by many people. / 그 용감한 소방관은 많은 사람들에 의해 존경받는다.","그 용감한 소방관은 많은 사람들에게 존경받는다.","POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) look up to(존경하다)는 세 단어짜리 동사구예요.  2) look이 현재이므로 수동태도 현재예요.  3) 한글은 ‘존경하다’의 수동 표현이에요.","영어는 네 단어(be동사 현재 + look의 과거분사 + up to)예요. 한글은 ‘존’으로 시작해 ‘~받는다’로 끝나요.","look up to → is looked up to (존경받는다)"]
],"본책 p.106 ");

X(3,"SC",[
 ["우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>Mia는 수학에 관심이 있다. (interest, math)<br>Mia ___.","is interested in math","Mia is interested in math.","Mia는 수학에 관심이 있다.","POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) ‘~에 관심이 있다’는 be interested in ~ 표현이에요.  2) 주어 Mia는 단수이고 문장은 현재예요.  3) in 뒤에 math를 이어요.","네 단어예요. be동사는 i로 시작하는 두 글자, 전치사도 i로 시작하는 두 글자예요.","Mia is interested in ~ = ~에 관심 있다"],
 ["우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>갑자기, 그 마술사는 무대에서 사라졌다. (disappear, from the stage)<br>Suddenly, the magician ___.","disappeared from the stage","Suddenly, the magician disappeared from the stage.","갑자기, 그 마술사는 무대에서 사라졌다.","POINT 2 ‘수동태로 쓰이지 않는 동사’ 자동사 줄을 펴세요.",
  "1) disappear(사라지다)는 목적어가 없는 자동사예요.  2) 그래서 수동태가 아니라 능동으로 써요.  3) 과거의 일이에요.","동사는 be동사 없이 -ed로 끝나는 한 단어예요. 그 뒤에 주어진 장소 표현을 이어요.","disappear는 자동사 → was 쓰지 않기"],
 ["우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>우리는 그 신제품에 만족하지 않는다. (satisfy, the new product)<br>We ___.","are not satisfied with the new product","We are not satisfied with the new product.","우리는 그 신제품에 만족하지 않는다.","POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표와 p.104 POINT 1 부정문을 펴세요.",
  "1) ‘~에 만족하다’는 be satisfied with 표현이에요.  2) 부정문은 be동사 뒤에 not을 넣어요.  3) 주어 We는 복수이고 현재예요.","일곱 단어예요. be동사(a로 시작) + not + 과거분사 + w로 시작하는 전치사 + 주어진 명사구 순서예요.","be not satisfied with ~(만족하지 않는다)"],
 ["우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>그 소포는 어제 오후에 도착했다. (arrive)<br>The package ___.","arrived yesterday afternoon","The package arrived yesterday afternoon.","그 소포는 어제 오후에 도착했다.","POINT 2 ‘수동태로 쓰이지 않는 동사’ 자동사 줄을 펴세요.",
  "1) arrive(도착하다)는 자동사라서 수동태를 쓰지 않아요.  2) 어제 일이니 과거형 한 단어예요.  3) 뒤에 시간 표현이 와요.","세 단어예요. 동사는 be동사 없이 -d로 끝나는 한 단어이고, 뒤에 ‘어제 오후’를 영어로 이어요.","arrive는 자동사 → arrived (수동태 X)"]
],"본책 p.106 ");

V("CH","A",[
 ["This novel was written (by / from) my father.","by","This novel was written by my father.","이 소설은 우리 아버지에 의해 쓰여졌다.","본책 p.102 POINT 1 ‘수동태의 형태와 의미’의 ‘by + 목적격’ 설명을 펴세요.",
  "1) was written(쓰여졌다)은 수동태예요.  2) 수동태에서 행위를 한 사람은 어떤 전치사로 나타내나요?","두 글자 b로 시작하는 전치사예요.","행위자는 by + 목적격"],
 ["The road (closed / was closed) yesterday due to an accident.","was closed","The road was closed yesterday due to an accident.","그 도로는 사고 때문에 어제 폐쇄되었다.","본책 p.102 POINT 1과 POINT 2 과거시제 줄을 펴세요.",
  "1) 도로(The road)는 스스로 닫은 걸까요, 닫힘을 당한 걸까요?  2) due to an accident(사고 때문에)는 이유예요.  3) yesterday는 과거예요.","be동사 과거형이 앞에 붙은 두 번째 보기예요.","닫힘을 당함 → was + p.p."],
 ["(Was / Did) your car made in Sweden?","Was","Was your car made in Sweden?","당신의 차는 스웨덴에서 만들어졌나요?","본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 줄을 펴세요.",
  "1) made는 make(만들다)의 과거분사예요.  2) 수동태 의문문은 be동사를 주어 앞에 써요. Did는 일반동사 의문문에 써요.","be동사 과거형이에요. 첫 번째 보기예요.","수동태 의문문 = be + 주어 + p.p."],
 ["The report should (emailed / be emailed) to Mike.","be emailed","The report should be emailed to Mike.","그 보고서는 Mike에게 이메일로 보내져야 한다.","본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표를 펴세요.",
  "1) should는 조동사예요. 보고서는 이메일로 보내지는 쪽이에요.  2) 조동사 뒤에는 ‘be + p.p.’를 써요.","be가 들어간 두 번째 보기예요.","should + be + p.p. (~되어야 한다)"],
 ["Some houses (lack / were lack) electricity.","lack","Some houses lack electricity.","몇몇 집들은 전기가 부족하다.","본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 소유·상태 동사 줄을 펴세요.",
  "1) lack(~이 부족하다)은 상태를 나타내는 타동사예요.  2) 이런 동사는 수동태로 쓰지 않아요.","be동사가 없는 첫 번째 보기예요.","lack은 능동 (수동태 X)"],
 ["My cell phone is (repairing / being repaired) now.","being repaired","My cell phone is being repaired now.","내 휴대폰은 지금 수리되고 있는 중이다.","본책 p.102 POINT 2 ‘수동태의 시제’ 표(진행형 줄)를 펴세요.",
  "1) now(지금)는 진행 중이라는 단서예요.  2) 휴대폰은 수리를 당하는 쪽이에요.  3) 진행 수동태 = be + being + p.p.","being이 들어간 두 번째 보기예요.","now(지금) + 당함 → is being + p.p."],
 ["The students were surprised (at / to) the news.","at","The students were surprised at the news.","학생들은 그 소식에 놀랐다.","본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) be surprised ___ ~는 ‘~에 놀라다’라는 정해진 표현이에요.  2) 표에서 surprised 뒤 전치사를 확인해요.","a로 시작하는 두 글자예요.","놀람의 이유 앞에는 at (surprised at)"],
 ["I (was not / didn’t be) told anything about her.","was not","I was not told anything about her.","나는 그녀에 대해 아무것도 듣지 못했다.","본책 p.104 POINT 1 ‘부정문과 의문문’의 부정문 줄을 펴세요.",
  "1) told는 tell(말해 주다)의 과거분사예요.  2) 수동태 부정문은 be동사 뒤에 not이에요.  3) didn’t be 같은 모양은 없어요.","be동사 과거형 + not이 들어간 첫 번째 보기예요.","be동사 + not + p.p."]
],"");

X("CH","B",[
 ["밑줄 친 부분을 어법에 맞게 고치시오.<br>Were you <u>moving</u> by her story?","moved","Were you moved by her story?","너는 그녀의 이야기에 감동받았니?","본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 줄을 펴세요.",
  "1) 수동태 의문문은 ‘be동사 + 주어 + p.p.’예요.  2) 뒤에 by her story(그녀의 이야기에 의해)가 있어요.  3) 밑줄 단어의 모양이 맞는지 봐요.","move(감동시키다) 끝에 d만 붙여요.","Were + 주어 + p.p. (moved by ~)"],
 ["밑줄 친 부분을 어법에 맞게 고치시오.<br>The room <u>was filled by</u> smoke.","was filled with","The room was filled with smoke.","그 방은 연기로 가득 차 있었다.","본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) be filled ___ ~는 ‘~로 가득 차다’는 정해진 표현이에요.  2) by가 맞는 전치사인지 표에서 확인해요.","by를 w로 시작하는 네 글자 전치사로 바꿔요.","filled 뒤 전치사는 by 아닌 with"],
 ["밑줄 친 부분을 어법에 맞게 고치시오.<br>The child was almost <u>ran over</u> by the car.","run over","The child was almost run over by the car.","그 아이는 하마터면 차에 치일 뻔했다.","본책 p.106 POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) was ... by the car는 수동태예요. 빈칸에는 p.p.가 와야 해요.  2) run over(치다)의 과거분사를 써요.","run-ran-run 순서예요. ran 대신 원형과 같은 모양을 써요.","run over → be run over (p.p.는 run)"],
 ["밑줄 친 부분을 어법에 맞게 고치시오.<br>She <u>didn’t satisfied with</u> her new house.","wasn’t satisfied with","She wasn’t satisfied with her new house.","그녀는 새 집에 만족하지 않았다.","본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) be satisfied with(~에 만족하다)는 수동태 모양이에요.  2) 부정은 be동사 뒤에 not을 붙여요.  3) 일반동사 did는 쓸 수 없어요.","didn’t를 be동사 과거형 + not의 줄임말(w로 시작)로 바꿔요. satisfied with는 그대로예요.","be + not + satisfied with"],
 ["밑줄 친 부분을 어법에 맞게 고치시오.<br>When <u>did</u> this book published?","was","When was this book published?","이 책은 언제 출간되었나요?","본책 p.104 POINT 1 ‘부정문과 의문문’의 의문사 의문문을 펴세요.",
  "1) published(출간된)는 p.p.예요.  2) 의문사 When 뒤에는 ‘be동사 + 주어 + p.p.’가 와요.","did 대신 be동사 과거형 세 글자를 써요.","When + was + 주어 + p.p.? (언제 ~되었나)"],
 ["밑줄 친 부분을 어법에 맞게 고치시오.<br>Something funny <u>was happened</u> an hour ago.","happened","Something funny happened an hour ago.","한 시간 전에 뭔가 웃기는 일이 일어났다.","본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 자동사 줄을 펴세요.",
  "1) happen(일어나다)은 목적어가 없는 자동사예요.  2) 자동사는 수동태로 쓸 수 없어요.","was를 빼고 happen의 과거형 한 단어만 써요.","happen은 자동사 → 수동태 X"],
 ["밑줄 친 부분을 어법에 맞게 고치시오.<br>The flight will <u>is delayed</u> because of the bad weather.","be delayed","The flight will be delayed because of the bad weather.","그 항공편은 악천후 때문에 지연될 것이다.","본책 p.102 POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) will 뒤에는 동사원형이 와요.  2) 미래 수동태는 ‘will + be + p.p.’예요.","is를 be동사 원형 두 글자로 바꿔요. delayed는 그대로예요.","미래의 일 + 당함 → will be + p.p."],
 ["밑줄 친 부분을 어법에 맞게 고치시오.<br>The mountaintops <u>covered with</u> snow.","are[were] covered with","The mountaintops are[were] covered with snow.","산봉우리들은 눈으로 덮여 있다[있었다].","본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) 문장에 be동사가 빠져 있어요.  2) ‘~로 덮여 있다’는 be covered with 표현이에요.  3) 주어 The mountaintops는 복수예요.","are(또는 were)를 covered 앞에 붙여요.","be covered with (be동사 빠뜨리지 않기)"]
],"");
// ===== CHAPTER 연습문제 기본 C (p.56) =====
X("CH","C",[
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>Many young people look up to the artist.","The artist is looked up to by many young people.","The artist is looked up to by many young people.","그 예술가는 많은 젊은이들에게 존경받는다.","본책 p.106 POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) the artist가 새 주어예요.  2) look up to(존경하다)는 한 덩어리 동사구예요. 현재이므로 is looked up to로 써요.  3) 행위자는 by 뒤로 보내요.","The artist로 시작해요. 동사 덩어리는 네 단어(i로 시작)이고 그 뒤에 by가 와요.","동사구는 통째로: is looked up to + by"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>The company will sign the contract soon.","The contract will be signed by the company soon.","The contract will be signed by the company soon.","그 계약은 곧 그 회사에 의해 체결될 것이다.","본책 p.102 POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) the contract가 새 주어예요.  2) will sign은 will + be + p.p.로 바꿔요.  3) soon은 문장 끝에 그대로 둬요.","will 뒤에 b로 시작하는 두 글자 + sign(서명하다)의 과거분사를 써요. soon은 by 뒤, 맨 끝이에요.","미래 수동: will be signed by 회사"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>Did your team do the project?","Was the project done by your team?","Was the project done by your team?","그 프로젝트는 당신의 팀에 의해 완료되었나요?","본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 줄을 펴세요.",
  "1) 의문문이에요. the project가 새 주어예요.  2) 수동태 의문문은 ‘be동사 + 주어 + p.p. ~?’예요.  3) Did는 과거라서 be동사도 과거예요.","첫 단어는 대문자 W로 시작하는 be동사예요. do(하다)는 do-did-done이라 과거분사는 d로 시작하는 네 글자예요.","Was + 주어 + p.p. ~? (do-did-done)"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>Your rude comments may hurt their feelings.","Their feelings may be hurt by your rude comments.","Their feelings may be hurt by your rude comments.","당신의 무례한 말들이 그들의 기분을 상하게 할지도 모른다.","본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표를 펴세요.",
  "1) their feelings(그들의 기분)가 새 주어예요.  2) 조동사 may가 있으니 ‘조동사 + be + p.p.’로 바꿔요.  3) hurt(상처 주다)는 현재·과거·과거분사가 같아요.","Their feelings로 시작해요. may 뒤에 b로 시작하는 두 글자를 넣고, hurt는 모양 그대로 둬요.","조동사 + be + p.p. (hurt-hurt-hurt)"],
 ["주어진 문장을 수동태 문장으로 바꿔 쓰시오.<br>Many people laughed at his joke.","His joke was laughed at by many people.","His joke was laughed at by many people.","그의 농담은 많은 사람들에게 비웃음을 샀다.","본책 p.106 POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) his joke가 새 주어예요.  2) laugh at(비웃다)은 동사구라서 at을 남겨요.  3) 과거이고 주어가 단수예요.","His joke로 시작해요. 동사 덩어리는 세 단어(w로 시작)이고 at 바로 뒤에 by가 와서 전치사가 두 개 이어져요.","laugh at → was laughed at + by"]
],"");
// ===== CHAPTER 연습문제 심화 A (p.57) =====
V("CH","SA",[
 ["We’re interested (to / in / about) photography.","in","We’re interested in photography.","우리는 사진에 관심이 있다.","본책 p.106 POINT 3 ‘by 이외의 전치사를 쓰는 수동태 표현’ 표를 펴세요.",
  "1) be interested ___ ~는 ‘~에 관심이 있다’는 정해진 표현이에요.  2) 표에서 interested 뒤 전치사를 확인해요.","i로 시작하는 두 글자예요.","관심은 in: interested in photography"],
 ["Where is the art fair (hold / being held / be held)?","being held","Where is the art fair being held?","미술 박람회는 어디에서 열리고 있나요?","본책 p.104 POINT 1 ‘부정문과 의문문’의 의문사 의문문 줄과 p.102 진행형 줄을 펴세요.",
  "1) Where is the art fair ___ ? 의 is가 이미 있어요.  2) 박람회는 열리는 쪽이라 수동태예요.  3) 지금 열리고 있는 중이라는 뜻이면 진행 수동태예요.","is 뒤에 being을 붙인 보기예요. 두 번째 보기예요.","진행 수동태 의문문 = Where is + 주어 + being + p.p."],
 ["Cars (can’t park / can’t be parked / not can be parked) on the grass.","can’t be parked","Cars can’t be parked on the grass.","차들은 잔디밭에 주차될 수 없다.","본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표(부정문 줄)를 펴세요.",
  "1) 차는 주차되는 쪽이에요. 수동태예요.  2) 조동사 부정문은 ‘조동사 + not + be + p.p.’예요.  3) not이 조동사 뒤에 있는 보기를 골라요.","can’t 뒤에 be가 있는 두 번째 보기예요.","can’t + be + p.p."],
 ["The building (painted / was painting / was being painted) then.","was being painted","The building was being painted then.","그 건물은 그때 페인트칠이 되고 있는 중이었다.","본책 p.102 POINT 2 ‘수동태의 시제’ 표(진행형 줄)를 펴세요.",
  "1) 건물은 칠해지는 쪽이에요.  2) then(그때)이 있으니 과거의 어느 순간에 진행 중이었어요.  3) 과거 진행 수동태 = was + being + p.p.","being이 들어가고 was가 앞에 있는 세 번째 보기예요.","과거 진행 수동태 = was being + p.p."],
 ["The pasta (wasn’t served / didn’t served / wasn’t serving) with salad.","wasn’t served","The pasta wasn’t served with salad.","그 파스타는 샐러드와 함께 제공되지 않았다.","본책 p.104 POINT 1 ‘부정문과 의문문’의 부정문 줄을 펴세요.",
  "1) 파스타는 제공되는 쪽이에요.  2) 수동태 부정문은 be동사 + not + p.p.예요.  3) 일반동사 didn’t는 맞지 않아요.","wasn’t 뒤에 p.p.(-ed)가 오는 첫 번째 보기예요.","wasn’t + p.p. (과거 수동태 부정)"],
 ["Two different books (are will used / will be used / will be using) in the class.","will be used","Two different books will be used in the class.","두 가지 다른 책이 수업에서 사용될 것이다.","본책 p.102 POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) 책은 사용되는 쪽이에요.  2) 미래 수동태는 ‘will + be + p.p.’ 순서예요.  3) will 뒤에 동사원형 be가 와요.","will 다음 be, 그 다음 p.p. 순서의 두 번째 보기예요.","will 바로 뒤는 be (동사원형)"],
 ["Mr. Kim (looked up to / is looked up / is looked up to) by the whole team.","is looked up to","Mr. Kim is looked up to by the whole team.","Mr. Kim은 팀 전체에게 존경받는다.","본책 p.106 POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) by the whole team(팀 전체에 의해)이 있으니 수동태예요. be동사가 필요해요.  2) 동사구 look up to(존경하다)는 전치사까지 통째로 남겨서 be + p.p.로 바꿔요.","be동사가 있고 to로 끝나는 세 번째 보기예요.","동사구 수동태: is looked up to + by"],
 ["A taxi (appeared / was appeared / was being appeared) in front of us.","appeared","A taxi appeared in front of us.","택시 한 대가 우리 앞에 나타났다.","본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 자동사 줄을 펴세요.",
  "1) appear(나타나다)는 목적어가 없는 자동사예요.  2) 자동사는 수동태로 쓸 수 없어요. be동사가 들어간 보기를 지워요.","첫 번째 보기예요. 과거형 -ed 한 단어예요.","appear는 자동사 → 수동태 X"]
],"");

X("CH","SB",[
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>When is the mail usually <u>delivered</u>?","O","When is the mail usually delivered?","우편물은 보통 언제 배달되나요?","본책 p.104 POINT 1 ‘부정문과 의문문’의 의문사 의문문을 펴세요.",
  "1) 의문사 When 다음에 is the mail이 와요. 우편물은 배달되는 쪽이에요.  2) 수동태에서 be동사 뒤에는 p.p.가 와요.","delivered가 deliver(배달하다)의 과거분사 모양인지 확인해요. 맞으면 O를 써요.","의문사 + be + 주어 + p.p. (O)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>Is this coffee machine <u>use</u> often?","used","Is this coffee machine used often?","이 커피 머신은 자주 사용되나요?","본책 p.104 POINT 1 ‘부정문과 의문문’의 의문문 줄을 펴세요.",
  "1) 의문문 Is this coffee machine 다음에 동사가 와요.  2) 커피 머신은 사용되는 쪽이라 수동태예요. be동사 뒤에는 p.p.가 필요해요.","use(사용하다) 끝에 d를 붙여요.","Is + 주어 + p.p. ~? (원형 그대로 쓰면 X)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>Mark was born and <u>brought up</u> in the countryside.","O","Mark was born and brought up in the countryside.","Mark는 시골에서 태어나 자랐다.","본책 p.106 POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) was born(태어났다)과 and로 이어진 ‘~ 길러졌다’ 표현이에요.  2) bring up(기르다)의 p.p.가 맞는지 확인해요. be동사는 앞에서 이미 쓰였어요.","bring(가져오다)은 bring-brought-brought예요. 과거분사 모양과 up이 둘 다 제자리면 O를 써요.","was born and brought up(태어나 자랐다) (O)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>I was not <u>gave</u> any information about the new plan.","given","I was not given any information about the new plan.","나는 새 계획에 대한 어떤 정보도 받지 못했다.","본책 p.104 POINT 1 ‘부정문과 의문문’의 부정문 줄을 펴세요.",
  "1) was not 뒤에는 p.p.가 와야 해요.  2) 밑줄 단어는 과거형 모양이에요. give의 과거분사로 바꿔요.","give-gave-given 순서예요. g로 시작해 n으로 끝나는 다섯 글자예요.","was not + p.p. (give-gave-given)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>The plant in my room <u>was died</u> last week.","died","The plant in my room died last week.","내 방의 식물이 지난주에 죽었다.","본책 p.106 POINT 2 ‘수동태로 쓰이지 않는 동사’ 자동사 줄을 펴세요.",
  "1) die(죽다)는 목적어를 갖지 않는 자동사예요.  2) 자동사는 수동태로 쓸 수 없어요.","was를 지우고 die의 과거형 한 단어만 남겨요.","die는 자동사 → was died (X)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>The concert <u>was put off</u> because of the heavy rain.","O","The concert was put off because of the heavy rain.","그 콘서트는 폭우 때문에 연기되었다.","본책 p.106 POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) 콘서트는 연기되는 쪽이에요.  2) put off(미루다)는 동사구예요. be동사 + p.p. + off 모양이 맞는지 봐요.","put(놓다)은 put-put-put이에요. be동사 과거 + 과거분사 + off 순서가 맞으면 O를 써요.","put off → was put off (O)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>The package will <u>send</u> tomorrow.","be sent","The package will be sent tomorrow.","그 소포는 내일 보내질 것이다.","본책 p.102 POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) 소포(The package)는 보내지는 쪽이에요.  2) will 뒤에 동사원형만 있어요.  3) 수동태는 ‘will + be + p.p.’예요.","두 단어예요. be와 send(보내다)의 과거분사(s로 시작하는 네 글자)예요.","will + be + p.p. (send-sent-sent)"],
 ["밑줄 친 부분이 어법상 맞으면 O를 쓰고, 틀리면 바르게 고치시오.<br>Whales should <u>protect</u> by law.","be protected","Whales should be protected by law.","고래는 법에 의해 보호되어야 한다.","본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표를 펴세요.",
  "1) 고래(Whales)는 보호받는 쪽이에요. by law(법에 의해)가 있어요.  2) should 뒤에는 ‘be + p.p.’를 써요.","두 단어예요. be와 protect(보호하다)의 과거분사예요.","조동사 + be + p.p. (should be protected)"]
],"");
// ===== CHAPTER 연습문제 심화 C (p.57) =====
X("CH","SC",[
 ["능동태는 수동태 문장으로, 수동태는 능동태 문장으로 바꿔 쓰시오.<br>Many wild animals are run over by cars on this road.","Cars run over many wild animals on this road.","Cars run over many wild animals on this road.","차들이 이 도로에서 많은 야생동물을 친다.","본책 p.106 POINT 1 ‘동사구의 수동태’ 표를 펴세요.",
  "1) 수동태를 능동태로 바꿔요. by 뒤 cars가 새 주어예요.  2) many wild animals가 목적어가 돼요.  3) are run over(치이다)는 현재 능동 run over로 돌려요.","Cars로 시작해요. 주어가 복수이고 현재라 동사구 run over에 -s를 붙이지 않아요.","수동 → 능동: by 뒤 = 주어, 동사구 원래대로"],
 ["능동태는 수동태 문장으로, 수동태는 능동태 문장으로 바꿔 쓰시오.<br>Everyone must follow the traffic rules.","The traffic rules must be followed by everyone.","The traffic rules must be followed by everyone.","교통 규칙은 모두에 의해 지켜져야 한다.","본책 p.104 POINT 2 ‘조동사가 있는 문장의 수동태’ 표를 펴세요.",
  "1) the traffic rules(교통 규칙)가 새 주어예요.  2) must(~해야 한다)는 조동사라서 ‘조동사 + be + p.p.’로 바꿔요.  3) everyone은 by 뒤에 써요.","The traffic rules로 시작해요. must 뒤에 b로 시작하는 두 글자 + follow(따르다)의 과거분사를 써요.","must + be + p.p. + by ~"],
 ["능동태는 수동태 문장으로, 수동태는 능동태 문장으로 바꿔 쓰시오.<br>This gallery is visited by a lot of people.","A lot of people visit this gallery.","A lot of people visit this gallery.","많은 사람들이 이 미술관을 방문한다.","본책 p.102 POINT 1 ‘수동태의 형태와 의미’의 능동·수동 비교 부분을 펴세요.",
  "1) by 뒤 a lot of people(많은 사람들)이 새 주어예요.  2) this gallery는 목적어예요.  3) is visited는 현재 능동 동사로 바꿔요.","동사는 visit(방문하다)의 현재형이에요. 주어가 복수라서 -s를 붙이지 않아요.","수동 → 능동: by 뒤를 주어로 (visit)"],
 ["능동태는 수동태 문장으로, 수동태는 능동태 문장으로 바꿔 쓰시오.<br>Soccer fans will remember him forever.","He will be remembered by soccer fans forever.","He will be remembered by soccer fans forever.","그는 축구 팬들에게 영원히 기억될 것이다.","본책 p.102 POINT 2 ‘수동태의 시제’ 표(미래시제 줄)를 펴세요.",
  "1) 목적어 him이 새 주어가 돼요. 목적격 him은 주격으로 바꿔야 해요.  2) will remember는 will + be + p.p.로 바꿔요.  3) forever는 끝에 그대로 둬요.","He로 시작해요. will 뒤에 b로 시작하는 두 글자 + remember(기억하다)의 과거분사를 쓰고, forever는 맨 끝이에요.","him → He (목적격 → 주격) + will be + p.p."],
 ["능동태는 수동태 문장으로, 수동태는 능동태 문장으로 바꿔 쓰시오.<br>This room was not painted by my brother.","My brother didn’t paint this room.","My brother didn’t paint this room.","내 남동생은 이 방을 칠하지 않았다.","본책 p.104 POINT 1 ‘부정문과 의문문’의 부정문 줄을 펴세요.",
  "1) by 뒤 my brother가 새 주어예요. this room은 목적어예요.  2) was not painted는 과거 부정 능동이에요.  3) 일반동사의 과거 부정은 didn’t + 동사원형이에요.","My brother로 시작해요. not을 넣은 과거 부정 줄임말(d로 시작) 뒤에 동사는 원형으로 써요.","수동 부정 → 능동: didn’t + 동사원형"]
],"");

}
