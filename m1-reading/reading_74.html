: null, "en": "So, she decided post more shocking pictures.", "ko": "그래서, 그녀는 더 충격적인 사진들을 올리기로 결심했다.", "ok": false, "foot": [], "fixes": [{"wrong": "post", "right": "to post", "partial": false, "at": [3], "point": "to부정사: decide 뒤에는 to post 사용", "topic": "to부정사", "memo": "decide 뒤에는 to post 사용", "alt": [2]}]}, {"n": 7, "tag": null, "en": "One day, she was taking a walk on the forest and found an cottage. She knocked on the door, but there was no answer.", "ko": "어느 날, 그녀는 숲에서 산책을 하다가 한 오두막집을 발견했다. 그녀는 문을 두드렸지만, 아무 대답이 없었다.", "ok": false, "foot": [], "fixes": [{"wrong": "on", "right": "in", "partial": false, "at": [7], "point": "기본전치사: '숲속에서'는 전치사 in 사용", "topic": "기본전치사", "memo": "'숲속에서'는 전치사 in 사용"}, {"wrong": "an", "right": "a", "partial": false, "at": [12], "point": "관사 a/an: 자음 소리 cottage 앞에는 a 사용", "topic": "관사 a/an", "memo": "자음 소리 cottage 앞에는 a 사용"}]}, {"n": 8, "tag": null, "en": "It were getting dark, and it started to rain. She opened the door and walked inside.", "ko": "날이 어두워지고 있었고, 비가 내리기 시작했다. 그녀는 문을 열고 안으로 걸어 들어갔다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [1], "point": "be동사의 과거형: 주어 It에는 was 사용", "topic": "be동사의 과거형", "memo": "주어 It에는 was 사용"}]}, {"n": 9, "tag": null, "en": "There was three bowls of soup on a table. She ate the most small one and took selfies with a smile.", "ko": "식탁 위에는 수프 세 그릇이 있었다. 그녀는 가장 작은 그릇의 수프를 먹었고 미소를 지으며 셀피를 찍었다.", "ok": false, "foot": [], "fixes": [{"wrong": "was", "right": "were", "partial": false, "at": [1], "point": "be동사의 수일치: three bowls(복수)이므로 There were (was 아님)", "topic": "be동사의 수일치", "memo": "three bowls(복수)이므로 There were (was 아님)"}, {"wrong": "most small", "right": "smallest", "partial": false, "at": [12], "point": "최상급: small의 최상급은 the smallest", "topic": "최상급", "memo": "small의 최상급은 the smallest"}]}, {"n": 10, "tag": null, "en": "There were also three chairs. She jumped on the smallest one again and again.", "ko": "의자도 세 개 있었다. 그녀는 가장 작은 의자 위에서 몇 번이고 뛰었다.", "ok": true, "foot": [], "fixes": []}, {"n": 11, "tag": null, "en": "It broke, but she didn't cared.", "ko": "의자가 부서졌지만, 그녀는 신경 쓰지 않았다.", "ok": false, "foot": [], "fixes": [{"wrong": "cared", "right": "care", "partial": false, "at": [5], "point": "과거 부정문: didn't 뒤에는 동사원형 care 사용", "topic": "과거 부정문", "memo": "didn't 뒤에는 동사원형 care 사용"}]}, {"n": 12, "tag": null, "en": "\"It's so fun!\" shouted Goldilocks.", "ko": "\"너무 재미있어!\"라고 Goldilocks가 외쳤다.", "ok": true, "foot": [], "fixes": []}, {"n": 13, "tag": null, "en": "She took selfies again and post all the selfies on social media. Then, she goed upstairs and found three beds.", "ko": "그녀는 다시 셀피를 찍었고 모든 셀피를 소셜 미디어에 올렸다. 그런 다음, 그녀는 위층으로 올라가 침대 세 개를 발견했다.", "ok": false, "foot": [], "fixes": [{"wrong": "post", "right": "posted", "partial": false, "at": [5], "point": "동사의 시제: 과거 서술 흐름: took ... and posted (post 아님)", "topic": "동사의 시제", "memo": "과거 서술 흐름: took ... and posted (post 아님)"}, {"wrong": "goed", "right": "went", "partial": false, "at": [14], "point": "불규칙 과거형: go의 과거형은 went", "topic": "불규칙 과거형", "memo": "go의 과거형은 went"}]}, {"n": 14, "tag": null, "en": "She felt tiredly and fell asleep in the smallest bed.", "ko": "그녀는 피곤해서 가장 작은 침대에서 잠들었다.", "ok": false, "foot": [], "fixes": [{"wrong": "tiredly", "right": "tired", "partial": false, "at": [2], "point": "형용사와 부사: felt 뒤 보어 자리에는 형용사 tired 사용", "topic": "형용사와 부사", "memo": "felt 뒤 보어 자리에는 형용사 tired 사용"}]}, {"n": 15, "tag": null, "en": "About a hour later, three bears came home.", "ko": "약 한 시간 후에, 곰 세 마리가 집으로 돌아왔다.", "ok": false, "foot": [], "fixes": [{"wrong": "a", "right": "an", "partial": false, "at": [1], "point": "관사 a/an: 모음 소리 hour 앞에는 an 사용", "topic": "관사 a/an", "memo": "모음 소리 hour 앞에는 an 사용"}]}, {"n": 16, "tag": null, "en": "\"Someone ate me soup and broke my chair!\" cried Baby Bear.", "ko": "\"누군가 내 수프를 먹고 내 의자를 부서뜨렸어요!\"라고 아기곰이 외쳤다.", "ok": false, "foot": [], "fixes": [{"wrong": "me", "right": "my", "partial": false, "at": [2], "point": "인칭대명사의 격: 명사 앞 소유격 my 사용"  신경 쓰지 않았다."], "ow": ["오답 ✕ — 'she was taking a walk in the forest and found a cottage'(숲에서 산책을 하다가 오두막집을 발견했다)라고 했으므로 일치하는 내용이다.", "오답 ✕ — 'She knocked on the door, but there was no answer.'(문을 두드렸지만, 아무 대답이 없었다.)라고 했으므로 일치하는 내용이다.", "오답 ✕ — 'She ate the smallest one'(가장 작은 그릇의 수프를 먹었다)이라고 했으므로 일치하는 내용이다.", "정답 ○ — 의자가 부서졌을 때 'It broke, but she didn't care.'(의자가 부서졌지만, 그녀는 신경 쓰지 않았다.)라고 했다. 많이 신경 썼다는 보기는 일치하지 않는다.", "오답 ✕ — 'She felt tired and fell asleep in the smallest bed.'(피곤해서 가장 작은 침대에서 잠들었다.)라고 했으므로 일치하는 내용이다."], "memo": ["정답: ④ 의자가 부서졌을 때 매우 신경 썼다 (✕ 틀린 내용)", "근거: It broke, but she didn't care.(의자가 부서졌지만, 그녀는 신경 쓰지 않았다.)", "함정: care = 신경 쓰다, didn't care = 신경 쓰지 않았다"], "why": "의자가 부서졌어도 Goldilocks는 신경 쓰지 않았다.", "ko": ["그녀는 숲에서 오두막을 발견했다.", "그녀가 문을 두드렸을 때 대답이 없었다.", "그녀는 가장 작은 그릇의 수프를 먹었다.", "그녀는 가장 작은 의자가 부서졌을 때 크게 신경 썼다.", "그녀는 가장 작은 침대에서 잠이 들었다."]}], "pp": [["One day, she was taking a walk in the forest and found a cottage.", "어느 날, 그녀는 숲에서 산책을 하다가 한 오두막집을 발견했다."], ["She knocked on the door, but there was no answer.", "그녀는 문을 두드렸지만, 아무 대답이 없었다."], ["It was getting dark, and it started to rain.", "날이 어두워지고 있었고, 비가 내리기 시작했다."], ["She opened the door and walked inside.", "그녀는 문을 열고 안으로 걸어 들어갔다."], ["There were three bowls of soup on a table.", "식탁 위에는 수프 세 그릇이 있었다."], ["She ate the smallest one and took selfies with a smile.", "그녀는 가장 작은 그릇의 수프를 먹었고 미소를 지으며 셀피를 찍었다."], ["There were also three chairs.", "의자도 세 개 있었다."], ["She jumped on the smallest one again and again.", "그녀는 가장 작은 의자 위에서 몇 번이고 뛰었다."], ["It broke, but she didn't care.", "의자가 부서졌지만, 그녀는 신경 쓰지 않았다."], ["\"It's so fun!\" shouted Goldilocks.", "\"너무 재미있어!\"라고 Goldilocks가 외쳤다."], ["She took selfies again and posted all the selfies on social media.", "그녀는 다시 셀피를 찍었고 모든 셀피를 소셜 미디어에 올렸다."], ["Then, she went upstairs and found three beds.", "그런 다음, 그녀는 위층으로 올라가 침대 세 개를 발견했다."], ["She felt tired and fell asleep in the smallest bed.", "그녀는 피곤해서 가장 작은 침대에서 잠들었다."]]}, {"qs": [{"n": 10, "q": "윗글의 내용과 일치하지 않 ome,\" shouted Mother Bear angrily.", "우리 집에 관한 이 모든 게시물을 봐요.\"라고 엄마곰이 화가 나서 외쳤다."], ["Goldilocks jumped up in surprise.", "Goldilocks는 놀라서 벌떡 일어났다."], ["\"You broke into our house and posted these pictures without our permission.", "\"너는 우리 집에 침입해서 우리의 허락 없이 이 사진들을 올렸어."], ["Don't you know these things are wrong?\" said Father Bear.", "너는 이런 것들이 잘못이라는 것을 모르니?\"라고 아빠곰이 말했다."], ["\"Please forgive me.", "\"용서해 주세요."], ["I'm so sorry, and I'll clean your house every day until the end of the summer,\" said Goldilocks.", "정말 죄송해요, 여름이 끝날 때까지 매일 여러분 집을 청소할게요.\" Goldilocks가 말했다."]]}];
