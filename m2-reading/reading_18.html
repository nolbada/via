var D=[{"n":1,"tag":null,"en":"Accident can happen anytime, anywhere. However, knowing first aid can stop situations from getting worse.","ko":"사고는 언제 어디서든 일어날 수 있다. 하지만 응급 처치를 알면 상황이 더 나빠지는 것을 막을 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"Accident","right":"Accidents","partial":false,"at":[0],"point":"명사의 복수형: 일반적 사고는 복수 Accidents 사용","topic":"명사의 복수형","memo":"일반적 사고는 복수 Accidents 사용"}]},{"n":2,"tag":null,"en":"If you have basic first aid skill, you can help yourself and others who are on need.","ko":"만약 여러분이 기본적인 응급 처치법을 알고 있다면 여러분 자신과 도움이 필요한 다른 사람들을 도울 수 있다.","ok":false,"foot":[],"fixes":[{"wrong":"skill","right":"skills","partial":false,"at":[6],"point":"명사의 복수형: 기술 여러 개는 복수 skills 사용","topic":"명사의 복수형","memo":"기술 여러 개는 복수 skills 사용"},{"wrong":"on","right":"in","partial":false,"at":[15],"point":"기본전치사: '도움이 필요한'은 in need 사용","topic":"기본전치사","memo":"'도움이 필요한'은 in need 사용"}]},{"n":3,"tag":"화상","en":"This morning, Katie was making a apple pie for her family. When she opened the oven, a delicious smell filled the kitchen.","ko":"오늘 아침 Katie는 식구들을 위해 애플파이를 만들고 있었다. 그녀가 오븐을 열었을 때 맛있는 냄새가 부엌을 가득 채웠다.","ok":false,"foot":[],"fixes":[{"wrong":"a","right":"an","partial":false,"at":[5],"point":"관사 a/an: 모음 소리 a 앞에는 an apple 사용","topic":"관사 a/an","memo":"모음 소리 a 앞에는 an apple 사용"}]},{"n":4,"tag":null,"en":"In excitement, she grabbed the pan with she bare hands. \"Ouch!\"","ko":"흥분한 나머지 그녀는 맨손으로 팬을 잡았다. \"아야!\"","ok":false,"foot":[],"fixes":[{"wrong":"she","right":"her","partial":false,"at":[7],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 her 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 her 사용"}]},{"n":5,"tag":null,"en":"Her fingers that touched the hot pan turned redly and started to hurting.","ko":"뜨거운 팬에 닿은 그녀의 손가락들은 붉어졌고 아프기 시작했다.","ok":false,"foot":[],"fixes":[{"wrong":"redly","right":"red","partial":false,"at":[8],"point":"형용사와 부사: turn 뒤 보어는 형용사 red 사용","topic":"형용사와 부사","memo":"turn 뒤 보어는 형용사 red 사용"},{"wrong":"hurting","right":"hurt","partial":false,"at":[12],"point":"to부정사: t ingers that touched the hot pan turned red and started to hurt.","First Aid Skills","1. Cool the burn under running water for more than 10 minutes.","2. Do not use ice. It can damage the skin.","Bee Stings","One sunny afternoon, Yunho and his classmates were watering the plants in the school garden. Suddenly, someone shouted, \"Look at the bees!\"","The students ran and screamed, and the peaceful garden turned into chaos. \"Ouch!\" A bee stung Yunho on the forehead. He tried to remove the stinger with his fingers, but he could not. The area swelled quickly.","First Aid Skills","1. Look for something that looks like a black dot. That is the stinger.","2. Remove it with a flat object like a student ID card.","3. Wash the area with soap and cool water."];var PASS_KO=["응급 처치를 배워 봅시다","사고는 언제 어디서든 일어날 수 있다. 하지만 응급 처치를 알면 상황이 더 나빠지는 것을 막을 수 있다. 만약 여러분이 기본적인 응급 처치법을 알고 있다면 여러분 자신과 도움이 필요한 다른 사람들을 도울 수 있다.","화상","오늘 아침 Katie는 식구들을 위해 애플파이를 만들고 있었다. 그녀가 오븐을 열었을 때 맛있는 냄새가 부엌을 가득 채웠다. 흥분한 나머지 그녀는 맨손으로 팬을 잡았다. \"아야!\" 뜨거운 팬에 닿은 그녀의 손가락들은 붉어졌고 아프기 시작했다.","응급 처치법","1. 데인 곳을 10분 이상 동안 흐르는 물 아래에서 식혀라.","2. 얼음을 사용하지 마라. 그것은 피부를 손상시킬 수 있다.","벌에 쏘임","어느 맑은 날 오후, 윤호와 그의 반 친구들은 학교 정원에서 화초에 물을 주고 있었다. 갑자기 누군가 소리쳤다. \"저 벌들 좀 봐!\"","학생들은 뛰어다니며 소리쳤고, 고요했던 정원은 아수라장으로 바뀌었다. \"아야!\" 벌 한 마리가 윤호의 이마를 쏘았다. 그는 손가락으로 벌침을 제거하려고 했지만 할 수 없었다. 쏘인 곳은 빠르게 부어올랐다.","응급 처치법","1. 검은 점처럼 보이는 것을 찾아라. 그것이 벌침이다.","2. 학생증과 같이 납작한 물건으로 그것을 제거하라.","3. 쏘인 곳을 비누와 찬물로 씻어라."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["The boy's friend fell while she was hiking.","The boy's friend hurt her leg badly.","The boy's friend is standing still.","911 will send help to the boy.","The boy should keep his friend calm."],"a":2,"ans":"The boy's friend is standing still.","evs":[["B: We were hiking, and she slipped on something.","저희는 하이킹을 하고 있었는데 친구가 무언가에 미끄러졌어요."],["B: Okay, she's lying down and staying still.","네, 친구는 누워서 가만히 있어요."]],"ev":["B: We were hiking, and she slipped on something.","저희는 하이킹을 하고 있었는데 친구가 무언가에 미끄러졌어요."],"ow":["오답 ✕ — 소년이 'We were hiking, and she slipped on something.'(저희는 하이킹을 하고 있었는데 친구가 무언가에 미끄러졌어요.)라고 했으므로 하이킹 중에 넘어졌다는 보기는 일치한다.","오답 ✕ — 소년이 'She says her leg hurts a lot.'(다리가 많이 아프다고 해요.)라고 했으므로 다리를 심하게 다쳤다는 보기는 일치한다.","정답 ○(일치하지 않는 것) — 소년은 'she's lying down and staying still'(친구는 누워서 가만히 있어요)이라고 했다. 서 있는 것이 아니라 누워 있으므로 틀림.","오답 ✕ — 상담원이 'We're sending help right away.'(바로 도움을 보내고 있어요.)라고 했으므로 도움이 올 것이라는 보기는 일치한다.","오답 ✕ — 상담원이 'Stay with her and keep her calm.'(친구 곁에 있으면서 진정시켜 주세요.)라고 했으므로 일치한다."],"memo":["정답 ③: 친구는 서 있는 것이 아니라 누워서 가만히 있다.","근거: Okay, she's lying down and staying still.(네, 친구는 누워서 가만히 있어요.)","함정: staying still(가만히 있다)을 standing still(서 있다)로 바꾼 함정"],"why":"다친 친구는 서 있지 않고 누워서 가만히 있다."},{"n":2,"q":"상담원이 소년에게 당부한 것으로 알맞은 것은?","o":["친구가 다리를 움직이려고 하지 않도록 하라.","친구를 일으켜 세워서 걷게 하라.","친구를 두고 혼자 도움을 구하러 가라.","다리를 따뜻한 물에 담가라.","친구에게 약을 먹여라."],"a":0,"ans":"친구가 다리를 움직이려고 하지 않도록 하라.","evs":[["W: Make sure she doesn't try to move her leg.","친구가 다리를 움직이려고 하지 않도록 하세요."],["W: Stay with her and keep her calm.","친구 곁에 있으면서 진정시켜 주세요."]],"ev":["W: Make sure she doesn't try to move her leg.","친구가 다리를 움직이려고 하지 않도록 하세요."],"ow":["정답 ○ — 상담원이 'Make sure she doesn't try to move her leg.'(친구가 다리를 움직이려고 하지 않도록 하세요.)라고 했으므로 맞다.","오답 ✕ — 다리를 다친 친구를 걷게 하는 것은 'Make sure she doesn't try to move her leg.'(다리를 움직이려고 하지 않도록 하세요.)와 반대되는 말이라서 틀림.","오답 ✕ — 상담원은 'Stay with her and keep her calm.'(친구 곁에 있으면서 진정시켜 주세요.)라고 했다. 친구를 두고 가라는 말과 반대라서 틀림.","오답 ✕ — 따뜻한 물에 담그라는 말은 대화에 없다. 가장 가까운 문장은 'Make sure she doesn't try to move her leg.'(다리를 움직이려고 하지 않도록 하세요.)이다.","오답 ✕ — 약을 먹이라는 말은 대화에 없다. 상담원은 'We're sending help right away.'(바로 도움을 보내고 있어요.)라고만 했다."],"memo":["정답 ①: 친구가 다리를 움직이지 않게 한다.","근거: Make sure she doesn't try to move her leg.(친구가 다리를 움직이려고 하지 않도록 하세요.)","함정: ②는 다리를 다친 친구를 걷게 하라는 반대 내용"],"why":"다리를 다친 친구는 움직이지 않게 하고 곁에서 진정시켜야 한다."}],"dlg":[["W","911. What's your emergency?","911입니다. 어떤 응급 상황인가요?"],["B","Help! My friend fell, and she can't walk.","도와주세요! 제 친구가 넘어졌는데 걸을 수 없어요."],["W","Stay calm. What happened?","침착하세요. 무슨 일이 있었나요?"],["B","We were hiking, and she slipped on something. She says her leg hurts a lot. I think she broke her leg.","저희는 하이킹을 하고 있었는데 친구가 무언가에 미끄러졌어요. 다리가 많이 아프다고 해요. 다리가 부러진 것 같아요."],["W","Alright. Make sure she doesn't try to move her leg.","알겠어요. 친구가 다리를 움직이려고 하지 않도록 하세요."],["B","Okay, she's lying down and staying still.","네, 친구는 누워서 가만히 있어요."],["W","We're sending help right away. Stay with her and keep her calm.","바로 도움을 보내고 있어요. 친구 곁에 있으면서 진정시켜 주세요."],["B","I will. Please hurry!","그럴게요. 서둘러 주세요!"],["W","Help is on the way. You're doing great.","도움이 가고 있어요. 아주 잘하고 있어요."]]},{"qs":[{"n":3,"q":"According to the boy, why does the girl have to wear a helmet?","o":["to ride faster","to stay warm","to look prettier","to protect her head","not to fall off the bike"],"a":3,"ans":"to protect her head","evs":[["B: It will protect your head if you fall.","넘어지면 머리를 보호해 줄 거야."]],"ev":["B: It will protect your head if you fall.","넘어지면 머리를 보호해 줄 거야."],"ow":["오답 ✕ — 소년은 'It will protect your head if you fall.'(넘어지면 머리를 보호해 줄 거야.)라고 했다. 더 빨리 달리기 위해서(to ride faster)라는 말은 없어서 틀림.","오답 ✕ — 소녀는 'it's hot today'(오늘은 더워)라고 했으므로 헬멧은 따뜻하게 하려는 것이 아니다. 오히려 더워서 쓰기 싫다고 했다.","오답 ✕ — 예뻐 보이기 위해서라는 말은 대화에 없다. 소년이 든 이유는 'It will protect your head if you fall.'(넘어지면 머리를 보호해 줄 거야.)이다.","정답 ○ — 소년이 'It will protect your head if you fall.'(넘어지면 머리를 보호해 줄 거야.)라고 했으므로 머리를 보호하기 위해서(to protect her head)가 맞다.","오답 ✕ — 헬멧은 자전거에서 떨어지지 않게 하는 것이 아니라 넘어졌을 때 머리를 보호하는 것이다. 'It will protect your head if you fall.'(넘어지면 머리를 보호해 줄 거야.)이므로 틀림."],"memo":["정답 ④: 머리를 보호하기 위해서(to protect her head)","근거: It will protect your head if you fall.(넘어지면 머리를 보호해 줄 거야.)","함정: ⑤는 넘어지는 것을 막는 게 아니라 넘어졌을 때 머리를 보호한다"],"why":"헬멧은 넘어졌을 때 머리를 보호하기 위해 써야 한다."}],"dlg":[["G","I'm going to ride my bike this afternoon.","오늘 오후에 자전거를 탈 거야."],["B","That sounds fun! Make sure you wear a helmet.","재미있겠다! 꼭 헬멧을 써."],["G","Do I have to? I don't want to wear it because it's hot today.","꼭 써야 해? 오늘은 더워서 쓰고 싶지 않아."],["B","Well, I think you should, Mina. It will protect your head if you fall.","음, 쓰는 게 좋을 것 같아, Mina. 넘어지면 머리를 보호해 줄 거야."],["G","Okay, I will.","알겠어, 그렇게 할게."]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["Amy는 이번 주말에 산에 갈 것이다.","Amy는 수영을 잘하지 못한다.","소년은 Amy에게 구명조끼를 입으라고 당부했다.","Amy는 끝까지 구명조끼를 입지 않겠다고 했다.","소년은 바다에서 수영하는 것이 쉽다고 말했다."],"a":2,"ans":"소년은 Amy에게 구명조끼를 입으라고 당부했다.","evs":[["B: Make sure you wear one anyway.","그래도 꼭 입어."],["G: Alright, I'll wear one. Safety first!","알겠어, 입을게. 안전이 최우선이니까!"]],"ev":["B: Make sure you wear one anyway.","그래도 꼭 입어."],"ow":["오답 ✕ — Amy는 'I can't wait to go swimming at the beach this weekend.'(이번 주말에 해변에서 수영하러 가는 게 정말 기대돼.)라고 했다. 산이 아니라 해변이라서 틀림.","오답 ✕ — Amy는 'I'm a really good swimmer.'(나는 수영을 정말 잘하거든.)라고 했다. 수영을 잘하지 못한다는 말은 틀림.","정답 ○ — 소년이 'Make sure you wear one anyway.'(그래도 꼭 입어.)라고 구명조끼를 입으라고 당부했으므로 맞다.","오답 ✕ — Amy는 마지막에 'Alright, I'll wear one.'(알겠어, 입을게.)이라고 했다. 입지 않겠다고 한 것이 아니라서 틀림.","오답 ✕ — 소년은 'Swimming in the sea is different.'(바다에서 수영하는 건 달라.)이라고 했다. 쉽다는 말은 없고 수영장과 다르다는 뜻이라서 틀림."],"memo":["정답 ③: 소년은 Amy에게 구명조끼를 입으라고 당부했다.","근거: Make sure you wear one anyway.(그래도 꼭 입어.)","함정: Amy가 수영을 잘해도 바다는 다르니 입어야 한다"],"why":"수영을 잘하는 Amy에게도 소년은 구명조끼를 꼭 입으라고 당부한다."}],"dlg":[["G","I can't wait to go swimming at the beach this weekend.","이번 주말에 해변에서 수영하러 가는 게 정말 기대돼."],["B","I'm excited, too! By the way, do you have a life jacket, Amy?","나도 신나! 그런데, 구명조끼 있니, Amy?"],["G","I don't think I need one. I'm a really good swimmer.","필요 없을 것 같아. 나는 수영을 정말 잘하거든."],["B","Make sure you wear one anyway. Swimming in the sea is different.","그래도 꼭 입어. 바다에서 수영하는 건 달라."],["G","Alright, I'll wear one. Safety first!","알겠어, 입을게. 안전이 최우선이니까!"]]},{"qs":[{"n":5,"q":"소년이 Sophia에게 해 준 조언으로 알맞은 것은?","o":["눈을 비비지 말고 깨끗한 물로 씻으라고 했다.","눈을 비벼서 이물질을 빼라고 했다.","얼음으로 눈을 문지르라고 했다.","눈을 꼭 감고 가만히 있으라고 했다.","바로 병원에 가라고 했다."],"a":0,"ans":"눈을 비비지 말고 깨끗한 물로 씻으라고 했다.","evs":[["B: Make sure you don't rub it. Wash it with clean water.","비비지 않도록 해. 깨끗한 물로 씻어."]],"ev":["B: Make sure you don't rub it. Wash it with clean water.","비비지 않도록 해. 깨끗한 물로 씻어."],"ow":["정답 ○ — 소년이 'Make sure you don't rub it. Wash it with clean water.'(비비지 않도록 해. 깨끗한 물로 씻어.)라고 했으므로 맞다.","오답 ✕ — 소년은 'Make sure you don't rub it.'(비비지 않도록 해.)라고 했다. 비비라고 한 것이 아니라 비비지 말라고 했으므로 틀림.","오답 ✕ — 얼음에 대한 말은 대화에 없다. 소년은 'Wash it with clean water.'(깨끗한 물로 씻어.)라고 했다.","오답 ✕ — 눈을 감고 가만히 있으라는 말은 대화에 없다. 가장 가까운 문장은 'Wash it with clean water.'(깨끗한 물로 씻어.)이다.","오답 ✕ — 병원에 가라는 말은 대화에 없다. 소년은 깨끗한 물로 씻으라는 응급 처치를 알려 주었다."],"memo":["정답 ①: 눈을 비비지 말고 깨끗한 물로 씻는다.","근거: Make sure you don't rub it. Wash it with clean water.(비비지 않도록 해. 깨끗한 물로 씻어.)","함정: 'don't rub'(비비지 마)를 비비라는 말로 바꾼 ②는 ✕"],"why":"눈에 이물질이 들어가면 비비지 말고 깨끗한 물로 씻는다."}],"dlg":[["B","Sophia, your eye is red. What happened?","Sophia, 눈이 빨개. 무슨 일이야?"],["G","I think I got something in my eye.","눈에 뭐가 들어간 것 같아."],["B","Make sure you don't rub it. Wash it with clean water.","비비지 않도록 해. 깨끗한 물로 씻어."],["G","Okay, I will. Thanks!","알겠어, 그럴게. 고마워!"]]}];var BG=[{"qs":[{"n":6,"q":"응급 처치를 아는 것의 장점으로 알맞은 것은?","o":["사고가 일어나는 것을 완전히 막을 수 있다.","상황이 더 나빠지는 것을 막고 자신과 다른 사람을 도울 수 있다.","사고가 언제 일어날지 미리 알 수 있다.","병원에 갈 필요가 없어진다.","모든 병을 스스로 치료할 수 있다."],"a":1,"ans":"상황이 더 나빠지는 것을 막고 자신과 다른 사람을 도울 수 있다.","evs":[["However, knowing first aid can stop situations from getting worse.","하지만 응급 처치를 알면 상황이 더 나빠지는 것을 막을 수 있다."],["If you have basic first aid skills, you can help yourself and others who are in need.","만약 여러분이 기본적인 응급 처치법을 알고 있다면 여러분 자신과 도움이 필요한 다른 사람들을 도울 수 있다."]],"ev":["However, knowing first aid can stop situations from getting worse.","하지만 응급 처치를 알면 상황이 더 나빠지는 것을 막을 수 있다."],"ow":["오답 ✕ — 'Accidents can happen anytime, anywhere.'(사고는 언제 어디서든 일어날 수 있다.)라고 했다. 응급 처치는 사고를 막는 것이 아니라 'stop situations from getting worse'(상황이 더 나빠지는 것을 막는 것)이라서 틀림.","정답 ○ — 'knowing first aid can stop situations from getting worse'(응급 처치를 알면 상황이 더 나빠지는 것을 막을 수 있다)와 'you can help yourself and others who are in need'(자신과 도움이 필요한 다른 사람들을 도울 수 있다)에서 알 수 있다.","오답
