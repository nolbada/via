 말한다. 나는 훨씬 차분해진 걸 느낀다. Mike는 \"창문이 닫혀 있어. Larry가 아직 이 안에 있는 게 분명해.\"라고 말한다. 우리는 교실 모든 곳을 찾아보지만, Larry를 찾지 못한다. \"리코더를 불어 보는 건 어때? Larry가 나올지도 몰라.\"라고 Mike가 말한다. \"글쎄, Larry는 뱀이 아니야. 봐! 이 웹사이트에 따르면 이구아나는 어두운 곳을 좋아한대. 교실을 어둡게 해 보자.\"라고 Jenny가 말한다. 그래서, 우리는 불을 끄고 커튼을 닫는다. 우리는 기다리지만, 아무 일도 일어나지 않는다.","\"Larry는 오늘 아무것도 안 먹었으니 배가 고플 거야.\"라고 내가 말한다. Mike가 말한다. \"나는 바나나가 하나 있어. 그건 Larry가 가장 좋아하는 간식이지. 그것을 케이지 옆에 놓아두자.\" 우리는 조용히 기다린다. 잠시 후, 우리는 작은 발소리를 듣는다. Larry다! 우리는 교실 뒤편에 있는 사물함 아래에서 그를 발견한다. 그는 천천히 바나나 쪽으로 걸어가서 그것을 먹는다. Mike는 재빨리 달려가 Larry를 우리 안으로 데리고 간다. 우리는 모두 기뻐서 소리친다! 그리고 내가 가장 행복한 사람이다."];var DG=[{"qs":[{"n":1,"q":"What is Ann's problem?","o":["배탈이 났다.","머리가 아프다.","눈이 안 보인다.","몸살이 나서 쉬고 싶다.","줄넘기를 하는 방법을 모른다."],"a":1,"ans":"머리가 아프다.","evs":[["I have a headache.","머리가 아파요."],["You don't look well.","몸이 안 좋아 보이는구나."]],"ev":["I have a headache.","머리가 아파요."],"ow":["오답 ✕ — Ann은 'I have a headache.'(머리가 아파요.)라고 했는데, 배탈이 났다는 말은 없어서 틀림.","정답 ○ — Ann이 'I have a headache.'(머리가 아파요.)라고 말했으므로 Ann의 문제는 머리가 아픈 것이다.","오답 ✕ — 선생님이 'You don't look well.'(몸이 안 좋아 보이는구나.)이라고 했지만 Ann은 'I have a headache.'(머리가 아파요.)라고 답했고, 눈이 안 보인다는 말은 없어서 틀림.","오답 ✕ — 'I have a headache.'(머리가 아파요.)라고 했을 뿐, 몸살이 났다는 말은 없어서 틀림.","오답 ✕ — 'put your jump rope down'(줄넘기를 내려놓고)에서 줄넘기를 하던 중임은 알 수 있지만, 방법을 모른다는 말은 없고 Ann은 'I have a headache.'(머리가 아파요.)라고 해서 틀림."],"memo":["정답: Ann은 머리가 아프다.","근거: I have a headache.(머리가 아파요.)","함정: headache(두통)와 stomachache(배탈)를 헷갈리지 말기."],"why":"Ann은 머리가 아파서 쉬고 싶어 한다."}],"dlg":[["W","Mr. Davis, can I go and rest on the bench?","Davis 선생님, 벤치에 가서 쉬어도 될까요?"],["M","What's wrong, Ann? You don't look well.","무슨 일이니, Ann? 몸이 안 좋아 보이는구나."],["W","I have a headache.","머리가 아파요."],["M","I see. Then, put your jump rope down and go rest on the bench.","그렇구나. 그럼 줄넘기는 내려놓고 벤치에 가서 쉬렴."]]},{"qs":[{"n":2,"q":"위 대화의 내용을 요약한 아래 문장의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["broke - sorry","lost - sorry","broke - thanks","found - hello","dropped - goodbye"],"a":0,"ans":"broke - sorry","evs":[["I dropped Mi
