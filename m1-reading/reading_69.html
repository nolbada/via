var D=[{"n":1,"tag":null,"en":"In a small towns in France, there lived a young boy. Him name was Henri Matisse.","ko":"프랑스의 작은 마을에 어린 소년이 살았다. 그의 이름은 Henri Matisse였다.","ok":false,"foot":[],"fixes":[{"wrong":"towns","right":"town","partial":false,"at":[3],"point":"부정관사와 단수명사: a 뒤에는 단수명사 town 사용","topic":"부정관사와 단수명사","memo":"a 뒤에는 단수명사 town 사용"},{"wrong":"Him","right":"His","partial":false,"at":[11],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 His 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 His 사용"}]},{"n":2,"tag":null,"en":"He liked to drew pictures. He drew pictures in the sand and in him books.","ko":"그는 그림 그리는 것을 좋아했다. 그는 모래와 그의 책에 그림을 그렸다.","ok":false,"foot":[],"fixes":[{"wrong":"drew","right":"draw","partial":false,"at":[3],"point":"to부정사: to 뒤에는 동사원형: draw (drew 아님)","topic":"to부정사","memo":"to 뒤에는 동사원형: draw (drew 아님)"},{"wrong":"him","right":"his","partial":false,"at":[13],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 his 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 his 사용"}]},{"n":3,"tag":null,"en":"When Matisse grown up, he left his town and becomed an artist in Paris. He painted pictures day after day and year after years.","ko":"Matisse가 어른이 되었을 때, 그는 마을을 떠나 파리에서 화가가 되었다. 그는 날마다, 해마다 그림을 그렸다.","ok":false,"foot":[],"fixes":[{"wrong":"grown","right":"grew","partial":false,"at":[2],"point":"불규칙 과거형: grow의 과거형은 grew (grown 아님)","topic":"불규칙 과거형","memo":"grow의 과거형은 grew (grown 아님)"},{"wrong":"becomed","right":"became","partial":false,"at":[9],"point":"불규칙 과거형: become의 과거형은 became (becomed 아님)","topic":"불규칙 과거형","memo":"become의 과거형은 became (becomed 아님)"},{"wrong":"years","right":"year","partial":false,"at":[23],"point":"반복 표현 A after A: 'year after year'는 단수명사 반복","topic":"반복 표현 A after A","memo":"'year after year'는 단수명사 반복"}]},{"n":4,"tag":null,"en":"He was happy with his life. More and more people began to notice he.","ko":"그는 그의 삶에 행복해했다. 점점 더 많은 사람들이 그를 알아보기 시작했다.","ok":false,"foot":[],"fixes":[{"wrong":"he","right":"him","partial":false,"at":[13],"point":"인칭대명사의 목적격: 동사 notice의 목적어는 목 ell","partial":false,"at":[7],"point":"형용사와 부사: 동사 paint를 꾸미는 말은 부사 well 사용","topic":"형용사와 부사","memo":"동사 paint를 꾸미는 말은 부사 well 사용"}]},{"n":11,"tag":null,"en":"One day, Matisse got an brilliant idea. He picked up scissors, cut some paper, and made beautiful shapes.","ko":"어느 날, Matisse는 멋진 생각을 해냈다. 그는 가위를 집어 들어 종이를 자르고, 아름다운 모양을 만들었다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[4],"point":"관사 a/an: 자음 소리 brilliant 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 brilliant 앞에는 a 사용"}]},{"n":12,"tag":null,"en":"He cut out birds and flowers. He was draw with SCISSORS!","ko":"그는 새와 꽃을 잘라 냈다. 그는 가위로 그림을 그리고 있었다!","ok":false,"foot":[],"fixes":[{"wrong":"draw","right":"drawing","partial":false,"at":[8],"point":"과거진행형: was 뒤에는 현재분사 drawing 사용","topic":"과거진행형","memo":"was 뒤에는 현재분사 drawing 사용"}]},{"n":13,"tag":null,"en":"He said to himself, \"My pleasure in cutting things grows and grows. Scissors gave I another chance.\"","ko":"그는 \"무엇인가를 오려 내는 나의 기쁨이 더욱 커지고 있어. 가위는 내게 또 다른 기회를 주었어.\"라고 자기 자신에게 말했다.","ok":false,"foot":[],"fixes":[{"wrong":"I","right":"me","partial":false,"at":[14],"point":"인칭대명사의 목적격: 동사 gave의 목적어는 목적격 me 사용","topic":"인칭대명사의 목적격","memo":"동사 gave의 목적어는 목적격 me 사용"}]},{"n":14,"tag":null,"en":"Matisse cut paper all day.","ko":"Matisse는 하루 종일 종이를 잘랐다.","ok":true,"foot":[],"fixes":[]},{"n":15,"tag":null,"en":"Soon his room was full of shapes and colors.","ko":"곧 그의 방은 모양과 색채로 가득 찼다.","ok":true,"foot":[],"fixes":[]},{"n":16,"tag":null,"en":"\"I stay in bed most of the times, but I made a small paper garden all around I. There is leaves, fruits, and birds ...","ko":"\"나는 대부분 시간을 침대에 머물러 있지만, 온 주변에 작은 종이 정원을 만들었어. 나뭇잎, 과일, 그리고 새들이 있지 …","ok":false,"foot":[],"fixes":[{"wrong":"times","right":"time","partial":false,"at":[7],"point":"명사의 단수·복수: '대부분의 시간'은 단수 the time 사용","topic":"명사의 단수·복수","memo":"'대부분의 시간'은 단수 the time 사용"},{"wrong":"I","right":"me","partial":false,"at":[17],"point":"인칭대명사의 목적격 (전치사 뒤): 전치사 around 뒤에는 목적격 me 사용","topic":"인칭 he fell ill. He could only lie in bed and sleep. He couldn't paint at all. He could only paint in his dreams. When Matisse opened his eyes, they were full of sadness.","Luckily, before long, he could sit. A little later, he started to paint again. However, he realized that he couldn't paint well anymore.","One day, Matisse got a brilliant idea. He picked up scissors, cut some paper, and made beautiful shapes. He cut out birds and flowers. He was drawing with SCISSORS! He said to himself, \"My pleasure in cutting things grows and grows. Scissors gave me another chance.\" Matisse cut paper all day.","Soon his room was full of shapes and colors.","\"I stay in bed most of the time, but I made a small paper garden all around me. There are leaves, fruits, and birds ... I am really happy,\" he thought.","Perhaps Matisse is still using scissors to cut out stars in heaven. Look at the night sky. Some of the stars may come from his scissors."];var PASS_KO=["Henri의 가위","프랑스의 작은 마을에 어린 소년이 살았다. 그의 이름은 Henri Matisse였다. 그는 그림 그리는 것을 좋아했다. 그는 모래와 그의 책에 그림을 그렸다.","Matisse가 어른이 되었을 때, 그는 마을을 떠나 파리에서 화가가 되었다. 그는 날마다, 해마다 그림을 그렸다. 그는 그의 삶에 행복해했다. 점점 더 많은 사람들이 그를 알아보기 시작했다. 그들은 그의 그림을 사랑했고 곧 그는 유명해졌다.","Matisse가 노인이 되었을 때, 그는 병에 걸렸다. 그는 침대에 누워 잠만 잘 수 있었다. 그는 그림을 전혀 그릴 수 없었다. 그는 오직 그의 꿈속에서만 그릴 수 있었다. Matisse가 눈을 떴을 때, 그의 눈은 슬픔으로 가득 차 있었다.","다행히도, 얼마 지나지 않아 그는 앉을 수 있었다. 조금 후에, 그는 다시 그림을 그리기 시작했다. 하지만 그는 더 이상 그림을 잘 그릴 수 없다는 것을 깨달았다.","어느 날, Matisse는 멋진 생각을 해냈다. 그는 가위를 집어 들어 종이를 자르고, 아름다운 모양을 만들었다. 그는 새와 꽃을 잘라 냈다. 그는 가위로 그림을 그리고 있었다! 그는 \"무엇인가를 오려 내는 나의 기쁨이 더욱 커지고 있어. 가위는 내게 또 다른 기회를 주었어.\"라고 자기 자신에게 말했다. Matisse는 하루 종일 종이를 잘랐다.","곧 그의 방은 모양과 색채로 가득 찼다.","\"나는 대부분 시간을 침대에 머물러 있지만, 온 주변에 작은 종이 정원을 만들었어. 나뭇잎, 과일, 그리고 새들이 있지 … 난 정말 행복해.\"라고 그는 생각했다.","아마도 Matisse는 여전히 천국에서 별을 오리기 위해 가위를 사용하고 있을 것이다. 밤하늘을 봐. 별들 중 일부는 그의 가위에서 나온 것일지도 모른다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["소년만 컵을 살 것이다.","소녀는 컵의 색깔이 마음에 들지 않는다.","두 사람은 그림 그리는 법을 이야기하고 있다.","두 사람 모두 컵을 하나씩 살 것이다.","소녀는 컵이 너무 pool, the United Kingdom.","우리는 영국의 리버풀에 있어요."]],"ev":["Let's meet the artist and ask him questions about this fantastic artwork.","그 예술가를 만나서 이 환상적인 작품에 대해 질문해 봐요."],"ow":["오답 ✕ — 'But are we in Korea? No, we're not.'(그런데 우리가 한국에 있나요? 아니요, 그렇지 않아요.)라고 했으므로 한국을 방문하는 것이 아니다.","오답 ✕ — 여자는 'ask him questions about this fantastic artwork'(그에게 이 작품에 대해 질문해 봐요)라고 했을 뿐 예술가를 돕겠다는 말은 없다.","오답 ✕ — 여자는 작품을 보고 있고 'Let's meet the artist'(예술가를 만나자)라고 했으므로 작품을 만들 계획은 아니다.","정답 ○ — 여자는 'Let's meet the artist and ask him questions about this fantastic artwork.'(예술가를 만나서 이 환상적인 작품에 대해 질문해 봐요.)라고 했으므로 그를 인터뷰할 것이다.","오답 ✕ — 'a traditional Korean house'(전통 한옥)는 작품 속에서 보이는 것이다. 여자가 한옥을 방문하겠다는 말은 없다."],"memo":["정답 ④: 예술가를 인터뷰할 것이다.","근거: Let's meet the artist and ask him questions ...(예술가를 만나서 질문해 봐요.)","함정: ① 작품 속에 한옥이 있을 뿐 한국에 있는 것이 아니다. ✕"],"why":"여자는 예술가를 만나 작품에 대해 질문하려 한다."}],"dlg":[["W","What do you think of this artwork? You can see a traditional Korean house between two buildings.","이 작품 어떻게 생각하세요? 두 건물 사이에서 전통 한옥을 볼 수 있어요."],["W","But are we in Korea? No, we're not. We're in Liverpool, the United Kingdom.","그런데 우리가 한국에 있나요? 아니요, 그렇지 않아요. 우리는 영국의 리버풀에 있어요."],["W","Let's meet the artist and ask him questions about this fantastic artwork.","그 예술가를 만나서 이 환상적인 작품에 대해 질문해 봐요."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용을 요약한 아래 문장의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["young - draw","old - draw","young - sell","young - take","young - find"],"a":0,"ans":"young - draw","evs":[["In a small town in France, there lived a young boy.","프랑스의 작은 마을에 어린 소년이 살았다."],["He liked to draw pictures.","그는 그림 그리는 것을 좋아했다."]],"ev":["In a small town in France, there lived a young boy.","프랑스의 작은 마을에 어린 소년이 살았다."],"ow":["정답 ○ — \"there lived a young boy\"(어린 소년이 살았다)와 \"He liked to draw pictures.\"(그림 그리는 것을 좋아했다.)에 맞으므로 young - draw이다.","오답 ✕ — 본문에는 \"a young boy\"(어린 소년)라고 했는데 old(나이 든)는 지문과 어긋나서 틀림.","오답 ✕ — \"He liked to draw pictures.\"(그림 그리는 것을 좋아했다.)라고 했지 그림을 파는(sell) 이야기는 없어서 틀림.","오답 ✕ — \"He liked to draw er year.","그는 날마다, 해마다 그림을 그렸다."],["He was happy with his life.","그는 그의 삶에 행복해했다."],["More and more people began to notice him.","점점 더 많은 사람들이 그를 알아보기 시작했다."],["They loved his paintings, and soon he became famous.","그들은 그의 그림을 사랑했고 곧 그는 유명해졌다."]]},{"qs":[{"n":8,"q":"윗글의 주제로 알맞은 것은?","o":["Henri Matisse's failure","support for Henri Matisse","Henri Matisse's famous paintings","people's opinions on Henri Matisse","a hard time in Matisse's life as a painter"],"a":4,"ans":"a hard time in Matisse's life as a painter","evs":[["He could only lie in bed and sleep.","그는 침대에 누워 잠만 잘 수 있었다."],["However, he realized that he couldn't paint well anymore.","하지만 그는 더 이상 그림을 잘 그릴 수 없다는 것을 깨달았다."]],"ev":["He could only lie in bed and sleep.","그는 침대에 누워 잠만 잘 수 있었다."],"ow":["오답 ✕ — 실패 이야기가 아니다. 'he fell ill'(그는 병에 걸렸다)처럼 병 때문에 그림을 못 그린 힘든 시기이다.","오답 ✕ — Matisse를 도와주는 사람은 글에 나오지 않는다. 'He could only lie in bed and sleep.'(침대에 누워 잠만 잘 수 있었다.)처럼 혼자 힘든 시간을 보냈다.","오답 ✕ — 유명한 그림에 대한 설명은 없다. 'He couldn't paint at all.'(그는 그림을 전혀 그릴 수 없었다.)처럼 그림을 못 그린 이야기이다.","오답 ✕ — 사람들의 의견은 이 글에 나오지 않는다. 글은 마티스 자신이 겪는 일에 집중한다.","정답 ○ — 'He couldn't paint at all.'(그는 그림을 전혀 그릴 수 없었다.)와 'he couldn't paint well anymore'(더 이상 그림을 잘 그릴 수 없었다)에서 화가로서 힘든 시기임을 알 수 있다."],"memo":["정답 ⑤: 화가로서 마티스의 힘든 시기","근거: He couldn't paint at all.(그는 그림을 전혀 그릴 수 없었다.)","함정: ① 실패가 아니라 병 때문에 겪은 어려움이다. ✕"],"why":"병에 걸려 그림을 그리지 못하게 된 마티스의 힘든 시기를 다룬다."}],"pp":[["When Matisse became an old man, he fell ill.","Matisse가 노인이 되었을 때, 그는 병에 걸렸다."],["He could only lie in bed and sleep.","그는 침대에 누워 잠만 잘 수 있었다."],["He couldn't paint at all.","그는 그림을 전혀 그릴 수 없었다."],["He could only paint in his dreams.","그는 오직 그의 꿈속에서만 그릴 수 있었다."],["When Matisse opened his eyes, they were full of sadness.","Matisse가 눈을 떴을 때, 그의 눈은 슬픔으로 가득 차 있었다."],["Luckily, before long, he could sit.","다행히도, 얼마 지나지 않아 그는 앉을 수 있었다."],["A little later, he started to paint again.","조금 후에, 그는 다시 그림을 그리기 시작했다."],["However, he realized that he couldn't paint well anymore.","하지만 그는 더 이상 그림을 잘 그릴 수 없다는 것을 깨달았다."]]},{"qs":[{"n":9,"q":"윗글의 내용과 일치하지 않는 것은?","o":["When Matisse cut things, he was happy.","Matisse created things with paper and scissors.","Matisse planted plants and trees in his room.","Matisse spent most of the time in bed.","Matisse thought he got another chance thanks to scissors."],"a":2,"ans":"Matisse planted plants and trees in his room.","evs":[["I stay in bed most of the time, but I made a small paper garden all around me.","나는 대부분 시간을 침대에 머물러 있지만, 온 주변에 작은 종이 정원을 만들었어."],["Scissors gave me another chance.","가위는 내게 또 다른 기회를 주었어."]],"ev":["I stay in bed most of the time, but I made a small paper garden all around me.","나는 대부분 시간을 침대에 머물러 있지만, 온 주변에 작은 종이 정원을 만들었어."],"ow":["오답 ✕ — 'I am really happy,' he thought.(난 정말 행복해.)라고 했고 'My pleasure in cutting things grows and grows.'(오려 내는 기쁨이 더욱 커지고 있어.)라고 했으므로 일치한다.","오답 ✕ — 'He picked up scissors, cut some paper, and made beautiful shapes.'(가위를 집어 들어 종이를 자르고 아름다운 모양을 만들었다.)이므로 일치한다.","정답(일치하지 않는 것) ○ — 방 안에 만든 것은 'a small paper garden'(작은 종이 정원)이지 진짜 식물이나 나무를 심은 것이 아니다.","오답 ✕ — 'I stay in bed most of the time'(나는 대부분 시간을 침대에 머물러 있다)이라고 했으므로 일치한다.","오답 ✕ — 'Scissors gave me another chance.'(가위는 내게 또 다른 기회를 주었어.)라고 했으므로 일치한다."],"memo":["정답 ③: 방에 식물과 나무를 심었다 (✕).","근거: I made a small paper garden all around me.(온 주변에 작은 종이 정원을 만들었어.)","함정: 진짜 정원이 아니라 종이로 만든 정원이다. 불일치 문제이니 틀린 것을 고른다."],"why":"마티스가 만든 것은 진짜 식물이 아니라 종이 정원이다."},{"n":10,"q":"다음은 윗글을 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["cut - chance","draw - problem","buy - lesson","fold - dream","paint - mistake"],"a":0,"ans":"cut - chance","evs":[["He picked up scissors, cut some paper, and made beautiful shapes.","그는 가위를 집어 들어 종이를 자르고, 아름다운 모양을 만들었다."],["Scissors gave me another chance.","가위는 내게 또 다른 기회를 주었어."]],"ev":["He picked up scissors, cut some paper, and made beautiful shapes.","그는 가위를 집어 들어 종이를 자르고, 아름다운 모양을 만들었다."],"ow":["정답 ○ — 마티스는 'He picked up scissors, cut some paper, and made beautiful shapes.'(가위로 종이를 잘라 아름다운 모양을 만들었다.) function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}

function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];

   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}

 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
