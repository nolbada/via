<style>

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Does you know any safety rules? Answer the questions and be ready for emergencies.","ko":"여러분은 어떤 안전 수칙을 알고 있나요? 질문에 답하고 비상 상황에 대비하세요.","ok":false,"foot":[],"fixes":[{"wrong":"Does","right":"Do","partial":false,"at":[0],"point":"의문문 do/does: 주어 you에는 Do 사용","topic":"의문문 do/does","memo":"주어 you에는 Do 사용"}]},{"n":2,"tag":"퀴즈 1 · 계단","en":"My friend are running down the stairs. He fall and can't move.","ko":"제 친구가 계단을 뛰어 내려가고 있어요. 그는 넘어져서 움직일 수 없어요.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[2],"point":"be동사의 긍정문: 주어 My friend(단수)에는 is 사용","topic":"be동사의 긍정문","memo":"주어 My friend(단수)에는 is 사용"},{"wrong":"fall","right":"falls","partial":false,"at":[8],"point":"3인칭 단수 현재형: 주어 He(3인칭 단수)는 동사에 -s: falls (fall 아님)","topic":"3인칭 단수 현재형","memo":"주어 He(3인칭 단수)는 동사에 -s: falls (fall 아님)"}]},{"n":3,"tag":null,"en":"What do I do?","ko":"제가 무얼 해야 하죠?","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"1. Take him to the doctor quick.","ko":"1. 친구를 의사에게 빨리 데려간다.","ok":false,"foot":[],"fixes":[{"wrong":"quick","right":"quickly","partial":false,"at":[6],"point":"형용사와 부사: 동사 Take를 꾸미는 부사 quickly 사용","topic":"형용사와 부사","memo":"동사 Take를 꾸미는 부사 quickly 사용"}]},{"n":5,"tag":null,"en":"2. Call 119 and leave your friend on the floor.","ko":"2. 119에 전화하고, 친구를 바닥에 둔다.","ok":true,"foot":[],"fixes":[]},{"n":6,"tag":null,"en":"Tip: Do not move your friend. You can hurt he.","ko":"힌트: 친구를 움직이지 마세요. 여러분이 친구를 다치게 할 수 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"he","right":"him","partial":false,"at":[9],"point":"인칭대명사의 목적격: 동사 hurt 뒤에는 목적격 him 사용","topic":"인칭대명사의 목적격","memo":"동사 hurt 뒤에는 목적격 him 사용"}]},{"n":7,"tag":null,"en":"Wait to the ambulance.","ko":"구급차를 기다리세요.","ok":false,"foot":[],"fixes":[{"wrong":"to","right":"for","partial":false,"at":[1],"point":"기본전치사: \"~를 기다리다\"는 wait for 사용","topic":"기본전치사","memo":"\"~를 기다리다\"는 wait for 사용"}]},{"n":8,"tag":"퀴즈 2 · 엘리베이터","en":"You are riding the elevator. Suddenly, it shakes a lot  eating 형태"}]},{"n":14,"tag":null,"en":"It's too hotly! His hand hurts.","ko":"그건 너무 뜨거워요! 그의 손이 아파요.","ok":false,"foot":[],"fixes":[{"wrong":"hotly","right":"hot","partial":false,"at":[2],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 hot 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 hot 사용"}]},{"n":15,"tag":null,"en":"What do I have to do?","ko":"제가 무얼 해야 하죠?","ok":true,"foot":[],"fixes":[]},{"n":16,"tag":null,"en":"1. Put ices on his hand.","ko":"1. 남동생 손에 얼음을 얹는다.","ok":false,"foot":[],"fixes":[{"wrong":"ices","right":"ice","partial":false,"at":[2],"point":"셀 수 없는 명사: ice는 셀 수 없는 명사이므로 ice 사용","topic":"셀 수 없는 명사","memo":"ice는 셀 수 없는 명사이므로 ice 사용"}]},{"n":17,"tag":null,"en":"2. Run cool water over his hand.","ko":"2. 남동생 손에 시원한 물을 흐르게 한다.","ok":true,"foot":[],"fixes":[]},{"n":18,"tag":null,"en":"Tip: Ice are too cold. It can hurt his skin.","ko":"힌트: 얼음은 너무 차가워요. 얼음은 그의 피부를 다치게 할 수 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[2],"point":"be동사의 긍정문: 주어 Ice(셀 수 없는 명사)에는 is 사용","topic":"be동사의 긍정문","memo":"주어 Ice(셀 수 없는 명사)에는 is 사용"}]},{"n":19,"tag":null,"en":"But cool water cools down the burn.","ko":"하지만 시원한 물은 화상을 식혀 줘요.","ok":true,"foot":[],"fixes":[]},{"n":20,"tag":null,"en":"Do you understand this safety rules now? Please remember them and stay safely!","ko":"여러분은 이제 이러한 안전 수칙을 이해하나요? 이 수칙을 기억하고 안전하게 지내세요!","ok":false,"foot":[],"fixes":[{"wrong":"this","right":"these","partial":false,"at":[3],"point":"지시형용사 this/these: 복수명사 rules 앞에는 these 사용","topic":"지시형용사 this/these","memo":"복수명사 rules 앞에는 these 사용"},{"wrong":"safely","right":"safe","partial":false,"at":[12],"point":"형용사와 부사: stay 뒤 보어 자리에는 형용사 safe 사용","topic":"형용사와 부사","memo":"stay 뒤 보어 자리에는 형용사 safe 사용"}]}];var PP=[["Do you know any safety rules?","여러분은 어떤 안전 수칙을 알고 있나요?",1],["Answer the questions and be ready for emergencies.","질문에 답하고 비상 상황에 대비하세요.",0],["QUIZ 1","퀴즈 1",1],["My friend is running down the stairs.","제 친구가 계단을 뛰어 내려가고 있어요.",1],["He falls and can't move.","그 ot. Is this an emergency? What do you do?","1. Push the emergency button and wait for help.","2. Push the buttons for all the floors and get off the elevator right away.","Tip: The elevator can stop anytime and become dangerous. Get off on the next floor.","QUIZ 3","My brother is eating soup. Ouch! It's too hot! His hand hurts. What do I have to do?","1. Put ice on his hand.","2. Run cool water over his hand.","Tip: Ice is too cold. It can hurt his skin. But cool water cools down the burn.","Do you understand these safety rules now? Please remember them and stay safe!"];var PASS_KO=["안전 퀴즈","여러분은 어떤 안전 수칙을 알고 있나요? 질문에 답하고 비상 상황에 대비하세요.","퀴즈 1","제 친구가 계단을 뛰어 내려가고 있어요. 그는 넘어져서 움직일 수 없어요. 제가 무얼 해야 하죠?","1. 친구를 의사에게 빨리 데려간다.","2. 119에 전화하고, 친구를 바닥에 둔다.","힌트: 친구를 움직이지 마세요. 여러분이 친구를 다치게 할 수 있어요. 구급차를 기다리세요.","퀴즈 2","여러분은 엘리베이터를 타고 있습니다. 갑자기 엘리베이터가 많이 흔들립니다. 이건 비상 상황일까요? 여러분은 무엇을 해야 하죠?","1. 비상 버튼을 누르고 도움을 기다린다.","2. 모든 층의 버튼을 누르고 엘리베이터에서 바로 내린다.","힌트: 엘리베이터는 언제든지 멈춰서 위험해질 수 있어요. 다음 층에서 내리세요.","퀴즈 3","제 남동생이 국을 먹고 있어요. 아야! 그건 너무 뜨거워요! 그의 손이 아파요. 제가 무얼 해야 하죠?","1. 남동생 손에 얼음을 얹는다.","2. 남동생 손에 시원한 물을 흐르게 한다.","힌트: 얼음은 너무 차가워요. 얼음은 그의 피부를 다치게 할 수 있어요. 하지만 시원한 물은 화상을 식혀 줘요.","여러분은 이제 이러한 안전 수칙을 이해하나요? 이 수칙을 기억하고 안전하게 지내세요!"];var DG=[{"qs":[{"n":1,"q":"Why shouldn't Junho touch the plant?","o":["희귀한 식물이어서","식물이 죽을 수 있어서","법으로 금지하고 있어서","타인에게 방해되지 않기 위해","어떤 식물들은 위험할 수 있어서"],"a":4,"ans":"어떤 식물들은 위험할 수 있어서","evs":[["G: Be careful. Don't touch it.","조심해. 만지지 마."],["G: Look at this sign. Some plants can be dangerous.","이 표지판을 봐. 어떤 식물들은 위험할 수 있어."]],"ev":["G: Be careful. Don't touch it.","조심해. 만지지 마."],"ow":["오답 ✕ — 대화에서 민지는 'Some plants can be dangerous.'(어떤 식물들은 위험할 수 있어.)라고만 했고, 희귀한 식물이라는 말은 어디에도 없어서 틀림.","오답 ✕ — 민지는 'Look at this sign. Some plants can be dangerous.'(이 표지판을 봐. 어떤 식물들은 위험할 수 있어.)라고 했다. 위험한 것은 사람에게지, 식물이 죽는다는 말은 없어서 틀림.","오답 ✕ — 민지는 표지판을 가리키며 'Some plants can be dangerous.'라고 했을 뿐, 법으로 금지되어 있다는 말은 대화에 전혀 없어서 틀림.","오답 ✕ — 'Be careful. Don't touch it.'(조심해. 만지지 마.)라고 한 이유는 위험해서이지, 다른 사람에게 방해가 되기 때문이 아니라서 틀림.","정답 ○ — 'Look at this sign. Some plants can be dangerous.'(이 표지판을 봐. 어떤 식물들은 위험할 수 있어.)라고 이유를 말했으므로 준호가 식물을 만지면 안 되는 이유로 알맞다."],"memo":["정답 ⑤: 어떤 식물들은 위험할 수 있어서 만지면 안 된다.","근거: Some plants can be dangerous.(어떤 식물들은 위험할 수 있어.)","함정: ①②③④는 대화에 없는 이유라서 ✕"],"why":"준호가 식물을 만지면 안 되는 이유는 어떤 식물들이 위험할 수 있기 때문이다."},{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Junho wants to touch the plant.","Junho is looking at a colorful plant.","Junho doesn't know about the plant.","Junho finally touches the pretty plant.","There is a warning sign for some plants."],"a":3,"ans":"Junho finally touches the pretty plant.","evs":[["B: Hi, Minji. I'm looking at this plant. Look! It's so colorful.","안녕, 민지야. 나는 이 식물을 보고 있어. 봐! 정말 알록달록해."],["B: Oh, I see. Let's just look.","아, 알겠어. 그냥 보기만 하자."]],"ev":["B: Hi, Minji. I'm looking at this plant. Look! It's so colorful.","안녕, 민지야. 나는 이 식물을 보고 있어. 봐! 정말 알록달록해."],"ow":["정답 아님(일치) ✕ — 'Can I touch it?'(만져 봐도 될까?)라고 물었으므로 준호가 식물을 만지고 싶어 하는 것은 대화 내용과 일치한다.","일치 — 'I'm looking at this plant. Look! It's so colorful.'(나는 이 식물을 보고 있어. 봐! 정말 알록달록해.)라고 했으므로 알록달록한 식물을 보고 있는 것이 맞다.","일치 — 'I'm not sure.'(잘 모르겠어.)라고 했으므로 준호가 그 식물에 대해 잘 모르는 것이 맞다.","정답 ○ (불일치) — 준호는 'Oh, I see. Let's just look.'(아, 알겠어. 그냥 보기만 하자.)라고 했다. 끝내 식물을 만진 것이 아니라 보기만 하기로 했으므로 대화 내용과 일치하지 않는다.","일치 — 'Look at this sign.'(이 표지판을 봐.)이라고 했으므로 어떤 식물에 대한 경고 표지판이 있는 것이 맞다."],"memo":["정답 ④: 준호는 식물을 만지지 않고 그냥 보기로 했다.","근거: Oh, I see. Let's just look.(아, 알겠어. 그냥 보기만 하자.)","함정: ①은 Can I touch it?으로 만지고 싶어 한 것은 맞아서 일치"],"why":"준호는 결국 식물을 만지지 않고 보기만 하기로 했다."},{"n":3,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["touch - dangerous","touch - expensive","buy - dangerous","pick - rare","water - safe"],"a":0,"ans":"touch - dangerous","evs":[["B: I'm not sure. It is so pretty. Can I touch it?","잘 모르겠어. 정말 예뻐. 만져 봐도 될까?"],["G: Look at this sign. Some plants can be dangerous.","이 표지판을 봐. 어떤 식물들은 위험할 수 있어."]],"ev":["B: I'm not sure. It is so pretty. Can I touch it?","잘 모르겠어. 정말 예뻐. 만져 봐도 될까?"],"ow":["정답 ○ — 준호는 'Can I touch it?'(만져 봐도 될까?)라고 물었고, 민지는 'Some plants can be dangerous.'(어떤 식물들은 위험할 수 있어.)라고 했으므로 (A)는 touch, (B)는 dangerous가 맞다.","오답 ✕ — (A) touch는 맞지만, 민지는 'Some plants can be dangerous.'(어떤 식물들은 위험할 수 있어.)라고 했지 값이 비싸다(expensive)는 말은 없다.","오답 ✕ — (B) dangerous는 맞지만, 준호는 'Can I touch it?'(만져 봐도 될까?)이라고 했지 식물을 사겠다(buy)고 하지 않았다.","오답 ✕ — 준호가 꺾고(pick) 싶어 한다는 말도, 식물이 희귀하다(rare)는 말도 없다. 대화에서는 'Can I touch it?'과 'dangerous'가 나온다.","오답 ✕ — 준호는 물을 주려는(water) 것이 아니라 'Can I touch it?'(만져 봐도 될까?)이라고 했고, 민지는 안전하다(safe)가 아니라 'dangerous'라고 했다."],"memo":["정답 ①: 준호는 식물을 만지고(touch) 싶어 했지만 어떤 식물은 위험할(dangerous) 수 있다.","근거: Can I touch it?(만져 봐도 될까?) / Some plants can be dangerous.(어떤 식물들은 위험할 수 있어.)","함정: ⑤는 dangerous를 safe로 바꾼 반대 뜻이라 ✕"],"why":"준호는 식물을 만지고 싶었지만 어떤 식물은 위험할 수 있어서 말렸다.","sum":"Junho wanted to (A) ______ a colorful plant, but Minji told him not to because some plants can be (B) ______.","lab":"완성된 요약문 : "},{"n":4,"q":"대화가 끝난 뒤 준호와 민지가 할 일로 가장 알맞은 것은?","o":["They will touch the plant carefully.","They will just look at the plant.","They will ask a teacher to remove the plant.","They will take the plant home.","They will read a book about plants."],"a":1,"ans":"They will just look at the plant.","evs":[["B: Oh, I see. Let's just look.","아, 알겠어. 그냥 보기만 하자."],["G: Be careful. Don't touch it.","조심해. 만지지 마."]],"ev":["B: Oh, I see. Let's just look.","아, 알겠어. 그냥 보기만 하자."],"ow":["오답 ✕ — 민지가 'Don't touch it.'(만지지 마.)이라고 했고 준호도 'Let's just look.'(그냥 보기만 하자.)이라고 했으므로 조심해서라도 만지는 일은 없다.","정답 ○ — 준호가 'Oh, I see. Let's just look.'(아, 알겠어. 그냥 보기만 하자.)이라고 했으므로 두 사람은 식물을 보기만 할 것이다.","오답 ✕ — 대화에는 선생님에게 부탁해 식물을 치운다는 말이 전혀 없다. 'Let's just look.'(그냥 보기만 하자.)이 마지막 결정이다.","오답 ✕ — 'Don't touch it.'(만지지 마.)이라고 했는데 집에 가져간다는 것은 말이 안 되고, 그런 언급도 없다.","오답 ✕ — 식물에 대한 책을 읽는다는 말은 없다. 두 사람은 'Let's just look.'(그냥 보기만 하자.)이라고 했다."],"memo":["정답 ②: 두 사람은 식물을 그냥 보기만 할 것이다.","근거: Oh, I see. Let's just look.(아, 알겠어. 그냥 보기만 하자.)","함정: ①은 Don't touch it.과 정반대라 ✕"],"why":"준호는 민지의 경고를 듣고 식물을 만지지 않고 보기만 하기로 했다."}],"dlg":[["G","Hi, Junho. What are you doing?","안녕, 준호야. 뭐 하고 있니?"],["B","Hi, Minji. I'm looking at this plant. Look! It's so colorful.","안녕, 민지야. 나는 이 식물을 보고 있어. 봐! 정말 알록달록해."],["G","Wow! What is it?","와! 그게 뭐야?"],["B","I'm not sure. It is so pretty. Can I touch it?","잘 모르겠어. 정말 예뻐. 만져 봐도 될까?"],["G","Be careful. Don't touch it.","조심해. 만지지 마."],["B","Why?","왜?"],["G","Look at this sign. Some plants can be dangerous.","이 표지판을 봐. 어떤 식물들은 위험할 수 있어."],["B","Oh, I see. Let's just look.","아, 알겠어. 그냥 보기만 하자."]]},{"qs":[{"n":5,"q":"다음 대화의 내용과 일치하는 것은?","o":["Emily is dancing with Sam.","Emily is singing with Sam.","Emily is dancing alone.","Emily is not dancing.","Sam is dancing with Hyeonsu."],"a":0,"ans":"Emily is dancing with Sam.","evs":[["G: She is dancing.","그녀는 춤을 추고 있어."],["B: Is she dancing with Sam?","샘과 함께 춤을 추고 있니?"],["G: Yes, she is.","응, 그래."]],"ev":["G: She is dancing.","그녀는 춤을 추고 있어."],"ow":["정답 ○ — 'Is she dancing with Sam?'(샘과 함께 춤을 추고 있니?)라는 질문에 'Yes, she is.'(응, 그래.)라고 답했으므로 에밀리는 샘과 함께 춤을 추고 있다.","오답 ✕ — 'She is dancing.'(그녀는 춤을 추고 있어.)이라고 했는데 이 보기는 노래한다(singing)고 해서 틀림.","오답 ✕ — 'Is she dancing with Sam?'에 'Yes, she is.'라고 했으므로 혼자가 아니라 샘과 함께 춤을 추고 있어서 틀림.","오답 ✕ — 'She is dancing.'(그녀는 춤을 추고 있어.)이라고 했는데 이 보기는 춤을 추고 있지 않다고 해서 틀림.","오답 ✕ — 대화에 현수(Hyeonsu)에 대한 이야기는 없고, 샘은 에밀리와 함께 춤추는 사람이라서 틀림."],"memo":["정답 ①: 에밀리는 샘과 함께 춤을 추고 있다.","근거: Is she dancing with Sam? - Yes, she is.(샘과 함께 춤을 추고 있니? - 응, 그래.)","함정: ③은 Sam과 함께라는 말과 어긋나서 ✕"],"why":"에밀리는 샘과 함께 춤을 추고 있다."}],"dlg":[["B","What is Emily doing?","에밀리는 뭘 하고 있니?"],["G","She is dancing.","그녀는 춤을 추고 있어."],["B","Is she dancing with Sam?","샘과 함께 춤을 추고 있니?"],["G","Yes, she is.","응, 그래."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 주제로 알맞은 것은?","o":["계단에서 뛰지 말고 걸어야 하는 이유","친구가 넘어져 움직일 수 없을 때 올바른 대처법","구급차가 올 때까지 넘어진 친구를 도와주는 방법","비상 상황이 발생하지 않기 위해 우리가 해야 할 일","친구가 넘어져 움직일 수 없을 때 의사의 도움이 필요한 이유"],"a":1,"ans":"친구가 넘어져 움직일 수 없을 때 올바른 대처법","evs":[["He falls and can't move.","그는 넘어져서 움직일 수 없어요."],["Tip: Do not move your friend.","힌트: 친구를 움직이지 마세요."],["Wait for the ambulance.","구급차를 기다리세요."]],"ev":["He falls and can't move.","그는 넘어져서 움직일 수 없어요."],"ow":["오답 ✕ — 본문은 'My friend is running down the stairs.'(제 친구가 계단을 뛰어 내려가고 있어요.)라고 상황만 말할 뿐, 계단에서 뛰지 말아야 하는 이유를 설명하지 않는다.","정답 ○ — 'He falls and can't move.'(그는 넘어져서 움직일 수 없어요.)라는 상황에서 'Tip: Do not move your friend.'(친구를 움직이지 마세요.), 'Wait for the ambulance.'(구급차를 기다리세요.)라고 올바른 대처법을 알려 주므로 정답.","오답 ✕ — 본문은 'Call 119 and leave your friend on the floor.'(119에 전화하고 친구를 바닥에 둔다.)처럼 친구를 직접 옮기지 않는 대처를 알려 준다. '도와주는 방법'이라고 하면 핵심과 어긋나서 틀림.","오답 ✕ — 'He falls and can't move.'(그는 넘어져서 움직일 수 없어요.)처럼 이미 사고가 난 뒤의 대처를 다룬다. 사고를 예방하는 방법은 본문에 없다.","오답 ✕ — 'Take him to the doctor quickly.'(친구를 의사에게 빨리 데려간다.)는 오히려 피해야 할 선택지이고, 의사의 도움이 필요한 이유는 설명하지 않는다."],"memo":["정답 ②: 친구가 넘어져 움직일 수 없을 때의 올바른 대처법","근거: Tip: Do not move your friend.(친구를 움직이지 마세요.)","함정: ⑤는 의사에게 빨리 데려가라는 틀린 선택지(1번)와 연결돼서 ✕"],"why":"넘어져 움직일 수 없는 친구를 움직이지 말고 구급차를 기다리는 것이 올바른 대처이다."},{"n":7,"q":"윗글의 내용과 일치하지 않는 것은?","o":["The writer tells us about safety rules.","The writer's friend falls down the stairs.","The writer's friend cannot move.","The writer should move his/her friend to a safe place.","The writer calls 119 and has to wait for the ambulance."],"a":3,"ans":"The writer should move his/her friend to a safe place.","evs":[["Tip: Do not move your friend.","힌트: 친구를 움직이지 마세요."],["Call 119 and leave your friend on the floor.","119에 전화하고, 친구를 바닥에 둔다."]],"ev":["Tip: Do not move your friend.","힌트: 친구를 움직이지 마세요."],"ow":["일치 — 본문은 'Do you know any safety rules?'(여러분은 어떤 안전 수칙을 알고 있나요?)로 시작해 안전 수칙을 알려 주므로 맞는 설명이다.","일치 — 'My friend is running down the stairs. He falls'(제 친구가 계단을 뛰어 내려가고 있어요. 그는 넘어져서)에서 친구가 계단에서 넘어졌음을 알 수 있다.","일치 — 'He falls and can't move.'(그는 넘어져서 움직일 수 없어요.)라고 했으므로 친구가 움직일 수 없는 것이 맞다.","정답 ○ (불일치) — 'Tip: Do not move your friend.'(친구를 움직이지 마세요.)라고 했는데 이 보기는 친구를 안전한 곳으로 옮겨야 한다고 해서 본문과 반대이다.","일치 — 'Call 119 and leave your friend on the floor.'(119에 전화하고 친구를 바닥에 둔다.), 'Wait for the ambulance.'(구급차를 기다리세요.)와 맞다."],"memo":["정답 ④: 친구를 안전한 곳으로 옮겨야 한다는 말은 본문과 반대이다.","근거: Tip: Do not move your friend.(친구를 움직이지 마세요.)","함정: ⑤는 119에 전화하고 구급차를 기다린다는 본문과 일치"],"why":"본문은 다친 친구를 움직이지 말라고 하므로 옮겨야 한다는 말은 틀리다."}],"pp":[["QUIZ 1","퀴즈 1"],["My friend is running down the stairs.","제 친구가 계단을 뛰어 내려가고 있어요."],["He falls and can't move.","그는 넘어져서 움직일 수 없어요."],["What do I do?","제가 무얼 해야 하죠?"],["1. Take him to the doctor quickly.","1. 친구를 의사에게 빨리 데려간다."],["2. Call 119 and leave your friend on the floor.","2. 119에 전화하고, 친구를 바닥에 둔다."],["Tip: Do not move your friend.","힌트: 친구를 움직이지 마세요."],["You can hurt him.","여러분이 친구를 다치게 할 수 있어요."],["Wait for the ambulance.","구급차를 기다리세요."]]},{"qs":[{"n":8,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["dangerous - get off","dangerous - wait","safe - get off","safe - stay","quiet - get off"],"a":0,"ans":"dangerous - get off","evs":[["Tip: The elevator can stop anytime and become dangerous.","힌트: 엘리베이터는 언제든지 멈춰서 위험해질 수 있어요."],["Get off on the next floor.","다음 층에서 내리세요."]],"ev":["Tip: The elevator can stop anytime and become dangerous.","힌트: 엘리베이터는 언제든지 멈춰서 위험해질 수 있어요."],"ow":["정답 ○ — 'The elevator can stop anytime and become dangerous.'(엘리베이터는 언제든지 멈춰서 위험해질 수 있어요.)라고 했고 'Get off on the next floor.'(다음 층에서 내리세요.)라고 했으므로 (A) dangerous, (B) get off가 맞다.","오답 ✕ — (A) dangerous는 맞지만 본문은 'Get off on the next floor.'(다음 층에서 내리세요.)라고 했지 기다리라(wait)고 하지 않았다.","오답 ✕ — (B) get off는 맞지만 본문은 엘리베이터가 'become dangerous'(위험해질 수 있다)라고 했으므로 safe는 반대 뜻이다.","오답 ✕ — 본문은 'become dangerous'(위험해질 수 있다)라고 했으므로 safe는 틀리고, 'Get off'(내리세요)라고 했으므로 stay도 틀리다.","오답 ✕ — (B) get off는 맞지만 본문에는 엘리베이터가 조용해진다(quiet)는 말이 없고 'become dangerous'(위험해질 수 있다)라고 했다."],"memo":["정답 ①: 엘리베이터는 위험해질(dangerous) 수 있으니 다음 층에서 내려야(get off) 한다.","근거: The elevator can stop anytime and become dangerous.(엘리베이터는 언제든지 멈춰서 위험해질 수 있어요.)","함정: 비상 버튼 누르고 기다리기(1번)는 오답 선택지"],"why":"흔들리는 엘리베이터는 위험해질 수 있으므로 모든 층 버튼을 누르고 다음 층에서 내려야 한다.","sum":"If an elevator shakes a lot, it can  return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
