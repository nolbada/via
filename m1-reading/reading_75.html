rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Nick Allen were in the fifth grade. One day in English class, he asked his teacher, \"How do words gets their meanings?","ko":"Nick Allen은 5학년이었다. 어느 날 영어 시간에, 그는 선생님께 \"단어는 어떻게 의미를 갖게 되나요?","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[2],"point":"be동사의 과거형: 주어 Nick Allen(단수)은 was (were 아님)","topic":"be동사의 과거형","memo":"주어 Nick Allen(단수)은 was (were 아님)"},{"wrong":"gets","right":"get","partial":false,"at":[19],"point":"do/does 의문문: do 뒤에는 동사원형: get (gets 아님)","topic":"do/does 의문문","memo":"do 뒤에는 동사원형: get (gets 아님)"}]},{"n":2,"tag":null,"en":"Why do the word dog mean a dog? Why can't it mean a book?\"","ko":"왜 '개'라는 단어는 개를 의미하는 거죠? 왜 그것이 책을 의미할 수는 없는 건가요?\"라고 물었다.","ok":false,"foot":[],"fixes":[{"wrong":"do","right":"does","partial":false,"at":[1],"point":"do/does 의문문: 단수 주어 the word에는 does 사용","topic":"do/does 의문문","memo":"단수 주어 the word에는 does 사용"}]},{"n":3,"tag":null,"en":"Mrs. Granger answered, \"People gives meanings to words.\" Nick asked, \"How?\"","ko":"Granger 선생님은 \"사람들이 단어에 의미를 부여한단다.\"라고 대답했다. Nick이 \"어떻게요?\"라고 물었다.","ok":false,"foot":[],"fixes":[{"wrong":"gives","right":"give","partial":false,"at":[4],"point":"일반동사 현재형: 복수 주어 People: give (gives 아님)","topic":"일반동사 현재형","memo":"복수 주어 People: give (gives 아님)"}]},{"n":4,"tag":null,"en":"Mrs. Granger said, \"You, me, and everyone in the country agreed in the meaning.\" Nick thought, \"Really?","ko":"Granger 선생님은 \"너, 나, 그리고 나라의 모든 사람이 그 의미에 동의했단다.\"라고 말했다. Nick은 \"정말?","ok":false,"foot":[],"fixes":[{"wrong":"in","right":"on","partial":false,"at":[11],"point":"기본전치사: '~에 동의하다'는 agree on 사용","topic":"기본전치사","memo":"'~에 동의하다'는 agree on 사용"}]},{"n":5,"tag":null,"en":"I didn't agreed.\"","ko":"나는 동의하지 않았는데.\"라고 생각했다.","ok":false,"foot":[],"fixes":[{"wrong":"agreed","right":"agree","partial":false,"at":[2],"point":"do/does 부정문: didn't 뒤에는 동사원형 agree 사용","topic":"do/does 부정문","memo":"didn't 뒤에는 동사원형 agree 사용"}]},{"n":6,"tag":null,"en":"On the way to er called Nick. She said, \"Frindle is not a real word. You and your classmates should stop using it.\" Nick said, \"I know that you're not happy. I'm really sorry, but it's too late. Everyone is using it now.\" Mrs. Granger took out a letter. She said, \"I wrote this letter for you. But I'm not going to give it to you today. I will send you this letter some day.\"","The next morning, Mrs. Granger told the class, \"Stop using frindle! Frindle is not a real word.\" But more and more students used it. Students in other schools started using it. Soon, students in the whole country were using it.","Time passed and Nick graduated. He forgot about frindle. When he turned 21, he received a package from Mrs. Granger. It had a pen, a letter, and a dictionary. There was a note on the dictionary.","Frindle"];var PASS_KO=["Frindle","Nick Allen은 5학년이었다. 어느 날 영어 시간에, 그는 선생님께 \"단어는 어떻게 의미를 갖게 되나요? 왜 '개'라는 단어는 개를 의미하는 거죠? 왜 그것이 책을 의미할 수는 없는 건가요?\"라고 물었다. Granger 선생님은 \"사람들이 단어에 의미를 부여한단다.\"라고 대답했다. Nick이 \"어떻게요?\"라고 물었다. Granger 선생님은 \"너, 나, 그리고 나라의 모든 사람이 그 의미에 동의했단다.\"라고 말했다. Nick은 \"정말? 나는 동의하지 않았는데.\"라고 생각했다.","집에 오는 길에, Nick은 거리에서 펜 하나를 보았다. 그는 그 펜을 주웠다. 그는 생각이 하나 떠올랐다.","\"오늘부터, 너의 새 이름은 'frindle'이야.\"","다음 날, 그는 친구들에게 그의 새로운 단어에 대해 말했다. 그 주의 끝 무렵에는, 그의 학급 친구들 모두가 그 단어를 사용하고 있었다.","\"내가 너의 'frindle'을 빌릴 수 있을까?\"","\"나는 너의 빨간 'frindle'이 예쁘다고 생각해.\"","어느 날 수업이 끝난 후, Granger 선생님은 Nick을 불렀다. 그녀는 \"'frindle'은 진짜 단어가 아니야. 너와 너희 반 친구들은 그것을 사용하는 것을 멈춰야 해.\"라고 말했다. Nick은 \"선생님께서 기분이 좋지 않으신 건 알겠어요. 정말 죄송하지만, 너무 늦었어요. 이제는 모두가 그것을 사용하고 있어요.\"라고 말했다. Granger 선생님은 편지 한 통을 꺼냈다. 그녀는 \"나는 너를 위해 이 편지를 썼단다. 하지만 나는 그것을 네게 오늘 주지 않을 거야. 나는 이 편지를 언젠가 네게 보낼 거야.\"라고 말했다.","다음 날 아침, Granger 선생님은 학급에 \"'frindle'을 사용하는 것을 멈추거라! 'frindle'은 진짜 단어가 아니야.\"라고 말했다. 하지만 점점 더 많은 학생들이 그것을 사용했다. 다른 학교의 학생들이 그것을 사용하기 시작했다. 곧, 전국의 학생들이 그것을 사용하고 있었다.","시간이 흘렀고 Nick은 졸업했다. 그는 'frindle'에 대해 잊었다. 그가 21살이 되었을 때, 그는 Granger 선생님으로부터 소포 하나를 받았다. 그것에는 펜 한 자루와 편지 한 통, 그리고 사전 하나가 있었다. 사전 위에는 쪽지가 하나 있었다.","Frindle"];var DG=[{" 로 두 팀이 경기를 한 것이 맞음.","오답 ✕ — 수지는 'The Spikers. They're my favorite team.'(Spikers야. 그 팀이 내가 가장 좋아하는 팀이야.)라고 했으므로 Flyers의 팬이 아니라서 틀림.","오답 ✕ — Eddie는 'Great.'(좋았어.)라고 했으므로 기분이 좋지 않았다는 보기는 틀림.","오답 ✕ — Eddie는 'I rode my bike in the park.'(나는 공원에서 자전거를 탔어.)라고 했는데, 이 보기는 마당(yard)에서 탔다고 해서 틀림."],"memo":["정답 ②: The Spikers competed with the Flyers last weekend.","근거: The Spikers played the Flyers.(Spikers가 Flyers와 경기했어.)","함정: ③ 수지가 응원한 팀은 Flyers가 아니라 Spikers"],"why":"Spikers와 Flyers가 경기를 했고, 수지는 Spikers를 응원했다."}],"dlg":[["B","Suji, what did you do last weekend?","수지야, 지난 주말에 뭐 했니?"],["G","I went to a volleyball game.","나는 배구 경기에 갔어."],["B","Which teams played?","어느 팀들이 경기했니?"],["G","The Spikers played the Flyers.","Spikers가 Flyers와 경기했어."],["B","Which team did you cheer for?","너는 어느 팀을 응원했니?"],["G","The Spikers. They're my favorite team.","Spikers야. 그 팀이 내가 가장 좋아하는 팀이야."],["B","I see. How was the game?","그렇구나. 경기는 어땠니?"],["G","It was really exciting. The Spikers won. How was your weekend, Eddie?","정말 흥미진진했어. Spikers가 이겼어. Eddie, 너의 주말은 어땠니?"],["B","Great. I rode my bike in the park.","좋았어. 나는 공원에서 자전거를 탔어."],["G","Sounds good.","좋겠다."]]},{"qs":[{"n":3,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["어제 눈이 많이 내렸다.","Kate는 눈으로 덮인 세상이 아름다워 보였다.","지호는 가족과 눈싸움을 하고 눈오리도 만들었다.","Kate는 눈사람을 만들었다.","Kate는 눈오리를 만들기를 원한다."],"a":2,"ans":"지호는 가족과 눈싸움을 하고 눈오리도 만들었다.","evs":[["Of course. I had a snowball fight with my friends.","물론이지. 나는 친구들과 눈싸움을 했어."],["Cool! We made little snow ducks.","멋지다! 우리는 작은 눈오리들을 만들었어."]],"ev":["Of course. I had a snowball fight with my friends.","물론이지. 나는 친구들과 눈싸움을 했어."],"ow":["오답 ✕ — Kate가 'It snowed all day yesterday'(어제 하루 종일 눈이 왔어)라고 했고 지호도 'The snow covered everything.'(눈이 모든 것을 덮었어.)이라고 했으므로 이 보기는 대화와 일치함.","오답 ✕ — Kate가 'It was beautiful.'(아름다웠어.)이라고 했으므로 눈으로 덮인 세상이 아름다워 보였다는 보기는 대화와 일치함.","정답 ○ — 지호는 'I had a snowball fight with my friends.'(나는 친구들과 눈싸움을 했어.)라고 했으므로 가족이 아니라 친구들과 했다. 그래서 대화와 일치하지 않음.","오답 ✕ — Kate가 'I made a snowman with my brother.'(나는 내 남자 형제와 눈사람을 만들었어.)라고 했으므로 이 보기는 대화와 일치함.","오답 ✕ — Kate가 'I want to make snow ducks, too.'(나도 눈오리를 만들고 싶어.)라고 했으므로 이 보기는 대화와 일치함."],"memo":["정답 ③: 지호는 가족과 눈싸움을 했다. (✕ 내용)","근거: I had a snowball fight with my friends.(나는 친구들과 눈싸움을 했어.)","함정: 가족(brother)과 눈사람을 만든 사람은 지호가 아니라 Kate"],"why":"눈싸움은 지호가 친구들과 했고, 눈사람은 Kate가 남자 형제와 만들었다."},{"n":4,"q":"What are Kate and Jiho going to do after the dialogue?","o":["They are going to make a snowman.","They are going to make snow ducks.","They are going to fix the snow duck.","They are going to watch the snowfall.","They are going to have a snowball fight."],"a":1,"ans":"They are going to make snow ducks.","evs":[["Really? I want to make snow ducks, too.","정말? 나도 눈오리를 만들고 싶어."],["Why don't we make them now?","우리 지금 그것들을 만드는 게 어때?"],["Sure. Let's go!","좋아. 가자!"]],"ev":["Really? I want to make snow ducks, too.","정말? 나도 눈오리를 만들고 싶어."],"ow":["오답 ✕ — 눈사람은 Kate가 이미 'I made a snowman with my brother.'(내 남자 형제와 눈사람을 만들었어.)라고 한 과거의 일이어서, 대화 이후에 할 일이 아니라 틀림.","정답 ○ — Kate가 'I want to make snow ducks, too.'(나도 눈오리를 만들고 싶어.)라고 하자 지호가 'Why don't we make them now?'(우리 지금 그것들을 만드는 게 어때?)라고 제안하고, Kate가 'Sure. Let's go!'(좋아. 가자!)라고 했으므로 눈오리를 만들 것임.","오답 ✕ — 눈오리를 '고친다'는 말은 없고, 'We made little snow ducks.'(우리는 작은 눈오리들을 만들었어.)는 지호가 이미 만든 것이라 틀림.","오답 ✕ — 눈이 내리는 것을 구경한다는 말은 없고, 'It snowed all day yesterday'(어제 하루 종일 눈이 왔어)는 어제 일이라 틀림.","오답 ✕ — 눈싸움은 지호가 'I had a snowball fight with my friends.'(친구들과 눈싸움을 했어.)라고 한 과거의 일이라 틀림."],"memo":["정답 ②: 눈오리를 만들 것이다.","근거: Why don't we make them now? - Sure. Let's go!(우리 지금 그것들을 만드는 게 어때? - 좋아. 가자!)","표현: Why don't we ~?(우리 ~하는 게 어때?) = 제안하기"],"why":"Kate가 눈오리를 만들고 싶다고 하자 지호가 지금 만들자고 제안했고 Kate가 승낙했다."}],"dlg":[["Kate","It snowed all day yesterday, Jiho.","어제 하루 종일 눈이 왔어, 지호야."],["Jiho","Yeah, Kate. The snow covered everything.","응, Kate. 눈이 모든 것을 덮었어."],["Kate","It was beautiful. Did you go outside?","아름다웠어. 너는 밖에 나갔었니?"],["Jiho","Of course. I had a snowball fight with my friends.","물론이지. 나는 친구들과 눈싸움을 했어."],["Kate","Sounds exciting. I made a snowman with my brother.","재미있겠다. 나는 내 남자 형제와 눈사람을 만들었어."],["Jiho","Cool! We made little snow ducks.","멋지다! 우리는 작은 눈오리들을 만들었어."],["Kate","Really? I want to make snow ducks, too.","정말? 나도 눈오리를 만들고 싶어."],["Jiho","Why don't we make them now?","우리 지금 그것들을 만드는 게 어때?"],["Kate","Sure. Let's go!","좋아. 가자!"]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["Hana는 지난 주말에 혼자 영화를 봤다.","Hana가 본 영화는 매우 슬펐다.","Hana는 영화를 보면서 많이 웃었다.","남자아이도 Hana와 함께 영화를 봤다.","Hana는 영화가 지루했다고 말했다."],"a":1,"ans":"Hana가 본 영화는 매우 슬펐다.","evs":[["I watched a movie with my sister.","나는 언니(여동생)와 영화를 봤어."],["It was very sad. We cried a lot.","아주 슬펐어. 우리는 많이 울었어."]],"ev":["I watched a movie with my sister.","나는 언니(여동생)와 영화를 봤어."],"ow":["오답 ✕ — Hana는 'I watched a movie with my sister.'(나는 언니(여동생)와 영화를 봤어.)라고 했으므로 혼자가 아니라 자매와 함께 봐서 틀림.","정답 ○ — Hana가 'It was very sad.'(아주 슬펐어.)라고 했으므로 맞음.","오답 ✕ — Hana는 'We cried a lot.'(우리는 많이 울었어.)라고 했는데, 이 보기는 많이 웃었다고 해서 틀림.","오답 ✕ — 함께 영화를 본 사람은 'my sister'(언니(여동생))이고, 남자아이는 영화에 대해 묻기만 해서 틀림.","오답 ✕ — Hana는 영화가 'very sad'(아주 슬펐다)고 했지 지루했다고 하지 않아서 틀림."],"memo":["정답 ②: Hana가 본 영화는 매우 슬펐다.","근거: It was very sad. We cried a lot.(아주 슬펐어. 우리는 많이 울었어.)","표현: How was ~?(~은 어땠니?) - It was ~.(감상 말하기)"],"why":"Hana는 자매와 본 영화가 아주 슬퍼서 많이 울었다고 말한다."}],"dlg":[["B","Hana, what did you do last weekend?","하나야, 지난 주말에 뭐 했니?"],["G","I watched a movie with my sister.","나는 언니(여동생)와 영화를 봤어."],["B","How was the movie?","영화는 어땠니?"],["G","It was very sad. We cried a lot.","아주 슬펐어. 우리는 많이 울었어."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["What's Your Favorite Word?","Words for Students in the Fifth Grade","Do You Want to Make a New Word?","How Do Words Have their Meanings?","How to Memorize Meanings of Words"],"a":3,"ans":"How Do Words Have their Meanings?","evs":[["One day in English class, he asked his teacher, \"How do words get their meanings?","어느 날 영어 시간에, 그는 선생님께 \"단어는 어떻게 의미를 갖게 되나요?"],["Mrs. Granger answered, \"People give meanings to words.\"","Granger 선생님은 \"사람들이
