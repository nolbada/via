word":"specific","r":{"a":"2) 특정한","ev":"8번 문장","s":[[8,"They can read product labels or mail for him, describe photos, or even guide him to a specific place.","그들은 그를 위해 제품 라벨이나 우편물을 읽어 주거나, 사진을 묘사해 주거나, 심지어 그를 특정 장소로 안내해 줄 수도 있다."]],"w":"8번의 a specific place는 ‘어느 한 정해진 장소’. specific = 특정한. 크다거나 멀다는 말은 본문에 없음.","c":2},"h":"8fb03d0ee1"},{"n":6,"t":"ref","q":"What does the underlined \"who\" refer to?\nThis app connects Brian with people who can see through video calls.","ko":"밑줄 친 who가 가리키는 것은?","sko":"이 앱은 영상 통화를 통해 Brian과 볼 수 있는 사람들을 연결해 준다.","pron":"who","opts":["볼 수 있는 사람들","Brian","앱","영상 통화"],"r":{"a":"1) 볼 수 있는 사람들","ev":"5번 문장","s":[[5,"This app connects Brian with people who can see through video calls.","이 앱은 영상 통화를 통해 Brian과 볼 수 있는 사람들을 연결해 준다."]],"w":"5번에서 This app connects Brian with people who can see(이 앱은 Brian을 볼 수 있는 사람들과 연결해 준다). who는 바로 앞의 people을 가리킴. Brian은 앞을 보지 못하는 사람.","c":1,"k":"who = 볼 수 있는 사람들"},"h":"99da8d6366"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, “Be My Eyes” is getting an upgrade.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이제 ‘Be My Eyes’는 업그레이드되고 있다.","opts":["이제 Be My Eyes가 더 좋아지도록 새롭게 개선되고 있다.","이제 Be My Eyes 앱이 사라지고 있다.","이제 Be My Eyes가 값비싼 앱이 되고 있다.","이제 Be My Eyes가 다른 앱에 합쳐지고 있다."],"r":{"a":"1) 이제 Be My Eyes가 더 좋아지도록 새롭게 개선되고 있다.","ev":"9번 문장","s":[[9,"Now, “Be My Eyes” is getting an upgrade.","이제 ‘Be My Eyes’는 업그레이드되고 있다."]],"w":"9번의 getting an upgrade는 업그레이드를 받고 있다, 즉 더 좋게 개선되고 있다는 뜻. 앱이 사라지거나 비싸지거나 합쳐진다는 내용은 본문에 없음.","c":1},"h":"3de38f3a79"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Brian은 지금 모든 것을 또렷하게 볼 수 있다.","자원봉사자들은 사진을 묘사해 줄 수 없다.","Be My Eyes는 자원봉사자 대신 AI를 쓰려고 만들어졌다.","Be My Eyes에는 전 세계에 6백만 명이 넘는 자원봉사자가 있다."],"opts":["Brian can see everything clearly now.","The volunteers cannot describe photos for Brian.","Be My Eyes was made to use AI instead of volunteers.","Be My Eyes has more than 6 million volunteers around the world."],"r":{"a":"4) Be My Eyes has more than 6 million volunteers around the world.","ev":"2번, 6번, 8번, 11번 문장","s":[[2,"He lost most of his sight when he was 13.","그는 13살 때 시력의 대부분을 잃었다."],[6,"It has more than 6 million volunteers all over the world.","그것은 전 세계에 6백만 명 이상의 자원봉사자들을 보유하고 있다."],[8,"They can read product labels or mail for him, describe photos, or even guide him to a specific place.","그들은 그를 위해 제품 라벨이나 우편물을 읽어 주거나, 사진을 묘사해 주거나, 심지어 그를 특정 장소로 안내해 줄 수도 있다."],[11,"AI can do some things better than humans, but the volunteers are still important.","인공 지능은 인간보다 어떤 일들은 더 잘할 수 있지만, 자원봉사자들은 여전히 중요하다."]],"w":"6번에 6백만 명이 넘는 자원봉사자가 있다고 함. Brian은 13살(2번), 자원봉사자는 사진도 묘사함(8번), AI는 새 기능일 뿐 자원봉사자를 대신하지 않음(11번)이라 나머지는 틀림.","c":4},"h":"c8c22ef083"},{"n":9,"t":"sum","q":"This upgrade will hopefully help blind people do even more (A) things and (B) their lives!","ko":"이 업그레이드가 시각장애인들이 훨씬 더 (A) 일들을 해내고 그들의 삶을 (B) 데 도움을 주기를 바란다!","opts":["(A) amazing / (B) improve","(A) amazing / (B) forget","(A) boring / (B) improve","(A) boring / (B) forget","(A) dangerous / (B) hide"],"oko":["(A) 놀라운 / (B) 향상시키는","(A) 놀라운 / (B) 잊는","(A) 지루한 / (B) 향상시키는","(A) 지루한 / (B) 잊는","(A) 위험한 / (B) 숨기는"],"r":{"a":"1) (A) amazing / (B) improve ((A) 놀라운 / (B) 향상시키는)","ev":"12번 문장","s":[[12,"This upgrade will hopefully help blind people do even more amazing things and improve their lives!","이 업그레이드가 시각장애인들이 훨씬 더 놀라운 일들을 해내고 그들의 삶을 향상시키는 데 도움을 주기를 바란다!"]],"w":"12번에서 이 업그레이드가 시각장애인들이 훨씬 더 놀라운 일들을 해내고 삶을 향상시키는 데 도움을 주기를 바란다고 함(even more amazing things and improve their lives). improve는 향상시키다. boring·dangerous나 forget·hide는 본문과 맞지 않음.","c":1},"h":"9a1102ff9b"},{"n":10,"t":"fill","q":"He [A] most of his [B] when he was 13.","ko":"그는 13살 때 [B]의 대부분을 [A].","bank":["lost","sight","blind","tell","outside","safe"],"bko":{"lost":"잃었다(lose의 과거)","sight":"시력","blind":"시각장애가 있는","tell":"알다, 말하다","outside":"밖에","safe":"안전한"},"r":{"a":"[A] lost (잃었다(lose의 과거)), [B] sight (시력)","ev":"2번 문장","s":[[2,"He lost most of his sight when he was 13.","그는 13살 때 시력의 대부분을 잃었다."]],"w":"2번에서 Brian은 13살 때 시력의 대부분을 잃었음(He lost most of his sight when he was 13). lost는 lose(잃다)의 과거형, sight는 시력. blind·tell·outside·safe는 과거형 동사나 이름이 아니라 빈칸에 맞지 않음.","c":null},"h":"b3e00bc91b"}]},{"u":4,"id":"rg2-04-2","no":2,"ko":"향기를 맡으면 안 되는 정원이 있다고?","items":[{"n":1,"t":"tf","q":"The 1st Duke of Northumberland created the Poison Garden in 1750.","ko":"Northumberland의 제1대 공작은 1750년에 Poison Garden을 만들었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번, 8번 문장","s":[[3,"The 1st Duke of Northumberland created the Alnwick Garden in 1750.","Northumberland의 제1대 공작은 1750년에 Alnwick Garden을 만들었다."],[8,"Then in 2005, Jane added a special garden called “the Poison Garden.” It’s filled with over 100 different poisonous plants.","그리고 2005년에, Jane은 ‘Poison Garden’이라고 불리는 특별한 정원을 추가했다. 그 정원은 100종이 넘는 다양한 독성 식물로 가득 차 있다."]],"w":"3번에서 제1대 공작이 1750년에 만든 것은 Alnwick Garden이고, Poison Garden은 8번에서 2005년에 Jane이 추가한 것임.","c":"F"},"h":"2c200be0e1"},{"n":2,"t":"tf","q":"Signs in the Poison Garden warn visitors not to touch or smell anything.","ko":"Poison Garden의 표지판들은 방문객들에게 아무것도 만지거나 냄새를 맡지 말라고 경고한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Signs in the Poison Garden warn visitors not to touch or smell anything.","Poison Garden의 표지판들은 방문객들에게 아무것도 만지거나 냄새를 맡지 말라고 경고한다."]],"w":"10번 문장 그대로임.","c":"T"},"h":"d8349a6a03"},{"n":3,"t":"tf","q":"The Alnwick Garden has only a few visitors because of the dangers.","ko":"위험 때문에 Alnwick Garden에는 방문객이 거의 없다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"But despite the dangers, the Alnwick Garden attracts over 600,000 visitors every year.","하지만 그런 위험에도 불구하고, Alnwick Garden은 매년 600,000명이 넘는 방문객들을 끌어들인다."]],"w":"11번에서 위험에도 불구하고 매년 60만 명이 넘는 방문객이 온다고 함. 방문객이 거의 없다는 말과 반대임.","c":"F"},"h":"e61cbedd07"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Jane Percy … decided to recreate the garden.)","ko":"Jane Percy는 그 정원을 ＿＿＿＿＿ 결정했다.","opts":["팔다","숨기다","되살리다, 다시 만들다","부수다"],"word":"recreate","r":{"a":"3) 되살리다, 다시 만들다","ev":"5~6번 문장","s":[[5,"But over time, the garden was forgotten.","그러나 시간이 지나면서, 그 정원은 잊혔다."],[6,"In 1995, Jane Percy, the 12th Duke’s wife, decided to recreate the garden.","1995년에, 제12대 공작의 아내인 Jane Percy는 그 정원을 되살리기로 결정했다."]],"w":"5번에서 정원이 잊혔고, 6번에서 Jane이 그 정원을 다시 만들기로 결정함. recreate = 되살리다, 다시 만들다.","c":3},"h":"e283f4065d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the Alnwick Garden attracts over 600,000 visitors every year.)","ko":"Alnwick Garden은 매년 600,000명이 넘는 방문객들을 ＿＿＿＿＿.","opts":["쫓아내다","끌어들이다","가르치다","경고하다"],"word":"attracts","r":{"a":"2) 끌어들이다","ev":"11번 문장","s":[[11,"But despite the dangers, the Alnwick Garden attracts over 600,000 visitors every year.","하지만 그런 위험에도 불구하고, Alnwick Garden은 매년 600,000명이 넘는 방문객들을 끌어들인다."]],"w":"11번은 위험한데도 방문객이 매년 60만 명 넘게 온다는 내용. attract = 끌어들이다. 쫓아낸다는 말은 문맥과 반대임.","c":2},"h":"8e0bb3d064"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHowever, don’t stop to smell the flowers in its Poison Garden — they can actually poison you!","ko":"밑줄 친 they가 가리키는 것은?","sko":"그러나, 그곳의 Poison Garden에 있는 꽃들의 냄새를 맡기 위해 멈추지는 마라 — 그것들은 실제로 당신에게 독이 될 수 있다!","opts":["방문객들","공작들","Poison Garden의 꽃들","정원의 표지판들"],"r":{"a":"3) Poison Garden의 꽃들","ev":"2번 문장","s":[[2,"However, don’t stop to smell the flowers in its Poison Garden — they can actually poison you!","그러나, 그곳의 Poison Garden에 있는 꽃들의 냄새를 맡기 위해 멈추지는 마라 — 그것들은 실제로 당신에게 독이 될 수 있다!"]],"w":"2번에서 냄새를 맡지 말라고 한 것은 Poison Garden의 flowers(꽃들)이고, they는 그 꽃들을 가리킴. 독이 될 수 있는 것은 꽃들임.","c":3},"h":"2619a2eb32"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But over time, the garden was forgotten.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 시간이 지나면서, 그 정원은 잊혔다.","opts":["시간이 지나면서 사람들이 그 정원을 잊게 되었다.","시간이 지나면서 그 정원은 더 유명해졌다.","시간이 지나면서 그 정원은 더 커졌다.","시간이 지나면서 그 정원은 다른 나라로 옮겨졌다."],"r":{"a":"1) 시간이 지나면서 사람들이 그 정원을 잊게 되었다.","ev":"5번 문장","s":[[5,"But over time, the garden was forgotten.","그러나 시간이 지나면서, 그 정원은 잊혔다."]],"w":"5번의 over time은 시간이 지나면서, was forgotten은 잊혔다(수동태, forget의 과거분사 forgotten). 정원이 유명해지거나 커지거나 옮겨졌다는 내용은 본문에 없음.","c":1},"h":"67104bbf17"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["The Alnwick Garden was first created in 1995.","The Poison Garden has fewer than ten kinds of plants.","Some of the plants in the Poison Garden are kept in cages.","Jane Percy was the wife of the 1st Duke."],"oko":["Alnwick Garden은 1995년에 처음 만들어졌다.","Poison Garden에는 식물이 열 종도 안 된다.","Poison Garden의 식물들 중 일부는 우리 안에 보관되어 있다.","Jane Percy는 제1대 공작의 아내였다."],"r":{"a":"3) Some of the plants in the Poison Garden are kept in cages. (Poison Garden의 식물들 중 일부는 우리 안에 보관되어 있다.)","ev":"3번, 6번, 8번, 9번 문장","s":[[3,"The 1st Duke of Northumberland created the Alnwick Garden in 1750.","Northumberland의 제1대 공작은 1750년에 Alnwick Garden을 만들었다."],[6,"In 1995, Jane Percy, the 12th Duke’s wife, decided to recreate the garden.","1995년에, 제12대 공작의 아내인 Jane Percy는 그 정원을 되살리기로 결정했다."],[8,"Then in 2005, Jane added a special garden called “the Poison Garden.” It’s filled with over 100 different poisonous plants.","그리고 2005년에, Jane은 ‘Poison Garden’이라고 불리는 특별한 정원을 추가했다. 그 정원은 100종이 넘는 다양한 독성 식물로 가득 차 있다."],[9,"Some of the plants are even kept in cages for safety.","그 식물들 중 일부는 안전을 위해 심지어 우리 안에 보관되어 있다."]],"w":"9번에서 식물들 중 일부는 안전을 위해 우리 안에 보관되어 있음(kept는 keep의 과거분사). Alnwick Garden은 1750년에 만들어졌고(3번), 1995년에는 되살린 것임(6번). Poison Garden에는 100종이 넘는 식물이 있음(8번). Jane은 제12대 공작의 아내(6번).","c":3},"h":"a52ce061ac"},{"n":9,"t":"sum","q":"Jane (A) the garden more (B) than before.","ko":"Jane은 그 정원을 전보다 더 (B) (A).","opts":["(A) made / (B) beautiful","(A) made / (B) ugly","(A) sold / (B) beautiful","(A) sold / (B) ugly","(A) forgot / (B) quiet"],"oko":["(A) 만들었다 / (B) 아름답게","(A) 만들었다 / (B) 못생기게","(A) 팔았다 / (B) 아름답게","(A) 팔았다 / (B) 못생기게","(A) 잊었다 / (B) 조용하게"],"r":{"a":"1) (A) made / (B) beautiful ((A) 만들었다 / (B) 아름답게)","ev":"6~7번 문장","s":[[6,"In 1995, Jane Percy, the 12th Duke’s wife, decided to recreate the garden.","1995년에, 제12대 공작의 아내인 Jane Percy는 그 정원을 되살리기로 결정했다."],[7,"She made it more beautiful than before.","그녀는 그것을 전보다 더 아름답게 만들었다."]],"w":"7번에서 Jane은 정원을 전보다 더 아름답게 만들었음(She made it more beautiful than before). made는 make의 과거형, beautiful은 아름다운. sold·forgot이나 ugly·quiet는 본문과 맞지 않음.","c":1},"h":"932663cfc6"},{"n":10,"t":"fill","q":"Jane hopes the garden will [A] people about the good and bad [B] of plants.","ko":"Jane은 그 정원이 사람들에게 식물의 좋고 나쁜 [B]에 대해 [A] 바란다.","bko":{"teach":"가르쳐 주기를","effect":"영향","forget":"잊다","danger":"위험","visit":"방문하다","safety":"안전"},"bank":["teach","effect","forget","danger","visit","safety"],"r":{"a":"[A] teach (가르쳐 주기를), [B] effect (영향)","ev":"12번 문장","s":[[12,"Jane hopes the garden will teach people about the good and bad effect of plants.","Jane은 그 정원이 사람들에게 식물의 좋은 영향과 나쁜 영향에 대해 가르쳐 주기를 바란다."]],"w":"12번 Jane hopes the garden will teach people about the good and bad effect of plants에서 가져옴. forget(잊다), visit(방문하다)은 ‘사람들에게 ~에 대해 …하다’ 자리에 맞지 않고, danger(위험), safety(안전)는 good and bad(좋고 나쁜)와 어울리지 않음.","c":null},"h":"507555e450"}]},{"u":4,"id":"rg2-04-3","no":3,"ko":"안경 쓴 아이가 디즈니를 움직인 편지?","items":[{"n":1,"t":"tf","q":"Lowri’s mom wrote a letter to the Unicode Consortium.","ko":"Lowri의 엄마가 유니코드 협회에 편지를 썼다.","r":{"a":"F (본문과 다른 내용)","ev":"4번, 10번 문장","s":[[4,"My mom shared my letter on Facebook and lots of people liked it.","저희 엄마는 페이스북에 제 편지를 공유했고, 많은 사람들이 그것을 좋아해 주었어요."],[10,"So, I wrote a letter to the Unicode Consortium to ask for more emojis with glasses.","그래서 저는 유니코드 협회에 안경을 쓴 이모티콘을 더 많이 만들어 달라고 요청하기 위해 편지를 썼어요."]],"w":"10번에서 유니코드 협회에 편지를 쓴 사람은 Lowri(I wrote a letter)임. 엄마는 4번에서 Lowri의 편지를 페이스북에 공유했을 뿐임.","c":"F"},"h":"71e5276b1e"},{"n":2,"t":"tf","q":"Disney created the character Mirabel in the movie Encanto.","ko":"디즈니는 영화 Encanto에서 Mirabel이라는 캐릭터를 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Thankfully, Disney listened and created the character, Mirabel in the movie Encanto.","고맙게도, 디즈니는 제 얘기를 듣고 영화 「Encanto」의 Mirabel이라는 캐릭터를 만들어 냈어요."]],"w":"5번 문장 그대로. 디즈니가 Lowri의 얘기를 듣고 안경을 쓴 캐릭터를 만들어 냈다고 함.","c":"T"},"h":"28e183a66a"},{"n":3,"t":"tf","q":"There were many emojis with glasses that looked like Lowri.","ko":"Lowri와 닮은, 안경을 쓴 이모티콘이 많이 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"There were few emojis with glasses, and they didn’t look like me.","안경을 쓴 이모티콘은 거의 없었고, 그것들은 저와 닮아 보이지 않았어요."]],"w":"9번에서 안경을 쓴 이모티콘은 few(거의 없었다)이고, 그것들도 Lowri와 닮아 보이지 않았다고 함.","c":"F"},"h":"a754c80002"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (I also started a campaign called #GlassesOn.)","ko":"저는 또한 #GlassesOn이라는 ＿＿＿＿＿을 시작했어요.","opts":["여행","시합","캠페인, 사회적 운동","상품"],"word":"campaign","r":{"a":"3) 캠페인, 사회적 운동","ev":"7~8번, 10번 문장","s":[[7,"I also started a campaign called #GlassesOn.","저는 또한 #GlassesOn이라는 캠페인을 시작했어요."],[8,"The idea started when my mom was looking for an emoji for me.","그 아이디어는 저희 엄마가 저를 위한 이모티콘을 찾고 있었을 때 시작되었어요."],[10,"So, I wrote a letter to the Unicode Consortium to ask for more emojis with glasses.","그래서 저는 유니코드 협회에 안경을 쓴 이모티콘을 더 많이 만들어 달라고 요청하기 위해 편지를 썼어요."]],"w":"7번에서 #GlassesOn이라는 campaign을 시작했다고 하고, 8~10번에서 이모티콘을 늘려 달라고 편지를 쓴 활동을 함. 여러 사람이 함께하는 활동이라 campaign은 캠페인, 사회적 운동.","c":3},"h":"e6e5930a05"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (There were few emojis with glasses…)","ko":"안경을 쓴 이모티콘은 ＿＿＿＿＿＿ 있었다…","opts":["아주 많은","거의 없는","아주 큰","새로운"],"word":"few","r":{"a":"2) 거의 없는","ev":"9~10번 문장","s":[[9,"There were few emojis with glasses, and they didn’t look like me.","안경을 쓴 이모티콘은 거의 없었고, 그것들은 저와 닮아 보이지 않았어요."],[10,"So, I wrote a letter to the Unicode Consortium to ask for more emojis with glasses.","그래서 저는 유니코드 협회에 안경을 쓴 이모티콘을 더 많이 만들어 달라고 요청하기 위해 편지를 썼어요."]],"w":"9번의 few는 ‘거의 없는’. 그래서(So) 10번에서 유니코드 협회에 더 만들어 달라고 요청한 것임. 많다는 뜻이면 요청할 이유가 없음.","c":2},"h":"f22ba5f878"},{"n":6,"t":"ref","q":"What does the underlined \"we\" refer to?\nMany people agree with me now, and we’ll keep trying!","ko":"밑줄 친 we가 가리키는 것은?","sko":"이제 많은 사람들이 제 의견에 동의하며, 우리는 계속 노력할 거예요!","pron":"we","opts":["Lowri와 그녀에게 동의하는 사람들","디즈니 직원들","구글 직원들","영화 속 인물들"],"r":{"a":"1) Lowri와 그녀에게 동의하는 사람들","ev":"12번 문장","s":[[12,"Many people agree with me now, and we’ll keep trying!","이제 많은 사람들이 제 의견에 동의하며, 우리는 계속 노력할 거예요!"]],"w":"12번에서 Many people agree with me now, and we’ll keep trying!이라고 했으니 we는 me(Lowri)와 그에 동의하는 많은 사람들.","c":1,"k":"we = Lowri와 그녀에게 동의하는 사람들"},"h":"871c24c662"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The idea started when my mom was looking for an emoji for me.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 아이디어는 저희 엄마가 저를 위한 이모티콘을 찾고 있었을 때 시작되었어요.","opts":["이모티콘을 먼저 만든 뒤에 엄마가 이 아이디어를 떠올렸다.","엄마가 Lowri에게 줄 이모티콘을 찾고 있을 때 이 아이디어가 시작되었다.","엄마가 이모티콘 회사에서 일하다가 이 아이디어가 시작되었다.","Lowri가 엄마에게 이모티콘을 사 달라고 해서 이 아이디어가 시작되었다."],"r":{"a":"2) 엄마가 Lowri에게 줄 이모티콘을 찾고 있을 때 이 아이디어가 시작되었다.","ev":"8번 문장","s":[[8,"The idea started when my mom was looking for an emoji for me.","그 아이디어는 저희 엄마가 저를 위한 이모티콘을 찾고 있었을 때 시작되었어요."]],"w":"The idea started when my mom was looking for an emoji for me는 ‘엄마가 나를 위한 이모티콘을 찾고 있을 때 아이디어가 시작되었다’는 뜻. 회사 이야기나 사 달라는 이야기는 본문에 없음.","c":2},"h":"8c8a87ba72"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Lowri also sent a letter to big tech companies like Google.","Disney refused to make a character with glasses.","Lowri sent letters only to Google.","Lowri is the director of the movie Encanto."],"oko":["Lowri는 구글 같은 첨단 기술 대기업에도 편지를 보냈다.","디즈니는 안경을 쓴 캐릭터를 만들기를 거절했다.","Lowri는 구글에만 편지를 보냈다.","Lowri는 영화 Encanto의 감독이다."],"r":{"a":"1) Lowri also sent a letter to big tech companies like Google. (Lowri는 구글 같은 첨단 기술 대기업에도 편지를 보냈다.)","ev":"5번, 11번 문장","s":[[5,"Thankfully, Disney listened and created the character, Mirabel in the movie Encanto.","고맙게도, 디즈니는 제 얘기를 듣고 영화 「Encanto」의 Mirabel이라는 캐릭터를 만들어 냈어요."],[11,"I also sent a letter to big tech companies like Google.","저는 구글과 같은 첨단 기술 대기업에도 편지를 보냈어요."]],"w":"11번에서 Lowri는 구글 같은 대기업에도 편지를 보냈음(sent는 send의 과거형). 구글에만 보낸 것은 아님. 디즈니는 안경을 쓴 캐릭터를 만들었으므로(5번) 거절하지 않았고, Lowri가 영화 감독이라는 내용은 없음.","c":1},"h":"521628768f"},{"n":9,"t":"sum","q":"Lowri wears glasses and believes we need more good (A) with glasses in movies and TV (B).","ko":"Lowri는 안경을 쓰고, 영화와 TV (B)에 안경을 쓴 좋은 (A)이(가) 더 많이 필요하다고 믿는다.","opts":["(A) role models / (B) shows","(A) role models / (B) rules","(A) teachers / (B) shows","(A) teachers / (B) rules","(A) rooms / (B) names"],"oko":["(A) 롤 모델 / (B) 쇼","(A) 롤 모델 / (B) 규칙","(A) 선생님 / (B) 쇼","(A) 선생님 / (B) 규칙","(A) 방 / (B) 이름"],"r":{"a":"1) (A) role models / (B) shows ((A) 롤 모델 / (B) 쇼)","ev":"2번 문장","s":[[2,"I wear glasses and believe we need more good role models with glasses in movies and TV shows.","저는 안경을 쓰고, 영화와 TV 쇼에 안경을 쓴 좋은 롤 모델이 더 많이 필요하다고 믿어요."]],"w":"2번에서 Lowri는 영화와 TV 쇼에 안경을 쓴 좋은 롤 모델이 더 필요하다고 믿음(role models, TV shows). teachers(선생님)·rooms(방)·rules(규칙)·names(이름)는 본문과 맞지 않음.","c":1},"h":"029b253344"},{"n":10,"t":"fill","q":"The movie was a [A] [B]!","ko":"그 영화는 [A] [B]을(를) 거두었어요!","bank":["huge","letters","success","agree","emojis","wear"],"bko":{"huge":"큰","letters":"편지들","success":"성공","agree":"동의하다","emojis":"이모티콘들","wear":"입다, 쓰다"},"r":{"a":"[A] huge (큰), [B] success (성공)","ev":"6번 문장","s":[[6,"The movie was a huge success!","그 영화는 큰 성공을 거두었어요!"]],"w":"6번에서 그 영화는 큰 성공이었음(The movie was a huge success!). huge는 큰, success는 성공. a 뒤에는 단수 명사가 오므로 복수형 letters·emojis는 맞지 않고, agree·wear는 동사라 이 자리에 올 수 없음.","c":null},"h":"49a487807b"}]},{"u":5,"id":"rg2-05-1","no":1,"ko":"멸종 위기에서 벗어난 귀여운 새의 비결은?","items":[{"n":1,"t":"tf","q":"Puffins are afraid of people.","ko":"퍼핀은 사람들을 무서워한다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Puffins are very friendly, so they aren’t afraid of people.","퍼핀은 매우 호의적이어서 사람들을 무서워하지 않는다."]],"w":"2번에서 퍼핀은 매우 friendly해서 사람들을 무서워하지 않는다(aren’t afraid of people)고 함.","c":"F"},"h":"1cc45ec2a5"},{"n":2,"t":"tf","q":"Steve Kress used fake puffins because he thought the real puffins might see them as friends.","ko":"Steve Kress는 진짜 퍼핀들이 가짜 퍼핀을 친구로 볼지도 모른다고 생각해서 가짜 퍼핀을 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"He also used fake puffins because he thought the real puffins might see them as friends.","그는 가짜 퍼핀도 사용했는데, 진짜 퍼핀들이 그것들을 친구로 볼지도 모른다고 생각했기 때문이다."]],"w":"8번 문장 그대로임.","c":"T"},"h":"c5b93f273f"},{"n":3,"t":"tf","q":"The number of tourists in the U.K. increased during the COVID-19 pandemic.","ko":"코로나19 대유행 동안 영국에서 관광객의 수가 늘었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"During the COVID-19 pandemic in the U.K., there were fewer tourists.","코로나19 대유행 동안 영국에서는 관광객이 더 적었다."]],"w":"11번에서 영국에는 fewer tourists(더 적은 관광객)가 있었다고 함. 늘었다는 말과 반대임.","c":"F"},"h":"dccec6dd77"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But puffins were once an endangered species.)","ko":"하지만 퍼핀은 한때 ＿＿＿＿＿＿ 종이었다.","opts":["번성한","멸종 위기에 처한","유명한","귀여운"],"word":"endangered","r":{"a":"2) 멸종 위기에 처한","ev":"4~5번 문장","s":[[4,"But puffins were once an endangered species.","하지만 퍼핀은 한때 멸종 위기종이었다."],[5,"The Earth and the ocean are getting warmer, and this put puffins in danger.","지구와 바다가 점점 더 따뜻해지고 있고, 이것이 퍼핀을 위험에 빠뜨렸다."]],"w":"4번의 endangered species는 ‘멸종 위기에 처한 종’. 5번에서 지구와 바다가 따뜻해져 퍼핀이 위험에 빠졌다고 해서 위기라는 뜻이 맞음. 번성했다면 위험이 아님.","c":2},"h":"2158dcc6b4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He also used fake puffins because he thought the real puffins might see them as friends.)","ko":"그는 ＿＿＿ 퍼핀도 사용했는데, 진짜 퍼핀들이 그것들을 친구로 볼지도 모른다고 생각했기 때문이다.","opts":["가짜의","진짜의","야생의","아기의"],"word":"fake","r":{"a":"1) 가짜의","ev":"8번 문장","s":[[8,"He also used fake puffins because he thought the real puffins might see them as friends.","그는 가짜 퍼핀도 사용했는데, 진짜 퍼핀들이 그것들을 친구로 볼지도 모른다고 생각했기 때문이다."]],"w":"8번에서 fake puffins와 the real puffins가 대조됨. real(진짜의)의 반대인 fake는 ‘가짜의’.","c":1},"h":"3d54ea0c17"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nHe made a better home for them in nature.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그는 자연에 그들을 위한 더 나은 보금자리를 만들어 주었다.","pron":"them","opts":["관광객들","다른 바닷새들","사람들","퍼핀들"],"r":{"a":"4) 퍼핀들","ev":"6~7번 문장","s":[[6,"A man named Steve Kress from Maine, the U.S., wanted to help puffins.","미국 메인주 출신의 Steve Kress라는 남자는 퍼핀들을 돕고 싶었다."],[7,"He made a better home for them in nature.","그는 자연에 그들을 위한 더 나은 보금자리를 만들어 주었다."]],"w":"6번에서 Steve Kress가 퍼핀들을 돕고 싶어 했고(wanted to help puffins), 7번에서 그들을 위한 더 나은 보금자리를 만들어 주었음. 7번의 them은 6번의 puffins.","c":4,"k":"them = 퍼핀들"},"h":"9e82451508"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Earth and the ocean are getting warmer, and this put puffins in danger.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"지구와 바다가 점점 더 따뜻해지고 있고, 이것이 퍼핀을 위험에 빠뜨렸다.","opts":["퍼핀 때문에 지구와 바다가 더 위험해졌다.","지구와 바다가 점점 차가워지면서 퍼핀이 위험에 빠졌다.","지구와 바다가 점점 따뜻해지면서 퍼핀이 위험에 빠졌다.","퍼핀이 바다를 따뜻하게 만들어서 위험에 빠졌다."],"r":{"a":"3) 지구와 바다가 점점 따뜻해지면서 퍼핀이 위험에 빠졌다.","ev":"5번 문장","s":[[5,"The Earth and the ocean are getting warmer, and this put puffins in danger.","지구와 바다가 점점 더 따뜻해지고 있고, 이것이 퍼핀을 위험에 빠뜨렸다."]],"w":"are getting warmer는 ‘점점 더 따뜻해지고 있다’이고, this put puffins in danger는 ‘이것이 퍼핀을 위험에 빠뜨렸다’는 뜻. 원인은 지구와 바다의 온도 상승임.","c":3},"h":"c282d0c324"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Puffins live near the ocean only in the South Atlantic.","There are more puffins now than before.","Steve Kress is from the U.K.","There are fewer puffins now than before."],"oko":["퍼핀은 남대서양 바다 근처에서만 산다.","지금은 전보다 퍼핀이 더 많다.","Steve Kress는 영국 출신이다.","지금은 전보다 퍼핀이 더 적다."],"r":{"a":"2) There are more puffins now than before. (지금은 전보다 퍼핀이 더 많다.)","ev":"1번, 6번, 10번 문장","s":[[1,"Puffins are cute birds living near the ocean in the North Atlantic.","퍼핀은 북대서양의 바다 근처에 사는 귀여운 새이다."],[6,"A man named Steve Kress from Maine, the U.S., wanted to help puffins.","미국 메인주 출신의 Steve Kress라는 남자는 퍼핀들을 돕고 싶었다."],[10,"Now, there are more puffins than before.","이제, 전보다 더 많은 퍼핀들이 있다."]],"w":"10번에서 이제 전보다 더 많은 퍼핀들이 있다고 함(there are more puffins than before). 퍼핀은 남대서양이 아니라 북대서양 근처에 삶(1번). Steve Kress는 영국이 아니라 미국 출신(6번). 지금 퍼핀이 더 적다는 말은 반대.","c":2},"h":"66f367e9e3"},{"n":9,"t":"sum","q":"This (A) helped puffins (B) in the area.","ko":"이 (A)이(가) 퍼핀들이 그 지역에 (B) 데 도움이 되었다.","opts":["(A) effort / (B) stay","(A) effort / (B) leave","(A) accident / (B) stay","(A) accident / (B) leave","(A) fence / (B) sleep"],"oko":["(A) 노력 / (B) 머무르는","(A) 노력 / (B) 떠나는","(A) 사고 / (B) 머무르는","(A) 사고 / (B) 떠나는","(A) 울타리 / (B) 잠자는"],"r":{"a":"1) (A) effort / (B) stay ((A) 노력 / (B) 머무르는)","ev":"9번 문장","s":[[9,"This effort could help puffins stay in the area.","이런 노력이 퍼핀들이 그 지역에 머무르도록 도울 수 있었다."]],"w":"9번에서 이런 노력이 퍼핀들이 그 지역에 머무르도록 도울 수 있었음(This effort could help puffins stay in the area). effort는 노력, stay는 머무르다. accident·fence나 leave·sleep는 본문과 맞지 않음.","c":1},"h":"a99c0fc341"},{"n":10,"t":"fill","q":"So the puffins [A] have more [B].","ko":"그래서 퍼핀들은 더 많은 [B]을(를) 낳을 [A].","bank":["friendly","could","babies","warmer","tiny","afraid"],"bko":{"friendly":"호의적인","could":"수 있었다","babies":"새끼들","warmer":"더 따뜻한","tiny":"아주 작은","afraid":"무서워하는"},"r":{"a":"[A] could (수 있었다), [B] babies (새끼들)","ev":"12번 문장","s":[[12,"So the puffins could have more babies.","그래서 퍼핀들은 더 많은 새끼를 낳을 수 있었다."]],"w":"12번에서 퍼핀들은 더 많은 새끼를 낳을 수 있었음(the puffins could have more babies). could는 ~할 수 있었다, babies는 baby(새끼)의 복수형. friendly·warmer·tiny·afraid는 꾸며 주는 말이라 have 앞의 조동사 자리나 more 뒤의 이름 자리에 맞지 않음.","c":null},"h":"34ffe79132"}]},{"u":5,"id":"rg2-05-2","no":2,"ko":"영화 같은 소행성 충돌, 현실에서 막을 수 있을까?","items":[{"n":1,"t":"tf","q":"The DART experiment was done in 2002.","ko":"DART 실험은 2002년에 했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In 2022, NASA did an experiment called DART.","2022년에, NASA는 DART라고 불리는 실험을 했다."]],"w":"4번에서 NASA가 DART 실험을 한 해는 2022년임. 2002년이 아님.","c":"F"},"h":"877604f1b7"},{"n":2,"t":"tf","q":"The spaceship followed Dimorphos for 10 months.","ko":"우주선은 Dimorphos를 10개월 동안 따라다녔다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The spaceship followed an asteroid named Dimorphos for 10 months.","그 우주선은 Dimorphos라는 이름의 소행성을 10개월 동안 따라다녔다."]],"w":"7번 문장 그대로. 우주선이 Dimorphos라는 소행성을 10개월 동안 따라다녔다고 함.","c":"T"},"h":"f6625fb6f1"},{"n":3,"t":"tf","q":"Scientists say the chance of an asteroid hitting the Earth is very high right now.","ko":"과학자들은 지금 소행성이 지구에 충돌할 가능성이 매우 높다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Scientists say that right now, the chance of an asteroid hitting the Earth is very low.","과학자들은 소행성이 지구에 충돌할 가능성이 지금 당장은 매우 낮다고 말한다."]],"w":"10번에서 과학자들은 지금 충돌 가능성이 매우 낮다(very low)고 함. 높다는 말과 반대임.","c":"F"},"h":"7330bf3bb7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…it crashed into Dimorphos very fast and changed its path.)","ko":"…그것은 Dimorphos와 매우 빠르게 충돌했고 그 소행성의 ＿＿＿＿을(를) 바꿨다.","opts":["경로","속도","색깔","크기"],"word":"path","r":{"a":"1) 경로","ev":"5번, 8~9번 문장","s":[[5,"NASA wanted to see if hitting an asteroid could change its path.","NASA는 소행성에 충돌해 그 궤도를 바꿀 수 있는지 알아보고 싶었다."],[8,"When the spaceship had the opportunity, it crashed into Dimorphos very fast and changed its path.","우주선이 기회를 얻었을 때, 그것은 Dimorphos와 매우 빠르게 충돌했고, 그 소행성의 경로를 바꿨다."],[9,"NASA successfully changed the orbit of an asteroid!","NASA는 성공적으로 한 소행성의 궤도를 바꾸었다!"]],"w":"5번에서 NASA가 알아보려던 것은 충돌로 path를 바꿀 수 있는지이고, 9번에서는 같은 뜻으로 orbit(궤도)을 바꿨다고 함. path = 길, 경로.","c":1},"h":"e516600488"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When the spaceship had the opportunity, it crashed into Dimorphos…)","ko":"우주선이 ＿＿＿＿ 얻었을 때, 그것은 Dimorphos와 충돌했다…","opts":["위험","기회","질문","문제"],"word":"opportunity","r":{"a":"2) 기회","ev":"8번 문장","s":[[8,"When the spaceship had the opportunity, it crashed into Dimorphos very fast and changed its path.","우주선이 기회를 얻었을 때, 그것은 Dimorphos와 매우 빠르게 충돌했고, 그 소행성의 경로를 바꿨다."]],"w":"8번에서 우주선이 오랫동안 따라가다(7번) 충돌할 수 있는 때가 왔다는 뜻. opportunity = 기회.","c":2},"h":"4b9f49bf79"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHowever, they are still studying asteroids.","ko":"밑줄 친 they가 가리키는 것은?","sko":"하지만, 그들은 여전히 소행성을 연구하고 있다.","pron":"they","opts":["과학자들","소행성들","영화 제작자들","우주선들"],"r":{"a":"1) 과학자들","ev":"10~11번 문장","s":[[10,"Scientists say that right now, the chance of an asteroid hitting the Earth is very low.","과학자들은 소행성이 지구에 충돌할 가능성이 지금 당장은 매우 낮다고 말한다."],[11,"However, they are still studying asteroids.","하지만, 그들은 여전히 소행성을 연구하고 있다."]],"w":"10번에서 Scientists say(과학자들이 말한다)라고 했고, 11번의 they are still studying asteroids(그들은 여전히 소행성을 연구하고 있다)는 그 과학자들. 소행성은 연구의 대상이지 연구하는 쪽이 아님.","c":1,"k":"they = 과학자들"},"h":"dfd53662f4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They want to be ready for asteroids, even if nothing is likely to happen!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아무 일도 일어나지 않을 것 같아도 그들은 소행성에 대비하기를 원한다!","opts":["아무 일도 일어날 것 같지 않아도 그들은 소행성에 대비하고 싶어 한다.","아무 일도 일어나지 않을 것이므로 그들은 소행성 연구를 멈추고 싶어 한다.","소행성이 곧 지구에 떨어질 것이므로 그들은 서둘러 대피하고 싶어 한다.","그들은 소행성이 영화에서만 일어나는 일이라고 생각한다."],"r":{"a":"1) 아무 일도 일어날 것 같지 않아도 그들은 소행성에 대비하고 싶어 한다.","ev":"12번 문장","s":[[12,"They want to be ready for asteroids, even if nothing is likely to happen!","아무 일도 일어나지 않을 것 같아도 그들은 소행성에 대비하기를 원한다!"]],"w":"12번의 even if nothing is likely to happen은 아무 일도 일어날 것 같지 않더라도라는 뜻이고, be ready for는 ~에 대비하다. 연구를 멈추거나 대피하려는 내용은 본문에 없음.","c":1},"h":"b0a7877dbd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["NASA는 카메라가 달린 우주선을 우주로 보냈다.","우주선은 Dimorphos와 멀리 떨어져 있었다.","실험의 목적은 소행성이 지구에 충돌하는 것을 지켜보는 것이었다.","과학자들은 소행성 연구를 그만두었다."],"opts":["NASA sent a spaceship with a camera into space.","The spaceship stayed far away from Dimorphos.","The goal of the experiment was to watch an asteroid hit the Earth.","Scientists have stopped studying asteroids."],"r":{"a":"1) NASA sent a spaceship with a camera into space.","ev":"5~7번, 11번 문장","s":[[5,"NASA wanted to see if hitting an asteroid could change its path.","NASA는 소행성에 충돌해 그 궤도를 바꿀 수 있는지 알아보고 싶었다."],[6,"So they built a spaceship with a camera and sent it into space.","그래서 그들은 카메라가 달린 우주선을 만들어 우주로 보냈다."],[7,"The spaceship followed an asteroid named Dimorphos for 10 months.","그 우주선은 Dimorphos라는 이름의 소행성을 10개월 동안 따라다녔다."],[11,"However, they are still studying asteroids.","하지만, 그들은 여전히 소행성을 연구하고 있다."]],"w":"6번에서 카메라가 달린 우주선을 우주로 보냈다고 함. 우주선은 Dimorphos를 따라가 충돌했고(7~8번), 실험 목적은 궤도 변경(5번), 과학자들은 여전히 연구함(11번)이라 나머지는 틀림.","c":1},"h":"ffc19de0f2"},{"n":9,"t":"sum","q":"Asteroids hitting the Earth is a (A) story in (B).","ko":"지구에 충돌하는 소행성은 (B)에서 (A) 이야기이다.","opts":["(A) common / (B) movies","(A) common / (B) zoos","(A) rare / (B) movies","(A) rare / (B) zoos","(A) funny / (B) schools"],"oko":["(A) 흔한 / (B) 영화","(A) 흔한 / (B) 동물원","(A) 드문 / (B) 영화","(A) 드문 / (B) 동물원","(A) 웃기는 / (B) 학교"],"r":{"a":"1) (A) common / (B) movies ((A) 흔한 / (B) 영화)","ev":"1번 문장","s":[[1,"Asteroids hitting the Earth is a common story in movies.","지구에 충돌하는 소행성은 영화에서 흔한 이야기이다."]],"w":"1번에서 소행성이 지구에 충돌하는 이야기는 영화에서 흔한 이야기라고 함(a common story in movies). common은 흔한, rare는 드문이라 반대. zoos·schools는 본문과 맞지 않음.","c":1},"h":"3559ab5a33"},{"n":10,"t":"fill","q":"Many people [A] about this at least [B].","ko":"많은 사람들이 이것에 대해 적어도 [B]은(는) [A].","bank":["think","once","story","camera","zoos","chance"],"bko":{"think":"생각해 본다","once":"한 번","story":"이야기","camera":"카메라","zoos":"동물원들","chance":"가능성"},"r":{"a":"[A] think (생각해 본다), [B] once (한 번)","ev":"2번 문장","s":[[2,"Many people think about this at least once.","많은 사람들이 이것에 대해 적어도 한 번은 생각해 본다."]],"w":"2번에서 많은 사람들이 이것에 대해 적어도 한 번은 생각해 본다고 함(Many people think about this at least once). think는 생각하다, once는 한 번. story·camera·zoos·chance는 이름을 나타내는 말이라 동사 자리와 at least 뒤에 맞지 않음.","c":null},"h":"68285be178"}]},{"u":5,"id":"rg2-05-3","no":3,"ko":"미끄러운 기둥, 혼자서는 절대 못 오르는 이유?","items":[{"n":1,"t":"tf","q":"Panjat Pinang takes place every January 1st.","ko":"Panjat Pinang은 매년 1월 1일에 열린다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"This game takes place every August 17th, and it was started to celebrate Indonesia’s independence from the Netherlands.","이 게임은 매년 8월 17일에 열리며, 네덜란드로부터의 인도네시아 독립을 기념하기 위해 시작되었다."]],"w":"2번에서 이 게임은 매년 8월 17일에 열린다고 함. 1월 1일이 아님.","c":"F"},"h":"2a544e2fda"},{"n":2,"t":"tf","q":"Friends and family form teams and help each other climb.","ko":"친구들과 가족들은 팀을 이루어 서로 올라가는 것을 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They form teams and help each other climb.","그들은 팀을 이루어 서로 올라가는 것을 돕는다."]],"w":"6번 문장 그대로. 혼자서는 못 올라가니 팀을 이루어 서로 도움.","c":"T"},"h":"2fad217188"},{"n":3,"t":"tf","q":"At the top of the poles, there are only bags of sugar.","ko":"기둥의 꼭대기에는 설탕 봉지만 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"At the top of the poles, there are prizes like bicycles, electronics, and bags of sugar.","기둥의 꼭대기에는 자전거, 전자제품, 그리고 설탕 봉지와 같은 상품들이 있다."]],"w":"7번에서 꼭대기에는 자전거, 전자제품, 설탕 봉지가 있다고 함. 설탕 봉지만 있다는 말은 틀림.","c":"F"},"h":"69b09eb224"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the poles are really slippery and tall…)","ko":"…그 기둥들은 정말 ＿＿＿＿＿ 높아서…","opts":["미끄러운","부드러운","무거운","뜨거운"],"word":"slippery","r":{"a":"1) 미끄러운","ev":"4번 문장","s":[[4,"However, the poles are really slippery and tall, so it’s not possible to climb them alone.","그러나, 그 기둥들은 매우 미끄럽고 높아서, 그것들을 혼자 올라가는 것은 가능하지 않다."]],"w":"4번에서 기름을 바른 기둥(3번)이라 slippery해서 혼자 올라갈 수 없다고 함. slippery = 미끄러운.","c":1},"h":"2521b16ad5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Panjat Pinang teaches people the importance of teamwork and cooperation.)","ko":"Panjat Pinang은 사람들에게 팀워크와 ＿＿＿＿의 중요성을 가르친다.","opts":["경쟁","협동, 협력","휴식","실수"],"word":"cooperation","r":{"a":"2) 협동, 협력","ev":"5~6번, 10번 문장","s":[[5,"Friends and family need to work together.","친구들과 가족들은 함께 협력해야 한다."],[6,"They form teams and help each other climb.","그들은 팀을 이루어 서로 올라가는 것을 돕는다."],[10,"Panjat Pinang teaches people the importance of teamwork and cooperation.","Panjat Pinang은 사람들에게 팀워크와 협동의 중요성을 가르친다."]],"w":"5~6번에서 친구와 가족이 함께 work together하고 서로 돕는다고 함. 10번의 teamwork and cooperation은 함께 힘을 모으는 일. cooperation = 협동, 협력.","c":2},"h":"07d3cc2e8d"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nWomen and children cheer for their friends and family.","ko":"밑줄 친 their가 가리키는 것은?","sko":"여성들과 아이들은 그들의 친구들과 가족들을 응원한다.","pron":"their","opts":["여성들과 아이들","기둥들","상품들","선수 코치들"],"r":{"a":"1) 여성들과 아이들","ev":"8번 문장","s":[[8,"Women and children cheer for their friends and family.","여성들과 아이들은 그들의 친구들과 가족들을 응원한다."]],"w":"8번에서 Women and children cheer for their friends and family(여성들과 아이들은 그들의 친구들과 가족들을 응원한다). their는 문장의 주어인 여성들과 아이들을 가리킴.","c":1,"k":"their = 여성들과 아이들"},"h":"77802b068b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s exciting to see who will get the prizes first.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"누가 상품을 먼저 얻을지 지켜보는 것은 신나는 일이다.","opts":["상품을 먼저 얻은 사람을 보는 일은 지루하다.","누가 상품을 만들었는지 알아내는 일은 신난다.","누가 상품을 먼저 얻을지 지켜보는 것은 신나는 일이다.","상품을 먼저 얻으려고 싸우는 일은 신난다."],"r":{"a":"3) 누가 상품을 먼저 얻을지 지켜보는 것은 신나는 일이다.","ev":"9번 문장","s":[[9,"It’s exciting to see who will get the prizes first.","누가 상품을 먼저 얻을지 지켜보는 것은 신나는 일이다."]],"w":"It’s exciting to see who will get the prizes first는 ‘누가 상품을 먼저 얻을지 지켜보는 것은 신난다’는 뜻. It은 가짜 주어이고 진짜 주어는 to see 이하.","c":3},"h":"d7c3fe4d1c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Women and children climb the poles first.","The game was started by a king for his birthday.","The prizes at the top are fruits and flowers.","In Indonesia, there is a unique game called Panjat Pinang."],"oko":["여성들과 아이들이 기둥을 가장 먼저 올라간다.","이 게임은 왕의 생일을 위해 시작되었다.","꼭대기의 상품은 과일과 꽃이다.","인도네시아에는 Panjat Pinang이라고 불리는 독특한 게임이 있다."],"r":{"a":"4) In Indonesia, there is a unique game called Panjat Pinang. (인도네시아에는 Panjat Pinang이라고 불리는 독특한 게임이 있다.)","ev":"1번, 2번, 7번, 8번 문장","s":[[1,"In Indonesia, there is a unique game known as Panjat Pinang.","인도네시아에는 Panjat Pinang이라고 알려진 독특한 게임이 있다."],[2,"This game takes place every August 17th, and it was started to celebrate Indonesia’s independence from the Netherlands.","이 게임은 매년 8월 17일에 열리며, 네덜란드로부터의 인도네시아 독립을 기념하기 위해 시작되었다."],[7,"At the top of the poles, there are prizes like bicycles, electronics, and bags of sugar.","기둥의 꼭대기에는 자전거, 전자제품, 그리고 설탕 봉지와 같은 상품들이 있다."],[8,"Women and children cheer for their friends and family.","여성들과 아이들은 그들의 친구들과 가족들을 응원한다."]],"w":"1번에서 인도네시아에 Panjat Pinang이라고 알려진 독특한 게임이 있다고 함. 이 게임은 왕의 생일이 아니라 인도네시아의 독립을 기념하려고 시작되었음(2번), 상품은 과일과 꽃이 아니라 자전거·전자제품·설탕 봉지(7번), 여성들과 아이들은 올라가지 않고 응원함(8번).","c":4},"h":"193acc00b1"},{"n":9,"t":"sum","q":"Friends and family need to (A) (B).","ko":"친구들과 가족들은 (B) (A) 필요가 있다.","opts":["(A) work / (B) together","(A) work / (B) alone","(A) fight / (B) together","(A) fight / (B) alone","(A) sleep / (B) quietly"],"oko":["(A) 협력할 / (B) 함께","(A) 협력할 / (B) 혼자","(A) 싸울 / (B) 함께","(A) 싸울 / (B) 혼자","(A) 잘 / (B) 조용히"],"r":{"a":"1) (A) work / (B) together ((A) 협력할 / (B) 함께)","ev":"5번 문장","s":[[5,"Friends and family need to work together.","친구들과 가족들은 함께 협력해야 한다."]],"w":"5번에서 친구들과 가족들은 함께 협력해야 함(need to work together). work together는 함께 협력하다. fight(싸우다)·sleep(자다)이나 alone(혼자)은 본문과 반대이거나 없는 내용.","c":1},"h":"8cd16d3edf"},{"n":10,"t":"fill","q":"It’s a fun way to [A] Indonesia’s Independence Day and [B] a good time with friends and family.","ko":"그것은 인도네시아의 독립기념일을 [A] 친구들 및 가족과 좋은 시간을 [B] 재미있는 방법이다.","bank":["celebrate","have","climb","form","reach","break"],"bko":{"celebrate":"기념하다","have":"보내다, 가지다","climb":"오르다","form":"구성하다","reach":"닿다","break":"깨다"},"r":{"a":"[A] celebrate (기념하다), [B] have (보내다, 가지다)","ev":"11번 문장","s":[[11,"It’s a fun way to celebrate Indonesia’s Independence Day and have a good time with friends and family.","그것은 인도네시아의 독립기념일을 기념하고 친구들 및 가족과 함께 좋은 시간을 보내는 재미있는 방법이다."]],"w":"11번에서 인도네시아의 독립기념일을 기념하고(celebrate) 친구들 및 가족과 좋은 시간을 보내는(have a good time) 재미있는 방법이라고 함. celebrate는 기념하다, have a good time은 좋은 시간을 보내다. climb·form·reach·break는 뜻이 이어지지 않음.","c":null},"h":"722e654936"}]},{"u":6,"id":"rg2-06-1","no":1,"ko":"레드도 옐로도 아닌, 칭찬하는 카드가 있다고?","items":[{"n":1,"t":"tf","q":"A white card is for players, coaches, or medical staff who show good behavior.","ko":"화이트카드는 좋은 태도를 보이는 선수, 코치, 또는 의료진을 위한 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This card is for players, coaches, or medical staff who show good behavior.","이 카드는 좋은 태도를 보이는 선수, 코치, 또는 의료진을 위한 것이다."]],"w":"3번 문장 그대로임.","c":"T"},"h":"141473d286"},{"n":2,"t":"tf","q":"Referees use white cards when players don’t follow the rules.","ko":"심판들은 선수들이 규칙을 따르지 않을 때 화이트카드를 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"In soccer games, referees use red and yellow cards when players don’t follow the rules.","축구 경기에서 심판들은 선수들이 규칙을 따르지 않을 때 레드카드와 옐로카드를 사용한다."]],"w":"1번에서 규칙을 따르지 않을 때 쓰는 카드는 레드카드와 옐로카드임. 화이트카드가 아니라서 틀림.","c":"F"},"h":"d57778782c"},{"n":3,"t":"tf","q":"FIFA has already approved the use of the white card.","ko":"FIFA는 이미 화이트카드의 사용을 승인했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"But, FIFA hasn’t approved the use of the white card yet.","하지만, FIFA는 아직 화이트카드의 사용을 승인하지 않았다."]],"w":"8번에서 FIFA는 아직(yet) 승인하지 않았다고 함. 이미 승인했다는 말과 반대임.","c":"F"},"h":"24329e52c9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It was introduced during a game between the two teams…)","ko":"그것은 두 팀 간의 경기 중에 ＿＿＿＿＿＿.","opts":["도입되었다","금지되었다","잊혀졌다","팔렸다"],"word":"introduced","r":{"a":"1) 도입되었다","ev":"4~5번 문장","s":[[4,"In Portugal, a referee named Catarina Campos started to use the white card first.","포르투갈에서, Catarina Campos라는 이름의 심판이 화이트카드를 처음으로 사용하기 시작했다."],[5,"It was introduced during a game between the two teams, Benfica and Sporting Lisbon.","그것은 Benfica와 Sporting Lisbon이라는 두 팀 간의 경기 중에 도입되었다."]],"w":"4번에서 Catarina Campos가 처음 사용하기 시작했다고 하고, 5번에서 그것이 한 경기 중에 introduced되었다고 함. 처음 쓰이기 시작했다는 흐름이라 ‘도입되었다’.","c":1},"h":"cbe39cec8c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The referee was moved by their quick response…)","ko":"심판은 그들의 빠른 ＿＿＿에 감동받아…","opts":["질문","실수","대응, 반응","규칙"],"word":"response","r":{"a":"3) 대응, 반응","ev":"6~7번 문장","s":[[6,"When a person in the crowd got sick, medical staff from both teams quickly went to help.","관중 중 한 사람이 아프게 되자, 두 팀의 의료진들이 재빠르게 도우러 갔다."],[7,"The referee was moved by their quick response so she gave them a white card!","심판은 그들의 빠른 대응에 감동받아 그들에게 화이트카드를 주었다!"]],"w":"6번에서 의료진이 재빠르게 도우러 갔고, 7번에서 심판이 그들의 빠른 response에 감동함. response = 대응, 반응.","c":3},"h":"432ecf936b"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nDo you think it’s a good idea, and should other countries use white cards too?","ko":"밑줄 친 it이 가리키는 것은?","sko":"여러분은 그것이 좋은 생각이라고 생각하나요, 그리고 다른 나라들도 화이트카드를 사용해야 할까요?","pron":"it","opts":["화이트카드를 사용하는 것","FIFA","다른 나라들","레드카드"],"r":{"a":"1) 화이트카드를 사용하는 것","ev":"10번 문장","s":[[10,"Do you think it’s a good idea, and should other countries use white cards too?","여러분은 그것이 좋은 생각이라고 생각하나요, 그리고 다른 나라들도 화이트카드를 사용해야 할까요?"]],"w":"10번의 Do you think it’s a good idea, and should other countries use white cards too?에서 it은 화이트카드를 사용하는 것을 가리킴. 질문이 화이트카드 이야기(2~9번)를 이어 가고 있음.","c":1,"k":"it = 화이트카드를 사용하는 것"},"h":"a7e3b76a6d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Only Portugal is using white cards in soccer right now.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"포르투갈만이 현재 축구에서 화이트카드를 사용하고 있다.","opts":["지금 축구에서 화이트카드를 사용하는 나라는 포르투갈뿐이다.","지금 모든 나라가 축구에서 화이트카드를 사용한다.","포르투갈은 화이트카드의 사용을 금지했다.","포르투갈에서는 화이트카드를 한 번도 쓴 적이 없다."],"r":{"a":"1) 지금 축구에서 화이트카드를 사용하는 나라는 포르투갈뿐이다.","ev":"9번 문장","s":[[9,"Only Portugal is using white cards in soccer right now.","포르투갈만이 현재 축구에서 화이트카드를 사용하고 있다."]],"w":"9번의 Only Portugal is using white cards는 포르투갈만 화이트카드를 사용하고 있다는 뜻. only는 오직. 모든 나라가 쓴다는 보기는 only와 반대.","c":1},"h":"9f8600ccb1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Catarina Campos started to use the white card first in Portugal.","The white card was first used in a game between two Spanish teams.","The referee gave a white card to the sick person in the crowd.","Many countries are using white cards in soccer now."],"oko":["Catarina Campos는 포르투갈에서 화이트카드를 처음 사용하기 시작했다.","화이트카드는 스페인 두 팀의 경기에서 처음 사용되었다.","심판은 아픈 관중에게 화이트카드를 주었다.","지금은 많은 나라가 축구에서 화이트카드를 사용한다."],"r":{"a":"1) Catarina Campos started to use the white card first in Portugal. (Catarina Campos는 포르투갈에서 화이트카드를 처음 사용하기 시작했다.)","ev":"4번, 5번, 9번 문장","s":[[4,"In Portugal, a referee named Catarina Campos started to use the white card first.","포르투갈에서, Catarina Campos라는 이름의 심판이 화이트카드를 처음으로 사용하기 시작했다."],[5,"It was introduced during a game between the two teams, Benfica and Sporting Lisbon.","그것은 Benfica와 Sporting Lisbon이라는 두 팀 간의 경기 중에 도입되었다."],[9,"Only Portugal is using white cards in soccer right now.","포르투갈만이 현재 축구에서 화이트카드를 사용하고 있다."]],"w":"4번에서 포르투갈의 심판 Catarina Campos가 화이트카드를 처음 사용하기 시작했음(started는 start의 과거형). 경기는 스페인 팀이 아니라 Benfica와 Sporting Lisbon의 경기(5번)이고, 지금 화이트카드를 쓰는 곳은 포르투갈뿐(9번).","c":1},"h":"b1c741883c"},{"n":9,"t":"sum","q":"When a person in the crowd got sick, medical staff from (A) teams quickly went to (B).","ko":"관중 중 한 사람이 아프게 되자, (A) 팀의 의료진들이 재빠르게 (B) 갔다.","opts":["(A) both / (B) help","(A) both / (B) hide","(A) three / (B) help","(A) three / (B) hide","(A) all / (B) sleep"],"oko":["(A) 두 / (B) 도우러","(A) 두 / (B) 숨으러","(A) 세 / (B) 도우러","(A) 세 / (B) 숨으러","(A) 모든 / (B) 자러"],"r":{"a":"1) (A) both / (B) help ((A) 두 / (B) 도우러)","ev":"5번, 6번 문장","s":[[5,"It was introduced during a game between the two teams, Benfica and Sporting Lisbon.","그것은 Benfica와 Sporting Lisbon이라는 두 팀 간의 경기 중에 도입되었다."],[6,"When a person in the crowd got sick, medical staff from both teams quickly went to help.","관중 중 한 사람이 아프게 되자, 두 팀의 의료진들이 재빠르게 도우러 갔다."]],"w":"6번에서 관중 중 한 사람이 아프자 두 팀의 의료진들이 재빠르게 도우러 갔음(medical staff from both teams quickly went to help). 경기는 두 팀(Benfica와 Sporting Lisbon) 사이에서 열렸으므로(5번) three·all은 맞지 않고, hide·sleep은 본문과 반대.","c":1},"h":"ff81b64e97"},{"n":10,"t":"fill","q":"But now, [A] a [B] white card!","ko":"그러나 이제, [B] 화이트카드가 [A]!","bank":["because","there’s","new","through","quickly","very"],"bko":{"because":"~ 때문에","there’s":"있다(there is의 줄임)","new":"새로운","through":"~을 통해","quickly":"재빨리","very":"매우"},"r":{"a":"[A] there’s (있다(there is의 줄임)), [B]
