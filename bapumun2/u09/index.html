 white shirt is Martin.", "ko": "흰 셔츠를 입고 있는 남자는 Martin이다.", "ok": false, "why": "남자가 입고 있는 능동이라 wearing이 맞아요."}, {"n": "④", "en": "You must not open this closed box.", "ko": "너는 이 닫힌 상자를 열면 안 된다.", "ok": false, "why": "상자가 닫힌 수동이라 closed가 맞아요."}, {"n": "⑤", "en": "This is an old building built 100 years ago.", "ko": "이것은 100년 전에 지어진 오래된 건물이다.", "ok": false, "why": "건물이 지어진 수동이라 built가 맞아요."}], "pencil": "꾸밈을 받는 명사가 '~되는' 쪽이면 ___ 를 쓴다", "pencilKey": "과거분사(p.p.)", "page": 92, "sec": "s2"}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "현재분사와 동명사 구분하기", "type": "mc", "ans": "①", "concept": ["069", "026", "015"], "gap": "", "words": [["poem", "시"], ["relax", "긴장을 풀다"], ["card", "카드"], ["helpful", "도움이 되는"]], "h1": "<보기>의 Writing poems는 문장 맨 앞 주어 자리예요. 보기마다 writing이 어떤 자리에서 쓰였는지 비교하세요. 쓰임이 '다른' 것을 찾아요.", "h2": "<보기>는 '시를 쓰는 것'이라는 이름처럼 쓰인 동명사예요. 'am writing'처럼 be동사와 함께 '~하고 있다'를 만드는 -ing를 찾으면 달라요.", "why": "①의 am writing(쓰고 있다)은 진행형을 만드는 현재분사예요. <보기>와 나머지는 모두 동명사예요.", "opts": [{"n": "①", "en": "I am writing an email now.", "ko": "나는 지금 이메일을 쓰고 있다.", "ok": true, "why": "am writing은 진행형의 현재분사라서 <보기>와 달라요."}, {"n": "②", "en": "My hobby is writing a card.", "ko": "내 취미는 카드를 쓰는 것이다.", "ok": false, "why": "보어로 쓰인 동명사라서 같은 동명사예요."}, {"n": "③", "en": "I like writing a letter to my kids.", "ko": "나는 아이들에게 편지 쓰는 것을 좋아한다.", "ok": false, "why": "like의 목적어로 쓰인 동명사예요."}, {"n": "④", "en": "My father is good at writing.", "ko": "우리 아버지는 글쓰기를 잘하신다.", "ok": false, "why": "전치사 at의 목적어로 쓰인 동명사예요."}, {"n": "⑤", "en": "Reading is very helpful for writing.", "ko": "읽기는 글쓰기에 매우 도움이 된다.", "ok": false, "why": "전치사 for의 목적어로 쓰인 동명사예요."}], "pencil": "be동사 + -ing가 '~하고 있다'이면 ___ 이다", "pencilKey": "현재분사", "page": 92, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "현재분사와 동명사 구분하기", "type": "mc", "ans": "②", "concept": ["069", "026"], "gap": "", "words": [["sleeping bag", "침낭"], ["go camping", "캠핑 가다"], ["dining room", "식당"], ["cross", "건너다"], ["burning", "불타는"], ["make a speech", "연설하다"]], "h1": "<보기>의 sleeping bag은 '자는 가방'이 아니라 '침낭'이에요. 즉 '자는 데 쓰는 가방'이라는 용도를 말해요. 같은 용도를 말하는 -ing를 찾으세요.", "h2": "명사의 용도를 나타내는 동명사는 '~하는 데 쓰는'이라고 풀려요. 나머지는 진행이나 '~하고 있는'으로 꾸미는 현재분사예요.", "why": "<보기>의 sleeping bag(침낭)과 ②의 dining room(식당)은 모두 명사의 용도를 나타내는 동명사예요. 나머지는 현재분사예요.", "opts": [{"n": "①", "en": "Sally was reading a book in a coffee shop.", "ko": "Sally는 커피숍에서 책을 읽고 있었다.", "ok": false, "why": "was reading은 과거진행형의 현재분사라서 달라요."}, {"n": "②", "en": "We should clean the dining room.", "ko": "우리는 식당을 청소해야 한다.", "ok": true, "why": "dining room은 '식사하는 데 쓰는 방'으로 용도를 나타내는 동명사라서 같아요."}, {"n": "③", "en": "I saw you crossing the street.", "ko": "나는 네가 길을 건너고 있는 것을 보았다.", "ok": false, "why": "you가 건너고 있다는 보어 역할의 현재분사라서 달라요."}, {"n": "④", "en": "The firefighter ran into the burning house.", "ko": "소방관은 불타고 있는 집으로 뛰어 들어갔다.", "ok": false, "why": "burning이 house를 꾸미는 현재분사라서 달라요."}, {"n": "⑤", "en": "The woman making a speech is the boss of this company.", "ko": "연설을 하고 있는 여자는 이 회사의 사장이다.", "ok": false, "why": "making이 woman을 꾸미는 현재분사라서 달라요."}], "pencil": "명사의 '용도'를 나타내는 -ing(sleeping bag)는 ___ 이다", "pencilKey": "동명사", "page": 92, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "현재분사와 동명사 구분하기", "type": "mc", "ans": "④", "concept": ["069", "026"], "gap": "", "words": [["meet", "만나다"], ["people", "사람들"], ["goal", "목표"], ["help", "돕다"], ["homeless", "노숙인"], ["keep", "키우다"], ["pet", "반려동물"]], "h1": "다섯 문장의 밑줄 친 부분과 우리말 해석이 맞는지 하나씩 확인하세요. 우리말 해석이 '옳지 않은' 것을 찾아요.", "h2": "동명사는 '~하는 것'으로 해석해요. 해석이 '~하는 것'이 아니라 '~하고 있다'처럼 풀리는 문장이 있으면 -ing의 쓰임을 다시 보세요.", "why": "④의 is talking about은 '이야기하고 있다'라는 진행형이에요. 그래서 '이야기하는 것'이라는 해석은 옳지 않아요.", "opts": [{"n": "①", "en": "Meeting new people is fun. (새로운 사람들을 만나는 것은)", "ko": "새로운 사람들을 만나는 것은 재미있다.", "ok": false, "why": "주어로 쓰인 동명사라서 해석이 맞아요."}, {"n": "②", "en": "Having two eyes helps us. (두 눈을 가진 것은)", "ko": "두 눈을 가진 것은 우리에게 도움이 된다.", "ok": false, "why": "주어로 쓰인 동명사라서 해석이 맞아요."}, {"n": "③", "en": "Their goal was helping the homeless. (노숙인들을 돕는 것)", "ko": "그들의 목표는 노숙인들을 돕는 것이었다.", "ok": false, "why": "보어로 쓰인 동명사라서 해석이 맞아요."}, {"n": "④", "en": "Jane is talking about how to dance better. (춤을 더 잘 추는 법에 관해 이야기하는 것)", "ko": "Jane은 춤을 더 잘 추는 법에 대해 이야기하고 있다.", "ok": true, "why": "is talking은 진행형이라 '이야기하는 것'이라는 해석이 틀려요."}, {"n": "⑤", "en": "Keeping pets can be hard work. (애완동물을 키우는 것은)", "ko": "반려동물을 키우는 것은 힘든 일일 수 있다.", "ok": false, "why": "주어로 쓰인 동명사라서 해석이 맞아요."}], "pencil": "be동사 + -ing는 '~하는 것'이 아니라 '~하고 ___' 로 해석한다", "pencilKey": "있다", "page": 92, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "현재분사와 동명사 구분하기", "type": "mc", "ans": "③", "concept": ["069", "026", "015"], "gap": "", "words": [["be good at", "~을 잘하다"], ["quit", "그만두다"], ["smoke", "담배 피우다"], ["doll", "인형"], ["Chinese", "중국어"]], "h1": "각 문장의 밑줄 친 -ing가 목적어, 주어, 진행 중 무엇인지 하나씩 보세요. 쓰임이 나머지 넷과 다른 것을 찾아요.", "h2": "전치사, 동사의 목적어와 주어로 쓰인 -ing는 동명사예요. 과거 시제의 'were + -ing'는 '~하고 있었다'를 만드는 다른 종류예요.", "why": "③의 were watching(보고 있었다)은 과거진행형을 만드는 현재분사예요. 나머지는 모두 동명사예요.", "opts": [{"n": "①", "en": "Mina is not good at playing the piano.", "ko": "미나는 피아노를 잘 치지 못한다.", "ok": false, "why": "전치사 at의 목적어인 동명사예요."}, {"n": "②", "en": "My father quit smoking last month.", "ko": "우리 아버지는 지난달에 담배를 끊으셨다.", "ok": false, "why": "quit의 목적어인 동명사예요."}, {"n": "③", "en": "We were watching TV last night.", "ko": "우리는 어젯밤에 TV를 보고 있었다.", "ok": true, "why": "were watching은 과거진행형의 현재분사라서 나머지와 달라요."}, {"n": "④", "en": "He likes buying dolls and robots.", "ko": "그는 인형과 로봇을 사는 것을 좋아한다.", "ok": false, "why": "like의 목적어인 동명사예요."}, {"n": "⑤", "en": "Learning Chinese is not easy.", "ko": "중국어를 배우는 것은 쉽지 않다.", "ok": false, "why": "주어인 동명사예요."}], "pencil": "was/were + -ing는 '~하고 있었다'를 만드는 ___ 이다", "pencilKey": "현재분사", "page": 92, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "현재분사와 동명사 구분하기", "type": "mc", "ans": "④", "concept": ["069", "068"], "gap": "", "words": [["skate", "스케이트를 타다"], ["travel", "여행하다"], ["be proud of", "~을 자랑스러워하다"], ["pass", "통과하다"], ["ride", "타다"  소년이 그림을 그리니 능동이라 drawing, (2) 차가 사용된 것이니 수동이라 used가 맞아요.", "opts": [], "pencil": "수식하는 명사와의 관계가 능동이면 현재분사, 수동이면 ___", "pencilKey": "과거분사(p.p.)", "page": 93, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "현재분사와 과거분사의 쓰임", "type": "write", "ans": "③, injured", "concept": ["068", "068-H1"], "gap": "", "words": [["car accident", "교통사고"], ["driver", "운전사"], ["injure", "다치게 하다"], ["take to the hospital", "병원으로 데려가다"]], "h1": "번호를 고르고 바르게 고쳐 쓰는 문제예요. ③ injuring이 꾸미는 말 driver와 어떤 관계인지 보세요. 운전사는 다친 쪽일까요, 다치게 하는 쪽일까요?", "h2": "운전사는 사고로 '다침을 당한' 쪽이에요. 수동의 뜻으로 뒤에서 명사를 꾸미려면 어떤 분사를 써야 할지 생각하세요.", "why": "운전사는 부상을 '당하는' 수동 관계예요. 그래서 injuring을 과거분사 injured로 고쳐요.", "opts": [], "pencil": "'~당한'이라는 수동의 뜻은 ___ 로 쓴다", "pencilKey": "과거분사(p.p.)", "page": 93, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "감정을 나타내는 분사", "type": "write", "ans": "interesting", "concept": ["068-2", "068", "070"], "gap": "", "words": [["drama", "드라마"], ["so ~ that ...", "너무 ~해서 ..."], ["interest", "흥미를 일으키다"]], "h1": "The drama is so ___ that I want to see it again. 드라마가 사람에게 흥미를 일으키는지 느끼는지 생각해 보세요.", "h2": "드라마(사물)는 감정을 '일으키는' 쪽이에요. 감정을 일으키는 것을 말할 때는 어떤 분사를 쓸까요? interest 흥미를 일으키다에 알맞은 끝을 붙이세요.", "why": "드라마가 사람에게 흥미를 일으키는 쪽이라서 능동의 현재분사 interesting을 써요.", "opts": [], "pencil": "사물이 감정을 일으키면 ___ 를 쓴다", "pencilKey": "-ing(현재분사)", "page": 93, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "감정을 나타내는 분사", "type": "write", "ans": "confusing → confused", "concept": ["068-2", "068", "070"], "gap": "", "words": [["confuse", "혼란스럽게 하다"], ["guidance", "안내"]], "h1": "She was confusing by his guidance. 에서 주어 She는 감정을 느끼는 쪽일까요, 일으키는 쪽일까요? 그 기준으로 confusing을 다시 보세요.", "h2": "사람이 감정을 '느끼는' 쪽일 때는 과거분사를 써요. confuse 혼란스럽게 하다를 알맞은 모양으로 바꿔 보세요.", "why": "She는 혼란스러움을 느끼는 쪽이에요. 그래서 능동의 confusing을 수동의 과거분사 confused로 고쳐요.", "opts": [], "pencil": "사람이 감정을 느낄 때는 ___ 를 쓴다", "pencilKey": "-ed(과거분사)", "page": 93, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "감정을 나타내는 분사", "type": "writ 서 문장이 틀려요."}, {"n": "④", "en": "to lock", "ko": "잠그기 위해", "ok": false, "why": "'잠긴 상태로 두다'라는 뜻이 되지 않아요."}, {"n": "⑤", "en": "has locked", "ko": "잠갔다", "ok": false, "why": "동사가 하나 더 와서 문장이 틀려요."}], "pencil": "keep + 목적어 + ___ = 목적어가 ~된 채로 두다", "pencilKey": "과거분사(p.p.)", "page": 94, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "현재분사와 과거분사의 쓰임", "type": "mc", "ans": "⑤", "concept": ["068", "068-H1", "015"], "gap": "", "words": [["wear", "입다"], ["black dress", "검은 드레스"], ["play", "연주하다"], ["Bach", "바흐"]], "h1": "The woman ___ a black dress is ___ Bach. 두 칸을 따로 정하세요. 첫째는 woman을 꾸미는 말, 둘째는 is 뒤에서 진행을 만드는 말이에요.", "h2": "첫째: 여자가 드레스를 '입고 있는' 능동이에요. 둘째: be동사 뒤에서 '연주하고 있다'를 만들려면 같은 종류의 분사가 필요해요.", "why": "여자가 입고 있는 능동이라 wearing, is 뒤 진행형이라 playing이 맞아요.", "opts": [{"n": "①", "en": "worn - play", "ko": "입은 - 연주하다", "ok": false, "why": "worn은 수동이라 틀리고 is 뒤에 동사원형도 올 수 없어요."}, {"n": "②", "en": "worn - playing", "ko": "입은 - 연주하고 있는", "ok": false, "why": "첫 칸의 여자는 입고 있는 능동이라 worn이 틀려요."}, {"n": "③", "en": "wearing - played", "ko": "입고 있는 - 연주된", "ok": false, "why": "둘째 칸은 진행형이 되어야 하는데 played라서 틀려요."}, {"n": "④", "en": "wears - playing", "ko": "입는다 - 연주하고 있는", "ok": false, "why": "첫 칸에 동사가 하나 더 와서 문장이 틀려요."}, {"n": "⑤", "en": "wearing - playing", "ko": "입고 있는 - 연주하고 있는", "ok": true, "why": "명사를 꾸미는 -ing와 진행형의 -ing로 둘 다 맞아요."}], "pencil": "명사를 꾸미는 능동의 분사와 진행형의 분사는 둘 다 ___ 이다", "pencilKey": "현재분사(-ing)", "page": 94, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "현재분사와 과거분사의 쓰임", "type": "mc", "ans": "①, ②, ④", "concept": ["068", "054"], "gap": "", "words": [["boil", "끓이다"], ["receive", "받다"], ["written", "쓰여진(원형 write 쓰다)"], ["marble", "대리석"], ["lose", "잃어버리다"], ["know", "알다"]], "h1": "<보기>의 boiled eggs의 boiled는 명사 eggs를 꾸미는 과거분사예요. 보기 다섯 문장의 밑줄 친 과거분사가 명사를 꾸미는지, 현재완료를 만드는지 하나씩 나눠 보세요. 답이 세 개예요.", "h2": "has lost, have known처럼 have + p.p.는 현재완료예요. 이런 도움말 없이 명사를 앞이나 뒤에서 꾸미는 과거분사를 모두 고르세요.", "why": "<보기>와 ①의 written message, ②의 built house, ④의 made table은 모두 명사를 꾸미는 과거분사예요. ③, ⑤는 현재완료예요.", "opts": [{"n": "①", "en": "I received a written message.", "ko": "나는 쓰여진 메시지를 받았다.", "ok": true, "why": "written이 message를 꾸미는 과거분사라서 같아요."}, {"n": "②", "en": "There is a big house built in 1890.", "ko": "1890년에 지어진 큰 집이 있다.", "ok": true, "why": "built가 house를 뒤에서 꾸미는 과거분사라서 같아요."}, {"n": "③", "en": "Alicia has lost her new smartphone.", "ko": "Alicia는 새 스마트폰을 잃어버렸다.", "ok": false, "why": "has lost는 현재완료라서 달라요."}, {"n": "④", "en": "The table made with marble is expensive.", "ko": "대리석으로 만들어진 탁자는 비싸다.", "ok": true, "why": "made가 table을 뒤에서 꾸미는 과거분사라서 같아요."}, {"n": "⑤", "en": "We have known each other since we were young.", "ko": "우리는 어렸을 때부터 서로 알아 왔다.", "ok": false, "why": "have known은 현재완료라서 달라요."}], "pencil": "p.p.가 명사를 꾸미는 쓰임과 have + p.p.(현재완료)를 구별한다. have 없이 명사를 꾸미면 ___", "pencilKey": "과거분사의 수식", "page": 94, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "현재분사와 과거분사의 쓰임", "type": "mc", "ans": "②", "concept": ["031", "015", "068"], "gap": "", "words": [["goose (geese)", "거위(복수 geese)"], ["fly away", "날아가 버리다"], ["south", "남쪽으로"], ["warm", "따뜻한"]], "h1": "빈칸 두 곳에 같은 말이 들어가요. 첫째는 saw geese ___ away(거위들이 날아가는 것을 봤다), 둘째는 were ___ south(남쪽으로 날아가고 있었다)예요.", "h2": "둘째 칸은 were 뒤에서 '~하고 있었다'를 만들어요. 첫째 칸은 saw(원형 see 보다) 뒤에서 거위들이 하는 동작을 말하는 자리예요. 거위가 스스로 하는 능동이에요.", "why": "saw 뒤 목적격 보어로 능동의 flying, were 뒤 과거진행형으로 flying이 들어가요.", "opts": [{"n": "①", "en": "fly", "ko": "날다", "ok": false, "why": "둘째 칸의 were 뒤에는 동사원형이 올 수 없어요."}, {"n": "②", "en": "flying", "ko": "날고 있는", "ok": true, "why": "첫째는 보어, 둘째는 과거진행형에서 모두 맞아요."}, {"n": "③", "en": "flew", "ko": "날았다 (원형 fly 날다)", "ok": false, "why": "과거형은 두 칸 모두에 어울리지 않아요."}, {"n": "④", "en": "to fly", "ko": "날기 위해", "ok": false, "why": "were 뒤 진행형이 될 수 없어요."}, {"n": "⑤", "en": "flown", "ko": "날았던 (원형 fly 날다)", "ok": false, "why": "수동이나 완료 뜻이라 거위가 날고 있다는 뜻과 맞지 않아요."}], "pencil": "지각동사 saw + 목적어 + ___ = 목적어가 ~하는 것을 보다", "pencilKey": "현재분사(-ing)", "page": 94, "sec": "s3"}, {"id": "S3-05", "step": ": "신나게 하는 - 신난", "ok": false, "why": "두 칸이 모두 반대로 되어 있어요."}, {"n": "⑤", "en": "exciting - exciting", "ko": "신나게 하는 - 신나게 하는", "ok": false, "why": "첫 칸의 I는 느끼는 쪽이라 틀려요."}], "pencil": "사람이 흥분을 느끼면 excited, 경기가 흥분을 일으키면 ___", "pencilKey": "exciting", "page": 94, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "감정을 나타내는 분사", "type": "mc", "ans": "②", "concept": ["068-2", "068", "070"], "gap": "", "words": [["boring", "지루한"], ["discovery", "발견"], ["be pleased with", "~에 기뻐하다"], ["be tired of", "~에 싫증 나다"], ["endless", "끝없는"]], "h1": "각 문장의 주어가 사람인지 사물인지 확인하고, 밑줄 친 분사가 느끼는 쪽(-ed)인지 일으키는 쪽(-ing)인지 맞는지 보세요. 어색한 것을 찾아요.", "h2": "The music video는 사물이에요. 사물이 사람에게 흥미를 '일으키는' 쪽이라면 어떤 모양이 어울릴까요?", "why": "뮤직비디오가 나에게 흥미를 일으키는 쪽이라서 interested가 아니라 interesting이 되어야 해서 ②가 어색해요.", "opts": [{"n": "①", "en": "She is a boring person.", "ko": "그녀는 지루한 사람이다.", "ok": false, "why": "사람이 지루함을 일으키는 쪽이라 boring이 맞아요."}, {"n": "②", "en": "The music video is interested to me.", "ko": "그 뮤직비디오는 나에게 흥미를 느낀다(틀림).", "ok": true, "why": "뮤직비디오는 흥미를 일으키는 쪽이라 interesting이어야 해요."}, {"n": "③", "en": "Tom was excited by the new discovery.", "ko": "Tom은 새로운 발견에 흥분했다.", "ok": false, "why": "Tom이 흥분을 느끼는 쪽이라 맞아요."}, {"n": "④", "en": "I am very pleased with your success.", "ko": "나는 너의 성공이 매우 기쁘다.", "ok": false, "why": "내가 기쁨을 느끼는 쪽이라 맞아요."}, {"n": "⑤", "en": "They were tired of his endless speech.", "ko": "그들은 그의 끝없는 연설에 싫증이 났다.", "ok": false, "why": "그들이 싫증을 느끼는 쪽이라 맞아요."}], "pencil": "사물이 사람에게 흥미를 일으키면 interested가 아니라 ___", "pencilKey": "interesting", "page": 94, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "현재분사와 동명사 구분하기", "type": "mc", "ans": "②, ⑤", "concept": ["069", "068", "015"], "gap": "", "words": [["laugh", "웃다"], ["over there", "저쪽에"], ["sound", "소리"], ["dizzy", "어지러운"], ["flute", "플루트"], ["break down", "고장 나다"]], "h1": "<보기>의 laughing은 girl을 뒤에서 꾸미는 말이에요. 보기 다섯 문장의 밑줄 친 -ing가 동명사인지 현재분사인지 나눠 보세요. 정답은 두 개예요.", "h2": "<보기>는 '웃고 있는 소녀'로 풀리는 현재분사예요. 문장에서 진행을 만들거나 명사를 꾸미면 현재분사 .", "h2": "두 칸 모두 괄호 안 동사에 ing를 붙이는 모양이에요. 첫 칸은 진행형이니 현재분사, 둘째 칸은 '자는 데 쓰는'이라는 용도니 동명사예요.", "why": "I'm looking for는 현재진행형이라 looking, sleeping bag은 '자는 데 쓰는 가방'(침낭)이라서 sleeping이 맞아요.", "opts": [], "pencil": "진행형의 -ing는 현재분사, 용도의 -ing는 ___", "pencilKey": "동명사", "page": 95, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "현재분사와 과거분사의 쓰임", "type": "write", "ans": "(1) living (2) called (3) hearing", "concept": ["068", "068-H1", "026"], "gap": "", "words": [["live", "살다"], ["usually", "보통"], ["scientist", "과학자"], ["lead", "이끌다"], ["machine", "기계"], ["hard of hearing", "귀가 잘 안 들리는"], ["hearing aid", "보청기"]], "h1": "각 칸에 괄호 안의 동사를 한 단어로 바꿔 넣어요. (1) People ___ in the country, (2) a machine ___ ENIAC, (3) hard of ___ 에서 각 칸의 앞뒤 관계를 보세요.", "h2": "(1) 사람들이 '살고 있는' 쪽이에요. (2) 기계는 'ENIAC이라고 불리는' 쪽이에요. (3) of는 전치사라서 뒤에 어떤 모양이 올지 생각하세요.", "why": "(1) 능동이라 living, (2) 기계가 불려지는 수동이라 called, (3) 전치사 of 뒤라서 동명사 hearing이 맞아요.", "opts": [], "pencil": "전치사 뒤에는 동명사, 능동 수식은 현재분사, 수동 수식은 ___", "pencilKey": "과거분사", "page": 95, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "현재분사와 과거분사의 쓰임", "type": "write", "ans": "had his sweater cleaned", "concept": ["031", "031-3", "068"], "gap": "", "words": [["have", "~하게 하다"], ["sweater", "스웨터"], ["clean", "세탁하다"]], "h1": "우리말은 '그는 그의 스웨터가 세탁되게 했다'예요. have(~하게 하다) 뒤에 목적어(his sweater)와 목적격 보어를 이어요. 과거 시제라는 점도 보세요.", "h2": "스웨터는 세탁'되는' 대상이에요. 목적격 보어 자리에 수동의 뜻을 나타내는 모양을 쓰세요. have는 과거로 써야 해요.", "why": "have의 과거형은 had이고, 스웨터가 세탁되는 수동이라서 과거분사 cleaned를 써요. 그래서 had his sweater cleaned예요.", "opts": [], "pencil": "have + 목적어 + ___ = 목적어가 ~되게 하다", "pencilKey": "과거분사(p.p.)", "page": 95, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "현재분사와 과거분사의 쓰임", "type": "write", "ans": "③, lying", "concept": ["053-2", "068", "030"], "gap": "", "words": [["wallet", "지갑"], ["in front of", "~ 앞에"], ["worn out", "낡은"], ["lie", "놓여 있다, 눕다"]], "h1": "번호 하나를 고르고 바르게 고쳐 쓰는 문제예요. ③ 자리의 말이 wallet(지갑)과 어떤 관계인지 보세요. lie 놓여 있다의 모양 변화도 확인하세요.", "h2": "  }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
