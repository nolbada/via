var D=[{"n": 1, "tag": null, "en": "Welcome back at school! How does you feel today?", "ko": "학교에 다시 온 걸 환영해요. 오늘 기분은 어떤가요?", "ok": false, "foot": [], "fixes": [{"wrong": "at", "right": "to", "partial": false, "at": [2], "point": "전치사: '학교로 돌아오다'는 back to school로 표현", "topic": "전치사", "memo": "'학교로 돌아오다'는 back to school로 표현"}, {"wrong": "does", "right": "do", "partial": false, "at": [5], "point": "일반동사 의문문: 주어 you에는 조동사 do 사용", "topic": "일반동사 의문문", "memo": "주어 you에는 조동사 do 사용"}]}, {"n": 2, "tag": null, "en": "Did you slept well last night?", "ko": "어젯밤에 잘 잤나요?", "ok": false, "foot": [], "fixes": [{"wrong": "slept", "right": "sleep", "partial": false, "at": [2], "point": "일반동사 의문문: 조동사 Did 뒤에는 동사원형 sleep 사용(과거를 두 번 표시하지 않음)", "topic": "일반동사 의문문", "memo": "조동사 Did 뒤에는 동사원형 sleep 사용(과거를 두 번 표시하지 않음)"}]}, {"n": 3, "tag": null, "en": "Sleeping well can give you energy for the new school year.", "ko": "잘 자는 것은 당신에게 새 학년을 위한 에너지를 줄 수 있어요.", "ok": true, "foot": [], "fixes": []}, {"n": 4, "tag": null, "en": "Now, check your sleep habit with the list.", "ko": "이제, 목록을 보면서 당신의 수면 습관을 확인해 보세요.", "ok": false, "foot": [], "fixes": [{"wrong": "habit", "right": "habits", "partial": false, "at": [4], "point": "명사의 수: 여러 습관을 확인하는 것이므로 복수형 habits 사용", "topic": "명사의 수", "memo": "여러 습관을 확인하는 것이므로 복수형 habits 사용"}]}, {"n": 5, "tag": "체크리스트", "en": "I goes to bed at different times.", "ko": "나는 다른 시각에 잠자리에 들어.", "ok": false, "foot": [], "fixes": [{"wrong": "goes", "right": "go", "partial": false, "at": [1], "point": "수일치: 주어 I에는 동사원형 go 사용 (3인칭 단수 아님)", "topic": "수일치", "memo": "주어 I에는 동사원형 go 사용 (3인칭 단수 아님)"}]}, {"n": 6, "tag": null, "en": "I drink much energy drinks.", "ko": "나는 에너지 음료를 많이 마셔.", "ok": false, "foot": [], "fixes": [{"wrong": "much", "right": "a lot of", "partial": false, "at": [2], "point": "수량표현: 셀 수 있는 명사 energy drinks 앞에는 much 대신 a lot of(또는 many) 사용", "topic": "수량표현", "memo": "셀 수 있는 명사 energy drinks 앞에는 much 대신 a lot of(또는 many) 사용"}]}, {"n": 7, "tag": null, "en": "I us ink you need change? Let's find a few tips to try.", "ko": "변화가 필요하다고 생각하나요? 몇 가지 시도해 볼 팁을 찾아봅시다.", "ok": false, "foot": [], "fixes": [{"wrong": "need change", "right": "need a change", "partial": false, "at": [4], "point": "관사: 셀 수 있는 명사 change(하나의 변화) 앞에는 부정관사 a 사용", "topic": "관사", "memo": "셀 수 있는 명사 change(하나의 변화) 앞에는 부정관사 a 사용"}]}, {"n": 14, "tag": "Tip 1 · 규칙적인 수면 패턴", "en": "Have regular sleep pattern.", "ko": "규칙적인 수면 패턴을 가지세요.", "ok": false, "foot": [], "fixes": [{"wrong": "Have regular sleep pattern", "right": "Have a regular sleep pattern", "partial": false, "at": [0], "point": "관사: 단수명사 pattern 앞에는 부정관사 a 사용", "topic": "관사", "memo": "단수명사 pattern 앞에는 부정관사 a 사용"}]}, {"n": 15, "tag": null, "en": "Your body have a \"clock.\"", "ko": "당신의 몸은 '시계'를 가지고 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "have", "right": "has", "partial": false, "at": [2], "point": "수일치: 주어 body(단수)에는 동사 has 사용", "topic": "수일치", "memo": "주어 body(단수)에는 동사 has 사용"}]}, {"n": 16, "tag": null, "en": "The body clock tells you when to wake up and sleeping.", "ko": "그 생체 시계는 당신에게 언제 일어나고 자야 할지 말해 줍니다.", "ok": false, "foot": [], "fixes": [{"wrong": "sleeping", "right": "sleep", "partial": false, "at": [10], "point": "병렬구조: to 뒤에 연결된 동사는 형태를 통일(wake up and sleep)", "topic": "병렬구조", "memo": "to 뒤에 연결된 동사는 형태를 통일(wake up and sleep)"}]}, {"n": 17, "tag": null, "en": "For example, in the morning, your body start to feel lively, but at night, it starts to feeling sleepy.", "ko": "예를 들어, 아침에 당신의 몸은 활기가 돌기 시작해요. 하지만 밤에는 졸리기 시작해요.", "ok": false, "foot": [], "fixes": [{"wrong": "start", "right": "starts", "partial": false, "at": [7], "point": "수일치: 주어 body(단수)에는 starts 사용", "topic": "수일치", "memo": "주어 body(단수)에는 starts 사용"}, {"wrong": "feeling", "right": "feel", "partial": false, "at": [17], "point": "to부정사: starts to 뒤에는 동사원형 feel 사용", "topic": "to부정사", "memo": "starts to 뒤에는 동사원형 feel 사용"}]}, {"n": 18, "tag": null, "en": "Listen at your body clock and sleep regularly.", "ko": "당신의 생체 시계의 말을 듣고  don't sleep yet.\" To sleep well, don't use your phone right before bedtime."];var PASS_KO=["더 나은 수면, 더 나은 삶", "학교에 다시 온 걸 환영해요. 오늘 기분은 어떤가요? 어젯밤에 잘 잤나요? 잘 자는 것은 당신에게 새 학년을 위한 에너지를 줄 수 있어요. 이제, 목록을 보면서 당신의 수면 습관을 확인해 보세요.", "나는 다른 시각에 잠자리에 들어. 나는 에너지 음료를 많이 마셔. 나는 자기 전에 스마트폰을 사용해. 나는 하루에 8시간보다 적게 자. 나는 취침 시간 전에 음식을 먹어. 나는 긴 낮잠을 자. 몇 개의 습관에 체크했나요? 이 습관들은 수면 문제를 일으킬 수 있습니다. 변화가 필요하다고 생각하나요? 몇 가지 시도해 볼 팁을 찾아봅시다.", "규칙적인 수면 패턴을 가지세요. 당신의 몸은 '시계'를 가지고 있어요. 그 생체 시계는 당신에게 언제 일어나고 자야 할지 말해 줍니다. 예를 들어, 아침에 당신의 몸은 활기가 돌기 시작해요. 하지만 밤에는 졸리기 시작해요. 당신의 생체 시계의 말을 듣고 규칙적으로 자도록 해요. 당신은 더 건강하게 느낄 거예요.", "카페인에 주의하세요. 카페인은 수면 문제를 유발할 수 있어요. 심지어 초콜릿에도 카페인이 있다는 것을 알고 있나요? 카페인은 초콜릿, 커피, 차, 탄산음료, 그리고 에너지 음료와 같은 음식과 음료 모두에 숨어 있어요. 그러니 조심하세요!", "몸을 활동적으로 움직이세요. 낮 동안에 운동을 하세요. 그러면 당신의 몸이 약간 피곤해질 것이고 밤에 쉽게 잠들 거예요. 취침 시간 몇 시간 전에 운동을 끝낼 것을 기억하세요. 만약 취침 시간 직전에 운동을 끝내면 당신의 몸이 너무 깨어 있을 거예요. 당신은 쉽게 잠들 수 없을지도 몰라요.", "취침 시간 전에 스마트폰 사용을 멈추세요. 밤늦게 스마트폰을 사용하면 당신의 뇌가 활성화되어 있을 거예요. 휴대 전화에서 나오는 블루라이트는 또한 당신의 뇌에게 '이봐, 아직 자지 마.'라고 말할 거예요. 잘 자기 위해서는 취침 시간 직전에 휴대 전화를 사용하지 마세요."];var DG=[{"dlg": [["Jinsu", "Nicole, what are your goals for this year?", "Nicole, 올해 너의 목표는 뭐야?"], ["Nicole", "I’m planning to read 30 books. I tried last year but didn’t make it.", "나는 책을 30권 읽을 계획이야. 작년에도 시도했는데 해내지 못했어."], ["Jinsu", "That’s a big goal.", "그거 큰 목표구나."], ["Nicole", "Yes, I really want to do it this time.", "응, 이번에는 정말 해내고 싶어."], ["Jinsu", "You can do it! Just read a little every day.", "넌 할 수 있어! 매일 조금씩만 읽어 봐."], ["Nicole", "Okay, I will. What are your goals, Jinsu?", "알겠어, 그렇게 할게. 너의 목표는 뭐야, 진수야?"], ["Jinsu", "I’m planning to run for the election. I want to become class president.", "나는 선거에 출마할 계획이야. 반장이 되고 싶어."], ["Nicole", "You’re good at listening to people. You’ll be a great leader.", "너는 사람들의 말을 잘 들어 주잖아. 너는 훌륭한 리더가 될 거야."], ["Jinsu", "Thank you for saying so.", "그렇게 말해 줘서 고마워."], ["Nicole", "You’re welcome. I hope we can reach our goals.", "천만에. 우리가 목표를 이룰 수 있으면 좋겠다."]], "qs": [{"n": 1, "q": "위 대화의 주제로 알맞은 것은?",
