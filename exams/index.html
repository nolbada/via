<title>시험 모음</title>
<style>
:root{--bg:#f4f6f5;--card:#ffffff;--ink:#16211f;--sub:#5b6b67;--line:#dbe3e0;--accent:#1f501b}
@media (prefers-color-scheme:dark){:root{--bg:#10171a;--card:#182125;--ink:#e8eeec;--sub:#9db0ab;--line:#2a3639;--accent:#9bd35a}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:640px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:22px;margin:0 0 4px;letter-spacing:-.01em}
p.note{font-size:13px;color:var(--sub);margin:0 0 18px}
h2{font-size:14px;color:var(--sub);font-weight:700;margin:26px 0 8px;letter-spacing:.02em}
a.app,div.app{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:18px 16px;margin-bottom:10px;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700}
a.app span,div.app span{font-size:13px;font-weight:400;color:var(--sub)}
a.app:active{background:var(--line)}
a.app.m1{border-left-color:#0e7490}
a.app.m2{border-left-color:#25578f}
div.app.soon{opacity:.5;border-left-color:var(--line);border-style:dashed;border-left-style:dashed;font-weight:600}
</style>
</head>
<body>
<main>
<h1>시험 모음</h1>
<p class="note">선생님이 직접 물어보고 채점하는 시험만 모았어요. 학생에게 이 주소는 알려주지 않아요.</p>

<h2>중등 · READING 틀린 곳 말하기</h2>
<a class="app m1" href="reading-speaking.html#m1">M1 Reading<span>78레슨 · 5문제</span></a>
<a class="app m2" href="reading-speaking.html#m2">M2 Reading<span>60레슨 · 5문제</span></a>

<h2>중등 · 동사형 말하기</h2>
<div class="app soon">동사형 말하기<span>준비 중</span></div>

<h2>고등 · 말하기</h2>
<div class="app soon">동사형 말하기<span>준비 중</span></div>

<!-- 새 시험은 해당 구역 맨 아래에 한 줄씩 추가 (a.app 한 줄) · 새 구역은 <h2>부터 -->
</main>
</body>
</html>
