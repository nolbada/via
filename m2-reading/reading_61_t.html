, "memo": "선행사 items(사물)에는 who가 아니라 that 사용"}]}, {"n": 5, "tag": null, "en": "Someone were giving it away. It looked as good as a new one. So, I sent a message to the person which posted it.", "ko": "누군가가 그걸 나눠주고 있었어요. 그건 새것처럼 괜찮아 보였어요. 그래서 저는 그걸 게시한 사람에게 메시지를 보냈어요.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [1], "point": "be동사의 수일치: 주어 Someone은 단수라 was 사용", "topic": "be동사의 수일치", "memo": "주어 Someone은 단수라 was 사용"}, {"wrong": "which", "right": "who", "partial": false, "at": [21], "point": "관계대명사: 선행사 the person(사람)에는 which가 아니라 who 사용", "topic": "관계대명사", "memo": "선행사 the person(사람)에는 which가 아니라 who 사용"}]}, {"n": 6, "tag": null, "en": "Hello, can I getting the backpack? Sure.", "ko": "안녕하세요, 제가 그 백팩을 가져도 될까요? 물론이죠.", "ok": false, "foot": [], "fixes": [{"wrong": "getting", "right": "get", "partial": false, "at": [3], "point": "조동사: 조동사 can 뒤에는 동사원형 get 사용", "topic": "조동사", "memo": "조동사 can 뒤에는 동사원형 get 사용"}]}, {"n": 7, "tag": null, "en": "Great! How can I get it? Can you come Central Park at 3:00 p.m. tomorrow?", "ko": "잘됐어요! 어떻게 가져갈 수 있나요? 내일 오후 3시에 중앙공원으로 오실 수 있나요?", "ok": false, "foot": [], "fixes": [{"wrong": "Central", "right": "to Central", "partial": false, "at": [9], "point": "전치사: come 뒤 장소 앞에는 방향 전치사 to 사용", "topic": "전치사", "memo": "come 뒤 장소 앞에는 방향 전치사 to 사용", "alt": [8]}]}, {"n": 8, "tag": null, "en": "Sure! I'll see you then. Thank you!", "ko": "물론 돼요! 그때 뵐게요. 감사합니다!", "ok": true, "foot": [], "fixes": []}, {"n": 9, "tag": "자전거 · 공유 시스템", "en": "The next day, I got ready to go to the park. I decided borrowing a bike instead of taking a bus.", "ko": "다음날, 저는 공원으로 갈 준비를 했어요. 저는 버스를 타는 대신 자전거를 빌리기로 했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "borrowing", "right": "to borrow", "partial": false, "at": [13], "point": "to부정사: decide 뒤에는 to부정사 to borrow 사용", "topic": "to부정사", "memo": "decide 뒤에는 to부정사 to borrow 사용"}]}, {"n": 10, "tag": null, "en": "My city have a bike-sharing system. Anyone who has an app can borrow a bike easy.", "ko": "우리 도시는 자전거 공유 시스템이 있어요. 앱이 있는 사람은 누구든 쉽게 자전거를 빌릴 수 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "have", "right": "has", "partial": false, "at": [2], "point": "동사의 수일치: 주어 My city(단수)이므로 has 사용", "topic": "동사의 수일치", "memo": "주어 My city(단수)이므로 has 사용"}, {"wrong": "easy", "right": "easily", "partial": false, "at": [15], "point": "형용사와 부사: 동사 borrow를 꾸미는 부사 easily 사용", "topic": "형용사와 부사", "memo": "동사 borrow를 꾸미는 부사 easily 사용"}]}, {"n": 11, "tag": null, "en": "First, you choose a bike that you want to use. Then you scan the QR code of the bike. This makes the bike's lock to open.", "ko": "우선, 사용하고 싶은 자전거를 골라요. 그런 다음 자전거에 있는 QR 코드를 스캔해요. 이렇게 하면 자전거의 잠금이 해제돼요.", "ok": false, "foot": [], "fixes": [{"wrong": "of", "right": "on", "partial": false, "at": [16], "point": "전치사: 자전거에 붙어 있는 QR 코드는 on the bike", "topic": "전치사", "memo": "자전거에 붙어 있는 QR 코드는 on the bike"}, {"wrong": "to open", "right": "open", "partial": false, "at": [24], "point": "사역동사: make의 목적격보어는 동사원형 open 사용", "topic": "사역동사", "memo": "make의 목적격보어는 동사원형 open 사용"}]}, {"n": 12, "tag": null, "en": "Before I rode to the park, I checked the bike careful. Sometimes, the bikes are not in good condition.", "ko": "공원으로 타고 가기 전, 저는 자전거를 찬찬히 점검했어요. 가끔 자전거의 상태가 좋지 않기도 해요.", "ok": false, "foot": [], "fixes": [{"wrong": "careful", "right": "carefully", "partial": false, "at": [10], "point": "형용사와 부사: 동사 checked를 꾸미는 부사 carefully 사용", "topic": "형용사와 부사", "memo": "동사 checked를 꾸미는 부사 carefully 사용"}]}, {"n": 13, "tag": null, "en": "This time, everything looked fine, so I headed for the park. When I got there, I return the bike to a station in the park.", "ko": "이번에는 모든 게 괜찮아 보여서, 저는 공원으로 향했어요. 거기에 도착해서 저는 공원에 있는 대여소에 자전거를 반납했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "return", "right": "returned", "partial": false, "at": [16], "point": "동사의 시제: When I got there(과거)와 맞춰 과거형 returned 사용", "topic": "동사의 시제", "memo": "When I got there(과거)와 맞춰 과거형 returned 사용"}]}, {"n": 14, "tag": null, "en": "Using the bike were really easy. Also, I was happy to help the environment.", "ko": "자전거를 이용하는 건 정말 쉬웠어요. 또한 저는 환경에 도움이 되어서 기뻤어요.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [3], "point": "동명사 주어의 수일치: 동명사 주어 Using은 단수라 was 사용", "topic": "동명사 주어의 수일치", "memo": "동명사 주어 Using은 단수라 was 사용"}]}, {"n": 15, "tag": "후기 · 공유하는 마음", "en": "After I got the backpack from the person, I went home. The backpack wasn't as big than my old one, but it was in great condition.", "ko": "그 사람에게서 백팩을 얻은 후 저는 집으로 돌아갔어요. 백팩은 예전의 제 것만큼 크지는 않았지만, 상태가 아주 좋았어요.", "ok": false, "foot": [], "fixes": [{"wrong": "than", "right": "as", "partial": false, "at": [16], "point": "원급 비교: not as ~ as 구문이라 than이 아니라 as 사용", "topic": "원급 비교", "memo": "not as ~ as 구문이라 than이 아니라 as 사용"}]}, {"n": 16, "tag": null, "en": "I also really liked the color of it. I looked forward to using it for school.", "ko": "또 저는 이것의 색깔이 정말 맘에 들었어요. 학교 갈 때 사용하기를 기대했어요.", "ok": true, "foot": [], "fixes": []}, {"n": 17, "tag": null, "en": "That day was a great experience for me. I got a cool backpack without spend any money!", "ko": "그날은 제게 훌륭한 경험이었어요. 저는 돈을 전혀 쓰지 않고 멋진 백팩을 구했어요!", "ok": false, "foot": [], "fixes": [{"wrong": "spend", "right": "spending", "partial": false, "at": [14], "point": "동명사: 전치사 without 뒤에는 동명사 spending 사용", "topic": "동명사", "memo": "전치사 without 뒤에는 동명사 spending 사용"}]}, {"n": 18, "tag": null, "en": "This experience also made me think what I should share my things with others, too.", "ko": "이 경험은 또한 제게 저 역시도 다른 사람들과 제 것을 공유해야겠다고 생각하게 만들었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "what", "right": "that", "partial": false, "at": [6], "point": "접속사 that: think 뒤 문장을 이끄는 명사절 접속사 that 사용", "topic": "접속사 that", "memo": "think 뒤 문장을 이끄는 명사절 접속사 that 사용"}]}];var PP=[["Hello, I'm Jimin.", "안녕하세요, 저는 지민이에요.", 1], ["Have you ever shared things like bikes, books, or toys?", "여러분은 자전거, 책, 혹은 장난감 같은 물건을 공유해본 적이 있나요?", 0], ["Sharing saves resources and money, and  got there, I returned the bike to a station in the park.", "거기에 도착해서 저는 공원에 있는 대여소에 자전거를 반납했어요.", 0], ["Using the bike was really easy.", "자전거를 이용하는 건 정말 쉬웠어요.", 0], ["Also, I was happy to help the environment.", "또한 저는 환경에 도움이 되어서 기뻤어요.", 0], ["Jimin's Thoughts", "지민이의 생각", 1], ["After I got the backpack from the person, I went home.", "그 사람에게서 백팩을 얻은 후 저는 집으로 돌아갔어요.", 0], ["The backpack wasn't as big as my old one, but it was in great condition.", "백팩은 예전의 제 것만큼 크지는 않았지만, 상태가 아주 좋았어요.", 0], ["I also really liked the color of it.", "또 저는 이것의 색깔이 정말 맘에 들었어요.", 0], ["I looked forward to using it for school.", "학교 갈 때 사용하기를 기대했어요.", 0], ["That day was a great experience for me.", "그날은 제게 훌륭한 경험이었어요.", 0], ["I got a cool backpack without spending any money!", "저는 돈을 전혀 쓰지 않고 멋진 백팩을 구했어요!", 0], ["This experience also made me think that I should share my things with others, too.", "이 경험은 또한 제게 저 역시도 다른 사람들과 제 것을 공유해야겠다고 생각하게 만들었어요.", 0]];var RNUM=61;var TITLE_EN="My Day with the Sharing Economy";var PASS_EN=["My Day with the Sharing Economy", "Hello, I'm Jimin. Have you ever shared things like bikes, books, or toys? Sharing saves resources and money, and it is good for the environment. Let me tell you about my experience with the sharing economy.", "Jimin and the Backpack", "Last week, I used an app to get a backpack. The app allows users to easily buy and sell secondhand items. Sometimes, people also give away items that they don't need anymore. I saw a post about a nice backpack. Someone was giving it away. It looked as good as a new one. So, I sent a message to the person who posted it. Hello, can I get the backpack? Sure. Great! How can I get it? Can you come to Central Park at 3:00 p.m. tomorrow? Sure! I'll see you then. Thank you!", "Jimin and the Bike", "The next day, I got ready to go to the park. I decided to borrow a bike instead of taking a bus. My city has a bike-sharing system. Anyone who has an app can borrow a bike easily. First, you choose a bike that you want to use. Then you scan the QR code on the bike. This makes the bike's lock open. Before I rode to the park, I checked the bike carefully. Sometimes, the bikes are not in good condition. This time, everything looked fine, so I headed for the park. When I got there, I returned the bike to a station in the park. Using the bike was really easy. Also, I was happy to help the environment.", "Jimin's Thoughts", "After I got the backpack from the person, I went home. The backpack wasn't as big as my old one, but it was in great condition. I also really liked the color of it. I looked forward to using it for school. That day was a great experience for me. I got a cool backpack without spending any money! This experience also made me think that I should share my things with others, too."];var PASS_KO=["공유 경제와 함께 한 나의 하루", "안녕하세요, 저는 지민이에요. 여러분은 자전거, 책, 혹은 장난감 같은 물건을 공유해본 적이 있나요? 공유는 자원과 돈을 절약해 주고, 환경에 도움이 돼요. 저의 공유 경제에 관한 경험을 여러분께 얘기해 드릴게요.", "지민이와 백팩", "지난주 저는 백팩을 구하러 앱을 사용했어요. 그 앱은 사용자들이 중고 물품을 쉽게 사고팔 수 있게 해줘요. 때때로 사람들은 더 이상 필요하지 않은 물건을 나눠주기도 해요. 저는 멋진 백팩에 관한 게시물을 봤어요. 누군가가 그걸 나눠주고 있었어요. 그건 새것처럼 괜찮아 보였어요. 그래서 저는 그걸 게시한 사람에게 메시지를 보냈어요. 안녕하세요, 제가 그 백팩을 가져도 될까요? 물론이죠. 잘됐어요! 어떻게 가져갈 수 있나요? 내일 오후 3시에 중앙공원으로 오실 수 있나요? 물론 돼요! 그때 뵐게요. 감사합니다!", "지민이와 자전거", "다음날, 저는 공원으로 갈 준비를 했어요. 저는 버스를 타는 대신 자전거를 빌리기로 했어요. 우리 도시는 자전거 공유 시스템이 있어요. 앱이 있는 사람은 누구든 쉽게 자전거를 빌릴 수 있어요. 우선, 사용하고 싶은 자전거를 골라요. 그런 다음 자전거에 있는 QR 코드를 스캔해요. 이렇게 하면 자전거의 잠금이 해제돼요. 공원으로 타고 가기 전, 저는 자전거를 찬찬히 점검했어요. 가끔 자전거의 상태가 좋지 않기도 해요. 이번에는 모든 게 괜찮아 보여서, 저는 공원으로 향했어요. 거기에 도착해서 저는 공원에 있는 대여소에 자전거를 반납했어요. 자전거를 이용하는 건 정말 쉬웠어요. 또한 저는 환경에 도움이 되어서 기뻤어요.", "지민이의 생각", "그 사람에게서 백팩을 얻은 후 저는 집으로 돌아갔어요. 백팩은 예전의 제 것만큼 크지는 않았지만, 상태가 아주 좋았어요. 또 저는 이것의 색깔이 정말 맘에 들었어요. 학교 갈 때 사용하기를 기대했어요. 그날은 제게 훌륭한 경험이었어요. 저는 돈을 전혀 쓰지 않고 멋진 백팩을 구했어요! 이 경험은 또한 제게 저 역시도 다른 사람들과 제 것을 공유해야겠다고 생각하게 만들었어요."];var BG=[{"qs": [{"n": 6, "q": "윗글 Jimin의 백팩 이야기와 일치하는 것은?", "o": ["지민이는 백팩을 새 제품으로 샀다.", "그 앱에서는 새 물건만 사고팔 수 있다.", "지민이는 전화로 백팩 주인에게 연락했다.", "지민이는 백팩 주인에게 돈을 보냈다.", "누군가가 앱에서 백팩을 나눠주고 있었다."], "a": 4, "ans": "누군가가 앱에서 백팩을 나눠주고 있었다.", "evs": [["Someone was giving it away.", "누군가가 그걸 나눠주고 있었어요."], ["Sometimes, people also give away items that they don't need anymore.", "때때로 사람들은 더 이상 필요하지 않은 물건을 나눠주기도 해요."]], "ow": ["오답 ✕ — 'I used an app to get a backpack'(백팩을 구하러 앱을 사용했어요)이고 'giving it away'(나눠주고 있었어요)라고 했으므로 새 제품을 산 것이 아니다.", "오답 ✕ — 'buy and sell secondhand items'(중고 물품을 사고팔다)라고 했으므로 새 물건만이 아니라 중고 물품을 거래한다.", "오답 ✕ — 'I sent a message to the person who posted it.'(그걸 게시한 사람에게 메시지를 보냈어요.)라고 했으므로 전화가 아니라 메시지로 연락했다.", "오답 ✕ — 백팩은 'giving it away'(나눠주고 있었어요)였고 지민이는 돈을 쓰지 않았다. 돈을 보냈다는 말은 본문에 없다.", "정답 ○ — 'Someone was giving it away.'(누군가가 그걸 나눠주고 있었어요.)라고 했으므로 본문과 일치한다."], "memo": ["정답 ⑤: 누군가가 앱에서 백팩을 나눠주고 있었다.", "근거: Someone was giving it away.(누군가가 그걸 나눠주고 있었어요.)", "함정: 앱은 새 물건이 아니라 secondhand(중고) 물품을 사고파는 곳 ✕"], "why": "지민이는 앱에서 누군가가 나눠주던 백팩을 보고 메시지로 연락했다.", "ev": ["Someone was giving it away.", "누군가가 그걸 나눠주고 있었어요."]}, {"n": 7, "q": "윗글의 제목으로 가장 알맞은 것은?", "o": ["How to Make Money with Secondhand Items", "Experiencing the Sharing Economy in My Daily Life", "Why You Should Buy a New Backpack", "The Best Parks in My City", "Rules for Riding Bikes Safely"], "a": 1, "ans": "Experiencing the Sharing Economy in My Daily Life", "ko": ["중고 물품으로 돈을 버는 방법", "일상에서 경험한 공유 경제", "새 백팩을 사야 하는 이유", "우리 도시 최고의 공원들", "자전거를 안전하게 타는 규칙"], "evs": [["Let me tell you about my experience with the sharing economy.", "저의 공유 경제에 관한 경험을 여러분께 얘기해 드릴게요."], ["Sharing saves resources and money, and it is good for the environment.", "공유는 자원과 돈을 절약해 주고, 환경에 도움이 돼요."]], "ow": ["오답 ✕ — 'Sharing saves resources and money'(공유는 자원과 돈을 절약해 줘요)라고 했지만, 돈을 버는 이야기가 아니다. 지민이는 'without spending any money'(돈을 쓰지 않고) 백팩을 구했을 뿐이다.", "정답 ○ — 'Let me tell you about my experience with the sharing economy.'(저의 공유 경제에 관한 경험을 얘기해 드릴게요.)라고 한 뒤, 백팩과 공유 자전거 이야기를 들려준다.", "오답 ✕ — 지민이는 새 백팩을 산 것이 아니라 'giving it away'(나눠주던) 중고 백팩을 얻었다. 글의 내용과 반대이다.", "오답 ✕ — 공원은 'Central Park'(중앙공원
