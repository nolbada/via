rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "미술 수업", "en": "Art class was over, but Vashti still sits in her chair.", "ko": "미술 수업이 끝났지만, Vashti는 여전히 의자에 앉아 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "sits", "right": "sat", "partial": false, "at": [7], "point": "시제: 접속사 but로 연결된 절도 앞 절 (was over)과 마찬가지로 과거시제 sat 사용", "topic": "시제", "memo": "접속사 but로 연결된 절도 앞 절 (was over)과 마찬가지로 과거시제 sat 사용"}]}, {"n": 2, "tag": null, "en": "Her paper was blank.", "ko": "그녀의 종이는 비어 있었다.", "ok": true, "foot": [], "fixes": []}, {"n": 3, "tag": null, "en": "Her teacher leaned over and looking at it.", "ko": "그녀의 선생님이 몸을 숙여 그것을 보았다.", "ok": false, "foot": [], "fixes": [{"wrong": "looking", "right": "looked", "partial": false, "at": [5], "point": "병렬구조: 등위접속사 and로 연결된 두 동사는 같은 시제로 병렬(leaned ~ looked)", "topic": "병렬구조", "memo": "등위접속사 and로 연결된 두 동사는 같은 시제로 병렬(leaned ~ looked)"}]}, {"n": 4, "tag": null, "en": "“Ah! It is the polar bear in a snowstorm,” she says.", "ko": "“아! 이건 눈보라 속의 북극곰이구나,”라고 그녀가 말했다.", "ok": false, "foot": [], "fixes": [{"wrong": "the", "right": "a", "partial": false, "at": [3], "point": "관사: 처음 언급되는 대상이므로 부정관사 a 사용", "topic": "관사", "memo": "처음 언급되는 대상이므로 부정관사 a 사용"}, {"wrong": "says", "right": "said", "partial": false, "at": [10], "point": "시제: 이야기 전체가 과거시제이므로 동사 said 사용", "topic": "시제", "memo": "이야기 전체가 과거시제이므로 동사 said 사용"}]}, {"n": 5, "tag": null, "en": "“That’s funny!” said Vashti. “I CAN’T draws!”", "ko": "“재미있네요!”라고 Vashti가 말했다. “저는 그림을 못 그려요!”", "ok": false, "foot": [], "fixes": [{"wrong": "draws", "right": "draw", "partial": false, "at": [6], "point": "어법: 조동사 can’t 뒤에는 동사원형 draw 사용", "topic": "어법", "memo": "조동사 can’t 뒤에는 동사원형 draw 사용"}]}, {"n": 6, "tag": null, "en": "Her teacher smiled. “Just makes a mark.”", "ko": "그녀의 선생님이 미소를 지었다. “그냥 아무 표시나 해봐.”", "ok": false, "foot": [], "fixes": [{"wrong": "makes", "right": "make", "partial": false, "at": [4], "point": "어법: 명령문은 동사원형으로 시작 (make)", "topic": "어법", "memo": "명령문은 동사원형으로 시작 (make)"}]}, {"n": 7, "tag": null, "en": "Vashti p : "어휘/수일치", "memo": "한 사람의 이름은 하나이므로 단수명사 name 사용"}]}, {"n": 12, "tag": null, "en": "The next day, Vashti was surprised see something in a frame on the wall of the art classroom. It were her little dot!", "ko": "다음 날, Vashti는 미술실 벽에 걸린 액자 속 무언가를 보고 놀랐다. 그것은 그녀가 그린 작은 점이었다!", "ok": false, "foot": [], "fixes": [{"wrong": "see", "right": "to see", "partial": false, "at": [6], "point": "어법: be surprised 뒤에는 to부정사 사용(be surprised + to V)", "topic": "어법", "memo": "be surprised 뒤에는 to부정사 사용(be surprised + to V)"}, {"wrong": "were", "right": "was", "partial": false, "at": [19], "point": "수일치: 주어 It(단수)에 맞춰 be동사 was 사용", "topic": "수일치", "memo": "주어 It(단수)에 맞춰 be동사 was 사용"}]}, {"n": 13, "tag": null, "en": "“I can make a more better dot than that!” Vashti said.", "ko": "“나는 저것보다 더 나은 점을 그릴 수 있어!”라고 Vashti가 말했다.", "ok": false, "foot": [], "fixes": [{"wrong": "more better", "right": "better", "partial": false, "at": [4], "point": "비교급: 불규칙 비교급 better에는 more를 함께 쓰지 않음", "topic": "비교급", "memo": "불규칙 비교급 better에는 more를 함께 쓰지 않음"}]}, {"n": 14, "tag": null, "en": "She got a brush and started paint.", "ko": "그녀는 붓을 들고 그리기 시작했다.", "ok": false, "foot": [], "fixes": [{"wrong": "paint", "right": "painting", "partial": false, "at": [6], "point": "동명사: start 뒤에는 동명사(v-ing) 또는 to부정사 사용(paint 대신 painting)", "topic": "동명사", "memo": "start 뒤에는 동명사(v-ing) 또는 to부정사 사용(paint 대신 painting)"}]}, {"n": 15, "tag": null, "en": "She painted a red dot, a purple dot, a yellow dot, and blue dot. Then she mixed blue with yellow together.", "ko": "그녀는 빨간 점, 보라색 점, 노란 점, 파란 점을 그렸다. 그러고 나서 그녀는 파란색과 노란색을 함께 섞었다.", "ok": false, "foot": [], "fixes": [{"wrong": "blue dot", "right": "a blue dot", "partial": false, "at": [12], "point": "병렬구조: 열거되는 명사구의 형태를 통일(관사 a 포함)", "topic": "병렬구조", "memo": "열거되는 명사구의 형태를 통일(관사 a 포함)"}, {"wrong": "with", "right": "and", "partial": false, "at": [18], "point": "어휘: 두 색을 섞는다는 표현은 mix A and B together 사용", "topic": "어휘", "memo": "두 색을 섞는다는 표현은 mix A and B together 사용"}]}, {"n": 16, "  a yellow dot, and a blue dot. Then she mixed blue and yellow together. She discovered that she could make a green dot. Vashti kept experimenting. She painted lots of little dots in many colors. “If I can make little dots, I can make big dots, too.” All of the dots that she painted looked beautiful together on the paper.", "At the school art show a few weeks later, everyone loved Vashti’s paintings. A little boy looked up at her. “You’re a really great artist. I want to paint like you,” he said. “I bet you can,” said Vashti. “Me? No, not me. I CAN’T draw!” Vashti smiled. She handed the boy a blank sheet of paper and told him to draw a line. The pencil which the boy held shook as he drew. Vashti looked at the boy’s line, and then she said, “Sign it.”"];var PASS_KO=["점", "미술 수업이 끝났지만, Vashti는 여전히 의자에 앉아 있었다. 그녀의 종이는 비어 있었다. 그녀의 선생님이 몸을 숙여 그것을 보았다. “아! 이건 눈보라 속의 북극곰이구나,”라고 그녀가 말했다. “재미있네요!”라고 Vashti가 말했다. “저는 그림을 못 그려요!” 그녀의 선생님이 미소를 지었다. “그냥 아무 표시나 해봐.” Vashti는 마커를 집어 들고 종이에 작은 점을 그렸다. “여기 있어요!” 그녀의 선생님은 종이를 집어 들고 그것을 주의 깊게 바라보았다. “흠.” 그녀는 종이를 Vashti 쪽으로 밀어주며 그것에 서명을 하라고 했다. Vashti는 잠시 동안 생각했다. “음, 내가 그림은 못 그릴지 모르지만, 이름은 쓸 수 있지.” 다음 날, Vashti는 미술실 벽에 걸린 액자 속 무언가를 보고 놀랐다. 그것은 그녀가 그린 작은 점이었다! “나는 저것보다 더 나은 점을 그릴 수 있어!”라고 Vashti가 말했다. 그녀는 붓을 들고 그리기 시작했다. 그녀는 빨간 점, 보라색 점, 노란 점, 파란 점을 그렸다. 그러고 나서 그녀는 파란색과 노란색을 함께 섞었다. 그녀는 녹색 점을 만들 수 있다는 것을 발견했다. Vashti는 계속해서 실험했다. 그녀는 여러 가지 색깔의 작은 점들을 많이 그렸다. “내가 작은 점을 그릴 수 있다면, 큰 점도 그릴 수 있겠지.” 그녀가 그린 모든 점들은 종이 위에서 함께 어우러져 아름답게 보였다.", "몇 주 후 학교 미술 전시회에서, 모두가 Vashti의 그림들을 좋아했다. 한 작은 소년이 그녀를 올려다보았다. “당신은 정말 훌륭한 예술가예요. 나는 당신처럼 그림을 그리고 싶어요”라고 그가 말했다. “너도 분명히 할 수 있어”라고 Vashti가 말했다. “나요? 아니, 난 아니에요. 나는 그림을 못 그려요!” Vashti는 미소를 지었다. 그녀는 소년에게 빈 종이 한 장을 건네주고 그에게 선을 그려보라고 말했다. 소년이 쥐고 있던 연필이 그가 그림을 그리는 동안 흔들렸다. Vashti는 소년이 그린 선을 바라보았다. 그러고 나서 그녀는 말했다… “서명해.”"];var DG=[{"dlg": [["G", "Our Sports Day is coming, Siwoo! I’m excited.", "곧 체육대회야, 시우야! 너무 신나."], ["B", "Hi, Yejin. What event are you going to take part in?", "안녕, 예진아. 너는 어떤 종목에 참가할 거야?"], ["G"
