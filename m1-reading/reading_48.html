abs walked by my feet.", "ko": "작은 게 몇 마리가 내 발 옆을 걸어갔다.", "ok": false, "foot": [], "fixes": [{"wrong": "little", "right": "few", "partial": false, "at": [1], "point": "수량 형용사 few/little: 셀 수 있는 crabs 앞에는 A few 사용", "topic": "수량 형용사 few/little", "memo": "셀 수 있는 crabs 앞에는 A few 사용"}]}, {"n": 11, "tag": null, "en": "Our trip came to an end with a beautiful sunset. I think I will never forgot this trip.", "ko": "우리의 여행은 아름다운 일몰과 함께 끝이 났다. 나는 이 여행을 잊지 못할 것 같다.", "ok": false, "foot": [], "fixes": [{"wrong": "forgot", "right": "forget", "partial": false, "at": [15], "point": "조동사: 조동사 will 뒤에는 동사원형: forget (forgot 아님)", "topic": "조동사", "memo": "조동사 will 뒤에는 동사원형: forget (forgot 아님)"}]}];var PP=[["Last weekend, I took a day trip to Ganghwado with my family.", "지난 주말에 나는 가족들과 강화도에 당일치기 여행을 갔다.", 1], ["Ganghwado is an island with a rich history and beautiful nature.", "강화도는 풍부한 역사와 아름다운 자연을 지닌 섬이다.", 0], ["Chojijin", "초지진", 1], ["Our first stop was Chojijin.", "우리가 처음으로 들른 곳은 초지진이었다.", 1], ["In the 19th century, Joseon had battles against France, the U.S., and Japan here.", "19세기에 조선은 이곳에서 프랑스, 미국, 일본에 대항하여 전투를 벌였다.", 0], ["The cannon in the picture is from the old days.", "사진 속의 대포는 그 시절의 것이다.", 0], ["There were even cannon ball marks on the stone walls and trees.", "석벽과 나무에는 대포알 자국도 있었다.", 0], ["What a historic place it is!", "이곳은 얼마나 역사적인 장소인가!", 0], ["Ganghwa Bugeunri Goindol", "강화 부근리 고인돌", 1], ["Next, we visited Ganghwa Bugeunri Goindol.", "다음으로 우리는 강화 부근리 고인돌에 갔다.", 1], ["It is the largest stone tomb on Ganghwado.", "그것은 강화도에서 가장 큰 돌무덤이다.", 0], ["It is about 3,000 years old.", "그것은 약 3,000년이 되었다.", 0], ["It looks like a big table.", "그것은 큰 탁자처럼 생겼다.", 0], ["The cover stone is heavier than 50 cars!", "고인돌의 덮개돌은 자동차 50대보다도 더 무겁다!", 0], ["How could people move such a big stone so long ago?", "그렇게 오래전에 사람들은 어떻게 그렇게 큰 돌을 옮길 수 있었을까?", 0], ["Dongmak Beach", "동막 해변", 1], ["Our last stop was Dongmak Beach.", "우리가 마지막으로 들른 곳은 동막 해변이었다.", 1], ["I heard that this beach has one of
