ecret", "비밀"], ["volunteer work", "봉사 활동"]], "h1": "밑줄 친 관계부사를 괄호 안 표현으로 바꿔 쓸 수 있는지 하나씩 확인하세요. 시간, 장소, 이유, 방법에 따라 바꿔 쓰는 말이 달라요.", "h2": "시간은 in, on, at + which, 장소는 in, at + which, 이유는 for + which로 바꿔요. 이유에 맞지 않는 전치사를 쓴 보기를 찾아보세요.", "why": "④ 이유의 관계부사 why는 for which로 바꿔야 해요. on which는 시간 선행사에 쓰는 말이라 어색해요.", "opts": [{"n": "①", "en": "This is the time when Anna usually gets up. (at which)", "ko": "지금이 Anna가 보통 일어나는 시간이다. (at which)", "ok": false, "why": "시간 선행사 뒤 when은 at which로 바꿔 쓸 수 있어요."}, {"n": "②", "en": "I am looking for a shop where I can buy a battery. (at which)", "ko": "나는 건전지를 살 수 있는 가게를 찾고 있다. (at which)", "ok": false, "why": "장소 선행사 뒤 where는 at which로 바꿔 쓸 수 있어요."}, {"n": "③", "en": "Could you tell me how I can get to the stadium? (the way)", "ko": "경기장에 가는 방법을 알려 주시겠어요? (the way)", "ok": false, "why": "how 대신 the way를 쓸 수 있어요."}, {"n": "④", "en": "The reason why Daniel changed the plan is a secret. (on which)", "ko": "Daniel이 계획을 바꾼 이유는 비밀이다. (on which)", "ok": true, "why": "이유의 why는 for which로 바꿔야 해요. on which는 어색해서 정답이에요."}, {"n": "⑤", "en": "That is the animal care center where I do volunteer work on weekends. (in which)", "ko": "저곳이 내가 주말에 봉사 활동을 하는 동물 보호 센터이다. (in which)", "ok": false, "why": "장소 선행사 뒤 where는 in which로 바꿔 쓸 수 있어요."}], "pencil": "이유의 관계부사 why는 「___ + which」로 바꿔 쓴다", "pencilKey": "for", "page": 172, "sec": "s2"}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "관계부사 when", "type": "mc", "ans": "①", "concept": ["086"], "gap": "", "words": [["date", "날짜"], ["leave for", "~로 떠나다"], ["best day", "가장 좋은 날"], ["first met", "처음 만났다(원형 meet 만나다)"]], "h1": "두 빈칸 앞의 선행사 the date와 The day가 무엇을 나타내는지 보세요. 빈칸 뒤 문장은 둘 다 빠진 말이 없는 완전한 문장이에요.", "h2": "시간 선행사 뒤 완전한 문장 앞에 오는 관계부사가 두 문장 모두에 들어가요.", "why": "두 선행사 모두 시간을 나타내고 뒤가 완전한 문장이라서 시간의 관계부사 when이 알맞아요.", "opts": [{"n": "①", "en": "when", "ko": "~할 때", "ok": true, "why": "시간 선행사 두 개 모두에 알맞아요."}, {"n": "②", "en": "where", "ko": "~하는 곳", "ok": false, "why": "장소의 관계부사라서 시간 선행사와 맞지 않아요."}, {"n": "③", "en" ", "ok": false, "why": "둘째 빈칸 뒤가 완전한 문장이라 which가 안 돼요."}, {"n": "③", "en": "why – where", "ko": "~하는 이유 – ~하는 곳", "ok": true, "why": "이유 선행사에는 why, 장소 선행사에는 where라서 알맞아요."}, {"n": "④", "en": "where – why", "ko": "~하는 곳 – ~하는 이유", "ok": false, "why": "순서가 거꾸로예요."}, {"n": "⑤", "en": "how – which", "ko": "어떻게 – ~인", "ok": false, "why": "첫 빈칸은 이유 선행사라 how가 안 되고, 둘째 빈칸 뒤는 완전한 문장이라 which가 안 돼요."}], "pencil": "이유 선행사 뒤에는 why, 장소 선행사 뒤에는 ___", "pencilKey": "where", "page": 172, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "관계부사 why, how", "type": "mc", "ans": "②", "concept": ["086", "085-H2"], "gap": "", "words": [["tomato pasta", "토마토 파스타"], ["lend", "빌려주다"], ["elementary school", "초등학교"], ["enter", "입학하다"]], "h1": "어색한 것을 고르는 문제예요. 관계사 앞에 선행사가 있는지, 관계사 뒤 문장이 완전한지 하나씩 확인하세요.", "h2": "②의 what은 '~하는 것'이라는 뜻의 관계대명사예요. what 뒤에는 빠진 말이 있어야 하는데 그 뒤 문장이 어떤지 보세요.", "why": "② what 뒤의 he made the tomato pasta가 빠진 말 없는 완전한 문장이라서 관계대명사 what이 아니라 how 같은 관계부사가 와야 해요.", "opts": [{"n": "①", "en": "Detroit is the city which I was born in.", "ko": "Detroit는 내가 태어난 도시이다.", "ok": false, "why": "in 뒤의 목적어가 빠져서 관계대명사 which가 맞아요."}, {"n": "②", "en": "Tell me what he made the tomato pasta.", "ko": "그가 그 토마토 파스타를 어떻게 만들었는지 말해 줘.", "ok": true, "why": "what 뒤가 완전한 문장이라 what이 아니라 how여야 해요."}, {"n": "③", "en": "Let me know how I can help the people.", "ko": "내가 그 사람들을 어떻게 도울 수 있는지 알려 줘.", "ok": false, "why": "how 뒤가 완전한 문장이라 맞아요."}, {"n": "④", "en": "What is the reason why she didn't lend the book to you?", "ko": "그녀가 네게 그 책을 빌려주지 않은 이유가 뭐니?", "ok": false, "why": "이유 선행사 the reason 뒤 why라서 맞아요."}, {"n": "⑤", "en": "The year when I entered elementary school was 2012.", "ko": "내가 초등학교에 입학한 해는 2012년이었다.", "ok": false, "why": "시간 선행사 The year 뒤 when이라서 맞아요."}], "pencil": "what 뒤가 완전한 문장이면 what 대신 관계부사 ___ 등을 쓴다", "pencilKey": "how", "page": 172, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "관계부사 when", "type": "mc", "ans": "①, ④", "concept": ["086", "086-H1"], "gap": "", "words"
