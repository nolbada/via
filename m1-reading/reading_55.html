od Around the World","Poke, Hawaii, the United States","There are many islands in Hawaii. People in Hawaii enjoy eating fish. Poke is a famous fish salad from Hawaii. Poke means “to cut” in Hawaiian. People cut fish into small pieces and put them in a bowl. They add fresh vegetables to it. Poke looks colorful. Try it. It tastes great.","Fondue, Switzerland","People in Switzerland like eating cheese. Fondue is a popular cheese dish in Switzerland. Making fondue is very easy. First, heat cheese in a pot. Next, cut bread into small pieces. Now, let’s enjoy fondue. Pick up a long fork. Dip a piece of bread into the warm cheese. How does fondue taste? It tastes delicious!","Tom Yum Goong, Thailand","The weather in Thailand is very hot. Many Thai people enjoy eating spicy food. Tom yum goong is a popular Thai soup. It tastes spicy and sour. Tom yum goong has shrimp in it. People like eating tom yum goong with rice. It smells good. It’s really tasty."];var PASS_KO=["세계의 음식","포케, 미국 하와이","하와이에는 많은 섬이 있다. 하와이 사람들은 생선을 먹는 것을 즐긴다. 포케는 하와이의 유명한 생선 샐러드이다. 포케는 하와이어로 ‘자르는 것’을 의미한다. 사람들은 생선을 작은 조각으로 자르고 그것들을 그릇에 담는다. 그들은 신선한 채소를 그것에 추가한다. 포케는 알록달록해 보인다. 한번 먹어 보라. 그것은 맛이 좋다.","퐁뒤, 스위스","스위스 사람들은 치즈를 먹는 것을 좋아한다. 퐁뒤는 스위스에서 인기 있는 치즈 요리이다. 퐁뒤를 만드는 것은 매우 쉽다. 첫째, 냄비에 치즈를 데워라. 다음으로, 빵을 작은 조각으로 잘라라. 이제, 퐁뒤를 즐기자. 긴 포크를 집어라. 빵 조각을 따뜻한 치즈에 살짝 담가라. 퐁뒤 맛이 어떤가? 그것은 맛있다!","똠얌꿍, 태국","태국의 날씨는 매우 덥다. 많은 태국 사람들은 매운 음식을 먹는 것을 즐긴다. 똠얌꿍은 인기 있는 태국 수프이다. 그것은 맵고 신맛이 난다. 똠얌꿍은 그 안에 새우가 들어 있다. 사람들은 밥과 함께 똠얌꿍을 먹는 것을 좋아한다. 그것은 냄새가 좋다. 그것은 정말 맛있다."];var DG=[{"dlg":[["Andy","Wow! The food truck is here. What do you want to try, Yena?","와! 푸드트럭이 왔어. 뭘 먹어 보고 싶니, 예나야?"],["Yena","I’m not sure, Andy. Everything looks delicious.","잘 모르겠어, Andy. 모든 게 맛있어 보여."],["Andy","How about a taco?","타코는 어때?"],["Yena","What’s that?","그게 뭐야?"],["Andy","It’s my favorite Mexican food. It has beef and cheese in it.","그건 내가 가장 좋아하는 멕시코 음식이야. 그 안에 소고기와 치즈가 들어 있어."],["Yena","It looks delicious. I’d like to try it.","맛있어 보인다. 먹어 보고 싶어."],["
