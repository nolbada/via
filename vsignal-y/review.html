<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Y 누적 복습</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Source+Serif+4:wght@400;600&display=swap">
<style>
/* layout: day grid home, one question per screen, sentence is the hero */
:root{--bg:#f4f6f9;--card:#fff;--ink:#17202b;--sub:#5b6776;--line:#d9dfe7;--accent:#1f4fd1;--accent-ink:#fff;--ok:#16794a;--ok-bg:#e3f4ea;--bad:#b3261e;--bad-bg:#fbe7e5;--mark:#fff3b8;--font:'Noto Sans KR',system-ui,sans-serif;--serif:'Noto Sans KR','Malgun Gothic','Apple SD Gothic Neo',system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10151c;--card:#19212b;--ink:#e8edf3;--sub:#9aa7b6;--line:#2c3744;--accent:#7ea2ff;--accent-ink:#0c1220;--ok:#6fd3a0;--ok-bg:#12301f;--bad:#ff9b92;--bad-bg:#3a1916;--mark:#4a4113;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10151c;--card:#19212b;--ink:#e8edf3;--sub:#9aa7b6;--line:#2c3744;--accent:#7ea2ff;--accent-ink:#0c1220;--ok:#6fd3a0;--ok-bg:#12301f;--bad:#ff9b92;--bad-bg:#3a1916;--mark:#4a4113;color-scheme:dark}
:root{--s-bg:#dbeafe;--s-fg:#1e40af;--v-bg:#dfe5ee;--v-fg:#1e293b;--o-bg:#dcfce7;--o-fg:#166534;--c-bg:#ffedd5;--c-fg:#9a3412;--m-bg:#ede9fe;--m-fg:#5b21b6;--cj-bg:#e5e7eb;--cj-fg:#374151}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--s-bg:#1e2f5c;--s-fg:#bfdbfe;--v-bg:#3a4658;--v-fg:#e2e8f0;--o-bg:#14392a;--o-fg:#bbf7d0;--c-bg:#4a2410;--c-fg:#fed7aa;--m-bg:#34235e;--m-fg:#ddd6fe;--cj-bg:#2f3340;--cj-fg:#d1d5db}}
:root[data-theme="dark"]{--s-bg:#1e2f5c;--s-fg:#bfdbfe;--v-bg:#3a4658;--v-fg:#e2e8f0;--o-bg:#14392a;--o-fg:#bbf7d0;--c-bg:#4a2410;--c-fg:#fed7aa;--m-bg:#34235e;--m-fg:#ddd6fe;--cj-bg:#2f3340;--cj-fg:#d1d5db}
.bd{display:inline-block;border-radius:8px;font-weight:700;font-size:12px;padding:2px 8px;margin-right:6px;vertical-align:1px}
.bd.v{background:var(--v-bg);color:var(--v-fg)}.bd.m{background:var(--m-bg);color:var(--m-fg)}.bd.s{background:var(--s-bg);color:var(--s-fg)}.bd.c{background:var(--c-bg);color:var(--c-fg)}.bd.o{background:var(--o-bg);color:var(--o-fg)}.bd.cj{background:var(--cj-bg);color:var(--cj-fg)}
.stru{margin-top:12px;display:grid;gap:6px;font-size:15px}.ko{margin-top:10px;font-size:14px;color:var(--sub)}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding-inline:16px;padding-block:20px}
main{max-width:640px;margin:0 auto;display:grid;gap:16px}
h1{font-size:18px;margin:0}
.top{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap}
.top span,.sub{color:var(--sub);font-size:13px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .3s}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:20px;display:grid;gap:16px;min-width:0}
.tag{font-size:12px;letter-spacing:.06em;color:var(--sub)}
.tag b{color:var(--accent);font-weight:700}
.q{font-size:14px;color:var(--sub);margin:0}
.sent{font-family:var(--serif);font-size:20px;line-height:1.8;margin:0;text-align:left;word-break:keep-all}
.w{display:inline;padding:1px 2px;border-radius:4px}
.w.cl{background:var(--mark)}
.pick .w{cursor:pointer;border-bottom:1px dashed var(--sub)}
.pick .w:hover,.pick .w:focus-visible{background:var(--line);outline:2px solid var(--accent)}
.w.bad{background:var(--bad-bg);color:var(--bad)}
.w.good{background:var(--ok-bg);color:var(--ok);font-weight:600}
.blank{display:inline-block;min-width:56px;border-bottom:2px solid var(--accent);text-align:center}
.row{display:flex;gap:10px;flex-wrap:wrap}
button{font:inherit;font-weight:500;padding:12px 20px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;min-height:44px}
button.main{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.opt{flex:1 1 40%;text-align:center}
.col button.opt{flex:1 1 100%;text-align:left;display:block}
.col3 button.opt{flex:1 1 100%}
button.opt .ex1{display:block;font-family:var(--serif);font-size:16px}
button.opt .ex2{display:block;font-size:12px;color:var(--sub);margin-top:2px}
button.opt.ok .ex2,button.opt.no .ex2{color:inherit}
button.opt.ok{background:var(--ok-bg);border-color:var(--ok);color:var(--ok)}
button.opt.no{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.res{padding:12px 14px;border-radius:8px;font-weight:700}
.res.ok{background:var(--ok-bg);color:var(--ok)}
.res.no{background:var(--bad-bg);color:var(--bad)}
.memo{border-left:3px solid var(--accent);padding:2px 0 2px 12px;font-size:15px}
.memo small{display:block;color:var(--sub);font-size:12px;margin-bottom:2px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:8px}
.grid button{padding:8px 0;min-height:56px;display:grid;gap:0;line-height:1.2}
.grid small{font-size:11px;color:var(--sub)}
.grid .done{border-color:var(--ok);background:var(--ok-bg)}
.grid .done small{color:var(--ok)}
.grid .part{border-color:var(--bad)}
.grid .part small{color:var(--bad)}
.grid h2{grid-column:1/-1;font-size:13px;margin:6px 0 0;color:var(--sub);font-weight:500}
.done-card .score{font-size:40px;font-weight:700;font-variant-numeric:tabular-nums}
.list{display:grid;gap:6px;font-size:15px}
.steps{margin:0;padding-left:20px}
.note{font-size:12px;color:var(--sub);margin:0}
.wk{border-bottom:2px dotted #8794a3;cursor:pointer}.wks{border-bottom:2px solid #16a34a;font-weight:700}
.wkd{margin-top:10px;padding:10px 12px;border-radius:10px;background:rgba(120,140,160,.15);font-size:15px;line-height:1.5}.wkm{font-size:13px;opacity:.8}.wsf{font-weight:400;opacity:.75}.wguide{margin:10px 0;padding:10px 12px;border-radius:10px;background:rgba(120,140,160,.15);font-size:14px;line-height:1.6}
</style>
<main>
 <div class="top"><h1><a href="./" style="color:inherit;text-decoration:none">&larr;</a> Y 누적 복습</h1><a id="wlink" href="words.html" style="color:var(--accent);font-weight:700;font-size:14px;text-decoration:none">내 단어장</a><span id="pos"></span></div>
 <div class="bar"><i id="bar"></i></div>
 <div id="stage"></div>
</main>
<!--WB:BEGIN--><script>var WD={"f1_0":{"t":"avoid","m":"동명사(V-ing)를 목적어로 사용 (avoid to do X)","d":1,"x":"f"},"f1_1":{"t":"hand in","m":"이어동사. 목적어가 대명사일 경우 hand it in","d":1,"x":"f"},"f1_2":{"t":"run","m":"다의어. 목적어 없으면 ‘작동하다’, 있으면 ‘운영하다’","d":1,"x":"f"},"f2_3":{"t":"lend","m":"4형식 수여동사. lend + 사람 + 사물 또는 3형식 lend + 사물 + to + 사람 구조로 사용","d":2,"x":"f"},"f2_4":{"t":"remain","m":"2형식 연결동사. 주어의 상태를 설명하는 형용사나 명사 보어가 필요","d":2,"x":"f"},"f2_5":{"t":"react to","m":"자동사구. 반응의 대상 앞에 반드시 전치사 to가 필요","d":2,"x":"f"},"f3_6":{"t":"look","m":"2형식 연결동사. look + 형용사또는 look like + 명사구조로 사용","d":3,"x":"f"},"f3_7":{"t":"explain","m":"4형식으로 착각하기 쉬운 3형식 동사. explain + 내용 + to + 사람순서로 사용","d":3,"x":"f"},"f3_8":{"t":"reply to","m":"자동사구. 대답의 대상 앞에 반드시 전치사 to가 필요","d":3,"x":"f"},"f4_9":{"t":"lie","m":"자동사 눕다, 놓여 있다(lie - lay - lain)","d":4,"x":"f"},"f4_10":{"t":"lay","m":"타동사 놓다, 눕히다(lay - laid - laid)","d":4,"x":"f"},"f4_11":{"t":"oppose","m":"타동사. ~에 반대하다. 전치사 없이 목적어를 바로 사용","d":4,"x":"f"},"f5_12":{"t":"consider","m":"3형식일 때 동명사(V-ing)를 목적어로 사용(①고려하다) 5형식일 때 consider + 목적어 + 명사/형용사 구조로 사용(②~라고 여기다)","d":5,"x":"f"},"f5_13":{"t":"address","m":"목적어가 '문제'이면 '다루다, 해결하다', '청중'이면 '연설하다'로 해석되는 다의어","d":5,"x":"f"},"f5_14":{"t":"feel like Ving","m":"~하고 싶다는 의미의 관용 표현. like 뒤에 반드시 동명사(V-ing)를 사용","d":5,"x":"f"},"f6_15":{"t":"discuss","m":"~에 대해 논의하다라는 의미지만, 전치사 about 없이 목적어를 바로 사용하는 타동사","d":6,"x":"f"},"f6_16":{"t":"find","m":"3형식(find + 목적어)일 때 '발견하다, 알다', 5형식(find + 목적어 + 형용사) 일 때 '~라고 생각하다'로 의미가 확장됨","d":6,"x":"f"},"f6_17":{"t":"taste","m":"2형식(taste + 형용사 보어) 일 때 '맛이 ~한 상태이다'는 주어의 상태를 나타냄. 3형식 (taste + 목적어) 일 때 '맛을 보다'는 능동적 동작으로 사용됨","d":6,"x":"f"},"f7_18":{"t":"count","m":"단독으로 쓰이면 '중요하다'(1형식), count on은 '의지하다', count A as B는 'A를 B로 여기다'등 구조에 따라 의미가 달라지는 다의어","d":7,"x":"f"},"f7_19":{"t":"answer","m":"~에 대답하다라는 의미지만, 전치사 to 없이 목적어를 바로 사용하는 타동사","d":7,"x":"f"},"f7_20":{"t":"advise","m":"advise + 사람 + to do형태로, 목적격 보어로 to부정사를 사용하는 대표적인 5형식 동사","d":7,"x":"f"},"f8_21":{"t":"graduate from","m":"~을 졸업하다. 반드시 전치사 from이 필요","d":8,"x":"f"},"f8_22":{"t":"order","m":"5형식으로 쓰일 때 목적격 보어로 to부정사를 사용하여 ~가 ...하도록 명령하다는 의미로 사용","d":8,"x":"f"},"f8_23":{"t":"be covered with","m":"~으로 덮여 있다. 행위자가 아닌 재료나 도구를 나타낼 때 by 대신 with를 사용하는 수동태","d":8,"x":"f"},"f9_24":{"t":"take care of","m":"~을 돌보다. 세 단어가 하나의 동사처럼 쓰이며 look after와 유사","d":9,"x":"f"},"f9_25":{"t":"delay","m":"동명사(V-ing)를 목적어로 사용. to부정사는 사용하지 않음 (delay to do X)","d":9,"x":"f"},"f9_26":{"t":"inform A of B","m":"A(사람)에게 B(내용)를 알리다. 내용 앞에 전치사 of가 반드시 필요","d":9,"x":"f"},"f10_27":{"t":"apply A to B","m":"A(이론/지식)를 B(상황)에 적용하다. apply for(~에 지원하다)와 구별 필요","d":10,"x":"f"},"f10_28":{"t":"be busy Ving","m":"~하느라 바쁘다. busy 뒤에 반드시 동명사(V-ing)를 사용","d":10,"x":"f"},"f10_29":{"t":"listen to","m":"~을 듣다. 듣는 대상 앞에 전치사 to가 반드시 필요","d":10,"x":"f"},"f11_30":{"t":"appear","m":"1형식 나타나다, 2형식 ~처럼 보이다. 자동사이므로 수동태 불가 (be appeared X)","d":11,"x":"f"},"f11_31":{"t":"forgive A for B","m":"A(사람)를 B(이유)에 대해 용서하다. 이유 앞에 전치사 for가 필요","d":11,"x":"f"},"f12_32":{"t":"mention","m":"~을 언급하다. 전치사 about 없이목적어를 바로 사용","d":12,"x":"f"},"f12_33":{"t":"do","m":"충분하다, 괜찮다. 1형식 자동사로 쓰이며 주로 will do형태로 사용","d":12,"x":"f"},"f12_34":{"t":"put off","m":"~을 미루다, 연기하다. 동명사(V-ing)를 목적어로 사용하며 대명사는 중간에 위치(put it off)","d":12,"x":"f"},"f13_35":{"t":"practice","m":"동명사(V-ing)를 목적어로 사용. to부정사는 사용하지 않음","d":13,"x":"f"},"f13_36":{"t":"come up with","m":"(아이디어·계획 등을) 떠올리다, 생각해내다. 세 단어가 하나의 동사처럼 쓰임","d":13,"x":"f"},"f13_37":{"t":"fill A with B","m":"A를 B로 채우다. 수동태 be filled with로도 자주 사용됨","d":13,"x":"f"},"f14_38":{"t":"include","m":"포함하다. conclude(끝내다)와 혼동 주의","d":14,"x":"f"},"f14_39":{"t":"conclude","m":"끝내다, 결론짓다. 공식적인 마무리의 의미","d":14,"x":"f"},"f14_40":{"t":"protect A from B","m":"A를 B로부터 보호하다. 위협 요소 앞에 from이 필요","d":14,"x":"f"},"f15_41":{"t":"leave","m":"3형식 떠나다, 5형식 ~한 상태로 만들다등 문형에 따라 의미가 달라짐","d":15,"x":"f"},"f15_42":{"t":"can't help Ving","m":"~하지 않을 수 없다. 관용적으로 동명사(V-ing)만 사용","d":15,"x":"f"},"f15_43":{"t":"come across","m":"우연히 마주치다, 발견하다. 의도치 않은 만남을 의미","d":15,"x":"f"},"f16_44":{"t":"describe","m":"설명하다. 4형식으로 쓸 수 없으며 describe A to B형태로 사용","d":16,"x":"f"},"f16_45":{"t":"turn down","m":"① 거절하다 ② (소리를) 낮추다. 대명사는 반드시 중간에 위치 (turn it down)","d":16,"x":"f"},"f16_46":{"t":"remind A of B","m":"A에게 B를 생각나게 하다. remind A to do와 구별 필요","d":16,"x":"f"},"f17_47":{"t":"involve","m":"~을 포함하다, 수반하다. 목적어로 동명사(V-ing)를 자주 사용하며 evolve(진화하다)와 혼동 주의","d":17,"x":"f"},"f17_48":{"t":"evolve","m":"~에서 ~로 진화/발전하다. 자동사이며 from A into B 형태와 자주 쓰임","d":17,"x":"f"},"f17_49":{"t":"participate in","m":"~에 참여하다. 활동이나 행사 앞에 반드시 전치사 in이 필요","d":17,"x":"f"},"f18_50":{"t":"cause","m":"~가 ...하게 만들다. 목적격 보어로 to부정사를 사용하는 5형식 동사이며, 보통 부정적인 결과를 야기할 때 자주 사용됨","d":18,"x":"f"},"f18_51":{"t":"call off","m":"취소하다. cancel과 같은 의미이며, 목적어가 대명사일 경우 call it off처럼 중간에 위치","d":18,"x":"f"},"f18_52":{"t":"be surprised at","m":"~에 놀라다. 감정의 원인 앞에 by가 아닌 전치사 at을 사용하는 대표적인 수동태 표현","d":18,"x":"f"},"f19_53":{"t":"suggest","m":"제안하다. 목적어로 동명사(V-ing)나 that절을 사용하며 to부정사는 쓰지 않음","d":19,"x":"f"},"f19_54":{"t":"sell","m":"팔다(타동사), (잘) 팔리다(자동사). 주어가 상품일 때 자동사로 자주 쓰임","d":19,"x":"f"},"f19_55":{"t":"thank A for B","m":"A에게 B에 대해 고마워하다. 감사 이유 앞에 전치사 for가 필요","d":19,"x":"f"},"f20_56":{"t":"offer","m":"제공하다, 제안하다. 4형식 수여동사로 offer + 사람 + 사물구조로 사용","d":20,"x":"f"},"f20_57":{"t":"fall down","m":"넘어지다, 쓰러지다. fall과 유사하나 완전히 넘어지는 동작을 강조하는 자동사구","d":20,"x":"f"},"f20_58":{"t":"be interested in","m":"~에 관심이 있다. 흥미를 유발하는 대상 앞에 in을 사용하는 수동태 관용 표현","d":20,"x":"f"},"f21_59":{"t":"tear","m":"철자는 같지만 발음과 뜻이 전혀 다른 다의어 ① [ter] 찢다 (동사): 불규칙 동사(tear-tore-torn) 변화에 주의 ② [tɪər] 눈물 (명사)","d":21,"x":"f"},"f21_60":{"t":"spend+시간/돈+Ving","m":"~하는 데 시간/돈을 쓰다. spend 뒤에 목적어(시간/돈)와 동명사(V-ing)가 오는 관용 표현","d":21,"x":"f"},"f21_61":{"t":"help oneself to","m":"~을 마음껏 먹다/쓰다. 주어에 맞는 재귀대명사(oneself, themselves 등)를 사용해야 함","d":21,"x":"f"},"f22_62":{"t":"greet","m":"~에게 인사하다. '~에게'라는 뜻이 있지만 전치사 없이 목적어를 바로 사용하는 타동사","d":22,"x":"f"},"f22_63":{"t":"take off","m":"① 벗다(타동사) ② 이륙하다(자동사). 문맥에 따라 의미가 달라지는 다의어이며, 대명사 목적어는 반드시 take it off처럼 중간에 위치","d":22,"x":"f"},"f22_64":{"t":"view A as B","m":"A를 B로 여기다. A와 B 사이에 전치사 as가 반드시 필요한 3형식 패턴 동사(A는 목적어, as B는 수식어)","d":22,"x":"f"},"f23_65":{"t":"elect","m":"~을 ...으로 선출하다. elect + 목적어 + 목적격 보어구조의 5형식 동사이며, 보어 앞에 as를 쓰지 않음","d":23,"x":"f"},"f23_66":{"t":"mind","m":"꺼리다. 동명사(V-ing)를 목적어로 사용하며 Do you mind ~ing?는 정중한 요청 표현","d":23,"x":"f"},"f23_67":{"t":"stand for","m":"① ~을 나타내다, 상징하다 ②~을 지지하다. 문맥에 따라 의미가 달라지는 다의어 동사구","d":23,"x":"f"},"f24_68":{"t":"correct / collect","m":"고치다 / 모으다. 철자가 비슷하여 혼동하기 쉬운 동사. correct는 '틀린 것을 바로잡다', collect는 '여러 개를 한데 모으다'라는 의미","d":24,"x":"f"},"f24_69":{"t":"make use of","m":"~을 (효과적으로) 이용하다. use보다 더 적극적으로 활용한다는 뉘앙스를 가짐","d":24,"x":"f"},"f25_70":{"t":"break down","m":"‘고장 나다, 실패하다, 감정이 무너지다’ 등 문맥에 따라 의미가 달라지는 다의어 자동사구","d":25,"x":"f"},"f25_71":{"t":"be tired of","m":"~에 싫증 나다, 지긋지긋하다. 반복되는 일에 대한 정신적 피로를 나타내며, 원인 앞에 of 를 사용. be tired from(육체적 피로)과 구별 필요","d":25,"x":"f"},"f25_72":{"t":"compare A with B","m":"A와 B를 비교하다. 비교 대상 사이에 전치사 with가 필요","d":25,"x":"f"},"f26_73":{"t":"keep","m":"보관하다(3형식), ~인 상태를 유지하다(2, 5형식) 등 문장 구조에 따라 의미가 달라지는 핵심 다의어 동사","d":26,"x":"f"},"f26_74":{"t":"marry","m":"~와 결혼하다. 전치사 with 없이 목적어를 바로 사용하는 타동사","d":26,"x":"f"},"f26_75":{"t":"bring up","m":"기르다, 양육하다(사람), (화제를) 꺼내다(사물) 등 목적어에 따라 의미가 달라지는 다의어 동사구","d":26,"x":"f"},"f27_76":{"t":"simulate vs. stimulate","m":"모의실험하다, 자극하다. 철자가 비슷해 혼동하기 쉬운 동사. simulate는 '모방', stimulate는 '촉진'의 의미","d":27,"x":"f"},"f27_77":{"t":"resemble","m":"~을 닮다, 유사하다. 사람, 사물 모두 사용 가능하며, with 같은 전치사 없이 목적어를 바로 사용하는 타동사. look like로 바꿔 쓸 수 있음. take after는 가족 간에만 사용되므로 구분 필요","d":27,"x":"f"},"f28_78":{"t":"allow","m":"~가 ...하도록 허락하다. 목적어의 행동을 to부정사로 표현하는 대표적인 5형식 동사.","d":28,"x":"f"},"f28_79":{"t":"announce","m":"발표하다. 4형식으로 쓸 수 없으며, 듣는 사람 앞에 반드시 to가 필요한 3형식 동사.","d":28,"x":"f"},"f28_80":{"t":"look up","m":"찾아보다(정보), 올려다보다(시선). 목적어나 문맥에 따라 의미가 달라지는 다의어 동사구.","d":28,"x":"f"},"f29_81":{"t":"matter","m":"중요하다, 문제가 되다. 주어와 동사만으로 의미가 완전한 1형식 자동사","d":29,"x":"f"},"f29_82":{"t":"figure out","m":"알아내다, 생각해 내다, 이해하다. understand, solve와 유사하지만, 생각해서 답을 찾아내는 과정을 강조하는 동사구","d":29,"x":"f"},"f29_83":{"t":"be satisfied with","m":"~에 만족하다. 감정의 원인이 되는 대상 앞에 by가 아닌 전치사 with를 사용하는 대표적인 수동태 관용 표현","d":29,"x":"f"},"f30_84":{"t":"expect","m":"~가 ...할 것으로 기대하다. 목적어의 행동을 to부정사로 표현하는 대표적인 5형식 동사. hope와 달리, 어떤 근거를 가지고 가능성이 높다고 예상하는 뉘앙스","d":30,"x":"f"},"f30_85":{"t":"be worth Ving","m":"~할 가치가 있다. worth 뒤에는 반드시 동명사(V-ing)가 와야 하는 관용 표현. to부정사는 올 수 없음","d":30,"x":"f"},"f30_86":{"t":"take A for B","m":"A를 B로 착각하다. A를 B로 잘못 판단했다는 의미의 관용 표현으로, A와 B 사이에 전치사 for가 필수적","d":30,"x":"f"},"f31_87":{"t":"enjoy","m":"~하는 것을 즐기다. 동명사(V-ing)를 목적어로 사용하는 대표 동사. to부정사는 올 수 없음","d":31,"x":"f"},"f31_88":{"t":"be known to","m":"~에게 알려져 있다. 정보가 알려진 대상(사람) 앞에 전치사 to를 사용. be known for (~로 유명하다), be known as(~로서 알려져 있다)와 구별 필요","d":31,"x":"f"},"f31_89":{"t":"result in","m":"~을 초래하다. 원인이 결과를 낳는다는 의미의 동사구. 원인을 나타내는 result from(~에서 비롯되다)과 구별해야 함.","d":31,"x":"f"},"f32_90":{"t":"expand / expend","m":"확장하다, 소모하다. 철자가 비슷해 혼동하기 쉬운 동사. expand는 크기나 범위를 '넓히는' 것, expend는 돈이나 에너지를 '쓰는' 것","d":32,"x":"f"},"f32_91":{"t":"warn A of B","m":"A에게 B를 경고하다. 경고 대상(A)과 위험 내용(B) 사이에 전치사 of 가 필요한 패턴. warn A that 절형태로도 자주 쓰임","d":32,"x":"f"},"f33_92":{"t":"promise","m":"약속하다. promise + 사람 + 사물(4형식), promise + to do, promise + that 절 등 다양한 구조로 사용 가능","d":33,"x":"f"},"f33_93":{"t":"be known for","m":"~로 유명하다. 명성의 '이유' 앞에 전치사 for를 사용. be known to (~에게 알려지다), be known as (~로서 알려지다)와 구별 필요","d":33,"x":"f"},"f33_94":{"t":"result from","m":"~에서 비롯되다. 결과 result from 원인의 구조로, 원인을 나타내는 동사구. 원인이 결과를 낳는 result in과 반드시 구별해야 함","d":33,"x":"f"},"f34_95":{"t":"bear","m":"참다, 견디다(can't bear), 낳다(be born), 명심하다(bear in mind)등 문맥에 따라 의미가 달라지는 핵심 다의어 동사. 불규칙 변화(bear-bore-born/borne)에 주의","d":34,"x":"f"},"f34_96":{"t":"stop","m":"~하는 것을 멈추다. 목적어로 **동명사(V-ing)**를 사용. stop to do(~하기 위해 멈추다)와 의미를 반드시 구별해야 함","d":34,"x":"f"},"f34_97":{"t":"apologize to","m":"~에게 사과하다. 사과 대상(사람) 앞에 to, 사과 이유 앞에 for를 사용하는 패턴 (apologize to 사람 / for 이유)","d":34,"x":"f"},"f35_98":{"t":"rise","m":"오르다, 뜨다. 목적어가 필요 없는 자동사. 불규칙 변화(rise-rose-risen)에 주의","d":35,"x":"f"},"f35_99":{"t":"raise","m":"올리다, 기르다, 모금하다. 목적어가 반드시 필요한 타동사. 규칙 변화(raise-raised-raised)이며, rise와 혼동하지 않도록 주의","d":35,"x":"f"},"f35_100":{"t":"put A into B","m":"A를 B에 넣다. 물리적인 이동을 나타내는 기본적인 동사구 패턴","d":35,"x":"f"},"f36_101":{"t":"account for","m":"설명하다, (비율을) 차지하다, 원인이 되다 등 문맥에 따라 의미가 달라지는 다의어 동사구이다.","d":36,"x":"f"},"f36_102":{"t":"be used to Ving","m":"~하는 데 익숙하다. '~하기 위해 사용되다'(be used to do)와 형태가 비슷하지만, to 뒤에 동명사(V-ing)를 사용하여 '익숙함'을 나타내는 관용 표현이다.","d":36,"x":"f"},"f36_103":{"t":"take into account","m":"~을 고려하다. take, into, account 세 단어가 하나의 동사처럼 쓰이며, consider와 유사하다.","d":36,"x":"f"},"f37_104":{"t":"inquire vs. require","m":"문의하다 / 요구하다. 철자가 비슷해 혼동하기 쉬운 동사이다. inquire는 정보를 '묻는 것', require는 필요에 의해 '요구하는 것'을 의미한다.","d":37,"x":"f"},"f37_105":{"t":"turn","m":"turn은 문맥과 뒤따르는 구조(형용사 보어 vs. 목적어 + into B) 에 따라 의미가 상태 변화와 완전한 전환으로 달라지므로, 문장 구조 신호를 주의 깊게 확인해야 한다.","d":37,"x":"f"},"f38_106":{"t":"read","m":"읽다(타동사), ~라고 쓰여 있다, ~하게 읽히다(자동사) 등 문맥에 따라 의미가 달라지는 다의어 동사이다.","d":38,"x":"f"},"f38_107":{"t":"reach","m":"~에 도착하다. '~에'라는 의미가 있지만 at, to 같은 전치사 없이 목적어를 바로 사용하는 타동사이다.","d":38,"x":"f"},"f38_108":{"t":"add to","m":"~을 더하다, 늘리다. 기존에 있던 것에 무언가를 추가하여 '정도'를 심화시키는 뉘앙스의 동사구이다.","d":38,"x":"f"},"f39_109":{"t":"demand","m":"요구하다. demand + to do, demand + that 절 등 강한 요구를 나타내며, 4형식으로는 쓸 수 없는 동사이다.","d":39,"x":"f"},"f39_110":{"t":"be known as","m":"~로서 알려져 있다. 주어의 '자격'이나 '별칭' 앞에 as를 사용한다. be known for (~로 유명하다) 와 구별할 필요가 있다.","d":39,"x":"f"},"f39_111":{"t":"go","m":"~한 상태가 되다. 2형식 동사로 쓰여 주어의 상태 변화를 나타낸다. 주로 부정적인 변화 (go bad, go dead)에 사용된다.","d":39,"x":"f"},"f40_112":{"t":"stand","m":"서다, ~을 참다, 견디다(can't stand). 문맥에 따라 의미가 달라지는 다의어이며, '참다'의 의미일 때 목적어로 동명사(V-ing)를 사용한다.","d":40,"x":"f"},"f40_113":{"t":"take place","m":"(계획된 행사가) 열리다, 개최되다. happen(우연히 발생하다)과 달리, 미리 계획된 사건에 사용되는 동사구이다.","d":40,"x":"f"},"f40_114":{"t":"divide A into B","m":"A를 B로 나누다. 나누는 대상(A)과 결과물(B) 사이에 전치사 into가 필요한 패턴이다.","d":40,"x":"f"},"f41_115":{"t":"cost","m":"~에게 ...을 잃게 하다. cost + 사람 + 사물(4형식) 구조로 쓰여, 주로 기회나 대가와 같은 추상적인 것을 잃게 만들었다는 부정적 뉘앙스를 가진다.","d":41,"x":"f"},"f41_116":{"t":"fix","m":"① 고치다, 해결하다 ② 고정시키다. 문맥에 따라 의미가 달라지는 다의어이다.","d":41,"x":"f"},"f41_117":{"t":"get rid of","m":"~을 제거하다, 없애다. 세 단어가 하나의 동사처럼 쓰이는 동사구이다.","d":41,"x":"f"},"f42_118":{"t":"command vs. commend","m":"명령하다 / 칭찬하다. 철자가 비슷해 혼동하기 쉬운 동사이다. command는 권위를 가지고 지시하는 것, commend는 공식적으로 칭찬하는 것을 의미한다.","d":42,"x":"f"},"f42_119":{"t":"depend on","m":"~에 의존하다, ~에 달려 있다. 의존하는 대상 앞에 전치사 on이 반드시 필요한 동사구이다. rely on과 유사하다.","d":42,"x":"f"},"f43_120":{"t":"appreciate","m":"① ~의 진가를 알아보다 ② 고마워하다. 문맥에 따라 의미가 달라지는 다의어이다. ①은 가치를 이해하는 것, ②는 친절에 감사하는 것을 의미한다.","d":43,"x":"f"},"f43_121":{"t":"be composed of","m":"~으로 구성되다. consist of 와 유사하며, 구성 요소 앞에 전치사 of를 사용하는 수동태 관용 표현이다.","d":43,"x":"f"},"f43_122":{"t":"confuse A with B","m":"A를 B와 혼동하다. 혼동하는 두 대상 사이에 전치사 with가 필요한 패턴 동사이다.","d":43,"x":"f"},"f44_123":{"t":"enter","m":"~에 들어가다. '~에'라는 의미가 있지만 into 같은 전치사 없이 목적어를 바로 사용하는 타동사이다.","d":44,"x":"f"},"f44_124":{"t":"take advantage of","m":"~을 (유리하게) 이용하다. 세 단어가 하나의 동사처럼 쓰이는 동사구로, 긍정적으로는 '활용하다', 부정적으로는 '악용하다'는 뉘앙스를 가진다.","d":44,"x":"f"},"f44_125":{"t":"blame A for B","m":"B에 대해 A를 탓하다. 비난의 대상(A)과 이유(B) 사이에 전치사 for가 필요한 패턴 동사이다.","d":44,"x":"f"},"f45_126":{"t":"persuade","m":"~가 ...하도록 설득하다. 목적어의 행동을 to부정사로 표현하는 대표적인 5형식 동사이다.","d":45,"x":"f"},"f45_127":{"t":"look forward to Ving","m":"~하는 것을 고대하다. to가 전치사이므로 뒤에 반드시 동명사(V-ing)를 사용하는 관용 표현이다.","d":45,"x":"f"},"f45_128":{"t":"keep up with","m":"~을 따라잡다, 뒤처지지 않다. 세 단어가 하나의 동사처럼 쓰이는 동사구이다.","d":45,"x":"f"},"f46_129":{"t":"transfer / transform","m":"옮기다 / 완전히 바꾸다. 철자가 비슷해 혼동하기 쉬운 동사이다. transfer는 위치 이동, transform은 형태나 성질의 완전한 변화를 의미한다.","d":46,"x":"f"},"f46_130":{"t":"imagine","m":"상상하다. 목적어로 동명사(V-ing)를 사용하거나 imagine that 절, imagine + 목적어 + 목적격 보어(5형식) 등 다양한 구조로 사용된다.","d":46,"x":"f"},"f47_131":{"t":"charge","m":"요금을 청구하다, 기소하다, 충전하다 등 문맥에 따라 의미가 달라지는 다의어이다.","d":47,"x":"f"},"f47_132":{"t":"put up with","m":"~을 참다, 견디다. 세 단어가 하나의 동사처럼 쓰이는 동사구로, tolerate와 유사하다.","d":47,"x":"f"},"f47_133":{"t":"prevent A from B","m":"A가 B하는 것을 막다. 대상(A)과 막는 행위(B) 사이에 전치사 from이 필요한 패턴 동사이다.","d":47,"x":"f"},"f48_134":{"t":"attend","m":"참석하다, 돌보다, 집중하다(attend to), 수반하다,동반하다 등 문맥에 따라 의미가 달라지는 다의어이다.","d":48,"x":"f"},"f48_135":{"t":"be made of","m":"~으로 만들어지다. 재료의 물리적 성질이 유지될 때 사용한다. 화학적 변화가 일어난 경우 be made from을 사용한다.","d":48,"x":"f"},"f48_136":{"t":"replace A with B","m":"A를 B로 교체하다. 교체 대상(A)과 새로운 것(B) 사이에 전치사 with가 필요한 패턴 동사이다.","d":48,"x":"f"},"f49_137":{"t":"approach","m":"~에 접근하다, 다가가다. '~에'라는 의미가 있지만 to 같은 전치사 없이 목적어를 바로 사용하는 타동사이다.","d":49,"x":"f"},"f49_138":{"t":"be made from","m":"~으로 만들어지다. 재료가 화학적 변화를 거쳐 원래의 성질을 잃었을 때 사용한다. 물리적 성질이 유지되는 be made of와 구별할 필요가 있다.","d":49,"x":"f"},"f49_139":{"t":"run out of","m":"~을 다 써버리다. 세 단어가 하나의 동사처럼 쓰이며, 보유하고 있던 것이 고갈됨을 의미하는 동사구이다.","d":49,"x":"f"},"f50_140":{"t":"propose","m":"제안하다. 목적어로 동명사(V-ing)나 that절을 사용하며, 4형식 구조로는 쓸 수 없는 동사이다.","d":50,"x":"f"},"f50_141":{"t":"show off","m":"자랑하다, 뽐내다. 두 단어가 하나의 동사처럼 쓰이는 동사구이다.","d":50,"x":"f"},"f50_142":{"t":"provide A with B","m":"A에게 B를 제공하다. 제공받는 사람(A)과 제공하는 물건(B) 사이에 전치사 with가 필요한 패턴 동사이다.","d":50,"x":"f"},"f51_143":{"t":"adapt vs. adopt","m":"적응하다 / 입양하다, 채택하다. 철자가 비슷해 혼동하기 쉬운 동사이다. adapt는 환경에 '맞추는 것', adopt는 새로운 것을 '받아들이는 것'을 의미한다.","d":51,"x":"f"},"f51_144":{"t":"present","m":"주다, 수여하다(4형식 불가), 발표하다, (어려움을) 안겨주다 등 문맥에 따라 의미가 달라지는 다의어이다. present A with B(A에게 B를 주다) 패턴으로 자주 사용된다.","d":51,"x":"f"},"f52_145":{"t":"fit","m":"(치수·모양이) 맞다(자동사), (상황·장소에) 어울리다(자동사), ~에 맞추다(타동사) 등 문맥에 따라 의미가 달라지는 다의어이다.","d":52,"x":"f"},"f52_146":{"t":"take charge of","m":"~을 책임지다, 맡다. 세 단어가 하나의 동사처럼 쓰이는 동사구이다.","d":52,"x":"f"},"f52_147":{"t":"distinguish A from B","m":"A와 B를 구별하다. 구별되는 두 대상 사이에 from을 사용하여 A와 B를 분리하는 패턴 동사이다.","d":52,"x":"f"},"f53_148":{"t":"admit","m":"인정하다. 목적어로 동명사(V-ing)를 사용하며, to부정사는 쓰지 않는다. admit that 절 형태로도 사용 가능하다.","d":53,"x":"f"},"f53_149":{"t":"be based on","m":"~에 근거하다, 기반을 두다. 주어의 근거나 출처를 나타내는 관용 표현.","d":53,"x":"f"},"f53_150":{"t":"mean","m":"① ~을 의미하다(3형식) ② ~할 의도이다(mean to do). 문맥에 따라 의미가 달라지는 다의어.","d":53,"x":"f"},"f54_151":{"t":"become","m":"① ~가 되다(2형식) ② ~에 어울리다(3형식, 예: Bright colors become her). 형식에 따라 의미가 달라지는 다의어이다.","d":54,"x":"f"},"f54_152":{"t":"contribute to Ving","m":"~하는 데 기여하다. to가 전치사이므로뒤에 반드시 동명사(V-ing)가 오는 관용 표현이다.","d":54,"x":"f"},"f54_153":{"t":"separate A from B","m":"A를 B와 분리하다. 분리되는 두 대상 사이에 전치사 from이 필요한 패턴 동사이다.","d":54,"x":"f"},"f55_154":{"t":"deny","m":"부인하다. 목적어로 **동명사(V-ing)**를 사용하며, to부정사는 쓰지 않는다. deny that 절 형태로도 사용 가능하다.","d":55,"x":"f"},"f55_155":{"t":"be contented with","m":"~에 만족하다. be satisfied with와 유사하며, 감정의 원인 앞에 전치사 with를 사용한다.","d":55,"x":"f"},"f55_156":{"t":"refer","m":"① ~을 언급하다(refer to) ② ~을 알아보도록 하다(refer A to B) ③ ~을 나타내다. 문맥에 따라 의미가 달라지는 다의어이다.","d":55,"x":"f"},"f56_157":{"t":"access vs. assess","m":"접근하다 / 평가하다. 발음과 철자가 비슷해 혼동하기 쉬운 동사이다. access는 '들어가거나 이용하는 것', assess는 '가치를 판단하는 것'을 의미한다.","d":56,"x":"f"},"f56_158":{"t":"exchange A for B","m":"A를 B로 교환하다. 교환하는 두 대상 사이에 전치사 for가 필요한 패턴 동사이다.","d":56,"x":"f"},"f57_159":{"t":"pay","m":"① (돈을) 지불하다 ② 이득이 되다, 보람이 있다. 문맥에 따라 의미가 달라지는 다의어이다. ②번 의미는 주로 부정문(won't pay)이나 in the long run과 함께 사용된다.","d":57,"x":"f"},"f57_160":{"t":"substitute for","m":"~을 대신하다, 대타로 나서다. 두 단어가 하나의 동사처럼 쓰이는 동사구로, 대신하는 대상 앞에 전치사 for가 필요하다.","d":57,"x":"f"},"f57_161":{"t":"quit Ving","m":"~하는 것을 그만두다. 목적어로 동명사(V-ing)를 사용하는 대표 동사이다.","d":57,"x":"f"},"f58_162":{"t":"object to","m":"~에 반대하다. to가 전치사이므로 뒤에 명사나 동명사(V-ing)가 오는 관용 표현이다.","d":58,"x":"f"},"f58_163":{"t":"prefer A to B","m":"B보다 A를 선호하다. 비교 대상 사이에 than이 아닌 전치사 to를 사용하여 선호를 나타내는 패턴 동사이다.","d":58,"x":"f"},"f58_164":{"t":"settle","m":"① (문제를) 해결하다 ② (마음을) 진정시키다 ③ 정착하다. 문맥에 따라 의미가 달라지는 다의어이다.","d":58,"x":"f"},"f59_165":{"t":"give up Ving","m":"~하는 것을 포기하다. 목적어로 동명사(V-ing)를 사용하는 대표 동사구이다.","d":59,"x":"f"},"f59_166":{"t":"survive","m":"살아남다. 전치사 없이 목적어를 바로 취하는 타동사(survive the winter) 또는 목적어 없이 쓰이는 자동사(managed to survive)로 모두 사용 가능하다.","d":59,"x":"f"},"f59_167":{"t":"save","m":"① (노력을) 덜어주다(4형식) ② (자리를) 맡아주다(4형식) ③ 구하다. 문맥에 따라 의미가 달라지는 다의어이다.","d":59,"x":"f"},"f60_168":{"t":"confirm vs. conform","m":"확인하다, 확정하다 / (규칙 등을) 따르다, 순응하다. 철자가 비슷해 혼동하기 쉬운 동사이다. confirm은 사실을 '확인', conform은 규칙에 '순응'하는 것이다.","d":60,"x":"f"},"f60_169":{"t":"postpone","m":"연기하다, 미루다. 목적어로 동명사(V-ing)를 사용하며, to부정사는 쓰지 않는다. put off와 유사하다.","d":60,"x":"f"},"f61_170":{"t":"change A into B","m":"A를 B로 바꾸다. A가 B로 변화할 때 전치사 into가 필요하다.","d":61,"x":"f"},"f61_171":{"t":"long for","m":"~을 갈망하다, 그리워하다. 간절한 바람이나 그리움을 나타내는 동사구이다.","d":61,"x":"f"},"f61_172":{"t":"hold","m":"① (행사 등을) 열다 ② (무게를) 지탱하다 ③ (감정 등을) 참다. 문맥에 따라 의미가 달라지는 다의어이다.","d":61,"x":"f"},"f62_173":{"t":"leap vs. reap","m":"껑충 뛰다 / 거두다, 수확하다. 발음과 철자가 비슷해 혼동하기 쉬운 동사이다. leap는 도약, reap은 노력의 결과를 얻는 것을 의미한다.","d":62,"x":"f"},"f62_174":{"t":"treat","m":"① 대하다, 여기다 ② 치료하다 ③ 대접하다. 문맥에 따라 의미가 달라지는 핵심 다의어이다.","d":62,"x":"f"},"f63_175":{"t":"inhibit vs. inhabit","m":"억제하다 / 서식하다. 발음과 철자가 비슷해 혼동하기 쉬운 동사이다. inhibit는 방해, inhabit는 거주를 의미한다.","d":63,"x":"f"},"f63_176":{"t":"relate A to B","m":"A를 B와 관련시키다. 두 대상(A와 B) 사이에 논리적 연결고리를 만들 때 전치사 to가 필요한 패턴 동사이다.","d":63,"x":"f"},"f64_177":{"t":"introduce","m":"소개하다. 4형식으로 쓸 수 없으며, 소개하는 내용 뒤에 듣는 사람을 쓸 때는 to가 필요한 3형식 동사이다.","d":64,"x":"f"},"f64_178":{"t":"adjust to Ving","m":"~하는 데 적응하다. to가 전치사이므로 뒤에 반드시 동명사(V-ing)를 사용하는 관용 표현이다.","d":64,"x":"f"},"f64_179":{"t":"give off","m":"(빛·냄새·열 등을) 내다, 발산하다. 두 단어가 하나의 동사처럼 쓰이는 동사구이다.","d":64,"x":"f"},"f11_180":{"t":"consist of","m":"~로 구성되다. 항상 of와 함께 쓰며 수동태로 쓰지 않음 (be consisted of X)","d":11,"x":"f"},"m1_0":{"t":"platform","p":"명","k":"플랫폼","d":1,"x":"m"},"m1_1":{"t":"distracted","p":"형","k":"주의가 산만해진","d":1,"x":"m"},"m1_2":{"t":"lack","p":"동/명","k":"부족하다; 부족","d":1,"x":"m"},"m1_3":{"t":"topic sentence","p":"구","k":"주제문","d":1,"x":"m"},"m1_4":{"t":"non-profit","p":"형","k":"비영리의","d":1,"x":"m"},"m1_5":{"t":"emotional care","p":"구","k":"정서적 돌봄","d":1,"x":"m"},"m1_6":{"t":"contain","p":"동","k":"포함하다","d":1,"x":"m"},"m1_7":{  var h='<div class="card done-card"><div class="tag">학습 완료 &middot; 틀린 문제 복습</div><div class="score">'+score+' / '+cur.list.length+'</div>';
 h+='<div>맞힌 문제는 3일, 7일, 14일처럼 간격을 두고 다시 나오고, 틀린 문제는 내일 다시 나옵니다.</div><div class="ko">남은 틀린 문제 '+left+'개</div>';
 h+='<div class="row"><button class="main" id="hm">Day 목록</button></div></div>';stage.innerHTML=h;document.getElementById('hm').onclick=home}
function start(n){cur={n:n,list:pickQs(n)};qi=0;score=0;wrong=[];show()}
function head(){document.getElementById('pos').textContent=(cur.wb?'틀린 문제 복습 ':'Day '+cur.n+' 복습 ')+(qi+1)+' / '+cur.list.length;document.getElementById('bar').style.width=(qi/cur.list.length*100)+'%'}
function words(tok,o){o=o||{};return tok.map(function(w,i){var c='w';if(o.cl&&i>=o.cl[0]&&i<o.cl[1])c+=' cl';if(o.good&&o.good.indexOf(i)>=0)c+=' good';if(o.bad===i)c+=' bad';
  var inner=(o.blank===i)?'<span class="blank">'+(o.fill?esc(o.fill):'&nbsp;&nbsp;&nbsp;&nbsp;')+'</span>':esc(w);
  return '<span class="'+c+'" data-i="'+i+'"'+(o.tap?' tabindex="0" role="button"':'')+'>'+inner+'</span>'}).join(' ')}
function card(tag,qtext,sent,extra){return '<div class="card'+(extra&&extra.pick?' pick':'')+'"><div class="tag">'+tag+'</div><p class="q">'+qtext+'</p><p class="sent" id="s">'+sent+'</p><div id="ex"></div></div>'}
function show(){head();var o=cur.list[qi],q=o.q,t=q.t,tag='문제 '+(qi+1);
 if(t==='struct_anc'){stage.innerHTML=card(tag+' &middot; <b>구조</b>','노란색 절은 앞의 어떤 말을 꾸밀까요? 그 말을 누르세요.',words(q.tok,{cl:q.clause,tap:1}),{pick:1});tapMode(function(i){return q.ans.indexOf(i)>=0},function(ok){return finish(ok,words(q.tok,{cl:q.clause,good:q.ans}),(q.note||''),'<div><span class="bd m">꾸미는 절</span>'+esc(q.tok.slice(q.clause[0],q.clause[1]).join(' '))+'</div><div><span class="bd s">꾸미는 말</span>'+esc(q.ans.slice().sort(function(a,b){return a-b}).map(function(i){return q.tok[i].replace(/[^A-Za-z\'-]/g,'')}).join(' '))+'</div>')})}
 else if(t==='struct_main'){stage.innerHTML=card(tag+' &middot; <b>구조</b>','이 문장 전체의 본동사를 누르세요.',words(q.tok,{tap:1}),{pick:1});tapMode(function(i){return q.ans.indexOf(i)>=0},function(ok){return finish(ok,words(q.tok,{good:q.ans}),(q.note||''),'<div><span class="bd v">본동사</span>'+esc(q.ans.slice().sort(function(a,b){return a-b}).map(function(i){return q.tok[i].replace(/[^A-Za-z\'-]/g,'')}).join(' '))+'</div>')})}
 else if(t==='struct_adv'){stage.innerHTML=card(tag+' &middot; <b>구조</b>','노란색 부사절은 어떤 뜻으로 쓰였나요?',words(q.tok,{cl:q.clause}));optMode(q.opts,q.ans,function(ok){return finish(ok,words(q.tok,{cl:q.clause}),(q.note||''),'<div><span class="bd cj">부사절</span>'+esc(q.tok.slice(q.clause[0],q.clause[1]).join(' '))+'</div><div><span class="bd c">'+esc(q.ans)+'</span>'+esc(ADV[q.ans]||'')+'</div>')},(function(){var L={};q.opts.forEach(function(x){L[x]=advLab(x)});return L})())}
 else if(t==='use_prep'){stage.innerHTML=card(tag+' &middot; <b>'+esc(q.verb)+'</b>','빈칸에 알맞은 말을 고르세요.',words(q.tok,{blank:q.bi}));optMode(q.opts,q.ans,function(ok){return finish(ok,words(q.tok,{blank:q.bi,fill:q.ans}),q.memo||('짝 전치사: '+q.verb))})}
 else if(t==='use_pair'){stage.innerHTML=card(tag+' &middot; <b>'+(q.form?esc(q.verb):'헷갈리는 동사')+'</b>',(q.form?'빈칸에 알맞은 형태를 고르세요.':'빈칸에 들어갈 동사의 원형을 고르세요.'),words(q.tok,{blank:q.bi}));optMode(q.opts,q.ans,function(ok){return finish(ok,words(q.tok,{good:[q.bi]}),q.pm?(q.memo||''):q.verb+': '+(q.memo||''),q.pm?q.pm.map(function(p){return '<div><span class="bd '+(p[0]===q.ans?'o':'c')+'">'+esc(p[0])+'</span>'+esc(p[1])+(p[0]===q.ans?' (이 문장의 정답)':'')+'</div>'}).join(''):'')})}
 else if(t==='use_sent'){stage.innerHTML=card(tag+' &middot; <b>'+esc(q.verb)+'</b>','노란색 동사가 쓰인 문장은 몇 형식인가요?',words(q.tok,{cl:[q.bi,q.bi+1]}));optMode(q.opts,q.ans,function(ok){return finish(ok,words(q.tok,{cl:[q.bi,q.bi+1]}),q.ans+' ('+PAT[q.ans][1]+'), 대표 문장: '+PAT[q.ans][0]+' '+(q.memo?'· '+q.memo:''))},PL)}
 else if(t==='use_mean'){stage.innerHTML=card(tag+' &middot; <b>동사구</b>','노란색 부분의 뜻은 무엇인가요?',words(q.tok,{cl:q.clause}));optMode(q.opts,q.ans,function(ok){return finish(ok,words(q.tok,{cl:q.clause}),q.verb+': '+(q.memo||''))})}
 else if(t==='use_t5'){t5(q,tag)}
}
var PAT={'1형식':['I sleep.','S + V'],'2형식':['I am happy.','S + V + 보어'],'3형식':['I like apples.','S + V + 목적어'],'4형식':['I give him a book.','S + V + 간접목적어 + 직접목적어'],'5형식':['I make him happy.','S + V + 목적어 + 목적격보어']};
var PL={};Object.keys(PAT).forEach(function(k){PL[k]='<b>'+k+'</b><span class="ex1">'+esc(PAT[k][0])+'</span><span class="ex2">'+esc(PAT[k][1])+'</span>'});
var ADV={'이유':'~때문에','양보':'~에도 불구하고','시간':'~할 때','결과':'그 결과 ~하다','목적':'~하기 위해','조건':'만약 ~라면','대조':'~인 반면에'};
function advLab(x){return '<b>'+esc(x)+'</b> <span class="ex2" style="display:inline">('+esc(ADV[x]||'')+')</span>'}
function tapMode(isOk,done){var s=document.getElementById('s');function go(e){var w=e.target.closest('.w');if(!w)return;s.onclick=null;s.onkeydown=null;done(isOk(+w.dataset.i))}s.onclick=go;s.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e)}}}
function optMode(opts,ans,done,labels){var ex=document.getElementById('ex');ex.className='row'+(labels?' col':(opts.length===3?' col3':''));ex.innerHTML=opts.map(function(x,i){return '<button class="opt" data-v="'+esc(x)+'">'+(labels?labels[x]:esc(x))+'</button>'}).join('');
 ex.querySelectorAll('button').forEach(function(b){b.onclick=function(){ex.querySelectorAll('button').forEach(function(x){x.disabled=true;if(x.dataset.v===ans)x.classList.add('ok')});if(b.dataset.v!==ans)b.classList.add('no');done(b.dataset.v===ans)}})}
function t5(q,tag){var tk=q.tok.slice(),bad=-1;if(q.wrong){tk.splice(q.vi+1,0,q.prep);bad=q.vi+1}
 stage.innerHTML=card(tag+' &middot; <b>'+esc(q.verb)+'</b>','이 문장이 맞나요?',words(tk))+'';
 var ex=document.getElementById('ex');ex.className='row';ex.innerHTML='<button id="y">맞아요</button><button id="n" class="main">틀렸어요</button>';
 function fin(ok,msg){finish(ok,words(tk,{bad:bad}),(q.memo||'')) ;var r=document.getElementById('res');if(r){r.textContent=msg}}
 document.getElementById('y').onclick=function(){fin(!q.wrong,q.wrong?'틀린 문장이었습니다.':'맞아요. 원문 그대로입니다.')};
 document.getElementById('n').onclick=function(){
  if(!q.wrong){fin(false,'이 문장은 맞는 문장입니다.');return}
  document.querySelector('.q').textContent='틀린 단어를 누르세요.';ex.innerHTML='';
  var s=document.getElementById('s');s.parentNode.classList.add('pick');s.innerHTML=words(tk,{tap:1});
  function go(e){var w=e.target.closest('.w');if(!w)return;s.onclick=null;s.onkeydown=null;var ok=(+w.dataset.i===bad);fin(ok,ok?'정답입니다.':'틀린 단어는 따로 있습니다.')}
  s.onclick=go;s.onkeydown=function(e){if(e.key==='Enter'||e.key===' '){e.preventDefault();go(e)}}}}
function finish(ok,sentHtml,expl,badges){
 var cq=cur.list[qi];if(ok)score++;else wrong=wrong.concat(cq.it.nos);if(cur.wb)wbQDone(cq.id,ok);else if(!ok)wbAddQ(cq.it,cq.q);
 document.getElementById('s').innerHTML=sentHtml;document.getElementById('s').parentNode.classList.remove('pick');if(cq.q.tok&&!(cq.q.t==='use_t5'&&cq.q.wrong))wkBind(document.getElementById('s'),cq.it.k,cq.q.tok);
 var ex=document.getElementById('ex');if(ex.querySelector('.opt')){}else{ex.className='';ex.innerHTML=''}
 var h='<div class="res '+(ok?'ok':'no')+'" id="res">'+(ok?'정답입니다.':'아쉽습니다.')+'</div>';
 if(badges)h+='<div class="stru">'+badges+'</div>';
 if(expl)h+='<div class="memo" style="margin-top:12px"><small>설명</small>'+esc(expl)+'</div>';
 var ko=cur.list[qi].it.ko;if(ko)h+='<div class="ko"><b>해석</b> '+esc(ko)+'</div>';
 h+='<div class="row" style="margin-top:12px"><button class="main" id="nx">'+(qi<cur.list.length-1?'다음':'결과 보기')+'</button></div>';
 var box=document.createElement('div');box.innerHTML=h;document.getElementById('s').parentNode.appendChild(box);
 document.getElementById('nx').onclick=function(){qi++;qi<cur.list.length?show():end()};
}
function end(){
 if(cur.wb){endWb();return}
 document.getElementById('bar').style.width='100%';document.getElementById('pos').textContent='Day '+cur.n+' 복습 완료';
 var st=load();var uniq=wrong.filter(function(v,i,a){return a.indexOf(v)===i}).sort(function(a,b){return a-b});
 st[cur.n]={score:score,total:cur.list.length,wrong:uniq,t:Date.now()};save(st);
 var h='<div class="card done-card"><div class="tag">학습 완료 &middot; Day '+cur.n+' 복습</div><div class="score">'+score+' / '+cur.list.length+'</div>';
 if(uniq.length){h+='<div class="list"><div>교재 Part 2 &middot; Day '+cur.n+' 복습 페이지에서 아래 번호 문장만 표시하세요.</div><div><b>'+uniq.join('번, ')+'번</b></div><ol class="steps"><li>빈칸에 이 문장에서 쓰인 동사의 뜻을 적는다.</li><li>본동사에 동그라미.</li><li>가장 안쪽 절에 괄호.</li></ol></div>'}
 else h+='<div>모두 맞았습니다. 교재에서 할 일은 없습니다.</div>';
 h+='<div class="row"><button id="again">다시 풀기</button><button class="main" id="hm">Day 목록</button></div></div>';
 stage.innerHTML=h;
 document.getElementById('again').onclick=function(){start(cur.n)};document.getElementById('hm').onclick=home;
}
home();if(location.hash==='#wrong')startWrong();window.addEventListener('hashchange',function(){if(location.hash==='#wrong')startWrong()});
</script>
