unt's wedding. Do you seeing the thing on her shoulder?", "ko": "여기 제 이모 결혼식 사진이 있어요. 그녀의 어깨 위에 있는 물건이 보이나요?", "ok": false, "foot": [], "fixes": [{"wrong": "seeing", "right": "see", "partial": false, "at": [9], "point": "조동사 do 뒤 동사원형: Do 뒤에는 동사원형 see", "topic": "조동사 do 뒤 동사원형", "memo": "Do 뒤에는 동사원형 see"}]}, {"n": 7, "tag": null, "en": "It's a flatbread. It is so big what it covers her shoulder.", "ko": "그것은 플랫브레드예요. 그것은 매우 커서 그녀의 어깨를 덮어요.", "ok": false, "foot": [], "fixes": [{"wrong": "what", "right": "that", "partial": false, "at": [7], "point": "so ~ that 구문: '너무 ~해서 …하다'는 so ~ that", "topic": "so ~ that 구문", "memo": "'너무 ~해서 …하다'는 so ~ that"}]}, {"n": 8, "tag": null, "en": "We believe that putting the bread over the shoulder bring good lucks.", "ko": "우리는 그 빵을 어깨 위에 올려두는 것이 행운을 가져온다고 믿어요.", "ok": false, "foot": [], "fixes": [{"wrong": "bring", "right": "brings", "partial": false, "at": [9], "point": "주어와 동사의 수일치: 동명사구 주어는 단수라 brings", "topic": "주어와 동사의 수일치", "memo": "동명사구 주어는 단수라 brings"}, {"wrong": "lucks", "right": "luck", "partial": false, "at": [11], "point": "불가산명사: luck은 셀 수 없는 명사", "topic": "불가산명사", "memo": "luck은 셀 수 없는 명사"}]}, {"n": 9, "tag": null, "en": "A flatbread made only from flour, salt, and water. We eat this bread at every meal, but we make it bigger on special days.", "ko": "플랫브레드는 밀가루, 소금, 물로만 만들어져요. 우리는 매 끼니에 이 빵을 먹지만, 특별한 날에는 더 크게 만들어요.", "ok": false, "foot": [], "fixes": [{"wrong": "made", "right": "is made", "partial": false, "at": [2], "point": "수동태: 빵이 '만들어지는' 것이라 is made", "topic": "수동태", "memo": "빵이 '만들어지는' 것이라 is made"}]}, {"n": 10, "tag": null, "en": "So, everyone in the community get together and help out. Baking the bread together makes our community stronger.", "ko": "그래서 공동체에 있는 모든 사람이 함께 모여서 도와줘요. 함께 빵을 굽는 일은 우리 공동체를 더욱 단단하게 만들어 줘요.", "ok": false, "foot": [], "fixes": [{"wrong": "get", "right": "gets", "partial": false, "at": [5], "point": "주어와 동사의 수일치: everyone은 단수 취급이라 gets", "topic": "주어와 동사의 수일치", "memo": "everyone은 단수 취급이라 gets"}, {"wrong": "help", "right": "helps", "partial": false, "at": [8], "point": "병렬 구조와 수일치: gets와 병렬이므로 helps", "topic": "병렬 구조와 수일치", "memo": "gets와 병렬이므로 helps"}]}, {"n": 11, "tag": "싱가포르 · 호커 센터", "en": "I'm Vivian! Have you hear of hawker centers in Singapore?", "ko": "저는 Vivian이에요! 여러분은 싱가포르에 있는 호커 센터에 대해 들어 본 적 있나요?", "ok": false, "foot": [], "fixes": [{"wrong": "hear", "right": "heard", "partial": false, "at": [4], "point": "현재완료: Have you + 과거분사 heard", "topic": "현재완료", "memo": "Have you + 과거분사 heard"}]}, {"n": 12, "tag": null, "en": "Hawkers are people which sell food on the street. They formed the hawker centers and these centers have became a huge food community.", "ko": "호커는 길거리에서 음식을 파는 사람들을 말해요. 그들이 호커 센터를 만들었고, 이 센터들이 거대한 음식 공동체가 되었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "which", "right": "who", "partial": false, "at": [3], "point": "주격 관계대명사: 선행사가 사람이라 who", "topic": "주격 관계대명사", "memo": "선행사가 사람이라 who"}, {"wrong": "became", "right": "become", "partial": false, "at": [18], "point": "현재완료: have + 과거분사 become", "topic": "현재완료", "memo": "have + 과거분사 become"}]}, {"n": 13, "tag": null, "en": "These centers are so popular that they are always full of people. There is all kinds of food, from Chinese noodles to Malaysian curry to Indonesian satay.", "ko": "이 센터들은 매우 인기 있어서 늘 사람들로 가득 차요. 중국식 국수부터 말레이시아식 카레, 인도네시아식 사테까지 모든 종류의 음식들이 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [13], "point": "There be 구문의 수일치: all kinds of food는 복수 취급이라 are", "topic": "There be 구문의 수일치", "memo": "all kinds of food는 복수 취급이라 are"}]}, {"n": 14, "tag": null, "en": "My friends and I are from different countries. We all have different food tastes.", "ko": "제 친구들과 저는 서로 다른 나라 출신이에요. 우리는 모두 음식 취향이 달라요.", "ok": true, "foot": [], "fixes": []}, {"n": 15, "tag": null, "en": "But at the hawker centers, we can always find something we like. Sometimes, we share the tables with strangers and end up to become friends.", "ko": "하지만 호커 센터에서 우리는 항상 우리가 좋아하는 것을 찾을 수 있어요. 때때로 우리는 낯선 사람들과 테이블을 함께 쓰다가 친구가 되기도 해요.", "ok": false, "foot": [], "fixes": [{"wrong": "to become", "right": "becoming", "partial": false, "at": [22], "point": "end up -ing: end up 뒤에는 동명사", "topic": "end up -ing", "memo": "end up 뒤에는 동명사"}]}, {"n": 16, "tag": null, "en": "It is fun to enjoy the food with good people. That's because I love this hawker culture.", "ko": "좋은 사람들과 함께 음식을 즐기는 건 재미있어요. 그게 제가 이 호커 문화를 사랑하는 이유예요.", "ok": false, "foot": [], "fixes": [{"wrong": "because", "right": "why", "partial": false, "at": [11], "point": "관계부사: That's why: 그것이 ~하는 이유이다", "topic": "관계부사", "memo": "That's why: 그것이 ~하는 이유이다"}]}];var PP=[["Gimjang in Korea", "한국의 김장", 1], ["Hello, I'm Minchan!", "안녕하세요, 저는 민찬이에요!", 0], ["Today, my family and I are at my grandmother's house to do gimjang.", "오늘 저희 가족과 저는 김장을 하기 위해 할머니 댁에 있어요.", 0], ["What is gimjang?", "김장은 무엇일까요?", 0], ["It is a Korean cultural tradition to get together and make a lot of kimchi before winter comes.", "그것은 겨울이 오기 전에 함께 모여 많은 김치를 만드는 한국의 문화적 전통이에요.", 0], ["Gimjang is more than making kimchi.", "김장은 김치를 만드는 것 이상이에요.", 0], ["It's also about spending time with family.", "그것은 또한 가족과 시간을 보내는 것에 관한 것이에요.", 0], ["It is always good to get together.", "함께 모이는 것은 언제나 좋아요.", 0], ["Do you also have any special food traditions?", "여러분도 어떤 특별한 음식 전통이 있나요?", 0], ["Flatbread in Azerbaijan", "아제르바이잔의 플랫브레드", 1], ["Hi, I'm Emil!", "안녕하세요, 저는 Emil이에요!", 0], ["We also have this kind of cultural tradition in Azerbaijan.", "아제르바이잔에도 이런 종류의 문화적 전통이 있어요.", 0], ["Here's a picture from my aunt's wedding.", "여기 제 이모 결혼식 사진이 있어요.", 0], ["Do you see the thing on her shoulder?", "그녀의 어깨 위에 있는 물건이 보이나요?", 0], ["It's a flatbread.", "그것은 플랫브레드예요.", 0], ["It is so big that it covers her shoulder.", "그것은 매우 커서 그녀의 어깨를 덮어요.", 0], ["We believe that putting the bread over the shoulder brings good luck.", "우리는 그 빵을 어깨 위에 올려두는 것이 행운을 가져온다고 믿어요.", 0], ["A flatbread is made only from flour, salt, and water.", "플랫브레드는 밀가루, 소금, 물로만 만들어져요.", 0], ["We eat this bread at every meal, but we make it bigger on special days.", "우리는 매 끼니에 이 빵을 먹지만, 특별한 날에는 더 크게 만들어요.", 0], ["So, everyone in the community gets together and helps out.", "그래서 공동체에 있는 모든 사람이 함께 모여서 도와줘요.", 0], ["Baking the bread together makes our community stronger.", "함께 빵을 굽는 일은 우리 공동체를 더욱 단단하게 만들어 줘요.", 0], ["Hawker Centers in Singapore", "싱가포르의 호커 센터", 1], ["I'm Vivian!", "저는 Vivian이에요!", 0], ["Have you heard of hawker centers in Singapore?", "여러분은 싱가포르에 있는 호커 센터에 대해 들어 본 적 있나요?", 0], ["Hawkers are people who sell food on the street.", "호커는 길거리에서 음식을 파는 사람들을 말해요.", 0], ["They formed the hawker centers and these centers have become a huge food community.", "그들이 호커 센터를 만들었고, 이 센터들이 거대한 음식 공동체가 되었어요.", 0], ["These centers are so popular that they are always full of people.", "이 센터들은 매우 인기 있어서 늘 사람들로 가득 차요.", 0], ["There are all kinds of food, from Chinese noodles to Malaysian curry to Indonesian satay.", "중국식 국수부터 말레이시아식 카레, 인도네시아식 사테까지 모든 종류의 음식들이 있어요.", 0], ["My friends and I are from different countries.", "제 친구들과 저는 서로 다른 나라 출신이에요.", 0], ["We all have different food tastes.", "우리는 모두 음식 취향이 달라요.", 0], ["But at the hawker centers, we can always find something we like.", "하지만 호커 센터에서 우리는 항상 우리가 좋아하는 것을 찾을 수 있어요.", 0], ["Sometimes, we share the tables with strangers and end up becoming friends.", "때때로 우리는 낯선 사람들과 테이블을 함께 쓰다가 친구가 되기도 해요.", 0], ["It is fun to enjoy the food with good people.", "좋은 사람들과 함께 음식을 즐기는 건 재미있어요.", 0], ["That's why I love this hawker culture.", "그게 제가 이 호커 문화를 사랑하는 이유예요.", 0]];var RNUM=67;var TITLE_EN="Food Brings Us Together";var PASS_EN=["Food Brings Us Together", "Gimjang in Korea", "Hello, I'm Minchan! Today, my family and I are at my grandmother's house to do gimjang. What is gimjang? It is a Korean cultural tradition to get together and make a lot of kimchi before winter comes. Gimjang is more than making kimchi. It's also about spending time with family. It is always good to get together. Do you also have any special food traditions?", "Flatbread in Azerbaijan", "Hi, I'm Emil! We also have this kind of cultural tradition in Azerbaijan. Here's a picture from my aunt's wedding. Do you see the thing on her shoulder? It's a flatbread. It is so big that it covers her shoulder. We believe that putting the bread over the shoulder brings good luck. A flatbread is made only from flour, salt, and water. We eat this bread at every meal, but we make it bigger on special days. So, everyone in the community gets together and helps out. Baking the bread together makes our community stronger.", "Hawker Centers in Singapore", "I'm Vivian! Have you heard of hawker centers in Singapore? Hawkers are people who sell food on the street. They formed the hawker centers and these centers have become a huge food community. These centers are so popular that they are always full of people. There are all kinds of food, from Chinese noodles to Malaysian curry to Indonesian satay. My friends and I are from different countries. We all have different food tastes. But at the hawker centers, we can always find something we like. Sometimes, we share the tables with strangers and end up becoming friends. It is fun to enjoy the food with good people. That's why I love this hawker culture."];var PASS_KO=["음식이 우리를 하나로 만듭니다", "한국의 김장", "안녕하세요, 저는 민찬이에요! 오늘 저희 가족과 저는 김장을 하기 위해 할머니 댁에 있어요. 김장은 무엇일까요? 그것은 겨울이 오기 전에 함께 모여 많은 김치를 만드는 한국의 문화적 전통이에요. 김장은 김치를 만드는 것 이상이에요. 그것은 또한 가족과 시간을 보내는 것에 관한 것이에요. 함께 모이는 것은 언제나 좋아요. 여러분도 어떤 특별한 음식 전통이 있나요?", "아제르바이잔의 플랫브레드", "안녕하세요, 저는 Emil이에요! 아제르바이잔에도 이런 종류의 문화적 전통이 있어요. 여기 제 이모 결혼식 사진이 있어요. 그녀의 어깨 위에 있는 물건이 보이나요? 그것은 플랫브레드예요. 그것은 매우 커서 그녀의 어깨를 덮어요. 우리는 그 빵을 어깨 위에 올려두는 것이 행운을 가져온다고 믿어요. 플랫브레드는 밀가루, 소금, 물로만 만들어져요. 우리는 매 끼니에 이 빵을 먹지만, 특별한 날에는 더 크게 만들어요. 그래서 공동체에 있는 모든 사람이 함께 모여서 도와줘요. 함께 빵을 굽는 일은 우리 공동체를 더욱 단단하게 만들어 줘요.", "싱가포르의 호커 센터", "저는 Vivian이에요! 여러분은 싱가포르에 있는 호커 센터에 대해 들어 본 적 있나요? 호커는 길거리에서 음식을 파는 사람들을 말해요. 그들이 호커 센터를 만들었고, 이 센터들이 거대한 음식 공동체가 되었어요. 이 센터들은 매우 인기 있어서 늘 사람들로 가득 차요. 중국식 국수부터 말레이시아식 카레, 인도네시아식 사테까지 모든 종류의 음식들이 있어요. 제 친구들과 저는 서로 다른 나라 출신이에요. 우리는 모두 음식 취향이 달라요. 하지만 호커 센터에서 우리는 항상 우리가 좋아하는 것을 찾을 수 있어요. 때때로 우리는 낯선 사람들과 테이블을 함께 쓰다가 친구가 되기도 해요. 좋은 사람들과 함께 음식을 즐기는 건 재미있어요. 그게 제가 이 호커 문화를 사랑하는 이유예요."];var BG=[{"qs": [{"n": 6, "q": "윗글의 주제로 알맞은 것은?", "o": ["the origin of Korean gimjang tradition", "various kinds of food people eat in winter", "gimjang as a special Korean food tradition", "the process of making kimchi before winter", "Minchan's plan to learn how to make kimchi"], "a": 2, "ans": "gimjang as a special Korean food tradition", "ko": ["한국 김장 전통의 기원", "사람들이 겨울에 먹는 다양한 음식", "특별한 한국 음식 전통으로서의 김장", "겨울 전에 김치를 만드는 과정", "김치 만드는 법을 배우려는 민찬이의 계획"], "evs": [["It is a Korean cultural tradition to get together and make a lot of kimchi before winter comes.", "그것은 겨울이 오기 전에 함께 모여 많은 김치를 만드는 한국의 문화적 전통이에요."]], "ow": ["오답 ✕ — 김장의 기원은 다루지 않는다.", "오답 ✕ — 겨울에 먹는 다양한 음식이 아니라 김장 하나를 다룬다.", "정답 ○ — 'a Korean cultural tradition to get together and make a lot of kimchi'(함께 모여 많은 김치를 만드는 한국의 문화적 전통)이라고 설명하므로 특별한 한국 음식 전통으로서의 김장이 주제이다.", "오답 ✕ — 'Gimjang is more than making kimchi.'(김치를 만드는 것 이상이다)라고 했으므로 만드는 과정이 중심이 아니다.", "오답 ✕ — 배우려는 계획은 나오지 않는다."], "memo": ["정답 ③: gimjang as a special Korean food tradition(특별한 한국 음식 전통으로서의 김장)", "근거: It is a Korean cultural tradition to get together and make a lot of kimchi before winter comes.(겨울이 오기 전에 함께 모여 많은 김치를 만드는 한국의 문화적 전통)", "함정: 김치 만드는 과정은 일부일 뿐 ✕"], "why": "김장은 가족이 모여 김치를 만드는 한국의 음식 전통이다.", "ev": ["It is a Korean cultural tradition to get together and make a lot of kimchi before winter comes.", "그것은 겨울이 오기 전에 함께 모여 많은 김치를 만드는 한국의 문화적 전통이에요."]}, {"n": 7, "q": "윗글의 내용과 일치하는 것은?", "o": ["Gimjang is a Korean tradition of making kimchi together before winter.", "Minchan is at his own house to do gimjang.", "Gimjang is only about making kimchi.", "Gimjang is done in the middle of summer.", "Minchan does gimjang alone."], "a": 0, "ans": "Gimjang is a Korean tradition of making kimc
