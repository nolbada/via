// ===== UNIT 1 기본 A (p.58) =====
C(1,"A",1,"( ) 안에서 알맞은 말을 고르시오.<br>My backpack is old. I need a new (one / it).",["one","it"],"one","My backpack is old. I need a new one.","내 책가방은 낡았다. 나는 새 것이 필요하다.",
 "본책 p.116 POINT 1 ‘one(s)’ 부분과 아래 ‘내신 적중’ 박스를 같이 보세요.",
 "1) 낡은 backpack(책가방)과 지금 필요하다는 ‘새 가방’은 같은 가방일까요, 같은 종류의 다른 가방일까요?  2) 같은 종류의 아무거나 가리키면 one, 바로 그 물건이면 it이에요.",
 "‘새 책가방’은 지금 가진 그 가방이 아니에요. 같은 종류의 불특정한 것이니 세 글자짜리 쪽이에요.","낡은 것과 다른 새것 = 같은 종류 → one");
C(1,"A",2,"( ) 안에서 알맞은 말을 고르시오.<br>Melissa liked the brown shoes more than the white (ones / others).",["ones","others"],"ones","Melissa liked the brown shoes more than the white ones.","Melissa는 흰색 신발보다 갈색 신발을 더 좋아했다.",
 "본책 p.116 POINT 1 ‘one(s)’ 설명의 두 번째 예문(신발을 고르는 문장)과 괄호 속 설명을 보세요.",
 "1) the white 뒤에 빠진 명사가 뭘까요? 앞에 나온 shoes(신발)예요.  2) shoes는 복수예요. 복수 명사를 대신하는 말을 고르세요.",
 "‘the white + (shoes 대신 쓰는 말)’이에요. 복수형 대명사 one의 복수 형태, 네 글자로 ‘o’로 시작해요.","복수 명사 반복 피하기 → ones");
C(1,"A",3,"( ) 안에서 알맞은 말을 고르시오.<br>I’m looking for my laptop. Have you seen (one / it)?",["one","it"],"it","I’m looking for my laptop. Have you seen it?","나는 내 노트북을 찾고 있어. 너 그것 봤니?",
 "본책 p.116 POINT 1 아래 ‘내신 적중’ 박스(it, them)를 보세요.",
 "1) 찾고 있는 건 my laptop(내 노트북), 즉 딱 정해진 ‘그 물건’이에요.  2) 앞에서 말한 바로 그 대상이면 one이 아니라 다른 쪽을 써요.",
 "정해진 특정 물건이니 불특정한 one은 소거! 두 글자, ‘i’로 시작해요.","특정한 바로 그것 = it (one 아님)");
C(1,"A",4,"( ) 안에서 알맞은 말을 고르시오.<br>This pizza is so good. Can I have (another / the others) slice?",["another","the others"],"another","This pizza is so good. Can I have another slice?","이 피자 정말 맛있다. 한 조각 더 먹어도 될까?",
 "본책 p.116 POINT 2 아래쪽 ● 표시(other와 another 뒤에 명사가 올 때)를 보세요.",
 "1) 빈칸 바로 뒤에 slice(조각)가 있어요. 한 조각일까요, 여러 조각일까요?  2) 단수 명사 앞에는 ‘또 하나의’ 뜻을 가진 말이 와요.",
 "slice는 단수라서 the others(복수)는 안 맞아요. ‘a’로 시작하는 말을 고르세요.","another + 단수 명사 (또 하나의 ~)");
C(1,"A",5,"( ) 안에서 알맞은 말을 고르시오.<br>She has two children. One is five and (other / the other) is seven.",["other","the other"],"the other","She has two children. One is five and the other is seven.","그녀는 아이가 둘 있다. 한 명은 다섯 살이고 다른 한 명은 일곱 살이다.",
 "본책 p.116 POINT 3 ‘부정대명사 구문’ 표의 맨 윗줄(둘 중 하나는 ~, 나머지 하나는 …)을 보세요.",
 "1) children이 몇 명이라고 했나요?  2) 둘 중 한 명을 말하고 나면 남은 사람은 몇 명이죠? 딱 정해지는 한 명이에요.",
 "남은 한 명이 확정되면 앞에 ‘the’가 붙어요. 두 단어이고 ‘the’로 시작해요.","둘 중 하나 one, 나머지 하나 the other");
C(1,"A",6,"( ) 안에서 알맞은 말을 고르시오.<br>Some children like milk, but (another / others) don’t.",["another","others"],"others","Some children like milk, but others don’t.","어떤 아이들은 우유를 좋아하지만 다른 아이들은 좋아하지 않는다.",
 "본책 p.116 POINT 3 표의 셋째 줄(여럿 중 몇몇은 ~, 다른 몇몇은 …)을 보세요.",
 "1) 앞이 Some children(몇몇 아이들)이에요.  2) 뒤 동사가 don’t(원형 do: 하다)인데, 이건 한 명일까요 여러 명일까요?",
 "‘몇몇은 ~, 다른 몇몇은 …’ 짝이에요. 여러 명이라서 s가 붙은 6글자 말이에요.","some … others (몇몇은 ~, 다른 몇몇은 …)");
C(1,"A",7,"( ) 안에서 알맞은 말을 고르시오.<br>I bought this necklace because (another / the others) were too expensive.",["another","the others"],"the others","I bought this necklace because the others were too expensive.","나는 나머지가 너무 비싸서 이 목걸이를 샀다.",
 "본책 p.116 POINT 3 표의 둘째 줄(여럿 중 하나는 ~, 나머지 전부는 …)을 보세요.",
 "1) 목걸이를 하나 골랐죠. 그럼 안 고른 목걸이들은 몇 개일까요?  2) 뒤 동사가 were(원형 be: ~이다)예요. 단수일까요 복수일까요?",
 "were가 복수 동사이고 ‘나머지 전부’를 뜻해요. ‘the’로 시작하고 s로 끝나요.","하나 고르고 나머지 전부 = the others");
C(1,"A",8,"( ) 안에서 알맞은 말을 고르시오.<br>There are three flavors of jelly. One is grape, (other / another) is peach, and the third is orange.",["other","another"],"another","There are three flavors of jelly. One is grape, another is peach, and the third is orange.","젤리는 세 가지 맛이 있다. 하나는 포도, 또 하나는 복숭아, 세 번째는 오렌지이다.",
 "본책 p.116 POINT 3 맨 아래 ● 표시(셋 중 하나는 one, 또 다른 하나는 …)를 보세요.",
 "1) 맛이 세 가지예요. 첫 번째는 One, 마지막은 the third(세 번째)예요.  2) 그럼 가운데 두 번째를 부르는 말은 뭘까요?",
 "셋 중 하나, 또 하나, 나머지 하나 순서예요. 가운데는 ‘a’로 시작하는 7글자 말이에요.","셋 중 one → another → the other[third]");
// ===== UNIT 1 기본 B =====
W(1,"B",1,"(밑줄 친 부분 고치기)<br>I forgot to bring my pen. Can you lend me <u>ones</u>?","one","I forgot to bring my pen. Can you lend me one?","나는 펜을 가져오는 걸 깜빡했어. 하나 빌려줄 수 있니?",
 "본책 p.116 POINT 1 ‘one(s)’ 설명에서 one과 ones의 쓰임 차이를 보세요.",
 "1) 빌려 달라는 건 펜 한 자루예요.  2) 앞 명사(pen)가 단수인지 복수인지 보고 대신하는 말의 수를 맞추세요.",
 "단수니까 s를 떼야 해요. 세 글자 ‘o’로 시작하는 말이에요.","단수 명사 대신 → one, 복수 → ones");
W(1,"B",2,"(밑줄 친 부분 고치기)<br>I will do better next time. Please give me <u>other</u> chance.","another","I will do better next time. Please give me another chance.","다음에는 더 잘할게요. 한 번만 더 기회를 주세요.",
 "본책 p.116 POINT 2 아래 ● 표시(other 뒤는 복수, another 뒤는 단수)를 보세요.",
 "1) 밑줄 뒤 chance(기회)는 단수일까요 복수일까요?  2) 앞에 관사 a나 an 느낌이 없으면 단수 명사 앞에 못 와요.",
 "‘또 한 번의’라는 뜻으로 단수 명사 앞에 쓰는 말로 고쳐요. ‘a’로 시작하는 7글자예요.","other + 복수 / another + 단수 명사");
W(1,"B",3,"(밑줄 친 부분 고치기)<br>I bought two T-shirts. One is blue and <u>another</u> is white.","the other","I bought two T-shirts. One is blue and the other is white.","나는 티셔츠를 두 벌 샀다. 하나는 파란색이고 나머지 하나는 흰색이다.",
 "본책 p.116 POINT 3 표의 첫 줄(둘 중 하나는 ~, 나머지 하나는 …)을 보세요.",
 "1) T-shirts가 모두 몇 벌인가요?  2) 두 벌 중 하나를 말하면 남은 건 딱 한 벌로 정해져요.",
 "정해진 나머지 하나를 말하니 두 단어, ‘the’로 시작해요.","티셔츠 두 벌 → one … the other");
W(1,"B",4,"(밑줄 친 부분 고치기)<br>We should stay at this hotel. <u>The other</u> are all full.","The others","We should stay at this hotel. The others are all full.","우리는 이 호텔에 묵어야 해. 나머지는 전부 꽉 찼어.",
 "본책 p.116 POINT 3 표의 둘째 줄(여럿 중 하나는 ~, 나머지 전부는 …)을 보세요.",
 "1) 이 호텔 하나를 고르고 나머지 호텔들이 꽉 찼다는 말이에요.  2) 뒤 동사가 are(원형 be: ~이다)로 복수예요. 밑줄 말도 복수여야 해요.",
 "‘The’로 시작하고 끝에 s를 붙여요. 두 단어예요.","나머지 전부 → the others (복수)");
W(1,"B",5,"(밑줄 친 부분 고치기)<br>I like your bag. Where did you buy <u>one</u>?","it","I like your bag. Where did you buy it?","네 가방 마음에 들어. 그걸 어디서 샀니?",
 "본책 p.116 POINT 1 아래 ‘내신 적중’ 박스를 보세요.",
 "1) 칭찬한 가방과 어디서 샀냐고 묻는 가방은 같은 물건일까요?  2) 같은 물건이면 ‘특정한 바로 그것’을 뜻하는 대명사를 써요.",
 "바로 그 가방이므로 두 글자 ‘i’로 시작해요.","동일한 특정 대상 → it / them");
W(1,"B",6,"(밑줄 친 부분 고치기)<br><b>A</b> I can’t see well with these glasses.<br><b>B</b> Maybe you should buy new <u>them</u>.","ones","A I can’t see well with these glasses. B Maybe you should buy new ones.","A 이 안경으로는 잘 안 보여. B 새 걸로 사야겠다.",
 "본책 p.116 POINT 1 첫 번째 설명(같은 종류의 불특정한 것을 가리킬 때)을 보세요.",
 "1) 새 안경은 지금 쓰는 그 안경일까요, 같은 종류의 다른 것일까요?  2) 그리고 new(새로운)라는 형용사 바로 뒤에 올 수 있는 건 어떤 대명사일까요?",
 "다른 새 안경이라 ‘같은 종류의 불특정’이에요. 복수라서 ‘o’로 시작하는 4글자예요.","형용사 뒤 대명사는 one(s)");
// ===== UNIT 1 기본 C =====
W(1,"C",1,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그들 중 한 명이 달리기 시작했고, 나머지 사람들이 따라 했다. (others / and / the / followed)<br>→ One of them started to run, ___.","and the others followed","One of them started to run, and the others followed.","그들 중 한 명이 달리기 시작했고, 나머지 사람들이 따라 했다.",
 "본책 p.116 POINT 3 표의 둘째 줄(여럿 중 하나는 ~, 나머지 전부는 …)을 보세요.",
 "1) 앞 문장은 한 명의 이야기, 뒤는 나머지 사람들의 이야기예요.  2) 두 문장을 이어 줄 접속사를 먼저 놓고, 나머지 전부를 뜻하는 말과 동사 followed(원형 follow: 따라 하다)를 이어 보세요.",
 "순서는 ‘접속사 + the + 복수 대명사 + 동사’예요. 첫 단어는 and예요.","one … and the others (나머지 전부)",["others","and","the","followed"]);
W(1,"C",2,"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>어느 것이 네 자동차니, 검은색 아니면 회색이니? (the gray / the black / or / one / one)<br>→ Which is your car, ___?","the black one or the gray one","Which is your car, the black one or the gray one?","어느 것이 네 자동차니, 검은색 차니 회색 차니?",
 "본책 p.116 POINT 1 ‘one(s)’ 설명의 두 번째 예문처럼 ‘the + 형용사 + one(s)’ 쓰임을 보세요.",
 "1) the + 색깔 + one 덩어리를 두 개 만들 수 있어요.  2) 두 덩어리 사이에 선택을 나타내는 or를 넣어요.",

 "1) ‘서로’라는 뜻의 두 단어 표현이에요.  2) 앞에 each가 있으니 짝이 되는 말을 찾으세요.",
 "‘o’로 시작하는 5글자예요.","each other = 서로");

W(2,"SB",1,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>All <u>was</u> calm and quiet in the early morning.","O","All was calm and quiet in the early morning.","이른 아침에는 모든 것이 고요하고 조용했다.",
 "본책 p.118 POINT 3 아래 ● 표시(all이 사물·상황이면 단수 취급)를 보세요.",
 "1) 여기서 All은 사람인가요, 상황인가요?  2) 상황을 나타내면 단수 취급이니 뒤 동사 was와 어울리는지 보세요.",
 "상황을 나타내는 all + 단수 동사 was는 올바른 조합이에요.","all(상황·사물) → 단수 동사");
W(2,"SB",2,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>She was very hungry, so she ate <u>some</u> bread.","O","She was very hungry, so she ate some bread.","그녀는 매우 배가 고파서 빵을 좀 먹었다.",
 "본책 p.118 POINT 1 표의 ‘some — 긍정문’ 칸을 보세요.",
 "1) 문장이 평서문(긍정문)인가요, 부정문인가요?  2) 긍정문의 ‘약간의’에는 어떤 말이 쓰이나요?",
 "긍정문이라 some이 알맞아요. 고칠 곳이 없어요.","평서문의 ‘좀’ = some");
W(2,"SB",3,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br><u>Any</u> time of year is a good time to visit Rome.","O","Any time of year is a good time to visit Rome.","일 년 중 어느 때든 로마를 방문하기 좋은 때이다.",
 "본책 p.118 POINT 1 아래 ● 표시(any가 긍정문에 쓰이면 ‘모든, 어떤 ~라도’)를 보세요.",
 "1) 이 문장은 부정문이 아닌 평서문이에요.  2) any가 긍정문에 쓰이면 어떤 뜻이 된다고 했죠?",
 "‘어떤 때라도’라는 뜻으로 자연스러워요. 고칠 곳이 없어요.","긍정문의 any = 어떤 ~라도");
W(2,"SB",4,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>Are there <u>some</u> other questions?","any","Are there any other questions?","다른 질문 더 있나요?",
 "본책 p.118 POINT 1 표 아래쪽의 ‘의문문’ 칸을 보세요.",
 "1) 단순히 있는지 묻는 의문문이에요.  2) 권유가 아닌 일반 의문문에 쓰는 말을 쓰세요.",
 "‘a’로 시작하는 3글자예요.","일반 의문문 → any");
W(2,"SB",5,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>Every student in my class <u>study</u> hard.","studies","Every student in my class studies hard.","우리 반의 모든 학생은 열심히 공부한다.",
 "본책 p.118 POINT 2 표의 every 칸(단수 취급)을 보세요.",
 "1) 주어는 Every student(단수 취급)예요.  2) 현재형 동사에 3인칭 단수 -s를 붙이세요. study(공부하다)는 y로 끝나는 동사예요.",
 "y를 i로 바꾸고 es를 붙인 7글자예요.","every + 단수 명사 → 동사 -(e)s");
W(2,"SB",6,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>The boys punched <u>one another</u> in boxing class.","O","The boys punched one another in boxing class.","그 소년들은 권투 수업에서 서로를 때렸다.",
 "본책 p.118 POINT 2 아래 첫 번째 ● 표시(‘서로’를 뜻하는 두 가지 표현)를 보세요.",
 "1) 소년들이 여러 명(셋 이상일 수 있어요)이에요.  2) one another도 ‘서로’의 뜻이고, each other와 종종 구분 없이 써요.",
 "one another는 올바른 표현이에요. 고칠 곳이 없어요.","one another = (셋 이상) 서로");
W(2,"SB",7,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>Both laptops <u>was</u> broken.","were","Both laptops were broken.","노트북 두 대가 모두 고장 났다.",
 "본책 p.118 POINT 3 표의 both 칸(복수 취급)을 보세요.",
 "1) Both + 복수 명사(laptops)예요.  2) 복수 주어와 어울리는 과거 be동사를 쓰세요.",
 "‘w’로 시작하는 4글자예요.","both + 복수 명사 → 복수 동사");
W(2,"SB",8,"밑줄 친 부분이 어법상 맞으면 ○를 쓰고, 틀리면 바르게 고치시오.<br>All <u>them</u> were late to work because of the traffic jam.","of them","All of them were late to work because of the traffic jam.","교통 체증 때문에 그들 모두가 직장에 늦었다.",
 "본책 p.118 POINT 3 아래 ● 표시(「all of + 대명사」)와 오른쪽 (X)/(O) 예문을 보세요.",
 "1) all 바로 뒤에 대명사 them이 왔어요.  2) 대명사 앞에는 반드시 필요한 말이 있어요. 생략하면 안 된다고 했죠.",
 "them 앞에 전치사 한 단어를 넣어 ‘~ + them’ 꼴로 써요. 정답은 2단어예요.","all of them (of 필수)");

W(2,"SC",1,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>나는 이번 주말에 아무 계획이 없다. (not, have, any plans)<br>→ ___ this weekend.","I do not[don’t] have any plans","I don’t have any plans this weekend.","나는 이번 주말에 아무 계획이 없다.",
 "본책 p.118 POINT 1 표 아래쪽의 ‘부정문’ 칸을 보세요.",
 "1) 주어 I 뒤에 not을 넣으려면 do가 필요해요.  2) do not 뒤에 have(가지다) + any + 명사 순서예요.",
 "주어 I로 시작하고 any plans로 끝나요. 줄임말을 쓰면 5단어, 안 쓰면 6단어예요.","not이 있으면 any (do not have any ~)");
W(2,"SC",2,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>그 아기들 모두 잠을 자는 중이다. (sleep)<br>→ All ___.","(of) the babies are sleeping","All (of) the babies are sleeping.","그 아기들은 모두 자고 있다.",
 "본책 p.118 POINT 3 표의 ‘all (of) + 복수 명사’ 줄을 보세요.",
 "1) All 뒤에 the + 복수 명사 babies가 와요(of는 있어도 없어도 돼요).  2) 지금 자고 있다 = 현재진행형(be + -ing)이에요. 주어가 복수예요.",
 "the babies 뒤에 복수 be동사(‘a’로 시작하는 3글자)와 sleep의 -ing형을 써요.","all (of) + 복수 명사 → 복수 동사");
W(2,"SC",3,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>우리 둘 다 쌀국수를 좋아한다. (both, us, rice noodle soup)<br>→ ___.","Both of us like rice noodle soup","Both of us like rice noodle soup.","우리 둘 다 쌀국수를 좋아한다.",
 "본책 p.118 POINT 3 표의 both 칸과 아래 ● 표시(「both of + 대명사」)를 보세요.",
 "1) ‘우리 둘 다’를 Both of us로 시작해요.  2) 주어가 복수이므로 동사 like(좋아하다)는 -s 없이 써요.",
 "첫 단어는 Both이고, us 앞에 전치사 하나가 꼭 필요해요. 동사에는 -s를 붙이지 않아요. 총 7단어예요.","both of + 대명사 (of 필수)");
W(2,"SC",4,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>Jessica와 나는 서로 선물을 주었다. (give, each)<br>→ Jessica and I ___ gifts.","gave each other","Jessica and I gave each other gifts.","Jessica와 나는 서로 선물을 주었다.",
 "본책 p.118 POINT 2 아래 첫 번째 ● 표시(‘서로’를 뜻하는 표현)를 보세요.",
 "1) 시제가 과거예요. give(주다)의 과거형이 필요해요.  2) 주어진 each 뒤에 한 단어를 더해 ‘서로(에게)’를 만들고, 바로 gifts를 이어요.",
 "첫 단어는 give의 불규칙 과거형 g로 시작해요. 총 3단어예요.","gave each other + 명사 (서로에게 ~를 주다)");
W(2,"SC",5,"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>몇몇 학생은 나에게 동의했다. (some, agree with)<br>→ ___.","Some students agreed with me","Some students agreed with me.","몇몇 학생들은 나에게 동의했다.",
 "본책 p.118 POINT 1 첫 줄(some은 대명사나 명사 앞 형용사로 쓰일 수 있다)을 보세요.",
 "1) Some 뒤에 명사 students(복수)를 쓸 수 있어요.  2) 과거 동사 agreed(원형 agree: 동의하다) + with + 목적격 대명사 순서예요.",
 "첫 단어는 Some이고 마지막 단어는 me예요. 총 5단어예요.","some + 복수 명사 (몇몇의 ~)");

C(3,"A",1,"( ) 안에서 알맞은 말을 고르시오.<br>He blames (herself / himself) for the accident.",["herself","himself"],"himself","He blames himself for the accident.","그는 그 사고를 자기 탓으로 돌린다.",
 "본책 p.120 POINT 1 표(인칭별 재귀대명사)에서 3인칭을 보세요.",
 "1) 주어가 He(남자)예요.  2) 주어와 같은 사람을 가리켜야 하니 성별을 맞추세요.",
 "herself는 여자를 가리킬 때 써요. 주어가 남자니 남은 쪽이에요.","주어 = 목적어 → 재귀대명사(성별 일치)");
C(3,"A",2,"( ) 안에서 알맞은 말을 고르시오.<br>Did you (yourself / himself) see Eric steal the wallet?",["yourself","himself"],"yourself","Did you yourself see Eric steal the wallet?","네가 직접 Eric이 지갑을 훔치는 걸 봤니?",
 "본책 p.120 POINT 3 ‘강조 용법’(‘직접’, ‘스스로’)을 보세요.",
 "1) 이 문장의 주어는 you예요.  2) 주어를 ‘직접’이라고 강조하는 재귀대명사는 주어와 인칭이 같아야 해요.",
 "2인칭이에요. himself(3인칭)는 소거, ‘y’로 시작하는 8글자예요.","재귀대명사 강조 = 주어와 인칭 일치");
C(3,"A",3,"( ) 안에서 알맞은 말을 고르시오.<br>We should solve the problem (ourself / ourselves).",["ourself","ourselves"],"ourselves","We should solve the problem ourselves.","우리는 그 문제를 직접 해결해야 한다.",
 "본책 p.120 POINT 1 표에서 1인칭 복수 칸을 보세요.",
 "1) 주어 We는 단수일까요 복수일까요?  2) 복수는 -self가 아니라 -selves로 끝나요.",
 "ourself는 틀린 형태예요. -selves로 끝나는 쪽이에요.","1인칭 복수 → ourselves");
C(3,"A",4,"( ) 안에서 알맞은 말을 고르시오.<br>I called (her / herself) to say sorry this morning.",["her","herself"],"her","I called her to say sorry this morning.","나는 오늘 아침에 사과하려고 그녀에게 전화했다.",
 "본책 p.120 POINT 2 첫 줄(주어와 목적어가 같을 때)을 보세요.",
 "1) 주어는 I, 전화한 대상은 다른 여성이에요.  2) 주어와 목적어가 다른 사람이면 재귀대명사를 쓰나요?",
 "주어(I)와 다른 사람이니 재귀가 아닌 일반 목적격이에요. 3글자예요.","주어 ≠ 목적어 → 일반 목적격");
C(3,"A",5,"( ) 안에서 알맞은 말을 고르시오.<br>Emma tried to finish the report by (her / herself).",["her","herself"],"herself","Emma tried to finish the report by herself.","Emma는 그 보고서를 혼자서 끝내려고 노력했다.",
 "본책 p.120 POINT 4 표의 ‘by oneself’ 부분을 보세요.",
 "1) by 뒤에 사람 목적어가 있는 게 아니라 ‘혼자서’라는 관용 표현이에요.  2) 주어 Emma와 같은 사람을 가리키는 재귀대명사를 쓰세요.",
 "‘h’로 시작하는 7글자예요. by oneself = 혼자서","by oneself = 혼자서");
C(3,"A",6,"( ) 안에서 알맞은 말을 고르시오.<br>I promised (me / myself) that I would call my mom more often.",["me","myself"],"myself","I promised myself that I would call my mom more often.","나는 엄마께 더 자주 전화하겠다고 스스로 다짐했다.",
 "본책 p.120 POINT 2 ‘재귀 용법’(주어와 목적어가 같을 때)을 보세요.",
 "1) promised(원형 promise: 약속하다)의 약속하는 사람과 약속받는 사람이 같아요.  2) 주어 I와 목적어가 같은 사람이면 어떤 말을 쓰나요?",
 "목적격 me는 주어와 다른 사람일 때 써요. ‘m’로 시작하는 6글자 쪽이에요.","주어 = 목적어 → 재귀대명사");

W(3,"B",1,"우리말과 일치하도록 빈칸에 알맞은 재귀대명사를 쓰시오.<br>그 소년은 거울에 비친 자신을 응시했다.<br>→ The boy stared at ___ in the mirror.","himself","The boy stared at himself in the mirror.","그 소년은 거울에 비친 자기 자신을 응시했다.",
 "본책 p.120 POINT 2 예문(Hannah looked at herself in the mirror.)을 보세요.",
 "1) 주어 The boy는 남자 한 명이에요.  2) 전치사 at 뒤 목적어가 주어와 같은 사람이면 재귀대명사예요.",
 "‘h’로 시작하는 7글자예요.","전치사의 목적어도 주어와 같으면 재귀대명사");
W(3,"B",2,"우리말과 일치하도록 빈칸에 알맞은 재귀대명사를 쓰시오.<br>우리는 우리 힘으로 요리해야 했다.<br>→ We had to cook for ___.","ourselves","We had to cook for ourselves.","우리는 스스로 요리해야 했다.",
 "본책 p.120 POINT 4 표의 ‘for oneself’(스스로, 스스로를 위해)를 보세요.",
 "1) for 뒤에 오는 재귀대명사예요.  2) 주어 We에 맞춰 1인칭 복수를 쓰세요.",
 "‘o’로 시작하는 9글자예요.","for oneself = 스스로, 스스로를 위해");
W(3,"B",3,"우리말과 일치하도록 빈칸에 알맞은 재귀대명사를 쓰시오.<br>내 휴대전화는 가끔 스스로 꺼진다.<br>→ My cell phone sometimes turns off by ___.","itself","My cell phone sometimes turns off by itself.","내 휴대전화는 가끔 저절로 꺼진다.",
 "본책 p.120 POINT 4 표의 ‘by oneself’(홀로, 혼자서)를 보세요.",
 "1) 주어 My cell phone은 사람이 아닌 사물 하나예요.  2) 3인칭 단수 중 사물에 쓰는 재귀대명사를 고르세요.",
 "‘i’로 시작하는 6글자예요.","사물 주어의 재귀대명사 = itself");
W(3,"B",4,"우리말과 일치하도록 빈칸에 알맞은 재귀대명사를 쓰시오.<br>나는 나 자신을 그 반에 소개했다.<br>→ I introduced ___ to the class.","myself","I introduced myself to the class.","나는 그 반에 나 자신을 소개했다.",
 "본책 p.120 POINT 2 ‘재귀 용법’(문장의 주어와 목적어가 같을 때)을 보세요.",
 "1) 소개하는 사람과 소개되는 사람이 같아요.  2) 주어 I와 같은 사람이니 재귀대명사예요.",

WB(1,"SC",USE,[
["아기가 자고 있는 동안, 그녀는 저녁을 만들었다. (the baby, sleep)<br>→ ___ she made dinner.","While the baby was sleeping","While the baby was sleeping, she made dinner.","아기가 자고 있는 동안, 그녀는 저녁을 만들었다.",A1,"1) ‘~하는 동안’을 나타내는 접속사를 표에서 찾아요. 2) ‘자고 있는’은 진행 중이니까 과거진행형(was + -ing)이에요. sleep(자다)의 -ing형은 sleeping이에요.","W로 시작하는 접속사예요. 동사는 ‘be동사 과거형 + -ing’ 두 단어로 써요.","while + 주어 + was/were + -ing"],
["비가 그치면 나는 공원에 갈 것이다. (the rain, stop)<br>→ I will go to the park ___.","when the rain stops","I will go to the park when the rain stops.","비가 그치면 나는 공원에 갈 것이다.",A1b,"1) ‘~하면’은 ‘~할 때’로 볼 수 있어요. 2) 시간 접속사절이라 미래도 현재시제로 써요. the rain은 3인칭 단수예요.","접속사는 w로 시작하고, stop에 s를 붙여요.","시간절은 미래도 현재: when the rain stops"],
["손님들이 떠난 뒤에, 우리는 집을 청소했다. (the guests, leave)<br>→ ___, we cleaned up the house.","After the guests left","After the guests left, we cleaned up the house.","손님들이 떠난 뒤에, 우리는 집을 청소했다.",A1,"1) ‘~한 뒤에’를 나타내는 접속사를 표에서 찾아요. 2) 문장 전체가 과거(cleaned)예요. leave(떠나다)의 과거형을 써요.","A로 시작하고, leave의 과거형은 left예요.","after + 주어 + 과거동사"],
["그 카페가 가격을 내린 이래로, 더 인기가 많아졌다. (the café, lower its prices)<br>→ ___, it has become more popular.","Since the café lowered its prices","Since the café lowered its prices, it has become more popular.","그 카페가 가격을 내린 이래로, 더 인기가 많아졌다.",A1,"1) has become(원형 become: ~이 되다)은 현재완료예요. 현재완료와 잘 어울리는 ‘~한 이래로’ 접속사를 떠올려요. 2) 내린 건 과거 일이니 lower(내리다)를 과거형으로 써요.","S로 시작하는 접속사예요. lowered로 써요.","since + 주어 + 과거동사 = ~한 이래로"],
["그들은 Chris가 도착할 때까지 회의를 시작하지 않았다. (arrive)<br>→ They didn’t start the meeting ___.","until Chris arrived","They didn’t start the meeting until Chris arrived.","그들은 Chris가 도착할 때까지 회의를 시작하지 않았다.",A1,"1) ‘~할 때까지’를 나타내는 접속사예요. 2) 문장이 과거(didn’t start)이니 arrive(도착하다)도 과거형으로 써요.","u로 시작하는 접속사예요. arrive는 d만 붙여 과거형으로 써요.","until = ~할 때까지"]
]);

// ===== UNIT 2 기본 A (p.74) =====
GA(2,"A",[
["You will feel cold (if / unless) you don’t wear a warm jacket.","if","You will feel cold if you don’t wear a warm jacket.","따뜻한 재킷을 입지 않으면 너는 추울 것이다.",B1d,"1) 뒤 절에 이미 don’t(~하지 않다)가 있어요. 2) unless는 이미 부정의 뜻을 품고 있어서 또 not을 쓰면 안 돼요.","두 글자예요. 조건을 나타내는 접속사예요.","unless 안에 이미 not이 있어서 don’t와 같이 안 써요"],
["(If / Unless) you exercise more, you will not lose weight.","Unless","Unless you exercise more, you will not lose weight.","더 운동하지 않으면 너는 살을 빼지 못할 것이다.",B1,"1) 앞 절은 긍정(exercise)인데 뒤 결과는 부정(not lose)이에요. 2) ‘운동하지 않으면 살을 못 뺀다’로 읽어야 자연스러워요. 표에서 ‘~하지 않으면’은?","U로 시작해요. = If ~ not과 같은 뜻이에요.","unless = if ~ not (~하지 않으면)"],
["I’ll be late unless you (drive / don’t drive) me there.","drive","I’ll be late unless you drive me there.","네가 나를 거기에 태워다 주지 않으면 나는 늦을 것이다.",B1d,"1) unless 자체가 ‘~하지 않으면’이에요. 2) unless 뒤에 부정어를 또 쓰면 이중부정이 돼요. 본책 p.144의 Unless 예문 (X)를 봐요.","don’t가 없는 쪽이에요.","unless 뒤는 긍정문으로 쓴다"],
["(Although / If) he was sick, he never stopped training.","Although","Although he was sick, he never stopped training.","그는 아팠지만 훈련을 멈추지 않았다.",B1,"1) 앞은 ‘아팠다’, 뒤는 ‘훈련을 멈추지 않았다’예요. 두 내용이 서로 반대돼요. 2) 반대되는 내용을 이을 땐 ‘비록 ~이지만’ 접속사를 써요.","A로 시작하는 접속사예요. though와 같은 뜻이에요.","although = 비록 ~이지만 (양보)"],
["Kelly likes Mike (in spite of / though) the fact that he lied to her.","in spite of","Kelly likes Mike in spite of the fact that he lied to her.","켈리는 마이크가 그녀에게 거짓말을 했다는 사실에도 불구하고 그를 좋아한다.",B1c,"1) 빈칸 뒤에 the fact(그 사실)라는 명사구가 와요. 2) 접속사는 주어와 동사가 이어져야 하고, 명사(구)가 올 땐 전치사가 와야 해요.","세 단어짜리 표현이에요. ‘~에도 불구하고’라는 뜻의 전치사예요.","in spite of + 명사(구) = ~에도 불구하고"],
["Study every day, (and / or) you won’t understand the lessons.","or","Study every day, or you won’t understand the lessons.","매일 공부해라, 그러지 않으면 너는 수업을 이해하지 못할 것이다.",B2,"1) 앞은 명령문이에요. 뒤 결과가 won’t understand(이해하지 못할 것이다)로 나쁜 결과예요. 2) ‘…해라, 그러지 않으면’은 어떤 연결어일까요?","두 글자예요. o로 시작해요.","명령문, or ~ = …해라, 그러지 않으면 ~"],
["Take the subway, (and / or) you’ll get there on time.","and","Take the subway, and you’ll get there on time.","지하철을 타라, 그러면 너는 제시간에 거기에 도착할 것이다.",B2,"1) 앞은 명령문이에요. 뒤 결과가 on time(제시간에)으로 좋은 결과예요. 2) 좋은 결과가 따라올 땐 ‘그러면’이에요.","세 글자예요. a로 시작해요.","명령문, and ~ = …해라, 그러면 ~"]
]);
// ===== UNIT 2 기본 B =====
WW(2,"B","두 문장의 의미가 같도록 빈칸에 알맞은 접속사를 쓰시오.",[
["If we don’t hurry, we will be late for the concert.<br>→ ___ we hurry, we will be late for the concert.","Unless","Unless we hurry, we will be late for the concert.","서두르지 않으면 우리는 콘서트에 늦을 것이다.",B1d,"1) 앞 문장은 If ~ don’t(~하지 않으면)예요. 2) 같은 뜻으로 쓸 땐 if ~ not 대신 한 단어로 바꿔요. 이때 뒤 문장 hurry에는 not이 없어요.","U로 시작하는 여섯 글자예요.","if ~ not = unless"],
["Unless you are fluent in English, you won’t get the job.<br>→ ___ you are not fluent in English, you won’t get the job.","If","If you are not fluent in English, you won’t get the job.","영어에 유창하지 않으면 너는 그 일자리를 얻지 못할 것이다.",B1,"1) 빈칸 뒤에 are not이 이미 있어요. 2) unless는 ‘~하지 않으면’이므로, not이 따로 들어 있는 문장에는 if를 써야 같은 뜻이 돼요.","두 글자, I로 시작해요.","unless = if ~ not"],
["If you aren’t careful, you will get hurt.<br>→ Be careful, ___ you will get hurt.","or","Be careful, or you will get hurt.","조심해라, 그러지 않으면 너는 다칠 것이다.",B2,"1) 뒤에 나쁜 결과(get hurt: 다치다)가 와요. 2) ‘If you aren’t ~’는 ‘…해라, 그러지 않으면’과 같은 뜻이에요.","두 글자, o로 시작해요.","명령문, or ~ = If ~ not"],
["It rained, but the boys played soccer anyway.<br>→ ___ it rained, the boys played soccer anyway.","Though","Though[Although] it rained, the boys played soccer anyway.","비가 왔지만 소년들은 어쨌든 축구를 했다.",B1,"1) 원래 문장은 but으로 반대되는 내용을 이었어요. 2) 접속사로 바꿀 땐 ‘비록 ~이지만’ 접속사를 문장 맨 앞에 써요.","T로 시작하는 다섯 글자 접속사예요. 같은 뜻의 A로 시작하는 접속사도 정답이에요.","but = though[although] (비록 ~이지만)"]
]);
// ===== UNIT 2 기본 C =====
WB(2,"C",ARR,[
["네 선생님에게 물어봐라, 그러면 그녀는 네게 조언을 해 줄 것이다. (you / and / will / she / give)<br>→ Ask your teacher, ___ some advice.","and she will give you","Ask your teacher, and she will give you some advice.","네 선생님에게 물어봐라, 그러면 그녀는 네게 조언을 해 줄 것이다.",B2,"1) 앞이 명령문(Ask ...)이고 뒤는 좋은 결과예요. 2) 좋은 결과가 올 땐 and를 쓰고, give(주다)는 ‘give + 사람 + 물건’ 순서예요.","and로 시작해요. 마지막 낱말은 you예요.","명령문, and + 주어 + will ~"],
["규칙을 어기지 마라, 그러지 않으면 너는 곤란해질 것이다. (get / or / will / you / in trouble)<br>→ Don’t break the rules, ___.","or you will get in trouble","Don’t break the rules, or you will get in trouble.","규칙을 어기지 마라, 그러지 않으면 너는 곤란해질 것이다.",B2,"1) 앞이 부정 명령문이에요. 그러지 않으면(or) 나쁜 일이 생겨요. 2) get in trouble(곤란해지다)은 한 덩어리로 써요.","or로 시작하고 끝은 in trouble이에요.","명령문, or + 주어 + will ~"],
["비록 네가 경기를 졌지만, 나는 네가 자랑스럽다. (you / the game / although / lost)<br>→ ___, I am proud of you.","Although you lost the game","Although you lost the game, I am proud of you.","비록 네가 경기를 졌지만, 나는 네가 자랑스럽다.",B1,"1) ‘비록 ~이지만’ 접속사로 문장을 시작해요. 2) 졌다는 과거 일이니 lost(원형 lose: 지다)를 과거형으로 써요. 목적어 the game은 동사 뒤에 와요.","A로 시작하고 마지막은 the game이에요.","although + 주어 + 동사, 주절"],
["우리가 일찍 예약하지 않으면 우리는 그 호텔에 방을 얻지 못할 것이다. (unless / book / early / we)<br>→ We won’t get a room at the hotel ___.","unless we book early","We won’t get a room at the hotel unless we book early.","우리가 일찍 예약하지 않으면 우리는 그 호텔에 방을 얻지 못할 것이다.",B1d,"1) ‘~하지 않으면’은 unless 한 단어예요. 2) unless 안에 not이 있으니 뒤에 not을 따로 쓰지 않아요. book(예약하다)은 현재시제예요.","unless로 시작해요. 마지막 낱말은 early예요.","unless + 긍정문 = ~하지 않으면"],
["나는 이번 주말에 한가하면, 극장에 갈 것이다. (I / if / free / am / this weekend)<br>→ ___, I will go to the theater.","If I am free this weekend","If I am free this weekend, I will go to the theater.","나는 이번 주말에 한가하면, 극장에 갈 것이다.",B1b,"1) ‘~라면’은 if예요. 2) 이번 주말은 미래지만 조건 접속사절이므로 현재시제 am을 써요. will am은 틀려요.","If로 시작하고 마지막은 this weekend예요.","if절은 미래도 현재시제"]
]);
// ===== UNIT 2 심화 A (p.75) =====
const BNK2=["and","or","despite","although"];
WW(2,"SA","보기에서 알맞은 말을 골라 문장을 완성하시오.",[
["Tell me the truth, ___ I will forgive you.","and","Tell me the truth, and I will forgive you.","내게 진실을 말해라, 그러면 나는 너를 용서할 것이다.",B2,"1) 앞이 명령문이고 뒤는 좋은 결과(용서할 것이다)예요. 2) 좋은 결과면 ‘그러면’을 뜻하는 연결어예요.","세 글자예요.","좋은 결과가 오면 and (그러면)"],
["___ these shoes are comfortable, I don’t like the color.","Although","Although these shoes are comfortable, I don’t like the color.","이 신발은 편하지만 나는 색깔이 마음에 들지 않는다.",B1,"1) ___ 뒤에 주어 these shoes와 동사 are가 있어요. 2) 편한 것과 색이 싫은 것이 서로 반대되는 내용이에요. despite는 뒤에 명사만 와요.","A로 시작하는 여덟 글자예요.","although + 주어 + 동사 = 비록 ~이지만"],
["Brush your teeth after every meal, ___ you will get a toothache.","or","Brush your teeth after every meal, or you will get a toothache.","매 끼니 후에 이를 닦아라, 그러지 않으면 너는 치통에 걸릴 것이다.",B2,"1) 앞이 명령문이고 뒤는 나쁜 결과(toothache: 치통)예요. 2) 나쁜 결과가 오면 ‘그러지 않으면’이에요.","두 글자예요.","나쁜 결과가 오면 or (그러지 않으면)"],
["___ the traffic jam, they arrived early to the meeting.","Despite","Despite the traffic jam, they arrived early to the meeting.","교통 체증에도 불구하고 그들은 회의에 일찍 도착했다.",B1c,"1) ___ 뒤에 the traffic jam(교통 체증)이라는 명사구만 있어요. 2) 명사구 앞에는 접속사 although를 쓸 수 없어요. 보기에서 ‘~에도 불구하고’ 전치사를 찾아요.","D로 시작해요. in spite of와 같은 뜻이에요.","despite + 명사(구) = ~에도 불구하고"]
],BNK2);
// ===== UNIT 2 심화 B =====
WW(2,"SB","두 문장의 의미가 같도록 알맞은 접속사를 이용하여 문장을 완성하시오.",[
["If you are not feeling better, you should go see a doctor.<br>→ ___ ___ ___ feeling better, you should go see a doctor.","Unless you are","Unless you are feeling better, you should go see a doctor.","기분이 나아지지 않으면 너는 병원에 가 봐야 한다.",B1d,"1) 원래 문장은 If ~ not이에요. 2) 이걸 한 단어 접속사로 바꾸면 빈칸이 세 칸이 돼요. 이때 not은 빼요.","첫 칸은 U로 시작하는 접속사예요. 나머지 두 칸은 원래 문장에서 not만 빼고 옮겨요.","if ~ not = unless (not은 빼요)"],
["Unless we hurry, we’ll miss the plane.<br>→ ___ ___ ___ hurry, we’ll miss the plane.","If we don’t","If we don’t hurry, we’ll miss the plane.","서두르지 않으면 우리는 비행기를 놓칠 것이다.",B1d,"1) unless를 풀어서 ‘if ~ not’으로 바꿔요. 2) 주어는 we이고 do not의 줄임말을 써서 세 칸을 채워요.","If로 시작하고 마지막은 don’t예요.","Unless we hurry = If we don’t hurry"],
["He is young, but he knows a lot about computers.<br>→ ___ ___ ___ young, he knows a lot about computers.","Though he is","Though he is young, he knows a lot about computers.","그는 어리지만 컴퓨터에 대해 많이 안다.",B1,"1) 반대되는 내용을 but으로 이은 문장이에요. 2) 접속사로 바꿀 땐 ‘비록 ~이지만’ 접속사 + 주어 + be동사 순서예요.","첫 칸 접속사는 T(또는 A)로 시작해요. 뒤 두 칸은 원래 문장의 주어와 be동사예요.","though + 주어 + be + 형용사"],
["If you eat more vegetables, you will be healthier.<br>→ Eat more vegetables, ___ ___ ___ be healthier.","and you will","Eat more vegetables, and you will be healthier.","채소를 더 먹어라, 그러면 너는 더 건강해질 것이다.",B2,"1) If절을 명령문으로 바꾸는 문제예요. 좋은 결과가 따라와요. 2) ‘…해라, 그러면’ 뒤에 주어와 will이 이어져요.","첫 칸은 a로 시작하는 접속사예요. 뒤 두 칸은 원래 문장의 주어와 조동사를 그대로 옮겨요.","If ~ = 명령문, and ~"]
]);
// ===== UNIT 2 심화 C =====
WB(2,"SC",USE,[
["우리 버스가 제시간에 온다면, 우리는 7시에 도착할 것이다. (be on time)<br>→ ___, we will arrive at 7:00.","If our bus is on time","If our bus is on time, we will arrive at 7:00.","우리 버스가 제시간에 온다면, 우리는 7시에 도착할 것이다.",B1b,"1) ‘~라면’이라는 조건 접속사로 시작해요. 2) 조건절이니 미래 일이어도 현재시제로 써요. be on time(제시간에 오다)을 주어 our bus에 맞춰 써요.","If로 시작해요. be동사는 is예요.","if절은 현재시제 (our bus is)"],
["비록 나는 많은 친구가 있지만, 종종 외로움을 느낀다. (have, many)<br>→ ___, I often feel lonely.","Though I have many friends","Though I have many friends, I often feel lonely.","비록 나는 많은 친구가 있지만, 종종 외로움을 느낀다.",B1,"1) ‘비록 ~이지만’ 접속사를 쓰고, 문장으로 이어야 해요. 2) have(가지다)의 목적어로 many friends를 써요.","T(또는 A)로 시작하는 접속사예요. have 뒤에 many + 복수명사 목적어를 써요.","though[although] + 주어 + 동사"],

["He <u>thinks the exam</u> was not difficult.","O","He thinks the exam was not difficult.","그는 그 시험이 어렵지 않았다고 생각한다.",C1c,"1) thinks(원형 think: 생각하다) 뒤에 the exam was ... 라는 절이 바로 와요. 2) 목적어로 쓰인 that절은 that을 생략해도 되니 원래 문장이 맞는지 확인해요.","목적어 that절의 that은 빼도 되는 자리예요. 그렇다면 이 밑줄은 고칠 필요가 있을까요?","think + (that) + 절: that 생략 가능"],
["I believe <u>that</u> Jess is prepared for the interview.","O","I believe that Jess is prepared for the interview.","나는 제스가 면접 준비가 되어 있다고 믿는다.",C1,"1) believe(믿다) 뒤에 ‘무엇을’ 믿는지가 that절로 와요. 2) 접속사 that이 ‘~라는 것을’이라는 뜻으로 잘 쓰였는지 봐요.","목적어 that절은 that을 써도, 빼도 모두 맞아요. 밑줄 친 that이 그 자리인지만 확인해요.","believe + that + 절 (옳은 문장)"],
["<u>That</u> is true that Mike is nice to everyone.","It","It is true that Mike is nice to everyone.","마이크가 모든 사람에게 친절하다는 것은 사실이다.",C1b,"1) 뒤에 진짜 주어인 that Mike is nice ...가 있어요. 2) 앞 자리에는 가주어가 와야 해요.","두 글자, I로 시작해요.","가주어 It ~ that 진주어절"],
["I don’t know if she <u>will join</u> the book club.","O","I don’t know if she will join the book club.","나는 그녀가 독서 동아리에 가입할지 모르겠다.",C2b,"1) know(알다) 뒤의 if는 ‘~인지’라는 명사절이에요. 2) 명사절에서는 미래를 will로 나타내요. 이 문장이 맞는지 확인해요.","if 명사절에서 미래는 will + 동사원형이에요. 밑줄 부분이 바로 그 모양인지 확인해요.","if 명사절 미래 = will (맞는 문장)"],
["<u>If</u> the team will make it to the finals is uncertain.","Whether","Whether the team will make it to the finals is uncertain.","그 팀이 결승전에 진출할지는 불확실하다.",C2,"1) 이 절이 문장의 주어 자리예요. 2) if절은 주어 자리에 쓰지 않아요.","W로 시작하는 접속사예요.","주어 자리 명사절은 whether"],
["No one knows if it <u>snows</u> this Christmas.","will snow","No one knows if it will snow this Christmas.","이번 크리스마스에 눈이 올지 아무도 모른다.",C2b,"1) knows(원형 know: 알다) 뒤의 if는 ‘~인지’라는 명사절이에요. 2) 이번 크리스마스는 아직 오지 않은 미래예요. 명사절에서 미래를 나타내는 방법을 써요.","두 단어예요. snows에서 s를 떼고 앞에 미래 조동사를 붙여요.","if 명사절의 미래 = will + 동사원형"],
["I can’t tell <u>whether</u> she is interested in science or not.","O","I can’t tell whether she is interested in science or not.","나는 그녀가 과학에 관심이 있는지 없는지 말할 수 없다.",C2,"1) tell(알다, 말하다) 뒤의 whether절은 ‘~인지 아닌지’라는 목적어예요. 2) whether는 목적어 자리에도 쓸 수 있고, ‘or not’과도 잘 어울려요.","tell(알다) 뒤 목적어 자리에는 whether를 쓸 수 있어요. 다른 말로 바꿀 이유가 있는지 생각해 봐요.","whether ~ or not = ~인지 아닌지"]
]);
// ===== UNIT 3 심화 C =====
WB(3,"SC",USE,[
["나는 네가 나에게 돈을 빌려줄 수 있는지 궁금하다. (wonder, if, can, lend)<br>→ I ___ some money.","wonder if you can lend me","I wonder if you can lend me some money.","나는 네가 나에게 돈을 빌려줄 수 있는지 궁금하다.",C2,"1) ‘궁금하다’ 뒤에 ‘~인지’라는 if절이 와요. 2) if절 안은 ‘주어 + can + 동사원형 + 사람 + 물건’ 순서예요. lend(빌려주다)는 ‘lend + 사람 + 물건’이에요.","wonder if로 시작하고 lend me로 끝나요.","wonder + if + 주어 + 동사"],
["그녀는 Jason이 과거에 의사였다는 것을 안다. (know, a doctor)<br>→ She ___ in the past.","knows (that) Jason was a doctor","She knows (that) Jason was a doctor in the past.","그녀는 Jason이 과거에 의사였다는 것을 안다.",C1c,"1) 주어 She는 3인칭 단수예요. know(알다)에 s를 붙여요. 2) ‘~라는 것을’의 that은 목적어 절에서 생략할 수 있어요. 과거 일이니 was를 써요.","knows로 시작해요. that은 있어도 없어도 돼요.","know + (that) + 주어 + 과거동사"],
["Matt가 나를 신뢰하는지는 확실하지 않다. (trust, clear)<br>→ Whether ___.","Matt trusts me is not clear","Whether Matt trusts me is not clear.","Matt가 나를 신뢰하는지는 확실하지 않다.",C2,"1) Whether가 이미 주어로 시작해요. 2) 절 안에서 ‘Matt trusts(원형 trust: 신뢰하다) me’를 쓰고, 이어서 is not clear(확실하지 않다)를 써요.","Matt로 시작하고 clear로 끝나요. isn’t도 돼요.","Whether절 + 동사 + 형용사"],
["중요한 것은 우리가 지금 행복하다는 것이다. (happy)<br>→ The important thing ___.","is that we are happy now","The important thing is that we are happy now.","중요한 것은 우리가 지금 행복하다는 것이다.",C1,"1) The important thing이 주어이고 뒤에 be동사가 와요. 2) ‘~라는 것이다’이니 that절이 보어로 와요. 현재 이야기이니 are를 써요.","is로 시작하고 happy now로 끝나요.","The important thing is that ~ = 중요한 것은 ~라는 것"],
["그 남자아이가 그 돈을 훔쳤다는 것은 사실이다. (true, steal)<br>→ It ___ the money.","is true that the boy stole","It is true that the boy stole the money.","그 남자아이가 그 돈을 훔쳤다는 것은 사실이다.",C1b,"1) 문장이 It으로 시작하니 가주어예요. 2) 진주어 that절이 뒤로 가요. steal(훔치다)의 과거형을 써요.","is true로 시작하고 stole(과거형)로 끝나요.","It is true that ~ = ~라는 것은 사실이다"]
]);

// ===== CHAPTER 연습문제 기본 A (p.78) =====
GA("CH","A",[
["(It / That) is surprising that Zoe won first prize.","It","It is surprising that Zoe won first prize.","조가 1등상을 받았다는 것은 놀랍다.",C1b,"1) 뒤에 that Zoe won ...이 있어요. 2) 이 that절이 진주어이므로 앞 빈 자리는 가짜 주어여야 해요. 형용사 surprising 앞이에요.","두 글자, I로 시작해요.","가주어 It + is + 형용사 + that 진주어절"],
["(As / Although) the weather gets colder, it becomes easier to catch a cold.","As","As the weather gets colder, it becomes easier to catch a cold.","날씨가 점점 추워질수록 감기에 걸리기 쉬워진다.",A12,"1) 날씨가 추워지는 일과 감기에 걸리기 쉬워지는 일이 함께 진행돼요. 2) 반대 내용이 아니니 ‘비록 ~이지만’은 어울리지 않아요.","두 글자, A로 시작해요. Although가 아니에요.","as = ~하면서, ~함에 따라"],
["We can leave for the movie if I (find / will find) my car key.","find","We can leave for the movie if I find my car key.","내가 차 열쇠를 찾으면 우리는 영화 보러 출발할 수 있다.",B1b,"1) if는 ‘~라면’이라는 조건 접속사로 쓰였어요. 2) 조건절에서는 미래의 일도 현재시제로 써요. will은 쓰지 않아요.","will이 없는 쪽이에요.","조건 if절은 현재시제"],
["Exercise regularly, (and / or) you’ll have more energy.","and","Exercise regularly, and you’ll have more energy.","규칙적으로 운동해라, 그러면 더 많은 에너지를 갖게 될 것이다.",B2,"1) 앞이 명령문이에요. 2) 뒤는 더 많은 에너지라는 좋은 결과예요. 좋은 결과가 올 때 쓰는 연결어를 골라요.","세 글자예요. a로 시작해요.","Exercise ~, and + 좋은 결과"],
["You’ll fail the exam (if / unless) you don’t study hard.","if","You’ll fail the exam if you don’t study hard.","열심히 공부하지 않으면 너는 시험에 떨어질 것이다.",B1d,"1) 뒤에 이미 don’t가 있어요. 2) unless는 이미 부정의 뜻이라 뒤에 not을 중복해서 쓰지 않아요.","두 글자예요. I로 시작하지 않는 선택지는 틀려요.","unless + don’t는 이중부정이라 안 돼요"],
["The issue is (if / whether) he agrees with us.","whether","The issue is whether he agrees with us.","문제는 그가 우리에게 동의하는지이다.",C2,"1) is 뒤에서 주어를 설명하는 보어 자리예요. 2) 보어 자리의 명사절에는 if를 쓰지 않아요.","w로 시작해요.","보어 자리의 명사절은 whether"],
["It has been a year (when / since) my family moved here.","since","It has been a year since my family moved here.","우리 가족이 여기로 이사 온 지 일 년이 되었다.",A12,"1) has been(현재완료)과 a year(일 년)가 있어요. 2) 과거에 시작해 지금까지 이어진 기간을 말할 때 쓰는 접속사예요.","s로 시작하는 다섯 글자예요.","It has been 기간 + since + 과거절"],
["We missed the bus (because / though) we arrived at the bus stop late.","because","We missed the bus because we arrived at the bus stop late.","우리는 버스 정류장에 늦게 도착했기 때문에 버스를 놓쳤다.",A2,"1) 버스를 놓친 일과 정류장에 늦게 도착한 일의 관계를 봐요. 2) 이유일까요, 반대 내용일까요?","b로 시작하는 접속사예요.","because(이유) / though(반대 내용) 구별"]
]);

const BNKB=["until the train arrived","after the rain stopped","though he is short","whether he is sleeping"];
WW("CH","B","보기에서 알맞은 말을 골라 문장을 완성하시오. (단, 한 번씩만 쓸 것)",[
["___, he went outside to enjoy the fresh air.","After the rain stopped","After the rain stopped, he went outside to enjoy the fresh air.","비가 그친 후에, 그는 신선한 공기를 즐기러 밖으로 나갔다.",A1,"1) 뒤 문장은 그가 밖으로 나간 일이에요. 앞은 그보다 먼저 일어난 일이에요. 2) 보기 중 ‘~한 후에’로 시작하는 표현을 찾아요.","a로 시작하는 보기예요. 대문자로 써요.","after + 주어 + 과거동사 = ~한 후에"],
["He waited patiently ___.","until the train arrived","He waited patiently until the train arrived.","그는 기차가 도착할 때까지 참을성 있게 기다렸다.",A1,"1) 기다리는 동작이 계속 이어지다가 어떤 시점에 끝나요. 2) ‘~할 때까지’의 접속사를 보기에서 찾아요.","u로 시작하는 보기예요.","wait until ~ = ~할 때까지 기다리다"],
["___, he can jump higher than me.","Though he is short","Though he is short, he can jump higher than me.","그는 키가 작지만 나보다 더 높이 뛸 수 있다.",B1,"1) 키가 작은 것과 높이 뛰는 것은 서로 반대되는 내용이에요. 2) 보기에서 ‘비록 ~이지만’으로 시작하는 표현을 찾아요.","T로 시작하는 보기예요.","though + 주어 + 동사 = 비록 ~이지만"],
["I’m not sure ___.","whether he is sleeping","I’m not sure whether he is sleeping.","나는 그가 자고 있는지 확실하지 않다.",C2,"1) not sure(확실하지 않은) 뒤에 ‘~인지’라는 명사절이 와요. 2) 보기에서 ‘~인지 아닌지’ 접속사를 찾아요.","w로 시작하는 보기예요.","not sure + whether절"]
],BNKB);

WB("CH","C",ARR,[
["더 크게 말해라, 그러지 않으면 아무도 너를 듣지 못할 것이다. (speak / or / nobody / louder, / will)<br>→ ___ be able to hear you.","Speak louder, or nobody will","Speak louder, or nobody will be able to hear you.","더 크게 말해라, 그러지 않으면 아무도 너를 듣지 못할 것이다.",B2,"1) 명령문으로 시작하고 나쁜 결과가 뒤에 와요. 2) 뒤 문장은 ‘nobody will be able to hear you’로 이어져요. 그래서 빈칸 끝은 will이에요.","Speak로 시작하고 or가 중간에 와요.","nobody will ~ = 아무도 ~하지 않을 것이다"],
["문제는 내가 그의 전화번호를 모른다는 것이다. (don’t / know / that / the problem / is / I)<br>→ ___ his phone number.","The problem is that I don’t know","The problem is that I don’t know his phone number.","문제는 내가 그의 전화번호를 모른다는 것이다.",C1,"1) ‘문제는 ~라는 것이다’ 구조예요. 2) be동사 뒤 that절이 보어예요. that절 안은 ‘I don’t know’ 순서예요.","The problem으로 시작하고 know로 끝나요.","The problem is that ~ = 문제는 ~라는 것이다"],
["우리는 그녀가 결혼했는지 모른다. (know / we / don’t / she / whether / is married)<br>→ ___.","We don’t know whether she is married","We don’t know whether she is married.","우리는 그녀가 결혼했는지 모른다.",C2,"1) don’t know(모른다) 뒤에 ‘~인지’라는 명사절이 와요. 2) whether 뒤는 ‘주어 + 동사’ 순서예요. is married(결혼한 상태이다)는 한 덩어리예요.","We로 시작하고 married로 끝나요.","know + whether + 주어 + 동사"],
["Hannah는 친구들과 시간을 보낼 때 행복하다. (her friends / she / with / when / spends time)<br>→ Hannah is happy ___.","when she spends time with her friends","Hannah is happy when she spends time with her friends.","Hannah는 친구들과 시간을 보낼 때 행복하다.",A1,"1) ‘~할 때’는 when이에요. 2) when절 안은 ‘주어 + 동사 + 목적어’ 순서예요. spends time with(~와 시간을 보내다)는 한 덩어리로 써요. 주어 she가 3인칭 단수예요.","when으로 시작하고 her friends로 끝나요.","when + 주어 + 동사 (현재시제)"],
["그 문제가 너무 복잡해서 나는 그것을 해결할 수 없었다. (the problem / so / was / complex / that / I)<br>→ ___ couldn’t solve it.","The problem was so complex that I","The problem was so complex that I couldn’t solve it.","그 문제가 너무 복잡해서 나는 그것을 해결할 수 없었다.",A2,"1) 너무 ~해서 …할 수 없었다 구조예요. 2) so 뒤에 형용사 complex(복잡한), 그 뒤에 that절이 이어져요. that 뒤 주어는 I예요.","The problem was로 시작하고 I로 끝나요.","so complex that I couldn’t ~ = 너무 복잡해서 못 했다"]
]);
// ===== CHAPTER 심화 A (p.79) =====
GM("CH","SA",[
["(As / While / Until) I was walking to the store, I ran into an old friend.",["As","While"],"As[While] I was walking to the store, I ran into an old friend.","내가 가게로 걸어가고 있을 때[동안], 나는 옛 친구를 우연히 만났다.",A1,"1) was walking은 진행 중인 동작이에요. 2) 진행 중에 다른 일이 일어났으니 ‘~할 때, ~하는 동안’의 뜻이에요. Until(~할 때까지)은 이 문맥에 어울리지 않아요.","두 개를 골라요. A로 시작하는 것과 W로 시작하는 것이에요.","as / while = ~하는 동안 (until X)"],
["The teacher asked (if / whether / unless) we understood the lesson.",["if","whether"],"The teacher asked if[whether] we understood the lesson.","선생님은 우리가 수업을 이해했는지 물으셨다.",C2,"1) asked(원형 ask: 묻다) 뒤에 ‘~인지’라는 명사절이 와요. 2) 목적어 자리의 명사절에는 if와 whether 모두 쓸 수 있어요. unless는 ‘~하지 않으면’이라 뜻이 맞지 않아요.","두 개를 골라요. unless는 빼요.","목적어 자리: if = whether (~인지)"],
["(Although / Since / Because) it is raining heavily, we decided to stay indoors.",["Since","Because"],"Since[Because] it is raining heavily, we decided to stay indoors.","비가 심하게 오고 있기 때문에 우리는 실내에 머물기로 했다.",A2,"1) 비가 오는 일이 ‘이유’이고 실내에 머무는 일이 ‘결과’예요. 2) 이유를 나타내는 접속사를 골라요. Although는 반대 내용을 이을 때 써요.","두 개를 골라요. S로 시작하는 것과 B로 시작하는 것이에요.","since / because = ~이기 때문에"],
["Go to bed right now, (and / or / as) you’ll get up late tomorrow.",["or"],"Go to bed right now, or you’ll get up late tomorrow.","지금 바로 자라, 그러지 않으면 너는 내일 늦게 일어날 것이다.",B2,"1) 앞이 명령문이고 뒤는 ‘늦게 일어난다’는 나쁜 결과예요. 2) ‘그러지 않으면’을 뜻하는 연결어를 골라요.","한 개만 골라요. o로 시작해요.","명령문 뒤 as는 안 돼요, or만 가능"],
["I wonder if my mother (be / is / will be) home by tomorrow afternoon.",["will be"],"I wonder if my mother will be home by tomorrow afternoon.","나는 어머니가 내일 오후까지 집에 계실지 궁금하다.",C2b,"1) wonder(궁금해하다) 뒤의 if는 ‘~인지’라는 명사절이에요. 2) tomorrow afternoon(내일 오후)은 미래예요. 명사절의 미래는 어떻게 쓰나요?","한 개만 골라요. will이 들어간 보기예요.","if 명사절의 미래 = will be"],

["Nicole pointed to the mountain. Its peak was covered in snow.","Nicole pointed to the mountain whose peak was covered in snow.","Nicole pointed to the mountain whose peak was covered in snow.","Nicole은 정상이 눈으로 덮여 있는 산을 가리켰다.",P3,"1) Its peak는 ‘그 산의 정상’이에요. Its(그것의)는 소유를 나타내요.  2) Its를 관계대명사로 바꾸면 뒤에 peak(정상)가 바로 와요.","the mountain 바로 뒤에 w로 시작하는 5글자 소유격 관계대명사를 써요.","Its + 명사 → whose + 명사"],
["The flight attendant helped me. She was very nice.","The flight attendant who[that] helped me was very nice.","The flight attendant who[that] helped me was very nice.","나를 도와준 승무원은 매우 친절했다.",P1,"1) She는 The flight attendant(승무원)를 가리켜요.  2) She를 관계대명사로 바꾸어 helped me를 먼저 꾸밈말로 넣고, 그 뒤에 was very nice를 이어요.","주어 The flight attendant 바로 뒤에 관계대명사를 넣고 helped me를 이어요. was very nice는 마지막에 와요.","주어 설명 넣기 → 주어 + who[that] + 동사 … + 본동사"],
["He is the professor. I wanted to meet him.","He is the professor who(m)[that] I wanted to meet.","He is the professor who(m)[that] I wanted to meet.","그분은 내가 만나고 싶었던 교수님이다.",P2,"1) him은 the professor(교수님)를 가리키는 목적어예요.  2) him을 관계대명사로 바꿔 앞으로 보내고, 문장 끝의 him은 없애요.","the professor 뒤에 목적격 관계대명사를 쓰고 I wanted to meet을 이어요. 끝에 him을 쓰지 않도록 주의해요.","목적어 him → who(m)[that]로 앞에, him은 삭제"]
]);

GA(2,"A",[
["Is this (that / what) you were talking about?","what","Is this what you were talking about?","이것이 네가 말하던 것이니?",Q2,"1) 빈칸 앞에 꾸며 줄 명사(선행사)가 있나요? this는 ‘이것’이라는 대명사예요.  2) ‘네가 말하던 것’처럼 ‘~한 것’이라는 뜻이 필요해요.","선행사를 포함해 ‘~한 것’이라는 뜻이 되는 w로 시작하는 4글자 말이에요.","선행사 없이 ‘~한 것’ → what"],
["I bought some books (that / what) were on the bestseller list.","that","I bought some books that were on the bestseller list.","나는 베스트셀러 목록에 있던 책 몇 권을 샀다.",Q1,"1) 빈칸 앞에 some books(책 몇 권)라는 선행사가 있어요.  2) 빈칸 뒤에 were(원형 be: ~이다)가 바로 와서 주어가 빠져 있어요.","선행사가 있으니 what은 안 돼요. t로 시작하는 4글자예요.","선행사가 있을 때 → 관계대명사 that"],
["The woman didn’t believe (that / what) we told her.","what","The woman didn’t believe what we told her.","그 여자는 우리가 그녀에게 말해 준 것을 믿지 않았다.",Q2,"1) believe(믿다)의 목적어가 필요해요. 빈칸 앞에 선행사가 없어요.  2) ‘우리가 말해 준 것’이라는 뜻이에요. told(원형 tell: 말해 주다) 뒤에 이미 her가 있어서 목적어가 하나 빠진 문장이에요.","‘~한 것’이라는 뜻의 w로 시작하는 4글자예요.","선행사 없음 + ‘~한 것’ → what"],
["(That / What) I said made my mother angry.","What","What I said made my mother angry.","내가 말한 것이 우리 엄마를 화나게 했다.",Q2,"1) made my mother angry(엄마를 화나게 했다)의 주어가 문장 앞의 ___ I said예요.  2) ‘내가 말한 것’이라는 뜻이고, said(원형 say: 말하다) 뒤에 목적어가 빠져 있어요.","문장 처음이라 대문자로 써요. W로 시작하는 4글자예요.","주어 자리의 ‘~한 것’ → What + 주어 + 동사"],
["He is the same man (that / what) came here yesterday.","that","He is the same man that came here yesterday.","그는 어제 여기 왔던 바로 그 남자이다.",Q1,"1) 빈칸 앞에 the same man(같은 남자)이라는 선행사가 있어요.  2) the same의 수식을 받으면 주로 어떤 관계대명사를 쓰는지 표에서 확인해요.","the same + 명사 뒤에는 that을 주로 써요. t로 시작하는 4글자예요.","the same이 붙은 선행사 → that"],
["(That / What) she needs now is support from family and friends.","What","What she needs now is support from family and friends.","그녀가 지금 필요로 하는 것은 가족과 친구들의 지지이다.",Q2,"1) 문장의 주어가 빈칸 + she needs now(그녀가 지금 필요로 하는)예요.  2) needs(원형 need: 필요로 하다) 뒤에 목적어가 빠져 있으니 ‘~한 것’이라는 뜻이 필요해요.","문장 처음이라 대문자로 써요. W로 시작하는 4글자예요.","needs 뒤 목적어가 빠짐 + ‘~한 것’ → What"],
["He was the first person (that / what) arrived at the party.","that","He was the first person that arrived at the party.","그는 파티에 가장 먼저 도착한 사람이었다.",Q1,"1) 빈칸 앞에 the first person(첫 번째 사람)이라는 선행사가 있어요.  2) the first 같은 서수의 수식을 받는 선행사는 정해진 말을 주로 써요.","서수(first) 뒤에는 that을 주로 써요. t로 시작하는 4글자예요.","the + 서수 + 선행사 → that"],
["I gave Linda a gift (that / what) has a special meaning.","that","I gave Linda a gift that has a special meaning.","나는 Linda에게 특별한 의미가 있는 선물을 주었다.",Q1,"1) 빈칸 앞에 a gift(선물)라는 선행사가 있어요.  2) 빈칸 뒤 has(원형 have: 가지다)가 바로 이어지니 주어가 빠져 있어요.","선행사가 있어서 what은 안 돼요. t로 시작하는 4글자예요.","선행사가 있으면 → 관계대명사 that"]
]);

WW(2,"B","밑줄 친 부분을 생략할 수 있으면 ○, 없으면 X를 쓰시오.",[
["The boy <u>who is</u> wearing a blue cap is Josh.","O","The boy (who is) wearing a blue cap is Josh.","파란 모자를 쓰고 있는 소년은 Josh이다.",Q3,"1) who is 뒤에 wearing(입고 있는)이 바로 와요.  2) 뒤에 분사(~ing)가 오는 「주격 관계대명사 + be동사」는 어떻게 할 수 있을까요?","본책 POINT 3 두 번째 규칙(뒤에 분사(구)가 오는 「주격 관계대명사 + be동사」)에 딱 맞는 모양인지 보세요.","분사(구) 앞의 주격 관계대명사 + be동사 → 생략 가능"],
["This song is <u>what</u> I listen to the most these days.","X","This song is what I listen to the most these days.","이 노래는 내가 요즘 가장 많이 듣는 노래이다.",Q2,"1) what은 the thing(s) which[that]처럼 선행사를 포함해요.  2) what을 생략하면 I listen to the most these days가 This song을 꾸미는 말도, 명사절도 되지 못해요.","본책 POINT 3에서 생략할 수 있다고 한 말은 who(m), which, that뿐이에요. 그 목록에 what이 있나요?","what은 생략 불가 (선행사를 포함)"],
["The bread <u>which</u> you gave me was very delicious.","O","The bread (which) you gave me was very delicious.","네가 나에게 준 빵은 매우 맛있었다.",Q3,"1) which 뒤에 you gave(원형 give: 주다)로 주어와 동사가 있어요.  2) 그러면 which는 목적어 역할이에요. 목적격 관계대명사는 어떻게 할 수 있을까요?","which를 가리고 읽어 보세요: The bread you gave me … 뜻이 그대로 통하나요?","목적격 관계대명사는 생략 가능"],
["They don’t know the man <u>who</u> donated this money.","X","They don’t know the man who donated this money.","그들은 이 돈을 기부한 남자를 모른다.",Q3,"1) who 바로 뒤에 donated(원형 donate: 기부하다)가 와요. 주어가 없으니 주격이에요.  2) 뒤에 be동사 + 분사/형용사가 오는 경우가 아니면 주격은 생략하지 못해요.","who를 가리고 읽으면 the man donated this money … 처럼 동사가 두 개 부딪쳐요. 주격 혼자는 빼면 안 되는 규칙을 떠올려요.","주격 관계대명사 + 일반동사 → 생략 불가"],
["The subject <u>that</u> I like best in school is science.","O","The subject (that) I like best in school is science.","내가 학교에서 가장 좋아하는 과목은 과학이다.",Q3,"1) that 뒤에 I like(내가 좋아한다)로 주어와 동사가 이어져요.  2) like(좋아하다)의 목적어가 빠져 있으니 that은 목적격이에요.","that을 가리고 읽어 보세요: The subject I like best … 뜻이 그대로 통하는지 확인해요.","주어 + 동사가 뒤따르는 that → 목적격 → 생략 가능"],
["It was my brother <u>who</u> fixed the computer.","X","It was my brother who fixed the computer.","그 컴퓨터를 고친 사람은 내 남동생[형]이었다.",Q3,"1) who 바로 뒤에 fixed(원형 fix: 고치다)가 와요. 주어가 빠진 주격이에요.  2) 「주격 관계대명사 + be동사」가 아니라 who만 있고 일반동사가 와요.","who를 가리면 my brother fixed …가 되어 문장 구조가 바뀌어요. 주격 관계대명사가 혼자 있을 때의 규칙을 떠올려요.","주격 관계대명사는 일반동사 앞에서 생략 불가"],
["This is a novel <u>which was</u> written by my favorite author.","O","This is a novel (which was) written by my favorite author.","이것은 내가 가장 좋아하는 작가가 쓴 소설이다.",Q3,"1) which was 뒤에 written(원형 write: 쓰다의 p.p.)이 와요. 분사가 이어져요.  2) 「주격 관계대명사 + be동사」 뒤에 분사가 오는 모양을 떠올려 보세요.","which was를 함께 가리고 읽어 보세요: a novel written by … ‘~가 쓴 소설’로 통하나요?","주격 관계대명사 + be동사 + 분사 → 생략 가능"],
["Scott is the man <u>whom I was</u> talking about.","X","Scott is the man whom I was talking about.","Scott은 내가 이야기하고 있던 그 남자이다.",Q3,"1) 목적격 whom은 생략할 수 있지만, 밑줄에는 I was까지 들어 있어요.  2) I was를 빼면 the man talking about …이 되어 뜻이 달라져요.","밑줄 세 단어를 모두 가리고 읽어 보세요: the man talking about … 누가 이야기하는지가 바뀌어 버려요.","목적격 whom만 생략 가능, I was까지는 불가"]
]);

WW(2,"C",ARR,[
["이것은 많은 아이들이 사랑하는 이야기이다. (love / this / is / many children / a story / that)<br>→ ___.","This is a story that many children love","This is a story that many children love.","이것은 많은 아이들이 사랑하는 이야기이다.",Q1,"1) ‘~이다’ 부분 This is를 먼저 놓고, ‘이야기’를 이어요.  2) 그 이야기를 꾸미는 말 ‘많은 아이들이 사랑하는’은 선행사 뒤에서 「관계대명사 + 주어 + 동사」 순서로 써요.","첫 단어는 This이고, 전체는 8단어예요. 관계대명사 뒤에는 「주어 + 동사」 순서가 와요.","선행사 + that + 주어 + 동사 (목적격 that)",["love","this","is","many children","a story","that"]],
["자전거를 타고 있는 남자아이가 내 남동생이다. (riding / the boy / my brother / a bike / is)<br>→ ___.","The boy riding a bike is my brother","The boy riding a bike is my brother.","자전거를 타고 있는 남자아이가 내 남동생이다.",Q3,"1) 주어는 ‘자전거를 타고 있는 남자아이’ 전체예요. The boy 뒤에 꾸며 주는 말이 와요.  2) 보기에 관계대명사가 없어요. 「주격 관계대명사 + be동사」를 생략한 모양으로 riding(타고 있는) 이하를 쓰면 돼요.","첫 단어는 The이고, 전체는 8단어예요. 문장의 진짜 동사 is는 꾸밈말이 다 끝난 다음에 와요.","명사 + 분사구 (관계대명사 + be 생략된 모양)",["riding","the boy","my brother","a bike","is"]],
["Adrian이 크리스마스에 원하는 것은 강아지이다. (what / wants / Adrian / for Christmas)<br>→ ___ is a puppy.","What Adrian wants for Christmas","What Adrian wants for Christmas is a puppy.","Adrian이 크리스마스에 원하는 것은 강아지이다.",Q2,"1) 주어는 ‘Adrian이 크리스마스에 원하는 것’이에요. ‘~하는 것’ 뜻의 말이 맨 앞에 와요.  2) 그 뒤에 「주어 + 동사」 순서로 이어요.","첫 단어는 What이고, 빈칸은 5단어예요. 동사 wants(원형 want: 원하다)는 주어 뒤에 와요.","What + 주어 + 동사 = ‘~하는 것’ (주어 역할)",["what","wants","Adrian","for Christmas"]],
["너는 내가 믿을 수 있는 유일한 사람이다. (you / that / the only / person / I / can / are / trust)<br>→ ___.","You are the only person that I can trust","You are the only person that I can trust.","너는 내가 믿을 수 있는 유일한 사람이다.",Q1,"1) 문장 앞부분은 You are the only person(유일한 사람)이에요.  2) ‘내가 믿을 수 있는’은 뒤에서 꾸며 줘요. the only가 붙은 선행사에는 정해진 관계대명사를 주로 써요.","첫 단어는 You이고, 전체는 9단어예요. 관계대명사 뒤에는 「주어 + 조동사 + 동사원형」 순서가 와요.","the only + 선행사 → that + 주어 + 동사",["you","that","the only","person","I","can","are","trust"]],
["나는 네가 갖고 있는 것과 똑같은 재킷이 있다. (I / have / have / jacket / that / the same / you)<br>→ ___.","I have the same jacket that you have","I have the same jacket that you have.","나는 네가 갖고 있는 것과 똑같은 재킷이 있다.",Q1,"1) 앞부분은 I have + 재킷이고, ‘똑같은’은 the same이에요.  2) ‘네가 갖고 있는’은 선행사 뒤에서 「that + 주어 + 동사」로 꾸며요. have가 두 번 나와요.","첫 단어는 I이고, 전체는 8단어예요. have 두 개 중 하나는 앞부분 동사, 하나는 관계대명사절의 동사예요.","the same + 선행사 → that + 주어 + 동사",["I","have","have","jacket","that","the same","you"]]
]);

WW(2,"SA","빈칸에 that 또는 what 중 알맞은 말을 써서 문장을 완성하시오.",[
["That’s exactly ___ I thought.","what","That’s exactly what I thought.","그것이 바로 내가 생각한 것이다.",Q2,"1) 빈칸 앞에 꾸며 줄 선행사가 있나요? exactly(정확히)는 부사예요.  2) I thought(원형 think: 생각하다) 뒤에 목적어가 빠져 있어요. ‘내가 생각한 것’이라는 뜻이에요.","선행사 없이 ‘~한 것’을 뜻하는 w로 시작하는 4글자예요.","선행사 없고 ‘~한 것’ 뜻 → what"],
["___ you have achieved is extraordinary.","What","What you have achieved is extraordinary.","네가 이룬 것은 놀랍다.",Q2,"1) 문장의 주어가 ___ you have achieved(네가 이룬 ~)예요.  2) have achieved(원형 achieve: 이루다) 뒤에 목적어가 없어요. ‘네가 이룬 것’이라는 뜻이에요.","문장 처음이니 대문자로 써요. W로 시작하는 4글자예요.","주어로 쓰인 ‘~한 것’ → What"],
["I don’t like people ___ only talk about themselves.","that","I don’t like people that only talk about themselves.","나는 자기 얘기만 하는 사람들을 좋아하지 않는다.",Q1,"1) 빈칸 앞에 people(사람들)이라는 선행사가 있어요.  2) 빈칸 뒤 only talk(오직 이야기한다)가 바로 이어져 주어가 빠졌어요.","선행사가 있으니 what은 아니에요. t로 시작하는 4글자예요.","선행사(people)가 있으면 → that"],

["일요일은 축제가 열린 날이었다. (the festival, hold)<br>→ Sunday was the day ___.","when the festival was held","Sunday was the day when the festival was held.","일요일은 축제가 열린 날이었다.",R2,"1) the day(날)는 시간 선행사예요. 시간용 관계부사를 써요.  2) ‘축제가 열렸다’는 수동이에요. hold(열다)를 be동사 + p.p.로 써요.","w로 시작하는 4글자 관계부사로 시작해요. 동사는 was와 hold(열다)의 p.p.예요.","시간 선행사 + when + 주어 + be p.p."],
["우리가 어제 잡았던 물고기는 매우 컸다. (catch, very big)<br>→ The fish ___.","(which[that]) we caught yesterday was very big","The fish (which[that]) we caught yesterday was very big.","우리가 어제 잡았던 물고기는 매우 컸다.",Q3,"1) 주어는 The fish(물고기)예요. 그 뒤에 ‘우리가 어제 잡았던’이 와요.  2) 목적격 관계대명사는 있어도 되고 생략해도 돼요. 과거 이야기이니 catch(잡다)를 과거형으로 써요.","관계대명사는 써도 되고 생략해도 돼요. we 뒤에 catch(잡다)의 과거형을 써요. c로 시작하는 6글자예요.","주어 + (목적격 관계대명사) + 주어 + 동사 + 본동사"]
]);

}

const P1="본책 p.174 POINT 1(가정법 과거)",P2="본책 p.174 POINT 2(가정법 과거완료)";
const Q1="본책 p.176 POINT 1(I wish + 가정법 과거)",Q2="본책 p.176 POINT 2(I wish + 가정법 과거완료)",Q3="본책 p.176 POINT 3(as if + 가정법 과거)",Q4="본책 p.176 POINT 4(as if + 가정법 과거완료)";
const IC="( ) 안에서 알맞은 말을 고르시오.",IS="두 문장의 의미가 같도록 빈칸에 알맞은 말을 쓰시오.",IA="우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.",IU="우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.";
// ===== UNIT 1 기본 A (p.88) =====
C(1,"A",1,IC+"<br>If it weren’t so cold, we (can / could) go for a walk.",["can","could"],"could","If it weren’t so cold, we could go for a walk.","만약 그렇게 춥지 않다면, 우리는 산책하러 갈 수 있을 텐데.",
 P1+"의 파란 표에서 주절(would·could·might 칸)을 보세요.",
 "1) if절에 weren’t(were not)이 있어요. 지금 춥다는 사실과 반대로 상상하는 문장이에요.  2) 이런 문장의 주절은 ‘조동사의 과거형 + 동사원형’ 모양이에요. can(~할 수 있다)은 현재형이라 어울리지 않아요.",
 "can의 과거형을 고르세요. 두 번째 보기예요.","가정법 과거 주절: could + 동사원형 (can은 X)");
C(1,"A",2,IC+"<br>If we had a garden, we (could plant / could have planted) some flowers.",["could plant","could have planted"],"could plant","If we had a garden, we could plant some flowers.","만약 우리에게 정원이 있다면, 우리는 꽃을 좀 심을 수 있을 텐데.",
 P1+"의 예문(자동차가 있다면 여행을 갈 텐데)과 같은 모양인지 비교해 보세요.",
 "1) if절의 had는 have(가지다)의 과거형 하나뿐이에요. had + p.p.(과거분사) 모양이 아니에요.  2) if절이 그냥 과거형이면 주절은 could + 동사원형이에요.",
 "have + p.p.가 들어 있지 않은, 더 짧은 쪽이에요. 첫 번째 보기예요.","if절 과거형(had) → 주절 could + 동사원형");
C(1,"A",3,IC+"<br>If he (said / had said) he was sorry, she wouldn’t have been so angry.",["said","had said"],"had said","If he had said he was sorry, she wouldn’t have been so angry.","만약 그가 미안하다고 말했다면, 그녀는 그렇게 화나지 않았을 텐데.",
 P2+"의 표를 보고 if절과 주절의 짝을 확인하세요.",
 "1) 주절의 wouldn’t have been(원형 be: ~이다, ‘~하지 않았을 텐데’)은 would + have p.p. 모양이에요. 지나간 일을 반대로 상상하는 거예요.  2) 그 짝이 되는 if절은 어떤 모양일까요?",
 "if절은 had + p.p.예요. 두 단어짜리 보기를 고르세요.","주절 would have p.p. 짝 → if절은 had p.p.");
C(1,"A",4,IC+"<br>If we (cook / cooked) at home more often, we could save money.",["cook","cooked"],"cooked","If we cooked at home more often, we could save money.","만약 우리가 집에서 더 자주 요리한다면, 우리는 돈을 아낄 수 있을 텐데.",
 P1+"의 if절 칸(If + 주어 + 동사의 과거형)을 보세요.",
 "1) 주절의 could save(save: 아끼다)는 could + 동사원형이에요. 지금 사실과 반대되는 가정법 과거예요.  2) 그러면 if절의 동사는 현재형일까요, 과거형일까요?",
 "cook(요리하다)에 -ed가 붙은 쪽이에요. 두 번째 보기예요.","주절이 could + 동사원형이면 if절은 과거형");
C(1,"A",5,IC+"<br>If you had asked her, she (might help / might have helped) you.",["might help","might have helped"],"might have helped","If you had asked her, she might have helped you.","만약 네가 그녀에게 부탁했다면, 그녀가 너를 도와주었을지도 모를 텐데.",
 P2+"의 표에서 주절 칸(would·could·might 옆 have p.p.)을 보세요.",
 "1) if절이 had asked(원형 ask: 부탁하다)예요. had + p.p.니까 과거 사실의 반대예요.  2) 과거를 반대로 상상하면 주절은 might + have + p.p. 모양이에요.",
 "중간에 have가 들어 있는 쪽이에요. 두 번째 보기예요.","if절 had p.p. → 주절 might have p.p.");
C(1,"A",6,IC+"<br>If I (weren’t / hadn’t been) busy, I would have gone to the concert with you.",["weren’t","hadn’t been"],"hadn’t been","If I hadn’t been busy, I would have gone to the concert with you.","만약 내가 바쁘지 않았다면, 나는 너와 함께 콘서트에 갔을 텐데.",
 P2+"의 if절 칸(If + 주어 + had p.p.)을 보세요.",
 "1) 주절의 would have gone(원형 go: 가다)은 would + have p.p.예요. 지나간 일에 대한 가정이에요.  2) 그러면 if절은 had + p.p.인데, 부정이니까 had 뒤에 not이 와요. be동사의 과거분사는 been이에요.",
 "hadn’t로 시작하는 두 단어짜리 보기예요. 두 번째 보기예요.","be동사 과거완료 부정: hadn’t been");
C(1,"A",7,IC+"<br>If Mia hadn’t overslept, she (wouldn’t miss / wouldn’t have missed) the train.",["wouldn’t miss","wouldn’t have missed"],"wouldn’t have missed","If Mia hadn’t overslept, she wouldn’t have missed the train.","만약 Mia가 늦잠을 자지 않았다면, 그녀는 기차를 놓치지 않았을 텐데.",
 P2+"의 예문(7시에 일어났다면 아침을 먹었을 텐데)과 짝을 맞춰 보세요.",
 "1) if절의 hadn’t overslept(원형 oversleep: 늦잠 자다)는 had + p.p.의 부정이에요. 과거 사실의 반대예요.  2) 이때 주절은 would(not) + have + p.p.가 되어야 시제가 맞아요.",
 "have가 들어간 쪽이에요. 두 번째 보기예요.","과거 반대 가정 주절: wouldn’t have + p.p.");
C(1,"A",8,IC+"<br>If I (am / were) president, I would invest more money in schools.",["am","were"],"were","If I were president, I would invest more money in schools.","만약 내가 대통령이라면, 나는 학교에 더 많은 돈을 투자할 텐데.",
 "본책 p.174 POINT 1 아래 ‘내신 적중’ 박스(be동사)를 보세요.",
 "1) 주절의 would invest(invest: 투자하다)는 would + 동사원형이라 가정법 과거예요.  2) 가정법 과거의 if절에서 be동사는 주어가 I여도 정해진 하나의 모양을 써요.",
 "am은 소거해요. 남은 하나이고, w로 시작하는 4글자예요.","가정법 과거 if절 be동사: 모든 주어에 were");
// ===== UNIT 1 기본 B (p.88) =====
W(1,"B",1,IS+"<br>As I don’t have enough free time, I cannot go to the gym more often.<br>→ If I ___ enough free time, I ___ to the gym more often.","had, could go","If I had enough free time, I could go to the gym more often.","만약 내게 충분한 자유 시간이 있다면, 나는 체육관에 더 자주 갈 수 있을 텐데.",
 P1+"의 파란 표와 예문 아래 (← As ~) 설명을 보세요.",
 "1) 원래 문장은 지금 시간이 없어서 못 가는 현재 사실이에요.  2) 가정법 과거로 바꾸면 if절은 동사의 과거형, 주절은 조동사 과거형 + 동사원형이에요.  3) 원래 문장의 부정(don’t, cannot)은 긍정으로 바뀌어요.",
 "첫 칸은 have(가지다)의 과거형(h로 시작, 3글자)이에요. 둘째 칸은 cannot의 긍정인 can의 과거형으로 시작하고, 뒤에 동사원형이 와요.","직설법 현재 → 가정법 과거: 부정은 긍정, 현재는 과거형");
W(1,"B",2,IS+"<br>As I have this terrible headache, I am not able to go to work.<br>→ If I ___ this terrible headache, I ___ to work.","didn’t[did not] have, could go","If I didn’t have this terrible headache, I could go to work.","만약 내가 이렇게 심한 두통이 없다면, 나는 출근할 수 있을 텐데.",
 P1+"의 표와 예문을 보세요. 부정으로 바뀌는 경우도 같이 확인해요.",
 "1) 지금 두통이 있다는 건 긍정 사실이에요. 가정법에서는 반대로 부정이 돼요.  2) have(가지다)는 일반동사라서 과거형 부정은 didn’t + 동사원형이에요.  3) 주절의 am not able to(~할 수 없다)는 반대로 ‘할 수 있다’는 뜻의 조동사 과거형으로 바꿔요.",
 "첫 칸은 didn’t로 시작하는 두 단어예요. 둘째 칸은 c로 시작하는 조동사 과거형 + go예요.","긍정 사실 → 가정법에서는 didn’t + 동사원형");
W(1,"B",3,IS+"<br>As she didn’t know Max was in the hospital, she didn’t visit him.<br>→ If she ___ Max was in the hospital, she ___ him.","had known, would have visited","If she had known Max was in the hospital, she would have visited him.","만약 그녀가 Max가 병원에 있다는 것을 알았다면, 그녀는 그를 방문했을 텐데.",
 P2+"의 표와 예문 아래 (← As ~) 설명을 보세요.",
 "1) 원래 문장이 didn’t know, didn’t visit처럼 과거예요. 그래서 가정법 과거완료로 바꿔요.  2) 부정이었으니 가정법에서는 긍정이 돼요.  3) if절은 had + p.p., 주절은 would + have + p.p.예요.",
 "첫 칸은 had로 시작하고 know(알다)의 과거분사가 와요. 둘째 칸은 would로 시작하는 3단어예요.","과거 부정 사실 → had p.p. / would have p.p.");
W(1,"B",4,IS+"<br>As he was so tired, he couldn’t get up earlier.<br>→ If he ___ so tired, he ___ earlier.","hadn’t[had not] been, could have gotten up","If he hadn’t been so tired, he could have gotten up earlier.","만약 그가 그렇게 피곤하지 않았다면, 그는 더 일찍 일어날 수 있었을 텐데.",
 P2+"의 표(주절의 could + have p.p. 칸)를 보세요.",
 "1) was(be동사 과거)와 couldn’t는 지나간 일이에요. 과거 사실을 반대로 상상하는 거예요.  2) 긍정이었던 was tired는 if절에서 부정이 되고, 부정이었던 couldn’t는 긍정이 돼요.  3) 주절은 could + have + p.p.예요.",
 "첫 칸은 hadn’t로 시작하는 두 단어(been 포함)예요. 둘째 칸은 could로 시작하는 4단어예요(get의 과거분사는 gotten).","과거 반대 가정: hadn’t been / could have p.p.");
// ===== UNIT 1 기본 C (p.88) 배열 =====
W(1,"C",1,IA+"<br>내가 더 젊다면 나는 세계 일주를 할 텐데. (whole / the / world / I / travel / would)<br>If I were younger, ___.","I would travel the whole world","If I were younger, I would travel the whole world.","내가 더 젊다면 나는 세계 일주를 할 텐데.",
 P1+"의 표에서 주절 칸(주어 + would + 동사원형)을 보세요.",
 "1) if절이 were로 시작하는 가정법 과거예요.  2) 주절은 ‘주어 + would + 동사원형’ 순서로 놓아요.  3) 그 뒤에 ‘세계 전체’에 해당하는 목적어가 와요. the(그)가 whole(전체의)보다 먼저예요.",
 "I로 시작해서 world로 끝나는 6단어예요. 둘째 단어는 조동사예요.","주절 순서: 주어 + would + 동사원형 ~",["whole","the","world","I","travel","would"]);
W(1,"C",2,IA+"<br>그녀가 진실을 안다면, 그녀는 실망할 텐데. (be / she / disappointed / would)<br>If she knew the truth, ___.","she would be disappointed","If she knew the truth, she would be disappointed.","그녀가 진실을 안다면, 그녀는 실망할 텐데.",
 P1+"의 표에서 주절 모양을 확인하세요.",
 "1) knew(원형 know: 알다)는 과거형이고, 가정법 과거의 if절 동사예요.  2) 주절은 ‘주어 + would + 동사원형’이에요. be(~이다)는 동사원형이라 would 바로 뒤에 와요.  3) 마지막에 형용사 disappointed(실망한)가 와요.",
 "she로 시작하는 4단어예요. be는 세 번째 자리예요.","would 뒤에는 be 같은 동사원형이 온다",["be","she","disappointed","would"]);
W(1,"C",3,IA+"<br>내 전화기 배터리가 다 닳지 않았다면, 나는 너에게 전화했을 텐데. (I / called / would / have / you)<br>If my phone hadn’t run out of battery, ___.","I would have called you","If my phone hadn’t run out of battery, I would have called you.","내 전화기 배터리가 다 닳지 않았다면, 나는 너에게 전화했을 텐데.",
 P2+"의 표에서 주절 칸(would + have p.p.)을 보세요.",
 "1) if절이 hadn’t run out(원형 run out: 다 떨어지다)이라 had + p.p.의 부정이에요. 과거 사실의 반대예요.  2) 그래서 주절은 ‘주어 + would + have + p.p.’ 순서로 놓아요.  3) 전화를 받는 사람인 you는 맨 끝이에요.",
 "I로 시작해서 you로 끝나는 5단어예요. called(원형 call: 전화하다)는 have 바로 뒤예요.","과거 반대 가정 주절: would have + p.p.",["I","called","would","have","you"]);
W(1,"C",4,IA+"<br>네가 채소를 더 먹는다면, 너는 더 건강할 텐데. (you / more vegetables / if / ate)<br>___, you would be healthier.","If you ate more vegetables","If you ate more vegetables, you would be healthier.","네가 채소를 더 먹는다면, 너는 더 건강할 텐데.",
 P1+"의 if절 칸(If + 주어 + 동사의 과거형)을 보세요.",
 "1) 주절의 would be healthier(더 건강한)는 가정법 과거 모양이에요.  2) 그러니 빈칸은 if절이에요. 맨 앞에는 접속사가 와요.  3) 순서는 접속사 + 주어 + 동사의 과거형 + 목적어예요.",
 "If로 시작하는 5단어예요. ate(원형 eat: 먹다)는 주어 바로 뒤예요.","if절 순서: If + 주어 + 과거형 + 목적어",["you","more vegetables","if","ate"]);
W(1,"C",5,IA+"<br>네가 내 충고를 받아들였다면, 이런 일은 일어나지 않았을 텐데. (if / my advice / you / taken / had)<br>___, this wouldn’t have happened.","If you had taken my advice","If you had taken my advice, this wouldn’t have happened.","네가 내 충고를 받아들였다면, 이런 일은 일어나지 않았을 텐데.",
 P2+"의 if절 칸(If + 주어 + had p.p.)을 보세요.",
 "1) 주절의 wouldn’t have happened(원형 happen: 일어나다)는 would + have p.p.의 부정이에요. 과거 사실의 반대예요.  2) 그러니 if절은 had + p.p. 모양이에요.  3) 순서는 접속사 + 주어 + had + p.p. + 목적어예요.",
 "If로 시작하는 6단어예요. had와 taken(원형 take: 받아들이다)이 연달아 나와요.","if절 과거완료: If + 주어 + had p.p.",["if","my advice","you","taken","had"]);
// ===== UNIT 1 심화 A (p.89) =====
C(1,"SA",1,"보기에서 알맞은 말을 골라 문장을 완성하시오.<br>보기: were / hadn’t / hadn’t been<br>If I ___ you, I wouldn’t blame him.",["were","hadn’t","hadn’t been"],"were","If I were you, I wouldn’t blame him.","내가 너라면, 나는 그를 탓하지 않을 텐데.",
 "본책 p.174 POINT 1 아래 ‘내신 적중’ 박스(be동사)를 보세요.",
 "1) 주절의 wouldn’t blame(blame: 탓하다)은 would + 동사원형이에요. 현재 사실의 반대 가정이에요.  2) 가정법 과거에서 be동사는 항상 정해진 한 모양을 써요.",
 "hadn’t가 들어 있는 보기 두 개는 소거해요. 남은 하나예요.","If I were you의 짝 주절: wouldn’t + 동사원형");
C(1,"SA",2,"보기에서 알맞은 말을 골라 문장을 완성하시오.<br>보기: were / hadn’t / hadn’t been<br>If I ___ so nervous during the interview, I would have gotten the job.",["were","hadn’t","hadn’t been"],"hadn’t been","If I hadn’t been so nervous during the interview, I would have gotten the job.","만약 내가 면접 동안 그렇게 긴장하지 않았다면, 나는 그 일자리를 얻었을 텐데.",
 P2+"의 표(if절: had p.p.)를 보세요.",
 "1) 주절의 would have gotten(원형 get: 얻다)은 would + have p.p.예요. 과거 사실의 반대예요.  2) 빈칸 뒤 so nervous(그렇게 긴장한)는 형용사라서, 빈칸에는 be동사의 과거분사가 들어 있어야 해요.",
 "were는 지금 일에 쓰는 말이라 소거해요. been이 붙은 세 번째 보기예요.","형용사 앞 과거완료 부정: hadn’t been");
C(1,"SA",3,"보기에서 알맞은 말을 골라 문장을 완성하시오.<br>보기: were / hadn’t / hadn’t been<br>If I ___ eaten so much ice cream, I wouldn’t have felt so terrible.",["were","hadn’t","hadn’t been"],"hadn’t","If I hadn’t eaten so much ice cream, I wouldn’t have felt so terrible.","만약 내가 아이스크림을 그렇게 많이 먹지 않았다면, 나는 그렇게 끔찍한 기분이 들지 않았을 텐데.",
 P2+"의 표를 보고 if절 모양을 확인하세요.",
 "1) 주절이 wouldn’t have felt(원형 feel: 느끼다)라서 과거 사실의 반대예요.  2) 빈칸 바로 뒤에 eaten(원형 eat: 먹다)이 있어요. had + p.p.를 완성하려면 had만 있으면 돼요.",
 "been이 붙은 보기는 eaten과 같이 쓸 수 없어요. 소거하세요. 두 번째 보기예요.","had p.p.의 부정: hadn’t + 과거분사");
C(1,"SA",4,"보기에서 알맞은 말을 골라 문장을 완성하시오.<br>보기: would / would have / wouldn’t have<br>If he had studied harder, he ___ failed the test.",["would","would have","wouldn’t have"],"wouldn’t have","If he had studied harder, he wouldn’t have failed the test.","만약 그가 더 열심히 공부했다면, 그는 시험에 떨어지지 않았을 텐데.",
 P2+"의 표(주절: would + have p.p.)를 보세요.",
 "1) if절이 had studied(원형 study: 공부하다)라서 과거 사실의 반대예요.  2) 빈칸 뒤에 failed(원형 fail: 떨어지다)가 있어서 ‘have + p.p.’ 모양을 만들어야 해요.  3) 더 열심히 공부했다면 시험에 떨어졌을까요, 아닐까요?",
 "have가 들어 있고 ‘~하지 않았을 텐데’라는 부정이 필요해요. 세 번째 보기예요.","과거 반대 가정 + 결과가 반대: wouldn’t have p.p.");
C(1,"SA",5,"보기에서 알맞은 말을 골라 문장을 완성하시오.<br>보기: would / would have / wouldn’t have<br>If I had more free time, I ___ watch more movies.",["would","would have","wouldn’t have"],"would","If I had more free time, I would watch more movies.","만약 내게 더 많은 자유 시간이 있다면, 나는 영화를 더 많이 볼 텐데.",
 P1+"의 표를 보고 if절 동사의 시제부터 확인하세요.",
 "1) if절의 had는 have(가지다)의 과거형 하나예요. had + p.p.가 아니에요.  2) 그러면 현재 사실의 반대예요. 빈칸 뒤 watch(보다)는 동사원형이에요.",
 "동사원형 바로 앞에 쓰는 조동사 하나예요. 첫 번째 보기예요.","가정법 과거 주절: would + 동사원형");
C(1,"SA",6,"보기에서 알맞은 말을 골라 문장을 완성하시오.<br>보기: would / would have / wouldn’t have<br>If I had known that you were coming, I ___ baked some cookies.",["would","would have","wouldn’t have"],"would have","If I had known that you were coming, I would have baked some cookies.","만약 네가 올 줄 알았다면, 나는 쿠키를 좀 구웠을 텐데.",
 P2+"의 표를 보고 짝을 맞춰 보세요.",
 "1) if절이 had known(원형 know: 알다)이에요. 과거 사실의 반대예요.  2) 빈칸 뒤 baked(원형 bake: 굽다)는 과거분사예요. 그러니 빈칸에는 have가 필요해요.  3) 알았다면 구웠을 텐데, 즉 긍정이에요.",
 "부정이 아니고 have가 들어 있는 보기예요. 두 번째 보기예요.","if절 had p.p. → 주절 would have p.p.");
// ===== UNIT 1 심화 B (p.89) =====
W(1,"SB",1,IS+"<br>As it is raining, we will not go for a walk.<br>→ If it ___.","weren’t[were not] raining, we would go for a walk","If it weren’t raining, we would go for a walk.","만약 비가 오지 않는다면, 우리는 산책하러 갈 텐데.",
 P1+"의 표와 예문 아래 (← As ~) 설명을 보세요.",
 "1) 지금 비가 오고 있어서 산책을 안 간다는 현재 사실이에요.  2) 가정법 과거로 바꾸면 if절은 부정, 주절은 긍정이 돼요.  3) 진행형 is raining의 be동사를 가정법에 맞는 모양으로 바꿔요.",
 "if절은 were로 시작하는 부정이에요. 주절의 will은 would로 바꿔요.","직설법 현재 → 가정법 과거: will은 would로");
W(1,"SB",2,IS+"<br>As the weather was so bad, we couldn’t arrive sooner.<br>→ If the weather ___.","hadn’t[had not] been so bad, we could have arrived sooner","If the weather hadn’t been so bad, we could have arrived sooner.","만약 날씨가 그렇게 나쁘지 않았다면, 우리는 더 일찍 도착할 수 있었을 텐데.",
 P2+"의 표(if절 had p.p. / 주절 could have p.p.)를 보세요.",
 "1) was, couldn’t처럼 과거 사실이에요. 가정법 과거완료로 바꿔요.  2) 긍정이던 was so bad는 if절에서 부정이 되고, 부정이던 couldn’t arrive는 긍정이 돼요.",
 "if절은 hadn’t been으로 시작해요. 주절은 could have + 과거분사(arrive의 과거분사 arrived)예요.","couldn’t arrive의 반대: could have arrived");
W(1,"SB",3,IS+"<br>As we don’t have her number, we cannot call her.<br>→ If we ___.","had her number, we could call her","If we had her number, we could call her.","만약 우리가 그녀의 번호를 가지고 있다면, 우리는 그녀에게 전화할 수 있을 텐데.",
 P1+"의 표와 예문 아래 (← As ~) 설명을 보세요.",
 "1) don’t have, cannot처럼 현재 사실이에요. 가정법 과거로 바꿔요.  2) 부정이던 두 부분이 모두 긍정이 되고, 동사는 과거형이 돼요.",
 "if절은 have(가지다)의 과거형으로, 주절은 can의 과거형 + 동사원형으로 써요. 둘 다 긍정이에요.","현재 부정 사실 → 가정법 과거 긍정");

W(1,"SC",1,IU+"<br>내 알람 시계가 울렸다면, 나는 늦잠을 자지 않았을 텐데. (oversleep)<br>If my alarm clock had gone off, ___.","I wouldn’t[would not] have overslept","If my alarm clock had gone off, I wouldn’t have overslept.","내 알람 시계가 울렸다면, 나는 늦잠을 자지 않았을 텐데.",
 P2+"의 표에서 주절 칸을 보세요.",
 "1) if절이 had gone off(원형 go off: 울리다)라서 과거 사실의 반대예요.  2) 주절은 ‘주어 + would + have + p.p.’ 모양이에요.  3) 울렸다면 늦잠을 안 잤을 테니 부정이에요. oversleep(늦잠 자다)의 과거분사는 overslept예요.",
 "I로 시작하는 4단어예요. 둘째 단어는 would의 부정이에요.","overslept(원형 oversleep: 늦잠 자다)는 불규칙");
W(1,"SC",2,IU+"<br>Brad가 아프지 않았다면, 그는 그의 친구들과 축구를 했을 텐데. (play soccer, with)<br>If Brad hadn’t been ill, ___.","he would have played soccer with his friends","If Brad hadn’t been ill, he would have played soccer with his friends.","Brad가 아프지 않았다면, 그는 그의 친구들과 축구를 했을 텐데.",
 P2+"의 표를 보세요.",
 "1) if절이 hadn’t been ill(아픈)이니 과거 사실의 반대예요.  2) 주절은 ‘주어 + would + have + p.p.’예요. 주어는 Brad를 대신하는 말이에요.  3) 뒤에 ‘친구들과’에 해당하는 with ~가 와요.",
 "he로 시작해서 friends로 끝나는 8단어예요. play(하다)의 과거분사는 played예요.","주어는 Brad 대신 he, 주절은 would have played");
W(1,"SC",3,IU+"<br>내가 너라면, 나는 빗속에 더 조심히 운전할 텐데. (be)<br>___, I would drive more carefully in the rain.","If I were you","If I were you, I would drive more carefully in the rain.","내가 너라면, 나는 빗속에 더 조심히 운전할 텐데.",
 "본책 p.174 POINT 1 아래 ‘내신 적중’ 박스(be동사)를 보세요.",
 "1) 주절의 would drive(drive: 운전하다)는 would + 동사원형이에요. 가정법 과거예요.  2) 우리말 ‘내가 너라면’을 if절로 쓰면 되고, be(~이다)는 정해진 모양으로 써요.",
 "If로 시작하는 4단어예요. 셋째 단어는 w로 시작하는 be동사예요.","‘내가 너라면’ = If I were you");
W(1,"SC",4,IU+"<br>그가 담배를 피우지 않으면, 그는 더 건강할 텐데. (smoke)<br>___, he would be healthier.","If he didn’t smoke","If he didn’t smoke, he would be healthier.","그가 담배를 피우지 않으면, 그는 더 건강할 텐데.",
 P1+"의 if절 칸을 보세요. 부정문일 때 어떻게 되는지도 같이 봐요.",
 "1) 주절의 would be healthier(더 건강한)는 가정법 과거예요.  2) 그러면 if절은 과거형이에요. smoke(담배를 피우다)는 일반동사라서 부정은 do의 과거형을 이용해요.",
 "If로 시작하는 4단어예요. 셋째 단어는 d로 시작하는 줄임말(부정)이에요.","일반동사 과거 부정: didn’t + 동사원형");
// ===== UNIT 2 기본 A (p.90) =====
W(2,"A",1,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>I take the bus every morning. I wish I ___ a car instead. (have)","had","I take the bus every morning. I wish I had a car instead.","나는 매일 아침 버스를 탄다. 그 대신 차가 있다면 좋을 텐데.",
 Q1+"의 틀(I wish + 주어 + 동사의 과거형)을 보세요.",
 "1) 매일 아침 버스를 탄다는 건 지금 차가 없다는 현재 사실이에요.  2) 현재 이루기 힘든 소망은 I wish 뒤에 동사의 과거형을 써요.",
 "have(가지다)의 과거형이에요. h로 시작하는 3글자예요.","I wish + 과거형: 지금 이루기 힘든 소망");
W(2,"A",2,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>I wish I ___ him for advice before I started my new job. (ask)","had asked","I wish I had asked him for advice before I started my new job.","내가 새 직장을 시작하기 전에 그에게 조언을 구했더라면 좋았을 텐데.",
 Q2+"의 틀(I wish + 주어 + had p.p.)을 보세요.",
 "1) 뒤에 before I started(원형 start: 시작하다, ‘시작하기 전에’)가 있어서 지나간 일이에요.  2) 과거에 이루지 못한 일을 아쉬워할 때는 I wish + had + p.p.예요.",
 "had로 시작하는 두 단어예요. 둘째 단어는 a로 시작하는 5글자예요.","지난 일 아쉬움: I wish + had p.p.");
W(2,"A",3,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>I feel lonely. I wish I ___ more friends. (have)","had","I feel lonely. I wish I had more friends.","나는 외롭다. 친구가 더 있다면 좋을 텐데.",
 Q1+"의 예문(고양이가 있다면 좋을 텐데)을 보세요.",
 "1) I feel lonely(외로운)는 지금의 상태예요.  2) 지금 친구가 없어서 아쉬운 마음이니, 현재 사실의 반대 소망이에요. I wish 뒤 동사의 시제를 정해요.",
 "have(가지다)의 과거형, 3글자예요.","현재 아쉬움: I wish + 동사의 과거형");
W(2,"A",4,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>The traffic was terrible. I wish I ___ the train instead. (take)","had taken","The traffic was terrible. I wish I had taken the train instead.","교통이 끔찍했다. 그 대신 기차를 탔더라면 좋았을 텐데.",
 Q2+"의 예문(배드민턴 동아리에 가입했더라면)을 보세요.",
 "1) The traffic was terrible(끔찍한)이 과거 일이에요.  2) 과거에 하지 못한 걸 아쉬워하니 I wish + had + p.p.예요.  3) take(타다)는 불규칙 동사예요. 과거분사 모양을 떠올려요.",
 "had로 시작하는 두 단어예요. take의 과거분사는 t로 시작하는 5글자예요.","take의 과거분사 taken + had");
W(2,"A",5,"( ) 안의 말을 이용하여 문장을 완성하시오.<br>She speaks as if she ___ the story. In fact, she doesn’t know anything about it. (know)","knew","She speaks as if she knew the story. In fact, she doesn’t know anything about it.","그녀는 마치 그 이야기를 아는 것처럼 말한다. 사실, 그녀는 그것에 대해 아무것도 모른다.",
 Q3+"의 틀(as if + 주어 + 동사의 과거형)을 보세요.",
 "1) 주절의 speaks(원형 speak: 말하다)는 현재예요. In fact 뒤 문장도 현재(doesn’t know)예요.  2) 말하는 때와 같은 시점의 사실과 반대면 as if 뒤는 과거형이에요.",
 "know(알다)의 과거형이에요. k로 시작하는 4글자예요.","as if + 과거형: 같은 시점 사실의 반대");

W("CH","SC",4,IU+"<br>내가 너무 바쁘지 않으면, 나는 너와 함께 갈 텐데. (go, with you)<br>If I weren’t so busy, ___.","I would go with you","If I weren’t so busy, I would go with you.","내가 너무 바쁘지 않으면, 나는 너와 함께 갈 텐데.",
