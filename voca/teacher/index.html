<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex,nofollow">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>주성고 어휘 함정 피하기 - 선생님용</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<link rel="stylesheet" href="../app.css">
</head>
<body>
<main class="wrap">
  <header><div class="brand">동남비타민영어학원 · 선생님용</div><h1>어휘 <em>함정</em> 피하기</h1>
  <p class="sub">학생 현황, 학생 링크 모음, 기록 코드 읽기</p></header>
  <section class="panel"><h2>학생 현황 <span id="vcnt"></span></h2>
    <div class="btnrow" id="vgate" style="display:none"><button class="btn pri" id="vlog">구글로 로그인</button></div>
    <p class="note" id="vmsg">준비 중...</p>
    <div class="rows" id="vlist"></div></section>
  <section class="panel"><h2>학생 링크 <span id="cnt"></span></h2><div class="rows" id="links"></div></section>
  <section class="panel tool"><h2>학생 기록 코드 읽기</h2>
    <p class="note">위 학생 현황에서 '코드 복사'로 받은 값이나 학생이 보낸 코드를 붙여넣으면 자세히 볼 수 있습니다. 이 화면은 읽기만 합니다.</p>
    <textarea id="in" placeholder="V1. 로 시작하는 코드"></textarea>
    <div class="btnrow"><button class="btn pri" id="go">읽기</button></div>
    <div id="out" style="margin-top:12px"></div></section>
</main>
<script src="../data/index.js"></script>
<script>
(function(){
  var reg=window.VOCAREG||[],base=location.href.replace(/teacher\/.*$/,'');
  window.VOCADATA=window.VOCADATA||{};
  var left=reg.length;
  function ready(){render()}
  reg.forEach(function(r){var s=document.createElement('script');s.src='../data/'+r.id+'.js';s.onload=s.onerror=function(){if(--left===0)ready()};document.head.appendChild(s)});
  if(!reg.length)ready();
  function render(){
    var core=null;
    var s=document.createElement('script');s.src='../app.js';s.onload=function(){core=window.VocaCore;wire(core)};document.head.appendChild(s);
    document.getElementById('cnt').textContent=reg.length+'개 묶음';
    document.getElementById('links').innerHTML=reg.map(function(r){
      var u=base+r.id+'/';
      return '<div class="row" style="display:grid;gap:4px"><div><b>'+r.school+' · '+r.title+'</b></div><div style="word-break:break-all"><a href="'+u+'">'+u+'</a></div>'+
        '<div class="btnrow" style="margin-top:0"><button class="btn" data-u="'+u+'">주소 복사</button></div></div>';
    }).join('');
    document.getElementById('links').onclick=function(ev){var b=ev.target.closest('button[data-u]');if(!b)return;
      try{navigator.clipboard.writeText(b.getAttribute('data-u')).then(function(){b.textContent='복사됨'},function(){b.textContent='직접 복사해 주세요'})}catch(e){b.textContent='직접 복사해 주세요'}};
  }
  var VCORE=null,VPEND=null,VAUTH=null,VDOCS=[];
  function vsay(t){document.getElementById('vmsg').textContent=t||''}
  function vrender(){
    var core=VCORE;if(!core){VPEND=vrender;return}
    var h=VDOCS.sort(function(a,b){return b.t-a.t}).map(function(d,i){
      var line='';
      try{var o=core.decode(d.code),B=window.VOCADATA[o.id];if(B){var G=core.build(B);line=Object.keys(G.L).map(function(l){var L=G.L[l],c=core.counts(o.s,L);return l+'과 정복 '+c[3]+' · 익힘 '+c[2]+' / '+L.edges.length}).join('  ')}}catch(e){line='코드를 읽지 못함'}
      var when=new Date(d.t),ws=(when.getMonth()+1)+'/'+when.getDate()+' '+('0'+when.getHours()).slice(-2)+':'+('0'+when.getMinutes()).slice(-2);
      var reg=(window.VOCAREG||[]).filter(function(r){return r.id===d.set})[0];
      return '<div class="row" style="display:grid;gap:4px"><div><b>'+core.esc(d.name||'이름 없음')+'</b> · '+core.esc(reg?reg.school:d.set)+' · 마지막 '+ws+'</div><div>'+core.esc(line)+'</div><div class="btnrow" style="margin-top:0"><button class="btn" data-see="'+i+'">자세히</button><button class="btn" data-cp="'+i+'">코드 복사</button></div></div>';
    }).join('');
    document.getElementById('vlist').innerHTML=h;document.getElementById('vcnt').textContent=VDOCS.length+'명';
    vsay(VDOCS.length?'':'아직 올라온 기록이 없습니다. 학생이 앱을 열면 올라옵니다.');
  }
  document.getElementById('vlist').onclick=function(ev){
    var a=ev.target.closest('[data-see]'),b=ev.target.closest('[data-cp]');
    if(a){document.getElementById('in').value=VDOCS[Number(a.getAttribute('data-see'))].code;document.getElementById('go').click();document.getElementById('out').scrollIntoView({behavior:'smooth'})}
    if(b){var c=VDOCS[Number(b.getAttribute('data-cp'))].code;try{navigator.clipboard.writeText(c).then(function(){b.textContent='복사됨'},function(){b.textContent='직접 복사해 주세요'})}catch(e){b.textContent='직접 복사해 주세요'}}
  };
  function vload(){
    vsay('불러오는 중...');VDOCS=[];
    var base='https://firestore.googleapis.com/v1/projects/h-roadmap/databases/(default)/documents/vocalog?pageSize=300';
    function page(tok){
      return VAUTH.token().then(function(t){return fetch(base+(tok?'&pageToken='+encodeURIComponent(tok):''),{headers:{Authorization:'Bearer '+t}})}).then(function(r){
        if(r.status===401||r.status===403)throw new Error('이 계정으로는 볼 수 없습니다. 선생님 계정으로 로그인해 주세요.');
        if(!r.ok)throw new Error('읽기 실패 '+r.status);return r.json()}).then(function(j){
        (j.documents||[]).forEach(function(d){var f=d.fields||{};VDOCS.push({code:f.code?f.code.stringValue:'',name:f.name?f.name.stringValue:'',set:f.set?f.set.stringValue:'',t:Number(f.t&&f.t.integerValue)||0})});
        if(j.nextPageToken)return page(j.nextPageToken)});
    }
    page('').then(vrender,function(e){vsay(e.message)});
  }
  window.__vReady=function(a){VAUTH=a};
  window.__vUser=function(u){document.getElementById('vgate').style.display=u?'none':'';if(u)vload();else{vsay('로그인하면 학생 현황이 보입니다.');document.getElementById('vlist').innerHTML=''}};
  document.getElementById('vlog').onclick=function(){if(!VAUTH){vsay('준비 중입니다. 잠시 뒤 다시 눌러 주세요.');return}VAUTH.signIn().catch(function(e){vsay((e&&e.code)==='auth/popup-blocked'?'로그인 창이 막혔습니다. 크롬에서 열어 주세요.':'')})};
  function wire(core){
    VCORE=core;if(VPEND)VPEND();
    document.getElementById('go').onclick=function(){
      var out=document.getElementById('out');
      try{
        var o=core.decode(document.getElementById('in').value),B=window.VOCADATA[o.id];
        if(!B)throw new Error('이 코드의 묶음('+o.id+')을 찾을 수 없어요');
        var G=core.build(B),st=o.s,h='<div class="rows"><div class="row"><span>학생</span><b>'+core.esc(st.name||'이름 없음')+'</b></div>';
        Object.keys(G.L).forEach(function(l){
          var L=G.L[l],c=core.counts(st,L),im=core.immunity(st,L);
          h+='<div class="row"><span>'+l+'과 연결 '+L.edges.length+'개</span><b>새것 '+c[0]+' · 보는 중 '+c[1]+' · 익힘 '+c[2]+' · 정복 '+c[3]+'</b></div>'+
             '<div class="row"><span>'+l+'과 오늘 푼 수 / 낚시 면역률</span><b>'+core.todayN(st,l)+' / '+(im===null?'-':im+'%')+'</b></div>';
        });
        h+='</div>';
        var rec=(st.recent||[]).slice(0,6).map(function(r){
          var L=G.L[r.l],t='';
          if(r.k==='b'){var b=L.broken.filter(function(x){return x.n===r.n&&x.g===r.g})[0];if(b)t=r.l+'과 '+r.n+'번 · '+core.esc(b.why)}
          else{var e=L.edges.filter(function(x){return x.id===r.id})[0];if(e)t='연결 오답 · '+core.relLine(G,e.b,e.a,e.t,'hub')}
          return t?'<li>'+t+'</li>':'';
        }).join('');
        if(rec)h+='<h2 style="font-size:15px;margin:14px 0 6px">최근 걸린 낚시</h2><ul class="miss">'+rec+'</ul>';
        out.innerHTML=h;
      }catch(e){out.innerHTML='<div class="fb no">읽지 못했어요: '+core.esc(e.message)+'</div>'}
    };
  }
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const auth=getAuth(initializeApp({apiKey:"AIzaSyC88G-OjMJOqVqnIVqunzh7fvk91wtKKnA",authDomain:"h-roadmap.firebaseapp.com",projectId:"h-roadmap",appId:"1:575520405083:web:b9f40b64cb0ae3d1a9317e"}));
let first=true;
onAuthStateChanged(auth,u=>{
  if(first){first=false;window.__vReady({
    token:()=>auth.currentUser?auth.currentUser.getIdToken():Promise.reject(new Error('로그인이 필요합니다')),
    signIn:()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});return signInWithPopup(auth,p);},
    signOut:()=>signOut(auth)
  });}
  window.__vUser(u);
});
</script>
</body>
</html>
