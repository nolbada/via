rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Everyone has a job in my class.", "ko": "우리 반에서는 모두가 맡은 일이 있다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "The most populous one is to feed our class pet, Larry, the iguana.", "ko": "가장 인기 있는 것은 우리 반 반려동물인 이구아나 Larry에게 먹이를 주는 일이다.", "ok": false, "foot": ["1iguana 이구아나"], "fixes": [{"wrong": "populous", "right": "popular", "partial": false, "at": [2], "point": "어휘: '인기 있는'은 popular, populous는 '인구가 많은'이라는 다른 뜻", "topic": "어휘", "memo": "'인기 있는'은 popular, populous는 '인구가 많은'이라는 다른 뜻"}]}, {"n": 3, "tag": null, "en": "This week, I has to take care of him.", "ko": "이번 주에는 내가 그를 돌봐야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "has", "right": "have", "partial": false, "at": [3], "point": "조동사 have to: 주어가 I이므로 have to 사용(has to는 3인칭 단수 주어에만)", "topic": "조동사 have to", "memo": "주어가 I이므로 have to 사용(has to는 3인칭 단수 주어에만)"}]}, {"n": 4, "tag": null, "en": "It are Friday and I am walk back home.", "ko": "금요일이고 나는 집으로 걸어서 돌아가고 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "are", "right": "is", "partial": false, "at": [1], "point": "수일치: It(단수)에 맞춰 be동사 is 사용", "topic": "수일치", "memo": "It(단수)에 맞춰 be동사 is 사용"}, {"wrong": "walk", "right": "walking", "partial": false, "at": [6], "point": "현재진행형: be동사(am)+동사원형-ing(walking)", "topic": "현재진행형", "memo": "be동사(am)+동사원형-ing(walking)"}]}, {"n": 5, "tag": null, "en": "I see a woman which is walking with her pet dog.", "ko": "나는 반려견과 함께 걷고 있는 한 여자를 본다.", "ok": false, "foot": [], "fixes": [{"wrong": "which", "right": "who", "partial": false, "at": [4], "point": "관계대명사: 선행사가 사람(a woman)이므로 who(또는 that) 사용", "topic": "관계대명사", "memo": "선행사가 사람(a woman)이므로 who(또는 that) 사용"}]}, {"n": 6, "tag": null, "en": "Huh? Pet? Larry? I turn around and running back to the classroom.", "ko": "어? 반려동물? Larry? 나는 돌아서서 교실로 다시 달려간다.", "ok": false, "foot": [], "fixes": [{"wrong": "running", "right": "run", "partial": false, "at": [7], "point": "병렬구조: and로 연결된 동사는 같은 형태로 turn ... and run 사용", "topic" ?", "Everyone has a job in my class. The most popular one is to feed our class pet, Larry, the iguana. This week, I have to take care of him. It is Friday and I am walking back home. I see a woman who is walking with her pet dog. Huh? Pet? Larry? I turn around and run back to the classroom. The cage is open, and Larry is gone. Oh, no! Where is Larry? What should I tell my classmates? My mind turns into a worry machine. I begin to breathe quickly. Think, Oliver, think! What should I do? I have friends who can help me. I call and ask them to come right away. After a while, Mike and Jenny run into the classroom. “Don’t worry, Oliver. We’ll find Larry together,” Jenny says. First, Jenny tells me to breathe in and out slowly. I feel much calmer. Mike says, “The windows are closed. Larry must still be in here.” We look everywhere in the classroom, but we can’t find Larry. “How about playing the recorder? Larry may come out,” Mike says. “Well, Larry is NOT a snake. Look! This website says iguanas like dark places. “Let’s make the room dark,” Jenny says. So, we turn off the lights and close the curtains. We wait, but nothing happens. “Larry must be hungry because he ate nothing today,” I say. Mike says, “I have a banana. It’s Larry’s favorite snack. “Let’s put it next to the cage.” We wait quietly. A little later, we hear little footsteps. It is Larry! We find him under the locker which is at the back of the classroom. He slowly walks to the banana and eats it. Mike runs quickly and leads Larry into the cage. We all shout for joy! And I am the happiest one."];var PASS_KO=["우리 반 반려동물은 어디에 있을까?", "우리 반에서는 모두가 맡은 일이 있다. 가장 인기 있는 것은 우리 반 반려동물인 이구아나 Larry에게 먹이를 주는 일이다. 이번 주에는 내가 그를 돌봐야 한다. 금요일이고 나는 집으로 걸어서 돌아가고 있다. 나는 반려견과 함께 걷고 있는 한 여자를 본다. 어? 반려동물? Larry? 나는 돌아서서 교실로 다시 달려간다. 우리 문이 열려 있고, Larry가 사라졌다. 오, 안 돼! Larry는 어디에 있지? 반 친구들에게 뭐라고 말해야 하지? 나의 머릿속은 걱정 기계로 변한다. 나는 빠르게 숨을 쉬기 시작한다. 생각하자, Oliver, 생각하자! 나는 어떻게 해야 하지? 나는 나를 도와줄 수 있는 친구들이 있다. 나는 친구들에게 전화를 걸어 바로 와 달라고 부탁한다. 잠시 후, M   h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;

 }

function sHtml(q,lock){

 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}

  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';

function qSummary(p){

  ms.slice(0,cap).forEach(function(q){

  });

 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
