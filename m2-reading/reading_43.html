<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 43</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}
.sec{margin:26px 0 8px;font-weight:700;color:var(--pri);font-size:15px;border-left:4px solid var(--pri);padding-left:8px}
.sent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:10px;align-items:flex-start}.n{min-width:24px;color:var(--mut);font-size:13px;padding-top:3px}
.txt{font-size:18px;line-height:2}
.wd{cursor:pointer;border-radius:5px;padding:1px 2px;margin:0 1px;-webkit-tap-highlight-color:transparent}
.wd:hover{background:#eef3f8}.wd.on{background:var(--sel);box-shadow:inset 0 -2px 0 var(--selb)}
.locked .wd{cursor:default}.locked .wd:hover{background:none}
.wd.hit{background:var(--okbg);box-shadow:inset 0 -2px 0 var(--ok)}.wd.miss{background:var(--badbg);box-shadow:inset 0 -2px 0 var(--bad)}.wd.x{text-decoration:line-through;color:var(--mut)}
.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}
.note{margin:10px 0 0 34px;padding:10px 12px;border-radius:8px;font-size:14.5px}
.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Some of you have a dream job in mind, but others do not.", "ko": "여러분 중의 일부는 꿈의 직업을 염두에 두고 있지만 다른 사람들은 그렇지 않다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "It is not easy for you finding a future job.", "ko": "여러분이 미래 직업을 찾는 것은 쉽지 않다.", "ok": false, "foot": [], "fixes": [{"wrong": "finding", "right": "to find", "partial": false, "at": [6], "point": "동명사 vs to부정사: 「It is + 형용사 + for 목적어 + to부정사」 구문에서는 to부정사를 사용", "topic": "동명사 vs to부정사", "memo": "「It is + 형용사 + for 목적어 + to부정사」 구문에서는 to부정사를 사용"}]}, {"n": 3, "tag": null, "en": "But we all need to figure out what do you want to be in the future.", "ko": "그러나 우리는 모두 당신이 미래에 무엇이 되고 싶은지 알아내야 한다.", "ok": false, "foot": ["1figure out 파악하다, 알아내다"], "fixes": [{"wrong": "what do you want", "right": "what you want", "partial": false, "at": [7], "point": "간접의문문 어순: 의문사 + 주어 + 동사 순서로 써야 함", "topic": "간접의문문 어순", "memo": "의문사 + 주어 + 동사 순서로 써야 함"}]}, {"n": 4, "tag": null, "en": "Thinks about the following questions, and you find a path to your future job.", "ko": "다음의 질문들을 생각해 보면 여러분의 미래 직업으로 가는 길을 찾게 될 것이다.", "ok": false, "foot": [], "fixes": [{"wrong": "Thinks", "right": "Think", "partial": false, "at": [0], "point": "명령문은 동사원형으로 시작 (Thinks가 아닌 Think)", "topic": "어법", "memo": "명령문은 동사원형으로 시작 (Thinks가 아닌 Think)"}, {"wrong": "you find", "right": "you will find", "partial": false, "at": [6], "point": "시제: 명령문 + and 뒤에는 미래 의미의 will이 필요", "topic": "시제", "memo": "명령문 + and 뒤에는 미래 의미의 will이 필요"}]}, {"n": 5, "tag": "Why Do We Work?", "en": "First, we work for make money.", "ko": "첫째, 우리는 돈을 벌기 위해 일한다.", "ok": false, "foot": [], "fixes": [{"wrong": "for make", "right": "to make", "partial": false, "at": [3], "point": "to부정사: 목적(~하기 위해)을 나타낼 때는 to부정사 사용 (for + 동사원형은 불가)", "topic": "to부정사", "memo": "목적(~하기 위해)을 나타낼 때는 to부정사 사용 (for + 동사원형은 불가)"}]}, {"n": 6, "tag": null, "en": "Our jobs help us getting paid so we can make a living.", "ko": "우리의 직업은 우리가 돈을 벌 수 있게 돕고 그래서 우리는 생계를 꾸릴 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "getting", "right": "get", "partial": false, "at": [4], "point": "준사역동사 help: help + 목적어 + 동사원형(또는 to부정사) 사용", "topic": "준사역동사 help", "memo": "help + 목적어 + 동사원형(또는 to부정사) 사용"}]}, {"n": 7, "tag": null, "en": "Second, we work to take on social roles.", "ko": "둘째, 우리는 사회적 역할을 맡기 위해 일한다.", "ok": true, "foot": [], "fixes": []}, {"n": 8, "tag": null, "en": "For example, street cleaners keep our towns and cities cleanly, and police officers make our society safely.", "ko": "예를 들어, 환경미화원은 우리 마을과 도시를 깨끗하게 유지하고, 경찰관은 우리 사회를 안전하게 만든다.", "ok": false, "foot": [], "fixes": [{"wrong": "cleanly", "right": "clean", "partial": false, "at": [9], "point": "5형식: keep + 목적어 + 목적격보어(형용사) - 부사 cleanly 대신 형용사 clean 사용", "topic": "5형식", "memo": "keep + 목적어 + 목적격보어(형용사) - 부사 cleanly 대신 형용사 clean 사용"}, {"wrong": "safely", "right": "safe", "partial": false, "at": [16], "point": "5형식: make + 목적어 + 목적격보어(형용사) - 부사 safely 대신 형용사 safe 사용", "topic": "5형식", "memo": "make + 목적어 + 목적격보어(형용사) - 부사 safely 대신 형용사 safe 사용"}]}, {"n": 9, "tag": null, "en": "We rely in others to do these important jobs, and everyone considers their job as a special role.", "ko": "우리는 이런 중요한 일을 하는 사람들에게 의존하며 모두가 자신의 일을 특별한 역할로 여긴다.", "ok": false, "foot": ["1rely on ~에 의존하다"], "fixes": [{"wrong": "rely in", "right": "rely on", "partial": false, "at": [1], "point": "전치사 표현: '~에 의존하다'는 rely on 사용", "topic": "전치사 표현", "memo": "'~에 의존하다'는 rely on 사용"}, {"wrong": "considers their job as", "right": "considers their job", "partial": false, "at": [11], "point": "5형식: consider + 목적어 + 목적격보어(명사)는 전치사 as 없이 사용", "topic": "5형식", "memo": "consider + 목적어 + 목적격보어(명사)는 전치사 as 없이 사용"}]}, {"n": 10, "tag": null, "en": "Third, we work to feel proudly of our work.", "ko": "셋째, 우리는 우리의 일에 대해 자부심을 느끼기 위해 일한다.", "ok": false, "foot": [], "fixes": [{"wrong": "proudly", "right": "proud", "partial": false, "at": [5], "point": "형용사/부사 구분: 감각동사 feel의 보어로는 형용사 proud 사용", "topic": "형용사/부사 구분", "memo": "감각동사 feel의 보어로는 형용사 proud 사용"}]}, {"n": 11, "tag": null, "en": "By working, we can help others and showing our abilities.", "ko": "일을 함으로써 우리는 다른 사람을 돕고 우리의 능력을 보여 줄 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "showing", "right": "show", "partial": false, "at": [7], "point": "병렬구조: 조동사 can 뒤에는 help와 show가 동사원형으로 병렬 연결되어야 함", "topic": "병렬구조", "memo": "조동사 can 뒤에는 help와 show가 동사원형으로 병렬 연결되어야 함"}]}, {"n": 12, "tag": null, "en": "In the end, we work to find meaningful in life.", "ko": "결국, 우리는 삶의 의미를 찾기 위해 일한다.", "ok": false, "foot": [], "fixes": [{"wrong": "meaningful", "right": "meaning", "partial": false, "at": [7], "point": "어휘/품사: find의 목적어로는 명사 meaning(의미) 사용, meaningful은 형용사", "topic": "어휘/품사", "memo": "find의 목적어로는 명사 meaning(의미) 사용, meaningful은 형용사"}]}, {"n": 13, "tag": "How Can I Find My Job?", "en": "Everyone have their own favorites activities.", "ko": "모두가 자신만의 가장 좋아하는 활동이 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "have", "right": "has", "partial": false, "at": [1], "point": "수일치: Everyone은 단수 취급하므로 동사 has 사용", "topic": "수일치", "memo": "Everyone은 단수 취급하므로 동사 has 사용"}, {"wrong": "favorites", "right": "favorite", "partial": false, "at": [4], "point": "품사: favorite은 형용사이므로 복수형(favorites)으로 쓸 수 없음", "topic": "품사", "memo": "favorite은 형용사이므로 복수형(favorites)으로 쓸 수 없음"}]}, {"n": 14, "tag": null, "en": "Try to connect them to a real job, and you will found your path.", "ko": "그것을 실제 직업과 연결해 보라, 그러면 여러분의 길을 찾을 것이다.", "ok": false, "foot": [], "fixes": [{"wrong": "found", "right": "find", "partial": false, "at": [11], "point": "어휘/어형: 조동사 will 뒤에는 동사원형 find 사용 (found는 find의 과거형 또는 다른 동사)", "topic": "어휘/어형", "memo": "조동사 will 뒤에는 동사원형 find 사용 (found는 find의 과거형 또는 다른 동사)"}]}, {"n": 15, "tag": null, "en": "If you like watching TV shows, you can be a producer or a writer for the shows what you watch.", "ko": "여러분이 TV 프로그램 보는 것을 좋아한다면, 여러분이 시청하는 그 프로그램들의 프로듀서나 작가가 될 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "what you watch", "right": "that you watch", "pa , "en": "If you are good at take care of people, you can become a soccer player's manager.", "ko": "사람을 돌보는 것을 잘한다면, 축구선수의 매니저가 될 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "take", "right": "taking", "partial": false, "at": [5], "point": "전치사 + 동명사: good at 뒤에는 동명사(taking) 사용", "topic": "전치사 + 동명사", "memo": "good at 뒤에는 동명사(taking) 사용"}]}, {"n": 21, "tag": null, "en": "Or you can work as a marketer for a soccer team if you are good at think creative.", "ko": "또는 창의적으로 생각하는 것을 잘한다면, 축구팀의 마케터로 일할 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "think", "right": "thinking", "partial": false, "at": [16], "point": "전치사 + 동명사: good at 뒤에는 동명사 thinking 사용", "topic": "전치사 + 동명사", "memo": "good at 뒤에는 동명사 thinking 사용"}, {"wrong": "creative", "right": "creatively", "partial": false, "at": [17], "point": "형용사/부사 구분: 동사 think를 수식하려면 부사 creatively 사용", "topic": "형용사/부사 구분", "memo": "동사 think를 수식하려면 부사 creatively 사용"}]}, {"n": 22, "tag": null, "en": "Look for jobs that matches your favorite things and your abilities.", "ko": "여러분이 가장 좋아하는 것과 능력에 맞는 직업을 찾아라.", "ok": false, "foot": [], "fixes": [{"wrong": "matches", "right": "match", "partial": false, "at": [4], "point": "수일치: 선행사 jobs(복수)를 받는 주격 관계대명사절의 동사는 match 사용", "topic": "수일치", "memo": "선행사 jobs(복수)를 받는 주격 관계대명사절의 동사는 match 사용"}]}, {"n": 23, "tag": "What Do I Have to Do Now?", "en": "First, focus at your school subjects now.", "ko": "먼저, 지금 여러분의 학교 과목에 집중하라.", "ok": false, "foot": [], "fixes": [{"wrong": "at", "right": "on", "partial": false, "at": [2], "point": "어휘/전치사: focus on(~에 집중하다)이 올바른 표현", "topic": "어휘/전치사", "memo": "focus on(~에 집중하다)이 올바른 표현"}]}, {"n": 24, "tag": null, "en": "They give you the basic skill for your future.", "ko": "이 과목들은 당신의 미래를 위한 기본적인 기술을 제공한다.", "ok": false, "foot": [], "fixes": [{"wrong": "skill", "right": "skills", "partial": false, "at": [5], "point": "어휘/수일치: 여러 능력을 의미하므로 복수형 skills 사용", "topic": "어휘/수일치", "memo": "여러 능력을 의미하므로 복수형 skills 사용"}]}, {"n": 25, "tag": null, "en": "These skills help you making good choices.", "ko": "이러한 기술은 여러분이 좋은 선택을 하도록 돕는다.", "ok": false, "foot": [], "fixes": [{"wrong": "making", "right": "make", "partial": false, "at": [4], "point": "준사역동사 help: help + 목적어 + 동사원형 사용", "topic": "준사역동사 help", "memo": "help + 목적어 + 동사원형 사용"}]}, {"n": 26, "tag": null, "en": "Second, gather informations about jobs that interests you.", "ko": "두 번째로, 여러분에게 흥미로운 직업에 대한 정보를 모아라.", "ok": false, "foot": [], "fixes": [{"wrong": "informations", "right": "information", "partial": false, "at": [2], "point": "어휘: information은 셀 수 없는 명사이므로 복수형 불가", "topic": "어휘", "memo": "information은 셀 수 없는 명사이므로 복수형 불가"}, {"wrong": "interests", "right": "interest", "partial": false, "at": [6], "point": "수일치: 선행사 jobs(복수)를 받는 관계대명사절의 동사는 interest 사용", "topic": "수일치", "memo": "선행사 jobs(복수)를 받는 관계대명사절의 동사는 interest 사용"}]}, {"n": 27, "tag": null, "en": "You can watch experts to talk about their jobs in videos, or reading books about them.", "ko": "영상 속 전문가들이 자신의 직업에 대해 이야기하는 것을 보거나, 그 직업에 대한 책을 읽을 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "to talk", "right": "talk", "partial": false, "at": [4], "point": "5형식 지각동사: watch + 목적어 + 동사원형 (to부정사 사용 불가)", "topic": "5형식 지각동사", "memo": "watch + 목적어 + 동사원형 (to부정사 사용 불가)"}, {"wrong": "reading", "right": "read", "partial": false, "at": [12], "point": "병렬구조: 조동사 can 뒤에는 watch와 read가 동사원형으로 병렬 연결되어야 함", "topic": "병렬구조", "memo": "조동사 can 뒤에는 watch와 read가 동사원형으로 병렬 연결되어야 함"}]}, {"n": 28, "tag": null, "en": "This way, you can learn about real work in those job.", "ko": "이 방식으로, 그 직업에서의 실제 업무에 대해 배울 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "job", "right": "jobs", "partial": false, "at": [10], "point": "어휘/수일치: those 뒤에는 복수명사 jobs 사용", "topic": "어휘/수일치", "memo": "those 뒤에는 복수명사 jobs 사용"}]}, {"n": 29, "tag": null, "en": "Finally, keep try new things!", "ko": "마지막으로, 새로운 것들을 계속 시도하라!", "ok": false, "foot": [], "fixes": [{"wrong": "try", "right": "trying", "partial": false, "at": [2], "point": "동명사: keep 뒤에는 동명사(trying)를 목적어로 사용", "topic": "동명사", "memo": "keep 뒤에는 동명사(trying)를 목적어로 사용"}]}, {"n": 30, "tag": null, "en": "Your interest can change often.", "ko": "여러분의 관심사는 자주 바뀔 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "interest", "right": "interests", "partial": false, "at": [1], "point": "어휘/수일치: 여러 관심사를 의미하므로 복수형 interests 사용", "topic": "어휘/수일치", "memo": "여러 관심사를 의미하므로 복수형 interests 사용"}]}, {"n": 31, "tag": null, "en": "It is very important for you experiencing different activities.", "ko": "여러분이 다양한 활동을 경험하는 것은 매우 중요하다.", "ok": false, "foot": [], "fixes": [{"wrong": "experiencing", "right": "to experience", "partial": false, "at": [6], "point": "「It is + 형용사 + for 목적어 + to부정사」 구문: to부정사 사용", "topic": "어법", "memo": "「It is + 형용사 + for 목적어 + to부정사」 구문: to부정사 사용"}]}, {"n": 32, "tag": null, "en": "Our world kept changing since the beginning of time, and jobs will also change.", "ko": "우리 세상은 태초부터 계속 변화해 왔고, 직업도 마찬가지로 변화할 것이다.", "ok": false, "foot": ["1since the beginning of time 태초부터, 아주 오래 전부터"], "fixes": [{"wrong": "kept", "right": "has kept", "partial": false, "at": [2], "point": "현재완료시제: since와 함께 쓰여 과거부터 현재까지 계속됨을 나타낼 때는 has kept(현재완료) 사용", "topic": "현재완료시제", "memo": "since와 함께 쓰여 과거부터 현재까지 계속됨을 나타낼 때는 has kept(현재완료) 사용"}]}, {"n": 33, "tag": null, "en": "Keep to explore, and you'll find your dream job soon.", "ko": "계속 탐구하라, 그러면 여러분은 꿈의 직업을 곧 찾게 될 것이다.", "ok": false, "foot": [], "fixes": [{"wrong": "to explore", "right": "exploring", "partial": false, "at": [1], "point": "명령문 keep은 동명사를 목적어로 취함 (keep + v-ing)", "topic": "어법", "memo": "명령문 keep은 동명사를 목적어로 취함 (keep + v-ing)"}]}];var PP=[["Some of you have a dream job in mind, but others do not.", "여러분 중의 일부는 꿈의 직업을 염두에 두고 있지만 다른 사람들은 그렇지 않다.", 0], ["It is not easy for you to find a future job.", "여러분이 미래 직업을 찾는 것은 쉽지 않다.", 0], ["But we all need to figure out what you want to be in the future.", "그러나 우리는 모두 당신이 미래에 무엇이 되고 싶은지 알아내야 한다.", 0], ["Think about the following questions, and you will find a path to your future job.", "다음의 질문들을 생각해 보면 여러분의 미래 직업으로 가는 길을 찾게 될 것이다.", 0], ["First, we work to make money.", "첫째, 우리는 돈을 벌기 위해 일한다.", 0], ["Our jobs help us get paid so we can make a living.", "우리의 직업은 우리가 돈을 벌 수 있게 돕고 그래서 우리는 생계를 꾸릴 수 있다.", 0], ["Second, we work to take on social roles.", "둘째, 우리는 사회적 역할을 맡기 위해 일한다.", 0], ["For example, street cleaners keep our towns and cities clean, and police officers make our society safe.", "예를 들어, 환경미화원은 우리 마을과 도시를 깨끗하게 유지하고, 경찰관은 우리 사회를 안전하게 만든다.", 0], ["We rely on others to do these important jobs, and everyone considers their job a special role.", "우리는 이런 중요한 일을 하는 사람들에게 의존하며 모두가 자신의 일을 특별한 역할로 여긴다.", 0], ["Third, we work to feel proud of our work.", "셋째, 우리는 우리의 일에 대해 자부심을 느끼기 위해 일한다.", 0], ["By working, we can help others and show our abilities.", "일을 함으로써 우리는 다른 사람을 돕고 우리의 능력을 보여 줄 수 있다.", 0], ["In the end, we work to find meaning in life.", "결국, 우리는 삶의 의미를 찾기 위해 일한다.", 0], ["Everyone has their own favorite activities.", "모두가 자신만의 가장 좋아하는 활동이 있다.", 0], ["Try to connect them to a real job, and you will find your path.", "그것을 실제 직업과 연결해 보라, 그러면 여러분의 길을 찾을 것이다.", 0], ["If you like watching TV shows, you can be a producer or a writer for the shows that you watch.", "여러분이 TV 프로그램 보는 것을 좋아한다면, 여러분이 시청하는 그 프로그램들의 프로듀서나 작가가 될 수 있다.", 0], ["However, liking something and being good at it are not the same.", "하지만 무언가를 좋아하는 것과 그것을 잘하는 것은 같지 않다.", 0], ["Playing soccer as a job is different from playing it as a hobby.", "축구를 직업으로 하는 것은 취미로 하는 것과는 다르다.", 0], ["You love soccer but aren't good at it.", "축구를 정말 좋아하지만 잘하지 못한다.", 0], ["Then you can look for other jobs in soccer.", "그러면 축구에서 다른 직업들을 찾을 수 있다.", 0], ["If you are good at taking care of people, you can become a soccer player's manager.", "사람을 돌보는 것을 잘한다면, 축구선수의 매니저가 될 수 있다.", 0], ["Or you can work as a marketer for a soccer team if you are good at thinking creatively.", "또는 창의적으로 생각하는 것을 잘한다면, 축구팀의 마케터로 일할 수 있다.", 0], ["Look for jobs that match your favorite things and your abilities.", "여러분이 가장 좋아하는 것과 능력에 맞는 직업을 찾아라.", 0], ["First, focus on your school subjects now.", "먼저, 지금 여러분의 학교 과목에 집중하라.", 0], ["They give you the basic skills for your future.", "이 과목들은 당신의 미래를 위한 기본적인 기술을 제공한다.", 0], ["These skills help you make good choices.", "이러한 기술은 여러분이 좋은 선택을 하도록 돕는다.", 0], ["Second, gather information about jobs that interest you.", "두 번째로, 여러분에게 흥미로운 직업에 대한 정보를 모아라.", 0], ["You can watch experts talk about their jobs in videos, or read books about them.", "영상 속 전문가들이 자신의 직업에 대해 이야기하는 것을 보거나, 그 직업에 대한 책을 읽을 수 있다.", 0], ["This way, you can learn about real work in those jobs.", "이 방식으로, 그 직업에서의 실제 업무에 대해 배울 수 있다.", 0], ["Finally, keep trying new things!", "마지막으로, 새로운 것들을 계속 시도하라!", 0], ["Your interests can change often.", "여러분의 관심사는 자주 바뀔 수 있다.", 0], ["It is very important for you to experience different activities.", "여러분이 다양한 활동을 경험하는 것은 매우 중요하다.", 0], ["Our world has kept changing since the beginning of time, and jobs will also change.", "우리 세상은 태초부터 계속 변화해 왔고, 직업도 마찬가지로 변화할 것이다.", 0], ["Keep exploring, and you'll find your dream job soon.", "계속 탐구하라, 그러면 여러분은 꿈의 직업을 곧 찾게 될 것이다.", 0]];var RNUM=43;var TITLE_EN="A Journey to Find My Dream";var PASS_EN=["A Journey to Find My Dream", "Some of you have a dream job in mind, but others do not. It is not easy for you to find a future job. But we all need to figure out what you want to be in the future. Think about the following questions, and you will find a path to your future job.", "First, we work to make money. Our jobs help us get paid so we can make a living. Second, we work to take on social roles. For example, street cleaners keep our towns and cities clean, and police officers make our society safe. We rely on others to do these important jobs, and everyone considers their job a special role. Third, we work to feel proud of our work. By working, we can help others and show our abilities. In the end, we work to find meaning in life.", "Everyone has their own favorite activities. Try to connect them to a real job, and you will find your path. If you like watching TV shows, you can be a producer or a writer for the shows that you watch. However, liking something and being good at it are not the same. Playing soccer as a job is different from playing it as a hobby. You love soccer but aren't good at it. Then you can look for other jobs in soccer. If you are good at taking care of people, you can become a soccer player's manager. Or you can work as a marketer for a soccer team if you are good at thinking creatively. Look for jobs that match your favorite things and your abilities.", "First, focus on your school subjects now. They give you the basic skills for your future. These skills help you make good choices. Second, gather information about jobs that interest you. You can watch experts talk about their jobs in videos, or read books about them. This way, you can learn about real work in those jobs. Finally, keep trying new things! Your interests can change often. It is very important for you to experience different activities. Our world has kept changing since the beginning of time, and jobs will also change. Keep exploring, and you'll find your dream job soon."];var PASS_KO=["나의 꿈을 찾기 위한 여정", "여러분 중의 일부는 꿈의 직업을 염두에 두고 있지만 다른 사람들은 그렇지 않다. 여러분이 미래 직업을 찾는 것은 쉽지 않다. 그러나 우리는 모두 당신이 미래에 무엇이 되고 싶은지 알아내야 한다. 다음의 질문들을 생각해 보면 여러분의 미래 직업으로 가는 길을 찾게 될 것이다.", "첫째, 우리는 돈을 벌기 위해 일한다. 우리의 직업은 우리가 돈을 벌 수 있게 돕고 그래서 우리는 생계를 꾸릴 수 있다. 둘째, 우리는 사회적 역할을 맡기 위해 일한다. 예를 들어, 환경미화원은 우리 마을과 도시를 깨끗하게 유지하고, 경찰관은 우리 사회를 안전하게 만든다. 우리는 이런 중요한 일을 하는 사람들에게 의존하며 모두가 자신의 일을 특별한 역할로 여긴다. 셋째, 우리는 우리의 일에 대해 자부심을 느끼기 위해 일한다. 일을 함으로써 우리는 다른 사람을 돕고 우리의 능력을 보여 줄 수 있다. 결국, 우리는 삶의 의미를 찾기 위해 일한다.", "모두가 자신만의 가장 좋아하는 활동이 있다. 그것을 실제 직업과 연결해 보라, 그러면 여러분의 길을 찾을 것이다. 여러분이 TV 프로그램 보는 것을 좋아한다면, 여러분이 시청하는 그 프로그램들의 프로듀서나 작가가 될 수 있다. 하지만 무언가를 좋아하는 것과 그것을 잘하는 것은 같지 않다. 축구를 직업으로 하는 것은 취미로 하는 것과는 다르다. 축구를 정말 좋아하지만 잘하지 못한다. 그러면 축구에서 다른 직업들을 찾을 수 있다. 사람을 돌보는 것을 잘한다면, 축구선수의 매니저가 될 수 있다. 또는 창의적으로 생각하는 것을 잘한다면, 축구팀의 마케터로 일할 수 있다. 여러분이 가장 좋아하는 것과 능력에 맞는 직업을 찾아라.", "먼저, 지금 여러분의 학교 과목에 집중하라. 이 과목들은 당신의 미래를 위한 기본적인 기술을 제공한다. 이러한 기술은 여러분이 좋은 선택을 하도록 돕는다. 두 번째로, 여러분에게 흥미로운 직업에 대한 정보를 모아라. 영상 속 전문가들이 자신의 직업에 대해 이야기하는 것을 보거나, 그 직업에 대한 책을 읽을 수 있다. 이 방식으로, 그 직업에서의 실제 업무에 대해 배울 수 있다. 마지막으로, 새로운 것들을 계속 시도하라! 여러분의 관심사는 자주 바뀔 수 있다. 여러분이 다양한 활동을 경험하는 것은 매우 중요하다. 우리 세상은 태초부터 계속 변화해 왔고, 직업도 마찬가지로 변화할 것이다. 계속 탐구하라, 그러면 여러분은 꿈의 직업을 곧 찾게 될 것이다."];var DG=[{"dlg": [["B", "Which classroom are you going to visit?", "너는 어느 교실에 갈 거야?"], ["G", "I’ll visit room 2-3. I’m interested in soccer.", "나는 2학년 3반 교실에 갈 거야. 나는 축구에 관심이 있거든."], ["B", "Oh, me too. The guest speaker is the famous soccer player, Park Somin! I’m so excited.", "오, 나도. 초청 연사가 유명한 축구 선수 박소민이래! 정말 신나."], ["G", "Let’s go and meet her.", "같이 가서 그녀를 만나자."]], "qs": [{"n": 1, "q": "What is the girl going to do?", "o": ["She is going to practice soccer with the boy.", "She is going to interview the famous soccer player.", "She is going to visit the specific room to listen to Park Somin’s talk.", "She is going to watch the soccer game with Park Somin.", "She is going to go to classroom 2-3 and have a presentation."], "a": 2, "evs": [["G: I’ll visit room 2-3. I’m interested in soccer.", "나는 2학년 3반 교실에 갈 거야. 나는 축구에 관심이 있거든."], ["B: Oh, me too. The guest speaker is the famous soccer player, Park Somin! I’m so excited.", "오, 나도. 초청 연사가 유명한 축구 선수 박소민이래! 정말 신나."]], "ev": ["G: I’ll visit room 2-3. I’m interested in soccer.", "나는 2학년 3반 교실에 갈 거야. 나는 축구에 관심이 있거든."], "memo": ["G: I’ll visit room 2-3. I’m interested in soccer.  (나는 2학년 3반 교실에 갈 거야. 나는 축구에 관심이 있거든.)", "B: Oh, me too. The guest speaker is the famous soccer player, Park Somin! I’m so excited.  (오, 나도. 초청 연사가 유명한 축구 선수 박소민이래! 정말 신나.)"], "ans": "She is going to visit the specific room to listen to Park Somin’s talk."}]}, {"dlg": [["G", "Mr. Choi, how can I become a good magician like you?", "최 선생님, 어떻게 하면 선생님처럼 훌륭한 마술사가 될 수 있나요?"], ["M", "Well, watch lots of videos about magic tricks and practice t  if(b){done[+b.dataset.sub]=true;logA(+b.dataset.sub);render();
  var tot=0,fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});

var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}

 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}

 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}

function partHtml(p){

 });

 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';

function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){

  else if(pick[q.n]===i)cls+=' on';

 });

  var ok=pick[q.n]===q.a;

function sHtml(q,lock){

 }

function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';

  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';

function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;

 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
