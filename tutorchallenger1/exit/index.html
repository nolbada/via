<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩튜터 챌린저 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>

<script>
var P=[{"u":1,"id":"ch1-01-1","no":1,"ko":"놓지 못하는 뇌의 습관","items":[{"n":1,"t":"tf","q":"People are more likely to think about unfinished tasks than completed ones.","ko":"사람들은 완료된 과업보다 미완성된 과업에 대해 생각할 가능성이 더 크다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"According to Russian psychologist Bluma Zeigarnik, people are more likely to think about unfinished tasks than completed ones.","러시아 심리학자인 블루마 자이가르닉에 따르면, 사람들은 완료된 과업보다 미완성된 과업에 대해 생각할 가능성이 더 크다."]],"w":"4번 문장과 같은 내용이에요. 미완성된 과업을 더 생각해요.","c":"T"},"h":"a9bec6875a"},{"n":2,"t":"tf","q":"Zeigarnik first noticed the effect in a scientific laboratory.","ko":"자이가르닉은 과학 실험실에서 그 효과를 처음 알아냈다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Surprisingly, she didn’t first notice it in a scientific laboratory or an interview, but in a restaurant.","놀랍게도, 그녀는 이것을 과학 실험실이나 인터뷰에서가 아니라 식당에서 처음 알아냈다."]],"w":"6번 문장에서 실험실이나 인터뷰가 아니라 식당에서 처음 알아냈다고 해요.","c":"F"},"h":"1f950b54ff"},{"n":3,"t":"tf","q":"The waiter kept remembering what he had served after he delivered the meals.","ko":"종업원은 음식을 전달한 뒤에도 자신이 무엇을 제공했는지 계속 기억했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"However, the moment he had delivered the meals to the customers, he would forget what he had served them.","그러나, 종업원은 손님들에게 음식을 전달하자마자 자신이 무엇을 제공했는지 잊는 것이었다."]],"w":"8번 문장에서 음식을 전달하자마자 무엇을 제공했는지 잊는다고 해요. 계속 기억한다는 것은 반대예요.","c":"F"},"h":"20ec201dc6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...people remain anxious about an unfinished task...)","ko":"...사람들이 미완성된 과업에 대해 계속 불안해하고...","opts":["지루한","자랑스러운","불안해하는","화가 난"],"word":"anxious","r":{"a":"3) 불안해하는","ev":"10번 문장","s":[[10,"That means people remain anxious about an unfinished task and try to complete it as soon as possible.","그것은 사람들이 미완성된 과업에 대해 계속 불안해하고 가능한 한 빨리 그것을 끝내려고 노력한다는 뜻이다."]],"w":"불안해서 가능한 한 빨리 끝내려 노력한다는 흐름이에요. anxious = 불안해하는.","c":3},"h":"614d82519f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the desire to get closure.)","ko":"...종결하려는 욕구.","opts":["시작","종결, 마무리","경쟁","기억"],"word":"closure","r":{"a":"2) 종결, 마무리","ev":"11번 문장","s":[[11,"In other words, people are motivated by the desire to get closure.","다시 말해서, 사람들은 종결하려는 욕구에 의해 동기부여를 받는다."]],"w":"앞 문장에서 사람들이 미완성 과업을 빨리 끝내려 한다고 했으니 closure는 끝맺음이에요.","c":2},"h":"268ef3c6e5"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThat means people remain anxious about an unfinished task and try to complete it as soon as possible.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것은 사람들이 미완성된 과업에 대해 계속 불안해하고 가능한 한 빨리 그것을 끝내려고 노력한다는 뜻이다.","opts":["미완성된 과업","자이가르닉 효과","손님들의 주문","식당 종업원"],"r":{"a":"1) 미완성된 과업","ev":"10번 문장","s":[[10,"That means people remain anxious about an unfinished task and try to complete it as soon as possible.","그것은 사람들이 미완성된 과업에 대해 계속 불안해하고 가능한 한 빨리 그것을 끝내려고 노력한다는 뜻이다."]],"w":"끝내려고 노력하는(complete) 대상은 바로 앞의 an unfinished task예요.","c":1,"k":"it = 미완성된 과업"},"pron":"it","h":"51ccb38d77"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Fishermen can never forget the one that got away.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어부는 도망쳐버린 물고기를 절대 잊을 수 없다.","opts":["어부는 물고기를 한 번도 놓친 적이 없다.","어부는 도망친 물고기를 금방 잊어버린다.","어부는 항상 도망치는 물고기를 잡는다.","어부는 놓쳐버린 물고기가 계속 마음에 남는다."],"r":{"a":"4) 어부는 놓쳐버린 물고기가 계속 마음에 남는다.","ev":"2번 문장","s":[[2,"Fishermen can never forget the one that got away.","어부는 도망쳐버린 물고기를 절대 잊을 수 없다."]],"w":"can never forget은 '절대 잊을 수 없다'이고 the one that got away는 놓친 물고기예요. 그래서 계속 마음에 남아요.","c":4},"h":"18c9dc4e68"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["종업원은 손님들이 주문한 많은 음식을 기억할 수 있었다.","자이가르닉은 미국 심리학자였다.","종업원은 음식을 전달하기 전에 주문을 잊어버렸다.","자이가르닉은 이 현상을 인터뷰에서 처음 알아냈다."],"opts":["The waiter could remember many items ordered by his customers.","Zeigarnik was an American psychologist.","The waiter forgot the orders before he delivered the meals.","Zeigarnik first found this effect in an interview."],"r":{"a":"1) The waiter could remember many items ordered by his customers. (종업원은 손님들이 주문한 많은 음식을 기억할 수 있었다.)","ev":"7번 문장","s":[[7,"She noted that the waiter could remember a large number of items ordered by his customers.","그녀는 종업원이 손님들이 주문한 다수의 음식을 기억할 수 있다는 것에 주목했다."]],"w":"7번 the waiter could remember a large number of items(종업원은 많은 음식을 기억할 수 있었다)와 같아요. 자이가르닉은 러시아 심리학자이고, 음식을 전달한 뒤에 잊었으며, 식당에서 처음 알아냈어요.","c":1},"h":"02e52c7892"},{"n":9,"t":"sum","q":"Salespeople keep (A) about a deal until they have (B) it.","ko":"판매 사원은 계약을 (B)할 때까지 그것에 대해 (A)을(를) 멈추지 못한다.","oko":["(A) 잊는 것 / (B) 체결했다","(A) 생각하는 것 / (B) 시작했다","(A) 생각하는 것 / (B) 체결했다","(A) 잊는 것 / (B) 시작했다","(A) 파는 것 / (B) 잊혀졌다"],"opts":["(A) forgetting / (B) closed","(A) thinking / (B) started","(A) thinking / (B) closed","(A) forgetting / (B) started","(A) selling / (B) forgotten"],"r":{"a":"3) (A) thinking / (B) closed ((A) 생각하는 것 / (B) 체결했다)","ev":"1번 문장","s":[[1,"Salespeople can’t stop thinking about the deal they are working on until they have closed it.","판매 사원은 진행 중인 계약을 체결할 때까지 그것에 대해 생각하는 것을 멈출 수 없다."]],"w":"1번 can't stop thinking about the deal until they have closed it(계약을 체결할 때까지 그것에 대해 생각하는 것을 멈출 수 없다)을 줄인 문장이에요.","c":3},"h":"8bd4313bb2"},{"n":10,"t":"fill","q":"Before the exam, your head will be [A] with knowledge and details. But once the exam is over, it will probably feel completely [B]!","ko":"시험 전에는 머리가 지식과 세부 정보로 [A] 것이지만, 시험이 끝나면 아마도 완전히 [B] 것처럼 느껴질 것이다.","bank":["filled","empty","waiter","closed","delivered","completed"],"bko":{"filled":"가득 찬(fill의 과거분사)","empty":"텅 빈","waiter":"종업원","closed":"닫힌","delivered":"전달된","completed":"완료된"},"r":{"a":"[A] filled (가득 찬(fill의 과거분사)), [B] empty (텅 빈)","ev":"13~14번 문장","s":[[13,"Before the exam, your head will be filled with knowledge and details.","시험 전에, 당신의 머리는 지식과 세부 정보로 가득할 것이다."],[14,"But once the exam is over, it will probably feel completely empty!","그러나 시험이 끝나면, 아마도 머리가 완전히 빈 것처럼 느껴질 것이다!"]],"w":"13번 be filled with(~로 가득 차다), 14번 feel empty(텅 빈 것처럼 느끼다)를 그대로 써요. [A] 뒤의 with가 있어 filled만 들어가요.","c":null},"h":"b10ad1c3cc"}]},{"u":1,"id":"ch1-01-2","no":2,"ko":"잊을 수 없는 그 냄새","items":[{"n":1,"t":"tf","q":"Dr. Herz asked the participants to recall the pictures they saw.","ko":"헤르츠 박사는 참가자들에게 그들이 본 그림을 기억해 내도록 요청했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Later she asked them to recall the pictures they saw.","그 후에 그녀는 참가자들에게 그들이 본 그림을 기억해 내도록 요청했다."]],"w":"7번 문장에서 she asked them to recall the pictures라고 해요.","c":"T"},"h":"d61313cdbc"},{"n":2,"t":"tf","q":"Hearing and touch produced the same results as smell.","ko":"청각과 촉각은 후각과 같은 결과를 만들어 냈다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"These senses, however, did not produce the same results.","그러나 이 감각들은 같은 결과를 만들어 내지 못했다."]],"w":"10번 문장에서 청각·촉각은 같은 결과를 만들어 내지 못했다고 해요.","c":"F"},"h":"3577957e85"},{"n":3,"t":"tf","q":"Dr. Rachel Herz is a character in Proust’s novel.","ko":"레이첼 헤르츠 박사는 프루스트 소설 속의 등장인물이다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Researcher Dr. Rachel Herz showed participants some images with accompanying scents.","연구원 레이첼 헤르츠 박사는 참가자들에게 그림 몇 장을 덧붙인 향과 함께 보여 주었다."]],"w":"헤르츠 박사는 실험을 한 연구원(6번)이고, 소설의 등장인물은 마들렌 냄새로 숙모네 집을 떠올리는 사람(3번)이에요.","c":"F"},"h":"b7451113d2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...some images with accompanying scents.)","ko":"...덧붙인 향과 함께 그림 몇 장을...","opts":["방해하는","값비싼","오래된","동반하는, 덧붙인"],"word":"accompanying","r":{"a":"4) 동반하는, 덧붙인","ev":"6번 문장","s":[[6,"Researcher Dr. Rachel Herz showed participants some images with accompanying scents.","연구원 레이첼 헤르츠 박사는 참가자들에게 그림 몇 장을 덧붙인 향과 함께 보여 주었다."]],"w":"그림에 함께 따라붙은 향이라는 뜻이에요. 8번의 '향을 다시 맡을 때'와 이어져요.","c":4},"h":"1b88929b03"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The power of the Proust phenomenon has been demonstrated...)","ko":"프루스트 현상의 영향력은 ... 입증되었다.","opts":["숨겨졌다","입증되었다","거부되었다","잊혀졌다"],"word":"demonstrated","r":{"a":"2) 입증되었다","ev":"5번 문장","s":[[5,"The power of the Proust phenomenon has been demonstrated in scientific experiments.","프루스트 현상의 영향력은 과학적인 실험에서 입증되었다."]],"w":"뒤에 과학 실험이 나오고 실험으로 효과를 보여 준다는 흐름이라 demonstrate = 입증하다예요.","c":2},"h":"c7ce8601c1"},{"n":6,"t":"ref","q":"What does the underlined \"his\" refer to?\nBecause of the smell of a madeleine dipped in tea, a character suddenly remembers being at his aunt’s house as a child.","ko":"밑줄 친 his이(가) 가리키는 것은?","sko":"차에 적신 마들렌 냄새 때문에, 등장인물은 어린아이였을 때 숙모네 집에 있던 것을 갑자기 기억해 낸다.","opts":["마들렌","마르셀 프루스트","등장인물","숙모"],"r":{"a":"3) 등장인물","ev":"3번 문장","s":[[3,"Because of the smell of a madeleine dipped in tea, a character suddenly remembers being at his aunt’s house as a child.","차에 적신 마들렌 냄새 때문에, 등장인물은 어린아이였을 때 숙모네 집에 있던 것을 갑자기 기억해 낸다."]],"w":"his aunt's house에서 his는 앞의 a character(등장인물)를 가리켜요.","c":3,"k":"his = 등장인물"},"pron":"his","h":"1e1599fecf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Have you ever smelled something that took you back to a specific time or place?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신에게 특정한 시간이나 장소를 기억나게 하는 무언가를 냄새 맡아 본 적이 있는가?","opts":["냄새 때문에 특정한 시간이나 장소가 떠오른 적이 있는지 묻는 말이다.","특정한 장소로 여행을 간 적이 있는지 묻는 말이다.","냄새를 잘 맡는 사람이 되고 싶은지 묻는 말이다.","좋아하는 향수가 있는지 묻는 말이다."],"r":{"a":"1) 냄새 때문에 특정한 시간이나 장소가 떠오른 적이 있는지 묻는 말이다.","ev":"1번 문장","s":[[1,"Have you ever smelled something that took you back to a specific time or place?","당신에게 특정한 시간이나 장소를 기억나게 하는 무언가를 냄새 맡아 본 적이 있는가?"]],"w":"something that took you back to a specific time or place는 어떤 냄새가 특정한 시간이나 장소로 되돌려 놓은 적이 있는지를 물어요.","c":1},"h":"a42308de47"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["헤르츠 박사는 참가자들에게 향 없이 그림만 보여 주었다.","청각과 촉각 실험에서도 후각과 같은 결과가 나왔다.","향을 다시 맡았을 때 참가자들은 그림을 더 잘 기억했다.","프루스트 현상은 아직 실험으로 확인되지 않았다."],"opts":["Dr. Herz showed only pictures without scents.","Hearing and touch gave the same results as smell.","Participants remembered the pictures better when they smelled the scents again.","The Proust phenomenon has not been tested in experiments."],"r":{"a":"3) Participants remembered the pictures better when they smelled the scents again.","ev":"8번 문장","s":[[8,"When participants were allowed to smell the scents again, they were better able to remember the pictures than when they were given nothing to smell.","참가자들이 그 향을 다시 맡도록 허락되었을 때, 그들은 냄새 맡을 것이 아무것도 주어지지 않았을 때보다 그림들을 더 잘 기억해 낼 수 있었다."]],"w":"8번과 같은 내용이에요. 그림과 향을 함께 보여 줬고(6번), 청각·촉각은 같은 결과가 아니었으며(10번), 실험으로 입증되었어요(5번).","c":3},"h":"f3f4c2bd9b"},{"n":9,"t":"sum","q":"Dr. Herz's experiments suggest that smell is linked to the part of the (A) that controls (B).","ko":"헤르츠 박사의 실험은 후각이 (B)을(를) 통제하는 (A)의 부분과 연관되어 있음을 나타낸다.","oko":["(A) 심장 / (B) 기억","(A) 뇌 / (B) 그림","(A) 뇌 / (B) 기억","(A) 눈 / (B) 향","(A) 손 / (B) 그림"],"opts":["(A) heart / (B) memories","(A) brain / (B) pictures","(A) brain / (B) memories","(A) eyes / (B) scents","(A) hands / (B) pictures"],"r":{"a":"3) (A) brain / (B) memories ((A) 뇌 / (B) 기억)","ev":"1~1번 문장","s":[[11,"This suggests that the sense of smell must be linked to the part of the brain that controls memories.","이것은 후각이 기억을 통제하는 뇌의 부분과 분명히 연관되어 있음을 나타낸다."]],"w":"11번 the sense of smell must be linked to the part of the brain that controls memories(후각은 기억을 통제하는 뇌의 부분과 연관되어 있다)에서 뇌와 기억이 답이에요.","c":3},"h":"fb198f8bb5"},{"n":10,"t":"fill","q":"When you suddenly remember something [A] because of a scent, you are [B] the \"Proust phenomenon.\"","ko":"향기 때문에 갑자기 무언가를 [A] 기억할 때, 당신은 ‘프루스트 현상’을 [B] 있는 것이다.","bank":["clearly","experiencing","aunt","scientific","images","touch"],"bko":{"clearly":"명확하게","experiencing":"겪고(experience의 -ing형)","aunt":"숙모","scientific":"과학적인","images":"그림들","touch":"촉각"},"r":{"a":"[A] clearly (명확하게), [B] experiencing (겪고(experience의 -ing형))","ev":"4번 문장","s":[[4,"When you suddenly remember something clearly because of a scent, you are experiencing the “Proust phenomenon.”","향기 때문에 갑자기 무언가를 명확하게 기억할 때, 당신은 ‘프루스트 현상’을 겪고 있는 것이다."]],"w":"4번 remember something clearly(무언가를 명확하게 기억하다)의 clearly는 동사를 꾸미는 부사, you are experiencing은 현재진행(겪고 있는)이에요.","c":null},"h":"0ddb9e6cde"}]},{"u":1,"id":"ch1-01-3","no":3,"ko":"모두 저만 쳐다봐요!","items":[{"n":1,"t":"tf","q":"The boy is afraid that something is wrong with him.","ko":"소년은 자신에게 무슨 문제가 있을까 봐 걱정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"I’m a 13-year-old boy, and I’m afraid there’s something wrong with me.","저는 13세 남자아이인데, 제게 무슨 문제가 있는지 걱정이 돼요."]],"w":"1번 문장의 I'm afraid there's something wrong with me와 같은 내용이에요.","c":"T"},"h":"3906b9adb0"},{"n":2,"t":"tf","q":"Many people laughed when the boy fell in the school cafeteria.","ko":"소년이 학교 식당에서 넘어졌을 때 많은 사람이 웃었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Even though only a few people laughed, now I feel sick whenever I think about it.","비록 소수의 몇 명만 웃었지만, 저는 지금도 그 일을 생각할 때마다 기분이 안 좋아요."]],"w":"4번 문장에서 웃은 사람은 소수(only a few)라고 해요. 많은 사람이 웃었다는 것은 반대예요.","c":"F"},"h":"f593e0ecfe"},{"n":3,"t":"tf","q":"The feeling gradually fades away as a person gets older.","ko":"그 감정은 사람이 나이가 들면서 서서히 사라진다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Unfortunately, it isn’t something you can control; it just gradually fades away as you age.","유감스럽게도, 그건 당신이 조절할 수 있는 것이 아니에요. 나이가 들면서 그것은 서서히 사라질 뿐입니다."]],"w":"8번 문장에서 it just gradually fades away as you age라고 해요.","c":"T"},"h":"5f9b45c291"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (I constantly feel like people are staring at me...)","ko":"저는 사람들이 저를 쳐다보고 있는 것처럼 계속해서 느껴요.","opts":["드물게","계속해서","갑자기","우연히"],"word":"constantly","r":{"a":"2) 계속해서","ev":"2번 문장","s":[[2,"I constantly feel like people are staring at me, judging the way I look.","저는 사람들이 제가 어떤 모습인지 판단하며 항상 저를 쳐다보고 있는 것처럼 계속 느껴져요."]],"w":"소년은 늘 그런 느낌이 든다고 말해요. constantly = 계속해서, 끊임없이.","c":2},"h":"00b6ccaa3b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...observed by an imaginary audience.)","ko":"...가상의 청중에 의해 지켜봐지는...","opts":["진짜의","유명한","위험한","가상의"],"word":"imaginary","r":{"a":"4) 가상의","ev":"9번 문장","s":[[9,"Teenagers typically describe it as feeling like they are being observed by an imaginary audience.","십 대들이 전형적으로 그것을 가상의 청중에 의해 항상 자신이 지켜봐지는 것과 같은 느낌이라고 묘사합니다."]],"w":"실제로는 쳐다보는 사람이 많지 않은데 그런 느낌이 드는 것이므로 imaginary는 가상의, 상상 속의 뜻이에요.","c":4},"h":"3a9ffc1625"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWherever they go or whatever they do, it seems like this audience is watching their every move.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그들이 어디를 가거나 무엇을 하더라도, 이 청중이 자신의 모든 움직임을 지켜보고 있는 것 같죠.","opts":["상담자","청중","십 대들","부모"],"r":{"a":"3) 십 대들","ev":"9~10번 문장","s":[[9,"Teenagers typically describe it as feeling like they are being observed by an imaginary audience.","십 대들이 전형적으로 그것을 가상의 청중에 의해 항상 자신이 지켜봐지는 것과 같은 느낌이라고 묘사합니다."],[10,"Wherever they go or whatever they do, it seems like this audience is watching their every move.","그들이 어디를 가거나 무엇을 하더라도, 이 청중이 자신의 모든 움직임을 지켜보고 있는 것 같죠."]],"w":"어디를 가고 무엇을 하는 쪽은 지켜봐지는 느낌을 갖는 십 대들(9번)이에요. 청중(audience)은 지켜보는 쪽이에요.","c":3},"h":"6a40e803ee"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"I have some good news for you: there’s absolutely nothing wrong with you.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신께 좋은 소식이 있어요. 당신에게는 전혀 문제가 없다는 거예요.","opts":["당신에게는 전혀 문제가 없다는 좋은 소식이 있다.","당신에게 좋은 소식이 있지만 큰 문제도 하나 있다.","당신의 문제를 해결해 줄 사람을 소개해 주겠다.","당신이 걱정하는 문제는 아주 심각하다."],"r":{"a":"1) 당신에게는 전혀 문제가 없다는 좋은 소식이 있다.","ev":"6번 문장","s":[[6,"I have some good news for you: there’s absolutely nothing wrong with you.","당신께 좋은 소식이 있어요. 당신에게는 전혀 문제가 없다는 거예요."]],"w":"콜론(:) 뒤가 좋은 소식의 내용이에요. absolutely nothing wrong은 '전혀 문제 없음'이에요.","c":1},"h":"43c2623908"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["소년이 넘어진 일을 아무도 보지 못했다.","청소년 자기 중심성은 대부분의 사람이 12세에서 15세 사이에 경험한다.","청소년 자기 중심성은 스스로 쉽게 조절할 수 있다.","나이가 들수록 이 감정은 더 심해진다."],"opts":["No one saw the boy fall in the cafeteria.","Most people experience adolescent egocentrism between 12 and 15.","Adolescent egocentrism can be easily controlled.","This feeling gets worse as people get older."],"r":{"a":"2) Most people experience adolescent egocentrism between 12 and 15.","ev":"7번 문장","s":[[7,"What you have is called “adolescent egocentrism,” which is a normal stage in adolescent development that most people experience between the ages of 12 and 15.","당신이 겪고 있는 것은 ‘청소년 자기 중심성’이라고 불리는 것인데, 그것은 청소년 발달에 있어서 대부분의 사람들이 12세에서 15세 사이에 경험하는 정상적인 단계랍니다."]],"w":"7번과 같은 내용이에요. 넘어진 일은 모두가 봤다고 했고(3번), 조절할 수 없으며(8번), 나이가 들면 덜 괴롭혀요(11번).","c":2},"h":"7c6dc6bd11"},{"n":9,"t":"sum","q":"As teenagers get older, this feeling will bother them (A), so they don't need to (B).","ko":"십 대들이 나이가 들면서 이 감정은 그들을 (A) 괴롭힐 것이므로, 그들은 (B) 필요가 없다.","oko":["(A) 점점 더 / (B) 걱정할","(A) 점점 덜 / (B) 서두를","(A) 점점 더 / (B) 웃을","(A) 점점 덜 / (B) 걱정할","(A) 결코 / (B) 서두를"],"opts":["(A) more and more / (B) worry","(A) less and less / (B) hurry","(A) more and more / (B) laugh","(A) less and less / (B) worry","(A) never / (B) hurry"],"r":{"a":"4) (A) less and less / (B) worry ((A) 점점 덜 / (B) 걱정할)","ev":"1~1번 문장","s":[[11,"You’re not the only one who feels this way, and as you get older, this feeling will bother you less and less, so don’t worry!","이처럼 느끼는 게 당신뿐만이 아니며, 그리고 나이가 들면서 이 감정은 당신을 점점 덜 괴롭힐 거예요, 그러니 걱정하지 마세요!"]],"w":"11번 this feeling will bother you less and less, so don't worry!(이 감정은 점점 덜 괴롭힐 거예요, 그러니 걱정하지 마세요!)에서 less and less와 worry가 답이에요.","c":4},"h":"529295ae29"},{"n":10,"t":"fill","q":"Every day, I find myself changing outfits [A] before I go out, and last week I [B] and fell in the school cafeteria, which everyone saw!","ko":"매일 외출하기 전에 저는 자꾸만 옷을 [A] 바꿔 입고, 지난주에는 [B] 학교 식당에서 넘어졌는데, 그것을 모두가 봤다!","bank":["repeatedly","tripped","cafeteria","normal","stage","describe"],"bko":{"repeatedly":"반복해서","tripped":"발을 헛디뎌(trip의 과거)","cafeteria":"식당","normal":"정상적인","stage":"단계","describe":"묘사하다"},"r":{"a":"[A] repeatedly (반복해서), [B] tripped (발을 헛디뎌(trip의 과거))","ev":"3번 문장","s":[[3,"Every day, I find myself changing outfits repeatedly before I go out, and last week I tripped and fell in the school cafeteria, which everyone saw!","매일 외출하기 전에, 저는 자꾸만 옷을 바꿔 입어요. 그리고 지난주에는 학교 식당에서 발을 .”)","ko":"이 현상은 ‘변화맹’이라고 알려져 있다.","opts":["실수","현상","습관","규칙"],"word":"phenomenon","r":{"a":"2) 현상","ev":"9번 문장","s":[[9,"This phenomenon is known as “change blindness.”","이 현상은 ‘변화맹’이라고 알려져 있다."]],"w":"8번에서 일어난 일(상대가 바뀐 것을 못 알아챔)에 이름을 붙이는 문장이에요. phenomenon = 현상.","c":2},"h":"8f397788a2"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nAnd here’s the amazing part—the woman didn’t even notice that the person she was talking to had changed!","ko":"밑줄 친 she가 가리키는 것은?","sko":"그리고 놀라운 점은, 여성이 자신이 대화하고 있던 사람이 바뀌었다는 것을 알아채지 못했다는 것이다!","opts":["여성","낯선 사람","과학자","다른 남성"],"r":{"a":"1) 여성","ev":"8번 문장","s":[[8,"And here’s the amazing part—the woman didn’t even notice that the person she was talking to had changed!","그리고 놀라운 점은, 여성이 자신이 대화하고 있던 사람이 바뀌었다는 것을 알아채지 못했다는 것이다!"]],"w":"the woman didn't even notice that the person she was talking to...에서 she는 주어인 the woman이에요.","c":1,"k":"she = 여성"},"pron":"she","h":"ddba9db0fb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In certain situations, people don’t notice changes, however large they are.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"특정 상황에서, 사람들은 변화가 아무리 크다고 하더라도 그것을 알아채지 못한다.","opts":["특정 상황에서는 변화가 아무리 커도 사람들이 알아채지 못할 수 있다.","큰 변화는 어떤 상황에서도 사람들이 반드시 알아챈다.","변화가 클수록 사람들은 더 쉽게 알아챈다.","사람들은 작은 변화만 알아채지 못한다."],"r":{"a":"1) 특정 상황에서는 변화가 아무리 커도 사람들이 알아채지 못할 수 있다.","ev":"10번 문장","s":[[10,"In certain situations, people don’t notice changes, however large they are.","특정 상황에서, 사람들은 변화가 아무리 크다고 하더라도 그것을 알아채지 못한다."]],"w":"however large they are는 '아무리 크더라도'예요. 그래서 큰 변화도 못 알아챌 수 있다는 뜻이에요.","c":1},"h":"51c78524eb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["나무를 운반하는 두 남성이 여성과 낯선 사람 사이를 지나갔다.","여성은 낯선 사람에게 커다란 나무 토막을 주었다.","여성은 중단된 동안에 걸어가 버렸다.","뇌는 감지한 모든 정보를 쉽게 처리할 수 있다."],"opts":["Two men carrying wood walked between the woman and the stranger.","The woman gave the stranger a large piece of wood.","The woman walked away during the interruption.","The brain can easily process all the information it detects."],"r":{"a":"1) Two men carrying wood walked between the woman and the stranger. (나무를 운반하는 두 남성이 여성과 낯선 사람 사이를 지나갔다.)","ev":"3번 문장","s":[[3,"Suddenly, two men carrying a large piece of wood walk between them.","갑자기, 커다란 나무 토막을 운반하는 두 남성이 그들 사이를 지나간다."]],"w":"3번 two men carrying a large piece of wood walk between them(나무를 운반하는 두 남성이 그들 사이를 지나간다)과 같아요. 가 버린 사람은 여성이 아니라 낯선 사람이에요.","c":1},"h":"d52208c26a"},{"n":9,"t":"sum","q":"The brain must (A) what to focus on, and as a result a lot of information gets (B) by.","ko":"뇌는 무엇에 집중할지 (A) 하고, 그 결과 많은 정보가 (B) 지나간다.","oko":["(A) 잊어야 / (B) 스쳐","(A) 선택해야 / (B) 보내져","(A) 선택해야 / (B) 스쳐","(A) 무시해야 / (B) 주어져","(A) 잊어야 / (B) 보관되어"],"opts":["(A) forget / (B) passed","(A) choose / (B) sent","(A) choose / (B) passed","(A) ignore / (B) given","(A) forget / (B) kept"],"r":{"a":"3) (A) choose / (B) passed ((A) 선택해야 / (B) 스쳐)","ev":"12~13번 문장","s":[[12,"Therefore, it must choose what to focus on.","따라서, 그것은 무엇에 집중할지 선택해야만 한다."],[13,"As a result, a lot of information gets passed by.","결과적으로, 많은 정보가 스쳐 지나간다."]],"w":"12번 it must choose what to focus on(무엇에 집중할지 선택해야 한다), 13번 a lot of information gets passed by(많은 정보가 스쳐 지나간다)를 줄인 문장이에요.","c":3},"h":"c02d25dd30"},{"n":10,"t":"fill","q":"Well, the two men were [A] a scientific [B].","ko":"자, 두 남자는 과학 [B]을(를) [A] 있었다.","bank":["conducting","experiment","stranger","wood","blindness","woman"],"bko":{"conducting":"수행하고(conduct의 -ing형)","experiment":"실험","stranger":"낯선 사람","wood":"나무","blindness":"맹목, 보지 못함","woman":"여성"},"r":{"a":"[A] conducting (수행하고(conduct의 -ing형)), [B] experiment (실험)","ev":"7번 문장","s":[[7,"Well, the two men were conducting a scientific experiment.","자, 두 남자는 과학 실험을 하는 중이었다."]],"w":"7번 were conducting a scientific experiment(과학 실험을 하는 중이었다)는 과거진행형(were + -ing)이고 conduct a scientific experiment는 '과학 실험을 수행하다'예요.","c":null},"h":"1ab1915f72"}]},{"u":2,"id":"ch1-02-1","no":1,"ko":"에취, 재채기가 또!","items":[{"n":1,"t":"tf","q":"A man needed medical treatment after he tried to stop a sneeze.","ko":"한 남자는 재채기를 멈추려고 한 뒤에 의학 치료가 필요했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"Recently, a man seriously injured his throat while trying to stop a sneeze.","최근에, 한 남자가 재채기를 멈추려고 애쓰다가 목을 심각하게 다쳤다."],[5,"His neck became so swollen that he could barely speak, and it was so painful that he required medical treatment.","그의 목은 너무 부어서 그는 거의 말할 수 없었고, 너무 고통스러워서 의학 치료가 필요했다."]],"w":"4번에서 재채기를 멈추려다 목을 다쳤고, 5번에서 너무 고통스러워서 의학 치료가 필요했다고 해요.","c":"T"},"h":"197d052d0a"},{"n":2,"t":"tf","q":"The man who held in his sneeze recovered quickly.","ko":"재채기를 참은 남자는 빠르게 회복했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Something as simple as holding his sneeze led to a long recovery.","재채기를 참는 것처럼 단순한 것이 오랜 회복 기간으로 이어졌다."]],"w":"6번에서 재채기를 참는 단순한 행동이 오랜 회복 기간으로 이어졌다고 해요. 빠르게 회복했다는 것은 반대예요.","c":"F"},"h":"bd35135805"},{"n":3,"t":"tf","q":"During a sneeze, your chest muscles contract and your throat relaxes.","ko":"재채기하는 동안 가슴 근육은 수축하고 목(근육)은 이완된다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Subsequently, your chest muscles contract forcefully, and your throat relaxes rapidly.","그 뒤에, 당신의 가슴 근육이 강하게 수축하고, 목(근육)이 빠르게 이완된다."]],"w":"10번에서 가슴 근육이 강하게 수축하고 목이 빠르게 이완된다고 해요.","c":"T"},"h":"4cac3c7949"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...so you attempt to hold it in.)","ko":"...그래서 당신은 그것을 참으려고 한다.","opts":["거부하다","시도하다","도착하다","인정하다"],"word":"attempt","r":{"a":"2) 시도하다","ev":"2번 문장","s":[[2,"Perhaps you are studying in the library or watching a serious movie in the theater when you suddenly need to sneeze, but you want to avoid disturbing other people, so you attempt to hold it in.","갑자기 재채기해야 할 때, 당신은 도서관에서 공부하거나 극장에서 진지한 영화를 보고 있을지도 모른다. 그러나 당신은 다른 사람들을 방해하고 싶지 않아서, 당신은 그것을 참으려고 한다."]],"w":"남을 방해하고 싶지 않아서 재채기를 참으려고 해 본다는 흐름이에요. attempt = 시도하다.","c":2},"h":"f98786707d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...air is forced out through your nose and mouth, expelling any potential viruses...)","ko":"...공기가 코와 입을 통해 밖으로 빠져나가면서 잠재적인 바이러스를 배출한다.","opts":["퍼뜨리다","삼키다","배출하다","만들다"],"word":"expelling","r":{"a":"3) 배출하다","ev":"11번 문장","s":[[11,"As a result, air is forced out through your nose and mouth, expelling any potential viruses or harmful particles along with it.","그 결과, 잠재적인 바이러스나 해로운 입자들을 배출하면서 공기가 코와 입을 통해 밖으로 빠져나간다."]],"w":"공기가 밖으로 빠져나가면서 바이러스를 내보낸다는 흐름이에요. expel = 배출하다. 퍼뜨리거나 삼킨다는 말은 문맥에 맞지 않아요.","c":3},"h":"5c7b0a1d48"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nIf foreign material enters your nose, a message is sent to your brain, which signals your eyes, mouth, and throat to close.","ko":"밑줄 친 which가 가리키는 것은?","sko":"이물질이 코에 들어오면, 뇌에 메시지가 전달되고, 당신의 뇌는 눈과 입과 목을 닫도록 신호를 보낸다.","opts":["이물질","뇌","메시지","코"],"r":{"a":"2) 뇌","ev":"9번 문장","s":[[9,"If foreign material enters your nose, a message is sent to your brain, which signals your eyes, mouth, and throat to close.","이물질이 코에 들어오면, 뇌에 메시지가 전달되고, 당신의 뇌는 눈과 입과 목을 닫도록 신호를 보낸다."]],"w":"which는 쉼표 바로 앞의 your brain을 덧붙여 설명해요. 눈과 입과 목을 닫도록 신호를 보내는 것은 뇌예요.","c":2},"h":"bf347b5bff"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"And there’s another reason why you shouldn’t hold in a sneeze.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그리고 당신이 재채기를 참지 말아야 하는 또 다른 이유가 있다.","opts":["재채기를 참아야 하는 또 다른 이유가 있다.","재채기를 참지 말아야 하는 유일한 이유가 있다.","재채기를 하면 안 되는 또 다른 장소가 있다.","재채기를 참지 말아야 하는 또 다른 이유가 있다."],"r":{"a":"4) 재채기를 참지 말아야 하는 또 다른 이유가 있다.","ev":"7번 문장","s":[[7,"And there’s another reason why you shouldn’t hold in a sneeze.","그리고 당신이 재채기를 참지 말아야 하는 또 다른 이유가 있다."]],"w":"shouldn’t hold in은 '참지 말아야 한다'이고 another는 '또 다른'이에요. 앞의 3~6번에서 한 가지 이유(위험)를 이미 말했기 때문에 이것은 두 번째 이유예요.","c":4},"h":"b7ff92ab1e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["눈과 입과 목은 이물질이 코에 들어오면 열린다.","의사들은 재채기를 참는 것이 다른 사람을 보호하는 가장 좋은 방법이라고 말한다.","재채기하는 것이 적절하지 않게 느껴지는 장소들이 있다.","남자는 재채기를 너무 크게 해서 목을 다쳤다."],"opts":["Your eyes, mouth, and throat open when foreign material enters your nose.","Doctors say holding in a sneeze is the best way to protect other people.","There are places where sneezing may not feel appropriate.","The man hurt his throat because he sneezed too loudly."],"r":{"a":"3) There are places where sneezing may not feel appropriate. (재채기하는 것이 적절하지 않게 느껴지는 장소들이 있다.)","ev":"1번 문장","s":[[1,"There are certain places where sneezing may not feel appropriate.","재채기하는 것이 적절하지 않게 느껴지는 특정 장소들이 있다."]],"w":"1번 There are certain places where sneezing may not feel appropriate(재채기하는 것이 적절하지 않게 느껴지는 특정 장소들이 있다)와 같아요. 눈과 입과 목은 열리는 것이 아니라 닫히고, 남자는 재채기를 멈추려다 목을 다쳤어요.","c":3},"h":"309f1a14f7"},{"n":9,"t":"sum","q":"Holding in a sneeze can have a (A) effect on your health, and sneezing is a way for your body to (B) viruses.","ko":"재채기를 참는 것은 건강에 (A) 영향을 줄 수 있고, 재채기는 몸이 바이러스를 (B) 방법이다.","oko":["(A) 안전한 / (B) 불러들이는","(A) 안전한 / (B) 내보내는","(A) 위험한 / (B) 불러들이는","(A) 위험한 / (B) 내보내는","(A) 위험한 / (B) 무시하는"],"opts":["(A) safe / (B) invite","(A) safe / (B) remove","(A) dangerous / (B) invite","(A) dangerous / (B) remove","(A) dangerous / (B) ignore"],"r":{"a":"4) (A) dangerous / (B) remove ((A) 위험한 / (B) 내보내는)","ev":"3번, 8번, 11번 문장","s":[[3,"Unfortunately, doctors warn that this might be dangerous.","안타깝게도, 의사들은 이것이 위험할 수 있다고 경고한다."],[8,"It is part of a process that prevents viruses from entering your body.","그것은 바이러스가 몸 안으로 들어가는 것을 막는 과정의 일부이다."],[11,"As a result, air is forced out through your nose and mouth, expelling any potential viruses or harmful particles along with it.","그 결과, 잠재적인 바이러스나 해로운 입자들을 배출하면서 공기가 코와 입을 통해 밖으로 빠져나간다."]],"w":"3번 doctors warn that this might be dangerous(의사들은 이것이 위험할 수 있다고 경고한다), 8번과 11번에서 재채기는 바이러스를 밖으로 내보내는 과정이에요.","c":4},"h":"53edb66269"},{"n":10,"t":"fill","q":"Just remember to [A] your mouth to prevent [B] viruses to other people!","ko":"단지 다른 사람들에게 바이러스를 [B] 것을 막기 위해 입을 [A] 것을 기억해라!","bank":["cover","spreading","disturb","enter","recover","swollen"],"bko":{"cover":"가리다","spreading":"퍼뜨리는 것(spread의 -ing형)","disturb":"방해하다","enter":"들어가다","recover":"회복하다","swollen":"부어오른"},"r":{"a":"[A] cover (가리다), [B] spreading (퍼뜨리는 것(spread의 -ing형))","ev":"1~3번 문장","s":[[13,"Just remember to cover your mouth to prevent spreading viruses to other people!","단지 다른 사람들에게 바이러스를 퍼뜨리는 것을 막기 위해 입을 가리는 것을 기억해라."]],"w":"13번 remember to cover your mouth(입을 가리는 것을 기억해라)는 to + 동사원형이고, prevent spreading(퍼뜨리는 것을 막다)은 prevent 뒤에 -ing를 써요.","c":null},"h":"28ed549b59"}]},{"u":2,"id":"ch1-02-2","no":2,"ko":"띵! 머리를 울리는 시원함","items":[{"n":1,"t":"tf","q":"Brain freeze can affect areas behind the eyes or nose.","ko":"브레인 프리즈는 눈이나 코 뒤쪽 부위에 영향을 미칠 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Cold neuralgia, better known as brain freeze, can affect the temples, forehead, or areas behind the eyes or nose.","한랭 신경통은, 브레인 프리즈(뇌동결)로 더 알려졌는데, 관자놀이, 이마, 또는 눈이나 코 뒤쪽 부위에 영향을 미칠 수 있다."]],"w":"4번에서 관자놀이, 이마, 또는 눈이나 코 뒤쪽 부위에 영향을 미칠 수 있다고 해요.","c":"T"},"h":"9253542c0d"},{"n":2,"t":"tf","q":"Drinking cold water helps ease brain freeze.","ko":"차가운 물을 마시는 것이 브레인 프리즈를 덜어 준다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"Drinking warm water helps too.","따뜻한 물을 마시는 것도 도움이 된다."]],"w":"13번에서 도움이 되는 것은 차가운 물이 아니라 따뜻한 물이에요.","c":"F"},"h":"09da4b2898"},{"n":3,"t":"tf","q":"The brain sends pain signals to the blood vessels in your mouth.","ko":"뇌는 입속 혈관으로 통증 신호를 보낸다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The brain is then sent pain signals from a nerve extending throughout your face.","그런 다음 뇌는 얼굴 전체로 확장해 있는 신경으로부터 통증 신호를 받는다."]],"w":"9번에서 뇌가 얼굴 전체로 뻗은 신경으로부터 통증 신호를 받는다고 해요. 신호를 보내는 쪽과 받는 쪽이 뒤바뀌었어요.","c":"F"},"h":"5e21b37701"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It’s such a cooling refreshment until a headache hits you.)","ko":"그것은 두통이 오기 전까지는 정말 시원한 것이다.","opts":["경쟁","후회","상쾌하게 함","질병"],"word":"refreshment","r":{"a":"3) 상쾌하게 함","ev":"3번 문장","s":[[3,"It’s such a cooling refreshment until a headache hits you.","그것은 두통이 오기 전까지는 정말 시원한 원기 회복이 될 것이다."]],"w":"아이스크림이 두통이 오기 전까지는 시원하고 좋다는 흐름이에요. refreshment = 원기 회복, 상쾌하게 함.","c":3},"h":"447f7d1128"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...there is one that seems to logically explain brain freeze.)","ko":"...브레인 프리즈를 논리적으로 설명하는 걸로 보이는 이론이 하나 있다.","opts":["우연히","논리적으로","감정적으로","갑자기"],"word":"logically","r":{"a":"2) 논리적으로","ev":"6번 문장","s":[[6,"Among debated theories, there is one that seems to logically explain brain freeze.","논쟁이 되는 이론 중, 브레인 프리즈를 논리적으로 설명하는 걸로 보이는 이론이 있다."]],"w":"이론이 브레인 프리즈를 앞뒤가 맞게 설명해 준다는 흐름이에요. logically = 논리적으로.","c":2},"h":"2f056e9417"},{"n":6,"t":"ref","q":"What does the underlined \"there\" refer to?\nAs your mouth undergoes a drop in temperature, the blood vessels there reflexively constrict to stabilize your core temperature.","ko":"밑줄 친 there가 가리키는 것은?","sko":"당신의 입속 온도가 떨어지면, 그곳의 혈관은 당신의 심부 체온을 안정시키기 위해 반사적으로 수축한다.","opts":["머리","코","얼굴","입속"],"r":{"a":"4) 입속","ev":"7번 문장","s":[[7,"As your mouth undergoes a drop in temperature, the blood vessels there reflexively constrict to stabilize your core temperature.","당신의 입속 온도가 떨어지면, 그곳의 혈관은 당신의 심부 체온을 안정시키기 위해 반사적으로 수축한다."]],"w":"there는 앞 절에서 온도가 떨어진다고 한 your mouth(입)를 가리켜요. '입속의 혈관'이라는 뜻이에요.","c":4},"h":"4a89037736"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"On a burning hot day, nothing beats the relief of something icy cold.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"타는 듯한 더운 날, 얼음처럼 차가운 것의 안도감을 능가하는 것은 없다.","opts":["더운 날에는 차가운 것이 아무 도움이 되지 않는다.","더운 날에는 차가운 것보다 더 큰 안도감을 주는 것이 없다.","더운 날에는 차가운 것을 때릴 수 있는 사람이 없다.","더운 날에는 아이스크림이 얼음보다 더 시원하다."],"r":{"a":"2) 더운 날에는 차가운 것보다 더 큰 안도감을 주는 것이 없다.","ev":"1번 문장","s":[[1,"On a burning hot day, nothing beats the relief of something icy cold.","타는 듯한 더운 날, 얼음처럼 차가운 것의 안도감을 능가하는 것은 없다."]],"w":"nothing beats는 '~을 능가하는 것이 없다'예요. 그래서 차가운 것이 가장 큰 안도감을 준다는 뜻이에요. beat를 '때리다'로 읽으면 틀려요.","c":2},"h":"f0dcc0f83f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["브레인 프리즈는 몇 시간 동안 지속될 수 있다.","브레인 프리즈의 통증은 입에서만 느껴진다.","혀로 입천장을 누르는 것은 브레인 프리즈에 대처하는 한 가지 방법이다.","입속 혈관은 먼저 확장되고 그다음에 수축한다."],"opts":["Brain freeze can last for several hours.","The pain of brain freeze is felt only in the mouth.","Pressing your tongue against the roof of your mouth is one way to deal with brain freeze.","The blood vessels in your mouth expand first and then constrict."],"r":{"a":"3) Pressing your tongue against the roof of your mouth is one way to deal with brain freeze.","ev":"12번 문장","s":[[12,"Once the cold food is removed from your mouth, press your tongue against the roof of your mouth.","차가운 음식이 당신의 입에서 없어지면, 입천장에 혀를 대고 눌러라."]],"w":"12번에서 차가운 음식이 입에서 없어지면 혀로 입천장을 누르라고 해요. 통증은 몇 분만 지속되고(5번), 통증은 원인이 있는 입이 아니라 머리 위쪽에서 느껴지며(10번), 혈관은 먼저 수축하고 나서 확장돼요(7~8번).","c":3},"h":"39c78708e0"},{"n":9,"t":"sum","q":"Brain freeze is a (A) pain that lasts only a few minutes, and it is felt in a place different from where its (B) occurs.","ko":"브레인 프리즈는 몇 분밖에 지속되지 않는 (A) 통증이며, 그 (B)이 생기는 곳과 다른 곳에서 느껴진다.","oko":["(A) 긴 / (B) 원인","(A) 긴 / (B) 결과","(A) 짧은 / (B) 결과","(A) 짧은 / (B) 원인","(A) 짧은 / (B) 치료"],"opts":["(A) long / (B) cause","(A) long / (B) result","(A) short / (B) result","(A) short / (B) cause","(A) short / (B) cure"],"r":{"a":"4) (A) short / (B) cause","ev":"5번, 10번 문장","s":[[5,"Despite lasting only a few minutes, the sudden pain can stop you in your tracks, and that spoonful of ice cream now seems like a regrettable decision.","몇 분 밖에 지속되지 않지만, 그 갑작스러운 통증은 당신을 멈출 수 있고, 그 아이스크림 한 숟가락은 이제 후회되는 결정처럼 보인다."],[10,"As a result, you feel referred pain—when the cause of pain occurs in one place, in this case, your mouth, but is felt somewhere else, higher up in the head.","결과적으로, 통증의 원인이 한 곳에서 발생하면, 이 경우에는 입이며, (통증은) 머리 위쪽의 다른 곳에서 느껴지는 연관통을 느낀다."]],"w":"5번에서 통증이 몇 분밖에 지속되지 않는다고 하니 short이고, 10번에서 통증의 원인이 한 곳(입)에서 생기지만 다른 곳(머리 위쪽)에서 느껴진다고 하니 cause예요. long은 5번과 반대이고, result와 cure는 10번에 없어요.","c":4},"h":"f851ce0e39"},{"n":10,"t":"fill","q":"Expanding [A] afterward, the blood vessels allow the blood to [B] back in.","ko":"이후 [A] 확장되고, 혈관은 혈액이 다시 [B] 들어오도록 한다.","bank":["immediately","rush","temperature","regrettable","forehead","referred"],"bko":{"immediately":"즉시","rush":"급히 움직이다","temperature":"온도","regrettable":"후회되는","forehead":"이마","referred":"연관된(refer의 과거분사)"},"r":{"a":"[A] immediately (즉시), [B] rush (급히 움직이다)","ev":"8번 문장","s":[[8,"Expanding immediately afterward, the blood vessels allow the blood to rush back in.","이후 즉시 확장되고, 혈관은 혈액이 다시 급히 돌아오도록 한다."]],"w":"8번 Expanding immediately afterward(이후 즉시 확장되고)의 immediately는 시간을 나타내는 부사이고, allow the blood to rush back in(혈액이 다시 급히 돌아오도록 한다)의 to 뒤에는 동사원형 rush가 와요.","c":null},"h":"56ec6f2bf5"}]},{"u":2,"id":"ch1-02-3","no":3,"ko":"개에게 초콜릿은 독약","items":[{"n":1,"t":"tf","q":"Theobromine poisoning can be treated by making the dog vomit.","ko":"테오브로민 중독은 개를 토하게 함으로써 치료될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Theobromine poisoning can be treated by getting the dog to vomit.","테오브로민 중독은 개를 토하게 함으로써 치료될 수 있다."]],"w":"10번에서 개를 토하게 하면 테오브로민 중독을 치료할 수 있다고 해요.","c":"T"},"h":"940bc45b20"},{"n":2,"t":"tf","q":"Milk chocolate and white chocolate are higher in theobromine than dark chocolate.","ko":"밀크 초콜릿과 화이트 초콜릿은 다크 초콜릿보다 테오브로민 수치가 높다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Cocoa, cooking chocolate, and dark chocolate are all high in theobromine, but milk chocolate and white chocolate are not.","코코아, 요리용 초콜릿, 그리고 다크 초콜릿은 모두 테오브로민 수치가 높지만, 밀크 초콜릿과 화이트 초콜릿은 그렇지 않다."]],"w":"6번에서 다크 초콜릿은 수치가 높고, 밀크 초콜릿과 화이트 초콜릿은 높지 않다고 해요. 높고 낮음이 뒤바뀌었어요.","c":"F"},"h":"3ed30e455c"},{"n":3,"t":"tf","q":"A small amount of chocolate may upset a dog’s stomach.","ko":"적은 양의 초콜릿은 개의 배탈을 일으킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"A small amount of chocolate may give your dog an upset stomach and cause vomiting.","적은 양의 초콜릿은 개에게 배탈을 일으키고 구토를 유발할 수 있다."]],"w":"7번에서 적은 양의 초콜릿도 개에게 배탈과 구토를 일으킬 수 있다고 해요.","c":"T"},"h":"cc8a95229e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...which is similar to caffeine and is toxic to dogs.)","ko":"...카페인과 비슷하고 개에게 유독하다.","opts":["유독한","유익한","무료의","빠른"],"word":"toxic","r":{"a":"1) 유독한","ev":"3번 문장","s":[[3,"Chocolate contains a chemical called theobromine, which is similar to caffeine and is toxic to dogs.","초콜릿은 테오브로민이라고 불리는 화학물질을 함유하고 있는데, 이것은 카페인과 비슷하고 개에게 유해하다."]],"w":"테오브로민이 개에게 독이 될 수 있다는 글이에요. toxic = 유독한. 4번에서 해롭게 된다고 하는 것과도 이어져요.","c":1},"h":"b02a3ada70"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...so it can accumulate in the body and become harmful.)","ko":"...그래서 그것이 체내에 쌓이면 해롭게 될 수 있다.","opts":["사라지다","움직이다","쌓이다","가라앉다"],"word":"accumulate","r":{"a":"3) 쌓이다","ev":"4번 문장","s":[[4,"Unlike humans, dogs cannot digest theobromine effectively, so it can accumulate in the body and become harmful.","사람과 달리, 개는 테오브로민을 효과적으로 소화시킬 수 없으므로, 그것이 체내에 쌓이면 해롭게 될 수 있다."]],"w":"개는 소화시키지 못해서 몸에 남아 해로워진다는 흐름이에요. accumulate = 쌓이다.","c":3},"h":"2667690e8e"},{"n":6,"t":"ref","q":"What does the underlined \"These\" refer to?\nThese include shaking, internal bleeding, and, in extreme cases, even heart attacks.","ko":"밑줄 친 These가 가리키는 것은?","sko":"여기에는 몸을 떠는 것, 내출혈, 그리고 극단적인 경우에는 심장마비까지 포함된다.","opts":["더 많은 양","더 심각한 결과","두 가지 초콜릿","테오브로민 수치"],"r":{"a":"2) 더 심각한 결과","ev":"8~9번 문장","s":[[8,"Larger amounts can have more serious effects.","더 많은 양은 더 심각한 결과를 낳는다."],[9,"These include shaking, internal bleeding, and, in extreme cases, even heart attacks.","여기에는 몸을 떠는 것, 내출혈, 그리고 극단적인 경우에는 심장마비까지 포함된다."]],"w":"떨림, 내출혈, 심장마비는 양이 아니라 결과예요. 바로 앞 8번의 more serious effects(더 심각한 결과)를 가리켜요.","c":2},"h":"143aa58590"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So if your dog has eaten too much chocolate, take it to the vet right away.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러니 당신의 개가 너무 많은 초콜릿을 먹었다면 곧바로 수의사에게 데려가라.","opts":["개가 초콜릿을 먹기 전에 수의사에게 데려가야 한다.","개가 초콜릿을 먹었다면 수의사에게 전화만 하면 된다.","개가 초콜릿을 먹었다면 며칠 지켜본 뒤 수의사에게 데려가야 한다.","개가 초콜릿을 너무 많이 먹었다면 곧바로 수의사에게 데려가야 한다."],"r":{"a":"4) 개가 초콜릿을 너무 많이 먹었다면 곧바로 수의사에게 데려가야 한다.","ev":"11번 문장","s":[[11,"So if your dog has eaten too much chocolate, take it to the vet right away.","그러니 당신의 개가 너무 많은 초콜릿을 먹었다면 곧바로 수의사에게 데려가라."]],"w":"has eaten too much chocolate는 '초콜릿을 너무 많이 먹었다'이고 right away는 '곧바로'예요. 그래서 바로 수의사에게 데려가라는 뜻이에요.","c":4},"h":"77ac8bb479"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["개는 사람보다 테오브로민을 더 잘 소화시킨다.","초콜릿이 개에게 얼마나 위험한지는 초콜릿의 종류와 먹은 양에 달려 있다.","화이트 초콜릿이 개에게 가장 위험한 종류이다.","어떤 양의 초콜릿이든 개에게 완전히 안전하다."],"opts":["Dogs digest theobromine better than humans do.","The danger of chocolate to dogs depends on the type and the amount eaten.","White chocolate is the most dangerous kind for dogs.","Any amount of chocolate is completely safe for dogs."],"r":{"a":"2) The danger of chocolate to dogs depends on the type and the amount eaten. (초콜릿이 개에게 얼마나 위험한지는 초콜릿의 종류와 먹은 양에 달려 있다.)","ev":"2번 문장","s":[[2,"How serious the danger is depends on the type of chocolate and the amount eaten.","그 위험이 얼마나 심각한지는 초콜릿의 종류와 먹은 양에 달려 있다."]],"w":"2번 How serious the danger is depends on the type of chocolate and the amount eaten(그 위험이 얼마나 심각한지는 초콜릿의 종류와 먹은 양에 달려 있다)과 같아요. 개는 테오브로민을 효과적으로 소화시키지 못하고, 화이트 초콜릿은 테오브로민이 높지 않아요.","c":2},"h":"785e24c10f"},{"n":9,"t":"sum","q":"You should not (A) chocolate to your dog, because it may poison your (B).","ko":"당신은 개에게 초콜릿을 (A) 안 되는데, 그것이 당신의 (B)을(를) 독살할지도 모르기 때문이다.","oko":["(A) 팔아서는 / (B) 반려동물","(A) 먹여서는 / (B) 주인","(A) 먹여서는 / (B) 반려동물","(A) 숨겨서는 / (B) 친구","(A) 팔아서는 / (B) 의사"],"opts":["(A) sell / (B) pet","(A) feed / (B) owner","(A) feed / (B) pet","(A) hide / (B) friend","(A) sell / (B) doctor"],"r":{"a":"3) (A) feed / (B) pet ((A) 먹여서는 / (B) 반려동물)","ev":"1번 문장","s":[[1,"You may love chocolate, but don’t feed it to your dog—you may poison your pet!","당신은 초콜릿을 무척 좋아할지도 모르지만, 당신의 개에게 그것을 먹이지는 마라. 당신은 당신의 반려동물을 독살할지도 모른다!"]],"w":"1번 don't feed it to your dog—you may poison your pet!(개에게 먹이지 마라, 반려동물을 독살할지도 모른다!)을 줄인 문장이에요.","c":3},"h":"c014d718ec"},{"n":10,"t":"fill","q":"Theobromine [A] [B] depending on the type of chocolate.","ko":"테오브로민 [A]은(는) 초콜릿의 종류에 따라 [B].","bank":["levels","differ","chemical","stomach","harmful","extreme"],"bko":{"levels":"수치(level의 복수형)","differ":"다르다","chemical":"화학물질","stomach":"위","harmful":"해로운","extreme":"극단적인"},"r":{"a":"[A] levels (수치(level의 복수형)), [B] differ (다르다)","ev":"5번 문장","s":[[5,"Theobromine levels differ depending on the type of chocolate.","테오브로민 수치는 초콜릿의 종류에 따라 달라진다."]],"w":"5번 Theobromine levels differ(테오브로민 수치가 다르다)에서 levels는 명사 level의 복수형이고, 주어 levels가 복수라 동사 differ에 -s가 붙지 않아요.","c":null},"h":"3f903cc739"}]},{"u":2,"id":"ch1-02-4","no":4,"ko":"수능:ON 요지 · 주장","items":[{"n":1,"t":"tf","q":"The writer asks you to think of a buffet table at a party or at a hotel.","ko":"글쓴이는 파티나 호텔의 뷔페 테이블을 생각해 보라고 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Think of a buffet table at a party, or perhaps at a hotel you’ve visited.","파티나, 아마도 여러분이 방문해 보았던 호텔의 뷔페 테이블을 생각해 보라."]],"w":"1번 문장이 Think of a buffet table at a party, or perhaps at a hotel로 시작해요.","c":"T"},"h":"809ab77ff0"},{"n":2,"t":"tf","q":"You often eat many of the buffet foods at home.","ko":"당신은 뷔페 음식들 중 많은 것을 집에서 자주 먹는다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"You don’t eat many of these foods at home, and you want to try them all.","여러분은 이러한 음식 중 많은 것을 집에서는 먹지 않기에 그것들을 모두 먹어 보기를 원한다."]],"w":"3번에서 이런 음식 중 많은 것을 집에서는 먹지 않는다고 해요. 그래서 모두 먹어 보고 싶어지는 거예요.","c":"F"},"h":"b5b6a50da0"},{"n":3,"t":"tf","q":"Trying every food at a buffet may make you eat more than your usual meal size.","ko":"뷔페의 모든 음식을 먹어 보면 평소 식사량보다 더 많이 먹게 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"But trying them all might mean eating more than your usual meal size.","그러나 그것들을 모두 먹어 보는 것은 여러분의 평상시 식사량보다 많이 먹는 것을 의미할 수 있다."]],"w":"4번에서 그것들을 모두 먹어 보는 것은 평소 식사량보다 많이 먹는 것을 의미할 수 있다고 해요.","c":"T"},"h":"9e1cf1c2bd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The availability of different types of food is one factor in gaining weight.)","ko":"다양한 종류의 음식을 맛볼 수 있다는 것은 체중이 느는 한 가지 요인이다.","opts":["선택","이용 가능성","경쟁","안전"],"word":"availability","r":{"a":"2) 이용 가능성","ev":"5번 문장","s":[[5,"The availability of different types of food is one factor in gaining weight.","다양한 종류의 음식을 맛볼 수 있다는 것은 체중이 느는 한 가지 요인이다."]],"w":"다양한 음식을 먹을 수 있다는 것이 체중이 느는 요인이라는 흐름이에요. availability = 이용 가능성(먹을 수 있다는 것).","c":2},"h":"3cc3e01ab5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You see platter after platter of different foods.)","ko":"여러분은 다양한 음식이 담긴 계속 이어지는 접시들을 본다.","opts":["큰 접시","작은 컵","긴 의자","요리 도구"],"word":"platter","r":{"a":"1) 큰 접시","ev":"2번 문장","s":[[2,"You see platter after platter of different foods.","여러분은 다양한 음식이 담긴 계속 이어지는 접시들을 본다."]],"w":"뷔페에서 다양한 음식이 담겨 계속 이어지는 것이니 음식을 담는 접시예요. platter = (음식을 담는) 큰 접시.","c":1},"h":"373dfbc211"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nScientists have seen this behavior in studies with rats: Rats that normally maintain a steady body weight when eating one type of food eat huge amounts and become obese when they are presented with a variety of high-calorie foods, such as chocolate bars, crackers, and potato chips.","ko":"밑줄 친 they가 가리키는 것은?","sko":"과학자들은 쥐를 통한 연구에서 이러한 행동을 봐 왔는데, 보통 한 종류의 음식을 먹을 때 한결같은 체중을 유지하는 쥐들이 초콜릿 바, 크래커, 감자 칩과 같은 다양한 열량이 높은 음식이 주어졌을 때 대단히 많은 양을 먹고 뚱뚱해진다.","opts":["쥐들","과학자들","초콜릿 바","한 종류의 음식"],"r":{"a":"1) 쥐들","ev":"6번 문장","s":[[6,"Scientists have seen this behavior in studies with rats: Rats that normally maintain a steady body weight when eating one type of food eat huge amounts and become obese when they are presented with a variety of high-calorie foods, such as chocolate bars, crackers, and potato chips.","과학자들은 쥐를 통한 연구에서 이러한 행동을 봐 왔는데, 보통 한 종류의 음식을 먹을 때 한결같은 체중을 유지하는 쥐들이 초콜릿 바, 크래커, 감자 칩과 같은 다양한 열량이 높은 음식이 주어졌을 때 대단히 많은 양을 먹고 뚱뚱해진다."]],"w":"they are presented with a variety of high-calorie foods(그들에게 열량이 높은 다양한 음식이 주어진다)에서 they는 앞의 Rats that normally maintain a steady body weight를 가리켜요.","c":1,"k":"they = 쥐들"},"pron":"they","h":"7dece0675d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The same is true of humans.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"인간도 마찬가지이다.","opts":["사람은 쥐와 달리 다양한 음식이 있어도 적게 먹는다.","사람은 쥐보다 항상 더 많이 먹는다.","사람은 쥐와 같은 음식만 먹는다.","쥐에게 나타난 행동이 사람에게도 똑같이 나타난다."],"r":{"a":"4) 쥐에게 나타난 행동이 사람에게도 똑같이 나타난다.","ev":"7번 문장","s":[[7,"The same is true of humans.","인간도 마찬가지이다."]],"w":"be true of ~는 '~에도 마찬가지이다'예요. 6번에서 쥐에게 나타난 일이 사람에게도 똑같이 적용된다는 뜻이에요.","c":4},"h":"cc47c0a743"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["맛있는 음식이 여러 종류 있으면 사람들은 더 적게 먹는다.","맛있는 음식이 여러 종류 있으면 사람들은 많이 먹는다.","쥐는 한 종류의 음식만 먹으면 항상 살이 찐다.","과학자들은 쥐 대신 사람을 연구했다."],"opts":["People eat less when many kinds of good-tasting food are available.","People eat a lot when many kinds of good-tasting food are available.","Rats always gain weight when they eat only one type of food.","Scientists studied humans instead of rats."],"r":{"a":"2) People eat a lot when many kinds of good-tasting food are available. (맛있는 음식이 여러 종류 있으면 사람들은 많이 먹는다.)","ev":"8번 문장","s":[[8,"We eat much more when a variety of good-tasting foods are available than when only one or two types of food are available.","우리는 단지 한 가지 또는 두 가지 음식을 먹을 수 있을 때보다 다양한 맛있는 음식을 먹을 수 있을 때 훨씬 더 많이 먹는다."]],"w":"8번 We eat much more when a variety of good-tasting foods are available(다양한 맛있는 음식이 있을 때 훨씬 더 많이 먹는다)과 같아요. 쥐는 한 종류의 음식을 먹을 때는 체중이 한결같았어요.","c":2},"h":"038a9975b6"},{"n":9,"t":"sum","q":"When a (A) of good-tasting foods are available, people eat (B) than when only one or two types of food are available.","ko":"맛있는 음식이 (A) 있을 때, 사람들은 한두 가지 음식만 있을 때보다 (B) 먹는다.","oko":["(A) 부족 / (B) 더 많이","(A) 부족 / (B) 더 적게","(A) 다양함 / (B) 더 많이","(A) 다양함 / (B) 더 적게","(A) 다양함 / (B) 똑같이"],"opts":["(A) shortage / (B) more","(A) shortage / (B) less","(A) variety / (B) more","(A) variety / (B) less","(A) variety / (B) the same"],"r":{"a":"3) (A) variety / (B) more","ev":"5번, 8번 문장","s":[[5,"The availability of different types of food is one factor in gaining weight.","다양한 종류의 음식을 맛볼 수 있다는 것은 체중이 느는 한 가지 요인이다."],[8,"We eat much more when a variety of good-tasting foods are available than when only one or two types of food are available.","우리는 단지 한 가지 또는 두 가지 음식을 먹을 수 있을 때보다 다양한 맛있는 음식을 먹을 수 있을 때 훨씬 더 많이 먹는다."]],"w":"8번에서 맛있는 음식이 다양할 때 한두 가지일 때보다 훨씬 더 많이 먹는다고 해요(variety, more). 5번도 다양한 음식이 체중이 느는 요인이라고 해요.","c":3},"h":"843c5239cf"},{"n":10,"t":"fill","q":"Think of a buffet table at a party, or [A] at a hotel you've [B].","ko":"파티나, [A] 여러분이 [B] 호텔의 뷔페 테이블을 생각해 보라.","bank":["perhaps","visited","steady","factor","weight","usual"],"bko":{"perhaps":"아마도","visited":"방문해 보았던(visit의 과거분사)","steady":"한결같은","factor":"요인","weight":"체중","usual":"평상시의"},"r":{"a":"[A] perhaps (아마도), [B] visited (방문해 보았던(visit의 과거분사))","ev":"1번 문장","s":[[1,"Think of a buffet table at a party, or perhaps at a hotel you’ve visited.","파티나, 아마도 여러분이 방문해 보았던 호텔의 뷔페 테이블을 생각해 보라."]],"w":"1번 or perhaps at a hotel(아니면 아마도 호텔에서)의 perhaps는 '아마도'라는 부사이고, a hotel you've visited는 '네가 방문해 본 호텔'로 you've visited(you have visited)가 hotel을 꾸며요.","c":null},"h":"bd2f43a82a"}]},{"u":3,"id":"ch1-03-1","no":1,"ko":"들인 돈이 얼만데!","items":[{"n":1,"t":"tf","q":"The Concorde was fast and safe, but it was costly to produce.","ko":"콩코드는 빠르고 안전했지만 생산하는 데 비용이 많이 들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Though it was fast and safe, the Concorde was costly to produce and there weren’t many orders.","비록 그것은 빠르고 안전했지만, 콩코드는 생산하는 데 비용이 많이 들었으며 주문이 많지 않았다."]],"w":"6번 문장에서 빠르고 안전했지만(fast and safe) 생산하는 데 비용이 많이 들었다(costly to produce)고 해요.","c":"T"},"h":"2197d9a0d9"},{"n":2,"t":"tf","q":"The French and British governments stopped investing in the project because there weren’t many orders.","ko":"프랑스와 영국 정부는 주문이 많지 않았기 때문에 그 프로젝트에 투자하는 것을 멈췄다.","r":{"a":"F (본문과 다른 내용)","ev":"6번, 7번 문장","s":[[6,"Though it was fast and safe, the Concorde was costly to produce and there weren’t many orders.","비록 그것은 빠르고 안전했지만, 콩코드는 생산하는 데 비용이 많이 들었으며 주문이 많지 않았다."],[7,"However, the French and British governments continued to pour money into the project.","그러나, 프랑스와 영국 정부는 프로젝트에 계속 돈을 쏟아부었다."]],"w":"주문이 많지 않았다는 것은 6번에 나오지만, 7번에서 However 뒤에 정부는 계속 돈을 쏟아부었다고 해요. 멈췄다는 것은 반대예요.","c":"F"},"h":"13ab74c5f2"},{"n":3,"t":"tf","q":"According to the passage, continuing to watch a scary movie because you have paid for the ticket can be explained by the Concorde fallacy.","ko":"글에 따르면, 표 값을 냈기 때문에 무서운 영화를 계속 보는 것은 콩코드 오류로 설명될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"But you keep watching it because you already paid for the ticket and can’t get a refund.","그러나 이미 표 값을 지불했고 환불받을 수 없으므로 당신은 계속해서 영화를 본다."],[3,"This irrational behavior can be explained by the Concorde fallacy.","이러한 비논리적인 행동은 콩코드 오류로 설명될 수 있다."]],"w":"2번에서 이미 표 값을 냈다는 이유로 계속 영화를 보고, 3번에서 이 비논리적인 행동을 콩코드 오류로 설명할 수 있다고 해요.","c":"T"},"h":"1c125544d2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the French and British governments continued to pour money into the project.)","ko":"...프랑스와 영국 정부는 프로젝트에 계속 돈을 쏟아부었다.","opts":["쏟아붓다","빌려주다","거두어들이다","감추다"],"word":"pour","r":{"a":"1) 쏟아붓다","ev":"7번 문장","s":[[7,"However, the French and British governments continued to pour money into the project.","그러나, 프랑스와 영국 정부는 프로젝트에 계속 돈을 쏟아부었다."]],"w":"프로젝트에 계속 돈을 넣는다는 문장이고, 8번에서 이미 너무 많이 투자했다고 해요. pour money into = 돈을 쏟아붓다.","c":1},"h":"03bf5ffadb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the project had become a legendary financial disaster.)","ko":"...그 프로젝트는 전설적인 재정적 재앙이 되어 있었다.","opts":["평범한","전설적인","수익성 있는","실망스러운"],"word":"legendary","r":{"a":"2) 전설적인","ev":"9번 문장","s":[[9,"By the time the last Concorde flew in 2003, the project had become a legendary financial disaster.","2003년에 마지막 콩코드가 비행할 무렵, 그 프로젝트는 전설적인 재정적 재앙이 되어 있었다."]],"w":"오래도록 이야기될 만큼 유명한 재앙이라는 뜻이에요. legendary = 전설적인.","c":2},"h":"3fa8bc54d0"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nTo avoid the Concorde fallacy, consider only future costs and potential profits, ignoring any investments that have already been made.","ko":"밑줄 친 that이 가리키는 것은?","sko":"콩코드 오류를 피하기 위해서, 이미 이루어진 투자를 무시하고 미래 비용과 잠재 이윤만 고려하라.","opts":["투자","미래 비용","잠재 이윤","콩코드 오류"],"r":{"a":"1) 투자","ev":"11번 문장","s":[[11,"To avoid the Concorde fallacy, consider only future costs and potential profits, ignoring any investments that have already been made.","콩코드 오류를 피하기 위해서, 이미 이루어진 투자를 무시하고 미래 비용과 잠재 이윤만 고려하라."]],"w":"ignoring any investments that have already been made(이미 이루어진 투자를 무시하고)에서 that은 바로 앞의 investments를 가리켜요.","c":1,"k":"that = 투자"},"pron":"that","h":"8362837039"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Watching a movie at the theater, you soon realize it’s too scary to be enjoyable.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"극장에서 영화를 보면서, 당신은 곧 영화가 너무 무서워서 즐길 수 없다는 것을 깨닫게 된다.","opts":["극장에서 영화를 보다 보면 영화가 무섭지 않아서 곧 지루해진다.","극장에 가기 전에 영화가 무서운지 먼저 확인한다.","극장에서 영화를 보다가 영화가 너무 무서워 즐길 수 없다는 것을 알게 된다.","영화가 너무 재미있어서 무서운 줄도 모르고 본다."],"r":{"a":"3) 극장에서 영화를 보다가 영화가 너무 무서워 즐길 수 없다는 것을 알게 된다.","ev":"1번 문장","s":[[1,"Watching a movie at the theater, you soon realize it’s too scary to be enjoyable.","극장에서 영화를 보면서, 당신은 곧 영화가 너무 무서워서 즐길 수 없다는 것을 깨닫게 된다."]],"w":"realize는 '깨닫다', too scary to be enjoyable은 '너무 무서워서 즐길 수 없는'이에요.","c":3},"h":"0081b47ea0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["콩코드 오류는 프랑스와 영국이 만든 제트기에서 이름이 비롯되었다.","콩코드는 영국에서만 만든 제트기였다.","콩코드는 느리고 안전하지 않아서 주문이 적었다.","정부는 투자를 너무 적게 해서 프로젝트를 일찍 포기했다."],"opts":["The Concorde fallacy got its name from a jet made by France and Britain.","The Concorde was made only by Britain.","Few people ordered the Concorde because it was slow and unsafe.","The governments gave up on the project early because they had invested too little."],"r":{"a":"1) The Concorde fallacy got its name from a jet made by France and Britain. (콩코드 오류는 프랑스와 영국이 만든 제트기에서 이름이 비롯되었다.)","ev":"5번 문장","s":[[5,"Its name comes from a supersonic jet made by France and Britain.","그 이름은 프랑스와 영국이 만든 초음속 제트기에서 비롯된 것이다."]],"w":"5번 Its name comes from a supersonic jet made by France and Britain(그 이름은 프랑스와 영국이 만든 초음속 제트기에서 비롯되었다)과 같아요.","c":1},"h":"1acd4ec90b"},{"n":9,"t":"sum","q":"It is not easy to (A) mistakes, but a wise person knows when to give (B).","ko":"실수를 (A) 것은 쉽지 않지만, 현명한 사람은 언제 포기(give (B))해야 할지 안다.","oko":["(A) 숨기는 / (B) 나눠 주다","(A) 인정하는 / (B) 항복하다","(A) 저지르는 / (B) 항복하다","(A) 인정하는 / (B) 포기하다","(A) 숨기는 / (B) 포기하다"],"opts":["(A) hide / (B) out","(A) admit / (B) in","(A) make / (B) in","(A) admit / (B) up","(A) hide / (B) up"],"r":{"a":"4) (A) admit / (B) up ((A) 인정하는 / (B) 포기하다)","ev":"1~0번 문장","s":[[10,"There is, however, a lesson to be learned from it: It isn’t easy to admit mistakes, but a wise person knows when to give up.","그러나, 그것으로부터 배울 교훈은 있다. 실수를 인정하기는 쉽지 않지만, 현명한 사람은 언제 포기해야 할지 알고 있다."]],"w":"10번 It isn't easy to admit mistakes, but a wise person knows when to give up(실수를 인정하기는 쉽지 않지만, 현명한 사람은 언제 포기해야 할지 안다)에서 admit과 give up이 답이에요.","c":4},"h":"1b0e6b54c4"},{"n":10,"t":"fill","q":"The Concorde fallacy is the idea that we [A] keep doing things simply because we don't want to [B] our initial investment.","ko":"콩코드 오류는 단순히 초기 투자를 [B] 싶지 않아서 우리가 [A] 계속해서 뭔가를 한다는 개념이다.","bank":["often","waste","costly","jet","profits","safe"],"bko":{"often":"종종","waste":"낭비하다","costly":"비용이 많이 드는","jet":"제트기","profits":"이윤(profit의 복수형)","safe":"안전한"},"r":{"a":"[A] often (종종), [B] waste (낭비하다)","ev":"4번 문장","s":[[4,"The Concorde fallacy is the idea that we often keep doing things simply because we don’t want to waste our initial investment.","콩코드 오류는 단순히 초기 투자를 낭비하고 싶지 않아서 우리가 종종 계속해서 뭔가를 한다는 개념이다."]],"w":"4번 we often keep doing things(우리는 종종 계속해서 뭔가를 한다)의 often은 빈도부사이고, don't want to waste(낭비하고 싶지 않다)는 to 뒤에 동사원형 waste가 와요.","c":null},"h":"3ed3adc593"}]},{"u":3,"id":"ch1-03-2","no":2,"ko":"광고보다 믿게 되는 사람","items":[{"n":1,"t":"tf","q":"On social media platforms, the market size more than tripled between 2019 and 2024.","ko":"소셜 미디어 플랫폼의 시장 규모는 2019년부터 2024년 사이에 3배 이상 증가했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Between 2019 and 2024, the market size on social media platforms has more than tripled.","2019년부터 2024년까지, 소셜 미디어 플랫폼의 시장 규모는 3배 이상 증가했다."]],"w":"3번 문장에서 2019년부터 2024년까지 시장 규모가 3배 이상(more than tripled) 증가했다고 해요.","c":"T"},"h":"12a034e749"},{"n":2,"t":"tf","q":"Fewer than half of consumers have bought a product recommended by an influencer.","ko":"소비자의 절반 미만이 인플루언서가 추천한 제품을 구매한 적이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"According to a recent study, 74 percent of consumers have bought a product recommended by an influencer.","최근 연구에 따르면, 소비자의 74%가 인플루언서가 추천한 제품을 구매한 적이 있다."]],"w":"7번 문장에서 소비자의 74%가 구매한 적이 있다고 해요. 74%는 절반보다 많아요.","c":"F"},"h":"8814057ebb"},{"n":3,"t":"tf","q":"Social proof means that people prefer to act differently from others.","ko":"사회적 증거는 사람들이 다른 사람들과 다르게 행동하는 것을 선호한다는 뜻이다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"This concept describes that people naturally follow others’ behaviors.","이 개념은 사람들이 자연스럽게 다른 사람의 행동을 따른다는 것을 설명한다."]],"w":"9번 문장에서 이 개념은 사람들이 자연스럽게 다른 사람의 행동을 따른다는 것을 설명해요. 다르게 행동한다는 것은 반대예요.","c":"F"},"h":"517711599b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...Brands work with popular influencers to promote their products and services.)","ko":"...브랜드는 제품과 서비스를 홍보하기 위해 인기 있는 인플루언서와 협력한다.","opts":["홍보하다","생산하다","환불하다","비교하다"],"word":"promote","r":{"a":"1) 홍보하다","ev":"2번 문장","s":[[2,"Brands work with popular influencers to promote their products and services.","브랜드는 제품과 서비스를 홍보하기 위해 인기 있는 인플루언서와 협력한다."]],"w":"브랜드가 인플루언서와 협력하는 목적이므로 제품과 서비스를 알리는 '홍보하다'가 알맞아요.","c":1},"h":"e0b4b1e3be"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...This plays a significant role in driving consumer purchasing behavior.)","ko":"...이는 소비자의 구매 행동을 유도하는 데 중요한 역할을 한다.","opts":["작은","오래된","중요한","위험한"],"word":"significant","r":{"a":"3) 중요한","ev":"6번 문장","s":[[6,"This plays a significant role in driving consumer purchasing behavior.","이는 소비자의 구매 행동을 유도하는 데 중요한 역할을 한다."]],"w":"역할(role)을 한다는 문장이고 5번에서 영향력을 말하고 있으니 significant = 중요한이에요.","c":3},"h":"08ba0f6f80"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSo when followers see an influencer promoting a product, they are more likely to want it as well.","ko":"밑줄 친 they가 가리키는 것은?","sko":"따라서 팔로워들은 인플루언서가 제품을 홍보하는 것을 보면, 자신도 그 제품을 원하게 될 가능성이 높다.","opts":["인플루언서들","브랜드들","팔로워들","제품들"],"r":{"a":"3) 팔로워들","ev":"10번 문장","s":[[10,"So when followers see an influencer promoting a product, they are more likely to want it as well.","따라서 팔로워들은 인플루언서가 제품을 홍보하는 것을 보면, 자신도 그 제품을 원하게 될 가능성이 높다."]],"w":"when followers see an influencer promoting a product, they are more likely...에서 they는 앞의 followers를 가리켜요.","c":3,"k":"they = 팔로워들"},"pron":"they","h":"a0c10d84d5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As social media continues to be used, influencer marketing will remain a key player in digital advertising.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"소셜 미디어가 계속해서 활용됨에 따라, 인플루언서 마케팅은 디지털 광고의 핵심 역할을 계속할 것이다.","opts":["소셜 미디어가 사라지면 인플루언서 마케팅이 디지털 광고의 중심이 될 것이다.","소셜 미디어가 계속 쓰이는 동안 인플루언서 마케팅은 디지털 광고의 핵심으로 남을 것이다.","인플루언서 마케팅이 늘어나서 소셜 미디어의 광고가 줄어들 것이다.","소셜 미디어 이용이 줄면 디지털 광고가 더 중요해질 것이다."],"r":{"a":"2) 소셜 미디어가 계속 쓰이는 동안 인플루언서 마케팅은 디지털 광고의 핵심으로 남을 것이다.","ev":"14번 문장","s":[[14,"As social media continues to be used, influencer marketing will remain a key player in digital advertising.","소셜 미디어가 계속해서 활용됨에 따라, 인플루언서 마케팅은 디지털 광고의 핵심 역할을 계속할 것이다."]],"w":"As는 '~함에 따라', continue to be used는 '계속 활용되다', remain a key player는 '핵심 역할로 남다'예요.","c":2},"h":"8f56f4de9f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["인플루언서 마케팅 경제는 2024년에 240억 달러의 가치로 평가됐다.","인플루언서는 소비자의 구매 행동에 거의 영향을 주지 못한다.","소셜 미디어 플랫폼의 시장 규모는 2019년 이후 줄어들었다.","브랜드는 인기 있는 인플루언서와 협력하지 않는다."],"opts":["The influencer marketing economy was valued at $24 billion in 2024.","Influencers have little effect on consumer purchasing behavior.","The market size on social media platforms has decreased since 2019.","Brands do not work with popular influencers."],"r":{"a":"1) The influencer marketing economy was valued at $24 billion in 2024. (인플루언서 마케팅 경제는 2024년에 240억 달러의 가치로 평가됐다.)","ev":"4번 문장","s":[[4,"In 2024, the influencer marketing economy was valued at $24 billion.","2024년에는 인플루언서 마케팅 경제 규모가 240억 달러의 가치로 평가됐다."]],"w":"4번 In 2024, the influencer marketing economy was valued at $24 billion(2024년에는 인플루언서 마케팅 경제 규모가 240억 달러의 가치로 평가됐다)과 같아요.","c":1},"h":"5b98b58338"},{"n":9,"t":"sum","q":"Brands and influencers make products seem (A) and (B) to control consumers' behavior.","ko":"브랜드와 인플루언서는 소비자의 행동을 조정하기 위해 제품이 (A)이고 (B)인 것처럼 보이게 만든다.","oko":["(A) 저렴한 / (B) 흔한","(A) 독점적인 / (B) 흔한","(A) 독점적인 / (B) 한시적인","(A) 저렴한 / (B) 한시적인","(A) 흔한 / (B) 무제한인"],"opts":["(A) cheap / (B) common","(A) exclusive / (B) common","(A) exclusive / (B) time-limited","(A) cheap / (B) time-limited","(A) common / (B) unlimited"],"r":{"a":"3) (A) exclusive / (B) time-limited ((A) 독점적인 / (B) 한시적인)","ev":"1~2번 문장","s":[[12,"Brands and influencers further control these patterns in behavior by making products seem exclusive and time-limited.","브랜드와 인플루언서는 제품을 독점적이고 한시적인 것처럼 보이게 만듦으로써 이러한 행동 양식을 더욱 조정한다."]],"w":"12번 making products seem exclusive and time-limited(제품을 독점적이고 한시적인 것처럼 보이게 만든다)에서 exclusive와 time-limited가 답이에요.","c":3},"h":"b9a31780f2"},{"n":10,"t":"fill","q":"Brands use influencer marketing as a powerful [A], shaping consumer behavior and increasing [B].","ko":"브랜드는 인플루언서 마케팅을 강력한 [A](으)로 활용해 소비자 행동을 형성하고 [B]을(를) 증가시킨다.","bank":["tool","sales","study","proof","economy","market"],"bko":{"tool":"도구","sales":"매출","study":"연구","proof":"증거","economy":"경제","market":"시장"},"r":{"a":"[A] tool, [B] sales","ev":"13번 문장","s":[[13,"In this age of technology, brands use influencer marketing as a powerful tool, shaping consumer behavior and increasing sales.","이 기술의 시대에서, 브랜드는 인플루언서 마케팅을 강력한 도구로 활용해 소비자 행동을 형성하고 매출을 증가시키고 있다."]],"w":"13번 문장에서 a powerful 뒤에는 도구(tool), increasing 뒤에는 매출(sales)이 와요. 소비자 행동을 형성하고 매출을 늘리는 강력한 도구라는 뜻이에요.","c":null},"h":"d29f6f6d83"}]},{"u":3,"id":"ch1-03-3","no":3,"ko":"소비자를 낚는 상품","items":[{"n":1,"t":"tf","q":"A loss leader can be sold even at a loss.","ko":"특가품은 손해를 보면서 판매될 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"A loss leader is a product sold at very little profit or even at a loss.","특가품은 이익을 아주 적게 남기거나 심지어 손해를 보면서 판매되는 상품이다."]],"w":"4번 문장에서 특가품은 이익을 아주 적게 남기거나 심지어 손해를 보면서(at a loss) 판매되는 상품이라고 해요.","c":"T"},"h":"401244efbe"},{"n":2,"t":"tf","q":"Loss leaders are usually put at the front of the store.","ko":"특가품은 주로 매장 앞쪽에 놓인다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Loss leaders are usually put at the back of the store, so customers have to pass the regularly priced products first.","특가품은 주로 매장 뒤쪽에 놓여서, 고객들은 정가 상품을 먼저 지나가야 한다."]],"w":"7번 문장에서 특가품은 주로 매장 뒤쪽(at the back)에 놓인다고 해요. 앞쪽이 아니에요.","c":"F"},"h":"6e1dc6f818"},{"n":3,"t":"tf","q":"Razor handles are often sold at a very high price so that customers buy refill blades.","ko":"면도기 손잡이는 고객이 리필용 면도날을 사도록 종종 아주 비싼 가격에 판매된다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"For example, razor handles are often given away for free so that customers are locked into buying expensive refill blades.","예를 들어, 종종 면도기 손잡이가 무료로 주어져, 고객들이 비싼 리필용 면도날을 사게 된다."]],"w":"9번 문장에서 면도기 손잡이는 종종 무료로 주어진다(given away for free)고 해요. 비싼 것은 리필용 면도날이에요.","c":"F"},"h":"4beeb1ac43"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...While loss leaders can trick customers, wise shoppers can use them to their advantage.)","ko":"...특가품이 고객을 속일 수는 있지만, 현명한 구매자들은 그것들을 자신에게 이롭게 이용할 수 있다.","opts":["교육하다","속이다","돕다","방문하다"],"word":"trick","r":{"a":"2) 속이다","ev":"10번 문장","s":[[10,"While loss leaders can trick customers, wise shoppers can use them to their advantage.","특가품이 고객을 속일 수는 있지만, 현명한 구매자들은 그것들을 자신에게 이롭게 이용할 수 있다."]],"w":"While은 '~이긴 하지만'이라 뒤의 '현명한 구매자는 이롭게 쓸 수 있다'와 대비돼요. 그러므로 trick = 속이다예요.","c":2},"h":"64076f9708"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...selling just one component of a set very cheaply.)","ko":"...세트의 한 구성 품목만을 아주 싸게 파는 것.","opts":["구성 품목","할인 행사","판매 전략","고객 목록"],"word":"component","r":{"a":"1) 구성 품목","ev":"8~9번 문장","s":[[8,"Another strategy involves selling just one component of a set very cheaply.","또 다른 전략은 세트의 한 구성 품목만을 아주 싸게 파는 것과 관계있다."],[9,"For example, razor handles are often given away for free so that customers are locked into buying expensive refill blades.","예를 들어, 종종 면도기 손잡이가 무료로 주어져, 고객들이 비싼 리필용 면도날을 사게 된다."]],"w":"9번에서 세트의 한 품목인 면도기 손잡이를 무료로 준다고 해요. component = 구성 품목이에요.","c":1},"h":"8d6eb7ec39"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIf loss leader items are all they need, they should prepare their shopping list in advance and stick to it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"자신이 필요로 하는 것이 특가 품목뿐이라면, 그들은 미리 쇼핑 목록을 준비하고 그것을 고수해야 한다.","opts":["특가품","고객","쇼핑 목록","상점"],"r":{"a":"3) 쇼핑 목록","ev":"11번 문장","s":[[11,"If loss leader items are all they need, they should prepare their shopping list in advance and stick to it.","자신이 필요로 하는 것이 특가 품목뿐이라면, 그들은 미리 쇼핑 목록을 준비하고 그것을 고수해야 한다."]],"w":"it은 stick to(고수하다)의 대상이에요. 미리 준비한 their shopping list를 지키라는 뜻이에요.","c":3},"h":"e57b92b9ba"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But by the time you’ve finished shopping, you’ve actually bought far more than you had originally wanted!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 쇼핑을 끝냈을 때쯤, 당신은 실제로는 원래 원했던 것보다 훨씬 더 많은 것을 샀다!","opts":["쇼핑을 끝낼 때쯤이면 원래 사려던 것보다 훨씬 적게 샀다.","쇼핑을 끝내기 전에 원하는 것을 모두 사려고 서두르게 된다.","쇼핑을 끝낸 뒤 산 물건을 모두 환불하게 된다.","쇼핑을 끝낼 때쯤이면 원래 사려던 것보다 훨씬 더 많이 샀다."],"r":{"a":"4) 쇼핑을 끝낼 때쯤이면 원래 사려던 것보다 훨씬 더 많이 샀다.","ev":"2번 문장","s":[[2,"But by the time you’ve finished shopping, you’ve actually bought far more than you had originally wanted!","그러나 쇼핑을 끝냈을 때쯤, 당신은 실제로는 원래 원했던 것보다 훨씬 더 많은 것을 샀다!"]],"w":"far more than you had originally wanted는 '원래 원했던 것보다 훨씬 더 많이'라는 뜻이에요.","c":4},"h":"203b8f37d5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["기업들은 상품 배치를 전략 중 하나로 사용한다.","특가품은 높은 이익을 남기고 팔린다.","쇼핑할 때는 목록 없이 매장을 돌아다니며 좋은 상품을 찾아야 한다.","기업들은 특가품에 어떤 전략도 사용하지 않는다."],"opts":["Companies use product placement as one of their strategies.","Loss leaders are sold at a high profit.","Shoppers should walk around the store without a list to find good deals.","Companies never use any strategy for loss leaders."],"r":{"a":"1) Companies use product placement as one of their strategies. (기업들은 상품 배치를 전략 중 하나로 사용한다.)","ev":"6번 문장","s":[[6,"One strategy that companies use has to do with product placement.","기업들이 사용하는 한 가지 전략은 상품 배치와 관계있다."]],"w":"6번 One strategy that companies use has to do with product placement(기업들이 사용하는 한 가지 전략은 상품 배치와 관계있다)와 같아요. 특가품은 이익을 아주 적게 남기고 팔려요.","c":1},"h":"328ef78ff5"},{"n":9,"t":"sum","q":"A loss leader’s purpose is to (A) customers to a store so that they end up (B) more on other products.","ko":"특가품의 목적은 고객을 상점으로 (A) 그들이 결국 다른 상품에 더 많은 돈을 (B) 하는 것이다.","oko":["(A) 잃게 / (B) 쓰게","(A) 끌어들여 / (B) 아끼게","(A) 끌어들여 / (B) 쓰게","(A) 쫓아내 / (B) 아끼게","(A) 쫓아내 / (B) 쓰게"],"opts":["(A) lose / (B) spending","(A) attract / (B) saving","(A) attract / (B) spending","(A) avoid / (B) saving","(A) avoid / (B) spending"],"r":{"a":"3) (A) attract / (B) spending","ev":"5번 문장","s":[[5,"Its purpose is to attract more customers to a store so that they end up spending more on other products.","그것의 목적은 더 많은 고객을 상점으로 끌어들여 그들이 다른 상품에 더 많은 돈을 쓰게 하는 것이다."]],"w":"5번에서 특가품의 목적은 고객을 상점으로 끌어들이고(attract) 그들이 다른 상품에 더 많은 돈을 쓰게(spending) 하는 것이라고 해요.","c":3},"h":"65e413db20"},{"n":10,"t":"fill","q":"You hear about an amazing [A] and think you will [B] lots of money.","ko":"당신은 놀랄 만한 [A]에 대해 듣고 자신이 많은 돈을 [B] 거라고 생각한다.","bank":["discount","save","strategy","placement","profit","blade"],"bko":{"discount":"할인","save":"절약하다","strategy":"전략","placement":"배치","profit":"이익","blade":"날"},"r":{"a":"[A] discount (할인), [B] save (절약하다)","ev":"1번 문장","s":[[1,"Imagine this—you hear about an amazing discount and think you will save lots of money.","이것을 상상해 보라. 당신은 놀랄 만한 할인에 대해 듣고 자신이 많은 돈을 절약할 거라고 생각한다."]],"w":"1번 an amazing discount(놀랄 만한 할인)와 you will save lots of money(많은 돈을 절약할 것이다)에서 will 뒤에는 동사원형 save가 와요.","c":null},"h":"4560448d5d"}]},{"u":3,"id":"ch1-03-4","no":4,"ko":"수능:ON 내용 일치","items":[{"n":1,"t":"tf","q":"The woman buys the cheapest phone because she wants to save money.","ko":"그 여성은 돈을 아끼고 싶어서 가장 싼 휴대전화를 산다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Confused, she finally just picks one right in the middle that’s not too cheap and not too expensive.","혼란스러워하며 그녀는 결국 너무 싸지도 비싸지도 않은 딱 중간 모델을 고른다."]],"w":"3번 문장에서 그녀는 너무 싸지도 비싸지도 않은 딱 중간 모델을 골라요. 가장 싼 것이 아니에요.","c":"F"},"h":"486637de7f"},{"n":2,"t":"tf","q":"The Goldilocks effect comes from an old fairytale.","ko":"골디락스 효과는 오래된 동화에서 유래되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It comes from the old fairytale, “Goldilocks and the Three Bears.”","그것은 ‘골디락스와 곰 세 마리’라는 오래된 동화에서 유래된 것이다."]],"w":"6번 문장에서 그것(골디락스 효과)은 ‘골디락스와 곰 세 마리’라는 오래된 동화에서 유래되었다고 해요.","c":"T"},"h":"8af0b67098"},{"n":3,"t":"tf","q":"People are not worried about the quality of cheaper items.","ko":"사람들은 더 싼 물건의 품질에 대해 걱정하지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"However, they worry that cheaper items are of poor quality.","그러나 그들은 더 싼 물건은 품질이 좋지 못하다고 걱정한다."]],"w":"10번 문장에서 사람들은 더 싼 물건은 품질이 좋지 못할까 걱정한다(worry)고 해요.","c":"F"},"h":"11ffa771b7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...since people usually avoid extremes.)","ko":"...사람들은 대개 극단을 피하기 때문에.","opts":["평균","이익","극단","실수"],"word":"extremes","r":{"a":"3) 극단","ev":"8번 문장","s":[[8,"This is natural psychological behavior, since people usually avoid extremes.","사람들은 대개 극단을 피하기 때문에 이것은 자연스러운 심리적 행동이다."]],"w":"항상 중간 옵션을 고르는 이유를 말하는 문장이에요. 중간의 반대쪽, 즉 너무 싸거나 너무 비싼 것이 extremes(극단)예요.","c":3},"h":"783c1102d3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They’ll often release a luxury version and a low-budget version of one of their items.)","ko":"그들은 종종 그들의 상품 중 하나에 고급 버전과 저예산 버전을 출시한다.","opts":["출시하다","수리하다","금지하다","숨기다"],"word":"release","r":{"a":"1) 출시하다","ev":"12번 문장","s":[[12,"They’ll often release a luxury version and a low-budget version of one of their items.","그들은 종종 그들의 상품 중 하나에 고급 버전과 저예산 버전을 출시한다."]],"w":"기업이 상품의 고급 버전과 저예산 버전을 시장에 내놓는다는 뜻이에요. release = 출시하다.","c":1},"h":"a1e70f7e33"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey think that more expensive items are a waste of money.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 더 비싼 물건이 돈 낭비라고 생각한다.","opts":["동화 속 곰들","사람들","많은 기업들","휴대전화 판매원들"],"r":{"a":"2) 사람들","ev":"8~9번 문장","s":[[8,"This is natural psychological behavior, since people usually avoid extremes.","사람들은 대개 극단을 피하기 때문에 이것은 자연스러운 심리적 행동이다."],[9,"They think that more expensive items are a waste of money.","그들은 더 비싼 물건이 돈 낭비라고 생각한다."]],"w":"바로 앞 8번의 people usually avoid extremes에서 people이에요. 기업(companies)은 11번 이후에 나와요.","c":2},"h":"5863b9b1b6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It may sound like a simple strategy, but it is very effective!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 단순한 전략처럼 들릴지도 모르지만, 매우 효과적이다!","opts":["단순해 보이는 전략이어서 효과가 없다.","복잡해 보이는 전략이라 효과가 크다.","단순한 전략이라고 하기에는 비용이 많이 든다.","단순한 전략처럼 들릴 수 있지만 매우 효과적이다."],"r":{"a":"4) 단순한 전략처럼 들릴 수 있지만 매우 효과적이다.","ev":"14번 문장","s":[[14,"It may sound like a simple strategy, but it is very effective!","그것은 단순한 전략처럼 들릴지도 모르지만, 매우 효과적이다!"]],"w":"may sound like a simple strategy, but ~은 '단순한 전략처럼 들릴지 몰라도'이고, but 뒤가 very effective(매우 효과적)예요.","c":4},"h":"17eec3f091"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 여성은 살 만한 휴대전화를 하나도 찾지 못한다.","이야기 속에서 골디락스는 항상 가장 싼 물건을 고른다.","많은 기업들이 골디락스 효과를 이용한다.","기업들은 자신들의 상품에 저예산 버전만 출시한다."],"
