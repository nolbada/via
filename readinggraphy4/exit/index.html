<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩그라피 4 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"rg4-01-1","no":1,"ko":"벌에게는 주사 대신 이걸 먹인다고?","items":[{"n":1,"t":"tf","q":"Honeybees are important because they help plants produce fruits and seeds.","ko":"꿀벌들은 식물이 열매와 씨앗을 만들도록 돕기 때문에 중요하다.","r":{"ev":"1번 문장","s":[[1,"Honeybees are important insects because they help plants produce fruits and seeds.","꿀벌들은 식물이 열매와 씨앗을 생산하도록 돕기 때문에 중요한 곤충이다."]],"w":"1번 문장에 because they help plants produce fruits and seeds가 그대로 나옴. 식물이 열매와 씨앗을 만들도록 돕는다는 것이 꿀벌이 중요한 이유라서 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"61b7f9fc53"},{"n":2,"t":"tf","q":"Bees get a shot to protect themselves from the disease.","ko":"벌들은 그 질병으로부터 자신들을 보호하기 위해 주사를 맞는다.","r":{"ev":"6번 문장","s":[[6,"Instead of giving the bees a shot, the medicine is mixed into the queen bee’s food.","벌들에게 주사를 놓는 대신에, 약이 여왕벌의 먹이에 섞인다."]],"w":"6번 문장은 Instead of giving the bees a shot(벌들에게 주사를 놓는 대신에)이라고 함. 주사를 놓지 않고 약을 여왕벌의 먹이에 섞는 방식이라서 틀린 내용.","a":"F (본문과 다른 내용)","c":"F"},"h":"c58527ddec"},{"n":3,"t":"tf","q":"Bees are disappearing only because of a bacterial disease.","ko":"벌들은 오직 박테리아 질병 때문에 사라지고 있다.","r":{"ev":"9번 문장","s":[[9,"The bees are very important for the world’s food production, but they are disappearing due to losing their homes, climate change, and pesticides, in addition to a bacterial disease.","벌들은 세계의 식량 생산에 매우 중요하지만, 박테리아 질병뿐만 아니라 서식지를 잃는 것, 기후 변화, 그리고 살충제 때문에 사라지고 있다."]],"w":"9번 문장에서 벌들은 서식지를 잃는 것, 기후 변화, 살충제 때문에 사라지고 있고 박테리아 질병은 in addition to(~에 더하여)로 덧붙은 이유임. '오직(only)'이 틀림.","a":"F (본문과 다른 내용)","c":"F"},"h":"59ac76c5dd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In fact, honeybees are responsible for about one-third of the food crops in the U.S.)","ko":"(실제로, 꿀벌들은 미국에서 식량작물의 약 3분의 1에 responsible하다.)","opts":["책임이 있는","관계없는","두려운","자랑스러운"],"word":"responsible","r":{"ev":"2번 문장","s":[[2,"In fact, honeybees are responsible for about one-third of the food crops in the U.S.","실제로, 꿀벌들은 미국에서 식량작물의 약 3분의 1을 책임진다."]],"w":"2번 문장은 꿀벌이 식량작물의 약 3분의 1을 맡고 있다는 뜻. be responsible for = ~에 책임이 있다. 관계없는은 반대 방향이라 틀림.","a":"1) 책임이 있는","c":1},"h":"243624d50a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…but they are disappearing due to losing their homes, climate change, and pesticides…)","ko":"(…하지만 그것들은 서식지를 잃는 것, 기후 변화, 살충제 때문에 disappearing하고 있다…)","opts":["늘어나고 있는","도착하고 있는","사라지고 있는","자라고 있는"],"word":"disappearing","r":{"ev":"9번 문장","s":[[9,"The bees are very important for the world’s food production, but they are disappearing due to losing their homes, climate change, and pesticides, in addition to a bacterial disease.","벌들은 세계의 식량 생산에 매우 중요하지만, 박테리아 질병뿐만 아니라 서식지를 잃는 것, 기후 변화, 그리고 살충제 때문에 사라지고 있다."]],"w":"9번 문장은 집을 잃고, 기후가 변하고, 살충제 때문에 벌이 점점 없어진다는 내용. disappear = 사라지다. 늘어나거나 자란다면 이유가 나쁜 일들과 맞지 않음.","a":"3) 사라지고 있는","c":3},"h":"98dd0bf124"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nWhen the queen eats it, the medicine goes into her eggs, and helps to protect other bees from the disease.","ko":"밑줄 친 her이(가) 가리키는 것은?","sko":"여왕벌이 그것을 먹으면, 약이 그녀의 알들에 들어가고, 다른 벌들을 그 질병으로부터 보호하는 것을 돕는다.","opts":["한 회사","여왕벌","다른 벌들","식물들"],"r":{"ev":"6~7번 문장","s":[[6,"Instead of giving the bees a shot, the medicine is mixed into the queen bee’s food.","벌들에게 주사를 놓는 대신에, 약이 여왕벌의 먹이에 섞인다."],[7,"When the queen eats it, the medicine goes into her eggs, and helps to protect other bees from the disease.","여왕벌이 그것을 먹으면, 약이 그녀의 알들에 들어가고, 다른 벌들을 그 질병으로부터 보호하는 것을 돕는다."]],"w":"6번에서 약은 여왕벌(the queen bee)의 먹이에 섞임. 7번 When the queen eats it에서 먹는 주체가 여왕벌이고, 약이 들어가는 her eggs는 그 여왕벌의 알임.","a":"2) 여왕벌","c":2},"h":"57dc1615e4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of giving the bees a shot, the medicine is mixed into the queen bee’s food.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"벌들에게 주사를 놓는 대신에, 약이 여왕벌의 먹이에 섞인다.","opts":["벌들에게 주사를 놓고 나서 약을 여왕벌의 먹이에 섞는다.","여왕벌에게만 주사를 놓고 나머지 벌에게는 약을 먹인다.","벌들은 주사 대신 여왕벌이 남긴 음식만 먹는다.","벌들에게 주사를 놓는 대신 약을 여왕벌의 먹이에 섞는다."],"r":{"ev":"6번 문장","s":[[6,"Instead of giving the bees a shot, the medicine is mixed into the queen bee’s food.","벌들에게 주사를 놓는 대신에, 약이 여왕벌의 먹이에 섞인다."]],"w":"Instead of ~ = ~ 대신에. 벌들에게 주사를 놓는 대신 약을 여왕벌의 먹이에 섞는다는 뜻. 주사를 함께 놓는다는 말은 본문에 없음.","a":"4) 벌들에게 주사를 놓는 대신 약을 여왕벌의 먹이에 섞는다.","c":4},"h":"fa85737ae8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["꿀벌들은 미국의 모든 식량작물에 책임이 있다.","백신은 주사로 벌들에게 투여된다.","약이 여왕벌의 먹이에 섞인다.","박테리아 질병은 약 6천 마리의 벌 집단을 파괴할 수 있다."],"opts":["Honeybees are responsible for all of the food crops in the U.S.","The vaccine is given to bees with a shot.","The medicine is mixed into the queen bee's food.","A bacterial disease can destroy a bee family of about 6,000 bees."],"r":{"ev":"2, 4, 6번 문장","s":[[2,"In fact, honeybees are responsible for about one-third of the food crops in the U.S.","실제로, 꿀벌들은 미국에서 식량작물의 약 3분의 1을 책임진다."],[4,"This disease can destroy large bee families with about 60,000 bees.","이 질병은 약 6만 마리의 대형 벌 집단을 파괴할 수 있다."],[6,"Instead of giving the bees a shot, the medicine is mixed into the queen bee’s food.","벌들에게 주사를 놓는 대신에, 약이 여왕벌의 먹이에 섞인다."]],"w":"6번 문장에 약이 여왕벌의 먹이에 섞인다고 나옴. ①은 2번에서 약 3분의 1이라 했고, ②는 6번에서 주사 대신이라 했고, ④는 4번에서 약 6만 마리라 했으므로 틀림.","a":"3) The medicine is mixed into the queen bee's food.","c":3},"h":"384a52d7e2"},{"n":9,"t":"sum","q":"Honeybees are important for food, so a company developed a vaccine to (A) the bees. The vaccine is mixed into the queen bee's (B).","ko":"꿀벌은 식량에 중요해서 한 회사가 벌들을 (A)하려고 백신을 개발했다. 백신은 여왕벌의 (B)에 섞인다.","oko":["(A) 파괴하다 / (B) 먹이","(A) 보호하다 / (B) 주사","(A) 파괴하다 / (B) 주사","(A) 퍼뜨리다 / (B) 주사","(A) 보호하다 / (B) 먹이"],"opts":["(A) destroy / (B) food","(A) protect / (B) shot","(A) destroy / (B) shot","(A) spread / (B) shot","(A) protect / (B) food"],"r":{"ev":"5~6번 문장","s":[[5,"So, a company developed a vaccine to protect the bees!","그래서 한 회사는 벌들을 지키기 위해 백신을 개발했다!"],[6,"Instead of giving the bees a shot, the medicine is mixed into the queen bee’s food.","벌들에게 주사를 놓는 대신에, 약이 여왕벌의 먹이에 섞인다."]],"w":"5번 문장 a vaccine to protect the bees에서 (A)는 protect(보호하다). 6번 문장 mixed into the queen bee's food에서 (B)는 food(먹이). shot은 6번에서 '놓지 않는 것'이라 틀림.","a":"5) (A) protect / (B) food","c":5},"h":"8b7b30e594"},{"n":10,"t":"fill","q":"A bacterial [A] can destroy large bee families, but thanks to the vaccine, more bees can [B] their important work.","ko":"박테리아 [A]은(는) 큰 벌 집단을 파괴할 수 있지만, 백신 덕분에 더 많은 벌이 중요한 일을 [B]할 수 있다.","bank":["disease","continue","climate","disappear","protect","spread"],"bko":{"disease":"질병","continue":"계속하다","climate":"기후","disappear":"사라지다","protect":"보호하다","spread":"퍼뜨리다"},"r":{"ev":"4, 10번 문장","s":[[4,"This disease can destroy large bee families with about 60,000 bees.","이 질병은 약 6만 마리의 대형 벌 집단을 파괴할 수 있다."],[10,"Thanks to the vaccine, more bees can continue their important work of spreading pollen and producing honey.","백신 덕분에, 더 많은 벌이 꽃가루를 퍼뜨리고 꿀을 만들어 내는 중요한 일을 계속할 수 있다."]],"w":"4번 문장 This disease can destroy large bee families에서 [A]는 disease. 10번 more bees can continue their important work에서 [B]는 continue. develop, protect는 5번의 백신 이야기, spread는 꽃가루 이야기라서 이 문장에는 안 맞음.","a":"[A] disease, [B] continue","c":null},"h":"5a4669763a"}]},{"u":1,"id":"rg4-01-2","no":2,"ko":"색맹인 사람도 가을 단풍을 볼 수 있게!","items":[{"n":1,"t":"tf","q":"Tennessee installed special viewfinders in 12 places in 2017.","ko":"테네시주는 2017년에 12곳에 특별한 뷰파인더를 설치했다.","r":{"ev":"6번 문장","s":[[6,"In 2017, the state installed special viewfinders in 12 places.","2017년, 그 주(州)는 12곳에 특별한 뷰파인더들을 설치했다."]],"w":"6번 문장에 In 2017, the state installed special viewfinders in 12 places가 그대로 나옴. 연도, 설치한 것, 장소 수가 모두 맞음.","a":"T (본문과 맞는 내용)","c":"T"},"h":"46b1de097e"},{"n":2,"t":"tf","q":"Van Lew became colorblind when she was a teenager.","ko":"Van Lew는 십 대 때 색맹이 되었다.","r":{"ev":"8번 문장","s":[[8,"Van Lew, who has been colorblind her whole life, looked through one of these special viewfinders.","Van Lew는 평생 색맹이었는데, 그녀는 이 특별한 뷰파인더 중 하나를 통해 바라보았다."]],"w":"8번 문장에서 Van Lew는 has been colorblind her whole life, 즉 평생 색맹이었음. 십 대에 색맹이 되었다는 말은 본문에 없음.","a":"F (본문과 다른 내용)","c":"F"},"h":"80f4fa4f3d"},{"n":3,"t":"tf","q":"Tennessee hopes that more viewfinders will be available across the country.","ko":"테네시주는 전국에서 더 많은 뷰파인더를 이용할 수 있게 되기를 바란다.","r":{"ev":"12번 문장","s":[[12,"Tennessee hopes that more viewfinders will be available across the country.","테네시주는 전국에 걸쳐 더 많은 뷰파인더가 이용할 수 있게 되기를 바란다."]],"w":"12번 문장에 Tennessee hopes that more viewfinders will be available across the country가 그대로 나옴. 전국에 퍼지기를 바란다는 뜻이라서 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"99115d0411"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 2017, the state installed special viewfinders in 12 places.)","ko":"(2017년, 그 주는 12곳에 특별한 뷰파인더들을 installed했다.)","opts":["없앴다","설치했다","빌렸다","팔았다"],"word":"installed","r":{"ev":"6번 문장","s":[[6,"In 2017, the state installed special viewfinders in 12 places.","2017년, 그 주(州)는 12곳에 특별한 뷰파인더들을 설치했다."]],"w":"6번 문장은 특별한 뷰파인더를 12곳에 놓았다는 내용. install = 설치하다. 11번의 was installed(설치되었다)와 같은 단어임.","a":"2) 설치했다","c":2},"h":"fb11a5b10f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Tennessee hopes that more viewfinders will be available across the country.)","ko":"(테네시주는 전국에 걸쳐 더 많은 뷰파인더가 available하기를 바란다.)","opts":["위험한","비싼","특별한","이용할 수 있는"],"word":"available","r":{"ev":"12번 문장","s":[[12,"Tennessee hopes that more viewfinders will be available across the country.","테네시주는 전국에 걸쳐 더 많은 뷰파인더가 이용할 수 있게 되기를 바란다."]],"w":"12번 문장은 뷰파인더가 전국으로 늘어나 누구나 쓸 수 있게 되기를 바란다는 뜻. available = 이용할 수 있는. 비싼이나 위험한은 문맥에 맞지 않음.","a":"4) 이용할 수 있는","c":4},"h":"79f5ac777c"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThe state of Tennessee wanted to help them see the beautiful fall colors.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"테네시주는 그들이 아름다운 가을 색들을 보도록 돕고 싶었다.","opts":["테네시주의 주민들","12곳의 장소","색맹인 미국인들","가을 잎들"],"r":{"ev":"4~5번 문장","s":[[4,"There are over 13 million colorblind Americans.","1,300만 명 이상의 색맹인 미국인들이 있다."],[5,"The state of Tennessee wanted to help them see the beautiful fall colors.","테네시주는 그들이 아름다운 가을 색들을 보도록 돕고 싶었다."]],"w":"4번에서 1,300만 명 이상의 색맹인 미국인들을 말했고, 5번에서 테네시주가 그들(them)이 가을 색을 보도록 돕고 싶어 함. them은 색맹인 미국인들.","a":"3) 색맹인 미국인들","c":3},"h":"7d246c4490"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Imagine that they saw these colors for the first time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들이 처음으로 이 색들을 본다고 상상해 보라.","opts":["그들이 이 색들을 처음으로 볼 수 있게 된다면 어떨지 상상해 보라.","그들이 이 색들을 처음 보았던 때를 떠올려 보라.","그들이 이 색들을 이미 여러 번 보았다고 상상해 보라.","그들이 이 색들을 처음 본 뒤 크게 실망했다고 상상해 보라."],"r":{"ev":"1~2번 문장","s":[[1,"People with color blindness cannot experience the beautiful colors of fall leaves.","색맹이 있는 사람들은 가을 잎들의 아름다운 색들을 경험할 수 없다."],[2,"Imagine that they saw these colors for the first time.","그들이 처음으로 이 색들을 본다고 상상해 보라."]],"w":"1번에서 색맹인 사람들은 가을 색을 경험할 수 없다고 했으므로, 2번의 saw는 실제 과거가 아니라 '본다면 어떨까' 하는 상상임. 이미 보았다거나 실망했다는 말은 없음.","a":"1) 그들이 이 색들을 처음으로 볼 수 있게 된다면 어떨지 상상해 보라.","c":1},"h":"9547ce021e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Van Lew는 짧은 기간 동안만 색맹이었다.","테네시주는 2023년에 특별한 뷰파인더를 설치했다.","적록색맹은 흔한 유형이 아니다.","2023년에 버지니아주의 한 공원에 뷰파인더가 설치되었다."],"opts":["Van Lew was colorblind only for a short time.","Tennessee installed special viewfinders in 2023.","Red-green color blindness is not a common type.","A viewfinder was installed at a park in Virginia in 2023."],"r":{"ev":"6~8, 11번 문장","s":[[6,"In 2017, the state installed special viewfinders in 12 places.","2017년, 그 주(州)는 12곳에 특별한 뷰파인더들을 설치했다."],[7,"Red-green color blindness is the most common type, and these viewfinders help people see the difference between these colors more clearly.","적록색맹은 가장 흔한 유형인데, 이 뷰파인더들은 사람들이 이 색들의 차이를 더 분명하게 보도록 도와준다."],[8,"Van Lew, who has been colorblind her whole life, looked through one of these special viewfinders.","Van Lew는 평생 색맹이었는데, 그녀는 이 특별한 뷰파인더 중 하나를 통해 바라보았다."],[11,"Tennessee was the only state with colorblind viewfinders, but in 2023, a viewfinder was also installed at a park in Virginia.","테네시주는 색맹을 위한 뷰파인더들이 있는 유일한 주였지만, 2023년에는 버지니아주의 한 공원에도 뷰파인더가 설치되었다."]],"w":"11번 문장에 in 2023, a viewfinder was also installed at a park in Virginia가 나옴. ①은 8번(평생), ②는 6번(2017년), ③은 7번(가장 흔한 유형)과 어긋남.","a":"4) A viewfinder was installed at a park in Virginia in 2023.","c":4},"h":"9c78443f46"},{"n":9,"t":"sum","q":"Special viewfinders help people see the difference between red and green more (A). Van Lew saw yellows, oranges, and reds for the first time and called it the most (B) thing she had seen.","ko":"특별한 뷰파인더는 사람들이 빨간색과 초록색의 차이를 더 (A) 보도록 돕는다. Van Lew는 처음으로 노란색, 주황색, 빨간색을 보고 그것이 자신이 본 가장 (B) 것이라고 말했다.","oko":["(A) 분명하게 / (B) 무서운","(A) 분명하게 / (B) 아름다운","(A) 느리게 / (B) 아름다운","(A) 느리게 / (B) 무서운","(A) 드물게 / (B) 흔한"],"opts":["(A) clearly / (B) scary","(A) clearly / (B) beautiful","(A) slowly / (B) beautiful","(A) slowly / (B) scary","(A) rarely / (B) common"],"r":{"ev":"7, 9~10번 문장","s":[[7,"Red-green color blindness is the most common type, and these viewfinders help people see the difference between these colors more clearly.","적록색맹은 가장 흔한 유형인데, 이 뷰파인더들은 사람들이 이 색들의 차이를 더 분명하게 보도록 도와준다."],[9,"For the first time, she saw yellows, oranges, and reds.","처음으로, 그녀는 노란색, 주황색, 그리고 빨간색들을 보았다."],[10,"She said, “It’s the most beautiful thing I’ve ever seen in my life.”","그녀는 “그것은 제 인생에서 본 것 중 가장 아름다운 것이에요.”라고 말했다."]],"w":"7번 see the difference between these colors more clearly에서 (A)는 clearly(분명하게). 10번 It's the most beautiful thing I've ever seen에서 (B)는 beautiful(아름다운). scary(무서운)는 감동한 Van Lew의 말과 반대임.","a":"2) (A) clearly / (B) beautiful","c":2},"h":"f18c11bff3"},{"n":10,"t":"fill","q":"Tennessee was the only state with [A] viewfinders, but in 2023, a viewfinder was also installed at a park in [B].","ko":"테네시주는 [A] 뷰파인더가 있는 유일한 주였지만, 2023년에는 [B]의 한 공원에도 뷰파인더가 설치되었다.","bank":["colorblind","Virginia","install","imagine","experience","hope"],"bko":{"colorblind":"색맹인","Virginia":"버지니아주","install":"설치하다","imagine":"상상하다","experience":"경험하다","hope":"바라다"},"r":{"ev":"11번 문장","s":[[11,"Tennessee was the only state with colorblind viewfinders, but in 2023, a viewfinder was also installed at a park in Virginia.","테네시주는 색맹을 위한 뷰파인더들이 있는 유일한 주였지만, 2023년에는 버지니아주의 한 공원에도 뷰파인더가 설치되었다."]],"w":"11번 문장 the only state with colorblind viewfinders에서 [A]는 colorblind, a park in Virginia에서 [B]는 Virginia. install(설치하다), imagine(상상하다), experience(경험하다), hope(바라다)는 '뷰파인더를 꾸며 주는 말'이나 '장소 이름' 자리에 들어갈 수 없음.","a":"[A] colorblind, [B] Virginia","c":null},"h":"c6c2969271"}]},{"u":1,"id":"rg4-01-3","no":3,"ko":"깨져 버린 풍선 개, 그 작가는 누구?","items":[{"n":1,"t":"tf","q":"Jeff Koons has inspired many young artists.","ko":"Jeff Koons는 많은 젊은 예술가들에게 영감을 주었다.","r":{"ev":"3번 문장","s":[[3,"The artist behind this sculpture is Jeff Koons, who has inspired many young artists.","이 조각상의 작가는 Jeff Koons이며, 그는 많은 젊은 예술가들에게 영감을 주었다."]],"w":"3번 문장에 who has inspired many young artists가 나옴. who는 Jeff Koons를 가리키므로 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"f252f8a6e7"},{"n":2,"t":"tf","q":"Koons made a stainless steel rabbit in the 1970s.","ko":"Koons는 1970년대에 스테인리스 토끼를 만들었다.","r":{"ev":"8번 문장","s":[[8,"Koons also made a stainless steel rabbit, which is one of his most famous sculptures from the 1980s.","Koons는 또한 스테인리스로 된 토끼를 만들었는데, 그것은 1980년대 그의 가장 유명한 조각품 중 하나이다."]],"w":"8번 문장은 스테인리스 토끼가 1980년대의 가장 유명한 조각품 중 하나라고 함. 1970년대가 아니라 1980년대라서 틀린 내용.","a":"F (본문과 다른 내용)","c":"F"},"h":"59b9cd65d2"},{"n":3,"t":"tf","q":"After finishing art school, Koons worked at the Museum of Modern Art.","ko":"예술학교를 마친 후, Koons는 현대 미술관에서 일했다.","r":{"ev":"5번 문장","s":[[5,"After finishing art school in 1976, he moved to New York and worked at the Museum of Modern Art.","1976년 예술학교를 졸업한 후, 그는 뉴욕으로 이사하여 현대 미술관에서 일했다."]],"w":"5번 문장에 After finishing art school in 1976, he moved to New York and worked at the Museum of Modern Art가 나옴. 졸업 후 일했다는 순서가 맞음.","a":"T (본문과 맞는 내용)","c":"T"},"h":"fc7c929372"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A famous sculpture … was accidentally broken by a visitor.)","ko":"(유명한 조각상이 방문객에 의해 accidentally 깨졌다.)","opts":["일부러","실수로","천천히","조용히"],"word":"accidentally","r":{"ev":"1번 문장","s":[[1,"A famous sculpture titled “Balloon Dog (Blue)” was accidentally broken by a visitor.","‘Balloon Dog (Blue)’라는 제목의 유명한 조각상이 방문객에 의해 실수로 깨졌다."]],"w":"1번 문장에서 방문객이 조각상을 깨뜨렸는데, 2번에서 풍선이 아니라고 놀라는 분위기임. 일부러 깬 것이 아니라 실수로 깬 것이라서 accidentally = 실수로.","a":"2) 실수로","c":2},"h":"742cbc3ac9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…this makes people see their reflection and think about themselves.)","ko":"(…이는 사람들이 자신의 reflection을 보고 스스로에 대해 생각하게 한다.)","opts":["높이","가격","거울에 비친 모습","재료"],"word":"reflection","r":{"ev":"10번 문장","s":[[10,"The shiny surface of his “Rabbit” acts like a mirror, so this makes people see their reflection and think about themselves.","그의 작품 ‘Rabbit’의 반짝이는 표면은 거울처럼 작용해서, 이는 사람들이 자신의 모습을 보고 스스로에 대해 생각하게 한다."]],"w":"10번 문장에서 Rabbit의 표면이 acts like a mirror(거울처럼 작용한다)라고 했으니 사람들이 보게 되는 것은 거울에 비친 모습. reflection = (거울에 비친) 모습.","a":"3) 거울에 비친 모습","c":3},"h":"a6864c035b"},{"n":6,"t":"ref","q":"What does the underlined \"who\" refer to?\nThe artist behind this sculpture is Jeff Koons, who has inspired many young artists.","ko":"밑줄 친 who이(가) 가리키는 것은?","sko":"이 조각상의 작가는 Jeff Koons이며, 그는 많은 젊은 예술가들에게 영감을 주었다.","opts":["Jeff Koons","풍선 개 조각상","방문객","젊은 예술가들"],"r":{"ev":"3번 문장","s":[[3,"The artist behind this sculpture is Jeff Koons, who has inspired many young artists.","이 조각상의 작가는 Jeff Koons이며, 그는 많은 젊은 예술가들에게 영감을 주었다."]],"w":"3번 문장에서 콤마 앞이 Jeff Koons이고 who는 그를 설명함. 영감을 준 사람은 작가인 Jeff Koons이고, 영감을 받은 쪽이 젊은 예술가들임.","a":"1) Jeff Koons","c":1},"h":"8bff55f818"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The shiny surface of his “Rabbit” acts like a mirror, so this makes people see their reflection and think about themselves.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그의 작품 ‘Rabbit’의 반짝이는 표면은 거울처럼 작용해서, 이는 사람들이 자신의 모습을 보고 스스로에 대해 생각하게 한다.","opts":["‘Rabbit’의 표면은 거울로 만들어져서 사람들이 쉽게 깨뜨린다.","‘Rabbit’은 거울을 닮은 토끼 모양이라서 사람들이 웃게 된다.","‘Rabbit’은 거울 뒤에 있어서 사람들이 자신의 모습을 볼 수 없다.","‘Rabbit’의 반짝이는 표면이 거울처럼 사람들의 모습을 비춰 스스로를 돌아보게 한다."],"r":{"ev":"10번 문장","s":[[10,"The shiny surface of his “Rabbit” acts like a mirror, so this makes people see their reflection and think about themselves.","그의 작품 ‘Rabbit’의 반짝이는 표면은 거울처럼 작용해서, 이는 사람들이 자신의 모습을 보고 스스로에 대해 생각하게 한다."]],"w":"acts like a mirror는 '거울처럼 작용한다'는 뜻이고, so this makes people see their reflection and think about themselves는 그래서 자신의 모습을 보고 스스로에 대해 생각하게 한다는 뜻. 깨진다거나 웃는다는 말은 없음.","a":"4) ‘Rabbit’의 반짝이는 표면이 거울처럼 사람들의 모습을 비춰 스스로를 돌아보게 한다.","c":4},"h":"bd013a1cc4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["Koons는 예술학교를 마치기 전에 뉴욕으로 이사했다.","‘Rabbit’은 풍선으로 만들어졌다.","Koons는 예술이 사람들을 행복하게 하고 하나로 모아야 한다고 믿었다.","‘Balloon Dog (Blue)’는 9천110만 달러에 팔렸다."],"opts":["Koons moved to New York before finishing art school.","The “Rabbit” is made of balloons.","Koons believed that art should make people happy and bring them together.","“Balloon Dog (Blue)” was sold for $91.1 million."],"r":{"ev":"5, 7~8, 11번 문장","s":[[5,"After finishing art school in 1976, he moved to New York and worked at the Museum of Modern Art.","1976년 예술학교를 졸업한 후, 그는 뉴욕으로 이사하여 현대 미술관에서 일했다."],[7,"He believed that art should make people happy and bring them together.","그는 예술은 사람들을 행복하게 만들어야 하고 또 그들을 하나로 모아야 한다고 믿었다."],[8,"Koons also made a stainless steel rabbit, which is one of his most famous sculptures from the 1980s.","Koons는 또한 스테인리스로 된 토끼를 만들었는데, 그것은 1980년대 그의 가장 유명한 조각품 중 하나이다."],[11,"It has become one of the most famous works of 20th-century art, and was sold for $91.1 million!","그것은 20세기 예술의 가장 유명한 작품들 중 하나가 되었고, 9천110만 달러에 팔렸다!"]],"w":"7번 문장에 그가 믿은 내용이 그대로 나옴. ①은 5번(졸업 후 이사), ②는 8번(스테인리스), ④는 11번(9천110만 달러에 팔린 것은 ‘Rabbit’)과 어긋남.","a":"3) Koons believed that art should make people happy and bring them together.","c":3},"h":"6b8f606358"},{"n":9,"t":"sum","q":"Koons used (A) things like toys and balloons in his art because he believed art should make people (B).","ko":"Koons는 예술이 사람들을 (B)하게 만들어야 한다고 믿었기 때문에 장난감과 풍선 같은 (A) 것들을 작품에 사용했다.","oko":["(A) 드문 / (B) 행복한","(A) 일상적인 / (B) 화난","(A) 값비싼 / (B) 조용한","(A) 깨진 / (B) 외로운","(A) 일상적인 / (B) 행복한"],"opts":["(A) rare / (B) happy","(A) everyday / (B) angry","(A) expensive / (B) quiet","(A) broken / (B) lonely","(A) everyday / (B) happy"],"r":{"ev":"4, 6~7번 문장","s":[[4,"He likes to use everyday things in his art, such as toys and vacuum cleaners.","그는 장난감과 진공청소기와 같은 일상적인 것들을 그의 작품에 사용하는 것을 좋아한다."],[6,"His art during this time was fun and used things like balloons.","이 시기의 그의 작품은 재미있었고 풍선과 같은 것들을 사용했다."],[7,"He believed that art should make people happy and bring them together.","그는 예술은 사람들을 행복하게 만들어야 하고 또 그들을 하나로 모아야 한다고 믿었다."]],"w":"4번 문장 likes to use everyday things에서 (A)는 everyday(일상적인). 7번 art should make people happy에서 (B)는 happy(행복한). rare, angry 등은 본문과 반대되거나 나오지 않는 말.","a":"5) (A) everyday / (B) happy","c":5},"h":"0a4e4e7432"},{"n":10,"t":"fill","q":"The shiny surface of the “Rabbit” works like a [A], and it has become one of the most [B] works of 20th-century art.","ko":"‘Rabbit’의 반짝이는 표면은 [A]처럼 작용하고, 그것은 20세기 예술의 가장 [B] 작품들 중 하나가 되었다.","bank":["mirror","famous","inspire","believe","move","sell"],"bko":{"mirror":"거울","famous":"유명한","inspire":"영감을 주다","believe":"믿다","move":"이사하다","sell":"팔다"},"r":{"ev":"10~11번 문장","s":[[10,"The shiny surface of his “Rabbit” acts like a mirror, so this makes people see their reflection and think about themselves.","그의 작품 ‘Rabbit’의 반짝이는 표면은 거울처럼 작용해서, 이는 사람들이 자신의 모습을 보고 스스로에 대해 생각하게 한다."],[11,"It has become one of the most famous works of 20th-century art, and was sold for $91.1 million!","그것은 20세기 예술의 가장 유명한 작품들 중 하나가 되었고, 9천110만 달러에 팔렸다!"]],"w":"10번 acts like a mirror에서 [A]는 mirror, 11번 one of the most famous works of 20th-century art에서 [B]는 famous. inspire(영감을 주다), believe(믿다), move(이사하다), sell(팔다)은 동사라서 'a ___'나 'most ___ works' 자리에 들어갈 수 없음.","a":"[A] mirror, [B] famous","c":null},"h":"5c1221f186"}]},{"u":2,"id":"rg4-02-1","no":1,"ko":"쓰레기통 닭이 호주를 구한다고?","items":[{"n":1,"t":"tf","q":"People nicknamed the white ibis the “bin chicken.”","ko":"사람들은 흰따오기에게 ‘쓰레기통 닭’이라는 별명을 붙였다.","r":{"ev":"2번 문장","s":[[2,"People nicknamed them the “bin chicken,” because they search trash cans for food or even snatch food from people’s hands.","사람들은 그 새들이 쓰레기통을 뒤져 음식을 찾거나 심지어 사람들의 손에서 음식을 채 가기 때문에 ‘쓰레기통 닭’이라는 별명을 붙였다."]],"w":"2번 문장에 People nicknamed them the “bin chicken”이 나옴. them은 1번의 흰따오기들이라서 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"60657a98fc"},{"n":2,"t":"tf","q":"Cane toads were introduced to Australia in the 1950s.","ko":"수수두꺼비는 1950년대에 호주로 들여왔다.","r":{"ev":"4번 문장","s":[[4,"Cane toads were introduced to Australia in the 1930s.","수수두꺼비는 1930년대에 호주로 들여왔다."]],"w":"4번 문장은 수수두꺼비가 in the 1930s(1930년대)에 들어왔다고 함. 1950년대는 틀림.","a":"F (본문과 다른 내용)","c":"F"},"h":"915f801076"},{"n":3,"t":"tf","q":"Cane toads had no natural enemies in Australia.","ko":"수수두꺼비는 호주에 천적이 없었다.","r":{"ev":"8번 문장","s":[[8,"They became a threat to native wildlife because they had no natural enemies in Australia.","그것들은 호주에 천적이 없었기 때문에 토착 야생 생물에 위협이 되었다."]],"w":"8번 문장 because they had no natural enemies in Australia가 그대로 나옴. 천적이 없어서 토종 생물에게 위협이 되었다는 내용과 맞음.","a":"T (본문과 맞는 내용)","c":"T"},"h":"e697bfbed5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…their strong poison could kill most native animals that eat frogs and toads.)","ko":"(…그것들의 강한 독은 개구리와 두꺼비를 먹는 대부분의 native 동물을 죽일 수 있었다.)","opts":["토종의","외국의","작은","귀여운"],"word":"native","r":{"ev":"7번 문장","s":[[7,"Moreover, their strong poison could kill most native animals that eat frogs and toads.","게다가, 그것들의 강한 독은 개구리와 두꺼비를 잡아먹는 대부분의 토착 동물을 죽일 수 있었다."]],"w":"7번 문장에서 두꺼비의 독은 개구리와 두꺼비를 잡아먹는 native 동물을 죽일 수 있다고 함. 원래 호주에 살던 동물들이라서 native = 토종의. 외국에서 들어온 쪽은 수수두꺼비임.","a":"1) 토종의","c":1},"h":"473b63e602"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…causing the toads to release their poison.)","ko":"(…두꺼비가 독을 release하게 한다.)","opts":["삼키다","내보내다","만들다","숨기다"],"word":"release","r":{"ev":"10번 문장","s":[[10,"The ibises flip the toads into the air, causing the toads to release their poison.","흰따오기는 두꺼비를 공중으로 툭 던져 뒤집어, 두꺼비가 독을 내보내게 한다."]],"w":"10번 문장은 두꺼비를 공중으로 던져 뒤집으면 두꺼비가 독을 몸 밖으로 내보낸다는 내용. release = 내보내다, 방출하다. 그래야 11번에서 안전하게 씻어 먹을 수 있음.","a":"2) 내보내다","c":2},"h":"e371be6d5d"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey then wash them in water before eating.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"그다음 흰따오기는 먹기 전에 그것들을 물에 씻어낸다.","opts":["흰따오기들","딱정벌레들","수수두꺼비들","쓰레기통들"],"r":{"ev":"10~11번 문장","s":[[10,"The ibises flip the toads into the air, causing the toads to release their poison.","흰따오기는 두꺼비를 공중으로 툭 던져 뒤집어, 두꺼비가 독을 내보내게 한다."],[11,"They then wash them in water before eating.","그다음 흰따오기는 먹기 전에 그것들을 물에 씻어낸다."]],"w":"10번에서 흰따오기가 두꺼비를 던져 독을 내보내게 하고, 11번에서 They(흰따오기)가 them을 물에 씻음. them은 독을 뺀 수수두꺼비들.","a":"3) 수수두꺼비들","c":3},"h":"e5e04a66f6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In fact, each cane toad that a white ibis eats prevents the birth of about 70,000 new toads in a year!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사실, 흰따오기가 잡아먹는 각각의 수수두꺼비는 일 년에 약 7만 마리의 새로운 두꺼비가 태어나는 것을 막는다!","opts":["흰따오기는 하루에 약 7만 마리의 두꺼비를 잡아먹는다.","두꺼비 한 마리가 일 년에 약 7만 마리의 새끼를 낳아 흰따오기가 줄었다.","약 7만 마리의 흰따오기가 두꺼비를 먹어서 두꺼비가 사라졌다.","흰따오기가 잡아먹는 두꺼비 한 마리마다 일 년에 약 7만 마리의 새로운 두꺼비가 태어나는 것을 막는다."],"r":{"ev":"13번 문장","s":[[13,"In fact, each cane toad that a white ibis eats prevents the birth of about 70,000 new toads in a year!","사실, 흰따오기가 잡아먹는 각각의 수수두꺼비는 일 년에 약 7만 마리의 새로운 두꺼비가 태어나는 것을 막는다!"]],"w":"each cane toad that a white ibis eats는 흰따오기가 먹는 각각의 두꺼비, prevents the birth of about 70,000 new toads in a year는 일 년에 약 7만 마리의 새 두꺼비가 태어나는 것을 막는다는 뜻.","a":"4) 흰따오기가 잡아먹는 두꺼비 한 마리마다 일 년에 약 7만 마리의 새로운 두꺼비가 태어나는 것을 막는다.","c":4},"h":"dda56e3d37"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["흰따오기들은 수수두꺼비가 빠르게 퍼지는 것을 돕고 있다.","수수두꺼비는 농작물에 피해를 주는 딱정벌레를 통제하기 위해 호주에 들여왔다.","수수두꺼비는 호주에 천적이 많았다.","흰따오기는 두꺼비를 먹은 후에 물에 씻는다."],"opts":["White ibises are helping cane toads spread rapidly.","Cane toads were introduced to Australia to control beetles damaging crops.","Cane toads had many natural enemies in Australia.","The white ibis washes the toads in water after eating them."],"r":{"ev":"4~5, 8, 11~12번 문장","s":[[4,"Cane toads were introduced to Australia in the 1930s.","수수두꺼비는 1930년대에 호주로 들여왔다."],[5,"Farmers thought they would help control beetles damaging their crops.","농부들은 농작물에 피해를 주는 딱정벌레를 통제하는 데 그것들이 도움이 될 것으로 생각했다."],[8,"They became a threat to native wildlife because they had no natural enemies in Australia.","그것들은 호주에 천적이 없었기 때문에 토착 야생 생물에 위협이 되었다."],[11,"They then wash them in water before eating.","그다음 흰따오기는 먹기 전에 그것들을 물에 씻어낸다."],[12,"This way, they’re helping control the number of cane toads.","이런 방식으로, 그들은 수수두꺼비의 수를 조절하는 데 도움을 주고 있다."]],"w":"4~5번에서 농부들이 딱정벌레를 통제하려고 두꺼비를 들여왔다고 함. ①은 12번(수를 조절하는 중), ③은 8번(천적이 없음), ④는 11번(먹기 전에 씻음)과 어긋남.","a":"2) Cane toads were introduced to Australia to control beetles damaging crops.","c":2},"h":"c733b7bc6f"},{"n":9,"t":"sum","q":"The ibises flip the toads into the air to make them release their (A), and then (B) them in water before eating.","ko":"흰따오기는 두꺼비를 공중에 던져 (A)을 내보내게 하고, 먹기 전에 물에 (B).","oko":["(A) 음식 / (B) 씻는다","(A) 독 / (B) 숨긴다","(A) 알 / (B) 숨긴다","(A) 음식 / (B) 숨긴다","(A) 독 / (B) 씻는다"],"opts":["(A) food / (B) wash","(A) poison / (B) hide","(A) eggs / (B) hide","(A) food / (B) hide","(A) poison / (B) wash"],"r":{"ev":"10~11번 문장","s":[[10,"The ibises flip the toads into the air, causing the toads to release their poison.","흰따오기는 두꺼비를 공중으로 툭 던져 뒤집어, 두꺼비가 독을 내보내게 한다."],[11,"They then wash them in water before eating.","그다음 흰따오기는 먹기 전에 그것들을 물에 씻어낸다."]],"w":"10번 causing the toads to release their poison에서 (A)는 poison(독). 11번 They then wash them in water before eating에서 (B)는 wash(씻다). food나 eggs를 내보낸다는 말은 없음.","a":"5) (A) poison / (B) wash","c":5},"h":"a8332ce6c4"},{"n":10,"t":"fill","q":"In fact, each cane toad that a white ibis eats [A] the birth of about 70,000 new toads in a year, so the ibises help [B] the number of cane toads.","ko":"사실, 흰따오기가 잡아먹는 각각의 수수두꺼비는 일 년에 약 7만 마리의 새로운 두꺼비가 태어나는 것을 [A], 그래서 흰따오기는 수수두꺼비의 수를 [B] 데 도움을 준다.","bank":["prevents","control","damages","spreads","releases","consumes"],"bko":{"prevents":"막다","control":"조절하다","damages":"피해를 주다","spreads":"퍼뜨리다","releases":"내보내다","consumes":"먹어 치우다"},"r":{"ev":"12~13번 문장","s":[[12,"This way, they’re helping control the number of cane toads.","이런 방식으로, 그들은 수수두꺼비의 수를 조절하는 데 도움을 주고 있다."],[13,"In fact, each cane toad that a white ibis eats prevents the birth of about 70,000 new toads in a year!","사실, 흰따오기가 잡아먹는 각각의 수수두꺼비는 일 년에 약 7만 마리의 새로운 두꺼비가 태어나는 것을 막는다!"]],"w":"13번 each cane toad ... prevents the birth of about 70,000 new toads에서 [A]는 prevents(막다). 12번 helping control the number of cane toads에서 [B]는 control(조절하다). damages, spreads는 오히려 6~7번에서 두꺼비가 한 일이라 반대 방향임.","a":"[A] prevents, [B] control","c":null},"h":"20720810de"}]},{"u":2,"id":"rg4-02-2","no":2,"ko":"16세기 여성들은 왜 가면을 썼을까?","items":[{"n":1,"t":"tf","q":"In 16th century Europe, wealthy women wore masks to protect their skin from the sun.","ko":"16세기 유럽에서 부유한 여성들은 태양으로부터 피부를 보호하기 위해 가면을 썼다.","r":{"ev":"3번 문장","s":[[3,"For example, in 16th century Europe, wealthy women wore masks to protect their skin from the sun.","예를 들어, 16세기 유럽에서는 부유한 여성들이 태양으로부터 그들의 피부를 보호하기 위해 가면을 썼다."]],"w":"3번 문장에 in 16th century Europe, wealthy women wore masks to protect their skin from the sun이 그대로 나옴. 시대, 사람, 이유가 모두 맞음.","a":"T (본문과 맞는 내용)","c":"T"},"h":"b28d5a0564"},{"n":2,"t":"tf","q":"The first masks were made of black velvet and covered the whole face.","ko":"최초의 가면은 검은색 벨벳으로 만들어졌고 얼굴 전체를 가렸다.","r":{"ev":"7번 문장","s":[[7,"The first masks were made of black velvet and covered the top half of the face.","최초의 가면은 검은색 벨벳으로 만들어졌고 얼굴 윗부분 반을 가렸다."]],"w":"7번 문장에서 최초의 가면은 검은색 벨벳이고 covered the top half of the face(얼굴 윗부분 반)를 가렸음. 얼굴 전체를 가린 것은 8번의 vizard임.","a":"F (본문과 다른 내용)","c":"F"},"h":"61793e96b4"},{"n":3,"t":"tf","q":"Masks allowed women to visit places like the market or church without a man.","ko":"가면은 여성들이 시장이나 교회 같은 장소에 남자 없이 방문하도록 해 주었다.","r":{"ev":"10번 문장","s":[[10,"Masks also allowed women to visit places like the market or church without a man.","가면은 또한 여성들이 시장이나 교회 같은 장소에 남자 없이 방문하도록 해 주었다."]],"w":"10번 문장에 Masks also allowed women to visit places like the market or church without a man이 그대로 나옴. 남자 없이 다닐 수 있게 해 주었다는 내용과 일치.","a":"T (본문과 맞는 내용)","c":"T"},"h":"558fc30099"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It showed that one didn't work outside like a commoner.)","ko":"(그것은 그 사람이 commoner처럼 밖에서 일하지 않는다는 것을 보여 주었다.)","opts":["왕족","평민","귀족","군인"],"word":"commoner","r":{"ev":"5번 문장","s":[[5,"It showed that one didn’t work outside like a commoner.","그것은 그 사람이 평민처럼 밖에서 일하지 않는다는 것을 보여주었다."]],"w":"4번에서 창백한 피부는 높은 지위의 상징이었고, 5번은 높은 지위의 사람은 밖에서 일하지 않는다는 뜻. 그러니 밖에서 일하는 commoner는 높은 지위가 아닌 평민임.","a":"2) 평민","c":2},"h":"1743c59f58"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In London and Paris, stylish women started wearing masks.)","ko":"(런던과 파리에서, stylish한 여성들이 가면을 쓰기 시작했다.)","opts":["게으른","가난한","수줍은","유행을 따르는"],"word":"stylish","r":{"ev":"6번 문장","s":[[6,"In London and Paris, stylish women started wearing masks.","런던과 파리에서, 유행을 따르는 여성들이 가면을 쓰기 시작했다."]],"w":"2번에서 가면 쓰기가 유행이 되었다고 했고, 6번에서 가면을 쓰기 시작한 여성들이 stylish. 멋과 유행을 따르는 여성들이라서 stylish = 유행을 따르는, 멋진.","a":"4) 유행을 따르는","c":4},"h":"e1b96b4ef1"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWomen wore these masks while they were traveling on horseback.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"여성들은 말을 타고 이동하는 동안 이 가면들을 썼다.","opts":["말들","가면들","여성들","평민들"],"r":{"ev":"9번 문장","s":[[9,"Women wore these masks while they were traveling on horseback.","여성들은 말을 타고 이동하는 동안 이 가면들을 썼다."]],"w":"9번 문장 Women wore these masks while they were traveling에서 they는 앞의 주어 Women. 말을 타고 이동하는 사람은 가면을 쓴 여성들임.","a":"3) 여성들","c":3},"h":"bbf16e43ec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without a mask, a woman going out alone might have caused rumors.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"가면이 없었다면, 혼자 외출하는 여성은 소문을 일으켰을지도 모른다.","opts":["가면 없이 혼자 외출하는 여성은 소문의 대상이 되었을지도 모른다.","가면을 쓴 여성이 혼자 외출해서 소문을 퍼뜨렸다.","가면이 없던 여성들은 소문 때문에 외출하지 않았다.","혼자 외출하는 여성들이 소문을 일으켜서 가면이 생겨났다."],"r":{"ev":"10~11번 문장","s":[[10,"Masks also allowed women to visit places like the market or church without a man.","가면은 또한 여성들이 시장이나 교회 같은 장소에 남자 없이 방문하도록 해 주었다."],[11,"Without a mask, a woman going out alone might have caused rumors.","가면이 없었다면, 혼자 외출하는 여성은 소문을 일으켰을지도 모른다."]],"w":"Without a mask는 '가면이 없었다면', might have caused rumors는 '소문을 일으켰을지도 모른다'는 추측. 10번에서 가면 덕분에 남자 없이 다녔다고 했으니, 가면 없이 혼자 다니면 소문이 났을 수 있다는 뜻.","a":"1) 가면 없이 혼자 외출하는 여성은 소문의 대상이 되었을지도 모른다.","c":1},"h":"b85f0804be"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문의 내용과 일치하는 것은?","oko":["창백한 피부는 낮은 지위의 상징이었다.","vizard는 얼굴의 윗부분 반만 가렸다.","여성들은 말을 타고 이동하는 동안 가면을 썼다.","가면은 여성들에게 더 적은 자유를 주었다."],"opts":["Pale skin was a symbol of low status.","The vizard covered only the top half of the face.","Women wore masks while they were traveling on horseback.","Masks gave women less freedom."],"r":{"ev":"4, 8~9, 12번 문장","s":[[4,"During this period, having pale skin was a symbol of high status.","이 시대에는 창백한 피부를 지닌 것이 높은 지위의 상징이었다."],[8,"Another mask, which was called a vizard, covered the whole face with a space for the nose and small holes for the eyes.","또 다른 가면은 vizard라고 불렸는데, 그것은 코를 위한 공간과 눈을 위한 작은 구멍이 있으면서 얼굴 전체를 덮었다."],[9,"Women wore these masks while they were traveling on horseback.","여성들은 말을 타고 이동하는 동안 이 가면들을 썼다."],[12,"Masks not only gave women more freedom but also made them mysterious by hiding their faces.","가면은 여성에게 더 많은 자유를 주었을 뿐만 아니라 얼굴을 숨김으로써 그들을 신비롭게 만들었다."]],"w":"9번 문장에 Women wore these masks while they were traveling on horseback이 나옴. ①은 4번(높은 지위), ②는 8번(얼굴 전체), ④는 12번(더 많은 자유)과 어긋남.","a":"3) Women wore masks while they were traveling on horseback.","c":3},"h":"cc783cba83"},{"n":9,"t":"sum","q":"In 16th century Europe, wealthy women wore masks to keep their skin (A), because pale skin was a symbol of high (B).","ko":"16세기 유럽에서 부유한 여성들은 피부를 (A) 유지하려고 가면을 썼는데, 창백한 피부가 높은 (B)의 상징이었기 때문이다.","oko":["(A) 어둡게 / (B) 지위","(A) 하얗게 / (B) 유행","(A) 어둡게 / (B) 유행","(A) 거칠게 / (B) 지위","(A) 하얗게 / (B) 지위"],"opts":["(A) dark / (B) status","(A) pale / (B) trend","(A) dark / (B) trend","(A) rough / (B) status","(A) pale / (B) status"],"r":{"ev":"3~4번 문장","s":[[3,"For example, in 16th century Europe, wealthy women wore masks to protect their skin from the sun.","예를 들어, 16세기 유럽에서는 부유한 여성들이 태양으로부터 그들의 피부를 보호하기 위해 가면을 썼다."],[4,"During this period, having pale skin was a symbol of high status.","이 시대에는 창백한 피부를 지닌 것이 높은 지위의 상징이었다."]],"w":"3번에서 태양으로부터 피부를 보호하려고 가면을 썼고, 4번에서 pale skin(창백한·하얀 피부)이 high status(높은 지위)의 상징이었음. 그래서 (A)는 pale, (B)는 status.","a":"5) (A) pale / (B) status","c":5},"h":"0df7a3b0eb"},{"n":10,"t":"fill","q":"Masks not only gave women more [A] but also made them [B] by hiding their faces.","ko":"가면은 여성에게 더 많은 [A]를 주었을 뿐만 아니라 얼굴을 숨김으로써 그들을 [B] 만들었다.","bank":["freedom","mysterious","wore","visit","protect","cover"],"bko":{"freedom":"자유","mysterious":"신비로운","wore":"썼다(wear 입다·쓰다)","visit":"방문하다","protect":"보호하다","cover":"덮다"},"r":{"ev":"12번 문장","s":[[12,"Masks not only gave women more freedom but also made them mysterious by hiding their faces.","가면은 여성에게 더 많은 자유를 주었을 뿐만 아니라 얼굴을 숨김으로써 그들을 신비롭게 만들었다."]],"w":"12번 문장 Masks not only gave women more freedom but also made them mysterious에서 [A]는 freedom, [B]는 mysterious. wore(wear 쓰다), visit(방문하다), protect(보호하다), cover(덮다)는 동사라서 'more ___'나 'made them ___' 자리에 들어갈 수 없음.","a":"[A] freedom, [B] mysterious","c":null},"h":"b290645f06"}]},{"u":2,"id":"rg4-02-3","no":3,"ko":"모네의 몽환적인 그림, 비밀은 대기오염?","items":[{"n":1,"t":"tf","q":"The study looked at over 100 paintings by Monet and William Turner.","ko":"그 연구는 모네와 윌리엄 터너의 그림 100점 이상을 살펴보았다.","r":{"ev":"2번 문장","s":[[2,"The study looked at over 100 paintings by Monet and another painter named William Turner.","그 연구는 모네와 윌리엄 터너라는 이름의 또 다른 화가가 그린 100점 이상의 그림을 살펴보았다."]],"w":"2번 문장에 The study looked at over 100 paintings by Monet and another painter named William Turner가 나옴. 그림 수와 화가가 맞는 내용.","a":"T (본문과 맞는 내용)","c":"T"},"h":"fe4b02f0f9"},{"n":2,"t":"tf","q":"Monet and Turner painted when the air was very clean.","ko":"모네와 터너는 공기가 매우 깨끗했을 때 그림을 그렸다.","r":{"ev":"3번 문장","s":[[3,"They painted during a time when factories released a lot of smoke.","그들은 공장들이 많은 매연을 방출했던 시기에 그림을 그렸다."]],"w":"3번 문장은 They painted during a time when factories released a lot of smoke, 즉 공장이 연기를 많이 내뿜던 시기에 그렸다고 함. 깨끗한 공기와 반대.","a":"F (본문과 다른 내용)","c":"F"},"h":"a5c1c36396"},{"n":3,"t":"tf","q":"Monet wrote a letter to his wife about the sky in London.","ko":"모네는 아내에게 런던의 하늘에 대한 편지를 썼다.","r":{"ev":"8번 문장","s":[[8,"In a letter to his wife, Monet wrote, “I was very worried in the morning because I saw no fog, just clear blue sky in London.","그의 아내에게 보낸 편지에서 모네는 이렇게 썼다. “런던에 안개는 보이지 않고 맑고 푸른 하늘만 보여서 아침에 매우 걱정이 되었어요."]],"w":"8번 문장 In a letter to his wife, Monet wrote에 이어, 런던에 안개가 없고 맑은 하늘만 보여 걱정된다는 하늘 이야기가 나옴.","a":"T (본문과 맞는 내용)","c":"T"},"h":"657b7cdb38"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…to make their beautiful, dreamy paintings.)","ko":"(…그들의 아름답고 dreamy한 그림을 그리려고.)","opts":["차가운","몽환적인","시끄러운","단순한"],"word":"dreamy","r":{"ev":"1, 4번 문장","s":[[1,"A new study says that air pollution might have inspired famous painters like Claude Monet to make their beautiful, dreamy paintings.","한 새로운 연구는 대기오염이 클로드 모네와 같은 유명한 화가들이 그들의 아름답고 몽환적인 그림을 그리도록 영감을 주었을지도 모른다고 말한다."],[4,"Researchers thought that the dirty air inspired their paintings to look foggy and dreamy.","연구원들은 더러운 공기가 그들의 그림이 안개가 끼고 몽환적으로 보이도록 영감을 주었다고 생각했다."]],"w":"4번에서 더러운 공기 때문에 그림이 foggy and dreamy(안개가 끼고 몽환적으로) 보인다고 함. 안개 낀 듯 꿈속 같은 느낌이라서 dreamy = 몽환적인.","a":"2) 몽환적인","c":2},"h":"0a1f6d82f6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This suggests that the dirty air might have influenced the special look of these famous paintings.)","ko":"(이것은 더러운 공기가 이 유명한 그림들의 특별한 모습에 influenced했을지도 모른다는 것을 시사한다.)","opts":["지웠다","가렸다","영향을 미쳤다","팔았다"],"word":"influenced","r":{"ev":"6번 문장","s":[[6,"This suggests that the dirty air might have influenced the special look of these famous paintings.","이것은 더러운 공기가 이 유명한 그림들의 특별한 모습에 영향을 미쳤을지도 모른다는 것을 시사한다."]],"w":"5번에서 그림이 대기오염 수준과 일치한다고 발견했고, 6번은 그래서 공기가 그림의 모습에 영향을 주었을지도 모른다는 시사. influence = 영향을 주다.","a":"3) 영향을 미쳤다","c":3},"h":"1863d95843"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey found that the paintings matched the air pollution levels at the time.","ko":"밑줄 친 They이(가) 가리키는 것은?","sko":"그들은 그림들이 그 당시 대기오염 수준과 일치한다는 것을 발견했다.","opts":["공장들","모네와 터너","화가의 아내","연구원들"],"r":{"ev":"4~5번 문장","s":[[4,"Researchers thought that the dirty air inspired their paintings to look foggy and dreamy.","연구원들은 더러운 공기가 그들의 그림이 안개가 끼고 몽환적으로 보이도록 영감을 주었다고 생각했다."],[5,"They found that the paintings matched the air pollution levels at the time.","그들은 그림들이 그 당시 대기오염 수준과 일치한다는 것을 발견했다."]],"w":"4번에서 Researchers thought라고 했고, 5번 They found는 그 연구원들이 발견했다는 뜻. 3번의 They는 모네와 터너지만 5번의 They는 연구원들임.","a":"4) 연구원들","c":4},"h":"5a25413344"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This suggests that the dirty air might have influenced the special look of these famous paintings.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 더러운 공기가 이 유명한 그림들의 특별한 모습에 영향을 미쳤을지도 모른다는 것을 시사한다.","opts":["이것은 더러운 공기가 이 유명한 그림들의 특별한 모습에 영향을 미쳤을지도 모른다는 것을 보여 준다.","이것은 더러운 공기가 그림을 물감처럼 칠하게 했다는 사실을 증명한다.","이것은 이 유명한 그림들이 더러운 공기를 없애려고 그려졌음을 보여 준다.","이것은 화가들이 깨끗한 공기 덕분에 특별한 그림을 그렸음을 보여 준다."],"r":{"ev":"5~6번 문장","s":[[5,"They found that the paintings matched the air pollution levels at the time.","그들은 그림들이 그 당시 대기오염 수준과 일치한다는 것을 발견했다."],[6,"This suggests that the dirty air might have influenced the  provided blood samples before and after their missions.","우주 비행사들은 임무 전후에 혈액 표본을 제공했다."],[7,"The researchers found changes in all 14 astronauts they studied.","연구원들은 그들이 연구했던 14명의 우주 비행사 모두에게서 변화를 발견했다."],[8,"Professor David Goukassian said, “Space can cause changes in astronauts’ DNA because of its extreme conditions, including space radiation.","David Goukassian 교수는 말했다. “우주는 우주 방사선을 포함한 극한의 환경 때문에 우주 비행사들의 DNA에 변화를 일으킬 수 있습니다."],[11,"Several nations are working on sending astronauts to Mars, and other countries are preparing to build bases on the moon.","몇몇 국가들은 우주 비행사들을 화성에 보내는 데 착수 중이며, 다른 국가들은 달에 기지를 건설하는 것을 준비 중이다."]],"w":"11번 문장에 other countries are preparing to build bases on the moon이 나옴. ①은 7번(14명 모두), ②는 5번(임무 전후), ③은 8번(변화를 일으킬 수 있음)과 어긋남.","a":"4) Other countries are preparing to build bases on the moon.","c":4},"h":"7572b8ad87"},{"n":9,"t":"sum","q":"In space, our DNA can (A), and this might (B) the chances of getting cancer.","ko":"우주에서 우리의 DNA는 (A)할 수 있고, 이것은 암에 걸릴 가능성을 (B)시킬지도 모른다.","oko":["(A) 변하다 / (B) 감소","(A) 사라지다 / (B) 증가","(A) 사라지다 / (B) 감소","(A) 얼다 / (B) 증가","(A) 변하다 / (B) 증가"],"opts":["(A) change / (B) decrease","(A) disappear / (B) increase","(A) disappear / (B) decrease","(A) freeze / (B) increase","(A) change / (B) increase"],"r":{"ev":"2~3번 문장","s":[[2,"When we go to space, our DNA can change.","우리가 우주에 갈 때, 우리의 DNA는 변할 수 있다."],[3,"This might increase the chances of getting cancer.","이것은 암에 걸릴 가능성을 높일지도 모른다."]],"w":"2번 our DNA can change에서 (A)는 change. 3번 This might increase the chances of getting cancer에서 (B)는 increase(증가). freeze(얼다)는 혈액 표본의 보관 이야기(6번)라서 DNA와 맞지 않음.","a":"5) (A) change / (B) increase","c":5},"h":"9315703f74"},{"n":10,"t":"fill","q":"Researchers [A] the blood of 14 astronauts, and Goukassian said more [B] is necessary to study the harmful effects of space travel.","ko":"연구원들은 우주 비행사 14명의 혈액을 [A]했고, Goukassian은 우주여행의 해로운 영향을 연구하려면 더 많은 [B]이(가) 필요하다고 말했다.","bank":["examined","research","frozen","harmful","extreme","nece
