<style>

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Last month, I sawed \"#ZeroWasteChallenge\" on Jiwoo's social media. The challenge was make no trash.","ko":"지난달에 나는 지우의 소셜 미디어에서 '#제로웨이스트챌린지'를 보았다. 그 챌린지는 쓰레기를 만들지 않는 것이었다.","ok":false,"foot":[],"fixes":[{"wrong":"sawed","right":"saw","partial":false,"at":[3],"point":"불규칙 과거형: see의 과거형은 saw (sawed 아님)","topic":"불규칙 과거형","memo":"see의 과거형은 saw (sawed 아님)"},{"wrong":"make","right":"making","partial":false,"at":[12],"point":"동명사: was 뒤 보어로 '~하는 것'은 making 사용","topic":"동명사","memo":"was 뒤 보어로 '~하는 것'은 making 사용"}]},{"n":2,"tag":null,"en":"I liked she idea and tried the challenge. Here is my one-week plan for an trash-free life.","ko":"나는 그녀의 생각이 마음에 들어서 그 챌린지를 해 보았다. 여기에 쓰레기 없는 생활을 위한 나의 일주일 계획이 있다.","ok":false,"foot":[],"fixes":[{"wrong":"she","right":"her","partial":false,"at":[2],"point":"인칭대명사의 소유격: 명사 idea 앞에는 소유격 her 사용","topic":"인칭대명사의 소유격","memo":"명사 idea 앞에는 소유격 her 사용"},{"wrong":"an","right":"a","partial":false,"at":[14],"point":"관사 a/an: trash는 자음 소리로 시작하므로 a 사용","topic":"관사 a/an","memo":"trash는 자음 소리로 시작하므로 a 사용"}]},{"n":3,"tag":null,"en":"DAY 1 Know your trash.","ko":"첫째 날: 여러분의 쓰레기를 아세요.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"Today is the first day on the challenge. Jiwoo gived me some advice.","ko":"오늘은 챌린지의 첫날이다. 지우는 나에게 몇 가지 조언을 해 주었다.","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"of","partial":false,"at":[5],"point":"기본전치사: '~의 첫째 날'은 first day of 사용","topic":"기본전치사","memo":"'~의 첫째 날'은 first day of 사용"},{"wrong":"gived","right":"gave","partial":false,"at":[9],"point":"불규칙 과거형: give의 과거형은 gave (gived 아님)","topic":"불규칙 과거형","memo":"give의 과거형은 gave (gived 아님)"}]},{"n":5,"tag":null,"en":"She said, \"Knowing your trash is very importantly.\" So I went through my garbage.","ko":"그녀는 \"너의 쓰레기를 아는 것이 아주 중요해.\"라고 말했다. 그래서 나는 나의 쓰레기를 살펴보았다.","ok":false,"foot":[],"fixes":[{"wrong":"importantly","right":"important","partial":false,"at":[7],"point":"형용사와 부사: be동사 뒤 보어는 형용사 important 사용","topic":"형용사와 부사","memo  that money, I bought a used badminton racket.","그 돈으로, 나는 중고 배드민턴 라켓을 샀다.",0],["Hooray!","만세!",0],["DAY 7 Visit a zero-waste shop.","일곱째 날: 제로웨이스트 상점을 방문하세요.",1],["This morning, I ran out of shampoo.","오늘 아침에 나는 샴푸를 다 써 버렸다.",1],["I took the empty bottle and went to a zero-waste shop.","나는 빈 병을 가지고 제로웨이스트 상점에 갔다.",0],["I filled my bottle with shampoo there.","나는 거기서 나의 병을 샴푸로 채웠다.",0],["It smelled so good!","그것은 무척 좋은 냄새가 났다!",0],["This way, I cut down on plastic.","이런 방법으로 나는 플라스틱을 줄였다.",0]];var RNUM=46;var TITLE_EN="Small Actions, Big Change";var PASS_EN=["Small Actions, Big Change","Last month, I saw \"#ZeroWasteChallenge\" on Jiwoo's social media. The challenge was making no trash. I liked her idea and tried the challenge. Here is my one-week plan for a trash-free life.","DAY 1 Know your trash.","Today is the first day of the challenge. Jiwoo gave me some advice. She said, \"Knowing your trash is very important.\" So I went through my garbage. I was throwing away too much paper and plastic! I should not be so wasteful.","DAY 3 Say NO to straws.","It was really hot today, so Dad bought me lemonade. It came with a straw. I said, \"No straw, please. Thank you!\" I should say this more often.","DAY 5 Buy and sell secondhand items.","Today I cleaned my room and found too many T-shirts. I didn't wear some of them for a long time. With Mom's help, I used an app for buying and selling secondhand items. We listed my T-shirts on the app. To my surprise, one person wanted one, and I sold it to him. With that money, I bought a used badminton racket. Hooray!","DAY 7 Visit a zero-waste shop.","This morning, I ran out of shampoo. I took the empty bottle and went to a zero-waste shop. I filled my bottle with shampoo there. It smelled so good! This way, I cut down on plastic."];var PASS_KO=["작은 행동, 큰 변화","지난달에 나는 지우의 소셜 미디어에서 '#제로웨이스트챌린지'를 보았다. 그 챌린지는 쓰레기를 만들지 않는 것이었다. 나는 그녀의 생각이 마음에 들어서 그 챌린지를 해 보았다. 여기에 쓰레기 없는 생활을 위한 나의 일주일 계획이 있다.","첫째 날: 여러분의 쓰레기를 아세요.","오늘은 챌린지의 첫날이다. 지우는 나에게 몇 가지 조언을 해 주었다. 그녀는 \"너의 쓰레기를 아는 것이 아주 중요해.\"라고 말했다. 그래서 나는 나의 쓰레기를 살펴보았다. 나는 너무 많은 종이와 플라스틱을 버리고 있었다! 나는 그렇게 낭비해서는 안 된다.","셋째 날: 빨대를 거절하세요.","오늘은 정말 더워서 아빠가 나에게 레모네이드를 사 주셨다. 그것은 빨대와 함께 나왔다. 나는 \"빨대는 필요 없어요. 감사합니다!\"라고 말했다. 나는 이 말을 더 자주 해야겠다.","다섯째 날: 중고품을 사고파세요.","오늘 나는 내 방을 정리하다가 너무 많은 티셔츠를 찾아냈다. 나는 그중 어떤 것은 오랫동안 입지 않았다. 엄마의 도움으로, 나는 중고품을 사고파는 앱을 사용했다. 우리는 그 앱에 나의 티셔츠들을 올렸다. 놀랍게도, 한 사람이 하나를 원해서 나는 그것을 그에게 팔았다. 그 돈으로, 나는 중고 배드민턴 라켓을 샀다. 만세!","일곱째 날: 제로웨이스트 상점을 방문하세요.","오늘 아침에 나는 샴푸를 다 써 버렸다. 나는 빈 병을 가지고 제로웨이스트 상점에 갔다. 나는 거기서 나의 병을 샴푸로 채웠다. 그것은 무척 좋은 냄새가 났다! 이런 방법으로 나는 플라스틱을 줄였다."];var DG=[{"qs":[{"n":1,"q":"다음 대화의 내용과 일치하는 것은?","o":["여자는 기념품 상점에서 일하고 있다.","소년은 과일 샐러드를 주문한다.","여자는 소년에게 병을 구매할 것을 제안한다.","소년은 학생 할인을 받을 수 있다.","소년은 4,500원을 지불할 것이다."],"a":4,"ans":"소년은 4,500원을 지불할 것이다.","evs":[["W: Sure. That'll be 5,000 won.","네. 5,000원입니다."],["W: Oh, wait. Why don't you use your own bottle? We can give you a 500 won discount.","아, 잠깐만요. 가지고 계신 병을 사용해 보는 게 어때요? 500원 할인해 드릴 수 있어요."]],"ev":["W: Sure. That'll be 5,000 won.","네. 5,000원입니다."],"ow":["오답 ✕ — 대화는 'Welcome to Sun Cafe.'(선 카페에 오신 것을 환영합니다.)로 시작하므로 여자는 기념품 상점이 아니라 카페에서 일한다.","오답 ✕ — 소년은 'I want the strawberry juice, please.'(딸기 주스 주세요.)라고 했으므로 과일 샐러드가 아니라 딸기 주스를 주문했다.","오답 ✕ — 여자는 'Why don't you use your own bottle?'(가지고 계신 병을 사용해 보는 게 어때요?)라고 했으므로 병을 사라는 것이 아니라 자기 병을 쓰라고 제안했다.","오답 ✕ — 'We can give you a 500 won discount.'(500원 할인해 드릴 수 있어요.)는 자기 병을 쓰면 해 주는 할인이지 학생 할인이 아니다.","정답 ○ — 'That'll be 5,000 won.'(5,000원입니다.)에서 'a 500 won discount'(500원 할인)를 받으므로 5,000 - 500 = 4,500원을 낸다."],"memo":["정답 ⑤: 소년은 4,500원을 지불할 것이다.","근거: 5,000 won(5,000원) - a 500 won discount(500원 할인)","함정: ④ 할인은 학생이어서가 아니라 자기 병을 가져와서이다. ✕"],"why":"5,000원에서 500원 할인을 받아 4,500원을 낸다."}],"dlg":[["W","Welcome to Sun Cafe. How can I help you?","선 카페에 오신 것을 환영합니다. 무엇을 도와드릴까요?"],["B","I want the strawberry juice, please.","딸기 주스 주세요."],["W","Sure. That'll be 5,000 won.","네. 5,000원입니다."],["B","Okay.","네."],["W","Oh, wait. Why don't you use your own bottle? We can give you a 500 won discount.","아, 잠깐만요. 가지고 계신 병을 사용해 보는 게 어때요? 500원 할인해 드릴 수 있어요."],["B","Really? That's great. Here it is.","정말요? 잘됐네요. 여기 있어요."]]},{"qs":[{"n":2,"q":"위 대화를 읽고 답할 수 없는 질문은?","o":["What is plogging?","Who first started plogging?","What is Yuna going to do tomorrow?","What does Dylan think about plogging?","Where is Yuna going to meet Dylan tomorrow?"],"a":1,"ans":"Who first started plogging?","evs":[["G: It's jogging and picking up trash.","조깅하면서 쓰레기를 줍는 거야."],["G: Let's meet at Green Park at 10.","10시에 그린 공원에서 만나자."]],"ev":["G: It's jogging and picking up trash.","조깅하면서 쓰레기를 줍는 거야."],"ow":["오답 ✕ — 'It's jogging and picking up trash.'(조깅하면서 쓰레기를 줍는 거야.)라고 설명했으므로 플로깅이 무엇인지는 대화에서 알 수 있다.","정답 ○ — 플로깅을 누가 처음 시작했는지는 대화에 나오지 않는다. 가장 가까운 문장은 'It's jogging and picking up trash.'(조깅하면서 쓰레기를 줍는 거야.)인데 시작한 사람 이야기는 아니다.","오답 ✕ — 'I'm going to go plogging.'(나는 플로깅을 하러 갈 거야.)라고 했으므로 유나가 내일 할 일은 대화에서 알 수 있다.","오답 ✕ — 딜런은 'That sounds like a great idea!'(좋은 생각 같아!)라고 했으므로 플로깅에 대한 딜런의 생각은 알 수 있다.","오답 ✕ — 'Let's meet at Green Park at 10.'(10시에 그린 공원에서 만나자.)라고 했으므로 만날 장소는 알 수 있다."],"memo":["정답 ②: 'Who first started plogging?'은 답할 수 없다.","근거: It's jogging and picking up trash.(조깅하면서 쓰레기를 줍는 거야.) - 시작한 사람 이야기는 없음","함정: ③ I'm going to go plogging.으로 답할 수 있어서 ✕"],"why":"플로깅을 처음 시작한 사람은 대화에 나오지 않는다."},{"n":3,"q":"딜런이 플로깅에 가져가야 할 준비물로 알맞은 것은?","o":["쓰레기봉투와 물","장갑과 모자","도시락과 돗자리","자전거와 헬멧","운동화와 수건"],"a":0,"ans":"쓰레기봉투와 물","evs":[["B: Okay. What do I need?","알겠어. 내가 뭐가 필요해?"],["G: You just need a trash bag and some water.","쓰레기봉투와 물만 있으면 돼."]],"ev":["B: Okay. What do I need?","알겠어. 내가 뭐가 필요해?"],"ow":["정답 ○ — 유나가 'You just need a trash bag and some water.'(쓰레기봉투와 물만 있으면 돼.)라고 했으므로 맞다.","오답 ✕ — 장갑과 모자는 나오지 않는다. 유나는 'You just need a trash bag and some water.'(쓰레기봉투와 물만 있으면 돼.)라고 했다.","오답 ✕ — 도시락과 돗자리는 소풍 준비물이다. 유나는 'a trash bag and some water'(쓰레기봉투와 물)만 필요하다고 했다.","오답 ✕ — 플로깅은 'jogging and picking up trash'(조깅하면서 쓰레기를 줍는 것)이므로 자전거와 헬멧은 필요하지 않다.","오답 ✕ — 운동화와 var BK='m-find-r'+RNUM+'-best';
var secs=[],cur=null;
D.forEach(function(it,i){if(it.tag||!cur){cur={name:it.tag||'',items:[]};secs.push(cur)}cur.items.push(i)});
var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function load(){try{var v=localStorage.getItem(BK);return v==null?null:+v}catch(e){return null}}
function save(n){try{var b=load();if(b==null||n>b)localStorage.setItem(BK,n)}catch(e){}}

  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}

var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}

 return h;
}

 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}

 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}

function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';

function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});

 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}

var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}

document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
