"ok": false, "why": "I wish 뒤 상상이라서 knew예요. 나머지 넷과 같아요."}, {"n": "②", "en": "If I knew his number, I could call him right away.", "ko": "내가 그의 번호를 안다면 바로 전화할 수 있을 텐데.", "ok": false, "why": "상상하는 말이라서 knew예요. 나머지 넷과 같아요."}, {"n": "③", "en": "If they knew the truth, they would not forgive me.", "ko": "그들이 진실을 안다면 나를 용서하지 않을 텐데.", "ok": false, "why": "상상하는 말이라서 knew예요. 나머지 넷과 같아요."}, {"n": "④", "en": "If you know the answer, you will win 100 dollars.", "ko": "네가 답을 안다면 100달러를 받을 것이다.", "ok": true, "why": "실제로 일어날 수 있는 일이라서 현재형 know예요. 나머지와 달라요."}, {"n": "⑤", "en": "Jeremy talks as if he knew my sister. In fact, he doesn't know her.", "ko": "Jeremy는 마치 내 여동생을 아는 것처럼 말한다. 사실은 그녀를 모른다.", "ok": false, "why": "as if 상상이라서 knew예요. 나머지 넷과 같아요."}], "pencil": "실제로 일어날 수 있는 일은 if + ___, will + 동사원형으로 써요", "pencilKey": "현재형", "page": 211, "sec": "s1", "k": "pick", "tr": "① 내가 그의 비밀을 알면 좋겠다. ② 내가 그의 번호를 안다면 바로 전화할 수 있을 텐데. ③ 그들이 진실을 안다면 나를 용서하지 않을 텐데. ④ 네가 답을 알면 100달러를 받게 될 것이다. ⑤ Jeremy는 마치 내 여동생을 아는 것처럼 말한다. 사실 그는 그녀를 모른다.", "ex": ["right away = 바로, 즉시", "forgive = 용서하다"]}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 05 통합형", "type": "write", "ans": "(1) liked (2) owned (3) were not sitting", "concept": ["089", "090", "090-2"], "gap": "", "words": [["seafood", "해산물"], ["own", "가지고 있다"], ["yacht", "요트"], ["ignore", "무시하다"]], "h1": "세 문장 모두 사실을 말한 문장을 상상하는 말로 바꾸는 문제예요. (1)은 If, (2)는 I wish, (3)은 as if로 시작해요.", "h2": "(1)과 (2)는 사실이 부정이니 상상하는 말은 긍정이고, (3)은 사실이 긍정이니 as if 뒤는 부정이에요. 모두 지금 일을 상상하는 모양으로 쓰고, (3)은 앉아 있었다는 진행형임에 주의하세요.", "why": "(1) 해산물을 좋아하지 않는다는 사실의 반대로 liked(원형 like 좋아하다), (2) 요트가 없다는 사실의 반대로 owned(원형 own 가지다), (3) 옆에 앉아 있었다는 사실의 반대로 were not sitting이 들어가요.", "opts": [], "pencil": "사실이 긍정이면 상상하는 말은 ___으로, 사실이 부정이면 긍정으로 써요", "pencilKey": "부정", "page": 211, "sec": "s1", "k": "self", "acc": [], "tr": "(1) 나는 해산물을 좋아하지 않아서 그의 식당에 자주 가지 않는다. = 내가 해산물을 ___, 그의 식당에 자주 갈 텐데. (2) 나는 요트를 가지고 있지 않아서 아쉽다. = 나는 요트를 ___ 좋겠다. (3) 사실 나는 Clara 옆에 앉아 있었다. 하지만 그녀는 나를 무시했다. = Clara는 내가 그녀 옆에 앉아 ___ 나를 무시했다.", "ex": ["seafood = 해산물", "yacht = 요트", "ignore = 무시하다"]}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "가정법 과거", "type": "mc", "ans": "③", "concept": ["087", "089"], "gap": "", "words": [["pocket money", "용돈"], ["cell phone", "휴대전화"], ["get", "받다"]], "h1": "'용돈을 더 받지 못해서 새 휴대전화를 살 수 없다'는 사실의 반대를 상상하는 문장이에요. 빈칸 두 개가 각각 if절과 주절의 어떤 모양인지 보세요.", "h2": "사실과 반대로 상상하는 말은 「If + 주어 + 동사의 과거형, 주어 + 조동사의 과거형 + 동사원형」이에요. 사실이 부정이었으니 상상하는 말은 긍정으로 써요.", "why": "'용돈을 더 받는다면 새 휴대전화를 살 수 있을 텐데'가 되어야 해요. if절은 과거형 got(원형 get 받다), 주절은 could(원형 can ~할 수 있다) + 동사원형이에요.", "opts": [{"n": "①", "en": "get – can't", "ko": "받는다 – 살 수 없다", "ok": false, "why": "둘 다 현재형이라 상상하는 말이 아니에요."}, {"n": "②", "en": "will get – can", "ko": "받을 것이다 – 살 수 있다", "ok": false, "why": "if절에는 will을 쓰지 않고, can도 현재형이라 틀려요."}, {"n": "③", "en": "got – could", "ko": "받는다면 – 살 수 있을 텐데", "ok": true, "why": "if절 과거형, 주절 could라서 맞아요."}, {"n": "④", "en": "got – couldn't", "ko": "받는다면 – 살 수 없을 텐데", "ok": false, "why": "주절을 부정으로 쓰면 사실과 같은 말이 돼요. 긍정으로 써야 해요."}, {"n": "⑤", "en": "gotten – could", "ko": "(틀린 모양) – 살 수 있을 텐데", "ok": false, "why": "gotten은 과거분사라서 if절 동사 자리에 못 와요."}], "pencil": "사실이 부정이면 상상하는 말의 주절은 ___으로 써요", "pencilKey": "긍정", "page": 212, "sec": "s2", "k": "pick", "tr": "나는 용돈을 더 받지 못해서 새 휴대전화를 살 수 없다. = 내가 용돈을 더 ___, 나는 새 휴대전화를 ___.", "ex": ["pocket money = 용돈", "cell phone = 휴대전화"]}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "가정법 과거", "type": "mc", "ans": "⑤", "concept": ["087", "088"], "gap": "", "words": [["dress", "원피스"], ["expensive", "비싼"]], "h1": "대화의 뒷말이 '너무 비싸다'예요. 이 말과 이어지려면 빈칸에서 '산다'와 '사지 않는다' 중 어느 쪽이 자연스러운지 먼저 정하세요.", "h2": "'내가 너라면'은 If I were you로 말해요. be동사는 주어가 I여도 주로 were를 쓰고, 주절은 would + 동사원형이에요.", "why": "너무 비싸다고 했으니 '내가 너라면 그것을 사지 않을 텐데'가 자연스러워요. 그래서 If I were you, I wouldn't buy it.이 맞아요.", "opts": [{"n": "①", "en": "If I am you, I would buy it.", "ko": "내가 너라면 그것을 살 텐데.", "ok": false, "why": "am이 아니라 were를 써야 하고, 사겠다는 뜻도 대화와 안 맞아요."}, {"n": "②", "en": "If I am you, I won't buy it.", "ko": "내가 너라면 나는 그것을 사지 않을 것이다.", "ok": false, "why": "am과 won't가 상상하는 말의 모양이 아니에요."}, {"n": "③", "en": "If I are you, I wouldn't buy it.", "ko": "(말이 안 되는 문장)", "ok": false, "why": "I 뒤에 are를 쓸 수 없어요."}, {"n": "④", "en": "If I were you, I would buy it.", "ko": "내가 너라면 그것을 살 텐데.", "ok": false, "why": "모양은 맞지만 너무 비싸다는 말과 뜻이 이어지지 않아요."}, {"n": "⑤", "en": "If I were you, I wouldn't buy it.", "ko": "내가 너라면 그것을 사지 않을 텐데.", "ok": true, "why": "모양도 뜻도 알맞아요."}], "pencil": "'내가 너라면 ~할 텐데'는 If I ___ you, I would + 동사원형", "pencilKey": "were", "page": 212, "sec": "s2", "k": "pick", "tr": "A: 그 원피스 멋져 보여. B: ___ 그건 너무 비싸.", "ex": ["dress = 원피스"]}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "가정법 과거", "type": "mc", "ans": "③", "concept": ["089"], "gap": "", "words": [["headache", "두통"], ["regret", "후회"], ["pool", "수영장"]], "h1": "각 보기는 사실을 말한 문장(As ~)과 그것을 상상하는 말로 바꾼 문장(If ~)이 짝이에요. 바꾼 문장이 사실의 반대가 되었는지 하나씩 보세요.", "h2": "사실이 긍정이면 상상하는 말은 부정으로, 사실이 부정이면 긍정으로 바꿔요. 그리고 현재형은 과거형(don't는 didn't)이 돼야 해요.", "why": "③은 'As I have a headache, I can't go'(두통이 있어서 갈 수 없다)를 바꾼 거예요. 두통이 없다고 상상해야 하니 If I didn't have a headache, I could go가 돼야 해요. don't have는 현재형이라 틀려요.", "opts": [{"n": "①", "en": "As I don't know the answer, I can't tell you. / If I knew the answer, I could tell you.", "ko": "내가 답을 몰라서 말해 줄 수 없다. / 내가 답을 안다면 말해 줄 수 있을 텐데.", "ok": false, "why": "사실의 반대를 알맞게 바꿨어요."}, {"n": "②", "en": "As I am not strong enough, I won't try the marathon. / If I were strong enough, I would try the marathon.", "ko": "나는 충분히 강하지 않아서 마라톤에 도전하지 않을 것이다. / 내가 충분히 강하다면 마라톤에 도전할 텐데.", "ok": false, "why": "were와 would를 알맞게 썼어요."}, {"n": "③", "en": "As I have a headache, I can't go to the party. / If I don't have a headache, I could go to the party.", "ko": "나는 두통이 있어서 파티에 갈 수 없다. / 두통이 없다면 파티에 갈 수 있을 텐데.", "ok": true, "why": "if절이 don't have로 현재형이에요. didn't have라야 해서 잘못 바꾼 문장이에요."}, {"n": "④", "en": "As it is so late, I won't play in the pool. / If it were not so late, I would play in the pool.", "ko": "너무 늦어서 수영장에서 놀지 않을 것이다. / 너무 늦지 않다면 수영장에서 놀 텐데.", "ok": false, "why": "부정으로 뒤집고 were, would를 알맞게 썼어요."}, {"n": "⑤", "en": "As she doesn't study hard, she won't pass the test. / If she studied hard, she would pass the test.", "ko": "그녀는 열심히 공부하지 않아서 시험에 통과하지 못할 것이다. / 그녀가 열심히 공부한다면 시험에 통과할 텐데.", "ok": false, "why": "긍정으로 뒤집고 과거형과 would를 알맞게 썼어요."}], "pencil": "사실의 don't는 상상하는 말에서 ___가 돼요", "pencilKey": "didn't", "page": 212, "sec": "s2", "k": "pick", "tr": "① 나는 답을 몰라서 너에게 말해 줄 수 없다. / 바꾼 문장: 내가 답을 안다면 너에게 말해 줄 수 있을 텐데. ② 나는 충분히 힘이 세지 않아서 마라톤을 시도하지 않을 것이다. / 바꾼 문장: 내가 충분히 힘이 세다면 마라톤을 시도할 텐데. ③ 나는 머리가 아파서 파티에 갈 수 없다. / 바꾼 문장: 내가 머리가 아프지 않다면 파티에 갈 수 있을 텐데. ④ 너무 늦어서 나는 수영장에서 놀지 않을 것이다. / 바꾼 문장: 그렇게 늦지 않았다면 나는 수영장에서 놀 텐데. ⑤ 그녀는 열심히 공부하지 않아서 시험에 통과하지 못할 것이다. / 바꾼 문장: 그녀가 열심히 공부한다면 시험에 통과할 텐데.", "ex": ["try = 시도하다", "headache = 두통", "pass the test = 시험에 통과하다"]}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "가정법 과거", "type": "mc", "ans": "②", "concept": ["087", "042"], "gap": "", "words": [["cancel", "취소하다"], ["take care of", "돌보다"], ["wallet", "지갑"], ["pick up", "줍다"]], "h1": "'어색한 것'을 찾는 문제예요. 각 문장이 실제로 일어날 수 있는 일인지, 상상하는 말인지 구별하고 if절과 주절이 짝이 맞는지 보세요.", "h2": "실제로 일어날 수 있는 일은 'if + 현재형, will'이고, 상상하는 말은 'if + 과거형, would'예요. 둘이 섞이면 어색해요.", "why": "②는 if절이 현재형 have(원형 have 가지다)인데 주절은 would예요. 상상하는 말로 하려면 had로, 실제 일이라면 will로 고쳐야 해요.", "opts": [{"n": "①", "en": "If it rains tomorrow, the baseball game will be canceled.", "ko": "내일 비가 오면 야구 경기가 취소될 것이다.", "ok": false, "why": "실제로 일어날 수 있는 일이라서 if + 현재형, will이 알맞아요."}, {"n": "②", "en": "If I have a cat, I would take good care of it.", "ko": "내가 고양이가 있다면 잘 돌볼 텐데.", "ok": true, "why": "if절은 현재형인데 주절은 would라서 어색해요."}, {"n": "③", "en": "If I were taller, I'd be better at basketball.", "ko": "내가 키가 더 크다면 농구를 더 잘할 텐데.", "ok": false, "why": "were와 would가 짝이 맞아요."}, {"n": "④", "en": "If I didn't have to do my homework, I could join you.", "ko": "숙제를 하지 않아도 된다면 너와 함께할 수 있을 텐데.", "ok": false, "why": "과거형과 could가 짝이 맞아요."}, {"n": "⑤", "en": "What would you do if you picked up a wallet with a lot of money?", "ko": "돈이 많이 든 지갑을 주우면 너는 어떻게 할 거니?", "ok": false, "why": "would와 picked up(원형 pick up 줍다)이 짝이 맞아요."}], "pencil": "상상하는 말: if절은 ___, 주절은 would + 동사원형", "pencilKey": "과거형", "page": 212, "sec": "s2", "k": "pick", "tr": "① 내일 비가 오면 야구 경기는 취소될 것이다. ② 내게 고양이가 있다면 나는 그것을 잘 돌볼 텐데. ③ 내가 더 키가 크다면 농구를 더 잘할 텐데. ④ 내가 숙제를 하지 않아도 된다면 너와 함께할 수 있을 텐데. ⑤ 돈이 많이 든 지갑을 주웠다면 너는 어떻게 하겠니?", "ex": ["cancel = 취소하다", "take care of = ~을 돌보다", "pick up = 줍다"]}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "I wish / as if 가정법 과거", "type": "mc", "ans": "②", "concept": ["090", "090-2"], "gap": "", "words": [["Christmas", "크리스마스"], ["boss", "상사, 사장"]], "h1": "두 문장 모두 사실이 아닌 일을 상상하는 말이에요. 하나는 I wish, 하나는 as if 뒤의 빈칸이에요. 두 빈칸에 같은 말이 들어가야 해요.", "h2": "I wish와 as if 뒤의 be동사는 주어가 it이든 he이든 상관없이 주로 같은 모양을 써요. 현재형이 아니라 과거형 계열이에요.", "why": "I wish 가정법과 as if 가정법에서는 주어와 수에 상관없이 be동사에 were를 써요. 그래서 두 빈칸에 were가 모두 들어가요.", "opts": [{"n": "①", "en": "is", "ko": "이다", "ok": false, "why": "현재형이라서 상상하는 말이 아니에요."}, {"n": "②", "en": "were", "ko": "이라면, 인 것처럼", "ok": true, "why": "두 문장에 모두 맞아요."}, {"n": "③", "en": "be", "ko": "이다", "ok": false, "why": "동사원형이라서 맞지 않아요."}, {"n": "④", "en": "are", "ko": "이다", "ok": false, "why": "현재형이라서 틀리고, it이나 he와도 안 맞아요."}, {"n": "⑤", "en": "has been", "ko": "계속 ~였다", "ok": false, "why": "현재완료는 이 자리에 맞지 않아요."}], "pencil": "I wish와 as if 뒤의 be동사는 주어와 상관없이 ___", "pencilKey": "were", "page": 212, "sec": "s2", "k": "pick", "tr": "• 매일이 크리스마스이면 좋겠다. • Lee 선생님은 마치 자기가 내 상사인 것처럼 말한다.", "ex": ["boss = 상사"]}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "I wish / as if 가정법 과거", "type": "mc", "ans": "①", "concept": ["090", "090-2"], "gap": "", "words": [["love", "사랑하다"], ["truth", "진실"], ["act", "행동하다"]], "h1": "'Rachel은 Alex를 사랑하지 않는데 사랑하는 것처럼 행동한다'와 'Alex가 진실을 알면 좋겠다'예요. 밑줄 친 두 동사가 as if와 I wish 뒤에서 어떤 모양이어야 할지 보세요.", "h2": "as if와 I wish 뒤에서 사실과 반대로 상상할 때는 동사를 과거형으로 써요. 현재형 그대로 두면 틀려요.", "why": "as if 뒤의 love(원형 love 사랑하다)는 loved로, I wish 뒤의 know(원형 know 알다)는 knew로 고쳐야 해요. 둘 다 과거형이에요.", "opts": [{"n": "①", "en": "loved – knew", "ko": "사랑했다 – 알았다", "ok": true, "why": "둘 다 상상하는 말의 과거형이라서 맞아요."}, {"n": "②", "en": "love – knew", "ko": "사랑하다 – 알았다", "ok": false, "why": "첫 번째가 현재형 그대로라서 틀려요."}, {"n": "③", "en": "loves – known", "ko": "사랑한다 – 알려진", "ok": false, "why": "현재형이고 known은 과거분사라서 둘 다 틀려요."}, {"n": "④", "en": "loved – knows", "ko": "사랑했다 – 안다", "ok": false, "why": "두 번째가 현재형이라서 틀려요."}, {"n": "⑤", "en": "has loved – had known", "ko": "계속 사랑해 왔다 – 알았었다면", "ok": false, "why": "현재완료와 과거완료라서 이 문장의 시제와 맞지 않아요."}], "pencil": "as if와 I wish 뒤의 동사는 ___로 고쳐요", "pencilKey": "과거형", "page": 212, "sec": "s2", "k": "pick", "tr": "Rachel은 Alex를 사랑하지 않지만, 마치 그를 사랑하는 것처럼 행동한다. 나는 Alex가 진실을 알면 좋겠다.", "ex": ["truth = 진실"]}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "I wish / as if 가정법 과거", "type": "mc", "ans": "⑤", "concept": ["090", "090-2", "089"], "gap": "", "words": [["rich", "부유한"], ["famous", "유명한"], ["responsible", "책임이 있는"], ["accident", "사고"]], "h1": "'의미가 서로 다른 것'을 찾는 문제예요. 각 보기의 윗문장을 아랫문장(사실)과 비교하고, 사실이 윗문장의 반대인지 보세요.", "h2": "I wish ~는 I'm sorry that ~(사실은 반대로 말함), as if ~는 In fact, ~(사실은 반대)로 바꿀 수 있어요. 윗문장이 부정이면 사실은 긍정이에요.", "why": "⑤는 'Kelly는 마치 사고에 책임이 없는 것처럼 말했다'이므로 사실은 책임이 있었다는 뜻이에요. 그런데 아랫문장은 책임이 없었다고 했으니 의미가 달라요.", "opts": [{"n": "①", "en": "I wish I were rich and famous. / I'm sorry that I'm not rich and famous.", "ko": "내가 부유하고 유명하면 좋을 텐데. / 나는 부유하지도 유명하지도 않아서 아쉽다.", "ok": false, "why": "소망과 사실이 반대로 맞아서 같은 뜻이에요."}, {"n": "②", "en": "I wish I had time to travel. / I'm sorry that I don't have time to travel.", "ko": "내게 여행할 시간이 있으면 좋을 텐데. / 여행할 시간이 없어서 아쉽다.", "ok": false, "why": "소망과 사실이 반대로 맞아서 같은 뜻이에요."}, {"n": "③", "en": "I wish it would stop raining. / I'm sorry that it won't stop raining.", "ko": "비가 그치면 좋을 텐데. / 비가 그치지 않아서 아쉽다.", "ok": false, "why": "소망과 사실이 반대로 맞아서 같은 뜻이에요."}, {"n": "④", "en": "Helen acts as if she had a daughter. / In fact, Helen doesn' "], ["country", "나라"]], "h1": "'내 나라로 돌아갈 수 없어서 아쉽다'를 I wish 문장으로 바꾸는 문제예요. can't의 반대를 I wish 뒤에서 어떻게 쓰는지 보세요.", "h2": "I wish 문장은 사실의 반대이니 can't는 can의 과거형으로 바꿔요. will이나 현재형 can은 I wish 뒤에 쓰지 않아요.", "why": "'돌아갈 수 있으면 좋을 텐데'이므로 I wish I could go back to my country.예요. could(원형 can ~할 수 있다) + 동사원형이에요.", "opts": [{"n": "①", "en": "I wish I will go back to my country.", "ko": "내가 내 나라로 돌아갈 것이면 좋겠다.", "ok": false, "why": "I wish 뒤에 will을 쓰지 않아요."}, {"n": "②", "en": "I wish I can go back to my country.", "ko": "내가 내 나라로 돌아갈 수 있으면 좋겠다.", "ok": false, "why": "현재형 can은 I wish 뒤에 쓰지 않아요."}, {"n": "③", "en": "I wish I could go back to my country.", "ko": "내가 내 나라로 돌아갈 수 있다면 좋을 텐데.", "ok": true, "why": "can의 과거형 could를 써서 맞아요."}, {"n": "④", "en": "I wish I can't go back to my country.", "ko": "내가 내 나라로 돌아갈 수 없으면 좋겠다.", "ok": false, "why": "현재형이고, 뜻도 사실과 같은 부정이라서 틀려요."}, {"n": "⑤", "en": "I wish I could have gone back to my country.", "ko": "내가 내 나라로 돌아갈 수 있었더라면 좋았을 텐데.", "ok": false, "why": "지난 일에 대한 후회라서 지금 아쉬움과 맞지 않아요."}], "pencil": "I wish 뒤에서 can은 ___로 바꿔요", "pencilKey": "could", "page": 214, "sec": "s3", "k": "pick", "tr": "나는 우리나라로 돌아갈 수 없어서 유감이다.", "ex": ["go back to = ~로 돌아가다"]}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "I wish 가정법 과거", "type": "mc", "ans": "③", "concept": ["090"], "gap": "", "words": [["outside", "바깥에서"], ["hot", "더운"], ["inside", "안에서"]], "h1": "'더울 때 바깥에서 일하는 게 싫다'는 글 다음에 이어질 소망을 찾는 문제예요. 글쓴이가 바라는 모습이 무엇인지 먼저 생각해 보세요.", "h2": "I wish 뒤에는 현재형이나 wished를 쓰지 않아요. 앞 글에서 글쓴이가 싫어한다고 한 것과 뜻이 이어지는 소망을 찾으세요.", "why": "바깥에서 일하는 게 싫으니 '바깥에서 일하지 않으면 좋겠다'가 어울려요. 그래서 I wish I didn't work(원형 work 일하다) outside.가 맞아요.", "opts": [{"n": "①", "en": "I wish it were hot outside.", "ko": "바깥이 더우면 좋을 텐데.", "ok": false, "why": "더운 게 싫다고 했는데 더웠으면 좋겠다고 해서 뜻이 반대예요."}, {"n": "②", "en": "I wish I worked outside.", "ko": "내가 바깥에서 일하면 좋을 텐데.", "ok": false, "why": "바깥 일이 싫다고 했는데 일하고 싶다고 해서 뜻이 반대예요."}, {"n": "③", "en": "I wish I didn't work outside.", "ko": "내가 바깥에서 일하지 않으면 좋을 텐데.", "ok": true, "why": "싫어하는 마음과 뜻이 이어져서 맞아요."}, {"n": "④", "en": "I wished I don't work inside.", "ko": "(어색한 문장)", "ok": false, "why": "wished와 현재형 don't가 섞였고, inside도 글과 안 맞아요."}, {"n": "⑤", "en": "I wished it were not hot inside.", "ko": "안이 덥지 않았으면 했다.", "ok": false, "why": "wished와 inside 때문에 글의 내용과 안 맞아요."}], "pencil": "I wish 뒤에 사실이 아닌 소망은 ___로 써요", "pencilKey": "과거형", "page": 214, "sec": "s3", "k": "pick", "tr": "밖은 덥다. 나는 더울 때 밖에서 일하는 것을 좋아하지 않는다.", "ex": []}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "통합형", "type": "mc", "ans": "①, ④", "concept": ["090", "090-2", "090-H1"], "gap": "", "words": [["empty", "텅 빈"], ["doctor", "의사"], ["camping", "캠핑"], ["exam", "시험"]], "h1": "'의미가 같은 것을 모두 고르는' 문제예요. 윗줄 문장을 사실을 말하는 문장으로 바꿨을 때 아랫줄과 같은지 하나씩 확인하세요.", "h2": "Without = But for(~이 없다면), I wish ~ = I'm sorry that ~(반대로 말함), as if ~ = In fact, ~(반대로 말함)예요. 반대로 바꾸는 부분을 틀리기 쉬워요.", "why": "①은 Without과 But for가 같은 뜻이고, ④는 I wish의 부정이 I'm sorry의 긍정과 같은 뜻이에요. ②, ③, ⑤는 사실로 바꿀 때 반대로 바꾸지 않았거나 시제를 틀렸어요.", "opts": [{"n": "①", "en": "Without dreams, my life would be empty. / But for dreams, my life would be empty.", "ko": "꿈이 없다면 내 삶은 텅 빌 텐데. / 꿈이 없다면 내 삶은 텅 빌 텐데.", "ok": true, "why": "Without과 But for는 같은 뜻이라서 맞아요."}, {"n": "②", "en": "In fact, he was not a doctor. / He talked as if he were not a doctor.", "ko": "사실 그는 의사가 아니었다. / 그는 마치 의사가 아닌 것처럼 말했다.", "ok": false, "why": "사실이 의사가 아니면 as if 뒤는 의사인 것처럼이라서 were a doctor라야 해요."}, {"n": "③", "en": "If it were warm, we would go camping. / As it was not warm, we didn't go camping.", "ko": "날이 따뜻하다면 캠핑을 갈 텐데. / 날이 따뜻하지 않아서 캠핑을 가지 않았다.", "ok": false, "why": "현재 이야기를 과거로 바꿔서 시제가 틀려요. 사실은 As it is not warm, we won't go camping이에요."}, {"n": "④", "en": "I wish I didn't have to study for tomorrow's exam now. / I'm sorry that I have to study for tomorrow's exam now.", "ko": "지금 내일 시험 공부를 하지 않아도 되면 좋을 텐데. / 지금 내일 시험 공부를 해야 해서 아쉽다.", "ok": true, "why": "소망의 부정이 사실의 긍정과 맞아서 같은 뜻이에요."}, {"n": "⑤", "en": "If I didn't work full-time, I could exercise more. / As I worked full-time, I couldn't exercise more.", "ko": "내가 전일제로 일하지 않는다면 운동을 더 할 수 있을 텐데. / 내가 전일제로 일해서 운동을 더 할 수 없었다.", "ok": false, "why": "현재 이야기인데 과거형으로 바꿔서 틀려요. 사실은 As I work full-time, I can't exercise more예요."}], "pencil": "As ~로 사실을 바꿀 때는 긍정은 부정, 시제는 ___로 맞춰요", "pencilKey": "현재형", "page": 214, "sec": "s3", "k": "pick", "tr": "① 꿈이 없다면 내 삶은 텅 비어 있을 것이다. / 꿈이 없다면 내 삶은 텅 비어 있을 것이다. ② 사실 그는 의사가 아니었다. / 그는 마치 의사가 아닌 것처럼 말했다. ③ 날씨가 따뜻하다면 우리는 캠핑을 갈 텐데. / 날씨가 따뜻하지 않아서 우리는 캠핑을 가지 않았다. ④ 내가 지금 내일 시험 공부를 하지 않아도 되면 좋겠다. / 나는 지금 내일 시험 공부를 해야 해서 아쉽다. ⑤ 내가 전일제로 일하지 않는다면 운동을 더 할 수 있을 텐데. / 나는 전일제로 일해서 운동을 더 할 수 없었다.", "ex": ["empty = 텅 빈", "full-time = 전일제로, 종일", "exam = 시험"]}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "통합형", "type": "mc", "ans": "②", "concept": ["087", "042", "090"], "gap": "", "words": [["boyfriend", "남자 친구"], ["place", "입장, 자리"], ["complete fool", "완전한 바보"], ["succeed", "성공하다"]], "h1": "빈칸에 모두 be동사가 들어가요. 각 문장이 상상하는 말인지, 실제로 일어날 수 있는 일(단순 조건문)인지 나눠서 보세요.", "h2": "실제로 일어날 수 있는 일은 'if + 현재형, will'이라서 be동사는 is나 are를 써요. 상상하는 말에서는 주어가 무엇이든 were를 써요.", "why": "②는 '문제가 있으면 알려 줄게'라는 실제 일이고 주절이 will이라서 현재형 is가 와요. 나머지는 모두 상상하는 말이라서 were가 맞아요.", "opts": [{"n": "①", "en": "I wish he were my boyfriend.", "ko": "그가 내 남자 친구면 좋을 텐데.", "ok": false, "why": "I wish 뒤 상상이라서 were예요. 나머지와 같아요."}, {"n": "②", "en": "If there is any problem, I'll let you know.", "ko": "문제가 있으면 내가 알려 줄게.", "ok": true, "why": "실제로 일어날 수 있는 일이라서 is예요. 나머지와 달라요."}, {"n": "③", "en": "What would you do if you were in my place?", "ko": "네가 내 입장이라면 어떻게 할래?", "ok": false, "why": "상상하는 말이라서 were예요. 나머지와 같아요."}, {"n": "④", "en": "He treated me as if I were a complete fool.", "ko": "그는 마치 내가 완전한 바보인 것처럼 대했다.", "ok": false, "why": "as if 상상이라서 were예요. 나머지와 같아요."}, {"n": "⑤", "en": "If it were not for your help, he would not succeed.", "ko": "네 도움이 없다면 그는 성공하지 못할 텐데.", "ok": false, "why": "상상하는 말이라서 were예요. 나머지와 같아요."}], "pencil": "실제로 일어날 수 있는 일은 if + ___, will + 동사원형", "pencilKey": " function trBlock(d){
 var h='<button class="btn g" style="margin-top:12px" onclick="toggleTr()">'+(st.trOpen?'해석 닫기':'해석 보기')+'</button>';
 if(st.trOpen){h+='<div class="tr">'+(d.tr?hl(d.tr):'해석을 준비하고 있어요.');
  if(d.ex&&d.ex.length)h+='<div class="ex">'+d.ex.map(function(e){return '<div>'+esc(e)+'</div>'}).join("")+'</div>';h+='</div>'}
 return h}
function toggleTr(){st.trOpen=!st.trOpen;render()}
function hintBlock(d,r,after){
 var h="";
 if(!r.h1){h+='<button class="btn s" onclick="useHint(\''+d.id+'\')">막히면 힌트 1 보기</button>';return h}
 h+='<div class="lab">힌트 1</div><div class="hint">'+hl(d.h1)+'</div>';
 if(d.words&&d.words.length)h+='<div class="lab">단어 뜻</div><div class="chips">'+d.words.map(function(w){return '<span><b>'+esc(w[0])+'</b> '+esc(w[1])+'</span>'}).join("")+'</div>';
 if(after){h+='<div class="lab">힌트 2</div><div class="hint two">'+hl(d.h2)+'</div>';
  if(d.concept&&d.concept.length)h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 return h}
function useHint(id){var r=rec(id);r.h1=1;r.nh=(r.nh||0)+1;sv();render()}
function render(){
 renderTabs();
 var app=document.getElementById("app");
 if(st.tmode){app.innerHTML=teacher();return}
 if(st.tab>=STEPS.length){app.innerHTML=fullAns();return}
 var its=items(st.tab);
 var fo=firstOpen(its);
 if(st.idx>its.length)st.idx=its.length;
 if(st.idx>fo&&st.idx<its.length)st.idx=fo;
 if(st.idx>=its.length){app.innerHTML=summary();return}
 var d=its[st.idx],r=rec(d.id);
 if(!r.shown){r.shown=Date.now();sv()}
 var h='<div class="nums">';
 its.forEach(function(x,i){var rr=rec(x.id),dn=isDone(x),lock=!dn&&i>fo;
  h+='<button class="nb'+(i===st.idx?' cur':'')+(dn?(rr.ok1===false?' red':' ok'):'')+(lock?' lock':'')+'"'+(lock?' disabled':' onclick="goIdx('+i+')"')+'>'+x.no+'</button>'});
 h+='<button class="nb'+(fo>=its.length?'':' lock')+'"'+(fo>=its.length?' onclick="goIdx('+its.length+')"':' disabled')+'>결과</button></div>';
 h+='<div class="card"><span class="tag">'+esc(STEPS[st.tab].name)+' · '+d.no+'번</span><div class="qt">'+esc(d.qtype)+(d.page?' · 교재 '+d.page+'쪽':'')+'</div>';
 h+=trBlock(d);
 h+=body(d,r);
 h+='</div>';
 h+=navBtns(d,r,its);
 app.innerHTML=h;
 var ip=document.getElementById("inp");if(ip&&!r.done){ip.onkeydown=function(e){if(e.key==="Enter")submitType(d.id)}}
}
function navBtns(d,r,its){
 var ok=isDone(d),h='<div class="nav">';
 if(st.idx>0)h+='<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>';
 if(ok)h+='<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button>';
 return h+'</div>'}
function body(d,r){
 var h="";
 if(d.k==="self")return bodySelf(d,r);
 var solved=!!r.done;
 h+=hintBlock(d,r,solved||r.tries>0);
 if(!solved){
  if(d.k==="pick"){
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[],gone=r.gone||[];
   h+='<div class="choices'+(d.opts.length===2?' two':'')+'">'+d.opts.map(function(o){var l=o.n,c='ch'+(sel.indexOf(l)>=0?' sel':'')+(gone.indexOf(l)>=0?' gone':'');
    return '<button class="'+c+'"'+(gone.indexOf(l)>=0?' disabled':'')+' onclick="selOpt(\''+d.id+'\',\''+l+'\','+(multi?1:0)+')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+='<div class="meter">'+(multi?'정답이 두 개예요. 모두 고른 뒤 제출해요':'책의 답을 고른 뒤 제출해요')+(r.tries?' · 다시 풀어 보세요':'')+'</div>';
   h+='<button class="btn p" onclick="submitPick(\''+d.id+'\')"'+(sel.length?'':' disabled')+'>제출</button>';
  }else{
   h+='<input id="inp" class="inp'+(r.tries?' bad':'')+'" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="정답을 입력해요" value="'+esc(r.val||"")+'" oninput="rec(\''+d.id+'\').val=this.value">';
   h+='<div class="meter">'+(r.tries?'틀렸어요. 힌트를 읽고 다시 써 보세요':'답만 짧게 입력해요')+'</div><button class="btn p" onclick="submitType(\''+d.id+'\')">제출</button>';
  }
  return h}
 return h+solvedView(d,r)}
function selOpt(id,l,multi){var r=rec(id);r.sel=r.sel||[];if(multi){var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l)}else r.sel=[l];sv();render()}
function grade(d,r,ok){
 var t=Date.now();
 if(r.ok1===undefined){r.ok1=ok;r.d0=today();r.fast=(!ok&&r.shown&&t-r.shown<5000)?1:0;r.tfirst=t}
 r.tries=(r.tries||0)+1;
 if(ok){r.done=true;r.pt=t}
 sv();render()}
function submitPick(id){var d=byId(id),r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;
 var ok=(a===s);if(!ok){r.gone=(r.gone||[]);if(d.ans.indexOf(",")<0){r.gone.push(s)}r.sel=[]}else r.pick=s;grade(d,r,ok)}
function submitType(id){var d=byId(id),r=rec(id);var v=nz((document.getElementById("inp")||{}).value||r.val);if(!v)return;
 var ok=d.acc.some(function(a){return nz(a)===v});r.val=ok?r.val:"";grade(d,r,ok)}
function solvedView(d,r){
 var h='<div class="res ok">정답이에요</div>';
 if(d.k==="pick"){h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){var cls=o.ok?'ok':'',bd=o.ok?'정답':'';
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'})}
 else h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
 return h+penBlock(d,r)}
function penBlock(d,r){
 if(!d.pencil)return "";
 var must=(r.ok1===false||st.mode==="full");
 var h='<div class="pen"><div class="ph">'+PEN+'연필 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+((r.pen||!must)?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>';
 if(must&&!r.pen)h+='<div class="must">'+(r.ok1===false?'틀린 문제예요. ':'')+'빈칸을 책에 직접 써야 다음으로 가요</div><button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>';
 return h+'</div>'}
function penDone(id){var r=rec(id);r.pen=1;r.pt2=Date.now();if(r.pt&&r.pt2-r.pt<8000)r.pf=1;sv();render()}
function bodySelf(d,r){
 var h="";
 if(!r.done){h+=hintBlock(d,r,false);h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div><button class="btn p" onclick="selfDone(\''+d.id+'\')">책에 다 썼어요</button>';return h}
 h+=hintBlock(d,r,true);
 h+='<div class="res ok" style="background:#eef2ff;color:#3730a3">책에 쓴 답은 문제를 모두 끝내면 전체정답에서 확인해요</div>';
 return h+penBlock(d,r)}
function selfDone(id){var r=rec(id);r.done=1;r.d0=today();r.pt=Date.now();sv();render()}
function summary(){
 var its=items(st.tab),n=its.length;
 var gr=its.filter(function(d){return d.k!=="self"});
 var ok=gr.filter(function(d){return rec(d.id).ok1}).length,pct=gr.length?Math.round(ok/gr.length*100):100;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+n+' / '+n+'</span></div>';
 if(gr.length)h+='<div class="srow">처음에 맞힌 문제<span>'+ok+' / '+gr.length+' ('+pct+'%)</span></div>';
 var wrong=gr.filter(function(d){return rec(d.id).ok1===false});
 if(pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 연필 한 줄을 다시 읽어 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb red" onclick="goIdx('+its.indexOf(d)+')">'+d.no+'</button>'}).join("")+'</div>';
 }else h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>';
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 else h+='<button class="btn p" onclick="goTab('+STEPS.length+')">전체정답 보기</button>';
 return h+'</div>'}
function fullAns(){
 if(!allDone()){var left=DATA.filter(function(d){return !isDone(d)}).length;return '<div class="card">문제를 모두 끝내면 전체정답이 열려요.<div class="meter">남은 문제 '+left+'개</div></div>'}
 var h='<div class="card sum"><h2>전체정답</h2><div class="note" style="margin-top:0">책에 쓴 문제는 정답과 비교해서 표시해요.</div></div>';
 STEPS.forEach(function(s){
  h+='<div class="card"><div class="tag">'+esc(s.name)+'</div>';
  items(STEPS.indexOf(s)).forEach(function(d){var r=rec(d.id);
   h+='<div class="srow" style="display:block"><div>'+d.no+'번 · <span style="color:var(--ink)">'+esc(d.k==="pick"?d.ans:d.ans)+'</span></div>';
   if(r.ok1===false&&d.k!=="self")h+='<div class="meter" style="color:var(--bad)">처음에 틀렸어요</div>';
   if(d.k==="self"){h+='<div class="why">'+hl(d.why)+'</div><div class="nav"><button class="btn '+(r.mk===1?'p':'s')+'" onclick="mark(\''+d.id+'\',1)">맞게 썼어요</button><button class="btn '+(r.mk===0?'p':'g')+'" onclick="mark(\''+d.id+'\',0)">틀렸어요</button></div>'+(r.mk===0&&d.pencil&&!r.pen2?'<div class="must">틀렸으면 연필 한 줄을 책에 써요</div><button class="btn s" onclick="pen2(\''+d.id+'\')">책에 썼어요</button>':'')}
   h+='</div>'});
  h+='</div>'});
 return h}
function mark(id,v){var r=rec(id);r.mk=v;sv();render()}
function pen2(id){rec(id).pen2=1;sv();render()}
function teacher(){
 var h='<div class="card tp"><h2 style="font-size:20px">선생님 화면</h2>';
 var first=DATA.filter(function(d){return rec(d.id).ok1!==undefined&&d.k!=="self"});
 var ok=first.filter(function(d){return rec(d.id).ok1}).length;
 h+='<div class="srow">푼 문제<span>'+DATA.filter(isDone).length+' / '+DATA.length+'</span></div>';
 h+='<div class="srow">처음에 맞힘<span>'+ok+' / '+first.length+(first.length?' ('+Math.round(ok/first.length*100)+'%)':'')+'</span></div>';
 var fast=DATA.filter(function(d){return rec(d.id).fast}).map(function(d){return d.id}),wr=first.filter(function(d){return !rec(d.id).ok1}).map(function(d){return d.id});
 h+='<div class="srow">5초 안에 제출하고 틀림<span>'+(fast.join(", ")||"없음")+'</span></div>';
 h+='<div class="srow">처음에 틀린 문제<span>'+(wr.join(", ")||"없음")+'</span></div>';
 h+='<div class="srow">쓰기 모드<span>'+(st.mode==="full"?'전체 쓰기':'보통')+'</span></div>';
 h+='<button class="btn s" onclick="setMode(\''+(st.mode==="full"?'normal':'full')+'\')">'+(st.mode==="full"?'보통 모드로':'전체 쓰기 모드로')+'</button>';
 h+='<button class="btn g" onclick="resetAll()">이 단원 기록 지우기</button><button class="btn g" onclick="st.tmode=false;render()">닫기</button></div>';
 return h}
function setMode(m){st.mode=m;try{localStorage.setItem(MODEKEY,m)}catch(e){}render()}
function resetAll(){if(!confirm("이 단원 기록을 모두 지울까요?"))return;st.rec={};st.tab=0;st.idx=0;sv();render()}
function openT(){var p=prompt("선생님 번호");if(p==="7372"){st.tmode=true;render()}}
window.__gi=function(){
 var td=today(),T=DATA.filter(function(d){var r=st.rec[d.id];return r&&r.d0===td});
 if(!T.length)return "";
 var g=T.filter(function(d){return d.k!=="self"}),ok=g.filter(function(d){return st.rec[d.id].ok1}).length;
 var wr=g.filter(function(d){return !st.rec[d.id].ok1}).map(function(d){return d.id}),fs=T.filter(function(d){return st.rec[d.id].fast}).map(function(d){return d.id});
 var pn=T.filter(function(d){return st.rec[d.id].pen||st.rec[d.id].pen2}),pf=pn.filter(function(d){return st.rec[d.id].pf}).length;
 return "오늘 "+T.length+"문제 · 처음에 맞힘 "+ok+"/"+g.length+(wr.length?" · 틀린 문제 "+wr.join(","):"")+(fs.length?" · 5초 안에 제출하고 틀림 "+fs.join(","):"")+" · 연필 "+pn.length+"줄"+(pf?"(8초 안에 넘김 "+pf+"개)":"")+(st.mode==="full"?" · 전체 쓰기 모드":"")+" · 전체정답 "+(allDone()?"열림":"잠김")};
ld();
if(st.tab>=ST.length)st.tab=0;
render();
</script></body></html>
