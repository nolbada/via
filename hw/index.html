<title>주간 숙제 확인</title>
<style>
:root{
  --bg:#F1F3F0;--surface:#fff;--surface-2:#E9EDE9;--ink:#182420;--ink-soft:#5B6B62;--border:#DCE3DC;
  --bl:#1B63B8;--o:#1F7A5C;--o-soft:#DCEFE6;--x:#C22E1C;--x-soft:#FBE0DB;--t:#B7791F;--t-soft:#FBF0DA;--rest:#8A968F;
  --shadow:0 1px 2px rgba(24,36,32,.06),0 8px 24px -12px rgba(24,36,32,.18);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#121917;--surface:#1B2422;--surface-2:#22302B;--ink:#EAF0EC;--ink-soft:#96A79E;--border:#2B3733;
  --bl:#6AA8F0;--o:#4FBF95;--o-soft:#1B3630;--x:#F2735F;--x-soft:#3D1F1A;--t:#E3B05A;--t-soft:#3A2E17;--rest:#6F7D76;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px -12px rgba(0,0,0,.5);}}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:'Noto Sans KR','Apple SD Gothic Neo','Malgun Gothic',sans-serif;-webkit-font-smoothing:antialiased;padding-top:env(safe-area-inset-top,0)}
button,input,select{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;padding:20px 16px 64px;display:flex;flex-direction:column;gap:14px}
#app.wide{max-width:1040px}
.brand{display:flex;justify-content:space-between;align-items:baseline;font-size:12.5px;color:var(--ink-soft)}
.brand b{color:var(--ink)}
.card,.hero,.boardhead,.hist{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow)}
.hero{padding:20px}.card{padding:16px 16px 18px}.boardhead{padding:16px 18px;display:flex;flex-direction:column;gap:12px}
.hero-top{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.name{font-size:23px;font-weight:700;line-height:1.2}
.meta{font-size:13px;color:var(--ink-soft);margin-top:3px}
.tally{text-align:right;flex-shrink:0}
.tally-big{font-size:34px;font-weight:700;line-height:1;margin-top:4px;font-variant-numeric:tabular-nums}
.tally-sub{font-size:11.5px;color:var(--ink-soft);margin-top:4px}
.pass-line{margin-top:6px;font-weight:700;color:var(--ink)}
.s-o{color:var(--o)}.s-t{color:var(--t)}.s-x{color:var(--x)}
.weeknav{display:flex;align-items:center;justify-content:space-between;padding:6px;border-radius:12px;background:var(--surface-2);max-width:420px}
.weeknav button{border:0;background:transparent;font-size:18px;width:40px;height:36px;border-radius:9px;cursor:pointer}
.weeknav button:disabled{opacity:.25;cursor:default}
.weeknav button:not(:disabled):hover{background:var(--surface)}
.weeklabel{text-align:center;font-size:14.5px;font-weight:700}
.weeklabel small{display:block;font-size:11.5px;font-weight:500;color:var(--ink-soft)}
.lastcheck{margin-top:12px;font-size:12.5px;color:var(--ink-soft)}.lastcheck b{color:var(--ink)}
.praise{margin-top:12px;padding:11px 14px;border-radius:12px;font-size:14.5px;font-weight:700;text-align:center}
.praise.perfect{background:var(--o);color:#fff}.praise.done{background:var(--o-soft);color:var(--o)}
.praise.warn{background:var(--t-soft);color:var(--t)}.praise.sat{background:var(--x);color:#fff}
.card-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px}
.card-title{font-size:16px;font-weight:700}.card-sub{font-size:12px;color:var(--ink-soft);margin-left:6px;font-weight:500}
.card-frac{font-size:12.5px;font-weight:700;color:var(--ink-soft)}
.row{display:grid;gap:8px}.row.six{grid-template-columns:repeat(6,1fr)}.row.three{grid-template-columns:repeat(3,1fr)}.row.two{grid-template-columns:repeat(2,1fr);max-width:66%}
.slot{display:flex;flex-direction:column;align-items:center;gap:6px}
.slot-label{font-size:12px;color:var(--ink-soft);text-align:center;line-height:1.2}.slot-label b{display:block;color:var(--ink);font-size:13px}
.mark{position:relative;width:100%;max-width:56px;aspect-ratio:1;border-radius:50%;border:2px dashed var(--border);background:transparent;display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:var(--ink-soft);padding:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.mark.O{border:3px solid var(--o);background:var(--o-soft);color:var(--o)}
.mark.T{border:3px solid var(--t);background:var(--t-soft);color:var(--t)}
.mark.X{border:3px solid var(--x);background:var(--x-soft);color:var(--x)}
.mark.R{border:2px solid var(--border);background:var(--surface-2);color:var(--rest);font-size:16px}
.mark.N{border:3px solid var(--rest);background:var(--surface-2);color:var(--ink-soft);font-size:12px;letter-spacing:-.5px}
.mark.future{opacity:.35}
.mark.late::after{content:'보충';position:absolute;right:-6px;bottom:-4px;font-size:9.5px;line-height:1.3;font-weight:700;padding:0 4px;border-radius:6px;background:var(--surface);color:var(--o);border:1px solid var(--o)}
.mark:disabled{cursor:default}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12px;color:var(--ink-soft);padding:0 4px}
.legend span{display:inline-flex;align-items:center;gap:5px}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.dot.N{background:var(--rest);opacity:.6}.dot.O{background:var(--o)}.dot.T{background:var(--t)}.dot.X{background:var(--x)}.dot.R{background:var(--rest)}.dot.E{border:1.5px dashed var(--ink-soft)}
.h2{font-size:14px;font-weight:700;margin:6px 4px 0}
.hist{overflow:hidden}
.hist-row{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 16px;border:0;border-top:1px solid var(--border);width:100%;background:none;text-align:left;cursor:pointer}
.hist-row:first-child{border-top:0}.hist-row.current{background:var(--surface-2)}
.hist-date{font-size:13px;font-weight:700;white-space:nowrap}
.hist-stats{font-size:12px;color:var(--ink-soft);text-align:right;line-height:1.5}
.empty{padding:16px;font-size:13px;color:var(--ink-soft)}
.foot{text-align:center;font-size:11.5px;color:var(--ink-soft);line-height:1.6}

/* 선생님 도장판 */
.tabs{display:flex;flex-wrap:wrap;gap:8px}
.tab{--gc:var(--ink-soft);padding:8px 13px 8px 11px;border-radius:10px;background:var(--surface);border:1px solid var(--border);border-left:5px solid var(--gc);font-weight:700;font-size:13.5px;color:var(--ink);cursor:pointer;white-space:nowrap}
.tab.active{background:var(--gc);border-color:var(--gc);color:#fff}
.tab.all{--gc:var(--o);border-left:1px solid var(--border);padding:8px 16px}.tab.all.active{border-color:var(--o)}
.g-e6{--gc:#1f9d6b}.g-m1{--gc:#2f7ae0}.g-m2{--gc:#d98a0b}.g-m3{--gc:#d5465f}.g-h{--gc:#5b6b7f}
.nav{display:flex;flex-direction:column;gap:10px}
.tgrp{display:flex;align-items:flex-start;gap:12px;padding-top:10px;border-top:1px solid var(--border)}
.tgl{flex:none;width:44px;padding-top:9px;font-size:12px;font-weight:800;letter-spacing:.02em;color:var(--ink-soft)}
.tgrp .tabs{flex:1;gap:8px}
.lg{display:flex;flex-wrap:wrap;gap:12px;font-size:11.5px;color:var(--ink-soft);padding-top:2px}
.lg i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px;background:var(--gc);vertical-align:-1px}
.gridwrap{background:var(--surface);border:1px solid var(--border);border-radius:18px;box-shadow:var(--shadow);overflow-x:auto}
table.grid{border-collapse:separate;border-spacing:0;min-width:100%}
.grid th,.grid td{padding:6px 3px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.grid thead th{font-size:12px;color:var(--ink-soft);font-weight:500;background:var(--surface)}
.grid thead tr.grp th{font-size:12.5px;font-weight:700;color:var(--ink);border-bottom:0;padding-top:10px}
.grid .gsep{border-left:1px solid var(--border)}
.grid th.nm,.grid td.nm{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left;padding-left:12px;padding-right:10px;min-width:78px;font-weight:700;font-size:14.5px}
.grid td.sc{min-width:86px;padding:6px 10px}
.grid td.sc b{font-size:16px;font-variant-numeric:tabular-nums}.grid td.sc small{display:block;font-size:11px;color:var(--ink-soft);margin-top:1px}
.grid tbody tr:last-child td{border-bottom:0}
.cell{width:36px;height:36px;border-radius:50%;border:2px dashed var(--border);background:transparent;font-size:15px;font-weight:700;color:var(--ink-soft);padding:0;cursor:pointer;position:relative;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;touch-action:manipulation}
.cell.O{border:2.5px solid var(--o);background:var(--o-soft);color:var(--o)}
.cell.T{border:2.5px solid var(--t);background:var(--t-soft);color:var(--t)}
.cell.X{border:2.5px solid var(--x);background:var(--x-soft);color:var(--x)}
.cell.R{border:2px solid var(--border);background:var(--surface-2);color:var(--rest);font-size:12px}
.cell.N{border:2.5px solid var(--rest);background:var(--surface-2);color:var(--ink-soft);font-size:10px;letter-spacing:-.5px}
.cell.future{opacity:.3;cursor:default}
.na{color:var(--border);font-size:18px}
.ov td,.ov th{padding:9px 8px;text-align:center;border-bottom:1px solid var(--border);white-space:nowrap}
.ov th{font-size:12px;color:var(--ink-soft);font-weight:500}
.ov td.l{text-align:left;font-weight:700}
.ov tr.ck{cursor:pointer}.ov tr.ck:hover td{background:var(--surface-2)}
.ov .cn{font-size:12px;color:var(--ink-soft);font-weight:500;text-align:left;background:var(--surface-2)}
.part{color:var(--t);font-weight:700}
.cell.late::after{content:'보';position:absolute;right:-4px;bottom:-3px;font-size:9px;line-height:1.2;font-weight:700;padding:0 3px;border-radius:5px;background:var(--surface);color:var(--o);border:1px solid var(--o)}
.cell.hold{transform:scale(.9);transition:transform .15s}
.colh{border:0;background:none;cursor:pointer;font-size:12px;color:var(--ink-soft);padding:2px 4px;border-radius:6px}
.colh:hover{background:var(--surface-2)}

.rp-dot.bad{background:var(--x)}

.rp-dot.e{background:transparent;border:1.5px solid var(--border)}

.rp-alert{font-size:13.5px;font-weight:700;color:var(--x);background:var(--x-soft);border-radius:10px;padding:9px 12px;margin:12px 0 0;line-height:1.5}
.rp-alert.t{color:var(--t);background:var(--t-soft)}
.rp-note{font-size:12.5px;color:var(--ink-soft);margin:10px 0 0;line-height:1.55;white-space:pre-line;text-align:left}
</style>
</head>
<body>
<div id="app"></div>
<div id="savest" class="savest" hidden></div>
<script>
(function(){
'use strict';
var SRV='https://script.google.com/macros/s/AKfycbw1YQfKsgAXNk8NYoxOfz4bsCSy66fiim7HoFAUk162ksxrEbmspMs2UifNZ-93sdf05A/exec';
var DAYS=['일','월','화','수','목','금','토'], WD=['토','일','월','화','수','목'];
var CYCLE={'':'O','O':'T','T':'X','X':'','R':'O'}, VCYC={'':'O','O':'T','T':'X','X':'N','N':'','R':'O'}, LONG={'':'R','O':'R','T':'R','X':'R','N':'R','R':''};
var SYM={O:'O',T:'△',X:'X',N:'미지참',R:'쉼','':''};
var LATE_MS=10*60*1000, PASS_LINE='통과 70점 · 70점 미만 토요일 보충';
var Q=new URLSearchParams(location.search), LS=window.localStorage;
function g(k){try{return LS.getItem(k)}catch(e){return null}}
function s_(k,v){try{LS.setItem(k,v)}catch(e){}}

/* 날짜 */
function pad(n){return n<10?'0'+n:''+n}
function keyOf(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function parseKey(k){var p=k.split('-');return new Date(+p[0],+p[1]-1,+p[2])}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function weekStart(d){return addDays(d,-((d.getDay()+1)%7))}
function md(d){return (d.getMonth()+1)+'/'+d.getDate()}
function curKey(){return keyOf(weekStart(today()))}
function esc(x){return String(x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function fmtStamp(iso){if(!iso)return null;var d=new Date(iso);if(isNaN(d))return null;var h=d.getHours();return md(d)+'('+DAYS[d.getDay()]+') '+(h<12?'오전':'오후')+' '+(h%12||12)+':'+pad(d.getMinutes())}

/* 숙제 항목 */
function defItems(voc,bd){
  var a=[{k:'w',label:'단어',sub:'매일',type:'day',n:6},
    {k:'g',label:'문법',sub:'주 3회',n:3},
    {k:'b',label:'비단챌',sub:'예문 해석 주 3회'+(bd?' · '+bd.join('·')+'까지':''),n:3,labels:bd||null},
    {k:'l',label:'듣기',sub:'주 3회',n:3}];
  if(voc)a.push({k:'v',label:'보카링크',sub:'주 2회 · 화·목까지',n:2,labels:['화','목'],vc:1});
  return a;
}
function nOf(it){return it.type==='day'?6:Math.max(1,Math.min(6,+it.n||1))}
function arrOf(r,k,n){var a=r[k];if(!Array.isArray(a)){a=r[k]=[]}while(a.length<n)a.push('');return a}
function ensure(r,items){items.forEach(function(it){arrOf(r,it.k,nOf(it))});r.xd=r.xd||{};r.lt=r.lt||{};r.ck=r.ck||'';return r}
function cloneJ(x){return JSON.parse(JSON.stringify(x))}
function itemsOfMeta(m){return(m.items&&m.items.length)?m.items:defItems(!!m.vocalink,m.bidanDays)}
function hasN(items){return items.some(function(it){return it.vc})}
function slotInfo(it,i,start,teacher){
  if(it.type==='day'){var d=addDays(start,i);return {lb:'<b>'+WD[i]+'</b>'+md(d),fut:d>today()}}
  var l=it.labels&&it.labels[i];
  if(l)return {lb:'<b>'+esc(l)+'</b>',fut:false};
  return {lb:teacher?'<b>'+(i+1)+'</b>회':'<b>'+(i+1)+'회</b>',fut:false};
}
function rowCls(n){return n===6?'row six':(n===3?'row three':'row')}
function rowSty(n){return(n===6||n===3)?'':' style="grid-template-columns:repeat('+n+',1fr);max-width:'+Math.min(100,n*33.4)+'%"'}

/* 점수 */
function score(r,items){
  var sum=0,n=0;
  items.forEach(function(it){var a=r[it.k]||[],m=nOf(it);for(var i=0;i<m;i++){var v=a[i]||'',late=!!(r.lt&&r.lt[it.k+i]);
    if(v==='O'){sum+=late?0.75:1;n++}else if(v==='T'){sum+=0.5;n++}else if(v==='X'||v==='N'){n++}}});
  return n?{pct:Math.round(sum/n*100),n:n}:null;
}
function valsOf(r,items){var vals=[];items.forEach(function(it){var a=r[it.k]||[],m=nOf(it);for(var i=0;i<m;i++)vals.push(a[i]||'')});return vals}
function status(r,items){
  var vals=valsOf(r,items),late=false;
  for(var k in r.lt){if(r.lt[k])late=true}
  if(!vals.every(function(v){return v==='O'||v==='R'}))return null;
  if(!vals.some(function(v){return v==='O'}))return null;
  return late?'done':'perfect';
}
function judged(k){return k<curKey()||today().getDay()===5}
function cls(p){return p>=80?'o':(p>=70?'t':'x')}
function cnt(arr){var o=0,t=0;arr.forEach(function(v){if(v!=='R'){t++;if(v==='O')o++}});return [o,t]}
function cntIt(r,it){return cnt((r[it.k]||[]).slice(0,nOf(it)))}

/* 보충 판정 (X·△ 였다가 10분 이상 지나 O로 바뀌면 보충) */
function trackLate(r,key,prev,nv){
  var now=new Date(),tk=keyOf(today()),x=r.xd[key],was=false;
  if(x){was=(x.length===10)?(x<=tk):((now-new Date(x))>=LATE_MS)}
  if(nv==='O'&&(prev==='X'||prev==='T'||prev==='N'||prev==='')&&was)r.lt[key]=1;
  if(nv!=='O')delete r.lt[key];
  if(nv==='X'||nv==='T'||nv==='N'){if(!x)r.xd[key]=now.toISOString()}
  else if(nv==='O'||nv==='R'){delete r.xd[key]}
}

/* 서버 */
function post(body,keep){
  return fetch(SRV,{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify(body),keepalive:!!keep})
    .then(function(r){return r.json()}).then(function(r){if(!r||!r.ok)throw new Error('srv');return r});
}
function readAll(id){return post({act:'put',id:id,data:{}}).then(function(r){return r.data||{}})}
function unwrap(v){return(v&&typeof v==='object'&&typeof v.s==='string')?v.s:null}
function putKeys(id,map){var d={},t=Date.now();for(var k in map)d[k]={v:{s:JSON.stringify(map[k])},t:t};return post({act:'put',id:id,data:d})}

/* 공통 상태 */
var app=document.getElementById('app'),stEl=document.getElementById('savest');
var viewKey=curKey(),showOld=false;
function setSt(txt,err){if(!txt){stEl.hidden=true;return}stEl.hidden=false;stEl.textContent=txt;stEl.className='savest'+(err?' err':'')}
function randTok(n){var a='abcdefghjkmnpqrstuvwxyz23456789',o='';var u=new Uint8Array(n);(window.crypto||window.msCrypto).getRandomValues(u);for(var i=0;i<n;i++)o+=a[u[i]%a.length];return o}

/* ================= 학부모(조회) ================= */
function weekNav(start,end,isCur,showNav){
  var h='<div class="weeknav"><button data-nav="-1" aria-label="이전 주">‹</button><div class="weeklabel">'+md(start)+'(토) – '+md(end)+'(목)<small>'+(isCur?'이번 주':Math.round((parseKey(curKey())-start)/604800000)+'주 전')+'</small></div><button data-nav="1" aria-label="다음 주"'+(isCur?' disabled':'')+'>›</button></div>';
  return h;
}
function slot(label,val,fut,late,attrs){
  return '<div class="slot"><div class="slot-label">'+label+'</div><button class="mark '+(val||'')+(fut?' future':'')+(val==='O'&&late?' late':'')+'" disabled tabindex="-1">'+esc(SYM[val||''])+'</button></div>';
}
function parentView(meta,weeks){
  var cur=curKey(); if(viewKey>cur)viewKey=cur;
  var start=parseKey(viewKey),end=addDays(start,5),isCur=viewKey===cur;
  var FL=itemsOfMeta(meta);
  var r=ensure(cloneJ(weeks[viewKey]||{}),FL),sc=score(r,FL),pct=sc?sc.pct:null;
  var allCk=''; Object.keys(weeks).forEach(function(k){var c=(weeks[k]||{}).ck||'';if(c>allCk)allCk=c});
  var h='<div class="brand"><span>주간 숙제 확인</span><b>'+esc(pcls(meta.cls))+'</b></div>';
  h+='<div class="hero"><div class="hero-top"><div><div class="name">'+esc(meta.name)+'</div><div class="meta">'+esc(pcls(meta.cls))+'</div></div>';
  h+='<div class="tally"><div class="tally-sub">'+(isCur?'이번 주':'이 주')+' 숙제 점수</div><div class="tally-big"><span class="s-'+(pct===null?'':cls(pct))+'">'+(pct===null?'–':pct+'점')+'</span></div><div class="tally-sub">'+(sc?'검사한 '+sc.n+'개 기준':'아직 검사 전')+'</div><div class="tally-sub pass-line">'+PASS_LINE+'</div></div></div>';
  h+='<div style="margin-top:16px">'+weekNav(start,end,isCur)+'</div>';
  var st=fmtStamp(allCk);
  h+='<div class="lastcheck">'+(st?'마지막 검사 <b>'+esc(st)+'</b>':'아직 검사 기록이 없어요')+'</div>';
  var ws=status(r,FL),jd=judged(viewKey)&&pct!==null,wl=isCur?'이번 주':'이 주';
  if(ws==='perfect')h+='<div class="praise perfect">'+wl+' 숙제 완벽해요</div>';
  else if(jd&&pct<70)h+='<div class="praise sat">토요일 보충 1회 대상이에요</div>';
  else if(jd&&pct<80)h+='<div class="praise warn">숙제 점검이 필요해요</div>';
  else if(ws==='done')h+='<div class="praise done">밀린 숙제까지 다 해냈어요</div>';
  h+='</div>';
  FL.forEach(function(it){
    var n=nOf(it),a=r[it.k],c=cntIt(r,it);
    h+='<div class="card"><div class="card-head"><div class="card-title">'+esc(it.label)+'<span class="card-sub">'+esc(it.sub||'')+'</span></div><div class="card-frac">'+c[0]+' / '+c[1]+' 완료</div></div><div class="'+rowCls(n)+'"'+rowSty(n)+'>';
    for(var i=0;i<n;i++){var si=slotInfo(it,i,start,false);h+=slot(si.lb,a[i],si.fut,!!r.lt[it.k+i])}
    h+='</div></div>';
  });
  h+='<div class="legend"><span><i class="dot O"></i>했어요</span><span><i class="dot T"></i>기준 미달</span><span><i class="dot X"></i>안 했어요</span>'+(hasN(FL)?'<span><i class="dot N"></i>교재 미지참</span>':'')+'<span><i class="dot R"></i>쉬는 날</span><span><i class="dot E"></i>검사 전</span></div>';
  var keys=Object.keys(weeks).sort().reverse(),prev=keyOf(addDays(parseKey(cur),-7));
  h+='<div class="h2">주별 기록</div><div class="hist">';
  if(!keys.length)h+='<div class="empty">검사를 시작하면 주별 기록이 여기에 쌓여요.</div>';
  function row(k){
    var w=ensure(cloneJ(weeks[k]||{}),FL),sc2=score(w,FL),hp=sc2?sc2.pct:null,x='';
    if(hp!==null)x=' · <b class="s-'+cls(hp)+'">'+hp+'점</b>';
    var s2=status(w,FL),hj=judged(k)&&hp!==null;
    if(s2==='perfect')x+=' · 완벽';else if(hj&&hp<70)x+=' · 토요일 보충';else if(hj&&hp<80)x+=' · 주의';else if(s2==='done')x+=' · 보충 완료';
    var tag=k===cur?' (이번 주)':(k===prev?' (지난주)':'');
    var st2=FL.map(function(it){var q=cntIt(w,it);return esc(it.label)+' '+q[0]+'/'+q[1]}).join(' · ');
    return '<button class="hist-row'+(k===viewKey?' current':'')+'" data-go="'+k+'"><span class="hist-date">'+md(parseKey(k))+' – '+md(addDays(parseKey(k),5))+tag+'</span><span class="hist-stats">'+st2+x+'</span></button>';
  }
  var recent=keys.filter(function(k){return k>=prev}),older=keys.filter(function(k){return k<prev});
  recent.forEach(function(k){h+=row(k)});
  if(older.length){h+='<button class="hist-row" data-more="1"><span class="hist-date">'+(showOld?'이전 기록 접기':'이전 기록 '+older.length+'주 펼치기')+'</span><span class="hist-stats">'+(showOld?'▲':'▼')+'</span></button>';if(showOld)older.forEach(function(k){h+=row(k)})}
  h+='</div><div class="foot">선생님이 수업 시간마다 검사한 결과가 표시돼요.<br>비타민 영어클리닉</div>';
  return h;
}

function pcls(c){c=c||'';var m=c.match(/^\s*(M|T|월수금|화목금)?\s*((?:초|중|고)\s*\d)/);if(!m)return c;var g=(m[1]==='M'||m[1]==='월수금')?' 월수금 반':((m[1]==='T'||m[1]==='화목금')?' 화목금 반':'');return m[2].replace(/\s+/g,'')+g}
/* ===== 주간 리포트(클래스카드 기록 기반) ===== */
function rpPill(c,t){return '<span class="rp-pill '+c+'">'+esc(t)+'</span>'}
function rpDots(arr,start,mode){
  var h='';
  for(var i=0;i<6;i++){var v=arr&&arr[i]||0;h+='<div class="c"><span class="rp-dot'+(v===2?' bad':(v?'':' e'))+'"></span></div>'}
  return h;
}
function rpMins(arr){
  var h='';
  for(var i=0;i<6;i++){var v=arr&&arr[i]||0;h+='<div class="c">'+(v>0?'<span class="rp-m">'+v+'<small>분</small></span>':'<span class="rp-dot e"></span>')+'</div>'}
  return h;
}
function rpSetCnt(sets,days){

    act().sort(function(a,b){return (a.cls+'|'+a.name).localeCompare(b.cls+'|'+b.name,'ko')}).forEach(function(S){
      h+='<div class="stl"><span class="stn"><input class="ed" data-nm="'+S.id+'" value="'+esc(S.name)+'" size="7" aria-label="이름"><input class="ed" data-cl="'+S.id+'" list="cls" value="'+esc(S.cls)+'" size="12" aria-label="반"></span><span class="stb"><button class="btn" data-link="'+S.id+'">학부모 링크</button><button class="btn sub" data-off="'+S.id+'">퇴원</button></span></div>';
    });
    h+='</div>';
    var offs=roster.filter(function(s){return s.off});
    if(offs.length){
      h+='<div class="h3">퇴원 · 숨김 '+offs.length+'명</div>';
      offs.forEach(function(S){h+='<div class="stl"><span>'+esc(S.name)+' <small style="color:var(--ink-soft)">'+esc(S.cls)+'</small></span><button class="btn sub" data-on="'+S.id+'">복귀</button></div>'});
    }
    if(cl.length){
      h+='<div class="h3">반 이름 바꾸기</div><div class="line"><select id="rc">'+cl.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</select><input id="rn" placeholder="새 반 이름" size="14"><button class="btn" id="rcb">변경</button></div>';
    }
    return h+'</details>';
  }
  function itemsHTML(cl){
    if(!draft||draft.cls!==selCls)draft={cls:selCls,items:cloneJ(itemsOf(selCls))};
    var h='<details class="mgr" data-m="items"'+(mgrOpen.items?' open':'')+'><summary>숙제 항목 편집</summary>';
    draft.items.forEach(function(it,ix){
      var isDay=it.type==='day',n=nOf(it),opts='';
      for(var q=1;q<=6;q++)opts+='<option value="'+q+'"'+(!isDay&&n===q?' selected':'')+'>'+q+'칸</option>';
      opts+='<option value="day"'+(isDay?' selected':'')+'>매일(요일별 6칸)</option>';
      h+='<div class="itm" data-ix="'+ix+'"><input class="ed" data-f="label" value="'+esc(it.label||'')+'" placeholder="항목 이름" size="8"><select data-f="n">'+opts+'</select>';
      h+='<input class="ed" data-f="labels" value="'+esc((it.labels||[]).join(','))+'" placeholder="칸 이름 (예: 화,목,금)" size="12"'+(isDay?' disabled':'')+'>';
      h+='<input class="ed" data-f="sub" value="'+esc(it.sub||'')+'" placeholder="설명 (예: 주 3회)" size="14">';
      h+='<label class="chk"><input type="checkbox" data-f="vc"'+(it.vc?' checked':'')+'> 미지참 칸</label>';
      h+='<span class="stb"><button class="btn sub" data-mv="-1"'+(ix===0?' disabled':'')+'>위</button><button class="btn sub" data-mv="1"'+(ix===draft.items.length-1?' disabled':'')+'>아래</button><button class="btn sub" data-rm="1">삭제</button></span></div>';
    });
    h+='<div class="line"><button class="btn sub" id="itadd">항목 추가</button><button class="btn" id="itsave">저장</button>';
    var oth=cl.filter(function(c){return c!==selCls});
    if(oth.length)h+='<select id="itcp">'+oth.map(function(c){return '<option>'+esc(c)+'</option>'}).join('')+'</select><button class="btn sub" id="itcpb">이 항목을 그 반에도 적용</button>';
    h+='<button class="btn sub" id="itreset">처음 상태로</button></div>';
    return h+'</details>';
  }
  var keepX=0,keepSig='';
  function draw(){
    var gw=app.querySelector('.gridwrap'),sig=selCls+'|'+viewKey,y=window.pageYOffset;
    if(gw&&sig===keepSig)keepX=gw.scrollLeft;else keepX=0;
    drawBoard();
    keepSig=selCls+'|'+viewKey;
    var g2=app.querySelector('.gridwrap');
    if(g2&&keepX)g2.scrollLeft=keepX;
    if(sig===keepSig&&y)window.scrollTo(0,y);
  }
  function drawBoard(){
    var cur=curKey();if(viewKey>cur)viewKey=cur;
    var cl=classes();if(!selCls||(selCls!=='__all'&&cl.indexOf(selCls)<0))selCls=cl[0]||'';
    var start=parseKey(viewKey),end=addDays(start,5),isCur=viewKey===cur;
    var h='<div class="brand"><span>주간 숙제 확인</span><b>선생님 입력</b></div>';
    h+='<div class="boardhead">'+weekNav(start,end,isCur)+'<div class="nav"><div class="tabs"><button class="tab all'+(selCls==='__all'?' active':'')+'" data-cls="__all">전체 현황</button></div>';
    [['월수금',0],['화목금',1],['기타',2]].forEach(function(G){var gl=cl.filter(function(c){return grpOf(c)===G[1]});if(!gl.length)return;
      h+='<div class="tgrp"><span class="tgl">'+G[0]+'</span><div class="tabs">';
      var pg=null;gl.forEach(function(c){var gc=gcls(c);pg=gc;h+='<button class="tab '+gc+(c===selCls?' active':'')+'" data-cls="'+esc(c)+'">'+esc(c)+'</button>'});
      h+='</div></div>'});
    h+='<div class="lg"><span class="g-e6"><i></i>초6</span><span class="g-m1"><i></i>중1</span><span class="g-m2"><i></i>중2</span><span class="g-m3"><i></i>중3</span></div>';
    h+='</div></div>';
    var L=stu();
    if(selCls==='__all'||!selCls){h+=overviewHTML(cl);h+=mgrHTML(cl);h+='<div class="foot">비타민 영어클리닉</div>';app.className='wide';app.innerHTML=h;bind();return}
    var TF=itemsOf(selCls);
    h+='<div class="gridwrap"><table class="grid"><thead><tr class="grp"><th class="nm"></th>';
    TF.forEach(function(it){h+='<th colspan="'+nOf(it)+'" class="gsep">'+esc(it.label)+'</th>'});
    h+='<th class="gsep">점수</th></tr><tr><th class="nm"></th>';
    TF.forEach(function(it){
      for(var i=0;i<nOf(it);i++){
        var si=slotInfo(it,i,start,true);
        h+='<th'+(i===0?' class="gsep"':'')+'><button class="colh" data-bulk="'+esc(it.k)+':'+i+'"'+(si.fut?' disabled':'')+'>'+si.lb+'</button></th>';
      }
    });
    h+='<th class="gsep"></th></tr></thead><tbody>';
    if(!L.length)h+='<tr><td class="nm" colspan="40" style="padding:16px">'+(loaded?'이 반에 학생이 없어요':'불러오는 중…')+'</td></tr>';
    L.forEach(function(S){
      var r=getRec(S.id,viewKey),sc=score(r,TF),pct=sc?sc.pct:null,jd=judged(viewKey)&&pct!==null,note='';
      if(status(r,TF)==='perfect')note='완벽';else if(jd&&pct<70)note='토요일 보충';else if(jd&&pct<80)note='주의';
      h+='<tr><td class="nm">'+esc(S.name)+'</td>';
      TF.forEach(function(it){
        for(var i=0;i<nOf(it);i++){
          var fut=it.type==='day'&&addDays(start,i)>today();
          h+='<td'+(i===0?' class="gsep"':'')+'>'+cellBtn(S,it,i,fut)+'</td>';
        }
      });
      h+='<td class="sc gsep"><b class="s-'+(pct===null?'':cls(pct))+'">'+(pct===null?'–':pct+'점')+'</b><small>'+esc(note)+'</small></td></tr>';
    });
    h+='</tbody></table></div>';
    h+='<div class="legend"><span><i class="dot O"></i>했어요</span><span><i class="dot T"></i>기준 미달</span><span><i class="dot X"></i>안 했어요</span>'+(hasN(TF)?'<span><i class="dot N"></i>교재 미지참</span>':'')+'<span><i class="dot R"></i>쉼</span><span><i class="dot E"></i>검사 전</span></div>';
    h+=itemsHTML(cl);
    h+=mgrHTML(cl);
    h+='<div class="foot">비타민 영어클리닉</div>';
    app.className='wide';app.innerHTML=h;bind();
  }
  function cleanItems(items){
    var out=[],bad=null;
    items.forEach(function(it,ix){
      var lb=(it.label||'').trim();if(!lb){bad='항목 이름을 모두 입력해 주세요';return}
      var o={k:it.k,label:lb,sub:(it.sub||'').trim()};
      if(it.type==='day'){o.type='day';o.n=6}else{o.n=nOf(it)}
      if(it.type!=='day'&&it.labels&&it.labels.length){var ls=it.labels.slice(0,o.n);if(ls.some(function(x){return x}))o.labels=ls}
      if(it.vc)o.vc=1;
      out.push(o);
    });
    if(!out.length)bad='항목이 하나는 있어야 해요';
    return {items:out,bad:bad};
  }
  function bind(){
    app.querySelectorAll('[data-nav]').forEach(function(b){b.onclick=function(){viewKey=keyOf(addDays(parseKey(viewKey),7*(+b.getAttribute('data-nav'))));draw()}});
    app.querySelectorAll('[data-cls]').forEach(function(b){b.onclick=function(){selCls=b.getAttribute('data-cls');s_('hw_cls',selCls);draw()}});
    app.querySelectorAll('[data-jump]').forEach(function(b){b.onclick=function(){selCls=b.getAttribute('data-jump');s_('hw_cls',selCls);draw();window.scrollTo({top:0})}});
    app.querySelectorAll('details.mgr').forEach(function(d){d.addEventListener('toggle',function(){mgrOpen[d.getAttribute('data-m')]=d.open})});
    app.querySelectorAll('.cell[data-s]').forEach(function(el){
      var timer=null,fired=false,S=findS(el.getAttribute('data-s')),k=el.getAttribute('data-f'),i=+el.getAttribute('data-i');
      var it=itemsOf(S.cls).filter(function(x){return x.k===k})[0];
      function stop(){if(timer){clearTimeout(timer);timer=null}el.classList.remove('hold')}
      el.addEventListener('pointerdown',function(){fired=false;el.classList.add('hold');timer=setTimeout(function(){fired=true;timer=null;el.classList.remove('hold');setCell(S,k,i,LONG[getRec(S.id,viewKey)[k][i]||'']);draw()},550)});
      ['pointerup','pointerleave','pointercancel'].forEach(function(e){el.addEventListener(e,stop)});
      el.addEventListener('contextmenu',function(e){e.preventDefault()});
      el.addEventListener('click',function(e){if(fired){fired=false;e.preventDefault();return}var v=getRec(S.id,viewKey)[k][i]||'';setCell(S,k,i,((it&&it.vc)?VCYC:CYCLE)[v]);draw()});
    });
    app.querySelectorAll('[data-bulk]').forEach(function(b){b.onclick=function(){
      var p=b.getAttribute('data-bulk').split(':'),k=p[0],i=+p[1],L=stu(),n=0;
      L.forEach(function(S){if(!getRec(S.id,viewKey)[k][i])n++});
      if(!n)return;
      if(!window.confirm(selCls+' 빈칸 '+n+'개를 모두 O로 채울까요?'))return;
      L.forEach(function(S){if(!getRec(S.id,viewKey)[k][i])setCell(S,k,i,'O')});draw();
    }});
    /* 학생 관리 */
    var add=document.getElementById('add');
    if(add)add.onclick=function(){
      var nm=(document.getElementById('nn').value||'').trim(),c=(document.getElementById('nc').value||'').trim();
      if(!nm||!c)return;
      roster.push({id:randTok(8),name:nm,cls:c,tok:randTok(16)});selCls=c;mgrOpen.stu=true;mark('roster');draw();
    };
    app.querySelectorAll('[data-nm]').forEach(function(el){el.addEventListener('change',function(){
      var S=findS(el.getAttribute('data-nm')),v=(el.value||'').trim();if(!S||!v){draw();return}
      if(S.name!==v){S.name=v;mark('roster');draw()}
    })});
    app.querySelectorAll('[data-cl]').forEach(function(el){el.addEventListener('change',function(){
      var S=findS(el.getAttribute('data-cl')),v=(el.value||'').trim();if(!S||!v){draw();return}
      if(S.cls!==v){S.cls=v;selCls=v;s_('hw_cls',selCls);mark('roster');draw()}
    })});
    app.querySelectorAll('[data-off]').forEach(function(b){b.onclick=function(){
      var S=findS(b.getAttribute('data-off'));if(!S)return;
      if(!window.confirm(S.name+' 학생을 퇴원 처리할까요? 기록은 그대로 보존돼요.'))return;
      S.off=true;mark('roster');draw();
    }});
    app.querySelectorAll('[data-on]').forEach(function(b){b.onclick=function(){
      var S=findS(b.getAttribute('data-on'));if(!S)return;delete S.off;mark('roster');draw();
    }});
    var rcb=document.getElementById('rcb');
    if(rcb)rcb.onclick=function(){
      var o=document.getElementById('rc').value,n=(document.getElementById('rn').value||'').trim();
      if(!o||!n||o===n)return;
      if(!window.confirm('"'+o+'" 반 이름을 "'+n+'"(으)로 바꿀까요?'))return;
      roster.forEach(function(S){if(S.cls===o)S.cls=n});
      if(cfg[o]){cfg[n]=cfg[o];delete cfg[o];mark('cfg')}
      if(selCls===o)selCls=n;s_('hw_cls',selCls);draft=null;mark('roster');draw();
    };
    app.querySelectorAll('[data-link]').forEach(function(b){b.onclick=function(){
      var S=findS(b.getAttribute('data-link')),u=location.origin+location.pathname+'?s='+S.tok;
      function done(){b.textContent='복사됨'}
      if(navigator.clipboard&&navigator.clipboard.writeText)navigator.clipboard.writeText(u).then(done,function(){window.prompt('링크',u)});else window.prompt('링크',u);
    }});
    /* 숙제 항목 편집 */
    app.querySelectorAll('.itm').forEach(function(row){
      var ix=+row.getAttribute('data-ix'),it=draft&&draft.items[ix];if(!it)return;
      row.querySelectorAll('input[data-f]').forEach(function(inp){
        inp.addEventListener('input',function(){
          var f=inp.getAttribute('data-f');
          if(f==='label')it.label=inp.value;
          else if(f==='sub')it.sub=inp.value;
          else if(f==='vc')it.vc=inp.checked?1:0;
          else if(f==='labels')it.labels=inp.value.split(/[,\s·]+/).filter(function(x){return x});
        });
      });
      var sel=row.querySelector('select[data-f="n"]');
      sel.addEventListener('change',function(){
        if(sel.value==='day'){it.type='day';it.n=6}else{delete it.type;it.n=+sel.value}
        mgrOpen.items=true;draw();
      });
      row.querySelectorAll('[data-mv]').forEach(function(b){b.onclick=function(){
        var d=+b.getAttribute('data-mv'),j=ix+d;if(j<0||j>=draft.items.length)return;
        var t=draft.items[ix];draft.items[ix]=draft.items[j];draft.items[j]=t;mgrOpen.items=true;draw();
      }});
      row.querySelectorAll('[data-rm]').forEach(function(b){b.onclick=function(){
        if(!window.confirm('"'+(it.label||'이 항목')+'" 항목을 뺄까요? 기존 기록은 보존되지만 화면과 점수에서는 빠져요.'))return;
        draft.items.splice(ix,1);mgrOpen.items=true;draw();
      }});
    });
    var ia=document.getElementById('itadd');
    if(ia)ia.onclick=function(){draft.items.push({k:'z'+randTok(4),label:'',sub:'',n:3});mgrOpen.items=true;draw()};
    var is=document.getElementById('itsave');
    if(is)is.onclick=function(){
      var res=cleanItems(draft.items);if(res.bad){window.alert(res.bad);return}
      cfg[draft.cls]=res.items;mark('cfg');draft=null;draw();
    };
    var ic=document.getElementById('itcpb');
    if(ic)ic.onclick=function(){
      var res=cleanItems(draft.items);if(res.bad){window.alert(res.bad);return}
      var to=document.getElementById('itcp').value;
      if(!window.confirm('"'+to+'" 반의 숙제 항목을 이 반과 같게 바꿀까요?'))return;
      cfg[draft.cls]=res.items;cfg[to]=cloneJ(res.items);mark('cfg');draft=null;draw();
    };
    var ir=document.getElementById('itreset');
    if(ir)ir.onclick=function(){
      if(!window.confirm('이 반의 항목 설정을 처음 상태로 되돌릴까요?'))return;
      delete cfg[selCls];mark('cfg');draft=null;draw();
    };
  }
  window.addEventListener('beforeunload',function(e){if(Object.keys(dirty).length){e.preventDefault();e.returnValue=''}});
  document.addEventListener('visibilitychange',function(){if(document.hidden&&Object.keys(dirty).length)flush()});
  app.innerHTML='<div class="hero"><div class="meta">불러오는 중…</div></div>';
  pull().then(draw,function(){app.innerHTML='<div class="hero"><div class="name">불러오지 못했어요</div><div class="meta">인터넷 연결을 확인하고 다시 열어 주세요.</div></div>'});
  setInterval(function(){if(document.hidden||saving||Object.keys(dirty).length)return;pull().then(function(){var a=document.activeElement;if(!a||(a.tagName!=='INPUT'&&a.tagName!=='SELECT'))draw()},function(){})},30000);
}

/* ================= 진입 ================= */
(function(){
  var tok=Q.get('s');
  if(tok){runParent(tok);return}
  var m=/(?:^|[#&])k=([A-Za-z0-9]{8,})/.exec(location.hash);
  if(m){s_('hw_code',m[1]);try{history.replaceState(null,'',location.pathname+location.search)}catch(e){}}
  var code=g('hw_code');
  if(code){runTeacher(code);return}
  app.innerHTML='<div class="gate"><div class="name">선생님 입력</div><div class="meta">열기 코드를 한 번 입력하면 이 기기에 저장돼요.</div><input id="kc" type="password" autocomplete="off" placeholder="열기 코드"><button class="btn" id="go">열기</button></div>';
  document.getElementById('go').onclick=function(){var v=(document.getElementById('kc').value||'').trim();if(/^[A-Za-z0-9]{8,}$/.test(v)){s_('hw_code',v);location.reload()}};
})();
})();
</script>
