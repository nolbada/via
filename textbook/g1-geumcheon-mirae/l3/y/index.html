ncher는 계속 그림을 그렸고, 기혼 여성은 가사에만 집중해야 한다는 사회적 압력에 맞섰다."}]}];

function wrongHtml(D){const L=D.s.filter(q=>S[q.id]&&S[q.id].w);
 if(!L.length)return '<div class="wbox"><div class="wt">오늘 틀린 문장</div><p class="wnone">오늘 틀린 문장이 없습니다. 모두 잘 해냈어요.</p></div>';
 return '<div class="wbox"><div class="wt">오늘 틀린 문장 '+L.length+'개</div><p class="wsub">오답 노트에 영어 문장과 해석을 옮겨 적으세요.</p>'+L.map(q=>'<div class="wrow"><span class="wn">'+q.n+'번</span><div><div class="wen">'+esc(q.en.replace(/ \/ /g,' '))+'</div><div class="wko">'+esc(q.nat||q.ko)+'</div>'+(S[q.id].r?'<div class="wwhy">틀린 부분: '+esc(S[q.id].r)+'</div>':'')+'</div></div>').join('')+'</div>'}
document.addEventListener('click',function(e){const t=e.target.closest&&e.target.closest('#tg');if(t){const b=document.getElementById('tgb');b.hidden=!b.hidden;t.textContent=b.hidden?'오늘의 문장 다시보기':'접기'}});
function stampInner(D){const d=D.d,st=S['D'+d];const all=D.s.every(q=>isDone(q.id));
 return st?stampHtml(d,st)+scoreHtml(D)+noteBlockY(D):'<button class="btn'+(all?'':' dis')+'" id="mk"'+(all?'':' disabled')+'>3과 핵심 7문장 노트 완성</button>'+(all?'':'<p class="small">7문장을 모두 확인하면 완성 도장을 받을 수 있습니다.</p>')}
function wireStamp(D){const d=D.d;const mk=document.getElementById('mk');if(mk)mk.onclick=()=>{const n=new Date();const v={m:n.getMonth()+1,d:n.getDate(),w:WD[n.getDay()],h:n.getHours(),i:n.getMinutes()};S['D'+d]=v;save();document.getElementById('st').innerHTML=stampHtml(d,v)+scoreHtml(D)+noteBlockY(D)}}
function cfInline(id){const x=CF.find(y=>y.id==id);if(!x)return '';return '<div class="cfn"><p class="sec">cf. 노트</p><p class="sec2">이해하기 (읽기만)</p>'+card(x)+fbox(id)+'</div>'}
function show(D,id){const c=document.getElementById('sc-'+id);c.hidden=false;const s=D.s.find(q=>q.id==id);
 if(!ST[id])ST[id]={v:new Set(),g:new Set(),p:0,r:false,done:isDone(id)&&false};
 const st=ST[id];
 if(isDone(id)&&!st.r&&!st.redo){c.innerHTML='<div class="card"><div class="nh"><b>Day '+D.d+' · '+s.n+'번</b><span class="badge">완료</span></div><p class="ctl">이 문장은 확인을 마쳤습니다.</p><button class="fx" data-redo="1">다시 해 보기</button></div>';const r=c.querySelector('[data-redo]');r.onclick=()=>{st.redo=true;st.v=new Set();st.g=new Set();st.p=0;st.r=false;show(D,id)};return}
 c.innerHTML=sentCard(D,s,st);wire(D,s,st,c)}
function sentCard(D,s,st){const W=wordsOf(s);const A=ans(s);const AV=new Set(VB[s.id]||[]);
 let h='<div class="card"><div class="nh"><b>Day '+D.d+' · '+s.n+'번</b>'+(st.done?'<span class="badge">완료</span>':'')+'</div>';
 if(!st.r&&st.p==0){
  h+='<p class="lab"><span class="pill p-key">1) 동사 치기</span></p><div class="wrd">'+W.map((w,i)=>'<button class="vw'+(st.v.has(i)?' on':'')+'" data-v="'+i+'">'+esc(w)+'</button>').join(' ')+'</div>'+
  '<p class="ctl">동사를 모두 누르면 자동으로 다음으로 넘어갑니다. 조동사와 본동사, 구동사(handed in)는 한 번만 눌러도 함께 선택됩니다.</p><button class="btn dis nx" disabled>다음: 슬래시 긋기</button>';
 }else if(!st.r){
  h+='<p class="lab"><span class="pill p-key">2) 슬래시로 끊어 읽기</span></p><div class="wrd">'+W.map((w,i)=>'<span class="vw'+(st.v.has(i)?' on':'')+'">'+esc(w)+'</span>'+(i<W.length-1?'<button class="gp'+(st.g.has(i)?' on':'')+'" data-g="'+i+'"></button>':'')).join('')+'</div>'+
  '<p class="ctl">끊어 읽을 곳을 누르면 슬래시가 들어가고, 다 끊으면 정답이 자동으로 열립니다.</p><p class="step">슬래시 단위로 한글 직역과 자연스러운 해석은 노트에 연필로 씁니다.</p><button class="btn dis rv" disabled>정답 보기</button><p class="ctl lk"></p><button class="fx bk1">동사 다시 고르기</button>';
 }else{
  const vc=i=>{const a=AV.has(i),m=st.v.has(i);return a&&m?'vok':a?'vms':m?'vex':''};
  h+='<p class="lab"><span class="pill p-nat">정답과 비교</span></p><div class="wrd">'+W.map((w,i)=>{const t='<span class="vw '+vc(i)+((SF[s.id]||[]).includes(i)?' sft':'')+'">'+esc(w)+'</span>';if(i<W.length-1){const a=A.has(i),m=st.g.has(i);const c=a&&m?'ok':a?'miss':m?'ex':'';return t+'<button class="gp '+c+'" disabled></button>'}return t}).join('')+'</div>'+
  '<p class="ctl">밑줄이 동사입니다. 초록은 맞힌 동사, 노랑은 놓친 동사, 빨강 취소선은 동사가 아닌데 고른 것입니다. 슬래시는 초록이 같이 끊은 곳, 노랑이 놓친 곳, 빨강이 더 끊은 곳입니다. 끊는 위치가 조금 달라도 의미 덩어리로 읽었다면 괜찮습니다. 연한 점선은 동사 뒤에 늘 붙어 다니는 전치사로, 동사로 세지는 않지만 함께 외우면 좋습니다.</p>'+
  '<p class="sec">직독직해</p>'+s.en.split(' / ').map((e,i)=>'<div class="rw"><div class="re">'+esc(e)+'</div><div class="rk">'+esc(s.ko.split(' / ')[i]||'')+'</div></div>').join('')+
  '<div class="nat"><b>자연스러운 해석</b>'+esc(s.nat)+'</div>'+dnote(s.id)+cfInline(s.id)+(st.done?'':'<button class="btn dn">'+(CF.some(x=>x.id==s.id)?'노트 정리 끝, 다음 문장':'비교 끝, 다음 문장')+'</button>');
 }
 return h+'</div>'}
const ADV=new Set(['not','never','always','often','also','still','just','only','already','even','really','finally','ever','now','then','almost','sometimes','usually','rarely','hardly','soon','nearly','quickly','carefully','n\'t','either','too','both']);
const AUXS=new Set(['is','are','was','were','be','been','being','am','have','has','had','do','does','did','can','could','will','would','shall','should','may','might','must','cannot','dont','didnt','doesnt','cant','couldnt','wont','wouldnt','shouldnt','mustnt','isnt','arent','wasnt','werent','havent','hasnt','hadnt','lets']);
const PARTS=new Set(['in','out','up','off','on','forward','over','down','away','back','along','around','through']);
const cl=w=>w.toLowerCase().replace(/[.,;!?]/g,'').replace(/[’']/g,'');
const isAux=w=>{const c=cl(w);return AUXS.has(c)||/(s|re|ve|ll|d)$/.test(c)&&/[’']/.test(w)};
const PRON=new Set(['i','you','he','she','it','we','they','this','that','there']);
function vgroups(id){const v=(VB[id]||[]).slice().sort((a,b)=>a-b);const tk=wordsOf(DAYS.flatMap(d=>d.s).find(q=>q.id==id));const G=[];let cur=[];
 v.forEach(i=>{if(!cur.length){cur=[i];return}const last=cur[cur.length-1];let ok=false;
  if(/[,“]$/.test(tk[last])||/^[“"]/.test(tk[i])){G.push(cur);cur=[i];return}
  if(i==last+1)ok=isAux(tk[last])||!isAux(tk[i]);
  else if(i-last<=3&&isAux(tk[last])){ok=true;for(let k=last+1;k<i;k++){const w=cl(tk[k]);if(!(ADV.has(w)||(k==last+1&&i-last>=2&&PRON.has(w))||/ly$/.test(w)||(w=='to'&&/^(have|has|had)$/.test(cl(tk[last])))))ok=false}}
  if(ok)cur.push(i);else{G.push(cur);cur=[i]}});if(cur.length)G.push(cur);return G}
function wire(D,s,st,c){const id=s.id;
 const GR=vgroups(id);const NV=GR.length,NG=ans(s).size;const unitOf=i=>GR.find(g=>g.includes(i))||[i];
 const units=()=>{const seen=new Set();st.v.forEach(i=>seen.add(unitOf(i).join(',')));return seen.size};
 const q=sel=>c.querySelector(sel),qa=sel=>c.querySelectorAll(sel);
 const chkv=()=>{const nx=q('.nx');if(!nx)return;const ok=st.v.size>=1;nx.disabled=!ok;nx.classList.toggle('dis',!ok)};
 qa('.vw[data-v]').forEach(b=>b.onclick=()=>{const i=+b.dataset.v;const u=unitOf(i);const on=u.every(x=>st.v.has(x));u.forEach(x=>on?st.v.delete(x):st.v.add(x));u.forEach(x=>{const e=q('.vw[data-v="'+x+'"]');if(e)e.classList.toggle('on',!on)});chkv();if(units()==NV)setTimeout(()=>{if(!st.r&&st.p==0&&units()==NV){st.p=1;show(D,id)}},450)});chkv();
 const nx=q('.nx');if(nx)nx.onclick=()=>{st.p=1;show(D,id)};
 const bk1=q('.bk1');if(bk1)bk1.onclick=()=>{st.p=0;show(D,id)};
 const chk=()=>{const rv=q('.rv');if(!rv)return;const ok=st.g.size>=1;rv.disabled=!ok;rv.classList.toggle('dis',!ok);const lk=q('.lk');if(lk)lk.style.display=ok?'none':''};
 qa('.gp[data-g]').forEach(b=>b.onclick=()=>{const i=+b.dataset.g;st.g.has(i)?st.g.delete(i):st.g.add(i);b.classList.toggle('on');chk();if(st.g.size==NG)setTimeout(()=>{if(!st.r&&st.p==1&&st.g.size==NG){st.r=true;show(D,id)}},450)});chk();
 const rv=q('.rv');if(rv)rv.onclick=()=>{st.r=true;show(D,id)};
 const dn=q('.dn');if(dn)dn.onclick=()=>{const AVs=new Set(VB[id]||[]),As=ans(s);let vm=0,gm=0;AVs.forEach(i=>{if(!st.v.has(i))vm++});st.v.forEach(i=>{if(!AVs.has(i))vm++});As.forEach(i=>{if(!st.g.has(i))gm++});const bad=vm>0||gm>=2;if(bad)wlPut(mkNote(D,s,AVs,st));const pv=S[id]||{};S[id]={s:1,t:NV+NG,m:Math.max(pv.m||0,vm+gm),w:(pv.w||bad)?1:0,r:[vm?'동사':'',gm>=2?'끊어 읽기':''].filter(Boolean).join(', ')||pv.r||''};save();st.done=true;show(D,id);
  const nb=document.querySelector('.sb[data-s="'+id+'"]');if(nb)nb.classList.add('done');
  const nxt=D.s.find(q2=>!isDone(q2.id));
  if(nxt){show(D,nxt.id);document.getElementById('sc-'+nxt.id).scrollIntoView({behavior:'smooth',block:'start'})}
  else{const stp=document.getElementById('st');stp.innerHTML=stampInner(D);wireStamp(D);stp.scrollIntoView({behavior:'smooth',block:'center'})}}}
home();
</script></body></html>
