.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"This is called ambush marketing, where a brand uses creative campaigns to associate itself with a major event and thus gain attention without actually paying for sponsorships.","이것은 앰부시 마케팅이라고 불리며, 브랜드가 창의적인 캠페인을 활용해 주요 행사와 자신을 연관시키고, 실제로 후원 비용을 지불하지 않으면서도 관심을 얻는 것을 말한다."]],"w":"4번에서 앰부시 마케팅은 브랜드가 창의적인 캠페인으로 행사와 연관돼 후원 비용을 지불하지 않고도 관심을 얻는 것이라고 해요.","c":"T"},"h":"e48420f12f"},{"n":3,"t":"tf","q":"Beats by Dre’s sales dropped by 42 percent after its headphones appeared on TV.","ko":"비츠 바이 드레의 헤드폰이 TV에 나온 뒤 매출이 42퍼센트 떨어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Many participants wore them during the TV broadcast, and this widespread exposure contributed significantly to a 42 percent increase in sales that year.","많은 참가자가 TV 방송 중에 그것들을 착용했고, 이 광범위한 노출은 그해 매출의 42퍼센트 증가에 상당히 기여했다."]],"w":"12번에서 참가자들이 방송에서 헤드폰을 착용했고, 그 노출이 그해 매출의 42퍼센트 증가에 기여했다고 해요. 떨어졌다는 말은 반대예요.","c":"F"},"h":"65ef8b4812"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…it managed to reap substantial benefits from the World Cup fever…)","ko":"그것(펩시)은 월드컵 열기로부터 상당한 이익을 거둘 수 있었다. (substantial은 상당한)","opts":["사소한","불법적인","상당한","일시적인"],"word":"substantial","r":{"a":"3) 상당한","ev":"3번 문장","s":[[3,"Through this smart strategy, it managed to reap substantial benefits from the World Cup fever, despite having no legitimate connection to the event.","이 영리한 전략을 통해, 그것(펩시)은 행사와 아무런 합법적인 관련이 없음에도 불구하고 월드컵 열기로부터 상당한 이익을 거둘 수 있었다."]],"w":"월드컵 열기에서 거둔 이익이 크다는 흐름이라 ‘상당한’이 맞아요. 앞의 smart strategy(영리한 전략)와도 어울려요.","c":3},"h":"0dd2eed532"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, ambush marketing should be employed with extreme caution…)","ko":"그러나, 앰부시 마케팅은 극도의 주의를 기울여 사용되어야 한다. (employ는 사용하다)","opts":["고용되어","사용되어","금지되어","발표되어"],"word":"employed","r":{"a":"2) 사용되어","ev":"13번 문장","s":[[13,"However, ambush marketing should be employed with extreme caution, as it can lead to severe risks.","그러나, 앰부시 마케팅은 심각한 위험으로 이어질 수 있으므로 극도의 주의를 기울여 사용되어야 한다."]],"w":"employ는 ‘고용하다’로 많이 알려져 있지만 여기서는 마케팅 방법이 주어라서 ‘사용하다’예요. should be employed = 사용되어야 한다.","c":2},"h":"9ec0b787b5"},{"n":6,"t":"ref","q":"What does the underlined \"This clever play on words\" refer to?\nThis clever play on words undermined Visa’s reputation on the global stage while drawing attention to American Express.","ko":"밑줄 친 This clever play on words가 가리키는 것은?","sko":"이 영리한 말장난은 아메리칸 익스프레스에 관심을 끌면서 세계 무대에서 비자의 명성을 훼손했다.","opts":["Visa가 낸 4천만 달러","아메리칸 익스프레스의 태그라인","비츠 바이 드레의 헤드폰","펩시의 특별판 캔"],"r":{"a":"2) 아메리칸 익스프레스의 태그라인","ev":"8~9번 문장","s":[[8,"However, its rival American Express ran an ambush campaign with the tagline, “If you’re traveling to Norway, you’ll need a passport, but you don’t need a visa.”","그러나, 경쟁사인 아메리칸 익스프레스는 “만약 당신이 노르웨이로 여행한다면, 여권은 필요하겠지만, 비자는 필요 없습니다.”라는 태그라인으로 앰부시 캠페인을 진행했다."],[9,"This clever play on words undermined Visa’s reputation on the global stage while drawing attention to American Express.","이 영리한 말장난은 아메리칸 익스프레스에 관심을 끌면서 세계 무대에서 비자의 명성을 훼손했다."]],"w":"8번에서 아메리칸 익스프레스가 “여권은 필요하지만 비자(visa)는 필요 없다”는 태그라인을 썼어요. 이 말장난이 9번에서 Visa의 명성을 해쳐요.","c":2},"h":"a1939591ea"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Illegally using an event’s intellectual property, such as logos or related slogans, could result in heavy fines and could also damage the company’s reputation.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"로고나 관련 슬로건과 같은 행사의 지적 재산을 불법적으로 사용하는 것은 무거운 벌금을 초래할 수 있으며 또한 회사의 평판을 손상시킬 수 있다.","opts":["행사의 로고를 만든 회사는 무거운 벌금을 받을 수 있다.","행사의 슬로건을 합법적으로 쓰면 회사의 평판이 좋아진다.","벌금만 내면 행사의 지적 재산을 마음대로 써도 된다.","행사의 로고나 슬로건을 불법으로 쓰면 큰 벌금을 물고 회사의 평판도 나빠질 수 있다."],"r":{"a":"4) 행사의 로고나 슬로건을 불법으로 쓰면 큰 벌금을 물고 회사의 평판도 나빠질 수 있다.","ev":"14번 문장","s":[[14,"Illegally using an event’s intellectual property, such as logos or related slogans, could result in heavy fines and could also damage the company’s reputation.","로고나 관련 슬로건과 같은 행사의 지적 재산을 불법적으로 사용하는 것은 무거운 벌금을 초래할 수 있으며 또한 회사의 평판을 손상시킬 수 있다."]],"w":"Illegally using(불법적으로 사용하는 것)이 주어이고, could result in heavy fines(무거운 벌금을 초래할 수 있다)와 could also damage the company’s reputation(평판도 손상시킬 수 있다)이 결과예요.","c":4},"h":"1f6266bc48"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["코카콜라는 인기 선수들이 나오는 특별판 캔 캠페인을 했다.","직접적 앰부시는 행사나 경쟁사를 언급하지 않는 방식이다.","비츠 바이 드레는 올림픽 전에 국기가 그려진 맞춤형 헤드폰을 선수들에게 나눠 주었다.","아메리칸 익스프레스는 노르웨이 올림픽의 공식 신용카드가 되려고 4천만 달러를 냈다."],"opts":["Coca-Cola ran a campaign with special edition cans featuring popular soccer players.","A direct ambush avoids any reference to an event or competitor.","Before the 2012 London Olympics, Beats by Dre gave athletes custom headphones featuring national flags.","American Express paid $40 million to be the official credit card of the Norway Olympics."],"r":{"a":"3) Before the 2012 London Olympics, Beats by Dre gave athletes custom headphones featuring national flags.","ev":"11번 문장","s":[[11,"Before the 2012 London Olympics, Beats by Dre, a well-known audio equipment company, strategically distributed custom headphones featuring the flags of various countries to athletes.","2012년 런던 올림픽 전에, 잘 알려진 오디오 장비 회사인 비츠 바이 드레는 여러 국가의 국기가 그려진 맞춤형 헤드폰을 선수들에게 전략적으로 배포했다."]],"w":"11번에서 비츠 바이 드레가 올림픽 전에 여러 나라의 국기가 그려진 맞춤형 헤드폰을 선수들에게 배포했다고 해요. 특별판 캔은 코카콜라가 아니라 펩시(2번), 4천만 달러는 Visa(7번)예요.","c":3},"h":"962e46050a"},{"n":9,"t":"sum","q":"Ambush marketing helps a brand gain (A) without paying for sponsorships, but the brand must be careful because it may face heavy (B).","ko":"앰부시 마케팅은 브랜드가 후원 비용 없이 (A)을 얻게 해 주지만, 무거운 (B)을 물 수 있으므로 조심해야 한다.","oko":["(A) 신뢰 / (B) 벌금","(A) 관심 / (B) 보상","(A) 관심 / (B) 벌금","(A) 할인 / (B) 혜택","(A) 후원사 / (B) 매출"],"opts":["(A) trust / (B) fines","(A) attention / (B) rewards","(A) attention / (B) fines","(A) discounts / (B) benefits","(A) sponsors / (B) sales"],"r":{"a":"3) (A) attention / (B) fines","ev":"4번, 14번 문장","s":[[4,"This is called ambush marketing, where a brand uses creative campaigns to associate itself with a major event and thus gain attention without actually paying for sponsorships.","이것은 앰부시 마케팅이라고 불리며, 브랜드가 창의적인 캠페인을 활용해 주요 행사와 자신을 연관시키고, 실제로 후원 비용을 지불하지 않으면서도 관심을 얻는 것을 말한다."],[14,"Illegally using an event’s intellectual property, such as logos or related slogans, could result in heavy fines and could also damage the company’s reputation.","로고나 관련 슬로건과 같은 행사의 지적 재산을 불법적으로 사용하는 것은 무거운 벌금을 초래할 수 있으며 또한 회사의 평판을 손상시킬 수 있다."]],"w":"4번에서 브랜드가 후원 비용 없이 얻는 것은 관심(attention)이에요. 14번에서 지적 재산의 불법 사용은 무거운 벌금(heavy fines)으로 이어질 수 있다고 해요.","c":3},"h":"0a008cd8c6"},{"n":10,"t":"fill","q":"American Express’s clever play on words [A] Visa’s reputation and drew [B] to American Express.","ko":"아메리칸 익스프레스의 영리한 말장난은 비자의 명성을 [A] 아메리칸 익스프레스에 [B]을 끌었다.","bank":["undermined","attention","distributed","sponsorship","rival","fever"],"bko":{"undermined":"훼손했다","attention":"관심","distributed":"배포했다","sponsorship":"후원","rival":"경쟁사","fever":"열기"},"r":{"a":"[A] undermined, [B] attention","ev":"9번 문장","s":[[9,"This clever play on words undermined Visa’s reputation on the global stage while drawing attention to American Express.","이 영리한 말장난은 아메리칸 익스프레스에 관심을 끌면서 세계 무대에서 비자의 명성을 훼손했다."]],"w":"9번에 undermined Visa’s reputation(비자의 명성을 훼손했다)과 drawing attention to American Express(아메리칸 익스프레스에 관심을 끌면서)가 그대로 있어요. 아메리칸 익스프레스는 후원을 한 것이 아니라 앰부시를 한 것이라 sponsorship은 맞지 않아요.","c":null},"h":"9d46035ccf"}]},{"u":8,"id":"ms4-08-3","no":3,"ko":"환경을 위해 태어난 거였어?","items":[{"n":1,"t":"tf","q":"At the time Thulin invented plastic bags, many trees were cut down every year to make paper bags.","ko":"툴린이 비닐봉지를 발명했을 때, 종이봉투를 만들기 위해 해마다 많은 나무가 베어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"At the time, most stores provided customers with paper bags, and many trees were cut down annually to produce them.","그 당시, 대부분의 상점은 고객들에게 종이봉투를 제공했고, 그것들을 생산하기 위해 매년 많은 나무가 베어졌다."]],"w":"4번에서 그 당시 대부분의 상점이 종이봉투를 제공했고 그것을 만들려고 매년 많은 나무가 베어졌다고 해요.","c":"T"},"h":"f03c654a5a"},{"n":2,"t":"tf","q":"By 1979, plastic bags made up 80 percent of the shopping bag market in the United States.","ko":"1979년까지 비닐봉지는 미국 쇼핑백 시장의 80퍼센트를 차지했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"While plastic bags proved popular, making up 80 percent of Europe’s shopping bag market by 1979, people did not follow Thulin’s intention.","비닐봉지가 1979년까지 유럽 쇼핑백 시장의 80퍼센트를 차지하며 인기 있는 것으로 판명되었지만, 사람들은 툴린의 의도를 따르지 않았다."]],"w":"6번에서 80퍼센트는 미국이 아니라 유럽(Europe’s) 쇼핑백 시장이에요.","c":"F"},"h":"572940f5a7"},{"n":3,"t":"tf","q":"Millions of plastic bags were added to landfills each year because people threw them away after one use.","ko":"사람들이 한 번 사용한 뒤 버렸기 때문에 매년 수백만 개의 비닐봉지가 매립지에 추가되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"They discarded the bags after a single use, resulting in millions of plastic bags being added to landfills each year.","그들은 한 번 사용한 후에 봉지를 버렸고, 이는 매년 수백만 개의 비닐봉지가 매립지에 추가되는 결과를 낳았다."]],"w":"7번에서 사람들이 봉지를 한 번 쓰고 버렸고, 그 결과 매년 수백만 개의 비닐봉지가 매립지에 추가되었다고 해요.","c":"T"},"h":"b128b7f143"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…to reduce people’s reliance on paper bags.)","ko":"종이봉투에 대한 사람들의 의존을 줄이기 위해. (reliance는 의존)","opts":["거부","관심","의존","가격"],"word":"reliance","r":{"a":"3) 의존","ev":"3번 문장","s":[[3,"In 1965, the Swedish engineer Sten Thulin invented plastic bags to reduce people’s reliance on paper bags.","1965년, 스웨덴 엔지니어 스텐 툴린은 종이봉투에 대한 사람들의 의존도를 줄이기 위해 비닐봉지를 발명했다."]],"w":"종이봉투를 너무 많이 써서 나무가 베어지니, 그것에 기대는 정도를 줄이려 했다는 흐름이에요. reliance on = ~에 대한 의존.","c":3},"h":"ceed686da9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They discarded the bags after a single use…)","ko":"그들은 한 번 사용한 후에 봉지를 버렸다. (discard는 버리다)","opts":["다시 사용했다","버렸다","팔았다","모았다"],"word":"discarded","r":{"a":"2) 버렸다","ev":"7번 문장","s":[[7,"They discarded the bags after a single use, resulting in millions of plastic bags being added to landfills each year.","그들은 한 번 사용한 후에 봉지를 버렸고, 이는 매년 수백만 개의 비닐봉지가 매립지에 추가되는 결과를 낳았다."]],"w":"툴린의 의도를 따르지 않았다는 6번 다음 문장이고, 결과가 매립지에 쌓이는 것이므로 ‘버렸다’가 맞아요.","c":2},"h":"9328f54641"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey discarded the bags after a single use, resulting in millions of plastic bags being added to landfills each year.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 한 번 사용한 후에 봉지를 버렸고, 이는 매년 수백만 개의 비닐봉지가 매립지에 추가되는 결과를 낳았다.","opts":["사람들","비닐봉지","툴린과 엔지니어들","상점들"],"r":{"a":"1) 사람들","ev":"6~7번 문장","s":[[6,"While plastic bags proved popular, making up 80 percent of Europe’s shopping bag market by 1979, people did not follow Thulin’s intention.","비닐봉지가 1979년까지 유럽 쇼핑백 시장의 80퍼센트를 차지하며 인기 있는 것으로 판명되었지만, 사람들은 툴린의 의도를 따르지 않았다."],[7,"They discarded the bags after a single use, resulting in millions of plastic bags being added to landfills each year.","그들은 한 번 사용한 후에 봉지를 버렸고, 이는 매년 수백만 개의 비닐봉지가 매립지에 추가되는 결과를 낳았다."]],"w":"봉지를 버린 쪽은 비닐봉지가 아니라 그것을 쓰는 사람들이에요. 6번의 people did not follow Thulin’s intention에 이어서 7번의 They가 나와요.","c":1},"h":"195daca6ec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is thus imperative for the scientific community to fully understand the potential impact of new technologies before they are made available to the public.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서 과학계가 새로운 기술이 대중에게 이용 가능해지기 전에 그것의 잠재적인 영향을 완전히 이해하는 것은 필수적이다.","opts":["과학계는 새로운 기술을 가능한 한 빨리 대중에게 공개해야 한다.","대중이 새로운 기술의 영향을 이해한 뒤에야 과학계가 연구를 시작해야 한다.","새로운 기술은 대중에게 공개된 뒤에 영향을 살펴보면 충분하다.","과학계는 새로운 기술이 대중에게 나오기 전에 그 잠재적 영향을 충분히 이해해야 한다."],"r":{"a":"4) 과학계는 새로운 기술이 대중에게 나오기 전에 그 잠재적 영향을 충분히 이해해야 한다.","ev":"10번 문장","s":[[10,"It is thus imperative for the scientific community to fully understand the potential impact of new technologies before they are made available to the public.","따라서 과학계가 새로운 기술이 대중에게 이용 가능해지기 전에 그것의 잠재적인 영향을 완전히 이해하는 것은 필수적이다."]],"w":"imperative는 ‘필수적인’이고, before they are made available to the public은 ‘대중에게 이용 가능해지기 전에’예요. 영향을 이해하는 시점이 공개 전이라는 점이 핵심이에요.","c":4},"h":"af71bad1a4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["툴린은 종이봉투를 더 많이 팔기 위해 비닐봉지를 만들었다.","비닐봉지는 유럽에서 인기를 끌지 못했다.","재사용 가방은 면이나 대마 같은 천연섬유로 만들어지기도 한다.","1965년에 대부분의 상점은 고객에게 재사용 가방을 제공했다."],"opts":["Thulin made plastic bags in order to sell more paper bags.","Plastic bags did not become popular in Europe.","Reusable bags can be made from natural fibers such as cotton or hemp.","In 1965, most stores provided customers with reusable bags."],"r":{"a":"3) Reusable bags can be made from natural fibers such as cotton or hemp.","ev":"8번 문장","s":[[8,"This accumulation of waste sparked the eventual shift to reusable bags made from sturdier synthetic materials or natural fibers like cotton or hemp.","이러한 쓰레기의 축적은 더 튼튼한 합성 재료나 면이나 대마 같은 천연섬유로 만들어진 재사용 가능한 가방으로의 궁극적인 전환을 촉발했다."]],"w":"8번에서 재사용 가방은 더 튼튼한 합성 재료나 면, 대마 같은 천연섬유로 만들어진다고 해요. 툴린은 종이봉투 의존을 줄이려 했고(3번), 비닐봉지는 유럽에서 인기였고(6번), 당시 상점은 종이봉투를 줬어요(4번).","c":3},"h":"f9b76648d5"},{"n":9,"t":"sum","q":"Thulin hoped plastic bags would be (A), but people used them only once, which created a growing (B) problem.","ko":"툴린은 비닐봉지가 (A)하기를 바랐지만, 사람들은 한 번만 쓰고 버려서 점점 커지는 (B) 문제를 만들었다.","oko":["(A) 일회용 / (B) 쓰레기","(A) 재사용 가능 / (B) 쓰레기","(A) 재사용 가능 / (B) 종이","(A) 비싼 / (B) 에너지","(A) 천연 / (B) 산림"],"opts":["(A) disposable / (B) waste","(A) reusable / (B) waste","(A) reusable / (B) paper","(A) expensive / (B) energy","(A) natural / (B) forest"],"r":{"a":"2) (A) reusable / (B) waste","ev":"5~7번 문장","s":[[5,"By switching to plastic, Thulin hoped his invention would slow the process of deforestation and provide a reusable alternative for carrying goods.","플라스틱으로 전환함으로써, 툴린은 그의 발명품이 삼림 벌채 과정을 늦추고 물건을 운반하기 위한 재사용 가능한 대안을 제공하기를 희망했다."],[6,"While plastic bags proved popular, making up 80 percent of Europe’s shopping bag market by 1979, people did not follow Thulin’s intention.","비닐봉지가 1979년까지 유럽 쇼핑백 시장의 80퍼센트를 차지하며 인기 있는 것으로 판명되었지만, 사람들은 툴린의 의도를 따르지 않았다."],[7,"They discarded the bags after a single use, resulting in millions of plastic bags being added to landfills each year.","그들은 한 번 사용한 후에 봉지를 버렸고, 이는 매년 수백만 개의 비닐봉지가 매립지에 추가되는 결과를 낳았다."]],"w":"5번에서 툴린은 재사용 가능한 대안(reusable alternative)을 바랐는데, 6~7번에서 사람들은 한 번 쓰고 버려 매립지에 봉지가 쌓였으니 쓰레기(waste) 문제가 돼요.","c":2},"h":"e77d38c39b"},{"n":10,"t":"fill","q":"Inventions meant to [A] humanity often have unintended negative [B].","ko":"인류에게 [A]하기 위한 발명품들이 종종 의도하지 않은 부정적 [B]를 가진다.","bank":["benefit","effects","reliance","norm","fibers","landfills"],"bko":{"benefit":"혜택을 주다","effects":"효과","reliance":"의존","norm":"표준","fibers":"섬유","landfills":"매립지"},"r":{"a":"[A] benefit, [B] effects","ev":"9번 문장","s":[[9,"The widespread adoption and eventual rejection of plastic bags illustrates an underlying truth about scientific progress—inventions meant to benefit humanity often have unintended negative effects.","비닐봉지의 광범위한 채택과 궁극적인 거부는 과학적 진보에 대한 근본적인 진실을 보여주는데, 그것은 인류에게 혜택을 주기 위한 발명품들이 종종 의도하지 않은 부정적인 효과를 가진다는 것이다."]],"w":"9번에 inventions meant to benefit humanity often have unintended negative effects가 그대로 있어요.","c":null},"h":"73b6d7aeb0"}]},{"u":8,"id":"ms4-08-4","no":4,"ko":"The Illusion of the Better Deal","items":[{"n":1,"t":"tf","q":"Many people would choose $10 now rather than $100 after a year.","ko":"많은 사람은 1년 후 100달러보다 지금 10달러를 선택할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"While the second option is more rational, many people would choose the immediate reward due to a cognitive bias called hyperbolic discounting.","두 번째 선택이 더 합리적이지만, 많은 사람은 ‘가치 폄하 효과’라고 불리는 인지 편향 때문에 즉각적인 보상을 선택할 것이다."]],"w":"2번에서 두 번째 선택이 더 합리적이지만 많은 사람은 즉각적인 보상을 선택한다고 해요.","c":"T"},"h":"d87f4d23d1"},{"n":2,"t":"tf","q":"Hyperbolic discounting appears only in people who have a high level of self-discipline.","ko":"가치 폄하 효과는 높은 수준의 자제력을 가진 사람에게서만 나타난다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Unless a person has a high level of self-discipline, the option that does not require patience will almost always be selected.","사람이 높은 수준의 자제력을 가지고 있지 않다면, 인내를 요구하지 않는 선택이 거의 항상 선택될 것이다."]],"w":"6번은 자제력이 높지 않다면 인내가 필요 없는 선택이 거의 항상 골라진다고 해요. 자제력이 높은 사람에게만 나타난다는 말은 반대예요.","c":"F"},"h":"2ea342feb6"},{"n":3,"t":"tf","q":"Early humans benefited from delay because food and clean water were always easy to get.","ko":"음식과 깨끗한 물을 항상 쉽게 얻을 수 있었기 때문에 초기 인류는 지연으로 이득을 보았다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"They lived in a world where access to vital resources such as food and clean water was highly unpredictable.","그들은 음식과 깨끗한 물과 같은 필수 자원에 대한 접근이 매우 예측 불가능한 세상에서 살았다."],[9,"Immediate consumption ensured survival, while delay resulted in a missed opportunity to secure what was needed.","즉각적인 소비는 생존을 보장했지만, 지연은 필요한 것을 확보할 기회를 놓치는 결과를 낳았다."]],"w":"8번에서 초기 인류의 세상은 필수 자원에 대한 접근이 매우 예측 불가능했고, 9번에서 지연은 기회를 놓치는 결과를 낳았다고 해요.","c":"F"},"h":"f9e062d79c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…concern about the future availability of the greater reward makes them more inclined to accept the smaller one.)","ko":"더 큰 보상의 미래 이용 가능성에 대한 우려가 그들이 더 작은 것을 받아들이는 쪽으로 마음이 더 기울게 만든다. (inclined는 마음이 기운)","opts":["꺼려지는","허락받은","마음이 기운","불가능한"],"word":"inclined","r":{"a":"3) 마음이 기운","ev":"4번 문장","s":[[4,"Psychologists have identified two causes of this behavior, with the first being that people are naturally risk-averse; concern about the future availability of the greater reward makes them more inclined to accept the smaller one.","심리학자들은 이 행동의 두 가지 원인을 확인했으며, 첫 번째는 사람들이 천성적으로 위험을 회피한다는 것인데, 미래에 더 큰 보상의 이용 가능성에 대한 우려가 그들은 더 작은 것을 받아들이는 쪽으로 마음이 더 기울게 만들었기 때문이다."]],"w":"큰 보상이 나중에 있을지 걱정되면 작은 보상을 받고 싶은 쪽으로 마음이 기운다는 흐름이에요. be inclined to ~ = ~하는 쪽으로 마음이 기울다.","c":3},"h":"3a66526145"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…this preference for short-term rewards became ingrained in human cognition…)","ko":"단기적 보상에 대한 이러한 선호는 인간의 인지에 깊이 배어들게 되었다. (ingrained는 깊이 배어든)","opts":["사라진","깊이 배어든","의심받는","새로 생긴"],"word":"ingrained","r":{"a":"2) 깊이 배어든","ev":"10번 문장","s":[[10,"Over time, this preference for short-term rewards became ingrained in human cognition, persisting even in modern societies where long-term planning is often the key to success.","시간이 지나면서, 단기적 보상에 대한 이러한 선호는 인간의 인지에 깊이 배어들게 되었고, 장기적 계획이 종종 성공의 열쇠가 되는 현대 사회에서도 지속되고 있다."]],"w":"그 선호가 현대 사회에서도 지속된다(persisting)는 뒤 내용으로 보아, 인지 속에 깊이 자리 잡았다는 뜻이에요.","c":2},"h":"c2271f0660"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey lived in a world where access to vital resources such as food and clean water was highly unpredictable.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 음식과 깨끗한 물과 같은 필수 자원에 대한 접근이 매우 예측 불가능한 세상에서 살았다.","opts":["초기 인류","일부 과학자들","심리학자들","현대 사회의 사람들"],"r":{"a":"1) 초기 인류","ev":"7~8번 문장","s":[[7,"Hyperbolic discounting has roots that trace back to early humans, with some scientists arguing it was an evolutionary advantage.","가치 폄하 효과는 초기 인류로 거슬러 올라가는 뿌리를 가지고 있으며, 일부 과학자들은 그것이 진화적 이점이었다고 주장한다."],[8,"They lived in a world where access to vital resources such as food and clean water was highly unpredictable.","그들은 음식과 깨끗한 물과 같은 필수 자원에 대한 접근이 매우 예측 불가능한 세상에서 살았다."]],"w":"음식과 물을 구하기 어려운 세상에 산 쪽은 7번의 early humans예요. 바로 앞의 some scientists는 주장하는 사람들이라 헷갈리면 안 돼요.","c":1},"h":"923835636c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Unless a person has a high level of self-discipline, the option that does not require patience will almost always be selected.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사람이 높은 수준의 자제력을 가지고 있지 않다면, 인내를 요구하지 않는 선택이 거의 항상 선택될 것이다.","opts":["자제력이 높은 사람은 인내가 필요 없는 선택을 거의 항상 고른다.","인내가 필요한 선택은 자제력과 상관없이 항상 골라진다.","자제력이 높을수록 사람들은 더 쉬운 선택을 한다.","자제력이 높지 않다면, 인내가 필요 없는 선택이 거의 항상 골라진다."],"r":{"a":"4) 자제력이 높지 않다면, 인내가 필요 없는 선택이 거의 항상 골라진다.","ev":"6번 문장","s":[[6,"Unless a person has a high level of self-discipline, the option that does not require patience will almost always be selected.","사람이 높은 수준의 자제력을 가지고 있지 않다면, 인내를 요구하지 않는 선택이 거의 항상 선택될 것이다."]],"w":"Unless ~는 ‘~하지 않는 한’이에요. 자제력이 높지 않은 경우에 인내가 필요 없는 쪽이 골라진다는 뜻이라 자제력이 높은 사람의 이야기가 아니에요.","c":4},"h":"62b8ac6a64"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["가치 폄하 효과는 사람들이 지연된 보상을 선호하게 만든다.","사람들은 천성적으로 위험을 좋아해서 작은 보상을 받아들인다.","기다리는 것은 불안과 좌절감을 일으킬 수 있다.","초기 인류는 음식과 깨끗한 물을 얻을 수 있을지 걱정하지 않았다."],"opts":["Hyperbolic discounting makes people prefer delayed rewards.","People are naturally attracted to risk, so they accept smaller rewards.","Waiting can trigger feelings of anxiety and frustration.","Early humans were never concerned about getting food and clean water."],"r":{"a":"3) Waiting can trigger feelings of anxiety and frustration.","ev":"5번 문장","s":[[5,"Another factor is that waiting triggers feelings of anxiety and frustration.","또 다른 요인은 기다림이 불안과 좌절감을 유발한다는 것이다."]],"w":"5번에서 기다림이 불안과 좌절감을 유발한다고 해요. 사람들은 위험을 회피하고(4번 risk-averse), 즉각적인 보상을 선호하며(2번), 초기 인류의 자원 접근은 예측 불가능했어요(8번).","c":3},"h":"eca2837a6a"},{"n":9,"t":"sum","q":"Hyperbolic discounting is the tendency to prefer (A) rewards over (B) ones, even when waiting would give a better result.","ko":"가치 폄하 효과는 기다리는 것이 더 나은 결과를 줄 때조차 (A) 보상을 (B) 보상보다 선호하는 경향이다.","oko":["(A) 지연된 / (B) 즉각적인","(A) 큰 / (B) 작은","(A) 위험한 / (B) 안전한","(A) 즉각적인 / (B) 지연된","(A) 사회적인 / (B) 개인적인"],"opts":["(A) delayed / (B) immediate","(A) large / (B) small","(A) risky / (B) safe","(A) immediate / (B) delayed","(A) social / (B) private"],"r":{"a":"4) (A) immediate / (B) delayed","ev":"2~3번 문장","s":[[2,"While the second option is more rational, many people would choose the immediate reward due to a cognitive bias called hyperbolic discounting.","두 번째 선택이 더 합리적이지만, 많은 사람은 ‘가치 폄하 효과’라고 불리는 인지 편향 때문에 즉각적인 보상을 선택할 것이다."],[3,"This flawed decision-making process is characterized by a preference for instant gratification, even when waiting would lead to a better outcome.","이 결함 있는 의사 결정 과정은 기다리는 것이 더 나은 결과로 이어질 때조차 즉각적인 만족을 선호하는 것으로 특징지어진다."]],"w":"2번에서 많은 사람이 즉각적인 보상을 택하고, 3번에서 기다리는 것이 더 나은 결과를 줄 때조차 즉각적인 만족을 선호한다고 해요. (A)는 immediate, (B)는 delayed예요.","c":4},"h":"8e87ea1ea9"},{"n":10,"t":"fill","q":"Early humans lived in an [A] world, so [B] consumption helped them survive.","ko":"초기 인류는 [A] 세상에서 살았기 때문에 [B] 소비가 그들의 생존을 도왔다.","bank":["unpredictable","immediate","rational","delayed","modern","flawed"],"bko":{"unpredictable":"예측 불가능한","immediate":"즉각적인","rational":"합리적인","delayed":"지연된","modern":"현대의","flawed":"결함 있는"},"r":{"a":"[A] unpredictable, [B] immediate","ev":"8~9번 문장","s":[[8,"They lived in a world where access to vital resources such as food and clean water was highly unpredictable.","그들은 음식과 깨끗한 물과 같은 필수 자원에 대한 접근이 매우 예측 불가능한 세상에서 살았다."],[9,"Immediate consumption ensured survival, while delay resulted in a missed opportunity to secure what was needed.","즉각적인 소비는 생존을 보장했지만, 지연은 필요한 것을 확보할 기회를 놓치는 결과를 낳았다."]],"w":"8번에서 초기 인류의 세상은 자원 접근이 매우 예측 불가능(unpredictable)했고, 9번에서 즉각적인 소비(immediate consumption)가 생존을 보장했다고 해요. delayed는 9번에서 기회를 놓치게 했다고 하니 반대예요.","c":null},"h":"e7ea942f1b"}]},{"u":9,"id":"ms4-09-1","no":1,"ko":"화가 나면 왜 말이 꼬일까?","items":[{"n":1,"t":"tf","q":"Our desire to explain our feelings logically becomes stronger when we are angry.","ko":"우리의 감정을 논리적으로 설명하려는 욕구는 화가 났을 때 더 강해진다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Our desire to logically explain our feelings intensifies when we’re angry.","우리의 감정을 논리적으로 설명하려는 욕구는 우리가 화가 났을 때 강해진다."]],"w":"1번 문장에서 감정을 논리적으로 설명하려는 욕구가 화가 났을 때 강해진다(intensifies)고 해요. intensify는 ‘강해지다’예요.","c":"T"},"h":"24bd3bd65e"},{"n":2,"t":"tf","q":"Psychologists advise people to keep arguing while they are still angry.","ko":"심리학자들은 사람들에게 아직 화가 난 상태에서 계속 논쟁하라고 조언한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"This is why psychologists recommend stepping away from a situation as soon as you start feeling angry.","이것이 심리학자들이 당신이 화가 나기 시작하자마자 상황에서 물러날 것을 권장하는 이유이다."]],"w":"7번 문장에서 심리학자들은 화가 나기 시작하자마자 상황에서 물러나라고 권해요(recommend → 권하다). 계속 논쟁하라는 말은 반대예요.","c":"F"},"h":"f9eabefb46"},{"n":3,"t":"tf","q":"The amygdala quickly starts an automatic stress response when we experience anger.","ko":"우리가 분노를 경험하면 편도체는 자동적인 스트레스 반응을 빠르게 시작시킨다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When we experience anger, the amygdala, the brain region that processes emotions, quickly triggers an automatic stress response in our bodies.","우리가 분노를 경험할 때, 감정을 처리하는 뇌 영역인 편도체는 우리 몸에서 자동적인 스트레스 반응을 빠르게 유발한다."]],"w":"3번 문장에 the amygdala ~ quickly triggers an automatic stress response라고 나와요. trigger는 ‘유발하다, 일으키다’예요.","c":"T"},"h":"b4db0e305e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…stress hormones like adrenaline and cortisol flood the body to increase heart rate…)","ko":"스트레스 호르몬이 몸에 flood하여 심박수를 증가시킨다. (flood의 뜻은?)","opts":["몸에서 빠져나가다","몸에 가득 밀려들다","몸을 보호하다","몸을 식히다"],"word":"flood","r":{"a":"2) 몸에 가득 밀려들다","ev":"4번 문장","s":[[4,"During this process, stress hormones like adrenaline and cortisol flood the body to increase heart rate, blood pressure, and muscle tension, giving us extra energy to either face or flee the source of our anger.","이 과정 동안, 아드레날린과 코르티솔 같은 스트레스 호르몬이 심박수, 혈압, 근육 긴장을 증가시키기 위해 몸에 넘쳐나며, 분노의 원인에 맞서거나 도망칠 수 있는 여분의 에너지를 우리에게 준다."]],"w":"4번 문장에서 호르몬이 몸에 가득 밀려들어서 심박수·혈압·근육 긴장이 올라가요. flood = 넘쳐나다, 가득 밀려들다예요. 빠져나가거나 몸을 식힌다면 ‘늘어난다’는 흐름과 맞지 않아요.","c":2},"h":"4fd7407000"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…finding the right words to communicate effectively in these moments frequently proves challenging.)","ko":"이러한 순간에 효과적으로 의사소통할 적절한 단어를 찾는 것은 자주 challenging한 것으로 드러난다.","opts":["쉬운","재미있는","사소한","어려운"],"word":"challenging","r":{"a":"4) 어려운","ev":"2번 문장","s":[[2,"However, finding the right words to communicate effectively in these moments frequently proves challenging.","그러나, 이러한 순간에 효과적으로 의사소통하기 위한 적절한 단어를 찾는 것은 어려운 것으로 자주 드러난다."]],"w":"2번 문장은 However로 1번과 반대되는 말을 이어요. 논리적으로 설명하고 싶지만 막상 적절한 단어를 찾기는 어렵다는 뜻이라 challenging = 어려운이에요.","c":4},"h":"c7275a2833"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nWith so much energy directed to the body, the prefrontal cortex, which is responsible for reasoning and decision-making, becomes temporarily impaired.","ko":"밑줄 친 which가 가리키는 것은?","sko":"신체로 너무 많은 에너지가 쏠리면서, 추론과 의사결정을 담당하는 전전두피질은 일시적으로 손상된다.","opts":["에너지","몸","전전두피질","추론"],"r":{"a":"3) 전전두피질","ev":"5번 문장","s":[[5,"With so much energy directed to the body, the prefrontal cortex, which is responsible for reasoning and decision-making, becomes temporarily impaired.","신체로 너무 많은 에너지가 쏠리면서, 추론과 의사결정을 담당하는 전전두피질은 일시적으로 손상된다."]],"w":"which 앞에 쉼표가 있고 바로 앞이 the prefrontal cortex예요. ‘그런데 이것(전전두피질)은 추론과 의사결정을 담당한다’라고 읽어요.","c":3},"h":"a3a9b2de45"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Our desire to logically explain our feelings intensifies when we’re angry.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리의 감정을 논리적으로 설명하려는 욕구는 우리가 화가 났을 때 강해진다.","opts":["화가 나면 감정을 논리적으로 설명하고 싶은 마음이 커진다.","화가 나면 감정을 숨기고 싶은 마음이 커진다.","화가 나면 논리적으로 설명하려는 욕구가 사라진다.","감정을 논리적으로 설명하면 화가 더 커진다."],"r":{"a":"1) 화가 나면 감정을 논리적으로 설명하고 싶은 마음이 커진다.","ev":"1번 문장","s":[[1,"Our desire to logically explain our feelings intensifies when we’re angry.","우리의 감정을 논리적으로 설명하려는 욕구는 우리가 화가 났을 때 강해진다."]],"w":"desire to ~ 는 ‘~하려는 욕구’, intensify는 ‘강해지다’예요. 화가 날 때 논리적으로 설명하려는 마음이 커진다는 뜻이에요. 숨기고 싶다거나 사라진다는 말은 없고, 원인과 결과가 거꾸로 된 선지도 틀려요.","c":1},"h":"e119869bb5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["진정할 시간을 가지면 전전두피질이 다시 작동해서 자신을 분명하게 표현할 수 있다.","화가 났을 때 가장 좋은 방법은 곧바로 반박하는 것이다.","전전두피질은 화가 나면 더 활발하게 일하기 시작한다.","편도체는 의사결정을 담당하는 뇌 부분이다."],"opts":["Taking time to calm down lets the prefrontal cortex work again so you can express yourself clearly.","The best thing to do when angry is to argue back right away.","The prefrontal cortex starts working harder when we get angry.","The amygdala is the part of the brain that handles decision-making."],"r":{"a":"1) Taking time to calm down lets the prefrontal cortex work again so you can express yourself clearly.","ev":"8번 문장","s":[[8,"Giving yourself time to calm down and exit the fight-or-flight mode allows the prefrontal cortex to “turn back on,” so you can express yourself clearly.","진정하고 투쟁-도피 모드에서 벗어날 시간을 자신에게 주는 것은 전전두피질이 “다시 켜지도록” 하여, 당신이 자신을 명확하게 표현할 수 있게 한다."]],"w":"8번 문장에서 진정할 시간을 가지면 전전두피질이 ‘다시 켜져서’ 분명하게 표현할 수 있어요. 전전두피질은 화가 나면 손상되고(5번), 의사결정은 편도체가 아니라 전전두피질이 담당해요(5번).","c":1},"h":"7146151646"},{"n":9,"t":"sum","q":"Anger makes it hard to speak logically, so it is better to (A) from the situation and (B) down before expressing yourself.","ko":"분노는 논리적으로 말하기 어렵게 하므로, 자신을 표현하기 전에 상황에서 (A)하고 진정하는 것이 낫다.","oko":["(A) 가까이 다가가 / (B) 진정한","(A) 물러나 / (B) 속도를 높인","(A) 논쟁해 / (B) 서두른","(A) 물러나 / (B) 진정한","(A) 숨어 / (B) 무시한"],"opts":["(A) move closer / (B) calm","(A) step away / (B) speed","(A) argue / (B) hurry","(A) step away / (B) calm","(A) hide / (B) ignore"],"r":{"a":"4) (A) step away / (B) calm","ev":"6~8번 문장","s":[[6,"As a result, when angry, this part of the brain is “turned off,” making it hard to communicate in a rational way.","그 결과, 화가 났을 때 뇌의 이 부분은 “꺼지게” 되어, 이성적인 방식으로 의사소통하는 것을 어렵게 만든다."],[7,"This is why psychologists recommend stepping away from a situation as soon as you start feeling angry.","이것이 심리학자들이 당신이 화가 나기 시작하자마자 상황에서 물러날 것을 권장하는 이유이다."],[8,"Giving yourself time to calm down and exit the fight-or-flight mode allows the prefrontal cortex to “turn back on,” so you can express yourself clearly.","진정하고 투쟁-도피 모드에서 벗어날 시간을 자신에게 주는 것은 전전두피질이 “다시 켜지도록” 하여, 당신이 자신을 명확하게 표현할 수 있게 한다."]],"w":"6번에서 화가 나면 전전두피질이 꺼져 이성적 소통이 어렵다고 하고, 7번에서 상황에서 물러나라(step away)고 해요. 8번에서 진정할 시간(calm down)을 주면 분명하게 표현할 수 있어요. 나머지는 물러나는 방향이 틀리거나, 서두르거나 무시한다는 말이 본문에 없어요.","c":4},"h":"5c3f5adade"},{"n":10,"t":"fill","q":"When we experience anger, the [A] triggers a stress response, and stress [B] flood the body.","ko":"분노를 경험하면 [A]가 스트레스 반응을 일으키고, 스트레스 [B]이 몸에 넘쳐난다.","bank":["amygdala","hormones","cortex","energy","muscle","heart"],"bko":{"amygdala":"편도체","hormones":"호르몬","cortex":"피질","energy":"에너지","muscle":"근육","heart":"심장"},"r":{"a":"[A] amygdala, [B] hormones","ev":"3~4번 문장","s":[[3,"When we experience anger, the amygdala, the brain region that processes emotions, quickly triggers an automatic stress response in our bodies.","우리가 분노를 경험할 때, 감정을 처리하는 뇌 영역인 편도체는 우리 몸에서 자동적인 스트레스 반응을 빠르게 유발한다."],[4,"During this process, stress hormones like adrenaline and cortisol flood the body to increase heart rate, blood pressure, and muscle tension, giving us extra energy to either face or flee the source of our anger.","이 과정 동안, 아드레날린과 코르티솔 같은 스트레스 호르몬이 심박수, 혈압, 근육 긴장을 증가시키기 위해 몸에 넘쳐나며, 분노의 원인에 맞서거나 도망칠 수 있는 여분의 에너지를 우리에게 준다."]],"w":"3번에서 스트레스 반응을 일으키는 것은 감정을 처리하는 뇌 영역인 편도체(amygdala)이고, 4번에서 몸에 넘쳐나는 것은 스트레스 호르몬(hormones)이에요. cortex는 5번의 전전두피질로 스트레스 반응을 일으키는 쪽이 아니라 손상되는 쪽이에요.","c":null},"h":"bf4c9ad028"}]},{"u":9,"id":"ms4-09-2","no":2,"ko":"세상에 단 하나! 근데 가치는 보장 못 함?","items":[{"n":1,"t":"tf","q":"An artwork called Everydays: The First 5000 Days was sold for about $69 million in 2021.","ko":"<매일: 첫 5000일>이라는 예술 작품은 2021년에 약 6,900만 달러에 팔렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In 2021, an artwork titled Everydays: The First 5000 Days was sold for approximately $69 million.","2021년, <매일: 첫 5000일>이라는 제목의 예술 작품이 약 6,900만 달러에 팔렸다."]],"w":"1번 문장에 an artwork titled Everydays: The First 5000 Days was sold for approximately $69 million이 그대로 나와요. approximately = 약.","c":"T"},"h":"fad2816a62"},{"n":2,"t":"tf","q":"Everydays: The First 5000 Days is a painting by a famous artist.","ko":"<매일: 첫 5000일>은 유명한 화가의 그림이다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Given the high cost, you might be surprised to learn it is not a painting by a famous artist, but rather a digital image.","높은 가격을 고려할 때, 당신은 그것이 유명한 화가의 그림이 아니라 디지털 이미지라는 사실을 알게 되면 놀랄지도 모른다."]],"w":"2번 문장에서 이 작품은 유명한 화가의 그림이 아니라 디지털 이미지(not a painting by a famous artist, but rather a digital image)라고 해요.","c":"F"},"h":"a33332f8cf"},{"n":3,"t":"tf","q":"It is possible to tokenize almost any type of digital file.","ko":"거의 모든 유형의 디지털 파일을 토큰화하는 것이 가능하다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"From images to video clips to audio recordings, it is possible to tokenize almost any type of digital file to create a one-of-a-kind item that can be transferred from seller to buyer securely and conveniently.","이미지에서 비디오 클립, 오디오 녹음에 이르기까지, 거의 모든 유형의 디지털 파일을 토큰화하여 판매자에게서 구매자로 안전하고 편리하게 양도될 수 있는 세상에 하나뿐인 아이템을 만드는 것이 가능하다."]],"w":"5번 문장에 it is possible to tokenize almost any type of digital file이 나와요. 이미지, 비디오 클립, 오디오 녹음이 그 예예요.","c":"T"},"h":"872c92c209"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This work of art utilizes a revolutionary technology called a non-fungible token (NFT)…)","ko":"이 예술 작품은 대체 불가능 토큰(NFT)이라는 혁신적인 기술을 utilize한다. (utilize의 뜻은?)","opts":["거부하다","활용하다","설명하다","숨기다"],"word":"utilizes","r":{"a":"2) 활용하다","ev":"3번 문장","s":[[3,"This work of art utilizes a revolutionary technology called a non-fungible token (NFT) to guarantee its uniqueness.","이 예술 작품은 고유성을 보장하기 위해 대체 불가능 토큰(NFT)이라는 혁신적인 기술을 활용한다."]],"w":"3번 문장은 작품이 NFT 기술로 고유성을 보장한다는 내용이에요. 기술을 ‘이용해서’ 보장하는 것이므로 utilize = 활용하다예요.","c":2},"h":"70c990d84e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the prices of other NFTs in the Bored Ape series have plummeted…)","ko":"<Bored Ape> 시리즈의 다른 NFT 가격은 plummet했다. (plummet의 뜻은?)","opts":["급등하다","안정되다","폭락하다","두 배가 되다"],"word":"plummeted","r":{"a":"3) 폭락하다","ev":"9번 문장","s":[[9,"However, the prices of other NFTs in the Bored Ape series have plummeted, and Bored Ape #8817 is now valued at only around $600,000.","그러나, <Bored Ape> 시리즈의 다른 NFT 가격은 폭락했고, <Bored Ape #8817>은 현재 약 60만 달러의 가치로만 평가된다."]],"w":"9번 문장은 However로 8번의 340만 달러와 반대 상황을 말해요. #8817도 지금은 약 60만 달러라서 가격이 크게 떨어진 거예요. plummet = 폭락하다.","c":3},"h":"88fc0a35ec"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhile the development of NFT technology has been hyped as an exciting new method for digital creators to monetize their work, many experts have taken a more skeptical view, arguing that it has resulted in risky speculation.","ko":"밑줄 친 it이 가리키는 것은?","sko":"NFT 기술의 발전이 디지털 창작자들이 자신의 작품을 수익화하는 흥미롭고 새로운 방법으로 과대 선전되었지만, 많은 전문가는 그것이 위험한 투기를 초래했다고 주장하며 더 회의적인 견해를 취해왔다.","opts":["NFT 기술의 발전","디지털 창작자","전문가들의 견해","예술 작품의 가격"],"r":{"a":"1) NFT 기술의 발전","ev":"6번 문장","s":[[6,"While the development of NFT technology has been hyped as an exciting new method for digital creators to monetize their work, many experts have taken a more skeptical view, arguing that it has resulted in risky speculation.","NFT 기술의 발전이 디지털 창작자들이 자신의 작품을 수익화하는 흥미롭고 새로운 방법으로 과대 선전되었지만, 많은 전문가는 그것이 위험한 투기를 초래했다고 주장하며 더 회의적인 견해를 취해왔다."]],"w":"arguing that it has resulted in risky speculation에서 ‘위험한 투기를 초래한 것’은 앞의 the development of NFT technology(NFT 기술의 발전)예요. 전문가나 창작자가 투기를 초래했다는 말은 아니에요.","c":1},"h":"40834a058b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Investors have shown themselves willing to pay excessively high prices for NFT art in the hope of significant profits down the road, only to suffer severe financial losses.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"투자자들은 나중에 큰 이익을 얻을 것이라는 희망으로 NFT 예술품에 지나치게 높은 가격을 기꺼이 지불해 왔지만, 결국 심각한 재정적 손실을 겪었다.","opts":["투자자들은 큰 이익을 기대하고 비싼 값에 샀지만 결국 큰 손실을 입었다.","투자자들은 NFT 예술품을 싼값에 사서 큰 이익을 얻었다.","투자자들은 큰 손실을 겪은 뒤에야 비싼 값에 NFT를 사기로 했다.","투자자들은 NFT 가격이 오르는 것을 보고 판매를 서둘렀다."],"r":{"a":"1) 투자자들은 큰 이익을 기대하고 비싼 값에 샀지만 결국 큰 손실을 입었다.","ev":"7번 문장","s":[[7,"Investors have shown themselves willing to pay excessively high prices for NFT art in the hope of significant profits down the road, only to suffer severe financial losses.","투자자들은 나중에 큰 이익을 얻을 것이라는 희망으로 NFT 예술품에 지나치게 높은 가격을 기꺼이 지불해 왔지만, 결국 심각한 재정적 손실을 겪었다."]],"w":"in the hope of ~는 ‘~을 바라며’, only to suffer는 ‘결국 ~을 겪다’예요. 비싸게 샀는데 결과는 손실이었다는 뜻이에요. 순서가 거꾸로 된 선지(손실 뒤에 구매)와 이익을 얻었다는 선지는 본문과 달라요.","c":1},"h":"7fc111c011"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["<Bored Ape #8817>은 2021년에 340만 달러에 팔렸다.","<Bored Ape #8817>은 2021년에 60만 달러에 팔렸다.","<Bored Ape #8817>은 지금 6,900만 달러의 가치로 평가된다.","<Bored Ape> 시리즈의 다른 NFT 가격은 크게 올랐다."],"opts":["Bored Ape #8817 was sold for $3.4 million in 2021.","Bored Ape #8817 was sold for $600,000 in 2021.","Bored Ape #8817 is now valued at $69 million.","The prices of other NFTs in the Bored Ape series have risen sharply."],"r":{"a":"1) Bored Ape #8817 was sold for $3.4 million in 2021.","ev":"8~9번 문장","s":[[8,"For example, Bored Ape #8817—an NFT image of a golden-furred ape wearing a funny hat—sold for a whopping $3.4 million in 2021.","예를 들어, 우스꽝스러운 모자를 쓴 황금 털 원숭이의 NFT 이미지인 <Bored Ape #8817>은 2021년에 무려 340만 달러에 팔렸다."],[9,"However, the prices of other NFTs in the Bored Ape series have plummeted, and Bored Ape #8817 is now valued at only around $600,000.","그러나, <Bored Ape> 시리즈의 다른 NFT 가격은 폭락했고, <Bored Ape #8817>은 현재 약 60만 달러의 가치로만 평가된다."]],"w":"8번에서 #8817은 2021년에 340만 달러에 팔렸어요. 지금 가치는 약 60만 달러(9번)이고, 6,900만 달러는 1번의 <매일: 첫 5000일>의 가격이에요. 시리즈의 다른 NFT 가격은 올랐다가 아니라 폭락했어요(9번).","c":1},"h":"fdc269dba5"},{"n":9,"t":"sum","q":"An NFT makes a digital file a (A) item, but the (B) of NFT art can fall sharply.","ko":"NFT는 디지털 파일을 (A) 아이템으로 만들어 주지만, NFT 예술의 (B)은 급격히 떨어질 수 있다.","oko":["(A) 하나뿐인 / (B) 품질","(A) 흔한 / (B) 가격","(A) 하나뿐인 / (B) 가격","(A) 복제된 / (B) 크기","(A) 무료인 / (B) 개수"],"opts":["(A) unique / (B) quality","(A) common / (B) price","(A) unique / (B) price","(A) copied / (B) size","(A) free / (B) number"],"r":{"a":"3) (A) unique / (B) price","ev":"3번, 5번, 9번 문장","s":[[3,"This work of art utilizes a revolutionary technology called a non-fungible token (NFT) to guarantee its uniqueness.","이 예술 작품은 고유성을 보장하기 위해 대체 불가능 토큰(NFT)이라는 혁신적인 기술을 활용한다."],[5,"From images to video clips to audio recordings, it is possible to tokenize almost any type of digital file to create a one-of-a-kind item that can be transferred from seller to buyer securely and conveniently.","이미지에서 비디오 클립, 오디오 녹음에 이르기까지, 거의 모든 유형의 디지털 파일을 토큰화하여 판매자에게서 구매자로 안전하고 편리하게 양도될 수 있는 세상에 하나뿐인 아이템을 만드는 것이 가능하다."],[9,"However, the prices of other NFTs in the Bored Ape series have plummeted, and Bored Ape #8817 is now valued at only around $600,000.","그러나, <Bored Ape> 시리즈의 다른 NFT 가격은 폭락했고, <Bored Ape #8817>은 현재 약 60만 달러의 가치로만 평가된다."]],"w":"3번에서 NFT는 고유성(uniqueness)을 보장하고 5번에서 ‘세상에 하나뿐인 아이템’을 만든다고 해요(A는 unique). 9번에서 폭락한 것은 NFT의 가격(prices)이에요(B는 price). 품질이나 크기가 떨어진다는 말은 본문에 없어요.","c":3},"h":"287b9e59bd"},{"n":10,"t":"fill","q":"Many experts are [A] about NFT, since some investors who paid excessively high prices suffered severe [B].","ko":"많은 전문가는 NFT에 대해 [A]인데, 지나치게 높은 가격을 낸 일부 투자자들이 심각한 [B]을 겪었기 때문이다.","bank":["skeptical","losses","optimistic","profits","uniqueness","digital"],"bko":{"skeptical":"회의적인","losses":"손실","optimistic":"낙관적인","profits":"이익","uniqueness":"고유성","digital":"디지털의"},"r":{"a":"[A] skeptical, [B] losses","ev":"6~7번 문장","s":[[6,"While the development of NFT technology has been hyped as an exciting new method for digital creators to monetize their work, many experts have taken a more skeptical view, arguing that it has resulted in risky speculation.","NFT 기술의 발전이 디지털 창작자들이 자신의 작품을 수익화하는 흥미롭고 새로운 방법으로 과대 선전되었지만, 많은 전문가는 그것이 위험한 투기를 초래했다고 주장하며 더 회의적인 견해를 취해왔다."],[7,"Investors have shown themselves willing to pay excessively high prices for NFT art in the hope of significant profits down the road, only to suffer severe financial losses.","투자자들은 나중에 큰 이익을 얻을 것이라는 희망으로 NFT 예술품에 지나치게 높은 가격을 기꺼이 지불해 왔지만, 결국 심각한 재정적 손실을 겪었다."]],"w":"6번에서 많은 전문가는 더 회의적인(skeptical) 견해를 취했다고 하고, 7번에서 투자자들이 심각한 재정 손실(losses)을 겪었다고 해요. optimistic이나 profits를 넣으면 전문가와 투자자의 상황이 본문과 반대가 돼요.","c":null},"h":"1507ae0a7e"}]},{"u":9,"id":"ms4-09-3","no":3,"ko":"지금 이 감각이 진짜일까?","items":[{"n":1,"t":"tf","q":"Descartes explored whether we can trust our senses through his wax argument.","ko":"데카르트는 밀랍 논증을 통해 우리가 감각을 신뢰할 수 있는지 탐구했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The French philosopher René Descartes explored this very idea through his famous wax argument.","프랑스 철학자 르네 데카르트는 그의 유명한 ‘밀랍 논증’을 통해 바로 이 아이디어를 탐구했다."]],"w":"3번 문장에서 데카르트가 ‘감각을 믿을 수 있는가’라는 생각(1~2번)을 밀랍 논증으로 탐구했다고 해요. explore = 탐구하다.","c":"T"},"h":"7e01d0cc29"},{"n":2,"t":"tf","q":"When the wax is heated, only its color changes.","ko":"밀랍이 가열되면 색깔만 변한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"He then points out that when the wax is heated to the melting point, all of these qualities are fundamentally altered.","그런 다음 그는 밀랍이 녹는점까지 가열될 때, 이 모든 성질이 근본적으로 변한다는 것을 지적한다."]],"w":"8번 문장에서 밀랍이 녹는점까지 가열되면 이 모든 성질(질감·색깔·모양·냄새)이 근본적으로 변한다고 해요. 색깔만 변하는 게 아니에요.","c":"F"},"h":"62895b8d1b"},{"n":3,"t":"tf","q":"Descartes described the wax argument in Meditations on First Philosophy.","ko":"데카르트는 <제1철학에 관한 성찰>에서 밀랍 논증을 설명했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"To illustrate the unreliability of the senses, Descartes developed the wax argument in his Meditations on First Philosophy.","감각에 대한 불신을 설명하기 위해, 데카르트는 그의 저서 <제1철학에 관한 성찰>에서 밀랍 논증을 전개했다."]],"w":"6번 문장에 Descartes developed the wax argument in his Meditations on First Philosophy가 나와요. develop = 전개하다.","c":"T"},"h":"13d1f10982"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…describes in great detail the physical characteristics of a piece of wax—its texture, color, shape, and smell.)","ko":"데카르트는 밀랍 조각의 물리적 characteristics, 즉 질감, 색깔, 모양, 냄새를 상세하게 묘사한다. (characteristics의 뜻은?)","opts":["가격","특징","역사","무게"],"word":"characteristics","r":{"a":"2) 특징","ev":"7번 문장","s":[[7,"In this work, Descartes describes in great detail the physical characteristics of a piece of wax—its texture, color, shape, and smell.","이 저서에서, 데카르트는 밀랍 조각의 물리적 특징들, 즉 질감, 색깔, 모양, 냄새를 매우 상세하게 묘사한다."]],"w":"7번에서 대시(—) 뒤에 질감, 색깔, 모양, 냄새가 나열돼요. 이것들이 밀랍의 물리적 특징이므로 characteristic = 특징이에요.","c":2},"h":"3fcbdaa148"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…true understanding is rooted in the mind, not in sensory experience…)","ko":"진정한 이해는 감각적 경험이 아니라 마음에 rooted되어 있다. (be rooted in의 뜻은?)","opts":["~을 넘어서다","~을 의심하다","~에 반대하다","~에 뿌리를 두다"],"word":"rooted","r":{"a":"4) ~에 뿌리를 두다","ev":"10번 문장","s":[[10,"Descartes concludes that true understanding is rooted in the mind, not in sensory experience, reinforcing his famous claim: Cogito, ergo sum—“I think, therefore I am.”","데카르트는 진정한 이해는 감각적 경험이 아니라 마음에 뿌리를 두고 있다고 결론지으며, 그의 유명한 주장인 Cogito, ergo sum, “나는 생각한다, 고로 존재한다”를 강화한다."]],"w":"‘A, not B’ 구조로 마음(A)이 이해의 바탕이고 감각적 경험(B)은 아니라는 말이에요. be rooted in = ~에 뿌리를 두다, ~에 바탕을 두다.","c":4},"h":"b9a6e80385"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAnd yet he is still able to identify it as wax.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그럼에도 불구하고 그는 여전히 그것을 밀랍으로 식별할 수 있다.","opts":["녹는점","밀랍 조각","데카르트의 성찰","인간의 감각"],"r":{"a":"2) 밀랍 조각","ev":"8~9번 문장","s":[[8,"He then points out that when the wax is heated to the melting point, all of these qualities are fundamentally altered.","그런 다음 그는 밀랍이 녹는점까지 가열될 때, 이 모든 성질이 근본적으로 변한다는 것을 지적한다."],[9,"And yet he is still able to identify it as wax.","그럼에도 불구하고 그는 여전히 그것을 밀랍으로 식별할 수 있다."]],"w":"8번에서 가열되어 성질이 모두 변한 것은 the wax(밀랍)이고, 9번에서 ‘여전히 밀랍으로 식별할 수 있는’ 대상도 같은 밀랍 조각이에요.","c":2},"h":"ae369b0492"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By emphasizing reason as the basis of knowledge, he challenges the idea that perception alone can lead to certainty.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"지식의 기초로서 이성을 강조함으로써, 그는 지각만으로는 확실성에 도달할 수 있다는 생각에 이의를 제기한다.","opts":["그는 이성이 지식의 기초라고 강조하면서, 지각만으로 확실성에 이를 수 있다는 생각에 반박한다.","그는 지각이 지식의 기초라고 강조하면서, 이성만으로는 확실성에 이를 수 없다고 주장한다.","그는 이성과 지각 모두를 부정하며 지식은 불가능하다고 말한다.","그는 지각을 강조해서 이성이 확실성에 이르게 한다는 생각을 지지한다."],"r":{"a":"1) 그는 이성이 지식의 기초라고 강조하면서, 지각만으로 확실성에 이를 수 있다는 생각에 반박한다.","ev":"11번 문장","s":[[11,"By emphasizing reason as the basis of knowledge, he challenges the idea that perception alone can lead to certainty.","지식의 기초로서 이성을 강조함으로써, 그는 지각만으로는 확실성에 도달할 수 있다는 생각에 이의를 제기한다."]],"w":"emphasizing reason as the basis는 ‘이성을 기초로 강조하며’, challenges the idea that ~는 ‘~라는 생각에 이의를 제기한다’예요. 그래서 perception alone(지각만)으로 확실성에 이른다는 생각을 반박하는 뜻이에요. 지각과 이성의 역할을 뒤집은 선지가 함정이에요.","c":1},"h":"5882a1e752"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["데카르트는 현대 서양 철학의 아버지로 여겨진다.","데카르트는 감각이 가장 믿을 만한 지식의 근원이라고 보았다.","데카르트는 밀랍 논증을 철학이 아닌 과학 책에서 소개했다.","데카르트는 18세기에 활동한 사상가이다."],"opts":["Descartes is considered the father of modern Western philosophy.","Descartes believed the senses are the most reliable source of knowledge.","Descartes introduced the wax argument in a science textbook.","Descartes was a thinker of the 18th century."],"r":{"a":"1) Descartes is considered the father of modern Western philosophy.","ev":"4번 문장","s":[[4,"This 17th-century thinker, considered the father of modern Western philosophy, was highly doubtful of knowledge gained by any means other than reason.","근대 서양 철학의 아버지로 여겨지는 이 17세기 사상가는 이성 이외의 수단으로 얻은 지식에 대해 매우 회의적이었다."]],"w":"4번에서 그는 근대 서양 철학의 아버지로 여겨지는 17세기 사상가예요. 감각을 신뢰할 수 없다고 했고(5번), 밀랍 논증은 철학서인 <제1철학에 관한 성찰>에 있어요(6번). 18세기가 아니라 17세기예요.","c":1},"h":"8f969d5fc4"},{"n":9,"t":"sum","q":"Descartes showed that the (A) of wax change when heated, yet we still recognize it, so true understanding comes from the (B), not the senses.","ko":"데카르트는 밀랍이 가열되면 (A)이 변하지만 우리가 여전히 그것을 알아본다는 것을 보여, 진정한 이해는 감각이 아니라 (B)에서 나온다고 했다.","oko":["(A) 가격 / (B) 마음","(A) 성질 / (B) 가격","(A) 성질 / (B) 마음","(A) 크기 / (B) 시간","(A) 이름 / (B) 사회"],"opts":["(A) prices / (B) mind","(A) qualities / (B) prices","(A) qualities / (B) mind","(A) sizes / (B) time","(A) names / (B) society"],"r":{"a":"3) (A) qualities / (B) mind","ev":"8~10번 문장","s":[[8,"He then points out that when the wax is heated to the melting point, all of these qualities are fundamentally altered.","그런 다음 그는 밀랍이 녹는점까지 가열될 때, 이 모든 성질이 근본적으로 변한다는 것을 지적한다."],[9,"And yet he is still able to identify it as wax.","그럼에도 불구하고 그는 여전히 그것을 밀랍으로 식별할 수 있다."],[10,"Descartes concludes that true understanding is rooted in the mind, not in sensory experience, reinforcing his famous claim: Cogito, ergo sum—“I think, therefore I am.”","데카르트는 진정한 이해는 감각적 경험이 아니라 마음에 뿌리를 두고 있다고 결론지으며, 그의 유명한 주장인 Cogito, ergo sum, “나는 생각한다, 고로 존재한다”를 강화한다."]],"w":"8번에서 가열하면 변하는 것은 질감·색깔·모양·냄새 같은 성질(qualities)이고, 9번에서 그래도 밀랍임을 알아봐요. 10번에서 진정한 이해는 마음(mind)에 뿌리를 두고 감각적 경험이 아니라고 해요. 가격, 크기, 이름은 본문에 없는 말이에요.","c":3},"h":"20dc8982b9"},{"n":10,"t":"fill","q":"Descartes claimed that we cannot [A] the information gathered by our senses, and his insights shaped modern [B].","ko":"데카르트는 우리가 감각으로 수집한 정보를 [A]할 수 없다고 주장했고, 그의 통찰은 현대 [B]을 형성했다.","bank":["trust","rationalism","wax","texture","identify","melting"],"bko":{"trust":"신뢰하다","rationalism":"합리주의","wax":"밀랍","texture":"질감","identify":"식별하다","melting":"녹는"},"r":{"a":"[A] trust, [B] rationalism","ev":"5번, 12번 문장","s":[[5,"He even went so far as to claim that we cannot trust the information gathered by our senses.","그는 심지어 우리가 감각에 의해 수집된 정보를 신뢰할 수 없다고 주장하기까지 했다."],[12,"His insights laid the groundwork for modern rationalism, shaping debates on the nature of knowledge and the reliability of human perception for centuries to come.","그의 통찰력은 현대 합리주의의 기틀을 마련했으며, 다가올 수세기 동안 지식의 본질과 인간 지각의 신뢰성에 대한 논쟁을 형성했다."]],"w":"5번에서 데카르트는 감각이 수집한 정보를 신뢰할 수 없다(cannot trust)고 주장했고, 12번에서 그의 통찰이 현대 합리주의(rationalism)의 기틀을 마련했다고 해요. identify를 넣으면 5번의 trust와 뜻이 달라져 본문과 맞지 않아요.","c":null},"h":"22fd784724"}]},{"u":9,"id":"ms4-09-4","no":4,"ko":"Loading... Answer Not Found","items":[{"n":1,"t":"tf","q":"The Feeling of Knowing is related to having partial information about a question.","ko":"알 것 같은 느낌은 질문에 대한 부분적인 정보를 가지고 있는 것과 관련이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"According to several scientific studies, it’s related to having partial information about the given question.","몇몇 과학적 연구에 따르면, 그것은 주어진 질문에 대한 부분적인 정보를 가지고 있는 것과 관련이 있다."]],"w":"6번 문장에서 몇몇 과학적 연구에 따르면 이 느낌은 주어진 질문에 대한 부분적인 정보를 가지고 있는 것과 관련이 있다고 해요. partial = 부분적인.","c":"T"},"h":"494b22c06a"},{"n":2,"t":"tf","q":"When you have the Feeling of Knowing, you can easily retrieve the information.","ko":"알 것 같은 느낌이 들 때, 당신은 쉽게 정보를 인출할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"The Feeling of Knowing refers to being unable to retrieve information from memory, even though you believe you can.","알 것 같은 느낌은 비록 당신이 할 수 있다고 믿을지라도 기억에서 정보를 인출할 수 없는 것을 말한다."]],"w":"3번 문장에서 알 것 같은 느낌은 정보를 믿는데도 기억에서 인출할 수 없는 상태(unable to retrieve)예요. 쉽게 꺼낼 수 있다는 말은 반대예요.","c":"F"},"h":"2d8203349a"},{"n":3,"t":"tf","q":"The medial prefrontal cortex checks whether the retrieved information fits the question.","ko":"내측 전전두피질은 인출된 정보가 질문에 맞는지 확인한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Second, it evaluates whether the information you are retrieving is relevant to the question.","둘째, 그것은 당신이 인출하고 있는 정보가 질문과 관련이 있는지를 평가한다."]],"w":"12번 문장에 Second, it evaluates whether the information you are retrieving is relevant to the question이 나와요. evaluate = 평가하다, relevant = 관련된.","c":"T"},"h":"bbf209f22b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This frustrating situation is an example of the Feeling of Knowing.)","ko":"이 frustrating한 상황은 알 것 같은 느낌의 한 예이다. (frustrating의 뜻은?)","opts":["신나는","좌절감을 주는","평범한","안심되는"],"word":"frustrating","r":{"a":"2) 좌절감을 주는","ev":"2번 문장","s":[[2,"This frustrating situation is an example of the Feeling of Knowing.","이 좌절감을 주는 상황은 ‘알 것 같은 느낌(Feeling of Knowing)’의 한 예이다."]],"w":"1번에서 단어를 분명히 아는데 말이 안 나오는 상황을 소개하고, 2번에서 그 상황을 frustrating하다고 해요. 알면서 못 꺼내니 답답하고 좌절감이 드는 거예요. frustrating = 좌절감을 주는.","c":2},"h":"49c2ed0a23"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…this largely unconscious process, you’re left with nothing but the Feeling of Knowing.)","ko":"이 대개 unconscious한 과정에서 정답이 나오지 않는다면 알 것 같은 느낌만 남는다. (unconscious의 뜻은?)","opts":["의식적인","무의식적인","고의적인","느린"],"word":"unconscious","r":{"a":"2) 무의식적인","ev":"13번 문장","s":[[13,"If no correct answer emerges from this largely unconscious process, you’re left with nothing but the Feeling of Knowing.","만약 이 대개 무의식적인 과정에서 정답이 나오지 않는다면, 당신에게는 알 것 같은 느낌만 남게 되는 것이다."]],"w":"13번은 11~12번의 뇌 과정이 우리가 의식하지 못하는 사이에 일어난다는 뜻이에요. 그래서 unconscious = 무의식적인이에요. conscious(의식적인)와 반대예요.","c":2},"h":"bc17d40491"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhile experiencing it, you intuitively sense that with just a little more time or different circumstances, the information will surely come to you.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것을 경험하는 동안, 당신은 조금만 더 시간이 있거나 다른 상황이라면 정보가 확실히 떠오를 것이라고 직관적으로 감지한다.","opts":["기억 속의 정보","주어진 질문","당신이 아는 유명인","알 것 같은 느낌"],"r":{"a":"4) 알 것 같은 느낌","ev":"3~4번 문장","s":[[3,"The Feeling of Knowing refers to being unable to retrieve information from memory, even though you believe you can.","알 것 같은 느낌은 비록 당신이 할 수 있다고 믿을지라도 기억에서 정보를 인출할 수 없는 것을 말한다."],[4,"While experiencing it, you intuitively sense that with just a little more time or different circumstances, the information will surely come to you.","그것을 경험하는 동안, 당신은 조금만 더 시간이 있거나 다른 상황이라면 정보가 확실히 떠오를 것이라고 직관적으로 감지한다."]],"w":"‘경험하는(experiencing) 것’은 3번에서 설명한 알 것 같은 느낌(the Feeling of Knowing)이에요. 정보를 경험하는 것이 아니라 그 느낌을 경험하는 거예요.","c":4},"h":"9c2026edf8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In short, the more partial information you have, the stronger your Feeling of Knowing will be.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"요약하면, 당신이 더 많은 부분적인 정보를 가질수록, 당신의 알 것 같은 느낌은 더 강해질 것이다.","opts":["부분적인 정보가 많을수록 알 것 같은 느낌은 더 약해진다.","부분적인 정보가 적을수록 알 것 같은 느낌은 더 강해진다.","부분적인 정보가 많을수록 알 것 같은 느낌은 더 강해진다.","알 것 같은 느낌이 강할수록 부분적인 정보는 줄어든다."],"r":{"a":"3) 부분적인 정보가 많을수록 알 것 같은 느낌은 더 강해진다.","ev":"7번 문장","s":[[7,"In short, the more partial information you have, the stronger your Feeling of Knowing will be.","요약하면, 당신이 더 많은 부분적인 정보를 가질수록, 당신의 알 것 같은 느낌은 더 강해질 것이다."]],"w":"the more ~, the stronger …은 ‘~할수록 더 …하다’예요. 정보(more partial information)가 늘수록 느낌(stronger)도 커져요. 방향을 반대로 바꾼 선지와 원인·결과를 뒤집은 선지가 함정이에요.","c":3},"h":"5999b87b08"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["알 것 같은 느낌이 있을 때 내측 전전두피질이 활성화된다.","알 것 같은 느낌은 부분적인 정보가 많을수록 약해진다.","내측 전전두피질은 주로 단기 기억에 관여하는 영역이다.","뇌 스캔에서는 아무 영역도 활성화되지 않았다."],"opts":["The medial prefrontal cortex activates when the Feeling of Knowing occurs.","The Feeling of Knowing gets weaker as you have more partial information.","The medial prefrontal cortex is mainly involved in short-term memory.","Brain scans showed that no area of the brain was activated."],"r":{"a":"1) The medial prefrontal cortex activates when the Feeling of Knowing occurs.","ev":"7번, 10번 문장","s":[[7,"In short, the more partial information you have, the stronger your Feeling of Knowing will be.","요약하면, 당신이 더 많은 부분적인 정보를 가질수록, 당신의 알 것 같은 느낌은 더 강해질 것이다."],[10,"Brain scans taken during such moments have shown that the medial prefrontal cortex, a region of the brain critically involved in long-term memory retrieval, activates.","그러한 순간에 촬영된 뇌 스캔은 장기 기억 인출에 결정적으로 관여하는 뇌 영역인 내측 전전두피질이 활성화된다는 것을 보여주었다."]],"w":"10번에서 그러한 순간의 뇌 스캔은 내측 전전두피질이 활성화된다고 보여 줬어요. 정보가 많을수록 느낌은 강해지고(7번), 이 영역은 장기 기억 인출에 관여해요(10번).","c":1},"h":"032ea3ffb2"},{"n":9,"t":"sum","q":"The Feeling of Knowing occurs when you cannot (A) information even though you have partial information, and it gets (B) as you have more of it.","ko":"알 것 같은 느낌은 부분적인 정보가 있는데도 정보를 (A)할 수 없을 때 생기며, 그 정보가 많아질수록 (B)진다.","oko":["(A) 저장 / (B) 약해","(A) 잊어버리 / (B) 약해","(A) 인출 / (B) 약해","(A) 잊어버리 / (B) 강해","(A) 인출 / (B) 강해"],"opts":["(A) store / (B) weaker","(A) forget / (B) weaker","(A) retrieve / (B) weaker","(A) forget / (B) stronger","(A) retrieve / (B) stronger"],"r":{"a":"5) (A) retrieve / (B) stronger","ev":"3번, 6번, 7번 문장","s":[[3,"The Feeling of Knowing refers to being unable to retrieve information from memory, even though you believe you can.","알 것 같은 느낌은 비록 당신이 할 수 있다고 믿을지라도 기억에서 정보를 인출할 수 없는 것을 말한다."],[6,"According to several scientific studies, it’s related to having partial information about the given question.","몇몇 과학적 연구에 따르면, 그것은 주어진 질문에 대한 부분적인 정보를 가지고 있는 것과 관련이 있다."],[7,"In short, the more partial information you have, the stronger your Feeling of Knowing will be.","요약하면, 당신이 더 많은 부분적인 정보를 가질수록, 당신의 알 것 같은 느낌은 더 강해질 것이다."]],"w":"3번에서 정보를 기억에서 인출(retrieve)할 수 없는 것을 말하고, 6~7번에서 부분적인 정보가 많을수록 느낌이 더 강해진다(stronger)고 해요. 나머지는 인출이 아닌 단어를 쓰거나 강해진다를 약해진다로 바꾼 오답이에요.","c":5},"h":"3767aa99ec"},{"n":10,"t":"fill","q":"This area has two key functions: it [A] through the partial information you remember, and it [B] whether the information is relevant to the question.","ko":"이 영역은 두 가지 핵심 기능을 가진다. 당신이 기억하는 부분적인 정보를 [A]하고, 그 정보가 질문과 관련 있는지 [B]한다.","bank":["cycles","evaluates","ignores","forgets","activates","stores"],"bko":{"cycles":"순환시키다","evaluates":"평가하다","ignores":"무시하다","forgets":"잊어버리다","activates":"활성화하다","stores":"저장하다"},"r":{"a":"[A] cycles, [B] evaluates","ev":"11~12번 문장","s":[[11,"This area has two key functions: First, it cycles through the partial information you do remember about the subject (in this case, the celebrity).","이 영역은 두 가지 핵심 기능을 가지는데, 첫째, 그것은 당신이 그 대상(이 경우, 유명인)에 대해 정말로 기억하고 있는 부분적인 정보를 순환시킨다."],[12,"Second, it evaluates whether the information you are retrieving is relevant to the question.","둘째, 그것은 당신이 인출하고 있는 정보가 질문과 관련이 있는지를 평가한다."]],"w":"11번에서 첫째 기능은 기억하는 부분적인 정보를 순환시키는 것(cycles through), 12번에서 둘째 기능은 정보가 질문과 관련 있는지 평가하는 것(evaluates)이에요. 무시하거나 잊어버린다는 말은 본문에 없어요.","c":null},"h":"92c77c68a3"}]},{"u":10,"id":"ms4-10-1","no":1,"ko":"내 심장 소리가 들려","items":[{"n":1,"t":"tf","q":"The chamber is supported by springs that prevent vibrations.","ko":"방은 진동을 방지하는 스프링으로 지지된다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"External noises cannot penetrate the chamber because it is constructed of steel and concrete layers and is supported by springs that prevent vibrations.","외부 소음은 강철과 콘크리트 층으로 건설되고 진동을 방지하는 스프링으로 지지되기 때문에 방을 뚫고 들어올 수 없다."]],"w":"3번 문장에서 방이 진동을 방지하는 스프링으로 지지된다(is supported by springs that prevent vibrations)고 해요.","c":"T"},"h":"b16d40a6de"},{"n":2,"t":"tf","q":"Many people have stayed inside an anechoic chamber for several hours.","ko":"많은 사람이 무향실 안에서 몇 시간 동안 머물렀다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"The experience is very disorienting, and no one has ever been able to stay inside an anechoic chamber for much longer than an hour.","그 경험은 매우 방향 감각을 상실하게 하며, 한 시간보다 훨씬 오래 머무를 수 있었던 사람은 없었다."]],"w":"2번 문장에서 한 시간보다 훨씬 오래 머무를 수 있었던 사람은 없었다(no one has ever been able to stay … much longer than an hour)고 해요. 몇 시간 머문 사람이 많다는 말은 반대예요.","c":"F"},"h":"3d3ceee66d"},{"n":3,"t":"tf","q":"Most sound waves that hit a wedge bounce back toward the center of the room.","ko":"쐐기에 부딪힌 대부분의 음파는 방의 중앙을 향해 되튕겨 나온다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"These stick out from all parts of the internal walls, floor, and ceiling, so sound waves generated inside the chamber almost immediately strike one.","이것들은 내부 벽, 바닥, 천장의 모든 부분에서 튀어나와 있어서, 방 내부에서 발생한 음파는 거의 즉시 그것에 부딪힌다."],[9,"When this occurs, most of the sound waves are absorbed, and the angle of the wedge ensures that any reflected waves end up hitting an adjacent wedge.","이런 일이 발생하면, 대부분의 음파는 흡수되고, 쐐기의 각도는 반사된 파동이 결국 인접한 쐐기에 부딪히도록 보장한다."]],"w":"9번 문장에서 대부분의 음파는 흡수된다(most of the sound waves are absorbed)고 해요. 반사된 파동도 중앙이 아니라 옆의 쐐기에 부딪혀요.","c":"F"},"h":"496ee66e80"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The experience is very disorienting, ...)","ko":"그 경험은 매우 방향 감각을 상실하게 한다. (disorient는 혼란스럽게 하다)","opts":["편안하게 하는","혼란스럽게 하는","지루하게 하는","안전하게 하는"],"word":"disorienting","r":{"a":"2) 혼란스럽게 하는","ev":"2번 문장","s":[[2,"The experience is very disorienting, and no one has ever been able to stay inside an anechoic chamber for much longer than an hour.","그 경험은 매우 방향 감각을 상실하게 하며, 한 시간보다 훨씬 오래 머무를 수 있었던 사람은 없었다."]],"w":"너무 조용한 방의 경험이 방향 감각을 잃게 해서 한 시간 넘게 머문 사람이 없어요. disorient = 혼란스럽게 하다이므로 disorienting은 ‘혼란스럽게 하는’이에요.","c":2},"h":"e81b4917b3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (..., which guarantees that any sound in the room is stifled.)","ko":"…, 이는 방 안의 어떤 소리도 들리지 않게 되는 것을 보장한다.","opts":["의심한다","기록한다","방해한다","보장한다"],"word":"guarantees","r":{"a":"4) 보장한다","ev":"6번 문장","s":[[6,"But the most impressive feature is the design of the interior, which guarantees that any sound in the room is stifled.","그러나 가장 인상적인 특징은 내부 디자인인데, 이는 방 안의 어떤 소리도 들리지 않게 되는 것을 보장한다."]],"w":"내부 디자인이 방 안의 소리가 모두 사라지는 것을 확실하게 해 준다는 뜻이에요. guarantee = 보장하다.","c":4},"h":"5201fee45a"},{"n":6,"t":"ref","q":"What does the underlined \"These\" refer to?\nThese stick out from all parts of the internal walls, floor, and ceiling, so sound waves generated inside the chamber almost immediately strike one.","ko":"밑줄 친 These가 가리키는 것은?","sko":"이것들은 내부 벽, 바닥, 천장의 모든 부분에서 튀어나와 있어서, 방 내부에서 발생한 음파는 거의 즉시 그것에 부딪힌다.","opts":["쐐기들","벽, 바닥, 천장","음파들","스프링들"],"r":{"a":"1) 쐐기들","ev":"7~8번 문장","s":[[7,"This effect is achieved through the use of wedges made of sound-absorbent material.","이 효과는 흡음 재료로 만들어진 쐐기의 사용을 통해 달성된다."],[8,"These stick out from all parts of the internal walls, floor, and ceiling, so sound waves generated inside the chamber almost immediately strike one.","이것들은 내부 벽, 바닥, 천장의 모든 부분에서 튀어나와 있어서, 방 내부에서 발생한 음파는 거의 즉시 그것에 부딪힌다."]],"w":"7번에서 흡음 재료로 만든 쐐기(wedges)가 나오고, 8번의 These가 그 쐐기들을 받아요. 벽·바닥·천장은 쐐기가 튀어나와 있는 곳이에요.","c":1},"h":"423eca228f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even the external passageway will be attached only to the room’s outer shell to stop vibrations from people’s steps from causing interference.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"심지어 외부 통로도 사람들의 발걸음으로 인한 진동이 간섭을 일으키는 것을 막기 위해 방의 외벽에다가만 둘 것이다.","opts":["외부 통로가 방 전체에 단단히 연결되어 있어서 진동이 방 안으로 전해진다.","외부 통로도 방의 외벽에만 붙여서 발걸음의 진동이 간섭을 일으키지 못하게 한다.","외부 통로는 사람들의 발걸음을 크게 울리게 하려고 외벽에 붙인다.","외부 통로에서 나는 소리를 방 안에서 들을 수 있도록 외벽을 얇게 만든다."],"r":{"a":"2) 외부 통로도 방의 외벽에만 붙여서 발걸음의 진동이 간섭을 일으키지 못하게 한다.","ev":"5번 문장","s":[[5,"Even the external passageway will be attached only to the room’s outer shell to stop vibrations from people’s steps from causing interference.","심지어 외부 통로도 사람들의 발걸음으로 인한 진동이 간섭을 일으키는 것을 막기 위해 방의 외벽에다가만 둘 것이다."]],"w":"only to the room’s outer shell은 ‘외벽에만’이에요. to stop A from -ing는 ‘A가 ~하는 것을 막기 위해’이고, 막으려는 것은 발걸음 진동의 간섭이에요.","c":2},"h":"3a0da37956"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["방은 얇은 유리 층으로 지어져 있다.","문은 가볍고 바깥 공기가 계속 들어오게 한다.","방은 스프링으로 지지되어 진동을 막는다.","외부 소음은 방의 벽을 통해 쉽게 들어온다."],"opts":["The chamber is built from thin layers of glass.","The doors are light and let outside air in all the time.","The chamber is supported by springs to stop vibrations.","Outside noises easily enter through the chamber’s walls."],"r":{"a":"3) The chamber is supported by springs to stop vibrations.","ev":"3~4번 문장","s":[[3,"External noises cannot penetrate the chamber because it is constructed of steel and concrete layers and is supported by springs that prevent vibrations.","외부 소음은 강철과 콘크리트 층으로 건설되고 진동을 방지하는 스프링으로 지지되기 때문에 방을 뚫고 들어올 수 없다."],[4,"Heavy doors sealed with rubber gaskets keep outside air to a minimum.","고무 개스킷으로 밀봉된 무거운 문들은 외부 공기를 최소한으로 유지한다."]],"w":"3번에서 방은 강철과 콘크리트 층으로 지어지고 진동을 방지하는 스프링으로 지지돼요. 4번에서 무거운 문이 외부 공기를 최소한으로 유지하고, 외부 소음은 방을 뚫고 들어올 수 없어요.","c":3},"h":"c3379096e7"},{"n":9,"t":"sum","q":"An anechoic chamber keeps (A) noises out, and its (B) design makes any sound in the room disappear.","ko":"무향실은 (A) 소음을 막아 내고, 그곳의 (B) 디자인은 방 안의 어떤 소리도 사라지게 한다.","oko":["(A) 외부의 / (B) 외부","(A) 내부의 / (B) 내부","(A) 내부의 / (B) 외부","(A) 시끄러운 / (B) 외부","(A) 외부의 / (B) 내부"],"opts":["(A) external / (B) exterior","(A) internal / (B) interior","(A) internal / (B) exterior","(A) loud / (B) exterior","(A) external / (B) interior"],"r":{"a":"5) (A) external / (B) interior","ev":"3번, 6번 문장","s":[[3,"External noises cannot penetrate the chamber because it is constructed of steel and concrete layers and is supported by springs that prevent vibrations.","외부 소음은 강철과 콘크리트 층으로 건설되고 진동을 방지하는 스프링으로 지지되기 때문에 방을 뚫고 들어올 수 없다."],[6,"But the most impressive feature is the design of the interior, which guarantees that any sound in the room is stifled.","그러나 가장 인상적인 특징은 내부 디자인인데, 이는 방 안의 어떤 소리도 들리지 않게 되는 것을 보장한다."]],"w":"3번에서 external noises(외부 소음)는 방을 뚫고 들어올 수 없고, 6번에서 가장 인상적인 특징은 the design of the interior(내부 디자인)라고 해요.","c":5},"h":"ab1484d7c0"},{"n":10,"t":"fill","q":"Reflected sound waves keep hitting [A] wedges until the waves are finally [B], leaving total silence.","ko":"반사된 음파는 파동이 마침내 [B]될 때까지 [A] 쐐기에 계속 부딪히고, 완전한 침묵이 남는다.","bank":["adjacent","eliminated","external","vibrations","constructed","disorienting"],"bko":{"adjacent":"인접한","eliminated":"제거된","external":"외부의","vibrations":"진동","constructed":"건설된","disorienting":"방향 감각을 잃게 하는"},"r":{"a":"[A] adjacent, [B] eliminated","ev":"9~10번 문장","s":[[9,"When this occurs, most of the sound waves are absorbed, and the angle of the wedge ensures that any reflected waves end up hitting an adjacent wedge.","이런 일이 발생하면, 대부분의 음파는 흡수되고, 쐐기의 각도는 반사된 파동이 결국 인접한 쐐기에 부딪히도록 보장한다."],[10,"The process repeats itself until the sound waves are eliminated, resulting in total silence for anyone standing at the chamber’s center.","이 과정은 음파가 제거될 때까지 반복되어, 방의 중앙에 서 있는 누구에게나 완전한 침묵을 초래한다."]],"w":"9번에서 반사된 파동은 인접한 쐐기(an adjacent wedge)에 부딪히고, 10번에서 이 과정은 음파가 제거될 때까지(until the sound waves are eliminated) 반복돼요. external은 쐐기가 있는 곳(내부 벽)과 맞지 않아요.","c":null},"h":"a22dc85488"}]},{"u":10,"id":"ms4-10-2","no":2,"ko":"유리 빌딩 보면서 불안했던 사람 손","items":[{"n":1,"t":"tf","q":"The exterior glass of a skyscraper with a curtain wall is not a structural component of the building.","ko":"커튼월이 있는 고층 건물의 외부 유리는 건물의 구조적 구성 요소가 아니다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It is because the exterior glass is not actually a structural component of the building—it is a thin covering known as a curtain wall.","그것은 외부 유리가 실제로는 건물의 구조적 구성 요소가 아니라, 그것이 커튼월이라고 알려진 얇은 덮개이기 때문이다."]],"w":"3번 문장에서 외부 유리는 실제로는 건물의 구조적 구성 요소가 아니라 커튼월이라고 알려진 얇은 덮개라고 해요.","c":"T"},"h":"ebb0ebc88e"},{"n":2,"t":"tf","q":"Curtain walls are usually made of heavy concrete panels.","ko":"커튼월은 보통 무거운 콘크리트 패널로 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Typically made of aluminum frames with glass panels, curtain walls form a lightweight skin designed to be visually pleasing.","일반적으로 유리 패널이 있는 알루미늄 프레임으로 만들어진 커튼월은 시각적으로 즐거움을 주도록 설계된 가벼운 외피를 이룬다."]],"w":"6번 문장에서 커튼월은 일반적으로 유리 패널이 있는 알루미늄 프레임으로 만들어진 가벼운 외피(lightweight skin)라고 해요. 무거운 콘크리트 패널은 본문에 없어요.","c":"F"},"h":"f794818766"},{"n":3,"t":"tf","q":"The glass coating makes heating and cooling costs higher.","ko":"유리 코팅은 냉난방 비용을 더 높게 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"Another key function is improving energy efficiency—the glass is typically coated with substances that enhance insulation and regulate incoming sunlight.","또 다른 핵심 기능은 에너지 효율성을 향상시키는 것으로, 유리는 일반적으로 단열을 강화하고 들어오는 햇빛을 조절하는 물질로 코팅된다."],[10,"This makes it easier to maintain interior temperatures, which reduces heating and cooling costs.","이것은 내부 온도를 유지하는 것을 더 쉽게 만들어, 냉난방 비용을 줄여준다."]],"w":"9번에서 유리는 단열을 높이고 햇빛을 조절하는 물질로 코팅되고, 10번에서 그 덕분에 냉난방 비용이 줄어든다(reduces heating and cooling costs)고 해요. 비용이 높아진다는 말은 반대예요.","c":"F"},"h":"2b73d31892"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The sight of sunlight glinting off the glass surfaces of skyscrapers is prevalent in urban areas.)","ko":"고층 건물의 유리 표면에 햇빛이 반짝이는 광경은 도시 지역에서 일반적이다. (prevalent는 일반적인)","opts":["드문","일반적인","위험한","값비싼"],"word":"prevalent","r":{"a":"2) 일반적인","ev":"1번 문장","s":[[1,"The sight of sunlight glinting off the glass surfaces of skyscrapers is prevalent in urban areas.","고층 건물의 유리 표면에 햇빛이 반짝이는 광경은 도시 지역에서 일반적이다."]],"w":"도시 지역에서 유리 고층 건물에 햇빛이 반짝이는 모습은 흔히 볼 수 있어요. prevalent = 일반적인, 흔한이에요.","c":2},"h":"046ff8eb71"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...such a fragile material?)","ko":"…그렇게 깨지기 쉬운 재료…?","opts":["깨지기 쉬운","단단한","투명한","값싼"],"word":"fragile","r":{"a":"1) 깨지기 쉬운","ev":"2번 문장","s":[[2,"But how can these massive structures have walls made of such a fragile material?","하지만 어떻게 이 거대한 구조물들이 그렇게 깨지기 쉬운 재료로 만들어진 벽을 가질 수 있을까?"]],"w":"2번은 ‘거대한 건물의 벽이 어떻게 그렇게 ~한 재료로 만들어질 수 있나?’라는 의문이에요. 유리는 쉽게 깨지므로 fragile = 깨지기 쉬운이에요.","c":1},"h":"ac87222ac8"},{"n":6,"t":"ref","q":"What does the underlined \"These\" refer to?\nThese are treated with a reflective coating that permits only 20 percent of the intense desert sunlight to enter, protecting occupants from the heat and glare while creating an aesthetically pleasing façade.","ko":"밑줄 친 These가 가리키는 것은?","sko":"이것들은 강렬한 사막 햇빛의 20퍼센트만 들어오도록 허용하는 반사 코팅으로 처리되어, 미적으로 즐거움을 주는 정면을 만들면서 열과 눈부심으로부터 거주자를 보호한다.","opts":["거주자들","828미터의 높이","약 28,000개의 유리 패널","강렬한 사막 햇빛"],"r":{"a":"3) 약 28,000개의 유리 패널","ev":"12~13번 문장","s":[[12,"Rising to a height of 828 meters, this iconic tower features a curtain wall composed of approximately 28,000 glass panels.","828미터 높이로 솟아 있는 이 상징적인 탑은 약 28,000개의 유리 패널로 구성된 커튼월을 특징으로 한다."],[13,"These are treated with a reflective coating that permits only 20 percent of the intense desert sunlight to enter, protecting occupants from the heat and glare while creating an aesthetically pleasing façade.","이것들은 강렬한 사막 햇빛의 20퍼센트만 들어오도록 허용하는 반사 코팅으로 처리되어, 미적으로 즐거움을 주는 정면을 만들면서 열과 눈부심으로부터 거주자를 보호한다."]],"w":"12번에서 탑의 커튼월이 약 28,000개의 유리 패널로 구성된다고 하고, 13번의 These(복수)가 그 패널들을 받아요. 코팅으로 처리되는 것은 유리 패널이에요.","c":3},"h":"36d991336d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Of course, their purpose extends beyond appearance.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"물론, 그것들의 목적은 외관 그 이상으로 확장된다.","opts":["물론 커튼월은 외관이 전혀 중요하지 않다.","물론 커튼월의 목적은 외관에서 멀리 떨어진 곳에 있다.","물론 커튼월의 목적은 오직 외관을 아름답게 하는 것이다.","물론 커튼월은 보기 좋게 하는 것 외에 다른 목적도 있다."],"r":{"a":"4) 물론 커튼월은 보기 좋게 하는 것 외에 다른 목적도 있다.","ev":"7번 문장","s":[[7,"Of course, their purpose extends beyond appearance.","물론, 그것들의 목적은 외관 그 이상으로 확장된다."]],"w":"extend beyond ~는 ‘~를 넘어선다’는 뜻이에요. 목적이 외관을 넘어선다는 건 보기 좋게 하는 것 말고도 목적이 더 있다는 말이고, 8~10번에서 그 기능이 나와요.","c":4},"h":"f6462674aa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["커튼월은 건물의 안쪽에 붙어 있다.","커튼월의 유리는 보통 들어오는 햇빛을 조절하는 물질로 코팅된다.","부르즈 할리파의 커튼월은 약 2,800개의 유리 패널로 이루어져 있다.","커튼월은 건물의 무게를 지탱한다."],"opts":["A curtain wall is attached to the inside of a building.","The glass of a curtain wall is usually coated to regulate incoming sunlight.","The Burj Khalifa’s curtain wall is made of about 2,800 glass panels.","A curtain wall supports the weight of a building."],"r":{"a":"2) The glass of a curtain wall is usually coated to regulate incoming sunlight.","ev":"9번 문장","s":[[9,"Another key function is improving energy efficiency—the glass is typically coated with substances that enhance insulation and regulate incoming sunlight.","또 다른 핵심 기능은 에너지 효율성을 향상시키는 것으로, 유리는 일반적으로 단열을 강화하고 들어오는 햇빛을 조절하는 물질로 코팅된다."]],"w":"9번에서 유리는 보통 단열을 강화하고 들어오는 햇빛을 조절하는 물질로 코팅된다고 해요. 커튼월은 건물 바깥에 붙고(4번), 무게를 지탱하지 않으며(5번), 부르즈 할리파는 약 28,000개의 패널이에요(12번).","c":2},"h":"176e7b8c50"},{"n":9,"t":"sum","q":"A curtain wall is a (A) covering of glass that does not carry the building’s weight, and it also (B) the building from harsh weather.","ko":"커튼월은 건물의 무게를 지탱하지 않는 (A) 유리 덮개이고, 혹독한 날씨로부터 건물을 (B)하기도 한다.","oko":["(A) 두꺼운 / (B) 보호한다","(A) 얇은 / (B) 노출시킨다","(A) 무거운 / (B) 손상시킨다","(A) 두꺼운 / (B) 노출시킨다","(A) 얇은 / (B) 보호한다"],"opts":["(A) thick / (B) shields","(A) thin / (B) exposes","(A) heavy / (B) damages","(A) thick / (B) exposes","(A) thin / (B) shields"],"r":{"a":"5) (A) thin / (B) shields","ev":"3번, 5번, 8번 문장","s":[[3,"It is because the exterior glass is not actually a structural component of the building—it is a thin covering known as a curtain wall.","그것은 외부 유리가 실제로는 건물의 구조적 구성 요소가 아니라, 그것이 커튼월이라고 알려진 얇은 덮개이기 때문이다."],[5,"In contrast to a conventional wall, it does not bear any weight.","전통적인 벽과 대조적으로, 그것은 어떤 무게도 지탱하지 않는다."],[8,"They offer protection against harsh weather by shielding the structure from rain, snow, and wind.","그것들은 비, 눈, 바람으로부터 구조물을 보호함으로써 혹독한 날씨에 대한 보호를 제공한다."]],"w":"3번에서 커튼월은 얇은 덮개(a thin covering)이고, 5번에서 어떤 무게도 지탱하지 않아요. 8번에서 비, 눈, 바람으로부터 구조물을 보호해요(shielding).","c":5},"h":"0f1f818937"},{"n":10,"t":"fill","q":"The Burj Khalifa’s glass panels are treated with a [A] coating that lets in only 20 percent of the [B] desert sunlight.","ko":"부르즈 할리파의 유리 패널은 강렬한 사막 햇빛의 20퍼센트만 들어오게 하는 [A] 코팅으로 처리되어 있다. ([B]는 햇빛을 꾸미는 말)","bank":["reflective","intense","fragile","structural","prevalent","urban"],"bko":{"reflective":"반사하는","intense":"강렬한","fragile":"깨지기 쉬운","structural":"구조적인","prevalent":"일반적인","urban":"도시의"},"r":{"a":"[A] reflective, [B] intense","ev":"13번 문장","s":[[13,"These are treated with a reflective coating that permits only 20 percent of the intense desert sunlight to enter, protecting occupants from the heat and glare while creating an aesthetically pleasing façade.","이것들은 강렬한 사막 햇빛의 20퍼센트만 들어오도록 허용하는 반사 코팅으로 처리되어, 미적으로 즐거움을 주는 정면을 만들면서 열과 눈부심으로부터 거주자를 보호한다."]],"w":"13번에서 반사 코팅(a reflective coating)이 강렬한 사막 햇빛(the intense desert sunlight)의 20퍼센트만 들어오게 해요. fragile, structural, prevalent, urban은 코팅이나 햇빛을 꾸미는 말로 본문에 쓰이지 않았어요.","c":null},"h":"9cd7ad13bc"}]},{"u":10,"id":"ms4-10-3","no":3,"ko":"위궤양의 범인은 대체 누구야?","items":[{"n":1,"t":"tf","q":"Marshall and Robin Warren studied stomach ulcers together in 1981.","ko":"Marshall과 Robin Warren은 1981년에 함께 위궤양을 연구했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In 1981, Marshall and his colleague, Robin Warren, conducted research on stomach ulcers, a condition that affected 10 percent of the world’s population at that time.","1981년에, Marshall과 그의 동료 Robin Warren은 그 당시 전 세계 인구의 10퍼센트에게 영향을 미쳤던 질환인 위궤양에 관한 연구를 수행했다."]],"w":"3번 문장에서 1981년에 Marshall과 그의 동료 Robin Warren이 위궤양에 관한 연구를 수행했다고 해요.","c":"T"},"h":"c0c0254117"},{"n":2,"t":"tf","q":"Before Marshall’s research, most people believed that bacteria were the main cause of ulcers.","ko":"Marshall의 연구 이전에, 대부분의 사람은 박테리아가 궤양의 주된 원인이라고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"However, he had to disprove a long-held assumption about ulcers; namely, that this condition was the result of excess stomach acid caused by stress, spicy food, or smoking.","그러나, 그는 궤양에 대한 오랜 가정을 반박해야만 했는데, 즉 이 질환이 스트레스, 매운 음식, 또는 흡연으로 인해 유발된 과도한 위산의 결과라는 것이었다."]],"w":"5번 문장에서 오랜 가정은 궤양이 스트레스, 매운 음식, 흡연으로 인한 과도한 위산의 결과라는 것이었어요. 박테리아가 원인이라는 것은 Marshall의 가설(4번)이에요.","c":"F"},"h":"3d69ffed9c"},{"n":3,"t":"tf","q":"H. pylori could easily survive in most animal stomachs.","ko":"H. pylori는 대부분의 동물 위장에서 쉽게 살아남을 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"To prove his theory, Marshall attempted to infect animals with H. pylori, but the bacteria could not survive in most animal stomachs.","자신의 이론을 증명하기 위해, Marshall은 동물들을 H. pylori에 감염시키려고 시도했으나, 그 박테리아는 대부분의 동물 위장 내에서 생존할 수 없었다."]],"w":"6번 문장에서 그 박테리아는 대부분의 동물 위장에서 생존할 수 없었다(could not survive)고 해요.","c":"F"},"h":"85cedae27d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... developed the symptoms of gastritis, a precursor to ulcers.)","ko":"…궤양의 전조인 위염 증상이 나타났다.","opts":["전조","결과","치료제","원인"],"word":"precursor","r":{"a":"1) 전조","ev":"8번 문장","s":[[8,"He drank a broth containing H. pylori and, within days, developed the symptoms of gastritis, a precursor to ulcers.","그는 H. pylori가 들어 있는 배양액을 마셨고, 며칠 이내에 궤양의 전조인 위염 증상이 나타났다."]],"w":"위염은 심해지면 본격적인 위궤양으로 이어지는(9번) 앞 단계예요. precursor = 전조, 앞서 나타나는 것이에요.","c":1},"h":"79d2d8a843"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... was groundbreaking at the time, ...)","ko":"…그 당시에 획기적인 일이었다.","opts":["평범한","위험한","오래된","획기적인"],"word":"groundbreaking","r":{"a":"4) 획기적인","ev":"10번 문장","s":[[10,"Being able to treat ulcers with medication was groundbreaking at the time, as severe cases sometimes required surgery to remove parts of the stomach.","심각한 경우 때때로 위장의 일부를 제거하는 수술을 필요로 했기 때문에, 약물로 궤양을 치료할 수 있다는 것은 그 당시에 획기적인 일이었다."]],"w":"심각한 경우 수술이 필요하던 때에 약물로 궤양을 치료할 수 있게 된 것은 새 길을 연 일이에요. groundbreaking = 획기적인.","c":4},"h":"d993a88981"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAlthough he was frustrated by this failure, he was still confident in his hypothesis and decided to test it on himself.","ko":"밑줄 친 it이 가리키는 것은?","sko":"비록 그는 이 실패에 좌절했지만, 여전히 자신의 가설을 확신했고 그것을 자신에게 직접 실험하기로 결심했다.","opts":["동물의 위장","그의 가설","그 박테리아의 위치","그 실패"],"r":{"a":"2) 그의 가설","ev":"7번 문장","s":[[7,"Although he was frustrated by this failure, he was still confident in his hypothesis and decided to test it on himself.","비록 그는 이 실패에 좌절했지만, 여전히 자신의 가설을 확신했고 그것을 자신에게 직접 실험하기로 결심했다."]],"w":"자신에게 ‘실험해 보는’ 것은 그가 확신하던 가설(his hypothesis)이에요. 실패(this failure)는 좌절한 이유일 뿐 실험할 대상이 아니에요.","c":2},"h":"37ab8e034c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They discovered high concentrations of a bacterium called H. pylori near ulcer sites, leading Marshall to hypothesize that these bacteria caused ulcers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 궤양 부위 근처에서 H. pylori라고 불리는 박테리아의 고농도로 존재함을 발견했고, 이는 Marshall로 하여금 이 박테리아가 궤양을 유발한다는 가설을 세우게 했다.","opts":["그들은 궤양 부위에서 멀리 떨어진 곳에서 H. pylori를 발견했고, Marshall은 이 박테리아가 궤양과 무관하다고 생각했다.","그들은 궤양 부위 근처에서 H. pylori가 많은 것을 발견했고, 그 덕분에 Marshall은 이 박테리아가 궤양을 일으킨다는 가설을 세웠다.","그들은 H. pylori를 궤양 환자에게서 없애 보았고, Marshall은 그 박테리아가 궤양을 치료한다고 증명했다.","그들은 궤양 부위 근처에서 H. pylori가 거의 없는 것을 발견했고, Marshall은 위산이 원인이라고 생각했다."],"r":{"a":"2) 그들은 궤양 부위 근처에서 H. pylori가 많은 것을 발견했고, 그 덕분에 Marshall은 이 박테리아가 궤양을 일으킨다는 가설을 세웠다.","ev":"4번 문장","s":[[4,"They discovered high concentrations of a bacterium called H. pylori near ulcer sites, leading Marshall to hypothesize that these bacteria caused ulcers.","그들은 궤양 부위 근처에서 H. pylori라고 불리는 박테리아의 고농도로 존재함을 발견했고, 이는 Marshall로 하여금 이 박테리아가 궤양을 유발한다는 가설을 세우게 했다."]],"w":"high concentrations … near ulcer sites는 궤양 부위 근처에 많이 있다는 뜻이에요. leading Marshall to hypothesize는 ‘그래서 Marshall이 가설을 세우게 되었다’는 뜻이에요.","c":2},"h":"b51d75bc9d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Marshall은 동물 실험을 먼저 시도하기 전에 자신에게 실험했다.","Marshall은 항생제를 처방해 준 다른 의사 덕분에 위염이 나았다.","Marshall은 배양액을 마시고 며칠 안에 위염 증상이 나타났다.","Marshall은 동물 실험에서 위궤양의 원인이 위산임을 확인했다."],"opts":["Marshall tested himself before trying the experiment on animals.","Marshall was cured of gastritis by a doctor who gave him antibiotics.","Marshall developed gastritis symptoms within days of drinking a broth.","Marshall found in animal tests that stomach acid caused ulcers."],"r":{"a":"3) Marshall developed gastritis symptoms within days of drinking a broth.","ev":"8번 문장","s":[[8,"He drank a broth containing H. pylori and, within days, developed the symptoms of gastritis, a precursor to ulcers.","그는 H. pylori가 들어 있는 배양액을 마셨고, 며칠 이내에 궤양의 전조인 위염 증상이 나타났다."]],"w":"8번에서 H. pylori가 든 배양액을 마시고 며칠 안에 위염 증상이 나타났어요. 동물 실험(6번)이 자신에게 하는 실험(7번)보다 먼저였고, 항생제는 Marshall이 직접 썼어요(9번).","c":3},"h":"6ef468b317"},{"n":9,"t":"sum","q":"Marshall believed that stomach ulcers were caused by (A), and he proved it by (B) himself.","ko":"Marshall은 위궤양이 (A) 때문에 생긴다고 믿었고, 자신을 (B)하여 그것을 증명했다.","oko":["(A) 위산 / (B) 감염시켜","(A) 스트레스 / (B) 치료해","(A) 흡연 / (B) 감염시켜","(A) 박테리아 / (B) 피해","(A) 박테리아 / (B) 감염시켜"],"opts":["(A) acid / (B) infecting","(A) stress / (B) treating","(A) smoking / (B) infecting","(A) bacteria / (B) avoiding","(A) bacteria / (B) infecting"],"r":{"a":"5) (A) bacteria / (B) infecting","ev":"4번, 8번 문장","s":[[4,"They discovered high concentrations of a bacterium called H. pylori near ulcer sites, leading Marshall to hypothesize that these bacteria caused ulcers.","그들은 궤양 부위 근처에서 H. pylori라고 불리는 박테리아의 고농도로 존재함을 발견했고, 이는 Marshall로 하여금 이 박테리아가 궤양을 유발한다는 가설을 세우게 했다."],[8,"He drank a broth containing H. pylori and, within days, developed the symptoms of gastritis, a precursor to ulcers.","그는 H. pylori가 들어 있는 배양액을 마셨고, 며칠 이내에 궤양의 전조인 위염 증상이 나타났다."]],"w":"4번에서 Marshall은 박테리아가 궤양을 일으킨다는 가설을 세웠고, 8번에서 H. pylori가 든 배양액을 마셔 자신을 감염시켰어요. 스트레스, 흡연, 위산은 5번에서 그가 반박해야 했던 오랜 가정이에요.","c":5},"h":"228b542b19"},{"n":10,"t":"fill","q":"Marshall cured his ulcer with [A], which was [B] because severe cases had sometimes required surgery.","ko":"Marshall은 [A]로 자신의 궤양을 치료했는데, 심각한 경우 때때로 수술이 필요했기 때문에 그것은 [B]인 일이었다.","bank":["antibiotics","groundbreaking","surgery","broth","precursor","assumption"],"bko":{"antibiotics":"항생제","groundbreaking":"획기적인","surgery":"수술","broth":"배양액","precursor":"전조","assumption":"가정"},"r":{"a":"[A] antibiotics, [B] groundbreaking","ev":"9~10번 문장","s":[[9,"His condition soon progressed to a full-blown stomach ulcer, which he successfully cured with antibiotics.","그의 상태는 곧 본격적인 위궤양으로 진행되었고, 그는 항생제로 그것을 성공적으로 치료했다."],[10,"Being able to treat ulcers with medication was groundbreaking at the time, as severe cases sometimes required surgery to remove parts of the stomach.","심각한 경우 때때로 위장의 일부를 제거하는 수술을 필요로 했기 때문에, 약물로 궤양을 치료할 수 있다는 것은 그 당시에 획기적인 일이었다."]],"w":"9번에서 Marshall은 항생제(antibiotics)로 위궤양을 치료했고, 10번에서 그것이 획기적(groundbreaking)이었다고 해요. surgery는 그가 쓴 방법이 아니라 예전에 필요했던 방법이에요.","c":null},"h":"9d85768bd1"}]},{"u":10,"id":"ms4-10-4","no":4,"ko":"Disappearing to Start Over","items":[{"n":1,"t":"tf","q":"Jouhatsu began as a way to leave an unhappy marriage without facing the stigma of divorce.","ko":"조하츠는 이혼의 낙인을 마주하지 않고 불행한 결혼 생활을 떠나는 방법으로 시작되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Jouhatsu originated in the 1960s, as a way for people to leave unhappy marriages without having to deal with the social stigma often tied to divorce at the time.","‘조하츠’는 1960년대에 사람들이 당시 이혼과 종종 결부된 사회적 낙인을 감당할 필요 없이 불행한 결혼 생활을 떠나는 방법으로 시작되었다."]],"w":"4번 문장에서 1960년대에 사람들이 당시 이혼과 결부된 사회적 낙인을 감당하지 않고 불행한 결혼 생활을 떠나는 방법으로 시작됐다고 해요.","c":"T"},"h":"c4d2400b35"},{"n":2,"t":"tf","q":"Jouhatsu became less common in Japan during the economic downturn of the 1990s.","ko":"1990년대 경기 침체 동안 일본에서 조하츠는 덜 흔해졌다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"During Japan’s severe economic downturn in the 1990s, this practice became more prevalent as people chose to evaporate to avoid financial ruin.","1990년대 일본의 심각한 경기 침체 동안, 사람들이 재정적 파탄을 피하기 위해 증발하는 것을 선택함에 따라 이 관행은 더 널리 퍼졌다."]],"w":"5번 문장에서 1990년대 경기 침체 동안 재정적 파탄을 피하려는 사람들이 증발을 선택하면서 이 관행은 더 널리 퍼졌다(became more prevalent)고 해요. 덜 흔해졌다는 말은 반대예요.","c":"F"},"h":"54ae0db60d"},{"n":3,"t":"tf","q":"Some people who evaporate are trapped in a cycle of instability.","ko":"증발한 일부 사람들은 불안정의 순환에 갇힌다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Some individuals find themselves trapped in a cycle of instabil
