ello, everyone! I'm Dr. Jang. I'm so happy to have about 400 teenagers here for my live stream.","Today, we will talk about sleep. Ready? Let's go!","Sleep is so important that you can't live without it. When you sleep, your body repairs your cells and muscles. So, if you don't get enough sleep, you can get sick.","Sleep is important for your physical health. And it is also important for your memory. While you sleep, your brain clears memories that are not needed. This makes space for new memories. Imagine keeping every detail of your experiences in your memory. It would be like a room with unnecessary items everywhere.","sweetdream: During sleep, the brain works like a cleaner.","Sweetdream made a good point. Yes, unnecessary memories are cleaned up by your brain while you sleep.","Now, let's look at some questions. Here's an interesting one.","sleepy: I have so much homework on weekdays that I can't sleep enough. So, I sleep more on weekends. Is this okay?","Trying to sleep a lot during weekends may help. But you should try to keep a regular sleep schedule. Changing sleep patterns too often may lead to health problems."];var PASS_KO=["수면은 십대들에게 중요하다","안녕하세요, 여러분! 저는 장 박사입니다. 여기 제 라이브 방송에 약 400명의 십대들이 함께해 주셔서 정말 기쁩니다.","오늘 우리는 수면에 대해 이야기할 거예요. 준비됐나요? 시작합시다!","수면은 매우 중요해서 잠을 자지 않고는 살 수가 없습니다. 잠을 잘 때, 여러분의 몸은 여러분의 세포와 근육을 회복시킵니다. 그래서 만약 여러분이 충분한 수면을 취하지 않는다면, 아플 수 있습니다.","수면은 신체 건강에 중요합니다. 또한 수면은 여러분의 기억력에도 중요합니다. 잠을 자는 동안, 여러분의 뇌는 필요 없는 기억들을 정리합니다. 이것이 새로운 기억들을 위한 공간을 만듭니다. 여러분의 경험의 모든 세부사항을 기억한다고 상상해 보세요. 그것은 마치 불필요한 물건들이 가득한 방과 같을 겁니다.","sweetdream: 잠자는 동안, 뇌는 청소부처럼 작동해요.","Sweetdream이 좋은 말을 했습니다. 맞습니다, 잠을 자는 동안 뇌는 불필요한 기억들을 정리합니다.","이제 몇 가지 질문을 살펴봅시다. 여기 흥미로운 질문이 하나 있네요.","sleepy: 저는 평일에는 숙제가 너무 많아서 충분히 잘 수가 없어요. 그래서 주말에는 더 많이 잡니다. 이래도 괜찮은가요?","주말 동안 많이 자려고 노력하는 것은 도움이 될 수 있습니다. 하지만 규칙적인 수면 습관을 유지하려고 노력해야 합니다. 수면 패턴을 너무 자주 바꾸는 것은 건강 문제로 이어질 수 있습니다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["the boy's eating habit","the causes of a stomachache","the bad nd don't forget to drink warm water.(좀 쉬어야 해. 그리고 따뜻한 물 마시는 것을 잊지 마.)","함정: ⑤ 찬물이 아니라 따뜻한 물(warm water)이다"],"why":"목이 아픈 A에게 B는 쉬고 따뜻한 물을 마시라고 조언했다."}],"dlg":[["A","I have a sore throat.","나는 목이 아파."],["B","That's too bad. You should get some rest. And don't forget to drink warm water.","안됐구나. 좀 쉬어야 해. 그리고 따뜻한 물 마시는 것을 잊지 마."],["A","Okay. Thank you.","알겠어. 고마워."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["How to Remove Unnecessary Things","The Role of the Brain as a Cleaner","Why Is Sleep Important for Us?","How Does the Brain Work?","Tips to Get Enough Sleep"],"a":2,"ans":"Why Is Sleep Important for Us?","evs":[["Sleep is so important that you can't live without it.","수면은 매우 중요해서 잠을 자지 않고는 살 수가 없습니다."],["Sleep is important for your physical health.","수면은 신체 건강에 중요합니다."],["And it is also important for your memory.","또한 수면은 여러분의 기억력에도 중요합니다."]],"ev":["Sleep is so important that you can't live without it.","수면은 매우 중요해서 잠을 자지 않고는 살 수가 없습니다."],"ow":["오답 ✕ — 'It would be like a room with unnecessary items everywhere.'(그것은 마치 불필요한 물건들이 가득한 방과 같을 겁니다.)는 비유일 뿐이다. 글은 필요 없는 것을 없애는 방법이 아니라 수면의 중요성을 말해서 틀림.","오답 ✕ — 'During sleep, the brain works like a cleaner.'(잠자는 동안, 뇌는 청소부처럼 작동해요.)는 기억 부분에만 해당한다. 몸 건강 내용까지 포함한 제목으로는 너무 좁아 틀림.","정답 ○ — 'Sleep is important for your physical health.'(수면은 신체 건강에 중요합니다.)와 'it is also important for your memory'(기억력에도 중요합니다)로 수면이 왜 중요한지를 설명하므로 제목으로 알맞다.","오답 ✕ — 'your brain clears memories that are not needed'(뇌는 필요 없는 기억들을 정리합니다)처럼 뇌 이야기가 나오지만 뇌가 어떻게 작동하는지를 설명하는 글은 아니라서 틀림.","오답 ✕ — 충분히 자기 위한 팁은 이 부분에 나오지 않는다. 글은 'Sleep is so important that you can't live without it.'(수면은 매우 중요해서 잠을 자지 않고는 살 수가 없습니다.)처럼 중요성을 다룬다."],"memo":["정답 ③: Why Is Sleep Important for Us?(수면은 왜 우리에게 중요한가?)","근거: Sleep is important for your physical health. And it is also important for your memory.(수면은 신체 건강에, 또 기억력에도 중요합니다.)","함정: ② 뇌는 청소부라는 말은 일부분이라 너무 좁다"],"why":"수면이 몸 건강과 기억력에 왜 중요한지를 설명하는 글이다."},{"n":7,"q":"윗글의 내용과 일치하지 않는 것은?","o":["We can be sick without enough sleep.","We need to sleep to survive.","Our cells and muscles are repaired during sleep.","During sleep, the brain makes space for unnecessary memories.","Sweetdream says the brain plays a role as a cleaner."],"a":3,"ans":"During sleep, the brain makes space for unnecessary memories.","evs":[["While you sleep, your brain clears memories that are not needed.","잠을 자는 동안, 여러분의 뇌는 필요 없는 기억들을 정리합니다."],["This makes space for new memories.","이것이 새로운 기억들을 위한 공간을 만듭니다."]],"ev":["While you sleep, your brain clears memories that are not needed.","잠을 자는 동안, 여러분의 뇌는 필요 없는 기억들을 정리합니다."],"ow":["오답 ✕ — 'So, if you don't get enough sleep, you can get sick.'(충분한 수면을 취하지 않으면 아플 수 있습니다.)라고 했으므로 일치한다.","오답 ✕ — 'Sleep is so important that you can't live without it.'(수면은 매우 중요해서 잠을 자지 않고는 살 수가 없습니다.)라고 했으므로 살기 위해 자야 한다는 말은 일치한다.","오답 ✕ — 'When you sleep, your body repairs your cells and muscles.'(잠을 잘 때, 여러분의 몸은 여러분의 세포와 근육을 회복시킵니다.)라고 했으므로 일치한다.","정답 ○ — 'your brain clears memories that are not needed. This makes space for new memories.'(필요 없는 기억들을 정리하고 새로운 기억들을 위한 공간을 만든다)고 했다. 필요 없는 기억을 위한 공간을 만든다는 말은 일치하지 않는다.","오답 ✕ — 'sweetdream: During sleep, the brain works like a cleaner.'(잠자는 동안, 뇌는 청소부처럼 작동해요.)라고 했으므로 일치한다."],"memo":["정답 ④(일치하지 않는 것): 뇌가 불필요한 기억을 위한 공간을 만든다 ✕","근거: your brain clears memories that are not needed. This makes space for new memories.(필요 없는 기억들을 정리해서 새로운 기억들을 위한 공간을 만든다.)","함정: 공간은 '새로운' 기억을 위한 것이다"],"why":"뇌는 필요 없는 기억을 정리해 새로운 기억을 위한 공간을 만든다."},{"n":8,"q":"윗글을 요약한 다음 글의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["repairs - unnecessary","damages - unnecessary","repairs - important","protects - new","weakens - needed"],"a":0,"ans":"repairs - unnecessary","evs":[["When you sleep, your body repairs your cells and muscles.","잠을 잘 때, 여러분의 몸은 여러분의 세포와 근육을 회복시킵니다."],["While you sleep, your brain clears memories that are not needed.","잠을 자는 동안, 여러분의 뇌는 필요 없는 기억들을 정리합니다."]],"ev":["When you sleep, your body repairs your cells and muscles.","잠을 잘 때, 여러분의 몸은 여러분의 세포와 근육을 회복시킵니다. re.","그것은 마치 불필요한 물건들이 가득한 방과 같을 겁니다."],["sweetdream: During sleep, the brain works like a cleaner.","sweetdream: 잠자는 동안, 뇌는 청소부처럼 작동해요."],["Sweetdream made a good point.","Sweetdream이 좋은 말을 했습니다."],["Yes, unnecessary memories are cleaned up by your brain while you sleep.","맞습니다, 잠을 자는 동안 뇌는 불필요한 기억들을 정리합니다."]]},{"qs":[{"n":9,"q":"윗글의 주제로 알맞은 것은?","o":["various causes of lack of sleep","how to make good sleep patterns","the importance of regular sleep routine","the danger of changing a sleep pattern","benefits of sleeping a lot during weekends"],"a":2,"ans":"the importance of regular sleep routine","evs":[["But you should try to keep a regular sleep schedule.","하지만 규칙적인 수면 습관을 유지하려고 노력해야 합니다."],["Changing sleep patterns too often may lead to health problems.","수면 패턴을 너무 자주 바꾸는 것은 건강 문제로 이어질 수 있습니다."]],"ev":["But you should try to keep a regular sleep schedule.","하지만 규칙적인 수면 습관을 유지하려고 노력해야 합니다."],"ow":["오답 ✕ — sleepy는 'I have so much homework on weekdays that I can't sleep enough.'(평일에는 숙제가 너무 많아서 충분히 잘 수가 없어요.)라고 했지만 수면 부족의 여러 원인을 다루는 글은 아니라서 틀림.","오답 ✕ — 'you should try to keep a regular sleep schedule'(규칙적인 수면 습관을 유지하려고 노력해야 합니다)는 좋은 수면 패턴을 만드는 방법을 알려 주는 것이 아니라 규칙적인 것이 중요하다는 말이라서 틀림.","정답 ○ — 'But you should try to keep a regular sleep schedule.'(하지만 규칙적인 수면 습관을 유지하려고 노력해야 합니다.)와 'Changing sleep patterns too often may lead to health problems.'(수면 패턴을 너무 자주 바꾸면 건강 문제로 이어질 수 있습니다.)로 규칙적인 수면의 중요성이 주제이다.","오답 ✕ — 수면 패턴을 바꾸는 것이 'may lead to health problems'(건강 문제로 이어질 수 있다)는 이유를 보여 주는 한 부분일 뿐이다. 중심은 규칙적인 수면을 유지해야 한다는 것이라서 틀림.","오답 ✕ — 'Trying to sleep a lot during weekends may help.'(주말 동안 많이 자려고 노력하는 것은 도움이 될 수 있습니다.)라고는 했지만 곧바로 'But'으로 규칙적인 수면을 강조하므로 틀림."],"memo":["정답 ③: 규칙적인 수면 습관의 중요성","근거: But you should try to keep a regular sleep schedule.(하지만 규칙적인 수면 습관을 유지하려고 노력해야 합니다.)","함정: ⑤ 주말에 많이 자는 것은 'But' 앞에서 인정한 정도일 뿐이다"],"why":"주말에 몰아 자기보다 규칙적인 수면 습관이 중요하다는 글이다."},{"n":10,"q":"What does Dr. Jang say about sleeping a lot on weekends?","o":["It always makes you sick.",  +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
