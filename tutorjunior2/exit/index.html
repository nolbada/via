the underlined word? (He made soybean soup, but they complained it was tasteless.)","ko":"그는 콩 수프를 만들었지만, 그들은 그것이 ( ) 불평했다.","opts":["너무 뜨겁다고","너무 짜다고","맛이 없다고","양이 적다고"],"word":"tasteless","r":{"a":"3) 맛이 없다고","ev":"10~11번 문장","s":[[10,"He made soybean soup, but they complained it was tasteless.","그는 콩 수프를 만들었지만, 그들은 그것이 맛이 없다고 불평했다."],[11,"So he added salt and cooked the soup for a few more minutes.","그래서 그는 소금을 넣고 수프를 몇 분 더 조리했다."]],"w":"10번에서 부모님이 불평했고, 11번에서 남자가 소금(salt)을 넣었어요. 소금이 필요했으니 수프는 맛이 없었다는 뜻이에요.","c":3},"h":"7dde5b2118"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey had trouble chewing their food and could only eat soft food.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 음식을 씹는 데 어려움이 있었고 부드러운 음식만 먹을 수 있었다.","opts":["브라우니를 먹은 손님들","그 중국인 남성","그 중국인 남성의 연로한 부모님","미국 여성의 가족"],"r":{"a":"3) 그 중국인 남성의 연로한 부모님","ev":"8~9번 문장","s":[[8,"A Chinese man was cooking for his elderly parents.","한 중국인 남성이 자신의 연로한 부모님을 위해 요리를 하고 있었다."],[9,"They had trouble chewing their food and could only eat soft food.","그들은 음식을 씹는 데 어려움이 있었고 부드러운 음식만 먹을 수 있었다."]],"w":"8번에서 중국인 남성이 his elderly parents(연로한 부모님)를 위해 요리했다고 했어요. 9번의 They는 그 부모님이에요.","c":3},"h":"88b5eb0cc2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"She was trying to bake a chocolate cake, but she forgot to add baking powder.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀는 초콜릿 케이크를 구우려고 하고 있었는데, 베이킹파우더를 넣는 것을 잊어버렸다.","opts":["그녀는 베이킹파우더를 사려고 했지만 초콜릿 케이크를 잊어버렸다.","그녀는 초콜릿 케이크를 구웠지만 베이킹파우더를 일부러 넣지 않았다.","그녀는 초콜릿 케이크를 구우려고 했고 베이킹파우더도 넣었다.","그녀는 초콜릿 케이크를 구우려고 했지만 베이킹파우더를 넣는 것을 잊었다."],"r":{"a":"4) 그녀는 초콜릿 케이크를 구우려고 했지만 베이킹파우더를 넣는 것을 잊었다.","ev":"3번 문장","s":[[3,"She was trying to bake a chocolate cake, but she forgot to add baking powder.","그녀는 초콜릿 케이크를 구우려고 하고 있었는데, 베이킹파우더를 넣는 것을 잊어버렸다."]],"w":"was trying to bake는 '구우려고 하고 있었다', forgot to add는 '넣는 것을 잊었다'예요. 그래서 5번처럼 케이크가 납작해졌어요.","c":4},"h":"df72b6ca86"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["브라우니는 중국에서 일부러 만들어졌다.","두부는 한 남자가 연로한 부모님을 위해 수프를 만들다가 생겼다.","손님들은 미국 여성의 케이크를 먹지 않았다.","부모님은 콩 수프를 처음부터 맛있다고 했다."],"opts":["Brownies were made on purpose in China.","Tofu came from a man making soup for his elderly parents.","The guests did not eat the American woman's cake.","The parents said the soybean soup was delicious from the start."],"r":{"a":"2) Tofu came from a man making soup for his elderly parents.","ev":"2번, 6번, 8번, 10번, 12번 문장","s":[[2,"According to one story, brownies were invented accidentally by a woman in the United States.","한 이야기에 따르면, 브라우니는 미국의 한 여성에 의해 우연히 발명되었다."],[6,"She served it to her guests anyway, and they loved it!","그녀는 어쨌든 그것을 자신의 손님들에게 대접했고, 그들은 그것을 아주 좋아했다!"],[8,"A Chinese man was cooking for his elderly parents.","한 중국인 남성이 자신의 연로한 부모님을 위해 요리를 하고 있었다."],[10,"He made soybean soup, but they complained it was tasteless.","그는 콩 수프를 만들었지만, 그들은 그것이 맛이 없다고 불평했다."],[12,"When it cooled down, it turned into a delicious soybean jelly.","그것이 식자, 그것은 맛있는 콩 젤리로 변했다."]],"w":"8번과 10~12번에서 남자가 부모님을 위해 만든 콩 수프가 식어 두부가 되었어요. 브라우니는 미국 여성이 우연히 발명했고(2번), 손님들은 케이크를 아주 좋아했고(6번), 부모님은 처음에 맛이 없다고 불평했어요(10번).","c":2},"h":"b4be632480"},{"n":9,"t":"sum","q":"Some people (A) tofu was also invented by (B).","ko":"어떤 사람들은 두부 역시 (B)(으)로 발명되었다고 (A).","oko":["(A) 말한다 / (B) 계획","(A) 부인한다 / (B) 실수","(A) 말한다 / (B) 실수","(A) 잊는다 / (B) 실수","(A) 말한다 / (B) 손"],"opts":["(A) say / (B) plan","(A) deny / (B) mistake","(A) say / (B) mistake","(A) forget / (B) mistake","(A) say / (B) hand"],"r":{"a":"3) (A) say / (B) mistake (A 말한다 / B 실수)","ev":"7번 문장","s":[[7,"Some people say tofu was also invented by mistake.","어떤 사람들은 두부 역시 실수로 발명되었다고 말한다."]],"w":"7번에서 어떤 사람들은 두부 역시 실수(mistake)로 발명되었다고 말한다(say)고 했어요.","c":3},"h":"44150c64a1"},{"n":10,"t":"fill","q":"So he added [A] and cooked the soup for a few more minutes. When it cooled down, it [B] into a delicious soybean jelly.","ko":"그래서 그는 [A]을(를) 넣고 수프를 몇 분 더 조리했다. 그것이 식자, 그것은 맛있는 콩 젤리로 [B].","bank":["salt","turned","parents","elderly","invented","minutes"],"bko":{"salt":"소금","turned":"변했다(turn의 과거)","parents":"부모님","elderly":"연로한","invented":"발명했다(invent의 과거)","minutes":"분"},"r":{"a":"[A] salt (소금), [B] turned (변했다)","ev":"11~12번 문장","s":[[11,"So he added salt and cooked the soup for a few more minutes.","그래서 그는 소금을 넣고 수프를 몇 분 더 조리했다."],[12,"When it cooled down, it turned into a delicious soybean jelly.","그것이 식자, 그것은 맛있는 콩 젤리로 변했다."]],"w":"11~12번 문장에서 가져왔어요. A에는 added의 목적어가 되는 재료, B에는 into와 함께 쓰이는 과거형 동사가 들어가요.","c":null},"h":"eee2fae9ef"}]},{"u":3,"id":"rj2-03-4","no":4,"ko":"식당 인테리어에 이런 비밀이!","items":[{"n":1,"t":"tf","q":"Almost all fast-food restaurants use red and yellow.","ko":"거의 모든 패스트푸드 식당들은 빨간색과 노란색을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Almost all fast-food restaurants use red and yellow.","거의 모든 패스트푸드 식당들은 빨간색과 노란색을 사용한다."]],"w":"4번 문장에 Almost all fast-food restaurants use red and yellow가 그대로 있어요.","c":"T"},"h":"c337cecd23"},{"n":2,"t":"tf","q":"People think that cool colors make people eat more.","ko":"사람들은 한색이 사람들을 더 먹게 만든다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"People think that cool colors, such as blue and green, reduce their appetite by making them calm.","사람들은 파란색이나 녹색 같은 한색들이 그들을 차분하게 만들어서 그들의 식욕을 줄인다고 생각한다."]],"w":"8번에서 사람들은 한색이 사람들을 차분하게 만들어서 식욕을 줄인다(reduce their appetite)고 생각해요. 더 먹게 한다는 말은 반대예요.","c":"F"},"h":"d761ddc02e"},{"n":3,"t":"tf","q":"Green is used in restaurants that sell fresh, healthy food.","ko":"녹색은 신선하고 건강에 좋은 음식을 파는 식당들에서 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"So green is used in restaurants that sell fresh, healthy food.","그래서 녹색은 신선하고 건강에 좋은 음식을 파는 식당들에서 사용된다."]],"w":"12번 문장에 So green is used in restaurants that sell fresh, healthy food가 그대로 있어요.","c":"T"},"h":"48bb5f8fa6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (People think that cool colors, such as blue and green, reduce their appetite by making them calm.)","ko":"사람들은 파란색이나 녹색 같은 한색들이 그들을 차분하게 만들어서 그들의 식욕을 ( ) 생각한다.","opts":["늘린다","줄인다","바꾼다","잊게 한다"],"word":"reduce","r":{"a":"2) 줄인다","ev":"6번, 8번 문장","s":[[6,"Studies show that warm colors make people excited and cause them to eat more!","연구들은 난색들이 사람들을 들뜨게 만들고 그들이 더 많이 먹게 한다는 것을 보여준다!"],[8,"People think that cool colors, such as blue and green, reduce their appetite by making them calm.","사람들은 파란색이나 녹색 같은 한색들이 그들을 차분하게 만들어서 그들의 식욕을 줄인다고 생각한다."]],"w":"6번에서 난색은 더 먹게 한다고 했어요. 8번의 한색은 차분하게 만드는 색이라 반대로 식욕을 '줄인다'는 뜻이에요.","c":2},"h":"0fc24bf29d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, green is actually linked to food.)","ko":"하지만, 녹색은 사실 음식과 ( ).","opts":["연결된다","싸운다","떨어져 있다","섞인다"],"word":"linked","r":{"a":"1) 연결된다","ev":"9~11번 문장","s":[[9,"However, green is actually linked to food.","하지만, 녹색은 사실 음식과 연결된다."],[10,"People think of green as the color of nature and freshness.","사람들은 녹색을 자연과 신선함의 색이라고 생각한다."],[11,"This makes it the color of healthy, clean food.","이것은 그것(녹색)을 건강에 좋고 깨끗한 음식의 색으로 만든다."]],"w":"9번 뒤의 10~11번에서 녹색을 자연과 신선함의 색, 건강에 좋은 음식의 색으로 생각한다고 해요. 그래서 녹색은 음식과 '연결되어' 있어요.","c":1},"h":"15eda2f719"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis makes it the color of healthy, clean food.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이것은 그것을 건강에 좋고 깨끗한 음식의 색으로 만든다.","opts":["빨간색","식욕","녹색","패스트푸드 식당"],"r":{"a":"3) 녹색","ev":"9~11번 문장","s":[[9,"However, green is actually linked to food.","하지만, 녹색은 사실 음식과 연결된다."],[10,"People think of green as the color of nature and freshness.","사람들은 녹색을 자연과 신선함의 색이라고 생각한다."],[11,"This makes it the color of healthy, clean food.","이것은 그것(녹색)을 건강에 좋고 깨끗한 음식의 색으로 만든다."]],"w":"9번과 10번에서 계속 green(녹색)을 이야기해요. 11번의 it은 green이고, 녹색이 건강에 좋은 음식의 색이 된다는 뜻이에요.","c":3},"h":"38c4d81114"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So fast-food restaurants use these colors to make people eat a lot.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 패스트푸드 식당들은 사람들이 많이 먹게 만들기 위해 이러한 색들을 사용한다.","opts":["패스트푸드 식당들은 사람들이 음식을 적게 먹게 하려고 이러한 색들을 사용한다.","사람들은 많은 색을 사용하는 패스트푸드 식당을 좋아한다.","패스트푸드 식당들은 이러한 색들을 사용하지 않는다.","패스트푸드 식당들은 사람들이 많이 먹게 하려고 이러한 색들을 사용한다."],"r":{"a":"4) 패스트푸드 식당들은 사람들이 많이 먹게 하려고 이러한 색들을 사용한다.","ev":"7번 문장","s":[[7,"So fast-food restaurants use these colors to make people eat a lot.","그래서 패스트푸드 식당들은 사람들이 많이 먹게 만들기 위해 이러한 색들을 사용한다."]],"w":"to make people eat a lot는 '사람들이 많이 먹게 하려고'라는 목적이에요. 6번에서 난색이 더 먹게 한다고 했으니 식당은 그 색들을 일부러 써요.","c":4},"h":"1bfdad1ef3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["패스트푸드 식당들은 대부분 파란색과 녹색을 사용한다.","사람들은 녹색을 자연의 색이라고 생각한다.","빨간색과 노란색은 한색이다.","녹색은 도시와 기계의 색이다."],"opts":["Fast-food restaurants mostly use blue and green.","People think of green as the color of nature.","Red and yellow are cold colors.","Green is the color of cities and machines."],"r":{"a":"2) People think of green as the color of nature. (사람들은 녹색을 자연의 색이라고 생각한다.)","ev":"10번 문장","s":[[10,"People think of green as the color of nature and freshness.","사람들은 녹색을 자연과 신선함의 색이라고 생각한다."]],"w":"10번에 사람들은 녹색을 자연과 신선함의 색(the color of nature and freshness)이라고 생각한다고 나와요.","c":2},"h":"6b0656c191"},{"n":9,"t":"sum","q":"Studies show that (A) colors make people (B) and cause them to eat more!","ko":"연구들은 (A)색들이 사람들을 (B) 만들고 그들이 더 많이 먹게 한다는 것을 보여준다!","oko":["(A) 한색 / (B) 들뜨게","(A) 난색 / (B) 피곤하게","(A) 난색 / (B) 들뜨게","(A) 어두운 색 / (B) 들뜨게","(A) 난색 / (B) 화나게"],"opts":["(A) cool / (B) excited","(A) warm / (B) tired","(A) warm / (B) excited","(A) dark / (B) excited","(A) warm / (B) angry"],"r":{"a":"3) (A) warm / (B) excited (A 난색 / B 들뜨게)","ev":"6번 문장","s":[[6,"Studies show that warm colors make people excited and cause them to eat more!","연구들은 난색들이 사람들을 들뜨게 만들고 그들이 더 많이 먹게 한다는 것을 보여준다!"]],"w":"6번에서 난색(warm colors)이 사람들을 들뜨게(excited) 만들고 더 많이 먹게 한다고 했어요.","c":3},"h":"258496b39e"},{"n":10,"t":"fill","q":"Think about the colors [A] fast-food restaurants. There are two [B] colors.","ko":"패스트푸드 식당들 [A]의 색들에 대해 생각해 봐라. 두 가지 [B] 색들이 있다.","bank":["inside","common","because","often","while","although"],"bko":{"inside":"안에","common":"공통된, 흔한","because":"~ 때문에","often":"자주","while":"~하는 동안","although":"비록 ~이지만"},"r":{"a":"[A] inside (안에), [B] common (공통된, 흔한)","ev":"2~3번 문장","s":[[2,"Think about the colors inside fast-food restaurants.","패스트푸드 식당들 안의 색들에 대해 생각해 봐라."],[3,"There are two common colors.","두 가지 공통된 색들이 있다."]],"w":"2~3번 문장에서 가져왔어요. A에는 장소를 나타내는 말, B에는 colors를 꾸미는 말이 들어가요.","c":null},"h":"a040437cbf"}]},{"u":4,"id":"rj2-04-1","no":1,"ko":"4초면 충분해요","items":[{"n":1,"t":"tf","q":"A chinstrap penguin has more than 10,000 microsleeps each day.","ko":"턱끈펭귄은 매일 10,000번 넘게 마이크로 수면을 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Chinstraps have more than 10,000 microsleeps each day.","턱끈펭귄은 매일 10,000번 넘게 마이크로 수면을 한다."]],"w":"6번 문장에 Chinstraps have more than 10,000 microsleeps each day가 그대로 있어요.","c":"T"},"h":"635d49ca59"},{"n":2,"t":"tf","q":"A chinstrap penguin's microsleep lasts for about four minutes.","ko":"턱끈펭귄의 마이크로 수면은 약 4분 동안 지속된다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"They sleep for very short periods, about four seconds.","그들은 약 4초 정도의 매우 짧은 시간 동안 잠을 잔다."]],"w":"4번에서 마이크로 수면은 about four seconds, 즉 약 4초라고 해요. 4분이 아니에요.","c":"F"},"h":"b0288e5438"},{"n":3,"t":"tf","q":"Brown skuas want to eat the eggs or babies of chinstrap penguins.","ko":"갈색 도둑갈매기는 턱끈펭귄의 알이나 새끼를 먹고 싶어 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"This is because birds called brown skuas want to eat them.","이것은 갈색 도둑갈매기라고 불리는 새들이 그것들을 먹고 싶어 하기 때문이다."]],"w":"11번에서 birds called brown skuas want to eat them이라고 했고, them은 알이나 새끼예요(10번).","c":"T"},"h":"c3f5a8788d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These animals survive in Antarctica's difficult conditions with an unusual sleep pattern.)","ko":"이 동물들은 남극의 어려운 환경에서 특이한 수면 패턴으로 ( ).","opts":["살아남는다","도망친다","잠든다","사냥한다"],"word":"survive","r":{"a":"1) 살아남는다","ev":"3번 문장","s":[[3,"These animals survive in Antarctica’s difficult conditions with an unusual sleep pattern.","이 동물들은 남극의 어려운 환경에서 특이한 수면 패턴으로 생존한다."]],"w":"3번은 어려운 환경에서 특이한 수면 패턴으로 버틴다는 문장이에요. 그래서 survive는 '살아남다'예요.","c":1},"h":"a2773b261b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The other parent must protect the eggs or babies at all times.)","ko":"다른 부모는 항상 알이나 새끼를 ( ).","opts":["먹어야 한다","보호해야 한다","버려야 한다","찾아야 한다"],"word":"protect","r":{"a":"2) 보호해야 한다","ev":"10~11번 문장","s":[[10,"The other parent must protect the eggs or babies at all times.","다른 부모는 항상 알이나 새끼를 보호해야 한다."],[11,"This is because birds called brown skuas want to eat them.","이것은 갈색 도둑갈매기라고 불리는 새들이 그것들을 먹고 싶어 하기 때문이다."]],"w":"11번에서 갈색 도둑갈매기가 알과 새끼를 먹고 싶어 한다고 해요. 그래서 다른 부모는 알과 새끼를 '보호해야' 해요.","c":2},"h":"ee6897eaa7"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThey use it to keep their eggs and babies safe.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"그들은 알과 새끼를 안전하게 지키기 위해 그것을 이용한다.","opts":["하루 24시간","마이크로 수면","갈색 도둑갈매기","남극의 환경"],"r":{"a":"2) 마이크로 수면","ev":"13~14번 문장","s":[[13,"So, chinstrap penguins need microsleep.","그래서 턱끈펭귄은 마이크로 수면이 필요하다."],[14,"They use it to keep their eggs and babies safe.","그들은 알과 새끼를 안전하게 지키기 위해 그것을 이용한다."]],"w":"14번의 it은 바로 앞 13번에서 말한 microsleep(마이크로 수면)을 가리켜요.","c":2,"k":"it = 마이크로 수면"},"pron":"it","h":"e2c0e960aa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, it is not easy to be awake for 24 hours a day.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 하루에 24시간 동안 깨어 있는 것은 쉽지 않다.","opts":["하루에 24시간 잠을 자는 것은 쉽지 않다.","24시간마다 깨어나는 것은 매우 쉽다.","하루 24시간 동안 먹이를 사냥하는 것은 쉽다.","하루에 24시간 동안 깨어 있는 것은 쉽지 않다."],"r":{"a":"4) 하루에 24시간 동안 깨어 있는 것은 쉽지 않다.","ev":"12번 문장","s":[[12,"However, it is not easy to be awake for 24 hours a day.","하지만, 하루에 24시간 동안 깨어 있는 것은 쉽지 않다."]],"w":"it은 가주어이고 to be awake for 24 hours a day가 진짜 주어예요. be awake는 '깨어 있다'이고, not easy라서 쉽지 않다는 뜻이에요.","c":4},"h":"31e629be00"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["턱끈펭귄은 한 번에 약 4시간씩 잔다.","턱끈펭귄의 마이크로 수면은 합쳐서 하루 약 11시간이 된다.","턱끈펭귄의 이름은 밝은 빨간색 발에서 따온 것이다.","알을 낳은 뒤 두 부모가 함께 먹이를 사냥하러 간다."],"opts":["Chinstrap penguins sleep for about four hours at a time.","Chinstrap penguins' microsleeps add up to around 11 hours of sleep a day.","A chinstrap penguin’s name is taken from its bright red feet.","Both parents go hunting for food together after the eggs are laid."],"r":{"a":"2) Chinstrap penguins' microsleeps add up to around 11 hours of sleep a day. (턱끈펭귄의 마이크로 수면은 합쳐서 하루 약 11시간이 된다.)","ev":"2번, 4번, 7번, 9~10번 문장","s":[[2,"Their name comes from the thin black line that runs under their chin.","그들의 이름은 턱 밑으로 이어지는 가는 검은 선에서 유래한다."],[4,"They sleep for very short periods, about four seconds.","그들은 약 4초 정도의 매우 짧은 시간 동안 잠을 잔다."],[7,"These add up to around 11 hours of sleep.","이것들은 결국 약 11시간의 수면 시간이 된다."],[9,"After the chinstrap penguins lay their eggs, one parent goes hunting for food.","턱끈펭귄이 알을 낳은 후, 한 부모는 먹이를 사냥하러 간다."],[10,"The other parent must protect the eggs or babies at all times.","다른 부모는 항상 알이나 새끼를 보호해야 한다."]],"w":"7번에 마이크로 수면이 합쳐서 약 11시간의 수면이 된다고 나와요. 이름은 턱 밑의 검은 선에서 왔고(2번), 알을 낳은 뒤에는 한 부모만 사냥하러 가요(9번).","c":2},"h":"f29760814c"},{"n":9,"t":"sum","q":"The penguins do this because a (A), deep sleep could be (B).","ko":"펭귄들은 (A) 깊은 수면은 (B)할 수 있기 때문에 이렇게 한다.","oko":["(A) 짧고 / (B) 위험","(A) 긴 / (B) 유용","(A) 긴 / (B) 위험","(A) 가볍고 / (B) 위험","(A) 긴 / (B) 쉬울"],"opts":["(A) short / (B) dangerous","(A) long / (B) useful","(A) long / (B) dangerous","(A) light / (B) dangerous","(A) long / (B) easy"],"r":{"a":"3) (A) long / (B) dangerous (A 긴 / B 위험)","ev":"8번 문장","s":[[8,"The penguins do this because a long, deep sleep could be dangerous.","펭귄들은 길고 깊은 수면은 위험할 수 있기 때문에 이렇게 한다."]],"w":"8번에서 길고(long) 깊은 수면은 위험할(dangerous) 수 있기 때문에 이렇게 한다고 했어요.","c":3},"h":"895b962cc8"},{"n":10,"t":"fill","q":"Chinstrap penguins [A] in Antarctica. Their name [B] from the thin black line that runs under their chin.","ko":"턱끈펭귄은 남극에 [A]. 그들의 이름은 턱 밑으로 이어지는 가는 검은 선에서 [B].","bank":["live","comes","because","often","thin","black"],"bko":{"live":"살다","comes":"온다, 유래한다","because":"~ 때문에","often":"자주","thin":"가는, 얇은","black":"검은"},"r":{"a":"[A] live (살다), [B] comes (온다, 유래한다)","ev":"1~2번 문장","s":[[1,"Chinstrap penguins live in Antarctica.","턱끈펭귄은 남극에 산다."],[2,"Their name comes from the thin black line that runs under their chin.","그들의 이름은 턱 밑으로 이어지는 가는 검은 선에서 유래한다."]],"w":"1~2번 문장에서 가져왔어요. 두 빈칸 모두 주어 뒤에 오는 동사가 들어가야 해요.","c":null},"h":"0bc3d938ea"}]},{"u":4,"id":"rj2-04-2","no":2,"ko":"어질어질 꽃 냄새","items":[{"n":1,"t":"tf","q":"We can find the titan arum in Indonesia.","ko":"우리는 titan arum을 인도네시아에서 발견할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"We can find the titan arum in Indonesia.","우리는 titan arum을 인도네시아에서 발견할 수 있다."]],"w":"3번 문장에 We can find the titan arum in Indonesia가 그대로 있어요.","c":"T"},"h":"7037f20566"},{"n":2,"t":"tf","q":"The titan arum blooms more often than other flowers.","ko":"titan arum은 다른 꽃들보다 더 자주 꽃을 피운다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It does not bloom as often as other flowers.","그것은 다른 꽃들만큼 자주 꽃을 피우지 않는다."]],"w":"7번에서 titan arum은 다른 꽃들만큼 자주 꽃을 피우지 않는다(does not bloom as often as other flowers)고 해요. 더 자주 핀다는 말은 반대예요.","c":"F"},"h":"8e53080f66"},{"n":3,"t":"tf","q":"The insects lay their eggs in the flower.","ko":"그 곤충들은 그 꽃 안에 알을 낳는다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"The insects even lay their eggs in the flower.","그 곤충들은 심지어 그 꽃 안에 알도 낳는다."]],"w":"13번 문장에 The insects even lay their eggs in the flower가 있어요.","c":"T"},"h":"55ea978f77"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It does not bloom as often as other flowers.)","ko":"그것은 다른 꽃들만큼 자주 ( ) 않는다.","opts":["꽃을 피우지","자라지","시들지","냄새가 나지"],"word":"bloom","r":{"a":"1) 꽃을 피우지","ev":"7~8번 문장","s":[[7,"It does not bloom as often as other flowers.","그것은 다른 꽃들만큼 자주 꽃을 피우지 않는다."],[8,"And when it does, it does not have a sweet smell.","그리고 그것이 필 때, 그것은 달콤한 향기를 가지고 있지 않다."]],"w":"7번은 꽃이 자주 피지 않는다는 말이고, 8번에서 when it does(그것이 필 때)라고 이어져요. 그래서 bloom은 '꽃을 피우다'예요.","c":1},"h":"6d94f80aad"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People say that it smells like rotting meat.)","ko":"사람들은 그것이 ( ) 고기 같은 냄새가 난다고 말한다.","opts":["신선한","썩어가는","구운","얼린"],"word":"rotting","r":{"a":"2) 썩어가는","ev":"9~11번 문장","s":[[9,"Actually, it smells terrible!","사실, 그것은 끔찍한 냄새가 난다!"],[10,"People say that it smells like rotting meat.","사람들은 그것이 썩어가는 고기 같은 냄새가 난다고 말한다."],[11,"This is why it is sometimes called the “corpse flower.”","이것이 그것(titan arum)이 때때로 ‘시체꽃’이라고 불리는 이유이다."]],"w":"9번에서 냄새가 끔찍하다고 했고, 11번에서 그래서 시체꽃이라고 불린다고 해요. 끔찍한 냄새가 나는 고기는 '썩어가는' 고기예요.","c":2},"h":"07e263f380"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen the titan arum finishes growing, it is usually around 3 meters tall.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"titan arum이 성장하는 것을 끝낼 때, 그것은 보통 키가 약 3미터이다.","opts":["인도네시아","titan arum","하루","곤충들"],"r":{"a":"2) titan arum","ev":"6번 문장","s":[[6,"When the titan arum finishes growing, it is usually around 3 meters tall.","titan arum이 성장하는 것을 끝낼 때, 그것은 보통 키가 약 3미터이다."]],"w":"6번의 it은 같은 문장 앞부분의 the titan arum을 가리켜요.","c":2,"k":"it = titan arum"},"pron":"it","h":"ae9c948af7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It can grow up to 10 centimeters in one day!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 하루 사이에 10센티미터까지 자랄 수 있다!","opts":["그것은 하루에 10미터씩 자란다.","그것은 10일 동안 전혀 자라지 않는다.","그것은 하루 사이에 최대 10센티미터까지 자랄 수 있다.","그것은 10센티미터보다 더 작게 자란다."],"r":{"a":"3) 그것은 하루 사이에 최대 10센티미터까지 자랄 수 있다.","ev":"5번 문장","s":[[5,"It can grow up to 10 centimeters in one day!","그것은 하루 사이에 10센티미터까지 자랄 수 있다!"]],"w":"5번 문장은 하루에 최대 10센티미터까지 자랄 수 있다(grow up to 10 centimeters)는 뜻이에요.","c":3},"h":"ea43da6618"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["titan arum은 세계에서 가장 키가 작은 꽃이다.","titan arum은 하루에 10미터까지 자랄 수 있다.","titan arum은 달콤한 향기가 난다.","titan arum은 세계에서 가장 키가 큰 꽃들 중 하나이다."],"opts":["The titan arum is the shortest flower in the world.","The titan arum can grow up to 10 meters in one day.","The titan arum has a sweet smell.","The titan arum is one of the tallest flowers in the world."],"r":{"a":"4) The titan arum is one of the tallest flowers in the world. (titan arum은 세계에서 가장 키가 큰 꽃들 중 하나이다.)","ev":"4번 문장","s":[[4,"It is one of the tallest flowers in the world.","그것은 세계에서 가장 키가 큰 꽃들 중 하나이다."]],"w":"4번에 It is one of the tallest flowers in the world라고 나와요.","c":4},"h":"d47c699563"},{"n":9,"t":"sum","q":"This is why it is sometimes (A) the “(B) flower.”","ko":"이것이 그것이 때때로 ‘(B)꽃’이라고 (A) 이유이다.","oko":["(A) 간직되는 / (B) 시체","(A) 불리는 / (B) 아기","(A) 불리는 / (B) 시체","(A) 불리는 / (B) 키 큰","(A) 미움받는 / (B) 시체"],"opts":["(A) kept / (B) corpse","(A) called / (B) baby","(A) called / (B) corpse","(A) called / (B) tall","(A) hated / (B) corpse"],"r":{"a":"3) (A) called / (B) corpse (A 불리는 / B 시체)","ev":"11번 문장","s":[[11,"This is why it is sometimes called the “corpse flower.”","이것이 그것(titan arum)이 때때로 ‘시체꽃’이라고 불리는 이유이다."]],"w":"11번에서 그것이 때때로 ‘시체꽃(corpse flower)’이라고 불린다(called)고 했어요.","c":3},"h":"89175ecf3b"},{"n":10,"t":"fill","q":"Most people think that flowers are [A] and pretty, have [B] colors, and smell nice.","ko":"대부분의 사람들은 꽃들이 [A] 예쁘며, [B] 색을 가지고 있고, 좋은 향기가 난다고 생각한다.","bank":["small","bright","often","because","grow","finish"],"bko":{"small":"작은","bright":"밝은","often":"자주","because":"~ 때문에","grow":"자라다","finish":"끝내다"},"r":{"a":"[A] small (작은), [B] bright (밝은)","ev":"1번 문장","s":[[1,"Most people think that flowers are small and pretty, have bright colors, and smell nice.","대부분의 사람들은 꽃들이 작고 예쁘며, 밝은색을 가지고 있고, 좋은 향기가 난다고 생각한다."]],"w":"1번 문장에서 가져왔어요. 두 빈칸 모두 꽃의 모습을 말해 주는 형용사가 들어가요. 뒤의 and pretty와 colors를 보면 어디에 무엇이 들어갈지 알 수 있어요.","c":null},"h":"a3db423afa"}]},{"u":4,"id":"rj2-04-3","no":3,"ko":"무지개색으로 빛나는 해변","items":[{"n":1,"t":"tf","q":"In 1967, the government stopped people from throwing their trash on the beach.","ko":"1967년에, 정부는 사람들이 해변에 쓰레기를 버리는 것을 막았다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In 1967, the government stopped people from throwing their trash there.","1967년에, 정부는 사람들이 그곳에 쓰레기를 버리는 것을 막았다."]],"w":"3번 문장에 In 1967, the government stopped people from throwing their trash there가 있고, there는 해변이에요.","c":"T"},"h":"2a94eefbaa"},{"n":2,"t":"tf","q":"The ocean's waves broke the glass into big rough pieces.","ko":"바다의 파도가 유리를 크고 거친 조각들로 부수었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Over the years, the ocean’s waves broke down the glass and made it into tiny smooth pieces that look like jewelry.","수년간, 바다의 파도가 유리를 부수고 그것을 보석처럼 보이는 아주 작고 매끄러운 조각들로 만들었다."]],"w":"8번에서 파도가 유리를 tiny smooth pieces(아주 작고 매끄러운 조각들)로 만들었다고 해요. 크고 거친 조각이 아니에요.","c":"F"},"h":"a815ea41b8"},{"n":3,"t":"tf","q":"Many people now want to visit Glass Beach.","ko":"많은 사람들이 이제 Glass Beach를 방문하고 싶어 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Unlike in the past, it is now a beautiful place that many people want to visit!","과거와는 달리, 그곳은 이제 많은 사람들이 방문하고 싶어 하는 아름다운 장소이다!"]],"w":"11번에서 it is now a beautiful place that many people want to visit이라고 해요. it은 Glass Beach예요.","c":"T"},"h":"e2585266b6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, one big problem remained: how to get rid of the small pieces of glass covering the beach.)","ko":"하지만, 한 가지 큰 문제가 ( ): 해변을 덮고 있는 작은 유리 조각들을 어떻게 제거할 것인가.","opts":["사라졌다","생겼다","남아 있었다","끝났다"],"word":"remained","r":{"a":"3) 남아 있었다","ev":"5~6번 문장","s":[[5,"Most of the trash was removed.","대부분의 쓰레기는 치워졌다."],[6,"However, one big problem remained: how to get rid of the small pieces of glass covering the beach.","하지만, 한 가지 큰 문제가 남아 있었는데, 해변을 덮고 있는 작은 유리 조각들을 어떻게 제거할 것인가 하는 것이었다."]],"w":"5번에서 대부분의 쓰레기가 치워졌다고 했고, 6번은 However로 반대되는 내용이에요. 그래서 큰 문제가 '남아 있었다'예요.","c":3},"h":"c99e685363"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They made the beach sparkle with all the colors of the rainbow!)","ko":"그것들은 해변이 무지개의 모든 색으로 ( ) 했다!","opts":["어두워지게","반짝이게","사라지게","흔들리게"],"word":"sparkle","r":{"a":"2) 반짝이게","ev":"8~9번 문장","s":[[8,"Over the years, the ocean’s waves broke down the glass and made it into tiny smooth pieces that look like jewelry.","수년간, 바다의 파도가 유리를 부수고 그것을 보석처럼 보이는 아주 작고 매끄러운 조각들로 만들었다."],[9,"They made the beach sparkle with all the colors of the rainbow!","그것들은 해변이 무지개의 모든 색으로 반짝이게 했다!"]],"w":"8번에서 유리가 보석처럼 보이는 조각이 되었고, 9번에서 무지개의 모든 색을 낸다고 해요. 보석 같은 조각들이 빛나니 sparkle은 '반짝이다'예요.","c":2},"h":"cd0c9c9cb0"},{"n":6,"t":"ref","q":"What does the underlined \"this place\" refer to?\nToday, this place is known as Glass Beach.","ko":"밑줄 친 this place이(가) 가리키는 것은?","sko":"오늘날, 이 장소는 Glass Beach로 알려져 있다.","opts":["캘리포니아에 있던 해변","유럽의 어느 도시","정부 청사","작은 유리 공장"],"r":{"a":"1) 캘리포니아에 있던 해변","ev":"1번, 10번 문장","s":[[1,"Once there was a beach in California that was full of trash.","예전에 캘리포니아에는 쓰레기로 가득 찬 해변이 있었다."],[10,"Today, this place is known as Glass Beach.","오늘날, 이 장소는 Glass Beach로 알려져 있다."]],"w":"10번의 this place는 1번에서 말한 캘리포니아에 있던 해변을 가리켜요.","c":1,"k":"this place = 캘리포니아에 있던 해변"},"pron":"this place","h":"d7dc6ed3ca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Surprisingly, Mother Nature took care of the problem by herself.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"놀랍게도, 대자연은 그 문제를 혼자 처리했다.","opts":["놀랍게도, 정부가 그 문제를 혼자 처리했다.","놀랍게도, 사람들이 대자연을 돌보았다.","놀랍게도, 대자연은 그 문제를 외면했다.","놀랍게도, 대자연이 스스로 그 문제를 처리했다."],"r":{"a":"4) 놀랍게도, 대자연이 스스로 그 문제를 처리했다.","ev":"6~7번 문장","s":[[6,"However, one big problem remained: how to get rid of the small pieces of glass covering the beach.","하지만, 한 가지 큰 문제가 남아 있었는데, 해변을 덮고 있는 작은 유리 조각들을 어떻게 제거할 것인가 하는 것이었다."],[7,"Surprisingly, Mother Nature took care of the problem by herself.","놀랍게도, 대자연은 그 문제를 혼자 처리했다."]],"w":"take care of the problem은 '그 문제를 처리하다'이고, by herself는 '혼자서'예요. the problem은 6번의 유리 조각 문제이고, 처리한 것은 정부가 아니라 대자연이에요.","c":4},"h":"5facb4e537"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사람들은 캔, 플라스틱, 유리를 해변에 버렸다.","사람들은 종이만 해변에 버렸다.","그 해변은 늘 아름다운 곳이었다.","정부만 해변에 쓰레기를 버렸다."],"opts":["People threw cans, plastic, and glass onto the beach.","People threw only paper onto the beach.","The beach was always a beautiful place.","Only the government threw trash onto the beach."],"r":{"a":"1) People threw cans, plastic, and glass onto the beach. (사람들은 캔, 플라스틱, 유리를 해변에 버렸다.)","ev":"2번 문장","s":[[2,"People threw garbage, including cans, plastic, and a lot of glass, onto it.","사람들이 캔, 플라스틱, 그리고 많은 유리를 포함하여 쓰레기를 그곳에 버렸다."]],"w":"2번에 사람들이 캔, 플라스틱, 많은 유리를 포함해 쓰레기를 버렸다고 나와요.","c":1},"h":"f19f568544"},{"n":9,"t":"sum","q":"(A) there was a beach in California that was (B) of trash.","ko":"(A) 캘리포니아에는 쓰레기로 (B) 해변이 있었다.","oko":["(A) 결코 ~ 않는 / (B) 가득 찬","(A) 예전에 / (B) 텅 빈","(A) 예전에 / (B) 가득 찬","(A) 오늘날 / (B) 가득 찬","(A) 예전에 / (B) 두려워하는"],"opts":["(A) Never / (B) full","(A) Once / (B) empty","(A) Once / (B) full","(A) Today / (B) full","(A) Once / (B) afraid"],"r":{"a":"3) (A) Once / (B) full (A 예전에 / B 가득 찬)","ev":"1번 문장","s":[[1,"Once there was a beach in California that was full of trash.","예전에 캘리포니아에는 쓰레기로 가득 찬 해변이 있었다."]],"w":"1번에서 예전에(Once) 쓰레기로 가득 찬(full of trash) 해변이 있었다고 했어요.","c":3},"h":"80f6c874a4"},{"n":10,"t":"fill","q":"Projects were started to [A] up the area. Most of the trash was [B].","ko":"그 지역을 [A] 위해 프로젝트들이 시작되었다. 대부분의 쓰레기는 [B].","bank":["clean","removed","because","often","started","never"],"bko":{"clean":"치우다, 청소하다","removed":"치워졌다(remove의 과거분사)","because":"~ 때문에","often":"자주","started":"시작했다","never":"결코 ~ 않다"},"r":{"a":"[A] clean (치우다, 청소하다), [B] removed (치워졌다)","ev":"4~5번 문장","s":[[4,"Projects were started to clean up the area.","그 지역을 치우기 위해 프로젝트들이 시작되었다."],[5,"Most of the trash was removed.","대부분의 쓰레기는 치워졌다."]],"w":"4~5번 문장에서 가져왔어요. A에는 to 뒤에 오는 동사원형, B에는 was 뒤에 오는 수동태 동사가 들어가요.","c":null},"h":"430b0c658b"}]},{"u":4,"id":"rj2-04-4","no":4,"ko":"친환경 도시, 쿠리치바","items":[{"n":1,"t":"tf","q":"Curitiba was once full of poor people and pollution.","ko":"Curitiba는 한때 가난한 사람들과 오염으로 가득 차 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Curitiba, Brazil, was once a city that was full of poor people and pollution.","브라질의 Curitiba(쿠리치바)는 한때 가난한 사람들과 오염으로 가득 차 있던 도시였다."]],"w":"1번 문장에 Curitiba, Brazil, was once a city that was full of poor people and pollution이 있어요.","c":"T"},"h":"20609f4ffb"},{"n":2,"t":"tf","q":"Children received money when they brought in cans and bottles.","ko":"아이들은 캔과 병을 가져오면 돈을 받았다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Children could bring in cans and bottles and receive school supplies in return.","아이들은 캔과 병을 가져와서 보상으로 학용품을 받을 수 있었다."]],"w":"8번에서 아이들은 캔과 병을 가져오고 in return(보상으로) school supplies, 즉 학용품을 받았어요. 돈이 아니에요.","c":"F"},"h":"ecc36f8e23"},{"n":3,"t":"tf","q":"Poor people gave their trash to the local centers and got food or bus tickets.","ko":"가난한 사람들은 쓰레기를 지역 센터에 주고 음식이나 버스표를 얻었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Poor people gave their trash to the local centers and got food or bus tickets.","가난한 사람들은 그들의 쓰레기를 지역 센터들에 주고 음식이나 버스표를 얻었다."]],"w":"7번 문장이 그대로 이 내용이에요. 쓰레기를 주고 음식이나 버스표를 받았어요.","c":"T"},"h":"b66bc9efcf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The idea was to exchange trash for food.)","ko":"그 아이디어는 쓰레기를 음식으로 ( ) 것이었다.","opts":["교환하는","버리는","만드는","나누어 먹는"],"word":"exchange","r":{"a":"1) 교환하는","ev":"5~6번 문장","s":[[5,"The idea was to exchange trash for food.","그 아이디어는 쓰레기를 음식으로 교환하는 것이었다."],[6,"So, they called this the Green Exchange Program.","그래서 그들은 이것을 Green Exchange 프로그램이라고 불렀다."]],"w":"5번 문장을 6번에서 Green Exchange Program이라고 불러요. 쓰레기를 주고 음식을 받는 것이니 exchange는 '교환하다'예요.","c":1},"h":"c6415b4f50"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Children could bring in cans and bottles and receive school supplies in return.)","ko":"아이들은 캔과 병을 가져와서 보상으로 학교 ( )을 받을 수 있었다.","opts":["식물","용품","점수","간식"],"word":"supplies","r":{"a":"2) 용품","ev":"8번 문장","s":[[8,"Children could bring in cans and bottles and receive school supplies in return.","아이들은 캔과 병을 가져와서 보상으로 학용품을 받을 수 있었다."]],"w":"8번에서 아이들이 캔과 병을 가져오고 받는 것이 school supplies예요. 학교에서 쓰는 물건, 즉 학용품이니 supplies는 '용품'이에요.","c":2},"h":"6e58daf946"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey thought of an idea that could help both poor families and the environment.","ko":"밑줄 친 They이(가) 가리키는 것은?","sko":"그들은 빈곤 가정과 환경 둘 다 도울 수 있는 아이디어를 생각해 냈다.","opts":["가난한 사람들","시 근로자들 팀","아이들","Curitiba의 공원들"],"r":{"a":"2) 시 근로자들 팀","ev":"3~4번 문장","s":[[3,"A team of city workers came together to make Curitiba one of the greenest cities in the world.","시 근로자들 팀이 Curitiba를 세계에서 가장 친환경적인 도시들 중 하나로 만들기 위해 모였다."],[4,"They thought of an idea that could help both poor families and the environment.","그들은 빈곤 가정과 환경 둘 다 도울 수 있는 아이디어를 생각해 냈다."]],"w":"4번의 They는 3번에서 모인 시 근로자들 팀(A team of city workers)을 가리켜요.","c":2,"k":"They = 시 근로자들 팀"},"pron":"They","h":"0cc3caf3be"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Through this program, people could get what they needed and clean up the city at the same time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 프로그램을 통해, 사람들은 그들이 필요로 하는 것을 얻고 동시에 도시를 깨끗이 치울 수 있었다.","opts":["이 프로그램을 통해 사람들은 필요한 것을 사고 도시를 떠날 수 있었다.","이 프로그램 때문에 사람들은 필요한 것을 얻지 못하고 도시는 더 더러워졌다.","이 프로그램을 통해 사람들은 도시를 깨끗이 하는 일만 할 수 있었다.","이 프로그램을 통해 사람들은 필요한 것을 얻으면서 동시에 도시도 깨끗이 할 수 있었다."],"r":{"a":"4) 이 프로그램을 통해 사람들은 필요한 것을 얻으면서 동시에 도시도 깨끗이 할 수 있었다.","ev":"9번 문장","s":[[9,"Through this program, people could get what they needed and clean up the city at the same time.","이 프로그램을 통해, 사람들은 그들이 필요로 하는 것을 얻고 동시에 도시를 깨끗이 치울 수 있었다."]],"w":"get what they needed는 '필요한 것을 얻다', clean up the city는 '도시를 깨끗이 치우다', at the same time은 '동시에'예요. 두 가지를 한꺼번에 이룰 수 있었다는 뜻이에요.","c":4},"h":"4a298d2bdf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Curitiba는 1970년에 크게 달라졌다.","Curitiba는 1790년에 크게 달라졌다.","Curitiba는 한 번도 달라지지 않았다.","Curitiba는 1970년에 더 가난하고 더러워졌다."],"opts":["Curitiba changed a lot in 1970.","Curitiba changed a lot in 1790.","Curitiba has never changed.","Curitiba became poorer and dirtier in 1970."],"r":{"a":"1) Curitiba changed a lot in 1970. (Curitiba는 1970년에 크게 달라졌다.)","ev":"2번 문장","s":[[2,"In 1970, however, everything changed.","그러나, 1970년에 모든 것이 달라졌다."]],"w":"2번에 1970년에 모든 것이 달라졌다(everything changed)고 나와요.","c":1},"h":"bfc5666a26"},{"n":9,"t":"sum","q":"The people also worked (A) to plant flowers, trees, and (B).","ko":"사람들은 또한 꽃과 나무와 (B)을(를) 심기 위해 (A) 일했다.","oko":["(A) 혼자 / (B) 풀","(A) 함께 / (B) 바위","(A) 함께 / (B) 풀","(A) 열심히 / (B) 캔","(A) 혼자 / (B) 바위"],"opts":["(A) alone / (B) grass","(A) together / (B) rocks","(A) together / (B) grass","(A) hard / (B) cans","(A) alone / (B) rocks"],"r":{"a":"3) (A) together / (B) grass (A 함께 / B 풀)","ev":"10번 문장","s":[[10,"The people also worked together to plant flowers, trees, and grass.","사람들은 또한 꽃과 나무와 풀을 심기 위해 함께 일했다."]],"w":"10번에서 사람들은 꽃과 나무와 풀(grass)을 심기 위해 함께(together) 일했다고 했어요.","c":3},"h":"817f90d387"},{"n":10,"t":"fill","q":"Now Curitiba is cleaner and safer, with 16 [A], 14 forests, and over 1,000 public [B] spaces for people to enjoy!","ko":"이제 Curitiba는 더 깨끗하고 더 안전하며, 사람들이 즐길 수 있는 16개의 [A], 14개의 숲, 그리고 1,000개 이상의 공공 [B] 공간이 있다!","bank":["parks","green","because","often","quickly","between"],"bko":{"parks":"공원들","green":"녹색의","because":"~ 때문에","often":"자주","quickly":"빨리","between":"~ 사이에"},"r":{"a":"[A] parks (공원들), [B] green (녹색의)","ev":"11번 문장","s":[[11,"Now Curitiba is cleaner and safer, with 16 parks, 14 forests, and over 1,000 public green spaces for people to enjoy!","이제 Curitiba는 사람들이 즐길 수 있는 16개의 공원, 14개의 숲, 그리고 1,000개 이상의 공공녹지들과 더불어 더 깨끗하고 더 안전하다!"]],"w":"11번 문장에서 가져왔어요. A에는 forests와 나란히 쓰이는 복수 명사, B에는 spaces를 꾸미는 말이 들어가요.","c":null},"h":"6f205eb44d"}]},{"u":5,"id":"rj2-05-1","no":1,"ko":"왜 자꾸 늦을까?","items":[{"n":1,"t":"tf","q":"We often believe that we can work faster than we really can.","ko":"우리는 흔히 자신이 실제로 할 수 있는 것보다 더 빠르게 일할 수 있다고 믿는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"We usually think we can work faster than we really can.","우리는 보통 자신이 실제로 할 수 있는 것보다 더 빠르게 작업할 수 있다고 생각한다."]],"w":"7번 문장에서 우리는 보통 실제보다 더 빠르게 일할 수 있다고 생각한다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"5ee7d8c277"},{"n":2,"t":"tf","q":"Unexpected events never cause delays in a project.","ko":"예상치 못한 일들은 프로젝트에서 절대 지연을 일으키지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Also, unexpected events often cause delays.","또한, 예상치 못한 일들이 자주 지연을 일으킨다."]],"w":"8번 문장에서 예상치 못한 일들이 자주 지연을 일으킨다(often cause delays)고 해요. never(절대 ~않다)는 반대 내용이에요.","c":"F"},"h":"766e99c2e2"},{"n":3,"t":"tf","q":"Giving yourself extra time can help you meet your deadline.","ko":"스스로에게 여분의 시간을 주면 마감일을 지키는 데 도움이 된다.","r":{"a":"T (본문과 맞는 내용)","ev":"12~13번 문장","s":[[12,"Also, consider giving yourself extra time to finish your project.","또한, 당신의 프로젝트를 마치기 위해 스스로에게 여분의 시간을 주는 것을 고려해라."],[13,"This will help you meet your deadline despite any unexpected delays.","이것은 당신이 어떤 예상치 못한 지연에도 불구하고 마감일을 지키도록 도와줄 것이다."]],"w":"12번에서 여분의 시간을 주는 것을 고려하라고 했고, 13번에서 이것이 예상치 못한 지연에도 마감일을 지키도록 도와준다고 해요.","c":"T"},"h":"8d5ef73b99"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You leave a short amount of time to complete it.)","ko":"당신은 그것을 ( ) 데 짧은 시간을 남겨 둔다.","opts":["시작하다","포기하다","완료하다","미루다"],"word":"complete","r":{"a":"3) 완료하다","ev":"4~5번 문장","s":[[4,"You leave a short amount of time to complete it.","당신은 그것을 완료하는 데 짧은 시간을 남겨 둔다."],[5,"In the end, you almost miss the deadline.","결국, 당신은 기한을 놓칠 뻔한다."]],"w":"숙제를 끝내기 위해 짧은 시간만 남겨 두는 상황이에요. 결국 기한을 놓칠 뻔하니(5번), complete = 완료하다(끝내다)예요.","c":3},"h":"9197c03f21"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Compare your current plan with past ones to make sure that it is realistic.)","ko":"계획이 ( )인지 확인하기 위해 현재의 계획을 과거의 계획들과 비교해라.","opts":["현실적인","화려한","복잡한","느린"],"word":"realistic","r":{"a":"1) 현실적인","ev":"11번 문장","s":[[11,"Compare your current plan with past ones to make sure that it is realistic.","계획이 현실적인지 확인하기 위해 당신의 현재 계획을 과거의 계획들과 비교해라."]],"w":"과거 계획과 비교하는 이유는 지금 계획이 실제로 지킬 수 있는 계획인지 확인하려는 거예요. realistic = 현실적인이에요.","c":1},"h":"ada8179058"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nMaybe you have experience with this.","ko":"밑줄 친 this이(가) 가리키는 것은?","sko":"아마도 당신은 이것에 대한 경험이 있을 것이다.","opts":["프로젝트가 계획대로 끝나지 않는다는 것","숙제를 일찍 끝내는 것","계획을 과거의 계획과 비교하는 것","스스로에게 여분의 시간을 주는 것"],"r":{"a":"1) 프로젝트가 계획대로 끝나지 않는다는 것","ev":"1~2번 문장","s":[[1,"According to Hofstadter’s law, a project always takes a longer time than planned.","호프스태터의 법칙에 따르면, 프로젝트는 항상 계획된 것보다 더 오랜 시간이 걸린다."],[2,"Maybe you have experience with this.","아마도 당신은 이것에 대한 경험이 있을 것이다."]],"w":"2번의 this는 바로 앞 1번에서 말한 호프스태터의 법칙, 즉 프로젝트가 계획한 것보다 더 오래 걸린다는 내용을 가리켜요.","c":1,"k":"this = 프로젝트가 계획대로 끝나지 않는다는 것"},"pron":"this","h":"fb45a90f91"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Things like this happen because we believe too strongly in our abilities.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 일들은 우리가 우리의 능력을 너무 강하게 믿기 때문에 발생한다.","opts":["이런 일들은 우리가 우리의 능력을 믿지 못해서 생긴다.","이런 일들은 능력이 부족한 사람에게만 생긴다.","이런 일들은 우리가 너무 일찍 시작해서 생긴다.","이런 일들은 우리가 우리의 능력을 지나치게 믿기 때문에 생긴다."],"r":{"a":"4) 이런 일들은 우리가 우리의 능력을 지나치게 믿기 때문에 생긴다.","ev":"6번 문장","s":[[6,"Things like this happen because we believe too strongly in our abilities.","이러한 일들은 우리가 우리의 능력을 너무 강하게 믿기 때문에 발생한다."]],"w":"because 뒤가 이유예요. believe too strongly in our abilities는 능력을 너무 강하게 믿는다는 뜻이에요. 믿지 못한다는 반대 내용이 아니에요.","c":4},"h":"b55b0e0d85"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["프로젝트는 보통 계획한 것보다 더 짧은 시간에 끝난다.","사람들은 자신의 능력을 충분히 믿지 않는다.","쉬울 것 같은 숙제에 시간을 적게 남기면 기한을 놓칠 뻔할 수 있다.","예상치 못한 일들은 프로젝트를 끝내는 것을 도와준다."],"opts":["A project usually ends faster than planned.","People do not believe enough in their abilities.","Leaving little time for an easy-looking homework can make you almost miss the deadline.","Unexpected events help you finish your project early."],"r":{"a":"3) Leaving little time for an easy-looking homework can make you almost miss the deadline.","ev":"3~5번 문장","s":[[3,"For example, you have homework that you think will be easy.","예를 들어, 당신은 쉬울 것이라고 생각하는 숙제가 있다."],[4,"You leave a short amount of time to complete it.","당신은 그것을 완료하는 데 짧은 시간을 남겨 둔다."],[5,"In the end, you almost miss the deadline.","결국, 당신은 기한을 놓칠 뻔한다."]],"w":"3~5번에서 쉬울 것 같은 숙제에 짧은 시간만 남기면 결국 기한을 놓칠 뻔한다고 해요. 나머지는 1번(더 오래 걸림), 6번(너무 강하게 믿음), 8번(지연을 일으킴)과 반대예요.","c":3},"h":"2fdea8e87d"},{"n":9,"t":"sum","q":"There are some (A) that help you (B) Hofstadter’s law.","ko":"호프스태터의 법칙을 (B) 도와주는 몇 가지 (A)이(가) 있다.","oko":["(A) 문제 / (B) 피하도록","(A) 방법 / (B) 깨뜨리도록","(A) 방법 / (B) 피하도록","(A) 방법 / (B) 따르도록","(A) 거짓말 / (B) 피하도록"],"opts":["(A) problems / (B) avoid","(A) tips / (B) break","(A) tips / (B) avoid","(A) tips / (B) follow","(A) lies / (B) avoid"],"r":{"a":"3) (A) tips / (B) avoid (A 방법 / B 피하도록)","ev":"10번 문장","s":[[10,"However, there are some tips that help you avoid Hofstadter’s law.","하지만, 당신이 호프스태터의 법칙을 피할 수 있도록 도와주는 몇 가지 방법이 있다."]],"w":"10번에서 호프스태터의 법칙을 피할 수 있도록 도와주는 몇 가지 방법(tips)이 있다고 했어요. 피하다는 avoid예요.","c":3},"h":"a6a8224d2f"},{"n":10,"t":"fill","q":"According to Hofstadter’s law, a project [A] takes a [B] time than planned.","ko":"호프스태터의 법칙에 따르면, 프로젝트는 [A] 계획된 것보다 [B] 시간이 걸린다.","bank":["always","longer","because","between","although","whether"],"bko":{"always":"항상","longer":"더 긴","because":"~ 때문에","between":"~ 사이에","although":"비록 ~이지만","whether":"~인지 아닌지"},"r":{"a":"[A] always (항상), [B] longer (더 긴)","ev":"1번 문장","s":[[1,"According to Hofstadter’s law, a project always takes a longer time than planned.","호프스태터의 법칙에 따르면, 프로젝트는 항상 계획된 것보다 더 오랜 시간이 걸린다."]],"w":"1번 문장에서 가져왔어요. A에는 takes 앞에 오는 빈도 말, B에는 time을 꾸미는 비교 형용사가 들어가요.","c":null},"h":"ada485b817"}]},{"u":5,"id":"rj2-05-2","no":2,"ko":"다 바꾸고 싶어!","items":[{"n":1,"t":"tf","q":"After you get something new, you may want to buy more new things.","ko":"새로운 것을 얻은 뒤에, 당신은 더 많은 새로운 것들을 사고 싶어질 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Suddenly you feel unhappy with your old stuff and want to buy more new things.","갑자기 당신은 당신의 오래된 물건들에 만족하지 못하고 더 많은 새로운 것들을 사고 싶어 한다."]],"w":"2번 문장에서 갑자기 오래된 물건에 만족하지 못하고 더 많은 새것을 사고 싶어 한다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"44c4d410b9"},{"n":2,"t":"tf","q":"The French philosopher was rich for most of his life.","ko":"그 프랑스 철학자는 삶의 대부분을 부유하게 보냈다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It was named after a French philosopher who was poor for most of his life.","그것은 삶의 대부분을 가난하게 보냈던 프랑스 철학자의 이름을 따서 지어졌다."]],"w":"4번 문장에서 철학자는 삶의 대부분을 가난하게(poor) 보냈다고 해요. rich(부유한)는 반대 내용이에요.","c":"F"},"h":"3fed63ca19"},{"n":3,"t":"tf","q":"After the robe came, his other things looked ugly to the philosopher.","ko":"가운이 오고 난 뒤, 그 철학자에게는 그의 다른 물건들이 보기 흉해 보였다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When he brought it home, it made his other things look ugly in comparison.","그가 그것을 집에 가지고 왔을 때, 그것은 그의 다른 물건들을 비교적 보기 흉하게 만들었다."]],"w":"6번 문장에서 가운을 집에 가져오자 그것이 다른 물건들을 비교적 보기 흉하게 만들었다고 해요.","c":"T"},"h":"a5bc3da763"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So he started replacing all his furniture and clothes with new items.)","ko":"그래서 그는 그의 모든 가구와 옷을 새로운 물품들로 ( ) 시작했다.","opts":["기록하는","교체하는","수리하는","쌓아 두는"],"word":"replacing","r":{"a":"2) 교체하는","ev":"7번 문장","s":[[7,"So he started replacing all his furniture and clothes with new items.","그래서 그는 그의 모든 가구와 옷을 새로운 물품들로 교체하기 시작했다."]],"w":"가운 때문에 다른 물건이 초라해 보여서 새 물품으로 바꾸기 시작하는 상황이에요. replace A with B = A를 B로 바꾸다(교체하다)예요.","c":2},"h":"a077ef6ce1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To prevent the Diderot effect, try to purchase things that fit your current style.)","ko":"디드로 효과를 ( ) 위해, 당신의 현재 스타일에 맞는 물건들을 구매하려고 노력해라.","opts":["막다","믿다","자랑하다","돕다"],"word":"prevent","r":{"a":"1) 막다","ev":"11번 문장","s":[[11,"To prevent the Diderot effect, try to purchase things that fit your current style and match what you already have.","디드로 효과를 방지하기 위해, 당신의 현재 스타일에 맞으며 당신이 이미 가지고 있는 것과 어울리는 물건들을 구매하려고 노력해라."]],"w":"앞에서 디드로 효과는 필요 없는 물건을 계속 사게 되는 문제로 나와요. 그래서 이 효과를 '막기' 위해 현재 스타일과 어울리는 물건을 사라는 뜻이에요. prevent = 막다예요.","c":1},"h":"7fc11bb136"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nOne day he was given a beautiful red robe.","ko":"밑줄 친 he이(가) 가리키는 것은?","sko":"어느 날 그는 아름다운 빨간 가운을 받았다.","opts":["디드로 효과","프랑스 철학자","빨간 가운","그의 친구"],"r":{"a":"2) 프랑스 철학자","ev":"4~5번 문장","s":[[4,"It was named after a French philosopher who was poor for most of his life.","그것은 삶의 대부분을 가난하게 보냈던 프랑스 철학자의 이름을 따서 지어졌다."],[5,"One day he was given a beautiful red robe.","어느 날 그는 아름다운 빨간 가운을 받았다."]],"w":"5번의 he는 4번에서 말한 프랑스 철학자(a French philosopher)를 가리켜요.","c":2,"k":"he = 프랑스 철학자"},"pron":"he","h":"c3c77ef2ed"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, you end up with items you don’t need.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로, 당신은 필요하지 않은 물건들을 갖게 된다.","opts":["결과적으로, 당신은 가진 물건을 모두 버리게 된다.","결과적으로, 당신은 필요한 물건을 더 싸게 사게 된다.","결과적으로, 당신은 물건을 사고 싶은 마음이 없어진다.","결과적으로, 당신은 필요하지 않은 물건들을 갖게 된다."],"r":{"a":"4) 결과적으로, 당신은 필요하지 않은 물건들을 갖게 된다.","ev":"10번 문장","s":[[10,"As a result, you end up with items you don’t need.","결과적으로, 당신은 필요하지 않은 물건들을 갖게 된다."]],"w":"end up with ~는 '결국 ~을 갖게 되다'이고, items you don’t need은 필요하지 않은 물건들이에요. 새것을 계속 산 결과로 쓸모없는 물건이 쌓인다는 뜻이에요.","c":4},"h":"bdf7b8b18e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["디드로 효과는 프랑스 철학자의 이름을 따서 지어졌다.","디드로 효과는 영국 가수의 이름을 따서 지어졌다.","디드로 효과는 부유한 왕의 이름을 따서 지어졌다.","디드로 효과는 가운 제작자의 이름을 따서 지어졌다."],"opts":["The Diderot effect was named after a French philosopher.","The Diderot effect was named after an English singer.","The Diderot effect was named after a rich king.","The Diderot effect was named after a robe maker."],"r":{"a":"1) The Diderot effect was named after a French philosopher. (디드로 효과는 프랑스 철학자의 이름을 따서 지어졌다.)","ev":"4번 문장","s":[[4,"It was named after a French philosopher who was poor for most of his life.","그것은 삶의 대부분을 가난하게 보냈던 프랑스 철학자의 이름을 따서 지어졌다."]],"w":"4번에 프랑스 철학자의 이름을 따서 지어졌다(named after a French philosopher)고 나와요.","c":1},"h":"6f8a116a9c"},{"n":9,"t":"sum","q":"Getting something new can (A) have an (B) effect.","ko":"새로운 것을 얻는 것은 (A) (B) 효과를 가질 수 있다.","oko":["(A) 결코 ~않고 / (B) 예상치 못한","(A) 때때로 / (B) 예상된","(A) 때때로 / (B) 예상치 못한","(A) 항상 / (B) 예상치 못한","(A) 때때로 / (B) 불행한"],"opts":["(A) never / (B) unexpected","(A) sometimes / (B) expected","(A) sometimes / (B) unexpected","(A) always / (B) unexpected","(A) sometimes / (B) unhappy"],"r":{"a":"3) (A) sometimes / (B) unexpected (A 때때로 / B 예상치 못한)","ev":"1번 문장","s":[[1,"Getting something new can sometimes have an unexpected effect.","새로운 것을 얻는 것은 때때로 예상치 못한 효과를 가질 수 있다."]],"w":"1번에서 새로운 것을 얻는 것은 때때로(sometimes) 예상치 못한(unexpected) 효과를 가질 수 있다고 했어요.","c":3},"h":"1e2eb3da48"},{"n":10,"t":"fill","q":"This is how the Diderot effect [A] you to a series of [B] purchases.","ko":"이것이 디드로 효과가 당신을 [B] 일련의 구매로 [A] 방법이다.","bank":["leads","unplanned","because","between","although","whether"],"bko":{"leads":"이끈다","unplanned":"계획하지 않은","because":"~ 때문에","between":"~ 사이에","although":"비록 ~이지만","whether":"~인지 아닌지"},"r":{"a":"[A] leads (이끈다), [B] unplanned (계획하지 않은)","ev":"8번 문장","s":[[8,"This is how the Diderot effect leads you to a series of unplanned purchases.","이것이 디드로 효과가 당신을 계획하지 않은 일련의 구매로 이끄는 방법이다."]],"w":"8번 문장에서 가져왔어요. A에는 you 앞에 오는 동사, B에는 purchases를 꾸미는 말이 들어가요.","c":null},"h":"f0761ea916"}]},{"u":5,"id":"rj2-05-3","no":3,"ko":"분명히 집중했는데?","items":[{"n":1,"t":"tf","q":"In the experiment, words are recognized more quickly than colors.","ko":"실험에서, 단어들은 색들보다 더 빨리 인식된다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"So words are recognized more quickly than colors.","그래서 단어들이 색들보다 더 빨리 인식된다."]],"w":"14번 문장에서 단어들이 색들보다 더 빨리 인식된다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"ac94b6e599"},{"n":2,"t":"tf","q":"The brain needs less time when it handles conflicting information.","ko":"뇌는 서로 맞지 않는 정보를 다룰 때 더 적은 시간이 필요하다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"It happens because the brain needs extra time to work when it handles conflicting information.","그것은 뇌가 상충되는 정보를 다룰 때 일할 추가의 시간을 필요로 하기 때문에 발생한다."]],"w":"9번 문장에서 뇌가 상충되는 정보를 다룰 때 추가의 시간(extra time)이 필요하다고 해요. less(더 적은)는 반대예요.","c":"F"},"h":"fb2c1bb5aa"},{"n":3,"t":"tf","q":"In the experiment, the word red is written in the color yellow.","ko":"실험에서, ‘빨강’이라는 단어는 노란색으로 쓰여 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"In this experiment, the word red is written in yellow.","이 실험에서, ‘빨강’이라는 단어는 노란색으로 쓰여 있다."]],"w":"10번 문장에 the word red is written in yellow라고 그대로 나와요. 단어의 뜻(빨강)과 글자 색(노랑)이 서로 달라요.","c":"T"},"h":"19807644ed"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The word’s meaning and its color are conflicting.)","ko":"단어의 의미와 그것의 색이 ( ).","opts":["똑같은","상충되는","어울리는","비슷한"],"word":"conflicting","r":{"a":"2) 상충되는","ev":"10~11번 문장","s":[[10,"In this experiment, the word red is written in yellow.","이 실험에서, ‘빨강’이라는 단어는 노란색으로 쓰여 있다."],[11,"The word’s meaning and its color are conflicting.","단어의 의미와 그것의 색이 상충된다."]],"w":"10번에서 red라는 단어가 노란색으로 쓰여 있어요. 뜻은 빨강인데 색은 노랑이라 서로 맞지 않으니 conflicting = 상충되는이에요.","c":2},"h":"5b130a2819"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It happens because the brain needs extra time to work when it handles conflicting information.)","ko":"그것은 뇌가 서로 맞지 않는 정보를 ( ) 때 일할 추가의 시간을 필요로 하기 때문에 발생한다.","opts":["버린다","기억한다","만든다","다룬다"],"word":"handles","r":{"a":"4) 다룬다","ev":"9번 문장","s":[[9,"It happens because the brain needs extra time to work when it handles conflicting information.","그것은 뇌가 상충되는 정보를 다룰 때 일할 추가의 시간을 필요로 하기 때문에 발생한다."]],"w":"뇌에 서로 맞지 않는 정보가 들어왔을 때 그것을 처리하는 상황이에요. handle = 다루다(처리하다)예요.","c":4},"h":"98cc215bb0"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWasn’t it easy?","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"그것은 쉽지 않았는가?","opts":["상자 안 단어들의 색을 말하는 것","뇌가 일하는 것","스트룹 효과","단어를 읽는 것"],"r":{"a":"1) 상자 안 단어들의 색을 말하는 것","ev":"1~2번 문장","s":[[1,"Say the colors of the words in the box below as fast as you can!","아래 상자에 있는 단어들의 색들을 가능한 한 빨리 말해 보라!"],[2,"Wasn’t it easy?","그것은 쉽지 않았는가?"]],"w":"2번의 it은 바로 앞 1번에서 말한, 상자 안 단어들의 색을 가능한 한 빨리 말하는 것을 가리켜요.","c":1,"k":"it = 상자 안 단어들의 색을 말하는 것"},"pron":"it","h":"0e33036c3a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The brain is more familiar with reading words than with naming colors.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"뇌는 색의 이름을 말하는 것보다 단어를 읽는 것에 더 친숙하다.","opts":["뇌는 단어를 읽는 것보다 색의 이름을 말하는 것에 더 익숙하다.","뇌는 단어를 읽는 것에도 색의 이름을 말하는 것에도 익숙하지 않다.","뇌는 색의 이름을 말하는 것보다 단어를 읽는 것에 더 익숙하다.","뇌는 단어를 읽을 때 색의 이름을 말할 때보다 더 오랜 시간이 걸린다."],"r":{"a":"3) 뇌는 색의 이름을 말하는 것보다 단어를 읽는 것에 더 익숙하다.","ev":"13번 문장","s":[[13,"The brain is more familiar with reading words than with naming colors.","뇌는 색의 이름을 말하는 것보다 단어를 읽는 것에 더 친숙하다."]],"w":"be familiar with는 ~에 익숙하다예요. reading words(단어 읽기)가 naming colors(색 이름 말하기)보다 뇌에 더 익숙하다는 뜻이에요.","c":3},"h":"2a85a0aca0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["색 대신 단어를 말했다면 당신은 스트룹 효과를 경험했을 수 있다.","뇌는 단어를 읽는 것보다 색을 읽는 것이 더 빠르다.","실험은 당신에게 색이 아니라 단어를 말하라고 요청한다.","실험에서 ‘빨강’이라는 단어는 파란색으로 쓰여 있다."],"opts":["You may have experienced the Stroop Effect if you said the word instead of the color.","The brain recognizes colors faster than words.","The experiment asks you to say the word, not the color.","In the experiment, the word red is written in blue."],"r":{"a":"1) You may have experienced the Stroop Effect if you said the word instead of the color.","ev":"7~8번 문장","s":[[7,"Did you say the word instead of the color?","색 대신에 단어를 말했는가?"],[8,"If so, you experienced the Stroop Effect.","만약 그렇다면, 당신은 스트룹 효과(Stroop Effect)를 경험했다."]],"w":"7~8번에서 색 대신 단어를 말했다면 스트룹 효과를 경험한 것이라고 해요. 단어가 색보다 더 빨리 인식되고(14번), 실험은 단어가 아니라 색을 말하라고 하며(15번), red는 노란색으로 쓰여 있어요(10번).","c":1},"h":"8ee8afe1e1"},{"n":9,"t":"sum","q":"Did you find that more (A)? Did it take (B)?","ko":"당신은 그것이 더 (A) 생각했는가? 시간이 (B) 걸렸는가?","oko":["(A) 쉽다고 / (B) 더 오래","(A) 어렵다고 / (B) 더 빨리","(A) 어렵다고 / (B) 더 오래","(A) 지루하다고 / (B) 더 오래","(A) 어렵다고 / (B) 더 짧게"],"opts":["(A) easy / (B) longer","(A) difficult / (B) faster","(A) difficult / (B) longer","(A) boring / (B) longer","(A) difficult / (B) shorter"],"r":{"a":"3) (A) difficult / (B) longer (A 어렵다고 / B 더 오래)","ev":"5~6번 문장","s":[[5,"Did you find that more difficult?","당신은 그것이 더 어렵다고 생각했는가?"],[6,"Did it take longer?","시간이 더 오래 걸렸는가?"]],"w":"5번에서 더 어려웠는지(more difficult), 6번에서 시간이 더 오래 걸렸는지(take longer) 물어요.","c":3},"h":"3f08ac8290"},{"n":10,"t":"fill","q":"So your brain has to [A] on to the wrong answer until the right answer comes. This [B] down your brain!","ko":"그래서 당신의 뇌는 올바른 답이 떠오를 때까지 잘못된 답을 계속 [A]해야 한다. 이것은 당신의 뇌를 [B]!","bank":["hold","slows","speeds","forget","recognize","familiar"],"bko":{"hold":"잡다, 보유하다","slows":"늦춘다(slow의 3인칭 단수)","speeds":"속도를 낸다","forget":"잊다","recognize":"인식하다","familiar":"익숙한"},"r":{"a":"[A] hold (잡다, 보유하다), [B] slows (늦춘다)","ev":"16~17번 문장","s":[[16,"So your brain has to hold on to the wrong answer until the right answer comes.","그래서 당신의 뇌는 올바른 답이 떠오를 때까지 잘못된 답을 계속 보유해야 한다."],[17,"This slows down your brain!","이것은 당신의 뇌를 늦춘다!"]],"w":"16~17번 문장에서 가져왔어요. hold on to는 ~을 계속 잡고 있다는 뜻이고, 뒤에 down이 오는 slow down(속도를 늦추다)을 써요. speeds down은 어색해요.","c":null},"h":"d8137ba283"}]},{"u":5,"id":"rj2-05-4","no":4,"ko":"조금만 더 도와줘~","items":[{"n":1,"t":"tf","q":"You agree to walk to the corner because it is not far.","ko":"그곳은 멀지 않아서, 당신은 길모퉁이까지 걸어가는 것을 승낙한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It’s not far, so you agree.","그곳(길모퉁이)은 멀지 않아서, 당신은 승낙한다."]],"w":"3번 문장에서 길모퉁이는 멀지 않아서 당신이 승낙한다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"d19f71913e"},{"n":2,"t":"tf","q":"Salespeople put their foot in the door so that people could close it.","ko":"판매원들은 사람들이 문을 닫을 수 있도록 문간에 발을 들여놓았다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"To prevent this, salespeople would sometimes put their foot in the way of the door so it couldn’t be closed.","이것을 막기 위해, 판매원들은 문이 닫히지 않도록 때때로 문간에 발을 들여놓곤 했다."]],"w":"10번 문장에서 판매원들은 문이 닫히지 않도록(so it couldn’t be closed) 발을 들여놓았다고 해요. 닫을 수 있도록이
