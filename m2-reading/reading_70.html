ky Price Tags", "First, let's imagine Logan at a clothing store. He finds a nice T-shirt that he really likes. The price tag says 40 dollars. Logan thinks that it is expensive. But the next day, he sees that the price is crossed out and the tag says 30 dollars. Logan talks to himself, “Oh, it's on sale! What a great deal!” He gets excited and decides to buy it. In fact, 30 dollars is still a lot, but Logan thinks it is a great price!", "Half Empty, Half Full?", "Now, meet Mia who is looking for a little cheese for her sandwich. She has to choose between two types of cheese. One says “20% Fat,” and the other says “80% Fat-Free.” Mia picks up the 80% fat-free cheese. She says to herself, “I think it's healthier!” She feels proud of the choice that she makes. However, Mia does not know the words are tricking her. Both types of cheese are actually the same!", "Lost in Flavors", "Lastly, imagine Yena at an ice cream shop with many kinds of ice cream flavors. Exciting, right? Well, not for Yena. She feels stressed because there are so many options. So, Yena decides to ask the friendly clerk Andy for help. Andy recommends the top five flavors that everyone loves. Yena easily makes a decision with just a few options. She leaves the store with a smile and realizes that fewer choices can be better. Remember these secrets when you go shopping. They will guide you to make wiser decisions."];var PASS_KO=["쇼핑객이 꼭 알아야 할 비밀", "쇼핑하러 갈 때 여러분은 무슨 생각을 하나요? 가격이 하나의 요소일 수 있지만, 실제로는 생각해야 할 것들이 더 많습니다. 여기 여러분이 꼭 알아야 할 몇 가지 쇼핑 비밀이 있습니다.", "교묘한 가격표", "먼저, 옷 가게에 있는 Logan을 상상해 보세요. 그는 정말 마음에 드는 멋진 티셔츠를 발견합니다. 가격표에는 40달러라고 쓰여 있습니다. Logan은 그것이 비싸다고 생각합니다. 하지만 다음날, 그는 가격이 줄을 그어 지워져 있고 가격표에 30달러라고 쓰여 있는 것을 봅니다. Logan은 “아, 할인 중이구나! 정말 좋은 거래야!”라고 혼잣말을 합니다. 그는 신이 나서 그것을 구입하기로 결정합니다. 사실, 30달러는 여전히 큰 금액이지만, Logan은 그것이 좋은 가격이라고 생각합니다!", "반이 비어 있는가, 반이 차 있는가?", "이제 샌드위치에 넣을 약간의 치즈를 찾고 있는 Mia를 만나 보세요. 그녀는 두 가지 종류의 치즈 중에서 선택해야 합니다. 하나는 ‘20% 지방’이라고 적혀 있고, 다른 하나는 ‘80% 무지방’이라고 적혀 있습니다. Mia는 80% 무지방 치즈를 집어 듭니다. 그녀는 “나는 이것이 더 건강에 좋은 것 같아!”라고 혼잣말을 합니다. 그녀는 자신이 한 선택에 자부심을 느낍니다. 하지만 Mia는 이 단어들이 그녀를 속이고 있다는 것을 모릅니다. 두 종류의 치즈는 사실 같습니다!", "맛 속에서 길을 잃다", "마지막으로, 여러 가지 종류의 아이스크림 맛이 있는 아이스크림 가게에 있는 예나를 상상해 보세요. 신나는 일이죠? 글쎄요, 예나에게는 그렇지 않습니다. 그녀는 선택지가 너무 많아서 스트레스를 느낍니다. 그래서 예나는 친절한 점원 Andy에게 도움을 요청하기로 결심합니다. Andy는 모두가 좋아하는 상위 다섯 가지 맛을 추천합니다. 예나는 단 몇 가지 선택지 중에서 쉽게 결정을 내립니다. 그녀는 미소를 지으며 가게를 떠나고, 더 적은 선택지가 더 좋을 수도 있다는 것을 깨닫습니다. 쇼핑할 때 이러한 비밀들을 기억하세요. 그것들이 여러분이 더 현명한 결정을 내리도록 안내해 줄 것입니다."];var BG=[{"qs": [{"n": 6, "q": "윗글의 빈칸에 들어갈 말로 알맞은 것은?   First, let’s imagine Logan at a ________ store.", "o": ["grocery", "clothing", "furniture", "stationery", "convenience"], "a": 1, "ans": "clothing", "ko": ["식료품", "옷", "가구", "문구", "편의점"], "evs": [["He finds a nice T-shirt that he really likes.", "그는 정말 마음에 드는 멋진 티셔츠를 발견합니다."]], "ow": ["오답 ✕ — grocery는 '식료품'이다. Logan이 발견한 것은 'a nice T-shirt'(멋진 티셔츠)이다.", "정답 ○ — 'a nice T-shirt'(멋진 티셔츠)를 발견했으므로 옷 가게, 즉 clothing store이다.", "오답 ✕ — furniture는 '가구'이다. 티셔츠는 가구가 아니다.", "오답 ✕ — stationery는 '문구'이다. 티셔츠와 맞지 않는다.", "오답 ✕ — convenience store는 '편의점'이다. 티셔츠를 사는 가게로 보기 어렵다."], "memo": ["정답 ②: clothing(옷)", "근거: He finds a nice T-shirt that he really likes.(그는 정말 마음에 드는 멋진 티셔츠를 발견합니다.)", "함정: 가게 이름은 뒤의 T-shirt에서 알 수 있음 ✕"], "why": "티셔츠를 발견했으므로 옷 가게이다.", "ev": ["He finds a nice T-shirt that he really likes.", "그는 정말 마음에 드는 멋진 티셔츠를 발견합니다."]}, {"n": 7, "q": "윗글의 빈칸에 들어갈 말로 알맞은 것은?   Oh, it’s on sale! What a great deal! He gets excited and ________.", "o": ["decides to buy it", "gives up buying it", "complains to the clerk", "looks for a cheaper one", "leaves his wallet at the store"], "a": 0, "ans": "decides to buy it", "ko": ["그것을 사기로 결정한다", "그것을 사는 것을 포기한다", "점원에게 불평한다", "더 싼 것을 찾는다", "지갑을 가게에 두고 간다"], "evs": [["Logan talks to himself, “Oh, it’s on sale! What a great deal!”", "Logan은 “아, 할인 중이구나! 정말 좋은 거래야!”라고 혼잣말을 합니다."]], "ow": ["정답 ○ — 'What a great deal!'(정말 좋은 거래야!)라며 신이 났으므로 사기로 결정한다.", "오답 ✕ — 좋은 거래라고 느끼며 신이 났으므로 포기하지 않는다.", "오답 ✕ — 'What a great deal!'이라고
