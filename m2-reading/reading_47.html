rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "Five Peas in a Pod", "en": "Five little peas lived together in a pod.", "ko": "다섯 개의 작은 완두콩이 꼬투리 속에서 함께 살았다.", "ok": true, "foot": ["1pod 꼬투리, 콩깍지"], "fixes": []}, {"n": 2, "tag": null, "en": "The biggest pea said, “What the world is like?", "ko": "가장 큰 완두콩이 말했다. “세상은 어떤 것 같아?", "ok": false, "foot": [], "fixes": [{"wrong": "the world is", "right": "is the world", "partial": false, "at": [5], "point": "의문문 어순: 의문사 의문문은 '의문사+동사+주어' 어순으로 도치되어야 함 (is the world)", "topic": "의문문 어순", "memo": "의문사 의문문은 '의문사+동사+주어' 어순으로 도치되어야 함 (is the world)"}]}, {"n": 3, "tag": null, "en": "I want doing great work for the world. I can’t wait getting out of here.”", "ko": "난 세상을 위해 훌륭한 일을 하고 싶어. 나는 빨리 여기서 나가고 싶어.”", "ok": false, "foot": [], "fixes": [{"wrong": "doing", "right": "to do", "partial": false, "at": [2], "point": "동사 want는 목적어로 to부정사를 취함(want to do)", "topic": "어법", "memo": "동사 want는 목적어로 to부정사를 취함(want to do)"}, {"wrong": "getting", "right": "to get", "partial": false, "at": [11], "point": "관용표현 can't wait는 to부정사를 목적어로 취함(can't wait to get)", "topic": "어법", "memo": "관용표현 can't wait는 to부정사를 목적어로 취함(can't wait to get)"}]}, {"n": 4, "tag": null, "en": "The smallest pea said, “Good for you. I’m too smaller. What I can do?”", "ko": "가장 작은 완두콩이 말했다. “좋겠다. 난 너무 작아. 내가 무엇을 할 수 있겠어?”", "ok": false, "foot": [], "fixes": [{"wrong": "too smaller", "right": "too small", "partial": false, "at": [8], "point": "비교급 오류: too 뒤에는 원급 형용사 사용(비교급 smaller 사용 불가)", "topic": "비교급 오류", "memo": "too 뒤에는 원급 형용사 사용(비교급 smaller 사용 불가)"}, {"wrong": "What I can do", "right": "What can I do", "partial": false, "at": [10], "point": "의문문 어순: 조동사 can이 주어 앞으로 도치되어야 함", "topic": "의문문 어순", "memo": "조동사 can이 주어 앞으로 도치되어야 함"}]}, {"n": 5, "tag": null, "en": "The others cheered, “There will be something what you can do! You’ll founded it.”", "ko": "다른 콩들이 응원했다. “네가 할 수 있는 일이 있을 거야! 넌 그것을 찾을 거야.”", "ok": false, "foot": [], "fixes": [{"wrong": "what", "right": "that", "partial": false, "at": [7], " lest pea said, “Good for you. I’m too small. What can I do?” The others cheered, “There will be something that you can do! You’ll find it.”", "One day, the pod broke open. The wind blew the smallest pea up into the air. It flew and landed on a tiny space by the window of a house. Soil built up, and the tiny pea sank into it. A young girl lived with her mom in the house. Her mom had to work from early morning to late evening. The girl was very sick and stayed in bed all day. The girl asked Mom what the green thing by the window was. “Oh, it's a pea plant! It is as little as a baby’s finger.” “Where did it come from?” asked Mom. The girl looked at the little plant in wonder. Every day, the girl went to the window to see the plant. It grew taller and taller. It became as tall as a small tree after a few weeks. “How pretty and healthy you are! When I sit in the sun to see you, I feel healthier, too!” The girl became stronger and happier day by day. One evening, the girl shouted, “You must see this, Mom! It’s the most wonderful thing!” A little flower blossomed on the pea plant. It was a beautiful pink flower. “Thank you, little plant. You are the friend I have waited for!” The little pea was as happy as the girl. It finally found the thing which it could do."];var PASS_KO=["완두콩 꽃", "다섯 개의 작은 완두콩이 꼬투리 속에서 함께 살았다. 가장 큰 완두콩이 말했다. “세상은 어떤 것 같아? 난 세상을 위해 훌륭한 일을 하고 싶어. 나는 빨리 여기서 나가고 싶어.” 가장 작은 완두콩이 말했다. “좋겠다. 난 너무 작아. 내가 무엇을 할 수 있겠어?” 다른 콩들이 응원했다. “네가 할 수 있는 일이 있을 거야! 넌 그것을 찾을 거야.”", "어느 날, 그 꼬투리가 터져 열렸다. 바람이 가장 작은 완두콩을 공중으로 날려 보냈다. 그것은 날아서 어느 집 창문 옆의 작은 공간에 내려앉았다. 흙이 쌓이자 그 작은 완두콩은 그 속으로 가라앉았다. 그 집에는 한 어린 소녀가 어머니와 함께 살고 있었다. 그녀의 어머니는 이른 아침부터 늦은 저녁까지 일해야 했다. 소녀는 매우 아파서 하루 종일 침대에 누워 있었다. 어느 날, 소녀는 엄마에게 창문 옆에 있는 그 초록색 물건이 무엇인지 물었다. “오, 이건 완두콩 식물이네! 그건 아기의 손가락만큼이나 작구나.” “이게 어디에서 온 것일까?” 엄마가 물으셨다. 소녀는 경이롭게 그 작은 식물을 바라보았다. 매일 소녀는 그 식물을 보기 위해 창문으로 갔다. 그것은 점점 더 키가 자랐다. 몇 주가 지나자 그것은 작은 나무만큼 키가 커졌다. “너는 정말 예쁘고 건강하구나! 너를 보기 위해 햇볕에 앉아 있을 때, 나도 더 건강해지는 것 같아!” 소녀는 날이 갈수록 더 강해지고 행복해졌다. 어느 날 저녁, 소녀가 외쳤다. “엄마, 이거를 꼭 봐야 해요! 그것은 가장 멋진 거예요!” 작은 꽃이 완두콩 식물에 피어 있었다. 그것은 아름다운 분홍색 꽃이었다. “고마워, 꼬마 식물아. 네가 바로 내가 기다려 왔던 친구야!” 작은 완두콩은 소녀만큼 행복했다. 그것은 마침내 자신이 할 수 있는 일을 찾았다."];var DG=[{"dlg": [["W", "Did you hear about our school trip next week?", "다음 주 우리 수학여행에 대해 들었어?"], ["M", "Yeah, we’re going to the space museum.", "응, 우리 우주 박물관에 가잖아."], ["W", "Right. We can go inside a real rocket there.", "맞아. 거기서 진짜 로켓 안에 들어가 볼 수 있어."], ["M", "Sounds like a fun place. I’m looking forward to the school trip.", "재미있는 곳 같아. 수학여행이 정말 기대돼."]], "qs": [{"n": 1, "q": "다음 대화의 주제로 알맞은 것은?", "o": ["next week’s school trip", "the new space museum", "the woman’s dream job", "the woman’s interest in rockets", "the man’s plan for a school trip"], "a": 0, "ans": "next week’s school trip", "evs": [["W: Did you hear about our school trip next week?", "다음 주 우리 수학여행에 대해 들었어?"], ["M: Yeah, we’re going to the space museum.", "응, 우리 우주 박물관에 가잖아."]], "ev": ["W: Did you hear about our school trip next week?", "다음 주 우리 수학여행에 대해 들었어?"], "memo": ["W: Did you hear about our school trip next week?  (다음 주 우리 수학여행에 대해 들었어?)", "M: Yeah, we’re going to the space museum.  (응, 우리 우주 박물관에 가잖아.)"]}]}, {"dlg": [["M", "The movie Secret Island 2 is finally coming out this weekend.", "영화 'Secret Island 2'가 드디어 이번 주말에 개봉해."], ["W", "Yeah, I know. Secret Island 1 was so exciting.", "응, 알아. 'Secret Island 1'은 정말 신났어."], ["M", "Right. I’m going to watch Secret Island 2 with my sister this Saturday. I’m really looking forward to it.", "맞아. 나는 이번 토요일에 여동생이랑 'Secret Island 2'를 볼 거야. 정말 기대돼."], ["W", "Sounds great. Enjoy the movie!", "좋겠다. 영화 재미있게 봐!"]], "qs": [{"n": 2, "q": "위 대화의 내용과 일치하지 않는 것은?", "o": ["The movie Secret Island 2 is going to be released this coming weekend.", "The woman has already watched the movie Secret Island 1.", "The man agrees with the woman’s review of the movie.", "The man is planning to watch Secret Island 2 on a weekday.", "The woman thinks the man’s plan to watch the movie with his sister is grea
