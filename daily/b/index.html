,["The judge will [[determine the winner]].","심판이 [[우승자를 결정할]] 것이다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"abound","a":"2","e":"② lack: 부족하다, 없다 (여름 동안 이 시장에는 신선한 과일과 채소가 아주 많다.) / abound(풍부하다, 많이 있다)의 반의어.","w":"① ripen: 익다, 여물다\n③ spoil: 상하다, 못 쓰게 되다\n④ overflow: 넘치다","k":"여름 동안 이 시장에는 신선한 과일과 채소가 아주 많다.","m":0,"s":"Fresh fruit and vegetables abound in this market during the summer.","h":"abound","c":["ripen","lack","spoil","overflow"],"mn":"풍부하다, 많이 있다","hk":"abound(풍부하다)의 반대편은 lack(부족하다, 없다). overflow(넘치다)는 반대말이 아니라 오답이고, ripen(익다)·spoil(상하다)은 상태 변화.","ex":[["Rabbits [[abound in]] this area.","이 지역에는 토끼가 [[많이 있다]].","abound (동) 풍부하다, 많이 있다"],["Fish [[abound in]] this lake.","이 호수에는 물고기가 [[풍부하다]].","abound (동) 풍부하다, 많이 있다"],["They [[lack clean water]].","그들은 [[깨끗한 물이 부족하다]].","lack (동) 부족하다, 없다"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"tender","a":"2","e":"② tough: 질긴, 단단한 (그 소고기는 너무 연해서 입안에서 거의 녹을 정도였다.) / tender(연한, 부드러운)의 반의어.","w":"① crisp: 바삭한\n③ salty: 짠\n④ juicy: 즙이 많은","k":"그 소고기는 너무 연해서 입안에서 거의 녹을 정도였다.","m":0,"s":"The beef was so tender that it almost melted in my mouth.","h":"tender","c":["crisp","tough","salty","juicy"],"mn":"연한, 부드러운","hk":"tender(연한, 부드러운)의 반대편은 tough(질긴, 단단한). crisp(바삭한)·juicy(즙이 많은)·salty(짠)는 맛과 식감이지만 반대말은 아님.","ex":[["The beef was [[very tender]].","그 소고기는 [[매우 연했다]].","tender (형) 연한, 부드러운"],["Cook it slowly to get [[tender meat]].","[[연한 고기]]를 얻으려면 천천히 요리해라.","tender (형) 연한, 부드러운"],["This steak is [[too tough]] to cut.","이 스테이크는 [[너무 질겨서]] 썰 수 없다.","tough (형) 질긴, 단단한"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"opportunity","a":"4","e":"④ chance: 기회 (그 장학금은 그에게 빈에서 음악을 공부할 좋은 기회를 주었다.) / opportunity(기회, 좋은 기회)의 유의어.","w":"① excuse: 변명, 핑계\n② achievement: 성취, 업적\n③ challenge: 도전","k":"그 장학금은 그에게 빈에서 음악을 공부할 좋은 기회를 주었다.","m":0,"s":"The scholarship gave him a great opportunity to study music in Vienna.","h":"opportunity","c":["excuse","achievement","challenge","chance"],"mn":"기회, 좋은 기회","hk":"opportunity(기회)와 같은 편은 chance(기회). a great opportunity(좋은 기회)가 대표 짝, excuse(변명)·achievement(성취)·challenge(도전)는 다른 뜻.","ex":[["This is [[a great opportunity]] for you.","이것은 너에게 [[좋은 기회]]이다."],["Don't [[miss the opportunity]] to learn.","배울 [[기회를 놓치지]] 마라."],["She had [[the opportunity to]] study abroad.","그녀는 해외에서 공부할 [[기회]]가 있었다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"sight","a":"3,4","e":"③ eyesight: 시력 (그녀의 시력은 그 사고 이후 훨씬 나빠졌다.) / sight(시력, 시야)의 유의어.\n④ vision: 시력","w":"① hearing: 청력\n② smell: 후각","k":"그녀의 시력은 그 사고 이후 훨씬 나빠졌다.","m":2,"s":"Her sight became much weaker after the accident.","h":"sight","c":["hearing","smell","eyesight","vision"],"mn":"시력, 시야","hk":"sight(시력)와 같은 편은 eyesight(시력)와 vision(시력). hearing(청력)·smell(후각)은 다른 감각.","ex":[["He [[lost his sight]] after the accident.","그는 사고 후 [[시력을 잃었다]]."],["Eagles have [[sharp sight]].","독수리는 [[예리한 시력]]을 가졌다."],["Her [[sight is poor]], so she wears glasses.","그녀는 [[시력이 나빠서]] 안경을 쓴다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"tunnel","a":"tunnel","e":"tunnel 터널","k":"기차는 산 아래를 지나는 길고 어두운 굴로 천천히 들어갔다.","m":0,"s":"The train slowly entered the long dark t______ under the mountain.","mn":"터널","hk":"tunnel(터널)은 가운데 n이 두 개 겹치고 끝은 -el. n을 하나만 쓰는 실수 주의.","ex":[["The bus drove through [[a long tunnel]].","버스는 [[긴 터널]]을 지나갔다."],["Cars slowed down at [[the tunnel entrance]].","차들은 [[터널 입구]]에서 속도를 줄였다."],["A train came out of [[the tunnel]].","기차 한 대가 [[터널]]에서 나왔다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"celebrity","a":"celebrity","e":"celebrity 유명 인사, 연예인","k":"수천 명의 팬들이 그 유명 인사를 보려고 호텔 밖에서 기다렸다.","m":0,"s":"Thousands of fans waited outside the hotel just to see the famous c______.","mn":"유명 인사, 연예인","hk":"celebrity(유명 인사)는 끝이 -ity. celebrate(축하하다)의 -ate와 섞지 않고 중간 br-i 순서까지 확인.","ex":[["He met [[a famous celebrity]] at the airport.","그는 공항에서 [[유명 인사]]를 만났다."],["Many [[celebrities attended]] the party.","많은 [[유명 인사들이 참석했다]]."],["She became [[a celebrity]] overnight.","그녀는 하룻밤에 [[유명 인사]]가 되었다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"picture","a":"4","e":"①사진 / ②사진 / ③사진 / ④(전반적인) 상황, 모습 [④번만 의미가 다름]","k":"①그 사고 사진이 신문에 실렸다.\n②그는 언덕 꼭대기에서 일몰 사진을 찍었다.\n③그녀는 지갑에 가족의 오래된 사진을 간직하고 있다.\n④이 숫자들은 우리에게 그 나라 경제의 분명한 모습을 보여 준다.","m":0,"c":["The picture of the accident appeared in the newspaper.","He took a picture of the sunset from the top of the hill.","She keeps an old picture of her family in her wallet.","These numbers give us a clear picture of the country's economy."],"hc":"picture|picture|picture|picture","mn":"사진 / (전반적인) 상황, 모습","hk":"picture(사진)는 ①②③에서 '사진'이고 ④만 '(전반적인) 상황, 모습'. a clear picture of(분명한 모습)가 다른 뜻의 대표 짝.","ex":[["He took [[a picture]] of the sunset.","그는 일몰 [[사진을 찍었다]].","picture (명) 사진"],["I hung [[a family picture]] on the wall.","나는 벽에 [[가족 사진]]을 걸었다.","picture (명) 사진"],["The report gives [[a clear picture of]] the problem.","그 보고서는 문제의 [[분명한 모습]]을 보여 준다.","picture (명) (전반적인) 상황, 모습"]]}]},{"day":33,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"soul","a":"2","e":"② soul: 영혼, 마음","w":"① angel: 천사\n③ ghost: 유령\n④ demon: 악마","m":0,"s":"\"영혼, 마음\"","c":["angel","soul","ghost","demon"],"mn":"영혼, 마음","hk":"soul(영혼, 마음)은 몸 안의 내면. angel(천사)·ghost(유령)·demon(악마)은 존재 자체를 가리켜 구분.","ex":[["She sings with [[heart and soul]].","그녀는 [[온 마음을 다해]] 노래한다."],["He has [[a kind soul]].","그는 [[착한 마음씨]]를 가졌다."],["Music feeds [[the soul]].","음악은 [[영혼]]을 풍요롭게 한다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"absolute","a":"3","e":"③ swift (형) 빠른, 신속한 - swiftly (부) 빠르게, 신속하게","w":"① peace (명) 평화 - peacefully (부) 평화롭게\n② pain (명) 고통, 아픔 - painfully (부) 고통스럽게\n④ wonder (명) 경이, 놀라움 - wonderfully (부) 놀랍도록, 훌륭하게","m":0,"s":"absolute - absolutely","c":["peace - peacefully","pain - painfully","swift - swiftly","wonder - wonderfully"],"hk":"absolute(절대적인)-absolutely(절대적으로)는 형용사에서 부사. swift(빠른)-swiftly(빠르게)도 같은 방향, 나머지는 명사에서 부사라 속임수.","ex":[["I have [[absolute trust]] in you.","나는 너에 대한 [[절대적인 신뢰]]가 있다.","absolute (형) 절대적인"],["That is [[absolutely true]].","그것은 [[전적으로 사실이다]].","absolutely (부) 절대적으로, 전적으로"],["She made [[a swift decision]].","그녀는 [[빠른 결정]]을 내렸다.","swift (형) 빠른, 신속한"],["He [[moved swiftly]] through the crowd.","그는 군중 사이로 [[재빠르게 움직였다]].","swiftly (부) 빠르게, 신속하게"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"relief","a":"4","e":"④ relief: 안도, 안심","w":"① regret: 후회\n② sympathy: 동정, 연민\n③ burden: 부담, 짐","m":0,"s":"relief","c":["후회","동정, 연민","부담, 짐","안도, 안심"],"mn":"안도, 안심","hk":"relief(안도, 안심)는 걱정이 사라질 때의 마음. regret(후회)·sympathy(동정)·burden(부담)과 구분하고, a sigh of relief(안도의 한숨)로 기억.","ex":[["She sighed with [[relief]].","그녀는 [[안도]]하며 한숨을 쉬었다."],["It was [[a great relief]] to hear the news.","그 소식을 들으니 [[큰 안도]]가 되었다."],["Everyone let out [[a sigh of relief]].","모두 [[안도의 한숨]]을 내쉬었다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"mean","a":"mean","e":"mean (동) 의미하다, 뜻하다 / (형) 못된, 심술궂은","k":"어떤 문화권에서는 흰 꽃 선물이 아주 슬픈 것을 의미할 수도 있다.\n친구의 망가진 자전거를 보고 비웃다니 그는 참 못됐다.","m":0,"s":"In some cultures, a gift of white flowers can m______ something very sad.\nIt was m______ of him to laugh at his friend's broken bicycle.","mn":"의미하다, 뜻하다 / 못된, 심술궂은","hk":"mean(의미하다, 동사 / 못된, 형용사)은 같은 철자의 두 뜻. 동사는 What does it mean(그게 무슨 뜻이야), 형용사는 be mean to(못되게 굴다).","ex":[["What does this word [[mean]]?","이 단어는 무슨 [[뜻이니]]?","mean (동) 의미하다, 뜻하다"],["A red light [[means stop]].","빨간불은 [[정지를 뜻한다]].","mean (동) 의미하다, 뜻하다"],["Don't be [[mean to]] your little brother.","남동생에게 [[못되게 굴지]] 마라.","mean (형) 못된, 심술궂은"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"pill","a":"1","e":"① pill: (작고 둥글거나 타원형인 약 한 알 / 당신이 통째로 삼키는) 알약 (통째로 삼키는 작고 둥글거나 타원형인 약)","w":"② syrup: 물약, 시럽\n③ dose: (약의) 복용량\n④ powder: 가루약, 분말","k":"작고 둥글거나 타원형인 약 한 알 / 당신이 통째로 삼키는","m":0,"s":"\"a small round or oval piece of medicine that you swallow whole\"","c":["pill","syrup","dose","powder"],"mn":"알약 (통째로 삼키는 작고 둥글거나 타원형인 약)","hk":"pill(알약)은 통째로 삼키는 작은 약. syrup(시럽)은 물약, powder(가루약)는 가루, dose(복용량)는 약의 양이라 구분.","ex":[["Take [[one pill]] after meals.","식후에 [[알약 한 알]]을 먹어라."],["She swallowed [[a small pill]].","그녀는 [[작은 알약]] 하나를 삼켰다."],["This [[sleeping pill]] makes me sleepy.","이 [[수면제]]는 나를 졸리게 한다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"script","a":"4","e":"④ script: (글로 쓰인 대본 / 연극, 영화, 또는 텔레비전 프로그램의) 대본, 각본 (연극·영화·텔레비전 프로그램의 글로 쓰인 원고)","w":"① diary: 일기\n② essay: 수필, 에세이\n③ poem: 시","k":"글로 쓰인 대본 / 연극, 영화, 또는 텔레비전 프로그램의","m":0,"s":"\"the written text of a play, a film, or a television program\"","c":["diary","essay","poem","script"],"mn":"대본, 각본 (연극·영화·텔레비전 프로그램의 글로 쓰인 원고)","hk":"script(대본, 각본)는 연극·영화·방송의 글로 쓴 원고. diary(일기)·essay(수필)·poem(시)은 글이지만 공연용이 아님.","ex":[["The actor learned [[the script]] by heart.","그 배우는 [[대본]]을 외웠다."],["She wrote [[a film script]].","그녀는 [[영화 대본]]을 썼다."],["The writer is working on [[a TV script]].","그 작가는 [[TV 대본]]을 쓰는 중이다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"nod","a":"4","e":"④ nod: (고개의) 끄덕임 (그녀는 그 계획에 동의한다는 것을 보이려고 고개를 살짝 끄덕였다.)","w":"① yawn: 하품\n② blink: 눈 깜빡임\n③ grin: 활짝 웃음","k":"그녀는 그 계획에 동의한다는 것을 보이려고 고개를 살짝 끄덕였다.","m":0,"s":"She gave a slight ________ to show that she agreed with the plan.","c":["yawn","blink","grin","nod"],"mn":"(고개의) 끄덕임","hk":"nod(끄덕임)는 give a nod(고개를 끄덕이다)가 대표 짝. yawn(하품)·blink(눈 깜빡임)·grin(활짝 웃음)은 동의를 보이는 동작이 아님.","ex":[["She gave [[a small nod]].","그녀는 [[작게 고개를 끄덕였다]]."],["He answered [[with a nod]].","그는 [[고개를 끄덕이며]] 대답했다."],["The teacher gave me [[a nod of approval]].","선생님은 나에게 [[찬성의 끄덕임]]을 보냈다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"heal","a":"2","e":"② heal: (상처가) 낫다, 아물다 (의사는 그의 팔에 난 깊은 상처가 2주 안에 완전히 나을 것이라고 말했다.)","w":"① bleed: 피가 나다\n③ ache: 아프다, 쑤시다\n④ infect: 감염시키다","k":"의사는 그의 팔에 난 깊은 상처가 2주 안에 완전히 나을 것이라고 말했다.","m":0,"s":"The doctor said the deep cut on his arm would ________ completely within two weeks.","c":["bleed","heal","ache","infect"],"mn":"(상처가) 낫다, 아물다","hk":"heal(낫다)은 heal a wound(상처를 아물게 하다)가 대표 짝. bleed(피가 나다)·ache(아프다)·infect(감염시키다)는 낫는 것과 반대 흐름.","ex":[["The cut will [[heal soon]].","베인 상처는 곧 [[나을]] 것이다."],["Time can [[heal a broken heart]].","시간이 [[상처받은 마음을 치유할]] 수 있다."],["His broken leg [[healed slowly]].","그의 부러진 다리는 [[천천히 나았다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"swallow","a":"4","e":"④ spit: 뱉다 (그는 물 없이 그 큰 알약을 삼키는 것이 힘들다는 것을 알았다.) / swallow(삼키다)의 반의어.","w":"① sip: 홀짝이다, 조금씩 마시다\n② bite: 물다, 깨물다\n③ chew: 씹다","k":"그는 물 없이 그 큰 알약을 삼키는 것이 힘들다는 것을 알았다.","m":0,"s":"He found it hard to swallow the large tablet without any water.","h":"swallow","c":["sip","bite","chew","spit"],"mn":"삼키다","hk":"swallow(삼키다)의 반대편은 spit(뱉다). chew(씹다)·bite(깨물다)·sip(홀짝이다)은 삼키기 전 동작이라 반대말이 아님.","ex":[["Drink water to [[swallow the pill]].","알약을 [[삼키려면]] 물을 마셔라.","swallow (동) 삼키다"],["It hurts to [[swallow food]].","음식을 [[삼키면]] 아프다.","swallow (동) 삼키다"],["Please don't [[spit on]] the floor.","바닥에 [[침을 뱉지]] 마라.","spit (동) 뱉다"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"wise","a":"2,3","e":"② silly: 어리석은, 바보 같은 (한 달 더 일찍 항공권을 예약한 것은 현명한 결정이었다.) / wise(현명한, 지혜로운)의 반의어.\n③ foolish: 어리석은","w":"① shy: 수줍은\n④ brilliant: 뛰어난, 훌륭한","k":"한 달 더 일찍 항공권을 예약한 것은 현명한 결정이었다.","m":2,"s":"It was a wise decision to book the flight tickets a month earlier.","h":"wise","c":["shy","silly","foolish","brilliant"],"mn":"현명한, 지혜로운","hk":"wise(현명한)의 반대편은 silly(어리석은)와 foolish(어리석은). brilliant(뛰어난)는 같은 편이고, shy(수줍은)는 성격 단어라 속임수.","ex":[["She made [[a wise choice]].","그녀는 [[현명한 선택]]을 했다.","wise (형) 현명한, 지혜로운"],["It was [[a silly mistake]].","그것은 [[어리석은 실수]]였다.","silly (형) 어리석은, 바보 같은"],["Only [[a foolish person]] would do that.","[[어리석은 사람]]만이 그런 일을 할 것이다.","foolish (형) 어리석은"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"jail","a":"2","e":"② imprison: 투옥하다, 수감하다 (법원은 그 남자를 5년 동안 감옥에 가두기로 결정했다.) / jail(수감하다, 감옥에 가두다)의 유의어.","w":"① convict: 유죄를 선고하다\n③ arrest: 체포하다\n④ pardon: 사면하다, 용서하다","k":"법원은 그 남자를 5년 동안 감옥에 가두기로 결정했다.","m":0,"s":"The court decided to jail the man for five years.","h":"jail","c":["convict","imprison","arrest","pardon"],"mn":"수감하다, 감옥에 가두다","hk":"jail(감옥에 가두다)과 같은 편은 imprison(투옥하다). convict(유죄를 선고하다)·arrest(체포하다)·pardon(사면하다)은 재판과 체포 단계의 말.","ex":[["The judge decided to [[jail him]].","판사는 [[그를 수감하기로]] 결정했다."],["He was [[jailed for]] two years.","그는 2년간 [[수감되었다]]."],["They [[jailed the thief]].","그들은 [[그 도둑을 감옥에 가뒀다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"association","a":"3","e":"③ organization: 단체, 조직 (그녀는 지난봄에 젊은 농부들의 지역 단체에 가입했다.) / association(협회, 단체)의 유의어.","w":"① ceremony: 의식, 식\n② contract: 계약, 계약서\n④ festival: 축제, 기념행사","k":"그녀는 지난봄에 젊은 농부들의 지역 단체에 가입했다.","m":0,"s":"She joined a local association of young farmers last spring.","h":"association","c":["ceremony","contract","organization","festival"],"mn":"협회, 단체","hk":"association(협회, 단체)과 같은 편은 organization(단체, 조직). ceremony(의식)·contract(계약)·festival(축제)은 모임이 아니라 행사나 문서.","ex":[["He is a member of [[the sports association]].","그는 [[체육 협회]]의 회원이다."],["She works for [[the teachers' association]].","그녀는 [[교사 협회]]에서 일한다."],["They [[formed an association]] of local shop owners.","그들은 지역 상점 주인들의 [[협회를 만들었다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"symphony","a":"symphony","e":"symphony 교향곡","k":"그 오케스트라는 저녁 연주회를 마무리하기 위해 베토벤의 5번 교향곡을 연주했다.","m":0,"s":"The orchestra played Beethoven's fifth s______ to close the evening concert.","mn":"교향곡","hk":"symphony(교향곡)는 f 소리를 ph로 씀. phone(전화기)과 같은 ph이고, 끝은 -ony.","ex":[["She plays in [[a symphony orchestra]].","그녀는 [[교향악단]]에서 연주한다."],["We heard [[Beethoven's Fifth Symphony]].","우리는 [[베토벤의 5번 교향곡]]을 들었다."],["The composer wrote [[a new symphony]].","작곡가는 [[새 교향곡]]을 썼다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"accent","a":"accent","e":"accent 억양, 악센트","k":"그녀의 강한 억양을 통해 그녀가 부산에서 자랐다는 것을 알 수 있다.","m":0,"s":"You can tell that she grew up in Busan from her strong a______.","mn":"억양, 악센트","hk":"accent(억양, 악센트)는 가운데 c가 두 개(cc). 끝은 -ent.","ex":[["He has [[a strong accent]].","그는 [[강한 억양]]을 가졌다."],["She speaks with [[a British accent]].","그녀는 [[영국식 억양]]으로 말한다."],["I like [[her French accent]].","나는 [[그녀의 프랑스식 억양]]이 좋다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"bar","a":"4","e":"①쇠막대, 창살 / ②막대, 봉(철봉) / ③막대기, 봉 / ④술집, 바 [④번만 의미가 다름]","k":"①그 죄수는 감방 창문의 차가운 쇠창살을 움켜쥐었다.\n②그 체조 선수는 철봉을 쉽게 돌았다.\n③두꺼운 강철 봉이 그 오래된 건물의 지붕을 떠받치고 있다.\n④그들은 역 근처의 조용한 술집에서 만나기로 했다.","m":0,"c":["The prisoner gripped the cold iron bar of his cell window.","The gymnast swung around the high bar with ease.","A thick steel bar holds up the roof of the old building.","They agreed to meet at a quiet bar near the station."],"hc":"bar|bar|bar|bar","mn":"쇠막대, 창살 / 술집, 바","hk":"bar(막대)는 ①②③에서 '막대, 창살'이고 ④만 '술집, 바'. iron bar(쇠막대)처럼 길쭉한 물건이 기본, 사람이 모이는 장소는 다른 뜻.","ex":[["The window has [[iron bars]].","창문에는 [[쇠창살]]이 있다.","bar (명) 막대, 창살"],["The builders used [[a steel bar]].","건축업자들은 [[강철 막대]]를 사용했다.","bar (명) 막대, 창살"],["They met at [[a quiet bar]].","그들은 [[조용한 술집]]에서 만났다.","bar (명) 술집, 바"]]}]},{"day":34,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"surround","a":"1,4","e":"① enclose: 둘러싸다, 에워싸다\n④ encircle: 에워싸다, 두르다 (높은 돌담이 그 오래된 궁전을 사방에서 둘러싸고 있다.) / surround(둘러싸다, 에워싸다)의 유의어.","w":"② detach: 분리하다, 떼어 내다\n③ disperse: 흩어지다, 해산시키다","k":"높은 돌담이 그 오래된 궁전을 사방에서 둘러싸고 있다.","m":2,"s":"Tall stone walls surround the old palace on all four sides.","h":"surround","c":["enclose","detach","disperse","encircle"],"mn":"둘러싸다, 에워싸다","hk":"surround(둘러싸다)와 같은 편은 enclose(둘러싸다)와 encircle(에워싸다). detach(분리하다)·disperse(흩어지다)는 반대 방향.","ex":[["Mountains [[surround the town]].","산들이 [[그 마을을 둘러싸고]] 있다."],["Fans [[surrounded the singer]].","팬들이 [[그 가수를 에워쌌다]]."],["Water [[surrounds the castle]].","물이 [[그 성을 둘러싸고]] 있다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"cliff","a":"4","e":"④ cliff: 벼랑, 절벽","w":"① 빙하(glacier)\n② 협곡(canyon)\n③ 늪(swamp)","m":0,"s":"cliff","c":["빙하","협곡","늪","절벽"],"mn":"벼랑, 절벽","hk":"cliff(벼랑, 절벽)는 바다나 산의 가파른 낭떠러지. glacier(빙하)·canyon(협곡)·swamp(늪)와 지형끼리 구분.","ex":[["We stood at [[the edge of the cliff]].","우리는 [[절벽 끝]]에 서 있었다."],["A bird built a nest on [[a high cliff]].","새가 [[높은 절벽]]에 둥지를 지었다."],["The car fell [[off a cliff]].","차가 [[절벽 아래로]] 떨어졌다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"commute","a":"1","e":"① commute: 통근하다, 출퇴근하다 (수천 명의 사무직 노동자들이 매일 아침 지하철로 도심으로 통근한다.)","w":"② migrate: 이주하다, 이동하다\n③ relocate: (근무지·거주지를) 옮기다\n④ navigate: 길을 찾다, 항해하다","k":"수천 명의 사무직 노동자들이 매일 아침 지하철로 도심으로 통근한다.","m":0,"s":"Thousands of office workers ________ into the city center by subway every morning.","c":["commute","migrate","relocate","navigate"],"mn":"통근하다, 출퇴근하다","hk":"commute(통근하다)는 매일 오가는 것이고 대표 짝은 commute to work(출근하다). migrate(이주하다)·relocate(옮기다)는 한 번의 이동.","ex":[["Many people [[commute to work]] by bus.","많은 사람들이 버스로 [[출근한다]]."],["He [[commutes]] two hours every day.","그는 매일 두 시간씩 [[통근한다]]."],["She [[commutes from]] Cheongju to Seoul.","그녀는 청주에서 서울까지 [[통근한다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"interact","a":"4","e":"interact (동) 상호작용하다 - interaction (명) 상호작용\n④ invest (동) 투자하다 - investment (명) 투자","w":"① lazy (형) 게으른 - laziness (명) 게으름\n② anonymous (형) 익명의 - anonymity (명) 익명성\n③ credible (형) 믿을 만한 - credibility (명) 신뢰성","m":0,"s":"interact - interaction","c":["lazy - laziness","anonymous - anonymity","credible - credibility","invest - investment"],"mn":"상호작용하다","hk":"interact(상호작용하다)-interaction(상호작용)은 동사에서 명사. invest(투자하다)-investment(투자)도 같은 방향, 나머지는 형용사에서 명사.","ex":[["Kids [[interact with]] their friends at school.","아이들은 학교에서 친구들과 [[상호작용한다]].","interact (동) 상호작용하다"],["[[Social interaction]] is important for children.","[[사회적 상호작용]]은 아이들에게 중요하다.","interaction (명) 상호작용"],["They [[invest in]] new technology.","그들은 새 기술에 [[투자한다]].","invest (동) 투자하다"],["Education is [[a good investment]].","교육은 [[좋은 투자]]이다.","investment (명) 투자"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"detective","a":"3","e":"③ detective: (경찰관 / 범죄에 관한 정보를 알아내고 / 누가 그것을 저질렀는지 밝혀내는 것이 직업인) 형사, 탐정 (범죄에 관한 정보를 알아내고 누가 그것을 저질렀는지 밝혀내는 일을 하는 경찰관)","w":"① bodyguard: 경호원\n② prosecutor: 검사\n④ burglar: 절도범, 빈집털이범","k":"경찰관 / 범죄에 관한 정보를 알아내고 / 누가 그것을 저질렀는지 밝혀내는 것이 직업인","m":0,"s":"\"a police officer whose job is to find out information about crimes and discover who committed them\"","c":["bodyguard","prosecutor","detective","burglar"],"mn":"형사, 탐정 (범죄에 관한 정보를 알아내고 누가 그것을 저질렀는지 밝혀내는 일을 하는 경찰관)","hk":"detective(형사, 탐정)는 범죄를 조사해 범인을 밝히는 경찰관. bodyguard(경호원)는 보호, prosecutor(검사)는 기소, burglar(절도범)는 범죄자.","ex":[["The detective [[solved the case]].","형사가 [[사건을 해결했다]]."],["He hired [[a private detective]] to find his dog.","그는 개를 찾으려고 [[사립 탐정]]을 고용했다."],["My brother loves [[detective stories]].","내 남동생은 [[탐정 소설]]을 아주 좋아한다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"escalator","a":"escalator","e":"escalator 에스컬레이터","k":"그 자동 계단은 지친 쇼핑객들을 백화점 2층으로 천천히 실어 올렸다.","m":0,"s":"The e______ carried tired shoppers slowly up to the second floor of the department store.","mn":"에스컬레이터","hk":"escalator(에스컬레이터)는 sc가 붙어 있고 끝은 -ator. elevator(엘리베이터)와 철자를 섞지 않기.","ex":[["We [[rode the escalator]] down.","우리는 [[에스컬레이터를 타고]] 내려갔다."],["Take [[the escalator]] to the second floor.","[[에스컬레이터]]를 타고 2층으로 가라."],["Today [[the escalator is broken]].","오늘은 [[에스컬레이터가 고장 났다] ]를 주었다."],["Write the address on [[the envelope]].","[[봉투]]에 주소를 써라."],["Please [[seal the envelope]].","[[봉투를 붙여]] 주세요."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"quote","a":"2","e":"② cite: 인용하다 (에세이에서 원저자의 말을 빌릴 때마다 너는 그를 인용해야 한다.) / quote(인용하다)의 유의어.","w":"① annotate: 주석을 달다\n③ paraphrase: 바꾸어 표현하다\n④ revise: 수정하다, 고쳐 쓰다","k":"에세이에서 원저자의 말을 빌릴 때마다 너는 그를 인용해야 한다.","m":0,"s":"In your essay you must quote the original writer whenever you borrow his words.","h":"quote","c":["annotate","cite","paraphrase","revise"],"mn":"인용하다","hk":"quote(인용하다)와 같은 편은 cite(인용하다). paraphrase(바꾸어 표현하다)는 원문 그대로가 아니라 오답, annotate(주석을 달다)·revise(수정하다)도 다른 뜻.","ex":[["He [[quoted a poem]] in his speech.","그는 연설에서 [[시 한 편을 인용했다]]."],["Please [[quote the author]] in your essay.","에세이에서 [[저자를 인용해]] 주세요."],["She [[quoted from]] her favorite book.","그녀는 좋아하는 책에서 [[인용했다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"bury","a":"4","e":"④ bury: 묻다, 매장하다 (우리 개는 다른 개가 찾지 못하도록 좋아하는 뼈다귀를 나무 아래에 묻는 것을 좋아한다.)","w":"① gnaw: 갉아먹다\n② nibble: 조금씩 갉아 먹다\n③ dig: 파다","k":"우리 개는 다른 개가 찾지 못하도록 좋아하는 뼈다귀를 나무 아래에 묻는 것을 좋아한다.","m":0,"s":"Our dog likes to ________ his favorite bones under the tree so that no other dog can find them.","c":["gnaw","nibble","dig","bury"],"mn":"묻다, 매장하다","hk":"bury(묻다)는 땅속에 넣고 덮는 것. dig(파다)는 구덩이를 파는 데까지, gnaw(갉아먹다)·nibble(조금씩 갉아 먹다)은 먹는 동작.","ex":[["Dogs often [[bury bones]].","개들은 종종 [[뼈를 묻는다]]."],["They [[buried the treasure]] on the island.","그들은 섬에 [[보물을 묻었다]]."],["The farmer [[buried the seeds]] in the soil.","농부는 흙에 [[씨앗을 묻었다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"predator","a":"1","e":"① prey: 먹이, 사냥감 (늑대는 이 숲에서 최상위 포식자이고, 그것으로부터 안전한 동물은 거의 없다.) / predator(포식자, 잡아먹는 동물)의 반의어.","w":"② carnivore: 육식동물\n③ herbivore: 초식동물\n④ hunter: 사냥꾼","k":"늑대는 이 숲에서 최상위 포식자이고, 그것으로부터 안전한 동물은 거의 없다.","m":0,"s":"The wolf is the top predator in this forest, and few animals are safe from it.","h":"predator","c":["prey","carnivore","herbivore","hunter"],"mn":"포식자, 잡아먹는 동물","hk":"predator(포식자)의 반대편은 prey(먹이, 사냥감). carnivore(육식동물)·hunter(사냥꾼)는 같은 편이고, herbivore(초식동물)는 먹는 음식으로 가르는 말.","ex":[["A lion is [[a top predator]].","사자는 [[최상위 포식자]]이다.","predator (명) 포식자, 잡아먹는 동물"],["Small fish hide from [[predators]].","작은 물고기는 [[포식자]]를 피해 숨는다.","predator (명) 포식자, 잡아먹는 동물"],["Small animals are [[easy prey]].","작은 동물은 [[쉬운 먹잇감]]이다.","prey (명) 먹이, 사냥감"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"souvenir","a":"3","e":"③ souvenir: (물건 / 당신이 사거나 간직하는 / 당신이 가 본 장소를 기억하기 위해) 기념품 (방문했던 장소를 기억하기 위해 사거나 간직하는 물건)","w":"① brochure: 안내 책자\n② baggage: 수하물, 짐\n④ guidebook: 관광 안내서","k":"물건 / 당신이 사거나 간직하는 / 당신이 가 본 장소를 기억하기 위해","m":0,"s":"\"an object that you buy or keep in order to remember a place you have visited\"","c":["brochure","baggage","souvenir","guidebook"],"mn":"기념품 (방문했던 장소를 기억하기 위해 사거나 간직하는 물건)","hk":"souvenir(기념품)는 여행한 장소를 기억하려고 사거나 간직하는 물건. brochure(안내 책자)·guidebook(관광 안내서)은 정보용, baggage(수하물)는 짐.","ex":[["I bought [[a souvenir]] for my mom.","나는 엄마를 위해 [[기념품]]을 샀다."],["This [[souvenir shop]] sells small dolls.","이 [[기념품 가게]]에서는 작은 인형을 판다."],["She brought home [[a souvenir from Paris]].","그녀는 집에 [[파리 기념품]]을 가져왔다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"passport","a":"passport","e":"passport 여권","k":"국제선 항공기에 탑승하기 전에 탑승구에서 여권을 제시해야 한다.","m":0,"s":"You must show your p______ at the gate before boarding an international flight.","mn":"여권","hk":"passport(여권)는 pass(통과하다)와 port(항구)가 합쳐진 말. pass의 s가 두 개인 것을 함께 확인.","ex":[["Don't forget to bring [[your passport]].","[[여권]]을 가져오는 것을 잊지 마라."],["I need to [[renew my passport]].","나는 [[여권을 갱신해야]] 한다."],["He lost [[his passport]] on the trip.","그는 여행 중 [[여권]]을 잃어버렸다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"sense","a":"2","e":"①감각 / ②의미, 이치 / ③감각 / ④감각 [②번만 의미가 다름]","k":"①그 시각 장애인은 매우 예민한 청각을 발달시켰다.\n②너의 긴 설명은 나에게 전혀 말이 되지 않는다.\n③그녀의 균형 감각은 몇 달간의 힘든 훈련 후에 향상되었다.\n④개들은 뛰어난 후각으로 잘 알려져 있다.","m":0,"c":["The blind man developed a very sharp sense of hearing.","Your long explanation does not make any sense to me.","Her sense of balance improved after months of hard training.","Dogs are well known for their excellent sense of smell."],"hc":"sense|sense|sense|sense","mn":"감각 / 의미, 이치","hk":"sense(감각)는 ①③④에서 '감각', 예: sense of smell(후각). ②만 make sense(말이 되다)의 '의미, 이치'.","ex":[["Dogs have [[a good sense of smell]].","개는 [[뛰어난 후각]]을 가지고 있다.","sense (명) 감각"],["She has [[a sense of humor]].","그녀는 [[유머 감각]]이 있다.","sense (명) 감각"],["That story does not [[make sense]].","그 이야기는 [[말이 되지 않는다]].","sense (명) 의미, 이치"]]}]},{"day":35,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"curator","a":"1","e":"① curator: (박물관에 있는 소장품을 관리하는 사람 / 그리고 그것들이 어떻게 전시될지 결정하는) 큐레이터, 전시 담당자 (박물관의 소장품을 관리하고 그것들을 어떻게 전시할지 결정하는 사람)","w":"② sculptor: 조각가\n③ collector: 수집가\n④ photographer: 사진작가","k":"박물관에 있는 소장품을 관리하는 사람 / 그리고 그것들이 어떻게 전시될지 결정하는","m":0,"s":"\"a person who takes care of the objects in a museum and decides how they are displayed\"","c":["curator","sculptor","collector","photographer"],"mn":"큐레이터, 전시 담당자 (박물관의 소장품을 관리하고 그것들을 어떻게 전시할지 결정하는 사람)","hk":"curator(큐레이터)는 박물관 소장품을 관리하고 전시를 정하는 사람. sculptor(조각가)·photographer(사진작가)는 작품을 만들고, collector(수집가)는 모으는 사람.","ex":[["She works as [[a museum curator]].","그녀는 [[박물관 큐레이터]]로 일한다."],["[[The curator]] chose the paintings for the show.","[[큐레이터]]가 전시할 그림을 골랐다."],["He is [[an art curator]].","그는 [[미술 큐레이터]]이다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"liberal","a":"4","e":"④ conservative: 보수적인 (그 젊은 시장은 교육과 가정생활에 대해 놀라울 만큼 진보적인 견해를 가지고 있다.) / liberal(진보적인, 개방적인)의 반의어.","w":"① neutral: 중립적인\n② radical: 급진적인\n③ progressive: 진보적인","k":"그 젊은 시장은 교육과 가정생활에 대해 놀라울 만큼 진보적인 견해를 가지고 있다.","m":0,"s":"The young mayor holds surprisingly liberal views on education and family life.","h":"liberal","c":["neutral","radical","progressive","conservative"],"mn":"진보적인, 개방적인","hk":"liberal(진보적인)의 반대편은 conservative(보수적인). progressive(진보적인)는 같은 편, radical(급진적인)·neutral(중립적인)은 다른 입장.","ex":[["He has [[liberal views]].","그는 [[진보적인 견해]]를 가지고 있다.","liberal (형) 진보적인, 개방적인"],["She grew up in [[a liberal family]].","그녀는 [[개방적인 가정]]에서 자랐다.","liberal (형) 진보적인, 개방적인"],["My grandfather is [[very conservative]].","우리 할아버지는 [[매우 보수적이시다]].","conservative (형) 보수적인"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"microwave","a":"microwave","e":"microwave 전자레인지","k":"그녀는 식은 피자 한 조각을 전자레인지에 넣고 1분간 데웠다.","m":0,"s":"She put the cold slice of pizza into the m______ and heated it for one minute.","mn":"전자레인지","hk":"microwave(전자레인지)는 micro(아주 작은)와 wave(파장)가 합쳐진 말. 끝의 wave에 e가 붙는 철자 확인.","ex":[["Heat the soup in [[the microwave]].","수프를 [[전자레인지]]에 데워라."],["She cooked rice in [[a microwave oven]].","그녀는 [[전자레인지]]에서 밥을 지었다."],["Your food is [[in the microwave]].","네 음식은 [[전자레인지 안에]] 있다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"wrist","a":"3","e":"③ wrist: 손목","w":"① heel: 뒤꿈치, (신발의) 굽\n② waist: 허리\n④ ankle: 발목","m":0,"s":"\"손목\"","c":["heel","waist","wrist","ankle"],"mn":"손목","hk":"wrist(손목)는 손과 팔 사이 관절. waist(허리)와 철자가 비슷한 쌍이고, ankle(발목)·heel(뒤꿈치)은 발 쪽.","ex":[["He hurt [[his wrist]] while playing tennis.","그는 테니스를 치다가 [[손목]]을 다쳤다."],["She wears a watch on [[her left wrist]].","그녀는 [[왼쪽 손목]]에 시계를 찬다."],["The nurse checked my pulse at [[my wrist]].","간호사는 [[내 손목]]에서 맥박을 쟀다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"enable","a":"3","e":"③ enable: 가능하게 하다 (그 새 학교 앱은 부모들이 집에서 자녀의 성적을 확인할 수 있게 해 줄 것이다.)","w":"① prevent: 막다, 방지하다\n② delay: 미루다, 지연시키다\n④ refuse: 거절하다","k":"그 새 학교 앱은 부모들이 집에서 자녀의 성적을 확인할 수 있게 해 줄 것이다.","m":0,"s":"The new school app will ________ parents to check their children's grades at home.","c":["prevent","delay","enable","refuse"],"mn":"가능하게 하다","hk":"enable(가능하게 하다)은 able(할 수 있는) 앞에 en이 붙어 '할 수 있게 만들다'. 대표 짝은 enable A to B(A가 B하게 해 주다), prevent(막다)는 반대.","ex":[["This tool will [[enable us to]] work faster.","이 도구는 우리가 더 빨리 일[[할 수 있게 해 줄]] 것이다."],["Glasses [[enable him to]] see clearly.","안경은 그가 또렷이 보[[게 해 준다]]."],["The app [[enables students to]] study anywhere.","그 앱은 학생들이 어디서나 공부[[할 수 있게 해 준다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"invent","a":"3","e":"invent (동) 발명하다 - inventive (형) 독창적인, 창의력이 풍부한\n③ renew (동) 갱신하다, 재개하다 - renewable (형) 재생 가능한","w":"① glory (명) 영광, 명예 - glorious (형) 영광스러운\n② ethics (명) 윤리, 도덕 원칙 - ethical (형) 윤리적인\n④ irony (명) 반어법, 아이러니 - ironic (형) 반어적인","m":0,"s":"invent - inventive","c":["glory - glorious","ethics - ethical","renew - renewable","irony - ironic"],"mn":"발명하다","hk":"invent(발명하다)-inventive(독창적인)는 동사에서 형용사. renew(갱신하다)-renewable(재생 가능한)도 같은 방향, 나머지는 명사에서 형용사.","ex":[["He [[invented a new toy]].","그는 [[새 장난감을 발명했다]].","invent (동) 발명하다"],["She is [[an inventive child]].","그녀는 [[독창적인 아이]]이다.","inventive (형) 독창적인, 창의력이 풍부한"],["Please [[renew your library card]].","[[도서관 카드를 갱신해]] 주세요.","renew (동) 갱신하다, 재개하다"],["Wind is [[renewable energy]].","바람은 [[재생 가능한 에너지]]이다.","renewable (형) 재생 가능한"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"incident","a":"1,3","e":"① happening: 사건, 일 (다행히 어젯밤 학교 정문 근처에서 일어난 그 이상한 사건에서 아무도 다치지 않았다.) / incident(사건, 일어난 일)의 유의어.\n③ occurrence: 사건, 발생한 일","w":"② coincidence: 우연의 일치\n④ phenomenon: 현상","k":"다행히 어젯밤 학교 정문 근처에서 일어난 그 이상한 사건에서 아무도 다치지 않았다.","m":2,"s":"Luckily nobody was hurt in the strange incident near the school gate last night.","h":"incident","c":["happening","coincidence","occurrence","phenomenon"],"mn":"사건, 일어난 일","hk":"incident(사건)와 같은 편은 happening(사건, 일)과 occurrence(발생한 일). coincidence(우연의 일치)는 철자 비슷한 속임수, phenomenon(현상)은 다른 뜻.","ex":[["Police are investigating [[the incident]].","경찰은 [[그 사건]]을 조사하고 있다."],["It was [[a funny incident]].","그것은 [[웃기는 사건]]이었다."],["[[A sad incident]] happened yesterday.","어제 [[슬픈 사건]]이 일어났다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"jargon","a":"4","e":"④ jargon: 전문 용어, 업계 용어","w":"① 사투리(dialect)\n② 속담(proverb)\n③ 관용구(idiom)","m":0,"s":"jargon","c":["사투리","속담","관용구","전문 용어"],"mn":"전문 용어, 업계 용어","hk":"jargon(전문 용어)은 특정 직업 사람들만 쓰는 말. dialect(사투리)는 지역 말이고, proverb(속담)·idiom(관용구)은 널리 쓰는 표현.","ex":[["Doctors often use [[medical jargon]].","의사들은 종종 [[의학 전문 용어]]를 쓴다."],["I can't follow [[legal jargon]].","나는 [[법률 용어]]를 이해하지 못한다."],["The report is full of [[computer jargon]].","그 보고서는 [[컴퓨터 전문 용어]]로 가득하다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"folk","a":"folk","e":"folk (명) (일반적인) 사람들 / (형) 민속의, 민간의","k":"이 외딴 마을의 시골 사람들은 아직도 서로를 이름으로 안다.\n그 박물관은 그 지역의 전통 민속 노래를 대규모로 소장하고 있다.","m":0,"s":"Country f______ in this remote village still know one another by name.\nThe museum keeps a large collection of traditional f______ songs from that region.","mn":"사람들 / 민속의, 민간의","hk":"folk(사람들, 명사 / 민속의, 형용사)는 같은 철자의 두 뜻. folk song(민요)처럼 뒤에 명사가 붙으면 '민속의'.","ex":[["The village [[folk]] welcomed us.","마을 [[사람들]]이 우리를 환영했다.","folk (명) (일반적인) 사람들"],["They sang [[a folk song]].","그들은 [[민요]]를 불렀다.","folk (형) 민속의, 민간의"],["We watched [[a folk dance]].","우리는 [[민속춤]]을 보았다.","folk (형) 민속의, 민간의"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"curse","a":"1","e":"① bless: 축복하다 (화가 난 그 노인은 자신을 칠 뻔한 운전자를 저주하기 시작했다.) / curse(저주하다)의 반의어.","w":"② condemn: 비난하다, 규탄하다\n③ denounce: 공개적으로 비난하다\n④ mock: 조롱하다","k":"화가 난 그 노인은 자신을 칠 뻔한 운전자를 저주하기 시작했다.","m":0,"s":"The angry old man began to curse the driver who had nearly hit him.","h":"curse","c":["bless","condemn","denounce","mock"],"mn":"저주하다","hk":"curse(저주하다)의 반대편은 bless(축복하다). condemn(비난하다)·denounce(공개적으로 비난하다)·mock(조롱하다)은 같은 쪽의 부정적인 말.","ex":[["He began to [[curse the weather]].","그는 [[날씨를 저주하기]] 시작했다.","curse (동) 저주하다"],["The witch [[cursed the prince]].","마녀는 [[왕자에게 저주를 걸었다]].","curse (동) 저주하다"],["May God [[bless you]].","신이 [[너를 축복하기를]].","bless (동) 축복하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"landfill","a":"1","e":"① landfill: (넓은 땅 / 도시의 쓰레기가 땅속에 묻히는) 쓰레기 매립지 (도시의 쓰레기를 땅속에 묻는 넓은 지역)","w":"② sewer: 하수구, 하수도\n③ reservoir: 저수지\n④ quarry: 채석장","k":"넓은 땅 / 도시의 쓰레기가 땅속에 묻히는","m":0,"s":"\"a large area of land where the waste of a city is buried under the ground\"","c":["landfill","sewer","reservoir","quarry"],"mn":"쓰레기 매립지 (도시의 쓰레기를 땅속에 묻는 넓은 지역)","hk":"landfill(쓰레기 매립지)은 land(땅)와 fill(채우다)이 합쳐진 말. sewer(하수구)·reservoir(저수지)·quarry(채석장)는 쓰임이 다른 시설.","ex":[["Trash goes to [[a landfill]].","쓰레기는 [[매립지]]로 간다."],["The city's [[landfill is full]].","그 도시의 [[매립지가 가득 찼다]]."],["We should reduce waste sent to [[landfills]].","우리는 [[매립지]]로 보내지는 쓰레기를 줄여야 한다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"testify","a":"2","e":"② testify: 증언하다 (두 이웃은 그날 밤 그들이 본 것에 대해 법정에서 증언하기로 동의했다.)","w":"① plead: 항변하다, 탄원하다\n③ appeal: 항소하다\n④ sue: 고소하다","k":"두 이웃은 그날 밤 그들이 본 것에 대해 법정에서 증언하기로 동의했다.","m":0,"s":"Two neighbors agreed to ________ in court about what they had seen that night.","c":["plead","testify","appeal","sue"],"mn":"증언하다","hk":"testify(증언하다)는 testify in court(법정에서 증언하다)가 대표 짝. plead(항변하다)·appeal(항소하다)·sue(고소하다)는 법정 단어지만 본 것을 말하는 일은 아님.","ex":[["He will [[testify in court]] tomorrow.","그는 내일 [[법정에서 증언할]] 것이다."],["She agreed to [[testify against]] him.","그녀는 그에게 불리하게 [[증언하기로]] 동의했다."],["Two witnesses [[testified]] about the fire.","두 목격자가 화재에 대해 [[증언했다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"rush","a":"4","e":"④ hurry: 서두르다 (우리는 집으로 가는 마지막 기차를 타기 위해 역으로 서둘러 가야 했다.) / rush(서두르다, 급히 가다)의 유의어.","w":"① linger: 꾸물거리다, 오래 머물다\n② stroll: 한가롭게 거닐다\n③ pause: 잠시 멈추다","k":"우리는 집으로 가는 마지막 기차를 타기 위해 역으로 서둘러 가야 했다.","m":0,"s":"We had to rush to the station to catch the last train home.","h":"rush","c":["linger","stroll","pause","hurry"],"mn":"서두르다, 급히 가다","hk":"rush(서두르다, 급히 가다)와 같은 편은 hurry(서두르다). linger(꾸물거리다)·stroll(한가롭게 거닐다)·pause(잠시 멈추다)는 느린 쪽.","ex":[["We had to [[rush to the airport]].","우리는 [[공항으로 서둘러 가야]] 했다."],["Everyone [[rushed out of]] the room.","모두가 방 밖으로 [[급히 나갔다]]."],["She [[rushed home]] after school.","그녀는 방과 후 [[집으로 서둘러 갔다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"ladder","a":"ladder","e":"ladder 사다리","k":"그 페인트공은 높은 벽의 꼭대기에 닿기 위해 사다리를 올라갔다.","m":0,"s":"The painter climbed the l______ to reach the top of the high wall.","mn":"사다리","hk":"ladder(사다리)는 가운데 d가 두 개(dd)이고 끝은 -er.","ex":[["He climbed [[the ladder]].","그는 [[사다리]]를 올랐다."],["Lean [[the ladder]] against the wall.","[[사다리]]를 벽에 기대 놓아라."],["We need [[a long ladder]] to reach the roof.","지붕에 닿으려면 [[긴 사다리]]가 필요하다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"discipline","a":"2","e":"①학문 분야 / ②규율, 훈육 / ③학문 분야 / ④학문 분야 [②번만 의미가 다름]","k":"①경제학은 대학생들 사이에서 인기 있는 학문 분야가 되었다.\n②그 코치는 선수들에게 요구하는 엄격한 규율로 유명하다.\n③인류학은 인간 사회와 문화를 연구하는 학문 분야이다.\n④물리학은 강한 수학 실력을 요구하는 힘든 학문 분야이다.","m":0,"c":["Economics has become a popular discipline among university students.","The coach is known for the strict discipline he demands from his players.","Anthropology is the discipline that studies human societies and cultures.","Physics is a demanding academic discipline that requires strong math skills."],"hc":"discipline|discipline|discipline|discipline","mn":"학문 분야 / 규율, 훈육","hk":"discipline은 ①③④에서 academic discipline(학문 분야)이고, ②만 strict discipline(엄격한 규율)의 '규율, 훈육'.","ex":[["Biology is [[an academic discipline]].","생물학은 [[학문 분야]]이다.","discipline (명) 학문 분야"],["Law is [[a difficult discipline]].","법학은 [[어려운 학문 분야]]이다.","discipline (명) 학문 분야"],["The army demands [[strict discipline]].","군대는 [[엄격한 규율]]을 요구한다.","discipline (명) 규율, 훈육"]]}]},{"day":36,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"chimney","a":"1","e":"① chimney: 굴뚝","w":"② roof: 지붕\n③ balcony: 발코니, 베란다\n④ pillar: 기둥","m":0,"s":"\"굴뚝\"","c":["chimney","roof","balcony","pillar"],"mn":"굴뚝","hk":"chimney(굴뚝)는 연기가 빠져나가는 통로. 같은 집 부분인 roof(지붕), balcony(발코니), pillar(기둥)는 오답.","ex":[["Smoke rose from [[the chimney]] of the old house.","낡은 집의 [[굴뚝]]에서 연기가 피어올랐다."],["Santa climbed down [[the chimney]] on Christmas Eve.","산타는 크리스마스 이브에 [[굴뚝]]으로 내려왔다."],["A bird built a nest on top of [[the chimney]].","새 한 마리가 [[굴뚝]] 꼭대기에 둥지를 지었다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"bunch","a":"2,4","e":"② cluster: 송이, 무리\n④ bundle: 묶음, 꾸러미 (그녀는 노란 꽃 한 다발을 병실로 가지고 들어갔다.) / bunch(다발, 묶음)의 유의어.","w":"① edge: 가장자리, 모서리\n③ vision: 시력, 시야, 환상","k":"그녀는 노란 꽃 한 다발을 병실로 가지고 들어갔다.","m":2,"s":"She carried a bunch of yellow flowers into the hospital room.","h":"bunch","c":["edge","cluster","vision","bundle"],"mn":"다발, 묶음","hk":"bunch(다발)는 꽃이나 열쇠를 한데 묶은 덩어리. 같은 편은 bundle(묶음), cluster(송이). edge(가장자리), vision(시야)은 전혀 다른 뜻.","ex":[["She gave me [[a bunch of flowers]] for my birthday.","그녀는 내 생일에 [[꽃 한 다발]]을 주었다."],["He found [[a bunch of keys]] on the floor.","그는 바닥에서 [[열쇠 한 묶음]]을 발견했다."],["[[A bunch of grapes]] hung from the vine.","[[포도 한 송이]]가 덩굴에 매달려 있었다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"physician","a":"3","e":"③ physician: (의사 / 약으로 병을 치료하는 / 환자를 수술하는 방식이 아니라) 내과 의사 (환자를 수술하는 대신 약으로 질병을 치료하는 의사)","w":"① dentist: 치과 의사\n② surgeon: 외과 의사\n④ pharmacist: 약사","k":"의사 / 약으로 병을 치료하는 / 환자를 수술하는 방식이 아니라","m":0,"s":"\"a medical doctor who treats diseases with medicine rather than by operating on patients\"","c":["dentist","surgeon","physician","pharmacist"],"mn":"내과 의사 (환자를 수술하는 대신 약으로 질병을 치료하는 의사)","hk":"physician(내과 의사)은 수술 대신 약으로 치료. surgeon(외과 의사)은 수술, dentist(치과 의사)는 이, pharmacist(약사)는 약을 지어 주는 사람.","ex":[["You should see [[a physician]] about that cough.","그 기침은 [[내과 의사]]에게 진찰받아 보는 게 좋다."],["[[The physician]] gave her some medicine for the fever.","[[내과 의사]]는 그녀에게 열을 내리는 약을 주었다."],["He became [[a physician]] to help sick people.","그는 아픈 사람들을 돕기 위해 [[내과 의사]]가 되었다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"umbrella","a":"umbrella","e":"umbrella 우산","k":"거리에 폭우가 내리기 시작하자마자 그녀는 우산을 폈다.","m":0,"s":"She opened her u______ as soon as heavy rain began to fall on the street.","mn":"우산","hk":"umbrella(우산)는 '엄-브렐-라'로 끊어 쓰기. 가운데 ll(엘 두 개)과 끝의 a 철자 주의.","ex":[["She opened [[her umbrella]] as it began to rain.","비가 오기 시작하자 그녀는 [[우산]]을 폈다."],["They shared [[a big umbrella]] on the way home.","그들은 집에 가는 길에 [[큰 우산]] 하나를 같이 썼다."],["He left [[his umbrella]] on the bus.","그는 버스에 [[우산]]을 두고 내렸다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"lonely","a":"3","e":"lonely (형) 외로운 - loneliness (명) 외로움\n③ autonomous (형) 자율적인 - autonomy (명) 자율성","w":"① dominate (동) 지배하다 - dominance (명) 우세, 지배\n② collide (동) 충돌하다 - collision (명) 충돌\n④ justify (동) 정당화하다 - justification (명) 정당한 이유, 근거","m":0,"s":"lonely - loneliness","c":["dominate - dominance","collide - collision","autonomous - autonomy","justify - justification"],"mn":"외로운","hk":"lonely(외로운) - loneliness(외로움)는 형용사 → 명사. 정답 autonomous(자율적인) - autonomy(자율성)도 같은 방향, 나머지 보기는 모두 동사 → 명사.","ex":[["He felt [[lonely]] after his friends moved away.","친구들이 이사 간 뒤 그는 [[외로웠다]].","lonely (형) 외로운"],["[[Loneliness]] can be hard for older people.","[[외로움]]은 노인들에게 견디기 힘들 수 있다.","loneliness (명) 외로움"],["The island is [[an autonomous region]] with its own laws.","그 섬은 자체 법을 가진 [[자치 지역]]이다.","autonomous (형) 자율적인"],["Teens want more [[autonomy]] from their parents.","십대들은 부모로부터 더 많은 [[자율성]]을 원한다.","autonomy (명) 자율성"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"fancy","a":"4","e":"④ plain: 수수한, 꾸미지 않은 (그녀는 지난 주말 사촌의 결혼식에 아주 화려한 드레스를 입고 갔다.) / fancy(화려한, 장식이 많은)의 반의어.","w":"① glamorous: 매혹적인, 화려한\n② flashy: 현란한, 요란한\n③ gorgeous: 아주 멋진, 화려한","k":"그녀는 지난 주말 사촌의 결혼식에 아주 화려한 드레스를 입고 갔다.","m":0,"s":"She wore a very fancy dress to her cousin's wedding last weekend.","h":"fancy","c":["glamorous","flashy","gorgeous","plain"],"mn":"화려한, 장식이 많은","hk":"fancy(화려한)의 반대편은 plain(수수한). glamorous(매혹적인), flashy(현란한), gorgeous(아주 멋진)는 오히려 같은 편이라 속임수.","ex":[["She wore [[a fancy dress]] to the party.","그녀는 파티에 [[화려한 드레스]]를 입고 갔다.","fancy (형) 화려한, 장식이 많은"],["He wore [[a plain white shirt]].","그는 [[수수한 흰 셔츠]]를 입었다.","plain (형) 수수한, 꾸미지 않은"],["The room had [[plain white walls]].","그 방은 [[꾸밈없는 흰 벽]]이었다.","plain (형) 수수한, 꾸미지 않은"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"fold","a":"2","e":"② fold: 접다, 개다 (종이를 반으로 접어서 네 뒤에 있는 학생에게 전달해라.)","w":"① trim: 다듬어 자르다\n③ staple: 스테이플러로 고정하다\n④ crumple: 구기다","k":"종이를 반으로 접어서 네 뒤에 있는 학생에게 전달해라.","m":0,"s":"Please ________ the paper in half and pass it to the student behind you.","c":["trim","fold","staple","crumple"],"mn":"접다, 개다","hk":"fold(접다)는 종이를 반으로 접을 때 쓰는 말. crumple(구기다)은 구기는 것, trim(다듬어 자르다)은 자르는 것, staple(스테이플러로 고정하다)은 고정하는 것.","ex":[["Please [[fold the paper in half]].","종이를 [[반으로 접어]] 주세요."],["She [[folded the clothes]] and put them away.","그녀는 [[옷을 개어]] 서랍에 넣었다."],["He [[folded a letter]] and put it in an envelope.","그는 [[편지를 접어]] 봉투에 넣었다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"nest","a":"2","e":"② nest: 둥지","w":"① wing: 날개\n③ feather: 깃털\n④ 고치(cocoon)","m":0,"s":"nest","c":["날개","둥지","깃털","고치"],"mn":"둥지","hk":"nest(둥지)는 새가 알을 낳아 기르는 집. wing(날개), feather(깃털)는 새의 몸이고, cocoon(고치)은 번데기가 든 곳이라 구분.","ex":[["The bird built [[a nest]] in the tree.","새가 나무에 [[둥지]]를 지었다."],["Three small eggs lay in [[the nest]].","작은 알 세 개가 [[둥지]] 안에 있었다."],["I saw [[a bird's nest]] on the roof.","나는 지붕에서 [[새 둥지]]를 보았다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"flourish","a":"3","e":"③ thrive: 번창하다, 번성하다 (새 지하철역이 근처에 문을 연 뒤 작은 가게들이 번창하기 시작했다.) / flourish(번창하다, 잘 자라다)의 유의어.","w":"① falter: 흔들리다, 주춤하다\n② stagnate: 침체되다\n④ dwindle: 점점 줄어들다","k":"새 지하철역이 근처에 문을 연 뒤 작은 가게들이
