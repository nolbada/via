9,"According to one story, Paul walked across the Arizona desert, dragging his giant ax.","한 이야기에 따르면, 폴은 거대한 도끼를 질질 끌며 애리조나 사막을 가로질러 걸었다."]],"w":"9번 문장에 According to one story, Paul walked across the Arizona desert, dragging his giant ax가 그대로 있음.","c":"T"},"h":"5d1a1cff02"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (To cheer themselves up, settlers told tall tales about giant heroes.)","ko":"스스로 기운을 내려고, ( )은 거인 영웅에 관한 허풍스러운 이야기를 했다.","opts":["상인들","군인들","관광객들","정착민들"],"word":"settlers","r":{"a":"4) 정착민들","ev":"1번, 3번 문장","s":[[1,"In the 1800s, many Americans moved west to start new lives on the frontier.","1800년대에 많은 미국인들이 새로운 삶을 시작하려고 개척지인 서부로 이주했다."],[3,"To cheer themselves up, settlers told tall tales about giant heroes.","스스로 기운을 내려고, 정착민들은 거인 영웅에 관한 허풍스러운 이야기를 했다."]],"w":"1번에서 많은 미국인이 새 삶을 시작하려고 서부로 이주했고, 3번의 settlers는 그렇게 이주해 자리 잡은 사람들. 정착민이라는 뜻.","c":4},"h":"62117cb0a2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Paul walked across the Arizona desert, dragging his giant ax.)","ko":"폴은 거대한 도끼를 ( ) 애리조나 사막을 가로질러 걸었다.","opts":["높이 들며","질질 끌며","던지며","갈면서"],"word":"dragging","r":{"a":"2) 질질 끌며","ev":"9~10번 문장","s":[[9,"According to one story, Paul walked across the Arizona desert, dragging his giant ax.","한 이야기에 따르면, 폴은 거대한 도끼를 질질 끌며 애리조나 사막을 가로질러 걸었다."],[10,"With each step, the blade cut into the dry ground.","걸음마다 도끼날이 메마른 땅을 파고들었다."]],"w":"9번의 dragging his giant ax 뒤 10번에서 도끼날이 땅을 파고들었다고 함. 땅에 닿은 채로 끌고 가야 땅이 파이니 '질질 끌다'가 맞음. 들거나 던지면 땅에 자국이 길게 남지 않음.","c":2},"h":"b14700de09"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nPeople said that the land changed shape wherever they went.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"사람들은 그들이 가는 곳마다 땅의 모양이 바뀌었다고 말했다.","opts":["폴 버니언과 베이브","이야기를 전한 정착민들","나무와 연못들","애리조나 사막의 사람들"],"r":{"a":"1) 폴 버니언과 베이브","ev":"7~8번 문장","s":[[7,"He traveled with Babe, his blue ox.","그는 파란 황소 베이브와 함께 다녔다."],[8,"People said that the land changed shape wherever they went.","사람들은 그들이 가는 곳마다 땅의 모양이 바뀌었다고 말했다."]],"w":"8번 the land changed shape wherever they went에서 they는 바로 앞 7번의 He traveled with Babe에서 함께 다니는 폴 버니언과 베이브. 이야기 속에서 가는 곳마다 땅의 모양이 바뀜.","c":1},"h":"6524a4f7e8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He was so tall that trees looked like grass beside him.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 너무 커서 그 옆에서는 나무가 풀처럼 보였다.","opts":["그는 풀처럼 키가 작아서 나무 옆에서는 눈에 띄지 않았다.","그는 나무만큼 키가 커서 풀밭에서도 쉽게 눈에 띄었다.","그는 너무 커서 그 옆에 있으면 나무가 풀처럼 작아 보였다.","그는 풀을 좋아해서 나무 옆에 풀을 심어 주었다."],"r":{"a":"3) 그는 너무 커서 그 옆에 있으면 나무가 풀처럼 작아 보였다.","ev":"5번 문장","s":[[5,"He was so tall that trees looked like grass beside him.","그는 너무 커서 그 옆에서는 나무가 풀처럼 보였다."]],"w":"5번 so tall that trees looked like grass는 '너무 커서 나무가 풀처럼 보였다'. 나무가 풀로 보일 만큼 폴이 거대하다는 뜻이라, 폴이 작다는 선지는 반대.","c":3},"h":"666870f6bf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["폴 버니언은 동물을 싫어해서 혼자 다녔다.","베이브는 마을에 사는 작고 하얀 말이었다.","폴 버니언이 가는 곳마다 땅은 그대로였다.","폴 버니언과 베이브가 가는 곳마다 땅의 모양이 바뀌었다."],"opts":["Paul Bunyan traveled alone because he did not like animals.","Babe was a small white horse that lived in a town.","The land stayed the same wherever Paul Bunyan went.","Wherever Paul Bunyan and Babe went, the land changed shape."],"r":{"a":"4) Wherever Paul Bunyan and Babe went, the land changed shape.","ev":"7~8번 문장","s":[[7,"He traveled with Babe, his blue ox.","그는 파란 황소 베이브와 함께 다녔다."],[8,"People said that the land changed shape wherever they went.","사람들은 그들이 가는 곳마다 땅의 모양이 바뀌었다고 말했다."]],"w":"7번에서 폴은 파란 황소 베이브와 함께 다녔고, 8번에서 가는 곳마다 땅의 모양이 바뀌었다고 함. 혼자 다녔다, 하얀 말이다, 땅이 그대로였다는 선지는 모두 본문과 다름.","c":4},"h":"1fff7f97bc"},{"n":9,"t":"sum","q":"In one tale, Paul dragged his giant (A) across the Arizona desert, and the deep cut became the (B).","ko":"한 이야기에서 폴은 거대한 (A)를 애리조나 사막에서 질질 끌었고, 깊게 파인 자국은 (B)이(가) 되었다.","oko":["(A) 황소 / (B) 그랜드캐니언","(A) 도끼 / (B) 그랜드캐니언","(A) 도끼 / (B) 연못","(A) 황소 / (B) 연못","(A) 나무 / (B) 사막"],"opts":["(A) ox / (B) Grand Canyon","(A) ax / (B) Grand Canyon","(A) ax / (B) pond","(A) ox / (B) pond","(A) tree / (B) desert"],"r":{"a":"2) (A) ax / (B) Grand Canyon","ev":"9~11번 문장","s":[[9,"According to one story, Paul walked across the Arizona desert, dragging his giant ax.","한 이야기에 따르면, 폴은 거대한 도끼를 질질 끌며 애리조나 사막을 가로질러 걸었다."],[10,"With each step, the blade cut into the dry ground.","걸음마다 도끼날이 메마른 땅을 파고들었다."],[11,"After hundreds of miles, this deep cut became what we now call the Grand Canyon.","수백 마일을 가자, 이 깊게 파인 자국은 오늘날 우리가 그랜드캐니언이라고 부르는 곳이 되었다."]],"w":"9번에서 giant ax(거대한 도끼)를 끌었고, 10번에서 날이 땅을 파고들었고, 11번에서 그 deep cut(깊은 자국)이 Grand Canyon이 됨. 연못(pond)은 6번의 발자국이 만든 것이라 헷갈리면 안 됨.","c":2},"h":"89bfc93b27"},{"n":10,"t":"fill","q":"To cheer themselves up, settlers told [A] tales about giant heroes, and these tales helped them face another [B] day.","ko":"스스로 기운을 내려고, 정착민들은 거인 영웅에 관한 [A] 이야기를 했고, 이 이야기들은 또 다른 [B] 하루를 맞이하는 데 도움이 되었다.","bko":{"deep":"깊은","west":"서쪽","tall":"허풍스러운(tall tale)","ax":"도끼","hard":"힘든","ponds":"연못들"},"bank":["deep","west","tall","ax","hard","ponds"],"r":{"a":"[A] tall, [B] hard","ev":"3번, 13번 문장","s":[[3,"To cheer themselves up, settlers told tall tales about giant heroes.","스스로 기운을 내려고, 정착민들은 거인 영웅에 관한 허풍스러운 이야기를 했다."],[13,"But these tall tales gave settlers something to laugh about and helped them face another hard day.","하지만 이 허풍스러운 이야기들은 정착민들에게 웃을 거리를 주었고, 또 다른 힘든 하루를 맞이하는 데 도움이 되었다."]],"w":"3번의 settlers told tall tales about giant heroes와 13번의 helped them face another hard day에서 가져옴. deep, west, ax, ponds는 본문 단어지만 [A]나 [B]에 넣으면 문장 뜻이 맞지 않음.","c":null},"h":"71d6d23b2c"}]},{"u":10,"id":"b2-10-1","no":1,"ko":"선수 뒤에서 뛰는 사람, 스포츠 에이전트","items":[{"n":1,"t":"tf","q":"Sports agents help athletes only on the field.","ko":"스포츠 에이전트는 선수를 경기장 안에서만 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Agents help athletes in many ways off the field.","에이전트는 경기장 밖에서 여러 면으로 선수들을 돕는다."]],"w":"2번 문장에 Agents help athletes in many ways off the field가 있음. off the field는 '경기장 밖에서'라서 경기장 안에서만 돕는다는 말은 반대임.","c":"F"},"h":"0e910be6e9"},{"n":2,"t":"tf","q":"Agents manage a player’s social media and public image.","ko":"에이전트는 선수의 소셜 미디어와 대중적 이미지를 관리한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Agents also manage a player’s social media and public image.","에이전트는 또한 선수의 소셜 미디어와 대중적 이미지를 관리한다."]],"w":"4번 문장에 Agents also manage a player’s social media and public image가 그대로 있음.","c":"T"},"h":"da99af9d5e"},{"n":3,"t":"tf","q":"Sports agents can start working without a license.","ko":"스포츠 에이전트는 면허 없이 일을 시작할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"They need to get a license before they can work.","그들은 일을 하기 전에 면허를 취득해야 한다."]],"w":"9번 문장에 They need to get a license before they can work가 있음. 일하기 전에 면허가 필요하니 면허 없이 시작할 수 있다는 말은 반대임.","c":"F"},"h":"6cd38b3376"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They deal with player contracts, arrange transfers between teams, and find sponsors.)","ko":"그들은 선수 계약을 다루고, 팀 간의 이적을 ( ), 후원사를 찾는다.","opts":["준비하고 주선하다","거절하다","취소하다","비교하다"],"word":"arrange","r":{"a":"1) 준비하고 주선하다","ev":"3번 문장","s":[[3,"They deal with player contracts, arrange transfers between teams, and find sponsors.","그들은 선수 계약을 다루고, 팀 간의 이적을 주선하며, 후원사를 찾는다."]],"w":"3번에서 에이전트가 하는 일 세 가지가 나열됨. arrange transfers는 팀 사이의 이적이 이루어지도록 준비하고 주선하는 것. 거절하거나 취소하면 선수를 돕는 일이 아님.","c":1},"h":"3a8e3264d9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Being a sports agent takes knowledge and effort.)","ko":"스포츠 에이전트가 되는 것은 지식과 ( )이 필요하다.","opts":["휴식","노력","행운","장비"],"word":"effort","r":{"a":"2) 노력","ev":"10번 문장","s":[[10,"Being a sports agent takes knowledge and effort.","스포츠 에이전트가 되는 것은 지식과 노력이 필요하다."]],"w":"10번은 에이전트가 되려면 knowledge(지식)와 함께 effort가 필요하다는 말. 11번의 But 앞에서 어려운 점을 말하는 부분이라, 힘을 들여 애쓰는 '노력'이 알맞음. 휴식이나 행운은 어려운 점이 아님.","c":2},"h":"54bca47ce7"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis lets players focus only on training and games.","ko":"밑줄 친 This이(가) 가리키는 것은?","sko":"이것은 선수들이 훈련과 경기에만 집중할 수 있게 해 준다.","opts":["선수들이 훈련과 경기에만 집중하는 것","선수가 경기장 밖에서 하는 모든 일","에이전트가 선수의 계약, 이적, 후원사, 소셜 미디어와 이미지를 관리하는 것","에이전트가 되기 위해 공부하는 것"],"r":{"a":"3) 에이전트가 선수의 계약, 이적, 후원사, 소셜 미디어와 이미지를 관리하는 것","ev":"3~5번 문장","s":[[3,"They deal with player contracts, arrange transfers between teams, and find sponsors.","그들은 선수 계약을 다루고, 팀 간의 이적을 주선하며, 후원사를 찾는다."],[4,"Agents also manage a player’s social media and public image.","에이전트는 또한 선수의 소셜 미디어와 대중적 이미지를 관리한다."],[5,"This lets players focus only on training and games.","이것은 선수들이 훈련과 경기에만 집중할 수 있게 해 준다."]],"w":"5번의 This는 바로 앞 3~4번에서 에이전트가 해 주는 일들(계약, 이적, 후원사, 소셜 미디어, 이미지 관리)을 가리킴. 그 결과가 5번의 '선수들이 훈련과 경기에만 집중할 수 있다'이므로, 집중하는 것 자체는 This가 아니라 결과임.","c":3},"h":"e547c514fd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But for those who love sports, it can be an enjoyable job.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 스포츠를 사랑하는 사람들에게는 즐거운 직업이 될 수 있다.","opts":["하지만 스포츠를 사랑하는 사람이라면 이 직업을 즐겁게 할 수 있다.","하지만 스포츠를 싫어하는 사람들에게도 즐거운 직업이다.","하지만 스포츠를 사랑해도 즐겁게 일할 수 없는 직업이다.","스포츠를 사랑하는 사람은 이 직업을 가질 수 없다."],"r":{"a":"1) 하지만 스포츠를 사랑하는 사람이라면 이 직업을 즐겁게 할 수 있다.","ev":"10~11번 문장","s":[[10,"Being a sports agent takes knowledge and effort.","스포츠 에이전트가 되는 것은 지식과 노력이 필요하다."],[11,"But for those who love sports, it can be an enjoyable job.","하지만 스포츠를 사랑하는 사람들에게는 즐거운 직업이 될 수 있다."]],"w":"11번은 But으로 10번의 '지식과 노력이 필요하다'와 대조됨. 힘들어도 스포츠를 사랑하는 사람에게는 enjoyable job(즐거운 직업)이 될 수 있음. 반대로 쓴 선지는 모두 오답.","c":1},"h":"3eec05b6b5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["스포츠 경영, 경영학, 또는 법학을 공부하는 것은 스포츠 에이전트가 되는 데 좋다.","에이전트는 일하기 전에 프로 선수여야 한다.","모든 스포츠 에이전트는 시험이나 면허 없이 일한다.","에이전트는 경기 중에 선수와 함께 경기장 안에서만 일한다."],"opts":["Studying sports management, business, or law is good for becoming a sports agent.","Agents must be professional athletes before they can work.","All sports agents work without any exam or license.","Agents only work on the field with the players during games."],"r":{"a":"1) Studying sports management, business, or law is good for becoming a sports agent.","ev":"2, 6, 8, 9번 문장","s":[[2,"Agents help athletes in many ways off the field.","에이전트는 경기장 밖에서 여러 면으로 선수들을 돕는다."],[6,"To become a sports agent, it is good to study sports management, business, or law.","스포츠 에이전트가 되려면, 스포츠 경영, 경영학, 또는 법학을 공부하는 것이 좋다."],[8,"Also, in some sports, like soccer, agents must pass an exam.","또한 축구와 같은 일부 스포츠에서는 에이전트가 시험에 합격해야 한다."],[9,"They need to get a license before they can work.","그들은 일을 하기 전에 면허를 취득해야 한다."]],"w":"6번에서 경영·법학 공부가 좋다고 함. 프로 선수여야 한다는 말은 없고, 8~9번에서 시험과 면허가 필요하다고 했으며, 2번에서 에이전트는 경기장 밖에서 돕는다고 하니 나머지는 모두 본문과 다름.","c":1},"h":"9f1f2e1790"},{"n":9,"t":"sum","q":"Agents handle many (A) for players off the field, so players can (B) on training and games.","ko":"에이전트는 경기장 밖에서 선수를 위해 여러 (A)을(를) 처리하고, 그래서 선수들은 훈련과 경기에 (B)할 수 있다.","oko":["(A) 일들 / (B) 쉬","(A) 시험들 / (B) 집중","(A) 시험들 / (B) 쉬","(A) 면허들 / (B) 그만둘","(A) 일들 / (B) 집중"],"opts":["(A) tasks / (B) rest","(A) exams / (B) focus","(A) exams / (B) rest","(A) licenses / (B) quit","(A) tasks / (B) focus"],"r":{"a":"5) (A) tasks / (B) focus","ev":"3~5번 문장","s":[[3,"They deal with player contracts, arrange transfers between teams, and find sponsors.","그들은 선수 계약을 다루고, 팀 간의 이적을 주선하며, 후원사를 찾는다."],[4,"Agents also manage a player’s social media and public image.","에이전트는 또한 선수의 소셜 미디어와 대중적 이미지를 관리한다."],[5,"This lets players focus only on training and games.","이것은 선수들이 훈련과 경기에만 집중할 수 있게 해 준다."]],"w":"3~4번에서 에이전트가 계약, 이적, 후원사, 소셜 미디어, 이미지를 맡아 처리하니 (A)는 일들(tasks). 5번에서 그 결과 선수들은 훈련과 경기에만 focus(집중)할 수 있음. 시험과 면허는 에이전트 본인이 되기 위한 조건(8~9번).","c":5},"h":"8b55f34f18"},{"n":10,"t":"fill","q":"To become a sports agent, it is good to study sports management, business, or [A], and in some sports, agents must pass an [B].","ko":"스포츠 에이전트가 되려면 스포츠 경영, 경영학, 또는 [A]을(를) 공부하는 것이 좋고, 일부 스포츠에서는 에이전트가 [B]에 합격해야 한다.","bko":{"sponsors":"후원사","law":"법학","transfers":"이적","exam":"시험","license":"면허","social":"사회적인"},"bank":["sponsors","law","transfers","e o":"일부 복잡한 판정에는 여전히 심판의 경험이 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Some complex decisions still need a referee’s experience and understanding of the game.","일부 복잡한 판정에는 여전히 심판의 경험과 경기에 대한 이해가 필요하다."]],"w":"10번 문장에 Some complex decisions still need a referee’s experience and understanding of the game이 있음. still은 지금도 여전히.","c":"T"},"h":"dd3af49b16"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (All decisions in sports were made by human referees, so their judgments weren’t always perfect.)","ko":"스포츠의 모든 판정은 사람 심판이 내렸기 때문에, 그들의 ( )이 항상 완벽하지는 않았다.","opts":["응원","규칙","판단, 판정","기록"],"word":"judgments","r":{"a":"3) 판단, 판정","ev":"1~2번 문장","s":[[1,"In the past, all decisions in sports were made by human referees, so their judgments weren’t always perfect.","과거에는 스포츠의 모든 판정을 사람 심판이 내렸기 때문에, 그들의 판단이 항상 완벽하지는 않았다."],[2,"Sometimes mistakes caused unfair results and made players and fans upset.","때때로 실수는 불공정한 결과를 낳았고 선수들과 팬들을 화나게 했다."]],"w":"1번에서 심판이 내린 decisions(결정) 뒤에 their judgments weren’t always perfect라고 함. 2번에서 그 때문에 실수와 불공정한 결과가 생겼으니 judgments는 심판의 판단·판정.","c":3},"h":"73477ec5cd"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This helps make sports more accurate and fair.)","ko":"이것은 스포츠를 더 ( ) 공정하게 만드는 데 도움이 된다.","opts":["정확한","빠른","비싼","어려운"],"word":"accurate","r":{"a":"1) 정확한","ev":"7~8번 문장","s":[[7,"The result appears on the screen in seconds, so the game can continue quickly.","결과는 몇 초 만에 화면에 나타나서, 경기는 빠르게 계속될 수 있다."],[8,"This helps make sports more accurate and fair.","이것은 스포츠를 더 정확하고 공정하게 만드는 데 도움이 된다."]],"w":"7번에서는 결과가 빨리 나온다고 했고, 8번에서는 그래서 더 accurate and fair하다고 함. 2번의 실수·불공정과 반대 방향이므로 accurate는 '정확한'. 빠른은 7번의 quickly와 헷갈린 오답.","c":1},"h":"47512e2c56"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nTo reduce this, sports now use AI technology.","ko":"밑줄 친 this이(가) 가리키는 것은?","sko":"이를 줄이기 위해, 스포츠는 이제 AI 기술을 사용한다.","opts":["AI 기술","심판의 실수로 불공정한 결과가 생겨 선수와 팬들이 화나는 문제","선수와 팬들의 응원","테니스 경기의 점수"],"r":{"a":"2) 심판의 실수로 불공정한 결과가 생겨 선수와 팬들이 화나는 문제","ev":"2~3번 문장","s":[[2,"Sometimes mistakes caused unfair results and made players and fans upset.","때때로 실수는 불공정한 결과를 낳았고 선수들과 팬들을 화나게 했다."],[3,"To reduce this, sports now use AI technology.","이를 줄이기 위해, 스포츠는 이제 AI 기술을 사용한다."]],"w":"3번 To reduce this에서 this는 앞 2번의 내용. 심판의 실수가 불공정한 결과를 낳아 선수와 팬을 화나게 하는 문제를 줄이려고 AI 기술을 쓴다는 흐름. AI 기술은 줄이는 수단이지 줄일 대상이 아님.","c":2},"h":"9094ac2e31"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The result appears on the screen in seconds, so the game can continue quickly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과는 몇 초 만에 화면에 나타나서, 경기는 빠르게 계속될 수 있다.","opts":["결과가 화면에 나타날 때까지 경기가 오래 멈춰 있어야 한다.","결과가 몇 초 안에 나와서 경기가 일찍 끝난다.","결과는 화면이 아니라 심판에게만 전해진다.","결과가 몇 초 안에 화면에 나타나므로 경기가 빠르게 이어질 수 있다."],"r":{"a":"4) 결과가 몇 초 안에 화면에 나타나므로 경기가 빠르게 이어질 수 있다.","ev":"7번 문장","s":[[7,"The result appears on the screen in seconds, so the game can continue quickly.","결과는 몇 초 만에 화면에 나타나서, 경기는 빠르게 계속될 수 있다."]],"w":"7번의 The result appears on the screen in seconds, so the game can continue quickly는 결과가 화면에 몇 초 만에 나타나서 경기가 빠르게 계속된다는 뜻. 오래 멈춘다, 일찍 끝난다, 심판에게만 전해진다는 말은 없음.","c":4},"h":"788def5d28"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["테니스는 AI를 점수를 세는 데에만 사용한다.","AI 기술은 스포츠를 더 정확하고 공정하게 만드는 데 도움이 된다.","과거에 사람 심판은 실수를 하지 않았다.","AI는 모든 심판의 일을 넘겨받았다."],"opts":["Tennis uses AI only to count the points.","AI technology helps make sports more accurate and fair.","Human referees made no mistakes in the past.","AI has taken over every referee’s job."],"r":{"a":"2) AI technology helps make sports more accurate and fair.","ev":"1, 4, 6, 8, 11번 문장","s":[[1,"In the past, all decisions in sports were made by human referees, so their judgments weren’t always perfect.","과거에는 스포츠의 모든 판정을 사람 심판이 내렸기 때문에, 그들의 판단이 항상 완벽하지는 않았다."],[4,"For example, tennis uses an AI line-call system.","예를 들어, 테니스는 AI 라인콜 시스템을 사용한다."],[6,"AI builds a 3D picture of its path and decides if it is “in” or “out.”","AI는 공이 지나간 길의 3D 그림을 만들고 그것이 “인”인지 “아웃”인지 판정한다."],[8,"This helps make sports more accurate and fair.","이것은 스포츠를 더 정확하고 공정하게 만드는 데 도움이 된다."],[11,"For now, AI is used to help referees, not replace them.","당분간 AI는 심판을 대체하는 것이 아니라 돕는 데 쓰인다."]],"w":"8번에서 AI가 스포츠를 더 정확하고 공정하게 한다고 함. 4~6번에서 테니스의 AI는 점수가 아니라 공이 인인지 아웃인지를 판정하고, 1번에서 사람 심판의 판단은 늘 완벽하지 않았고, 11번에서 AI는 심판을 돕는 데 쓰이니 나머지는 모두 본문과 다름.","c":2},"h":"f6e6704b68"},{"n":9,"t":"sum","q":"Human referees’ (A) were not always perfect, so sports now use (B) technology to reduce mistakes.","ko":"사람 심판의 (A)은(는) 항상 완벽하지 않았고, 그래서 스포츠는 이제 실수를 줄이려고 (B) 기술을 사용한다.","oko":["(A) 팬들 / (B) AI","(A) 판단 / (B) 소리","(A) 규칙 / (B) 종이","(A) 판단 / (B) AI","(A) 선수들 / (B) 소리"],"opts":["(A) fans / (B) AI","(A) judgments / (B) sound","(A) rules / (B) paper","(A) judgments / (B) AI","(A) players / (B) sound"],"r":{"a":"4) (A) judgments / (B) AI","ev":"1~3번 문장","s":[[1,"In the past, all decisions in sports were made by human referees, so their judgments weren’t always perfect.","과거에는 스포츠의 모든 판정을 사람 심판이 내렸기 때문에, 그들의 판단이 항상 완벽하지는 않았다."],[2,"Sometimes mistakes caused unfair results and made players and fans upset.","때때로 실수는 불공정한 결과를 낳았고 선수들과 팬들을 화나게 했다."],[3,"To reduce this, sports now use AI technology.","이를 줄이기 위해, 스포츠는 이제 AI 기술을 사용한다."]],"w":"1번에서 사람 심판의 judgments(판단)가 늘 완벽하지 않았고, 2번의 실수와 불공정한 결과를 줄이려고 3번에서 AI 기술을 사용함. 팬들이 화난 것은 2번의 결과일 뿐이라 (A)에 맞지 않음.","c":4},"h":"e66a95cb15"},{"n":10,"t":"fill","q":"AI cannot [A] everything, so for now it is used to [B] referees, not replace them.","ko":"AI는 모든 것을 [A]할 수 없어서, 당분간 심판을 대체하는 것이 아니라 심판을 [B] 데 쓰인다.","bko":{"upset":"화나게 하다","appear":"나타나다","help":"돕다","reduce":"줄이다","decide":"결정하다","continue":"계속하다"},"bank":["upset","appear","help","reduce","decide","continue"],"r":{"a":"[A] decide, [B] help","ev":"9번, 11번 문장","s":[[9,"However, AI cannot decide everything.","하지만 AI가 모든 것을 결정할 수는 없다."],[11,"For now, AI is used to help referees, not replace them.","당분간 AI는 심판을 대체하는 것이 아니라 돕는 데 쓰인다."]],"w":"9번의 AI cannot decide everything과 11번의 AI is used to help referees, not replace them에서 가져옴. upset, appear, reduce, continue는 본문 단어지만 [A]나 [B]에 넣으면 문장 뜻이 맞지 않음.","c":null},"h":"c3b4d3d05f"}]},{"u":10,"id":"b2-10-4","no":4,"ko":"우리는 왜 약한 팀을 응원할까?","items":[{"n":1,"t":"tf","q":"An underdog is a team or player that is not expected to win.","ko":"언더독은 이길 것으로 예상되지 않는 팀이나 선수이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Many people cheer for the underdog, the team or player that is not expected to win.","많은 사람들이 이길 것으로 예상되지 않는 팀이나 선수인 언더독을 응원한다."]],"w":"2번 문장에 the underdog, the team or player that is not expected to win이 있음. not expected to win은 '이길 것으로 예상되지 않는'.","c":"T"},"h":"ab3a655b4a"},{"n":2,"t":"tf","q":"Underdogs usually feel more pressure than other teams.","ko":"언더독은 보통 다른 팀보다 더 큰 부담을 느낀다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Underdogs usually feel less pressure, so they can play more freely.","언더독은 보통 부담을 덜 느껴서 더 자유롭게 경기할 수 있다."]],"w":"8번 문장에 Underdogs usually feel less pressure가 있음. less(더 적은)라서 more pressure(더 큰 부담)는 반대임.","c":"F"},"h":"89836bd404"},{"n":3,"t":"tf","q":"Many people think that cheering for underdogs is unnatural.","ko":"많은 사람들은 언더독을 응원하는 것이 부자연스럽다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Cheering for underdogs is natural.","언더독을 응원하는 것은 자연스러운 일이다."]],"w":"4번 문장에 Cheering for underdogs is natural이 있음. natural(자연스러운)이라서 unnatural(부자연스러운)은 반대임.","c":"F"},"h":"7bb2a2371e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Underdogs usually feel less pressure, so they can play more freely.)","ko":"언더독은 보통 ( )을 덜 느껴서 더 자유롭게 경기할 수 있다.","opts":["속도","부담","점수","응원"],"word":"pressure","r":{"a":"2) 부담","ev":"8번 문장","s":[[8,"Underdogs usually feel less pressure, so they can play more freely.","언더독은 보통 부담을 덜 느껴서 더 자유롭게 경기할 수 있다."]],"w":"8번의 less pressure, so they can play more freely에서 부담이 적어서 자유롭게 경기한다는 원인과 결과가 이어짐. pressure는 마음을 누르는 '부담, 압박'.","c":2},"h":"188ab8ac37"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Because others do not expect much from them, they also try harder to prove themselves.)","ko":"다른 사람들이 그들에게 큰 기대를 하지 않기 때문에, 그들은 스스로를 ( ) 더 열심히 노력하기도 한다.","opts":["숨기다","잊다","바꾸다","증명하다"],"word":"prove","r":{"a":"4) 증명하다","ev":"9번 문장","s":[[9,"Because others do not expect much from them, they also try harder to prove themselves.","다른 사람들이 그들에게 큰 기대를 하지 않기 때문에, 그들은 스스로를 증명하려고 더 열심히 노력하기도 한다."]],"w":"9번에서 기대를 안 받는 언더독이 더 열심히 노력하는 이유가 to prove themselves. 기대가 낮아도 실력이 있다는 것을 보여 준다는 '증명하다'. 숨기거나 잊으면 열심히 노력하는 이유가 되지 않음.","c":4},"h":"649272f00d"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAll of this helps them focus better, work together, and sometimes surprise everyone by winning.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"이 모든 것은 그들이 더 잘 집중하고 협력하며, 때로는 이겨서 모두를 놀라게 하는 데 도움이 된다.","opts":["응원하는 팬들","이기고 있는 팀들","언더독(약한 팀이나 선수)들","심판들"],"r":{"a":"3) 언더독(약한 팀이나 선수)들","ev":"9~10번 문장","s":[[9,"Because others do not expect much from them, they also try harder to prove themselves.","다른 사람들이 그들에게 큰 기대를 하지 않기 때문에, 그들은 스스로를 증명하려고 더 열심히 노력하기도 한다."],[10,"All of this helps them focus better, work together, and sometimes surprise everyone by winning.","이 모든 것은 그들이 더 잘 집중하고 협력하며, 때로는 이겨서 모두를 놀라게 하는 데 도움이 된다."]],"w":"10번 All of this helps them focus better에서 them은 9번에서 계속 말하던 underdogs(언더독). 팬이 아니라 경기하는 선수들이 집중하고 협력해서 때로 이긴다는 내용.","c":3},"h":"f1724377fe"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"An underdog’s victory also feels special since it is unexpected.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"언더독의 승리는 예상 밖이기 때문에 더욱 특별하게 느껴진다.","opts":["언더독의 승리는 예상하지 못한 일이라서 더 특별하게 느껴진다.","언더독의 승리는 예상한 대로여서 별로 특별하지 않다.","언더독의 승리는 특별해서 아무도 예상하지 못한다.","언더독이 이기면 팬들은 놀라서 응원을 그만둔다."],"r":{"a":"1) 언더독의 승리는 예상하지 못한 일이라서 더 특별하게 느껴진다.","ev":"6번 문장","s":[[6,"An underdog’s victory also feels special since it is unexpected.","언더독의 승리는 예상 밖이기 때문에 더욱 특별하게 느껴진다."]],"w":"6번의 feels special since it is unexpected에서 since는 이유. 예상 밖이기 때문에 특별하게 느껴진다는 원인과 결과임. '특별해서 예상하지 못한다'는 원인과 결과를 뒤집은 오답.","c":1},"h":"25cb58fe3f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["사람들은 어려운 상황에 처하고도 여전히 최선을 다하는 선수들을 좋아한다.","대부분의 사람들은 항상 이기고 있는 팀을 응원한다.","언더독은 모두가 이기기를 기대해서 더 큰 부담을 느낀다.","언더독 효과는 선수들이 경기에서 지게 만든다."],"opts":["People like players who face hard situations and still try their best.","Most people always cheer for the team that is winning.","Underdogs feel more pressure because everyone expects them to win.","The underdog effect makes players lose the game."],"r":{"a":"1) People like players who face hard situations and still try their best.","ev":"2, 5, 8, 10번 문장","s":[[2,"Many people cheer for the underdog, the team or player that is not expected to win.","많은 사람들이 이길 것으로 예상되지 않는 팀이나 선수인 언더독을 응원한다."],[5,"People like players who face hard situations and still try their best.","사람들은 어려운 상황에 처하고도 여전히 최선을 다하는 선수들을 좋아한다."],[8,"Underdogs usually feel less pressure, so they can play more freely.","언더독은 보통 부담을 덜 느껴서 더 자유롭게 경기할 수 있다."],[10,"All of this helps them focus better, work together, and sometimes surprise everyone by winning.","이 모든 것은 그들이 더 잘 집중하고 협력하며, 때로는 이겨서 모두를 놀라게 하는 데 도움이 된다."]],"w":"5번에서 사람들은 어려워도 최선을 다하는 선수를 좋아한다고 함. 2번에서 많은 사람이 이길 것으로 예상되지 않는 쪽을 응원하고, 8번에서 언더독은 부담을 덜 느끼고, 10번에서 때로는 이겨서 놀라게 하니 나머지는 모두 본문과 다름.","c":1},"h":"ff3925aedd"},{"n":9,"t":"sum","q":"Underdogs feel less (A), so they can play more (B).","ko":"언더독은 (A)을(를) 덜 느껴서 더 (B) 경기할 수 있다.","oko":["(A) 부담 / (B) 조심스럽게","(A) 돈 / (B) 자유롭게","(A) 부담 / (B) 자유롭게","(A) 돈 / (B) 느리게","(A) 속도 / (B) 조심스럽게"],"opts":["(A) pressure / (B) carefully","(A) money / (B) freely","(A) pressure / (B) freely","(A) money / (B) slowly","(A) speed / (B) carefully"],"r":{"a":"3) (A) pressure / (B) freely","ev":"7~8번 문장","s":[[7,"This effect also helps players.","이 효과는 선수들에게도 도움이 된다."],[8,"Underdogs usually feel less pressure, so they can play more freely.","언더독은 보통 부담을 덜 느껴서 더 자유롭게 경기할 수 있다."]],"w":"7번 This effect also helps players 뒤 8번에서 Underdogs usually feel less pressure, so they can play more freely. 부담을 덜 느끼니 자유롭게 경기함. carefully는 부담이 적은 상황과 어울리지 않고, money와 speed는 본문에 나오지 않음.","c":3},"h":"79cedc84be"},{"n":10,"t":"fill","q":"Because others do not expect much from them, underdogs also try harder to [A] themselves, and this helps them [B] better.","ko":"다른 사람들이 큰 기대를 하지 않기 때문에, 언더독은 스스로를 [A]하려고 더 열심히 노력하며, 이것은 그들이 더 잘 [B]하는 데 도움이 된다.","bko":{"natural":"자연스러운","focus":"집중하다","special":"특별한","prove":"증명하다","expect":"기대하다","freely":"자유롭게"},"bank":["natural","focus","special","prove","expect","freely"],"r":{"a":"[A] prove, [B] focus","ev":"9~10번 문장","s":[[9,"Because others do not expect much from them, they also try harder to prove themselves.","다른 사람들이 그들에게 큰 기대를 하지 않기 때문에, 그들은 스스로를 증명하려고 더 열심히 노력하기도 한다."],[10,"All of this helps them focus better, work together, and sometimes surprise everyone by winning.","이 모든 것은 그들이 더 잘 집중하고 협력하며, 때로는 이겨서 모두를 놀라게 하는 데 도움이 된다."]],"w":"9번의 try harder to prove themselves와 10번의 helps them focus better에서 가져옴. natural, special, freely는 [A]나 [B]에 넣으면 문법이 맞지 않고, expect는 [A]에 넣으면 '스스로를 기대하려고'가 되어 뜻이 맞지 않음.","c":null},"h":"6e70b5e6f2"}]}];
