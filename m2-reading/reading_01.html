<style>

.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"An new school year started! You can makes new friends and be a good friend to others, too.","ko":"새로운 학년이 시작되었습니다! 여러분은 새로운 친구를 사귀고, 다른 이들에게 좋은 친구가 될 수도 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"An","right":"A","partial":false,"at":[0],"point":"관사 a/an: new는 자음 소리라 a new 사용","topic":"관사 a/an","memo":"new는 자음 소리라 a new 사용"},{"wrong":"makes","right":"make","partial":false,"at":[7],"point":"조동사: 조동사 can 뒤에는 동사원형 make 사용","topic":"조동사","memo":"조동사 can 뒤에는 동사원형 make 사용"}]},{"n":2,"tag":null,"en":"What kind of friend do you want to be? Three student will tell you their stories.","ko":"여러분은 어떤 종류의 친구가 되고 싶은가요? 세 학생이 여러분에게 그들의 이야기를 들려줄 겁니다.","ok":false,"foot":[],"fixes":[{"wrong":"student","right":"students","partial":false,"at":[10],"point":"명사의 복수형: Three 뒤에는 복수명사 students 사용","topic":"명사의 복수형","memo":"Three 뒤에는 복수명사 students 사용"}]},{"n":3,"tag":"보라 · 친구의 기쁨","en":"I want to be someone who is happy about my friends' good news. Minji and me are both interested in art.","ko":"나는 친구의 좋은 소식에 기뻐하는 사람이 되고 싶어요. 민지와 나는 둘 다 미술에 관심이 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"I","partial":false,"at":[15],"point":"인칭대명사의 주격: 주어 자리에는 주격 I 사용","topic":"인칭대명사의 주격","memo":"주어 자리에는 주격 I 사용"}]},{"n":4,"tag":null,"en":"When she won first prize in the school's art competition, I felt jealously. I couldn't congratulate her at first.","ko":"그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요. 처음에 나는 그녀를 축하할 수 없었어요.","ok":false,"foot":[],"fixes":[{"wrong":"jealously","right":"jealous","partial":false,"at":[12],"point":"형용사와 부사: feel 뒤 보어는 형용사 jealous 사용","topic":"형용사와 부사","memo":"feel 뒤 보어는 형용사 jealous 사용"}]},{"n":5,"tag":null,"en":"But I knew she worked really hard. Final, I congratulated her, and she was happy about it.","ko":"하지만 나는 그녀가 정말 열심히 노력한 것을 알았어요. 결국 나는 그녀를 축하해 주었고 그녀는 그것을 기뻐했어요.","ok":false,"foot":[],"fixes":[{"wrong":"Final","right":"Finally","partial":false,"at":[7],"point":"형용사와 부사: 문장을 꾸미는 부사 Finally 사용","topic":"형용사와 부사","memo":"문장을 꾸미는 부사 Finally 사용"}]},{"n":6,"tag":"강민 · 솔직한 충고","en":"I want to be a friend who gives honest advices. One of my friends were always late.","ko":"나는 솔직한 충고를 해주는 친구가 되고 싶어요. 내 친구 중 하나는 항상 늦었어요.","ok":false,"foot":[],"fixes":[{"wrong":"advices","right":"advice","partial":false,"at":[9],"point":"셀 수 없는 명사: advice는 셀 수 없어 복수형 안 씀","topic":"셀 수 없는 명사","memo":"advice는 셀 수 없어 복수형 안 씀"},{"wrong":"were","right":"was","partial":false,"at":[14],"point":"be동사의 수일치: 주어 One(단수)이므로 was (were 아님)","topic":"be동사의 수일치","memo":"주어 One(단수)이므로 was (were 아님)"}]},{"n":7,"tag":null,"en":"People has to wait for him, and it made everyone upset. So, I decided to talk to him.","ko":"사람들은 그를 기다려야 했고, 그게 모두를 속상하게 만들었어요. 그래서 나는 그에게 이야기하기로 마음을 먹었어요.","ok":false,"foot":[],"fixes":[{"wrong":"has","right":"had","partial":false,"at":[1],"point":"동사의 수일치: 주어 People(복수)은 have to (has 아님)","topic":"동사의 수일치","memo":"주어 People(복수)은 have to (has 아님)"}]},{"n":8,"tag":null,"en":"\"Can you please being on time?\" I said.","ko":"나는 \"시간을 지켜주겠니?\" 라고 말했어요.","ok":false,"foot":[],"fixes":[{"wrong":"being","right":"be","partial":false,"at":[3],"point":"조동사: Can you 뒤에는 동사원형 be 사용","topic":"조동사","memo":"Can you 뒤에는 동사원형 be 사용"}]},{"n":9,"tag":null,"en":"\"We want fully enjoy our time together.\" Talking to my friend about this problem were not easy.","ko":"\"우리는 우리의 시간을 온전히 함께 즐기고 싶어. 이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요.","ok":false,"foot":[],"fixes":[{"wrong":"fully","right":"to fully","partial":false,"at":[2],"point":"to부정사: want 뒤에는 to부정사 to enjoy 사용","topic":"to부정사","memo":"want 뒤에는 to부정사 to enjoy 사용","alt":[1]},{"wrong":"were","right":"was","partial":false,"at":[14],"point":"be동사: 동명사 주어 Talking은 단수라 was 사용","topic":"be동사","memo":"동명사 주어 Talking은 단수라 was 사용"}]},{"n":10,"tag":null,"en":"But thankfully, he understood. Now he is always on time!","ko":"하지만 고맙게도 그는 이해했어요. 이제 그는 항상 시간을 지켜요!","ok":true,"foot":[],"fixes":[]},{"n":11,"tag":"시연 · 힘든 친구 격려","en":"I try to cheer up my friends when them are having a hard time. One day, Jisu posted, \"It was a hard day,\" on her social media.","ko":"나는 친구들이 힘든 시간을 보낼 때 그들을 격려하려 노력해요. 어느 날 지수가 자신의 소셜 미디어에 \"힘든 하루였다.\"라고 게시했어요.","ok":false,"foot":[],"fixes":[{"wrong":"them","right":"they","partial":false,"at":[8],"point":"인칭대명사의 주격: 주어 자리에는 주격 they 사용","topic":"인칭대명사의 주격","memo":"주어 자리에는 주격 they 사용"}]},{"n":12,"tag":null,"en":"I wanted to do something to made her happy. So, I bought her chocolate cookies, her favorite snack.","ko":"나는 그녀를 기쁘게 하기 위해 무언가를 하고 싶었어요. 그래서 나는 그녀가 제일 좋아하는 간식인 초콜릿 쿠키를 그녀에게 사주었어요.","ok":false,"foot":[],"fixes":[{"wrong":"made","right":"make","partial":false,"at":[6],"point":"to부정사: to 뒤에는 동사원형 make 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 make 사용"}]},{"n":13,"tag":null,"en":"Then we watched a movie that had an funny story and took pictures together at a photo booths.","ko":"그런 다음 우리는 재미있는 이야기로 된 영화를 보고, 사진 촬영 부스에서 함께 사진을 찍었어요.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[7],"point":"관사 a/an: funny는 자음 소리라 a funny 사용","topic":"관사 a/an","memo":"funny는 자음 소리라 a funny 사용"},{"wrong":"booths","right":"booth","partial":false,"at":[17],"point":"명사의 복수형: a 뒤에는 단수명사 booth 사용","topic":"명사의 복수형","memo":"a 뒤에는 단수명사 booth 사용"}]},{"n":14,"tag":null,"en":"We had a great time, and she said she felt more better.","ko":"우리는 좋은 시간을 보냈고, 그녀는 기분이 나아졌다고 말했어요.","ok":false,"foot":[],"fixes":[{"wrong":"more better","right":"better","partial":false,"at":[10],"point":"비교급: better는 이미 비교급이라 more 불필요","topic":"비교급","memo":"better는 이미 비교급이라 more 불필요"}]}];var PP=[["A new school year started!","새로운 학년이 시작되었습니다!",1],["You can make new friends and be a good friend to others, too.","여러분은 새로운 친구를 사귀고, 다른 이들에게 좋은 친구가 될 수도 있습니다.",0],["What kind of friend do you want to be?","여러분은 어떤 종류의 친구가 되고 싶은가요?",0],["Three students will tell you their stories.","세 학생이 여러분에게 그들의 이야기를 들려줄 겁니다.",0],["Bora","보라",1],["I want to be someone who is happy about my friends' good news.","나는 친구의 좋은 소식에 기뻐하는 사람이 되고 싶어요.",1],["Minji and I are both interested in Three students will tell you their stories.","Bora","I want to be someone who is happy about my friends' good news. Minji and I are both interested in art. When she won first prize in the school's art competition, I felt jealous. I couldn't congratulate her at first. But I knew she worked really hard. Finally, I congratulated her, and she was happy about it.","Kangmin","I want to be a friend who gives honest advice. One of my friends was always late. People had to wait for him, and it made everyone upset. So, I decided to talk to him.","\"Can you please be on time?\" I said. \"We want to fully enjoy our time together.\" Talking to my friend about this problem was not easy. But thankfully, he understood. Now he is always on time!","Siyeon","I try to cheer up my friends when they are having a hard time. One day, Jisu posted, \"It was a hard day,\" on her social media. I wanted to do something to make her happy. So, I bought her chocolate cookies, her favorite snack. Then we watched a movie that had a funny story and took pictures together at a photo booth. We had a great time, and she said she felt better."];var PASS_KO=["당신은 어떤 종류의 친구인가요?","새로운 학년이 시작되었습니다! 여러분은 새로운 친구를 사귀고, 다른 이들에게 좋은 친구가 될 수도 있습니다. 여러분은 어떤 종류의 친구가 되고 싶은가요? 세 학생이 여러분에게 그들의 이야기를 들려줄 겁니다.","보라","나는 친구의 좋은 소식에 기뻐하는 사람이 되고 싶어요. 민지와 나는 둘 다 미술에 관심이 있어요. 그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요. 처음에 나는 그녀를 축하할 수 없었어요. 하지만 나는 그녀가 정말 열심히 노력한 것을 알았어요. 결국 나는 그녀를 축하해 주었고 그녀는 그것을 기뻐했어요.","강민","나는 솔직한 충고를 해주는 친구가 되고 싶어요. 내 친구 중 하나는 항상 늦었어요. 사람들은 그를 기다려야 했고, 그게 모두를 속상하게 만들었어요. 그래서 나는 그에게 이야기하기로 마음을 먹었어요.","나는 \"시간을 지켜주겠니?\" 라고 말했어요. \"우리는 우리의 시간을 온전히 함께 즐기고 싶어. 이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요. 하지만 고맙게도 그는 이해했어요. 이제 그는 항상 시간을 지켜요!","시연","나는 친구들이 힘든 시간을 보낼 때 그들을 격려하려 노력해요. 어느 날 지수가 자신의 소셜 미디어에 \"힘든 하루였다.\"라고 게시했어요. 나는 그녀를 기쁘게 하기 위해 무언가를 하고 싶었어요. 그래서 나는 그녀가 제일 좋아하는 간식인 초콜릿 쿠키를 그녀에게 사주었어요. 그런 다음 우리는 재미있는 이야기로 된 영화를 보고, 사진 촬영 부스에서 함께 사진을 찍었어요. 우리는 좋은 시간을 보냈고, 그녀는 기분이 나아졌다고 말했어요."];var DG=[{"qs":[{"n":1,"q":"What does Yuna suggest to Tom?","o":["taking a walk","looking at the stars","going camping together","packing a bag together","having a barbecue at her house"],"a":2,"ans":"going camping together","evs":[["G: Then why don't you come with us?","그럼 우리와 함께 가는 게 어때?"],["G: Hi, Tom! I'm packing my bag. I'm going to go camping with my family tomorrow.","안녕, Tom! 나는 가방을 싸고 있어. 나는 내일 가족과 함께 캠핑하러 갈 거야."]],"ev":["G: Then why don't you come with us?","그럼 우리와 함께 가는 게 어때?"],"ow":["오답 ✕ — 'take a walk'(산책을 하다)는 Yuna 가족이 캠핑장에서 할 계획 중 하나일 뿐, Tom에게 제안한 것이 아니라서 틀림.","오답 ✕ — 'look at the stars'(별을 보다)도 가족의 캠핑 계획 중 하나이다. Tom에게 제안한 것은 아니라서 틀림.","정답 ○ — Yuna가 'Then why don't you come with us?'(그럼 우리와 함께 가는 게 어때?)라고 했으므로 Tom에게 함께 캠핑 가자고 제안한 것이다.","오답 ✕ — 'I'm packing my bag.'(나는 가방을 싸고 있어.)는 Yuna가 하고 있는 일을 말한 것이다. 함께 가방을 싸자고 제안하지 않았으므로 틀림.","오답 ✕ — 바비큐는 'have a barbecue'(바비큐를 하다)라며 캠핑장에서 할 계획이다. 자기 집에서 바비큐를 하자고 제안한 것은 아니라서 틀림."],"memo":["정답 ③: Yuna는 Tom에게 함께 캠핑 가자고 제안했다.","근거: Then why don't you come with us?(그럼 우리와 함께 가는 게 어때?)","함정: ① ② ⑤는 Yuna 가족의 캠핑장 계획이지 제안이 아니다 ✕"],"why":"Yuna는 Why don't you ~?로 Tom에게 함께 캠핑 가자고 제안한다."},{"n":2,"q":"다음 대화의 주제로 알맞은 것은?","o":["걱정과 위로","여가 활동 공유","약속 장소 정하기","계획과 제안","계획에 대한 조언"],"a":3,"ans":"계획과 제안","evs":[["B: Oh, I see. What are you planning to do at the camping site?","아, 그렇구나. 캠핑장에서 뭘 할 계획이니?"],["G: Then why don't you come with us?","그럼 우리와 함께 가는 게 어때?"]],"ev":["B: Oh, I see. What are you planning to do at the camping site?","아, 그렇구나. 캠핑장에서 뭘 할 계획이니?"],"ow":["오답 ✕ — 걱정이나 위로의 말은 없다. 'That sounds really fun.'(정말 재미있겠다.)처럼 즐거운 분위기의 대화라서 틀림.","오답 ✕ — 취미 활동을 공유하는 대화가 아니다. 'What are you planning to do at the camping site?'(캠핑장에서 뭘 할 계획이니?)처럼 내일의 계획을 묻고 답하므로 틀림.","오답 ✕ — 'Can you come to my house around 9:00 a.m.?'(오전 9시쯤 우리 집으로 올 수 있니?)라는 말이 있지만 마지막에 잠깐 나올 뿐이다. 대화 전체의 주제는 아니라서 틀림.","정답 ○ — 'What are you planning to do at the camping site?'(캠핑장에서 뭘 할 계획이니?)로 계획을 묻고, 'why don't you come with us?'(우리와 함께 가는 게 어때?)로 제안하므로 계획과 제안이 주제이다.","오답 ✕ — 계획에 대해 조언해 주는 말은 없다. Tom은 조언이 아니라 'What are you planning to do'(뭘 할 계획이니)라고 묻기만 해서 틀림."],"memo":["정답 ④: 대화의 주제는 계획과 제안이다.","근거: What are you planning to do ~?(뭘 할 계획이니?) / why don't you come with us?(우리와 함께 가는 게 어때?)","함정: ③ 약속 장소는 마지막에 잠깐 나올 뿐 주제가 아니다 ✕"],"why":"캠핑 계획을 묻고, 함께 가자고 제안하는 대화이다."}],"dlg":[["B","Hi, Yuna. What are you doing?","안녕, 유나야. 뭐 하고 있니?"],["G","Hi, Tom! I'm packing my bag. I'm going to go camping with my family tomorrow.","안녕, Tom! 나는 가방을 싸고 있어. 나는 내일 가족과 함께 캠핑하러 갈 거야."],["B","Oh, I see. What are you planning to do at the camping site?","아, 그렇구나. 캠핑장에서 뭘 할 계획이니?"],["G","My family and I are planning to have a barbecue, take a walk, and look at the stars.","우리 가족과 나는 바비큐를 하고, 산책을 하고, 별을 볼 계획이야."],["B","That sounds really fun. I love going camping.","정말 재미있겠다. 나는 캠핑 가는 것을 아주 좋아해."],["G","Then why don't you come with us?","그럼 우리와 함께 가는 게 어때?"],["B","I'd love to! What time should we meet?","좋아! 몇 시에 만날까?"],["G","We are planning to leave at 9:30 a.m. Can you come to my house around 9:00 a.m.?","우리는 오전 9시 30분에 출발할 계획이야. 오전 9시쯤 우리 집으로 올 수 있니?"],["B","Sure! See you tomorrow!","물론이야! 내일 보자!"]]},{"qs":[{"n":3,"q":"What is the boy going to do at the mall?","o":["He is going to eat out.","He is going to buy a gift.","He is going to meet Somi.","He is going to shop with his mom.","He is going to look around the stores."],"a":1,"ans":"He is going to buy a gift.","evs":[["B: Oh, can I go with you? I have to buy a present for my mom.","아, 나도 함께 가도 될까? 나는 엄마께 드릴 선물을 사야 해."]],"ev":["B: Oh, can I go with you? I have to buy a present for my mom.","아, 나도 함께 가도 될까? 나는 엄마께 드릴 선물을 사야 해."],"ow":["오답 ✕ — 외식을 한다는 말은 대화에 없다. 소년은 'I have to buy a present for my mom.'(나는 엄마께 드릴 선물을 사야 해.)라고 했을 뿐이라 틀림.","정답 ○ — 소년이 'I have to buy a present for my mom.'(나는 엄마께 드릴 선물을 사야 해.)이라고 했으므로 쇼핑몰에서 선물을 살 것이다.","오답 ✕ — Somi와 만나는 곳은 쇼핑몰이 아니라 'meeting at 3:00 p.m. at the bus stop'(오후 3시에 버스 정류장에서 만나는 것)이다. 쇼핑몰에서 할 일이 아니라서 틀림.","오답 ✕ — 엄마와 함께 쇼핑하는 것이 아니라 엄마께 드릴 선물을 사는 것('a present for my mom')이다. 그래서 틀림.","오답 ✕ — 가게를 구경한다는 말은 없다. 소년의 목적은 'buy a present'(선물을 사는 것)로 분명하므로 틀림."],"memo":["정답 ②: 소년은 쇼핑몰에서 선물을 살 것이다.","근거: I have to buy a present for my mom.(나는 엄마께 드릴 선물을 사야 해.)","함정: ④ 엄마와 쇼핑하는 게 아니라 엄마께 드릴 선물을 사는 것 ✕"],"why":"소년은 엄마께 드릴 선물을 사려고 쇼핑몰에 간다."}],"dlg":[["B","The weekend is coming. What are you planning to do, Somi?","주말이 다가오고 있어. 소미야, 뭐 할 계획이니?"],["G","I'm planning to go to the shopping mall this Sunday.","나는 이번 일요일에 쇼핑몰에 갈 계획이야."],["B","Oh, can I go with you? I have to buy a present for my mom.","아, 나도 함께 가도 될까? 나는 엄마께 드릴 선물을 사야 해."],["G","Sure. What time should we meet?","물론이지. 몇 시에 만날까?"],["B","How about meeting at 3:00 p.m. at the bus stop?","오후 3시에 버스 정류장에서 만나는 게 어때?"],["G","Sounds good. See you there.","좋아. 거기서 보자."]]},{"qs":[{"n":4,"q":"위 대화의 주제로 알맞은 것은?","o":["도서관 예절","도서관의 중요성","도서관 방문 계획","책을 대여하는 방법","방문할 도서관 선정"],"a":2,"ans":"도서관 방문 계획","evs":[["G: Let's go to the library tomorrow, Teo. I'm planning to borrow a book.","내일 도서관에 가자, Teo. 나는 책을 한 권 빌릴 계획이야."],["G: Why don't we meet at 1:00 p.m.?","오후 1시에 만나는 게 어때?"]],"ev":["G: Let's go to the library tomorrow, Teo. I'm planning to borrow a book.","내일 도서관에 가자, Teo. 나는 책을 한 권 빌릴 계획이야."],"ow":["오답 ✕ — 도서관에서 지켜야 할 예절에 대한 말은 없다. 'Let's go to the library tomorrow'(내일 도서관에 가자)처럼 방문 약속 이야기라서 틀림.","오답 ✕ — 도서관이 왜 중요한지 설명하는 대화가 아니다. 'I'm planning to borrow a book.'(나는 책을 한 권 빌릴 계획이야.)처럼 개인 계획이라서 틀림.","정답 ○ — 'Let's go to the library tomorrow'(내일 도서관에 가자)라고 제안하고 'Why don't we meet at 1:00 p.m.?'(오후 1시에 만나는 게 어때?)로 시간을 정하므로 도서관 방문 계획이 주제이다.","오답 ✕ — 'borrow a book'(책을 빌리다)이 나오지만 빌리는 방법을 설명하는 대화가 아니다. 방법에 대한 설명이 없어 틀림.","오답 ✕ — 갈 도서관을 고르는 내용은 없고 이미 도서관에 가기로 정한 뒤 만날 시간을 정하는 대화라서 틀림."],"memo":["정답 ③: 대화의 주제는 도서관 방문 계획이다.","근거: Let's go to the library tomorrow(내일 도서관에 가자) / Why don't we meet at 1:00 p.m.?(오후 1시에 만나는 게 어때?)","함정: ④ 책을 빌리는 '방법' 설명은 없다 ✕"],"why":"내일 도서관에 가기로 하고 만날 시간을 정하는 대화이다."}],"dlg":[["G","Let's go to the library tomorrow, Teo. I'm planning to borrow a book.","내일 도서관에 가자, Teo. 나는 책을 한 권 빌릴 계획이야."],["B","Sure. What time should we meet?","좋아. 몇 시에 만날까?"],["G","Why don't we meet at 1:00 p.m.?","오후 1시에 만나는 게 어때?"],["B","Okay. See you then.","좋아. 그때 보자."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["소녀는 이미 스케이트보드를 탈 줄 안다.","소녀는 이번 일요일에 다른 약속이 있다.","진수는 일요일에 스케이트보드를 탈 계획이다.","두 사람은 오후 3시에 만나기로 했다.","두 사람은 센트럴 광장에서 스케이트보드를 사기로 했다."],"a":2,"ans":"진수는 일요일에 스케이트보드를 탈 계획이다.","evs":[["B: I'm planning to ride my skateboard on Sunday. I can teach you.","나는 일요일에 스케이트보드를 탈 계획이야. 내가 가르쳐 줄 수 있어."],["B: Let's meet at 2:00 p.m. at Central Square.","오후 2시에 센트럴 광장에서 만나자."]],"ev":["B: I'm planning to ride my skateboard on Sunday. I can teach you.","나는 일요일에 스케이트보드를 탈 계획이야. 내가 가르쳐 줄 수 있어."],"ow":["오답 ✕ — 소녀는 'I want to try riding a skateboard someday.'(나도 언젠가 스케이트보드를 타 보고 싶어.)라고 했으므로 아직 타 본 적이 없다. 그래서 틀림.","오답 ✕ — 소녀는 'I don't have any plans.'(아무 계획 없어.)라고 했으므로 일요일에 다른 약속이 없다. 그래서 틀림.","정답 ○ — 진수가 'I'm planning to ride my skateboard on Sunday.'(나는 일요일에 스케이트보드를 탈 계획이야.)라고 했으므로 맞다.","오답 ✕ — 진수는 'Let's meet at 2:00 p.m.'(오후 2시에 만나자.)라고 했는데, 이 보기는 3시라고 해서 틀림.","오답 ✕ — 센트럴 광장은 'Let's meet at 2:00 p.m. at Central Square.'(오후 2시에 센트럴 광장에서 만나자.)처럼 만나는 장소이다. 스케이트보드를 사기로 했다는 말은 없어서 틀림."],"memo":["정답 ③: 진수는 일요일에 스케이트보드를 탈 계획이다.","근거: I'm planning to ride my skateboard on Sunday.(나는 일요일에 스케이트보드를 탈 계획이야.)","함정: ④ 만나는 시간은 3시가 아니라 2시 ✕"],"why":"진수는 일요일에 스케이트보드를 탈 계획이고 소녀에게 가르쳐 주기로 한다."}],"dlg":[["G","Jinsu, what is your hobby?","진수야, 네 취미는 뭐니?"],["B","I like to ride my skateboard. It's very fun.","나는 스케이트보드 타는 것을 좋아해. 아주 재미있어."],["G","Wow, that's cool. I want to try riding a skateboard someday.","와, 멋지다. 나도 언젠가 스케이트보드를 타 보고 싶어."],["B","What are you planning to do this Sunday?","너는 이번 일요일에 뭐 할 계획이니?"],["G","I don't have any plans. Why?","아무 계획 없어. 왜?"],["B","I'm planning to ride my skateboard on Sunday. I can teach you.","나는 일요일에 스케이트보드를 탈 계획이야. 내가 가르쳐 줄 수 있어."],["G","Great! What time should we meet?","좋아! 몇 시에 만날까?"],["B","Let's meet at 2:00 p.m. at Central Square.","오후 2시에 센트럴 광장에서 만나자."]]}];var BG=[{"qs":[{"n":6,"q":"다음 글의 내용과 일치하지 않는 것은?","o":["It's the beginning of a new school year.","Bora and Minji have an interest in art.","At first, Bora was happy with Minji's first prize.","Minji tried hard in the school's art competition.","Bora congratulated Minji in the end."],"a":2,"ans":"At first, Bora was happy with Minji's first prize.","evs":[["When she won first prize in the school's art competition, I felt jealous.","그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요."],["I couldn't congratulate her at first.","처음에 나는 그녀를 축하할 수 없었어요."]],"ev":["When she won first prize in the school's art competition, I felt jealous.","그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요."],"ow":["오답 ✕ — 본문에 'A new school year started!'(새로운 학년이 시작되었습니다!)라고 했으므로 이 보기는 본문과 일치한다. 일치하지 않는 것을 고르는 문제라서 틀림.","오답 ✕ — 본문에 'Minji and I are both interested in art.'(민지와 나는 둘 다 미술에 관심이 있어요.)라고 했으므로 이 보기는 본문과 일치해서 틀림.","정답 ○ — 본문에는 'I felt jealous. I couldn't congratulate her at first.'(나는 질투가 났어요. 처음에 나는 그녀를 축하할 수 없었어요.)라고 했는데, 이 보기는 처음에 기뻐했다고 해서 본문과 일치하지 않는다.","오답 ✕ — 본문에 'I knew she worked really hard.'(나는 그녀가 정말 열심히 노력한 것을 알았어요.)라고 했으므로 이 보기는 본문과 일치해서 틀림.","오답 ✕ — 본문에 'Finally, I congratulated her'(결국 나는 그녀를 축하해 주었고)라고 했으므로 이 보기는 본문과 일치해서 틀림."],"memo":["정답 ③: 보라는 처음에는 민지의 우승을 기뻐하지 못했다(질투함).","근거: I felt jealous. I couldn't congratulate her at first.(나는 질투가 났어요. 처음에 나는 그녀를 축하할 수 없었어요.)","함정: 일치하지 않는 것 찾기! at first(처음에)는 질투, finally(결국)는 축하"],"why":"보라는 처음에는 질투가 나서 민지의 우승을 축하하지 못했다."},{"n":7,"q":"다음은 윗글 Bora의 이야기를 요약한 문장이다. 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["jealous - congratulated","jealous - ignored","proud - congratulated","angry - thanked","sad - invited"],"a":0,"ans":"jealous - congratulated","evs":[["When she won first prize in the school's art competition, I felt jealous.","그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요."],["Finally, I congratulated her, and she was happy about it.","결국 나는 그녀를 축하해 주었고 그녀는 그것을 기뻐했어요."]],"ev":["When she won first prize in the school's art competition, I felt jealous.","그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요."],"ow":["정답 ○ — 'I felt jealous'(나는 질투가 났어요)이므로 (A)는 jealous이고, 'Finally, I congratulated her'(결국 나는 그녀를 축하해 주었고)이므로 (B)는 congratulated이다.","오답 ✕ — jealous는 맞지만, 보라는 끝까지 무시한(ignored) 것이 아니라 'Finally, I congratulated her'(결국 나는 그녀를 축하해 주었고)라고 했다.","오답 ✕ — congratulated는 맞지만, 처음 느낀 감정은 자랑스러움(proud)이 아니라 'I felt jealous.'(나는 질투가 났어요.)이다.","오답 ✕ — 화가 났다(angry)는 말은 없고, 'I congratulated her'(나는 그녀를 축하해 주었다)이지 고마워한(thanked) 것도 아니라서 틀림.","오답 ✕ — 슬펐다(sad)는 말도, 민지를 초대했다(invited)는 말도 본문에 없다. 'I felt jealous.'(질투가 났어요.)와 맞지 않아 틀림."],"memo":["정답 jealous - congratulated: 처음엔 질투했지만 결국 축하해 주었다.","근거: I felt jealous.(나는 질투가 났어요.) / Finally, I congratulated her(결국 나는 그녀를 축하해 주었고)","함정: 처음 감정은 proud가 아니라 jealous ✕"],"why":"보라는 질투를 이기고 결국 민지의 우승을 축하해 주었다.","sum":"Bora felt (A)______ when Minji won first prize, but in the end she (B)______ her.","lab":"완성된 요약문 : "}],"pp":[["A new school year started!","새로운 학년이 시작되었습니다!"],["You can make new friends and be a good friend to others, too.","여러분은 새로운 친구를 사귀고, 다른 이들에게 좋은 친구가 될 수도 있습니다."],["What kind of friend do you want to be?","여러분은 어떤 종류의 친구가 되고 싶은가요?"],["Three students will tell you their stories.","세 학생이 여러분에게 그들의 이야기를 들려줄 겁니다."],["Bora","보라"],["I want to be someone who is happy about my friends' good news.","나는 친구의 좋은 소식에 기뻐하는 사람이 되고 싶어요."],["Minji and I are both interested in art.","민지와 나는 둘 다 미술에 관심이 있어요."],["When she won first prize in the school's art competition, I felt jealous.","그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요."],["I couldn't congratulate her at first.","처음에 나는 그녀를 축하할 수 없었어요."],["But I knew she worked really hard.","하지만 나는 그녀가 정말 열심히 노력한 것을 알았어요."],["Finally, I congratulated her, and she was happy about it.","결국 나는 그녀를 축하해 주었고 그녀는 그것을 기뻐했어요."]]},{"qs":[{"n":8,"q":"윗글의 내용과 일치하지 않는 것은?","o":["강민이의 친구는 늘 지각해서 사람들을 기다리게 했다.","강민이는 항상 늦는 친구에게 시간을 지켜줄 것을 요구했다.","강민이는 친구에게 항상 지각하는 문제에 대해 쉽게 이야기했다.","강민이의 친구는 강민이의 조언을 이해했다.","강민이의 친구는 이제 약속에 늦지 않는다."],"a":2,"ans":"강민이는 친구에게 항상 지각하는 문제에 대해 쉽게 이야기했다.","evs":[["Talking to my friend about this problem was not easy.","이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요."],["But thankfully, he understood.","하지만 고맙게도 그는 이해했어요."]],"ev":["Talking to my friend about this problem was not easy.","이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요."],"ow":["오답 ✕ — 본문에 'People had to wait for him, and it made everyone upset.'(사람들은 그를 기다려야 했고, 그게 모두를 속상하게 만들었어요.)라고 했으므로 이 보기는 본문과 일치한다. 일치하지 않는 것을 고르는 문제라서 틀림.","오답 ✕ — 본문에 \"Can you please be on time?\"(시간을 지켜주겠니?)이라고 말했으므로 시간을 지켜줄 것을 요구한 것은 본문과 일치해서 틀림.","정답 ○ — 본문에는 'Talking to my friend about this problem was not easy.'(이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요.)라고 했는데, 이 보기는 쉽게 이야기했다고 해서 본문과 일치하지 않는다.","오답 ✕ — 본문에 'But thankfully, he understood.'(하지만 고맙게도 그는 이해했어요.)라고 했으므로 이 보기는 본문과 일치해서 틀림.","오답 ✕ — 본문에 'Now he is always on time!'(이제 그는 항상 시간을 지켜요!)라고 했으므로 이 보기는 본문과 일치해서 틀림."],"memo":["정답 ③: 강민이는 지각하는 문제를 친구에게 쉽게 이야기하지 못했다.","근거: Talking to my friend about this problem was not easy.(이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요.)","함정: 일치하지 않는 것 찾기! easy(쉬운)가 아니라 not easy(쉽지 않은)"],"why":"강민이는 솔직한 충고를 해 주었고, 쉽지는 않았지만 친구는 이해했다."}],"pp":[["Kangmin","강민"],["I want to be a friend who gives honest advice.","나는 솔직한 충고를 해주는 친구가 되고 싶어요."],["One of my friends was always late.","내 친구 중 하나는 항상 늦었어요."],["People had to wait for him, and it made everyone upset.","사람들은 그를 기다려야 했고, 그게 모두를 속상하게 만들었어요."],["So, I decided to talk to him.","그래서 나는 그에게 이야기하기로 마음을 먹었어요."],["\"Can you please be on time?\"","나는 \"시간을 지켜주겠니?\""],["I said.","라고 말했어요."],["\"We want to fully enjoy our time together.\"","\"우리는 우리의 시간을 온전히 함께 즐기고 싶어."],["Talking to my friend about this problem was not easy.","이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요."],["But thankfully, he understood.","하지만 고맙게도 그는 이해했어요."],["Now he is always on time!","이제 그는 항상 시간을 지켜요!"]]},{"qs":[{"n":9,"q":"윗글의 제목으로 알맞은 것은?","o":["My Hard Time","Cheering Up My Friend","Thank You for Your Help!","Share Your Snack with Friends","Social Media: Space for Your Worries"],"a":1,"ans":"Cheering Up My Friend","evs":[["I try to cheer up my friends when they are having a hard time.","나는 친구들이 function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
