elp others recognize the problem and call for change.","그 목적은 다른 사람들이 문제를 알아차리고 변화를 요구하도록 돕는 것이다."]]},"h":"04ac0bcea1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Rosa’s courage made many people realize how wrong the bus rules were.)","ko":"로자의 용기는 많은 사람들이 버스 규칙이 얼마나 잘못되었는지 ( ) 했다.","opts":["무시하다","깨닫다","잊다","반대하다"],"word":"realize","r":{"a":"2) 깨닫다","w":"11번은 로자의 용기 때문에 사람들이 버스 규칙이 얼마나 wrong(잘못된)인지 ‘알게 되었다’는 내용. realize(깨닫다)가 맞고, 무시하거나 잊었다면 뒤 12번의 보이콧 참여로 이어지지 않음.","c":2,"ev":"11번 문장","s":[[11,"Rosa’s courage made many people realize how wrong the bus rules were.","로자의 용기는 많은 사람들이 버스 규칙이 얼마나 잘못되었는지 깨닫게 했다."]]},"h":"771989b4a6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A woman named Rosa Parks calmly refused to give up her seat.)","ko":"로자 파크스라는 여성이 ( ) 자리 양보를 거부했다.","opts":["침착하게","화가 나서","몰래","서둘러"],"word":"calmly","r":{"a":"1) 침착하게","w":"8번은 로자 파크스가 자리 양보를 거부했다는 내용이고, 9번에서 그녀는 앉은 채로 있다가 체포됨. calmly = 침착하게. 화가 나서·몰래·서둘러는 평화로운 시민 불복종(3번)의 모습과 어울리지 않음.","c":1,"ev":"8번 문장","s":[[8,"One day in Montgomery, Alabama, a woman named Rosa Parks calmly refused to give up her seat.","어느 날 앨라배마주 몽고메리에서 로자 파크스라는 여성이 침착하게 자리 양보를 거부했다."]]},"h":"74d1872c96"},{"n":6,"t":"ref","q":"What does the underlined \"Her action\" refer to?\nHer action became a powerful act of civil disobedience.","ko":"밑줄 친 Her action이 가리키는 것은?","sko":"그녀의 행동은 시민 불복종의 강력한 행위가 되었다.","opts":["로자가 대법원에 간 일","로자가 자리를 양보하지 않고 앉아 있다가 체포된 일","흑인 주민들이 버스를 타지 않은 일","로자가 새 버스 법을 만든 일"],"r":{"a":"2) 로자가 자리를 양보하지 않고 앉아 있다가 체포된 일","w":"10번의 Her action은 앞에서 로자가 한 행동, 즉 8번에서 자리 양보를 거부하고 9번에서 앉은 채 체포된 일을 가리킴. 버스를 타지 않은 일은 그 뒤 12번의 일이고, 법을 만든 사람은 로자가 아님.","c":2,"ev":"8~10번 문장","s":[[8,"One day in Montgomery, Alabama, a woman named Rosa Parks calmly refused to give up her seat.","어느 날 앨라배마주 몽고메리에서 로자 파크스라는 여성이 침착하게 자리 양보를 거부했다."],[9,"Knowing the rule was unfair, she stayed seated and was arrested.","그 규칙이 불공정하다는 것을 알고 있었기에, 그녀는 앉은 채로 있었고 체포되었다."],[10,"Her action became a powerful act of civil disobedience.","그녀의 행동은 시민 불복종의 강력한 행위가 되었다."]]},"h":"615398b1b5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This proved that peaceful civil disobedience can change unfair laws.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 평화적인 시민 불복종이 불공정한 법을 바꿀 수 있음을 증명했다.","opts":["이것은 시민 불복종이 법을 더 불공정하게 만든다는 것을 증명했다.","이것은 폭력적인 시위만이 법을 바꿀 수 있음을 증명했다.","이것은 평화적인 시민 불복종이 불공정한 법을 바꿀 수 있음을 증명했다.","이것은 불공정한 법이 저절로 사라진다는 것을 증명했다."],"r":{"a":"3) 이것은 평화적인 시민 불복종이 불공정한 법을 바꿀 수 있음을 증명했다.","w":"prove(증명하다) that 뒤가 peaceful civil disobedience can change unfair laws(평화적인 시민 불복종이 불공정한 법을 바꿀 수 있다). 폭력이나 저절로 사라진다는 말은 없고, 오히려 법이 바뀌었다는 내용임.","c":3,"ev":"14번 문장","s":[[14,"This proved that peaceful civil disobedience can change unfair laws.","이는 평화적인 시민 불복종이 불공정한 법을 바꿀 수 있음을 증명했다."]]},"h":"b0c23b2125"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["로자 파크스가 체포된 뒤 수천 명의 흑인 주민이 몽고메리 버스 보이콧에 참여했다.","로자 파크스는 백인 승객에게 자리를 양보하고 집으로 돌아갔다.","몽고메리 버스 보이콧은 일주일도 안 되어 끝났다.","미국 연방 대법원은 버스 법이 공정하다고 판결했다."],"opts":["After Rosa Parks was arrested, thousands of Black residents joined the Montgomery Bus Boycott.","Rosa Parks gave up her seat to a white passenger and went home.","The Montgomery Bus Boycott ended in less than a week.","The U.S. Supreme Court decided that the bus laws were fair."],"r":{"a":"1) After Rosa Parks was arrested, thousands of Black residents joined the Montgomery Bus Boycott.","w":"9번에서 로자가 체포되었고 12번에서 그러자 수천 명이 보이콧에 참여했다고 함. 로자는 양보를 거부했고(8번), 시위는 1년이 넘었으며(13번), 대법원은 버스 법이 불법이라고 판결했으므로 나머지는 틀림.","c":1,"ev":"9번, 12~13번 문장","s":[[9,"Knowing the rule was unfair, she stayed seated and was arrested.","그 규칙이 불공정하다는 것을 알고 있었기에, 그녀는 앉은 채로 있었고 체포되었다."],[12,"Thousands of Black residents then joined the Montgomery Bus Boycott and refused to ride the buses.","그러자 수천 명의 흑인 주민들이 몽고메리 버스 보이콧에 참여하여 버스 타기를 거부했다."],[13,"After more than a year of protest, the U.S. Supreme Court ruled the bus laws illegal.","1년이 넘는 시위 끝에 미국 연방 대법원은 버스 법이 불법이라고 판결했다."]]},"h":"185c0b9466"},{"n":9,"t":"sum","q":"Civil disobedience is the act of (A) breaking an unfair law to show it is wrong, and its purpose is to help others (B) the problem.","ko":"시민 불복종은 불공정한 법이 잘못되었음을 보여 주려고 그 법을 (A) 어기는 행위이고, 그 목적은 다른 사람들이 문제를 (B)도록 돕는 것이다.","oko":["(A) 폭력적으로 / (B) 알아차리","(A) 평화롭게 / (B) 무시하","(A) 몰래 / (B) 해결하","(A) 빠르게 / (B) 잊","(A) 평화롭게 / (B) 알아차리"],"opts":["(A) violently / (B) recognize","(A) peacefully / (B) ignore","(A) secretly / (B) solve","(A) quickly / (B) forget","(A) peacefully / (B) recognize"],"r":{"a":"5) (A) peacefully / (B) recognize","w":"3번에서 불공정한 법을 peacefully(평화롭게) 어긴다고 하고, 4번에서 목적은 다른 사람들이 문제를 recognize(알아차리다)하도록 돕는 것이라고 함. 따라서 (A) peacefully, (B) recognize.","c":5,"ev":"3~4번 문장","s":[[3,"Civil disobedience is the act of peacefully breaking an unfair law to show it’s wrong.","시민 불복종은 불공정한 법이 잘못되었음을 보여 주기 위해 그 법을 평화롭게 어기는 행위이다."],[4,"Its purpose is to help others recognize the problem and call for change.","그 목적은 다른 사람들이 문제를 알아차리고 변화를 요구하도록 돕는 것이다."]]},"h":"1ad4517519"},{"n":10,"t":"fill","q":"Rosa Parks’ act of civil [A] led thousands of Black residents to join the bus [B].","ko":"로자 파크스의 시민 [A] 행동은 수천 명의 흑인 주민이 버스 [B]에 참여하도록 이끌었다.","bank":["disobedience","boycott","passengers","seats","residents","illegal"],"bko":{"disobedience":"불복종","boycott":"보이콧","passengers":"승객","seats":"좌석","residents":"주민","illegal":"불법의"},"r":{"a":"[A] disobedience, [B] boycott","w":"10번에서 로자의 행동이 시민 불복종(civil disobedience)이 되었고, 12번에서 수천 명이 몽고메리 버스 보이콧(boycott)에 참여했다고 함. passengers, seats, residents는 본문 단어지만 이 빈칸 자리에 쓰면 뜻이 맞지 않음.","c":null,"ev":"10번, 12번 문장","s":[[10,"Her action became a powerful act of civil disobedience.","그녀의 행동은 시민 불복종의 강력한 행위가 되었다."],[12,"Thousands of Black residents then joined the Montgomery Bus Boycott and refused to ride the buses.","그러자 수천 명의 흑인 주민들이 몽고메리 버스 보이콧에 참여하여 버스 타기를 거부했다."]]},"h":"22f79b1735"}]},{"u":9,"id":"b4-09-4","no":4,"ko":"권력을 셋으로 나누는 이유는?","items":[{"n":1,"t":"tf","q":"Under the separation of powers, the government is divided into three branches.","ko":"삼권분립 아래에서 정부는 세 개의 부로 나뉜다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장에 the government is divided into three branches가 그대로 나옴. 2번에서 이 제도의 이름이 삼권분립이라고 했으므로 일치.","c":"T","ev":"3번 문장","s":[[3,"Under this system, the government is divided into three branches.","이 제도 아래에서 정부는 세 개의 부로 나뉜다."]]},"h":"f99193c79a"},{"n":2,"t":"tf","q":"A president or prime minister leads the judicial branch.","ko":"대통령이나 총리가 사법부를 이끈다.","r":{"a":"F (본문과 다른 내용)","w":"7번 문장에서 대통령이나 총리가 이끄는 부는 this branch, 즉 6번의 행정부(executive branch)임. 사법부는 판사와 법원이 맡으므로(9번) 틀림.","c":"F","ev":"7번 문장","s":[[7,"A president or prime minister leads this branch and makes sure the laws are obeyed.","대통령이나 총리가 이 부를 이끌며 법이 지켜지도록 보장한다."]]},"h":"bbc22e5541"},{"n":3,"t":"tf","q":"The judicial branch can cancel any law that goes against the Constitution.","ko":"사법부는 헌법에 어긋나는 어떤 법이든 무효로 할 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"13번 문장에 The judicial branch can cancel any law that goes against the Constitution이 그대로 있음. 헌법에 어긋나는 법을 무효로 하는 것이 사법부의 견제 방법임.","c":"T","ev":"13번 문장","s":[[13,"The judicial branch can cancel any law that goes against the Constitution.","사법부는 헌법에 어긋나는 어떤 법이든 무효로 할 수 있다."]]},"h":"88774891f1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A president or prime minister leads this branch and makes sure the laws are obeyed.)","ko":"대통령이나 총리가 이 부를 이끌며 법이 ( ) 보장한다.","opts":["무시되다","지켜지다","바뀌다","잊히다"],"word":"obeyed","r":{"a":"2) 지켜지다","w":"7번은 행정부가 법을 집행하는 일(6번)을 하면서 법이 ‘지켜지도록’ 한다는 내용. obey(따르다, 지키다)의 수동 형태 obeyed는 ‘지켜지다’. 무시되거나 잊히면 집행한다는 말과 맞지 않음.","c":2,"ev":"7번 문장","s":[[7,"A president or prime minister leads this branch and makes sure the laws are obeyed.","대통령이나 총리가 이 부를 이끌며 법이 지켜지도록 보장한다."]]},"h":"2af26b142a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The executive branch can reject a law passed by the legislative branch.)","ko":"행정부는 입법부가 통과시킨 법을 ( ) 수 있다.","opts":["받아들이다","만들다","설명하다","거부하다"],"word":"reject","r":{"a":"4) 거부하다","w":"11번은 한 부가 다른 부를 견제하는 예(10번 check one another)임. 행정부가 입법부의 법을 거부하는 것이 견제이므로 reject(거부하다)가 맞음. 받아들이면 견제가 되지 않음.","c":4,"ev":"11번 문장","s":[[11,"For example, the executive branch can reject a law passed by the legislative branch.","예를 들어, 행정부는 입법부가 통과시킨 법을 거부할 수 있다."]]},"h":"2349a79d4c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nEach branch has its own powers, but they can also check one another.","ko":"밑줄 친 they가 가리키는 것은?","sko":"각 부는 자신만의 권한을 가지지만, 서로를 견제할 수도 있다.","opts":["선출된 대표들","입법부, 행정부, 사법부 세 부","판사와 법원","대통령과 총리"],"r":{"a":"2) 입법부, 행정부, 사법부 세 부","w":"10번의 Each branch(각 부)에 이어지는 they는 3번에서 나뉜 세 개의 부, 즉 입법부·행정부·사법부를 가리킴. check one another(서로 견제)는 세 부 사이의 관계를 말함.","c":2,"ev":"3번, 10번 문장","s":[[3,"Under this system, the government is divided into three branches.","이 제도 아래에서 정부는 세 개의 부로 나뉜다."],[10,"Each branch has its own powers, but they can also check one another.","각 부는 자신만의 권한을 가지지만, 서로를 견제할 수도 있다."]]},"h":"d6ad08d2e6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In a democracy, power must be shared so that no one has too much control.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"민주주의에서는 아무도 너무 많은 통제권을 갖지 않도록 권력이 나뉘어야 한다.","opts":["민주주의에서는 권력이 나뉘어야 누구도 지나치게 많은 통제권을 갖지 않는다.","민주주의에서는 한 사람이 모든 권력을 가져야 통제가 쉽다.","민주주의에서는 누구도 권력을 가져서는 안 된다.","민주주의에서는 권력이 클수록 모두에게 공정하다."],"r":{"a":"1) 민주주의에서는 권력이 나뉘어야 누구도 지나치게 많은 통제권을 갖지 않는다.","w":"power must be shared는 ‘권력이 나뉘어야 한다’, so that no one has too much control은 ‘누구도 통제권을 너무 많이 갖지 않도록’이라는 뜻. 한 사람이 모든 권력을 갖는다는 말은 정반대임.","c":1,"ev":"1번 문장","s":[[1,"In a democracy, power must be shared so that no one has too much control.","민주주의에서는 아무도 너무 많은 통제권을 갖지 않도록 권력이 나뉘어야 한다."]]},"h":"52f8da50e6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["행정부는 법을 만들고 입법부는 그 법을 집행한다.","입법부는 행정부가 통과시킨 법을 거부할 수 있다.","입법부는 행정부가 권력을 사용하는 방식을 검토하고 제한할 수 있다.","사법부는 대통령이나 총리가 이끈다."],"opts":["The executive branch makes the laws, and the legislative branch carries them out.","The legislative branch can reject a law passed by the executive branch.","The legislative branch can review and limit how the executive branch uses its power.","The judicial branch is led by a president or prime minister."],"r":{"a":"3) The legislative branch can review and limit how the executive branch uses its power.","w":"12번에서 입법부는 행정부가 권력을 쓰는 방식을 검토하고 제한할 수 있다고 함. 법을 만드는 곳은 입법부(4번), 집행하는 곳은 행정부(6번)이고, 법을 거부하는 쪽은 행정부(11번), 대통령·총리가 이끄는 곳도 행정부(7번)라 나머지는 틀림.","c":3,"ev":"4번, 6~7번, 11~12번 문장","s":[[4,"The legislative branch makes the laws.","입법부는 법을 만든다."],[6,"The executive branch carries out the laws.","행정부는 법을 집행한다."],[7,"A president or prime minister leads this branch and makes sure the laws are obeyed.","대통령이나 총리가 이 부를 이끌며 법이 지켜지도록 보장한다."],[11,"For example, the executive branch can reject a law passed by the legislative branch.","예를 들어, 행정부는 입법부가 통과시킨 법을 거부할 수 있다."],[12,"The legislative branch can review and limit how the executive branch uses its power.","입법부는 행정부가 권력을 사용하는 방식을 검토하고 제한할 수 있다."]]},"h":"b90465159b"},{"n":9,"t":"sum","q":"The legislative branch (A) the laws, and the judicial branch (B) them.","ko":"입법부는 법을 (A) 사법부는 그 법을 (B).","oko":["(A) 해석하고 / (B) 만든다","(A) 만들고 / (B) 집행한다","(A) 집행하고 / (B) 해석한다","(A) 거부하고 / (B) 만든다","(A) 만들고 / (B) 해석한다"],"opts":["(A) interprets / (B) makes","(A) makes / (B) carries out","(A) carries out / (B) interprets","(A) rejects / (B) makes","(A) makes / (B) interprets"],"r":{"a":"5) (A) makes / (B) interprets","w":"4번에서 입법부는 법을 만들고(makes), 8번에서 사법부는 법을 해석함(interprets). 법을 집행하는(carries out) 것은 6번의 행정부임.","c":5,"ev":"4번, 8번 문장","s":[[4,"The legislative branch makes the laws.","입법부는 법을 만든다."],[8,"The judicial branch interprets the laws.","사법부는 법을 해석한다."]]},"h":"7136bb838b"},{"n":10,"t":"fill","q":"The government is divided into three [A], and each one can [B] the others.","ko":"정부는 세 개의 [A]로 나뉘며, 각각은 다른 부를 [B]할 수 있다.","bank":["branches","check","laws","judges","president","balanced"],"bko":{"branches":"부(갈래)","check":"견제하다","laws":"법","judges":"판사","president":"대통령","balanced":"균형 잡힌"},"r":{"a":"[A] branches, [B] check","w":"3번에서 정부는 세 개의 branches(부)로 나뉜다고 했고, 10번에서 서로 check(견제)할 수 있다고 함. laws, judges, president는 부 이름이 아니고, balanced는 형용사라 동사 자리에 들어가지 못함.","c":null,"ev":"3번, 10번 문장","s":[[3,"Under this system, the government is divided into three branches.","이 제도 아래에서 정부는 세 개의 부로 나뉜다."],[10,"Each branch has its own powers, but they can also check one another.","각 부는 자신만의 권한을 가지지만, 서로를 견제할 수도 있다."]]},"h":"ad21e42191"}]},{"u":10,"id":"b4-10-1","no":1,"ko":"모나리자를 유명하게 만든 도둑","items":[{"n":1,"t":"tf","q":"Vincenzo Peruggia had once worked at the Louvre Museum.","ko":"빈센초 페루자는 한때 루브르 박물관에서 일한 적이 있었다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장에 a man named Vincenzo Peruggia, who had once worked at the Louvre가 있음. 한때 루브르에서 일했다는 내용과 일치.","c":"T","ev":"3번 문장","s":[[3,"One morning, a man named Vincenzo Peruggia, who had once worked at the Louvre, walked into the museum wearing a worker’s uniform.","어느 날 아침, 한때 루브르에서 일한 적이 있는 빈센초 페루자라는 남자가 작업복을 입고 박물관 안으로 걸어 들어갔다."]]},"h":"8188c3c79e"},{"n":2,"t":"tf","q":"People noticed that the Mona Lisa was gone on the same morning it was stolen.","ko":"사람들은 「모나리자」가 도난당한 바로 그날 아침에 그림이 없어진 것을 알아차렸다.","r":{"a":"F (본문과 다른 내용)","w":"5번 문장은 It wasn’t until the next day that anyone noticed(다음 날이 되어서야 알아차렸다)라고 함. 같은 날 아침이라는 선지는 틀림.","c":"F","ev":"5번 문장","s":[[5,"It wasn’t until the next day that anyone noticed it was gone.","다음 날이 되어서야 비로소 누군가가 그림이 없어진 것을 알아차렸다."]]},"h":"ed16df804c"},{"n":3,"t":"tf","q":"The Mona Lisa remained missing for more than two years.","ko":"「모나리자」는 2년이 넘는 동안 행방불명 상태였다.","r":{"a":"T (본문과 맞는 내용)","w":"8번 문장 For more than two years, the Mona Lisa remained missing과 같은 내용. remain missing은 계속 행방불명인 채로 있었다는 뜻.","c":"T","ev":"8번 문장","s":[[8,"For more than two years, the Mona Lisa remained missing.","2년이 넘는 동안 「모나리자」는 행방불명 상태였다."]]},"h":"ba281d51a7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…until one daring theft changed everything.)","ko":"… ( ) 도난 사건 하나가 모든 것을 바꾸기 전까지","opts":["느린","조용한","대담한","어리석은"],"word":"daring","r":{"a":"3) 대담한","w":"2번의 daring theft는 사람들이 거의 몰랐던 그림을 훔쳐 모든 것을 바꾼 사건. 3~4번에서 박물관에서 그림을 떼어 외투 속에 숨겨 나간 일이므로 ‘대담한’이 맞음.","c":3,"ev":"2번 문장","s":[[2,"But more than a century ago, few people had even noticed it in the Louvre Museum until one daring theft changed everything.","하지만 100여 년 전에는 대담한 도난 사건 하나가 모든 것을 바꾸기 전까지 루브르 박물관에 있던 이 그림을 알아차린 사람이 거의 없었다."]]},"h":"dd6cc5cc7a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Ironically, the theft turned a little-known painting into a world-famous masterpiece.)","ko":"( ), 그 도난 사건이 거의 알려지지 않았던 그림을 세계적으로 유명한 걸작으로 만들었다.","opts":["당연하게도","역설적이게도","불행하게도","갑작스럽게"],"word":"Ironically","r":{"a":"2) 역설적이게도","w":"12번은 그림을 도둑맞은 나쁜 일이 오히려 세계적으로 유명하게 만든 좋은 결과가 되었다는 내용. 이렇게 기대와 반대로 되는 것을 ‘역설적이게도’라고 함.","c":2,"ev":"12번 문장","s":[[12,"Ironically, the theft turned a little-known painting into a world-famous masterpiece.","아이러니하게도, 그 도난 사건이 거의 알려지지 않았던 그림을 세계적으로 유명한 걸작으로 만들었다."]]},"h":"cd0703053e"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSince then, even bigger crowds have come to see it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그 이후로 훨씬 더 많은 인파가 그것을 보러 왔다.","opts":["루브르 박물관","빈 공간","피렌체의 미술품 거래상","「모나리자」"],"r":{"a":"4) 「모나리자」","w":"10번에서 마침내 돌아온 the painting이 11번 Since then, ... see it의 it임. 사람들이 보러 오는 대상은 그림 「모나리자」이지 박물관이나 거래상이 아님.","c":4,"ev":"10~11번 문장","s":[[10,"The dealer informed the police, and the painting was finally returned.","그 거래상은 경찰에 알렸고, 그림은 마침내 돌아왔다."],[11,"Since then, even bigger crowds have come to see it.","그 이후로 훨씬 더 많은 인파가 그것을 보러 왔다."]]},"h":"351da1e0c9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Ironically, the theft turned a little-known painting into a world-famous masterpiece.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아이러니하게도, 그 도난 사건이 거의 알려지지 않았던 그림을 세계적으로 유명한 걸작으로 만들었다.","opts":["도난 사건이 오히려 거의 알려지지 않았던 그림을 세계적으로 유명한 걸작으로 만들었다.","도난 사건 때문에 유명했던 그림의 가치가 크게 떨어졌다.","도난 사건 때문에 유명한 그림이 사람들에게 잊혔다.","도난 사건 뒤 걸작이 루브르에서 영원히 사라졌다."],"r":{"a":"1) 도난 사건이 오히려 거의 알려지지 않았던 그림을 세계적으로 유명한 걸작으로 만들었다.","w":"turn A into B는 A를 B로 바꾸다. 거의 알려지지 않았던 그림(A)이 세계적으로 유명한 걸작(B)이 되었다는 뜻이라 1번이 맞음. 2~4번은 결과가 반대이거나 본문에 없는 내용임.","c":1,"ev":"12번 문장","s":[[12,"Ironically, the theft turned a little-known painting into a world-famous masterpiece.","아이러니하게도, 그 도난 사건이 거의 알려지지 않았던 그림을 세계적으로 유명한 걸작으로 만들었다."]]},"h":"a918438fb9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["페루자는 루브르에서 일한 적이 한 번도 없었다.","페루자가 직접 루브르에 그림을 돌려주어 그림이 돌아왔다.","피렌체의 미술품 거래상이 경찰에 알려서 그림이 돌아왔다.","루브르는 도난 사건이 있던 날 아침에 바로 알아차렸다."],"opts":["Peruggia had never worked at the Louvre.","The painting came back because Peruggia returned it to the Louvre himself.","The painting came back because an art dealer in Florence told the police.","The Louvre noticed the theft on the same morning."],"r":{"a":"3) The painting came back because an art dealer in Florence told the police.","w":"9번에서 페루자가 피렌체의 미술품 거래상에게 팔려고 했고, 10번에서 그 거래상이 경찰에 알려 그림이 돌아왔다고 함. 페루자는 루브르에서 일한 적이 있었고(3번), 도난은 다음 날에야 알려졌으며(5번), 페루자가 직접 돌려주지 않았음.","c":3,"ev":"3번, 5번, 9~10번 문장","s":[[3,"One morning, a man named Vincenzo Peruggia, who had once worked at the Louvre, walked into the museum wearing a worker’s uniform.","어느 날 아침, 한때 루브르에서 일한 적이 있는 빈센초 페루자라는 남자가 작업복을 입고 박물관 안으로 걸어 들어갔다."],[5,"It wasn’t until the next day that anyone noticed it was gone.","다음 날이 되어서야 비로소 누군가가 그림이 없어진 것을 알아차렸다."],[9,"Then, in 1913, Peruggia tried to sell it to an art dealer in Florence, Italy.","그러다 1913년에 페루자는 이탈리아 피렌체의 한 미술품 거래상에게 그것을 팔려고 했다."],[10,"The dealer informed the police, and the painting was finally returned.","그 거래상은 경찰에 알렸고, 그림은 마침내 돌아왔다."]]},"h":"7c5a779e26"},{"n":9,"t":"sum","q":"The man hid the Mona Lisa under his (A) coat, and the painting remained (B) for more than two years.","ko":"그 남자는 「모나리자」를 외투 속에 (A), 그림은 2년이 넘는 동안 (B) 상태였다.","oko":["(A) 보여 줬고 / (B) 행방불명","(A) 숨겼고 / (B) 유명","(A) 팔았고 / (B) 숨겨진","(A) 그렸고 / (B) 행방불명","(A) 숨겼고 / (B) 행방불명"],"opts":["(A) showed / (B) missing","(A) hid / (B) famous","(A) sold / (B) hidden","(A) painted / (B) missing","(A) hid / (B) missing"],"r":{"a":"5) (A) hid / (B) missing","w":"4번에서 페루자가 그림을 외투 속에 숨겼고(hid), 8번에서 그림이 2년 넘게 행방불명(missing)이었다고 함. famous는 도난 이후 결과이고, 팔려고 한 건 1913년(9번)임.","c":5,"ev":"4번, 8번 문장","s":[[4,"He quietly removed the painting from the wall, hid it under his coat, and walked out of the museum.","그는 조용히 벽에서 그림을 떼어 내 외투 속에 숨기고 박물관 밖으로 걸어 나갔다."],[8,"For more than two years, the Mona Lisa remained missing.","2년이 넘는 동안 「모나리자」는 행방불명 상태였다."]]},"h":"d85450278e"},{"n":10,"t":"fill","q":"Since the theft, the Mona Lisa has become a world-[A] masterpiece, and even bigger [B] come to see it.","ko":"도난 사건 이후 「모나리자」는 세계적으로 [A]한 걸작이 되었고, 훨씬 더 많은 [B]가 그것을 보러 온다.","bank":["famous","crowds","uniform","coat","dealer","headlines"],"bko":{"famous":"유명한","crowds":"인파, 군중","uniform":"제복, 작업복","coat":"외투","dealer":"거래상","headlines":"머리기사"},"r":{"a":"[A] famous, [B] crowds","w":"12번에서 세계적으로 유명한(world-famous) 걸작이 되었고, 11번에서 훨씬 더 큰 인파(crowds)가 보러 왔다고 함. uniform, coat, dealer는 도난 이야기 속 물건·사람이고, headlines는 소식이지 보러 오는 대상이 아님.","c":null,"ev":"11~12번 문장","s":[[11,"Since then, even bigger crowds have come to see it.","그 이후로 훨씬 더 많은 인파가 그것을 보러 왔다."],[12,"Ironically, the theft turned a little-known painting into a world-famous masterpiece.","아이러니하게도, 그 도난 사건이 거의 알려지지 않았던 그림을 세계적으로 유명한 걸작으로 만들었다."]]},"h":"7ec2cdbaf7"}]},{"u":10,"id":"b4-10-2","no":2,"ko":"한 시간도 안 걸린 전쟁이 있다고?","items":[{"n":1,"t":"tf","q":"At that time, Zanzibar was under British control.","ko":"당시 잔지바르는 영국의 지배를 받고 있었다.","r":{"a":"T (본문과 맞는 내용)","w":"5번 문장 At that time, Zanzibar was under British control이 그대로 나옴. under control은 지배 아래에 있다는 뜻이라 선지와 일치.","c":"T","ev":"5번 문장","s":[[5,"At that time, Zanzibar was under British control.","당시 잔지바르는 영국의 지배를 받고 있었다."]]},"h":"128b9b3f71"},{"n":2,"t":"tf","q":"Khalid took power with approval from Britain.","ko":"칼리드는 영국의 승인을 받아 권력을 잡았다.","r":{"a":"F (본문과 다른 내용)","w":"6번 문장에서 칼리드는 without British approval(영국의 승인 없이) 권력을 잡았다고 함. with와 without이 반대라서 틀림.","c":"F","ev":"6번 문장","s":[[6,"When the pro-British Sultan of Zanzibar died on August 25, his cousin Khalid took power without British approval.","8월 25일에 친영국 성향의 잔지바르 술탄이 죽자, 그의 사촌 칼리드가 영국의 승인 없이 권력을 잡았다."]]},"h":"5c70378b95"},{"n":3,"t":"tf","q":"The British positioned five warships in the harbor.","ko":"영국은 항구에 다섯 척의 군함을 배치했다.","r":{"a":"T (본문과 맞는 내용)","w":"9번 문장 the British positioned five warships in the harbor와 같은 내용. 칼리드가 궁전을 지킬 준비를 하자 영국이 대응한 것임.","c":"T","ev":"9번 문장","s":[[9,"In response, the British positioned five warships in the harbor.","이에 대응하여 영국은 항구에 다섯 척의 군함을 배치했다."]]},"h":"93b2655711"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (His cousin Khalid took power without British approval.)","ko":"그의 사촌 칼리드가 영국의 ( ) 없이 권력을 잡았다.","opts":["반대","승인","도움","질문"],"word":"approval","r":{"a":"2) 승인","w":"6번은 칼리드가 영국의 ‘허락 없이’ 권력을 잡았다는 내용이고, 그래서 7번에서 영국이 칼리드에게 물러나라고 명령함. approval은 승인, 허락이라는 뜻.","c":2,"ev":"6번 문장","s":[[6,"When the pro-British Sultan of Zanzibar died on August 25, his cousin Khalid took power without British approval.","8월 25일에 친영국 성향의 잔지바르 술탄이 죽자, 그의 사촌 칼리드가 영국의 승인 없이 권력을 잡았다."]]},"h":"99bd095fd6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The British quickly installed their chosen leader as the new Sultan.)","ko":"영국은 재빨리 자신들이 선택한 지도자를 새 술탄으로 ( ).","opts":["쫓아냈다","잊어버렸다","도와주었다","임명했다"],"word":"installed","r":{"a":"4) 임명했다","w":"12번에서 칼리드는 도망쳤고, 영국이 자신들이 고른 지도자를 새 술탄 자리에 올려놓았음. install은 어떤 자리에 앉히다, 임명하다는 뜻. 지도자를 쫓아내거나 잊거나 돕는 내용이 아니라 자리에 올린 것임.","c":4,"ev":"12번 문장","s":[[12,"Khalid escaped to the German embassy, and the British quickly installed their chosen leader as the new Sultan.","칼리드는 독일 대사관으로 도망쳤고, 영국은 재빨리 자신들이 선택한 지도자를 새 술탄으로 앉혔다."]]},"h":"ab247496f8"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nBritain wanted a new Sultan who would support their control, so they ordered Khalid to step down by 9:00 a.m. on August 27.","ko":"밑줄 친 they가 가리키는 것은?","sko":"영국은 자신들의 지배를 지지해 줄 새 술탄을 원했기 때문에, 칼리드에게 8월 27일 오전 9시까지 물러나라고 명령했다.","opts":["영국","칼리드","잔지바르의 술탄","독일 사람들"],"r":{"a":"1) 영국","w":"7번 문장의 주어는 Britain이고, so 뒤의 they가 그 영국을 받음. 명령을 받은 쪽(ordered Khalid)이 칼리드이므로 they는 칼리드가 아님. 6번에서 칼리드는 술탄의 사촌임.","c":1,"ev":"6~7번 문장","s":[[6,"When the pro-British Sultan of Zanzibar died on August 25, his cousin Khalid took power without British approval.","8월 25일에 친영국 성향의 잔지바르 술탄이 죽자, 그의 사촌 칼리드가 영국의 승인 없이 권력을 잡았다."],[7,"Britain wanted a new Sultan who would support their control, so they ordered Khalid to step down by 9:00 a.m. on August 27.","영국은 자신들의 지배를 지지해 줄 새 술탄을 원했기 때문에, 칼리드에게 8월 27일 오전 9시까지 물러나라고 명령했다."]]},"h":"f0f2bad473"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This brief battle became the shortest war in history and an example of how easily a powerful country could control a smaller one in the past.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 짧은 전투는 역사상 가장 짧은 전쟁이 되었고, 과거에 강대국이 약소국을 얼마나 쉽게 지배할 수 있었는지를 보여 주는 사례가 되었다.","opts":["이 짧은 전투는 작은 나라가 강한 나라를 쉽게 이긴 사례였다.","이 짧은 전투는 역사상 가장 긴 전쟁 중 하나가 되었다.","이 짧은 전투는 역사상 가장 짧은 전쟁이자, 강대국이 약소국을 쉽게 지배했음을 보여 주는 사례였다.","이 짧은 전투는 두 나라가 평화롭게 협상한 사례였다."],"r":{"a":"3) 이 짧은 전투는 역사상 가장 짧은 전쟁이자, 강대국이 약소국을 쉽게 지배했음을 보여 주는 사례였다.","w":"shortest war in history는 역사상 가장 짧은 전쟁이고, how easily a powerful country could control a smaller one은 강대국이 약소국을 얼마나 쉽게 지배했는지임. 이긴 쪽은 강한 영국이었으므로 1번은 반대이고, 긴 전쟁이나 협상 이야기는 없음.","c":3,"ev":"13번 문장","s":[[13,"This brief battle became the shortest war in history and an example of how easily a powerful country could control a smaller one in the past.","이 짧은 전투는 역사상 가장 짧은 전쟁이 되었고, 과거에 강대국이 약소국을 얼마나 쉽게 지배할 수 있었는지를 보여 주는 사례가 되었다."]]},"h":"706d58e551"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["칼리드는 영국의 명령대로 오전 9시까지 물러났다.","영국의 군함들은 기한이 지나기 전에 포격을 시작했다.","칼리드의 깃발은 하루가 넘는 싸움 끝에 내려졌다.","칼리드는 궁전이 파괴된 뒤 독일 대사관으로 도망쳤다."],"opts":["Khalid stepped down by 9:00 a.m. as the British ordered.","The British ships started firing before the deadline passed.","Khalid’s flag came down after more than a day of fighting.","Khalid escaped to the German embassy after the palace was destroyed."],"r":{"a":"4) Khalid escaped to the German embassy after the palace was destroyed.","w":"11번에서 궁전이 파괴되고 깃발이 내려진 뒤, 12번에서 칼리드가 독일 대사관으로 도망쳤다고 함. 칼리드는 물러나기를 거부했고(8번), 포격은 기한이 지난 뒤(10번), 전투는 38분(11번)이라 나머지는 틀림.","c":4,"ev":"7~8번, 10~12번 문장","s":[[7,"Britain wanted a new Sultan who would support their control, so they ordered Khalid to step down by 9:00 a.m. on August 27.","영국은 자신들의 지배를 지지해 줄 새 술탄을 원했기 때문에, 칼리드에게 8월 27일 오전 9시까지 물러나라고 명령했다."],[8,"But Khalid refused and prepared to defend the palace with about 3,000 men and cannons.","하지만 칼리드는 거부했고 약 3,000명의 병력과 대포로 궁전을 지킬 준비를 했다."],[10,"When the deadline passed, the ships opened fire.","기한이 지나자 군함들이 포격을 시작했다."],[11,"In just 38 minutes, the palace was destroyed, and Khalid’s flag came down.","단 38분 만에 궁전은 파괴되었고 칼리드의 깃발이 내려졌다."],[12,"Khalid escaped to the German embassy, and the British quickly installed their chosen leader as the new Sultan.","칼리드는 독일 대사관으로 도망쳤고, 영국은 재빨리 자신들이 선택한 지도자를 새 술탄으로 앉혔다."]]},"h":"aa1d15b6d9"},{"n":9,"t":"sum","q":"The war between Britain and Zanzibar lasted only (A) minutes, which made it the (B) war in history.","ko":"영국과 잔지바르의 전쟁은 단 (A)분 동안 이어졌고, 이로써 역사상 (B) 전쟁이 되었다.","oko":["(A) 38 / (B) 가장 긴","(A) 3,000 / (B) 가장 짧은","(A) 9 / (B) 가장 긴","(A) 27 / (B) 가장 짧은","(A) 38 / (B) 가장 짧은"],"opts":["(A) 38 / (B) longest","(A) 3,000 / (B) shortest","(A) 9 / (B) longest","(A) 27 / (B) shortest","(A) 38 / (B) shortest"],"r":{"a":"5) (A) 38 / (B) shortest","w":"11번에서 In just 38 minutes(단 38분 만에)에 끝났고, 13번에서 the shortest war in history(역사상 가장 짧은 전쟁)가 되었다고 함. 3,000은 칼리드의 병력 수(8번), 9와 27은 기한의 시각과 날짜(7번)임.","c":5,"ev":"11번, 13번 문장","s":[[11,"In just 38 minutes, the palace was destroyed, and Khalid’s flag came down.","단 38분 만에 궁전은 파괴되었고 칼리드의 깃발이 내려졌다."],[13,"This brief battle became the shortest war in history and an example of how easily a powerful country could control a smaller one in the past.","이 짧은 전투는 역사상 가장 짧은 전쟁이 되었고, 과거에 강대국이 약소국을 얼마나 쉽게 지배할 수 있었는지를 보여 주는 사례가 되었다."]]},"h":"e3e5718fc8"},{"n":10,"t":"fill","q":"Britain wanted a new Sultan who would [A] their control, so they ordered Khalid to step [B].","ko":"영국은 자신들의 지배를 [A]해 줄 새 술탄을 원했기 때문에, 칼리드에게 물러나라(step [B])고 명령했다.","bank":["support","down","escape","destroy","cannons","warships"],"bko":{"support":"지지하다","down":"아래로(내려)","escape":"도망치다","destroy":"파괴하다","cannons":"대포","warships":"군함"},"r":{"a":"[A] support, [B] down","w":"7번에서 영국은 자신들의 지배를 support(지지하다)해 줄 새 술탄을 원했고, step down(물러나다)하라고 명령했음. escape와 destroy는 11~12번 전투 뒤의 일이고, cannons·warships는 명사라 동사 자리에 들어갈 수 없음.","c":null,"ev":"7번 문장","s":[[7,"Britain wanted a new Sultan who would support their control, so they ordered Khalid to step down by 9:00 a.m. on August 27.","영국은 자신들의 지배를 지지해 줄 새 술탄을 원했기 때문에, 칼리드에게 8월 27일 오전 9시까지 물러나라고 명령했다."]]},"h":"fa47037bba"}]},{"u":10,"id":"b4-10-3","no":3,"ko":"무고한 사람들을 마녀로 몰았던 마녀사냥","items":[{"n":1,"t":"tf","q":"The fears about evil magic led to what we now call “witch hunts.”","ko":"사악한 마법에 대한 두려움은 오늘날 우리가 ‘마녀사냥’이라고 부르는 것으로 이어졌다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장 These fears led to what we now call “witch hunts.”와 같은 내용. These fears는 1번에서 마법 때문이라고 믿은 두려움임.","c":"T","ev":"2번 문장","s":[[2,"These fears led to what we now call “witch hunts.”","이러한 두려움은 오늘날 우리가 ‘마녀사냥’이라고 부르는 것으로 이어졌다."]]},"h":"6b0d7a7c20"},{"n":2,"t":"tf","q":"Witch hunts continued for only a few years.","ko":"마녀사냥은 몇 년 동안만 이어졌다.","r":{"a":"F (본문과 다른 내용)","w":"9번 문장에서 For nearly 300 years, thousands of innocent people lost their lives(거의 300년 동안 수천 명이 목숨을 잃었다)라고 함. 몇 년이 아니라 거의 300년이라 틀림.","c":"F","ev":"9번 문장","s":[[9,"For nearly 300 years, thousands of innocent people lost their lives.","거의 300년 동안 수천 명의 죄 없는 사람들이 목숨을 잃었다."]]},"h":"6ab90db83b"},{"n":3,"t":"tf","q":"People who were poor, elderly, or lived alone were often labeled as witches.","ko":"가난하거나 나이 들었거나 혼자 사는 사람들이 흔히 마녀로 낙인찍혔다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 They were often poor or elderly women, or people who lived alone과 같은 내용. 3번에서 마녀로 낙인찍힌 사람들이 바로 이들임.","c":"T","ev":"4번 문장","s":[[4,"They were often poor or elderly women, or people who lived alone.","그들은 흔히 가난하거나 나이 든 여성, 또는 혼자 사는 사람들이었다."]]},"h":"5d5ca0d6a5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some people were labeled as witches and blamed for bad events.)","ko":"어떤 사람들은 마녀로 ( ) 나쁜 일들의 책임을 뒤집어썼다.","opts":["존경받았다","낙인찍혔다","초대되었다","보호받았다"],"word":"labeled","r":{"a":"2) 낙인찍혔다","w":"3번은 마녀로 몰려 나쁜 일의 탓(blamed)까지 받았다는 내용. label은 이름표를 붙이다, 낙인찍다. 존경, 초대, 보호는 뒤의 blamed(비난받았다)와 반대 방향임.","c":2,"ev":"3번 문장","s":[[3,"During this time, some people were labeled as witches and blamed for bad events.","이 시기에 어떤 사람들은 마녀로 낙인찍혀 나쁜 일들의 책임을 뒤집어썼다."]]},"h":"435b52c06b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Many people were forced to confess through threats or torture.)","ko":"많은 사람들이 협박이나 고문 때문에 ( ) 강요당했다.","opts":["도망치다","거짓말하다","자백하다","기도하다"],"word":"confess","r":{"a":"3) 자백하다","w":"8번은 협박이나 고문으로 억지로 하게 된 일을 말하고, 그 결과 7번처럼 재판이 불공정했음. confess는 잘못을 인정하고 털어놓는다는 뜻의 ‘자백하다’.","c":3,"ev":"8번 문장","s":[[8,"Many people were forced to confess through threats or torture.","많은 사람들이 협박이나 고문 때문에 자백하도록 강요당했다."]]},"h":"27a0b49992"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt describes situations in which people are unfairly blamed because of false beliefs.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 사람들이 잘못된 믿음 때문에 부당하게 비난받는 상황을 가리킨다.","opts":["마녀 재판","유럽","마법","‘마녀사냥’이라는 말"],"r":{"a":"4) ‘마녀사냥’이라는 말","w":"10번에서 the term is still used today(그 말은 오늘날에도 쓰인다)라고 했고, 11번의 It은 그 말, 즉 ‘witch hunt’라는 말임. 상황을 가리킨다(describes)는 설명은 말에 대한 설명.","c":4,"ev":"10~11번 문장","s":[[10,"Although witch hunts ended long ago, the term is still used today.","마녀사냥은 오래전에 끝났지만, 그 말은 오늘날에도 쓰인다."],[11,"It describes situations in which people are unfairly blamed because of false beliefs.","그것은 사람들이 잘못된 믿음 때문에 부당하게 비난받는 상황을 가리킨다."]]},"h":"de1bebcdd1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This reminds us to search for the truth before judging others and to treat everyone fairly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 우리에게 다른 사람을 판단하기 전에 진실을 찾고 모든 사람을 공정하게 대하라는 것을 상기시킨다.","opts":["남을 판단하기 전에 진실을 찾고 모두를 공정하게 대해야 한다는 것을 일깨워 준다.","남을 먼저 판단해야 진실을 알 수 있다는 것을 알려 준다.","사람마다 다르게 대하는 것이 공정하다는 것을 알려 준다.","진실보다 대중의 두려움을 먼저 가라앉혀야 한다는 것을 알려 준다."],"r":{"a":"1) 남을 판단하기 전에 진실을 찾고 모두를 공정하게 대해야 한다는 것을 일깨워 준다.","w":"remind us to ~는 ‘~하라고 일깨워 준다’. search for the truth before judging others는 판단하기 전에 진실을 찾으라는 말이고, treat everyone fairly는 모두를 공정하게 대하라는 말임. 나머지는 이와 반대임.","c":1,"ev":"12번 문장","s":[[12,"This reminds us to search for the truth before judging others and to treat everyone fairly.","이는 우리에게 다른 사람을 판단하기 전에 진실을 찾고 모든 사람을 공정하게 대하라는 것을 상기시킨다."]]},"h":"5b12a06078"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["마녀사냥은 1900년대에만 있었던 일이다.","마녀로 의심받은 사람들은 항상 공정한 재판을 받았다.","혐의를 받은 많은 사람들이 협박이나 고문 때문에 자백했다.","‘마녀사냥’이라는 말은 오늘날 더 이상 쓰이지 않는다."],"opts":["Witch hunts took place only in the 1900s.","People suspected of being witches always had fair trials.","Many accused people confessed because of threats or torture.","The term “witch hunt” is no longer used today."],"r":{"a":"3) Many accused people confessed because of threats or torture.","w":"8번에서 많은 사람들이 협박이나 고문으로 자백하도록 강요당했다고 함. 마녀사냥은 1400~1700년대(1번)에 있었고, 재판은 불공정했으며(7번), 그 말은 오늘날에도 쓰임(10번).","c":3,"ev":"1번, 7~8번, 10번 문장","s":[[1,"From the 1400s to the 1700s, when war, hunger, and illness were common in Europe, many people believed these troubles were caused by evil magic.","1400년대부터 1700년대까지, 유럽에서 전쟁, 굶주림, 질병이 흔했을 때 많은 사람들은 이런 어려움이 사악한 마법 때문에 생긴다고 믿었다."],[7,"However, these trials were unfair.","그러나 이 재판들은 불공정했다."],[8,"Many people were forced to confess through threats or torture.","많은 사람들이 협박이나 고문 때문에 자백하도록 강요당했다."],[10,"Although witch hunts ended long ago, the term is still used today.","마녀사냥은 오래전에 끝났지만, 그 말은 오늘날에도 쓰인다."]]},"h":"98ce2bee58"},{"n":9,"t":"sum","q":"Local leaders and churches held (A) to punish accused people, but these trials were (B) because many people were forced to confess.","ko":"지역 지도자들과 교회는 혐의를 받은 사람들을 처벌하려고 (A)을(를) 열었지만, 많은 사람들이 자백을 강요당했기 때문에 이 재판들은 (B)했다.","oko":["(A) 축제 / (B) 불공정","(A) 마녀 재판 / (B) 공정","(A) 축제 / (B) 공정","(A) 학교 / (B) 불공정","(A) 마녀 재판 / (B) 불공정"],"opts":["(A) festivals / (B) unfair","(A) witch trials / (B) fair","(A) festivals / (B) fair","(A) schools / (B) unfair","(A) witch trials / (B) unfair"],"r":{"a":"5) (A) witch trials / (B) unfair","w":"6번에서 지도자들과 교회가 witch trials(마녀 재판)를 열었고, 7번에서 그 재판들이 unfair(불공정)했으며, 8번에서 협박이나 고문으로 자백을 강요한 것이 그 이유임.","c":5,"ev":"6~8번 문장","s":[[6,"To calm public fear, local leaders and churches held witch trials to punish those accused of using magic.","대중의 두려움을 가라앉히기 위해 지역 지도자들과 교회는 마법을 썼다는 혐의를 받은 사람들을 처벌하려고 마녀 재판을 열었다."],[7,"However, these trials were unfair.","그러나 이 재판들은 불공정했다."],[8,"Many people were forced to confess through threats or torture.","많은 사람들이 협박이나 고문 때문에 자백하도록 강요당했다."]]},"h":"d60537640e"},{"n":10,"t":"fill","q":"People who were poor, elderly, or [A] from others became targets and were labeled as [B].","ko":"가난하거나 나이 들었거나 다른 사람들과 [A] 사람들이 표적이 되어 [B]로 낙인찍혔다.","bank":["different","witches","torture","truth","fear","trials"],"bko":{"different":"다른","witches":"마녀들","torture":"고문","truth":"진실","fear":"두려움","trials":"재판"},"r":{"a":"[A] different, [B] witches","w":"5번에서 다른 사람들과 simply different한 사람도 표적이 되었고, 3번에서 마녀(witches)로 낙인찍혔다고 함. torture, truth, fear, trials는 본문 단어지만 ‘다른 ~’나 ‘~로 낙인찍힌’ 자리에 쓰면 뜻이 맞지 않음.","c":null,"ev":"3~5번 문장","s":[[3,"During this time, some people were labeled as witches and blamed for bad events.","이 시기에 어떤 사람들은 마녀로 낙인찍혀 나쁜 일들의 책임을 뒤집어썼다."],[4,"They were often poor or elderly women, or people who lived alone.","그들은 흔히 가난하거나 나이 든 여성, 또는 혼자 사는 사람들이었다."],[5,"Even those who were simply different from others became targets.","단지 다른 사람들과 다르다는 이유만으로도 표적이 되었다."]]},"h":"ff76df7755"}]},{"u":10,"id":"b4-10-4","no":4,"ko":"실크로드는 왜 ‘길’ 하나가 아니었을까?","items":[{"n":1,"t":"tf","q":"The name “Silk Road” comes from silk, a major export from China.","ko":"‘실크로드’라는 이름은 중국의 주요 수출품이었던 비단에서 유래했다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장이 그대로 이 내용임. come from은 ~에서 유래하다, export는 수출품이라는 뜻.","c":"T","ev":"6번 문장","s":[[6,"The name “Silk Road” comes from silk, a major export from China.","‘실크로드’라는 이름은 중국의 주요 수출품이었던 비단에서 유래했다."]]},"h":"7797e9d599"},{"n":2,"t":"tf","q":"The Silk Road was a single road that connected China and Europe.","ko":"실크로드는 중국과 유럽을 연결하는 하나의 길이었다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 The Silk Road was not a single road라고 함. 5번에서 육로와 해로의 모음이라고 설명하므로 하나의 길이라는 선지는 틀림.","c":"F","ev":"4번 문장","s":[[4,"The Silk Road was not a single road.","실크로드는 하나의 길이 아니었다."]]},"h":"0f5977442d"},{"n":3,"t":"tf","q":"Through trade, people shared languages, foods, and customs.","ko":"무역을 통해 사람들은 언어, 음식, 관습을 공유했다.","r":{"a":"T (본문과 맞는 내용)","w":"10번 문장이 그대로 이 내용임. 물건뿐 아니라 언어·음식·관습 같은 문화도 무역으로 오갔다는 뜻.","c":"T","ev":"10번 문장","s":[[10,"Through trade, people shared languages, foods, and customs.","무역을 통해 사람들은 언어, 음식, 관습을 공유했다."]]},"h":"53cf5e2eaf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Envoys traveled through Central Asia and reported on distant lands.)","ko":"사절들은 중앙아시아를 지나 여행하며 ( ) 땅들에 대해 보고했다.","opts":["가까운","먼","오래된","새로운"],"word":"distant","r":{"a":"2) 먼","w":"2번은 사절들이 중앙아시아를 지나 여행하며 땅들에 대해 보고했다는 내용이고, 1번에서 국경 너머를 보았다고 했으므로 가까운 곳이 아니라 ‘먼’ 땅이 맞음.","c":2,"ev":"2번 문장","s":[[2,"Envoys traveled through Central Asia and reported on distant lands.","사절들은 중앙아시아를 지나 여행하며 먼 땅들에 대해 보고했다."]]},"h":"87c001f444"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The West traded glass and precious metals.)","ko":"서양은 유리와 ( ) 금속을 거래했다.","opts":["흔한","가벼운","귀중한","오래된"],"word":"precious","r":{"a":"3) 귀중한","w":"7번에서 서양이 유리와 함께 거래한 것은 값이 높은 금속, 즉 귀금속임. precious = 귀중한, 값진. 흔하거나 가볍다는 뜻이면 ‘귀금속’이 되지 않음.","c":3,"ev":"7번 문장","s":[[7,"China traded silk, tea, and porcelain, while the West traded glass and precious metals.","중국은 비단, 차, 도자기를 거래한 반면, 서양은 유리와 귀금속을 거래했다."]]},"h":"0d0b31f501"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nMerchants later followed these routes, which developed into a large trade network known as the Silk Road.","ko":"밑줄 친 which가 가리키는 것은?","sko":"상인들이 나중에 이 길들을 따라갔고, 이 길들은 실크로드라고 알려진 큰 무역망으로 발전했다.","opts":["상인들","중앙아시아","중국의 통치자들","사절들이 갔던 길들"],"r":{"a":"4) 사절들이 갔던 길들","w":"which 바로 앞의 these routes가 가리키는 것이고, 이 routes는 2번에서 사절들이 중앙아시아를 지나 여행한 길임. 상인들이 따라간 그 길들이 큰 무역망인 실크로드로 발전함.","c":4,"ev":"2~3번 문장","s":[[2,"Envoys traveled through Central Asia and reported on distant lands.","사절들은 중앙아시아를 지나 여행하며 먼 땅들에 대해 보고했다."],[3,"Merchants later followed these routes, which developed into a large trade network known as the Silk Road.","상인들이 나중에 이 길들을 따라갔고, 이 길들은 실크로드라고 알려진 큰 무역망으로 발전했다."]]},"h":"11ee7a9786"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, its influence lasted for centuries, and it became an early example of global trade.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그 영향력은 수 세기 동안 이어졌고, 실크로드는 세계 무역의 초기 사례가 되었다.","opts":["그러나 그 영향력은 수 세기 동안 이어졌고, 세계 무역의 초기 사례가 되었다.","그러나 그 영향력은 15세기 직후 완전히 사라졌다.","그러나 그것은 세계 무역이 끝났음을 보여 주는 사례가 되었다.","그러나 그 영향력은 오래갔지만 무역과는 관계가 없었다."],"r":{"a":"1) 그러나 그 영향력은 수 세기 동안 이어졌고, 세계 무역의 초기 사례가 되었다.","w":"11번에서 중요성이 줄었다고 한 뒤 However로 방향이 바뀌어, 영향력은 수 세기 동안 이어졌다(lasted for centuries)고 함. an early example of global trade는 세계 무역의 초기 사례라는 뜻임.","c":1,"ev":"11~12번 문장","s":[[11,"After the 15th century, wars and new sea routes reduced the Silk Road’s importance.","15세기 이후에는 전쟁과 새로운 바닷길이 실크로드의 중요성을 줄였다."],[12,"However, its influence lasted for centuries, and it became an early example of global trade.","하지만 그 영향력은 수 세기 동안 이어졌고, 실크로드는 세계 무역의 초기 사례가 되었다."]]},"h":"2c2dcf46a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["실크로드는 중국과 인도만 연결했다.","중국은 유리와 귀금속을, 서양은 비단과 차와 도자기를 거래했다.","불교는 인도에서 중앙아시아로 퍼졌고, 중국의 종이는 서쪽으로 이동했다.","실크로드는 15세기 이후 더 중요해졌다."],"opts":["The Silk Road connected only China and India.","China traded glass and precious metals, while the West traded silk, tea, and porcelain.","Buddhism spread from India into Central Asia, and paper from China moved westward.","The Silk Road became more important after the 15th century."],"r":{"a":"3) Buddhism spread from India into Central Asia, and paper from China moved westward.","w":"9번에서 불교는 인도에서 중앙아시아로, 종이는 서쪽으로 이동했다고 함. 실크로드는 여러 지역을 연결했고(5번), 비단·차·도자기는 중국이 거래했으며(7번), 15세기 이후에는 중요성이 줄었음(11번).","c":3,"ev":"5번, 7번, 9번, 11번 문장","s":[[5,"It was a group of land and sea routes that connected China with Central Asia, India, the Middle East, and Europe.","그것은 중국을 중앙아시아, 인도, 중동, 유럽과 연결하는 육로와 해로의 모음이었다."],[7,"China traded silk, tea, and porcelain, while the West traded glass and precious metals.","중국은 비단, 차, 도자기를 거래한 반면, 서양은 유리와 귀금속을 거래했다."],[9,"Buddhism spread from India into Central Asia, and Chinese inventions such as paper moved westward.","불교는 인도에서 중앙아시아로 퍼졌고, 종이와 같은 중국의 발명품은 서쪽으로 이동했다."],[11,"After the 15th century, wars and new sea routes reduced the Silk Road’s importance.","15세기 이후에는 전쟁과 새로운 바닷길이 실크로드의 중요성을 줄였다."]]},"h":"eb26876972"},{"n":9,"t":"sum","q":"Chinese rulers looked beyond their borders to find new (A) and trade, and (B) later followed the routes that envoys had explored.","ko":"중국 통치자들은 새로운 (A)과 무역을 찾아 국경 너머를 보았고, 나중에 (B)이 사절들이 탐험한 길을 따라갔다.","oko":["(A) 적 / (B) 상인","(A) 동맹 / (B) 사절","(A) 동맹 / (B) 군인","(A) 적 / (B) 사절","(A) 동맹 / (B) 상인"],"opts":["(A) enemies / (B) merchants","(A) allies / (B) envoys","(A) allies / (B) soldiers","(A) enemies / (B) envoys","(A) allies / (B) merchants"],"r":{"a":"5) (A) allies / (B) merchants","w":"1번에서 새로운 allies(동맹)와 무역을 찾았고, 2번에서 사절들이 길을 여행했으며, 3번에서 merchants(상인들)가 나중에 그 길들을 따라갔다고 함. 사절(envoys)은 먼저 간 사람들이라 (B)에 들어가지 않음.","c":5,"ev":"1~3번 문장","s":[[1,"More than 2,000 years ago, Chinese rulers looked beyond their borders to find new allies and trade.","2,000여 년 전, 중국의 통치자들은 새로운 동맹과 무역을 찾아 국경 너머를 바라보았다."],[2,"Envoys traveled through Central Asia and reported on distant lands.","사절들은 중앙아시아를 지나 여행하며 먼 땅들에 대해 보고했다."],[3,"Merchants later followed these routes, which developed into a large trade network known as the Silk Road.","상인들이 나중에 이 길들을 따라갔고, 이 길들은 실크로드라고 알려진 큰 무역망으로 발전했다."]]},"h":"33e8f2df31"},{"n":10,"t":"fill","q":"After the 15th century, wars and new sea [A] reduced the Silk Road’s [B].","ko":"15세기 이후 전쟁과 새로운 바닷[A]이 실크로드의 [B]을 줄였다.","bank":["routes","importance","silk","tea","paper","languages"],"bko":{"routes":"길, 경로","importance":"중요성","silk":"비단","tea":"차","paper":"종이","languages":"언어"},"r":{"a":"[A] routes, [B] importance","w":"11번에서 전쟁과 새로운 바닷길(sea routes)이 실크로드의 중요성(importance)을 줄였다고 함. silk, tea, paper, languages는 거래된 물건이나 이름이 아니라 ‘새로운 바다 ~’나 ‘실크로드의 ~을 줄였다’에 쓸 수 없음.","c":null,"ev":"11번 문장","s":[[11,"After the 15th century, wars and new sea routes reduced the Silk Road’s importance.","15세기 이후에는 전쟁과 새로운 바닷길이 실크로드의 중요성을 줄였다."]]},"h":"da005621e8"}]}];

async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
