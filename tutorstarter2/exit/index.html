<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩튜터 스타터 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"rt2-01-1","no":1,"ko":"크래커도 숨을 쉬어요","items":[{"n":1,"t":"tf","q":"All crackers have holes.","ko":"모든 크래커에는 구멍이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"They all have holes.","그것들은 모두 구멍들을 가지고 있다."]],"w":"5번 문장에 They all have holes가 있어요. 모양과 맛이 달라도 모든 크래커에 구멍이 있다는 내용과 같아요.","c":"T"},"h":"f7ceef52a8"},{"n":2,"t":"tf","q":"Crackers have only one flavor.","ko":"크래커는 맛이 한 가지뿐이다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"They have different flavors.","그것들은 여러 가지 맛이 있다."]],"w":"2번 문장에서 크래커는 different flavors(여러 가지 맛)를 가지고 있다고 해요. 한 가지뿐이라는 말은 반대예요.","c":"F"},"h":"1648aa0626"},{"n":3,"t":"tf","q":"Cracker dough is heated in an oven.","ko":"크래커 반죽은 오븐에서 가열된다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The dough is heated in an oven.","반죽이 오븐에서 가열된다."]],"w":"8번 문장에 The dough is heated in an oven이 그대로 있어요. is heated는 '가열된다'는 뜻이에요.","c":"T"},"h":"0fc05b2f96"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Crackers are a popular snack.)","ko":"크래커는 인기 있는 간식이다.","opts":["값비싼","건강한","오래된","인기 있는"],"word":"popular","r":{"a":"4) 인기 있는","ev":"1번 문장","s":[[1,"Crackers are a popular snack.","크래커는 인기 있는 간식이다."]],"w":"1번 문장은 크래커를 소개하는 첫 문장이에요. 맛과 모양이 여러 가지로 많이 찾는 간식이라서 popular는 '인기 있는'이에요.","c":4},"h":"238b8a59bb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then the bubbles get bigger and pop.)","ko":"그러면 기포는 더 커지며 터진다.","opts":["녹는다","가라앉는다","펑 하고 터진다","차가워진다"],"word":"pop","r":{"a":"3) 펑 하고 터진다","ev":"9번 문장","s":[[9,"Then the bubbles get bigger and pop.","그러면 기포는 더 커지며 터진다."]],"w":"9번에서 기포가 커지다가 어떻게 되는지 보면 돼요. 기포(공기 방울)는 커지다가 펑 하고 터져요. pop = 펑 하고 터지다.","c":3},"h":"994c913fbe"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt makes tiny holes in the crackers.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 크래커에 아주 작은 구멍들을 만든다.","opts":["오븐","특별한 기계","크래커","반죽"],"r":{"a":"2) 특별한 기계","ev":"11~12번 문장","s":[[11,"So a special machine is used.","그래서 한 특별한 기계가 사용된다."],[12,"It makes tiny holes in the crackers.","그것은 크래커에 아주 작은 구멍들을 만든다."]],"w":"구멍을 만드는 것은 11번에서 새로 나온 a special machine(특별한 기계)이에요. 12번의 It이 그 기계를 다시 받은 거예요.","c":2},"h":"bf23b91390"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But they have one thing in common.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그것들은 한 가지를 공통적으로 가지고 있다.","opts":["하지만 그것들은 한 가지 공통점을 가지고 있다.","하지만 그것들은 서로 전혀 닮은 점이 없다.","하지만 그것들은 한 가지만 먹을 수 있다.","하지만 그것들은 모두 한 가지 맛이다."],"r":{"a":"1) 하지만 그것들은 한 가지 공통점을 가지고 있다.","ev":"4번 문장","s":[[4,"But they have one thing in common.","하지만 그것들은 한 가지를 공통적으로 가지고 있다."]],"w":"have ~ in common은 '공통점이 있다'는 뜻이에요. 맛·모양·크기가 달라도 한 가지는 같다는 말이고, 그 한 가지는 5번에서 구멍이라고 밝혀요.","c":1},"h":"78cc5fe933"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["모든 크래커는 모양과 크기가 똑같다.","크래커 반죽에는 기포가 전혀 없다.","크래커는 모양과 크기가 많다.","특별한 기계는 크래커를 달콤하게 만든다."],"opts":["All crackers have the same shape and size.","Cracker dough has no air bubbles.","Crackers come in many shapes and sizes.","A special machine makes crackers sweet."],"r":{"a":"3) Crackers come in many shapes and sizes.","ev":"3번 문장","s":[[3,"There are many shapes and sizes, too.","많은 모양과 크기도 있다."]],"w":"3번 문장에서 크래커는 many shapes and sizes(많은 모양과 크기)가 있다고 해요. 반죽에는 기포가 있고(7번), 기계는 구멍을 만들어요(12번).","c":3},"h":"3c30934c4f"},{"n":9,"t":"sum","q":"When the bubbles in the dough get (A) and pop, crackers get a (B) shape.","ko":"반죽 속 기포가 (A)해져서 터지면, 크래커는 (B) 모양이 된다.","oko":["(A) 더 작아져서 / (B) 완벽한","(A) 더 커져서 / (B) 아주 작은","(A) 더 작아져서 / (B) 이상한","(A) 더 커져서 / (B) 이상한","(A) 더 커져서 / (B) 평평한"],"opts":["(A) smaller / (B) perfect","(A) bigger / (B) tiny","(A) smaller / (B) strange","(A) bigger / (B) strange","(A) bigger / (B) flat"],"r":{"a":"4) (A) bigger / (B) strange","ev":"9~10번 문장","s":[[9,"Then the bubbles get bigger and pop.","그러면 기포는 더 커지며 터진다."],[10,"This gives crackers a strange shape.","이것은 크래커를 이상한 모양으로 만든다."]],"w":"9번에서 기포는 더 커지다가(bigger) 터지고, 10번에서 이것이 크래커에 이상한(strange) 모양을 준다고 해요. flat은 구멍으로 공기를 뺀 뒤의 모양이에요.","c":4},"h":"3d11595493"},{"n":10,"t":"fill","q":"The air comes out [A] the holes, so the crackers stay [B] and perfect.","ko":"공기가 구멍들을 [A] 나오고, 그래서 크래커는 [B] 완벽하게 유지된다.","bank":["through","flat","tiny","strange","then","finally"],"bko":{"through":"통해","flat":"평평하고","tiny":"아주 작은","strange":"이상한","then":"그러면","finally":"마침내"},"r":{"a":"[A] through, [B] flat","ev":"13~14번 문장","s":[[13,"The air comes out through the holes.","공기는 그 구멍들을 통해 나온다."],[14,"Finally, the crackers stay flat and perfect!","마침내 크래커는 평평하고 완벽하게 유지된다!"]],"w":"13번 The air comes out through the holes, 14번 the crackers stay flat and perfect에서 가져왔어요. 공기가 구멍을 통해(through) 빠져서 크래커가 평평하게(flat) 유지돼요. strange는 기포가 터질 때 생기는 모양(10번)이라 반대예요.","c":null},"h":"d0da3cef35"}]},{"u":1,"id":"rt2-01-2","no":2,"ko":"내 빵 돌려내!","items":[{"n":1,"t":"tf","q":"The monkey offered to help the cats.","ko":"원숭이는 고양이들을 도와주겠다고 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"A smart monkey saw them and offered to help.","똑똑한 원숭이가 그들을 보고 도와주겠다고 했다."]],"w":"3번 문장에 A smart monkey saw them and offered to help가 있어요. 원숭이가 도와주겠다고 먼저 나섰다는 내용과 같아요.","c":"T"},"h":"864d430224"},{"n":2,"t":"tf","q":"The cats got some bread from the monkey.","ko":"고양이들은 원숭이에게서 빵을 조금 얻었다.","r":{"a":"F (본문과 다른 내용)","ev":"14번 문장","s":[[14,"The cats didn’t get anything.","고양이들은 아무것도 얻지 못했다."]],"w":"14번 문장에서 고양이들은 didn't get anything(아무것도 얻지 못했다)이라고 해요. 조금 얻었다는 말은 반대예요.","c":"F"},"h":"98c764e7d8"},{"n":3,"t":"tf","q":"The monkey took a bite of the bigger piece.","ko":"원숭이는 더 큰 조각을 한입 베어 물었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"He took a bite of the bigger piece.","그는 더 큰 조각을 한입 베어 물었다."]],"w":"9번 문장에 He took a bite of the bigger piece가 있어요. 원숭이가 큰 조각을 한입 먹었다는 내용과 같아요.","c":"T"},"h":"983de3b8b7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A smart monkey saw them and offered to help.)","ko":"똑똑한 원숭이가 그들을 보고 도와주겠다고 했다.","opts":["도와주겠다고 했다","도망쳤다","화를 냈다","빵을 달라고 했다"],"word":"offered","r":{"a":"1) 도와주겠다고 했다","ev":"3번 문장","s":[[3,"A smart monkey saw them and offered to help.","똑똑한 원숭이가 그들을 보고 도와주겠다고 했다."]],"w":"3번에서 원숭이가 싸우는 고양이들을 보고 나서 to help(돕기)를 이어서 말했어요. offer to help는 '도와주겠다고 하다'예요.","c":1},"h":"c400439bcf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The monkey split the bread in half.)","ko":"원숭이가 빵을 반으로 나눴다.","opts":["던졌다","구웠다","숨겼다","나눴다"],"word":"split","r":{"a":"4) 나눴다","ev":"6번 문장","s":[[6,"The monkey split the bread in half.","원숭이가 빵을 반으로 나눴다."]],"w":"6번은 4번에서 말한 약속을 지키는 장면이에요. in half(반으로)와 함께 쓰이면 split은 '나누다'예요.","c":4},"h":"fa31d095b4"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThe monkey wanted them to be equal.","ko":"밑줄 친 them이 가리키는 것은?","sko":"원숭이는 그것들이 동일하기를 원했다.","opts":["두 마리 고양이","두 조각의 빵","원숭이의 두 친구","고양이와 원숭이"],"r":{"a":"2) 두 조각의 빵","ev":"7~8번 문장","s":[[7,"One piece was bigger than the other.","한 조각이 다른 조각보다 더 컸다."],[8,"The monkey wanted them to be equal.","원숭이는 그것들이 동일하기를 원했다."]],"w":"7번에서 One piece(한 조각)와 the other(다른 조각)가 나와요. 8번의 them은 그 두 빵 조각이고, 두 조각이 같아지기를 원한다는 뜻이에요.","c":2},"h":"6fb1b03d24"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This happened again and again.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이런 일이 몇 번이고 있었다.","opts":["이런 일이 한 번만 있었다.","이런 일이 몇 번이고 되풀이되었다.","이런 일은 다시는 일어나지 않았다.","이런 일이 하루 뒤에 일어났다."],"r":{"a":"2) 이런 일이 몇 번이고 되풀이되었다.","ev":"11번 문장","s":[[11,"This happened again and again.","이런 일이 몇 번이고 있었다."]],"w":"again and again은 '몇 번이고, 되풀이해서'라는 뜻이에요. 큰 쪽을 먹고 나면 반대쪽이 더 커지는 일이 계속 반복되었다는 말이에요.","c":2},"h":"cd55a5232b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고양이들이 원숭이에게 도와 달라고 부탁했다.","처음부터 두 빵 조각의 크기는 같았다.","원숭이는 마지막에 배가 불렀다.","고양이들이 더 큰 조각을 한입 베어 물었다."],"opts":["The cats asked the monkey for help.","The two pieces of bread were equal at first.","The monkey had a full stomach at the end.","The cats took a bite of the bigger piece."],"r":{"a":"3) The monkey had a full stomach at the end.","ev":"13번 문장","s":[[13,"The monkey had a full stomach.","원숭이는 배가 불렀다."]],"w":"13번 문장에서 원숭이는 a full stomach(배부름)였어요. 도와주겠다고 한 쪽은 원숭이이고(3번), 처음에 한 조각이 더 컸고(7번), 큰 조각을 먹은 것도 원숭이예요(9번).","c":3},"h":"622a16ec4e"},{"n":9,"t":"sum","q":"The monkey wanted the two pieces to be (A), so he took a bite of the (B) piece.","ko":"원숭이는 두 조각이 (A)하기를 원해서 (B) 조각을 한입 베어 물었다.","oko":["(A) 다른 / (B) 더 작은","(A) 같은 / (B) 더 작은","(A) 다른 / (B) 더 큰","(A) 특별한 / (B) 더 작은","(A) 같은 / (B) 더 큰"],"opts":["(A) different / (B) smaller","(A) equal / (B) smaller","(A) different / (B) bigger","(A) special / (B) smaller","(A) equal / (B) bigger"],"r":{"a":"5) (A) equal / (B) bigger","ev":"7~9번 문장","s":[[7,"One piece was bigger than the other.","한 조각이 다른 조각보다 더 컸다."],[8,"The monkey wanted them to be equal.","원숭이는 그것들이 동일하기를 원했다."],[9,"He took a bite of the bigger piece.","그는 더 큰 조각을 한입 베어 물었다."]],"w":"8번에서 원숭이는 두 조각이 equal(같기)을 원했고, 7번에서 한 조각이 더 컸어요. 그래서 9번에서 더 큰 조각(the bigger piece)을 베어 물었어요. 작은 조각을 먹으면 차이가 더 벌어져요.","c":5},"h":"cf84e3edc0"},{"n":10,"t":"fill","q":"Soon the bread was [A], so the cats went home [B].","ko":"곧 빵은 [A], 그래서 고양이들은 [B] 집으로 돌아갔다.","bank":["gone","hungry","equal","bigger","smart","special"],"bko":{"gone":"사라졌다","hungry":"배고픈","equal":"동일한","bigger":"더 큰","smart":"똑똑한","special":"특별한"},"r":{"a":"[A] gone, [B] hungry","ev":"12번, 15번 문장","s":[[12,"Soon the bread was gone.","곧 그 빵은 사라졌다."],[15,"They went home hungry.","그들은 배가 고픈 채로 집으로 돌아갔다."]],"w":"12번 Soon the bread was gone, 15번 They went home hungry에서 가져왔어요. 빵이 사라졌기 때문에 고양이들은 배고픈 채로 돌아간 거예요.","c":null},"h":"a7af016ec2"}]},{"u":1,"id":"rt2-01-3","no":3,"ko":"아니, 무슨 냄새지?","items":[{"n":1,"t":"tf","q":"Scientists studied the clouds of Uranus.","ko":"과학자들은 천왕성의 구름을 연구했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They studied the clouds of Uranus.","그들은 천왕성의 구름을 연구했다."]],"w":"6번 문장에 They studied the clouds of Uranus가 있어요. 방귀 냄새의 비밀을 알아내려고 구름을 연구했다는 내용과 같아요.","c":"T"},"h":"39640fd1fc"},{"n":2,"t":"tf","q":"Humans can live on Uranus for a long time.","ko":"인간은 천왕성에서 오랫동안 살 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Humans can’t survive even for a second!","인간은 1초도 생존할 수 없다!"]],"w":"12번 문장에서 인간은 even for a second(1초도) 생존할 수 없다고 해요. 오랫동안 살 수 있다는 말은 반대예요.","c":"F"},"h":"61d34c8a6a"},{"n":3,"t":"tf","q":"Scientists can tell us about the smell of one planet.","ko":"과학자들은 한 행성의 냄새에 대해 알려줄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Well, scientists can tell you about one planet.","자, 과학자들은 한 행성에 대해서는 알려줄 수 있다."]],"w":"3번 문장에 scientists can tell you about one planet이 있어요. 은하계의 냄새 중 한 행성에 대해서는 알려줄 수 있다는 내용이에요.","c":"T"},"h":"b5fdb804a8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They discovered the clouds are made of hydrogen sulfide.)","ko":"그들은 그 구름이 황화수소로 이루어져 있다는 것을 발견했다.","opts":["잊어버렸다","발견했다","만들었다","팔았다"],"word":"discovered","r":{"a":"2) 발견했다","ev":"7번 문장","s":[[7,"They discovered the clouds are made of hydrogen sulfide.","그들은 그 구름이 황화수소로 이루어져 있다는 것을 발견했다."]],"w":"6번에서 구름을 연구한 결과가 7번에 나와요. 연구해서 구름의 성분을 알게 되었으니 discover는 '발견하다'예요.","c":2},"h":"1f634b2a3b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This gas smells like farts or rotten eggs.)","ko":"이 가스는 방귀나 썩은 달걀 같은 냄새가 난다.","opts":["신선한","깨진","삶은","썩은"],"word":"rotten","r":{"a":"4) 썩은","ev":"8번 문장","s":[[8,"This gas smells like farts or rotten eggs.","이 가스는 방귀나 썩은 달걀 같은 냄새가 난다."]],"w":"방귀 냄새와 함께 나오는 달걀이므로 좋은 냄새가 아니에요. 냄새가 고약한 달걀은 썩은 달걀이고, rotten = 썩은.","c":4},"h":"5eb050cc32"},{"n":6,"t":"ref","q":"What does the underlined \"This gas\" refer to?\nThis gas smells like farts or rotten eggs.","ko":"밑줄 친 This gas가 가리키는 것은?","sko":"이 가스는 방귀나 썩은 달걀 같은 냄새가 난다.","opts":["방귀","황화수소","천왕성의 구름","썩은 달걀"],"r":{"a":"2) 황화수소","ev":"7~8번 문장","s":[[7,"They discovered the clouds are made of hydrogen sulfide.","그들은 그 구름이 황화수소로 이루어져 있다는 것을 발견했다."],[8,"This gas smells like farts or rotten eggs.","이 가스는 방귀나 썩은 달걀 같은 냄새가 난다."]],"w":"7번에서 구름이 hydrogen sulfide(황화수소)로 이루어졌다고 했어요. 8번의 This gas는 그 황화수소예요. 방귀와 썩은 달걀은 그 냄새를 비유한 것이에요.","c":2},"h":"06a55049ed"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You will never smell Uranus.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 천왕성 냄새를 맡을 일은 결코 없을 것이다.","opts":["당신은 천왕성 냄새를 결코 맡지 못할 것이다.","당신은 천왕성 냄새를 곧 맡게 될 것이다.","당신은 천왕성에서 가끔 냄새를 맡을 것이다.","천왕성은 아무 냄새도 나지 않는다."],"r":{"a":"1) 당신은 천왕성 냄새를 결코 맡지 못할 것이다.","ev":"10번 문장","s":[[10,"You will never smell Uranus.","당신이 천왕성 냄새를 맡을 일은 결코 없을 것이다."]],"w":"never는 '결코 ~ 않다'예요. 천왕성은 방귀 냄새가 나지만(4번) 우리가 그 냄새를 맡을 일은 없다는 말이에요.","c":1},"h":"3018ea1369"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["천왕성은 매우 뜨거운 행성이다.","황화수소는 꽃 냄새가 난다.","천왕성은 약 영하 200도이다.","인간은 천왕성에 쉽게 가서 냄새를 맡을 수 있다."],"opts":["Uranus is a very hot planet.","Hydrogen sulfide smells like flowers.","It is about -200°C on Uranus.","Humans can easily go to Uranus and smell it."],"r":{"a":"3) It is about -200°C on Uranus.","ev":"11번 문장","s":[[11,"It’s about -200°C there!","그곳은 약 영하 200도이다!"]],"w":"11번 문장에서 천왕성은 약 영하 200도라고 해요. 황화수소는 방귀나 썩은 달걀 냄새가 나고(8번), 인간은 1초도 생존할 수 없어요(12번).","c":3},"h":"35b91a9d1e"},{"n":9,"t":"sum","q":"Scientists studied the (A) of Uranus and found that its gas smells like (B).","ko":"과학자들은 천왕성의 (A)을 연구했고 그 가스가 (B) 냄새가 난다는 것을 알아냈다.","oko":["(A) 고리 / (B) 꽃","(A) 구름 / (B) 꽃","(A) 위성 / (B) 방귀","(A) 위성 / (B) 꽃","(A) 구름 / (B) 방귀"],"opts":["(A) rings / (B) flowers","(A) clouds / (B) flowers","(A) moons / (B) farts","(A) moons / (B) flowers","(A) clouds / (B) farts"],"r":{"a":"5) (A) clouds / (B) farts","ev":"6~8번 문장","s":[[6,"They studied the clouds of Uranus.","그들은 천왕성의 구름을 연구했다."],[7,"They discovered the clouds are made of hydrogen sulfide.","그들은 그 구름이 황화수소로 이루어져 있다는 것을 발견했다."],[8,"This gas smells like farts or rotten eggs.","이 가스는 방귀나 썩은 달걀 같은 냄새가 난다."]],"w":"6번에서 과학자들이 천왕성의 구름(clouds)을 연구했고, 7~8번에서 그 구름의 가스가 방귀(farts)나 썩은 달걀 냄새가 난다고 해요. 고리나 위성은 본문에 나오지 않아요.","c":5},"h":"4a3ad71377"},{"n":10,"t":"fill","q":"Scientists think Neptune might be [A] in a gas that is [B] to the gas on Uranus.","ko":"과학자들은 해왕성이 천왕성의 기체와 [B] 기체로 [A] 있을지도 모른다고 생각한다.","bank":["covered","similar","popular","tiny","smell","survive"],"bko":{"covered":"덮여","similar":"비슷한","popular":"인기 있는","tiny":"아주 작은","smell":"냄새가 나다","survive":"생존하다"},"r":{"a":"[A] covered, [B] similar","ev":"13~14번 문장","s":[[13,"Now scientists are looking at Neptune.","이제 과학자들은 해왕성을 살피고 있다."],[14,"They think it might be covered in a similar gas.","그들은 그것이 비슷한 기체로 덮여 있을지도 모른다고 생각한다."]],"w":"14번 They think it might be covered in a similar gas에서 가져왔어요. 해왕성이 천왕성과 비슷한 기체로 덮여 있을지도 모른다는 내용이에요.","c":null},"h":"f9aed57d57"}]},{"u":2,"id":"rt2-02-1","no":1,"ko":"보기보다 무시무시해","items":[{"n":1,"t":"tf","q":"Many mosquitoes carry diseases.","ko":"많은 모기들이 질병을 옮긴다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Many mosquitoes carry diseases.","많은 모기들이 질병들을 옮긴다."]],"w":"9번 문장에 Many mosquitoes carry diseases가 그대로 있어요. 모기가 질병을 옮긴다는 내용과 같아요.","c":"T"},"h":"790418999f"},{"n":2,"t":"tf","q":"Snakes are the most dangerous animal in the world.","ko":"뱀이 세상에서 가장 위험한 동물이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It is mosquitoes.","그것은 모기이다."]],"w":"1~3번에서 뱀, 상어, 곰을 떠올리게 한 다음, 5번에서 정답은 mosquitoes(모기)라고 해요. 뱀이 아니라 모기가 가장 위험한 동물이에요.","c":"F"},"h":"eadf60e919"},{"n":3,"t":"tf","q":"Long clothes may make you hotter, but they can keep you safer.","ko":"긴 옷은 당신을 더 덥게 만들 수 있지만, 더 안전하게 지켜 줄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"17번 문장","s":[[17,"It may be hotter, but it is safer!","더 더울지 모르지만, 더 안전하다!"]],"w":"17번 문장에서 It may be hotter(더 더울지도 모른다), but it is safer(그러나 더 안전하다)라고 해요. 긴 옷을 입을 때의 단점과 장점이 그대로 나와 있어요.","c":"T"},"h":"0036776753"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many mosquitoes carry diseases.)","ko":"많은 모기들이 질병들을 옮긴다.","opts":["옮긴다","없앤다","먹는다","만든다"],"word":"carry","r":{"a":"1) 옮긴다","ev":"9번 문장","s":[[9,"Many mosquitoes carry diseases.","많은 모기들이 질병들을 옮긴다."]],"w":"모기가 질병을 어떻게 하는지 보면 돼요. 10번에서 이 질병들이 사람을 물 때 퍼진다고 하니, 질병을 몸에 지니고 옮기는 거예요. carry = (병을) 옮기다.","c":1},"h":"b83028ab0f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These diseases can spread when they bite humans.)","ko":"이 질병들은 그것들이 사람을 물 때 퍼질 수 있다.","opts":["줄어든다","퍼진다","사라진다","멈춘다"],"word":"spread","r":{"a":"2) 퍼진다","ev":"10번 문장","s":[[10,"These diseases can spread when they bite humans.","이 질병들은 그것들이 사람을 물 때 퍼질 수 있다."]],"w":"질병이 모기에게 물릴 때 다른 사람에게 번져 간다는 뜻이에요. 그래서 11번처럼 치명적일 수 있다고 걱정해요. spread = 퍼지다.","c":2},"h":"162f796cc4"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThese diseases can spread when they bite humans.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이 질병들은 그것들이 사람을 물 때 퍼질 수 있다.","opts":["질병들","사람들","모기들","뱀과 상어"],"r":{"a":"3) 모기들","ev":"9~10번 문장","s":[[9,"Many mosquitoes carry diseases.","많은 모기들이 질병들을 옮긴다."],[10,"These diseases can spread when they bite humans.","이 질병들은 그것들이 사람을 물 때 퍼질 수 있다."]],"w":"사람을 무는 쪽은 질병이 아니라 모기예요. 9번의 Many mosquitoes(많은 모기들)를 10번에서 they로 받았어요.","c":3},"h":"7f30cc87db"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Avoiding mosquito bites is the best way.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모기에 물리지 않는 것이 가장 좋은 방법이다.","opts":["모기를 잡는 것이 가장 좋은 방법이다.","모기에 물린 곳을 긁는 것이 가장 좋은 방법이다.","모기에 물리면 병원에 가는 것이 가장 좋은 방법이다.","모기에 물리지 않는 것이 가장 좋은 방법이다."],"r":{"a":"4) 모기에 물리지 않는 것이 가장 좋은 방법이다.","ev":"13번 문장","s":[[13,"Avoiding mosquito bites is the best way.","모기에 물리지 않는 것이 가장 좋은 방법이다."]],"w":"Avoiding mosquito bites는 '모기에 물리는 것을 피하는 것'이고 문장의 주어예요. 가장 좋은 방법은 물리지 않게 하는 것이고, 그 구체적인 방법이 14번부터 나와요.","c":4},"h":"41cb959fdb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["모기에 물린 곳은 절대 큰 문제가 되지 않는다.","모기가 옮기는 질병은 치명적일 수 있다.","모기는 전혀 위험하지 않다.","모기를 피하려면 짧은 소매를 입어야 한다."],"opts":["Mosquito bites never become a big problem.","Diseases from mosquitoes can be deadly.","Mosquitoes are not dangerous at all.","People should wear short sleeves to avoid mosquitoes."],"r":{"a":"2) Diseases from mosquitoes can be deadly.","ev":"8번, 11번 문장","s":[[8,"But it can become a big problem.","그러나 그것은 큰 문제가 될 수 있다."],[11,"Such diseases can be deadly.","이러한 질병들은 치명적일 수 있다."]],"w":"11번에서 Such diseases can be deadly(이러한 질병들은 치명적일 수 있다)라고 해요. 모기에 물린 곳도 큰 문제가 될 수 있고(8번), 피하려면 긴 소매를 입어야 해요(14번).","c":2},"h":"6886ab6606"},{"n":9,"t":"sum","q":"Mosquitoes are the most (A) animal because their bites can spread (B) diseases.","ko":"모기는 물 때 (B) 질병을 퍼뜨릴 수 있어서 가장 (A) 동물이다.","oko":["(A) 도움이 되는 / (B) 치명적인","(A) 위험한 / (B) 가려운","(A) 안전한 / (B) 가려운","(A) 차분한 / (B) 치명적인","(A) 위험한 / (B) 치명적인"],"opts":["(A) helpful / (B) deadly","(A) dangerous / (B) itchy","(A) safe / (B) itchy","(A) calm / (B) deadly","(A) dangerous / (B) deadly"],"r":{"a":"5) (A) dangerous / (B) deadly","ev":"6번, 10번, 11번 문장","s":[[6,"Why are mosquitoes so dangerous?","왜 모기들은 그렇게 위험할까?"],[10,"These diseases can spread when they bite humans.","이 질병들은 그것들이 사람을 물 때 퍼질 수 있다."],[11,"Such diseases can be deadly.","이러한 질병들은 치명적일 수 있다."]],"w":"6번에서 모기가 위험한(dangerous) 이유를 묻고, 10번에서 질병이 사람을 물 때 퍼진다고 하며, 11번에서 그 질병이 치명적(deadly)일 수 있다고 답해요. itchy(가려운)는 물린 곳이 가렵다는 7번 이야기예요.","c":5},"h":"a67b280d5e"},{"n":10,"t":"fill","q":"If you wear a long-sleeved shirt and long [A], mosquitoes cannot bite you [B].","ko":"소매가 긴 셔츠와 긴 [A]를 입으면, 모기는 당신을 [B] 물 수 없다.","bank":["pants","easily","itchy","deadly","dangerous","spread"],"bko":{"pants":"바지","easily":"쉽게","itchy":"가려운","deadly":"치명적인","dangerous":"위험한","spread":"퍼지다"},"r":{"a":"[A] pants, [B] easily","ev":"14~16번 문장","s":[[14,"Wear a long-sleeved shirt outside.","밖에서 긴 소매 셔츠를 입어라."],[15,"Wear long pants, too.","긴 바지도 입어라."],[16,"Then mosquitoes cannot bite you easily.","그러면 모기는 당신을 쉽게 물 수 없다."]],"w":"14번 long-sleeved shirt, 15번 Wear long pants, 16번 mosquitoes cannot bite you easily에서 가져왔어요. 긴 셔츠와 긴 바지를 입으면 모기가 쉽게 물지 못한다는 내용이에요.","c":null},"h":"df6e8090fe"}]},{"u":2,"id":"rt2-02-2","no":2,"ko":"이 조그마한 걸 어디에 쓰지?","items":[{"n":1,"t":"tf","q":"Workers usually put their watches in their vests.","ko":"일꾼들은 보통 시계를 조끼 안에 넣었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Workers usually put their watches in their vests.","일꾼들은 보통 조끼 안에 시계를 넣었다."]],"w":"5번 문장에 Workers usually put their watches in their vests가 그대로 있어요. 일꾼들이 시계를 조끼에 넣었다는 내용과 같아요.","c":"T"},"h":"1633099184"},{"n":2,"t":"tf","q":"Workers' watches never fell out of their vests.","ko":"일꾼들의 시계는 조끼에서 한 번도 떨어지지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"But their watches often fell out and broke.","하지만 시계가 자주 떨어져서 고장 났다."]],"w":"6번 문장에서 시계가 often fell out and broke(자주 떨어져서 고장 났다)라고 해요. 한 번도 떨어지지 않았다는 말은 반대예요.","c":"F"},"h":"e31cc804ad"},{"n":3,"t":"tf","q":"In the late 1800s, people had pocket watches.","ko":"1800년대 후반에 사람들은 회중시계를 가지고 다녔다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Well, back in the late 1800s, people had pocket watches!","그러니까, 과거 1800년대 후반에, 사람들은 회중시계를 가지고 다녔다!"]],"w":"4번 문장에 back in the late 1800s, people had pocket watches가 있어요. had는 have(가지다)의 과거형이라 '가지고 다녔다'는 뜻이에요.","c":"T"},"h":"0135f02f18"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Levi Strauss came up with a bright idea: a watch pocket!)","ko":"리바이 스트라우스가 기발한 아이디어를 생각해 냈는데, 바로 시계 주머니다!","opts":["밝은","낡은","기발한","어려운"],"word":"bright","r":{"a":"3) 기발한","ev":"6~7번 문장","s":[[6,"But their watches often fell out and broke.","하지만 시계가 자주 떨어져서 고장 났다."],[7,"Denim jeans company founder Levi Strauss came up with a bright idea: a watch pocket!","청바지 회사 창립자인 리바이 스트라우스가 기발한 아이디어를 생각해 냈는데, 바로 시계 주머니다!"]],"w":"6번에서 시계가 떨어져 고장 나는 문제가 있었고, 7번의 아이디어가 그 문제를 풀어 줘요. 문제를 해결하는 좋은 생각이니 여기서 bright는 '밝은'이 아니라 '기발한'이에요.","c":3},"h":"a2e12c5c12"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But their watches often fell out and broke.)","ko":"하지만 시계가 자주 떨어져서 고장 났다.","opts":["떨어져 나갔다","올라갔다","젖었다","닫혔다"],"word":"fell out","r":{"a":"1) 떨어져 나갔다","ev":"5~6번 문장","s":[[5,"Workers usually put their watches in their vests.","일꾼들은 보통 조끼 안에 시계를 넣었다."],[6,"But their watches often fell out and broke.","하지만 시계가 자주 떨어져서 고장 났다."]],"w":"5번에서 시계를 조끼에 넣었다고 했고, 6번은 But으로 문제를 말해요. 조끼 안의 시계가 밖으로 떨어져 나가서 고장 났다는 뜻이에요. fell out은 fall out(떨어져 나가다)의 과거형이에요.","c":1},"h":"c81d7167c7"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nYou cannot put much in them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"당신은 그것들 안에 많은 것을 넣을 수 없다.","opts":["청바지들","작은 주머니들","회중시계들","일꾼들"],"r":{"a":"2) 작은 주머니들","ev":"1~2번 문장","s":[[1,"Have you seen strange, tiny pockets on your jeans?","청바지에 있는 이상하고 아주 작은 주머니를 본 적이 있는가?"],[2,"You cannot put much in them.","그것들 안에 많은 것을 넣을 수 없다."]],"w":"많은 것을 넣을 수 없는 '그것들 안'은 1번의 strange, tiny pockets(이상하고 아주 작은 주머니들)예요. 그 주머니에 많이 넣을 수 없다는 뜻이에요.","c":2},"h":"a970488176"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Today few people carry pocket watches.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘날 회중시계를 가지고 다니는 사람은 거의 없다.","opts":["오늘날 모든 사람이 회중시계를 가지고 다닌다.","오늘날 많은 사람들이 회중시계를 가지고 다닌다.","오늘날 회중시계를 가지고 다니는 사람은 거의 없다.","오늘날 회중시계는 아주 비싸게 팔린다."],"r":{"a":"3) 오늘날 회중시계를 가지고 다니는 사람은 거의 없다.","ev":"9번 문장","s":[[9,"Today few people carry pocket watches.","오늘날 회중시계를 가지고 다니는 사람은 거의 없다."]],"w":"few는 '거의 없는'이라는 부정의 뜻이에요. 옛날과 달리(4번) 지금은 회중시계를 가지고 다니는 사람이 거의 없다는 말이고, 그래서 10번이 However(하지만)로 이어져요.","c":3},"h":"65343a778c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["회사가 작은 주머니를 없앴다.","작은 주머니가 청바지에 그대로 남아 있다.","1800년대 후반 사람들은 회중시계가 없었다.","리바이 스트라우스는 청바지 가게의 일꾼이었다."],"opts":["The company removed the small pocket.","The small pockets have stayed on jeans.","People in the late 1800s did not have pocket watches.","Levi Strauss was a worker at a jeans store."],"r":{"a":"2) The small pockets have stayed on jeans.","ev":"10~11번 문장","s":[[10,"However, the company wants to keep the original design.","하지만 그 회사는 본래의 디자인을 유지하길 원한다."],[11,"So the pockets have stayed.","그래서 주머니가 그대로 남았다."]],"w":"11번 문장에서 So the pockets have stayed(그래서 주머니가 그대로 남았다)라고 해요. 1800년대 후반 사람들은 회중시계를 가지고 다녔고(4번), 리바이 스트라우스는 청바지 회사 창립자예요(7번).","c":2},"h":"357955928f"},{"n":9,"t":"sum","q":"Levi Strauss made a (A) pocket so that workers  out their tongues가 그대로 있어요. stick out은 '내밀다'라는 뜻이에요.","c":"T"},"h":"bb6c2e150d"},{"n":3,"t":"tf","q":"The wrinkles help elephants stay cool in cold and wet places.","ko":"주름은 코끼리가 춥고 습한 곳에서 시원하게 지내도록 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"This is great for staying cool longer in hot and dry Africa.","이는 덥고 건조한 아프리카에서 더 오래 시원하게 있기에 아주 좋다."]],"w":"11번에서 주름은 덥고 건조한 아프리카에서 더 오래 시원하게 있기에 좋다고 해요. 춥고 습한 곳이 아니에요.","c":"F"},"h":"8caab6d302"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One is their wrinkly skin!)","ko":"한 가지는 그들의 주름이 있는 피부다!","opts":["매끈한","딱딱한","주름이 있는","차가운"],"word":"wrinkly","r":{"a":"3) 주름이 있는","ev":"6~7번 문장","s":[[6,"One is their wrinkly skin!","한 가지는 그들의 주름이 있는 피부다!"],[7,"The wrinkles don’t mean they are old!","주름은 그들이 나이가 들었다는 것을 의미하지 않는다!"]],"w":"6번의 wrinkly는 wrinkle(주름)에서 온 말이에요. 7번에서 The wrinkles라고 다시 말하니 '주름이 있는'이 맞아요.","c":3},"h":"1d36e22c95"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The wrinkles keep five to ten times more water than smooth skin.)","ko":"주름은 매끄러운 피부보다 다섯 배에서 열 배 더 많은 수분을 보유한다.","opts":["매끄러운","두꺼운","뜨거운","젖은"],"word":"smooth","r":{"a":"1) 매끄러운","ev":"9번 문장","s":[[9,"The wrinkles keep five to ten times more water than smooth skin.","주름은 매끄러운 피부보다 다섯 배에서 열 배 더 많은 수분을 보유한다."]],"w":"주름이 있는 피부와 비교하는 말이에요. 주름이 없는 쪽이니 '매끄러운'이 맞아요.","c":1},"h":"3d010e0e52"},{"n":6,"t":"ref","q":"What does the underlined \"ones\" refer to?\nElephants in Asia live in wetter forests, so they have fewer wrinkles than ones in Africa.","ko":"밑줄 친 ones가 가리키는 것은?","sko":"아시아의 코끼리는 더 습한 숲에 살기 때문에 아프리카의 코끼리보다 주름이 더 적다.","opts":["아프리카의 숲들","아프리카의 주름들","아프리카의 사람들","아프리카의 코끼리들"],"r":{"a":"4) 아프리카의 코끼리들","ev":"12번 문장","s":[[12,"Elephants in Asia live in wetter forests, so they have fewer wrinkles than ones in Africa.","아시아의 코끼리는 더 습한 숲에 살기 때문에 아프리카의 코끼리보다 주름이 더 적다."]],"w":"ones는 앞에 나온 Elephants를 대신하는 말이에요. 아시아 코끼리의 주름이 '아프리카의 코끼리들'보다 적다고 비교하는 문장이에요.","c":4},"h":"122b62e29b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That means it takes longer for their skin to dry out.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 그들의 피부가 건조해지는 데 더 오래 걸린다는 것을 의미한다.","opts":["그들의 피부는 빨리 말라 버린다.","그들의 피부가 마르는 데 더 오래 걸린다.","그들의 피부는 물에 젖는 데 더 오래 걸린다.","그들의 피부는 더 자주 마른다."],"r":{"a":"2) 그들의 피부가 마르는 데 더 오래 걸린다.","ev":"10번 문장","s":[[10,"That means it takes longer for their skin to dry out.","그것은 그들의 피부가 건조해지는 데 더 오래 걸린다는 것을 의미한다."]],"w":"it takes longer for their skin to dry out은 '피부가 마르는 데 더 오래 걸린다'는 뜻이에요. 수분을 많이 보유하기(9번) 때문에 늦게 말라요.","c":2},"h":"abaef34715"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["캥거루는 시원하게 지내려고 혀를 내민다.","나이 든 코끼리만 주름이 있다.","주름은 코끼리가 덥고 건조한 아프리카에서 더 오래 시원하게 있도록 돕는다.","아시아의 코끼리는 아프리카의 코끼리보다 더 건조한 숲에 산다."],"opts":["Kangaroos stick out their tongues to stay cool.","Only old elephants have wrinkles.","The wrinkles help elephants stay cool longer in hot and dry Africa.","Elephants in Asia live in drier forests than those in Africa."],"r":{"a":"3) The wrinkles help elephants stay cool longer in hot and dry Africa.","ev":"2, 7, 8, 11, 12번 문장","s":[[2,"Kangaroos lick their arms.","캥거루는 팔을 핥는다."],[7,"The wrinkles don’t mean they are old!","주름은 그들이 나이가 들었다는 것을 의미하지 않는다!"],[8,"Even young elephants have them.","어린 코끼리조차 그것들이 있다."],[11,"This is great for staying cool longer in hot and dry Africa.","이는 덥고 건조한 아프리카에서 더 오래 시원하게 있기에 아주 좋다."],[12,"Elephants in Asia live in wetter forests, so they have fewer wrinkles than ones in Africa.","아시아의 코끼리는 더 습한 숲에 살기 때문에 아프리카의 코끼리보다 주름이 더 적다."]],"w":"혀를 내미는 것은 개(3번)이고 캥거루는 팔을 핥아요(2번). 어린 코끼리도 주름이 있고(8번), 아시아 코끼리는 더 습한 숲에 살아요(12번). 11번에서 주름이 덥고 건조한 아프리카에서 오래 시원하게 있도록 돕는다고 해요.","c":3},"h":"c61d5094b4"},{"n":9,"t":"sum","q":"Unlike kangaroos and dogs, elephants stay cool with (A) skin that keeps more (B) than smooth skin.","ko":"캥거루나 개와 달리 코끼리는 매끄러운 피부보다 더 많은 (B)을 보유하는 (A) 피부로 시원하게 지낸다.","oko":["(A) 매끈한 / (B) 수분","(A) 주름이 있는 / (B) 음식","(A) 나이 든 / (B) 수분","(A) 주름이 있는 / (B) 열","(A) 주름이 있는 / (B) 수분"],"opts":["(A) smooth / (B) water","(A) wrinkly / (B) food","(A) old / (B) water","(A) wrinkly / (B) heat","(A) wrinkly / (B) water"],"r":{"a":"5) (A) wrinkly / (B) water","ev":"4, 6, 9번 문장","s":[[4,"But elephants can’t do either.","하지만 코끼리는 둘 중 어느 것도 할 수 없다."],[6,"One is their wrinkly skin!","한 가지는 그들의 주름이 있는 피부다!"],[9,"The wrinkles keep five to ten times more water than smooth skin.","주름은 매끄러운 피부보다 다섯 배에서 열 배 더 많은 수분을 보유한다."]],"w":"4번에서 코끼리는 캥거루와 개의 방법을 못 쓰고, 6번 주름이 있는 피부가 방법이에요. 9번에서 그 주름이 매끄러운 피부보다 더 많은 수분(water)을 보유해요.","c":5},"h":"f8bd0987a1"},{"n":10,"t":"fill","q":"In Asia, elephants live in [A] forests, so they have [B] wrinkles than elephants in Africa.","ko":"아시아의 코끼리는 [A] 숲에 살기 때문에 아프리카의 코끼리보다 주름이 [B].","bank":["wetter","fewer","stay","keep","times","either"],"bko":{"wetter":"더 습한","fewer":"더 적은","stay":"유지하다","keep":"보유하다","times":"배","either":"둘 중 어느 것도"},"r":{"a":"[A] wetter, [B] fewer","ev":"12번 문장","s":[[12,"Elephants in Asia live in wetter forests, so they have fewer wrinkles than ones in Africa.","아시아의 코끼리는 더 습한 숲에 살기 때문에 아프리카의 코끼리보다 주름이 더 적다."]],"w":"12번 Elephants in Asia live in wetter forests, so they have fewer wrinkles than ones in Africa에서 가져왔어요. 습한 숲(wetter)에 살아서 주름이 더 적다(fewer)는 원인과 결과예요.","c":null},"h":"7192226eae"}]},{"u":3,"id":"rt2-03-2","no":2,"ko":"하룻밤 사이에 무슨 일이?!","items":[{"n":1,"t":"tf","q":"Frank Epperson was 11 years old in 1905.","ko":"Frank Epperson은 1905년에 11살이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"It was winter in 1905.","1905년 겨울이었다."],[6,"Frank Epperson was 11 years old.","Frank Epperson은 11살이었다."]],"w":"5번에서 1905년 겨울이라고 하고, 6번에서 Frank Epperson이 11살이었다고 해요.","c":"T"},"h":"f32c7ccc9d"},{"n":2,"t":"tf","q":"Frank threw the frozen drink away.","ko":"Frank는 얼어 있는 음료수를 버렸다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"But he didn’t throw it away.","그러나 그는 그것을 버리지 않았다."]],"w":"13번에서 But he didn’t throw it away라고 해요. 버리지 않았어요.","c":"F"},"h":"996b4667c5"},{"n":3,"t":"tf","q":"The drink was frozen when Frank came back the next day.","ko":"다음 날 Frank가 돌아왔을 때 음료수는 얼어 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11~12번 문장","s":[[11,"He came back the next day.","그는 다음 날 돌아왔다."],[12,"The drink was frozen!","음료수는 얼어 있었다!"]],"w":"11번에서 다음 날 돌아왔고, 12번에서 The drink was frozen이라고 해요.","c":"T"},"h":"42f152a5a9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He mixed sweet soda powder and water with a stick.)","ko":"그는 막대기로 달콤한 탄산음료 가루와 물을 섞었다.","opts":["얼렸다","섞었다","마셨다","씻었다"],"word":"mixed","r":{"a":"2) 섞었다","ev":"8번 문장","s":[[8,"He mixed sweet soda powder and water with a stick.","그는 막대기로 달콤한 탄산음료 가루와 물을 섞었다."]],"w":"가루와 물을 막대기로 어떻게 했는지 보면 돼요. 7번에서 음료수를 만들고 있었다고 했으니, 가루와 물을 한데 합치는 일이에요. mixed는 mix(섞다)의 과거형 '섞었다'예요.","c":2},"h":"e46e2ed37a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A popsicle is a frozen treat on a stick.)","ko":"아이스캔디는 막대기에 얼린 간식이다.","opts":["간식","장난감","약","그릇"],"word":"treat","r":{"a":"1) 간식","ev":"1번 문장","s":[[1,"A popsicle is a frozen treat on a stick.","아이스캔디는 막대기에 얼린 간식이다."]],"w":"1번은 아이스캔디가 무엇인지 설명하는 문장이에요. 막대기에 얼린 먹을거리이니 treat은 여기서 '간식'이에요. (treat에는 '선물'이라는 뜻도 있어요.)","c":1},"h":"874dd40e2f"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut he didn’t throw it away.","ko":"밑줄 친 it가 가리키는 것은?","sko":"그러나 그는 그것을 버리지 않았다.","opts":["현관","막대기","다음 날","얼어 있던 음료수"],"r":{"a":"4) 얼어 있던 음료수","ev":"12~13번 문장","s":[[12,"The drink was frozen!","음료수는 얼어 있었다!"],[13,"But he didn’t throw it away.","그러나 그는 그것을 버리지 않았다."]],"w":"12번에서 음료수가 얼어 있었고, 13번에서 Frank는 그것(it)을 버리지 않았어요. it은 얼어 있던 음료수예요.","c":4},"h":"451c614384"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead, he licked it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"대신에, 그는 그것을 핥았다.","opts":["그는 그것을 대신 버렸다.","그는 그것을 버리지 않고 핥아 보았다.","그는 그것 대신 다른 음료를 마셨다.","그는 그것을 핥은 뒤 버렸다."],"r":{"a":"2) 그는 그것을 버리지 않고 핥아 보았다.","ev":"13~14번 문장","s":[[13,"But he didn’t throw it away.","그러나 그는 그것을 버리지 않았다."],[14,"Instead, he licked it.","대신에, 그는 그것을 핥았다."]],"w":"13번에서 버리지 않았다고 한 뒤, Instead(대신에) he licked it이라고 해요. 버리는 대신 핥았다는 뜻이에요.","c":2},"h":"730f7914a3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Frank는 1905년 여름에 음료수를 만들었다.","Frank는 음료수를 밤새 냉동실에 넣어 두었다.","Frank는 막대기가 들어 있는 음료수를 현관에 두고 잊어버렸다.","Frank는 그때 21살이었다."],"opts":["Frank made a drink in summer 1905.","Frank put the drink in a freezer overnight.","Frank forgot his drink on the porch with the stick in it.","Frank was 21 years old at that time."],"r":{"a":"3) Frank forgot his drink on the porch with the stick in it.","ev":"5, 6, 9, 10번 문장","s":[[5,"It was winter in 1905.","1905년 겨울이었다."],[6,"Frank Epperson was 11 years old.","Frank Epperson은 11살이었다."],[9,"He left his drink on the porch with the stick still in it.","그는 막대기가 여전히 들어있는 상태에서 음료수를 현관에 두었다."],[10,"He completely forgot about it.","그는 그것을 완전히 잊어버렸다."]],"w":"1905년은 겨울이었고(5번), Frank는 11살이었어요(6번). 음료수는 냉동실이 아니라 막대기가 꽂힌 채 현관에 있었고(9번) 그는 잊어버렸어요(10번).","c":3},"h":"f49dffe0a4"},{"n":9,"t":"sum","q":"Frank left his drink on the porch and (A) about it. The next day, the drink was (B).","ko":"Frank는 음료수를 현관에 두고 그것에 대해 (A). 다음 날 음료수는 (B) 있었다.","oko":["(A) 마셨다 / (B) 얼어","(A) 잊어버렸다 / (B) 뜨거워","(A) 기억했다 / (B) 녹아","(A) 잊어버렸다 / (B) 얼어","(A) 버렸다 / (B) 따뜻해"],"opts":["(A) drank / (B) frozen","(A) forgot / (B) hot","(A) remembered / (B) melted","(A) forgot / (B) frozen","(A) threw away / (B) warm"],"r":{"a":"4) (A) forgot / (B) frozen","ev":"9, 10, 12번 문장","s":[[9,"He left his drink on the porch with the stick still in it.","그는 막대기가 여전히 들어있는 상태에서 음료수를 현관에 두었다."],[10,"He completely forgot about it.","그는 그것을 완전히 잊어버렸다."],[12,"The drink was frozen!","음료수는 얼어 있었다!"]],"w":"9번에서 음료수를 현관에 두었고, 10번에서 완전히 잊어버렸어요(forgot). 12번에서 다음 날 음료수는 얼어 있었어요(frozen).","c":4},"h":"b285a88feb"},{"n":10,"t":"fill","q":"Frank licked the frozen drink. It was [A], and the first [B] was born.","ko":"Frank는 얼어 있는 음료수를 핥았다. 그것은 [A]. 그리고 첫 번째 [B]가 탄생했다.","bank":["delicious","popsicle","porch","stick","completely","mistake"],"bko":{"delicious":"맛있는","popsicle":"아이스캔디","porch":"현관","stick":"막대기","completely":"완전히","mistake":"실수"},"r":{"a":"[A] delicious, [B] popsicle","ev":"14, 16, 17번 문장","s":[[14,"Instead, he licked it.","대신에, 그는 그것을 핥았다."],[16,"It was delicious.","그것은 맛있었다."],[17,"The first popsicle was born.","첫 번째 아이스캔디가 탄생했다."]],"w":"14번에서 핥았고, 16번 It was delicious, 17번 The first popsicle was born에서 가져왔어요. porch와 stick은 장소·물건이라 '맛있는'이나 '탄생했다'와 이어지지 않아요.","c":null},"h":"f451e3d7f4"}]},{"u":3,"id":"rt2-03-3","no":3,"ko":"거기 아무도 없나요?","items":[{"n":1,"t":"tf","q":"Nyepi starts at 6 a.m. and continues for 24 hours.","ko":"녜삐는 오전 6시에 시작해서 24시간 동안 계속된다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It starts at 6 a.m. and continues for 24 hours.","그것은 오전 6시에 시작해서 24시간 동안 계속된다."]],"w":"6번 문장에 It starts at 6 a.m. and continues for 24 hours라고 그대로 나와요.","c":"T"},"h":"d3b7d9327e"},{"n":2,"t":"tf","q":"On Nyepi, planes fly and restaurants open as usual.","ko":"녜삐에도 비행기는 날고 식당은 평소처럼 연다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"No planes fly and no restaurants open.","비행기가 날지 않고 식당은 열지 않는다."]],"w":"10번에서 No planes fly and no restaurants open이라고 해요. 비행기도 날지 않고 식당도 열지 않아요.","c":"F"},"h":"51e3b74ec2"},{"n":3,"t":"tf","q":"Most people around the world celebrate the New Year quietly.","ko":"세계 대부분의 사람들은 새해를 조용히 기념한다.","r":{"a":"F (본문과 다른 내용)","ev":"1~2번 문장","s":[[1,"Most people around the world have lively New Year’s parties.","세계 대부분의 사람들이 활기 넘치는 새해 파티를 한다."],[2,"But the Balinese welcome their New Year differently.","그러나 발리 사람들은 새해를 다르게 맞이한다."]],"w":"1번에서 세계 대부분의 사람들은 활기 넘치는 새해 파티를 한다고 하고, 2번에서 발리 사람들만 새해를 다르게 맞이한다고 해요.","c":"F"},"h":"87a6688754"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (On this day, people clear their minds.)","ko":"이날, 사람들은 마음을 깨끗하게 한다.","opts":["복잡하게 만든다","닫는다","깨끗하게 한다","가르친다"],"word":"clear","r":{"a":"3) 깨끗하게 한다","ev":"7~8번 문장","s":[[7,"On this day, people clear their minds.","이날, 사람들은 마음을 깨끗하게 한다."],[8,"They don’t make any noise.","그들은 어떠한 소리도 내지 않는다."]],"w":"7번 뒤 8번에서 사람들이 어떤 소리도 내지 않는다고 해요. 마음을 깨끗하게 비운다는 뜻이에요.","c":3},"h":"7346e5a3ed"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They celebrate it with Nyepi!)","ko":"그들은 녜삐로 새해를 기념한다!","opts":["슬퍼하다","기념하다","잊다","끝내다"],"word":"celebrate","r":{"a":"2) 기념하다","ev":"3번 문장","s":[[3,"They celebrate it with Nyepi!","그들은 녜삐로 새해를 기념한다!"]],"w":"2번에서 발리 사람들은 새해를 다르게 맞이한다고 했고, 3번은 그 방법이 Nyepi라고 말해요. 새해를 녜삐로 '기념한다'는 뜻이에요. (celebrate = 기념하다, 축하하다)","c":2},"h":"f480d4a81a"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis will bring good luck and peace to Bali.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 발리에 행운과 평화를 가져다줄 것이다.","opts":["발리의 새해 달력","오전 6시에 시작하는 것","식당이 문을 닫는 것","악령이 아무도 없다고 생각하고 떠나는 것"],"r":{"a":"4) 악령이 아무도 없다고 생각하고 떠나는 것","ev":"13~14번 문장","s":[[13,"The demons will think no one is there and leave.","악령은 그곳에 아무도 없다고 생각해서 떠날 것이다."],[14,"This will bring good luck and peace to Bali.","이것이 발리에 행운과 평화를 가져다줄 것이다."]],"w":"14번의 This는 바로 앞 13번 내용이에요. 악령이 아무도 없다고 생각해서 떠나는 것이 발리에 행운과 평화를 가져다줘요.","c":4},"h":"ad40eb194f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This helps keep the balance between nature and humans.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 자연과 인간 사이의 균형을 유지하는 것을 돕는다.","opts":["이것은 자연과 인간을 서로 멀어지게 한다.","이것은 자연과 인간 사이의 균형을 유지하는 것을 돕는다.","이것은 인간이 자연보다 더 강해지게 한다.","이것은 자연이 인간을 대신해 일하게 한다."],"r":{"a":"2) 이것은 자연과 인간 사이의 균형을 유지하는 것을 돕는다.","ev":"8~9번 문장","s":[[8,"They don’t make any noise.","그들은 어떠한 소리도 내지 않는다."],[9,"This helps keep the balance between nature and humans.","이는 자연과 인간 사이의 균형을 유지하는 것을 돕는다."]],"w":"help keep the balance는 '균형을 유지하는 것을 돕는다'는 뜻이에요. 8번의 조용히 지내는 것이 자연과 인간 사이의 균형에 도움이 된다는 문장이에요.","c":2},"h":"148c7690fa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["발리 사람들은 시끄러운 새해 파티를 한다.","녜삐는 사카 달력의 마지막 날에 열린다.","녜삐는 발리 사람들에게 침묵의 날이다.","녜삐에 사람들은 자유롭게 밖에 나가야 한다."],"opts":["The Balinese have loud New Year’s parties.","Nyepi is held on the last day of the saka calendar.","Nyepi is a day of silence for the Balinese.","People should go outside freely on Nyepi."],"r":{"a":"3) Nyepi is a day of silence for the Balinese.","ev":"2, 4, 5, 11번 문장","s":[[2,"But the Balinese welcome their New Year differently.","그러나 발리 사람들은 새해를 다르게 맞이한다."],[4,"Nyepi is a day of silence.","녜삐는 침묵의 날이다."],[5,"It takes place on the first day of the Balinese saka calendar.","그것은 발리식 ‘사카’ 달력의 첫날에 이루어진다."],[11,"People should stay indoors on Nyepi.","녜삐에 사람들은 실내에 머물러야 한다."]],"w":"4번에서 Nyepi is a day of silence(녜삐는 침묵의 날이다)라고 해요. 발리 사람들은 새해를 시끄러운 파티가 아니라 다르게 맞이하고(2번), 녜삐는 사카 달력의 첫날이며(5번), 사람들은 실내에 머물러야 해요(11번).","c":3},"h":"130cb57072"},{"n":9,"t":"sum","q":"On Nyepi, people stay (A) and do not make any (B).","ko":"녜삐에 사람들은 (A)에 머물고 어떠한 (B)도 내지 않는다.","oko":["(A) 야외 / (B) 소리","(A) 실내 / (B) 돈","(A) 바쁘게 / (B) 소리","(A) 야외 / (B) 평화","(A) 실내 / (B) 소리"],"opts":["(A) outdoors / (B) noise","(A) indoors / (B) money","(A) busy / (B) noise","(A) outdoors / (B) peace","(A) indoors / (B) noise"],"r":{"a":"5) (A) indoors / (B) noise","ev":"8, 11번 문장","s":[[8,"They don’t make any noise.","그들은 어떠한 소리도 내지 않는다."],[11,"People should stay indoors on Nyepi.","녜삐에 사람들은 실내에 머물러야 한다."]],"w":"11번에서 사람들은 실내에 머물러야 하고(indoors), 8번에서 어떠한 소리(noise)도 내지 않는다고 해요.","c":5},"h":"b14dc19fb5"},{"n":10,"t":"fill","q":"If all is quiet on Nyepi, [A] think no one is there and leave, and this brings good [B] to Bali.","ko":"녜삐에 모두가 조용하면 [A]은 아무도 없다고 생각해서 떠나고, 이것은 발리에 좋은 [B]을 가져다준다.","bank":["demons","luck","quiet","fooled","indoors","there"],"bko":{"demons":"악령","luck":"행운","quiet":"조용한","fooled":"속은","indoors":"실내에서","there":"그곳에"},"r":{"a":"[A] demons, [B] luck","ev":"12~14번 문장","s":[[12,"The Balinese think demons will be fooled if all is quiet on Nyepi.","발리 사람들은 녜삐에 모두가 조용하면 악령이 속을 거라고 생각한다."],[13,"The demons will think no one is there and leave.","악령은 그곳에 아무도 없다고 생각해서 떠날 것이다."],[14,"This will bring good luck and peace to Bali.","이것이 발리에 행운과 평화를 가져다줄 것이다."]],"w":"12번에서 모두 조용하면 악령(demons)이 속는다고 하고, 13번에서 악령이 아무도 없다고 생각하고 떠나요. 14번에서 이것이 발리에 행운(luck)과 평화를 가져다줘요.","c":null},"h":"453b8e3e2b"}]},{"u":4,"id":"rt2-04-1","no":1,"ko":"아래로 더 아래로","items":[{"n":1,"t":"tf","q":"Players stand about 10 steps away from each other at the start.","ko":"선수들은 시작할 때 서로 약 10걸음 떨어져 선다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"First, find a partner.","먼저, 짝을 찾아라."],[4,"Stand about 10 steps away from each other.","서로 약 10걸음 정도 떨어져 서라."]],"w":"4번에 Stand about 10 steps away from each other가 나와요. 먼저 짝을 찾은 뒤(3번) 그렇게 서요.","c":"T"},"h":"3863e047af"},{"n":2,"t":"tf","q":"A player takes a step back when he or she drops the ball.","ko":"선수는 공을 떨어뜨리면 한 걸음 뒤로 물러난다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"If no one drops the ball for a long time, each player takes a step back.","만약 아무도 오랫동안 그 공을 떨어뜨리지 않으면, 각 선수는 한 걸음 뒤로 물러난다."],[7,"However, if you drop the ball, you must go down on one knee.","하지만, 당신이 그 공을 떨어뜨리면, 한쪽 무릎을 꿇어야 한다."]],"w":"한 걸음 뒤로 물러나는 것은 오랫동안 아무도 공을 떨어뜨리지 않을 때예요(6번). 공을 떨어뜨리면 한쪽 무릎을 꿇어요(7번).","c":"F"},"h":"5529b251da"},{"n":3,"t":"tf","q":"The name of the game is Down, Down, Down.","ko":"그 게임의 이름은 다운, 다운, 다운이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It’s called Down, Down, Down.","그것은 다운, 다운, 다운이라고 불린다."]],"w":"2번에 It's called Down, Down, Down이라고 나와요. be called는 '~라고 불리다'라는 뜻이라서 게임의 이름이 Down, Down, Down이에요.","c":"T"},"h":"c006a20101"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then gently throw a tennis ball back and forth.)","ko":"그러고 나서 왔다 갔다 부드럽게 테니스공을 던져라.","opts":["세게","빠르게","부드럽게","높이"],"word":"gently","r":{"a":"3) 부드럽게","ev":"5번 문장","s":[[5,"Then gently throw a tennis ball back and forth.","그러고 나서 왔다 갔다 부드럽게 테니스공을 던져라."]],"w":"테니스공을 서로 주고받는 상황에서 gently는 '부드럽게'라는 뜻이에요. 세게 던지는 게 아니에요.","c":3},"h":"de3f6742bc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Then the game continues.)","ko":"그리고 게임은 계속된다.","opts":["계속되다","끝나다","바뀌다","멈추다"],"word":"continues","r":{"a":"1) 계속되다","ev":"8번 문장","s":[[8,"Then the game continues.","그리고 게임은 계속된다."]],"w":"한쪽 무릎을 꿇은 다음에도(7번) Then the game continues라고 해요. 게임이 끝나는 것이 아니라 이어진다는 뜻이에요. continue = 계속되다.","c":1},"h":"238c169fcf"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nAfter that, you have to place one elbow on the floor and then put down the other.","ko":"밑줄 친 that가 가리키는 것은?","sko":"그 후, 한쪽 팔꿈치를 바닥에 놓고 그 다음에는 다른 쪽 팔꿈치를 내려놓아야 한다.","opts":["한쪽 무릎을 꿇은 것","게임을 처음 시작한 것","두 번째로 떨어뜨려 양 무릎을 꿇은 것","공을 부드럽게 던진 것"],"r":{"a":"3) 두 번째로 떨어뜨려 양 무릎을 꿇은 것","ev":"9~10번 문장","s":[[9,"On the second drop, you must kneel on both knees.","두 번째로 떨어뜨릴 때, 당신은 양 무릎을 꿇어야 한다."],[10,"After that, you have to place one elbow on the floor and then put down the other.","그 후, 한쪽 팔꿈치를 바닥에 놓고 그 다음에는 다른 쪽 팔꿈치를 내려놓아야 한다."]],"w":"10번 After that의 that은 바로 앞 9번 내용이에요. 두 번째로 떨어뜨려 양 무릎을 꿇은 뒤에 팔꿈치를 바닥에 놓아요.","c":3},"h":"b737ceef2e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If no one drops the ball for a long time, each player takes a step back.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 아무도 오랫동안 그 공을 떨어뜨리지 않으면, 각 선수는 한 걸음 뒤로 물러난다.","opts":["공을 한 번도 떨어뜨리지 않으면 한 걸음 앞으로 나온다.","한 명이라도 떨어뜨리면 각 선수가 한 걸음 물러난다.","공을 떨어뜨리는 사람은 한 걸음 뒤로 물러난다.","오랫동안 아무도 공을 떨어뜨리지 않으면 각 선수는 한 걸음 뒤로 물러난다."],"r":{"a":"4) 오랫동안 아무도 공을 떨어뜨리지 않으면 각 선수는 한 걸음 뒤로 물러난다.","ev":"6번 문장","s":[[6,"If no one drops the ball for a long time, each player takes a step back.","만약 아무도 오랫동안 그 공을 떨어뜨리지 않으면, 각 선수는 한 걸음 뒤로 물러난다."]],"w":"If no one drops the ball for a long time은 '오랫동안 아무도 공을 떨어뜨리지 않으면'이고, each player takes a step back은 '각 선수가 한 걸음 뒤로 물러난다'예요.","c":4},"h":"25a28953af"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["선수들은 서로 바로 옆에 붙어 서서 게임을 시작한다.","첫 번째로 떨어뜨린 뒤에는 한쪽 무릎을 꿇어야 한다.","선수들은 서로에게 무거운 공을 세게 던진다.","공을 처음 떨어뜨린 선수는 곧바로 게임에서 진다."],"opts":["Players start the game standing right next to each other.","After the first drop, you must go down on one knee.","Players throw a heavy ball hard to each other.","The player who drops the ball first loses the game right away."],"r":{"a":"2) After the first drop, you must go down on one knee.","ev":"4, 5, 7, 12번 문장","s":[[4,"Stand about 10 steps away from each other.","서로 약 10걸음 정도 떨어져 서라."],[5,"Then gently throw a tennis ball back and forth.","그러고 나서 왔다 갔다 부드럽게 테니스공을 던져라."],[7,"However, if you drop the ball, you must go down on one knee.","하지만, 당신이 그 공을 떨어뜨리면, 한쪽 무릎을 꿇어야 한다."],[12,"If you drop the ball again, you lose the game.","만약 당신이 한 번 더 그 공을 떨어뜨리면, 당신은 게임에서 지게 된다."]],"w":"4번에서 서로 10걸음 떨어져 서고, 5번에서 테니스공을 부드럽게 던져요. 처음 떨어뜨리면 한쪽 무릎을 꿇고(7번), 게임에서 지는 것은 마지막에 또 떨어뜨릴 때예요(12번).","c":2},"h":"8eb59b49de"},{"n":9,"t":"sum","q":"At first, a player who drops the ball goes down on one (A). At the end, a player who drops the ball again (B) the game.","ko":"처음에 공을 떨어뜨리는 선수는 한쪽 (A)을 꿇는다. 마지막에 공을 또 떨어뜨리는 선수는 게임에서 (B).","oko":["(A) 팔꿈치 / (B) 이긴다","(A) 무릎 / (B) 이긴다","(A) 턱 / (B) 진다","(A) 팔꿈치 / (B) 진다","(A) 무릎 / (B) 진다"],"opts":["(A) elbow / (B) wins","(A) knee / (B) wins","(A) chin / (B) loses","(A) elbow / (B) loses","(A) knee / (B) loses"],"r":{"a":"5) (A) knee / (B) loses","ev":"7, 12번 문장","s":[[7,"However, if you drop the ball, you must go down on one knee.","하지만, 당신이 그 공을 떨어뜨리면, 한쪽 무릎을 꿇어야 한다."],[12,"If you drop the ball again, you lose the game.","만약 당신이 한 번 더 그 공을 떨어뜨리면, 당신은 게임에서 지게 된다."]],"w":"7번에서 공을 떨어뜨리면 한쪽 무릎(knee)을 꿇어요. 12번에서 마지막에 또 떨어뜨리면 게임에서 져요(loses).","c":5},"h":"d1b71094e3"},{"n":10,"t":"fill","q":"On the second drop, you must kneel on both [A]. The final body part to go down is the [B].","ko":"두 번째로 떨어뜨릴 때 양 [A]을 꿇어야 한다. 마지막으로 내려가는 신체 부위는 [B]이다.","bank":["knees","chin","ball","partner","floor","tennis"],"bko":{"knees":"무릎","chin":"턱","ball":"공","partner":"짝","floor":"바닥","tennis":"테니스"},"r":{"a":"[A] knees, [B] chin","ev":"9, 11번 문장","s":[[9,"On the second drop, you must kneel on both knees.","두 번째로 떨어뜨릴 때, 당신은 양 무릎을 꿇어야 한다."],[11,"The final body part to go down is the chin.","아래로 내려갈 마지막 신체 부위는 턱이다."]],"w":"9번에서 두 번째로 떨어뜨리면 양 무릎(knees)을 꿇고, 11번에서 마지막으로 내려가는 신체 부위는 턱(chin)이에요.","c":null},"h":"91646866d0"}]},{"u":4,"id":"rt2-04-2","no":2,"ko":"이 컵이 필요했지?","items":[{"n":1,"t":"tf","q":"Most men grew mustaches in the mid-19th century.","ko":"19세기 중반에 대부분의 남성들은 콧수염을 길렀다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In the mid-19th century, most men grew mustaches.","19세기 중반에, 대부분의 남성들은 콧수염을 길렀다."]],"w":"1번에 In the mid-19th century, most men grew mustaches가 그대로 나와요.","c":"T"},"h":"6822782bcf"},{"n":2,"t":"tf","q":"Harvey Adams invented the mustache cup in France.","ko":"Harvey Adams는 프랑스에서 콧수염 컵을 발명했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"In England during the 1860s, he invented the mustache cup!","1860년대 영국에서 그는 콧수염 컵을 발명했다!"]],"w":"8번에서 In England during the 1860s, he invented the mustache cup이라고 해요. 프랑스가 아니라 영국이에요.","c":"F"},"h":"9aa0c71dcb"},{"n":3,"t":"tf","q":"Men often used wax on their mustaches.","ko":"남성들은 흔히 콧수염에 왁스를 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"So they often used wax.","그래서 그들은 흔히 왁스를 사용했다."]],"w":"3번에서 So they often used wax라고 해요. 콧수염을 단정하게 하려고 왁스를 자주 썼다는 내용과 같아요.","c":"T"},"h":"9240309d2a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They wanted to keep their mustaches neat.)","ko":"그들은 콧수염을 단정하게 유지하기를 원했다.","opts":["길게","더럽게","단정하게","두껍게"],"word":"neat","r":{"a":"3) 단정하게","ev":"2번 문장","s":[[2,"They wanted to keep their mustaches neat.","그들은 콧수염을 단정하게 유지하기를 원했다."]],"w":"콧수염을 neat하게 유지하고 싶어서 왁스를 썼어요(3번). 왁스는 모양을 잡아 주니 neat은 '단정하게'예요.","c":3},"h":"9b8099c849"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It protected the mustache by covering it.)","ko":"그것은 콧수염을 가려서 그것을 보호했다.","opts":["보호했다","녹였다","젖게 했다","잘랐다"],"word":"protected","r":{"a":"1) 보호했다","ev":"9~10번 문장","s":[[9,"This special cup had a small barrier.","이 특별한 컵에는 작은 가림막이 있었다."],[10,"It protected the mustache by covering it.","그것은 콧수염을 가려서 그것을 보호했다."]],"w":"가림막이 콧수염을 가려서(covering) 하는 일이에요. 뜨거운 차로부터 지켜 준다는 뜻이니 '보호했다'가 맞아요.","c":1},"h":"c72f87f5e6"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt also had a small hole to drink through.","ko":"밑줄 친 It가 가리키는 것은?","sko":"(구멍을) 통해 마실 수 있는 작은 구멍도 있었다.","opts":["콧수염","뜨거운 차","왁스","콧수염 컵"],"r":{"a":"4) 콧수염 컵","ev":"9, 11번 문장","s":[[9,"This special cup had a small barrier.","이 특별한 컵에는 작은 가림막이 있었다."],[11,"It also had a small hole to drink through.","(구멍을) 통해 마실 수 있는 작은 구멍도 있었다."]],"w":"11번의 It은 9번의 This special cup을 이어받은 말이에요. 콧수염 컵에 마실 수 있는 작은 구멍도 있었다는 뜻이에요.","c":4},"h":"dc8523e8b9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, this made enjoying tea difficult.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나, 이는 차를 즐기는 것을 어렵게 만들었다.","opts":["이것 때문에 차를 즐기기 쉬워졌다.","그러나 이것은 차를 즐기는 것을 어렵게 만들었다.","그러나 이것은 차를 만드는 것을 어렵게 만들었다.","이것 때문에 차를 마시고 싶어졌다."],"r":{"a":"2) 그러나 이것은 차를 즐기는 것을 어렵게 만들었다.","ev":"3~4번 문장","s":[[3,"So they often used wax.","그래서 그들은 흔히 왁스를 사용했다."],[4,"However, this made enjoying tea difficult.","그러나, 이는 차를 즐기는 것을 어렵게 만들었다."]],"w":"made enjoying tea difficult는 '차를 즐기는 것을 어렵게 만들었다'는 뜻이에요. 왁스를 쓰는 것(3번)이 차를 즐기기에 불편했다는 문장이에요.","c":2},"h":"215341238e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["콧수염 컵은 유럽에서 인기가 없어졌다.","Harvey Adams는 영국의 의사였다.","뜨거운 차는 남성의 콧수염에 바른 왁스를 녹일 수 있었다.","컵에 구멍이 없어서 남성들은 그것으로 마실 수 없었다."],"opts":["Mustache cups became unpopular in Europe.","Harvey Adams was a British doctor.","Hot tea could melt the wax on a man’s mustache.","The cup had no hole, so men could not drink through it."],"r":{"a":"3) Hot tea could melt the wax on a man’s mustache.","ev":"5, 7, 11, 13번 문장","s":[[5,"Hot tea could melt the wax or get their mustaches wet.","뜨거운 차가 왁스를 녹이거나 콧수염을 젖게 할 수도 있었다."],[7,"Harvey Adams, a British potter, had an idea.","영국의 도예가 Harvey Adams는 아이디어가 떠올랐다."],[11,"It also had a small hole to drink through.","(구멍을) 통해 마실 수 있는 작은 구멍도 있었다."],[13,"Soon mustache cups became popular all over Europe.","곧 콧수염 컵은 유럽 전역에서 인기를 얻게 되었다."]],"w":"5번에서 뜨거운 차가 왁스를 녹일 수 있다고 해요. Harvey Adams는 영국의 도예가였고(7번), 컵에는 마실 수 있는 작은 구멍이 있었으며(11번), 유럽에서 인기를 얻었어요(13번).","c":3},"h":"90c3f2d015"},{"n":9,"t":"sum","q":"The mustache cup had a (A) to protect the mustache and a small (B) to drink through.","ko":"콧수염 컵에는 콧수염을 보호하는 작은 (A)와 통해 마실 수 있는 작은 (B)가 있었다.","oko":["(A) 구멍 / (B) 가림막","(A) 손잡이 / (B) 구멍","(A) 가림막 / (B) 손잡이","(A) 뚜껑 / (B) 빨대","(A) 가림막 / (B) 구멍"],"opts":["(A) hole / (B) barrier","(A) handle / (B) hole","(A) barrier / (B) handle","(A) lid / (B) straw","(A) barrier / (B) hole"],"r":{"a":"5) (A) barrier / (B) hole","ev":"9~11번 문장","s":[[9,"This special cup had a small barrier.","이 특별한 컵에는 작은 가림막이 있었다."],[10,"It protected the mustache by covering it.","그것은 콧수염을 가려서 그것을 보호했다."],[11,"It also had a small hole to drink through.","(구멍을) 통해 마실 수 있는 작은 구멍도 있었다."]],"w":"9~10번에서 작은 가림막(barrier)이 콧수염을 가려 보호하고, 11번에서 작은 구멍(hole)으로 마신다고 해요. 가림막과 구멍의 역할이 바뀌면 안 돼요.","c":5},"h":"2518abce74"},{"n":10,"t":"fill","q":"Because of the mustache cup, a gentleman could enjoy his [A] time, and it soon became [B] all over Europe.","ko":"콧수염 컵 덕분에 신사는 [A] 시간을 즐길 수 있었고, 그것은 곧 유럽 전역에서 [B] 되었다.","bank":["tea","popular","protected","invented","melt","cover"],"bko":{"tea":"차","popular":"인기 있는","protected":"보호했다","invented":"발명했다","melt":"녹이다","cover":"가리다"},"r":{"a":"[A] tea, [B] popular","ev":"12~13번 문장","s":[[12,"Finally a gentleman could have a handsome mustache and enjoy his tea time.","마침내 신사는 멋진 콧수염을 가지고 차를 마시는 시간을 즐길 수 있었다."],[13,"Soon mustache cups became popular all over Europe.","곧 콧수염 컵은 유럽 전역에서 인기를 얻게 되었다."]],"w":"12번에서 신사가 차 마시는 시간(tea time)을 즐길 수 있게 됐고, 13번에서 콧수염 컵이 유럽 전역에서 인기 있게(popular) 됐어요.","c":null},"h":"273961cf57"}]},{"u":4,"id":"rt2-04-3","no":3,"ko":"그림을 다시 보면?","items":[{"n":1,"t":"tf","q":"Arcimboldo’s portraits look like people from a distance.","ko":"Arcimboldo의 초상화는 멀리서 보면 사람처럼 보인다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"From a distance, they look like people.","멀리서 보면, 그것들은 사람처럼 보인다."]],"w":"5번에 From a distance, they look like people이라고 나와요. they는 그의 초상화들이에요.","c":"T"},"h":"3938017511"},{"n":2,"t":"tf","q":"The Vegetable Gardener is a painting of flowers in a garden.","ko":"<채소 기르는 사람>은 정원에 핀 꽃 그림이다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"An example of his work is The Vegetable Gardener.","그의 작품 중 한 예는 <채소 기르는 사람>이다."],[9,"It is a painting of vegetables in a bowl.","그것은 그릇에 담긴 채소 그림이다."]],"w":"9번에서 <채소 기르는 사람>은 그릇에 담긴 채소 그림(a painting of vegetables in a bowl)이라고 해요. 정원의 꽃이 아니에요.","c":"F"},"h":"a59c9f4e96"},{"n":3,"t":"tf","q":"When you turn the painting upside down, someone is smiling at you.","ko":"그림을 거꾸로 돌리면 어떤 사람이 당신을 보고 미소 짓고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"When you turn the painting upside down, someone is smiling at you!","그 그림을 거꾸로 돌리면, 어떤 사람이 당신을 보고 미소 짓고 있다!"]],"w":"10번에 When you turn the painting upside down, someone is smiling at you!가 그대로 나와요.","c":"T"},"h":"1803e70b47"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He painted some playful portraits.)","ko":"그는 몇 점의 재미있는 초상화를 그렸다.","opts":["지루한","무서운","재미있는","오래된"],"word":"playful","r":{"a":"3) 재미있는","ev":"2, 4번 문장","s":[[2,"But Giuseppe Arcimboldo’s work is fun.","하지만 주세페 아르침볼도의 작품은 재미있다."],[4,"He painted some playful portraits.","그는 몇 점의 재미있는 초상화를 그렸다."]],"w":"2번에서 Arcimboldo의 작품은 fun(재미있다)이라고 해요. 4번의 playful portraits도 같은 뜻으로 '재미있는 초상화'예요.","c":3},"h":"36e2c37d3f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But look closely!)","ko":"하지만 가까이서 보라!","opts":["가까이서 자세히","멀리서","빠르게","조용히"],"word":"closely","r":{"a":"1) 가까이서 자세히","ev":"5~6번 문장","s":[[5,"From a distance, they look like people.","멀리서 보면, 그것들은 사람처럼 보인다."],[6,"But look closely!","하지만 가까이서 보라!"]],"w":"5번에서 멀리서(from a distance) 볼 때와 달리 6번에서는 But look closely라고 해요. 반대되는 말이라 '가까이서 자세히'가 맞아요.","c":1},"h":"c610c2728e"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nFrom a distance, they look like people.","ko":"밑줄 친 th
