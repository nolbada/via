"Besides basic tastes, the rest of the taste comes from smelling.","Holding your nose helps you avoid the taste of bitter medicine."],"r":{"a":"3) Besides basic tastes, the rest of the taste comes from smelling.","ev":"4, 5, 8, 11번 문장","s":[[4,"The taste buds on your tongue only recognize basic tastes, such as sweet, sour, bitter, and salty.","당신 혀의 미뢰는 오직 단맛, 신맛, 쓴맛, 그리고 짠맛과 같은 기본적인 맛만 인식할 수 있다."],[5,"The rest of the taste comes from smelling.","맛의 나머지는 냄새를 맡는 것에서 온다."],[8,"However, when your nose is stuffed, the scent cannot reach the nerve cells because of the mucus.","그러나 당신의 코가 막혔을 때, (코에서 나오는) 점액 때문에 냄새가 신경 세포에 도달하지 못한다."],[11,"It does not because we don’t use our sense of smell when tasting bitter flavors!","우리가 쓴 맛을 맛볼 때 우리의 후각을 이용하지 않기 때문에 그것은 아니다!"]],"w":"5번에서 나머지 맛은 냄새를 맡는 것에서 온다고 해요. 미뢰는 기본적인 맛만 인식하고(4번), 점액은 냄새가 닿는 것을 막으며(8번), 코를 잡아도 쓴맛을 피하지 못해요(11번).","c":3},"h":"edd15dd7c0"},{"n":9,"t":"sum","q":"When your nose is stuffed, the (A) cannot reach the nerve cells because of mucus, so you cannot (B) the food well.","ko":"코가 막히면 점액 때문에 (A)이 신경 세포에 도달하지 못해서, 당신은 음식의 (B)을 잘 느낄 수 없다.","oko":["(A) 약 / (B) 맛을 느끼다","(A) 냄새 / (B) 요리하다","(A) 혀 / (B) 맛을 느끼다","(A) 뇌 / (B) 요리하다","(A) 냄새 / (B) 맛을 느끼다"],"opts":["(A) medicine / (B) taste","(A) scent / (B) cook","(A) tongue / (B) taste","(A) brain / (B) cook","(A) scent / (B) taste"],"r":{"a":"5) (A) scent / (B) taste","ev":"8~9번 문장","s":[[8,"However, when your nose is stuffed, the scent cannot reach the nerve cells because of the mucus.","그러나 당신의 코가 막혔을 때, (코에서 나오는) 점액 때문에 냄새가 신경 세포에 도달하지 못한다."],[9,"So you cannot taste the food well.","그래서 당신은 음식 맛을 잘 느낄 수 없다."]],"w":"8번에서 코가 막히면 점액 때문에 냄새(scent)가 신경 세포에 닿지 못하고, 9번에서 그래서 음식 맛을 잘 느낄 수(taste) 없다고 해요.","c":5},"h":"0b3608074d"},{"n":10,"t":"fill","q":"The taste buds on your tongue only recognize [A] tastes, and the rest of the taste comes from [B].","ko":"당신 혀의 미뢰는 오직 [A] 맛만 인식하고, 맛의 나머지는 [B]에서 온다.","bank":["basic","smelling","mucus","nerve","medicine","stuffed"],"bko":{"basic":"기본적인","smelling":"냄새를 맡는 것","mucus":"점액","nerve":"신경","medicine":"약","stuffed":"막힌"},"r":{"a":"[A] basic, [B] smelling","ev":"4~5번 문장","s":[[4,"The taste buds on your tongue only recognize basic tastes, such as sweet, sour, bitter, and salty.","당신 혀의 미뢰는 오직 단맛, 신맛, 쓴맛, 그리고 짠맛과 같은 기본적인 맛만 인식할 수 있다."],[5,"The rest of the taste comes from smelling.","맛의 나머지는 냄새를 맡는 것에서 온다."]],"w":"4번에 only recognize basic tastes(기본적인 맛만 인식한다)가, 5번에 The rest of the taste comes from smelling(맛의 나머지는 냄새를 맡는 것에서 온다)이 있어요. 나머지 단어는 이 빈칸에 넣으면 뜻이 맞지 않아요.","c":null},"h":"029bfcf08e"}]},{"u":7,"id":"rj2-07-1","no":1,"ko":"닻이 걸렸다!","items":[{"n":1,"t":"tf","q":"The cheaper item is still over the buyer's budget.","ko":"그 더 저렴한 물건도 여전히 구매자의 예산을 초과한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The cheaper item is still over your budget.","그 더 저렴한 물건도 여전히 당신의 예산을 초과한다."]],"w":"3번 문장에서 더 저렴한 물건도 여전히 예산(your budget)을 넘는다고 해요. 그래서 맞는 내용이에요.","c":"T"},"h":"88309e7197"},{"n":2,"t":"tf","q":"People usually rely the most on the information they find last.","ko":"사람들은 보통 그들이 마지막으로 찾은 정보에 가장 많이 의존한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"They usually rely the most on the information that they find first ―the “anchor.”","그들은 보통 그들이 처음 찾은 정보인 ‘닻’에 가장 많이 의존한다."]],"w":"7번 문장에서 사람들이 가장 많이 의존하는 정보는 처음(first) 찾은 정보예요. 마지막이라는 말은 반대예요.","c":"F"},"h":"6d84c4568a"},{"n":3,"t":"tf","q":"Customers see the expensive dishes first, so the other dishes look cheap.","ko":"고객들은 비싼 요리를 먼저 보고, 그래서 나머지 요리들이 싸 보인다.","r":{"a":"T (본문과 맞는 내용)","ev":"12~13번 문장","s":[[12,"Customers see these items first.","고객들은 이 상품들을 먼저 본다."],[13,"So, the other dishes seem cheap even if they really aren’t.","그래서 나머지 요리들은 비록 실제로 그렇지 않더라도 저렴해 보인다."]],"w":"12번에서 손님은 비싼 요리를 먼저 보고, 13번 So(그래서) 뒤에서 나머지 요리가 싸 보인다고 해요.","c":"T"},"h":"9e12eb3a0f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then you see an item that is similar but cheaper.)","ko":"그런 다음 당신은 ( ) 더 싼 물건을 발견한다.","opts":["다른","오래된","비슷한","무거운"],"word":"similar","r":{"a":"3) 비슷한","ev":"2번 문장","s":[[2,"Then you see an item that is similar but cheaper.","그런 다음 당신은 비슷하지만 더 싼 물건을 발견한다."]],"w":"2번 문장은 앞서 본 비싼 물건과 '비슷하지만' 더 싼 물건을 봤다는 뜻이에요. similar = 비슷한.","c":3},"h":"1c7e38042a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The anchoring effect happens because of the way people process information.)","ko":"닻 내림 효과는 사람들이 정보를 ( ) 방식 때문에 발생한다.","opts":["숨기다","처리하다","바꾸다","팔다"],"word":"process","r":{"a":"2) 처리하다","ev":"6번 문장","s":[[6,"The anchoring effect happens because of the way people process information.","그 닻 내림 효과는 사람들이 정보를 처리하는 방식 때문에 발생한다."]],"w":"6번 문장은 효과가 생기는 이유를 말해요. 사람들이 정보를 받아들여 '처리하는' 방식 때문이에요. process = 처리하다.","c":2},"h":"d5112db7f9"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThat is because it can change the way customers think.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것은 닻 내림 효과가 고객이 생각하는 방식을 바꿀 수 있기 때문이다.","opts":["예산","닻 내림 효과","비싼 요리","메뉴"],"r":{"a":"2) 닻 내림 효과","ev":"9~10번 문장","s":[[9,"The anchoring effect can be a powerful tool for selling products.","닻 내림 효과는 제품을 판매하는 강력한 도구가 될 수 있다."],[10,"That is because it can change the way customers think.","그것은 닻 내림 효과가 고객이 생각하는 방식을 바꿀 수 있기 때문이다."]],"w":"9번에서 닻 내림 효과가 판매의 강력한 도구라고 했고, 10번은 그 이유를 말해요. 고객의 생각을 바꿀 수 있는 것은 The anchoring effect예요.","c":2},"h":"84c2edc5bd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Once they have an anchor, they compare other things to it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"일단 그들이 닻을 갖게 되면, 그들은 다른 것들을 그것과 비교한다.","opts":["닻이 생기면 사람들은 다른 것들을 더는 보지 않는다.","사람들은 다른 것들을 먼저 비교하고 나서 닻을 고른다.","닻은 다른 것들과 비교해서는 안 되는 정보이다.","닻이 생기면 사람들은 다른 것들을 그 닻과 비교한다."],"r":{"a":"4) 닻이 생기면 사람들은 다른 것들을 그 닻과 비교한다.","ev":"8번 문장","s":[[8,"Once they have an anchor, they compare other things to it.","일단 그들이 닻을 갖게 되면, 그들은 다른 것들을 그것과 비교한다."]],"w":"Once는 '일단 ~하면'이에요. 닻(처음 찾은 정보)이 생기면 다른 것들을 it, 즉 그 닻과 비교한다는 뜻이에요.","c":4},"h":"a04902dc00"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고객들은 보통 메뉴에서 싼 요리를 가장 먼저 본다.","닻 내림 효과는 사람들이 처음 찾은 정보를 무시하게 만든다.","많은 식당들은 비싼 요리 몇 가지를 메뉴 맨 위에 놓는다.","닻은 사람들이 마지막으로 찾은 정보이다."],"opts":["Customers usually see the cheap dishes first on a menu.","The anchoring effect makes people ignore the first information they find.","Many restaurants put a few expensive dishes at the top of their menu.","An anchor is the information people find last."],"r":{"a":"3) Many restaurants put a few expensive dishes at the top of their menu.","ev":"7, 11~12번 문장","s":[[7,"They usually rely the most on the information that they find first ―the “anchor.”","그들은 보통 그들이 처음 찾은 정보인 ‘닻’에 가장 많이 의존한다."],[11,"For example, many restaurants place a few expensive dishes at the top of their menu.","예를 들어, 많은 식당들은 메뉴의 맨 위에 몇 가지 값비싼 요리를 놓는다."],[12,"Customers see these items first.","고객들은 이 상품들을 먼저 본다."]],"w":"11번에서 많은 식당이 비싼 요리 몇 개를 메뉴 맨 위에 놓는다고 해요. 닻은 사람들이 처음 찾은 정보이고, 사람들은 그 정보에 가장 많이 의존해요(7번). 손님은 비싼 요리를 먼저 봐요(12번).","c":3},"h":"ec44238818"},{"n":9,"t":"sum","q":"People usually rely the most on the (A) information they find, and they (B) other things to it.","ko":"사람들은 보통 그들이 (A) 찾은 정보에 가장 많이 의존하고, 다른 것들을 그것과 (B)한다.","oko":["(A) 마지막으로 / (B) 비교","(A) 처음 / (B) 숨김","(A) 싼 / (B) 무시","(A) 마지막으로 / (B) 판매","(A) 처음 / (B) 비교"],"opts":["(A) last / (B) compare","(A) first / (B) hide","(A) cheap / (B) ignore","(A) last / (B) sell","(A) first / (B) compare"],"r":{"a":"5) (A) first / (B) compare","ev":"7~8번 문장","s":[[7,"They usually rely the most on the information that they find first ―the “anchor.”","그들은 보통 그들이 처음 찾은 정보인 ‘닻’에 가장 많이 의존한다."],[8,"Once they have an anchor, they compare other things to it.","일단 그들이 닻을 갖게 되면, 그들은 다른 것들을 그것과 비교한다."]],"w":"7번에서 사람들은 처음(first) 찾은 정보(닻)에 가장 많이 의존하고, 8번에서 다른 것들을 그 닻과 비교(compare)해요.","c":5},"h":"2662c792ed"},{"n":10,"t":"fill","q":"The anchoring effect can be a powerful tool because it can [A] the way [B] think.","ko":"닻 내림 효과는 그것이 [B]가 생각하는 방식을 [A]할 수 있기 때문에 강력한 도구가 될 수 있다.","bank":["change","customers","items","menu","dishes","deal"],"bko":{"change":"바꾸다","customers":"고객들","items":"물건들","menu":"메뉴","dishes":"요리들","deal":"거래"},"r":{"a":"[A] change, [B] customers","ev":"9~10번 문장","s":[[9,"The anchoring effect can be a powerful tool for selling products.","닻 내림 효과는 제품을 판매하는 강력한 도구가 될 수 있다."],[10,"That is because it can change the way customers think.","그것은 닻 내림 효과가 고객이 생각하는 방식을 바꿀 수 있기 때문이다."]],"w":"10번 it can change the way customers think에서 가져왔어요. 생각하는 주체는 사람인 customers이고, 그 방식을 change(바꾸다)할 수 있어요. 물건이나 메뉴는 생각하지 못해요.","c":null},"h":"c81fc98ffd"}]},{"u":7,"id":"rj2-07-2","no":2,"ko":"친구 따라 물건을 산다고?","items":[{"n":1,"t":"tf","q":"The term \"bandwagon effect\" comes from American parades.","ko":"‘편승 효과’라는 용어는 미국의 거리 행진에서 유래한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The term comes from American parades.","그 용어는 미국의 거리 행진들에서 유래한다."]],"w":"3번 문장에 The term comes from American parades라고 그대로 나와요.","c":"T"},"h":"abf36a23a9"},{"n":2,"t":"tf","q":"When people heard the music, they stayed away from the bandwagon.","ko":"사람들은 음악 소리를 들었을 때 악대차를 멀리했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"When people heard the music, they followed the bandwagon.","사람들이 그 음악 소리를 들었을 때, 그들은 악대차를 따라갔다."]],"w":"5번 문장에서 사람들은 음악을 듣고 악대차를 따라갔어요(followed the bandwagon). 멀리했다는 말은 반대예요.","c":"F"},"h":"067e7aeb01"},{"n":3,"t":"tf","q":"The writer says people should buy things only when they need them.","ko":"필자는 사람들이 필요할 때만 물건을 사야 한다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Make sure you buy items only when you need them!","반드시 오직 당신이 그것들이 필요할 때만 물건을 사도록 해라!"]],"w":"12번 문장 Make sure you buy items only when you need them!에서 필요할 때만 사라고 해요.","c":"T"},"h":"ac9dac28e7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Soon, more and more people gathered, and they formed a big crowd.)","ko":"곧, 점점 더 많은 사람들이 ( ) 그들은 큰 무리를 형성했다.","opts":["떠났다","모였다","잠들었다","싸웠다"],"word":"gathered","r":{"a":"2) 모였다","ev":"6번 문장","s":[[6,"Soon, more and more people gathered, and they formed a big crowd.","곧, 점점 더 많은 사람들이 모였고, 그들은 큰 무리를 형성했다."]],"w":"6번에서 사람들이 점점 더 많아져 '큰 무리'를 이뤘어요. 그러니 gather는 '모이다'예요.","c":2},"h":"6dc744e9ac"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These days, the term “bandwagon effect” is used to describe the act of people doing something just because others are doing it.)","ko":"요즘에는, ‘편승 효과’라는 용어는 단지 다른 사람들이 그것을 하고 있기 때문에 사람들이 무언가를 하는 행위를 ( ) 데 사용된다.","opts":["묘사하다","숨기다","따라가다","팔다"],"word":"describe","r":{"a":"1) 묘사하다","ev":"8번 문장","s":[[8,"These days, the term “bandwagon effect” is used to describe the act of people doing something just because others are doing it.","요즘에는, ‘편승 효과’라는 용어는 단지 다른 사람들이 그것을 하고 있기 때문에 사람들이 무언가를 하는 행위를 묘사하는 데 사용된다."]],"w":"8번은 편승 효과라는 말이 어떤 행동을 '가리키는 데' 쓰인다는 뜻이에요. describe = 묘사하다, 설명하다.","c":1},"h":"d6b14d43dc"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBut most of them did not know why they had joined the crowd.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그러나 그들 중 대부분은 그들이 왜 무리에 합류했는지 몰랐다.","opts":["악대차들","악단 단원들","모여든 사람들","거리 행진들"],"r":{"a":"3) 모여든 사람들","ev":"5~7번 문장","s":[[5,"When people heard the music, they followed the bandwagon.","사람들이 그 음악 소리를 들었을 때, 그들은 악대차를 따라갔다."],[6,"Soon, more and more people gathered, and they formed a big crowd.","곧, 점점 더 많은 사람들이 모였고, 그들은 큰 무리를 형성했다."],[7,"But most of them did not know why they had joined the crowd.","그러나 그들 중 대부분은 그들이 왜 무리에 합류했는지 몰랐다."]],"w":"7번 them은 6번에서 점점 더 많이 모여 큰 무리를 이룬 사람들이에요. 그 사람들 대부분이 합류한 이유를 몰랐다는 말이에요.","c":3},"h":"558d195ee3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But you should not buy things just because others do.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 단지 다른 사람들이 그런다고(산다고) 해서 물건을 사서는 안 된다.","opts":["남들이 사지 않을 때만 물건을 사야 한다.","남들이 산다는 이유만으로 물건을 사서는 안 된다.","남들이 사는 물건은 반드시 좋은 물건이다.","남들에게 물건을 사 주어서는 안 된다."],"r":{"a":"2) 남들이 산다는 이유만으로 물건을 사서는 안 된다.","ev":"11번 문장","s":[[11,"But you should not buy things just because others do.","그러나 단지 다른 사람들이 그런다고(산다고) 해서 물건을 사서는 안 된다."]],"w":"just because others do는 '단지 다른 사람들이 하기 때문에'라는 뜻이고, should not buy는 '사지 말아야 한다'예요. 남들이 사니까 산다는 이유로만 사면 안 된다는 뜻이에요.","c":2},"h":"e81ea8b2e6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["과거에 악대차는 악단을 싣고 다녔다.","무리에 합류한 사람들은 대부분 그 이유를 알고 있었다.","‘편승 효과’라는 용어는 영국의 행진에서 유래했다.","사람들은 음악 소리를 들으면 악대차에서 도망쳤다."],"opts":["Bandwagons carried a band in the past.","Most people who joined the crowd knew the reason.","The term “bandwagon effect” comes from British parades.","People ran away from the bandwagon when they heard the music."],"r":{"a":"1) Bandwagons carried a band in the past.","ev":"3~5, 7번 문장","s":[[3,"The term comes from American parades.","그 용어는 미국의 거리 행진들에서 유래한다."],[4,"In the past, bandwagons would carry a band.","과거에, 악대차는 악단을 실어 나르곤 했다."],[5,"When people heard the music, they followed the bandwagon.","사람들이 그 음악 소리를 들었을 때, 그들은 악대차를 따라갔다."],[7,"But most of them did not know why they had joined the crowd.","그러나 그들 중 대부분은 그들이 왜 무리에 합류했는지 몰랐다."]],"w":"4번에서 과거에 악대차는 악단을 싣고 다녔다고 해요. 용어는 미국 행진에서 나왔고(3번), 사람들은 따라갔고(5번), 대부분은 합류한 이유를 몰랐어요(7번).","c":1},"h":"7031e49b0a"},{"n":9,"t":"sum","q":"The term “bandwagon effect” comes from (A), and today it describes people doing something just because (B) are doing it.","ko":"‘편승 효과’라는 용어는 (A)에서 유래했고, 오늘날에는 (B)가 하고 있다는 이유만으로 사람들이 무언가를 하는 것을 묘사한다.","oko":["(A) 학교 / (B) 다른 사람들","(A) 행진 / (B) 전문가들","(A) 악단 / (B) 당신","(A) 행진 / (B) 다른 사람들","(A) 가게 / (B) 광고들"],"opts":["(A) schools / (B) others","(A) parades / (B) experts","(A) bands / (B) you","(A) parades / (B) others","(A) stores / (B) advertisements"],"r":{"a":"4) (A) parades / (B) others","ev":"3, 8번 문장","s":[[3,"The term comes from American parades.","그 용어는 미국의 거리 행진들에서 유래한다."],[8,"These days, the term “bandwagon effect” is used to describe the act of people doing something just because others are doing it.","요즘에는, ‘편승 효과’라는 용어는 단지 다른 사람들이 그것을 하고 있기 때문에 사람들이 무언가를 하는 행위를 묘사하는 데 사용된다."]],"w":"3번에서 용어는 미국의 행진(parades)에서 나왔고, 8번에서 오늘날 다른 사람들(others)이 하고 있다는 이유만으로 무언가를 하는 행동을 가리켜요.","c":4},"h":"57b36e384a"},{"n":10,"t":"fill","q":"Many [A] use the bandwagon effect by saying that ten bottles are sold every [B].","ko":"많은 [A]이 매 [B]마다 열 병씩 팔린다고 말하면서 편승 효과를 이용한다.","bank":["advertisements","second","parades","crowd","music","reason"],"bko":{"advertisements":"광고들","second":"초","parades":"행진들","crowd":"무리","music":"음악","reason":"이유"},"r":{"a":"[A] advertisements, [B] second","ev":"10번 문장","s":[[10,"Advertisements that say things like “Ten bottles are sold every second” also use this effect.","“매초에 열 병씩 팔립니다”와 같은 것들을 말하는 광고들 또한 이 효과를 이용한다."]],"w":"10번에서 “Ten bottles are sold every second”라고 말하는 광고(Advertisements)가 이 효과를 이용해요. 행진이나 음악, 무리는 말을 하는 주체가 아니고, 매 '이유'마다라는 표현도 맞지 않아요.","c":null},"h":"02c9211396"}]},{"u":7,"id":"rj2-07-3","no":3,"ko":"나도 모르게 따라 하게 돼!","items":[{"n":1,"t":"tf","q":"A TV advertisement may show a model taking a bite of a hamburger.","ko":"TV 광고는 햄버거를 한 입 먹는 모델을 보여줄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The advertisement may show the model taking a bite of the hamburger.","그 광고는 햄버거를 한 입 먹는 모델을 보여줄 수 있다."]],"w":"8번 문장에서 광고가 햄버거를 한 입 먹는 모델을 보여줄 수 있다고 해요.","c":"T"},"h":"5ca9296a24"},{"n":2,"t":"tf","q":"People who watch the advertisement can never copy the model.","ko":"광고를 보는 사람들은 결코 모델을 따라 할 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Due to mirror neurons, people who watch the advertisement may start to copy the model.","거울 뉴런 때문에 광고를 본 사람들은 그 모델을 따라 하기 시작할지도 모른다."]],"w":"9번에서 거울 뉴런 때문에 광고를 본 사람들은 모델을 따라 하기 시작할 수 있다고 해요. never(결코 ~ 않는다)는 반대예요.","c":"F"},"h":"cc244737f0"},{"n":3,"t":"tf","q":"Marketing experts try to use the effect of mirror neurons.","ko":"마케팅 전문가들은 거울 뉴런의 효과를 사용하려고 노력한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"This can even cause you to copy what you have seen.","이것은 심지어 당신으로 하여금 당신이 본 것을 따라 하게 할 수도 있다."],[6,"Marketing experts try to use this effect.","마케팅 전문가들은 이 효과를 사용하려고 노력한다."]],"w":"5번에서 거울 뉴런 때문에 본 것을 따라 하게 된다고 하고, 6번에서 마케팅 전문가들이 이 효과(this effect)를 이용하려 한다고 해요.","c":"T"},"h":"ef3bf78743"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Without even noticing it, they might imitate the model’s emotions and facial expressions.)","ko":"그들은 그것을 알아채지도 못하고 모델의 감정과 표정을 ( ) 수도 있다.","opts":["무시하다","숨기다","모방하다","설명하다"],"word":"imitate","r":{"a":"3) 모방하다","ev":"10번 문장","s":[[10,"Without even noticing it, they might imitate the model’s emotions and facial expressions.","그들은 그것을 알아채지도 못하고 모델의 감정과 표정을 모방할 수도 있다."]],"w":"10번은 알아채지도 못한 채 모델의 감정과 표정을 '따라 한다'는 내용이에요. imitate = 모방하다, 따라 하다.","c":3},"h":"fdeab6ce12"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When you see someone doing something, your brain’s mirror neurons react as if you were actually doing it yourself.)","ko":"당신이 누군가가 무언가를 하는 것을 볼 때, 당신의 뇌 속 거울 뉴런이 당신이 실제로 그것을 직접 하고 있는 것처럼 ( ).","opts":["거절하다","기억하다","사라지다","반응하다"],"word":"react","r":{"a":"4) 반응하다","ev":"4번 문장","s":[[4,"When you see someone doing something, your brain’s mirror neurons react as if you were actually doing it yourself.","당신이 누군가가 무언가를 하는 것을 볼 때, 당신의 뇌 속 거울 뉴런이 당신이 실제로 그것을 직접 하고 있는 것처럼 반응한다."]],"w":"4번은 남이 하는 것을 볼 때 거울 뉴런이 마치 직접 하는 것처럼 '반응한다'는 뜻이에요. react = 반응하다.","c":4},"h":"722572a857"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis can even cause you to copy what you have seen.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 심지어 당신으로 하여금 당신이 본 것을 따라 하게 할 수도 있다.","opts":["광고 속 모델","거울 뉴런이 직접 하는 것처럼 반응하는 것","TV 광고","햄버거"],"r":{"a":"2) 거울 뉴런이 직접 하는 것처럼 반응하는 것","ev":"4~5번 문장","s":[[4,"When you see someone doing something, your brain’s mirror neurons react as if you were actually doing it yourself.","당신이 누군가가 무언가를 하는 것을 볼 때, 당신의 뇌 속 거울 뉴런이 당신이 실제로 그것을 직접 하고 있는 것처럼 반응한다."],[5,"This can even cause you to copy what you have seen.","이것은 심지어 당신으로 하여금 당신이 본 것을 따라 하게 할 수도 있다."]],"w":"5번의 This는 바로 앞 4번 내용, 즉 남이 하는 것을 볼 때 거울 뉴런이 직접 하는 것처럼 반응하는 일이에요. 그래서 본 것을 따라 하게 될 수도 있다는 말이에요.","c":2},"h":"14df02a62e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, the advertisement makes them want the real thing!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로, 광고는 그들이 실제인 것을 원하게 만든다!","opts":["그 결과 광고는 시청자가 실제 물건을 잊게 만든다.","그 결과 시청자는 광고를 보지 않게 된다.","그 결과 광고는 모델이 실제 물건을 원하게 만든다.","그 결과 광고는 시청자가 실제 물건을 원하게 만든다."],"r":{"a":"4) 그 결과 광고는 시청자가 실제 물건을 원하게 만든다.","ev":"12번 문장","s":[[12,"As a result, the advertisement makes them want the real thing!","결과적으로, 광고는 그들이 실제인 것을 원하게 만든다!"]],"w":"As a result는 '결과적으로'이고, makes them want는 '그들이 원하게 만든다'예요. them은 앞 문장의 시청자들이에요. 광고를 본 시청자가 진짜 물건을 원하게 된다는 뜻이에요.","c":4},"h":"c066ce49d8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["거울 뉴런은 뇌 바깥에 있다.","마케팅 전문가들은 거울 뉴런의 효과를 피하려고 한다.","시청자들은 알아채지 못한 채 모델의 얼굴 표정을 따라 할 수 있다.","사람들은 모델을 따라 할 때 항상 그것을 알아챈다."],"opts":["Mirror neurons are found outside the brain.","Marketing experts try to avoid the effect of mirror neurons.","Viewers may imitate the model’s facial expressions without noticing it.","People always notice when they copy the model."],"r":{"a":"3) Viewers may imitate the model’s facial expressions without noticing it.","ev":"3, 6, 10번 문장","s":[[3,"If so, you might have been influenced by mirror neurons in the brain.","만약 그렇다면, 당신은 뇌의 거울 뉴런에 의해 영향을 받았을지도 모른다."],[6,"Marketing experts try to use this effect.","마케팅 전문가들은 이 효과를 사용하려고 노력한다."],[10,"Without even noticing it, they might imitate the model’s emotions and facial expressions.","그들은 그것을 알아채지도 못하고 모델의 감정과 표정을 모방할 수도 있다."]],"w":"10번에서 사람들은 알아채지도 못하고 모델의 표정을 모방할 수 있어요. 거울 뉴런은 뇌에 있고(3번), 마케팅 전문가는 이 효과를 이용하려 해요(6번).","c":3},"h":"c203f02448"},{"n":9,"t":"sum","q":"Mirror neurons make people (A) what they see, so an advertisement can make viewers (B) the real thing.","ko":"거울 뉴런은 사람들이 본 것을 (A)하게 만들어서, 광고는 시청자가 실제인 것을 (B)하게 만들 수 있다.","oko":["(A) 따라 한다 / (B) 원한다","(A) 잊는다 / (B) 원한다","(A) 따라 한다 / (B) 싫어한다","(A) 피한다 / (B) 두려워한다","(A) 숨긴다 / (B) 판매한다"],"opts":["(A) copy / (B) want","(A) forget / (B) want","(A) copy / (B) hate","(A) avoid / (B) fear","(A) hide / (B) sell"],"r":{"a":"1) (A) copy / (B) want","ev":"9, 12번 문장","s":[[9,"Due to mirror neurons, people who watch the advertisement may start to copy the model.","거울 뉴런 때문에 광고를 본 사람들은 그 모델을 따라 하기 시작할지도 모른다."],[12,"As a result, the advertisement makes them want the real thing!","결과적으로, 광고는 그들이 실제인 것을 원하게 만든다!"]],"w":"9번에서 거울 뉴런 때문에 광고를 본 사람들이 모델을 따라(copy) 하기 시작하고, 12번에서 광고가 시청자가 실제인 것을 원하게(want) 만든다고 해요.","c":1},"h":"a39a7f1533"},{"n":10,"t":"fill","q":"In the advertisement, the [A] may take a bite of the hamburger, and viewers may feel like they have [B] it.","ko":"광고에서 [A]이 햄버거를 한 입 먹고, 시청자들은 그것을 [B]한 것처럼 느낄 수 있다.","bank":["model","bitten","brain","neurons","attention","expressions"],"bko":{"model":"모델","bitten":"베어 문","brain":"뇌","neurons":"뉴런","attention":"관심","expressions":"표정"},"r":{"a":"[A] model, [B] bitten","ev":"8, 11번 문장","s":[[8,"The advertisement may show the model taking a bite of the hamburger.","그 광고는 햄버거를 한 입 먹는 모델을 보여줄 수 있다."],[11,"Viewers may feel like they have bitten the hamburger.","시청자들은 아마 그들이 햄버거를 베어 물은 것처럼 느낄 것이다."]],"w":"8번에서 햄버거를 한 입 먹는 것은 광고 속 model이고, 11번에서 시청자는 햄버거를 have bitten(베어 문) 것처럼 느껴요. 뇌나 뉴런, 관심은 한 입 먹을 수 없어요.","c":null},"h":"ad622f09b5"}]},{"u":7,"id":"rj2-07-4","no":4,"ko":"지글거리는 스테이크","items":[{"n":1,"t":"tf","q":"In the open kitchen, the chef puts a piece of meat on the hot grill.","ko":"개방된 주방에서 요리사는 고기 한 점을 뜨거운 석쇠 위에 놓는다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"There is an open kitchen, so you can see the chef cooking.","개방된 주방이 있어서, 당신은 요리사가 요리하고 있는 것을 볼 수 있다."],[5,"He puts a piece of meat on the hot grill.","그는 고기 한 점을 뜨거운 석쇠 위에 놓는다."]],"w":"4번에서 개방된 주방에서 요리사가 요리하는 것을 볼 수 있고, 5번에서 그가 뜨거운 석쇠 위에 고기 한 점을 놓는다고 해요.","c":"T"},"h":"3db2ba801a"},{"n":2,"t":"tf","q":"Many restaurants think tasty food is enough to attract customers.","ko":"많은 식당들은 맛있는 음식이 고객을 끌기에 충분하다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Many restaurants know that tasty food is not enough to attract customers.","많은 식당들이 맛있는 음식이 고객을 끌기에 충분하지 않다는 것을 안다."]],"w":"8번에서 많은 식당은 맛있는 음식이 고객을 끌기에 충분하지 않다(not enough)는 것을 안다고 해요. 충분하다는 말은 반대예요.","c":"F"},"h":"6307580a99"},{"n":3,"t":"tf","q":"The writer says you should pay attention only to the taste of the food.","ko":"필자는 음식의 맛에만 주목해야 한다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"12~13번 문장","s":[[12,"So when you visit your favorite restaurant, do not just taste the food.","그러므로 당신이 매우 좋아하는 식당에 방문할 때, 단지 음식만 맛보지 마라."],[13,"Pay attention to how the restaurant satisfies your other senses.","그 식당이 당신의 다른 감각들을 만족시키는 방법에 주목하라."]],"w":"12번에서 음식만 맛보지 말라고 하고, 13번에서 식당이 다른 감각들을 어떻게 만족시키는지 주목하라고 해요. 맛에만이라는 말은 반대예요.","c":"F"},"h":"ddb4de5927"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Many restaurants know that tasty food is not enough to attract customers.)","ko":"많은 식당들이 맛있는 음식이 고객을 ( ) 충분하지 않다는 것을 안다.","opts":["쫓다","끌다","속이다","돕다"],"word":"attract","r":{"a":"2) 끌다","ev":"8번 문장","s":[[8,"Many restaurants know that tasty food is not enough to attract customers.","많은 식당들이 맛있는 음식이 고객을 끌기에 충분하지 않다는 것을 안다."]],"w":"8번은 맛있는 음식만으로는 고객을 '끌기에' 부족하다는 뜻이에요. 그래서 식당들이 모습, 냄새, 소리를 이용해 더 많은 고객을 얻어요(10번). attract = 끌다.","c":2},"h":"b11f437166"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Pay attention to how the restaurant satisfies your other senses.)","ko":"그 식당이 당신의 다른 감각들을 ( ) 방법에 주목하라.","opts":["실망시키다","닫다","바꾸다","만족시키다"],"word":"satisfies","r":{"a":"4) 만족시키다","ev":"13번 문장","s":[[13,"Pay attention to how the restaurant satisfies your other senses.","그 식당이 당신의 다른 감각들을 만족시키는 방법에 주목하라."]],"w":"13번은 식당이 음식 맛 말고 다른 감각들을 어떻게 '만족시키는지' 보라는 뜻이에요. satisfy = 만족시키다.","c":4},"h":"53cca8cbd5"},{"n":6,"t":"ref","q":"What does the underlined \"these things\" refer to?\nAll of these things make your mouth water.","ko":"밑줄 친 these things가 가리키는 것은?","sko":"이 모든 것들은 당신의 입에 군침이 돌게 한다.","opts":["음식 냄새, 요리하는 모습, 고기 굽는 소리와 색","식당의 가격들","다른 손님들의 이야기","고기의 종류들"],"r":{"a":"1) 음식 냄새, 요리하는 모습, 고기 굽는 소리와 색","ev":"3~7번 문장","s":[[3,"You can smell the delicious food.","당신은 맛있는 음식 냄새를 맡을 수 있다."],[4,"There is an open kitchen, so you can see the chef cooking.","개방된 주방이 있어서, 당신은 요리사가 요리하고 있는 것을 볼 수 있다."],[5,"He puts a piece of meat on the hot grill.","그는 고기 한 점을 뜨거운 석쇠 위에 놓는다."],[6,"It makes a sizzling sound and turns brown.","그것은 지글거리는 소리를 내고 갈색이 된다."],[7,"All of these things make your mouth water.","이 모든 것들은 당신의 입에 군침이 돌게 한다."]],"w":"7번의 these things는 앞에서 말한 것들이에요. 음식 냄새(3번), 요리하는 모습(4~5번), 지글거리는 소리와 갈색으로 변하는 고기(6번)가 입에 군침이 돌게 해요.","c":1},"h":"eacccfd2b2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Keep your eyes, ears, and nose open for a sizzling experience!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"지글거리는 (음식) 경험을 위해 당신의 눈과 귀와 코를 열어 두어라!","opts":["식당 안에서는 눈과 귀와 코를 막아라.","눈과 코는 쓰되 귀는 닫아라.","지글거리는 경험을 위해 눈과 귀와 코를 열어 두어라.","음식 맛에만 집중하고 다른 감각은 잊어라."],"r":{"a":"3) 지글거리는 경험을 위해 눈과 귀와 코를 열어 두어라.","ev":"14번 문장","s":[[14,"Keep your eyes, ears, and nose open for a sizzling experience!","지글거리는 (음식) 경험을 위해 당신의 눈과 귀와 코를 열어 두어라!"]],"w":"Keep + 목적어 + open은 '~을 열어 둔 상태로 두어라'예요. 눈, 귀, 코로 느끼는 경험까지 즐기라는 뜻이에요.","c":3},"h":"eb4dacebb7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["스테이크 식당의 주방은 닫혀 있어서 요리사가 보이지 않는다.","전체 경험이 좋으면 고객은 음식을 덜 즐긴다.","고기는 차가운 팬 위에서 구워진다.","식당들은 음식의 모습, 냄새, 소리를 이용해 더 많은 고객을 얻는다."],"opts":["The kitchen of the steak restaurant is closed, so you cannot see the chef.","Customers enjoy the food less when the entire experience is good.","The meat is cooked on a cold pan.","Restaurants use the sights, smells, and sounds of food to get more customers."],"r":{"a":"4) Restaurants use the sights, smells, and sounds of food to get more customers.","ev":"4~5, 10~11번 문장","s":[[4,"There is an open kitchen, so you can see the chef cooking.","개방된 주방이 있어서, 당신은 요리사가 요리하고 있는 것을 볼 수 있다."],[5,"He puts a piece of meat on the hot grill.","그는 고기 한 점을 뜨거운 석쇠 위에 놓는다."],[10,"So restaurants use these to get more customers.","그래서 식당들은 더 많은 고객들을 얻기 위해 이것들을 이용한다."],[11,"If the entire experience is good, customers enjoy the food even more!","만약 전체적인 경험이 좋다면, 고객들은 음식을 더욱 더 즐긴다!"]],"w":"10번에서 식당들은 이것들(음식의 모습, 냄새, 소리)을 이용해 더 많은 고객을 얻어요. 주방은 열려 있고(4번), 고기는 뜨거운 석쇠 위에 놓이며(5번), 경험이 좋으면 음식을 더 즐겨요(11번).","c":4},"h":"0997cea136"},{"n":9,"t":"sum","q":"Restaurants know that (A) food is not enough, so they use sights, smells, and sounds to get more (B).","ko":"식당들은 (A) 음식만으로는 충분하지 않다는 것을 알아서, 더 많은 (B)을 얻기 위해 모습, 냄새, 소리를 이용한다.","oko":["(A) 맛있는 / (B) 요리사","(A) 나쁜 / (B) 고객","(A) 값싼 / (B) 메뉴","(A) 차가운 / (B) 고객","(A) 맛있는 / (B) 고객"],"opts":["(A) tasty / (B) chefs","(A) bad / (B) customers","(A) cheap / (B) menus","(A) cold / (B) customers","(A) tasty / (B) customers"],"r":{"a":"5) (A) tasty / (B) customers","ev":"8, 10번 문장","s":[[8,"Many restaurants know that tasty food is not enough to attract customers.","많은 식당들이 맛있는 음식이 고객을 끌기에 충분하지 않다는 것을 안다."],[10,"So restaurants use these to get more customers.","그래서 식당들은 더 많은 고객들을 얻기 위해 이것들을 이용한다."]],"w":"8번에서 맛있는(tasty) 음식만으로는 고객(customers)을 끌기에 충분하지 않다고 하고, 10번에서 식당들이 더 많은 고객을 얻기 위해 모습, 냄새, 소리를 이용한다고 해요.","c":5},"h":"98dcbdbfe6"},{"n":10,"t":"fill","q":"When you visit a restaurant, pay attention to how it [A] your other [B].","ko":"식당에 방문할 때, 그곳이 당신의 다른 [B]을 어떻게 [A]하는지 주목하라.","bank":["satisfies","senses","steak","chef","kitchen","menu"],"bko":{"satisfies":"만족시키다","senses":"감각들","steak":"스테이크","chef":"요리사","kitchen":"주방","menu":"메뉴"},"r":{"a":"[A] satisfies, [B] senses","ev":"13번 문장","s":[[13,"Pay attention to how the restaurant satisfies your other senses.","그 식당이 당신의 다른 감각들을 만족시키는 방법에 주목하라."]],"w":"13번 Pay attention to how the restaurant satisfies your other senses에서 가져왔어요. 식당이 만족시키는 대상은 다른 감각들(senses)이에요. steak, chef, kitchen, menu는 '만족시키다' 자리에 들어갈 수 없는 명사예요.","c":null},"h":"978594b956"}]},{"u":8,"id":"rj2-08-1","no":1,"ko":"스카치테이프가 자동차와 관계가 있다고?","items":[{"n":1,"t":"tf","q":"Car painters glued paper over the parts that had to stay the original color.","ko":"자동차 도장공들은 원래의 색으로 유지되어야 하는 부분 위에 종이를 붙였다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Next, they glued paper over the parts of the car that had to stay the original color.","다음으로, 그들은 차에서 원래의 색으로 유지되어야 하는 부분들 위에 종이를 붙였다."]],"w":"4번 문장에 they glued paper over the parts of the car that had to stay the original color라고 나와요.","c":"T"},"h":"5c4c1bd2e6"},{"n":2,"t":"tf","q":"Drew invented the first clear tape in the 1920s.","ko":"Drew는 1920년대에 최초의 투명 테이프를 발명했다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"In 1930, he invented the first clear tape.","그는 1930년에 최초의 투명한 테이프를 발명했다."]],"w":"12번 문장에서 Drew가 최초의 투명 테이프를 발명한 때는 1930년이에요. 1920년대는 두 색 자동차가 인기였던 때예요(1번).","c":"F"},"h":"092e862bf9"},{"n":3,"t":"tf","q":"Drew was not satisfied even though the paper tape was a great success.","ko":"종이테이프가 대단한 성공이었지만 Drew는 만족하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"It was a great success, but Drew wasn’t satisfied.","그것은 대단한 성공이었지만, Drew는 만족하지 않았다."]],"w":"10번 문장 It was a great success, but Drew wasn’t satisfied와 같은 내용이에요.","c":"T"},"h":"31f22e04de"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So a man named Richard Gurley Drew decided to find a solution.)","ko":"그래서 Richard Gurley Drew라는 이름의 한 남자는 ( )을 찾기로 결심했다.","opts":["문제","실험","해결책","포장"],"word":"solution","r":{"a":"3) 해결책","ev":"8번 문장","s":[[8,"So a man named Richard Gurley Drew decided to find a solution.","그래서 Richard Gurley Drew라는 이름의 한 남자는 해결책을 찾기로 결심했다."]],"w":"7번에서 접착제를 제거하기 어렵다는 문제가 생겼고, 8번에서 Drew가 그 문제를 풀 '해결책'을 찾기로 했어요. solution = 해결책.","c":3},"h":"afcf5a2989"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It was a great success, but Drew wasn’t satisfied.)","ko":"그것은 대단한 성공이었지만, Drew는 ( ) 않았다.","opts":["화난","만족한","피곤한","놀란"],"word":"satisfied","r":{"a":"2) 만족한","ev":"10번 문장","s":[[10,"It was a great success, but Drew wasn’t satisfied.","그것은 대단한 성공이었지만, Drew는 만족하지 않았다."]],"w":"10번은 but(하지만)으로 이어져서, 성공했는데도 Drew는 만족하지 않았다는 뜻이에요. 그래서 셀로판 실험을 계속해요(11번). satisfied = 만족한.","c":2},"h":"1493a21b38"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nTwo years later, he invented paper tape that could be removed cleanly and easily.","ko":"밑줄 친 he가 가리키는 것은?","sko":"2년 후에, 그는 깨끗하고 쉽게 제거될 수 있는 종이테이프를 발명했다.","opts":["자동차 도장공들","어떤 페인트 회사","Richard Gurley Drew","셀로판 발명가"],"r":{"a":"3) Richard Gurley Drew","ev":"8~9번 문장","s":[[8,"So a man named Richard Gurley Drew decided to find a solution.","그래서 Richard Gurley Drew라는 이름의 한 남자는 해결책을 찾기로 결심했다."],[9,"Two years later, he invented paper tape that could be removed cleanly and easily.","2년 후에, 그는 깨끗하고 쉽게 제거될 수 있는 종이테이프를 발명했다."]],"w":"8번에서 해결책을 찾기로 한 사람은 Richard Gurley Drew예요. 9번의 he는 그 사람이에요.","c":3},"h":"2365b05cdb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Unfortunately, this made life difficult for car painters.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"안타깝게도, 이것은 자동차 도장공들의 삶을 힘들게 만들었다.","opts":["불행히도 자동차 도장공들은 이 일을 아주 쉽게 했다.","이것은 자동차를 사는 사람들의 삶을 힘들게 했다.","다행히도 이것은 자동차 도장공들의 일을 쉽게 만들었다.","안타깝게도 이것은 자동차 도장공들의 일을 힘들게 만들었다."],"r":{"a":"4) 안타깝게도 이것은 자동차 도장공들의 일을 힘들게 만들었다.","ev":"2번 문장","s":[[2,"Unfortunately, this made life difficult for car painters.","안타깝게도, 이것은 자동차 도장공들의 삶을 힘들게 만들었다."]],"w":"Unfortunately는 '안타깝게도'이고, made life difficult for car painters는 '자동차 도장공들의 삶을 힘들게 만들었다'예요. 쉽게 만들었다는 말과 반대예요.","c":4},"h":"896ad72d8f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["도장공들은 두 번째 색을 칠한 뒤에 종이를 붙였다.","Drew의 종이테이프는 차에 접착제를 많이 남겼다.","Drew는 얇고 투명한 플라스틱 물질인 셀로판으로 실험했다.","최초의 투명 테이프는 1920년대에 발명되었다."],"opts":["Painters put paper on the car after painting the second color.","Drew’s paper tape left a lot of glue on the cars.","Drew experimented with cellophane, a thin, clear plastic material.","The first clear tape was invented in the 1920s."],"r":{"a":"3) Drew experimented with cellophane, a thin, clear plastic material.","ev":"4~5, 9, 11~12번 문장","s":[[4,"Next, they glued paper over the parts of the car that had to stay the original color.","다음으로, 그들은 차에서 원래의 색으로 유지되어야 하는 부분들 위에 종이를 붙였다."],[5,"Finally, they painted the car a second color.","마지막으로, 그들은 차를 두 번째 색으로 칠했다."],[9,"Two years later, he invented paper tape that could be removed cleanly and easily.","2년 후에, 그는 깨끗하고 쉽게 제거될 수 있는 종이테이프를 발명했다."],[11,"He began experimenting with cellophane, a new thin, clear plastic material used for packaging.","그는 셀로판, 즉 포장에 쓰이는 새로운 얇고 투명한 플라스틱 물질을 가지고 실험하기 시작했다."],[12,"In 1930, he invented the first clear tape.","그는 1930년에 최초의 투명한 테이프를 발명했다."]],"w":"11번에서 Drew는 얇고 투명한 플라스틱 물질인 셀로판으로 실험했어요. 종이는 두 번째 색을 칠하기 전에 붙였고(4~5번), 종이테이프는 깨끗하게 제거되었고(9번), 최초의 투명 테이프는 1930년에 나왔어요(12번).","c":3},"h":"9c492f5b04"},{"n":9,"t":"sum","q":"It was hard to (A) the glue from cars, so Drew invented paper tape. Later, he made (B) tape from cellophane.","ko":"차에서 접착제를 (A)하기 어려웠기 때문에 Drew는 종이테이프를 발명했다. 나중에 그는 셀로판으로 (B) 테이프를 만들었다.","oko":["(A) 숨기다 / (B) 투명한","(A) 제거하다 / (B) 검은","(A) 칠하다 / (B) 투명한","(A) 제거하다 / (B) 투명한","(A) 칠하다 / (B) 색칠된"],"opts":["(A) hide / (B) clear","(A) remove / (B) dark","(A) paint / (B) clear","(A) remove / (B) clear","(A) paint / (B) colored"],"r":{"a":"4) (A) remove / (B) clear","ev":"7, 9, 11~12번 문장","s":[[7,"However, it was nearly impossible to completely remove the glue from the cars.","그러나 차에서 접착제를 완전히 제거하는 것이 거의 불가능했다."],[9,"Two years later, he invented paper tape that could be removed cleanly and easily.","2년 후에, 그는 깨끗하고 쉽게 제거될 수 있는 종이테이프를 발명했다."],[11,"He began experimenting with cellophane, a new thin, clear plastic material used for packaging.","그는 셀로판, 즉 포장에 쓰이는 새로운 얇고 투명한 플라스틱 물질을 가지고 실험하기 시작했다."],[12,"In 1930, he invented the first clear tape.","그는 1930년에 최초의 투명한 테이프를 발명했다."]],"w":"7번에서 접착제를 완전히 제거(remove)하기 어려웠고, 그래서 Drew가 9번에서 종이테이프를 발명해요. 11~12번에서 셀로판으로 최초의 투명한(clear) 테이프를 만들어요.","c":4},"h":"1b76e17133"},{"n":10,"t":"fill","q":"Painters [A] paper over the parts of the car and then painted the car a second [B].","ko":"도장공들은 차의 일부분 위에 종이를 [A]하고 나서 차를 두 번째 [B]으로 칠했다.","bank":["glued","color","cellophane","solution","success","packaging"],"bko":{"glued":"붙였다","color":"색","cellophane":"셀로판","solution":"해결책","success":"성공","packaging":"포장"},"r":{"a":"[A] glued, [B] color","ev":"4~5번 문장","s":[[4,"Next, they glued paper over the parts of the car that had to stay the original color.","다음으로, 그들은 차에서 원래의 색으로 유지되어야 하는 부분들 위에 종이를 붙였다."],[5,"Finally, they painted the car a second color.","마지막으로, 그들은 차를 두 번째 색으로 칠했다."]],"w":"4번에서 도장공들은 원래 색으로 남길 부분 위에 종이를 glued(붙였다)고 하고, 5번에서 차를 두 번째 color(색)로 칠했다고 해요. 나머지 단어들은 이 문장의 빈칸에 들어갈 수 없어요.","c":null},"h":"aed4d37d5f"}]},{"u":8,"id":"rj2-08-2","no":2,"ko":"날씨 아래에 있다는 것은?","items":[{"n":1,"t":"tf","q":"One popular theory says that the idiom came from the language of sailors.","ko":"한 인기 있는 이론은 그 관용어가 선원들의 언어에서 왔다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"One popular theory suggests that it came from the language of sailors.","한 인기 있는 이론은 그것이 선원들의 언어로부터 왔다고 시사한다."]],"w":"4번 문장 One popular theory suggests that it came from the language of sailors와 같은 내용이에요.","c":"T"},"h":"2a4dbfda4d"},{"n":2,"t":"tf","q":"At first, the idiom was used for every type of illness.","ko":"처음에 그 관용어는 모든 종류의 질병에 사용되었다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"At first, the idiom was only used to talk about seasickness.","처음에 그 관용어는 단지 뱃멀미에 대해 말할 때만 사용되었다."]],"w":"9번에서 처음에는 뱃멀미(seasickness)에 대해 말할 때만 사용되었다고 해요. 모든 종류의 병에 쓰인 것은 오늘날이에요(11번).","c":"F"},"h":"aba279cb03"},{"n":3,"t":"tf","q":"When the weather was bad, the sea would be rough.","ko":"날씨가 나쁠 때 바다는 거칠었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"When the weather was bad, the sea would be rough.","날씨가 나쁠 때, 바다는 거칠었다."]],"w":"5번 문장 그대로예요. 나쁜 날씨 때문에 바다가 거칠어졌고, 그래서 배가 많이 움직였어요(6번).","c":"T"},"h":"4916830737"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (There are several common theories about the origin of this idiom.)","ko":"이 관용어의 ( )에 대한 몇 가지 일반적인 이론이 있다.","opts":["결과","의미","기원","비밀"],"word":"origin","r":{"a":"3) 기원","ev":"3번 문장","s":[[3,"There are several common theories about the origin of this idiom.","이 관용어의 기원에 대한 몇 가지 일반적인 이론이 있다."]],"w":"3번은 이 관용어가 어디서 시작되었는지에 대한 이론들이에요. 4번부터 그 이론이 나와요. origin = 기원, 유래.","c":3},"h":"2e2b798775"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That meant they were literally under the bad weather taking place above deck.)","ko":"그것은 그들이 ( ) 갑판 위에서 일어나는 나쁜 날씨 아래에 있다는 것을 의미했다.","opts":["문자 그대로","거의","가끔","아마도"],"word":"literally","r":{"a":"1) 문자 그대로","ev":"8번 문장","s":[[8,"That meant they were literally under the bad weather taking place above deck.","그것은 그들이 문자 그대로 갑판 위에서 일어나는 나쁜 날씨 아래에 있다는 것을 의미했다."]],"w":"선원들은 갑판 아래에 있었고 나쁜 날씨는 갑판 위에 있었으니, 정말로 말 그대로 날씨 아래에 있었던 거예요. literally = 문자 그대로.","c":1},"h":"70ac4dee8b"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThis made the boat move a lot, which often made sailors ill.","ko":"밑줄 친 which가 가리키는 것은?","sko":"이것은 배를 많이 움직이게 만들었고, 이것은 종종 선원들을 아프게 했다.","opts":["선원들","배가 많이 움직인 것","거친 바다에서 쉬는 것","갑판 아래"],"r":{"a":"2) 배가 많이 움직인 것","ev":"5~6번 문장","s":[[5,"When the weather was bad, the sea would be rough.","날씨가 나쁠 때, 바다는 거칠었다."],[6,"This made the boat move a lot, which often made sailors ill.","이것은 배를 많이 움직이게 만들었고, 이것은 종종 선원들을 아프게 했다."]],"w":"which는 콤마 앞 내용 전체를 가리켜요. 나쁜 날씨로 바다가 거칠어져(5번) 배가 많이 움직인 것이 선원들을 아프게 했어요(6번).","c":2},"h":"7f36d28b19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As time went on, it took on a wider meaning.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시간이 지나면서, 그것은 더 넓은 의미를 가지게 되었다.","opts":["시간이 지나면서 그 말은 뜻을 완전히 잃었다.","시간이 지나면서 그 말은 더 좁은 뜻을 가지게 되었다.","시간이 멈추자 그 말은 새로운 뜻을 가졌다.","시간이 지나면서 그 말은 더 넓은 뜻을 가지게 되었다."],"r":{"a":"4) 시간이 지나면서 그 말은 더 넓은 뜻을 가지게 되었다.","ev":"10번 문장","s":[[10,"As time went on, it took on a wider meaning.","시간이 지나면서, 그것은 더 넓은 의미를 가지게 되었다."]],"w":"As time went on은 '시간이 지나면서', took on a wider meaning은 '더 넓은 의미를 가지게 되었다'예요. 뱃멀미에서 모든 병으로 넓어진 것을 말해요(9번, 11번).","c":4},"h":"9f39e61fa4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이 관용어의 기원에 대한 이론은 한 가지뿐이다.","처음에 이 관용어는 뱃멀미를 말할 때만 사용되었다.","아픈 선원들은 쉬려고 갑판 위로 갔다.","이 관용어는 언제나 모든 종류의 질병에 사용되었다."],"opts":["There is only one theory about the origin of the idiom.","At first, the idiom was used only for seasickness.","Sick sailors went above deck to rest.","The idiom was always used for any type of illness."],"r":{"a":"2) At first, the idiom was used only for seasickness.","ev":"3, 7, 9, 11번 문장","s":[[3,"There are several common theories about the origin of this idiom.","이 관용어의 기원에 대한 몇 가지 일반적인 이론이 있다."],[7,"They had to go below deck to rest and get better.","그들은 휴식을 취하고 나아지기 위해 갑판 아래로 가야만 했다."],[9,"At first, the idiom was only used to talk about seasickness.","처음에 그 관용어는 단지 뱃멀미에 대해 말할 때만 사용되었다."],[11,"Today, “under the weather” can be used for any type of illness.","오늘날, ‘날씨 아래에 있는’은 모든 종류의 질병에 사용될 수 있다."]],"w":"9번에서 처음에는 뱃멀미를 말할 때만 사용되었다고 해요. 이론은 몇 가지이고(3번), 선원들은 갑판 아래로 갔고(7번), 모든 질병에 쓰이는 것은 오늘날이에요(11번).","c":2},"h":"35aa6e73c1"},{"n":9,"t":"sum","q":"Some people think the idiom came from sailors who felt (A) in rough seas, and it now describes (B) type of illness.","ko":"일부 사람들은 이 관용어가 거친 바다에서 (A)했던 선원들에게서 유래했다고 생각하며, 이 말은 지금 (B) 종류의 질병을 나타낸다.","oko":["(A) 안전한 / (B) 모든","(A) 아픈 / (B) 어떤 종류도 아닌","(A) 화가 난 / (B) 한 가지","(A) 행복한 / (B) 모든","(A) 아픈 / (B) 모든"],"opts":["(A) safe / (B) any","(A) ill / (B) no","(A) angry / (B) only one","(A) happy / (B) any","(A) ill / (B) any"],"r":{"a":"5) (A) ill / (B) any","ev":"6, 11번 문장","s":[[6,"This made the boat move a lot, which often made sailors ill.","이것은 배를 많이 움직이게 만들었고, 이것은 종종 선원들을 아프게 했다."],[11,"Today, “under the weather” can be used for any type of illness.","오늘날, ‘날씨 아래에 있는’은 모든 종류의 질병에 사용될 수 있다."]],"w":"6번에서 거친 바다 때문에 배가 움직여 선원들이 아팠고(ill), 11번에서 지금은 어떤(any) 종류의 질병에도 쓰일 수 있어요.","c":5},"h":"4650d0b3b4"},{"n":10,"t":"fill","q":"At first, the idiom was only [A] to talk about seasickness. As time went on, it took on a [B] meaning.","ko":"처음에 그 관용어는 뱃멀미에 대해 말하는 데만 [A]. 시간이 지나면서 그것은 더 [B] 의미를 가지게 되었다.","bank":["used","wider","below","ill","theory","sailors"],"bko":{"used":"사용된","wider":"더 넓은","below":"아래에","ill":"아픈","theory":"이론","sailors":"선원들"},"r":{"a":"[A] used, [B] wider","ev":"9~10번 문장","s":[[9,"At first, the idiom was only used to talk about seasickness.","처음에 그 관용어는 단지 뱃멀미에 대해 말할 때만 사용되었다."],[10,"As time went on, it took on a wider meaning.","시간이 지나면서, 그것은 더 넓은 의미를 가지게 되었다."]],"w":"9번 was only used to talk about seasickness와 10번 took on a wider meaning에서 가져왔어요. [A]에는 과거분사 used가 와서 '사용되었다'가 되고, [B]에는 meaning을 꾸미는 wider가 와요. 나머지는 이 자리에 들어갈 수 없어요.","c":null},"h":"809afce7b8"}]},{"u":8,"id":"rj2-08-3","no":3,"ko":"달을 닮은 빵","items":[{"n":1,"t":"tf","q":"One night, an Austrian baker heard strange sounds under his bakery.","ko":"어느 날 밤, 한 오스트리아인 제빵사가 자신의 빵집 아래에서 이상한 소리를 들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"One night, an Austrian baker heard strange sounds beneath his bakery.","어느 날 밤, 한 오스트리아인 제빵사가 자신의 빵집 아래에서 이상한 소리를 들었다."]],"w":"7번 문장에서 오스트리아인 제빵사가 빵집 아래에서 이상한 소리를 들었다고 해요.","c":"T"},"h":"093b892414"},{"n":2,"t":"tf","q":"The kipfel was brought to Germany, where it became the croissant.","ko":"킵펠은 독일로 들여져 왔고, 그곳에서 크루아상이 되었다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"Nearly 100 years later, the kipfel was brought to France, where it became the croissant.","거의 100년이 지난 후, 킵펠은 프랑스로 들여져 왔고, 그곳에서 그것은 크루아상이 되었다."]],"w":"13번 문장에서 킵펠이 들여져 와서 크루아상이 된 곳은 독일이 아니라 프랑스(France)예요.","c":"F"},"h":"061f0d82a9"},{"n":3,"t":"tf","q":"Many people think the croissant comes from Austria.","ko":"많은 사람들은 크루아상이 오스트리아에서 비롯되었다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"1~2번 문장","s":[[1,"Many people assume that the croissant comes from France.","많은 사람들이 크루아상이 프랑스에서 비롯되었다고 생각한다."],[2,"However, it is actually based on a type of Austrian bread, the kipfel.","그러나, 그것은 사실 킵펠(kipfel)이라는 일종의 오스트리아 빵에 기반을 두고 있다."]],"w":"1번에서 많은 사람들은 크루아상이 프랑스에서 왔다고 생각해요. 오스트리아 빵에 기반을 둔 것은 2번의 사실이에요.","c":"F"},"h":"23319a09d9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... after Austria defeated the Ottoman Empire in a battle.)","ko":"오스트리아가 전투에서 오스만 제국을 ( ) 후 ...","opts":["도왔다","패배시켰다","방문했다","발견했다"],"word":"defeated","r":{"a":"2) 패배시켰다","ev":"4번 문장","s":[[4,"According to legend, the kipfel was created in 1683 after Austria defeated the Ottoman Empire in a battle.","전설에 따르면, 킵펠은 오스트리아가 전쟁에서 오스만 제국을 패배시킨 후 1683년에 만들어졌다."]],"w":"4번은 오스트리아가 전투에서 오스만 제국을 이긴 뒤라는 뜻이에요. 그래서 오스트리아가 이기고 나서 킵펠이 만들어졌어요. defeat = 패배시키다.","c":2},"h":"06f69022ba"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He quickly alerted the Austrian soldiers.)","ko":"그는 재빨리 오스트리아 병사들에게 ( ).","opts":["초대했다","따라갔다","가르쳤다","알렸다"],"word":"alerted","r":{"a":"4) 알렸다","ev":"9번 문장","s":[[9,"He quickly alerted the Austrian soldiers.","그는 재빨리 오스트리아 병사들에게 알렸다."]],"w":"8번에서 굴을 파는 것을 알아챈 제빵사가 병사들에게 재빨리 '알렸어요'. 그래서 굴이 파괴되었어요(10번). alert = 알리다.","c":4},"h":"f33e34b502"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was shaped like the moon on the Ottoman Empire’s flag.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 오스만 제국의 국기에 있는 달처럼 생겼었다.","opts":["도시","굴","제빵사가 만든 특별한 빵","깃발"],"r":{"a":"3) 제빵사가 만든 특별한 빵","ev":"11~12번 문장","s":[[11,"To celebrate, he made some special bread.","(이를) 기념하기 위해, 그는 어떤 특별한 빵을 만들었다."],[12,"It was shaped like the moon on the Ottoman Empire’s flag.","그것은 오스만 제국의 국기에 있는 달처럼 생겼었다."]],"w":"12번 It은 바로 앞 11번에서 제빵사가 만든 some special bread(특별한 빵)예요. 그 빵이 오스만 제국 국기의 달처럼 생겼어요.","c":3},"h":"7497e962c8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Luckily, the city was protected by tall walls.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다행히, 그 도시는 높은 벽으로 보호되고 있었다.","opts":["운 좋게도 그 도시는 높은 벽으로 보호되고 있었다.","불행히도 그 도시는 벽이 없어서 위험했다.","그 도시가 스스로 높은 벽을 파괴했다.","다행히 그 도시의 벽은 낮아서 쉽게 열렸다."],"r":{"a":"1) 운 좋게도 그 도시는 높은 벽으로 보호되고 있었다.","ev":"6번 문장","s":[[6,"Luckily, the city was protected by tall walls.","다행히, 그 도시는 높은 벽으로 보호되고 있었다."]],"w":"Luckily는 '다행히', was protected by tall walls는 '높은 벽으로 보호되고 있었다'예요. 앞 문장에서 오스만 제국이 도시를 둘러쌌는데, 높은 벽 덕분에 지킬 수 있었다는 뜻이에요.","c":1},"h":"a8f74d1c18"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오스만 제국은 도시 둘레에 높은 벽을 쌓고 있었다.","제빵사는 빵집 아래에서 이상한 소리를 듣고 병사들에게 알렸다.","킵펠은 오스만 제국 국기의 별 모양으로 만들어졌다.","크루아상은 다른 빵 없이 프랑스에서 처음 만들어졌다."],"opts":["The Ottomans were building a tall wall around the city.","The baker heard strange sounds beneath his bakery and alerted the soldiers.","The kipfel was shaped like a star on the Ottoman flag.","The croissant was first created in France without any other bread."],"r":{"a":"2) The baker heard strange sounds beneath his bakery and alerted the soldiers.","ev":"2, 5~7, 9, 12번 문장","s":[[2,"However, it is actually based on a type of Austrian bread, the kipfel.","그러나, 그것은 사실 킵펠(kipfel)이라는 일종의 오스트리아 빵에 기반을 두고 있다."],[5,"The Ottomans had surrounded the city of Vienna.","오스만 제국 사람들이 비엔나 도시를 둘러쌌었다."],[6,"Luckily, the city was protected by tall walls.","다행히, 그 도시는 높은 벽으로 보호되고 있었다."],[7,"One night, an Austrian baker heard strange sounds beneath his bakery.","어느 날 밤, 한 오스트리아인 제빵사가 자신의 빵집 아래에서 이상한 소리를 들었다."],[9,"He quickly alerted the Austrian soldiers.","그는 재빨리 오스트리아 병사들에게 알렸다."],[12,"It was shaped like the moon on the Ottoman Empire’s flag.","그것은 오스만 제국의 국기에 있는 달처럼 생겼었다."]],"w":"7번에서 제빵사가 빵집 아래에서 이상한 소리를 들었고, 9번에서 병사들에게 알렸어요. 벽은 도시를 지키는 것이었고(5~6번), 킵펠은 국기의 달 모양이며(12번), 크루아상은 오스트리아 빵 킵펠에 기반했어요(2번).","c":2},"h":"df2931e5e0"},{"n":9,"t":"sum","q":"The kipfel, an Austrian bread shaped like a (A), became the croissant after it was brought to (B).","ko":"오스트리아 빵인 킵펠은 (A)처럼 생겼고, (B)로 들여져 온 뒤에 크루아상이 되었다.","oko":["(A) 별 / (B) 프랑스","(A) 달 / (B) 비엔나","(A) 달 / (B) 프랑스","(A) 굴 / (B) 오스트리아","(A) 깃발 / (B) 터널"],"opts":["(A) star / (B) France","(A) moon / (B) Vienna","(A) moon / (B) France","(A) tunnel / (B) Austria","(A) flag / (B) tunnel"],"r":{"a":"3) (A) moon / (B) France","ev":"3, 13번 문장","s":[[3,"Both the croissant and the kipfel are shaped like a crescent moon.","크루아상과 킵펠 둘 다 초승달처럼 생겼다."],[13,"Nearly 100 years later, the kipfel was brought to France, where it became the croissant.","거의 100년이 지난 후, 킵펠은 프랑스로 들여져 왔고, 그곳에서 그것은 크루아상이 되었다."]],"w":"3번에서 킵펠은 초승달(moon)처럼 생겼고, 13번에서 킵펠이 프랑스(France)로 들여져 와서 크루아상이 되었어요.","c":3},"h":"8c1b0e5b9a"},{"n":10,"t":"fill","q":"The Ottomans were [A] a tunnel, but the tunnel was [B] and the city was saved.","ko":"오스만 사람들은 굴을 [A] 있었지만, 그 굴은 [B]했고 도시는 지켜졌다.","bank":["digging","destroyed","celebrated","alerted","special","bakery"],"bko":{"digging":"파고","destroyed":"파괴되었","celebrated":"기념되었","alerted":"알려졌","special":"특별한","bakery":"빵집"},"r":{"a":"[A] digging, [B] destroyed","ev":"8, 10번 문장","s":[[8,"He realized the Ottomans were digging a tunnel under the city walls!","그는 오스만 제국 사람들이 도시의 벽 아래에 굴을 파고 있다는 것을 알아챘다!"],[10,"The tunnel was destroyed, and the city was saved!","그 굴은 파괴되었고, 도시는 지켜졌다."]],"w":"8번에서 오스만 제국 사람들은 굴을 digging(파고) 있었고, 10번에서 그 굴은 destroyed(파괴되었다)고 도시가 지켜졌어요. 나머지 단어는 이 자리에 맞지 않아요.","c":null},"h":"754b88d57a"}]},{"u":8,"id":"rj2-08-4","no":4,"ko":"오른손 좀 확인해 보겠습니다~","items":[{"n":1,"t":"tf","q":"Some experts think shaking hands was a way of checking for weapons.","ko":"일부 전문가들은 악수가 무기를 확인하는 방법이었다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"So some experts think shaking hands was a way of checking for weapons.","그래서 일부 전문가들은 악수가 무기를 확인하는 방법이었다고 생각한다."]],"w":"7번 문장 So some experts think shaking hands was a way of checking for weapons와 같은 내용이에요.","c":"T"},"h":"f0d17d7e79"},{"n":2,"t":"tf","q":"It is believed that people started shaking hands in modern times.","ko":"사람들이 현대에 악수를 하기 시작했다고 믿어진다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It is believed that it started in ancient times.","그것은 고대에 시작되었다고 믿어진다."]],"w":"4번에서 악수는 고대(ancient times)에 시작되었다고 믿어져요. 현대라는 말은 반대예요.","c":"F"},"h":"9cc7f2f5ee"},{"n":3,"t":"tf","q":"Moving a person’s hand up and down could reveal a weapon hidden in the sleeve.","ko":"사람의 손을 위아래로 움직이면 소매에 숨긴 무기가 드러날 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"Also, people sometimes hid weapons in their sleeves.","또한, 사람들은 때때로 자신의 소매 속에 무기를 숨겼다."],[10,"If someone did this, moving the person’s hand up and down would reveal the weapon.","만약 누군가 이렇게 했다면, 그 사람의 손을 위 아래로 움직이는 것은 무기를 드러나게 했을 것이다."]],"w":"9번에서 사람들은 소매에 무기를 숨기기도 했고, 10번에서 손을 위아래로 움직이면 무기가 드러났다고 해요.","c":"T"},"h":"e8099232de"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If someone did this, moving the person’s hand up and down would reveal the weapon.)","ko":"만약 누군가 이렇게 했다면, 그 사람의 손을 위 아래로 움직이는 것은 무기를 ( ) 것이다.","opts":["만들다","잊다","드러내다","붙잡다"],"word":"reveal","r":{"a":"3) 드러내다","ev":"10번 문장","s":[[10,"If someone did this, moving the person’s hand up and down would reveal the weapon.","만약 누군가 이렇게 했다면, 그 사람의 손을 위 아래로 움직이는 것은 무기를 드러나게 했을 것이다."]],"w":"10번은 소매 속에 숨긴 무기가 손을 흔들면 겉으로 나온다는 뜻이에요. reveal = 드러내 보이다.","c":3},"h":"63cee3711b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Since people usually carried weapons in their right hands, ...)","ko":"사람들은 보통 무기를 오른손에 ( ) 때문에, ...","opts":["팔았다","들고 다녔다","버렸다","빌렸다"],"word":"carried","r":{"a":"2) 들고 다녔다","ev":"11번 문장","s":[[11,"Since people usually carried weapons in their right hands, it was common to always use the right hand in a handshake.","사람들은 보통 무기를 오른손에 들었기 때문에, 악수를 할 때 항상 오른손을 사용하는 것이 일반적이었다."]],"w":"11번은 사람들이 무기를 오른손에 들고 다녔다는 뜻이에요. 그래서 악수할 때 항상 오른손을 썼어요. carry = 들고 다니다.","c":2},"h":"5a14275155"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nIf someone did this, moving the person’s hand up and down would reveal the weapon.","ko":"밑줄 친 this가 가리키는 것은?","sko":"만약 누군가 이렇게 했다면, 그 사람의 손을 위 아래로 움직이는 것은 무기를 드러나게 했을 것이다.","opts":["악수를 거절한 것","그림을 그린 것","소매 속에 무기를 숨긴 것","오른손으로 악수한 것"],"r":{"a":"3) 소매 속에 무기를 숨긴 것","ev":"9~10번 문장","s":[[9,"Also, people sometimes hid weapons in their sleeves.","또한, 사람들은 때때로 자신의 소매 속에 무기를 숨겼다."],[10,"If someone did this, moving the person’s hand up and down would reveal the weapon.","만약 누군가 이렇게 했다면, 그 사람의 손을 위 아래로 움직이는 것은 무기를 드러나게 했을 것이다."]],"w":"10번의 this는 바로 앞 9번의 내용, 즉 사람들이 소매 속에 무기를 숨긴 것이에요.","c":3},"h":"0257defce7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Eventually, this became a gesture of peace between two people who were meeting.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결국 이것은 만나고 있는 두 사람 사이에 평화의 제스처가 되었다.","opts":["결국 이것은 만나는 두 사람 사이의 평화의 몸짓이 되었다.","결국 이것은 두 사람이 싸우기 시작하는 신호가 되었다.","처음부터 이것은 서로 무기를 겨누는 몸짓이었다.","결국 이것은 만나지 않는 사람들 사이의 약속이 되었다."],"r":{"a":"1) 결국 이것은 만나는 두 사람 사이의 평화의 몸짓이 되었다.","ev":"12번 문장","s":[[12,"Eventually, this became a gesture of peace between two people who were meeting.","결국 이것은 만나고 있는 두 사람 사이에 평화의 제스처가 되었다."]],"w":"Eventually는 '결국'이고, became a gesture of peace는 '평화의 몸짓이 되었다'예요. who were meeting은 만나고 있는 두 사람을 말해요.","c":1},"h":"8749b30870"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사람들은 보통 무기를 왼손에 들었다.","무기를 든 사람도 다른 사람의 손을 쉽게 잡을 수 있었다.","악수는 현대에 시작되었다.","기원전 5세기경의 그림들은 악수하는 사람들을 보여준다."],"opts":["People usually carried weapons in their left hands.","A person with a weapon in his or her hand could easily grab another person’s hand.","Shaking hands started in modern times.","Paintings from as early as the fifth century BC show people shaking hands."],"r":{"a":"4) Paintings from as early as the fifth century BC show people shaking hands.","ev":"4~5, 8, 11번 문장","s":[[4,"It is believed that it started in ancient times.","그것은 고대에 시작되었다고 믿어진다."],[5,"Paintings from as early as the fifth century BC show people shaking hands.","기원전 5세기경의 그림들은 악수하고 있는 사람들을 보여준다."],[8,"A person with a weapon in his or her hand couldn’t grab another person’s hand.","손에 무기를 든 사람은 다른 사람의 손을 잡을 수 없었다."],[11,"Since people usually carried weapons in their right hands, it was common to always use the right hand in a handshake.","사람들은 보통 무기를 오른손에 들었기 때문에, 악수를 할 때 항상 오른손을 사용하는 것이 일반적이었다."]],"w":"5번에서 기원전 5세기경의 그림들이 악수하는 사람들을 보여줘요. 무기는 오른손에 들었고(11번), 무기를 든 사람은 손을 잡을 수 없었으며(8번), 악수는 고대에 시작되었어요(4번).","c":4},"h":"c7d714a087"},{"n":9,"t":"sum","q":"People shook hands to show they had no (A), and they used the (B) hand because people usually carried weapons in it.","ko":"사람들은 (A)가 없다는 것을 보여 주려고 악수했고, 사람들은 보통 그 손에 무기를 들었기 때문에 (B)손을 사용했다.","oko":["(A) 친구 / (B) 오른","(A) 무기 / (B) 왼","(A) 병사 / (B) 왼","(A) 그림 / (B) 오른","(A) 무기 / (B) 오른"],"opts":["(A) friends / (B) right","(A) weapons / (B) left","(A) soldiers / (B) left","(A) paintings / (B) right","(A) weapons / (B) right"],"r":{"a":"5) (A) weapons / (B) right","ev":"7, 11번 문장","s":[[7,"So some experts think shaking hands was a way of checking for weapons.","그래서 일부 전문가들은 악수가 무기를 확인하는 방법이었다고 생각한다."],[11,"Since people usually carried weapons in their right hands, it was common to always use the right hand in a handshake.","사람들은 보통 무기를 오른손에 들었기 때문에, 악수를 할 때 항상 오른손을 사용하는 것이 일반적이었다."]],"w":"7번에서 악수는 무기(weapons)를 확인하는 방법이었고, 11번에서 사람들은 보통 무기를 오른손(right hand)에 들었기 때문에 악수에도 오른손을 썼어요.","c":5},"h":"670f7b68bc"},{"n":10,"t":"fill","q":"A handshake became a [A] of peace between two people who were [B].","ko":"악수는 [B] 두 사람 사이에서 평화의 [A]이 되었다.","bank":["gesture","meeting","weapons","paintings","sleeves","hands"],"bko":{"gesture":"몸짓","meeting":"만나는","weapons":"무기","paintings":"그림","sleeves":"소매","hands":"손"},"r":{"a":"[A] gesture, [B] meeting","ev":"12번 문장","s":[[12,"Eventually, this became a gesture of peace between two people who were meeting.","결국 이것은 만나고 있는 두 사람 사이에 평화의 제스처가 되었다."]],"w":"12번 this became a gesture of peace between two people who were meeting에서 가져왔어요. a 뒤에는 단수 명사 gesture가 오고, who were 뒤에는 meeting이 와요. 나머지는 복수 명사라 a 뒤에 올 수 없고 who were 뒤에도 맞지 않아요.","c":null},"h":"541d59e0cd"}]},{"u":9,"id":"rj2-09-1","no":1,"ko":"세상에 이런 규칙이!","items":[{"n":1,"t":"tf","q":"Baseball has been popular for over 150 years.","ko":"야구는 150년이 넘도록 인기를 끌어 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Baseball has been popular for more than 150 years.","야구는 150년이 넘는 기간 동안 인기가 있어왔다."]],"w":"4번 문장에 has been popular for more than 150 years가 있어요. 150년이 넘는 기간 동안 인기가 있었다는 내용과 맞아요.","c":"T"},"h":"2ca469d5d7"},{"n":2,"t":"tf","q":"In the 19th century, batters could not choose the kind of pitch.","ko":"19세기에 타자들은 투구의 종류를 고를 수 없었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"For example, batters could request the kind of pitch they wanted.","예를 들어, 타자들은 그들이 원하는 투구의 종류를 요청할 수 있었다."]],"w":"6번 문장에서 타자들이 원하는 투구의 종류를 요청할 수 있었다(could request)고 해요. 고를 수 없었다는 말은 반대예요.","c":"F"},"h":"a870ba8ca4"},{"n":3,"t":"tf","q":"In the past, umpires sometimes asked spectators for help.","ko":"과거에 심판들은 때때로 관중들에게 도움을 요청했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"But in the past they would sometimes ask spectators for help in making decisions.","하지만 과거에는 때때로 관중들에게 결정을 내리는 데 도움을 요청하기도 했다."]],"w":"10번 문장에 But in the past they would sometimes ask spectators for help가 있어요. 과거 심판이 관중에게 도움을 요청했다는 내용과 맞아요.","c":"T"},"h":"cf67776bd1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Today, they play a neutral role by enforcing the rules.)","ko":"오늘날, 그들은 규칙을 시행함으로써 ( ) 역할을 한다.","opts":["편을 드는","중립적인","위험한","화려한"],"word":"neutral","r":{"a":"2) 중립적인","ev":"9번 문장","s":[[9,"Today, they play a neutral role by enforcing the rules.","오늘날, 그들은 규칙을 시행함으로써 중립적인 역할을 한다."]],"w":"9번에서 심판은 규칙을 시행하는 역할을 해요. 10번의 과거(관중에게 도움을 청함)와 대비되어, 어느 편도 들지 않는 '중립적인' 역할이라는 뜻이에요.","c":2},"h":"22ca272013"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For example, batters could request the kind of pitch they wanted.)","ko":"예를 들어, 타자들은 그들이 원하는 투구의 종류를 ( ) 수 있었다.","opts":["요청하다","피하다","거절하다","던지다"],"word":"request","r":{"a":"1) 요청하다","ev":"6~7번 문장","s":[[6,"For example, batters could request the kind of pitch they wanted.","예를 들어, 타자들은 그들이 원하는 투구의 종류를 요청할 수 있었다."],[7,"They would ask the pitchers to throw the ball either high or low.","그들은 투수들에게 높거나 낮게 공을 던지도록 요청했었다."]],"w":"6번의 request 뒤에 7번에서 They would ask the pitchers(투수들에게 요청했다)가 이어져요. request = 요청하다.","c":1},"h":"aaa2a519ec"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nToday, they play a neutral role by enforcing the rules.","ko":"밑줄 친 they가 가리키는 것은?","sko":"오늘날, 그들은 규칙을 시행함으로써 중립적인 역할을 한다.","opts":["타자들","투수들","심판들","관중들"],"r":{"a":"3) 심판들","ev":"8~9번 문장","s":[[8,"Another difference was the role of the umpires.","또 다른 차이점은 심판의 역할이었다."],[9,"Today, they play a neutral role by enforcing the rules.","오늘날, 그들은 규칙을 시행함으로써 중립적인 역할을 한다."]],"w":"8번에서 Another difference was the role of the umpires(또 다른 차이점은 심판의 역할)라고 했고, 9번에서 그 심판을 they로 받아요. 규칙을 시행하는 중립적인 역할은 심판이 해요.","c":3},"h":"31c285d8ce"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That doesn’t sound very fair, does it?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 매우 공정하게 들리지 않는다, 그렇지 않은가?","opts":["그것은 모두에게 아주 공정한 방식이다.","그것은 공정하다고 보기 어렵다.","그것은 너무 쉬워서 재미가 없다.","그것은 아무도 들어 본 적 없는 이야기이다."],"r":{"a":"2) 그것은 공정하다고 보기 어렵다.","ev":"11번 문장","s":[[11,"That doesn’t sound very fair, does it?","그것은 매우 공정하게 들리지 않는다, 그렇지 않은가?"]],"w":"doesn't sound very fair는 '별로 공정하게 들리지 않는다'는 뜻이고, does it은 동의를 구하는 말투예요. 10번(관중에게 도움을 청한 것)이 공정하지 않다는 필자의 생각이에요.","c":2},"h":"31c9b3c575"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["19세기의 일부 규칙은 오늘날의 규칙과 달랐다.","야구는 100년이 채 안 되는 기간 동안 인기가 있었다.","오늘날의 심판은 자주 관중들에게 도움을 요청한다.","야구의 규칙은 19세기 이후 한 번도 바뀌지 않았다."],"opts":["Some of the rules in the 19th century were different from today’s rules.","Baseball has been popular for less than 100 years.","Umpires today often ask spectators for help.","The rules of baseball have never changed since the 19th century."],"r":{"a":"1) Some of the rules in the 19th century were different from today’s rules.","ev":"4, 5, 9, 12번 문장","s":[[4,"Baseball has been popular for more than 150 years.","야구는 150년이 넘는 기간 동안 인기가 있어왔다."],[5,"However, some of the rules in the 19th century were very different from the rules of today.","하지만 19세기의 규칙들 중 일부는 오늘날의 규칙들과 매우 달랐다."],[9,"Today, they play a neutral role by enforcing the rules.","오늘날, 그들은 규칙을 시행함으로써 중립적인 역할을 한다."],[12,"Fortunately, these rules were later changed.","다행히도, 이 규칙들은 나중에 바뀌었다."]],"w":"5번에서 19세기 규칙 일부가 오늘날과 매우 달랐다고 해요. 야구는 150년이 넘게 인기였고(4번), 오늘날 심판은 중립적인 역할을 하며(9번), 규칙은 나중에 바뀌었어요(12번).","c":1},"h":"9615ae9833"},{"n":9,"t":"sum","q":"Some baseball rules in the 19th century were (A) from today’s rules. For example, umpires sometimes asked (B) for help, but today they play a neutral role.","ko":"19세기의 일부 야구 규칙은 오늘날의 규칙과 (A)했다. 예를 들어, 심판들은 때때로 (B)에게 도움을 요청했지만 오늘날 그들은 중립적인 역할을 한다.","oko":["(A) 비슷 / (B) 투수들","(A) 달랐 / (B) 타자들","(A) 비슷 / (B) 관중들","(A) 달랐 / (B) 투수들","(A) 달랐 / (B) 관중들"],"opts":["(A) similar / (B) pitchers","(A) different / (B) batters","(A) similar / (B) spectators","(A) different / (B) pitchers","(A) different / (B) spectators"],"r":{"a":"5) (A) different / (B) spectators","ev":"5, 9, 10번 문장","s":[[5,"However, some of the rules in the 19th century were very different from the rules of today.","하지만 19세기의 규칙들 중 일부는 오늘날의 규칙들과 매우 달랐다."],[9,"Today, they play a neutral role by enforcing the rules.","오늘날, 그들은 규칙을 시행함으로써 중립적인 역할을 한다."],[10,"But in the past they would sometimes ask spectators for help in making decisions.","하지만 과거에는 때때로 관중들에게 결정을 내리는 데 도움을 요청하기도 했다."]],"w":"5번에서 19세기 규칙 일부가 오늘날과 달랐다(different)고 해요. 10번에서 과거 심판이 도움을 요청한 상대는 관중(spectators)이고, 오늘날은 중립적인 역할을 해요(9번).","c":5},"h":"c937a4e364"},{"n":10,"t":"fill","q":"In the 19th century, [A] could request the kind of [B] they wanted.","ko":"19세기에 [A]은(는) 그들이 원하는 [B]의 종류를 요청할 수 있었다.","bank":["batters","pitch","neutral","fair","changed","popular"],"bko":{"batters":"타자들","pitch":"투구","neutral":"중립적인","fair":"공정한","changed":"바뀌었다","popular":"인기 있는"},"r":{"a":"[A] batters, [B] pitch","ev":"6~7번 문장","s":[[6,"For example, batters could request the kind of pitch they wanted.","예를 들어, 타자들은 그들이 원하는 투구의 종류를 요청할 수 있었다."],[7,"They would ask the pitchers to throw the ball either high or low.","그들은 투수들에게 높거나 낮게 공을 던지도록 요청했었다."]],"w":"6번 For example, batters could request the kind of pitch they wanted에서 가져왔어요. 7번에서 타자들이 투수에게 높게 또는 낮게 던지라고 요청했다고 이어져요. neutral, fair, changed, popular는 명사 자리에 들어갈 수 없어요.","c":null},"h":"ad044970be"}]},{"u":9,"id":"rj2-09-2","no":2,"ko":"환상의 쇼에 당신을 초대합니다","items":[{"n":1,"t":"tf","q":"The show O was created by a Canadian circus.","ko":"O 쇼는 캐나다 서커스단이 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It was created by a Canadian circus.","그것은 캐나다 서커스단에 의해 만들어졌다."]],"w":"3번 문장에 It was created by a Canadian circus가 그대로 있어요. 캐나다 서커스단이 만들었다는 내용과 맞아요.","c":"T"},"h":"ca75b6eb70"},{"n":2,"t":"tf","q":"Scuba divers are in the water only at the beginning of the show.","ko":"스쿠버 다이버들은 쇼의 시작 부분에만 물속에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"There are also many scuba divers in the water at all times.","또한 물속에는 항상 많은 스쿠버 다이버들이 있다."]],"w":"11번 문장에서 물속에는 at all times(항상) 많은 스쿠버 다이버들이 있다고 해요. 시작 부분에만 있다는 말은 반대예요.","c":"F"},"h":"8ea503d601"},{"n":3,"t":"tf","q":"Acrobats, swimmers, and divers use the giant pool in their performances.","ko":"곡예사, 수영 선수, 다이버들은 공연에서 그 거대한 수영장을 이용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Eighty-five world-class acrobats, swimmers, and divers use the giant pool in their performances.","85명의 세계적인 수준의 곡예사와 수영 선수, 그리고 다이버들이 그들의 공연에서 그 거대한 수영장을 이용한다."]],"w":"6번 문장에서 85명의 곡예사, 수영 선수, 다이버가 공연에서 그 거대한 수영장을 이용한다고 해요.","c":"T"},"h":"52167f22d8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They help the performers use air hoses to breathe beneath the surface of the pool.)","ko":"그들은 연기자들이 수영장의 수면 아래에서 ( ) 위해 공기 호스를 사용하는 것을 돕는다.","opts":["노래하다","호흡하다","뛰어오르다","헤엄치다"],"word":"breathe","r":{"a":"2) 호흡하다","ev":"12번 문장","s":[[12,"They help the performers use air hoses to breathe beneath the surface of the pool.","그들은 연기자들이 수영장의 수면 아래에서 호흡하기 위해 공기 호스를 사용하는 것을 돕는다."]],"w":"12번에서 연기자들은 공기 호스를 사용해요. 물속에서 공기 호스가 필요한 이유는 숨을 쉬기 위해서이므로 breathe = 호흡하다예요.","c":2},"h":"0b4f6ee97a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Gymnasts leap through the air on floating stages.)","ko":"체조 선수들은 떠 있는 무대들 위에서 공중으로 ( ).","opts":["기어가다","미끄러지다","뛰어오르다","걸어가다"],"word":"leap","r":{"a":"3) 뛰어오르다","ev":"7번 문장","s":[[7,"Gymnasts leap through the air on floating stages.","체조 선수들은 떠 있는 무대들 위에서 공중으로 뛰어오른다."]],"w":"7번에서 체조 선수들은 공중(through the air)에서 움직여요. 8번의 다이버가 jump(뛰어들다)하는 것처럼 leap도 높이 뛰어오르는 동작이에요.","c":3},"h":"5d2ec1ddcb"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey help the performers use air hoses to breathe beneath the surface of the pool.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 연기자들이 수영장의 수면 아래에서 호흡하기 위해 공기 호스를 사용하는 것을 돕는다.","opts":["스쿠버 다이버들","체조 선수들","연기자들","수영 선수 팀들"],"r":{"a":"1) 스쿠버 다이버들","ev":"11~12번 문장","s":[[11,"There are also many scuba divers in the water at all times.","또한 물속에는 항상 많은 스쿠버 다이버들이 있다."],[12,"They help the performers use air hoses to breathe beneath the surface of the pool.","그들은 연기자들이 수영장의 수면 아래에서 호흡하기 위해 공기 호스를 사용하는 것을 돕는다."]],"w":"11번에서 물속에 항상 많은 스쿠버 다이버들이 있다고 했고, 12번에서 그들을 They로 받아요. 연기자들(the performers)을 돕는 쪽이라서 연기자들이 They는 아니에요.","c":1},"h":"31fb68e219"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you visit Las Vegas someday, how about seeing this amazing show?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 언젠가 라스베이거스에 방문한다면, 이 놀라운 쇼를 보는 것이 어떤가?","opts":["라스베이거스에 가면 이 쇼는 보지 않는 편이 좋다.","라스베이거스에 가서 이 쇼를 본 적이 있는가?","이 쇼를 보려면 반드시 라스베이거스에 살아야 한다.","언젠가 라스베이거스에 가면 이 쇼를 보기를 권한다."],"r":{"a":"4) 언젠가 라스베이거스에 가면 이 쇼를 보기를 권한다.","ev":"13번 문장","s":[[13,"If you visit Las Vegas someday, how about seeing this amazing show?","당신이 언젠가 라스베이거스에 방문한다면, 이 놀라운 쇼를 보는 것이 어떤가?"]],"w":"how about seeing은 '보는 게 어때?'라는 제안이고, If you visit Las Vegas someday는 '언젠가 라스베이거스에 가면'이에요. 글쓴이가 이 쇼를 보라고 권하는 거예요.","c":4},"h":"e54693e1f9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["O라는 이름은 영어로 물을 뜻하는 단어이다.","O는 프랑스어로 물을 뜻하는 eau와 소리가 비슷하다.","그 쇼는 물이 없는 무대 위에서만 이루어진다.","그 극장은 캐나다에 있다."],"opts":["O is the English word for water.","O sounds like the French word for water.","The show takes place only on a dry stage.","The theater is in Canada."],"r":{"a":"2) O sounds like the French word for water.","ev":"1, 4, 5번 문장","s":[[1,"Did you know that there is a theater in Las Vegas that has a giant pool?","당신은 라스베이거스에 거대한 수영장이 있는 극장이 있다는 것을 알고 있었는가?"],[4,"O sounds like eau, the French word for water.","O는 물에 해당하는 프랑스어 단어인 eau처럼 들린다."],[5,"This name is fitting because the show takes place in and around water.","이 이름은 잘 어울리는데, 왜냐하면 그 쇼가 물 안과 물 주변에서 이루어지기 때문이다."]],"w":"4번에서 O는 물을 뜻하는 프랑스어 eau처럼 들린다고 해요. 쇼는 물 안과 주변에서 이루어지고(5번), 극장은 라스베이거스에 있어요(1번).","c":2},"h":"594ba108ad"},{"n":9,"t":"sum","q":"Divers jump into the pool from (A) heights, and teams of swimmers move (B) together underwater.","ko":"다이버들은 (A) 높이에서 수영장으로 뛰어들고, 수영 선수 팀들은 물속에서 함께 (B) 움직인다.","oko":["(A) 낮은 / (B) 우아하게","(A) 숨 막히는 / (B) 서투르게","(A) 낮은 / (B) 서투르게","(A) 숨 막히는 / (B) 우아하게","(A) 아주 작은 / (B) 따로따로"],"opts":["(A) low / (B) gracefully","(A) breathtaking / (B) clumsily","(A) low / (B) clumsily","(A) breathtaking / (B) gracefully","(A) tiny / (B) separately"],"r":{"a":"4) (A) breathtaking / (B) gracefully","ev":"8~9번 문장","s":[[8,"Divers jump into the pool from breathtaking heights.","다이버들은 숨이 막히는 높이에서 수영장 안으로 뛰어든다."],[9,"Teams of swimmers move gracefully together underwater.","수영 선수 팀들이 물속에서 함께 우아하게 움직인다."]],"w":"8번에서 다이버들은 breathtaking heights(숨 막히는 높이)에서 뛰어들어요. 9번에서 수영 선수 팀들은 gracefully together(함께 우아하게) 움직여요.","c":4},"h":"127436e74f"},{"n":10,"t":"fill","q":"The show O is performed in a theater that has a giant [A], and the name O is fitting because the show takes place in and around [B].","ko":"O 쇼는 거대한 [A]이(가) 있는 극장에서 공연되고, 쇼가 [B] 안과 주변에서 이루어지기 때문에 O라는 이름이 잘 어울린다.","bank":["pool","water","music","circus","French","speakers"],"bko":{"pool":"수영장","water":"물","music":"음악","circus":"서커스단","French":"프랑스어의","speakers":"스피커"},"r":{"a":"[A] pool, [B] water","ev":"1, 5번 문장","s":[[1,"Did you know that there is a theater in Las Vegas that has a giant pool?","당신은 라스베이거스에 거대한 수영장이 있는 극장이 있다는 것을 알고 있었는가?"],[5,"This name is fitting because the show takes place in and around water.","이 이름은 잘 어울리는데, 왜냐하면 그 쇼가 물 안과 물 주변에서 이루어지기 때문이다."]],"w":"1번에서 극장에 a giant pool(거대한 수영장)이 있다고 했고, 5번에서 쇼가 in and around water(물 안과 주변)에서 이루어진다고 했어요. music, circus, French, speakers는 이 문맥과 맞지 않아요.","c":null},"h":"404ca2a37a"}]},{"u":9,"id":"rj2-09-3","no":3,"ko":"럭비 선수들의 댄스 타임~","items":[{"n":1,"t":"tf","q":"The Maori lived in New Zealand before the Europeans arrived.","ko":"마오리족은 유럽인들이 도착하기 전에 뉴질랜드에서 살았다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The Maori lived in New Zealand before the Europeans arrived.","마오리족은 유럽인들이 (뉴질랜드에) 도착하기 전에 뉴질랜드에서 살았다."]],"w":"5번 문장에 The Maori lived in New Zealand before the Europeans arrived가 있어요. 유럽인보다 먼저 살았다는 내용과 맞아요.","c":"T"},"h":"746532d3d7"},{"n":2,"t":"tf","q":"In the past, the haka was performed to scare the enemy after a battle.","ko":"과거에 하카는 전투 후에 적을 겁주기 위해 추어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"In the past, the dance was performed to scare the enemy before a battle.","과거에 이 춤은 전투 전에 적을 겁주기 위해 추어졌다."]],"w":"7번 문장은 전투 전에(before a battle) 적을 겁주기 위해 췄다고 해요. 전투 후라는 말은 틀려요.","c":"F"},"h":"442ead5bf6"},{"n":3,"t":"tf","q":"Today the haka can be seen at weddings and funerals.","ko":"오늘날 하카는 결혼식과 장례식에서 볼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Today you can see the haka at many events, including weddings and funerals.","오늘날 당신은 결혼식과 장례식을 포함한 많은 행사에서 하카 춤을 볼 수 있다."]],"w":"12번 문장에서 오늘날 결혼식과 장례식을 포함한 많은 행사에서 하카를 볼 수 있다고 해요.","c":"T"},"h":"f06cd38794"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the past, the dance was performed to scare the enemy before a battle.)","ko":"과거에 이 춤은 전투 전에 적을 ( ) 위해 추어졌다.","opts":["도와주다","환영하다","겁주다","가르치다"],"word":"scare","r":{"a":"3) 겁주다","ev":"7번 문장","s":[[7,"In the past, the dance was performed to scare the enemy before a battle.","과거에 이 춤은 전투 전에 적을 겁주기 위해 추어졌다."]],"w":"전투 전에 적에게 하는 일이므로 '겁주다'가 알맞아요. 8번에서는 전쟁의 신에게 도움을 구한다고 해서 7번의 목적과 구분돼요.","c":3},"h":"cc5433b64
