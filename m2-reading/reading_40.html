.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "Nikau · 뉴질랜드", "en": "Kia Orana! I’m Nikau from New Zealand.", "ko": "안녕하세요! 저는 뉴질랜드에서 온 Nikau입니다.", "ok": true, "foot": ["1Kia Orana 쿡 제도 전통 인사말: 안녕하세요"], "fixes": []}, {"n": 2, "tag": null, "en": "I’m work at a whale research center in the Cook Islands.", "ko": "저는 쿡 제도에 있는 고래 연구소에서 일하고 있어요.", "ok": false, "foot": [], "fixes": [{"wrong": "work", "right": "working", "partial": false, "at": [1], "point": "현재진행형: be동사(am) 뒤에는 v-ing형 working 사용", "topic": "현재진행형", "memo": "be동사(am) 뒤에는 v-ing형 working 사용"}]}, {"n": 3, "tag": null, "en": "I think humpback whales are the more amazing animals in the ocean.", "ko": "저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요.", "ok": false, "foot": [], "fixes": [{"wrong": "more", "right": "most", "partial": false, "at": [6], "point": "최상급: 여러 대상 중 가장 ~하다는 의미이므로 최상급 most 사용(비교급 more 아님)", "topic": "최상급", "memo": "여러 대상 중 가장 ~하다는 의미이므로 최상급 most 사용(비교급 more 아님)"}]}, {"n": 4, "tag": null, "en": "I have keep a diary about them for record my work and thoughts.", "ko": "저는 제 일과 생각들을 기록하기 위해서 그들에 대한 일기를 써 오고 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "keep", "right": "kept", "partial": false, "at": [2], "point": "현재완료: have 뒤에는 과거분사 kept 사용", "topic": "현재완료", "memo": "have 뒤에는 과거분사 kept 사용"}, {"wrong": "for record", "right": "to record", "partial": false, "at": [7], "point": "to부정사의 부사적 용법(목적): '~하기 위해'는 to+동사원형(to record) 사용", "topic": "to부정사의 부사적 용법(목적)", "memo": "'~하기 위해'는 to+동사원형(to record) 사용"}]}, {"n": 5, "tag": "7월 1일", "en": "Finally, the humpback whales is back!", "ko": "마침내, 혹등고래들이 돌아왔다!", "ok": false, "foot": [], "fixes": [{"wrong": "is", "right": "are", "partial": false, "at": [4], "point": "수일치: 주어 whales(복수)에 맞춰 동사 are 사용", "topic": "수일치", "memo": "주어 whales(복수)에 맞춰 동사 are 사용"}]}, {"n": 6, "tag": null, "en": "They have travel about 6,500 km from the Southern Ocean for giving birth.", "ko": "그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다.", "ok": false, "foot": [], "fixes": [{"wrong": "travel", "right": "traveled", "partial": false, "at": [2], "point": "현재완료: have 뒤에는 과거분사 traveled 사용", "topic": "현재완료", "memo": "have 뒤에는 과거분사 traveled 사용"}, {"wrong": "for giving birth", "right": "to give birth", "partial": false, "at": [10], "point": "to부정사의 부사적 용법(목적): '~하기 위해'는 to give birth 사용(전치사 for나 동명사 giving 아님)", "topic": "to부정사의 부사적 용법(목적)", "memo": "'~하기 위해'는 to give birth 사용(전치사 for나 동명사 giving 아님)"}]}, {"n": 7, "tag": null, "en": "The big and friendly giants came close to our boat and playing for a while.", "ko": "그 크고 친근한 거대한 동물들이 우리의 보트에 가까이 왔고 잠시 동안 놀았다.", "ok": false, "foot": [], "fixes": [{"wrong": "playing", "right": "played", "partial": false, "at": [11], "point": "병렬구조: and로 연결된 두 동사는 같은 형태(came ~ played)로 사용", "topic": "병렬구조", "memo": "and로 연결된 두 동사는 같은 형태(came ~ played)로 사용"}]}, {"n": 8, "tag": null, "en": "All of a sudden, they jumped up high and make huge splashes.", "ko": "갑자기, 그들이 높이 뛰어올라 거대한 물보라를 만들었다.", "ok": false, "foot": ["1splash (명사) 물보라, 첨벙 소리"], "fixes": [{"wrong": "make", "right": "made", "partial": false, "at": [9], "point": "병렬구조: and로 연결된 두 동사는 같은 시제(jumped ~ made)로 사용", "topic": "병렬구조", "memo": "and로 연결된 두 동사는 같은 시제(jumped ~ made)로 사용"}]}, {"n": 9, "tag": null, "en": "Watching whales never get boring.", "ko": "고래들을 보는 것은 절대로 지루해지지 않는다.", "ok": false, "foot": [], "fixes": [{"wrong": "get", "right": "gets", "partial": false, "at": [3], "point": "동명사구 주어는 단수 취급: 동사에 -s가 필요(gets)", "topic": "동명사구 주어는 단수 취급", "memo": "동사에 -s가 필요(gets)"}]}, {"n": 10, "tag": "7월 17일", "en": "Today, I flied a drone to tag humpback whales.", "ko": "오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다.", "ok": false, "foot": ["1tag (동사) 표식을 달다"], "fixes": [{"wrong": "flied", "right": "flew", "partial": false, "at": [2], "point": "어법: fly의 과거형은 불규칙형 flew (flied 아님)", "topic": "어법", "memo": "fly의 과거형은 불규칙형 flew (flied 아님)"}]}, {"n": 11, "tag": null, "en": "I followed them closely and drop tags carefully onto their backs.", "ko": "나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다.", "ok": false, "foot": [], "fixes": [{"wrong": "drop", "right": "dropped", "partial": false, "at": [5], "point": "병렬구조: and로 연결된 두 동사는 같은 시제(followed ~ dropped)로 사용", "topic": "병렬구조", "memo": "and로 연결된 두 동사는 같은 시제(followed ~ dropped)로 사용"}]}, {"n": 12, "tag": null, "en": "We get a lot of informations about them from the tags.", "ko": "우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다.", "ok": false, "foot": [], "fixes": [{"wrong": "informations", "right": "information", "partial": false, "at": [5], "point": "어휘: information은 셀 수 없는 명사이므로 복수형 불가", "topic": "어휘", "memo": "information은 셀 수 없는 명사이므로 복수형 불가"}]}, {"n": 13, "tag": null, "en": "I am particular interested in their songs, and the tags has recorded them for several years.", "ko": "나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "particular", "right": "particularly", "partial": false, "at": [2], "point": "품사: 형용사(interested)를 꾸미므로 부사 particularly 사용", "topic": "품사", "memo": "형용사(interested)를 꾸미므로 부사 particularly 사용"}, {"wrong": "has recorded", "right": "have recorded", "partial": false, "at": [10], "point": "수일치: 주어 tags(복수)에 맞춰 동사 have 사용", "topic": "수일치", "memo": "주어 tags(복수)에 맞춰 동사 have 사용"}]}, {"n": 14, "tag": null, "en": "Their songs lasts up to 30 minutes and can travels thousands of kilometers underwater!", "ko": "그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다!", "ok": false, "foot": [], "fixes": [{"wrong": "lasts", "right": "last", "partial": false, "at": [2], "point": "수일치: 주어 songs(복수)에는 동사원형 last 사용", "topic": "수일치", "memo": "주어 songs(복수)에는 동사원형 last 사용"}, {"wrong": "travels", "right": "travel", "partial": false, "at": [9], "point": "조동사(can) 뒤에는 동사원형 travel 사용", "topic": "어법", "memo": "조동사(can) 뒤에는 동사원형 travel 사용"}]}, {"n": 15, "tag": null, "en": "The songs are beautiful, but we still doesn’t know much about them.", "ko": "그 노래들은 아름답지만, 우리는 여전히 그것들에 대해 많이 알지 못한다.", "ok": false, "foot": [], "fixes": [{"wrong": "doesn’t", "right": "don’t", "partial": false, "at": [7], "point": "수일치: 주어 we(복수)에 맞춰 don't 사용", " rone to tag humpback whales.", "오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다.", 0], ["I followed them closely and dropped tags carefully onto their backs.", "나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다.", 0], ["We get a lot of information about them from the tags.", "우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다.", 0], ["I am particularly interested in their songs, and the tags have recorded them for several years.", "나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다.", 0], ["Their songs last up to 30 minutes and can travel thousands of kilometers underwater!", "그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다!", 0], ["The songs are beautiful, but we still don’t know much about them.", "그 노래들은 아름답지만, 우리는 여전히 그것들에 대해 많이 알지 못한다.", 0], ["I was filming some humpback whales underwater.", "나는 물속에서 몇몇 혹등고래를 찍고 있었다.", 0], ["Suddenly, one whale came close and pushed me hard.", "갑자기, 고래 한 마리가 가까이 와서 나를 세게 밀었다.", 0], ["I tried to swim away, but it kept pushing me out of the water.", "나는 헤엄쳐 가려고 노력했지만, 그것은 계속해서 나를 물 밖으로 밀어냈다.", 0], ["I was so surprised.", "나는 정말 놀랐다.", 0], ["Then somebody shouted from the boat, “A tiger shark is coming!”", "그때 누군가 배에서 소리쳤다. “뱀상어가 오고 있다!”", 0], ["I safely got on the boat.", "나는 안전하게 배 위에 탔다.", 0], ["I realized that the whale was trying to save me.", "나는 그 고래가 나를 구하려고 애썼다는 것을 깨달았다.", 0], ["Humpback whales sometimes help other sea animals, but I never expected them to save my life.", "혹등고래는 때때로 다른 동물들을 돕지만, 나는 그들이 내 생명을 살리리라고 전혀 예상하지 못했다.", 0], ["This morning, I found a dead humpback whale on the coast.", "오늘 아침, 나는 해안에서 죽은 혹등고래를 발견했다.", 0], ["There were so many plastic bags and fishing nets in its stomach.", "그것의 위에는 너무 많은 비닐봉지와 낚시 그물이 있었다.", 0], ["Human activities are the greatest danger to whales.", "인간의 활동들은 고래들에게 가장 큰 위험이다.", 0], ["The ocean is home to whales and other sea animals.", "바다는 고래들과 다른 바다 동물들의 서식지이다.", 0], ["I want humans and sea animals to live in harmony.", "나는 인간과 바다 동물들이 조화롭게 살기를 원한다.", 0]];var RNUM=40;var TITLE_EN="I Love Humpback Whales";var PASS_EN=["I Love Humpback Whales", "Kia Orana! I’m Nikau from New Zealand. I’m working at a whale research center in the Cook Islands. I think humpback whales are the most amazing animals in the ocean. I have kept a diary about them to record my work and thoughts.", "Finally, the humpback whales are back! They have traveled about 6,500 km from the Southern Ocean to give birth. The big and friendly giants came close to our boat and played for a while. All of a sudden, they jumped up high and made huge splashes. Watching whales never gets boring.", "Today, I flew a drone to tag humpback whales. I followed them closely and dropped tags carefully onto their backs. We get a lot of information about them from the tags. I am particularly interested in their songs, and the tags have recorded them for several years. Their songs last up to 30 minutes and can travel thousands of kilometers underwater! The songs are beautiful, but we still don’t know much about them.", "I was filming some humpback whales underwater. Suddenly, one whale came close and pushed me hard. I tried to swim away, but it kept pushing me out of the water. I was so surprised. Then somebody shouted from the boat, “A tiger shark is coming!” I safely got on the boat. I realized that the whale was trying to save me. Humpback whales sometimes help other sea animals, but I never expected them to save my life.", "This morning, I found a dead humpback whale on the coast. There were so many plastic bags and fishing nets in its stomach. Human activities are the greatest danger to whales. The ocean is home to whales and other sea animals. I want humans and sea animals to live in harmony."];var PASS_KO=["나는 혹등고래를 사랑해", "안녕하세요! 저는 뉴질랜드에서 온 Nikau입니다. 저는 쿡 제도에 있는 고래 연구소에서 일하고 있어요. 저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요. 저는 제 일과 생각들을 기록하기 위해서 그들에 대한 일기를 써 오고 있습니다.", "마침내, 혹등고래들이 돌아왔다! 그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다. 그 크고 친근한 거대한 동물들이 우리의 보트에 가까이 왔고 잠시 동안 놀았다. 갑자기, 그들이 높이 뛰어올라 거대한 물보라를 만들었다. 고래들을 보는 것은 절대로 지루해지지 않는다.", "오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다. 나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다. 우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다. 나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다. 그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다! 그 노래들은 아름답지만, 우리는 여전히 그것들에 대해 많이 알지 못한다.", "나는 물속에서 몇몇 혹등고래를 찍고 있었다. 갑자기, 고래 한 마리가 가까이 와서 나를 세게 밀었다. 나는 헤엄쳐 가려고 노력했지만, 그것은 계속해서 나를 물 밖으로 밀어냈다. 나는 정말 놀랐다. 그때 누군가 배에서 소리쳤다. “뱀상어가 오고 있다!” 나는 안전하게 배 위에 탔다. 나는 그 고래가 나를 구하려고 애썼다는 것을 깨달았다. 혹등고래는 때때로 다른 동물들을 돕지만, 나는 그들이 내 생명을 살리리라고 전혀 예상하지 못했다.", "오늘 아침, 나는 해안에서 죽은 혹등고래를 발견했다. 그것의 위에는 너무 많은 비닐봉지와 낚시 그물이 있었다. 인간의 활동들은 고래들에게 가장 큰 위험이다. 바다는 고래들과 다른 바다 동물들의 서식지이다. 나는 인간과 바다 동물들이 조화롭게 살기를 원한다."];var DG=[{"dlg": [["Minji", "Kate, Alex! Did you watch the documentary about giraffes yesterday?", "Kate, Alex! 너희 어제 기린에 관한 다큐멘터리 봤어?"], ["Alex", "Yes, I did. It was interesting.", "응, 봤어. 재미있었어."], ["Kate", "Oh, I didn’t. What did you learn about them?", "아, 나는 못 봤어. 기린에 대해 뭘 알게 됐어?"], ["Minji", "You know, giraffes are the tallest land animals in the world.", "있잖아, 기린은 세상에서 가장 키가 큰 육지 동물이야."], ["Alex", "Right. Their necks and legs are so long.", "맞아. 목과 다리가 정말 길지."], ["Minji", "Did you know that their tongues are very unique?", "기린의 혀가 아주 독특하다는 거 알고 있었어?"], ["Kate", "What do you mean? I’m curious about it.", "무슨 뜻이야? 궁금하다."], ["Alex", "They’re really long. They’re about 50 cm! Giraffes can reach the highest leaves with their tongues.", "혀가 정말 길어. 약 50cm나 돼! 기린은 혀로 가장 높은 곳의 잎까지 닿을 수 있어."], ["Kate", "That’s surprising!", "그거 놀랍다!"], ["Minji", "Also, I learned that their tongues are black.", "또, 기린의 혀가 검은색이라는 것도 알게 됐어."], ["Kate", "Wow, giraffes are so interesting!", "와, 기린은 정말 흥미롭구나!"]], "qs": [{"n": 1, "q": "위 대화의 주제로 알맞은 것은?", "o": ["기린의 서식지", "기린의 혀의 기능", "기린에 관한 다큐멘터리 제작", "기린에 대한 재미있는 사실들", "기린의 흥미로운 생존 전략들"], "a": 3, "ans": "기린에 대한 재미있는 사실들", "evs": [["Minji: You know, giraffes are the tallest land animals in the world.", "있잖아, 기린은 세상에서 가장 키가 큰 육지 동물이야."], ["Minji: Did you know that their tongues are very unique?", "기린의 혀가 아주 독특하다는 거 알고 있었어?"]], "ev": ["
