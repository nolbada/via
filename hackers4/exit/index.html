ng cost, which is usually high in the U.S. due to its vast size.","이것은 추가적인 운송 비용을 야기하는데, 미국의 광대한 크기 때문에 미국에서 이것은 보통 높다."]],"w":"운송 비용이 높은 이유가 미국의 크기예요. 미국이 매우 넓어서 상품을 보내는 데 돈이 많이 들죠. vast는 '광대한, 매우 넓은'이에요.","c":3},"h":"7258ff4650"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen there are unsold items, companies have to send them to their other branches or to discount outlets.","ko":"밑줄 친 them이 가리키는 것은?","sko":"팔리지 않은 상품이 있을 때, 기업은 그것들을 다른 지점이나 할인 매장으로 보내야 한다.","opts":["소비자들","다른 지점들","팔리지 않은 상품들","할인 매장들"],"r":{"a":"3) 팔리지 않은 상품들","ev":"9번 문장","s":[[9,"When there are unsold items, companies have to send them to their other branches or to discount outlets.","팔리지 않은 상품이 있을 때, 기업은 그것들을 다른 지점이나 할인 매장으로 보내야 한다."]],"w":"보내지는 것은 앞에 나온 unsold items(팔리지 않은 상품)예요. 지점과 할인 매장은 보내는 장소예요.","c":3},"h":"7322f96707"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Consumers can easily shop on the Internet without having to visit a crowded store.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"소비자들은 사람들이 붐비는 가게에 방문할 필요 없이 인터넷상에서 쉽게 쇼핑할 수 있다.","opts":["소비자들은 인터넷에서 붐비는 가게의 위치를 쉽게 찾을 수 있다.","소비자들은 인터넷에서 쇼핑하려면 가게에 꼭 방문해야 한다.","소비자들은 붐비는 가게에서만 쉽게 쇼핑할 수 있다.","소비자들은 붐비는 가게에 방문하지 않아도 인터넷에서 쉽게 쇼핑할 수 있다."],"r":{"a":"4) 소비자들은 붐비는 가게에 방문하지 않아도 인터넷에서 쉽게 쇼핑할 수 있다.","ev":"6번 문장","s":[[6,"Consumers can easily shop on the Internet without having to visit a crowded store.","소비자들은 사람들이 붐비는 가게에 방문할 필요 없이 인터넷상에서 쉽게 쇼핑할 수 있다."]],"w":"without having to visit a crowded store는 '붐비는 가게에 방문할 필요 없이'예요. 인터넷으로 가게에 가지 않고 쇼핑한다는 뜻이에요.","c":4},"h":"0e312584d4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사이버 먼데이에는 블랙 프라이데이에 팔리지 않은 상품이 훨씬 더 낮은 가격에 팔린다.","사이버 먼데이에는 블랙 프라이데이에 팔린 상품이 더 비싼 가격에 다시 팔린다.","사이버 먼데이의 할인은 옷에만 최대 90퍼센트까지 적용된다.","사이버 먼데이에 팔리지 않은 상품은 블랙 프라이데이로 돌려보내진다."],"opts":["On Cyber Monday, goods that were not sold on Black Friday are sold at an even lower price.","On Cyber Monday, goods sold on Black Friday are sold again at a  sound.","ko":"Edward는 자신이 그 소리를 내는 것을 멈출 수 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"In fact, he can’t stop himself from doing it.","사실, 그는 자신이 그것을 하는 것을 멈출 수 없다."]],"w":"4번 문장에 he can't stop himself from doing it이 나와요. 스스로 멈출 수 없다는 내용이 맞아요.","c":"T"},"h":"743e1a4cf9"},{"n":2,"t":"tf","q":"About 50 percent of children worldwide have tics.","ko":"전 세계 아이들의 약 50퍼센트가 틱을 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Between 10 to 20 percent of children worldwide have tics.","전 세계에서 10에서 20퍼센트 사이의 아이들이 틱을 가지고 있다."]],"w":"8번 문장에서 전 세계 아이들 중 10에서 20퍼센트가 틱을 가지고 있다고 해요. 50퍼센트가 아니에요.","c":"F"},"h":"877518da74"},{"n":3,"t":"tf","q":"Forcing people with tics to stop can make their symptoms worse.","ko":"틱이 있는 사람들에게 멈추도록 강요하는 것은 증상을 더 악화시킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"But if you force people with tics to stop, they can get stressed, and this can make the symptoms worse.","하지만 만약 틱이 있는 사람들에게 멈추도록 강요한다면, 그들은 스트레스를 받을 수 있고, 이것은 증상을 더 악화시킬 수 있다."]],"w":"10번 문장에서 멈추도록 강요하면 스트레스를 받고, 이것이 증상을 더 악화시킬 수 있다고 해요.","c":"T"},"h":"a8f5a7bc3b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The symptoms naturally disappear when they get older.)","ko":"그들이 나이가 들면 증상이 자연스럽게 ( ).","opts":["커진다","변한다","사라진다","나타난다"],"word":"disappear","r":{"a":"3) 사라진다","ev":"9번 문장","s":[[9,"It’s not usually a serious matter, as the symptoms naturally disappear when they get older.","그들이 나이가 들면 증상이 자연스럽게 사라지기 때문에, 이것은 대개 심각한 문제는 아니다."]],"w":"틱이 대개 심각한 문제가 아닌 이유예요. 나이가 들면 증상이 자연스럽게 없어지는 거예요. disappear는 '사라지다'예요.","c":3},"h":"8dda4b9d5f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The best thing to do is ignore the tics and just treat them as you would treat anyone else.)","ko":"할 수 있는 가장 좋은 것은 틱을 ( ) 그냥 그들을 다른 사람을 대하는 것처럼 대하는 것이다.","opts":["흉내 내고","무시하고","강조하고","기록하고"],"word":"ignore","r":{"a":"2) 무시하고","ev":"11번 문장","s":[[11,"Thus, the best thing to do is ignore the tics and just treat them as you would treat anyone else.","따라서, 할 수 있는 가장 좋은 것은 틱을 무시하고 그냥 그들을 다른 사람을 대하는 것처럼 대하는 것이다."]],"w":"멈추도록 강요하면 안 좋다고 했어요(10번). 그래서 가장 좋은 것은 틱에 신경 쓰지 않는 거예요. ignore는 '무시하다'예요.","c":2},"h":"a1373d95c3"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nEdward and others like him have a condition known as a tic disorder.","ko":"밑줄 친 him이 가리키는 것은?","sko":"Edward 그리고 그와 같은 다른 사람들은 틱 장애라고 알려진 질환을 가지고 있다.","opts":["Edward","의사","반 친구","틱"],"pron":"him","r":{"a":"1) Edward","ev":"5번 문장","s":[[5,"Edward and others like him have a condition known as a tic disorder.","Edward 그리고 그와 같은 다른 사람들은 틱 장애라고 알려진 질환을 가지고 있다."]],"w":"5번의 him은 같은 문장의 Edward예요. Edward와 그와 같은 다른 사람들이 틱 장애라는 질환을 가지고 있다는 말이에요.","c":1,"k":"him = Edward"},"h":"ca8a4597f8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, he doesn’t do it on purpose.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 그는 그것을 고의로 하지 않는다.","opts":["그는 그것을 일부러 하지 않는다.","그는 그것을 일부러 한다.","그는 그것을 하는 것을 좋아하지 않는다.","그는 그것을 하는 방법을 모른다."],"r":{"a":"1) 그는 그것을 일부러 하지 않는다.","ev":"3번 문장","s":[[3,"However, he doesn’t do it on purpose.","하지만, 그는 그것을 고의로 하지 않는다."]],"w":"He doesn’t do it on purpose에서 on purpose는 ‘일부러, 고의로’라는 뜻이에요. 일부러 하지 않는다는 말이에요.","c":1},"h":"c952bde6eb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Edward는 다른 사람들이 조용할 때나 수업 중에도 소리를 낸다.","Edward는 집에서만 소리를 낸다.","Edward는 반 친구들을 괴롭히려고 소리를 낸다.","Edward는 다른 사람들이 조용하면 소리를 멈춘다."],"opts":["Edward makes the noise when other people are quiet and even during class.","Edward makes the sound only at home.","Edward makes the sound to bother his classmates.","Edward stops making the sound when others are quiet."],"r":{"a":"1) Edward makes the noise when other people are quiet and even during class. (Edward는 다른 사람들이 조용할 때나 수업 중에도 소리를 낸다.)","ev":"2번 문장","s":[[2,"He makes the noise when other people are quiet and even during class.","그는 다른 사람들이 조용할 때 그리고 심지어 수업 중에도 그 소리를 낸다."]],"w":"2번에서 Edward는 다른 사람들이 조용할 때 그리고 심지어 수업 중에도 그 소리를 낸다고 해요.","c":1},"h":"4569f1284d"},{"n":9,"t":"sum","q":"People with tic disorders may (A) a wide (B) of symptoms.","ko":"틱 장애를 가진 사람들은 폭넓은 (B)의 증상을 (A) 수도 있다.","oko":["(A) 겪을 / (B) 범위","(A) 겪을 / (B) 부족","(A) 피할 / (B) 범위","(A) 피할 / (B) 부족","(A) 잊을 / (B) 부족"],"opts":["(A) experience / (B) range","(A) experience / (B) lack","(A) avoid / (B) range","(A) avoid / (B) lack","(A) forget / (B) lack"],"r":{"a":"1) (A) experience / (B) range ((A) 겪을 / (B) 범위)","ev":"6번 문장","s":[[6,"Those who suffer from it may experience a wide range of symptoms, such as blinking their eyes, shaking their heads, clearing their throats, or saying a particular word repeatedly.","그것을 앓는 사람들은 눈을 깜빡이는 것, 머리를 흔드는 것, 헛기침을 하는 것, 또는 특정한 단어를 반복적으로 말하는 것과 같은 다양한 증상을 겪을 수도 있다."]],"w":"6번에서 틱 장애를 앓는 사람들은 다양한(a wide range of) 증상을 겪을 수도 있다(may experience)고 해요.","c":1},"h":"3eae85b548"},{"n":10,"t":"fill","q":"Tic disorders are [A] more [B] than we think.","ko":"틱 장애는 우리가 생각하는 것보다 [A] 더 [B].","bank":["much","common","repeatedly","particular","quietly","throats"],"bko":{"much":"훨씬","common":"흔한","repeatedly":"반복적으로","particular":"특정한","quietly":"조용히","throats":"목구멍들"},"a":"[A] much, [B] common","r":{"a":"[A] much (훨씬), [B] common (흔한)","ev":"7번 문장","s":[[7,"Tic disorders are much more common than we think.","틱 장애는 우리가 생각하는 것보다 훨씬 더 흔하다."]],"w":"7번에서 Tic disorders are much more common than we think라고 했어요. more 앞에는 정도를 강조하는 부사 much, more 뒤에는 형용사 common이 와요.","c":null},"h":"4852746f00"}]},{"u":6,"id":"hk4-06-1","no":1,"ko":"한 달의 유혹\b","items":[{"n":1,"t":"tf","q":"Many movie and music streaming services offer free usage for a certain period of time.","ko":"많은 영화와 음악 스트리밍 서비스는 일정한 기간 동안 무료 이용을 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A number of movie and music streaming services offer free usage for a certain period of time.","많은 영화와 음악 스트리밍 서비스는 일정한 기간 동안 무료 이용을 제공한다."]],"w":"2번 문장에 offer free usage for a certain period of time이 그대로 나와요.","c":"T"},"h":"2a6d5cedb5"},{"n":2,"t":"tf","q":"People who forget to cancel their subscriptions don't pay anything for the next term.","ko":"구독을 취소할 것을 잊은 사람들은 다음 기간에 아무것도 내지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"People who forget to cancel their subscriptions are automatically charged for another term.","구독을 취소할 것을 잊은 사람들은 다음 기간에 대해 자동적으로 요금이 부과된다."]],"w":"5번 문장은 취소를 잊은 사람들이 다음 기간에 대해 자동으로 요금이 부과된다(are automatically charged)고 해요. 내지 않는다는 말은 반대예요.","c":"F"},"h":"0fd25848e9"},{"n":3,"t":"tf","q":"You can call the customer service center at any time of the day.","ko":"하루 중 언제든지 고객 서비스 센터에 전화할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"For instance, you might have to call the customer service center only during office hours.","예를 들어, 당신은 영업시간 동안에만 고객 서비스 센터에 전화해야 할지도 모른다."]],"w":"8번 문장에서 고객 서비스 센터에는 영업시간에만(only during office hours) 전화해야 할 수도 있다고 해요.","c":"F"},"h":"686d62e200"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, problems occur when the free trial period is over and you don't want the service anymore.)","ko":"하지만, 무료 체험 기간이 끝나고 그 서비스를 더 이상 원치 않게 되면 문제가 ( ).","opts":["사라진다","해결된다","생긴다","줄어든다"],"word":"occur","r":{"a":"3) 생긴다","ev":"4번 문장","s":[[4,"However, problems occur when the free trial period is over and you don’t want the service anymore.","하지만, 무료 체험 기간이 끝나고 그 서비스를 더 이상 원치 않게 되면 문제가 생긴다."]],"w":"However 뒤에서 좋은 점과 반대되는 문제를 말해요. 체험이 끝났는데 서비스가 필요 없을 때 문제가 생기는 거예요. occur는 '생기다'예요.","c":3},"h":"3432d2945e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People who forget to cancel their subscriptions are automatically charged for another term.)","ko":"구독을 취소할 것을 잊은 사람들은 다음 기간에 대해 ( ) 요금이 부과된다.","opts":["천천히","자동적으로","가끔","직접"],"word":"automatically","r":{"a":"2) 자동적으로","ev":"5번 문장","s":[[5,"People who forget to cancel their subscriptions are automatically charged for another term.","구독을 취소할 것을 잊은 사람들은 다음 기간에 대해 자동적으로 요금이 부과된다."]],"w":"취소를 잊었을 뿐인데 요금이 나가는 상황이에요. 내가 따로 하지 않아도 저절로 부과된다는 뜻이라서 automatically는 '자동적으로'예요.","c":2},"h":"d2e1cd7def"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nMoreover, some of them even make it hard to cancel subscriptions.","ko":"밑줄 친 them이 가리키는 것은?","sko":"게다가, 그들 중 일부는 심지어 구독을 취소하는 것을 어렵게 만든다.","opts":["구독을 취소하는 사람들","이용자들","직원들","무료 체험을 제공하는 회사들"],"r":{"a":"4) 무료 체험을 제공하는 회사들","ev":"6~7번 문장","s":[[6,"And few companies remind their users of when their free trial ends.","그리고 이용자에게 그들의 무료 체험이 언제 끝나는지를 다시 한번 알려주는 회사는 거의 없다."],[7,"Moreover, some of them even make it hard to cancel subscriptions.","게다가, 그들 중 일부는 심지어 구독을 취소하는 것을 어렵게 만든다."]],"w":"구독을 취소하기 어렵게 만드는 쪽은 서비스를 제공하는 회사예요. 바로 앞 6번의 few companies(회사들)가 them이에요.","c":4},"h":"b96461dae8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"“Free for one month” is a marketing trick often used online.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"‘한 달 동안 무료’는 온라인에서 자주 이용되는 마케팅 수법이다.","opts":["‘한 달 동안 무료’는 온라인에서 자주 쓰이는 마케팅 수법이다.","‘한 달 동안 무료’는 온라인에서만 받을 수 있는 선물이다.","‘한 달 동안 무료’는 가게에서 하는 할인 행사이다.","‘한 달 동안 무료’ 서비스는 한 달이 지나도 계속 무료이다."],"r":{"a":"1) ‘한 달 동안 무료’는 온라인에서 자주 쓰이는 마케팅 수법이다.","ev":"1번 문장","s":[[1,"“Free for one month” is a marketing trick often used online.","‘한 달 동안 무료’는 온라인에서 자주 이용되는 마케팅 수법이다."]],"w":"\"a marketing trick often used online\"은 온라인에서 자주 이용되는 마케팅 수법이라는 뜻이에요. 1번 문장 그대로 풀어 쓴 선지가 정답이에요.","c":1},"h":"137704fabd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["무료 체험은 돈을 내지 않아도 영원히 이어진다.","회사들은 항상 무료 체험이 끝나는 날을 이용자에게 알려 준다.","직원과 이야기하는 데만도 오랜 시간이 걸릴 수 있다.","버튼 하나로 어떤 구독이든 취소할 수 있다."],"opts":["A free trial continues forever without any payment.","Companies always remind users when their free trial ends.","Just speaking to an employee can take a long time.","You can cancel any subscription by pressing one button."],"r":{"a":"3) Just speaking to an employee can take a long time.","ev":"9번 문장","s":[[9,"And it could take a long time just to speak to an employee.","그리고 단지 직원과 이야기하는 것에도 오랜 시간이 걸릴 수 있다."]],"w":"9번에서 단지 직원과 이야기하는 것에도 오랜 시간이 걸릴 수 있다고 해요. 6번에서 알려 주는 회사는 거의 없다고 했으니 항상 알려 준다는 말은 틀려요.","c":3},"h":"33193be9e7"},{"n":9,"t":"sum","q":"A free trial seems like a great (A) to (B) a new service without paying for it.","ko":"무료 체험은 돈을 내지 않고 새로운 서비스를 (B)해 볼 훌륭한 (A)처럼 보인다.","opts":["(A) way / (B) try","(A) way / (B) sell","(A) mistake / (B) try","(A) problem / (B) sell","(A) problem / (B) try"],"oko":["(A) 방법 / (B) 시도","(A) 방법 / (B) 판매","(A) 실수 / (B) 시도","(A) 문제 / (B) 판매","(A) 문제 / (B) 시도"],"r":{"a":"1) (A) way / (B) try","ev":"3번 문장","s":[[3,"This seems like a great way to try out a new service without paying for it.","이것은 돈을 내지 않고 새로운 서비스를 시도해 볼 훌륭한 방법처럼 보인다."]],"w":"3번에서 무료 체험은 돈을 내지 않고 새로운 서비스를 시도해 볼(try out) 훌륭한 방법(great way)처럼 보인다고 해요.","c":1},"h":"b353623c34"},{"n":10,"t":"fill","q":"Before you [A] up for a subscription, check the terms and conditions, and mark your [B].","ko":"구독을 신청하기 전에 이용 약관을 확인하고, 당신의 [B]에 표시해 두어라.","bank":["sign","calendar","employee","usage","charge","online"],"bko":{"sign":"신청하다(서명하다)","calendar":"달력","employee":"직원","usage":"이용","charge":"요금","online":"온라인의"},"r":{"a":"[A] sign, [B] calendar","ev":"10~11번 문장","s":[[10,"Thus, it’s important to check the terms and conditions of free trials before you sign up for a subscription.","그러므로, 구독을 신청하기 전에 무료 체험의 이용 약관을 확인하는 것이 중요하다."],[11,"Also, mark your calendar so that you can cancel the unwanted service in time.","또한, 당신이 원치 않는 서비스를 제시간에 취소할 수 있도록 당신의 달력에 표시해둬라."]],"w":"10번에서 구독을 신청하기(sign up) 전에 이용 약관을 확인하라고 하고, 11번에서 달력(calendar)에 표시하라고 해요.","c":null},"h":"265db981b3"}]},{"u":6,"id":"hk4-06-2","no":2,"ko":"시큰시큰, 내 손목이 위험해\b","items":[{"n":1,"t":"tf","q":"You should stay still for one minute during the test.","ko":"검사 중에는 1분 동안 가만히 있어야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Then, stay still for one minute.","그 다음, 1분 동안 가만히 있어라."]],"w":"3번 문장에 stay still for one minute(1분 동안 가만히 있어라)가 나와요.","c":"T"},"h":"ccec04240a"},{"n":2,"t":"tf","q":"In the beginning, you may feel severe pain in the entire wrist.","ko":"초기에는 손목 전체에 극심한 통증을 느낄 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"In the beginning, you might lose some feeling in your palm and fingers.","초기에는, 손바닥과 손가락에 감각을 잃을 수 있다."],[8,"However, later on, you can experience severe pain in the entire wrist.","하지만, 나중에는, 손목 전체에 극심한 통증을 겪을 수 있다."]],"w":"7번에서 초기에는 손바닥과 손가락의 감각을 잃는다고 하고, 극심한 통증은 8번에서 나중에(later on) 생긴다고 해요.","c":"F"},"h":"635f3e75b5"},{"n":3,"t":"tf","q":"People with this condition may often drop things.","ko":"이 질환을 가진 사람들은 물건을 자주 떨어뜨릴 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"You may often drop things or have difficulty in using chopsticks.","당신은 물건을 자주 떨어뜨리거나 젓가락을 사용하는 데 어려움을 겪을 수 있다."]],"w":"10번 문장에 You may often drop things가 나와요.","c":"T"},"h":"aff768e74d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Carpal tunnel syndrome occurs when this tunnel gets squeezed and puts pressure on the nerves.)","ko":"이 터널이 ( ) 신경에 압박을 가하면, 손목 터널 증후군이 발생한다.","opts":["넓어져","조여져","사라져","길어져"],"word":"squeezed","r":{"a":"2) 조여져","ev":"6번 문장","s":[[6,"Carpal tunnel syndrome occurs when this tunnel gets squeezed and puts pressure on the nerves.","이 터널이 조여져서 신경에 압박을 가하면, 손목 터널 증후군이 발생한다."]],"w":"터널이 신경을 누른다(put pressure)고 했으니 터널이 좁아져 눌린다는 뜻이에요. squeeze는 '조이다'이고 gets squeezed는 '조여지다'예요.","c":2},"h":"09ae8de635"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, later on, you can experience severe pain in the entire wrist.)","ko":"하지만, 나중에는, 손목 전체에 ( ) 통증을 겪을 수 있다.","opts":["가벼운","잠깐의","이상한","극심한"],"word":"severe","r":{"a":"4) 극심한","ev":"8번 문장","s":[[8,"However, later on, you can experience severe pain in the entire wrist.","하지만, 나중에는, 손목 전체에 극심한 통증을 겪을 수 있다."]],"w":"초기의 감각 저하(7번)와 대비해 However로 더 심한 증상을 말해요. severe는 '극심한'이에요.","c":4},"h":"23ee87a158"},{"n":6,"t":"ref","q":"What does the underlined \"These tasks\" refer to?\nThese tasks cause repetitive hand movements and increase the risk.","ko":"밑줄 친 These tasks가 가리키는 것은?","sko":"이러한 일은 반복적인 손의 움직임을 유발해서 위험성을 증가시킨다.","opts":["스마트폰을 사용하거나 키보드로 타자를 치는 것","젓가락을 사용하는 것","손목 터널 증후군을 검사하는 것","물건을 자주 떨어뜨리는 것"],"pron":"These tasks","r":{"a":"1) 스마트폰을 사용하거나 키보드로 타자를 치는 것","ev":"12~13번 문장","s":[[12,"This is because people use smartphones or type on keyboards for too long today.","이것은 오늘날 사람들이 너무 오랫동안 스마트폰을 사용하거나 키보드로 타자를 치기 때문이다."],[13,"These tasks cause repetitive hand movements and increase the risk.","이러한 일은 반복적인 손의 움직임을 유발해서 위험성을 증가시킨다."]],"w":"12번에서 사람들이 스마트폰을 쓰거나 키보드로 타자를 치는 시간이 너무 길다고 했어요. 13번의 These tasks는 바로 이 일들을 가리켜요.","c":1,"k":"These tasks = 스마트폰을 사용하거나 키보드로 타자를 치는 것"},"h":"2cb5a5dc5d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you feel pain in the palm and first three fingers, you may have carpal tunnel syndrome.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 손바닥과 첫 세 손가락에 통증을 느낀다면, 당신은 손목 터널 증후군을 가지고 있을지도 모른다.","opts":["손바닥과 첫 세 손가락에 통증이 느껴지면, 손목 터널 증후군일 수도 있다.","손바닥과 첫 세 손가락에 통증이 없으면, 손목 터널 증후군일 수도 있다.","손목 전체에 통증이 느껴지면, 반드시 손목 터널 증후군이다.","손가락 세 개에 통증이 느껴지면, 손목 터널 증후군이 나아진다."],"r":{"a":"1) 손바닥과 첫 세 손가락에 통증이 느껴지면, 손목 터널 증후군일 수도 있다.","ev":"4번 문장","s":[[4,"If you feel pain in the palm and first three fingers, you may have carpal tunnel syndrome.","만약 손바닥과 첫 세 손가락에 통증을 느낀다면, 당신은 손목 터널 증후군을 가지고 있을지도 모른다."]],"w":"If절은 '통증을 느낀다면', may have는 '가지고 있을지도 모른다'예요. 확실하다는 뜻이 아니고 가능성을 말해요.","c":1},"h":"a72e093fcc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["손목 터널 증후군을 가진 사람의 수는 요즘 줄어들고 있다.","이 질환을 가진 사람들의 수는 요즘 증가하고 있다.","손목 터널 증후군은 나이 든 사람만 걸린다.","스마트폰을 사용하면 손목 터널 증후군이 낫는다."],"opts":["The number of people with carpal tunnel syndrome is getting smaller these days.","The number of people with this condition is increasing these days.","Only old people get carpal tunnel syndrome.","Using smartphones can cure carpal tunnel syndrome."],"r":{"a":"2) The number of people with this condition is increasing these days.","ev":"11번 문장","s":[[11,"These days, the number of people with this condition is increasing.","요즘에, 이 질환을 가진 사람들의 수가 증가하고 있다."]],"w":"11번에서 요즘 이 질환을 가진 사람들의 수가 증가하고 있다고 해요. 12번에서 이유는 스마트폰이나 키보드를 너무 오래 쓰기 때문이라고 했어요.","c":2},"h":"96d00f551b"},{"n":9,"t":"sum","q":"To do the test, put the (A) of your hands together with your fingers pointing (B).","ko":"검사를 하려면 손가락이 (B) 쪽을 가리키게 한 채로 손의 (A)을(를) 함께 붙여라.","opts":["(A) backs / (B) down","(A) palms / (B) down","(A) backs / (B) up","(A) palms / (B) up","(A) fingers / (B) down"],"oko":["(A) 등 / (B) 아래","(A) 바닥 / (B) 아래","(A) 등 / (B) 위","(A) 바닥 / (B) 위","(A) 손가락 / (B) 아래"],"r":{"a":"1) (A) backs / (B) down","ev":"2번 문장","s":[[2,"Put the backs of your hands together with your fingers pointing down.","손가락이 아래를 가리키게 한 채로 손등을 함께 붙여라."]],"w":"2번에서 손가락이 아래(down)를 가리키게 한 채로 손등(the backs of your hands)을 함께 붙이라고 해요.","c":1},"h":"67b9013354"},{"n":10,"t":"fill","q":"In the wrist, there is a narrow [A] like a tunnel, which nerves [B] through.","ko":"손목에는 터널과 같은 좁은 [A]이(가) 있는데, 신경이 그곳을 통과해 [B].","bank":["space","pass","chopsticks","pressure","drop","type"],"bko":{"space":"공간","pass":"지나가다","chopsticks":"젓가락","pressure":"압박","drop":"떨어뜨리다","type":"타자를 치다"},"r":{"a":"[A] space (공간), [B] pass (지나가다)","ev":"5번 문장","s":[[5,"In the wrist, there is a narrow space like a tunnel, which nerves pass through.","손목에는, 터널과 같은 좁은 공간이 있는데, 신경이 이것을 통과해 지나간다."]],"w":"5번에서 손목에는 터널 같은 좁은 공간(space)이 있고, 신경이 그곳을 지나간다(pass through)고 해요.","c":null},"h":"2557c15cd0"}]},{"u":6,"id":"hk4-06-3","no":3,"ko":"아직은 안 되는 이유\b","items":[{"n":1,"t":"tf","q":"In the first example, if the car goes straight, five people will be injured.","ko":"첫 번째 예시에서, 자동차가 직진하면 다섯 명이 부상을 당할 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"If your car goes straight, five people will be injured.","만약 당신의 자동차가 직진하면, 다섯 명이 부상을 당할 것이다."]],"w":"5번 문장에 If your car goes straight, five people will be injured가 나와요. 직진하면 다섯 명이 부상을 당한다는 내용이 맞아요.","c":"T"},"h":"df63562686"},{"n":2,"t":"tf","q":"The passage says there is a clear right answer to each situation.","ko":"글은 각 상황에 분명한 정답이 있다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Of course, there is no right answer.","물론, 정답은 없다."]],"w":"10번 문장은 Of course, there is no right answer(물론, 정답은 없다)라고 해요. 정답이 있다는 말은 반대예요.","c":"F"},"h":"0fed138495"},{"n":3,"t":"tf","q":"Self-driving cars drive according to a program.","ko":"자율 주행 자동차는 프로그램에 따라 운전한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"However, self-driving cars must know what to do in advance because they drive according to a program.","하지만, 자율 주행 자동차는 무엇을 할지 사전에 알아야만 하는데, 왜냐하면 그것들은 프로그램에 따라 운전하기 때문이다."]],"w":"11번 문장에 they drive according to a program이 나와요.","c":"T"},"h":"914fcb39b0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But, if it makes a turn, you will get seriously injured.)","ko":"하지만, 방향을 바꾸면, 당신이 심각하게 ( ) 것이다.","opts":["부상을 당할","유명해질","도움을 받을","승리할"],"word":"injured","r":{"a":"1) 부상을 당할","ev":"8번 문장","s":[[8,"But, if it makes a turn, you will get seriously injured.","하지만, 만약 방향을 바꾸면, 당신이 심각하게 부상을 당할 것이다."]],"w":"방향을 바꾸는 상황은 위험한 결정의 예시예요. seriously(심각하게)와 어울리는 말은 다치는 것이라서 get injured는 '부상을 당하다'예요.","c":1},"h":"8a18e3bafb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Who is ultimately responsible—the software, the car company, or the human driver?)","ko":"소프트웨어, 자동차 회사, 또는 인간 운전자 중 누구에게 ( ) 책임이 있는가?","opts":["처음에는","궁극적으로","가끔","우연히"],"word":"ultimately","r":{"a":"2) 궁극적으로","ev":"14번 문장","s":[[14,"Who is ultimately responsible—the software, the car company, or the human driver?","소프트웨어, 자동차 회사, 또는 인간 운전자 중 누구에게 궁극적으로 책임이 있는가?"]],"w":"사고가 났을 때 결국 누구의 책임인지 묻는 질문이에요. ultimately는 '궁극적으로, 결국'이에요.","c":2},"h":"05b27a972a"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nEvery situation needs to be considered and programmed into them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"모든 상황이 고려되어 프로그램이 짜여야 한다.","opts":["다섯 명의 사람들","모든 상황들","자율 주행 자동차들","운전자들"],"r":{"a":"3) 자율 주행 자동차들","ev":"11~12번 문장","s":[[11,"However, self-driving cars must know what to do in advance because they drive according to a program.","하지만, 자율 주행 자동차는 무엇을 할지 사전에 알아야만 하는데, 왜냐하면 그것들은 프로그램에 따라 운전하기 때문이다."],[12,"Every situation needs to be considered and programmed into them.","모든 상황이 고려되어 프로그램이 짜여야 한다."]],"w":"프로그램을 짜 넣는 대상은 11번의 self-driving cars예요. 모든 상황(every situation)은 프로그램에 넣어지는 내용이에요.","c":3},"h":"c21153c897"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is because they cannot make difficult decisions yet.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그것들이 어려운 결정을 아직 내릴 수 없기 때문이다.","opts":["이것은 자율 주행 자동차가 이미 어려운 결정을 내릴 수 있기 때문이다.","이것은 자율 주행 자동차가 운전자를 아직 만나지 못했기 때문이다.","이것은 자율 주행 자동차가 어려운 결정을 내릴 필요가 없기 때문이다.","이것은 자율 주행 자동차가 어려운 결정을 아직 내릴 수 없기 때문이다."],"r":{"a":"4) 이것은 자율 주행 자동차가 어려운 결정을 아직 내릴 수 없기 때문이다.","ev":"4번 문장","s":[[4,"This is because they cannot make difficult decisions yet, like in the following examples.","이것은 그것들이 다음의 예시에서와 같이 어려운 결정을 아직 내릴 수 없기 때문이다."]],"w":"This is because는 '이것은 ~ 때문이다'이고, cannot ~ yet은 '아직 ~할 수 없다'예요. 그래서 아직은 어려운 결정을 내릴 수 없다는 뜻이에요.","c":4},"h":"da09678fdc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["첫 번째 예시에서, 자동차가 방향을 바꾸면 한 명만 죽게 된다.","첫 번째 예시에서, 자동차가 방향을 바꾸면 다섯 명이 다친다.","첫 번째 예시에서, 자동차가 무엇을 하든 아무도 다치지 않는다.","첫 번째 예시에서, 자동차가 방향을 바꾸면 운전자가 죽게 된다."],"opts":["In the first example, if the car makes a turn, only one person will be killed.","In the first example, if the car makes a turn, five people will be injured.","In the first example, nobody will be hurt whatever the car does.","In the first example, the driver will be killed if the car makes a turn."],"r":{"a":"1) In the first example, if the car makes a turn, only one person will be killed. (첫 번째 예시에서, 자동차가 방향을 바꾸면 한 명만 죽게 된다.)","ev":"6번 문장","s":[[6,"But, if it makes a turn, only one person will be killed.","하지만, 만약 방향을 바꾸면, 한 명만 죽게 될 것이다."]],"w":"6번에서 방향을 바꾸면(makes a turn) 한 명만 죽게 된다(only one person will be killed)고 해요. 직진하면 다섯 명이 다친다는 것은 5번 내용이에요.","c":1},"h":"c62249a934"},{"n":9,"t":"sum","q":"If an (A) does occur, another (B) arises.","ko":"(A)이(가) 정말 일어난다면, 또 다른 (B)이(가) 생긴다.","opts":["(A) accident / (B) problem","(A) accident / (B) holiday","(A) answer / (B) problem","(A) answer / (B) holiday","(A) example / (B) holiday"],"oko":["(A) 사고 / (B) 문제","(A) 사고 / (B) 휴일","(A) 대답 / (B) 문제","(A) 대답 / (B) 휴일","(A) 예시 / (B) 휴일"],"r":{"a":"1) (A) accident / (B) problem","ev":"13번 문장","s":[[13,"Besides, if an accident does occur, another problem arises.","게다가, 만약 사고가 정말 일어난다면, 또 다른 문제가 발생한다."]],"w":"13번에서 사고(accident)가 정말 일어나면 또 다른 문제(problem)가 생긴다고 해요.","c":1},"h":"3c73b56fc9"},{"n":10,"t":"fill","q":"In order to use self-driving cars [A], we need to think deeply about these [B].","ko":"자율 주행 자동차를 [A] 사용하기 위해, 우리는 이러한 [B]에 대해 깊게 생각해 봐야 한다.","bank":["successfully","issues","society","program","example","decision"],"bko":{"successfully":"성공적으로","issues":"문제들","society":"사회","program":"프로그램","example":"예시","decision":"결정"},"r":{"a":"[A] successfully (성공적으로), [B] issues (문제들)","ev":"15번 문장","s":[[15,"In order to use self-driving cars successfully, we need to think deeply about these issues.","자율 주행 자동차를 성공적으로 사용하기 위해, 우리는 이러한 문제에 대해 깊게 생각해 봐야 한다."]],"w":"15번에서 자율 주행 자동차를 성공적으로(successfully) 사용하려면 이러한 문제들(issues)에 대해 깊게 생각해야 한다고 해요.","c":null},"h":"dfc8cf4c59"}]},{"u":6,"id":"hk4-06-4","no":4,"ko":"그냥 버리면 안 돼!\b","items":[{"n":1,"t":"tf","q":"The chemicals in drugs don't decompose easily.","ko":"약 속의 화학 물질은 쉽게 분해되지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Unfortunately, the chemicals in the drugs don’t decompose easily.","불행하게도, 약 속의 화학 물질은 쉽게 분해되지 않는다."]],"w":"5번 문장에 the chemicals in the drugs don't decompose easily가 나와요.","c":"T"},"h":"ed1ce36f72"},{"n":2,"t":"tf","q":"The passage says it is fine to flush medicine down the toilet.","ko":"글은 약을 변기에 내려버려도 괜찮다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"You might probably throw it in the trash can or flush it down the toilet.","아마 그것을 쓰레기통에 버렸거나 변기에 내려버렸을 수도 있다."],[3,"However, you shouldn’t do either!","하지만, 둘 다 해서는 안 된다!"]],"w":"2번에서 변기에 내려버리는 방법이 나오지만, 3번에서 However, you shouldn't do either(둘 다 해서는 안 된다)라고 해요.","c":"F"},"h":"fcaf433a42"},{"n":3,"t":"tf","q":"Local pharmacies usually have boxes where you can discard drugs safely.","ko":"동네 약국에는 보통 안전하게 약을 버릴 수 있는 상자가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"They usually have boxes where you can discard drugs safely.","그곳에는 보통 안전하게 약을 버릴 수 있는 상자가 있다."]],"w":"12번 문장에 They usually have boxes where you can discard drugs safely가 나와요. They는 11번의 동네 약국이에요.","c":"T"},"h":"6a877f7b8f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Unfortunately, the chemicals in the drugs don't decompose easily.)","ko":"불행하게도, 약 속의 화학 물질은 쉽게 ( ) 않는다.","opts":["얼다","분해되다","폭발하다","자라다"],"word":"decompose","r":{"a":"2) 분해되다","ev":"5번 문장","s":[[5,"Unfortunately, the chemicals in the drugs don’t decompose easily.","불행하게도, 약 속의 화학 물질은 쉽게 분해되지 않는다."]],"w":"Unfortunately(불행하게도)로 안 좋은 소식이 오고, 6번에서 그래서 땅과 물에 오래 남는다고 해요. 쉽게 분해되지 않으니 오래 남는 거예요. decompose는 '분해되다'예요.","c":2},"h":"fe97593929"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If we keep drinking this contaminated water, it may harm our health.)","ko":"만약 우리가 계속해서 이 ( ) 물을 마신다면, 그것은 우리의 건강을 해칠 수도 있다.","opts":["깨끗한","차가운","오염된","따뜻한"],"word":"contaminated","r":{"a":"3) 오염된","ev":"9번 문장","s":[[9,"If we keep drinking this contaminated water, it may harm our health.","만약 우리가 계속해서 이 오염된 물을 마신다면, 그것은 우리의 건강을 해칠 수도 있다."]],"w":"건강을 해칠 수도 있는 물이니 약이 섞인 더러운 물이에요(8번). contaminated는 '오염된'이에요.","c":3},"h":"ad4f38524e"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nYou can bring it to local pharmacies.","ko":"밑줄 친 it이 가리키는 것은?","sko":"당신은 그것을 동네 약국에 가져갈 수 있다.","opts":["쓰레기통","변기","오래된 약","식수"],"pron":"it","r":{"a":"3) 오래된 약","ev":"10~11번 문장","s":[[10,"So, how should we dispose of old medicine?","그래서, 우리는 어떻게 오래된 약을 처리해야 하는가?"],[11,"You can bring it to local pharmacies.","당신은 그것을 동네 약국에 가져갈 수 있다."]],"w":"10번에서 오래된 약(old medicine)을 어떻게 처리해야 하는지 물었어요. 11번의 it은 동네 약국에 가져갈 수 있는 바로 그 오래된 약이에요.","c":3,"k":"it = 오래된 약"},"h":"5d2fae50f8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Medicine disposed of this way eventually enters the environment.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 방식으로 처리된 약은 결국 자연환경으로 들어가게 된다.","opts":["이러한 방식으로 처리된 약은 결국 자연환경으로 들어가게 된다.","이러한 방식으로 처리된 약은 곧바로 사라진다.","이러한 방식으로 처리된 약은 자연환경에서 새로 만들어진다.","이러한 방식으로 약을 처리하면 환경이 깨끗해진다."],"r":{"a":"1) 이러한 방식으로 처리된 약은 결국 자연환경으로 들어가게 된다.","ev":"4번 문장","s":[[4,"Medicine disposed of this way eventually enters the environment.","이러한 방식으로 처리된 약은 결국 자연환경으로 들어가게 된다."]],"w":"disposed of this way는 '이런 방식으로 처리된'이고 eventually는 '결국'이에요. 약이 사라지는 게 아니라 결국 자연환경으로 들어간다는 뜻이에요.","c":1},"h":"251516a0ce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["호르몬 약은 암컷 물고기를 더 크게 만든다.","호르몬 약 속의 적은 양의 에스트로겐이 수컷 물고기를 암컷으로 바꿀 수 있다.","약 속의 에스트로겐은 암컷 물고기를 수컷으로 바꾼다.","호르몬 약은 물고기에게 아무런 영향을 주지 않는다."],"opts":["Hormone drugs make female fish bigger.","A small amount of estrogen in hormone drugs can change male fish into females.","Estrogen in drugs turns female fish into males.","Hormone drugs have no effect on fish."],"r":{"a":"2) A small amount of estrogen in hormone drugs can change male fish into females.","ev":"7번 문장","s":[[7,"For example, a small amount of estrogen in hormone drugs can change male fish into females!","예를 들어, 호르몬 약에 있는 적은 양의 에스트로겐은 수컷 물고기를 암컷으로 바꿀 수 있다!"]],"w":"7번에서 호르몬 약에 있는 적은 양의 에스트로겐이 수컷 물고기를 암컷으로 바꿀 수 있다고 해요. 암컷과 수컷을 바꿔 쓴 선지가 함정이에요.","c":2},"h":"707c27fb48"},{"n":9,"t":"sum","q":"If medicine is not (A) out, it can (B) into our drinking water.","ko":"약이 (A) 않으면, 그것은 우리의 식수로 (B) 수 있다.","opts":["(A) filtered / (B) flow","(A) filtered / (B) climb","(A) sold / (B) flow","(A) sold / (B) climb","(A) dried / (B) climb"],"oko":["(A) 걸러지지 / (B) 흘러들어올","(A) 걸러지지 / (B) 기어오를","(A) 팔리지 / (B) 흘러들어올","(A) 팔리지 / (B) 기어오를","(A) 말라 버리지 / (B) 기어오를"],"r":{"a":"1) (A) filtered / (B) flow","ev":"8번 문장","s":[[8,"Also, medicine that isn’t filtered out can flow into our drinking water.","또한, 여과되지 않은 약이 우리의 식수로 흘러들어올 수 있다."]],"w":"8번에서 여과되지 않은(isn't filtered out) 약이 우리의 식수로 흘러들어올(flow into) 수 있다고 해요.","c":1},"h":"3ade718494"},{"n":10,"t":"fill","q":"So, they [A] in the ground and water for a long time, damaging the surrounding [B].","ko":"그래서, 그것들은 주변의 [B]을(를) 해치면서, 긴 시간 동안 땅이나 물속에 [A].","bank":["remain","ecosystem","bring","harm","estrogen","toilet"],"bko":{"remain":"남아 있다","ecosystem":"생태계","bring":"가져가다","harm":"해치다","estrogen":"에스트로겐","toilet":"변기"},"r":{"a":"[A] remain (남아 있다), [B] ecosystem (생태계)","ev":"6번 문장","s":[[6,"So, they remain in the ground and water for a long time, damaging the surrounding ecosystem.","그래서, 그것들은 주변의 생태계를 해치면서, 긴 시간 동안 땅이나 물속에 남아 있게 된다."]],"w":"6번에서 약의 화학 물질은 긴 시간 동안 땅과 물속에 남아 있으면서(remain) 주변의 생태계(ecosystem)를 해친다고 해요.","c":null},"h":"5154ade52d"}]},{"u":7,"id":"hk4-07-1","no":1,"ko":"잃어버린 턱을 찾아서\b","items":[{"n":1,"t":"tf","q":"Mewing is a tongue exercise named after Dr. John Mew.","ko":"뮤잉은 John Mew 박사의 이름을 따서 이름 지어진 혀 운동이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Thus, he developed a tongue exercise called mewing, named after himself.","따라서, 그는 자신의 이름을 따서 이름 지어진 뮤잉이라고 불리는 혀 운동을 개발했다."]],"w":"4번 문장에서 박사가 mewing이라는 혀 운동을 개발했고, 자신의 이름을 따서(named after himself) 지었다고 해요.","c":"T"},"h":"ddc947b04f"},{"n":2,"t":"tf","q":"In mewing, the tongue should touch the upper teeth.","ko":"뮤잉에서는 혀가 윗니에 닿아야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Make sure it doesn’t touch the upper teeth.","반드시 혀가 윗니에 닿지 않도록 해라."]],"w":"6번 문장은 혀가 윗니에 닿지 않게 하라(doesn’t touch the upper teeth)고 해요. 닿아야 한다는 말은 반대예요.","c":"F"},"h":"57bb7e0632"},{"n":3,"t":"tf","q":"Dr. Mew believed that the problems could be corrected without surgery.","ko":"Mew 박사는 그 문제들이 수술 없이 교정될 수 있다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He believed that such problems could be corrected without surgery.","그는 그러한 문제가 수술 없이 교정될 수 있다고 믿었다."]],"w":"3번 문장 He believed that such problems could be corrected without surgery와 같은 내용이에요.","c":"T"},"h":"51e96d9c9b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…could result in a short chin or an uneven face.)","ko":"…짧은 턱 또는 ( ) 얼굴을 야기할 수 있었다.","opts":["평평한","비대칭인","깨끗한","둥근"],"word":"uneven","r":{"a":"2) 비대칭인","ev":"2번 문장","s":[[2,"For example, placing the tongue on the bottom of the mouth could result in a short chin or an uneven face.","예를 들어, 혀를 입의 바닥에 두는 것은 짧은 턱 또는 비대칭인 얼굴을 야기할 수 있었다."]],"w":"2번에서 혀를 입 바닥에 두는 나쁜 습관이 짧은 턱이나 uneven 얼굴로 이어진다고 해요. 좋지 않은 결과로 나온 말이라 '비대칭인, 고르지 않은'이 알맞아요. 10번의 even(고른)과 반대되는 말이에요.","c":2},"h":"39e3c55ee6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He believed that such problems could be corrected without surgery.)","ko":"그는 그러한 문제가 수술 없이 ( ) 수 있다고 믿었다.","opts":["교정될","설명될","발견될","금지될"],"word":"corrected","r":{"a":"1) 교정될","ev":"3번 문장","s":[[3,"He believed that such problems could be corrected without surgery.","그는 그러한 문제가 수술 없이 교정될 수 있다고 믿었다."]],"w":"수술 없이 문제를 '바로잡을' 수 있다는 내용이에요. could be corrected = 교정될 수 있다. correct = 교정하다.","c":1},"h":"a796b0eeeb"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis can strengthen facial muscles, help keep your teeth even, and change the shape of your face.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 얼굴 근육을 강화하고, 치아를 고르게 유지하는 데 도움이 되고, 얼굴 모양을 바꿀 수 있다.","opts":["수술을 받는 것","어린 시절의 나쁜 습관","혀, 입술, 볼의 근육을 쓰는 뮤잉","혀를 입의 바닥에 두는 것"],"r":{"a":"3) 혀, 입술, 볼의 근육을 쓰는 뮤잉","ev":"9~10번 문장","s":[[9,"During mewing, you use the muscles on your tongue, lips and cheeks.","뮤잉을 하는 동안, 당신은 혀, 입술, 그리고 볼에 있는 근육을 쓴다."],[10,"This can strengthen facial muscles, help keep your teeth even, and change the shape of your face.","이것은 얼굴 근육을 강화하고, 치아를 고르게 유지하는 데 도움이 되고, 얼굴 모양을 바꿀 수 있다."]],"w":"9번에서 뮤잉을 하는 동안 혀, 입술, 볼의 근육을 쓴다고 했어요. 10번의 This는 그것(근육을 쓰는 뮤잉)이 얼굴 근육을 강화한다는 말이에요.","c":3},"h":"180cc59a34"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For the best results, you should do this whenever your mouth is closed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"최상의 결과를 위해서, 당신은 이것을 입이 다물어져 있을 때마다 해야 한다.","opts":["입을 크게 벌릴 때에만 뮤잉을 해야 한다.","하루에 한 번만 뮤잉을 하면 충분하다.","입이 다물어져 있을 때마다 뮤잉을 하는 것이 가장 좋다.","입을 다물면 뮤잉을 멈춰야 한다."],"r":{"a":"3) 입이 다물어져 있을 때마다 뮤잉을 하는 것이 가장 좋다.","ev":"8번 문장","s":[[8,"For the best results, you should do this whenever your mouth is closed.","최상의 결과를 위해서, 당신은 이것을 입이 다물어져 있을 때마다 해야 한다."]],"w":"whenever는 '~할 때마다'예요. 입이 다물어져 있을 때마다 하는 것이 가장 좋은 결과를 낸다는 뜻이에요.","c":3},"h":"4d8129229f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["얼굴 구조에 관한 많은 문제는 어린 시절의 나쁜 습관에서 비롯되었다.","얼굴 구조의 문제는 늘 타고나는 것이고 절대 변하지 않는다.","Mew 박사는 어린 시절의 습관이 얼굴과 아무 상관이 없다는 것을 발견했다.","Mew 박사는 얼굴 문제가 설탕을 너무 많이 먹어서 생긴다고 생각했다."],"opts":["Many problems with facial structure came from bad habits in childhood.","Problems with facial structure are always born with the child and never change.","Dr. Mew found that childhood habits have nothing to do with the face.","Dr. Mew thought that facial problems were caused by eating too much sugar."],"r":{"a":"1) Many problems with facial structure came from bad habits in childhood. (얼굴 구조에 관한 많은 문제는 어린 시절의 나쁜 습관에서 비롯되었다.)","ev":"1번 문장","s":[[1,"Dr. John Mew was surprised to find that many problems with facial structure resulted from bad habits during childhood.","John Mew 박사는 얼굴 구조에 관한 많은 문제가 어린 시절 동안의 나쁜 습관에서 비롯되었다는 것을 발견해서 놀랐다."]],"w":"1번에서 얼굴 구조에 관한 많은 문제가 어린 시절의 나쁜 습관에서 비롯되었다(resulted from bad habits during childhood)고 해요.","c":1},"h":"234ed38d93"},{"n":9,"t":"sum","q":"Mewing works especially well on (A) whose bones are still growing, but even some (B) say it works for them.","ko":"뮤잉은 뼈가 아직 자라고 있는 (A)에게 특히 효과가 좋지만, 일부 (B)도 자신에게 효과가 있다고 말한다.","oko":["(A) 어린아이 / (B) 의사","(A) 성인 / (B) 어린아이","(A) 어린아이 / (B) 성인","(A) 치과의사 / (B) 환자","(A) 성인 / (B) 의사"],"opts":["(A) children / (B) doctors","(A) adults / (B) children","(A) children / (B) adults","(A) dentists / (B) patients","(A) adults / (B) doctors"],"r":{"a":"3) (A) children / (B) adults","ev":"11~12번 문장","s":[[11,"Mewing is especially effective on young children whose bones are still growing.","뮤잉은 특히 뼈가 아직 자라고 있는 어린아이들에게 효과적이다."],[12,"But even some adults say that mewing works well on them, too!","하지만 일부 성인들은 뮤잉이 그들에게도 상당히 효과가 있다고 말한다!"]],"w":"11번에서 뼈가 자라는 어린아이에게 특히 효과적이라고 하고, 12번에서 But 일부 성인도 효과가 있다고 말한다고 해요.","c":3},"h":"03d8862307"},{"n":10,"t":"fill","q":"Then, close the [A] while keeping the upper and lower teeth [B].","ko":"그 다음, 윗니와 아랫니가 서로 [B] 있도록 유지하면서 [A]을(를) 다물어라.","bank":["lips","apart","chin","bones","surgery","cheeks"],"bko":{"lips":"입술","apart":"떨어져","chin":"턱","bones":"뼈","surgery":"수술","cheeks":"볼"},"r":{"a":"[A] lips (입술), [B] apart (떨어져)","ev":"7번 문장","s":[[7,"Then, close the lips while keeping the upper and lower teeth apart.","그 다음, 윗니와 아랫니를 떨어뜨린 상태를 유지하면서 입술을 다물어라."]],"w":"7번에서 윗니와 아랫니를 떨어뜨린(apart) 상태를 유지하면서 입술(lips)을 다물라고 해요.","c":null},"h":"6ec5761051"}]},{"u":7,"id":"hk4-07-2","no":2,"ko":"세상에 비밀은 없다\b","items":[{"n":1,"t":"tf","q":"Nate was removed from the football team because of his social media account.","ko":"Nate는 그의 소셜 미디어 계정 때문에 미식축구팀에서 제외되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He was removed from the football team because of his social media account!","그는 그의 소셜 미디어 계정 때문에 미식축구팀에서 제외되었다!"]],"w":"3번 문장에서 He was removed from the football team because of his social media account라고 해요.","c":"T"},"h":"3836ae1e45"},{"n":2,"t":"tf","q":"Nate left the university because he was not a good player.","ko":"Nate는 뛰어난 선수가 아니어서 대학을 떠났다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Although he was a good player, it made Cornell worry about his personality, and he had to leave the university.","비록 그는 뛰어난 선수였지만, 이것은 코넬 대학이 그의 인성에 대해 우려하도록 만들었고, 그는 대학을 떠나야 했다."]],"w":"5번 문장은 Although he was a good player(뛰어난 선수였지만)라고 해요. 인성에 대한 우려 때문에 떠난 거라서 실력 때문이라는 말은 틀려요.","c":"F"},"h":"f5e68687f8"},{"n":3,"t":"tf","q":"When a person applies for a U.S. visa, the government collects social media information.","ko":"미국 비  존재인지 아닌지 판단하기 위해 이용한다."]],"w":"11번에서 비자를 신청하면 the government(정부)가 소셜 미디어 정보를 수집한다고 했고, 12번의 It은 그 정부예요.","c":2},"h":"bb2bb7c170"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Such content can take away job opportunities.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러한 콘텐츠는 취업 기회를 없앨 수 있다.","opts":["그런 게시글은 취업 기회를 잃게 만들 수 있다.","그런 게시글은 취업 기회를 더 늘려 준다.","그런 게시글은 취업 기회와 아무 상관이 없다.","그런 게시글을 올리면 회사가 월급을 올려 준다."],"r":{"a":"1) 그런 게시글은 취업 기회를 잃게 만들 수 있다.","ev":"8~9번 문장","s":[[8,"They search the applicants’ accounts for things like photos with inappropriate behavior and negative posts about race, gender, or religion.","그들은 부적절한 행동을 한 사진과 인종, 성별 또는 종교에 관한 부정적인 게시글과 같은 것들에 대해 지원자들의 계정을 살펴본다."],[9,"Such content can take away job opportunities.","그러한 콘텐츠는 취업 기회를 없앨 수 있다."]],"w":"take away는 '없애다, 가져가다'예요. 부적절한 게시글(8번)은 취업 기회를 없앨 수 있다는 뜻이에요.","c":1},"h":"2446cbaf07"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고용주의 7퍼센트만 소셜 미디어를 본다.","고용주는 소셜 미디어를 전혀 보지 않는다.","고용주의 70퍼센트가 채용 과정에서 소셜 미디어로 구직자를 심사한다.","고용주는 사진만 보고 글은 보지 않는다."],"opts":["Only 7% of employers use social media for hiring.","Employers never check social media.","70% of employers use social media to review job applicants.","Employers look only at photos, not posts."],"r":{"a":"3) 70% of employers use social media to review job applicants.","ev":"7~8번 문장","s":[[7,"In fact, 70% of employers use social media to review job applicants during their hiring process.","실제로, 고용주들의 70퍼센트가 채용 과정 동안 구직자들을 심사하기 위해 소셜 미디어를 이용한다."],[8,"They search the applicants’ accounts for things like photos with inappropriate behavior and negative posts about race, gender, or religion.","그들은 부적절한 행동을 한 사진과 인종, 성별 또는 종교에 관한 부정적인 게시글과 같은 것들에 대해 지원자들의 계정을 살펴본다."]],"w":"7번에서 고용주의 70%가 채용 과정 동안 소셜 미디어로 구직자를 심사한다고 해요. 8번에는 사진뿐 아니라 부정적인 게시글도 살펴본다고 나와요.","c":3},"h":"437d2b6d58"},{"n":9,"t":"sum","q":"Socially (A) posts can be (B) to visiting the country.","ko":"사회적으로 (A) 게시글은 그 나라를 방문하는 데 (B)이( ipants put on a VR headset and completed several tasks in a virtual 10-story shopping mall.","치료 동안, 참가자들은 VR 헤드셋을 착용했고 가상의 10층짜리 쇼핑몰에서 몇 가지 과제를 완료했다."]],"w":"5번 문장은 virtual 10-story shopping mall(가상의 10층짜리 쇼핑몰)이라고 해요. 실제 건물도, 2층도 아니에요.","c":"F"},"h":"cae2950f08"},{"n":3,"t":"tf","q":"The tasks were designed to be fun to help people overcome their fear.","ko":"과제는 사람들이 공포를 이겨내도록 돕기 위해 재미있도록 설계되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The tasks were designed to be fun to help people overcome their fear more easily.","과제는 사람들이 공포를 더 쉽게 이겨내도록 돕기 위해 재미있도록 설계되었다."]],"w":"6번 문장 The tasks were designed to be fun to help people overcome their fear more easily와 같은 내용이에요.","c":"T"},"h":"022a1f2f74"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…help people overcome their fear more easily.)","ko":"과제는 사람들이 공포를 더 쉽게 ( ) 돕기 위해 재미있도록 설계되었다.","opts":["키우도록","이겨내도록","숨기도록","잊어버리도록"],"word":"overcome","r":{"a":"2) 이겨내도록","ev":"6번 문장","s":[[6,"The tasks were designed to be fun to help people overcome their fear more easily.","과제는 사람들이 공포를 더 쉽게 이겨내도록 돕기 위해 재미있도록 설계되었다."]],"w":"과제를 재미있게 만든 목적은 공포를 더 쉽게 '이겨내도록' 돕는 거예요. overcome = 이겨내다, 극복하다.","c":2},"h":"d5447c1fc1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…they involved rescuing a cat from a tree…)","ko":"…나무에서 고양이를 ( ) 것…","opts":["그리는","키우는","구출하는","팔아 주는"],"word":"rescuing","r":{"a":"3) 구출하는","ev":"7번 문장","s":[[7,"For example, they involved rescuing a cat from a tree, walking across a rope bridge, or even riding a flying whale!","예를 들어, 그것들은 나무에서 고양이를 구출하는 것, 밧줄로 된 다리를 걸어서 건너는 것, 또는 심지어 나는 고래를 타는 것을 포함했다!"]],"w":"나무에서 고양이를 어떻게 하는 과제인지 생각해 보세요. 나무 위에 있는 고양이를 도와 내려오게 하는 것이라 rescue는 '구출하다'예요.","c":3},"h":"03902d50c0"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAfter the final session, about 70% of them said that they were much less afraid!","ko":"밑줄 친 them이 가리키는 것은?","sko":"마지막 활동 후에, 그들의 약 70퍼센트가 훨씬 덜 두려워한다고 말했다!","opts":["연구원들","과제들","참가자들","쇼핑몰의 손님들"],"r":{"a":"3) 참가자들","ev":"9~10번 문장","s":[[9,"In this way, they went through 30-minute VR treatment sessions over two weeks.","이 방식으로, 그들은 2주에 걸쳐서 30분짜리 VR 치료 활동들을 끝마쳤다."],[10,"After the final session, about 70% of them said that they were much less afraid!","마지막 활동 후에, 그들의 약 70퍼센트가 훨씬 덜 두려워한다고 말했다!"]],"w":"두려움이 줄었다고 말한 사람들은 치료 활동을 끝마친 참가자들이에요. 9번의 they(참가자들)를 10번에서 them으로 받았어요.","c":3},"h":"7db72321ad"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Once the participants succeeded in one task, they would go up to a higher floor and start another.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"일단 참가자들이 한 과제에 성공했다면, 그들은 더 높은 층으로 올라가서 또 하나의 과제를 시작할 것이다.","opts":["한 과제에 실패하면 1층으로 돌아가서 처음부터 다시 한다.","모든 과제를 한 층에서 한꺼번에 끝낸다.","과제에 성공하면 쇼핑몰 밖으로 나가서 치료를 마친다.","한 과제에 성공하면 더 높은 층에서 다른 과제를 시작한다."],"r":{"a":"4) 한 과제에 성공하면 더 높은 층에서 다른 과제를 시작한다.","ev":"8번 문장","s":[[8,"Once the participants succeeded in one task, they would go up to a higher floor and start another.","일단 참가자들이 한 과제에 성공했다면, 그들은 더 높은 층으로 올라가서 또 하나의 과제를 시작할 것이다."]],"w":"Once는 '일단 ~하면'이에요. 한 과제에 성공하고 나면 더 높은 층으로 올라가 다른 과제를 시작하는 거예요.","c":4},"h":"200042c935"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["치료는 30분짜리 활동으로 2주에 걸쳐 진행되었다.","치료는 하루에 30분씩 일 년 동안 진행되었다.","치료는 한 번의 3시간짜리 활동으로 끝났다.","치료는 2주 동안 하루에 30시간씩 진행되었다."],"opts":["The treatment took 30-minute sessions over two weeks.","The treatment took 30 minutes a day for a year.","The treatment was a single three-hour session.","The treatment took 30 hours a day for two weeks."],"r":{"a":"1) The treatment took 30-minute sessions over two weeks.","ev":"9번 문장","s":[[9,"In this way, they went through 30-minute VR treatment sessions over two weeks.","이 방식으로, 그들은 2주에 걸쳐서 30분짜리 VR 치료 활동들을 끝마쳤다."]],"w":"9번에서 30-minute VR treatment sessions를 2주에 걸쳐(over two weeks) 끝마쳤다고 해요.","c":1},"h":"eb7cca6d45"},{"n":9,"t":"sum","q":"Researchers tested their VR program on (A) who had been (B) from the fear of heights for decades.","ko":"연구원들은 수십 년 동안 고소공포증으로 (B) 온 (A)에게 VR 프로그램을 시험했다.","opts":["(A) volunteers / (B) suffering","(A) volunteers / (B) resting","(A) doctors / (B) suffering","(A) doctors / (B) dancing","(A) students / (B) resting"],"oko":["(A) 지원자 / (B) 고통받아","(A) 지원자 / (B) 쉬어","(A) 의사 / (B) 고통받아","(A) 의사 / (B) 춤춰","(A) 학생 / (B) 쉬어"],"r":{"a":"1) (A) volunteers / (B) suffering","ev":"4번 문장","s":[[4,"They tested their program on volunteers who had been suffering from it for decades.","그들은 수십 년 동안 고소공포증을 앓아 왔던 지원자들에게 프로그램을 시험해보았다."]],"w":"4번에서 연구원들은 수십 년 동안 고소공포증으로 고통받아 온(had been suffering) 지원자들(volunteers)에게 프로그램을 시험했다고 해요.","c":1},"h":"f7418f73ec"},{"n":10,"t":"fill","q":"It isn’t easy to treat this phobia, but a very [A] [B] has been found.","ko":"이 공포증을 치료하기는 쉽지 않지만, 매우 [A] [B]이(가) 발견되었다.","bank":["effective","solution","virtual","afraid","decade","mall"],"bko":{"effective":"효과적인","solution":"해결책","virtual":"가상의","afraid":"두려워하는","decade":"10년","mall":"쇼핑몰"},"r":{"a":"[A] effective (효과적인), [B] solution (해결책)","ev":"2번 문장","s":[[2,"It isn’t easy to treat this phobia, but a very effective solution has been found.","이 공포증을 치료하기는 쉽지 않지만, 매우 효과적인 해결책이 발견되었다."]],"w":"2번에서 이 공포증을 치료하기는 쉽지 않지만, 매우 효과적인(effective) 해결책(solution)이 발견되었다고 해요.","c":null},"h":"3299ba4fe7"}]},{"u":7,"id":"hk4-07-4","no":4,"ko":"1,000억짜리 계란\b","items":[{"n":1,"t":"tf","q":"In Zimbabwe in 2008, three eggs cost 100 billion dollars.","ko":"2008년 짐바브웨에서는 계란 세 알이 1,000억 달러였다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"But, what if you couldn’t even buy an egg because three eggs cost 100 billion dollars?","하지만, 만약 계란 세 알이 1,000억 달러이기 때문에 계란 한 알조차 살 수 없다면 어떨까?"],[4,"In 2008, this actually happened in Zimbabwe.","2008년에, 이것은 짐바브웨에서 실제로 일어났다."]],"w":"3번에서 계란 세 알이 1,000억 달러라면 어떨까라고 물었고, 4번에서 이 일이 2008년 짐바브웨에서 실제로 일어났다고 해요.","c":"T"},"h":"9a73d37f23"},{"n":2,"t":"tf","q":"Zimbabwe has never been a rich country in Africa.","ko":"짐바브웨는 아프리카에서 부유한 나라였던 적이 한 번도 없다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Zimbabwe was once one of the richest countries in Africa.","짐바브웨는 한때 아프리카에서 가장 부유한 나라들 중 하나였다."]],"w":"5번에서 짐바브웨는 한때 아프리카에서 가장 부유한 나라들 중 하나(once one of the richest countries)였다고 해요.","c":"F"},"h":"02b65144e6"},{"n":3,"t":"tf","q":"People used one-billion-dollar bills as firewood and wallpaper.","ko":"사람들은 10억 달러짜리 지폐를 장작과 벽지로 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"In the end, people used one-billion-dollar bills as firewood, wallpaper, and even toilet paper.","결국, 사람들은 10억 달러짜리 지폐를 장작, 벽지, 그리고 심지어 휴지로 사용했다."]],"w":"13번 문장에 지폐를 장작(firewood), 벽지(wallpaper), 휴지로 썼다고 나와요.","c":"T"},"h":"24d5194b72"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…severe droughts sharply reduced crop production.)","ko":"…( ) 가뭄이 작물 생산량을 급격히 감소시킨 것이다.","opts":["극심한","부드러운","짧은","귀중한"],"word":"severe","r":{"a":"1) 극심한","ev":"7번 문장","s":[[7,"The first of these reasons is that severe droughts sharply reduced crop production.","이러한 이유 중 첫 번째는 극심한 가뭄이 작물 생산량을 급격히 감소시킨 것이다."]],"w":"가뭄 때문에 작물 생산량이 급격히 줄었다고 했으니 가뭄이 아주 심했다는 뜻이에요. severe = 극심한, 심각한.","c":1},"h":"b2bfe5217e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…as the money became less valuable.)","ko":"…돈이 덜 ( ) 됨에 따라…","opts":["위험한","놀라운","불필요한","가치 있는"],"word":"valuable","r":{"a":"4) 가치 있는","ev":"11번 문장","s":[[11,"Unfortunately, this only made matters worse, as the money became less valuable.","유감스럽게도, 돈이 덜 가치 있게 됨에 따라, 이것은 문제가 더 악화되도록 만들기만 했다."]],"w":"돈을 더 많이 발행하면 돈 한 장의 값어치가 떨어져요. less valuable은 '덜 가치 있는'이에요. 12번에서 물가가 급격히 올랐다는 것도 같은 흐름이에요.","c":4},"h":"bd13f2b5ac"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nBut its economy began to decline in the late 1990s for several reasons.","ko":"밑줄 친 its이 가리키는 것은?","sko":"하지만 1990년대 후반에 몇 가지 이유로 경제가 쇠퇴하기 시작했다.","opts":["아프리카 대륙","짐바브웨","국가 부채","정부"],"pron":"its","r":{"a":"2) 짐바브웨","ev":"5~6번 문장","s":[[5,"Zimbabwe was once one of the richest countries in Africa.","짐바브웨는 한때 아프리카에서 가장 부유한 나라들 중 하나였다."],[6,"But its economy began to decline in the late 1990s for several reasons.","하지만 1990년대 후반에 몇 가지 이유로 경제가 쇠퇴하기 시작했다."]],"w":"5번에서 짐바브웨(Zimbabwe)가 한때 아프리카에서 가장 부유한 나라들 중 하나였다고 했어요. 6번의 its economy는 짐바브웨의 경제예요.","c":2,"k":"its = 짐바브웨"},"h":"4fee6c278a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, the country became short of money.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 결과, 그 나라는 돈이 부족해졌다.","opts":["그 결과 그 나라는 돈이 너무 많아졌다.","그 결과 그 나라는 가뭄이 사라졌다.","그 결과 그 나라는 돈이 모자라게 되었다.","그 결과 그 나라는 다른 나라에 돈을 빌려주었다."],"r":{"a":"3) 그 결과 그 나라는 돈이 모자라게 되었다.","ev":"8~9번 문장","s":[[8,"Furthermore, economic policy failures and political corruption increased the national debt.","게다가, 경제 정책 실패와 정치적 부패가 국가 부채를 증가시켰다."],[9,"As a result, the country became short of money.","그 결과, 그 나라는 돈이 부족해졌다."]],"w":"short of money는 '돈이 부족한'이에요. 가뭄으로 작물이 줄고(7번) 정책 실패와 부패로 빚이 늘어서(8번) 나라에 돈이 부족해졌어요.","c":3},"h":"8011100667"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["정부는 돈을 줄여서 문제를 해결하려고 했다.","정부는 지폐를 모두 없애서 문제를 해결하려고 했다.","정부는 외국에서 돈을 빌려서 문제를 해결하려고 했다.","정부는 더 많은 돈을 발행해서 문제를 해결하려고 했다."],"opts":["The government tried to solve the problem by reducing money.","The government tried to solve the problem by removing all bills.","The government tried to solve the problem by borrowing money from other countries.","The government tried to solve the problem by printing more money."],"r":{"a":"4) The government tried to solve the problem by printing more money.","ev":"10번 문장","s":[[10,"The government tried to solve the problem by printing more money and creating larger bills.","정부는 더 많은 돈을 발행하고 더 큰 금액의 지폐를 만듦으로써 문제를 해결하려고 노력했다."]],"w":"10번에서 정부는 더 많은 돈을 발행하고(printing more money) 더 큰 금액의 지폐를 만들어서 문제를 해결하려고 했어요.","c":4},"h":"e50a935d8e"},{"n":9,"t":"sum","q":"Economic policy failures and political (A) increased the national (B).","ko":"경제 정책 실패와 정치적 (A)이(가) 국가 (B)을(를) 증가시켰다.","opts":["(A) corruption / (B) debt","(A) corruption / (B) song","(A) friendship / (B) debt","(A) friendship / (B) song","(A) weather / (B) song"],"oko":["(A) 부패 / (B) 부채","(A) 부패 / (B) 노래","(A) 우정 / (B) 부채","(A) 우정 / (B) 노래","(A) 날씨 / (B) 노래"],"r":{"a":"1) (A) corruption / (B) debt","ev":"8번 문장","s":[[8,"Furthermore, economic policy failures and political corruption increased the national debt.","게다가, 경제 정책 실패와 정치적 부패가 국가 부채를 증가시켰다."]],"w":"8번에서 경제 정책 실패와 정치적 부패(corruption)가 국가 부채(debt)를 증가시켰다고 해요.","c":1},"h":"9141bb86a5"},{"n":10,"t":"fill","q":"You might think about buying a [A] sports car or perhaps a private [B] to travel around the world!","ko":"당신은 [A] 스포츠카 또는 어쩌면 전 세계를 여행하기 위한 전용 [B]을(를) 사는 것을 생각할지도 모른다!","bank":["luxurious","jet","national","political","drought","firewood"],"bko":{"luxurious":"값비싼(고급스러운)","jet":"제트기","national":"국가의","political":"정치적인","drought":"가뭄","firewood":"장작"},"r":{"a":"[A] luxurious (값비싼(고급스러운)), [B] jet (제트기)","ev":"2번 문장","s":[[2,"You might think about buying a luxurious sports car or perhaps a private jet to travel around the world!","당신은 값비싼 스포츠카 또는 어쩌면 전 세계를 여행하기 위한 전용기를 사는 것을 생각할지도 모른다!"]],"w":"2번에서 10억 달러가 있으면 값비싼(luxurious) 스포츠카나 전용 제트기(private jet)를 살 생각을 할지도 모른다고 해요.","c":null},"h":"7dc2c0be7f"}]},{"u":8,"id":"hk4-08-1","no":1,"ko":"당신의 취향을 저격해 드립니다\b","items":[{"n":1,"t":"tf","q":"John clicks the advertisement and buys the shoes.","ko":"John은 그 광고를 클릭해서 그 신발을 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Eventually, John clicks the advertisement and buys the shoes.","마침내, John은 그 광고를 클릭해서 그 신발을 산다."]],"w":"5번 문장에서 마침내 John이 광고를 클릭해서 신발을 산다고 해요.","c":"T"},"h":"9e1cb33428"},{"n":2,"t":"tf","q":"John buys the running shoes right after searching for them at the first online shopping mall.","ko":"John은 첫 번째 온라인 쇼핑몰에서 러닝화를 검색한 직후 바로 산다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"He searches for them on an online shopping mall but decides not to buy them.","그는 그것들을 온라인 쇼핑몰에서 검색하지만 사지 않기로 결정한다."]],"w":"2번 문장은 검색하지만 사지 않기로 결정한다(decides not to buy them)고 해요. 산 것은 광고를 여러 번 본 뒤(5번)예요.","c":"F"},"h":"7ee77c14eb"},{"n":3,"t":"tf","q":"Programmatic advertising shows the same advertisement to everyone.","ko":"프로그래매틱 광고는 모든 사람에게 같은 광고를 보여준다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"Since advertisements are selectively shown to those who are more likely to buy the goods, the results are quite effective.","광고가 상품을 살 가능성이 더 높은 사람들에게 선택적으로 보이기 때문에, 결과는 꽤 효과적이다."]],"w":"13번에서 광고는 상품을 살 가능성이 더 높은 사람들에게 선택적으로(selectively) 보인다고 해요. 모든 사람에게 같은 광고를 보여주는 것이 아니에요.","c":"F"},"h":"6632796fda"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…you might have wondered why you see the same advertisement…)","ko":"…당신은 왜 같은 광고를 다양한 웹사이트에서 보는지 ‘( )’ 적이 있을 수도 있다.","opts":["잊었던","자랑했던","궁금했던","싫어했던"],"word":"wondered","r":{"a":"3) 궁금했던","ev":"7번 문장","s":[[7,"If so, you might have wondered why you see the same advertisement on different websites.","만약 그렇다면, 당신은 왜 같은 광고를 다양한 웹사이트에서 보는지 궁금했을 수도 있다."]],"w":"7번은 같은 광고를 여러 웹사이트에서 보는 이유를 묻는 말이에요. why 이하가 궁금한 내용이라 wonder는 '궁금하다'예요.","c":3},"h":"541d860532"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the program analyzes your interests and preferences.)","ko":"…프로그램은 당신의 관심사와 선호도를 ( ).","opts":["분석한다","삭제한다","복사한다","판매한다"],"word":"analyzes","r":{"a":"1) 분석한다","ev":"11번 문장","s":[[11,"By using these cookies, the program analyzes your interests and preferences.","이 쿠키를 사용하여, 프로그램은 당신의 관심사와 선호도를 분석한다."]],"w":"11번은 프로그램이 쿠키를 이용해 내 관심사와 선호도를 살펴보는 내용이에요. 그 결과로 12번에서 알맞은 광고를 보여주므로 analyze는 '분석하다'예요.","c":1},"h":"1b280af285"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThen it shows the best advertisements for you.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그 다음 그것은 당신을 위한 최고의 광고를 보여준다.","opts":["인터넷 쿠키","광고를 소비자와 연결하는 자동 프로그램","당신의 기기","John"],"r":{"a":"2) 광고를 소비자와 연결하는 자동 프로그램","ev":"11~12번 문장","s":[[11,"By using these cookies, the program analyzes your interests and preferences.","이 쿠키를 사용하여, 프로그램은 당신의 관심사와 선호도를 분석한다."],[12,"Then it shows the best advertisements for you.","그 다음 그것은 당신을 위한 최고의 광고를 보여준다."]],"w":"11번의 주어 the program(프로그램)이 쿠키로 관심사를 분석하고, 12번의 it은 그 프로그램이에요. 쿠키는 분석에 쓰이는 재료예요.","c":2,"k":"it = 광고를 소비자와 연결하는 자동 프로그램"},"h":"eb0874717e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A few minutes later, he goes on another website, where he sees an advertisement for those shoes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"몇 분 뒤에, 그는 다른 웹사이트에 들어가는데, 이곳에서 그는 그 신발에 대한 광고를 본다.","opts":["몇 분 뒤 그는 다른 웹사이트에 들어가서 그 신발의 광고를 본다.","몇 분 뒤 그는 그 신발을 가게에서 직접 산다.","몇 분 뒤 그는 같은 웹사이트에서 신발 광고를 처음 본다.","몇 분 뒤 그는 다른 웹사이트에서 신발 광고를 하나도 보지 못한다."],"r":{"a":"1) 몇 분 뒤 그는 다른 웹사이트에 들어가서 그 신발의 광고를 본다.","ev":"3번 문장","s":[[3,"A few minutes later, he goes on another website, where he sees an advertisement for those shoes.","몇 분 뒤에, 그는 다른 웹사이트에 들어가는데, 이곳에서 그는 그 신발에 대한 광고를 본다."]],"w":"a few minutes later는 몇 분 뒤라는 뜻이고, another website(다른 웹사이트)에서 그 신발의 광고를 본다는 내용이에요.","c":1},"h":"392cdb2cac"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["John은 자신이 방문하는 웹사이트에서 같은 광고를 몇 번이고 본다.","John은 웹사이트마다 다른 광고를 본다.","John은 첫 번째 쇼핑몰을 떠난 뒤에는 광고를 전혀 보지 못한다.","John은 첫 번째 쇼핑몰 이후 웹사이트를 하나만 방문한다."],"opts":["John notices the same advertisement again and again on the websites he visits.","John sees a different advertisement on every website.","John does not see any advertisement after leaving the first shopping mall.","John visits only one website after the first mall."],"r":{"a":"1) John notices the same advertisement again and again on the websites he visits. (John은 자신이 방문하는 웹사이트에서 같은 광고를 몇 번이고 본다.)","ev":"4번 문장","s":[[4,"He visits several others and notices the same advertisement again and again.","그는 몇몇 다른 웹사이트를 방문하고 같은 광고를 몇 번이고 본다."]],"w":"4번에서 John은 몇몇 다른 웹사이트를 방문하고 같은 광고를 몇 번이고(again and again) 본다고 해요.","c":1},"h":"c96bc1185c"},{"n":9,"t":"sum","q":"Every time you search online, Internet (A) are created and stored on your (B).","ko":"온라인에서 검색할 때마다, 인터넷 (A)이(가) 만들어져 당신의 (B)에 저장된다.","opts":["(A) cookies / (B) device","(A) cookies / (B) desk","(A) cakes / (B) device","(A) cakes / (B) desk","(A) games / (B) desk"],"oko":["(A) 쿠키 / (B) 기기","(A) 쿠키 / (B) 책상","(A) 케이크 / (B) 기기","(A) 케이크 / (B) 책상","(A) 게임 / (B) 책상"],"r":{"a":"1) (A) cookies / (B) device","ev":"10번 문장","s":[[10,"Every time you search something online, Internet cookies are created and stored on your device.","당신이 온라인상에서 무언가를 검색할 때마다, 인터넷 쿠키가 만들어지고 당신의 기기에 저장된다."]],"w":"10번에서 온라인으로 검색할 때마다 인터넷 쿠키(cookies)가 만들어져 당신의 기기(device)에 저장된다고 해요.","c":1},"h":"199cf6c5f9"},{"n":10,"t":"fill","q":"It uses an [A] program to [B] advertisements to customers.","ko":"그것은 광고를 소비자와 [B]하기 위해 [A] 프로그램을 사용한다.","bank":["automatic","match","mall","website","wonder","shoes"],"bko":{"automatic":"자동의","match":"연결하다","mall":"쇼핑몰","website":"웹사이트","wonder":"궁금해하다","shoes":"신발"},"r":{"a":"[A] automatic (자동의), [B] match (연결하다)","ev":"9번 문장","s":[[9,"It uses an automatic program to match advertisements to customers.","그것은 광고를 소비자들과 연결시키는 자동 프로그램을 사용한다."]],"w":"9번에서 그것은 광고를 소비자와 연결시키는(match) 자동(automatic) 프로그램을 사용한다고 해요.","c":null},"h":"c8d86475ce"}]},{"u":8,"id":"hk4-08-2","no":2,"ko":"여기에 벌레가 들어 있다고?\b","items":[{"n":1,"t":"tf","q":"The cochineal is a tiny insect that lives on cactus.","ko":"코치닐은 선인장을 먹고 사는 작은 곤충이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It is a tiny insect called the cochineal, which lives on cactus in Central and South America.","그것은 코치닐이라고 불리는 작은 곤충인데, 이것은 중남미에 있는 선인장을 먹고 산다."]],"w":"2번 문장에서 코치닐은 중남미의 선인장을 먹고 사는 작은 곤충(a tiny insect)이라고 해요.","c":"T"},"h":"cca6e9a9d8"},{"n":2,"t":"tf","q":"Ancient Mayans and Aztecs used cochineals only for food.","ko":"고대 마야인들과 아즈텍인들은 코치닐을 음식에만 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Ancient Mayans and Aztecs used them to color cloth and pottery.","고대 마야인들과 아즈텍인들은 그것들을 옷감과 도자기를 염색하기 위해 사용했다."]],"w":"5번 문장에서 고대 마야인과 아즈텍인은 코치닐을 옷감과 도자기를 염색하는 데 사용했다고 해요. 음식에만 썼다는 말은 틀려요.","c":"F"},"h":"283dc5f767"},{"n":3,"t":"tf","q":"The protein in cochineal dye can cause an allergic reaction in some people.","ko":"코치닐 염료에 있는 단백질은 몇몇 사람들에게 알레르기 반응을 일으킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"The protein in cochineal dye can cause an allergic reaction in some people.","코치닐 염료에 있는 단백질은 몇몇 사람들에게 알레르기 반응을 일으킬 수 있다."]],"w":"9번 문장과 같은 내용이에요. 단백질이 알레르기 반응을 일으킬 수 있다는 것이 우려 중 하나예요.","c":"T"},"h":"94cfb31695"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…and crushed into a powder…)","ko":"이 곤충은 채집되고, 말려지고, 그리고 그 후 선명한 빨간색 염료로 사용되는 가루로 ( ).","opts":["팔린다","으깨진다","그려진다","키워진다"],"word":"crushed","r":{"a":"2) 으깨진다","ev":"3번 문장","s":[[3,"These insects are collected, dried, and crushed into a powder that is then used as a bright red dye.","이 곤충은 채집되고, 말려지고, 그리고 그 후 선명한 빨간색 염료로 사용되는 가루로 으깨진다."]],"w":"곤충을 채집해서 말린 다음 가루(powder)로 만드는 과정이에요. 가루가 되려면 부수어야 하니 crush는 '으깨다'예요.","c":2},"h":"4cab3cc731"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…too many cochineals are being sacrificed…)","ko":"…너무 많은 코치닐이 ( ) 있는데, 1킬로그램의 염료를 얻는 데 10만 마리 이상의 코치닐이 든다!","opts":["보호받고","수입되고","희생되고","사랑받고"],"word":"sacrificed","r":{"a":"3) 희생되고","ev":"10번 문장","s":[[10,"Furthermore, too many cochineals are being sacrificed—it takes more than 100,000 cochineals to get a single kilogram of dye!","게다가, 너무 많은 코치닐이 희생되고 있는데, 1킬로그램의 염료를 얻는 데 10만 마리 이상의 코치닐이 든다!"]],"w":"염료 1킬로그램에 코치닐이 10만 마리 이상 든다는 것은 그만큼 많은 코치닐이 목숨을 잃는다는 뜻이에요. sacrifice = 희생하다.","c":3},"h":"f20bfdc77f"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nHowever, there are concerns over its use.","ko":"밑줄 친 its이 가리키는 것은?","sko":"하지만, 그것의 사용에 대한 우려가 있다.","opts":["립스틱","코치닐 염료","화장품 회사","선인장"],"pron":"its","r":{"a":"2) 코치닐 염료","ev":"7~8번 문장","s":[[7,"Today, cochineal dye is widely used in products from food and drinks to cosmetics, including lipsticks.","오늘날, 코치닐 염료는 음식과 음료부터 립스틱을 포함한 화장품까지 상품에 널리 사용된다."],[8,"However, there are concerns over its use.","하지만, 그것의 사용에 대한 우려가 있다."]],"w":"7번에서 코치닐 염료가 음식과 음료부터 화장품까지 널리 쓰인다고 했어요. 8번의 its use는 바로 그 코치닐 염료의 사용이에요.","c":2,"k":"its = 코치닐 염료"},"h":"c059ce2f0b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Cochineals have been used as a natural dye for a long time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"코치닐은 오랜 시간 동안 천연염료로 사용되어 왔다.","opts":["코치닐은 오랜 시간 동안 천연염료로 사용되어 왔다.","코치닐은 최근에야 처음으로 염료로 쓰이기 시작했다.","코치닐은 인공 염료로 만들어진다.","코치닐은 염료로 쓰이다가 지금은 완전히 사라졌다."],"r":{"a":"1) 코치닐은 오랜 시간 동안 천연염료로 사용되어 왔다.","ev":"4번 문장","s":[[4,"Cochineals have been used as a natural dye for a long time.","코치닐은 오랜 시간 동안 천연염료로 사용되어 왔다."]],"w":"have been used는 계속 사용되어 왔다는 뜻이고, for a long time은 오랜 시간 동안이라는 뜻이에요.","c":1},"h":"74b940a2be"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오늘날 코치닐 염료는 더 이상 사용되지 않는다.","오늘날 코치닐 염료는 옷감에만 사용된다.","오늘날 코치닐 염료는 음식과 음료부터 화장품까지 널리 사용된다.","오늘날 코치닐 염료는 립스틱에만 사용된다."],"opts":["Cochineal dye is no longer used today.","Cochineal dye is used only for clothes today.","Cochineal dye is widely used from food and drinks to cosmetics today.","Cochineal dye is used only in lipsticks today."],"r":{"a":"3) Cochineal dye is widely used from food and drinks to cosmetics today.","ev":"7번 문장","s":[[7,"Today, cochineal dye is widely used in products from food and drinks to cosmetics, including lipsticks.","오늘날, 코치닐 염료는 음식과 음료부터 립스틱을 포함한 화장품까지 상품에 널리 사용된다."]],"w":"7번에서 코치닐 염료가 음식과 음료부터 립스틱을 포함한 화장품까지 널리 사용된다고 해요. 한 가지에만 쓰이거나 더 이상 쓰이지 않는다는 말은 틀려요.","c":3},"h":"959cd462c9"},{"n":9,"t":"sum","q":"Strawberry milk looks (A) because of a dead (B).","ko":"딸기 우유는 죽은 (B) 때문에 (A)색으로 보인다.","opts":["(A) pink / (B) bug","(A) pink / (B) fruit","(A) blue / (B) bug","(A) blue / (B) fruit","(A) green / (B) fruit"],"oko":["(A) 분홍 / (B) 벌레","(A) 분홍 / (B) 과일","(A) 파랑 / (B) 벌레","(A) 파랑 / (B) 과일","(A) 초록 / (B) 과일"],"r":{"a":"1) (A) pink / (B) bug","ev":"1번 문장","s":[[1,"Believe it or not, what makes strawberry milk look pink is a dead bug!","믿거나 말거나, 딸기 우유를 분홍색으로 보이게 만드는 것은 죽은 벌레이다!"]],"w":"1번에서 딸기 우유를 분홍색(pink)으로 보이게 만드는 것은 죽은 벌레(bug)라고 해요.","c":1},"h":"cd12646031"},{"n":10,"t":"fill","q":"Aztec women also colored their [A] red with crushed cochineals to make themselves look more [B].","ko":"아즈텍 여성들은 자신들이 더 [B] 보이도록 으깬 코치닐로 [A]을(를) 빨갛게 염색하기도 했다.","bank":["teeth","attractive","protein","kilogram","allergic","dead"],"bko":{"teeth":"치아","attractive":"매력적인","protein":"단백질","kilogram":"킬로그램","allergic":"알레르기성의","dead":"죽은"},"r":{"a":"[A] teeth (치아), [B] attractive (매력적인)","ev":"6번 문장","s":[[6,"Aztec women also colored their teeth red with crushed cochineals to make themselves look more attractive.","아즈텍 여성들은 자신들을 더 매력적으로 보이도록 만들기 위해 으깬 코치닐로 치아를 빨간색으로 염색하기도 했다."]],"w":"6번에서 아즈텍 여성들은 자신들을 더 매력적으로(attractive) 보이게 하려고 으깬 코치닐로 치아(teeth)를 빨갛게 염색했다고 해요.","c":null},"h":"ed49030bd8"}]},{"u":8,"id":"hk4-08-3","no":3,"ko":"내 머리가 어때서~\b","items":[{"n":1,"t":"tf","q":"Until recently, natural hairstyles were rejected in some workplaces and schools.","ko":"최근까지, 타고난 헤어스타일은 일부 직장과 학교에서 거부되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But until recently, these styles were rejected in some workplaces and schools.","하지만 최근까지, 이러한 스타일은 일부 직장과 학교에서 거부되었다."]],"w":"3번 문장에서 최근까지 이런 스타일이 일부 직장과 학교에서 거부되었다(were rejected)고 해요.","c":"T"},"h":"a67f20283c"},{"n":2,"t":"tf","q":"Some African Americans wore wigs to show their natural curls.","ko":"일부 아프리카계 미국인들은 타고난 곱슬머리를 보여주기 위해 가발을 썼다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Others wore wigs to hide their natural curls.","다른 사람들은 타고난 곱슬머리를 숨기기 위해 가발을 썼다."]],"w":"6번 문장은 타고난 곱슬머리를 숨기기 위해(to hide) 가발을 썼다고 해요. 보여주려고 썼다는 말은 반대예요.","c":"F"},"h":"9cc1bbbff4"},{"n":3,"t":"tf","q":"Ayanna Pressley gave important speeches with her curly hair braided.","ko":"아이아나 프레슬리는 곱슬머리를 땋은 채로 중요한 연설을 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"That same year, congresswoman Ayanna Pressley gave important speeches with her curly hair braided.","같은 해, 국회의원 아이아나 프레슬리는 곱슬머리를 땋은 채로 중요한 연설을 했다."]],"w":"8번 문장 congresswoman Ayanna Pressley gave important speeches with her curly hair braided와 같은 내용이에요.","c":"T"},"h":"fe49f1a8a2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…these styles were rejected in some workplaces and schools.)","ko":"하지만 최근까지, 이러한 스타일은 일부 직장과 학교에서 ( ).","opts":["인정받았다","유행했다","거부되었다","허락되었다"],"word":"rejected","r":{"a":"3) 거부되었다","ev":"3~4번 문장","s":[[3,"But until recently, these styles were rejected in some workplaces and schools.","하지만 최근까지, 이러한 스타일은 일부 직장과 학교에서 거부되었다."],[4,"That’s because they were considered messy and unprofessional.","그것은 그것들이 지저분하고 전문가답지 못하다고 여겨졌기 때문이다."]],"w":"4번에서 그 스타일이 지저분하고 전문가답지 못하다고 여겨졌다고 해요. 그런 이유라면 받아들여지지 않고 거부되었겠지요. reject = 거부하다.","c":3},"h":"a12738e450"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…straightened their hair with harsh chemicals…)","ko":"…머리를 ( ) 화학 물질로 곧게 폈거나 짧게 잘랐다.","opts":["독한","향기로운","값싼","천연의"],"word":"harsh","r":{"a":"1) 독한","ev":"5번 문장","s":[[5,"So, many African Americans, especially women, straightened their hair with harsh chemicals or cut their hair short.","그래서, 많은 아프리카계 미국인들, 특히 여성들은, 머리를 독한 화학 물질로 곧게 폈거나 짧게 잘랐다."]],"w":"곱슬머리를 곧게 펴려고 쓰는 화학 물질이라 머리에 센 성분이에요. harsh = 독한, 혹독한.","c":1},"h":"7af1c5196a"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nNow, their actions have encouraged many African Americans to show their natural hair.","ko":"밑줄 친 their(첫 번째)가 가리키는 것은?","sko":"이제, 그들의 행동은 많은 아프리카계 미국인들에게 타고난 머리를 보여주도록 용기를 주고 있다.","opts":["아프리카계 미국인들","미셸 오바마와 아이아나 프레슬리","잡지 기자들","직장 상사들"],"r":{"a":"2) 미셸 오바마와 아이아나 프레슬리","ev":"7~9번 문장","s":[[7,"However, Michelle Obama, the former First Lady, proudly revealed her naturally curly hair on the cover of a magazine in 2018.","하지만, 전 영부인인 미셸 오바마가, 2018년에 한 잡지의 표지에서 당당하게 그녀의 타고나기를 곱슬인 머리를 드러냈다."],[8,"That same year, congresswoman Ayanna Pressley gave important speeches with her curly hair braided.","같은 해, 국회의원 아이아나 프레슬리는 곱슬머리를 땋은 채로 중요한 연설을 했다."],[9,"Now, their actions have encouraged many African Americans to show their natural hair.","이제, 그들의 행동은 많은 아프리카계 미국인들에게 타고난 머리를 보여주도록 용기를 주고 있다."]],"w":"7번에서 미셸 오바마가, 8번에서 아이아나 프레슬리가 곱슬머리를 드러냈어요. 9번의 their actions는 그 두 사람의 행동이에요.","c":2},"h":"3774787529"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is a sign of overcoming prejudice and building confidence.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 편견을 극복하고 자신감을 쌓는다는 상징이다.","opts":["그것은 편견을 키우고 자신감을 잃는 일이다.","그것은 유행이 지나가고 있다는 신호이다.","그것은 직장에서 쫓겨났다는 증거이다.","그것은 편견을 극복하고 자신감을 쌓고 있다는 표시이다."],"r":{"a":"4) 그것은 편견을 극복하고 자신감을 쌓고 있다는 표시이다.","ev":"10~11번 문장","s":[[10,"It is not just a matter of style and appearance.","그것은 단지 스타일과 외모의 문제가 아니다."],[11,"It is a sign of overcoming prejudice and building confidence.","그것은 편견을 극복하고 자신감을 쌓는다는 상징이다."]],"w":"a sign of ~는 '~의 표시, 상징'이에요. overcoming prejudice(편견을 극복하는 것)와 building confidence(자신감을 쌓는 것)가 그 내용이에요.","c":4},"h":"ce5e184f98"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["미셸 오바마는 2018년에 한 잡지의 표지에서 당당하게 곱슬머리를 보여주었다.","미셸 오바마는 2018년에 한 잡지의 표지에서 모자 속에 곱슬머리를 숨겼다.","미셸 오바마는 2018년에 한 잡지의 표지를 위해 머리를 짧게 잘랐다.","미셸 오바마는 2018년에 한 잡지의 표지에 나오기를 거부했다."],"opts":["Michelle Obama proudly showed her curly hair on a magazine cover in 2018.","Michelle Obama hid her curly hair under a hat on a magazine cover in 2018.","Michelle Obama cut her hair short for a magazine cover in 2018.","Michelle Obama refused to appear on a magazine cover in 2018."],"r":{"a":"1) Michelle Obama proudly showed her curly hair on a magazine cover in 2018. (미셸 오바마는 2018년에 한 잡지의 표지에서 당당하게 곱슬머리를 보여주었다.)","ev":"7번 문장","s":[[7,"However, Michelle Obama, the former First Lady, proudly revealed her naturally curly hair on the cover of a magazine in 2018.","하지만, 전 영부인인 미셸 오바마가, 2018년에 한 잡지의 표지에서 당당하게 그녀의 타고나기를 곱슬인 머리를 드러냈다."]],"w":"7번에서 전 영부인 미셸 오바마가 2018년에 한 잡지의 표지에서 당당하게(proudly) 곱슬머리를 드러냈다고 해요.","c":1},"h":"d471fda18d"},{"n":9,"t":"sum","q":"Natural hairstyles were once considered (A) and (B).","ko":"자연스러운 헤어스타일은 한때 (A) 그리고 (B) 것으로 여겨졌다.","opts":["(A) messy / (B) unprofessional","(A) neat / (B) professional","(A) messy / (B) professional","(A) neat / (B) unprofessional","(A) funny / (B) professional"],"oko":["(A) 지저분한 / (B) 전문가답지 못한","(A) 단정한 / (B) 전문가다운","(A) 지저분한 / (B) 전문가다운","(A) 단정한 / (B) 전문가답지 못한","(A) 재미있는 / (B) 전문가다운"],"r":{"a":"1) (A) messy / (B) unprofessional","ev":"4번 문장","s":[[4,"That’s because they were considered messy and unprofessional.","그것은 그것들이 지저분하고 전문가답지 못하다고 여겨졌기 때문이다."]],"w":"4번에서 그런 스타일은 지저분하고(messy) 전문가답지 못하다(unprofessional)고 여겨졌다고 해요.","c":1},"h":"0d93eec9e9"},{"n":10,"t":"fill","q":"They can braid it or let it [A] naturally into an [B].","ko":"그들은 머리를 땋거나, 자연스럽게 [A]도록 두어 [B]이(가) 되게 할 수 있다.","bank":["grow","Afro","reject","hide","speech","workplace"],"bko":{"grow":"자라다","Afro":"아프로(둥글게 부푼 곱슬머리)","reject":"거부하다","hide":"숨기다","speech":"연설","workplace":"직장"},"r":{"a":"[A] grow (자라다), [B] Afro (아프로(둥글게 부푼 곱슬머리))","ev":"2번 문장","s":[[2,"They can braid it or let it grow naturally into an Afro.","그들은 머리를 땋거나 자연스럽게 아프로로 자라게 둘 수 있다."]],"w":"2번에서 머리를 땋거나 자연스럽게 자라서(grow) 아프로(Afro)가 되게 둘 수 있다고 해요.","c":null},"h":"b63a898ca8"}]},{"u":8,"id":"hk4-08-4","no":4,"ko":"80:20의 법칙\b","items":[{"n":1,"t":"tf","q":"Vilfredo Pareto was an Italian economist in the early 1900s.","ko":"빌프레도 파레토는 1900년대 초 이탈리아의 경제학자였다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Vilfredo Pareto was an Italian economist in the early 1900s.","빌프레도 파레토는 1900년대 초 이탈리아의 경제학자였다."]],"w":"1번 문장에 그대로 나와요.","c":"T"},"h":"7347a9cb0f"},{"n":2,"t":"tf","q":"Pareto found that 20% of the peas came from 80% of his pea plants.","ko":"파레토는 완두콩의 20퍼센트가 완두콩 식물의 80퍼센트에서 나온다는 것을 발견했다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It turned out that 80% of the peas came from 20% of his pea plants.","완두콩의 80퍼센트가 그의 완두콩 식물의 20퍼센트에서 나오는 것으로 드러났다."]],"w":"3번 문장은 80%의 완두콩이 20%의 식물에서 나왔다고 해요. 숫자가 서로 뒤바뀐 선지예요.","c":"F"},"h":"69c3bca548"},{"n":3,"t":"tf","q":"80% of Italy’s land was owned by 20% of its population.","ko":"이탈리아 땅의 80퍼센트는 이탈리아 인구의 20퍼센트에 의해 소유되어 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"For example, 80% of Italy’s land was owned by 20% of its population.","예를 들어, 이탈리아 땅의 80퍼센트가 이탈리아 인구의 20퍼센트에 의해 소유되어 있었다."]],"w":"5번 문장에 그대로 나와요. 경제에도 80/20 패턴이 있다는 예시예요.","c":"T"},"h":"d6413d0190"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…he made an interesting observation while harvesting peas…)","ko":"어느 날, 그는 정원에서 완두콩을 수확하면서 흥미로운 ( )을 했다.","opts":["요리","관찰","여행","발표"],"word":"observation","r":{"a":"2) 관찰","ev":"2~3번 문장","s":[[2,"One day, he made an interesting observation while harvesting peas in his garden.","어느 날, 그는 정원에서 완두콩을 수확하면서 흥미로운 관찰을 했다."],[3,"It turned out that 80% of the peas came from 20% of his pea plants.","완두콩의 80퍼센트가 그의 완두콩 식물의 20퍼센트에서 나오는 것으로 드러났다."]],"w":"정원에서 완두콩을 수확하다가 80%의 완두콩이 20%의 식물에서 나온다는 것을 알아차렸어요(3번). 그러니 observation은 '관찰'이에요.","c":2},"h":"d8299e9e26"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the new group would be composed of only hard-working ants.)","ko":"…그 새로운 집단이 열심히 일하는 개미로만 ( ) 것이라고 생각할지도 모른다.","opts":["구성될","쫓겨날","굶주릴","사라질"],"word":"composed","r":{"a":"1) 구성될","ev":"11번 문장","s":[[11,"You might think that if you separated these active ants from the others, the new group would be composed of only hard-working ants.","당신은 만약 이 활동적인 개미를 나머지 개미로부터 분리한다면, 그 새로운 집단이 열심히 일하는 개미로만 구성될 것이라고 생각할지도 모른다."]],"w":"be composed of ~는 '~으로 이루어지다'예요. 활동적인 개미만 분리해서 새 집단을 만들면 열심히 일하는 개미로만 이루어질 것이라는 예상이에요.","c":1},"h":"09262654ff"},{"n":6,"t":"ref","q":"What does the underlined \"This 80/20 pattern\" refer to?\nThis 80/20 pattern became known as the Pareto Principle or the 80/20 Rule.","ko":"밑줄 친 This 80/20 pattern가 가리키는 것은?","sko":"이 80/20 패턴은 파레토 법칙 또는 80/20 법칙으로 알려지게 되었다.","opts":["결과의 80퍼센트가 원인의 20퍼센트에서 나온다는 패턴","결과의 50퍼센트가 원인의 50퍼센트에서 나온다는 패턴","완두콩을 정원에서 수확하는 방법","개미가 먹이를 나누는 방식"],"pron":"This 80/20 pattern","r":{"a":"1) 결과의 80퍼센트가 원인의 20퍼센트에서 나온다는 패턴","ev":"6~7번 문장","s":[[6,"He concluded that 80% of effects come from 20% of causes.","그는 결과의 80퍼센트가 원인의 20퍼센트에서 나온다고 결론을 내렸다."],[7,"This 80/20 pattern became known as the Pareto Principle or the 80/20 Rule.","이 80/20 패턴은 파레토 법칙 또는 80/20 법칙으로 알려지게 되었다."]],"w":"6번에서 파레토는 결과의 80퍼센트가 원인의 20퍼센트에서 나온다고 결론을 내렸어요. 7번의 This 80/20 pattern은 바로 이 패턴이에요.","c":1,"k":"This 80/20 pattern = 결과의 80퍼센트가 원인의 20퍼센트에서 나온다는 패턴"},"h":"2cf450ad68"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Pareto Principle is commonly seen in nature.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"파레토 법칙은 자연에서 흔히 보인다.","opts":["파레토 법칙은 자연에서 흔히 볼 수 있다.","파레토 법칙은 자연에서 전혀 볼 수 없다.","파레토 법칙은 사람이 만든 물건에서만 볼 수 있다.","파레토 법칙은 자연에서 아주 드물게 나타난다."],"r":{"a":"1) 파레토 법칙은 자연에서 흔히 볼 수 있다.","ev":"8번 문장","s":[[8,"The Pareto Principle is commonly seen in nature.","파레토 법칙은 자연에서 흔히 보인다."]],"w":"commonly는 흔히라는 뜻이고, in nature는 자연에서라는 뜻이에요. 자연에서 흔히 보인다는 선지가 정답이에요.","c":1},"h":"b500041da7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["개미의 20퍼센트만이 나머지 개미들을 위해 먹이를 구하려고 열심히 일한다.","모든 개미가 똑같이 열심히 일해서 먹이를 구한다.","개미의 80퍼센트가 나머지 20퍼센트를 위해 먹이를 구한다.","개미는 먹이를 서로 나누지 않는다."],"opts":["Only 20% of the ants work hard to get food for the other ants.","All ants work equally hard to get food.","80% of the ants work hard to get food for the other 20%.","Ants never share food."],"r":{"a":"1) Only 20% of the ants work hard to get food for the other ants.","ev":"10번 문장","s":[[10,"If you observe a group of ants, you will see that just 20% of the ants work hard to get food for the remaining 80% of the ants.","만약 당신이 한 무리의 개미를 관찰한다면, 당신은 개미의 20퍼센트만이 남아 있는 80퍼센트의 개미를 위한 먹이를 구하기 위해 열심히 일하는 것을 볼 것이다."]],"w":"10번에서 개미의 20%만이 남아 있는 80%의 개미를 위한 먹이를 구하려고 열심히 일한다고 해요.","c":1},"h":"c4b1c4435e"},{"n":9,"t":"sum","q":"In the new group, only 20% of the (A) would be (B).","ko":"새로운 집단에서는 (A)의 20퍼센트만이 (B) 것이다.","opts":["(A) members / (B) productive","(A) members / (B) sleepy","(A) students / (B) productive","(A) students / (B) sleepy","(A) farmers / (B) sleepy"],"oko":["(A) 일원 / (B) 생산적일","(A) 일원 / (B) 졸릴","(A) 학생 / (B) 생산적일","(A) 학생 / (B) 졸릴","(A) 농부 / (B) 졸릴"],"r":{"a":"1) (A) members / (B) productive","ev":"13번 문장","s":[[13,"In other words, only 20% of the members would be productive!","다시 말해서, 구성원들의 20퍼센트만이 생산적일 것이다!"]],"w":"13번에서 구성원들(members)의 20퍼센트만이 생산적일(productive) 것이라고 해요.","c":1},"h":"d1c2df31c4"},{"n":10,"t":"fill","q":"More surprisingly, he [A] that the same pattern existed in the [B]!","ko":"더 놀랍게도, 그는 같은 패턴이 [B]에도 존재한다는 것을 [A].","bank":["noticed","economy","owned","harvested","Italy","economist"],"bko":{"noticed":"알아차렸다","economy":"경제","owned":"소유했다","harvested":"수확했다","Italy":"이탈리아","economist":"경제학자"},"r":{"a":"[A] noticed (알아차렸다), [B] economy (경제)","ev":"4번 문장","s":[[4,"More surprisingly, he noticed that the same pattern existed in the economy!","더 놀랍게도, 그는 경제에도 같은 패턴이 존재한다는 것을 알아차렸다!"]],"w":"4번에서 파레토는 같은 패턴이 경제(economy)에도 존재한다는 것을 알아차렸다(noticed)고 해요.","c":null},"h":"aef97fcd9f"}]},{"u":9,"id":"hk4-09-1","no":1,"ko":"‘혼’쭐내거나, ‘돈’쭐내거나\b","items":[{"n":1,"t":"tf","q":"Company B donates regularly to animal shelters.","ko":"B사는 정기적으로 동물 보호소에 기부한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Company B, on the other hand, doesn’t do animal testing, and it regularly donates to animal shelters.","반면에, B사는 동물 실험을 하지 않고, 정기적으로 동물 보호소에 기부를 한다."]],"w":"3번 문장에 it regularly donates to animal shelters가 있어요. B사가 정기적으로 동물 보호소에 기부한다는 내용과 같아요.","c":"T"},"h":"ec1b7721dc"},{"n":2,"t":"tf","q":"Company A’s product is not tested on animals.","ko":"A사의 상품은 동물에게 실험되지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Company A’s product is tested on animals.","A사의 상품은 동물에게 실험된다."]],"w":"2번 문장에서 A사의 상품은 동물에게 실험된다(is tested on animals)고 해요. 실험되지 않는다는 말은 반대예요.","c":"F"},"h":"b47d53a498"},{"n":3,"t":"tf","q":"A boycott and a buycott are both active behaviors of consumers.","ko":"보이콧과 바이콧은 둘 다 소비자의 적극적인 행동이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Both of them are active behaviors of consumers to express protest or support.","그것들 둘 다 항의 또는 지지를 표현하기 위한 소비자들의 적극적인 행동이다."]],"w":"6번 문장에서 Both of them are active b
