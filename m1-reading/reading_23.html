power. Because of them, we can be happy or unhappy.\""];var PASS_KO=["작은 행동의 힘","지민이가 잠에서 깨어났다. 밝고 화창한 날이었다. \"벌써 7시 30분이네. 이런! 늦었어.\" 엄마가 말씀하셨다, \"놀이공원에서 좋은 시간 보내렴! 너무 늦지는 마.\" 지민이는 친구 소라를 지하철역에서 만났다. 그들은 매우 들떠 있었다!","지하철에서 두 여학생은 서서 담소를 나누었다. 그때 무언가가 지민이의 등을 쳤다. \"아야!\" 지민이는 몸을 돌렸다. 그것은 커다란 가방이었다! 그때, 스피커에서 음성이 나왔다, \"가방은 앞으로 메주세요.\"","놀이공원에서 지민이와 소라는 많은 놀이기구를 즐겼다. 그들은 소리를 질렀고 많이 웃었다. 마침내 그들은 롤러코스터를 타러 갔고 긴 줄을 섰다. 두 여학생 앞에는 한 남학생이 있었다. 그는 \"나 여기 있어!\"라고 외쳤고, 갑자기 그의 친구들이 그에게 합류했다. 오, 이런! 무슨 일이 일어나고 있는 거지? \"새치기하지 마.\" 지민이는 그들에게 말했다.","기념품 가게에서 지민이와 소라는 긴 토끼 귀가 달린 머리띠를 샀다. 그들은 문 쪽으로 향했다. 그때 한 남자가 여학생들을 위해 문을 잡아주었다. 그는 매우 친절했다. \"감사합니다!\"라고 여학생들은 말했다.","그러고 나서 그들은 마술쇼로 향했다. 그들은 자리에 앉았다. 두 남학생이 지민이와 소라 앞에 앉았다. 남학생들 역시 긴 토끼 귀가 달린 머리띠를 썼다. 슬프게도 지민이와 소라는 무대를 볼 수 없었다. 그때 쇼가 시작했고, 남학생들은 친절하게도 머리띠를 벗었다. \"우리도 머리띠를 벗자,\" 소라가 지민이에게 말했다. 그들은 서로에게 미소를 지었다.","집으로 돌아오는 지하철에서 지민이는 생각했다, \"작은 행동들은 진정한 힘을 가지고 있구나. 그 행동들로 인해 우리는 행복할 수도, 언짢을 수도 있어.\""];var DG=[{"qs":[{"n":1,"q":"위 대화를 읽고 알 수 있는 것은?","o":["소년과 소녀의 나이","소년과 소녀의 자리","소년과 소녀가 각자 내릴 역","소녀가 자신의 자리를 착각한 이유","소년과 소녀가 탄 열차의 최종 목적지"],"a":1,"ans":"소년과 소녀의 자리","evs":[["This is not your seat. This is 4B. Your seat is 4C.","이건 네 자리가 아니야. 여기는 4B야. 네 자리는 4C야."]],"ev":["This is not your seat. This is 4B. Your seat is 4C.","이건 네 자리가 아니야. 여기는 4B야. 네 자리는 4C야."],"ow":["오답 ✕ — 대화에 두 사람의 나이를 알 수 있는 말은 없다. 'Excuse me. Is this your seat?'(실례합니다. 이 자리가 네 자리니?)처럼 자리에 대한 이야기만 나온다.","정답 ○ — 'This is not your seat. This is 4B. Your seat is 4C.'(이건 네 자리가 아니야. 여기는 4B야. 네 자리는 4C야.)에서 소년과 소녀의 자리(4B, 4C)를 알 수 있다.","오답 ✕ — 두 사람이 어느 역에서 내리는지는 언급되지 않는다. 가장 가까운 문장은 'May I see your ticket?'(표를 봐도 될까?)인데 내릴 역 이야기가 아니다.","오답 ✕ — 소녀가 왜 자리를 착각했는지는 나오지 않는다. 소녀는 'Oh, I'm sorry.'(아, 죄송해요.)라고만 말한다.","오답 ✕ — 열차의 최종 목적지에 대한 언급은 없다. 대화는 표를 보고 자리를 확인하는 내용이다."],"memo":["정답 ②: 소년과 소녀의 자리(4B, 4C)를 알 수 있다.","근거: This is 4B. Your seat is 4C.(여기는 4B야. 네 자리는 4C야.)","함정: ④ 소녀가 왜 착각했는지는 대화에 없다. ✕"],"why":"소년의 자리는 4B, 소녀의 자리는 4C라는 것을 알 수 있다."},{"n":2,"q":"위 대화의 내용과 일치하는 것은?","o":["소년은 소녀에게 표를 보여 달라고 했다.","소녀는 자기 자리에 제대로 앉아 있었다.","소녀의 자리는 4B이다.","소년은 소녀에게 사과했다.","소녀는 표를 가져오지 않았다."],"a":0,"ans":"소년은 소녀에게 표를 보여 달라고 했다.","evs":[["B: Um.... May I see your ticket?","음.... 표를 좀 봐도 될까?"],["G: Sure. Here it is.","물론이죠. 여기 있어요."]],"ev":["B: Um.... May I see your ticket?","음.... 표를 좀 봐도 될까?"],"ow":["정답 ○ — 소년이 'May I see your ticket?'(표를 좀 봐도 될까?)라고 말했으므로 표를 보여 달라고 한 것이 맞다.","오답 ✕ — 소년이 'This is not your seat.'(이건 네 자리가 아니야.)라고 했으므로 소녀는 자기 자리가 아닌 곳에 앉아 있었다.","오답 ✕ — 'This is 4B. Your seat is 4C.'(여기는 4B야. 네 자리는 4C야.)에서 소녀의 자리는 4B가 아니라 4C이다.","오답 ✕ — 사과한 사람은 소녀이다. 소녀가 'Oh, I'm sorry.'(아, 죄송해요.)라고 말했고, 소년은 'No problem.'(괜찮아.)이라고 답했다.","오답 ✕ — 소녀는 'Sure. Here it is.'(물론이죠. 여기 있어요.)라며 표를 보여 주었으므로 표를 가져왔다."],"memo":["정답 ①: 소년은 소녀에게 표를 보여 달라고 했다.","근거: May I see your ticket?(표를 좀 봐도 될까?)","함정: ④ 사과한 사람은 소년이 아니라 소녀이다. ✕"],"why":"소년이 소녀에게 표를 보여 달라고 해서 자리를 확인한 대화이다."}],"dlg":[["B","Excuse me. Is this your seat?","실례합니다. 이 자리가 네 자리니?"],["G","Yes. What's wrong?","네. 무슨 문제가 있나요?"],["B","Um.... May I see your ticket?","음.... 표를 좀 봐도 될까?"],["G","Sure. Here it is.","물론이죠. 여기 있어요."],["B","This is not your seat. This is 4B. Your seat is 4C.","이건 네 자리가 아니야. 여기는 4B야. 네 자리는 4C야."],["G","Oh, I'm sorry.","아, 죄송해요."],["B","No problem.","괜찮아."]]},{"qs":[{"n":3,"q":"What will the girl do after the conversation?","o":["내릴 준비를 할 것이다.","쓰레기를 들고 기차에 탈 것이다.","쓰레기를 자리에 두고 내릴 것이다.","쓰레기를 챙겨서 기차에서 내릴 것이다.","쓰레기를 버린 다음에 기차에 탈 것이다."],"a":3,"ans":"쓰레기를 챙겨서 기차에서 내릴 것이다.","evs":[["W: Don't leave your trash.","쓰레기를 두고 가지 마."],["G: Okay, Mom.","네, 엄마."]],"ev":["W: Don't leave your trash.","쓰레기를 두고 가지 마."],"ow":["오답 ✕ — 소녀는 'I'm ready!'(저는 준비됐어요!)라고 이미 말했으므로 '준비할 것이다'는 대화 후의 행동으로 알맞지 않다. 엄마의 말 'Don't leave your trash.'(쓰레기를 두고 가지 마.)에 대한 대답이 아니다.","오답 ✕ — 이번 역에서 내릴 거라고 했으므로 기차에 타는 것이 아니다. 'will we get off at this station?'(이번 역에서 내리나요?)에 엄마가 'That's right.'(맞아.)라고 답했다.","오답 ✕ — 엄마가 'Don't leave your trash.'(쓰레기를 두고 가지 마.)라고 했으므로 자리에 쓰레기를 두고 내리면 안 된다.","정답 ○ — 엄마가 'Don't leave your trash.'(쓰레기를 두고 가지 마.)라고 했고 소녀가 'Okay, Mom.'(네, 엄마.)이라고 답했으므로 쓰레기를 챙겨서 기차에서 내릴 것이다.","오답 ✕ — 소녀는 이번 역에서 내릴 거라서 기차에 타는 것이 아니다. 쓰레기를 버리고 기차에 탄다는 말은 대화에 없다."],"memo":["정답 ④: 쓰레기를 챙겨서 기차에서 내릴 것이다.","근거: Don't leave your trash.(쓰레기를 두고 가지 마.) / Okay, Mom.(네, 엄마.)","함정: ③ 쓰레기를 두고 가지 말라고 했으므로 ✕"],"why":"엄마가 쓰레기를 두고 가지 말라고 했으므로 소녀는 쓰레기를 챙겨 내릴 것이다."}],"dlg":[["G","Mom, will we get off at this station?","엄마, 우리 이번 역에서 내리나요?"],["W","That's right.","맞아."],["G","I'm ready!","저는 준비됐어요!"],["W","Don't leave your trash.","쓰레기를 두고 가지 마."],["G","Okay, Mom.","네, 엄마."]]},{"qs":[{"n":4,"q":"아빠가 마이크에게 의자 위에 발을 올리지 말라고 한 이유는?","o":["나중에 다른 사람이 그곳에 앉을 것이어서","의자가 새로 산 것이어서","의자가 고장 나 있어서","마이크의 신발이 젖어 있어서","곧 열차에서 내려야 해서"],"a":0,"ans":"나중에 다른 사람이 그곳에 앉을 것이어서","evs":[["Mike: Why not, Dad?","왜 안 되나요, 아빠?"],["Dad: Someone will sit there later.","나중에 누군가 거기에 앉을 거니까."]],"ev":["Mike: Why not, Dad?","왜 안 되나요, 아빠?"],"ow":["정답 ○ — 아빠가 'Someone will sit there later.'(나중에 누군가 거기에 앉을 거니까.)라고 이유를 말했다.","오답 ✕ — 의자가 새것이라는 말은 없다. 이유는 'Someone will sit there later.'(나중에 누군가 거기에 앉을 거니까.)이다.","오답 ✕ — 의자가 고장 났다는 언급은 없다. 아빠는 'Someone will sit there later.'(나중에 누군가 앉을 거야.)라고만 했다.","오답 ✕ — 마이크의 신발 이야기는 대화에 나오지 않는다. 아빠가 든 이유는 다른 사람이 앉을 것이라는 점이다.","오답 ✕ — 내릴 시간과 관련된 말은 없다. 'Why not, Dad?'(왜 안 되나요, 아빠?)에 아빠는 다른 사람이 앉을 거라고 답했다."],"memo":["정답 ①: 나중에 다른 사람이 그곳에 앉을 것이어서","근거: Someone will sit there later.(나중에 누군가 거기에 앉을 거니까.)","함정: ② 새 의자라는 말은 없다. ✕"],"why":"의자에 발을 올리지 말아야 하는 이유는 나중에 다른 사람이 앉기 때문이다."}],"dlg":[["Dad","Mike, don't put your feet on the seat.","마이크, 의자 위에 발을 올리지 마."],["Mike","Why not, Dad?","왜 안 되나요, 아빠?"],["Dad","Someone will sit there later.","나중에 누군가 거기에 앉을 거니까."],["Mike","Oh, okay.","아, 알겠어요."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["소년은 남자에게 전화기를 빌려 달라고 했다.","남자는 전화 통화를 해도 된다고 했지만 너무 크게 말하지는 말라고 했다.","소년은 남자에게 전화 통화를 하지 말라고 했다.","남자는 소년의 전화 통화를 허락하지 않았다.","소년은 소리를 더 크게 해 달라고 부탁했다."],"a":1,"ans":"남자는 전화 통화를 해도 된다고 했지만 너무 크게 말하지는 말라고 했다.","evs":[["M: May I talk on the phone here?","여기서 전화 통화를 해도 될까요?"],["B
