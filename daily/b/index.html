머지와 다른 의미로 쓰인 것을 고르시오.","wd":"age","a":"2","e":"①나이 / ②시대 / ③나이 / ④나이 [②번만 의미가 다름]","k":"①너는 글쓰기 대회에 참가하려면 나이가 열여덟 살이 넘어야 한다.\n②인쇄술은 르네상스 시대에 유럽 전역으로 지식을 퍼뜨렸다.\n③같은 나이의 아이들도 흔히 아주 다른 속도로 읽기를 배운다.\n④박물관 안내원은 모든 방문객에게 양식에 나이를 적어 달라고 요청했다.","m":0,"c":["You must be over eighteen years of age to enter the writing contest.","Printing spread knowledge across Europe in the age of the Renaissance.","Children of the same age often learn to read at very different speeds.","The museum guide asked every visitor to write down their age on the form."],"hc":"age|age|age|age","mn":"나이 / 시대","hk":"②번 the age of(~의 시대)만 시대를 뜻함. the Stone Age(석기 시대)처럼 시대 이름과 함께 씀. 나머지는 나이.","ex":[["She started school at [[the age of six]].","그녀는 [[여섯 살]]에 학교를 시작했다.","age (명) 나이"],["Children of [[the same age]] play together.","[[같은 나이]]의 아이들이 함께 논다.","age (명) 나이"],["People lived in caves in [[the Stone Age]].","사람들은 [[석기 시대]]에 동굴에서 살았다.","age (명) 시대"]]}]},{"day":44,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"disguise","a":"4","e":"④ disguise: (당신의 겉모습이나 목소리를 바꾸다 / 사람들이 당신을 알아보지 못하도록) 변장하다, 위장하다","w":"① mimic: 흉내 내다\n② caricature: 희화화하다, 풍자적으로 그리다\n③ portray: 묘사하다, 연기하다","k":"당신의 겉모습이나 목소리를 바꾸다 / 사람들이 당신을 알아보지 못하도록","m":0,"s":"\"to change your appearance or your voice so that people cannot recognize you\"","c":["mimic","caricature","portray","disguise"],"mn":"변장하다, 위장하다","hk":"disguise(변장하다)는 겉모습을 바꿔 알아보지 못하게 하는 것. mimic(흉내 내다)·portray(묘사하다)는 모습을 따라 하기만 하는 속임수.","ex":[["He wore a wig to [[disguise himself]].","그는 [[변장하려고]] 가발을 썼다."],["She tried to [[disguise her voice]].","그녀는 [[목소리를 바꾸려고]] 했다."],["The spy [[disguised himself as]] a waiter.","그 스파이는 웨이터로 [[변장했다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"descent","a":"1","e":"① ascent: 상승, 오르기 (그 조종사는 짙은 안개 속에서 비행기가 공항에 접근하자 천천히 하강을 시작했다.) / descent(하강, 내려가기)의 반의어.","w":"② slump: 급감, 폭락\n③ plunge: 급락, 추락\n④ downturn: 하락세, 침체","k":"그 조종사는 짙은 안개 속에서 비행기가 공항에 접근하자 천천히 하강을 시작했다.","m":0,"s":"The pilot began a slow descent as the plane approached the airport in heavy fog.","h":"descent","c":["ascent","slump","plunge","downturn"],"mn":"하강, 내려가기","hk":"descent(하강)의 반대편은 ascent(상승). slump(급감)·plunge(급락)·downturn(하락세)은 모두 아래쪽 뜻이라 같은 편 속임수.","ex":[["The plane began its slow [[descent]].","비행기는 천천히 [[하강]]을 시작했다.","descent (명) 하강, 내려가기"],["The climbers made a safe [[descent]] from the mountain.","등반가들은 산에서 안전하게 [[하산]]했다.","descent (명) 하강, 내려가기"],["The climbers began their slow [[ascent]] at dawn.","등반가들은 새벽에 천천히 [[오르기]]를 시작했다.","ascent (명) 상승, 오르기"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"proficiency","a":"4","e":"④ proficiency: 숙달, 능숙함","w":"① deficiency: 부족, 결핍\n② efficiency: 효율성\n③ sufficiency: 충분함, 충분한 양","m":0,"s":"\"숙달, 능숙함\"","c":["deficiency","efficiency","sufficiency","proficiency"],"mn":"숙달, 능숙함","hk":"proficiency(숙달)는 proficient(능숙한)의 명사형. deficiency(부족)·efficiency(효율성)·sufficiency(충분함)는 끝이 같으니 앞부분으로 구분.","ex":[["Her [[proficiency in English]] is excellent.","그녀의 [[영어 능숙함]]은 훌륭하다."],["You need a high level of [[proficiency]].","너는 높은 수준의 [[숙달]]이 필요하다."],["A test shows his [[language proficiency]].","시험은 그의 [[언어 능숙도]]를 보여 준다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"fatal","a":"4","e":"fatal (형) 치명적인 - fatality (명) 사망자, 사망률\n④ brutal (형) 잔인한, 잔혹한 - brutality (명) 잔인함, 잔혹 행위","w":"① imitate (동) 모방하다, 흉내 내다 - imitation (명) 모방, 모조품\n② conform (동) 순응하다, 따르다 - conformity (명) 순응, 따름\n③ deduce (동) 추론하다, 연역하다 - deduction (명) 추론, 연역","m":0,"s":"fatal - fatality","c":["imitate - imitation","conform - conformity","deduce - deduction","brutal - brutality"],"mn":"치명적인","hk":"fatal(치명적인, 형)에서 fatality(사망자, 명)로 가는 형용사에서 명사 방향. brutal(잔인한, 형)에서 brutality(잔인함, 명)가 같고 나머지는 동사에서 명사.","ex":[["A [[fatal mistake]] cost him the game.","[[치명적인 실수]]가 그에게 경기를 잃게 했다.","fatal (형) 치명적인"],["The crash caused ten [[fatalities]].","그 충돌은 열 명의 [[사망자]]를 냈다.","fatality (명) 사망자, 사망률"],["The [[brutal attack]] shocked the town.","그 [[잔인한 공격]]은 마을을 충격에 빠뜨렸다.","brutal (형) 잔인한, 잔혹한"],["People protested against police [[brutality]].","사람들은 경찰의 [[잔혹 행위]]에 항의했다.","brutality (명) 잔인함, 잔혹 행위"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"respectively","a":"2","e":"② respectively: 각각, 각자 (첫 번째와 두 번째 그룹은 각각 85점과 90점을 받았다.)","w":"① relatively: 상대적으로\n③ repeatedly: 반복적으로\n④ respectfully: 정중하게","k":"첫 번째와 두 번째 그룹은 각각 85점과 90점을 받았다.","m":0,"s":"The first and second groups scored 85 and 90 points ________.","c":["relatively","respectively","repeatedly","respectfully"],"mn":"각각, 각자","hk":"respectively(각각)는 앞의 두 대상을 순서대로 짝지을 때 씀. relatively(상대적으로)·repeatedly(반복적으로)·respectfully(정중하게)는 철자만 닮음.","ex":[["Tom and Ann are ten and twelve years old, [[respectively]].","톰과 앤은 [[각각]] 열 살과 열두 살이다."],["The red and blue boxes cost five and eight dollars, [[respectively]].","빨간 상자와 파란 상자는 [[각각]] 5달러와 8달러이다."],["The two cars are from Japan and Korea, [[respectively]].","그 두 차는 [[각각]] 일본과 한국산이다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"palm","a":"palm","e":"palm (명) 손바닥 / (명) 야자수","k":"점쟁이는 말을 꺼내기 전에 그 늙은 선원의 거친 손바닥에 있는 깊은 선들을 살펴보았다.\n키 큰 야자수들이 열대 리조트로 이어지는 먼지투성이 도로를 따라 줄지어 서 있었다.","m":0,"s":"The fortune teller studied the deep lines on the old sailor's rough p______ before she spoke.\nRows of tall p______ trees lined the dusty road that led to the tropical resort.","mn":"손바닥 / 야자수","hk":"palm(손바닥)과 palm(야자수)은 철자가 같고, 야자 잎이 손바닥을 닮아서 이름이 같음. palm tree(야자수)로 구분.","ex":[["He held a small bird in [[the palm]] of his hand.","그는 작은 새를 [[손바닥]] 위에 올려놓았다.","palm (명) 손바닥"],["My [[palms]] get sweaty when I'm nervous.","긴장하면 내 [[손바닥]]에 땀이 난다.","palm (명) 손바닥"],["We rested under a tall [[palm tree]].","우리는 키 큰 [[야자수]] 아래에서 쉬었다.","palm (명) 야자수"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"outdated","a":"3","e":"③ obsolete: 구식의, 더 이상 쓸모없는 (그 공장은 기본적인 안전 기준조차 충족하지 못하는 구식 기계에 여전히 의존한다.) / outdated(구식의, 시대에 뒤진)의 유의어.","w":"① worn: 닳은, 해진\n② shabby: 허름한, 초라한\n④ faded: 빛바랜","k":"그 공장은 기본적인 안전 기준조차 충족하지 못하는 구식 기계에 여전히 의존한다.","m":0,"s":"The factory still relies on outdated machines that no longer meet basic safety standards.","h":"outdated","c":["worn","shabby","obsolete","faded"],"mn":"구식의, 시대에 뒤진","hk":"outdated(구식의)는 obsolete(구식의, 쓸모없는)와 같은 편. worn(닳은)·shabby(허름한)·faded(빛바랜)는 낡은 겉모습일 뿐이라 속임수.","ex":[["The company uses [[outdated software]].","그 회사는 [[구식 소프트웨어]]를 쓴다."],["Those rules are [[outdated]] and need to change.","그 규칙들은 [[시대에 뒤떨어져]] 바뀌어야 한다."],["[[Outdated ideas]] slow down progress.","[[낡은 생각]]은 발전을 늦춘다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"canopy","a":"canopy","e":"canopy 수관(樹冠), 덮개","k":"위쪽의 두꺼운 수관층이 햇빛을 거의 다 막기 때문에 햇빛은 숲 바닥에 좀처럼 닿지 않는다.","m":0,"s":"Sunlight rarely reaches the forest floor because the thick c______ above blocks almost all of it.","mn":"수관(樹冠), 덮개","hk":"canopy(수관)는 숲 위쪽을 덮는 나뭇잎 층이고, 침대 위 덮개도 canopy(덮개). 철자는 can-o-py로 끊어 기억.","ex":[["Monkeys jump through [[the forest canopy]].","원숭이들은 [[숲의 수관]]을 뛰어다닌다."],["The bed had a white [[canopy]] above it.","그 침대 위에는 흰 [[덮개]]가 있었다."],["[[A canopy of leaves]] covered the path.","[[나뭇잎 덮개]]가 길을 덮고 있었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"ridiculous","a":"1","e":"① reasonable: 합리적인, 타당한 (늦은 것에 대한 그의 설명은 방 안의 모두에게 완전히 터무니없게 들렸다.) / ridiculous(터무니없는, 말도 안 되는)의 반의어.","w":"② laughable: 웃기는, 어이없는\n③ nonsensical: 말도 안 되는\n④ outrageous: 터무니없는, 어처구니없는","k":"늦은 것에 대한 그의 설명은 방 안의 모두에게 완전히 터무니없게 들렸다.","m":0,"s":"His explanation for being late sounded completely ridiculous to everyone in the room.","h":"ridiculous","c":["reasonable","laughable","nonsensical","outrageous"],"mn":"터무니없는, 말도 안 되는","hk":"ridiculous(터무니없는)의 반대편은 reasonable(합리적인). laughable(웃기는)·nonsensical(말도 안 되는)·outrageous(어처구니없는)는 같은 편 속임수.","ex":[["That is a [[ridiculous idea]].","그것은 [[터무니없는 생각]]이다.","ridiculous (형) 터무니없는, 말도 안 되는"],["They asked for [[a ridiculous price]].","그들은 [[터무니없는 가격]]을 요구했다.","ridiculous (형) 터무니없는, 말도 안 되는"],["The shop sells good food at [[a reasonable price]].","그 가게는 좋은 음식을 [[합리적인 가격]]에 판다.","reasonable (형) 합리적인, 타당한"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"liable","a":"1","e":"① liable: 책임이 있는, ~하기 쉬운","w":"② 유연한, 융통성 있는(flexible)\n③ 알아볼 수 있는, 뚜렷한(legible)\n④ 믿을 만한, 신뢰할 수 있는(reliable)","m":0,"s":"liable","c":["책임이 있는, ~하기 쉬운","유연한, 융통성 있는","알아볼 수 있는, 뚜렷한","믿을 만한, 신뢰할 수 있는"],"mn":"책임이 있는, ~하기 쉬운","hk":"liable(책임이 있는, ~하기 쉬운)은 reliable(믿을 만한)에서 앞부분을 뺀 꼴이지만 뜻이 다름. flexible(유연한)·legible(알아볼 수 있는)은 속임수.","ex":[["The owner is [[liable for]] the damage.","주인이 그 피해에 [[책임이 있다]].","liable (형) 책임이 있는"],["Glass is [[liable to break]].","유리는 [[깨지기 쉽다]].","liable (형) ~하기 쉬운"],["People are [[liable to make]] mistakes when tired.","사람들은 피곤하면 실수를 [[하기 쉽다]].","liable (형) ~하기 쉬운"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"precisely","a":"3","e":"③ precisely: 정확히, 바로 (바로 그 단순함 때문에 그 아이디어는 널리 채택되었다.)","w":"① roughly: 대략, 거칠게\n② barely: 간신히, 거의 ~아니다\n④ gradually: 점차, 서서히","k":"바로 그 단순함 때문에 그 아이디어는 널리 채택되었다.","m":0,"s":"It is ________ because of its simplicity that the idea was widely adopted.","c":["roughly","barely","precisely","gradually"],"mn":"정확히, 바로","hk":"precisely(정확히, 바로)는 precise(정확한)의 부사형. roughly(대략)·barely(간신히)·gradually(점차)는 정확함과 거리가 먼 속임수.","ex":[["The meeting starts at [[precisely nine o'clock]].","회의는 [[정확히 아홉 시]]에 시작한다."],["I called you for [[precisely that reason]].","나는 [[바로 그 이유]]로 네게 전화했다."],["She explained the rule [[very precisely]].","그녀는 그 규칙을 [[아주 정확하게]] 설명했다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"exclaimed","a":"2","e":"② shouted: 소리치다, 외치다 (shout의 과거형) (아이들은 밖에 첫눈이 내리는 것을 본 순간 기뻐서 소리쳤다.) / exclaim(외치다, 소리쳐 말하다)의 유의어.","w":"① mumbled: 우물거리며 말하다 (mumble의 과거형)\n③ muttered: 투덜거리듯 웅얼거리다 (mutter의 과거형)\n④ murmured: 낮게 중얼거리다 (murmur의 과거형)","k":"아이들은 밖에 첫눈이 내리는 것을 본 순간 기뻐서 소리쳤다.","m":0,"s":"The children exclaimed with joy the moment they saw the first snow falling outside.","h":"exclaimed","c":["mumbled","shouted","muttered","murmured"],"mn":"외치다, 소리쳐 말하다","wb":"exclaim","hk":"exclaim(외치다)은 shout(소리치다)와 같은 편. mumble(우물거리다)·mutter(투덜거리다)·murmur(중얼거리다)는 작게 말하는 반대편 속임수.","ex":[["'What a view!' she [[exclaimed]].","'정말 멋진 경치야!' 하고 그녀가 [[외쳤다]]."],["He [[exclaimed with delight]].","그는 [[기뻐서 소리쳤다]]."],["The fans [[exclaimed in surprise]].","팬들은 [[놀라서 소리쳤다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"liberate","a":"4","e":"④ liberate: (누군가를 풀어 주어 자유롭게 하다 / 어떤 장소나 상황으로부터 / 그들의 자유가 빼앗긴) 해방하다, 자유롭게 하다","w":"① restrain: 억제하다, 제지하다\n② isolate: 고립시키다\n③ confine: 가두다, 제한하다","k":"누군가를 풀어 주어 자유롭게 하다 / 어떤 장소나 상황으로부터 / 그들의 자유가 빼앗긴","m":0,"s":"\"to set someone free from a place or a situation in which their freedom has been taken away\"","c":["restrain","isolate","confine","liberate"],"mn":"해방하다, 자유롭게 하다","hk":"liberate(해방하다)는 liberty(자유)와 한 가족. restrain(억제하다)·confine(가두다)·isolate(고립시키다)는 자유를 막는 반대 속임수.","ex":[["Soldiers [[liberated the city]].","군인들은 [[도시를 해방했다]]."],["The army came to [[liberate the prisoners]].","군대는 [[포로들을 풀어 주러]] 왔다."],["New ideas can [[liberate people from]] old fears.","새로운 생각은 사람들을 오랜 두려움에서 [[해방시킬]] 수 있다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"stripe","a":"stripe","e":"stripe 줄무늬","k":"그 옛 국기에는 중앙을 가로질러 곧게 뻗은 붉은 줄무늬 하나가 있었다.","m":0,"s":"The old national flag had a single red s______ running straight across its center.","mn":"줄무늬","hk":"stripe(줄무늬)는 strip(길고 얇은 조각)에 끝 e를 더한 꼴이라 e를 빠뜨리지 않기. 줄무늬 여러 개는 stripes(줄무늬들).","ex":[["A zebra has [[black and white stripes]].","얼룩말은 [[검은색과 흰색 줄무늬]]를 가지고 있다."],["He wore a shirt with [[blue stripes]].","그는 [[파란 줄무늬]]가 있는 셔츠를 입었다."],["[[A white stripe]] runs along the road.","[[흰 줄무늬]] 하나가 길을 따라 나 있다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"minutes","a":"1","e":"①회의록 / ②분 / ③분 / ④분, 잠깐 [①번만 의미가 다름]","k":"①비서는 어제 있었던 긴 이사회의 회의록을 타이핑해서 정리했다.\n②공항행 기차는 20분마다 시내 역을 출발한다.\n③그녀는 그 보고서 전체를 1분도 안 되어 다 읽었다.\n④호텔 예약을 확인하는 동안 잠깐만 기다려 주세요.","m":0,"c":["The secretary typed up the minutes of yesterday's long board meeting.","The airport train leaves the downtown station every twenty minutes.","She finished reading the whole report in less than a minute.","Please wait a minute while I check your hotel reservation."],"hc":"minutes|minutes|minute|minute","mn":"분 / 회의록","hk":"①번 minutes(회의록)만 회의를 적은 문서. 나머지는 시간 단위 minute(분)이고 a minute(잠깐)도 같은 시간 뜻.","ex":[["The class ends in [[five minutes]].","수업은 [[오 분]] 뒤에 끝난다.","minute (명) 분, 잠깐"],["Please wait [[a minute]].","[[잠깐]] 기다려 주세요.","minute (명) 분, 잠깐"],["She read [[the minutes]] of last week's meeting.","그녀는 지난주 회의의 [[회의록]]을 읽었다.","minutes (명) 회의록"]]}]},{"day":45,"q":[{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"inherent","a":"1","e":"① acquired: 후천적으로 얻은, 습득된 (일부 과학자들은 음악에 대한 재능이 서서히 길러지는 것이 아니라 타고나는 것이라고 주장한다.) / inherent(타고난, 본래부터 갖고 있는)의 반의어.","w":"② intrinsic: 본질적인, 내재하는\n③ innate: 타고난\n④ inborn: 선천적인","k":"일부 과학자들은 음악에 대한 재능이 서서히 길러지는 것이 아니라 타고나는 것이라고 주장한다.","m":0,"s":"Some scientists argue that a talent for music is inherent rather than slowly developed.","h":"inherent","c":["acquired","intrinsic","innate","inborn"],"mn":"타고난, 본래부터 갖고 있는","hk":"inherent(타고난)의 반대편은 acquired(후천적으로 얻은). intrinsic(본질적인)·innate(타고난)·inborn(선천적인)은 모두 타고난 편이라 속임수.","ex":[["Risk is [[inherent in]] every business.","위험은 모든 사업에 [[본래부터 있다]].","inherent (형) 타고난, 본래부터 갖고 있는"],["Curiosity is [[an inherent quality]] of children.","호기심은 아이들의 [[타고난 특성]]이다.","inherent (형) 타고난, 본래부터 갖고 있는"],["Good manners are [[an acquired skill]].","예절은 [[후천적으로 익힌 기술]]이다.","acquired (형) 후천적으로 얻은, 습득된"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"rebuke","a":"2","e":"② rebuke: (누군가에게 화를 내며 말하다 / 그들이 잘못된 일을 했기 때문에) 꾸짖다, 책망하다","w":"① soothe: 달래다, 진정시키다\n③ interrogate: 심문하다\n④ flatter: 아첨하다","k":"누군가에게 화를 내며 말하다 / 그들이 잘못된 일을 했기 때문에","m":0,"s":"\"to speak angrily to someone because they have done something wrong\"","c":["soothe","rebuke","interrogate","flatter"],"mn":"꾸짖다, 책망하다","hk":"rebuke(꾸짖다)는 화내며 잘못을 지적함. soothe(달래다)·flatter(아첨하다)는 부드럽게 대하는 반대편이고 interrogate(심문하다)는 캐묻기만 하는 속임수.","ex":[["The teacher [[rebuked]] him for being late.","선생님은 지각했다고 그를 [[꾸짖었다]]."],["The coach [[rebuked the players]] after the game.","코치는 경기 후 [[선수들을 꾸짖었다]]."],["He was [[publicly rebuked]] by his boss.","그는 상사에게 [[공개적으로 꾸지람을 들었다]]."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"code","a":"code","e":"code (명) 규약, 법전 / (명) 암호","k":"그 직종의 모든 구성원은 고객을 대할 때 엄격한 윤리 규약을 따라야 한다.\n전쟁 중에 메시지들은 적이 끝내 해독하지 못한 비밀 암호로 작성되었다.","m":0,"s":"Every member of the profession must follow a strict ethical c______ when dealing with clients.\nDuring the war, messages were written in a secret c______ that the enemy never managed to break.","mn":"규약, 법전 / 암호","hk":"code(규약, 법전)와 code(암호)는 철자가 같음. dress code(복장 규정)는 규약, secret code(비밀 암호)는 암호로 짝을 구분.","ex":[["Our school has a strict [[dress code]].","우리 학교에는 엄격한 [[복장 규정]]이 있다.","code (명) 규약, 법전"],["Doctors follow a [[code of conduct]].","의사들은 [[행동 규약]]을 따른다.","code (명) 규약, 법전"],["They used a [[secret code]] to send messages.","그들은 메시지를 보내려고 [[비밀 암호]]를 썼다.","code (명) 암호"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"oblivion","a":"1","e":"① oblivion: 망각, 잊혀짐","w":"② nostalgia: 향수, 그리움\n③ solitude: 고독, 홀로 있음\n④ remorse: 후회, 자책","m":0,"s":"\"망각, 잊혀짐\"","c":["oblivion","nostalgia","solitude","remorse"],"mn":"망각, 잊혀짐","hk":"oblivion(망각)은 fall into oblivion(잊혀지다)으로 자주 씀. nostalgia(향수)는 옛일을 기억하는 쪽이라 반대 속임수.","ex":[["The old song [[fell into oblivion]].","그 옛 노래는 [[잊혀졌다]]."],["Many artists have [[faded into oblivion]].","많은 예술가들이 [[망각 속으로 사라졌다]]."],["The ancient city was saved from [[oblivion]].","그 고대 도시는 [[망각]]에서 구해졌다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"devoted","a":"2,3","e":"② committed: 헌신하다, 전념하다 (commit의 과거형) (그녀는 작은 고향 주변의 숲을 지키는 데 평생을 바쳤다.) / devote(바치다, 전념하다)의 유의어.\n③ dedicated: 바치다, 헌신하다 (dedicate의 과거형)","w":"① entrusted: 맡기다 (entrust의 과거형)\n④ assigned: 배정하다 (assign의 과거형)","k":"그녀는 작은 고향 주변의 숲을 지키는 데 평생을 바쳤다.","m":2,"s":"She devoted her entire life to protecting the forests around her small hometown.","h":"devoted","c":["entrusted","committed","dedicated","assigned"],"mn":"바치다, 전념하다","wb":"devote","hk":"devote(바치다)의 유의어는 commit(전념하다)과 dedicate(헌신하다). entrust(맡기다)·assign(배정하다)은 일을 남에게 주는 쪽이라 속임수.","ex":[["She [[devoted her life to]] helping others.","그녀는 남을 돕는 데 [[평생을 바쳤다]].","devote (동) 바치다, 전념하다"],["He is [[committed to]] his work.","그는 일에 [[전념하고 있다]].","commit (동) 헌신하다, 전념하다"],["The doctor [[dedicated her time to]] sick children.","그 의사는 아픈 아이들에게 [[시간을 바쳤다]].","dedicate (동) 바치다, 헌신하다"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"false","a":"4","e":"false (형) 거짓의, 잘못된 - falsify (동) 위조하다, 조작하다\n④ diverse (형) 다양한 - diversify (동) 다양화하다","w":"① patron (명) 후원자, 단골손님 - patronize (동) 후원하다, 단골로 이용하다\n② author (명) 저자, 작가 - authorize (동) 권한을 부여하다, 인가하다\n③ jeopardy (명) 위험 - jeopardize (동) 위태롭게 하다","m":0,"s":"false - falsify","c":["patron - patronize","author - authorize","jeopardy - jeopardize","diverse - diversify"],"mn":"거짓의, 잘못된","hk":"false(거짓의, 형)에서 falsify(위조하다, 동)로 가는 형용사에서 동사 방향. diverse(다양한, 형)에서 diversify(다양화하다, 동)가 같고 나머지는 명사에서 동사.","ex":[["He gave the police [[false information]].","그는 경찰에게 [[거짓 정보]]를 주었다.","false (형) 거짓의, 잘못된"],["They tried to [[falsify the records]].","그들은 [[기록을 위조하려]] 했다.","falsify (동) 위조하다, 조작하다"],["The city has a [[diverse population]].","그 도시에는 [[다양한 사람들]]이 산다.","diverse (형) 다양한"],["The shop plans to [[diversify its products]].","그 가게는 [[제품을 다양화할]] 계획이다.","diversify (동) 다양화하다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"vulnerability","a":"1","e":"① vulnerability: 취약성 (감정에 솔직한 것은 취약성을 보여주지만 또한 강한 신뢰를 쌓아준다.)","w":"② hostility: 적대감\n③ stability: 안정성\n④ durability: 내구성","k":"감정에 솔직한 것은 취약성을 보여주지만 또한 강한 신뢰를 쌓아준다.","m":0,"s":"Being honest about feelings shows ________, but it also builds strong trust.","c":["vulnerability","hostility","stability","durability"],"mn":"취약성","hk":"vulnerability(취약성)는 vulnerable(취약한)의 명사형. hostility(적대감)·stability(안정성)·durability(내구성)는 끝이 같아 끝만 보고 고르지 않기.","ex":[["The test found [[a vulnerability]] in the system.","그 검사는 시스템의 [[취약점]]을 찾아냈다."],["She showed her [[vulnerability]] to her friends.","그녀는 친구들에게 자신의 [[약한 모습]]을 보였다."],["Poverty increases children's [[vulnerability to disease]].","가난은 아이들의 [[질병에 대한 취약성]]을 높인다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"radiation","a":"radiation","e":"radiation 방사선, 복사","k":"장기 임무를 수행하는 우주비행사들은 심우주를 가득 채운 우주 방사선으로부터 보호받아야 한다.","m":0,"s":"Astronauts on long missions must be shielded from the cosmic r______ that fills deep space.","mn":"방사선, 복사","hk":"radiation(방사선)은 radiate(내뿜다)에서 e를 빼고 -ion을 붙인 꼴. radi-a-tion으로 끊어 철자를 기억.","ex":[["The [[radiation level]] near the plant is safe.","발전소 근처의 [[방사선 수치]]는 안전하다."],["[[Solar radiation]] warms the Earth.","[[태양 복사]]는 지구를 데운다."],["Doctors use [[radiation]] to treat cancer.","의사들은 암을 치료하려고 [[방사선]]을 쓴다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"mortality","a":"2","e":"② mortality: 필멸성, 사망률","w":"① 도덕성, 도덕적 원칙(morality)\n③ 유동성, 액체 상태(fluidity)\n④ 이동성, 기동성(mobility)","m":0,"s":"mortality","c":["도덕성, 도덕적 원칙","필멸성, 사망률","유동성, 액체 상태","이동성, 기동성"],"mn":"필멸성, 사망률","hk":"mortality(필멸성, 사망률)는 죽음을 뜻하는 뿌리를 가져 mortal(죽을 수밖에 없는)과 한 가족. morality(도덕성)는 철자만 닮은 속임수.","ex":[["Old age reminds us of our [[mortality]].","노년은 우리에게 [[필멸성]]을 떠올리게 한다.","mortality (명) 필멸성"],["The child [[mortality rate]] has fallen.","아동 [[사망률]]이 떨어졌다.","mortality (명) 사망률"],["[[Infant mortality]] is low in this country.","이 나라는 [[영아 사망률]]이 낮다.","mortality (명) 사망률"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"masculine","a":"4","e":"④ feminine: 여성스러운 (그 디자이너는 새 제품군에 너무 남성적으로 보이는 색은 모두 피했다.) / masculine(남성스러운, 남자다운)의 반의어.","w":"① manly: 남자다운\n② rugged: 거친, 우락부락한\n③ male: 남성의","k":"그 디자이너는 새 제품군에 너무 남성적으로 보이는 색은 모두 피했다.","m":0,"s":"The designer avoided every color that looked too masculine for the new product line.","h":"masculine","c":["manly","rugged","male","feminine"],"mn":"남성스러운, 남자다운","hk":"masculine(남성스러운)의 반대편은 feminine(여성스러운). manly(남자다운)·male(남성의)·rugged(거친)는 같은 남성 쪽이라 속임수.","ex":[["He has a deep, [[masculine voice]].","그는 깊고 [[남성적인 목소리]]를 가졌다.","masculine (형) 남성스러운, 남자다운"],["The brand uses dark, [[masculine colors]].","그 브랜드는 어둡고 [[남성적인 색]]을 쓴다.","masculine (형) 남성스러운, 남자다운"],["She wore a [[feminine dress]] to the party.","그녀는 파티에 [[여성스러운 드레스]]를 입고 갔다.","feminine (형) 여성스러운"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"negate","a":"3","e":"③ negate: (어떤 것이 효력이나 가치를 완전히 잃게 만들다) 무효화하다, 부정하다","w":"① sustain: 지속시키다, 유지하다\n② amplify: 증폭시키다\n④ reinforce: 보강하다, 강화하다","k":"어떤 것이 효력이나 가치를 완전히 잃게 만들다","m":0,"s":"\"to make something lose its effect or value completely\"","c":["sustain","amplify","negate","reinforce"],"mn":"무효화하다, 부정하다","hk":"negate(무효화하다)는 negative(부정적인)와 한 가족. amplify(증폭시키다)·reinforce(보강하다)·sustain(유지하다)은 힘을 키우는 반대편 속임수.","ex":[["Bad weather can [[negate]] all our hard work.","나쁜 날씨는 우리의 모든 노력을 [[무효로 만들]] 수 있다."],["One mistake may [[negate the benefits]] of the plan.","한 번의 실수는 그 계획의 [[이점을 무효화할]] 수 있다."],["Junk food can [[negate the effect]] of exercise.","정크푸드는 운동의 [[효과를 없앨]] 수 있다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"tariff","a":"tariff","e":"tariff 관세","k":"정부는 국내 공장을 보호하기 위해 수입 철강에 대한 관세를 인상했다.","m":0,"s":"The government raised the t______ on imported steel to protect factories at home.","mn":"관세","hk":"tariff(관세)는 끝 글자를 두 번 쓰는 철자. impose a tariff(관세를 부과하다)가 대표 짝.","ex":[["The country put [[a high tariff]] on cars.","그 나라는 자동차에 [[높은 관세]]를 매겼다."],["Trade [[tariffs]] raise the price of goods.","무역 [[관세]]는 물건 가격을 올린다."],["They agreed to lower the [[import tariff]].","그들은 [[수입 관세]]를 낮추기로 합의했다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"oversee","a":"3","e":"③ supervise: 감독하다, 관리하다 (선임 기술자 한 명이 새 다리의 건설을 감독하기 위해 채용되었다.) / oversee(감독하다, 총괄하다)의 유의어.","w":"① overtake: 추월하다\n② undergo: 겪다, 받다\n④ overhear: 우연히 듣다","k":"선임 기술자 한 명이 새 다리의 건설을 감독하기 위해 채용되었다.","m":0,"s":"A senior engineer was hired to oversee the construction of the new bridge.","h":"oversee","c":["overtake","undergo","supervise","overhear"],"mn":"감독하다, 총괄하다","hk":"oversee(감독하다)는 over(위에서)와 see(보다)가 합쳐진 말. supervise(감독하다)와 같은 편이고 overtake(추월하다)·overhear(우연히 듣다)는 속임수.","ex":[["A manager will [[oversee]] the project.","관리자가 그 프로젝트를 [[감독할]] 것이다."],["She [[oversees the staff]] at the hospital.","그녀는 병원의 [[직원들을 총괄한다]]."],["He was chosen to [[oversee the election]].","그는 [[선거를 감독하도록]] 선택되었다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"replacement","a":"3","e":"③ replacement: 대체품, 교체 (고장 난 기계는 생산을 계속하기 위해 즉각적인 대체품이 필요하다.)","w":"① refinement: 정제, 개선\n② resentment: 분개, 억울함\n④ retirement: 은퇴","k":"고장 난 기계는 생산을 계속하기 위해 즉각적인 대체품이 필요하다.","m":0,"s":"The broken machine requires an immediate ________ to continue production.","c":["refinement","resentment","replacement","retirement"],"mn":"대체품, 교체","hk":"replacement(대체품)는 replace(교체하다)에 -ment(명사 꼬리)가 붙은 꼴. refinement(정제)·resentment(분개)·retirement(은퇴)는 모양만 닮음.","ex":[["I need [[a replacement]] for my broken phone.","나는 고장 난 휴대폰의 [[대체품]]이 필요하다."],["[[Replacement parts]] are sold here.","[[교체 부품]]을 여기서 판다."],["[[The replacement of]] old pipes will take a week.","낡은 배관의 [[교체]]는 일주일이 걸릴 것이다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"sounded","a":"2","e":"①~하게 들리다 / ②(경보를) 울리다 / ③~하게 들리다 / ④~인 것 같다, ~하게 들리다 [②번만 의미가 다름]","k":"①토요일 밤 긴 리허설 후에 그녀의 목소리는 지친 것처럼 들렸다.\n②그 경비원은 복도에서 연기를 본 순간 경보를 울렸다.\n③지연에 대한 그의 변명은 회의에 있던 모두에게 이상하게 들렸다.\n④새 안전 계획은 대부분의 공장 직원들에게 현실적으로 들린다.","m":0,"c":["Her voice sounded tired after the long rehearsal on Saturday night.","The guard sounded the alarm the moment he saw smoke in the hallway.","His excuse for the delay sounded strange to everyone at the meeting.","The new safety plan sounds practical to most of the factory staff."],"hc":"sounded|sounded|sounded|sounds","mn":"~하게 들리다 / (경보를) 울리다","hk":"②번 sound the alarm(경보를 울리다)만 소리를 내는 뜻. 나머지는 sound(~하게 들리다) 뒤에 tired(피곤한) 같은 말이 와서 느낌을 전함.","ex":[["That idea [[sounds good]] to me.","그 생각은 내게 [[좋게 들린다]].","sound (동) ~하게 들리다"],["Her voice [[sounded excited]].","그녀의 목소리는 [[들뜬 것처럼 들렸다]].","sound (동) ~하게 들리다"],["The guard [[sounded the alarm]].","경비원이 [[경보를 울렸다]].","sound (동) (경보를) 울리다"]]}]},{"day":46,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"alleviate","a":"3","e":"③ mitigate: 완화하다, 경감하다 (이 새 약은 환자들이 경험하는 만성 통증 증상을 크게 완화할 수 있다.) / alleviate(완화하다, 덜어 주다)의 유의어.","w":"① exacerbate: 악화시키다, 심화시키다\n② aggravate: 악화시키다, 더 심하게 만들다\n④ augment: 늘리다, 증가시키다","k":"이 새 약은 환자들이 경험하는 만성 통증 증상을 크게 완화할 수 있다.","m":0,"s":"This new medication can significantly alleviate the chronic pain symptoms experienced by patients.","h":"alleviate","c":["exacerbate","aggravate","mitigate","augment"],"mn":"완화하다, 덜어 주다","hk":"alleviate(완화하다)의 같은 편은 mitigate(완화하다). exacerbate(악화시키다)·aggravate(악화시키다)는 반대 방향 속임수.","ex":[["This tea can [[alleviate the pain]] in your throat.","이 차는 목의 [[통증을 덜어 줄]] 수 있다."],["Cold water helped [[alleviate his stress]] a little.","찬물이 그의 [[스트레스를 조금 덜어 주는]] 데 도움이 되었다."],["New roads will [[alleviate traffic problems]] in the city.","새 도로가 도시의 [[교통 문제를 완화해]] 줄 것이다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"plight","a":"2","e":"② plight: (어렵고 괴로운 상황 / 한 사람이나 집단이 겪고 있는) 곤경, 어려운 처지","w":"① setback: 차질, 후퇴, 좌절\n③ impediment: 장벽, 방해물\n④ repercussion: 영향, 파장","k":"어렵고 괴로운 상황 / 한 사람이나 집단이 겪고 있는","m":0,"s":"\"a difficult and unpleasant situation that a person or group is suffering from\"","c":["setback","plight","impediment","repercussion"],"mn":"곤경, 어려운 처지","hk":"plight(곤경)는 괴롭고 어려운 처지. setback(차질)은 일이 막힌 것, impediment(장벽)는 길을 막는 방해물이라 뜻이 다름.","ex":[["Many people felt sorry for [[the plight of refugees]].","많은 사람이 [[난민들의 곤경]]을 안타깝게 여겼다."],["Everyone pitied [[her sad plight]] after the fire.","모두가 화재 뒤 [[그녀의 딱한 처지]]를 불쌍히 여겼다."],["Farmers in [[a desperate plight]] asked the government for help.","[[절박한 곤경]]에 처한 농부들이 정부에 도움을 요청했다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"scrutinize","a":"1","e":"① scrutinize: 면밀히 조사하다","w":"② extrapolate: 추정하다, 외삽하다\n③ ascertain: 확인하다, 알아내다\n④ delineate: 상세히 묘사하다, 윤곽을 그리다","m":0,"s":"\"면밀히 조사하다\"","c":["scrutinize","extrapolate","ascertain","delineate"],"mn":"면밀히 조사하다","hk":"scrutinize(면밀히 조사하다)는 샅샅이 살펴보는 느낌. ascertain(확인하다)·delineate(상세히 묘사하다)는 뜻이 다른 속임수.","ex":[["Teachers [[scrutinize every answer]] before giving grades.","교사들은 점수를 주기 전에 [[모든 답을 면밀히 살핀다]]."],["The police will [[scrutinize the video]] for clues.","경찰은 단서를 찾으려고 [[영상을 면밀히 조사할]] 것이다."],["Please [[scrutinize the contract]] before you sign it.","서명하기 전에 [[계약서를 꼼꼼히 살펴]] 보세요."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"articulate","a":"articulate","e":"articulate (동) 또렷이 표현하다 / (형) (말을) 잘하는, 분명한","k":"가장 경험이 많은 증인조차 그날 밤 자신이 본 것을 정확히 표현해 내는 데 애를 먹었다.\n그는 아주 말을 잘하는 토론자여서 상대편조차 그의 명료함에 감탄한다.","m":0,"s":"Even the most experienced witness struggled to a______ exactly what she had seen that night.\nHe is such an a______ debater that even his opponents admire his clarity.","mn":"또렷이 표현하다 / 잘하는, 분명한","hk":"articulate(또렷이 표현하다, 동사)와 articulate(말을 잘하는, 형용사)는 철자가 같고 품사에 따라 뜻이 갈림. 둘 다 또렷함이 핵심.","ex":[["She tried to [[articulate her feelings]] clearly.","그녀는 자기 [[감정을 또렷이 표현하려고]] 애썼다.","articulate (동) 또렷이 표현하다"],["He found it hard to [[articulate his ideas]] in English.","그는 영어로 [[자기 생각을 또렷이 표현하기]] 어렵다고 느꼈다.","articulate (동) 또렷이 표현하다"],["She is [[an articulate speaker]] who explains things well.","그녀는 사물을 잘 설명하는 [[말 잘하는 연설가]]이다.","articulate (형) 말을 잘하는, 분명한"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"adamant","a":"3","e":"③ yielding: 순순히 따르는, 양보하는 (동료들의 반복적인 요청에도 불구하고 그녀는 결정을 바꾸지 않겠다는 단호한 태도를 유지했다.) / adamant(완강한, 단호한)의 반의어.","w":"① resolute: 단호한, 결연한\n② tenacious: 끈질긴, 고집스러운\n④ obstinate: 고집 센, 완강한","k":"동료들의 반복적인 요청에도 불구하고 그녀는 결정을 바꾸지 않겠다는 단호한 태도를 유지했다.","m":0,"s":"Despite repeated requests from colleagues, she remained adamant about not changing her decision.","h":"adamant","c":["resolute","tenacious","yielding","obstinate"],"mn":"완강한, 단호한","hk":"adamant(완강한)의 반대편은 yielding(순순히 따르는). resolute(단호한)·tenacious(끈질긴)·obstinate(고집 센)는 같은 편 속임수.","ex":[["He is [[adamant about leaving early]].","그는 [[일찍 떠나겠다고 완강하다]].","adamant (형) 완강한, 단호한"],["The boss was [[adamant in his refusal]].","사장은 [[완강하게 거절했다]].","adamant (형) 완강한, 단호한"],["Her [[yielding attitude]] made the talks easy.","그녀의 [[순순히 따르는 태도]] 덕에 협상이 쉬웠다.","yielding (형) 순순히 따르는, 양보하는"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"momentum","a":"1","e":"① momentum: 추진력, 동력 (그 사회 개혁 캠페인은 지도자의 감동적인 연설 이후 빠르게 상당한 추진력을 얻었다.)","w":"② friction: 마찰, 마찰력\n③ inertia: 관성, 타성\n④ stagnation: 정체, 침체","k":"그 사회 개혁 캠페인은 지도자의 감동적인 연설 이후 빠르게 상당한 추진력을 얻었다.","m":0,"s":"The social reform campaign quickly gained significant ________ after the leader's inspiring speech.","c":["momentum","friction","inertia","stagnation"],"mn":"추진력, 동력","hk":"momentum(추진력)은 gain momentum(추진력을 얻다) 짝으로 기억. friction(마찰)·inertia(관성)·stagnation(정체)은 힘을 늦추는 쪽.","ex":[["The team began to [[gain momentum]] in the second half.","그 팀은 후반전에 [[추진력을 얻기]] 시작했다."],["The plan [[lost momentum]] after the manager left.","그 계획은 매니저가 떠난 뒤 [[동력을 잃었다]]."],["We must [[keep up the momentum]] until the end.","우리는 끝까지 [[추진력을 유지해야]] 한다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"evoke","a":"3","e":"evoke (동) 불러일으키다, 환기시키다 - evocative (형) 연상시키는, 불러일으키는\n③ disrupt (동) 방해하다, 지장을 주다 - disruptive (형) 지장을 주는, 파괴적인","w":"① malice (명) 악의, 적의 - malicious (형) 악의적인\n② caprice (명) 변덕 - capricious (형) 변덕스러운\n④ peril (명) 위험 - perilous (형) 위험한","m":0,"s":"evoke - evocative","c":["malice - malicious","caprice - capricious","disrupt - disruptive","peril - perilous"],"mn":"불러일으키다, 환기시키다","hk":"evoke(불러일으키다)→evocative(연상시키는)는 동사에서 형용사로 가는 방향. disrupt(방해하다)→disruptive(지장을 주는)가 같고 나머지는 명사 출발.","ex":[["The old song can [[evoke memories]] of my childhood.","그 오래된 노래는 어린 시절의 [[기억을 불러일으킬]] 수 있다.","evoke (동) 불러일으키다, 환기시키다"],["The smell of bread is [[evocative of home]].","빵 냄새는 [[집을 연상시킨다]].","evocative (형) 연상시키는, 불러일으키는"],["Loud noise can [[disrupt the class]].","시끄러운 소리는 [[수업에 지장을 줄]] 수 있다.","disrupt (동) 방해하다, 지장을 주다"],["A [[disruptive student]] talked during the test.","[[지장을 주는 학생]] 한 명이 시험 중에 떠들었다.","disruptive (형) 지장을 주는, 파괴적인"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"resilience","a":"resilience","e":"resilience 회복력, 탄력성","k":"강한 회복력을 키우면 사람들이 고통스러운 실패로부터 빠르고 효과적으로 회복하는 데 도움이 된다.","m":0,"s":"Developing strong r______ helps people recover quickly and effectively from painful failures.","mn":"회복력, 탄력성","al":"resiliency","hk":"resilience(회복력)는 끝이 ance가 아니라 ience. 뜻은 recover(회복하다)와 함께 기억.","ex":[["Build [[resilience]] by learning from your mistakes.","실수에서 배우며 [[회복력]]을 길러라."],["Her [[resilience after failure]] surprised everyone.","그녀의 [[실패 뒤 회복력]]은 모두를 놀라게 했다."],["Children show [[great resilience]] in hard times.","아이들은 힘든 시기에 [[대단한 회복력]]을 보인다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"volatile","a":"4","e":"④ volatile: 불안정한, 변덕스러운","w":"① 유연한, 융통성 있는(flexible)\n② 오래 지속되는, 견고한(durable)\n③ 예측 가능한, 일정한(predictable)","m":0,"s":"volatile","c":["유연한, 융통성 있는","오래 지속되는, 견고한","예측 가능한, 일정한","불안정한, 변덕스러운"],"mn":"불안정한, 변덕스러운","hk":"volatile(불안정한)은 확 변하는 느낌. durable(오래 지속되는)·predictable(예측 가능한)은 안정적인 쪽, flexible(유연한)은 뜻이 다름.","ex":[["The price of oil is [[very volatile]].","석유 가격은 [[매우 불안정하다]]."],["He has [[a volatile temper]].","그는 [[변덕스러운 성미]]를 지녔다."],["Investors worry about [[a volatile market]].","투자자들은 [[불안정한 시장]]을 걱정한다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"apathy","a":"1,3","e":"① zeal: 열정, 열의\n③ fervor: 열정, 열의 (정치에 대한 대중의 커져 가는 무관심은 민주주의에 심각하고 지속적인 우려 사항이다.) / apathy(무관심, 냉담)의 반의어.","w":"② disregard: 무시, 등한시\n④ indifference: 무관심, 냉담","k":"정치에 대한 대중의 커져 가는 무관심은 민주주의에 심각하고 지속적인 우려 사항이다.","m":2,"s":"Growing public apathy toward politics is a serious and lasting concern for democracy.","h":"apathy","c":["zeal","disregard","fervor","indifference"],"mn":"무관심, 냉담","hk":"apathy(무관심)의 반대편은 열정, zeal(열정)·fervor(열정). disregard(무시)·indifference(무관심)는 같은 편 속임수.","ex":[["The teacher worried about student [[apathy toward reading]].","교사는 학생들의 [[읽기에 대한 무관심]]을 걱정했다.","apathy (명) 무관심, 냉담"],["She worked with [[great zeal]] for the team.","그녀는 팀을 위해 [[대단한 열정]]으로 일했다.","zeal (명) 열정, 열의"],["The crowd cheered with [[patriotic fervor]].","군중은 [[애국적 열정]]으로 환호했다.","fervor (명) 열정, 열의"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"coerce","a":"2","e":"② coerce: (누군가에게 어떤 일을 하게 만들다 / 그들이 하고 싶어 하지 않는 / 힘이나 위협을 써서) 강요하다, 강제하다","w":"① cajole: 구슬리다, 살살 달래다\n③ instigate: 선동하다, 부추기다\n④ dissuade: 단념시키다, 말리다","k":"누군가에게 어떤 일을 하게 만들다 / 그들이 하고 싶어 하지 않는 / 힘이나 위협을 써서","m":0,"s":"\"to make someone do something that they do not want to do by using force or threats\"","c":["cajole","coerce","instigate","dissuade"],"mn":"강요하다, 강제하다","hk":"coerce(강요하다)는 힘이나 위협으로 억지로 시키는 것. cajole(구슬리다)·instigate(선동하다)·dissuade(단념시키다)는 방식이 달라 속임수.","ex":[["They tried to [[coerce him into signing]] the paper.","그들은 [[그가 서명하도록 강요하려]] 했다."],["No one should [[coerce people into voting]] for them.","누구도 사람들이 그들에게 [[투표하도록 강요해서는]] 안 된다."],["The boss was accused of [[coercing workers to work late]].","사장은 [[직원들에게 늦게까지 일하도록 강요한]] 혐의를 받았다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"surveillance","a":"surveillance","e":"surveillance 감시, 감독","k":"현대 도시들은 공공 안전을 위한 첨단 감시 시스템을 갖추고 있다.","m":0,"s":"Modern cities are equipped with advanced s______ systems for public safety.","mn":"감시, 감독","hk":"surveillance(감시)는 철자 포인트 세 곳, 가운데 vei, 이중 ll, 끝 ance를 지켜 쓰기.","ex":[["The suspect was [[under surveillance]] for a week.","용의자는 일주일 동안 [[감시를 받았다]]."],["The city installed [[surveillance cameras]].","시는 [[감시 카메라]]를 설치했다."],["Police used [[video surveillance]] to find the thief.","경찰은 도둑을 찾으려고 [[영상 감시]]를 이용했다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"ubiquitous","a":"4","e":"④ pervasive: 널리 퍼진, 만연한 (스마트폰은 현대 일상생활에서 진정으로 어디에나 존재하게 되어 사람들이 소통하는 방식을 바꾸어 놓았다.) / ubiquitous(어디에나 있는, 아주 흔한)의 유의어.","w":"① elusive: 포착하기 힘든, 이해하기 어려운\n② sporadic: 산발적인, 이따금 일어나는\n③ transient: 일시적인, 잠깐 머무는","k":"스마트폰은 현대 일상생활에서 진정으로 어디에나 존재하게 되어 사람들이 소통하는 방식을 바꾸어 놓았다.","m":0,"s":"Smartphones have become truly ubiquitous in modern daily life, transforming how people communicate.","h":"ubiquitous","c":["elusive","sporadic","transient","pervasive"],"mn":"어디에나 있는, 아주 흔한","hk":"ubiquitous(어디에나 있는)의 같은 편은 pervasive(널리 퍼진). elusive(포착하기 힘든)·sporadic(산발적인)·transient(일시적인)는 드문 쪽.","ex":[["Coffee shops are [[ubiquitous in this city]].","커피숍은 [[이 도시 어디에나 있다]]."],["[[Ubiquitous advertising]] follows us online.","[[어디에나 있는 광고]]가 온라인에서 우리를 따라다닌다."],["Plastic has become [[a ubiquitous material]].","플라스틱은 [[아주 흔한 재료]]가 되었다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"equilibrium","a":"2","e":"② equilibrium: 균형 상태 (시장 균형은 공급량이 수요량과 같아질 때 달성된다.)","w":"① inflation: 인플레이션, 물가 상승\n③ recession: 경기 침체, 불황\n④ monopoly: 독점","k":"시장 균형은 공급량이 수요량과 같아질 때 달성된다.","m":0,"s":"Market ________ is reached when the quantity supplied equals the quantity demanded.","c":["inflation","equilibrium","recession","monopoly"],"mn":"균형 상태","hk":"equilibrium(균형 상태)은 공급과 수요가 같아진 상태. inflation(물가 상승)·recession(경기 침체)·monopoly(독점)는 다른 경제 용어.","ex":[["Prices [[reach equilibrium]] when supply meets demand.","공급이 수요를 만나면 가격은 [[균형 상태에 이른다]]."],["A gymnast must [[keep her equilibrium]] on the beam.","체조 선수는 평균대에서 [[균형을 유지해야]] 한다."],["Heat changed the [[chemical equilibrium]] in the tube.","열이 시험관 속 [[화학적 균형 상태]]를 바꿨다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"board","a":"4","e":"①이사회 / ②이사회, 운영 위원회 / ③(교육) 위원회 / ④탑승하다, (배·비행기 등에) 타다 [④번만 의미가 다름]","k":"①이사회는 지난 금요일에 새로운 환경 정책을 승인했다.\n②병원 이사회는 응급 진료실을 확장하기로 결정했다.\n③한 지역 주민이 3년 임기의 학교 운영 위원으로 선출되었다.\n④승객들은 출발 30분 전에 비행기에 탑승해야 한다.","m":0,"c":["The board of directors approved the new environmental policy last Friday.","The hospital board decided to expand the emergency care unit.","A local citizen was elected to the school board for a three-year term.","Passengers must board the plane thirty minutes before departure."],"hc":"board|board|board|board","mn":"이사회 / 탑승하다, (배·비행기 등에) 타다","hk":"board(이사회)는 모여서 결정하는 위원회이고 board the plane(비행기에 탑승하다)의 board(탑승하다, 동사)만 뜻이 다름. 나머지 셋은 이사회·위원회.","ex":[["The school [[board of directors]] meets every month.","학교 [[이사회]]는 매달 모인다.","board (명) 이사회"],["The [[hospital board]] chose a new director.","[[병원 이사회]]는 새 원장을 뽑았다.","board (명) 이사회, 운영 위원회"],["Please [[board the plane]] now.","지금 [[비행기에 탑승]]해 주세요.","board (동) 탑승하다"]]}]},{"day":47,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"eradicate","a":"3","e":"③ eradicate: 근절하다, 박멸하다","w":"① incinerate: 소각하다\n② deteriorate: 악화되다, 저하되다\n④ segregate: 분리하다, 차별하다","m":0,"s":"\"근절하다, 박멸하다\"","c":["incinerate","deteriorate","eradicate","segregate"],"mn":"근절하다, 박멸하다","hk":"eradicate(근절하다)는 뿌리째 뽑아 없앤다는 어근에서 온 말. incinerate(소각하다)·deteriorate(악화되다)·segregate(분리하다)는 모양만 닮은 속임수.","ex":[["We must [[eradicate poverty]].","우리는 [[가난을 근절해야]] 한다."],["Doctors worked to [[eradicate the disease]].","의사들은 [[그 병을 박멸하려고]] 애썼다."],["The city plans to [[eradicate rats]].","시는 [[쥐를 박멸할]] 계획이다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"overt","a":"1","e":"① covert: 은밀한, 비밀의 (채용 과정에서의 공공연한 차별은 회사의 평등 정책을 위반했다.) / overt(공공연한, 드러난)의 반의어.","w":"② conspicuous: 눈에 잘 띄는, 두드러진\n③ blatant: 노골적인, 뻔뻔한\n④ explicit: 명시적인, 분명한","k":"채용 과정에서의 공공연한 차별은 회사의 평등 정책을 위반했다.","m":0,"s":"The overt discrimination in the hiring process violated the company's equality policy.","h":"overt","c":["covert","conspicuous","blatant","explicit"],"mn":"공공연한, 드러난","hk":"overt(공공연한)는 겉으로 다 보이는 것, 반대편은 covert(은밀한). conspicuous(눈에 띄는)·blatant(노골적인)·explicit(명시적인)는 같은 편.","ex":[["He made [[overt threats]] against his rival.","그는 경쟁자에게 [[공공연한 위협]]을 했다.","overt (형) 공공연한, 드러난"],["The company showed [[overt support]] for the plan.","회사는 그 계획에 [[공공연한 지지]]를 보였다.","overt (형) 공공연한, 드러난"],["The spy carried out [[a covert mission]].","그 스파이는 [[비밀 임무]]를 수행했다.","covert (형) 은밀한, 비밀의"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"catalyst","a":"2","e":"② catalyst: 촉매제, 기폭제 (인터넷의 발명은 변화를 위한 주요한 촉매제였다.)","w":"① deterrent: 억제력, 방해물\n③ precedent: 선례, 판례\n④ byproduct: 부산물","k":"인터넷의 발명은 변화를 위한 주요한 촉매제였다.","m":0,"s":"The invention of the internet was a major ________ for change.","c":["deterrent","catalyst","precedent","byproduct"],"mn":"촉매제, 기폭제","hk":"catalyst(촉매제)는 변화를 일으키는 계기라 a catalyst for change(변화의 촉매제)로 기억. deterrent(억제력)는 막는 쪽이라 반대 방향.","ex":[["The speech was [[a catalyst for change]].","그 연설은 [[변화의 촉매제]]였다."],["This metal acts as [[a catalyst]] in the chemical reaction.","이 금속은 그 화학 반응에서 [[촉매]] 역할을 한다."],["The accident became [[the catalyst for reform]].","그 사고는 [[개혁의 기폭제]]가 되었다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"curb","a":"1,3","e":"① suppress: 억누르다, 억제하다\n③ inhibit: 억제하다, 못 하게 하다 (정부는 공장에서 나오는 탄소 배출을 억제하기 위해 강력한 조치를 취해야 한다.) / curb(억제하다, 제한하다)의 유의어.","w":"② incite: 선동하다, 부추기다\n④ unleash: 촉발하다, 마구 쏟아내다","k":"정부는 공장에서 나오는 탄소 배출을 억제하기 위해 강력한 조치를 취해야 한다.","m":2,"s":"Governments must take strong action to curb carbon emissions from factories.","h":"curb","c":["suppress","incite","inhibit","unleash"],"mn":"억제하다, 제한하다","hk":"curb(억제하다)의 같은 편은 suppress(억누르다)·inhibit(억제하다). incite(선동하다)·unleash(촉발하다)는 부추기는 반대 방향.","ex":[["We need to [[curb spending]] this year.","우리는 올해 [[지출을 억제할]] 필요가 있다."],["The new law will [[curb pollution]].","새 법은 [[오염을 억제할]] 것이다."],["A high tax can [[curb smoking]].","높은 세금은 [[흡연을 억제할]] 수 있다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"plateau","a":"plateau","e":"plateau (명) 정체기 / (명) 고원","k":"수년간의 급성장 후, 그 회사의 매출은 마침내 정체기에 이르러 상승을 멈췄다.\n중앙아시아의 광대한 고원은 해발 4천 미터가 넘는 곳에 있다.","m":0,"s":"After years of rapid growth, the company's sales finally hit a p______ and stopped rising.\nThe vast p______ in central Asia lies more than four thousand meters above sea level.","mn":"정체기 / 고원","hk":"plateau(고원)는 높고 평평한 땅이라 오르다 평평해진 정체기로도 쓰임. 한 단어에 두 뜻.","ex":[["Sales have [[reached a plateau]].","매출이 [[정체기에 이르렀다]].","plateau (명) 정체기"],["Her progress [[hit a plateau]] last month.","그녀의 발전이 지난달 [[정체기에 들어섰다]].","plateau (명) 정체기"],["Tibet is [[a high plateau]].","티베트는 [[높은 고원]]이다.","plateau (명) 고원"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"stigma","a":"1","e":"① stigma: (사회적 반감의 강한 감정 / 부당하게 따라붙는 / 어떤 사람이나 어떤 상태에) 오명, 낙인","w":"② contempt: 경멸, 멸시\n③ disgrace: 망신, 불명예\n④ taboo: 금기, 터부","k":"사회적 반감의 강한 감정 / 부당하게 따라붙는 / 어떤 사람이나 어떤 상태에","m":0,"s":"\"a strong feeling of social disapproval that is unfairly attached to a person or a condition\"","c":["stigma","contempt","disgrace","taboo"],"mn":"오명, 낙인","hk":"stigma(오명)는 사회가 부당하게 붙이는 낙인. contempt(경멸)는 감정, disgrace(망신)는 불명예라 따라붙는 낙인의 뜻이 약함.","ex":[["There is still [[a stigma attached to mental illness]].","[[정신 질환에 붙은 낙인]]이 여전히 있다."],["He tried to [[remove the stigma]] of failure.","그는 실패라는 [[낙인을 없애려]] 했다."],["People fear [[the social stigma]] of poverty.","사람들은 가난의 [[사회적 낙인]]을 두려워한다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"expertise","a":"expertise","e":"expertise 전문 지식, 전문 기술","k":"그 연구자는 데이터 분석과 언어 교육 분야의 전문 지식을 보유하고 있다.","m":0,"s":"The researcher has e______ in data analysis and language education.","mn":"전문 지식, 전문 기술","hk":"expertise(전문 지식)는 expert(전문가) 뒤에 ise를 붙인 모양, ize로 쓰면 오답.","ex":[["She has [[expertise in math]].","그녀는 [[수학 전문 지식]]이 있다."],["We need [[technical expertise]] for this job.","이 일에는 [[전문 기술]]이 필요하다."],["He [[shared his expertise]] with young players.","그는 젊은 선수들에게 [[자신의 전문 지식을 나눠 주었다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"blunt","a":"3","e":"blunt (형) 직설적인, 무뚝뚝한 - bluntly (부) 직설적으로, 단도직입적으로\n③ discreet (형) 신중한, 조심스러운 - discreetly (부) 신중하게, 조심스럽게","w":"① allege (동) (증거 없이) 주장하다 - allegedly (부) 주장하는 바에 따르면\n② repute (동) ~라고 여기다, ~라고 평하다 - reputedly (부) 소문에 의하면\n④ purport (동) ~라고 주장하다 - purportedly (부) 주장하는 바에 의하면","m":0,"s":"blunt - bluntly","c":["allege - allegedly","repute - reputedly","discreet - discreetly","purport - purportedly"],"mn":"직설적인, 무뚝뚝한","hk":"blunt(직설적인, 형용사)→bluntly(직설적으로, 부사)는 형용사에서 부사로 가는 방향. discreet(신중한)→discreetly(신중하게)가 같고 나머지는 동사 출발.","ex":[["He gave [[a blunt answer]].","그는 [[직설적인 대답]]을 했다.","blunt (형) 직설적인, 무뚝뚝한"],["She [[said bluntly]] that the plan was bad.","그녀는 그 계획이 나쁘다고 [[단도직입적으로 말했다]].","bluntly (부) 직설적으로, 단도직입적으로"],["He asked [[a discreet question]].","그는 [[신중한 질문]]을 했다.","discreet (형) 신중한, 조심스러운"],["She [[spoke discreetly]] so no one could hear.","그녀는 아무도 듣지 못하도록 [[신중하게 말했다]].","discreetly (부) 신중하게, 조심스럽게"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"tacit","a":"1","e":"① tacit: 암묵적인, 무언의","w":"② 노골적인, 공공연한(explicit)\n③ 잠정적인, 임시의(tentative)\n④ 촉각의, 만져서 아는(tactile)","m":0,"s":"tacit","c":["암묵적인, 무언의","노골적인, 공공연한","잠정적인, 임시의","촉각의, 만져서 아는"],"mn":"암묵적인, 무언의","hk":"tacit(암묵적인)는 말 없이 서로 아는 것. 철자가 닮은 tactile(촉각의)과 explicit(노골적인)·tentative(잠정적인)는 속임수.","ex":[["They had [[a tacit agreement]].","그들은 [[암묵적인 합의]]를 했다."],["She gave [[tacit approval]] by smiling.","그녀는 미소로 [[암묵적인 승낙]]을 했다."],["There is [[a tacit rule]] here: no phones.","여기에는 휴대폰 금지라는 [[암묵적인 규칙]]이 있다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"meticulous","a":"4","e":"④ sloppy: 엉성한, 대충 하는 (과학자들은 실험 데이터를 신중하게 기록할 때 일관되게 꼼꼼해야 한다.) / meticulous(꼼꼼한, 세심한)의 반의어.","w":"① scrupulous: 세심한, 양심적인\n② fastidious: 까다로운, 꼼꼼한\n③ painstaking: 공들인, 정성 들인","k":"과학자들은 실험 데이터를 신중하게 기록할 때 일관되게 꼼꼼해야 한다.","m":0,"s":"Scientists must be consistently meticulous when carefully recording their experimental data.","h":"meticulous","c":["scrupulous","fastidious","painstaking","sloppy"],"mn":"꼼꼼한, 세심한","hk":"meticulous(꼼꼼한)의 반대편은 sloppy(엉성한). scrupulous(세심한)·fastidious(까다로운)·painstaking(공들인)은 같은 편 속임수.","ex":[["He is [[meticulous about details]].","그는 [[세부 사항에 꼼꼼하다]].","meticulous (형) 꼼꼼한, 세심한"],["She did [[meticulous research]] for the report.","그녀는 보고서를 위해 [[꼼꼼한 조사]]를 했다.","meticulous (형) 꼼꼼한, 세심한"],["His [[sloppy work]] had many mistakes.","그의 [[엉성한 작업]]에는 실수가 많았다.","sloppy (형) 엉성한, 대충 하는"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"subsidy","a":"4","e":"④ subsidy: (정부가 지급하는 돈 / 어떤 산업을 돕거나 가격을 낮게 유지하기 위해) 보조금","w":"① dividend: 배당금\n② rebate: 리베이트, 환급금\n③ levy: 부과금, 징수금","k":"정부가 지급하는 돈 / 어떤 산업을 돕거나 가격을 낮게 유지하기 위해","m":0,"s":"\"money paid by a government to help an industry or to keep a price low\"","c":["dividend","rebate","levy","subsidy"],"mn":"보조금","hk":"subsidy(보조금)는 정부가 산업을 돕거나 가격을 낮추려고 주는 돈. levy(부과금)는 거두는 돈이라 반대 방향, dividend(배당금)는 회사 이익의 몫.","ex":[["The government gives [[a subsidy to farmers]].","정부는 [[농부들에게 보조금]]을 준다."],["[[Energy subsidies]] keep prices low.","[[에너지 보조금]]이 가격을 낮게 유지한다."],["The airline asked for [[a subsidy]] to keep ticket prices low.","그 항공사는 항공권 가격을 낮게 유지하려고 [[보조금]]을 요청했다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"wane","a":"4","e":"④ subside: 가라앉다, 잦아들다 (전통적인 신문에 대한 대중의 관심은 디지털 시대에 계속 줄어들고 있다.) / wane(약해지다, 줄어들다)의 유의어.","w":"① proliferate: 급증하다, 확산하다\n② escalate: 증가하다, 심화되다\n③ surge: 급증하다, 밀려들다","k":"전통적인 신문에 대한 대중의 관심은 디지털 시대에 계속 줄어들고 있다.","m":0,"s":"Public interest in traditional newspapers continues to wane in the digital era.","h":"wane","c":["proliferate","escalate","surge","subside"],"mn":"약해지다, 줄어들다","hk":"wane(약해지다)는 달이 기울듯 줄어드는 것, 같은 편은 subside(가라앉다). proliferate(급증하다)·escalate(증가하다)·surge(급증하다)는 커지는 반대 방향.","ex":[["Public support for the plan began to [[wane]].","그 계획에 대한 대중의 지지가 [[약해지기]] 시작했다."],["After the full moon, the moon [[wanes]].","보름달이 지나면 달이 점점 [[줄어든다]]."],["Her strength began to [[wane]] after the long race.","긴 경주 뒤에 그녀의 힘이 [[약해지기]] 시작했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"magnitude","a":"magnitude","e":"magnitude 규모, 크기","k":"기후 변화의 막대한 규모는 즉각적이고 조율된 전 지구적 행동을 요구한다.","m":0,"s":"The vast m______ of climate change requires immediate and coordinated global action.","mn":"규모, 크기","hk":"magnitude(규모)는 magnificent(웅장한)와 같은 큰 것을 뜻하는 어근 가족. 철자 끝은 tude.","ex":[["Scientists measured [[the magnitude of the earthquake]].","과학자들은 [[지진의 규모]]를 측정했다."],["The problem is [[of great magnitude]].","그 문제는 [[규모가 매우 크다]]."],["They failed to see [[the magnitude of the problem]].","그들은 [[그 문제의 크기]]를 알아보지 못했다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"hierarchy","a":"4","e":"④ hierarchy: 위계, 계층 구조 (조직 내의 명확한 위계는 역할과 책임을 정의하는 데 도움을 준다.)","w":"① jurisdiction: 관할권, 사법권\n② dynasty: 왕조, 왕가\n③ monarchy: 군주제","k":"조직 내의 명확한 위계는 역할과 책임을 정의하는 데 도움을 준다.","m":0,"s":"A clear ________ within an organization helps define roles and responsibilities.","c":["jurisdiction","dynasty","monarchy","hierarchy"],"mn":"위계, 계층 구조","hk":"hierarchy(위계)는 위아래 단계가 있는 구조라 a clear hierarchy(분명한 위계) 짝. jurisdiction(관할권)·dynasty(왕조)·monarchy(군주제)는 다른 뜻.","ex":[["Every school has [[a clear hierarchy]].","모든 학교에는 [[분명한 위계]]가 있다."],["Wolves live in [[a strict hierarchy]].","늑대 무리는 [[엄격한 위계]] 속에서 산다."],["He rose quickly in [[the company hierarchy]].","그는 [[회사의 위계 구조]]에서 빠르게 올라갔다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"subject","a":"4","e":"①주제 / ②주제 / ③주제 / ④피험자, 연구 대상 [④번만 의미가 다름]","k":"①오늘 밤 강연의 주요 주제는 개발도상국의 재생 에너지이다.\n②그 소설가는 빈곤을 자신의 최신작의 주제로 택했다.\n③기후 변화는 수십 년간 국제 토론의 중심 주제였다.\n④그 실험의 각 피험자는 스무 개의 단어 목록을 외우도록 요청받았다.","m":0,"c":["The main subject of tonight's lecture is renewable energy in developing countries.","The novelist chose poverty as the subject of her latest work.","Climate change has been the central subject of international debate for decades.","Each subject in the experiment was asked to memorize a list of twenty words."],"hc":"subject|subject|subject|subject","mn":"주제 / 피험자, 연구 대상","hk":"subject(주제)는 이야기의 중심 내용이고 subject(피험자)는 실험에 참여하는 사람이라 ④만 뜻이 다름. 나머지 셋은 모두 주제.","ex":[["The teacher [[changed the subject]] quickly.","선생님은 빠르게 [[주제를 바꿨다]].","subject (명) 주제"],["The film's [[main subject]] is friendship.","그 영화의 [[주된 주제]]는 우정이다.","subject (명) 주제"],["The [[subjects in the study]] were all teenagers.","[[그 연구의 피험자들]]은 모두 십대였다.","subject (명) 피험자, 연구 대상"]]}]},{"day":48,"q":[{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"benevolent","a":"2","e":"② malevolent: 악의적인, 사악한 (자비로운 지도자는 모든 공동체 구성원에게 자원을 공정하게 나눈다.) / benevolent(자애로운, 인자한)의 반의어.","w":"① compassionate: 인정 많은, 동정심 있는\n③ gracious: 자애로운, 품위 있는\n④ humane: 인도적인, 인정 있는","k":"자비로운 지도자는 모든 공동체 구성원에게 자원을 공정하게 나눈다.","m":0,"s":"A benevolent leader shares resources fairly among all community members.","h":"benevolent","c":["compassionate","malevolent","gracious","humane"],"mn":"자애로운, 인자한","hk":"benevolent(자애로운)의 반대편은 malevolent(악의적인). compassionate(인정 많은)·gracious(자애로운)·humane(인도적인)은 같은 편 속임수.","ex":[["The king was [[a benevolent ruler]].","그 왕은 [[자애로운 통치자]]였다.","benevolent (형) 자애로운, 인자한"],["He gave the child [[a benevolent smile]].","그는 아이에게 [[인자한 미소]]를 지어 주었다.","benevolent (형) 자애로운, 인자한"],["The story has [[a malevolent villain]].","그 이야기에는 [[악의적인 악당]]이 나온다.","malevolent (형) 악의적인, 사악한"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"diligence","a":"diligence","e":"diligence 근면, 부지런함","k":"지속적인 학업 근면함은 종종 장기적인 향상과 지속되는 직업적 성공으로 이어진다.","m":0,"s":"Sustained academic d______ often leads to long-term improvement and lasting professional success.","mn":"근면, 부지런함","hk":"diligence(근면)는 철자에 i가 두 번 나오고 끝은 ence. 뜻은 hardworking(부지런한)과 한 편.","ex":[["She studied [[with diligence]].","그녀는 [[부지런히]] 공부했다."],["[[Hard work and diligence]] bring success.","[[노력과 근면]]이 성공을 가져온다."],["The teacher praised [[her diligence]].","선생님은 [[그녀의 근면함]]을 칭찬했다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"plausible","a":"1","e":"① plausible: (타당하고 사실일 것 같아 보이는 / 비록 당신이 확신할 수는 없지만) 그럴듯한, 타당해 보이는","w":"② dubious: 의심스러운, 미심쩍은\n③ ambiguous: 모호한, 애매한\n④ viable: 실행 가능한, 생존 가능한","k":"타당하고 사실일 것 같아 보이는 / 비록 당신이 확신할 수는 없지만","m":0,"s":"\"seeming reasonable and likely to be true, although you cannot be certain\"","c":["plausible","dubious","ambiguous","viable"],"mn":"그럴듯한, 타당해 보이는","hk":"plausible(그럴듯한)은 확신은 못 해도 사실일 것 같은 것. dubious(의심스러운)는 반대 쪽, ambiguous(모호한)·viable(실행 가능한)은 다른 뜻.","ex":[["That sounds like [[a plausible excuse]].","그건 [[그럴듯한 변명]]처럼 들린다."],["Scientists need [[a plausible explanation]].","과학자들은 [[그럴듯한 설명]]이 필요하다."],["His story [[seemed plausible]] at first.","그의 이야기는 처음엔 [[그럴듯해 보였다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"lucid","a":"2","e":"lucid (형) 명료한, 명쾌한 - lucidity (명) 명료함, 명석함\n② austere (형) 검소한, 엄격한 - austerity (명) 긴축, 검소함","w":"① adhere (동) 고수하다, 지키다 - adherence (명) 고수, 준수\n③ converge (동) 수렴하다, 모여들다 - convergence (명) 수렴, 융합\n④ resemble (동) 닮다, 비슷하다 - resemblance (명) 유사함, 닮음","m":0,"s":"lucid - lucidity","c":["adhere - adherence","austere - austerity","converge - convergence","resemble - resemblance"],"mn":"명료한, 명쾌한","hk":"lucid(명료한, 형용사)→lucidity(명료함, 명사)는 형용사에서 명사 방향. austere(검소한)→austerity(긴축)가 같고 나머지는 동사 출발.","ex":[["He gave [[a lucid explanation]].","그는 [[명료한 설명]]을 했다.","lucid (형) 명료한, 명쾌한"],["She spoke with [[great lucidity]].","그녀는 [[매우 명료하게]] 말했다.","lucidity (명) 명료함, 명석함"],["They lived [[an austere life]].","그들은 [[검소한 삶]]을 살았다.","austere (형) 검소한, 엄격한"],["The country adopted [[austerity measures]].","그 나라는 [[긴축 정책]]을 도입했다.","austerity (명) 긴축, 검소함"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"revere","a":"1","e":"① venerate: 숭배하다, 우러러보다 (많은 젊은 예술가들은 현대 회화에 미친 혁명적인 영향 때문에 피카소를 존경한다.) / revere(숭배하다, 존경하다)의 유의어.","w":"② belittle: 얕보다, 폄하하다\n③ scorn: 경멸하다, 멸시하다\n④ disdain: 업신여기다, 무시하다","k":"많은 젊은 예술가들은 현대 회화에 미친 혁명적인 영향 때문에 피카소를 존경한다.","m":0,"s":"Many young artists revere Picasso for his revolutionary impact on modern painting.","h":"revere","c":["venerate","belittle","scorn","disdain"],"mn":"숭배하다, 존경하다","hk":"revere(숭배하다)의 같은 편은 venerate(숭배하다). belittle(얕보다)·scorn(경멸하다)·disdain(업신여기다)은 깔보는 반대편.","ex":[["Students [[revere their teacher]].","학생들은 [[자기 선생님을 존경한다]]."],["The villagers [[revere the old tree]].","마을 사람들은 [[그 고목을 숭배한다]]."],["He is [[revered as a hero]] in his country.","그는 조국에서 [[영웅으로 존경받는다]]."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"prevalent","a":"4","e":"④ prevalent: 만연한, 널리 퍼진","w":"① pertinent: 관련 있는, 적절한\n② dominant: 지배적인, 우세한\n③ persistent: 지속적인, 끈질긴","m":0,"s":"\"만연한, 널리 퍼진\"","c":["pertinent","dominant","persistent","prevalent"],"mn":"만연한, 널리 퍼진","hk":"prevalent(만연한)는 널리 퍼져 흔한 상태. 철자가 닮은 pertinent(관련 있는)·persistent(끈질긴)와 dominant(지배적인)는 속임수.","ex":[["Colds are [[prevalent in winter]].","감기는 [[겨울에 만연하다]]."],["This is [[a prevalent belief]] among teens.","이것은 십대들 사이에 [[널리 퍼진 믿음]]이다."],["Smartphone use is [[increasingly prevalent]].","스마트폰 사용이 [[점점 더 만연해지고 있다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"conviction","a":"3","e":"③ conviction: 신념, 확신 (그 철학자는 지식이 끊임없는 질문을 요구한다는 깊은 개인적 신념을 지니고 있었다.)","w":"① suspicion: 의심, 불신\n② mystery: 수수께끼, 신비\n④ assertion: 주장, 단언","k":"그 철학자는 지식이 끊임없는 질문을 요구한다는 깊은 개인적 신념을 지니고 있었다.","m":0,"s":"The philosopher held a deep personal ________ that knowledge requires constant questioning.","c":["suspicion","mystery","conviction","assertion"],"mn":"신념, 확신","hk":"conviction(신념)은 굳게 믿는 마음이라 a deep conviction(깊은 신념) 짝. suspicion(의심)·mystery(수수께끼)·assertion(주장)은 다른 뜻.","ex":[["She spoke with [[deep conviction]].","그녀는 [[깊은 신념]]을 갖고 말했다."],["It is my [[firm conviction]] that honesty matters.","정직이 중요하다는 것이 나의 [[굳은 신념]]이다."],["He acted on [[his convictions]].","그는 [[자신의 신념]]에 따라 행동했다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"seal","a":"seal","e":"seal (명) 도장, 인장 / (동) 밀봉하다","k":"기록 보관인은 중세 편지의 밀랍에 찍힌 왕실 인장을 발견했다.\n작업자들은 백신이 해외로 운송되기 전에 모든 용기를 단단히 밀봉해야 한다.","m":0,"s":"The archivist noticed the royal s______ pressed into the wax of the medieval letter.\nWorkers must s______ every container tightly before the vaccines are shipped overseas.","mn":"도장, 인장 / 밀봉하다","hk":"seal(도장, 명사)과 seal(밀봉하다, 동사)은 철자가 같은 두 뜻. 도장을 찍어 봉한다는 점에서 이어짐.","ex":[["The letter had [[a royal seal]].","그 편지에는 [[왕실 도장]]이 찍혀 있었다.","seal (명) 도장, 인장"],["The president put [[his seal]] on the paper.","대통령은 서류에 [[자신의 도장]]을 찍었다.","seal (명) 도장, 인장"],["Please [[seal the box]] with tape.","상자를 테이프로 [[밀봉해]] 주세요.","seal (동) 밀봉하다"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"salient","a":"3","e":"③ salient: 두드러진, 핵심적인","w":"① 잠재된, 휴면 중인(dormant)\n② 짠, 소금기가 있는(saline)\n④ 부수적인, 이차적인(secondary)","m":0,"s":"salient","c":["잠재된, 휴면 중인","짠, 소금기가 있는","두드러진, 핵심적인","부수적인, 이차적인"],"mn":"두드러진, 핵심적인","hk":"salient(두드러진)는 톡 튀어나와 눈에 띄는 것. 모양이 닮은 saline(짠)과 dormant(잠재된)·secondary(부수적인)는 속임수.","ex":[["Here are [[the salient points]] of the talk.","이것이 강연의 [[핵심 요점]]이다."],["Its [[most salient feature]] is its bright color.","그것의 [[가장 두드러진 특징]]은 밝은 색이다."],["He mentioned [[a salient fact]].","그는 [[핵심적인 사실]] 하나를 언급했다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"integrity","a":"3,4","e":"③ deceit: 속임수, 기만\n④ corruption: 부패, 타락 (훌륭한 과학자는 실험 연구 결과를 보고할 때 항상 완전한 진실성을 보여야 한다.) / integrity(청렴, 정직)의 반의어.","w":"① sincerity: 진실함, 진정성\n② uprightness: 정직, 청렴","k":"훌륭한 과학자는 실험 연구 결과를 보고할 때 항상 완전한 진실성을 보여야 한다.","m":2,"s":"A good scientist must always demonstrate full integrity when reporting experimental research results.","h":"integrity","c":["sincerity","uprightness","deceit","corruption"],"mn":"청렴, 정직","hk":"integrity(청렴)의 반대편은 deceit(속임수)·corruption(부패). sincerity(진실함)·uprightness(정직)는 같은 편 속임수.","ex":[["She is [[a person of integrity]].","그녀는 [[청렴한 사람]]이다.","integrity (명) 청렴, 정직"],["He won by [[lies and deceit]].","그는 [[거짓말과 속임수]]로 이겼다.","deceit (명) 속임수, 기만"],["The reporter wrote about [[political corruption]].","기자는 [[정치 부패]]에 관해 썼다.","corruption (명) 부패, 타락"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"propaganda","a":"3","e":"③ propaganda: (정보 / 특히 한쪽으로 치우친 종류의 / 널리 퍼뜨려지는 / 정치적 목적을 밀어주기 위해) 선전, 프로파간다","w":"① censorship: 검열\n② rhetoric: 수사학, 미사여구\n④ testimony: 증언","k":"정보 / 특히 한쪽으로 치우친 종류의 / 널리 퍼뜨려지는 / 정치적 목적을 밀어주기 위해","m":0,"s":"\"information, especially of a biased kind, spread widely in order to promote a political cause\"","c":["censorship","rhetoric","propaganda","testimony"],"mn":"선전, 프로파간다","hk":"propaganda(선전)는 한쪽으로 치우친 정보를 퍼뜨려 정치 목적을 밀어주는 것. censorship(검열)은 막는 쪽, rhetoric(수사학)·testimony(증언)는 다른 뜻.","ex":[["The poster is [[war propaganda]].","그 포스터는 [[전쟁 선전물]]이다."],["[[Political propaganda]] filled the newspaper.","[[정치 선전]]이 신문을 가득 채웠다."],["They used radio to [[spread propaganda]].","그들은 라디오로 [[선전을 퍼뜨렸다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"underscore","a":"3","e":"③ highlight: 강조하다, 부각시키다 (그 연구 결과는 더 나은 정신 건강 관리에 대한 시급한 필요성을 강조한다.) / underscore(강조하다, 역설하다)의 유의어.","w":"① downplay: 축소하다, 대수롭지 않게 다루다\n② understate: 축소해서 말하다\n④ trivialize: 하찮게 만들다, 사소한 일로 치부하다","k":"그 연구 결과는 더 나은 정신 건강 관리에 대한 시급한 필요성을 강조한다.","m":0,"s":"The study results underscore the urgent need for better mental health care.","h":"underscore","c":["downplay","understate","highlight","trivialize"],"mn":"강조하다, 역설하다","hk":"underscore(강조하다)의 같은 편은 highlight(강조하다). downplay(축소하다)·understate(축소해서 말하다)·trivialize(하찮게 만들다)는 줄이는 반대 방향.","ex":[["The report [[underscores the need]] for change.","그 보고서는 변화의 [[필요성을 강조한다]]."],["The accident [[underscored the importance]] of safety.","그 사고는 안전의 [[중요성을 강조했다]]."],["The results [[underscore the risks]] of sleeping too little.","그 결과는 잠을 너무 적게 자는 것의 [[위험을 강조한다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"nuance","a":"nuance","e":"nuance 미묘한 차이, 뉘앙스","k":"한 단어가 전체 의미를 바꾸는 미묘한 어감 차이를 담을 수 있다.","m":0,"s":"A single word can carry a subtle n______ that changes the whole meaning.","mn":"미묘한 차이, 뉘앙스","hk":"nuance(미묘한 차이)는 n-u-a-n-c-e 여섯 글자. 끝이 ence가 아니라 ance.","ex":[["Words can carry [[a subtle nuance]].","단어는 [[미묘한 뉘앙스]]를 담을 수 있다."],["Translators must catch [[every nuance]].","번역가는 [[모든 미묘한 차이]]를 잡아내야 한다."],["She understood [[the nuance of his tone]].","그녀는 [[그의 말투의 뉘앙스]]를 이해했다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"legacy","a":"2","e":"② legacy: (죽은 이가 남긴) 유산, 업적 (그 교수의 과학적 유산은 계속해서 후대 연구자들에게 영감을 주고 있다.)","w":"① relic: 유물, 유적\n③ chronicle: 연대기, 기록\n④ burden: 부담, 짐","k":"그 교수의 과학적 유산은 계속해서 후대 연구자들에게 영감을 주고 있다.","m":0,"s":"The scientific ________ of the professor continues to inspire generations of researchers.","c":["relic","legacy","chronicle","burden"],"mn":"(죽은 이가 남긴) 유산, 업적","hk":"legacy(유산)는 죽은 이가 남긴 업적이나 영향이라 leave a legacy(유산을 남기다) 짝. relic(유물)은 물건, chronicle(연대기)은 기록, burden(부담)은 짐.","ex":[["He wanted to [[leave a legacy]].","그는 [[유산을 남기고]] 싶어 했다."],["The artist's [[lasting legacy]] still inspires us.","그 예술가의 [[오래 남는 유산]]은 지금도 우리에게 영감을 준다."],["The war left [[a legacy of pain]].","그 전쟁은 [[고통의 유산]]을 남겼다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"party","a":"4","e":"①정당 / ②정당 / ③정당 / ④당사자 [④번만 의미가 다름]","k":"①야당은 정부의 예산안을 강하게 비판했다.\n②집권 여당은 오늘 아침 새로운 주택 정책을 발표했다.\n③신생 녹색당이 최근 지방 선거에서 몇 개의 의석을 얻었다.\n④양 당사자는 이달 말 이전에 계약서에 서명해야 한다.","m":0,"c":["The opposition party strongly criticized the government's budget plan.","The ruling party announced a new housing policy this morning.","A new green party won several seats in the recent local election.","Both parties must sign the contract before the end of the month."],"hc":"party|party|party|parties","mn":"정당 / 당사자","hk":"party(정당)는 정치 단체이고 party(당사자)는 계약이나 다툼에 관련된 한쪽 사람이라 ④만 뜻이 다름. 파티(모임) 뜻이 아님.","ex":[["She joined [[a political party]].","그녀는 [[정당]]에 가입했다.","party (명) 정당"],["[[The ruling party]] lost the election.","[[여당]]이 선거에서 졌다.","party (명) 정당"],["The two [[parties to the contract]] must sign.","두 [[계약 당사자]]는 서명해야 한다.","party (명) 당사자"]]}]},{"day":49,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"native","a":"2","e":"② indigenous: 원주민의, 토착의 (그 과학자들은 이 작은 섬에서만 자라는 토종 식물들을 연구했다.) / native(토착의, 원산의)의 유의어.","w":"① invasive: 침입성의, 외래의\n③ provincial: 지방의, 편협한\n④ transnational: 다국적의, 초국가적인","k":"그 과학자들은 이 작은 섬에서만 자라는 토종 식물들을 연구했다.","m":0,"s":"The scientists studied the native plants that grow only on this small island.","h":"native","c":["invasive","indigenous","provincial","transnational"],"mn":"토착의, 원산의","hk":"native(토착의)의 같은 편은 indigenous(토착의). invasive(침입성의)는 바깥에서 들어온 반대편, provincial(지방의)·transnational(초국가적인)은 다른 뜻.","ex":[["Kangaroos are [[native to Australia]].","캥거루는 [[호주 토종이다]]."],["[[Native plants]] need less water.","[[토종 식물]]은 물이 덜 필요하다."],["Scientists protect [[native species]] on the island.","과학자들은 섬의 [[토종 생물]]을 보호한다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"replenish","a":"4","e":"④ replenish: 보충하다, 다시 채우다 (직원들은 가게가 다시 문을 열기 전에 텅 빈 선반을 다시 채워야 했다.)","w":"① dispose: 처리하다, 처분하다\n② deplete: 고갈시키다\n③ withhold: 보류하다, 억제하다","k":"직원들은 가게가 다시 문을 열기 전에 텅 빈 선반을 다시 채워야 했다.","m":0,"s":"The staff had to ________ the empty shelves before the store opened again.","c":["dispose","deplete","withhold","replenish"],"mn":"보충하다, 다시 채우다","hk":"replenish(보충하다)는 다시 채우는 것이라 refill(다시 채우다)과 같은 편, 반대편은 deplete(고갈시키다). dispose(처리하다)·withhold(보류하다)는 다른 뜻.","ex":[["Please [[replenish the supplies]].","[[물품을 다시 채워]] 주세요."],["Athletes drink water to [[replenish lost fluids]].","운동선수는 [[잃은 수분을 보충하려고]] 물을 마신다."],["We must [[replenish the stock]] before Monday.","월요일 전에 [[재고를 다시 채워야]] 한다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"scarcity","a":"3","e":"③ scarcity: 부족, 결핍","w":"① percentage: 백분율, 비율\n② quota: 할당량\n④ ratio: 비, 비율","m":0,"s":"\"부족, 결핍\"","c":["percentage","quota","scarcity","ratio"],"mn":"부족, 결핍","hk":"scarcity(부족)는 scarce(드문, 부족한)의 명사형으로 모자라서 귀한 상태. percentage(백분율)·ratio(비)·quota(할당량)는 숫자 단어.","ex":[["In dry areas, [[water scarcity]] is a serious problem.","건조한 지역에서 [[물 부족]]은 심각한 문제이다."],["[[The scarcity of food]] worried the villagers.","[[식량 부족]]이 마을 사람들을 걱정시켰다."],["The [[scarcity of jobs]] made young people leave town.","[[일자리 부족]] 때문에 젊은이들이 마을을 떠났다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"confidence","a":"confidence","e":"confidence 자신감, 신뢰","k":"그녀는 청중 전체 앞에서 대단한 자신감을 가지고 말했다.","m":0,"s":"She spoke with great c______ in front of the whole audience.","mn":"자신감, 신뢰","hk":"confidence(자신감)는 confident(자신 있는)에서 철자를 가져오기. 끝은 dence이고 dance가 아님.","ex":[["She answered [[with confidence]].","그녀는 [[자신 있게]] 대답했다."],["He [[lost his confidence]] after the mistake.","그는 실수 후 [[자신감을 잃었다]]."],["I have [[confidence in my team]].","나는 [[우리 팀을 신뢰한다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"immerse","a":"3","e":"immerse (동) 몰두하게 하다, 담그다 - immersion (명) 몰입, 침잠\n③ reconcile (동) 화해시키다, 조화시키다 - reconciliation (명) 화해, 조정","w":"① serene (형) 고요한, 평온한 - serenity (명) 평온함, 고요함\n② universal (형) 보편적인 - universality (명) 보편성\n④ sovereign (형) 자주적인, 자주 독립의 - sovereignty (명) 주권","m":0,"s":"immerse - immersion","c":["serene - serenity","universal - universality","reconcile - reconciliation","sovereign - sovereignty"],"mn":"몰두하게 하다, 담그다","hk":"immerse(몰두하게 하다)→immersion(몰입)은 동사에서 명사 방향. reconcile(화해시키다)→reconciliation(화해)이 같고 나머지는 형용사 출발.","ex":[["She likes to [[immerse herself in books]].","그녀는 [[책에 푹 빠지는]] 것을 좋아한다.","immerse (동) 몰두하게 하다, 담그다"],["[[Language immersion]] helps students learn fast.","[[언어 몰입]] 교육은 학생들이 빠르게 배우도록 돕는다.","immersion (명) 몰입, 침잠"],["The two sides tried to [[reconcile their differences]].","두 편은 [[차이를 조화시키려고]] 했다.","reconcile (동) 화해시키다, 조화시키다"],["[[Reconciliation between the two friends]] took time.","[[두 친구 사이의 화해]]에는 시간이 걸렸다.","reconciliation (명) 화해, 조정"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"entrepreneur","a":"2","e":"② entrepreneur: (새로운 사업을 시작하는 사람 / 그리고 재정적 위험을 감수하는 / 이익을 낼 수 있으리라는 기대로) 기업가, 사업가 (이익을 내기 위해 재정적 위험을 감수하며 새 사업을 시작하는 사람)","w":"① supervisor: 감독관, 관리자\n③ consultant: 컨설턴트, 상담가\n④ retailer: 소매업자, 소매상","k":"새로운 사업을 시작하는 사람 / 그리고 재정적 위험을 감수하는 / 이익을 낼 수 있으리라는 기대로","m":0,"s":"\"a person who starts a new business and takes financial risks in the hope of making a profit\"","c":["supervisor","entrepreneur","consultant","retailer"],"mn":"기업가, 사업가 (이익을 내기 위해 재정적 위험을 감수하며 새 사업을 시작하는 사람)","hk":"entrepreneur(기업가)는 새 사업을 시작하고 위험을 감수하는 사람. supervisor(감독관)·consultant(컨설턴트)·retailer(소매업자)는 역할이 다름.","ex":[["She became [[a young entrepreneur]].","그녀는 [[젊은 기업가]]가 되었다."],["[[Successful entrepreneurs]] take risks.","[[성공한 기업가들]]은 위험을 감수한다."],["[[Local entrepreneurs]] opened shops downtown.","[[지역 기업가들]]이 시내에 가게를 열었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"ripe","a":"1,3","e":"① green: (과일이) 덜 익은, 설익은 (그 농부는 복숭아가 완전히 익을 때까지 2주를 더 기다렸다.) / ripe(익은, 잘 익은)의 반의어.\n③ unripe: 익지 않은","w":"② edible: 먹을 수 있는, 식용의\n④ wholesome: 건강에 좋은, 건전한","k":"그 농부는 복숭아가 완전히 익을 때까지 2주를 더 기다렸다.","m":2,"s":"The farmer waited two more weeks until the peaches were fully ripe.","h":"ripe","c":["green","edible","unripe","wholesome"],"mn":"익은, 잘 익은","hk":"ripe(익은)의 반대편은 green(덜 익은)·unripe(익지 않은). edible(먹을 수 있는)·wholesome(건강에 좋은)은 속임수.","ex":[["The farmer sold [[ripe peaches]].","농부는 [[잘 익은 복숭아]]를 팔았다.","ripe (형) 익은, 잘 익은"],["The bananas are still [[green]].","바나나가 아직 [[덜 익었다]].","green (형) 덜 익은, 설익은"],["Don't eat [[unripe fruit]].","[[익지 않은 과일]]을 먹지 마라.","unripe (형) 익지 않은"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"lap","a":"lap","e":"lap (명) 무릎 / (명) (트랙의) 한 바퀴","k":"간호사는 잠든 아기를 어머니의 무릎 위에 조심스럽게 눕혔다.\n그 주자는 경주의 마지막 한 바퀴를 끝내기 직전에 쓰러졌다.","m":0,"s":"The nurse laid the sleeping baby carefully across the mother's l______.\nThe runner collapsed just before finishing the final l______ of the race.","mn":"무릎 / 한 바퀴","hk":"lap(무릎, 명사)은 앉았을 때 허벅지 윗면이고, 트랙을 도는 lap(한 바퀴)도 명사. 한 단어에 두 뜻.","ex":[["The cat sat on [[my lap]].","고양이가 [[내 무릎]] 위에 앉았다.","lap (명) 무릎"],["The child fell asleep in [[her mother's lap]].","아이는 [[엄마 무릎]]에서 잠들었다.","lap (명) 무릎"],["He ran [[ten laps]] around the track.","그는 트랙을 [[열 바퀴]] 달렸다.","lap (명) 트랙의 한 바퀴"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"ecosystem","a":"2","e":"② ecosystem: 생태계","w":"① metabolism: 신진대사\n③ biodiversity: 생물 다양성\n④ photosynthesis: 광합성","m":0,"s":"ecosystem","c":["신진대사","생태계","생물 다양성","광합성"],"mn":"생태계","hk":"ecosystem(생태계)은 생물과 환경이 얽힌 하나의 체계. biodiversity(생물 다양성)·metabolism(신진대사)·photosynthesis(광합성)와 구분.","ex":[["Pollution harms [[the local ecosystem]].","오염은 [[지역 생태계]]를 해친다."],["The lake is [[a fragile ecosystem]].","그 호수는 [[연약한 생태계]]이다."],["Scientists study [[the marine ecosystem]].","과학자들은 [[해양 생태계]]를 연구한다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"elicit","a":"3","e":"③ elicit: 이끌어내다, 유도하다 (그 기자는 긴장한 학생에게서 솔직한 대답을 이끌어내려고 부드러운 질문을 했다.)","w":"① allude: 암시하다, 넌지시 말하다\n② instill: 심어주다, 주입하다\n④ refute: 반박하다, 논박하다","k":"그 기자는 긴장한 학생에게서 솔직한 대답을 이끌어내려고 부드러운 질문을 했다.","m":0,"s":"The reporter asked a gentle question to ________ an honest answer from the nervous student.","c":["allude","instill","elicit","refute"],"mn":"이끌어내다, 유도하다","hk":"elicit(이끌어내다)은 elicit a response(반응을 이끌어내다) 짝. 철자가 닮은 illicit(불법의)과 혼동 주의. allude(암시하다)·instill(심어주다)은 다른 뜻.","ex":[["The joke [[elicited laughter]] from the crowd.","그 농담은 군중에게서 [[웃음을 이끌어냈다]]."],["The teacher tried to [[elicit answers]] from the shy students.","교사는 수줍은 학생들에게서 [[대답을 이끌어내려고]] 했다."],["The ad was made to [[elicit a response]].","그 광고는 [[반응을 이끌어내도록]] 만들어졌다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"shade","a":"3","e":"③ shadow: 그림자, 그늘 (우리는 하루 중 가장 더운 때에 오래된 나무의 시원한 그늘에서 쉬었다.) / shade(그늘, 응달)의 유의어.","w":"① dusk: 땅거미, 황혼\n② luminosity: 광도, 밝기\n④ twilight: 황혼, 땅거미","k":"우리는 하루 중 가장 더운 때에 오래된 나무의 시원한 그늘에서 쉬었다.","m":0,"s":"We rested in the cool shade of an old tree during the hottest part of the day.","h":"shade","c":["dusk","luminosity","shadow","twilight"],"mn":"그늘, 응달","hk":"shade(그늘)의 같은 편은 shadow(그림자, 그늘). dusk(땅거미)·twilight(황혼)는 해 질 무렵 때이고 luminosity(광도)는 밝기라 장소 뜻이 아님.","ex":[["We sat [[in the shade]] of a tree.","우리는 나무 [[그늘에]] 앉았다."],["[[Shade trees]] keep the yard cool.","[[그늘을 만드는 나무]]가 마당을 시원하게 한다."],["The big umbrella [[gave us shade]].","큰 우산이 우리에게 [[그늘을 만들어 주었다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"blizzard","a":"3","e":"③ blizzard: (아주 강한 바람을 동반한 심한 눈보라 / 앞을 보는 것을 거의 불가능하게 만드는) 눈보라 (앞이 거의 보이지 않을 만큼 강한 바람을 동반한 심한 눈폭풍)","w":"① monsoon: 계절풍, 장마\n② gale: 강풍\n④ gust: 돌풍","k":"아주 강한 바람을 동반한 심한 눈보라 / 앞을 보는 것을 거의 불가능하게 만드는","m":0,"s":"\"a heavy snowstorm with very strong winds that makes it almost impossible to see\"","c":["monsoon","gale","blizzard","gust"],"mn":"눈보라 (앞이 거의 보이지 않을 만큼 강한 바람을 동반한 심한 눈폭풍)","hk":"blizzard(눈보라)는 센 바람과 눈이 함께 몰아쳐 앞이 안 보이는 것. gale(강풍)·gust(돌풍)·monsoon(계절풍)은 눈 뜻이 빠짐.","ex":[["[[A blizzard h
