f it floats away, it may damage the spaceship.\"", "The spaceship landed on the Moon. Everyone jumped out and landed slowly because the Moon has low gravity. It was easy to jump high on the Moon. When Sihyun jumped, she went over Kyujin's head! \"Be careful,\" said Ms. Lee. \"It's fun to jump in low gravity, but you can get hurt if you bump into each other. Now, everyone, come here and let's take a look at the footprints of the Apollo astronauts!\" The footprints were over 100 years old, but they still looked perfect. \"It's because there's no wind or rain on the Moon,\" Ms. Lee explained.", "Then suddenly, the ground began to shake. \"An earthquake!\" shouted Sihyun. \"Calm down, everyone,\" said Ms. Lee. \"It's actually a moonquake. Luckily, it's not very strong. We will be okay if we keep still.\" She was right. The moonquake soon went away. \"Now, let's go and explore the craters,\" said Ms. Lee. \"Craters are made when space rocks crash into the Moon. Like the footprints, the craters don't change much because the Moon has no air.\""];var PASS_KO=["달로의 체험 학습", "2099년 10월 25일", "호현이의 학교는 달로 체험 학습을 갔습니다. 우주선이 우주에 도달했을 때, 모두가 무중력 상태를 경험하며 떠다니기 시작했습니다. 호현이는 유찬이를 손가락으로 밀었고, 유찬이는 선실 안을 떠다녔습니다! 규진이는 천장에 거꾸로 섰습니다. 시현이는 벽에 서 있었습니다. 우주에서는 위아래가 없기 때문에 모두가 편안하게 느꼈습니다.", "점심은 특별한 포장 용기에 담긴 수프와 감자였습니다. 우주에서는 접시를 사용할 수 없어서 모두 포장 용기에서 바로 음식을 먹었습니다. 포장 용기와 테이블에는 모두 자석이 있어서 포장 용기를 테이블에 고정할 수 있었습니다. \"모두 테이블 자석 위에 음식을 올려 두세요,\"라고 담임 선생님인 이 선생님이 말씀하셨습니다. \"음식이 떠다니면 우주선에 손상을 줄 수도 있어요.\"", "우주선이 달에 착륙했습니다. 달은 낮은 중력을 갖고 있어서 모두 밖으로 뛰어나가서 천천히 착지했습니다. 달에서는 높이 점프하는 것이 쉬웠습니다. 시현이는 점프하면서 규진이의 머리 위로 날아갔습니다! \"조심하세요,\" 이 선생님이 말했습니다. \"낮은 중력에서 점프하는 건 재미있지만, 서로 부딪히면 다칠 수 있어요. 자, 이제 모두 이리로 와서 아폴로 우주 비행사들의 발자국을 봅시다!\" 그 발자국들은 100년이 넘었지만, 여전히 완벽해 보였습니다. \"그건 달에 바람이나 비가 없기 때문이에요,\" 이 선생님이 설명했습니다.", "그때 갑자기 땅이 흔들리기 시작했습니다. \"지진이야!\" 시현이가 외쳤습니다. \"진정하세요, 여러분,\" 이 선생님이 말했습니다. \"그건 사실 월진이에요. 다행히 그리 강하지 않아요. 가만히 있으면 괜찮을 거예요.\" 선생님이 옳았습니다. 월진은 곧 사라졌습니다. \"이제 분화구를 탐험하러 갑시다,\" 이 선생님이 말했습니다. \"분화구는 우주 암석이 달에 충돌할 때 만들어져요. 발자국처럼, 달에는 공기가 없어서 분화구도 거의 변하지 않아요.\""];

 low gravity.", "달은 낮은 중력을 갖고 있어서 모두 밖으로 뛰어나가서 천천히 착지했습니다."], ["It was easy to jump high on the Moon.", "달에서는 높이 점프하는 것이 쉬웠습니다."], ["When Sihyun jumped, she went over Kyujin's head!", "시현이는 점프하면서 규진이의 머리 위로 날아갔습니다!"], ["\"Be careful,\" said Ms. Lee.", "\"조심하세요,\" 이 선생님이 말했습니다."], ["\"It's fun to jump in low gravity, but you can get hurt if you bump into each other.", "\"낮은 중력에서 점프하는 건 재미있지만, 서로 부딪히면 다칠 수 있어요."], ["Now, everyone, come here and let's take a look at the footprints of the Apollo astronauts!\"", "자, 이제 모두 이리로 와서 아폴로 우주 비행사들의 발자국을 봅시다!\""], ["The footprints were over 100 years old, but they still looked perfect.", "그 발자국들은 100년이 넘었지만, 여전히 완벽해 보였습니다."], ["\"It's because there's no wind or rain on the Moon,\" Ms. Lee explained.", "\"그건 달에 바람이나 비가 없기 때문이에요,\" 이 선생님이 설명했습니다."]]}, {"qs": [{"n": 9, "q": "월진(moonquake)에 대한 이 선생님의 설명으로 알맞은 것은?", "o": ["It is very strong, so it is very dangerous.", "It is not very strong, so you will be okay if you keep still.", "It is a phenomenon caused by rain.", "It is caused by a spaceship crashing.", "It never happens on the Moon."], "a": 1, "ans": "It is not very strong, so you will be okay if you keep still.", "ko": ["매우 강해서 매우 위험하다.", "그리 강하지 않아서 가만히 있으면 괜찮다.", "비 때문에 생기는 현상이다.", "우주선이 부딪혀서 생긴다.", "달에서는 절대 일어나지 않는다."], "ow": ["오답 ✕ — 'Luckily, it's not very strong.'(다행히 그리 강하지 않아요.)라고 했으므로 매우 강하다는 보기는 반대이다.", "정답 ○ — Ms. Lee가 'Luckily, it's not very strong.'(다행히 그리 강하지 않아요.)과 'We will be okay if we keep still.'(가만히 있으면 괜찮을 거예요.)라고 했으므로 본문과 일치한다.", "오답 ✕ — 비 때문이라는 말은 없다. 'It's actually a moonquake.'(그건 사실 월진이에요.)라고만 했고, 'there's no wind or rain on the Moon'(달에는 바람이나 비가 없다)이라고 했다.", "오답 ✕ — 우주선 때문이라는 말은 본문에 없다. 'Then suddenly, the ground began to shake.'(그때 갑자기 땅이 흔들리기 시작했다.)라고만 했다.", "오답 ✕ — 실제로 일어났다. 'The moonquake soon went away.'(월진은 곧 사라졌다.)라고 했으므로 절대 일어나지 않는다는 보기는 틀리다."], "memo": ["정답 ②: It is not very strong, so you will be okay if you keep still.(그리 강하지 않아서 가만히 있으면 괜찮다.)", "근거: Luckily, it's not very strong. We will be okay if we keep still.(다행히 그리 강하지 않아요. 가만히 있으면 괜찮을 거예요.)", "함정: ① It is very strong, so it is very dangerous.(매우 강해서 매우 위험하다.)는 Ms. Lee가 '강하지 않다(not very strong)'고 한 것과 반대라서 ✕"], "evs": [["Luckily, it's not very strong.", "다행히 그리 강하지 않아요."], ["We will be okay if we keep still.", "가만히 있으면 괜찮을 거예요."]], "ev": ["Luckily, it's not very strong.", "다행히 그리 강하지 않아요."], "why": "월진은 강하지 않아서 가만히 있으면 괜찮다고 선생님이 말했다."}], "pp": [["Then suddenly, the ground began to shake.", "그때 갑자기 땅이 흔들리기 시작했습니다."], ["\"An earthquake!\" shouted Sihyun.", "\"지진이야!\" 시현이가 외쳤습니다."], ["\"Calm down, everyone,\" said Ms. Lee.", "\"진정하세요, 여러분,\" 이 선생님이 말했습니다."], ["\"It's actually a moonquake.", "\"그건 사실 월진이에요."], ["Luckily, it's not very strong.", "다행히 그리 강하지 않아요."], ["We will be okay if we keep still.\"", "가만히 있으면 괜찮을 거예요.\""], ["She was right.", "선생님이 옳았습니다."], ["The moonquake soon went away.", "월진은 곧 사라졌습니다."]]}, {"qs": [{"n": 10, "q": "분화구에 대한 요약문이다. 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?", "o": ["space rocks - air", "space rocks - water", "wind - air", "rain - rocks", "footprints - wind"], "a": 0, "ans": "space rocks - air", "evs": [["Craters are made when space rocks crash into the Moon.", "분화구는 우주 암석이 달에 충돌할 때 만들어져요."], ["Like the footprints, the craters don't change much because the Moon has no air.", "발자국처럼, 달에는 공기가 없어서 분화구도 거의 변하지 않아요."]], "ev": ["Craters are made when space rocks crash into the Moon.", "분화구는 우주 암석이 달에 충돌할 때 만들어져요."], "ow": ["정답 ○ — 'Craters are made when space rocks crash into the Moon.'(분화구는 우주 암석이 달에 충돌할 때 만들어져요.)와 'the craters don't change much because the Moon has no air'(달에는 공기가 없어서 분화구도 거의 변하지 않아요.)에 맞는 space rocks - air이다.", "오답 ✕ — (A)는 맞지만 (B) water는 틀리다. 'the Moon has no air'(달에는 공기가 없다)라고 했다.", "오답 ✕ — 분화구는 'when space rocks crash into the Moon'(우주 암석이 충돌할 때) 만들어지므로 (A)가 wind(바람)이면 틀리다.", "오답 ✕ — 분화구가 만들어지는 이유는 'space rocks'(우주 암석)이지 rain(비)이 아니다. 달에는 비가 없다.", "오답 ✕ — 발자국은 분화구가 만들어지는 이유가 아니다. 'Craters are made when space rocks crash into the Moon.'"], "memo": ["정답 ①: space
