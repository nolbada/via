<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 마스터 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>

<script>
var P=[{"u":1,"id":"ms1-01-1","no":1,"ko":"야구를 하는데 춤도 춰?","items":[{"n":1,"t":"tf","q":"Banana Ball games continue after everyone on the field joins in a dance.","ko":"경기장에 있는 모든 사람이 함께 춤을 춘 뒤에도 바나나 볼 경기는 계속된다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"However, a song suddenly plays, and everyone on the field joins in a dance!","하지만 갑자기 노래가 흘러나오고, 경기장에 있는 모든 사람들이 함께 춤을 춘다!"],[4,"After that, the game continues as if nothing happened.","그 후, 마치 아무 일도 없었던 것처럼, 경기는 계속된다."]],"w":"3번에서 모두가 함께 춤을 추고, 4번에서 After that, the game continues as if nothing happened라고 해요. 춤이 끝나도 경기는 이어져요.","c":"T"},"h":"497b3becb2"},{"n":2,"t":"tf","q":"Jesse Cole founded the Savannah Bananas to make baseball slower and more relaxing.","ko":"제시 콜은 야구를 더 느리고 더 편안하게 만들려고 사바나 바나나스를 설립했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"To make the game faster and more exciting, he founded the Savannah Bananas in 2016 and created Banana Ball.","경기를 더 빠르고 더 흥미롭게 만들기 위해, 그는 2016년에 사바나 바나나스를 설립하고 바나나 볼을 창안했다."]],"w":"7번에서 콜은 경기를 더 빠르고 더 흥미롭게(faster and more exciting) 만들려고 팀을 세웠어요. 느리고 편안하게라는 말은 반대예요.","c":"F"},"h":"9ab0445928"},{"n":3,"t":"tf","q":"The unexpected scene at the beginning is from a traditional sport that has existed for a long time.","ko":"처음의 예기치 않은 장면은 오랫동안 이어져 온 전통적인 스포츠에서 나온 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"This unexpected scene is from a unique sport called Banana Ball.","이 예기치 않은 장면은 바나나 볼이라 불리는 독특한 스포츠에서 나온 것이다."]],"w":"5번에서 그 장면은 Banana Ball이라는 독특한(unique) 스포츠에서 나왔다고 해요. 전통 스포츠라는 말은 본문과 달라요.","c":"F"},"h":"7871ef83c9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… the one that most distinguishes Banana Ball from traditional baseball is the two-hour time limit)","ko":"… 바나나 볼을 전통적인 야구와 가장 구분 짓는 것은 두 시간의 시간 제한이다.","opts":["연결한다","닮게 만든다","구분 짓는다","대체한다"],"word":"distinguishes","r":{"a":"3) 구분 짓는다","ev":"8번 문장","s":[[8,"Among its unique rules, the one that most distinguishes Banana Ball from traditional baseball is the two-hour time limit, which is about 40 minutes shorter than the average baseball game time.","그것의 독특한 규칙들 중에서, 바나나 볼을 전통적인 야구와 가장 구분짓는 것은 두 시간의 시간 제한인데, 이것은 평균 야구 경기 시간보다 약 40분 짧다."]],"w":"distinguish A from B는 'A를 B와 구분 짓다'예요. 바나나 볼을 전통 야구와 가장 다르게 만드는 규칙이 두 시간의 시간 제한이라는 뜻이에요.","c":3},"h":"0715b711c6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You might think you’re watching a regular baseball game.)","ko":"당신은 일반적인 야구 경기를 보고 있다고 생각할 수도 있다.","opts":["일반적인","특별한","위험한","오래된"],"word":"regular","r":{"a":"1) 일반적인","ev":"2번 문장","s":[[2,"You might think you’re watching a regular baseball game.","당신은 당신이 일반적인 야구 경기를 보고 있다고 생각할 수도 있다."]],"w":"2번은 평범한 야구 장면처럼 보이게 하고, 3번의 However로 갑자기 달라져요. 그래서 regular는 '일반적인, 평범한'이에요.","c":1},"h":"3def9b58c9"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nPlayers often dance, some of them wear stilts, and outfielders occasionally catch the ball with a 360-degree spin.","ko":"밑줄 친 them이 가리키는 것은?","sko":"선수들은 종종 춤을 추고, 그들 중 일부는 죽마를 신고, 외야수들은 가끔 360도 회전을 하며 공을 잡는다.","opts":["팬들","응원단","콜 감독","선수들"],"r":{"a":"4) 선수들","ev":"10번 문장","s":[[10,"Players often dance, some of them wear stilts, and outfielders occasionally catch the ball with a 360-degree spin.","선수들은 종종 춤을 추고, 그들 중 일부는 죽마를 신고, 외야수들은 가끔 360도 회전을 하며 공을 잡는다."]],"w":"some of them은 '그들 중 일부'이고, 같은 문장 맨 앞의 Players(선수들)를 가리켜요. 춤을 추는 사람이 선수들이라서 죽마를 신는 사람도 선수들 중 일부예요.","c":4},"h":"1271171865"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They seem to be succeeding, with millions of followers on TikTok.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 틱톡에서 수백만 명의 팔로워를 보유한 채 성공하고 있는 것으로 보인다.","opts":["그들은 틱톡 팔로워가 수백만 명이라서 성공하고 있는 것으로 보인다.","그들은 틱톡 팔로워 수백만 명을 잃어서 실패하고 있는 것으로 보인다.","그들은 성공하기 위해 틱톡 팔로워를 수백만 명 모으려고 계획하고 있다.","그들은 틱톡에서 수백만 명에게 성공하는 법을 가르치고 있다."],"r":{"a":"1) 그들은 틱톡 팔로워가 수백만 명이라서 성공하고 있는 것으로 보인다.","ev":"13번 문장","s":[[13,"They seem to be succeeding, with millions of followers on TikTok.","그들은 틱톡에서 수백만 명의 팔로워를 보유한 채 성공하고 있는 것으로 보인다."]],"w":"seem to be succeeding은 '성공하고 있는 것 같다'이고, with millions of followers는 '수백만 명의 팔로워를 보유한 채'예요. 성공의 근거가 팔로워 수예요.","c":1},"h":"871fe2bbdc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["바나나 볼 경기는 보통 야구 경기보다 더 오래 걸린다.","바나나 나나스는 20대의 젊은 선수들로 구성되어 있다.","콜은 바나나 볼을 스포츠 분야에서 가장 위대한 쇼로 만들려고 한다고 말했다.","외야수들은 공을 잡을 때 절대 회전하지 않는다."],"opts":["Banana Ball games usually last longer than regular baseball games.","The Banana Nanas are made up of young players in their 20s.","Cole said he is trying to make Banana Ball the greatest show in sports.","Outfielders never spin when they catch the ball."],"r":{"a":"3) Cole said he is trying to make Banana Ball the greatest show in sports.","ev":"12번 문장","s":[[12,"“We’re trying to make Banana Ball the greatest show in sports,” Cole said.","“우리는 바나나 볼을 스포츠 분야에서 가장 위대한 쇼로 만들려고 노력하고 있습니다.”라고 콜은 말했다."]],"w":"12번에서 콜은 바나나 볼을 가장 위대한 쇼로 만들려고 노력하고 있다고 말해요. 시간은 평균보다 40분 짧고(8번), 나나스는 60대 지역 여성이며(11번), 외야수는 가끔 회전하며 공을 잡아요(10번).","c":3},"h":"b0d28c3371"},{"n":9,"t":"sum","q":"Banana Ball was created to make baseball less (A) by offering fast games and entertaining (B) for fans.","ko":"바나나 볼은 빠른 경기와 즐거운 (B)을(를) 팬들에게 제공해 야구를 덜 (A) 스포츠로 만들려고 창안되었다.","oko":["(A) 어려운 / (B) 요금","(A) 비싼 / (B) 경기장","(A) 힘든 / (B) 심판","(A) 지루한 / (B) 공연","(A) 위험한 / (B) 선수 장비"],"opts":["(A) difficult / (B) prices","(A) expensive / (B) stadiums","(A) tiring / (B) referees","(A) boring / (B) performances","(A) dangerous / (B) uniforms"],"r":{"a":"4) (A) boring / (B) performances","ev":"6번, 9번 문장","s":[[6,"Jesse Cole, a former baseball team manager, noticed that baseball fans were leaving games early out of boredom.","전직 야구팀 감독이었던 제시 콜은 야구팬들이 지루함 때문에 경기를 일찍 떠나고 있었다는 것을 알아챘다."],[9,"Banana Ball offers fans special experiences through its distinct performances.","바나나 볼은 그것의 독특한 공연들을 통해 팬들에게 특별한 경험을 제공한다."]],"w":"6번에서 팬들이 지루함(boredom) 때문에 떠났고, 9번에서 바나나 볼은 공연(performances)으로 특별한 경험을 줘요. 그래서 (A) boring, (B) performances예요.","c":4},"h":"be43f786e1"},{"n":10,"t":"fill","q":"The Banana Nanas, a cheerleading squad of [A] women in their 60s, present a charming dance show during [B].","ko":"바나나 나나스는 60대의 [A] 여성들로 구성된 응원단으로, [B] 동안 매력적인 춤 공연을 선보인다.","bank":["local","intermissions","stilts","boredom","unexpected","distinct"],"bko":{"local":"지역의","intermissions":"휴식 시간","stilts":"죽마","boredom":"지루함","unexpected":"예기치 않은","distinct":"독특한"},"r":{"a":"[A] local, [B] intermissions","ev":"11번 문장","s":[[11,"Furthermore, the Banana Nanas, a cheerleading squad made up of local women in their 60s, present a charming dance show during intermissions.","게다가, 60대의 지역 여성들로 구성된 응원단인 바나나 나나스는 휴식 시간 동안 매력적인 춤 공연을 선보인다."]],"w":"11번에서 나나스는 지역(local) 여성들로 이뤄졌고, 휴식 시간(intermissions) 동안 춤 공연을 해요. stilts, boredom은 다른 문장의 단어이고 이 자리에 말이 되지 않아요.","c":null},"h":"76a07ebaa9"}]},{"u":1,"id":"ms1-01-2","no":2,"ko":"갓생에 지친 당신, ‘이것’ 모드 ON!","items":[{"n":1,"t":"tf","q":"People in goblin mode often spend time on the couch and ignore social pressure.","ko":"고블린 모드에 있는 사람들은 종종 소파에서 시간을 보내고 사회적 압박을 무시한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Those in this state often spend their time on the couch, eating comfort food, and ignoring social pressure.","이 상태의 사람들은 종종 소파에서 위안이 되는 음식을 먹고, 사회적 압박을 무시한 채 시간을 보낸다."]],"w":"3번에서 고블린 모드 상태의 사람들은 소파에서 위안이 되는 음식을 먹고 사회적 압박을 무시하며 시간을 보낸다고 해요.","c":"T"},"h":"0c0b07aaa1"},{"n":2,"t":"tf","q":"People in goblin mode accept all of society’s high standards and try even harder.","ko":"고블린 모드에 있는 사람들은 사회의 높은 기준을 모두 받아들이고 더 열심히 노력한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"They say no to society’s high standards and goals that are too hard to reach.","그들은 사회의 높은 기준과 달성하기 너무 어려운 목표들을 거부한다."]],"w":"9번에서 이들은 사회의 높은 기준과 너무 어려운 목표에 no라고 말해요(say no to). 받아들인다는 말은 반대예요.","c":"F"},"h":"4d4bf70ff3"},{"n":3,"t":"tf","q":"Goblin mode was named Oxford Word of the Year in 2022.","ko":"고블린 모드는 2022년 옥스퍼드 올해의 단어로 명명되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"This trend became so influential on social media that it was named Oxford Word of the Year in 2022.","이 트렌드는 소셜 미디어에서 너무 영향력이 커져서 2022년 옥스퍼드 올해의 단어로 명명되었다."]],"w":"6번에서 소셜 미디어에서 너무 영향력이 커져서 2022년 옥스퍼드 올해의 단어로 명명되었다고 해요.","c":"T"},"h":"0c04ff0fee"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… when people grew tired of maintaining self-improvement habits during prolonged lockdowns.)","ko":"… 사람들이 오래 계속되는 봉쇄 기간 동안 자기계발 습관을 유지하는 것에 싫증이 났던 …","opts":["갑작스러운","오래 계속되는","짧은","안전한"],"word":"prolonged","r":{"a":"2) 오래 계속되는","ev":"5번 문장","s":[[5,"Goblin mode gained mainstream popularity during the COVID-19 pandemic when people grew tired of maintaining self-improvement habits during prolonged lockdowns.","고블린 모드는 사람들이 오래 계속되는 봉쇄 기간 동안 자기계발 습관을 유지하는 것에 점점 싫증이 났던 코로나19 팬데믹 동안 주류의 인기를 얻었다."]],"w":"lockdowns 앞의 prolonged는 오래 이어진 봉쇄를 말해요. 그래서 사람들이 습관을 유지하는 데 싫증이 났어요. 뜻은 '오래 계속되는'이에요.","c":2},"h":"32db415abb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This laid-back trend involves deliberately rejecting productivity pressure …)","ko":"이 느긋한 트렌드는 의도적으로 생산성 압박을 거부하는 것을 포함한다.","opts":["우연히","조용히","빠르게","의도적으로"],"word":"deliberately","r":{"a":"4) 의도적으로","ev":"4번 문장","s":[[4,"This laid-back trend involves deliberately rejecting productivity pressure to prioritize personal comfort and relaxation.","이 느긋한 트렌드는 개인의 편안함과 휴식을 우선시하기 위해 의도적으로 생산성 압박을 거부하는 것을 포함한다."]],"w":"2번의 on purpose(일부러)와 같은 뜻이에요. 우연히 거부하는 것이 아니라 일부러 거부하는 거라서 deliberately는 '의도적으로'예요.","c":4},"h":"55d138f44f"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt refers to a state in which someone rejects social norms and expectations on purpose, choosing not to care about productivity or appearance.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 누군가가 일부러 사회적 규범과 기대를 거부하여, 생산성이나 외모에 대해 신경 쓰지 않기로 선택하는 상태이다.","opts":["고블린 모드라는 용어","사회적 규범과 기대","위안이 되는 음식","생산성과 외모"],"r":{"a":"1) 고블린 모드라는 용어","ev":"2번 문장","s":[[2,"It refers to a state in which someone rejects social norms and expectations on purpose, choosing not to care about productivity or appearance.","그것은 누군가가 일부러 사회적 규범과 기대를 거부하여, 생산성이나 외모에 대해 신경 쓰지 않기로 선택하는 상태이다."]],"w":"2번의 It은 \"~하는 상태를 가리킨다(refers to a state)\"는 말의 주어로, 1번에서 처음 소개한 고블린 모드라는 용어예요. 규범, 음식, 생산성은 무언가를 가리키는 주어가 될 수 없어요.","c":1,"k":"It = 고블린 모드라는 용어"},"pron":"It","h":"38d4bc1be5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even in the post-pandemic era, there is still constant pressure to achieve more, look better, and be productive.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"포스트 팬데믹 시대에도, 더 많이 성취하고, 더 멋져 보이고, 생산적이어야 한다는 지속적인 압박은 여전히 있다.","opts":["팬데믹이 끝난 뒤에도 더 많이 이루고, 더 멋져 보이고, 생산적이어야 한다는 압박은 계속된다.","팬데믹이 끝나면서 성취와 외모에 대한 압박이 모두 사라졌다.","팬데믹 때문에 사람들이 더 열심히 일해야 한다는 압박이 처음 생겼다.","팬데믹 이후에는 생산적인 사람들만 외모를 신경 쓸 수 있다."],"r":{"a":"1) 팬데믹이 끝난 뒤에도 더 많이 이루고, 더 멋져 보이고, 생산적이어야 한다는 압박은 계속된다.","ev":"7번 문장","s":[[7,"Even in the post-pandemic era, there is still constant pressure to achieve more, look better, and be productive.","포스트 팬데믹 시대에도, 더 많이 성취하고, 더 멋져 보이고, 생산적이어야 한다는 지속적인 압박은 여전히 있다."]],"w":"Even in the post-pandemic era는 \"팬데믹 이후 시대에도\"이고, there is still constant pressure는 \"여전히 끊임없는 압박이 있다\"예요. 압박이 사라졌다거나 처음 생겼다는 말은 still과 맞지 않아요.","c":1,"k":null},"h":"81fc0c3862"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고블린 모드는 오래 유지할수록 개인적인 관계와 경력에 이롭다고 전문가들은 말한다.","전문가들은 고블린 모드를 계속 유지하면 관계, 경력, 전반적인 웰빙에 해를 끼칠 수 있다고 말한다.","고블린 모드를 계속 유지하면 사람들은 책임을 더 잘 지게 된다고 전문가들은 말한다.","전문가들은 고블린 모드를 쓰지 않아도 웰빙에는 아무 영향이 없다고 말한다."],"opts":["Experts say staying in goblin mode longer is good for relationships and careers.","Experts say staying in goblin mode constantly can harm relationships, careers, and overall well-being.","Experts say staying in goblin mode makes people take more responsibility.","Experts say not using goblin mode has no effect on well-being."],"r":{"a":"2) Experts say staying in goblin mode constantly can harm relationships, careers, and overall well-being.","ev":"11번 문장","s":[[11,"Experts suggest that staying in this mode constantly can harm personal relationships, career development, and overall well-being by causing people to neglect their responsibilities.","전문가들은 이러한 방식을 지속적으로 유지하는 것이 사람들이 책임을 소홀히 하게 하여 개인적인 관계, 경력 개발, 그리고 전반적인 웰빙에 해를 끼칠 수 있다고 말한다."]],"w":"11번에서 전문가들은 이 모드를 지속적으로 유지하면 인간관계, 경력 개발, 전반적인 웰빙에 해를 끼칠 수 있다고 해요. 책임을 소홀히 하게 된다고 했으니 책임을 더 잘 진다는 말도 반대예요.","c":2},"h":"e32302e055"},{"n":9,"t":"sum","q":"Goblin mode can be (A) for mental health, but it should be used only as a (B) strategy.","ko":"고블린 모드는 정신 건강에 (A)할 수 있지만, 오직 (B) 전략으로만 사용되어야 한다.","oko":["(A) 해로울 / (B) 영구적인","(A) 유익할 / (B) 영구적인","(A) 해로울 / (B) 일시적인","(A) 쓸모없을 / (B) 인기 있는","(A) 유익할 / (B) 일시적인"],"opts":["(A) harmful / (B) permanent","(A) useful / (B) permanent","(A) harmful / (B) temporary","(A) useless / (B) popular","(A) useful / (B) temporary"],"r":{"a":"5) (A) useful / (B) temporary","ev":"10번 문장","s":[[10,"While goblin mode can be beneficial for mental health, it needs to be a temporary strategy.","고블린 모드가 정신 건강에 유익할 수 있는 반면에, 그것은 일시적인 전략이어야 한다."]],"w":"10번에서 고블린 모드는 정신 건강에 유익할 수 있지만(beneficial) 일시적인(temporary) 전략이어야 한다고 해요.","c":5},"h":"c0afde713e"},{"n":10,"t":"fill","q":"Many people use goblin mode to [A] [B] and feel better mentally.","ko":"많은 사람들은 [B]을(를) [A], 정신적으로 더 나은 상태를 느끼기 위해 고블린 모드를 사용한다.","bank":["reduce","stress","increase","mainstream","productive","comfortable"],"bko":{"reduce":"줄이다","stress":"스트레스","increase":"늘리다","mainstream":"주류의","productive":"생산적인","comfortable":"편안한"},"r":{"a":"[A] reduce (줄이다), [B] stress (스트레스)","ev":"8번 문장","s":[[8,"To deal with this, many people use goblin mode to reduce stress and feel better mentally.","이것에 대처하기 위해, 많은 사람들은 스트레스를 줄이고 정신적으로 더 나은 상태를 느끼기 위해 고블린 모드를 사용한다."]],"w":"8번의 to reduce stress and feel better mentally에서 가져왔어요. reduce는 스트레스를 줄인다는 뜻이고, increase는 스트레스를 늘린다는 뜻이라 기분이 나아진다는 흐름과 맞지 않아요. stress 자리에는 형용사가 올 수 없어요.","c":null},"h":"975198e7a7"}]},{"u":1,"id":"ms1-01-3","no":3,"ko":"안녕, 외계인","items":[{"n":1,"t":"tf","q":"The Golden Record was placed on spacecraft that were launched in 1977.","ko":"골든 레코드는 1977년에 발사된 우주선에 탑재되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It was placed aboard NASA’s Voyager 1 and 2 spacecraft, launched in 1977 to explore planets in our solar system.","그것은 나사(NASA)의 보이저 1호와 2호 우주선들 안에 탑재되었는데, 그것들은 우리 태양계의 행성들을 탐사하기 위해 1977년에 발사되었다."]],"w":"3번에서 골든 레코드는 NASA의 보이저 1호와 2호에 탑재되었고, 그 우주선들은 1977년에 발사되었다고 해요.","c":"T"},"h":"ba91c88900"},{"n":2,"t":"tf","q":"The map showing Earth’s location is on the inside of the Golden Record.","ko":"지구의 위치를 나타내는 지도는 골든 레코드의 안쪽에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The outside has instructions for use and a map indicating Earth’s location.","외관에는 사용 지침과 지구의 위치를 나타내는 지도가 있다."]],"w":"7번에서 지도는 안쪽이 아니라 바깥쪽(The outside)에 있다고 해요. 안쪽에는 이미지가 있어요.","c":"F"},"h":"093efb34a3"},{"n":3,"t":"tf","q":"The Golden Record includes greetings in 55 languages.","ko":"골든 레코드에는 55개 언어로 된 인사말이 포함되어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"It also features greetings in 55 languages and 90 minutes of music, including Beethoven’s Fifth Symphony.","그것은 또한 55개의 언어로 된 인사말들과 베토벤의 제5 교향곡을 포함하여, 90분의 음악을 특징으로 한다."]],"w":"9번에서 55개의 언어로 된 인사말과 90분의 음악이 있다고 해요.","c":"T"},"h":"116a398586"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… after completing their primary missions.)","ko":"… 그것들의 주요 임무를 완수한 후 …","opts":["사소한","주요한","위험한","불필요한"],"word":"primary","r":{"a":"2) 주요한","ev":"4번 문장","s":[[4,"The two spacecraft were programmed to continue their journey into interstellar space after completing their primary missions.","그 두 우주선들은 그것들의 주요 임무를 완수한 후 성간 우주로 그것들의 여행을 계속하도록 설계되었다."]],"w":"우주선이 처음 맡은 중요한 임무를 끝낸 뒤에 성간 우주로 계속 간다는 뜻이에요. 그래서 primary는 '주요한'이에요.","c":2},"h":"afc18f6442"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These things reflect the diversity and complexity of life on Earth.)","ko":"이러한 것들은 지구에서의 삶의 다양성과 복잡성을 반영한다.","opts":["숨긴다","바꾼다","비교한다","반영한다"],"word":"reflect","r":{"a":"4) 반영한다","ev":"10번 문장","s":[[10,"These things reflect the diversity and complexity of life on Earth.","이러한 것들은 지구에서의 삶의 다양성과 복잡성을 반영한다."]],"w":"7~9번의 지도, 이미지, 인사말, 음악이 지구 삶의 다양하고 복잡한 모습을 거울처럼 보여 준다는 뜻이에요. reflect는 '반영하다'예요.","c":4},"h":"f0f4d3f1f7"},{"n":6,"t":"ref","q":"What does the underlined \"each one\" refer to?\nRecognizing the potential for these probes to be discovered by alien life, astronomer Carl Sagan had the idea to place a Golden Record on each one.","ko":"밑줄 친 each one이 가리키는 것은?","sko":"이러한 탐사선들이 외계 생명체에 의해 발견될 가능성을 인식하여, 천문학자 칼 세이건은 각각에 골든 레코드를 탑재할 아이디어를 떠올렸다.","opts":["각 행성","각 외계 문명","각 탐사선","각 앨범"],"r":{"a":"3) 각 탐사선","ev":"5번 문장","s":[[5,"Recognizing the potential for these probes to be discovered by alien life, astronomer Carl Sagan had the idea to place a Golden Record on each one.","이러한 탐사선들이 외계 생명체에 의해 발견될 가능성을 인식하여, 천문학자 칼 세이건은 각각에 골든 레코드를 탑재할 아이디어를 떠올렸다."]],"w":"each one은 바로 앞의 these probes(탐사선)를 가리켜요. 각각의 탐사선에 골든 레코드를 하나씩 싣는다는 뜻이에요.","c":3},"h":"20d5f6ba59"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since space is vast, the Golden Record may not be discovered for thousands of years.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우주가 광대하기 때문에, 골든 레코드는 수천 년 동안 발견되지 않을 수도 있다.","opts":["우주가 매우 넓기 때문에 골든 레코드는 수천 년 동안 발견되지 않을 수도 있다.","골든 레코드가 발견되지 않아서 우주가 점점 넓어지고 있다.","우주가 넓기 때문에 골든 레코드는 수천 년 뒤에 반드시 발견될 것이다.","골든 레코드는 수천 년 동안 우주를 돌다가 다시 지구로 돌아올 것이다."],"r":{"a":"1) 우주가 매우 넓기 때문에 골든 레코드는 수천 년 동안 발견되지 않을 수도 있다.","ev":"11번 문장","s":[[11,"Since space is vast, the Golden Record may not be discovered for thousands of years.","우주가 광대하기 때문에, 골든 레코드는 수천 년 동안 발견되지 않을 수도 있다."]],"w":"Since는 이유를 나타내서 '우주가 광대하기 때문에'이고, may not be discovered는 '발견되지 않을 수도 있다'예요. 반드시 발견된다거나 지구로 돌아온다는 말은 없어요.","c":1},"h":"d9e571b884"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["레코드의 바깥쪽에는 지구의 삶과 과학을 보여주는 이미지가 115개 있다.","레코드의 안쪽에는 지구에서의 삶과 과학의 측면을 보여주는 이미지가 있다.","레코드에는 이미지 없이 음악만 들어 있다.","레코드의 안쪽에는 외계인이 사는 곳을 보여주는 지도가 있다."],"opts":["The outside of the record has 115 images of life and science on Earth.","The inside of the record has images that show aspects of life and science on Earth.","The record has only music and no images.","The inside of the record has a map that shows where aliens live."],"r":{"a":"2) The inside of the record has images that show aspects of life and science on Earth.","ev":"8번 문장","s":[[8,"The inside includes 115 images showing aspects of life and science on Earth, such as the DNA structure and children playing.","내부에는 DNA 구조와 놀고 있는 아이들과 같이, 지구에서의 삶과 과학의 측면들을 보여주는 115개의 이미지들이 포함된다."]],"w":"8번에서 안쪽(The inside)에 지구에서의 삶과 과학의 측면을 보여주는 이미지 115개가 있다고 해요. 바깥쪽에는 지침과 지구 위치 지도(7번)가 있고, 음악 외에 이미지도 있어요.","c":2},"h":"0bf14b5c23"},{"n":9,"t":"sum","q":"The Golden Record shows humanity’s (A) of finding other intelligent life and (B) our story.","ko":"골든 레코드는 다른 지적 생명체를 찾고 우리의 이야기를 (B)에 대한 인류의 (A)을(를) 보여준다.","oko":["(A) 두려움 / (B) 숨기는 것","(A) 계획 / (B) 잊는 것","(A) 두려움 / (B) 공유하는 것","(A) 희망 / (B) 숨기는 것","(A) 희망 / (B) 공유하는 것"],"opts":["(A) fear / (B) hiding","(A) plan / (B) forgetting","(A) fear / (B) sharing","(A) hope / (B) hiding","(A) hope / (B) sharing"],"r":{"a":"5) (A) hope / (B) sharing","ev":"12번 문장","s":[[12,"Nevertheless, it shows humanity’s hope of finding other intelligent life and sharing our story.","그럼에도 불구하고, 그것은 다른 지적 생명체를 찾고 우리의 이야기를 공유하려는 인류의 희망을 보여준다."]],"w":"12번에서 골든 레코드는 다른 지적 생명체를 찾고 우리 이야기를 공유하려는 인류의 희망(hope of finding ~ and sharing)을 보여 줘요.","c":5},"h":"f3b2adb740"},{"n":10,"t":"fill","q":"The purpose of this record is to serve as a [A] from Earth to any unknown alien [B] that may encounter the probes.","ko":"이 레코드의 목적은 그 탐사선들과 마주칠 수도 있는 미지의 외계 [B]에게 보내는 지구의 [A] 역할을 하는 것이다.","bank":["message","civilizations","diversity","complexity","languages","instructions"],"bko":{"message":"메시지","civilizations":"문명들","diversity":"다양성","complexity":"복잡성","languages":"언어들","instructions":"지침"},"r":{"a":"[A] message (메시지), [B] civilizations (문명들)","ev":"6번 문장","s":[[6,"The purpose of this record is to serve as a message from Earth to any unknown alien civilizations that may encounter the probes.","이 레코드의 목적은 그 탐사선들과 마주칠 수도 있는 미지의 외계 문명들에게 보내는 지구의 메시지 역할을 하는 것이다."]],"w":"6번에서 레코드의 목적은 탐사선과 마주칠 수도 있는 미지의 외계 문명들(civilizations)에게 보내는 지구의 메시지(message) 역할을 하는 것이라고 해요. 나머지 단어는 a 뒤에 오거나 외계 문명 자리에 오면 말이 되지 않아요.","c":null},"h":"d9f040a5b1"}]},{"u":1,"id":"ms1-01-4","no":4,"ko":"No Signal? Time to Reconnect!","items":[{"n":1,"t":"tf","q":"The writer has found it hard to make new friends since returning to in-person classes.","ko":"글쓴이는 대면 수업으로 돌아온 이후 새 친구를 사귀는 것이 어렵다는 것을 알게 되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Since I came back to in-person classes, I have found it hard to make new friends.","대면 수업으로 돌아온 이후로, 저는 새 친구를 사귀는 것이 어렵다는 것을 알게 되었어요."]],"w":"2번에서 Since I came back to in-person classes, I have found it hard to make new friends라고 해요.","c":"T"},"h":"ae52c08bde"},{"n":2,"t":"tf","q":"Research says the isolation caused by COVID-19 had little effect on young people’s social development.","ko":"연구는 코로나19로 인한 격리가 젊은이들의 사회적 발달에 거의 영향을 주지 않았다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Research reveals that the isolation brought about by COVID-19 has had a profound impact on young people’s social development, leaving many students struggling with social anxiety even after their return to in-person schooling.","연구는 코로나19 격리가 젊은이들의 사회적 발달에 상당히 영향을 미쳤으며, 학생들이 학교로 돌아온 후에도 여전히 사회적 불안을 겪고 있다는 것을 보여줘."]],"w":"6번에서 격리가 사회적 발달에 상당한(profound) 영향을 미쳤다고 해요. 거의 영향이 없다는 말은 반대예요.","c":"F"},"h":"f0df10deed"},{"n":3,"t":"tf","q":"The writer is now a middle school student who recently returned to in-person classes.","ko":"글쓴이는 현재 중학생이며 최근 대면 수업으로 돌아왔다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"I’m a first-year high school student, and I spent my late elementary and middle school years during COVID-19.","저는 고등학교 1학년 학생이고, 코로나19 기간 동안 초등학교 고학년과 중학교 시절을 보냈어요."]],"w":"1번에서 Amanda는 고등학교 1학년 학생(a first-year high school student)이라고 해요. 중학교 시절은 코로나19 기간에 보낸 과거예요.","c":"F"},"h":"ad4cd9f09f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Your experience is shared by many students of your generation.)","ko":"네 경험은 네 세대의 많은 학생들이 공통적으로 하게 되는 거야.","opts":["지역","성적","세대","학년"],"word":"generation","r":{"a":"3) 세대","ev":"5번 문장","s":[[5,"Your experience is shared by many students of your generation.","네 경험은 네 세대의 많은 학생들이 공통적으로 하게 되는 거야."]],"w":"같은 경험을 하는 많은 학생들이 같은 시기에 자란 사람들이라는 뜻이에요. generation은 '세대'예요.","c":3},"h":"f56cf6775c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Start with small steps to rebuild your confidence.)","ko":"네 자신감을 다시 세우기 위해 작은 단계들로 시작해 봐.","opts":["무너뜨리다","숨기다","비교하다","다시 세우다"],"word":"rebuild","r":{"a":"4) 다시 세우다","ev":"8번 문장","s":[[8,"Start with small steps to rebuild your confidence.","네 자신감을 다시 세우기 위해 작은 단계들로 시작해 봐."]],"w":"re-는 '다시'라는 뜻이고 build는 '세우다'예요. 잃어버린 자신감을 다시 세운다는 문맥이라 '다시 세우다'예요.","c":4},"h":"5f213e77bc"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nMost importantly, however, it should be remembered that your peers are likely to feel the same way, though they may not overtly express it.","ko":"밑줄 친 they가 가리키는 것은?","sko":"하지만 가장 중요한 것은, 비록 그들이 겉으로 드러내지 않을지라도 네 친구들도 같은 방식으로 느낄 가능성이 높다는 점을 기억하는 거란다.","opts":["글쓴이","또래 친구들","연구자들","선생님들"],"r":{"a":"2) 또래 친구들","ev":"11번 문장","s":[[11,"Most importantly, however, it should be remembered that your peers are likely to feel the same way, though they may not overtly express it.","하지만 가장 중요한 것은, 비록 그들이 겉으로 드러내지 않을지라도 네 친구들도 같은 방식으로 느낄 가능성이 높다는 점을 기억하는 거란다."]],"w":"though 이하의 they는 같은 문장의 your peers(또래 친구들)를 받아요. 친구들이 겉으로 드러내지 않는다는 뜻이에요.","c":2},"h":"c581b62921"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While I’m comfortable chatting online, I get nervous having face-to-face conversations.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"온라인으로 채팅하는 것은 편안하지만, 얼굴을 마주 보고 대화할 때는 긴장이 돼요.","opts":["온라인 대화는 편하지만, 직접 만나서 하는 대화는 긴장된다.","직접 만나는 대화는 편하지만, 온라인 대화는 긴장된다.","온라인 대화도 직접 만나는 대화도 모두 편해서 긴장하지 않는다.","온라인 대화를 하면서 직접 만나는 대화를 연습하고 있다."],"r":{"a":"1) 온라인 대화는 편하지만, 직접 만나서 하는 대화는 긴장된다.","ev":"3번 문장","s":[[3,"While I’m comfortable chatting online, I get nervous having face-to-face conversations.","온라인으로 채팅하는 것은 편안하지만, 얼굴을 마주 보고 대화할 때는 긴장이 돼요."]],"w":"While은 두 가지를 대조하고, comfortable chatting online(온라인 채팅은 편함)과 nervous having face-to-face conversations(대면 대화는 긴장)이 서로 반대예요.","c":1},"h":"c6c8a4a5f6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["글쓴이는 반 친구들을 완전히 피하라고 조언받는다.","글쓴이는 학교 동아리를 멀리하라고 조언받는다.","글쓴이는 반 친구들에게 “안녕”이라고 말하는 것과 같은 간단한 행동을 시도해 보라고 조언받는다.","글쓴이는 연습 없이도 자신감이 저절로 자란다는 말을 듣는다."],"opts":["The writer is advised to avoid classmates completely.","The writer is advised to stay away from school clubs.","The writer is advised to try simple actions like saying “hello” to classmates.","The writer is told that confidence grows by itself without practice."],"r":{"a":"3) The writer is advised to try simple actions like saying “hello” to classmates. (글쓴이는 반 친구들에게 “안녕”이라고 말하는 것과 같은 간단한 행동을 시도해 보라고 조언받는다.)","ev":"9번 문장","s":[[9,"Try simple actions like saying “hello” to classmates.","반 친구들에게 “안녕”이라고 말하는 것과 같은 간단한 행동들을 시도해 봐."]],"w":"9번에서 반 친구들에게 “안녕”이라고 말하는 것 같은 간단한 행동을 시도해 보라고 해요. 친구를 피하라거나 동아리를 멀리하라는 말은 없고, 12번에서 자신감은 연습과 함께 자란다고 해요.","c":3},"h":"129a2755c0"},{"n":9,"t":"sum","q":"Because young brains are very (A), students can regain confidence by starting with small steps and being (B) with themselves.","ko":"매우 (A) 젊은이의 뇌 덕분에, 학생들은 작은 단계로 시작하고 스스로에게 (B) 태도를 가지면 자신감을 되찾을 수 있다.","oko":["(A) 고정된 / (B) 인내심 있는","(A) 적응력 있는 / (B) 엄격한","(A) 고정된 / (B) 화난","(A) 약한 / (B) 인내심 있는","(A) 적응력 있는 / (B) 인내심 있는"],"opts":["(A) fixed / (B) patient","(A) adaptable / (B) strict","(A) fixed / (B) angry","(A) weak / (B) patient","(A) adaptable / (B) patient"],"r":{"a":"5) (A) adaptable / (B) patient","ev":"7번, 12번 문장","s":[[7,"But here’s the good news: our brains have amazing adaptability, especially at your age.","하지만 여기 좋은 소식이 있어. 우리의 뇌는 놀라운 적응력을 가지고 있고, 특히 네 나이대에는 더욱 그래."],[12,"Be patient with yourself as your social confidence grows with practice!","연습과 함께 네 사회적 자신감이 자라날 때 너 자신에게 인내심을 가지렴!"]],"w":"7번에서 뇌는 놀라운 적응력(adaptability)이 있다고 하고, 12번에서 자신에게 인내심을 가지라(Be patient)고 해요. 그래서 (A) adaptable, (B) patient예요.","c":5},"h":"6c958dcbc4"},{"n":10,"t":"fill","q":"Joining school clubs is another great option because shared activities naturally [A] social [B].","ko":"학교 동아리에 가입하는 것은 또 다른 훌륭한 선택이다. 왜냐하면 공유된 활동은 자연스럽게 사회적 [B]을(를) [A].","bank":["reduce","pressure","struggle","rebuild","generation","classmates"],"bko":{"reduce":"줄이다","pressure":"압박","struggle":"애쓰다","rebuild":"다시 세우다","generation":"세대","classmates":"반 친구들"},"r":{"a":"[A] reduce (줄이다), [B] pressure (압박)","ev":"10번 문장","s":[[10,"Joining school clubs is another great option because shared activities naturally reduce social pressure.","학교 동아리에 가입하는 것은 또 다른 훌륭한 선택인데, 왜냐하면 공유된 활동들은 자연스럽게 사회적 압박감을 줄여주기 때문이야."]],"w":"10번에서 함께하는 활동은 자연스럽게 사회적 압박(social pressure)을 줄여 준다(reduce)고 해요. reduce는 뒤에 목적어를 바로 받는 동사이고, struggle은 뒤에 with가 필요해요.","c":null},"h":"1e8b54bbce"}]},{"u":2,"id":"ms1-02-1","no":1,"ko":"얌전히 나가면 봐줄게","items":[{"n":1,"t":"tf","q":"Freedom is described as a basic human right.","ko":"자유는 기본적인 인권이라고 설명된다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"It goes without saying that freedom is a basic human right.","자유가 기본적인 인권이라는 것은 말할 것도 없다."]],"w":"1번 문장에 freedom is a basic human right가 나와요. 자유가 기본적인 인권이라는 내용과 일치해요.","c":"T"},"h":"2fb039b297"},{"n":2,"t":"tf","q":"The German Criminal Code of 1871 imposed imprisonment for helping a prisoner escape.","ko":"1871년 독일 형법은 죄수의 탈출을 돕는 것에 대해 감옥살이를 부과했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The code imposed imprisonment for helping or inducing a prisoner to escape.","그 법전은 죄수의 탈출을 돕거나 유도하는 것에 대해 감옥살이를 부과했다."]],"w":"5번 문장에서 the code imposed imprisonment for helping or inducing a prisoner to escape라고 해요. 탈출을 돕는 것에 감옥살이를 부과했다는 내용과 일치해요.","c":"T"},"h":"6cf346a62a"},{"n":3,"t":"tf","q":"The historical legal principle about prison escape no longer applies in Germany today.","ko":"감옥 탈출에 관한 역사적인 법 원칙은 오늘날 독일에서 더 이상 적용되지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"This historical legal principle continues to apply today.","이 역사적인 법 원칙은 오늘날에도 계속 적용된다."]],"w":"8번 문장에서 이 역사적인 법 원칙은 오늘날에도 계속 적용된다(continues to apply today)고 해요. 더 이상 적용되지 않는다는 말은 반대예요.","c":"F"},"h":"26e8de649c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This legal stance traces back to 1871 ...)","ko":"이 법적 입장은 1871년으로 거슬러 올라간다.","opts":["건물","기록","입장","실수"],"word":"stance","r":{"a":"3) 입장","ev":"4번 문장","s":[[4,"This legal stance traces back to 1871 when the German Criminal Code (Strafgesetzbuch) was enacted.","이 법적 입장은 독일 형법이 제정되었던 1871년으로 거슬러 올라간다."]],"w":"앞 3번에서 탈출은 불법이 아니라는 독일의 생각을 말했고, 4번의 This legal stance가 그것을 받아요. 그래서 stance는 '입장'이에요.","c":3},"h":"0bb71a1883"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... inmates are liable for any illegal acts committed during their escapes ...)","ko":"수감자들은 그들의 탈출 도중 저지른 모든 불법 행위에 대한 법적 책임이 있다.","opts":["법적 책임이 있는","도움을 받는","허락받은","무관한"],"word":"liable","r":{"a":"1) 법적 책임이 있는","ev":"9번 문장","s":[[9,"While the escape itself is not punishable, inmates are liable for any illegal acts committed during their escapes, such as damaging prison property or bribing guards.","탈출 자체는 처벌할 수 없지만, 수감자들은 감옥 재산을 손상시키거나, 교도관에게 뇌물을 주는 것과 같이 그들의 탈출 도중 저지른 모든 불법 행위에 대한 법적 책임이 있다."]],"w":"9번은 탈출 자체는 처벌하지 않지만 탈출 중 저지른 불법 행위(재산 손상, 뇌물)는 책임을 진다는 내용이에요. 그래서 be liable for는 '~에 대해 법적 책임이 있다'예요.","c":1},"h":"e0ee86700d"},{"n":6,"t":"ref","q":"What does the underlined \"one\" refer to?\nThis decision reflects the legal philosophy that seeking freedom is a natural human desire—one that should not, in itself, be treated as a criminal offense.","ko":"밑줄 친 one이 가리키는 것은?","sko":"이 결정은 자유를 추구하는 것이 자연스러운 인간의 욕망으로, 그 자체로는 형사 범죄로 취급되어서는 안 된다는 법철학을 반영한다.","opts":["법철학","자연스러운 인간의 욕망","형사 범죄","독일 형법"],"r":{"a":"2) 자연스러운 인간의 욕망","ev":"7번 문장","s":[[7,"This decision reflects the legal philosophy that seeking freedom is a natural human desire—one that should not, in itself, be treated as a criminal offense.","이 결정은 자유를 추구하는 것이 자연스러운 인간의 욕망으로, 그 자체로는 형사 범죄로 취급되어서는 안 된다는 법철학을 반영한다."]],"w":"one that should not ~ be treated as a criminal offense에서 범죄로 취급되면 안 되는 것은 앞의 a natural human desire(자연스러운 인간의 욕망)예요. one은 그 말을 대신하는 대명사예요.","c":2},"h":"70b75f37e6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But does that right extend to prisoners as well?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 그 권리가 죄수들에게까지도 확장되는가?","opts":["죄수들은 자유를 누릴 권리를 모두 잃는다.","그 권리는 죄수들에게까지도 미치는가?","죄수들만 자유라는 권리를 가질 수 있는가?","그 권리는 죄수들 덕분에 더 넓어졌는가?"],"r":{"a":"2) 그 권리는 죄수들에게까지도 미치는가?","ev":"2번 문장","s":[[2,"But does that right extend to prisoners as well?","그러나 그 권리가 죄수들에게까지도 확장되는가?"]],"w":"extend to는 '~에게까지 미치다'예요. that right(자유라는 인권)가 죄수에게도 적용되는지 묻는 질문이라서 ②와 같은 뜻이에요.","c":2},"h":"b8d63e5e77"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["1871년 법전은 스스로 탈출한 죄수에게 감옥살이를 부과했다.","수감자들은 탈출 도중 감옥 재산을 손상시켜도 책임을 지지 않는다.","그 법전은 스스로 탈출한 죄수에 대한 처벌을 포함하지 않았다.","독일은 1871년에 감옥 탈출을 불법으로 정했다."],"opts":["The 1871 code imposed imprisonment on prisoners who escaped on their own.","Inmates are not responsible for damaging prison property during an escape.","The code did not include punishment for prisoners who escaped on their own.","Germany made prison escape illegal in 1871."],"r":{"a":"3) The code did not include punishment for prisoners who escaped on their own.","ev":"6번 문장","s":[[6,"But it did not include punishment for prisoners who escaped on their own.","그러나 그것은 스스로 탈출한 죄수들에 대해서는 처벌을 포함하지 않았다."]],"w":"6번에서 법전은 스스로 탈출한 죄수에 대한 처벌을 포함하지 않았어요. 감옥살이는 탈출을 돕는 사람에게 부과됐고(5번), 재산 손상은 책임을 져요(9번).","c":3},"h":"5f193002b1"},{"n":9,"t":"sum","q":"(A), in Germany, escaping from prison is not illegal as long as no (B) are committed.","ko":"(A), 독일에서는 다른 (B)이(가) 저질러지지 않는 한 감옥 탈출은 불법이 아니다.","oko":["(A) 슬프게도 / (B) 범죄","(A) 놀랍게도 / (B) 농담","(A) 놀랍게도 / (B) 범죄","(A) 당연하게도 / (B) 실수","(A) 슬프게도 / (B) 규칙"],"opts":["(A) Sadly / (B) crimes","(A) Surprisingly / (B) jokes","(A) Surprisingly / (B) crimes","(A) Naturally / (B) mistakes","(A) Sadly / (B) rules"],"r":{"a":"3) (A) Surprisingly / (B) crimes ((A) 놀랍게도 / (B) 범죄)","ev":"3번 문장","s":[[3,"Surprisingly, in Germany, it is not illegal to escape from prison as long as it’s done without any crimes being committed.","놀랍게도, 독일에서는 감옥에서 탈출하는 것이 어떠한 범죄도 저질러지지 않고 이뤄지기만 하면 불법이 아니다."]],"w":"3번이 Surprisingly, in Germany로 시작하고, 어떠한 범죄(crimes)도 저질러지지 않고 이뤄지기만 하면 탈출은 불법이 아니라고 해요.","c":3},"h":"d7a15885f0"},{"n":10,"t":"fill","q":"Some legal experts [A] that allowing unpunished prison escapes [B] the authority of the law.","ko":"일부 법률 전문가들은 [A]: 처벌받지 않는 감옥 탈출을 허용하는 것이 법의 권위를 [B].","bank":["warn","weakens","strengthens","imposed","reflects","applies"],"bko":{"warn":"경고하다","weakens":"약화시키다","strengthens":"강화하다","imposed":"부과했다","reflects":"반영하다","applies":"적용되다"},"r":{"a":"[A] warn, [B] weakens","ev":"11번 문장","s":[[11,"They warn that allowing unpunished prison escapes weakens the enforcement of the criminal justice system and the authority of the law.","그들은 처벌받지 않는 감옥 탈출을 허용하는 것이 형사 사법 제도의 집행과 법의 권위를 약화시킨다고 경고한다."]],"w":"11번에서 They warn that allowing unpunished prison escapes weakens ~ the authority of the law라고 해요. strengthens(강화하다)는 경고의 내용과 맞지 않고, imposed·reflects·applies는 이 자리에 말이 되지 않아요.","c":null},"h":"a42a55aaae"}]},{"u":2,"id":"ms1-02-2","no":2,"ko":"척하면 척","items":[{"n":1,"t":"tf","q":"A worker’s shout of “Brick!” could be an identification, a request, or a warning.","ko":"인부의 “Brick!”이라는 외침은 사물의 식별, 요청, 또는 경고가 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Is the worker identifying an object, making a request, shouting a warning, or doing something else altogether?","그 인부는 사물을 식별하고 있는 것인가, 요청을 하고 있는 것인가, 경고를 외치고 있는 것인가, 아니면 완전히 다른 무언가를 하고 있는 것인가?"]],"w":"2번에서 인부가 사물을 식별하는지(identifying), 요청을 하는지(making a request), 경고를 외치는지(shouting a warning)를 묻고 있어요. 한 단어가 여러 의도일 수 있다는 내용과 일치해요.","c":"T"},"h":"94bf774532"},{"n":2,"t":"tf","q":"The worker yells “Brick!” inside a quiet office.","ko":"인부는 조용한 사무실 안에서 “Brick!”이라고 소리친다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"As you pass by a busy construction site, you hear one of the workers yell, “Brick!”","당신이 분주한 공사장을 지나갈 때, 인부 중 한 명이 “벽돌!”이라고 소리치는 것을 듣는다."]],"w":"1번에서 당신이 분주한 공사장(a busy construction site)을 지나갈 때 인부가 소리친다고 해요. 조용한 사무실이라는 말은 본문과 달라요.","c":"F"},"h":"40abe2be54"},{"n":3,"t":"tf","q":"“Across the street” would be easy to understand if someone randomly said it to you.","ko":"누군가 느닷없이 당신에게 “Across the street”라고 말해도 쉽게 이해될 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"For example, you would certainly be confused if someone randomly said to you, “Across the street.”","예를 들어, 누군가 당신에게 무작위로 “길 건너편에”라고 말한다면 당신은 분명 혼란스러울 것이다."]],"w":"6번에서 누군가 무작위로(randomly) “Across the street.”라고 하면 당신은 분명 혼란스러울 것이라고 해요. 쉽게 이해된다는 말은 반대예요.","c":"F"},"h":"7ed5c5b967"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... types of language games that have a distinct set of rules ...)","ko":"... 고유한 규칙 체계를 가지고 있는 일종의 언어 게임이라고 ...","opts":["고유한","거대한","불확실한","익숙한"],"word":"distinct","r":{"a":"1) 고유한","ev":"5번 문장","s":[[5,"He argued that different communication activities—such as making a joke—are types of language games that have a distinct set of rules based on the shared understanding of the players.","그는 농담하는 것과 같은 다양한 의사소통 활동들이 참여자들의 공유된 이해를 바탕으로 한 고유한 규칙 체계를 가지고 있는 일종의 언어 게임이라고 주장했다."]],"w":"5번에서 언어 게임마다 참여자들의 공유된 이해에 바탕을 둔 자기만의 규칙이 있다고 해요. 활동마다 다른 규칙 체계가 있다는 뜻이라서 distinct는 '고유한, 뚜렷이 구별되는'이에요.","c":1},"h":"8ba06d89a1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... but the second, annoyed by the number of meetings lately, ...)","ko":"... 최근 회의 횟수로 인해 짜증이 난 두 번째 직원은 ...","opts":["감동한","짜증이 난","자랑스러운","놀란"],"word":"annoyed","r":{"a":"2) 짜증이 난","ev":"10번 문장","s":[[10,"The first worker, looking forward to the meeting, might interpret the remark literally, but the second, annoyed by the number of meetings lately, may have intended to express displeasure through sarcasm.","회의를 고대하던 첫 번째 직원은 그 말을 문자 그대로 해석할지 모르지만, 최근 회의 횟수로 인해 짜증이 난 두 번째 직원은 비꼬는 말을 통해 불쾌감을 표현하려고 의도했을 수 있다."]],"w":"10번에서 두 번째 직원은 최근 회의 횟수 때문에 불쾌감을 비꼬는 말로 표현하려 했다고 해요. 그래서 annoyed는 '짜증이 난'이에요.","c":2},"h":"cd125d13e4"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSince they are each playing a different language game, they cannot truly understand each other.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그들은 각자 다른 언어 게임을 하고 있기 때문에, 서로를 진정으로 이해할 수 없다.","opts":["공사장의 인부들","두 명의 회사원","비트겐슈타인과 독자","회의에 참석한 모든 사람"],"r":{"a":"2) 두 명의 회사원","ev":"10~11번 문장","s":[[10,"The first worker, looking forward to the meeting, might interpret the remark literally, but the second, annoyed by the number of meetings lately, may have intended to express displeasure through sarcasm.","회의를 고대하던 첫 번째 직원은 그 말을 문자 그대로 해석할지 모르지만, 최근 회의 횟수로 인해 짜증이 난 두 번째 직원은 비꼬는 말을 통해 불쾌감을 표현하려고 의도했을 수 있다."],[11,"Since they are each playing a different language game, they cannot truly understand each other.","그들은 각자 다른 언어 게임을 하고 있기 때문에, 서로를 진정으로 이해할 수 없다."]],"w":"10번에서 회의를 기대하던 첫 번째 직원과 짜증이 난 두 번째 직원이 같은 말을 다르게 받아들여요. 11번의 they는 이 두 회사원이에요.","c":2},"h":"4ab3dcff51"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, if you had just asked for directions to the nearest subway station, the response would make perfect sense.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 만약 당신이 방금 가장 가까운 지하철역으로 가는 길을 물었다면, 그 대답은 완벽하게 말이 될 것이다.","opts":["그 대답은 어떤 질문과도 상관없이 항상 완벽하게 말이 된다.","지하철역이 가까울수록 그 대답은 더 이해하기 어려워진다.","방금 가까운 지하철역 가는 길을 물었다면, 그 대답은 아주 자연스럽게 이해될 것이다.","지하철역 가는 길을 묻지 않았다면, 그 대답은 완벽하게 말이 될 것이다."],"r":{"a":"3) 방금 가까운 지하철역 가는 길을 물었다면, 그 대답은 아주 자연스럽게 이해될 것이다.","ev":"7번 문장","s":[[7,"However, if you had just asked for directions to the nearest subway station, the response would make perfect sense.","그러나 만약 당신이 방금 가장 가까운 지하철역으로 가는 길을 물었다면, 그 대답은 완벽하게 말이 될 것이다."]],"w":"7번은 If you had just asked for directions ~ the response would make perfect sense, 즉 길을 물은 뒤라는 맥락이 있을 때 대답이 말이 된다는 뜻이에요. 맥락이 없던 6번과 반대 상황이에요.","c":3},"h":"103cffe3b9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오해는 사람들이 서로 다른 언어를 쓸 때만 생긴다.","단어는 모든 상황에서 하나의 고정된 의미를 가진다.","오해는 서로 다른 언어 게임이 동일한 상황에 적용될 때 생길 수 있다.","“Across the street.”라는 대답은 누구에게나 언제나 말이 된다."],"opts":["Misunderstandings happen only when people speak different languages.","A word has one fixed meaning in every situation.","Miscommunications can happen when different language games are applied to identical situations.","The response “Across the street.” always makes sense to everyone."],"r":{"a":"3) Miscommunications can happen when different language games are applied to identical situations.","ev":"8번 문장","s":[[8,"Wittgenstein’s theory also shows miscommunications can happen when people apply different language games to identical situations.","비트겐슈타인의 이론은 또한 사람들이 동일한 상황에 서로 다른 언어 게임을 적용할 때 의사소통의 오해가 발생할 수 있다는 것을 보여준다."]],"w":"8번에서 사람들이 동일한 상황에 서로 다른 언어 게임을 적용할 때 의사소통의 오해가 생길 수 있다고 해요. 언어가 다를 때만이 아니고(8번), 단어 뜻은 상황에 따라 달라지며(3번), 대답이 말이 되는 것은 맥락이 있을 때뿐이에요(6~7번).","c":3},"h":"715d692867"},{"n":9,"t":"sum","q":"In the office example, the first worker may take the remark (A), while the second worker may mean it as (B).","ko":"회사원 예시에서 첫 번째 직원은 그 말을 (A) 받아들일 수 있고, 두 번째 직원은 그것을 (B)(으)로 의도했을 수 있다.","oko":["(A) 문자 그대로 / (B) 비꼬는 말","(A) 문자 그대로 / (B) 칭찬","(A) 공손하게 / (B) 비꼬는 말","(A) 빠르게 / (B) 웃음","(A) 화난 채로 / (B) 조언"],"opts":["(A) literally / (B) sarcasm","(A) literally / (B) praise","(A) politely / (B) sarcasm","(A) quickly / (B) laughter","(A) angrily / (B) advice"],"r":{"a":"1) (A) literally / (B) sarcasm ((A) 문자 그대로 / (B) 비꼬는 말)","ev":"10번 문장","s":[[10,"The first worker, looking forward to the meeting, might interpret the remark literally, but the second, annoyed by the number of meetings lately, may have intended to express displeasure through sarcasm.","회의를 고대하던 첫 번째 직원은 그 말을 문자 그대로 해석할지 모르지만, 최근 회의 횟수로 인해 짜증이 난 두 번째 직원은 비꼬는 말을 통해 불쾌감을 표현하려고 의도했을 수 있다."]],"w":"10번에서 회의를 고대하던 첫 번째 직원은 말을 문자 그대로(literally) 해석하고, 짜증이 난 두 번째 직원은 비꼬는 말(sarcasm)로 불쾌감을 표현했을 수 있다고 해요.","c":1},"h":"67a98330c1"},{"n":10,"t":"fill","q":"It is impossible for you to determine the specific [A] meaning without additional [B].","ko":"추가 [B] 없이는 구체적인 [A] 의미를 결정하는 것이 불가능하다.","bank":["contextual","information","philosopher","identical","upcoming","nearest"],"bko":{"contextual":"문맥적인","information":"정보","philosopher":"철학자","identical":"동일한","upcoming":"다가오는","nearest":"가장 가까운"},"r":{"a":"[A] contextual, [B] information","ev":"3번 문장","s":[[3,"Despite knowing the definition of the word brick, it is impossible for you to determine the specific contextual meaning without additional information.","‘벽돌’이라는 단어의 정의를 알고 있음에도 불구하고, 추가 정보 없이는 구체적인 문맥적 의미를 결정하는 것이 불가능하다."]],"w":"3번에서 벽돌이라는 단어의 정의를 알아도 추가 정보(additional information) 없이는 구체적인 문맥적(contextual) 의미를 결정할 수 없다고 해요. identical, upcoming, nearest는 다른 문장에 나오는 단어이고, philosopher는 이 자리에 말이 되지 않아요.","c":null},"h":"143cf644dd"}]},{"u":2,"id":"ms1-02-3","no":3,"ko":"일단 싸게 부르고 보자!","items":[{"n":1,"t":"tf","q":"Alice planned to spend about $1,500 on a new computer.","ko":"Alice는 새 컴퓨터에 약 1,500달러를 쓸 계획이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Alice heads to the electronics store, planning to spend about $1,500 on a new computer.","Alice는 새 컴퓨터에 약 1,500달러를 쓸 계획으로 전자 제품 매장으로 향한다."]],"w":"1번에서 Alice는 planning to spend about $1,500 on a new computer, 즉 약 1,500달러를 쓸 계획이에요. 본문과 일치해요.","c":"T"},"h":"ae71d0bdd6"},{"n":2,"t":"tf","q":"The seller mentions the extra cost of the software before Alice agrees to buy the computer.","ko":"판매원은 Alice가 컴퓨터를 사기로 동의하기 전에 소프트웨어의 추가 비용을 언급한다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"However, as soon as she agrees to buy that one, he mentions that the software she needs costs extra.","하지만 그녀가 그것을 사기로 동의하자마자, 그는 그녀에게 필요한 소프트웨어는 추가 비용이 든다고 언급한다."]],"w":"3번에서 as soon as she agrees to buy that one, he mentions ~라고 해요. Alice가 동의하자마자 추가 비용을 말하는 거예요. 동의하기 전이라는 말은 순서가 반대예요.","c":"F"},"h":"867f571950"},{"n":3,"t":"tf","q":"Alice decides not to buy the computer because the price goes over her budget.","ko":"Alice는 가격이 예산을 넘어서 컴퓨터를 사지 않기로 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Despite going over her budget, she buys that computer.","예산을 초과했음에도 불구하고, 그녀는 그 컴퓨터를 산다."]],"w":"5번에서 Despite going over her budget, she buys that computer라고 해요. 예산을 넘었는데도 산다는 뜻이라서 사지 않는다는 말은 반대예요.","c":"F"},"h":"fc39905cee"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Why do we often accept such unfair deals?)","ko":"우리는 왜 종종 그런 불공정한 거래를 받아들이는가?","opts":["공짜의","안전한","불공정한","인기 있는"],"word":"unfair","r":{"a":"3) 불공정한","ev":"9번 문장","s":[[9,"Why do we often accept such unfair deals?","우리는 왜 종종 그런 불공정한 거래를 받아들이는가?"]],"w":"1~8번에서 처음에 낮게 부르고 구매를 결정하면 가격을 올리는 거래를 설명했어요. 그런 거래를 가리키는 말이라서 unfair는 '불공정한'이에요.","c":3},"h":"4a5f73ee3c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... several psychological factors affect our decision-making process.)","ko":"... 몇 가지 심리적 요인이 우리의 의사 결정 과정에 영향을 미친다.","opts":["심리적인","물리적인","경제적인","법적인"],"word":"psychological","r":{"a":"1) 심리적인","ev":"10번 문장","s":[[10,"This occurs because several psychological factors affect our decision-making process.","이것은 몇 가지 심리적 요인이 우리의 의사 결정 과정에 영향을 미치기 때문에 발생한다."]],"w":"10번은 우리가 불공정한 거래를 받아들이는 이유를 마음의 문제로 설명하는 문장이에요. 11~12번에서 나오는 이유는 인상을 걱정하고 이미 들인 노력이 아깝다는 마음이라서 psychological은 '심리적인'이에요.","c":1},"h":"bb57436cd2"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe lowball technique is a strategy where salespeople first present a low, reasonable price and then raise it after customers decide to buy.","ko":"밑줄 친 it이 가리키는 것은?","sko":"로우볼 기법은 판매원이 처음에 낮고 합리적인 가격을 제시하고 고객이 구매를 결정한 후에 가격을 올리는 전략이다.","opts":["낮고 합리적인 가격","판매원","고객","로우볼 기법"],"r":{"a":"1) 낮고 합리적인 가격","ev":"7번 문장","s":[[7,"The lowball technique is a strategy where salespeople first present a low, reasonable price and then raise it after customers decide to buy.","로우볼 기법은 판매원이 처음에 낮고 합리적인 가격을 제시하고 고객이 구매를 결정한 후에 가격을 올리는 전략이다."]],"w":"7번에서 판매원은 처음에 낮고 합리적인 가격을 제시한 뒤 그것(it)을 올려요. 올리는(raise) 대상은 가격이에요.","c":1,"k":"it = 낮고 합리적인 가격"},"pron":"it","h":"5bbfd5e880"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, the final price jumps to $1,700.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 결과, 최종 가격은 1,700달러로 뛴다.","opts":["그 결과 최종 가격은 1,700달러에서 1,300달러로 떨어진다.","그 결과 1,700달러라서 Alice는 컴퓨터를 사지 않는다.","그 결과 마지막 가격이 갑자기 1,700달러까지 오른다.","그 결과 최종 가격은 1,500달러로 정해진다."],"r":{"a":"3) 그 결과 마지막 가격이 갑자기 1,700달러까지 오른다.","ev":"4번 문장","s":[[4,"As a result, the final price jumps to $1,700.","그 결과, 최종 가격은 1,700달러로 뛴다."]],"w":"jump to는 '~로 뛰어오르다'예요. 3번의 추가 비용 때문에 가격이 1,300달러에서 1,700달러로 올라요. 떨어진다는 말과 반대고, 5번에서 Alice는 결국 컴퓨터를 사요.","c":3},"h":"59cea29567"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["lowball이라는 용어의 기원은 분명하게 알려져 있다.","판매원은 먼저 높은 가격을 제시하고 나중에 내린다.","로우볼 기법은 일부러 낮은 공을 던지는 야구 투수의 전략과 비슷하다.","Alice는 예산보다 적은 돈으로 컴퓨터를 샀다."],"opts":["The origin of the term lowball is clearly known.","Salespeople first present a high price and then lower it.","The lowball technique is similar to a baseball pitcher’s strategy of throwing low balls intentionally.","Alice bought the computer for less than her budget."],"r":{"a":"3) The lowball technique is similar to a baseball pitcher’s strategy of throwing low balls intentionally.","ev":"8번 문장","s":[[8,"Although the origin of the term lowball is unclear, it is similar to a pitcher’s strategy in baseball, throwing low balls intentionally to deceive batters and achieve outs.","비록 lowball이라는 용어의 기원은 불분명하지만, 그것은 타자를 속이고 아웃을 잡아내기 위해 의도적으로 낮은 공을 던지는 야구 투수의 전략과 유사하다."]],"w":"8번에서 로우볼 기법은 타자를 속이려고 일부러 낮은 공을 던지는 투수의 전략과 비슷하다고 해요. 용어의 기원은 불분명하고(8번), 판매원은 낮은 가격을 먼저 제시한 뒤 올리며(7번), Alice는 예산을 넘겨 샀어요(4~5번).","c":3},"h":"923e45bb4a"},{"n":9,"t":"sum","q":"People accept the lowball technique because they worry about (A) their first decision and want to avoid (B) the time and effort they have already invested.","ko":"사람들은 첫 결정을 (A) 것을 걱정하고, 이미 투자한 시간과 노력을 (B) 것을 피하고 싶어서 로우볼 기법을 받아들인다.","oko":["(A) 칭찬하는 / (B) 절약하는","(A) 번복하는 / (B) 늘리는","(A) 숨기는 / (B) 낭비하는","(A) 잊어버리는 / (B) 파는","(A) 번복하는 / (B) 낭비하는"],"opts":["(A) praising / (B) saving","(A) reversing / (B) increasing","(A) hiding / (B) wasting","(A) forgetting / (B) selling","(A) reversing / (B) wasting"],"r":{"a":"5) (A) reversing / (B) wasting","ev":"11번, 12번 문장","s":[[11,"We instinctively worry about leaving a negative impression on others by reversing the first decision, even when conditions have become worse.","우리는 조건이 더 나빠졌을 때조차 첫 결정을 번복함으로써 타인에게 부정적인 인상을 남기는 것을 본능적으로 걱정한다."],[12,"Moreover, we tend to avoid wasting the time and effort already invested in making the purchase decision.","게다가, 우리는 구매 결정을 내리는 데 이미 투자한 시간과 노력을 낭비하는 것을 피하는 경향이 있다."]],"w":"11번에서 첫 결정을 번복하면(reversing) 나쁜 인상을 남길까 걱정하고, 12번에서 이미 투자한 시간과 노력을 낭비하는(wasting) 것을 피하려 한다고 해요. 나머지는 (A)나 (B)가 본문과 달라요.","c":5},"h":"214ba8df97"},{"n":10,"t":"fill","q":"This is a [A] [B] of the lowball technique.","ko":"이것은 로우볼 기법의 [A] [B]이다.","bank":["classic","example","unfair","unclear","budget","customers"],"bko":{"classic":"전형적인","example":"예","unfair":"불공정한","unclear":"불분명한","budget":"예산","customers":"고객들"},"r":{"a":"[A] classic (전형적인), [B] example (예)","ev":"6번 문장","s":[[6,"This is a classic example of the lowball technique.","이것은 로우볼 기법의 전형적인 예이다."]],"w":"6번에서 이것은 로우볼 기법의 전형적인(classic) 예(example)라고 해요. a 뒤라서 unfair, unclear는 맞지 않고, budget, customers는 뜻이 맞지 않아요.","c":null},"h":"ea49b76555"}]},{"u":2,"id":"ms1-02-4","no":4,"ko":"Sand Fades, Stone Stays","items":[{"n":1,"t":"tf","q":"The argument became worse when Jordan spoke harshly.","ko":"Jordan이 거칠게 말했을 때 논쟁은 더 심해졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The argument escalated when Jordan spoke harshly.","Jordan이 거칠게 말했을 때 그 논쟁은 격화되었다."]],"w":"3번에서 The argument escalated when Jordan spoke harshly라고 해요. escalated는 격화되었다는 뜻이라서 더 심해졌다는 내용과 일치해요.","c":"T"},"h":"dafc4bea08"},{"n":2,"t":"tf","q":"Sam wrote his first message in a nearby rock.","ko":"Sam은 그의 첫 번째 글을 근처의 바위에 썼다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Feeling hurt, Sam knelt down and wrote in the sand.","상처받은 채로, Sam은 무릎을 꿇고 모래 위에 썼다."]],"w":"5번에서 Sam은 무릎을 꿇고 모래 위에(in the sand) 처음 글을 써요. 바위에 새긴 것은 10번에서 구조된 뒤예요.","c":"F"},"h":"e4c2aeb1cb"},{"n":3,"t":"tf","q":"Jordan hesitated for a long time before he dove in to save Sam.","ko":"Jordan은 Sam을 구하러 뛰어들기 전에 오랫동안 망설였다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Without hesitation, Jordan dove in and saved his friend’s life.","망설임 없이, Jordan은 물로 뛰어들어 그의 친구의 목숨을 구했다."]],"w":"9번에서 Without hesitation, Jordan dove in and saved his friend’s life라고 해요. 망설임 없이 뛰어들었다는 뜻이라서 오랫동안 망설였다는 말은 반대예요.","c":"F"},"h":"ca3213a5a7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Under the scorching sun, they walked on ...)","ko":"타는 듯한 태양 아래서, 그들은 계속 걸었다.","opts":["얼어붙을 듯한","타는 듯한","어두운","고요한"],"word":"scorching","r":{"a":"2) 타는 듯한","ev":"2번 문장","s":[[2,"Under the scorching sun, they walked on until they had a bitter argument about which path to take.","타는 듯한 태양 아래서, 그들은 어떤 길을 택할지에 대해 격렬한 말다툼을 할 때까지 계속 걸었다."]],"w":"2번은 사막을 걷는 장면이에요. 사막의 태양은 뜨거우니까 scorching은 '타는 듯한'이에요. 얼어붙을 듯하다는 반대예요.","c":2},"h":"8362521dea"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (After he recovered, Sam carved in a nearby rock, ...)","ko":"그가 회복한 후, Sam은 근처의 바위에 새겼다.","opts":["회복했다","도착했다","사과했다","포기했다"],"word":"recovered","r":{"a":"1) 회복했다","ev":"10번 문장","s":[[10,"After he recovered, Sam carved in a nearby rock, “Today, my best friend saved my life with his bravery.”","그가 회복한 후, Sam은 근처의 바위에 “오늘, 나의 가장 친한 친구가 그의 용기로 내 목숨을 구했다.”라고 새겼다."]],"w":"8~9번에서 Sam은 익사할 뻔했다가 구조되었어요. 그 뒤 몸이 나아졌다는 뜻이라서 recover는 '회복하다'예요.","c":1},"h":"15204a4dfc"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut when someone shows us kindness, we must engrave it in stone, where no wind can ever erase it.”","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만 누군가가 우리에게 친절함을 보여줄 때, 우리는 그것을 돌에 새겨야 하는데, 그곳은 어떤 바람도 결코 그것을 지울 수 없어.”","opts":["상처받은 일","용서의 바람","누군가가 보여 준 친절","사막의 바위"],"r":{"a":"3) 누군가가 보여 준 친절","ev":"14번 문장","s":[[14,"But when someone shows us kindness, we must engrave it in stone, where no wind can ever erase it.”","하지만 누군가가 우리에게 친절함을 보여줄 때, 우리는 그것을 돌에 새겨야 하는데, 그곳은 어떤 바람도 결코 그것을 지울 수 없어.”"]],"w":"14번에서 when someone shows us kindness 뒤에 we must engrave it in stone이 이어져요. 돌에 새기는 것은 누군가가 보여 준 친절(kindness)이에요. 상처는 모래에 쓴다고 13번에서 말해요.","c":3},"h":"67a9a46adc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While resting there, Sam’s foot slipped on the wet rocks, and he was about to drown.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그곳에서 쉬는 동안, Sam의 발이 젖은 바위에서 미끄러졌고, 그는 익사할 참이었다.","opts":["그곳에서 쉬는 동안 Sam은 젖은 바위에서 수영을 막 끝내려던 참이었다.","그곳에서 쉬는 동안 Sam은 물에 빠진 친구를 막 구하려던 참이었다.","그곳에서 쉬는 동안 Sam은 젖은 바위에서 미끄러져 막 물에 빠져 죽을 뻔했다.","그곳에서 쉬는 동안 Sam은 익사한 친구를 떠올리고 있었다."],"r":{"a":"3) 그곳에서 쉬는 동안 Sam은 젖은 바위에서 미끄러져 막 물에 빠져 죽을 뻔했다.","ev":"8번 문장","s":[[8,"While resting there, Sam’s foot slipped on the wet rocks, and he was about to drown.","그곳에서 쉬는 동안, Sam의 발이 젖은 바위에서 미끄러졌고, 그는 익사할 참이었다."]],"w":"be about to는 '막 ~하려던 참이다'예요. Sam의 발이 젖은 바위에서 미끄러져 익사할 뻔한 상황이고, 구한 사람은 9번의 Jordan이에요.","c":3},"h":"cf3e036741"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Jordan과 Sam은 사막을 행복하게 함께 걸었다.","Sam은 처음 쓴 글을 바위에 새겼다.","Jordan은 Sam에게 용서하는 법을 가르쳐 달라고 부탁했다.","Jordan과 Sam은 침묵 속에서 여행을 계속하다가 오아시스를 발견했다."],"opts":["Jordan and Sam walked happily together across the desert.","Sam carved his first message in a rock.","Jordan asked Sam to teach him how to forgive.","Jordan and Sam continued their journey in silence until they discovered an oasis."],"r":{"a":"4) Jordan and Sam continued their journey in silence until they discovered an oasis.","ev":"7번 문장","s":[[7,"They continued their journey in silence until they discovered an oasis.","그들은 오아시스를 발견할 때까지 침묵 속에서 여행을 계속했다."]],"w":"7번에서 두 사람은 침묵 속에서(in silence) 여행을 계속하다가 오아시스를 발견해요. 4번에서 거리를 두고 걸었고, 첫 글은 모래에 썼으며(5번), Jordan이 한 질문은 모래와 돌의 차이였어요(11~12번).","c":4},"h":"4e1b253015"},{"n":9,"t":"sum","q":"Two (A) friends were crossing a vast desert, but after the argument they walked at a (B) from each other.","ko":"(A) 친구인 두 사람은 광활한 사막을 건너고 있었지만, 말다툼 뒤에는 서로 (B)을(를) 두고 걸었다.","oko":["(A) 평생의 / (B) 거리","(A) 평생의 / (B) 속도","(A) 어린 / (B) 거리","(A) 게으른 / (B) 서두름","(A) 새로운 / (B) 속도"],"opts":["(A) lifelong / (B) distance","(A) lifelong / (B) speed","(A) young / (B) distance","(A) lazy / (B) hurry","(A) new / (B) speed"],"r":{"a":"1) (A) lifelong / (B) distance ((A) 평생의 / (B) 거리)","ev":"1번, 4번 문장","s":[[1,"Two lifelong friends, Jordan and Sam, were journeying across a vast desert.","평생의 친구인 Jordan과 Sam은 광활한 사막을 가로질러 여행하고 있었다."],[4,"After that, they walked at a distance from each other.","그 후, 그들은 서로 거리를 두고 걸었다."]],"w":"1번에서 두 사람은 평생의 친구(lifelong friends)이고, 4번에서 말다툼 뒤 서로 거리(distance)를 두고 걸었다고 해요.","c":1},"h":"d72630d7b0"},{"n":10,"t":"fill","q":"“Today, my best friend’s [A] stayed with me [B] than they should have.”","ko":"“오늘, 나의 가장 친한 친구의 [A]이(가) 마땅히 그래야 할 것보다 [B] 마음에 남았다.”","bank":["words","longer","rocks","winds","harshly","easily"],"bko":{"words":"말","longer":"더 오래","rocks":"바위들","winds":"바람들","harshly":"거칠게","easily":"쉽게"},"r":{"a":"[A] words (말), [B] longer (더 오래)","ev":"6번 문장","s":[[6,"“Today, my best friend’s words stayed with me longer than they should have.”","“오늘, 나의 가장 친한 친구의 말이 필요 이상으로 오래 마음에 남았다.”"]],"w":"6번에서 Sam이 모래에 쓴 글은 친구의 말(words)이 필요 이상으로 더 오래(longer) 마음에 남았다는 내용이에요. than이 뒤에 있어서 비교급 longer가 와야 해요.","c":null},"h":"56f1de4a33"}]},{"u":3,"id":"ms1-03-1","no":1,"ko":"편한데 재미있기까지?","items":[{"n":1,"t":"tf","q":"The first escalator carried passengers both up and down a slope.","ko":"최초의 에스컬레이터는 승객들을 경사면 위아래로 모두 이동시켰다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"It smoothly transported passengers up and down a slope.","그것은 승객들을 경사면 위아래로 원활하게 이동시켰다."]],"w":"5번에서 에스컬레이터는 승객들을 경사면 위아래로(up and down) 부드럽게 이동시켰다고 해요. 한쪽으로만 갔다는 말은 없어요.","c":"T"},"h":"4d18927fdb"},{"n":2,"t":"tf","q":"More escalators appeared in various places because the first escalator failed.","ko":"더 많은 에스컬레이터가 다양한 장소에 등장한 것은 최초의 에스컬레이터가 실패했기 때문이다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Following this success, more escalators appeared in various locations.","이 성공에 이어, 더 많은 에스컬레이터들이 다양한 장소에 등장했다."]],"w":"6번은 Following this success, 즉 ‘이 성공에 이어’ 더 많은 에스컬레이터가 나타났다고 해요. 실패가 아니라 성공 때문이에요.","c":"F"},"h":"faa24d17e2"},{"n":3,"t":"tf","q":"The first functional escalator debuted as a serious means of transport for workers at Coney Island.","ko":"최초로 가동된 에스컬레이터는 Coney Island에서 노동자들을 위한 진지한 교통수단으로 데뷔했다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"The first functional escalator debuted as a thrilling ride at Coney Island, New York, where over 75,000 visitors excitedly tried it out!","최초로 가동된 에스컬레이터는 뉴욕주 Coney Island에서 짜릿한 놀이기구로 데뷔했는데, 그곳에서 75,000명이 넘는 방문객들이 신이 나서 그것을 타보았다!"]],"w":"3번에서 최초의 에스컬레이터는 짜릿한 놀이기구(a thrilling ride)로 데뷔했고, 방문객들이 신이 나서 타 보았어요. 노동자를 위한 교통수단이라는 말은 없어요.","c":"F"},"h":"e9a71b477e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Called the “Inclined Elevator,” it was constructed in 1896 by American engineer Jesse Reno.)","ko":"‘경사진 엘리베이터’라고 불리며, 그것은 1896년에 미국인 엔지니어 Jesse Reno에 의해 제작되었다.","word":"constructed","opts":["제작되었다","취소되었다","판매되었다","수리되었다"],"r":{"a":"1) 제작되었다","ev":"4번 문장","s":[[4,"Called the “Inclined Elevator,” it was constructed in 1896 by American engineer Jesse Reno.","‘경사진 엘리베이터’라고 불리며, 그것은 1896년에 미국인 엔지니어 Jesse Reno에 의해 제작되었다."]],"w":"construct는 ‘제작하다, 만들다’예요. was constructed in 1896 by Jesse Reno는 ‘1896년에 Jesse Reno에 의해 만들어졌다’는 수동태예요.","c":1},"h":"57aac72f58"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… they have become a vital component of our everyday life!)","ko":"… 그것들은 우리의 일상생활에서 필수적인 요소가 되었다!","word":"vital","opts":["사소한","오래된","필수적인","위험한"],"r":{"a":"3) 필수적인","ev":"11번 문장","s":[[11,"Consequently, they have become a vital component of our everyday life!","결과적으로, 그것들은 우리의 일상생활에서 필수적인 요소가 되었다!"]],"w":"10번에서 크게 발전해 이동이 쉬워졌고, 그 결과 일상생활의 요소가 되었다는 흐름이에요. vital은 ‘없어서는 안 될, 필수적인’이라는 뜻이에요.","c":3},"h":"068b19f205"},{"n":6,"t":"ref","q":"What does the underlined “they” refer to?\nTheir escalators were so successful that they were awarded the Grand Prize at the Paris Exposition!","ko":"밑줄 친 they가 가리키는 것은?","sko":"그들의 에스컬레이터는 매우 성공적이어서 그것들은 파리 박람회에서 대상을 받았다!","opts":["승객들","그들의 에스컬레이터들","파리 박람회의 방문객들","Otis Elevator Company의 직원들"],"r":{"a":"2) 그들의 에스컬레이터들","ev":"9번 문장","s":[[9,"Their escalators were so successful that they were awarded the Grand Prize at the Paris Exposition!","그들의 에스컬레이터는 매우 성공적이어서 그것들은 파리 박람회에서 대상을 받았다!"]],"w":"so successful that they were awarded에서 성공적이었고 대상을 받은 것은 앞의 Their escalators(그들의 에스컬레이터들)예요. 상을 받은 대상은 사람이 아니라 에스컬레이터예요.","c":2},"h":"d3d00ecfbd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Have you ever thought that taking an escalator felt like being on a fun ride?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신은 에스컬레이터를 타는 것이 재미있는 놀이기구를 타는 것처럼 느껴진다고 생각해 본 적이 있는가?","opts":["에스컬레이터를 타는 것이 재미있는 놀이기구를 타는 것 같다고 생각해 본 적이 있는가?","에스컬레이터를 타면 놀이공원에 반드시 가야 한다고 생각해 본 적이 있는가?","놀이기구가 에스컬레이터보다 안전하다고 생각해 본 적이 있는가?","에스컬레이터를 피하고 놀이기구만 타고 싶다고 생각해 본 적이 있는가?"],"r":{"a":"1) 에스컬레이터를 타는 것이 재미있는 놀이기구를 타는 것 같다고 생각해 본 적이 있는가?","ev":"1번 문장","s":[[1,"Have you ever thought that taking an escalator felt like being on a fun ride?","당신은 에스컬레이터를 타는 것이 재미있는 놀이기구를 타는 것처럼 느껴진다고 생각해 본 적이 있는가?"]],"w":"Have you ever thought that ~?은 \"~라고 생각해 본 적이 있는가?\"이고, felt like being on a fun ride는 \"재미있는 놀이기구를 타는 것처럼 느껴졌다\"예요.","c":1},"h":"2b3c7fd00b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["에스컬레이터는 처음 등장한 이후 거의 달라지지 않았다.","현대의 에스컬레이터는 속도를 안전보다 앞세운다.","에스컬레이터는 발전해서 이제 층 사이를 이동하기가 더 쉬워졌다.","에스컬레이터는 현대 건물에서 사라졌다."],"opts":["Escalators have hardly changed since they first appeared.","Modern escalators put speed before safety.","Escalators have evolved and now make it easier to move between floors.","Escalators have disappeared from modern buildings."],"r":{"a":"3) Escalators have evolved and now make it easier to move between floors. (에스컬레이터는 발전해서 이제 층 사이를 이동하기가 더 쉬워졌다.)","ev":"10번 문장","s":[[10,"Since then, escalators have evolved significantly, making it easier to move between floors while prioritizing safety and efficiency in modern designs.","그 이후로, 에스컬레이터는 크게 발전하여, 현대적인 설계에서 안전과 효율성을 우선시하면서 층 사이로 이동하는 것을 더 쉽게 만들었다."]],"w":"10번에서 그 이후로 에스컬레이터는 크게 발전했고(evolved significantly) 층 사이로 이동하는 것을 더 쉽게 만들었다고 해요. 현대 설계는 안전과 효율성을 우선시한다고 했으니 속도를 앞세운다는 말은 틀려요.","c":3},"h":"77d398c729"},{"n":9,"t":"sum","q":"Charles Seeberger (A) with the Otis Elevator Company to launch escalators as a(n) (B) form of transportation.","ko":"Charles Seeberger는 에스컬레이터를 (B) 교통수단으로 출시하기 위해 Otis Elevator Company와 (A).","oko":["(A) 다투었다 / (B) 혁신적인","(A) 협력했다 / (B) 혁신적인","(A) 경쟁했다 / (B) 오래된","(A) 협력했다 / (B) 위험한","(A) 경쟁했다 / (B) 혁신적인"],"opts":["(A) argued / (B) innovative","(A) partnered / (B) innovative","(A) competed / (B) old","(A) partnered / (B) dangerous","(A) competed / (B) innovative"],"r":{"a":"2) (A) partnered / (B) innovative ((A) 협력했다 / (B) 혁신적인)","ev":"8번 문장","s":[[8,"He partnered with the Otis Elevator Company to launch escalators as an innovative form of transportation.","그는 에스컬레이터를 혁신적인 교통수단으로 출시하기 위해 Otis Elevator Company와 협력했다."]],"w":"8번에서 그는 에스컬레이터를 혁신적인(innovative) 교통수단으로 출시하기 위해 Otis Elevator Company와 협력했다(partnered)고 해요.","c":2},"h":"a773b07b3c"},{"n":10,"t":"fill","q":"In 1900, Charles Seeberger [A] the term escalator by [B] the Latin word scala with the “elevator.”","ko":"1900년에 Charles Seeberger는 라틴어 scala와 ‘엘리베이터’를 [B]에 의해 escalator라는 용어를 [A].","bank":["introduced","appeared","evolved","combining","prioritizing","following"],"bko":{"introduced":"도입했다","appeared":"나타났다","evolved":"발전했다","combining":"결합하는 것","prioritizing":"우선시하는 것","following":"뒤따르는 것"},"r":{"a":"[A] introduced, [B] combining","ev":"7번 문장","s":[[7,"In 1900, Charles Seeberger, an American inventor, introduced the term escalator, combining the Latin word scala, meaning “steps,” with the “elevator.”","1900년에, 미국인 발명가 Charles Seeberger가 ‘계단’을 의미하는 라틴어 scala와 ‘엘리베이터’를 결합하여, ‘에스컬레이터’라는 용어를 도입했다."]],"w":"7번에서 Seeberger는 용어 escalator를 도입했고(introduced), 라틴어 scala와 elevator를 결합해서(combining) 만들었어요. appeared와 evolved는 목적어를 받지 못하는 동사라 [A]에 맞지 않고, prioritizing과 following은 ‘A를 B와 ~하다’의 with와 어울리지 않아요.","c":null},"h":"efbce9ec52"}]},{"u":3,"id":"ms1-03-2","no":2,"ko":"바닷속 탄소 감옥, 그 끈적한 비밀은?","items":[{"n":1,"t":"tf","q":"Some brown algae can take in a huge amount of carbon from seawater every year.","ko":"일부 갈조류는 매년 바닷물에서 엄청난 양의 탄소를 흡수할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"According to research conducted by the Max Planck Institute, some species of brown algae can absorb up to 550 million tons of carbon from seawater each year.","Max Planck 연구소에 의해 수행된 연구에 따르면, 일부 갈조류 종은 매년 바닷물에서 5억 5천만 톤의 탄소까지 흡수할 수 있다."]],"w":"5번에서 일부 갈조류 종은 매년 바닷물에서 탄소를 최대 5억 5천만 톤까지 흡수할 수 있다고 해요. take in은 absorb와 같은 뜻으로 쓴 표현이에요.","c":"T"},"h":"41d566e9c6"},{"n":2,"t":"tf","q":"Brown algae keep all the extra sugar inside their bodies.","ko":"갈조류는 여분의 당분을 모두 몸속에 간직한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"During this process, they release excess sugar back into the water.","이 과정 동안, 그것들은 과잉 당분을 물속으로 다시 방출한다."]],"w":"9번에서 갈조류는 과잉 당분(excess sugar)을 물속으로 다시 방출한다(release)고 해요. 몸속에 모두 간직한다는 말은 반대예요.","c":"F"},"h":"90908848cd"},{"n":3,"t":"tf","q":"The hard and sticky substance stays near the ocean surface for only a few days.","ko":"단단하고 끈적거리는 물질은 바다 표면 근처에 단 며칠만 머문다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"This substance then sinks to the ocean floor, where it can remain for hundreds or thousands of years.","이 물질은 이후에 해저로 가라앉는데, 그곳에서 그것은 수백 또는 수천 년 동안 남아 있을 수 있다."]],"w":"11번에서 이 물질은 해저로 가라앉아 수백 또는 수천 년 동안 남아 있을 수 있다고 해요. 표면 근처에 며칠만 머문다는 말은 본문과 달라요.","c":"F"},"h":"a17d8478e2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… brown algae obtain energy for growth by absorbing carbon and turning it into sugar …)","ko":"… 갈조류는 탄소를 흡수하고 그것을 당분으로 전환함으로써 성장을 위한 에너지를 얻는다.","word":"obtain","opts":["얻는다","버린다","낭비한다","나눠 준다"],"r":{"a":"1) 얻는다","ev":"8번 문장","s":[[8,"Like plants, brown algae obtain energy for growth by absorbing carbon and turning it into sugar through photosynthesis.","식물들처럼, 갈조류는 탄소를 흡수하고 광합성을 통해 그것을 당분으로 전환함으로써 성장을 위한 에너지를 얻는다."]],"w":"obtain은 ‘얻다’예요. 갈조류가 탄소를 흡수하고 당분으로 바꿔서 성장에 쓸 에너지를 얻는다는 뜻이에요.","c":1},"h":"8d29a06139"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… it contributes to reducing the amount of greenhouse gases that harm our planet.)","ko":"… 그것은 지구에 해를 끼치는 온실 가스의 양을 줄이는 것에 기여한다.","word":"contributes","opts":["반대한다","기여한다","의존한다","경쟁한다"],"r":{"a":"2) 기여한다","ev":"12번 문장","s":[[12,"By locking away carbon, it contributes to reducing the amount of greenhouse gases that harm our planet.","탄소를 가두어 둠으로써, 그것은 지구에 해를 끼치는 온실 가스의 양을 줄이는 것에 기여한다."]],"w":"contribute to는 ‘~에 기여하다, 도움이 되다’예요. 탄소를 가두어 둠으로써 온실 가스를 줄이는 데 도움이 된다는 뜻이에요.","c":2},"h":"2ae6d9ccce"},{"n":6,"t":"ref","q":"What does the underlined “its” refer to?\nClassified as brown algae, this ocean-living organism has recently gained attention for its ability to fight climate change.","ko":"밑줄 친 its가 가리키는 것은?","sko":"갈조류로 분류되는 이 바다에 사는 유기체는 기후 변화에 맞서 싸우는 그것의 능력으로 최근에 주목을 받았다.","opts":["기후 변화","Max Planck 연구소","갈조류로 분류되는 바다에 사는 유기체(해조류)","인간의 건강"],"r":{"a":"3) 갈조류로 분류되는 바다에 사는 유기체(해조류)","ev":"4번 문장","s":[[4,"Classified as brown algae, this ocean-living organism has recently gained attention for its ability to fight climate change.","갈조류로 분류되는 이 바다에 사는 유기체는 기후 변화에 맞서 싸우는 그것의 능력으로 최근에 주목을 받았다."]],"w":"its ability to fight climate change에서 ‘기후 변화와 싸우는 능력’을 가진 것은 주어 this ocean-living organism(바다에 사는 유기체, 해조류)이에요. 기후 변화는 맞서 싸우는 대상이에요.","c":3},"h":"936768b29f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n“But did you know that seaweed may benefit not only human health, but also the health of our planet?”","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 당신은 해조류가 인간의 건강뿐만 아니라 지구의 건강에도 도움을 줄 수 있다는 사실을 알고 있었는가?","opts":["해조류가 사람의 건강에만 도움이 되고 지구의 건강에는 해롭다는 것을 알고 있었는가?","해조류가 인간의 건강뿐만 아니라 지구의 건강에도 도움이 될 수 있다는 것을 알고 있었는가?","인간의 건강보다 지구의 건강을 먼저 생각해야 한다는 것을 알고 있었는가?","지구가 건강해진 덕분에 해조류가 인간에게 이로워졌다는 것을 알고 있었는가?"],"r":{"a":"2) 해조류가 인간의 건강뿐만 아니라 지구의 건강에도 도움이 될 수 있다는 것을 알고 있었는가?","ev":"3번 문장","s":[[3,"But did you know that seaweed may benefit not only human health, but also the health of our planet?","그러나 당신은 해조류가 인간의 건강뿐만 아니라 지구의 건강에도 도움을 줄 수 있다는 사실을 알고 있었는가?"]],"w":"not only A, but also B는 ‘A뿐만 아니라 B도’예요. 해조류가 사람의 건강과 지구의 건강 둘 다에 도움이 될 수 있다는 뜻이에요. 나머지는 지구에 해롭다, 순서를 따진다, 원인과 결과를 바꿔 말해서 본문과 달라요.","c":2},"h":"fdf9f08017"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["갈조류가 흡수한 탄소는 자연적인 탄소 순환으로 쉽게 되돌아간다.","갈조류는 흡수한 탄소를 바로 전부 내보낸다.","갈조류가 포집한 탄소는 자연적인 탄소 순환으로 쉽게 다시 들어가지 않는다.","자연적인 탄소 순환은 매일 갈조류의 탄소를 더 필요로 한다."],"opts":["Carbon taken in by brown algae easily returns to the natural carbon cycle.","Brown algae release all of the carbon they take in right away.","Carbon captured by brown algae does not easily go back into the natural carbon cycle.","The natural carbon cycle needs more carbon from brown algae every day."],"r":{"a":"3) Carbon captured by brown algae does not easily go back into the natural carbon cycle. (갈조류가 포집한 탄소는 자연적인 탄소 순환으로 쉽게 다시 들어가지 않는다.)","ev":"6번 문장","s":[[6,"More importantly, this captured carbon does not easily reenter the natural carbon cycle.","더 중요한 것은, 이 포집된 탄소는 자연적인 탄소 순환으로 쉽게 다시 들어가지 않는다."]],"w":"6번에서 이 포집된 탄소(captured carbon)는 자연적인 탄소 순환으로 쉽게 다시 들어가지 않는다(does not easily reenter)고 해요.","c":3},"h":"527d0825bd"},{"n":9,"t":"sum","q":"In bladderwrack, about (A) of the sugar becomes a hard and sticky substance that fish and other organisms cannot (B).","ko":"블래더랙에서는 당분의 (A)이(가) 물고기와 다른 유기체가 (B) 수 없는 단단하고 끈적거리는 물질이 된다.","oko":["(A) 전부 / (B) 먹을","(A) 절반 / (B) 먹을","(A) 절반 / (B) 볼","(A) 아무것도 / (B) 살","(A) 전부 / (B) 들을"],"opts":["(A) all / (B) eat","(A) half / (B) eat","(A) half / (B) see","(A) none / (B) buy","(A) all / (B) hear"],"r":{"a":"2) (A) half / (B) eat ((A) 절반 / (B) 먹을)","ev":"10번 문장","s":[[10,"In one type of brown algae called bladderwrack, around half of this sugar becomes a hard and sticky substance that fish and other organisms cannot eat.","블래더랙이라고 불리는 한 갈조류 종의 경우, 이 당분의 약 절반이 물고기와 다른 유기체들이 먹을 수 없는 단단하고 끈적거리는 물질이 된다."]],"w":"10번에서 블래더랙의 당분 약 절반(around half)이 물고기와 다른 유기체가 먹을 수 없는(cannot eat) 단단하고 끈적거리는 물질이 된다고 해요.","c":2},"h":"d47d69e86c"},{"n":10,"t":"fill","q":"Seaweed has long been a common [A] in [B] around the world.","ko":"해조류는 오래전부터 전 세계 [B]에서 흔히 사용되어 온 [A]이다.","bank":["ingredient","cuisines","nutrients","photosynthesis","energy","floor"],"bko":{"ingredient":"식재료","cuisines":"음식 문화","nutrients":"영양분","photosynthesis":"광합성","energy":"에너지","floor":"바닥"},"r":{"a":"[A] ingredient (식재료), [B] cuisines (음식 문화)","ev":"1번 문장","s":[[1,"Seaweed has long been a common ingredient in cuisines around the world.","해조류는 오래전부터 전 세계 여러 음식 문화에서 흔히 사용되어 온 식재료이다."]],"w":"1번에서 해조류는 오래전부터 전 세계 음식 문화(cuisines)에서 흔히 쓰이는 식재료(ingredient)라고 해요. a common 뒤에는 단수 명사가 와야 해서 nutrients는 맞지 않아요.","c":null},"h":"6466a7182b"}]},{"u":3,"id":"ms1-03-3","no":3,"ko":"잘 모르겠지만, 그때가 그리워요","items":[{"n":1,"t":"tf","q":"Some young listeners feel nostalgic for a time before they were born.","ko":"일부 젊은 청취자들은 자신이 태어나기 전의 시간에 대해 향수를 느낀다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"And why do so many young listeners of this song become nostalgic for that time in the past, even though some weren’t even born yet?","그리고 왜 이 노래의 많은 젊은 청취자들은 (그들 중) 일부가 아직 태어나지도 않았을 때인데도 불구하고 그 과거의 시간에 대해 향수를 느끼게 되는가?"]],"w":"3번에서 이 노래의 젊은 청취자들 중 일부는 아직 태어나지도 않았는데도 그 과거에 향수를 느낀다고 해요.","c":"T"},"h":"193ebb1cb7"},{"n":2,"t":"tf","q":"The word anemoia is made from two Latin words meaning “wind” and “mind.”","ko":"‘아네모이아’라는 단어는 ‘바람’과 ‘마음’을 뜻하는 두 라틴어 단어로 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It combines the Greek words anemos (wind) and noia (mind), capturing the idea of a mind blown by winds from the past.","그것은 그리스 단어 anemos (바람)와 noia (마음)를 결합하며, 과거로부터 오는 바람에 의해 휩쓸려 버린 마음이라는 개념을 표현한다."]],"w":"5번에서 anemoia는 그리스(Greek) 단어 anemos(바람)와 noia(마음)를 결합한 말이에요. 라틴어가 아니에요.","c":"F"},"h":"bcee0099b7"},{"n":3,"t":"tf","q":"Film directors and music producers avoid the past because it is not popular.","ko":"영화감독과 음악 제작자들은 과거가 인기가 없기 때문에 과거를 피한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Film directors and music producers look to the past to create romanticized versions of different times in history.","영화감독과 음악 제작자들은 역사 속 다양한 시대의 미화된 버전을 만들기 위해 과거를 돌아본다."]],"w":"10번에서 영화감독과 음악 제작자들은 과거를 돌아보며(look to the past) 미화된 시대의 모습을 만들어요. 과거를 피한다는 말은 반대예요.","c":"F"},"h":"660252943a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These forms of media give us an idealized representation of what life was like for the generations before us.)","ko":"이러한 형태의 매체는 우리에게 우리 이전 세대의 삶이 어떠했는지에 대한 이상화된 묘사를 제공한다.","word":"representation","opts":["묘사","거절","비용","실험"],"r":{"a":"1) 묘사","ev":"7번 문장","s":[[7,"These forms of media give us an idealized representation of what life was like for the generations before us.","이러한 형태의 매체는 우리에게 우리 이전 세대의 삶이 어떠했는지에 대한 이상화된 묘사를 제공한다."]],"w":"representation은 여기서 ‘묘사, 보여 주는 모습’이라는 뜻이에요. 옛 영화나 노래가 이전 세대의 삶을 이상화된 모습으로 보여 준다는 흐름이에요.","c":1},"h":"0ac15abbd3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… especially if we aren’t content with the present.)","ko":"… 특히 우리가 현재에 만족하지 못하는 경우 그러하다.","word":"content","opts":["지루한","화가 난","만족하는","두려워하는"],"r":{"a":"3) 만족하는","ev":"8번 문장","s":[[8,"Faced with this curated content, we tend to believe that everything was easier back then, especially if we aren’t content with the present.","이러한 선별된 내용에 직면하면,
