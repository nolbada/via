<script>
var P=[{"u":1,"id":"ch3-01-1","no":1,"ko":"그날은 일급비밀!","items":[{"n":1,"t":"tf","q":"The term “D-Day” can also be used when the date of an event has not been decided yet.","ko":"‘디데이’라는 용어는 어떤 일의 날짜가 아직 정해지지 않았을 때에도 쓸 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"It is also sometimes used if the date has not yet been decided.","그것은 때때로 날짜가 아직 정해지지 않았을 때에도 사용된다."]],"w":"7번 문장에 날짜가 아직 정해지지 않았을 때(if the date has not yet been decided)에도 쓰인다고 해요. 본문과 맞아요.","c":"T"},"h":"978cb54fe5"},{"n":2,"t":"tf","q":"The Normandy landing in 1944 was the first and the last military operation called D-Day.","ko":"1944년의 노르망디 상륙은 디데이라고 불린 첫 번째이자 마지막 군사 작전이었다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"On June 6, 1944, Allied forces landed at Normandy, France, to free mainland Europe from the Nazis.","1944년 6월 6일에, 연합군은 나치로부터 유럽 본토를 해방시키기 위해 프랑스의 노르망디에 상륙했다."],[5,"However, this was neither the first nor the last military operation to be designated as D-Day.","그러나, 이것은 디데이로 지정된 첫 번째 군사 작전도 마지막 (군사 작전)도 아니었다."]],"w":"5번 문장에서 neither the first nor the last라고 했어요. ‘첫 번째도 마지막도 아니었다’는 뜻이라서 ‘첫 번째이자 마지막’은 반대예요.","c":"F"},"h":"d2023ea2d6"},{"n":3,"t":"tf","q":"H-4 means four days before D-Day.","ko":"H-4는 디데이 4일 전을 의미한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"For example, H-4 means four hours before H–Hour, while D+5 means five days after D-Day.","예를 들어, H-4는 에이치아워 4시간 전을 의미하는 반면, D+5는 디데이 5일 후를 의미한다."]],"w":"10번 문장에서 H-4는 four hours before H-Hour, 즉 에이치아워 4시간 전이에요. ‘일(day)’이 아니라 ‘시간(hour)’이고, 기준도 D-Day가 아니라 H-Hour예요.","c":"F"},"h":"064ff91c5b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the day on which it is scheduled to occur…)","ko":"(…그것이 발생할 예정인 날짜…)","opts":["미뤄진","예정된","잊힌","금지된"],"word":"scheduled","r":{"a":"2) 예정된","ev":"1번 문장","s":[[1,"When an important event is being planned, the day on which it is scheduled to occur is sometimes referred to as “D-Day.”","중요한 일이 계획되고 있을 때, 그것이 발생할 예정인 날짜는 때때로 ‘디데이’라고 불린다."]],"w":"1번 문장은 중요한 일이 ‘계획되고 있을 때’, 그 일이 일어나기로 정해진 날을 말해요. be scheduled to occur는 ‘일어날 예정이다’라서 scheduled = 예정된이에요.","c":2},"h":"f6369ca865"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the term “H-Hour” is used to specify the exact hour…)","ko":"(…‘에이치아워’라는 용어는 정확한 시간을 …하기 위해 사용된다)","opts":["숨기다","미루다","명시하다","바꾸다"],"word":"specify","r":{"a":"3) 명시하다","ev":"8번 문장","s":[[8,"Along with “D-Day,” the term “H-Hour” is used to specify the exact hour at which the event will take place.","‘디데이’와 함께, ‘에이치아워’라는 용어도 일이 발생할 정확한 시간을 명시하기 위해 사용된다."]],"w":"H-Hour는 일이 일어날 정확한 시간을 분명히 밝히는 말이에요. specify = 명시하다(분명히 밝히다). 비밀로 하는 것(숨기다)은 6번에서 날짜를 감추는 쓰임이라 뜻이 달라요.","c":3},"h":"9b56e213f3"},{"n":6,"t":"ref","q":"What does the underlined \"this term\" refer to?\nIn the military, this term indicates the day on which a certain operation will be carried out.","ko":"밑줄 친 this term이 가리키는 것은?","sko":"군대에서, 이 용어는 특정 작전이 수행될 날짜를 나타낸다.","opts":["특정 작전","군대","‘디데이’라는 용어","프랑스의 노르망디"],"r":{"a":"3) ‘디데이’라는 용어","ev":"1~2번 문장","s":[[1,"When an important event is being planned, the day on which it is scheduled to occur is sometimes referred to as “D-Day.”","중요한 일이 계획되고 있을 때, 그것이 발생할 예정인 날짜는 때때로 ‘디데이’라고 불린다."],[2,"In the military, this term indicates the day on which a certain operation will be carried out.","군대에서, 이 용어는 특정 작전이 수행될 날짜를 나타낸다."]],"w":"이 문장은 ‘날짜(the day)’를 나타내는 용어를 말해요. 1번 문장에서 ‘디데이’가 바로 그런 날짜를 부르는 말이라고 했으니 this term은 ‘디데이’라는 용어예요.","c":3,"k":"this term = ‘디데이’라는 용어"},"pron":"this term","h":"46efa1e997"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Numbers with plus or minus signs can be used to refer to certain times before or after D-Day or H-Hour.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"플러스와 마이너스 표시가 있는 숫자는 디데이 또는 에이치아워 전이나 후의 특정 시간을 나타내는 데 사용될 수 있다.","opts":["디데이와 에이치아워는 숫자 없이는 쓸 수 없다.","플러스나 마이너스가 붙은 숫자로 디데이나 에이치아워 전후의 특정 시간을 나타낼 수 있다.","숫자 앞에 플러스나 마이너스가 붙으면 날짜가 비밀이 된다.","플러스와 마이너스는 디데이가 몇 번 있었는지를 나타낸다."],"r":{"a":"2) 플러스나 마이너스가 붙은 숫자로 디데이나 에이치아워 전후의 특정 시간을 나타낼 수 있다.","ev":"9번 문장","s":[[9,"Numbers with plus or minus signs can be used to refer to certain times before or after D-Day or H-Hour.","플러스와 마이너스 표시가 있는 숫자는 디데이 또는 에이치아워 전이나 후의 특정 시간을 나타내는 데 사용될 수 있다."]],"w":"9번 문장은 플러스·마이너스가 붙은 숫자로 디데이나 에이치아워의 전이나 후의 시간을 나타낸다는 뜻이에요. 비밀이 되는 것도, 디데이의 횟수를 세는 것도 아니에요.","c":2},"h":"8b4b9253bd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["가장 유명한 디데이는 제1차 세계대전 중에 일어났다.","연합군은 1944년 6월 6일에 이탈리아에 상륙했다.","가장 유명한 디데이는 제2차 세계대전 중에 일어났다.","에이치아워는 일이 일어날 정확한 날짜를 나타내는 데 쓰인다."],"opts":["The most famous D-Day took place during World War I.","The Allied forces landed in Italy on June 6, 1944.","The most famous D-Day took place during World War II.","H-Hour is used to show the exact day of an event."],"r":{"a":"3) The most famous D-Day took place during World War II. (가장 유명한 디데이는 제2차 세계대전 중에 일어났다.)","ev":"3번 문장","s":[[3,"The most famous D-Day took place during World War II.","가장 유명한 디데이는 제2차 세계대전 중에 발생했다."]],"w":"3번 문장에서 가장 유명한 디데이는 제2차 세계대전 중에 일어났다고 했어요. 나머지는 본문과 달라요.","c":3},"h":"a3b5797fa3"},{"n":9,"t":"sum","q":"Terms like “D-Day” and “H-Hour” help people talk about the (A) of an event both (B) and in private.","ko":"‘디데이’와 ‘에이치아워’ 같은 용어는 사람들이 일의 (A)을(를) (B) 그리고 남모르게 이야기할 수 있게 돕는다.","oko":["A 장소 / B 시끄럽게","A 원인 / B 공개적으로","A 비용 / B 안전하게","A 결과 / B 빠르게","A 시기 / B 쉽게"],"opts":["(A) place / (B) loudly","(A) cause / (B) openly","(A) cost / (B) safely","(A) result / (B) quickly","(A) timing / (B) easily"],"r":{"a":"5) (A) timing / (B) easily (A 시기 / B 쉽게)","ev":"11번 문장","s":[[11,"By using these terms, the timing of an event can be talked about both easily and secretly.","이 용어들을 사용함으로써, 어떤 일의 시기가 쉽고도 은밀히 이야기될 수 있다."]],"w":"11번 문장은 이 용어들로 일의 시기(timing)를 쉽고(easily) 은밀하게 이야기할 수 있다고 말해요.","c":5},"h":"890b7e632d"},{"n":10,"t":"fill","q":"In addition, the term is commonly used [A] of the military whenever the date of an event needs to be kept a [B].","ko":"게다가, 그 용어는 어떤 일의 날짜가 [B](으)로 유지되어야 할 때는 언제든지 군대 [A]에서도 흔히 사용된다.","bank":["secret","exact","outside","signs","operation","hour"],"bko":{"secret":"비밀","exact":"정확한","outside":"밖","signs":"표시","operation":"작전","hour":"시간"},"r":{"a":"[A] outside (밖), [B] secret (비밀)","ev":"6번 문장","s":[[6,"In addition, the term is commonly used outside of the military whenever the date of an event needs to be kept a secret.","게다가, 그 용어는 어떤 일의 날짜가 비밀로 유지되어야 할 때는 언제든지 군대 밖에서도 흔히 사용된다."]],"w":"6번 문장은 이 용어가 군대 밖(outside)에서도, 날짜를 비밀(secret)로 해야 할 때 쓰인다는 내용이에요.","c":null},"h":"f57f5a165a"}]},{"u":1,"id":"ch3-01-2","no":2,"ko":"귀를 의심하게 만드는 말","items":[{"n":1,"t":"tf","q":"A spoonerism can be made on purpose or by accident.","ko":"스푸너리즘은 일부러 또는 우연히 만들어질 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A spoonerism is the mixing of sounds in a phrase that makes the phrase itself sound funny, either intentionally or by mistake.","스푸너리즘은 어구 자체를 의도적으로 또는 실수로 재미있게 들리게 만드는 어구 내에서의 소리들의 혼합이다."]],"w":"2번 문장의 either intentionally or by mistake가 ‘의도적으로든 실수로든’이라는 뜻이에요. 본문과 맞아요.","c":"T"},"h":"f352f59fa7"},{"n":2,"t":"tf","q":"Spooner always noticed his own slips of the tongue right away.","ko":"스푸너는 자신의 말실수를 늘 곧바로 알아챘다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Hilariously, he was seldom aware that he was making such mistakes.","아주 재미있게도, 그는 자신이 그런 실수들을 하고 있다는 것을 거의 알지 못했다."]],"w":"8번 문장에서 스푸너는 자신이 그런 실수를 하고 있다는 것을 좀처럼(seldom) 알지 못했다고 해요. ‘늘 곧바로 알아챘다’는 반대예요.","c":"F"},"h":"ef0ff0255e"},{"n":3,"t":"tf","q":"Some people doubted that the quotes of Spooner’s mistakes were real.","ko":"어떤 사람들은 스푸너의 실수로 전해지는 말들이 진짜인지 의심했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Although some doubted the authenticity of these quotes, the Spooner legend grew bigger and bigger.","비록 어떤 사람들은 이러한 인용의 진위성을 의심했지만, 스푸너의 전설은 점점 더 거창해졌다."]],"w":"10번 문장의 some doubted the authenticity of these quotes가 ‘이 인용들이 진짜인지 의심했다’는 뜻이에요. 본문과 맞아요.","c":"T"},"h":"9237fcc0e7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…Spooner was famous for these peculiar slips of the tongue.)","ko":"(…스푸너는 이러한 특이한 말실수로 유명했다.)","opts":["평범한","위험한","특이한","지루한"],"word":"peculiar","r":{"a":"3) 특이한","ev":"7번 문장","s":[[7,"Popular, kind, and intelligent, Spooner was famous for these peculiar slips of the tongue.","인기가 많고 친절하며 명석했던 스푸너는 이러한 특이한 말실수로 유명했다."]],"w":"스푸너는 소리가 뒤바뀐 이상한 말실수로 유명했어요. peculiar = 특이한. 평범하다면 유명해질 이유가 없어요.","c":3},"h":"1caf085309"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The term “spoonerism” was officially incorporated into the English language…)","ko":"(‘스푸너리즘’이라는 용어는 공식적으로 영어에 …되었다)","opts":["편입되었다","제외되었다","번역되었다","금지되었다"],"word":"incorporated","r":{"a":"1) 편입되었다","ev":"11번 문장","s":[[11,"The term “spoonerism” was officially incorporated into the English language while he was still in his fifties, marking his amusing place in history forever.","‘스푸너리즘’이라는 용어는 그가 아직 50대였을 때 공식적으로 영어에 편입되어, 역사에 영원히 그의 유쾌한 자취를 남기게 되었다."]],"w":"스푸너리즘이라는 말이 영어 안으로 공식적으로 들어갔다는 뜻이에요. incorporate = 포함하다, 편입시키다(incorporated = 편입되었다). 제외되었거나 금지되었다면 영어 단어가 될 수 없어요.","c":1},"h":"e7a710ebb7"},{"n":6,"t":"ref","q":"What does the underlined \"Others\" refer to?\nOthers occur when the vowel sounds are mixed up, like when “feel like a fool” becomes “fool like a feel.”","ko":"밑줄 친 Others가 가리키는 것은?","sko":"다른 것들은 모음들이 뒤섞일 때 일어나는데, ‘feel like a fool(바보같이 느끼다)’이 ‘fool like a feel’이 될 때와 같다.","opts":["다른 학자들","다른 종류의 스푸너리즘","다른 모음들","다른 말장난 책들"],"r":{"a":"2) 다른 종류의 스푸너리즘","ev":"3~4번 문장","s":[[3,"Some spoonerisms involve the confusion of consonant sounds, as in saying “fight a liar” rather than “light a fire.”","어떤 스푸너리즘은 ‘light a fire(불을 붙이다)’라고 하는 대신 ‘fight a liar(거짓말쟁이와 싸우다)’라고 말하는 것에서와 같은 자음들의 혼동을 포함한다."],[4,"Others occur when the vowel sounds are mixed up, like when “feel like a fool” becomes “fool like a feel.”","다른 것들은 모음들이 뒤섞일 때 일어나는데, ‘feel like a fool(바보같이 느끼다)’이 ‘fool like a feel’이 될 때와 같다."]],"w":"Others occur when the vowel sounds are mixed up은 ‘모음 소리가 뒤섞일 때 일어나는 다른 것들’이라는 뜻이에요. 바로 앞에서 자음이 섞이는 스푸너리즘을 말했으니, Others는 모음이 섞이는 다른 종류의 스푸너리즘이에요.","c":2,"k":"Others = 다른 종류의 스푸너리즘"},"pron":"Others","h":"e3132cf6f5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Spoonerisms often result in nonsense, but the funniest are those that change the meaning altogether, such as saying “I’m a damp stealer” instead of “I’m a stamp dealer.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"스푸너리즘은 자주 뜻이 통하지 않는 말로 귀결되지만, 가장 재미있는 것은 ‘I’m a stamp dealer’ 대신에 ‘I’m a damp stealer’라고 말하는 것처럼 뜻을 완전히 바꾸어 놓는 것이다.","opts":["스푸너리즘은 늘 뜻이 통하며, 가장 재미있는 것은 소리가 같은 것이다.","스푸너리즘은 거의 재미가 없고, 뜻을 바꾸는 것은 드물다.","스푸너리즘은 흔히 뜻이 통하지 않지만, 가장 재미있는 것은 뜻이 완전히 바뀌는 것이다.","뜻이 완전히 바뀌는 스푸너리즘은 말이 되지 않아서 재미가 없다."],"r":{"a":"3) 스푸너리즘은 흔히 뜻이 통하지 않지만, 가장 재미있는 것은 뜻이 완전히 바뀌는 것이다.","ev":"5번 문장","s":[[5,"Spoonerisms often result in nonsense, but the funniest are those that change the meaning altogether, such as saying “I’m a damp stealer” instead of “I’m a stamp dealer.”","스푸너리즘은 자주 뜻이 통하지 않는 말로 귀결되지만, 가장 재미있는 것은 ‘I’m a stamp dealer(나는 우표 거래상입니다)’대신에 ‘I’m a damp stealer(나는 축축한 도둑입니다)’라고 말하는 것처럼 뜻을 완전히 바꾸어 놓는 것이다."]],"w":"often result in nonsense는 ‘흔히 뜻이 통하지 않는 말이 된다’, the funniest are those that change the meaning altogether는 ‘가장 재미있는 것은 뜻을 완전히 바꾸는 것’이에요. 뜻이 바뀌는 것이 오히려 가장 재미있다고 해요.","c":3},"h":"8f82d494a5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["스푸너리즘은 단어 놀이를 좋아하지 않는 사람들만을 위한 것이다.","스푸너리즘은 주로 과학 수업에서 쓰인다.","스푸너리즘은 말장난과 단어 놀이를 좋아하는 사람들에게 재미있을 수 있다.","스푸너리즘은 누구에게도 전혀 재미있지 않다."],"opts":["Spoonerisms are only for people who do not like word games.","Spoonerisms are mostly used in science classes.","Spoonerisms can be fun for people who like puns and word games.","Spoonerisms are never funny to anyone."],"r":{"a":"3) Spoonerisms can be fun for people who like puns and word games. (스푸너리즘은 말장난과 단어 놀이를 좋아하는 사람들에게 재미있을 수 있다.)","ev":"1번 문장","s":[[1,"Those who enjoy puns and word games will also have fun with “spoonerisms.”","말장난과 단어 놀이를 즐기는 사람들은 ‘스푸너리즘’도 재미있어 할 것이다."]],"w":"1번 문장에서 말장난과 단어 놀이를 즐기는 사람들은 스푸너리즘도 재미있어 할 것이라고 했어요.","c":3},"h":"1daf96043b"},{"n":9,"t":"sum","q":"Some spoonerisms mix up the (A) sounds of words, so “light a fire” becomes “fight a (B).”","ko":"어떤 스푸너리즘은 단어의 (A) 소리를 뒤섞어서 ‘light a fire’가 ‘fight a (B)’가 된다.","oko":["A 모음 / B 불","A 모음 / B 거짓말쟁이","A 소리 없는 / B 친구","A 큰 / B 라이터","A 자음 / B 거짓말쟁이"],"opts":["(A) vowel / (B) fire","(A) vowel / (B) liar","(A) silent / (B) friend","(A) loud / (B) lighter","(A) consonant / (B) liar"],"r":{"a":"5) (A) consonant / (B) liar (A 자음 / B 거짓말쟁이)","ev":"3번 문장","s":[[3,"Some spoonerisms involve the confusion of consonant sounds, as in saying “fight a liar” rather than “light a fire.”","어떤 스푸너리즘은 ‘light a fire(불을 붙이다)’라고 하는 대신 ‘fight a liar(거짓말쟁이와 싸우다)’라고 말하는 것에서와 같은 자음들의 혼동을 포함한다."]],"w":"3번 문장에서 light a fire가 fight a liar가 되는 것은 자음(consonant) 소리가 섞인 예이고, 바뀐 말은 liar예요.","c":5},"h":"0fcddcb21d"},{"n":10,"t":"fill","q":"Spoonerisms are [A] after Rev. William A. Spooner, [B] of New College in Oxford around the turn of the 20th century.","ko":"스푸너리즘은 20세기로의 전환기 즈음에 옥스퍼드 뉴 칼리지의 [B]이었던 윌리엄 A. 스푸너 교수의 이름을 따서 [A].","bank":["named","tongue","warden","legend","vowel","mistakes"],"bko":{"named":"명명되었다(name의 과거분사)","tongue":"혀","warden":"학장","legend":"전설","vowel":"모음","mistakes":"실수"},"r":{"a":"[A] named (명명되었다(name의 과거분사)), [B] warden (학장)","ev":"6번 문장","s":[[6,"Spoonerisms are named after Rev. William A. Spooner, warden of New College in Oxford around the turn of the 20th century.","스푸너리즘은 20세기로의 전환기 즈음에 옥스퍼드 뉴 칼리지의 학장이었던 윌리엄 A. 스푸너 교수의 이름을 따서 명명되었다."]],"w":"6번 문장은 스푸너리즘이 옥스퍼드 뉴 칼리지의 학장(warden)이었던 스푸너의 이름을 따서 명명되었다(named)는 내용이에요.","c":null},"h":"b5f057627d"}]},{"u":1,"id":"ch3-01-3","no":3,"ko":"말하지 않아도 알아요?","items":[{"n":1,"t":"tf","q":"Emojis help people save time and effort by replacing words with simple reactions.","ko":"이모지는 단어를 간단한 반응으로 대신함으로써 사람들이 시간과 노력을 아끼게 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Today, emojis enable individuals to conserve time and effort by replacing words with simplified reactions and expressions.","오늘날 이모지는 단어를 단순화된 반응과 표현으로 대신함으로써 개인들이 시간과 노력을 아껴 쓸 수 있게 한다."]],"w":"7번 문장에서 이모지는 단어를 단순화된 반응과 표현으로 대신함으로써 시간과 노력을 아끼게 한다고 해요. 본문과 맞아요.","c":"T"},"h":"c100e32803"},{"n":2,"t":"tf","q":"Emojis have all the temporal and contextual nuances that languages have.","ko":"이모지는 언어가 가진 시간적·맥락적 뉘앙스를 모두 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Languages contain fundamental temporal and contextual nuances, which emojis lack.","언어는 근본적인 시간적, 맥락적 뉘앙스를 포함하고 있는데, 이모지는 이것이 부족하다."]],"w":"9번 문장에서 언어에는 근본적인 시간적·맥락적 뉘앙스가 있는데 이모지는 이것이 부족하다(lack)고 해요. ‘모두 가지고 있다’는 반대예요.","c":"F"},"h":"81269f354d"},{"n":3,"t":"tf","q":"The word “emoji” comes from Japanese words meaning “picture” and “written character.”","ko":"‘이모지’라는 말은 ‘그림’과 ‘문자’를 뜻하는 일본어에서 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The word “emoji” originated from Japanese, combining e(picture) and moji(written character).","단어 ‘이모지’는 일본어에서 유래됐으며, ‘이’(그림)와 ‘모지’(문자)를 결합한 것이다."]],"w":"5번 문장에서 emoji는 일본어에서 왔고 e(그림)와 moji(문자)를 합친 말이라고 해요. 본문과 맞아요.","c":"T"},"h":"6082a62757"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Today, emojis enable individuals to conserve time and effort…)","ko":"(오늘날 이모지는 개인이 시간과 노력을 …할 수 있게 한다)","opts":["낭비하다","아끼다","빌려주다","잃어버리다"],"word":"conserve","r":{"a":"2) 아끼다","ev":"7번 문장","s":[[7,"Today, emojis enable individuals to conserve time and effort by replacing words with simplified reactions and expressions.","오늘날 이모지는 단어를 단순화된 반응과 표현으로 대신함으로써 개인들이 시간과 노력을 아껴 쓸 수 있게 한다."]],"w":"이모지는 단어를 간단한 반응으로 대신해서 시간과 노력이 덜 들게 해요. conserve = 아끼다. 낭비하거나 잃는다면 장점이 되지 못해요.","c":2},"h":"0b2029ffc9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the growth of emojis—this novel mode of communication—persists.)","ko":"(…이 새로운 의사소통 방식인 이모지의 성장은 …된다)","opts":["사라진다","멈춘다","바뀐다","계속된다"],"word":"persists","r":{"a":"4) 계속된다","ev":"12번 문장","s":[[12,"Even with some traditional languages at risk of extinction, the growth of emojis —this novel mode of communication— persists.","심지어 몇몇의 전통적인 언어가 소멸의 위기에 있음에도, 이 의사소통의 새로운 방식인 이모지의 성장은 계속된다."]],"w":"12번은 일부 전통 언어가 소멸 위기에 있어도 이모지의 성장은 이어진다는 말이에요. persist = 계속되다. Even with(~에도 불구하고)가 앞의 위기와 대비돼요.","c":4},"h":"abc67899a2"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nWhen Japanese graphic designer Shigetaka Kurita introduced emojis to the world in the 1990s, few could have foreseen their widespread use in emails, websites, and social media.","ko":"밑줄 친 their가 가리키는 것은?","sko":"일본의 그래픽 디자이너 시게타카 쿠리타가 1990년대에 이모지를 세상에 선보였을 때, 사람들은 이메일, 웹사이트, 그리고 소셜 미디어에서 그것들의 광범위한 사용을 거의 예상할 수 없었다.","opts":["일본의 그래픽 디자이너","이메일과 웹사이트","이모지","1990년대의 사람들"],"r":{"a":"3) 이모지","ev":"6번 문장","s":[[6,"When Japanese graphic designer Shigetaka Kurita introduced emojis to the world in the 1990s, few could have foreseen their widespread use in emails, websites, and social media.","일본의 그래픽 디자이너 시게타카 쿠리타가 1990년대에 이모지를 세상에 선보였을 때, 사람들은 이메일, 웹사이트, 그리고 소셜 미디어에서 그것들의 광범위한 사용을 거의 예상할 수 없었다."]],"w":"few could have foreseen their widespread use에서 their는 ‘그것들의’라는 뜻이에요. 앞에서 디자이너가 세상에 소개한 것이 emojis이므로 their는 이모지를 가리켜요.","c":3,"k":"their = 이모지"},"pron":"their","h":"68e3c62e5b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Unfortunately for emojis, the answer remains decidedly negative about whether they qualify as a real language.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"유감스럽게도 이모지에 대해, 그것들이 실제 언어로서의 자격을 얻을지에 대한 답은 확실히 부정적이다.","opts":["이모지가 실제 언어의 자격을 갖추었는지에 대한 답은 분명히 ‘아니다’이다.","이모지는 이미 실제 언어로 인정받아 자리 잡았다.","이모지가 실제 언어가 될 수 있는지는 아직 아무도 의견을 내지 않았다.","이모지는 실제 언어가 되기 위해 모든 규칙을 갖추려 노력 중이다."],"r":{"a":"1) 이모지가 실제 언어의 자격을 갖추었는지에 대한 답은 분명히 ‘아니다’이다.","ev":"8번 문장","s":[[8,"Unfortunately for emojis, the answer remains decidedly negative about whether they qualify as a real language.","유감스럽게도 이모지에 대해, 그것들이 실제 언어로서의 자격을 얻을지에 대한 답은 확실히 부정적이다."]],"w":"Unfortunately for emojis는 이모지에게 아쉬운 소식이 나온다는 뜻이고, the answer remains decidedly negative는 ‘답이 분명히 부정적이다’예요. 즉 이모지는 실제 언어로 인정되지 않아요.","c":1},"h":"aa0d90ffb3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이모지는 2010년대에 세상에 처음 소개되었다.","어떤 아이들은 이모지만으로 소통하기도 한다.","학자들은 앞으로 100년 안에 언어가 소멸하지 않을 것이라고 본다.","‘이모지’라는 말은 한국어에서 유래했다."],"opts":["Emojis were first introduced to the world in the 2010s.","Some children communicate by using only emojis.","Scholars expect no languages to disappear in the coming century.","The word “emoji” came from Korean."],"r":{"a":"2) Some children communicate by using only emojis.","ev":"4번 문장","s":[[4,"For instance, children often ignore traditional grammatical rules in favor of more convenient forms of communication, expressing surprise via abbreviations like “OMG” or exclusively communicating with emojis.","예를 들어, 아이들은 종종 의사소통의 더 편리한 형태를 지지하며 전통적인 문법 규칙을 무시하는데, ‘OMG’와 같은 축약어를 통해 놀람을 표현하거나, 오로지 이모지만으로 소통한다."]],"w":"4번에서 아이들이 축약어를 쓰거나 오로지 이모지로만 소통한다(exclusively communicating with emojis)고 했어요. 이모지는 1990년대에 소개되었고(6번), 학자들은 90%의 언어가 소멸을 맞는다고 예측했고(2번), emoji는 일본어에서 왔어요(5번).","c":2},"h":"01d8fa60e4"},{"n":9,"t":"sum","q":"Although many traditional languages face (A), emojis are growing as a vital (B) of communication.","ko":"많은 전통 언어가 (A)에 직면하지만, 이모지는 의사소통의 중요한 (B)으로 성장하고 있다.","oko":["(A) 성장 / (B) 수단","(A) 소멸 / (B) 장벽","(A) 명성 / (B) 수단","(A) 변화 / (B) 규칙","(A) 소멸 / (B) 수단"],"opts":["(A) growth / (B) means","(A) extinction / (B) barrier","(A) fame / (B) means","(A) change / (B) rule","(A) extinction / (B) means"],"r":{"a":"5) (A) extinction / (B) means","ev":"10번, 12번 문장","s":[[10,"However, there is potential for emojis to evolve into a vital means of communication in the digital age.","하지만, 디지털 시대에서 의사소통의 중요한 수단으로 진화할 이모지에 대한 잠재력이 있다."],[12,"Even with some traditional languages at risk of extinction, the growth of emojis —this novel mode of communication— persists.","심지어 몇몇의 전통적인 언어가 소멸의 위기에 있음에도, 이 의사소통의 새로운 방식인 이모지의 성장은 계속된다."]],"w":"12번에서 일부 전통 언어가 소멸(extinction)의 위기에 있다고 하고, 10번에서 이모지가 의사소통의 중요한 수단(a vital means of communication)으로 진화할 잠재력이 있다고 해요. 소멸 위기인 언어에 ‘성장’이나 ‘명성’은 맞지 않고, 이모지를 ‘장벽’이라고 하지도 않아요.","c":5},"h":"113a906c2a"},{"n":10,"t":"fill","q":"At the same time, technological [A] are a significant contributing factor to the [B] of languages, particularly affecting younger generations.","ko":"동시에, 기술 [A]은(는) 언어의 [B]에 중요한 기여 요인이며, 특히 젊은 세대에게 영향을 미친다.","bank":["traditional","advancements","convenient","disappearance","ignore","widespread"],"bko":{"traditional":"전통적인","advancements":"발전","convenient":"편리한","disappearance":"소멸","ignore":"무시하다","widespread":"광범위한"},"r":{"a":"[A] advancements (발전), [B] disappearance (소멸)","ev":"3번 문장","s":[[3,"At the same time, technological advancements are a significant contributing factor to the disappearance of languages, particularly affecting younger generations.","동시에, 기술의 발전은 언어의 소멸에 중요한 기여 요인이며, 특히 젊은 세대에게 영향을 미친다."]],"w":"3번 문장은 기술의 발전(advancements)이 언어의 소멸(disappearance)에 중요한 기여 요인이라고 말해요.","c":null},"h":"28120205d5"}]},{"u":1,"id":"ch3-01-4","no":4,"ko":"수능:ON 주제 · 제목","items":[{"n":1,"t":"tf","q":"The first written documents recorded amounts of bread and payment of taxes.","ko":"최초로 쓰인 문서는 빵의 양과 세금의 납부를 기록했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The first written documents, which come from the Mesopotamian city of Uruk and date back to around 3400 BC, record amounts of bread, payment of taxes, and other transactions using simple symbols and marks on clay tablets.","메소포타미아 도시 우루크에서 나왔으며 기원전 3400년경으로 거슬러 올라가는 최초로 쓰인 문서는 빵의 양, 세금의 납부, 기타 거래들을 간단한 부호와 표시를 사용하여 점토판에 기록하고 있다."]],"w":"5번 문장에서 최초의 문서가 amounts of bread, payment of taxes, and other transactions를 기록했다고 해요. 본문과 맞아요.","c":"T"},"h":"40e6dd7fec"},{"n":2,"t":"tf","q":"Humans began to switch from a settled lifestyle to hunting and gathering in the Neolithic period.","ko":"인간은 신석기 시대에 정착 생활에서 수렵과 채집으로 전환하기 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"The earliest writing system has its roots in the Neolithic period, when humans first began to switch from hunting and gathering to a settled lifestyle based on agriculture.","최초의 쓰기 체계는 신석기 시대에 뿌리를 두고 있는데, 이때 인간이 처음으로 수렵과 채집에서 농업에 기반한 정착 생활로 전환하기 시작했다."]],"w":"2번 문장은 수렵과 채집에서 정착 생활로 바꾸기 시작했다고 해요. 방향이 반대예요(from hunting and gathering to a settled lifestyle).","c":"F"},"h":"856eae06ac"},{"n":3,"t":"tf","q":"The Fertile Crescent stretches from modern-day Egypt to the border between Iraq and Iran.","ko":"비옥한 초승달 지대는 현대의 이집트에서부터 이라크와 이란 사이의 국경 지역까지 펼쳐져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This shift began around 9500 BC in a region known as the Fertile Crescent, which stretches from modern-day Egypt, up to southeastern Türkiye, and down again to the border between Iraq and Iran.","이러한 변화는 기원전 9500년경에 비옥한 초승달 지대라고 알려진 지역에서 시작되었는데, 이곳은 현대의 이집트에서부터 위로는 터키 남동부까지, 아래로는 이라크와 이란 사이의 국경 지역까지 펼쳐져 있다."]],"w":"3번 문장에서 비옥한 초승달 지대는 현대의 이집트에서 터키 남동부를 거쳐 이라크와 이란 사이의 국경 지역까지 펼쳐져 있다고 해요. 본문과 맞아요.","c":"T"},"h":"484ca2b2e3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The development of writing was pioneered not by gossips… but by accountants.)","ko":"(쓰기의 발달은 수다쟁이… 가 아니라 회계사에 의해 …되었다)","opts":["방해했다","모방했다","개척했다","보관했다"],"word":"pioneered","r":{"a":"3) 개척했다","ev":"1번 문장","s":[[1,"The development of writing was pioneered not by gossips, storytellers, or poets, but by accountants.","쓰기의 발달은 수다쟁이, 이야기꾼, 시인에 의해서가 아니라 회계사에 의해 개척되었다."]],"w":"쓰기의 발달을 처음으로 앞서 이끈 사람이 회계사라는 뜻이에요. pioneer = 개척하다(was pioneered = 개척되었다). not A but B 구조라서 ‘방해’나 ‘모방’은 맞지 않아요.","c":3},"h":"59afa1786f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…to account for transactions involving agricultural goods…)","ko":"(…농산물을 포함하는 …을 설명하기 위해…)","opts":["거래","세금","지역","도구"],"word":"transactions","r":{"a":"1) 거래","ev":"4번 문장","s":[[4,"Writing seems to have evolved in this region from the custom of using small clay pieces to account for transactions involving agricultural goods such as grain, sheep, and cattle.","쓰기는 이 지역에서 곡물, 양, 소와 같은 농산물을 포함하는 거래를 설명하기 위해 작은 점토 조각을 사용하는 관습에서 발전한 것처럼 보인다."]],"w":"4번은 곡물, 양, 소 같은 농산물을 사고파는 일을 점토 조각으로 기록했다는 뜻이에요. transaction = 거래. 세금은 5번에 따로 나오는 말이에요.","c":1},"h":"6c99ab3107"},{"n":6,"t":"ref","q":"What does the underlined \"this region\" refer to?\nWriting seems to have evolved in this region from the custom of using small clay pieces to account for transactions involving agricultural goods such as grain, sheep, and cattle.","ko":"밑줄 친 this region이 가리키는 것은?","sko":"쓰기는 이 지역에서 곡물, 양, 소와 같은 농산물을 포함하는 거래를 설명하기 위해 작은 점토 조각을 사용하는 관습에서 발전한 것처럼 보인다.","opts":["유럽 본토","비옥한 초승달 지대","이집트의 한 도시","수렵과 채집을 하던 지역"],"r":{"a":"2) 비옥한 초승달 지대","ev":"3~4번 문장","s":[[3,"This shift began around 9500 BC in a region known as the Fertile Crescent, which stretches from modern-day Egypt, up to southeastern Türkiye, and down again to the border between Iraq and Iran.","이러한 변화는 기원전 9500년경에 비옥한 초승달 지대라고 알려진 지역에서 시작되었는데, 이곳은 현대의 이집트에서부터 위로는 터키 남동부까지, 아래로는 이라크와 이란 사이의 국경 지역까지 펼쳐져 있다."],[4,"Writing seems to have evolved in this region from the custom of using small clay pieces to account for transactions involving agricultural goods such as grain, sheep, and cattle.","쓰기는 이 지역에서 곡물, 양, 소와 같은 농산물을 포함하는 거래를 설명하기 위해 작은 점토 조각을 사용하는 관습에서 발전한 것처럼 보인다."]],"w":"this region은 바로 앞 3번 문장에서 말한 ‘비옥한 초승달 지대’라는 지역이에요. 쓰기가 그 지역에서 발전했다는 뜻이에요.","c":2,"k":"this region = 비옥한 초승달 지대"},"pron":"this region","h":"74dccfbca0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The development of writing was pioneered not by gossips, storytellers, or poets, but by accountants.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"쓰기의 발달은 수다쟁이, 이야기꾼, 시인에 의해서가 아니라 회계사에 의해 개척되었다.","opts":["쓰기는 이야기꾼과 시인이 아니라 회계사가 처음 발전시켰다.","쓰기는 이야기꾼과 시인 덕분에 발달했고 회계사는 도움을 주지 못했다.","회계사는 시인이 쓴 이야기를 정리하는 일을 했다.","쓰기의 발달에는 수다쟁이, 이야기꾼, 시인, 회계사가 모두 똑같이 기여했다."],"r":{"a":"1) 쓰기는 이야기꾼과 시인이 아니라 회계사가 처음 발전시켰다.","ev":"1번 문장","s":[[1,"The development of writing was pioneered not by gossips, storytellers, or poets, but by accountants.","쓰기의 발달은 수다쟁이, 이야기꾼, 시인에 의해서가 아니라 회계사에 의해 개척되었다."]],"w":"not A but B는 ‘A가 아니라 B’예요. 수다쟁이·이야기꾼·시인이 아니라 회계사가 쓰기의 발달을 개척했다는 뜻이에요.","c":1},"h":"69e82e3382"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["최초로 쓰인 문서는 기원전 9500년경으로 거슬러 올라간다.","인간은 기원전 3400년경에 농사를 짓기 시작했다.","농업에 기반한 정착 생활로의 변화는 기원전 9500년경에 시작되었다.","쓰기는 인간이 농사를 짓기 훨씬 전에 시작되었다."],"opts":["The first written documents date back to around 9500 BC.","Humans began to farm around 3400 BC.","The change to a settled lifestyle based on agriculture began around 9500 BC.","Writing began long before humans started farming."],"r":{"a":"3) The change to a settled lifestyle based on agriculture began around 9500 BC. (농업에 기반한 정착 생활로의 변화는 기원전 9500년경에 시작되었다.)","ev":"2~3번 문장","s":[[2,"The earliest writing system has its roots in the Neolithic period, when humans first began to switch from hunting and gathering to a settled lifestyle based on agriculture.","최초의 쓰기 체계는 신석기 시대에 뿌리를 두고 있는데, 이때 인간이 처음으로 수렵과 채집에서 농업에 기반한 정착 생활로 전환하기 시작했다."],[3,"This shift began around 9500 BC in a region known as the Fertile Crescent, which stretches from modern-day Egypt, up to southeastern Türkiye, and down again to the border between Iraq and Iran.","이러한 변화는 기원전 9500년경에 비옥한 초승달 지대라고 알려진 지역에서 시작되었는데, 이곳은 현대의 이집트에서부터 위로는 터키 남동부까지, 아래로는 이라크와 이란 사이의 국경 지역까지 펼쳐져 있다."]],"w":"3번 문장에서 이 변화(농업에 기반한 정착 생활로의 전환)는 기원전 9500년경에 시작되었다고 했어요. 문서의 연대는 기원전 3400년경이에요.","c":3},"h":"64875bf8b9"},{"n":9,"t":"sum","q":"The first written documents used simple (A) and marks on clay (B) to keep records of trade.","ko":"최초로 쓰인 문서는 거래를 기록하기 위해 점토 (B)에 간단한 (A)와(과) 표시를 사용했다.","oko":["A 노래 / B 벽","A 단어 / B 종이","A 이야기 / B 돌","A 숫자 / B 책","A 부호 / B 점토판"],"opts":["(A) songs / (B) walls","(A) words / (B) paper","(A) stories / (B) stones","(A) numbers / (B) books","(A) symbols / (B) tablets"],"r":{"a":"5) (A) symbols / (B) tablets (A 부호 / B 점토판)","ev":"5번 문장","s":[[5,"The first written documents, which come from the Mesopotamian city of Uruk and date back to around 3400 BC, record amounts of bread, payment of taxes, and other transactions using simple symbols and marks on clay tablets.","메소포타미아 도시 우루크에서 나왔으며 기원전 3400년경으로 거슬러 올라가는 최초로 쓰인 문서는 빵의 양, 세금의 납부, 기타 거래들을 간단한 부호와 표시를 사용하여 점토판에 기록하고 있다."]],"w":"5번 문장은 간단한 부호(symbols)와 표시를 점토판(clay tablets)에 사용해 기록했다고 해요.","c":5},"h":"f8e4e05fb9"},{"n":10,"t":"fill","q":"This shift began around 9500 BC in a region [A] as the Fertile Crescent, which stretches from modern-day Egypt, up to [B] Türkiye, and down again to the border between Iraq and Iran.","ko":"이러한 변화는 기원전 9500년경에 비옥한 초승달 지대라고 [A] 지역에서 시작되었는데, 이곳은 현대의 이집트에서부터 위로는 [B] 터키까지, 아래로는 이라크와 이란 사이의 국경 지역까지 펼쳐져 있다.","bank":["known","clay","southeastern","grain","bread","goods"],"bko":{"known":"알려진","clay":"점토","southeastern":"남동부의","grain":"곡물","bread":"빵","goods":"물품"},"r":{"a":"[A] known (알려진), [B] southeastern (남동부의)","ev":"3번 문장","s":[[3,"This shift began around 9500 BC in a region known as the Fertile Crescent, which stretches from modern-day Egypt, up to southeastern Türkiye, and down again to the border between Iraq and Iran.","이러한 변화는 기원전 9500년경에 비옥한 초승달 지대라고 알려진 지역에서 시작되었는데, 이곳은 현대의 이집트에서부터 위로는 터키 남동부까지, 아래로는 이라크와 이란 사이의 국경 지역까지 펼쳐져 있다."]],"w":"3번 문장은 비옥한 초승달 지대라고 알려진(known) 지역이 위로는 남동부(southeastern) 터키까지 펼쳐져 있다고 설명해요.","c":null},"h":"eabf8ed634"}]},{"u":2,"id":"ch3-02-1","no":1,"ko":"세 번째 선택사항의 비밀","items":[{"n":1,"t":"tf","q":"The second restaurant that your friend suggests has received excellent reviews.","ko":"친구가 제안한 두 번째 레스토랑은 훌륭한 평가를 받았다.","r":{"ev":"3번 문장","s":[[3,"Alternatively, your friend suggests another restaurant that has only received average reviews, but it’s located directly across the street.","그 대신에, 당신의 친구는 평균적인 평가만 받은 다른 레스토랑을 제안하는데, 그곳은 바로 길 건너편에 위치해 있다."]],"w":"3번 문장에서 두 번째 레스토랑은 only received average reviews, 즉 평균적인 평가만 받았어요. ‘훌륭한(excellent)’ 평가가 아니에요. 음식이 뛰어나다(outstanding)는 말은 5번의 세 번째 식당 이야기예요.","c":"F","a":"F (본문과 다른 내용)"},"h":"0580adeac8"},{"n":2,"t":"tf","q":"A decoy product is introduced only to make one of the two original choices look better in comparison.","ko":"미끼 상품은 오직 원래 두 선택 중 하나가 비교했을 때 더 좋아 보이게 하려고 소개된다.","r":{"ev":"9번 문장","s":[[9,"The desired outcome is solely to make one of the two original choices look better in comparison.","원하는 결과는 단지 원래의 두 선택사항 중 하나가 비교했을 때 더 좋아 보이게 만드는 것이다."]],"w":"9번에서 원하는 결과는 단지(solely) 두 원래 선택 중 하나가 비교했을 때 더 좋아 보이게 만드는 것이라고 해요. 본문과 맞아요.","c":"T","a":"T (본문과 맞는 내용)"},"h":"30668e9ebc"},{"n":3,"t":"tf","q":"Marketers introduce a third product that consumers are eager to buy.","ko":"마케팅 담당자들은 소비자들이 사고 싶어 안달하는 세 번째 상품을 소개한다.","r":{"ev":"8번 문장","s":[[8,"It describes a phenomenon when marketers occasionally introduce an undesirable third product to consumers who are faced with a decision between two products.","이는 마케팅 담당자들이 때때로 두 가지 상품 중에서 골라야 하는 결정에 직면한 소비자들에게 달갑지 않은 세 번째 상품을 소개할 때의 현상을 소개한다."]],"w":"8번의 세 번째 상품은 undesirable, 즉 달갑지 않은 상품이에요. 소비자가 사고 싶어 하는 상품이 아니라서 본문과 달라요.","c":"F","a":"F (본문과 다른 내용)"},"h":"2459bce0d8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…and you’re already substantially hungry.)","ko":"(…당신은 이미 [ ] 배가 고픈 상태이다.)","opts":["약간, 조금","상당히, 꽤","갑자기","결코 ~않게"],"word":"substantially","r":{"ev":"2번 문장","s":[[2,"Unfortunately, it would take 15 minutes to walk there, and you’re already substantially hungry.","안타깝게도, 그곳으로 걸어가는 데 15분이 걸리고, 당신은 이미 상당히 배가 고픈 상태이다."]],"w":"2번은 15분을 걸어가야 하는데 이미 꽤 많이 배가 고프다는 말이라서 substantially = 상당히, 꽤예요.","c":2,"a":"2) 상당히, 꽤"},"h":"01ed3a8f26"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…but the travel entails a 20-minute subway ride.)","ko":"(…하지만 그 여정은 20분 동안 지하철을 타는 것을 [ ].)","opts":["줄이다","피하다","허락하다","수반하다, 필요로 하다"],"word":"entails","r":{"ev":"5번 문장","s":[[5,"Suddenly, your friend mentions a third establishment that has outstanding food, but the travel entails a 20-minute subway ride.","갑자기, 당신의 친구는 뛰어난 음식이 있는 세 번째 레스토랑을 언급하는데, 그 여정은 20분 동안 지하철을 타는 것을 수반한다."]],"w":"5번은 세 번째 식당에 가려면 지하철 20분이 따라온다(필요하다)는 말이에요. entail = 수반하다, 필요로 하다.","c":4,"a":"4) 수반하다, 필요로 하다"},"h":"b75e6a81b1"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nFor example, if a product’s primary flaw is its steep price, the company might release an additional “decoy” product with an even higher price point.","ko":"밑줄 친 its가 가리키는 것은?","opts":["회사","소비자","미끼 상품","원래 상품"],"sko":"예를 들어 상품의 주요 결함이 너무 비싼 가격이라면 회사는 훨씬 더 높은 가격대로 추가적인 ‘미끼’ 상품을 출시할 수 있다.","r":{"ev":"10번 문장","s":[[10,"For example, if a product’s primary flaw is its steep price, the company might release an additional “decoy” product with an even higher price point.","예를 들어 상품의 주요 결함이 너무 비싼 가격이라면 회사는 훨씬 더 높은 가격대로 추가적인 ‘미끼’ 상품을 출시할 것이다."]],"w":"a product’s primary flaw is its steep price에서 its는 앞의 a product를 가리켜요. ‘그 상품의 비싼 가격’이라는 뜻이에요.","c":4,"a":"4) 원래 상품","k":"its = a product (원래 상품)"},"pron":"its","h":"7af82dc0aa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"After hearing this, the decision becomes clear: the 15-minute walk to the first restaurant is fairly reasonable after all.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["세 번째 식당 이야기를 듣고 나서, 지하철을 타고 가는 것이 가장 좋다는 결정이 분명해진다.","세 번째 식당 이야기를 듣고 나서, 15분 걷는 것이 너무 힘들어 두 번째 식당으로 정하게 된다.","세 번째 식당 이야기를 듣고 나서, 첫 번째 식당까지 15분 걷는 것이 결국 꽤 합리적이라는 결정이 분명해진다.","세 번째 식당 이야기를 듣고 나서, 어느 식당으로 갈지 더 헷갈려진다."],"sko":"이것을 듣고 나면, 첫 번째 레스토랑까지 15분 동안 걷는 것이 결국 꽤 합리적이라는 결정이 분명해진다.","r":{"ev":"6번 문장","s":[[6,"After hearing this, the decision becomes clear: the 15-minute walk to the first restaurant is fairly reasonable after all.","이것을 듣고 나면, 첫 번째 레스토랑까지 15분 동안 걷는 것이 결국 꽤 합리적이라는 결정이 분명해진다."]],"w":"6번은 세 번째 식당 이야기를 들은 뒤에, 첫 번째 식당까지 15분 걷는 것이 결국 꽤 합리적이라는 결정이 분명해졌다는 뜻이에요. 지하철을 택한다거나 두 번째 식당으로 정한다는 말은 없어요.","c":3,"a":"3) 세 번째 식당 이야기를 듣고 나서, 첫 번째 식당까지 15분 걷는 것이 결국 꽤 합리적이라는 결정이 분명해진다."},"h":"3789b597c0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Both the first and second restaurants are clearly worse than the third one in every way.","You find it hard to choose between the first two restaurants because each has good and bad points.","The second restaurant requires a 20-minute subway ride.","The first restaurant is closer than the second restaurant."],"oko":["첫 번째와 두 번째 식당은 모든 면에서 세 번째 식당보다 분명히 못하다.","각각 좋은 점과 나쁜 점이 있어서 처음 두 식당 중에서 고르기 어렵다.","두 번째 식당에 가려면 지하철을 20분 타야 한다.","첫 번째 식당이 두 번째 식당보다 더 가깝다."],"r":{"ev":"2~5번 문장","s":[[2,"Unfortunately, it would take 15 minutes to walk there, and you’re already substantially hungry.","안타깝게도, 그곳으로 걸어가는 데 15분이 걸리고, 당신은 이미 상당히 배가 고픈 상태이다."],[3,"Alternatively, your friend suggests another restaurant that has only received average reviews, but it’s located directly across the street.","그 대신에, 당신의 친구는 평균적인 평가만 받은 다른 레스토랑을 제안하는데, 그곳은 바로 길 건너편에 위치해 있다."],[4,"You encounter a dilemma deciding between the options because both have unique positives and negatives.","당신은 둘 다 긍정적인 면과 부정적인 면이 있기 때문에 선택사항들 중에서 결정하는 딜레마에 맞닥뜨리게 된다."],[5,"Suddenly, your friend mentions a third establishment that has outstanding food, but the travel entails a 20-minute subway ride.","갑자기, 당신의 친구는 뛰어난 음식이 있는 세 번째 레스토랑을 언급하는데, 그 여정은 20분 동안 지하철을 타는 것을 수반한다."]],"w":"4번에서 두 식당 모두 좋은 점과 나쁜 점이 있어서 고르기 어려운 딜레마라고 해요. 첫 번째 식당이 더 가까운 것이 아니라 두 번째 식당이 길 건너라 더 가깝고(2·3번), 지하철 20분은 세 번째 식당이에요(5번).","c":2,"a":"2) You find it hard to choose between the first two restaurants because each has good and bad points."},"h":"b9783a96be"},{"n":9,"t":"sum","q":"A decoy product can give consumers the (A) that the original product is a fair (B).","ko":"미끼 상품은 소비자에게 원래의 상품이 공정한 (B)이라는 (A)을(를) 줄 수 있다.","opts":["(A) idea / (B) secret","(A) hope / (B) wall","(A) illusion / (B) deal","(A) fear / (B) rule","(A) news / (B) map"],"oko":["A 생각 / B 비밀","A 희망 / B 벽","A 착각 / B 거래","A 두려움 / B 규칙","A 소식 / B 지도"],"r":{"ev":"11번 문장","s":[[11,"This gives consumers the illusion that the original product is a fair deal.","이는 소비자에게 원래의 상품이 공정한 거래라는 착각을 준다."]],"w":"11번 문장은 미끼 상품이 소비자에게 원래 상품이 공정한 거래(deal)라는 착각(illusion)을 준다고 말해요.","c":3,"a":"3) (A) illusion / (B) deal (A 착각 / B 거래)"},"h":"d0dd79dc7c"},{"n":10,"t":"fill","q":"Imagine you’re making dinner plans with a friend, and you’re [A] visiting a restaurant you know that serves [B] food.","ko":"당신이 친구와 함께 저녁 식사 계획을 세우고 있고, 당신이 알고 있는 [B] 음식을 제공하는 한 레스토랑을 방문하는 것을 [A] 있다고 상상해 봐라.","bank":["considering","delicious","walk","across","subway","price"],"bko":{"considering":"고려하고","delicious":"맛있는","walk":"걷다","across":"건너편에","subway":"지하철","price":"가격"},"r":{"ev":"1번 문장","s":[[1,"Imagine you’re making dinner plans with a friend, and you’re considering visiting a restaurant you know that serves delicious food.","당신이 친구와 함께 저녁 식사 계획을 세우고 있고, 당신이 알고 있는 맛있는 음식을 제공하는 한 레스토랑을 방문하는 것을 고려하고 있다고 상상해 봐라."]],"w":"1번 문장은 맛있는(delicious) 음식을 파는 식당에 가는 것을 고려하고(considering) 있다고 상상해 보라는 내용이에요.","c":null,"a":"[A] considering (고려하고), [B] delicious (맛있는)"},"h":"92b00e129d"}]},{"u":2,"id":"ch3-02-2","no":2,"ko":"암호화폐, 자유인가","items":[{"n":1,"t":"tf","q":"A blockchain is a single huge block that stores all the information.","ko":"블록체인은 모든 정보를 저장하는 하나의 거대한 블록이다.","r":{"ev":"3번 문장","s":[[3,"A blockchain consists of a series of interconnected data blocks, each containing specific information.","블록체인은 각각 특정 정보를 포함하는 일련의 상호 연결된 데이터 블록으로 구성된다."]],"w":"3번에서 블록체인은 일련의 상호 연결된 데이터 블록(a series of interconnected data blocks)으로 이루어지고, 각 블록이 특정 정보를 담아요. 하나의 거대한 블록이 아니에요.","c":"F","a":"F (본문과 다른 내용)"},"h":"25ea99e4dd"},{"n":2,"t":"tf","q":"Many people find the system attractive because it gives them greater control over their assets.","ko":"많은 사람들은 그 시스템이 자신의 자산에 대한 더 큰 통제권을 주기 때문에 매력적이라고 여긴다.","r":{"ev":"8번 문장","s":[[8,"Many people find this aspect attractive as it gives them greater control over their assets and reduces dependency on traditional banks and government oversight.","많은 사람들이 이러한 측면을 매력적이라고 여기는데, 이는 그들의 자산에 대한 더 큰 통제권을 부여하고, 전통적인 은행 및 정부 감독에 대한 의존도를 줄이기 때문이다."]],"w":"8번에서 많은 사람들이 이 측면을 매력적이라고 여기는 이유가 자산에 대한 더 큰 통제권을 주기 때문이라고 해요. 본문과 맞아요.","c":"T","a":"T (본문과 맞는 내용)"},"h":"10dfd43bb2"},{"n":3,"t":"tf","q":"A cryptocurrency can never lose all of its value.","ko":"암호화폐는 가치를 전부 잃는 일이 결코 없다.","r":{"ev":"12번 문장","s":[[12,"In some cases, a cryptocurrency’s value could even collapse entirely, turning the currency into worthless digital money.","경우에 따라 암호화폐의 가치가 완전히 붕괴되어, 가치 없는 디지털 화폐로 전락할 수도 있다."]],"w":"12번에서 경우에 따라 암호화폐의 가치가 완전히 붕괴해 가치 없는 디지털 화폐가 될 수도 있다고 해요. ‘결코 없다’는 본문과 반대예요.","c":"F","a":"F (본문과 다른 내용)"},"h":"f558cc3e5a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…which enhances the overall security of the blockchain each time a new block is added.)","ko":"(…새 블록이 추가될 때마다 블록체인의 전반적인 보안을 [ ].)","opts":["높이다, 강화하다","줄이다","숨기다","빌려주다"],"word":"enhances","r":{"ev":"4번 문장","s":[[4,"New blocks can only be attached to the end of the chain, which enhances the overall security of the blockchain each time a new block is added.","새 블록은 체인의 끝에만 부착할 수 있으므로, 새 블록이 추가될 때마다 블록체인의 전반적인 보안이 강화된다."]],"w":"4번은 새 블록이 추가될 때마다 보안이 더 좋아진다는 말이에요. enhance = 높이다, 강화하다. 반대로 줄이다(reduce)가 아니에요.","c":1,"a":"1) 높이다, 강화하다"},"h":"18b4813a27"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…blockchain technology eliminates the need for intermediaries like banks…)","ko":"(…블록체인 기술은 은행과 같은 중개자에 대한 필요성을 [ ]…)","opts":["더하다","확인하다","없애다, 제거하다","붙이다"],"word":"eliminates","r":{"ev":"6번 문장","s":[[6,"Moreover, blockchain technology eliminates the need for intermediaries like banks, enabling individuals to complete transactions with one another directly.","게다가, 블록체인 기술은 은행과 같은 중개자에 대한 필요성을 없애서 개인이 서로 직접 거래를 완료할 수 있게 한다."]],"w":"6번은 블록체인이 은행 같은 중개자의 필요를 없앤다는 말이에요. eliminate = 없애다, 제거하다.","c":3,"a":"3) 없애다, 제거하다"},"h":"ca0f4293cb"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThese digital assets are powered by blockchain technology, which maintains a secure and safeguarded record of transactions while tracking ownership.","ko":"밑줄 친 which가 가리키는 것은?","opts":["디지털 자산","블록체인 기술","거래 기록","소유권"],"sko":"이러한 디지털 자산은 소유권을 추적하면서 안전하고 보호된 거래 기록을 유지하는 블록체인 기술로 구동된다.","r":{"ev":"2번 문장","s":[[2,"These digital assets are powered by blockchain technology, which maintains a secure and safeguarded record of transactions while tracking ownership.","이러한 디지털 자산은 소유권을 추적하면서 안전하고 보호된 거래 기록을 유지하는 블록체인 기술로 구동된다."]],"w":"which 앞에 있는 blockchain technology를 보충 설명하는 말이에요. ‘거래 기록을 안전하게 유지하는 것’은 디지털 자산이 아니라 블록체인 기술이에요.","c":2,"a":"2) 블록체인 기술","k":"which = blockchain technology (블록체인 기술)"},"pron":"which","h":"d69d2268e5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Any attempt to modify data within existing blocks would invalidate the entire chain, making it highly resistant to alterations.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["기존 블록의 데이터를 바꾸면 그 블록 하나만 지워지므로 블록체인은 쉽게 고칠 수 있다.","기존 블록을 수정하는 일은 허락된 사람에게는 언제나 쉽다.","체인이 무효가 되면 새 블록들이 자동으로 추가된다.","기존 블록의 데이터를 바꾸려는 시도는 체인 전체를 무효로 만들기 때문에, 블록체인은 변경에 매우 강하다."],"sko":"기존 블록 내 데이터를 수정하려는 시도는 전체 체인을 무효화시키므로, 변경에 대한 저항성이 크다.","r":{"ev":"5번 문장","s":[[5,"Any attempt to modify data within existing blocks would invalidate the entire chain, making it highly resistant to alterations.","기존 블록 내 데이터를 수정하려는 시도는 전체 체인을 무효화시키므로, 변경에 대한 저항성이 크다."]],"w":"5번은 기존 블록의 데이터를 바꾸려 하면 체인 전체가 무효가 되기 때문에 블록체인이 변경에 매우 강하다는 뜻이에요. 쉽게 고칠 수 있다는 말은 반대예요.","c":4,"a":"4) 기존 블록의 데이터를 바꾸려는 시도는 체인 전체를 무효로 만들기 때문에, 블록체인은 변경에 매우 강하다."},"h":"83cd860533"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Only banks are allowed to check the transaction records.","All participants share and check the transaction records.","The transaction records are kept secret from other participants.","Only one person decides which transactions are valid."],"oko":["은행만 거래 기록을 확인할 수 있다.","모든 참가자가 거래 기록을 공유하고 확인한다.","거래 기록은 다른 참가자들에게 비밀로 유지된다.","한 사람만이 어떤 거래가 유효한지 정한다."],"r":{"ev":"7번 문장","s":[[7,"Since all participants share and verify transaction records, the system remains transparent and secure.","모든 참가자가 거래 기록을 공유하고 확인하기 때문에 시스템은 투명하고 안전하게 유지된다."]],"w":"7번에서 모든 참가자가 거래 기록을 공유하고 확인하기(share and verify) 때문에 시스템이 투명하고 안전하게 유지된다고 해요. 은행만 확인한다거나 비밀로 한다는 말은 없어요.","c":2,"a":"2) All participants share and check the transaction records."},"h":"f374245df8"},{"n":9,"t":"sum","q":"Because the price of cryptocurrency is unstable, investors can get either big (A) or severe financial (B).","ko":"암호화폐의 가격은 불안정하기 때문에, 투자자는 큰 (A)이나 심각한 재정적 (B)을(를) 얻을 수 있다.","opts":["(A) rules / (B) taxes","(A) friends / (B) debts","(A) banks / (B) risks","(A) profits / (B) losses","(A) bills / (B) holidays"],"oko":["A 규칙 / B 세금","A 친구 / B 빚","A 은행 / B 위험","A 수익 / B 손실","A 청구서 / B 휴일"],"r":{"ev":"11번 문장","s":[[11,"This can lead to extreme price instability, resulting in either substantial profits or severe financial losses for investors.","이는 극심한 가격 불안정을 초래하며, 투자자에게 상당한 수익이나 심각한 재정적 손실을 안겨줄 수 있다."]],"w":"11번 문장은 가격이 크게 흔들려서 투자자가 상당한 수익(profits)이나 심각한 손실(losses)을 볼 수 있다고 말해요.","c":4,"a":"4) (A) profits / (B) losses (A 수익 / B 손실)"},"h":"4e41d76602"},{"n":10,"t":"fill","q":"Unlike government-[A] currencies, their value is entirely dependent on supply and [B].","ko":"정부가 [A] 통화와 달리, 그것들의 가치는 전적으로 공급과 [B]에 달려 있다.","bank":["demand","chain","issued","tracking","secure","attached"],"bko":{"demand":"수요","chain":"체인","issued":"발행한","tracking":"추적하는","secure":"안전한","attached":"부착된"},"r":{"ev":"10번 문장","s":[[10,"Unlike government-issued currencies, their value is entirely dependent on supply and demand.","정부가 발행한 통화와 달리, 암호화폐의 가치는 전적으로 수요와 공급에 달려 있다."]],"w":"10번 문장은 정부가 발행한(issued) 통화와 달리 암호화폐의 가치가 공급과 수요(demand)에 달려 있다는 뜻이에요.","c":null,"a":"[A] issued (발행한), [B] demand (수요)"},"h":"7ce0d6e0a0"}]},{"u":2,"id":"ch3-02-3","no":3,"ko":"내 것인 듯, 내 것 아닌","items":[{"n":1,"t":"tf","q":"In recent years, more people have chosen to subscribe rather than to buy products.","ko":"최근 몇 년 동안, 더 많은 사람들이 상품을 사는 대신에 구독하기를 선택해 왔다.","r":{"ev":"2번 문장","s":[[2,"However, this traditional approach to consumption has faced challenges in recent years as more people have chosen to subscribe rather than make purchases.","그러나, 소비에 대한 이 전통적인 접근은 최근 몇 년 동안 더 많은 사람들이 구매를 하는 대신에 구독하기를 선택하면서 도전에 직면해 왔다."]],"w":"2번에서 최근 몇 년 동안 더 많은 사람들이 구매하는 대신 구독하기를 선택했다고 해요. 본문과 맞아요.","c":"T","a":"T (본문과 맞는 내용)"},"h":"af8c7b819e"},{"n":2,"t":"tf","q":"According to the passage, the subscription economy has already reached a market size of $1.5 trillion.","ko":"글에 따르면, 구독 경제는 이미 1.5조 달러의 시장 규모에 도달했다.","r":{"ev":"5번 문장","s":[[5,"The subscription economy has expanded significantly, experiencing substantial growth over the past decade, and is on track to achieve a market size of more than $1.5 trillion within the next few years.","구독 경제는 크게 확장되어 왔는데, 지난 10년 동안 상당한 성장을 경험했고, 향후 몇 년 내에 1.5조 달러 이상의 시장 규모를 달성하기 위해 나아가는 중이다."]],"w":"5번에서 구독 경제는 향후 몇 년 내에 1.5조 달러 이상의 시장 규모를 달성하기 위해 나아가는 중(on track to achieve)이라고 해요. ‘이미 도달했다’는 본문과 달라요.","c":"F","a":"F (본문과 다른 내용)"},"h":"3339db5602"},{"n":3,"t":"tf","q":"Subscribing is usually more expensive overall than buying products one by one.","ko":"구독하는 것은 보통 상품을 하나씩 사는 것보다 전체적으로 더 비싸다.","r":{"ev":"8번 문장","s":[[8,"Consumers gain affordable access to a variety of products or services, often at a lower overall cost compared to purchasing them individually.","소비자들은 종종 개별적으로 구매하는 것과 비교해서 더 낮은 전체 비용으로, 다양한 상품이나 서비스에 대한 알맞은 가격으로 접근할 수 있다."]],"w":"8번에서 소비자는 개별적으로 구매하는 것과 비교해 종종 더 낮은 전체 비용으로 이용한다고 해요. ‘더 비싸다’는 반대예요.","c":"F","a":"F (본문과 다른 내용)"},"h":"51bc07f134"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…moving to subscription-based business models to capitalize on this trend.)","ko":"(…이 추세를 [ ] 위해 구독 기반 사업 모델로 옮겨가고 있다.)","opts":["활용하다, 이용하다","무시하다","비판하다","막다"],"word":"capitalize","r":{"ev":"6번 문장","s":[[6,"As a result, an increasing number of companies are moving to subscription-based business models to capitalize on this trend.","그 결과, 점점 더 많은 기업들이 이 추세를 활용하기 위해서 구독 기반 사업 모델로 옮겨가고 있다."]],"w":"6번은 구독 경제가 커지는 추세를 이용하려고 기업들이 구독 기반 모델로 옮겨간다는 말이에요. capitalize on = 활용하다, 이용하다.","c":1,"a":"1) 활용하다, 이용하다"},"h":"72cf2e3662"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the growth of the subscription economy is advantageous for both parties…)","ko":"(…구독 경제의 성장은 양측 모두에게 [ ].)","opts":["불리한","이로운","위험한","불필요한"],"word":"advantageous","r":{"ev":"10번 문장","s":[[10,"Ultimately, the growth of the subscription economy is advantageous for both parties, making it a dominant force in modern commerce.","궁극적으로, 구독 경제의 성장은 현대 상거래에서 그것을 지배적인 힘으로 만들면서, 양측 모두에게 이롭다."]],"w":"10번은 구독 경제의 성장이 소비자와 기업 양쪽에 도움이 된다는 결론이에요. advantageous = 이로운.","c":2,"a":"2) 이로운"},"h":"dcb73d0036"},{"n":6,"t":"ref","q":"What does the underlined \"This transition\" refer to?\nThis transition has accelerated the growth of what is now known as the subscription economy.","ko":"밑줄 친 This transition이 가리키는 것은?","opts":["물건을 사서 소유하는 방식에서 구독하는 방식으로 바뀌는 것","영화의 실물 사본을 파는 것","음악 앨범의 가격이 오르는 것","기업들이 사업 모델을 없애는 것"],"sko":"이 이행은 현재 구독 경제라고 알려진 것의 성장을 가속화해 왔다.","r":{"ev":"2~3번 문장","s":[[2,"However, this traditional approach to consumption has faced challenges in recent years as more people have chosen to subscribe rather than make purchases.","그러나, 소비에 대한 이 전통적인 접근은 최근 몇 년 동안 더 많은 사람들이 구매를 하는 대신에 구독하기를 선택하면서 도전에 직면해 왔다."],[3,"This transition has accelerated the growth of what is now known as the subscription economy.","이 이행은 현재 구독 경제라고 알려진 것의 성장을 가속화해 왔다."]],"w":"transition은 ‘이행, 전환’이라는 뜻이에요. 바로 앞 문장에서 사람들이 구매 대신 구독을 선택하게 되었다고 했으니, This transition은 그 변화를 가리켜요.","c":1,"a":"1) 물건을 사서 소유하는 방식에서 구독하는 방식으로 바뀌는 것","k":"This transition = 사는 방식에서 구독하는 방식으로의 변화"},"pron":"This transition","h":"8bbf0f1fdc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Subscription-based business models benefit both consumers and businesses.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["구독 기반 사업 모델은 소비자와 기업 모두에게 이익이 된다.","구독 기반 사업 모델은 소비자에게만 이익이 된다.","구독 기반 사업 모델은 기업에게만 이익이 된다.","구독 기반 사업 모델은 소비자와 기업 모두에게 손해가 된다."],"sko":"구독 기반 사업 모델은 소비자와 기업 모두에게 이익을 준다.","r":{"ev":"7번 문장","s":[[7,"Subscription-based business models benefit both consumers and businesses.","구독 기반 사업 모델은 소비자와 기업 모두에게 이익을 준다."]],"w":"benefit은 ‘이익을 주다’라는 뜻이고 both A and B는 ‘A와 B 둘 다’예요. 소비자와 기업 모두에게 이익이 된다는 뜻이에요.","c":1,"a":"1) 구독 기반 사업 모델은 소비자와 기업 모두에게 이익이 된다."},"h":"582c587909"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Only streaming platforms such as Netflix and Spotify can be subscribed to.","Subscription-based models are used only by small companies.","Subscriptions are available for car rentals as well as streaming platforms and software.","Consumers can no longer subscribe to software solutions."],"oko":["넷플릭스와 스포티파이 같은 스트리밍 플랫폼만 구독할 수 있다.","구독 기반 모델은 작은 회사들만 사용한다.","스트리밍 플랫폼과 소프트웨어뿐 아니라 자동차 대여도 구독할 수 있다.","소비자는 더 이상 소프트웨어 솔루션을 구독할 수 없다."],"r":{"ev":"4번 문장","s":[[4,"Consumers can now subscribe to almost anything —from streaming platforms, such as Netflix and Spotify, to software solutions and even car rental subscriptions.","소비자들은 이제 넷플릭스와 스포티파이 같은 스트리밍 플랫폼부터, 소프트웨어 솔루션과 심지어는 자동차 대여 구독까지 거의 모든 것을 구독할 수 있다."]],"w":"4번 문장에서 스트리밍 플랫폼부터 소프트웨어, 자동차 대여 구독까지 거의 모든 것을 구독할 수 있다고 했어요.","c":3,"a":"3) Subscriptions are available for car rentals as well as streaming platforms and software. (스트리밍 플랫폼과 소프트웨어뿐 아니라 자동차 대여도 구독할 수 있다.)"},"h":"d11a2199bb"},{"n":9,"t":"sum","q":"By building long-term (A) with customers, businesses can get a stable and steady flow of (B).","ko":"고객과 장기적인 (A)을(를) 쌓음으로써, 기업은 안정적이고 꾸준한 (B)의 흐름을 얻을 수 있다.","opts":["(A) arguments / (B) debts","(A) gifts / (B) rules","(A) relationships / (B) revenue","(A) contracts / (B) losses","(A) distances / (B) prices"],"oko":["A 논쟁 / B 빚","A 선물 / B 규칙","A 관계 / B 수입","A 계약 / B 손실","A 거리 / B 가격"],"r":{"ev":"9번 문장","s":[[9,"Meanwhile, businesses secure a stable, steady revenue stream by fostering long-term customer relationships.","한편, 기업들은 장기적인 고객 관계를 조성함으로써 안정적이고, 지속적인 수입원을 확보한다."]],"w":"9번 문장은 기업이 장기적인 고객 관계(relationships)를 만들어 안정적이고 꾸준한 수입(revenue)의 흐름을 얻는다고 해요.","c":3,"a":"3) (A) relationships / (B) revenue (A 관계 / B 수입)"},"h":"96d81f56f1"},{"n":10,"t":"fill","q":"In the past, people [A] bought and owned the products they needed, whether they were [B] copies of movies or music albums.","ko":"과거에는, 영화의 [B] 사본이든 음악 앨범이든 사람들은 [A] 그들이 필요한 상품을 구매하고 소유했다.","bank":["physical","growth","typically","challenge","approach","decade"],"bko":{"physical":"실물의","growth":"성장","typically":"보통","challenge":"도전","approach":"접근","decade":"10년"},"r":{"ev":"1번 문장","s":[[1,"In the past, people typically bought and owned the products they needed, whether they were physical copies of movies or music albums.","과거에는, 영화의 실물 사본이든 음악 앨범이든 사람들은 보통 그들이 필요한 상품을 구매하고 소유했다."]],"w":"1번 문장은 과거에 사람들이 보통(typically) 상품을 사서 소유했고, 영화나 음악 앨범도 실물(physical) 사본이었다는 내용이에요.","c":null,"a":"[A] typically (보통), [B] physical (실물의)"},"h":"46fdaf664f"}]},{"u":2,"id":"ch3-02-4","no":4,"ko":"수능:ON 요지 · 주장","items":[{"n":1,"t":"tf","q":"People usually encounter content that is similar to what others see online.","ko":"사람들은 보통 온라인에서 다른 사람들이 보는 것과 비슷한 콘텐츠를 접한다.","r":{"ev":"2번 문장","s":[[2,"Due to algorithms, however, this is rarely the case.","그러나, 알고리즘 때문에 이것은 드문 경우이다."]],"w":"2번에서 알고리즘 때문에 이것(비슷한 내용을 접하는 것)은 rarely, 즉 드문 경우라고 해요. ‘보통 접한다’는 본문과 반대예요. 비슷하다고 ‘추정’하는 것은 1번 내용이에요.","c":"F","a":"F (본문과 다른 내용)"},"h":"890b9b5205"},{"n":2,"t":"tf","q":"The algorithms that form filter bubbles do not ask permission before they track your online activity.","ko":"필터 버블을 형성하는 알고리즘은 당신의 온라인 활동을 추적하기 전에 허락을 구하지 않는다.","r":{"ev":"8번 문장","s":[[8,"And the problem is that the algorithms forming these filter bubbles neither tell you what they are doing nor ask permission before tracking your online activity.","그리고 문제는 이러한 필터 버블을 형성하는 알고리즘이 그들이 무엇을 하는지 당신에게 말하지도 않고 당신의 온라인 활동을 추적하기 전에 허락을 구하지도 않는다는 것이다."]],"w":"8번에서 필터 버블을 형성하는 알고리즘은 무엇을 하는지 말해 주지도, 추적하기 전에 허락을 구하지도 않는다고 해요. 본문과 맞아요.","c":"T","a":"T (본문과 맞는 내용)"},"h":"33f057a539"},{"n":3,"t":"tf","q":"Social media platforms may show only posts from friends who have viewpoints different from yours.","ko":"소셜 미디어 플랫폼은 당신과 다른 관점을 가진 친구들의 게시물만 보여 줄 수도 있다.","r":{"ev":"7번 문장","s":[[7,"For example, news websites may conceal articles that they think you won’t agree with, or social media platforms may only display posts on your feed from friends with similar viewpoints to yours.","예를 들어, 뉴스 웹사이트는 그들이 생각하기에 당신이 동의하지 않을 기사를 숨길 수 있고, 또는 소셜 미디어 플랫폼은 당신의 피드에 당신과 비슷한 관점을 가진 친구들로부터 온 게시물들만 드러낼 수도 있다."]],"w":"7번에서 소셜 미디어는 당신과 ‘비슷한’ 관점을 가진 친구들의 게시물만 보여 줄 수 있다고 해요. ‘다른 관점’은 반대예요.","c":"F","a":"F (본문과 다른 내용)"},"h":"8a5b850633"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…utilize this information to curate content that aligns with your tracked preferences.)","ko":"(…당신의 추적된 선호도에 맞는 콘텐츠를 [ ] 위해 이 정보를 활용한다.)","opts":["선별하다, 엄선해 구성하다","삭제하다","번역하다","광고하다"],"word":"curate","r":{"ev":"3번 문장","s":[[3,"Algorithms constantly monitor what you click on during your time online and then utilize this information to curate content that aligns with your tracked preferences.","알고리즘은 당신이 온라인에서 시간을 보내는 동안 당신이 클릭하는 것을 지속적으로 감시하고 그런 다음 당신의 추적된 선호도에 맞춰 조정한 콘텐츠를 선별하기 위해 이 정보를 활용한다."]],"w":"3번에서 알고리즘은 클릭 정보를 활용해 내 선호에 맞는 콘텐츠를 골라 모아요. curate = 선별하다, 엄선해 구성하다.","c":1,"a":"1) 선별하다, 엄선해 구성하다"},"h":"f944e507f3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Be conscious of algorithms while you surf the internet…)","ko":"(인터넷을 검색하는 동안 알고리즘을 [ ]…)","opts":["지루한","무관심한","의식하는, 알고 있는","의심하는"],"word":"conscious","r":{"ev":"12번 문장","s":[[12,"Be conscious of algorithms while you surf the internet and try to look for different viewpoints and sources of information.","당신이 인터넷을 검색하는 동안 알고리즘을 의식하고 다양한 관점과 정보의 출처를 찾으려고 노력해라."]],"w":"12번은 알고리즘이 있다는 것을 늘 알고 있으라는 말이에요. conscious = 의식하는, 알고 있는.","c":3,"a":"3) 의식하는, 알고 있는"},"h":"14702d0a5a"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nFor example, news websites may conceal articles that they think you won’t agree with, or social media platforms may only display posts on your feed from friends with similar viewpoints to yours.","ko":"밑줄 친 they가 가리키는 것은?","opts":["뉴스 웹사이트","소셜 미디어 플랫폼","당신의 친구들","기사들"],"sko":"예를 들어, 뉴스 웹사이트는 그들이 생각하기에 당신이 동의하지 않을 기사를 숨길 수 있고, 또는 소셜 미디어 플랫폼은 당신의 피드에 당신과 비슷한 관점을 가진 친구들로부터 온 게시물들만 드러낼 수도 있다.","r":{"ev":"7번 문장","s":[[7,"For example, news websites may conceal articles that they think you won’t agree with, or social media platforms may only display posts on your feed from friends with similar viewpoints to yours.","예를 들어, 뉴스 웹사이트는 그들이 생각하기에 당신이 동의하지 않을 기사를 숨길 수 있고, 또는 소셜 미디어 플랫폼은 당신의 피드에 당신과 비슷한 관점을 가진 친구들로부터 온 게시물들만 드러낼 수도 있다."]],"w":"news websites may conceal articles that they think you won’t agree with에서 생각하는 주체는 they이고, 앞에 나온 주어 news websites를 가리켜요. 기사(articles)는 숨겨지는 대상이에요.","c":1,"a":"1) 뉴스 웹사이트","k":"they = news websites (뉴스 웹사이트)"},"pron":"they","h":"3839049b04"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This means that algorithms have stopped exposing you to opinions and information that you have not previously shown interest in, which may cause you to miss out on important information.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["알고리즘이 당신이 관심을 보인 의견과 정보만 지워 버려서 당신은 새로운 정보를 얻게 된다.","알고리즘이 당신에게 관심 없던 의견과 정보를 더 많이 보여 주어 중요한 정보를 놓치지 않게 된다.","알고리즘이 당신의 관심사를 모르게 되어 아무 정보나 무작위로 보여 주게 된다.","알고리즘이 당신이 전에 관심 보이지 않았던 의견과 정보를 보여 주는 것을 멈춰서, 당신이 중요한 정보를 놓칠 수 있다."],"sko":"이것은 알고리즘이 당신이 이전에 관심을 보이지 않았던 의견들과 정보에 당신을 노출시키는 것을 멈췄다는 것을 의미하는데, 이것은 당신이 중요한 정보를 놓치는 것을 초래할 수 있다.","r":{"ev":"5번 문장","s":[[5,"This means that algorithms have stopped exposing you to opinions and information that you have not previously shown interest in, which may cause you to miss out on important information.","이것은 알고리즘이 당신이 이전에 관심을 보이지 않았던 의견들과 정보에 당신을 노출시키는 것을 멈췄다는 것을 의미하는데, 이것은 당신이 중요한 정보를 놓치는 것을 초래할 수 있다."]],"w":"5번은 알고리즘이 이전에 관심을 보이지 않았던 의견과 정보를 보여 주는 것을 멈췄고, 그래서 중요한 정보를 놓칠 수 있다는 뜻이에요. 새 정보를 더 얻는다거나 무작위로 보여 준다는 말은 아니에요.","c":4,"a":"4) 알고리즘이 당신이 전에 관심 보이지 않았던 의견과 정보를 보여 주는 것을 멈춰서, 당신이 중요한 정보를 놓칠 수 있다."},"h":"193db67a4f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Filter bubbles appear only on news websites.","Filter bubbles can appear in almost any place online.","Filter bubbles can happen in only a few places online.","Filter bubbles never happen on social media platforms."],"oko":["필터 버블은 뉴스 웹사이트에서만 나타난다.","필터 버블은 온라인의 거의 모든 곳에서 나타날 수 있다.","필터 버블은 온라인의 몇몇 곳에서만 일어날 수 있다.","필터 버블은 소셜 미디어 플랫폼에서는 절대 일어나지 않는다."],"r":{"ev":"6번 문장","s":[[6,"Filter bubbles can happen almost anywhere online.","필터 버블은 거의 모든 온라인 공간에서 발생할 수 있다."]],"w":"6번 문장에서 필터 버블은 온라인의 거의 모든 곳에서 일어날 수 있다고 했어요.","c":2,"a":"2) Filter bubbles can appear in almost any place online. (필터 버블은 온라인의 거의 모든 곳에서 나타날 수 있다.)"},"h":"03a3942af7"},{"n":9,"t":"sum","q":"It is almost (A) to avoid filter bubbles, so we should think (B) about what we see online.","ko":"필터 버블을 피하는 것은 거의 (A)이므로, 우리는 온라인에서 보는 것에 대해 (B) 생각해야 한다.","opts":["(A) easy / (B) happily","(A) free / (B) quickly","(A) possible / (B) rarely","(A) safe / (B) silently","(A) impossible / (B) critically"],"oko":["A 쉬운 / B 즐겁게","A 무료인 / B 빠르게","A 가능한 / B 드물게","A 안전한 / B 조용히","A 불가능한 / B 비판적으로"],"r":{"ev":"9번, 13번 문장","s":[[9,"What’s more, avoiding them is almost impossible.","게다가, 그들을 피하는 것은 거의 불가능하다."],[13,"Think critically about what you see online and remember that others might think differently than you.","당신이 온라인에서 보는 것에 대해 비판적으로 생각하고 다른 사람들이 당신과 다르게 생각할 수도 있다는 것을 기억해라."]],"w":"9번 문장은 필터 버블을 피하는 것이 거의 불가능(impossible)하다고 하고, 13번 문장은 온라인에서 보는 것에 대해 비판적으로(critically) 생각하라고 해요.","c":5,"a":"5) (A) impossible / (B) critically (A 불가능한 / B 비판적으로)"},"h":"b5336d2fd2"},{"n":10,"t":"fill","q":"This [A] will help you [B] some control over your time online.","ko":"이러한 [A]은(는) 당신이 온라인에서 보내는 시간에 대한 어느 정도의 통제력을 [B] 도울 것이다.","bank":["awareness","regain","conscious","expose","curate","conceal"],"bko":{"awareness":"인식","regain":"되찾도록","conscious":"의식하는","expose":"노출시키도록","curate":"선별하도록","conceal":"숨기도록"},"r":{"ev":"14번 문장","s":[[14,"This awareness will help you regain some control over your time online.","이러한 인식은 당신이 온라인에서 보내는 시간에 대한 어느 정도의 통제력을 되찾도록 도울 것이다."]],"w":"14번 문장은 이러한 인식(awareness)이 온라인 시간에 대한 통제력을 되찾도록(regain) 도울 것이라는 내용이에요.","c":null,"a":"[A] awareness (인식), [B] regain (되찾도록)"},"h":"d27e332c82"}]},{"u":3,"id":"ch3-03-1","no":1,"ko":"노벨상 대신 필즈 메달!","items":[{"n":1,"t":"tf","q":"According to the passage, Nobel did not create a prize for mathematics because he lost the woman he loved to a famous mathematician.","ko":"글에 따르면, 노벨은 자신이 사랑한 여성을 유명한 수학자에게 빼앗겼기 때문에 수학을 위한 상을 만들지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It has been rumored that this was because Nobel and a famous mathematician once fell in love with the same woman, but the truth is that Nobel simply wasn’t interested in math.","이는 노벨과 어떤 유명한 수학자가 한때 동일한 여성과 사랑에 빠졌었기 때문이라는 소문이 있어 왔지만, 사실은 노벨이 단지 수학에 관심이 없었다는 것이다."]],"w":"3번에서 같은 여자를 사랑했다는 것은 ‘소문’이고, 사실은 노벨이 수학에 관심이 없었던 것이라고 해요. 여자를 빼앗겼다는 말도 본문에 없어요.","c":"F"},"h":"fcdd6722e5"},{"n":2,"t":"tf","q":"Fields left money in his will so that an award could be established.","ko":"필즈는 상이 제정될 수 있도록 자신의 유언에 돈을 남겼다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Four years earlier, Fields had died, leaving money in his will to establish the award.","그보다 4년 전에 필즈는 사망하면서, 상을 제정하기 위해 그의 유언에서 돈을 남겼다."]],"w":"7번에서 필즈가 죽으면서 상을 제정하기 위해(to establish the award) 유언으로 돈을 남겼다고 해요. 본문과 맞아요.","c":"T"},"h":"37d719f682"},{"n":3,"t":"tf","q":"The Fields Medal is awarded every year to mathematicians of any age.","ko":"필즈 메달은 모든 나이의 수학자에게 매년 수여된다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The Fields Medal is awarded every four years and is restricted to mathematicians under the age of 40.","필즈 메달은 4년마다 수여되며, 40세 미만의 수학자들로 제한되어 있다."]],"w":"9번에서 필즈 메달은 ‘4년마다’ 수여되고 40세 미만 수학자로 제한된다고 해요. ‘매년’도, ‘모든 나이’도 본문과 달라요.","c":"F"},"h":"9090c4a613"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…he or she has attained the highest honor in the field of math.)","ko":"(…그 또는 그녀가 수학 분야에서 가장 높은 명예를 …했다.)","opts":["얻었다","잃었다","거절했다","나눠 주었다"],"word":"attained","r":{"a":"1) 얻었다","ev":"8번 문장","s":[[8,"Along with $15,000, each winning mathematician has the honor of knowing that he or she has attained the highest honor in the field of math.","15,000달러와 함께, 수상하는 각 수학자는 자신이 수학 분야에서 가장 높은 명예를 얻었다는 것을 알게 되는 영광을 차지한다."]],"w":"8번은 수상자가 수학 분야에서 가장 높은 명예를 ‘얻었다’는 내용이에요. attain은 ‘이루다, 얻다’라서 attained = 얻었다예요. ‘잃었다’나 ‘거절했다’는 영광이라는 말과 어긋나요.","c":1},"h":"d6def3e31c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…mathematicians seldom achieve acclaim outside of their field.)","ko":"(…수학자들은 자신의 분야 밖에서 …를 좀처럼 얻지 못한다.)","opts":["비난","질문","비밀","찬사"],"word":"acclaim","r":{"a":"4) 찬사","ev":"11번 문장","s":[[11,"Whereas many Nobel Prize winners have been quite famous, few of the people who have received the Fields Medal are well known, because mathematicians seldom achieve acclaim outside of their field.","많은 노벨상 수상자들이 꽤 유명한 데 반해, 필즈 메달을 받은 사람들 중 잘 알려진 사람은 거의 없는데, 수학자들이 그들의 분야 밖에서 찬사를 받는 일이 드물기 때문이다."]],"w":"11번은 필즈 메달 수상자가 잘 알려지지 않은 이유를 말해요. 수학자들이 분야 밖에서 ‘찬사’를 얻는 일이 드물기 때문이에요. acclaim = 찬사예요. 비난을 얻는 일이 드물다는 말은 ‘유명하지 않다’는 이유가 되지 못해요.","c":4},"h":"ab17ac6efb"},{"n":6,"t":"ref","q":"What does the underlined \"his\" refer to?\nSwedish chemist Alfred Nobel, the inventor of dynamite, established the Nobel Prizes in his will.","ko":"밑줄 친 his가 가리키는 것은?","sko":"다이너마이트의 발명가인 스웨덴의 화학자 알프레드 노벨은 그의 유언을 통해 노벨상을 제정했다.","opts":["알프레드 노벨","존 찰스 필즈","노벨상 수상자","다이너마이트"],"r":{"a":"1) 알프레드 노벨","ev":"1번 문장","s":[[1,"Swedish chemist Alfred Nobel, the inventor of dynamite, established the Nobel Prizes in his will.","다이너마이트의 발명가인 스웨덴의 화학자 알프레드 노벨은 그의 유언을 통해 노벨상을 제정했다."]],"w":"Swedish chemist Alfred Nobel, the inventor of dynamite, established the Nobel Prizes in his will에서 상을 제정한 사람은 노벨이므로 his(그의)는 알프레드 노벨을 가리켜요.","c":1,"k":"his = Alfred Nobel (알프레드 노벨)"},"pron":"his","h":"9ad74ccfba"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Although he created a prize for a number of different fields, he did not create one for mathematics.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 여러 다른 분야를 위한 상을 제정했지만, 수학을 위한 상은 제정하지 않았다.","opts":["노벨은 수학을 포함한 모든 분야의 상을 만들었다.","노벨은 여러 분야의 상을 만들었지만 수학 분야의 상은 만들지 않았다.","노벨은 수학 분야의 상만 만들고 다른 분야의 상은 만들지 않았다.","노벨은 수학상을 만들려고 했지만 돈이 모자랐다."],"r":{"a":"2) 노벨은 여러 분야의 상을 만들었지만 수학 분야의 상은 만들지 않았다.","ev":"2번 문장","s":[[2,"Although he created a prize for a number of different fields, he did not create one for mathematics.","그는 여러 다른 분야를 위한 상을 제정했지만, 수학을 위한 상은 제정하지 않았다."]],"w":"Although(~이지만)가 앞뒤를 맞세워요. 여러 분야의 상은 만들었지만, one(=a prize) for mathematics는 만들지 않았다는 뜻이에요. 돈이 모자랐다는 말은 본문에 없어요.","c":2},"h":"46bf679550"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["필즈 메달은 1932년에 처음 수여되었다.","필즈 메달 수상자는 노벨상 수상자보다 더 유명하다.","필즈 메달은 캐나다의 수학자의 이름을 따서 명명되었다.","알프레드 노벨은 캐나다의 수학자였다."],"opts":["The Fields Medal was first awarded in 1932.","Winners of the Fields Medal are more famous than Nobel Prize winners.","The Fields Medal is named after a Canadian mathematician.","Alfred Nobel was a Canadian mathematician."],"r":{"a":"3) The Fields Medal is named after a Canadian mathematician. (필즈 메달은 캐나다의 수학자의 이름을 따서 명명되었다.)","ev":"6번 문장","s":[[6,"Named after John Charles Fields, a Canadian mathematician, the medal was first awarded in 1936.","캐나다의 수학자인 존 찰스 필즈의 이름을 따서 명명된 그 메달은 1936년에 처음으로 수여되었다."]],"w":"6번 문장에서 필즈 메달은 캐나다의 수학자 존 찰스 필즈의 이름을 따서 명명되었다고 했어요.","c":3},"h":"861e9cc229"},{"n":9,"t":"sum","q":"Winners of the Fields Medal can enjoy a moment in the (A) because they have won a (B) award.","ko":"필즈 메달 수상자들은 (B) 상을 받았기 때문에 (A)을(를) 받는 순간을 즐길 수 있다.","oko":["A 그림자 / B 값싼","A 어둠 / B 단순한","A 스포트라이트 / B 권위 있는","A 뉴스 / B 비밀의","A 부엌 / B 흔한"],"opts":["(A) shadow / (B) cheap","(A) dark / (B) simple","(A) spotlight / (B) prestigious","(A) news / (B) secret","(A) kitchen / (B) common"],"r":{"a":"3) (A) spotlight / (B) prestigious (A 스포트라이트 / B 권위 있는)","ev":"12번 문장","s":[[12,"But by winning such a prestigious award, they are able to enjoy their moment in the spotlight.","그러나 이런 권위 있는 상을 받음으로써, 그들은 주목을 받는 순간을 즐길 수 있다."]],"w":"12번 문장은 이런 권위 있는(prestigious) 상을 받음으로써 주목, 즉 스포트라이트(spotlight)를 받는 순간을 즐길 수 있다고 해요.","c":3},"h":"a53f47f50f"},{"n":10,"t":"fill","q":"This is because it is intended to serve as an [A] to do even greater work in the [B].","ko":"이것은 그것이 [B]에 더 위대한 일을 할 수 있는 [A](으)로서 작용하도록 의도되었기 때문이다.","bank":["inspiration","future","absence","acclaim","reason","prize"],"bko":{"inspiration":"영감","future":"미래","absence":"부재","acclaim":"찬사","reason":"이유","prize":"상"},"r":{"a":"[A] inspiration (영감), [B] future (미래)","ev":"10번 문장","s":[[10,"This is because it is intended to serve as an inspiration to do even greater work in the future.","이것은 그것이 미래에 훨씬 더 위대한 일을 할 수 있는 영감으로서 작용하도록 의도되었기 때문이다."]],"w":"10번 문장은 그 메달이 미래(future)에 더 위대한 일을 하도록 하는 영감(inspiration)으로 작용하도록 의도되었다는 뜻이에요.","c":null},"h":"2697ba32a5"}]},{"u":3,"id":"ch3-03-2","no":2,"ko":"창문으로 본 네덜란드 사람들","items":[{"n":1,"t":"tf","q":"Dutch people traditionally cover their windows with curtains at night.","ko":"네덜란드 사람들은 전통적으로 밤에는 창문을 커튼으로 가린다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"The most notable feature of Dutch homes is their large windows, which are traditionally left uncovered both during the day and through the night.","네덜란드 집의 가장 눈에 띄는 특징은 큰 창문들인데, 그것들은 전통적으로 낮 동안과 밤새 가려지지 않은 채로 있다."]],"w":"1번에서 큰 창문은 전통적으로 낮에도 밤새도 가려지지 않은 채로 있다고 해요. 밤에 커튼으로 가린다는 말은 반대예요.","c":"F"},"h":"c0bdf08e33"},{"n":2,"t":"tf","q":"In the Puritan view, virtuous people have no reason to draw their curtains because they have nothing to hide.","ko":"청교도의 시각에서, 도덕적인 사람들은 숨길 것이 없으므로 커튼을 칠 이유가 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Virtuous people, in their eyes, have nothing to hide and therefore have no reason to draw their curtains.","그들의 눈에는, 도덕적인 사람들은 숨길 것이 없으며, 따라서 커튼을 칠 이유가 없다."]],"w":"7번에서 도덕적인 사람은 숨길 것이 없어서 커튼을 칠 이유가 없다고 해요. 본문과 맞아요.","c":"T"},"h":"cc25b7ae39"},{"n":3,"t":"tf","q":"The writer advises visitors to the Netherlands not to look at the windows of Dutch homes.","ko":"글쓴이는 네덜란드를 방문하는 사람들에게 네덜란드 집의 창문을 보지 말라고 조언한다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"So, if you ever visit the Netherlands, keep your eyes open.","그러니, 만약 당신이 네덜란드를 방문한다면, 눈을 크게 뜨고 살펴보아라."]],"w":"12번에서 글쓴이는 네덜란드를 방문하면 눈을 크게 뜨고 살펴보라(keep your eyes open)고 권해요. 보지 말라는 말은 반대예요.","c":"F"},"h":"63b4c17230"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The most notable feature of Dutch homes is their large windows…)","ko":"(네덜란드 집의 가장 …한 특징은 큰 창문들이다…)","opts":["숨겨진","평범한","눈에 띄는","불편한"],"word":"notable","r":{"a":"3) 눈에 띄는","ev":"1번 문장","s":[[1,"The most notable feature of Dutch homes is their large windows, which are traditionally left uncovered both during the day and through the night.","네덜란드 집의 가장 눈에 띄는 특징은 큰 창문들인데, 그것들은 전통적으로 낮 동안과 밤새 가려지지 않은 채로 있다."]],"w":"1번은 네덜란드 집의 특징으로 큰 창문을 소개해요. 첫 문장에서 소개하는 ‘가장 ○○한 특징’이므로 notable = 눈에 띄는(주목할 만한)이에요. 평범한 것은 특징으로 내세우기 어려워요.","c":3},"h":"765cbdd265"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…anyone standing on the street can enjoy an unobstructed view of the rooms within.)","ko":"(…길거리에 서 있는 사람은 누구나 안에 있는 방의 …한 광경을 즐길 수 있다.)","opts":["막힘이 없는","흐릿한","제한된","아주 작은"],"word":"unobstructed","r":{"a":"1) 막힘이 없는","ev":"4번 문장","s":[[4,"At night, with the interior lights turned on, anyone standing on the street can enjoy an unobstructed view of the rooms within.","밤에는 실내등이 켜진 채로, 길거리에 서 있는 사람은 누구나 집 내부에 있는 방의 훤히 보이는 광경을 즐길 수 있다."]],"w":"4번은 밤에 길에 선 사람이 집 안을 ‘즐길 수 있다’고 해요. 창문이 가려지지 않아서 가로막는 것이 없으니 unobstructed = 막힘이 없는(훤히 보이는)이에요. 흐릿하거나 제한된 광경은 ‘즐길 수 있다’와 어울리지 않아요.","c":1},"h":"d6b1e1e89e"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nOne advantage of these windows is that they allow homes to be flooded with natural light.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이 창문들의 한 가지 장점은 집이 자연광으로 가득 차게 해준다는 것이다.","opts":["네덜란드의 집들","자연광","이 창문들","집 안의 사람들"],"r":{"a":"3) 이 창문들","ev":"1~2번 문장","s":[[1,"The most notable feature of Dutch homes is their large windows, which are traditionally left uncovered both during the day and through the night.","네덜란드 집의 가장 눈에 띄는 특징은 큰 창문들인데, 그것들은 전통적으로 낮 동안과 밤새 가려지지 않은 채로 있다."],[2,"One advantage of these windows is that they allow homes to be flooded with natural light.","이 창문들의 한 가지 장점은 집이 자연광으로 가득 차게 해준다는 것이다."]],"w":"they는 ‘집이 자연광으로 가득 차게 해 주는’ 주체예요. 그것은 these windows, 즉 1번의 their large windows예요. homes는 allow의 목적어이고, 자연광(natural light)은 채워지는 것이에요.","c":3},"h":"7d77ebe88c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Large, uncovered windows, in other words, show exactly what’s happening inside the home and prove that there is nothing wrong going on.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다시 말해서, 크고 가려지지 않은 창문들은 집 안에서 무슨 일이 일어나고 있는지를 정확하게 보여 주고, 어떤 나쁜 일도 일어나고 있지 않다는 것을 증명한다.","opts":["큰 창문은 집 안에 햇빛이 많이 들어오게 해서 집을 따뜻하게 만든다.","크고 가려지지 않은 창문은 집 안의 상황을 그대로 보여 주어 잘못된 일이 없음을 입증한다.","크고 가려지지 않은 창문은 이웃의 나쁜 행동을 감시하는 데 쓰인다.","큰 창문은 커튼으로 가릴 때 가장 잘 숨길 수 있다."],"r":{"a":"2) 크고 가려지지 않은 창문은 집 안의 상황을 그대로 보여 주어 잘못된 일이 없음을 입증한다.","ev":"8번 문장","s":[[8,"Large, uncovered windows, in other words, show exactly what’s happening inside the home and prove that there is nothing wrong going on.","다시 말해서, 크고 가려지지 않은 창문들은 집 안에서 무슨 일이 일어나고 있는지를 정확하게 보여 주고, 어떤 나쁜 일도 일어나고 있지 않다는 것을 증명한다."]],"w":"show exactly what’s happening inside the home은 ‘집 안에서 일어나는 일을 정확히 보여 준다’, prove that there is nothing wrong going on은 ‘나쁜 일이 없다는 것을 입증한다’는 뜻이에요. 감시나 따뜻함은 본문에 없고, 커튼으로 가리는 것은 7번에서 이유가 없다고 한 일이에요.","c":2},"h":"b595cc163c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["네덜란드에서는 더 이상 가려지지 않은 창문을 쓰는 사람이 거의 없다.","청교도는 도덕적인 사람이 사생활을 커튼 뒤에 숨겨야 한다고 믿었다.","어떤 사람들은 블라인드를 달지만, 가려지지 않은 창문은 여전히 많은 곳에서 인기가 있다.","큰 창문 때문에 밤에는 길에서 집 안을 볼 수 없다."],"opts":["Almost no one in the Netherlands uses uncovered windows anymore.","The Puritans believed that virtuous people should hide their private lives behind curtains.","Some people put up blinds, but uncovered windows are still popular in many places.","Because of the large windows, no one on the street can see inside the houses at night."],"r":{"a":"3) Some people put up blinds, but uncovered windows are still popular in many places.","ev":"10~11번 문장","s":[[10,"Some people are installing vertical blinds that make it difficult for outsiders to look in.","어떤 사람들은 밖에 있는 사람들이 안을 들여다보기 어렵게 만드는 수직 블라인드를 설치하고 있다."],[11,"However, there are plenty of places in the country where uncovered windows are still popular.","그러나, 그 나라에는 가려지지 않은 창문들이 여전히 인기 있는 장소가 많다."]],"w":"10번에서 일부 사람들이 블라인드를 설치하지만, 11번에서 가려지지 않은 창문이 여전히 인기 있는 곳이 많다고 해요. 거의 안 쓴다는 말은 11번과 반대이고, 청교도는 숨길 것이 없다고 보았으며(7번), 밤에는 길에서 안이 훤히 보여요(4번).","c":3},"h":"96097ada34"},{"n":9,"t":"sum","q":"The uncovered windows can be explained by the strong (A) of Puritanism on Dutch (B).","ko":"가려지지 않은 창문은 청교도주의가 네덜란드 (B)에 끼친 강한 (A)(으)로 설명할 수 있다.","oko":["A 가격 / B 음식","A 두려움 / B 날씨","A 영향 / B 문화","A 규칙 / B 돈","A 취향 / B 스포츠"],"opts":["(A) price / (B) food","(A) fear / (B) weather","(A) influence / (B) culture","(A) rule / (B) money","(A) taste / (B) sports"],"r":{"a":"3) (A) influence / (B) culture (A 영향 / B 문화)","ev":"6번 문장","s":[[6,"The reason for these uncovered windows can be traced back to the influence of Puritanism on Dutch culture.","이러한 가려지지 않은 창문에 대한 이유는 네덜란드 문화에 대한 청교도주의의 영향으로 거슬러 올라갈 수 있다."]],"w":"6번 문장은 가려지지 않은 창문의 이유가 네덜란드 문화(culture)에 대한 청교도주의의 영향(influence)으로 거슬러 올라간다고 해요.","c":3},"h":"38ff4ffcc6"},{"n":10,"t":"fill","q":"And a person standing inside can [A] his or her [B] against the window and see what is going on outside.","ko":"그리고 내부에 서 있는 사람은 창문에 자신의 [B]을(를) [A] 바깥에서 무슨 일이 일어나고 있는지를 볼 수 있다.","bank":["press","nose","install","curtains","virtuous","advantage"],"bko":{"press":"대고(누르다)","nose":"코","install":"설치하다","curtains":"커튼","virtuous":"도덕적인","advantage":"장점"},"r":{"a":"[A] press (대고(누르다)), [B] nose (코)","ev":"5번 문장","s":[[5,"And a person standing inside can press his or her nose against the window and see what is going on outside.","그리고 내부에 서 있는 사람은 창문에 자신의 코를 대고 바깥에서 무슨 일이 일어나고 있는지를 볼 수 있다."]],"w":"5번 문장은 안에 있는 사람이 창문에 코(nose)를 대고(press) 바깥을 볼 수 있다는 내용이에요.","c":null},"h":"e335ff8420"}]},{"u":3,"id":"ch3-03-3","no":3,"ko":"똑똑해지는 사람들","items":[{"n":1,"t":"tf","q":"According to the analysis, IQ scores go up on average by about three points every ten years.","ko":"분석에 따르면, IQ 지수는 평균적으로 10년마다 약 3점씩 오른다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It showed that they go up on average by three points per decade.","그 분석은 그것들이 평균적으로 10년에 3점씩 오른다는 것을 보여 주었다."]],"w":"4번에서 IQ 지수는 평균적으로 10년에 3점씩 오른다고 해요. 본문과 맞아요.","c":"T"},"h":"b3944e2924"},{"n":2,"t":"tf","q":"Flynn found that the IQ scores of American children rose only when the time spent in school increased.","ko":"플린은 미국 아동들의 IQ 지수가 학교에서 보낸 시간이 늘었을 때에만 올랐다는 것을 발견했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"For instance, Flynn actually discovered that the IQ scores of American children rose even when time spent in school stayed constant.","예를 들어, 플린은 실제로 학교에서 보낸 시간이 변함없이 유지되었던 때조차도 미국 아동들의 IQ 지수가 올랐다는 것을 발견했다."]],"w":"8번에서 학교에서 보낸 시간이 변하지 않았을 때조차(even when ~ stayed constant) IQ가 올랐다고 해요. ‘늘었을 때에만’은 반대예요.","c":"F"},"h":"eebb3ccb13"},{"n":3,"t":"tf","q":"New gadgets such as smartphones demand abstract reasoning, which parents of today’s children often lack.","ko":"스마트폰 같은 새로운 기계들은 추상적 사고를 요구하는데, 오늘날 아이들의 부모들에게는 이것이 대개 결여되어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"What’s more, new gadgets they’re using—such as smartphones—demand more abstract reasoning, which their parents often lack.","게다가, 그들이 사용하고 있는 스마트폰과 같은 새로운 기계들은 더욱 추상적인 사고를 필요로 하는데, 그들의 부모들은 이것이 대개 결여되어 있다."]],"w":"13번에서 새로운 기계들은 더욱 추상적인 사고를 필요로 하고, 그들의 부모들은 이것이 대개 결여되어 있다고 해요. 본문과 맞아요.","c":"T"},"h":"5d32806f1d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, neither reason has compelling support.)","ko":"(그러나, 둘 중 어느 이유에도 …한 근거가 있지는 않다.)","opts":["위험한","설득력 있는","오래된","비싼"],"word":"compelling","r":{"a":"2) 설득력 있는","ev":"7번 문장","s":[[7,"However, neither reason has compelling support.","그러나, 둘 중 어느 이유에도 설득력 있는 근거가 있지는 않다."]],"w":"7번은 6번의 두 이유를 반박하는 말이에요. 그 이유들에 ‘설득력 있는’ 근거가 없다는 뜻이라서 compelling = 설득력 있는이에요. 위험한·오래된·비싼은 근거를 꾸미는 말로 맞지 않아요.","c":2},"h":"fce264d82e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the increasing sophistication of modern life may stimulate a more complex mind.)","ko":"(…증가하고 있는 현대 생활의 …이(가) 더 복잡한 사고방식을 자극할 수도 있다.)","opts":["복잡성, 정교화","단순함","부족","속도"],"word":"sophistication","r":{"a":"1) 복잡성, 정교화","ev":"14번 문장","s":[[14,"It seems that the increasing sophistication of modern life may stimulate a more complex mind.","아마 증가하고 있는 현대 생활의 복잡성이 더 복잡한 사고방식을 자극하는 것 같다."]],"w":"14번은 10번의 ‘사회의 증가된 복잡성’을 다시 정리해요. 현대 생활이 점점 복잡해지고 정교해져서 더 복잡한 사고를 자극한다는 뜻이라서 sophistication = 복잡성(정교화)이에요. 단순함이면 ‘더 복잡한 사고’를 자극할 수 없어요.","c":1},"h":"ff45d4ee80"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nKnown as the “Flynn effect,” this interesting phenomenon has left many wondering what its causes might be.","ko":"밑줄 친 its가 가리키는 것은?","sko":"‘플린 효과’로 알려진 이 흥미로운 현상은 많은 이들에게 그것의 원인들이 무엇인지를 궁금하게 했다.","opts":["플린 효과(흥미로운 현상)","많은 사람들","IQ 지수","플린 본인"],"r":{"a":"1) 플린 효과(흥미로운 현상)","ev":"5번 문장","s":[[5,"Known as the “Flynn effect,” this interesting phenomenon has left many wondering what its causes might be.","‘플린 효과’로 알려진 이 흥미로운 현상은 많은 이들에게 그것의 원인들이 무엇인지를 궁금하게 했다."]],"w":"Known as the “Flynn effect,” this interesting phenomenon에서 현상 자체가 주어이고, its causes는 ‘그 현상의 원인들’이에요. its는 플린 효과를 가리켜요.","c":1,"k":"its = this interesting phenomenon (플린 효과)"},"pron":"its","h":"e013418676"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Although it is unclear what exactly is boosting intelligence, it is likely that all of these factors combine and interact to make each generation smarter than the last.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"정확히 무엇이 지능을 향상시키고 있는지는 불명확하지만, 이 모든 요인들이 결합하고 상호작용해서 각 세대를 이전 세대보다 더 똑똑하게 만드는 것 같다.","opts":["무엇이 지능을 높이는지는 분명하지만, 요인들이 서로 영향을 주지는 않는다.","무엇이 지능을 높이는지 정확히는 알 수 없지만, 여러 요인이 합쳐져 세대를 이전보다 똑똑하게 만드는 것 같다.","지능을 높이는 이유는 하나뿐이고, 모든 세대에서 같다.","각 세대는 a is more popular than news sites for watching news videos.","ko":"언급된 국가 대부분에서, 뉴스 영상을 보는 데 소셜 미디어가 뉴스 사이트보다 더 인기 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"In four of the listed countries, consuming news videos on news sites is more popular than consuming them via social media.","언급된 국가 중 네 국가에서, 뉴스 사이트에서의 뉴스 영상 소비는 소셜 미디어를 통한 소비보다 더 인기가 있다."]],"w":"2번에서 네 국가는 뉴스 사이트에서의 소비가 소셜 미디어를 통한 소비보다 더 인기 있다고 해요. 소셜 미디어가 더 인기라는 것은 반대예요.","c":"F"},"h":"2b452b1191"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…how people in five different countries consume news videos…)","ko":"(…다섯 개의 다른 국가 사람들이 뉴스 영상을 어떻게 …하는지…)","opts":["제작하다","소비하다","삭제하다","수출하다"],"word":"consume","r":{"a":"2) 소비하다","ev":"1번 문장","s":[[1,"The above graph shows how people in five different countries consume news videos: on news sites versus on social media.","위 그래프는 다섯 개의 다른 국가 사람들이 어떻게 뉴스 영상을 소비하는지를 보여 주는데, 뉴스 사이트에서의 뉴스 영상 소비 대 소셜 미디어를 통한 뉴스 영상 소비이다."]],"w":"1번은 도표가 사람들이 뉴스 영상을 뉴스 사이트에서 보는지 소셜 미디어로 보는지를 보여 준다는 내용이에요. 영상을 ‘시청하며 소비하는’ 방식이므로 consume = 소비하다예요. 제작·삭제·수출은 도표의 내용과 맞지 않아요.","c":2},"h":"89cfaa8045"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In four of the listed countries, consuming news videos on news sites is more popular…)","ko":"(…언급된 국가 중 네 국가에서, 뉴스 사이트에서의 뉴스 영상 소비는 더 인기가 있다…)","opts":["언급된","제외된","금지된","유명한"],"word":"listed","r":{"a":"1) 언급된","ev":"2번 문장","s":[[2,"In four of the listed countries, consuming news videos on news sites is more popular than consuming them via social media.","언급된 국가 중 네 국가에서, 뉴스 사이트에서의 뉴스 영상 소비는 소셜 미디어를 통한 소비보다 더 인기가 있다."]],"w":"2번의 the listed countries는 도표에 나열된 다섯 국가를 가리켜요. 그 가운데 네 국가에서의 경향을 말하므로 listed = 언급된(나열된)이에요. 제외된 국가라면 도표에 나오지 않아요.","c":1},"h":"97970c63ae"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nIn four of the listed countries, consuming news videos on news sites is more popular than consuming them via social media.","ko":"밑줄 친 them이 가리키는 것은?","sko":"언급된 국가 중 네 국가에서, 뉴스
