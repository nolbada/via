,"q":"In Toy Story 2, a globe rolls after Buzz Lightyear.","ko":"<토이 스토리 2>에서 지구본 하나가 버즈 라이트이어를 뒤따라 굴러간다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"For instance, in the movie Toy Story 2, a globe comes loose and rolls after Buzz Lightyear.","예를 들어, 영화 <토이 스토리 2>에서는 지구본 하나가 느슨해져 버즈 라이트이어를 뒤따라 굴러간다."]],"w":"8번에서 지구본이 느슨해져 버즈 라이트이어를 뒤따라 구른다고 해요(rolls after Buzz Lightyear).","c":"T"},"h":"c43a65cee1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It’s reminiscent of the scene from The Lion King!)","ko":"그것은 <라이온 킹>의 장면을 연상시킨다!","opts":["~와 관련 없는","~을 연상시키는","~을 비난하는","~을 숨기는"],"word":"reminiscent","r":{"a":"2) ~을 연상시키는","ev":"3번 문장","s":[[3,"It’s reminiscent of the scene from The Lion King!","그것은 <라이온 킹>의 장면을 연상시킨다!"]],"w":"2번에서 익숙해 보인다고 하고, 3번에서 <라이온 킹>의 장면이 떠오른다고 해요. reminiscent of = ~을 연상시키는.","c":2},"h":"67bfb04a4e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…it should involve a slight change from the original.)","ko":"…그것은 원작으로부터의 약간의 변화를 포함해야 한다.","opts":["엄청난","원치 않는","약간의","끝없는"],"word":"slight","r":{"a":"3) 약간의","ev":"7번 문장","s":[[7,"For a scene to be considered an homage, it should be a transparent reference, and it should involve a slight change from the original.","한 장면이 오마주로 간주되기 위해서 그것은 명백한 참조여야 하고, 원작으로부터의 약간의 변화를 포함해야 한다."]],"w":"7번은 오마주가 원작을 그대로 베끼지 않고 조금 바뀐 부분이 있어야 한다는 말이에요. a slight change = 약간의 변화.","c":3},"h":"fcaf3f164f"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is an artistic technique where creators show respect to previous works by intentionally referencing iconic moments.","ko":"밑줄 친 It이 가리키는 것은?","sko":"이것은 창작자들이 의도적으로 상징적인 순간들을 참조함으로써 이전 작품들에 대한 존중을 보여주는 예술적 기법이다.","opts":["표절","<라이온 킹>","오마주","원작자"],"r":{"a":"3) 오마주","ev":"5~6번 문장","s":[[5,"However, it’s actually an homage commonly seen in movies.","하지만, 이것은 영화에서 흔히 볼 수 있는 오마주이다."],[6,"It is an artistic technique where creators show respect to previous works by intentionally referencing iconic moments.","이것(오마주)은 창작자들이 의도적으로 상징적인 순간들을 참조함으로써 이전 작품들에 대한 존중을 보여주는 예술적 기법이다."]],"w":"6번의 It은 바로 앞 5번에서 말한 an homage(오마주)예요. 6번은 그 오마주가 어떤 기법인지 설명해요.","c":3},"h":"0ff1a3695b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Such homages can serve as little gifts for audiences who recognize the reference.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러한 오마주들은 그 참조를 인식하는 관객들에게 작은 선물로서 기능할 수 있다.","opts":["오마주는 관객에게 작은 선물을 나누어 주는 이벤트이다.","오마주는 관객이 참조를 알아볼 때 작은 선물 같은 즐거움이 될 수 있다.","오마주는 관객이 모르게 숨겨 두는 비밀이다.","오마주는 선물처럼 비싼 값에 팔리는 영화이다."],"r":{"a":"2) 오마주는 관객이 참조를 알아볼 때 작은 선물 같은 즐거움이 될 수 있다.","ev":"10번 문장","s":[[10,"Such homages can serve as little gifts for audiences who recognize the reference.","그러한 오마주들은 그 참조를 인식하는 관객들에게 작은 선물로서 기능할 수 있다."]],"w":"serve as little gifts는 '작은 선물 같은 역할을 한다'는 비유예요. 선물을 받는 사람은 참조를 알아보는 관객이에요. 실제 선물을 나눠 주는 것이 아니에요.","c":2},"h":"e62fa668f3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["익숙해 보이는 장면은 사실 영화에서 흔히 볼 수 있는 오마주이다.","익숙해 보이는 장면은 영화에서 좀처럼 볼 수 없는 오마주이다.","익숙해 보이는 장면은 <라이온 킹>에서 불법으로 베낀 것이다.","익숙해 보이는 장면은 감독이 저지른 실수이다."],"opts":["The familiar scene is actually an homage that is commonly seen in movies.","The familiar scene is an homage that is rarely seen in movies.","The familiar scene was illegally copied from The Lion King.","The familiar scene is a mistake made by the director."],"r":{"a":"1) The familiar scene is actually an homage that is commonly seen in movies. (익숙해 보이는 장면은 사실 영화에서 흔히 볼 수 있는 오마주이다.)","ev":"5번 문장","s":[[5,"However, it’s actually an homage commonly seen in movies.","하지만, 이것은 영화에서 흔히 볼 수 있는 오마주이다."]],"w":"5번에서 그 장면은 사실 영화에서 흔히 볼 수 있는(commonly seen) 오마주라고 해요. 좀처럼 볼 수 없다거나 불법 복사, 감독의 실수라는 말은 본문에 없어요.","c":1},"h":"46301ddf2f"},{"n":9,"t":"sum","q":"Some might say it’s (A)—completely stealing from another work without (B) to the original creator.","ko":"어떤 이들은 그것이 (A)(이)라고, 즉 원작자에게 (B)을(를) 돌리지 않고 다른 작품에서 완전히 훔치는 것이라고 말할 수도 있다.","oko":["(A) 표절 / (B) 공로","(A) 표절 / (B) 돈","(A) 오마주 / (B) 공로","(A) 오마주 / (B) 돈","(A) 참조 / (B) 돈"],"opts":["(A) plagiarism / (B) credit","(A) plagiarism / (B) money","(A) homage / (B) credit","(A) homage / (B) money","(A) reference / (B) money"],"r":{"a":"1) (A) plagiarism / (B) credit ((A) 표절 / (B) 공로)","ev":"4번 문장","s":[[4,"Some might say it’s plagiarism—completely stealing from another work without credit to the original creator.","어떤 이들은 그것이 원작자에게 공로를 돌리지 않고 다른 작품에서 완전히 훔치는 표절이라고 말할 수도 있다."]],"w":"4번에서 어떤 이들은 그것이 표절(plagiarism), 즉 원작자에게 공로(credit)를 돌리지 않고 다른 작품에서 완전히 훔치는 것이라고 말할 수도 있다고 해요. 오마주는 5번에서 그 말에 반대하며 나오는 개념이에요.","c":1},"h":"c233c4d7b7"},{"n":10,"t":"fill","q":"This moment is an homage to an Indiana Jones movie, where the main character [A] a [B] rolling rock.","ko":"이 순간은 주인공이 굴러오는 [B] 바위를 [A]은(는) <인디아나 존스> 영화에 대한 오마주이다.","bank":["escapes","huge","creators","audiences","respect","recognize"],"bko":{"escapes":"피하다(escape의 3인칭 단수)","huge":"거대한","creators":"창작자들","audiences":"관객들","respect":"존경","recognize":"알아보다"},"r":{"a":"[A] escapes (피하다(escape의 3인칭 단수)), [B] huge (거대한)","ev":"9번 문장","s":[[9,"This moment is an homage to an Indiana Jones movie, where the main character escapes a huge rolling rock.","이 순간은 주인공이 굴러오는 거대한 바위를 피하는 <인디아나 존스> 영화에 대한 오마주이다."]],"w":"9번에서 <인디아나 존스>의 주인공은 굴러오는 거대한(huge) 바위를 피해요(escapes). 나머지 단어는 이 빈칸에 넣으면 뜻이나 문법이 맞지 않아요.","c":null},"h":"9dec78095c"}]},{"u":6,"id":"ms2-06-4","no":4,"ko":"The Paycheck-to-Paycheck Paradox","items":[{"n":1,"t":"tf","q":"HENRY is an acronym that stands for “High Earners, Not Rich Yet.”","ko":"HENRY는 ‘고소득자들, 아직 부유하지 않은 사람들’을 나타내는 약어이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"That’s because HENRY is also an acronym that stands for “High Earners, Not Rich Yet!”","그것은 HENRY가 ‘고소득자들, 아직 부유하지 않은 사람들(High Earners, Not Rich Yet)!’을 나타내는 약어이기도 하기 때문이다."]],"w":"5번에서 HENRY는 High Earners, Not Rich Yet을 나타내는 약어라고 해요.","c":"T"},"h":"6308e0b6e2"},{"n":2,"t":"tf","q":"The acronym HENRY was created to describe a group of wealthy Europeans.","ko":"HENRY라는 약어는 부유한 유럽인 집단을 설명하기 위해 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"This acronym was invented in the early 2000s to describe a group of Americans with high-paying jobs who have not yet accumulated significant wealth.","이 약어는 2000년대 초반에 고소득 직업을 가졌지만 아직 상당한 부를 축적하지 못한 미국인 집단을 설명하기 위해 만들어졌다."]],"w":"6번에서 이 약어는 고소득 직업을 가졌지만 아직 부를 쌓지 못한 '미국인' 집단을 설명하려고 만들어졌어요. 부유한 유럽인이 아니에요.","c":"F"},"h":"e684709864"},{"n":3,"t":"tf","q":"Today, marketing professionals commonly use the term HENRY to describe a specific group of consumers.","ko":"오늘날 마케팅 전문가들은 특정 소비자 집단을 설명하기 위해 HENRY라는 용어를 흔히 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Today, it is commonly used by marketing professionals to describe a specific group of consumers.","오늘날, 그것은 특정 소비자 집단을 설명하기 위해 마케팅 전문가들에 의해 흔히 사용된다."]],"w":"7번에서 오늘날 마케팅 전문가들이 특정 소비자 집단을 설명하려고 이 말을 흔히 쓴다고 해요.","c":"T"},"h":"8bd4db4502"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…a group of Americans with high-paying jobs who have not yet accumulated significant wealth.)","ko":"…고소득 직업을 가졌지만 아직 상당한 부를 축적하지 못한 미국인 집단.","opts":["잃어버린","나눠 준","쌓아 모은","빌려 쓴"],"word":"accumulated","r":{"a":"3) 쌓아 모은","ev":"6번 문장","s":[[6,"This acronym was invented in the early 2000s to describe a group of Americans with high-paying jobs who have not yet accumulated significant wealth.","이 약어는 2000년대 초반에 고소득 직업을 가졌지만 아직 상당한 부를 축적하지 못한 미국인 집단을 설명하기 위해 만들어졌다."]],"w":"HENRY는 소득은 높지만 부를 '아직 쌓지 못한' 사람들이에요. accumulate = 축적하다, 쌓아 모으다.","c":3},"h":"3e22868c0f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…leaving no room to save or invest in assets like stocks and real estate.)","ko":"…저축이나 주식 및 부동산과 같은 자산 투자에 쓸 여유가 거의 없다.","opts":["자산","빚","세금","월급"],"word":"assets","r":{"a":"1) 자산","ev":"10번 문장","s":[[10,"Furthermore, as many of them live in high-cost cities like New York, where professionals are socially expected to maintain expensive lifestyles, they live paycheck to paycheck, leaving no room to save or invest in assets like stocks and real estate.","게다가, 그들 중 많은 사람들이 전문가들이 비싼 생활 방식을 유지할 것으로 사회적으로 기대되는 뉴욕과 같은 지출이 많은 도시에 살기 때문에, 수입이 들어오는 즉시 대부분을 지출하는 생활을 하며, 저축이나 주식 및 부동산과 같은 자산 투자에 쓸 여유가 거의 없다."]],"w":"assets like stocks and real estate는 주식과 부동산 같은 자산이에요. 돈이 남지 않아서 이런 자산에 투자할 여유가 없다는 말이에요.","c":1},"h":"9523e0d735"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nIn the end, companies that win them early may benefit as their earnings and spending power continue to grow over time.","ko":"밑줄 친 them이 가리키는 것은?","sko":"결국, 그들을 일찍부터 고객으로 확보한 기업은 시간이 지나면서 그들의 소득과 소비력이 계속 증가함에 따라 이익을 얻을 수 있을 것이다.","opts":["기업들","마케팅 전문가들","학자금 대출들","HENRY들"],"r":{"a":"4) HENRY들","ev":"12~13번 문장","s":[[12,"Provided they can keep their debt under control, continue their careers, and build up their savings, these individuals will probably be wealthy one day, even if they aren’t today.","만약 그들이 그들의 부채를 통제하에 유지하고, 그들의 경력을 지속하고, 그들의 저축을 늘릴 수 있다면, 이러한 개인들은 오늘날은 아니더라도 언젠가는 아마도 부유해질 것이다."],[13,"In the end, companies that win them early may benefit as their earnings and spending power continue to grow over time.","결국, 그들을 일찍부터 고객으로 확보한 기업은 시간이 지나면서 그들의 소득과 소비력이 계속 증가함에 따라 이익을 얻을 수 있을 것이다."]],"w":"13번의 them은 12번의 these individuals, 곧 HENRY들이에요. 이들이 앞으로 부유해지면 소득과 소비력이 커지므로, 일찍 고객으로 확보한 기업이 이익을 얻어요.","c":4},"h":"5ad17c5de6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While monthly budgets can be large, most of them are eaten up by expenses such as student debt or rent.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"월별 예산은 클 수 있는 반면, 그것들 중 대부분은 학자금 대출 또는 임대료와 같은 비용으로 소진된다.","opts":["월 예산은 크지만, 대부분이 학자금 대출이나 월세 같은 비용으로 사라진다.","월 예산이 작아서, 학자금 대출이나 월세를 낼 수 없다.","월 예산이 크므로, 학자금 대출이나 월세를 걱정할 필요가 없다.","월 예산 대부분을 저축해서, 학자금 대출을 빨리 갚는다."],"r":{"a":"1) 월 예산은 크지만, 대부분이 학자금 대출이나 월세 같은 비용으로 사라진다.","ev":"9번 문장","s":[[9,"While monthly budgets can be large, most of them are eaten up by expenses such as student debt or rent.","월별 예산은 클 수 있는 반면, 그것들 중 대부분은 학자금 대출 또는 임대료와 같은 비용으로 소진된다."]],"w":"While은 '~이지만'으로, 예산이 클 수 있다는 앞부분과 대부분이 비용으로 사라진다는 뒷부분이 대비돼요. eaten up은 다 써서 없어진다는 뜻이에요.","c":1},"h":"548786841a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["HENRY들은 대체로 은퇴를 앞둔 고령층이다.","HENRY들은 대체로 학력이 높고 경력 초기에 있는 사람들이다.","HENRY들은 대체로 학력은 낮지만 소득은 높은 사람들이다.","HENRY들은 대체로 생활비가 낮은 시골에 산다."],"opts":["HENRYs are mostly older people close to retirement.","HENRYs are generally highly educated people in the early stages of their careers.","HENRYs are generally people with little education but high pay.","HENRYs mostly live in low-cost rural areas."],"r":{"a":"2) HENRYs are generally highly educated people in the early stages of their careers.","ev":"8번 문장","s":[[8,"In general, HENRYs are highly educated people who are early in their careers.","일반적으로, HENRY들은 그들의 경력 초기에 있는 고학력자들이다."]],"w":"8번에서 HENRY들은 고학력이고(highly educated) 경력 초기에 있는 사람들이라고 해요. 고령층이나 학력이 낮은 사람이라는 말은 없고, 10번에서는 뉴욕처럼 지출이 많은 도시에 산다고 해요.","c":2},"h":"462c1aaf49"},{"n":9,"t":"sum","q":"HENRYs have high (A) and are willing to spend on (B) goods, so they are attractive targets for marketers.","ko":"HENRY들은 높은 (A)이(가) 있고 (B) 상품에 지출할 의향이 있어서 마케터들에게 매력적인 대상이다.","oko":["(A) 소득 / (B) 고급","(A) 소득 / (B) 저렴한","(A) 빚 / (B) 고급","(A) 빚 / (B) 저렴한","(A) 세금 / (B) 저렴한"],"opts":["(A) incomes / (B) luxury","(A) incomes / (B) cheap","(A) debts / (B) luxury","(A) debts / (B) cheap","(A) taxes / (B) cheap"],"r":{"a":"1) (A) incomes / (B) luxury ((A) 소득 / (B) 고급)","ev":"11번 문장","s":[[11,"Still, due to their high incomes and willingness to spend on luxury goods and services to maintain their lifestyles, HENRYs are attractive targets for marketers.","그럼에도 불구하고, 그들의 높은 소득과 그들의 생활 방식을 유지하기 위해 고급 상품과 서비스에 지출할 의지 때문에, HENRY들은 마케터들에게 매력적인 대상이다."]],"w":"11번에서 HENRY들은 높은 소득(incomes)과 고급(luxury) 상품과 서비스에 지출할 의지 때문에 마케터들에게 매력적인 대상이라고 해요.","c":1},"h":"62b8d9b5a0"},{"n":10,"t":"fill","q":"When the name [A] through the room, dozens of [B] turned.","ko":"그 이름이 방 안에 [A]. 그러자 수십 개의 [B]이(가) 돌아갔다.","bank":["echoed","heads","invented","accumulated","rent","debt"],"bko":{"echoed":"울려 퍼졌다(echo의 과거)","heads":"머리들","invented":"발명했다(invent의 과거)","accumulated":"축적했다(accumulate의 과거)","rent":"임대료","debt":"빚"},"r":{"a":"[A] echoed (울려 퍼졌다(echo의 과거)), [B] heads (머리들)","ev":"2번 문장","s":[[2,"When the name echoed through the room, dozens of heads turned.","그 이름이 방 안에 울려 퍼지자, 수십 개의 머리가 돌아갔다."]],"w":"2번은 그 이름이 방 안에 울려 퍼지자(echoed) 수십 개의 머리(heads)가 돌아갔다는 내용이에요. 나머지 단어는 이 빈칸에 넣으면 뜻이나 문법이 맞지 않아요.","c":null},"h":"45124317eb"}]},{"u":7,"id":"ms2-07-1","no":1,"ko":"하늘의 별 딸래, 체조에서 만점 딸래","items":[{"n":1,"t":"tf","q":"The first perfect score in gymnastics was given in the 1970s.","ko":"체조에서 최초의 만점은 1970년대에 주어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In 1976, Nadia Comaneci received the first perfect score in gymnastics.","1976년, 나디아 코마네치는 체조에서 최초의 만점을 받았다."]],"w":"1번에서 1976년에 코마네치가 최초의 만점을 받았다고 해요. 1976년은 1970년대이므로 맞는 내용이에요.","c":"T"},"h":"f1ce7fbe07"},{"n":2,"t":"tf","q":"The International Gymnastics Federation solved the problem by keeping the old scoring system.","ko":"국제체조연맹은 옛 채점 시스템을 그대로 유지함으로써 문제를 해결했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The International Gymnastics Federation addressed this problem in 2006 by changing the scoring system.","국제체조연맹은 2006년에 채점 시스템을 변경함으로써 이 문제를 해결했다."]],"w":"6번에서 연맹은 채점 시스템을 '변경함으로써(by changing)' 문제를 해결했어요. 그대로 유지했다는 말은 반대예요.","c":"F"},"h":"e77d9a78e6"},{"n":3,"t":"tf","q":"Some people think the new system is harder for spectators to understand.","ko":"일부 사람들은 새 시스템이 관중이 이해하기 더 어렵다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Some people have criticized the new system because it is harder for spectators to understand what makes a strong score, whereas before, it was clear that a score of 10 was perfect.","일부 사람들은 이 새로운 시스템을 비판해왔는데, 이는 이전에는 10점이 만점이라는 것이 분명했던 것과 달리, 관중들이 무엇이 높은 점수를 만드는지 이해하는 것이 더 어렵기 때문이다."]],"w":"9번에서 일부 사람들이 새 시스템을 비판하는 이유가 관중이 무엇이 높은 점수를 만드는지 이해하기 더 어렵기 때문이라고 해요.","c":"T"},"h":"7d1fd911d8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Those who performed complicated routines with minor errors received lower scores.)","ko":"(사소한 실수가 있는 복잡한 루틴을 수행한 선수들은 더 낮은 점수를 받았다.)","opts":["단순한","복잡한","짧은","새로운"],"word":"complicated","r":{"a":"2) 복잡한","ev":"5번 문장","s":[[5,"Those who completed easier routines cleanly got higher scores, while those who performed complicated routines with minor errors received lower scores.","더 쉬운 루틴을 깔끔하게 마친 선수들은 더 높은 점수를 받은 반면, 사소한 실수가 있는 복잡한 루틴을 수행한 선수들은 더 낮은 점수를 받았다."]],"w":"5번은 쉬운 루틴(easier routines)과 대조되는 루틴이에요. 어려운 동작이 많은 루틴이라서 complicated = 복잡한이에요. 단순한이라면 쉬운 루틴과 대조가 되지 않아요.","c":2},"h":"5e761ea831"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... it encourages gymnasts to innovate and take risks.)","ko":"(... 그것은 체조선수들이 혁신하고 위험을 감수하도록 장려한다.)","opts":["포기하다","모방하다","연기하다","혁신하다"],"word":"innovate","r":{"a":"4) 혁신하다","ev":"10번 문장","s":[[10,"But others say that it encourages gymnasts to innovate and take risks, which helps the sport advance.","그러나 다른 사람들은 그것이 체조선수들이 혁신하고 위험을 감수하도록 장려하며, 이는 그 스포츠가 발전하는 데 도움을 준다고 말한다."]],"w":"innovate는 take risks(위험을 감수하다)와 함께 장려되는 일이에요. 새로운 것을 시도해 바꾸는 것이므로 '혁신하다'예요. 모방하다는 새로운 시도의 반대라서 어울리지 않아요.","c":4},"h":"925c4bb010"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nGymnasts still receive an execution score out of 10, but they also get a difficulty score that does not have a limit.","ko":"밑줄 친 they가 가리키는 것은?","sko":"체조선수들은 여전히 10점 만점의 실행 점수를 받지만, 그들은 또한 제한이 없는 난도 점수도 받는다.","opts":["체조선수들","국제체조연맹","관중들","코마네치"],"r":{"a":"1) 체조선수들","ev":"7번 문장","s":[[7,"Gymnasts still receive an execution score out of 10, but they also get a difficulty score that does not have a limit.","체조선수들은 여전히 10점 만점의 실행 점수를 받지만, 그들은 또한 제한이 없는 난도 점수도 받는다."]],"w":"but 앞뒤의 주어가 같아요. 실행 점수를 '받는' 주어가 Gymnasts이고, they도 같은 선수들을 가리켜요. 난도 점수를 주는 연맹이나 지켜보는 관중이 아니에요.","c":1},"h":"72ead39f15"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This system encouraged gymnasts to play it safe.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 시스템은 체조선수들이 안전하게 경기하도록 장려했다.","opts":["이 시스템은 선수들이 관중을 즐겁게 하도록 이끌었다.","이 시스템은 선수들이 위험한 동작에 도전하도록 이끌었다.","이 시스템은 선수들이 위험한 동작을 피하고 안전한 선택을 하도록 이끌었다.","이 시스템은 선수들이 다치지 않도록 안전 장비를 쓰게 했다."],"r":{"a":"3) 이 시스템은 선수들이 위험한 동작을 피하고 안전한 선택을 하도록 이끌었다.","ev":"4번 문장","s":[[4,"This system encouraged gymnasts to play it safe.","이 시스템은 체조선수들이 안전하게 경기하도록 장려했다."]],"w":"play it safe는 '위험을 피하고 안전하게 하다'라는 뜻이에요. encourage ~ to-v는 '~하도록 장려하다'이므로 옛 시스템이 선수들을 안전한 쪽으로 이끌었다는 말이에요. 안전 장비 이야기는 아니에요.","c":3},"h":"448f39be92"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["올림픽 역사를 쓴 체조선수는 14세였고 러시아 출신이었다.","올림픽 역사를 쓴 체조선수는 14세였고 루마니아 출신이었다.","올림픽 역사를 쓴 체조선수는 24세였고 루마니아 출신이었다.","올림픽 역사를 쓴 체조선수는 2006년에 만점을 잃었다."],"opts":["The gymnast who made Olympic history was 14 years old and from Russia.","The gymnast who made Olympic history was 14 years old and from Romania.","The gymnast who made Olympic history was 24 years old and from Romania.","The gymnast who made Olympic history lost her perfect score in 2006."],"r":{"a":"2) The gymnast who made Olympic history was 14 years old and from Romania.","ev":"2번 문장","s":[[2,"With this achievement, the 14-year-old Romanian gymnast made Olympic history!","이 성취로, 14세의 루마니아 체조선수는 올림픽 역사를 썼다!"]],"w":"2번에서 올림픽 역사를 쓴 선수는 14세의 루마니아(Romanian) 체조선수라고 해요. 나이나 나라를 바꾼 선지는 본문과 달라요.","c":2},"h":"3a16e81fa4"},{"n":9,"t":"sum","q":"Under the scoring system applied to Comaneci, gymnasts were (A) a single score out of 10 based on how well their routine was (B).","ko":"코마네치에게 적용된 채점 시스템 하에서 체조선수들은 루틴이 얼마나 잘 (B)되었는지에 따라 10점 만점의 단일 점수를 (A).","oko":["(A) 부여받았다 / (B) 실행","(A) 부여받았다 / (B) 무시","(A) 거부당했다 / (B) 실행","(A) 거부당했다 / (B) 무시","(A) 거부당했다 / (B) 모방"],"opts":["(A) awarded / (B) executed","(A) awarded / (B) ignored","(A) denied / (B) executed","(A) denied / (B) ignored","(A) denied / (B) copied"],"r":{"a":"1) (A) awarded / (B) executed ((A) 부여받았다 / (B) 실행)","ev":"3번 문장","s":[[3,"Under the scoring system applied to Comaneci, gymnasts were awarded a single score out of 10 based on how well their routine was executed.","코마네치에게 적용된 채점 시스템 하에서 체조선수들은 그들의 루틴이 얼마나 잘 실행되었는지에 기초하여 10점 만점의 단일 점수를 부여받았다."]],"w":"3번에서 체조선수들은 루틴이 얼마나 잘 실행되었는지(executed)에 기초해 10점 만점의 단일 점수를 부여받았다(were awarded)고 해요.","c":1},"h":"a56622f3a3"},{"n":10,"t":"fill","q":"A perfect score is now [A] to [B]!","ko":"만점은 이제 [B]은(는) 것이 [A] 일이다!","bank":["impossible","achieve","spectators","gymnasts","system","routine"],"bko":{"impossible":"불가능한","achieve":"달성하다","spectators":"관중들","gymnasts":"체조선수들","system":"시스템","routine":"루틴"},"r":{"a":"[A] impossible (불가능한), [B] achieve (달성하다)","ev":"8번 문장","s":[[8,"A perfect score is now impossible to achieve!","만점을 받는 것은 이제 불가능하다!"]],"w":"8번은 만점을 받는 것이 이제 달성하기 불가능하다(impossible to achieve)는 내용이에요. 나머지 단어는 명사라서 이 빈칸에 넣으면 문법이 맞지 않아요.","c":null},"h":"17dbf44b7e"}]},{"u":7,"id":"ms2-07-2","no":2,"ko":"튀면 살아남는다!","items":[{"n":1,"t":"tf","q":"The Von Restorff effect is also called the isolation effect.","ko":"폰 레스토프 효과는 고립 효과라고도 불린다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Also known as the isolation effect, it was first described by the German psychologist Hedwig von Restorff in 1933.","고립 효과라고도 알려진 그것은 1933년에 독일 심리학자 헤드비히 폰 레스토프에 의해 처음으로 기술되었다."]],"w":"4번에서 Also known as the isolation effect, 즉 고립 효과라고도 알려져 있다고 해요.","c":"T"},"h":"d8ec945379"},{"n":2,"t":"tf","q":"When people see a distinctive item, they usually spend less time on it than usual.","ko":"사람들은 독특한 항목을 볼 때 보통 평소보다 그것에 더 적은 시간을 쓴다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"And once this happens, we tend to spend more time focusing on the distinctive item than usual.","그리고 일단 이런 일이 일어나면, 우리는 평소보다 그 독특한 항목에 집중하는 데 더 많은 시간을 보내는 경향이 있다."]],"w":"7번에서 독특한 항목에 평소보다 '더 많은(more)' 시간을 집중하는 경향이 있다고 해요. 더 적은 시간이라는 말은 반대예요.","c":"F"},"h":"21ff5fed30"},{"n":3,"t":"tf","q":"Toblerone’s triangular shape makes it different from ordinary rectangular chocolate bars.","ko":"토블론의 삼각형 모양은 그것을 평범한 직사각형 초콜릿 바와 다르게 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"Similarly, Toblerone chocolate has a distinct triangular shape, which sets it apart from conventional rectangular chocolate bars.","이와 유사하게, 토블론 초콜릿은 독특한 삼각형 모양을 가지고 있는데, 그것은 전통적인 직사각형 초콜릿 바들과 그것을 구별시킨다."]],"w":"13번에서 독특한 삼각형 모양이 토블론을 전통적인 직사각형 초콜릿 바와 구별시킨다고 해요.","c":"T"},"h":"e4e2d54d9a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... when an item in a group is noticeably distinguishable from the others, ...)","ko":"(... 집단 내의 한 항목이 다른 것들과 눈에 띄게 구별될 때, ...)","opts":["조용히","빠르게","눈에 띄게","우연히"],"word":"noticeably","r":{"a":"3) 눈에 띄게","ev":"5번 문장","s":[[5,"She demonstrated that when an item in a group is noticeably distinguishable from the others, it is more likely to be remembered.","그녀는 집단 내의 한 항목이 다른 것들과 눈에 띄게 구별될 때, 그것이 기억될 가능성이 더 높다는 것을 입증했다."]],"w":"noticeably distinguishable은 '눈에 띄게 구별되는'이라는 뜻이에요. 눈에 띄게 달라야 기억된다는 흐름이므로 '눈에 띄게'가 맞아요.","c":3},"h":"ca632453da"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... combine to increase the likelihood of a long-term memory being formed.)","ko":"(... 결합하여 장기 기억이 형성될 가능성을 증가시킨다.)","opts":["속도","가능성","비용","기간"],"word":"likelihood","r":{"a":"2) 가능성","ev":"8번 문장","s":[[8,"Both of these factors combine to increase the likelihood of a long-term memory being formed.","이 두 가지 요인이 모두 결합하여 장기 기억이 형성될 가능성을 증가시킨다."]],"w":"두 요인이 합쳐져 장기 기억이 만들어질 '가능성'을 높인다는 뜻이에요. 앞 5번의 is more likely to(~할 가능성이 높다)와 같은 계열의 낱말이에요.","c":2},"h":"0c143b7d4d"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen most earphones were black or gray, the visual contrast of Apple’s bright white earbuds made them instantly recognizable.","ko":"밑줄 친 them이 가리키는 것은?","sko":"대부분의 이어폰이 검은색이나 회색이었을 때, 애플의 밝은 하얀색 이어버드의 시각적 대조는 그것들을 즉시 알아볼 수 있게 만들었다.","opts":["애플의 밝은 하얀색 이어버드","대부분의 이어폰들","검은색이나 회색 이어버드","기업들"],"r":{"a":"1) 애플의 밝은 하얀색 이어버드","ev":"11번 문장","s":[[11,"When most earphones were black or gray, the visual contrast of Apple’s bright white earbuds made them instantly recognizable.","대부분의 이어폰이 검은색이나 회색이었을 때, 애플의 밝은 하얀색 이어버드의 시각적 대조는 그것들을 즉시 알아볼 수 있게 만들었다."]],"w":"made them instantly recognizable은 '그것들을 즉시 알아볼 수 있게 만들었다'예요. 알아보기 쉬워진 것은 시각적 대조를 만든 애플의 하얀 이어버드예요. 검은색·회색 이어폰은 비교 대상이에요.","c":1},"h":"98c748bc7b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Von Restorff effect is related to how our brains are wired to gather information—when something stands out, our attention is automatically drawn to it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"폰 레스토프 효과는 우리의 뇌가 정보를 수집하게 되어 있는 방식과 관련이 있는데, 무언가가 두드러질 때, 우리의 주의는 자동적으로 그것에 끌리도록 되어 있다.","opts":["폰 레스토프 효과 때문에 우리는 두드러진 것을 일부러 피하고 다른 곳을 보게 된다.","폰 레스토프 효과는 정보를 많이 모을수록 두드러지는 항목이 생긴다는 뜻이다.","뇌가 한 항목에 오래 집중해야만 그 항목이 두드러져 보인다는 것이다.","폰 레스토프 효과는 뇌가 정보를 모으는 방식과 관련 있고, 무언가가 두드러지면 우리 주의가 저절로 그쪽으로 끌린다."],"r":{"a":"4) 폰 레스토프 효과는 뇌가 정보를 모으는 방식과 관련 있고, 무언가가 두드러지면 우리 주의가 저절로 그쪽으로 끌린다.","ev":"6번 문장","s":[[6,"The Von Restorff effect is related to how our brains are wired to gather information —when something stands out, our attention is automatically drawn to it.","폰 레스토프 효과는 우리의 뇌가 정보를 수집하게 되어 있는 방식과 관련이 있는데, 무언가가 두드러질 때, 우리의 주의는 자동적으로 그것에 끌리도록 되어 있다."]],"w":"how our brains are wired to gather information은 뇌가 정보를 모으도록 되어 있는 방식이고, 대시 뒤는 두드러진 것에 주의가 자동으로 끌린다는 설명이에요. 선지 3·4는 원인과 결과를 뒤집었고, 선지 2는 정반대예요.","c":4},"h":"41fb41ee3a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["시각적으로 달라 보이는 것은 브랜드가 붐비는 시장에서 쉽게 알아볼 수 있고 기억에 남게 되도록 돕는다.","다른 브랜드와 똑같이 보이는 것은 브랜드가 붐비는 시장에서 기억에 남게 되도록 돕는다.","시각적 고립은 브랜드가 붐비는 시장에서 알아보기 어렵게 만든다.","붐비는 시장은 브랜드가 얼마나 기억에 남는지와 아무 관련이 없다."],"opts":["Looking visually different helps a brand become easily identifiable and memorable in a crowded marketplace.","Looking the same as other brands helps a brand become memorable in a crowded marketplace.","Visual isolation makes a brand hard to identify in a crowded marketplace.","A crowded marketplace has nothing to do with how memorable a brand is."],"r":{"a":"1) Looking visually different helps a brand become easily identifiable and memorable in a crowded marketplace. (시각적으로 달라 보이는 것은 브랜드가 붐비는 시장에서 쉽게 알아볼 수 있고 기억에 남게 되도록 돕는다.)","ev":"12번 문장","s":[[12,"This visual isolation makes the brand easily identifiable and memorable in a crowded marketplace.","이 시각적 고립은 붐비는 시장에서 그 브랜드를 쉽게 알아볼 수 있고 기억에 남게 만든다."]],"w":"12번에서 시각적 고립(visual isolation)은 붐비는 시장에서 브랜드를 쉽게 알아볼 수 있고 기억에 남게 만든다고 해요. 똑같이 보이는 것이 도움이 된다거나 알아보기 어렵게 만든다는 말은 본문과 반대예요.","c":1},"h":"05768e39b9"},{"n":9,"t":"sum","q":"Many (A) have utilized the Von Restorff effect for (B) purposes.","ko":"많은 (A)이(가) 폰 레스토프 효과를 (B) 목적으로 이용해 왔다.","oko":["(A) 기업들 / (B) 브랜딩","(A) 기업들 / (B) 요리","(A) 학생들 / (B) 브랜딩","(A) 학생들 / (B) 요리","(A) 의사들 / (B) 요리"],"opts":["(A) companies / (B) branding","(A) companies / (B) cooking","(A) students / (B) branding","(A) students / (B) cooking","(A) doctors / (B) cooking"],"r":{"a":"1) (A) companies / (B) branding ((A) 기업들 / (B) 브랜딩)","ev":"9번 문장","s":[[9,"Many companies have utilized the Von Restorff effect for branding purposes.","많은 기업이 브랜딩 목적을 위해 폰 레스토프 효과를 이용해 왔다."]],"w":"9번에서 많은 기업(companies)이 브랜딩(branding) 목적을 위해 폰 레스토프 효과를 이용해 왔다고 해요.","c":1},"h":"0d44fff3ad"},{"n":10,"t":"fill","q":"Which one do you still [A]? If it is “COZ,” you’re [B] the Von Restorff effect.","ko":"어떤 것이 여전히 [A]는가? 만약 그것이 “COZ”라면, 당신은 폰 레스토프 효과를 [B] 것이다.","bank":["remember","experiencing","utilized","identifiable","isolation","likelihood"],"bko":{"remember":"기억하다","experiencing":"경험하고 있는(experience의 -ing형)","utilized":"이용된(utilize의 과거분사)","identifiable":"알아볼 수 있는","isolation":"고립","likelihood":"가능성"},"r":{"a":"[A] remember (기억하다), [B] experiencing (경험하고 있는(experience의 -ing형))","ev":"2~3번 문장","s":[[2,"Which one do you still remember?","어떤 것이 여전히 기억나는가?"],[3,"If it is “COZ,” you’re experiencing the Von Restorff effect.","만약 그것이 \"COZ\"라면, 당신은 폰 레스토프 효과를 경험하고 있는 것이다."]],"w":"2번은 어떤 것이 여전히 기억나는지(remember) 묻고, 3번은 그것이 COZ라면 폰 레스토프 효과를 경험하고 있는(experiencing) 것이라고 해요. 나머지 단어는 이 빈칸에 넣으면 뜻이나 문법이 맞지 않아요.","c":null},"h":"e2fd2f0273"}]},{"u":7,"id":"ms2-07-3","no":3,"ko":"이발사의 손에 메스가?","items":[{"n":1,"t":"tf","q":"The passage says people in the Middle Ages would probably go to their barber when they were injured.","ko":"글에 따르면 중세 사람들은 부상을 당하면 아마 이발사에게 갔을 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Strange as it may seem, you would probably visit the same person that cut your hair— your barber.","이상하게 보일지 모르지만, 당신은 아마도 당신의 머리카락을 잘라 주는 바로 그 사람, 즉 당신의 이발사를 방문할 것이다."]],"w":"3번에서 부상을 당하면 머리카락을 잘라 주는 바로 그 사람, 즉 이발사를 방문할 것이라고 해요.","c":"T"},"h":"07ee64fb86"},{"n":2,"t":"tf","q":"A 1745 English law joined barbers and surgeons into one guild.","ko":"1745년 영국 법은 이발사와 외과의를 하나의 길드로 합쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Although the modernization of medicine— beginning with a 1745 English law splitting barbers and surgeons into separate guilds— eventually eliminated the medical role of barbers, you can still see its influence today.","비록 1745년 이발사와 외과의를 별도의 길드로 분리한 영국 법으로 시작된 의학의 현대화가 결국 이발사의 의료적 역할을 제거했지만, 당신은 여전히 오늘날 그것의 영향을 볼 수 있다."]],"w":"10번에서 1745년 영국 법은 이발사와 외과의를 '별도의(separate)' 길드로 나누었다고 해요. 하나로 합쳤다는 말은 반대예요.","c":"F"},"h":"aab71b850d"},{"n":3,"t":"tf","q":"Before taking on medical work, barbers shaved clients and trimmed their hair and nails.","ko":"의료 일을 맡기 전에 이발사들은 고객을 면도하고 머리카락과 손톱을 다듬었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Why did their role expand beyond shaving clients and trimming their hair and nails?","왜 그들의 역할이 고객을 면도하고 그들의 머리카락과 손톱을 다듬는 것을 넘어 확장되었을까?"]],"w":"5번에서 이발사의 역할이 고객을 면도하고 머리카락과 손톱을 다듬는 것을 넘어 확장되었다고 해요. 그러므로 원래 일은 면도와 다듬기였어요.","c":"T"},"h":"6e377bc15b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... barbers, who skillfully used sharp instruments daily, began to provide these medical services ...)","ko":"(... 매일 날카로운 도구들을 능숙하게 사용하는 이발사들이 이러한 의료 서비스들을 제공하기 시작했다.)","opts":["서툴게","능숙하게","우연히","느리게"],"word":"skillfully","r":{"a":"2) 능숙하게","ev":"7번 문장","s":[[7,"Consequently, barbers, who skillfully used sharp instruments daily, began to provide these medical services instead of them.","결과적으로, 매일 날카로운 도구들을 능숙하게 사용하는 이발사들이 그들 대신에 이러한 의료 서비스들을 제공하기 시작했다."]],"w":"날카로운 도구를 매일 쓰던 이발사가 의료를 맡을 수 있었던 이유이므로 '능숙하게'가 맞아요. 서툴게라면 의료를 맡길 이유가 되지 않아요.","c":2},"h":"be4f69b72d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... considering it a form of manual labor that was beneath their dignity.)","ko":"(... 수술을 그들의 품위 아래에 있는 육체 노동의 한 형태로 여기며.)","opts":["품위","재산","기술","건강"],"word":"dignity","r":{"a":"1) 품위","ev":"6번 문장","s":[[6,"It was because the highly educated doctors of the time refused to perform surgery, considering it a form of manual labor that was beneath their dignity.","그것은 그 당시의 고학력 의사들이 수술을 그들의 품위 아래에 있는 육체 노동의 한 형태로 여기며 집도하기를 거부했기 때문이었다."]],"w":"의사들이 수술을 육체 노동으로 여겨 거부한 까닭은 그 일이 자신들의 '품위' 아래에 있다고 보았기 때문이에요. beneath는 '~ 아래에 있는'이라는 뜻이에요.","c":1},"h":"a4d8173022"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAs a result, barbers came to be known as barber-surgeons, and they formed organizations called guilds, with many rules to control their profession.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그 결과, 이발사들은 이발사-외과의로 알려지게 되었고, 그들은 그들의 직업을 통제하기 위한 많은 규칙을 가진 길드라고 불리는 조직을 형성했다.","opts":["고객들","고학력 의사들","이발사들","길드의 규칙들"],"r":{"a":"3) 이발사들","ev":"8번 문장","s":[[8,"As a result, barbers came to be known as barber-surgeons, and they formed organizations called guilds, with many rules to control their profession.","그 결과, 이발사들은 이발사-외과의로 알려지게 되었고, 그들은 그들의 직업을 통제하기 위한 많은 규칙을 가진 길드라고 불리는 조직을 형성했다."]],"w":"and 앞의 주어 barbers를 they가 이어받아요. 조직(길드)을 만든 것은 이발사-외과의가 된 이발사들이에요. 의사들은 수술을 거부한 쪽이에요.","c":3},"h":"fd06a2c214"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When you got injured, who would you go to for help?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 부상을 당했을 때, 당신은 도움을 청하러 누구에게 가겠는가?","opts":["다쳤을 때 누구한테 도움을 받으러 가겠느냐는 질문이다.","다쳤을 때 누가 당신을 도와주러 올지 묻는 질문이다.","다친 사람이 누구인지 묻는 질문이다.","도움이 필요할 때는 아무에게도 가지 말라는 말이다."],"r":{"a":"1) 다쳤을 때 누구한테 도움을 받으러 가겠느냐는 질문이다.","ev":"2번 문장","s":[[2,"When you got injured, who would you go to for help?","당신이 부상을 당했을 때, 당신은 도움을 청하러 누구에게 가겠는가?"]],"w":"2번은 \"부상을 당했을 때 도움을 청하러 누구에게 가겠는가?\"라고 묻는 문장이에요. go to ~ for help는 도움을 청하러 ~에게 간다는 뜻이에요.","c":1},"h":"d553a6e7f9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["누구나 훈련 없이 이발사-외과의가 될 수 있었다.","이발사-외과의들은 몇 년 동안 환자들과 함께 훈련했다.","수술을 공부한 의사들만 길드에 가입할 수 있었다.","이발사-외과의가 되려면 자격을 갖춘 구성원과 함께 몇 년의 훈련이 필요했다."],"opts":["Anyone could become a barber-surgeon without any training.","Barber-surgeons trained for several years with their patients.","Only doctors who had studied surgery could join the guilds.","Becoming a barber-surgeon required several years of training with a qualified member."],"r":{"a":"4) Becoming a barber-surgeon required several years of training with a qualified member.","ev":"9번 문장","s":[[9,"For example, anyone who wanted to be a barber-surgeon had to train for several years with a qualified member.","예를 들어, 이발사-외과의가 되기를 원하는 사람은 누구나 자격을 갖춘 구성원과 함께 몇 년 동안 훈련해야 했다."]],"w":"9번에서 이발사-외과의가 되려면 자격을 갖춘 구성원과 몇 년 훈련해야 했어요. 훈련 없이 될 수 있다는 말이나 환자와 훈련했다는 말, 의사만 가입했다는 말은 본문에 없어요.","c":4},"h":"a0b5e5863a"},{"n":9,"t":"sum","q":"In the 11th century AD, barbers in Europe treated (A) and pulled out (B).","ko":"서기 11세기에, 유럽의 이발사들은 (A)을(를) 치료하고 (B)을(를) 뽑았다.","oko":["(A) 상처 / (B) 이","(A) 상처 / (B) 머리카락","(A) 옷 / (B) 이","(A) 옷 / (B) 머리카락","(A) 책 / (B) 이"],"opts":["(A) wounds / (B) teeth","(A) wounds / (B) hair","(A) clothes / (B) teeth","(A) clothes / (B) hair","(A) books / (B) teeth"],"r":{"a":"1) (A) wounds / (B) teeth ((A) 상처 / (B) 이)","ev":"4번 문장","s":[[4,"In the 11th century AD, barbers in Europe treated wounds and pulled out teeth.","서기 11세기에, 유럽의 이발사들은 상처를 치료하고 이를 뽑았다."]],"w":"4번에서 11세기 유럽의 이발사들은 상처(wounds)를 치료하고 이(teeth)를 뽑았다고 해요. 머리카락을 뽑았다는 말은 없고, 옷이나 책을 치료한다는 것도 말이 안 돼요.","c":1},"h":"4e85efdb05"},{"n":10,"t":"fill","q":"The white stripe of a modern barber’s pole represents [A], and the red stripe symbolizes [B] blood.","ko":"현대 이발소 기둥의 흰색 줄무늬는 [A]을(를) 나타내고, 빨간색 줄무늬는 [B]의 피를 상징한다.","bank":["bandages","arterial","surgery","guilds","dignity","influence"],"bko":{"bandages":"붕대","arterial":"동맥의","surgery":"수술","guilds":"길드","dignity":"품위","influence":"영향"},"r":{"a":"[A] bandages, [B] arterial","ev":"11번 문장","s":[[11,"Most notably, the white stripe of a modern barber’s pole represents bandages, while the ones with red and blue symbolize arterial and venous blood, respectively.","가장 주목할 만한 것은, 현대 이발소 기둥의 흰색 줄무늬는 붕대를 나타내는 반면, 빨간색과 파란색 줄무늬는 각각 동맥과 정맥의 피를 상징한다."]],"w":"11번에서 흰색 줄무늬는 붕대(bandages)를 나타내고, 빨간색과 파란색은 각각(respectively) 동맥의(arterial) 피와 정맥의(venous) 피를 상징해요. 빨간색은 순서대로 동맥이에요. 다른 단어는 줄무늬나 피와 뜻이 맞지 않아요.","c":null},"h":"ba2e00ffff"}]},{"u":7,"id":"ms2-07-4","no":4,"ko":"Being Ugly Doesn’t Mean Being Yucky","items":[{"n":1,"t":"tf","q":"Some food is lost before it reaches consumers.","ko":"일부 식품은 소비자에게 도달하기도 전에 손실된다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Moreover, 13 percent of food is lost before it even reaches consumers.","게다가, 13퍼센트의 식품이 소비자에게 도달하기도 전에 손실된다."]],"w":"2번에서 13퍼센트의 식품이 소비자에게 도달하기도 전에 손실된다고 해요.","c":"T"},"h":"00afa93ae4"},{"n":2,"t":"tf","q":"After the first event, fewer than ten more events were held.","ko":"첫 행사 이후 열린 추가 행사는 열 개도 되지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Following this successful launch, more than 50 additional events have been held worldwide.","이 성공적인 시작 이후, 50개가 넘는 추가 행사들이 전 세계적으로 개최되어 왔다."]],"w":"11번에서 첫 행사 이후 50개가 넘는(more than 50) 추가 행사가 전 세계에서 열렸다고 해요. 열 개도 되지 않았다는 말은 반대예요.","c":"F"},"h":"c66efcee94"},{"n":3,"t":"tf","q":"The campaign uses food that would otherwise go to waste.","ko":"그 캠페인은 사용되지 않으면 버려졌을 식품을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The campaign takes the form of a public event that provides meals for 5,000 people using food that would otherwise go to waste.","이 캠페인은 사용되지 않으면 버려졌을 식품을 사용하여 5,000명의 사람들에게 식사를 제공하는 공공 행사의 형태를 취한다."]],"w":"6번에서 사용되지 않으면 버려졌을(would otherwise go to waste) 식품으로 5,000명에게 식사를 제공한다고 해요.","c":"T"},"h":"a72196ac8f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Stuart and his colleagues partnered with local producers ...)","ko":"(스튜어트와 그의 동료들은 지역 생산자들과 ...)","opts":["경쟁했다","항의했다","제휴를 맺었다","계약을 깼다"],"word":"partnered","r":{"a":"3) 제휴를 맺었다","ev":"8번 문장","s":[[8,"To support the event, Stuart and his colleagues partnered with local producers and received leftover food as contributions.","행사를 지원하기 위해, 스튜어트와 그의 동료들은 지역 생산자들과 제휴를 맺어 남은 음식을 기부 형태로 받았다."]],"w":"행사를 지원하기 위해 지역 생산자들과 함께하여 남은 음식을 받았다는 흐름이에요. partner with는 '~와 제휴를 맺다'라는 뜻이에요. 경쟁이나 항의라면 음식을 받을 수 없어요.","c":3},"h":"8b2619986f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... made substantial contributions to changing negative perceptions about ugly foods.)","ko":"(... 못생긴 음식에 대한 부정적인 인식을 바꾸는 데 상당한 기여를 했다.)","opts":["상당한","사소한","불필요한","위험한"],"word":"substantial","r":{"a":"1) 상당한","ev":"10번 문장","s":[[10,"The campaign not only managed to reduce the amount of food waste but also made substantial contributions to changing negative perceptions about ugly foods.","이 캠페인은 음식물 쓰레기의 양을 줄이는 데 성공했을 뿐만 아니라 못생긴 음식에 대한 부정적인 인식을 바꾸는 데 상당한 기여를 했다."]],"w":"못생긴 음식에 대한 인식을 바꾼 큰 성과를 말하는 문장이라 '상당한(꽤 큰)'이 맞아요. 사소한이면 not only A but also B로 강조하는 성과와 어울리지 않아요.","c":1},"h":"091fd6ffc0"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nActivist Tristram Stuart launched the Feeding the 5000 campaign to raise awareness about this absurd problem and ultimately resolve it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"활동가 트리스트럼 스튜어트는 이 부조리한 문제에 대한 인식을 높이고 궁극적으로 그것을 해결하기 위해 ‘5000명 먹이기’ 캠페인을 시작했다.","opts":["5000명 먹이기 캠페인","유엔 환경 계획 보고서","지역 생산자들","못생긴 식품이 낭비되는 문제"],"r":{"a":"4) 못생긴 식품이 낭비되는 문제","ev":"5번 문장","s":[[5,"Activist Tristram Stuart launched the Feeding the 5000 campaign to raise awareness about this absurd problem and ultimately resolve it.","활동가 트리스트럼 스튜어트는 이 부조리한 문제에 대한 인식을 높이고 궁극적으로 그것을 해결하기 위해 ‘5000명 먹이기’ 캠페인을 시작했다."]],"w":"resolve(해결하다)의 대상은 앞의 this absurd problem, 즉 식품이 낭비되는 문제예요. 캠페인은 문제를 해결하는 수단이라 해결의 대상이 아니에요.","c":4},"h":"a77a3eb6c2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"According to the United Nations Environment Programme report, 19 percent of food that reaches consumers is thrown out before being used.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"유엔 환경 계획 보고서에 따르면, 소비자에게 도달하는 식품의 19퍼센트가 사용되기 전에 버려진다.","opts":["유엔 보고서에 따르면 소비자에게 간 식품의 19퍼센트는 다 쓰이고 난 뒤에 버려진다.","유엔 보고서에 따르면 소비자에게 간 식품의 19퍼센트가 쓰이기 전에 버려진다.","유엔 보고서에 따르면 식품의 19퍼센트가 소비자에게 도달하기도 전에 손실된다.","유엔 보고서에 따르면 소비자가 식품의 19퍼센트를 사용하기 전에 구매를 취소한다."],"r":{"a":"2) 유엔 보고서에 따르면 소비자에게 간 식품의 19퍼센트가 쓰이기 전에 버려진다.","ev":"1번 문장","s":[[1,"According to the United Nations Environment Programme report, 19 percent of food that reaches consumers is thrown out before being used.","유엔 환경 계획 보고서에 따르면, 소비자에게 도달하는 식품의 19퍼센트가 사용되기 전에 버려진다."]],"w":"food that reaches consumers는 소비자에게 도달한 식품이고, before being used는 사용되기 전에라는 뜻이에요. '도달하기도 전에 손실된다'는 2번 내용이라서 선지 3은 함정이에요.","c":2},"h":"4b2b7dea47"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["자원봉사자들은 수집된 식품과 재료로 식사를 요리했다.","지역 셰프들이 재료가 수집되기 전에 모든 식사를 요리했다.","방문객들이 재료로 직접 식사를 요리했다.","지역 생산자들이 방문객들에게 식사를 요리해 제공했다."],"opts":["Volunteers cooked meals using the food and ingredients that had been collected.","Local chefs cooked every meal before the ingredients were collected.","Visitors cooked meals themselves from the ingredients.","Local producers cooked and served meals to the visitors."],"r":{"a":"1) Volunteers cooked meals using the food and ingredients that had been collected.","ev":"9번 문장","s":[[9,"After food and ingredients were collected, volunteers cooked and served meals to thousands of visitors who attended the feast.","음식과 재료들이 수집된 후, 자원봉사자들이 잔치에 참석한 수천 명의 방문객들을 위해 식사를 요리하고 제공했다."]],"w":"9번에서 음식과 재료가 수집된 '후에' 자원봉사자들이 요리하고 제공했다고 해요. 요리한 사람이 셰프, 방문객, 생산자라는 말은 본문에 없어요.","c":1},"h":"0b70dd5492"},{"n":9,"t":"sum","q":"The first event was held in (A) in (B) 2009.","ko":"첫 행사는 2009년 (B)에 (A)에서 개최되었다.","oko":["(A) 런던 / (B) 12월","(A) 런던 / (B) 6월","(A) 파리 / (B) 12월","(A) 파리 / (B) 6월","(A) 도쿄 / (B) 3월"],"opts":["(A) London / (B) December","(A) London / (B) June","(A) Paris / (B) December","(A) Paris / (B) June","(A) Tokyo / (B) March"],"r":{"a":"1) (A) London / (B) December ((A) 런던 / (B) 12월)","ev":"7번 문장","s":[[7,"The first event was held in London in December 2009.","첫 행사는 2009년 12월 런던에서 개최되었다."]],"w":"7번에서 첫 행사는 2009년 12월(December) 런던(London)에서 개최되었다고 해요.","c":1},"h":"93c99c75a0"},{"n":10,"t":"fill","q":"That means about [A] of all food is being [B]!","ko":"그것은 모든 식품의 약 [A]이(가) [B] 있다는 뜻이다!","bank":["one-third","wasted","volunteers","visitors","resolve","producers"],"bko":{"one-third":"3분의 1","wasted":"낭비되어(waste의 과거분사)","volunteers":"자원봉사자들","visitors":"방문객들","resolve":"해결하다","producers":"생산자들"},"r":{"a":"[A] one-third (3분의 1), [B] wasted (낭비되어(waste의 과거분사))","ev":"3번 문장","s":[[3,"That means about one-third of all food is being wasted!","그것은 모든 식품의 약 3분의 1이 낭비되고 있음을 의미한다!"]],"w":"3번은 모든 식품의 약 3분의 1(one-third)이 낭비되고(wasted) 있다는 뜻이에요. 나머지 단어는 이 빈칸에 넣으면 뜻이나 문법이 맞지 않아요.","c":null},"h":"5352c53e05"}]},{"u":8,"id":"ms2-08-1","no":1,"ko":"이 책 누가 좀 읽어줄 사람...?","items":[{"n":1,"t":"tf","q":"Wilfrid Voynich purchased the manuscript in Rome in 1912.","ko":"윌프리드 보이니치는 1912년 로마에서 그 필사본을 구입했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Named after Wilfrid Voynich, the Polish book dealer who purchased it in Rome in 1912, the manuscript contains 240 pages written in an unknown language and adorned with bizarre, colorful illustrations.","1912년 로마에서 그것을 구입한 폴란드 서적상인 윌프리드 보이니치의 이름을 딴 이 필사본은 알 수 없는 언어로 쓰여 있고, 기이하고 다채로운 삽화로 장식된 240쪽 분량의 내용을 담고 있다."]],"w":"3번 문장에 the Polish book dealer who purchased it in Rome in 1912라고 나와요. 보이니치는 로마에서 필사본을 산 폴란드 서적상이에요.","c":"T"},"h":"6e8ce11cf7"},{"n":2,"t":"tf","q":"The manuscript was made from fourteen full sheepskins.","ko":"그 필사본은 열네 장의 온전한 양가죽으로 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"They’ve determined that the book was made from fourteen full calfskins and had once belonged to an emperor in the sixteenth century before being lost.","그들은 이 책이 열네 장의 온전한 송아지 가죽으로 만들어졌고, 분실되기 이전에 16세기의 한 황제의 소유였음을 밝혀냈다."]],"w":"6번 문장은 열네 장의 온전한 송아지 가죽(calfskins)으로 만들어졌다고 해요. 양가죽(sheepskins)이 아니에요.","c":"F"},"h":"4a5d008391"},{"n":3,"t":"tf","q":"Scholars still do not know for sure what the text of the manuscript means.","ko":"학자들은 여전히 그 필사본의 텍스트가 무슨 뜻인지 확실히 알지 못한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Handwriting analysis suggests the manuscript was created by five different individuals, yet scholars are still uncertain about the language or meaning of the text.","필체 분석은 이 필사본이 다섯 명의 서로 다른 개인들에 의해 만들어졌다고 시사하지만, 학자들은 여전히 텍스트의 언어나 의미에 대해 확신하지 못한다."]],"w":"7번 문장에 scholars are still uncertain about the language or meaning of the text라고 나와요. 언어나 의미를 여전히 확신하지 못해요.","c":"T"},"h":"e3b2b77aa6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, many visitors are especially fascinated by the Voynich manuscript, considered one of history’s greatest puzzles.)","ko":"그러나 많은 방문객들은 역사상 가장 큰 수수께끼 중 하나로 여겨지는 보이니치 필사본에 특히 매료된다.","opts":["지루해하는","매료된","두려워하는","당황한"],"word":"fascinated","r":{"a":"2) 매료된","ev":"2번 문장","s":[[2,"However, many visitors are especially fascinated by the Voynich manuscript, considered one of history’s greatest puzzles.","그러나 많은 방문객들은 역사상 가장 큰 수수께끼 중 하나로 여겨지는 보이니치 필사본에 특히 매료된다."]],"w":"방문객들이 역사상 가장 큰 수수께끼 중 하나인 필사본에 특히 끌린다는 뜻이에요. be fascinated by = ~에 매료되다.","c":2},"h":"c2438b86c5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the manuscript contains 240 pages written in an unknown language and adorned with bizarre, colorful illustrations.)","ko":"이 필사본은 알 수 없는 언어로 쓰여 있고 기이하고 다채로운 삽화로 장식된 240쪽 분량의 내용을 담고 있다.","opts":["지워진","찢어진","장식된","복원된"],"word":"adorned","r":{"a":"3) 장식된","ev":"3번 문장","s":[[3,"Named after Wilfrid Voynich, the Polish book dealer who purchased it in Rome in 1912, the manuscript contains 240 pages written in an unknown language and adorned with bizarre, colorful illustrations.","1912년 로마에서 그것을 구입한 폴란드 서적상인 윌프리드 보이니치의 이름을 딴 이 필사본은 알 수 없는 언어로 쓰여 있고, 기이하고 다채로운 삽화로 장식된 240쪽 분량의 내용을 담고 있다."]],"w":"삽화가 가득한 모습을 설명하는 말이에요. adorn = 장식하다, adorned with ~ = ~로 장식된.","c":3},"h":"8ac03d98c5"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nA recent computer analysis showed the text might be a type of Hebrew, while another research team thought it could be an old Turkish language.","ko":"밑줄 친 it이 가리키는 것은?","sko":"최근의 컴퓨터 분석은 그 텍스트가 히브리어의 한 종류일 수 있다는 것을 보여주었고, 반면에 다른 연구팀은 그것이 옛날 튀르키예어일 수 있다고 생각했다.","opts":["컴퓨터 분석","그 텍스트","다른 연구팀","히브리어"],"r":{"a":"2) 그 텍스트","ev":"8번 문장","s":[[8,"A recent computer analysis showed the text might be a type of Hebrew, while another research team thought it could be an old Turkish language.","최근의 컴퓨터 분석은 그 텍스트가 히브리어의 한 종류일 수 있다는 것을 보여주었고, 반면에 다른 연구팀은 그것이 옛날 튀르키예어일 수 있다고 생각했다."]],"w":"8번에서 다른 연구팀은 그 텍스트(the text)가 옛날 튀르키예어일 수 있다고 생각했다는 내용이에요. it은 앞에 나온 the text를 가리켜요.","c":2,"k":"it = 그 텍스트"},"pron":"it","h":"4a06b74417"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The manuscript’s possibilities continue to draw scholars eager to solve the mystery within.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 필사본의 가능성들은 그 안의 수수께끼를 풀고자 열망하는 학자들을 계속해서 끌어들인다.","opts":["학자들은 필사본에 흥미를 잃고 수수께끼 풀기를 포기했다.","필사본 안의 수수께끼는 이미 모두 풀려 있다.","필사본이 지닌 여러 가능성이 수수께끼를 풀고 싶어 하는 학자들을 계속 끌어들인다.","학자들은 필사본의 가능성 때문에 수수께끼를 일부러 풀지 않으려 한다."],"r":{"a":"3) 필사본이 지닌 여러 가능성이 수수께끼를 풀고 싶어 하는 학자들을 계속 끌어들인다.","ev":"9번 문장","s":[[9,"The manuscript’s possibilities continue to draw scholars eager to solve the mystery within.","이 필사본의 가능성들은 그 안의 수수께끼를 풀고자 열망하는 학자들을 계속해서 끌어들인다."]],"w":"continue to draw는 '계속 끌어들이다', eager to solve the mystery는 '수수께끼를 풀고 싶어 하는'이라는 뜻이에요. 학자들은 포기하지 않고 계속 모여들어요.","c":3},"h":"ff75f768d3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["수년에 걸쳐 암호 해독가, 언어학자, 역사학자들이 그 필사본을 해독하려고 노력해왔다.","폴란드 서적상들만이 그 필사본을 해독하려고 노력해왔다.","아무도 그 필사본을 해독하려고 시도한 적이 없다.","도서관 방문객들이 하루 만에 그 필사본을 해독했다."],"opts":["Code breakers, linguists, and historians have worked to decode the manuscript over the years.","Only Polish book dealers have worked to decode the manuscript.","Nobody has ever tried to decode the manuscript.","Visitors to the library decoded the manuscript in one day."],"r":{"a":"1) Code breakers, linguists, and historians have worked to decode the manuscript over the years. (수년에 걸쳐 암호 해독가, 언어학자, 역사학자들이 그 필사본을 해독하려고 노력해왔다.)","ev":"5번 문장","s":[[5,"Over the years, code breakers, linguists, and historians have worked to decode the manuscript.","수년에 걸쳐, 암호 해독가, 언어학자, 역사학자들이 이 필사본을 해독하기 위해 노력해왔다."]],"w":"5번에서 수년에 걸쳐 암호 해독가, 언어학자, 역사학자들이 필사본을 해독하려고 노력해왔다고 해요. 폴란드 서적상만 노력했다거나 아무도 시도하지 않았다는 말은 본문과 달라요.","c":1},"h":"5d336980c2"},{"n":9,"t":"sum","q":"The Rare Book Library at Yale University (A) the first printed Bible and the first printed (B) of Shakespeare’s plays.","ko":"예일 대학교의 희귀본 도서관은 최초로 인쇄된 성경과 셰익스피어 희곡의 최초 인쇄 (B)을(를) (A).","oko":["(A) 소장한다 / (B) 모음집","(A) 소장한다 / (B) 입장권","(A) 판매한다 / (B) 모음집","(A) 판매한다 / (B) 입장권","(A) 빌린다 / (B) 입장권"],"opts":["(A) houses / (B) collection","(A) houses / (B) ticket","(A) sells / (B) collection","(A) sells / (B) ticket","(A) borrows / (B) ticket"],"r":{"a":"1) (A) houses / (B) collection ((A) 소장한다 / (B) 모음집)","ev":"1번 문장","s":[[1,"The Rare Book Library at Yale University houses the first printed Bible and the first printed collection of Shakespeare’s plays.","예일 대학교의 희귀본 도서관은 최초로 인쇄된 성경과 셰익스피어 희곡의 최초 인쇄본 모음집을 소장하고 있다."]],"w":"1번에서 예일 대학교의 희귀본 도서관은 최초로 인쇄된 성경과 셰익스피어 희곡의 최초 인쇄본 모음집(collection)을 소장하고(houses) 있다고 해요.","c":1},"h":"6a2236d5de"},{"n":10,"t":"fill","q":"These include depictions of [A] plants, mysterious [B] objects, and people in strange, unexplained settings.","ko":"이것들은 [A] 식물, 신비로운 [B] 물체, 그리고 이상하고 설명되지 않은 배경의 사람들을 묘사한 것을 포함한다.","bank":["unidentified","astronomical","scholars","emperor","calfskins","historians"],"bko":{"unidentified":"미확인의","astronomical":"천문학적인","scholars":"학자들","emperor":"황제","calfskins":"송아지 가죽","historians":"역사학자들"},"r":{"a":"[A] unidentified (미확인의), [B] astronomical (천문학적인)","ev":"4번 문장","s":[[4,"These include depictions of unidentified plants, mysterious astronomical objects, and people in strange, unexplained settings.","이것들은 미확인 식물, 신비로운 천문학적 물체, 그리고 이상하고 설명되지 않은 배경의 사람들을 묘사한 것을 포함한다."]],"w":"4번은 미확인(unidentified) 식물, 신비로운 천문학적(astronomical) 물체, 이상한 배경의 사람들을 묘사한 것이 있다는 내용이에요. 나머지 단어는 이 빈칸에 넣으면 뜻이나 문법이 맞지 않아요.","c":null},"h":"c5072aedcc"}]},{"u":8,"id":"ms2-08-2","no":2,"ko":"이 로봇, 진짜 개구리네!","items":[{"n":1,"t":"tf","q":"Each xenobot is about the size of a grain of rice.","ko":"각각의 제노봇은 쌀 한 알 정도의 크기이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Each one is about the size of a grain of sand and uses tiny hair-like structures to swim.","각각은 모래 한 알 크기이며 수영을 하기 위해 미세한 털 같은 구조를 사용한다."]],"w":"5번 문장에 Each one is about the size of a grain of sand라고 나와요. 쌀(rice)이 아니라 모래(sand) 한 알 크기예요.","c":"F"},"h":"f3fbc2ba58"},{"n":2,"t":"tf","q":"Xenobots can replicate by gathering spare skin cells.","ko":"제노봇은 여분의 피부 세포를 모음으로써 복제할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"In relation to this, researchers discovered an optimal design resembling Pac-Man, a classic, ball-shaped game character with a small triangular mouth, which enables xenobots to replicate by gathering spare skin cells and forming new xenobots autonomously.","이와 관련하여, 연구자들은 작은 삼각형 입을 가진 공 모양의 고전 게임 캐릭터 팩맨을 닮은 최적의 설계를 발견했는데, 이 설계는 제노봇이 여분의 피부 세포를 모으고 독자적으로 새로운 제노봇을 형성하며 복제하는 것을 가능하게 한다."]],"w":"7번 문장에 팩맨을 닮은 설계가 제노봇이 여분의 피부 세포를 모아 새로운 제노봇을 형성하며 복제하는 것을 가능하게 한다고 나와요.","c":"T"},"h":"aa9f34f7a3"},{"n":3,"t":"tf","q":"After their task is done, xenobots stay in the environment and cause harm.","ko":"임무가 끝난 뒤에 제노봇은 환경에 남아 해를 끼친다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"In addition, once their task is done, the xenobots naturally decompose without causing any harm to the environment.","게다가, 임무가 완료되면, 제노봇들은 환경에 어떠한 해도 끼치지 않은 채 자연적으로 분해된다."]],"w":"9번 문장은 임무가 끝나면 제노봇이 환경에 어떠한 해도 끼치지 않고 자연적으로 분해된다고 해요.","c":"F"},"h":"8374637784"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But imagine if there were living robots made from organic material.)","ko":"하지만 유기 물질로 만들어진 살아있는 로봇이 있다고 상상해 보라.","opts":["인공의","금속의","유기의","플라스틱의"],"word":"organic","r":{"a":"3) 유기의","ev":"2번 문장","s":[[2,"But imagine if there were living robots made from organic material.","하지만 유기 물질로 만들어진 살아있는 로봇이 있다고 상상해 보라."]],"w":"2번은 금속이나 플라스틱이 아닌, 살아있는 로봇의 재료를 말해요. organic = 유기의, 생물에서 온.","c":3},"h":"584653225e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…xenobots are controlled by altering their shape and size to encourage desired behaviors.)","ko":"제노봇은 바람직한 행동을 유도하기 위해 그것들의 형태와 크기를 변경함으로써 제어된다.","opts":["변경하다","보존하다","측정하다","금지하다"],"word":"altering","r":{"a":"1) 변경하다","ev":"6번 문장","s":[[6,"Unlike mechanical robots that rely on software programming, xenobots are controlled by altering their shape and size to encourage desired behaviors.","소프트웨어 프로그래밍에 의존하는 기계식 로봇들과 달리, 제노봇은 바람직한 행동을 유도하기 위해 그것들의 형태와 크기를 변경함으로써 제어된다."]],"w":"6번은 제노봇의 형태와 크기를 바꿔서 제어한다는 내용이에요. alter = 변경하다, 바꾸다.","c":1},"h":"f588c44411"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nScientists envision a hopeful future with xenobots, where they can be programmed to deliver medicine, detect cancer cells, or collect microplastics in the ocean.","ko":"밑줄 친 they가 가리키는 것은?","sko":"과학자들은 제노봇과 함께 희망찬 미래를 구상하는데, 그곳에서는 제노봇들이 의약품을 전달하고, 암세포를 감지하고, 바다에서 미세 플라스틱을 수집하도록 프로그래밍될 수 있다.","opts":["과학자들","제노봇들","암세포들","미세 플라스틱들"],"r":{"a":"2) 제노봇들","ev":"8번 문장","s":[[8,"Scientists envision a hopeful future with xenobots, where they can be programmed to deliver medicine, detect cancer cells, or collect microplastics in the ocean.","과학자들은 제노봇과 함께 희망찬 미래를 구상하는데, 그곳에서는 제노봇들이 의약품을 전달하고, 암세포를 감지하고, 바다에서 미세 플라스틱을 수집하도록 프로그래밍될 수 있다."]],"w":"they can be programmed to deliver medicine ~ 에서 프로그래밍되는 대상은 제노봇이에요. 과학자들(Scientists)이 프로그래밍되는 것이 아니라 제노봇이 프로그래밍돼요.","c":2},"h":"02ebb8b1fe"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While this may sound like science fiction, such robots became a reality in 2020.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것이 공상 과학처럼 들릴 수 있지만, 그러한 로봇은 2020년에 현실이 되었다.","opts":["공상 과학 영화에서 2020년에 처음 로봇이 등장했다.","공상 과학처럼 들리지만, 그런 로봇은 2020년에 실제로 생겨났다.","공상 과학 작가들은 2020년 이후 로봇 이야기를 쓰지 않았다.","2020년에 만들어진 로봇은 공상 과학처럼 비현실적이었다."],"r":{"a":"2) 공상 과학처럼 들리지만, 그런 로봇은 2020년에 실제로 생겨났다.","ev":"3번 문장","s":[[3,"While this may sound like science fiction, such robots became a reality in 2020.","이것이 공상 과학처럼 들릴 수 있지만, 그러한 로봇은 2020년에 현실이 되었다."]],"w":"While은 '~이지만'으로, 공상 과학처럼 들려도 2020년에 현실이 되었다는 뜻이에요.","c":2},"h":"779806db83"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대부분의 로봇은 금속이나 플라스틱으로 만들어지는데, 이것들은 환경 폐기물이 될 수 있다.","금속이나 플라스틱으로 만든 로봇은 작동이 멈춰도 환경에 해가 없다.","제노봇은 금속과 플라스틱으로 만들어진다.","대부분의 로봇은 살아있는 유기 물질로 만들어진다."],"opts":["Most robots are made of metal or plastic, which can become environmental waste.","Robots made of metal or plastic cause no harm to the environment when they stop working.","Xenobots are made of metal and plastic.","Most robots are made from living organic material."],"r":{"a":"1) Most robots are made of metal or plastic, which can become environmental waste. (대부분의 로봇은 금속이나 플라스틱으로 만들어지는데, 이것들은 환경 폐기물이 될 수 있다.)","ev":"1번 문장","s":[[1,"Most robots are made of metal or plastic, which can turn into environmental waste when they stop working.","대부분의 로봇은 금속이나 플라스틱으로 만들어지는데, 이것들은 작동하는 것을 멈추면 환경 폐기물이 될 수 있다."]],"w":"1번에서 대부분의 로봇은 금속이나 플라스틱으로 만들어지고, 작동을 멈추면 환경 폐기물이 될 수 있다고 해요. 금속이나 플라스틱으로 만든 로봇이 해가 없다는 말은 없고, 제노봇은 금속과 플라스틱이 아니라 개구리 피부 세포로 만들어요. 대부분의 로봇이 살아있는 유기 물질로 만들어진다는 말도 없어요.","c":1},"h":"ca35936aa2"},{"n":9,"t":"sum","q":"Researchers used skin cells from a (A) to create tiny (B) machines called xenobots.","ko":"연구자들은 (A)의 피부 세포를 사용하여 제노봇이라고 불리는 작은 (B) 기계를 만들었다.","oko":["(A) 개구리 / (B) 생물학적인","(A) 개구리 / (B) 금속","(A) 물고기 / (B) 생물학적인","(A) 물고기 / (B) 금속","(A) 새 / (B) 플라스틱"],"opts":["(A) frog / (B) biological","(A) frog / (B) metal","(A) fish / (B) biological","(A) fish / (B) metal","(A) bird / (B) plastic"],"r":{"a":"1) (A) frog / (B) biological ((A) 개구리 / (B) 생물학적인)","ev":"4번 문장","s":[[4,"Using skin cells from the Xenopus laevis frog, researchers created tiny biological machines called xenobots.","‘아프리카발톱개구리’의 피부 세포를 사용하여, 연구자들은 제노봇이라고 불리는 작은 생물학적 기계를 만들었다."]],"w":"4번에서 연구자들은 아프리카발톱개구리(frog)의 피부 세포를 사용해 제노봇이라고 불리는 작은 생물학적(biological) 기계를 만들었다고 해요.","c":1},"h":"2b63d087cc"},{"n":10,"t":"fill","q":"Unlike [A] robots that rely on [B] programming, xenobots are controlled by altering their shape and size to encourage desired behaviors.","ko":"[B] 프로그래밍에 의존하는 [A] 로봇들과 달리, 제노봇은 바람직한 행동을 유도하기 위해 그것들의 형태와 크기를 변경함으로써 제어된다.","bank":["mechanical","software","decompose","replicate","swim","deliver"],"bko":{"mechanical":"기계식의","software":"소프트웨어","decompose":"분해되다","replicate":"복제하다","swim":"수영하다","deliver":"전달하다"},"r":{"a":"[A] mechanical (기계식의), [B] software (소프트웨어)","ev":"6번 문장","s":[[6,"Unlike mechanical robots that rely on software programming, xenobots are controlled by altering their shape and size to encourage desired behaviors.","소프트웨어 프로그래밍에 의존하는 기계식 로봇들과 달리, 제노봇은 바람직한 행동을 유도하기 위해 그것들의 형태와 크기를 변경함으로써 제어된다."]],"w":"6번은 소프트웨어(software) 프로그래밍에 의존하는 기계식(mechanical) 로봇과 달리 제노봇은 형태와 크기를 바꿔 제어된다는 내용이에요. 나머지 단어는 동사라서 이 빈칸에 넣으면 문법이 맞지 않아요.","c":null},"h":"f3ece5022f"}]},{"u":8,"id":"ms2-08-3","no":3,"ko":"거기로 안 나갈 건데?","items":[{"n":1,"t":"tf","q":"A new kangaroo arrived at the Harrisburg Zoo.","ko":"새로운 캥거루 한 마리가 해리스버그 동물원에 도착했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Once upon a time, a new kangaroo arrived at the Harrisburg Zoo.","옛날 옛적에, 새로운 캥거루 한 마리가 해리스버그 동물원에 도착했다."]],"w":"1번 문장에 a new kangaroo arrived at the Harrisburg Zoo라고 나와요.","c":"T"},"h":"064ce99708"},{"n":2,"t":"tf","q":"After the kangaroo escaped, Jessica decided to stop raising the fence.","ko":"캥거루가 탈출한 뒤, 제시카는 울타리를 높이는 것을 그만두기로 했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"She thought to herself, “How on earth did it get out? Never mind, I’ll just make the fence higher.”","그녀는 속으로 생각했다, “도대체 그것이 어떻게 나갔지? 괜찮아, 그냥 내가 울타리를 더 높이 만들겠어.”"]],"w":"5번에서 제시카는 Never mind, I'll just make the fence higher라고 해요. 울타리를 그만 높이는 것이 아니라 더 높이겠다고 결심해요.","c":"F"},"h":"7710712788"},{"n":3,"t":"tf","q":"Jessica felt despair because she did not know what to do.","ko":"제시카는 어찌할 바를 몰라서 절망을 느꼈다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"At a loss, Jessica threw her hands up in despair.","어찌할 바를 몰라, 제시카는 절망하며 두 손을 들었다."]],"w":"7번 문장에 At a loss, Jessica threw her hands up in despair라고 나와요. At a loss는 어찌할 바를 모른다는 뜻이에요.","c":"T"},"h":"23b1c9f95b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Jessica, the zookeeper, immediately recognized that the lively little creature was quite playful.)","ko":"사육사인 제시카는 그 활기찬 작은 생물이 꽤 장난기 많다는 것을 즉각 알아차렸다.","opts":["놓쳤다","무시했다","알아차렸다","허락했다"],"word":"recognized","r":{"a":"3) 알아차렸다","ev":"2번 문장","s":[[2,"Jessica, the zookeeper, immediately recognized that the lively little creature was quite playful.","사육사인 제시카는 그 활기찬 작은 생물이 꽤 장난기 많다는 것을 즉각 알아차렸다."]],"w":"제시카가 캥거루의 장난기 많은 모습을 바로 알아봤다는 뜻이에요. recognize = 알아차리다, 알아보다.","c":3},"h":"78eb1ddf96"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…she saw the young kangaroo hopping around outside as she was transporting buckets of feed the next morning.)","ko":"그녀는 다음 날 아침 그녀가 사료 양동이들을 나르고 있을 때 그 어린 캥거루가 밖에서 껑충껑충 뛰어다니는 것을 보았다.","opts":["나르다","팔다","씻다","던지다"],"word":"transporting","r":{"a":"1) 나르다","ev":"4번 문장","s":[[4,"Although she had felt certain that the kangaroo could not leap over the formidable walls, she saw the young kangaroo hopping around outside as she was transporting buckets of feed the next morning.","그녀는 그 캥거루가 그 만만치 않은 벽을 뛰어넘을 수 없다고 확신했음에도 불구하고, 다음 날 아침 그녀가 사료 양동이들을 나르고 있을 때 그 어린 캥거루가 밖에서 껑충껑충 뛰어다니는 것을 보았다."]],"w":"제시카가 사료 양동이를 옮기던 중이었다는 뜻이에요. transport = 나르다, 운송하다.","c":1},"h":"663f7e231d"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nThe kangaroo looked back smiling and responded, “Even if she makes the fence 1,000 meters tall, it won’t matter until she finds out the hole under the fence.”","ko":"밑줄 친 she가 가리키는 것은?","sko":"그 캥거루는 미소 지으며 뒤돌아보고 대답했다, “그녀가 울타리를 1,000미터 높이로 만들더라도, 그녀가 울타리 아래의 구멍을 발견하기 전까지는 소용없을 거야.”","opts":["제시카","낙타","캥거루","동물원"],"r":{"a":"1) 제시카","ev":"9번 문장","s":[[9,"The kangaroo looked back smiling and responded, “Even if she makes the fence 1,000 meters tall, it won’t matter until she finds out the hole under the fence.”","그 캥거루는 미소 지으며 뒤돌아보고 대답했다, “그녀가 울타리를 1,000미터 높이로 만들더라도, 그녀가 울타리 아래의 구멍을 발견하기 전까지는 소용없을 거야.”"]],"w":"9번에서 캥거루는 그녀(she)가 울타리를 1,000미터 높이로 만들더라도 구멍을 발견하기 전까지는 소용없다고 말해요. 울타리를 만들고 구멍을 찾는 사람은 사육사 제시카예요.","c":1,"k":"she = 제시카"},"pron":"she","h":"bfdefbcc52"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The fence was raised to 10 meters, 15 meters, and finally 20 meters, but the kangaroo kept escaping.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"울타리는 10미터, 15미터, 그리고 마침내 20미터까지 높아졌지만, 그 캥거루는 계속해서 탈출했다.","opts":["울타리를 여러 번 높였는데도 캥거루는 계속 탈출했다.","울타리를 높이자 캥거루가 더는 탈출하지 못했다.","울타리를 20미터로 낮추자 캥거루가 탈출을 멈췄다.","캥거루가 20미터 높이의 울타리를 직접 만들었다."],"r":{"a":"1) 울타리를 여러 번 높였는데도 캥거루는 계속 탈출했다.","ev":"6번 문장","s":[[6,"The fence was raised to 10 meters, 15 meters, and finally 20 meters, but the kangaroo kept escaping.","울타리는 10미터, 15미터, 그리고 마침내 20미터까지 높아졌지만, 그 캥거루는 계속해서 탈출했다."]],"w":"6번은 울타리가 10미터, 15미터, 마침내 20미터까지 높아졌지만 캥거루는 계속 탈출했다(kept escaping)는 내용이에요.","c":1},"h":"09296a2cbb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["캥거루가 문제를 일으키지 못하도록 제시카는 울타리를 5미터로 높였다.","제시카는 캥거루를 막으려고 울타리를 5미터로 낮췄다.","제시카가 울타리를 없애서 캥거루가 문제를 일으켰다.","동물원이 너무 좁아서 제시카는 울타리를 5미터로 높였다."],"opts":["To keep the kangaroo from causing trouble, Jessica raised the fence to five meters.","Jessica lowered the fence to five meters to stop the kangaroo.","The kangaroo caused trouble because Jessica removed the fence.","Jessica raised the fence to five meters because the zoo was too small."],"r":{"a":"1) To keep the kangaroo from causing trouble, Jessica raised the fence to five meters. (캥거루가 문제를 일으키지 못하도록 제시카는 울타리를 5미터로 높였다.)","ev":"3번 문장","s":[[3,"To prevent this energetic jumper from causing trouble, she increased the height of the fence to five meters.","이 활동적인 뛰는 동물이 문제를 일으키는 것을 방지하기 위해, 그녀는 울타리의 높이를 5미터로 높였다."]],"w":"3번에서 제시카는 이 활동적인 캥거루가 문제를 일으키는 것을 방지하려고 울타리 높이를 5미터로 높였다고 해요. 울타리를 낮추거나 없앴다는 말, 동물원이 좁다는 말은 본문에 없어요.","c":1},"h":"a239d7551a"},{"n":9,"t":"sum","q":"Jessica felt (A) that the kangaroo could not (B) over the formidable walls.","ko":"제시카는 그 캥거루가 그 만만치 않은 벽을 (B) 수 없다고 (A)했다.","oko":["(A) 확신 / (B) 뛰어넘을","(A) 확신 / (B) 파낼","(A) 두려워 / (B) 뛰어넘을","(A) 두려워 / (B) 파낼","(A) 걱정 / (B) 파낼"],"opts":["(A) certain / (B) leap","(A) certain / (B) dig","(A) afraid / (B) leap","(A) afraid / (B) dig","(A) worried / (B) dig"],"r":{"a":"1) (A) certain / (B) leap ((A) 확신 / (B) 뛰어넘을)","ev":"4번 문장","s":[[4,"Although she had felt certain that the kangaroo could not leap over the formidable walls, she saw the young kangaroo hopping around outside as she was transporting buckets of feed the next morning.","그녀는 그 캥거루가 그 만만치 않은 벽을 뛰어넘을 수 없다고 확신했음에도 불구하고, 다음 날 아침 그녀가 사료 양동이들을 나르고 있을 때 그 어린 캥거루가 밖에서 껑충껑충 뛰어다니는 것을 보았다."]],"w":"4번에서 제시카는 캥거루가 그 만만치 않은 벽을 뛰어넘을(leap over) 수 없다고 확신했다(felt certain)고 해요.","c":1},"h":"bef955487b"},{"n":10,"t":"fill","q":"A [A] camel that [B] all this asked the kangaroo, “How much longer can you keep this up?”","ko":"이 모든 것을 [B] [A] 낙타가 그 캥거루에게 물었다, “너는 이것을 얼마나 더 오래 계속할 수 있니?”","bank":["curious","observed","fence","zookeeper","buckets","height"],"bko":{"curious":"호기심 많은","observed":"관찰한","fence":"울타리","zookeeper":"사육사","buckets":"양동이들","height":"높이"},"r":{"a":"[A] curious (호기심 많은), [B] observed (관찰한)","ev":"8번 문장","s":[[8,"A curious camel that observed all this asked the kangaroo, “How much longer can you keep this up?”","이 모든 것을 관찰한 호기심 많은 낙타가 그 캥거루에게 물었다, “너는 이것을 얼마나 더 오래 계속할 수 있니?”"]],"w":"8번은 이 모든 것을 관찰한(observed) 호기심 많은(curious) 낙타가 캥거루에게 물었다는 내용이에요. 나머지 단어는 명사라서 이 빈칸에 넣으면 뜻이나 문법이 맞지 않아요.","c":null},"h":"e35b04f3b0"}]},{"u":8,"id":"ms2-08-4","no":4,"ko":"Born to Crave Salt?","items":[{"n":1,"t":"tf","q":"The passage begins by asking readers to choose between salty potato chips and sweet chocolate cookies.","ko":"이 글은 독자에게 짠 감자칩과 달콤한 초콜릿 쿠키 중 하나를 고르라고 하며 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Choose one: a bag of salty potato chips or a pack of sweet chocolate cookies.","짠 감자칩 한 봉지나 달콤한 초콜릿 쿠키 한 팩 중에 하나를 선택하라."]],"w":"1번 문장에 Choose one: a bag of salty potato chips or a pack of sweet chocolate cookies라고 나와요.","c":"T"},"h":"6c0f715b38"},{"n":2,"t":"tf","q":"The passage says a salt tooth is only a matter of personal preference.","ko":"이 글은 salt tooth가 오직 개인적 선호의 문제라고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"However, a salt tooth is more than a personal preference; it is influenced by biological and genetic factors!","하지만, salt tooth는 단순한 개인적 선호 이상인데, 그것은 생물학적 그리고 유전적 요인들에 의해 영향을 받는다!"]],"w":"4번 문장은 salt tooth가 단순한 개인적 선호 이상이며 생물학적·유전적 요인의 영향을 받는다고 해요. 오직 선호의 문제라는 말은 틀려요.","c":"F"},"h":"c9a7c31ae2"},{"n":3,"t":"tf","q":"A genetic factor behind a salt tooth can last into adulthood.","ko":"salt tooth의 배경이 되는 유전적 요소는 성인기까지 지속될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"This genetic factor can shape dietary preferences from early childhood and persist into adulthood.","이 유전적 요소는 어린 시절부터 식이 선호도를 형성하고 성인기까지 지속될 수 있다."]],"w":"11번 문장에 This genetic factor can shape dietary preferences from early childhood and persist into adulthood라고 나와요.","c":"T"},"h":"19df1f82b2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When sodium levels are low, the body may trigger cravings for salty foods to restore these.)","ko":"나트륨 수치가 낮을 때, 신체는 이것을 회복하기 위해 짠 음식에 대한 갈망을 유발할 수 있다.","opts":["줄이다","잃다","회복하다","기록하다"],"word":"restore","r":{"a":"3) 회복하다","ev":"7번 문장","s":[[7,"When sodium levels are low, the body may trigger cravings for salty foods to restore these.","나트륨 수치가 낮을 때, 신체는 이것을 회복하기 위해 짠 음식에 대한 갈망을 유발할 수 있다."]],"w":"전해질 균형과 수분 공급이 흐트러졌을 때 이를 다시 맞추려는 목적이에요. restore = 회복하다, 되돌리다.","c":3},"h":"47d79735f3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Research has also shown that certain individuals with a salt tooth have genetic predispositions that affect their taste sensitivity.)","ko":"또한 연구는 salt tooth를 가진 특정 개인들이 그들의 맛 감수성에 영향을 미치는 유전적 소인을 가지고 있음을 보여주었다.","opts":["소인(타고난 경향)","면역","습관","결핍"],"word":"predispositions","r":{"a":"1) 소인(타고난 경향)","ev":"9번 문장","s":[[9,"Research has also shown that certain individuals with a salt tooth have genetic predispositions that affect their taste sensitivity.","또한 연구는 salt tooth를 가진 특정 개인들이 그들의 맛 감수성에 영향을 미치는 유전적 소인을 가지고 있음을 보여주었다."]],"w":"맛 감수성에 영향을 주는 타고난 유전적 경향을 말해요. predisposition = 소인, 타고난 경향.","c":1},"h":"118604c08d"},{"n":6,"t":"ref","q":"What does the underlined \"This term\" refer to?\nThis term refers to a strong craving for salt.","ko":"밑줄 친 This term이 가리키는 것은?","sko":"이 용어는 소금에 대한 강한 갈망을 의미한다.","opts":["짠 감자칩","salt tooth","초콜릿 쿠키","나트륨"],"r":{"a":"2) salt tooth","ev":"2~3번 문장","s":[[2,"If you choose the former, you might have a salt tooth!","만약 당신이 전자를 선택한다면, 당신은 salt tooth(짭짤함을 좋아하는 입맛)를 가지고 있을 수도 있다!"],[3,"This term refers to a strong craving for salt.","이 용어는 소금에 대한 강한 갈망을 의미한다."]],"w":"3번의 This term은 바로 앞 2번의 salt tooth(짭짤함을 좋아하는 입맛)예요. 소금에 대한 강한 갈망을 뜻하는 용어라고 설명해요.","c":2},"h":"7194a4efe5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A study published in the American Journal of Clinical Nutrition highlights how low sodium intake can lead to an increased appetite for salty snacks.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"‘미국 임상 영양학 저널’에 발표된 한 연구는 낮은 나트륨 섭취가 어떻게 짠 간식에 대한 증가된 식욕으로 이어질 수 있는지를 강조한다.","opts":["나트륨을 많이 먹을수록 짠 간식에 대한 식욕이 커진다는 연구가 발표되었다.","짠 간식을 자주 먹으면 나트륨 섭취가 줄어든다는 연구가 발표되었다.","나트륨을 적게 먹으면 짠 간식이 더 먹고 싶어질 수 있음을 한 연구가 보여 준다.","한 저널은 짠 간식을 먹지 말라고 권고하는 연구를 실었다."],"r":{"a":"3) 나트륨을 적게 먹으면 짠 간식이 더 먹고 싶어질 수 있음을 한 연구가 보여 준다.","ev":"8번 문장","s":[[8,"A study published in the American Journal of Clinical Nutrition highlights how low sodium intake can lead to an increased appetite for salty snacks.","‘미국 임상 영양학 저널’에 발표된 한 연구는 낮은 나트륨 섭취가 어떻게 짠 간식에 대한 증가된 식욕으로 이어질 수 있는지를 강조한다."]],"w":"how low sodium intake can lead to an increased appetite는 '낮은 나트륨 섭취가 어떻게 식욕 증가로 이어질 수 있는지'예요. 많이 먹을수록 커진다는 말은 방향이 반대예요.","c":3},"h":"eaf8a93f55"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["SCNN1B 유전자의 변이는 더 강한 짠맛 감수성과 연관되어 왔다.","SCNN1B 유전자의 변이는 감소한 짠맛 감수성과 연관되어 왔다.","SCNN1B 유전자는 단맛 감수성과 관련이 있다.","salt tooth를 가진 모든 사람은 같은 유전자 변이를 가지고 있다."],"opts":["Variations in the SCNN1B gene have been associated with stronger salt taste sensitivity.","Variations in the SCNN1B gene have been associated with reduced salt taste sensitivity.","The SCNN1B gene is related to sweet taste sensitivity.","Everyone with a salt tooth has the same genetic variation."],"r":{"a":"2) Variations in the SCNN1B gene have been associated with reduced salt taste sensitivity. (SCNN1B 유전자의 변이는 감소한 짠맛 감수성과 연관되어 왔다.)","ev":"10번 문장","s":[[10,"For example, variations in the SCNN1B gene have been associated with reduced salt taste sensitivity, which may in turn contribute to a preference for saltier foods.","예를 들어, SCNN1B 유전자의 변이는 감소한 짠맛 감수성과 연관되어 왔으며, 이것은 결과적으로 더 짠 음식에 대한 선호도에 기여할 수 있다."]],"w":"10번에서 SCNN1B 유전자의 변이는 감소한 짠맛 감수성과 연관되어 왔다고 해요. 더 강한 감수성이 아니에요. 이 유전자가 단맛 감수성과 관련 있다는 말은 없고, 모든 사람이 같은 변이를 가진다는 내용도 없어요.","c":2},"h":"92dded2433"},{"n":9,"t":"sum","q":"The human body requires sodium to maintain (A) balance and proper (B).","ko":"인간의 몸은 (A) 균형과 적절한 (B)을(를) 유지하기 위해 나트륨을 필요로 한다.","oko":["(A) 전해질 / (B) 수분 공급","(A) 전해질 / (B) 장식","(A) 색 / (B) 수분 공급","(A) 색 / (B) 장식","(A) 설탕 / (B) 장식"],"opts":["(A) electrolyte / (B) hydration","(A) electrolyte / (B) decoration","(A) color / (B) hydration","(A) color / (B) decoration","(A) sugar / (B) decoration"],"r":{"a":"1) (A) electrolyte / (B) hydration ((A) 전해질 / (B) 수분 공급)","ev":"6번 문장","s":[[6,"For instance, the human body requires sodium to maintain electrolyte balance and proper hydration.","예를 들어, 인간의 몸은 전해질 균형과 적절한 수분 공급을 유지하기 위해 나트륨을 필요로 한다."]],"w":"6번에서 인간의 몸은 전해질(electrolyte) 균형과 적절한 수분 공급(hydration)을 유지하기 위해 나트륨을 필요로 한다고 해요.","c":1},"h":"93c6a55f6f"},{"n":10,"t":"fill","q":"Sodium, a key [A] of salt, is [B] for various physical processes.","ko":"소금의 핵심 [A]인 나트륨은 다양한 신체 과정에 [B] 것이다.","bank":["component","essential","cravings","snacks","restore","predispositions"],"bko":{"component":"성분","essential":"필수적인","cravings":"갈망","snacks":"간식","restore":"회복하다","predispositions":"소인들"},"r":{"a":"[A] component (성분), [B] essential (필수적인)","ev":"5번 문장","s":[[5,"Sodium, a key component of salt, is essential for various physical processes.","소금의 핵심 성분인 나트륨은 다양한 신체 과정에 필수적이다."]],"w":"5번은 나트륨이 소금의 핵심 성분(component)이며 다양한 신체 과정에 필수적(essential)이라는 내용이에요. 나머지 단어는 이 빈칸에 넣으면 뜻이나 문법이 맞지 않아요.","c":null},"h":"712cd0aa0f"}]},{"u":9,"id":"ms2-09-1","no":1,"ko":"본캐는 명작 제조기, 부캐는 신조어 자판기?","items":[{"n":1,"t":"tf","q":"Shakespeare’s creativity with language appeared in the many different ways he formed words.","ko":"셰익스피어의 언어에 대한 창의성은 그가 단어를 만든 여러 가지 서로 다른 방식에서 나타났다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"His creativity with language was reflected in his various methods of word formation.","언어에 대한 그의 창의성은 그의 다양한 단어 형성 방법에 반영되었다."]],"w":"4번 문장에서 언어에 대한 창의성이 다양한 단어 형성 방법에 반영되었다고 해요.","c":"T"},"h":"3136192d85"},{"n":2,"t":"tf","q":"When Shakespeare introduced new words, he used only English.","ko":"셰익스피어는 새 단어를 도입할 때 영어만 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"He didn’t limit himself to English when introducing words either.","그는 단어들을 도입할 때 영어에만 국한하지 않았다."]],"w":"8번 문장에서 영어에만 국한하지 않았다고 해요. 9번에서 네덜란드어를 바꿔 쓴 예도 나와요.","c":"F"},"h":"1d0e052175"},{"n":3,"t":"tf","q":"Shakespeare used the noun elbow as a verb meaning “to push aside.”","ko":"셰익스피어는 명사 elbow를 ‘옆으로 밀어내다’를 의미하는 동사로 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Another way was to convert a word’s part of speech, such as when he used the noun elbow as a verb to mean “to push aside.”","또 다른 방법은 단어의 품사를 변환하는 것이었는데, 가령 그가 명사 ‘elbow’를 ‘옆으로 밀어내다’를 의미하는 동사로 사용했을 때와 같은 경우이다."]],"w":"6번 문장에 he used the noun elbow as a verb to mean “to push aside”가 그대로 나와요.","c":"T"},"h":"7617158e52"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This word is just one example of the many that Shakespeare introduced into English, helping the language flourish with a richer and more expressive vocabulary.)","ko":"이 단어는 셰익스피어가 영어에 도입한 수많은 단어들 중 하나에 불과하며, 이를 통해 영어가 더욱 풍부하고 표현력 있는 어휘를 갖추며 풍성해지도록 도왔다.","opts":["줄어들다","번성하다","변하다","멈추다"],"word":"flourish","r":{"a":"2) 번성하다","ev":"3번 문장","s":[[3,"This word is just one example of the many that Shakespeare introduced into English, helping the language flourish with a richer and more expressive vocabulary.","이 단어는 셰익스피어가 영어에 도입한 수많은 단어들 중 하나에 불과하며, 이를 통해 영어가 더욱 풍부하고 표현력 있는 어휘를 갖추며 풍성해지도록 도왔다."]],"w":"3번 문장은 셰익스피어가 도입한 수많은 단어가 영어를 더 풍부하고 표현력 있는 어휘로 만들었다고 해요. 그래서 flourish는 영어가 '번성하다, 풍성해지다'라는 뜻이에요.","c":2},"h":"4f26cf678a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He also accomplished this by adding prefixes and suffixes, as seen when he turned the verb excite into the noun excitement by adding -ment.)","ko":"그는 또한 접두사와 접미사를 추가함으로써 이를 이루었는데, 이는 그가 동사 ‘excite’에 ‘-ment’를 추가하여 명사 ‘excitement’로 바꾼 경우에서 볼 수 있다.","opts":["포기했다","방해했다","숨겼다","이루어 냈다"],"word":"accomplished","r":{"a":"4) 이루어 냈다","ev":"7번 문장","s":[[7,"He also accomplished this by adding prefixes and suffixes, as seen when he turned the verb excite into the noun excitement by adding -ment.","그는 또한 접두사와 접미사를 추가함으로써 이를 이루었는데, 이는 그가 동사 ‘excite’에 ‘-ment’를 추가하여 명사 ‘excitement’로 바꾼 경우에서 볼 수 있다."]],"w":"7번은 접두사와 접미사를 붙여서도 새 단어 만들기를 '이루어 냈다'는 뜻이에요. 앞(5~6번)에서 말한 단어 만들기를 이어서 말하는 문장이라 accomplish = 이루다예요.","c":4},"h":"0b0f781653"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhile swagger, which means “to walk or behave in a bold and often arrogant way,” may sound like a modern word, it first appeared in Shakespeare’s Henry IV, Part 2 in 1600.","ko":"밑줄 친 it이 가리키는 것은?","sko":"‘대담하고 종종 거만한 방식으로 걷거나 행동하다’를 의미하는 ‘swagger’가 현대적인 단어처럼 들릴 수도 있지만, 그것은 1600년에 셰익스피어의 <헨리 4세 2부>에서 처음 등장했다.","opts":["swagger라는 단어","셰익스피어","<헨리 4세 2부>","1600년"],"r":{"a":"1) swagger라는 단어","ev":"2번 문장","s":[[2,"While swagger, which means “to walk or behave in a bold and often arrogant way,” may sound like a modern word, it first appeared in Shakespeare’s Henry IV, Part 2 in 1600.","‘대담하고 종종 거만한 방식으로 걷거나 행동하다’를 의미하는 ‘swagger’가 현대적인 단어처럼 들릴 수도 있지만, 그것은 1600년에 셰익스피어의 <헨리 4세 2부>에서 처음 등장했다."]],"w":"2번 문장은 While swagger ~ may sound like a modern word, it first appeared in ~ 이에요. 현대적인 단어처럼 들리지만 '그것(swagger)'이 셰익스피어 작품에서 처음 등장했다는 말이라, it은 swagger를 가리켜요.","c":1},"h":"3157bcc2f4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He borrowed terms from other languages, such as when he changed the Dutch word randten into rant, meaning “to speak in a loud or wild manner.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 다른 언어들로부터 용어들을 차용했는데, 가령 그가 네덜란드어 ‘randten’을 ‘큰 소리로 또는 격렬하게 말하다’라는 의미의 ‘rant’로 바꾼 때와 같은 경우이다.","opts":["그는 네덜란드어 randten을 rant로 바꾸는 식으로 다른 언어의 용어를 빌려 왔다.","그는 영어 단어 rant를 네덜란드어 randten으로 바꾸었다.","그는 네덜란드어를 쓰지 않고 완전히 새로운 단어 rant를 지어냈다.","그는 다른 언어에서 용어를 빌려 오는 것을 금지했다."],"r":{"a":"1) 그는 네덜란드어 randten을 rant로 바꾸는 식으로 다른 언어의 용어를 빌려 왔다.","ev":"9번 문장","s":[[9,"He borrowed terms from other languages, such as when he changed the Dutch word randten into rant, meaning “to speak in a loud or wild manner.”","그는 다른 언어들로부터 용어들을 차용했는데, 가령 그가 네덜란드어 ‘randten’을 ‘큰 소리로 또는 격렬하게 말하다’라는 의미의 ‘rant’로 바꾼 때와 같은 경우이다."]],"w":"borrowed terms from other languages는 다른 언어에서 용어를 빌려 왔다는 뜻이고, such as when ~ 은 그 예예요. 네덜란드어 randten이 영어 rant로 바뀌었어요(반대 방향이 아니에요).","c":1},"h":"3f23e42cdb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["한 화자는 으스대며 걷는 사람이 여기 오지 말아야 한다고 말한다.","한 화자는 으스대며 걷는 사람이 여기서 환영받는다고 말한다.","한 화자는 으스대며 걷는 사람에게 여기 오라고 부탁한다.","한 화자는 여기 오는 모든 사람이 으스대며 걸어야 한다고 말한다."],"opts":["A speaker says that a man who swaggers should not come here.","A speaker says that a man who swaggers is welcome here.","A speaker asks a man who swaggers to come here.","A speaker says that everyone must swagger when they come here."],"r":{"a":"1) A speaker says that a man who swaggers should not come here. (한 화자는 으스대며 걷는 사람이 여기 오지 말아야 한다고 말한다.)","ev":"1번 문장","s":[[1,"“If he swaggers, let him not come here.”","“그가 으스대며 걷는다면, 그가 여기 오지 못하게 하라.”"]],"w":"1번은 \"그가 으스대며 걷는다면, 그가 여기 오지 못하게 하라\"는 뜻의 인용문이에요. let him not come here는 그가 여기 오지 않게 하라는 말이에요.","c":1},"h":"ad5a4041a3"},{"n":9,"t":"sum","q":"Shakespeare made new words by (A) two existing words, such as cold-hearted, which means “without (B).”","ko":"셰익스피어는 두 개의 기존 단어를 (A)하여 새 단어를 만들었는데, 예를 들어 cold-hearted는 ‘(B) 없는’을 의미한다.","oko":["(A) 결합 / (B) 동정심","(A) 결합 / (B) 돈","(A) 차용 / (B) 동정심","(A) 차용 / (B) 돈","(A) 절단 / (B) 돈"],"opts":["(A) combining / (B) sympathy","(A) combining / (B) money","(A) borrowing / (B) sympathy","(A) borrowing / (B) money","(A) cutting / (B) money"],"r":{"a":"1) (A) combining / (B) sympathy ((A) 결합 / (B) 동정심)","ev":"5번 문장","s":[[5,"One common technique was to combine two existing words, like cold-hearted meaning “without sympathy” or lack-luster meaning “dull.”","한 가지 일반적인 기법은 ‘동정심 없는’을 의미하는 ‘cold-hearted’나 ‘밋밋한’을 의미하는 ‘lack-luster’와 같이 두 개의 기존 단어를 결합하는 것이었다."]],"w":"5번에서 한 가지 기법은 두 개의 기존 단어를 결합하는(combine) 것이었고, cold-hearted는 동정심(sympathy) 없는이라는 뜻이라고 해요.","c":1},"h":"12df46d94f"},{"n":10,"t":"fill","q":"So whether [A] down the street or bone-weary with exhaustion, you can thank Shakespeare for [B] the English language.","ko":"그러므로 길을 [A] 걷든 기진맥진하여 지쳐 있든, 당신은 영어를 [B] 것에 대해 셰익스피어에게 감사할 수 있다.","bank":["swaggering","enriching","limiting","borrowing","rejecting","weakening"],"bko":{"swaggering":"으스대며 걷는","enriching":"풍부하게 하는","limiting":"제한하는","borrowing":"빌리는","rejecting":"거부하는","weakening":"약화시키는"},"r":{"a":"[A] swaggering, [B] enriching","ev":"10번 문장","s":[[10,"So whether swaggering down the street or bone-weary with exhaustion, you can thank Shakespeare for enriching the English language.","그러므로 당신이 으스대며 길을 걷고 있든 기진맥진하여 완전히 지쳐 있든, 당신은 영어를 풍부하게 한 것에 대해 셰익스피어에게 감사할 수 있다."]],"w":"10번 문장은 길을 으스대며 걷든(swaggering) 지쳐 있든, 영어를 풍부하게 한(enriching) 셰익스피어에게 감사하라는 뜻이에요. 영어를 제한하거나 약화시키거나 거부했다는 말은 본문과 맞지 않아요.","c":null},"h":"ce156902bf"}]},{"u":9,"id":"ms2-09-2","no":2,"ko":"아침에 열리고 오후엔 닫히는 것은?","items":[{"n":1,"t":"tf","q":"A morning glory usually blooms at dawn.","ko":"나팔꽃은 보통 새벽에 핀다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This trumpet-shaped flower usually blooms at dawn, only to wilt by the afternoon.","이 나팔 모양의 꽃은 보통 새벽에 피지만, 오후가 되면 결국 시들어버린다."]],"w":"3번 문장에 This trumpet-shaped flower usually blooms at dawn이라고 나와요.","c":"T"},"h":"5defd9ad98"},{"n":2,"t":"tf","q":"A morning glory needs a lot of water and rich soil to survive.","ko":"나팔꽃은 살아남으려면 많은 물과 비옥한 토양이 필요하다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Despite the flowers only lasting a short time, the plant itself is resilient; it thrives without much water or in poor soil.","꽃들이 짧은 시간만 지속됨에도 불구하고, 식물 자체는 회복력이 뛰어나며, 물이 많지 않거나 척박한 토양에서도 잘 자란다."]],"w":"10번 문장에서 it thrives without much water or in poor soil, 즉 물이 많지 않아도 척박한 토양에서도 잘 자란다고 해요.","c":"F"},"h":"27672001e0"},{"n":3,"t":"tf","q":"A morning glory flower blooms in about one to three months after it is planted.","ko":"나팔꽃은 심은 지 대략 1~3개월 뒤에 꽃이 핀다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Once planted, the flowers will bloom in about one to three months.","한번 심어지면, 대략 1~3개월 내에 꽃이 피게 된다."]],"w":"12번 문장에 Once planted, the flowers will bloom in about one to three months라고 나와요.","c":"T"},"h":"20a795e46f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (As the petal cells absorb water, the internal pressure increases, making the petals swell and unfold.)","ko":"꽃잎 세포가 물을 흡수함에 따라, 내부 압력이 증가하고, 꽃잎이 부풀어 오르고 펼쳐진다.","opts":["내뿜다","막다","흡수하다","옮기다"],"word":"absorb","r":{"a":"3) 흡수하다","ev":"8번 문장","s":[[8,"As the petal cells absorb water, the internal pressure increases, making the petals swell and unfold.","꽃잎 세포가 물을 흡수함에 따라, 내부 압력이 증가하고, 꽃잎이 부풀어 오르고 펼쳐진다."]],"w":"8번 문장은 꽃잎 세포가 물을 받아들이면 내부 압력이 올라가 꽃잎이 부풀어 오른다는 내용이에요. absorb = 흡수하다, 빨아들이다.","c":3},"h":"11034edc47"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The distinctive pattern is a result of exposure to sunlight in the morning.)","ko":"그 독특한 개화 패턴은 아침 햇빛에의 노출에 따른 결과이다.","opts":["평범한","위험한","불규칙한","독특한"],"word":"distinctive","r":{"a":"4) 독특한","ev":"5번 문장","s":[[5,"The distinctive pattern is a result of exposure to sunlight in the morning.","그 독특한 개화 패턴은 아침 햇빛에의 노출에 따른 결과이다."]],"w":"5번의 The distinctive pattern은 4번의 This unique blooming pattern과 같은 패턴이에요. unique(독특한)를 다른 말로 바꾼 것이라 distinctive = 독특한.","c":4},"h":"c10c3c0845"},{"n":6,"t":"ref","q":"What does the underlined \"these receptors\" refer to?\nOnce activated, these receptors send signals that cause water to flow into the cells of the flower buds.","ko":"밑줄 친 these receptors가 가리키는 것은?","sko":"일단 활성화되면, 이러한 수용체들은 꽃봉오리의 세포 안으로 물이 흘러들게 하는 신호를 보낸다.","opts":["광수용체","꽃봉오리","꽃잎","물"],"r":{"a":"1) 광수용체","ev":"7번 문장","s":[[7,"Once activated, these receptors send signals that cause water to flow into the cells of the flower buds.","일단 활성화되면, 이러한 수용체들은 꽃봉오리의 세포 안으로 물이 흘러들게 하는 신호를 보낸다."]],"w":"앞 문장 6번에서 이 식물들은 빛에 반응하는 광수용체(photoreceptors)라는 단백질을 가진다고 했어요. 7번의 these receptors는 그 광수용체를 가리키고, 활성화되면 꽃봉오리 세포로 물이 흘러들게 하는 신호를 보내요.","c":1,"k":"these receptors = 광수용체"},"pron":"these receptors","h":"4c88744066"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Perhaps for the few early risers who witness this brief but unforgettable blossom, no word feels more fitting than “glorious.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"어쩌면 이 짧지만 잊을 수 없는 광경을 목격하는 일찍 일어나는 소수의 사람들에게는, ‘영광스러운’이라는 말보다 더 어울리는 단어가 없을지도 모른다.","opts":["이 꽃을 보는 일찍 일어나는 사람은 많지만, 그들은 ‘영광스러운’이라는 말을 쓰지 않는다.","짧지만 잊을 수 없는 이 꽃을 보는 일찍 일어난 소수의 사람들에게는 ‘영광스러운’보다 더 어울리는 말이 없을 것이다.","일찍 일어나는 사람들은 이 꽃이 영광스럽지 않다고 느끼는 경우가 많다.","이 꽃은 오래 피어 있어서 늦게 일어나는 사람도 쉽게 볼 수 있다."],"r":{"a":"2) 짧지만 잊을 수 없는 이 꽃을 보는 일찍 일어난 소수의 사람들에게는 ‘영광스러운’보다 더 어울리는 말이 없을 것이다.","ev":"13번 문장","s":[[13,"Perhaps for the few early risers who witness this brief but unforgettable blossom, no word feels more fitting than “glorious.”","어쩌면 이 짧지만 잊을 수 없는 광경을 목격하는 일찍 일어나는 소수의 사람들에게는, ‘영광스러운’이라는 말보다 더 어울리는 단어가 없을지도 모른다."]],"w":"no word feels more fitting than “glorious”는 '영광스러운보다 더 어울리는 말이 없다'는 뜻이에요. the few early risers는 일찍 일어난 소수의 사람들이고, brief but unforgettable은 짧지만 잊을 수 없다는 뜻이에요.","c":2},"h":"41d944f3f4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["나팔꽃의 꽃은 아침부터 밤까지 계속 피어 있다.","나팔꽃이라는 이름은 이 식물의 독특한 개화 패턴에서 왔다.","나팔꽃의 광수용체는 오후의 열에 반응한다.","이 식물의 덩굴은 한 계절에 약 3센티미터 자란다."],"opts":["The flowers of a morning glory stay open from morning until night.","The name morning glory comes from the plant’s unique blooming pattern.","The photoreceptors in a morning glory react to the heat of the afternoon.","The vines of the plant grow about three centimeters in a season."],"r":{"a":"2) The name morning glory comes from the plant’s unique blooming pattern.","ev":"4번 문장","s":[[4,"This unique blooming pattern gives this plant its poetic name, morning glory.","이 독특한 개화 패턴은 이 식물에게 ‘아침의 영광(나팔꽃)’이라는 시적인 이름을 부여한다."]],"w":"4번 문장에서 독특한 개화 패턴이 morning glory라는 이름을 준다고 해요. ①은 3번·9번(오후에 시들고 닫힘), ③은 6번(빛에 반응), ④는 11번(최대 3미터)과 달라요.","c":2},"h":"a90cd2b5e2"},{"n":9,"t":"sum","q":"By afternoon, (A) temperatures and less light make the petals lose their (B) and close.","ko":"오후쯤이 되면, (A) 온도와 줄어든 빛 때문에 꽃잎이 (B)을(를) 잃고 닫힌다.","oko":["(A) 따뜻한 / (B) 수분","(A) 따뜻한 / (B) 색","(A)
