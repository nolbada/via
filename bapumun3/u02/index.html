", "아직"]], "h1": "[보기] He has done what has to be done.에서 현재완료가 '무슨 뜻'으로 쓰였는지 먼저 정하세요. 문장 전체의 뜻을 생각해 보세요.", "h2": "현재완료는 완료(막 끝냄), 경험(해 본 적), 계속(쭉 이어짐), 결과(그래서 지금 ~)로 나뉘어요. 보기마다 같은 뜻인지 하나씩 비교하세요.", "why": "[보기]는 '해야 할 일을 끝냈다'는 완료예요. ① She has not finished her work yet.(아직 끝내지 않았다)도 yet과 함께 쓰인 완료예요.", "opts": [{"n": "①", "en": "She has not finished her work yet.", "ko": "그녀는 아직 일을 끝내지 못했다.", "ok": true, "why": "yet(아직)과 함께 쓰인 완료라서 보기와 같아요."}, {"n": "②", "en": "Have you noticed anything wrong?", "ko": "뭔가 잘못된 걸 알아챈 적 있니?", "ok": false, "why": "경험을 묻는 현재완료예요."}, {"n": "③", "en": "He has lost the ring I gave to him.", "ko": "그는 내가 준 반지를 잃어버렸다.", "ok": false, "why": "결과(그래서 지금 없다)를 나타내요."}, {"n": "④", "en": "They have done many things since then.", "ko": "그들은 그때부터 많은 일을 해 왔다.", "ok": false, "why": "since(~ 이후로)와 쓰인 계속이에요."}, {"n": "⑤", "en": "I have seen the picture before.", "ko": "나는 그 그림을 전에 본 적이 있다.", "ok": false, "why": "before와 쓰인 경험이에요."}], "pencil": "현재완료: 완료, 경험, 계속, ___", "pencilKey": "결과", "page": 19, "sec": "s1"}, {"id": "S1-04", "step": 1, "no": 4, "qtype": "유형 01 현재완료", "type": "write", "ans": "have been", "concept": ["054", "055-2"], "gap": "", "words": [["How have you been?", "어떻게 지내?"], ["be", "~이다"], ["fine", "좋은"]], "h1": "A가 'How have you been?'이라고 물었어요. 현재완료로 물은 질문에는 대답도 같은 시제로 해요. 밑줄 친 I be가 맞는지 보세요.", "h2": "현재완료는 have[has] + 과거분사예요. be동사(~이다)의 과거분사는 been이에요.", "why": "질문이 현재완료이므로 대답도 현재완료예요. I be를 I have been(잘 지냈어)으로 고쳐요.", "opts": [], "pencil": "be의 과거분사는 ___이에요", "pencilKey": "been", "page": 19, "sec": "s1"}, {"id": "S1-05", "step": 1, "no": 5, "qtype": "유형 01 현재완료", "type": "mc", "ans": "①", "concept": ["054", "055"], "gap": "", "words": [["gone", "가 버린"], ["been", "가 본"], ["show", "보여 주다"], ["spend", "쓰다"], ["quite", "꽤"]], "h1": "밑줄 친 부분 중 어색한 것을 골라요. have gone to와 have been to는 뜻이 달라요. many times(여러 번)와 어떤 쪽이 어울리는지 보세요.", "h2": "have gone to는 '가고 지금 여기에 없다'이고, have been to는 '가 본 적이 있다'예요. many times(여러 번)는 어느 쪽 뜻일까요?", "why": "many times(여러 번)는 경험이라서 has been to(가 본 적이 있다)여야 해요. has gone은 '가 버렸다'라서 어색해요.", "opts": [{"n": "①", "en": "He has gone to his friend's house many times.", "ko": "그는 친구 집에 여러 번 가 봤다.", "ok": true, "why": "has gone은 '가고 없다'는 뜻이라 어색해요. has been이어야 해요. 그래서 정답이에요."}, {"n": "②", "en": "He has not been there.", "ko": "그는 그곳에 가 본 적이 없다.", "ok": false, "why": "경험의 부정이라서 맞아요."}, {"n": "③", "en": "She has shown me many good places.", "ko": "그녀는 내게 좋은 곳을 많이 보여 줬다.", "ok": false, "why": "현재완료 형태가 맞아요."}, {"n": "④", "en": "I have known him for a long time.", "ko": "나는 그를 오랫동안 알고 지냈다.", "ok": false, "why": "for와 쓰인 계속이라서 맞아요."}, {"n": "⑤", "en": "We have spent quite a lot of money.", "ko": "우리는 꽤 많은 돈을 썼다.", "ok": false, "why": "현재완료 형태가 맞아요."}], "pencil": "have been to는 '가 본 적이 있다', have gone to는 '가고 ___'", "pencilKey": "없다", "page": 19, "sec": "s1"}, {"id": "S1-06", "step": 1, "no": 6, "qtype": "유형 01 현재완료", "type": "write", "ans": "Have you ever watched the movie before?", "concept": ["054", "055-2"], "gap": "", "words": [["watch", "보다"], ["ever", "언젠가"], ["movie", "영화"], ["before", "전에"]], "h1": "(you, watched, movie, have, ever, before, the) '전에 그 영화를 본 적이 있습니까?'는 경험을 묻는 질문이에요. 질문이라서 맨 앞에 무엇이 와야 할까요?", "h2": "경험을 물을 때는 ever를 넣은 현재완료 의문문을 써요. 의문문에서는 도우미 동사가 주어 앞에 와요.", "why": "Have(조동사) + you(주어) + ever + watched(과거분사) + the movie + before 순서예요.", "opts": [], "pencil": "경험을 물을 때는 ___ + 주어 + ever + 과거분사", "pencilKey": "Have", "page": 19, "sec": "s1"}, {"id": "S1-07", "step": 1, "no": 7, "qtype": "유형 01 현재완료", "type": "mc", "ans": "③", "concept": ["054"], "gap": "", "words": [["repeat", "반복하다"], ["learn", "배우다"], ["airport", "공항"], ["stay", "머무르다"], ["since", "~ 이후로"]], "h1": "밑줄 친 현재완료의 뜻이 '나머지 넷과 다른' 하나를 찾아요. for(~ 동안)나 since(~ 이후로)가 있으면 어떤 용법인지 먼저 떠올리세요.", "h2": "현재완료의 뜻은 함께 쓰인 말이 단서예요. for, since 같은 기간 표현과 횟수를 말하는 표현은 서로 다른 뜻을 만들어요.", "why": "③ have been to the airport several times(공항에 여러 번 가 봤다)는 경험이에요. 나머지는 for나 since가 있는 계속이에요.", "opts": [{"n": "①", "en": "I have repeated the song for a week.", "ko": "나는 일주일 동안 그 노래를 반복해 왔다.", "ok": false, "why": "for a week(일주일 동안)가 있는 계속이에요."}, {"n": "②", "en": "I have learned Chinese for two years.", "ko": "나는 2년 동안 중국어를 배워 왔다.", "ok": false, "why": "for two years가 있는 계속이에요."}, {"n": "③", "en": "I have been to the airport several times.", "ko": "나는 공항에 여러 번 가 봤다.", "ok": true, "why": "several times(여러 번)가 있는 경험이에요. 그래서 정답이에요."}, {"n": "④", "en": "I have cleaned my room since I was a kid.", "ko": "나는 어릴 때부터 내 방을 청소해 왔다.", "ok": false, "why": "since가 있는 계속이에요."}, {"n": "⑤", "en": "I have stayed here during the whole vacation.", "ko": "나는 방학 내내 여기에 머물러 왔다.", "ok": false, "why": "방학 내내 이어졌으니 계속이에요."}], "pencil": "for, since가 보이면 ___, several times가 보이면 경험", "pencilKey": "계속", "page": 19, "sec": "s1"}, {"id": "S1-08", "step": 1, "no": 8, "qtype": "유형 01 현재완료", "type": "write", "ans": "has gone", "concept": ["055"], "gap": "", "words": [["go", "가다"], ["gone", "가 버린"], ["Spain", "스페인"], ["here", "여기"]], "h1": "James went to Spain and he is not here. '스페인에 가서 지금 여기에 없다'는 뜻을 현재완료로 바꿔요.", "h2": "'가고 지금 없다'를 말하는 결과의 현재완료는 go의 과거분사를 써요. James는 3인칭 단수예요.", "why": "'스페인에 가고 여기에 없다'는 has gone to(~에 가고 없다)로 말해요.", "opts": [], "pencil": "~에 가고 없다 = have[has] ___ to", "pencilKey": "gone", "page": 19, "sec": "s1"}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 01 현재완료", "type": "mc", "ans": "④", "concept": ["055", "055-H1"], "gap": "", "words": [["already", "벌써"], ["now", "지금"], ["ago", "~ 전에"], ["yesterday", "어제"], ["last month", "지난달"]], "h1": "A가 'Have you ___ read this book?'이라고 물었어요. 현재완료와 잘 어울리는 말을 고르세요.", "h2": "yet, just 같은 말은 현재완료와 잘 쓰여요. 과거의 한 시점을 말하는 표현은 현재완료와 함께 쓸 수 없어요. 보기에서 그런 표현을 하나씩 지워 보세요.", "why": "'너 벌써 이 책을 읽었니?'라는 뜻이라서 already(벌써)가 맞아요.", "opts": [{"n": "①", "en": "now", "ko": "지금", "ok": false, "why": "지금을 뜻해서 '읽었니'와 뜻이 어울리지 않아요."}, {"n": "②", "en": "ago", "ko": "~ 전에", "ok": false, "why": "과거 시점을 말해서 현재완료와 함께 쓸 수 없어요."}, {"n": "③", "en": "yesterday", "ko": "어제", "ok": false, "why": "과거 시점이라서 현재완료와 함께 r. 'by the end of this year(올해 말까지)'는 미래의 한 때예요. will work로 충분한지 보세요.", "h2": "미래의 어느 때까지 이어지는 일은 미래완료로 말해요. 미래완료에서 will 뒤에 무엇이 이어지는지 떠올려 보세요.", "why": "올해 말까지 9년 동안 일한 것이 되니까 will work를 will have worked(원형 work 일하다)로 고쳐요.", "opts": [], "pencil": "미래의 때까지 이어진 일은 will have + ___", "pencilKey": "과거분사", "page": 23, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "통합형", "type": "mc", "ans": "④", "concept": ["057-2", "054", "014"], "gap": "", "words": [["call back", "다시 전화하다"], ["lunch", "점심"], ["by then", "그때까지"], ["each other", "서로"], ["know", "알다"]], "h1": "두 문장을 따로 풀어요. 첫째는 '2시에 다시 전화해, 그때까지는 점심을 먹었을 거야'이고, 둘째는 '우리는 5년째 서로 알아 왔다'예요.", "h2": "첫째는 by then(그때까지)이라는 미래의 한 때가, 둘째는 for five years(5년 동안)가 단서예요. 각각 어떤 시제와 어울리는지 떠올려 보세요.", "why": "첫째는 will have finished(원형 finish 끝내다), 둘째는 have known(원형 know 알다)이 맞아요. know는 '서로 알다'라서 are known(알려진다)은 틀려요.", "opts": [{"n": "①", "en": "has finished - know", "ko": "끝냈다 - 안다", "ok": false, "why": "첫째는 미래 시점(by then)과 맞지 않고 둘째도 계속의 뜻이 없어요."}, {"n": "②", "en": "had been finished - have known", "ko": "끝나졌었다 - 알아 왔다", "ok": false, "why": "been finished는 수동이라서 틀려요."}, {"n": "③", "en": "had been finished - are known", "ko": "끝나졌었다 - 알려진다", "ok": false, "why": "수동 모양이라서 둘 다 틀려요."}, {"n": "④", "en": "will have finished - have known", "ko": "끝내 놓을 것이다 - 알아 왔다", "ok": true, "why": "미래완료와 현재완료 계속이라서 맞아요."}, {"n": "⑤", "en": "will have finished - are known", "ko": "끝내 놓을 것이다 - 알려진다", "ok": false, "why": "둘째 are known은 수동이라서 틀려요."}], "pencil": "미래의 때까지 끝나 있을 일은 will + ___ + 과거분사", "pencilKey": "have", "page": 24, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "통합형", "type": "mc", "ans": "②", "concept": ["057-2", "057", "054"], "gap": "", "words": [["wear", "입다"], ["suit", "정장"], ["arrive", "도착하다"], ["until", "~할 때까지"], ["buy", "사다"]], "h1": "빈칸에 들어갈 말이 나머지 넷과 '다른' 하나를 찾아요. 각 문장에서 빈칸 앞뒤 단어를 보고 어떤 완료인지 정하세요.", "h2": "과거완료는 had + 과거분사, 미래완료는 will have + 과거분사예요. 각 빈칸 바로 앞에 어떤 말이 있는지 보세요.", "why": "②는 'We will ___ arrived'라서 미래완료의 have가 들어가요. 나머지 넷은 과거완료의 had예요.", "opts": [{"n": "①", "en": "I ___ never worn a suit until I turned 20.", "ko": "나는 20살이 될 때까지 정장을 입어 본 적이 없었다.", "ok": false, "why": "과거완료라서 had가 들어가요."}, {"n": "②", "en": "We will ___ arrived at the station by 7 p.m.", "ko": "우리는 오후 7시까지 역에 도착해 있을 것이다.", "ok": true, "why": "will 뒤라서 have가 들어가요. 그래서 정답이에요."}, {"n": "③", "en": "I ___ already finished my homework when Mom arrived.", "ko": "엄마가 도착했을 때 나는 이미 숙제를 끝냈었다.", "ok": false, "why": "과거완료라서 had가 들어가요."}, {"n": "④", "en": "He ___ lived in Seoul until he moved to Ulsan.", "ko": "그는 울산으로 이사하기 전까지 서울에 살았었다.", "ok": false, "why": "과거완료라서 had가 들어가요."}, {"n": "⑤", "en": "My sisters gave me cookies that they ___ bought in Japan.", "ko": "누나들은 일본에서 산 쿠키를 내게 줬다.", "ok": false, "why": "먼저 산 일이라서 had가 들어가요."}], "pencil": "will 뒤 빈칸에는 ___ 가 들어가요", "pencilKey": "have", "page": 24, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "통합형", "type": "mc", "ans": "④", "concept": ["057", "055-H1"], "gap": "", "words": [["forget", "잊다"], ["leave", "떠나다"], ["fall asleep", "잠들다"], ["ring", "반지"], ["before", "~ 전에"]], "h1": "옳은 문장을 찾아요. 각 문장에서 먼저 일어난 일이 무엇인지 순서를 줄 세워 보세요.", "h2": "먼저 일어난 일에만 had + 과거분사를 써요. 나중 일은 과거시제로 써요. 순서가 거꾸로면 틀린 문장이에요.", "why": "④는 새 반지를 산 뒤에 잃어버린 반지를 찾았다는 순서가 자연스러워요. 먼저 산 일이 had bought(원형 buy 사다)로 맞아요.", "opts": [{"n": "①", "en": "I had forgotten what you did yesterday.", "ko": "나는 네가 어제 한 일을 잊고 있었다.", "ok": false, "why": "잊은 일보다 네가 한 일이 먼저예요. 먼저 한 쪽에 had done을 써야 해서 틀려요."}, {"n": "②", "en": "Jack has left before we arrived in Paris.", "ko": "Jack은 우리가 파리에 도착하기 전에 떠났다.", "ok": false, "why": "과거 기준보다 먼저라 had left여야 해요."}, {"n": "③", "en": "I fell asleep before I finished the project.", "ko": "나는 프로젝트를 끝내기 전에 잠들었다.", "ok": false, "why": "잠든 일이 먼저라 had fallen이어야 어색하지 않아요."}, {"n": "④", "en": "He found his ring after he had bought a new one.", "ko": "그는 새 반지를 산 뒤에 자기 반지를 찾았다.", "ok": true, "why": "산 일이 먼저라 had bought라서 맞아요."}, {"n": "⑤", "en": "She didn't want to see th    var labs=d.opts.map(function(o){return o.n});
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[];
   h+='<div class="choices'+(labs.length===2?' two':'')+'">'+labs.map(function(l){return '<button class="ch" style="'+(multi&&sel.indexOf(l)>=0?'background:var(--soft);border-color:var(--a)':'')+'" onclick="'+(multi?'tog':'pick')+'(\''+d.id+'\',\''+l+'\')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+=multi?'<div class="meter">정답이 두 개예요. 모두 누른 뒤 확인을 눌러요</div><button class="btn p" onclick="confirmMulti(\''+d.id+'\')">확인</button>':'<div class="meter">책의 답을 골라 누르면 바로 확인돼요</div>';
  }else{
   h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div>';
   h+='<button class="btn p" onclick="showW(\''+d.id+'\')">정답 확인</button>';
  }
 }else{
  h+=answerView(d,r);
 }
 h+='</div>';
 h+='<div class="nav">'+(st.idx>0?'<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>':'')+'<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button></div>';
 app.innerHTML=h;
}
function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
