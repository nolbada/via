<html lang="ko"><head><meta charset="utf-8">

<title>4과 기본 문장 분석</title>
<style>
/* Layout: one narrow column, phone-first. Home = Day grid; Play = 3-step card (order, role, meaning); roles are color-coded. */
:root{

  --o-bg:#dcfce7; --o-fg:#166534;
  --io-bg:#cffafe; --io-fg:#155e75;
  --do-bg:#ecfccb; --do-fg:#3f6212;
  --c-bg:#ffedd5; --c-fg:#9a3412;
  --oc-bg:#fef3c7; --oc-fg:#92400e;

}

  --accent:#2dd4bf; --accent-fg:#04201d; --good:#4ade80; --bad:#f87171; --bad-bg:#3a1d1f; --good-bg:#15301f;
  --s-bg:#1e2f5c; --s-fg:#bfdbfe; --v-bg:#3a4658; --v-fg:#e2e8f0; --o-bg:#14392a; --o-fg:#bbf7d0;
  --io-bg:#0f3a44; --io-fg:#a5f3fc; --do-bg:#2d3a12; --do-fg:#d9f99d; --c-bg:#4a2410; --c-fg:#fed7aa;
  --oc-bg:#46330a; --oc-fg:#fde68a; --m-bg:#34235e; --m-fg:#ddd6fe; --cj-bg:#2f3340; --cj-fg:#d1d5db;
  --hl:#a16207;--hlfg:#fff7d6;color-scheme:dark}}
:root[data-theme="dark"]{

  --oc-bg:#46330a; --oc-fg:#fde68a; --m-bg:#34235e; --m-fg:#ddd6fe; --cj-bg:#2f3340; --cj-fg:#d1d5db;

*{box-sizing:border-box}
.cp{margin-top:10px;padding:12px;border:1.5px dashed var(--accent);border-radius:12px;background:var(--bg)}
.cpl{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
.ckv{border:2.5px solid var(--v-fg);border-radius:999px;padding:1px 8px}
.hlm{background:var(--hl);color:var(--hlfg);padding:1px 3px;border-radius:3px}
.cpw{font-size:16px;font-weight:700;margin:6px 0 0}
.rtask{margin-top:12px}
.cmb{display:block;font-size:12.5px;font-weight:700;color:var(--good);line-height:1.3;margin-top:1px}
.cflow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start}
.cch{display:flex;flex-direction:column;gap:3px;min-width:0}

.rec-l{font-size:15px;margin-top:4px}

.trkrow{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;font:inherit;cursor:pointer}
.trks{margin-top:8px}.trke{font-size:15px;font-weight:600;line-height:1.4}.trkk{font-size:13px;color:var(--good);margin-top:2px}.trkh{font-size:12px;color:var(--muted);margin-top:6px}
.popq{margin-top:12px}
.trkrow.on{border-color:var(--good);background:var(--good-bg)}
.trkrow span{display:block}.trkt{font-size:12px;color:var(--muted)}.trkw{font-size:18px;margin:2px 0}.trkd{font-size:14px}
.trkchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.trkchip{padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:inherit;font:inherit;font-size:13px;cursor:pointer}.trkchip.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.rec-sub{font-size:13px;color:var(--muted);margin-top:2px}

.rec-q{font-size:13px;color:var(--muted);margin-top:6px}
.rec-c{font-size:13px;color:var(--muted);margin-top:10px}
.wbox{margin-top:12px}.wrow{padding:10px 0;border-top:1px solid var(--line)}.wrow:first-of-type{border-top:0}.wn{font-size:12px;color:var(--muted)}.wen{font-size:16px;font-weight:600;line-height:1.5;margin-top:2px}.wko{font-size:14px;color:var(--good);line-height:1.5;margin-top:3px}
.rec-f{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.hrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hrow span{color:var(--muted);flex:none}
.hrow b{text-align:right;font-weight:600}
.rtask.done{opacity:.75}
body{background:var(--bg);color:var(--fg);font-family:var(--ko);font-size:16px;line-height:1.55;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{font-weight:900;letter-spacing:.02em;font-size:17px}

.pts{font-family:var(--en);font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}

.lead{color:var(--muted);margin:0 0 4px;font-size:15px}

.day{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;min-height:64px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

.day.done{border-color:var(--accent)}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.back{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px}
.ttl{font-weight:700;font-size:17px;text-align:center;flex:1}

.pcount{font-size:13px;color:var(--muted);margin-bottom:12px;font-family:var(--en)}
.steps.two{grid-template-columns:1fr 1fr}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.steps div{text-align:center;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:700;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.steps div.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.steps div.ok{color:var(--good);border-color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.ask{margin:0 0 12px;font-weight:700;font-size:17px;text-wrap:balance}
.line{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.line .ph{color:var(--muted);font-size:14px;padding-inline:4px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.tile{font-family:var(--en);font-size:17px;padding:10px 14px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);overflow-wrap:anywhere;text-align:left}
.line .tile{background:var(--surface);border-color:var(--accent)}
.tile.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.tile.good{background:var(--good-bg);border-color:var(--good)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px;color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-weight:700;font-size:16px;width:100%;margin-top:14px}
.krow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;padding:10px;background:var(--bg);border-radius:10px;min-height:48px}
.klbl{font-size:12px;font-weight:700;color:var(--muted);width:100%}
.kblk{font:inherit;font-size:14px;cursor:pointer;padding:6px 10px;border-radius:8px;background:var(--surface);border:1.5px solid var(--good);color:var(--good);font-size:14px;font-weight:700}
.kblk.go{box-shadow:0 0 0 2px var(--accent)}
.rslot{min-height:24px;text-align:center;font-size:13px;font-weight:700;border-radius:6px;padding:2px 6px}
.minp{width:100%;box-sizing:border-box;padding:12px;font-size:16px;font-family:var(--en);border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:inherit}
.mission{margin-top:12px}
.mline{margin:0 0 8px;font-size:15px;line-height:1.5}
.mdir{margin:0;font-size:15px;font-weight:700}
.mk{display:inline-block;padding:2px 8px;border-radius:6px;font-size:13px;margin-right:4px}
.mans{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.msent{margin:0 0 10px;font-family:var(--en);font-size:15px;line-height:1.6}
.kfull{margin:0;font-size:16px;font-weight:700;line-height:1.5}
.kflow{display:flex;flex-wrap:wrap;gap:6px}
.r2.down{animation:slideDown .35s ease both}
@keyframes slideDown{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.kslot.wait{border-top-color:var(--accent);min-height:24px}
.kdone{font-size:13px;color:var(--muted)}
.hint{margin:12px 0 0;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:15px}
.msg{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:700}
.msg.ok{background:var(--good-bg);color:var(--good)}
.bememo{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:#fff4d6;border:2px solid #f0b429;color:#5b3d00;font-size:14.5px;line-height:1.55}.bememo b.t{display:block;font-size:15.5px;margin-bottom:4px}.bememo .pr{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:8px;background:#fff;border:1px solid #f0b429;font-weight:800}.bememo .x{color:#c0392b;text-decoration:line-through;font-weight:700}
.today{text-align:left;margin:12px 0 4px;border-top:1px dashed var(--line);padding-top:10px}.tdh{font-size:14px;font-weight:800;margin-bottom:6px}.tdi{margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}.tdn{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}.tdk{font-size:13px;color:var(--muted);margin-top:4px}.tdko{font-size:15px;font-weight:700;margin-top:3px}.tdm{margin-top:5px;font-size:12.5px;color:#7a4b00;background:#fff4d6;border-radius:8px;padding:4px 8px}
.notestrip{display:block;width:100%;margin:0 0 12px;padding:11px 14px;border:2px solid #e0a100;border-radius:12px;background:#fff4d6;color:#5b3d00;font:inherit;font-size:15px;font-weight:800;text-align:left;cursor:pointer}.nbox{margin:12px 0 0;padding:14px;border:1px solid var(--line);border-radius:14px;background:var(--surface)}.nbox .nt{font-size:14px;font-weight:800;margin:0 0 6px}.ni{margin:0 0 14px;padding:0 0 12px;border-bottom:1px solid var(--line)}.ni .nn{font-size:12px;font-weight:700;color:var(--muted);margin-bottom:2px}.ni .nen{font-size:16px;font-weight:700;line-height:1.5}.ni .nko{font-size:14px;color:var(--muted);margin-top:2px}.ni ul{margin:8px 0 0;padding:0 0 0 18px;font-size:14px;line-height:1.6}.ni .nd{margin-top:6px;font-size:13px;color:var(--muted);line-height:1.5}.today{text-align:left;margin:12px 0 4px;border-top:1px dashed var(--line);padding-top:10px}.tdh{font-size:14px;font-weight:800;margin-bottom:6px}.tdi{margin:0 0 14px;padding-bottom:10px;border-bottom:1px solid var(--line)}.tdn{font-size:12px;color:var(--muted);font-weight:700;margin-bottom:2px}.tdk{font-size:13px;color:var(--muted);margin-top:4px}.tdko{font-size:15px;font-weight:700;margin-top:3px}.tdm{margin-top:5px;font-size:12.5px;color:#7a4b00;background:#fff4d6;border-radius:8px;padding:4px 8px}.bememo{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:#fff4d6;border:2px solid #f0b429;color:#5b3d00;font-size:14.5px;line-height:1.55}.bememo b.t{display:block;font-size:15.5px;margin-bottom:4px}.bememo .pr{display:inline-block;margin:2px 4px 2px 0;padding:2px 8px;border-radius:8px;background:#fff;border:1px solid #f0b429;font-weight:800}.bememo .x{color:#c0392b;text-decoration:line-through;font-weight:700}
.msg.no{background:var(--bad-bg);color:var(--bad)}
.r2{padding:12px 0;border-top:1px solid var(--line)}
.r2:first-of-type{border-top:0}
.r2 .chunk{font-family:var(--en);font-size:18px;font-weight:500;margin-bottom:8px;overflow-wrap:anywhere}
.r2.done{display:flex;align-items:center;justify-content:space-between;gap:10px}
.r2.done .chunk{margin:0}
.tgt{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;min-height:44px;font-weight:500}
.opt.bad{text-decoration:line-through;color:var(--bad);border-color:var(--bad);background:var(--bad-bg);opacity:.8}
.tg{background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:2px 8px;font-weight:600}
.qsent{font-family:var(--en);font-size:20px;line-height:2.1;margin:6px 0 16px;overflow-wrap:anywhere}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qopts .opt{min-height:48px;font-size:16px;padding:10px 16px}
.quizbtn{width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:14px 16px;margin:16px 0 4px;min-height:60px}
.quizbtn b{display:block;font-size:17px;color:var(--accent)}
.quizbtn span{font-size:14px;color:var(--muted)}
.badge,.blk{border-radius:8px;font-weight:700}
.badge{padding:4px 10px;font-size:14px;white-space:nowrap}
.role-s{background:var(--s-bg);color:var(--s-fg)}.role-v{background:var(--v-bg);color:var(--v-fg)}
.role-o{background:var(--o-bg);color:var(--o-fg)}.role-io{background:var(--io-bg);color:var(--io-fg)}
.role-do{background:var(--do-bg);color:var(--do-fg)}.role-c{background:var(--c-bg);color:var(--c-fg)}
.role-oc{background:var(--oc-bg);color:var(--oc-fg)}.role-m{background:var(--m-bg);color:var(--m-fg)}
.role-cj{background:var(--cj-bg);color:var(--cj-fg)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}

.tile.hl{box-shadow:0 0 0 4px #f97316;border-color:#f97316;background:#ffedd5;color:#7c2d12}

var KEYS='tbm2d-l4-b';
var CLS={'주어':'s','동사':'v','목적어':'o','간접목적어':'io','직접목적어':'do','보어':'c','목적격보어':'oc','수식어':'m','접속사':'cj'};
var ORDER=['주어','동사','목적어','간접목적어','직접목적어','보어','목적격보어','수식어','접속사'];
var app=document.getElementById('app');
var store={done:{}};
try{var o=JSON.parse(localStorage.getItem(KEYS)||'null');if(o&&o.done)store=o;}catch(e){}
function save(){try{localStorage.setItem(KEYS,JSON.stringify(store));}catch(e){}}
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;'}[c];});}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t;}return a;}
var I=0,C=null;
function badge(r){return '<span class="badge role-'+CLS[r]+'">'+r+'</span>';}
function home(){
  C=null;
  var done=0;DATA.forEach(function(s){if(store.done[s.id]!=null)done++;});
  var h='<a class="tback" href="../">&larr; 4과 목록</a><h1>4과 기본 문장 분석</h1><p class="lead">교과서 본문 · 뜻 잇기, 성분, 어순 ('+DATA.length+'문장)</p><p class="lead" style="margin-top:8px">푼 문장 '+done+' / '+DATA.length+'</p>';
  var last=null,open=false;
  DATA.forEach(function(s,k){
    if(s.sec!==last){if(open)h+='</div>';h+='<div class="sec">'+esc(s.sec||'')+'</div><div class="days">';open=true;last=s.sec;}
    var d=store.done[s.id];
    h+='<button class="day'+(d!=null?' done':'')+'" data-act="go" data-i="'+k+'"><span class="dn">'+esc(s.id.replace(/^\d+-/,''))+'</span><span class="st">'+(d==null?'':(d?'실수 '+d:'완료'))+'</span></button>';
  });
  if(open)h+='</div>';
  if(done)h+='<div class="two"><button class="ghost" data-act="reset">기록 지우기</button></div>';
  app.innerHTML=h;window.scrollTo(0,0);
}
function start(i){
  I=i;var s=DATA[i],n=s.ch.length,idx=[];
  for(var k=0;k<n;k++)idx.push(k);
  var pool=shuffle(idx),tries=0;
  while(tries++<30&&pool.every(function(ci,k){return ci===k;}))pool=shuffle(idx);
  var kd={};s.ch.forEach(function(c,k){if(!c.k)kd[k]=true;});
  C={s:s,n:n,step:1,ph:'K',kdone:kd,roles:idx.map(function(){return null;}),bad:idx.map(function(){return {};}),
     done2:false,placed:[],pool:pool,wrong:false,done1:false,w3:0,mist:0,flash:null,msg:null,lastDrop:null};
  if(curK()<0)C.ph='R';
  render();window.scrollTo(0,0);
}
function curK(){for(var k=0;k<C.n;k++)if(!C.kdone[k])return k;return -1;}
function curA(){for(var k=0;k<C.n;k++)if(!C.roles[k])return k;return -1;}
function render(){
  var s=C.s;
  var h='<div class="top"><button class="back" data-act="home">목록</button><div class="ttl">'+esc(s.id)+'</div><div class="pts">실수 <b>'+C.mist+'</b></div></div>'
   +'<div class="prog"><i style="width:'+(I/DATA.length*100)+'%"></i></div><div class="pcount">문장 '+(I+1)+' / '+DATA.length+'</div>';
  if(C.step<3)h+='<div class="steps two"><div class="'+(C.step===1?'on':'ok')+'">1 뜻·성분</div><div class="'+(C.step===2?'on':'')+'">2 어순</div></div>';
  h+='<div class="card">'+(C.step===1?vA():C.step===2?v1():v4())+'</div>';
  app.innerHTML=h;
}
function kordIdx(){return C.s.kord;}
function vA(){
  var s=C.s,ph=C.ph,cur=ph==='K'?curK():curA();
  var ask=ph==='K'?'빛나는 영어 블록의 우리말 뜻을 위에서 골라요':'빛나는 블록의 성분(역할)을 골라요';
  if(C.done2)ask='뜻과 성분을 모두 붙였어요';
  var h='<p class="ask">'+ask+'</p>';
  if(ph==='K'){
    var idx=kordIdx().filter(function(k){return !C.kdone[k];});
    if(idx.length)h+='<div class="krow"><span class="klbl">우리말 뜻</span><div class="kflow">'+idx.map(function(k){
      var bad=C.flash&&C.flash.k===k;
      return '<button class="kblk go'+(bad?' bad shake':'')+'" data-act="pickK" data-k="'+k+'">'+esc(s.ch[k].k)+'</button>';
    }).join('')+'</div></div>';
  }
  h+='<div class="stage">'+s.ch.map(function(c,k){
    var r=C.roles[k],kd=C.kdone[k]&&c.k,act=(k===cur&&!C.done2);
    var top='<div class="kslot'+(kd?' filled'+(k===C.lastDrop?' drop':''):(act&&ph==='K'?' wait':''))+'">'+(kd?esc(c.k):'')+'</div>';
    var mid=r?'<div class="sblk st2 role-'+CLS[r]+'"><b>'+esc(c.t)+'</b></div>'
       :'<div class="sblk wait'+(act?' now':'')+'"><b>'+esc(c.t)+'</b></div>';
    var bot='<div class="rslot'+(r?' role-'+CLS[r]:'')+'">'+(r?esc(r):'')+'</div>';
    return '<div class="col3">'+top+mid+bot+'</div>';
  }).join('')+'</div>';
  if(C.msg)h+='<p class="msg no">'+C.msg+'</p>';
  if(ph==='R'&&cur>=0){
    var c0=s.ch[cur],set={'주어':1,'동사':1,'목적어':1,'보어':1,'수식어':1};
    s.ch.forEach(function(c){set[c.r]=1;});
    var opts=ORDER.filter(function(r){return set[r];});
    h+='<div class="r2 down" data-rk="'+cur+'"><div class="chunk">'+esc(c0.t)+(c0.a?'<small class="tgt">꾸미는 대상: '+esc(c0.a.replace(/\s*수식$/,''))+'</small>':'')+'</div><div class="opts">'+opts.map(function(r){
      var b=C.bad[cur][r];
      return '<button class="opt'+(b?' bad':'')+'"'+(b?' disabled':'')+' data-act="roleA" data-k="'+cur+'" data-r="'+r+'">'+r+'</button>';
    }).join('')+'</div></div>';
  }
  if(C.done2)h+='<p class="msg ok">뜻과 성분 완성.</p><button class="primary" data-act="next1">다음 단계: 어순</button>';
  return h;
}
function tile(ci){
  var bad=C.flash&&C.flash.b===ci;
  var hl=C.w3>=2&&!C.done1&&C.s.ch[ci].t===C.s.ch[C.placed.length].t;
  return '<button class="tile'+(bad?' bad shake':'')+(hl?' hl':'')+'" data-act="pick" data-i="'+ci+'">'+esc(C.s.ch[ci].t)+'</button>';
}
function kRow(){
  var idx=kordIdx().filter(function(k){return C.placed.indexOf(k)<0;});
  return '<div class="krow"><span class="klbl">우리말 해석</span><div class="kflow">'+(idx.length?idx.map(function(k){return '<span class="kblk">'+esc(C.s.ch[k].k)+'</span>';}).join(''):'<span class="kdone">해석이 모두 내려왔어요</span>')+'</div></div>';
}
function v1(){
  var s=C.s,p=C.placed.length;
  var h='<p class="ask">우리말 어순을 보고, 영어에서는 어떤 순서로 올지 찾아 쌓아요</p>'+kRow();
  h+='<div class="stage">'+s.ch.map(function(c,k){
    if(k<p)return '<div class="col3"><div class="sblk st2 role-'+CLS[c.r]+'"><b>'+esc(c.t)+'</b></div><div class="kslot filled'+(k===C.lastDrop?' drop':'')+'">'+(c.k?esc(c.k):'')+'</div></div>';
    return '<div class="col3"><div class="slot'+(k===p?' next':'')+'"></div><div class="kslot"></div></div>';
  }).join('')+'</div>';
  h+='<div class="pool">'+C.pool.map(function(ci){return tile(ci);}).join('')+'</div>';
  if(C.wrong)h+='<p class="msg no">그 블록은 다음 자리에 오지 않아요. 영어에서는 어떤 말이 올까요?</p>';
  if(C.done1)h+='<p class="msg ok">어순 완성.</p><button class="primary" data-act="next2">완성한 문장 보기</button>';
  return h;
}
function v4(){
  var s=C.s;
  var h='<p class="ask">완성한 문장</p><div class="sent">'+s.ch.map(function(c){
    return '<span class="blk role-'+CLS[c.r]+'"><b>'+esc(c.t)+'</b><small>'+esc(c.r)+'</small></span>';
  }).join('')+'</div><div class="seq"><span class="seqlbl">영어 어순</span>'+s.ch.map(function(c){return badge(c.r);}).join('<span class="arr">→</span>')+'</div>';
  h+='<p class="ask" style="font-size:14px;margin:4px 0 6px">우리말 어순으로 읽으면</p><div class="klinew">'+s.kord.map(function(k){var c=s.ch[k];return '<span class="kc role-'+CLS[c.r]+'">'+esc(c.k)+'</span>';}).join('')+'</div>';
  h+='<p class="kor">'+esc(s.ko)+'</p>';
  var mods=s.ch.filter(function(c){return c.c||(c.r==='수식어'&&c.a);});
  if(mods.length)h+='<ul class="notes">'+mods.map(function(c){
    var p=[];if(c.c)p.push(esc(c.c));if(c.a)p.push('꾸미는 대상: '+esc(c.a.replace(/\s*수식$/,'')));
    return '<li><span>'+esc(c.t)+'</span> '+p.join(' · ')+'</li>';
  }).join('')+'</ul>';
  if(s.note)h+='<div class="nbox2">'+esc(s.note)+'</div>';
  var g=GLOSS[s.id]||[];
  if(g.length)h+='<div class="gl"><div class="gh">이 문장의 단어</div>'+g.map(function(x){return '<div><b>'+esc(x[0])+'</b> '+esc(x[1])+(x[2]?' <small>('+esc(x[2])+')</small>':'')+'</div>';}).join('')+'</div>';
  h+='<p class="gain" style="margin-top:14px">이번 문장 '+(C.mist?'실수 <b>'+C.mist+'</b>개':'실수 없음')+'</p>';
  h+='<button class="primary" data-act="next">'+(I+1<DATA.length?'다음 문장':'목록으로')+'</button>';
  return h;
}
function finish(){store.done[C.s.id]=C.mist;save();}
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var a=b.getAttribute('data-act');
  if(a==='go'){start(+b.getAttribute('data-i'));return;}
  if(a==='home'){home();return;}
  if(a==='reset'){if(confirm('기록을 모두 지울까요?')){store={done:{}};save();home();}return;}
  if(!C)return;
  var s=C.s;
  if(a==='pickK'){
    var kk=+b.getAttribute('data-k'),cu=curK();if(cu<0)return;
    if(s.ch[kk].k===s.ch[cu].k){C.kdone[cu]=true;C.lastDrop=cu;C.flash=null;C.msg=null;if(curK()<0)C.ph='R';}
    else{C.mist++;C.flash={k:kk};C.msg=null;}
    render();return;
  }
  if(a==='roleA'){
    var kr=+b.getAttribute('data-k'),rr=b.getAttribute('data-r');
    if(s.ch[kr].r===rr){C.roles[kr]=rr;C.msg=null;if(curA()<0)C.done2=true;}
    else{C.bad[kr][rr]=true;C.mist++;C.msg='아니에요. 다시 골라 보세요.';}
    render();return;
  }
  if(a==='next1'){C.step=2;C.w3=0;C.flash=null;render();window.scrollTo(0,0);return;}
  if(a==='pick'){
    var ci=+b.getAttribute('data-i'),pp=C.placed.length;
    if(s.ch[ci].t===s.ch[pp].t){
      var at=C.pool.indexOf(ci);C.pool.splice(at,1);C.placed.push(pp);C.lastDrop=pp;C.wrong=false;C.flash=null;C.w3=0;
      if(C.placed.length===C.n)C.done1=true;
    }else{C.mist++;C.w3++;C.wrong=true;C.flash={b:ci};}
    render();return;
  }
  if(a==='next2'){C.step=3;finish();render();window.scrollTo(0,0);return;}
  if(a==='next'){if(I+1<DATA.length)start(I+1);else home();return;}
});
home();
})();
</script></body></html>
