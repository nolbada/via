생 한 곳에 머물지만, 그 씨앗은 살아남기 위해 이동해야 한다.","식물은 영원히 살기 때문에 씨앗은 움직일 필요가 없다.","씨앗은 안전하게 지내려고 어미 식물 가까이에 머문다."],"r":{"a":"2) Plants stay in one place for their entire lives, but their seeds must travel to survive. (식물은 평생 한 곳에 머물지만, 그 씨앗은 살아남기 위해 이동해야 한다.)","ev":"1번 문장","s":[[1,"Plants stay in one place for their entire lives, but their seeds must travel to survive.","식물은 평생 한 곳에 머물지만, 그 씨앗은 살아남기 위해 이동해야 한다."]],"w":"1번 문장 Plants stay in one place for their entire lives, but their seeds must travel to survive. 즉 식물은 한 곳에 머물지만 씨앗은 살아남기 위해 이동해야 함. 선지 1·3·4는 본문과 반대되거나 본문에 없는 내용임.","c":2},"h":"e23cd54c81"},{"n":9,"t":"sum","q":"To (B) this, plants have developed various (A) to spread their seeds.","ko":"이를 (B) 위해, 식물은 씨앗을 퍼뜨리는 다양한 (A)을(를) 발달시켜 왔다.","opts":["(A) ways / (B) prevent","(A) ways / (B) cause","(A) dreams / (B) prevent","(A) dreams / (B) cause","(A) ways / (B) enjoy"],"oko":["(A) 방법 / (B) 막기","(A) 방법 / (B) 일으키기","(A) 꿈 / (B) 막기","(A) 꿈 / (B) 일으키기","(A) 방법 / (B) 즐기기"],"r":{"a":"1) (A) ways / (B) prevent ((A) 방법 / (B) 막기)","ev":"3번 문장","s":[[3,"To prevent this, plants have developed various ways to spread their seeds.","이를 막기 위해, 식물은 씨앗을 퍼뜨리는 다양한 방법을 발달시켜 왔다."]],"w":"3번 문장 To prevent this, plants have developed various ways to spread their seeds. 즉 이 문제(앞 문장의 경쟁)를 막기(prevent) 위해 씨앗을 퍼뜨리는 다양한 방법(ways)을 발달시켰음. cause나 enjoy는 문장의 뜻과 맞지 않음.","c":1},"h":"e8d0f81cc4"},{"n":10,"t":"fill","q":"Burdock seeds have small [A] that attach to animal [B] and later fall off in distant areas.","ko":"우엉 씨앗은 동물의 [B]에 붙는 작은 [A]이(가) 있어서 나중에 멀리 떨어진 곳에서 떨어져 나간다.","bank":["hooks","fur","parachutes","oceans","sunlight","nutrients"],"bko":{"hooks":"갈고리","fur":"털","parachutes":"낙하산","oceans":"바다","sunlight":"햇빛","nutrients":"영양분"},"r":{"a":"[A] hooks (갈고리), [B] fur (털)","ev":"11번 문장","s":[[11,"Burdock seeds have small hooks that attach to animal fur and later fall off in distant areas.","우엉 씨앗은 동물의 털에 붙는 작은 갈고리가 있어서 나중에 멀리 떨어진 곳에서 떨어져 나간다."]],"w":"11번 문장 Burdock seeds have small hooks that attach to animal fur and later fall off in distant areas. 에서 가져옴. parachutes·oceans·sunlight·nutrients는 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null},"h":"f9f30851fc"}]},{"u":3,"id":"b4-03-4","no":4,"ko":"참치는 붉고 대구는 하얀 이유는?","items":[{"n":1,"t":"tf","q":"Fish whose muscles have a lot of myoglobin have deep red flesh.","ko":"근육에 미오글로빈이 많은 물고기는 살이 짙은 붉은색이다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","w":"7번에 a high level of myoglobin, which makes their flesh a deep red color가 있음. 미오글로빈이 많으면 짙은 붉은색 살이 된다는 내용과 일치.","c":"T","s":[[7,"Because of this, their muscles contain a high level of myoglobin, which makes their flesh a deep red color.","이 때문에 그들의 근육에는 미오글로빈이 많이 들어 있고, 이것이 그들의 살을 짙은 붉은색으로 만든다."]]},"h":"cf5e503060"},{"n":2,"t":"tf","q":"Cod and flatfish have deep red flesh because they swim constantly.","ko":"대구와 넙치류는 쉬지 않고 헤엄치기 때문에 살이 짙은 붉은색이다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","w":"10~11번에서 대구와 넙치류는 살이 옅거나 하얀 물고기의 예라고 함. 쉬지 않고 헤엄치는 물고기는 참치와 고등어(6번).","c":"F","s":[[10,"As a result, their flesh looks pale or white.","그 결과, 이들의 살은 옅거나 하얗게 보인다."],[11,"Fish such as cod and flatfish are examples of this.","대구와 넙치류 같은 물고기가 이것의 예이다."]]},"h":"4a8bf59208"},{"n":3,"t":"tf","q":"Myoglobin helps muscles make energy by delivering oxygen to them.","ko":"미오글로빈은 근육에 산소를 전달해 에너지를 만드는 것을 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번에 stores and delivers oxygen to the muscles to help them produce energy가 있음. 산소를 전달해 에너지 만들기를 돕는다는 내용과 일치.","c":"T","s":[[5,"Myoglobin stores and delivers oxygen to the muscles to help them produce energy.","미오글로빈은 산소를 저장하고 근육에 전달해 근육이 에너지를 만들도록 돕는다."]]},"h":"b0a15cda6a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... so they need a steady supply of oxygen to their muscles.)","ko":"... 그래서 그들은 근육에 산소가 ( ) 공급되어야 한다.","opts":["꾸준한, 일정한","갑작스러운","적은","위험한"],"word":"steady","r":{"a":"1) 꾸준한, 일정한","ev":"6번 문장","w":"6번에서 참치와 고등어는 쉬지 않고 헤엄치므로 산소도 끊기지 않고 계속 공급되어야 함. steady = 꾸준한. 갑자기 오거나 적게 필요하다면 쉬지 않고 헤엄칠 수 없음.","c":1,"s":[[6,"Fish like tuna and mackerel swim constantly and travel long distances, so they need a steady supply of oxygen to their muscles.","참치와 고등어 같은 물고기는 쉬지 않고 헤엄치며 먼 거리를 이동하기 때문에, 근육에 산소가 꾸준히 공급되어야 한다."]]},"h":"4a67b31727"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Since their muscles demand far less oxygen, they contain only a small amount of myoglobin.)","ko":"이들의 근육은 산소를 훨씬 적게 ( ) 때문에, 미오글로빈이 소량만 들어 있다.","opts":["저장하다","내보내다","필요로 하다, 요구하다","거부하다"],"word":"demand","r":{"a":"3) 필요로 하다, 요구하다","ev":"9번 문장","w":"9번에서 가만히 지내는 물고기의 근육은 산소가 조금만 필요함. demand far less oxygen = 산소를 훨씬 적게 필요로 한다는 뜻. '저장하다'는 5번 stores의 뜻이라 헷갈리기 쉬움.","c":3,"s":[[9,"Since their muscles demand far less oxygen, they contain only a small amount of myoglobin.","이들의 근육은 산소를 훨씬 적게 필요로 하기 때문에, 미오글로빈이 소량만 들어 있다."]]},"h":"e89c92e389"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nWhen you look at different kinds of fish, you may notice that their flesh comes in different colors.","ko":"밑줄 친 their이(가) 가리키는 것은?","sko":"여러 종류의 물고기를 보면, 그 살이 서로 다른 색을 띤다는 것을 알아챌 수 있다.","pron":"their","opts":["이 글을 읽는 사람","여러 종류의 물고기","살의 색깔들","물고기를 잡는 사람들"],"r":{"a":"2) 여러 종류의 물고기","ev":"1번 문장","s":[[1,"When you look at different kinds of fish, you may notice that their flesh comes in different colors.","여러 종류의 물고기를 보면, 그 살이 서로 다른 색을 띤다는 것을 알아챌 수 있다."]],"w":"their flesh에서 their는 문장 앞부분의 different kinds of fish(여러 종류의 물고기)를 가리킴. 살(flesh)이 서로 다른 색을 띠는 것은 물고기들임.","c":2,"k":"their = 여러 종류의 물고기"},"h":"b86e9e3254"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These differences are closely related to how the fish live and move.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이런 차이는 물고기가 어떻게 살고 움직이는지와 밀접하게 관련되어 있다.","opts":["물고기 살 색의 차이는 그 물고기의 크기와 밀접하게 관련되어 있다.","물고기가 어떻게 사는지는 살 색과 아무 관련이 없다.","물고기 살 색의 차이는 물고기가 어떻게 살고 움직이는지와 밀접하게 관련되어 있다.","물고기 살 색은 먹는 먹이에 따라서만 정해진다."],"r":{"a":"3) 물고기 살 색의 차이는 물고기가 어떻게 살고 움직이는지와 밀접하게 관련되어 있다.","ev":"3번 문장","s":[[3,"These differences are closely related to how the fish live and move.","이런 차이는 물고기가 어떻게 살고 움직이는지와 밀접하게 관련되어 있다."]],"w":"These differences는 앞 문장에서 말한 물고기 살 색의 차이. closely related to how the fish live and move는 물고기가 어떻게 살고 움직이는지와 밀접하게 관련되어 있다는 뜻이라 선지 3과 같음. 크기나 먹이 이야기는 본문에 없음.","c":3},"h":"c7dfaf01f2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["Myoglobin is a blue chemical found only in a fish’s bones.","A reddish protein called myoglobin is found inside a fish’s muscles.","A fish’s muscles do not contain any protein.","The reddish protein is found only in the skin of a fish."],"oko":["미오글로빈은 물고기의 뼈에서만 발견되는 푸른 화학 물질이다.","미오글로빈이라는 불그스름한 단백질이 물고기의 근육 속에 있다.","물고기의 근육에는 단백질이 전혀 들어 있지 않다.","그 불그스름한 단백질은 물고기의 피부에서만 발견된다."],"r":{"a":"2) A reddish protein called myoglobin is found inside a fish’s muscles. (미오글로빈이라는 불그스름한 단백질이 물고기의 근육 속에 있다.)","ev":"4번 문장","s":[[4,"Inside a fish’s muscles, there is a reddish protein called myoglobin.","물고기의 근육 속에는 미오글로빈이라는 불그스름한 단백질이 있다."]],"w":"4번 문장 Inside a fish’s muscles, there is a reddish protein called myoglobin. 즉 물고기의 근육 속에 미오글로빈이라는 불그스름한 단백질이 있음. 뼈·피부에서만 발견된다는 말이나 단백질이 없다는 말은 본문과 다름.","c":2},"h":"6b14486921"},{"n":9,"t":"sum","q":"Some fish have (A) flesh, while others are red or (B).","ko":"어떤 물고기는 살이 (A)이고, 다른 물고기는 붉거나 (B)이다.","opts":["(A) black / (B) green","(A) white / (B) orange","(A) white / (B) green","(A) black / (B) orange","(A) blue / (B) orange"],"oko":["(A) 검은색 / (B) 초록색","(A) 흰색 / (B) 주황색","(A) 흰색 / (B) 초록색","(A) 검은색 / (B) 주황색","(A) 파란색 / (B) 주황색"],"r":{"a":"2) (A) white / (B) orange ((A) 흰색 / (B) 주황색)","ev":"2번 문장","s":[[2,"Some fish have white flesh, while others are red or orange.","어떤 물고기는 살이 흰색이고, 다른 물고기는 붉거나 주황색이다."]],"w":"2번 문장 Some fish have white flesh, while others are red or orange. 즉 어떤 물고기는 살이 흰색(white)이고 다른 물고기는 붉거나 주황색(orange)임. 검은색·초록색·파란색은 본문에 없음.","c":2},"h":"2f2c0f790b"},{"n":10,"t":"fill","q":"In contrast, many fish remain still for most of the [A] and move only when they must escape [B] or catch prey.","ko":"반면에, 많은 물고기는 [A] 대부분 가만히 있다가 [B]을(를) 피하거나 먹이를 잡아야 할 때만 움직인다.","bank":["day","danger","flesh","color","protein","energy"],"bko":{"day":"하루","danger":"위험","flesh":"살","color":"색","protein":"단백질","energy":"에너지"},"r":{"a":"[A] day (하루), [B] danger (위험)","ev":"8번 문장","s":[[8,"In contrast, many fish remain still for most of the day and move only when they must escape danger or catch prey.","반면에, 많은 물고기는 하루 대부분 가만히 있다가 위험을 피하거나 먹이를 잡아야 할 때만 움직인다."]],"w":"8번 문장 In contrast, many fish remain still for most of the day and move only when they must escape danger or catch prey. 에서 가져옴. flesh·color·protein·energy는 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null},"h":"77d2c08cb2"}]},{"u":4,"id":"b4-04-1","no":1,"ko":"아마존 정글에서 찾은 플라스틱을 먹는 곰팡이","items":[{"n":1,"t":"tf","q":"In 2011, a group of Yale University students joined a research trip to the Amazon rainforest.","ko":"2011년, 예일대 학생들이 아마존 열대우림으로 가는 연구 여행에 참여했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","w":"1번 문장에 In 2011, a group of Yale University students joined a research trip to the Amazon rainforest가 그대로 있음.","c":"T","s":[[1,"In 2011, a group of Yale University students joined a research trip to the Amazon rainforest.","2011년, 예일대 학생들이 아마존 열대우림으로 연구 여행을 떠났다."]]},"h":"f9798bd13e"},{"n":2,"t":"tf","q":"The students tested the microbes in the Amazon rainforest.","ko":"학생들은 아마존 열대우림에서 미생물을 시험했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","w":"4번에서 Back at their university lab(대학 실험실로 돌아와서) 미생물을 키우고 시험했다고 함. 아마존에서 시험했다는 말은 본문과 다름.","c":"F","s":[[4,"Back at their university lab, the students grew the microbes and tested how they acted with different materials.","대학 실험실로 돌아온 학생들은 미생물을 키우며 여러 물질과 어떻게 반응하는지 시험했다."]]},"h":"70aaab052c"},{"n":3,"t":"tf","q":"The fungus released special chemicals that cut plastic into smaller pieces.","ko":"그 곰팡이는 플라스틱을 더 작은 조각으로 자르는 특별한 화학 물질을 내보냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","w":"7번에 released special chemicals that cut the plastic into smaller pieces가 있음. 본문과 일치.","c":"T","s":[[7,"The fungus released special chemicals that cut the plastic into smaller pieces.","그 곰팡이는 플라스틱을 더 작은 조각으로 자르는 특별한 화학 물질을 내보냈다."]]},"h":"44f992bdda"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then it absorbed those pieces and used them as energy, almost like food.)","ko":"그런 다음 그것은 그 조각들을 ( ) 거의 음식처럼 에너지로 사용했다.","opts":["버리다","흡수하다","자르다","키우다"],"word":"absorbed","r":{"a":"2) 흡수하다","ev":"8번 문장","w":"8번에서 곰팡이가 조각을 받아들여 에너지로 썼다고 함. absorb(absorbed의 기본형) = 흡수하다. '자르다'는 7번의 cut이라 헷갈리기 쉬움.","c":2,"s":[[8,"Then it absorbed those pieces and used them as energy, almost like food.","그런 다음 그것은 그 조각들을 흡수해서 거의 음식처럼 에너지로 사용했다."]]},"h":"e9dcf481fe"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This discovery is very important because polyurethane hardly breaks down...)","ko":"이 발견은 매우 중요한데, 폴리우레탄은 ( ) 분해되지 않기 때문이다.","opts":["열심히","아주 쉽게","빠르게","거의 ~않다"],"word":"hardly","r":{"a":"4) 거의 ~않다","ev":"9번 문장","w":"9번에서 폴리우레탄은 매립지에 아주 오래 남는다고 했으니 잘 분해되지 않는다는 뜻. hardly = 거의 ~않다. hard(열심히, 단단한)와 모양이 비슷해서 헷갈리기 쉬움.","c":4,"s":[[9,"This discovery is very important because polyurethane hardly breaks down and stays in landfills for a very long time.","이 발견은 매우 중요한데, 폴리우레탄은 거의 분해되지 않아서 매우 오랫동안 쓰레기 매립지에 남아 있기 때문이다."]]},"h":"3f0c81522e"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThey chose the Amazon because its warm and wet climate supports many microbes that scientists have never studied before.","ko":"밑줄 친 that이(가) 가리키는 것은?","sko":"그들이 아마존을 고른 이유는, 따뜻하고 습한 기후가 과학자들이 한 번도 연구하지 못한 많은 미생물을 살게 하기 때문이었다.","pron":"that","opts":["아마존의 따뜻하고 습한 기후","과학자들","많은 미생물","예일대 학생들"],"r":{"a":"3) 많은 미생물","ev":"3번 문장","s":[[3,"They chose the Amazon because its warm and wet climate supports many microbes that scientists have never studied before.","그들이 아마존을 고른 이유는, 따뜻하고 습한 기후가 과학자들이 한 번도 연구하지 못한 많은 미생물을 살게 하기 때문이었다."]],"w":"that이 이끄는 말은 바로 앞의 many microbes를 꾸며 줌. 즉 과학자들이 한 번도 연구하지 못한 많은 미생물을 가리킴. 아마존의 기후가 그 미생물을 살게 한다는 내용임.","c":3,"k":"that = 많은 미생물"},"h":"3d3657bf7c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"One day, these tiny life forms may help fight plastic pollution.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"언젠가 이 작은 생명체들이 플라스틱 오염과 싸우는 데 도움이 될지도 모른다.","opts":["언젠가 이 작은 생명체들이 플라스틱 오염을 줄이는 데 도움이 될 수도 있다.","이 작은 생명체들이 이미 플라스틱 오염을 모두 없앴다.","이 작은 생명체들이 플라스틱 오염을 일으켰다.","이 작은 생명체들은 플라스틱 오염과 싸우는 데 도움이 될 수 없다."],"r":{"a":"1) 언젠가 이 작은 생명체들이 플라스틱 오염을 줄이는 데 도움이 될 수도 있다.","ev":"11번 문장","w":"One day는 앞으로의 어느 날, may help는 도움이 될지도 모른다는 가능성. 이미 없앴다는 말은 없고, 오염을 일으켰다거나 도움이 될 수 없다는 말은 반대.","c":1,"s":[[11,"One day, these tiny life forms may help fight plastic pollution.","언젠가 이 작은 생명체들이 플라스틱 오염과 싸우는 데 도움이 될지도 모른다."]]},"h":"6dbfdd6e5b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["Scientists have already used the fungus to clean all landfills.","Scientists are discovering more fungi that eat plastic.","Scientists stopped studying fungi after 2011.","Scientists think plastic-eating fungi are dangerous to people."],"oko":["과학자들은 이미 그 곰팡이로 모든 매립지를 깨끗하게 했다.","과학자들은 플라스틱을 먹는 곰팡이를 더 많이 발견하고 있다.","과학자들은 2011년 이후 곰팡이 연구를 그만두었다.","과학자들은 플라스틱을 먹는 곰팡이가 사람에게 위험하다고 생각한다."],"r":{"a":"2) Scientists are discovering more fungi that eat plastic. (과학자들은 플라스틱을 먹는 곰팡이를 더 많이 발견하고 있다.)","ev":"10번 문장","s":[[10,"Today, scientists are discovering more plastic-eating fungi and studying how their abilities can be used in real life.","오늘날 과학자들은 플라스틱을 먹는 곰팡이를 더 많이 발견하고 있으며, 그 능력을 실생활에 어떻게 쓸 수 있을지 연구하고 있다."]],"w":"10번 문장 Today, scientists are discovering more plastic-eating fungi… 즉 오늘날 과학자들이 플라스틱을 먹는 곰팡이를 더 많이 발견하고 있음. 연구를 그만두었다거나 곰팡이가 위험하다는 말은 본문에 없음.","c":2},"h":"178422ded0"},{"n":9,"t":"sum","q":"One (A) contained a fungus that could break down polyurethane, a very (B) kind of plastic.","ko":"한 (A)에는 폴리우레탄, 즉 매우 (B) 종류의 플라스틱을 분해할 수 있는 곰팡이가 들어 있었다.","opts":["(A) sample / (B) common","(A) sample / (B) rare","(A) student / (B) common","(A) student / (B) rare","(A) tree / (B) rare"],"oko":["(A) 시료 / (B) 흔한","(A) 시료 / (B) 드문","(A) 학생 / (B) 흔한","(A) 학생 / (B) 드문","(A) 나무 / (B) 드문"],"r":{"a":"1) (A) sample / (B) common ((A) 시료 / (B) 흔한)","ev":"6번 문장","s":[[6,"One sample contained a fungus that could break down polyurethane, a very common kind of plastic.","한 시료에는 매우 흔한 플라스틱의 한 종류인 폴리우레탄을 분해할 수 있는 곰팡이가 들어 있었다."]],"w":"6번 문장 One sample contained a fungus that could break down polyurethane, a very common kind of plastic. 즉 한 시료(sample)에 매우 흔한(common) 플라스틱을 분해하는 곰팡이가 있었음. rare(드문)는 common과 반대임.","c":1},"h":"fc06d7998b"},{"n":10,"t":"fill","q":"They wanted to [A] microbes living inside plants and see what special [B] they might have.","ko":"그들은 식물 속에 사는 미생물을 [A] 그것들이 어떤 특별한 [B]을(를) 가졌을지 알아보고 싶었다.","bank":["collect","abilities","hardly","strict","landfills","rainforest"],"bko":{"collect":"채집하고","abilities":"능력","hardly":"거의 ~않게","strict":"엄격한","landfills":"쓰레기 매립지","rainforest":"열대우림"},"r":{"a":"[A] collect (채집하고), [B] abilities (능력)","ev":"2번 문장","s":[[2,"They wanted to collect microbes living inside plants and see what special abilities they might have.","그들은 식물 속에 사는 미생물을 채집해서 그것들이 어떤 특별한 능력을 가졌을지 알아보고 싶었다."]],"w":"2번 문장 They wanted to collect microbes living inside plants and see what special abilities they might have. 에서 가져옴. hardly·strict·landfills·rainforest는 이 글에 나오는 말이지만 이 빈칸에는 뜻과 모양이 맞지 않음.","c":null},"h":"1bd095bd80"}]},{"u":4,"id":"b4-04-2","no":2,"ko":"밤하늘 별은 어디로 사라졌을까?","items":[{"n":1,"t":"tf","q":"The faint glow over buildings at night comes from light pollution.","ko":"밤에 건물 위에 퍼진 희미한 빛무리는 빛 공해에서 나온다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번에 This glow comes from light pollution이 그대로 나옴. 본문과 일치.","c":"T","s":[[2,"This glow comes from light pollution.","이 빛무리는 빛 공해에서 나온다."]]},"h":"2094c0d2e9"},{"n":2,"t":"tf","q":"Baby sea turtles follow city lights to find the ocean after hatching.","ko":"아기 바다거북은 부화한 뒤 바다를 찾기 위해 도시의 불빛을 따라간다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","w":"8번에서 아기 바다거북이 따라가는 것은 달빛(the moonlight). 도시의 불빛은 이들을 엉뚱한 방향으로 끌어당기는 방해물.","c":"F","s":[[8,"Likewise, baby sea turtles, which follow the moonlight to the ocean after hatching, are often pulled in the wrong direction by bright city lights.","마찬가지로, 부화한 뒤 달빛을 따라 바다로 가는 아기 바다거북은 밝은 도시의 불빛 때문에 엉뚱한 방향으로 이끌리는 경우가 많다."]]},"h":"e710b8d22b"},{"n":3,"t":"tf","q":"Too much light at night can cause sleep problems.","ko":"밤에 빛이 너무 많으면 수면 문제를 일으킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","w":"10번에 Too much light at night confuses our body clocks, which can cause sleep problems가 있음. 본문과 일치.","c":"T","s":[[10,"Too much light at night confuses our body clocks, which can cause sleep problems and increase the risk of heart disease.","밤에 빛이 너무 많으면 우리의 생체 시계가 혼란스러워져, 수면 문제를 일으키고 심장병의 위험을 높일 수 있다."]]},"h":"f8b35e1141"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Have you seen a faint glow spreading over buildings at night?)","ko":"밤에 건물 위로 퍼져 있는 ( ) 빛무리를 본 적이 있나요?","opts":["희미한","눈부신","거대한","따뜻한"],"word":"faint","r":{"a":"1) 희미한","ev":"1번 문장","w":"1번의 glow는 밤하늘에 은은하게 퍼진 빛무리. 별이 가려질 정도로 퍼지긴 해도(4번) 눈부신 불빛이 아니라 은은한 빛이므로 faint = 희미한.","c":1,"s":[[1,"Have you seen a faint glow spreading over buildings at night?","밤에 건물 위로 퍼져 있는 희미한 빛무리를 본 적이 있나요?"]]},"h":"4bf4862b17"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Too much light at night confuses our body clocks...)","ko":"밤에 빛이 너무 많으면 우리의 생체 시계가 ( ).","opts":["안정시키다","깨우다","혼란스럽게 하다","강하게 하다"],"word":"confuses","r":{"a":"3) 혼란스럽게 하다","ev":"10번 문장","w":"10번에서 밤에 빛이 많으면 몸의 시계가 제대로 맞지 않아 수면 문제까지 생김. confuse(confuses의 기본형) = 혼란스럽게 하다. 안정시킨다면 수면 문제가 생길 리 없음.","c":3,"s":[[10,"Too much light at night confuses our body clocks, which can cause sleep problems and increase the risk of heart disease.","밤에 빛이 너무 많으면 우리의 생체 시계가 혼란스러워져, 수면 문제를 일으키고 심장병의 위험을 높일 수 있다."]]},"h":"ced4f46fc9"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBecause of this, it hides the stars and makes them difficult to see.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"이 때문에 별이 가려져서 잘 보이지 않게 된다.","pron":"them","opts":["건물들","별들","가로등","동물들"],"r":{"a":"2) 별들","ev":"4번 문장","s":[[4,"Because of this, it hides the stars and makes them difficult to see.","이 때문에 별이 가려져서 잘 보이지 않게 된다."]],"w":"Because of this, it hides the stars and makes them difficult to see. 에서 them은 같은 문장의 the stars를 가리킴. 빛이 별을 가려서 별이 잘 보이지 않게 된다는 뜻.","c":2,"k":"them = 별들"},"h":"0059ace150"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"We can use lights that shine downward and use timers or sensors to turn them off when not needed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리는 아래쪽으로 비추는 조명을 사용하고, 필요하지 않을 때는 타이머나 센서로 조명을 끌 수 있다.","opts":["위쪽을 비추는 조명을 늘리고 밤새 켜 둘 수 있다.","조명을 모두 없애고 타이머만 설치해야 한다.","조명은 항상 켜 두고 센서로 밝기만 높일 수 있다.","아래쪽을 비추는 조명을 쓰고, 필요 없을 때는 타이머나 센서로 끌 수 있다."],"r":{"a":"4) 아래쪽을 비추는 조명을 쓰고, 필요 없을 때는 타이머나 센서로 끌 수 있다.","ev":"12번 문장","w":"shine downward = 아래쪽으로 비추다, turn them off when not needed = 필요하지 않을 때 끄다. 위쪽을 비추거나 밤새 켜 두는 것은 3번의 원인과 같은 방식이라 오히려 문제를 키움.","c":4,"s":[[12,"We can use lights that shine downward and use timers or sensors to turn them off when not needed.","우리는 아래쪽으로 비추는 조명을 사용하고, 필요하지 않을 때는 타이머나 센서로 조명을 끌 수 있다."]]},"h":"79cca2d742"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["All birds use stars to find their way home.","Birds find their way better when city lights are brighter.","Some birds that find their way by the stars can get lost.","Birds never use stars to find their way."],"oko":["모든 새는 별을 이용해 집으로 가는 길을 찾는다.","도시의 불빛이 더 밝을수록 새들은 길을 더 잘 찾는다.","별로 길을 찾는 일부 새들은 길을 잃을 수 있다.","새들은 길을 찾을 때 별을 전혀 이용하지 않는다."],"r":{"a":"3) Some birds that find their way by the stars can get lost. (별로 길을 찾는 일부 새들은 길을 잃을 수 있다.)","ev":"7번 문장","s":[[7,"Some birds that use stars for navigation can get lost.","별을 길잡이로 삼는 일부 새들은 길을 잃을 수 있다."]],"w":"7번 문장 Some birds that use stars for navigation can get lost. 즉 별을 길잡이로 삼는 일부 새들은 길을 잃을 수 있음. 모든 새가 그렇다거나 불빛이 밝을수록 길을 더 잘 찾는다는 말은 본문과 다름.","c":3},"h":"a0ae95bcf5"},{"n":9,"t":"sum","q":"Light pollution (A) animals and people, and for humans, (B) is important for our bodies to rest.","ko":"빛 공해는 동물과 사람을 (A), 사람의 몸이 쉬는 데는 (B)이(가) 중요하다.","opts":["(A) helps / (B) darkness","(A) harms / (B) light","(A) harms / (B) darkness","(A) helps / (B) light","(A) harms / (B) noise"],"oko":["(A) 돕는다 / (B) 어둠","(A) 해친다 / (B) 빛","(A) 해친다 / (B) 어둠","(A) 돕는다 / (B) 빛","(A) 해친다 / (B) 소음"],"r":{"a":"3) (A) harms / (B) darkness ((A) 해친다 / (B) 어둠)","ev":"6번, 9번 문장","s":[[6,"Light pollution harms animals and people, too.","빛 공해는 동물과 사람에게도 해를 끼친다."],[9,"For humans, darkness is important for our bodies to rest.","사람의 경우, 어둠은 우리 몸이 쉬는 데 중요하다."]],"w":"6번 문장 Light pollution harms animals and people, too. 와 9번 문장 For humans, darkness is important for our bodies to rest. 에서 가져옴. 빛 공해는 해치고(harms), 몸이 쉬는 데는 어둠(darkness)이 중요함.","c":3},"h":"f41a5f65db"},{"n":10,"t":"fill","q":"These small [A] can help bring back stars and [B] nights.","ko":"이런 작은 [A]이(가) 별과 [B] 밤을 되찾는 데 도움이 될 수 있다.","bank":["changes","healthier","turtles","birds","heart","clocks"],"bko":{"changes":"변화","healthier":"더 건강한","turtles":"거북","birds":"새","heart":"심장","clocks":"시계"},"r":{"a":"[A] changes (변화), [B] healthier (더 건강한)","ev":"13번 문장","s":[[13,"These small changes can help bring back stars and healthier nights.","이런 작은 변화들이 별과 더 건강한 밤을 되찾는 데 도움이 될 수 있다."]],"w":"13번 문장 These small changes can help bring back stars and healthier nights. 에서 가져옴. turtles·birds·heart·clocks는 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null},"h":"0bcde7342e"}]},{"u":4,"id":"b4-04-3","no":3,"ko":"약을 싱크대에 버리면 어떤 일이 생길까?","items":[{"n":1,"t":"tf","q":"Many people throw away unused medicine in the trash or wash it down the sink.","ko":"많은 사람들이 쓰지 않는 약을 쓰레기통에 버리거나 싱크대에 흘려보낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","w":"1번 문장에 throw away unused or expired medicine in the trash or wash it down the sink가 있음. 본문과 일치.","c":"T","s":[[1,"Many people throw away unused or expired medicine in the trash or wash it down the sink.","많은 사람들이 쓰지 않거나 유통기한이 지난 약을 쓰레기통에 버리거나 싱크대에 흘려보낸다."]]},"h":"b5bd27b9da"},{"n":2,"t":"tf","q":"Hormone medicines can turn female fish into male fish.","ko":"호르몬제는 암컷 물고기를 수컷 물고기로 바꿀 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","w":"5번에서 호르몬제가 바꾸는 방향은 수컷(male)에서 암컷(female). 암컷을 수컷으로 바꾼다는 말은 방향이 반대.","c":"F","s":[[5,"They can even turn male fish into female fish.","심지어 수컷 물고기를 암컷 물고기로 바꿔 놓을 수도 있다."]]},"h":"4f66bf6afc"},{"n":3,"t":"tf","q":"Bacteria that resist drugs can spread through water, soil, or animals.","ko":"약에 내성이 생긴 세균은 물, 토양, 또는 동물을 통해 퍼질 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~11번 문장","w":"10번에서 세균이 항생제에 내성을 키우고, 11번에서 이 세균들이 물, 토양, 동물을 통해 퍼질 수 있다고 함.","c":"T","s":[[10,"Over time, they develop resistance to antibiotics and become harder to kill.","시간이 지나면서 그들은 항생제에 대한 내성을 키우고 죽이기가 더 어려워진다."],[11,"These bacteria can spread through water, soil, or animals and reach people.","이 세균들은 물, 토양, 또는 동물을 통해 퍼져 사람에게까지 닿을 수 있다."]]},"h":"f31077fd58"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For example, hormone medicines can damage aquatic ecosystems.)","ko":"예를 들어, 호르몬제는 ( ) 생태계를 손상시킬 수 있다.","opts":["땅 위의","물속의, 수중의","공중의","지하의"],"word":"aquatic","r":{"a":"2) 물속의, 수중의","ev":"4~5번 문장","w":"5번에서 물고기 이야기가 이어지므로 aquatic ecosystems = 물속 생태계. 땅 위나 공중, 지하의 생태계라면 물고기 이야기가 이어질 수 없음.","c":2,"s":[[4,"For example, hormone medicines can damage aquatic ecosystems.","예를 들어, 호르몬제는 수중 생태계를 손상시킬 수 있다."],[5,"They can even turn male fish into female fish.","심지어 수컷 물고기를 암컷 물고기로 바꿔 놓을 수도 있다."]]},"h":"a5609fe47d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... we must use pharmacy return boxes or local take-back programs to dispose of medicine safely.)","ko":"... 우리는 약국 반납함이나 지역 회수 프로그램을 이용해 약을 안전하게 ( ) 한다.","opts":["사용하다","팔다","모으다","버리다, 처리하다"],"word":"dispose of","r":{"a":"4) 버리다, 처리하다","ev":"13번 문장","w":"13번은 앞에서 약을 잘못 버려 생긴 문제들을 막기 위한 방법이므로, 반납함과 회수 프로그램으로 약을 올바르게 버린다는 뜻. dispose of = 버리다, 처리하다.","c":4,"s":[[13,"To prevent these problems, we must use pharmacy return boxes or local take-back programs to dispose of medicine safely.","이런 문제를 막기 위해, 우리는 약국 반납함이나 지역 회수 프로그램을 이용해 약을 안전하게 폐기해야 한다."]]},"h":"c0f43661cc"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen these drugs enter the environment, bacteria in water and soil are exposed to them over long periods of time.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이런 약물이 환경에 들어가면, 물과 토양 속 세균은 오랜 기간 동안 그것에 노출된다.","opts":["물과 토양","세균들","이런 약물들","오랜 기간"],"r":{"a":"3) 이런 약물들","ev":"8번 문장","w":"are exposed to them에서 세균이 노출되는 대상은 문장 앞쪽의 these drugs. 세균(bacteria)은 노출되는 주체이지 노출되는 대상이 아님.","c":3,"s":[[8,"When these drugs enter the environment, bacteria in water and soil are exposed to them over long periods of time.","이런 약물이 환경에 들어가면, 물과 토양 속 세균은 오랜 기간 동안 그것에 노출된다."]]},"h":"ea47485054"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because the chemicals are too weak to kill the bacteria, some survive.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 화학 물질이 세균을 죽이기에는 너무 약해서, 일부 세균은 살아남는다.","opts":["약 성분이 너무 약해서 세균을 다 죽이지 못해 일부 세균이 살아남는다.","약 성분이 너무 강해서 세균이 모두 죽는다.","세균이 너무 약해서 약 성분에 쉽게 죽는다.","일부 세균이 약 성분을 먹고 더 커진다."],"r":{"a":"1) 약 성분이 너무 약해서 세균을 다 죽이지 못해 일부 세균이 살아남는다.","ev":"9번 문장","w":"too weak to kill = 죽이기에는 너무 약하다. 약이 약하니 세균이 다 죽지 않고 일부가 살아남음. 강해서 모두 죽는다는 선지는 정반대.","c":1,"s":[[9,"Because the chemicals are too weak to kill the bacteria, some survive.","그 화학 물질이 세균을 죽이기에는 너무 약해서, 일부 세균은 살아남는다."]]},"h":"76dd24a722"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["Normal cleaning systems can easily remove strong drug chemicals.","Strong drug chemicals disappear as soon as they reach the water.","Normal cleaning systems cannot remove strong drug chemicals that leak into the soil or water.","Drug chemicals are cleaned by the soil before they reach people."],"oko":["일반적인 정화 시설은 강한 약 성분을 쉽게 제거할 수 있다.","강한 약 성분은 물에 닿자마자 사라진다.","일반적인 정화 시설은 토양이나 물로 새어 들어간 강한 약 성분을 제거할 수 없다.","약 성분은 사람에게 닿기 전에 토양이 깨끗하게 해 준다."],"r":{"a":"3) Normal cleaning systems cannot remove strong drug chemicals that leak into the soil or water. (일반적인 정화 시설은 토양이나 물로 새어 들어간 강한 약 성분을 제거할 수 없다.)","ev":"2번 문장","s":[[2,"If these strong drug chemicals leak into the soil or water, normal cleaning systems cannot remove them.","이런 강한 약 성분이 토양이나 물로 새어 들어가면, 일반적인 정화 시설로는 그것을 제거할 수 없다."]],"w":"2번 문장 normal cleaning systems cannot remove them. 즉 약 성분이 토양이나 물로 새어 들어가면 일반적인 정화 시설로는 제거할 수 없음. 선지 1은 반대이고, 선지 2·4는 본문에 없는 내용임.","c":3},"h":"8163caa619"},{"n":9,"t":"sum","q":"Drugs such as antibiotics can cause another problem: when bacteria cause (A), the sickness becomes harder to (B).","ko":"항생제 같은 약물은 또 다른 문제를 일으킬 수 있는데, 세균이 (A)을(를) 일으키면 병은 (B) 더 어려워진다.","opts":["(A) pills / (B) kill","(A) infections / (B) treat","(A) infections / (B) cause","(A) pills / (B) treat","(A) fish / (B) cause"],"oko":["(A) 알약 / (B) 죽이기","(A) 감염 / (B) 치료하기","(A) 감염 / (B) 일으키기","(A) 알약 / (B) 치료하기","(A) 물고기 / (B) 일으키기"],"r":{"a":"2) (A) infections / (B) treat ((A) 감염 / (B) 치료하기)","ev":"7번, 12번 문장","s":[[7,"Certain drugs, such as antibiotics, can cause another problem.","항생제 같은 일부 약물은 또 다른 문제를 일으킬 수 있다."],[12,"When they cause infections, the sickness becomes harder to treat.","그것들이 감염을 일으키면, 병은 치료하기가 더 어려워진다."]],"w":"7번에서 항생제 같은 약물이 또 다른 문제를 일으킬 수 있다고 하고, 12번 When they cause infections, the sickness becomes harder to treat. 즉 세균이 감염(infections)을 일으키면 병은 치료하기(treat) 더 어려워짐.","c":2},"h":"ec7ec79499"},{"n":10,"t":"fill","q":"This [A] makes it difficult for fish to reproduce, and their [B] can decrease.","ko":"이 [A]은(는) 물고기가 번식하기 어렵게 만들고, 물고기의 [B]이(가) 줄어들 수 있다.","bank":["change","population","sink","pharmacy","boxes","dispose"],"bko":{"change":"변화","population":"개체 수","sink":"싱크대","pharmacy":"약국","boxes":"상자들","dispose":"버리다"},"r":{"a":"[A] change (변화), [B] population (개체 수)","ev":"6번 문장","s":[[6,"This change makes it difficult for fish to reproduce, and their population can decrease.","이 변화는 물고기가 번식하기 어렵게 만들고, 그 개체 수가 감소할 수 있다."]],"w":"6번 문장 This change makes it difficult for fish to reproduce, and their population can decrease. 에서 가져옴. sink·pharmacy·boxes·dispose는 이 글에 나오는 말이지만 이 빈칸에는 뜻과 모양이 맞지 않음.","c":null},"h":"56def49a74"}]},{"u":4,"id":"b4-04-4","no":4,"ko":"바다가 오르내리는 힘으로 전기를 만든다고?","items":[{"n":1,"t":"tf","q":"The ocean water rises and falls in a steady rhythm and creates tides.","ko":"바닷물은 일정한 리듬으로 오르내리며 조수를 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","w":"1번에 The water in the ocean rises and falls in a steady rhythm, and this movement creates tides가 있음. 본문과 일치.","c":"T","s":[[1,"The water in the ocean rises and falls in a steady rhythm, and this movement creates tides.","바닷물은 일정한 리듬으로 오르내리고, 이 움직임이 조수(밀물과 썰물)를 만든다."]]},"h":"b996aa7a0a"},{"n":2,"t":"tf","q":"During low tide, water from the sea flows into the basin and spins the turbines.","ko":"썰물 때, 바다의 물이 저수지로 흘러 들어가 터빈을 돌린다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번에서 바다 물이 저수지로 들어가 터빈을 돌리는 때는 밀물(high tide). 썰물(low tide)이 아니므로 본문과 다름.","c":"F","s":[[7,"During high tide, water from the sea flows through the dam into a basin and spins the turbines.","밀물 때, 바다의 물이 댐을 통해 저수지로 흘러 들어가며 터빈을 돌린다."]]},"h":"297ebc3f1f"},{"n":3,"t":"tf","q":"Using tides to make electricity is called tidal power.","ko":"조수를 이용해 전기를 만드는 것을 조력 발전이라고 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","w":"3번에서 자연의 움직임(조수)으로 전기를 만들 수 있다고 하고, 4번에서 이 아이디어를 tidal power라고 부른다고 함.","c":"T","s":[[3,"This natural movement can be used to generate electricity.","이 자연의 움직임은 전기를 만드는 데 쓰일 수 있다."],[4,"This idea is called tidal power.","이 아이디어를 조력 발전이라고 한다."]]},"h":"102b2df12f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This natural movement can be used to generate electricity.)","ko":"이 자연의 움직임은 전기를 ( ) 데 쓰일 수 있다.","opts":["막다","낭비하다","만들어 내다, 생산하다","저장하다"],"word":"generate","r":{"a":"3) 만들어 내다, 생산하다","ev":"3번 문장","w":"3번에서 조수의 움직임을 이용해 전기를 얻을 수 있다는 뜻이고, 8번에서 발전기가 electricity를 produce(만들어 내다)한다고 나옴. generate = 만들어 내다. '저장하다'는 11번의 stored 쪽 뜻이라 헷갈리기 쉬움.","c":3,"s":[[3,"This natural movement can be used to generate electricity.","이 자연의 움직임은 전기를 만드는 데 쓰일 수 있다."]]},"h":"933e85fdd9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... tidal barrages can produce clean and renewable energy without burning fuel.)","ko":"... 조력 방조제는 연료를 태우지 않고도 깨끗하고 ( ) 에너지를 만들 수 있다.","opts":["재생 가능한","값비싼","위험한","한정된"],"word":"renewable","r":{"a":"1) 재생 가능한","ev":"12번 문장","w":"12번에서 조수가 매일 반복되므로 에너지를 계속 얻을 수 있다는 뜻. renewable = 다시 얻을 수 있는, 재생 가능한. '한정된'은 반대 뜻.","c":1,"s":[[12,"Because the tides repeat every day, tidal barrages can produce clean and renewable energy without burning fuel.","조수는 매일 반복되기 때문에, 조력 방조제는 연료를 태우지 않고도 깨끗하고 재생 가능한 에너지를 만들 수 있다."]]},"h":"c1110c38dc"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAs the turbines spin, they drive the generators to produce electricity.","ko":"밑줄 친 they가 가리키는 것은?","sko":"터빈이 돌아가면서, 그것들은 발전기를 움직여 전기를 만들어 낸다.","opts":["발전기들","수문들","조수들","터빈들"],"r":{"a":"4) 터빈들","ev":"8번 문장","w":"As the turbines spin 바로 뒤의 they는 돌고 있는 터빈들. 터빈들이 발전기를 움직여(drive) 전기를 만듦. generators는 움직임을 당하는 쪽.","c":4,"s":[[8,"As the turbines spin, they drive the generators to produce electricity.","터빈이 돌아가면서, 그것들은 발전기를 움직여 전기를 만들어 낸다."]]},"h":"1e57cc4dfb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"After the basin fills, the gates are closed to hold the water.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"저수지가 가득 차면, 물을 가두기 위해 수문이 닫힌다.","opts":["저수지에 물이 가득 차면, 그 물을 붙잡아 두려고 수문을 닫는다.","저수지가 비면, 물이 빠지도록 수문을 연다.","저수지가 차기 전에, 물을 내보내려고 수문을 닫는다.","수문이 닫혀야만 저수지에 물이 채워진다."],"r":{"a":"1) 저수지에 물이 가득 차면, 그 물을 붙잡아 두려고 수문을 닫는다.","ev":"9번 문장","w":"After the basin fills = 저수지가 가득 찬 뒤, to hold the water = 물을 가두려고. 다음 10번에서 썰물이 되면 수문이 다시 열림.","c":1,"s":[[9,"After the basin fills, the gates are closed to hold the water.","저수지가 가득 차면, 물을 가두기 위해 수문이 닫힌다."]]},"h":"0fc49d1fc9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["조력 방조제는 썰물 때만 전기를 만들 수 있다.","조력 방조제는 발전기를 돌리기 위해 연료를 태운다.","저수지에 저장된 물은 바다로 다시 흘러가 터빈을 또 한 번 돌린다.","조수는 한 달에 한 번만 바뀐다."],"opts":["A tidal barrage can only produce electricity at low tide.","Tidal barrages burn fuel to turn the generators.","Water stored in the basin flows back to the sea and turns the turbines again.","The tides change only once a month."],"r":{"a":"3) Water stored in the basin flows back to the sea and turns the turbines again.","ev":"11번 문장","w":"11번에서 저장된 물이 바다로 쏟아져 나가며 터빈을 두 번째로 돌린다고 함. 나머지는 틀림: 밀물 때도 전기가 만들어짐(7번), 연료를 태우지 않음(12번), 조수는 매일 반복됨(12번).","c":3,"s":[[11,"The stored water rushes back to the sea and turns the turbines a second time, once again powering the generators.","저장된 물이 바다로 쏟아져 나가며 터빈을 두 번째로 돌리고, 다시 한번 발전기를 작동시킨다."]]},"h":"f1bfcc58b3"},{"n":9,"t":"sum","q":"These tides move (A) amounts of water in and out of (B) with great force.","ko":"이 조수는 (A) 양의 물을 큰 힘으로 (B) 안팎으로 움직인다.","opts":["(A) tiny / (B) bays","(A) huge / (B) mountains","(A) huge / (B) bays","(A) tiny / (B) mountains","(A) huge / (B) dams"],"oko":["(A) 아주 작은 / (B) 만","(A) 엄청난 / (B) 산","(A) 엄청난 / (B) 만","(A) 아주 작은 / (B) 산","(A) 엄청난 / (B) 댐"],"r":{"a":"3) (A) huge / (B) bays ((A) 엄청난 / (B) 만)","ev":"2번 문장","s":[[2,"These tides move huge amounts of water in and out of bays with great force.","이 조수는 엄청난 양의 물을 큰 힘으로 만 안팎으로 움직인다."]],"w":"2번 문장 These tides move huge amounts of water in and out of bays with great force. 즉 조수가 엄청난(huge) 양의 물을 큰 힘으로 만(bays) 안팎으로 움직임. 산이나 댐은 본문에서 조수가 드나드는 곳이 아님.","c":3},"h":"7997cd8df3"},{"n":10,"t":"fill","q":"One [A] way to generate tidal power is to use a tidal barrage, a dam built at the [B] of a bay.","ko":"조력 발전을 하는 [A] 방법 중 하나는 만의 [B]에 지은 댐인 조력 방조제를 이용하는 것이다.","bank":["common","entrance","stored","closed","force","rhythm"],"bko":{"common":"흔한","entrance":"입구","stored":"저장된","closed":"닫힌","force":"힘","rhythm":"리듬"},"r":{"a":"[A] common (흔한), [B] entrance (입구)","ev":"5번 문장","s":[[5,"One common way to generate tidal power is to use a tidal barrage, a dam built at the entrance of a bay.","조력 발전을 하는 흔한 방법 중 하나는 만의 입구에 지은 댐인 조력 방조제를 이용하는 것이다."]],"w":"5번 문장 One common way to generate tidal power is to use a tidal barrage, a dam built at the entrance of a bay. 에서 가져옴. stored·closed·force·rhythm은 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null},"h":"4d21ff56d1"}]},{"u":5,"id":"b4-05-1","no":1,"ko":"선물 하나 받았을 뿐인데, 서재까지 바뀐 이유?","items":[{"n":1,"t":"tf","q":"Diderot received a beautiful red robe as a gift.","ko":"디드로는 선물로 아름다운 붉은 가운을 받았다.","r":{"a":"T (본문과 맞는 내용)","s":[[4,"One day, he received a beautiful red robe as a gift.","어느 날, 그는 선물로 아름다운 붉은 가운을 받았다."]],"w":"4번 문장에 he received a beautiful red robe as a gift가 그대로 나옴. receive(받다)한 것이 선물로 받은 붉은 가운이므로 본문과 같음.","c":"T","ev":"4번 문장"},"h":"6ed061f150"},{"n":2,"t":"tf","q":"After getting the robe, Diderot replaced only his chair.","ko":"가운을 얻은 후, 디드로는 의자만 바꿨다.","r":{"a":"F (본문과 다른 내용)","s":[[6,"He started by replacing his chair, then his desk, and eventually his entire study.","그는 의자를 바꾸는 것으로 시작해서, 그다음에는 책상을, 결국에는 서재 전체를 바꿨다."]],"w":"6번에서 의자로 시작해서(started by replacing his chair), 그다음 책상, 결국 서재 전체까지 바꿨음. 의자만 바꾼 게 아니므로 F.","c":"F","ev":"6번 문장"},"h":"62bb602d3c"},{"n":3,"t":"tf","q":"A new item of higher quality can make us dissatisfied with what we already own.","ko":"품질이 더 높은 새 물건은 우리가 이미 가진 것에 불만을 느끼게 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","s":[[8,"When we bring a new item into our lives, especially one of higher quality or a different style, it can create a feeling of dissatisfaction with our existing possessions.","우리가 새로운 물건, 특히 더 품질이 높거나 스타일이 다른 물건을 생활에 들일 때, 그것은 우리가 이미 가진 소유물에 대한 불만족의 느낌을 만들어 낼 수 있다."]],"w":"8번에서 새 물건(특히 더 품질이 높은 것)이 기존 소유물에 대한 dissatisfaction(불만족)을 만들 수 있다고 함. 선지와 같은 내용.","c":"T","ev":"8번 문장"},"h":"22d012f5c2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... his other possessions suddenly seemed old and mismatched.)","ko":"... 그의 다른 소유물들이 갑자기 낡고 ( ) 보였다.","opts":["새로 산","값이 싼","서로 어울리지 않는","깨끗한"],"word":"mismatched","r":{"a":"3) 서로 어울리지 않는","s":[[5,"It was so elegant that his other possessions suddenly seemed old and mismatched.","그것은 너무 우아해서 그의 다른 소유물들이 갑자기 낡고 어울리지 않아 보였다."]],"w":"5번에서 새 가운이 너무 우아해서 다른 소유물이 old and mismatched로 보였다고 함. 새것과 짝이 안 맞는다는 뜻이라 '서로 어울리지 않는'이 답. 깨끗한이나 새로 산은 old와 반대 방향.","c":3,"ev":"5번 문장"},"h":"74f325973d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... in an attempt to restore harmony.)","ko":"... 조화를 ( ) 시도로","opts":["깨뜨리다","되찾다","숨기다","팔다"],"word":"restore","r":{"a":"2) 되찾다","s":[[9,"This leads us to make unplanned purchases in an attempt to restore harmony.","이것은 우리가 조화를 되찾으려는 시도로 계획에 없던 구매를 하게 만든다."]],"w":"9번에서 새 물건 때문에 깨진 조화(어울림)를 다시 만들려고 계획에 없던 구매를 한다는 뜻. restore harmony = 조화를 되찾다. 깨뜨리다는 반대 뜻.","c":2,"ev":"9번 문장"},"h":"9e5f91f432"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt comes from the story of Denis Diderot, an 18th-century French writer.","ko":"밑줄 친 It이(가) 가리키는 것은?","sko":"그것은 18세기 프랑스 작가 드니 디드로의 이야기에서 나왔다.","pron":"It","opts":["프랑스","디드로 효과","가운 한 벌","서재"],"r":{"a":"2) 디드로 효과","ev":"2~3번 문장","s":[[2,"This pattern is called the Diderot Effect.","이 현상은 디드로 효과라고 불린다."],[3,"It comes from the story of Denis Diderot, an 18th-century French writer.","그것은 18세기 프랑스 작가 드니 디드로의 이야기에서 나왔다."]],"w":"2번 문장에서 이 현상을 디드로 효과(the Diderot Effect)라고 부른다고 했고, 3번 문장의 It은 바로 그 디드로 효과. 디드로 효과가 작가 디드로의 이야기에서 나왔다는 뜻.","c":2,"k":"It = 디드로 효과"},"h":"92b674cb4a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of falling into this trap, remember Diderot’s story the next time you consider a new purchase.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 함정에 빠지는 대신, 다음에 새로운 구매를 고려할 때 디드로의 이야기를 기억하라.","opts":["다음에 물건을 살 때 디드로의 이야기를 떠올려 함정에 빠지지 않도록 하라.","디드로처럼 새 물건을 사면 모든 가구를 바꾸라.","디드로의 이야기는 잊고 마음껏 새 물건을 사라.","새로운 구매는 절대 하지 말고 이야기만 기억하라."],"r":{"a":"1) 다음에 물건을 살 때 디드로의 이야기를 떠올려 함정에 빠지지 않도록 하라.","s":[[11,"Instead of falling into this trap, remember Diderot’s story the next time you consider a new purchase.","이 함정에 빠지는 대신, 다음에 새로운 구매를 고려할 때 디드로의 이야기를 기억하라."]],"w":"Instead of falling into this trap은 '이 함정에 빠지는 대신'. 새 구매를 고려할 때 디드로의 이야기를 기억하라는 조언이므로 ①. 구매를 아예 금지한다는 말은 없음.","c":1,"ev":"11번 문장"},"h":"d1ae190133"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["People never want to change anything after they buy something new.","People may feel a strong desire to replace what they own after buying something new.","Buying something new always makes people feel satisfied with their old things.","The desire to replace things appears only in children."],"oko":["사람들은 새로운 것을 산 뒤에는 아무것도 바꾸고 싶어 하지 않는다.","사람들은 새로운 것을 산 뒤 가지고 있는 것을 바꾸고 싶은 강한 욕구를 느낄 수 있다.","새로운 것을 사면 사람들은 항상 낡은 물건에 만족하게 된다.","물건을 바꾸고 싶은 욕구는 어린이에게서만 나타난다."],"r":{"a":"2) People may feel a strong desire to replace what they own after buying something new. (사람들은 새로운 것을 산 뒤 가지고 있는 것을 바꾸고 싶은 강한 욕구를 느낄 수 있다.)","ev":"1번 문장","s":[[1,"Have you ever bought something new and felt a strong desire to replace all the things you own to match it?","새로운 무언가를 사고 나서, 가지고 있는 모든 것을 그것에 어울리게 바꾸고 싶은 강한 욕구를 느껴 본 적이 있는가?"]],"w":"1번 문장은 새로운 무언가를 산 뒤 가진 모든 것을 그것에 어울리게 바꾸고 싶은 강한 욕구를 느껴 본 적이 있는지 물음. 선지 2가 그 내용과 같음. 나머지는 본문과 반대이거나 본문에 없는 말임.","c":2},"h":"7b1546f93a"},{"n":9,"t":"sum","q":"This led Diderot to a (A) of (B) spending.","ko":"이것은 디드로를 (B) 소비의 (A)(으)로 이끌었다.","opts":["(A) cycle / (B) careful","(A) cycle / (B) endless","(A) piece / (B) endless","(A) piece / (B) little","(A) cycle / (B) little"],"oko":["(A) 순환 / (B) 신중한","(A) 순환 / (B) 끝없는","(A) 조각 / (B) 끝없는","(A) 조각 / (B) 적은","(A) 순환 / (B) 적은"],"r":{"a":"2) (A) cycle / (B) endless ((A) 순환 / (B) 끝없는)","ev":"7번 문장","s":[[7,"This led him to a cycle of endless spending.","이것은 그를 끝없는 소비의 순환으로 이끌었다."]],"w":"7번 문장 This led him to a cycle of endless spending. 즉 끝없는(endless) 소비의 순환(cycle)으로 이끌었음. careful(신중한)·little(적은)은 본문과 반대되는 뜻임.","c":2},"h":"27760abf87"},{"n":10,"t":"fill","q":"The Diderot Effect shows how one purchase can quickly lead to [A] (too much spending) and [B].","ko":"디드로 효과는 하나의 구매가 빠르게 [A](너무 많이 쓰는 것)와 [B](으)로 이어질 수 있음을 보여 준다.","bank":["overspending","waste","robe","chair","study","writer"],"bko":{"overspending":"과소비","waste":"낭비","robe":"가운","chair":"의자","study":"서재","writer":"작가"},"r":{"a":"[A] overspending, [B] waste","s":[[10,"The Diderot Effect shows how one purchase can quickly lead to overspending and waste.","디드로 효과는 하나의 구매가 어떻게 빠르게 과소비와 낭비로 이어질 수 있는지를 보여 준다."]],"w":"10번에서 one purchase can quickly lead to overspending and waste(하나의 구매가 과소비와 낭비로 이어짐)라고 함. robe(가운), chair(의자), study(서재), writer(작가)는 본문에 나오는 물건·사람 이름이라 '구매가 이어지는 결과'로는 맞지 않음.","c":null,"ev":"10번 문장"},"h":"def2437e2e"}]},{"u":5,"id":"b4-05-2","no":2,"ko":"가게마다 카드를 들고 다니던 시대, 한 장으로 끝낸 비결?","items":[{"n":1,"t":"tf","q":"Stores gave small cards to trusted customers so they could pay later.","ko":"가게들은 믿을 만한 고객들이 나중에 지불할 수 있도록 작은 카드를 주었다.","r":{"a":"T (본문과 맞는 내용)","s":[[3,"They gave small cards to trusted customers so they could take items home and pay later.","그들은 믿을 만한 고객들에게 작은 카드를 주어서, 고객들이 물건을 집에 가져가고 나중에 지불할 수 있게 했다."]],"w":"3번에서 They gave small cards to trusted customers so they could take items home and pay later라고 함. 믿을 만한 고객에게 카드를 주어 나중에 내게 했으므로 본문과 같음.","c":"T","ev":"3번 문장"},"h":"0507c98f35"},{"n":2,"t":"tf","q":"People who visited different shops needed only one store credit card.","ko":"여러 가게를 방문하는 사람들은 가게 카드 한 장만 있으면 됐다.","r":{"a":"F (본문과 다른 내용)","s":[[4,"However, each card worked only at one store, so people who visited different shops or restaurants often needed several cards.","하지만 각 카드는 한 가게에서만 쓸 수 있었기 때문에, 여러 가게나 식당을 방문하는 사람들은 종종 여러 장의 카드가 필요했다."]],"w":"4번에서 각 카드는 한 가게에서만 쓸 수 있어서(only at one store) 여러 가게를 다니는 사람은 여러 장(several cards)이 필요했다고 함. 한 장이면 된다는 말은 반대.","c":"F","ev":"4번 문장"},"h":"907de4b630"},{"n":3,"t":"tf","q":"The Diners Club card could be used at several New York City restaurants.","ko":"다이너스 클럽 카드는 뉴욕시의 여러 식당에서 쓸 수 있었다.","r":{"a":"T (본문과 맞는 내용)","s":[[7,"The company issued a card that members could use at several New York City restaurants.","그 회사는 회원들이 뉴욕시의 여러 식당에서 쓸 수 있는 카드를 발급했다."]],"w":"7번에 a card that members could use at several New York City restaurants가 있음. 회원들이 뉴욕시의 여러 식당에서 쓸 수 있었으므로 본문과 같음.","c":"T","ev":"7번 문장"},"h":"e35fb3ec58"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The company issued a card that members could use at several restaurants.)","ko":"그 회사는 회원들이 여러 식당에서 쓸 수 있는 카드를 ( ).","opts":["취소했다","발급했다","빌렸다","숨겼다"],"word":"issued","r":{"a":"2) 발급했다","s":[[7,"The company issued a card that members could use at several New York City restaurants.","그 회사는 회원들이 뉴욕시의 여러 식당에서 쓸 수 있는 카드를 발급했다."]],"w":"7번에서 회사(Diners Club)가 회원들이 쓸 카드를 만들어 내주었다는 흐름. issue(발급하다)의 과거형 issued = 발급했다. 취소했다는 반대 방향.","c":2,"ev":"7번 문장"},"h":"745877b4e1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The idea proved successful.)","ko":"그 아이디어는 성공적임이 ( ).","opts":["실패했다","잊혔다","(~임이) 입증되었다","금지되었다"],"word":"proved","r":{"a":"3) (~임이) 입증되었다","s":[[9,"The idea proved successful.","그 아이디어는 성공적임이 입증되었다."]],"w":"9번의 proved successful은 '성공적임이 입증되었다'. 바로 뒤 10번에서 더 많은 식당, 호텔, 상점, 항공사가 참여했으니 성공이 확인된 것. prove(입증하다)의 과거형임.","c":3,"ev":"9번 문장"},"h":"352574feee"},{"n":6,"t":"ref","q":"What does the underlined \"this opportunity\" refer to?\nA businessman named Frank McNamara saw this opportunity and started Diners Club in 1950.","ko":"밑줄 친 this opportunity이(가) 가리키는 것은?","sko":"프랭크 맥나마라라는 사업가가 이 기회를 보고 1950년에 다이너스 클럽을 시작했다.","pron":"this opportunity","opts":["현금을 더 많이 가지고 다니는 것","여러 곳에서 쓸 수 있는 한 장의 카드가 필요하다는 것","은행에서 새 카드를 만드는 것","식당에서 음식 값을 깎아 주는 것"],"r":{"a":"2) 여러 곳에서 쓸 수 있는 한 장의 카드가 필요하다는 것","ev":"5~6번 문장","s":[[5,"Over time, businesses realized there was a need for a single card that worked in many places.","시간이 지나면서, 사업가들은 여러 곳에서 쓸 수 있는 한 장의 카드가 필요하다는 것을 깨달았다."],[6,"A businessman named Frank McNamara saw this opportunity and started Diners Club in 1950.","프랭크 맥나마라라는 사업가가 이 기회를 보고 1950년에 다이너스 클럽을 시작했다."]],"w":"5번 문장에서 사업가들이 여러 곳에서 쓸 수 있는 한 장의 카드가 필요하다는 것을 깨달았다고 했고, 6번 문장의 this opportunity는 바로 그 필요, 즉 새로운 사업의 기회를 말함.","c":2,"k":"this opportunity = 여러 곳에서 쓸 수 있는 한 장의 카드가 필요하다는 것"},"h":"e9d9ee5478"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By the late 1950s and 1960s, banks introduced their own cards and helped create the global credit card networks used today.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"1950년대 후반과 1960년대에는 은행들이 자체 카드를 내놓았고 오늘날 쓰이는 세계적인 신용카드 망을 만드는 데 일조했다.","opts":["1950년대 후반과 1960년대에 은행들이 자체 카드를 내놓았고, 오늘날의 세계적인 신용카드 망을 만드는 데 도움을 주었다.","은행들은 1960년대에 신용카드 사용을 금지하고 현금만 쓰게 했다.","오늘날의 신용카드 망은 은행이 아니라 식당들이 만들었다.","1950년대 후반에 은행들이 카드를 내놓았지만 1960년대에 모두 사라졌다."],"r":{"a":"1) 1950년대 후반과 1960년대에 은행들이 자체 카드를 내놓았고, 오늘날의 세계적인 신용카드 망을 만드는 데 도움을 주었다.","ev":"11번 문장","s":[[11,"By the late 1950s and 1960s, banks introduced their own cards and helped create the global credit card networks used today.","1950년대 후반과 1960년대에는 은행들이 자체 카드를 내놓았고 오늘날 쓰이는 세계적인 신용카드 망을 만드는 데 일조했다."]],"w":"11번 문장은 1950년대 후반과 1960년대에 은행들이 자체 카드를 내놓았고, 오늘날 쓰이는 세계적인 신용카드 망을 만드는 데 일조했다는 뜻. 선지 2·3·4는 본문에 없거나 반대되는 내용임.","c":1},"h":"280c1ff5dd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["American stores stopped using store credit because customers disliked cards.","Many American stores began using store credit to offer a better option.","Only banks were allowed to offer store credit.","Store credit was invented by hotels in Europe."],"oko":["미국 가게들은 고객들이 카드를 싫어해서 외상 거래를 그만두었다.","많은 미국 가게들이 더 나은 방법을 제공하기 위해 외상 거래(상점 신용)를 쓰기 시작했다.","오직 은행만 외상 거래를 제공할 수 있었다.","외상 거래는 유럽의 호텔들이 처음 만들었다."],"r":{"a":"2) Many American stores began using store credit to offer a better option. (많은 미국 가게들이 더 나은 방법을 제공하기 위해 외상 거래(상점 신용)를 쓰기 시작했다.)","ev":"2번 문장","s":[[2,"To offer a better option, many American stores began using store credit.","더 나은 방법을 제공하기 위해, 많은 미국 가게들이 외상 거래(상점 신용)를 쓰기 시작했다."]],"w":"2번 문장 To offer a better option, many American stores began using store credit. 즉 많은 미국 가게들이 더 나은 방법을 제공하려고 외상 거래를 쓰기 시작함. 나머지 선지는 본문에 없는 내용임.","c":2},"h":"5be51bf2be"},{"n":9,"t":"sum","q":"Diners Club sent customers a single (A) bill, and soon more restaurants, hotels, shops, and (B) joined.","ko":"다이너스 클럽은 고객들에게 하나의 (A) 청구서를 보냈고, 곧 더 많은 식당, 호텔, 상점, (B)이(가) 참여했다.","opts":["(A) monthly / (B) airlines","(A) monthly / (B) schools","(A) daily / (B) airlines","(A) daily / (B) schools","(A) yearly / (B) hospitals"],"oko":["(A) 월별 / (B) 항공사","(A) 월별 / (B) 학교","(A) 일별 / (B) 항공사","(A) 일별 / (B) 학교","(A) 연간 / (B) 병원"],"r":{"a":"1) (A) monthly / (B) airlines ((A) 월별 / (B) 항공사)","ev":"8번, 10번 문장","s":[[8,"Diners Club then sent customers a single monthly bill.","그러고 나서 다이너스 클럽은 고객들에게 한 장의 월별 청구서를 보냈다."],[10,"More restaurants joined, and soon hotels, shops, and airlines followed.","더 많은 식당들이 참여했고, 곧 호텔, 상점, 항공사가 뒤를 이었다."]],"w":"8번 문장에서 다이너스 클럽이 고객들에게 한 장의 월별(monthly) 청구서를 보냈고, 10번 문장에서 더 많은 식당이 참여했으며 곧 호텔, 상점, 항공사(airlines)가 뒤를 이었다고 함. 일별·연간 청구서나 학교·병원은 본문에 없음.","c":1},"h":"a8830c90ab"},{"n":10,"t":"fill","q":"In the early 20th century, [A] was the main way to pay for things, but carrying a lot of money was [B] and inconvenient.","ko":"20세기 초에는 [A]이(가) 물건값을 지불하는 주된 방법이었지만, 많은 돈을 가지고 다니는 것은 [B] 일이었고 불편했다.","bank":["cash","unsafe","hotel","restaurant","single","several"],"bko":{"cash":"현금","unsafe":"안전하지 않은","hotel":"호텔","restaurant":"식당","single":"하나의","several":"여러 개의"},"r":{"a":"[A] cash (현금), [B] unsafe (안전하지 않은)","ev":"1번 문장","s":[[1,"In the early 20th century, cash was the main way to pay for things, but carrying a lot of money was unsafe and inconvenient.","20세기 초에는 현금이 물건값을 지불하는 주된 방법이었지만, 많은 돈을 가지고 다니는 것은 안전하지 않고 불편했다."]],"w":"1번 문장 In the early 20th century, cash was the main way to pay for things, but carrying a lot of money was unsafe and inconvenient. 에서 가져옴. hotel·restaurant·single·several은 이 글에 나오지만 이 빈칸에는 뜻과 모양이 맞지 않음.","c":null},"h":"aa9355862c"}]},{"u":5,"id":"b4-05-3","no":3,"ko":"버려진 철도가 공원이 되었더니 생긴 일은?","items":[{"n":1,"t":"tf","q":"The city turned an old freight railway into a public park called the High Line.","ko":"시는 오래된 화물 철도를 하이라인이라는 공공 공원으로 바꾸었다.","r":{"a":"T (본문과 맞는 내용)","s":[[5,"Instead of removing it, they turned it into a public park called the High Line.","그것을 없애는 대신, 그들은 그것을 하이라인이라는 공공 공원으로 바꾸었다."]],"w":"5번에서 they turned it into a public park called the High Line이라고 함. 철도를 없애지 않고 공원으로 바꾼 것이므로 본문과 같음.","c":"T","ev":"5번 문장"},"h":"7db0699640"},{"n":2,"t":"tf","q":"The city decided to remove the old railway instead of reusing it.","ko":"시는 오래된 철도를 재사용하는 대신 없애기로 결정했다.","r":{"a":"F (본문과 다른 내용)","s":[[4,"One major idea was to reuse an old elevated freight railway that had once carried goods to the factories.","한 가지 주요 아이디어는 한때 공장으로 물건을 실어 나르던 오래된 고가 화물 철도를 재사용하는 것이었다."]],"w":"4번에서 One major idea was to reuse an old elevated freight railway(오래된 고가 철도를 재사용하는 것)라고 함. 없애는 것이 아니라 재사용했으므로 F.","c":"F","ev":"4번 문장"},"h":"6508461533"},{"n":3,"t":"tf","q":"Higher rents made it harder for some longtime residents to stay.","ko":"임대료가 오르자 일부 오래 살아온 주민들이 머물기가 더 어려워졌다.","r":{"a":"T (본문과 맞는 내용)","s":[[9,"However, higher rents made it harder for some longtime residents and small businesses to stay.","하지만 임대료가 오르면서 일부 오래 살아온 주민들과 소규모 사업체가 머물기가 더 어려워졌다."]],"w":"9번에 higher rents made it harder for some longtime residents and small businesses to stay가 있음. 선지는 그 앞부분과 같은 내용.","c":"T","ev":"9번 문장"},"h":"9ce68fb136"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... reuse an old elevated freight railway that had once carried goods to the factories.)","ko":"... 한때 공장으로 물건을 실어 나르던 오래된 ( ) 화물 철도를 재사용하는 것","opts":["땅속의","높이 올려진","끊어진","새로 지은"],"word":"elevated","r":{"a":"2) 높이 올려진","s":[[4,"One major idea was to reuse an old elevated freight railway that had once carried goods to the factories.","한 가지 주요 아이디어는 한때 공장으로 물건을 실어 나르던 오래된 고가 화물 철도를 재사용하는 것이었다."]],"w":"4번에서 elevated는 old와 freight 사이에서 railway를 꾸며 '높이 올려진, 고가의 철도'라는 뜻. 땅속의는 반대 방향.","c":2,"ev":"4번 문장"},"h":"a155913341"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... trendy shops and restaurants moved in ...)","ko":"... ( ) 상점과 식당이 들어왔고","opts":["오래된","값싼","조용한","유행하는"],"word":"trendy","r":{"a":"4) 유행하는","s":[[7,"As more people visited, trendy shops and restaurants moved in, and new luxury apartments were built.","더 많은 사람들이 방문하면서, 유행하는 상점과 식당이 들어왔고 새로운 고급 아파트가 지어졌다."]],"w":"7번에서 공원을 보러 사람들이 몰려오자 새로 들어온 상점과 식당이 trendy. 곧이어 luxury apartments(고급 아파트)도 지어졌다는 흐름이라 '유행하는'이 맞음. 오래된, 값싼은 이 흐름과 반대.","c":4,"ev":"7번 문장"},"h":"6a1fbe042a"},{"n":6,"t":"ref","q":"What does the underlined \"those businesses\" refer to?\nBy the 1980s, many of those businesses had closed, and the area was left with many empty buildings.","ko":"밑줄 친 those businesses이(가) 가리키는 것은?","sko":"1980년대에 이르러 그 사업체들 중 많은 곳이 문을 닫았고, 그 지역에는 많은 빈 건물이 남게 되었다.","pron":"those businesses","opts":["뉴욕시의 시청과 은행","육가공 공장과 창고에 있던 사업체들","하이라인 근처의 유행하는 상점들","관광객을 위한 호텔들"],"r":{"a":"2) 육가공 공장과 창고에 있던 사업체들","ev":"1~2번 문장","s":[[1,"The Meatpacking District in New York City was once a busy center for meat-processing factories and warehouses.","뉴욕시의 미트패킹 지구는 한때 육가공 공장과 창고가 모여 있던 북적이는 중심지였다."],[2,"By the 1980s, many of those businesses had closed, and the area was left with many empty buildings.","1980년대에 이르러 그 사업체들 중 많은 곳이 문을 닫았고, 그 지역에는 많은 빈 건물이 남게 되었다."]],"w":"1번 문장에서 미트패킹 지구는 한때 육가공 공장과 창고가 모여 있던 중심지였다고 했고, 2번 문장의 those businesses는 바로 그 공장과 창고 같은 사업체들. 1980년대에 이들 중 많은 곳이 문을 닫음.","c":2,"k":"those businesses = 육가공 공장과 창고에 있던 사업체들"},"h":"434c4cc56e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It shows why city growth can be both exciting and unfair at the same time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 도시의 성장이 왜 신나는 일이면서 동시에 불공평한 일일 수 있는지를 보여 준다.","opts":["도시가 성장하면 모두에게 똑같이 이익이 된다.","도시의 성장은 지루하고 아무도 관심이 없다.","도시의 성장은 좋은 면도 있지만 불공평한 면도 함께 있을 수 있다.","도시의 성장은 불공평하기 때문에 멈춰야 한다."],"r":{"a":"3) 도시의 성장은 좋은 면도 있지만 불공평한 면도 함께 있을 수 있다.","s":[[11,"It shows why city growth can be both exciting and unfair at the same time.","이것은 도시의 성장이 왜 신나는 일이면서 동시에 불공평한 일일 수 있는지를 보여 준다."]],"w":"both exciting and unfair at the same time은 '신나기도 하고 동시에 불공평하기도 하다'. 6~8번 좋은 면과 9번 나쁜 면을 한 번에 정리한 말. 멈춰야 한다는 말은 본문에 없음.","c":3,"ev":"11번 문장"},"h":"9a40c110f8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["The park was popular only with tourists.","The park quickly became popular with both locals and tourists.","The park was closed soon after it opened.","Nobody visited the park at first."],"oko":["그 공원은 관광객에게만 인기가 있었다.","그 공원은 주민들과 관광객 모두에게 빠르게 인기를 얻었다.","그 공원은 문을 연 직후 곧 닫혔다.","처음에는 아무도 그 공원을 찾지 않았다."],"r":{"a":"2) The park quickly became popular with both locals and tourists. (그 공원은 주민들과 관광객 모두에게 빠르게 인기를 얻었다.)","ev":"6번 문장","s":[[6,"The park quickly became popular with locals and tourists.","그 공원은 주민들과 관광객 모두에게 빠르게 인기를 얻었다."]],"w":"6번 문장 The park quickly became popular with locals and tourists. 즉 주민과 관광객 모두에게 빠르게 인기를 얻었음. 관광객에게만 인기가 있었다거나 아무도 오지 않았다는 말은 본문과 다름.","c":2},"h":"e9f80205df"},{"n":9,"t":"sum","q":"When (A) improves a neighborhood but also pushes out existing (B), it is called gentrification.","ko":"(A)이(가) 동네를 개선하지만 기존 (B)을(를) 밀어내기도 할 때, 이를 젠트리피케이션이라고 부른다.","opts":["(A) investment / (B) factories","(A) pollution / (B) communities","(A) investment / (B) communities","(A) pollution / (B) factories","(A) investment / (B) tourists"],"oko":["(A) 투자 / (B) 공장","(A) 오염 / (B) 공동체","(A) 투자 / (B) 공동체","(A) 오염 / (B) 공장","(A) 투자 / (B) 관광객"],"r":{"a":"3) (A) investment / (B) communities ((A) 투자 / (B) 공동체)","ev":"10번 문장","s":[[10,"This kind of change, where investment improves a neighborhood but also pushes out existing communities, is called gentrification.","투자가 동네를 개선하지만 기존 공동체를 밀어내기도 하는 이런 종류의 변화는 젠트리피케이션이라고 불린다."]],"w":"10번 문장 This kind of change, where investment improves a neighborhood but also pushes out existing communities, is called gentrification. 에서 가져옴. 투자(investment)가 동네를 개선하지만 기존 공동체(communities)를 밀어냄.","c":3},"h":"60c4e2a303"},{"n":10,"t":"fill","q":"Property [A] rose, and the area became more popular and more [B].","ko":"부동산 [A]이(가) 올랐고, 그 지역은 더 인기 있고 더 [B] 곳이 되었다.","bank":["values","expensive","tourists","empty","closed","railway"],"bko":{"values":"가치","expensive":"비싼","tourists":"관광객","empty":"텅 빈","closed":"닫힌","railway":"철도"},"r":{"a":"[A] values (가치), [B] expensive (비싼)","ev":"8번 문장","s":[[8,"Property values rose, and the area became more popular and more expensive.","부동산 가치가 올랐고, 그 지역은 더 인기 있고 더 비싸졌다."]],"w":"8번 문장 Property values rose, and the area became more popular and more expensive. 에서 가져옴. tourists·empty·closed·railway는 본문에 나오지만 이 빈칸에는 뜻이 맞지 않음.","c":null},"h":"52f76e7900"}]},{"u":5,"id":"b4-05-4","no":4,"ko":"사지 않고 빌려 쓰는 시대, 구독 경제의 두 얼굴?","items":[{"n":1,"t":"tf","q":"People once bought products mainly to use them for a short time.","ko":"사람들은 한때 주로 제품을 짧게 사용하기 위해 샀다.","r":{"a":"F (본문과 다른 내용)","s":[[1,"People once bought products mainly to own them.","사람들은 한때 주로 제품을 소유하기 위해 샀다."]],"w":"1번에서 People once bought products mainly to own them(소유하기 위해)이라고 함. 짧게 쓰려고 산 것이 아니므로 F.","c":"F","ev":"1번 문장"},"h":"b66a6195cb"},{"n":2,"t":"tf","q":"In the subscription economy, people pay a small monthly fee to use products or services.","ko":"구독 경제에서 사람들은 제품이나 서비스를 이용하기 위해 적은 월 이용료를 낸다.","r":{"a":"T (본문과 맞는 내용)","s":[[3,"This change has led to the subscription economy, where people pay a small monthly fee to use products or services for a certain time.","이 변화는 구독 경제로 이어졌는데, 구독 경제에서는 사람들이 일정 기간 제품이나 서비스를 이용하기 위해 적은 월 이용료를 낸다."]],"w":"3번에서 subscription economy를 where people pay a small monthly fee to use products or services라고 설명함. 선지와 같음.","c":"T","ev":"3번 문장"},"h":"6d64d5cd47"},{"n":3,"t":"tf","q":"Music and movie streaming services are examples of subscriptions.","ko":"음악 및 영화 스트리밍 서비스는 구독의 예이다.","r":{"a":"T (본문과 맞는 내용)","s":[[4,"These include music and movie streaming services and even furniture.","여기에는 음악 및 영화 스트리밍 서비스와 심지어 가구도 포함된다."]],"w":"4번에서 These include music and movie streaming services and even furniture라고 함. 이 서비스들이 구독 경제의 예이므로 T.","c":"T","ev":"4번 문장"},"h":"977b2c3453"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... without worrying about owning or maintaining anything.)","ko":"... 소유하거나 ( ) 것을 걱정하지 않고","opts":["버리는","빌려 주는","관리하고 유지하는","새로 만드는"],"word":"maintaining","r":{"a":"3) 관리하고 유지하는","s":[[6,"This convenient access also allows consumers to explore new services and switch between them without worrying about owning or maintaining anything.","이 편리한 접근은 또한 소비자가 소유하거나 관리하는 것을 걱정하지 않고 새로운 서비스를 체험해 보고 그것들 사이를 바꿀 수 있게 해 준다."]],"w":"6번에서 구독은 owning(소유하는 것)이나 maintaining(관리·유지하는 것)을 걱정하지 않고 서비스를 바꿀 수 있다는 장점. 물건을 가지고 있을 때 따라오는 일이므로 '관리하고 유지하는'이 맞음.","c":3,"ev":"6번 문장"},"h":"1db445b12e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, there are drawbacks, too.)","ko":"하지만 ( )도 있다.","opts":["이점","규칙","선물","단점"],"word":"drawbacks","r":{"a":"4) 단점","s":[[7,"However, there are drawbacks, too.","하지만 단점도 있다."]],"w":"7번 앞(5~6번)은 장점, 뒤(8~10번)는 총비용이 높아지고 소유하지 못한다는 내용. However로 방향이 바뀐 것이므로 drawbacks = 단점. 이점은 반대 뜻.","c":4,"ev":"7번 문장"},"h":"9c0fe08ad9"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt offers convenience and choice, but it also requires consumers to make thoughtful decisions about what they pay for.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 편리함과 선택권을 주지만, 소비자가 무엇에 돈을 낼지 신중하게 결정해야 하기도 한다.","opts":["디지털 기술","구독 경제","월별 요금","소비자들"],"r":{"a":"2) 구독 경제","s":[[11,"Today, the subscription economy is a major part of modern life.","오늘날 구독 경제는 현대 생활의 중요한 부분이다."],[12,"It offers convenience and choice, but it also requires consumers to make thoughtful decisions about what they pay for.","그것은 편리함과 선택권을 주지만, 소비자가 무엇에 돈을 낼지 신중하게 결정해야 하기도 한다."]],"w":"11번에서 the subscription economy is a major part of modern life라고 했고, 12번의 It은 이 구독 경제를 가리킴. 구독 경제가 편리함과 선택권을 주고, 신중한 결정도 요구한다는 뜻.","c":2,"ev":"11~12번 문장"},"h":"23b6bb7c1b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But as digital technology has spread, consumers have begun to value convenience and variety more than ownership.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 디지털 기술이 퍼지면서, 소비자들은 소유보다 편리함과 다양함을 더 중요하게 여기기 시작했다.","opts":["디지털 기술이 퍼지면서 소비자들은 소유보다 편리함과 다양함을 더 중요하게 여기게 되었다.","디지털 기술 때문에 소비자들은 편리함보다 소유를 더 중요하게 여기게 되었다.","디지털 기술이 퍼지기 전에는 소비자들이 다양함을 가장 중요하게 여겼다.","소비자들은 편리함과 다양함이 싫어서 소유에 집착하기 시작했다."],"r":{"a":"1) 디지털 기술이 퍼지면서 소비자들은 소유보다 편리함과 다양함을 더 중요하게 여기게 되었다.","s":[[2,"But as digital technology has spread, consumers have begun to value convenience and variety more than ownership.","하지만 디지털 기술이 퍼지면서, 소비자들은 소유보다 편리함과 다양함을 더 중요하게 여기기 시작했다."]],"w":"value A more than B는 'B보다 A를 더 중요하게 여기다'. A = convenience and variety, B = ownership이라 소유보다 편리함과 다양함이 더 중요해졌다는 뜻.","c":1,"ev":"2번 문장"},"h":"bbdbc66c01"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["구독하려면 큰 금액의 연회비를 내야 한다.","여러 서비스를 구독하면 총비용이 낮아진다.","요금 내는 것을 멈추면 이용이 바로 끝난다.","구독 서비스를 이용하려면 제품을 소유해야 한다."],"opts":["You must pay a large yearly fee to subscribe.","Subscribing to many services keeps the total cost low.","Your access ends right away when you stop paying the fee.","Subscriptions require consumers to own the products."],"r":{"a":"3) 요금 내는 것을 멈추면 이용이 바로 끝난다.","s":[[10,"Once you stop paying the fee, your access ends right away.","요금 내는 것을 멈추면, 당신의 이용 권한은 바로 끝난다."]],"w":"10번에서 Once you stop paying the fee, your access ends right away라고 함. ①은 3번의 small monthly fee(적은 월 이용료)와 다름. ②는 8번(총비용이 매우 높아질 수 있음)과 반대. ④는 구독은 소유가 아니라 이용이라서 다름.","c":3,"ev":"10번 문장"},"h":"9a89176c83"},{"n":9,"t":"sum","q":"Subscriptions (A) consumers by offering quick access to a wide (B) of options through one monthly payment.","ko":"구독은 하나의 월 결제로 폭넓은 (B)의 선택지에 빠르게 접근할 수 있게 해 주어 소비자를 (A).","opts":["(A) attract / (B) range","(A) attract / (B) price","(A) scare / (B) range","(A) scare / (B) price","(A) attract / (B) rule"],"oko":["(A) 끌어들인다 / (B) 범위","(A) 끌어들인다 / (B) 가격","(A) 겁먹게 한다 / (B) 범위","(A) 겁먹게 한다 / (B) 가격","(A) 끌어들인다 / (B) 규칙"],"r":{"a":"1) (A) attract / (B) range ((A) 끌어들인다 / (B) 범위)","ev":"5번 문장","s":[[5,"Subscriptions attract consumers by offering quick access to a wide range of options through one monthly payment.","구독은 하나의 월 결제로 폭넓은 선택지에 빠르게 접근할 수 있게 해 줌으로써 소비자를 끌어들인다."]],"w":"5번 문장 Subscriptions attract consumers by offering quick access to a wide range of options through one monthly payment. 에서 가져옴. 소비자를 끌어들이고(attract) 폭넓은 범위(range)의 선택지를 준다는 뜻. scare·price·rule은 본문과 맞지 않음.","c":1},"h":"6ce6f18a2b"},{"n":10,"t":"fill","q":"Also, you never [A] own the items or [B].","ko":"또한 당신은 그 물건이나 [B]을(를) 결코 [A] 소유하지 못한다.","bank":["truly","content","thoughtful","variety","convenience","drawbacks"],"bko":{"truly":"진짜로","content":"콘텐츠","thoughtful":"신중한","variety":"다양함","convenience":"편리함","drawbacks":"단점"},"r":{"a":"[A] truly (진짜로), [B] content (콘텐츠)","ev":"9번 문장","s":[[9,"Also, you never truly own the items or content.","또한 당신은 그 물건이나 콘텐츠를 결코 진짜로 소유하지 못한다."]],"w":"9번 문장 Also, you never truly own the items or content. 에서 가져옴. thoughtful·variety·convenience·drawbacks는 본문에 나오지만 이 빈칸에는 뜻과 모양이 맞지 않음.","c":null},"h":"25ff77f117"}]},{"u":6,"id":"b4-06-1","no":1,"ko":"조용한 속삭임이 몸에 일으키는 변화는?","items":[{"n":1,"t":"tf","q":"Scientists experimented with 38 young adults to find out whether ASMR affects the body and brain.","ko":"과학자들은 ASMR이 몸과 뇌에 영향을 주는지 알아보기 위해 38명의 젊은 성인을 대상으로 실험했다.","r":{"a":"T (본문과 맞는 내용)","s":[[6,"But can ASMR actually affect the body and brain?","하지만 ASMR이 실제로 몸과 뇌에 영향을 줄 수 있을까?"],[7,"To find out, scientists experimented with 38 young adults.","알아보기 위해, 과학자들은 38명의 젊은 성인을 대상으로 실험했다."]],"w":"6번에서 ASMR이 몸과 뇌에 영향을 줄 수 있는지 묻고, 7번에서 To find out(알아보기 위해) 38명의 젊은 성인으로 실험했다고 함. 선지와 같음.","c":"T","ev":"6~7번 문장"},"h":"88922afd28"},{"n":2,"t":"tf","q":"Almost 60% of the participants said they experienced a tingling feeling during the videos.","ko":"참가자의 거의 60%가 영상을 보는 동안 찌릿한 느낌을 경험했다고 말했다.","r":{"a":"F (본문과 다른 내용)","s":[[10,"Almost 40% of the participants said they experienced a tingling feeling during the videos.","참가자의 거의 40%가 영상을 보는 동안 찌릿한 느낌을 경험했다고 말했다."]],"w":"10번에서 찌릿한 느낌을 경험했다고 한 사람은 almost 40%임. 60%가 아니므로 F.","c":"F","ev":"10번 문장"},"h":"949b3bac7c"},{"n":3,"t":"tf","q":"Most participants’ heart rates slowed down after watching the videos.","ko":"대부분 참가자의 심박수는 영상을 본 후에 느려졌다.","r":{"a":"T (본문과 맞는 내용)","s":[[12,"Most participants’ heart rates also slowed down, which means their bodies became calmer.","대부분 참가자의 심박수도 느려졌는데, 이는 그들의 몸이 더 차분해졌다는 뜻이다."]],"w":"12번에서 Most participants’ heart rates also slowed down이라고 함. 심박수가 느려졌다는 내용과 같음.","c":"T","ev":"12번 문장"},"h":"11b16bfca6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (ASMR is a pleasant tingling feeling triggered by certain sounds.)","ko":"ASMR은 특정한 소리에 의해 ( ) 기분 좋은 찌릿한 느낌이다.","opts":["숨겨지는","유발되는","팔리는","멈춰지는"],"word":"triggered","r":{"a":"2) 유발되는","s":[[3,"ASMR is a pleasant tingling feeling triggered by certain sounds.","ASMR은 특정한 소리에 의해 유발되는 기분 좋은 찌릿한 느낌이다."],[4,"Common ASMR triggers include whispering, tapping, crinkling materials, and brushing sounds.","흔한 ASMR 유발 소리에는 속삭이는 소리, 두드리는 소리, 바스락거리는 재료 소리, 솔질하는 소리가 있다."]],"w":"3번 뒤 4번에서 whispering, tapping 같은 소리들을 ASMR triggers라고 소개함. 소리가 찌릿한 느낌을 일으키는 것이므로 triggered by = '~에 의해 유발되는'.","c":2,"ev":"3~4번 문장"},"h":"28508d9152"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Brain scans revealed that they had increased focus and attention after watching.)","ko":"뇌 검사에서 그들이 시청 후에 집중력과 주의력이 ( ) 것이 드러났다.","opts":["줄어든","사라진","느려진","높아진"],"word":"increased","r":{"a":"4) 높아진","s":[[13,"Brain scans revealed that they had increased focus and attention after watching.","뇌 검사에서 그들이 시청 후에 집중력과 주의력이 높아졌음이 드러났다."]],"w":"13번은 ASMR이 몸과 뇌에 좋은 영향을 준다는 결과. 14~15번에서 기분이 나아진다고 정리하므로 increased = 높아진. 줄어든(reduce)은 반대 방향.","c":4,"ev":"13번 문장"},"h":"835916b487"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nThey showed the participants ASMR videos and measured their heart rate, mood, and brain activity before and after watching.","ko":"밑줄 친 their가 가리키는 것은?","sko":"그들은 참가자들에게 ASMR 영상을 보여 주고, 시청 전후의 심박수, 기분, 뇌 활동을 측정했다.","opts":["과학자들","참가자들","영상을 만든 사람들","ASMR 영상들"],"r":{"a":"2) 참가자들","s":[[8,"They showed the participants ASMR videos and measured their heart rate, mood, and brain activity before and after watching.","그들은 참가자들에게 ASMR 영상을 보여 주고, 시청 전후의 심박수, 기분, 뇌 활동을 측정했다."]],"w":"8번에서 과학자들이 참가자들에게 영상을 보여 주고 their heart rate(그들의 심박수)를 측정했다고 함. 심박수를 측정당한 쪽은 영상을 본 참가자들.","c":2,"ev":"8번 문장","k":"their = 참가자들"},"pron":"their","h":"539010700e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because sometimes, a few simple sounds are all you need to feel better.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"왜냐하면 때로는 몇 가지 단순한 소리만으로도 기분이 나아지기에 충분하기 때문이다.","opts":["때로는 몇 가지 단순한 소리만으로도 기분이 나아질 수 있다.","기분이 나아지려면 아주 많은 소리가 필요하다.","몇 가지 소리는 기분을 더 나쁘게 만든다.","단순한 소리는 기분과 아무 관계가 없다."],"r":{"a":"1) 때로는 몇 가지 단순한 소리만으로도 기분이 나아질 수 있다.","s":[[15,"Because sometimes, a few simple sounds are all you need to feel better.","왜냐하면 때로는 몇 가지 단순한 소리만으로도 기분이 나아지기에 충분하기 때문이다."]],"w":"a few simple sounds are all you need는 '몇 가지 단순한 소리면 충분하다'. 14번 결론(ASMR은 단순한 재미만은 아님)을 받는 이유 문장.","c":1,"ev":"15번 문장"},"h":"1fdd3b6332"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["ASMR은 사람들을 긴장시키는 시끄러운 소음이다.","참가자들은 실험이 시작되기 전에만 ASMR 영상을 보았다.","찌릿한 느낌을 경험한 사람들은 그 후에 더 낮은 수준의 슬픔을 보였다.","뇌 검사는 시청 후 집중력이 낮아졌음을 보여 주었다."],"opts":["ASMR is a loud noise that makes people nervous.","The participants watched ASMR videos only before the experiment began.","People who felt tingling showed lower levels of sadness afterward.","Brain scans showed lower focus after watching."],"r":{"a":"3) 찌릿한 느낌을 경험한 사람들은 그 후에 더 낮은 수준의 슬픔을 보였다.","s":[[3,"ASMR is a pleasant tingling feeling triggered by certain sounds.","ASMR은 특정한 소리에 의해 유발되는 기분 좋은 찌릿한 느낌이다."],[8,"They showed the participants ASMR videos and measured their heart rate, mood, and brain activity before and after watching.","그들은 참가자들에게 ASMR 영상을 보여 주고, 시청 전후의 심박수, 기분, 뇌 활동을 측정했다."],[11,"These people showed lower levels of sadness afterward.","이 사람들은 그 후에
