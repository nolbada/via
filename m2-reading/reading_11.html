rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Hello, everyone! I’m Yuna, and I’m the leader of Warm Hearts, an club at our school.", "ko": "안녕하세요, 여러분! 저는 유나이고, 우리 학교 동아리인 ‘따뜻한 마음’의 회장이에요.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [11], "point": "관사: club은 자음 발음[k]으로 시작하므로 부정관사 a 사용", "topic": "관사", "memo": "club은 자음 발음[k]으로 시작하므로 부정관사 a 사용"}]}, {"n": 2, "tag": null, "en": "Our club have solved some problem in our school and our community over the past few years.", "ko": "우리 동아리는 지난 몇 년간 우리 학교 및 지역사회의 몇몇 문제를 해결해 왔어요.", "ok": false, "foot": [], "fixes": [{"wrong": "have solved", "right": "has solved", "partial": false, "at": [2], "point": "현재완료: 주어 Our club(단수)에 맞춰 has + 과거분사 사용", "topic": "현재완료", "memo": "주어 Our club(단수)에 맞춰 has + 과거분사 사용"}, {"wrong": "problem", "right": "problems", "partial": false, "at": [5], "point": "명사의 수: 여러 문제를 해결했다는 문맥이므로 복수형 problems 사용", "topic": "명사의 수", "memo": "여러 문제를 해결했다는 문맥이므로 복수형 problems 사용"}]}, {"n": 3, "tag": null, "en": "I want sharing our stories.", "ko": "우리의 이야기를 여러분과 나누고 싶어요.", "ok": false, "foot": [], "fixes": [{"wrong": "sharing", "right": "to share", "partial": false, "at": [2], "point": "to부정사(명사적 용법): want 뒤에는 to부정사 사용 (동명사 불가)", "topic": "to부정사(명사적 용법)", "memo": "want 뒤에는 to부정사 사용 (동명사 불가)"}]}, {"n": 4, "tag": null, "en": "One day, our school principal announced, “Our students often takes too much food and wasting it at lunchtime. How can we reduce food waste?”", "ko": "어느 날 교장선생님이 “점심시간에 학생들이 종종 음식을 너무 많이 가져가서 버립니다. 어떻게 음식물 쓰레기를 줄일 수 있을까요?”라고 말씀하셨어요.", "ok": false, "foot": [], "fixes": [{"wrong": "takes", "right": "take", "partial": false, "at": [9], "point": "수일치: 주어 students(복수)에 맞춰 동사원형 take 사용", "topic": "수일치", "memo": "주어 students(복수)에 맞춰 동사원형 take 사용"}, {"wrong": "wasting", "right": "waste", "partial": false, "at": [14], "point": "병렬구조: take와 and로 연결되므로 동사원형 waste 사용", "topic": "병렬구조", "memo": "take와 and로 연결되므로 동사원형 waste 사용"}]}, {"n": 5, "tag": null, "en": "The members of u can see, your actions can make positive changes.", "이렇듯 여러분의 행동은 긍정적인 변화를 만들 수 있어요.", 0], ["Even the smallest acts can make a big difference!", "가장 작은 행위일지라도 큰 차이를 만들 수 있어요!", 0]];var RNUM=11;var TITLE_EN="Warm Hearts for Our Community";var PASS_EN=["Warm Hearts for Our Community", "Hello, everyone! I’m Yuna, and I’m the leader of Warm Hearts, a club at our school. Our club has solved some problems in our school and our community over the past few years. I want to share our stories. One day, our school principal announced, “Our students often take too much food and waste it at lunchtime. How can we reduce food waste?” The members of Warm Hearts gathered to solve this problem. We thought that adding lines to food trays would be helpful. Students could look at the lines and take the right amount of food. Our school principal liked this idea, so he changed the food trays in the cafeteria. It was a success! The new trays reduced a large amount of food waste! After we solved this problem at our school, we started to look for problems in our community. We found out that some roads around our school were very dark at night. We all agreed that the roads needed more lights. With the help of a teacher, we put up lights with sensors around the neighborhood. Now all our neighbors feel safer than before! Have you ever used a digital kiosk before? You may think it's easy. But some people have trouble using kiosks. To help them, we volunteered as digital guides at the community center. We explained every step of ordering: starting an order, choosing from the menu, and paying. After the class, people said, “Now we feel more comfortable with kiosks. Thank you so much!” We felt very proud. As you can see, your actions can make positive changes. Even the smallest acts can make a big difference!"];var PASS_KO=["우리 지역사회를 위한 따뜻한 마음", "안녕하세요, 여러분! 저는 유나이고, 우리 학교 동아리인 ‘따뜻한 마음’의 회장이에요. 우리 동아리는 지난 몇 년간 우리 학교 및 지역사회의 몇몇 문제를 해결해 왔어요. 우리의 이야기를 여러분과 나누고 싶어요. 어느 날 교장선생님이 “점심시간에 학생들이 종종 음식을 너무 많이 가져가서 버립니다. 어떻게 음식물 쓰레기를 줄일 수 있을까요?”라고 말씀하셨어요. ‘따뜻한 마음’의 회원들은 이 문제를 해결하기 위해 모였어요. 우리는 식판에 선을 표시하는 것이 도움이 될 거라 생각했어요. 학생들이 선을 보고 적당한 양의 음식을 가져갈 수 있죠. 교장선생님은 이 생각을 마음에 들어 하셨고, 구내식당의 식판을 교체하셨어요. 그건 성공적이었죠! 새 식판은 많은 양의 음식물 쓰레기를 줄였어요! 우리 학교의 이 문제를 해결한 뒤 우리는 우리 지역사회의 문제를 찾아보기 시작했어요. 우리는 우리 학교 주위의 일부 도로가 밤에 무척 어둡다는 걸 발견했어요. 우리는 모두 거리에 등이 더 필요하다고 동의했어요. 한 선생님의 도움을 받아 우리는 인근에 센서가 있는 등을 설치했어요. 이제 모든 우리의 이웃들이 예전보다 더 안전하다고 느껴요! 여러분은 디지털 키오스크를 써 본 적이 있나요? 여러분은 그게 쉽다고 생각할 거예요. 하지만 어떤 사람들은 키오스크를 사용하는 데 어려움을 겪어요. 그런 사람들을 돕기 위해 우리는 주민센터에서 디지털 가이드로 자원봉사를 했어요. 우리는 주문을 시작하고, 메뉴에서 고르고, 결제하는 모든 주문 절차를 설명했어요. 수업이 끝나고 사람들은 “이제 우리는 키오스크가 좀 더 편하게 느껴져요. 정말 고마워요!”라고 말했어요. 우리는 정말 뿌듯했어요. 이렇듯 여러분의 행동은 긍정적인 변화를 만들 수 있어요. 가장 작은 행위일지라도 큰 차이를 만들 수 있어요!"];var DG=[{"dlg": [["B", "Good morning, Soye! What are you doing?", "좋은 아침이야, 소예야! 뭐 하고 있어?"], ["G", "Hi, Ben. I’m trying to put up a poster, but it’s not easy.", "안녕, Ben. 포스터를 붙이려고 하는데 쉽지 않아."], ["B", "Can I help you? I can hold it for you.", "내가 도와줄까? 내가 그걸 잡아 줄 수 있어."], ["G", "Sure! Thank you for lending a hand.", "좋아! 도와줘서 고마워."], ["B", "You’re welcome. What is this poster for?", "천만에. 이 포스터는 무엇을 위한 거야?"], ["G", "It’s for the Community Cleanup.", "지역 대청소를 위한 거야."], ["B", "What is the Community Cleanup?", "지역 대청소가 뭐야?"], ["G", "It’s a volunteer activity. People sweep the streets and pick up trash to make our neighborhood clean.", "그건 자원봉사 활동이야. 사람들이 우리 동네를 깨끗하게 만들기 위해 거리를 쓸고 쓰레기를 주워."], ["B", "That’s a good idea! Can I join?", "좋은 생각이다! 나도 참여할 수 있어?"], ["G", "Of course! It is open to everyone.", "물론이지! 누구나 참여할 수 있어."]], "qs": [{"n": 1, "q": "위 대화의 내용과 일치하지 않는 것은?", "o": ["Putting up a poster is difficult for Soye.", "Ben helps Soye by holding the poster.", "Soye says thank you to Ben for helping her.", "The Community Cleanup is a volunteer activity to clean the neighborhood.", "The Community Cleanup welcomes people with special skills."], "a": 4, "ans": "The Community Cleanup welcomes people with special skills.", "evs": [["G: Of course! It is ope  var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});

function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';

   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});

var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}

 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}

 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
