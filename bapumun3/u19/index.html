더운)이 어떤 모양으로 오며, 마지막에 무엇이 오는지 순서대로 확인해 보세요.", "h2": "부정 원급 비교는 「not as[so] + 원급 + as」예요. 첫 번째 칸과 마지막 칸의 말이 짝이 되고, 가운데는 원래 모양이에요.", "why": "'~만큼 …하지 않은'은 not as[so] + 원급 + as예요. The weather is not so hot as before.(날씨가 전처럼 덥지는 않다.)가 맞아요.", "opts": [{"n": "①", "en": "The weather is not so hot so before.", "ko": "날씨는 전처럼 덥지 않다.(so가 두 번 쓰인 문장)", "ok": false, "why": "마지막에 as가 아니라 so가 와서 틀려요. 짝은 so ~ as예요."}, {"n": "②", "en": "The weather is not as hot so before.", "ko": "날씨는 전처럼 덥지 않다.(as와 so가 섞인 문장)", "ok": false, "why": "as와 짝이 되는 말은 as예요. 마지막이 so라서 틀려요."}, {"n": "③", "en": "The weather is not hot as before.", "ko": "날씨는 전처럼 덥지 않다.(앞쪽 as가 빠진 문장)", "ok": false, "why": "hot 앞에 as나 so가 없어서 틀려요."}, {"n": "④", "en": "The weather is not so hot as before.", "ko": "날씨는 전처럼 덥지는 않다.", "ok": true, "why": "not so + 원급(hot) + as라서 맞아요."}, {"n": "⑤", "en": "The weather is not so hotter as before.", "ko": "날씨는 전보다 덥지 않다.(어색한 문장)", "ok": false, "why": "가운데에 비교급 hotter(더 더운)를 써서 틀려요. 원급 hot을 써요."}], "pencil": "부정 비교는 not as[so] + 원급 + ___", "pencilKey": "as", "page": 189, "sec": "s1"}, {"id": "S1-08", "step": 1, "no": 8, "qtype": "유형 01 원급 비교", "type": "mc", "ans": "③", "concept": ["033"], "gap": "", "words": [["reply", "답장하다"], ["as soon as possible", "가능한 한 빨리"]], "h1": "as soon as possible은 '가능한 한 빨리'라는 뜻이에요. possible(가능한) 대신 '주어 + can'을 쓰는 표현이 있어요. 보기에서 can이 들어간 것을 찾아 주어를 살펴보세요.", "h2": "Please reply(답장해 주세요) 같은 명령문은 듣는 사람에게 하는 말이에요. 그러면 can 앞에 오는 주어는 누구일까요?", "why": "as soon as possible은 as soon as + 주어 + can으로 바꿔 쓸 수 있어요. 명령문의 주어는 you라서 as you can이에요.", "opts": [{"n": "①", "en": "as you did", "ko": "네가 했던 것처럼", "ok": false, "why": "did(했다)는 과거라서 '가능한'이라는 뜻을 나타내지 못해요."}, {"n": "②", "en": "as you are", "ko": "네가 있는 그대로", "ok": false, "why": "are(이다)는 '가능한'이라는 뜻이 없어요."}, {"n": "③", "en": "as you can", "ko": "네가 할 수 있는 만큼", "ok": true, "why": "possible(가능한)과 같은 뜻이에요. 맞아요."}, {"n": "④", "en": "as you do", "ko": "네가 하는 대로", "ok": false, "why": "do(하다)는 '가능한'이라는 뜻이 없어요."}, {"n": "⑤", "en": "as she can", "ko": "그녀가 할 수 있는 만큼", "ok": false, "why": "can은 맞지만 주어가 she라서 틀려요. 명령문은 you를 써요."}], "pencil": "as ~ as possible는 as ~ as + 주어 + ___", "pencilKey": "can", "page": 189, "sec": "s1"}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 01 원급 비교", "type": "mc", "ans": "②, ⑤", "concept": ["034-H1", "033"], "gap": "", "words": [["twice", "두 배로"], ["desk", "책상"], ["large", "큰"]], "h1": "'두 배'를 영어로 어떻게 말하는지 생각해 보세요. 정답은 두 개예요. 빈칸 뒤에 as large as가 이어져요.", "h2": "「배수 + as + 원급 + as」에서 두 배는 한 단어, 또는 두 단어로 말해요. 한 단어는 two와 비슷하게 생겼지만 모양이 달라요.", "why": "'두 배'는 twice 또는 two times예요. 그래서 This desk is twice[two times] as large as mine.(이 책상은 내 것보다 두 배 더 크다.)이 돼요.", "opts": [{"n": "①", "en": "two", "ko": "둘", "ok": false, "why": "two만 쓰면 '두 배'가 아니라 그냥 숫자 2예요."}, {"n": "②", "en": "twice", "ko": "두 배", "ok": true, "why": "두 배를 나타내는 말이라서 맞아요."}, {"n": "③", "en": "second", "ko": "두 번째", "ok": false, "why": "순서를 나타내는 말이라서 틀려요."}, {"n": "④", "en": "half", "ko": "절반", "ok": false, "why": "절반이라서 '두 배'와 반대 뜻이에요."}, {"n": "⑤", "en": "two times", "ko": "두 배", "ok": true, "why": "times를 써서 두 배를 나타낼 수 있어요. 맞아요."}], "pencil": "'두 배'는 twice 또는 two ___", "pencilKey": "times", "page": 189, "sec": "s1"}, {"id": "S1-10", "step": 1, "no": 10, "qtype": "유형 01 원급 비교", "type": "write", "ans": "quiet → quietly", "concept": ["033"], "gap": "", "words": [["quiet", "조용한"], ["quietly", "조용하게"], ["library", "도서관"]], "h1": "'도서관에서 가능한 한 조용히 말하라'에서 '조용히'가 어떤 말을 꾸미는지 보세요. 꾸밈을 받는 말은 speak(말하다)예요.", "h2": "speak(말하다)처럼 동작을 하는 말을 꾸밀 때는 형용사가 아니라 부사를 써요. quiet(조용한)를 -ly를 붙인 모양으로 바꿔 보세요.", "why": "as quiet as possible의 quiet는 '조용한'이라는 형용사예요. 동사 speak를 꾸미려면 부사 quietly(조용하게)로 써야 해요.", "opts": [], "pencil": "동작을 꾸밀 때는 형용사가 아니라 ___ 를 써요", "pencilKey": "부사", "page": 190, "sec": "s1"}, {"id": "S1-11", "step": 1, "no": 11, "qtype": "유형 01 원급 비교", "type": "mc", "ans": "⑤", "concept": ["033"], "gap": "", "words": [["raise", "올리다"], ["arm", "팔"], ["high", "높이"]], "h1": "'가능한 한 높이 팔을 올려라'를 영어로 바꾸면 as ~ as ~ can 틀이에요. 먼저 같은 정도를 말하는 첫 번째 as부터 놓아 보세요.", "h2": "순서는 「as + 원급(high) + as + 주어(you) + can」이에요. can은 맨 마지막에 와요.", "why": "as high as you can(네가 할 수 있는 한 높게)의 순서예요. Raise your arms as high as you can.(가능한 한 높이 팔을 올려라.)이 돼요.", "opts": [{"n": "①", "en": "you can as high as", "ko": "(어순이 맞지 않아 뜻이 되지 않는 배열)", "ok": false, "why": "as ~ as 틀이 아니라서 틀려요. 첫 단어가 you라 첫 번째 as의 자리를 못 지켜요."}, {"n": "②", "en": "as can high as you", "ko": "(어순이 맞지 않아 뜻이 되지 않는 배열)", "ok": false, "why": "can이 가운데에 와서 틀려요. 주어 you가 can 앞에 와야 해요."}, {"n": "③", "en": "as you can high as", "ko": "(어순이 맞지 않아 뜻이 되지 않는 배열)", "ok": false, "why": "high가 can 뒤, 두 번째 as 앞에 와서 틀려요. high는 두 as 사이에 와요."}, {"n": "④", "en": "as you can as high", "ko": "(어순이 맞지 않아 뜻이 되지 않는 배열)", "ok": false, "why": "as ~ as 사이에 you can이 들어가 틀려요. 높게(high)가 as와 as 사이에 와요."}, {"n": "⑤", "en": "as high as you can", "ko": "네가 할 수 있는 한 높이", "ok": true, "why": "as + high + as + you + can 순서라서 맞아요."}], "pencil": "as + 원급 + as + 주어 + ___ 순서", "pencilKey": "can", "page": 190, "sec": "s1"}, {"id": "S1-12", "step": 1, "no": 12, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "⑤", "concept": ["034", "032"], "gap": "", "words": [["gift", "선물"], ["valuable", "값진"], ["special", "특별한"]], "h1": "빈칸 뒤에 than(~보다)이 있어요. than과 짝이 되는 모양이 무엇인지 생각하면서 보기를 보세요.", "h2": "than 앞에는 더 ~한이라는 비교급을 써요. 원급이나 최상급은 than과 어울리지 않아요. 비교급 모양인 보기를 찾아보세요.", "why": "than이 있으니 「비교급 + than」이에요. more special(더 특별한)이 비교급이라서 '그녀의 선물은 나에게 다른 어떤 것보다 더 특별하다'가 돼요.", "opts": [{"n": "①", "en": "valuable", "ko": "값진", "ok": false, "why": "원급이라서 than과 짝이 될 수 없어요. more valuable이어야 해요."}, {"n": "②", "en": "happiest", "ko": "가장 행복한", "ok": false, "why": "최상급이라서 than과 쓰지 않아요."}, {"n": "③", "en": "expensive", "ko": "비싼", "ok": false, "why": "원급이라서 than과 짝이 될 수 없어요."}, {"n": "④", "en": "useless", "ko": "쓸모없는", "ok": false, "why": "원급이라서 than과 짝이 될 수 없어요."}, {"n": "⑤", "en": "more special", "ko": "더 특별한", "ok": true, "why": "비교급이라서 than과 짝이 돼요. 맞아요."}], "pencil": "than 앞에는 ___ 을 써요", "pencilKey": "비교급", "page": 190, "sec": "s1"}, {"id": "S1-13", "step": 1, "no": 13, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "popularer → more popular", "concept": ["032"], "gap": "", "words": [["album", "앨범"], ["previous", "이전의"], ["popular", "인기 있는"]], "h1": "'그의 새 앨범은 이전 것보다 더 인기 있다'는 비교하는 문장이에요. popularer가 올바른 모양인지 popular(인기 있는)의 소리마디(음절) 수를 세어 보세요.", "h2": "popular(인기 있는)는 소리마디가 3개인 긴 단어예요. 긴 단어는 -er을 붙이지 않고 앞에 어떤 말을 붙여서 비교급을 만들까요?", "why": "3음절 이상의 긴 단어는 more를 앞에 붙여요. popularer를 more popular(더 인기 있는)로 고쳐요.", "opts": [], "pencil": "긴 단어의 비교급은 앞에 ___ 를 붙여요", "pencilKey": "more", "page": 190, "sec": "s1"}, {"id": "S1-14", "step": 1, "no": 14, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "①", "concept": ["034", "032"], "gap": "", "words": [["busy", "바쁜"], ["lazy", "게으른"], ["generous", "너그러운"]], "h1": "문장마다 밑줄 친 부분의 앞에 쓴 강조하는 말(very 등)이 알맞은지 보세요. 비교급에 쓰는 강조어와 원급에 쓰는 강조어는 달라요.", "h2": "very는 원급(원래 모양)을 강조할 때 써요. 비교급(-er 모양) 앞에 쓰면 어색해요. very와 busier가 함께 쓰인 문장을 찾아보세요.", "why": "① We got very busier.에서 very는 원급을 강조하는 말인데 비교급 busier(더 바쁜) 앞에 쓰였어요. 비교급 강조는 much나 far를 써요.", "opts": [{"n": "①", "en": "We got very busier.", "ko": "우리는 매우 더 바빠졌다.(어색한 문장)", "ok": true, "why": "very는 비교급 앞에 쓸 수 없어요. much busier처럼 고쳐요."}, {"n": "②", "en": "She is lazier than before.", "ko": "그녀는 전보다 더 게으르다.", "ok": false, "why": "lazy(게으른)의 비교급 lazier + than이라서 맞아요."}, {"n": "③", "en": "He is less generous than her.", "ko": "그는 그녀보다 덜 너그럽다.", "ok": false, "why": "less + 원급 + than은 '~보다 덜 …한'이라서 맞아요."}, {"n": "④", "en": "This tool is more helpful than that one.", "ko": "이 도구는 저것보다 더 도움이 된다.", "ok": false, "why": "more + 긴 단어 + than이라서 맞아요."}, {"n": "⑤", "en": "The movie is more boring than the book.", "ko": "그 영화는 책보다 더 지루하다.", "ok": false, "why": "more boring + than이라서 맞아요."}], "pencil": "very는 ___ 앞에서 쓰는 강조어예요", "pencilKey": "원급", "page": 190, "sec": "s1"}, {"id": "S1-15", "step": 1, "no": 15, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "more", "concept": ["034", "032"], "gap": "", "words": [["creative", "창의적인"], ["book", "책"]], "h1": "두 문장 모두 than(~보다)이 뒤에 있어요. 첫 문장은 creative(창의적인) 앞, 둘째 문장은 books(책들) 앞에 같은 단어가 들어가요. 주어진 첫 글자는 m이에요.", "h2": "creative의 비교급은 앞에 말을 붙인 것이고, many(많은)의 비교급도 같은 말이에요. 책이 '더 많다'를 말할 때 쓰는 한 단어를 떠올려 보세요.", "why": "Tim is more creative than Sam.(Tim은 Sam보다 더 창의적이다.)과 I have more books than him.(나는 그보다 책이 더 많다.)이에요. 두 곳 모두 more가 들어가요.", "opts": [], "pencil": "긴 단어와 many의 비교급은 둘 다 ___ 예요", "pencilKey": "more", "page": 190, "sec": "s1"}, {"id": "S1-16", "step": 1, "no": 16, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "(1) shorter than (2) taller than", "concept": ["034", "032"], "gap": "", "words": [["short", "키가 작은"], ["tall", "키가 큰"]], "h1": "<보기>에서 Monica는 Judy보다 키가 작아요. 그림의 세 사람을 키 순서로 먼저 정리해 보세요. 가장 작은 사람이 누구인지 찾으면 쉬워요.", "h2": "키 순서는 Monica, Judy, Annie 순으로 커져요. (1) Judy와 Annie를 비교하고, (2) Annie와 Monica를 비교해요. 각각 short와 tall 중 알맞은 말의 비교급을 쓰세요.", "why": "키 순서가 Monica가 가장 작고 Annie가 가장 커요. (1) Judy is shorter than Annie.(Judy는 Annie보다 키가 작다.) (2) Annie is taller than Monica.(Annie는 Monica보다 키가 크다.)예요.", "opts": [], "pencil": "비교급 뒤에는 ___ 를 써서 비교 대상을 말해요", "pencilKey": "than", "page": 190, "sec": "s1"}, {"id": "S1-17", "step": 1, "no": 17, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "④", "concept": ["035"], "gap": "", "words": [["happy", "행복한"], ["soon", "곧, 빨리"], ["slow", "느린"]], "h1": "The ___, the better.는 이어진 두 부분이 모두 the로 시작해요. 이런 틀에서 the 바로 뒤에는 어떤 모양의 단어가 오는지 생각해 보세요.", "h2": "「the + 비교급 ~, the + 비교급 …」은 '~할수록 더 …하다'예요. 이 틀의 the 뒤에는 비교급이 와요. 보기 중 비교급이 아닌 단어를 찾으세요.", "why": "the better(더 좋은)가 비교급이므로 빈칸에도 비교급이 와야 해요. slow(느린)는 원급이라서 쓸 수 없어요.", "opts": [{"n": "①", "en": "happier", "ko": "더 행복한", "ok": false, "why": "happy(행복한)의 비교급이라서 쓸 수 있어요."}, {"n": "②", "en": "sooner", "ko": "더 빨리", "ok": false, "why": "soon(곧)의 비교급이라서 쓸 수 있어요."}, {"n": "③", "en": "more", "ko": "더 많이", "ok": false, "why": "비교급이라서 쓸 수 있어요."}, {"n": "④", "en": "slow", "ko": "느린", "ok": true, "why": "원급(원래 모양)이라서 쓸 수 없어요. slower라야 해요."}, {"n": "⑤", "en": "less", "ko": "덜", "ok": false, "why": "little(적은)의 비교급이라서 쓸 수 있어요."}], "pencil": "「the + ___ ~, the + ___ …」 (할수록 더 ~)", "pencilKey": "비교급", "page": 190, "sec": "s1"}, {"id": "S1-18", "step": 1, "no": 18, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "The [또는 the]", "concept": ["035", "034-H1"], "gap": "", "words": [["more", "더 많이"], ["want", "원하다"], ["younger", "더 어린"]], "h1": "첫 문장은 '더 많이 가질수록 더 많이 원한다'예요. 이 틀의 앞부분과 뒷부분은 같은 단어로 시작해요. 둘째 문장 He is ___ younger of the two.도 같은 단어가 들어가요.", "h2": "첫 문장은 「the + 비교급 ~, the + 비교급 …」이고, 둘째 문장은 '둘 중에서 더 ~한 쪽'을 말하는 틀이에요. 두 틀 모두 비교급 앞에 같은 짧은 단어를 붙여요.", "why": "The more you have, the more you want.(가질수록 더 원한다.)와 He is the younger of the two.(그는 둘 중에서 더 어린 쪽이다.)예요. 세 빈칸 모두 the가 들어가요.", "opts": [], "pencil": "비교급 앞에 ___ 를 붙이는 두 가지 틀이 있어요", "pencilKey": "the", "page": 191, "sec": "s1"}, {"id": "S1-19", "step": 1, "no": 19, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "③", "concept": ["034", "032"], "gap": "", "words": [["iron", "철"], ["wood", "나무"], ["hard", "단단한"]], "h1": "'철은 나무보다 더 단단하다'에서 누가 더 단단한지(주어)와, '더 단단한'과 '~보다'를 영어로 어떻게 쓰는지 보세요.", "h2": "hard(단단한)는 짧은 단어라서 비교급은 -er을 붙여요. '~보다'는 than이에요. 주어가 철(Iron)인지도 확인하세요.", "why": "hard의 비교급은 harder예요. Iron is harder than wood.(철은 나무보다 더 단단하다.)가 맞아요.", "opts": [{"n": "①", "en": "Iron is hard than wood.", "ko": "철은 나무보다 단단하다.(어색한 문장)", "ok": false, "why": "hard가 원급이라서 than과 짝이 안 돼요. harder라야 해요."}, {"n": "②", "en": "Wood is harder than iron.", "ko": "나무는 철보다 더 단단하다.", "ok": false, "why": "주어가 반대예요. 우리말은 철이 더 단단하다예요."}, {"n": "③", "en": "Iron is harder than wood.", "ko": "철은 나무보다 더 단단하다.", "ok": true, "why": "harder + than이라서 맞아요."}, {"n": "④", "en": "Iron is harder as wood.", "ko": "철은 나무만큼 더 단단하다.(어색한 문장)", "ok": false, "why": "비교급 뒤에는 as가 아니라 than을 써요."}, {"n": "⑤", "en": "Iron is more hard than wood.", "ko": "철은 나무보다 더 단단하다.(어색한 문장)", "ok": false, "why": "hard는 짧은 단어라서 more를 쓰지 않고 harder로 써요."}], "pencil": "짧은 단어의 비교급은 ___ 을 붙여요", "pencilKey": "-er", "page": 191, "sec": "s1"}, {"id": " gap": "", "words": [["careful", "조심스러운"], ["rival", "경쟁자"]], "h1": "'Samuel은 경쟁자보다 더 조심스럽다'는 뜻이에요. careful(조심스러운) 뒤에 than이 있는데 careful만 써도 되는지 생각해 보세요.", "h2": "careful은 소리마디가 2개 이상인 긴 단어예요. 이런 단어는 -er을 붙이지 않고 앞에 한 단어를 더해서 비교급을 만들어요.", "why": "than이 있어서 비교급이 필요해요. careful은 긴 단어라서 more careful(더 조심스러운)로 써야 해요.", "opts": [], "pencil": "careful처럼 긴 단어는 ___ + 원급으로 비교급을 만들어요", "pencilKey": "more", "page": 191, "sec": "s1"}, {"id": "S1-23", "step": 1, "no": 23, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "③", "concept": ["034"], "gap": "", "words": [["smart", "똑똑한"], ["sister", "여동생, 누나"]], "h1": "Ben is ___ smarter than his sister.에서 smarter는 비교급이에요. 비교급 앞에 놓아 '훨씬'이라는 뜻을 더하는 말이 아닌 것을 찾아보세요.", "h2": "비교급을 강조하는 말에는 much, far, still, a lot, even이 있어요. 원급(원래 모양)을 강조하는 말은 따로 있어요.", "why": "very(매우)는 원급을 강조하는 말이라서 비교급 smarter 앞에 쓸 수 없어요.", "opts": [{"n": "①", "en": "far", "ko": "훨씬", "ok": false, "why": "비교급 강조에 쓸 수 있어요."}, {"n": "②", "en": "much", "ko": "훨씬", "ok": false, "why": "비교급 강조에 쓸 수 있어요."}, {"n": "③", "en": "very", "ko": "매우", "ok": true, "why": "원급을 강조하는 말이라서 비교급 앞에 쓸 수 없어요."}, {"n": "④", "en": "even", "ko": "한층 더", "ok": false, "why": "비교급 강조에 쓸 수 있어요."}, {"n": "⑤", "en": "a lot", "ko": "훨씬", "ok": false, "why": "비교급 강조에 쓸 수 있어요."}], "pencil": "비교급 강조어에는 much, far, still, a lot, ___ 가 있어요", "pencilKey": "even", "page": 191, "sec": "s1"}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "bigger", "concept": ["034-H1", "032"], "gap": "", "words": [["balloon", "풍선"], ["big", "큰"]], "h1": "'풍선이 점점 더 커지고 있다'에서 '점점 더'를 만드는 틀은 같은 말을 and로 이어 쓰는 거예요. 괄호 안 big(큰)의 비교급이 필요해요.", "h2": "big(큰)은 '짧은 모음 + 자음 하나'로 끝나서 비교급을 만들 때 마지막 자음을 한 번 더 써요. 이것을 두 번 쓰고 and로 이어요.", "why": "'점점 더 ~한'은 「비교급 + and + 비교급」이에요. The balloon is getting bigger and bigger.(풍선이 점점 더 커지고 있다.)가 돼요.", "opts": [], "pencil": "'점점 더 ~한'은 비교급 ___ 비교급", "pencilKey": "and", "page": 191, "sec": "s1"}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "four times larger than", "concept": ["034-H1"], "gap": "", "words": [["earth", "지구"], ["moon", "달"], ["large", "큰"]], "h1": "'지구는 달보다 네 배 크다'에서 '네 배'를 나타내는 말(four times)이 어디에 오는지 보세요. 주어진 말은 larger, four, than, times예요.", "h2": "「배수 + 비교급 + than」 순서예요. 배수(몇 배)가 맨 앞에 오고, 그다음 비교급, 마지막에 than이 와요.", "why": "The Earth is four times larger than the moon.(지구는 달보다 네 배 더 크다.)이에요. 배수 four times가 비교급 larger 앞에 와요.", "opts": [], "pencil": "배수 + ___ + than (~보다 몇 배 더 …한)", "pencilKey": "비교급", "page": 191, "sec": "s1"}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "유형 01 원급 비교", "type": "mc", "ans": "②", "concept": ["033"], "gap": "", "words": [["same age", "같은 나이"]], "h1": "B가 '응, 그들은 같은 나이야'라고 했어요. 그러면 A가 물은 질문은 두 사람의 나이가 어떤지 묻는 말일지 생각해 보세요.", "h2": "나이가 같은지 묻는 말은 같은 정도를 나타내는 「as + 원급 + as」예요. 의문문에서는 not이 없으니 so ~ as도 쓰지 않아요.", "why": "'Ron은 Harry와 나이가 같니?'라는 질문이라서 as old as(~만큼 나이 든)가 알맞아요.", "opts": [{"n": "①", "en": "so old as", "ko": "그렇게 나이 든 ~만큼", "ok": false, "why": "so ~ as는 주로 부정문에서 써요. 긍정 질문에서는 as ~ as를 써요."}, {"n": "②", "en": "as old as", "ko": "~만큼 나이 든", "ok": true, "why": "같은 나이인지 묻는 말이라서 맞아요."}, {"n": "③", "en": "older than", "ko": "~보다 더 나이 든", "ok": false, "why": "B가 같은 나이라고 했는데 '더 나이 든지' 묻는 말이라 어울리지 않아요."}, {"n": "④", "en": "less old than", "ko": "~보다 덜 나이 든", "ok": false, "why": "더 어린지 묻는 말이라 '같은 나이'라는 대답과 맞지 않아요."}, {"n": "⑤", "en": "not as old as", "ko": "~만큼 나이 들지 않은", "ok": false, "why": "'같은 나이'라는 대답과 반대 뜻이에요."}], "pencil": "'같은 나이'를 물을 때는 ___ old as", "pencilKey": "as", "page": 192, "sec": "s2"}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "유형 01 원급 비교", "type": "mc", "ans": "④", "concept": ["033", "033-2"], "gap": "", "words": [["fast", "빠른"], ["fast", "빠르게"]], "h1": "B는 'Stephen은 Edward만큼 빠르지 않다'는 뜻으로 말해요. 밑줄 친 not as와 as 사이에 있는 말의 모양을 살펴보세요.", "h2": "「not as + 원급 + as」에서 가운데에는 원래 모양을 써요. 밑줄 친 단어 중 -er이 붙은 것이 있는지 찾아보세요.", "why": "Stephen is not as fast as Edward.(Stephen은 Edward만큼 빠르지 않다.)가 맞아요. ④ faster(더 빠른)는 as와 as 사이에 올 수 없어서 fast(빠른)로 고쳐야 해요.", "opts": [{"n": "①", "en": "faster", "ko": "더 빠른", "ok": false, "why": "Who is faster ~?는 둘 중 누가 더 빠른지 묻는 비교급 질문이라서 맞아요."}, {"n": "②", "en": "or", "ko": "또는", "ok": false, "why": "Edward or Stephen(Edward 또는 Stephen)처럼 둘 중 하나를 고르는 말이라서 맞아요."}, {"n": "③", "en": "not as", "ko": "~만큼 …하지 않은", "ok": false, "why": "not as ~ as 틀의 앞부분이라서 맞아요."}, {"n": "④", "en": "faster", "ko": "더 빠른", "ok": true, "why": "as와 as 사이에는 원급 fast(빠른)를 써야 해요. 비교급이라서 어색해요."}, {"n": "⑤", "en": "as", "ko": "~만큼", "ok": false, "why": "not as ~ as 틀의 뒷부분이라서 맞아요."}], "pencil": "not as ~ as 사이에는 ___ 을 써요", "pencilKey": "원급", "page": 192, "sec": "s2"}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "유형 01 원급 비교", "type": "mc", "ans": "⑤", "concept": ["034-H1", "033"], "gap": "", "words": [["thick", "두꺼운"], ["mine", "내 것"]], "h1": "'세 배'를 어떻게 말하는지, 그리고 '내 것'을 어떻게 말하는지 두 가지를 확인하세요. 보기마다 틀린 곳이 하나씩 있어요.", "h2": "「배수 + as + 원급 + as」 틀이에요. 세 배는 three times이고, 비교 대상이 '내 책'이라서 me가 아니라 소유를 나타내는 말이 필요해요.", "why": "Her book is three times as thick as mine.(그녀의 책은 내 것보다 세 배 더 두껍다.)이에요. three times가 앞에, as 원급(thick) as가 뒤에 오고 mine은 '내 것(내 책)'이에요.", "opts": [{"n": "①", "en": "Her book is three times as thick as me.", "ko": "그녀의 책은 나보다 세 배 두껍다.(어색한 문장)", "ok": false, "why": "책과 책을 비교해야 하는데 me(나)와 비교했어요. mine(내 것)이라야 해요."}, {"n": "②", "en": "Her book is three times as thicker as mine.", "ko": "그녀의 책은 내 것보다 세 배 더 두껍다.(어색한 문장)", "ok": false, "why": "as 사이에 비교급 thicker를 써서 틀려요. 원급 thick을 써요."}, {"n": "③", "en": "Her book is third times as thick as mine.", "ko": "그녀의 책은 내 것보다 세 번째 배 두껍다.(어색한 문장)", "ok": false, "why": "third는 '세 번째'라는 순서를 말해요. '세 배'는 three times예요."}, {"n": "④", "en": "Her book is as third times thick as mine.", "ko": "그녀의 책은 내 것만큼 세 번째 배 두껍다.(어색한 문장)", "ok": false, "why": "배수는 첫 번째 as 앞에 와야 하고 third도 틀려요."}, {"n": "⑤", "en": "Her book is three times as thick as mine.", "ko": "그녀의 책은 내 것보다 세 배 두껍다.", "ok": true, "why": "three times + as + 원급 + as + mine이라서 맞아요."}], "pencil": "배수는 ___ 번째 as 앞에 써요", "pencilKey": "첫", "page": 192, "sec": "s2"}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "유형 01 원급 비교", "type": "mc", "ans": "③", "concept": ["033"], "gap": "", "words": [["healthy", "건강한"], ["stay", "~한 상태로 있다"], ["possible", "가능한"]], "h1": "'누구나 가능한 한 ~ 건강하게 지내길 원한다'에서 빈칸 뒤에 possible(가능한)이 있어요. as ~ as possible 앞쪽 부분에 들어갈 말을 정해 보세요.", "h2": "건강한 상태로 '얼마나' 지내길 원하는지를 생각해 보세요. 시간의 길이를 나타내는 말은 many, soon, long, little, well 중 무엇일까요?", "why": "as long as possible은 '가능한 한 오래'라는 뜻이에요. '누구나 가능한 한 오래 건강하게 지내길 원한다'가 돼요.", "opts": [{"n": "①", "en": "as many as", "ko": "~만큼 많은", "ok": false, "why": "수가 많다는 뜻이에요. 건강하게 지내는 시간을 말하지 않아요."}, {"n": "②", "en": "as soon as", "ko": "~하자마자, ~만큼 빨리", "ok": false, "why": "빠르다는 뜻이라 건강을 유지하는 기간과 맞지 않아요."}, {"n": "③", "en": "as long as", "ko": "~만큼 오래", "ok": true, "why": "'가능한 한 오래'라는 뜻이라서 맞아요."}, {"n": "④", "en": "as little as", "ko": "~만큼 적은", "ok": false, "why": "적다는 뜻이라 기간을 말하는 데 어울리지 않아요."}, {"n": "⑤", "en": "as well as", "ko": "~뿐만 아니라, ~만큼 잘", "ok": false, "why": "잘 한다는 뜻이거나 ~뿐만 아니라는 뜻이라 어울리지 않아요."}], "pencil": "'가능한 한 오래'는 as ___ as possible", "pencilKey": "long", "page": 192, "sec": "s2"}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "③", "concept": ["032", "034"], "gap": "", "words": [["lovely", "사랑스러운"], ["old", "나이 든"], ["tall", "키가 큰"]], "h1": "밑줄 친 old와 tall 뒤에 모두 than(~보다)이 이어져요. than과 짝이 되는 모양으로 바꿔 보세요.", "h2": "than 앞에는 비교급을 써요. old와 tall은 짧은 단어라서 more를 붙이지 않고 끝에 무엇을 붙일까요?", "why": "'언니는 그녀보다 두 살 더 많고 Rachel보다 훨씬 더 크다'예요. old는 older, tall은 taller로 써요.", "opts": [{"n": "①", "en": "old - taller", "ko": "나이 든 - 더 키가 큰", "ok": false, "why": "old가 원급이라서 틀려요. 뒤에 than이 있으니 older라야 해요."}, {"n": "②", "en": "old - tall", "ko": "나이 든 - 키가 큰", "ok": false, "why": "둘 다 원급이라서 틀려요."}, {"n": "③", "en": "older - taller", "ko": "더 나이 든 - 더 키가 큰", "ok": true, "why": "둘 다 than과 짝이 되는 비교급이라서 맞아요."}, {"n": "④", "en": "older - more tall", "ko": "더 나이 든 - 더 키가 큰", "ok": false, "why": "tall은 짧은 단어라서 more tall이라고 쓰지 않아요. taller라야 해요."}, {"n": "⑤", "en": "more old - taller", "ko": "더 나이 든 - 더 키가 큰", "ok": false, "why": "old는 짧은 단어라서 more old가 아니라 older라야 해요."}], "pencil": "than 앞에는 짧은 단어에 ___ 를 붙여요", "pencilKey": "-er", "page": 192, "sec": "s2"}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "통합형", "type": "mc", "ans": "②", "concept": ["033-2", "034"], "gap": "", "words": [["diligent", "부지런한"]], "h1": "<보기>는 Bob이 Teddy보다 더 부지런하다는 뜻이에요. 보기마다 누가 더 부지런한지, 같은지를 먼저 정리해 보세요.", "h2": "A가 B보다 더 ~하다는 말은 B가 A만큼 ~하지 않다는 말과 같아요. 두 사람의 자리를 바꾸고 not as ~ as 틀을 써서 보기를 살펴보세요.", "why": "Bob is more diligent than Teddy.(Bob이 Teddy보다 더 부지런하다.)는 Teddy is not as diligent as Bob.(Teddy는 Bob만큼 부지런하지 않다.)과 뜻이 같아요.", "opts": [{"n": "①", "en": "Teddy is as diligent as Bob.", "ko": "Teddy는 Bob만큼 부지런하다.", "ok": false, "why": "둘이 같다는 뜻이라서 틀려요."}, {"n": "②", "en": "Teddy is not as diligent as Bob.", "ko": "Teddy는 Bob만큼 부지런하지 않다.", "ok": true, "why": "Bob이 더 부지런하다는 뜻이라서 맞아요."}, {"n": "③", "en": "Bob is not as diligent as Teddy.", "ko": "Bob은 Teddy만큼 부지런하지 않다.", "ok": false, "why": "Teddy가 더 부지런하다는 뜻이라 반대예요."}, {"n": "④", "en": "Bob is less diligent than Teddy.", "ko": "Bob은 Teddy보다 덜 부지런하다.", "ok": false, "why": "Teddy가 더 부지런하다는 뜻이라 반대예요."}, {"n": "⑤", "en": "Teddy is twice as diligent as Bob.", "ko": "Teddy는 Bob보다 두 배 부지런하다.", "ok": false, "why": "Teddy가 두 배 더 부지런하다는 뜻이라 틀려요."}], "pencil": "A가 B보다 더 ~ 이면 B는 A만큼 ~하지 ___", "pencilKey": "않다", "page": 192, "sec": "s2"}, {"id": "S2-07", "step": 2, "no": 7, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "⑤", "concept": ["035"], "gap": "", "words": [["work hard", "열심히 일하다"], ["get", "얻다"]], "h1": "'열심히 일할수록, 너는 더 많이 얻을 수 있다'는 한쪽이 변하면 다른 쪽도 함께 변하는 뜻이에요. 보기마다 the가 몇 번 있고 어디에 있는지 보세요.", "h2": "「The + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사」 틀이에요. 두 부분 모두 the로 시작하고 바로 뒤에 비교급이 와요. harder는 hard(열심히)의 비교급이에요.", "why": "The harder you work, the more you can get.(열심히 일할수록 더 많이 얻을 수 있다.)이에요. 두 부분이 모두 the + 비교급으로 시작해요.", "opts": [{"n": "①", "en": "You work harder, the more you can get.", "ko": "너는 더 열심히 일한다, 더 많이 얻을 수 있다.(어색한 문장)", "ok": false, "why": "앞부분에 the가 없어서 틀려요."}, {"n": "②", "en": "The hard you work, the more you can get.", "ko": "열심히 일할수록 더 많이 얻을 수 있다.(어색한 문장)", "ok": false, "why": "hard가 원급이라서 틀려요. harder라야 해요."}, {"n": "③", "en": "The harder you work, you can get more.", "ko": "열심히 일할수록 더 많이 얻을 수 있다.(어색한 문장)", "ok": false, "why": "뒷부분이 the more로 시작하지 않아서 틀려요."}, {"n": "④", "en": "The harder you work, more you can get.", "ko": "열심히 일할수록 더 많이 얻을 수 있다.(어색한 문장)", "ok": false, "why": "뒷부분의 more 앞에 the가 없어서 틀려요."}, {"n": "⑤", "en": "The harder you work, the more you can get.", "ko": "열심히 일할수록 더 많이 얻을 수 있다.", "ok": true, "why": "두 부분 모두 the + 비교급으로 시작해서 맞아요."}], "pencil": "~할수록 더 …하다는 ___ + 비교급 ~, the + 비교급 …", "pencilKey": "the", "page": 192, "sec": "s2"}, {"id": "S2-08", "step": 2, "no": 8, "qtype": "유형 01 원급 비교", "type": "write", "ans": "she could", "concept": ["033"], "gap": "", "words": [["cry out", "소리치다"], ["loudly", "큰 소리로"], ["as loudly as possible", "가능한 한 큰 소리로"]], "h1": "as loudly as possible를 as ~ as 뒤에 '주어 + can'이 오는 모양으로 바꾸는 문제예요. 빈칸 두 칸은 주어와 동사예요.", "h2": "주어는 Anne을 대신하는 말이에요. can은 문장 전체의 시제에 맞춰야 하는데, 앞 문장의 cried(원형 cry 울다, 소리치다)는 과거예요.", "why": "Anne cried out to me as loudly as she could.(Anne은 가능한 한 큰 소리로 나에게 소리쳤다.)예요. 앞 문장이 과거라서 can도 과거 could로 써요.", "opts": [], "pencil": "as ~ as possible는 as ~ as + 주어 + can[___ ]", "pencilKey": "could", "page": 193, "sec": "s2"}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "통합형", "type": "write", "ans": "smaller than", "concept": ["033-2", "034"], "gap": "", "words": [["small", "작은"], ["room", "방"]], "h1": "'내 남동생의 방은 내 방만큼 작지 않다'는 내 방이 더 작다는 뜻이에요. 두 방의 자리를 바꿔서 말해 보세요.", "h2": "자리를 바꾸면 not as ~ as가 '더 ~한 쪽'을 말하는 비교급 문장이 돼요. 빈칸은 비교급과 than이에요.", "why": "My room is smaller than my brother's room.(내 방이 내 남동생의 방보다 더 작다.)예요. 두 대상의 자리를 바꾸고 비교급 smaller + than을 써요.", "opts": [], "pencil": "not as ~ as는 자리를 바꾸면 ___ + than 문장이 돼요", "pencilKey": "비교급", "page": 193, "sec": "s2"}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "more carefully than me [또는 more carefully than I]", "concept": ["032", "034"], "gap": "", "words": [["drive", "운전하다"], ["carefully", "조심스럽게"]], "h1": "'그는 나보다 더 조심스럽게 운전했다'에서 carefully(조심스럽게)를 더 ~하게로 바꾸고, '나보다'를 이어 보세요. 빈칸은 네 칸이에요.", "h2": "carefully는 긴 단어라서 앞에 more를 붙여요. than 뒤의 '나'는 me 또는 I 모두 가능해요.", "why": "He drove more carefully than me[I].(그는 나보다 더 조심스럽게 운전했다.)예요. carefully의 비교급은 more carefully예요.", "opts": [], "pencil": "긴 부사의 비교급은 ___ + 원급이에요", "pencilKey": "more", "page": 193, "sec": "s2"}, {"id": "S2-11", "step": 2, "no": 11, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "more", "concept": ["034-H1"], "gap": "", "words": [["tourist", "관광객"], ["visit", "방문하다"], ["many", "많은"]], "h1": "'한국을 방문하는 관광객이 점점 더 많아지고 있다'는 같은 말을 and로 이어 쓰는 틀이에요. 괄호 안 many(많은)를 바꿔서 두 칸에 같은 말을 쓰세요.", "h2": "many(많은)의 비교급은 모양이 완전히 바뀌는 불규칙이에요. 이것을 and 앞뒤에 하나씩 써요.", "why": "There are more and more tourists visiting Korea every year.(해마다 한국을 방문하는 관광객이 점점 더 많아지고 있다.)예요. many의 비교급은 more이에요.", "opts": [], "pencil": "many의 비교급은 ___ 예요", "pencilKey": "more", "page": 193, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "less crowded than", "concept": ["034"], "gap": "", "words": [["crowded", "붐비는"], ["theater", "극장"]], "h1": "그림은 영화관이 생각보다 한산한 모습이에요. 'No, it was ___ 빈칸 세 칸 ___ I had thought'는 '생각했던 것보다 덜 붐볐다'는 뜻이에요.", "h2": "'~보다 덜 …한'을 말하는 틀은 「less + 원급 + than」이에요. 빈칸 세 칸을 less, crowded(붐비는), 그리고 비교하는 말로 채워 보세요.", "why": "No, it was less crowded than I had thought.(아니, 내가 생각했던 것보다 덜 붐볐어.)예요. '덜 ~한'은 less + 원급 + than이에요.", "opts": [], "pencil": "'~보다 덜 …한'은 less + 원급 + ___", "pencilKey": "than", "page": 193, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "통합형", "type": "write", "ans": "The more I earn, the more I spend.", "concept": ["035"], "gap": "", "words": [["earn", "벌다"], ["spend", "쓰다"]], "h1": "As I earn more, I spend more.는 '더 많이 벌수록 더 많이 쓴다'예요. 이 문장을 두 부분이 모두 the로 시작하는 틀로 바꿔 보세요. 빈칸은 여섯 칸이에요.", "h2": "「The + 비교급 + 주어 + 동사, the + 비교급 + 주어 + 동사」 순서예요. 원래 문장의 earn(벌다), spend(쓰다)와 more를 the 바로 뒤에 옮겨 오세요.", "why": "The more I earn, the more I spend.(더 많이 벌수록 더 많이 쓴다.)예요. 두 부분이 모두 the + more로 시작하고, 뒤에 주어와 동사가 와요.", "opts": [], "pencil": "'~할수록 더 …하다'는 the + 비교급 + 주어 + ___", "pencilKey": "동사", "page": 193, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "The weather is much warmer than last spring.", "concept": ["034"], "gap": "", "words": [["weather", "날씨"], ["warm", "따뜻한"], ["last spring", "작년 봄"]], "h1": "'날씨가 작년 봄보다 훨씬 더 따뜻하다'에서 주어와 동사를 먼저 놓고, '훨씬'을 나타내는 much의 자리를 찾아보세요.", "h2": "much는 비교급 warmer 바로 앞에 와요. 그 뒤에 than과 비교 대상(last spring)이 이어져요.", "why": "The weather is much warmer than last spring.이에요. much(훨씬)는 비교급 warmer(더 따뜻한) 바로 앞에 놓고, than 뒤에 비교 대상이 와요.", "opts": [], "pencil": "much는 비교급 ___ 에 써서 '훨씬'을 나타내요", "pencilKey": "앞", "page": 193, "sec": "s2"}, {"id": "S2-15", "step": 2, "no": 15, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "ⓐ more expensive ⓑ cheaper", "concept": ["032", "034"], "gap": "", "words": [["expensive", "비싼"], ["cheap", "싼"], ["won", "원(돈)"]], "h1": "ⓐ와 ⓑ 뒤에 모두 than(~보다)이 있어요. 두 곳 다 비교급이 와야 해요. expensive(비싼)와 cheap(싼) 중 어느 것이 긴 단어인지 따져 보세요.", "h2": "expensive는 긴 단어라서 more를 붙이고, cheap은 짧은 단어라서 -er을 붙여요. 대화에서 이 책은 20,000원이고 저 책은 3,000원이에요.", "why": "ⓐ more expensive(더 비싼), ⓑ cheaper(더 싼)예요. than이 있어서 모두 비교급으로 고쳐요.", "opts": [], "pencil": "than 앞에는 짧은 단어는 -er, 긴 단어는 ___ 를 붙여요", "pencilKey": "more", "page": 193, "sec": "s2"}, {"id": "S3-01", "step": 3, "no": 1, "qtype": "유형 01 원급 비교", "type": "mc", "ans": "③", "concept": ["033"], "gap": "", "words": [["honest", "정직한"], ["sister", "여동생, 언니"]], "h1": "A는 Ashley가 정직하다고 했고, 동생(언니)도 정직한지 물었어요. B가 '응'이라고 했으니 두 사람의 정도가 같다는 뜻이에요.", "h2": "같은 정도는 「as + 원급 + as」예요. 보기에서 as가 두 번 쓰이고 가운데에 원급(honest)이 온 문장을 찾아보세요. 부정(not)이 없는지도 보세요.", "why": "'응, 그녀의 여동생도 Ashley만큼 정직해'라는 뜻이에요. her sister is as 미래의 목표를 설정해라.", "ok": true, "why": "as early as can에는 주어가 빠졌어요. as early as you can이나 as early as possible로 써야 해요."}], "pencil": "as ~ as 뒤에 can을 쓰면 can 앞에 ___ 가 있어야 해요", "pencilKey": "주어", "page": 194, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "②", "concept": ["032", "034"], "gap": "", "words": [["true friend", "진정한 친구"], ["help", "돕다"], ["fast", "빨리"]], "h1": "빈칸 뒤에 모두 than(~보다)이 있어요. than이 있는 빈칸에는 비교급이 와야 해요. much와 fast는 비교급이 어떻게 변하는지 떠올려 보세요.", "h2": "much(많이)의 비교급은 모양이 아예 바뀌는 불규칙이에요. fast(빨리)는 -er을 붙여요. 비교급 앞에 the는 붙이지 않아요.", "why": "He helped me more than anybody did.(그는 누구보다 나를 더 많이 도왔다.), he always came to me faster than anyone else.(그는 늘 누구보다 더 빨리 나에게 왔다.)예요. much의 비교급은 more, fast의 비교급은 faster예요.", "opts": [{"n": "①", "en": "much – fast", "ko": "많이 - 빨리", "ok": false, "why": "둘 다 원급이라서 than과 짝이 안 돼요."}, {"n": "②", "en": "more – faster", "ko": "더 많이 - 더 빨리", "ok": true, "why": "둘 다 비교급이라서 맞아요."}, {"n": "③", "en": "much – faster", "ko": "많이 - 더 빨리", "ok": false, "why": "첫 번째가 원급이라서 틀려요. more라야 해요."}, {"n": "④", "en": "the more – faster", "ko": "더 많이 - 더 빨리", "ok": false, "why": "첫 번째 칸에 the가 붙어 틀려요. 이 문장은 the + 비교급 틀이 아니에요."}, {"n": "⑤", "en": "the more – the faster", "ko": "더 많이 - 더 빨리", "ok": false, "why": "둘 다 the가 붙어 틀려요. than과 함께 쓰는 비교급 앞에는 the를 쓰지 않아요."}], "pencil": "much의 비교급은 ___, fast의 비교급은 faster", "pencilKey": "more", "page": 194, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "④", "concept": ["034"], "gap": "", "words": [["genius", "천재"], ["consider", "여기다"], ["station", "역"]], "h1": "다섯 문장의 빈칸 중 네 개는 같은 종류의 말이에요. ④만 다르다고 해요. 각 문장에서 빈칸 바로 뒤의 단어가 비교급인지 원급인지 확인하세요.", "h2": "①, ②, ③, ⑤는 빈칸 뒤에 better, taller, weaker, nearer처럼 -er 비교급이 와요. ④는 smart(똑똑한)가 원급이에요. 원급을 강조하는 말은 따로 있어요.", "why": "①, ②, ③, ⑤는 비교급 앞에 와서 '훨씬'을 뜻하는 much 같은 말이 들어가요. ④는 원급 smart를 강조하니까 so(매우)가 들어가요.", "opts": [{"n": "①", "en": "He got ___ better than before.", "ko": "그는 전보다 ___ 나아졌다.(빈칸에는 비교급 강조어가 들어가요)", "ok": false, "why": "비교급 better 앞이라서 much, far, even, still, a lot 중 하나가 들어가요."}, {"n": "②", "en": "I was ___ taller than my sister.", "ko": "나는 내 여동생보다 ___ 키가 컸다.(빈칸에는 비교급 강조어가 들어가요)", "ok": false, "why": "비교급 taller 앞이라서 much, far, even, still, a lot 중 하나가 들어가요."}, {"n": "③", "en": "Jacob is ___ weaker than his brother.", "ko": "Jacob은 그의 형보다 ___ 약하다.(빈칸에는 비교급 강조어가 들어가요)", "ok": false, "why": "비교급 weaker 앞이라서 much, far, even, still, a lot 중 하나가 들어가요."}, {"n": "④", "en": "Her daughter is ___ smart that people consider her a genius.", "ko": "그녀의 딸은 사람들이 천재라고 여길 만큼 ___ 똑똑하다.", "ok": true, "why": "원급 smart를 강조하는 so가 들어가서 나머지와 달라요."}, {"n": "⑤", "en": "The station was ___ nearer than I had thought.", "ko": "그 역은 내가 생각한 것보다 ___ 가까웠다.(빈칸에는 비교급 강조어가 들어가요)", "ok": false, "why": "비교급 nearer 앞이라서 much, far, even, still, a lot 중 하나가 들어가요."}], "pencil": "원급 강조는 so·very, 비교급 강조는 much·___ 등", "pencilKey": "far", "page": 194, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "통합형", "type": "mc", "ans": "①", "concept": ["035", "034"], "gap": "", "words": [["nervous", "긴장한"], ["mistake", "실수"], ["fluently", "유창하게"]], "h1": "ⓐ부터 ⓓ까지 문장을 하나씩 읽으면서 어색한 곳이 있는지 찾아서 개수를 세어 보세요. the more ~, the more ~ 틀과 not so ~ as 틀이 나와요.", "h2": "ⓑ에서 '더 긴장할수록 더 많은 실수를 한다'를 the + 비교급 틀로 쓸 때, the 뒤에 어떤 말이 오는지 보세요. many(많은)의 비교급은 무엇일까요?", "why": "ⓑ만 틀려요. The more nervous you get, the more mistakes you make.(더 긴장할수록 더 많은 실수를 한다.)가 되도록 the many를 the more로 고쳐야 해요.", "opts": [{"n": "①", "en": "1개", "ko": "한 개", "ok": true, "why": "ⓑ 하나만 어색해서 맞아요. ⓐ는 the better of the two, ⓒ는 not so fluently as, ⓓ는 two times slower than으로 모두 쓸 수 있어요."}, {"n": "②", "en": "2개", "ko": "두 개", "ok": false, "why": "어색한 것은 ⓑ 하나뿐이라서 틀려요."}, {"n": "③", "en": "3개", "ko": "세 개", "ok": false, "why": "어색한 것은 ⓑ 하나뿐이라서 틀려요."}, {"n": "④", "en": "4개", "ko": "네 개", "ok": false, "why": "어색한 것은 ⓑ 하나뿐이라서 틀려요."}, {"n": "⑤", "en": "없음", "ko": "없음", "ok": false, "why": "ⓑ the many mistakes가 틀렸으니 없는 것이 아니에요."}], "pencil": "'더 많은'의 비교급은 many의 비교급 ___ 예요", "pencilKey": "more", "page": 194, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "③", "concept": ["034-H1"], "gap": "", "words": [["grade", "성적"], ["worse", "더 나쁜"]], "h1": "뒤에 '그의 성적은 점점 더 나빠졌다'가 이어져요. 성적이 나빠진 이유가 되려면 Chris가 공부를 어떻게 했다는 말이 어울릴까요?", "h2": "「비교급 and 비교급」은 '점점 더 ~한'이에요. 성적이 나빠졌으니 공부를 점점 많이 한 건지, 점점 적게 한 건지 생각해 보세요.", "why": "성적이 점점 나빠졌으니 공부를 점점 덜 했다는 흐름이 자연스러워요. Chris studied less and less(Chris는 점점 덜 공부했다)가 맞아요.", "opts": [{"n": "①", "en": "more and more", "ko": "점점 더 많이", "ok": false, "why": "공부를 점점 많이 했다는 뜻이라 성적이 나빠진 것과 어울리지 않아요."}, {"n": "②", "en": "harder and harder", "ko": "점점 더 열심히", "ok": false, "why": "열심히 했다는 뜻이라 성적이 나빠진 것과 어울리지 않아요."}, {"n": "③", "en": "less and less", "ko": "점점 덜", "ok": true, "why": "점점 덜 공부해서 성적이 나빠진 흐름과 맞아요."}, {"n": "④", "en": "less hard and hard", "ko": "덜 열심히 그리고 열심히(어색한 형태)", "ok": false, "why": "and 앞뒤 모양이 맞지 않아요. 같은 비교급을 반복해야 해요."}, {"n": "⑤", "en": "more and more hard", "ko": "점점 더 많이 열심히(어색한 형태)", "ok": false, "why": "more and more 뒤에 hard를 붙이는 모양이 아니라서 틀려요."}], "pencil": "'점점 덜'은 less ___ less", "pencilKey": "and", "page": 194, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "①", "concept": ["034", "050"], "gap": "", "words": [["difference", "차이"], ["attention", "주의, 관심"], ["pay attention to", "~에 주의를 기울이다"]], "h1": "다섯 문장의 much를 하나씩 해석해 보세요. 한 문장만 much 바로 뒤에 more(더 많은)가 와서 쓰임이 달라요.", "h2": "much가 비교급 앞에서 '훨씬'이라는 뜻이면 비교급 강조예요. 나머지는 much 뒤에 셀 수 없는 명사가 와서 '많은'이라는 뜻이에요.", "why": "① He needs much more help.는 much가 비교급 more를 강조하는 '훨씬'이에요. 나머지는 fun(재미), difference(차이), money(돈), attention(주의)이라는 셀 수 없는 명사를 꾸미는 '많은'이에요.", "opts": [{"n": "①", "en": "He needs much more help.", "ko": "그는 훨씬 더 많은 도움이 필요하다.", "ok": true, "why": "much가 비교급 more를 강조하는 '훨씬'이라서 나머지와 달라요."}, {"n": "②", "en": "Adam had much fun with his friends.", "ko": "Adam은 친구들과 아주 재미있게 놀았다.", "ok": false, "why": "much가 셀 수 없는 명사 fun을 꾸미는 '많은'이에요."}, {"n": "③", "en": "There is much difference between them.", "ko": "그들 사이에는 큰 차이가 있다.", "ok": false, "why": "much가 셀 수 없는 명사 difference를 꾸미는 '많은'이에요."}, {"n": "④", "en": "You can make much money if you work hard.", "ko": "열심히 일하면 많은 돈을 벌 수 있다.", "ok": false, "why": "much가 셀 수 없는 명사 money를 꾸미는 '많은'이에요."}, {"n": "⑤", "en": "Parents have to pay much attention to their children.", "ko": "부모는 자녀에게 많은 관심을 기울여야 한다.", "ok": false, "why": "much가 셀 수 없는 명사 attention을 꾸미는 '많은'이에요."}], "pencil": "비교급 앞의 much는 '___ ', 명사 앞의 much는 '많은'", "pencilKey": "훨씬", "page": 194, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "유형 01 원급 비교", "type": "write", "ans": "My bag is not as heavy as yours. [또는 My bag is not so heavy as your bag.]", "concept": ["033"], "gap": "", "words": [["heavy", "무거운"], ["bag", "가방"], ["yours", "너의 것"]], "h1": "'내 가방은 네 것만큼 무겁지 않다'는 부정 원급 비교예요. 주어진 말 my bag, as, heavy로 틀을 만들어 보세요. 부정이니 not이 필요해요.", "h2": "「not as[so] + 원급 + as」 틀에 맞추어 보세요. 마지막에 오는 '네 것'은 your bag처럼 쓰거나 한 단어로 줄여 쓸 수 있어요.", "why": "My bag is not as heavy as yours.(내 가방은 네 것만큼 무겁지 않다.)예요. 첫 번째 as 대신 so도 쓸 수 있고, 마지막은 yours 또는 your bag이에요.", "opts": [], "pencil": "'~만큼 …하지 않다'는 not as[so] + ___ + as", "pencilKey": "원급", "page": 195, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "유형 01 원급 비교", "type": "write", "ans": "Time is as precious as gold.", "concept": ["033"], "gap": "", "words": [["time", "시간"], ["precious", "소중한"], ["gold", "금"]], "h1": "'시간은 금만큼 소중하다'는 같은 정도를 말하는 문장이에요. 주어진 말 중에서 쓰지 않아도 되는 단어가 둘 있어요.", "h2": "같은 정도는 「as + 원급 + as」예요. more와 the는 이 틀에 필요가 없는 말이에요. 나머지로 순서를 맞춰 보세요.", "why": "Time is as precious as gold.(시간은 금만큼 소중하다.)예요. 같은 정도를 말하므로 as + 원급(precious) + as를 쓰고 more와 the는 쓰지 않아요.", "opts": [], "pencil": "같은 정도 비교에는 more와 ___ 를 쓰지 않아요", "pencilKey": "비교급", "page": 195, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "유형 01 원급 비교", "type": "write", "ans": "three times longer than", "concept": ["034-H1"], "gap": "", "words": [["art class", "미술 수업"], ["long", "긴"], ["times", "~배"]], "h1": "Art class is three times as long as music class.를 '배수 + 비교급 + than' 틀로 바꾸는 문제예요. 빈칸 네 칸을 채워 보세요.", "h2": "「배수 + as + 원급 + as」는 「배수 + 비교급 + than」으로 바꿔 쓸 수 있어요. long(긴)의 비교급은 -er을 붙여요.", "why": "Art class is three times longer than music class.(미술 수업은 음악 수업보다 세 배 더 길다.)예요. three times as long as를 three times longer than으로 바꿔요.", "opts": [], "pencil": "배수 + as + 원급 + as는 배수 + ___ + than으로 바꿔요", "pencilKey": "비교급", "page": 195, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "유형 01 원급 비교", "type": "write", "ans": "as soon as I can", "concept": ["033"], "gap": "", "words": [["call", "전화하다"], ["soon", "곧, 빨리"]], "h1": "I will call you as soon as possible.에서 possible(가능한)을 '주어 + can'으로 바꾸는 문제예요. 주어를 정해 보세요.", "h2": "문장의 주어가 I(나)예요. will(~할 것이다)은 미래라서 can은 현재 모양 그대로 쓰면 돼요.", "why": "I will call you as soon as I can.(나는 가능한 한 빨리 너에게 전화할게.)예요. as soon as possible은 as soon as + 주어 + can으로 바꿔 써요.", "opts": [], "pencil": "as ~ as possible는 as ~ as + ___ + can", "pencilKey": "주어", "page": 195, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "Peter is much more intelligent than Matt.", "concept": ["034"], "gap": "", "words": [["intelligent", "총명한"], ["much", "훨씬"]], "h1": "'Peter가 Matt보다 훨씬 더 총명해'를 영어로 쓰는 문제예요. 주어, 동사, '더 총명한', '~보다'를 순서대로 놓아 보세요.", "h2": "intelligent(총명한)는 긴 단어라서 more를 붙여요. '훨씬'을 뜻하는 much는 비교급 바로 앞에 와요.", "why": "Peter is much more intelligent than Matt.(Peter는 Matt보다 훨씬 더 총명하다.)예요. much는 비교급 more intelligent 앞에 써요.", "opts": [], "pencil": "비교급을 강조하는 much는 비교급 ___ 에 써요", "pencilKey": "앞", "page": 195, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "유형 01 원급 비교", "type": "write", "ans": "three years older than", "concept": ["034"], "gap": "", "words": [["young", "어린"], ["old", "나이 든"], ["year", "해, 살"]], "h1": "'그는 나보다 세 살 어리다'를 '나는 그보다 세 살 ~하다'로 바꾸는 문제예요. 주어가 I로 바뀌면 young(어린)의 반대말이 필요해요.", "h2": "주어가 I로 바뀌었으니 '나이가 더 많다'가 되어야 해요. 몇 살 차이인지 말하는 three years를 비교급 앞에 놓아요.", "why": "I am three years older than him.(나는 그보다 세 살 더 많다.)이에요. young의 반대말 old(나이 든)의 비교급 older를 써요.", "opts": [], "pencil": "차이는 비교급 ___ 에 써요(three years older)", "pencilKey": "앞", "page": 195, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "Is she more cheerful than her brother?", "concept": ["034", "006"], "gap": "", "words": [["cheerful", "쾌활한"], ["brother", "남동생, 형"]], "h1": "<보기>처럼 주어진 대답에 알맞은 질문을 쓰는 문제예요. 대답이 She is not more cheerful than her brother.이니 be동사 의문문이에요.", "h2": "be동사 의문문은 be동사를 주어 앞으로 보내요. 질문에는 대답에 있는 more cheerful(더 쾌활한)을 그대로 써요.", "why": "Is she more cheerful than her brother?(그녀는 그녀의 남동생보다 더 쾌활하니?)예요. be동사 is를 주어 she 앞에 놓고 more cheerful than을 이어요.", "opts": [], "pencil": "be동사 의문문은 be동사를 ___ 앞에 써요", "pencilKey": "주어", "page": 195, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "유형 02 비교급 비교", "type": "write", "ans": "Does he cook better than his wife?", "concept": ["034", "010"], "gap": "", "words": [["cook", "요리하다"], ["wife", "아내"]], "h1": "<보기>처럼 대답에 알맞은 질문을 쓰는 문제예요. 대답이 Yes, he cooks better than his wife.이니 일반동사 의문문이에요.", "h2": "일반동사 문장은 Do나 Does를 앞에 써요. 주어가 he(3인칭 단수)라서 Do가 아니라 Does를 써요. 이때 cooks의 -s는 없어져요.", "why": "Does he cook better than his wife?(그는 아내보다 요리를 더 잘하니?)예요. better는 well(잘)의 비교급이에요.", "opts": [], "pencil": "he 주어 일반동사 의문문은 ___ + 주어 + 동사원형", "pencilKey": "Does", "page": 195, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "유형 02 비교급 비교", "type": "mc", "ans": "②", "concept": ["034", "050"], "gap": "", "words": [["experience", "경험"], ["enough", "충분한 것"], ["bread", "빵"]], "h1": "다섯 문장에서 밑줄 친 more가 바로 뒤에 어떤 단어를 꾸미는지 하나씩 보세요. 한 문장만 more 뒤에 꾸밀 명사가 없어요.", "h2": "①, ③, ④, ⑤의 more는 water, experience, time, bread 같은 명사 앞에서 '더 많은'이라는 뜻이에요. more가 명사 없이 혼자 쓰인 문장을 찾아보세요.", "why": "② Ellie has more than enough.(Ellie는 충분한 것보다 더 많이 갖고 있다.)에서 more는 '더 많은 것'이라는 뜻의 대명사예요. 나머지는 much의 비교급으로 명사를 꾸며요.", "opts": [{"n": "①", "  }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
