<style>
/* Layout: one passage at a time, a numbered column of marking instructions; the book itself holds the result */
:root{
  --bg:#f4f5f8; --surface:#ffffff; --ink:#1b2130; --muted:#5a6376; --line:#dadfe8;
  --accent:#2c4a9a; --accent-soft:#e6ebf8; --ok:#2f7d57;
  --hl:#f6df5c; --ul:#3b6fd4; --ci:#d6443c; --sl:#1b2130; --ar:#2f8a5b; --me:#7a8296; --an:#8a4fc4;
  --font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151d; --surface:#1a202b; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2b3344;
    --accent:#93acff; --accent-soft:#232c44; --ok:#6fcf9f;
    --hl:#d9c437; --ul:#6d97f0; --ci:#f0766e; --sl:#e8ebf2; --ar:#59c18b; --me:#9aa3b5; --an:#b98cf0;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11151d; --surface:#1a202b; --ink:#e8ebf2; --muted:#9aa3b5; --line:#2b3344;
  --accent:#93acff; --accent-soft:#232c44; --ok:#6fcf9f;
  --hl:#d9c437; --ul:#6d97f0; --ci:#f0766e; --sl:#e8ebf2; --ar:#59c18b; --me:#9aa3b5; --an:#b98cf0;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:15px;line-height:1.6;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:720px;margin:0 auto}
header h1{font-size:20px;line-height:1.3;margin:0 0 2px;font-weight:700;text-wrap:balance}
header p{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 0}
.ub{font:inherit;font-size:13px;padding:5px 10px;border:1px solid var(--line);border-radius:999px;background:var(--surface);color:var(--ink);cursor:pointer}
.ub[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:#fff}
.tabs{display:flex;gap:8px;margin:18px 0 14px;flex-wrap:wrap}
.tab{flex:1 1 150px;min-width:0;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);
  border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:14px}
.tab span{display:block;font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
.tab:focus-visible,.btn:focus-visible,.chk:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.meta{display:flex;justify-content:space-between;gap:12px;align-items:baseline;margin:6px 2px 12px;color:var(--muted);font-size:13px;flex-wrap:wrap}
.meta strong{color:var(--ink);font-size:16px}
.bar{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin:0 2px 16px}
.bar i{display:block;height:100%;width:0;background:var(--ok);transition:width .2s}
.sec{margin:22px 2px 8px;font-size:12px;letter-spacing:.06em;color:var(--muted);font-weight:700}
.step{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.step.done{opacity:.72}
.top{display:flex;gap:10px;align-items:flex-start}
.chk{appearance:none;-webkit-appearance:none;flex:none;width:24px;height:24px;border:2px solid var(--line);border-radius:6px;margin:1px 0 0;background:var(--bg);cursor:pointer;display:grid;place-content:center}
.chk:checked{background:var(--ok);border-color:var(--ok)}
.chk:checked::after{content:"";width:6px;height:11px;border:solid #fff;border-width:0 2.5px 2.5px 0;transform:rotate(45deg) translate(-1px,-1px)}
.body{min-width:0;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:6px}
.tag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:2px 8px 2px 6px;border:1px solid var(--line);border-radius:999px;background:var(--bg)}
.sw{display:inline-block;flex:none}
.sw.hl{width:16px;height:8px;background:var(--hl);border-radius:2px}
.sw.ul{width:16px;height:0;border-bottom:2.5px solid var(--ul)}
.sw.ci{width:12px;height:12px;border:2px solid var(--ci);border-radius:50%}
.sw.sl{width:2px;height:13px;background:var(--sl);transform:rotate(18deg)}
.sw.ar{width:14px;height:0;border-bottom:2px solid var(--ar);position:relative}
.sw.ar::after{content:"";position:absolute;right:-1px;top:-4px;border:solid var(--ar);border-width:0 2px 2px 0;width:6px;height:6px;transform:rotate(-45deg)}
.sw.me{width:13px;height:11px;border:1.5px dashed var(--me);border-radius:2px}
.sw.an{width:auto;height:auto;color:var(--an);font-weight:700;line-height:1}
.at{font-size:12.5px;color:var(--muted);margin-bottom:4px;overflow-wrap:anywhere}
.at em{font-style:normal;font-weight:700;color:var(--ink)}
.q{margin:0;font-size:15px;overflow-wrap:anywhere}
.acts{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.btn{font:inherit;font-size:13px;padding:5px 12px;border-radius:7px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.btn[aria-expanded="true"]{background:var(--accent-soft);border-color:var(--accent)}
.panel{margin-top:10px;padding:10px 12px;border-radius:8px;font-size:14px}
.panel.help{background:var(--accent-soft)}
.panel.ans{border:1px solid var(--ok)}
.panel ul{margin:0;padding:0;list-style:none;display:grid;gap:4px}
.panel li{overflow-wrap:anywhere}
.panel .w{font-weight:700}
.opt{padding:7px 0;border-top:1px solid var(--line)}
.opt:first-child{border-top:0;padding-top:0}
.opt .en{font-weight:700;overflow-wrap:anywhere}
.opt .ko{margin-top:1px}
.opt .nt{color:var(--muted);font-size:13px}
.rq{font-size:11px;font-weight:700;color:#fff;background:var(--ci);border-radius:999px;padding:2px 8px}
.tst{margin-top:26px;border:2px solid var(--accent);border-radius:10px;padding:14px;background:var(--surface)}
.tst h2{font-size:15px;margin:0 0 4px}
.tst .sub{color:var(--muted);font-size:13px;margin:0 0 12px}
.tq{margin:0 0 14px}.tq p{margin:0 0 6px;font-weight:500;overflow-wrap:anywhere}
.ch{display:flex;flex-direction:column;gap:6px}
.ch button{font:inherit;text-align:left;padding:9px 12px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--ink);cursor:pointer;overflow-wrap:anywhere}
.ch button.sel{border-color:var(--accent);background:var(--accent-soft)}
.res{margin-top:12px;padding:10px 12px;border-radius:8px;font-weight:700}
.res.pass{border:1px solid var(--ok);color:var(--ok)}
.res.fail{border:1px solid var(--ci);color:var(--ci)}
.pen{margin-top:12px}
.pool,.built{display:flex;flex-wrap:wrap;gap:6px;min-height:42px;padding:8px;border:1px dashed var(--line);border-radius:8px;margin-bottom:8px}
.pool button,.built button{font:inherit;padding:6px 10px;border:1px solid var(--line);border-radius:7px;background:var(--bg);color:var(--ink);cursor:pointer;overflow-wrap:anywhere;text-align:left}
.must{margin:8px 0 0;padding-left:20px;font-size:14px;display:grid;gap:2px}
.btn:disabled{opacity:.4;cursor:not-allowed}
.wr{background:var(--accent-soft);border-left:4px solid var(--accent);border-radius:6px;padding:8px 10px;margin-bottom:8px;font-weight:700}
.wl{font-size:11px;letter-spacing:.06em;color:var(--accent);margin-bottom:2px}
.lockcard{display:none;border:1px dashed var(--muted);border-radius:10px;padding:18px;text-align:center;color:var(--muted);font-weight:700}
.qw.locked .lockcard{display:block}
.qw.locked .step{display:none}
.teacher{margin-top:26px;border:1px dashed var(--muted);border-radius:10px;padding:14px}
.teacher h2{font-size:13px;letter-spacing:.06em;color:var(--muted);margin:0 0 8px}
.teacher ol{margin:0;padding-left:20px;display:grid;gap:4px}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}
</style>

 "me"], "at": "책 85쪽 · 4번", "st": "요약 빈칸", "q": "빈칸 a, b, c의 근거 문장 번호를 적고 해당 단어에 동그라미를 치세요.", "opts": [["a", "pledged to eliminate a ___", "a ___을(를) 없애겠다고 약속", "2번 문장(pledged)·9번 문장: fossil fuels"], ["b", "reduced b ___ by 70%", "b ___을(를) 70% 줄임", "9번 문장: carbon emissions"], ["c", "turning c ___ into energy", "c ___을(를) 에너지로 바꾸기", "12번 문장: waste"]], "ans": "a fossil fuels, b carbon emissions, c waste", "write": ["a fossil fuels (2·9번)", "b carbon emissions (9번)", "c waste (12번)"]}], "check": ["5번 문장에서 Beyond가 무엇을 알려 주는지, 그래서 문단 순서가 어떻게 되는지 말해 보세요.", "9번 문장을 슬래시 친 대로 읽고 yet과 already가 각각 무엇을 나타내는지 말해 보세요.", "13번과 14번 문장에서 난방 연료와 차량 연료의 재료가 각각 무엇인지 말해 보세요."]}, {"id": "r23", "no": 23, "ko": "진실보다 중요한 ‘눈치’?", "pg": "책 86~87쪽", "steps": [{"tags": ["hl", "ci"], "at": "1번 문장", "st": "In the 1950s, psychologist Solomon Asch…", "q": "연대 1950s에 동그라미를 치고, 실험을 한 사람과 직업에 형광펜을 치세요. 한글로 적으세요.", "help": [["psychologist", "심리학자"], ["conduct", "실시하다, 수행하다"], ["experiment", "실험"]], "ans": "1950년대, 심리학자 Solomon Asch가 유명한 실험을 실시함.", "write": ["1950년대, Solomon Asch 실험"]}, {"tags": ["me", "ul"], "at": "1번 문장의 빈칸", "st": "…to explore ____.", "q": "빈칸에 들어갈 말을 먼저 한글로 추측해 여백에 적고, 9번과 13~14번 문장을 읽으며 근거에 밑줄을 치세요. 선지는 그다음에 보세요.", "help": [["explore", "탐구하다"], ["pressure", "압박, 압력"]], "ans": "예: 다른 사람들 때문에 사람들이 자기 판단을 바꾸는지. 근거: 9번 follow the confederates' incorrect answers or trust their own judgment, 13번 social pressure.", "write": ["빈칸: 다른 사람들 때문에 판단을 바꾸는지", "근거: 9번, 13번 social pressure"]}, {"tags": ["ci", "ul"], "at": "2~3번 문장", "st": "He invited groups of university students…", "q": "However에 동그라미를 치세요. 각 그룹에서 진짜 참가자는 몇 명이고 나머지는 누구인지 밑줄을 치고 적으세요.", "help": [["participate in ~", "~에 참여하다"], ["participant", "참가자"], ["confederate", "공모자"]], "ans": "진짜 참가자는 그룹당 1명뿐이고 나머지는 Asch와 몰래 일하는 공모자(confederates).", "write": ["진짜 참가자 1명, 나머지 = 공모자(confederates)"]}, {"tags": ["sl", "an"], "at": "5번 문장", "st": "The first card showed a single vertical line…", "q": "의미 덩어리마다 슬래시(/)를 치세요. vertical에 형광펜을 치고 반의어를 }], "qs": [{"tags": ["hl", "me"], "at": "책 89쪽 · 1번", "st": "주제", "q": "선지마다 핵심 단어에 형광펜을 치고 우리말 뜻을 적으세요. 지문 전체와 맞는지 O, △로 표시하세요.", "opts": [["①", "Doctors recommend limiting laughter to avoid health risks.", "의사들은 건강 위험을 피하려면 웃음을 제한하라고 권한다.", "본문은 웃지 말라고 하지 않음(10번). X"], ["②", "Laughter causes more harm than good to the body.", "웃음은 몸에 이로움보다 해로움을 더 많이 일으킨다.", "10번: 대부분의 경우 이로움. X"], ["③", "A good laugh can heal both the body and mind.", "즐거운 웃음은 몸과 마음을 모두 치유할 수 있다.", "마음 치유 내용 없음. 극단적 웃음의 위험도 빠짐. △"], ["④", "Laughter is healthy, but extreme laughter can be risky.", "웃음은 건강에 좋지만, 극단적인 웃음은 위험할 수 있다.", "3~9번(극단적 웃음의 위험)과 10~11번(대부분은 이로움) 모두 포함. O"], ["⑤", "People who laugh intensely experience serious health issues.", "심하게 웃는 사람들은 심각한 건강 문제를 겪는다.", "드문 사례(3번 rare)를 일반화함. X"]], "ans": "본문 전체 흐름과 맞는 선지는 ④.", "write": ["정답 ④", "근거: 3~9번 위험 + 10~11번 이로움", "② 대부분 이로움(10번) / ⑤ 드문 사례 일반화(3번 rare)"]}, {"tags": ["ul", "me"], "at": "책 89쪽 · 2번", "st": "T/F", "q": "문장을 해석하고 근거 문장의 번호를 적은 뒤 T 또는 F를 쓰세요.", "opts": [["(1)", "A man whose laughter lasted for two minutes died while laughing.", "웃음이 2분 동안 이어진 남자는 웃는 중에 숨졌다.", "6번 문장: 2분 가까이 웃은 뒤 잠자는 중에 숨짐(dying in his sleep). F"], ["(2)", "Intense laughing can prevent proper oxygen flow.", "강한 웃음은 적절한 산소 흐름을 막을 수 있다.", "8번 문장: disrupt oxygen flow to the brain. T"]], "ans": "(1) F, (2) T", "write": ["(1) 6번 F: 잠자는 중 숨짐", "(2) 8번 T: disrupt oxygen flow"]}, {"tags": ["hl", "ci"], "at": "책 89쪽 · 3번", "st": "빈칸 추론", "q": "(A)는 3번 문장, (B)는 10번 문장에서 앞뒤 단서에 밑줄을 치고 선지의 각 단어 뜻을 적으세요.", "opts": [["①", "harmless … valuable", "해롭지 않은 … 가치 있는", "(A) 사례들은 사망·심장 문제. 해롭지 않다는 말과 안 맞음. X"], ["②", "harmful … beneficial", "해로운 … 이로운", "(A) 4~9번 사례들이 해로운 결과. (B) 대부분의 경우 이로움(10~11번). O"], ["③", "harmful … dangerous", "해로운 … 위험한", "(B)가 위험하다면 although/shouldn't stop anyone from laughing과 모순. X"], ["④", "harmless … beneficial", "해롭지 않은 … 이로운", "(A)가 맞지 않음. X"], ["⑤", "unexpected … harmful", "예상치 못한 … 해로운", "(B)가 해롭다면 웃음을 멈추지 말라는 말과 모순. X"]], "ans": "(A) harmful, (B) beneficial인 ②.", "write": ["정답 ② (A) harmful, (B) beneficial", "(A) 4~9번 / (B) 10~11번", "③ although와 모순"]}, {"tags": ["ul", "an"], "at": "책 89쪽 · 4번", "st": "요약 오류 찾기", "q": "(a)~(d) 각 문장의 근거 문장 번호를 적고, 본문과 다른 부분에 밑줄을 치세요.", "opts": [["(a)", "Extreme laughter can sometimes have negative effects on the body.", "극단적인 웃음은 때로 몸에 부정적인 영향을 줄 수 있다.", "7번 문장과 일치. 맞음"], ["(b)", "Some people experience breathing or heart problems due to laughing intensely.", "어떤 사람들은 심하게 웃어서 호흡이나 심장 문제를 겪는다.", "5~6번, 8~9번과 일치. 맞음"], ["(c)", "Doctors explain that this is caused by changes in pressure in the brain.", "의사들은 이것이 뇌의 압력 변화 때문이라고 설명한다.", "8번 문장: 압력이 바뀌는 곳은 가슴(chest). 뇌는 산소 흐름이 방해받는 곳. 틀림"], ["(d)", "Therefore, the saying ‘laughter is the best medicine’ turns out to be false; it should be enjoyed in moderation.", "따라서 ‘웃음은 최고의 약’이라는 속담은 틀린 것으로 드러났고, 적당히 즐겨야 한다.", "11번 문장: 속담이 여전히 맞음(still holds true). 틀림"]], "ans": "맞게 요약하지 않은 쌍은 (c), (d)인 ⑤.", "write": ["정답 ⑤ (c), (d)", "(c) 8번: 압력 변화는 chest, 뇌 X", "(d) 11번: 속담 still holds true"]}], "check": ["5번 문장을 슬래시 친 대로 읽고 that이 무엇을 꾸미는지 말해 보세요.", "8번 문장에서 압력이 바뀌는 곳과 영향받는 두 가지를 말해 보세요.", "(A)와 (B)에 들어갈 말을 10~11번 문장의 단서와 함께 설명해 보세요."]}], "9": [{"id": "r25", "no": 25, "ko": "천재의 호기심이 남긴 영원한 메시지", "pg": "책 94~95쪽", "steps": [{"tags": ["hl", "me"], "at": "1번 문장", "st": "Leonardo da Vinci is best known for…", "q": "다빈치가 유명한 작품 두 가지에 형광펜을 치세요. but 뒤에서 그를 또 어떤 사람이라고 하는지 한글로 적으세요.", "help": [["be known for ~", "~로 유명하다[알려져 있다]"], ["masterpiece", "걸작, 명작"], ["brilliant", "훌륭한, 탁월한"]], "ans": "모나리자, 최후의 만찬. 그는 탁월한 과학자이기도 했음(also a brilliant scientist).", "write": ["모나리자, 최후의 만찬", "탁월한 과학자이기도 했음"]}, {"tags": ["ul", "ar"], "at": "2번 문장", "st": "Among his most valuable works is…", "q": "이 문장의 주어에 밑줄을 치세요. 주어가 동사 is 뒤에 있으므로, 앞의 Among ~ works에서 주어로 화살표를 그리세요.", "help": [["valuable", "귀중한, 가치 있는"], ["work", "작품"]], "ans": "주어: the Codex Leicester. Among his most valuable works가 앞으로 나와 주어와 동사의 순서가 바뀐 문장 (그의 가장 귀중한 작품들 중에는 Codex Leicester가 있다).", "write": ["주어: the Codex Leicester", "도치: Among ~ works가 앞으로"]}, {"tags": ["ci", "hl", "an"], "at": "3번 문장", "st": "The Codex Leicester is a 72-page manuscript…", "q": "72-page에 동그라미, manuscript 뜻을 위에 적으세요. rare에 형광펜을 치고 반의어를 적으세요.", "help": [["manuscript", "원고, 필사본 (= document)"], ["insight", "통찰(력); 이해"], ["rare", "드문, 희귀한 (↔ common 흔한)"]], "ans": "72쪽짜리 원고(= document). 다빈치의 생각을 들여다볼 수 있게 해 주는 드문 통찰. rare ↔ common (일반 반의어).", "write": ["manuscript = 원고(= document)", "rare ↔ common"]}, {"tags": ["me", "ul"], "at": "3번 문장의 빈칸", "st": "…his efforts to ____.", "q": "빈칸에 들어갈 말을 먼저 한글로 추측해 여백에 적으세요. 4~5번 문장을 읽으며 근거에 밑줄을 치고, 틀렸다면 다른 색 펜으로 고치세요. 선지는 그다음에 보세요.", "help": [["effort", "노력"], ["mind", "생각, 정신"]], "ans": "근거: 4~5번 문장. 물의 움직임, 빛의 행동, 우주의 신비 같은 자연 현상에 대한 생각과 스케치를 기록함. 즉 '자연 세계를 이해하려는 노력' 방향.", "write": ["빈칸 근거: 4~5번", "자연 세계를 이해하려는 노력"]}, {"tags": ["ul", "hl"], "at": "4번 문장", "st": "It captures his thoughts and sketches…", "q": "원고가 담고 있는 주제 세 가지에 밑줄을 치고 한글로 적으세요.", "help": [["capture", "포착하다"], ["subject", "주제"], ["behavior", "행동; (빛 등의) 움직임"], ["mystery", "신비"]], "ans": "물의 움직임, 빛의 행동(성질), 우주의 신비.", "write": ["물의 움직임, 빛의 행동", "우주의 신비"]}, {"tags": ["ul", "me"], "at": "5번 문장", "st": "His notes show how deeply…", "q": "노트가 보여 주는 두 가지(how deeply ~, how far ahead ~)에 밑줄을 치고 한글로 적으세요.", "help": [["deeply", "깊이, 깊게"], ["far ahead", "훨씬 앞서"], ["for his time", "그 시대치고는"]], "ans": "① 그가 이 주제들에 대해 얼마나 깊이 생각했는지. ② 그의 생각이 그 시대보다 얼마나 앞서 있었는지.", "write": ["얼마나 깊이 생각했는지", "그 시대보다 얼마나 앞섰는지"]}, {"tags": ["ci", "ar", "an"], "at": "6번 문장", "st": "In 1994, Microsoft co-founder Bill Gates…", "q": "1994와 30.8 million dollars에 동그라미를 치세요. making it의 it이 가리키는 것에 화살표를 그리고, expensive의 반의어를 적으세요.", "help": [["co-founder", "공동 설립자"], ["acquire", "입수하다, 획득하다"], ["document", "문서 (= manuscript)"], ["expensive", "비싼 (↔ cheap 싼)"]], "ans": "1994년, 3,080만 달러. it = the document(코덱스 레스터). 역사상 가장 비싸게 팔린 책. expensive ↔ cheap (일반 반의어).", "write": ["it = the document", "1994년, 3,080만 달러", "expensive ↔ cheap"]} ask questions), 새로운 가능성 탐구하기(explore new possibilities), 경이와 상상력으로 세상 보기(see the world with wonder and imagination). lasting ↔ temporary (일반 반의어).", "write": ["which = a lasting source of inspiration", "질문하기 / 새 가능성 탐구 / 경이와 상상력", "lasting ↔ temporary"]}], "qs": [{"tags": ["hl", "me"], "at": "책 95쪽 · 1번", "st": "세부 내용 (잘못 이해한 사람)", "q": "선지마다 본문에 대응되는 영어 표현(오른쪽 칸)을 찾아 책에 형광펜을 치세요. 본문과 어긋나는 선지에 X를 표시하세요.", "opts": [["①", "현진: 다빈치는 '모나리자'와 '최후의 만찬'으로 가장 잘 알려져 있어.", "best known for masterpieces like the Mona Lisa and The Last Supper", "1번 문장과 일치."], ["②", "승연: 코덱스 레스터에는 다빈치의 미술 작업을 위한 스케치도 포함되어 있어.", "sketches on topics such as the movement of water, the behavior of light, and the mysteries of the universe", "4번 문장: 스케치의 주제는 물·빛·우주. 미술 작업용이라는 말은 없음. X"], ["③", "유림: 코덱스 레스터는 1994년 판매 당시 역사상 가장 비싸게 팔린 책이었어.", "the most expensive book ever sold", "6번 문장과 일치."], ["④", "윤서: 빌 게이츠는 코덱스 레스터가 인류의 학습과 발견에 대한 열망을 상징한다고 생각했어.", "a symbol of humanity's desire to learn and discover", "7번 문장과 일치."], ["⑤", "준희: 코덱스 레스터는 많은 사람들이 볼 수 있도록 디지털화되었어.", "had the manuscript digitized so more people could follow", "8번 문장과 일치."]], "ans": "잘못 이해한 사람은 ② 승연.", "write": ["정답 ② 승연", "② 미술용 스케치 언급 없음(4번)", "근거: 1·4·6·7·8번"]}, {"tags": ["ul", "me"], "at": "책 95쪽 · 2번", "st": "세부 내용 (언급되지 않은 것)", "q": "각 선지의 근거 문장 번호를 선지 옆에 적으세요. 근거 문장을 못 찾으면 X로 표시하세요.", "opts": [["①", "총 페이지 수", "72-page manuscript", "3번 문장 (72-page)"], ["②", "작성 연도", "since its creation", "9번 문장에 'since its creation'만 나옴. 만들어진 해는 본문에 없음. 1994는 게이츠가 산 해(6번). X"], ["③", "기록된 주제", "topics such as the movement of water", "4번 문장"], ["④", "판매된 가격", "30.8 million dollars", "6번 문장"], ["⑤", "구매자", "Microsoft co-founder Bill Gates", "6번 문장"]], "ans": "언급되지 않은 것은 ② 작성 연도.", "write": ["정답 ② 작성 연도", "② 만든 해 없음(1994는 구매 해, 6번)", "①3번 ③4번 ④⑤6번"]}, {"tags": ["me", "ul"], "at": "책 95쪽 · 3번", "st": "빈칸 추론", "q": "선지를 우리말로 해석하고, 4~5번 문장에서 근거를 찾을 수 있는 선지에 O, 없는 선지에 X를 표시하세요.", "opts": [["①", "build a foundation for modern science", "현대 과학의 토대를 마련하는 것", function localStorage_get(){try{var v=localStorage.getItem("rg5unit");if(v&&U[v])return v}catch(e){}return Object.keys(U)[0]}
var unit=localStorage_get();var P=U[unit];
var store={get:function(k){try{return localStorage.getItem(k)}catch(e){return null}},set:function(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
var cur=0;
var done={};
try{done=JSON.parse(store.get("rg5u6")||"{}")||{}}catch(e){done={}}

function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function swatch(k){var s=el("span","sw "+k);if(k==="an")s.textContent="↔";s.setAttribute("aria-hidden","true");return s}

var qbtns=[];
function allOpened(p){for(var i=0;i<p.steps.length;i++)if(!done["o-"+p.id+"-s"+i])return false;return true}
function syncQ(){qbtns.forEach(function(b){b.disabled=!allOpened(P[cur])})}
function stepCard(p,s,i,kind){
  var key=p.id+"-"+kind+i;
  var c=el("div","step"+(done[key]?" done":""));
  var top=el("div","top");
  var cb=el("input","chk");cb.type="checkbox";cb.id="c-"+key;cb.checked=!!done[key];
  cb.setAttribute("aria-label",(i+1)+"번 완료");
  cb.addEventListener("change",function(){done[key]=cb.checked;c.classList.toggle("done",cb.checked);store.set("rg5u6",JSON.stringify(done));progress()});
  top.appendChild(cb);
  var b=el("div","body");
  var tg=el("div","tags");
  if(s.req||kind==="q"){tg.appendChild(el("span","rq","필수"))}
  s.tags.forEach(function(t){var g=el("span","tag");g.appendChild(swatch(t));g.appendChild(document.createTextNode(TAGS[t]));tg.appendChild(g)});
  b.appendChild(tg);
  var at=el("div","at");var em=el("em",null,s.at);at.appendChild(em);at.appendChild(document.createTextNode(" · "+s.st));
  b.appendChild(at);
  b.appendChild(el("p","q",s.q));
  if(kind==="q"){var ml=el("ul","must");["발문에서 묻는 것에 형광펜을 친다","선지마다 핵심 단어 1~2개에 형광펜을 치고 위에 우리말 뜻을 쓴다","지문의 근거 문장 번호를 선지 옆에 쓰고 O 또는 X를 표시한다","X인 선지는 본문과 다른 이유를 한 줄로 적고, 반의어 또는 반대 내용을 적는다"].forEach(function(t){ml.appendChild(el("li",null,t))});b.appendChild(ml)}
  var acts=el("div","acts");
  var hp=null,ap=null,hb=null,ab=null;
  if(s.help){
    hb=el("button","btn","도움");hb.type="button";hb.setAttribute("aria-expanded","false");acts.appendChild(hb);
    hp=el("div","panel help");hp.hidden=true;var ul=el("ul");
    s.help.forEach(function(h){var li=el("li");li.appendChild(el("span","w",h[0]));li.appendChild(document.createTextNode("  "+h[1]));ul.appendChild(li)});
    hp.appendChild(ul);
    hb.addEventListener("click",function(){hp.hidden=!hp.hidden;hb.setAttribute("aria-expanded",String(!hp.hidden))});
  }
  ab=el("button","btn",s.opts?"근거":"확인");ab.type="button";ab.setAttribute("aria-expanded","false");acts.appendChild(ab);
  ap=el("div","panel ans");ap.hidden=true;
  if(s.opts){
    s.opts.forEach(function(o){var d=el("div","opt");d.appendChild(el("div","en",o[0]+"  "+o[1]));d.appendChild(el("div","ko",o[2]));d.appendChild(el("div","nt",o[3]));ap.appendChild(d)});
    ap.appendChild(el("div","ko",s.ans)).style.fontWeight="700";
    ap.lastChild.style.marginTop="8px";
  }else{
    s.ans.split("\n").forEach(function(l){var d=el("div",null,l);ap.appendChild(d)});
  }
  if(s.write&&s.write.length){var wb=el("div","wr");wb.appendChild(el("div","wl","책에 쓸 것"));s.write.forEach(function(l){wb.appendChild(el("div",null,l))});ap.insertBefore(wb,ap.firstChild)}
  if(kind==="q"){qbtns.push(ab);ab.disabled=!allOpened(p)}
  ab.addEventListener("click",function(){if(ab.disabled)return;ap.hidden=!ap.hidden;ab.setAttribute("aria-expanded",String(!ap.hidden));if(kind==="s"){done["o-"+key]=true;store.set("rg5u6",JSON.stringify(done));syncQ()}});
  b.appendChild(acts);
  if(hp)b.appendChild(hp);
  b.appendChild(ap);
  top.appendChild(b);c.appendChild(top);
  return c;
}

function progress(){
  var p=P[cur],n=p.steps.length+p.qs.length,d=0,i;
  for(i=0;i<p.steps.length;i++)if(done[p.id+"-s"+i])d++;
  for(i=0;i<p.qs.length;i++)if(done[p.id+"-q"+i])d++;
  var pc=document.getElementById("pc");if(pc)pc.textContent=d+" / "+n;
  var pb=document.getElementById("pb");if(pb)pb.style.width=(100*d/n)+"%";
  var ok=true;for(i=0;i<p.steps.length;i++)if(!done[p.id+"-s"+i])ok=false;
  var qw=document.getElementById("qw");if(qw)qw.classList.toggle("locked",!ok);
}

function render(){
  P=U[unit];if(cur>=P.length)cur=0;
  var up=document.getElementById("units");up.textContent="";
  Object.keys(U).forEach(function(k){var b=el("button","ub","Unit "+k);b.type="button";b.setAttribute("aria-pressed",String(k===unit));
    b.addEventListener("click",function(){unit=k;cur=0;try{localStorage.setItem("rg5unit",k)}catch(e){}render()});up.appendChild(b)});
  var tabs=document.getElementById("tabs");tabs.textContent="";
  P.forEach(function(p,i){
    var t=el("button","tab");t.type="button";t.setAttribute("role","tab");t.setAttribute("aria-selected",String(i===cur));
    t.appendChild(el("b",null,"Reading "+p.no));t.appendChild(el("span",null,p.ko));
    t.addEventListener("click",function(){cur=i;render()});tabs.appendChild(t);
  });
  var p=P[cur],v=document.getElementById("view");document.getElementById("sub").textContent="Unit "+unit+" · "+p.pg;v.textContent="";
  var m=el("div","meta");var st=el("strong",null,p.ko);m.appendChild(st);var pc=el("span",null,"");pc.id="pc";m.appendChild(pc);v.appendChild(m);
  var bar=el("div","bar");var bi=el("i");bi.id="pb";bar.appendChild(bi);v.appendChild(bar);
  v.appendChild(el("div","sec","지문 읽기"));
  qbtns=[];
  p.steps.forEach(function(s,i){v.appendChild(stepCard(p,s,i,"s"))});
  var qw=el("div","qw");qw.id="qw";qw.appendChild(el("div","sec","문제 선지"));
  var lk=el("div","lockcard","잠김");lk.id="lk";qw.appendChild(lk);
  p.qs.forEach(function(s,i){qw.appendChild(stepCard(p,s,i,"q"))});v.appendChild(qw);
  progress();
}
render();
