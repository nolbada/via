rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Hello! I’m Christopher Robin from the storybook, Winnie-the-Pooh.", "ko": "안녕! 나는 동화책 ‘Winnie-the-Pooh’에 나오는 Christopher Robin이야.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "I’m a thoughtfully character in the stories, and I’m kind to my friends.", "ko": "나는 이야기 속에서 사려 깊은 등장인물이고, 내 친구들에게 친절해.", "ok": false, "foot": [], "fixes": [{"wrong": "thoughtfully", "right": "thoughtful", "partial": false, "at": [2], "point": "형용사 vs 부사: 명사 character를 꾸미는 자리이므로 형용사 thoughtful 사용 (부사 thoughtfully 아님)", "topic": "형용사 vs 부사", "memo": "명사 character를 꾸미는 자리이므로 형용사 thoughtful 사용 (부사 thoughtfully 아님)"}]}, {"n": 3, "tag": null, "en": "Now I’m look at some old pictures of them.", "ko": "지금 나는 그들의 오래된 사진 몇 장을 보고 있어.", "ok": false, "foot": [], "fixes": [{"wrong": "look", "right": "looking", "partial": false, "at": [2], "point": "현재진행형: be동사(am) 뒤에는 v-ing형 looking 사용", "topic": "현재진행형", "memo": "be동사(am) 뒤에는 v-ing형 looking 사용"}]}, {"n": 4, "tag": null, "en": "They are the most happiest animal in the woods.", "ko": "그들은 숲에서 가장 행복한 동물들이지.", "ok": false, "foot": [], "fixes": [{"wrong": "the most happiest", "right": "the happiest", "partial": false, "at": [2], "point": "최상급: happy는 -est를 붙여 happiest로 최상급을 만들며 most와 중복 사용 불가", "topic": "최상급", "memo": "happy는 -est를 붙여 happiest로 최상급을 만들며 most와 중복 사용 불가"}, {"wrong": "animal", "right": "animals", "partial": false, "at": [5], "point": "수일치: 주어 They(복수)에 맞춰 보어도 복수형 animals 사용", "topic": "수일치", "memo": "주어 They(복수)에 맞춰 보어도 복수형 animals 사용"}]}, {"n": 5, "tag": null, "en": "Would you like to take a look and hear about them?", "ko": "사진을 살펴보고 그들에 대한 이야기를 들어볼래?", "ok": true, "foot": [], "fixes": []}, {"n": 6, "tag": "Pooh", "en": "This was Pooh and me.", "ko": "이건 Pooh와 나야.", "ok": false, "foot": [], "fixes": [{"wrong": "was", "right": "is", "partial": false, "at": [1], "point": "시제: 지금 사진을 보며 설명하는 상황이므로 현재시제 is 사용", "topic": "시제", "memo": "지금 사진을 보며 설명하는 상황이므로 현재시제 is 사용"}]}, {"n": 7, "tag": nul e talks a lot, and sometimes his stories are hard to understand.", "그는 말을 많이 하고, 가끔 그의 이야기는 이해하기 어려워.", 0], ["But he loves giving us advice, and it’s often helpful.", "하지만 그는 우리에게 조언해 주는 것을 좋아하고, 그 조언은 종종 도움이 돼.", 0], ["Owl is always ready to help.", "Owl은 항상 도울 준비가 되어 있어.", 0], ["We’re all different, but we’re good friends. We love each other.", "우리는 모두 다르지만, 좋은 친구들이야. 우리는 서로를 사랑해.", 0]];var RNUM=3;var TITLE_EN="Different but Together";var PASS_EN=["Different but Together", "Hello! I’m Christopher Robin from the storybook, Winnie-the-Pooh. I’m a thoughtful character in the stories, and I’m kind to my friends. Now I’m looking at some old pictures of them. They are the happiest animals in the woods. Would you like to take a look and hear about them?", "This is Pooh and me. Pooh loves all kinds of food, but he likes honey the best. In this picture, he is holding a big balloon and trying to get honey from a beehive. What happened next? The bees popped his balloon, so he couldn’t get the honey. He failed, but he was cheerful and hopeful. He is always thinking of creative ways to get honey.", "This is a picture of a stormy day in the woods. The strong wind almost broke the door, so my friends had to hold it. Luckily, there was a rope to help. Both Pooh and Rabbit couldn’t move, but small, scared Piglet could. They said to Piglet, “Tie the door, please!” He gathered his courage and tied it tightly. Piglet is shy and easily scared. But he becomes brave when his friends need him.", "My friend in the last picture is Owl. Owl believes he is the smartest animal in the woods. He is proud of his knowledge. In this picture, Owl is telling us a long story, and we are listening. Do you see the look on our faces? You're right! We’re not really following his story. He talks a lot, and sometimes his stories are hard to understand. But he loves giving us advice, and it’s often helpful. Owl is always ready to help. We’re all different, but we’re good friends. We love each other."];var PASS_KO=["다르지만 함께", "안녕! 나는 동화책 ‘Winnie-the-Pooh’에 나오는 Christopher Robin이야. 나는 이야기 속에서 사려 깊은 등장인물이고, 내 친구들에게 친절해. 지금 나는 그들의 오래된 사진 몇 장을 보고 있어. 그들은 숲에서 가장 행복한 동물들이지. 사진을 살펴보고 그들에 대한 이야기를 들어볼래?", "이건 Pooh와 나야. Pooh는 모든 종류의 음식을 좋아하지만, 꿀을 가장 좋아해. 이 사진에서, 그는 커다란 풍선을 잡고 있고 벌집에서 꿀을 꺼내려고 하고 있어. 그 다음에는 무슨 일이 일어났을까? 벌들이 Pooh의 풍선을 터뜨렸고, 그래서 그는 꿀을 얻을 수 없었어. 그는 실패했지만, 쾌활하고 희망에 차 있었어. 그는 항상 꿀을 얻을 창의적인 방법들에 대해 생각하고 있어.", "이것은 숲에 폭풍우가 몰아치던 날의 사진이야. 강한 바람이 문을 거의 부술 뻔해서, 내 친구들이 그것을 잡고 있어야 했어. 다행히도, 도움이 될 밧줄이 하나 있었어. Pooh와 Rabbit은 둘 다 움직일 수 없었지만, 작고 겁 많은 Piglet은 할 수 있었어. 그들은 Piglet에게 말했어. \"문 좀 묶어 줘!\" 그는 용기를 내어 문을 단단히 묶었어. Piglet은 수줍음이 많고 쉽게 겁을 먹지. 하지만 친구들이 그를 필요로 할 때 그는 용감해져.", "마지막 사진 속의 내 친구는 Owl이야. Owl은 자신이 숲에서 가장 똑똑한 동물이라고 믿어. 그는 자신의 지식을 자랑스러워하지. 이 사진에서, Owl은 우리에게 긴 이야기를 말해주고 있고, 우리는 듣고 있지. 우리들 얼굴의 표정이 보이니? 맞아! 우리는 그의 이야기를 잘 따라가고 있지는 않아. 그는 말을 많이 하고, 가끔 그의 이야기는 이해하기 어려워. 하지만 그는 우리에게 조언해 주는 것을 좋아하고, 그 조언은 종종 도움이 돼. Owl은 항상 도울 준비가 되어 있어. 우리는 모두 다르지만, 좋은 친구들이야. 우리는 서로를 사랑해."];var DG=[{"dlg": [["B", "My friend Amy wants to join your club, the school band.", "내 친구 Amy가 너희 동아리인 학교 밴드에 가입하고 싶어 해."], ["G", "Really? What does she play?", "정말? 그 애는 무슨 악기를 연주하니?"], ["B", "She is really good at playing the drums.", "그 애는 드럼 연주를 정말 잘해."], ["G", "What is she like? Is she active?", "그 애는 어떤 사람이야? 활동적이니?"], ["B", "Yes, she is active and friendly.", "응, 그 애는 활동적이고 다정해."]], "qs": [{"n": 1, "q": "위 대화를 읽고 알 수 있는 것은?", "o": ["소년의 성격", "소녀의 특기", "Amy의 나이", "소녀의 동아리", "소년의 동아리"], "a": 3, "ans": "소녀의 동아리", "evs": [["B: My friend Amy wants to join your club, the school band.", "내 친구 Amy가 너희 동아리인 학교 밴드에 가입하고 싶어 해."]], "ev": ["B: My friend Amy wants to join your club, the school band.", "내 친구 Amy가 너희 동아리인 학교 밴드에 가입하고 싶어 해."], "memo": ["B: My friend Amy wants to join your club, the school band.  (내 친구 Amy가 너희 동아리인 학교 밴드에 가입하고 싶어 해.)"]}]}, {"dlg": [["B", "Look! Our school has a new club, the coding club.", "봐! 우리 학교에 새 동아리인 코딩 동아리가 생겼어."], ["G", "That sounds cool. Do you want to join?", "멋지다. 너 가입하고 싶니?"], function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}

  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });

function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
