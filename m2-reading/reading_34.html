 are buying a 40-dollar lipstick.", "잠깐, 소미야! 네 예산은 30달러인데, 너는 40달러짜리 립스틱을 사고 있어.", 0], ["The 40-dollar lipstick sounds cheap only because the salesperson showed you a 50-dollar lipstick first.", "단지 판매원이 너에게 50달러짜리 립스틱을 먼저 보여 줬기 때문에 40달러짜리 립스틱이 싸게 들리는 거야.", 0], ["This is an example of the anchoring effect.", "이것은 앵커링 효과의 예시야.", 0], ["Usually, the first piece of information becomes an “anchor” and influences the shopper’s decision.", "보통 첫 번째 정보가 ‘닻’이 되어 구매자의 결정에 영향을 미쳐.", 0], ["In your case, the 50-dollar lipstick was an anchor.", "너의 경우에는 50달러짜리 립스틱이 닻이었어.", 0], ["Somi, don’t just rely on the first piece of information that is given to you.", "소미야, 너에게 주어진 첫 번째 정보에만 의존하지 마.", 0]];var RNUM=34;var TITLE_EN="Be a Smart Shopper";var PASS_EN=["Be a Smart Shopper", "Do you think you are a smart shopper? Well, you may think you are, but hold on!", "There are various marketing strategies which influence your decisions. Learning about them will make you a smarter shopper. What? The sale ends in two hours? If I don’t buy the sneakers now, I will have to buy them at a higher price. Stop, Junho! You’re buying the sneakers just because you don’t want to miss the sale. You’re falling for a hunger marketing strategy. If people can buy a product only for a limited time, they often feel “hungry” for it and want to buy it. About missing the sale, don’t worry, Junho. You’ll soon see a similar sale again.", "That’s the hottest dress on social media now. Lots of people are wearing it. I have to get that dress, too! Wait, Yuna! You only want the dress because you saw it again and again on social media. It isn’t just you. There are a lot of people who fall for a viral marketing strategy. Why? Information about a product can spread quickly and widely on the Internet, just like a “virus.” If a product becomes hot on social media, people naturally want to have it. Yuna, just remember that a popular product isn’t always right for you.", "I’m looking for a lipstick for my mom. How about this? Expensive! I thought I could buy a lipstick for 30 dollars. This is also popular. That’s better! Hold on, Somi! Your budget is 30 dollars, but you are buying a 40-dollar lipstick. The 40-dollar lipstick sounds cheap only because the salesperson showed you a 50-dollar lipstick first. This is an example of the anchoring effect. Usually, the first piece of information becomes an “anchor” and influences the shopper’s decision. In your case, the 50-dollar lipstick was an anchor. Somi, don’t just rely on the first piece of information that is given to you."];var PASS_KO=["현명한 구매자가 되세요", "여러분은 자신이 현명한 구매자라고 생각하나요? 글쎄요, 여러분은 그렇다고 생각할 수도 있지만, 잠깐만요!", "여러분의 결정에 영향을 미치는 다양한 마케팅 전략들이 있어요. 그것들에 대해 배우는 것이 여러분을 더 현명한 구매자로 만들 거예요. 뭐라고? 세일이 두 시간 후에 끝난다고? 지금 운동화를 사지 않으면, 더 비싼 가격에 그것을 사야 할 거야. 멈춰, 준호야! 너는 단지 세일을 놓치고 싶지 않아서 운동화를 사고 있는 거야. 너는 헝거 마케팅 전략에 속고 있어. 만약 사람들이 한정된 시간 동안만 제품을 살 수 있다면, 그들은 종종 그 제품에 대해 ‘배고프다’고 느끼고 그것을 사고 싶어 해. 세일을 놓치는 것에 대해서는 걱정하지 마, 준호야. 너는 곧 비슷한 세일을 다시 보게 될 거야.", "저건 지금 소셜 미디어에서 가장 인기 있는 원피스야. 많은 사람들이 이것을 입고 있어. 나도 저 원피스를 사야 해! 잠깐, 유나야! 너는 소셜 미디어에서 그 원피스를 계속 봤기 때문에 그것을 원하는 것뿐이야. 너뿐만이 아니야. 바이럴 마케팅 전략에 속는 사람들이 많아. 왜냐고? 제품에 대한 정보는 ‘바이러스’처럼 인터넷에서 빠르게 널리 퍼질 수 있어. 만약 어떤 제품이 소셜 미디어에서 인기를 끌게 되면, 사람들은 자연스럽게 그것을 갖고 싶어 해. 유나야, 인기 있는 제품이 항상 너에게 적합한 것은 아니라는 것을 기억하렴.", "저는 엄마에게 드릴 립스틱을 찾고 있어요. 이건 어때요? 비싸네요! 저는 립스틱을 30달러에 살 수 있을 줄 알았어요. 이것도 인기 있어요. 그게 더 좋네요! 잠깐, 소미야! 네 예산은 30달러인데, 너는 40달러짜리 립스틱을 사고 있어. 단지 판매원이 너에게 50달러짜리 립스틱을 먼저 보여 줬기 때문에 40달러짜리 립스틱이 싸게 들리는 거야. 이것은 앵커링 효과의 예시야. 보통 첫 번째 정보가 ‘닻’이 되어 구매자의 결정에 영향을 미쳐. 너의 경우에는 50달러짜리 립스틱이 닻이었어. 소미야, 너에게 주어진 첫 번째 정보에만 의존하지 마."];var DG=[{"dlg": [["M", "Hi, can I help you?", "안녕하세요, 도와드릴까요?"], ["G", "Yes. I’m looking for a traditional Korean souvenir. It’s for my dad.", "네. 한국 전통 기념품을 찾고 있어요. 아빠께 드릴 거예요."], ["M", "How about this fan? It is really popular.", "이 부채는 어때요? 정말 인기가 많아요."], ["G", "Hmm ... can you show me something else?", "음... 다른 것을 보여 주실 수 있나요?"], ["M", "How about this hat, then? This is a gat, a traditional Korean hat fo  for traditional Korean cookies.'라고 말하고, 여자가 'this box is 8,000 won'이라고 말함."}]}];var BG=[{"pp": [["Be a Smart Shopper", "현명한 구매자가 되세요"], ["Do you think you are a smart shopper?", "여러분은 자신이 현명한 구매자라고 생각하나요?"], ["Well, you may think you are, but hold on!", "글쎄요, 여러분은 그렇다고 생각할 수도 있지만, 잠깐만요!"], ["There are various marketing strategies which influence your decisions.", "여러분의 결정에 영향을 미치는 다양한 마케팅 전략들이 있어요."], ["Learning about them will make you a smarter shopper.", "그것들에 대해 배우는 것이 여러분을 더 현명한 구매자로 만들 거예요."], ["What? The sale ends in two hours?", "뭐라고? 세일이 두 시간 후에 끝난다고?"], ["If I don’t buy the sneakers now, I will have to buy them at a higher price.", "지금 운동화를 사지 않으면, 더 비싼 가격에 그것을 사야 할 거야."], ["Stop, Junho! You’re buying the sneakers just because you don’t want to miss the sale.", "멈춰, 준호야! 너는 단지 세일을 놓치고 싶지 않아서 운동화를 사고 있는 거야."], ["You’re falling for a hunger marketing strategy.", "너는 헝거 마케팅 전략에 속고 있어."], ["If people can buy a product only for a limited time, they often feel “hungry” for it and want to buy it.", "만약 사람들이 한정된 시간 동안만 제품을 살 수 있다면, 그들은 종종 그 제품에 대해 ‘배고프다’고 느끼고 그것을 사고 싶어 해."], ["About missing the sale, don’t worry, Junho. You’ll soon see a similar sale again.", "세일을 놓치는 것에 대해서는 걱정하지 마, 준호야. 너는 곧 비슷한 세일을 다시 보게 될 거야."]], "qs": [{"n": 6, "q": "윗글의 내용과 일치하는 것은?", "o": ["세일은 두 시간 전에 이미 끝났다.", "준호는 운동화가 꼭 필요해서 사려고 한다.", "사람들은 한정된 시간 동안만 제품을 살 수 있을 때 그것을 더 사고 싶어 한다.", "준호는 앞으로 비슷한 세일을 다시 볼 수 없을 것이다.", "마케팅 전략은 우리의 구매 결정에 영향을 주지 않는다."], "a": 2, "evs": [["If people can buy a product only for a limited time, they often feel “hungry” for it and want to buy it.", "만약 사람들이 한정된 시간 동안만 제품을 살 수 있다면, 그들은 종종 그 제품에 대해 ‘배고프다’고 느끼고 그것을 사고 싶어 해."]], "ans": "사람들은 한정된 시간 동안만 제품을 살 수 있을 때 그것을 더 사고 싶어 한다.", "ev": ["If people can buy a product only for a limited time, they often feel “hungry” for it and want to buy it.", "만약 사람들이 한정된 시간 동안만 제품을 살 수 있다면, 그들은 종종 그 제품에 대해 ‘배고프다’고 느끼고 그것을 사고 싶어 해."], "memo": ["If people can buy a product only for a limited time, they often feel “hungry” for it a  return h+'</div></div>';

function partHtml(p){

 P.groups.forEach(function(g){h+='<div class="grp">';

 });

 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';

function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';

  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;

   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }

function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';

 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;

function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
