were four eyewitnesses. What did they say? Read the following, and find the criminal.","Ann Jones, a visitor","I was looking at the Monalisa, and someone threw a cake at the painting. I turned around and saw an old man. He was standing in front of a wheelchair. I'm about 170 cm tall, and he was a little taller than me.","Carlos Diaz, a janitor","An old man with gray hair was running away, and something fell off his head. It was his wig. I ran after him, but I couldn't catch him. He was faster than me. In fact, the old man was not old. He was a young man with long brown hair.","Diego Perez, a guard","I went to the crime scene, and there were pieces of cake all over the painting. There was also a wheelchair near the painting, and I found a cake box next to the wheelchair. The box was from Camila's Bakery.","Camila Santos, the owner of Camila's Bakery","Last Friday, a young man came in. I spoke to him in Spanish, but he didn't understand me. He spoke only English. We had a lot of different cakes, but he just wanted the smallest one. We sold only one cake that day, so I remember him clearly. Oh, he had blue eyes."];var PASS_KO=["누가 '모나리자'에 케이크를 던졌나?","지난 토요일, 누군가 콜롬비아 보고타의 보테로 박물관에 있는 '모나리자'에 케이크를 던졌다. 네 명의 목격자가 있었다. 그들은 뭐라고 말했을까? 다음을 읽고, 범인을 찾아보자.","Ann Jones, 방문객","저는 '모나리자'를 보고 있었는데, 누군가 그 그림을 향해 케이크를 던졌어요. 저는 뒤로 돌았고 한 노인을 봤어요. 그는 휠체어 앞에 서 있었어요. 저는 키가 170cm 정도인데, 그는 저보다 조금 더 컸어요.","Carlos Diaz, 청소부","회색 머리의 한 노인이 도망가고 있었는데, 그의 머리에서 무언가 떨어졌어요. 그것은 그의 가발이었어요. 저는 그를 뒤쫓았지만, 잡을 수 없었어요. 그는 저보다 더 빨랐거든요. 사실, 그 노인은 나이 든 사람이 아니었어요. 그는 긴 갈색 머리의 젊은 남자였어요.","Diego Perez, 경비원","저는 범죄 현장에 갔는데, 그림 곳곳에 케이크 조각들이 있었어요. 그림 근처에 휠체어도 있었는데, 저는 휠체어 옆에서 케이크 상자를 발견했어요. 그 상자는 Camila 빵집의 것이었어요.","Camila Santos, Camila 빵집의 주인","지난 금요일, 한 젊은 남자가 들어왔어요. 저는 그에게 스페인어로 말했지만, 그는 제 말을 이해하지 못했어요. 그는 영어로만 말했어요. 우리 가게에는 다양한 케이크가 많이 있었지만, 그는 단지 가장 작은 것을 원했어요. 우리는 그날 케이크를 한 개만 팔아서, 저는 그를 똑똑히 기억해요. 아, 그는 파란색 눈을 가지고 있었어요."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["'해바라기'는 소녀가 가장 좋아하는 그림이다.","소녀
