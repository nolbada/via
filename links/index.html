<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<meta name="application-name" content="앱 링크">
<meta name="apple-mobile-web-app-title" content="앱 링크">
<title>앱 링크</title>
<style>
:root{--bg:#f4f6f5;--card:#ffffff;--ink:#16211f;--sub:#5b6b67;--line:#dbe3e0;--accent:#0f766e}
@media (prefers-color-scheme:dark){:root{--bg:#10171a;--card:#182125;--ink:#e8eeec;--sub:#9db0ab;--line:#2a3639;--accent:#2fb5a8}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:22px;margin:0 0 20px;letter-spacing:-.01em}
h2{font-size:14px;color:var(--sub);font-weight:700;margin:26px 0 8px;letter-spacing:.02em}
a.app{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-left:5px solid var(--accent);border-radius:10px;padding:18px 16px;margin-bottom:10px;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700}
a.app span{font-size:13px;font-weight:400;color:var(--sub)}
a.app:active{background:var(--line)}
a.app.fbi{border-left-color:#c2410c}
</style>
</head>
<body>
<main>
<h1>앱 링크</h1>

<h2>FBI</h2>
<a class="app fbi" href="https://nolbada.github.io/via/fbi/g1-9/">FBI 고1 9월</a>
<a class="app fbi" href="https://nolbada.github.io/via/fbi/g2-6/">FBI 고2 6월</a>
<h2>비단챌</h2>
<a class="app" href="https://nolbada.github.io/via/">비단챌 말하기<span>예문 말하기 테스트</span></a>
