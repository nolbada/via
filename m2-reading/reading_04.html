 Dolphin Lovers를 찾았다.", "ok": false, "foot": [], "fixes": [{"wrong": "a", "right": "an", "partial": false, "at": [7], "point": "관사 a/an: 모음 소리 NGO 앞에는 an 사용", "topic": "관사 a/an", "memo": "모음 소리 NGO 앞에는 an 사용"}]}, {"n": 6, "tag": null, "en": "It does various activities such as cleaning up beaches and help dolphins. After some thought, I joined it today.", "ko": "이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다. 고민 끝에, 나는 오늘 이곳에 가입했다.", "ok": false, "foot": [], "fixes": [{"wrong": "help", "right": "helping", "partial": false, "at": [10], "point": "동명사: such as 뒤 병렬구조로 helping 사용", "topic": "동명사", "memo": "such as 뒤 병렬구조로 helping 사용"}]}, {"n": 7, "tag": "인호 · 1월 20일", "en": "Many dolphins get sick or even die because plastic waste and fishing nets, so cleaning up beaches are important.", "ko": "많은 돌고래들이 플라스틱 쓰레기와 어망 때문에 병에 걸리거나 심지어 죽기도 하므로 해변을 청소하는 것은 중요하다.", "ok": false, "foot": [], "fixes": [{"wrong": "plastic", "right": "of plastic", "partial": false, "at": [8], "point": "전치사와 접속사: 명사구 앞에는 because of 사용", "topic": "전치사와 접속사", "memo": "명사구 앞에는 because of 사용", "alt": [7]}, {"wrong": "are", "right": "is", "partial": false, "at": [17], "point": "동명사 주어: 동명사 주어 cleaning은 단수 취급, is 사용", "topic": "동명사 주어", "memo": "동명사 주어 cleaning은 단수 취급, is 사용"}]}, {"n": 8, "tag": null, "en": "There were a beach cleanup party today, and I took part in it. Cleaning up the beach was not easily, but I enjoyed it.", "ko": "오늘 해변 청소 모임이 있었고, 나는 그 모임에 참가했다. 해변을 청소하는 일이 쉽지는 않았지만 즐거웠다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [1], "point": "be동사의 수일치: a beach cleanup party는 단수: were가 아니라 was", "topic": "be동사의 수일치", "memo": "a beach cleanup party는 단수: were가 아니라 was"}, {"wrong": "easily", "right": "easy", "partial": false, "at": [19], "point": "형용사와 부사: be동사 뒤 보어 자리에는 형용사 easy 사용", "topic": "형용사와 부사", "memo": "be동사 뒤 보어 자리에는 형용사 easy 사용"}]}, {"n": 9, "tag": null, "en": "Oh, I saw Aunt Sumi there. Her is also a member of Dolphin Lovers.", "ko": "아, 그곳에서 나는 수미  0], ["She is also a member of Dolphin Lovers.", "그녀도 Dolphin Lovers 회원이다.", 0], ["What a small world!", "세상이 참 좁다!", 0], ["FEB 14", "2월 14일", 1], ["This afternoon, I took part in a training class for Halla and Olle, two dolphins in an aquarium in Jeju-do.", "오늘 오후에 나는 제주도의 한 수족관에 있는 돌고래 두 마리, 한라와 올레의 훈련 수업에 참여했다.", 1], ["The latest project of Dolphin Lovers is to return them to the sea.", "Dolphin Lovers의 최근 프로젝트는 그들을 바다로 돌려보내는 것이다.", 0], ["For this, Halla and Olle first need to learn some skills.", "이를 위해 한라와 올레는 먼저 몇 가지 기술을 배워야 한다.", 0], ["They will need them to survive in the wild.", "그들은 야생에서 살아남기 위해 이 기술들이 필요할 것이다.", 0], ["I really wanted to be part of the project.", "나는 그 프로젝트에 정말 참여하고 싶었다.", 0], ["Luckily, I got the chance.", "다행히 나는 기회를 얻었다.", 0], ["I just ran some errands in the training class today, but the experience made me so excited.", "나는 오늘 훈련 수업에서 그저 몇 가지 심부름을 했을 뿐이지만, 그 경험은 나를 매우 설레게 했다.", 0]];var RNUM=4;var TITLE_EN="Live Freely and Happily Ever After!";var PASS_EN=["Live Freely and Happily Ever After!", "You can work with NGOs as a teenager. It is a great way to learn about social issues and make the world better. Are you interested? Then, read Inho's blog below.", "JAN 5", "I grew up in Jeju-do, so I had many chances to see dolphins. Then, I learned that many dolphins are in danger. Some are even endangered. I thought I should do something. So, I searched the Internet and found an NGO, Dolphin Lovers. It does various activities such as cleaning up beaches and helping dolphins. After some thought, I joined it today.", "JAN 20", "Many dolphins get sick or even die because of plastic waste and fishing nets, so cleaning up beaches is important. There was a beach cleanup party today, and I took part in it. Cleaning up the beach was not easy, but I enjoyed it. Oh, I saw Aunt Sumi there. She is also a member of Dolphin Lovers. What a small world!", "FEB 14", "This afternoon, I took part in a training class for Halla and Olle, two dolphins in an aquarium in Jeju-do. The latest project of Dolphin Lovers is to return them to the sea. For this, Halla and Olle first need to learn some skills. They will need them to survive in the wild. I really wanted to be part of the project. Luckily, I got the chance. I just ran some errands in the training class today, but the experience made me so excited."];var PASS_KO=["자유롭고 행복하게 오래오래 살기를!", "여러분은 십 대 청소년으로서 NGO와 함께 활동할 수 있습니다. 그것은 사회 문제에 대해 배우고 세상을 더 좋게 만드는 좋은 방법입니다. 관심이 있나요? 그렇다면 아래에서 인호의 블로그를 읽어보세요.", "1월 5일", "나는 제주도에서 자라서 돌고래를 볼 기회가 많았다. 그러다 많은 돌고래들이 위험에 처해 있다는 것을 알았다. 일부는 심지어 멸종 위기에 처해 있다. 나는 무언가 해야겠다고 생각했다. 그래서 인터넷을 검색하다가 NGO인 Dolphin Lovers를 찾았다. 이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다. 고민 끝에, 나는 오늘 이곳에 가입했다.", "1월 20일", "많은 돌고래들이 플라스틱 쓰레기와 어망 때문에 병에 걸리거나 심지어 죽기도 하므로 해변을 청소하는 것은 중요하다. 오늘 해변 청소 모임이 있었고, 나는 그 모임에 참가했다. 해변을 청소하는 일이 쉽지는 않았지만 즐거웠다. 아, 그곳에서 나는 수미 이모를 만났다. 그녀도 Dolphin Lovers 회원이다. 세상이 참 좁다!", "2월 14일", "오늘 오후에 나는 제주도의 한 수족관에 있는 돌고래 두 마리, 한라와 올레의 훈련 수업에 참여했다. Dolphin Lovers의 최근 프로젝트는 그들을 바다로 돌려보내는 것이다. 이를 위해 한라와 올레는 먼저 몇 가지 기술을 배워야 한다. 그들은 야생에서 살아남기 위해 이 기술들이 필요할 것이다. 나는 그 프로젝트에 정말 참여하고 싶었다. 다행히 나는 기회를 얻었다. 나는 오늘 훈련 수업에서 그저 몇 가지 심부름을 했을 뿐이지만, 그 경험은 나를 매우 설레게 했다."];
