verlooked animals were once war-time heroes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그의 시신은 박물관에 전시되어 있고, 무시받던 동물들이 한때 전쟁 영웅이었음을 일깨워 준다.","그의 시신은 박물관에 보관되어 있어서 누구도 볼 수 없고, 비둘기는 영웅이 아니었음을 알려 준다.","그의 시신은 전쟁터에 묻혔고, 우리에게 전쟁의 무서움을 일깨워 준다.","그의 시신은 박물관에서 연구되고 있고, 모든 동물이 영웅이 될 수 있음을 알려 준다."],"sko":"그의 시신은 워싱턴 D.C.의 한 역사박물관에 전시되어 있으며, 이는 우리에게 이 무시받던 동물들이 한때 전쟁 영웅이었다는 사실을 상기시켜 준다.","r":{"a":"1) 그의 시신은 박물관에 전시되어 있고, 무시받던 동물들이 한때 전쟁 영웅이었음을 일깨워 준다.","s":[[12,"His body is displayed at a historical museum in Washington, D.C., reminding us that these overlooked animals were once war-time heroes.","그의 시신은 워싱턴 D.C.의 한 역사박물관에 전시되어 있으며, 이는 우리에게 이 무시받던 동물들이 한때 전쟁 영웅이었다는 사실을 상기시켜 준다."]],"w":"is displayed는 ‘전시되어 있다’, reminding us that은 ‘우리에게 ~을 상기시켜 준다’. 무시받던(overlooked) 동물들이 한때 전쟁 영웅이었다는 뜻. 나머지는 전시·영웅이라는 내용과 어긋남.","c":1,"ev":"12번 문장"},"h":"3563df0c3d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["Cher Ami was a dog that helped the U.S. Army.","Cher Ami was famous for his beautiful singing.","The name Cher Ami means “dear friend” in French.","Cher Ami was a soldier who fought in the war."],"oko":["Cher Ami는 미 육군을 도운 개였다.","Cher Ami는 아름다운 노래 실력으로 유명했다.","Cher Ami라는 이름은 프랑스어로 ‘친애하는 친구’를 뜻한다.","Cher Ami는 전쟁에서 싸운 군인이었다."],"r":{"a":"3) The name Cher Ami means “dear friend” in French. (Cher Ami라는 이름은 프랑스어로 ‘친애하는 친구’를 뜻한다.)","s":[[3,"One remarkable pigeon, Cher Ami — whose name means “dear friend” in French — became famous for his incredible bravery.","프랑스어로 ‘친애하는 친구’를 뜻하는 이름을 가진 한 특별한 비둘기 Cher Ami는 놀라운 용맹함으로 유명해졌다."]],"w":"3번 문장에서 Cher Ami는 비둘기이고, 그 이름이 프랑스어로 ‘친애하는 친구’라는 뜻이라고 함. 개, 노래, 군인 이야기는 본문에 없음.","c":3,"ev":"3번 문장"},"h":"6b2255b827"},{"n":9,"t":"sum","q":"The troops were out of (A) range, so they had no way to (B) for help.","ko":"병사들은 (A) 범위 밖에 있어서 도움을 (B) 방법이 없었다.","opts":["(A) music / (B) call","(A) radio / (B) hide","(A) radio / (B) call","(A) music / (B) hide","(A) radio / (B) forget"],"oko":["(A) 음악 / (B) 요청할","(A) 무전 / (B) 숨길","(A) 무전 / (B) 요청할","(A) 음악 / (B) 숨길","(A) 무전 / (B) 잊을"],"r":{"a":"3) (A) radio / (B) call ((A) 무전 / (B) 요청할)","s":[[7,"Under heavy fire and out of radio range, they had no way to call for help.","심한 폭격을 받으며 무전 통신 범위 밖에 있어, 그들은 도움을 요청할 방법이 없었다."]],"w":"7번 문장에서 병사들은 무전 통신 범위(radio range) 밖에 있어 도움을 요청할(call for help) 방법이 없었다고 함. 음악 범위, 숨기다, 잊다는 본문과 맞지 않음.","c":3,"ev":"7번 문장"},"h":"c5c46d5025"},{"n":10,"t":"fill","q":"When other methods [A], these birds [B] life-saving messages.","ko":"다른 방법들이 [A]. 그럴 때 이 새들은 생명을 구하는 메시지를 [B].","bko":{"failed":"실패했다","carried":"운반했다","awarded":"수여했다","trapped":"가두었다","trained":"훈련시켰다","pleaded":"간청했다"},"bank":["failed","carried","awarded","trapped","trained","pleaded"],"r":{"a":"[A] failed (실패했다), [B] carried (운반했다)","s":[[2,"When other methods failed, these birds carried life-saving messages.","다른 방법들이 실패했을 때, 이 새들은 생명을 구하는 메시지를 전달했다."]],"w":"2번 문장에서 다른 방법들이 실패했을(failed) 때 이 새들이 생명을 구하는 메시지를 운반했다(carried)고 함. 나머지 단어는 이 두 자리에 문법과 뜻이 모두 맞지 않음.","c":null,"ev":"2번 문장"},"h":"8cdcb1ab9e"}]},{"u":8,"id":"rg6-08-2","no":2,"ko":"일할 때 이것도 중요해요","items":[{"n":1,"t":"tf","q":"Steffen Krutzinna is an energy trader from Germany.","ko":"Steffen Krutzinna는 독일 출신의 에너지 무역업자이다.","r":{"a":"T (본문과 맞는 내용)","s":[[4,"One example is Steffen Krutzinna, an energy trader from Germany.","한 예로, 독일의 에너지 무역업자 Steffen Krutzinna가 있다."]],"w":"4번 문장에 an energy trader from Germany라고 나옴.","c":"T","ev":"4번 문장"},"h":"999be26305"},{"n":2,"t":"tf","q":"Climate quitters are people who leave their jobs mainly for higher salaries.","ko":"기후 퇴사자는 주로 더 높은 급여를 위해 직장을 떠나는 사람들이다.","r":{"a":"F (본문과 다른 내용)","s":[[2,"However, \b a growing number of workers are resigning because their companies fail to take environmental issues seriously.","그러나, 점점 더 많은 근로자들이 회사가 환경 문제를 심각하게 받아들이지 않아서 사직하고 있다."],[3,"These individuals are called “climate quitters.”","이런 사람들은 ‘기후 퇴사자’라고 불린다."]],"w":"급여는 사람들이 보통 이직하는 이유(1번)이고, 기후 퇴사자는 회사가 환경 문제를 심각하게 받아들이지 않아 사직하는 사람들(2~3번)임.","c":"F","ev":"2~3번 문장"},"h":"2f823e2b3e"},{"n":3,"t":"tf","q":"In a UK survey, 35% of employees said they were willing to quit if their company lacked strong green policies.","ko":"영국의 한 설문조사에서 근로자의 35%가 회사에 강력한 친환경 정책이 없다면 그만둘 의향이 있다고 했다.","r":{"a":"T (본문과 맞는 내용)","s":[[8,"A survey in the UK found that 35% of employees were willing to quit their jobs if their company lacked strong green policies.","영국의 한 설문조사는 근로자의 35%가 자신의 회사에 강력한 친환경 정책이 없다면 직장을 그만둘 의향이 있다는 것을 밝혀냈다."]],"w":"8번 문장에 35% of employees were willing to quit their jobs if their company lacked strong green policies가 나옴.","c":"T","ev":"8번 문장"},"h":"04a601d539"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Shell abandoned its climate goals to cut oil production.)","ko":"Shell이 석유 생산량을 줄이려는 기후 목표를 ( ).","opts":["포기했다","이루었다","발표했다","시작했다"],"word":"abandoned","r":{"a":"1) 포기했다","s":[[5,"When Shell, his company’s parent company, abandoned its climate goals to cut oil production, he decided to leave immediately.","그의 회사의 모회사인 Shell이 석유 생산량을 줄이려는 기후 목표를 포기했을 때, 그는 즉시 회사를 떠나기로 결정했다."]],"w":"5번 문장 뒤에서 그가 곧바로 회사를 떠나기로 했으니 Shell이 한 일은 목표를 ‘포기한’ 것. 목표를 이루었다면 그가 떠날 이유가 없음.","c":1,"ev":"5번 문장"},"h":"7b40f73e0b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Businesses may need to adapt by integrating sustainable practices.)","ko":"기업들은 지속 가능한 관행을 도입함으로써 ( ) 필요가 있을지도 모른다.","opts":["폐업할","거부할","적응할, 대응할","광고할"],"word":"adapt","r":{"a":"3) 적응할, 대응할","s":[[14,"As this movement continues, businesses may need to adapt by integrating sustainable practices in order to attract and retain skilled workers.","이러한 움직임이 계속됨에 따라, 기업들은 능력 있는 근로자를 끌어들이고 유지하기 위해 지속 가능한 관행들을 도입함으로써 대응할 필요가 있을지도 모른다."]],"w":"14번 문장에서 기후 퇴사자가 늘어나는 흐름에 맞춰 지속 가능한 관행을 도입한다고 했으니 adapt는 변화에 맞춰 적응하다(대응하다). 폐업이나 거부는 이 문맥과 반대.","c":3,"ev":"14번 문장"},"h":"b3ec3c47d4"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nOn the other hand, some experts believe that quitting isn’t the only option. They advise that staying and pushing their companies to commit to climate efforts can yield greater benefits.","ko":"밑줄 친 They가 가리키는 것은?","opts":["기후 퇴사자들","일부 전문가들","영국의 직원들","Z세대 근로자들"],"sko":"그들은 회사에 남아 자신의 회사가 기후 대응 노력에 헌신하도록 압박하는 것이 직원과 회사 모두에게 더 큰 이익을 가져올 수 있다고 조언한다.","r":{"a":"2) 일부 전문가들","s":[[11,"On the other hand, some experts believe that quitting isn’t the only option.","반면에, 일부 전문가들은 퇴사가 유일한 선택지가 아니라고 생각한다."],[12,"They advise that staying and pushing their companies to commit to climate efforts can yield greater benefits for both employees and companies.","그들은 회사에 남아 자신의 회사가 기후 대응 노력에 헌신하도록 압박하는 것이 직원과 회사 모두에게 더 큰 이익을 가져올 수 있다고 조언한다."]],"w":"11번에서 일부 전문가들(some experts)이 퇴사가 유일한 선택지가 아니라고 생각하고, 12번의 They advise는 그 전문가들이 조언한다는 뜻.","c":2,"ev":"11~12번 문장"},"h":"edba58683b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He believed that working for a company that did not share his environmental values was no longer an option.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["그는 환경적 가치를 공유하는 회사에서만 일해야 한다고 후회했다.","그는 자신이 일하는 회사가 환경적 가치를 공유한다고 믿었다.","그는 환경적 가치가 없는 회사에서도 계속 일할 수 있다고 생각했다.","그는 자신의 환경적 가치를 공유하지 않는 회사에서 일하는 것은 이제 선택지가 될 수 없다고 생각했다."],"sko":"그는 자신의 환경적 가치를 공유하지 않는 회사에서 일하는 것이 더 이상 선택지가 아니라고 생각했다.","r":{"a":"4) 그는 자신의 환경적 가치를 공유하지 않는 회사에서 일하는 것은 이제 선택지가 될 수 없다고 생각했다.","s":[[6,"He believed that working for a company that did not share his environmental values was no longer an option.","그는 자신의 환경적 가치를 공유하지 않는 회사에서 일하는 것이 더 이상 선택지가 아니라고 생각했다."]],"w":"was no longer an option은 ‘더 이상 선택지가 아니다’. 자기와 환경적 가치가 다른 회사에서 일하는 것을 이제 선택하지 않겠다는 뜻이라 5번의 즉시 퇴사 결정으로 이어짐.","c":4,"ev":"6번 문장"},"h":"dd96265267"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["Steffen Krutzinna left his company because he wanted a higher salary.","Employees tend to be more satisfied in companies that prioritize sustainable practices.","Most experts believe that quitting is the only option.","The UK survey found that only 3% of employees would quit."],"oko":["Steffen Krutzinna는 더 높은 급여를 원해서 회사를 떠났다.","직원들은 지속 가능한 관행을 우선시하는 회사에서 더 만족하는 경향이 있다.","대부분의 전문가들은 퇴사가 유일한 선택지라고 믿는다.","영국 설문조사에서는 직원의 3%만이 그만둘 것이라고 했다."],"r":{"a":"2) Employees tend to be more satisfied in companies that prioritize sustainable practices.","s":[[5,"When Shell, his company’s parent company, abandoned its climate goals to cut oil production, he decided to leave immediately.","그의 회사의 모회사인 Shell이 석유 생산량을 줄이려는 기후 목표를 포기했을 때, 그는 즉시 회사를 떠나기로 결정했다."],[6,"He believed that working for a company that did not share his environmental values was no longer an option.","그는 자신의 환경적 가치를 공유하지 않는 회사에서 일하는 것이 더 이상 선택지가 아니라고 생각했다."],[8,"A survey in the UK found that 35% of employees were willing to quit their jobs if their company lacked strong green policies.","영국의 한 설문조사는 근로자의 35%가 자신의 회사에 강력한 친환경 정책이 없다면 직장을 그만둘 의향이 있다는 것을 밝혀냈다."],[10,"A related finding was that employees tend to be more satisfied and have higher retention rates in companies that prioritize sustainable practices.","이와 관련된 또 다른 조사 결과는 지속 가능한 관행을 우선시하는 회사에서 직원들이 더 만족하는 경향이 있고 근속률이 더 높다는 것이다."],[11,"On the other hand, some experts believe that quitting isn’t the only option.","반면에, 일부 전문가들은 퇴사가 유일한 선택지가 아니라고 생각한다."]],"w":"10번 문장에서 지속 가능한 관행을 우선시하는 회사의 직원들이 더 만족함. Krutzinna는 급여가 아니라 환경적 가치 때문에 떠났고(5~6번), 전문가들은 퇴사가 유일한 선택지가 아니라고 했으며(11번), 조사에서는 35%가 그만둘 의향이 있었음(8번).","c":2,"ev":"5~6번, 8번, 10~11번 문장"},"h":"1edbcb53c2"},{"n":9,"t":"sum","q":"The rise of climate quitters shows the growing (A) of climate concerns in (B) decisions.","ko":"기후 퇴사자의 증가는 (B) 의사결정에서 기후 문제가 갖는 점점 더 커지는 (A)을(를) 보여 준다.","opts":["(A) role / (B) workplace","(A) role / (B) weather","(A) cost / (B) workplace","(A) cost / (B) weather","(A) role / (B) holiday"],"oko":["(A) 역할 / (B) 직장","(A) 역할 / (B) 날씨","(A) 비용 / (B) 직장","(A) 비용 / (B) 날씨","(A) 역할 / (B) 휴가"],"r":{"a":"1) (A) role / (B) workplace ((A) 역할 / (B) 직장)","s":[[13,"The rise of climate quitters shows the growing role of climate concerns in workplace decisions.","기후 퇴사자의 증가는 직장 내 의사결정에서 기후 문제가 점점 더 큰 역할을 하고 있다는 것을 보여준다."]],"w":"13번 문장에서 기후 퇴사자의 증가는 직장 내(workplace) 의사결정에서 기후 문제의 역할(role)이 커지고 있음을 보여 준다고 함. 비용, 날씨, 휴가는 본문에 없음.","c":1,"ev":"13번 문장"},"h":"e81be61599"},{"n":10,"t":"fill","q":"Recent studies [A] that this trend is rising as public [B] of climate issues grows.","ko":"최근 연구는 기후 문제에 대한 대중의 [B]이(가) 높아짐에 따라 이러한 추세가 증가하고 있다고 [A].","bko":{"indicate":"나타낸다","awareness":"인식","salary":"급여","policies":"정책들","benefits":"이익들","workers":"근로자들"},"bank":["indicate","awareness","salary","policies","benefits","workers"],"r":{"a":"[A] indicate (나타낸다), [B] awareness (인식)","s":[[7,"Recent studies indicate that this trend is rising as public awareness of climate issues grows.","최근 연구는 기후 문제에 대한 대중의 인식이 높아짐에 따라 이러한 추세가 증가하고 있다는 것을 보여준다."]],"w":"7번 문장에서 최근 연구가 이 추세가 증가하고 있음을 나타내고(indicate), 대중의 인식(awareness)이 높아질수록 늘어난다고 함. 나머지 명사는 [A] 동사 자리에도, “대중의 ___이 높아진다”는 [B] 자리에도 맞지 않음.","c":null,"ev":"7번 문장"},"h":"232dbde88f"}]},{"u":8,"id":"rg6-08-3","no":3,"ko":"SOS는 원래 무슨 뜻일까?","items":[{"n":1,"t":"tf","q":"SOS was chosen in 1906 because it is easy to recognize in Morse code.","ko":"SOS는 모스 부호에서 알아보기 쉬워서 1906년에 선택되었다.","r":{"a":"T (본문과 맞는 내용)","s":[[4,"Back in 1906, SOS was chosen because it’s easy to recognize in Morse code: three dots (···), three dashes (–––), and three dots (···) again.","1906년으로 거슬러 가면, SOS는 모스 부호에서 알아보기 쉽기 때문에 선택되었는데, 그것은 바로 점 3개(···), 대시 3개(–––), 그리고 다시 점 3개(···)이다."]],"w":"4번 문장에 SOS was chosen because it’s easy to recognize in Morse code가 나옴.","c":"T","ev":"4번 문장"},"h":"54155ccb93"},{"n":2,"t":"tf","q":"SOS stands for “Save Our Ship.”","ko":"SOS는 ‘Save Our Ship’을 뜻한다.","r":{"a":"F (본문과 다른 내용)","s":[[3,"Many believe it means “Save Our Ship” or “Save Our Souls,” but in fact, it doesn’t stand for anything!","많은 사람들은 그것이 ‘Save Our Ship(우리의 배를 구하라)’ 또는 ‘Save Our Souls(우리의 영혼을 구하라)’를 의미한다고 믿지만, 사실은, 그것은 아무것도 의미하지 않는다!"]],"w":"3번 문장에서 많은 사람들이 그렇게 믿지만, 사실은 SOS는 아무것도 의미하지 않는다고 함.","c":"F","ev":"3번 문장"},"h":"b2bd9bb4c5"},{"n":3,"t":"tf","q":"The British used “CQD,” which meant “Come Quickly, Distress.”","ko":"영국은 ‘Come Quickly, Distress’를 뜻하는 ‘CQD’를 사용했다.","r":{"a":"T (본문과 맞는 내용)","s":[[6,"The British used “CQD,” which meant “Come Quickly, Distress.”","영국은 ‘CQD’를 사용했는데, 그것은 ‘즉시 와라, 조난 상황이다.’라는 뜻이었다."]],"w":"6번 문장에 The British used “CQD,” which meant “Come Quickly, Distress.”가 그대로 나옴.","c":"T","ev":"6번 문장"},"h":"ea94db05f7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These signals often caused confusion and delay.)","ko":"이 신호들은 종종 ( )과 지연을 일으켰다.","opts":["평화","혼란","기쁨","속도"],"word":"confusion","r":{"a":"2) 혼란","s":[[8,"These signals often caused confusion and delay because they were all different and required pauses between letters.","이러한 신호들은 다 다르고 글자 사이에 멈춤이 필요했기 때문에 종종 혼란과 지연을 초래했다."]],"w":"8번 문장은 나라마다 신호가 달라 생기는 문제를 말함. 뒤의 delay(지연)처럼 나쁜 결과이므로 confusion은 혼란. 평화, 기쁨, 속도는 좋은 결과라 맞지 않음.","c":2,"ev":"8번 문장"},"h":"df4fd41225"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The clear message allowed rescue ships to locate and save passengers effectively.)","ko":"그 명확한 메시지는 구조선들이 승객들의 위치를 ( ) 구조할 수 있게 했다.","opts":["숨기고","만들고","바꾸고","찾아내고"],"word":"locate","r":{"a":"4) 찾아내고","s":[[11,"The clear message allowed rescue ships to locate and save passengers effectively.","그 명확한 메시지는 구조선들이 효과적으로 승객들의 위치를 찾고 구조할 수 있게 했다."]],"w":"11번 문장에서 구조선이 승객을 구하려면 먼저 어디 있는지 알아야 함. locate는 위치를 찾아내다. 숨기거나 바꾸는 일은 구조와 맞지 않음.","c":4,"ev":"11번 문장"},"h":"fc8612f452"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nOver time, SOS became more than a code — it became a symbol of an urgent need for help.","ko":"밑줄 친 it이 가리키는 것은?","opts":["SOS","타이타닉호","모스 부호의 점","구조선"],"sko":"시간이 지나면서, SOS는 단순한 코드 이상이 되었고, 그것은 긴급한 구조 요청의 상징이 되었다.","r":{"a":"1) SOS","s":[[14,"Over time, SOS became more than a code — it became a symbol of an urgent need for help.","시간이 지나면서, SOS는 단순한 코드 이상이 되었고, 그것은 긴급한 구조 요청의 상징이 되었다."]],"w":"14번 문장은 SOS became more than a code(SOS는 코드 이상이 되었다)로 시작하고, 뒤의 it은 같은 주어인 SOS를 다시 가리킴. 타이타닉호나 구조선은 이 문장의 주어가 아님.","c":1,"ev":"14번 문장"},"h":"2f15bb21c8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Although help arrived too late to save many lives, the tragedy made SOS universally famous as the call for help.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["도움이 제때 도착해서 많은 생명을 구했고, 그 덕분에 SOS가 유명해졌다.","도움이 늦게 도착해서 사람들이 SOS를 더 이상 쓰지 않게 되었다.","도움이 너무 늦게 도착해서 많은 생명을 구하지 못했지만, 그 비극은 SOS를 구조 요청 신호로 전 세계에 유명하게 만들었다.","도움이 일찍 도착했지만 사람들이 SOS를 알아보지 못했다."],"sko":"비록 구조가 너무 늦게 도착하여 많은 생명을 구할 수 없었지만, 그 비극은 SOS를 구조 요청 신호로서 전 세계적으로 유명하게 만들었다.","r":{"a":"3) 도움이 너무 늦게 도착해서 많은 생명을 구하지 못했지만, 그 비극은 SOS를 구조 요청 신호로 전 세계에 유명하게 만들었다.","s":[[13,"Although help arrived too late to save many lives, the tragedy made SOS universally famous as the call for help.","비록 구조가 너무 늦게 도착하여 많은 생명을 구할 수 없었지만, 그 비극은 SOS를 구조 요청 신호로서 전 세계적으로 유명하게 만들었다."]],"w":"Although는 ‘~이지만’으로 앞뒤를 대비함. 구조가 너무 늦어 많은 생명을 구하지 못한 비극(앞)과 그런데도 SOS가 전 세계에 유명해졌다(뒤)는 뜻.","c":3,"ev":"13번 문장"},"h":"df1f9242df"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["Before SOS, all countries used the same emergency code.","SOS was first created for airplanes in the 1990s.","The Titanic used only “CQD” when it sank.","The first official use of SOS was in 1909 by the ship RMS Slavonia."],"oko":["SOS 이전에 모든 나라는 같은 비상 코드를 사용했다.","SOS는 1990년대에 비행기를 위해 처음 만들어졌다.","타이타닉호는 침몰할 때 ‘CQD’만 사용했다.","SOS의 첫 공식 사용은 1909년 RMS 슬라브니아호에 의해서였다."],"r":{"a":"4) The first official use of SOS was in 1909 by the ship RMS Slavonia. (SOS의 첫 공식 사용은 1909년 RMS 슬라브니아호에 의해서였다.)","s":[[5,"Before SOS became the international emergency signal, countries used their own codes.","SOS가 국제적인 비상 신호가 되기 전에는, 각 나라가 자신들만의 코드를 사용했다."],[10,"The first official use of SOS was in 1909, when the ship RMS Slavonia sent the signal after hitting rocks near the Azores.","SOS의 첫 공식적인 사용은 1909년이었는데, RMS 슬라브니아호가 아조레스 제도 근처에서 암초에 부딪힌 후 신호를 보낸 때였다."],[12,"A few years later, the Titanic used both “SOS” and “CQD” during its sinking in 1912.","몇 년 뒤, 타이타닉호는 1912년에 침몰하던 중 ‘SOS’와 ‘CQD’를 모두 사용했다."]],"w":"10번 문장에서 SOS의 첫 공식 사용은 1909년 RMS 슬라브니아호임. SOS 이전에는 나라마다 코드가 달랐고(5번), SOS는 1909년에 처음 공식 사용되었으며 1990년대 비행기용이 아니고(10번), 타이타닉호는 SOS와 CQD를 모두 썼음(12번).","c":4,"ev":"5번, 10번, 12번 문장"},"h":"00f5c8554e"},{"n":9,"t":"sum","q":"Experts created SOS, a (A) and (B) universal signal.","ko":"전문가들은 (A) 그리고 (B) 국제 공통 신호인 SOS를 만들었다.","opts":["(A) slow / (B) simple","(A) fast / (B) complicated","(A) fast / (B) simple","(A) slow / (B) complicated","(A) expensive / (B) simple"],"oko":["(A) 느린 / (B) 간단한","(A) 빠른 / (B) 복잡한","(A) 빠른 / (B) 간단한","(A) 느린 / (B) 복잡한","(A) 비싼 / (B) 간단한"],"r":{"a":"3) (A) fast / (B) simple ((A) 빠른 / (B) 간단한)","s":[[9,"To fix this, experts created SOS — a fast and simple universal signal.","이것을 해결하기 위해, 전문가들은 빠르고 간단한 국제 공통 신호인 SOS를 만들었다."]],"w":"9번 문장에서 전문가들이 빠르고(fast) 간단한(simple) 국제 공통 신호인 SOS를 만들었다고 함. 느린, 복잡한, 비싼은 본문과 반대이거나 없는 말임.","c":3,"ev":"9번 문장"},"h":"74ab8cd5f9"},{"n":10,"t":"fill","q":"Today, SOS is [A] recognized no matter how it is sent — through radio waves, messages in the sand, or signals of [B].","ko":"오늘날, SOS는 전파로, 모래 위의 메시지로, 또는 [B]의 신호로 — 어떤 방법으로 보내져도 [A] 인식된다.","bko":{"instantly":"즉시","light":"빛","sand":"모래","rocks":"암초","pauses":"멈춤","passengers":"승객들"},"bank":["instantly","light","sand","rocks","pauses","passengers"],"r":{"a":"[A] instantly (즉시), [B] light (빛)","s":[[15,"Today, SOS is instantly recognized no matter how it is sent — through radio waves, messages in the sand, or signals of light.","오늘날, SOS는 어떤 방법으로 보내져도 — 전파로, 모래 위의 메시지로, 또는 빛의 신호로 — 즉시 인식된다."]],"w":"15번 문장에서 SOS는 전파나 빛(light)의 신호처럼 어떤 방법으로 보내져도 즉시(instantly) 인식된다고 함. [A]는 recognized 앞의 부사 자리, [B]는 signals of 뒤의 명사 자리라 나머지 명사들은 맞지 않음.","c":null,"ev":"15번 문장"},"h":"888a468822"}]},{"u":9,"id":"rg6-09-1","no":1,"ko":"못생기면 유죄라고?","items":[{"n":1,"t":"tf","q":"San Francisco passed the ‘ugly laws’ in 1867.","ko":"샌프란시스코는 1867년에 ‘어글리 법’을 통과시켰다.","r":{"a":"T (본문과 맞는 내용)","s":[[2,"In 1867, San Francisco passed some unusual and cruel laws known as the ‘ugly laws.’","1867년에 샌프란시스코는 ‘어글리 법(ugly laws)’으로 알려진 특이하고 잔인한 법을 통과시켰다."]],"w":"2번 문장에 In 1867, San Francisco passed some unusual and cruel laws known as the ‘ugly laws.’가 나옴.","c":"T","ev":"2번 문장"},"h":"0cf3b21ecf"},{"n":2,"t":"tf","q":"The ugly laws allowed people with visible differences to appear freely in public.","ko":"어글리 법은 눈에 보이는 차이가 있는 사람들이 공공장소에 자유롭게 나타나도록 허용했다.","r":{"a":"F (본문과 다른 내용)","s":[[3,"These laws banned people who were considered ‘unpleasant to look at’ from appearing in public.","이 법들은 ‘보기에 불쾌하다’고 여겨지는 사람들이 공공장소에 나타나는 것을 금지했다."]],"w":"3번 문장에서 어글리 법은 ‘보기에 불쾌하다’고 여겨지는 사람들이 공공장소에 나타나는 것을 금지(banned)했음.","c":"F","ev":"3번 문장"},"h":"eb60f58345"},{"n":3,"t":"tf","q":"The ugly laws remained in effect for nearly 100 years.","ko":"어글리 법은 거의 100년 동안 시행되었다.","r":{"a":"T (본문과 맞는 내용)","s":[[11,"Tragically, these laws remained in effect for nearly 100 years.","비극적이게도, 이 법들은 거의 100년 동안 시행되었다."]],"w":"11번 문장에 these laws remained in effect for nearly 100 years가 나옴.","c":"T","ev":"11번 문장"},"h":"79d48bab3a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (San Francisco passed some unusual and cruel laws.)","ko":"샌프란시스코는 특이하고 ( ) 법들을 통과시켰다.","opts":["공정한","친절한","흥미로운","잔인한"],"word":"cruel","r":{"a":"4) 잔인한","s":[[2,"In 1867, San Francisco passed some unusual and cruel laws known as the ‘ugly laws.’","1867년에 샌프란시스코는 ‘어글리 법(ugly laws)’으로 알려진 특이하고 잔인한 법을 통과시켰다."]],"w":"2번 문장의 laws는 ‘어글리 법’이고, 3번에서 보기에 불쾌한 사람의 공공장소 출입을 금지했음. 사람을 힘들게 하는 법이라 cruel은 잔인한. 공정하거나 친절한 법이 아님.","c":4,"ev":"2번 문장"},"h":"66c799da8a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The activists’ persistent fight for justice led to the Americans with Disabilities Act.)","ko":"운동가들의 ( ) 정의를 위한 투쟁은 미국 장애인법으로 이어졌다.","opts":["짧은","끈질긴","조용한","쉬운"],"word":"persistent","r":{"a":"2) 끈질긴","s":[[14,"The activists’ persistent fight for justice led to the Americans with Disabilities Act in 1990, a law that protects the rights of people with disabilities.","운동가들의 정의를 위한 끈질긴 투쟁은 1990년에 장애인의 권리를 보호하는 법인 미국 장애인법(ADA)의 제정으로 이어졌다."]],"w":"14번 문장의 persistent fight for justice는 정의를 위해 포기하지 않고 계속한 투쟁이고, 그 투쟁이 끝내 1990년 장애인법 제정으로 이어졌음. 짧거나 쉬운 싸움이라면 ‘끈질긴’이라는 말이 어울리지 않음.","c":2,"ev":"14번 문장"},"h":"9c5be1ae37"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nThis shameful chapter in history later became a powerful example for disability rights activists. It was used to highlight the unfair discrimination faced by people with disabilities.","ko":"밑줄 친 It이 가리키는 것은?","opts":["샌프란시스코","미국 장애인법","어글리 법의 부끄러운 역사","시 공무원들"],"sko":"그것은 장애인들이 겪는 부당한 차별을 강조하는 데 사용되었다.","r":{"a":"3) 어글리 법의 부끄러운 역사","s":[[12,"This shameful chapter in history later became a powerful example for disability rights activists.","이 부끄러운 역사의 장은 훗날 장애인 인권 운동가들에게 강력한 사례가 되었다."],[13,"It was used to highlight the unfair discrimination faced by people with disabilities.","그것은 장애인들이 겪는 부당한 차별을 강조하는 데 사용되었다."]],"w":"12번에서 장애인 인권 운동가들에게 강력한 사례가 된 것은 This shameful chapter in history(부끄러운 역사의 장). 13번의 It은 그 역사가 차별을 강조하는 데 쓰였다는 뜻. 장애인법은 14번에서 나중에 나옴.","c":3,"ev":"12~13번 문장"},"h":"da0f772036"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The ugly laws were based on the belief that people with visible differences somehow damaged the city’s image.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["어글리 법은 눈에 보이는 차이가 있는 사람들이 어떤 식으로든 도시의 이미지를 훼손한다는 믿음에 근거했다.","어글리 법은 도시의 이미지를 개선하기 위해 장애인들을 돕겠다는 목적으로 만들어졌다.","어글리 법은 눈에 보이는 차이가 있는 사람들이 도시를 아름답게 만든다는 믿음에서 생겼다.","어글리 법은 도시의 이미지가 훼손되어서 사람들의 외모가 달라졌다는 믿음에 근거했다."],"sko":"어글리 법은 겉모습이 다른 사람들이 어떤 점에서는 도시의 이미지를 훼손한다는 믿음에 근거했다.","r":{"a":"1) 어글리 법은 눈에 보이는 차이가 있는 사람들이 어떤 식으로든 도시의 이미지를 훼손한다는 믿음에 근거했다.","s":[[7,"The ugly laws were based on the belief that people with visible differences somehow damaged the city’s image.","어글리 법은 겉모습이 다른 사람들이 어떤 점에서는 도시의 이미지를 훼손한다는 믿음에 근거했다."]],"w":"the belief that 이하가 믿음의 내용: 겉모습이 다른 사람들이 도시 이미지를 해친다. 그래서 그들을 공공장소에서 금지한 것. 장애인을 돕거나 도시를 아름답게 한다는 내용이 아님.","c":1,"ev":"7번 문장"},"h":"973984f282"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["The ugly laws were used only in San Francisco and never spread elsewhere.","Many people affected by the ugly laws lost their jobs and their means of financial support.","The ugly laws ended within a few years after 1867.","The Americans with Disabilities Act was passed in 1867."],"oko":["어글리 법은 샌프란시스코에서만 쓰였고 다른 곳으로 퍼지지 않았다.","어글리 법의 영향을 받은 많은 사람들이 일자리와 생계 수단을 잃었다.","어글리 법은 1867년 이후 몇 년 안에 끝났다.","미국 장애인법은 1867년에 통과되었다."],"r":{"a":"2) Many people affected by the ugly laws lost their jobs and their means of financial support.","s":[[2,"In 1867, San Francisco passed some unusual and cruel laws known as the ‘ugly laws.’","1867년에 샌프란시스코는 ‘어글리 법(ugly laws)’으로 알려진 특이하고 잔인한 법을 통과시켰다."],[4,"Similar laws soon spread to other major cities, targeting individuals with visible disabilities or illnesses.","비슷한 법들이 곧 다른 주요 도시로 퍼져나갔고, 그것은 눈에 보이는 장애나 질병이 있는 사람들을 겨냥했다."],[9,"They had to face severe social isolation, often losing their jobs and their means of financial support.","그들은 심각한 사회적 고립을 겪어야 했고, 종종 일자리와 생계 수단을 잃었다."],[11,"Tragically, these laws remained in effect for nearly 100 years.","비극적이게도, 이 법들은 거의 100년 동안 시행되었다."],[14,"The activists’ persistent fight for justice led to the Americans with Disabilities Act in 1990, a law that protects the rights of people with disabilities.","운동가들의 정의를 위한 끈질긴 투쟁은 1990년에 장애인의 권리를 보호하는 법인 미국 장애인법(ADA)의 제정으로 이어졌다."]],"w":"9번 문장에서 영향을 받은 사람들이 종종 일자리와 생계 수단을 잃었다고 함. 법은 다른 도시로 퍼졌고(4번), 거의 100년 시행되었으며(11번), 장애인법은 1990년에 제정되었음(14번).","c":2,"ev":"2번, 4번, 9번, 11번, 14번 문장"},"h":"5d1052fb12"},{"n":9,"t":"sum","q":"Maintaining (A) and preserving a pleasing urban environment became a (B) for city officials.","ko":"(A)을(를) 유지하고 쾌적한 도시 환경을 보존하는 것이 시 공무원들의 (B)이(가) 되었다.","opts":["(A) order / (B) priority","(A) order / (B) problem","(A) chaos / (B) priority","(A) chaos / (B) problem","(A) noise / (B) secret"],"oko":["(A) 질서 / (B) 우선순위","(A) 질서 / (B) 문제","(A) 혼란 / (B) 우선순위","(A) 혼란 / (B) 문제","(A) 소음 / (B) 비밀"],"r":{"a":"1) (A) order / (B) priority ((A) 질서 / (B) 우선순위)","s":[[6,"Maintaining order and preserving a ‘pleasing’ urban environment became a priority for city officials.","질서를 유지하고 ‘쾌적한’ 도시 환경을 보존하는 것이 시(市) 공무원들의 우선순위가 되었다."]],"w":"6번 문장에서 질서(order)를 유지하고 쾌적한 도시 환경을 보존하는 것이 시 공무원들의 우선순위(priority)가 되었다고 함. 혼란·소음·문제·비밀은 본문과 맞지 않음.","c":1,"ev":"6번 문장"},"h":"c1c706f300"},{"n":10,"t":"fill","q":"During this time, American cities experienced rapid [A] and public spaces became increasingly [B].","ko":"이 시기 동안, 미국 도시들은 급속한 [A]을(를) 겪었고 공공장소는 점점 더 [B] 상태가 되었다.","bko":{"growth":"성장","crowded":"혼잡한","protects":"보호한다","provides":"제공한다","preserve":"보존하다","targets":"겨냥한다"},"bank":["growth","crowded","protects","provides","preserve","targets"],"r":{"a":"[A] growth (성장), [B] crowded (혼잡한)","s":[[5,"During this time, American cities experienced rapid growth and public spaces became increasingly crowded.","이 시기 동안, 미국 도시들은 급속한 성장을 겪었고, 공공장소는 점점 더 혼잡해졌다."]],"w":"5번 문장에서 미국 도시들이 급속한 성장(growth)을 겪었고 공공장소가 점점 더 혼잡해졌다(crowded)고 함. 나머지는 동사라서 rapid 뒤 명사 자리와 increasingly 뒤 형용사 자리에 맞지 않음.","c":null,"ev":"5번 문장"},"h":"2f97548acd"}]},{"u":9,"id":"rg6-09-2","no":2,"ko":"한 마리만 키우면 불법","items":[{"n":1,"t":"tf","q":"In 2008, Switzerland passed a law making it illegal to own just one guinea pig.","ko":"2008년에 스위스는 기니피그를 한 마리만 기르는 것을 불법으로 하는 법을 통과시켰다.","r":{"a":"T (본문과 맞는 내용)","s":[[2,"In 2008, the country passed a law making it illegal to own just one guinea pig.","2008년에, 그 나라는 기니피그를 한 마리만 기르는 것을 불법으로 하는 법을 제정했다."]],"w":"2번 문장에 In 2008, the country passed a law making it illegal to own just one guinea pig가 나옴.","c":"T","ev":"2번 문장"},"h":"a289cd79bd"},{"n":2,"t":"tf","q":"Cats in Switzerland are not allowed to be kept alone.","ko":"스위스에서 고양이는 단독으로 길러지는 것이 허용되지 않는다.","r":{"a":"F (본문과 다른 내용)","s":[[8,"Cats, though they are allowed to be kept alone, must still have opportunities to see or socialize with other cats, such as through a window or in shared spaces.","고양이는 비록 단독으로 길러지는 것이 허용되지만, 창문을 통해서나 공동 공간에서처럼 다른 고양이들을 보거나 어울릴 기회가 여전히 있어야 한다."]],"w":"8번 문장에서 고양이는 단독으로 길러지는 것이 허용된다(allowed to be kept alone)고 함. 다만 다른 고양이를 볼 기회가 필요함.","c":"F","ev":"8번 문장"},"h":"9c0415bc9f"},{"n":3,"t":"tf","q":"Dog owners must let their dogs have regular contact with humans and other dogs.","ko":"강아지 주인은 강아지가 사람이나 다른 강아지들과 정기적으로 접촉하게 해야 한다.","r":{"a":"T (본문과 맞는 내용)","s":[[9,"Dog owners are also required to let their dogs have regular contact with humans and fellow dogs.","강아지 주인들은 또한 그들의 강아지가 사람이나 친구 강아지들과 정기적으로 접촉하도록 하는 것이 요구된다."]],"w":"9번 문장에 Dog owners are also required to let their dogs have regular contact with humans and fellow dogs가 나옴.","c":"T","ev":"9번 문장"},"h":"d72264f3a9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Without companions to interact with, they would suffer from stress and depression.)","ko":"( ) 친구가 없다면, 그들은 스트레스와 우울감에 시달릴 것이다.","opts":["도망칠","경쟁할","교류할, 어울릴","숨을"],"word":"interact","r":{"a":"3) 교류할, 어울릴","s":[[4,"Without companions to interact with, they would suffer from stress and depression.","교류할 친구가 없다면, 그들은 스트레스와 우울감에 고통받을 것이다."]],"w":"4번 문장에서 친구가 없으면 스트레스를 받는다고 하니 companions to interact with는 함께 어울릴 친구. interact는 서로 교류하다. 경쟁이나 숨는 것은 친구와 관계가 없음.","c":3,"ev":"4번 문장"},"h":"6050acf91f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Guinea pigs aren’t the only animals protected under these pioneering laws.)","ko":"기니피그만이 이러한 ( ) 법의 보호를 받는 유일한 동물은 아니다.","opts":["선구적인, 앞서가는","오래된","위험한","잔인한"],"word":"pioneering","r":{"a":"1) 선구적인, 앞서가는","s":[[6,"Of course, guinea pigs aren’t the only animals protected under these pioneering laws.","물론, 기니피그만이 이러한 선도적인 법의 보호를 받는 유일한 동물은 아니다."]],"w":"6번 문장은 기니피그만이 아니라 다른 동물도 이런 법의 보호를 받는다고 함. pioneering laws는 다른 곳보다 앞서 만든 ‘선구적인’ 법이라는 뜻. 오래된 법, 위험한 법, 잔인한 법이라는 말은 본문에 없음.","c":1,"ev":"6번 문장"},"h":"59d18a7f2c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThese regulations prove Switzerland’s strong commitment to animal rights, with it being the first country to formally recognize the concept of social rights for animals.","ko":"밑줄 친 it이 가리키는 것은?","opts":["스위스","동물의 권리","기니피그","규정들"],"sko":"이러한 규정들은 스위스의 동물 권리에 대한 강한 의지를 증명하며, 그것은 동물의 사회적 권리라는 개념을 공식적으로 인정한 최초의 국가이다.","r":{"a":"1) 스위스","s":[[10,"These regulations prove Switzerland’s strong commitment to animal rights, with it being the first country to formally recognize the concept of social rights for animals.","이러한 규정들은 스위스의 동물 권리에 대한 강한 의지를 증명하며, 스위스는 동물의 사회적 권리라는 개념을 공식적으로 인정한 최초의 국가이다."]],"w":"10번 문장에서 “동물의 사회적 권리 개념을 공식적으로 인정한 최초의 국가”가 it이고, 앞에 나온 Switzerland(스위스)를 가리킴. 규정이나 동물의 권리는 국가가 될 수 없음.","c":1,"ev":"10번 문장","k":"it = 스위스"},"pron":"it","h":"829addb84d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The law even considers cases where one guinea pig lives longer than the other — owners can rent another pig so the remaining one has company until it passes away.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["한 마리가 먼저 죽으면 주인은 남은 기니피그를 다른 주인에게 팔아야 한다.","한 마리가 더 오래 살면 법이 그 기니피그를 보호소로 보내라고 정한다.","한 마리가 먼저 죽으면 주인은 남은 기니피그가 외롭지 않도록 새 기니피그를 사야만 한다.","한 마리가 먼저 죽는 경우도 법이 고려하여, 주인은 남은 한 마리가 죽을 때까지 친구가 있도록 다른 기니피그를 빌릴 수 있다."],"sko":"이 법은 심지어 한 마리의 기니피그가 다른 한 마리보다 더 오래 사는 경우도 고려하는데, 주인은 남겨진 한 마리가 죽을 때까지 동반자가 있도록 다른 기니피그를 빌릴 수 있다.","r":{"a":"4) 한 마리가 먼저 죽는 경우도 법이 고려하여, 주인은 남은 한 마리가 죽을 때까지 친구가 있도록 다른 기니피그를 빌릴 수 있다.","s":[[5,"The law even considers cases where one guinea pig lives longer than the other — owners can rent another pig so the remaining one has company until it passes away.","이 법은 심지어 한 마리의 기니피그가 다른 한 마리보다 더 오래 사는 경우도 고려하는데, 주인은 남겨진 한 마리가 죽을 때까지 동반자가 있도록 다른 기니피그를 빌릴 수 있다."]],"w":"cases where ~는 ‘~인 경우’, owners can rent another pig는 ‘다른 기니피그를 빌릴 수 있다’, so the remaining one has company는 ‘남은 한 마리에게 친구가 있도록’이라는 뜻. 파는 것이나 사야만 한다는 의무는 본문에 없음.","c":4,"ev":"5번 문장"},"h":"54f0194876"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["Cats in Switzerland must be kept with at least three other cats.","Dogs do not need any contact with humans or other dogs.","Rabbits, birds, and goldfish must have at least one companion.","Guinea pigs enjoy living alone, so they are kept alone."],"oko":["스위스의 고양이는 다른 고양이 세 마리 이상과 함께 길러져야 한다.","강아지는 사람이나 다른 강아지와 전혀 접촉할 필요가 없다.","토끼, 새, 금붕어는 최소 한 마리의 친구가 있어야 한다.","기니피그는 혼자 사는 것을 좋아해서 혼자 길러진다."],"r":{"a":"3) Rabbits, birds, and goldfish must have at least one companion. (토끼, 새, 금붕어는 최소 한 마리의 친구가 있어야 한다.)","s":[[3,"This law was introduced because guinea pigs naturally live in groups.","이 법은 기니피그가 본래 무리를 이루어 살기 때문에 도입되었다."],[4,"Without companions to interact with, they would suffer from stress and depression.","교류할 친구가 없다면, 그들은 스트레스와 우울감에 고통받을 것이다."],[7,"All social animals, including rabbits, birds, and goldfish, are required to have at least one companion.","토끼, 새, 금붕어를 포함한 모든 사회적 동물은 최소 한 마리의 친구가 있도록 요구된다."],[8,"Cats, though they are allowed to be kept alone, must still have opportunities to see or socialize with other cats, such as through a window or in shared spaces.","고양이는 비록 단독으로 길러지는 것이 허용되지만, 창문을 통해서나 공동 공간에서처럼 다른 고양이들을 보거나 어울릴 기회가 여전히 있어야 한다."],[9,"Dog owners are also required to let their dogs have regular contact with humans and fellow dogs.","강아지 주인들은 또한 그들의 강아지가 사람이나 친구 강아지들과 정기적으로 접촉하도록 하는 것이 요구된다."]],"w":"7번 문장에서 토끼, 새, 금붕어를 포함한 모든 사회적 동물은 최소 한 마리의 친구가 있어야 한다고 함. 고양이는 단독으로 길러도 되고 다른 고양이를 보거나 어울릴 기회만 있으면 되며(8번), 강아지는 사람·강아지와 정기적으로 접촉해야 하고(9번), 기니피그는 혼자 사는 것을 좋아하지 않음(3번).","c":3,"ev":"3~4번, 7~9번 문장"},"h":"f3ddb4319f"},{"n":9,"t":"sum","q":"This law was introduced because guinea pigs (A) live in (B).","ko":"이 법은 기니피그가 (A) (B)을(를) 이루어 살기 때문에 도입되었다.","opts":["(A) naturally / (B) groups","(A) rarely / (B) groups","(A) naturally / (B) rooms","(A) rarely / (B) rooms","(A) never / (B) groups"],"oko":["(A) 본래 / (B) 무리","(A) 좀처럼 ~하지 않고 / (B) 무리","(A) 본래 / (B) 방","(A) 좀처럼 ~하지 않고 / (B) 방","(A) 결코 ~하지 않고 / (B) 무리"],"r":{"a":"1) (A) naturally / (B) groups ((A) 본래 / (B) 무리)","s":[[3,"This law was introduced because guinea pigs naturally live in groups.","이 법은 기니피그가 본래 무리를 이루어 살기 때문에 도입되었다."]],"w":"3번 문장에서 기니피그는 본래(naturally) 무리(groups)를 이루어 살기 때문에 이 법이 도입되었다고 함. rarely, never는 본문과 반대임.","c":1,"ev":"3번 문장"},"h":"4dfc4653bd"},{"n":10,"t":"fill","q":"If you’re [A] about animal rights, Switzerland’s laws may [B] you.","ko":"동물의 권리에 대해 [A] 사람이라면, 스위스의 법이 당신에게 [B] 수도 있다.","bko":{"serious":"진지한","impress":"깊은 인상을 줄","suffer":"고통받을","live":"살","exist":"존재할","happen":"일어날"},"bank":["serious","impress","suffer","live","exist","happen"],"r":{"a":"[A] serious (진지한), [B] impress (깊은 인상을 줄)","s":[[1,"If you’re serious about animal rights, Switzerland’s laws may impress you.","당신이 동물의 권리에 대해 진지하다면, 스위스의 법이 당신에게 깊은 인상을 줄지도 모른다."]],"w":"1번 문장에서 동물의 권리에 진지하다면(serious) 스위스의 법이 깊은 인상을 줄(impress) 수도 있다고 함. [A]는 형용사 자리, [B]는 목적어(you)를 받는 동사 자리라 나머지 동사들은 맞지 않음.","c":null,"ev":"1번 문장"},"h":"69843e84bd"}]},{"u":9,"id":"rg6-09-3","no":3,"ko":"지름신은 이제 나를 못 속여!","items":[{"n":1,"t":"tf","q":"The writer used to constantly buy clothes, gadgets, and beauty products.","ko":"필자는 의류, 전자기기, 미용 제품을 끊임없이 구매하곤 했다.","r":{"a":"T (본문과 맞는 내용)","s":[[2,"I used to be one of them, constantly purchasing clothes, gadgets, and beauty products.","나 또한 그런 사람들 중 한 명이었고, 의류, 전자기기, 미용 제품을 끊임없이 구매하곤 했다."]],"w":"2번 문장에 I used to be one of them, constantly purchasing clothes, gadgets, and beauty products가 나옴.","c":"T","ev":"2번 문장"},"h":"4f596f5d7c"},{"n":2,"t":"tf","q":"The writer’s drawers held beauty products that were still new and unused.","ko":"필자의 서랍에는 아직 새것이고 사용하지 않은 미용 제품들이 들어 있었다.","r":{"a":"F (본문과 다른 내용)","s":[[6,"My closet was packed with barely worn clothes, and my drawers held forgotten beauty products that had expired.","내 옷장은 거의 입지 않은 옷들로 가득했고, 내 서랍에는 유효 기한이 지난 잊혀진 미용 제품들이 있었다."]],"w":"6번 문장에서 서랍에는 잊혀진, 유효 기간이 지난(had expired) 미용 제품들이 있었다고 함. 새것이 아님.","c":"F","ev":"6번 문장"},"h":"7f44097645"},{"n":3,"t":"tf","q":"The writer looks for secondhand options first when something is needed.","ko":"필자는 무언가가 필요할 때 중고 제품을 먼저 찾아본다.","r":{"a":"T (본문과 맞는 내용)","s":[[12,"When I do need something, I carefully consider its necessity and look for secondhand options first.","내가 정말 무언가가 필요할 때, 나는 그것의 필요성을 신중히 고려하고 중고 제품을 먼저 찾아본다."]],"w":"12번 문장에 look for secondhand options first가 나옴.","c":"T","ev":"12번 문장"},"h":"186da2e694"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (I adopted underconsumption after realizing how much unnecessary stuff I had accumulated.)","ko":"나는 내가 얼마나 많은 불필요한 물건들을 ( ) 깨달은 후에 저소비를 실천하게 되었다.","opts":["버렸는지","쌓아 두었는지","나누어 주었는지","잃어버렸는지"],"word":"accumulated","r":{"a":"2) 쌓아 두었는지","s":[[5,"I adopted underconsumption after realizing how much unnecessary stuff I had accumulated.","나는 내가 얼마나 많은 불필요한 물건들을 쌓아왔는지를 깨달은 후에 저소비를 실천하게 되었다."]],"w":"5번 문장에 이어 6번에서 옷장이 입지 않은 옷으로 가득하고 서랍에 잊혀진 물건이 있다고 함. 쌓여 있었던 것이니 accumulate는 쌓다, 모으다.","c":2,"ev":"5번 문장"},"h":"b7a96352cf"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (I carefully consider its necessity and look for secondhand options first.)","ko":"나는 그것의 ( )을 신중히 고려하고 중고 제품을 먼저 찾아본다.","opts":["가격","크기","필요성","인기"],"word":"necessity","r":{"a":"3) 필요성","s":[[12,"When I do need something, I carefully consider its necessity and look for secondhand options first.","내가 정말 무언가가 필요할 때, 나는 그것의 필요성을 신중히 고려하고 중고 제품을 먼저 찾아본다."]],"w":"12번 문장은 무언가가 필요할 때 사기 전에 따져 보는 모습. 불필요한 물건을 산 것이 문제였으니(5번) 따져 보는 것은 꼭 필요한지, 즉 necessity는 필요성.","c":3,"ev":"12번 문장"},"h":"ba58cc4f25"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIn a world where shopping hauls and unboxing videos flood social media, many people feel the pressure to keep up with fast fashion trends and buy things they don’t truly need.","ko":"밑줄 친 they가 가리키는 것은?","opts":["많은 사람들","패스트 패션 트렌드들","소셜미디어에 올라온 영상들","사지 않아도 되는 물건들"],"sko":"쇼핑 하울과 언박싱 영상이 소셜미디어에 넘쳐나는 세상에서, 많은 사람들은 패스트 패션 트렌드를 따라가고 실제로 필요하지도 않은 물건들을 사야 한다는 압박감을 느낀다.","r":{"a":"1) 많은 사람들","s":[[1,"In a world where shopping hauls and unboxing videos flood social media, many people feel the pressure to keep up with fast fashion trends and buy things they don’t truly need.","쇼핑 하울과 언박싱 영상이 소셜미디어에 넘쳐나는 세상에서, 많은 사람들은 패스트 패션 트렌드를 따라가고 실제로 필요하지도 않은 물건들을 사야 한다는 압박감을 느낀다."]],"w":"1번 문장의 buy things they don’t truly need는 “(사람들이) 실제로 필요하지 않은 물건을 산다”는 뜻이라 they는 앞의 many people(많은 사람들)을 가리킴. 물건들은 need의 목적어일 뿐 they가 아님.","c":1,"ev":"1번 문장","k":"they = 많은 사람들"},"pron":"they","h":"960f415f60"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"My mindset has shifted — I no longer buy something just because it’s on sale or trending.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["내 사고방식이 바뀌어서, 나는 더 이상 세일 중이거나 유행이라는 이유만으로 물건을 사지 않는다.","내 사고방식은 그대로여서, 나는 세일 중인 물건은 계속 산다.","내 사고방식이 바뀌어서, 나는 이제 유행하는 물건만 산다.","내 사고방식은 바뀌지 않았지만, 나는 세일이 없을 때는 물건을 사지 않는다."],"sko":"내 사고방식은 바뀌었고, 나는 더 이상 세일 중이거나 유행이라는 이유만으로 물건을 사지 않는다.","r":{"a":"1) 내 사고방식이 바뀌어서, 나는 더 이상 세일 중이거나 유행이라는 이유만으로 물건을 사지 않는다.","s":[[11,"My mindset has shifted — I no longer buy something just because it’s on sale or trending.","내 사고방식은 바뀌었고, 나는 더 이상 세일 중이거나 유행이라는 이유만으로 물건을 사지 않는다."]],"w":"has shifted는 ‘바뀌었다’이고, no longer ~ just because는 ‘~라는 이유만으로는 더 이상 사지 않는다’는 뜻. 대시(—) 뒤에서 바뀐 내용을 설명함.","c":1,"ev":"11번 문장"},"h":"d870c56dc2"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["The writer feels that her life has become more complicated.","The writer thinks underconsumption has helped her live a simpler life.","The writer plans to buy more new clothes next month.","The writer says underconsumption has increased her environmental impact."],"oko":["필자는 자신의 삶이 더 복잡해졌다고 느낀다.","필자는 저소비가 더 단순한 삶을 사는 데 도움이 되었다고 생각한다.","필자는 다음 달에 새 옷을 더 사 볼 계획이다.","필자는 저소비가 환경에 미치는 영향을 늘렸다고 말한다."],"r":{"a":"2) The writer thinks underconsumption has helped her live a simpler life. (필자는 저소비가 더 단순한 삶을 사는 데 도움이 되었다고 생각한다.)","s":[[13,"Practicing underconsumption has helped me live a simpler and more mindful life while also reducing my environmental impact.","저소비를 실천하는 것은 내가 더 단순하고 의식적인 삶을 살도록 도와주었고, 동시에 내가 환경에 미치는 영향도 줄여주었다."]],"w":"13번 문장에서 저소비 실천이 더 단순하고 의식적인 삶을 살도록 도와주었고 환경에 미치는 영향도 줄여 주었다고 함. 복잡해졌다, 영향이 늘었다, 새 옷을 더 산다는 말은 본문과 반대이거나 없음.","c":2,"ev":"13번 문장"},"h":"2943d52597"},{"n":9,"t":"sum","q":"Many of the writer’s excess items eventually end up in (A), which contributes to environmental (B).","ko":"필자의 여분의 물건들 중 상당수는 결국 (A)로 가게 되고, 이는 환경 (B)에 일조한다.","opts":["(A) landfills / (B) protection","(A) landfills / (B) pollution","(A) closets / (B) pollution","(A) closets / (B) protection","(A) gardens / (B) protection"],"oko":["(A) 쓰레기 매립지 / (B) 보호","(A) 쓰레기 매립지 / (B) 오염","(A) 옷장 / (B) 오염","(A) 옷장 / (B) 보호","(A) 정원 / (B) 보호"],"r":{"a":"2) (A) landfills / (B) pollution","s":[[8,"On top of that, many of these excess items eventually end up in landfills, contributing to environmental pollution.","게다가, 이런 여분의 물건들 중 상당수는 결국 쓰레기 매립지로 가게 되고, 이는 환경 오염에 일조한다."]],"w":"8번 문장에서 여분의 물건들이 결국 쓰레기 매립지(landfills)로 가서 환경 오염(pollution)에 일조한다고 함. 옷장이나 정원, 환경 보호는 본문과 맞지 않음.","c":2,"ev":"8번 문장"},"h":"d393eab0f1"},{"n":10,"t":"fill","q":"Rather than chasing the latest trends, I now focus on fully [A] what I already own. I [B] old clothes instead of replacing them.","ko":"최신 유행을 쫓기보다, 나는 이제 이미 가진 것을 최대한 [A] 데 집중한다. 나는 낡은 옷을 새것으로 바꾸는 대신 [B].","bko":{"utilizing":"활용하는","repair":"수선한다","chasing":"쫓는","expire":"만료된다","sleeping":"자는","waste":"낭비한다"},"bank":["utilizing","repair","chasing","expire","sleeping","waste"],"r":{"a":"[A] utilizing (활용하는), [B] repair (수선한다)","s":[[9,"Rather than chasing the latest trends, I now focus on fully utilizing what I already own.","최신 유행을 쫓기보다는, 나는 이제 이미 가지고 있는 것을 최대한 활용하는 데 집중한다."],[10,"I repair old clothes instead of replacing them, find new uses for household items, and make sure to use things up before considering a new purchase.","나는 낡은 옷을 새것으로 바꾸는 대신 수선하고, 집안 물건의 새로운 용도를 찾고, 새로운 구매를 고려하기 전에 꼭 (기존의) 물건들을 다 써버리도록 한다."]],"w":"9번 문장에서 이미 가진 것을 최대한 활용하는(utilizing) 데 집중하고, 10번 문장에서 낡은 옷을 새것으로 바꾸는 대신 수선함(repair). chasing은 필자가 하지 않는 일이고, expiring, sleeping, wasting은 문장의 뜻과 맞지 않음.","c":null,"ev":"9~10번 문장"},"h":"93a7c59ee4"}]},{"u":10,"id":"rg6-10-1","no":1,"ko":"껌 한 개가 신발이 되기까지","items":[{"n":1,"t":"tf","q":"Local governments in the UK spend around $82 million each year to clean chewed gum off sidewalks.","ko":"영국의 지방 정부는 보도에 붙은 씹다 버린 껌을 제거하는 데 매년 약 8,200만 달러를 쓴다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In the UK alone, local governments spend around $82 million each year to clean chewed gum off sidewalks.","영국에서만 해도, 지방 정부는 씹다 버린 껌을 보도에서 제거하는 데 매년 약 8,200만 달러를 쓴다."]],"w":"2번 문장에 spend around $82 million each year to clean chewed gum off sidewalks(보도의 껌을 지우려고 매년 약 8,200만 달러를 쓴다)가 그대로 나옴.","c":"T"},"h":"d0cc5c252a"},{"n":2,"t":"tf","q":"Anna made plastic pellets from gum alone, without mixing in any other material.","ko":"Anna는 다른 재료를 섞지 않고 껌만으로 플라스틱 알갱이를 만들었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"She developed a special process to mix gum with other recycled materials to create plastic pellets.","그녀는 플라스틱 알갱이를 만들기 위해 껌을 다른 재활용 재료와 혼합하는 특별한 공정을 개발했다."]],"w":"6번 문장에서 껌을 other recycled materials(다른 재활용 재료)와 mix(섞다)해서 알갱이를 만들었다고 함. 껌만으로 만들었다는 말과 반대임.","c":"F"},"h":"d7fe4b1c60"},{"n":3,"t":"tf","q":"The soles of Gumshoe sneakers are made entirely from recycled gum.","ko":"Gumshoe 운동화의 밑창은 전부 재활용 껌으로 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"These sneakers have soles made from a material that includes 20% recycled gum.","이 운동화는 재활용 껌을 20% 포함한 재료로 만들어진 밑창을 가지고 있다."]],"w":"9번 문장에서 밑창 재료에 recycled gum이 20% 들어 있다고 함. 전부 껌이 아니라 일부(20%)임.","c":"F"},"h":"21410f9511"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Discarded chewing gum is a big problem for many cities around the world.)","ko":"( ) 껌은 전 세계 많은 도시들에게 큰 문제이다.","opts":["새로 나온","버려진","향기로운","비싼"],"word":"Discarded","r":{"a":"2) 버려진","ev":"1번 문장","s":[[1,"Discarded chewing gum is a big problem for many cities around the world.","버려진 껌은 전 세계 많은 도시들에게 큰 문제이다."]],"w":"1번 문장의 Discarded chewing gum은 쓰고 버린 껌. 이어서 2번에서 보도에서 껌을 제거하는 이야기가 나오므로 '버려진'이 맞음.","c":2},"h":"c875ebc44d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They are produced by Gumdrop, a company Anna founded to tackle gum waste.)","ko":"그것들은 껌 폐기물 문제를 ( ) 위해 Anna가 설립한 회사인 Gumdrop에 의해 생산된다.","opts":["무시하기","즐기기","대처하기 (다루기)","늘리기"],"word":"tackle","r":{"a":"3) 대처하기 (다루기)","ev":"11번 문장","s":[[11,"They are produced by Gumdrop, a company Anna founded to tackle gum waste.","그것들은 껌 폐기물 문제를 해결하기 위해 Anna가 설립한 회사인 Gumdrop에 의해 생산된다."]],"w":"11번 문장은 Anna가 껌 폐기물이라는 문제를 해결하려고 회사를 세웠다는 내용. tackle = 문제에 맞서 다루다. 1~3번에서 껌이 문제로 나왔으므로 '대처하다'가 맞음.","c":3},"h":"3ad314f99d"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThat gave her an idea: if gum is like plastic, why don’t we recycle it the same way?","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것은 그녀에게 한 가지 아이디어를 떠올리게 했는데, 껌이 플라스틱과 같다면 우리가 그것을 같은 방식으로 재활용하면 어떨까 하는 것이었다.","opts":["껌","플라스틱","아이디어","Anna"],"r":{"a":"1) 껌","ev":"5번 문장","s":[[5,"That gave her an idea: if gum is like plastic, why don’t we recycle it the same way?","그것은 그녀에게 한 가지 아이디어를 떠올리게 했는데, 껌이 플라스틱과 같다면 우리가 그것을 같은 방식으로 재활용하면 어떨까 하는 것이었다."]],"w":"5번 문장은 “껌이 플라스틱과 같다면 우리가 그것(it)을 같은 방식으로 재활용하면 어떨까”라는 뜻이라 it은 gum(껌)을 가리킴. 플라스틱은 재활용하는 방식의 기준일 뿐임.","c":1,"k":"it = 껌"},"pron":"it","h":"8603013c46"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s a smart way to transform a sticky problem into something practical — and even stylish!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 끈적거리는 문제를 실용적인 것으로, 심지어 멋지기까지 한 것으로 바꾸는 현명한 방법이다!","opts":["그것은 끈적거리는 문제를 실용적이고 심지어 멋지기까지 한 것으로 바꾸는 현명한 방법이다.","그것은 끈적거리는 문제를 더 크게 만드는 어리석은 방법이다.","그것은 실용적인 물건을 끈적하게 만들어 멋을 내는 방법이다.","그것은 껌을 먹기 편하게 만드는 새로운 방법이다."],"r":{"a":"1) 그것은 끈적거리는 문제를 실용적이고 심지어 멋지기까지 한 것으로 바꾸는 현명한 방법이다.","ev":"13번 문장","s":[[13,"It’s a smart way to transform a sticky problem into something practical — and even stylish!","그것은 끈적거리는 문제를 실용적인 것으로, 심지어 멋지기까지 한 것으로 바꾸는 현명한 방법이다!"]],"w":"13번 문장은 “끈적거리는 문제를 실용적이고 멋진 것으로 바꾸는 현명한 방법”이라는 뜻. 나머지는 문제를 키우거나 껌을 먹는 이야기라 본문과 맞지 않음.","c":1},"h":"01ce68ee96"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Anna는 껌이 천연 고무로 만들어졌다는 것을 발견했다.","Anna는 껌이 플라스틱과 비슷한 특성을 가진다는 것을 깨달았다.","Anna는 의학을 공부한 의사였다.","알갱이로는 신발 밑창만 만들 수 있다."],"opts":["Anna discovered that gum is made from natural rubber.","Anna realized that gum has some qualities similar to plastic.","Anna was a doctor who studied medicine.","The pellets can only be used to make shoe soles."],"r":{"a":"2) Anna realized that gum has some qualities similar to plastic. (Anna는 껌이 플라스틱과 비슷한 특성을 가진다는 것을 깨달았다.)","ev":"3~4번 문장","s":[[3,"But one designer, Anna Bullus, came up with a creative idea to solve this sticky problem.","그러나 한 디자이너인 Anna Bullus는 이 끈적거리는 문제를 해결할 창의적인 아이디어를 떠올렸다."],[4,"While studying design, Anna realized that gum is made from synthetic rubber and shares some qualities with plastic.","디자인을 공부하던 중에, Anna는 껌이 합성 고무로 만들어지며 플라스틱과 일부 특성을 공유한다는 사실을 깨달았다."]],"w":"4번 문장에서 Anna는 껌이 합성 고무로 만들어지며 플라스틱과 일부 특성을 공유한다는 것을 깨달았다고 함. 천연 고무, 의사 이야기는 본문과 다르고(3번: 디자이너), 알갱이는 여러 물건(7번)에 쓰임.","c":2},"h":"49e1e0ba0c"},{"n":9,"t":"sum","q":"The pellets can be turned into (A) items like combs, frisbees, and (B) coffee mugs.","ko":"알갱이는 빗, 프리스비, (B) 커피잔 같은 (A) 물품으로 바뀔 수 있다.","oko":["(A) 드문 / (B) 재사용 가능한","(A) 일상의 / (B) 일회용","(A) 일상의 / (B) 재사용 가능한","(A) 드문 / (B) 일회용","(A) 거대한 / (B) 재사용 가능한"],"opts":["(A) rare / (B) reusable","(A) everyday / (B) disposable","(A) everyday / (B) reusable","(A) rare / (B) disposable","(A) giant / (B) reusable"],"r":{"a":"3) (A) everyday / (B) reusable ((A) 일상의 / (B) 재사용 가능한)","ev":"7번 문장","s":[[7,"These pellets can be used in regular plastic-making machines and turned into everyday items like combs, frisbees, and reusable coffee mugs.","이 알갱이들은 일반적인 플라스틱 제조 기계에 사용될 수 있으며, 빗, 프리스비, 재사용 가능한 커피잔 같은 일상용품으로 바뀔 수 있다."]],"w":"7번 문장에서 알갱이는 빗, 프리스비, 재사용 가능한(reusable) 커피잔 같은 일상(everyday)용품으로 바뀔 수 있다고 함. 드문, 거대한, 일회용은 본문과 맞지 않음.","c":3},"h":"5887f4d45c"},{"n":10,"t":"fill","q":"They come in [A] colors like bubblegum pink and even [B] like bubblegum!","ko":"그것들은 풍선껌 핑크색 같은 [A] 색상으로 나오고 심지어 풍선껌처럼 [B]!","bko":{"playful":"장난스러운","smell":"냄새가 난다","combs":"빗들","frisbees":"프리스비들","machines":"기계들","pellets":"알갱이들"},"bank":["playful","smell","combs","frisbees","machines","pellets"],"r":{"a":"[A] playful (장난스러운), [B] smell (냄새가 난다)","ev":"10번 문장","s":[[10,"They come in playful colors like bubblegum pink and even smell like bubblegum!","그것들은 풍선껌 핑크색 같은 장난스러운 색상으로 나오고 심지어 풍선껌 같은 냄새까지 난다!"]],"w":"10번 문장에서 이 운동화는 풍선껌 핑크색 같은 장난스러운(playful) 색상으로 나오고 풍선껌 같은 냄새가 난다(smell)고 함. 나머지는 명사라서 colors 앞 형용사 자리와 like 앞 동사 자리에 맞지 않음.","c":null},"h":"234b57a76a"}]},{"u":10,"id":"rg6-10-2","no":2,"ko":"같은 날, 두 개의 이름","items":[{"n":1,"t":"tf","q":"The holiday is observed on the second Monday of October in the United States.","ko":"그 공휴일은 미국에서 10월 두 번째 월요일에 기념된다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Every October, the United States observes a holiday on the second Monday of the month.","매년 10월, 미국은 그달의 두 번째 월요일에 한 공휴일을 기념한다."]],"w":"1번 문장에 Every October, ... on the second Monday of the month(매년 10월, 그달의 두 번째 월요일)가 나옴. 본문과 같은 내용.","c":"T"},"h":"b287f1f40d"},{"n":2,"t":"tf","q":"Former President Biden did not officially recognize Indigenous Peoples' Day.","ko":"바이든 전 대통령은 원주민의 날을 공식적으로 인정하지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Even former President Biden officially recognized Indigenous Peoples’ Day in 2021.","바이든 전 대통령도 2021년에 원주민의 날을 공식적으로 인정했다."]],"w":"7번 문장에서 바이든 전 대통령은 2021년에 원주민의 날을 officially recognized(공식적으로 인정했다)고 함. 인정하지 않았다는 말은 반대임.","c":"F"},"h":"183f9cfb36"},{"n":3,"t":"tf","q":"Italian Americans view Columbus Day as a celebration of Italian heritage and pride.","ko":"이탈리아계 미국인들은 콜럼버스의 날을 이탈리아의 유산과 자긍심을 기념하는 날로 본다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Since Columbus was born in Genoa, Italy, they view the day as a celebration of Italian heritage and pride.","콜럼버스가 이탈리아 제노아에서 태어났기 때문에, 그들은 이날을 이탈리아의 유산과 자긍심을 기념하는 날로 여긴다."]],"w":"9번 문장에 they view the day as a celebration of Italian heritage and pride(그날을 이탈리아의 유산과 자긍심을 기념하는 날로 본다)라고 나옴. 콜럼버스가 제노아 출신이기 때문임.","c":"T"},"h":"c2c7e3775b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, many have raised questions about whether the name of the holiday is appropriate.)","ko":"그러나 많은 사람들은 그 공휴일의 이름이 ( ) 지에 대해 의문을 제기해 왔다.","opts":["유명한","새로운","적절한","재미있는"],"word":"appropriate","r":{"a":"3) 적절한","ev":"3~4번 문장","s":[[3,"However, many have raised questions about whether the name of the holiday is appropriate.","그러나 많은 사람들은 그 공휴일의 이름이 적절한지에 대해 의문을 제기해 왔다."],[4,"They point out that Columbus’s arrival led to the colonization and suffering of native peoples who had lived in the Americas for thousands of years.","그들은 콜럼버스의 도착이 수천 년 동안 아메리카 대륙에 살아왔던 원주민들에 대한 식민 지배와 고통으로 이어졌다고 지적한다."]],"w":"3번에서 이름에 의문을 제기하고, 4번에서 콜럼버스의 도착이 원주민에게 고통을 줬다고 지적함. 즉 이 이름이 '알맞은(적절한)'지 따져 보는 것이므로 appropriate = 적절한.","c":3},"h":"214402e2a7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...proposed changing the holiday's name to Indigenous Peoples' Day to honor the heritage of native communities.)","ko":"... 원주민 공동체의 ( )을 기리기 위해 그 공휴일의 명칭을 원주민의 날로 바꾸자고 제안했다.","opts":["유산, 전통","예산","분노","운동"],"word":"heritage","r":{"a":"1) 유산, 전통","ev":"5번, 9번 문장","s":[[5,"In 1977, Native American leaders proposed changing the holiday’s name to Indigenous Peoples’ Day to honor the heritage of native communities.","1977년, 미국 원주민 지도자들은 원주민 공동체의 유산을 기리기 위해 그 공휴일의 명칭을 원주민의 날로 변경할 것을 제안했다."],[9,"Since Columbus was born in Genoa, Italy, they view the day as a celebration of Italian heritage and pride.","콜럼버스가 이탈리아 제노아에서 태어났기 때문에, 그들은 이날을 이탈리아의 유산과 자긍심을 기념하는 날로 여긴다."]],"w":"5번은 원주민 공동체의 문화와 전통을 기리려고 이름을 바꾸자고 한 것. heritage = 대대로 이어진 (문화) 유산. 9번의 Italian heritage(이탈리아의 유산)와도 같은 뜻임.","c":1},"h":"59753f37c7"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nHowever, many have raised questions about whether the name of the holiday is appropriate. They point out that Columbus’s arrival led to the colonization and suffering of native peoples who had lived in the Americas for thousands of years.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 콜럼버스의 도착이 수천 년 동안 아메리카 대륙에 살아왔던 원주민들에 대한 식민 지배와 고통으로 이어졌다고 지적한다.","opts":["원주민 지도자들","공휴일 이름에 의문을 제기한 많은 사람들","이탈리아계 미국인들","미국의 전 대통령들"],"r":{"a":"2) 공휴일 이름에 의문을 제기한 많은 사람들","ev":"3~4번 문장","s":[[3,"However, many have raised questions about whether the name of the holiday is appropriate.","그러나 많은 사람들은 그 공휴일의 이름이 적절한지에 대해 의문을 제기해 왔다."],[4,"They point out that Columbus’s arrival led to the colonization and suffering of native peoples who had lived in the Americas for thousands of years.","그들은 콜럼버스의 도착이 수천 년 동안 아메리카 대륙에 살아왔던 원주민들에 대한 식민 지배와 고통으로 이어졌다고 지적한다."]],"w":"3번 문장에서 many(많은 사람들)가 이름이 적절한지 의문을 제기했고, 4번 They는 바로 그 사람들. 그들이 의문을 제기한 이유를 4번에서 지적하는 것.","c":2,"k":"They = 공휴일 이름에 의문을 제기한 많은 사람들"},"pron":"They","h":"71b3af4bcd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Whether you call it Columbus Day, Indigenous Peoples' Day, or something else, the holiday continues to spark important conversations about American history, culture, and identity.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그날을 콜럼버스의 날이라고 부르든, 원주민의 날이라고 부르든, 아니면 다른 이름으로 부르든, 그 기념일은 미국의 역사, 문화, 정체성에 대한 중요한 논의를 계속 불러일으키고 있다.","opts":["이름이 하나로 정해지면 미국 역사에 대한 논의는 끝날 것이다.","이름 때문에 사람들이 그 공휴일을 더 이상 기념하지 않게 되었다.","어떤 이름으로 부르든 그 공휴일은 외국의 역사에만 관심을 갖게 한다.","어떤 이름으로 부르든 그 공휴일은 미국의 역사, 문화, 정체성에 대한 중요한 논의를 계속 일으킨다."],"r":{"a":"4) 어떤 이름으로 부르든 그 공휴일은 미국의 역사, 문화, 정체성에 대한 중요한 논의를 계속 일으킨다.","ev":"12번 문장","s":[[12,"Whether you call it Columbus Day, Indigenous Peoples’ Day, or something else, the holiday continues to spark important conversations about American history, culture, and identity.","그날을 콜럼버스의 날이라고 부르든, 원주민의 날이라고 부르든, 아니면 다른 이름으로 부르든, 그 기념일은 미국의 역사, 문화, 정체성에 대한 중요한 논의를 계속 불러일으키고 있다."]],"w":"Whether A, B, or something else는 'A든 B든 다른 이름이든'이라는 뜻. 이름이 무엇이든 그 공휴일이 미국의 역사·문화·정체성에 대한 논의를 계속 일으킨다는 내용임. 논의가 끝난다거나 외국 역사 이야기는 없음.","c":4},"h":"d823892f11"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["콜럼버스의 날은 크리스토퍼 콜럼버스가 1492년에 아메리카 대륙에 도착한 것을 기념한다.","콜럼버스의 날은 1776년 뉴욕의 건립을 기념한다.","콜럼버스의 날은 다른 이름으로 불린 적이 한 번도 없다.","미국의 모든 주가 원주민의 날이라는 이름을 사용한다."],"opts":["Columbus Day celebrates Christopher Columbus’s arrival in the Americas in 1492.","Columbus Day celebrates the founding of New York in 1776.","Columbus Day has never been called by any other name.","Every state in the U.S. uses the name Indigenous Peoples' Day."],"r":{"a":"1) Columbus Day celebrates Christopher Columbus’s arrival in the Americas in 1492. (콜럼버스의 날은 크리스토퍼 콜럼버스가 1492년에 아메리카 대륙에 도착한 것을 기념한다.)","ev":"2번, 5~6번 문장","s":[[2,"Traditionally, this day has been called Columbus Day, celebrating Christopher Columbus’s arrival in the Americas in 1492.","전통적으로, 이날은 크리스토퍼 콜럼버스가 1492년에 아메리카 대륙에 도착한 것을 기념하며 콜럼버스의 날이라고 불려 왔다."],[5,"In 1977, Native American leaders proposed changing the holiday’s name to Indigenous Peoples’ Day to honor the heritage of native communities.","1977년, 미국 원주민 지도자들은 원주민 공동체의 유산을 기리기 위해 그 공휴일의 명칭을 원주민의 날로 변경할 것을 제안했다."],[6,"Over time, more than 100 cities, along with several states like California, Alaska, and Oregon, have adopted this new name.","시간이 지나면서, 캘리포니아, 알래스카, 오리건 같은 몇몇 주와 함께 100개 이상의 도시들이 이 새로운 이름을 채택했다."]],"w":"2번 문장에서 이날은 전통적으로 콜럼버스의 날이라 불렸고 콜럼버스가 1492년 아메리카 대륙에 도착한 것을 기념함. 뉴욕 건립 이야기는 본문에 없고, 이름 변경이 제안되었으며(5번) 새 이름은 일부 도시와 주만 채택했음(6번).","c":1},"h":"f2c2fcd7fd"},{"n":9,"t":"sum","q":"For Italian Americans, Columbus Day (A) a (B) meaning.","ko":"이탈리아계 미국인들에게 콜럼버스의 날은 (B) 의미를 (A).","oko":["(A) 갖는다 / (B) 또 다른","(A) 갖는다 / (B) 똑같은","(A) 잃는다 / (B) 또 다른","(A) 잃는다 / (B) 똑같은","(A) 갖는다 / (B) 웃기는"],"opts":["(A) holds / (B) different","(A) holds / (B) same","(A) loses / (B) different","(A) loses / (B) same","(A) holds / (B) funny"],"r":{"a":"1) (A) holds / (B) different ((A) 갖는다 / (B) 또 다른)","ev":"8번 문장","s":[[8,"For Italian Americans, Columbus Day holds a different meaning.","이탈리아계 미국인들에게 콜럼버스의 날은 또 다른 의미를 갖는다."]],"w":"8번 문장에서 이탈리아계 미국인들에게 콜럼버스의 날은 또 다른(different) 의미를 갖는다(holds)고 함. 의미를 잃는다거나 똑같은 의미라는 말은 본문과 맞지 않음.","c":1},"h":"c84032e625"},{"n":10,"t":"fill","q":"Over time, more than 100 cities, [A] with several states like California, Alaska, and Oregon, have [B] this new name.","ko":"시간이 지나면서, 100개 이상의 도시가 캘리포니아, 알래스카, 오리건 같은 몇몇 주와 [A] 이 새 이름을 [B].","bko":{"along":"함께","adopted":"채택했다","culture":"문화","identity":"정체성","history":"역사","conversations":"대화들"},"bank":["along","adopted","culture","identity","history","conversations"],"r":{"a":"[A] along (함께), [B] adopted (채택했다)","ev":"6번 문장","s":[[6,"Over time, more than 100 cities, along with several states like California, Alaska, and Oregon, have adopted this new name.","시간이 지나면서, 캘리포니아, 알래스카, 오리건 같은 몇몇 주와 함께 100개 이상의 도시들이 이 새로운 이름을 채택했다."]],"w":"6번 문장에서 100개 이상의 도시가 몇몇 주와 함께(along with) 이 새 이름을 채택했다(adopted)고 함. 나머지는 명사라서 with 앞 자리에도, have 뒤 과거분사 자리에도 맞지 않음.","c":null},"h":"fe8ae7b31c"}]},{"u":10,"id":"rg6-10-3","no":3,"ko":"아픈 침팬지는 무엇을 먹을까?","items":[{"n":1,"t":"tf","q":"Researchers from the University of Oxford studied 51 wild chimpanzees in Uganda.","ko":"옥스퍼드 대학교의 연구자들은 우간다에서 51마리의 야생 침팬지를 연구했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"In Uganda’s Budongo Forest, chimpanzees have been observed eating plants — possibly to heal their injuries or illnesses.","우간다의 Budongo 숲에서 침팬지들이 식물을 먹는 것이 관찰되었는데, 어쩌면 그들의 부상이나 질병을 치유하기 위한 것일지도 모른다."],[3,"Researchers from the University of Oxford studied 51 wild chimpanzees from two communities in the forest.","옥스퍼드 대학교 연구진은 그 숲에 있는 두 무리의 야생 침팬지 51마리를 연구했다."]],"w":"3번 문장에 researchers from the University of Oxford studied 51 wild chimpanzees가 나오고, 2번에서 장소가 우간다의 Budongo 숲임. 본문과 같은 내용.","c":"T"},"h":"aaf9364d9f"},{"n":2,"t":"tf","q":"When the plant samples were tested, most of them were found to have no healing properties.","ko":"식물 표본이 검사되었을 때, 대부분은 치유 성분이 없는 것으로 밝혀졌다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"When these samples were tested in the laboratory, most were found to have strong healing properties.","이 표본들이 실험실에서 검사되었을 때, 대부분은 강력한 치유 성분을 가지고 있는 것으로 밝혀졌다."]],"w":"7번 문장에서 대부분의 표본이 strong healing properties(강력한 치유 성분)를 가진 것으로 밝혀졌다고 함. 치유 성분이 없었다는 말은 반대임.","c":"F"},"h":"d00cb08a27"},{"n":3,"t":"tf","q":"The bark that the chimps ate showed powerful antibacterial effects.","ko":"침팬지들이 먹은 나무껍질은 강력한 항균 효과를 보였다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The leaves the chimps ate were shown to reduce pain and swelling, while the bark exhibited powerful antibacterial effects.","침팬지들이 먹은 잎은 통증과 부기를 줄여 주는 것으로 밝혀졌고, 나무껍질은 강력한 항균 효과를 보였다."]],"w":"8번 문장에서 잎은 통증과 부기를 줄였고, 나무껍질(the bark)은 powerful antibacterial effects(강력한 항균 효과)를 보였다고 함.","c":"T"},"h":"e2924cb5df"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...another with a parasitic infection consumed the bark of a certain thorn tree.)","ko":"... 기생충 감염이 있는 또 다른 침팬지는 특정 가시나무의 껍질을 ( ).","opts":["버렸다","먹었다 (섭취했다)","심었다","모았다"],"word":"consumed","r":{"a":"2) 먹었다 (섭취했다)","ev":"5번 문장","s":[[5,"For instance, a chimpanzee with an injured hand chewed on leaves from a certain plant, while another with a parasitic infection consumed the bark of a certain thorn tree.","예를 들어, 손에 부상을 입은 한 침팬지는 특정 식물의 잎을 씹었고, 기생충 감염이 있는 또 다른 침팬지는 특정 가시나무의 껍질을 먹었다."]],"w":"5번 문장은 침팬지가 식물의 잎을 씹고(chewed), 가시나무의 껍질을 consumed했다는 예. 앞 문장 4번에서 침팬지들이 식물을 먹는 모습(eating plants)이 목격되었다고 했으므로 consume = 먹다(섭취하다).","c":2},"h":"35e9e9f292"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...while the bark exhibited powerful antibacterial effects.)","ko":"... 반면에 나무껍질은 강력한 항균 효과를 ( ).","opts":["숨겼다","없앴다","막았다","나타냈다 (보였다)"],"word":"exhibited","r":{"a":"4) 나타냈다 (보였다)","ev":"8번 문장","s":[[8,"The leaves the chimps ate were shown to reduce pain and swelling, while the bark exhibited powerful antibacterial effects.","침팬지들이 먹은 잎은 통증과 부기를 줄여 주는 것으로 밝혀졌고, 나무껍질은 강력한 항균 효과를 보였다."]],"w":"8번에서 실험 결과 잎은 통증과 부기를 줄였고, 나무껍질은 항균 효과를 '보였다'는 내용. while로 앞 문장과 나란히 연결되어 결과를 나타내는 말이므로 exhibit = 나타내다, 보이다.","c":4},"h":"4faf69dbf5"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt provides insight into the exceptional intelligence of these animals and opens new possibilities for developing natural medicines for humans.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 이 동물들의 우수한 지능에 대한 통찰을 제공하며, 인간을 위한 천연 약 개발의 새로운 가능성을 열어 준다.","opts":["침팬지가 식물을 자가 치료에 쓰고 있을지도 모른다는 발견","동아프리카 주민들이 식물을 사용하는 방법","연구자들이 수집한 13종의 식물 표본","옥스퍼드 대학교의 실험실"],"r":{"a":"1) 침팬지가 식물을 자가 치료에 쓰고 있을지도 모른다는 발견","ev":"10~11번 문장","s":[[10,"This finding provides strong evidence that chimpanzees might be using plants for self-medication.","이 발견은 침팬지들이 자가 치료를 위해 식물을 사용하고 있을지도 모른다는 강력한 증거를 제공한다."],[11,"It provides insight into the exceptional intelligence of these animals and opens new possibilities for developing natural medicines for humans.","그것은 이 동물들의 우수한 지능에 대한 통찰을 제공하며, 인간을 위한 천연 약 개발의 새로운 가능성을 열어 준다."]],"w":"10번 문장의 This finding(이 발견)이 침팬지가 자가 치료를 하고 있을지도 모른다는 강력한 증거임. 11번의 It은 그 발견이 주는 통찰과 가능성을 말함.","c":1},"h":"9bae9e2c02"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Some plants were so effective at treating wounds and illnesses that local East African communities also used them for cuts, stomach problems, and even snake bites.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"일부 식물들은 상처와 질병을 치료하는 데 매우 효과적이어서 동아프리카 지역 주민들도 그것들을 베인 상처, 위장 문제, 심지어 뱀에 물린 데에도 사용했다.","opts":["동아프리카 주민들이 침팬지에게 상처와 병에 쓰는 식물을 알려 주었다.","일부 식물은 효과가 없어서 동아프리카 주민들은 전혀 쓰지 않았다.","일부 식물은 상처와 병 치료에 아주 효과적이어서 동아프리카 주민들도 베인 상처, 위장 문제, 뱀에 물린 데에 사용했다.","동아프리카 주민들은 뱀에 물린 침팬지를 식물로 치료해 주었다."],"r":{"a":"3) 일부 식물은 상처와 병 치료에 아주 효과적이어서 동아프리카 주민들도 베인 상처, 위장 문제, 뱀에 물린 데에 사용했다.","ev":"9번 문장","s":[[9,"Some plants were so effective at treating wounds and illnesses that local East African communities also used them for cuts, stomach problems, and even snake bites.","일부 식물들은 상처와 질병을 치료하는 데 매우 효과적이어서 동아프리카 지역 주민들도 그것들을 베인 상처, 위장 문제, 심지어 뱀에 물린 데에도 사용했다."]],"w":"so effective ~ that …은 '너무 효과적이어서 …했다'는 뜻. 식물이 효과적이어서 지역 주민들도 같은 식물을 썼다는 내용. 주민이 침팬지에게 알려 줬다는 말은 없음.","c":3},"h":"99a8e3cd36"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["건강한 침팬지들만 그 식물을 먹는 모습이 목격되었다.","부상을 입은 것으로 보이는 몇몇 침팬지가 평소 식단에 없는 식물을 먹었다.","식물을 먹는 침팬지는 하나도 목격되지 않았다.","침팬지들은 이 식물들을 날마다 평소 식단으로 먹었다."],"opts":["Only healthy chimps were seen eating the plants.","Some injured-looking chimps ate plants that were not part of their usual diet.","No chimps were seen eating any plants.","The chimps ate these plants every day as their usual diet."],"r":{"a":"2) Some injured-looking chimps ate plants that were not part of their usual diet. (부상을 입은 것으로 보이는 몇몇 침팬지가 평소 식단에 없는 식물을 먹었다.)","ev":"4번 문장","s":[[4,"Some chimps that appeared to be injured were seen eating plants that were not part of their usual diet.","부상을 입은 것으로 보이는 몇몇 침팬지들이 평소 식단에 포함되지 않는 식물을 먹고 있는 모습이 목격되었다."]],"w":"4번 문장에서 부상을 입은 것으로 보이는 몇몇 침팬지가 평소 식단에 없던 식물을 먹는 모습이 목격되었다고 함. 건강한 침팬지만, 하나도 없다, 평소 식단이라는 말은 본문과 반대임.","c":2},"h":"2ea6f00ef7"},{"n":9,"t":"sum","q":"The researchers (A) samples from 13 plant species that the (B) chimps had eaten.","ko":"연구자들은 (B) 침팬지들이 먹은 13종의 식물에서 표본을 (A).","oko":["(A) 수집했다 / (B) 아픈","(A) 팔았다 / (B) 아픈","(A) 수집했다 / (B) 행복한","(A) 팔았다 / (B) 행복한","(A) 태웠다 / (B) 아픈"],"opts":["(A) collected / (B) sick","(A) sold / (B) sick","(A) collected / (B) happy","(A) sold / (B) happy","(A) burned / (B) sick"],"r":{"a":"1) (A) collected / (B) sick ((A) 수집했다 / (B) 아픈)","ev":"6번 문장","s":[[6,"The researchers collected samples from 13 plant species that the sick chimps had eaten.","연구자들은 아픈 침팬지들이 먹은 13종의 식물에서 표본을 수집했다."]],"w":"6번 문장에서 연구자들은 아픈(sick) 침팬지들이 먹은 13종의 식물에서 표본을 수집했다(collected)고 함. 팔았다, 태웠다, 행복한은 본문에 없음.","c":1},"h":"9079309ea5"},{"n":10,"t":"fill","q":"What if wild animals [A] more about medicine than we [B]?","ko":"야생 동물들이 우리가 [B] 것보다 약에 대해 더 많이 [A] 어떨까?","bko":{"knew":"알고 있다면","thought":"생각했던","bark":"나무껍질","leaves":"잎들","swelling":"부기","laboratory":"실험실"},"bank":["knew","thought","bark","leaves","swelling","laboratory"],"r":{"a":"[A] knew (알고 있다면), [B] thought (생각했던)","ev":"1번 문장","s":[[1,"What if wild animals knew more about medicine than we thought?","야생 동물들이 우리가 생각했던 것보다 약에 대해 더 많이 알고 있다면 어떨까?"]],"w":"1번 문장은 “야생 동물들이 우리가 생각했던(thought) 것보다 약에 대해 더 많이 알고 있다면(knew) 어떨까?”라는 뜻. 나머지는 명사라서 동사 자리인 [A]와 [B]에 맞지 않음.","c":null},"h":"7a91c4eb34"}]},{"u":11,"id":"rg6-11-1","no":1,"ko":"하늘에 떠 있는 코끼리 100마리","items":[{"n":1,"t":"tf","q":"An average cumulus cloud weighs about the same as 100 elephants.","ko":"평균적인 적운 한 덩어리는 코끼리 100마리와 거의 같은 무게이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"An average cumulus cloud weighs around 550 tons, or about the same as 100 elephants!","평균적인 적운 한 덩어리는 무게가 약 550톤인데, 이는 코끼리 100마리와 거의 같은 무게이다!"]],"w":"3번 문장에서 평균적인 적운은 약 550톤이고, 코끼리 100마리와 거의 같은 무게(about the same as 100 elephants)라고 함.","c":"T"},"h":"7d0de2fa8e"},{"n":2,"t":"tf","q":"The water particles in a cloud are about a million times bigger than a raindrop.","ko":"구름 속의 물 입자는 빗방울보다 약 백만 배 더 크다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Clouds are made of incredibly tiny water particles, each about a million times smaller than a raindrop.","구름은 엄청나게 작은 물 입자들로 이루어져 있는데, 각각은 빗방울보다 약 백만 배 더 작다."]],"w":"5번 문장에서 물 입자는 빗방울보다 약 백만 배 smaller(더 작다)라고 함. bigger(더 크다)는 반대임.","c":"F"},"h":"d2a0d34a86"},{"n":3,"t":"tf","q":"Thunderclouds hold less water than cirrus clouds.","ko":"뇌운은 권운보다 물을 더 적게 머금고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Light cirrus clouds hold less water and are easier to keep in the sky, whereas thunderclouds carry so much water that they are harder to hold up.","가벼운 권운은 물을 적게 머금고 있어 하늘에 머물러 있기 더 쉬운 반면에, 뇌운은 너무 많은 물을 머금고 있어 떠 있기 더 어렵다."]],"w":"12번 문장에서 권운은 물을 less(적게) 머금어 떠 있기 쉽고, 뇌운은 so much water(너무 많은 물)를 머금어 떠 있기 어렵다고 함. 두 구름의 관계가 거꾸로임.","c":"F"},"h":"60270abf20"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So, how do these enormous clouds stay in the sky?)","ko":"그렇다면 이 ( ) 구름들은 어떻게 하늘에 머물러 있는 걸까?","opts":["투명한","얇은","거대한","위험한"],"word":"enormous","r":{"a":"3) 거대한","ev":"3~4번 문장","s":[[3,"An average cumulus cloud weighs around 550 tons, or about the same as 100 elephants!","평균적인 적운 한 덩어리는 무게가 약 550톤인데, 이는 코끼리 100마리와 거의 같은 무게이다!"],[4,"So, how do these enormous clouds stay in the sky?","그렇다면 이 거대한 구름들은 어떻게 하늘에 머물러 있는 걸까?"]],"w":"3번에서 구름 한 덩어리가 약 550톤, 코끼리 100마리의 무게라고 했음. 이렇게 무거운 구름이니 4번의 enormous는 '거대한'이 맞음.","c":3},"h":"d37bf28475"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As a result, the cloud's overall density is lower than the surrounding large volume of air.)","ko":"그 결과, 구름의 전체 밀도는 ( ) 많은 양의 공기보다 더 낮다.","opts":["구름 속의","주변의","높은 곳의","깨끗한"],"word":"surrounding","r":{"a":"2) 주변의","ev":"7번 문장","s":[[7,"As a result, the cloud’s overall density is lower than the surrounding large volume of air.","그 결과, 구름의 전체 밀도는 그 주변을 둘러싼 많은 양의 공기보다 더 낮다."]],"w":"7번은 구름 전체 밀도를 구름 바깥, 즉 구름을 둘러싼 공기와 비교하는 문장임. surrounding = 주변의, 둘러싼. 구름 '속' 공기와 비교하는 게 아님.","c":2},"h":"c7521f3a6c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhen you look at the clouds, they appear light and fluffy, like cotton candy drifting across the sky.","ko":"밑줄 친 they가 가리키는 것은?","sko":"구름을 올려다보면, 그것들은 하늘을 떠다니는 솜사탕처럼 가볍고 폭신폭신해 보인다.","opts":["구름들","사람들","솜사탕","하늘"],"r":{"a":"1) 구름들","ev":"1번 문장","s":[[1,"When you look at the clouds, they appear light and fluffy, like cotton candy drifting across the sky.","구름을 올려다보면, 그것들은 하늘을 떠다니는 솜사탕처럼 가볍고 폭신폭신해 보인다."]],"w":"1번 문장에서 구름을 올려다보면 “그것들(they)”이 가볍고 폭신해 보인다고 했으므로 they는 the clouds(구름들)를 가리킴. 솜사탕은 비유(like cotton candy)일 뿐 대상이 아님.","c":1,"k":"they = 구름들"},"pron":"they","h":"36a9bab6fc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These factors altogether prevent the water particles from falling until they gather and grow heavy enough to fall as rain.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 요인들이 모두 함께 작용해서, 물 입자들이 모여 비로 내릴 만큼 충분히 무거워질 때까지 떨어지지 않도록 막아 준다.","opts":["이 요인들 때문에 물 입자들은 항상 비가 되어 곧바로 떨어진다.","이 요인들은 물 입자들이 무거워지지 못하게 영원히 막아 준다.","이 요인들 중 하나만 있어도 구름은 바로 비가 된다.","이 요인들이 함께 작용해, 물 입자들이 모여 비로 내릴 만큼 무거워질 때까지 떨어지지 않게 막아 준다."],"r":{"a":"4) 이 요인들이 함께 작용해, 물 입자들이 모여 비로 내릴 만큼 무거워질 때까지 떨어지지 않게 막아 준다.","ev":"10번 문장","s":[[10,"These factors altogether prevent the water particles from falling until they gather and grow heavy enough to fall as rain.","이러한 요인들이 모두 함께 작용해서, 물 입자들이 모여 비로 내릴 만큼 충분히 무거워질 때까지 떨어지지 않도록 막아 준다."]],"w":"prevent A from -ing는 'A가 ~하지 못하게 막다', until은 '~할 때까지'. 입자들이 모여 충분히 무거워지면 그때는 비로 떨어진다는 뜻이라 '영원히 막는다'는 말은 틀림.","c":4},"h":"2fa1cd622d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["구름은 공기보다 물을 훨씬 더 많이 포함하고 있다.","구름은 물보다 공기를 훨씬 더 많이 포함하고 있다.","구름은 만들어지자마자 사라진다.","하늘에서 내려오는 따뜻한 공기가 구름을 더 높이 들어 올린다."],"opts":["A cloud contains far more water than air.","A cloud contains far more air than water.","Clouds disappear as soon as they form.","Warm air coming down from the sky lifts the cloud higher."],"r":{"a":"2) A cloud contains far more air than water. (구름은 물보다 공기를 훨씬 더 많이 포함하고 있다.)","ev":"6번 문장","s":[[6,"These particles are widely spread out and mixed with a large amount of air, which explains the cloud’s containing far more air than water.","이 입자들은 널리 퍼져 있고 많은 양의 공기와 섞여 있는데, 이것이 구름이 물보다 공기를 훨씬 더 많이 포함하는 이유를 설명해 준다."]],"w":"6번 문장에서 구름은 물보다 공기를 훨씬 더 많이 포함한다고 함. 물이 더 많다는 말과 곧바로 떨어진다는 말은 본문과 반대이고, 따뜻한 공기는 “올라오는” 것임(9번).","c":2},"h":"f847366dbb"},{"n":9,"t":"sum","q":"Warm air rising from the (A) lifts the cloud higher, while wind currents keep the water particles (B).","ko":"(A)에서 올라오는 따뜻한 공기가 구름을 더 높이 들어 올리고, 바람의 흐름은 물 입자들이 계속 (B) 해 준다.","oko":["(A) 바다 / (B) 움직이게","(A) 지면 / (B) 떨어지게","(A) 지면 / (B) 움직이게","(A) 바다 / (B) 떨어지게","(A) 지붕 / (B) 움직이게"],"opts":["(A) sea / (B) moving","(A) ground / (B) falling","(A) ground / (B) moving","(A) sea / (B) falling","(A) roof / (B) moving"],"r":{"a":"3) (A) ground / (B) moving ((A) 지면 / (B) 움직이게)","ev":"9번 문장","s":[[9,"Warm air rising from the ground also lifts the cloud higher, while wind currents keep the water particles moving.","지면에서 올라오는 따뜻한 공기도 구름을 더 높이 들어 올리고, 바람의 흐름은 물 입자들이 계속 움직이게 해 준다."]],"w":"9번 문장에서 지면(ground)에서 올라오는 따뜻한 공기가 구름을 들어 올리고, 바람의 흐름은 물 입자들이 계속 움직이게(moving) 해 준다고 함. 바다·지붕, 떨어지게는 본문과 맞지 않음.","c":3},"h":"acbb917255"},{"n":10,"t":"fill","q":"Nevertheless, all clouds stay in the sky thanks to the same [A] factors — air density, rising warm air, and wind — working together in perfect [B].","ko":"그럼에도 불구하고, 모든 구름은 공기 밀도, 상승하는 따뜻한 공기, 바람이라는 똑같은 [A] 요인들이 완벽한 [B]을(를) 이루며 함께 작용하는 덕분에 하늘에 머문다.","bko":{"natural":"자연적인","harmony":"조화","raindrops":"빗방울들","elephants":"코끼리들","tons":"톤(무게 단위)","particles":"입자들"},"bank":["natural","harmony","raindrops","elephants","tons","particles"],"r":{"a":"[A] natural (자연적인), [B] harmony (조화)","ev":"13번 문장","s":[[13,"Nevertheless, all clouds stay in the sky thanks to the same natural factors — air density, rising warm air, and wind — working together in perfect harmony.","그럼에도 불구하고, 모든 구름은 공기 밀도, 상승하는 따뜻한 공기, 바람이라는 똑같은 자연적 요인들이 완벽한 조화를 이루며 함께 작용하는 덕분에 하늘에 머문다."]],"w":"13번 문장에서 모든 구름은 똑같은 자연적인(natural) 요인들이 완벽한 조화(harmony)를 이루며 함께 작용하는 덕분에 하늘에 머문다고 함. 나머지는 명사라서 factors 앞 형용사 자리에 맞지 않고, perfect 뒤에도 뜻이 맞지 않음.","c":null},"h":"378f559eb9"}]},{"u":11,"id":"rg6-11-2","no":2,"ko":"비가 쏟아지는데 물이 없다니","items":[{"n":1,"t":"tf","q":"Cherrapunji receives an average annual rainfall of 11,430 mm.","ko":"체라푼지는 연평균 강우량이 11,430mm이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It receives an average annual rainfall of 11,430 mm — about as much as South Korea gets over ten years!","그곳은 연평균 강우량이 11,430mm인데, 이는 한국이 10년에 걸쳐 받는 양과 비슷하다!"]],"w":"2번 문장에 It receives an average annual rainfall of 11,430 mm(연평균 11,430mm의 강우량을 받는다)가 그대로 나옴.","c":"T"},"h":"29b898de5e"},{"n":2,"t":"tf","q":"Most of the rain in Cherrapunji falls evenly throughout the year.","ko":"체라푼지의 비는 대부분 일 년 내내 고르게 내린다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Most of the rain falls within a short monsoon season, and the village’s steep, rocky landscape causes the rainwater to flow away quickly instead of soaking into the ground.","대부분의 비는 짧은 우기 동안에 내리고, 마을의 가파르고 바위가 많은 지형은 빗물이 땅속에 스며드는 대신 빠르게 흘러가 버리게 한다."]],"w":"6번 문장에서 대부분의 비는 짧은 우기(a short monsoon season) 동안에 내린다고 함. 일 년 내내 고르게 내린다는 말과 반대임.","c":"F"},"h":"84e50a8534"},{"n":3,"t":"tf","q":"Climate change has made the water shortage worse by causing longer dry periods and rising temperatures.","ko":"기후 변화는 더 긴 건기와 기온 상승을 일으켜 물 부족을 더 악화시켰다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Climate change has also made things worse by causing longer dry periods and rising temperatures.","기후 변화 또한 더 긴 건기와 기온 상승을 일으켜 상황을 더욱 악화시켰다."]],"w":"8번 문장에서 기후 변화가 longer dry periods and rising temperatures(더 긴 건기와 기온 상승)를 일으켜 상황을 더 나쁘게 했다고 함.","c":"T"},"h":"2930713a65"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...a green landscape, misty hills, and spectacular waterfalls that attract visitors from around the world.)","ko":"... 푸른 경관, 안개가 자욱한 언덕, 그리고 ( ) 폭포 ...","opts":["작은","장관을 이루는 (멋진)","위험한","흔한"],"word":"spectacular","r":{"a":"2) 장관을 이루는 (멋진)","ev":"3번 문장","s":[[3,"This extreme rainfall creates a green landscape, misty hills, and spectacular waterfalls that attract visitors from around the world.","이 엄청난 강우량은 푸른 경관, 안개가 자욱한 언덕, 그리고 장관을 이루는 폭포를 만들어 내며, 전 세계의 방문객을 끌어들인다."]],"w":"3번은 많은 비가 만든 아름다운 풍경과 폭포가 전 세계 방문객을 끌어들인다는 내용. 방문객이 몰려올 만큼 멋진 폭포이므로 spectacular = 장관을 이루는.","c":2},"h":"cd74a89310"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the village's steep, rocky landscape causes the rainwater to flow away quickly...)","ko":"... 마을의 ( ), 바위가 많은 지형은 빗물이 빠르게 흘러가 버리게 한다.","opts":["평평한","넓은","따뜻한","가파른"],"word":"steep","r":{"a":"4) 가파른","ev":"6번 문장","s":[[6,"Most of the rain falls within a short monsoon season, and the village’s steep, rocky landscape causes the rainwater to flow away quickly instead of soaking into the ground.","대부분의 비는 짧은 우기 동안에 내리고, 마을의 가파르고 바위가 많은 지형은 빗물이 땅속에 스며드는 대신 빠르게 흘러가 버리게 한다."]],"w":"6번은 빗물이 땅에 스며들기 전에 빨리 흘러가 버리는 이유를 말함. 물이 빨리 흘러내리려면 지형이 가파른 것이므로 steep = 가파른. 평평하면 물이 빨리 흘러가지 않음.","c":4},"h":"451d91f160"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nDuring the dry months, there is often not enough water for drinking, farming, or daily use. Many villagers must walk long distances or pay high prices to get it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"많은 마을 주민들은 그것을 얻기 위해 먼 거리를 걷거나 비싼 가격을 지불해야 한다.","opts":["물","마을","건기","가격"],"r":{"a":"1) 물","ev":"10~11번 문장","s":[[10,"During the dry months, there is often not enough water for drinking, farming, or daily use.","건기 동안에는 식수, 농업용, 일상용 물이 종종 부족하다."],[11,"Many villagers must walk long distances or pay high prices to get it.","많은 마을 주민들은 물을 얻기 위해 먼 거리를 걷거나 비싼 가격을 지불해야 한다."]],"w":"10번 문장에서 건기에는 식수, 농업용, 일상용 water가 부족하다고 함. 11번의 it은 그 물이고, 마을 주민들이 물을 얻으려고 먼 거리를 걷거나 비싼 값을 냄.","c":1,"k":"it = 물"},"pron":"it","h":"8db22f434f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But here’s the strange part: despite all this heavy rain, Cherrapunji faces serious water shortages.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 이상한 점이 있다. 이렇게 비가 많이 오는데도 체라푼지는 심각한 물 부족을 겪는다.","opts":["비가 많이 오는데도 체라푼지는 심각한 물 부족을 겪는다는 점이 이상하다.","비가 많이 와서 체라푼지에는 물이 남아돈다.","비가 적게 와서 체라푼지는 물이 부족하다.","체라푼지는 물이 부족해서 비가 많이 온다."],"r":{"a":"1) 비가 많이 오는데도 체라푼지는 심각한 물 부족을 겪는다는 점이 이상하다.","ev":"4번 문장","s":[[4,"But here’s the strange part: despite all this heavy rain, Cherrapunji faces serious water shortages.","하지만 이상한 점이 있다. 이렇게 비가 많이 오는데도 체라푼지는 심각한 물 부족을 겪는다."]],"w":"4번 문장은 “이상한 점은, 이렇게 비가 많이 오는데도 체라푼지가 심각한 물 부족을 겪는다는 것”이라는 뜻. 나머지는 비가 많이 오는 것과 물 부족의 관계를 잘못 말함.","c":1},"h":"7378ddabcc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["체라푼지는 지구상의 어느 곳보다 비가 적게 내린다.","산림 벌채는 토양이 물을 머금기 더 어렵게 만들었다.","체라푼지는 새로운 기술로 물 부족을 이미 해결했다.","전문가들은 체라푼지에 물 문제가 전혀 없다고 말한다."],"opts":["Cherrapunji gets less rain than any other place on Earth.","Deforestation has made it harder for the soil to hold water.","Cherrapunji has already solved its water shortages with new technology.","Experts say Cherrapunji has no problems with water."],"r":{"a":"2) Deforestation has made it harder for the soil to hold water. (산림 벌채는 토양이 물을 머금기 더 어렵게 만들었다.)","ev":"1번, 7번, 13번 문장","s":[[1,"In the hills of northeastern India lies Cherrapunji, a village described as one of the wettest places on Earth.","인도 북동부의 언덕 지대에는 지구상에서 가장 비가 많이 오는 지역 중 하나로 묘사되는 마을인 체라푼지가 있다."],[7,"In addition, deforestation has greatly reduced the number of trees, which makes it harder for the soil to hold water.","게다가, 산림 벌채가 나무의 수를 크게 줄여서, 토양이 물을 머금기 더 어렵게 만들었다."],[13,"Hopefully, this unique village will discover solutions and ensure a sustainable future for its people.","부디, 이 특별한 마을이 해결책을 발견하고 주민들을 위한 지속 가능한 미래를 보장해 주기를 바란다."]],"w":"7번 문장에서 산림 벌채가 나무를 줄여 토양이 물을 머금기 더 어렵게 했다고 함. 1번에서 체라푼지는 지구상에서 가장 비가 많이 오는 곳 중 하나이고, 13번 hopefully는 물 부족을 아직 해결하지 못했다는 뜻이며, 4번과 9번에서 물 문제가 실제로 있음.","c":2},"h":"94c1460c60"},{"n":9,"t":"sum","q":"Some experts call Cherrapunji a “wet (A)” to highlight the bitter (B) of its situation.","ko":"일부 전문가들은 그 상황의 쓰라린 (B)을(를) 강조하기 위해 체라푼지를 ‘비 오는 (A)’이라고 부른다.","oko":["(A) 사막 / (B) 아이러니","(A) 사막 / (B) 아름다움","(A) 숲 / (B) 아이러니","(A) 숲 / (B) 아름다움","(A) 사막 / (B) 행운"],"opts":["(A) desert / (B) irony","(A) desert / (B) beauty","(A) forest / (B) irony","(A) forest / (B) beauty","(A) desert / (B) luck"],"r":{"a":"1) (A) desert / (B) irony ((A) 사막 / (B) 아이러니)","ev":"12번 문장","s":[[12,"Some experts call Cherrapunji a “wet desert” to highlight the bitter irony of its situation.","일부 전문가들은 그 상황의 쓰라린 아이러니를 강조하기 위해 체라푼지를 '비 오는 사막'이라고 부른다."]],"w":"12번 문장에서 일부 전문가들이 상황의 쓰라린 아이러니(irony)를 강조하려고 체라푼지를 ‘비 오는 사막(wet desert)’이라 부른다고 함. 숲, 아름다움, 행운은 본문과 맞지 않음.","c":1},"h":"222c5f7909"},{"n":10,"t":"fill","q":"Hopefully, this unique village will [A] solutions and ensure a [B] future for its people.","ko":"부디, 이 특별한 마을이 해결책을 [A] 주민들을 위한 [B] 미래를 보장하기를 바란다.","bko":{"discover":"발견하고","sustainable":"지속 가능한","tourists":"관광객들","waterfalls":"폭포들","monsoon":"우기","landscape":"경관"},"bank":["discover","sustainable","tourists","waterfalls","monsoon","landscape"],"r":{"a":"[A] discover (발견하고), [B] sustainable (지속 가능한)","ev":"13번 문장","s":[[13,"Hopefully, this unique village will discover solutions and ensure a sustainable future for its people.","부디, 이 특별한 마을이 해결책을 발견하고 주민들을 위한 지속 가능한 미래를 보장해 주기를 바란다."]],"w":"13번 문장에서 이 마을이 해결책을 발견하고(discover) 주민들을 위한 지속 가능한(sustainable) 미래를 보장하기를 바란다고 함. 나머지는 명사라서 will 뒤 동사 자리와 future 앞 형용사 자리에 맞지 않음.","c":null},"h":"6f6189ef6d"}]},{"u":11,"id":"rg6-11-3","no":3,"ko":"소리 없이도 대화가 넘치는 마을","items":[{"n":1,"t":"tf","q":"Forty-four of the 3,000 residents of Bengkala are deaf.","ko":"Bengkala 주민 3,000명 중 44명은 청각 장애가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Among its 3,000 residents, 44 are deaf due to a genetic condition passed down for seven generations.","이 마을 주민 3,000명 중 44명은 7세대에 걸쳐 대물림된 유전 질환 때문에 청각 장애가 있다."]],"w":"5번 문장에 Among its 3,000 residents, 44 are deaf(3,000명의 주민 중 44명이 청각 장애가 있다)가 나옴. 유전 질환 때문이라고 함.","c":"T"},"h":"cdb0cb6b7b"},{"n":2,"t":"tf","q":"Kata Kolok is used only by the deaf villagers of Bengkala.","ko":"Kata Kolok은 Bengkala의 청각 장애인 마을 주민들만 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Kata Kolok is spoken only in Bengkala and is used by both deaf and hearing villagers.","Kata Kolok은 Bengkala에서만 말해지며 청각 장애인과 비장애인 마을 주민 모두가 사용한다."]],"w":"9번 문장에서 Kata Kolok은 청각 장애인(deaf)과 비장애인(hearing) 마을 주민 모두가 사용한다고 함. 청각 장애인만 쓴다는 말은 틀림.","c":"F"},"h":"d768ddc09c"},{"n":3,"t":"tf","q":"Community meetings in Bengkala are conducted in sign language.","ko":"Bengkala의 지역 사회 회의는 수화로 진행된다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Deaf and hearing villagers chat casually, children play games using gestures, and community meetings are conducted in signing.","청각 장애인과 비장애인 주민들이 편하게 대화하고, 아이들은 몸짓을 사용하며 게임을 하고, 지역 사회 회의는 수화로 진행된다."]],"w":"12번 문장에 community meetings are conducted in signing(지역 사회 회의는 수화로 진행된다)이 나옴. 편한 대화, 아이들의 게임과 함께 나오는 예 중 하나임.","c":"T"},"h":"883304e149"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...where deafness can lead to isolation, Bengkala has built a community where everyone can interact without barriers.)","ko":"... 청각 장애가 ( )로 이어질 수 있는 곳 ... Bengkala는 모두가 장벽 없이 소통할 수 있는 공동체를 만들어 냈다.","opts":["성공","경쟁","고립","번영"],"word":"isolation","r":{"a":"3) 고립","ev":"6번 문장","s":[[6,"But unlike in many places, where deafness can lead to isolation, Bengkala has built a community where everyone can interact without barriers.","하지만 청각 장애가 고립으로 이어질 수 있는 많은 장소들과 달리, Bengkala는 모두가 장벽 없이 소통할 수 있는 공동체를 만들어 냈다."]],"w":"6번은 청각 장애가 고립으로 이어질 수 있는 다른 곳과 달리 Bengkala는 장벽 없이 소통한다는 대조 문장. 소통이 막히는 상태이므로 isolation = 고립.","c":3},"h":"c8679b0a38"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Everyday interactions in Bengkala happen effortlessly in sign language.)","ko":"Bengkala에서는 일상적인 교류가 수화로 ( ) 이루어진다.","opts":["천천히","쉽게 (힘들이지 않고)","어렵게","가끔"],"word":"effortlessly","r":{"a":"2) 쉽게 (힘들이지 않고)","ev":"11~12번 문장","s":[[11,"Everyday interactions in Bengkala happen effortlessly in sign language.","Bengkala에서는 일상적인 교류가 수화로 쉽게 이루어진다."],[12,"Deaf and hearing villagers chat casually, children play games using gestures, and community meetings are conducted in signing.","청각 장애인과 비장애인 주민들이 편하게 대화하고, 아이들은 몸짓을 사용하며 게임을 하고, 지역 사회 회의는 수화로 진행된다."]],"w":"11번 뒤 12번에서 장애인과 비장애인이 편하게(casually) 대화하고 아이들이 게임을 한다고 함. 애쓰지 않아도 자연스럽다는 뜻이므로 effortlessly = 쉽게.","c":2},"h":"75eb763826"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThe villagers developed Kata Kolok, which is their own sign language.","ko":"밑줄 친 which이 가리키는 것은?","sko":"마을 주민들은 Kata Kolok(카타 콜록)을 개발했는데, 이는 그들 자신만의 수화이다.","opts":["Kata Kolok","마을 주민들","Bengkala","인도네시아어"],"r":{"a":"1) Kata Kolok","ev":"7번 문장","s":[[7,"The villagers developed Kata Kolok, which is their own sign language.","마을 주민들은 Kata Kolok(카타 콜록)을 개발했는데, 이는 그들 자신만의 수화이다."]],"w":"7번 문장에서 which 뒤의 “그들 자신만의 수화”는 바로 앞에 나온 K
