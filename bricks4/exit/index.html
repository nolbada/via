},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... completes the payment instantly.)","ko":"... 결제를 ( ) 완료한다","opts":["즉시","천천히","가끔","나중에"],"word":"instantly","r":{"a":"1) 즉시","ev":"7번 문장","s":[[7,"The reader then records the information and completes the payment instantly.","그러면 리더기는 그 정보를 기록하고 결제를 즉시 완료한다."]],"w":"7번에서 정보를 기록하고 바로 결제를 끝낸다는 뜻. instantly = 즉시, 바로. 천천히나 나중에는 반대.","c":1},"h":"bd183831c7"},{"n":6,"t":"ref","q":"What does the underlined \"this technology\" refer to?\nThanks to this technology, our daily lives have become much more convenient.","ko":"밑줄 친 this technology가 가리키는 것은?","sko":"이 기술 덕분에, 우리의 일상생활은 훨씬 더 편리해졌다.","opts":["NFC (근거리 무선 통신)","GPS (위치 확인 시스템)","Wi-Fi (무선 인터넷)","블루투스 이어폰"],"r":{"a":"1) NFC (근거리 무선 통신)","ev":"11~12번 문장","s":[[11,"Today, NFC is used in many areas of daily life, such as digital wallets and smart keys.","오늘날 NFC는 디지털 지갑과 스마트 키 같은 일상생활의 많은 분야에서 사용된다."],[12,"Thanks to this technology, our daily lives have become much more convenient.","이 기술 덕분에, 우리의 일상생활은 훨씬 더 편리해졌다."]],"w":"12번의 this technology는 11번에서 일상생활의 많은 분야에서 사용된다고 한 NFC. NFC 덕분에 우리의 일상생활이 훨씬 더 편리해졌다는 내용.","c":1,"k":"this technology = NFC (근거리 무선 통신)"},"pron":"this technology","h":"561b1e8745"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This keeps your data safe by making it almost impossible for someone to steal it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 누군가가 데이터를 훔치는 것을 거의 불가능하게 만들어서 당신의 데이터를 안전하게 지켜 준다.","opts":["누군가가 데이터를 훔치기 쉬워져서 데이터가 빨리 전송된다.","데이터를 훔치는 사람을 쉽게 찾을 수 있다.","데이터를 안전하게 지키려면 카드를 멀리 두어야 한다.","누군가가 데이터를 훔치는 것이 거의 불가능해져서 데이터가 안전하게 지켜진다."],"r":{"a":"4) 누군가가 데이터를 훔치는 것이 거의 불가능해져서 데이터가 안전하게 지켜진다.","ev":"10번 문장","s":[[10,"This keeps your data safe by making it almost impossible for someone to steal it.","이것은 누군가가 데이터를 훔치는 것을 거의 불가능하게 만들어서 당신의 데이터를 안전하게 지켜 준다."]],"w":"10번의 by making it almost impossible for someone to steal it은 '누군가 훔치기가 거의 불가능하게 만들어서'. 그 결과 데이터가 안전함. 해킹을 돕는다는 말은 반대.","c":4},"h":"748c668daf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["NFC는 버스 요금을 내는 데에만 사용된다.","NFC는 디지털 지갑과 스마트 키 같은 일상생활의 많은 분야에서 사용된다.","NFC는 스마트 키에는 사용될 수 없다.","NFC는 일상생활을 덜 편리하게 만든다."],"opts":["NFC is used only for paying bus fares.","NFC is used in many areas of daily life, such as digital wallets and smart keys.","NFC cannot be used in smart keys.","NFC makes daily life less convenient."],"r":{"a":"2) NFC is used in many areas of daily life, such as digital wallets and smart keys. (NFC는 디지털 지갑과 스마트 키 같은 일상생활의 많은 분야에서 사용된다.)","ev":"11~12번 문장","s":[[11,"Today, NFC is used in many areas of daily life, such as digital wallets and smart keys.","오늘날 NFC는 디지털 지갑과 스마트 키 같은 일상생활의 많은 분야에서 사용된다."],[12,"Thanks to this technology, our daily lives have become much more convenient.","이 기술 덕분에, 우리의 일상생활은 훨씬 더 편리해졌다."]],"w":"11번에서 NFC는 디지털 지갑과 스마트 키 같은 일상생활의 많은 분야에서 사용된다고 함. ①은 버스 요금에만 쓰인다고 한 점이, ③은 스마트 키에 쓰인다는 11번과, ④는 훨씬 더 편리해졌다는 12번과 맞지 않음.","c":2},"h":"f45a0c2711"},{"n":9,"t":"sum","q":"This simple action is made (B) by a (A) technology called NFC.","ko":"이 간단한 동작은 NFC라는 (A) 기술에 의해 (B) 만들어진다.","oko":["(A) 유선 / (B) 가능하게","(A) 무선 / (B) 어렵게","(A) 유선 / (B) 어렵게","(A) 시끄러운 / (B) 가능하게","(A) 무선 / (B) 가능하게"],"opts":["(A) wired / (B) possible","(A) wireless / (B) difficult","(A) wired / (B) difficult","(A) loud / (B) possible","(A) wireless / (B) possible"],"r":{"a":"5) (A) wireless / (B) possible ((A) 무선 / (B) 가능하게)","ev":"2번 문장","s":[[2,"This simple action is made possible by a wireless technology called NFC, or Near Field Communications.","이 간단한 동작은 NFC, 즉 근거리 무선 통신(Near Field Communications)이라는 무선 기술 덕분에 가능하다."]],"w":"2번: 이 간단한 동작은 NFC라는 무선(wireless) 기술 덕분에 가능하다(made possible).","c":5},"h":"57e1465b10"},{"n":10,"t":"fill","q":"A card reader creates a short-range [A] field. When a card comes close to the reader, this field creates a small amount of [B].","ko":"카드 리더기는 짧은 거리의 [A] 장(field)을 만든다. 카드가 리더기에 가까이 오면, 이 장(field)이 소량의 [B]을(를) 만든다.","bank":["magnetic","electricity","chip","reader","phone","centimeters"],"bko":{"magnetic":"자기의","electricity":"전기","chip":"칩","reader":"리더기","phone":"휴대폰","centimeters":"센티미터"},"r":{"a":"[A] magnetic (자기의), [B] electricity (전기)","ev":"4~5번 문장","s":[[4,"A card reader creates a short-range magnetic field.","카드 리더기는 짧은 거리의 자기장을 만든다."],[5,"When a card comes close to the reader, this field creates a small amount of electricity.","카드가 리더기에 가까이 오면, 이 자기장이 소량의 전기를 만든다."]],"w":"4~5번: 카드 리더기는 짧은 거리의 자기(magnetic) 장을 만들고, 이 장이 소량의 전기(electricity)를 만든다.","c":null},"h":"6a335b5ecf"}]},{"u":8,"id":"b4-08-2","no":2,"ko":"운전대에서 손을 뗀 자동차는 어떻게 길을 찾을까?","items":[{"n":1,"t":"tf","q":"Self-driving cars work through three main steps: sensing, thinking, and acting.","ko":"자율주행 자동차는 감지, 생각, 행동이라는 세 가지 주요 단계를 통해 작동한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They work through three main steps: sensing, thinking, and acting.","그것들은 감지, 생각, 행동이라는 세 가지 주요 단계를 통해 작동한다."]],"w":"3번에 They work through three main steps: sensing, thinking, and acting이 그대로 나옴.","c":"T"},"h":"0e31b55dbe"},{"n":2,"t":"tf","q":"GPS helps the vehicle measure the speed of other objects.","ko":"GPS는 차량이 다른 물체의 속도를 측정하도록 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Along with its sensors, GPS helps the vehicle locate itself.","센서와 함께, GPS는 차량이 자신의 위치를 파악하도록 도와준다."]],"w":"7번에서 GPS는 차량이 자신의 위치를 파악하도록 돕는다(locate itself)고 함. 물체의 거리와 속도를 측정하는 것은 6번의 radar.","c":"F"},"h":"e67a079677"},{"n":3,"t":"tf","q":"Once the data is collected, a human driver analyzes it.","ko":"데이터가 수집되면, 사람 운전자가 그것을 분석한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Once this data is collected, powerful computers and AI analyze it.","이 데이터가 수집되면, 강력한 컴퓨터와 인공지능이 그것을 분석한다."]],"w":"9번에서 데이터를 분석하는 것은 powerful computers and AI(강력한 컴퓨터와 인공지능)임. 사람 운전자가 아님.","c":"F"},"h":"c7d69cab28"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... rely on a variety of sensors to understand their surroundings.)","ko":"... ( )을 이해하기 위해 다양한 센서에 의존한다","opts":["주변 환경","차의 속도","연료의 양","엔진 소리"],"word":"surroundings","r":{"a":"1) 주변 환경","ev":"4번 문장","s":[[4,"Self-driving cars rely on a variety of sensors to understand their surroundings.","자율주행 자동차는 주변 환경을 이해하기 위해 다양한 센서에 의존한다."]],"w":"4번에서 센서가 이해하려는 대상으로, 5~6번에서 표지판·차선·물체 등 차 주변의 것들이 나옴. surroundings = 주변 환경.","c":1},"h":"2db20d64a6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As the systems become better and more reliable, ...)","ko":"시스템이 더 좋고 더 ( ) 따라, ...","opts":["위험한","믿을 만한","비싼","느린"],"word":"reliable","r":{"a":"2) 믿을 만한","ev":"12번 문장","s":[[12,"As the systems become better and more reliable, self-driving cars are more likely to become a part of everyday life.","시스템이 더 좋고 더 믿을 만해짐에 따라, 자율주행 자동차는 일상의 일부가 될 가능성이 더 높다."]],"w":"12번에서 better and more reliable은 시스템이 더 좋아지고 믿을 수 있게 된다는 뜻. reliable = 믿을 만한. 위험한이나 느린은 일상의 일부가 될 가능성과 반대 방향.","c":2},"h":"8fe5e22690"},{"n":6,"t":"ref","q":"What does the underlined \"these signals\" refer to?\nTogether, these signals give the car a detailed picture of the road.","ko":"밑줄 친 these signals가 가리키는 것은?","sko":"이 신호들이 함께 차에게 도로의 상세한 그림을 제공한다.","opts":["신호등의 빨간불과 초록불","센서와 GPS가 모은 정보","운전자가 내리는 명령","승객이 보내는 메시지"],"r":{"a":"2) 센서와 GPS가 모은 정보","ev":"4~8번 문장","s":[[4,"Self-driving cars rely on a variety of sensors to understand their surroundings.","자율주행 자동차는 주변 환경을 이해하기 위해 다양한 센서에 의존한다."],[5,"Cameras read road signs, detect lanes, and recognize traffic lights.","카메라는 도로 표지판을 읽고, 차선을 감지하며, 신호등을 인식한다."],[6,"LiDAR, a laser-based system, creates a detailed 3D map of the surroundings, while radar uses radio waves to detect objects and measure their distance and speed.","레이저 기반 시스템인 라이다(LiDAR)는 주변 환경의 상세한 3D 지도를 만드는 반면, 레이더(radar)는 전파를 사용해 물체를 감지하고 그 거리와 속도를 측정한다."],[7,"Along with its sensors, GPS helps the vehicle locate itself.","센서와 함께, GPS는 차량이 자신의 위치를 파악하도록 도와준다."],[8,"Together, these signals give the car a detailed picture of the road.","이 신호들이 함께 차에게 도로의 상세한 그림을 제공한다."]],"w":"5~6번에서 카메라, 라이다, 레이더가 정보를 모으고 7번에서 GPS도 위치를 알려 줌. 8번의 these signals는 그 센서와 GPS의 정보. 운전자나 승객이 보내는 것이 아님.","c":2},"h":"65373d7468"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The system identifies objects, predicts what might happen, and responds by steering, accelerating, or braking to follow traffic rules and keep passengers safe.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시스템은 물체를 식별하고, 무슨 일이 일어날지 예측하며, 교통 규칙을 따르고 승객을 안전하게 지키기 위해 핸들 조작, 가속, 또는 제동으로 반응한다.","opts":["시스템은 승객에게 운전 방법을 알려 주고 교통 규칙을 가르친다.","시스템은 물체를 피하기 위해 항상 멈춰 있다.","시스템은 물체를 알아보고 일어날 일을 예측해, 핸들·가속·제동으로 대응하여 규칙을 지키고 승객을 안전하게 한다.","시스템은 운전자가 핸들을 잡도록 신호를 보낸다."],"r":{"a":"3) 시스템은 물체를 알아보고 일어날 일을 예측해, 핸들·가속·제동으로 대응하여 규칙을 지키고 승객을 안전하게 한다.","ev":"10번 문장","s":[[10,"The system identifies objects, predicts what might happen, and responds by steering, accelerating, or braking to follow traffic rules and keep passengers safe.","시스템은 물체를 식별하고, 무슨 일이 일어날지 예측하며, 교통 규칙을 따르고 승객을 안전하게 지키기 위해 핸들 조작, 가속, 또는 제동으로 반응한다."]],"w":"10번은 identify(식별), predict(예측), respond(반응)의 세 동작과 반응 방법(steering, accelerating, braking), 목적(규칙 준수·승객 안전)을 말함. 나머지는 운전자가 직접 운전하거나 본문에 없는 내용.","c":3},"h":"6692b4a901"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["자율주행 자동차는 카메라만으로 주변을 파악한다.","자율주행 자동차는 운전자가 페달을 밟아야 작동한다.","자율주행 자동차의 기본 개념은 핸들에 손도 없고 페달에 발도 없는 부드러운 주행이다.","자율주행 자동차는 일상의 일부가 될 수 없다."],"opts":["Self-driving cars understand their surroundings with cameras only.","Self-driving cars work only when the driver presses the pedals.","The idea behind self-driving cars is a smooth ride with no hands on the wheel and no feet on the pedals.","Self-driving cars cannot become a part of everyday life."],"r":{"a":"3) The idea behind self-driving cars is a smooth ride with no hands on the wheel and no feet on the pedals. (자율주행 자동차의 기본 개념은 핸들에 손도 없고 페달에 발도 없는 부드러운 주행이다.)","ev":"1~2번, 5~6번, 12번 문장","s":[[1,"No hands on the wheel, no feet on the pedals, just a smooth ride to school or work.","핸들에 손도 없고, 페달에 발도 없이, 학교나 직장까지 그저 부드러운 주행만 있다."],[2,"This is the idea behind self-driving cars.","이것이 자율주행 자동차의 기본 개념이다."],[5,"Cameras read road signs, detect lanes, and recognize traffic lights.","카메라는 도로 표지판을 읽고, 차선을 감지하며, 신호등을 인식한다."],[6,"LiDAR, a laser-based system, creates a detailed 3D map of the surroundings, while radar uses radio waves to detect objects and measure their distance and speed.","레이저 기반 시스템인 라이다(LiDAR)는 주변 환경의 상세한 3D 지도를 만드는 반면, 레이더(radar)는 전파를 사용해 물체를 감지하고 그 거리와 속도를 측정한다."],[12,"As the systems become better and more reliable, self-driving cars are more likely to become a part of everyday life.","시스템이 더 좋고 더 믿을 만해짐에 따라, 자율주행 자동차는 일상의 일부가 될 가능성이 더 높다."]],"w":"1~2번에서 핸들에 손도 없고 페달에 발도 없는 부드러운 주행이 자율주행 자동차의 기본 개념이라고 함. ①은 5~6번(카메라, 라이다, 레이더 등 다양한 센서)과, ②는 1번과, ④는 12번(일상의 일부가 될 가능성이 높음)과 맞지 않음.","c":3},"h":"1752ff8da8"},{"n":9,"t":"sum","q":"LiDAR, a (A)-based system, creates a detailed 3D (B) of the surroundings.","ko":"(A) 기반 시스템인 라이다(LiDAR)는 주변 환경의 상세한 3D (B)을(를) 만든다.","oko":["(A) 소리 / (B) 지도","(A) 레이저 / (B) 노래","(A) 물 / (B) 지도","(A) 레이저 / (B) 지도","(A) 소리 / (B) 노래"],"opts":["(A) sound / (B) map","(A) laser / (B) song","(A) water / (B) map","(A) laser / (B) map","(A) sound / (B) song"],"r":{"a":"4) (A) laser / (B) map ((A) 레이저 / (B) 지도)","ev":"6번 문장","s":[[6,"LiDAR, a laser-based system, creates a detailed 3D map of the surroundings, while radar uses radio waves to detect objects and measure their distance and speed.","레이저 기반 시스템인 라이다(LiDAR)는 주변 환경의 상세한 3D 지도를 만드는 반면, 레이더(radar)는 전파를 사용해 물체를 감지하고 그 거리와 속도를 측정한다."]],"w":"6번: 레이저 기반(laser-based) 시스템인 라이다는 주변 환경의 상세한 3D 지도(map)를 만든다.","c":4},"h":"985f351439"},{"n":10,"t":"fill","q":"Self-driving technology is [A] quickly with [B] in AI.","ko":"자율주행 기술은 인공지능의 [B]과(와) 함께 빠르게 [A].","bank":["advancing","improvements","smooth","powerful","detailed","safe"],"bko":{"advancing":"나아가고 있다(advance의 -ing)","improvements":"발전","smooth":"부드러운","powerful":"강력한","detailed":"상세한","safe":"안전한"},"r":{"a":"[A] advancing (나아가고 있다(advance의 -ing)), [B] improvements (발전)","ev":"11번 문장","s":[[11,"Self-driving technology is advancing quickly with improvements in AI.","자율주행 기술은 인공지능의 발전과 함께 빠르게 나아가고 있다."]],"w":"11번: 자율주행 기술은 인공지능의 발전(improvements)과 함께 빠르게 나아가고 있다(advancing).","c":null},"h":"f130d56cef"}]},{"u":8,"id":"b4-08-3","no":3,"ko":"유명인이 하지도 않은 말을 하는 영상의 정체","items":[{"n":1,"t":"tf","q":"Deepfakes are realistic but fake media created with deep learning.","ko":"딥페이크는 딥러닝으로 만들어진, 현실적이지만 가짜인 미디어이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Deepfakes are realistic but fake media created with a powerful AI technique called deep learning.","딥페이크는 딥러닝이라는 강력한 인공지능 기술로 만들어진, 현실적이지만 가짜인 미디어이다."]],"w":"3번에서 딥페이크의 정의가 realistic but fake media created with ... deep learning이라고 나옴.","c":"T"},"h":"14a59cbfc8"},{"n":2,"t":"tf","q":"The passage says deepfakes cannot be used in movies.","ko":"본문은 딥페이크를 영화에서 사용할 수 없다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"For example, deepfakes can bring historical figures back to life or create complex special effects in movies.","예를 들어, 딥페이크는 역사 속 인물을 되살리거나 영화에서 복잡한 특수 효과를 만들어 낼 수 있다."]],"w":"8번에서 딥페이크는 영화에서 복잡한 특수 효과를 만드는 데 쓸 수 있다고 함. 사용할 수 없다는 말은 반대.","c":"F"},"h":"6919f62f9c"},{"n":3,"t":"tf","q":"Deepfakes can be used to spread fake news or to bully people online.","ko":"딥페이크는 가짜 뉴스를 퍼뜨리거나 온라인에서 사람들을 괴롭히는 데 사용될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"It is often used to spread false information, known as fake news, or to bully people online.","그것은 종종 가짜 뉴스로 알려진 허위 정보를 퍼뜨리거나 온라인에서 사람들을 괴롭히는 데 사용된다."]],"w":"10번에서 spread false information, known as fake news(가짜 뉴스), 또는 bully people online(온라인에서 괴롭힘)에 사용된다고 함.","c":"T"},"h":"05000df426"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... recreate a person's image and voice in a very realistic way.)","ko":"... 사람의 이미지와 목소리를 매우 ( ) 방식으로 재현한다","opts":["어두운","느린","실제 같은","슬픈"],"word":"realistic","r":{"a":"3) 실제 같은","ev":"5번 문장","s":[[5,"Using these learned patterns, the computer teaches itself to recreate a person’s image and voice in a very realistic way.","이렇게 학습한 패턴을 사용해, 컴퓨터는 스스로 학습하여 사람의 이미지와 목소리를 매우 현실적으로 재현한다."]],"w":"5번에서 사람의 이미지와 목소리를 진짜처럼 재현한다는 뜻. realistic = 현실적인, 실제 같은. 어둡거나 느린 것이 아님.","c":3},"h":"68cb5770a1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... it can swap faces and alter voices in a video.)","ko":"... 영상 속에서 얼굴을 바꾸고 목소리를 ( ) 수 있다","opts":["지키다","바꾸다, 변조하다","녹음하다","분석하다"],"word":"alter","r":{"a":"2) 바꾸다, 변조하다","ev":"6번 문장","s":[[6,"As a result, it can swap faces and alter voices in a video.","그 결과, 컴퓨터는 영상 속에서 얼굴을 바꾸고 목소리를 변조할 수 있다."]],"w":"6번에서 swap faces(얼굴을 바꾸다)와 나란히 쓰인 alter voices는 목소리를 바꾸는 것. alter = 바꾸다, 변조하다. 지키거나 녹음하는 것이 아님.","c":2},"h":"c30d98a14e"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis might be a “deepfake.”","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 '딥페이크'일지도 모른다.","opts":["유명한 사람이 한 적 없는 말을 하는 영상","유명한 사람의 인터뷰 영상","영화 속 특수 효과 장면","딥러닝 기술의 이름"],"r":{"a":"1) 유명한 사람이 한 적 없는 말을 하는 영상","ev":"1~2번 문장","s":[[1,"Have you ever seen a video where a famous person said something they never actually said?","유명한 사람이 실제로는 한 적 없는 말을 하는 영상을 본 적이 있는가?"],[2,"This might be a “deepfake.”","이것은 '딥페이크'일지도 모른다."]],"w":"2번의 This는 바로 앞 1번에서 말한, 유명한 사람이 실제로는 한 적 없는 말을 하는 영상. 그런 영상이 딥페이크일지도 모른다는 내용.","c":1,"k":"This = 유명한 사람이 한 적 없는 말을 하는 영상"},"pron":"This","h":"f8253958a1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While deepfakes offer exciting new possibilities, their risks cannot be ignored.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"딥페이크는 흥미로운 새로운 가능성을 제공하지만, 그 위험성은 무시될 수 없다.","opts":["딥페이크는 흥미로운 새 가능성이 있지만, 그 위험도 무시해서는 안 된다.","딥페이크는 위험이 없어서 흥미로운 가능성만 있다.","딥페이크는 위험하기 때문에 가능성을 말할 필요가 없다.","딥페이크의 위험은 흥미로운 가능성 덕분에 사라진다."],"r":{"a":"1) 딥페이크는 흥미로운 새 가능성이 있지만, 그 위험도 무시해서는 안 된다.","ev":"11번 문장","s":[[11,"While deepfakes offer exciting new possibilities, their risks cannot be ignored.","딥페이크는 흥미로운 새로운 가능성을 제공하지만, 그 위험성은 무시될 수 없다."]],"w":"While은 '~이긴 하지만'. 앞은 흥미로운 가능성(좋은 점), 뒤는 위험을 무시할 수 없다는 말. 위험이 없다거나 가능성만 중요하다는 뜻이 아님.","c":1},"h":"fe0d2bfddb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["딥페이크 기술의 모든 사용은 긍정적이다.","딥페이크는 컴퓨터 기술 없이 만들어진다.","딥페이크 기술의 모든 사용이 긍정적인 것은 아니다.","딥러닝은 적은 수의 사진으로만 작동한다."],"opts":["All uses of deepfake technology are positive.","Deepfakes are made without any computer technology.","Not all uses of deepfake technology are positive.","Deep learning works only with a few photos."],"r":{"a":"3) Not all uses of deepfake technology are positive. (딥페이크 기술의 모든 사용이 긍정적인 것은 아니다.)","ev":"3~4번, 9번 문장","s":[[3,"Deepfakes are realistic but fake media created with a powerful AI technique called deep learning.","딥페이크는 딥러닝이라는 강력한 인공지능 기술로 만들어진, 현실적이지만 가짜인 미디어이다."],[4,"Deep learning allows computers to analyze large amounts of photos, videos, and audio recordings to find patterns in faces, voices, and movements.","딥러닝은 컴퓨터가 방대한 양의 사진, 영상, 음성 녹음을 분석해 얼굴, 목소리, 움직임의 패턴을 찾도록 해 준다."],[9,"However, not all uses of this technology are positive.","그러나 이 기술의 모든 사용이 긍정적인 것은 아니다."]],"w":"9번에서 이 기술의 모든 사용이 긍정적인 것은 아니라고 함. ①은 9번과 반대, ②는 3번(딥러닝이라는 인공지능 기술로 만들어짐)과 다르고, ④는 4번(방대한 양의 사진, 영상, 음성)과 다름.","c":3},"h":"831f0a1807"},{"n":9,"t":"sum","q":"The (A) of this technology depends on how (B) we use it.","ko":"이 기술의 (A)은(는) 우리가 얼마나 (B) 사용하느냐에 달려 있다.","oko":["(A) 과거 / (B) 빠르게","(A) 미래 / (B) 빠르게","(A) 과거 / (B) 책임감 있게","(A) 가격 / (B) 시끄럽게","(A) 미래 / (B) 책임감 있게"],"opts":["(A) past / (B) quickly","(A) future / (B) quickly","(A) past / (B) responsibly","(A) price / (B) loudly","(A) future / (B) responsibly"],"r":{"a":"5) (A) future / (B) responsibly ((A) 미래 / (B) 책임감 있게)","ev":"12번 문장","s":[[12,"The future of this technology depends on how responsibly we use it.","이 기술의 미래는 우리가 얼마나 책임감 있게 사용하느냐에 달려 있다."]],"w":"12번: 이 기술의 미래(future)는 우리가 얼마나 책임감 있게(responsibly) 사용하느냐에 달려 있다.","c":5},"h":"e6fcb0e627"},{"n":10,"t":"fill","q":"Deep learning allows computers to [A] large amounts of photos, videos, and audio recordings to find patterns in faces, voices, and [B].","ko":"딥러닝은 컴퓨터가 방대한 양의 사진, 영상, 음성 녹음을 [A] 얼굴, 목소리, [B]의 패턴을 찾도록 해 준다.","bank":["analyze","movements","fake","historical","quickly","special"],"bko":{"analyze":"분석하다","movements":"움직임","fake":"가짜의","historical":"역사 속의","quickly":"빠르게","special":"특별한"},"r":{"a":"[A] analyze (분석하다), [B] movements (움직임)","ev":"4번 문장","s":[[4,"Deep learning allows computers to analyze large amounts of photos, videos, and audio recordings to find patterns in faces, voices, and movements.","딥러닝은 컴퓨터가 방대한 양의 사진, 영상, 음성 녹음을 분석해 얼굴, 목소리, 움직임의 패턴을 찾도록 해 준다."]],"w":"4번: 딥러닝은 컴퓨터가 방대한 양의 사진, 영상, 음성 녹음을 분석해(analyze) 얼굴, 목소리, 움직임(movements)의 패턴을 찾도록 해 준다.","c":null},"h":"5718ed6b4a"}]},{"u":8,"id":"b4-08-4","no":4,"ko":"땅속이 아닌 실험실에서 다이아몬드를 만든다고?","items":[{"n":1,"t":"tf","q":"For a long time, diamonds could only be found deep underground.","ko":"오랫동안, 다이아몬드는 깊은 땅속에서만 발견될 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"For a long time, diamonds could only be found deep underground.","오랫동안, 다이아몬드는 깊은 땅속에서만 발견될 수 있었다."]],"w":"1번에 같은 문장이 그대로 나옴. 2번 Today, however부터 실험실에서도 만들 수 있게 됨.","c":"T"},"h":"e73c2438da"},{"n":2,"t":"tf","q":"Lab-grown diamonds are usually more expensive than natural diamonds.","ko":"실험실에서 키운 다이아몬드는 보통 천연 다이아몬드보다 더 비싸다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"Not only are they usually less expensive, but they also cause less damage to the environment.","그것들은 보통 값이 덜 비쌀 뿐만 아니라, 환경에 주는 피해도 더 적다."]],"w":"13번에서 실험실 다이아몬드는 보통 less expensive(덜 비싸다)라고 함. 더 비싸다는 말은 반대.","c":"F"},"h":"3a7e50c0bf"},{"n":3,"t":"tf","q":"Scientists place a tiny diamond seed in a machine that creates similar conditions.","ko":"과학자들은 비슷한 조건을 만들어 내는 기계 안에 아주 작은 다이아몬드 씨앗을 넣는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Scientists place a tiny diamond seed in a machine that creates similar conditions.","과학자들은 비슷한 조건을 만들어 내는 기계 안에 아주 작은 다이아몬드 씨앗을 넣는다."]],"w":"8번에 같은 문장이 그대로 나옴. 씨앗을 넣는 것이 실험실 다이아몬드 만들기의 첫 단계.","c":"T"},"h":"dcc4b15e0d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... heat and pressure bond the atoms into hard crystals.)","ko":"... 열과 압력이 그 원자들을 단단한 결정으로 ( )","opts":["분리하다","결합시키다","녹이다","숨기다"],"word":"bond","r":{"a":"2) 결합시키다","ev":"5번 문장","s":[[5,"Over millions of years, heat and pressure bond the atoms into hard crystals.","수백만 년에 걸쳐, 열과 압력이 그 원자들을 단단한 결정으로 결합시킨다."]],"w":"5번에서 흩어진 원자들이 열과 압력으로 단단한 결정이 된다는 뜻. bond = 결합시키다, 붙이다. 분리하거나 녹이는 것은 반대.","c":2},"h":"30f54fd5a7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... avoid moral problems related to diamond mining.)","ko":"... 다이아몬드 채굴과 관련된 ( ) 문제를 피하다","opts":["경제적인","법적인","기술적인","도덕적인"],"word":"moral","r":{"a":"4) 도덕적인","ev":"14번 문장","s":[[14,"They also help companies avoid moral problems related to diamond mining.","그것들은 또한 기업이 다이아몬드 채굴과 관련된 도덕적 문제를 피하도록 돕는다."]],"w":"14번의 moral problems related to diamond mining은 채굴과 관련된 옳고 그름의 문제. moral = 도덕적인. 경제적이나 기술적인 문제가 아님.","c":4},"h":"550ce1b738"},{"n":6,"t":"ref","q":"What does the underlined \"These atoms\" refer to?\nThese atoms settle onto the seed and build the diamond crystal layer by layer.","ko":"밑줄 친 These atoms가 가리키는 것은?","sko":"이 원자들은 씨앗 위에 자리 잡아 다이아몬드 결정을 한 층 한 층 쌓아 올린다.","opts":["가열된 기체가 방출한 탄소 원자들","다이아몬드 씨앗들","천연 다이아몬드 조각들","마그마 속 가스 방울들"],"r":{"a":"1) 가열된 기체가 방출한 탄소 원자들","ev":"9~10번 문장","s":[[9,"Inside the machine, heated carbon-rich gases release carbon atoms.","기계 안에서, 가열된 탄소가 풍부한 기체가 탄소 원자를 방출한다."],[10,"These atoms settle onto the seed and build the diamond crystal layer by layer.","이 원자들은 씨앗 위에 자리 잡아 다이아몬드 결정을 한 층 한 층 쌓아 올린다."]],"w":"10번의 These atoms는 바로 앞 9번에서 기계 안의 가열된 탄소가 풍부한 기체가 방출한 탄소 원자들. 그 원자들이 씨앗 위에 자리 잡아 결정을 쌓음.","c":1,"k":"These atoms = 가열된 기체가 방출한 탄소 원자들"},"pron":"These atoms","h":"412591f8ed"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Lab-grown diamonds copy this process.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"실험실에서 키운 다이아몬드는 이 과정을 따라 한다.","opts":["실험실에서 키운 다이아몬드는 천연 다이아몬드가 만들어지는 과정을 따라 한다.","실험실에서 키운 다이아몬드는 천연 다이아몬드와 전혀 다른 방법으로 만들어진다.","천연 다이아몬드는 실험실의 과정을 따라 만들어진다.","실험실에서 키운 다이아몬드는 화산 안에서 만들어진다."],"r":{"a":"1) 실험실에서 키운 다이아몬드는 천연 다이아몬드가 만들어지는 과정을 따라 한다.","ev":"4~7번 문장","s":[[4,"Natural diamonds form from carbon atoms deep inside the Earth.","천연 다이아몬드는 지구 깊은 곳의 탄소 원자로부터 형성된다."],[5,"Over millions of years, heat and pressure bond the atoms into hard crystals.","수백만 년에 걸쳐, 열과 압력이 그 원자들을 단단한 결정으로 결합시킨다."],[6,"When magma rises from deep underground as a result of volcanic activity, it carries diamonds upward toward Earth’s surface.","화산 활동의 결과로 마그마가 깊은 땅속에서 올라올 때, 그것은 다이아몬드를 지구 표면 쪽으로 위로 실어 나른다."],[7,"Lab-grown diamonds copy this process.","실험실에서 키운 다이아몬드는 이 과정을 따라 한다."]],"w":"this process는 4~6번에서 설명한 천연 다이아몬드가 형성되고 올라오는 과정. copy는 따라 하다. 새로운 방법으로 바꾼다거나 천연과 전혀 다르다는 뜻이 아님.","c":1},"h":"60ba780145"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["다이아몬드는 지구 표면에서 화산 가스로 생산된다.","마그마는 깊은 땅속에서 올라올 때 다이아몬드를 지구 표면 쪽으로 실어 나른다.","천연 다이아몬드는 단 며칠 만에 생겨난다.","열과 압력은 단단한 결정을 탄소 원자로 쪼갠다."],"opts":["Diamonds are produced from volcanic gases on Earth's surface.","Magma carries diamonds upward toward Earth's surface when it rises from deep underground.","Natural diamonds form in just a few days.","Heat and pressure break hard crystals into carbon atoms."],"r":{"a":"2) Magma carries diamonds upward toward Earth's surface when it rises from deep underground. (마그마는 깊은 땅속에서 올라올 때 다이아몬드를 지구 표면 쪽으로 실어 나른다.)","ev":"5~6번 문장","s":[[5,"Over millions of years, heat and pressure bond the atoms into hard crystals.","수백만 년에 걸쳐, 열과 압력이 그 원자들을 단단한 결정으로 결합시킨다."],[6,"When magma rises from deep underground as a result of volcanic activity, it carries diamonds upward toward Earth’s surface.","화산 활동의 결과로 마그마가 깊은 땅속에서 올라올 때, 그것은 다이아몬드를 지구 표면 쪽으로 위로 실어 나른다."]],"w":"6번에서 마그마가 깊은 땅속에서 올라올 때 다이아몬드를 지구 표면 쪽으로 실어 나른다고 함. ①은 화산 가스가 아니라 5번처럼 탄소 원자가 열과 압력으로 결정이 되는 것이고, ③은 5번(수백만 년에 걸쳐)과 다르며, ④는 5번(원자를 결정으로 결합시킴)과 반대.","c":2},"h":"2a41a036b7"},{"n":9,"t":"sum","q":"Today, diamonds can also be (A) in (B).","ko":"오늘날에는 다이아몬드를 (B)에서 (A) 수도 있다.","oko":["(A) 만들 / (B) 바다","(A) 발견할 / (B) 바다","(A) 발견할 / (B) 실험실","(A) 팔 / (B) 바다","(A) 만들 / (B) 실험실"],"opts":["(A) made / (B) oceans","(A) found / (B) oceans","(A) found / (B) laboratories","(A) sold / (B) oceans","(A) made / (B) laboratories"],"r":{"a":"5) (A) made / (B) laboratories ((A) 만들 / (B) 실험실)","ev":"2번 문장","s":[[2,"Today, however, they can also be made in laboratories.","그러나 오늘날에는 실험실에서도 만들어질 수 있다."]],"w":"2번: 그러나 오늘날에는 다이아몬드를 실험실(laboratories)에서도 만들 수(made) 있다.","c":5},"h":"d0744ed2a9"},{"n":10,"t":"fill","q":"Many people [A] lab-grown diamonds for several [B].","ko":"많은 사람들이 여러 가지 [B](으)로 실험실에서 키운 다이아몬드를 [A].","bank":["choose","reasons","popularity","crystal","magma","mining"],"bko":{"choose":"선택한다(선택하다)","reasons":"이유","popularity":"인기","crystal":"결정","magma":"마그마","mining":"채굴"},"r":{"a":"[A] choose (선택한다(선택하다)), [B] reasons (이유)","ev":"12번 문장","s":[[12,"Many people choose lab-grown diamonds for several reasons.","많은 사람들이 여러 가지 이유로 실험실에서 키운 다이아몬드를 선택한다."]],"w":"12번: 많은 사람들이 여러 가지 이유(reasons)로 실험실에서 키운 다이아몬드를 선택한다(choose).","c":null},"h":"fa73aa87f6"}]},{"u":9,"id":"b4-09-1","no":1,"ko":"넥타이 색과 브로치, 지도자의 옷이 하는 말은?","items":[{"n":1,"t":"tf","q":"In the United States, presidents carefully choose the colors of their ties for speeches or debates.","ko":"미국에서 대통령들은 연설이나 토론을 위해 넥타이 색을 신중하게 고른다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장에 presidents carefully choose tie colors for speeches or debates가 그대로 나옴. choose(고르다)의 주어가 대통령이고 이유가 연설·토론이라 선지와 일치.","c":"T","ev":"2번 문장","s":[[2,"In the United States, presidents carefully choose tie colors for speeches or debates.","미국에서 대통령들은 연설이나 토론을 위해 넥타이 색을 신중하게 고른다."]]},"h":"c42347de07"},{"n":2,"t":"tf","q":"Democrats often wear a red tie to show calmness and trust.","ko":"민주당원들은 침착함과 신뢰를 보여 주려고 흔히 빨간 넥타이를 맨다.","r":{"a":"F (본문과 다른 내용)","w":"5번 문장에서 민주당원(Democrats)은 파란(blue) 넥타이로 침착함과 신뢰를 보여 줌. 빨간 넥타이는 공화당의 색이라 색이 바뀌어서 틀림.","c":"F","ev":"5번 문장","s":[[5,"Democrats often wear a blue tie, which shows calmness and trust.","민주당원들은 흔히 파란 넥타이를 매는데, 이는 침착함과 신뢰를 보여 준다."]]},"h":"0e1264d208"},{"n":3,"t":"tf","q":"A leader may wear a purple tie to show unity between political parties.","ko":"지도자는 정당 간의 화합을 보여 주기 위해 보라색 넥타이를 맬 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장에 a leader wears a purple tie to show unity between political parties가 있음. 보라색은 정당 사이의 화합이라 선지와 일치.","c":"T","ev":"6번 문장","s":[[6,"Sometimes, a leader wears a purple tie to show unity between political parties.","때때로 지도자는 정당 간의 화합을 보여 주기 위해 보라색 넥타이를 맨다."]]},"h":"4112a71887"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For many leaders, fashion is more than decoration, as it sends quiet but powerful messages to the public.)","ko":"많은 지도자들에게 패션은 ( ) 이상의 것이며, 대중에게 조용하지만 강력한 메시지를 전달한다.","opts":["규칙","의견","장식","경쟁"],"word":"decoration","r":{"a":"3) 장식","w":"1번 문장은 패션이 decoration 이상이라고 한 뒤, 메시지를 보낸다고 이어짐. 겉을 꾸미는 ‘장식’이 맞고, 규칙·의견·경쟁은 문맥과 관계없음.","c":3,"ev":"1번 문장","s":[[1,"For many leaders, fashion is more than decoration, as it sends quiet but powerful messages to the public.","많은 지도자들에게 패션은 장식 이상의 것이며, 대중에게 조용하지만 강력한 메시지를 전달한다."]]},"h":"9f5992283d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (With this one piece of jewelry, she quietly expressed friendship and respect.)","ko":"이 보석 하나로 그녀는 우정과 존중을 조용히 ( ).","opts":["표현했다","숨겼다","요구했다","거절했다"],"word":"expressed","r":{"a":"1) 표현했다","w":"11번은 브로치 하나로 우정과 존중을 조용히 ‘나타냈다’는 내용. express(표현하다)가 맞음. 숨기거나 요구하거나 거절했다는 말은 앞 내용과 맞지 않음.","c":1,"ev":"11번 문장","s":[[11,"With this one piece of jewelry, she quietly expressed friendship and respect.","이 보석 하나로 그녀는 우정과 존중을 조용히 표현했다."]]},"h":"3e277d1b83"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nIn Britain, Queen Elizabeth II was famous for her “brooch diplomacy.”","ko":"밑줄 친 her가 가리키는 것은?","sko":"영국에서 엘리자베스 2세 여왕은 ‘브로치 외교’로 유명했다.","opts":["엘리자베스 2세 여왕","영국 국민","미국 대통령","캐나다 지도자들"],"r":{"a":"1) 엘리자베스 2세 여왕","w":"7번에서 영국에서 엘리자베스 2세 여왕(Queen Elizabeth II)이 her “brooch diplomacy”(그녀의 브로치 외교)로 유명했다고 함. her는 여왕을 가리킴.","c":1,"ev":"7번 문장","s":[[7,"In Britain, Queen Elizabeth II was famous for her “brooch diplomacy.”","영국에서 엘리자베스 2세 여왕은 ‘브로치 외교’로 유명했다."]],"k":"her = 엘리자베스 2세 여왕"},"pron":"her","h":"fd6d5b96fb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Though simple, fashion choices like these help people understand what leaders want to say and how they want to be seen.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"소박하지만 이와 같은 패션 선택은 지도자들이 무엇을 말하고 싶은지, 그리고 어떻게 보이고 싶은지를 사람들이 이해하도록 돕는다.","opts":["지도자는 단순한 옷만 입어야 사람들이 그의 말을 이해한다.","사람들은 지도자의 패션보다 그가 하는 말에 더 관심이 많다.","화려한 패션일수록 지도자의 생각이 더 잘 전달된다.","겉보기엔 소박한 패션 선택도 지도자가 전하고 싶은 말과 보이고 싶은 모습을 알게 해 준다."],"r":{"a":"4) 겉보기엔 소박한 패션 선택도 지도자가 전하고 싶은 말과 보이고 싶은 모습을 알게 해 준다.","w":"Though simple은 ‘소박해 보여도’라는 뜻이고, help people understand는 사람들이 이해하게 돕는다는 뜻. 소박한 패션도 지도자의 뜻을 알려 준다는 4번이 맞음. 화려할수록 좋다거나 말이 더 중요하다는 내용은 없음.","c":4,"ev":"12번 문장","s":[[12,"Though simple, fashion choices like these help people understand what leaders want to say and how they want to be seen.","소박하지만 이와 같은 패션 선택은 지도자들이 무엇을 말하고 싶은지, 그리고 어떻게 보이고 싶은지를 사람들이 이해하도록 돕는다."]]},"h":"c57602e81e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["파란색은 공화당의 색이다.","빨간 넥타이는 자신감과 강인함을 나타낸다.","미국 대통령은 넥타이 색을 생각 없이 고른다.","보라색 넥타이는 한 정당의 힘을 보여 주려고 맨다."],"opts":["Blue is the color of the Republican Party.","A red tie suggests confidence and strength.","Presidents in the United States choose tie colors without thinking.","A purple tie is worn to show the power of one party."],"r":{"a":"2) A red tie suggests confidence and strength. (빨간 넥타이는 자신감과 강인함을 나타낸다.)","w":"4번에서 빨간 넥타이는 자신감과 강인함을 나타낸다고 함. ①은 3번(빨간색이 공화당의 색)과 다르고, ③은 2번(넥타이 색을 신중하게 고름)과 반대, ④는 6번(정당 간의 화합을 보여 주려고 보라색을 맴)과 다름.","c":2,"ev":"2~4번, 6번 문장","s":[[2,"In the United States, presidents carefully choose tie colors for speeches or debates.","미국에서 대통령들은 연설이나 토론을 위해 넥타이 색을 신중하게 고른다."],[3,"Red is the color of the Republican Party.","빨간색은 공화당의 색이다."],[4,"A red tie suggests confidence and strength.","빨간 넥타이는 자신감과 강인함을 나타낸다."],[6,"Sometimes, a leader wears a purple tie to show unity between political parties.","때때로 지도자는 정당 간의 화합을 보여 주기 위해 보라색 넥타이를 맨다."]]},"h":"64cf8bdb32"},{"n":9,"t":"sum","q":"The maple (A) is the symbol of (B).","ko":"단풍 (A)은(는) (B)의 상징이다.","oko":["(A) 꽃 / (B) 캐나다","(A) 잎 / (B) 영국","(A) 꽃 / (B) 영국","(A) 잎 / (B) 프랑스","(A) 잎 / (B) 캐나다"],"opts":["(A) flower / (B) Canada","(A) leaf / (B) Britain","(A) flower / (B) Britain","(A) leaf / (B) France","(A) leaf / (B) Canada"],"r":{"a":"5) (A) leaf / (B) Canada ((A) 잎 / (B) 캐나다)","w":"10번: 단풍잎(maple leaf)은 캐나다(Canada)의 상징이다.","c":5,"ev":"10번 문장","s":[[10,"The maple leaf is the symbol of Canada.","단풍잎은 캐나다의 상징이다."]]},"h":"d3ccc20274"},{"n":10,"t":"fill","q":"She [A] jewelry that had [B] meaning.","ko":"그녀는 [B] 의미가 있는 보석을 [A].","bank":["selected","special","quietly","publicly","together","often"],"bko":{"selected":"골랐다(select의 과거형)","special":"특별한","quietly":"조용히","publicly":"공개적으로","together":"함께","often":"자주"},"r":{"a":"[A] selected (골랐다(select의 과거형)), [B] special (특별한)","w":"8번: 그녀는 특별한(special) 의미가 있는 보석을 골랐다(selected).","c":null,"ev":"8번 문장","s":[[8,"She selected jewelry that had special meaning.","그녀는 특별한 의미가 있는 보석을 골랐다."]]},"h":"46d315a13c"}]},{"u":9,"id":"b4-09-2","no":2,"ko":"외교관이 체포되지 않는 이유는?","items":[{"n":1,"t":"tf","q":"A diplomat is an official who works in a foreign country to represent their own government.","ko":"외교관은 자기 나라 정부를 대표하기 위해 외국에서 일하는 공무원이다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장이 그대로 이 내용임. represent(대표하다)의 대상이 자기 나라 정부라 선지와 일치.","c":"T","ev":"1번 문장","s":[[1,"A diplomat is an official who works in a foreign country to represent their own government.","외교관은 자기 나라 정부를 대표하기 위해 외국에서 일하는 공무원이다."]]},"h":"7010d06141"},{"n":2,"t":"tf","q":"In the past, diplomats were safe from punishment even when they delivered bad news that angered the host government.","ko":"과거에 외교관은 주재국 정부를 화나게 하는 나쁜 소식을 전해도 처벌받지 않았다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 나쁜 소식이나 주재국 정부를 화나게 하는 메시지를 전하면 직접 처벌받을 수 있었다고 함. 처벌받지 않았다는 선지는 반대임.","c":"F","ev":"4번 문장","s":[[4,"If a diplomat delivered bad news or messages that angered the host government, they could be punished directly.","외교관이 나쁜 소식이나 주재국 정부를 화나게 하는 메시지를 전하면, 그들은 직접 처벌받을 수 있었다."]]},"h":"67a967d0a7"},{"n":3,"t":"tf","q":"Diplomatic immunity helps diplomats avoid unjust treatment or political pressure.","ko":"외교관 면책 특권은 외교관이 부당한 대우나 정치적 압력을 피하도록 돕는다.","r":{"a":"T (본문과 맞는 내용)","w":"10번 문장에 Because of diplomatic immunity, diplomats can avoid unjust treatment or political pressure가 있음. 면책 특권 덕분에 피할 수 있다는 뜻이라 일치.","c":"T","ev":"10번 문장","s":[[10,"Because of diplomatic immunity, diplomats can avoid unjust treatment or political pressure.","외교관 면책 특권 덕분에 외교관은 부당한 대우나 정치적 압력을 피할 수 있다."]]},"h":"6a5a42c7ab"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some were accused of spying or even arrested on false charges.)","ko":"일부는 간첩 혐의로 ( ) 심지어 거짓 혐의로 체포되기도 했다.","opts":["보호받았다","고발당했다","초대받았다","승진했다"],"word":"accused","r":{"a":"2) 고발당했다","w":"accused of spying은 ‘간첩 짓을 했다고 고발당했다’는 뜻이고, 뒤에 arrested(체포되었다)가 이어짐. accuse(고발하다)가 맞고, 보호·초대·승진은 이어지는 체포와 맞지 않음.","c":2,"ev":"5번 문장","s":[[5,"Some were accused of spying or even arrested on false charges.","일부는 간첩 혐의를 받거나 심지어 거짓 혐의로 체포되기도 했다."]]},"h":"f30797e048"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Diplomats can avoid unjust treatment or political pressure.)","ko":"외교관은 ( ) 대우나 정치적 압력을 피할 수 있다.","opts":["공정한","친절한","빠른","부당한"],"word":"unjust","r":{"a":"4) 부당한","w":"unjust는 just(공정한) 앞에 un이 붙은 말로 ‘공정하지 않은, 부당한’이라는 뜻. 10번은 면책 특권이 피하게 해 주는 나쁜 것을 말하므로 부당한이 맞음.","c":4,"ev":"10번 문장","s":[[10,"Because of diplomatic immunity, diplomats can avoid unjust treatment or political pressure.","외교관 면책 특권 덕분에 외교관은 부당한 대우나 정치적 압력을 피할 수 있다."]]},"h":"e85f7d4670"},{"n":6,"t":"ref","q":"What does the underlined \"Their\" refer to?\nTheir job is to maintain peace and build good relationships between countries through communication.","ko":"밑줄 친 Their가 가리키는 것은?","sko":"그들의 임무는 소통을 통해 국가 간의 평화를 유지하고 좋은 관계를 쌓는 것이다.","opts":["외교관들","국가들","주재국 시민들","경찰관들"],"r":{"a":"1) 외교관들","w":"2번의 Their job은 국가 간의 평화를 유지하고 소통을 통해 좋은 관계를 쌓는 임무. 1번에서 설명한 외교관(diplomat)들의 임무.","c":1,"ev":"1~2번 문장","s":[[1,"A diplomat is an official who works in a foreign country to represent their own government.","외교관은 자기 나라 정부를 대표하기 위해 외국에서 일하는 공무원이다."],[2,"Their job is to maintain peace and build good relationships between countries through communication.","그들의 임무는 소통을 통해 국가 간의 평화를 유지하고 좋은 관계를 쌓는 것이다."]],"k":"Their = 외교관들"},"pron":"Their","h":"2540a927a1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Under this protection, diplomats are not subject to the laws of the host country.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 보호 아래에서 외교관은 주재국의 법을 적용받지 않는다.","opts":["외교관은 주재국의 법을 반드시 지켜야 한다.","외교관은 주재국의 법을 적용받지 않는다.","외교관은 주재국에서 새로운 법을 만들 수 있다.","외교관은 자기 나라의 법을 적용받지 않는다."],"r":{"a":"2) 외교관은 주재국의 법을 적용받지 않는다.","w":"be subject to는 ‘~의 적용을 받다’이므로 are not subject to는 ‘적용받지 않는다’. 주재국(host country)의 법을 적용받지 않는다는 2번이 맞음. 자기 나라의 법이 아니라 주재국 법이라는 점에 주의.","c":2,"ev":"8번 문장","s":[[8,"Under this protection, diplomats are not subject to the laws of the host country.","이 보호 아래에서 외교관은 주재국의 법을 적용받지 않는다."]]},"h":"f82e0febf4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["외교관이 법을 어겼다고 의심받으면 현지 경찰이 체포할 수 있다.","외교관의 주요 임무는 외국에서 자기 나라의 법을 지키게 하는 것이다.","과거에는 외교관의 일이 안전했다.","외교관 면책 특권은 현지 경찰이 외교관을 체포하거나 가두지 못하게 한다."],"opts":["Local police can arrest diplomats if they are suspected of breaking a law.","A diplomat’s main job is to make people follow their own country’s laws abroad.","In the past, a diplomat’s job was safe.","Diplomatic immunity stops local police from arresting or jailing diplomats."],"r":{"a":"4) Diplomatic immunity stops local police from arresting or jailing diplomats.","w":"9번에서 외교관이 법을 어겼다는 의심을 받더라도 현지 경찰은 체포하거나 감옥에 가둘 수 없다고 함. 1번은 이와 반대이고, 임무는 평화와 관계 유지(2번), 과거에는 위험했다(3번)고 했으므로 2·3번도 틀림.","c":4,"ev":"9번 문장","s":[[9,"Local police cannot arrest or jail them, even if they are suspected of breaking a law.","현지 경찰은 외교관이 법을 어겼다는 의심을 받더라도 그들을 체포하거나 감옥에 가둘 수 없다."]]},"h":"58941014aa"},{"n":9,"t":"sum","q":"These actions made it hard for countries to (A) or (B) one another.","ko":"이런 행동들은 나라들이 서로 (A) (B) 것을 어렵게 만들었다.","oko":["(A) 대화하거나 / (B) 비난하는","(A) 싸우거나 / (B) 신뢰하는","(A) 싸우거나 / (B) 비난하는","(A) 방문하거나 / (B) 무시하는","(A) 대화하거나 / (B) 신뢰하는"],"opts":["(A) talk / (B) blame","(A) fight / (B) trust","(A) fight / (B) blame","(A) visit / (B) ignore","(A) talk / (B) trust"],"r":{"a":"5) (A) talk / (B) trust ((A) 대화하거나 / (B) 신뢰하는)","w":"6번: 이런 행동들은 나라들이 서로 대화하거나(talk) 신뢰하기(trust) 어렵게 만들었다.","c":5,"ev":"6번 문장","s":[[6,"These actions made it hard for countries to talk or trust one another.","이런 행동들은 나라들이 서로 대화하거나 신뢰하기 어렵게 만들었다."]]},"h":"54e9d01b52"},{"n":10,"t":"fill","q":"They are able to speak honestly, deliver difficult messages without [A], and communicate openly, which is [B] for global peace.","ko":"그들은 솔직하게 말하고, [A] 없이 어려운 메시지를 전달하고, 터놓고 소통할 수 있으며, 이는 세계 평화에 [B].","bank":["fear","essential","ignore","arrest","punish","accused"],"bko":{"fear":"두려움","essential":"필수적이다(필수적인)","ignore":"무시하다","arrest":"체포하다","punish":"처벌하다","accused":"고발당한(accuse의 과거분사)"},"r":{"a":"[A] fear (두려움), [B] essential (필수적이다(필수적인))","w":"11번: 외교관은 솔직하게 말하고, 두려움(fear) 없이 어려운 메시지를 전달하고, 터놓고 소통할 수 있으며, 이는 세계 평화에 필수적(essential)이다.","c":null,"ev":"11번 문장","s":[[11,"They are able to speak honestly, deliver difficult messages without fear, and communicate openly, which is essential for global peace.","그들은 솔직하게 말하고, 두려움 없이 어려운 메시지를 전달하고, 터놓고 소통할 수 있으며, 이는 세계 평화에 필수적이다."]]},"h":"71435cf47c"}]},{"u":9,"id":"b4-09-3","no":3,"ko":"버스 자리를 양보하지 않은 로자 파크스, 무슨 일이?","items":[{"n":1,"t":"tf","q":"In 1955, a law in the United States required Black passengers on buses to give up their seats to white passengers.","ko":"1955년 미국에는 버스에서 흑인 승객이 백인 승객에게 자리를 양보하도록 요구하는 법이 있었다.","r":{"a":"T (본문과 맞는 내용)","w":"7번 문장에 the law required Black passengers to give up their seats to white passengers가 있음. 5번에서 1955년 미국의 사례라고 했으므로 선지와 일치.","c":"T","ev":"7번 문장","s":[[7,"On buses, the law required Black passengers to give up their seats to white passengers.","버스에서 법은 흑인 승객에게 백인 승객에게 자리를 양보하도록 요구했다."]]},"h":"1faf8b20cf"},{"n":2,"t":"tf","q":"After a few days of protest, the U.S. Supreme Court ruled the bus laws illegal.","ko":"며칠 동안의 시위 뒤에 미국 연방 대법원은 버스 법이 불법이라고 판결했다.","r":{"a":"F (본문과 다른 내용)","w":"13번 문장에서 After more than a year of protest(1년이 넘는 시위 끝에) 대법원이 판결했다고 함. 며칠이 아니라 1년이 넘었으므로 틀림.","c":"F","ev":"13번 문장","s":[[13,"After more than a year of protest, the U.S. Supreme Court ruled the bus laws illegal.","1년이 넘는 시위 끝에 미국 연방 대법원은 버스 법이 불법이라고 판결했다."]]},"h":"f39921322f"},{"n":3,"t":"tf","q":"The purpose of civil disobedience is to help others recognize a problem and call for change.","ko":"시민 불복종의 목적은 다른 사람들이 문제를 알아차리고 변화를 요구하도록 돕는 것이다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장에 Its purpose is to help others recognize the problem and call for change가 있음. 시민 불복종의 목적과 그대로 일치.","c":"T","ev":"4번 문장","s":[[4,"Its purpose is to help others recognize the problem and call for change.","그 목적은 다른 사람들이 문제를 알아차리고 변화를 요구하도록 돕는 것이다."]]},"h":"04ac0bcea1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Rosa’s courage made many people realize how wrong the bus rules were.)","ko":"로자의 용기는 많은 사람들이 버스 규칙이 얼마나 잘못되었는지 ( ) 했다.","opts":["무시하다","깨닫다","잊다","반대하다"],"word":"realize","r":{"a":"2) 깨닫다","w":"11번은 로자의 용기 때문에 사람들이 버스 규칙이 얼마나 wrong(잘못된)인지 ‘알게 되었다’는 내용. realize(깨닫다)가 맞고, 무시하거나 잊었다면 뒤 12번의 보이콧 참여로 이어지지 않음.","c":2,"ev":"11번 문장","s":[[11,"Rosa’s courage made many people realize how wrong the bus rules were.","로자의 용기는 많은 사람들이 버스 규칙이 얼마나 잘못되었는지 깨닫게 했다."]]},"h":"771989b4a6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A woman named Rosa Parks calmly refused to give up her seat.)","ko":"로자 파크스라는 여성이 ( ) 자리 양보를 거부했다.","opts":["침착하게","화가 나서","몰래","서둘러"],"word":"calmly","r":{"a":"1) 침착하게","w":"8번은 로자 파크스가 자리 양보를 거부했다는 내용이고, 9번에서 그녀는 앉은 채로 있다가 체포됨. calmly = 침착하게. 화가 나서·몰래·서둘러는 평화로운 시민 불복종(3번)의 모습과 어울리지 않음.","c":1,"ev":"8번 문장","s":[[8,"One day in Montgomery, Alabama, a woman named Rosa Parks calmly refused to give up her seat.","어느 날 앨라배마주 몽고메리에서 로자 파크스라는 여성이 침착하게 자리 양보를 거부했다."]]},"h":"74d1872c96"},{"n":6,"t":"ref","q":"What does the underlined \"Her action\" refer to?\nHer action became a powerful act of civil disobedience.","ko":"밑줄 친 Her action이 가리키는 것은?","sko":"그녀의 행동은 시민 불복종의 강력한 행위가 되었다.","opts":["로자가 대법원에 간 일","로자가 자리를 양보하지 않고 앉아 있다가 체포된 일","흑인 주민들이 버스를 타지 않은 일","로자가 새 버스 법을 만든 일"],"r":{"a":"2) 로자가 자리를 양보하지 않고 앉아 있다가 체포된 일","w":"10번의 Her action은 앞에서 로자가 한 행동, 즉 8번에서 자리 양보를 거부하고 9번에서 앉은 채 체포된 일을 가리킴. 버스를 타지 않은 일은 그 뒤 12번의 일이고, 법을 만든 사람은 로자가 아님.","c":2,"ev":"8~10번 문장","s":[[8,"One day in Montgomery, Alabama, a woman named Rosa Parks calmly refused to give up her seat.","어느 날 앨라배마주 몽고메리에서 로자 파크스라는 여성이 침착하게 자리 양보를 거부했다."],[9,"Knowing the rule was unfair, she stayed seated and was arrested.","그 규칙이 불공정하다는 것을 알고 있었기에, 그녀는 앉은 채로 있었고 체포되었다."],[10,"Her action became a powerful act of civil disobedience.","그녀의 행동은 시민 불복종의 강력한 행위가 되었다."]]},"h":"615398b1b5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This proved that peaceful civil disobedience can change unfair laws.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 평화적인 시민 불복종이 불공정한 법을 바꿀 수 있음을 증명했다.","opts":["이것은 시민 불복종이 법을 더 불공정하게 만든다는 것을 증명했다.","이것은 폭력적인 시위만이 법을 바꿀 수 있음을 증명했다.","이것은 평화적인 시민 불복종이 불공정한 법을 바꿀 수 있음을 증명했다.","이것은 불공정한 법이 저절로 사라진다는 것을 증명했다."],"r":{"a":"3) 이것은 평화적인 시민 불복종이 불공정한 법을 바꿀 수 있음을 증명했다.","w":"prove(증명하다) that 뒤가 peaceful civil disobedience can change unfair laws(평화적인 시민 불복종이 불공정한 법을 바꿀 수 있다). 폭력이나 저절로 사라진다는 말은 없고, 오히려 법이 바뀌었다는 내용임.","c":3,"ev":"14번 문장","s":[[14,"This proved that peaceful civil disobedience can change unfair laws.","이는 평화적인 시민 불복종이 불공정한 법을 바꿀 수 있음을 증명했다."]]},"h":"b0c23b2125"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["로자 파크스가 체포된 뒤 수천 명의 흑인 주민이 몽고메리 버스 보이콧에 참여했다.","로자 파크스는 백인 승객에게 자리를 양보하고 집으로 돌아갔다.","몽고메리 버스 보이콧은 일주일도 안 되어 끝났다.","미국 연방 대법원은 버스 법이 공정하다고 판결했다."],"opts":["After Rosa Parks was arrested, thousands of Black residents joined the Montgomery Bus Boycott.","Rosa Parks gave up her seat to a white passenger and went home.","The Montgomery Bus Boycott ended in less than a week.","The U.S. Supreme Court decided that the bus laws were fair."],"r":{"a":"1) After Rosa Parks was arrested, thousands of Black residents joined the Montgomery Bus Boycott.","w":"9번에서 로자가 체포되었고 12번에서 그러자 수천 명이 보이콧에 참여했다고 함. 로자는 양보를 거부했고(8번), 시위는 1년이 넘었으며(13번), 대법원은 버스 법이 불법이라고 판결했으므로 나머지는 틀림.","c":1,"ev":"9번, 12~13번 문장","s":[[9,"Knowing the rule was unfair, she stayed seated and was arrested.","그 규칙이 불공정하다는 것을 알고 있었기에, 그녀는 앉은 채로 있었고 체포되었다."],[12,"Thousands of Black residents then joined the Montgomery Bus Boycott and refused to ride the buses.","그러자 수천 명의 흑인 주민들이 몽고메리 버스 보이콧에 참여하여 버스 타기를 거부했다."],[13,"After more than a year of protest, the U.S. Supreme Court ruled the bus laws illegal.","1년이 넘는 시위 끝에 미국 연방 대법원은 버스 법이 불법이라고 판결했다."]]},"h":"185c0b9466"},{"n":9,"t":"sum","q":"When this (A), people can (B) civil disobedience to make a change.","ko":"이런 일이 (A) 때, 사람들은 변화를 일으키기 위해 시민 불복종을 (B) 수 있다.","oko":["(A) 끝나는 / (B) 숨길","(A) 생기는 / (B) 숨길","(A) 끝나는 / (B) 사용할","(A) 멈추는 / (B) 두려워할","(A) 생기는 / (B) 사용할"],"opts":["(A) ends / (B) hide","(A) happens / (B) hide","(A) ends / (B) use","(A) stops / (B) fear","(A) happens / (B) use"],"r":{"a":"5) (A) happens / (B) use ((A) 생기는 / (B) 사용할)","w":"2번: 이런 일이 생기면(happens), 사람들은 변화를 일으키기 위해 시민 불복종을 사용할(use) 수 있다.","c":5,"ev":"2번 문장","s":[[2,"When this happens, people can use civil disobedience to make a change.","이런 일이 생기면, 사람들은 변화를 일으키기 위해 시민 불복종을 사용할 수 있다."]]},"h":"1ad4517519"},{"n":10,"t":"fill","q":"At that [A], many laws [B] Black people unfairly.","ko":"그 [A]에는 많은 법이 흑인들을 불공정하게 [B].","bank":["time","treated","famous","calmly","peacefully","illegal"],"bko":{"time":"때(시기)","treated":"대했다(treat의 과거형)","famous":"유명한","calmly":"침착하게","peacefully":"평화롭게","illegal":"불법의"},"r":{"a":"[A] time (때(시기)), [B] treated (대했다(treat의 과거형))","w":"6번: 그 당시(time)에는 많은 법이 흑인들을 불공정하게 대했다(treated).","c":null,"ev":"6번 문장","s":[[6,"At that time, many laws treated Black people unfairly.","그 당시에는 많은 법이 흑인들을 불공정하게 대했다."]]},"h":"730bc23b92"}]},{"u":9,"id":"b4-09-4","no":4,"ko":"권력을 셋으로 나누는 이유는?","items":[{"n":1,"t":"tf","q":"Under the separation of powers, the government is divided into three branches.","ko":"삼권분립 아래에서 정부는 세 개의 부로 나뉜다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장에 the government is divided into three branches가 그대로 나옴. 2번에서 이 제도의 이름이 삼권분립이라고 했으므로 일치.","c":"T","ev":"3번 문장","s":[[3,"Under this system, the government is divided into three branches.","이 제도 아래에서 정부는 세 개의 부로 나뉜다."]]},"h":"f99193c79a"},{"n":2,"t":"tf","q":"A president or prime minister leads the judicial branch.","ko":"대통령이나 총리가 사법부를 이끈다.","r":{"a":"F (본문과 다른 내용)","w":"7번 문장에서 대통령이나 총리가 이끄는 부는 this branch, 즉 6번의 행정부(executive branch)임. 사법부는 판사와 법원이 맡으므로(9번) 틀림.","c":"F","ev":"7번 문장","s":[[7,"A president or prime minister leads this branch and makes sure the laws are obeyed.","대통령이나 총리가 이 부를 이끌며 법이 지켜지도록 보장한다."]]},"h":"bbc22e5541"},{"n":3,"t":"tf","q":"The judicial branch can cancel any law that goes against the Constitution.","ko":"사법부는 헌법에 어긋나는 어떤 법이든 무효로 할 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"13번 문장에 The judicial branch can cancel any law that goes against the Constitution이 그대로 있음. 헌법에 어긋나는 법을 무효로 하는 것이 사법부의 견제 방법임.","c":"T","ev":"13번 문장","s":[[13,"The judicial branch can cancel any law that goes against the Constitution.","사법부는 헌법에 어긋나는 어떤 법이든 무효로 할 수 있다."]]},"h":"88774891f1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A president or prime minister leads this branch and makes sure the laws are obeyed.)","ko":"대통령이나 총리가 이 부를 이끌며 법이 ( ) 보장한다.","opts":["무시되다","지켜지다","바뀌다","잊히다"],"word":"obeyed","r":{"a":"2) 지켜지다","w":"7번은 행정부가 법을 집행하는 일(6번)을 하면서 법이 ‘지켜지도록’ 한다는 내용. obey(따르다, 지키다)의 수동 형태 obeyed는 ‘지켜지다’. 무시되거나 잊히면 집행한다는 말과 맞지 않음.","c":2,"ev":"7번 문장","s":[[7,"A president or prime minister leads this branch and makes sure the laws are obeyed.","대통령이나 총리가 이 부를 이끌며 법이 지켜지도록 보장한다."]]},"h":"2af26b142a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The executive branch can reject a law passed by the legislative branch.)","ko":"행정부는 입법부가 통과시킨 법을 ( ) 수 있다.","opts":["받아들이다","만들다","설명하다","거부하다"],"word":"reject","r":{"a":"4) 거부하다","w":"11번은 한 부가 다른 부를 견제하는 예(10번 check one another)임. 행정부가 입법부의 법을 거부하는 것이 견제이므로 reject(거부하다)가 맞음. 받아들이면 견제가 되지 않음.","c":4,"ev":"11번 문장","s":[[11,"For example, the executive branch can reject a law passed by the legislative branch.","예를 들어, 행정부는 입법부가 통과시킨 법을 거부할 수 있다."]]},"h":"2349a79d4c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nEach branch has its own powers, but they can also check one another.","ko":"밑줄 친 they가 가리키는 것은?","sko":"각 부는 자신만의 권한을 가지지만, 서로를 견제할 수도 있다.","opts":["선출된 대표들","입법부, 행정부, 사법부 세 부","판사와 법원","대통령과 총리"],"r":{"a":"2) 입법부, 행정부, 사법부 세 부","w":"10번의 Each branch(각 부)에 이어지는 they는 3번에서 나뉜 세 개의 부, 즉 입법부·행정부·사법부를 가리킴. check one another(서로 견제)는 세 부 사이의 관계를 말함.","c":2,"ev":"3번, 10번 문장","s":[[3,"Under this system, the government is divided into three branches.","이 제도 아래에서 정부는 세 개의 부로 나뉜다."],[10,"Each branch has its own powers, but they can also check one another.","각 부는 자신만의 권한을 가지지만, 서로를 견제할 수도 있다."]]},"h":"d6ad08d2e6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In a democracy, power must be shared so that no one has too much control.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"민주주의에서는 아무도 너무 많은 통제권을 갖지 않도록 권력이 나뉘어야 한다.","opts":["민주주의에서는 권력이 나뉘어야 누구도 지나치게 많은 통제권을 갖지 않는다.","민주주의에서는 한 사람이 모든 권력을 가져야 통제가 쉽다.","민주주의에서는 누구도 권력을 가져서는 안 된다.","민주주의에서는 권력이 클수록 모두에게 공정하다."],"r":{"a":"1) 민주주의에서는 권력이 나뉘어야 누구도 지나치게 많은 통제권을 갖지 않는다.","w":"power must be shared는 ‘권력이 나뉘어야 한다’, so that no one has too much control은 ‘누구도 통제권을 너무 많이 갖지 않도록’이라는 뜻. 한 사람이 모든 권력을 갖는다는 말은 정반대임.","c":1,"ev":"1번 문장","s":[[1,"In a democracy, power must be shared so that no one has too much control.","민주주의에서는 아무도 너무 많은 통제권을 갖지 않도록 권력이 나뉘어야 한다."]]},"h":"52f8da50e6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["행정부는 법을 만들고 입법부는 그 법을 집행한다.","입법부는 행정부가 통과시킨 법을 거부할 수 있다.","입법부는 행정부가 권력을 사용하는 방식을 검토하고 제한할 수 있다.","사법부는 대통령이나 총리가 이끈다."],"opts":["The executive branch makes the laws, and the legislative branch carries them out.","The legislative branch can reject a law passed by the executive branch.","The legislative branch can review and limit how the executive branch uses its power.","The judicial branch is led by a president or prime minister."],"r":{"a":"3) The legislative branch can review and limit how the executive branch uses its power.","w":"12번에서 입법부는 행정부가 권력을 쓰는 방식을 검토하고 제한할 수 있다고 함. 법을 만드는 곳은 입법부(4번), 집행하는 곳은 행정부(6번)이고, 법을 거부하는 쪽은 행정부(11번), 대통령·총리가 이끄는 곳도 행정부(7번)라 나머지는 틀림.","c":3,"ev":"4번, 6~7번, 11~12번 문장","s":[[4,"The legislative branch makes the laws.","입법부는 법을 만든다."],[6,"The executive branch carries out the laws.","행정부는 법을 집행한다."],[7,"A president or prime minister leads this branch and makes sure the laws are obeyed.","대통령이나 총리가 이 부를 이끌며 법이 지켜지도록 보장한다."],[11,"For example, the executive branch can reject a law passed by the legislative branch.","예를 들어, 행정부는 입법부가 통과시킨 법을 거부할 수 있다."],[12,"The legislative branch can review and limit how the executive branch uses its power.","입법부는 행정부가 권력을 사용하는 방식을 검토하고 제한할 수 있다."]]},"h":"b90465159b"},{"n":9,"t":"sum","q":"Elected representatives (A) new laws, discuss whether they are necessary and fair, and (B) to decide if they should become law.","ko":"선출된 대표들은 새 법을 (A), 그것이 필요하고 공정한지 논의하며, 그것이 법이 되어야 하는지 결정하기 위해 (B).","oko":["(A) 취소하고 / (B) 투표한다","(A) 제안하고 / (B) 말다툼한다","(A) 취소하고 / (B) 말다툼한다","(A) 무시하고 / (B) 투표한다","(A) 제안하고 / (B) 투표한다"],"opts":["(A) cancel / (B) vote","(A) propose / (B) argue","(A) cancel / (B) argue","(A) ignore / (B) vote","(A) propose / (B) vote"],"r":{"a":"5) (A) propose / (B) vote ((A) 제안하고 / (B) 투표한다)","w":"5번: 선출된 대표들은 새 법을 제안하고(propose), 필요하고 공정한지 논의하며, 법이 되어야 하는지 투표로(vote) 결정한다.","c":5,"ev":"5번 문장","s":[[5,"Elected representatives propose new laws, discuss whether they are necessary and fair, and vote to decide if they should become law.","선출된 대표들은 새 법을 제안하고, 그것이 필요하고 공정한지 논의하며, 그것이 법이 되어야 하는지 투표로 결정한다."]]},"h":"7136bb838b"},{"n":10,"t":"fill","q":"With this system, these branches keep power [A] and make democracy fair for [B].","ko":"이 제도 덕분에 이 부들은 권력이 [A] 상태를 유지하고 민주주의가 [B]에게 공정하게 작동하도록 한다.","bank":["balanced","everyone","quickly","carefully","together","often"],"bko":{"balanced":"균형 잡힌","everyone":"모든 사람","quickly":"빠르게","carefully":"신중하게","together":"함께","often":"자주"},"r":{"a":"[A] balanced (균형 잡힌), [B] everyone (모든 사람)","w":"14번: 이 제도 덕분에 이 부들은 권력의 균형 잡힌(balanced) 상태를 유지하고 민주주의가 모든 사람(everyone)에게 공정하게 작동하도록 한다.","c":null,"ev":"14번 문장","s":[[14,"With this system, these branches keep power balanced and make democracy fair for everyone.","이 제도 덕분에 이 부들은 권력의 균형을 유지하고 민주주의가 모든 사람에게 공정하게 작동하도록 한다."]]},"h":"eadbd8c443"}]},{"u":10,"id":"b4-10-1","no":1,"ko":"모나리자를 유명하게 만든 도둑","items":[{"n":1,"t":"tf","q":"Vincenzo Peruggia had once worked at the Louvre Museum.","ko":"빈센초 페루자는 한때 루브르 박물관에서 일한 적이 있었다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장에 a man named Vincenzo Peruggia, who had once worked at the Louvre가 있음. 한때 루브르에서 일했다는 내용과 일치.","c":"T","ev":"3번 문장","s":[[3,"One morning, a man named Vincenzo Peruggia, who had once worked at the Louvre, walked into the museum wearing a worker’s uniform.","어느 날 아침, 한때 루브르에서 일한 적이 있는 빈센초 페루자라는 남자가 작업복을 입고 박물관 안으로 걸어 들어갔다."]]},"h":"8188c3c79e"},{"n":2,"t":"tf","q":"People noticed that the Mona Lisa was gone on the same morning it was stolen.","ko":"사람들은 「모나리자」가 도난당한 바로 그날 아침에 그림이 없어진 것을 알아차렸다.","r":{"a":"F (본문과 다른 내용)","w":"5번 문장은 It wasn’t until the next day that anyone n :["「모나리자」","루브르 박물관","방문객들","빈 공간"],"r":{"a":"1) 「모나리자」","w":"7번의 it은 그림이 걸려 있던 빈 공간에서 \"한때 걸려 있던 것\", 즉 도난당한 「모나리자」. 방문객들이 빈 공간을 바라본 이유는 거기에 있던 그림이 사라졌기 때문.","c":1,"ev":"7번 문장","s":[[7,"Shocked visitors crowded into the Louvre, staring at the empty space where it had once hung.","충격받은 방문객들이 루브르에 몰려들어, 그림이 걸려 있던 빈 공간을 바라보았다."]],"k":"it = 「모나리자」"},"pron":"it","h":"2f09947a4e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The story made headlines across the world.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 이야기는 전 세계의 머리기사가 되었다.","opts":["그 이야기는 전 세계에서 큰 뉴스가 되었다.","그 이야기는 아무에게도 알려지지 않았다.","그 이야기는 한 나라에서만 알려졌다.","그 이야기는 신문에 실리지 못하게 금지되었다."],"r":{"a":"1) 그 이야기는 전 세계에서 큰 뉴스가 되었다.","w":"made headlines across the world는 전 세계에서 머리기사가 되었다, 즉 크게 뉴스가 되었다는 뜻.","c":1,"ev":"6번 문장","s":[[6,"The story made headlines across the world.","그 이야기는 전 세계의 머리기사가 되었다."]]},"h":"a918438fb9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["페루자는 루브르에서 일한 적이 한 번도 없었다.","페루자가 직접 루브르에 그림을 돌려주어 그림이 돌아왔다.","피렌체의 미술품 거래상이 경찰에 알려서 그림이 돌아왔다.","루브르는 도난 사건이 있던 날 아침에 바로 알아차렸다."],"opts":["Peruggia had never worked at the Louvre.","The painting came back because Peruggia returned it to the Louvre himself.","The painting came back because an art dealer in Florence told the police.","The Louvre noticed the theft on the same morning."],"r":{"a":"3) The painting came back because an art dealer in Florence told the police.","w":"9번에서 페루자가 피렌체의 미술품 거래상에게 팔려고 했고, 10번에서 그 거래상이 경찰에 알려 그림이 돌아왔다고 함. 페루자는 루브르에서 일한 적이 있었고(3번), 도난은 다음 날에야 알려졌으며(5번), 페루자가 직접 돌려주지 않았음.","c":3,"ev":"3번, 5번, 9~10번 문장","s":[[3,"One morning, a man named Vincenzo Peruggia, who had once worked at the Louvre, walked into the museum wearing a worker’s uniform.","어느 날 아침, 한때 루브르에서 일한 적이 있는 빈센초 페루자라는 남자가 작업복을 입고 박물관 안으로 걸어 들어갔다."],[5,"It wasn’t until the next day that anyone noticed it was gone.","다음 날이 되어서야 비로소 누군가가 그림이 없어진 것을 알아차렸다."],[9,"Then, in 1913, Peruggia tried to sell it to an art dealer in Florence, Italy.","그러다 1913년에 페루자는 이탈리아 피렌체의 한 미술품 거래상에게 그것을 팔려고 했다."],[10,"The dealer informed the police, and the painting was finally returned.","그 거래상은 경찰에 알렸고, 그림은 마침내 돌아왔다."]]},"h":"7c5a779e26"},{"n":9,"t":"sum","q":"He quietly (A) the painting from the wall, hid it under his coat, and (B) out of the museum.","ko":"그는 조용히 벽에서 그림을 (A), 외투 속에 숨기고 박물관 밖으로 (B).","oko":["(A) 그려 / (B) 헤엄쳐 나갔다","(A) 떼어 내 / (B) 헤엄쳐 나갔다","(A) 그려 / (B) 걸어 나갔다","(A) 팔아 / (B) 헤엄쳐 나갔다","(A) 떼어 내 / (B) 걸어 나갔다"],"opts":["(A) painted / (B) swam","(A) removed / (B) swam","(A) painted / (B) walked","(A) sold / (B) swam","(A) removed / (B) walked"],"r":{"a":"5) (A) removed / (B) walked ((A) 떼어 내 / (B) 걸어 나갔다)","w":"4번: 그는 조용히 벽에서 그림을 떼어 내고(removed), 외투 속에 숨긴 뒤 박물관 밖으로 걸어 나갔다(walked).","c":5,"ev":"4번 문장","s":[[4,"He quietly removed the painting from the wall, hid it under his coat, and walked out of the museum.","그는 조용히 벽에서 그림을 떼어 내 외투 속에 숨기고 박물관 밖으로 걸어 나갔다."]]},"h":"d85450278e"},{"n":10,"t":"fill","q":"Since [A], even bigger crowds have [B] to see it.","ko":"[A] 이후로, 훨씬 더 많은 인파가 그것을 보러 [B].","bank":["then","come","quietly","coat","uniform","headlines"],"bko":{"then":"그때","come":"왔다(come의 과거분사)","quietly":"조용히","coat":"외투","uniform":"제복, 작업복","headlines":"머리기사"},"r":{"a":"[A] then (그때), [B] come (왔다(come의 과거분사))","w":"11번: 그때(then) 이후로 훨씬 더 많은 인파가 그것을 보러 왔다(come).","c":null,"ev":"11번 문장","s":[[11,"Since then, even bigger crowds have come to see it.","그 이후로 훨씬 더 많은 인파가 그것을 보러 왔다."]]},"h":"8dae2a3382"}]},{"u":10,"id":"b4-10-2","no":2,"ko":"한 시간도 안 걸린 전쟁이 있다고?","items":[{"n":1,"t":"tf","q":"At that time, Zanzibar was under British control.","ko":"당시 잔지바르는 영국의 지배를 받고 있었다.","r":{"a":"T (본문과 맞는 내용)","w":"5번 문장 At that time, Zanzibar was under British control이 그대로 나옴. under control은 지배 아래에 있다는 뜻이라 선지와 일치.","c":"T","ev":"5번 문장","s":[[5,"At that time, Zanzibar was under British control.","당시 잔지바르는 영국의 지배를 받고 있었다."]]},"h":"128b9b3f71"},{"n":2,"t":"tf","q":"Khalid took power with approval from Britain.","ko":"칼리드는 영국의 승인을 받아 권력을 잡았다.","r":{"a":"F (본문과 다른 내용)","w":"6번 문장에서 칼리드는 without British approval(영국의 승인 없이) 권력을 잡았다고 함. with와 without이 반대라서 틀림.","c":"F","ev":"6번 문장","s":[[6,"When the pro-British Sultan of Zanzibar died on August 25, his cousin Khalid took power without British approval.","8월 25일에 친영국 성향의 잔지바르 술탄이 죽자, 그의 사촌 칼리드가 영국의 승인 없이 권력을 잡았다."]]},"h":"5c70378b95"},{"n":3,"t":"tf","q":"The British positioned five warships in the harbor.","ko":"영국은 항구에 다섯 척의 군함을 배치했다.","r":{"a":"T (본문과 맞는 내용)","w":"9번 문장 the British positioned five warships in the harbor와 같은 내용. 칼리드가 궁전을 지킬 준비를 하자 영국이 대응한 것임.","c":"T","ev":"9번 문장","s":[[9,"In response, the British positioned five warships in the harbor.","이에 대응하여 영국은 항구에 다섯 척의 군함을 배치했다."]]},"h":"93b2655711"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (His cousin Khalid took power without British approval.)","ko":"그의 사촌 칼리드가 영국의 ( ) 없이 권력을 잡았다.","opts":["반대","승인","도움","질문"],"word":"approval","r":{"a":"2) 승인","w":"6번은 칼리드가 영국의 ‘허락 없이’ 권력을 잡았다는 내용이고, 그래서 7번에서 영국이 칼리드에게 물러나라고 명령함. approval은 승인, 허락이라는 뜻.","c":2,"ev":"6번 문장","s":[[6,"When the pro-British Sultan of Zanzibar died on August 25, his cousin Khalid took power without British approval.","8월 25일에 친영국 성향의 잔지바르 술탄이 죽자, 그의 사촌 칼리드가 영국의 승인 없이 권력을 잡았다."]]},"h":"99bd095fd6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The British quickly installed their chosen leader as the new Sultan.)","ko":"영국은 재빨리 자신들이 선택한 지도자를 새 술탄으로 ( ).","opts":["쫓아냈다","잊어버렸다","도와주었다","임명했다"],"word":"installed","r":{"a":"4) 임명했다","w":"12번에서 칼리드는 도망쳤고, 영국이 자신들이 고른 지도자를 새 술탄 자리에 올려놓았음. install은 어떤 자리에 앉히다, 임명하다는 뜻. 지도자를 쫓아내거나 잊거나 돕는 내용이 아니라 자리에 올린 것임.","c":4,"ev":"12번 문장","s":[[12,"Khalid escaped to the German embassy, and the British quickly installed their chosen leader as the new Sultan.","칼리드는 독일 대사관으로 도망쳤고, 영국은 재빨리 자신들이 선택한 지도자를 새 술탄으로 앉혔다."]]},"h":"ab247496f8"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nBritain wanted a new Sultan who would support their control, so they ordered Khalid to step down by 9:00 a.m. on August 27.","ko":"밑줄 친 they가 가리키는 것은?","sko":"영국은 자신들의 지배를 지지해 줄 새 술탄을 원했기 때문에, 칼리드에게 8월 27일 오전 9시까지 물러나라고 명령했다.","opts":["영국","칼리드","잔지바르의 술탄","독일 사람들"],"r":{"a":"1) 영국","w":"7번 문장의 주어는 Britain이고, so 뒤의 they가 그 영국을 받음. 명령을 받은 쪽(ordered Khalid)이 칼리드이므로 they는 칼리드가 아님. 6번에서 칼리드는 술탄의 사촌임.","c":1,"ev":"6~7번 문장","s":[[6,"When the pro-British Sultan of Zanzibar died on August 25, his cousin Khalid took power without British approval.","8월 25일에 친영국 성향의 잔지바르 술탄이 죽자, 그의 사촌 칼리드가 영국의 승인 없이 권력을 잡았다."],[7,"Britain wanted a new Sultan who would support their control, so they ordered Khalid to step down by 9:00 a.m. on August 27.","영국은 자신들의 지배를 지지해 줄 새 술탄을 원했기 때문에, 칼리드에게 8월 27일 오전 9시까지 물러나라고 명령했다."]]},"h":"f0f2bad473"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This brief battle became the shortest war in history and an example of how easily a powerful country could control a smaller one in the past.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 짧은 전투는 역사상 가장 짧은 전쟁이 되었고, 과거에 강대국이 약소국을 얼마나 쉽게 지배할 수 있었는지를 보여 주는 사례가 되었다.","opts":["이 짧은 전투는 작은 나라가 강한 나라를 쉽게 이긴 사례였다.","이 짧은 전투는 역사상 가장 긴 전쟁 중 하나가 되었다.","이 짧은 전투는 역사상 가장 짧은 전쟁이자, 강대국이 약소국을 쉽게 지배했음을 보여 주는 사례였다.","이 짧은 전투는 두 나라가 평화롭게 협상한 사례였다."],"r":{"a":"3) 이 짧은 전투는 역사상 가장 짧은 전쟁이자, 강대국이 약소국을 쉽게 지배했음을 보여 주는 사례였다.","w":"shortest war in history는 역사상 가장 짧은 전쟁이고, how easily a powerful country could control a smaller one은 강대국이 약소국을 얼마나 쉽게 지배했는지임. 이긴 쪽은 강한 영국이었으므로 1번은 반대이고, 긴 전쟁이나 협상 이야기는 없음.","c":3,"ev":"13번 문장","s":[[13,"This brief battle became the shortest war in history and an example of how easily a powerful country could control a smaller one in the past.","이 짧은 전투는 역사상 가장 짧은 전쟁이 되었고, 과거에 강대국이 약소국을 얼마나 쉽게 지배할 수 있었는지를 보여 주는 사례가 되었다."]]},"h":"706d58e551"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["칼리드는 영국의 명령대로 오전 9시까지 물러났다.","영국의 군함들은 기한이 지나기 전에 포격을 시작했다.","칼리드의 깃발은 하루가 넘는 싸움 끝에 내려졌다.","칼리드는 궁전이 파괴된 뒤 독일 대사관으로 도망쳤다."],"opts":["Khalid stepped down by 9:00 a.m. as the British ordered.","The British ships started firing before the deadline passed.","Khalid’s flag came down after more than a day of fighting.","Khalid escaped to the German embassy after the palace was destroyed."],"r":{"a":"4) Khalid escaped to the German embassy after the palace was destroyed.","w":"11번에서 궁전이 파괴되고 깃발이 내려진 뒤, 12번에서 칼리드가 독일 대사관으로 도망쳤다고 함. 칼리드는 물러나기를 거부했고(8번), 포격은 기한이 지난 뒤(10번), 전투는 38분(11번)이라 나머지는 틀림.","c":4,"ev":"7~8번, 10~12번 문장","s":[[7,"Britain wanted a new Sultan who would support their control, so they ordered Khalid to step down by 9:00 a.m. on August 27.","영국은 자신들의 지배를 지지해 줄 새 술탄을 원했기 때문에, 칼리드에게 8월 27일 오전 9시까지 물러나라고 명령했다."],[8,"But Khalid refused and prepared to defend the palace with about 3,000 men and cannons.","하지만 칼리드는 거부했고 약 3,000명의 병력과 대포로 궁전을 지킬 준비를 했다."],[10,"When the deadline passed, the ships opened fire.","기한이 지나자 군함들이 포격을 시작했다."],[11,"In just 38 minutes, the palace was destroyed, and Khalid’s flag came down.","단 38분 만에 궁전은 파괴되었고 칼리드의 깃발이 내려졌다."],[12,"Khalid escaped to the German embassy, and the British quickly installed their chosen leader as the new Sultan.","칼리드는 독일 대사관으로 도망쳤고, 영국은 재빨리 자신들이 선택한 지도자를 새 술탄으로 앉혔다."]]},"h":"aa1d15b6d9"},{"n":9,"t":"sum","q":"But Khalid (A) and prepared to defend the palace with about 3,000 men and (B).","ko":"하지만 칼리드는 (A) 약 3,000명의 병력과 (B)(으)로 궁전을 지킬 준비를 했다.","oko":["(A) 동의했고 / (B) 대포","(A) 거부했고 / (B) 꽃","(A) 동의했고 / (B) 꽃","(A) 떠났고 / (B) 말","(A) 거부했고 / (B) 대포"],"opts":["(A) agreed / (B) cannons","(A) refused / (B) flowers","(A) agreed / (B) flowers","(A) left / (B) horses","(A) refused / (B) cannons"],"r":{"a":"5) (A) refused / (B) cannons ((A) 거부했고 / (B) 대포)","w":"8번: 하지만 칼리드는 거부했고(refused) 약 3,000명의 병력과 대포(cannons)로 궁전을 지킬 준비를 했다.","c":5,"ev":"8번 문장","s":[[8,"But Khalid refused and prepared to defend the palace with about 3,000 men and cannons.","하지만 칼리드는 거부했고 약 3,000명의 병력과 대포로 궁전을 지킬 준비를 했다."]]},"h":"e3e5718fc8"},{"n":10,"t":"fill","q":"The war was between Britain and Zanzibar, a small [A] off the east [B] of Africa.","ko":"그 전쟁은 영국과, 아프리카 동쪽 [B] 앞의 작은 [A]인 잔지바르 사이에서 벌어졌다.","bank":["island","coast","quickly","destroyed","opened","ordered"],"bko":{"island":"섬","coast":"해안","quickly":"재빨리","destroyed":"파괴되었다(destroy의 과거분사)","opened":"열었다(open의 과거형)","ordered":"명령했다(order의 과거형)"},"r":{"a":"[A] island (섬), [B] coast (해안)","w":"4번: 그 전쟁은 영국과 아프리카 동쪽 해안(coast) 앞의 작은 섬(island) 잔지바르 사이에서 벌어졌다.","c":null,"ev":"4번 문장","s":[[4,"The war was between Britain and Zanzibar, a small island off the east coast of Africa.","그 전쟁은 영국과 아프리카 동쪽 해안 앞의 작은 섬 잔지바르 사이에서 벌어졌다."]]},"h":"acae56aad9"}]},{"u":10,"id":"b4-10-3","no":3,"ko":"무고한 사람들을 마녀로 몰았던 마녀사냥","items":[{"n":1,"t":"tf","q":"The fears about evil magic led to what we now call “witch hunts.”","ko":"사악한 마법에 대한 두려움은 오늘날 우리가 ‘마녀사냥’이라고 부르는 것으로 이어졌다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장 These fears led to what we now call “witch hunts.”와 같은 내용. These fears는 1번에서 마법 때문이라고 믿은 두려움임.","c":"T","ev":"2번 문장","s":[[2,"These fears led to what we now call “witch hunts.”","이러한 두려움은 오늘날 우리가 ‘마녀사냥’이라고 부르는 것으로 이어졌다."]]},"h":"6b0d7a7c20"},{"n":2,"t":"tf","q":"Witch hunts continued for only a few years.","ko":"마녀사냥은 몇 년 동안만 이어졌다.","r":{"a":"F (본문과 다른 내용)","w":"9번 문장에서 For nearly 300 years, thousands of innocent people lost their lives(거의 300년 동안 수천 명이 목숨을 잃었다)라고 함. 몇 년이 아니라 거의 300년이라 틀림.","c":"F","ev":"9번 문장","s":[[9,"For nearly 300 years, thousands of innocent people lost their lives.","거의 300년 동안 수천 명의 죄 없는 사람들이 목숨을 잃었다."]]},"h":"6ab90db83b"},{"n":3,"t":"tf","q":"People who were poor, elderly, or lived alone were often labeled as witches.","ko":"가난하거나 나이 들었거나 혼자 사는 사람들이 흔히 마녀로 낙인찍혔다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장 They were often poor or elderly women, or people who lived alone과 같은 내용. 3번에서 마녀로 낙인찍힌 사람들이 바로 이들임.","c":"T","ev":"4번 문장","s":[[4,"They were often poor or elderly women, or people who lived alone.","그들은 흔히 가난하거나 나이 든 여성, 또는 혼자 사는 사람들이었다."]]},"h":"5d5ca0d6a5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some people were labeled as witches and blamed for bad events.)","ko":"어떤 사람들은 마녀로 ( ) 나쁜 일들의 책임을 뒤집어썼다.","opts":["존경받았다","낙인찍혔다","초대되었다","보호받았다"],"word":"labeled","r":{"a":"2) 낙인찍혔다","w":"3번은 마녀로 몰려 나쁜 일의 탓(blamed)까지 받았다는 내용. label은 이름표를 붙이다, 낙인찍다. 존경, 초대, 보호는 뒤의 blamed(비난받았다)와 반대 방향임.","c":2,"ev":"3번 문장","s":[[3,"During this time, some people were labeled as witches and blamed for bad events.","이 시기에 어떤 사람들은 마녀로 낙인찍혀 나쁜 일들의 책임을 뒤집어썼다."]]},"h":"435b52c06b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Many people were forced to confess through threats or torture.)","ko":"많은 사람들이 협박이나 고문 때문에 ( ) 강요당했다.","opts":["도망치다","거짓말하다","자백하다","기도하다"],"word":"confess","r":{"a":"3) 자백하다","w":"8번은 협박이나 고문으로 억지로 하게 된 일을 말하고, 그 결과 7번처럼 재판이 불공정했음. confess는 잘못을 인정하고 털어놓는다는 뜻의 ‘자백하다’.","c":3,"ev":"8번 문장","s":[[8,"Many people were forced to confess through threats or torture.","많은 사람들이 협박이나 고문 때문에 자백하도록 강요당했다."]]},"h":"27a0b49992"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt describes situations in which people are unfairly blamed because of false beliefs.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 사람들이 잘못된 믿음 때문에 부당하게 비난받는 상황을 가리킨다.","opts":["마녀 재판","유럽","마법","‘마녀사냥’이라는 말"],"r":{"a":"4) ‘마녀사냥’이라는 말","w":"10번에서 the term is still used today(그 말은 오늘날에도 쓰인다)라고 했고, 11번의 It은 그 말, 즉 ‘witch hunt’라는 말임. 상황을 가리킨다(describes)는 설명은 말에 대한 설명.","c":4,"ev":"10~11번 문장","s":[[10,"Although witch hunts ended long ago, the term is still used today.","마녀사냥은 오래전에 끝났지만, 그 말은 오늘날에도 쓰인다."],[11,"It describes situations in which people are unfairly blamed because of false beliefs.","그것은 사람들이 잘못된 믿음 때문에 부당하게 비난받는 상황을 가리킨다."]]},"h":"de1bebcdd1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This reminds us to search for the truth before judging others and to treat everyone fairly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이는 우리에게 다른 사람을 판단하기 전에 진실을 찾고 모든 사람을 공정하게 대하라는 것을 상기시킨다.","opts":["남을 판단하기 전에 진실을 찾고 모두를 공정하게 대해야 한다는 것을 일깨워 준다.","남을 먼저 판단해야 진실을 알 수 있다는 것을 알려 준다.","사람마다 다르게 대하는 것이 공정하다는 것을 알려 준다.","진실보다 대중의 두려움을 먼저 가라앉혀야 한다는 것을 알려 준다."],"r":{"a":"1) 남을 판단하기 전에 진실을 찾고 모두를 공정하게 대해야 한다는 것을 일깨워 준다.","w":"remind us to ~는 ‘~하라고 일깨워 준다’. search for the truth before judging others는 판단하기 전에 진실을 찾으라는 말이고, treat everyone fairly는 모두를 공정하게 대하라는 말임. 나머지는 이와 반대임.","c":1,"ev":"12번 문장","s":[[12,"This reminds us to search for the truth before judging others and to treat everyone fairly.","이는 우리에게 다른 사람을 판단하기 전에 진실을 찾고 모든 사람을 공정하게 대하라는 것을 상기시킨다."]]},"h":"5b12a06078"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["마녀사냥은 1900년대에만 있었던 일이다.","지역 지도자들과 교회는 마법을 썼다는 혐의를 받은 사람들을 처벌하려고 마녀 재판을 열었다.","마녀 재판은 가난한 사람들에게 선물을 주기 위해 열렸다.","‘마녀사냥’이라는 말은 오늘날 더 이상 쓰이지 않는다."],"opts":["Witch hunts took place only in the 1900s.","Local leaders and churches held witch trials to punish people accused of using magic.","Witch trials were held to give gifts to poor people.","The term “witch hunt” is no longer used today."],"r":{"a":"2) Local leaders and churches held witch trials to punish people accused of using magic. (지역 지도자들과 교회는 마법을 썼다는 혐의를 받은 사람들을 처벌하려고 마녀 재판을 열었다.)","w":"6번에서 지역 지도자들과 교회가 마법을 썼다는 혐의를 받은 사람들을 처벌하려고 마녀 재판을 열었다고 함. ①은 1번(1400년대부터 1700년대까지)과 다르고, ③은 본문에 없는 내용이며, ④는 10번(그 말은 오늘날에도 쓰인다)과 반대.","c":2,"ev":"1번, 6번, 10번 문장","s":[[1,"From the 1400s to the 1700s, when war, hunger, and illness were common in Europe, many people believed these troubles were caused by evil magic.","1400년대부터 1700년대까지, 유럽에서 전쟁, 굶주림, 질병이 흔했을 때 많은 사람들은 이런 어려움이 사악한 마법 때문에 생긴다고 믿었다."],[6,"To calm public fear, local leaders and churches held witch trials to punish those accused of using magic.","대중의 두려움을 가라앉히기 위해 지역 지도자들과 교회는 마법을 썼다는 혐의를 받은 사람들을 처벌하려고 마녀 재판을 열었다."],[10,"Although witch hunts ended long ago, the term is still used today.","마녀사냥은 오래전에 끝났지만, 그 말은 오늘날에도 쓰인다."]]},"h":"2fa723f45f"},{"n":9,"t":"sum","q":"When war, hunger, and (A) were common in Europe, many people believed these (B) were caused by evil magic.","ko":"유럽에서 전쟁, 굶주림, (A)이(가) 흔했을 때, 많은 사람들은 이런 (B)이(가) 사악한 마법 때문에 생긴다고 믿었다.","oko":["(A) 평화 / (B) 선물","(A) 질병 / (B) 선물","(A) 평화 / (B) 어려움","(A) 부 / (B) 휴일","(A) 질병 / (B) 어려움"],"opts":["(A) peace / (B) gifts","(A) illness / (B) gifts","(A) peace / (B) troubles","(A) wealth / (B) holidays","(A) illness / (B) troubles"],"r":{"a":"5) (A) illness / (B) troubles ((A) 질병 / (B) 어려움)","w":"1번: 유럽에서 전쟁, 굶주림, 질병(illness)이 흔했을 때 많은 사람들은 이런 어려움(troubles)이 사악한 마법 때문에 생긴다고 믿었다.","c":5,"ev":"1번 문장","s":[[1,"From the 1400s to the 1700s, when war, hunger, and illness were common in Europe, many people believed these troubles were caused by evil magic.","1400년대부터 1700년대까지, 유럽에서 전쟁, 굶주림, 질병이 흔했을 때 많은 사람들은 이런 어려움이 사악한 마법 때문에 생긴다고 믿었다."]]},"h":"d60537640e"},{"n":10,"t":"fill","q":"Even those who were simply [A] from others became [B].","ko":"단지 다른 사람들과 [A] 사람들조차 [B]이(가) 되었다.","bank":["different","targets","accuse","punish","judge","search"],"bko":{"different":"다른","targets":"표적","accuse":"고발하다","punish":"처벌하다","judge":"판단하다","search":"찾다"},"r":{"a":"[A] different (다른), [B] targets (표적)","w":"5번: 단지 다른 사람들과 다르다는(different) 이유만으로도 표적(targets)이 되었다.","c":null,"ev":"5번 문장","s":[[5,"Even those who were simply different from others became targets.","단지 다른 사람들과 다르다는 이유만으로도 표적이 되었다."]]},"h":"b3aa4894d0"}]},{"u":10,"id":"b4-10-4","no":4,"ko":"실크로드는 왜 ‘길’ 하나가 아니었을까?","items":[{"n":1,"t":"tf","q":"The name “Silk Road” comes from silk, a major export from China.","ko":"‘실크로드’라는 이름은 중국의 주요 수출품이었던 비단에서 유래했다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장이 그대로 이 내용임. come from은 ~에서 유래하다, export는 수출품이라는 뜻.","c":"T","ev":"6번 문장","s":[[6,"The name “Silk Road” comes from silk, a major export from China.","‘실크로드’라는 이름은 중국의 주요 수출품이었던 비단에서 유래했다."]]},"h":"7797e9d599"},{"n":2,"t":"tf","q":"The Silk Road was a single road that connected China and Europe.","ko":"실크로드는 중국과 유럽을 연결하는 하나의 길이었다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 The Silk Road was not a single road라고 함. 5번에서 육로와 해로의 모음이라고 설명하므로 하나의 길이라는 선지는 틀림.","c":"F","ev":"4번 문장","s":[[4,"The Silk Road was not a single road.","실크로드는 하나의 길이 아니었다."]]},"h":"0f5977442d"},{"n":3,"t":"tf","q":"Through trade, people shared languages, foods, and customs.","ko":"무역을 통해 사람들은 언어, 음식, 관습을 공유했다.","r":{"a":"T (본문과 맞는 내용)","w":"10번 문장이 그대로 이 내용임. 물건뿐 아니라 언어·음식·관습 같은 문화도 무역으로 오갔다는 뜻.","c":"T","ev":"10번 문장","s":[[10,"Through trade, people shared languages, foods, and customs.","무역을 통해 사람들은 언어, 음식, 관습을 공유했다."]]},"h":"53cf5e2eaf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Envoys traveled through Central Asia and reported on distant lands.)","ko":"사절들은 중앙아시아를 지나 여행하며 ( ) 땅들에 대해 보고했다.","opts":["가까운","먼","오래된","새로운"],"word":"distant","r":{"a":"2) 먼","w":"2번은 사절들이 중앙아시아를 지나 여행하며 땅들에 대해 보고했다는 내용이고, 1번에서 국경 너머를 보았다고 했으므로 가까운 곳이 아니라 ‘먼’ 땅이 맞음.","c":2,"ev":"2번 문장","s":[[2,"Envoys traveled through Central Asia and reported on distant lands.","사절들은 중앙아시아를 지나 여행하며 먼 땅들에 대해 보고했다."]]},"h":"87c001f444"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The West traded glass and precious metals.)","ko":"서양은 유리와 ( ) 금속을 거래했다.","opts":["흔한","가벼운","귀중한","오래된"],"word":"precious","r":{"a":"3) 귀중한","w":"7번에서 서양이 유리와 함께 거래한 것은 값이 높은 금속, 즉 귀금속임. precious = 귀중한, 값진. 흔하거나 가볍다는 뜻이면 ‘귀금속’이 되지 않음.","c":3,"ev":"7번 문장","s":[[7,"China traded silk, tea, and porcelain, while the West traded glass and precious metals.","중국은 비단, 차, 도자기를 거래한 반면, 서양은 유리와 귀금속을 거래했다."]]},"h":"0d0b31f501"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nMerchants later followed these routes, which developed into a large trade network known as the Silk Road.","ko":"밑줄 친 which가 가리키는 것은?","sko":"상인들이 나중에 이 길들을 따라갔고, 이 길들은 실크로드라고 알려진 큰 무역망으로 발전했다.","opts":["상인들","중앙아시아","중국의 통치자들","사절들이 갔던 길들"],"r":{"a":"4) 사절들이 갔던 길들","w":"which 바로 앞의 these routes가 가리키는 것이고, 이 routes는 2번에서 사절들이 중앙아시아를 지나 여행한 길임. 상인들이 따라간 그 길들이 큰 무역망인 실크로드로 발전함.","c":4,"ev":"2~3번 문장","s":[[2,"Envoys traveled through Central Asia and reported on distant lands.","사절들은 중앙아시아를 지나 여행하며 먼 땅들에 대해 보고했다."],[3,"Merchants later followed these routes, which developed into a large trade network known as the Silk Road.","상인들이 나중에 이 길들을 따라갔고, 이 길들은 실크로드라고 알려진 큰 무역망으로 발전했다."]]},"h":"11ee7a9786"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, its influence lasted for centuries, and it became an early example of global trade.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그 영향력은 수 세기 동안 이어졌고, 실크로드는 세계 무역의 초기 사례가 되었다.","opts":["그러나 그 영향력은 수 세기 동안 이어졌고, 세계 무역의 초기 사례가 되었다.","그러나 그 영향력은 15세기 직후 완전히 사라졌다.","그러나 그것은 세계 무역이 끝났음을 보여 주는 사례가 되었다.","그러나 그 영향력은 오래갔지만 무역과는 관계가 없었다."],"r":{"a":"1) 그러나 그 영향력은 수 세기 동안 이어졌고, 세계 무역의 초기 사례가 되었다.","w":"11번에서 중요성이 줄었다고 한 뒤 However로 방향이 바뀌어, 영향력은 수 세기 동안 이어졌다(lasted for centuries)고 함. an early example of global trade는 세계 무역의 초기 사례라는 뜻임.","c":1,"ev":"11~12번 문장","s":[[11,"After the 15th century, wars and new sea routes reduced the Silk Road’s importance.","15세기 이후에는 전쟁과 새로운 바닷길이 실크로드의 중요성을 줄였다."],[12,"However, its influence lasted for centuries, and it became an early example of global trade.","하지만 그 영향력은 수 세기 동안 이어졌고, 실크로드는 세계 무역의 초기 사례가 되었다."]]},"h":"2c2dcf46a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["실크로드는 중국과 인도만 연결했다.","중국은 유리와 귀금속을, 서양은 비단과 차와 도자기를 거래했다.","불교는 인도에서 중앙아시아로 퍼졌고, 중국의 종이는 서쪽으로 이동했다.","실크로드는 15세기 이후 더 중요해졌다."],"opts":["The Silk Road connected only China and India.","China traded glass and precious metals, while the West traded silk, tea, and porcelain.","Buddhism spread from India into Central Asia, and paper from China moved westward.","The Silk Road became more important after the 15th century."],"r":{"a":"3) Buddhism spread from India into Central Asia, and paper from China moved westward.","w":"9번에서 불교는 인도에서 중앙아시아로, 종이는 서쪽으로 이동했다고 함. 실크로드는 여러 지역을 연결했고(5번), 비단·차·도자기는 중국이 거래했으며(7번), 15세기 이후에는 중요성이 줄었음(11번).","c":3,"ev":"5번, 7번, 9번, 11번 문장","s":[[5,"It was a group of land and sea routes that connected China with Central Asia, India, the Middle East, and Europe.","그것은 중국을 중앙아시아, 인도, 중동, 유럽과 연결하는 육로와 해로의 모음이었다."],[7,"China traded silk, tea, and porcelain, while the West traded glass and precious metals.","중국은 비단, 차, 도자기를 거래한 반면, 서양은 유리와 귀금속을 거래했다."],[9,"Buddhism spread from India into Central Asia, and Chinese inventions such as paper moved westward.","불교는 인도에서 중앙아시아로 퍼졌고, 종이와 같은 중국의 발명품은 서쪽으로 이동했다."],[11,"After the 15th century, wars and new sea routes reduced the Silk Road’s importance.","15세기 이후에는 전쟁과 새로운 바닷길이 실크로드의 중요성을 줄였다."]]},"h":"eb26876972"},{"n":9,"t":"sum","q":"Chinese rulers looked (A) their borders to find new (B) and trade.","ko":"중국의 통치자들은 새로운 (B)와(과) 무역을 찾아 국경 (A) 바라보았다.","oko":["(A) 뒤쪽을 / (B) 적","(A) 너머를 / (B) 적","(A) 뒤쪽을 / (B) 동맹","(A) 안쪽을 / (B) 도구","(A) 너머를 / (B) 동맹"],"opts":["(A) behind / (B) enemies","(A) beyond / (B) enemies","(A) behind / (B) allies","(A) inside / (B) tools","(A) beyond / (B) allies"],"r":{"a":"5) (A) beyond / (B) allies ((A) 너머를 / (B) 동맹)","w":"1번: 중국의 통치자들은 새로운 동맹(allies)과 무역을 찾아 국경 너머(beyond)를 바라보았다.","c":5,"ev":"1번 문장","s":[[1,"More than 2,000 years ago, Chinese rulers looked beyond their borders to find new allies and trade.","2,000여 년 전, 중국의 통치자들은 새로운 동맹과 무역을 찾아 국경 너머를 바라보았다."]]},"h":"33e8f2df31"},{"n":10,"t":"fill","q":"After the 15th century, [A] and new sea routes [B] the Silk Road’s importance.","ko":"15세기 이후, [A]과(와) 새로운 바닷길이 실크로드의 중요성을 [B].","bank":["wars","reduced","later","quickly","westward","large"],"bko":{"wars":"전쟁","reduced":"줄였다(reduce의 과거형)","later":"나중에","quickly":"빠르게","westward":"서쪽으로","large":"큰"},"r":{"a":"[A] wars (전쟁), [B] reduced (줄였다(reduce의 과거형))","w":"11번: 15세기 이후에는 전쟁(wars)과 새로운 바닷길이 실크로드의 중요성을 줄였다(reduced).","c":null,"ev":"11번 문장","s":[[11,"After the 15th century, wars and new sea routes reduced the Silk Road’s importance.","15세기 이후에는 전쟁과 새로운 바닷길이 실크로드의 중요성을 줄였다."]]},"h":"c8cea9bdd8"}]}];

function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
function showScore(p){var sb=document.getElementById("sbar");sb.innerHTML="";var d=done[p.id];var c=el("div","score");c.appendChild(el("span",null,readName(p)+" 점수"));c.appendChild(el("b",null,(d.s*10)+"점"));c.appendChild(el("span",null,d.s+" / 10 문항"));sb.style.display="block";sb.appendChild(c);sb.appendChild(navBar())}
boot();

  var last=null;
  P.forEach(function(p){
    if(p.u!==last){last=p.u;var g=document.createElement("div");g.className="grp";g.textContent=secName(p.u);v.appendChild(g)}
    var ok=ready(p.id);
    var r=document.createElement(ok?"a":"div");r.className="pk"+(ok?"":" lk");if(ok)r.href="?r="+encodeURIComponent(p.id);
    var l=document.createElement("div");var b=document.createElement("b");b.textContent=readName(p);var s=document.createElement("span");s.className="t";s.textContent=p.ko;l.appendChild(b);l.appendChild(s);r.appendChild(l);
    if(!ok){var st=document.createElement("span");st.className="st";st.textContent="잠김";r.appendChild(st)}v.appendChild(r)});
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("홈으로","../",true));v.appendChild(n)}
function gate(p){var v=document.getElementById("view");v.innerHTML="";v.appendChild(testHead(p));
  var g=document.createElement("div");g.className="gate";g.innerHTML="<b>아직 응시할 수 없어요</b><p>지문 읽기와 문제 선지를 모두 마친 뒤에 열려요.</p>";v.appendChild(g);
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("이 Reading으로 돌아가기","../?r="+encodeURIComponent(p.id),true));n.appendChild(lnk("Exit test 목록","./"));v.appendChild(n)}
function boot(){var m=/[?&]r=([^&]+)/.exec(location.search);
  if(m){var id=decodeURIComponent(m[1]);var p=P.filter(function(x){return x.id===id})[0];
    if(p){cur=id;if(!ready(id)){gate(p);return}view();return}}
