<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 마스터 2 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>
</head>

<script>
var P=[{"u":1,"id":"ms2-01-1","no":1,"ko":"어, 저 사람 좋은 사람 아니었어?","items":[{"n":1,"t":"tf","q":"A controversial politician joining a televised dance competition is one example given in the passage.","ko":"논란이 많은 정치인이 방송되는 댄스 경연 대회에 참가하는 것은 이 글에 나온 예시 중 하나이다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"For example, a controversial politician might join a televised dance competition.","예를 들어, 논란이 많은 정치인이 텔레비전으로 방송되는 댄스 경연 대회에 참가할 수 있다."]],"w":"7번 문장에 a controversial politician might join a televised dance competition이 그대로 나와요. 글에 나온 예시와 일치해요.","c":"T"},"h":"41687b3065"},{"n":2,"t":"tf","q":"The goal of funwashing is to make public figures look serious and strict.","ko":"펀워싱의 목표는 공인들이 진지하고 엄격해 보이게 하는 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Their goal is to appear likable and easygoing.","그들의 목표는 호감이 가고 태평스럽게 보이는 것이다."]],"w":"6번에서 목표는 호감이 가고 태평스러워 보이는 것(likable and easygoing)이라고 해요. 진지하고 엄격해 보이게 한다는 말은 반대예요.","c":"F"},"h":"e5c4490335"},{"n":3,"t":"tf","q":"Public figures who use funwashing may not face consequences for the problems they cause.","ko":"펀워싱을 이용하는 공인들은 자신이 일으킨 문제에 대한 결과를 책임지지 않을 수도 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Subsequently, they do not face any consequences for the problems they cause and may even commit worse misconduct later.","결과적으로, 그들은 자신들이 일으키는 문제에 대해 어떠한 결과도 책임지지 않고 나중에는 더 나쁜 위법행위를 저지를 수도 있다."]],"w":"11번에서 그들은 자신들이 일으키는 문제에 대해 어떠한 결과도 책임지지 않는다(do not face any consequences)고 해요.","c":"T"},"h":"971c7c239b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... the act of concealing unpleasant truths using a favorable image.)","ko":"... 호감이 가는 이미지를 사용하여 불쾌한 진실을 숨기는 행위.","opts":["밝히는","비교하는","숨기는","기록하는"],"word":"concealing","r":{"a":"3) 숨기는","ev":"4번 문장","s":[[4,"One clever trick they use is called “funwashing”, which refers to the act of concealing unpleasant truths using a favorable image.","그들이 사용하는 한 가지 영리한 책략은 ‘펀워싱(funwashing)’이라고 불리는데, 이것은 호감이 가는 이미지를 사용하여 불쾌한 진실을 숨기는 행위를 말한다."]],"w":"펀워싱은 좋은 이미지를 써서 불쾌한 진실을 '감추는' 일이에요. 그래서 conceal = 숨기다예요. 밝히는 것이라면 펀워싱의 목적과 반대예요.","c":3},"h":"5195c7abef"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Funwashing typically involves prominent individuals participating in ...)","ko":"펀워싱은 일반적으로 저명한 인물들이 ...에 참여하는 것을 포함한다.","opts":["저명한","평범한","수줍은","젊은"],"word":"prominent","r":{"a":"1) 저명한","ev":"5번 문장","s":[[5,"Funwashing typically involves prominent individuals participating in silly and entertaining public events.","펀워싱은 일반적으로 저명한 인물들이 우스꽝스럽고 재미있는 공개 행사에 참여하는 것을 포함한다."]],"w":"펀워싱을 하는 사람들은 대중에게 잘 알려진 공인들이에요. 그래서 prominent = 저명한이에요. 평범한 사람들이라면 이미지를 관리할 이유가 약해요.","c":1},"h":"16bf997b5c"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis famous saying shows the importance of image in contemporary society.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이 유명한 격언은 현대 사회에서 이미지의 중요성을 보여준다.","opts":["“인식이 전부다”라는 말","현대 사회의 새로운 기술","대중이 공인에게 보내는 호감","공인들이 쓰는 영리한 책략"],"r":{"a":"1) “인식이 전부다”라는 말","ev":"2번 문장","s":[[2,"This famous saying shows the importance of image in contemporary society.","이 유명한 격언은 현대 사회에서 이미지의 중요성을 보여준다."]],"w":"2번 문장의 This famous saying(이 유명한 격언)은 바로 앞 1번 문장의 “Perception is everything.”(“인식이 전부다.”)을 가리켜요. 격언이라는 말에 맞는 것은 이 한 문장이에요.","c":1,"k":"This = “인식이 전부다”라는 말"},"pron":"This","h":"8231cc514e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is why public figures are always on the lookout for new ways to win the public’s approval.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것이 공인들이 항상 대중의 호감을 얻기 위한 새로운 방법을 찾는 이유이다.","opts":["공인들은 대중이 자신을 믿지 못하게 할 방법을 찾는다.","공인들은 이미 있는 방법만 쓰고 새 방법은 찾지 않는다.","대중은 새로운 공인을 찾기 위해 호감 가는 방법을 쓴다.","그래서 공인들은 대중의 호감을 얻을 새로운 방법을 늘 찾는다."],"r":{"a":"4) 그래서 공인들은 대중의 호감을 얻을 새로운 방법을 늘 찾는다.","ev":"3번 문장","s":[[3,"This is why public figures are always on the lookout for new ways to win the public’s approval.","이것이 공인들이 항상 대중의 호감을 얻기 위한 새로운 방법을 찾는 이유이다."]],"w":"This is why ~는 앞 내용(이미지의 중요성)이 이유가 되어 '그래서 ~한다'는 뜻이에요. win approval = 호감을 얻다, always on the lookout for new ways = 새로운 방법을 늘 찾는다예요.","c":4},"h":"153a600f7d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 정치인은 세련된 복장으로 완벽하게 춤을 춘다.","그 정치인은 어설프게 춤추지만 훨씬 쾌활해 보인다.","그 정치인은 댄스 경연 대회에 참가하기를 거부한다.","그 정치인은 심각한 문제를 알리려고 춤을 춘다."],"opts":["The politician dances perfectly in stylish attire.","The politician dances awkwardly but looks more lighthearted.","The politician refuses to join the dance competition.","The politician dances to draw attention to serious problems."],"r":{"a":"2) The politician dances awkwardly but looks more lighthearted.","ev":"8번 문장","s":[[8,"Through the display of smiling and dancing awkwardly in stylish attire, the politician effectively projects a significantly more lighthearted persona.","세련된 복장을 한 채 미소를 지으며 어설프게 춤을 추는 모습을 보여줌으로써, 그 정치인은 훨씬 더 쾌활한 페르소나(모습)를 효과적으로 투영할 수 있다."]],"w":"8번에서 정치인은 어설프게(awkwardly) 춤추지만 훨씬 쾌활한 모습(more lighthearted persona)을 보여 줘요. 완벽하게 춘다거나 문제를 알리려 춘다는 말은 없어요.","c":2},"h":"125ffe9dec"},{"n":9,"t":"sum","q":"Funwashing (A) unpleasant truths behind a favorable image, and although it seems (B) at first glance, it actually hurts society.","ko":"펀워싱은 호감 가는 이미지 뒤에 불쾌한 진실을 (A)하고, 언뜻 (B)해 보이지만 실제로는 사회에 해를 끼친다.","oko":["(A) 드러낸다 / (B) 해가 없다","(A) 드러낸다 / (B) 해롭다","(A) 숨긴다 / (B) 해롭다","(A) 높인다 / (B) 우습다","(A) 숨긴다 / (B) 해가 없다"],"opts":["(A) reveals / (B) harmless","(A) reveals / (B) harmful","(A) hides / (B) harmful","(A) raises / (B) funny","(A) hides / (B) harmless"],"r":{"a":"5) (A) hides / (B) harmless","ev":"4번, 9번 문장","s":[[4,"One clever trick they use is called “funwashing”, which refers to the act of concealing unpleasant truths using a favorable image.","그들이 사용하는 한 가지 영리한 책략은 ‘펀워싱(funwashing)’이라고 불리는데, 이것은 호감이 가는 이미지를 사용하여 불쾌한 진실을 숨기는 행위를 말한다."],[9,"While this practice may seem harmless at first glance, it actually hurts society by distracting the public from these figures’ problematic actions.","이 관행이 언뜻 보기에는 해가 없어 보일 수 있지만, 그것은 실제로 대중의 주의를 이러한 인물들의 문제가 되는 행동으로부터 분산시킴으로써 사회에 해를 끼친다."]],"w":"4번에서 펀워싱은 불쾌한 진실을 숨기는(hides) 행위이고, 9번에서 언뜻 해가 없어(harmless) 보이지만 실제로는 해를 끼친다고 해요. harmful이면 While(~이지만)의 대조가 맞지 않아요.","c":5},"h":"91f3dada77"},{"n":10,"t":"fill","q":"Funwashing helps public figures look [A] and easygoing, but people focus on their entertaining [B] instead of their flaws.","ko":"펀워싱은 공인들이 태평스러우면서도 [A] 사람처럼 보이게 돕지만, 사람들은 결점 대신 그들의 재미있는 [B]에 집중한다.","bank":["likable","personas","approval","consequences","harmful","misconduct"],"bko":{"likable":"호감이 가는","personas":"모습(이미지)","approval":"호감, 지지","consequences":"결과","harmful":"해로운","misconduct":"위법행위"},"r":{"a":"[A] likable, [B] personas","ev":"6번, 10번 문장","s":[[6,"Their goal is to appear likable and easygoing.","그들의 목표는 호감이 가고 태평스럽게 보이는 것이다."],[10,"People focus on their entertaining personas rather than their flaws.","사람들은 그들의 결점보다는 그들의 재미있는 모습에 집중한다."]],"w":"6번 Their goal is to appear likable and easygoing에서 [A]를, 10번 People focus on their entertaining personas rather than their flaws에서 [B]를 가져왔어요. harmful은 호감 가는 이미지와 반대 뜻이라 [A]에 맞지 않고, [B]는 '재미있는 ~'에 어울리는 명사 personas뿐이에요.","c":null},"h":"80ac3b1a65"}]},{"u":1,"id":"ms2-01-2","no":2,"ko":"데이터, 어디까지 빚어봤니?","items":[{"n":1,"t":"tf","q":"The question \"What if data itself became an artistic medium?\" is at the center of Refik Anadol's work.","ko":"‘만약 데이터 그 자체가 예술적 매체가 된다면?’이라는 질문은 레픽 아나돌의 작품의 중심에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"In recent years, however, a new question has emerged: What if data itself became an artistic medium?","그러나 최근 몇 년간, ‘만약 데이터 그 자체가 예술적 매체가 된다면 어떨까?’라는 새로운 질문이 등장했다."],[3,"This question lies at the heart of the work of Turkish artist Refik Anadol.","이 질문은 터키의 예술가 레픽 아나돌(Refik Anadol)의 작품의 중심에 있다."]],"w":"3번에서 This question(2번의 질문)이 아나돌 작품의 중심에 있다(lies at the heart)고 해요.","c":"T"},"h":"cea2aa7385"},{"n":2,"t":"tf","q":"Data has traditionally been used to create art rather than to explain reality.","ko":"데이터는 전통적으로 현실을 설명하기보다는 예술을 창작하는 데 사용되어 왔다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Traditionally, data is used to analyze or explain reality.","전통적으로, 데이터는 현실을 분석하거나 설명하기 위해 사용된다."]],"w":"8번에서 전통적으로 데이터는 현실을 분석하거나 설명하는 데 쓴다고 해요. 예술 창작에 쓰는 것은 아나돌의 새로운 방식(9번)이에요.","c":"F"},"h":"0dbfe63932"},{"n":3,"t":"tf","q":"Anadol designs systems that process images, sounds, and recordings through machine-learning models.","ko":"아나돌은 머신 러닝 모델을 통해 이미지, 소리, 녹음 기록을 처리하는 시스템을 설계한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Instead of painting canvases, he designs systems that process images, sounds, and recordings through machine-learning models.","캔버스에 그림을 그리는 대신, 그는 머신 러닝 모델을 통해 이미지, 소리, 그리고 녹음 기록을 처리하는 시스템을 설계한다."]],"w":"5번에 이 내용이 그대로 있어요. 캔버스에 그림을 그리는 대신 이런 시스템을 설계한다고 해요.","c":"T"},"h":"b536d75120"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... into immersive visual experiences.)","ko":"... 몰입형 시각 경험으로.","opts":["지루한","몰입형의","오래된","복잡한"],"word":"immersive","r":{"a":"2) 몰입형의","ev":"4번 문장","s":[[4,"Anadol is known for using artificial intelligence to transform large sets of data into immersive visual experiences.","아나돌은 대규모 데이터 세트를 몰입형 시각 경험으로 변환하기 위해 인공지능을 사용하는 것으로 알려져 있다."]],"w":"아나돌은 AI로 데이터를 관람객이 푹 빠져드는 시각 경험으로 바꿔요. immersive = 몰입형의예요.","c":2},"h":"9d03c95ad4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The results are not static paintings but constantly shifting forms ...)","ko":"그 결과물은 정적인 그림이 아니라 끊임없이 변화하는 형태들이다.","opts":["정적인","화려한","거대한","값비싼"],"word":"static","r":{"a":"1) 정적인","ev":"6번 문장","s":[[6,"The results are not static paintings but constantly shifting forms that resemble moving sculptures made of light.","그 결과물은 정적인 그림이 아니라 빛으로 만들어진 움직이는 조각을 닮은 끊임없이 변화하는 형태들이다."]],"w":"not static paintings but constantly shifting forms에서 static은 constantly shifting(끊임없이 변하는)과 반대 뜻이에요. static = 정적인(움직이지 않는).","c":1},"h":"5a694c9109"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nFor example, thousands of archived images can be fed into an AI model, which then produces new visual patterns no single human could design alone.","ko":"밑줄 친 which가 가리키는 것은?","sko":"예를 들어, 수천 장의 보관된 이미지들이 AI 모델에 입력될 수 있고, 그러면 그것은 어떤 단일 인간도 혼자서는 설계할 수 없는 새로운 시각적 패턴을 만들어낸다.","opts":["수천 장의 보관된 이미지들","새로운 시각적 패턴","AI 모델","어떤 단일 인간"],"r":{"a":"3) AI 모델","ev":"10번 문장","s":[[10,"For example, thousands of archived images can be fed into an AI model, which then produces new visual patterns no single human could design alone.","예를 들어, 수천 장의 보관된 이미지들이 AI 모델에 입력될 수 있고, 그러면 그것은 어떤 단일 인간도 혼자서는 설계할 수 없는 새로운 시각적 패턴을 만들어낸다."]],"w":"which 앞에 콤마가 있어서 바로 앞의 an AI model을 덧붙여 설명해요. 새 패턴을 '만들어내는' 쪽은 AI 모델이에요.","c":3},"h":"ae110b497d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The artwork does not simply display information; it reimagines it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 예술 작품은 단순히 정보를 보여주는 것이 아니라, 그것을 재해석한다.","opts":["작품은 정보를 감추어 아무도 알아볼 수 없게 만든다.","작품은 정보를 그대로 복사해서 전시하는 데 그친다.","작품은 정보를 보여 주는 것만이 가장 중요하다고 말한다.","작품은 정보를 그저 보여 주는 데 그치지 않고 새롭게 다시 해석한다."],"r":{"a":"4) 작품은 정보를 그저 보여 주는 데 그치지 않고 새롭게 다시 해석한다.","ev":"11번 문장","s":[[11,"The artwork does not simply display information; it reimagines it.","그 예술 작품은 단순히 정보를 보여주는 것이 아니라, 그것을 재해석한다."]],"w":"does not simply display는 '단순히 보여 주지 않는다', it reimagines it은 '그것을 재해석한다'예요. 세미콜론(;) 앞뒤가 not A, B(A가 아니라 B)로 이어져요.","c":4},"h":"eddfaf7efd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아나돌은 데이터를 점토나 물감 같은 원재료로 다룬다.","아나돌은 AI를 완전히 없애고 사람이 직접 그린다.","데이터는 전통적으로 조각상을 만드는 데 쓰였다.","아나돌은 머신 러닝으로 캔버스에 직접 그림을 그린다."],"opts":["Anadol treats data as a raw material like clay or paint.","Anadol removes AI completely and paints by hand.","Data has traditionally been used to make sculptures.","Anadol paints canvases directly with machine learning."],"r":{"a":"1) Anadol treats data as a raw material like clay or paint.","ev":"9번 문장","s":[[9,"In Anadol’s work, however, data is treated as a raw material, similar to clay or paint.","그러나 아나돌의 작품에서, 데이터는 점토나 물감과 유사하게 원재료로 취급된다."]],"w":"9번에서 아나돌의 작품에서 데이터는 점토나 물감과 유사하게 원재료로 취급돼요. 5번은 캔버스에 그림을 그리는 대신 시스템을 설계한다고 하고, 8번 전통적 쓰임은 분석·설명이에요.","c":1},"h":"7f5b85018a"},{"n":9,"t":"sum","q":"Anadol's data art (A) common ideas about creativity, but he argues that creativity still comes from human (B), so AI becomes a collaborator.","ko":"아나돌의 데이터 예술은 창의성에 대한 일반적인 생각에 (A)하지만, 그는 창의성이 여전히 인간의 (B)에서 나온다고 주장하므로 AI는 협력자가 된다.","oko":["(A) 지지한다 / (B) 선택","(A) 도전한다 / (B) 기계","(A) 무시한다 / (B) 데이터","(A) 지지한다 / (B) 기계","(A) 도전한다 / (B) 선택"],"opts":["(A) supports / (B) choices","(A) challenges / (B) machines","(A) ignores / (B) data","(A) supports / (B) machines","(A) challenges / (B) choices"],"r":{"a":"5) (A) challenges / (B) choices","ev":"12번, 14~15번 문장","s":[[12,"This approach challenges common ideas about creativity.","이 접근법은 창의성에 대한 일반적인 생각에 도전한다."],[14,"Anadol argues that creativity still comes from human choices—deciding which data to use, how to train the model, and how the final work is presented.","아나돌은 어떤 데이터를 사용할지, 모델을 어떻게 훈련시킬지, 그리고 최종 작품이 어떻게 제시될지를 결정하는 인간의 선택에서 여전히 창의성이 나온다고 주장한다."],[15,"In this way, AI becomes a collaborator rather than a replacement.","이런 방식으로, AI는 대체물이 아니라 협력자가 된다."]],"w":"12번에서 이 접근법은 창의성에 대한 일반적인 생각에 도전하고(challenges), 14번에서 아나돌은 창의성이 인간의 선택(choices)에서 나온다고 해요. 15번에서 그래서 AI는 협력자예요. 기계(machines)에서 나온다면 협력자라는 말과 어긋나요.","c":5},"h":"45bba11a43"},{"n":10,"t":"fill","q":"For centuries, artists have [A] on physical materials such as paint, stone, or [B] to create their work.","ko":"수세기 동안, 예술가들은 작품을 만들기 위해 물감, 돌, 또는 [B]와(과) 같은 물리적 재료에 [A] 왔다.","bank":["relied","metal","authorship","collaborator","replacement","creativity"],"bko":{"relied":"의존해(rely의 과거분사)","metal":"금속","authorship":"원작자(저작권)","collaborator":"협력자","replacement":"대체물","creativity":"창의성"},"r":{"a":"[A] relied (의존해), [B] metal (금속)","ev":"1번 문장","s":[[1,"For centuries, artists have relied on physical materials such as paint, stone, or metal to create their work.","수세기 동안, 예술가들은 작품을 만들기 위해 물감, 돌, 또는 금속과 같은 물리적 재료에 의존해 왔다."]],"w":"1번 문장 For centuries, artists have relied on physical materials such as paint, stone, or metal에서 가져왔어요. have 뒤에는 과거분사 relied가 와야 하고(rely on = ~에 의존하다), 물감·돌과 나란히 놓이는 재료는 metal(금속)이에요. 나머지는 이 자리에 맞지 않아요.","c":null},"h":"405e1a0b85"}]},{"u":1,"id":"ms2-01-3","no":3,"ko":"기타가 없는 기타 대회","items":[{"n":1,"t":"tf","q":"The Air Guitar World Championships started in 1996 as a small contest.","ko":"에어 기타 세계 선수권 대회는 1996년에 작은 대회로 시작되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"This unique event originated in 1996 as a small contest.","이 독특한 행사는 1996년에 작은 대회로 시작되었다."]],"w":"4번에서 이 독특한 행사는 1996년에 작은 대회로 시작되었다(originated in 1996 as a small contest)고 해요.","c":"T"},"h":"f6a882ae4b"},{"n":2,"t":"tf","q":"The winner is decided only by technical ability.","ko":"우승자는 오직 기술적 능력으로만 결정된다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Evaluation criteria for determining the winner are originality, stage presence, technical ability, and artistic impression.","우승자를 결정하기 위한 평가 기준은 독창성, 무대 존재감, 기술적 능력, 그리고 예술적 인상이다."]],"w":"7번의 평가 기준은 독창성, 무대 존재감, 기술적 능력, 예술적 인상 네 가지예요. 기술적 능력은 그중 하나일 뿐이에요.","c":"F"},"h":"d804062417"},{"n":3,"t":"tf","q":"Contestants sometimes jump into the crowd.","ko":"참가자들은 때때로 군중 속으로 뛰어들기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"They sometimes even jump into the crowd!","그들은 때때로 군중 속으로 뛰어들기도 한다!"]],"w":"9번에 They sometimes even jump into the crowd가 있어요. They는 8번의 contestants예요.","c":"T"},"h":"bb1f57ad3d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... participants execute their air guitar routines in two 60-second rounds.)","ko":"... 참가자들은 두 번의 60초 라운드에서 그들의 에어 기타 루틴을 실행한다.","opts":["실행하다","중단하다","설명하다","빌리다"],"word":"execute","r":{"a":"1) 실행하다","ev":"6번 문장","s":[[6,"During the competition, participants execute their air guitar routines in two 60-second rounds.","대회 동안, 참가자들은 두 번의 60초 라운드에서 그들의 에어 기타 루틴을 실행한다."]],"w":"참가자들이 60초 동안 에어 기타 루틴을 '해내는' 장면이에요. execute = 실행하다예요. 중단하거나 설명하는 것은 경기 장면과 맞지 않아요.","c":1},"h":"319cad78b8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... this witty event fosters global unity through the universal language of music.)","ko":"... 이 재치 있는 행사는 음악이라는 만국 공통어를 통해 세계적인 화합을 촉진한다.","opts":["방해하다","비교하다","촉진하다","숨기다"],"word":"fosters","r":{"a":"3) 촉진하다","ev":"13번 문장","s":[[13,"Moreover, as its slogan “Make Air Not War” suggests, this witty event fosters global unity through the universal language of music.","게다가, “전쟁이 아닌 공기를 만들자”라는 슬로건이 시사하듯이, 이 재치 있는 행사는 음악이라는 만국 공통어를 통해 세계적인 화합을 촉진한다."]],"w":"슬로건 Make Air Not War가 시사하듯이 대회는 세계적인 화합(unity)을 '키워' 줘요. foster = 촉진하다예요. 방해한다면 평화를 추구한다는 10번과 모순돼요.","c":3},"h":"f754b6eacf"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis lowers the barriers to participation, making the contest accessible to people of all ages and backgrounds.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 참여의 장벽을 낮추어, 대회를 모든 연령과 배경의 사람들이 접근 가능하게 만든다.","opts":["평화를 추구한다는 대회의 목적","에어 기타 연주에 특정한 기술이나 장비가 필요 없다는 점","첫 번째 대회가 대성공이었다는 점","참가자들이 군중 속으로 뛰어든다는 점"],"r":{"a":"2) 에어 기타 연주에 특정한 기술이나 장비가 필요 없다는 점","ev":"11~12번 문장","s":[[11,"Fundamentally, playing air guitar requires no specific skills or equipment.","근본적으로, 에어 기타를 연주하는 것은 어떠한 특정한 기술이나 장비도 필요로 하지 않는다."],[12,"This lowers the barriers to participation, making the contest accessible to people of all ages and backgrounds.","이것은 참여의 장벽을 낮추어, 대회를 모든 연령과 배경의 사람들이 접근 가능하게 만든다."]],"w":"12번 This는 바로 앞 11번(에어 기타는 특정한 기술이나 장비가 필요 없다)을 받아요. 그래서 참여의 장벽이 낮아지는 거예요.","c":2},"h":"6cd3f6deaf"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That first competition was a hit, so it has been held in Finland every year since.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 첫 번째 대회는 대성공이었고, 그래서 그 이후로 매년 핀란드에서 개최되어 왔다.","opts":["첫 대회는 실패해서 핀란드에서 한 번만 열렸다.","첫 대회가 핀란드에서 열린 뒤 매년 다른 나라에서 열린다.","첫 대회는 인기가 없었지만 핀란드 사람들이 매년 다시 열었다.","첫 대회가 큰 성공을 거두어서 그 후 매년 핀란드에서 열려 왔다."],"r":{"a":"4) 첫 대회가 큰 성공을 거두어서 그 후 매년 핀란드에서 열려 왔다.","ev":"5번 문장","s":[[5,"That first competition was a hit, so it has been held in Finland every year since.","그 첫 번째 대회는 대성공이었고, 그래서 그 이후로 매년 핀란드에서 개최되어 왔다."]],"w":"was a hit는 대성공이었다는 뜻이고, so는 그래서(결과)예요. has been held ~ every year since는 그 이후 매년 계속 열려 왔다는 뜻이에요.","c":4},"h":"0fa9878f9a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["공연자는 실제 악기를 연주하고 있지 않다.","공연자는 무대에서 진짜 기타를 부수고 있다.","공연자는 음악 없이 조용히 기타를 연주한다.","공연자는 악기 대신 마이크로 노래한다."],"opts":["The performer is not actually playing an instrument.","The performer is breaking a real guitar on stage.","The performer plays a guitar quietly without music.","The performer sings into a microphone instead of playing."],"r":{"a":"1) The performer is not actually playing an instrument.","ev":"1~2번 문장","s":[[1,"As music blasts from the speakers, a performer rocks out on stage, jamming on his guitar.","스피커에서 음악이 크게 울려 퍼질 때, 한 공연자가 무대에서 열광적으로 몸을 흔들며 기타를 즉흥 연주하고 있다."],[2,"However, when you look closer, you realize that he’s not playing an instrument—he’s playing air!","하지만, 더 가까이서 보면, 당신은 그가 악기를 연주하고 있는 것이 아니라 공기를 연주하고 있다는 것을 깨닫는다!"]],"w":"2번에서 공연자는 악기를 연주하는 것이 아니라 공기를 연주하고 있다(he’s not playing an instrument—he’s playing air)고 해요. 1번의 음악은 스피커에서 크게 울려 퍼지고 있어요.","c":1},"h":"e6e062fb61"},{"n":9,"t":"sum","q":"Although the Air Guitar World Championships looks (A), it actually has a (B) objective of pursuing inclusivity and peace.","ko":"에어 기타 세계 선수권 대회는 (A) 보일지라도, 사실 포용성과 평화를 추구하는 (B) 목적을 가지고 있다.","oko":["(A) 진지해 / (B) 고귀한","(A) 우스꽝스러워 / (B) 이기적인","(A) 우스꽝스러워 / (B) 고귀한","(A) 진지해 / (B) 이기적인","(A) 비싸 / (B) 고귀한"],"opts":["(A) serious / (B) noble","(A) silly / (B) selfish","(A) silly / (B) noble","(A) serious / (B) selfish","(A) expensive / (B) noble"],"r":{"a":"3) (A) silly / (B) noble (우스꽝스러워 / 고귀한)","ev":"10번 문장","s":[[10,"Although it may look a bit silly, the event actually has a noble objective of pursuing inclusivity and peace.","비록 약간 우스꽝스러워 보일지라도, 그 행사는 사실 포용성과 평화를 추구한다는 고귀한 목적을 가지고 있다."]],"w":"10번에서 Although it may look a bit silly(비록 약간 우스꽝스러워 보일지라도), 행사는 noble objective(고귀한 목적)를 가지고 있다고 해요. Although로 겉모습과 속뜻이 대조되니 serious나 selfish는 맞지 않아요.","c":3},"h":"8159694e2b"},{"n":10,"t":"fill","q":"To get a better score, contestants often wear outlandish [A] and showcase their impressive air guitar skills to entertain the [B].","ko":"더 좋은 점수를 받기 위해, 참가자들은 종종 기이한 [A]을(를) 입고 그들의 인상적인 에어 기타 기술을 선보여 [B]을(를) 즐겁게 한다.","bank":["costumes","audience","rounds","criteria","barriers","unity"],"bko":{"costumes":"의상","audience":"관중","rounds":"라운드(경기 단위)","criteria":"기준(criterion의 복수형)","barriers":"장벽(barrier의 복수형)","unity":"화합"},"r":{"a":"[A] costumes (의상), [B] audience (관중)","ev":"8번 문장","s":[[8,"To get a better score, contestants often wear outlandish costumes and showcase their impressive air guitar skills to entertain the audience.","더 좋은 점수를 받기 위해, 참가자들은 종종 관중을 즐겁게 하기 위해 기이한 의상을 입고 그들의 인상적인 에어 기타 기술을 선보인다."]],"w":"8번 문장 To get a better score, contestants often wear outlandish costumes and showcase their impressive air guitar skills to entertain the audience에서 가져왔어요. 입는 것은 costumes(의상), 즐겁게 해 주는 대상은 audience(관중)예요. A와 B를 바꾸면 말이 안 돼요.","c":null},"h":"f7ffe40482"}]},{"u":1,"id":"ms2-01-4","no":4,"ko":"He, She... Why Not Both?","items":[{"n":1,"t":"tf","q":"About 70 percent of F. ancora colonies switched from female to male in 2011.","ko":"2011년에 F. ancora 군락의 약 70퍼센트가 암컷에서 수컷으로 전환했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In 2011, marine biologists observed that about 70 percent of F. ancora colonies underwent a synchronized switch from female to male!","2011년에, 해양 생물학자들은 F. ancora 군락의 약 70퍼센트가 암컷에서 수컷으로 동기화된 전환을 겪었다는 것을 관찰했다!"]],"w":"5번에서 해양 생물학자들이 2011년에 군락의 약 70퍼센트가 암컷에서 수컷으로 동기화된 전환을 겪었다고 관찰했어요.","c":"T"},"h":"171306bec6"},{"n":2,"t":"tf","q":"After switching once, the corals stayed male year after year.","ko":"한 번 전환한 뒤, 산호들은 해마다 계속 수컷으로 남아 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"These same groups continued this cycle, alternating between female and male year after year.","이 같은 그룹들은 이 주기를 계속했고, 해마다 암컷과 수컷 사이를 번갈아 가며 전환했다."]],"w":"7번에서 같은 그룹들은 해마다 암컷과 수컷 사이를 번갈아 전환했어요(alternating). 계속 수컷으로 남은 것이 아니에요.","c":"F"},"h":"2c9f61d2ec"},{"n":3,"t":"tf","q":"Corals that periodically change their gender can reach a wider range of mates.","ko":"주기적으로 성별을 바꾸는 산호는 더 넓은 범위의 짝에 접근할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"Corals that periodically change their gender have access to a wider range of mates, resulting in more varied combinations of partners.","주기적으로 그들의 성별을 바꾸는 산호들은 더 넓은 범위의 짝에 접근할 수 있어, 더 다양한 짝 조합이 이루어지는 결과를 낳는다."]],"w":"13번에서 주기적으로 성별을 바꾸는 산호들은 더 넓은 범위의 짝에 접근할 수 있다(have access to a wider range of mates)고 해요.","c":"T"},"h":"7ee513373e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The discovery has drawn scientific attention, leading to research into the underlying causes.)","ko":"이 발견은 과학적 관심을 끌어, 근본적인 원인에 대한 연구로 이어졌다.","opts":["근본적인","최근의","우연한","불가능한"],"word":"underlying","r":{"a":"1) 근본적인","ev":"8번 문장","s":[[8,"The discovery has drawn scientific attention, leading to research into the underlying causes.","이 발견은 과학적 관심을 끌어, 근본적인 원인에 대한 연구로 이어졌다."]],"w":"과학자들이 연구하려는 것은 겉으로 보이는 현상 밑에 있는 원인이에요. underlying = 근본적인이에요. 9번에서 그 원인으로 두 가지 이유가 나와요.","c":1},"h":"129567ed95"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (First, it significantly increases the likelihood of reproduction occurring.)","ko":"첫째, 그것은 번식이 일어날 가능성을 크게 증가시킨다.","opts":["위험","가능성","비용","속도"],"word":"likelihood","r":{"a":"2) 가능성","ev":"10번 문장","s":[[10,"First, it significantly increases the likelihood of reproduction occurring.","첫째, 그것은 번식이 일어날 가능성을 크게 증가시킨다."]],"w":"성별 전환은 번식이 일어날 '가능성'을 높이고, 11번에서 짝짓기가 가능해지는 예가 나와요. likelihood = 가능성이에요.","c":2},"h":"95e739a506"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nFor example, mating between two primarily female colonies becomes possible when many members of one colony change their gender to male.","ko":"밑줄 친 their가 가리키는 것은?","sko":"예를 들어, 주로 암컷인 두 군락 사이의 짝짓기는 한 군락의 많은 구성원들이 그들의 성별을 수컷으로 바꿀 때 가능해진다.","opts":["주로 암컷인 두 군락 전체","암컷으로 남아 있는 다른 군락의 산호들","한 군락의 많은 구성원들","그 군락과 짝짓기하는 산호들"],"r":{"a":"3) 한 군락의 많은 구성원들","ev":"11번 문장","s":[[11,"For example, mating between two primarily female colonies becomes possible when many members of one colony change their gender to male.","예를 들어, 주로 암컷인 두 군락 사이의 짝짓기는 한 군락의 많은 구성원들이 그들의 성별을 수컷으로 바꿀 때 가능해진다."]],"w":"when many members of one colony change their gender에서 성별을 바꾸는 주체는 한 군락의 많은 구성원들이에요. 그래서 their는 이들을 가리켜요.","c":3},"h":"198f3f1bf5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The remarkable flexibility of these corals serves as a quiet reminder that survival often lies in the ability to change.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 산호들의 놀라운 융통성은 생존이란 종종 변화할 수 있는 능력에 달려 있음을 조용히 일깨워 준다.","opts":["산호들의 놀라운 융통성은 변하지 않을수록 살아남기 쉽다는 것을 일깨워 준다.","이 산호들은 변화의 능력이 없어도 생존할 수 있다는 것을 보여 준다.","산호들의 융통성은 오직 번식을 위해서만 필요하다는 것을 알려 준다.","이 산호들의 놀라운 융통성은 살아남는 일이 흔히 변화할 수 있는 능력에 달려 있음을 조용히 일깨워 준다."],"r":{"a":"4) 이 산호들의 놀라운 융통성은 살아남는 일이 흔히 변화할 수 있는 능력에 달려 있음을 조용히 일깨워 준다.","ev":"14번 문장","s":[[14,"The remarkable flexibility of these corals serves as a quiet reminder that survival often lies in the ability to change.","이 산호들의 놀라운 융통성은 생존이란 종종 변화할 수 있는 능력에 달려 있음을 조용히 일깨워 준다."]],"w":"serves as a quiet reminder that ~은 '~라는 점을 조용히 일깨워 준다'예요. survival often lies in the ability to change는 생존이 흔히 변화할 수 있는 능력에 달려 있다는 뜻이에요.","c":4},"h":"63b591a2e7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["카멜레온은 난완 만에서 큰 군락을 이룬다.","해머 산호는 난완 만에서 군락이라 불리는 큰 공동체를 이룬다.","해머 산호는 혼자 살며 무리 짓지 않는다.","해머 산호 군락은 일본에서만 발견된다."],"opts":["Chameleons form large colonies in Nanwan Bay.","Hammer corals form large communities called colonies in Nanwan Bay.","Hammer corals live alone and avoid forming groups.","Hammer coral colonies are found only in Japan."],"r":{"a":"2) Hammer corals form large communities called colonies in Nanwan Bay.","ev":"1번, 3번 문장","s":[[1,"If you think color-changing chameleons are nature’s greatest masters of disguise, think again.","만약 당신이 색이 변하는 카멜레온이 자연의 가장 위대한 변장의 대가라고 생각한다면, 다시 생각해보아라."],[3,"In Nanwan Bay, Taiwan, these creatures form large communities called colonies.","대만의 난완 만에서, 이 생물들은 군락이라고 불리는 큰 공동체를 형성한다."]],"w":"3번에서 대만의 난완 만에서 이 생물들(해머 산호)이 군락이라고 불리는 큰 공동체를 이룬다고 해요. 카멜레온은 1번에서 비교용으로만 나와요.","c":2},"h":"de712983e3"},{"n":9,"t":"sum","q":"Changing gender gives hammer corals a reproductive (A), which leads to much greater (B) diversity.","ko":"성별을 바꾸는 것은 해머 산호에게 번식상의 (A)을(를) 주고, 이는 훨씬 더 큰 (B) 다양성으로 이어진다.","oko":["(A) 문제 / (B) 유전적","(A) 이점 / (B) 사회적","(A) 문제 / (B) 사회적","(A) 이점 / (B) 신체적","(A) 이점 / (B) 유전적"],"opts":["(A) problem / (B) genetic","(A) advantage / (B) social","(A) problem / (B) social","(A) advantage / (B) physical","(A) advantage / (B) genetic"],"r":{"a":"5) (A) advantage / (B) genetic (이점 / 유전적)","ev":"12번 문장","s":[[12,"Second, this reproductive advantage also leads to much greater genetic diversity.","둘째, 이 번식적 이점은 또한 훨씬 더 큰 유전적 다양성으로 이어진다."]],"w":"12번 문장 Second, this reproductive advantage also leads to much greater genetic diversity에서 가져왔어요. 번식에 도움이 되는 점이니 advantage(이점)이고, 다양성은 유전자에 대한 것이라 genetic(유전적)이에요. problem이면 '더 큰 다양성으로 이어진다'는 흐름이 맞지 않아요.","c":5},"h":"6f5fa09d97"},{"n":10,"t":"fill","q":"If you think color-changing chameleons are nature’s greatest [A] of [B], think again.","ko":"만약 당신이 색이 변하는 카멜레온이 자연의 가장 위대한 [B]의 [A](이)라고 생각한다면, 다시 생각해보아라.","bank":["masters","disguise","colonies","mates","combinations","reasons"],"bko":{"masters":"대가(master의 복수형)","disguise":"변장","colonies":"군락(colony의 복수형)","mates":"짝(mate의 복수형)","combinations":"조합(combination의 복수형)","reasons":"이유(reason의 복수형)"},"r":{"a":"[A] masters (대가), [B] disguise (변장)","ev":"1번 문장","s":[[1,"If you think color-changing chameleons are nature’s greatest masters of disguise, think again.","만약 당신이 색이 변하는 카멜레온이 자연의 가장 위대한 변장의 대가라고 생각한다면, 다시 생각해보아라."]],"w":"1번 문장 If you think color-changing chameleons are nature’s greatest masters of disguise, think again에서 가져왔어요. masters of disguise는 '변장의 대가'라는 뜻이에요. A와 B를 바꾸면 '대가의 변장'이 되어 뜻이 맞지 않아요.","c":null},"h":"0154195fb5"}]},{"u":2,"id":"ms2-02-1","no":1,"ko":"100년째 마르지 않는 지갑의 비밀","items":[{"n":1,"t":"tf","q":"Alfred Nobel made much of his fortune by inventing dynamite.","ko":"알프레드 노벨은 다이너마이트를 발명하여 재산의 상당 부분을 모았다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It all dates back to Alfred Nobel, the Swedish scientist who made his fortune largely from inventing dynamite.","그것은 모두 주로 다이너마이트를 발명하여 부를 축적한 스웨덴 과학자 알프레드 노벨로 거슬러 올라간다."]],"w":"4번 문장에서 노벨은 largely from inventing dynamite, 즉 주로 다이너마이트를 발명해서 재산을 모았다고 해요.","c":"T"},"h":"c7a2fe3e95"},{"n":2,"t":"tf","q":"The prize recovered its initial value right after World War I.","ko":"상금은 제1차 세계대전 직후에 초기 가치를 회복했다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"For example, in 1919, right after World War I, the prize dipped to a mere $230,000 in today’s terms and didn’t recover its initial value until 1991.","예를 들어, 1919년 제1차 세계대전 직후, 상금은 오늘날 기준으로 단지 23만 달러로 떨어졌고 1991년까지 초기 가치를 회복하지 못했다."]],"w":"9번 문장에서 1919년 전쟁 직후 상금은 23만 달러로 떨어졌고 1991년까지 초기 가치를 회복하지 못했어요. 직후에 회복했다는 말은 반대예요.","c":"F"},"h":"5b2fbaa2d6"},{"n":3,"t":"tf","q":"The first Nobel Prizes were worth about $1 million by today’s standards.","ko":"첫 번째 노벨상들은 오늘날의 기준으로 약 100만 달러의 가치가 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The first prizes, awarded in 1901, were worth about $1 million by today’s standards.","1901년에 수여된 첫 번째 상들은 오늘날의 기준으로 약 100만 달러의 가치가 있었다."]],"w":"7번 문장에 The first prizes, awarded in 1901, were worth about $1 million by today’s standards라고 그대로 나와요.","c":"T"},"h":"69cde802dc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But how can such substantial rewards be awarded to multiple winners across different categories?)","ko":"그런데 어떻게 그렇게 상당한 보상이 여러 다른 부문에 걸쳐 다수 수상자들에게 수여될 수 있는가?","opts":["사소한","오래된","상당한","불법적인"],"word":"substantial","r":{"a":"3) 상당한","ev":"3번 문장","s":[[3,"But how can such substantial rewards be awarded to multiple winners across different categories?","그런데 어떻게 그렇게 상당한 보상이 여러 다른 부문에 걸쳐 다수 수상자들에게 수여될 수 있는가?"]],"w":"3번 문장은 한강이 받은 100만 달러가 넘는 상금(2번)처럼 큰 보상을 말해요. substantial = 상당한, 규모가 큰.","c":3},"h":"336f91e5ee"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This ensures substantial prize amounts and financial stability for decades to come.)","ko":"이것은 다가올 수십 년 동안 상당한 상금 액수와 재정적 안정을 보장한다.","opts":["위협한다","보장한다","줄인다","숨긴다"],"word":"ensures","r":{"a":"2) 보장한다","ev":"10~11번 문장","s":[[10,"Currently, thanks to smart investments, Nobel’s trust has grown to an impressive $500 million.","현재, 현명한 투자 덕분에, 노벨의 신탁 기금은 인상적인 5억 달러로 불어났다."],[11,"This ensures substantial prize amounts and financial stability for decades to come.","이것은 다가올 수십 년 동안 상당한 상금 액수와 재정적 안정을 보장한다."]],"w":"10번에서 기금이 5억 달러로 불어났고, 11번 This는 그것을 가리켜요. 그래서 앞으로도 상금과 안정이 이어지도록 '보장한다'는 뜻이에요. ensure = 보장하다.","c":2},"h":"4064d4313d"},{"n":6,"t":"ref","q":"What does the underlined \"These funds\" refer to?\nThese funds would be used to honor groundbreaking contributions in physics, chemistry, medicine, literature, and peace.","ko":"밑줄 친 These funds가 가리키는 것은?","sko":"이 자금들은 물리학, 화학, 의학, 문학, 그리고 평화 분야에서 획기적인 공헌을 기리는 데 사용될 것이었다.","opts":["다이너마이트의 판매 가격","수상자들의 월급","여러 개의 금메달","노벨의 재산에서 나온 수익금"],"r":{"a":"4) 노벨의 재산에서 나온 수익금","ev":"5~6번 문장","s":[[5,"Before his death in 1896, Nobel directed that the profits from his substantial fortune be invested.","1896년 그가 사망하기 전, 노벨은 그의 상당한 재산에서 나온 수익금을 투자하라고 지시했다."],[6,"These funds would be used to honor groundbreaking contributions in physics, chemistry, medicine, literature, and peace.","이 자금들은 물리학, 화학, 의학, 문학, 그리고 평화 분야에서 획기적인 공헌을 기리는 데 사용될 것이었다."]],"w":"6번 These funds는 바로 앞 5번에서 투자하라고 지시한 the profits from his substantial fortune(재산에서 나온 수익금)이에요.","c":4},"h":"4f9962c41e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Over the years, the prize amounts have fluctuated depending on global events and Swedish currency values.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"수년 동안, 상금 액수는 세계적인 사건들과 스웨덴 화폐 가치에 따라 변동했다.","opts":["수년 동안 상금 액수는 세계적 사건과 스웨덴 화폐 가치에 따라 오르내렸다.","수년 동안 상금 액수는 한 번도 변하지 않았다.","상금 액수는 스웨덴 화폐 가치와 상관없이 세계적 사건으로만 정해졌다.","상금 액수는 처음 몇 해 동안만 변했고 이후에는 고정되었다."],"r":{"a":"1) 수년 동안 상금 액수는 세계적 사건과 스웨덴 화폐 가치에 따라 오르내렸다.","ev":"8번 문장","s":[[8,"Over the years, the prize amounts have fluctuated depending on global events and Swedish currency values.","수년 동안, 상금 액수는 세계적인 사건들과 스웨덴 화폐 가치에 따라 변동했다."]],"w":"fluctuate = 변동하다이고, depending on은 '~에 따라'예요. 세계적 사건과 화폐 가치 두 가지 모두에 따라 변했다는 뜻이에요.","c":1},"h":"6ae1e11bc9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["한강이 받은 노벨 문학상의 상금은 100만 달러가 넘었다.","1901년 첫 상들의 가치는 오늘날 기준으로 23만 달러였다.","상금은 1901년부터 지금까지 같은 액수로 유지되었다.","노벨은 다이너마이트를 발명한 뒤 후회 없이 재산을 썼다."],"opts":["Han Kang’s Nobel Prize came with prize money of over one million dollars.","The first prizes of 1901 were worth $230,000 by today’s standards.","The prize amount has stayed the same since 1901.","Nobel spent his fortune freely after inventing dynamite, with no regrets."],"r":{"a":"1) Han Kang’s Nobel Prize came with prize money of over one million dollars.","ev":"2번 문장","s":[[2,"Along with the prestigious gold medal, she received prize money exceeding one million dollars (11 million Swedish kronor).","명망 높은 금메달과 함께, 그녀는 백만 달러(천백만 스웨덴 크로나)가 넘는 상금을 받았다."]],"w":"2번 문장에서 금메달과 함께 100만 달러가 넘는 상금을 받았다고 해요. 23만 달러는 1901년이 아니라 1919년의 금액(9번)이고, 상금은 변동했으며(8번), 노벨은 재산을 투자하라고 지시했어요(5번).","c":1},"h":"72160d4c44"},{"n":9,"t":"sum","q":"Nobel’s fortune was (A) after his death, and the fund has (B) over time, so large prizes can continue.","ko":"노벨의 재산은 그의 사후에 (A)되었고, 기금은 시간이 지나며 (B)했으므로 큰 상금이 계속될 수 있다.","oko":["(A) 소비 / (B) 커졌다","(A) 투자 / (B) 줄어들었다","(A) 숨겨짐 / (B) 사라졌다","(A) 소비 / (B) 줄어들었다","(A) 투자 / (B) 커졌다"],"opts":["(A) spent / (B) grown","(A) invested / (B) shrunk","(A) hidden / (B) lost","(A) spent / (B) shrunk","(A) invested / (B) grown"],"r":{"a":"5) (A) invested / (B) grown","ev":"5번, 10번 문장","s":[[5,"Before his death in 1896, Nobel directed that the profits from his substantial fortune be invested.","1896년 그가 사망하기 전, 노벨은 그의 상당한 재산에서 나온 수익금을 투자하라고 지시했다."],[10,"Currently, thanks to smart investments, Nobel’s trust has grown to an impressive $500 million.","현재, 현명한 투자 덕분에, 노벨의 신탁 기금은 인상적인 5억 달러로 불어났다."]],"w":"5번에서 노벨은 수익금을 투자(invest)하라고 지시했고, 10번에서 기금이 5억 달러로 커졌어요(grown). 소비하거나 줄었다는 말은 본문에 없어요.","c":5},"h":"ba10d5b246"},{"n":10,"t":"fill","q":"Nobel was [A] by the destructive impact of dynamite, so he wanted to leave something [B] for humanity.","ko":"노벨은 다이너마이트의 파괴적인 영향에 [A] 상태였고, 그래서 인류를 위해 [B] 무언가를 남기고 싶어 했다.","bank":["troubled","meaningful","awarded","fluctuated","dipped","ensured"],"bko":{"troubled":"괴로워하는","meaningful":"의미 있는","awarded":"수여된","fluctuated":"변동했다","dipped":"떨어졌다","ensured":"보장했다"},"r":{"a":"[A] troubled, [B] meaningful","ev":"12번 문장","s":[[12,"Perhaps this is the lasting legacy of Nobel, a man who was troubled by the destructive impact of dynamite and sought to leave behind something meaningful for humanity.","아마도 이것은 다이너마이트의 파괴적인 영향에 대해 괴로워했고 인류를 위해 의미 있는 무언가를 남기고자 했던 사람인 노벨의 지속적인 유산일 것이다."]],"w":"12번 문장에서 노벨은 a man who was troubled by the destructive impact of dynamite(다이너마이트의 파괴적인 영향에 괴로워한 사람)였고, 인류를 위해 something meaningful을 남기려 했어요. invested·fluctuated·dipped·ensured는 이 문장에 나오지 않고 뜻도 맞지 않아요.","c":null},"h":"bcf9a8f1ed"}]},{"u":2,"id":"ms2-02-2","no":2,"ko":"무서운 게 약이 된다","items":[{"n":1,"t":"tf","q":"Some psychologists believe that horror films give viewers a controlled experience of fear.","ko":"일부 심리학자들은 공포 영화가 관객에게 통제된 공포 경험을 준다고 믿는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Psychologists who have examined the effects that scary movies have on the psyche believe that horror films allow viewers to have a controlled experience of fear.","무서운 영화가 정신에 미치는 영향을 조사한 심리학자들은 공포 영화가 관객들로 하여금 통제된 공포 경험을 하도록 해준다고 믿는다."]],"w":"2번 문장에서 심리학자들은 horror films allow viewers to have a controlled experience of fear라고 믿는다고 해요.","c":"T"},"h":"5d4a2e1300"},{"n":2,"t":"tf","q":"Psychologists say horror films make the brain more afraid of uncertainty.","ko":"심리학자들은 공포 영화가 뇌가 불확실성을 더 두려워하게 만든다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Psychologists also suggest that horror films help the brain become accustomed to uncertainty.","심리학자들은 또한 공포 영화가 뇌가 불확실성에 익숙해지도록 돕는다고 시사한다."]],"w":"7번 문장에서 공포 영화는 뇌가 불확실성에 익숙해지도록(become accustomed to uncertainty) 돕는다고 해요. 더 두려워하게 만든다는 말은 반대예요.","c":"F"},"h":"6a4eeada00"},{"n":3,"t":"tf","q":"Horror films offer a way to face fears safely.","ko":"공포 영화는 안전하게 공포에 직면하는 방법을 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"They offer a means to face fears safely, test psychological limits, and increase emotional resilience.","그것들은 안전하게 공포에 직면하고, 심리적 한계를 시험하며, 감정적 회복력을 증가시키는 수단을 제공한다."]],"w":"11번 문장에 They offer a means to face fears safely라고 나와요. means는 방법, 수단이에요.","c":"T"},"h":"93a1c27d3e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…fear evolved to protect us from possible harm by provoking strong reactions…)","ko":"…공포는 강한 반응을 유발함으로써 우리를 발생 가능한 위험으로부터 보호하도록 진화했다.","opts":["막는","유발하는","숨기는","줄이는"],"word":"provoking","r":{"a":"2) 유발하는","ev":"3번 문장","s":[[3,"From an evolutionary perspective, fear evolved to protect us from possible harm by provoking strong reactions such as a racing heart or an urge to escape.","진화적 관점에서, 공포는 심장이 빨리 뛰거나 도망치고 싶은 충동과 같은 강한 반응을 유발함으로써 우리를 발생 가능한 위험으로부터 보호하도록 진화했다."]],"w":"3번에서 공포는 심장이 빨리 뛰거나 도망치고 싶은 강한 반응을 일으켜서 우리를 지켜요. provoke = 유발하다, 일으키다.","c":2},"h":"196664537c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…we can improve how our minds predict and cope with real-life challenges.)","ko":"…우리는 우리의 마음이 실제 삶의 도전들을 예측하고 대처하는 방식을 개선할 수 있다.","opts":["피해 다니다","구경하다","무시하다","대처하다"],"word":"cope","r":{"a":"4) 대처하다","ev":"8번 문장","s":[[8,"By exposing ourselves to fear in a controlled manner, we can improve how our minds predict and cope with real-life challenges.","통제된 방식으로 우리 자신을 공포에 노출시킴으로써, 우리는 우리의 마음이 실제 삶의 도전들을 예측하고 대처하는 방식을 개선할 수 있다."]],"w":"8번은 통제된 공포 경험으로 현실의 어려움을 예측하고 '대처'하는 방식이 좋아진다는 내용이에요. cope with = ~에 대처하다.","c":4},"h":"1f74e5d1a3"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nYou may think that horror films merely make for a thrilling experience, but recent research shows that they also reduce anxiety.","ko":"밑줄 친 they가 가리키는 것은?","sko":"당신은 공포 영화가 단지 스릴 넘치는 경험이 된다고 생각할지도 모르지만, 최근의 연구는 그것들이 불안을 줄여주기도 한다는 것을 보여준다.","opts":["공포 영화들","연구자들","관객들","불안의 감정들"],"r":{"a":"1) 공포 영화들","ev":"1번 문장","s":[[1,"You may think that horror films merely make for a thrilling experience, but recent research shows that they also reduce anxiety.","당신은 공포 영화가 단지 스릴 넘치는 경험이 된다고 생각할지도 모르지만, 최근의 연구는 그것들이 불안을 줄여주기도 한다는 것을 보여준다."]],"w":"but 뒤 that절의 주어 they는 앞의 horror films예요. 불안을 줄여 주는 것은 공포 영화이고, 줄어드는 대상이 anxiety(불안)예요.","c":1},"h":"f321122caa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In this sense, watching horror movies is a kind of emotional rehearsal.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이런 의미에서, 공포 영화를 보는 것은 일종의 감정적 예행연습이다.","opts":["공포 영화를 보는 것은 배우들이 대사를 연습하는 일이다.","공포 영화를 보면 감정이 점점 사라진다.","공포 영화를 보는 것은 공포를 안전하게 미리 겪어 보며 감정에 대비하는 연습과 같다.","공포 영화는 연습 없이 즐기는 단순한 오락이다."],"r":{"a":"3) 공포 영화를 보는 것은 공포를 안전하게 미리 겪어 보며 감정에 대비하는 연습과 같다.","ev":"9번 문장","s":[[9,"In this sense, watching horror movies is a kind of emotional rehearsal.","이런 의미에서, 공포 영화를 보는 것은 일종의 감정적 예행연습이다."]],"w":"rehearsal은 예행연습이에요. 앞 내용(6~8번)처럼 안전한 곳에서 공포와 불안을 미리 겪어 보며 대처를 연습한다는 뜻이에요.","c":3},"h":"5a88760ee8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["공포는 사람들이 위험한 상황을 즐기도록 진화했다.","공포 영화는 단지 스트레스를 유발하기보다 사람들이 불안을 다루도록 도울 수 있다.","관객들은 영화 속 환경이 안전한지 알지 못한다.","공포 영화는 뇌가 불확실성을 더 무서워하게 만든다."],"opts":["Fear evolved so that people would enjoy dangerous situations.","Horror films may help people deal with anxieties instead of just causing stress.","Viewers cannot tell that the movie environment is safe.","Horror films make the brain more afraid of uncertainty."],"r":{"a":"2) Horror films may help people deal with anxieties instead of just causing stress.","ev":"10번 문장","s":[[10,"Overall, rather than simply causing stress, horror films may help people deal with anxieties.","전반적으로, 단순히 스트레스를 유발하기보다는, 공포 영화는 사람들이 불안을 다루는 것을 도울지도 모른다."]],"w":"10번 문장에서 공포 영화는 단지 스트레스를 유발하기보다 사람들이 불안을 다루도록 도울 수 있다고 해요. 공포는 위험에서 지키려고 진화했고(3번), 관객은 환경이 안전함을 알며(5번), 뇌는 불확실성에 익숙해져요(7번).","c":2},"h":"cb09f6d831"},{"n":9,"t":"sum","q":"Horror films allow people to (A) feelings of anxiety without risk, which helps them understand and (B) their own stress.","ko":"공포 영화는 사람들이 위험 없이 불안의 감정을 (A)하게 해 주고, 이는 그들이 자신의 스트레스를 이해하고 (B)하도록 돕는다.","oko":["(A) 회피 / (B) 무시","(A) 탐구 / (B) 무시","(A) 회피 / (B) 관리","(A) 탐구 / (B) 증가","(A) 탐구 / (B) 관리"],"opts":["(A) avoid / (B) ignore","(A) explore / (B) ignore","(A) avoid / (B) manage","(A) explore / (B) increase","(A) explore / (B) manage"],"r":{"a":"5) (A) explore / (B) manage (탐구 / 관리)","ev":"6번 문장","s":[[6,"This allows them to explore feelings of anxiety without risk, which ultimately helps them understand and manage their own stress.","이것은 그들이 위험 없이 불안의 감정을 탐구하도록 해주며, 이는 궁극적으로 그들이 자신의 스트레스를 이해하고 관리하도록 돕는다."]],"w":"6번 문장 This allows them to explore feelings of anxiety without risk, which ultimately helps them understand and manage their own stress에서 가져왔어요. 위험 없이 불안의 감정을 탐구하고(explore), 자신의 스트레스를 이해하고 관리하도록(manage) 돕는다는 뜻이에요. avoid, ignore, increase는 본문과 맞지 않아요.","c":5},"h":"3588f16d23"},{"n":10,"t":"fill","q":"When people watch [A] movies, their brains and [B] react as if they are in danger.","ko":"사람들이 [A] 영화를 볼 때, 그들의 뇌와 [B]은(는) 마치 위험에 처한 것처럼 반응한다.","bank":["scary","bodies","react","reduce","cope","provoke"],"bko":{"scary":"무서운","bodies":"몸(body의 복수형)","react":"반응하다","reduce":"줄이다","cope":"대처하다","provoke":"유발하다"},"r":{"a":"[A] scary (무서운), [B] bodies (몸)","ev":"4번 문장","s":[[4,"When people watch scary movies, their brains and bodies react as if they are in danger.","사람들이 무서운 영화를 볼 때, 그들의 뇌와 몸은 마치 그들이 위험에 처한 것처럼 반응한다."]],"w":"4번 문장 When people watch scary movies, their brains and bodies react as if they are in danger에서 가져왔어요. movies 앞에는 형용사 scary(무서운)가, '뇌(brains)'와 짝을 이루는 말은 bodies(몸)예요. react, reduce, cope, provoke는 동사라서 이 자리에 올 수 없어요.","c":null},"h":"8bc9a099ee"}]},{"u":2,"id":"ms2-02-3","no":3,"ko":"빙산의 일각? 아니, 화산의 일각!","items":[{"n":1,"t":"tf","q":"Lava cools and hardens much more quickly in water.","ko":"용암은 물속에서 훨씬 더 빠르게 식고 굳는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"At the same time, the molten rock—called lava—cools and hardens much more quickly in water.","동시에, 용암이라 불리는 녹은 암석은 물속에서 훨씬 더 빠르게 식고 굳는다."]],"w":"7번 문장에 the molten rock—called lava—cools and hardens much more quickly in water라고 그대로 나와요.","c":"T"},"h":"e1c2de6157"},{"n":2,"t":"tf","q":"The pressure of the seawater makes an underwater eruption more explosive.","ko":"바닷물의 압력은 수중 분출을 더 폭발적으로 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The extreme pressure generated by the seawater above the vent compresses the released gases, robbing them of much of their explosive force.","분출구 위의 바닷물에 의해 생성된 극도의 압력이 방출된 가스를 압축하여, 그것들의 폭발력의 상당 부분을 빼앗는다."]],"w":"6번 문장에서 바닷물의 극도의 압력이 가스를 압축해 폭발력의 상당 부분을 빼앗는다고 해요. 더 폭발적으로 만든다는 말은 반대예요.","c":"F"},"h":"5c03c6a301"},{"n":3,"t":"tf","q":"The islands of Hawaii are one of the least famous examples of this process.","ko":"하와이 제도는 이 과정의 가장 덜 유명한 예 중 하나이다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"One of the most famous examples of this process is the islands of Hawaii.","이 과정의 가장 유명한 예 중 하나는 하와이 제도이다."]],"w":"12번 문장에서 하와이 제도는 one of the most famous examples(가장 유명한 예 중 하나)라고 해요. 덜 유명하다는 말은 반대예요.","c":"F"},"h":"bc6e5e8c57"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…car-sized lumps that resemble giant fluffy pillows…)","ko":"…거대한 푹신한 베개를 닮은 자동차 크기의 덩어리…","opts":["닮다","부수다","대체하다","피하다"],"word":"resemble","r":{"a":"1) 닮다","ev":"8번 문장","s":[[8,"The resulting rock formations may take the form of car-sized lumps that resemble giant fluffy pillows or flat, circular sheets that spread out evenly in every direction.","결과적인 암석 형성물은 거대한 푹신한 베개를 닮은 자동차 크기의 덩어리나 모든 방향으로 고르게 퍼지는 평평한 원형 판의 형태를 취할 수 있다."]],"w":"8번에서 암석 덩어리가 푹신한 베개 모양과 비슷하다는 내용이에요. resemble = 닮다.","c":1},"h":"654a83546b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These gradually rise up to the surface until they burst out through vents.)","ko":"이것들은 분출구를 통해 터져 나올 때까지 점차 표면으로 상승한다.","opts":["갑자기","점차","거의 안","빠르게"],"word":"gradually","r":{"a":"2) 점차","ev":"4번 문장","s":[[4,"These gradually rise up to the surface until they burst out through vents.","이것들은 분출구를 통해 터져 나올 때까지 점차 표면으로 상승한다."]],"w":"4번은 가스와 녹은 암석이 터져 나오기 전까지 조금씩 표면으로 올라오는 모습이에요. gradually = 점차, 서서히.","c":2},"h":"d0ea3c21d4"},{"n":6,"t":"ref","q":"What does the underlined \"Each\" refer to?\nEach was created as a result of an underwater volcano eruption, and a new seamount named Loihi is in the process of being formed.","ko":"밑줄 친 Each가 가리키는 것은?","sko":"각각은 해저 화산 폭발의 결과로 생성되었으며, Loihi라는 이름의 새로운 해산이 형성되는 과정에 있다.","opts":["해산의 용암층들 하나하나","하와이 제도의 섬들 하나하나","육지 화산들 하나하나","분출구들 하나하나"],"r":{"a":"2) 하와이 제도의 섬들 하나하나","ev":"12~13번 문장","s":[[12,"One of the most famous examples of this process is the islands of Hawaii.","이 과정의 가장 유명한 예 중 하나는 하와이 제도이다."],[13,"Each was created as a result of an underwater volcano eruption, and a new seamount named Loihi is in the process of being formed.","각각은 해저 화산 폭발의 결과로 생성되었으며, Loihi라는 이름의 새로운 해산이 형성되는 과정에 있다."]],"w":"13번 Each는 바로 앞 12번의 the islands of Hawaii(하와이 제도), 그중 섬 하나하나를 가리켜요. 각각이 해저 화산 폭발의 결과로 생겼다는 뜻이에요.","c":2},"h":"1b4eb82113"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But an underwater eruption is generally much less violent than a land one.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 수중 분출은 일반적으로 육지의 분출보다 훨씬 덜 격렬하다.","opts":["수중 분출은 육지의 분출보다 훨씬 더 격렬하다.","수중 분출은 육지의 분출만큼 격렬하다.","수중 분출은 거의 일어나지 않는 일이다.","수중 분출은 대개 육지의 분출보다 훨씬 덜 격렬하다."],"r":{"a":"4) 수중 분출은 대개 육지의 분출보다 훨씬 덜 격렬하다.","ev":"5번 문장","s":[[5,"But an underwater eruption is generally much less violent than a land one.","하지만 수중 분출은 일반적으로 육지의 분출보다 훨씬 덜 격렬하다."]],"w":"much less violent는 훨씬 덜 격렬하다는 뜻이고 a land one은 육지의 분출(a land eruption)이에요. 수중 분출이 더 약하다는 문장이에요.","c":4},"h":"4185dc2fd4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대부분의 화산 폭발은 바다가 아니라 육지에서 일어난다.","수중 분출은 보통 육지의 분출보다 더 격렬하다.","해저 화산은 지구 깊은 곳에서 가스와 녹은 암석이 쌓여 생긴다.","해저 화산은 차가운 바닷물이 땅속으로 가라앉아 생긴다."],"opts":["Most volcanic eruptions take place on land, not in the ocean.","Underwater eruptions are usually more violent than land ones.","Underwater volcanoes form when gases and molten rock build up deep in the earth.","Underwater volcanoes are caused by cold seawater sinking into the ground."],"r":{"a":"3) Underwater volcanoes form when gases and molten rock build up deep in the earth.","ev":"3번 문장","s":[[3,"Much like their counterparts on land, underwater volcanoes result from the accumulation of gases and molten rock deep in the earth.","육지의 대응물(화산)과 매우 비슷하게, 해저 화산은 지구 깊은 곳의 가스와 녹은 암석의 축적으로부터 발생한다."]],"w":"3번 문장에서 해저 화산은 지구 깊은 곳의 가스와 녹은 암석의 축적으로 생긴다고 해요. 대부분의 폭발은 바다에서 일어나고(2번), 수중 분출은 덜 격렬하며(5번), 차가운 바닷물이 원인이라는 말은 없어요.","c":3},"h":"39767fd97a"},{"n":9,"t":"sum","q":"A seamount grows as new (A) of lava build up on the old ones, and that section of the (B) gradually rises.","ko":"새로운 용암 (A)이(가) 이전 층 위에 쌓이면서, (B)의 그 부분은 점차 상승한다.","oko":["(A) 층 / (B) 하늘","(A) 구멍 / (B) 해저","(A) 구멍 / (B) 하늘","(A) 층 / (B) 숲","(A) 층 / (B) 해저"],"opts":["(A) layers / (B) sky","(A) holes / (B) seafloor","(A) holes / (B) sky","(A) layers / (B) forest","(A) layers / (B) seafloor"],"r":{"a":"5) (A) layers / (B) seafloor (층 / 해저)","ev":"10번 문장","s":[[10,"As each new layer of lava hardens on top of the previous one, that section of the seafloor gradually rises.","새로운 용암층이 이전 층 위에서 굳어감에 따라, 해저의 그 부분은 점차 상승한다."]],"w":"10번 문장 As each new layer of lava hardens on top of the previous one, that section of the seafloor gradually rises에서 가져왔어요. 용암이 새로 쌓이는 한 겹 한 겹은 layer(층)이고, 점차 올라오는 곳은 seafloor(해저)예요. 구멍, 하늘, 숲은 본문에 맞지 않아요.","c":5},"h":"015d637865"},{"n":10,"t":"fill","q":"When you think of a volcano, you probably [A] a towering mountain spewing dense clouds of smoke and [B] up into the sky.","ko":"당신이 화산을 생각할 때, 당신은 아마도 연기와 [B]의 짙은 구름을 하늘로 뿜어내는 우뚝 솟은 산을 [A].","bank":["envision","ash","surprisingly","gradually","evenly","generally"],"bko":{"envision":"상상하다","ash":"재","surprisingly":"놀랍게도","gradually":"점차","evenly":"고르게","generally":"일반적으로"},"r":{"a":"[A] envision (상상하다), [B] ash (재)","ev":"1번 문장","s":[[1,"When you think of a volcano, you probably envision a towering mountain spewing dense clouds of smoke and ash up into the sky.","당신이 화산을 생각할 때, 당신은 아마도 연기와 재의 짙은 구름을 하늘로 뿜어내는 우뚝 솟은 산을 상상할 것이다."]],"w":"1번 문장 When you think of a volcano, you probably envision a towering mountain spewing dense clouds of smoke and ash up into the sky에서 가져왔어요. 동사 자리에는 envision(상상하다)이, smoke and 뒤 명사 자리에는 ash(재)가 와요. 나머지는 부사라서 이 자리에 올 수 없어요.","c":null},"h":"82167debca"}]},{"u":2,"id":"ms2-02-4","no":4,"ko":"No Rules, No School, No Problem","items":[{"n":1,"t":"tf","q":"By rejecting mainstream conventions, naïve art creators can focus on expressing their feelings.","ko":"주류의 관습을 거부함으로써 나이브 아트의 창작자들은 자신의 감정을 표현하는 데 집중할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"By rejecting the conventions of mainstream art, creators of naïve art are able to focus on expressing their feelings.","주류 예술의 관습을 거부함으로써, 나이브 아트의 창작자들은 그들의 감정을 표현하는 데 집중할 수 있다."]],"w":"8번 문장에 By rejecting the conventions of mainstream art, creators of naïve art are able to focus on expressing their feelings라고 나와요.","c":"T"},"h":"77a1fbc601"},{"n":2,"t":"tf","q":"Henri Rousseau worked as a customs officer for less than ten years.","ko":"앙리 루소는 10년이 채 안 되는 기간 동안 세관원으로 일했다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Although he worked as a customs officer for over 20 years, he held the dream of painting throughout his career.","그가 20년 이상 세관원으로 일했지만, 그는 그의 경력 내내 그림을 그리는 꿈을 가지고 있었다."]],"w":"10번 문장에서 루소는 20년 이상(for over 20 years) 세관원으로 일했다고 해요. 10년 미만이라는 말은 틀려요.","c":"F"},"h":"3dd5637d9c"},{"n":3,"t":"tf","q":"Naïve art features bright and vibrant colors.","ko":"나이브 아트는 밝고 생생한 색상을 특징으로 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They feature bright, vibrant colors and do not follow traditional rules of perspective.","그것들은 밝고, 생생한 색상을 특징으로 하며 전통적인 원근법의 규칙을 따르지 않는다."]],"w":"6번 문장에 They feature bright, vibrant colors라고 나와요. They는 5번의 naïve art 작품들이에요.","c":"T"},"h":"a02372793c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In fact, many celebrated paintings have been created by people who never followed the conventional path!)","ko":"사실, 많은 유명한 그림들은 전통적인 경로를 따르지 않은 사람들에 의해 만들어졌다!","opts":["무명의","유명한","값싼","훼손된"],"word":"celebrated","r":{"a":"2) 유명한","ev":"4번 문장","s":[[4,"In fact, many celebrated paintings have been created by people who never followed the conventional path!","사실, 많은 유명한 그림들은 전통적인 경로를 따르지 않은 사람들에 의해 만들어졌다!"]],"w":"4번은 미술 학교라는 정석을 따르지 않은 사람들이 만든 그림 가운데 이름난 작품이 많다는 내용이에요. celebrated = 유명한, 칭송받는.","c":2},"h":"e696cc8b56"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most notably, objects in the foreground and background are often the same size and depicted with the same level of detail.)","ko":"가장 두드러지게, 전경과 배경에 있는 물체들은 종종 같은 크기이고 같은 수준의 세부 묘사로 나타나 있다.","opts":["숨겨진","지워진","묘사된","팔린"],"word":"depicted","r":{"a":"3) 묘사된","ev":"7번 문장","s":[[7,"Most notably, objects in the foreground and background are often the same size and depicted with the same level of detail.","가장 두드러지게, 전경과 배경에 있는 물체들은 종종 같은 크기이고 같은 수준의 세부 묘사로 나타나 있다."]],"w":"7번은 그림 속 전경과 배경의 물체가 어떻게 그려졌는지 말해요. be depicted = 묘사되다, 그려지다.","c":3},"h":"0d8f8c4892"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey prove that creativity can make up for a lack of training when it comes to creating great works of art.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 훌륭한 예술 작품을 만들 때 창의성이 훈련 부족을 보완할 수 있다는 것을 증명한다.","opts":["루브르 박물관의 작품들","미술 학교의 선생님들","세관원들","루소 같은 나이브 아트의 창작자들"],"r":{"a":"4) 루소 같은 나이브 아트의 창작자들","ev":"12~13번 문장","s":[[12,"Today, creators of naïve art like Rousseau are widely praised for their intuitive form of expression.","오늘날, 루소와 같은 나이브 아트의 창작자들은 그들의 직관적인 표현 형식으로 널리 칭송받고 있다."],[13,"They prove that creativity can make up for a lack of training when it comes to creating great works of art.","그들은 훌륭한 예술 작품을 만들 때 창의성이 훈련 부족을 보완할 수 있다는 것을 증명한다."]],"w":"13번 They는 바로 앞 12번의 creators of naïve art like Rousseau(루소 같은 나이브 아트의 창작자들)예요. 이들이 훈련 부족을 창의성으로 보완할 수 있음을 증명해요.","c":4},"h":"d975d23ab6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Collectively referred to as naïve art, these works are known for their childlike simplicity.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"총괄하여 나이브 아트(naïve art)로 일컬어지는 이런 작품들은 그것들의 천진난만한 단순함으로 알려져 있다.","opts":["이런 작품들을 통틀어 나이브 아트라고 부르며, 아이 같은 단순함으로 알려져 있다.","나이브 아트는 어린아이들이 만든 작품만을 가리킨다.","나이브 아트는 복잡하고 정교한 기법으로 유명하다.","나이브 아트는 미술 학교를 졸업한 사람들의 작품을 가리킨다."],"r":{"a":"1) 이런 작품들을 통틀어 나이브 아트라고 부르며, 아이 같은 단순함으로 알려져 있다.","ev":"5번 문장","s":[[5,"Collectively referred to as naïve art, these works are known for their childlike simplicity.","총괄하여 나이브 아트(naïve art)로 일컬어지는 이런 작품들은 그것들의 천진난만한 단순함으로 알려져 있다."]],"w":"collectively referred to as는 '통틀어 ~라고 불리는', known for는 '~으로 유명한', childlike simplicity는 아이 같은 단순함이에요. 어린아이가 만든 작품이라는 뜻은 아니에요.","c":1},"h":"aa5763278f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["나이브 아트는 전통적인 원근법의 규칙을 따른다.","루소는 20년이 넘도록 미술 학교에서 공부했다.","앙리 루소는 나이브 아트 사조의 가장 대표적인 인물로 꼽힌다.","루소는 세관원이 되면서 그림을 그만두었다."],"opts":["Naïve art follows the traditional rules of perspective.","Rousseau studied at an art school for more than twenty years.","Henri Rousseau is considered a representative figure of the naïve art movement.","Rousseau gave up painting when he became a customs officer."],"r":{"a":"3) Henri Rousseau is considered a representative figure of the naïve art movement.","ev":"9번 문장","s":[[9,"Perhaps the most representative figure of the naïve art movement was the 19th-century French artist Henri Rousseau.","아마도 나이브 아트 사조의 가장 대표적인 인물은 19세기 프랑스 예술가 앙리 루소였을 것이다."]],"w":"9번 문장에서 루소는 나이브 아트 사조의 가장 대표적인 인물이라고 해요. 나이브 아트는 전통 원근법을 따르지 않고(6번), 루소는 독학했으며(11번), 세관원으로 일하면서도 꿈을 품었어요(10번).","c":3},"h":"391d545e8b"},{"n":9,"t":"sum","q":"Today, naïve artists like Rousseau are widely (A) for their (B) form of expression.","ko":"오늘날 루소 같은 나이브 아트 창작자들은 그들의 (B) 표현 형식으로 널리 (A)받는다.","oko":["(A) 무시 / (B) 직관적인","(A) 칭송 / (B) 비싼","(A) 무시 / (B) 전통적인","(A) 비난 / (B) 비싼","(A) 칭송 / (B) 직관적인"],"opts":["(A) ignored / (B) intuitive","(A) praised / (B) expensive","(A) ignored / (B) traditional","(A) criticized / (B) expensive","(A) praised / (B) intuitive"],"r":{"a":"5) (A) praised / (B) intuitive (칭송 / 직관적인)","ev":"12번 문장","s":[[12,"Today, creators of naïve art like Rousseau are widely praised for their intuitive form of expression.","오늘날, 루소와 같은 나이브 아트의 창작자들은 그들의 직관적인 표현 형식으로 널리 칭송받고 있다."]],"w":"12번 문장 Today, creators of naïve art like Rousseau are widely praised for their intuitive form of expression에서 가져왔어요. 오늘날 널리 칭송받는다(praised)고 했으니 무시나 비난은 틀리고, 표현 형식은 직관적인(intuitive)이에요.","c":5},"h":"4e1aea8bd9"},{"n":10,"t":"fill","q":"Rousseau [A] himself how to paint, including by [B] diverse pieces displayed in the Louvre Museum.","ko":"루소는 루브르 박물관에 전시된 다양한 작품들을 [B] 것을 포함하여, 그림 그리는 법을 스스로 [A].","bank":["taught","copying","rejected","followed","depicted","created"],"bko":{"taught":"가르쳤다(독학했다)","copying":"모방하는","rejected":"거부했다","followed":"따랐다","depicted":"묘사했다","created":"만들었다"},"r":{"a":"[A] taught, [B] copying","ev":"11번 문장","s":[[11,"He taught himself how to paint in imaginative ways, including by copying diverse pieces displayed in the Louvre Museum.","그는 상상력이 풍부한 방식으로 그림 그리는 법을 독학했는데, 루브르 박물관에 전시된 다양한 작품들을 모방하는 것을 포함했다."]],"w":"11번 문장에 He taught himself how to paint ~, including by copying diverse pieces displayed in the Louvre Museum이라고 나와요. taught himself는 독학했다는 뜻이고, by 뒤에는 -ing형 copying이 와요.","c":null},"h":"44c7f62cc4"}]},{"u":3,"id":"ms2-03-1","no":1,"ko":"‘비행(Flight)’이 ‘비행(Misdeed)’인 시대","items":[{"n":1,"t":"tf","q":"Flygskam is a Swedish word that means “flight shame.”","ko":"‘플리그스캄’은 “비행 부끄러움”을 의미하는 스웨덴어이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"One such form of criticism is flygskam, which means “flight shame” in Swedish.","그러한 형식의 비판 중 하나가 ‘플리그스캄’인데, 이는 스웨덴어로 “비행 부끄러움”을 의미한다."]],"w":"3번 문장에서 flygskam은 스웨덴어로 'flight shame(비행 부끄러움)'을 의미한다고 해요.","c":"T"},"h":"0e2a05eac3"},{"n":2,"t":"tf","q":"Activists like Greta Thunberg are keeping the flight shame movement inside Sweden.","ko":"그레타 툰베리와 같은 활동가들은 비행 부끄러움 운동이 스웨덴 안에만 머물게 하고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Activists like Greta Thunberg are helping to spread this movement beyond Sweden.","그레타 툰베리와 같은 활동가들이 이 운동을 스웨덴 너머로 확산시키는 것을 돕고 있다."]],"w":"7번 문장에서 활동가들은 이 운동을 스웨덴 너머로(beyond Sweden) 확산시키는 것을 돕고 있어요. 스웨덴 안에만 머물게 한다는 말은 반대예요.","c":"F"},"h":"8af54854e8"},{"n":3,"t":"tf","q":"The flight shame movement has already raised public awareness.","ko":"비행 부끄러움 운동은 이미 대중의 인식을 높였다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"The movement has already raised public awareness and will hopefully continue to accelerate effective responses to the ecological crisis.","이 운동은 이미 대중의 인식을 높였고, 생태 위기에 대한 효과적인 대응을 계속하여 가속화하기를 희망한다."]],"w":"10번 문장에서 이 운동은 이미 대중의 인식을 높였다(has already raised public awareness)고 해요.","c":"T"},"h":"9799e5a737"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…individual actions alone cannot halt global warming…)","ko":"…개인적인 행동만으로는 지구 온난화를 멈출 수 없다…","opts":["늘리다","시작하다","멈추다","측정하다"],"word":"halt","r":{"a":"3) 멈추다","ev":"9번 문장","s":[[9,"While critics note that individual actions alone cannot halt global warming, flygskam demonstrates how personal choices, when adopted widely, create measurable industry changes.","비평가들이 개인적인 행동만으로는 지구 온난화를 멈출 수 없다고 지적하는 반면, ‘플리그스캄’은 개인적인 선택들이 널리 채택될 때, 어떻게 측정 가능한 산업의 변화를 만들어 내는지를 보여준다."]],"w":"9번에서 비평가들은 개인의 행동만으로는 지구 온난화를 '멈출' 수 없다고 말해요. halt = 멈추다.","c":3},"h":"f839cb25d8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the number of passengers at domestic airports has dropped by 15 percent.)","ko":"…국내 공항의 승객 수는 15퍼센트 감소했다.","opts":["해외의","국내의","거대한","낡은"],"word":"domestic","r":{"a":"2) 국내의","ev":"6번 문장","s":[[6,"So far, thanks to the flight shame movement, almost 40 percent of Swedes now say they choose to take trains instead of flights when possible, and the number of passengers at domestic airports has dropped by 15 percent.","지금까지, 비행 부끄러움 운동 덕분에, 스웨덴 사람들의 거의 40퍼센트가 가능할 때는 비행기 대신 이제 기차를 타는 것을 선택한다고 말하고, 국내 공항의 승객 수는 15퍼센트 감소했다."]],"w":"6번은 스웨덴 사람들이 기차를 타면서 국내 공항의 승객 수가 줄었다는 내용이에요. domestic = 국내의. 1번의 overseas(해외의)와 반대 뜻이에요.","c":2},"h":"dbb1ffda2c"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nA UN study warns that the aviation industry will become one of the largest emitters of CO2 by 2050 unless concrete steps are taken to prevent this.","ko":"밑줄 친 this가 가리키는 것은?","sko":"한 유엔(UN) 연구는 이를 막기 위한 구체적인 조치가 취해지지 않는다면 항공 산업이 2050년까지 이산화탄소(CO2)의 가장 큰 배출원 중 하나가 될 것이라고 경고한다.","opts":["항공 산업이 가장 큰 이산화탄소 배출원 중 하나가 되는 것","구체적인 조치들이 취해지는 것","2050년이 되는 것","유엔이 연구를 하는 것"],"r":{"a":"1) 항공 산업이 가장 큰 이산화탄소 배출원 중 하나가 되는 것","ev":"5번 문장","s":[[5,"A UN study warns that the aviation industry will become one of the largest emitters of CO2 by 2050 unless concrete steps are taken to prevent this.","한 유엔(UN) 연구는 이를 막기 위한 구체적인 조치가 취해지지 않는다면 항공 산업이 2050년까지 이산화탄소(CO2)의 가장 큰 배출원 중 하나가 될 것이라고 경고한다."]],"w":"unless 절의 this는 막아야 할 대상이에요. 구체적인 조치를 취해서 막으려는 것은 바로 '항공 산업이 2050년까지 가장 큰 이산화탄소 배출원 중 하나가 되는 것'이에요.","c":1},"h":"596832e28a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"At the same time, however, a growing number of voices are pushing back against frequent flying.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 동시에, 점점 더 많은 목소리가 잦은 비행에 반대하고 있다.","opts":["항공 여행이 흔해져서 비행에 대한 불만이 점점 줄어들고 있다.","비행기를 더 자주 타자고 요구하는 사람이 점점 늘고 있다.","비행에 반대하던 목소리가 점차 사라지고 있다.","잦은 비행을 반대하는 목소리가 점점 늘고 있다."],"r":{"a":"4) 잦은 비행을 반대하는 목소리가 점점 늘고 있다.","ev":"2번 문장","s":[[2,"At the same time, however, a growing number of voices are pushing back against frequent flying.","그러나 동시에, 점점 더 많은 목소리가 잦은 비행에 반대하고 있다."]],"w":"push back against는 '~에 반대하다'예요. 1번이 항공 여행이 흔해졌다는 내용이었는데 however로 바뀌어, 잦은 비행에 반대하는 목소리가 점점 늘어난다는 뜻이 돼요.","c":4},"h":"89e8e3eead"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그레타 툰베리는 기후 회의에서 연설하기 위해 영국에서 뉴욕까지 비행기를 타고 갔다.","그레타 툰베리는 2018년에 배로 뉴욕에 가서 비행 부끄러움 운동을 시작했다.","그레타 툰베리는 2019년에 기후 회의에 가려고 영국에서 뉴욕까지 배로 이동했다.","그레타 툰베리는 배 위에서 사람들에게 비행을 멈추라고 연설했다."],"opts":["Greta Thunberg flew from the United Kingdom to New York to speak at a climate conference.","Greta Thunberg went to New York by boat in 2018 to start the flight shame movement.","In 2019, Greta Thunberg traveled by boat from the United Kingdom to New York to attend a climate conference.","Greta Thunberg gave a speech on a boat to tell people to stop flying."],"r":{"a":"3) In 2019, Greta Thunberg traveled by boat from the United Kingdom to New York to attend a climate conference.","ev":"8번 문장","s":[[8,"In 2019, she brought attention to the environmental harm of flying when she traveled by boat from the United Kingdom to New York to speak at a climate conference.","2019년에, 그녀는 기후 회의에서 연설하기 위해 영국에서 뉴욕까지 배로 이동했을 때 비행의 환경적 해로움에 대한 관심을 불러일으켰다."]],"w":"8번에서 그레타는 2019년에 기후 회의에서 연설하기 위해 영국에서 뉴욕까지 배로 이동했어요. 비행기를 탄 것도, 2018년도, 운동을 시작하려고 간 것도, 배 위의 연설도 본문과 달라요.","c":3},"h":"a0977a8082"},{"n":9,"t":"sum","q":"Air travel has become a (A) part of modern life, whether it is for a business trip or an overseas (B).","ko":"항공 여행은 출장이든 해외 (B)이든 현대 생활의 (A) 부분이 되었다.","oko":["(A) 드문 / (B) 휴가","(A) 흔한 / (B) 날씨","(A) 드문 / (B) 날씨","(A) 위험한 / (B) 휴가","(A) 흔한 / (B) 휴가"],"opts":["(A) rare / (B) vacation","(A) common / (B) weather","(A) rare / (B) weather","(A) dangerous / (B) vacation","(A) common / (B) vacation"],"r":{"a":"5) (A) common / (B) vacation (흔한 / 휴가)","ev":"1번 문장","s":[[1,"Whether it’s for a business trip or an overseas vacation, air travel has become a common feature of modern life.","그것이 출장이든 해외 휴가이든, 항공 여행은 현대 생활의 흔한 부분이 되었다."]],"w":"1번 문장 Whether it’s for a business trip or an overseas vacation, air travel has become a common feature of modern life에서 가져왔어요. 출장(business trip)과 짝을 이루는 말은 해외 휴가(overseas vacation)이고, 현대 생활의 흔한(common) 부분이 되었다고 해요.","c":5},"h":"dc6c738239"},{"n":10,"t":"fill","q":"The movement originated in 2018, when Swedish climate activists [A] they would no longer fly unless necessary due to concerns about the harmful effects of rising [B] from airplanes.","ko":"이 운동은 2018년에 시작되었는데, 그때 스웨덴의 기후 활동가들은 비행기에서 나오는 증가하는 [B]의 해로운 영향에 대한 우려 때문에 필요한 경우가 아니면 더 이상 비행기를 타지 않겠다고 [A].","bank":["declared","emissions","frequent","domestic","concrete","measurable"],"bko":{"declared":"선언했다","emissions":"배출량","frequent":"잦은","domestic":"국내의","concrete":"구체적인","measurable":"측정 가능한"},"r":{"a":"[A] declared (선언했다), [B] emissions (배출량)","ev":"4번 문장","s":[[4,"The movement originated in 2018, when Swedish climate activists declared they would no longer fly unless necessary due to concerns about the harmful effects of rising emissions from airplanes.","이 운동은 2018년에 시작되었는데, 그때 스웨덴의 기후 활동가들이 비행기에서 나오는 배출량 증가의 해로운 영향에 대한 우려 때문에 필요한 경우가 아니면 더 이상 비행기를 타지 않겠다고 선언했다."]],"w":"4번 문장 The movement originated in 2018, when Swedish climate activists declared they would no longer fly unless necessary due to concerns about the harmful effects of rising emissions from airplanes에서 가져왔어요. activists 뒤에는 동사 declared(선언했다)가, rising 뒤에는 명사 emissions(배출량)가 와요. 나머지는 형용사라서 이 자리에 올 수 없어요.","c":null},"h":"d70985e5d8"}]},{"u":3,"id":"ms2-03-2","no":2,"ko":"책 읽다가 국경을 넘었다","items":[{"n":1,"t":"tf","q":"Stanstead is a Canadian town that has existed since 1796.","ko":"스탠스테드는 1796년부터 존재해 온 캐나다 마을이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"There, it joins with the Canadian town of Stanstead, which has existed since 1796.","그곳에서, 그것은 1796년부터 존재해 온 캐나다 마을인 스탠스테드와 맞닿게 된다."]],"w":"4번 문장에서 스탠스테드는 1796년부터 존재해 온 캐나다 마을(the Canadian town of Stanstead, which has existed since 1796)이라고 해요.","c":"T"},"h":"51bc0b9ff9"},{"n":2,"t":"tf","q":"Streets in Derby Line always connect different parts of one city.","ko":"더비 라인의 거리들은 언제나 한 도시의 다양한 구역을 이어 준다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Streets usually connect different parts of a city, but this is not always the case in an American town called Derby Line.","거리들은 보통 도시의 다양한 구역을 이어주지만, 더비 라인이라 불리는 한 미국 마을에서는 이것이 항상 그런 것은 아니다."]],"w":"1번에서 거리는 보통 도시의 여러 구역을 이어 주지만, 더비 라인에서는 항상 그런 것은 아니라고(not always the case) 해요.","c":"F"},"h":"87920b5c77"},{"n":3,"t":"tf","q":"Visitors can enter the Haskell Free Library and Opera House from either country.","ko":"방문객들은 어느 나라에서든 해스켈 무료 도서관 겸 오페라 하우스로 들어갈 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"There is an entrance from each country, and visitors can move around freely within.","각 국가로부터의 입구가 있고, 방문객들은 내부에서 자유롭게 돌아다닐 수 있다."]],"w":"9번에서 각 국가로부터의 입구가 있다(There is an entrance from each country)고 해요. 두 나라 모두에서 들어갈 수 있어요.","c":"T"},"h":"d67f9cf9ad"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…this has no longer been possible due to the implementation of stricter border controls.)","ko":"…더 엄격한 국경 통제의 시행으로 인해 이것은 더 이상 가능하지 않게 되었다.","opts":["시행","폐지","비용","보도"],"word":"implementation","r":{"a":"1) 시행","ev":"6번 문장","s":[[6,"But since the terrorist attacks of 9/11, this has no longer been possible due to the implementation of stricter border controls.","그러나 9.11 테러 공격 이후, 더 엄격한 국경 통제의 시행으로 인해 이것은 더 이상 가능하지 않게 되었다."]],"w":"6번은 9.11 이후 더 엄격한 국경 통제를 실제로 시작했기 때문에 왕래가 불가능해졌다는 내용이에요. implementation = 시행, 실행.","c":1},"h":"1c39578ce3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A person crossing anywhere other than at an official checkpoint is detected by cameras…)","ko":"공식 검문소 이외의 어떤 곳이든 건너는 사람은 카메라에 의해 감지되어…","opts":["숨겨지다","허락되다","감지되다","치료되다"],"word":"detected","r":{"a":"3) 감지되다","ev":"7번 문장","s":[[7,"A person crossing anywhere other than at an official checkpoint is detected by cameras, triggering a response by border guards.","공식 검문소 이외의 어떤 곳이든 건너는 사람은 카메라에 의해 감지되어, 국경 경비원들의 대응을 촉발한다."]],"w":"7번에서 공식 검문소가 아닌 곳을 건너는 사람은 카메라에 '감지되고', 그래서 경비원이 대응해요. detect = 감지하다, detected = 감지되는.","c":3},"h":"7af1e889f9"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nFortunately, residents of both towns can still interact freely in the Haskell Free Library and Opera House, which was intentionally constructed on the border in 1904.","ko":"밑줄 친 which가 가리키는 것은?","sko":"다행히도, 두 마을의 주민들은 여전히 해스켈 무료 도서관 겸 오페라 하우스에서 자유롭게 교류할 수 있는데, 그것은 1904년에 의도적으로 국경 위에 건설되었다.","opts":["두 마을의 주민들","해스켈 무료 도서관 겸 오페라 하우스","1904년","국경 통제"],"r":{"a":"2) 해스켈 무료 도서관 겸 오페라 하우스","ev":"8번 문장","s":[[8,"Fortunately, residents of both towns can still interact freely in the Haskell Free Library and Opera House, which was intentionally constructed on the border in 1904.","다행히도, 두 마을의 주민들은 여전히 해스켈 무료 도서관 겸 오페라 하우스에서 자유롭게 교류할 수 있는데, 그것은 1904년에 의도적으로 국경 위에 건설되었다."]],"w":"which 뒤의 was intentionally constructed on the border(국경 위에 일부러 지어졌다)의 주어는 쉼표 앞의 the Haskell Free Library and Opera House예요. 주민들이 지어진 것은 아니에요.","c":2},"h":"39f82ae069"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A line on the floor of the library area even marks the border, so a visitor can read a book in two countries at once!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"도서관 구역 바닥에 있는 선은 심지어 국경을 표시하므로, 방문객은 동시에 두 나라에서 책을 읽을 수 있다!","opts":["도서관의 선은 책을 읽는 구역과 쉬는 구역을 나눈다.","방문객이 바닥의 선을 넘으려면 허락을 받아야 한다.","바닥의 선 때문에 방문객은 한 나라에서만 책을 읽을 수 있다.","바닥의 선이 국경이라서, 방문객은 한 자리에서 두 나라에 걸쳐 책을 읽을 수 있다."],"r":{"a":"4) 바닥의 선이 국경이라서, 방문객은 한 자리에서 두 나라에 걸쳐 책을 읽을 수 있다.","ev":"10번 문장","s":[[10,"A line on the floor of the library area even marks the border, so a visitor can read a book in two countries at once!","도서관 구역 바닥에 있는 선은 심지어 국경을 표시하므로, 방문객은 동시에 두 나라에서 책을 읽을 수 있다!"]],"w":"바닥의 선이 국경을 표시하고(marks the border), 그래서(so) 방문객이 동시에 두 나라에서(in two countries at once) 책을 읽을 수 있다는 뜻이에요.","c":4},"h":"3e4d9d38b4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["더비 라인 주민들은 길을 걸을 때마다 여권을 보여 주어야 한다.","더비 라인은 미국과 맞닿아 있는 캐나다의 마을이다.","더비 라인 주민들은 잘못된 길로 들어서면 갑자기 캐나다에 있게 될 수 있다.","캐나다 주민들은 길을 잘못 들면 갑자기 더비 라인에 있게 된다."],"opts":["Residents of Derby Line must show a passport every time they take a walk.","Derby Line is a town in Canada that borders the United States.","Residents of Derby Line may suddenly find themselves in Canada if they take the wrong street.","Residents of Canada always find themselves in Derby Line by mistake."],"r":{"a":"3) Residents of Derby Line may suddenly find themselves in Canada if they take the wrong street.","ev":"2번 문장","s":[[2,"Residents of this town need to be careful because if they take the wrong street, they may suddenly find themselves in Canada!","이 마을의 주민들은 조심해야 하는데, 만약 그들이 잘못된 길로 들어서면, 그들은 갑자기 그들이 캐나다에 있다는 것을 알게 될 것이다!"]],"w":"2번에서 더비 라인 주민들이 잘못된 길로 들어서면 갑자기 캐나다에 있게 될 수 있다고 해요. 여권 이야기는 본문에 없고, 더비 라인은 3번에서 미국 버몬트주의 마을이에요.","c":3},"h":"7cc18fb122"},{"n":9,"t":"sum","q":"Derby Line, (A) in 1791, is (B) in northern Vermont, right at the border between Canada and the United States.","ko":"더비 라인은 1791년에 (A)되었고, 캐나다와 미국 사이의 국경 바로 옆 버몬트주 북부에 (B) 있다.","oko":["(A) 설립 / (B) 숨겨져","(A) 폐쇄 / (B) 위치해","(A) 폐쇄 / (B) 숨겨져","(A) 설립 / (B) 갇혀","(A) 설립 / (B) 위치해"],"opts":["(A) founded / (B) hidden","(A) closed / (B) situated","(A) closed / (B) hidden","(A) founded / (B) trapped","(A) founded / (B) situated"],"r":{"a":"5) (A) founded / (B) situated (설립 / 위치해)","ev":"3번 문장","s":[[3,"Founded in 1791, Derby Line is situated in northern Vermont right at the border between Canada and the United States.","1791년에 설립된 더비 라인은 캐나다와 미국 사이의 국경에 바로 인접해 있는 버몬트주 북부에 위치해 있다."]],"w":"3번 문장 Founded in 1791, Derby Line is situated in norther
