m은 단수라 symbolizes 사용", "topic": "주어와 동사의 수일치", "memo": "동명사구 주어 Burning them은 단수라 symbolizes 사용"}]}, {"n": 5, "tag": "스웨덴 · 한여름 축제", "en": "Winter in Sweden is long and dark, so the people there especially welcome summer. Celebrate the longest day of the year, they have a special festival.", "ko": "스웨덴의 겨울은 길고 어두워서 그곳 사람들은 여름을 특히 환영한다. 일 년 중 낮이 가장 긴 날을 기념하기 위해 그들은 특별한 축제를 연다.", "ok": false, "foot": [], "fixes": [{"wrong": "Celebrate", "right": "To celebrate", "partial": false, "at": [14], "point": "to부정사의 부사적 용법: '기념하기 위해'라는 목적은 To celebrate 사용", "topic": "to부정사의 부사적 용법", "memo": "'기념하기 위해'라는 목적은 To celebrate 사용"}]}, {"n": 6, "tag": null, "en": "They call it the Midsummer festival. The festival start on the Friday evening between June 19 and 25 and ends on the Sunday.", "ko": "이 축제를 한여름 축제라고 부른다. 축제는 6월 19일과 25일 사이의 금요일 저녁에 시작하여 일요일에 끝난다.", "ok": false, "foot": [], "fixes": [{"wrong": "start", "right": "starts", "partial": false, "at": [8], "point": "주어와 동사의 수일치: 주어 The festival은 단수이고 ends와 병렬이라 starts", "topic": "주어와 동사의 수일치", "memo": "주어 The festival은 단수이고 ends와 병렬이라 starts"}]}, {"n": 7, "tag": null, "en": "During the festival, people decorate a tall pole with flowers and green leaves and enjoy traditional dances around it.", "ko": "축제 기간 동안 사람들은 꽃과 초록색 잎으로 장대를 장식하고 그 주위를 돌며 전통 춤을 즐긴다.", "ok": true, "foot": [], "fixes": []}, {"n": 8, "tag": null, "en": "Because the sun hard sets at this time of year in Sweden, people can enjoying the festival all night long.", "ko": "스웨덴에서 매년 이맘때면 해가 거의 지지 않기 때문에 사람들은 밤새도록 축제를 즐길 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "enjoying", "right": "enjoy", "partial": false, "at": [14], "point": "조동사 + 동사원형: 조동사 can 뒤에는 동사원형 enjoy 사용", "topic": "조동사 + 동사원형", "memo": "조동사 can 뒤에는 동사원형 enjoy 사용"}, {"wrong": "hard", "right": "hardly", "partial": false, "at": [3], "point": "부사: '거의 ~않다'는 부사 hardly 사용", "topic": "부사", "memo": "'거의 ~않다'는 부사 hardly 사용"}]}, {"n": 9, "tag": "멕시코 · 망자의 날", "en": "Many Mexicans believe that once a year dead people comes back home to meet their family and friends. They call this day the Day of the Dead.", "ko": "많은 멕시코 사람들은 일 년에 한 번 죽은 사람들이 가족과 친구들을 만나기 위해 집으로 돌아온다고 믿는다. 이날을 망자의 날이라고 부른다.", "ok": false, "foot": [], "fixes": [{"wrong": "comes", "right": "come", "partial": false, "at": [9], "point": "주어와 동사의 수일치: 주어 dead people은 복수라 come 사용", "topic": "주어와 동사의 수일치", "memo": "주어 dead people은 복수라 come 사용"}]}, {"n": 10, "tag": null, "en": "To welcome dead people, Mexicans hold a festival on November 1 and 2. They believe it is important remembering dead people.", "ko": "죽은 이들을 맞이하기 위해, 멕시코 사람들은 11월 1일과 2일에 축제를 연다. 그들은 고인을 기억하는 것이 중요하다고 믿는다.", "ok": false, "foot": [], "fixes": [{"wrong": "remembering", "right": "to remember", "partial": false, "at": [18], "point": "가주어 it과 진주어 to부정사: it is important 뒤의 진주어는 to remember", "topic": "가주어 it과 진주어 to부정사", "memo": "it is important 뒤의 진주어는 to remember"}]}, {"n": 11, "tag": null, "en": "So, people set up altars in their homes and has big parties in cemeteries. In some areas, people dress up likes skeletons and hold big parades.", "ko": "그래서 사람들은 집에 제단을 차리고, 묘지에서 큰 파티를 연다. 일부 지역에서는 사람들이 해골처럼 분장하고 대규모 퍼레이드를 벌인다.", "ok": false, "foot": [], "fixes": [{"wrong": "has", "right": "have", "partial": false, "at": [9], "point": "병렬 구조와 수일치: set up과 병렬이며 주어 people이 복수라 have", "topic": "병렬 구조와 수일치", "memo": "set up과 병렬이며 주어 people이 복수라 have"}, {"wrong": "likes", "right": "like", "partial": false, "at": [20], "point": "전치사: '~처럼'을 뜻하는 전치사 like는 -s를 붙이지 않음", "topic": "전치사", "memo": "'~처럼'을 뜻하는 전치사 like는 -s를 붙이지 않음"}]}, {"n": 12, "tag": "미국 · 퍼 론디 축제", "en": "At the end of February, people in Alaska hold the Fur Rondy festival, one of the biggest winter festival in the world. During this festival, visitors can enjoy various winter sports and Alaskan traditional games.", "ko": "2월 말, 알래스카 사람들은 세계에서 가장 큰 겨울 축제 중 하나인 퍼 론디 축제를 연다. 이 축제 기간 동안 방문객들은 다양한 겨울 스포츠와 알래스카 전통 게임을 즐길 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "festival", "right": "festivals", "partial": false, "at": [18], "point": "one of + 복수명사: one of the biggest 뒤에는 복수명사 festivals", "topic": "one of + 복수명사", "memo": "one of the biggest 뒤에는 복수명사 festivals"}]}, {"n": 13, "tag": null, "en": "They can also enjoy many special events such as the Running of the Reindeer. People who participate in this race wear fun costumes and try running faster than reindeer.", "ko": "또한, 순록 경주 같은 많은 특별한 행사도 즐길 수 있다. 이 경주에 참가하는 사람들은 재미있는 복장을 입고 순록보다 더 빨리 달리려고 애쓴다.", "ok": false, "foot": [], "fixes": [{"wrong": "running", "right": "to run", "partial": false, "at": [25], "point": "try + to부정사: '~하려고 애쓰다'는 try to run", "topic": "try + to부정사", "memo": "'~하려고 애쓰다'는 try to run"}]}, {"n": 14, "tag": null, "en": "Is it possible to do so? Not really, but it doesn't matter. Everyone is just having fun!", "ko": "과연 그럴 수 있을까? 그럴 거 같지는 않지만, 그것은 중요하지 않다. 모두가 그저 즐기고 있을 뿐이다!", "ok": true, "foot": [], "fixes": []}];var PP=[["Fallas Festival in Valencia, Spain", "스페인 발렌시아의 파야스 축제", 1], ["People in Valencia celebrate the coming of spring with the Fallas festival.", "발렌시아 사람들은 파야스 축제로 봄의 시작을 축하한다.", 0], ["This festival takes place from March 15 to 19.", "이 축제는 3월 15일부터 19일까지 열린다.", 0], ["During the festival, people enjoy parades and fireworks.", "축제 기간 동안 사람들은 퍼레이드와 불꽃놀이를 즐긴다.", 0], ["The stars of the festival are fallas, giant wooden statues.", "축제의 주인공은 거대한 나무 조각상인 파야들이다.", 0], ["You can find hundreds of them all over the city.", "도시 곳곳에서 수백 개의 파야들을 볼 수 있다.", 0], ["Surprisingly, the fallas are burned on the last day of the festival.", "놀랍게도, 축제의 마지막 날에는 이 파야들이 불태워진다.", 0], ["Burning them symbolizes saying goodbye to old things and hello to a new start.", "그것들을 태우는 것은 오래된 것들과 작별하고 새로운 시작을 맞이하는 것을 상징한다.", 0], ["Midsummer Festival in Sweden", "스웨덴의 한여름 축제", 1], ["Winter in Sweden is long and dark, so the people there especially welcome summer.", "스웨덴의 겨울은 길고 어두워서 그곳 사람들은 여름을 특히 환영한다.", 0], ["To celebrate the longest day of the year, they have a special festival.", "일 년 중 낮이 가장 긴 날을 보다 더 빨리 달리려고 애쓴다.", 0], ["Is it possible to do so?", "과연 그럴 수 있을까?", 0], ["Not really, but it doesn't matter.", "그럴 거 같지는 않지만, 그것은 중요하지 않다.", 0], ["Everyone is just having fun!", "모두가 그저 즐기고 있을 뿐이다!", 0]];var RNUM=64;var TITLE_EN="Seasonal Festivals Around the World";var PASS_EN=["Seasonal Festivals Around the World", "Fallas Festival in Valencia, Spain", "People in Valencia celebrate the coming of spring with the Fallas festival. This festival takes place from March 15 to 19. During the festival, people enjoy parades and fireworks. The stars of the festival are fallas, giant wooden statues. You can find hundreds of them all over the city. Surprisingly, the fallas are burned on the last day of the festival. Burning them symbolizes saying goodbye to old things and hello to a new start.", "Midsummer Festival in Sweden", "Winter in Sweden is long and dark, so the people there especially welcome summer. To celebrate the longest day of the year, they have a special festival. They call it the Midsummer festival. The festival starts on the Friday evening between June 19 and 25 and ends on the Sunday. During the festival, people decorate a tall pole with flowers and green leaves and enjoy traditional dances around it. Because the sun hardly sets at this time of year in Sweden, people can enjoy the festival all night long.", "Day of the Dead Festival in Mexico", "Many Mexicans believe that once a year dead people come back home to meet their family and friends. They call this day the Day of the Dead. To welcome dead people, Mexicans hold a festival on November 1 and 2. They believe it is important to remember dead people. So, people set up altars in their homes and have big parties in cemeteries. In some areas, people dress up like skeletons and hold big parades.", "Fur Rondy Festival in Alaska, USA", "At the end of February, people in Alaska hold the Fur Rondy festival, one of the biggest winter festivals in the world. During this festival, visitors can enjoy various winter sports and Alaskan traditional games. They can also enjoy many special events such as the Running of the Reindeer. People who participate in this race wear fun costumes and try to run faster than reindeer. Is it possible to do so? Not really, but it doesn't matter. Everyone is just having fun!"];var PASS_KO=["전 세계의 계절 축제들", "스페인 발렌시아의 파야스 축제", "발렌시아 사람들은 파야스 축제로 봄의 시작을 축하한다. 이 축제는 3월 15일부터 19일까지 열린다. 축제 기간 동안 사람들은 퍼레이드와 불꽃놀이를 즐긴다. 축제의 주인공은 거대한 나무 조각상인 파야들이다. 도시 곳곳에서 수백 개의 파야들을 볼 수 있다. 놀랍게도, 축제의 마지막 날에는 이 파야들이 불태워진다. 그것들을 태우는 것은 오래된 것들과 작별하고 새로운 시작을 맞이하는 것을 상징한다.", "스웨덴의 한여름 축제", "스웨덴의 겨울은 길고 어두워서 그곳 사람들은 여름을 특히 환영한다. 일 년 중 낮이 가장 긴 날을 기념하기 위해 그들은 특별한 축제를 연다. 이 축제를 한여름 축제라고 부른다. 축제는 6월 19일과 25일 사이의 금요일 저녁에 시작하여 일요일에 끝난다. 축제 기간 동안 사람들은 꽃과 초록색 잎으로 장대를 장식하고 그 주위를 돌며 전통 춤을 즐긴다. 스웨덴에서 매년 이맘때면 해가 거의 지지 않기 때문에 사람들은 밤새도록 축제를 즐길 수 있다.", "멕시코의 망자의 날 축제", "많은 멕시코 사람들은 일 년에 한 번 죽은 사람들이 가족과 친구들을 만나기 위해 집으로 돌아온다고 믿는다. 이날을 망자의 날이라고 부른다. 죽은 이들을 맞이하기 위해, 멕시코 사람들은 11월 1일과 2일에 축제를 연다. 그들은 고인을 기억하는 것이 중요하다고 믿는다. 그래서 사람들은 집에 제단을 차리고, 묘지에서 큰 파티를 연다. 일부 지역에서는 사람들이 해골처럼 분장하고 대규모 퍼레이드를 벌인다.", "미국 알래스카의 퍼 론디 축제", "2월 말, 알래스카 사람들은 세계에서 가장 큰 겨울 축제 중 하나인 퍼 론디 축제를 연다. 이 축제 기간 동안 방문객들은 다양한 겨울 스포츠와 알래스카 전통 게임을 즐길 수 있다. 또한, 순록 경주 같은 많은 특별한 행사도 즐길 수 있다. 이 경주에 참가하는 사람들은 재미있는 복장을 입고 순록보다 더 빨리 달리려고 애쓴다. 과연 그럴 수 있을까? 그럴 거 같지는 않지만, 그것은 중요하지 않다. 모두가 그저 즐기고 있을 뿐이다!"];var BG=[{"qs": [{"n": 6, "q": "윗글의 제목으로 알맞은 것은?", "o": ["Various Festivals in Spain", "My Trip to Valencia, Spain", "Famous Wooden Statues in Spain", "The History of Fallas Festival in Valencia", "Celebrating Spring: Fallas Festival in Valencia"], "a": 4, "ans": "Celebrating Spring: Fallas Festival in Valencia", "ko": ["스페인의 다양한 축제들", "스페인 발렌시아로의 내 여행", "스페인의 유명한 나무 조각상들", "발렌시아 파야스 축제의 역사", "봄을 축하하며: 발렌시아의 파야스 축제"], "evs": [["People in Valencia celebrate the coming of spring with the Fallas festival.", "발렌시아 사람들은 파야스 축제로 봄의 시작을 축하한다."]], "ow": ["오답 ✕ — 스페인의 여러 축제가 아니라 발렌시아의 파야스 축제 하나만 다룬다.", "오답 ✕ — 'People in Valencia celebrate'(발렌시아 사람들은 ~ 축 function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}

 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];

   if(f.partial){tk[a]=tk[a].replace(f.wrong,'\u0001'+f.right+'\u0002');return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
