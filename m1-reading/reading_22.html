<style>

*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}

.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}

.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}

rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

var D=[{"n":1,"tag":null,"en":"Welcome to the lunch break radio show! This are DJ Eunho from the studio.","ko":"점심시간 라디오 프로그램에 오신 것을 환영합니다! 저는 방송실 DJ 은호입니다.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[8],"point":"be동사의 수일치: 단수 주어 This에는 is 사용","topic":"be동사의 수일치","memo":"단수 주어 This에는 is 사용"}]},{"n":2,"tag":null,"en":"The Thank You Note Event end yesterday. We got much notes.","ko":"감사 쪽지 행사가 어제 종료되었습니다. 저희는 많은 쪽지를 받았어요.","ok":false,"foot":[],"fixes":[{"wrong":"end","right":"ended","partial":false,"at":[5],"point":"과거시제: yesterday가 있으므로 과거형 ended 사용","topic":"과거시제","memo":"yesterday가 있으므로 과거형 ended 사용"},{"wrong":"much","right":"many","partial":false,"at":[9],"point":"수량 형용사 many/much: notes는 셀 수 있으므로 many 사용","topic":"수량 형용사 many/much","memo":"notes는 셀 수 있으므로 many 사용"}]},{"n":3,"tag":null,"en":"I will share some with you.","ko":"몇 개를 여러분들과 공유하겠습니다.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"The first note is from Dahyeon for she friend Lina.","ko":"첫 번째 쪽지는 다현이가 친구 리나에게 쓴 쪽지입니다.","ok":false,"foot":[],"fixes":[{"wrong":"she","right":"her","partial":false,"at":[7],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 her 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 her 사용"}]},{"n":5,"tag":null,"en":"\"Hi, Lina. You and me did the science project together.","ko":"\"안녕, 리나야. 너랑 나는 과학 프로젝트를 같이 했지.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"I","partial":false,"at":[4],"point":"인칭대명사의 주격: 주어 자리에는 주격 I 사용","topic":"인칭대명사의 주격","memo":"주어 자리에는 주격 I 사용"}]},{"n":6,"tag":null,"en":"It goed well, thanks to you. Your ideas and energy was a great help!\"","ko":"네 덕분에 잘 되었어. 너의 아이디어와 에너지가 큰 도움이 되었어!\"","ok":false,"foot":[],"fixes":[{"wrong":"goed","right":"went","partial":false,"at":[1],"point":"불규칙 과거형: go의 과거형은 went (goed 아님)","topic":"불규칙 과거형","memo":"go의 과거형은 went (goed 아님)"},{"wrong":"was","right":"were","partial":false,"at":[10],"point":"be동사의 수일치: 복수 주어 → were (was 아님)","topic":"be동사의 수일치","memo":"복수 주어 → were (was 아님)"}]},{"n":7,"tag":nu
