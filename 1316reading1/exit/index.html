<head>

<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"nl1-01-1","no":1,"ko":"비 냄새는 어디서 오는 걸까?","items":[{"n":1,"t":"tf","q":"Rain itself has a smell.","ko":"비 자체에 냄새가 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"Some people think it’s the smell of the rain itself.","어떤 사람들은 그것이 비 자체의 냄새라고 생각한다."],[4,"But rain doesn’t have a smell.","하지만 비는 냄새를 가지고 있지 않다."]],"w":"3번에서 사람들은 비 자체의 냄새라고 생각하지만, 4번에서 But rain doesn’t have a smell(하지만 비는 냄새를 가지고 있지 않다)이라고 해요. 비에 냄새가 있다는 말은 반대예요.","c":"F"},"h":"10d805fca2"},{"n":2,"t":"tf","q":"The bacteria live in the wet soil.","ko":"박테리아는 축축한 흙에 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"These bacteria live in the wet soil.","이 박테리아는 축축한 흙에 산다."]],"w":"6번 문장에 These bacteria live in the wet soil(이 박테리아는 축축한 흙에 산다)이 그대로 나와요.","c":"T"},"h":"2f136f3a5f"},{"n":3,"t":"tf","q":"Geosmin is usually located in the air.","ko":"지오스민은 보통 공기 중에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"It is usually located between rocks.","그것은 보통 바위들 사이에 있다."]],"w":"9번에서 지오스민은 보통 바위들 사이에 있다(located between rocks)고 해요. 공기 속에 있는 것은 비가 온 뒤에 일어나는 일이에요.","c":"F"},"h":"36a79ca28e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Geosmin has a unique smell that we all recognize.)","ko":"지오스민은 우리 모두가 인식하는 독특한 냄새를 가지고 있다.","opts":["흔한","약한","평범한","독특한"],"word":"unique","r":{"a":"4) 독특한","ev":"8번 문장","s":[[8,"Geosmin has a unique smell that we all recognize.","지오스민은 우리 모두가 인식하는 독특한 냄새를 가지고 있다."]],"w":"8번에서 지오스민은 우리 모두가 알아보는 특별한 냄새를 가졌다고 해요. unique = 독특한, 하나뿐인 느낌이에요.","c":4},"h":"bfe8b0800b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It has an earthy scent.)","ko":"그것은 흙냄새를 가지고 있다.","opts":["바다 냄새가 나는","꽃향기가 나는","흙냄새가 나는","불 냄새가 나는"],"word":"earthy","r":{"a":"3) 흙냄새가 나는","ev":"2번 문장","s":[[2,"It has an earthy scent.","그것은 흙냄새를 가지고 있다."]],"w":"2번은 비 온 뒤 공기에서 나는 냄새를 말해요. 흙에서 올라오는 냄새니까 earthy는 '흙냄새가 나는'이에요.","c":3},"h":"7e7538d4e8"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis causes it to enter the air.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이것은 지오스민이 공기에 들어가게 한다.","opts":["비","지오스민","박테리아","바위"],"r":{"a":"2) 지오스민","ev":"10~11번 문장","s":[[10,"When it rains, water hits the geosmin.","비가 오면, 빗물이 지오스민을 튕겨낸다."],[11,"This causes it to enter the air.","이것은 지오스민이 공기에 들어가게 한다."]],"w":"11번의 it은 앞 문장(10번)에서 빗물이 튕겨낸 geosmin(지오스민)이에요. 지오스민이 공기에 들어가는 거예요.","c":2},"h":"c91b1223eb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why we can smell an earthy scent on a rainy day.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 우리는 비 오는 날에 흙냄새를 맡을 수 있다.","opts":["앞에서 말한 과정 때문에 우리는 비 오는 날 흙냄새를 맡을 수 있다.","그것이 우리가 비 오는 날을 좋아하는 이유이다.","비 오는 날에는 우리가 냄새를 전혀 맡을 수 없다.","흙냄새가 나기 때문에 비가 오기 시작한다."],"r":{"a":"1) 앞에서 말한 과정 때문에 우리는 비 오는 날 흙냄새를 맡을 수 있다.","ev":"13번 문장","s":[[13,"That’s why we can smell an earthy scent on a rainy day.","그래서 우리는 비 오는 날에 흙냄새를 맡을 수 있다."]],"w":"That’s why는 '그래서 ~다'라는 뜻이고, 뒤에 결과가 와요. 그래서 비 오는 날 흙냄새를 맡을 수 있다는 뜻이에요.","c":1},"h":"e73ab3c597"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["비 자체가 지오스민을 만들어 낸다.","지오스민은 아무 냄새도 없는 물질이다.","박테리아가 지오스민이라는 물질을 만들어 낸다.","지오스민은 비가 오기 전에 이미 공기 속에 있다."],"opts":["Rain itself produces geosmin.","Geosmin is a substance with no smell.","Bacteria produce a substance called geosmin.","Geosmin is already in the air before it rains."],"r":{"a":"3) Bacteria produce a substance called geosmin.","ev":"7번 문장","s":[[7,"They produce something called geosmin.","그들은 geosmin(지오스민)이라고 불리는 것을 만들어 낸다."]],"w":"7번에서 박테리아(They)가 geosmin이라 불리는 것을 만들어 낸다고 해요. 나머지는 본문과 달라요. 빗물이 지오스민을 만드는 게 아니고(7번), 지오스민에는 냄새가 있어요(8번).","c":3},"h":"ec5ce0b4f1"},{"n":9,"t":"sum","q":"The earthy smell comes from (A). Then (B) in the air carries it to our noses.","ko":"흙냄새는 (A)에서 온다. 그러면 공기 중의 (B)가 그것을 우리 코로 옮긴다.","oko":["(A) 비 / (B) 바람","(A) 바위 / (B) 먼지","(A) 비 / (B) 수분","(A) 바위 / (B) 열기","(A) 박테리아 / (B) 수분"],"opts":["(A) rain / (B) wind","(A) rocks / (B) dust","(A) rain / (B) moisture","(A) rocks / (B) heat","(A) bacteria / (B) moisture"],"r":{"a":"5) (A) bacteria / (B) moisture","ev":"5, 12번 문장","s":[[5,"In fact, the smell is caused by bacteria.","사실, 그 냄새는 박테리아에 의해 야기된다."],[12,"Then moisture in the air carries it to our noses.","그러면 공기 중의 수분이 그것을 우리 코로 옮긴다."]],"w":"5번에서 냄새는 박테리아 때문에 생기고, 12번에서 공기 중의 수분이 그것을 코로 옮겨요. 바람이나 비, 먼지는 본문의 이유가 아니에요.","c":5},"h":"a8b4007b6a"},{"n":10,"t":"fill","q":"When it rains, [A] hits the geosmin. This causes it to [B] the air.","ko":"비가 오면 [A]가 지오스민을 튕겨낸다. 이것은 지오스민이 공기에 [B]하게 한다.","bank":["water","enter","bacteria","rocks","carry","smell"],"bko":{"water":"물, 빗물","enter":"들어가다","bacteria":"박테리아","rocks":"바위","carry":"나르다","smell":"냄새"},"a":"[A] water, [B] enter","r":{"a":"[A] water, [B] enter","ev":"10~11번 문장","s":[[10,"When it rains, water hits the geosmin.","비가 오면, 빗물이 지오스민을 튕겨낸다."],[11,"This causes it to enter the air.","이것은 지오스민이 공기에 들어가게 한다."]],"w":"10번에서 When it rains, water hits the geosmin이라 했고, 11번에서 이것이 지오스민을 공기에 들어가게(enter) 한다고 해요. bacteria는 냄새의 원인이지 비가 오면 튕겨내는 것이 아니에요.","c":null},"h":"a9232d421b"}]},{"u":1,"id":"nl1-01-2","no":2,"ko":"별자리를 본 적이 있니?","items":[{"n":1,"t":"tf","q":"The term “dog days” came from the ancient Greeks.","ko":"‘dog days’라는 용어는 고대 그리스인들로부터 왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The term “dog days” came from the ancient Greeks.","‘dog days’라는 용어는 고대 그리스인들로부터 왔다."]],"w":"3번 문장에 The term “dog days” came from the ancient Greeks(그 용어는 고대 그리스인들로부터 왔다)가 그대로 나와요.","c":"T"},"h":"028cddbf2f"},{"n":2,"t":"tf","q":"Sirius is far from the sun during the hottest part of summer.","ko":"시리우스는 여름의 가장 더운 기간 동안 태양에서 멀리 떨어져 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"During the hottest part of summer, Sirius is very close to the sun.","여름의 가장 더운 기간 동안, 시리우스는 태양에 매우 가깝다."]],"w":"6번에서 여름의 가장 더운 기간에 시리우스는 태양에 매우 가깝다(very close to the sun)고 해요. 멀다는 말은 반대예요.","c":"F"},"h":"097990e94c"},{"n":3,"t":"tf","q":"Sirius is also known as the dog star.","ko":"시리우스는 dog star로도 알려져 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Its name is Sirius, but it is also known as the dog star.","그것의 이름은 시리우스이지만, dog star(천랑성)로도 알려져 있다."]],"w":"5번에서 Its name is Sirius, but it is also known as the dog star(이름은 시리우스지만 dog star로도 알려져 있다)라고 해요.","c":"T"},"h":"3b1f9ac2ef"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The term “dog days” came from the ancient Greeks.)","ko":"‘dog days’라는 용어는 고대 그리스인들로부터 왔다.","opts":["현대의","고대의","유명한","용감한"],"word":"ancient","r":{"a":"2) 고대의","ev":"3번 문장","s":[[3,"The term “dog days” came from the ancient Greeks.","‘dog days’라는 용어는 고대 그리스인들로부터 왔다."]],"w":"3번은 ‘dog days’라는 말이 누구에게서 왔는지 말해요. 4번의 Long ago(오래전에)와 이어지므로 ancient는 ‘고대의, 아주 오래된’이에요.","c":2},"h":"1f81721762"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is very hot, and the sun is shining brightly.)","ko":"매우 덥고 태양은 밝게 빛나고 있다.","opts":["숨어 있는","식어 가는","빛나고 있는","떨어지는"],"word":"shining","r":{"a":"3) 빛나고 있는","ev":"1번 문장","s":[[1,"It is very hot, and the sun is shining brightly.","매우 덥고 태양은 밝게 빛나고 있다."]],"w":"1번은 매우 더운 날의 모습이에요. 태양이 brightly(밝게) 빛나고 있다는 뜻이라서 shining은 ‘빛나고 있는’이에요. shine(빛나다)의 -ing형이에요.","c":3},"h":"e5dd5894f8"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt rises and sets with the sun as well.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 또한 태양과 함께 뜨고 진다.","opts":["태양","큰개자리","여름","시리우스"],"r":{"a":"4) 시리우스","ev":"6~7번 문장","s":[[6,"During the hottest part of summer, Sirius is very close to the sun.","여름의 가장 더운 기간 동안, 시리우스는 태양에 매우 가깝다."],[7,"It rises and sets with the sun as well.","그것은 또한 태양과 함께 뜨고 진다."]],"w":"7번의 It은 앞 문장(6번)의 주어 Sirius예요. 시리우스가 태양과 함께 뜨고 진다는 두 번째 이유를 말해요.","c":4},"h":"95061a5614"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Today, the dog days usually start in early July and end in the middle of August.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘날, 삼복더위는 보통 7월 초에 시작해서 8월 중순에 끝난다.","opts":["오늘날 삼복더위는 보통 7월 초에 시작해서 8월 중순에 끝난다.","오늘날 삼복더위는 보통 7월 중순에 시작해서 8월 초에 끝난다.","오늘날 삼복더위는 보통 6월 초에 시작해서 7월 중순에 끝난다.","오늘날 삼복더위는 8월 초에 시작해서 9월 중순에 끝난다."],"r":{"a":"1) 오늘날 삼복더위는 보통 7월 초에 시작해서 8월 중순에 끝난다.","ev":"9번 문장","s":[[9,"Today, the dog days usually start in early July and end in the middle of August.","오늘날, 삼복더위는 보통 7월 초에 시작해서 8월 중순에 끝난다."]],"w":"Today(오늘날)로 시작해서 지금의 dog days 기간을 말해요. early July는 7월 초, the middle of August는 8월 중순이에요.","c":1},"h":"f4d30f0463"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["시리우스는 태양의 다른 이름이다.","시리우스는 태양이 진 뒤에 뜬다.","고대 그리스인들은 큰개자리에서 가장 밝은 별을 관찰했다.","고대 그리스인들은 추운 날씨가 두 개의 별 때문이라고 믿었다."],"opts":["Sirius is another name for the sun.","Sirius rises after the sun sets.","The ancient Greeks watched the brightest star in Canis Major.","The ancient Greeks believed the cold weather was caused by two stars."],"r":{"a":"3) The ancient Greeks watched the brightest star in Canis Major.","ev":"4번 문장","s":[[4,"Long ago, they watched the brightest star in Canis Major.","오래전에, 그들은 큰개자리에 있는 가장 밝은 별을 관찰했다."]],"w":"4번에서 그리스인들은 큰개자리에서 가장 밝은 별을 관찰했어요. 시리우스는 태양의 다른 이름이 아니고(5번), 태양과 함께 뜨고 져요(7번). 그리스인들은 더운 날씨가 두 별 때문이라고 믿었어요(8번).","c":3},"h":"7f8a8c7e39"},{"n":9,"t":"sum","q":"The ancient Greeks believed the hot weather was caused by the sun and (A), because it is very (B) to the sun and rises and sets with it.","ko":"고대 그리스인들은 더운 날씨가 태양과 (A) 때문이라고 믿었다. 그것이 태양에 매우 (B) 태양과 함께 뜨고 지기 때문이다.","oko":["(A) 큰개자리 / (B) 멀다","(A) 달 / (B) 가깝다","(A) 시리우스 / (B) 멀다","(A) 큰개자리 / (B) 가깝다","(A) 시리우스 / (B) 가깝다"],"opts":["(A) Canis Major / (B) far","(A) the moon / (B) close","(A) Sirius / (B) far","(A) Canis Major / (B) close","(A) Sirius / (B) close"],"r":{"a":"5) (A) Sirius / (B) close","ev":"6~8번 문장","s":[[6,"During the hottest part of summer, Sirius is very close to the sun.","여름의 가장 더운 기간 동안, 시리우스는 태양에 매우 가깝다."],[7,"It rises and sets with the sun as well.","그것은 또한 태양과 함께 뜨고 진다."],[8,"Therefore, the ancient Greeks believed the hot weather was caused by these two stars.","따라서, 고대 그리스인들은 더운 날씨가 이 두 개의 별에 의해 야기되었다고 믿었다."]],"w":"6번에서 시리우스는 태양에 가깝고(close), 7번에서 태양과 함께 뜨고 져요. 그래서 8번에서 그리스인들은 시리우스와 태양 두 별이 더위의 원인이라고 믿었어요. Canis Major는 별자리 이름이에요.","c":5},"h":"736842af22"},{"n":10,"t":"fill","q":"Long ago, the ancient [A] watched the [B] star in Canis Major.","ko":"오래전에, 고대 [A]은 큰개자리에서 [B] 별을 관찰했다.","bank":["Greeks","brightest","hottest","Sirius","summer","close"],"bko":{"Greeks":"그리스인들","brightest":"가장 밝은","hottest":"가장 더운","Sirius":"시리우스","summer":"여름","close":"가까운"},"a":"[A] Greeks, [B] brightest","r":{"a":"[A] Greeks, [B] brightest","ev":"4번 문장","s":[[4,"Long ago, they watched the brightest star in Canis Major.","오래전에, 그들은 큰개자리에 있는 가장 밝은 별을 관찰했다."]],"w":"4번에서 Long ago, they(= 고대 그리스인들) watched the brightest star in Canis Major라고 해요. hottest는 6번에서 ‘가장 더운 기간’을 말할 때 쓴 말이에요.","c":null},"h":"6ad814cb40"}]},{"u":1,"id":"nl1-01-3","no":3,"ko":"달걀 껍질의 쓸모 있는 변신","items":[{"n":1,"t":"tf","q":"Eggshells contain a lot of calcium carbonate.","ko":"달걀 껍질에는 탄산칼슘이 많이 들어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Eggshells contain lots of calcium carbonate.","달걀 껍질에는 탄산칼슘이 많이 들어 있다."]],"w":"4번 문장에 Eggshells contain lots of calcium carbonate(달걀 껍질에는 탄산칼슘이 많이 들어 있다)가 나와요.","c":"T"},"h":"d9f7831b31"},{"n":2,"t":"tf","q":"Tomato plants rot easily when they get enough calcium.","ko":"토마토는 칼슘을 충분히 얻으면 쉽게 썩는다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Without enough calcium, these plants easily rot.","충분한 칼슘이 없으면 이 식물은 쉽게 썩는다."]],"w":"8번에서 칼슘이 충분하지 않으면(Without enough calcium) 토마토가 쉽게 썩는다고 해요. 칼슘이 충분하면 썩는다는 말은 반대예요.","c":"F"},"h":"dd00157e5e"},{"n":3,"t":"tf","q":"Crushing eggshells helps them break down faster.","ko":"달걀 껍질을 으깨면 더 빨리 분해되도록 도와준다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"This helps the eggshells break down faster.","이것은 달걀 껍질이 더 빨리 분해되도록 도와준다."]],"w":"13번에서 This helps the eggshells break down faster(이것은 달걀 껍질이 더 빨리 분해되도록 도와준다)라고 해요. This는 12번의 잘게 부수는 일이에요.","c":"T"},"h":"8c11e7ed40"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Eggshells contain lots of calcium carbonate.)","ko":"달걀 과 같은 것은?","oko":["달걀 껍질은 식물의 뿌리를 약하게 만든다.","달걀 껍질은 특히 토마토에 좋다.","달걀 껍질의 냄새는 해충을 불러 모은다.","달걀 껍질을 부수기 전에 흙 위에 뿌려야 한다."],"opts":["Eggshells make plants’ roots weak.","Eggshells are especially good for tomato plants.","The smell of eggshells attracts pests.","You should sprinkle the eggshells before you crush them."],"r":{"a":"2) Eggshells are especially good for tomato plants.","ev":"7번 문장","s":[[7,"Eggshells are especially good for tomato plants.","달걀 껍질은 특히 토마토에 좋다."]],"w":"7번에서 달걀 껍질은 특히 토마토에 좋다고 해요. 달걀 껍질은 뿌리를 튼튼하게 하고(5번), 냄새로 해충을 쫓으며(9번), 부수는 일은 흙에 뿌리기 전에 해요(12~14번).","c":2},"h":"ac514d19ed"},{"n":9,"t":"sum","q":"Eggshells contain (A), which makes plants’ roots (B), so the plants grow faster and bigger.","ko":"달걀 껍질에는 (A)이 들어 있고, 이것이 식물의 뿌리를 (B) 만들어서 식물이 더 빠르고 크게 자란다.","oko":["(A) 비타민 / (B) 튼튼하게","(A) 비타민 / (B) 약하게","(A) 탄산칼슘 / (B) 튼튼하게","(A) 탄산칼슘 / (B) 약하게","(A) 해충 / (B) 튼튼하게"],"opts":["(A) vitamins / (B) strong","(A) vitamins / (B) weak","(A) calcium carbonate / (B) strong","(A) calcium carbonate / (B) weak","(A) pests / (B) strong"],"r":{"a":"3) (A) calcium carbonate / (B) strong","ev":"4~6번 문장","s":[[4,"Eggshells contain lots of calcium carbonate.","달걀 껍질에는 탄산칼슘이 많이 들어 있다."],[5,"It makes plants’ roots strong.","그것은 식물의 뿌리를 튼튼하게 만들어 준다."],[6,"So the plants grow faster and bigger.","그래서 식물은 더 빠르고 더 크게 자란다."]],"w":"4번에서 달걀 껍질에 탄산칼슘이 많고, 5번에서 그것이 뿌리를 튼튼하게 해요. 그래서 6번처럼 식물이 더 빠르고 크게 자라요.","c":3},"h":"7542cab605"},{"n":10,"t":"fill","q":"First, [A] and dry the eggshells. Then [B] them into small pieces.","ko":"먼저, 달걀 껍질을 [A]하고 말려라. 그러고 나서 그것을 잘게 [B]하라.","bank":["clean","crush","sprinkle","rot","grow","throw"],"bko":{"clean":"씻다","crush":"으깨다","sprinkle":"흩뿌리다","rot":"썩다","grow":"기르다","throw":"던지다"},"a":"[A] clean, [B] crush","r":{"a":"[A] clean, [B] crush","ev":"11~12번 문장","s":[[11,"First, clean and dry the eggshells.","먼저, 달걀 껍질을 씻어서 말려라."],[12,"Then crush them into small pieces.","그러고 나서 그것을 잘게 부숴라."]],"w":"11번 First, clean and dry the eggshells. 12번 Then crush them into small pieces.에서 가져왔어요. sprinkle은 14번의 마지막 단계라서 여기에 맞지 않아요.","c":null},"h":"3983e969bb"}]},{"u":1,"id":"nl1-01-4","no":4,"ko":"어떤 고래의 놀라운 적응력","items":[{"n":1,"t":"tf","q":"Eden’s whales in the Gulf of Thailand come to the surface for the same reason as other whales.","ko":"태국만의 에덴 고래는 다른 고래들과 같은 이유로 수면으로 온다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"They are mammals, so they must come to the surface of the ocean to breathe.","그들은 포유류라서 숨을 쉬기 위해 해수면으로 와야 한다."],[3,"However, Eden’s whales in the Gulf of Thailand come to the surface for another reason.","하지만 태국만에 사는 에덴 고래는 다른 이유로 수면으로 온다."]],"w":"2번에서 보통 고래는 숨을 쉬려고 수면에 와요. 하지만 3번 However 뒤에서 태국만의 에덴 고래는 다른 이유(for another reason)로 온다고 해요. 같은 이유라는 말은 반대예요.","c":"F"},"h":"07afa8b367"},{"n":2,"t":"tf","q":"Fish often swim to the surface to get more oxygen.","ko":"물고기들은 더 많은 산소를 얻기 위해 자주 수면으로 헤엄친다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Consequently, they often swim to the surface to get more oxygen.","그 결과, 그들은 더 많은 산소를 얻기 위해 자주 수면으로 헤엄친다."]],"w":"5번에서 물고기들은 더 많은 산소를 얻기 위해 자주 수면으로 헤엄친다(they often swim to the surface to get more oxygen)고 해요.","c":"T"},"h":"ebb06b25ab"},{"n":3,"t":"tf","q":"A whale closes its mouth when its mouth is empty.","ko":"고래는 입이 비어 있을 때 입을 닫는다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"When its mouth is full, the whale closes it and enjoys its meal.","입이 가득 차면 고래는 입을 다물고 식사를 즐긴다."]],"w":"12번에서 입이 가득 차면(When its mouth is full) 고래가 입을 닫고 식사를 즐긴다고 해요. 입이 비었을 때 닫는다는 말은 맞지 않아요.","c":"F"},"h":"a92c504e83"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The polluted water of the gulf makes it hard for fish to breathe.)","ko":"그 (태국)만의 오염된 물은 물고기들이 숨 쉬는 것을 어렵게 만든다.","opts":["깨끗한","얼어붙은","깊은","오염된"],"word":"polluted","r":{"a":"4) 오염된","ev":"4번 문장","s":[[4,"The polluted water of the gulf makes it hard for fish to breathe.","그 (태국)만의 오염된 물은 물고기들이 숨 쉬는 것을 어렵게 만든다."]],"w":"4번은 물고기가 숨 쉬기 힘들다는 내용이에요. 그 이유가 물의 상태이니 polluted는 ‘오염된’이에요.","c":4},"h":"71e8ddcb3a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Birds even fly over and grab them from the whale’s mouth.)","ko":"심지어 새들이 날아와 고래의 입에서 그들을 낚아챈다.","opts":["낚아채다","지켜보다","뱉어내다","따라가다"],"word":"grab","r":{"a":"1) 낚아채다","ev":"11번 문장","s":[[11,"Birds even fly over and grab them from the whale’s mouth.","심지어 새들이 날아와 고래의 입에서 그들을 낚아챈다."]],"w":"11번은 새들이 날아와서 고래의 입 안의 물고기를 ‘잡아채는’ 장면이에요. grab = 움켜쥐다, 잡아채다예요.","c":1},"h":"c785cce772"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nEden’s whales wanting to feed on the fish follow them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"물고기를 먹고 싶은 에덴 고래는 그들을 따라간다.","opts":["고래들","물고기들","새들","오염 물질"],"r":{"a":"2) 물고기들","ev":"6번 문장","s":[[6,"Eden’s whales wanting to feed on the fish follow them.","물고기를 먹고 싶은 에덴 고래는 그들을 따라간다."]],"w":"6번에서 고래는 the fish(물고기들)를 먹고 싶어서 따라가요. them은 바로 앞에 나온 the fish를 가리켜요. 고래가 고래를 따라가는 게 아니에요.","c":2},"h":"405ca4a3af"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When its mouth is full, the whale closes it and enjoys its meal.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"입이 가득 차면 고래는 입을 다물고 식사를 즐긴다.","opts":["입이 비어 있으면 고래는 입을 닫고 식사를 즐긴다.","입이 가득 차면 고래는 입을 열고 식사를 멈춘다.","입이 가득 차면 고래는 입을 닫고 식사를 즐긴다.","입이 가득 차면 새가 와서 식사를 즐긴다."],"r":{"a":"3) 입이 가득 차면 고래는 입을 닫고 식사를 즐긴다.","ev":"12번 문장","s":[[12,"When its mouth is full, the whale closes it and enjoys its meal.","입이 가득 차면 고래는 입을 다물고 식사를 즐긴다."]],"w":"when its mouth is full은 ‘입이 가득 차면’이고, closes it은 ‘입을 닫고’, enjoys its meal은 ‘식사를 즐긴다’예요.","c":3},"h":"8b3e2ac0eb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오염된 물은 물고기가 더 쉽게 숨 쉬도록 돕는다.","에덴 고래는 새들을 수면으로 쫓아낸다.","물의 흐름이 물고기를 고래의 입 밖으로 밀어낸다.","고래의 입을 향한 물의 흐름이 물고기를 끌어넣는다."],"opts":["The polluted water helps fish breathe more easily.","Eden’s whales chase birds to the surface.","The flow of water pushes the fish out of the whale’s mouth.","A flow of water toward the whale’s mouth pulls the fish in."],"r":{"a":"4) A flow of water toward the whale’s mouth pulls the fish in.","ev":"8~9번 문장","s":[[8,"This creates a flow of water towards it.","이는 그 입을 향해 물의 흐름을 만들어 낸다."],[9,"The flow of water pulls the fish into the whale’s mouth.","그 물의 흐름은 고래의 입 속으로 물고기를 끌어넣는다."]],"w":"8~9번에서 입을 향한 물의 흐름이 생기고, 그 흐름이 물고기를 입속으로 끌어넣어요. 오염된 물은 물고기를 숨 쉬기 어렵게 하고(4번), 고래가 새를 쫓지 않으며, 물고기를 밖으로 밀어내지도 않아요.","c":4},"h":"ca0ff9665d"},{"n":9,"t":"sum","q":"Because of (A) water, fish swim to the surface for oxygen, and Eden’s whales (B) them.","ko":"(A) 물 때문에 물고기들은 산소를 얻으러 수면으로 헤엄치고, 에덴 고래는 그들을 (B).","oko":["(A) 깨끗한 / (B) 따라간다","(A) 오염된 / (B) 피해 도망간다","(A) 따뜻한 / (B) 피해 숨는다","(A) 깨끗한 / (B) 피해 숨는다","(A) 오염된 / (B) 따라간다"],"opts":["(A) clean / (B) follow","(A) polluted / (B) escape from","(A) warm / (B) hide from","(A) clean / (B) hide from","(A) polluted / (B) follow"],"r":{"a":"5) (A) polluted / (B) follow","ev":"4~6번 문장","s":[[4,"The polluted water of the gulf makes it hard for fish to breathe.","그 (태국)만의 오염된 물은 물고기들이 숨 쉬는 것을 어렵게 만든다."],[5,"Consequently, they often swim to the surface to get more oxygen.","그 결과, 그들은 더 많은 산소를 얻기 위해 자주 수면으로 헤엄친다."],[6,"Eden’s whales wanting to feed on the fish follow them.","물고기를 먹고 싶은 에덴 고래는 그들을 따라간다."]],"w":"4번에서 오염된 물 때문에 물고기가 숨 쉬기 어렵고, 5번에서 산소를 얻으러 수면으로 가요. 6번에서 에덴 고래가 물고기를 따라가요(follow).","c":5},"h":"f0136fc92e"},{"n":10,"t":"fill","q":"At the surface, an Eden’s whale opens its mouth [A]. This creates a [B] of water towards it.","ko":"수면에서 에덴 고래는 입을 [A] 벌린다. 이는 그 입을 향해 물의 [B]을 만들어 낸다.","bank":["wide","flow","oxygen","trap","surface","follow"],"bko":{"wide":"크게, 넓게","flow":"흐름","oxygen":"산소","trap":"덫","surface":"수면","follow":"따라가다"},"a":"[A] wide, [B] flow","r":{"a":"[A] wide, [B] flow","ev":"7~9번 문장","s":[[7,"At the surface, an Eden’s whale opens its mouth wide.","수면에서 에덴 고래는 입을 크게 벌린다."],[8,"This creates a flow of water towards it.","이는 그 입을 향해 물의 흐름을 만들어 낸다."],[9,"The flow of water pulls the fish into the whale’s mouth.","그 물의 흐름은 고래의 입 속으로 물고기를 끌어넣는다."]],"w":"7번 opens its mouth wide, 8번 creates y\" refer to?\nThe changes are small, so they don’t cause any serious problems.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그 변화는 작아서 어떤 심각한 문제도 일으키지 않는다.","opts":["철","기술자들","변화들","센티미터"],"r":{"a":"3) 변화들","ev":"14번 문장","s":[[14,"The changes are small, so they don’t cause any serious problems.","그 변화는 작아서 어떤 심각한 문제도 일으키지 않는다."]],"w":"14번의 they는 앞의 the changes(변화들)예요. 변화가 작아서 심각한 문제를 일으키지 않는다는 뜻이에요.","c":3},"h":"5c748946dc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"You might wonder if this is dangerous.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신은 이것이 위험한지 아닌지 궁금할지도 모른다.","opts":["당신은 이것이 위험한지 아닌지 궁금할지도 모른다.","당신은 이것이 위험하다는 것을 이미 알고 있다.","당신은 이것이 위험하지 않다고 확신한다.","당신은 위험하면 도움을 요청해야 한다."],"r":{"a":"1) 당신은 이것이 위험한지 아닌지 궁금할지도 모른다.","ev":"12번 문장","s":[[12,"You might wonder if this is dangerous.","당신은 이것이 위험한지 아닌지 궁금할지도 모른다."]],"w":"might는 ‘~일지도 모른다’, wonder는 ‘궁금해하다’, if this is dangerous는 ‘이것이 위험한지 아닌지’예요. 뒤에 Don’t worry!가 이어져요.","c":1},"h":"74ee16425d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["에펠탑은 주로 나무로 만들어졌다.","철은 차가울 때 팽창한다.","전문 기술자들이 탑을 안전하게 유지한다.","탑은 여름에 더 짧아진다."],"opts":["The Eiffel Tower is made mostly of wood.","Iron expands when it is cold.","Professional engineers keep the tower safe.","The tower gets shorter in summer."],"r":{"a":"3) Professional engineers keep the tower safe.","ev":"15번 문장","s":[[15,"Professional engineers keep the tower safe!","전문 기술자들이 탑을 안전하게 유지해 준다!"]],"w":"15번에서 전문 기술자들이 탑을 안전하게 유지한다고 해요. 탑은 주로 철로 만들어졌고(6번), 여름에 자라며(3번), 철은 차가워지면 줄어들어요(9번).","c":3},"h":"7744c3d4f3"},{"n":9,"t":"sum","q":"The Eiffel Tower is mostly made of (A). The tower grows in summer because iron (B) when it is hot.","ko":"에펠탑은 주로 (A)로 만들어졌다. 철이 뜨거워지면 (B) 때문에 탑은 여름에 자란다.","oko":["(A) 나무 / (B) 팽창하기","(A) 철 / (B) 줄어들기","(A) 돌 / (B) 줄어들기","(A) 나무 / (B) 줄어들기","(A) 철 / (B) 팽창하기"],"opts":["(A) wood / (B) expands","(A) iron / (B) shrinks","(A) stone / (B) shrinks","(A) wood / (B) shrinks","(A) iron / (B) expands"],"r":{"a":"5) (A) iron / (B) expands","ev":"6~9번 문장","s":[[6,"The Eiffel Tower is made mostly of iron.","에펠탑은 주로 철로 만들어졌다."],[7,"Temperature has a strong effect on iron.","온도는 철에 강력한 영향을 미친다."],[8,"Iron expands when it’s hot.","철은 뜨거워지면 팽창한다."],[9,"And it shrinks when it’s cold.","그리고 차가워지면 줄어든다."]],"w":"6번에서 탑은 주로 철로 만들어졌고, 7~8번에서 철은 뜨거워지면 팽창해요. 그래서 여름에 탑이 더 커져요. 차가울 때는 줄어들어요(9번).","c":5},"h":"b92420cbc7"},{"n":10,"t":"fill","q":"The changes are [A], so they don’t cause any [B] problems.","ko":"그 변화는 [A] 그래서 어떤 [B] 문제도 일으키지 않는다.","bank":["small","serious","shrink","tall","iron","hot"],"bko":{"small":"작은","serious":"심각한","shrink":"줄어들다","tall":"키가 큰","iron":"철","hot":"뜨거운"},"a":"[A] small, [B] serious","r":{"a":"[A] small, [B] serious","ev":"14번 문장","s":[[14,"The changes are small, so they don’t cause any serious problems.","그 변화는 작아서 어떤 심각한 문제도 일으키지 않는다."]],"w":"14번 The changes are small, so they don’t cause any serious problems에서 가져왔어요. 변화가 작아서 심각한 문제를 일으키지 않아요.","c":null},"h":"81b7cc25d6"}]},{"u":2,"id":"nl1-02-2","no":2,"ko":"바닷속에 있는 거대한 싱크홀!","items":[{"n":1,"t":"tf","q":"The Great Blue Hole is near the coast of Belize.","ko":"Great Blue Hole은 Belize 해안 근처에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It’s a giant underwater sinkhole near the coast of Belize.","그것은 Belize(벨리즈) 해안 근처의 거대한 수중 싱크홀이다."]],"w":"3번에서 Great Blue Hole은 Belize 해안 근처(near the coast of Belize)의 수중 싱크홀이라고 해요.","c":"T"},"h":"fa8bc7b520"},{"n":2,"t":"tf","q":"The Great Blue Hole is 318 meters deep.","ko":"Great Blue Hole은 깊이가 318미터이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It is 318 meters across and 124 meters deep.","그것은 폭이 318미터이고 깊이가 124미터이다."]],"w":"4번에서 폭이 318미터(across), 깊이는 124미터(deep)라고 해요. 깊이가 318미터라는 말은 틀렸어요.","c":"F"},"h":"822013e79f"},{"n":3,"t":"tf","q":"The Great Blue Hole will last forever.","ko":"Great Blue Hole은 영원히 지속될 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Unfortunately, the Great Blue Hole won’t last forever.","안타깝게도 Great Blue Hole은 영원히 지속되지 않을 것이다."]],"w":"11번에서 Great Blue Hole은 영원히 지속되지 않을 것이다(won’t last forever)라고 해요.","c":"F"},"h":"b2cd6eaed9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Are you looking for adventure?)","ko":"당신은 모험을 찾고 있는가?","opts":["숙제","모험","휴식","쇼핑"],"word":"adventure","r":{"a":"2) 모험","ev":"1~2번 문장","s":[[1,"Are you looking for adventure?","당신은 모험을 찾고 있는가?"],[2,"Then you should visit the Great Blue Hole!","그렇다면 Great Blue Hole(그레이트 블루홀)을 방문해야 한다!"]],"w":"1번에서 모험을 찾고 있느냐고 묻고, 2번에서 그렇다면 Great Blue Hole을 방문하라고 해요. 거대한 수중 싱크홀에서 다이빙을 하는 것은 신나는 일이니 adventure는 '모험'이에요.","c":2},"h":"8a671ebe1b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Eventually, it collapsed, and a huge hole was created.)","ko":"마침내, 그것은 무너졌고 거대한 구멍이 형성되었다.","opts":["무너졌다","올라갔다","도착했다","빛났다"],"word":"collapsed","r":{"a":"1) 무너졌다","ev":"10번 문장","s":[[10,"Eventually, it collapsed, and a huge hole was created.","마침내, 그것은 무너졌고 거대한 구멍이 형성되었다."]],"w":"10번은 동굴이 물에 잠긴 뒤의 마지막 결과예요. 그 결과 거대한 구멍이 만들어졌으니 collapsed는 ‘무너졌다’예요.","c":1},"h":"a85bdc788b"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is slowly filling up with sand.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 천천히 모래로 채워지고 있다.","opts":["빙하기","모래","Belize","Great Blue Hole"],"r":{"a":"4) Great Blue Hole","ev":"11~12번 문장","s":[[11,"Unfortunately, the Great Blue Hole won’t last forever.","안타깝게도 Great Blue Hole은 영원히 지속되지 않을 것이다."],[12,"It is slowly filling up with sand.","그것은 천천히 모래로 채워지고 있다."]],"w":"12번의 It은 앞 문장(11번)의 주어인 the Great Blue Hole이에요. 그 구멍이 천천히 모래로 채워지고 있다는 말이에요.","c":4},"h":"101b8e676d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So if you want to see this amazing sight, you should hurry up!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 이 놀라운 광경을 보길 원한다면, 서둘러야 한다!","opts":["이 놀라운 광경을 보고 싶다면 천천히 가도 된다.","이 광경은 영원히 볼 수 있으니 서두를 필요가 없다.","이 놀라운 광경을 보고 싶다면 서둘러야 한다.","이 놀라운 광경을 보고 싶지 않다면 서둘러야 한다."],"r":{"a":"3) 이 놀라운 광경을 보고 싶다면 서둘러야 한다.","ev":"13번 문장","s":[[13,"So if reason they caught him, it was still a great idea!","비록 경찰이 그 쿠키가 그를 잡게 해 준 이유는 아니라고 말했지만, 그럼에도 불구하고 그것은 좋은 생각이었다!"]],"w":"Although는 ‘비록 ~이지만’이에요. 경찰은 쿠키가 잡은 이유는 아니라고 말했지만, 글쓴이는 그래도(still) 좋은 생각이었다고 해요.","c":3},"h":"d7e7f3652d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["주인들은 도둑을 바로 알아보았다.","주인들은 도둑의 사진을 쿠키 위에 올렸다.","경찰은 쿠키 덕분에 그를 잡았다고 말했다.","도둑은 빵집에서 쿠키를 훔쳤다."],"opts":["The owners recognized the thief right away.","The owners put the thief’s picture on cookies.","The police said the cookies helped them catch the man.","The thief stole cookies from the bakery."],"r":{"a":"2) The owners put the thief’s picture on cookies.","ev":"4~5번 문장","s":[[4,"They printed his picture on edible paper.","그들은 식용 종이에 그 도둑의 사진을 인쇄했다."],[5,"Then they placed the paper on top of cookies.","그러고 나서 그들은 쿠키 위에 그 종이를 올렸다."]],"w":"4~5번에서 도둑의 사진을 식용 종이에 인쇄해 쿠키 위에 올렸어요. 주인들은 도둑을 바로 알아보지 못했고(2번), 훔친 것은 쿠키가 아니라 돈이며(1번), 경찰은 쿠키가 이유가 아니라고 했어요(11번).","c":2},"h":"addc47f1a3"},{"n":9,"t":"sum","q":"The owners printed the thief’s picture on (A) paper and put it on cookies. They hoped people would (B) the suspect.","ko":"주인들은 도둑의 사진을 (A) 종이에 인쇄해 쿠키 위에 올렸다. 그들은 사람들이 용의자를 (B) 바랐다.","oko":["(A) 젖은 / (B) 잊기를","(A) 먹을 수 있는 / (B) 잊기를","(A) 젖은 / (B) 알아보기를","(A) 두꺼운 / (B) 체포하기를","(A) 먹을 수 있는 / (B) 알아보기를"],"opts":["(A) wet / (B) forget","(A) edible / (B) forget","(A) wet / (B) recognize","(A) thick / (B) arrest","(A) edible / (B) recognize"],"r":{"a":"5) (A) edible / (B) recognize","ev":"4~5, 7번 문장","s":[[4,"They printed his picture on edible paper.","그들은 식용 종이에 그 도둑의 사진을 인쇄했다."],[5,"Then they placed the paper on top of cookies.","그러고 나서 그들은 쿠키 위에 그 종이를 올렸다."],[7,"They hoped this would help people recognize the suspect.","그들은 이것이 사람들이 그 용의자를 알아보는 데 도움이 되길 바랐다."]],"w":"4번에서 사진을 edible(먹을 수 있는) 종이에 인쇄해 5번에서 쿠키에 올리고, 7번에서 사람들이 용의자를 알아보길(recognize) 바랐어요.","c":5},"h":"0a23b661e9"},{"n":10,"t":"fill","q":"They posted a picture of the cookies on [A] media. Below it, they wrot :3,"id":"nl1-03-1","no":1,"ko":"정답 한번 맞혀볼래?","items":[{"n":1,"t":"tf","q":"The writer gave her friends a riddle.","ko":"작가는 친구들에게 수수께끼를 냈다.","r":{"ev":"2번 문장","s":[[2,"She gave them a riddle.","그녀는 그들에게 수수께끼를 냈다."]],"w":"2번 문장에서 She gave them a riddle이라고 해요. them은 세 친구예요. 본문과 일치해요.","a":"T (본문과 맞는 내용)","c":"T"},"h":"4f02422c82"},{"n":2,"t":"tf","q":"The first answer, “T-shirt,” was correct.","ko":"첫 번째 대답인 “티셔츠”는 정답이었다.","r":{"ev":"5~6번 문장","s":[[5,"This was the wrong answer.","이것은 오답이었다."],[6,"A T-shirt isn’t full of T.","티셔츠는 t로 가득하지 않다."]],"w":"5번에서 This was the wrong answer(오답)라고 하고, 6번에서 티셔츠는 t로 가득하지 않다고 해요. 정답이었다는 말은 반대예요.","a":"F (본문과 다른 내용)","c":"F"},"h":"3ae7b255d6"},{"n":3,"t":"tf","q":"The writer’s riddle was about the letter T.","ko":"작가의 수수께끼는 알파벳 T에 관한 것이었다.","r":{"ev":"3번 문장","s":[[3,"She said, “What starts with T, ends with T, and is full of T?”","그녀는 “t로 시작하고, t로 끝나며, t로 가득한 것은 뭘까?”라고 말했다."]],"w":"3번 문장의 수수께끼가 What starts with T, ends with T, and is full of T?예요. T에 관한 수수께끼가 맞아요.","a":"T (본문과 맞는 내용)","c":"T"},"h":"a7be593db6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So the writer made a suggestion.)","ko":"그래서 작가가 한 가지 제안을 했다.","opts":["질문","제안","불평","거짓말"],"word":"suggestion","r":{"ev":"8번 문장","s":[[8,"So the writer made a suggestion.","그래서 작가가 한 가지 제안을 했다."]],"w":"7번에서 아무도 답을 몰랐어요. 그래서(So) 작가가 9번에서 '답을 알아내면 내가 점심을 살게'라고 제안해요. suggestion = 제안.","a":"2) 제안","c":2},"h":"bb6aae30ac"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It was the correct answer!)","ko":"그것은 정답이었다!","opts":["틀린","어려운","정확한","재미있는"],"word":"correct","r":{"ev":"13번 문장","s":[[13,"It was the correct answer!","그것은 정답이었다!"]],"w":"친구들이 냅킨에 쓴 답을 보니 맞았어요. 앞에서 오답(wrong)이던 T-shirt와 반대로 correct는 '정확한, 맞는'이에요.","a":"3) 정확한","c":3},"h":"dc9beacdab"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey began discussing possible answers.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 가능한 답을 의논하기 시작했다.","opts":["작가의 친구들","작가","그 수 rote War and Peace to praise Napoleon."],"r":{"ev":"9~10번 문장","s":[[9,"Also, Napoleon was usually surrounded by his guards.","또한, Napoleon은 평소에 그의 경호원들에 둘러싸여 있었다."],[10,"They were all about 10 centimeters taller than him.","그들은 모두 그보다 약 10센티미터 더 컸다."]],"w":"10번에서 경호원들은 모두 Napoleon보다 약 10센티미터 컸어요. 경호원이 더 작았다는 말은 없고, 5피트 2인치는 당시 평균이었으며(8번), Tolstoy는 그를 작게 묘사했어요(13번).","a":"2) Napoleon’s guards were all about 10 centimeters taller than he was.","c":2},"h":"b0077f16d9"},{"n":9,"t":"sum","q":"In the past, feet and inches were (A) than today, so Napoleon’s height of 5 feet, 2 inches was (B) at that time.","ko":"과거의 피트와 인치는 오늘날보다 (A) 길이였기 때문에, Napoleon의 5피트 2인치라는 키는 그 당시에 (B)이었다.","oko":["(A) 더 짧은 / (B) 평균","(A) 더 긴 / (B) 매우 작은 키","(A) 더 짧은 / (B) 매우 큰 키","(A) 더 긴 / (B) 매우 큰 키","(A) 더 긴 / (B) 평균"],"opts":["(A) shorter / (B) average","(A) longer / (B) very short","(A) shorter / (B) very tall","(A) longer / (B) very tall","(A) longer / (B) average"],"r":{"ev":"4번, 5번, 6번, 8번 문장","s":[[4,"First of all, feet and inches were different in the past.","우선, 과거의 피트와 인치는 달랐다."],[5,"They were longer than they are today.","그것들은 오늘날의 것보다 더 길었다."],[6,"Napoleon was about 5 feet, 2 inches tall.","Napoleon의 키는 약 5피트 2인치였다."],[8,"This means his height was average at that time.","이것은 그의 키가 그 당시의 평균이었다는 것을 의미한다."]],"w":"4~5번에서 과거의 피트와 인치는 오늘날보다 더 길었어요(longer). 그래서 6번의 5피트 2인치가 8번에서 당시의 평균(average) 키였다는 결론이 나와요.","a":"5) (A) longer / (B) average","c":5},"h":"5f4e0cfb6d"},{"n":10,"t":"fill","q":"Napoleon was Russia’s [A], so Tolstoy [B] him as a \"little man.\"","ko":"Napoleon은 러시아의 [A]이었기 때문에 Tolstoy는 그를 ‘작은 남자’라고 [B].","bank":["enemy","described","friend","praised","author","guard"],"bko":{"enemy":"적","described":"묘사했다","friend":"친구","praised":"칭찬했다","author":"작가","guard":"경호원"},"r":{"ev":"12~13번 문장","s":[[12,"Finally, Russian author Leo Tolstoy wrote about him in his book War and Peace.","마지막으로, 러시아 작가인 Leo Tolstoy(레오 톨스토이)가 그의 책 <전쟁과 평화>에서 그에 대해 적었다."],[13,"Napoleon was Russia’s enemy, so he described the emperor as a “little man.”","Napoleon은 러시아의 적이었기 때문에 그는 그 황제를 ‘작은 남자’라고 묘사했다."]],"w":"13번에서 Napoleon was Russia’s enemy, so he described the emperor as a 'little man'이라고 해요. friend나 praised는 '작은 남자'라는 표현과 맞지 않아요.","a":"[A] enemy, [B] described","c":null},"h":"e6bdd9f45e"}]},{"u":3,"id":"nl1-03-4","no":4,"ko":"걸어서 어디든 갈 수 있어!","items":[{"n":1,"t":"tf","q":"A walk score tells you how easy walking to public places is.","ko":"워크 스코어는 공공장소에 걸어서 가는 것이 얼마나 쉬운지를 알려 준다.","r":{"ev":"3번 문장","s":[[3,"A walk score tells you how easy walking to public places is.","워크 스코어는 공공장소에 걸어서 가는 것이 얼마나 쉬운지를 알려 준다."]],"w":"3번 문장 그대로예요. 걸어서 갈 수 있는 쉬운 정도를 알려 줘요.","a":"T (본문과 맞는 내용)","c":"T"},"h":"818b61c5ed"},{"n":2,"t":"tf","q":"A city gets the highest walk score if the places are within a thirty-minute walk.","ko":"장소들이 도보로 30분 이내에 있으면 그 도시는 가장 높은 워크 스코어를 얻는다.","r":{"ev":"4번 문장","s":[[4,"If the places are within a five-minute walk, the city gets the highest walk score.","만약 그 장소들이 도보로 5분 이내에 있다면, 그 도시는 가장 높은 워크 스코어를 얻는다."]],"w":"4번에서 가장 높은 점수의 조건은 five-minute walk(도보 5분 이내)예요. 30분이 아니에요.","a":"F (본문과 다른 내용)","c":"F"},"h":"60bb021b3d"},{"n":3,"t":"tf","q":"Cities with high walk scores have less noise because there are not many cars on the road.","ko":"워크 스코어가 높은 도시는 도로에 차가 많지 않아서 소음이 더 적다.","r":{"ev":"8번 문장","s":[[8,"These cities also have less noise because there aren’t many cars on the road.","또한 이 도시들은 도로에 차가 많이 없기 때문에 소음도 더 적다."]],"w":"8번 문장에서 these cities also have less noise because there aren’t many cars on the road라고 해요.","a":"T (본문과 맞는 내용)","c":"T"},"h":"a82b7dfc76"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Furthermore, they are an attractive choice for tourists.)","ko":"게다가 관광객에게 매력적인 선택지이다.","opts":["위험한","매력적인","값비싼","지루한"],"word":"attractive","r":{"ev":"9번 문장","s":[[9,"Furthermore, they are an attractive choice for tourists.","게다가 관광객에게 매력적인 선택지이다."]],"w":"Furthermore 뒤에 두 번째 이점이 와요. 관광객이 선택하고 싶은 도시라는 좋은 뜻이므로 '매력적인'이 알맞아요.","a":"2) 매력적인","c":2},"h":"0c51d2e282"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These systems make it more convenient for tourists to walk around the cities.)","ko":"이러한 시스템들은 관광객들이 도시를 돌아다니는 것을 더 편리하게 해 준다.","opts":["편리한","불편한","복잡한","조용한"],"word":"convenient","r":{"ev":"11번 문장","s":[[11,"These systems make it more convenient for tourists to walk around the cities.","이러한 시스템들은 관광객들이 도시를 돌아다니는 것을 더 편리하게 해 준다."]],"w":"체계적인 도로 시스템 덕분에 걷기가 더 쉬워진다는 내용이에요. 좋은 결과이므로 '편리한'이 알맞아요.","a":"1) 편리한","c":1},"h":"646c615841"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey usually have organized street systems.","ko":"밑줄 친 They가 가리키는 것은?","sko":"이 도시들은 대개 체계적인 도로 시스템을 갖고 있다.","opts":["관광객들","자동차들","높은 워크 스코어를 가진 도시들","공공장소들"],"r":{"ev":"9~10번 문장","s":[[9,"Furthermore, they are an attractive choice for tourists.","게다가 관광객에게 매력적인 선택지이다."],[10,"They usually have organized street systems.","이 도시들은 대개 체계적인 도로 시스템을 갖고 있다."]],"w":"9번의 they(관광객에게 매력적인 선택지)와 10번의 They는 모두 워크 스코어가 높은 도시들이에요. 체계적인 도로 시스템을 갖는 것은 도시예요.","a":"3) 높은 워크 스코어를 가진 도시들","c":3},"h":"59c2eaae07"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The air is cleaner because people don’t need to drive everywhere.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사람들이 어느 곳에서나 운전할 필요가 없기 때문에 공기가 더 깨끗하다.","opts":["공기가 더 깨끗해서 사람들이 운전할 필요가 없다.","사람들이 어디서나 운전해야 하기 때문에 공기가 더 깨끗하다.","사람들이 운전을 하지 않아서 공기가 더 나빠진다.","사람들이 어디든 운전할 필요가 없어서 공기가 더 깨끗하다."],"r":{"ev":"7번 문장","s":[[7,"The air is cleaner because people don’t need to drive everywhere.","사람들이 어느 곳에서나 운전할 필요가 없기 때문에 공기가 더 깨끗하다."]],"w":"because 뒤가 이유예요. 사람들이 어디든 운전할 필요가 없어서 공기가 더 깨끗하다는 뜻이에요. 원인과 결과가 뒤바뀌지 않게 주의하세요.","a":"4) 사람들이 어디든 운전할 필요가 없어서 공기가 더 깨끗하다.","c":4},"h":"5e4f7ec78d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["관광객은 체계적인 도로 시스템이 있는 도시에서 도시의 문화를 더 쉽게 경험할 수 있다.","워크 스코어가 높은 도시는 오염이 더 많다.","장소들이 도보로 한 시간 이내에 있으면 가장 높은 워크 스코어를 얻는다.","워크 스코어가 높은 도시의 사람들은 어디든 운전해야 한다."],"opts":["Tourists can experience a city’s culture more easily where the street system is organized.","A city with a high walk score has more pollution.","A city gets the highest walk score if the places are within a one-hour walk.","People in cities with high walk scores need to drive everywhere."],"r":{"ev":"10~12번 문장","s":[[10,"They usually have organized street systems.","이 도시들은 대개 체계적인 도로 시스템을 갖고 있다."],[11,"These systems make it more convenient for tourists to walk around the cities.","이러한 시스템들은 관광객들이 도시를 돌아다니는 것을 더 편리하게 해 준다."],[12,"So they can experience the city’s culture more easily!","그래서 그들은 도시의 문화를 더 쉽게 경험할 수 있다!"]],"w":"10~12번에서 체계적인 도로 시스템 덕분에 관광객이 걷기 편해져 도시 문화를 더 쉽게 경험한다고 해요. 오염은 더 적고(6번), 최고 점수 조건은 도보 5분(4번)이며, 사람들은 운전할 필요가 없어요(7번).","a":"1) Tourists can experience a city’s culture more easily where the street system is organized.","c":1},"h":"481dc3912c"},{"n":9,"t":"sum","q":"Cities with high walk scores have (A) pollution because people drive less, and they also have (B) noise because there are fewer cars.","ko":"워크 스코어가 높은 도시는 사람들이 운전을 덜 해서 오염이 (A)하고, 차가 더 적어서 소음도 (B)하다.","oko":["(A) 더 많은 / (B) 더 많은","(A) 더 많은 / (B) 더 적은","(A) 더 적은 / (B) 더 많은","(A) 없는 / (B) 없는","(A) 더 적은 / (B) 더 적은"],"opts":["(A) more / (B) more","(A) more / (B) less","(A) less / (B) more","(A) no / (B) no","(A) less / (B) less"],"r":{"ev":"6~8번 문장","s":[[6,"First, there is less pollution in cities with high walk scores.","첫째로, 높은 워크 스코어를 갖춘 도시에는 오염이 덜하다."],[7,"The air is cleaner because people don’t need to drive everywhere.","사람들이 어느 곳에서나 운전할 필요가 없기 때문에 공기가 더 깨끗하다."],[8,"These cities also have less noise because there aren’t many cars on the road.","또한 이 도시들은 도로에 차가 많이 없기 때문에 소음도 더 적다."]],"w":"6번에서 오염이 덜하고(less pollution), 7번에서 운전할 필요가 없어서 공기가 더 깨끗해요. 8번에서 차가 적어서 소음도 더 적어요(less noise).","a":"5) (A) less / (B) less","c":5},"h":"cb9bedbf52"},{"n":10,"t":"fill","q":"The organized street systems make walking around the city more [A] for tourists, so they can [B] the city’s culture more easily.","ko":"체계적인 도로 시스템은 관광객이 도시를 돌아다니는 것을 더 [A]하게 해서, 그들은 도시의 문화를 더 쉽게 [B]할 수 있다.","bank":["convenient","experience","difficult","miss","expensive","pollute"],"bko":{"convenient":"편리한","experience":"경험하다","difficult":"어려운","miss":"놓치다","pollute":"오염시키다","expensive":"값비싼"},"r":{"ev":"11~12번 문장","s":[[11,"These systems make it more convenient for tourists to walk around the cities.","이러한 시스템들은 관광객들이 도시를 돌아다니는 것을 더 편리하게 해 준다."],[12,"So they can experience the city’s culture more easily!","그래서 그들은 도시의 문화를 더 쉽게 경험할 수 있다!"]],"w":"11번에서 more convenient(더 편리하게), 12번에서 experience the city’s culture(도시의 문화를 경험)라고 해요. difficult와 expensive는 편리하다는 말과 반대이고, miss는 문화를 '놓치다'라서 맞지 않아요.","a":"[A] convenient, [B] experience","c":null},"h":"3c8a7134e0"}]},{"u":4,"id":"nl1-04-1","no":1,"ko":"개미들의 대화","items":[{"n":1,"t":"tf","q":"Ants use smells to communicate with each other.","ko":"개미들은 서로 의사소통하려고 냄새를 사용한다.","r":{"ev":"5번 문장","s":[[5,"This is how ants communicate with each other.","이것이 개미들이 서로 의사소통하는 방법이다."]],"w":"5번 문장에서 This is how ants communicate with each other라고 해요. 그 방법이 냄새예요(1~4번).","a":"T (본문과 맞는 내용)","c":"T"},"h":"068a0ea917"},{"n":2,"t":"tf","q":"Most ants can use only two different smells.","ko":"대부분의 개미는 두 가지 서로 다른 냄새만 사용할 수 있다.","r":{"ev":"6번 문장","s":[[6,"Most ants can use up to 20 different smells to communicate.","대부분의 개미는 의사소통을 하는 데 20가지에 이르는 서로 다른 냄새를 사용할 수 있다."]],"w":"6번에서 대부분의 개미는 up to 20 different smells(20가지에 이르는 서로 다른 냄새)를 쓸 수 있다고 해요. 두 가지뿐이라는 말은 틀려요.","a":"F (본문과 다른 내용)","c":"F"},"h":"a4e6f3bff4"},{"n":3,"t":"tf","q":"Ants use their antennae to smell and understand a message.","ko":"개미들은 더듬이로 냄새를 맡고 메시지를 이해한다.","r":{"ev":"10번 문장","s":[[10,"When an ant makes smells, the other ants use their antennae to smell and understand the message.","한 개미가 냄새를 만들면, 다른 개미들은 냄새를 맡고 메시지의 내용을 이해하기 위해 그들의 더듬이를 사용한다."]],"w":"10번에서 다른 개미들이 their antennae로 냄새를 맡고 메시지를 이해한다고 해요.","a":"T (본문과 맞는 내용)","c":"T"},"h":"06dcf318ca"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined  다른 메시지를 만들 수 있다.","개미는 눈으로 메시지를 이해한다."],"opts":["Ants use only one smell to communicate.","Every smell has the same meaning.","Ants can make different messages by putting smells together.","Ants use their eyes to understand messages."],"r":{"ev":"8~9번 문장","s":[[8,"Each one has a different meaning.","각각의 냄새는 별개의 의미를 가진다."],[9,"When they put smells together, they can make different messages, like the way we make sentences.","그들이 냄새를 조합하면 우리가 문장을 만드는 방법과 같이 서로 다른 메시지를 만들 수 있다."]],"w":"9번에서 냄새를 조합하면 서로 다른 메시지를 만들 수 있다고 해요. 개미는 20가지에 이르는 냄새를 쓰고(6번), 각 냄새는 서로 다른 의미를 가지며(8번), 더듬이로 냄새를 맡아요(10번).","a":"3) Ants can make different messages by putting smells together.","c":3},"h":"cd714fc3ac"},{"n":9,"t":"sum","q":"An ant makes smells, and the other ants use their (A) to understand the message. Often, ants use smells to tell other ants where to find (B).","ko":"한 개미가 냄새를 만들면 다른 개미들은 메시지를 이해하려고 (A)를 사용한다. 흔히 개미들은 (B)을 어디에서 찾을지 알려 주려고 냄새를 쓴다.","oko":["(A) 다리 / (B) 음식","(A) 더듬이 / (B) 물","(A) 눈 / (B) 적","(A) 다리 / (B) 물","(A) 더듬이 / (B) 음식"],"opts":["(A) legs / (B) food","(A) antennae / (B) water","(A) eyes / (B) enemies","(A) legs / (B) water","(A) antennae / (B) food"],"r":{"ev":"10~11번 문장","s":[[10,"When an ant makes smells, the other ants use their antennae to smell and understand the message.","한 개미가 냄새를 만들면, 다른 개미들은 냄새를 맡고 메시지의 내용을 이해하기 위해 그들의 더듬이를 사용한다."],[11,"Often, ants use smells to tell other ants where to find food.","흔히, 개미들은 다른 개미들에게 어디에서 음식을 찾을 수 있는지 알려 주기 위해 냄새를 사용한다."]],"w":"10번에서 다른 개미들은 their antennae(더듬이)를 사용해요. 11번에서 개미들은 어디에서 음식(food)을 찾을 수 있는지 알려 주려고 냄새를 써요.","a":"5) (A) antennae / (B) food","c":5},"h":"5b57618e4b"},{"n":10,"t":"fill","q":"Most ants can use up to 20 different [A], and each one has a different [B].","ko":"대부분의 개미는 20가지에 이르는 서로 다른 [A]를 사용할 수 있고, 각각은 서로 다른 [B]를 가진다.","bank":["smells","meaning","sentences","antennae","food","legs"],"bko":{"smells":"냄새","meaning":"의미","sentences":"문장","antennae":"더듬이","food":"음식","legs":"다리"},"r":{"ev":"6번, 8번 문장",  않는다."]],"w":"10번에서 They never laugh라고 해요. 절대 웃지 않아서 아이들이 안심해요.","c":"F"},"h":"c30228fd59"},{"n":3,"t":"tf","q":"The girl in the story usually reads very well.","ko":"이야기 속 여자아이는 보통 책을 아주 잘 읽는다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"She usually has trouble reading.","그 아이는 평소 읽는 데 문제를 겪고 있다."]],"w":"2번에서 그 아이는 평소 읽는 데 문제(trouble)가 있다고 해요.","c":"F"},"h":"5d125c59ec"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (That’s why a dog is the perfect audience.)","ko":"이것이 개가 완벽한 청중인 이유이다.","opts":["선생님","청중","작가","경쟁자"],"word":"audience","r":{"a":"2) 청중","ev":"8번 문장","s":[[8,"That’s why a dog is the perfect audience.","이것이 개가 완벽한 청중인 이유이다."]],"w":"아이들이 책을 읽으면 개가 들어 줘요. 읽는 것을 듣는 쪽이 audience(청중)예요.","c":2},"h":"79d7857760"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Therapy dogs are specially trained to listen patiently while children read.)","ko":"치료견들은 아이들이 책을 읽는 동안 참을성 있게 듣도록 특별히 훈련 받는다.","opts":["서둘러서","시끄럽게","갑자기","참을성 있게"],"word":"patiently","r":{"a":"4) 참을성 있게","ev":"9~10번 문장","s":[[9,"Therapy dogs are specially trained to listen patiently while children read.","치료견들은 아이들이 책을 읽는 동안 참을성 있게 듣도록 특별히 훈련 받는다."],[10,"They never laugh.","그들은 절대 웃지 않는다."]],"w":"개는 아이가 책을 읽는 동안 끝까지 들어 주고, 절대 웃지 않아요(10번). patiently = 참을성 있게예요.","c":4},"h":"d346402622"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes the kids relax.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 그 아이들이 긴장을 풀게 해 준다.","opts":["개가 아이들에게 책을 읽어 주는 것","개가 절대 웃지 않는 것","아이들이 큰 소리로 책을 읽는 것","아이들이 비웃음을 당하는 것"],"r":{"a":"2) 개가 절대 웃지 않는 것","ev":"10~11번 문장","s":[[10,"They never laugh.","그들은 절대 웃지 않는다."],[11,"This makes the kids relax.","이것은 그 아이들이 긴장을 풀게 해 준다."]],"w":"바로 앞 10번에서 개가 절대 웃지 않는다고 했고, 그것 때문에 아이들이 긴장을 풀어요.","c":2},"h":"e4db34c0c4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They worry about being laughed at.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 비웃음을 당할까 봐 걱정한다.","opts":["그들은 다른 사람을 비웃는 것을 걱정한다.","그들은 너무 자주 웃는 것을 걱정한다.","그들은 다른 사람에게 비웃음을 당하는 것을 걱정한다.","그들은 웃음소리가 들리지 않는 것을 걱정한다."],"r":{"a":"3) 그들은 다른 사람에게 비웃음을 당하는 것을 걱정한다.","ev":"7번 문장","s":[[7,"They worry about being laughed at.","그들은 비웃음을 당할까 봐 걱정한다."]],"w":"being laughed at은 ‘비웃음을 당하는 것’(수동)이에요. 아이들이 남을 비웃는 게 아니라 비웃음을 당할까 봐 걱정해요.","c":3},"h":"01bdb90236"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아이들은 다른 사람 앞에서 읽을 때 마음이 편안하다.","개가 웃으면 아이들이 긴장을 풀 수 있다.","치료견은 아이들에게 책을 읽어 주도록 훈련 받는다.","이 독서 프로그램은 학습에 문제가 있는 아이들을 위한 것이다."],"opts":["Children feel relaxed when they read in front of others.","A dog’s laugh helps children relax.","Therapy dogs are trained to read books to children.","The reading program is for children with learning problems."],"r":{"a":"4) The reading program is for children with learning problems.","ev":"5~6번, 9~10번 문장","s":[[5,"This is a special kind of reading program for children with learning problems.","이것은 학습에 문제가 있는 아이들을 위한 특별한 유형의 독서 프로그램이다."],[6,"These children often feel nervous and upset when they have to read in front of others.","이 아이들은 다른 사람들 앞에서 책을 읽어야 할 때 종종 긴장하고 당황해한다."],[9,"Therapy dogs are specially trained to listen patiently while children read.","치료견들은 아이들이 책을 읽는 동안 참을성 있게 듣도록 특별히 훈련 받는다."],[10,"They never laugh.","그들은 절대 웃지 않는다."]],"w":"5번에 learning problems가 있는 아이들을 위한 독서 프로그램이라고 나와요. 아이들은 남들 앞에서 긴장하고(6번), 개는 웃지 않고(10번), 개는 읽어 주는 게 아니라 들어 줘요(9번).","c":4},"h":"94bcfc2039"},{"n":9,"t":"sum","q":"Therapy dogs listen to children (A), and they never (B). So the children relax and can read better.","ko":"치료견은 아이들의 말을 (A) 듣고, 절대 (B)하지 않는다. 그래서 아이들은 긴장을 풀고 더 잘 읽을 수 있다.","oko":["(A) 크게 / (B) 웃다","(A) 참을성 있게 / (B) 듣다","(A) 참을성 있게 / (B) 웃다","(A) 빠르게 / (B) 울다","(A) 화가 나서 / (B) 긴장을 풀다"],"opts":["(A) loudly / (B) laugh","(A) patiently / (B) listen","(A) patiently / (B) laugh","(A) quickly / (B) cry","(A) angrily / (B) relax"],"r":{"a":"3) (A) patiently / (B) laugh","ev":"9~10번, 12번 문장","s":[[9,"Therapy dogs are specially trained to listen patiently while children read.","치료견들은 아이들이 책을 읽는 동안 참을성 있게 듣도록 특별히 훈련 받는다."],[10,"They never laugh.","그들은 절대 웃지 않는다."],[12,"And when the kids relax, they can read better.","그리고 아이들이 긴장을 풀면, 그들은 책을 더 잘 읽을 수 있다."]],"w":"9번에서 개는 참을성 있게(patiently) 듣고, 10번에서 절대 웃지(laugh) 않아요. 그래서 아이들이 긴장을 풀고 더 잘 읽어요(12번).","c":3},"h":"92b7ea0853"},{"n":10,"t":"fill","q":"Children with learning problems feel [A] when they read in front of others because they worry about being [B] at.","ko":"학습에 문제가 있는 아이들은 다른 사람들 앞에서 읽을 때 [B] 당할까 봐 걱정되어 [A]해한다.","bank":["nervous","laughed","relaxed","trained","perfect","listened"],"bko":{"nervous":"긴장한","laughed":"웃음(비웃음)을 당한","relaxed":"긴장이 풀린","trained":"훈련 받은","perfect":"완벽한","listened":"들은"},"r":{"a":"[A] nervous, [B] laughed","ev":"6~7번 문장","s":[[6,"These children often feel nervous and upset when they have to read in front of others.","이 아이들은 다른 사람들 앞에서 책을 읽어야 할 때 종종 긴장하고 당황해한다."],[7,"They worry about being laughed at.","그들은 비웃음을 당할까 봐 걱정한다."]],"w":"6번 feel nervous and upset, 7번 worry about being laughed at에서 가져왔어요. relaxed(긴장이 풀린)는 개와 함께일 때의 모습(11번)이라 반대예요.","c":null},"h":"c982ba2e4e"}]},{"u":5,"id":"nl1-05-3","no":3,"ko":"밤에 먹는 것도 병이다","items":[{"n":1,"t":"tf","q":"At night, the body produces more melatonin and leptin.","ko":"밤에 신체는 멜라토닌과 렙틴을 더 많이 생산한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"At night, the body produces more of two hormones, melatonin and leptin.","밤에 신체는 멜라토닌과 렙틴이라는 두 가지 호르몬을 더 많이 생산한다."]],"w":"7번에 At night, the body produces more of two hormones, melatonin and leptin이 나와요.","c":"T"},"h":"006189dc1a"},{"n":2,"t":"tf","q":"Doctors know exactly why people get night eating syndrome.","ko":"의사들은 사람들이 야식증후군에 걸리는 이유를 정확히 알고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Doctors aren’t sure why this happens, but NES is more common when people are stressed.","의사들은 왜 이런 일이 일어나는지 확신하지 못하지만, 야식증후군은 사람들이 스트레스를 받을 때 더 흔하다."]],"w":"11번에서 의사들도 왜 이런 일이 일어나는지 확신하지 못한다(aren’t sure)고 해요.","c":"F"},"h":"5fe57cbaa5"},{"n":3,"t":"tf","q":"Keeping a journal about what you eat and how you feel can help reduce night eating.","ko":"먹는 것과 기분에 대해 일기를 쓰면 야식을 줄이는 데 도움이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"15~16번 문장","s":[[15,"Also, keep a journal about what you eat and how you feel.","또한 당신이 무엇을 먹는지와 당신의 기분이 어떤지에 대해 일기를 써라."],[16,"This will help reduce your night eating.","이것이 당신의 야식을 줄이도록 도와줄 것이다."]],"w":"15번에서 일기를 쓰라고 하고, 16번에서 이것이 야식을 줄이는 데 도움이 된다고 해요.","c":"T"},"h":"6df403b267"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (I frequently eat late at night and regret it.)","ko":"나는 자주 밤늦게 먹고 그것을 후회한다.","opts":["자랑한다","기대한다","후회한다","즐긴다"],"word":"regret","r":{"a":"3) 후회한다","ev":"3번 문장","s":[[3,"I frequently eat late at night and regret it.","나는 자주 밤늦게 먹고 그것을 후회한다."]],"w":"밤늦게 먹고 나서 드는 마음이에요. 체크 문장들은 모두 야식증후군의 좋지 않은 모습이라 regret = 후회하다예요.","c":3},"h":"7df6fae353"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (I usually skip breakfast and don’t feel hungry until late afternoon.)","ko":"나는 대개 아침 식사를 거르고 오후 늦게까지 배고픔을 느끼지 않는다.","opts":["준비한다","거른다","남긴다","데운다"],"word":"skip","r":{"a":"2) 거른다","ev":"5번 문장","s":[[5,"I usually skip breakfast and don’t feel hungry until late afternoon.","나는 대개 아침 식사를 거르고 오후 늦게까지 배고픔을 느끼지 않는다."]],"w":"아침을 skip하고 오후 늦게까지 배고프지 않다고 했으니, 아침을 먹지 않는다는 뜻이에요. skip = (일을) 거르다예요.","c":2},"h":"2eb48ce903"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis will help you control the desire for food.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 당신이 음식에 대한 욕구를 조절하도록 도울 것이다.","opts":["야식증후군을 겪는 것","일기를 쓰는 것","음식에 대한 욕구","밤에 운동하는 것"],"r":{"a":"4) 밤에 운동하는 것","ev":"13~14번 문장","s":[[13,"First, exercise at night.","우선, 밤에 운동해라."],[14,"This will help you control the desire for food.","이것은 당신이 음식에 대한 욕구를 조절하도록 도울 것이다."]],"w":"13번 First, exercise at night. 바로 뒤라서 This는 밤에 운동하는 것이에요. 일기는 15번에서 Also로 따로 나와요.","c":4},"h":"d872544253"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But people with NES don’t experience the increase in these hormones.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 야식증후군을 앓는 사람들은 이러한 호르몬의 증가를 겪지 않는다.","opts":["야식증후군을 앓는 사람들은 이 호르몬의 증가를 겪지 않는다.","야식증후군을 앓는 사람들은 이 호르몬이 지나치게 늘어난다.","야식증후군을 앓는 사람들에게는 호르몬이 필요하지 않다.","야식증후군은 호르몬과 전혀 관계가 없다."],"r":{"a":"1) 야식증후군을 앓는 사람들은 이 호르몬의 증가를 겪지 않는다.","ev":"7번, 9~10번 문장","s":[[7,"At night, the body produces more of two hormones, melatonin and leptin.","밤에 신체는 멜라토닌과 렙틴이라는 두 가지 호르몬을 더 많이 생산한다."],[9,"But people with NES don’t experience the increase in these hormones.","그러나 야식증후군을 앓는 사람들은 이러한 호르몬의 증가를 겪지 않는다."],[10,"So, they feel hungry and can’t sleep.","따라서 그들은 배고픔을 느끼고 잠을 잘 수 없다."]],"w":"don’t experience the increase는 ‘증가를 겪지 않는다’예요. 호르몬이 늘지 않아서 10번처럼 배고프고 잠을 못 자요.","c":1},"h":"f69e4d56dd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["렙틴은 우리가 잠들게 도와준다.","야식증후군은 행복할 때 더 흔하다.","야식증후군은 사람들이 스트레스를 받을 때 더 흔하다.","야식증후군이 있는 사람이 할 수 있는 일은 없다."],"opts":["Leptin helps us fall asleep.","NES is more common when people feel happy.","NES is more common when people are stressed.","There is nothing people with NES can do to stop it."],"r":{"a":"3) NES is more common when people are stressed.","ev":"8번, 11~12번 문장","s":[[8,"Melatonin helps us fall asleep, and leptin makes us less hungry.","멜라토닌은 우리가 잠들게 도와주고 렙틴은 우리가 덜 배고프게 한다."],[11,"Doctors aren’t sure why this happens, but NES is more common when people are stressed.","의사들은 왜 이런 일이 일어나는지 확신하지 못하지만, 야식증후군은 사람들이 스트레스를 받을 때 더 흔하다."],[12,"If you experience NES, there are some things you can do to stop it.","만약 당신이 야식증후군을 겪는다면, 그것을 멈추기 위해 당신이 할 수 있는 몇 가지 일이 있다."]],"w":"11번에 NES is more common when people are stressed가 있어요. 잠들게 돕는 것은 렙틴이 아니라 멜라토닌(8번)이고, 멈추는 방법은 운동과 일기(12~15번)가 있어요.","c":3},"h":"2fd82f014f"},{"n":9,"t":"sum","q":"People with NES don’t have the (A) in two hormones at night, so they feel (B) and can’t sleep.","ko":"야식증후군을 앓는 사람들은 밤에 두 호르몬의 (A)를 겪지 않아서, (B)하고 잠을 잘 수 없다.","oko":["(A) 감소 / (B) 배부르다","(A) 증가 / (B) 배부르다","(A) 감소 / (B) 배고프다","(A) 증가 / (B) 졸리다","(A) 증가 / (B) 배고프다"],"opts":["(A) decrease / (B) full","(A) increase / (B) full","(A) decrease / (B) hungry","(A) increase / (B) sleepy","(A) increase / (B) hungry"],"r":{"a":"5) (A) increase / (B) hungry","ev":"7번, 9~10번 문장","s":[[7,"At night, the body produces more of two hormones, melatonin and leptin.","밤에 신체는 멜라토닌과 렙틴이라는 두 가지 호르몬을 더 많이 생산한다."],[9,"But people with NES don’t experience the increase in these hormones.","그러나 야식증후군을 앓는 사람들은 이러한 호르몬의 증가를 겪지 않는다."],[10,"So, they feel hungry and can’t sleep.","따라서 그들은 배고픔을 느끼고 잠을 잘 수 없다."]],"w":"7번에서 밤에는 두 호르몬이 더 많아지는데, 9번에서 야식증후군은 그 증가(increase)가 없고, 10번에서 그래서 배고프고(hungry) 잠을 못 자요.","c":5},"h":"61d31e976d"},{"n":10,"t":"fill","q":"To reduce night eating, you can [A] at night and keep a [B] about what you eat and how you feel.","ko":"야식을 줄이기 위해 밤에 [A]할 수 있고, 먹는 것과 기분에 대한 [B]를 쓸 수 있다.","bank":["exercise","journal","hormone","breakfast","regret","desire"],"bko":{"exercise":"운동하다","journal":"일기","hormone":"호르몬","breakfast":"아침 식사","desire":"욕구","regret":"후회하다"},"r":{"a":"[A] exercise, [B] journal","ev":"13번, 15번 문장","s":[[13,"First, exercise at night.","우선, 밤에 운동해라."],[15,"Also, keep a journal about what you eat and how you feel.","또한 당신이 무엇을 먹는지와 당신의 기분이 어떤지에 대해 일기를 써라."]],"w":"13번 exercise at night, 15번 keep a journal에서 가져왔어요. desire(욕구)는 14번에서 운동이 조절하도록 돕는 대상이라 방법이 아니고, regret(후회하다)은 문장에 맞지 않아요.","c":null},"h":"fef6b91d5d"}]},{"u":5,"id":"nl1-05-4","no":4,"ko":"초록색을 좋아하나요?","items":[{"n":1,"t":"tf","q":"Scheele’s green was created by a Swedish chemist in 1775.","ko":"Scheele’s green은 1775년에 스웨덴의 한 화학자에 의해 만들어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Scheele’s green was created by a Swedish chemist in 1775.","Scheele’s green(셸레 그린)은 1775년에 스웨덴의 한 화학자에 의해 만들어졌다."]],"w":"5번에 Scheele’s green was created by a Swedish chemist in 1775가 그대로 나와요.","c":"T"},"h":"a45606a22b"},{"n":2,"t":"tf","q":"Scheele’s green was used only in children’s toys.","ko":"Scheele’s green은 어린이 장난감에만 사용되었다.","r":{"a":"F (본문과 다른 내용)","
