금은 Congham 마을 교회를 지원하는 데 사용될 것이며, 이로써 이 행사는 좋은 목적을 위한 재미있는 행사가 됩니다."]],"w":"cause는 '원인'으로 많이 쓰이지만 여기서는 good cause = 좋은 목적(대의). 모금 이야기가 앞에 나오는 문맥.","c":3}},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nThe winner of the race will receive a fresh bunch of Romaine lettuce, while its proud coach will take home a special trophy cup.","ko":"밑줄 친 its가 가리키는 것은?","opts":["Romaine 상추","경주의 우승자(달팽이)","트로피 컵","달팽이 대여"],"r":{"a":"2) 경주의 우승자(달팽이)","ev":"9번 문장","s":[[9,"The winner of the race will receive a fresh bunch of Romaine lettuce, while its proud coach will take home a special trophy cup.","경주 우승자는 신선한 로메인 상추 한 다발을 받게 되고, 그 달팽이의 뿌듯한 코치는 특별한 트로피 컵을 집으로 가져가게 됩니다."]],"w":"its proud coach = 우승한 달팽이의 자랑스러운 코치. 상추는 우승자가 받고, 트로피 컵은 코치가 받음.","c":2,"k":"its = 경주의 우승자(달팽이)"},"sko":"경주 우승자는 신선한 로메인 상추 한 다발을 받게 되고, 그것의 뿌듯한 코치는 특별한 트로피 컵을 집으로 가져가게 됩니다.","pron":"its","h":"1ae73c6c00"},{"n":7,"t":"sense","q":"Which is closest in meaning to sentence 12, 'It's time to find out if your snail has what it takes to be the next champion'?","h":"140a97d73a","ko":"12번 문장 '여러분의 달팽이가 다음 챔피언이 될 자질이 있는지 알아볼 시간이다'와 가장 가까운 의미는?","sko":"이제 여러분의 달팽이가 다음 챔피언이 되기 위해 필요한 것을 가지고 있는지 알아볼 시간입니다.","opts":["달팽이를 팔기 시작할 시간이다.","대회가 이미 끝났다.","달팽이에게 먹이를 줄 시간이다.","내 달팽이가 챔피언이 될 만한지 확인할 때이다."],"r":{"a":"4) 내 달팽이가 챔피언이 될 만한지 확인할 때이다.","ev":"12번 문장","s":[[12,"It’s time to find out if your snail has what it takes to be the next champion.","이제 여러분의 달팽이가 다음 챔피언이 되기 위해 필요한 것을 가지고 있는지 알아볼 시간입니다."]],"w":"what it takes는 '필요한 것(자질)'. find out if는 ~인지 알아보다. 챔피언이 될 자질을 확인한다는 뜻.","c":4}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"d37ac992e3","ko":"본문과 일치하는 것은?","oko":["그 선수권 대회는 60년 넘게 이어져 온 전통이다.","그 행사는 Congham의 달팽이 농장에서 열린다.","우승한 달팽이는 트로피 컵을 받는다.","달팽이가 없는 사람은 경주에 참가할 수 없다."],"opts":["The championship has been a tradition for over 60 years.","The event is held at a snail farm in Congham.","The winning snail receives a trophy cup.","People who have no snail cannot join the race."],"r":{"a":"1) The championship has been a tradition for over 60 years.","ev":"3번, 8번, 9번, 4번 문장","s":[[3,"This Saturday, we’re hosting our annual snail racing event at Grimston Cricket Club, located in Congham, U.K.","이번 토요일, 저희는 영국 Congham에 위치한 Grimston Cricket Club에서 연례 달팽이 경주 행사를 개최할 것입니다."],[4,"Our championship has been a beloved tradition for over 60 years, featuring snails racing across a 34-centimeter course.","저희 대회는 60년 넘게 이어져 온 사랑받는 전통이며, 34센티미터 코스를 달리는 달팽이들을 특색으로 합니다."],[8,"We offer a “snail rental” where you can rent your very own racer.","저희는 여러분이 자신만의 경주용 달팽이를 대여할 수 있는 ‘달팽이 대여’를 제공합니다."],[9,"The winner of the race will receive a fresh bunch of Romaine lettuce, while its proud coach will take home a special trophy cup.","경주 우승자는 신선한 로메인 상추 한 다발을 받게 되고, 그 달팽이의 뿌듯한 코치는 특별한 트로피 컵을 집으로 가져가게 됩니다."]],"w":"4번에서 over 60 years 전통. ②는 Grimston Cricket Club, ③ 트로피는 코치, ④는 snail rental로 참가 가능.","c":1}},{"n":9,"t":"sum","q":"The World Snail Racing Championships is a (A) event, and people can (B) a snail to race there.","ko":"세계 달팽이 경주 대회는 (A) 행사이며, 사람들은 그곳에서 경주할 달팽이를 (B)할 수 있다.","opts":["(A) boring / (B) rent","(A) unique / (B) rent","(A) unique / (B) buy","(A) private / (B) sell","(A) expensive / (B) borrow"],"r":{"a":"2) (A) unique / (B) rent ((A) 독특한 / (B) 대여하다)","ev":"2번, 8번 문장","s":[[2,"If you enjoy unique and fun competitions, this event is for you.","여러분이 독특하고 재미있는 대회를 즐긴다면, 이 행사는 여러분을 위한 것입니다."],[8,"We offer a “snail rental” where you can rent your very own racer.","저희는 여러분이 자신만의 경주용 달팽이를 대여할 수 있는 ‘달팽이 대여’를 제공합니다."]],"w":"2번에서 unique and fun competitions, 8번에서 snail rental로 경주용 달팽이를 대여(rent)할 수 있다고 함.","c":2,"k":null},"oko":["(A) 지루한 / (B) 대여하다","(A) 독특한 / (B) 대여하다","(A) 독특한 / (B) 사다","(A) 비공개의 / (B) 팔다","(A) 비싼 / (B) 빌리다"],"h":"ac7e9b4b21"},{"n":10,"t":"fill","q":"Join us for an [A] day filled with [B], community spirit, and exciting snail action.","ko":"[B], 공동체 정신, 그리고 흥미진진한 달팽이의 움직임으로 가득한 [A] 하루에 함께해 주세요.","bko":{"unforgettable":"잊지 못할","laughter":"웃음","lettuce":"상추","course":"코스","church":"교회","coach":"코치"},"bank":["unforgettable","laughter","lettuce","course","church","coach"],"r":{"a":"[A] unforgettable (잊지 못할), [B] laughter (웃음)","ev":"11번 문장","s":[[11,"Join us for an unforgettable day filled with laughter, community spirit, and exciting snail action.","웃음, 공동체 정신, 그리고 흥미진진한 달팽이의 움직임으로 가득한 잊지 못할 하루에 함께해 주세요."]],"w":"11번 문장에서 an unforgettable day filled with laughter, community spirit, ...라고 함.","c":null,"k":null},"h":"69ba0e79bf"}]},{"u":8,"id":"r22","no":22,"ko":"작지만 강한 유럽의 녹색 도시","items":[{"n":1,"t":"tf","q":"Växjö pledged to end its use of fossil fuels in 1996.","h":"3412336177","ko":"Växjö는 1996년에 화석 연료 사용을 끝내겠다고 약속했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Växjö, a small but ambitious city in southern Sweden, pledged to make this a reality in 1996.","스웨덴 남부의 작지만 야심 찬 도시인 Växjö는 1996년에 이를 현실로 만들기로 약속했다."]],"w":"2번 문장에 pledged ... in 1996 (1996년에 약속)이 나옴. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Växjö has already completely eliminated fossil fuels.","h":"f97c5a3c46","ko":"Växjö는 이미 화석 연료를 완전히 없앴다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"While Växjö hasn’t completely eliminated fossil fuels yet, it has already cut its carbon emissions by 70% since the 1990s.","Växjö는 아직 화석 연료를 완전히 제거하지는 않았지만, 1990년대 이후로 이미 탄소 배출량을 70퍼센트 줄였다."]],"w":"9번 문장에 hasn't completely eliminated fossil fuels yet (아직 완전히 없애지 못함). 아직 완전 제거 전이므로 불일치.","c":"F"}},{"n":3,"t":"tf","q":"Växjö's economy grew while its carbon emissions went down.","h":"8ed2ecf897","ko":"Växjö의 경제는 성장했고 그동안 탄소 배출량은 줄었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9~10번 문장","s":[[9,"While Växjö hasn’t completely eliminated fossil fuels yet, it has already cut its carbon emissions by 70% since the 1990s.","Växjö는 아직 화석 연료를 완전히 제거하지는 않았지만, 1990년대 이후로 이미 탄소 배출량을 70퍼센트 줄였다."],[10,"What’s even more impressive is that this progress was achieved while the city’s population grew and its economy doubled.","더욱 인상적인 것은 이러한 진전이 도시의 인구가 증가하고 경제가 두 배로 성장하는 동안 이루어졌다는 점이다."]],"w":"탄소 배출 70% 감축(9번)과 경제가 두 배로 성장(10번)이 함께 제시됨. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (While Växjö hasn’t completely eliminated fossil fuels yet, it has already cut its carbon emissions by 70% since the 1990s.)","h":"bfe20d2646","ko":"밑줄 친 eliminated의 뜻","opts":["늘렸다","측정했다","제거했다","발견했다"],"word":"eliminated","r":{"a":"3) 제거했다","ev":"9번 문장","s":[[9,"While Växjö hasn’t completely eliminated fossil fuels yet, it has already cut its carbon emissions by 70% since the 1990s.","Växjö는 아직 화석 연료를 완전히 제거하지는 않았지만, 1990년대 이후로 이미 탄소 배출량을 70퍼센트 줄였다."]],"w":"eliminate는 '제거하다, 없애다'. 화석 연료를 완전히 없애지는 못했다는 문맥. 오답: increase 늘리다, measure 측정하다, discover 발견하다.","c":3}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (Furthermore, local buses and city vehicles run on fuel made from household waste, such as food scraps and gardening waste.)","h":"6bc96a5c8b","ko":"밑줄 친 run의 문맥상 뜻 (다의어: 달리다 / 운영하다 / ~로 작동하다)","opts":["출마하다","흐르다","운영하다","작동하다"],"word":"run","r":{"a":"4) 작동하다","ev":"14번 문장","s":[[14,"Furthermore, local buses and city vehicles run on fuel made from household waste, such as food scraps and gardening waste.","또한, 지역 버스와 시내 차량은 음식물 찌꺼기와 정원 폐기물 같은 가정 폐기물로 만든 연료로 작동한다."]],"w":"'run on + 연료'는 '~로 작동하다, ~를 연료로 달리다'. 버스와 시 차량이 폐기물 연료로 움직인다는 뜻. '달리다'만 알면 틀리기 쉬운 다의어.","c":4}},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nHalf of all new buildings in the city are constructed from timber, which traps carbon and helps combat climate change.","ko":"밑줄 친 which이 가리키는 것은?","opts":["목재","탄소","기후 변화","신축 건물"],"r":{"a":"1) 목재","ev":"6번 문장","s":[[6,"Half of all new buildings in the city are constructed from timber, which traps carbon and helps combat climate change.","도시의 모든 신축 건물의 절반은 목재로 지어지는데, 그것은 탄소를 가두고 기후 변화를 막는 데 도움이 된다."]],"w":"which 앞에 콤마가 있고 바로 앞의 timber(목재)를 설명함. 목재가 탄소를 가둠.","c":1,"k":"which = 목재(timber)"},"sko":"도시의 모든 신축 건물의 절반은 목재로 지어지는데, 그것은 탄소를 가두고 기후 변화를 막는 데 도움이 된다.","pron":"which","h":"8fbbd20fcc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A key part of its success was turning waste into energy.\"","ko":"위 문장의 의미로 알맞은 것은?","opts":["폐기물을 에너지로 바꾼 것이 성공의 핵심 요소였다는 의미","성공한 뒤에야 폐기물을 에너지로 바꾸기 시작했다는 의미","에너지를 쓰지 않은 것이 성공의 핵심 요소였다는 의미","폐기물을 줄이지 못한 것이 성공의 이유였다는 의미"],"r":{"a":"1) 폐기물을 에너지로 바꾼 것이 성공의 핵심 요소였다는 의미","ev":"12번 문장","s":[[12,"A key part of its success was turning waste into energy.","그것의 성공 핵심 요소는 폐기물을 에너지로 전환한 것이었다."]],"w":"12번은 A key part of its success was turning waste into energy. 성공의 핵심 요소가 폐기물을 에너지로 바꾼 것이라는 뜻.","c":1,"k":null},"h":"3b80ffe3c5"},{"n":8,"t":"match","q":"Which is true about the passage?","h":"8177e87fd9","ko":"본문과 일치하는 것","oko":["Växjö의 목조 구조물은 주택에만 사용된다.","Växjö 전기의 90퍼센트 이상이 바이오 연료에서 나온다.","지역 버스와 시내 차량은 가정 폐기물로 만든 연료를 사용한다.","Växjö의 경제가 두 배로 성장하는 동안 인구는 감소했다."],"opts":["Wooden structures in Växjö are used only for homes.","More than 90% of Växjö's electricity comes from biofuels.","Local buses and city vehicles use fuel made from household waste.","Växjö's population has fallen as its economy has doubled."],"r":{"a":"3) Local buses and city vehicles use fuel made from household waste.","ev":"7번, 10번, 13~14번 문장","s":[[7,"Homes, schools, and even sports centers are built using wooden structures.","주택, 학교, 심지어 스포츠 센터도 목조 구조물을 사용하여 지어진다."],[10,"What’s even more impressive is that this progress was achieved while the city’s population grew and its economy doubled.","더욱 인상적인 것은 이러한 진전이 도시의 인구가 증가하고 경제가 두 배로 성장하는 동안 이루어졌다는 점이다."],[13,"Over 90% of Växjö’s heating and about 50% of its electricity come from biofuels made from leftover wood materials.","Växjö의 난방의 90퍼센트 이상과 전기의 약 50퍼센트는 남은 목재 재료로 만든 바이오 연료에서 나온다."],[14,"Furthermore, local buses and city vehicles run on fuel made from household waste, such as food scraps and gardening waste.","또한, 지역 버스와 시내 차량은 음식물 찌꺼기와 정원 폐기물 같은 가정 폐기물로 만든 연료로 작동한다."]],"w":"14번 문장: 시 버스와 차량이 가정 쓰레기 연료로 달림(일치). 오답: 7번 homes, schools, sports centers 모두 목조(homes만 아님). 13번 90%는 난방, 전기는 약 50%. 10번 인구는 늘었음.","c":3}},{"n":9,"t":"sum","q":"Växjö is one of the (A) cities on Earth, and it is leading the way in (B) construction.","ko":"Växjö는 지구상에서 가장 (A) 도시 중 하나이며, (B) 건축을 선도하고 있다.","opts":["(A) dirtiest / (B) sustainable","(A) greenest / (B) sustainable","(A) greenest / (B) temporary","(A) busiest / (B) traditional","(A) oldest / (B) sustainable"],"r":{"a":"2) (A) greenest / (B) sustainable ((A) 가장 친환경적인 / (B) 지속 가능한)","ev":"3번, 5번 문장","s":[[3,"Now, it’s one of the greenest cities on Earth.","현재, 그곳은 지구상에서 가장 친환경적인 도시 중 하나이다."],[5,"Beyond its energy solutions, Växjö is leading the way in sustainable construction.","그것의 에너지 해결책 외에도, Växjö는 지속 가능한 건축 분야에서도 길을 선도하고 있다."]],"w":"3번에서 one of the greenest cities on Earth, 5번에서 leading the way in sustainable construction이라고 함.","c":2,"k":null},"oko":["(A) 가장 더러운 / (B) 지속 가능한","(A) 가장 친환경적인 / (B) 지속 가능한","(A) 가장 친환경적인 / (B) 임시의","(A) 가장 바쁜 / (B) 전통적인","(A) 가장 오래된 / (B) 지속 가능한"],"h":"e8d8d414af"},{"n":10,"t":"fill","q":"[A] from around the world visit Växjö to study its [B] approach to timber-based construction.","ko":"전 세계의 [A]이(가) 목재 기반 건설에 대한 [B] 건축 방식을 연구하기 위해 Växjö를 방문한다.","bko":{"architects":"건축가들","pioneering":"선구적인","buses":"버스들","emissions":"배출량","doubled":"두 배가 되었다","grew":"성장했다"},"bank":["architects","pioneering","buses","emissions","doubled","grew"],"r":{"a":"[A] architects (건축가들), [B] pioneering (선구적인)","ev":"8번 문장","s":[[8,"Architects from around the world visit Växjö to study its pioneering approach to timber-based construction.","전 세계의 건축가들은 목재 기반 건설에 대한 그것의 선구적인 건축 방식을 연구하기 위해 Växjö를 방문한다."]],"w":"8번에서 Architects ... visit Växjö to study its pioneering approach라고 함.","c":null,"k":null},"h":"9f9295ac84"}]},{"u":8,"id":"r23","no":23,"ko":"진실보다 중요한 ‘눈치’?","items":[{"n":1,"t":"tf","q":"The real participants answered first in Asch's experiment.","h":"f3856bbb0e","ko":"Asch의 실험에서 진짜 참가자들이 먼저 대답했다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"The confederates answered first, intentionally giving incorrect answers.","그 공모자들은 의도적으로 잘못된 답변을 하며 먼저 대답했다."],[8,"The real participants were always required to answer last.","진짜 참가자들은 항상 마지막에 대답하도록 요구되었다."]],"w":"7번: 공모자(confederates)가 먼저 답함. 8번: 진짜 참가자는 항상 마지막에 답하도록 요구됨. 순서가 반대.","c":"F"}},{"n":2,"t":"tf","q":"Only one person in each group was a real participant.","h":"464ef6f98d","ko":"각 집단에서 진짜 참가자는 한 명뿐이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, only one in each group was a real participant — the rest were confederates secretly working with Asch.","그러나, 각 집단에서 오직 한 명만이 진짜였고, 나머지 사람들은 모두 Asch와 비밀리에 협력하는 공모자들이었다."]],"w":"3번 문장 only one in each group was a real participant. 나머지는 공모자. 일치.","c":"T"}},{"n":3,"t":"tf","q":"About one-third of the real participants gave the same wrong answers as the confederates.","h":"fb4fb10570","ko":"진짜 참가자의 약 3분의 1이 공모자와 같은 오답을 말했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"In the end, about one-third of the real participants chose the same incorrect answers as the confederates in the groups.","결과적으로, 진짜 참가자의 약 3분의 1은 그 집단에 있는 공모자들과 같은 틀린 답을 선택했다."]],"w":"10번 문장 about one-third ... chose the same incorrect answers. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They had to identify which line on the second card matched the length of the first.)","h":"3f1b5f579b","ko":"밑줄 친 identify의 뜻","opts":["숨기다","반복하다","포기하다","식별하다, 알아내다"],"word":"identify","r":{"a":"4) 식별하다, 알아내다","ev":"6번 문장","s":[[6,"They had to identify which line on the second card matched the length of the first.","그들은 두 번째 카드의 어느 선이 첫 번째 것의 길이와 일치하는지 식별해야 했다."]],"w":"identify는 '식별하다, 알아보다'. 어느 선이 첫 번째 카드의 선과 길이가 같은지 알아내는 상황.","c":4}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (In interviews that followed, some explained that they doubted their judgment when their answers differed from the majority.)","h":"c18d2c527b","ko":"밑줄 친 followed의 문맥상 뜻 (follow: 따르다 / 뒤따르다)","opts":["(의견을) 따랐던","뒤를 쫓아갔던","그 뒤에 이어진","이해했던"],"word":"followed","r":{"a":"3) 그 뒤에 이어진","ev":"11번 문장","s":[[11,"In interviews that followed, some explained that they doubted their judgment when their answers differed from the majority.","이후 이어진 면담에서, 진짜 참가자들 중 몇몇은 자신의 답변이 다수와 달랐을 때 자신의 판단력을 의심했다고 설명했다."]],"w":"interviews that followed는 '뒤이어 진행된 인터뷰'. 9번 문장의 follow(따르다)와 뜻이 다른 다의어.","c":3}},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nAsch wanted to observe whether the participants would follow the confederates’ incorrect answers or trust their own judgment.","ko":"밑줄 친 their가 가리키는 것은?","opts":["공모자들","진짜 참가자들","Asch","면담 진행자들"],"r":{"a":"2) 진짜 참가자들","ev":"9번 문장","s":[[9,"Asch wanted to observe whether the participants would follow the confederates’ incorrect answers or trust their own judgment.","Asch는 그 참가자들이 공모자들의 틀린 답을 따를지 아니면 자신의 판단을 믿을지를 관찰하고자 했다."]],"w":"9번에서 the participants would follow ... or trust their own judgment라고 했으므로 their는 앞의 주어 the participants.","c":2,"k":"their = 진짜 참가자들"},"sko":"Asch는 그 참가자들이 공모자들의 틀린 답을 따를지 아니면 자신의 판단을 믿을지를 관찰하고자 했다.","pron":"their","h":"ddc2d284d5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Others admitted that, although they knew the correct answer, they went along with the group to avoid standing out.\"","ko":"위 문장의 의미로 알맞은 것은?","opts":["정답을 알면서도 눈에 띄지 않으려고 다수의 의견을 따랐다는 의미","정답을 몰라서 다수의 의견을 따랐다는 의미","정답을 알았기 때문에 끝까지 자기 답을 고수했다는 의미","다수가 틀리기를 바라며 일부러 틀린 답을 말했다는 의미"],"r":{"a":"1) 정답을 알면서도 눈에 띄지 않으려고 다수의 의견을 따랐다는 의미","ev":"12번 문장","s":[[12,"Others admitted that, although they knew the correct answer, they went along with the group to avoid standing out.","다른 참가자들은 그들이 정답을 알았음에도 불구하고, 눈에 띄는 것을 피하기 위해 그 집단의 의견에 따랐다고 털어놓았다."]],"w":"12번: they knew the correct answer 이지만 went along with the group to avoid standing out. 알면서도 눈에 띄지 않으려고 따랐다는 뜻.","c":1,"k":null},"h":"e23a5f35ee"},{"n":8,"t":"match","q":"Which is true about the passage?","h":"bec096ee67","ko":"본문과 일치하는 것","oko":["첫 번째 카드에는 A, B, C로 표시된 세 개의 선이 있었다.","공모자들은 정직한 실수를 한 실제 학생들이었다.","진짜 참가자 모두가 공모자들을 따랐다.","일부 참가자들은 다수와 의견이 다를 때 자신의 판단을 의심했다."],"opts":["The first card showed three lines labeled A, B, and C.","The confederates were real students who made honest mistakes.","All of the real participants followed the confederates.","Some participants doubted their own judgment when they disagreed with the majority."],"r":{"a":"4) Some participants doubted their own judgment when they disagreed with the majority.","ev":"5번, 7번, 10~11번 문장","s":[[5,"The first card showed a single vertical line, while the other card showed three vertical lines of different lengths labeled “A,” “B,” and “C.”","첫 번째 카드에는 하나의 수직선이 있었고, 반면에 다른 카드에는 ‘A’, ‘B’, ‘C’로 표시된 서로 다른 길이의 세 개의 수직선이 있었다."],[7,"The confederates answered first, intentionally giving incorrect answers.","그 공모자들은 의도적으로 잘못된 답변을 하며 먼저 대답했다."],[10,"In the end, about one-third of the real participants chose the same incorrect answers as the confederates in the groups.","결과적으로, 진짜 참가자의 약 3분의 1은 그 집단에 있는 공모자들과 같은 틀린 답을 선택했다."],[11,"In interviews that followed, some explained that they doubted their judgment when their answers differed from the majority.","이후 이어진 면담에서, 진짜 참가자들 중 몇몇은 자신의 답변이 다수와 달랐을 때 자신의 판단력을 의심했다고 설명했다."]],"w":"11번: 다수와 답이 다르면 자신의 판단을 의심한 사람이 있음(일치). 5번: 첫 카드는 선 한 개. 7번: 공모자는 일부러 오답. 10번: 약 3분의 1만 따름.","c":4}},{"n":9,"t":"sum","q":"Strong group influence can make people (A) their own decisions and even (B) with something they recognize as wrong.","ko":"강한 집단의 영향은 사람들이 자신의 결정을 (A)하게 하고 심지어 자신이 틀리다고 인식하는 것에 (B)하게 만들 수 있다.","opts":["(A) trust / (B) agree","(A) question / (B) argue","(A) trust / (B) argue","(A) question / (B) agree","(A) protect / (B) disagree"],"r":{"a":"4) (A) question / (B) agree ((A) 의심 / (B) 동의)","ev":"14번 문장","s":[[14,"It can make people question their own decisions and even agree with something they recognize as wrong.","그것은 사람들이 자신의 결정에 의심을 갖게 하고 심지어 자신이 틀리다고 인식하는 것에도 동의하도록 만들 수 있다."]],"w":"14번에서 It can make people question their own decisions and even agree with something they recognize as wrong이라고 함.","c":4,"k":null},"oko":["(A) 신뢰 / (B) 동의","(A) 의심 / (B) 반박","(A) 신뢰 / (B) 반박","(A) 의심 / (B) 동의","(A) 보호 / (B) 반대"],"h":"e02fc390f3"},{"n":10,"t":"fill","q":"He [A] groups of [B] students to participate in the experiment.","ko":"그는 [B] 학생들로 이루어진 여러 집단에게 실험에 참여해 달라고 [A].","bko":{"invited":"요청했다(invite의 과거형)","university":"대학","lengths":"길이들","vertical":"수직의","majority":"다수","lines":"선들"},"bank":["invited","university","lengths","vertical","majority","lines"],"r":{"a":"[A] invited (요청했다(invite의 과거형)), [B] university (대학)","ev":"2번 문장","s":[[2,"He invited groups of university students to participate in the experiment.","그는 대학생 여러 명에게 실험에 참여해 달라고 요청했다."]],"w":"2번에서 He invited groups of university students to participate in the experiment라고 함.","c":null,"k":null},"h":"5f7c6a898a"}]},{"u":8,"id":"r24","no":24,"ko":"웃다가 큰일 날 뻔?!","items":[{"n":1,"t":"tf","q":"In one case, a man laughed nonstop for nearly two minutes and then died in his sleep.","h":"15a68af77d","ko":"한 사례에서 한 남자가 거의 2분간 쉬지 않고 웃은 뒤 잠든 상태로 사망했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In another case, a man laughed nonstop for nearly two minutes before dying in his sleep, possibly due to a loss of breath or heart failure.","또 다른 사례로, 한 남성이 거의 2분 동안 쉬지 않고 웃은 뒤 수면 중에 사망했는데, 이는 호흡 곤란이나 심장 마비 때문인 것으로 추정된다."]],"w":"6번 문장 laughed nonstop for nearly two minutes before dying in his sleep. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Extreme laughter is often called hysterical laughter.","h":"8441639899","ko":"극심한 웃음은 흔히 히스테리성 웃음이라고 불린다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Doctors explain that extreme laughter, often called hysterical laughter, can put a significant strain on the body.","의사들은 주로 히스테리성 웃음이라고 불리는 극단적인 웃음이 신체에 상당한 부담을 줄 수 있다고 설명한다."]],"w":"7번 문장 extreme laughter, often called hysterical laughter. 일치.","c":"T"}},{"n":3,"t":"tf","q":"In 1975, a man's laughter lasted for 25 hours before it caused a heart problem.","h":"00cba0ba60","ko":"1975년에 한 남자의 웃음이 25시간 지속된 뒤 심장 문제를 일으켰다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"One famous example occurred in 1975 when a man laughed uncontrollably while watching a comedy show.","한 유명한 예는 1975년 한 남성이 코미디 쇼를 시청하던 중 통제할 수 없이 웃었던 때에 일어났다."],[5,"Having lasted for 25 minutes, his laughter then triggered a heart problem that caused his heart to stop.","25분 동안 지속되고 나서, 그의 웃음은 이어 그의 심장을 멎게 한 심장 문제를 유발했다."]],"w":"5번 문장은 25 minutes(25분). 시간 단위를 hours로 바꾼 오답.","c":"F"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (We’ve all heard the phrase, “I’m dying of laughter!” after hearing a hilarious joke.)","h":"40c31e67cd","ko":"밑줄 친 hilarious의 뜻","opts":["끔찍한","지루한","아주 재미있는","부끄러운"],"word":"hilarious","r":{"a":"3) 아주 재미있는","ev":"1번 문장","s":[[1,"We’ve all heard the phrase, “I’m dying of laughter!” after hearing a hilarious joke.","우리는 모두 아주 재미있는 농담을 들은 후 “웃겨 죽겠어!”라는 말을 들어본 적이 있다."]],"w":"hilarious는 '아주 재미있는, 매우 유쾌한'. 웃다가 죽겠다는 표현이 나오는 상황의 농담.","c":3}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (This can result in fainting, choking, or even heart-related issues such as heart attacks or strokes.)","h":"488a50aba2","ko":"밑줄 친 strokes의 문맥상 뜻 (stroke: 타격 / 쓰다듬기 / 뇌졸중)","opts":["타격, 한 번 치기","쓰다듬기","수영 영법","뇌졸중"],"word":"strokes","r":{"a":"4) 뇌졸중","ev":"9번 문장","s":[[9,"This can result in fainting, choking, or even heart-related issues such as heart attacks or strokes.","이것은 실신, 질식, 또는 심장마비나 뇌졸중과 같은 심장 관련 문제까지도 초래할 수 있다."]],"w":"heart attacks or strokes: 심장 마비와 함께 나오므로 '뇌졸중'. stroke는 명사 stroke의 복수형.","c":4}},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nWe’ve all heard the phrase, “I’m dying of laughter!” after hearing a hilarious joke. But could this ever actually happen?","ko":"밑줄 친 this이 가리키는 것은?","opts":["웃다가 죽는 것","농담을 듣는 것","아주 재미있는 농담을 하는 것","코미디 쇼를 보는 것"],"r":{"a":"1) 웃다가 죽는 것","ev":"1~2번 문장","s":[[1,"We’ve all heard the phrase, “I’m dying of laughter!” after hearing a hilarious joke.","우리는 모두 아주 재미있는 농담을 들은 후 “웃겨 죽겠어!”라는 말을 들어본 적이 있다."],[2,"But could this ever actually happen?","하지만 이런 일이 실제로 일어날 수 있을까?"]],"w":"\"I'm dying of laughter!\"라는 말을 한 뒤 \"But could this ever actually happen?\"이라고 물음. this는 웃다가 죽는 일.","c":1,"k":"this = 웃다가 죽는 것"},"sko":"하지만 이런 일이 실제로 일어날 수 있을까?","pron":"this","h":"925fb50e93"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Just remember: as with anything, moderation is key — even when it comes to laughter.\"","ko":"위 문장의 의미로 알맞은 것은?","opts":["웃음도 다른 모든 것처럼 적당히 하는 것이 중요하다는 의미","웃음은 몸에 해로우니 피해야 한다는 의미","웃음을 참을수록 건강에 좋다는 의미","웃음이 몸에 미치는 영향은 의사만 판단할 수 있다는 의미"],"r":{"a":"1) 웃음도 다른 모든 것처럼 적당히 하는 것이 중요하다는 의미","ev":"12번 문장","s":[[12,"Just remember: as with anything, moderation is key — even when it comes to laughter.","단지, 다른 모든 것과 마찬가지로, 웃음도 적당함이 중요하다는 것을 기억하라."]],"w":"12번: moderation is key — even when it comes to laughter. 웃음도 적당함이 중요하다는 뜻.","c":1,"k":null},"h":"747271f7b2"},{"n":8,"t":"match","q":"Which is true about the passage?","ko":"본문과 일치하는 것","oko":["의사들은 웃음이 몸에 전혀 영향을 주지 않는다고 말한다.","심하게 웃으면 뇌로 가는 산소 흐름이 방해받을 수 있다.","웃음으로 인한 사망의 대부분은 일상생활에서 일어난다.","히스테리성 웃음은 약하고 조용한 웃음을 뜻한다."],"opts":["Doctors say laughing never affects the body.","Laughing intensely can disrupt the flow of oxygen to the brain.","Most deaths from laughter happen in everyday life.","Hysterical laughter means a mild and quiet laugh."],"r":{"a":"2) Laughing intensely can disrupt the flow of oxygen to the brain. (심하게 웃으면 뇌로 가는 산소 흐름이 방해받을 수 있다.)","ev":"8번 문장","s":[[8,"The act of laughing intensely changes pressure in the chest, which can affect internal organs and disrupt oxygen flow to the brain.","심하게 웃는 행위는 가슴의 압력을 변화시키고, 이는 내부 장기에 영향을 주고 뇌로 가는 산소 흐름을 방해할 수 있다."]],"w":"8번에서 laughing intensely ... disrupt oxygen flow to the brain이라고 함. ①은 정반대, ③ 일상 사망은 언급 없음, ④ hysterical은 극단적인 웃음.","c":2,"k":null},"h":"1d7e54b6b5"},{"n":9,"t":"sum","q":"Too much laughter can lead to (A), choking, and even heart-related (B).","ko":"지나친 웃음은 (A), 질식, 그리고 심지어 심장 관련 (B)(으)로 이어질 수 있다.","opts":["(A) fainting / (B) benefits","(A) singing / (B) issues","(A) fainting / (B) issues","(A) sleeping / (B) jokes","(A) shouting / (B) benefits"],"r":{"a":"3) (A) fainting / (B) issues ((A) 실신 / (B) 문제)","ev":"9번 문장","s":[[9,"This can result in fainting, choking, or even heart-related issues such as heart attacks or strokes.","이것은 실신, 질식, 또는 심장마비나 뇌졸중과 같은 심장 관련 문제까지도 초래할 수 있다."]],"w":"9번에서 This can result in fainting, choking, or even heart-related issues라고 함.","c":3,"k":null},"oko":["(A) 실신 / (B) 이점","(A) 노래하기 / (B) 문제","(A) 실신 / (B) 문제","(A) 잠자기 / (B) 농담","(A) 소리치기 / (B) 이점"],"h":"b18f82f9e0"},{"n":10,"t":"fill","q":"The [A] \"laughter is the best [B]\" still holds true today.","ko":"‘웃음은 최고의 [B]’라는 [A]은(는) 오늘날에도 여전히 유효하다.","bko":{"saying":"속담","medicine":"약","strain":"부담","organs":"장기","oxygen":"산소","breath":"숨"},"bank":["saying","medicine","strain","organs","oxygen","breath"],"r":{"a":"[A] saying (속담), [B] medicine (약)","ev":"11번 문장","s":[[11,"The saying “laughter is the best medicine” still holds true today.","‘웃음이 최고의 약이다’라는 속담은 오늘날에도 여전히 유효하다."]],"w":"11번에서 The saying \"laughter is the best medicine\" still holds true today라고 함.","c":null,"k":null},"h":"0c0f28e33b"}]},{"u":9,"id":"r25","no":25,"ko":"천재의 호기심이 남긴 영원한 메시지","items":[{"n":1,"t":"tf","q":"The Codex Leicester is a 72-page manuscript.","h":"a7f338265d","ko":"코덱스 레스터는 72쪽짜리 원고이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The Codex Leicester is a 72-page manuscript that provides a rare insight into da Vinci’s mind and his efforts to understand the natural world.","코덱스 레스터는 다빈치의 사고방식과 자연 세계를 이해하려는 그의 노력에 대해 진귀한 통찰을 제공하는 72페이지 분량의 원고이다."]],"w":"3번 문장에 a 72-page manuscript라고 나옴. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Gates kept the manuscript private so that only scholars could study it.","h":"ffaeca7612","ko":"게이츠는 학자들만 연구할 수 있도록 그 원고를 비공개로 두었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Gates even had the manuscript digitized so more people could follow and connect with da Vinci’s pursuit of knowledge.","게이츠는 더 많은 사람들이 다빈치의 지적 탐구를 따르고 공감할 수 있도록 그 원고를 디지털화하기까지 했다."]],"w":"8번 문장에서 게이츠는 더 많은 사람들이 따르고 공감하도록 원고를 디지털화함. 비공개가 아니라 공개 방향이라 F.","c":"F"}},{"n":3,"t":"tf","q":"The Codex Leicester has da Vinci's thoughts on the behavior of light.","h":"9cde14fe4a","ko":"코덱스 레스터에는 빛의 행동에 대한 다빈치의 생각이 담겨 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"It captures his thoughts and sketches on topics such as the movement of water, the behavior of light, and the mysteries of the universe.","그것은 물의 움직임, 빛의 행동, 그리고 우주의 신비와 같은 주제에 대한 그의 생각과 스케치를 담고 있다."]],"w":"4번 문장에 thoughts and sketches on topics such as ... the behavior of light가 나옴. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Bill Gates acquired the document for 30.8 million dollars.","h":"bfddfe1985","ko":"빌 게이츠는 그 문서를 3,080만 달러에 (acquired) 했다.","opts":["~을 잃어버렸다","~을 기부했다","~을 입수했다","~을 복원했다"],"word":"acquired","r":{"a":"3) ~을 입수했다","ev":"6번 문장","s":[[6,"In 1994, Microsoft co-founder Bill Gates acquired the document for 30.8 million dollars, making it the most expensive book ever sold.","1994년에, Microsoft의 공동 창립자인 빌 게이츠는 그 문서를 3,080만 달러에 인수하여, 그것이 역대 판매된 책 중에 가장 비싼 책이 되었다."]],"w":"acquire는 '입수하다, 획득하다'. 6번 문장에서 게이츠가 돈을 주고 문서를 손에 넣은 내용. 잃어버리거나 기부한 것이 아님.","c":3}},{"n":5,"t":"vocab","q":"Among his most valuable works is the Codex Leicester.","h":"272fd038e7","ko":"그의 가장 귀중한 (works) 중에는 코덱스 레스터가 있다.","opts":["작품","일자리","작동","공장"],"word":"works","r":{"a":"1) 작품","ev":"2번 문장","s":[[2,"Among his most valuable works is the Codex Leicester.","그의 가장 가치 있는 작품들 중 하나는 코덱스 레스터이다."]],"w":"work는 '일'이라는 뜻이 흔하지만 여기서는 다빈치가 만든 '작품'. 다의어라 문맥으로 판단. 모나리자 같은 걸작을 말하는 앞 문장 흐름과도 연결.","c":1}},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIn 1994, Microsoft co-founder Bill Gates acquired the document for 30.8 million dollars, making it the most expensive book ever sold.","ko":"밑줄 친 it이 가리키는 것은?","opts":["Microsoft","3,080만 달러","빌 게이츠","그 문서(코덱스 레스터)"],"r":{"a":"4) 그 문서(코덱스 레스터)","ev":"6번 문장","s":[[6,"In 1994, Microsoft co-founder Bill Gates acquired the document for 30.8 million dollars, making it the most expensive book ever sold.","1994년에, Microsoft의 공동 창립자인 빌 게이츠는 그 문서를 3,080만 달러에 인수하여, 그것이 역대 판매된 책 중에 가장 비싼 책이 되었다."]],"w":"making it the most expensive book ever sold에서 it은 게이츠가 산 the document(코덱스 레스터).","c":4,"k":"it = 그 문서(코덱스 레스터)"},"sko":"1994년에, Microsoft의 공동 창립자인 빌 게이츠는 그 문서를 3,080만 달러에 인수하여, 그것이 역대 판매된 책 중에 가장 비싼 책이 되었다.","pron":"it","h":"1598639ccc"},{"n":7,"t":"sense","q":"Gates recognized its value not only as a scientific record but as a symbol of humanity's desire to learn and discover.","h":"814e7cf7c0","ko":"7번 문장 'not only as a scientific record but as a symbol'의 의미는?","sko":"게이츠는 그것을 과학적 기록으로서뿐만 아니라, 배우고 발견하고자 하는 인류 열망에 대한 상징으로서 그것의 가치를 인식했다.","opts":["게이츠는 이 원고를 과학 기록으로만 보았다.","게이츠는 이 원고를 과학 기록일 뿐 아니라 인류의 배움에 대한 열망의 상징으로도 보았다.","게이츠는 이 원고를 과학 기록보다 예술 작품으로 더 높이 평가했다.","게이츠는 이 원고의 가치를 알아보지 못한 채 샀다."],"r":{"a":"2) 게이츠는 이 원고를 과학 기록일 뿐 아니라 인류의 배움에 대한 열망의 상징으로도 보았다.","ev":"7번 문장","s":[[7,"Gates recognized its value not only as a scientific record but as a symbol of humanity’s desire to learn and discover.","게이츠는 그것을 과학적 기록으로서뿐만 아니라, 배우고 발견하고자 하는 인류 열망에 대한 상징으로서 그것의 가치를 인식했다."]],"w":"not only A but B는 'A뿐 아니라 B도'. A는 과학적 기록, B는 배우고 발견하려는 인류의 열망의 상징. recognized는 가치를 알아보았다는 뜻이라 4번은 반대.","c":2}},{"n":8,"t":"match","q":"Which of the following matches the passage?","ko":"다음 중 본문과 일치하는 것은?","oko":["그 원고는 다빈치 본인이 빌 게이츠에게 팔았다.","그 원고는 주로 다빈치의 그림에 관한 것이다.","그 원고는 수 세기가 지났지만 여전히 사람들에게 영감을 준다.","그 원고의 생각들은 당시 과학자들 사이에서 흔한 것이었다."],"opts":["The manuscript was sold to Bill Gates by da Vinci himself.","The manuscript is mostly about da Vinci's paintings.","The manuscript still inspires people even though many centuries have passed.","The manuscript's ideas were common among scientists of his time."],"r":{"a":"3) The manuscript still inspires people even though many centuries have passed. (그 원고는 수 세기가 지났지만 여전히 사람들에게 영감을 준다.)","ev":"9~10번 문장","s":[[9,"Many centuries have passed since its creation, but the Codex Leicester’s legacy lives on.","코덱스 레스터가 만들어진 지 수 세기가 지났지만, 그것의 유산은 여전히 살아 있다."],[10,"It remains a lasting source of inspiration, which encourages us to ask questions, explore new possibilities, and see the world with wonder and imagination.","그것은 우리가 질문하고, 새로운 가능성을 탐색하며, 경이로움과 상상력으로 세상을 바라보게 하는 지속적인 영감의 원천으로 남아 있다."]],"w":"9~10번에서 수 세기가 지났지만 legacy lives on, lasting source of inspiration이라고 함. ①은 다빈치가 판 게 아니라 게이츠가 인수, ②는 자연 세계·물·빛 등, ④는 그의 생각이 앞서 있었다고 함.","c":3,"k":null},"h":"98a8d5a219"},{"n":9,"t":"sum","q":"Leonardo da Vinci is best (A) for masterpieces like the Mona Lisa, but he was also a (B) scientist.","ko":"레오나르도 다빈치는 모나리자 같은 걸작들로 가장 (A) 있지만, 훌륭한 (B) 과학자이기도 했다.","opts":["(A) forgotten / (B) brilliant","(A) known / (B) careless","(A) known / (B) brilliant","(A) hated / (B) lazy","(A) known / (B) ordinary"],"r":{"a":"3) (A) known / (B) brilliant ((A) 알려져 / (B) 훌륭한)","ev":"1번 문장","s":[[1,"Leonardo da Vinci is best known for masterpieces like the Mona Lisa and The Last Supper, but he was also a brilliant scientist.","레오나르도 다빈치는 Mona Lisa(모나리자)와 The Last Supper(최후의 만찬)와 같은 걸작들로 가장 유명하지만, 그는 훌륭한 과학자이기도 했다."]],"w":"1번에서 best known for masterpieces ... he was also a brilliant scientist라고 함.","c":3,"k":null},"oko":["(A) 잊혀져 / (B) 훌륭한","(A) 알려져 / (B) 부주의한","(A) 알려져 / (B) 훌륭한","(A) 미움받아 / (B) 게으른","(A) 알려져 / (B) 평범한"],"h":"fdc93e115b"},{"n":10,"t":"fill","q":"His notes show how [A] he thought about these subjects and how far [B] his ideas were for his time.","ko":"그의 기록은 그가 이러한 주제들에 대해 얼마나 [A] 생각했는지와 그의 생각이 그 당시로서는 얼마나 [B] 있었는지를 보여준다.","bko":{"deeply":"깊이","ahead":"앞서","legacy":"유산","symbol":"상징","humanity":"인류","wonder":"경이로움"},"bank":["deeply","ahead","legacy","symbol","humanity","wonder"],"r":{"a":"[A] deeply (깊이), [B] ahead (앞서)","ev":"5번 문장","s":[[5,"His notes show how deeply he thought about these subjects and how far ahead his ideas were for his time.","그의 기록은 그가 이러한 주제들에 대해 얼마나 깊이 생각했는지와 그의 생각이 그 당시로서는 얼마나 앞서있었는지를 보여준다."]],"w":"5번에서 how deeply he thought ... how far ahead his ideas were라고 함.","c":null,"k":null},"h":"84e6a8c35e"}]},{"u":9,"id":"r26","no":26,"ko":"멀리 떠나고 싶은 이 마음, 뭐라고 할까?","items":[{"n":1,"t":"tf","q":"The word fernweh combines two German words.","h":"34e8c970cc","ko":"fernweh라는 단어는 두 개의 독일어 단어를 결합한 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The word fernweh combines two German words: “fern”(distant) and “wehe”(ache).","‘fernweh’라는 단어는 두 개의 독일어 단어, ‘fern’(먼)과 ‘wehe’(아픔)를 결합한 말이다."]],"w":"4번 문장에 The word fernweh combines two German words(fern, wehe)라고 나옴. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Fernweh describes a deep desire to return home.","h":"94fd2e9bc1","ko":"fernweh는 집으로 돌아가고 싶은 깊은 욕구를 나타낸다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"It describes a deep, aching desire to travel and is considered the opposite of homesickness(heimweh), the longing to return home.","그것은 깊고 쓰라린, 여행하고 싶은 욕구를 뜻하며, 집으로 돌아가고 싶은 갈망인 향수병(‘heimweh’)의 반대말로 여겨진다."]],"w":"fernweh는 여행하고 싶은 갈망이고, 집으로 돌아가고 싶은 마음은 homesickness. 5번 문장에서 둘은 정반대라 F.","c":"F"}},{"n":3,"t":"tf","q":"The term is believed to have been first used in the 1930s.","h":"2ecb9887ee","ko":"그 용어는 1930년대에 처음 사용된 것으로 여겨진다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The term is believed to have been first used by a German prince in the 1830s in his book about his travels across Europe and Northern Africa.","그 용어는 1830년대에 한 독일의 왕자가 자신의 유럽과 북아프리카 여행에 대해 쓴 책에서 처음 사용되었다고 여겨진다."]],"w":"6번 문장에서 처음 사용된 때는 1830년대. 숫자를 하나 바꾼 진술이라 F.","c":"F"}},{"n":4,"t":"vocab","q":"the word evolved as a way for Germans to express their yearning","h":"5b9247bd13","ko":"그 단어는 독일인들이 동경을 표현하는 방법으로 (evolved) 했다.","opts":["점차 사라졌다","점진적으로 발전했다","갑자기 생겨났다","더 짧아졌다"],"word":"evolved","r":{"a":"2) 점진적으로 발전했다","ev":"7번 문장","s":[[7,"Over the years, as travel became more accessible, the word evolved as a way for Germans to express their yearning for distant places.","세월이 지나 여행이 더 쉬워지면서, 그 단어는 독일인들이 먼 곳에 대한 갈망을 표현하는 방법으로 발전했다."]],"w":"evolve는 '점진적으로 발전하다, 진화하다'. 7번 문장에서 여행이 쉬워지면서 단어가 표현 방식으로 자리 잡아 간 과정을 말함. 이후 20세기 후반에 널리 알려졌으므로 사라진 것이 아님.","c":2}},{"n":5,"t":"vocab","q":"you may have struggled to contain your desire to travel","h":"ef87060ecf","ko":"너는 여행하고 싶은 욕구를 (contain) 하느라 애썼을 수 있다.","opts":["담고 있다","수집하다","만들어내다","(감정을) 억누르다, 참다"],"word":"contain","r":{"a":"4) (감정을) 억누르다, 참다","ev":"2번 문장","s":[[2,"Stuck at home, you may have struggled to contain your desire to travel.","집에 갇혀 당신은 여행하고 싶은 욕구를 억누르기 힘들었을지도 모른다."]],"w":"contain은 '담고 있다'가 기본 뜻이지만, 감정이 목적어일 때는 '억누르다, 참다'. 집에 갇혀 여행 욕구를 참기 힘들었다는 2번 문장 흐름에 맞는 뜻.","c":4}},{"n":6,"t":"ref","q":"Agencies began using it to motivate people to explore the world. 여기서 it이 가리키는 것은?","h":"74751c21f3","ko":"9번 문장의 it이 가리키는 것은?","oko":["독일의 왕자","여행 산업","그 용어(fernweh)","향수병"],"sko":"여행사들은 사람들로 하여금 세상을 탐험하도록 동기 부여하기 위해 그것을 사용하기 시작했다.","opts":["the German prince","the travel industry","the term (fernweh)","homesickness"],"r":{"a":"3) the term (fernweh)","ev":"8번, 9번 문장","s":[[8,"By the late 20th century, the term was widely recognized, particularly in the travel industry.","20세기 후반 무렵에는, 그 용어가 특히 여행 산업에서 널리 알려졌다."],[9,"Agencies began using it to motivate people to explore the world.","여행사들은 사람들로 하여금 세상을 탐험하도록 동기 부여하기 위해 그것을 사용하기 시작했다."]],"w":"8번 문장에서 널리 알려졌다고 한 the term(fernweh)을 여행사들이 사람들을 탐험하도록 동기부여하는 데 썼다는 흐름. 여행업계 자체나 왕자는 사용되는 대상이 아님.","c":3}},{"n":7,"t":"sense","q":"If so, you've experienced what the Germans call fernweh.","h":"bf619076b2","ko":"3번 문장 'you've experienced what the Germans call fernweh'의 의미는?","sko":"만약 그랬다면, 당신은 독일인들이 ‘fernweh’라고 부르는 것을 경험해 본 것이다.","opts":["독일인들이 fernweh라 부르는 감정을 느껴 본 것이다.","독일에서 여행해 본 적이 있다는 뜻이다.","독일어를 공부해 본 적이 있다는 뜻이다.","집에 돌아가고 싶은 마음을 느꼈다는 뜻이다."],"r":{"a":"1) 독일인들이 fernweh라 부르는 감정을 느껴 본 것이다.","ev":"1~3번 문장","s":[[1,"When the world stopped during the COVID-19 pandemic, did you find yourself longing to escape to faraway places?","코로나19 팬데믹 동안 세상이 멈췄을 때, 당신은 멀리 떨어진 곳으로 떠나길 간절히 바랐는가?"],[2,"Stuck at home, you may have struggled to contain your desire to travel.","집에 갇혀 당신은 여행하고 싶은 욕구를 억누르기 힘들었을지도 모른다."],[3,"If so, you’ve experienced what the Germans call fernweh.","만약 그랬다면, 당신은 독일인들이 ‘fernweh’라고 부르는 것을 경험해 본 것이다."]],"w":"what the Germans call ~는 '독일인들이 ~라고 부르는 것'. 앞의 1~2번 문장에서 멀리 떠나고 싶어 여행 욕구를 참기 힘들었던 경험이 바로 fernweh라는 말. 독일 방문이나 독일어 학습과는 무관.","c":1}},{"n":8,"t":"match","q":"Which of the following matches the passage?","ko":"다음 중 본문과 일치하는 것은?","oko":["Fernweh는 주로 고향을 그리워하는 독일인들이 쓴다.","관용구 \"itchy feet\"는 집으로 돌아가고 싶은 소망을 뜻한다.","Fernweh는 20세기 후반에 한 여행사가 만들어 냈다.","영어 관용구 \"itchy feet\"는 돌아다니고 싶은 욕구를 가리킨다."],"opts":["Fernweh is mainly used by Germans who miss their hometowns.","The idiom \"itchy feet\" means a wish to return home.","Fernweh was invented by a travel agency in the late 20th century.","The English idiom \"itchy feet\" refers to the urge to wander."],"r":{"a":"4) The English idiom \"itchy feet\" refers to the urge to wander. (영어 관용구 \"itchy feet\"는 돌아다니고 싶은 욕구를 가리킨다.)","ev":"11번 문장","s":[[11,"In English, the idiom “itchy feet” refers to the urge to wander, and in Norwegian, utferdstrang means a longing to go out into the world.","영어에서, ‘itchy feet’이라는 관용구는 돌아다니고 싶은 욕구를 의미하며, 노르웨이어의 ‘utferdstrang’은 세상 밖으로 나가고 싶은 갈망을 의미한다."]],"w":"11번에서 itchy feet은 the urge to wander라고 함. ②는 집으로 돌아가고 싶은 갈망이 아님. ①③은 본문에 없음.","c":4,"k":null},"h":"ca6f82f5a5"},{"n":9,"t":"sum","q":"Fernweh became (A) known in the late 20th century, and no other term captures the (B) ache for travel like it.","ko":"fernweh는 20세기 후반에 (A) 알려졌고, 다른 어떤 용어도 이만큼 여행에 대한 (B) 아픔을 담아내지 못한다.","opts":["(A) rarely / (B) physical","(A) widely / (B) emotional","(A) rarely / (B) emotional","(A) widely / (B) physical","(A) secretly / (B) cheerful"],"r":{"a":"2) (A) widely / (B) emotional ((A) 널리 / (B) 감정적인)","ev":"8번, 12번 문장","s":[[8,"By the late 20th century, the term was widely recognized, particularly in the travel industry.","20세기 후반 무렵에는, 그 용어가 특히 여행 산업에서 널리 알려졌다."],[12,"Yet, no other term captures the deep emotional ache for travel like fernweh.","그렇지만, 다른 어떤 용어도 fernweh만큼 여행에 대한 깊은 감정적 고통을 담아내지 못한다."]],"w":"8번에서 the term was widely recognized, 12번에서 the deep emotional ache for travel이라고 함.","c":2,"k":null},"oko":["(A) 드물게 / (B) 신체적인","(A) 널리 / (B) 감정적인","(A) 드물게 / (B) 감정적인","(A) 널리 / (B) 신체적인","(A) 은밀하게 / (B) 쾌활한"],"h":"89e53e4aa7"},{"n":10,"t":"fill","q":"When the world stopped during the COVID-19 pandemic, did you find yourself [A] to escape to [B] places?","ko":"코로나19 팬데믹 동안 세상이 멈췄을 때, 당신은 [B] 곳으로 떠나기를 [A] 자신을 발견했는가?","bko":{"longing":"간절히 바라는","faraway":"멀리 떨어진","prince":"왕자","idiom":"관용구","agencies":"여행사들","motivate":"동기를 부여하다"},"bank":["longing","faraway","prince","idiom","agencies","motivate"],"r":{"a":"[A] longing (간절히 바라는), [B] faraway (멀리 떨어진)","ev":"1번 문장","s":[[1,"When the world stopped during the COVID-19 pandemic, did you find yourself longing to escape to faraway places?","코로나19 팬데믹 동안 세상이 멈췄을 때, 당신은 멀리 떨어진 곳으로 떠나길 간절히 바랐는가?"]],"w":"1번에서 longing to escape to faraway places라고 함.","c":null,"k":null},"h":"0f2a4d22d0"}]},{"u":9,"id":"r27","no":27,"ko":"주말에만 운동해도 될까?","items":[{"n":1,"t":"tf","q":"Weekend warriors do their exercise in one or two long workouts on the weekend.","h":"6cf91dff76","ko":"주말 전사들은 주말에 한두 번의 긴 운동으로 운동을 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Weekend warriors typically fit in one or two long workouts over the weekend instead of doing shorter sessions spread throughout the week.","주말 전사는 한 주에 걸쳐 분산된 짧은 (운동) 세션을 하는 대신, 일반적으로 주말에 한두 번의 긴 운동을 시간을 내서 한다."]],"w":"3번 문장에 fit in one or two long workouts over the weekend라고 나옴. 일치.","c":"T"}},{"n":2,"t":"tf","q":"The participants were divided into four groups.","h":"e88872fa91","ko":"참가자들은 네 개의 그룹으로 나뉘었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Participants were divided into three groups: regular exercisers, weekend warriors, and inactive individuals.","참가자들은 세 그룹으로 나누어졌는데, 규칙적으로 운동하는 사람들, 주말 전사들, 그리고 활동하지 않는 사람들이었다."]],"w":"6번 문장에서 세 그룹(규칙적 운동자, 주말 전사, 활동하지 않는 사람들)으로 나뉨. 숫자를 바꾼 진술이라 F.","c":"F"}},{"n":3,"t": ors experienced similar health benefits.","그 결과는 놀라운 것을 밝혀냈는데, 바로 규칙적으로 운동하는 사람들과 주말 전사 모두 비슷한 건강상의 이점을 경험했다는 점이다."],[13,"They showed a lower risk of over 260 diseases, including heart problems, diabetes, and mental health issues, compared to inactive individuals.","그들은 활동하지 않는 사람들에 비해 심장 질환, 당뇨병, 정신 건강 문제를 포함한 260가지 이상의 질병에 대한 위험이 더 낮게 나타났다."]],"w":"12번에서 both regular exercisers and weekend warriors가 비슷한 이점을 얻었다고 한 뒤, 13번 They가 이어서 위험이 낮다고 함. inactive individuals는 비교 대상.","c":1,"k":"They = 규칙적으로 운동하는 사람들과 주말 전사들"},"sko":"그들은 활동하지 않는 사람들에 비해 심장 질환, 당뇨병, 정신 건강 문제를 포함한 260가지 이상의 질병에 대한 위험이 더 낮게 나타났다.","pron":"They","h":"24d9afd767"},{"n":7,"t":"sense","q":"Meanwhile, the inactive group did not meet the recommended levels of physical activity.","h":"06cee96765","ko":"10번 문장 'the inactive group did not meet the recommended levels'의 의미는?","sko":"한편, 활동하지 않는 그룹은 권장되는 신체 활동 수준을 충족하지 못했다.","opts":["활동하지 않은 그룹은 권장 수준보다 더 많이 운동했다.","활동하지 않은 그룹은 주말에만 운동했다.","활동하지 않은 그룹은 연구에서 제외되었다.","활동하지 않은 그룹은 권장되는 신체 활동 수준을 채우지 못했다."],"r":{"a":"4) 활동하지 않은 그룹은 권장되는 신체 활동 수준을 채우지 못했다.","ev":"10번 문장","s":[[10,"Meanwhile, the inactive group did not meet the recommended levels of physical activity.","한편, 활동하지 않는 그룹은 권장되는 신체 활동 수준을 충족하지 못했다."]],"w":"did not meet ~는 '~을 채우지 못했다'. 7번 문장에서 규칙적 운동자가 권장량을 채운 것(met)과 대비됨. 주말에만 운동한 것은 주말 전사의 특징이고, 제외되었다는 말은 본문에 없음.","c":4}},{"n":8,"t":"match","q":"Which of the following matches the passage?","h":"3c5df89479","ko":"다음 중 본문과 일치하는 것은?","oko":["규칙적으로 운동하는 사람들은 모든 운동을 주말에 했다.","그 연구는 약 9만 명을 6년 동안 관찰했다.","활동하지 않는 그룹은 주말 전사보다 질병 위험이 더 낮았다.","주말 전사는 규칙적으로 운동하는 사람들보다 운동을 적게 했다."],"opts":["Regular exercisers did all their exercise on the weekend.","The study observed nearly 90,000 people for six years.","The inactive group had a lower risk of diseases than weekend warriors.","Weekend warriors did less exercise than regular exercisers."],"r":{"a":"2) The study observed nearly 90,000 people for six years.","ev":"5번, 8번, 9번, 13번 문장","s":[[5,"A large-scale study observed nearly 90,000 people for six years to see how different exercise habits affect health.","한 대규모 연구는 서로 다른 운동 습관이 어떻게 건강에 영향을 미치는지 보기 위해 약 9만 명의 사람들을 6년 동안 관찰했다."],[8,"Their workouts were usually spread across five or six shorter sessions.","그들의 운동은 보통 다섯 번이나 여섯 번의 짧은 세션에 나뉘어져 수행되었다."],[9,"Weekend warriors achieved the same amount of exercise, but only on weekends.","주말 전사는 동일한 양의 운동을 했지만, 오직 주말에만 했다."],[13,"They showed a lower risk of over 260 diseases, including heart problems, diabetes, and mental health issues, compared to inactive individuals.","그들은 활동하지 않는 사람들에 비해 심장 질환, 당뇨병, 정신 건강 문제를 포함한 260가지 이상의 질병에 대한 위험이 더 낮게 나타났다."]],"w":"5번 문장에 nearly 90,000 people for six years. 1번은 규칙적 운동자가 5~6번에 나눠 운동(8번). 3번은 위험이 낮은 쪽이 활동하지 않는 그룹과 비교해 규칙적 운동자와 주말 전사(13번). 4번은 주말 전사도 같은 운동량(9번).","c":2}},{"n":9,"t":"sum","q":"The effectiveness of exercise is based on the total (A) of exercise, rather than its (B).","ko":"운동의 효능은 운동의 (B)이(가) 아니라 운동의 총 (A)에 기반한다.","opts":["(A) frequency / (B) amount","(A) amount / (B) frequency","(A) place / (B) amount","(A) cost / (B) frequency","(A) type / (B) equipment"],"r":{"a":"2) (A) amount / (B) frequency ((A) 총량 / (B) 빈도)","ev":"14번 문장","s":[[14,"This implies that the effectiveness of exercise is based on the (A) of exercise, rather than its (B).","이는 운동의 효능이 운동의 빈도보다는 운동의 총량에 기반한다는 것을 암시한다."]],"w":"14번에서 효능은 운동의 총량(amount)에 기반하고 빈도(frequency)에는 달려 있지 않다고 정리함. 이 문장의 (A)(B)는 총량과 빈도.","c":2,"k":null},"oko":["(A) 빈도 / (B) 총량","(A) 총량 / (B) 빈도","(A) 장소 / (B) 총량","(A) 비용 / (B) 빈도","(A) 종류 / (B) 장비"],"h":"2b726cd181"},{"n":10,"t":"fill","q":"This exercise pattern has recently [A] growing interest from [B].","ko":"이러한 운동 패턴은 최근 [B]에게 점점 더 많은 관심을 [A].","bko":{"attracted":"끌었다(attract의 과거분사)","researchers":"연구자들","divided":"나누었다(divide의 과거분사)","tracked":"추적했다(track의 과거분사)","sensors":"센서들","diseases":"질병들"},"bank":["attracted","researchers","divided","tracked","sensors","diseases"],"r":{"a":"[A] attracted (끌었다(attract의 과거분사)), [B] researchers (연구자들)","ev":"4번 문장","s":[[4,"This exercise pattern has recently attracted growing interest from researchers.","이러한 운동 패턴은 최근 연구자들에게 점점 더 많은 관심을 끌고 있다."]],"w":"4번에서 This exercise pattern has recently attracted growing interest from researchers라고 함.","c":null,"k":null},"h":"030ea910e3"}]},{"u":10,"id":"r28","no":28,"ko":"설레는 하루를 시작하는 방법","items":[{"n":1,"t":"tf","q":"Ikigai is a Japanese word that means “a reason to get up in the morning.”","h":"1db94162b1","ko":"Ikigai는 ‘아침에 일어나는 이유’를 뜻하는 일본어 단어이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"In Japan, this concept is called Ikigai, which means “a reason to get up in the morning.”","일본에서는 이 개념을 ikigai라고 부르는데, 이것은 ‘아침에 일어나는 이유’를 뜻한다."]],"w":"4번 문장에서 일본에서는 이 개념을 Ikigai라 부르고 ‘아침에 일어나는 이유’를 뜻한다고 함. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Ikigai is built on three key elements.","h":"2b141b5786","ko":"Ikigai는 세 가지 핵심 요소를 기반으로 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Ikigai is built on four key elements:","ikigai는 네 가지 핵심 요소를 기반으로 한다:"]],"w":"5번 문장은 네 가지(four) 핵심 요소라고 함. 숫자를 three로 바꾼 진술.","c":"F"}},{"n":3,"t":"tf","q":"Dan Buettner found that a strong sense of purpose contributes to healthier, happier lives.","h":"34ffd00474","ko":"Dan Buettner는 강한 목적의식이 더 건강하고 행복한 삶에 기여한다는 것을 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"What you’re good at: your unique skills and talents","당신이 잘하는 것: 당신의 특별한 기술과 재능들"]],"w":"7번 문장에서 연구자 Dan Buettner가 강한 목적의식이 더 건강하고 행복한 삶에 기여한다고 밝힘. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"The underlined word: a strong sense of purpose contributes to healthier, happier lives.","h":"fd053f6ef0","ko":"강한 목적의식이 더 건강하고 행복한 삶에 contributes한다.","opts":["방해하다","반복하다","기여하다","금지하다"],"word":"contributes","r":{"a":"3) 기여하다","ev":"7번 문장","s":[[7,"What you’re good at: your unique skills and talents","당신이 잘하는 것: 당신의 특별한 기술과 재능들"]],"w":"contribute to ~는 ~에 기여하다. 본문의 contributes는 원형 contribute에 3인칭 단수 -s가 붙은 형태. 목적의식이 건강한 삶에 도움이 된다는 문맥.","c":3}},{"n":5,"t":"vocab","q":"The underlined word: it might hold the secret to living a healthier life.","h":"ad81a66779","ko":"그것은 더 건강한 삶을 사는 비결을 hold하고 있을지도 모른다.","opts":["담고 있다, 지니다","개최하다, 열다","붙잡다, 쥐다","참다, 견디다"],"word":"hold","r":{"a":"1) 담고 있다, 지니다","ev":"3번 문장","s":[[3,"Whatever it is, it might hold the secret to living a healthier life: having a sense of purpose.","그것이 무엇이든, 그것은 더 건강한 삶을 사는 비결을 담고 있을지도 모른다: 그것은 바로 목적의식을 갖는 것이다."]],"w":"hold는 다의어. 여기서는 ‘비결을 담고 있다, 지니고 있다’의 뜻. ‘붙잡다’는 손으로 쥐는 물리적 의미라 문맥에 맞지 않음.","c":1}},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nWhen these four elements come together, they form your ikigai — a purpose that brings meaning and motivation to your life.","ko":"밑줄 친 they가 가리키는 것은?","opts":["Blue Zone의 사람들","일과와 목표","연구자 Dan Buettner","네 가지 요소(these four elements)"],"r":{"a":"4) 네 가지 요소(these four elements)","ev":"10번 문장","s":[[10,"When these four elements come together, they form your ikigai — a purpose that brings meaning and motivation to your life.","이 네 가지 요소가 결합할 때, 그것은 당신의 ikigai, 즉 당신의 삶에 의미와 동기를 주는 목적을 형성한다."]],"w":"10번에서 When these four elements come together, they form your ikigai라고 함. they는 앞의 these four elements.","c":4,"k":"they = 네 가지 요소(these four elements)"},"sko":"이 네 가지 요소가 결합할 때, 그것은 당신의 ikigai, 즉 당신의 삶에 의미와 동기를 주는 목적을 형성한다.","pron":"they","h":"c601723f65"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"With purpose in your heart, you’ll wake up excited for the day, not because you have to, but because you want to.\"","ko":"위 문장의 의미로 알맞은 것은?","opts":["하고 싶어서가 아니라 해야 해서 일어난다는 의미","해야 해서가 아니라 하고 싶어서 설레는 마음으로 하루를 맞이한다는 의미","설레는 하루를 보내려면 일찍 일어나야 한다는 의미","목적이 있어도 아침에 일어나기는 여전히 힘들다는 의미"],"r":{"a":"2) 해야 해서가 아니라 하고 싶어서 설레는 마음으로 하루를 맞이한다는 의미","ev":"14번 문장","s":[[14,"With purpose in your heart, you’ll wake up excited for the day, not because you have to, but because you want to.","마음속에 목적이 있다면, 당신은 해야 해서가 아니라 하고 싶어서 하루를 기대하며 일어나게 될 것이다."]],"w":"14번: not because you have to, but because you want to = 해야 해서가 아니라 하고 싶어서. 목적이 있으면 설레는 마음으로 일어난다는 뜻.","c":2,"k":null},"h":"bc12563651"},{"n":8,"t":"match","q":"Which is true according to the passage?","ko":"본문과 일치하는 것은?","oko":["Ikigai는 중국에서 유래했으며 아침에 일어나는 이유를 뜻한다.","Ikigai는 당신이 사랑하는 것과 보수를 받는 것, 두 가지 요소로 이루어져 있다.","당신의 ikigai를 찾는 것은 건강에는 좋지만 행복에는 아무 영향이 없다.","Blue Zone에서는 많은 사람들이 일, 취미, 또는 공동체 참여를 통해 자신의 ikigai를 찾는다."],"opts":["Ikigai comes from China and means a reason to get up in the morning.","Ikigai is made up of two elements: what you love and what you are paid for.","Finding your ikigai is good for your health but has no effect on well-being.","In Blue Zones, many people find their ikigai through work, hobbies, or community involvement."],"r":{"a":"4) In Blue Zones, many people find their ikigai through work, hobbies, or community involvement.","ev":"12번 문장","s":[[12,"Many in these regions discover their ikigai through meaningful work, hobbies, or community involvement, staying active instead of resting in retirement.","이 지역의 많은 사람들은 은퇴 후 휴식을 취하는 대신 의미 있는 일, 취미, 또는 공동체 참여를 통해 활동적으로 지내며 자신의 ikigai를 발견한다."]],"w":"8번 문장: Blue Zones의 많은 사람들이 일, 취미, 지역 사회 참여를 통해 ikigai를 찾음. 1번은 일본(4번), 2번은 네 요소(5번), 3번은 건강과 행복 모두 변화(9번)와 어긋남.","c":4},"h":"4b5ee523e9"},{"n":9,"t":"sum","q":"Ikigai includes activities that bring you (A) and work that provides financial (B).","ko":"ikigai에는 당신에게 (A)을(를) 주는 활동과 재정적 (B)을(를) 주는 일이 포함된다.","opts":["(A) joy / (B) trouble","(A) fear / (B) stability","(A) joy / (B) stability","(A) sadness / (B) debt","(A) fear / (B) trouble"],"r":{"a":"3) (A) joy / (B) stability ((A) 기쁨 / (B) 안정)","ev":"6번, 9번 문장","s":[[6,"What you love: activities that bring you joy","당신이 사랑하는 것: 당신에게 기쁨을 주는 활동들"],[9,"What you can be paid for: your work or profession that provides financial stability","당신이 보수를 받을 수 있는 것: 재정적 안정을 주는 일이나 직업"]],"w":"6번에서 activities that bring you joy, 9번에서 work or profession that provides financial stability라고 함.","c":3,"k":null},"oko":["(A) 기쁨 / (B) 문제","(A) 두려움 / (B) 안정","(A) 기쁨 / (B) 안정","(A) 슬픔 / (B) 빚","(A) 두려움 / (B) 문제"],"h":"6cc7a2e7c3"},{"n":10,"t":"fill","q":"What you’re good at: your [A] skills and [B]","ko":"당신이 잘하는 것: 당신의 [A] 기술과 [B]","bko":{"unique":"특별한","talents":"재능들","positively":"긍정적으로","transform":"변화시키다","discover":"발견하다","instead":"대신에"},"bank":["unique","talents","positively","transform","discover","instead"],"r":{"a":"[A] unique (특별한), [B] talents (재능들)","ev":"7번 문장","s":[[7,"What you’re good at: your unique skills and talents","당신이 잘하는 것: 당신의 특별한 기술과 재능들"]],"w":"7번에서 your unique skills and talents라고 함.","c":null,"k":null},"h":"3113525d66"}]},{"u":10,"id":"r29","no":29,"ko":"보안 1등급, 기밀 커피 구역","items":[{"n":1,"t":"tf","q":"Baristas must pass thorough background checks before working at this Starbucks.","h":"e682f05058","ko":"바리스타는 이 스타벅스에서 일하기 전에 철저한 신원 조회를 통과해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Baristas must pass thorough background checks before working here and are never allowed to move around the building without an escort.","바리스타들은 이곳에서 일하기 전에 철저한 신원 조회를 통과해야 하며 안내원 없이는 그 건물 안을 절대로 돌아다닐 수 없다."]],"w":"6번 문장에서 바리스타는 일하기 전에 철저한 신원 조회(background checks)를 통과해야 한다고 함. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Customers receive membership cards at this Starbucks.","h":"f422f9bb14","ko":"이 스타벅스에서는 손님이 회원 카드를 받는다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Customer names aren’t written on cups, and there are no membership cards — everything is kept (C) public / private.","고객의 이름은 컵에 적히지 않고, 멤버십 카드도 없으며 모든 것이 비공개로 유지된다."]],"w":"7번 문장에서 회원 카드가 없다(there are no membership cards)고 함. 사실을 반대로 바꾼 진술.","c":"F"}},{"n":3,"t":"tf","q":"Workers wait in long lines for coffee in the mornings and afternoons.","h":"a2894624b6","ko":"직원들은 아침과 오후에 커피를 사려고 긴 줄을 선다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Despite its unusual restrictions, this Starbucks remains incredibly busy with long lines of caffeine-craving workers stretching down the hallway in the mornings and afternoons.","그것의 특이한 제약들에도 불구하고, 이 스타벅스는 아침과 오후마다 카페인을 갈망하는 직원들의 긴 줄이 복도까지 늘어설 만큼 매우 붐빈다."]],"w":"8번 문장에서 아침과 오후에 복도까지 긴 줄이 늘어선다고 함. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"The underlined word: Baristas must pass thorough background checks.","h":"cd5244ce5b","ko":"바리스타는 thorough한 신원 조회를 통과해야 한다.","opts":["간단한","철저한","우연한","불법적인"],"word":"thorough","r":{"a":"2) 철저한","ev":"6번 문장","s":[[6,"Baristas must pass thorough background checks before working here and are never allowed to move around the building without an escort.","바리스타들은 이곳에서 일하기 전에 철저한 신원 조회를 통과해야 하며 안내원 없이는 그 건물 안을 절대로 돌아다닐 수 없다."]],"w":"thorough는 ‘철저한’. 신원 조회가 매우 꼼꼼하게 이루어진다는 문맥.","c":2}},{"n":5,"t":"vocab","q":"The underlined word: it operates under strict security standards.","h":"17f84e0d93","ko":"이 가게는 엄격한 보안 기준 아래 operates한다.","opts":["수술하다","연주하다","시도하다","운영되다"],"word":"operates","r":{"a":"4) 운영되다","ev":"4번 문장","s":[[4,"This Starbucks looks like any other coffee shop, but it operates under strict security standards.","이 스타벅스는 여느 커피숍처럼 보이지만, 엄격한 보안 기준 아래 운영된다."]],"w":"operate는 다의어(수술하다, 작동하다, 운영되다). 여기서는 가게가 ‘운영되다’의 뜻. 본문의 operates는 원형 operate에 3인칭 단수 -s가 붙은 형태.","c":4}},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis Starbucks looks like any other coffee shop, but it operates under strict security standards.","ko":"밑줄 친 it이 가리키는 것은?","opts":["이 스타벅스","CIA 본부 건물","바리스타들","지도"],"r":{"a":"1) 이 스타벅스","ev":"4번 문장","s":[[4,"This Starbucks looks like any other coffee shop, but it operates under strict security standards.","이 스타벅스는 여느 커피숍처럼 보이지만, 엄격한 보안 기준 아래 운영된다."]],"w":"4번에서 This Starbucks looks like any other coffee shop, but it operates ...라고 함. it은 앞의 This Starbucks.","c":1,"k":"it = 이 스타벅스"},"sko":"이 스타벅스는 여느 커피숍처럼 보이지만, 엄격한 보안 기준 아래 운영된다.","pron":"it","h":"56a65a1bc2"},{"n":7,"t":"sense","q":"In sentence 3, what does “let alone enjoy a cup of coffee” imply?","h":"897e9b1790","ko":"3번 문장의 “let alone enjoy a cup of coffee”가 의미하는 것은?","sko":"커피 한 잔을 즐기는 것은커녕, 안으로 들어설 수도 없을 것이다.","opts":["들어간 뒤에야 커피를 마실 수 있다","커피를 마시는 것은 허락되지만 들어가는 것은 안 된다","들어가는 것도 어려운데 커피를 마시는 것은 더욱 불가능하다","커피를 마시지 않고 들어가기만 하면 된다"],"r":{"a":"3) 들어가는 것도 어려운데 커피를 마시는 것은 더욱 불가능하다","ev":"3번 문장","s":[[3,"Unless you are a CIA employee or have special permission, you won’t be able to step inside, let alone enjoy a cup of coffee.","당신이 CIA 직원이거나 특별 허가를 받지 않는다면, 커피 한 잔을 즐기는 것은커녕, 안으로 들어설 수도 없을 것이다."]],"w":"let alone ~은 ‘~은 말할 것도 없고, ~은커녕’. 안에 들어서지도 못하니 커피를 마시는 것은 당연히 불가능하다는 뜻.","c":3}},{"n":8,"t":"match","q":"Which is true according to the passage?","ko":"본문과 일치하는 것은?","oko":["이 스타벅스는 CIA 건물 근처의 호텔에 있다.","영수증에는 매장의 실제 이름이 나와 있다.","바리스타들은 건물 안을 자유롭게 돌아다닐 수 있다.","이 커피숍은 CIA 직원들에게 작지만 위로가 되는 일상의 맛을 선사한다."],"opts":["This Starbucks is in a hotel near the CIA building.","The receipts show the real name of the store.","Baristas can move around the building freely.","This coffee shop gives CIA employees a small but comforting taste of ordinary life."],"r":{"a":"4) This coffee shop gives CIA employees a small but comforting taste of ordinary life. (이 커피숍은 CIA 직원들에게 작지만 위로가 되는 일상의 맛을 선사한다.)","ev":"9번 문장","s":[[9,"For CIA employees working under immense pressure in their high-stress work environment, this coffee shop offers a small but comforting taste of ordinary life.","스트레스가 심한 업무 환경에서 엄청난 압박을 견디며 일하는 CIA 직원들에게, 이 커피숍은 작지만 위로가 되는 일상의 맛을 선사한다."]],"w":"9번에서 this coffee shop offers a small but comforting taste of ordinary life라고 함. ①은 CIA 본부 안에 있음, ②영수증은 Store Number 1만 적힘, ③바리스타는 안내원 없이 못 돌아다님.","c":4,"k":null},"h":"2644cc4a38"},{"n":9,"t":"sum","q":"There is a (A) Starbucks store that you won’t find on any (B).","ko":"어떤 (B)에서도 찾을 수 없는 (A) 스타벅스 매장이 있다.","opts":["(A) ordinary / (B) map","(A) secret / (B) menu","(A) secret / (B) map","(A) famous / (B) menu","(A) crowded / (B) street"],"r":{"a":"3) (A) secret / (B) map ((A) 비밀스러운 / (B) 지도)","ev":"1번 문장","s":[[1,"There is a “secret” Starbucks store that you won’t (A) find / miss on any map.","당신이 어떤 지도에서도 찾지 못할 ‘비밀스러운’ 스타벅스 매장이 있다."]],"w":"1번에서 a \"secret\" Starbucks store that you won't find on any map이라고 함.","c":3,"k":null},"oko":["(A) 평범한 / (B) 지도","(A) 비밀 .","하지만 신경이 직접 부딪히거나 자극을 받으면, 그것은 간지러움, 화끈거림, 또는 전기 충격 같은 감각의 다른 종류의 통증을 유발한다."]],"w":"8번 문장: 신경을 직접 맞으면 간지럽거나 화끈거리거나 전기 충격 같은 ‘다른 종류’의 통증이 생김. 같은 통증이라는 진술이 틀림.","c":"F"}},{"n":3,"t":"tf","q":"The word “humerus” sounds like “humorous.”","h":"7b7e853680","ko":"‘humerus’라는 단어는 ‘humorous’처럼 들린다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"First, the word “humerus” sounds like “humorous,” which means funny.","첫째로, ‘humerus’라는 단어는 ‘humorous’처럼 들리는데, 그것은 재미있다는 뜻이다."]],"w":"11번 문장: the word “humerus” sounds like “humorous,” which means funny. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"In the sentence “…to cushion the impact,” what does the underlined word mean?","h":"cb2aeb5e92","ko":"‘충격을 완충하기 위한’ 문장에서 밑줄 친 cushion의 뜻은?","opts":["전달하다","완충 작용을 하다","증가시키다","없애다"],"word":"cushion","r":{"a":"2) 완충 작용을 하다","ev":"5번 문장","s":[[5,"Since there’s little muscle or fat in the area to cushion the impact, the nearby nerve, called the ulnar nerve, can be easily irritated.","이 부위에는 충격을 완화해 줄 근육이나 지방이 거의 없기 때문에, 척골 신경이라고 불리는 인근의 신경이 쉽게 자극받을 수 있다."]],"w":"5번 문장: little muscle or fat … to cushion the impact. 충격을 흡수해 줄 근육·지방이 없다는 뜻이므로 cushion = 완충 작용을 하다.","c":2}},{"n":5,"t":"vocab","q":"In the sentence “the odd feeling that you get,” what does the underlined word mean?","ko":"‘the odd feeling’에서 밑줄 친 odd의 뜻은?","opts":["강한","평범한","기억에 남는","이상한, 기이한"],"word":"odd","r":{"a":"4) 이상한, 기이한","ev":"12번 문장","s":[[12,"Second, the odd feeling that you get when you hit your elbow can be described as “funny.”","둘째로, 당신이 팔꿈치를 부딪혔을 때 받는 묘한 느낌이 ‘funny’하다고 묘사될 수 있다."]],"w":"12번 문장: the odd feeling that you get when you hit your elbow. 1번 문장의 very unusual sensation과 같은 의미 흐름이므로 odd = 이상한, 기이한. 평범한은 반대 뜻.","c":4},"h":"04abdfe915"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThis irritation feels different from the usual pain of bumps or bruises because it’s caused by a nerve.","ko":"밑줄 친 it이 가리키는 것은?","opts":["이 자극(this irritation)","평소의 통증","멍","팔꿈치"],"r":{"a":"1) 이 자극(this irritation)","ev":"6번 문장","s":[[6,"This irritation feels different from the usual pain of bumps or bruises because it’s caused by a nerve.","이러한 자극은 신경에서 비롯되었기 때문에 타박상이나 멍에서 오는 일반적인 통증과는 다르게 느껴진다."]],"w":"6번에서 This irritation feels different ... because it's caused by a nerve라고 함. it은 문장 주어 This irritation.","c":1,"k":"it = 이 자극(this irritation)"},"sko":"이러한 자극은 신경에서 비롯되었기 때문에 타박상이나 멍에서 오는 일반적인 통증과는 다르게 느껴진다.","pron":"it","h":"0d2629ccd1"},{"n":7,"t":"sense","q":"What does sentence 13, “Although the feeling might not be funny at the moment,” mean?","h":"98dc4db495","ko":"13번 문장 ‘Although the feeling might not be funny at the moment’의 의미는?","sko":"그 느낌이 그 순간에는 재미있지 않을 수도 있지만","opts":["팔꿈치를 부딪히면 항상 웃음이 난다","그 느낌은 부딪힌 뒤에 곧 사라진다","부딪힌 그 순간에는 그 느낌이 웃기지 않을 수도 있다","그 느낌은 사람마다 완전히 다르다"],"r":{"a":"3) 부딪힌 그 순간에는 그 느낌이 웃기지 않을 수도 있다","ev":"13번 문장","s":[[13,"Although the feeling might not be funny at the moment, it’s certainly a memorable experience for anyone who’s hit their elbow.","그 느낌이 그 순간에는 재미있지 않을 수도 있지만, 팔꿈치를 부딪혀 본 사람이라면 누구에게나 분명 기억에 남는 경험이다."]],"w":"13번 문장: might not be funny at the moment = 그 순간에는 웃기지 않을 수도 있음. 뒤에 it’s certainly a memorable experience가 이어져 대비를 이룸.","c":3}},{"n":8,"t":"match","q":"Which is true according to the passage?","ko":"글의 내용과 일치하는 것은?","oko":["funny bone은 팔꿈치에 있는 실제 뼈이다.","‘funny bone’이라는 이름은 두 가지 이유에서 비롯되었다.","팔꿈치 부위에는 충격을 완화해 줄 지방이 많다.","‘funny bone’이라는 이름은 1900년대에 의사들이 붙였다."],"opts":["The funny bone is an actual bone in the elbow.","The name “funny bone” comes from two reasons.","The elbow area has a lot of fat to cushion the impact.","The name “funny bone” was given by doctors in the 1900s."],"r":{"a":"2) The name “funny bone” comes from two reasons. (‘funny bone’이라는 이름은 두 가지 이유에서 비롯되었다.)","ev":"10번 문장","s":[[10,"The name comes from two reasons.","그 이름은 두 가지 이유에서 비롯된다."]],"w":"10번에서 The name comes from two reasons라고 함. ①은 실제 뼈가 아니라 신경, ③은 충격을 완화할 지방이 거의 없음, ④는 본문에 없는 내용.","c":2,"k":null},"h":"f0645e434d"},{"n":9,"t":"sum","q":"The feeling may not be funny at the moment, but it is certainly a (A) (B) for anyone who has hit their elbow.","ko":"그 느낌은 그 순간에는 재미있지 않을 수도 있지만, 팔꿈치를 부딪혀 본 사람이라면 누구에게나 분명 (A) (B)이다.","opts":["(A) forgettable / (B) experience","(A) memorable / (B) prize","(A) memorable / (B) experience","(A) boring / (B) joke","(A) painless / (B) game"],"r":{"a":"3) (A) memorable / (B) experience ((A) 기억에 남는 / (B) 경험)","ev":"13번 문장","s":[[13,"Although the feeling might not be funny at the moment, it’s certainly a memorable experience for anyone who’s hit their elbow.","그 느낌이 그 순간에는 재미있지 않을 수도 있지만, 팔꿈치를 부딪혀 본 사람이라면 누구에게나 분명 기억에 남는 경험이다."]],"w":"13번에서 it's certainly a memorable experience for anyone who's hit their elbow라고 함.","c":3,"k":null},"oko":["(A) 잊기 쉬운 / (B) 경험","(A) 기억에 남는 / (B) 상","(A) 기억에 남는 / (B) 경험","(A) 지루한 / (B) 농담","(A) 고통 없는 / (B) 게임"],"h":"9491665a7b"},{"n":10,"t":"fill","q":"When you bump your elbow, you might hit the [A] of your elbow [B], near the humerus.","ko":"당신이 팔꿈치를 부딪히면, 상완골 근처에 있는 팔꿈치 [B]의 [A]을(를) 건드릴 수도 있다.","bko":{"outside":"바깥쪽","joint":"관절","signals":"신호","tickling":"간지러움","impact":"충격","electric":"전기의"},"bank":["outside","joint","signals","tickling","impact","electric"],"r":{"a":"[A] outside (바깥쪽), [B] joint (관절)","ev":"4번 문장","s":[[4,"When you bump your elbow, you might hit the outside of your elbow joint, near the humerus.","당신이 팔꿈치를 부딪히면, 당신은 상완골 근처의 팔꿈치 관절의 바깥쪽을 건드릴 수도 있다."]],"w":"4번에서 you might hit the outside of your elbow joint, near the humerus라고 함.","c":null,"k":null},"h":"718802876e"}]},{"u":11,"id":"r32","no":32,"ko":"18세기의 감자 대왕","items":[{"n":1,"t":"tf","q":"The grave of Frederick the Great is decorated with fresh potatoes left by visitors.","h":"c3d4284e30","ko":"프리드리히 대왕의 무덤은 방문객들이 놓고 간 신선한 감자로 장식되어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"There’s a king whose grave is decorated with fresh potatoes left by visitors.","방문객들이 남긴 신선한 감자로 무덤이 장식된 왕이 있다."],[2,"This is the resting place of Frederick the Great, the 18th-century king of Prussia.","이곳은 18세기 프로이센의 왕인 Frederick 대왕의 안식처이다."]],"w":"1~2번 문장: a king whose grave is decorated with fresh potatoes left by visitors; this is the resting place of Frederick the Great. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Frederick placed guards around the fields to make potatoes seem cheap.","h":"addaa5efb9","ko":"왕은 감자가 값싸 보이도록 밭 주위에 경비병을 세웠다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"He even placed guards around the fields to make them seem valuable.","그는 심지어 그것들이 귀중하게 보이도록 만들기 위해 밭 주변에 경비병을 배치했다."]],"w":"11번 문장: guards를 세운 이유는 cheap이 아니라 valuable(귀중해 보이게)하기 위함. 이유가 뒤집힘.","c":"F"}},{"n":3,"t":"tf","q":"Frederick declared potatoes “royal vegetables” and planted them in the farmers’ fields.","h":"385ecb297b","ko":"왕은 감자를 ‘왕실 채소’라고 선포하고 농부들의 밭에 심었다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"He declared potatoes “royal vegetables” and planted them near his palace.","그는 감자를 ‘왕실 채소’로 선언하고 자신의 궁전 근처에 심었다."]],"w":"10번 문장: planted them near his palace. 심은 곳은 농부들의 밭이 아니라 궁전 근처. 장소가 뒤집힘.","c":"F"}},{"n":4,"t":"vocab","q":"In the sentence “began cultivating potatoes on their own land,” what does the underlined word mean?","h":"90d9a8c91f","ko":"‘began cultivating potatoes on their own land’에서 밑줄 친 cultivating의 뜻은? (동사 cultivate의 -ing형)","opts":["재배하는 것","수확하는 것","수출하는 것","요리하는 것"],"word":"cultivating","r":{"a":"1) 재배하는 것","ev":"13번 문장","s":[[13,"People grew curious about the “royal” vegetable and began cultivating potatoes on their own land.","사람들은 그 ‘왕실’ 채소에 대해 호기심을 갖게 되었고 자신의 땅에 감자를 재배하기 시작했다."]],"w":"13번 문장: 사람들이 호기심을 갖고 자기 땅에서 감자를 키우기 시작함. cultivate = 재배하다, cultivating은 그 -ing형.","c":1}},{"n":5,"t":"vocab","q":"In the sentence “During Frederick’s rule, many Prussians struggled with hunger,” what does the underlined word mean?","h":"680803cfc4","ko":"‘During Frederick’s rule, many Prussians struggled with hunger’에서 rule의 뜻은? (‘규칙’이 아님에 주의)","opts":["규칙","의견","통치, 지배","계획"],"word":"rule","r":{"a":"3) 통치, 지배","ev":"5번 문장","s":[[5,"During Frederick’s rule, many Prussians struggled with hunger.","Frederick의 통치 기간 동안, 많은 프로이센 사람들은 굶주림에 시달렸다."]],"w":"5번 문장: During Frederick’s rule = 프리드리히의 통치 기간 동안. rule은 ‘규칙’ 외에 명사 ‘통치, 지배’ 뜻이 있고 여기서는 통치.","c":3}},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHe realized that potatoes, newly introduced to Europe from South America, were the perfect solution. However, their unattractive appearance made people think they were unpleasant to eat or even poisonous.","ko":"밑줄 친 they가 가리키는 것은?","opts":["감자","사람들","농부들","왕"],"r":{"a":"1) 감자","ev":"7번 문장","s":[[7,"He realized that potatoes, newly introduced to Europe from South America, were the perfect solution. However, their unattractive appearance made people think they were unpleasant to eat or even poisonous.","그는 남아메리카에서 유럽으로 새로 도입된 감자가 완벽한 해결책이라는 것을 깨달았다. 그러나, 그것들의 매력적이지 않은 외형은 사람들로 하여금 그것들이 먹기에 불쾌하거나 심지어 독성이 있다고 생각하게 했다."]],"w":"7번: their unattractive appearance made people think they were unpleasant to eat. 불쾌하거나 독이 있다고 생각된 것은 앞에서 말한 potatoes(감자).","c":1,"k":"they = 감자"},"sko":"그러나, 그것들의 매력적이지 않은 외형은 사람들로 하여금 그것들이 먹기에 불쾌하거나 심지어 독성이 있다고 생각하게 했다.","pron":"they","h":"024fb96ffa"},{"n":7,"t":"sense","q":"What does the sentence “Frederick helped improve food security in his kingdom” (15번) mean?","h":"d3486471f9","ko":"15번 문장 ‘Frederick helped improve food security in his kingdom’의 의미는?","sko":"Frederick은 자신의 왕국의 식량 안보를 개선하는 데 도움을 주었다.","opts":["프리드리히는 왕국의 식량 가격을 올렸다","프리드리히는 왕국의 식량 안정을 개선하는 데 도움을 주었다","프리드리히는 다른 나라에서 곡식을 사 왔다","프리드리히는 왕국의 농업을 금지했다"],"r":{"a":"2) 프리드리히는 왕국의 식량 안정을 개선하는 데 도움을 주었다","ev":"15번 문장","s":[[15,"By encouraging smart farming solutions, Frederick helped improve food security in his kingdom.","Frederick은 영리한 농업 전략을 장려함으로써, 자신의 왕국의 식량 안보를 개선하는 데 도움을 주었다."]],"w":"15번 문장: helped improve food security = 식량 안정을 개선하는 데 도움을 줌. 앞의 By encouraging smart farming solutions가 그 방법.","c":2}},{"n":8,"t":"match","q":"Which is true according to the passage?","ko":"글의 내용과 일치하는 것은?","oko":["감자는 Frederick 이전부터 오랫동안 프로이센에서 재배되어 왔다.","프로이센 농민들은 왕이 명령하자마자 기꺼이 감자를 재배했다.","감자는 시간이 지나면서 프로이센에서 매우 중요한 식량이 되었다.","감자는 오늘날 독일 요리에서 더 이상 중요하지 않다."],"opts":["Potatoes had been grown in Prussia for a long time before Frederick.","Prussian farmers happily grew potatoes as soon as the king ordered it.","Potatoes became a very important food in Prussia over time.","Potatoes are no longer important in German cuisine today."],"r":{"a":"3) Potatoes became a very important food in Prussia over time. (감자는 시간이 지나면서 프로이센에서 매우 중요한 식량이 되었다.)","ev":"14번 문장","s":[[14,"Over time, potatoes became a vital source in Prussia, and remain important in German cuisine today.","시간이 지나면서, 감자는 프로이센에 매우 중요한 식량원이 되었으며, 오늘날에도 독일 요리에서 여전히 중요하다."]],"w":"14번에서 Over time, potatoes became a vital source in Prussia라고 함. ①은 왕 이전에는 거부, ②농민들은 거부, ④오늘날에도 중요함.","c":3,"k":null},"h":"ffd52bb919"},{"n":9,"t":"sum","q":"Frederick earned this (A) for making potatoes a (B) food for his people.","ko":"Frederick은 감자를 백성들의 (B) 식량으로 만든 공로로 이 (A)을(를) 얻었다.","opts":["(A) title / (B) luxury","(A) punishment / (B) staple","(A) title / (B) staple","(A) punishment / (B) poisonous","(A) rumor / (B) luxury"],"r":{"a":"3) (A) title / (B) staple ((A) 칭호 / (B) 주된)","ev":"4번 문장","s":[[4,"He earned this title for making potatoes a staple food for his people.","그는 감자를 백성들의 주식으로 만든 공로로 이 별명을 얻었다."]],"w":"4번에서 He earned this title for making potatoes a staple food for his people이라고 함.","c":3,"k":null},"oko":["(A) 칭호 / (B) 사치스러운","(A) 벌 / (B) 주된","(A) 칭호 / (B) 주된","(A) 벌 / (B) 독성이 있는","(A) 소문 / (B) 사치스러운"],"h":"6713072009"},{"n":10,"t":"fill","q":"The king needed to find a food [A] that was both [B] and easy to grow.","ko":"왕은 [B] 데다 재배하기도 쉬운 식량 [A]을(를) 찾아야 했다.","bko":{"source":"공급원, 원천","inexpensive":"값싼","curious":"호기심이 많은","royal":"왕실의","declared":"선언했다","guards":"경비병들"},"bank":["source","inexpensive","curious","royal","declared","guards"],"r":{"a":"[A] source (공급원, 원천), [B] inexpensive (값싼)","ev":"6번 문장","s":[[6,"The king needed to find a food source that was both inexpensive and easy to grow.","왕은 값싸고 재배하기 쉬운 식량원을 찾아야 했다."]],"w":"6번에서 find a food source that was both inexpensive and easy to grow라고 함.","c":null,"k":null},"h":"ef89f2a061"}]},{"u":11,"id":"r33","no":33,"ko":"산업혁명에서 시작되었어요","items":[{"n":1,"t":"tf","q":"Eating three meals a day is a relatively new habit.","h":"3feb1276c2","ko":"하루 세 끼를 먹는 것은 비교적 새로운 습관이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"But did you know this habit is relatively new?","하지만 이러한 습관이 비교적 최근의 것이라는 사실을 알고 있었는가?"]],"w":"2번 문장: did you know this habit is relatively new? 하루 세 끼 습관이 비교적 새롭다는 내용과 일치.","c":"T"}},{"n":2,"t":"tf","q":"In the past, most people ate at the same fixed times every day.","h":"c4d204251d","ko":"과거에는 대부분의 사람들이 매일 같은 정해진 시간에 식사했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Most people ate whenever food was available or when it fit their daily activities, such as farming or hunting.","대부분의 사람들은 음식이 있을 때마다 또는 농사나 사냥과 같은 그들의 일상 활동과 맞을 때 식사를 했다."]],"w":"4번 문장: 음식이 있을 때나 일상 활동에 맞을 때 먹었음. 정해진 시간이 있었다는 진술이 반대.","c":"F"}},{"n":3,"t":"tf","q":"In the evening, factory workers ate their meals at the factory with their coworkers.","h":"604b4d2dae","ko":"저녁에 공장 노동자들은 공장에서 동료들과 식사했다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"(b) Finally, in the evening, they returned home to share a meal with their families.","마지막으로, 저녁에는, 집으로 돌아와 가족과 식사를 함께 했다."]],"w":"9번 문장: in the evening, they returned home to share a meal with their families. 식사 장소·상대가 뒤집힘(집, 가족).","c":"F"}},{"n":4,"t":"vocab","q":"In the sentence “people had to adjust their meal times,” what does the underlined word mean?","h":"d6d7df5185","ko":"‘people had to adjust their meal times’에서 adjust의 뜻은?","opts":["거부하다","조절하다, 맞추다","줄이다","시작하다"],"word":"adjust","r":{"a":"2) 조절하다, 맞추다","ev":"6번 문장","s":[[6,"As factory work became a central part of daily life, people had to adjust their meal times to fit strict work schedules.","공장 일이 일상생활의 중심이 되면서, 사람들은 엄격한 근무 일정에 맞추기 위해 식사 시간을 조정해야 했다."]],"w":"6번 문장: adjust their meal times to fit strict work schedules. 일정에 맞춰 식사 시간을 조절한다는 뜻.","c":2}},{"n":5,"t":"vocab","q":"In the sentence “The idea of eating three set meals became widespread,” what does the underlined word mean?","h":"ad57e62776","ko":"‘eating three set meals’에서 set의 뜻은? (‘놓다’ 뜻이 아님에 주의)","opts":["정해진","따뜻한","한 벌의","값비싼"],"word":"set","r":{"a":"1) 정해진","ev":"12번 문장","s":[[12,"(e) The idea of eating three set meals became widespread and settled in many cultures.","세 끼 정해진 식사를 한다는 개념은 널리 퍼져 많은 문화권에 자리 잡았다."]],"w":"12번 문장: three set meals = 정해진 세 끼 식사. set은 동사 ‘놓다’ 외에 형용사 ‘정해진’ 뜻이 있고 여기서는 정해진.","c":1}},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nInitially, this eating schedule was created to fit work needs, but it later became a daily habit for families and communities.","ko":"밑줄 친 it이 가리키는 것은?","opts":["공장 일","가족","이 식사 일정","산업혁명"],"r":{"a":"3) 이 식사 일정","ev":"10번 문장","s":[[10,"(c) Initially, this eating schedule was created to fit work needs, but it later became a daily habit for families and communities.","처음에는, 이 식사 일정이 업무상의 필요에 맞추기 위해 만들어졌지만, 이후에는 가족들과 지역 사회의 일상적인 습관이 되었다."]],"w":"10번: this eating schedule was created ... but it later became a daily habit. it은 앞의 this eating schedule.","c":3,"k":"it = 이 식사 일정"},"sko":"처음에는, 이 식사 일정이 업무상의 필요에 맞추기 위해 만들어졌지만, 이후에는 가족들과 지역 사회의 일상적인 습관이 되었다.","pron":"it","h":"56ac266c2f"},{"n":7,"t":"sense","q":"What does the sentence “…brought significant changes to eating habits” (5번) tell us about the Industrial Revolution?","ko":"5번 문장 ‘brought significant changes to eating habits’가 말하는 산업혁명의 영향은?","sko":"식사 습관에 중대한 변화를 가져왔다","opts":["산업혁명 이전에는 식습관이 정해져 있었다","산업혁명 때문에 사람들이 식사를 줄였다","산업혁명 이후 식량 생산이 크게 늘었다","산업혁명 이후 사람들의 식사 방식이 이전과 크게 달라졌다"],"r":{"a":"4) 산업혁명 이후 사람들의 식사 방식이 이전과 크게 달라졌다","ev":"5번 문장","s":[[5,"However, the Industrial Revolution in Europe and the U.S. during the 18th and 19th centuries brought significant changes to eating habits.","그러나, 18세기와 19세기 동안의 유럽과 미국의 산업혁명은 식사 습관에 중대한 변화를 가져왔다."]],"w":"5번 문장: brought significant changes to eating habits = 식습관에 중대한 변화를 가져옴. 앞의 However가 과거(4번)의 불규칙한 식사와 대비시킴.","c":4},"h":"20ae2ae651"},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"4f5873dce0","ko":"글의 내용과 일치하는 것은?","oko":["과거에 사람들은 항상 정해진 시간에 세 끼를 먹었다.","공장 노동자들은 재충전하기 위해 오후에 식사 휴식을 가졌다.","산업혁명은 아시아에서만 일어났다.","세 끼 식사 습관은 가정에서 시작되어 나중에 공장으로 퍼졌다."],"opts":["People in the past always ate three meals at fixed times.","Factory workers took a meal break in the afternoon to recharge.","The Industrial Revolution happened only in Asia.","The three-meal habit started in families and later spread to factories."],"r":{"a":"2) Factory workers took a meal break in the afternoon to recharge.","ev":"4, 5, 8, 10번 문장","s":[[4,"Most people ate whenever food was available or when it fit their daily activities, such as farming or hunting.","대부분의 사람들은 음식이 있을 때마다 또는 농사나 사냥과 같은 그들의 일상 활동과 맞을 때 식사를 했다."],[5,"However, the Industrial Revolution in Europe and the U.S. during the 18th and 19th centuries brought significant changes to eating habits.","그러나, 18세기와 19세기 동안의 유럽과 미국의 산업혁명은 식사 습관에 중대한 변화를 가져왔다."],[8,"(a) In the afternoon, they took a meal break to recharge and continue their hard work.","오후에는, 그들이 재충전하고 힘든 일을 계속하기 위해 식사하는 휴식을 가졌다."],[10,"(c) Initially, this eating schedule was created to fit work needs, but it later became a daily habit for families and communities.","처음에는, 이 식사 일정이 업무상의 필요에 맞추기 위해 만들어졌지만, 이후에는 가족들과 지역 사회의 일상적인 습관이 되었다."]],"w":"8번 문장: In the afternoon, they took a meal break to recharge. 1번 선지는 4번, 3번 선지는 5번(Europe and the U.S.), 4번 선지는 10번(처음엔 업무상의 필요)과 어긋남.","c":2}},{"n":9,"t":"sum","q":"Factory workers began the day with a (A) meal to (B) for the long hours ahead.","ko":"공장 노동자들은 앞으로의 긴 시간을 (B)하기 위해 (A) 식사로 하루를 시작했다.","opts":["(A) late / (B) prepare","(A) morning / (B) forget","(A) morning / (B) prepare","(A) late / (B) forget","(A) cold / (B) complain"],"r":{"a":"3) (A) morning / (B) prepare ((A) 아침 / (B) 준비하다)","ev":"7번 문장","s":[[7,"They began the day with a morning meal to prepare for the long hours ahead.","그들은 앞으로의 긴 (노동) 시간을 대비하기 위해 아침 식사로 하루를 시작했다."]],"w":"7번에서 They began the day with a morning meal to prepare for the long hours ahead라고 함.","c":3,"k":null},"oko":["(A) 늦은 / (B) 준비하다","(A) 아침 / (B) 잊다","(A) 아침 / (B) 준비하다","(A) 늦은 / (B) 잊다","(A) 차가운 / (B) 불평하다"],"h":"6772c22787"},{"n":10,"t":"fill","q":"It has [A] to this day and remains a common [B] around the world.","ko":"그것은 오늘날까지 [A], 전 세계적으로 일반적인 [B](으)로 남아 있다.","bko":{"continued":"이어져 왔다(continue의 과거분사)","practice":"관행","adjust":"조정하다","recharge":"재충전하다","initially":"처음에는","relatively":"비교적"},"bank":["continued","practice","adjust","recharge","initially","relatively"],"r":{"a":"[A] continued (이어져 왔다(continue의 과거분사)), [B] practice (관행)","ev":"13번 문장","s":[[13,"It has continued to this day and remains a common practice around the world.","그것은 오늘날까지 이어져 오며 전 세계적으로 일반적인 관행으로 남아 있다."]],"w":"13번에서 It has continued to this day and remains a common practice라고 함.","c":null,"k":null},"h":"7c3a21efa6"}]},{"u":12,"id":"r34","no":34,"ko":"거친 바람 속으로 돌격!","items":[{"n":1,"t":"tf","q":"Storm chasers start their work by analyzing weather information.","h":"6cd3b86b9a","ko":"폭풍 추적자들은 날씨 정보를 분석하는 것으로 일을 시작한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"Each chase begins with preparation.","각 추적은 준비로 시작된다."],[5,"We start by analyzing weather forecasts, radar images, and reports to find the best spot where a tornado might form.","우리는 토네이도가 형성될지도 모르는 최적의 지점을 찾기 위해 일기예보, 레이더 이미지, 그리고 보고서를 분석하는 것으로 시작한다."]],"w":"5번에서 일기예보, 레이더 이미지, 보고서를 분석하는 것으로 시작한다고 함. 진술과 일치.","c":"T"}},{"n":2,"t":"tf","q":"Storm chasers always see a funnel cloud when they drive out.","h":"4a7c5bb589","ko":"폭풍 추적자들은 차를 몰고 나가면 항상 깔때기 구름을 본다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Some days, we drive for hours without seeing a single funnel cloud.","어떤 날엔, 우리가 몇 시간 동안 운전해도 깔때기 구름 하나를 보지 못하기도 한다."]],"w":"9번에서 몇 시간을 운전해도 깔때기 구름을 하나도 못 보는 날이 있다고 함. always가 틀림.","c":"F"}},{"n":3,"t":"tf","q":"Storm chasers sometimes use weather balloons to collect information from inside a storm.","h":"3273166eda","ko":"폭풍 추적자들은 때때로 기상 풍선을 이용해 폭풍 내부의 정보를 수집한다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"Sometimes, we even launch weather balloons to collect information from inside the storm.","때때로, 우리는 폭풍 내부의 정보를 수집하기 위해 기상 풍선을 발사하기도 한다."]],"w":"13번에서 기상 풍선을 띄워 폭풍 내부 정보를 수집한다고 함. 진술과 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What does the underlined word mean? 'Once we decide, we grab our gear and head out.'","h":"05e5760ff8","ko":"다음 문장의 밑줄 친 단어의 뜻은? '결정하면 우리는 gear를 챙겨 출발한다.'","opts":["지도","장비","소식","속도"],"word":"gear","r":{"a":"2) 장비","ev":"7번 문장","s":[[7,"Once we decide, we grab our gear and head out.","일단 우리가 결정을 내리면, 우리는 장비를 집어 들고 밖으로 향한다."]],"w":"gear는 '장비, 도구'. 결정한 뒤 챙겨서 출발하는 것이므로 장비가 문맥에 맞음.","c":2}},{"n":5,"t":"vocab","q":"What does the underlined word mean in this sentence? 'When most people see dark skies and swirling clouds, they run for cover.'","h":"5a4d8e874d","ko":"다음 문장에서 밑줄 친 cover의 뜻은? '대부분의 사람들은 어두운 하늘과 소용돌이치는 구름을 보면 cover로 달려간다.'","opts":["책의 표지","이불 같은 덮개","몸을 피할 곳","보험 보장"],"word":"cover","r":{"a":"3) 몸을 피할 곳","ev":"1번 문장","s":[[1,"When most people see dark skies and swirling clouds, they run for cover.","대부분의 사람들은 어두운 하늘과 소용돌이치는 구름을 보면, 몸을 피할 곳을 찾아 달아난다."]],"w":"cover는 '덮개, 표지' 외에 run for cover에서 '몸을 피할 곳'(= shelter). 폭풍을 보고 달려가는 곳이므로 피신처.","c":3}},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nOur mission is to study and document powerful storms, like tornadoes, to help scientists understand them better and improve safety for others.","ko":"밑줄 친 them이 가리키는 것은?","opts":["과학자들","강력한 폭풍(토네이도 등)","폭풍 추적자들","다른 사람들"],"r":{"a":"2) 강력한 폭풍(토네이도 등)","ev":"3번 문장","s":[[3,"Our mission is to study and document powerful storms, like tornadoes, to help scientists understand them better and improve safety for others.","우리의 임무는 토네이도와 같은 강력한 폭풍을 연구하고 기록하여, 과학자들이 그것들을 더 잘 이해하고 다른 사람들의 안전을 향상시키도록 돕는 것이다."]],"w":"3번: to study and document powerful storms ... to help scientists understand them better. them은 앞의 powerful storms.","c":2,"k":"them = 강력한 폭풍(토네이도 등)"},"sko":"우리의 임무는 토네이도와 같은 강력한 폭풍을 연구하고 기록하여, 과학자들이 그것들을 더 잘 이해하고 다른 사람들의 안전을 향상시키도록 돕는 것이다.","pron":"them","h":"c455f14ce1"},{"n":7,"t":"sense","q":"Which is closest in meaning to 'Storm chasing is anything but predictable.'?","h":"439774fc15","ko":"'Storm chasing is anything but predictable.'과 의미가 가장 가까운 것은?","sko":"폭풍을 추적하는 일은 결코 예측할 수 없다.","opts":["폭풍 추적은 예측하기 매우 쉬운 일이다.","폭풍 추적은 예측 외에는 아무것도 아니다.","폭풍 추적은 결코 예측할 수 있는 일이 아니다.","폭풍 추적은 예측 가능한 일 중 하나이다."],"r":{"a":"3) 폭풍 추적은 결코 예측할 수 있는 일이 아니다.","ev":"8번 문장","s":[[8,"Storm chasing is anything but predictable.","폭풍을 추적하는 일은 결코 예측할 수 없다."]],"w":"anything but = 결코 ~이 아닌. 따라서 결코 예측 가능하지 않다는 뜻. 바로 뒤 9번에서 깔때기 구름을 못 보는 날도 있다고 이어짐.","c":3}},{"n":8,"t":"match","q":"Which is true according to the passage?","h":"36b80dc9cc","ko":"본문의 내용과 일치하는 것은?","oko":["폭풍 추적자들은 소용돌이치는 구름을 보면 몸을 피할 곳으로 달려간다.","폭풍 추적자들은 매일 몇 시간씩 운전하며 항상 깔때기 구름을 본다.","폭풍 추적자들은 폭풍에서 멀리 떨어져 있기 위해 기상 풍선을 발사한다.","폭풍 추적자들의 데이터는 기상학자들이 사람들에게 안전한 곳으로 갈 시간을 주도록 돕는다."],"opts":["Storm chasers run for cover when they see swirling clouds.","Storm chasers drive for hours every day and always see a funnel cloud.","Storm chasers launch weather balloons to stay away from the storm.","Storm chasers' data helps meteorologists give people time to get to safety."],"r":{"a":"4) Storm chasers' data helps meteorologists give people time to get to safety.","ev":"17번 문장","s":[[17,"The data we collect helps meteorologists issue faster, more accurate warnings, giving people time to get to safety.","우리가 수집하는 데이터는 기상학자들이 더 빠르고, 더 정확한 경보를 발령할 수 있게 도와주어, 사람들이 안전한 곳으로 갈 시간을 준다."]],"w":"17번에서 모은 데이터가 기상학자의 경보를 도와 사람들이 안전한 곳으로 갈 시간을 준다고 함. ①은 일반 사람들(1번), ②는 9번, ③은 13번(정보 수집 목적)과 다름.","c":4}},{"n":9,"t":"sum","q":"Storm chasing is (A) work, but helping others while witnessing nature’s (B) power makes every chase worth it.","ko":"폭풍 추적은 (A) 일이지만, 다른 이들을 돕는 동시에 자연의 (B) 위력을 목격하는 것은 모든 추적을 가치 있게 한다.","opts"
