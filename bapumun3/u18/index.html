 "044-4"], "gap": "", "words": [["fly", "비행기를 타고 가다"], ["perform", "공연하다"], ["storm", "폭풍우"], ["cancel", "취소하다"], ["overnight", "하룻밤 동안"]], "h1": "첫 문장은 '지난 주말 뉴욕에서 밴드 공연을 보려고 비행기를 타려 했다'예요. 이어질 사건의 원인을 가장 먼저 찾아보세요.", "h2": "첫 문장 바로 뒤에는 기대와 반대되는 사정이 나오는 문장이 이어져요. 마지막 결론을 말하는 Therefore 문장은 어디쯤 와야 할지 생각해 보세요.", "why": "폭풍우(C), 그 결과 항공 취소(A), 게다가 호텔 만실(D), 그래서 공항에서 하룻밤(B) 순서가 자연스러워요.", "opts": [{"n": "①", "en": "(A) - (C) - (B) - (D)", "ko": "(A), (C), (B), (D) 순서", "ok": false, "why": "(A) 결과가 먼저 나오면 원인인 폭풍우가 뒤에 와서 어색해요."}, {"n": "②", "en": "(B) - (C) - (D) - (A)", "ko": "(B), (C), (D), (A) 순서", "ok": false, "why": "(B) 공항에서 자야 했다는 결론이 맨 앞에 올 수 없어요."}, {"n": "③", "en": "(B) - (D) - (A) - (C)", "ko": "(B), (D), (A), (C) 순서", "ok": false, "why": "(B)가 맨 앞이라서 틀려요."}, {"n": "④", "en": "(C) - (A) - (B) - (D)", "ko": "(C), (A), (B), (D) 순서", "ok": false, "why": "(B) Therefore는 (D) 뒤의 상황까지 포함한 결론이라 (D) 앞에 오면 어색해요."}, {"n": "⑤", "en": "(C) - (A) - (D) - (B)", "ko": "(C), (A), (D), (B) 순서", "ok": true, "why": "폭풍우, 항공 취소, 호텔 만실, 공항에서 잠 순서로 자연스러워요."}], "pencil": "흐름은 원인, 결과, 덧붙임, ___ 순으로 이어진다", "pencilKey": "결론", "page": 184, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "예시·결과 / 역접·첨가를 나타내는 접속부사", "type": "mc", "ans": "②", "concept": ["044-2", "044-3", "044-4"], "gap": "", "words": [["fluent", "유창한"], ["population", "인구"], ["demand", "수요"], ["matter", "중요하다"], ["attention", "관심"]], "h1": "however가 들어갈 자리에는 앞 문장과 반대되는 내용이 와야 해요. 다섯 문장 중 반대 흐름이 아닌 것을 찾으세요.", "h2": "각 문장 쌍이 서로 반대 흐름인지, 원인과 결과인지 하나씩 따져 보세요.", "why": "②는 '인구가 늘어서 식량 수요가 증가한다'라는 결과라서 However가 어색해요. 나머지는 모두 반대 흐름이에요.", "opts": [{"n": "①", "en": "Sharon has never been to Spain. ___, she's fluent in Spanish.", "ko": "Sharon은 스페인에 가 본 적이 없다. 그러나 그녀는 스페인어에 유창하다.", "ok": false, "why": "'가 본 적 없는데 유창하다'라서 반대 흐름이에요."}, {"n": "②", "en": "We have a growing population. ___, the demand for food is increasing.", "ko": "우리는 늘어나는 인구가 있다. 그래서 식량 수요가 증가하고 있다.", "ok": true, "why": "결과라서 However가 어색해요."}, {"n": "③", "en": "Losing at games doesn't matter to some people. Other people, ___, can't stand it.", "ko": "게임에서 지는 것이 어떤 사람들에게는 중요하지 않다. 그러나 다른 사람들은 참을 수 없다.", "ok": false, "why": "두 부류를 대조해서 반대 흐름이에요."}, {"n": "④", "en": "Alex laughed loudly to draw people's attention. ___, no one cared about him.", "ko": "Alex는 사람들의 관심을 끌려고 크게 웃었다. 그러나 아무도 그에게 신경 쓰지 않았다.", "ok": false, "why": "기대와 반대라서 반대 흐름이에요."}, {"n": "⑤", "en": "The war between the two countries ended. ___, the peace did not last long.", "ko": "두 나라의 전쟁이 끝났다. 그러나 평화는 오래가지 않았다.", "ok": false, "why": "반대 흐름이라서 어울려요."}], "pencil": "결과를 말하는 문장 앞에는 however가 아니라 ___ 를 쓴다", "pencilKey": "therefore", "page": 184, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "예시·결과 / 역접·첨가를 나타내는 접속부사", "type": "mc", "ans": "①", "concept": ["044-2", "044"], "gap": "", "words": [["eat", "먹다"], ["nothing", "아무것도 ~ 않다"], ["all day", "하루 종일"], ["hungry", "배고픈"]], "h1": "'Mike와 Judy는 하루 종일 아무것도 먹지 못했다.' 이 문장에 자연스럽게 이어질 말을 찾으세요.", "h2": "아무것도 먹지 못한 것의 결과로 어떤 상태가 되었을지 상상해 보세요. 결과를 이끄는 접속부사가 알맞은 보기를 찾으세요.", "why": "하루 종일 아무것도 먹지 못했으니 '그러므로 그들은 매우 배가 고팠다'가 가장 자연스러워요.", "opts": [{"n": "①", "en": "Therefore, they were very hungry.", "ko": "그러므로 그들은 매우 배가 고팠다.", "ok": true, "why": "원인과 결과가 자연스럽게 이어져서 맞아요."}, {"n": "②", "en": "In brief, they had a delicious breakfast.", "ko": "요컨대 그들은 맛있는 아침을 먹었다.", "ok": false, "why": "하루 종일 먹지 못했다는 말과 모순이라서 틀려요."}, {"n": "③", "en": "However, they couldn't go a step further.", "ko": "그러나 그들은 한 걸음도 더 갈 수 없었다.", "ok": false, "why": "'그러나'가 반대 흐름이라서 어색해요."}, {"n": "④", "en": "In other words, they ate three meals a day.", "ko": "다시 말해서 그들은 하루 세 끼를 먹었다.", "ok": false, "why": "먹었다는 말과 모순이라서 틀려요."}, {"n": "⑤", "en": "For example, they tried to eat healthy food.", "ko": "예를 들어 그들은 건강한 음식을 먹으려 했다.", "ok": false, "why": "앞 문장의 예가 아니라서 틀려요."}], "pencil": "원인을 말한 뒤 그 결과를 말할 때는 ___ 를 쓴다", "pencilKey": "therefore", "page": 184, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "통합형", "type": "mc", "ans": "⑤", "concept": ["044-4", "044-5", "044-6"], "gap": "", "words": [["club leader", "동아리 회장"], ["support", "지지하다"], ["member", "회원"]], "h1": "'Edward는 매우 똑똑한 동아리 회장이다. Yet 대부분의 회원들은 그를 지지하지 않는다.' 밑줄 친 Yet이 어떤 뜻인지 풀어 보세요.", "h2": "똑똑한데 지지받지 못한다는 반대 흐름이에요. Yet과 같은 뜻의 접속부사를 찾으세요.", "why": "Yet은 '그럼에도 불구하고'라는 양보의 뜻이라서 Nevertheless와 바꿔 쓸 수 있어요.", "opts": [{"n": "①", "en": "Therefore", "ko": "그러므로", "ok": false, "why": "결과를 말해서 틀려요."}, {"n": "②", "en": "Finally", "ko": "마침내", "ok": false, "why": "마침내라는 뜻이라서 틀려요."}, {"n": "③", "en": "Besides", "ko": "게다가", "ok": false, "why": "덧붙이는 뜻이라서 틀려요."}, {"n": "④", "en": "Furthermore", "ko": "더욱이", "ok": false, "why": "덧붙이는 뜻이라서 틀려요."}, {"n": "⑤", "en": "Nevertheless", "ko": "그럼에도 불구하고", "ok": true, "why": "Yet과 같은 양보의 뜻이라서 맞아요."}], "pencil": "yet은 nevertheless와 같은 ___ 의 뜻이다", "pencilKey": "양보", "page": 184, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "통합형", "type": "mc", "ans": "④", "concept": ["044-4", "044-5", "044-6"], "gap": "", "words": [["science", "과학"], ["math", "수학"], ["art", "미술"], ["worry", "걱정하다"], ["stop", "멈추다"]], "h1": "두 묶음을 따로 풀어요. 첫째는 과학과 수학은 잘하지만 미술은 잘 못한다는 대조, 둘째는 비가 안 그칠까 걱정했는데 5일째 그쳤다는 이야기예요.", "h2": "첫째 빈칸은 문장 끝에 쓰는 접속부사이고, 둘째 빈칸은 오래 걱정하던 일이 마침내 풀린 흐름이에요.", "why": "첫째는 문장 끝의 though(하지만), 둘째는 걱정하다가 마침내 그친 At last가 알맞아요.", "opts": [{"n": "①", "en": "instead - In addition", "ko": "그 대신에 - 게다가", "ok": false, "why": "두 빈칸 모두 뜻이 안 맞아요."}, {"n": "②", "en": "in brief - As a result", "ko": "요컨대 - 그 결과", "ok": false, "why": "두 빈칸 모두 뜻이 안 맞아요."}, {"n": "③", "en": "as a result - Still", "ko": "그 결과 - 그럼에도 불구하고", "ok": false, "why": "첫 번째가 결과가 아니라서 틀려요."}, {"n": "④", "en": "though - At last", "ko": "하지만 - 마침내", "ok": true, "why": "두 빈칸 모두 뜻에 맞아요."}, {"n": "⑤", "en": "above all - In fact", "ko": "무엇보다도 - 사실은", "ok": false, "why": "두 빈칸 모두 뜻이 안 맞아요."}], "pencil": "오랜 기다림 끝의 일은 ___ (마침내)로 시작한다", "pencilKey": "at last", "page": 185, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "통합형", "type": "mc", "ans": "⑤", "concept": ["044-4", "044-5", "044-6"], "gap": "", "words": [["recognize", "알아보다"], ["immediately", "즉시"], ["deep", "깊은"], ["worth", "가치가 있는"]], "h1": "<보기>의 밑줄 친 Still은 'David를 20년 동안 못 봤다. Still, 나는 그를 바로 알아봤다'에서 쓰였어요. 어떤 뜻인지 풀어 보세요.", "h2": "여기서 Still은 '그럼에도 불구하고'라는 접속부사예요. still에는 '고요한', '여전히', '움직이지 않는' 등의 뜻도 있으니 헷갈리지 마세요.", "why": "<보기>의 Still은 '그럼에도 불구하고'라는 뜻이고, ⑤의 Still, it's worth asking도 같은 뜻이에요.", "opts": [{"n": "①", "en": "Still waters run deep.", "ko": "고요한 물이 깊이 흐른다.", "ok": false, "why": "still이 '고요한'이라는 형용사라서 달라요."}, {"n": "②", "en": "I woke up and felt like I was still dreaming.", "ko": "나는 일어났는데도 여전히 꿈을 꾸는 것 같았다.", "ok": false, "why": "still이 '여전히'라는 부사라서 달라요."}, {"n": "③", "en": "Some people think paper books are still better than e-books.", "ko": "어떤 사람들은 종이책이 전자책보다 훨씬 낫다고 생각한다.", "ok": false, "why": "still이 비교급을 강조하는 '훨씬'이라서 달라요."}, {"n": "④", "en": "It's important to stay still while the MRI scan is running.", "ko": "MRI 촬영 중에는 가만히 있는 것이 중요하다.", "ok": false, "why": "still이 '움직이지 않는'이라서 달라요."}, {"n": "⑤", "en": "He'll probably say, \"No.\" Still, it's worth asking.", "ko": "그는 아마 '아니오'라고 말할 것이다. 그래도 물어볼 가치는 있다.", "ok": true, "why": "still이 '그럼에도 불구하고'라는 접속부사라서 같아요."}], "pencil": "접속부사 still은 ___ (그럼에도 불구하고)라는 뜻이다", "pencilKey": "nevertheless", "page": 185, "sec": "s3"}, {"id": "S3-08", "step": 3, "no": 8, "qtype": "기타 접속부사", "type": "write", "ans": "In other words", "concept": ["044-4", "044-5", "044-6"], "gap": "", "words": [["important", "중요한"], ["health", "건강"], ["exercise", "운동하다"], ["regularly", "규칙적으로"]], "h1": "우리말은 '다시 말해서, 건강을 위해 할 가장 중요한 일은 규칙적으로 운동하는 것이다'예요. 맨 앞의 '다시 말해서'를 영어로 세 단어로 쓰세요.", "h2": "'다시 말해서'는 앞에서 한 말을 다른 말로 풀어 줄 때 쓰는 세 단어짜리 접속부사예요. 문장 맨 앞이라 첫 글자는 대문자예요.", "why": "앞에서 말한 것을 다른 말로 설명할 때 쓰는 접속부사는 In other words예요.", "opts": [], "pencil": "'다시 말해서'는 in other ___ 이다", "pencilKey": "words", "page": 185, "sec": "s3"}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "예시·결과를 나타내는 접속부사", "type": "write", "ans": "For instance", "concept": ["044-2", "044"], "gap": "", "words": [["gesture", "몸짓"], ["culture", "문화"], ["mean", "의미하다"], ["country", "나라"]], "h1": "앞 문장은 '어떤 몸짓은 문화마다 다른 뜻을 가진다'이고 뒤 문장은 'OK 손짓은 어떤 나라에서 돈을 뜻한다'예요. 뒤 문장이 앞 문장의 무엇인지 보세요.", "h2": "주어진 철자는 F예요. 구체적인 예를 들 때 쓰는 두 단어 접속부사를 쓰세요.", "why": "OK 손짓은 앞 내용의 한 예예요. For instance(예를 들어)가 알맞아요.", "opts": [], "pencil": "예를 들 때는 for ___ 를 쓴다", "pencilKey": "instance", "page": 185, "sec": "s3"}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "기타 접속부사", "type": "write", "ans": "In contrast", "concept": ["044-4", "044-5", "044-6"], "gap": "", "words": [["few", "거의 없는"], ["friend", "친구"], ["help", "돕다"]], "h1": "Jessica는 도와줄 친구가 거의 없고, Peter는 도와줄 친구가 많아요. 두 사람을 맞대어 말하고 있어요.", "h2": "주어진 철자는 In과 c예요. '대조적으로'를 뜻하는 접속부사를 쓰세요.", "why": "앞뒤 내용이 서로 대조를 이루므로 In contrast(대조적으로)가 알맞아요.", "opts": [], "pencil": "서로 맞서는 두 내용은 in ___ 로 이어 준다", "pencilKey": "contrast", "page": 185, "sec": "s3"}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "통합형", "type": "write", "ans": "yet을 therefore [또는 thus]로", "concept": ["044-2", "044"], "gap": "", "words": [["simple", "간단한"], ["learn", "배우다"], ["fast", "빨리"]], "h1": "첫 문장은 '프로그램이 매우 쉽고 간단하니까 빨리 배울 수 있다'예요. 같은 뜻으로 바꾼 문장의 and yet이 알맞은지 보세요.", "h2": "yet은 '하지만'이라는 반대 흐름이에요. 쉽고 간단해서 빨리 배운다는 것은 결과를 말해요. 결과를 이끄는 말로 바꾸세요.", "why": "yet은 역접이라서 so와 같은 뜻의 결과를 나타내는 therefore[thus]로 고쳐요.", "opts": [], "pencil": "so와 같은 결과의 접속부사는 ___ 또는 thus이다", "pencilKey": "therefore", "page": 185, "sec": "s3"}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "기타 접속부사", "type": "write", "ans": "Otherwise", "concept": ["044-4", "044-5", "044-6"], "gap": "", "words": [["weather", "날씨"], ["get better", "좋아지다"], ["cancel", "취소하다"], ["picnic", "소풍"]], "h1": "If it doesn't get better는 '날씨가 좋아지지 않으면'이라는 뜻이에요. 한 단어 접속부사로 바꾸세요.", "h2": "조건의 if가 not과 함께 쓰이면 '그렇지 않으면'이라는 뜻의 접속부사로 바꿀 수 있어요. O로 시작하는 한 단어예요.", "why": "if ~ not은 otherwise(그렇지 않으면)와 같은 뜻이에요.", "opts": [], "pencil": "if ~ not은 한 단어 ___ 로 바꿀 수 있다", "pencilKey": "otherwise", "page": 185, "sec": "s3"}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "역접·첨가를 나타내는 접속부사", "type": "write", "ans": "On the other hand", "concept": ["044-4", "044-5", "044-3"], "gap": "", "words": [["part-time job", "아르바이트"], ["satisfying", "만족스러운"], ["well-paying", "보수가 좋은"]], "h1": "첫 문장은 '아르바이트가 별로 만족스럽지 않았다'이고 뒤 문장은 '보수는 좋았다'예요. though로 두 문장을 이어서 반대 흐름을 말하고 있어요.", "h2": "though와 같은 뜻으로 '맞서는 두 면'을 말하는 네 단어짜리 접속부사예요.", "why": "만족스럽지 않았지만 보수는 좋았다는 대조라서 On the other hand(반면에)가 알맞아요.", "opts": [], "pencil": "서로 맞서는 두 면은 on the ___ hand로 말한다", "pencilKey": "other", "page": 185, "sec": "s3"}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "역접·첨가를 나타내는 접속부사", "type": "write", "ans": "Moreover", "concept": ["044-4", "044-5", "044-3"], "gap": "", "words": [["adverb", "부사"], ["add to", "덧붙이다"], ["support", "뒷받침하다"], ["tiring", "피곤하게 하는"], ["expensive", "비싼"]], "h1": "영영풀이는 '앞에서 말한 것에 덧붙이거나 뒷받침하는 정보를 이끄는 말'이에요. 비행기 여행은 피곤하고, 일반적으로 비싸다는 말이 이어져요.", "h2": "주어진 철자는 M이에요. '더욱이'를 뜻하는 첨가의 접속부사를 쓰세요.", "why": "비행기 여행이 피곤하다는 것에 비싸다는 점을 덧붙이므로 Moreover(더욱이)가 알맞아요.", "opts": [], "pencil": "'더욱이'는 ___ 이다", "pencilKey": "moreover", "page": 185, "sec": "s3"}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "역접·첨가를 나타내는 접속부사", "type": "write", "ans": "The school was old and badly heated. Besides, it was too far from their house.", "concept": ["044-4", "044-5", "044-3"], "gap": "", "words": [["badly heated", "난방이 잘 안 되는"], ["far", "먼"], ["besides", "게다가"]], "h1": "두 문장은 학교의 나쁜 점을 계속 말하고 있어요. 보기의 세 접속부사 중 어느 것이 이 흐름에 맞는지 정하세요.", "h2": "단점을 하나 더 덧붙이는 흐름이에요. nevertheless는 반대, as a result는 결과라서 맞지 않아요. 첨가의 접속부사를 두 번째 문장 맨 앞에 쓰세요.", "why": "학교가 낡고 난방이 안 되는데다 집에서 너무 멀기까지 하다는 덧붙임이라서 Besides가 알맞아요.", "opts": [], "pencil": "단점이나 이유를 덧붙일 때는 ___ (게다가)를 쓴다", "pencilKey": "besides", "page": 185, "sec": "s3"}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "통합형", "type": "mc", "ans": "③", "concept": ["044-2", "044-3", "044-4"], "gap": "", "words": [["badly", "형편없이"], ["organize", "정리하다"], ["brilliant", "훌륭한"], ["energy", "에너지"], ["enthusiasm", "열정"], ["sense of humor", "유머 감각"], ["difficult", "어려운"]], "h1": "세 쌍의 문장을 하나씩 우리말로 풀어서 앞뒤 관계를 정해 보세요. 첫째 빈칸 앞은 '에세이가 엉망이었다'예요.", "h2": "에세이가 엉망인 것과 훌륭한 아이디어가 있다는 것은 같은 방향일까요, 반대 방향일까요? 나머지 두 쌍도 같은 방식으로 따져 보세요.", "why": "첫째 Nevertheless(그럼에도 불구하고), 둘째 Besides(게다가), 셋째 In fact(사실은)가 알맞아요.", "opts": [{"n": "①", "en": "Furthermore - Besides - In fact", "ko": "더욱이 - 게다가 - 사실은", "ok": false, "why": "첫째가 반대 흐름인데 Furthermore는 첨가라서 틀려요."}, {"n": "②", "en": "Therefore - Otherwise - In contrast", "ko": "그러므로 - 그렇지 않으면 - 대조적으로", "ok": false, "why": "세 곳 모두 뜻이 안 맞아요."}, {"n": "③", "en": "Nevertheless - Besides - In fact", "ko": "그럼에도 불구하고 - 게다가 - 사실은", "ok": true, "why": "세 곳 모두 뜻에 맞아요."}, {"n": "④", "en": "Therefore - Above all - At last", "ko": "그러므로 - 무엇보다도 - 마침내", "ok": false, "why": "세 곳 모두 뜻이 안 맞아요."}, {"n": "⑤", "en": "Nevertheless - Otherwise - In contrast", "ko": "그럼에도 불구하고 - 그렇지 않으면 - 대조적으로", "ok": false, "why": "둘째와 셋째가 틀려요."}], "pencil": "앞과 반대되는 흐름은 ___ (그럼에도 불구하고)로 이어 준다", "pencilKey": "nevertheless", "page": 186, "sec": "s4"}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "통합형", "type": "mc", "ans": "⑤", "concept": ["044-2", "044-3", "044-4"], "gap": "", "words": [["possibility", "가능성"], ["recover", "회복하다"], ["for sure", "확실히"], ["for ages", "오랫동안"]], "h1": "두 문장의 빈칸이 같은 단어예요. 첫째는 '그가 회복할 가능성이 있다 ___ 의사들은 확신하지 못한다', 둘째는 문장 끝에 와서 '나는 그녀를 오랫동안 못 봤다, ___'예요.", "h2": "첫 빈칸은 두 절을 이어 주는 자리이고, 둘째 빈칸은 문장 끝에 오는 자리예요. 두 자리에 모두 쓸 수 있는 단어를 찾으세요.", "why": "though는 접속사(비록 ~이지만)와 접속부사(그렇지만) 둘 다로 쓰여서 두 문장에 모두 맞아요.", "opts": [{"n": "①", "en": "besides", "ko": "게다가", "ok": false, "why": "접속사로는 쓸 수 없고 뜻도 안 맞아요."}, {"n": "②", "en": "however", "ko": "그러나", "ok": false, "why": "접속사가 아니라서 첫 문장에서 두 절을 이을 수 없어요."}, {"n": "③", "en": "nevertheless", "ko": "그럼에도 불구하고", "ok": false, "why": "접속사가 아니라서 첫 문장에서 두 절을 이을 수 없어요."}, {"n": "④", "en": "finally", "ko": "마침내", "ok": false, "why": "두 문장 모두 뜻이 안 맞아요."}, {"n": "⑤", "en": "though", "ko": "비록 ~이지만 / 그렇지만", "ok": true, "why": "접속사와 접속 첨가 Moreover, (2) 양보 Nevertheless, (3) 예시 For instance를 두 번째 문장 맨 앞에 써요.", "opts": [], "pencil": "덧붙임은 moreover, 양보는 nevertheless, 예시는 for ___ 이다", "pencilKey": "instance", "page": 186, "sec": "s4"}, {"id": "S4-05", "step": 4, "no": 5, "qtype": "통합형", "type": "write", "ans": "However, As a result, For example, Also", "concept": ["044-2", "044-3", "044-4"], "gap": "", "words": [["pollution", "오염"], ["survey", "조사"], ["wildlife", "야생 동물"], ["migrate", "이동하다"], ["artificial", "인공의"]], "h1": "네 빈칸을 앞뒤 문장 관계로 하나씩 정하세요. 첫째는 '익숙하다 ___ 빛 공해는 모른다', 둘째는 '하늘이 밝다 ___ 수면 방해', 셋째는 '야생 생물도 위협 ___ 새들', 넷째는 '새들이 죽는다 ___ 바다거북도'예요.", "h2": "보기는 as a result, also, for example, however예요. 각 빈칸 앞뒤 문장이 반대, 결과, 예시, 덧붙임 중 무엇인지 하나씩 정해서 짝지으세요.", "why": "(1) However, (2) As a result, (3) For example, (4) Also 순서로 들어가요.", "opts": [], "pencil": "결과는 as a result, 예시는 for example, 덧붙임은 ___ 이다", "pencilKey": "also", "page": 186, "sec": "s4"}, {"id": "Q-01", "step": 5, "no": 1, "qtype": "어법상 옳은 문장 고르기", "type": "mc", "ans": "a", "concept": ["044"], "gap": "", "words": [["shine", "빛나다"], ["quite", "꽤"], ["cold", "추운"]], "h1": "두 문장은 yet과 besides만 달라요. 해가 비치는 것과 추운 것은 같은 방향인지 반대인지 생각해 보세요.", "h2": "해가 비치면 보통 따뜻하다고 생각해요. 예상과 반대되는 내용을 이어 주는 말이 필요해요.", "why": "해가 비치는데 춥다는 반대 흐름이라서 '하지만'을 뜻하는 yet이 알맞아요.", "opts": [{"n": "a", "en": "The sun was shining, yet it was quite cold.", "ko": "해가 비치고 있었지만 꽤 추웠다.", "ok": true, "why": "yet이 반대 흐름을 이어서 맞아요."}, {"n": "b", "en": "The sun was shining, besides it was quite cold.", "ko": "해가 비치고 있었고 게다가 꽤 추웠다.", "ok": false, "why": "besides는 덧붙이는 뜻이라서 반대 내용과 안 맞아요."}], "pencil": "'해가 비치지만 추웠다'의 연결은 ___ 로 한다", "pencilKey": "yet", "page": 187, "sec": "q"}, {"id": "Q-02", "step": 5, "no": 2, "qtype": "어법상 옳은 문장 고르기", "type": "mc", "ans": "b", "concept": ["044"], "gap": "", "words": [["raise funds", "자금을 모으다"], ["on time", "제때"], ["give up", "포기하다"], ["project", "프로젝트"]], "h1": "자금을 못 모은 일과 프로젝트를 포기한 일이 원인과 결과인지 확인하세요.", "h2": "돈을 못 모았으면 프로젝트를 포기하는 것이 자연스러워요. 원인에서 나온 결과를 이끄는 말을  if(its.length===0){app.innerHTML='<div class="card">문항이 없어요.</div>';return}
 if(st.idx>=its.length){app.innerHTML=summary();return}
 var d=its[st.idx],r=rec(d.id);
 var h='<div class="nums">';
 its.forEach(function(x,i){var rr=rec(x.id);h+='<button class="nb'+(i===st.idx?' cur':'')+(rr.done?(rr.right?' ok':' ng'):'')+'" onclick="goIdx('+i+')">'+x.no+'</button>'});
 h+='<button class="nb" onclick="goIdx('+its.length+')" title="결과">결과</button></div>';
 h+='<div class="card"><span class="tag">'+esc(STEPS[st.tab].name)+' · '+d.no+'번</span><div class="qt">'+esc(d.qtype)+(d.page?' · 교재 '+d.page+'쪽':'')+'</div>';
 if(!r.done){
  h+='<button class="btn s" onclick="useHint(\''+d.id+'\',1)">'+(r.h>=1?'먼저 볼 것 (열려 있어요)':'먼저 볼 것 보기')+'</button>';
  if(r.h>=1){
   h+='<div class="hint">'+hl(d.h1)+'</div>';
   if(d.words&&d.words.length){h+='<div class="lab">단어 뜻</div><div class="chips">'+d.words.map(function(w){return '<span><b>'+esc(w[0])+'</b> '+esc(w[1])+'</span>'}).join("")+'</div>'}
   if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
   if(r.h<2)h+='<button class="btn g" onclick="useHint(\''+d.id+'\',2)">아직 막혀요 · 한 걸음 더</button>';
  }
  if(r.h>=2)h+='<div class="hint two">'+hl(d.h2)+'</div>';
  if(d.type==="mc"){
   var labs=d.opts.map(function(o){return o.n});
   var multi=d.ans.indexOf(",")>=0,sel=r.sel||[];
   h+='<div class="choices'+(labs.length===2?' two':'')+'">'+labs.map(function(l){return '<button class="ch" style="'+(multi&&sel.indexOf(l)>=0?'background:var(--soft);border-color:var(--a)':'')+'" onclick="'+(multi?'tog':'pick')+'(\''+d.id+'\',\''+l+'\')">'+esc(l)+'</button>'}).join("")+'</div>';
   h+=multi?'<div class="meter">정답이 두 개예요. 모두 누른 뒤 확인을 눌러요</div><button class="btn p" onclick="confirmMulti(\''+d.id+'\')">확인</button>':'<div class="meter">책의 답을 골라 누르면 바로 확인돼요</div>';
  }else{
   h+='<div class="paper">책 문제 밑에 답을 직접 써 보세요. 다 쓰면 아래 버튼을 눌러요.</div>';
   h+='<button class="btn p" onclick="showW(\''+d.id+'\')">정답 확인</button>';
  }
 }else{
  h+=answerView(d,r);
 }
 h+='</div>';
 h+='<div class="nav">'+(st.idx>0?'<button class="btn g" onclick="goIdx('+(st.idx-1)+')">이전</button>':'')+'<button class="btn p" onclick="goIdx('+(st.idx+1)+')">'+(st.idx+1>=its.length?'결과 보기':'다음 문제')+'</button></div>';
 app.innerHTML=h;
}
function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
