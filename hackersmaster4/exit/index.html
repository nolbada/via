"n":6,"t":"ref","q":"What does the underlined \"those\" refer to?\nMuch of the waste is the unsold inventory of major clothing retailers, especially those driving fast-fashion trends.","ko":"밑줄 친 those가 가리키는 것은?","sko":"폐기물의 대부분은 주요 의류 소매업체, 특히 패스트패션 트렌드를 주도하는 업체들의 팔리지 않은 재고이다.","opts":["패스트패션을 사는 소비자들","팔리지 않은 재고","의류 소매업체들","사막 지역 주민들"],"r":{"a":"3) 의류 소매업체들","ev":"6번 문장","s":[[6,"Much of the waste is the unsold inventory of major clothing retailers, especially those driving fast-fashion trends.","폐기물의 대부분은 주요 의류 소매업체, 특히 패스트패션 트렌드를 주도하는 업체들의 팔리지 않은 재고이다."]],"w":"those driving fast-fashion trends는 '패스트패션 트렌드를 이끄는 업체들'이에요. 바로 앞의 복수 명사 clothing retailers(의류 소매업체들)를 가리켜요.","c":3},"h":"2bdfd2e8a9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Making matters worse, the discarded clothing sometimes catches fire accidentally or is burned intentionally in an attempt to get rid of it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"설상가상으로, 버려진 옷들은 때때로 우연히 불이 붙거나 그것을 제거하려는 시도로 의도적으로 태워지기도 한다.","opts":["버려진 옷은 모두 의도적으로 태워져서 재활용된다.","버려진 옷은 소방관들이 일부러 불을 꺼서 치워진다.","다행히도 버려진 옷은 불에 타지 않아 오염 물질이 나오지 않는다.","설상가상으로 버려진 옷은 가끔 우연히 불이 붙거나, 없애려고 일부러 태워지기도 한다."],"r":{"a":"4) 설상가상으로 버려진 옷은 가끔 우연히 불이 붙거나, 없애려고 일부러 태워지기도 한다.","ev":"10번 문장","s":[[10,"Making matters worse, the discarded clothing sometimes catches fire accidentally or is burned intentionally in an attempt to get rid of it.","설상가상으로, 버려진 옷들은 때때로 우연히 불이 붙거나 그것을 제거하려는 시도로 의도적으로 태워지기도 한다."]],"w":"Making matters worse는 '설상가상으로', accidentally는 '우연히', intentionally는 '의도적으로'예요. 불이 붙는 경우와 일부러 태우는 경우 둘 다 나쁜 일로 이어지고 재활용과는 관련이 없어요.","c":4},"h":"77ea6a9b21"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["패션쇼는 재활용 소재로 만든 옷을 팔려는 목적이다.","사막에 버려진 의류의 정확한 양은 알려져 있다.","버려진 옷을 태우면 주민들의 건강에 해로운 오염 물질이 나온다.","패스트패션 소매업체는 팔리지 않은 옷을 모두 모아 다시 쓴다."],"opts":["The fashion show aims to sell clothes made from recycled materials.","The exact amount of clothing dumped in the desert is known.","Burning the discarded clothing releases pollutants that harm residents’ health.","Fast-fashion retailers collect all unsold clothes and reuse them."],"r":{"a":"3) Burning the discarded clothing releases pollutants that harm residents’ health.","ev":"10~11번 문장","s":[[10,"Making matters worse, the discarded clothing sometimes catches fire accidentally or is burned intentionally in an attempt to get rid of it.","설상가상으로, 버려진 옷들은 때때로 우연히 불이 붙거나 그것을 제거하려는 시도로 의도적으로 태워지기도 한다."],[11,"In either case, large amounts of pollutants are released into the atmosphere, causing respiratory illnesses and other health problems for area residents.","어느 경우든, 다량의 오염 물질이 대기로 방출되어 지역 주민들에게 호흡기 질환과 기타 건강 문제를 일으킨다."]],"w":"10~11번 문장에서 옷이 타면 오염 물질이 대기로 나와 주민들에게 호흡기 질환과 건강 문제를 일으킨다고 해요. 패션쇼의 목적은 인식을 높이는 것이고(3번), 정확한 양은 알 수 없고(4번), 팔리지 않은 재고는 사막에 버려져요(6~7번).","c":3},"h":"e09f579f35"},{"n":9,"t":"sum","q":"The writer says the only real solution is for (A) to stop buying short-lived fashion and for the clothing industry to adopt (B) business practices.","ko":"필자는 유일한 진정한 해결책이 (A)이(가) 수명이 짧은 패션 구매를 멈추고 의류 산업이 (B) 사업 관행을 채택하는 것이라고 말한다.","oko":["(A) 소비자 / (B) 지속 가능한","(A) 정부 / (B) 지속 가능한","(A) 소비자 / (B) 수익성 있는","(A) 모델 / (B) 수익성 있는","(A) 소매업체 / (B) 지속 가능한"],"opts":["(A) consumers / (B) sustainable","(A) governments / (B) sustainable","(A) consumers / (B) profitable","(A) models / (B) profitable","(A) retailers / (B) sustainable"],"r":{"a":"1) (A) consumers / (B) sustainable (A) 소비자 / (B) 지속 가능한","ev":"13번 문장","s":[[13,"The only real solution is for consumers to cease consumption of short-lived fashion and pressure the clothing industry into adopting sustainable business practices.","유일한 진정한 해결책은 소비자들이 수명이 짧은 패션의 소비를 중단하고 의류 산업이 지속 가능한 사업 관행을 채택하도록 압력을 가하는 것이다."]],"w":"13번 문장에서 유일한 진정한 해결책은 소비자(consumers)가 수명이 짧은 패션 소비를 중단하고, 의류 산업이 지속 가능한(sustainable) 사업 관행을 채택하도록 압력을 가하는 것이라고 해요. 정부나 모델은 이 해결책의 주체가 아니고, 수익성에 대한 말도 없어요.","c":1},"h":"59321dce06"},{"n":10,"t":"fill","q":"The goal of this unusual event is to raise [A] about the ecological issues caused by the massive [B] of textile waste in the region.","ko":"이 특이한 행사의 목표는 이 지역에서 섬유 폐기물이 막대하게 쌓인 [B](으)로 인해 발생하는 생태학적 문제에 대한 [A]을(를) 높이는 것이다.","bank":["awareness","unusual","barren","buildup","discarded","devastating"],"bko":{"awareness":"인식","unusual":"특이한","barren":"황량한","buildup":"쌓임","discarded":"버려진","devastating":"심각한"},"r":{"a":"[A] awareness (인식), [B] buildup (쌓임)","ev":"3번 문장","s":[[3,"The goal of this unusual event is to raise awareness about the ecological issues caused by the massive buildup of textile waste in the region.","이 특이한 행사의 목표는 이 지역에 쌓인 막대한 섬유 폐기물로 인해 발생하는 생태학적 문제에 대한 인식을 높이는 것이다."]],"w":"3번 문장은 이 행사의 목표가 섬유 폐기물이 막대하게 쌓인 것(buildup)으로 생긴 생태학적 문제에 대한 인식(awareness)을 높이는 것이라는 내용이에요. raise 뒤와 the massive 뒤에는 명사가 와야 해서 형용사는 들어갈 수 없어요.","c":null},"h":"8d1e9d4202"}]},{"u":6,"id":"ms4-06-1","no":1,"ko":"멈출 수 없는 춤의 저주","items":[{"n":1,"t":"tf","q":"Frau Troffea started dancing in Strasbourg in 1518.","ko":"Frau Troffea는 1518년에 스트라스부르에서 춤을 추기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In 1518, a woman named Frau Troffea abruptly started dancing in Strasbourg, a city in modern-day France.","1518년, Frau Troffea라는 이름의 한 여성이 현대 프랑스의 도시인 스트라스부르에서 갑자기 춤을 추기 시작했다."]],"w":"3번 문장에 In 1518, a woman named Frau Troffea abruptly started dancing in Strasbourg가 그대로 나와요.","c":"T"},"h":"b68ede94f5"},{"n":2,"t":"tf","q":"Doctors prescribed rest to cure the dancing plague.","ko":"의사들은 춤추는 전염병을 고치려고 휴식을 처방했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"To expel the contaminated substance, doctors prescribed a treatment they believed would be effective: more movement.","오염된 물질을 배출하기 위해, 의사들은 효과적이라 믿었던 치료법을 처방했는데, 바로 더 많은 움직임이었다."]],"w":"7번 문장에서 처방한 치료법은 휴식이 아니라 more movement(더 많은 움직임)예요. 오염된 피를 내보내려고 오히려 더 움직이게 했어요.","c":"F"},"h":"3f998347fd"},{"n":3,"t":"tf","q":"Today, stress is regarded as the most probable cause of the outbreak.","ko":"오늘날 스트레스가 발병의 가장 유력한 원인으로 여겨진다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Today, overwhelming stress is regarded as the most probable cause for the outbreak, as Europeans at the time faced starvation from famine, flooding, multiple contagious diseases, and the constant threat of war.","오늘날, 압도적인 스트레스가 그 발병의 가장 유력한 원인으로 간주되는데, 당시 유럽인들은 기근으로 인한 굶주림, 홍수, 다수의 전염병, 그리고 끊임없는 전쟁의 위협에 직면해 있었기 때문이다."]],"w":"10번 문장에서 overwhelming stress(압도적인 스트레스)가 the most probable cause로 간주된다고 해요.","c":"T"},"h":"1bff5a76bf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (She twisted, jumped, and jerked her arms uncontrollably through the streets.)","ko":"그녀는 거리 곳곳에서 통제할 수 없이 몸을 비틀고, 점프하고, 팔을 홱홱 움직였다.","opts":["천천히","통제할 수 없이","조용히","즐겁게"],"word":"uncontrollably","r":{"a":"2) 통제할 수 없이","ev":"4번 문장","s":[[4,"She twisted, jumped, and jerked her arms uncontrollably through the streets.","그녀는 거리 곳곳에서 통제할 수 없이 몸을 비틀고, 점프하고, 팔을 홱홱 움직였다."]],"w":"4번에서 Troffea는 스스로 멈출 수 없는 듯 몸을 비틀고 점프하고 팔을 홱홱 움직였어요. uncontrollably는 통제할 수 없이라는 뜻이에요.","c":2},"h":"e92e96a2e2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...while some tragically perished from heart attacks or strokes.)","ko":"...반면 일부는 비극적으로 심장마비나 뇌졸중으로 ...했다.","opts":["회복했다","도망쳤다","고통받았다","사망했다"],"word":"perished","r":{"a":"4) 사망했다","ev":"8번 문장","s":[[8,"The city erected stages and hired musicians, and the mania persisted for two months until many collapsed from extreme exhaustion, while some tragically perished from heart attacks or strokes.","도시는 무대를 세우고 음악가들을 고용했고, 그 광기는 많은 사람이 극심한 탈진으로 쓰러질 때까지 두 달 동안 지속되었다. 반면 일부는 비극적으로 심장마비나 뇌졸중으로 사망했다."]],"w":"8번에서 perish는 심장마비나 뇌졸중이라는 원인과 tragically(비극적으로)에 이어져 '사망하다'라는 뜻이에요. 앞 절의 collapsed(쓰러졌다)와 while로 대조되어 더 심한 결과가 나와요.","c":4},"h":"4ff082cfe3"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nLocal doctors struggled to identify what caused this incomprehensible event, and then finally diagnosed the victims with “hot blood,” a condition they believed resulted from contaminated blood trapped in the body.","ko":"밑줄 친 they가 가리키는 것은?","sko":"지역 의사들은 이 이해할 수 없는 사건의 원인이 무엇인지 밝혀내느라 고군분투했고, 마침내 희생자들을 “뜨거운 피”라고 진단했는데, 그들은 이것이 체내에 갇힌 오염된 피에서 비롯된 질환이라고 믿었다.","opts":["희생자들","도시 사람들","지역 의사들","음악가들"],"r":{"a":"3) 지역 의사들","ev":"6번 문장","s":[[6,"Local doctors struggled to identify what caused this incomprehensible event, and then finally diagnosed the victims with “hot blood,” a condition they believed resulted from contaminated blood trapped in the body.","지역 의사들은 이 이해할 수 없는 사건의 원인이 무엇인지 밝혀내느라 고군분투했고, 마침내 희생자들을 “뜨거운 피”라고 진단했는데, 그들은 이것이 체내에 갇힌 오염된 피에서 비롯된 질환이라고 믿었다."]],"w":"hot blood가 오염된 피에서 생겼다고 '믿은' 사람은 진단을 내린 쪽, 즉 이 문장의 주어인 Local doctors예요. 가장 가까운 명사 victims(희생자들)에 속지 않도록 주의하세요.","c":3},"h":"2c90cb65fd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But lacking definitive evidence, this remains only a theory, leaving the dancing plague an enigma in history.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 결정적인 증거가 부족하여, 이것은 단지 이론으로만 남아 있고, 춤추는 전염병을 역사의 수수께끼로 남겨두고 있다.","opts":["결정적인 증거가 없어서 이 설명은 이론일 뿐이고, 춤추는 전염병은 여전히 수수께끼로 남아 있다.","결정적인 증거가 충분해서 이 설명은 사실로 확인되었고, 춤추는 전염병의 수수께끼는 풀렸다.","이 설명이 이론에서 사실로 바뀌면서 춤추는 전염병은 역사에서 사라졌다.","증거가 없어서 춤추는 전염병은 실제로 일어나지 않은 일로 결론 났다."],"r":{"a":"1) 결정적인 증거가 없어서 이 설명은 이론일 뿐이고, 춤추는 전염병은 여전히 수수께끼로 남아 있다.","ev":"11번 문장","s":[[11,"But lacking definitive evidence, this remains only a theory, leaving the dancing plague an enigma in history.","그러나 결정적인 증거가 부족하여, 이것은 단지 이론으로만 남아 있고, 춤추는 전염병을 역사의 수수께끼로 남겨두고 있다."]],"w":"lacking definitive evidence는 '결정적 증거가 부족해서'라는 뜻이에요. 그래서 스트레스 설명은 이론일 뿐이고, 춤추는 전염병은 수수께끼(enigma)로 남아요. 사건 자체가 없었다는 말은 아니에요(2~5번에 기록이 있어요).","c":1},"h":"acd581acea"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이 현상은 그 세기 동안 스트라스부르에서만 나타났다.","이 사건은 의사들이 원인을 밝혀낸 즉시 끝났다.","오늘날 전문가들은 동화가 이 사건의 원인이라고 본다.","이 현상은 같은 세기에 다른 유럽 지역에서도 나타났다."],"opts":["The phenomenon appeared only in Strasbourg throughout the century.","The event ended as soon as doctors found its cause.","Experts today believe that a fairy tale caused the event.","The phenomenon also appeared in other European regions in the same century."],"r":{"a":"4) The phenomenon also appeared in other European regions in the same century.","ev":"9번 문장","s":[[9,"This bizarre phenomenon also appeared in other European regions throughout the century.","이 기이한 현상은 그 세기 내내 다른 유럽 지역에서도 나타났다."]],"w":"9번에서 이 기이한 현상이 그 세기 내내 다른 유럽 지역에서도 나타났다고 해요. 의사들은 원인을 끝내 밝혀내지 못했고(6번), 오늘날의 추정 원인은 동화가 아니라 스트레스예요(10번).","c":4},"h":"bffe3de564"},{"n":9,"t":"sum","q":"In 1518, the dancing plague (A) from one woman in Strasbourg to about (B) people.","ko":"1518년, 춤추는 전염병은 스트라스부르의 한 여성에게서 약 (B)명에게 (A).","oko":["(A) 멈췄다 / (B) 400","(A) 퍼졌다 / (B) 40","(A) 멈췄다 / (B) 40","(A) 퍼졌다 / (B) 4,000","(A) 퍼졌다 / (B) 400"],"opts":["(A) stopped / (B) 400","(A) spread / (B) 40","(A) stopped / (B) 40","(A) spread / (B) 4,000","(A) spread / (B) 400"],"r":{"a":"5) (A) spread / (B) 400 ((A) 퍼졌다 / (B) 400)","ev":"5번 문장","s":[[5,"While Troffea’s weird movements in the summer heat terrified many, something peculiar happened: a number of individuals began mirroring her erratic postures, and soon, about 400 men and women were affected by this “dancing plague!”","여름의 열기 속에서 Troffea의 기이한 움직임은 많은 사람들을 공포에 떨게 했지만, 뭔가 특이한 일이 일어났다: 많은 사람들이 그녀의 괴상한 자세를 따라 하기 시작했고, 곧 약 400명의 남녀가 이 “춤추는 전염병”에 의해 영향을 받았다!"]],"w":"5번에서 많은 사람이 Troffea의 자세를 따라 하기 시작했고 곧 약 400명이 영향을 받았어요. 한 사람에게서 여러 사람에게 번졌으니 spread(퍼지다), 인원은 about 400이에요.","c":5},"h":"df5c606ad4"},{"n":10,"t":"fill","q":"Surprisingly, there are historical [A] of nearly identical cases occurring, even affecting whole [B]!","ko":"놀랍게도, 거의 동일한 사례가 발생하여 심지어 [B] 전체에 영향을 미쳤다는 역사적 [A]이(가) 있다!","bank":["musicians","records","stages","doctors","communities","victims"],"bko":{"records":"기록","communities":"지역 사회","doctors":"의사들","victims":"희생자들","musicians":"음악가들","stages":"무대"},"r":{"a":"[A] records (기록), [B] communities (지역 사회)","ev":"2번 문장","s":[[2,"Surprisingly, there are historical records of nearly identical cases occurring, even affecting whole communities!","놀랍게도, 거의 동일한 사례가 발생하여 심지어 지역 사회 전체에 영향을 미쳤다는 역사적 기록들이 있다!"]],"w":"2번 Surprisingly, there are historical records of nearly identical cases occurring, even affecting whole communities!에서 가져왔어요. doctors(의사들)·victims(희생자들)·musicians(음악가들)·stages(무대)는 다른 문장에 나오는 단어라 이 문장의 빈칸에는 뜻이 맞지 않아요.","c":null},"h":"b8af1b678d"}]},{"u":6,"id":"ms4-06-2","no":2,"ko":"새우도 지구도 포기 못 해","items":[{"n":1,"t":"tf","q":"The Shrimpbox looks like a shipping container with two large water tanks inside.","ko":"슈림프박스는 안에 큰 물탱크 두 개가 있는 선박용 컨테이너처럼 생겼다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Invented in 2018, the Shrimpbox resembles a shipping container with two large water tanks inside.","2018년에 발명된 슈림프박스는 내부에 두 개의 큰 물탱크가 있는 선박용 컨테이너와 닮았다."]],"w":"3번 문장에 resembles a shipping container with two large water tanks inside가 그대로 나와요.","c":"T"},"h":"099be3d9cc"},{"n":2,"t":"tf","q":"The Shrimpbox is mainly controlled by human workers.","ko":"슈림프박스는 주로 사람 작업자가 제어한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"These complex systems are controlled by artificial intelligence (AI), with the aim of optimizing conditions for shrimp production.","이러한 복잡한 시스템은 새우 생산을 위한 조건을 최적화하는 것을 목표로 인공지능(AI)에 의해 제어된다."]],"w":"5번 문장에서 이 시스템은 인공지능(AI)이 제어한다고 해요. 6번에서도 사람의 개입은 거의 없다고 해요.","c":"F"},"h":"625fd0bdb7"},{"n":3,"t":"tf","q":"A single Shrimpbox can produce up to 1,500 kilograms of shrimp a year.","ko":"슈림프박스 하나는 1년에 최대 1,500킬로그램의 새우를 생산할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The technology has proven highly effective, with a single Shrimpbox capable of producing up to 1,500 kilograms of shrimp annually with little human involvement.","이 기술은 매우 효과적인 것으로 입증되어, 단 하나의 슈림프박스로 인간의 개입이 거의 없이 연간 최대 1,500 킬로그램의 새우를 생산할 수 있다."]],"w":"6번 문장의 with a single Shrimpbox capable of producing up to 1,500 kilograms of shrimp annually와 일치해요.","c":"T"},"h":"d39f302ec8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the Shrimpbox resembles a shipping container with two large water tanks inside.)","ko":"...슈림프박스는 내부에 두 개의 큰 물탱크가 있는 선박용 컨테이너와 ...","opts":["~을 대체한다","~와 닮았다","~을 운반한다","~보다 크다"],"word":"resembles","r":{"a":"2) ~와 닮았다","ev":"3번 문장","s":[[3,"Invented in 2018, the Shrimpbox resembles a shipping container with two large water tanks inside.","2018년에 발명된 슈림프박스는 내부에 두 개의 큰 물탱크가 있는 선박용 컨테이너와 닮았다."]],"w":"3번에서 슈림프박스의 생김새를 컨테이너에 빗대어 말해요. resemble은 '~을 닮다'예요.","c":2},"h":"2c357f5245"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...than a conventional shrimp farm.)","ko":"...기존의 새우 양식장보다 ...","opts":["거대한","해로운","기존의","새로운"],"word":"conventional","r":{"a":"3) 기존의","ev":"10번 문장","s":[[10,"The end result is that the Shrimpbox uses a smaller amount of natural resources and produces fewer ecologically harmful byproducts than a conventional shrimp farm.","그 최종 결과는 슈림프박스가 기존 새우 양식장보다 더 적은 양의 천연자원을 사용하고 생태학적으로 해로운 부산물을 더 적게 생산한다는 것이다."]],"w":"10번은 슈림프박스와 기존 양식장을 비교해요. 1번에서 말한 전통적으로 양식하는 방식과 같은 뜻이라 conventional은 '기존의, 전통적인'이에요.","c":3},"h":"8dd2ea0c65"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThis is primarily achieved by employing a recirculating aquaculture system (RAS), which recycles over 95 percent of the water.","ko":"밑줄 친 which가 가리키는 것은?","sko":"이것은 주로 95퍼센트 이상의 물을 재활용하는 순환 양식 시스템(RAS)을 채택함으로써 달성된다.","opts":["슈림프박스","환경적 영향","95퍼센트의 물","순환 양식 시스템(RAS)"],"r":{"a":"4) 순환 양식 시스템(RAS)","ev":"8번 문장","s":[[8,"This is primarily achieved by employing a recirculating aquaculture system (RAS), which recycles over 95 percent of the water.","이것은 주로 95퍼센트 이상의 물을 재활용하는 순환 양식 시스템(RAS)을 채택함으로써 달성된다."]],"w":"which 앞에 쉼표가 있어 바로 앞의 RAS를 보충 설명해요. 물을 재활용하는 주체는 순환 양식 시스템이에요. 바로 뒤의 the water는 재활용되는 대상이라 가리키는 말이 아니에요.","c":4},"h":"e1536964bd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Perhaps the most significant advantage of Shrimpbox is that it minimizes the environmental impact of shrimp farming.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아마도 슈림프박스의 가장 중요한 장점은 새우 양식의 환경적 영향을 최소화한다는 점일 것이다.","opts":["슈림프박스의 가장 큰 장점은 새우 양식이 환경에 미치는 영향을 최소로 줄인다는 점일 것이다.","슈림프박스의 가장 큰 장점은 새우 양식의 생산량을 최대로 늘린다는 점이다.","슈림프박스는 환경에 미치는 영향 때문에 새우 양식에서 장점을 잃었다.","슈림프박스는 새우 양식의 환경적 영향을 줄이는 가장 값비싼 장치이다."],"r":{"a":"1) 슈림프박스의 가장 큰 장점은 새우 양식이 환경에 미치는 영향을 최소로 줄인다는 점일 것이다.","ev":"7번 문장","s":[[7,"Perhaps the most significant advantage of Shrimpbox is that it minimizes the environmental impact of shrimp farming.","아마도 슈림프박스의 가장 중요한 장점은 새우 양식의 환경적 영향을 최소화한다는 점일 것이다."]],"w":"minimizes the environmental impact는 환경적 영향을 최소화한다는 뜻이에요. 장점이 생산량 증가라거나 환경 때문에 장점을 잃었다는 말은 없고, 가격 이야기도 본문에 없어요.","c":1},"h":"1802ba1138"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["슈림프박스에는 새우에게 먹이를 주려고 많은 일꾼이 필요하다.","슈림프박스는 2008년에 발명되었다.","슈림프박스에는 물의 온도, 산소 함량, 산도를 모니터링하는 센서가 있다.","슈림프박스의 시스템은 물의 50퍼센트 미만을 재활용한다."],"opts":["A Shrimpbox needs many workers to feed the shrimp.","The Shrimpbox was invented in 2008.","The Shrimpbox has sensors that monitor the temperature, oxygen content, and acidity of the water.","The Shrimpbox system recycles less than 50 percent of the water."],"r":{"a":"3) The Shrimpbox has sensors that monitor the temperature, oxygen content, and acidity of the water.","ev":"4번 문장","s":[[4,"Each unit includes fully automated feed dispensers as well as sensors to monitor the temperature, oxygen content, and acidity level of the water.","각 장치에는 완전 자동화된 사료 배급기뿐만 아니라 물의 온도, 산소 함량, 산도 수준을 모니터링하는 센서가 포함되어 있다."]],"w":"4번에서 센서가 temperature, oxygen content, acidity level을 모니터링한다고 해요. 먹이도 자동 배급기가 주고(4번), 발명은 2018년(3번), 물은 95퍼센트 이상 재활용해요(8번).","c":3},"h":"6aeb5e9ca2"},{"n":9,"t":"sum","q":"Traditional shrimp farming often (A) coastal ecosystems, so a company developed the Shrimpbox as a new (B).","ko":"전통적인 새우 양식은 종종 해안 생태계를 (A)해서, 한 회사가 새로운 (B)(으)로 슈림프박스를 개발했다.","oko":["(A) 보호 / (B) 해결책","(A) 파괴 / (B) 문제","(A) 보호 / (B) 문제","(A) 파괴 / (B) 위험","(A) 파괴 / (B) 해결책"],"opts":["(A) protects / (B) solution","(A) destroys / (B) problem","(A) protects / (B) problem","(A) destroys / (B) danger","(A) destroys / (B) solution"],"r":{"a":"5) (A) destroys / (B) solution ((A) 파괴 / (B) 해결책)","ev":"1~2번 문장","s":[[1,"While shrimp is a popular dish around the world, the way it’s traditionally farmed often comes at the expense of nature—destroying coastal ecosystems and polluting nearby waters.","새우는 전 세계적으로 인기 있는 요리이지만, 전통적으로 양식되는 방식은 종종 자연을 희생시키는 경우가 많아 해안 생태계를 파괴하고 인근 수역을 오염시킨다."],[2,"To address these issues, a company called Atarraya has developed an innovative solution—Shrimpbox.","이러한 문제를 해결하기 위해, 아타라야라는 회사는 혁신적인 해결책인 슈림프박스를 개발했다."]],"w":"1번에서 전통적인 새우 양식은 해안 생태계를 파괴한다(destroying coastal ecosystems)고 했고, 2번에서 이 문제를 해결하려고 슈림프박스라는 해결책(solution)을 개발했다고 해요.","c":5},"h":"5f111ac5e5"},{"n":10,"t":"fill","q":"Special [A] in the tanks consume the [B] produced by the shrimp, so harmful chemicals are not needed.","ko":"탱크 안의 특수한 [A]이(가) 새우가 배출한 [B]을(를) 소비해서, 해로운 화학 물질이 필요하지 않다.","bank":["algae","waste","temperature","container","sensors","tanks"],"bko":{"algae":"조류","waste":"노폐물","temperature":"온도","container":"컨테이너","sensors":"센서","tanks":"탱크"},"r":{"a":"[A] algae, [B] waste","ev":"9번 문장","s":[[9,"Furthermore, harmful chemicals do not need to be added to keep the water clean because the tanks used in the system include special algae that consume the waste produced by the shrimp.","게다가, 이 시스템에 사용된 탱크에 새우가 배출한 노폐물을 소비하는 특수 조류가 포함되어 있기 때문에 물을 깨끗하게 유지하기 위해 해로운 화학 물질을 첨가할 필요가 없다."]],"w":"9번에서 탱크에 포함된 특수 조류(algae)가 새우가 만든 노폐물(waste)을 소비해요. temperature와 sensors는 4번의 센서 이야기, container는 3번의 생김새, tanks는 이미 문장에 나온 말이라 알맞지 않아요.","c":null},"h":"677555909b"}]},{"u":6,"id":"ms4-06-3","no":3,"ko":"생일보다 더 중요한 날이 있다?!","items":[{"n":1,"t":"tf","q":"A name day is a celebration of a saint that a person is named after.","ko":"이름날은 사람의 이름이 유래된 성인을 기념하는 날이다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"A name day is the celebration of a saint someone is named after.","이름날은 누군가의 이름이 유래된 성인을 기념하는 날이다."]],"w":"4번 문장이 이름날을 the celebration of a saint someone is named after라고 정의해요.","c":"T"},"h":"ed2b1fc9ef"},{"n":2,"t":"tf","q":"Only a few days in the Greek Orthodox calendar honor saints.","ko":"그리스 정교회 달력에서 성인을 기리는 날은 며칠뿐이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The Greek Orthodox Church follows a calendar dedicated to saints, with almost every day honoring at least one of them.","그리스 정교회는 성인들에게 헌정된 달력을 따르는데, 거의 매일이 그들 중 적어도 한 명을 기린다."]],"w":"5번 문장에서 거의 매일(almost every day)이 적어도 한 명의 성인을 기린다고 해요. 며칠뿐이라는 말은 반대예요.","c":"F"},"h":"6b0b530850"},{"n":3,"t":"tf","q":"On a name day, a person may host an “open home” for friends and family.","ko":"이름날에는 친구와 가족을 위해 ‘열린 집’을 주최할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Traditionally, you host an “open home,” letting friends and family visit.","전통적으로, 당신은 친구와 가족이 방문하도록 하는 ‘열린 집’을 주최한다."]],"w":"7번 문장에서 전통적으로 친구와 가족이 방문하도록 하는 열린 집을 주최한다고 해요.","c":"T"},"h":"2af87bf87e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (A Greek girl named Sofia is surrounded by loved ones ...)","ko":"소피아라는 그리스 소녀가 사랑하는 사람들에게 ...","opts":["둘러싸여 있다","쫓겨나 있다","소개되어 있다","떨어져 있다"],"word":"surrounded","r":{"a":"1) 둘러싸여 있다","ev":"1번 문장","s":[[1,"A Greek girl named Sofia is surrounded by loved ones wishing her well and offering her delicious foods, even though it’s not her birthday.","소피아라는 그리스 소녀가 생일이 아님에도 불구하고 그녀의 안녕을 빌어주고 맛있는 음식을 권하는 사랑하는 사람들에게 둘러싸여 있다."]],"w":"1번에서 소피아 곁에 안녕을 빌고 음식을 권하는 사랑하는 사람들이 있어요. be surrounded by는 '~에 둘러싸여 있다'예요.","c":1},"h":"a72e1906d5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...it’s customary to wish them a Chronia Polla ...)","ko":"...그들에게 크로니아 폴라를 전하는 것이 관례이다.","opts":["금지된","관례인","어려운","불필요한"],"word":"customary","r":{"a":"2) 관례인","ev":"13번 문장","s":[[13,"To properly acknowledge this vital occasion, it’s customary to wish them a Chronia Polla, an expression of goodwill and health.","이 중요한 행사를 제대로 기념하기 위해, 그들에게 호의와 건강의 표현인, 크로니아 폴라를 전하는 것이 관례이다."]],"w":"13번은 이름날을 제대로 기념하려고 Chronia Polla를 건네는 것을 말해요. 12번에서 이름날을 잊으면 무례하다고 했으니 건네는 일은 당연한 관례예요. customary는 '관례적인'이에요.","c":2},"h":"b4bfb60673"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nInterestingly, many Greek elderly don’t even know their exact birthdate, but only their name day.","ko":"밑줄 친 their가 가리키는 것은?","sko":"흥미롭게도, 많은 그리스 노인들은 정확한 생년월일은 모르고 오직 이름날만 알고 있다.","opts":["그리스의 젊은이들","많은 그리스 노인들","이름날을 기념하는 성인들","열린 집을 찾은 손님들"],"r":{"a":"2) 많은 그리스 노인들","ev":"11번 문장","s":[[11,"Interestingly, many Greek elderly don’t even know their exact birthdate, but only their name day.","흥미롭게도, 많은 그리스 노인들은 정확한 생년월일은 모르고 오직 이름날만 알고 있다."]],"w":"their는 같은 문장 앞쪽의 many Greek elderly(많은 그리스 노인들)를 가리켜요. 생년월일은 모르고 이름날만 아는 사람이 바로 이 노인들이에요.","c":2,"k":"their = 많은 그리스 노인들"},"pron":"their","h":"db7ddb5ab6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since Greece is a deeply Christian country, with approximately 90 percent of the population adhering to Christianity, the majority of Greeks are named after saints.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그리스는 인구의 약 90퍼센트가 기독교를 믿는 독실한 기독교 국가이기 때문에, 대다수의 그리스인은 성인의 이름을 따서 이름을 짓는다.","opts":["그리스는 인구의 대부분이 기독교를 믿는 나라여서, 많은 그리스인이 성인의 이름을 따서 이름을 짓는다.","그리스는 기독교 신자가 드문 나라여서, 성인의 이름을 따서 이름을 짓는 그리스인은 거의 없다.","그리스인 대다수가 성인의 이름을 따서 이름을 지었기 때문에, 그리스가 기독교 국가가 되었다.","그리스는 기독교 국가이지만, 성인의 이름을 따서 이름을 짓는 그리스인은 소수이다."],"r":{"a":"1) 그리스는 인구의 대부분이 기독교를 믿는 나라여서, 많은 그리스인이 성인의 이름을 따서 이름을 짓는다.","ev":"6번 문장","s":[[6,"Since Greece is a deeply Christian country, with approximately 90 percent of the population adhering to Christianity, the majority of Greeks are named after saints.","그리스는 인구의 약 90퍼센트가 기독교를 믿는 독실한 기독교 국가이기 때문에, 대다수의 그리스인은 성인의 이름을 따서 이름을 짓는다."]],"w":"approximately 90 percent of the population adhering to Christianity는 인구의 약 90퍼센트가 기독교를 믿는다는 뜻이고, 그래서 the majority of Greeks are named after saints(대다수의 그리스인이 성인의 이름을 따른다)가 돼요. 원인과 결과의 방향이 바뀐 선택지에 주의하세요.","c":1},"h":"7ad6747979"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["이름날에는 주최자가 손님들을 위해 음식과 음료를 전부 준비한다.","이름날 선물로 꽃은 받을 수 없다.","이름날 선물에는 이름이나 태어난 계절을 상징하는 꽃이 있을 수 있다.","그리스에서 이름날은 생일보다 덜 중요하게 여겨진다."],"opts":["The host prepares all the food and drinks for the guests on a name day.","Flowers cannot be received as name day gifts.","Name day gifts may include flowers symbolizing a person’s name or birth season.","In Greece, name days are considered less important than birthdays."],"r":{"a":"3) Name day gifts may include flowers symbolizing a person’s name or birth season.","ev":"8번 문장","s":[[8,"Guests bring food and drinks and give you gifts such as flowers symbolizing your name or birth season, or a small icon featuring the saint you were named after.","손님들은 음식과 음료를 가져오고 당신의 이름이나 태어난 계절을 상징하는 꽃, 또는 당신의 이름이 유래된 성인이 그려진 작은 성화와 같은 선물을 준다."]],"w":"8번에서 선물은 이름이나 태어난 계절을 상징하는 꽃, 또는 성인이 그려진 작은 성화라고 해요. 음식과 음료는 손님이 가져오고(8번), 이름날은 생일보다 더 중요해요(9번).","c":3},"h":"26d9595d95"},{"n":9,"t":"sum","q":"A name day is considered (A) than a birthday for Greek Orthodox Christians, and forgetting it is thought to be (B).","ko":"그리스 정교회 기독교인에게 이름날은 생일보다 (A)하다고 여겨지고, 이름날을 잊는 것은 (B) 일로 여겨진다.","oko":["(A) 덜 중요 / (B) 무례한","(A) 더 중요 / (B) 정중한","(A) 더 중요 / (B) 재미있는","(A) 덜 중요 / (B) 정중한","(A) 더 중요 / (B) 무례한"],"opts":["(A) less important / (B) rude","(A) more important / (B) polite","(A) more important / (B) funny","(A) less important / (B) polite","(A) more important / (B) rude"],"r":{"a":"5) (A) more important / (B) rude","ev":"9번, 12번 문장","s":[[9,"For Greek Orthodox Christians, their name day is more significant than their birthday.","그리스 정교회 기독교인들에게 이름날은 생일보다 더 중요하다."],[12,"While forgetting an individual’s birthday is generally deemed permissible in Greece, committing a similar oversight on their name day is considered highly discourteous.","그리스에서는 개인의 생일을 잊어버리는 것이 일반적으로는 허용되는 것으로 여겨지지만, 그들의 이름날에 비슷한 실수를 저지르는 것은 매우 무례한 것으로 간주된다."]],"w":"9번에서 이름날은 생일보다 더 중요하다고 해요. 12번에서 생일을 잊는 것은 허용되지만 이름날을 잊는 것은 매우 무례한(highly discourteous) 일이라고 해요.","c":5},"h":"3f7f2c1b45"},{"n":10,"t":"fill","q":"It’s a way to strengthen their [A] with [B] and honor the saint after whom they are named.","ko":"그것은 [B]와(과)의 [A]을(를) 강화하고 자신의 이름이 유래된 성인을 기리는 방법이다.","bank":["flowers","gifts","relationship","birthdays","calendar","God"],"bko":{"relationship":"관계","God":"하나님","calendar":"달력","birthdays":"생일들","gifts":"선물들","flowers":"꽃들"},"r":{"a":"[A] relationship (관계), [B] God (하나님)","ev":"10번 문장","s":[[10,"It’s a way to strengthen their relationship with God and honor the saint after whom they are named.","그것은 하나님과의 관계를 강화하고 자신의 이름이 유래된 성인을 기리는 방법이다."]],"w":"10번 It’s a way to strengthen their relationship with God and honor the saint after whom they are named.에서 가져왔어요. calendar(달력)·birthdays(생일들)·gifts(선물들)·flowers(꽃들)는 뜻이 이 빈칸에 맞지 않아요.","c":null},"h":"fe3c66ace4"}]},{"u":6,"id":"ms4-06-4","no":4,"ko":"Built for the Hunt, Broken by the Desk","items":[{"n":1,"t":"tf","q":"Participants who self-reported ADHD behaviors were more efficient in foraging scenarios that required constant movement.","ko":"ADHD 행동을 자가 보고한 참가자들은 끊임없는 움직임을 요구하는 채집 시나리오에서 더 효율적이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The test results indicated that participants who self-reported ADHD behaviors demonstrated greater efficiency in foraging scenarios requiring constant movement and swift decision-making.","실험 결과는 ADHD 행동을 자가 보고한 참가자들이 끊임없는 움직임과 신속한 의사결정을 필요로 하는 채집 시나리오에서 더 큰 효율성을 보였음을 나타냈다."]],"w":"5번 문장이 demonstrated greater efficiency in foraging scenarios requiring constant movement and swift decision-making이라고 해요.","c":"T"},"h":"dd21679b5a"},{"n":2,"t":"tf","q":"ADHD-related traits may have offered evolutionary advantages in past environments.","ko":"ADHD 관련 특성들은 과거 환경에서 진화적 이점을 제공했을지도 모른다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"While often seen as negative today, ADHD-related traits may have offered evolutionary advantages in past environments.","오늘날에는 종종 부정적으로 보이지만, ADHD 관련 특성들은 과거 환경에서 진화적 이점을 제공했을지도 모른다."]],"w":"2번 문장에서 오늘날에는 부정적으로 보이지만 과거 환경에서는 진화적 이점을 제공했을지도 모른다고 해요.","c":"T"},"h":"d7a15e3204"},{"n":3,"t":"tf","q":"In the study, participants played an online game in which they hunted animals.","ko":"이 연구에서 참가자들은 동물을 사냥하는 온라인 게임을 했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"A study published in the Proceedings of the Royal Society B investigated this idea by having participants play an online berry-picking game.","영국 왕립학회 회보 B에 발표된 한 연구는 참가자들이 온라인 베리 따기 게임을 하게 함으로써 이 의견(가설)을 연구했다."]],"w":"4번 문장에서 참가자들이 한 게임은 동물 사냥이 아니라 online berry-picking game(온라인 베리 따기 게임)이에요.","c":"F"},"h":"2451981642"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...the prevalence of ADHD traits in modern populations ...)","ko":"...현대 인구에서 ADHD 특성의 ...","opts":["만연함","가격","부족","발견"],"word":"prevalence","r":{"a":"1) 만연함","ev":"7번 문장","s":[[7,"These evolutionary insights imply that the prevalence of ADHD traits in modern populations—found in 11 percent of children and 4 percent of adults—could be remnants of adaptive behaviors from our nomadic lifestyles in ancient hunter-gatherer societies.","이러한 진화적 통찰은 현대 인구에서 아동의 약 11퍼센트와 성인의 약 4퍼센트에게서 발견되는 ADHD 특성의 만연함이 고대 수렵 채집 사회의 유목 생활 방식에서 비롯된 적응 행동의 잔재일 수 있음을 시사한다."]],"w":"7번에서 prevalence는 현대 인구에서 아동의 11퍼센트, 성인의 4퍼센트에게서 발견된다는 비율 이야기와 이어져서 '널리 퍼져 있음, 만연함'이에요.","c":1},"h":"d56510b30f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (With the advent of sedentary agricultural societies, ...)","ko":"정착 농경 사회의 도래와 함께, ...","opts":["유목하는","정착 생활의","고대의","산업화된"],"word":"sedentary","r":{"a":"2) 정착 생활의","ev":"8번 문장","s":[[8,"With the advent of sedentary agricultural societies, the same traits may have become less compatible with structured, repetitive tasks.","정착 농경 사회의 도래와 함께, 동일한 특성들은 구조화되고 반복적인 작업과는 잘 맞지 않게 되었을지도 모른다."]],"w":"8번의 sedentary는 agricultural societies(농경 사회)를 꾸미는데, 3·7번의 nomadic(유목의)과 대비되어 '한곳에 정착해 사는'이라는 뜻이에요.","c":2},"h":"06332130de"},{"n":6,"t":"ref","q":"What does the underlined \"where\" refer to?\nAccording to the “hunter versus farmer” hypothesis in evolutionary psychiatry, individuals with ADHD traits may have been better suited to nomadic hunter-gatherer societies, where the ability to quickly adapt and respond to environmental stimuli was essential.","ko":"밑줄 친 where가 가리키는 것은?","sko":"진화 정신의학의 “사냥꾼 대 농부” 가설에 따르면, ADHD 특성을 가진 개인들은 환경적 자극에 빠르게 적응하고 반응하는 능력이 필수적이었던 유목 수렵 채집 사회에 더 적합했을 수 있다.","opts":["진화 정신의학","ADHD 특성을 가진 개인들","유목 수렵 채집 사회","환경적 자극"],"r":{"a":"3) 유목 수렵 채집 사회","ev":"3번 문장","s":[[3,"According to the “hunter versus farmer” hypothesis in evolutionary psychiatry, individuals with ADHD traits may have been better suited to nomadic hunter-gatherer societies, where the ability to quickly adapt and respond to environmental stimuli was essential.","진화 정신의학의 “사냥꾼 대 농부” 가설에 따르면, ADHD 특성을 가진 개인들은 환경적 자극에 빠르게 적응하고 반응하는 능력이 필수적이었던 유목 수렵 채집 사회에 더 적합했을 수 있다."]],"w":"where는 바로 앞의 nomadic hunter-gatherer societies(유목 수렵 채집 사회)를 가리켜요. 빠르게 적응하고 반응하는 능력이 필수적이었던 곳이 그 사회예요.","c":3,"k":"where = 유목 수렵 채집 사회"},"pron":"where","h":"037b4fa1c9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Understanding this evolutionary context can provide a more nuanced view of ADHD, recognizing that behaviors deemed problematic today may have once played a crucial role in human survival.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이러한 진화적 맥락을 이해하는 것은 ADHD에 대한 더 미묘한 관점을 제공할 수 있으며, 오늘날 문제로 여겨지는 행동들이 한때는 인간 생존에 중요한 역할을 했을 수도 있음을 인식하게 한다.","opts":["진화적 맥락을 알면 ADHD가 현대에 와서 새로 생긴 질환임을 확인할 수 있다.","오늘날 문제로 여겨지는 행동이 인간의 생존을 위협한 적이 있음을 알 수 있다.","오늘날 문제로 여겨지는 행동도 한때는 인간의 생존에 중요한 역할을 했을 수 있음을 이해하면 ADHD를 더 섬세하게 볼 수 있다.","ADHD에 대한 시각은 바뀔 필요가 없으며 과거의 역할은 중요하지 않다."],"r":{"a":"3) 오늘날 문제로 여겨지는 행동도 한때는 인간의 생존에 중요한 역할을 했을 수 있음을 이해하면 ADHD를 더 섬세하게 볼 수 있다.","ev":"9번 문장","s":[[9,"Understanding this evolutionary context can provide a more nuanced view of ADHD, recognizing that behaviors deemed problematic today may have once played a crucial role in human survival.","이러한 진화적 맥락을 이해하는 것은 ADHD에 대한 더 미묘한 관점을 제공할 수 있으며, 오늘날 문제로 여겨지는 행동들이 한때는 인간 생존에 중요한 역할을 했을 수도 있음을 인식하게 한다."]],"w":"more nuanced view는 더 섬세한 관점이고, 문제로 여겨지는 행동이 한때 생존에 중요한 역할(crucial role)을 했을 수 있다는 내용이에요. 새로운 질환이라거나 생존을 위협했다는 말은 없어요.","c":3},"h":"d5c65e5a6c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["ADHD 행동을 자가 보고한 참가자들은 고갈된 베리 채집 지점을 떠나는 데 더 느렸다.","ADHD 행동을 자가 보고한 참가자들은 그러한 특성이 없는 사람들보다 전체적으로 더 적은 베리를 모았다.","ADHD 행동을 자가 보고한 참가자들은 고갈된 베리 채집 지점을 더 빨리 떠났고 전체적으로 더 많은 베리를 모았다.","그 게임은 현대 농부들이 직면하는 조건을 모방하도록 설계되었다."],"opts":["Participants who self-reported ADHD behaviors were slower to leave depleted berry patches.","Participants who self-reported ADHD behaviors gathered fewer berries overall than those without such traits.","Participants who self-reported ADHD behaviors were quicker to leave depleted berry patches and gathered more berries overall.","The game was designed to copy the conditions faced by modern farmers."],"r":{"a":"3) Participants who self-reported ADHD behaviors were quicker to leave depleted berry patches and gathered more berries overall. (ADHD 행동을 자가 보고한 참가자들은 고갈된 베리 채집 지점을 더 빨리 떠났고 전체적으로 더 많은 베리를 모았다.)","ev":"6번 문장","s":[[6,"In situations designed to mimic the conditions faced by ancient gatherers, they were quicker to abandon depleted berry patches and gathered more berries overall compared to those without such traits.","고대 채집가들이 직면했던 조건을 모방하도록 설계된 상황에서, 그들은 베리가 고갈된 채집 지점을 더 빨리 포기했고 그러한 특성이 없는 사람들에 비해 전체적으로 더 많은 베리를 모았다."]],"w":"6번에서 고대 채집가들의 조건을 모방한 상황에서 이 참가자들은 고갈된 베리 채집 지점을 더 빨리 포기했고(quicker to abandon depleted berry patches) 전체적으로 더 많은 베리를 모았어요(gathered more berries overall). 모방한 대상은 현대 농부가 아니라 고대 채집가들이에요.","c":3},"h":"421a9e2c5a"},{"n":9,"t":"sum","q":"ADHD traits may be remnants of (A) behaviors from nomadic life, but they became (B) compatible with structured, repetitive tasks after farming began.","ko":"ADHD 특성은 유목 생활에서 비롯된 (A) 행동의 잔재일 수 있지만, 농경이 시작된 뒤에는 구조화되고 반복적인 작업과 (B) 맞게 되었다.","oko":["(A) 해로운 / (B) 더","(A) 적응적인 / (B) 더","(A) 해로운 / (B) 덜","(A) 적응적인 / (B) 덜","(A) 현대적인 / (B) 덜"],"opts":["(A) harmful / (B) more","(A) adaptive / (B) more","(A) harmful / (B) less","(A) adaptive / (B) less","(A) modern / (B) less"],"r":{"a":"4) (A) adaptive / (B) less","ev":"7~8번 문장","s":[[7,"These evolutionary insights imply that the prevalence of ADHD traits in modern populations—found in 11 percent of children and 4 percent of adults—could be remnants of adaptive behaviors from our nomadic lifestyles in ancient hunter-gatherer societies.","이러한 진화적 통찰은 현대 인구에서 아동의 약 11퍼센트와 성인의 약 4퍼센트에게서 발견되는 ADHD 특성의 만연함이 고대 수렵 채집 사회의 유목 생활 방식에서 비롯된 적응 행동의 잔재일 수 있음을 시사한다."],[8,"With the advent of sedentary agricultural societies, the same traits may have become less compatible with structured, repetitive tasks.","정착 농경 사회의 도래와 함께, 동일한 특성들은 구조화되고 반복적인 작업과는 잘 맞지 않게 되었을지도 모른다."]],"w":"7번에서 ADHD 특성은 유목 생활에서 비롯된 adaptive behaviors의 잔재일 수 있다고 해요. 8번에서 농경 사회가 되자 구조화되고 반복적인 작업과 less compatible하게 되었다고 해요.","c":4},"h":"1e6e2084df"},{"n":10,"t":"fill","q":"Attention-Deficit/Hyperactivity Disorder (ADHD) is [A] by impulsivity, hyperactivity, and [B].","ko":"주의력 결핍 과잉 행동 장애(ADHD)는 충동성, 과잉 행동, [B](으)로 [A].","bank":["characterized","inattention","evolutionary","hypothesis","abandon","nomadic"],"bko":{"characterized":"특징지어진다","inattention":"부주의","evolutionary":"진화적인","hypothesis":"가설","abandon":"포기하다","nomadic":"유목의"},"r":{"a":"[A] characterized (특징지어진다), [B] inattention (부주의)","ev":"1번 문장","s":[[1,"Attention-Deficit/Hyperactivity Disorder (ADHD) is characterized by impulsivity, hyperactivity, and inattention.","주의력 결핍 과잉 행동 장애(ADHD)는 충동성, 과잉 행동, 부주의가 특징이다."]],"w":"1번 문장 ADHD is characterized by impulsivity, hyperactivity, and inattention에서 가져왔어요. [B]는 impulsivity, hyperactivity와 같은 종류의 명사인 inattention이어야 해요. hypothesis는 3번에 나오지만 ADHD의 특징이 아니에요.","c":null},"h":"653f04a1d4"}]},{"u":7,"id":"ms4-07-1","no":1,"ko":"옷장은 가볍게, 스타일은 완벽하게","items":[{"n":1,"t":"tf","q":"A capsule wardrobe is a collection of just 10 to 20 interchangeable clothing items.","ko":"캡슐 옷장은 서로 바꿔 입을 수 있는 10~20개의 의류 아이템으로 이루어진 컬렉션이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A capsule wardrobe would be the best solution for you; it is a curated collection of just 10 to 20 interchangeable clothing items designed to maximize outfit options while minimizing clutter.","캡슐 옷장이 당신에게 최고의 해결책이 될 것인데, 이것은 어수선함을 최소화하면서 옷차림 옵션을 극대화하도록 고안된, 서로 바꿔 입을 수 있는 10~20개의 의류 아이템으로 엄선된 컬렉션이다."]],"w":"2번 문장에서 캡슐 옷장은 just 10 to 20 interchangeable clothing items(딱 10~20개의 서로 바꿔 입을 수 있는 옷)의 컬렉션이라고 해요.","c":"T"},"h":"302c3e713a"},{"n":2,"t":"tf","q":"The concept of a capsule wardrobe first appeared in 1985 when Donna Karan released her collection.","ko":"캡슐 옷장 개념은 도나 카란이 컬렉션을 출시한 1985년에 처음 나타났다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"This minimalist fashion approach originated in the 1970s when Susie Faux introduced the concept at her London boutique, Wardrobe, after noticing that customers were spending money on low-quality, trendy pieces that quickly went out of style.","이 미니멀리스트 패션 접근법은 1970년대 수지 포가 자신의 런던 부티크 Wardrobe에서 고객들이 금방 유행이 지나는 저품질의 트렌디한 옷에 돈을 쓰고 있다는 것을 알아차린 후 이 개념을 도입했을 때 시작되었다."],[4,"The idea gained mainstream popularity in 1985 when designer Donna Karan released her “Seven Easy Pieces” collection, featuring versatile items for working women to wear for any occasion.","이 아이디어는 일하는 여성들이 어떤 상황에서도 입을 수 있는 다용도 아이템을 특징으로 하는 “Seven Easy Pieces” 컬렉션을 1985년 디자이너 도나 카란이 출시했을 때 주류의 인기를 얻었다."]],"w":"처음 시작은 3번의 1970년대(수지 포)예요. 1985년은 4번에서 도나 카란 덕분에 주류의 인기를 얻은 때라서, '처음 나타났다'는 말이 틀려요.","c":"F"},"h":"5bb7b1222c"},{"n":3,"t":"tf","q":"A capsule wardrobe lowers expenses by reducing impulse purchases.","ko":"캡슐 옷장은 충동구매를 줄여서 지출을 줄여 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"A capsule wardrobe saves time by eliminating decision fatigue, minimizes expenses by reducing impulse purchases, and helps the environment by encouraging sustainable consumption.","캡슐 옷장은 결정 피로를 없애 시간을 절약하고, 충동구매를 줄여 지출을 최소화하며, 지속 가능한 소비를 장려함으로써 환경에 도움을 준다."]],"w":"9번에서 minimizes expenses by reducing impulse purchases(충동구매를 줄여 지출을 최소화한다)라고 해요.","c":"T"},"h":"e567d76676"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...invest in high-quality pieces with timeless designs...)","ko":"...유행을 타지 않는 디자인의 고품질 옷에 투자하라.","opts":["일시적인","값싼","유행을 타지 않는","화려한"],"word":"timeless","r":{"a":"3) 유행을 타지 않는","ev":"7번 문장","s":[[7,"If you need to add items, invest in high-quality pieces with timeless designs in neutral colors that mix and match easily and can be dressed up or down.","만약 아이템을 추가해야 한다면, 쉽게 섞어 입을 수 있고 격식을 차리거나 편하게 입을 수 있는, 무채색에 유행을 타지 않는 디자인의 고품질 옷에 투자하라."]],"w":"7번에서 timeless designs in neutral colors는 오래 입어도 어색하지 않은 디자인이에요. 3번의 '금방 유행이 지나는 옷'과 반대 개념이에요. timeless = 유행을 타지 않는.","c":3},"h":"5810454321"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...and resolutely get rid of the rest.)","ko":"...나머지는 단호하게 처분하라.","opts":["단호하게","조심스럽게","천천히","마지못해"],"word":"resolutely","r":{"a":"1) 단호하게","ev":"6번 문장","s":[[6,"Begin by auditing your closet—identify the pieces you love and wear regularly, and resolutely get rid of the rest.","당신의 옷장을 점검하는 것으로 시작하라, 즉 당신이 사랑하고 정기적으로 입는 옷들을 가려내고, 나머지는 단호하게 처분하라."]],"w":"6번에서 좋아하고 자주 입는 옷만 남기고 나머지는 처분하라고 해요. 망설이지 말고 확실하게 하라는 뜻이라 resolutely = 단호하게예요.","c":1},"h":"dfb4f0fdbd"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nThe idea gained mainstream popularity in 1985 when designer Donna Karan released her “Seven Easy Pieces” collection, featuring versatile items for working women to wear for any occasion.","ko":"밑줄 친 her가 가리키는 것은?","sko":"이 아이디어는 일하는 여성들이 어떤 상황에서도 입을 수 있는 다용도 아이템을 특징으로 하는 “Seven Easy Pieces” 컬렉션을 1985년 디자이너 도나 카란이 출시했을 때 주류의 인기를 얻었다.","opts":["디자이너 도나 카란","수지 포","일하는 여성들","캡슐 옷장"],"r":{"a":"1) 디자이너 도나 카란","ev":"4번 문장","s":[[4,"The idea gained mainstream popularity in 1985 when designer Donna Karan released her “Seven Easy Pieces” collection, featuring versatile items for working women to wear for any occasion.","이 아이디어는 일하는 여성들이 어떤 상황에서도 입을 수 있는 다용도 아이템을 특징으로 하는 “Seven Easy Pieces” 컬렉션을 1985년 디자이너 도나 카란이 출시했을 때 주류의 인기를 얻었다."]],"w":"her는 같은 문장의 주어 designer Donna Karan(디자이너 도나 카란)을 가리켜요. 그녀가 자신의 “Seven Easy Pieces” 컬렉션을 출시했어요.","c":1,"k":"her = 디자이너 도나 카란"},"pron":"her","h":"f0b48b1828"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Do you have lots of clothes but still feel like you have nothing to wear?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신은 옷은 많지만 여전히 입을 옷이 없다고 느끼는가?","opts":["옷이 아주 많은데도 입을 옷이 없다고 느끼는지 묻고 있다.","옷이 전혀 없어서 새 옷을 사야 하는지 묻고 있다.","입을 옷이 너무 많아서 오히려 행복한지 묻고 있다.","옷을 한 벌도 사지 않고 지내 본 적이 있는지 묻고 있다."],"r":{"a":"1) 옷이 아주 많은데도 입을 옷이 없다고 느끼는지 묻고 있다.","ev":"1번 문장","s":[[1,"Do you have lots of clothes but still feel like you have nothing to wear?","당신은 옷은 많지만 여전히 입을 옷이 없다고 느끼는가?"]],"w":"lots of clothes(많은 옷)가 있는데도 nothing to wear(입을 것이 없다)라고 느끼는지 묻는 문장이에요. 옷이 없다는 뜻이 아니라, 옷은 많은데 입을 만한 게 없다는 뜻이에요.","c":1},"h":"6f25757224"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["새 옷을 추가하기 전에 먼저 유행하는 색을 고르라고 한다.","사랑하고 정기적으로 입는 옷을 가려내는 것부터 시작하라고 한다.","추가하는 옷은 값이 싸고 디자인이 화려한 것을 고르라고 한다.","옷을 추가한 다음에야 가지고 있는 옷을 점검하라고 한다."],"opts":["It tells you to choose trendy colors before adding new clothes.","It tells you to begin by finding the pieces you love and wear regularly.","It tells you to add cheap items with bold designs.","It tells you to check your clothes only after adding new items."],"r":{"a":"2) It tells you to begin by finding the pieces you love and wear regularly. (사랑하고 정기적으로 입는 옷을 가려내는 것부터 시작하라고 한다.)","ev":"6번 문장","s":[[6,"Begin by auditing your closet—identify the pieces you love and wear regularly, and resolutely get rid of the rest.","당신의 옷장을 점검하는 것으로 시작하라, 즉 당신이 사랑하고 정기적으로 입는 옷들을 가려내고, 나머지는 단호하게 처분하라."]],"w":"6번에서 옷장을 점검하며 당신이 사랑하고 정기적으로 입는 옷을 가려내는 것(identify the pieces you love and wear regularly)부터 시작하라고 해요. 새 옷을 추가하는 것은 그다음 단계(7번)이고, 유행하는 색이나 값싼 옷을 고르라는 말은 없어요.","c":2},"h":"00e2b4968b"},{"n":9,"t":"sum","q":"A capsule wardrobe is a small collection of clothes that can be (A), and it saves (B) as well as helps the environment.","ko":"캡슐 옷장은 (A)할 수 있는 소수의 옷 컬렉션이고, 환경에 도움이 될 뿐 아니라 (B)을 절약해 준다.","oko":["(A) 섞어 입을 / (B) 시간과 돈","(A) 섞어 입을 / (B) 옷장 공간","(A) 팔 / (B) 시간과 돈","(A) 버릴 / (B) 유행","(A) 빌릴 / (B) 옷장 공간"],"opts":["(A) mixed and matched / (B) time and money","(A) mixed and matched / (B) closet space","(A) sold / (B) time and money","(A) thrown away / (B) trends","(A) borrowed / (B) closet space"],"r":{"a":"1) (A) mixed and matched / (B) time and money","ev":"2, 9번 문장","s":[[2,"A capsule wardrobe would be the best solution for you; it is a curated collection of just 10 to 20 interchangeable clothing items designed to maximize outfit options while minimizing clutter.","캡슐 옷장이 당신에게 최고의 해결책이 될 것인데, 이것은 어수선함을 최소화하면서 옷차림 옵션을 극대화하도록 고안된, 서로 바꿔 입을 수 있는 10~20개의 의류 아이템으로 엄선된 컬렉션이다."],[9,"A capsule wardrobe saves time by eliminating decision fatigue, minimizes expenses by reducing impulse purchases, and helps the environment by encouraging sustainable consumption.","캡슐 옷장은 결정 피로를 없애 시간을 절약하고, 충동구매를 줄여 지출을 최소화하며, 지속 가능한 소비를 장려함으로써 환경에 도움을 준다."]],"w":"2번에서 서로 바꿔 입을 수 있는 소수의 옷이라고 했고, 9번에서 시간을 절약하고(saves time) 지출을 줄이며(minimizes expenses) 환경에 도움을 준다고 해요. 옷장 공간 절약은 본문에 없어요.","c":1},"h":"4f0e8c4616"},{"n":10,"t":"fill","q":"The [A] extend beyond a [B] closet.","ko":"그 [A]은(는) 단순히 [B] 옷장에 그치지 않는다.","bank":["clutter","impulse","fatigue","benefits","occasion","tidy"],"bko":{"benefits":"장점들","tidy":"정돈된","occasion":"상황","clutter":"어수선함","fatigue":"피로","impulse":"충동"},"r":{"a":"[A] benefits (장점들), [B] tidy (정돈된)","ev":"8번 문장","s":[[8,"The benefits extend beyond a tidy closet.","그 장점은 단순히 옷장이 정돈되는 것에 그치지 않는다."]],"w":"8번 The benefits extend beyond a tidy closet.에서 가져왔어요. occasion(상황)·clutter(어수선함)·fatigue(피로)·impulse(충동)는 뜻과 문법이 두 빈칸에 맞지 않아요.","c":null},"h":"7b3a72bf1f"}]},{"u":7,"id":"ms4-07-2","no":2,"ko":"경계가 사라진 세상","items":[{"n":1,"t":"tf","q":"Netflix is entering the game industry.","ko":"넷플릭스는 게임 산업에 진출하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Netflix is entering the game industry, Tesla sells insurance products, and Sony makes cars.","넷플릭스는 게임 산업에 진출하고 있고, 테슬라는 보험 상품을 판매하며, 소니는 자동차를 만든다."]],"w":"1번 문장에 Netflix is entering the game industry(넷플릭스는 게임 산업에 진출하고 있다)가 그대로 나와요.","c":"T"},"h":"20fc5a0473"},{"n":2,"t":"tf","q":"In the past, companies usually worked in many different fields at once.","ko":"과거에 기업들은 보통 여러 다른 분야에서 동시에 일했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In the past, companies specialized in narrowly defined fields: banks handled money, media agencies produced entertainment.","과거에 기업들은 좁게 정의된 분야를 전문으로 했는데, 은행은 돈을 다루었고, 미디어 대행사는 오락물을 제작했다."]],"w":"4번에서 과거 기업들은 좁게 정의된 분야를 전문으로 했다(specialized in narrowly defined fields)고 해요. 여러 분야에서 동시에 일했다는 말은 반대예요.","c":"F"},"h":"898bacaacc"},{"n":3,"t":"tf","q":"Stan Davis and Christopher Meyer first introduced the term “Big Blur” in 1999.","ko":"스탠 데이비스와 크리스토퍼 마이어는 1999년에 '빅 블러'라는 용어를 처음 소개했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"First introduced by Stan Davis and Christopher Meyer in 1999, the term refers to the blurring of industry boundaries, where once-distinct sectors now overlap.","1999년 스탠 데이비스와 크리스토퍼 마이어에 의해 처음 소개된 이 용어는 산업 경계가 흐릿해지는 현상, 즉 한때 뚜렷이 달랐던 부문들이 이제는 서로 겹치는 현상을 말한다."]],"w":"3번에서 First introduced by Stan Davis and Christopher Meyer in 1999(1999년 스탠 데이비스와 크리스토퍼 마이어에 의해 처음 소개된)라고 해요.","c":"T"},"h":"44da25fc33"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These all exemplify the “Big Blur” phenomenon.)","ko":"이 모든 것은 '빅 블러' 현상을 전형적으로 보여준다.","opts":["전형적으로 보여주다","예측하다","반대하다","숨기다"],"word":"exemplify","r":{"a":"1) 전형적으로 보여주다","ev":"2번 문장","s":[[2,"These all exemplify the “Big Blur” phenomenon.","이 모든 것은 “빅 블러” 현상을 전형적으로 보여준다."]],"w":"1번의 세 회사 사례가 빅 블러 현상의 예라는 문장이에요. 예를 보여 준다는 뜻이라 exemplify = 전형적으로 보여주다.","c":1},"h":"c8ee506852"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...may gradually become more valuable as well.)","ko":"...또한 점차 더 중요해질 수 있다.","opts":["갑자기","점차","절대로","이미"],"word":"gradually","r":{"a":"2) 점차","ev":"11번 문장","s":[[11,"As boundaries continue to fade, the ability to adapt and connect ideas across different fields may gradually become more valuable as well.","경계가 계속 희미해짐에 따라, 적응해 나가는 능력과 다양한 분야의 아이디어를 연결하는 능력 또한 점차 더 중요해질 수 있다."]],"w":"11번은 경계가 계속 희미해짐에 따라 능력이 '더 중요해질 수 있다'는 문장이에요. 서서히 변하는 모습이라 gradually = 점차.","c":2},"h":"9a15e60270"},{"n":6,"t":"ref","q":"What does the underlined \"a new era of living and working\" refer to?\nBut with the emergence of the Fourth Industrial Revolution, a new era of living and working driven by artificial intelligence and cloud computing, those boundaries started to fade.","ko":"밑줄 친 a new era of living and working가 가리키는 것은?","sko":"그러나 인공지능과 클라우드 컴퓨팅에 의해 주도되는 생활과 업무 방식의 새로운 시대인 4차 산업혁명의 출현과 함께, 그러한 경계들은 희미해지기 시작했다.","opts":["빅 블러 현상","4차 산업혁명","클라우드 컴퓨팅","산업 사이의 경계"],"r":{"a":"2) 4차 산업혁명","ev":"5번 문장","s":[[5,"But with the emergence of the Fourth Industrial Revolution, a new era of living and working driven by artificial intelligence and cloud computing, those boundaries started to fade.","그러나 인공지능과 클라우드 컴퓨팅에 의해 주도되는 생활과 업무 방식의 새로운 시대인 4차 산업혁명의 출현과 함께, 그러한 경계들은 희미해지기 시작했다."]],"w":"a new era of living and working은 바로 앞의 the Fourth Industrial Revolution(4차 산업혁명)을 풀어서 설명하는 말이에요. 쉼표 뒤에서 앞 표현을 다시 설명해 줘요.","c":2,"k":"a new era of living and working = 4차 산업혁명"},"pron":"a new era of living and working","h":"3ae997d145"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is thus important for businesses to remain adaptable and open to integration.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서 기업들이 적응력을 유지하고 통합에 개방적인 것이 중요하다.","opts":["따라서 기업은 다른 분야와 합치는 일을 피하는 것이 중요하다.","따라서 기업은 변화에 맞춰 적응하고 다른 분야와의 통합에 열려 있는 것이 중요하다.","따라서 기업은 한 가지 분야에만 집중하는 것이 중요하다.","따라서 기업은 새로운 경쟁자를 모두 인수하는 것이 중요하다."],"r":{"a":"2) 따라서 기업은 변화에 맞춰 적응하고 다른 분야와의 통합에 열려 있는 것이 중요하다.","ev":"8번 문장","s":[[8,"It is thus important for businesses to remain adaptable and open to integration.","따라서 기업들이 적응력을 유지하고 통합에 개방적인 것이 중요하다."]],"w":"remain adaptable은 적응력을 유지하는 것이고, open to integration은 통합에 열려 있다는 뜻이에요. 통합을 피하거나 한 분야에만 집중하라는 말은 반대이고, 경쟁자를 인수하라는 내용은 본문에 없어요.","c":2},"h":"aca0a6ab8f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["병원들은 AI 알고리즘 사용을 거부한다.","구글 같은 기술 기업들은 건강 추적 서비스를 제공한다.","의료 기관은 건강 추적 서비스를 독점하고 있다.","병원과 기술 기업의 일은 전혀 겹치지 않는다."],"opts":["Hospitals refuse to use AI algorithms.","Tech firms like Google provide health-tracking services.","Medical institutions still keep health-tracking services only for themselves.","The work of hospitals and tech firms never overlaps."],"r":{"a":"2) Tech firms like Google provide health-tracking services.","ev":"6번 문장","s":[[6,"Hospitals utilize AI algorithms to detect potential health complications, while tech firms like Google provide health-tracking services once exclusive to medical institutions.","병원들은 잠재적인 건강 합병증을 감지하기 위해 AI 알고리즘을 활용하는 반면, 구글과 같은 기술 기업들은 한때 의료 기관의 전유물이었던 건강 추적 서비스를 제공한다."]],"w":"6번에서 병원은 AI 알고리즘을 활용하고, 구글 같은 기술 기업은 한때 의료 기관의 전유물이던 건강 추적 서비스를 제공한다고 해요. 그래서 일이 겹치고 있어요.","c":2},"h":"75d38ca831"},{"n":9,"t":"sum","q":"The Big Blur brings new (A) for innovation, but companies also face competition from new entrants, and it may change the kinds of (B) people value.","ko":"빅 블러는 혁신을 위한 새로운 (A)를 가져오지만 기업은 새로운 진입자와의 경쟁도 겪고, 사람들이 중요하게 여기는 (B)도 바꿀 수 있다.","oko":["(A) 제한 / (B) 기술","(A) 기회 / (B) 상품 가격","(A) 기회 / (B) 기술","(A) 기회 / (B) 건물","(A) 위험 / (B) 상품 가격"],"opts":["(A) restrictions / (B) skills","(A) opportunities / (B) product prices","(A) opportunities / (B) skills","(A) opportunities / (B) buildings","(A) risks / (B) product prices"],"r":{"a":"3) (A) opportunities / (B) skills","ev":"7, 10번 문장","s":[[7,"While the Big Blur offers new opportunities for innovation and job creation, organizations face competition not only from traditional rivals but also from new entrants originating from different industries.","빅 블러는 혁신과 일자리 창출을 위한 새로운 기회를 제공하지만, 조직들은 전통적인 경쟁자뿐만 아니라 다른 산업에서 비롯된 새로운 진입자들과의 경쟁에도 직면한다."],[10,"The Big Blur may be influencing not only industries, but also the kinds of skills and ways of thinking people value.","빅 블러 현상은 산업뿐만 아니라 사람들이 중요하게 여기는 기술과 사고방식에도 영향을 미치고 있을지도 모른다."]],"w":"7번에서 빅 블러는 혁신과 일자리 창출의 기회(opportunities)를 준다고 했고, 10번에서 사람들이 중요하게 여기는 기술(skills)과 사고방식에도 영향을 줄 수 있다고 해요. 제한, 위험, 상품 가격, 건물은 본문에 근거가 없어요.","c":3},"h":"2ee9c4097c"},{"n":10,"t":"fill","q":"In a Big Blur [A], the ability to think across [B] is just as valuable as deep expertise.","ko":"빅 블러 [A]에서, 여러 [B]을(를) 넘나들며 생각하는 능력은 깊은 전문 지식만큼이나 가치가 있다.","bank":["overlap","hospitals","entrants","society","fade","disciplines"],"bko":{"society":"사회","disciplines":"학문 분야들","entrants":"진입자들","hospitals":"병원들","fade":"희미해지다","overlap":"겹치다"},"r":{"a":"[A] society (사회), [B] disciplines (학문 분야들)","ev":"9번 문장","s":[[9,"In a Big Blur society, the ability to think across disciplines is just as valuable as deep expertise.","빅 블러 사회에서, 여러 분야를 넘나들며 생각하는 능력은 깊은 전문 지식만큼이나 가치가 있다."]],"w":"9번 In a Big Blur society, the ability to think across disciplines is just as valuable as deep expertise.에서 가져왔어요. entrants(진입자들)·hospitals(병원들)·fade(희미해지다)·overlap(겹치다)는 이 문장의 빈칸에 문법과 뜻이 맞지 않아요.","c":null},"h":"4f779426c6"}]},{"u":7,"id":"ms4-07-3","no":3,"ko":"아무리 그래도 챙길 건 챙겨야지!","items":[{"n":1,"t":"tf","q":"The pharaohs of ancient Egypt were buried in tombs located in the Valley of the Kings.","ko":"고대 이집트의 파라오들은 '왕들의 계곡'에 있는 무덤에 묻혔다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"For several hundred years, the pharaohs, the kings of ancient Egypt, were buried in elaborate and ornate tombs located in an area that has come to be known as the Valley of the Kings.","수백 년 동안, 고대 이집트의 왕인 파라오들은 ‘왕들의 계곡’이라고 알려지게 된 지역에 위치한 정교하고 화려한 무덤에 매장되었다."]],"w":"1번에서 파라오들이 Valley of the Kings라고 알려지게 된 지역에 위치한 정교하고 화려한 무덤에 매장되었다고 해요.","c":"T"},"h":"15def6ebab"},{"n":2,"t":"tf","q":"The officials refused to deliver bread to the workers.","ko":"관리들은 노동자들에게 빵을 전달하기를 거부했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Wanting progress on the tombs to continue, the officials mandated that bread be delivered to the men.","무덤에 대한 진척이 계속되기를 원했기 때문에, 관리들은 그 사람들에게 빵을 전달하라고 지시했다."]],"w":"6번에서 관리들은 무덤 작업이 계속되기를 원해서 노동자들에게 빵을 전달하라고 지시했어요(mandated that bread be delivered). 거부한 것이 아니에요.","c":"F"},"h":"a980224e7a"},{"n":3,"t":"tf","q":"The workers continued to strike whenever they felt they were being exploited.","ko":"노동자들은 착취당하고 있다고 느낄 때마다 계속 파업했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"After that incident, the workers continued to strike whenever they felt they were being exploited, which put pressure on the officials to give them full rations and fair treatment.","그 사건 이후, 노동자들은 착취당하고 있다고 느낄 때마다 파업을 계속했고, 이는 관리들이 그들에게 완전한 배급과 공정한 대우를 제공하도록 압력을 가했다."]],"w":"8번에서 the workers continued to strike whenever they felt they were being exploited(착취당한다고 느낄 때마다 파업을 계속했다)라고 해요.","c":"T"},"h":"76b8b8f37f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...they marched to the local officials and proclaimed, “We are hungry!”)","ko":"...그들은 지역 관리들에게 행진하여 “우리는 배가 고프다!”라고 선언했다.","opts":["속삭였다","선언했다","사과했다","부인했다"],"word":"proclaimed","r":{"a":"2) 선언했다","ev":"4번 문장","s":[[4,"Instead of performing their assigned tasks, they marched to the local officials and proclaimed, “We are hungry!”","할당된 업무를 수행하는 대신, 그들은 지역 관리들에게 행진하여 “우리는 배가 고프다!”라고 선언했다."]],"w":"노동자들이 관리들 앞에서 \"We are hungry!\"라고 크게 알리는 장면이에요. 공개적으로 말하는 것이라 proclaim = 선언하다.","c":2},"h":"a7c2398866"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Eventually, they had to yield to the workers’ demands.)","ko":"결국, 그들은 노동자들의 요구에 굴복해야 했다.","opts":["맞서 싸우다","굴복하다","무시하다","거부하다"],"word":"yield","r":{"a":"2) 굴복하다","ev":"9번 문장","s":[[9,"Eventually, they had to yield to the workers’ demands.","결국, 그들은 노동자들의 요구에 굴복해야 했다."]],"w":"8번에서 압력을 받은 관리들이 결국 노동자들의 요구를 들어줘야 했다는 문장이에요. 요구에 지고 따르는 것이라 yield to = ~에 굴복하다.","c":2},"h":"6c9c35dfc3"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nHaving waited 18 days to receive their regular payment of grain, which the workers typically used to make bread as their main food source, they laid down their tools and refused to work.","ko":"밑줄 친 which가 가리키는 것은?","sko":"주식인 빵을 만드는 데 주로 사용했던 곡물에 대한 정기적인 급여를 받기 위해 18일을 기다린 후, 그들은 도구를 내려놓고 일하기를 거부했다.","opts":["도구","곡물","18일","무덤"],"r":{"a":"2) 곡물","ev":"3번 문장","s":[[3,"Having waited 18 days to receive their regular payment of grain, which the workers typically used to make bread as their main food source, they laid down their tools and refused to work.","주식인 빵을 만드는 데 주로 사용했던 곡물에 대한 정기적인 급여를 받기 위해 18일을 기다린 후, 그들은 도구를 내려놓고 일하기를 거부했다."]],"w":"which 뒤에 the workers typically used to make bread(노동자들이 빵을 만드는 데 주로 사용했다)가 이어져요. 빵의 재료는 곡물(grain)이에요.","c":2},"h":"f1e17ef39c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The workers’ demands were simple: they would only resume their duties when they received payment for the work they had already completed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"노동자들의 요구는 간단했는데, 그들은 이미 완료한 작업에 대한 급여를 받을 때에만 일을 다시 시작하겠다는 것이었다.","opts":["노동자들은 급여와 상관없이 일을 다시 시작하겠다고 했다.","노동자들은 앞으로 할 일에 대한 급여를 미리 받아야 일을 시작하겠다고 했다.","노동자들은 이미 한 일의 급여를 받으면 일을 다시 시작하겠다고 했다.","노동자들은 관리들이 사과해야만 일을 다시 시작하겠다고 했다."],"r":{"a":"3) 노동자들은 이미 한 일의 급여를 받으면 일을 다시 시작하겠다고 했다.","ev":"5번 문장","s":[[5,"The workers’ demands were simple: they would only resume their duties when they received payment for the work they had already completed.","노동자들의 요구는 간단했는데, 그들은 이미 완료한 작업에 대한 급여를 받을 때에만 일을 다시 시작하겠다는 것이었다."]],"w":"only when ~은 '~할 때에만'이고, the work they had already completed는 이미 끝낸 일이에요. 그래서 이미 한 일의 급여를 받아야 일을 다시 시작한다는 뜻이에요. 앞으로 할 일의 급여나 관리의 사과는 나오지 않아요.","c":3},"h":"02b5d60490"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["노동자들은 빵을 받은 후에도 며칠 동안 일하지 않았다.","관리들은 빵 대신 돈을 주기로 했다.","노동자들은 제안이 받아들일 만하다고 여겨 다음 날 일터로 돌아갔다.","노동자들은 파라오가 직접 찾아온 뒤에야 일터로 돌아갔다."],"opts":["The workers stayed away from work for several days after getting bread.","The officials decided to give money instead of bread.","The workers thought the offer was acceptable and returned to work the next day.","The workers returned to work only after the pharaoh visited them."],"r":{"a":"3) The workers thought the offer was acceptable and returned to work the next day.","ev":"6~7번 문장","s":[[6,"Wanting progress on the tombs to continue, the officials mandated that bread be delivered to the men.","무덤에 대한 진척이 계속되기를 원했기 때문에, 관리들은 그 사람들에게 빵을 전달하라고 지시했다."],[7,"Because the workers considered their offer to be acceptable, they returned to their work the next day.","노동자들이 그들의 제안을 받아들일 만하다고 여겼기 때문에, 그들은 다음 날 작업에 복귀했다."]],"w":"6번에서 관리들이 빵을 전달하라고 지시했고, 7번에서 노동자들이 그 제안을 받아들일 만하다고 여겨 다음 날 복귀했어요. 돈을 주기로 했다는 말, 며칠 동안 일하지 않았다는 말, 파라오가 찾아왔다는 말은 본문에 없어요.","c":3},"h":"7ce287b99a"},{"n":9,"t":"sum","q":"In 1170 BC, the (A) who built and decorated the burial sites chose an action that was (B) at the time.","ko":"기원전 1170년, 매장지를 건설하고 장식한 (A)은(는) 당시로서는 (B) 행동을 선택했다.","oko":["(A) 관리들 / (B) 상상도 할 수 없는","(A) 장인들 / (B) 평범한","(A) 파라오들 / (B) 평범한","(A) 관리들 / (B) 평범한","(A) 장인들 / (B) 상상도 할 수 없는"],"opts":["(A) officials / (B) unthinkable","(A) artisans / (B) ordinary","(A) pharaohs / (B) ordinary","(A) officials / (B) ordinary","(A) artisans / (B) unthinkable"],"r":{"a":"5) (A) artisans / (B) unthinkable ((A) 장인들 / (B) 상상도 할 수 없는)","ev":"2번 문장","s":[[2,"In 1170 BC, the artisans who were tasked with building and decorating these burial sites chose a course of action that would have been unthinkable at the time.","기원전 1170년, 이 매장지를 건설하고 장식하는 임무를 맡은 장인들은 당시로서는 상상도 할 수 없었던 행동 방침을 선택했다."]],"w":"2번에서 매장지를 건설하고 장식하는 임무를 맡은 사람들은 the artisans(장인들)이고, 이들이 선택한 행동은 당시로서는 unthinkable(상상도 할 수 없는)이었다고 해요.","c":5},"h":"d5c8a46eb5"},{"n":10,"t":"fill","q":"For the first time in [A], workers proved what could be accomplished when they stood up for themselves, establishing a [B] for others to follow.","ko":"[A]에서 처음으로, 노동자들은 그들이 스스로를 위해 일어섰을 때 무엇이 성취될 수 있는지를 증명했고, 다른 사람들이 따를 [B]을(를) 확립했다.","bank":["pressure","precedent","incident","history","ration","tombs"],"bko":{"history":"역사","precedent":"선례","pressure":"압력","ration":"배급량","incident":"사건","tombs":"무덤"},"r":{"a":"[A] history (역사), [B] precedent (선례)","ev":"10번 문장","s":[[10,"For the first time in history, workers proved what could be accomplished when they stood up for themselves, establishing a precedent for others to follow.","역사상 처음으로, 노동자들은 그들이 스스로를 위해 일어섰을 때 무엇이 성취될 수 있는지를 증명했고, 다른 사람들이 따를 선례를 확립했다."]],"w":"10번 For the first time in history, workers proved what could be accomplished when they stood up for themselves, establishing a precedent for others to follow.에서 가져왔어요. pressure(압력)·ration(배급량)·incident(사건)·tombs(무덤)는 이 문장의 빈칸에 뜻이 맞지 않아요.","c":null},"h":"e267228a95"}]},{"u":7,"id":"ms4-07-4","no":4,"ko":"Counting Without Counting","items":[{"n":1,"t":"tf","q":"A musical phrase is commonly built from four measures, and it may expand into eight.","ko":"음악 구절은 일반적으로 4마디로 구성되며 8마디로 확장될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"A musical phrase is commonly built from four measures, which may then expand into eight.","하나의 음악 구절은 일반적으로 4마디로 구성되며, 이는 8마디로 확장될 수 있다."]],"w":"2번에서 A musical phrase is commonly built from four measures, which may then expand into eight(4마디로 구성되고 8마디로 확장될 수 있다)라고 해요.","c":"T"},"h":"ec93d25baa"},{"n":2,"t":"tf","q":"This profound stability originates from music itself rather than from the way humans move and think.","ko":"이러한 깊은 안정감은 인간이 움직이고 생각하는 방식이 아니라 음악 자체에서 비롯된다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"This profound stability originates not intrinsically from music itself, but from the fundamental mechanisms governing human locomotion and cognition.","이러한 깊은 안정감은 음악 자체에서 본질적으로 비롯되는 것이 아니라, 인간의 이동과 인지를 지배하는 근본적인 메커니즘에서 비롯된다."]],"w":"5번은 안정감이 음악 자체에서 본질적으로 비롯되는 것이 아니라(not intrinsically from music itself), 인간의 이동과 인지를 지배하는 근본적인 메커니즘에서 비롯된다고 해요. 원인을 정반대로 말한 문장이에요.","c":"F"},"h":"1259dfbef8"},{"n":3,"t":"tf","q":"Four beats are long enough to register as a pattern yet short enough to maintain tension.","ko":"4박자는 패턴으로 인식되기에 충분히 길지만 긴장을 유지하기에 충분히 짧다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The brain seems to favor this structure too, as four beats are long enough to register as a pattern yet short enough to maintain tension, while eight beats provide a sense of completion.","뇌 또한 이 구조를 선호하는 것으로 보이는데, 4박자는 패턴으로 인식되기에 충분히 길지만 긴장을 유지하기에 충분히 짧은 반면, 8박자는 완결감을 제공하기 때문이다."]],"w":"8번에서 four beats are long enough to register as a pattern yet short enough to maintain tension이라고 해요.","c":"T"},"h":"7d04be3061"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...relying more on intuition than calculation to know when to begin and when to conclude.)","ko":"...언제 시작하고 언제 끝낼지 알기 위해 계산보다는 직관에 더 의존한다.","opts":["직관","계산","훈련","기억"],"word":"intuition","r":{"a":"1) 직관","ev":"4번 문장","s":[[4,"Performers experience this feeling as well, relying more on intuition than calculation to know when to begin and when to conclude.","연주자들 또한 이 느낌을 경험하며, 언제 시작하고 언제 끝낼지 알기 위해 계산보다는 직관에 더 의존한다."]],"w":"4번은 연주자들이 계산 대신 무엇에 더 기댄다는 문장이에요. 3번에서 숫자를 세지 않아도 다음에 올 것을 느낀다고 했으니, 세지 않고도 아는 감각인 intuition = 직관이에요.","c":1},"h":"6cb69baef7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...odd-numbered rhythms often feel unstable and demand greater attention from the listener.)","ko":"...홀수 리듬은 종종 불안정하게 느껴지며 청취자에게 더 큰 주의를 요구한다.","opts":["제공하다","거절하다","요구하다","줄이다"],"word":"demand","r":{"a":"3) 요구하다","ev":"9번 문장","s":[[9,"By contrast, odd-numbered rhythms often feel unstable and demand greater attention from the listener.","대조적으로, 홀수 리듬은 종종 불안정하게 느껴지며 청취자에게 더 큰 주의를 요구한다."]],"w":"홀수 리듬은 불안정해서 듣는 사람이 더 집중해야 한다는 뜻이에요. 주의를 필요로 한다는 의미라 demand = 요구하다.","c":3},"h":"4787780d6e"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nListeners do not consciously count these numbers, but they still have a natural sense of what comes next.","ko":"밑줄 친 they가 가리키는 것은?","sko":"청취자들은 이 숫자를 의식적으로 세지 않지만, 여전히 다음에 무엇이 올지에 대한 자연스러운 감각을 가지고 있다.","opts":["숫자들","청취자들","멜로디들","마디들"],"r":{"a":"2) 청취자들","ev":"3번 문장","s":[[3,"Listeners do not consciously count these numbers, but they still have a natural sense of what comes next.","청취자들은 이 숫자를 의식적으로 세지 않지만, 여전히 다음에 무엇이 올지에 대한 자연스러운 감각을 가지고 있다."]],"w":"문장의 주어는 Listeners이고, 'but they still have ~'에서 대조되는 두 동작(세지 않음 / 감각이 있음)의 주체가 같아요. 그래서 they는 청취자들이에요.","c":2},"h":"34b92c5d19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These effects stand out, however, precisely because a familiar four-beat structure already exists as a reference.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 이러한 효과들은 친숙한 4박자 구조가 이미 기준점으로 존재하기 때문에 정확히 두드러진다.","opts":["불규칙한 리듬은 4박 구조를 없앨 때에만 효과가 있다.","친숙한 4박 구조가 기준으로 있기 때문에 불규칙한 리듬의 효과가 두드러진다.","4박 구조는 불규칙한 리듬 때문에 친숙해졌다.","친숙한 구조가 없을 때 불규칙한 리듬의 효과가 가장 두드러진다."],"r":{"a":"2) 친숙한 4박 구조가 기준으로 있기 때문에 불규칙한 리듬의 효과가 두드러진다.","ev":"12번 문장","s":[[12,"These effects stand out, however, precisely because a familiar four-beat structure already exists as a reference.","그러나 이러한 효과들은 친숙한 4박자 구조가 이미 기준점으로 존재하기 때문에 정확히 두드러진다."]],"w":"precisely because ~는 '바로 ~하기 때문에'로, 이유가 기준(reference)이 되는 4박 구조예요. 기준이 있어서 벗어난 효과가 눈에 띈다는 뜻이에요. 구조를 없애야 한다는 말, 원인과 결과를 바꾼 말, 기준이 없을 때 두드러진다는 말은 모두 틀려요.","c":2},"h":"06909ef688"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["음악 구절의 4마디는 8마디로 확장될 수 없다.","4와 8은 신체가 따르기에 가장 편안한 단위가 된다.","8박자는 긴장을 유지하기에 4박자보다 더 적합하다.","홀수 리듬은 청취자에게 가장 안정적으로 느껴진다."],"opts":["Four measures can never expand into eight.","Four and eight become the most comfortable units for the body to follow.","Eight beats are better than four beats at maintaining tension.","Odd-numbered rhythms feel the most stable to listeners."],"r":{"a":"2) Four and eight become the most comfortable units for the body to follow.","ev":"7번 문장","s":[[7,"As these patterns expand, four and eight become the most comfortable units for the body to follow.","이러한 패턴이 확장됨에 따라, 4와 8은 신체가 따르기에 가장 편안한 단위가 된다."]],"w":"7번에서 이 패턴이 확장되면서 4와 8이 신체가 따르기에 가장 편안한 단위가 된다고 해요. 4마디는 8마디로 확장될 수 있고(2번), 긴장을 유지하는 것은 4박자이며 8박자는 완결감을 주고(8번), 홀수 리듬은 불안정하게 느껴져요(9번).","c":2},"h":"913dab4c01"},{"n":9,"t":"sum","q":"Not all music aims for stability alone, so (A) and (B) music frequently use irregular rhythms to add tension and movement.","ko":"모든 음악이 안정성만을 목표로 하는 것은 아니어서, (A)와(과) (B) 음악은 긴장과 움직임을 더하기 위해 불규칙한 리듬을 자주 사용한다.","oko":["(A) 클래식 / (B) 실험","(A) 재즈 / (B) 대중","(A) 클래식 / (B) 대중","(A) 대중 / (B) 실험","(A) 재즈 / (B) 실험"],"opts":["(A) Classical / (B) experimental","(A) Jazz / (B) popular","(A) Classical / (B) popular","(A) Popular / (B) experimental","(A) Jazz / (B) experimental"],"r":{"a":"5) (A) Jazz / (B) experimental ((A) 재즈 / (B) 실험)","ev":"10~11번 문장","s":[[10,"For this reason, not all music aims for stability alone.","이러한 이유로, 모든 음악이 안정성만을 목표로 하는 것은 아니다."],[11,"Jazz and experimental music frequently use irregular rhythms to introduce tension and movement.","재즈와 실험 음악은 긴장과 움직임을 도입하기 위해 불규칙한 리듬을 자주 사용한다."]],"w":"11번에서 긴장과 움직임을 도입하려고 불규칙한 리듬을 자주 사용하는 것은 Jazz and experimental music(재즈와 실험 음악)이에요.","c":5},"h":"3d978d0b01"},{"n":10,"t":"fill","q":"Human movement follows paired rhythms, such as walking and [A], which naturally group in [B].","ko":"인간의 움직임은 걷기와 [A]처럼 짝을 이룬 리듬을 따르는데, 이는 자연스럽게 [B](으)로 그룹화된다.","bank":["tension","calculation","attention","twos","breathing","intuition"],"bko":{"breathing":"호흡","twos":"둘씩(2개 단위)","intuition":"직관","calculation":"계산","tension":"긴장","attention":"주의"},"r":{"a":"[A] breathing (호흡), [B] twos (둘씩(2개 단위))","ev":"6번 문장","s":[[6,"Human movement follows paired rhythms, such as walking and breathing, which naturally group in twos.","인간의 움직임은 걷기와 호흡처럼 짝을 이룬 리듬을 따르는데, 이는 자연스럽게 둘로 그룹화된다."]],"w":"6번 Human movement follows paired rhythms, such as walking and breathing, which naturally group in twos.에서 가져왔어요. intuition(직관)·calculation(계산)·tension(긴장)·attention(주의)은 이 문장의 빈칸에 뜻이 맞지 않아요.","c":null},"h":"b4331ff9bc"}]},{"u":8,"id":"ms4-08-1","no":1,"ko":"말 한마디에 AI가 달라져!","items":[{"n":1,"t":"tf","q":"AI can generate a vast amount of data at a remarkable speed.","ko":"AI는 놀라운 속도로 방대한 양의 데이터를 생성할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"AI is a powerful tool capable of generating a vast amount of data at a remarkable speed.","AI는 놀라운 속도로 방대한 양의 데이터를 생성할 수 있는 강력한 도구이다."]],"w":"10번에 AI는 놀라운 속도로 방대한 양의 데이터를 생성할 수 있는 강력한 도구(capable of generating a vast amount of data at a remarkable speed)라고 나와요.","c":"T"},"h":"64d4435f5e"},{"n":2,"t":"tf","q":"A prompt does not need any background information because the AI already knows the expected outcome.","ko":"AI가 이미 예상되는 결과를 알고 있으므로 프롬프트에는 배경 정보가 필요 없다.","r":{"a":"F (본문과 다른 내용)","ev":"7~8번 문장","s":[[7,"The prompt should also contain the context necessary for the AI program to comprehend the anticipated outcome.","프롬프트는 또한 AI 프로그램이 예상되는 결과를 이해하는 데 필요한 맥락을 포함해야 한다."],[8,"This might take the form of relevant background information, concrete examples, or a comprehensive set of parameters.","이것은 관련된 배경 정보, 구체적인 예시, 또는 포괄적인 매개변수 세트의 형태를 취할 수 있다."]],"w":"7번에서 AI가 예상되는 결과를 이해하려면 프롬프트에 맥락이 필요하다고 하고, 8번에서 그 맥락이 배경 정보 등의 형태라고 해요. 필요 없다는 말은 반대예요.","c":"F"},"h":"dd70381506"},{"n":3,"t":"tf","q":"A prompt should state the format and tone that the user wants in the response.","ko":"프롬프트는 사용자가 응답에서 원하는 형식과 어조를 밝혀야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Finally, the prompt should identify the desired format and tone of the response to make certain that it corresponds to the user’s expectations.","마지막으로, 프롬프트는 사용자의 기대에 부합하는지 확인하기 위해 응답의 원하는 형식과 어조를 식별해야 한다."]],"w":"9번에서 프롬프트는 응답의 원하는 형식과 어조(desired format and tone)를 정해야 한다고 해요.","c":"T"},"h":"37d6e728a0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the task must be accurately explained with precise language that avoids any ambiguous phrasing.)","ko":"작업이 모호한 표현을 피하는 정밀한 언어로 정확하게 설명되어야 한다.","opts":["모호한","복잡한","정밀한","간단한"],"word":"precise","r":{"a":"3) 정밀한","ev":"6번 문장","s":[[6,"Most importantly, the task must be accurately explained with precise language that avoids any ambiguous phrasing.","가장 중요하게는, 작업이 모호한 표현을 피하는 정밀한 언어로 정확하게 설명되어야 한다."]],"w":"precise language는 avoids any ambiguous phrasing(모호한 표현을 피하는)이 꾸며 주는 말이라 ‘모호한’의 반대인 정밀한이에요.","c":3},"h":"d35073298f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Simultaneously, new careers in the AI industry are emerging, such as prompt engineering.)","ko":"동시에, 프롬프트 엔지니어링과 같은 새로운 직업들이 AI 산업에서 등장하고 있다.","opts":["사라지고 있다","나타나고 있다","변하지 않고 있다","느려지고 있다"],"word":"emerging","r":{"a":"2) 나타나고 있다","ev":"2번 문장","s":[[2,"Simultaneously, new careers in the AI industry are emerging, such as prompt engineering.","동시에, 프롬프트 엔지니어링과 같은 새로운 직업들이 AI 산업에서 등장하고 있다."]],"w":"new careers(새로운 직업)가 AI 산업에 생기고 있다는 뜻이라 ‘나타나고 있다’가 맞아요. emerge = 나타나다.","c":2},"h":"e10c37a66d"},{"n":6,"t":"ref","q":"What does the underlined \"its\" refer to?\nSkillfully crafted prompts enhance the performance of AI, greatly increasing its utility for a wide variety of applications, including content creation, data analysis, and problem-solving.","ko":"밑줄 친 its가 가리키는 것은?","sko":"솜씨 좋게 만들어진 프롬프트는 AI의 성능을 향상시켜, 콘텐츠 제작, 데이터 분석, 문제 해결을 포함한 광범위한 응용 분야에서 그것의 유용성을 크게 증가시킨다.","opts":["프롬프트들","AI","다양한 응용 분야","콘텐츠 제작"],"r":{"a":"2) AI","ev":"4번 문장","s":[[4,"Skillfully crafted prompts enhance the performance of AI, greatly increasing its utility for a wide variety of applications, including content creation, data analysis, and problem-solving.","솜씨 좋게 만들어진 프롬프트는 AI의 성능을 향상시켜, 콘텐츠 제작, 데이터 분석, 문제 해결을 포함한 광범위한 응용 분야에서 그것의 유용성을 크게 증가시킨다."]],"w":"its는 같은 문장의 the performance of AI(AI의 성능)에서 AI를 가리켜요. 잘 만든 프롬프트가 AI의 쓸모(utility)를 크게 늘려 준다는 뜻이에요.","c":2,"k":"its = AI"},"pron":"its","h":"acb3accb2d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Artificial intelligence (AI) is fundamentally reshaping the job market, with routine tasks increasingly being automated.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"인공지능(AI)은 일상적인 업무가 점점 더 자동화되면서 근본적으로 직업 시장을 재편하고 있다.","opts":["AI는 직업 시장에 영향을 주지 않고 일상 업무만 조금 돕고 있다.","AI가 직업 시장을 바꾸는 바람에 일상적인 업무는 오히려 늘고 있다.","AI 때문에 모든 직업이 사라지고 있다.","AI는 일상적인 업무를 점점 자동화하면서 직업 시장을 근본적으로 바꾸고 있다."],"r":{"a":"4) AI는 일상적인 업무를 점점 자동화하면서 직업 시장을 근본적으로 바꾸고 있다.","ev":"1번 문장","s":[[1,"Artificial intelligence (AI) is fundamentally reshaping the job market, with routine tasks increasingly being automated.","인공지능(AI)은 일상적인 업무가 점점 더 자동화되면서 근본적으로 직업 시장을 재편하고 있다."]],"w":"with routine tasks increasingly being automated는 ‘일상적인 업무가 점점 자동화되면서’라는 뜻이에요. 업무가 늘어난다거나 모든 직업이 사라진다는 말은 없어요.","c":4},"h":"dc54fd065f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["더 단순한 입력이 AI를 더 효과적으로 만든다.","AI는 어떤 입력을 받든 똑같이 효과적이다.","더 정교한 입력이 AI를 더 효과적으로 만든다.","AI는 사용자가 입력을 그만둘 때만 더 효과적이 된다."],"opts":["A simpler input makes the AI more effective.","The AI is equally effective whatever input it receives.","A more sophisticated input makes the AI more effective.","The AI becomes more effective only when the user stops giving input."],"r":{"a":"3) A more sophisticated input makes the AI more effective. (더 정교한 입력이 AI를 더 효과적으로 만든다.)","ev":"12번 문장","s":[[12,"The more sophisticated the input is, the more effective the AI becomes.","입력이 더 정교할수록, AI는 더 효과적이게 된다."]],"w":"12번 The more sophisticated the input is, the more effective the AI becomes.는 입력이 더 정교할수록 AI가 더 효과적이 된다는 뜻이에요.","c":3},"h":"0a8867cf46"},{"n":9,"t":"sum","q":"The (A) of AI’s output is (B) on the input it receives from the user.","ko":"AI 결과물의 (A)은(는) 사용자로부터 받는 입력에 대해 (B)이다.","oko":["(A) 속도 / (B) 의존적","(A) 품질 / (B) 독립적","(A) 속도 / (B) 독립적","(A) 크기 / (B) 의존적","(A) 품질 / (B) 의존적"],"opts":["(A) speed / (B) dependent","(A) quality / (B) independent","(A) speed / (B) independent","(A) size / (B) dependent","(A) quality / (B) dependent"],"r":{"a":"5) (A) quality / (B) dependent ((A) 품질 / (B) 의존적)","ev":"11번 문장","s":[[11,"However, the quality of its output is dependent on the input it receives from the user.","그러나, 그 결과물의 품질은 그것이 사용자로부터 받는 입력에 달려 있다."]],"w":"11번 the quality of its output is dependent on the input it receives from the user에서 결과물의 품질(quality)은 사용자의 입력에 달려 있다(dependent on)고 해요.","c":5},"h":"e52d8c0c34"},{"n":10,"t":"fill","q":"Prompt engineering is the [A] of designing and refining specific [B]—called “prompts”—for AI programs in order to generate appropriate outputs.","ko":"프롬프트 엔지니어링은 적절한 결과물을 생성하기 위해 AI 프로그램을 위한 “프롬프트”라고 불리는 구체적인 [B]을(를) 설계하고 다듬는 [A]에 해당한다.","bank":["shrinking","instructions","emerging","practice","ambiguous","precise"],"bko":{"practice":"작업(관행)","instructions":"지시 사항","ambiguous":"모호한","emerging":"생겨나는","shrinking":"줄어드는","precise":"정밀한"},"r":{"a":"[A] practice (작업(관행)), [B] instructions (지시 사항)","ev":"3번 문장","s":[[3,"Prompt engineering is the practice of designing and refining specific instructions—called “prompts”—for AI programs in order to generate appropriate outputs.","프롬프트 엔지니어링은 적절한 결과물을 생성하기 위해 AI 프로그램을 위한 “프롬프트”라고 불리는 구체적인 지시 사항을 설계하고 다듬는 작업이다."]],"w":"3번 Prompt engineering is the practice of designing and refining specific instructions—called “prompts”—for AI programs ...에서 가져왔어요. ambiguous(모호한)·emerging(생겨나는)·shrinking(줄어드는)·precise(정밀한)는 형용사나 -ing 꼴이라 이 문장의 빈칸에 문법상 맞지 않아요.","c":null},"h":"2ca36b8029"}]},{"u":8,"id":"ms4-08-2","no":2,"ko":"공식 스폰서인 척 숟가락 얹기!","items":[{"n":1,"t":"tf","q":"Visa paid $40 million to be the official credit card of the 2012 London Olympics.","ko":"Visa는 2012년 런던 올림픽의 공식 신용카드가 되기 위해 4천만 달러를 지불했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"For instance, Visa paid $40 million to be the official credit card of the 1994 Winter Olympics in Norway.","예를 들어, Visa는 1994년 노르웨이 동계 올림픽의 공식 신용카드가 되기 위해 4천만 달러를 지불했다."]],"w":"7번에서 Visa가 공식 신용카드가 된 것은 1994년 노르웨이 동계 올림픽이에요. 2012년 런던 올림픽은 11번 비츠 바이 드레 사례에 나오는 행사예요.","c":"F"},"h":"adb0d0be27"},{"n":2,"t":"tf","q":"In ambush marketing, a brand tries to gain attention without actually paying for sponsorships.","ko":"앰부시 마케팅에서 브랜드는 실제로 후원 비용을 내지 않고 관심을 얻으려 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"This is called ambush marketing, where a brand uses creative campaigns to associate itself with a major event and thus gain attention without actually paying for sponsorships.","이것은 앰부시 마케팅이라고 불리며, 브랜드가 창의적인 캠페인을 활용해 주요 행사와 자신을 연관시키고, 실제로 후원 비용을 지불하지 않으면서도 관심을 얻는 것을 말한다."]],"w":"4번에서 앰부시 마케팅은 브랜드가 창의적인 캠페인으로 행사와 연관돼 후원 비용을 지불하지 않고도 관심을 얻는 것이라고 해요.","c":"T"},"h":"e48420f12f"},{"n":3,"t":"tf","q":"Beats by Dre’s sales dropped by 42 percent after its headphones appeared on TV.","ko":"비츠 바이 드레의 헤드폰이 TV에 나온 뒤 매출이 42퍼센트 떨어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Many participants wore them during the TV broadcast, and this widespread exposure contributed significantly to a 42 percent increase in sales that year.","많은 참가자가 TV 방송 중에 그것들을 착용했고, 이 광범위한 노출은 그해 매출의 42퍼센트 증가에 상당히 기여했다."]],"w":"12번에서 참가자들이 방송에서 헤드폰을 착용했고, 그 노출이 그해 매출의 42퍼센트 증가에 기여했다고 해요. 떨어졌다는 말은 반대예요.","c":"F"},"h":"65ef8b4812"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…it managed to reap substantial benefits from the World Cup fever…)","ko":"그것(펩시)은 월드컵 열기로부터 상당한 이익을 거둘 수 있었다.","opts":["사소한","불법적인","상당한","일시적인"],"word":"substantial","r":{"a":"3) 상당한","ev":"3번 문장","s":[[3,"Through this smart strategy, it managed to reap substantial benefits from the World Cup fever, despite having no legitimate connection to the event.","이 영리한 전략을 통해, 그것(펩시)은 행사와 아무런 합법적인 관련이 없음에도 불구하고 월드컵 열기로부터 상당한 이익을 거둘 수 있었다."]],"w":"월드컵 열기에서 거둔 이익이 크다는 흐름이라 ‘상당한’이 맞아요. 앞의 smart strategy(영리한 전략)와도 어울려요.","c":3},"h":"0dd2eed532"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, ambush marketing should be employed with extreme caution…)","ko":"그러나, 앰부시 마케팅은 극도의 주의를 기울여 사용되어야 한다.","opts":["고용되어","사용되어","금지되어","발표되어"],"word":"employed","r":{"a":"2) 사용되어","ev":"13번 문장","s":[[13,"However, ambush marketing should be employed with extreme caution, as it can lead to severe risks.","그러나, 앰부시 마케팅은 심각한 위험으로 이어질 수 있으므로 극도의 주의를 기울여 사용되어야 한다."]],"w":"employ는 ‘고용하다’로 많이 알려져 있지만 여기서는 마케팅 방법이 주어라서 ‘사용하다’예요. should be employed = 사용되어야 한다.","c":2},"h":"9ec0b787b5"},{"n":6,"t":"ref","q":"What does the underlined \"whose\" refer to?\nIn response, Pepsi launched a campaign featuring popular soccer players whose faces appeared on special edition Pepsi cans.","ko":"밑줄 친 whose가 가리키는 것은?","sko":"이에 대응하여, 펩시는 인기 있는 축구 선수들을 특징으로 하는 캠페인을 시작했는데, 그들의 얼굴은 특별판 펩시 캔에 등장했다.","opts":["펩시","인기 있는 축구 선수들","특별판 펩시 캔","월드컵 공식 후원사"],"r":{"a":"2) 인기 있는 축구 선수들","ev":"2번 문장","s":[[2,"In response, Pepsi launched a campaign featuring popular soccer players whose faces appeared on special edition Pepsi cans.","이에 대응하여, 펩시는 인기 있는 축구 선수들을 특징으로 하는 캠페인을 시작했는데, 그들의 얼굴은 특별판 펩시 캔에 등장했다."]],"w":"whose faces appeared on special edition Pepsi cans에서 whose는 바로 앞의 popular soccer players(인기 있는 축구 선수들)를 가리켜요. 캔에 얼굴이 나온 사람들이 선수들이에요.","c":2,"k":"whose = 인기 있는 축구 선수들"},"pron":"whose","h":"a1939591ea"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Illegally using an event’s intellectual property, such as logos or related slogans, could result in heavy fines and could also damage the company’s reputation.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"로고나 관련 슬로건과 같은 행사의 지적 재산을 불법적으로 사용하는 것은 무거운 벌금을 초래할 수 있으며 또한 회사의 평판을 손상시킬 수 있다.","opts":["행사의 로고를 만든 회사는 무거운 벌금을 받을 수 있다.","행사의 슬로건을 합법적으로 쓰면 회사의 평판이 좋아진다.","벌금만 내면 행사의 지적 재산을 마음대로 써도 된다.","행사의 로고나 슬로건을 불법으로 쓰면 큰 벌금을 물고 회사의 평판도 나빠질 수 있다."],"r":{"a":"4) 행사의 로고나 슬로건을 불법으로 쓰면 큰 벌금을 물고 회사의 평판도 나빠질 수 있다.","ev":"14번 문장","s":[[14,"Illegally using an event’s intellectual property, such as logos or related slogans, could result in heavy fines and could also damage the company’s reputation.","로고나 관련 슬로건과 같은 행사의 지적 재산을 불법적으로 사용하는 것은 무거운 벌금을 초래할 수 있으며 또한 회사의 평판을 손상시킬 수 있다."]],"w":"Illegally using(불법적으로 사용하는 것)이 주어이고, could result in heavy fines(무거운 벌금을 초래할 수 있다)와 could also damage the company’s reputation(평판도 손상시킬 수 있다)이 결과예요.","c":4},"h":"1f6266bc48"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["펩시는 2014년 월드컵의 공식 후원사였다.","아메리칸 익스프레스는 1994년 동계 올림픽의 공식 신용카드였다.","비츠 바이 드레는 올림픽 전에 국기가 그려진 맞춤형 헤드폰을 선수들에게 나눠 주었다.","코카콜라는 2014년 월드컵 기간에 앰부시 캠페인을 했다."],"opts":["Pepsi was the official sponsor of the 2014 World Cup.","American Express was the official credit card of the 1994 Winter Olympics.","Before the 2012 London Olympics, Beats by Dre gave athletes custom headphones featuring national flags.","Coca-Cola ran an ambush campaign during the 2014 World Cup."],"r":{"a":"3) Before the 2012 London Olympics, Beats by Dre gave athletes custom headphones featuring national flags. (비츠 바이 드레는 올림픽 전에 국기가 그려진 맞춤형 헤드폰을 선수들에게 나눠 주었다.)","ev":"11번 문장","s":[[11,"Before the 2012 London Olympics, Beats by Dre, a well-known audio equipment company, strategically distributed custom headphones featuring the flags of various countries to athletes.","2012년 런던 올림픽 전에, 잘 알려진 오디오 장비 회사인 비츠 바이 드레는 여러 국가의 국기가 그려진 맞춤형 헤드폰을 선수들에게 전략적으로 배포했다."]],"w":"11번에서 비츠 바이 드레는 2012년 런던 올림픽 전에 여러 국가의 국기가 그려진 맞춤형 헤드폰을 선수들에게 배포했어요. 2014년 월드컵의 공식 후원사는 코카콜라(1번)였고, 1994년 동계 올림픽의 공식 신용카드는 Visa(7번)였어요.","c":3},"h":"962e46050a"},{"n":9,"t":"sum","q":"A direct ambush makes explicit references to an event, while (A) ambush marketing is much more (B).","ko":"직접적인 앰부시는 행사를 명시적으로 언급하는 반면, (A) 앰부시 마케팅은 훨씬 더 (B) 방식이다.","oko":["(A) 간접적인 / (B) 뻔한","(A) 직접적인 / (B) 교묘한","(A) 직접적인 / (B) 뻔한","(A) 불법적인 / (B) 비싼","(A) 간접적인 / (B) 교묘한"],"opts":["(A) indirect / (B) obvious","(A) direct / (B) subtle","(A) direct / (B) obvious","(A) illegal / (B) expensive","(A) indirect / (B) subtle"],"r":{"a":"5) (A) indirect / (B) subtle ((A) 간접적인 / (B) 교묘한)","ev":"6번, 10번 문장","s":[[6,"A direct ambush makes explicit references to an event or competitor.","직접적인 앰부시는 행사나 경쟁사를 명시적으로 언급한다."],[10,"Indirect ambush marketing, on the other hand, is much more subtle.","반면에, 간접적인 앰부시 마케팅은 훨씬 더 교묘하다."]],"w":"6번에서 직접적인 앰부시는 행사나 경쟁사를 명시적으로 언급한다고 했고, 10번에서 반면에(on the other hand) 간접적인(indirect) 앰부시는 훨씬 더 교묘하다(subtle)고 해요.","c":5},"h":"a952f63f99"},{"n":10,"t":"fill","
