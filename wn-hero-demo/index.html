<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>오답노트 샘플</title>
<style>
:root{--bg:#f6f7f4;--card:#fff;--ink:#1f2a24;--sub:#6b766f;--line:#dfe4de;--pri:#2f7d5b;--okBg:#e4f3ea;--ok:#2f7d5b}
@media (prefers-color-scheme:dark){:root{--bg:#141815;--card:#1d231f;--ink:#e8eee9;--sub:#97a39b;--line:#2f3832;--pri:#4fb98a;--okBg:#183024;--ok:#58c28f}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,"Noto Sans KR","Malgun Gothic",sans-serif;padding:14px 14px 40px;max-width:520px;margin:0 auto}
.top{display:flex;justify-content:space-between;align-items:center;margin:4px 2px 12px}
.top b{font-size:17px}
.tag{font-size:11px;color:var(--sub);border:1px solid var(--line);border-radius:999px;padding:2px 9px}

/* hero */
.hero{border-radius:22px;padding:22px 20px 18px;color:#f1f7f3;background:linear-gradient(155deg,#1c4d38 0%,#2f7d5b 55%,#3f9c73 100%);box-shadow:0 10px 28px rgba(31,77,56,.28);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:200px;height:200px;border-radius:50%;background:rgba(255,255,255,.07)}
.hero .lb{font-size:13px;opacity:.85;letter-spacing:.02em}
.hero .big{font-size:60px;font-weight:800;line-height:1.05;margin:4px 0 2px;letter-spacing:-.02em}
.hero .big small{font-size:20px;font-weight:600;margin-left:4px;opacity:.9}
.hero .cap{font-size:13px;opacity:.85}
.mini{display:flex;gap:10px;margin:18px 0 16px}
.mini div{flex:1;background:rgba(255,255,255,.13);border-radius:14px;padding:11px 12px}
.mini b{display:block;font-size:24px;font-weight:800;line-height:1.1}
.mini span{font-size:12px;opacity:.88}

.srcT{font-size:12px;opacity:.85;margin:0 0 7px}
.bar{display:flex;height:14px;border-radius:999px;overflow:hidden;background:rgba(255,255,255,.15)}
.bar i{display:block;height:100%}
.bar i + i{margin-left:2px}
.leg{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.leg span{font-size:12px;color:#f1f7f3;display:flex;align-items:center;gap:6px;margin-right:8px}
.leg em{width:8px;height:8px;border-radius:50%;display:inline-block;font-style:normal}
.leg b{font-weight:800}

/* panel */
.panel{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin-top:12px}
.panel h3{margin:0 0 12px;font-size:15px;display:flex;justify-content:space-between;align-items:baseline}
.panel h3 span{font-size:12px;font-weight:500;color:var(--sub)}
.wl{display:flex;flex-direction:column}
.w{display:flex;align-items:center;gap:10px;padding:10px 2px;border-top:1px solid var(--line)}
.w:first-child{border-top:0}
.w .e{font-weight:700;font-size:16px}
.w .k{font-size:13px;color:var(--sub);flex:1}
.st{font-size:11px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--okBg);color:var(--ok);white-space:nowrap}

/* stages */
.stg{display:flex;gap:8px}
.stg div{flex:1;text-align:center;border-radius:12px;padding:10px 4px;background:var(--bg);border:1px solid var(--line)}
.stg b{display:block;font-size:20px}
.stg span{font-size:11px;color:var(--sub)}
.stg .g{background:var(--okBg);border-color:transparent}
.stg .g b{color:var(--ok)}

/* shelf */
.shelf{display:flex;flex-wrap:wrap;gap:7px}
.shelf span{font-size:13px;font-weight:600;background:var(--okBg);color:var(--ok);border-radius:10px;padding:6px 11px;opacity:0;transform:translateY(6px);animation:up .5s forwards}
.shelf .more{background:transparent;border:1px dashed var(--line);color:var(--sub)}
@keyframes up{to{opacity:1;transform:none}}

/* tiles */
.tk{display:flex;align-items:center;gap:12px;width:100%;text-align:left;font:inherit;color:var(--ink);background:var(--card);border:2px solid var(--pri);border-radius:16px;padding:18px 16px;margin:12px 0 0;cursor:pointer}
.tk .tt{flex:1}
.tk b{display:block;font-size:17px}
.tk small{color:var(--sub);font-size:12px}
.bd{width:6px;height:34px;border-radius:3px;flex:none}
.chip{font-size:12px;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--sub);border:1px solid var(--line);white-space:nowrap}
.chip.ok{background:var(--okBg);color:var(--ok);border-color:transparent}
</style>
</head>
<body>
<div class="top"><b>나의 오답노트</b><span class="tag">샘플 화면</span></div>

<section class="hero">
  <div class="lb">내가 틀려서 모은 단어</div>
  <div class="big"><span id="tot">0</span><small>개</small></div>
  <div class="cap">네 곳의 오답을 한곳에</div>
  <div class="mini">
    <div><b id="due">0</b><span>오늘 복습</span></div>
    <div><b id="grad">0</b><span>졸업</span></div>
  </div>
  <p class="srcT">모인 곳</p>
  <div class="bar" id="bar"></div>
  <div class="leg" id="leg"></div>
</section>

<section class="panel">
  <h3>복습 단계별 단어 수</h3>
  <div class="stg" id="stg"></div>
</section>

<button class="tk"><i class="bd" style="background:#2f7d5b"></i><div class="tt"><b>누적 단어 테스트</b><small>데일리보카 포함 · 1 · 3 · 7 · 15일 주기</small></div><span class="chip ok">15개</span></button>
<button class="tk"><i class="bd" style="background:#6b7a8f"></i><div class="tt"><b>금요일 말하기 대비</b><small>말하기 시험 단어 · 데일리보카 제외</small></div><span class="chip">104개</span></button>

<script>
var SRC=[['미니모고','#ffd166',46],['천일문','#8fd3b6',31],['더블보카','#9ec5ff',27],['데일리보카','#ffb3a7',24]];
var DUE=15,GRAD=41;
var STG=[['1일',22],['3일',28],['7일',24],['15일',13]];
var TOT=SRC.reduce(function(a,s){return a+s[2]},0);
function cnt(id,to,ms){var el=document.getElementById(id),t0=null;function f(t){if(!t0)t0=t;var p=Math.min((t-t0)/ms,1);el.textContent=Math.round(to*(1-Math.pow(1-p,3)));if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)}
cnt('tot',TOT,1100);cnt('due',DUE,800);cnt('grad',GRAD,900);
document.getElementById('bar').innerHTML=SRC.map(function(s){return '<i style="flex:'+s[2]+';background:'+s[1]+'"></i>'}).join('');
document.getElementById('leg').innerHTML=SRC.map(function(s){return '<span><em style="background:'+s[1]+'"></em>'+s[0]+' <b>'+s[2]+'</b></span>'}).join('');
document.getElementById('stg').innerHTML=STG.map(function(s){return '<div><b>'+s[1]+'</b><span>'+s[0]+' 단계</span></div>'}).join('')+'<div class="g"><b>'+GRAD+'</b><span>졸업</span></div>';
</script>
</body>
</html>
