<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 4 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"hk4-01-1","no":1,"ko":"홍차 먼저 vs. 우유 먼저\b","items":[{"n":1,"t":"tf","q":"People in the U.K. argue about whether the milk or the tea should be put in the cup first.","ko":"영국 사람들은 우유와 홍차 중 어느 것을 컵에 먼저 부어야 하는지 논쟁한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"In the U.K., people have been arguing about the best way to make tea.","영국에서, 사람들은 홍차를 만드는 최상의 방법에 대해 논쟁해왔다."],[3,"Which should be put in the cup first—the milk or the tea?","우유 또는 홍차 중 어떤 것이 컵에 먼저 부어져야 하는가?"]],"w":"2번에서 홍차를 만드는 최상의 방법에 대해 논쟁해 왔다고 하고, 3번에서 우유와 홍차 중 무엇을 컵에 먼저 부어야 하는지 묻고 있어요.","c":"T"},"h":"318ef642a5"},{"n":2,"t":"tf","q":"The rich poured the milk first because their teacups were weak.","ko":"부유한 사람들은 찻잔이 약했기 때문에 우유를 먼저 부었다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"On the other hand, the rich preferred Tea in First (TIF).","반면에, 부유한 사람들은 ‘홍차 먼저(TIF)’를 선호했다."],[10,"They could afford expensive teacups that didn’t break easily, so they poured the tea in first.","그들은 쉽게 부서지지 않는 비싼 찻잔을 살 여유가 있어서, 홍차를 먼저 부었다."]],"w":"부유한 사람들은 쉽게 부서지지 않는 비싼 찻잔을 살 수 있었고(10번), 홍차를 먼저 부었어요(9~10번). 우유를 먼저 부은 사람들은 연약한 찻잔을 쓰던 사람들이에요.","c":"F"},"h":"0e80814a16"},{"n":3,"t":"tf","q":"Hot tea made many teacups crack because of a sudden change in temperature.","ko":"뜨거운 홍차는 갑작스러운 온도 변화 때문에 많은 찻잔에 금이 가게 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When the boiling hot tea was poured into them, they cracked due to the sudden change in temperature.","끓듯이 뜨거운 홍차가 찻잔 안에 부어졌을 때, 그것들은 갑작스러운 온도 변화 때문에 금이 갔다."]],"w":"6번에서 끓듯이 뜨거운 홍차를 붓자 갑작스러운 온도 변화 때문에 찻잔이 금이 갔다(they cracked due to the sudden change in temperature)고 해요.","c":"T"},"h":"9e59ccb546"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In the 1700s, ..., most teacups were delicate.)","ko":"1700년대에, ..., 대부분의 찻잔은 ( ).","opts":["연약했다","거대했다","비쌌다","따뜻했다"],"word":"delicate","r":{"a":"1) 연약했다","ev":"5~6번 문장","s":[[5,"In the 1700s, when tea first became popular in the U.K., most teacups were delicate.","1700년대에, 홍차가 처음으로 영국에서 인기를 얻었을 때, 대부분의 찻잔은 연약했다."],[6,"When the boiling hot tea was poured into them, they cracked due to the sudden change in temperature.","끓듯이 뜨거운 홍차가 찻잔 안에 부어졌을 때, 그것들은 갑작스러운 온도 변화 때문에 금이 갔다."]],"w":"뜨거운 홍차를 부으면 금이 갔다고 하니(6번) 찻잔이 연약했다는 뜻이에요. delicate = 연약한, 깨지기 쉬운.","c":1},"h":"5b9072a162"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (On the other hand, the rich preferred Tea in First (TIF).)","ko":"반면에, 부유한 사람들은 ‘홍차 먼저(TIF)’를 ( ).","opts":["두려워했다","선호했다","거부했다","만들었다"],"word":"preferred","r":{"a":"2) 선호했다","ev":"9~10번 문장","s":[[9,"On the other hand, the rich preferred Tea in First (TIF).","반면에, 부유한 사람들은 ‘홍차 먼저(TIF)’를 선호했다."],[10,"They could afford expensive teacups that didn’t break easily, so they poured the tea in first.","그들은 쉽게 부서지지 않는 비싼 찻잔을 살 여유가 있어서, 홍차를 먼저 부었다."]],"w":"부유한 사람들은 홍차를 먼저 부었고(10번), 그 방법을 선호했다는 흐름이에요. prefer = 선호하다.","c":2},"h":"e01bf87330"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is why the Milk in First (MIF) method became common.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 ‘우유 먼저(MIF)’ 방법이 흔해졌던 이유이다.","opts":["홍차가 영국에서 처음 인기를 얻은 것","많은 사람들이 더 차가운 우유를 먼저 붓기 시작한 것","부유한 사람들이 비싼 찻잔을 산 것","홍차와 우유의 맛이 서로 다른 것"],"r":{"a":"2) 많은 사람들이 더 차가운 우유를 먼저 붓기 시작한 것","ev":"7~8번 문장","s":[[7,"Therefore, many people began to pour the cooler milk in first.","따라서, 많은 사람들이 더 차가운 우유를 먼저 붓기 시작했다."],[8,"This is why the Milk in First (MIF) method became common.","이것이 ‘우유 먼저(MIF)’ 방법이 흔해졌던 이유이다."]],"w":"8번의 This는 바로 앞 7번 내용이에요. 많은 사람들이 더 차가운 우유를 먼저 붓기 시작했고, 그래서 MIF 방법이 흔해졌어요.","c":2},"h":"5ca44971f7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Three hundred years later, the debate over MIF versus TIF is still going on!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"삼백 년 후에도, MIF 대 TIF에 대한 논쟁은 여전히 계속되고 있는 중이다!","opts":["삼백 년이 지나서 MIF가 TIF를 이겼다.","삼백 년이 지난 지금도 MIF와 TIF에 대한 논쟁이 계속되고 있다.","삼백 년 전에 MIF와 TIF 논쟁이 끝났다.","삼백 년 뒤에는 TIF가 완전히 사라질 것이다."],"r":{"a":"2) 삼백 년이 지난 지금도 MIF와 TIF에 대한 논쟁이 계속되고 있다.","ev":"12번 문장","s":[[12,"Three hundred years later, the debate over MIF versus TIF is still going on!","삼백 년 후에도, MIF 대 TIF에 대한 논쟁은 여전히 계속되고 있는 중이다!"]],"w":"still going on은 '여전히 계속되고 있다'는 뜻이에요. 논쟁이 끝났다거나 한쪽이 이겼다는 말은 없어요.","c":2},"h":"5c5f348095"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["영국에서 홍차는 1500년대에 처음 인기를 얻었다.","부유한 사람들은 홍차를 먼저 붓고 우유를 넣기 전에 홍차의 색, 향, 맛을 즐길 수 있었다.","영국 사람들은 모두 홍차를 컵에 먼저 붓는 데 동의했다.","부유한 사람들은 약한 찻잔 때문에 우유를 먼저 부었다."],"opts":["Tea first became popular in the U.K. in the 1500s.","The rich poured the tea first and could enjoy its color, smell, and taste before adding the milk.","Everyone in the U.K. agreed to put the tea in the cup first.","The rich poured the milk first because of their weak teacups."],"r":{"a":"2) The rich poured the tea first and could enjoy its color, smell, and taste before adding the milk.","ev":"10~11번 문장","s":[[10,"They could afford expensive teacups that didn’t break easily, so they poured the tea in first.","그들은 쉽게 부서지지 않는 비싼 찻잔을 살 여유가 있어서, 홍차를 먼저 부었다."],[11,"This way, they could enjoy the color, smell, and taste of the tea before adding the milk.","이 방법으로, 그들은 우유를 더하기 전에 홍차의 색, 향, 그리고 맛을 즐길 수 있었다."]],"w":"10~11번에서 부자들은 홍차를 먼저 부었고 우유를 더하기 전에 홍차의 색·향·맛을 즐겼어요. 영국에서 홍차는 1700년대에 인기를 얻었고(5번), 사람들은 아직 논쟁 중이에요(12번).","c":2},"h":"6545467aec"},{"n":9,"t":"sum","q":"In the 1700s, most teacups were (A), so many people poured the (B) milk in first.","ko":"1700년대에, 대부분의 찻잔은 (A)해서, 많은 사람들이 더 (B) 우유를 먼저 부었다.","oko":["(A) 연약해서 / (B) 뜨거운","(A) 튼튼해서 / (B) 차가운","(A) 연약해서 / (B) 차가운","(A) 화려해서 / (B) 달콤한","(A) 튼튼해서 / (B) 뜨거운"],"opts":["(A) delicate / (B) hotter","(A) strong / (B) cooler","(A) delicate / (B) cooler","(A) colorful / (B) sweeter","(A) strong / (B) hotter"],"r":{"a":"3) (A) delicate / (B) cooler","ev":"5~7번 문장","s":[[5,"In the 1700s, when tea first became popular in the U.K., most teacups were delicate.","1700년대에, 홍차가 처음으로 영국에서 인기를 얻었을 때, 대부분의 찻잔은 연약했다."],[6,"When the boiling hot tea was poured into them, they cracked due to the sudden change in temperature.","끓듯이 뜨거운 홍차가 찻잔 안에 부어졌을 때, 그것들은 갑작스러운 온도 변화 때문에 금이 갔다."],[7,"Therefore, many people began to pour the cooler milk in first.","따라서, 많은 사람들이 더 차가운 우유를 먼저 붓기 시작했다."]],"w":"5번에서 찻잔이 연약했고(delicate), 6번에서 뜨거운 홍차에 금이 가서, 7번에서 더 차가운(cooler) 우유를 먼저 부었어요.","c":3},"h":"48935a2494"},{"n":10,"t":"fill","q":"The rich could [A] expensive teacups that did not break easily, so they poured the [B] in first.","ko":"부유한 사람들은 쉽게 부서지지 않는 비싼 찻잔을 [A] 수 있었고, 그래서 [B]를 먼저 부었다.","bank":["afford","tea","delicate","popular","sudden","cracked"],"bko":{"afford":"살 여유가 되다","tea":"홍차","delicate":"연약한","popular":"인기 있는","sudden":"갑작스러운","cracked":"금이 갔다"},"r":{"a":"[A] afford, [B] tea","ev":"10번 문장","s":[[10,"They could afford expensive teacups that didn’t break easily, so they poured the tea in first.","그들은 쉽게 부서지지 않는 비싼 찻잔을 살 여유가 있어서, 홍차를 먼저 부었다."]],"w":"10번에서 They could afford expensive teacups, so they poured the tea in first라고 했어요. delicate·popular·sudden은 형용사, cracked는 과거형이라 [A]·[B] 자리에 맞지 않아요.","c":null},"h":"63b3fe4a31"}]},{"u":1,"id":"hk4-01-2","no":2,"ko":"내 집중력을 들었다 놨다\b","items":[{"n":1,"t":"tf","q":"After drinking an energy drink, Alex could focus better at first.","ko":"에너지 음료를 마신 뒤, Alex는 처음에는 더 잘 집중할 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He immediately felt more awake and could focus better.","그는 즉시 더 깨어 있는 기분을 느꼈고 더 잘 집중할 수 있었다."]],"w":"3번에서 그는 즉시 더 깨어 있는 기분을 느꼈고 더 잘 집중할 수 있었다고 해요.","c":"T"},"h":"2ad0f5c3f1"},{"n":2,"t":"tf","q":"Energy drinks contain no sugar or caffeine.","ko":"에너지 음료에는 설탕이나 카페인이 들어 있지 않다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Energy drinks commonly contain lots of caffeine and sugar.","에너지 음료에는 보통 많은 양의 카페인과 설탕이 들어 있다."]],"w":"7번에서 에너지 음료에는 보통 많은 양의 카페인과 설탕이 들어 있다고 해요. 들어 있지 않다는 말은 반대예요.","c":"F"},"h":"df24375bde"},{"n":3,"t":"tf","q":"A sugar crash happens when blood sugar level and energy go down rapidly.","ko":"슈거 크래시는 혈당 수치와 에너지가 급속히 낮아질 때 일어난다.","r":{"a":"T (본문과 맞는 내용)","ev":"12~13번 문장","s":[[12,"As a result, the increased blood sugar level starts to go down rapidly, and so does your energy.","결과적으로, 증가된 혈당 수치는 급속히 낮아지기 시작하고, 당신의 에너지도 그렇다."],[13,"This is a phenomenon known as a sugar crash.","이것이 슈거 크래시라고 알려진 현상이다."]],"w":"12번에서 혈당 수치와 에너지가 급속히 낮아진다고 하고, 13번에서 이것이 슈거 크래시라고 알려진 현상이라고 해요.","c":"T"},"h":"0dd8b47e7a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He immediately felt more awake and could focus better.)","ko":"그는 ( ) 더 깨어 있는 기분을 느꼈고 더 잘 집중할 수 있었다.","opts":["천천히","즉시","가끔","마침내"],"word":"immediately","r":{"a":"2) 즉시","ev":"2~3번 문장","s":[[2,"He couldn’t keep his eyes open, so he had an energy drink.","그는 눈을 계속 뜨고 있을 수 없어서, 에너지 음료를 마셨다."],[3,"He immediately felt more awake and could focus better.","그는 즉시 더 깨어 있는 기분을 느꼈고 더 잘 집중할 수 있었다."]],"w":"에너지 음료를 마신 바로 그 순간 느낀 변화예요. immediately = 즉시, 바로.","c":2},"h":"98d71c3651"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (..., your body produces insulin to maintain a steady blood sugar level.)","ko":"..., 당신의 몸은 일정한 혈당 수치를 ( ) 위해 인슐린을 분비한다.","opts":["낮추기","유지하기","잃기","높이기"],"word":"maintain","r":{"a":"2) 유지하기","ev":"11번 문장","s":[[11,"In addition, when you take in a lot of sugar, your body produces insulin to maintain a steady blood sugar level.","게다가, 많은 양의 설탕을 섭취하면, 당신의 몸은 일정한 혈당 수치를 유지하기 위해 인슐린을 분비한다."]],"w":"인슐린은 혈당 수치를 일정하게 지키려고 나와요. maintain = 유지하다.","c":2},"h":"90791dbc03"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is a phenomenon known as a sugar crash.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 슈거 크래시라고 알려진 현상이다.","opts":["카페인이 몸에 완전히 흡수되는 것","설탕과 카페인이 심박수를 높이는 것","혈당 수치가 급속히 낮아지고 에너지도 떨어지는 것","Alex가 에너지 음료를 마신 것"],"r":{"a":"3) 혈당 수치가 급속히 낮아지고 에너지도 떨어지는 것","ev":"12~13번 문장","s":[[12,"As a result, the increased blood sugar level starts to go down rapidly, and so does your energy.","결과적으로, 증가된 혈당 수치는 급속히 낮아지기 시작하고, 당신의 에너지도 그렇다."],[13,"This is a phenomenon known as a sugar crash.","이것이 슈거 크래시라고 알려진 현상이다."]],"w":"13번의 This는 바로 앞 12번 내용이에요. 혈당 수치가 급속히 낮아지고 에너지도 떨어지는 일을 슈거 크래시라고 불러요.","c":3},"h":"09d926dd61"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Thus, energy drinks are only useful if you need to concentrate for a brief period.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서, 에너지 음료는 짧은 기간 동안 집중해야 할 경우에만 유용하다.","opts":["에너지 음료는 오랫동안 집중해야 할 때 가장 유용하다.","에너지 음료는 짧은 시간만 집중하면 될 때에만 쓸모가 있다.","에너지 음료는 집중력에 전혀 도움이 되지 않는다.","에너지 음료는 짧은 시간 동안 마셔야 한다."],"r":{"a":"2) 에너지 음료는 짧은 시간만 집중하면 될 때에만 쓸모가 있다.","ev":"14번 문장","s":[[14,"Thus, energy drinks are only useful if you need to concentrate for a brief period.","따라서, 에너지 음료는 짧은 기간 동안 집중해야 할 경우에만 유용하다."]],"w":"only useful if ~ brief period는 '짧은 기간 집중할 때만 유용하다'는 뜻이에요. 효과가 길게 가지 않기 때문이에요.","c":2},"h":"bb79e14d23"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["카페인의 효과는 약 45분 뒤에 사라지기 시작한다.","에너지 음료를 마신 Alex는 밤새 깨어 있었다.","몸은 심박수를 높이기 위해 인슐린을 분비한다.","에너지 음료는 심박수와 혈압을 낮춘다."],"opts":["The effect of caffeine starts to go away after about 45 minutes.","Alex stayed awake all night after the energy drink.","Your body produces insulin to raise your heart rate.","Energy drinks lower your heart rate and blood pressure."],"r":{"a":"1) The effect of caffeine starts to go away after about 45 minutes.","ev":"10번 문장","s":[[10,"But after about 45 minutes, the effect starts to go away as the caffeine is completely absorbed in your body.","그러나 약 45분 후에, 카페인이 몸에 완전히 흡수됨에 따라 그 효과는 사라지기 시작한다."]],"w":"10번에서 약 45분 뒤 카페인이 완전히 흡수되면서 효과가 사라지기 시작한다고 해요. Alex는 잠이 들었고(5번), 인슐린은 혈당 수치를 일정하게 유지하려고 나오며(11번), 에너지 음료는 심박수와 혈압을 높여요(8번).","c":1},"h":"b13d762a8f"},{"n":9,"t":"sum","q":"An energy drink helps you concentrate, but after about 45 minutes its effect (A), and your blood sugar level and energy (B).","ko":"에너지 음료는 집중을 돕지만, 약 45분 후 그 효과는 (A), 혈당 수치와 에너지는 (B).","oko":["(A) 사라지고 / (B) 내려간다","(A) 더 강해지고 / (B) 올라간다","(A) 사라지고 / (B) 올라간다","(A) 더 강해지고 / (B) 내려간다","(A) 계속되고 / (B) 그대로이다"],"opts":["(A) goes away / (B) go down","(A) gets stronger / (B) go up","(A) goes away / (B) go up","(A) gets stronger / (B) go down","(A) lasts / (B) stay the same"],"r":{"a":"1) (A) goes away / (B) go down","ev":"10번, 12번 문장","s":[[10,"But after about 45 minutes, the effect starts to go away as the caffeine is completely absorbed in your body.","그러나 약 45분 후에, 카페인이 몸에 완전히 흡수됨에 따라 그 효과는 사라지기 시작한다."],[12,"As a result, the increased blood sugar level starts to go down rapidly, and so does your energy.","결과적으로, 증가된 혈당 수치는 급속히 낮아지기 시작하고, 당신의 에너지도 그렇다."]],"w":"10번에서 약 45분 뒤 효과가 사라지기 시작하고(go away), 12번에서 혈당 수치와 에너지가 급속히 낮아져요(go down).","c":1},"h":"85078a923d"},{"n":10,"t":"fill","q":"The sugar and caffeine in energy drinks quickly [A] your heart rate, and this helps you [B] better.","ko":"에너지 음료의 설탕과 카페인은 심박수를 빠르게 [A], 이것은 당신이 더 잘 [B] 하도록 돕는다.","bank":["raise","concentrate","absorbed","brief","rapidly","immediately"],"bko":{"raise":"높이다","concentrate":"집중하다","absorbed":"흡수된","brief":"짧은","rapidly":"급속히","immediately":"즉시"},"r":{"a":"[A] raise, [B] concentrate","ev":"8~9번 문장","s":[[8,"When you drink them, the sugar and caffeine quickly raise your heart rate, blood pressure, and energy level.","그것을 마시면, 설탕과 카페인은 빠르게 당신의 심박수, 혈압, 그리고 에너지 수치를 높인다."],[9,"This helps you concentrate better.","이것은 당신이 더 잘 집중하도록 돕는다."]],"w":"8번에서 설탕과 카페인이 심박수를 빠르게 높이고(raise), 9번에서 이것이 더 잘 집중하도록(concentrate) 돕는다고 해요. absorbed는 과거분사, brief는 형용사, rapidly·immediately는 부사라서 동사 자리에 맞지 않아요.","c":null},"h":"5dc6ef2c56"}]},{"u":1,"id":"hk4-01-3","no":3,"ko":"하늘 아래 또 하늘이?! \b","items":[{"n":1,"t":"tf","q":"Salar de Uyuni was formed after lakes that had been there dried up.","ko":"우유니 소금사막은 그곳에 있었던 호수가 말라붙은 후에 형성되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It was formed after lakes that once had been there dried up thousands of years ago.","그것은 한때 그곳에 있었던 호수가 수천 년 전에 말라붙은 후에 형성되었다."]],"w":"2번에서 한때 그곳에 있었던 호수가 수천 년 전에 말라붙은 후에 형성되었다고 해요.","c":"T"},"h":"bccfdb04da"},{"n":2,"t":"tf","q":"Salar de Uyuni is popular only for travelers.","ko":"우유니 소금사막은 오직 관광객들에게만 인기 있다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Salar de Uyuni is a popular place not only for travelers but also for thousands of flamingos.","우유니 소금사막은 관광객들뿐 아니라 수천 마리의 홍학들에게도 인기 있는 장소이다."]],"w":"11번에서 not only for travelers but also for thousands of flamingos라고 해요. 관광객뿐 아니라 수천 마리의 홍학에게도 인기 있어요.","c":"F"},"h":"7c3a0cc091"},{"n":3,"t":"tf","q":"Salar de Uyuni offers a unique experience whenever you visit.","ko":"우유니 소금사막은 당신이 언제 방문하더라도 독특한 경험을 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Salar de Uyuni offers a unique experience no matter when you visit.","우유니 소금사막은 당신이 언제 방문하더라도 독특한 경험을 제공한다."]],"w":"3번의 no matter when you visit는 '언제 방문하더라도'라는 뜻이에요. 우기든 건기든 독특한 경험을 준다는 내용과 일치해요.","c":"T"},"h":"90971e9356"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Salar de Uyuni offers a unique experience no matter when you visit.)","ko":"우유니 소금사막은 당신이 언제 방문하더라도 ( ) 경험을 제공한다.","opts":["평범한","독특한","위험한","값비싼"],"word":"unique","r":{"a":"2) 독특한","ev":"3~4번 문장","s":[[3,"Salar de Uyuni offers a unique experience no matter when you visit.","우유니 소금사막은 당신이 언제 방문하더라도 독특한 경험을 제공한다."],[4,"During the rainy season, the desert becomes the world’s biggest natural mirror.","우기 동안에, 그 사막은 세계의 가장 큰 천연 거울이 된다."]],"w":"3번에서 언제 가도 '독특한' 경험을 준다고 하고, 4번에서 우기에는 세계에서 가장 큰 천연 거울이 된다고 해요. 다른 곳에 없는 특별한 경험이라는 뜻이에요. unique = 독특한.","c":2},"h":"05b076034c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is hard to tell where the land stops and where the sky starts.)","ko":"땅이 어디에서 끝나고 하늘이 어디에서 시작하는지 ( ) 어렵다.","opts":["구별하기","말하기","믿기","찾아가기"],"word":"tell","r":{"a":"1) 구별하기","ev":"5~6번 문장","s":[[5,"The entire surface is covered with a layer of rainwater, and it reflects the sky perfectly.","전체 표면이 빗물 층으로 덮이고, 그것은 하늘을 완벽하게 비춘다."],[6,"It is hard to tell where the land stops and where the sky starts.","땅이 어디에서 끝나는지 그리고 하늘이 어디에서 시작하는지 구별하기가 어렵다."]],"w":"하늘이 빗물에 완벽하게 비쳐서(5번) 땅과 하늘의 경계를 가려내기 어렵다는 뜻이에요. 여기서 tell은 '말하다'가 아니라 '구별하다'예요.","c":1},"h":"de6a0da455"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes you feel as if you’re walking in the clouds!","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 당신이 마치 구름 속을 걷고 있는 것처럼 느끼게 만든다!","opts":["땅과 하늘이 어디서 나뉘는지 구별하기 어려운 것","소금이 육각형 무늬로 남는 것","우유니 소금사막이 볼리비아에 있는 것","호수가 수천 년 전에 말라붙은 것"],"r":{"a":"1) 땅과 하늘이 어디서 나뉘는지 구별하기 어려운 것","ev":"6~7번 문장","s":[[6,"It is hard to tell where the land stops and where the sky starts.","땅이 어디에서 끝나는지 그리고 하늘이 어디에서 시작하는지 구별하기가 어렵다."],[7,"This makes you feel as if you’re walking in the clouds!","이것은 당신이 마치 구름 속을 걷고 있는 것처럼 느끼게 만든다!"]],"w":"7번의 This는 바로 앞 6번 내용이에요. 땅과 하늘의 경계를 구별하기 어려워서 구름 속을 걷는 것처럼 느껴져요.","c":1},"h":"99d1e18fb2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you’re lucky enough, you may see them walking gracefully around the desert!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 당신이 충분히 운이 좋다면, 아마 그것들이 사막 주위를 우아하게 걷고 있는 것을 볼 수도 있다!","opts":["운이 나쁘면 홍학들이 사막을 떠난다.","홍학들은 언제나 사막 주위를 걷고 있다.","운이 충분히 좋으면 홍학들이 사막 주위를 우아하게 걷는 모습을 볼 수도 있다.","당신은 홍학들을 따라 사막 주위를 걸어야 한다."],"r":{"a":"3) 운이 충분히 좋으면 홍학들이 사막 주위를 우아하게 걷는 모습을 볼 수도 있다.","ev":"11~12번 문장","s":[[11,"Salar de Uyuni is a popular place not only for travelers but also for thousands of flamingos.","우유니 소금사막은 관광객들뿐 아니라 수천 마리의 홍학들에게도 인기 있는 장소이다."],[12,"If you’re lucky enough, you may see them walking gracefully around the desert!","만약 당신이 충분히 운이 좋다면, 아마 그것들이 사막 주위를 우아하게 걷고 있는 것을 볼 수도 있다!"]],"w":"lucky enough는 '충분히 운이 좋은', may는 '~할 수도 있다'예요. 언제나 볼 수 있다는 뜻도, 홍학이 떠난다는 뜻도 아니에요.","c":3},"h":"ab68e21c92"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우유니 소금사막은 아프리카에서 가장 큰 소금사막이다.","건기에는 소금이 육각형 무늬로 남는다.","우기에는 아무도 우유니 소금사막을 방문할 수 없다.","건기에 사막은 세계에서 가장 큰 천연 거울이 된다."],"opts":["Salar de Uyuni is the largest salt desert in Africa.","In the dry season, salt is left in a hexagon pattern.","No one can visit Salar de Uyuni in the rainy season.","In the dry season, the desert becomes the world’s biggest natural mirror."],"r":{"a":"2) In the dry season, salt is left in a hexagon pattern.","ev":"9~10번 문장","s":[[9,"As the rainwater dries up, it leaves behind salt in an interesting hexagon pattern.","빗물이 마르면서, 그것은 소금을 흥미로운 육각형 무늬로 남겨 둔다."],[10,"The desert looks like a giant white honeycomb.","그 사막은 거대한 흰 벌집처럼 보인다."]],"w":"9번에서 빗물이 마르면 소금이 육각형 무늬로 남는다고 해요. 가장 큰 소금사막은 볼리비아에 있고(1번), 언제 방문해도 독특한 경험을 하며(3번), 거울이 되는 때는 우기예요(4번).","c":2},"h":"b4750a4401"},{"n":9,"t":"sum","q":"When it rains, it is hard to tell where the land stops and where the (A) starts. In the dry season, the leftover salt forms a (B) pattern.","ko":"비가 오면 땅이 어디에서 끝나고 (A)이/가 어디에서 시작하는지 구별하기 어렵다. 건기에는 남은 소금이 (B) 무늬를 이룬다.","oko":["(A) 하늘 / (B) 육각형","(A) 하늘 / (B) 사각형","(A) 호수 / (B) 육각형","(A) 산 / (B) 둥근","(A) 호수 / (B) 사각형"],"opts":["(A) sky / (B) hexagon","(A) sky / (B) square","(A) lake / (B) hexagon","(A) mountain / (B) round","(A) lake / (B) square"],"r":{"a":"1) (A) sky / (B) hexagon","ev":"6번, 9번 문장","s":[[6,"It is hard to tell where the land stops and where the sky starts.","땅이 어디에서 끝나는지 그리고 하늘이 어디에서 시작하는지 구별하기가 어렵다."],[9,"As the rainwater dries up, it leaves behind salt in an interesting hexagon pattern.","빗물이 마르면서, 그것은 소금을 흥미로운 육각형 무늬로 남겨 둔다."]],"w":"6번에서 땅이 어디서 끝나고 하늘(sky)이 어디서 시작하는지 구별하기 어렵다고 하고, 9번에서 빗물이 마르면 소금이 육각형(hexagon) 무늬로 남는다고 해요.","c":1},"h":"e71804bc0d"},{"n":10,"t":"fill","q":"During the rainy season, the entire surface is [A] with a layer of rainwater, and it [B] the sky perfectly.","ko":"우기에는 전체 표면이 빗물 층으로 [A], 그것은 하늘을 완벽하게 [B].","bank":["covered","reflects","dried","located","tell","leaves"],"bko":{"covered":"덮인","reflects":"비춘다","dried":"말랐다","located":"위치한","tell":"구별하다","leaves":"남겨 둔다"},"r":{"a":"[A] covered, [B] reflects","ev":"5번 문장","s":[[5,"The entire surface is covered with a layer of rainwater, and it reflects the sky perfectly.","전체 표면이 빗물 층으로 덮이고, 그것은 하늘을 완벽하게 비춘다."]],"w":"5번에서 The entire surface is covered with a layer of rainwater, and it reflects the sky perfectly라고 했어요. dried(말랐다)는 우기에 빗물로 덮인다는 내용과 맞지 않고, located·tell·leaves는 [A], [B] 자리에 넣으면 뜻이 통하지 않아요.","c":null},"h":"74cc083ae4"}]},{"u":1,"id":"hk4-01-4","no":4,"ko":"미라를 두 번 죽이는 일\b","items":[{"n":1,"t":"tf","q":"In the 16th and 17th century, Europeans ate mummies to treat illnesses.","ko":"16~17세기에 유럽인들은 질병을 치료하려고 미라를 먹었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"In the 16th and 17th century, Europeans ate mummies as a treatment for various illnesses.","16세기와 17세기에, 유럽인들은 미라를 다양한 질병의 치료제로써 먹었다."]],"w":"4번에서 16~17세기 유럽인들이 미라를 다양한 질병의 치료제로써 먹었다고 해요.","c":"T"},"h":"480559ad3f"},{"n":2,"t":"tf","q":"Europeans believed that dead human bodies had no healing power.","ko":"유럽인들은 죽은 사람의 몸에 치유하는 힘이 없다고 믿었다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"They believed that dead human bodies possessed healing powers.","그들은 죽은 사람의 몸에 치유하는 힘이 있다고 믿었다."]],"w":"5번에서 유럽인들은 죽은 사람의 몸에 치유하는 힘(healing powers)이 있다고 믿었어요. 없다는 말은 반대예요.","c":"F"},"h":"3fdd49ad47"},{"n":3,"t":"tf","q":"Mummies were ground into powder and mixed with honey or chocolate.","ko":"미라는 가루로 갈아졌고 꿀이나 초콜릿과 섞였다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Mummies were ground into powder and mixed with honey or chocolate.","미라는 가루로 갈아졌고 꿀이나 초콜릿과 섞였다."]],"w":"9번 문장이 그대로 이 내용이에요. 갈아서 가루로 만든 뒤 꿀이나 초콜릿과 섞었어요.","c":"T"},"h":"79ef35ddc7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (..., Europeans ate mummies as a treatment for various illnesses.)","ko":"..., 유럽인들은 미라를 다양한 질병의 ( )로써 먹었다.","opts":["치료제","장난감","선물","음식 재료"],"word":"treatment","r":{"a":"1) 치료제","ev":"4~5번 문장","s":[[4,"In the 16th and 17th century, Europeans ate mummies as a treatment for various illnesses.","16세기와 17세기에, 유럽인들은 미라를 다양한 질병의 치료제로써 먹었다."],[5,"They believed that dead human bodies possessed healing powers.","그들은 죽은 사람의 몸에 치유하는 힘이 있다고 믿었다."]],"w":"죽은 몸에 치유하는 힘이 있다고 믿어서(5번) 질병에 먹었어요. treatment = 치료(제).","c":1},"h":"88fcbacfdb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They believed th part of the body.","The mummy remedy was proven effective in the 18th century.","Doctors in Egypt told patients to eat mummies."],"r":{"a":"2) Each part of a mummy was thought to cure the same part of the body.","ev":"6번 문장","s":[[6,"Specifically, each part of the mummy was thought to cure the same part of the body.","구체적으로, 미라의 각 부위는 몸의 같은 부위를 치료한다고 여겨졌다."]],"w":"6번에서 미라의 각 부위가 몸의 같은 부위를 치료한다고 여겨졌다고 해요. 유럽인들은 미라에 매료되었고(3번), 치료법은 효과가 없다고 밝혀졌으며(11번), 미라를 먹으라고 한 것은 유럽의 의사들이에요(4번, 10번).","c":2},"h":"e4c54869aa"},{"n":9,"t":"sum","q":"Europeans in the 16th and 17th century (A) mummies as medicine, but by the 18th century it became clear that this remedy was not (B).","ko":"16~17세기 유럽인들은 미라를 약으로 (A), 하지만 18세기 즈음 이 치료법이 (B) 않다는 것이 분명해졌다.","oko":["(A) 먹었고 / (B) 이상하지","(A) 먹었고 / (B) 효과적이지","(A) 지었고 / (B) 효과적이지","(A) 두려워했고 / (B) 무섭지","(A) 팔았고 / (B) 싸지"],"opts":["(A) ate / (B) strange","(A) ate / (B) effective","(A) built / (B) effective","(A) feared / (B) scary","(A) sold / (B) cheap"],"r":{"a":"2) (A) ate / (B) effective","ev":"4번, 11번 문장","s":[[4,"In the 16th and 17th century, Europeans ate mummies as a treatment for various illnesses.","16세기와 17세기에, 유럽인들은 미라를 다양한 질병의 치료제로써 먹었다."],[11,"However, by the 18th century, it became clear that this strange remedy was not actually effective.","하지만, 18세기 즈음, 이 이상한 치료법이 사실은 효과적이지 않다는 것이 분명해졌다."]],"w":"4번에서 유럽인들은 미라를 약으로 먹었고(ate), 11번에서 이 치료법이 사실은 효과적이지(effective) 않다는 것이 분명해졌어요.","c":2},"h":"6785d533d5"},{"n":10,"t":"fill","q":"Each part of the mummy was [A] to cure the same [B] of the body.","ko":"미라의 각 부위는 몸의 같은 [B]을(를) 치료한다고 [A].","bank":["thought","part","powder","honey","headache","mixture"],"bko":{"thought":"여겨진","part":"부위","powder":"가루","honey":"꿀","headache":"두통","mixture":"혼합물"},"r":{"a":"[A] thought, [B] part","ev":"6번 문장","s":[[6,"Specifically, each part of the mummy was thought to cure the same part of the body.","구체적으로, 미라의 각 부위는 몸의 같은 부위를 치료한다고 여겨졌다."]],"w":"6번에서 each part of the mummy was thought to cure the same part  한다.","opts":["조금","가끔","몹시","거의"],"word":"extremely","r":{"a":"3) 몹시","ev":"9번 문장","s":[[9,"First of all, it has to be extremely cold—below -16°C—with high humidity under clear skies.","우선, 맑은 하늘 아래 높은 습도와 함께 영하 16도 이하로 몹시 추워야 한다."]],"w":"영하 16도 이하라는 말이 바로 뒤에 나오니 ‘조금’이 아니라 ‘몹시’ 추워야 해요. extremely = 몹시, 매우.","c":3},"h":"a34a5049af"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSo, they float in the air rather than fall to the ground.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그래서, 그것들은 땅에 떨어지기보다는 공중에 뜬다.","opts":["눈송이들","얼음 결정들","구름들","수증기들"],"r":{"a":"2) 얼음 결정들","ev":"5~6번 문장","s":[[5,"These crystals resemble snowflakes when you look closely at them, but they are much smaller and lighter.","이 결정들은 자세히 보면 눈송이를 닮았지만, 훨씬 더 작고 가볍다."],[6,"So, they float in the air rather than fall to the ground.","그래서, 그것들은 땅에 떨어지기보다는 공중에 뜬다."]],"w":"5번에서 결정들이 눈송이보다 훨씬 작고 가볍다고 했고, 6번의 they는 그 얼음 결정들이에요. 눈송이는 비교 대상일 뿐이에요.","c":2},"h":"fc896015e3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Only a few places in the world have the necessary conditions for diamond dust to form.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"세계에서 오직 몇몇 장소들만이 다이아몬드 더스트가 형성될 필수 조건들을 갖고 있다.","opts":["세계 곳곳에서 다이아몬드 더스트를 쉽게 볼 수 있다.","세계에서 다이아몬드 더스트가 생길 조건을 갖춘 곳은 몇 군데뿐이다.","다이아몬드 더스트는 몇몇 장소에서만 사라진다.","다이아몬드 더스트가 몇몇 장소를 새로 만든다."],"r":{"a":"2) 세계에서 다이아몬드 더스트가 생길 조건을 갖춘 곳은 몇 군데뿐이다.","ev":"8번 문장","s":[[8,"Only a few places in the world have the necessary conditions for diamond dust to form.","세계에서 오직 몇몇 장소들만이 다이아몬드 더스트가 형성될 필수 조건들을 갖고 있다."]],"w":"Only a few places는 '오직 몇몇 장소'예요. 형성될 조건(necessary conditions)을 갖춘 곳이 드물다는 뜻이에요.","c":2},"h":"a5e9d33ee3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["다이아몬드 더스트는 기온이 영상 16도일 때 생긴다.","다이아몬드 더스트 결정은 눈송이처럼 땅에 떨어진다.","다이아몬드 더스트를 보는 것은 항상 쉽다.","바람이 없어야 수증기가 날아가지 않는다."],"opts":["Diamond dust forms when the temperature is above 16°C.","Diamond dust crystals fall to the ground like snowflakes.","It is always easy to see diamond dust.","There should be no wind, or the water vapor will be blown away."],"r":{"a":"4) There should be no wind, or the water vapor will be blown away.","ev":"10번 문장","s":[[10,"Also, there should be no wind, otherwise, the water vapor will be blown away.","또한, 바람이 없어야 하는데, 그렇지 않으면, 수증기가 날아갈 것이다."]],"w":"10번에서 바람이 없어야 하고, 그렇지 않으면 수증기가 날아간다고 해요. 기온은 영하 16도 이하(9번), 결정은 공중에 뜨고(6번), 항상 쉬운 것은 아니에요(7번).","c":4},"h":"cef1c3db02"},{"n":9,"t":"sum","q":"Diamond dust is a (A) made of tiny ice crystals that reflect sunlight, but it is not (B) to see.","ko":"다이아몬드 더스트는 햇빛을 반사하는 미세한 얼음 결정으로 이루어진 (A)이지만, 보기 (B) 않다.","oko":["(A) 구름 / (B) 쉽지","(A) 구름 / (B) 어렵지","(A) 비 / (B) 쉽지","(A) 눈 / (B) 어렵지","(A) 바람 / (B) 쉽지"],"opts":["(A) cloud / (B) easy","(A) cloud / (B) hard","(A) rain / (B) easy","(A) snow / (B) hard","(A) wind / (B) easy"],"r":{"a":"1) (A) cloud / (B) easy","ev":"2~4번, 7번 문장","s":[[2,"It’s called diamond dust, but it’s actually a cloud!","그것은 다이아몬드 더스트라고 불리지만, 사실 구름이다!"],[3,"Diamond dust forms near the ground when moisture in the air freezes.","다이아몬드 더스트는 대기 중의 수증기가 얼 때 지면 근처에서 형성된다."],[4,"It consists of millions of tiny ice crystals that reflect sunlight like sparkling diamonds.","그것은 반짝거리는 다이아몬드처럼 햇빛을 반사하는 수백만 개의 미세한 얼음 결정들로 이루어진다."],[7,"Unfortunately, it is not always easy to see diamond dust.","불행히도, 다이아몬드 더스트를 보는 것이 항상 쉬운 것은 아니다."]],"w":"2번에서 사실은 구름(cloud)이고, 4번에서 햇빛을 반사하는 얼음 결정으로 이루어졌다고 해요. 7번에서 보는 것이 항상 쉬운(easy) 것은 아니라고 해요.","c":1},"h":"3f3963a54a"},{"n":10,"t":"fill","q":"Diamond dust needs extremely [A] weather with no [B], or the water vapor will be blown away.","ko":"다이아몬드 더스트는 몹시 [A] 날씨와 [B]이(가) 없는 조건이 필요하고, 그렇지 않으면 수증기가 날아간다.","bank":["cold","wind","float","reflect","resemble","consist"],"bko":{"cold":"추운","wind":"바람","float":"뜨다","reflect":"반사하다","resemble":"닮다","consist":"이루어지다"},"r":{"a":"[A] cold, [B] wind","ev":"9~10번 문장","s":[[9,"First of all, it has to be extremely cold—below -16°C—with high humidity under clear skies.","우선, 맑은 하늘 아래 높은 습도와 함께 영하 16도 이하로 몹시 추워야 한다."],[10,"Also, there should be no wind, otherwise, the water vapor will be blown away.","또한, 바람이 없어야 하는데, 그렇지 않으면, 수증기가 날아갈 것이다."]],"w":"9번에서 몹시 추워야(extremely cold) 하고, 10번에서 바람이 없어야(no wind) 수증기가 날아가지 않는다고 해요. float·reflect·resemble·consist는 동사라서 [A]·[B] 자리에 맞지 않아요.","c":null},"h":"258b112515"}]},{"u":2,"id":"hk4-02-2","no":2,"ko":"걸을 수 없다면 뛰겠어!\b","items":[{"n":1,"t":"tf","q":"Wilma Rudolph’s left leg became paralyzed when she was five.","ko":"윌마 루돌프의 왼쪽 다리는 그녀가 다섯 살 때 마비되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"At age five, her left leg became paralyzed due to polio.","5살 때, 그녀의 왼쪽 다리가 소아마비 때문에 마비되었다."]],"w":"7번에서 5살 때 소아마비 때문에 왼쪽 다리가 마비되었다고 해요.","c":"T"},"h":"f3f895d256"},{"n":2,"t":"tf","q":"Wilma won a gold medal at her first Olympics.","ko":"윌마는 첫 올림픽에서 금메달을 땄다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"In 1956, she went to her first Olympics and won a bronze medal.","1956년에, 그녀는 첫 올림픽에 나가서 동메달을 땄다."]],"w":"13번에서 1956년 첫 올림픽에서 딴 것은 동메달(bronze medal)이에요. 금메달 3개는 4년 뒤 올림픽(14번)에서 땄어요.","c":"F"},"h":"0175f258c8"},{"n":3,"t":"tf","q":"Wilma wore a heavy brace to strengthen her leg muscles.","ko":"윌마는 다리 근육을 강화하기 위해 무거운 보조기를 착용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"To strengthen her leg muscles, she began wearing a heavy brace on her leg.","다리 근육을 강화하기 위해, 그녀는 다리에 무거운 보조기를 착용하기 시작했다."]],"w":"9번에서 To strengthen her leg muscles, she began wearing a heavy brace on her leg라고 해요.","c":"T"},"h":"26a8a00789"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (At age five, her left leg became paralyzed due to polio.)","ko":"5살 때, 그녀의 왼쪽 다리가 소아마비 때문에 ( ).","opts":["마비되었다","길어졌다","강해졌다","나았다"],"word":"paralyzed","r":{"a":"1) 마비되었다","ev":"7~8번 문장","s":[[7,"At age five, her left leg became paralyzed due to polio.","5살 때, 그녀의 왼쪽 다리가 소아마비 때문에 마비되었다."],[8,"Despite this, Wilma refused to give up.","이런데도 불구하고, 윌마는 포기하기를 거부했다."]],"w":"다리가 소아마비 때문에 움직일 수 없게 되었다는 뜻이에요. 그런데도 포기하지 않았다(8번)는 흐름이라 좋은 일이 아니에요. paralyze = 마비시키다.","c":1},"h":"dab87d3db3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Despite this, Wilma refused to give up.)","ko":"이런데도 불구하고, 윌마는 포기하기를 ( ).","opts":["기뻐했다","잊었다","시도했다","거부했다"],"word":"refused","r":{"a":"4) 거부했다","ev":"8번 문장","s":[[8,"Despite this, Wilma refused to give up.","이런데도 불구하고, 윌마는 포기하기를 거부했다."]],"w":"Despite this(이런데도 불구하고) 뒤라서, 포기하라는 압박에도 포기하기를 거부했다는 뜻이에요. refuse = 거부하다.","c":4},"h":"8f029a9cf4"},{"n":6,"t":"ref","q":"What does the underlined \"there\" refer to?\nBut she didn’t stop there.","ko":"밑줄 친 there가 가리키는 것은?","sko":"하지만 그녀는 거기에서 멈추지 않았다.","opts":["보조기를 벗고 혼자서 걸을 수 있게 된 단계","1956년의 올림픽 경기장","병원의 치료실","올림픽의 시상대"],"r":{"a":"1) 보조기를 벗고 혼자서 걸을 수 있게 된 단계","ev":"10~11번 문장","s":[[10,"After several years of treatment, she was finally able to take the brace off and walk on her own.","몇 년의 치료 후에, 그녀는 마침내 보조기를 벗고 혼자서 걸을 수 있었다."],[11,"But she didn’t stop there.","하지만 그녀는 거기에서 멈추지 않았다."]],"w":"11번의 there는 장소가 아니라 앞 10번의 단계예요. 보조기를 벗고 혼자서 걸을 수 있게 된 것에서 멈추지 않고 달리기까지 나아갔어요.","c":1},"h":"49440e1825"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"She started to practice running and pursued her dream of becoming an athlete.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀는 달리기를 연습하기 시작했고 육상 선수가 되려는 그녀의 꿈을 추구했다.","opts":["그녀는 달리기를 그만두고 다른 꿈을 찾았다.","그녀는 달리기 연습을 시작했고 육상 선수가 되려는 꿈을 좇았다.","그녀는 육상 선수를 가르치는 학교를 세웠다.","그녀는 연습 없이도 육상 선수가 되었다."],"r":{"a":"2) 그녀는 달리기 연습을 시작했고 육상 선수가 되려는 꿈을 좇았다.","ev":"12번 문장","s":[[12,"She started to practice running and pursued her dream of becoming an athlete.","그녀는 달리기를 연습하기 시작했고 육상 선수가 되려는 그녀의 꿈을 추구했다."]],"w":"pursue one's dream은 '꿈을 좇다'예요. her dream of becoming an athlete는 '육상 선수가 되려는 꿈'이라는 뜻이에요.","c":2},"h":"d8fdd97631"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["윌마는 태어날 때부터 건강하고 튼튼했다.","윌마는 몇 년의 치료 후 보조기 없이 혼자 걸을 수 있었다.","윌마는 첫 올림픽에서 금메달 세 개를 땄다.","윌마는 보조기를 벗은 뒤 달리기를 포기했다."],"opts":["Wilma was born healthy and strong.","Wilma could walk on her own without the brace after several years of treatment.","Wilma won three gold medals at her first Olympics.","Wilma gave up running after taking off the brace."],"r":{"a":"2) Wilma could walk on her own without the brace after several years of treatment.","ev":"10번 문장","s":[[10,"After several years of treatment, she was finally able to take the brace off and walk on her own.","몇 년의 치료 후에, 그녀는 마침내 보조기를 벗고 혼자서 걸을 수 있었다."]],"w":"10번에서 몇 년의 치료 후 보조기를 벗고 혼자서 걸을 수 있었다고 해요. 윌마는 예정보다 일찍 태어나 약했고(5번), 금메달 3개는 다음 올림픽에서 땄으며(14번), 달리기를 시작했어요(12번).","c":2},"h":"e3077346e6"},{"n":9,"t":"sum","q":"Wilma overcame her (A) leg and became the first American woman to win three (B) medals in one Olympics.","ko":"윌마는 (A) 다리를 극복하고 한 올림픽에서 (B) 메달 3개를 딴 최초의 미국인 여성이 되었다.","oko":["(A) 마비된 / (B) 금","(A) 마비된 / (B) 동","(A) 튼튼한 / (B) 금","(A) 마비된 / (B) 은","(A) 튼튼한 / (B) 동"],"opts":["(A) paralyzed / (B) gold","(A) paralyzed / (B) bronze","(A) strong / (B) gold","(A) paralyzed / (B) silver","(A) strong / (B) bronze"],"r":{"a":"1) (A) paralyzed / (B) gold","ev":"7번, 14번 문장","s":[[7,"At age five, her left leg became paralyzed due to polio.","5살 때, 그녀의 왼쪽 다리가 소아마비 때문에 마비되었다."],[14,"Just four years later, at the next Olympics, she became the first American woman to win three gold medals in one Olympics and even set a new world record!","불과 4년 후, 다음 올림픽에서, 그녀는 한 올림픽에서 3개의 금메달을 딴 최초의 미국인 여성이 되었고 심지어 세계 신기록을 세웠다!"]],"w":"7번에서 왼쪽 다리가 마비되었고(paralyzed), 14번에서 한 올림픽에서 금메달(gold) 3개를 딴 최초의 미국인 여성이 되었어요. 동메달은 첫 올림픽에서 땄고(13번), 은메달 이야기는 없어요.","c":1},"h":"0ee8a26b07"},{"n":10,"t":"fill","q":"To strengthen her leg muscles, Wilma began wearing a heavy [A], and after several years of treatment she could walk on her [B].","ko":"다리 근육을 강화하기 위해 윌마는 무거운 [A]을(를) 착용하기 시작했고, 몇 년의 치료 후 [B] 힘으로 걸을 수 있었다.","bank":["brace","own","paralyzed","premature","weak","refused"],"bko":{"brace":"보조기","own":"자신의","paralyzed":"마비된","premature":"조산의","weak":"약한","refused":"거부했다"},"r":{"a":"[A] brace, [B] own","ev":"9~10번 문장","s":[[9,"To strengthen her leg muscles, she began wearing a heavy brace on her leg.","다리 근육을 강화하기 위해, 그녀는 다리에 무거운 보조기를 착용하기 시작했다."],[10,"After several years of treatment, she was finally able to take the brace off and walk on her own.","몇 년의 치료 후에, 그녀는 마침내 보조기를 벗고 혼자서 걸을 수 있었다."]],"w":"9번에서 무거운 보조기(brace)를 착용했고, 10번에서 보조기를 벗고 혼자서(on her own) 걸을 수 있었어요. paralyzed·premature·weak는 형용사, refused는 과거형이라 [A], [B] 자리에 맞지 않아요.","c":null},"h":"c697105c4a"}]},{"u":2,"id":"hk4-02-3","no":3,"ko":"모두가 “예”를 외칠 때 나는?\b","items":[{"n":1,"t":"tf","q":"Before the experiment, all but one friend are told to answer line 1.","ko":"실험 전에, 한 명을 제외한 모든 친구들은 직선 1이라고 답하라는 말을 듣는다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But, beforehand, tell all but one friend to answer line 1.","그러나, 사전에, 한 친구를 제외하고 모두에게 직선 1로 답하라고 말해둬라."]],"w":"3번에서 beforehand(사전에) 한 친구를 제외하고 모두에게 직선 1로 답하라고 말해 둔다고 해요.","c":"T"},"h":"84c40a4853"},{"n":2,"t":"tf","q":"Conformity is a tendency to stand out from a group.","ko":"동조는 집단에서 눈에 띄려는 성향이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Conformity is a tendency to change our opinions or behavior in order to fit in with a group.","동조는 집단과 어울리기 위해 우리의 의견이나 행동을 바꾸려는 성향이다."]],"w":"7번에서 동조는 집단과 어울리기 위해(fit in with a group) 의견이나 행동을 바꾸려는 성향이라고 해요. 눈에 띄려는 것과 반대예요.","c":"F"},"h":"94ae0ed4cd"},{"n":3,"t":"tf","q":"We will likely follow those who are higher in status.","ko":"우리는 아마 지위가 더 높은 사람들을 따를 것이다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Also, we will likely follow those who are higher in status.","또한, 우리는 아마 더 높은 지위에 있는 사람들을 따를 것이다."]],"w":"12번 문장이 그대로 이 내용이에요. those who are higher in status는 지위가 더 높은 사람들이에요.","c":"T"},"h":"969290b38d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Conformity is a tendency to change our opinions or behavior in order to fit in with a group.)","ko":"동조는 집단과 어울리기 위해 우리의 의견이나 행동을 바꾸려는 ( )이다.","opts":["성향","능력","실수","약속"],"word":"tendency","r":{"a":"1) 성향","ev":"6~7번 문장","s":[[6,"This is because of conformity.","이것은 동조 때문이다."],[7,"Conformity is a tendency to change our opinions or behavior in order to fit in with a group.","동조는 집단과 어울리기 위해 우리의 의견이나 행동을 바꾸려는 성향이다."]],"w":"6번에서 정답을 알면서도 틀린 답을 따르는 일을 동조 때문이라고 하고, 7번에서 동조가 무엇인지 풀어 줘요. tendency = 성향, 경향.","c":1},"h":"78543c363c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most of us don’t like to stand out, so we often follow what the majority does.)","ko":"우리들 중 대부분은 눈에 띄는 것을 좋아하지 않아서, ( )가 하는 것을 종종 따른다.","opts":["다수","소수","전문가","선생님"],"word":"majority","r":{"a":"1) 다수","ev":"8번 문장","s":[[8,"Most of us don’t like to stand out, so we often follow what the majority does.","우리들 중 대부분은 눈에 띄는 것을 좋아하지 않아서, 다수가 하는 것을 종종 따른다."]],"w":"눈에 띄기 싫어서 따르는 대상이니 다수예요. 11번의 go along with the majority, 13번의 majority opinion(다수 의견)도 같은 뜻이에요. majority = 다수.","c":1},"h":"3e18665470"},{"n":6,"t":"ref","q":"What does the underlined \"he or she\" refer to?\nSurprisingly, the friend you didn’t tell might answer line 1 too, even though he or she knows the correct answer is line 3!","ko":"밑줄 친 he or she가 가리키는 것은?","sko":"놀랍게도, 당신이 말해주지 않았던 친구 또한, 비록 정답이 직선 3이라는 것을 알고 있더라도 직선 1이라고 답할 수도 있다.","opts":["그림을 보여 준 사람","틀린 답을 하라고 미리 들은 친구들","실험을 지켜보는 사람","미리 말을 듣지 못한 한 친구"],"r":{"a":"4) 미리 말을 듣지 못한 한 친구","ev":"5번 문장","s":[[5,"Surprisingly, the friend you didn’t tell might answer line 1 too, even though he or she knows the correct answer is line 3!","놀랍게도, 당신이 말해주지 않았던 친구 또한, 비록 정답이 직선 3이라는 것을 알고 있더라도 직선 1이라고 답할 수도 있다."]],"w":"he or she는 바로 앞의 the friend you didn’t tell(당신이 말해 주지 않았던 친구)이에요. 이 친구만 틀린 답을 하라는 말을 못 들어서 정답이 3인 걸 알아요.","c":4},"h":"2f1b19c2f3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The greater the emotional bond we feel with the group, the more strongly we conform.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리가 집단에 느끼는 정서적 유대가 클수록, 우리는 더 강하게 동조한다.","opts":["집단과의 유대가 클수록 우리는 동조를 덜 한다.","집단이 클수록 우리는 더 강하게 동조한다.","집단에 느끼는 정서적 유대가 클수록 더 강하게 동조한다.","동조를 많이 할수록 집단과의 유대가 약해진다."],"r":{"a":"3) 집단에 느끼는 정서적 유대가 클수록 더 강하게 동조한다.","ev":"9번 문장","s":[[9,"The greater the emotional bond we feel with the group, the more strongly we conform.","우리가 집단에 느끼는 정서적 유대가클수록, 우리는 더 강하게 동조한다."]],"w":"the + 비교급 ~, the + 비교급 …은 ‘~할수록 더 …하다’예요. 유대(bond)가 커질수록 동조(conform)도 강해진다는 뜻이고, 집단의 크기 이야기는 없어요.","c":3},"h":"da6140d8c3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사람들은 눈에 띄는 것을 좋아해서 다수와 다르게 행동한다.","결정을 내리기 어려울 때 우리는 다수를 따르는 경향이 있다.","동조는 지위와 전혀 관계가 없다.","한 명이 다수 의견에 반대하면 동조가 더 강해진다."],"opts":["People like to stand out, so they act differently from the majority.","When it is hard to make a decision, we tend to go along with the majority.","Conformity has nothing to do with status.","If one member disagrees with the majority, conformity gets stronger."],"r":{"a":"2) When it is hard to make a decision, we tend to go along with the majority.","ev":"11번 문장","s":[[11,"When it is difficult to make a decision, we tend to go along with the majority.","결정을 내리기 어려울 때, 우리는 다수에 동조하는 경향이 있다."]],"w":"11번에서 결정을 내리기 어려울 때 다수에 동조하는 경향이 있다고 해요. 대부분은 눈에 띄는 것을 싫어하고(8번), 지위가 높은 사람을 따르며(12번), 한 명이라도 반대하면 동조가 무너질 수 있어요(13번).","c":2},"h":"e9c581ed60"},{"n":9,"t":"sum","q":"Conformity is a tendency to (A) our opinions or behavior to fit in with a group, but it can (B) down if even one member disagrees.","ko":"동조는 집단과 어울리기 위해 의견이나 행동을 (A) 성향이지만, 한 명이라도 반대하면 (B) 수 있다.","oko":["(A) 바꾸려는 / (B) 무너질","(A) 지키려는 / (B) 무너질","(A) 바꾸려는 / (B) 커질","(A) 지키려는 / (B) 커질","(A) 숨기려는 / (B) 고칠"],"opts":["(A) change / (B) break","(A) keep / (B) break","(A) change / (B) grow","(A) keep / (B) grow","(A) hide / (B) fix"],"r":{"a":"1) (A) change / (B) break","ev":"7번, 13번 문장","s":[[7,"Conformity is a tendency to change our opinions or behavior in order to fit in with a group.","동조는 집단과 어울리기 위해 우리의 의견이나 행동을 바꾸려는 성향이다."],[13,"On the other hand, conformity can break down if even one member of the group disagrees with the majority opinion.","반면에, 만약 집단의 구성원 중 한 명이라도 다수 의견에 동의하지 않는다면 동조는 무너질 수 있다."]],"w":"7번에서 집단과 어울리기 위해 의견이나 행동을 바꾸려는(change) 성향이라고 하고, 13번에서 한 명이라도 반대하면 동조가 무너질(break down) 수 있다고 해요.","c":1},"h":"c083d516d0"},{"n":10,"t":"fill","q":"When it is difficult to make a [A], we tend to go along with the majority, and we will likely follow those who are higher in [B].","ko":"[A]을(를) 내리기 어려울 때 우리는 다수에 동조하는 경향이 있고, [B]이(가) 더 높은 사람들을 따를 것이다.","bank":["decision","status","opinion","factor","tendency","majority"],"bko":{"decision":"결정","status":"지위","opinion":"의견","factor":"요인","tendency":"성향","majority":"다수"},"r":{"a":"[A] decision, [B] status","ev":"11~12번 문장","s":[[11,"When it is difficult to make a decision, we tend to go along with the majority.","결정을 내리기 어려울 때, 우리는 다수에 동조하는 경향이 있다."],[12,"Also, we will likely follow those who are higher in status.","또한, 우리는 아마 더 높은 지위에 있는 사람들을 따를 것이다."]],"w":"11번에서 결정(decision)을 내리기 어려울 때 다수에 동조하고, 12번에서 지위(status)가 더 높은 사람들을 따른다고 해요. 'a [A]' 앞의 a 때문에 opinion은 맞지 않고, factor·tendency·majority는 [B] 자리에서 뜻이 통하지 않아요.","c":null},"h":"362b704b33"}]},{"u":2,"id":"hk4-02-4","no":4,"ko":"사랑하면 나오나요? \b","items":[{"n":1,"t":"tf","q":"Wisdom teeth usually come out after the age of 17.","ko":"사랑니는 보통 17살 이후에 난다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They emerge when you’re older, usually after the age of 17.","그것들은 보통 17살 이후로, 당신이 나이가 더 들면 나온다."]],"w":"2번에서 그것들은 보통 17살 이후, 나이가 더 들면 나온다고 해요.","c":"T"},"h":"cf359c451d"},{"n":2,"t":"tf","q":"Our ancestors used their wisdom teeth to eat soft food.","ko":"우리의 선조들은 부드러운 음식을 먹기 위해 사랑니를 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"However, several million years ago, our ancestors used their wisdom teeth to eat tough roots, leaves, and raw meat.","하지만, 수백만 년 전에, 우리의 선조들은 질긴 뿌리, 이파리, 그리고 날고기를 먹기 위해 사랑니를 사용했다."]],"w":"6번에서 선조들은 질긴 뿌리, 이파리, 날고기를 먹기 위해 사랑니를 사용했다고 해요. 부드러운 음식이 아니에요.","c":"F"},"h":"3f320fdac9"},{"n":3,"t":"tf","q":"More and more people these days don’t get wisdom teeth in their life.","ko":"오늘날 점점 더 많은 사람들이 평생 사랑니가 나지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"In fact, more and more people these days don’t get wisdom teeth throughout their life!","실제로, 오늘날 점점 더 많은 사람들이 평생 사랑니가 나지 않는다!"]],"w":"11번에서 more and more people these days don’t get wisdom teeth throughout their life라고 해요.","c":"T"},"h":"26325c804e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They emerge when you’re older, usually after the age of 17.)","ko":"그것들은 보통 17살 이후로, 당신이 나이가 더 들면 ( ).","opts":["나온다","사라진다","부러진다","줄어든다"],"word":"emerge","r":{"a":"1) 나온다","ev":"1~2번 문장","s":[[1,"Do you know that you have teeth in the back of your mouth that haven’t come out yet?","당신은 입 뒤쪽에 아직 나지 않은 치아가 있다는 것을 알고 있는가?"],[2,"They emerge when you’re older, usually after the age of 17.","그것들은 보통 17살 이후로, 당신이 나이가 더 들면 나온다."]],"w":"1번에서 ‘아직 나지 않은(haven’t come out yet) 치아’라고 했고, 2번의 emerge가 그 치아가 나오는 일을 말해요. emerge = 나오다.","c":1},"h":"71a788fa5a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (..., our ancestors used their wisdom teeth to eat tough roots, leaves, and raw meat.)","ko":"..., 우리의 선조들은 ( ) 뿌리, 이파리, 그리고 날고기를 먹기 위해 사랑니를 사용했다.","opts":["부드러운","달콤한","질긴","뜨거운"],"word":"tough","r":{"a":"3) 질긴","ev":"6~8번 문장","s":[[6,"However, several million years ago, our ancestors used their wisdom teeth to eat tough roots, leaves, and raw meat.","하지만, 수백만 년 전에, 우리의 선조들은 질긴 뿌리, 이파리, 그리고 날고기를 먹기 위해 사랑니를 사용했다."],[7,"Their jaws were also much larger, providing plenty of room in the mouth for wisdom teeth.","그들의 턱은 또한 훨씬 더 커서, 입안에 사랑니를 위한 충분한 공간을제공했다."],[8,"However, as humans started to use fire for cooking, food became softer and easier to chew.","하지만, 인간이 요리를 위해 불을 사용하기 시작함에 따라, 음식은 더 부드럽고 씹기 쉬워졌다."]],"w":"8번에서 불로 요리하자 음식이 더 부드럽고 씹기 쉬워졌다고 하니, 그 전의 음식은 질겼어요. tough = 질긴.","c":3},"h":"3a8a684fb6"},{"n":6,"t":"ref","q":"What does the underlined \"Their\" refer to?\nTheir jaws were also much larger, providing plenty of room in the mouth for wisdom teeth.","ko":"밑줄 친 Their가 가리키는 것은?","sko":"그들의 턱은 또한 훨씬 더 커서, 입안에 사랑니를 위한 충분한 공간을 제공했다.","opts":["오늘날의 사람들","우리의 선조들","치과 의사들","사랑니들"],"r":{"a":"2) 우리의 선조들","ev":"6~7번 문장","s":[[6,"However, several million years ago, our ancestors used their wisdom teeth to eat tough roots, leaves, and raw meat.","하지만, 수백만 년 전에, 우리의 선조들은 질긴 뿌리, 이파리, 그리고 날고기를 먹기 위해 사랑니를 사용했다."],[7,"Their jaws were also much larger, providing plenty of room in the mouth for wisdom teeth.","그들의 턱은 또한 훨씬 더 커서, 입안에 사랑니를 위한 충분한 공간을제공했다."]],"w":"7번의 Their는 바로 앞 6번의 our ancestors(우리의 선조들)예요. 선조들의 턱이 훨씬 커서 사랑니 공간이 충분했어요.","c":2},"h":"1a5361bd90"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, our jaws became smaller over time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과적으로, 우리의 턱은 시간이 지나면서 더 작아졌다.","opts":["그 결과 우리의 턱은 시간이 지나면서 더 커졌다.","그 결과 우리의 턱은 시간이 지나면서 더 작아졌다.","그 결과 우리는 시간이 갈수록 음식을 더 오래 씹었다.","그 결과 우리의 이는 시간이 지나면서 더 많이 났다."],"r":{"a":"2) 그 결과 우리의 턱은 시간이 지나면서 더 작아졌다.","ev":"8~9번 문장","s":[[8,"However, as humans started to use fire for cooking, food became softer and easier to chew.","하지만, 인간이 요리를 위해 불을 사용하기 시작함에 따라, 음식은 더 부드럽고 씹기 쉬워졌다."],[9,"As a result, our jaws became smaller over time.","결과적으로, 우리의 턱은 시간이 지나면서 더 작아졌다."]],"w":"over time은 ‘시간이 지나면서’이고 smaller는 ‘더 작은’이에요. 8번에서 음식이 부드러워져 턱이 크지 않아도 됐기 때문이에요.","c":2},"h":"e4c691a0f9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["사랑니는 통증이나 충치를 절대 일으키지 않는다.","우리 선조들의 턱은 오늘날의 우리 턱보다 작았다.","불로 요리하기 시작하자 음식이 씹기 더 쉬워졌다.","대부분의 사람들은 오늘날 사랑니가 유용해서 그대로 둔다."],"opts":["Wisdom teeth never cause pain or cavities.","Our ancestors’ jaws were smaller than our jaws today.","Food became easier to chew when humans started to use fire for cooking.","Most people keep their wisdom teeth because they are useful today."],"r":{"a":"3) Food became easier to chew when humans started to use fire for cooking.","ev":"8번 문장","s":[[8,"However, as humans started to use fire for cooking, food became softer and easier to chew.","하지만, 인간이 요리를 위해 불을 사용하기 시작함에 따라, 음식은 더 부드럽고 씹기 쉬워졌다."]],"w":"8번에서 인간이 요리에 불을 쓰기 시작하면서 음식이 더 부드럽고 씹기 쉬워졌다고 해요. 사랑니는 통증과 충치를 일으켜 대부분 뽑고(5번), 선조들의 턱은 훨씬 더 컸어요(7번).","c":3},"h":"61815a9f88"},{"n":9,"t":"sum","q":"Our ancestors had (A) jaws and used wisdom teeth to eat tough food, but after humans began to (B) their food, our jaws became smaller.","ko":"우리 선조들은 (A) 턱을 가졌고 질긴 음식을 먹는 데 사랑니를 사용했지만, 인간이 음식을 (B) 시작한 뒤 우리의 턱은 더 작아졌다.","oko":["(A) 더 큰 / (B) 요리하기","(A) 더 큰 / (B) 얼리기","(A) 더 작은 / (B) 요리하기","(A) 더 작은 / (B) 얼리기","(A) 더 큰 / (B) 말리기"],"opts":["(A) larger / (B) cook","(A) larger / (B) freeze","(A) smaller / (B) cook","(A) smaller / (B) freeze","(A) larger / (B) dry"],"r":{"a":"1) (A) larger / (B) cook","ev":"6~9번 문장","s":[[6,"However, several million years ago, our ancestors used their wisdom teeth to eat tough roots, leaves, and raw meat.","하지만, 수백만 년 전에, 우리의 선조들은 질긴 뿌리, 이파리, 그리고 날고기를 먹기 위해 사랑니를 사용했다."],[7,"Their jaws were also much larger, providing plenty of room in the mouth for wisdom teeth.","그들의 턱은 또한 훨씬 더 커서, 입안에 사랑니를 위한 충분한 공간을제공했다."],[8,"However, as humans started to use fire for cooking, food became softer and easier to chew.","하지만, 인간이 요리를 위해 불을 사용하기 시작함에 따라, 음식은 더 부드럽고 씹기 쉬워졌다."],[9,"As a result, our jaws became smaller over time.","결과적으로, 우리의 턱은 시간이 지나면서 더 작아졌다."]],"w":"6번에서 질긴 음식을 먹는 데 사랑니를 썼고, 7번에서 턱이 훨씬 더 컸으며(larger), 8번에서 요리(cooking)로 음식이 부드러워지자 9번에서 턱이 작아졌어요.","c":1},"h":"8c1ae2106b"},{"n":10,"t":"fill","q":"In reality, wisdom teeth often cause [A] and cavities, so most people have them [B].","ko":"실제로 사랑니는 종종 [A]과(와) 충치를 일으켜서, 대부분의 사람들은 그것들이 [B]되게 한다.","bank":["pain","removed","tough","jaw","ancestor","root"],"bko":{"pain":"통증","removed":"제거된","tough":"질긴","jaw":"턱","ancestor":"선조","root":"뿌리"},"r":{"a":"[A] pain, [B] removed","ev":"5번 문장","s":[[5,"In reality, wisdom teeth often cause pain and cavities, so most people have them removed.","실제로는, 사랑니는 종종 통증과 충치를 유발해서, 대부분의 사람들은 그것들이 제거되게 한다."]],"w":"5번에서 사랑니는 종종 통증(pain)과 충치를 일으켜서 대부분 사람들이 그것들을 제거되게(removed) 한다고 해요. tough는 형용사이고 jaw·ancestor·root는 명사라서 have them ___ 자리에 맞지 않거나 뜻이 통하지 않아요.","c":null},"h":"250f71d38b"}]},{"u":3,"id":"hk4-03-1","no":1,"ko":"해치지 않아~\b","items":[{"n":1,"t":"tf","q":"Clean Meat may interest people who feel guilty about eating meat.","ko":"클린 미트는 고기를 먹는 것에 죄책감을 느끼는 사람들에게 관심을 끌 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"If you sometimes feel guilty about eating meat, you may be interested in a new product called Clean Meat.","당신이 고기를 먹는 것에 대해 가끔 죄책감을 느낀다면, 당신은 클린 미트라고 불리는 새로운 제품에 관심이 있을지도 모른다."]],"w":"1번 문장에서 고기를 먹는 것에 가끔 죄책감을 느낀다면 클린 미트라는 새 제품에 관심이 있을지도 모른다(you may be interested in)고 해요.","c":"T"},"h":"811b749694"},{"n":2,"t":"tf","q":"Clean Meat releases a lot of greenhouse gas, just like cows.","ko":"클린 미트는 소처럼 많은 온실가스를 배출한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"But Clean Meat doesn’t release any greenhouse gas at all.","하지만 클린 미트는 조금의 온실가스도 전혀 배출하지 않는다."]],"w":"10번 문장에서 클린 미트는 온실가스를 전혀 배출하지 않는다(doesn’t release any greenhouse gas at all)고 해요. 소 네 마리가 차 한 대만큼 배출하는 것은 9번 이야기이고, 클린 미트는 그 반대예요.","c":"F"},"h":"2ab906cc1a"},{"n":3,"t":"tf","q":"A single cell can create 10,000 kilograms of meat.","ko":"하나의 세포가 만 킬로그램의 고기를 만들어 낼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"A single cell can create 10,000 kilograms of meat, which looks and tastes just like regular meat.","하나의 세포가 만 킬로그램의 고기를 만들어낼 수 있는데, 이것은 마치 보통 고기처럼 보이고 맛이 난다."]],"w":"6번 문장에 A single cell can create 10,000 kilograms of meat가 그대로 나와요.","c":"T"},"h":"a19ce7868f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Clean Meat is produced in a lab.)","ko":"클린 미트는 연구실에서 ( ).","opts":["생산된다","버려진다","판매된다","발견된다"],"word":"produced","r":{"a":"1) 생산된다","ev":"2번 문장","s":[[2,"Clean Meat is produced in a lab.","클린 미트는 연구실에서 생산된다."]],"w":"2번 문장은 클린 미트를 연구실에서 만든다는 말이에요. is produced는 produce(생산하다)의 수동형으로 '생산된다'예요. 이어지는 3~5번에서 만드는 과정이 나와요.","c":1},"h":"074d47083e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (just four cows emit the same amount of greenhouse gas as a car)","ko":"단 네 마리의 소가 한 대의 차와 같은 양의 온실가스를 ( ).","opts":["흡수한다","모은다","배출한다","막는다"],"word":"emit","r":{"a":"3) 배출한다","ev":"9번 문장","s":[[9,"For example, just four cows emit the same amount of greenhouse gas as a car.","예를 들어, 단 네 마리의 소가 한 대의 차와 같은 양의 온실가스를 배출한다."]],"w":"9번 문장은 소 네 마리가 온실가스를 내뿜는다는 말이에요. 바로 뒤 10번에서 같은 뜻의 release(배출하다)가 쓰여요. emit = 배출하다.","c":3},"h":"add23a5842"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nNext, the cells are given nutrients and grown into muscles, which are the main part of the meat we eat.","ko":"밑줄 친 which가 가리키는 것은?","sko":"그 다음, 세포는 영양분을 공급받고 근육으로 키워지는데, 이것들은 우리가 먹는 고기의 주된 부위이다.","opts":["세포들","영양분","우리가 먹는 고기 전체","근육"],"r":{"a":"4) 근육","ev":"4번 문장","s":[[4,"Next, the cells are given nutrients and grown into muscles, which are the main part of the meat we eat.","그 다음, 세포는 영양분을 공급받고 근육으로 키워지는데, 이것들은 우리가 먹는 고기의 주된 부위이다."]],"w":"which are the main part의 which는 바로 앞 muscles(근육들)를 가리켜요. are가 복수 동사이므로 단수인 '고기 전체'가 아니라 복수인 muscles와 짝이에요.","c":4},"h":"4f53d66500"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"With this new product, you can eat as much meat as you want without killing livestock.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 새로운 제품으로, 당신은 가축을 죽이지 않고 원하는 만큼의 고기를 먹을 수 있다.","opts":["가축을 죽여야만 원하는 만큼 고기를 먹을 수 있다.","가축을 죽이지 않고도 원하는 만큼 고기를 먹을 수 있다.","가축을 죽이지 않으려면 고기를 조금만 먹어야 한다.","이 제품은 가축을 더 많이 키우도록 도와준다."],"r":{"a":"2) 가축을 죽이지 않고도 원하는 만큼 고기를 먹을 수 있다.","ev":"7번 문장","s":[[7,"With this new product, you can eat as much meat as you want without killing livestock.","이 새로운 제품으로, 당신은 가축을 죽이지 않고 원하는 만큼의 고기를 먹을 수 있다."]],"w":"without killing livestock은 '가축을 죽이지 않고'예요. as much meat as you want는 원하는 만큼 많은 고기이니 먹는 양을 줄이라는 말이 아니에요.","c":2},"h":"85f6092ea0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["클린 미트는 동물이 사육되는 농장에서 생산된다.","클린 미트는 보통 고기와 맛이 매우 다르다.","클린 미트는 살아 있는 동물의 근육 세포로 연구실에서 만들어진다.","클린 미트는 소보다 더 많은 온실가스를 배출한다."],"opts":["Clean Meat is produced on farms where animals are raised.","Clean Meat tastes very different from regular meat.","Clean Meat is made in a lab from the muscle cells of a living animal.","Clean Meat releases more greenhouse gas than cows do."],"r":{"a":"3) Clean Meat is made in a lab from the muscle cells of a living animal.","ev":"2~3번 문장","s":[[2,"Clean Meat is produced in a lab.","클린 미트는 연구실에서 생산된다."],[3,"First, muscle cells are removed from a living animal, such as a pig, cow, or chicken.","먼저, 근육 세포가 돼지, 소, 또는 닭과 같은 살아있는 동물로부터 떼어내진다."]],"w":"2~3번에서 연구실에서 생산되고(is produced in a lab), 살아 있는 동물에서 떼어 낸 근육 세포로 시작한다고 해요. 농장 생산, 다른 맛, 더 많은 온실가스는 모두 본문과 반대예요.","c":3},"h":"984322a7cc"},{"n":9,"t":"sum","q":"Clean Meat is made by growing animal cells into (A), which are then (B) into foods like hamburger patties or sausages.","ko":"클린 미트는 동물 세포를 (A)로 키워서 만들고, 그것은 이후 햄버거 패티나 소시지 같은 식품으로 (B).","oko":["(A) 뼈 / (B) 얼려진다","(A) 잎 / (B) 가공된다","(A) 근육 / (B) 가공된다","(A) 근육 / (B) 버려진다","(A) 가축 / (B) 떼어내진다"],"opts":["(A) bones / (B) frozen","(A) leaves / (B) processed","(A) muscles / (B) processed","(A) muscles / (B) thrown away","(A) livestock / (B) removed"],"r":{"a":"3) (A) muscles / (B) processed","ev":"3~5번 문장","s":[[3,"First, muscle cells are removed from a living animal, such as a pig, cow, or chicken.","먼저, 근육 세포가 돼지, 소, 또는 닭과 같은 살아있는 동물로부터 떼어내진다."],[4,"Next, the cells are given nutrients and grown into muscles, which are the main part of the meat we eat.","그 다음, 세포는 영양분을 공급받고 근육으로 키워지는데, 이것들은 우리가 먹는 고기의 주된 부위이다."],[5,"Finally, Clean Meat is processed into various food products, like hamburger patties or sausages.","마지막으로, 클린 미트는 햄버거 패티와 소시지 같은 다양한 식품으로 가공된다."]],"w":"4번에서 세포가 영양분을 받아 근육(muscles)으로 키워지고, 5번에서 다양한 식품으로 가공된다(is processed)고 해요.","c":3},"h":"234cba4695"},{"n":10,"t":"fill","q":"Clean Meat has a [A] effect on the environment by [B] the number of animals raised on farms.","ko":"클린 미트는 농장에서 사육되는 동물의 수를 [B] 환경에 [A] 영향을 끼친다.","bank":["positive","reducing","livestock","nutrients","muscles","sausages"],"bko":{"positive":"긍정적인","reducing":"줄임으로써","livestock":"가축","nutrients":"영양분","muscles":"근육","sausages":"소시지"},"r":{"a":"[A] positive, [B] reducing","ev":"8번 문장","s":[[8,"In addition, it has a positive effect on the environment by reducing the number of animals that are raised on farms.","게다가, 그것은 농장에서 사육되는 동물들의 수를 줄임으로써 환경에 긍정적인 영향을 끼친다."]],"w":"8번 문장 has a positive effect on the environment by reducing the number of animals에서 가져왔어요. [A]는 effect를 꾸미는 말, [B]는 by 뒤의 -ing 형태가 필요해서 나머지 명사들은 들어갈 수 없어요.","c":null},"h":"aecf25c2a7"}]},{"u":3,"id":"hk4-03-2","no":2,"ko":"알다가도 모를 예술의 세계\b","items":[{"n":1,"t":"tf","q":"One of the two works of art has a very unusual story behind it.","ko":"두 개의 예술 작품 중 하나는 매우 특이한 뒷이야기를 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"However, one of the two has a very unusual story behind it.","하지만, 둘 중 하나는 매우 특이한 뒷이야기를 가지고 있다."]],"w":"3번 문장에 However, one of the two has a very unusual story behind it이 그대로 나와요.","c":"T"},"h":"54158c76b8"},{"n":2,"t":"tf","q":"Critics said Brassau’s paintings were weak and boring.","ko":"비평가들은 Brassau의 그림이 약하고 지루하다고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Critics praised his paintings for being powerful yet delicate.","비평가들은 강렬한데도 섬세한 것에 대해 그의 그림을 칭찬했다."]],"w":"6번 문장에서 비평가들은 그의 그림을 강렬하면서도 섬세하다(powerful yet delicate)고 칭찬했어요. 약하고 지루하다는 말은 반대예요.","c":"F"},"h":"4b0de63656"},{"n":3,"t":"tf","q":"The chimpanzee that played with the paint was four years old.","ko":"붓과 물감을 가지고 놀았던 침팬지는 네 살이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"So, he let a four-year-old chimpanzee at a nearby zoo play with a brush and some paint.","그래서, 그는 근처 동물원에 있는 4살짜리 침팬지가 붓과 물감을 가지고 놀도록 했다."]],"w":"11번 문장에서 기자는 근처 동물원의 네 살짜리(four-year-old) 침팬지가 붓과 물감을 가지고 놀게 했어요.","c":"T"},"h":"00160b9314"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…it was Brassau’s work that attracted the most attention.)","ko":"…가장 많은 관심을 ( ) 것은 바로 Brassau의 작품이었다.","opts":["끈","피한","잃은","나눠 준"],"word":"attracted","r":{"a":"1) 끈","ev":"5번 문장","s":[[5,"There were works by other artists from all over the world as well, but it was Brassau’s work that attracted the most attention.","전 세계 다른 예술가들의 작품들 또한 있었지만, 가장 많은 관심을 끈 것은 바로 Brassau의 작품이었다."]],"w":"5번 문장은 다른 작품들도 있었지만 Brassau의 작품이 가장 큰 관심을 받았다는 말이에요. attract는 '(관심을) 끌다'예요.","c":1},"h":"0dd76edc8d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Everyone was curious about who Brassau was…)","ko":"모두가 Brassau가 누구인지 ( ) 그를 직접 만나고 싶어 했다.","opts":["화난","지루한","궁금해했고","무서운"],"word":"curious","r":{"a":"3) 궁금해했고","ev":"7번 문장","s":[[7,"Everyone was curious about who Brassau was and couldn’t wait to meet him in person.","모두가 Brassau가 누구인지 궁금해했고 그를 정말 직접 만나고 싶어 했다."]],"w":"7번 문장은 칭찬받은 그림을 그린 사람이 누구인지 모두 알고 싶어 했다는 말이에요. 뒤의 couldn’t wait to meet him(만나고 싶어 못 견딘다)과 이어져요. curious = 궁금한.","c":3},"h":"a7fc5e8c46"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey both look like typical abstract paintings.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 둘 다 전형적인 추상화처럼 보인다.","opts":["두 명의 다른 예술가들","두 개의 예술 작품","비평가들","스웨덴 사람들"],"r":{"a":"2) 두 개의 예술 작품","ev":"1~2번 문장","s":[[1,"Look at these two works of art painted by two different artists.","두 명의 다른 예술가들에 의해 그려진 이 두 개의 예술 작품을 보아라."],[2,"They both look like typical abstract paintings.","그것들은 둘 다 전형적인 추상화처럼 보인다."]],"w":"2번 They both look like ~ paintings는 그림 같다는 말이니, 1번의 two works of art(두 개의 예술 작품)를 가리켜요. 예술가들(artists)은 그림을 그린 사람이라 '추상화처럼 보인다'의 주어가 될 수 없어요.","c":2},"h":"9b3442fede"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But surprisingly, he was not a person but a chimpanzee!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 놀랍게도, 그는 사람이 아니라 침팬지였다!","opts":["그는 사람이었지만 침팬지처럼 그림을 그렸다.","그는 침팬지가 아니라 사람이었다.","그는 사람과 침팬지가 함께 만든 이름이었다.","그는 사람이 아니라 침팬지였다."],"r":{"a":"4) 그는 사람이 아니라 침팬지였다.","ev":"8번 문장","s":[[8,"But surprisingly, he was not a person but a chimpanzee!","하지만 놀랍게도, 그는 사람이 아니라 침팬지였다!"]],"w":"not A but B는 'A가 아니라 B'예요. 그래서 사람이 아니라 침팬지라는 뜻이고, 사람과 침팬지가 함께했다는 말은 아니에요.","c":4},"h":"8de1a4f2e5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["전시회에는 Brassau의 그림만 전시되었다.","스웨덴의 유명한 예술가가 Brassau의 작품을 그렸다.","비평가들은 처음부터 Brassau가 침팬지인 것을 알았다.","기자는 근처 동물원의 침팬지가 붓과 물감을 가지고 놀게 했다."],"opts":["Only Brassau’s paintings were shown at the art show.","A famous artist from Sweden painted Brassau’s works.","Critics knew from the start that Brassau was a chimpanzee.","The journalist let a chimpanzee at a nearby zoo play with a brush and paint."],"r":{"a":"4) The journalist let a chimpanzee at a nearby zoo play with a brush and paint.","ev":"11번 문장","s":[[11,"So, he let a four-year-old chimpanzee at a nearby zoo play with a brush and some paint.","그래서, 그는 근처 동물원에 있는 4살짜리 침팬지가 붓과 물감을 가지고 놀도록 했다."]],"w":"11번 문장에서 기자가 근처 동물원의 침팬지에게 붓과 물감을 주었어요. 전시회에는 다른 예술가들의 작품도 있었고(5번), 비평가들은 침팬지인 줄 몰랐어요(7~8번).","c":4},"h":"f95a50f53a"},{"n":9,"t":"sum","q":"The journalist used a (A) to find out whether art critics could tell true art from (B) art.","ko":"기자는 예술 비평가들이 진짜 예술과 (B) 예술을 구별할 수 있는지 알아보려고 (A)를 이용했다.","oko":["(A) 화가 / (B) 섬세한","(A) 기자 / (B) 가짜","(A) 침팬지 / (B) 강렬한","(A) 비평가 / (B) 추상","(A) 침팬지 / (B) 가짜"],"opts":["(A) painter / (B) delicate","(A) journalist / (B) fake","(A) chimpanzee / (B) powerful","(A) critic / (B) abstract","(A) chimpanzee / (B) fake"],"r":{"a":"5) (A) chimpanzee / (B) fake","ev":"8~10번 문장","s":[[8,"But surprisingly, he was not a person but a chimpanzee!","하지만 놀랍게도, 그는 사람이 아니라 침팬지였다!"],[9,"Pierre Brassau was the creation of a journalist.","Pierre Brassau는 한 기자의 창작물이었다."],[10,"The journalist wanted to test whether art critics could tell the difference between true abstract art and fake art.","그 기자는 예술 비평가들이 진짜 추상 예술 작품과 가짜 예술 작품을 구별할 수 있는지 시험해보고 싶었다."]],"w":"8번에서 Brassau는 침팬지이고, 9~10번에서 기자가 진짜 추상 예술과 가짜(fake) 예술을 비평가들이 구별하는지 시험하려 했어요.","c":5},"h":"89cd989b8a"},{"n":10,"t":"fill","q":"Critics [A] Brassau’s paintings for being powerful yet [B].","ko":"비평가들은 Brassau의 그림이 강렬하면서도 [B] 것을 [A].","bank":["praised","delicate","chimpanzee","journalist","zoo","brush"],"bko":{"praised":"칭찬했다","delicate":"섬세한","chimpanzee":"침팬지","journalist":"기자","zoo":"동물원","brush":"붓"},"r":{"a":"[A] praised, [B] delicate","ev":"6번 문장","s":[[6,"Critics praised his paintings for being powerful yet delicate.","비평가들은 강렬한데도 섬세한 것에 대해 그의 그림을 칭찬했다."]],"w":"6번 문장 Critics praised his paintings for being powerful yet delicate에서 가져왔어요. [A]는 동사, [B]는 powerful과 짝인 형용사가 필요해서 나머지 명사들은 들어갈 수 없어요.","c":null},"h":"e3d018b321"}]},{"u":3,"id":"hk4-03-3","no":3,"ko":"우리 유니폼은 로봇이야\b","items":[{"n":1,"t":"tf","q":"Every Cybathlon team has one athlete and a group of robot developers.","ko":"사이배슬론의 모든 팀은 한 명의 선수와 한 무리의 로봇 개발자들을 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Every team in this competition consists of one athlete and a group of robot developers.","이 대회의 모든 팀은 한 명의 선수와 한 무리의 로봇 개발자들로 구성된다."]],"w":"3번 문장에서 모든 팀은 한 명의 선수와 한 무리의 로봇 개발자들로 구성된다(consists of)고 해요.","c":"T"},"h":"a326d74f1d"},{"n":2,"t":"tf","q":"The athletes in the Cybathlon are called “coaches.”","ko":"사이배슬론의 선수들은 ‘코치’라고 불린다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The athletes are called “pilots.”","선수들은 ‘조종사’라고 불린다."]],"w":"4번 문장에서 선수들은 ‘조종사(pilots)’라고 불린다고 해요. coaches(코치)는 본문에 나오지 않아요.","c":"F"},"h":"fb44daf5fb"},{"n":3,"t":"tf","q":"The winning team receives two medals.","ko":"이긴 팀은 두 개의 메달을 받는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The winning team receives two medals: one for the pilot and one for the group of robot developers.","이긴 팀은 조종사를 위한 것과 로봇 개발자 무리를 위한 것의 두 개의 메달을 받는다."]],"w":"8번 문장에서 이긴 팀은 조종사를 위한 것과 로봇 개발자 무리를 위한 것, 두 개의 메달을 받는다고 해요.","c":"T"},"h":"5fa5295e5a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…they wear and operate robotic parts designed by the developers…)","ko":"…그들은 개발자들이 설계한 로봇 부품을 착용하고 ( ).","opts":["버린다","조종한다","숨긴다","판매한다"],"word":"operate","r":{"a":"2) 조종한다","ev":"5번 문장","s":[[5,"They have physical disabilities, so they wear and operate robotic parts designed by the developers to help them move.","그들은 신체장애를 가지고 있어서, 그들이 움직이도록 돕기 위해 개발자들에 의해 설계된 로봇 부품을 착용하고 조종한다."]],"w":"5번 문장은 선수가 로봇 부품을 몸에 입고 움직인다는 말이에요. 뒤의 to help them move(움직이도록 돕기 위해)와 이어져 operate는 '조종하다'예요.","c":2},"h":"eb16d8e000"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The ultimate goal of the Cybathlon is to make robots…)","ko":"사이배슬론의 ( ) 목표는 로봇을 만드는 것이다.","opts":["임시의","개인적인","사소한","궁극적인"],"word":"ultimate","r":{"a":"4) 궁극적인","ev":"9번 문장","s":[[9,"The ultimate goal of the Cybathlon is to make robots that move more easily, weigh less, and have a longer battery life.","사이배슬론의 궁극적인 목표는 더 쉽게 움직이고, 무게가 더 적게 나가고, 더 긴 배터리 수명을 가진 로봇을 만드는 것이다."]],"w":"9번 문장은 대회가 가장 크게 바라는 최종 목표를 말해요. 이어서 이 목표가 어떤 로봇을 만드는 것인지 세 가지로 설명해요. ultimate = 궁극적인, 최종의.","c":4},"h":"c8d7becbad"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey have physical disabilities, so they wear and operate robotic parts designed by the developers to help them move.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 신체장애를 가지고 있어서, 그들이 움직이도록 돕기 위해 개발자들에 의해 설계된 로봇 부품을 착용하고 조종한다.","opts":["조종사(선수)들","로봇 개발자들","심판들","의사들"],"r":{"a":"1) 조종사(선수)들","ev":"4~5번 문장","s":[[4,"The athletes are called “pilots.”","선수들은 ‘조종사’라고 불린다."],[5,"They have physical disabilities, so they wear and operate robotic parts designed by the developers to help them move.","그들은 신체장애를 가지고 있어서, 그들이 움직이도록 돕기 위해 개발자들에 의해 설계된 로봇 부품을 착용하고 조종한다."]],"w":"4번에서 선수들은 ‘조종사’라고 불린다고 했고, 바로 이어 5번에서 They로 받아요. 로봇 부품을 '설계한' 사람은 개발자(developers)이고, 착용하는 사람이 They예요.","c":1},"h":"844c38bcca"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"During the competition, pilots have to complete everyday tasks, such as walking up the stairs or hanging the laundry.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"대회 동안, 조종사들은 계단을 걸어 올라가는 것이나 빨래를 너는 것과 같은 일상적인 과제를 완수해야 한다.","opts":["조종사들은 대회 동안 계단과 빨래를 보기만 하면 된다.","조종사들은 대회 전에 일상적인 과제를 연습해야 한다.","조종사들은 계단 오르기나 빨래 널기 같은 일상 과제를 해내야 한다.","조종사들은 어려운 곡예를 해야 한다."],"r":{"a":"3) 조종사들은 계단 오르기나 빨래 널기 같은 일상 과제를 해내야 한다.","ev":"6번 문장","s":[[6,"During the competition, pilots have to complete everyday tasks, such as walking up the stairs or hanging the laundry.","대회 동안, 조종사들은 계단을 걸어 올라가는 것이나 빨래를 너는 것과 같은 일상적인 과제를 완수해야 한다."]],"w":"have to complete는 '완수해야 한다', such as는 '~와 같은'이에요. 대회 중에 계단 오르기, 빨래 널기 같은 일상 과제를 해낸다는 뜻이에요.","c":3},"h":"061c14f415"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["스포츠를 좋아하는 누구나 사이배슬론에 참가할 수 있다.","사이배슬론은 로봇들끼리만 겨루는 대회이다.","사이배슬론은 ‘로봇 올림픽’을 의미한다.","특별히 자격을 갖춘 사람들만 사이배슬론에 참가할 수 있다."],"opts":["Anyone who loves sports can join the Cybathlon.","The Cybathlon is a competition only between robots.","The Cybathlon means “robot Olympics.”","Only specially qualified people can participate in the Cybathlon."],"r":{"a":"4) Only specially qualified people can participate in the Cybathlon.","ev":"1~2번 문장","s":[[1,"Did you know that there is an international sports event that only specially qualified people can participate in?","당신은 특별히 자격을 갖춘 사람들만 참가할 수 있는 국제 스포츠 행사가 있다는 것을 알고 있었는가?"],[2,"It is the Cybathlon, which means “cyborg Olympics.”","그것은 사이배슬론인데, 이는 ‘사이보그 올림픽’을 의미한다."]],"w":"1번에서 특별히 자격을 갖춘 사람만 참가할 수 있다고 했어요. 2번에서 사이배슬론은 ‘사이보그 올림픽’을 의미한다고 했고, 로봇끼리만 겨루는 대회도 아니에요(3~4번).","c":4},"h":"c47820d420"},{"n":9,"t":"sum","q":"The Cybathlon aims to make (A) that move easily and weigh less, and it will help people with (B) in their daily lives.","ko":"사이배슬론은 쉽게 움직이고 더 가벼운 (A)를 만드는 것을 목표로 하고, 일상생활에서 (B)를 가진 사람들을 도울 것이다.","oko":["(A) 조종사 / (B) 메달","(A) 선수 / (B) 빨래","(A) 계단 / (B) 개발자","(A) 개발자 / (B) 과제","(A) 로봇 / (B) 장애"],"opts":["(A) pilots / (B) medals","(A) athletes / (B) laundry","(A) stairs / (B) developers","(A) developers / (B) tasks","(A) robots / (B) disabilities"],"r":{"a":"5) (A) robots / (B) disabilities","ev":"9~10번 문장","s":[[9,"The ultimate goal of the Cybathlon is to make robots that move more easily, weigh less, and have a longer battery life.","사이배슬론의 궁극적인 목표는 더 쉽게 움직이고, 무게가 더 적게 나가고, 더 긴 배터리 수명을 가진 로봇을 만드는 것이다."],[10,"This unique competition will contribute to developing wearable robots to assist people with disabilities in their daily lives.","이 특별한 대회는 장애를 가진 사람들을 일상생활에서 돕는 착용할 수 있는 로봇을 개발하는 것에 기여할 것이다."]],"w":"9번에서 목표가 더 쉽게 움직이고 무게가 덜 나가는 로봇(robots)을 만드는 것이고, 10번에서 장애(disabilities)를 가진 사람들을 일상생활에서 돕는다고 해요.","c":5},"h":"5da1dbf14e"},{"n":10,"t":"fill","q":"The team whose pilot carries out the tasks most [A] and quickly [B].","ko":"조종사가 과제를 가장 [A] 빠르게 수행해내는 팀이 [B].","bank":["successfully","wins","wearable","ultimate","laundry","medals"],"bko":{"successfully":"성공적으로","wins":"이긴다","wearable":"착용할 수 있는","ultimate":"궁극적인","laundry":"빨래","medals":"메달들"},"r":{"a":"[A] successfully, [B] wins","ev":"7번 문장","s":[[7,"The team whose pilot carries out the tasks most successfully and quickly wins.","조종사가 그 과제를 가장 성공적으로 빠르게 수행해내는 팀이 이긴다."]],"w":"7번 문장 The team whose pilot carries out the tasks most successfully and quickly wins에서 가져왔어요. [A]는 quickly와 짝인 부사, [B]는 주어 The team의 동사가 필요해서 나머지 단어들은 들어갈 수 없어요.","c":null},"h":"7670bad381"}]},{"u":3,"id":"hk4-03-4","no":4,"ko":"숨기면 더 보고 싶어! \b","items":[{"n":1,"t":"tf","q":"The picture that more than 420,000 people looked at was of a house on a beach.","ko":"42만 명이 넘는 사람들이 본 사진은 해변에 있는 집의 사진이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It was just a picture of a house on a beach.","그것은 단지 해변에 있는 집의 사진이었다."]],"w":"2번 문장에서 그 사진은 단지 해변에 있는 집의 사진(a picture of a house on a beach)이었다고 해요.","c":"T"},"h":"e6e69dbbe7"},{"n":2,"t":"tf","q":"The aerial pictures were taken to show beautiful beaches to tourists.","ko":"항공사진들은 관광객에게 아름다운 해변을 보여 주기 위해 찍혔다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"They had been taken to record the geological changes of the California coastline.","그것들은 캘리포니아 해안선의 지질학적 변화를 기록하기 위해 찍혔었다."]],"w":"5번 문장에서 사진들은 캘리포니아 해안선의 지질학적 변화를 기록하기 위해(to record the geological changes) 찍혔다고 해요. 관광객 이야기는 없어요.","c":"F"},"h":"070217b6f2"},{"n":3,"t":"tf","q":"After the incident was on the news, millions of people looked up the picture.","ko":"그 사건이 뉴스에 나온 후, 수백만 명의 사람들이 그 사진을 찾아봤다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Soon, millions of people heard about the picture and looked it up on the Internet.","곧, 수백만 명의 사람들이 그 사진에 대해 듣고 그것을 인터넷에서 찾아봤다."]],"w":"11번 문장에서 곧 수백만 명의 사람들이 그 사진에 대해 듣고 인터넷에서 찾아봤다(looked it up)고 해요.","c":"T"},"h":"ea33208ce2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But the photographer repeatedly refused.)","ko":"하지만 사진가는 ( ) 거절했다.","opts":["한 번만","여러 차례","즐겁게","천천히"],"word":"repeatedly","r":{"a":"2) 여러 차례","ev":"8번 문장","s":[[8,"But the photographer repeatedly refused.","하지만 사진가는 여러 차례 거절했다."]],"w":"8번 문장은 사진을 지워 달라는 요청을 사진가가 계속 거절했다는 말이에요. 결국(9번) 소송으로 이어져요. repeatedly = 여러 차례, 되풀이하여.","c":2},"h":"42dd52326c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…she filed a 50-million-dollar lawsuit against him for invading her privacy.)","ko":"…그녀는 그녀의 사생활을 ( ) 것으로 그에게 5천만 달러짜리 소송을 제기했다.","opts":["보호한","공개한","칭찬한","침해한"],"word":"invading","r":{"a":"4) 침해한","ev":"9번 문장","s":[[9,"Eventually, she filed a 50-million-dollar lawsuit against him for invading her privacy.","결국, 그녀는 사생활을 침해한 것으로 그에게 5천만 달러짜리 소송을 제기했다."]],"w":"9번 문장은 사진 때문에 사생활이 침해되었다며 소송을 낸 이유를 말해요. invade = 침해하다, 침입하다.","c":4},"h":"57d630ab33"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey had been taken to record the geological changes of the California coastline.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 캘리포니아 해안선의 지질학적 변화를 기록하기 위해 찍혔었다.","opts":["항공사진들","웹사이트들","지질학자들","해안선들"],"r":{"a":"1) 항공사진들","ev":"4~5번 문장","s":[[4,"In 2003, one website had a collection of over 120,000 aerial pictures.","2003년에, 한 웹사이트에는 12만 개 이상의 항공사진 모음이 있었다."],[5,"They had been taken to record the geological changes of the California coastline.","그것들은 캘리포니아 해안선의 지질학적 변화를 기록하기 위해 찍혔었다."]],"w":"4번에서 웹사이트에 12만 개 이상의 항공사진 모음(aerial pictures)이 있었다고 했어요. 5번의 They had been taken(찍혔었다)는 찍은 대상이므로 항공사진들이에요.","c":1},"h":"7879c6a79f"
