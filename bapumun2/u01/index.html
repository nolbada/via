<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#f4f6f5;--card:#fff;--ink:#16211f;--sub:#5b6b67;--line:#dbe3e0;--a:#1f6f5c;--soft:#e3f2ee;--good:#16a34a;--bad:#dc2626;--hl:#fff1a8;--pen:#d97706}
html,body{background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif;-webkit-text-size-adjust:100%}
main{max-width:560px;margin:0 auto;padding:0 14px 90px}
.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}

.card{background:var(--card);border-radius:18px;border:1px solid var(--line);padding:18px 16px 20px;margin-top:10px}

.ans{margin-top:12px;font-size:19px;font-weight:900;line-height:1.5}

.hl{background:var(--hl);border-radius:4px;padding:0 3px}
.opt{position:relative;margin-top:10px;border-radius:14px;padding:12px 14px;border:1px solid var(--line);background:#fafafa}

.opt.me{background:linear-gradient(135deg,#fee2e2,#fff1f1);border-color:#fca5a5}

.opt .en{font-size:16px;font-weight:900;padding-right:70px;line-height:1.5}
.opt .ko{font-size:14px;color:var(--sub);margin-top:2px}
.opt .rs{margin-top:8px;border-left:4px solid #94a3b8;padding-left:10px;font-size:14.5px;line-height:1.65;color:#334155;word-break:keep-all}
.opt.ok .rs{border-left-color:var(--good)}.opt.me .rs{border-left-color:var(--bad)}
.pen{margin-top:16px;border:2px solid #fcd9a8;background:#fffaf0;border-radius:14px;padding:12px 14px}
.pen .ph{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:900;color:var(--pen)}
.pen svg{width:22px;height:22px}
.pen .pt{margin-top:8px;font-size:17px;line-height:1.7;font-weight:700}
.pen .bl{display:inline-block;min-width:80px;border-bottom:3px solid var(--pen);text-align:center;color:transparent}

.cn{margin-top:12px;display:flex;flex-wrap:wrap;gap:8px}
.cn a{font-size:14px;font-weight:800;color:var(--a);background:var(--soft);border-radius:10px;padding:10px 12px;text-decoration:none;display:inline-block}
.nav{display:flex;gap:8px;margin-top:14px}

.meter{margin-top:8px;font-size:12px;color:var(--sub);font-weight:700}
.sum{margin-top:10px}
.sum h2{font-size:20px;margin-bottom:10px}
.srow{display:flex;justify-content:space-between;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);font-size:16px;font-weight:800}
.srow span{font-size:15px;color:var(--sub)}
.warn{margin-top:14px;padding:12px 14px;border-radius:12px;background:#fff7ed;border:1px solid #fed7aa;font-size:16px;line-height:1.7;font-weight:700}
.note{font-size:13px;color:var(--sub);margin-top:14px;line-height:1.6}

사)이 오는 문장으로 나뉘어요.", "h2": "'나머지 넷과 다른 하나'를 찾는 문제예요. 동사 뒤에 '~을/를'로 해석되는 말이 없고 상태를 설명하는 말이 오는 문장이 있는지 찾아보세요.", "why": "smells good은 '좋은 냄새가 난다'라서 good은 목적어가 아니라 설명하는 말(보어)이에요. 나머지는 모두 동사 뒤에 '~을/를'에 해당하는 목적어가 있어요.", "opts": [{"n": "①", "en": "The soup smells good.", "ko": "그 수프는 좋은 냄새가 난다.", "ok": true, "why": "smells 뒤에 형용사 good이 보어로 와서 2형식이에요."}, {"n": "②", "en": "I read the book yesterday.", "ko": "나는 어제 그 책을 읽었다.", "ok": false, "why": "the book이 목적어인 3형식이에요."}, {"n": "③", "en": "He likes you very much.", "ko": "그는 너를 매우 좋아한다.", "ok": false, "why": "you가 목적어인 3형식이에요."}, {"n": "④", "en": "The store doesn't sell food.", "ko": "그 가게는 음식을 팔지 않는다.", "ok": false, "why": "food가 목적어인 3형식이에요."}, {"n": "⑤", "en": "She plays the guitar very well.", "ko": "그녀는 기타를 매우 잘 친다.", "ok": false, "why": "the guitar가 목적어인 3형식이에요."}], "pencil": "smells good의 good은 목적어가 아니라 ____(보어)이다.", "pencilKey": "보어", "gap": "", "sec": "s3", "page": 14}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "어법상 자연스러운 문장", "type": "mc", "ans": "⑤", "concept": ["028", "029", "017"], "words": [["strangely", "이상하게(부사)"], ["strange", "이상한(형용사)"], ["bring", "가져오다"], ["fans", "팬들"], ["awful", "끔찍한, 안 좋은"], ["should", "~해야 한다"]], "h1": "다섯 문장 중 틀린 문장이 네 개예요. 각 문장마다 sounds 뒤, bring 뒤, made 뒤, There is 뒤를 따로따로 점검하세요.", "h2": "맞는 문장은 하나뿐이에요. ① 감각동사 뒤 자리, ② 전달 대상 앞 전치사, ③ 전치사가 빠졌는지, ④ There is / are 뒤 주어의 수를 하나씩 확인해 보세요.", "why": "feel 뒤에는 형용사 awful이 와서 맞는 문장이에요. 나머지 넷은 부사, 전치사, There 동사에서 각각 하나씩 틀렸어요.", "opts": [{"n": "①", "en": "Your voice sounds strangely.", "ko": "네 목소리가 이상하게 들려.", "ok": false, "why": "sound 뒤에는 부사가 아니라 형용사가 와야 해요. strangely → strange."}, {"n": "②", "en": "Can you bring my pen of me?", "ko": "내 펜 좀 가져다줄래?", "ok": false, "why": "bring은 간접목적어 앞에 to를 써요. of → to."}, {"n": "③", "en": "Nick made some chocolate me.", "ko": "Nick이 내게 초콜릿을 만들어 줬다.", "ok": false, "why": "직접목적어 뒤에 간접목적어를 쓰려면 전치사 for가 필요해요. me → for me."}, {"n": "④", "en": "There is lots of fans around the singer.", "ko": "그 가수 주위에 팬이 많이 있다.", ate", "핫초코"]], "h1": "'알맞지 않은 것'을 찾아요. 다섯 쌍을 각각 보며 ① 두 목적어의 순서가 바뀌었는지 ② 전치사가 동사에 맞는지 확인하세요. 동사부터 적어 보면 쉬워요.", "h2": "teach, tell는 to, make는 for, ask는 of였죠. cook은 이 중 어느 쪽 가족일까요? 요리를 해 주는 동작이 '건네는 방향'인지 '상대를 위한 동작'인지 생각해 보세요.", "why": "cook(요리해 주다)은 make, buy처럼 for를 써요. ②는 to를 써서 틀렸어요.", "opts": [{"n": "①", "en": "Mr. Brown teaches science to us.", "ko": "Brown 선생님은 우리에게 과학을 가르치신다.", "ok": false, "why": "teach는 to라서 맞아요."}, {"n": "②", "en": "My mother cooked lunch to me.", "ko": "어머니는 내게 점심을 요리해 주셨다.", "ok": true, "why": "cook은 for를 써야 해요. to → for."}, {"n": "③", "en": "Amy told an interesting story to me.", "ko": "Amy가 내게 흥미로운 이야기를 해 주었다.", "ok": false, "why": "tell은 to라서 맞아요."}, {"n": "④", "en": "He asked a simple question of me.", "ko": "그는 내게 간단한 질문을 했다.", "ok": false, "why": "ask는 of라서 맞아요."}, {"n": "⑤", "en": "Danny made hot chocolate for me.", "ko": "Danny는 내게 핫초코를 만들어 주었다.", "ok": false, "why": "make는 for라서 맞아요."}], "pencil": "cook은 make, buy와 같이 ____를 쓴다.", "pencilKey": "for", "sec": "s3", "page": 14}, {"id": "S3-09", "step": 3, "no": 9, "qtype": "4형식→3형식 전환 쓰기", "type": "write", "ans": "teaches Spanish to us every Friday", "concept": ["029"], "words": [["teach", "가르치다"], ["Spanish", "스페인어"], ["every Friday", "매주 금요일"]], "h1": "4형식 문장은 '동사 + 사람 + 사물' 순서예요. 3형식으로 바꾸려면 사람과 사물의 순서가 어떻게 되어야 할까요?", "h2": "순서를 바꾼 뒤 사람 앞에 전치사 하나가 필요해요. teach는 to, for, of 중 어느 쪽인지 정하세요. 동사가 3인칭 단수 현재형(teaches)이라는 점은 그대로 유지돼요.", "why": "'us(사람) Spanish(사물)'를 '사물 + to + 사람' 순서로 바꿔요. teach는 to를 써요.", "pencil": "4형식을 3형식으로 바꾸면 동사 + ____ + 전치사 + 사람 순서다", "pencilKey": "사물", "gap": "", "opts": [], "sec": "s3", "page": 15}, {"id": "S3-10", "step": 3, "no": 10, "qtype": "3·4형식 전환 (to / for)", "type": "write", "ans": "to, for", "concept": ["029"], "gap": "", "words": [["wizard", "마법사"], ["old key", "오래된 열쇠"], ["ginger cookies", "생강 쿠키"]], "h1": "두 문장 모두 4형식을 3형식으로 바꾸는 문제예요. 두 동사(gave, made)가 각각 어떤 전치사 가족인지 구분해 보세요.", "h2": "give는 '건네주는' 동사, make는 '만들어 주는' 동사예요. 두 빈칸에 같은 전치사가 들어가지 않는다는 점을 기억하세요.", "why": "give는 to, make는 for를 써요. 그래서 첫 빈칸은 to, 둘째 빈칸은 for가 돼요.", "pencil": "give는 ____ 를 쓰고, make는 for를 쓴다", "pencilKey": "to", "opts": [], "sec": "s3", "page": 15}, {"id": "S3-11", "step": 3, "no": 11, "qtype": "전치사 오류 고치기", "type": "write", "ans": "to → for", "concept": ["029"], "gap": "", "words": [["necklace", "목걸이"], ["beautiful", "아름다운"], ["bought", "샀다(원형 buy 사다)"]], "h1": "이 문장에서 틀린 부분은 사람 앞 전치사예요. bought의 원형이 무엇인지 먼저 생각해 보세요.", "h2": "buy는 make, cook과 같은 가족이에요. 이 가족은 간접목적어 앞에 어떤 전치사를 쓰는지 떠올려 보세요.", "why": "buy는 '상대를 위해 사 주는' 동사라서 for를 써요. to를 쓰면 틀려요.", "pencil": "buy, make, cook, get은 ____를 쓴다.", "pencilKey": "for", "opts": [], "sec": "s3", "page": 15}, {"id": "S3-12", "step": 3, "no": 12, "qtype": "우리말을 영어로 쓰기 (3·4형식)", "type": "write", "ans": "I told Tom my problems. / I told my problems to Tom.", "concept": ["029"], "words": [["tell", "말하다(과거 told)"], ["problem", "문제"]], "h1": "주어진 말은 told, Tom, my problems예요. 4형식(동사 + 사람 + 사물)과 3형식(동사 + 사물 + 전치사 + 사람) 중 어느 쪽으로 써도 돼요. 둘 다 써 보세요.", "h2": "3형식으로 쓸 때는 tell이 어떤 전치사를 쓰는지 기억하세요. 4형식은 전치사 없이 두 목적어를 순서대로 놓으면 돼요.", "why": "4형식은 I told Tom my problems, 3형식은 tell이 to를 쓰므로 I told my problems to Tom이에요.", "pencil": "tell: 4형식 told + 사람 + 사물 / 3형식 told + 사물 + ____ + 사람", "pencilKey": "to", "gap": "", "opts": [], "sec": "s3", "page": 15}, {"id": "S3-13", "step": 3, "no": 13, "qtype": "2형식 보어 오류 고치기", "type": "write", "ans": "badly → bad", "concept": ["028"], "words": [["power", "전기"], ["go out", "(불이) 나가다"], ["refrigerator", "냉장고"], ["go bad", "상하다"], ["went", "갔다(원형 go 가다)"]], "h1": "'milk went ~'에서 went 뒤에는 상태를 설명하는 말이 와요. 전기가 나가서 우유가 어떻게 되었는지 뜻을 생각해 보세요.", "h2": "go가 '~이 되다'의 뜻일 때는 감각동사처럼 뒤에 부사가 아니라 어떤 품사를 쓰는지 떠올려 보세요.", "why": "go bad는 '상하다'라는 뜻이에요. 상태를 설명하는 보어 자리에는 부사가 아닌 형용사 bad를 써요.", "pencil": "go(~이 되다) 뒤에는 ____가 온다.", "pencilKey": "형용사", "gap": "", "opts": [], "sec": "s3", "page": 15}, {"id": "S3-14", "step": 3, "no": 14, "qtype": "우리말을 영어로 쓰기 (감각동사)", "type": "write", "ans": "Your idea sounds interesting.", "concept": ["028"], "words": [["idea", "생각"], ["interesting", "흥미로운"], ["sounds", "들린다(원형 sound ~하게 들리다)"]], "h1": "'네 생각은 흥미롭게 들린다'를 영어 순서로 써 보세요. 주어는 무엇이고 동사는 무엇일까요? '들리다'에 해당하는 동사를 보기에서 먼저 고르세요.", "h2": "'흥미롭게'라는 우리말에 속지 마세요. 감각동사 뒤에는 부사가 아니라 어떤 품사가 와야 하는지 기억하고, like는 필요 없는 문장이에요.", "why": "'들리다'는 sound이고 3인칭 단수라서 sounds로 써요. 뒤에는 형용사 interesting이 와요.", "pencil": "sound + ____ = ~하게 들리다", "pencilKey": "형용사", "gap": "", "opts": [], "sec": "s3", "page": 15}, {"id": "S3-15", "step": 3, "no": 15, "qtype": "대화 속 어법 오류 3군데", "type": "write", "ans": "happily → happy / unhappily → unhappy / proudly → proud", "concept": ["028"], "words": [["quiz", "퀴즈"], ["glad", "기쁜"], ["proud of", "~이 자랑스러운"], ["felt", "느꼈다(원형 feel 느끼다)"]], "h1": "대화에서 부사(-ly)가 쓰인 곳을 먼저 모두 찾아 동그라미 쳐 보세요. 각각의 앞에 어떤 동사(look, feel, be동사)가 있는지 살펴보세요.", "h2": "look, feel, be동사 뒤에는 보어로 형용사나 명사가 와요. -ly 단어 중에서 이 자리에 있어서 틀린 것이 세 개 있어요. 고친 뒤 -ly를 뺀 형용사로 쓰면 돼요.", "why": "look, felt, am 뒤는 모두 보어 자리예요. 보어에는 부사를 못 쓰니까 -ly를 빼고 형용사로 고쳐요.", "pencil": "look / feel / be동사 뒤 보어에는 ____를 쓴다.", "pencilKey": "형용사", "gap": "", "opts": [], "sec": "s3", "page": 15}, {"id": "S4-01", "step": 4, "no": 1, "qtype": "4형식→3형식 전치사 묶기", "type": "mc", "ans": "①, ②", "concept": ["029"], "gap": "", "words": [["Christmas present", "크리스마스 선물"], ["report", "보고서"], ["truth", "진실"], ["backpack", "배낭"]], "h1": "<보기> 문장의 빈칸에는 전치사가 들어가요. 먼저 보기 문장의 동사(gave)가 어떤 전치사를 쓰는지 정하세요. 그다음 ①~⑤ 동사를 하나씩 같은 방법으로 판단해 보세요. 답이 두 개예요.", "h2": "gave와 같은 전치사를 쓰는 동사만 고르면 돼요. show, tell은 어느 쪽? make, buy는 어느 쪽? ask는 어느 쪽인지 하나씩 나눠 보세요.", "why": "보기의 give는 to를 써요. show, tell도 to라서 ①, ②가 같아요. make, buy는 for, ask는 of라서 달라요.", "opts": [{"n": "①", "en": "I showed the report (to) her.", "ko": "나는 그녀에게 보고서를 보여 주었다.", "ok": true, "why": "show는 to를 써요."}, {"n": "②", "en": "He told the truth (to) his father.", "ko": "그는 아버지께 진실을 말씀드렸다.", "ok": true, "why": "tell은 to를 써요."}, {"n": "③", "en": "Yunji made a doll (for) her sister.", "ko": "윤지는 동생에게 인형을 만들어 주었다.", "ok": false, "why": "make는 for라서 보기와 달라요."}, {"n": "④", "en": "Mom bought a backpack (for) me.", "ko": "엄마는 내게 배낭을 사 주셨다.", "ok": false, "why": "buy는 for라서 보기와 달라요."}, {"n": "⑤", "en": "William asked a question (of) her teacher.", "ko": "William은 그녀의 선생님께 질문을 했다.", "ok": false, "why": "ask는 of라서 보기와 달라요."}], "pencil": "to를 쓰는 동사: give, show, ____, send, lend", "pencilKey": "tell", "sec": "s4", "page": 16}, {"id": "S4-02", "step": 4, "no": 2, "qtype": "긴 글 속 어법 선택 (A)(B)(C)", "type": "mc", "ans": "③", "concept": ["028", "003", "029-2", "029-3"], "gap": "", "words": [["witty", "재치 있는"], ["cheerful", "쾌활한"], ["full of", "~로 가득 찬"], ["matter", "중요하다"], ["irrelevant", "관계없는"], ["looks at", "~을 쳐다보다"]], "h1": "세 칸을 따로 풀어 보세요. (A) look과 look at 중 뒤에 형용사가 이어지는 쪽, (B) 동사 smiles를 꾸미는 말은 형용사일까 부사일까, (C) matter 뒤에 목적어가 붙을 수 있을까를 확인하세요.", "h2": "(A) very young 앞에는 '~하게 보이다'가 필요해요. (B) smiles는 동작이니까 어떤 품사로 꾸밀까요? (C) matter는 '문제가 되다, 중요하다'로 목적어 없이 쓰는 동사예요.", "why": "(A) 뒤에 형용사 young이 있으니 looks, (B) 동사 smile을 꾸미니까 brightly, (C) matter는 목적어를 안 받으니 matters가 맞아요.", "opts": [{"n": "①", "en": "looks - bright - matters", "ko": "", "ok": false, "why": "(B)에는 smiles를 꾸미는 부사 brightly가 와야 해요."}, {"n": "②", "en": "looks - bright - matters him", "ko": "", "ok": false, "why": "(B)가 bright라서 틀리고, (C)에 목적어 him이 있어서도 틀려요."}, {"n": "③", "en": "looks - brightly - matters", "ko": "", "ok": true, "why": "세 칸 모두 맞아요."}, {"n": "④", "en": "looks at - bright - matters him", "ko": "", "ok": false, "why": "(A) looks at 뒤에 형용사가 올 수 없고 (B)(C)도 틀려요."}, {"n": "⑤", "en": "looks at - brightly - matters him", "ko": "", "ok": false, "why": "(A) looks at이 틀리고, (C)의 목적어 him도 틀려요."}], "pencil": "smile처럼 동작을 꾸미는 말은 형용사가 아니라 ____이다.", "pencilKey": "부사", "sec": "s4", "page": 16}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "형용사 / 부사 변형하기", "type": "write", "ans": "careful / carefully", "concept": ["028", "028-2"], "gap": "", "words": [["care", "조심, 조심하다"], ["driver", "운전자"], ["drives", "운전한다(원형 drive 운전하다)"]], "h1": "두 빈칸이 각각 무엇을 꾸미는지 먼저 function cockLink(c){return COCK+"?c="+encodeURIComponent(c)+"&back="+encodeURIComponent(location.href.split("#")[0])}
function useHint(id,l){var r=rec(id);if((r.h||0)<l)r.h=l;sv();render()}
function tog(id,l){var r=rec(id);r.sel=r.sel||[];var i=r.sel.indexOf(l);if(i>=0)r.sel.splice(i,1);else r.sel.push(l);sv();render()}
function confirmMulti(id){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);var a=d.ans.split(",").map(function(s){return s.trim()}).sort().join(","),s=(r.sel||[]).slice().sort().join(",");if(!s)return;r.pick=s;r.done=true;r.right=(a===s);sv();render()}
function pick(id,l){var d=DATA.filter(function(x){return x.id===id})[0],r=rec(id);r.pick=l;r.done=true;r.right=(l===d.ans);sv();render()}
function showW(id){var r=rec(id);r.done=true;r.right=null;r.wr=true;sv();render()}
function selfW(id,v){var r=rec(id);r.right=v;sv();render()}
function penDone(id){var r=rec(id);r.pen=true;sv();render()}
function answerView(d,r){
 var h="";
 if(d.type==="mc"){
  h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'정답이에요':'아쉬워요, 정답은 '+esc(d.ans)+'번')+'</div>';
  h+='<div class="why">'+hl(d.why)+'</div>';
  d.opts.forEach(function(o){
   var chosen=(r.pick||'').split(',').indexOf(o.n)>=0,cls=o.ok?'ok':(chosen?'me':''),bd=o.ok?'정답':(chosen?'내가 고름':'');
   h+='<div class="opt '+cls+'">'+(bd?'<span class="bd">'+bd+'</span>':'')+'<div class="en">'+esc(o.n)+' '+esc(o.en)+'</div><div class="ko">'+esc(o.ko)+'</div><div class="rs">'+hl(o.why)+'</div></div>'});
 }else{
  h+='<div class="ans">정답 · '+esc(d.ans)+'</div><div class="why">'+hl(d.why)+'</div>';
  if(r.right===null||r.right===undefined){
   h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
