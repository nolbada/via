rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"When you watches a movie, what do you pay attention to? The story, the actors, or the music? What about the sounds?","ko":"당신은 영화를 볼 때 무엇에 주목하나요? 줄거리, 배우, 아니면 음악? 소리는 어떤가요?","ok":false,"foot":[],"fixes":[{"wrong":"watches","right":"watch","partial":false,"at":[2],"point":"수일치: 주어 you는 3인칭 단수가 아니므로 동사원형 watch 사용","topic":"수일치","memo":"주어 you는 3인칭 단수가 아니므로 동사원형 watch 사용"}]},{"n":2,"tag":null,"en":"Last week, I had a short interview with Emma Han, a famous Foley artist.","ko":"지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다.","ok":true,"foot":["1Foley artist 폴리 아티스트(영화 음향효과를 만드는 전문가)"],"fixes":[]},{"n":3,"tag":"질문 1","en":"Hello, Ms. Han. Can you say me about your job?","ko":"안녕하세요, Han 선생님. 당신의 직업에 관해 말해 주시겠어요?","ok":false,"foot":[],"fixes":[{"wrong":"say","right":"tell","partial":false,"at":[5],"point":"4형식(수여동사): say는 4형식으로 쓸 수 없고, '~에게 말해주다'는 tell + 목적어 사용","topic":"4형식(수여동사)","memo":"say는 4형식으로 쓸 수 없고, '~에게 말해주다'는 tell + 목적어 사용"}]},{"n":4,"tag":"Emma Han","en":"Sure! Foley artists create various sounds for movies because actual sounds is not enough clear for movie scenes.","ko":"그러죠! 폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[11],"point":"수일치: 주어 sounds(복수)에 맞춰 동사 are 사용","topic":"수일치","memo":"주어 sounds(복수)에 맞춰 동사 are 사용"},{"wrong":"enough clear","right":"clear enough","partial":false,"at":[13],"point":"어순: enough는 형용사 뒤에 위치하므로 clear enough","topic":"어순","memo":"enough는 형용사 뒤에 위치하므로 clear enough"}]},{"n":5,"tag":null,"en":"Let's saying there's a rainy scene.","ko":"비 오는 장면이 있다고 가정해 봅시다.","ok":false,"foot":[],"fixes":[{"wrong":"saying","right":"say","partial":false,"at":[1],"point":"Let's 뒤에는 동사원형 사용 (Let's + 동사원형)","topic":"Let's 뒤에는 동사원형 사용 (Let's + 동사원형)","memo":""}]},{"n":6,"tag":null,"en":"The actual sounds of rain are too soft, so we has to make rain sounds and add them to the scene.","ko":"실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해 ing)","memo":""},{"wrong":"shell","right":"shells","partial":false,"at":[12],"point":"어휘/수일치: coconut shells는 두 개이므로 복수형 shells 사용","topic":"어휘/수일치","memo":"coconut shells는 두 개이므로 복수형 shells 사용"}]},{"n":12,"tag":"질문 3","en":"How interesting! What can we do to becoming a Foley artist?","ko":"정말 흥미롭네요! 우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?","ok":false,"foot":[],"fixes":[{"wrong":"becoming","right":"become","partial":false,"at":[7],"point":"to부정사: to 뒤에는 동사원형 사용 (to become)","topic":"to부정사","memo":"to 뒤에는 동사원형 사용 (to become)"}]},{"n":13,"tag":"Emma Han","en":"You can just start by playing with sounds.","ko":"여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요.","ok":true,"foot":[],"fixes":[]},{"n":14,"tag":null,"en":"You doesn't have to use special tools to make different sounds.","ko":"다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.","ok":false,"foot":[],"fixes":[{"wrong":"doesn't","right":"don't","partial":false,"at":[1],"point":"조동사 have to: 주어 You에는 don't have to 사용","topic":"조동사 have to","memo":"주어 You에는 don't have to 사용"}]},{"n":15,"tag":null,"en":"Just try with everyday objects. Hits your desk with a pen and then with a pencil.","ko":"그냥 일상적인 물건들로 시도해 보세요. 책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요.","ok":false,"foot":[],"fixes":[{"wrong":"Hits","right":"Hit","partial":false,"at":[5],"point":"명령문은 동사원형으로 시작 (Hit)","topic":"명령문은 동사원형으로 시작 (Hit)","memo":""}]},{"n":16,"tag":null,"en":"The two sounds is not same.","ko":"이 두 가지 소리는 같지 않아요.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[3],"point":"수일치: 주어 sounds(복수)에 맞춰 동사 are 사용","topic":"수일치","memo":"주어 sounds(복수)에 맞춰 동사 are 사용"},{"wrong":"same","right":"the same","partial":false,"at":[5],"point":"관용표현: '같다'는 정관사를 붙여 the same으로 사용","topic":"관용표현","memo":"'같다'는 정관사를 붙여 the same으로 사용"}]},{"n":17,"tag":null,"en":"You should pay attention more to every sound around you.","ko":"여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다.","ok":false,"foot":[],"fixes":[{"wrong":"attention more","right":"more attention","partial":false,"at":[3],"point":"비교급: mor  너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요.",0],["Q. How do you make sounds?","질문: 어떻게 소리를 만드나요?",1],["I use all kinds of everyday objects in fun and creative ways.","저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다.",1],["For example, I fry bacon to create rain sounds.","예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요.",0],["For the sounds of ice skating, I move a pair of scissors across a desk.","얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요.",0],["To make the sounds of a horse walking, I hit two coconut shells together.","말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.",0],["Q. How interesting!","질문: 정말 흥미롭네요!",1],["What can we do to become a Foley artist?","우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?",0],["You can just start by playing with sounds.","여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요.",1],["You don’t have to use special tools to make different sounds.","다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요.",0],["Just try with everyday objects.","그냥 일상적인 물건들로 시도해 보세요.",0],["Hit your desk with a pen and then with a pencil.","책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요.",0],["The two sounds are not the same.","이 두 가지 소리는 같지 않아요.",0],["You should pay more attention to every sound around you.","여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다.",0],["Then, you can find new ways of creating sounds.","그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.",0],["Q. It sounds like an interesting job.","질문: 흥미로운 직업 같아요.",1],["Thank you for the interview, Ms. Han.","인터뷰해 주셔서 감사합니다, Han 선생님.",0],["Thank you for having me.","저를 인터뷰해 주셔서 감사합니다.",1]];var RNUM=77;var TITLE_EN="Behind Movie Sounds";var PASS_EN=["Behind Movie Sounds","Interview with Emma Han","When you watch a movie, what do you pay attention to? The story, the actors, or the music? What about the sounds? Last week, I had a short interview with Emma Han, a famous Foley artist.","Q. Hello, Ms. Han. Can you tell me about your job?","Sure! Foley artists create various sounds for movies because actual sounds are not clear enough for movie scenes. Let’s say there’s a rainy scene. The actual sounds of rain are too soft, so we have to make rain sounds and add them to the scene.","Q. How do you make sounds?","I use all kinds of everyday objects in fun and creative ways. For example, I fry bacon to create rain sounds. For the sounds of ice skating, I move a pair of scissors across a desk. To make the sounds of a horse walking, I hit two coconut shells together.","Q. How interesting! What can we do to become a Foley artist?","You can just start by playing with sounds. You don’t have to use special tools to make different sounds. Just try with everyday objects. Hit your desk with a pen and then with a pencil. The two sounds are not the same. You should pay more attention to every sound around you. Then, you can find new ways of creating sounds.","Q. It sounds like an interesting job. Thank you for the interview, Ms. Han.","Thank you for having me."];var PASS_KO=["영화 음향의 뒤에서","- Emma Han과의 인터뷰","당신은 영화를 볼 때 무엇에 주목하나요? 줄거리, 배우, 아니면 음악? 소리는 어떤가요? 지난주에 저는 유명한 폴리 아티스트인 Emma Han과 짧은 인터뷰를 가졌습니다.","질문: 안녕하세요, Han 선생님. 당신의 직업에 관해 말해 주시겠어요?","그러죠! 폴리 아티스트는 실제 소리들이 영화 장면에 충분히 분명하지 않기 때문에 영화의 다양한 소리를 만들어요. 비 오는 장면이 있다고 가정해 봅시다. 실제 빗소리는 너무 부드러워서 우리는 빗소리를 만들어서 그 장면에 그것을 추가해야 해요.","질문: 어떻게 소리를 만드나요?","저는 모든 종류의 일상의 물건들을 재미있고 창의적인 방법으로 사용합니다. 예를 들어, 빗소리를 만들어 내기 위해서 베이컨을 튀겨요. 얼음 위에서 스케이트 타는 소리를 위해서는 책상을 가로질러 가위를 움직여요. 말이 걷는 소리를 만들기 위해서는 코코넛 껍질 두 개를 맞부딪치죠.","질문: 정말 흥미롭네요! 우리는 폴리 아티스트가 되기 위해서 무엇을 할 수 있을까요?","여러분은 그저 소리를 가지고 노는 것으로 시작할 수 있어요. 다양한 소리를 만들기 위해서 특별한 도구를 사용할 필요는 없어요. 그냥 일상적인 물건들로 시도해 보세요. 책상을 펜으로 쳐 보고 그 다음에는 연필로 쳐 보세요. 이 두 가지 소리는 같지 않아요. 여러분 주변의 모든 소리에 더 많이 귀를 기울여야 합니다. 그러면 여러분은 소리를 창조해 내는 새로운 방법들을 찾을 수 있을 거예요.","질문: 흥미로운 직업 같아요. 인터뷰해 주셔서 감사합니다, Han 선생님.","저를 인터뷰해 주셔서 감사합니다."];var DLG=[["B","That’s a great drawing, Harin. You look like a designer.","정말 멋진 그림이야, 하린아. 너 디자이너 같아 보여."],["G","Thanks! My dream is to become a fashion designer. I want to have my own show in Paris.","고마워! 내 꿈은 패션 디자이너가 되는 거야. 나는 파리에서 내 쇼를 열고 싶어."],["B","That’s a great dream.","멋진 꿈이다."],["G","What about you, Jake? What do you wa function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}

  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
