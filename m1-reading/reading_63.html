은 우스꽝스럽게 생긴 과일과 채소를 위한 특별한 시장입니다. 그들은 서로에게 인사하며 이야기를 시작합니다.","사과: 정말 좋은 날이야! 나는 내 껍질에 점이 많아서 이곳에 왔어. 사람들은 내가 맛없다고 생각해. 그들은 틀렸어! 내 점은 해롭지 않아. 나는 맛이 훌륭해.","키위: 나는 둥글지만 아주 작아. 농부들은 내 크기 때문에 나를 팔고 싶어 하지 않아. 크기가 무슨 상관이야? 나는 달콤하고 맛있는걸.","당근: 내 다리가 세 개인 것이 보이니? 내 뿌리가 포크처럼 생겼기 때문에 나는 우스꽝스러워 보여. 나는 그저 땅속에서 돌을 피하려 했는데 다리가 세 개로 자랐어. 나는 신선하고, 건강에 좋은 주스를 만들어.","사과: 모두 만나서 반가워! 나는 우리와 같은 더 많은 과일과 채소들을 만나고 싶어. 너 아는 친구 있니?","키위: 가지들은 어때? 어떤 가지들은 너무 많이 휘어 있어. 사람들이 곧은 가지를 좋아하기 때문에 슈퍼마켓은 그들을 팔지 않아.","당근: 우스꽝스럽게 생긴 감자들도 있어. 그들의 모양은 특이하고, 크기도 모두 달라. 사람들은 그들을 쓸모없다고 여겨.","키위: 나도 알아, 하지만 우스꽝스럽게 생긴 감자들이 훌륭한 감자칩을 만든다고 들었어.","당근: 그거 사실이야? 정말 멋진데! 나는 사람들이 우리에 대해 더 많이 알기를 희망해.","사과: 나도 그러길 바라. 봐, 친구들! 사람들이 오고 있어. 그들을 환영하자."];var DG=[{"qs":[{"n":1,"q":"What is Annie going to drink?","o":["kiwi juice","apple juice","strawberry juice","orange juice","carrot juice"],"a":2,"ans":"strawberry juice","evs":[["I'd like to try the strawberry juice.","나는 딸기 주스를 마셔 보고 싶어."],["I'm going to have the kiwi juice. How about you, Annie?","나는 키위 주스를 마실 거야. 너는 어때, Annie?"]],"ev":["I'd like to try the strawberry juice.","나는 딸기 주스를 마셔 보고 싶어."],"ow":["오답 ✕ — 'I'm going to have the kiwi juice.'(나는 키위 주스를 마실 거야.)라고 한 사람은 Brad이다. Annie가 아니라서 틀림.","오답 ✕ — 대화에는 사과 주스가 나오지 않는다. Annie는 'I'd like to try the strawberry juice.'(나는 딸기 주스를 마셔 보고 싶어.)라고 했다.","정답 ○ — Brad가 'How about you, Annie?'(너는 어때, Annie?)라고 묻자 Annie는 'I'd like to try the strawberry juice.'(나는 딸기 주스를 마셔 보고 싶어.)라고 답했다.","오답 ✕ — 대화에는 오렌지 주스가 나오지 않는다. Annie가 고른 것은 'the strawberry juice'(딸기 주스)이다.","오답 ✕ — 대화에는 당근 주스가 나오지 않는다. Annie가 고른 것은 'the strawberry juice'(딸기 주스)이다."],"memo":["정답 ③: Annie는 딸기 주스를 마실 것이다.","근거: I'd like to try the strawberry juice.(나는 딸기 주스를 마셔 보고 싶어.)","함정: ①은 Brad가 고른 주스(kiwi)라서 ✕"],"why":"Annie는 딸기 주스를, Brad는 키위 주스를 마실 것이다."},{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Brad와 Annie 둘 다 목이 마르다.","Brad와 Annie는 다른 종류의 주스를 마실 것이다.","Brad와 Annie는 총 8달러를 지불할 것이다.","Brad와 Annie는 주스 가격을 할인받을 수 있다.","Brad와 Annie는 둘 다 컵을 가져왔다."],"a":2,"ans":"Brad와 Anni ":["Why don't we join Class 1?","우리 1반에 참가하는 게 어때?"],"ow":["정답 ○ — 'Why don't we join Class 1?'(우리 1반에 참가하는 게 어때?)에 'That's a good idea.'(좋은 생각이야.)라고 답했으므로 대화 후에 1반 수업을 들을 것이다.","오답 ✕ — 'We can use an old T-shirt.'(우리는 낡은 티셔츠를 쓸 수 있어.)라고 했으므로 티셔츠를 사는 것이 아니라 이미 있는 것을 쓴다. 그래서 틀림.","오답 ✕ — 'we can make a bag in Class 1'(1반에서는 가방을 만들 수 있어)이라고 했으므로 새 가방을 사는 것이 아니라 만든다. 그래서 틀림.","오답 ✕ — 'We can use an old T-shirt.'(우리는 낡은 티셔츠를 쓸 수 있어.)에서 티셔츠는 파는 것이 아니라 재료로 쓰는 것이라서 틀림.","오답 ✕ — 동전 지갑은 'Class 2'(2반)에서 만든다. 두 사람은 1반을 고르므로 동전 지갑을 만드는 것이 아니라서 틀림."],"memo":["정답 ①: 두 사람은 1반 수업을 들을 것이다.","근거: Why don't we join Class 1?(우리 1반에 참가하는 게 어때?) — That's a good idea.(좋은 생각이야.)","함정: ⑤ 동전 지갑은 2반이라서 ✕"],"why":"두 사람은 낡은 티셔츠로 가방을 만드는 1반에 참가하기로 했다."}],"dlg":[["G","Look! There are classes today.","봐! 오늘 수업들이 있어."],["B","Oh, we can make a bag in Class 1, and we can make a coin purse in Class 2.","오, 1반에서는 가방을 만들 수 있고, 2반에서는 동전 지갑을 만들 수 있어."],["G","Why don't we join Class 1?","우리 1반에 참가하는 게 어때?"],["B","That's a good idea. We can use an old T-shirt.","좋은 생각이야. 우리는 낡은 티셔츠를 쓸 수 있어."]]},{"qs":[{"n":4,"q":"What does the girl want to do?","o":["She wants to make a bag.","She wants to sell some almonds.","She wants to cook with almonds.","She wants to get some almonds for free.","She wants to buy 200 grams of almonds."],"a":4,"ans":"She wants to buy 200 grams of almonds.","evs":[["Excuse me. I'd like to buy some almonds.","실례합니다. 아몬드를 좀 사고 싶어요."],["I'd like to have 200 grams, please.","200그램 주세요."]],"ev":["Excuse me. I'd like to buy some almonds.","실례합니다. 아몬드를 좀 사고 싶어요."],"ow":["오답 ✕ — 'Did you bring a bag?'(가방은 가져오셨나요?)에 'Yes.'라고 한 것은 아몬드를 담을 가방이다. 가방을 만들고 싶다는 말은 없어서 틀림.","오답 ✕ — 소녀는 'I'd like to buy some almonds.'(아몬드를 좀 사고 싶어요.)라고 했으므로 파는 것이 아니라 사는 것이라서 틀림.","오답 ✕ — 아몬드로 요리를 한다는 말은 없다. 소녀는 'I'd like to buy some almonds.'(아몬드를 좀 사고 싶어요.)라고만 했다.","오답 ✕ — 소녀는 'I'd like to have 200 grams, please.'(200그램 주세요.)라고 했고 값을 내지 않는다는 말은 없다. 공짜로 받는다는 보기는 틀림.","정답 ○ — 'I'd like to buy some almonds.'(아몬드를 좀 사고 싶어요. 나무 칫솔로 할게요. 저는 플라스틱 쓰레기를 줄이려고 노력하고 있어요."],["W","That's a good idea. Here you go.","좋은 생각이에요. 여기 있어요."],["G","Thanks.","고맙습니다."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["Popular Fruits","Ugly, But Tasty","Small Fruits Are Delicious","Why Do Apples Have Spots?","Which is Tastier, an Apple or a Kiwi?"],"a":1,"ans":"Ugly, But Tasty","evs":[["Apple: I'm here because I have many spots on my skin.","사과: 나는 내 껍질에 점이 많아서 이곳에 왔어."],["Kiwi: I'm round but very small.","키위: 나는 둥글지만 아주 작아."],["I'm sweet and delicious.","나는 달콤하고 맛있는걸."]],"ev":["Apple: I'm here because I have many spots on my skin.","사과: 나는 내 껍질에 점이 많아서 이곳에 왔어."],"ow":["오답 ✕ — 'People think that I'm tasteless.'(사람들은 내가 맛없다고 생각해.)라고 했듯이 이 과일들은 인기 있는 과일이 아니라서 틀림.","정답 ○ — 사과는 점이 많고 키위는 작지만 'I taste great.'(나는 맛이 훌륭해.), 'I'm sweet and delicious.'(나는 달콤하고 맛있는걸.)라고 하므로 못생겼지만 맛있다는 제목이 알맞다.","오답 ✕ — 'I'm sweet and delicious.'(나는 달콤하고 맛있는걸.)는 키위 이야기뿐이고 사과 이야기도 있으므로 작은 과일만 맛있다는 제목은 너무 좁아 틀림.","오답 ✕ — 사과가 점이 있다는 말은 나오지만 이유를 설명하는 글이 아니다. 'My spots are not harmful.'(내 점은 해롭지 않아.)이라고 했을 뿐이라서 틀림.","오답 ✕ — 사과와 키위가 서로 맛을 비교하는 장면은 없다. 사과는 'I taste great.'(나는 맛이 훌륭해.), 키위는 'I'm sweet and delicious.'(나는 달콤하고 맛있는걸.)라고 각자 말할 뿐이라서 틀림."],"memo":["정답 ②: Ugly, But Tasty(못생겼지만 맛있다)","근거: My spots are not harmful. I taste great.(내 점은 해롭지 않아. 나는 맛이 훌륭해.)","함정: ③ 키위뿐 아니라 사과도 나오므로 너무 좁다"],"why":"겉모습은 못생겼지만 맛은 훌륭하다는 사과와 키위의 이야기이다."},{"n":7,"q":"Why don't farmers want to sell Kiwi?","o":["because it is too sweet","because it has many spots","because of its small size","because it is not fresh","because it tastes bad"],"a":2,"ans":"because of its small size","evs":[["Kiwi: I'm round but very small.","키위: 나는 둥글지만 아주 작아."],["Farmers don't want to sell me because of my size.","농부들은 내 크기 때문에 나를 팔고 싶어 하지 않아."]],"ev":["Kiwi: I'm round but very small.","키위: 나는 둥글지만 아주 작아."],"ow":["오답 ✕ — 키위는 'I'm sweet and delicious.'(나는 달콤하고 맛있는걸.)라고 했다. 달다는 것은 팔지 않는 이유가 아니라서 틀림.","오답 ✕ — 점이 많은 것은 사과이다. 'I have many spots on my skin.'(나는 내 껍질에 점이 많아.)은 Appl setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m1-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
