<!doctype html>
<html lang="ko">
<head>

<title>리딩튜터 주니어 1 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>

<script>
var P=[{"u":1,"id":"rj1-01-1","no":1,"ko":"하와이안 피자의 진실","items":[{"n":1,"t":"tf","q":"Sam Panopoulos made the first Hawaiian pizza in 1962.","ko":"Sam Panopoulos는 1962년에 최초의 하와이안 피자를 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"A man named Sam Panopoulos made the first Hawaiian pizza in 1962.","Sam Panopoulos라는 이름의 한 남자가 1962년에 최초의 하와이안 피자를 만들었다."]],"w":"6번 문장에서 A man named Sam Panopoulos가 1962년에 최초의 하와이안 피자를 만들었다고 해요. 그대로 일치해요.","c":"T"},"h":"0ef1ef8c3b"},{"n":2,"t":"tf","q":"Hawaiian pizza became popular slowly.","ko":"하와이안 피자는 서서히 인기를 얻었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"It quickly became popular.","그것은 빠르게 인기를 얻었다."]],"w":"11번 문장에서 It quickly became popular(빠르게 인기를 얻었다)라고 해요. 서서히 얻었다는 말은 반대예요.","c":"F"},"h":"83349fd137"},{"n":3,"t":"tf","q":"Panopoulos tried many different toppings.","ko":"Panopoulos는 많은 다른 토핑을 시도했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"He tried many different toppings.","그는 많은 다른 토핑을 시도했다."]],"w":"8번 문장에 He tried many different toppings라고 그대로 나와요.","c":"T"},"h":"2650f8ebb1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It may sound strange, but many people love pineapple on their pizza.)","ko":"그것은 ( ) 이야기처럼 들릴지도 모르지만, 많은 사람들은 그들의 피자 위에 놓인 파인애플을 좋아한다.","opts":["평범한","맛있는","이상한","유명한"],"word":"strange","r":{"a":"3) 이상한","ev":"3번 문장","s":[[3,"It may sound strange, but many people love pineapple on their pizza.","이상하게 들릴지도 모르지만, 많은 사람들은 그들의 피자 위에 놓인 파인애플을 좋아한다."]],"w":"3번 문장은 but으로 이어져요. 뒤에서 '그래도 많은 사람들이 좋아한다'고 하니 앞에는 이상하게 들린다는 말이 와야 자연스러워요. sound strange = 이상하게 들리다.","c":3},"h":"1505d7aa4f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (“Hawaiian” was the name of the canned pineapples he used.)","ko":"‘하와이안’이 그가 사용했던 ( ) 파인애플의 이름이었다.","opts":["통조림으로 된","신선한","얼린","말린"],"word":"canned","r":{"a":"1) 통조림으로 된","ev":"13번 문장","s":[[13,"“Hawaiian” was the name of the canned pineapples he used.","‘하와이안’이 그가 사용했던 파인애플 통조림의 이름이었다."]],"w":"13번 문장은 Hawaiian이 어떤 파인애플의 이름이었는지 말해요. canned는 통조림으로 된이라는 뜻이고, 파인애플 통조림의 이름이 하와이안 피자라는 이름이 되었어요.","c":1},"h":"e62d904554"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt's called Hawaiian pizza.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 하와이안 피자라고 불린다.","opts":["파인애플","파인애플을 올린 피자","캐나다","햄"],"r":{"a":"2) 파인애플을 올린 피자","ev":"3~4번 문장","s":[[3,"It may sound strange, but many people love pineapple on their pizza.","이상하게 들릴지도 모르지만, 많은 사람들은 그들의 피자 위에 놓인 파인애플을 좋아한다."],[4,"It’s called Hawaiian pizza.","그것은 하와이안 피자라고 불린다."]],"w":"3번에서 피자 위에 파인애플을 올린 이야기를 하고, 4번에서 그것을 Hawaiian pizza라고 불러요. 파인애플 자체가 아니라 파인애플을 올린 피자예요.","c":2},"h":"1126d4a6d5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Why don't you give it a try?\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"한번 시도해 보는 건 어떨까?","opts":["너는 왜 그것을 시도하지 않았는지 설명해라.","그것은 시도해 볼 가치가 없다.","그것을 시도해 볼 수 있는 사람은 없다.","한번 시도해 보는 건 어떨까?"],"r":{"a":"4) 한번 시도해 보는 건 어떨까?","ev":"14번 문장","s":[[14,"Why don’t you give it a try?","한번 시도해 보는 건 어떨까?"]],"w":"Why don't you ~?는 이유를 묻는 말이 아니라 '~해 보는 건 어떨까?'라고 권하는 표현이에요. give it a try는 한번 시도해 보다라는 뜻이에요.","c":4},"h":"caac0063af"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["하와이안 피자는 처음에 하와이에서 만들어졌다.","Panopoulos는 1926년에 최초의 하와이안 피자를 만들었다.","고기와 채소와 같은 많은 피자 토핑이 있다.","Panopoulos는 하와이의 유명한 해변의 이름을 따서 피자 이름을 지었다."],"opts":["Hawaiian pizza was first made in Hawaii.","Panopoulos made the first Hawaiian pizza in 1926.","There are many pizza toppings like meat and vegetables.","Panopoulos named the pizza after a famous beach in Hawaii."],"r":{"a":"3) There are many pizza toppings like meat and vegetables. (고기와 채소와 같은 많은 피자 토핑이 있다.)","ev":"1번 문장","s":[[1,"There are many pizza toppings like meat and vegetables.","고기와 채소와 같은 많은 피자 토핑이 있다."]],"w":"1번 There are many pizza toppings like meat and vegetables(고기와 채소와 같은 많은 피자 토핑이 있다)와 같아요. 하와이안 피자는 하와이가 아니라 캐나다에서 처음 만들어졌고, 1962년이며, 이름은 파인애플 통조림 이름에서 왔어요.","c":3},"h":"5cb28ccc1c"},{"n":9,"t":"sum","q":"Hawaiian pizza was created in (A). Its maker got the idea from the sweet and spicy flavors of (B) food.","ko":"하와이안 피자는 (A)에서 만들어졌다. 만든 사람은 달콤하고 양념 맛이 강한 (B) 음식의 맛에서 아이디어를 얻었다.","oko":["(A) 하와이 / (B) 중국","(A) 캐나다 / (B) 이탈리아","(A) 하와이 / (B) 이탈리아","(A) 중국 / (B) 하와이","(A) 캐나다 / (B) 중국"],"opts":["(A) Hawaii / (B) Chinese","(A) Canada / (B) Italian","(A) Hawaii / (B) Italian","(A) China / (B) Hawaiian","(A) Canada / (B) Chinese"],"r":{"a":"5) (A) Canada / (B) Chinese","ev":"5, 7번 문장","s":[[5,"However, it was created in Canada, not Hawaii.","그러나 그것은 하와이가 아닌 캐나다에서 만들어졌다."],[7,"He got the idea from the sweet and spicy flavors of Chinese food.","그는 중국 음식의 달콤하고 양념 맛이 강한 맛으로부터 아이디어를 얻었다."]],"w":"5번에서 하와이가 아닌 캐나다에서 만들어졌다고 하고, 7번에서 중국 음식의 맛에서 아이디어를 얻었다고 해요. 그래서 (A)는 Canada, (B)는 Chinese예요.","c":5},"h":"25bf834b44"},{"n":10,"t":"fill","q":"Finally, Panopoulos [A] pineapple and ham and [B] them to his pizza.","ko":"마침내 Panopoulos는 파인애플과 햄을 [A] 그것들을 그의 피자에 [B].","bank":["chose","added","called","became","decided","arrived"],"bko":{"chose":"고르다(골랐다)","added":"추가하다(추가했다)","called":"부르다(불렀다)","became":"되다(되었다)","decided":"결심하다(결심했다)","arrived":"도착하다(도착했다)"},"r":{"a":"[A] chose, [B] added","ev":"9~10번 문장","s":[[9,"Finally, he chose pineapple and ham.","마침내 그는 파인애플과 햄을 선택했다."],[10,"He added these to his pizza with tomato sauce and cheese.","그는 그의 피자에 이것들을 토마토소스와 치즈와 함께 추가했다."]],"w":"9번 he chose pineapple and ham(그는 파인애플과 햄을 선택했다)과 10번 He added these to his pizza(그는 그의 피자에 이것들을 추가했다)에서 가져왔어요. choose의 과거형은 chose, add의 과거형은 added예요. called, became, decided, arrived는 문장의 뜻이 맞지 않아요.","c":null},"h":"e9066aaaa0"}]},{"u":1,"id":"rj1-01-2","no":2,"ko":"영화 볼 때 팝콘을 안 먹었다고?","items":[{"n":1,"t":"tf","q":"Movie theaters wanted to be fancy like traditional theaters.","ko":"영화관은 전통적인 극장처럼 화려하기를 원했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Movie theaters at the time wanted to be fancy like traditional theaters.","이 시기의 영화관은 전통적인 극장처럼 화려하기를 원했다."]],"w":"4번 문장에 wanted to be fancy like traditional theaters가 그대로 나와요.","c":"T"},"h":"20277f2cf9"},{"n":2,"t":"tf","q":"The smell of popcorn pushes people away from the theater.","ko":"팝콘의 냄새는 사람들을 영화관에서 멀어지게 한다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Also, the delicious smell of popcorn can draw people into the theater!","또한, 팝콘의 맛있는 냄새는 사람들을 영화관으로 끌어들일 수 있다!"]],"w":"11번 문장에서 팝콘의 맛있는 냄새는 사람들을 영화관으로 끌어들일 수 있다(draw people into the theater)고 해요. 멀어지게 한다는 말은 반대예요.","c":"F"},"h":"811ee82f27"},{"n":3,"t":"tf","q":"Audiences like popcorn because it is easy to eat with their hands.","ko":"관객들은 손으로 먹기 쉽기 때문에 팝콘을 좋아한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Audiences love it too, because it is easy to eat with your hands while you watch movies!","당신이 영화를 보는 동안 팝콘은 손으로 먹기 쉽기 때문에 관객들 역시 그것을 좋아한다!"]],"w":"12번 문장에서 영화를 보는 동안 손으로 먹기 쉽기 때문에 관객들도 팝콘을 좋아한다고 해요.","c":"T"},"h":"78bcc1272b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They thought eating snacks could ruin the atmosphere.)","ko":"그들은 간식을 먹으면 분위기를 ( ) 수 있다고 생각했다.","opts":["지키다","바꾸다","망치다","살리다"],"word":"ruin","r":{"a":"3) 망치다","ev":"4~5번 문장","s":[[4,"Movie theaters at the time wanted to be fancy like traditional theaters.","이 시기의 영화관은 전통적인 극장처럼 화려하기를 원했다."],[5,"They thought eating snacks could ruin the atmosphere.","그들은 간식을 먹으면 분위기를 망칠 수 있다고 생각했다."]],"w":"영화관은 전통적인 극장처럼 화려하기를 원했어요(4번). 그래서 간식을 먹으면 분위기를 망칠 수 있다고 생각한 거예요(5번). ruin = 망치다.","c":3},"h":"59a0ced9d8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, the delicious smell of popcorn can draw people into the theater!)","ko":"또한, 팝콘의 맛있는 냄새는 사람들을 영화관으로 ( ) 수 있다!","opts":["끌어들일","그릴","쫓아낼","숨길"],"word":"draw","r":{"a":"1) 끌어들일","ev":"11번 문장","s":[[11,"Also, the delicious smell of popcorn can draw people into the theater!","또한, 팝콘의 맛있는 냄새는 사람들을 영화관으로 끌어들일 수 있다!"]],"w":"11번은 팝콘이 팔기에 좋은 이유를 말해요. 맛있는 냄새가 사람들을 영화관으로 끌어들인다는 뜻이에요. draw는 그림을 그리다라는 뜻도 있지만 여기서는 끌어당기다예요.","c":1},"h":"831860ae56"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey realized that popcorn was perfect to sell.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 팝콘이 팔기에 완벽하다는 것을 알게 되었다.","opts":["관객들","대공황 시기의 영화관들","팝콘","간식 장수들"],"r":{"a":"2) 대공황 시기의 영화관들","ev":"6~9번 문장","s":[[6,"During the Great Depression, however, theaters faced economic difficulties.","그러나 대공황 기간 동안 영화관은 경제적 어려움에 직면했다."],[7,"They needed more money.","그들은 더 많은 돈이 필요했다."],[8,"So they started selling snacks.","그래서 그들은 스낵을 판매하기 시작했다."],[9,"They realized that popcorn was perfect to sell.","그들은 팝콘이 팔기에 완벽하다는 것을 알게 되었다."]],"w":"6번에서 영화관들이 경제적 어려움에 직면했고, 7번에서 돈이 필요했고, 8번에서 스낵을 팔기 시작했어요. 9번의 They는 이어서 팝콘이 팔기에 좋다는 것을 알게 된 영화관들이에요.","c":2},"h":"ae44882f96"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, they weren’t always a perfect pair.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그것들이 항상 완벽한 한 쌍은 아니었다.","opts":["그것들은 한 번도 완벽한 한 쌍이었던 적이 없었다.","그것들은 언제나 완벽한 한 쌍이었다.","그것들은 완벽한 한 쌍이 되기를 원하지 않았다.","그것들이 늘 완벽한 한 쌍이었던 것은 아니었다."],"r":{"a":"4) 그것들이 늘 완벽한 한 쌍이었던 것은 아니었다.","ev":"1~2번 문장","s":[[1,"Popcorns and movies go great together.","팝콘과 영화는 아주 잘 어울린다."],[2,"However, they weren’t always a perfect pair.","하지만 그것들이 항상 완벽한 한 쌍은 아니었다."]],"w":"not always는 '항상 ~인 것은 아니다'라는 부분 부정이에요. 1번의 잘 어울리는 팝콘과 영화가 예전에는 늘 어울린 것은 아니었다는 뜻이에요. 한 번도 아니었다(never)는 뜻이 아니에요.","c":4},"h":"5a6606be1d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대공황 이전에는 일반적으로 극장에서 간식을 먹는 것이 허용되지 않았다.","극장에서 간식을 먹는 것은 항상 허용되었다.","영화관은 대공황 동안 스낵 판매를 중단했다.","영화관은 단순하고 소박해 보이기를 원했다."],"opts":["Before the Great Depression, eating snacks in theaters was generally not allowed.","Eating snacks in theaters was always allowed.","Theaters stopped selling snacks during the Great Depression.","Movie theaters wanted to look simple and plain."],"r":{"a":"1) Before the Great Depression, eating snacks in theaters was generally not allowed. (대공황 이전에는 일반적으로 극장에서 간식을 먹는 것이 허용되지 않았다.)","ev":"3번 문장","s":[[3,"Before the Great Depression, eating snacks in theaters was generally not allowed.","대공황 이전에는 일반적으로 극장에서 간식을 먹는 것이 허용되지 않았다."]],"w":"3번 Before the Great Depression, eating snacks in theaters was generally not allowed(대공황 이전에는 일반적으로 극장에서 간식을 먹는 것이 허용되지 않았다)와 같아요. 간식은 항상 허용되지 않았고, 영화관은 대공황 때 스낵을 팔기 시작했으며, 화려해 보이기를 원했어요.","c":1},"h":"cf3dd5b64d"},{"n":9,"t":"sum","q":"Popcorn is perfect for theaters to sell because it is (A) and easy to (B).","ko":"팝콘은 (A)하고 (B)하기 쉽기 때문에 영화관이 팔기에 완벽하다.","oko":["(A) 비싸다 / (B) 만들다","(A) 싸다 / (B) 잃다","(A) 드물다 / (B) 팔다","(A) 비싸다 / (B) 먹다","(A) 싸다 / (B) 만들다"],"opts":["(A) expensive / (B) make","(A) cheap / (B) lose","(A) rare / (B) sell","(A) expensive / (B) eat","(A) cheap / (B) make"],"r":{"a":"5) (A) cheap / (B) make","ev":"9~10번 문장","s":[[9,"They realized that popcorn was perfect to sell.","그들은 팝콘이 팔기에 완벽하다는 것을 알게 되었다."],[10,"It is cheap and easy to make.","그것은 싸고 만들기 쉽다."]],"w":"9번에서 팝콘이 팔기에 완벽하다고 하고, 10번에서 It is cheap and easy to make라고 이유를 말해요. 그래서 (A)는 cheap, (B)는 make예요.","c":5},"h":"a73dc553e6"},{"n":10,"t":"fill","q":"During the Great Depression, however, theaters [A] economic difficulties. They [B] more money.","ko":"그러나 대공황 기간 동안 영화관은 경제적 어려움에 [A]. 그들은 더 많은 돈이 [B].","bank":["faced","needed","allowed","started","sold","ate"],"bko":{"faced":"직면했다","needed":"필요했다","allowed":"허락했다","started":"시작했다","sold":"팔았다","ate":"먹었다"},"r":{"a":"[A] faced (직면했다), [B] needed (필요했다)","ev":"6~7번 문장","s":[[6,"During the Great Depression, however, theaters faced economic difficulties.","그러나 대공황 기간 동안 영화관은 경제적 어려움에 직면했다."],[7,"They needed more money.","그들은 더 많은 돈이 필요했다."]],"w":"6번 theaters faced economic difficulties(영화관은 경제적 어려움에 직면했다)와 7번 They needed more money(그들은 더 많은 돈이 필요했다)에서 가져왔어요. face의 과거형은 faced, need의 과거형은 needed예요. allowed, started, sold, ate는 문장의 뜻이 맞지 않아요.","c":null},"h":"bdf9662733"}]},{"u":1,"id":"rj1-01-3","no":3,"ko":"바게트가 뭐길래!","items":[{"n":1,"t":"tf","q":"About ten million baguettes are sold in France every year.","ko":"매년 약 천만 개의 바게트가 프랑스에서 판매된다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Every year, about ten million of them are sold in France!","매년 약 천만 개가 프랑스에서 판매된다!"]],"w":"4번 문장에서 매년 약 천만 개(about ten million)가 프랑스에서 팔린다고 해요.","c":"T"},"h":"68adf5eac5"},{"n":2,"t":"tf","q":"Traditional baguettes must be made in one place and sold in a different place.","ko":"전통 바게트는 한 곳에서 만들어지고 다른 곳에서 판매되어야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"They must be made and sold at the same place.","바게트는 반드시 같은 장소에서 만들어지고 판매되어야 한다."]],"w":"11번 문장에서 바게트는 반드시 같은 장소에서 만들어지고 팔려야 한다(at the same place)고 해요. 다른 곳에서 판다는 말은 반대예요.","c":"F"},"h":"4164f9e85b"},{"n":3,"t":"tf","q":"Traditional baguettes can contain only wheat flour, water, yeast, and salt.","ko":"전통 바게트의 재료로 쓸 수 있는 것은 밀가루, 물, 효모, 소금뿐이다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Also, they can contain only wheat flour, water, yeast, and salt.","또한 그것들은 단지 밀가루, 물, 효모, 소금만을 함유할 수 있다."]],"w":"12번 문장에 they can contain only wheat flour, water, yeast, and salt가 그대로 나와요.","c":"T"},"h":"d686111a79"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This made it impossible to get the bread cooked in time for breakfast.)","ko":"이것은 아침 식사 시간에 맞춰 빵이 구워지는 것을 ( ) 만들었다.","opts":["쉬운","필요한","특별한","불가능한"],"word":"impossible","r":{"a":"4) 불가능한","ev":"7~8번 문장","s":[[7,"It said that people could bake only between 4:00 a.m. and 10:00 p.m.","그것에는 사람들이 오직 오전 4시에서 오후 10시 사이에만 빵을 구울 수 있다고 적혀 있었다."],[8,"This made it impossible to get the bread cooked in time for breakfast.","이것은 아침 식사 시간에 맞춰 빵이 구워지는 것을 불가능하게 만들었다."]],"w":"7번에서 빵을 구울 수 있는 시간이 오전 4시~오후 10시로 제한되었어요. 그래서 아침 식사에 맞춰 빵을 굽는 것이 불가능해졌다는 뜻이에요. impossible = 불가능한.","c":4},"h":"2d58b32025"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Also, they can contain only wheat flour, water, yeast, and salt.)","ko":"또한 그것들은 단지 밀가루, 물, 효모, 소금만 ( ) 수 있다.","opts":["~을 팔","~을 구울","~이 들어 있을","~을 만들"],"word":"contain","r":{"a":"3) ~이 들어 있을","ev":"12번 문장","s":[[12,"Also, they can contain only wheat flour, water, yeast, and salt.","또한 그것들은 단지 밀가루, 물, 효모, 소금만을 함유할 수 있다."]],"w":"12번은 전통 바게트의 재료 규칙이에요. 밀가루, 물, 효모, 소금만 들어갈 수 있다는 뜻이므로 contain은 '~이 들어 있다, 함유하다'예요.","c":3},"h":"22a6a55fe4"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt said that people could bake only between 4:00 a.m. and 10:00 p.m.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것에는 사람들이 오직 오전 4시에서 오후 10시 사이에만 빵을 구울 수 있다고 적혀 있었다.","opts":["바게트","1920년에 통과된 새로운 법","프랑스 문화","루이 16세"],"r":{"a":"2) 1920년에 통과된 새로운 법","ev":"6~7번 문장","s":[[6,"Later, in 1920, France passed a new law.","그 후 1920년에 프랑스는 새로운 법을 통과시켰다."],[7,"It said that people could bake only between 4:00 a.m. and 10:00 p.m.","그것에는 사람들이 오직 오전 4시에서 오후 10시 사이에만 빵을 구울 수 있다고 적혀 있었다."]],"w":"6번에서 프랑스가 1920년에 새로운 법을 통과시켰고(France passed a new law), 7번의 It은 그 법을 가리켜요. 그 법에 빵을 구울 수 있는 시간이 오전 4시부터 오후 10시까지로 적혀 있었어요.","c":2},"h":"64e7c5033d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"People have been baking baguettes since Louis XVI was king.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사람들은 루이 16세가 왕이었을 때부터 바게트를 구워 왔다.","opts":["루이 16세가 왕이었을 때부터 사람들은 바게트를 계속 구워 왔다.","사람들은 루이 16세가 왕이었던 때에만 바게트를 구웠다.","루이 16세가 왕이 되자 사람들은 바게트 굽는 것을 그만두었다.","루이 16세는 바게트를 가장 좋아하는 왕이었다."],"r":{"a":"1) 루이 16세가 왕이었을 때부터 사람들은 바게트를 계속 구워 왔다.","ev":"5번 문장","s":[[5,"People have been baking baguettes since Louis XVI was king.","사람들은 루이 16세가 왕이었을 때부터 바게트를 구워 왔다."]],"w":"have been baking은 '구워 오고 있다', since는 '~ 이후로'예요. 루이 16세 때부터 지금까지 계속 구워 왔다는 뜻이에요.","c":1},"h":"9840dc41bb"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["제빵사들은 하루 중 아무 때나 빵을 구울 수 있었다.","바게트는 한 곳에서 만들어지고 다른 곳에서 팔려야 한다.","프랑스 음식을 생각할 때 많은 사람들이 바게트를 떠올린다.","바게트는 설탕과 버터로 만든다."],"opts":["Bakers could bake bread at any time of the day.","Baguettes must be made in one place and sold in another.","Many people think of baguettes when they think about food from France.","Baguettes are made with sugar and butter."],"r":{"a":"3) Many people think of baguettes when they think about food from France. (프랑스 음식을 생각할 때 많은 사람들이 바게트를 떠올린다.)","ev":"1~2번 문장","s":[[1,"When you think about French food, what comes to mind?","프랑스 음식을 생각하면 무엇이 떠오르는가?"],[2,"Many people will think of baguettes.","많은 사람들이 바게트를 떠올릴 것이다."]],"w":"1~2번에서 프랑스 음식을 생각하면 많은 사람들이 바게트를 떠올린다고 했어요(Many people will think of baguettes. 많은 사람들이 바게트를 떠올릴 것이다). 제빵사는 정해진 시간에만 구웠고, 바게트는 같은 곳에서 만들고 팔아야 하며, 설탕과 버터는 넣을 수 없어요.","c":3},"h":"27afb894ad"},{"n":9,"t":"sum","q":"Baguettes are a big part of (A) culture, and there are some special (B) for traditional baguettes.","ko":"바게트는 (A) 문화의 큰 부분이며, 전통 바게트에는 몇 가지 특별한 (B)이(가) 있다.","oko":["(A) 프랑스 / (B) 가격","(A) 이탈리아 / (B) 규칙","(A) 프랑스 / (B) 규칙","(A) 이탈리아 / (B) 가격","(A) 한국 / (B) 색깔"],"opts":["(A) French / (B) prices","(A) Italian / (B) rules","(A) French / (B) rules","(A) Italian / (B) prices","(A) Korean / (B) colors"],"r":{"a":"3) (A) French / (B) rules ((A) 프랑스 / (B) 규칙)","ev":"3, 10번 문장","s":[[3,"These sticks of baked dough are a big part of French culture.","이 구운 반죽의 막대는 프랑스 문화의 큰 부분이다."],[10,"There are some special rules for traditional baguettes.","전통 바게트에는 몇 가지 특별한 규칙이 있다."]],"w":"3번 These sticks of baked dough are a big part of French culture(이 구운 반죽의 막대는 프랑스 문화의 큰 부분이다)와 10번 There are some special rules for traditional baguettes(전통 바게트에는 몇 가지 특별한 규칙이 있다)를 합친 요약이에요. Italian, Korean은 본문에 나오지 않고, prices, colors는 본문의 규칙 내용이 아니에요.","c":3},"h":"6e6ab5357d"},{"n":10,"t":"fill","q":"So bakers made the dough into a [A], thin shape that cooked [B].","ko":"그래서 제빵사들은 반죽을 [A] 얇은 모양, 즉 [B] 익는 모양으로 만들었다.","bank":["long","faster","heavy","slower","thick","loudly"],"bko":{"long":"긴","faster":"더 빨리","heavy":"무거운","slower":"더 느리게","thick":"두꺼운","loudly":"시끄럽게"},"r":{"a":"[A] long, [B] faster","ev":"9번 문장","s":[[9,"So bakers made the dough into a long, thin shape that cooked faster.","그래서 제빵사들은 더 빨리 익는 길고 얇은 모양으로 반죽을 만들었다."]],"w":"9번 So bakers made the dough into a long, thin shape that cooked faster에서 가져왔어요. 법 때문에 굽는 시간이 모자라서 더 빨리 익는 모양이 필요했으므로 slower는 본문과 반대예요. heavy와 thick은 thin(얇은)과 맞지 않고, loudly는 '익는다'와 어울리지 않아요.","c":null},"h":"1bb7fe308b"}]},{"u":1,"id":"rj1-01-4","no":4,"ko":"비슷한 너희들~ 정체가 뭐니?","items":[{"n":1,"t":"tf","q":"The cacao plant grows in South America and West Africa.","ko":"카카오 식물은 남아메리카와 서아프리카에서 자란다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"The cacao plant is a small tree that grows in South America and West Africa.","카카오 식물은 남아메리카와 서아프리카에서 자라는 작은 나무이다."]],"w":"5번 문장에서 카카오 식물은 남아메리카와 서아프리카에서 자라는 작은 나무라고 해요.","c":"T"},"h":"e166a64c55"},{"n":2,"t":"tf","q":"Cocoa is a liquid used to make chocolate-flavored drinks.","ko":"코코아는 초콜릿 맛이 나는 음료를 만드는 데 쓰이는 액체이다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"It is a powder used to make chocolate-flavored drinks.","그것은 초콜릿 맛이 나는 음료를 만드는 데 쓰이는 분말이다."]],"w":"8번 문장에서 코코아는 초콜릿 맛이 나는 음료를 만드는 데 쓰이는 분말(a powder)이라고 해요. 액체가 아니에요.","c":"F"},"h":"dcc068c560"},{"n":3,"t":"tf","q":"Manufacturers add sugar to cocoa to make it sweeter.","ko":"제조업자들은 코코아를 더 달게 만들기 위해 설탕을 첨가한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Manufacturers also add sugar to the cocoa to make it sweeter.","제조업자들은 또한 코코아를 더 달게 만들기 위해 코코아에 설탕을 첨가한다."]],"w":"11번 문장에 Manufacturers also add sugar to the cocoa to make it sweeter라고 나와요.","c":"T"},"h":"f3dd7f3350"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (After cacao seeds are harvested, they are turned into chocolate.)","ko":"카카오 씨앗들이 ( ) 이후에, 그것들은 초콜릿으로 변화된다.","opts":["씻긴","수확된","버려진","팔린"],"word":"harvested","r":{"a":"2) 수확된","ev":"6번 문장","s":[[6,"After cacao seeds are harvested, they are turned into chocolate.","카카오 씨앗들은 수확된 이후에 초콜릿으로 변화된다."]],"w":"6번은 카카오 씨앗이 초콜릿이 되기까지의 순서를 말해요. 식물에서 씨앗을 거둬들인 뒤 초콜릿으로 바꾼다는 뜻이므로 harvest = 수확하다예요.","c":2},"h":"15485c3ef9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This process causes the cacao to lose many of its nutrients.)","ko":"이 과정은 카카오가 많은 ( )를 잃게 만든다.","opts":["맛","색깔","냄새","영양소"],"word":"nutrients","r":{"a":"4) 영양소","ev":"10, 12번 문장","s":[[10,"This process causes the cacao to lose many of its nutrients.","이 과정은 카카오가 많은 영양소를 잃게 만든다."],[12,"This is why raw cacao is considered much healthier than products that contain cocoa powder.","이것이 생카카오가 코코아 분말을 함유한 제품들보다 훨씬 더 건강에 좋다고 여겨지는 이유이다."]],"w":"10번은 가열하는 과정에서 카카오가 잃는 것을 말해요. 12번에서 생카카오가 훨씬 더 건강에 좋다고 하므로 잃는 것은 건강에 좋은 영양소(nutrients)예요.","c":4},"h":"c11ff37141"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nFor this reason, many people think they’re the same thing.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이러한 이유로 많은 사람들이 그것들이 같은 것이라고 생각한다.","opts":["카카오와 코코아","카카오 식물과 씨앗","많은 사람들","제조업자들"],"r":{"a":"1) 카카오와 코코아","ev":"1~2번 문장","s":[[1,"The words cacao and cocoa look very similar.","‘카카오’와 ‘코코아’라는 단어는 매우 비슷해 보인다."],[2,"For this reason, many people think they’re the same thing.","이러한 이유로 많은 사람들이 그것들이 같은 것이라고 생각한다."]],"w":"2번의 they는 바로 앞 1번의 The words cacao and cocoa(‘카카오’와 ‘코코아’라는 단어)를 가리켜요. 이름이 비슷해서 사람들이 두 가지를 같은 것으로 생각한다는 뜻이에요.","c":1,"k":"they = 카카오와 코코아"},"pron":"they","h":"441fda6e87"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is why raw cacao is considered much healthier than products that contain cocoa powder.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것이 생카카오가 코코아 분말을 함유한 제품들보다 훨씬 더 건강에 좋다고 여겨지는 이유이다.","opts":["이것이 코코아 분말이 든 제품이 생카카오보다 훨씬 더 건강에 좋다고 여겨지는 이유이다.","생카카오와 코코아 분말이 든 제품은 건강에 똑같이 좋다고 여겨진다.","이것이 생카카오가 코코아 분말이 든 제품보다 훨씬 더 건강에 좋다고 여겨지는 이유이다.","이것은 생카카오로 코코아 분말을 만드는 방법이다."],"r":{"a":"3) 이것이 생카카오가 코코아 분말이 든 제품보다 훨씬 더 건강에 좋다고 여겨지는 이유이다.","ev":"12번 문장","s":[[12,"This is why raw cacao is considered much healthier than products that contain cocoa powder.","이것이 생카카오가 코코아 분말을 함유한 제품들보다 훨씬 더 건강에 좋다고 여겨지는 이유이다."]],"w":"This is why ~는 '이것이 ~한 이유이다'라는 뜻이에요. 비교급 healthier than ~에서 건강에 더 좋은 쪽은 than 앞의 생카카오예요.","c":3},"h":"e11764040b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["카카오는 음료에 쓰이는 분말이다.","카카오 식물은 아시아에서 자라는 큰 나무이다.","카카오는 카카오 식물의 씨앗으로부터 나온다.","카카오는 설탕이 든 음료이다."],"opts":["Cacao is a powder used in drinks.","The cacao plant is a large tree that grows in Asia.","Cacao comes from the seeds of the cacao plant.","Cacao is a drink with sugar."],"r":{"a":"3) Cacao comes from the seeds of the cacao plant. (카카오는 카카오 식물의 씨앗으로부터 나온다.)","ev":"4번 문장","s":[[4,"Cacao comes from cacao plant seeds in their natural state.","카카오는 천연 상태의 카카오 식물의 씨앗으로부터 나온다."]],"w":"4번 Cacao comes from cacao plant seeds in their natural state(카카오는 천연 상태의 카카오 식물의 씨앗으로부터 나온다)와 같아요. 카카오는 인공 제품이 아니고, 카카오 식물은 작은 나무이며 남아메리카와 서아프리카에서 자라요.","c":3},"h":"5f0a204b1c"},{"n":9,"t":"sum","q":"The words cacao and cocoa look very (A), but they are very (B)!","ko":"‘카카오’와 ‘코코아’라는 단어는 매우 (A) 보이지만, 그것들은 매우 (B)!","oko":["(A) 비슷해 / (B) 다르다","(A) 비슷해 / (B) 달콤하다","(A) 달라 / (B) 비슷하다","(A) 달라 / (B) 다르다","(A) 달콤해 / (B) 비슷하다"],"opts":["(A) similar / (B) different","(A) similar / (B) sweet","(A) different / (B) similar","(A) different / (B) different","(A) sweet / (B) similar"],"r":{"a":"1) (A) similar / (B) different ((A) 비슷해 / (B) 다르다)","ev":"1, 3번 문장","s":[[1,"The words cacao and cocoa look very similar.","‘카카오’와 ‘코코아’라는 단어는 매우 비슷해 보인다."],[3,"But they are very different!","그러나 그것들은 매우 다르다!"]],"w":"1번 The words cacao and cocoa look very similar(‘카카오’와 ‘코코아’라는 단어는 매우 비슷해 보인다)와 3번 But they are very different!(그러나 그것들은 매우 다르다!)을 합친 요약이에요. 겉모습은 비슷하지만 실제로는 다르다는 뜻이에요.","c":1},"h":"a88e42751e"},{"n":10,"t":"fill","q":"Cocoa is [A] by [B] up raw cacao.","ko":"코코아는 생카카오를 [B] 것으로 [A].","bank":["made","heating","grows","cooling","powder","tree"],"bko":{"made":"만들어진다","heating":"가열하는","grows":"자란다","cooling":"식히는","powder":"분말","tree":"나무"},"r":{"a":"[A] made (만들어진다), [B] heating (가열하는)","ev":"9번 문장","s":[[9,"Cocoa is made by heating up raw cacao.","코코아는 생카카오를 가열하여 만들어진다."]],"w":"9번 Cocoa is made by heating up raw cacao(코코아는 생카카오를 가열하여 만들어진다)에서 가져왔어요. be made(만들어지다) 뒤에 by heating(가열함으로써)이 와요. grows, powder, tree는 뜻이 맞지 않고, cooling은 반대 뜻이에요.","c":null},"h":"a38d67d3c5"}]},{"u":2,"id":"rj1-02-1","no":1,"ko":"카우보이 장화가 왜 그곳에?","items":[{"n":1,"t":"tf","q":"People knew the rancher was there when they saw the boots.","ko":"사람들은 장화를 보고 목장 주인이 거기에 있다는 것을 알았다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"People saw the boots and knew the rancher was there.","사람들은 장화를 보았고 목장 주인이 거기에 있다는 것을 알았다."]],"w":"6번 문장에 People saw the boots and knew the rancher was there라고 나와요.","c":"T"},"h":"27a664564c"},{"n":2,"t":"tf","q":"Ranchers were not close to their horses.","ko":"목장 주인들은 그들의 말들과 가깝지 않았다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Ranchers were close to their horses.","목장 주인들은 그들의 말들과 가까웠다."]],"w":"8번 문장에서 목장 주인들은 말들과 가까웠다(Ranchers were close to their horses)고 해요. 가깝지 않았다는 말은 반대예요.","c":"F"},"h":"7f099afac6"},{"n":3,"t":"tf","q":"Ranchers could honor a friend who passed away by hanging up their boots.","ko":"목장 주인들은 장화를 걸어둠으로써 죽은 친구에게 경의를 표할 수 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~11번 문장","s":[[10,"The same practice was done when a fellow rancher passed away.","같은 관행이 동료 목장 주인이 죽었을 때 행해졌다."],[11,"They could honor their friend in this way.","그들은 이런 방법으로 그들의 친구에게 경의를 표할 수 있었다."]],"w":"10번에서 같은 관행이 동료 목장 주인이 죽었을 때도 행해졌고, 11번에서 이런 방법으로 친구에게 경의를 표할 수 있었다고 해요.","c":"T"},"h":"cefb3cafb0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (So this was an easy way to communicate.)","ko":"그래서 이것은 ( ) 쉬운 방법이었다.","opts":["여행하다","의사소통하다","요리하다","운동하다"],"word":"communicate","r":{"a":"2) 의사소통하다","ev":"4~5번 문장","s":[[4,"Long ago, there were no phones or electricity.","오래 전에는, 전화기나 전기가 없었다."],[5,"So this was an easy way to communicate.","그래서 이것은 의사소통하는 쉬운 방법이었다."]],"w":"4번에서 옛날에는 전화기도 전기도 없었어요. 그래서 장화를 놓아두어 집에 있다는 것을 알리는 것이 서로 소식을 전하는 쉬운 방법이었어요. communicate = 의사소통하다.","c":2},"h":"d9a3d166e3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They hung up their boots to show respect for their beloved animal.)","ko":"그들은 그들의 사랑하는 동물에 대한 ( )을 표하기 위해 그들의 장화를 걸어두었다.","opts":["두려움","질투","웃음","존경"],"word":"respect","r":{"a":"4) 존경","ev":"8~9번 문장","s":[[8,"Ranchers were close to their horses.","목장 주인들은 그들의 말들과 가까웠다."],[9,"They hung up their boots to show respect for their beloved animal.","그들은 그들의 사랑하는 동물에 대한 존경을 표하기 위해 그들의 장화를 걸어두었다."]],"w":"8번에서 목장 주인들은 말과 가까웠어요. 그래서 9번에서 사랑하는 말이 죽었을 때 장화를 걸어 마음을 표현한 거예요. respect = 존경.","c":4},"h":"24ed29382d"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nWhy are boots placed like that?","ko":"밑줄 친 that이 가리키는 것은?","sko":"왜 장화가 그렇게 놓여 있을까?","opts":["카우보이 장화가 울타리 기둥 위에 있는 것","장화를 신고 일하는 것","울타리를 새로 만드는 것","말을 타고 다니는 것"],"r":{"a":"1) 카우보이 장화가 울타리 기둥 위에 있는 것","ev":"1~2번 문장","s":[[1,"In rural areas of the United States, you may see cowboy boots on fence posts.","미국의 시골 지역에서 당신은 카우보이 장화가 울타리 기둥 위에 있는 것을 볼 수도 있다."],[2,"Why are boots placed like that?","왜 장화가 그렇게 놓여 있을까?"]],"w":"2번의 like that은 바로 앞 1번의 cowboy boots on fence posts(카우보이 장화가 울타리 기둥 위에 있는 것)를 가리켜요. 왜 장화가 그런 모습으로 놓여 있는지를 묻는 문장이에요.","c":1,"k":"that = 카우보이 장화가 울타리 기둥 위에 있는 것"},"pron":"that","h":"c98ef1790e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you see boots on a fence, just leave them alone.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"만약 당신이 울타리에 장화를 본다면, 그냥 두어라.","opts":["울타리에 장화가 보이면, 그냥 그대로 두어라.","울타리에 장화가 보이면, 장화를 가져가라.","울타리에 장화가 보이면, 그 옆에 혼자 남아 있어라.","울타리에 장화가 보이면, 신어 보아라."],"r":{"a":"1) 울타리에 장화가 보이면, 그냥 그대로 두어라.","ev":"13번 문장","s":[[13,"If you see boots on a fence, just leave them alone.","만약 당신이 울타리에 장화를 본다면, 그냥 두어라."]],"w":"leave A alone은 'A를 그냥 내버려 두다'라는 뜻이에요. 장화는 집에 있다는 신호이거나 누군가를 기리는 표시이니 건드리지 말라는 마무리 말이에요.","c":1},"h":"3ef1f5c364"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["목장 주인들은 집을 비웠을 때만 장화를 울타리에 걸었다.","옛날에는 전화기가 있어서 장화가 필요 없었다.","말이 죽었을 때도 울타리에 장화를 거는 일이 있었다.","울타리의 장화를 보면 가져가도 된다."],"opts":["Ranchers hung their boots on fences only when they were away from home.","Phones existed long ago, so boots were not needed.","Boots were also hung on fences when a horse died.","You may take the boots when you see them on a fence."],"r":{"a":"3) Boots were also hung on fences when a horse died.","ev":"3, 4, 7, 13번 문장","s":[[3,"Ranchers used to leave their boots on fence posts to show they were home.","목장 주인들은 그들이 집에 있다는 것을 보여주기 위해 장화를 울타리 기둥 위에 놓아두곤 했다."],[4,"Long ago, there were no phones or electricity.","오래 전에는, 전화기나 전기가 없었다."],[7,"Hanging boots on fences was also done when a horse died.","울타리에 장화를 거는 것은 또한 말이 죽었을 때도 행해졌다."],[13,"If you see boots on a fence, just leave them alone.","만약 당신이 울타리에 장화를 본다면, 그냥 두어라."]],"w":"7번에서 울타리에 장화를 거는 것은 말이 죽었을 때도 행해졌다고 해요. 장화는 집에 있다는 신호였고(3번), 옛날에는 전화기가 없었고(4번), 장화는 그냥 두어야 해요(13번).","c":3},"h":"5295cf9303"},{"n":9,"t":"sum","q":"In (A) areas of (B), you may see cowboy boots on fence posts.","ko":"(B)의 (A) 지역에서 당신은 카우보이 장화가 울타리 기둥 위에 있는 것을 볼 수도 있다.","oko":["(A) 시골 / (B) 미국","(A) 도시 / (B) 미국","(A) 시골 / (B) 멕시코","(A) 도시 / (B) 캐나다","(A) 바쁜 / (B) 멕시코"],"opts":["(A) rural / (B) the United States","(A) city / (B) the United States","(A) rural / (B) Mexico","(A) city / (B) Canada","(A) busy / (B) Mexico"],"r":{"a":"1) (A) rural / (B) the United States ((A) 시골 / (B) 미국)","ev":"1번 문장","s":[[1,"In rural areas of the United States, you may see cowboy boots on fence posts.","미국의 시골 지역에서 당신은 카우보이 장화가 울타리 기둥 위에 있는 것을 볼 수도 있다."]],"w":"1번 In rural areas of the United States, you may see cowboy boots on fence posts(미국의 시골 지역에서 당신은 카우보이 장화가 울타리 기둥 위에 있는 것을 볼 수도 있다)에서 가져왔어요. rural은 ‘시골의’, city는 ‘도시’라는 뜻이에요. Mexico, Canada는 본문에 나오지 않아요.","c":1},"h":"e2cfc8457e"},{"n":10,"t":"fill","q":"So, now you [A] the [B] behind this tradition.","ko":"자, 이제 당신은 이 전통에 숨겨진 [B]을(를) [A].","bank":["know","reason","ride","died","fence","horse"],"bko":{"know":"안다","reason":"이유","ride":"탄다","died":"죽었다","fence":"울타리","horse":"말"},"r":{"a":"[A] know (안다), [B] reason (이유)","ev":"12번 문장","s":[[12,"So, now you know the reason behind this tradition.","자, 이제 당신은 이 전통에 숨겨진 이유를 알게 되었다."]],"w":"12번 So, now you know the reason behind this tradition(자, 이제 당신은 이 전통에 숨겨진 이유를 알게 되었다)에서 가져왔어요. you 뒤에는 동사 know가, the 뒤에는 명사 reason이 와요. ride, died, fence,  school an enjoyable event!)","ko":"이 특별한 선물은 첫 등교일을 ( ) 행사로 만든다!","opts":["지루한","즐거운","위험한","조용한"],"word":"enjoyable","r":{"a":"2) 즐거운","ev":"10번 문장","s":[[10,"These special gifts make the first day of school an enjoyable event!","이 특별한 선물은 첫 등교일을 즐거운 행사로 만든다!"]],"w":"10번은 스쿨 콘이 학용품, 장난감, 사탕이 가득한 특별한 선물이라는 마무리예요. 그래서 첫 등교일이 즐거운 행사가 돼요. enjoyable = 즐거운.","c":2},"h":"dfb67dded0"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSo they could pick up their school cones on the first day of school.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그래서 그들은 첫 등교일에 스쿨 콘을 집어 들 수 있었다.","opts":["부모님들","조부모님들","학생들","선생님들"],"r":{"a":"3) 학생들","ev":"8~9번 문장","s":[[8,"When the tree was ripe with cones, it meant that the students were ready to attend school.","나무가 콘으로 가득 찼을 때, 그것은 학생들이 학교에 다닐 준비가 되었다는 것을 의미했다."],[9,"So they could pick up their school cones on the first day of school.","그래서 그들은 첫 등교일에 스쿨 콘을 집어 들 수 있었다."]],"w":"9번의 they는 8번의 the students(학생들)를 가리켜요. 학생들이 학교에 다닐 준비가 되었으니, 첫 등교일에 스쿨 콘을 집어 들 수 있었다는 뜻이에요.","c":3,"k":"they = 학생들"},"pron":"they","h":"9358b38622"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In Germany, however, this day is fun and exciting thanks to an old tradition.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 독일에서는 오래된 전통 덕분에 이날은 재미있고 신난다.","opts":["독일에서는 이날이 재미있고 신나서 오래된 전통이 생겼다.","하지만 독일에서는 오래된 전통 때문에 이날이 지루하다.","하지만 독일에서는 오래된 전통 덕분에 이날은 재미있고 신난다.","독일에서도 아이들은 첫 등교일에 긴장하는 것을 피할 수 없다."],"r":{"a":"3) 하지만 독일에서는 오래된 전통 덕분에 이날은 재미있고 신난다.","ev":"1~2번 문장","s":[[1,"Children are often nervous on their very first day of school.","아이들은 종종 맨 첫 등교일에 긴장한다."],[2,"In Germany, however, this day is fun and exciting thanks to an old tradition.","하지만 독일에서는 오래된 전통 덕분에 이날은 재미있고 신난다."]],"w":"thanks to는 '~ 덕분에'라는 뜻이에요. 전통이 원인이고, 이날이 재미있고 신나는 것이 결과예요. 1번에서는 보통 긴장한다고 했지만 however로 독일은 다르다고 해요.","c":3},"h":"a55eacfeb8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["스쿨 콘은 졸업하는 학생들에게 주어진다.","독일 아이들은 마지막 등교일에 스쿨 콘을 s":[[4,"Groundhogs sleep during the winter.","마멋은 겨울 동안 잠을 잔다."],[5,"On Groundhog Day, they come out of their winter homes.","마멋의 날에 그들은 겨울 집에서 나온다."]],"w":"4번 Groundhogs sleep during the winter(마멋은 겨울 동안 잠을 잔다)와 5번 they come out of their winter homes(겨울 집에서 나온다)를 합친 요약이에요. swim, fly는 본문에 없는 행동이고, shadows, rivers는 마멋이 나오는 곳이 아니에요.","c":1},"h":"1dc3116783"},{"n":10,"t":"fill","q":"Everyone [A] the fun [B].","ko":"모든 사람들이 재미있는 [B]을(를) [A].","bank":["enjoys","atmosphere","runs","jumps","shadow","weeks"],"bko":{"enjoys":"즐긴다","atmosphere":"분위기","runs":"달린다","jumps":"뛴다","shadow":"그림자","weeks":"주"},"r":{"a":"[A] enjoys (즐긴다), [B] atmosphere (분위기)","ev":"11번 문장","s":[[11,"Everyone enjoys the fun atmosphere.","모든 사람들이 재미있는 분위기를 즐긴다."]],"w":"11번 Everyone enjoys the fun atmosphere(모든 사람들이 재미있는 분위기를 즐긴다)에서 가져왔어요. runs(달린다), jumps(뛴다)는 분위기와 어울리지 않고, shadow(그림자), weeks(주)는 fun 뒤에 와도 즐길 대상이 되지 않아요.","c":null},"h":"6e0ea8e592"}]},{"u":2,"id":"rj1-02-4","no":4,"ko":"새해 첫날, 어떤 음식을 먹을까?","items":[{"n":1,"t":"tf","q":"People eat some foods on New Year’s Day to gain money, love, or other kinds of good fortune.","ko":"사람들은 돈, 사랑, 또는 다른 종류의 행운이 생기기를 바라며 새해 첫날 몇몇 음식을 먹는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They eat them to gain money, love, or other kinds of good fortune.","그들은 돈, 사랑, 또는 다른 종류들의 행운을 얻기 위해 그것들을 먹는다."]],"w":"2번 문장에 They eat them to gain money, love, or other kinds of good fortune이라고 나와요. 먹는 목적은 행운을 얻는 것이에요.","c":"T"},"h":"c070e2cc0c"},{"n":2,"t":"tf","q":"Good luck foods are the same in every culture.","ko":"행운의 음식은 모든 문화에서 같다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"But these good luck foods are different from culture to culture.","그러나 이 행운의 음식들은 문화마다 다르다."]],"w":"3번 문장에서 이 행운의 음식들은 문화마다 다르다(different from culture to culture)고 해요. 모든 문화에서 같다는 말은 반대예요.","c":"F"},"h":"10d9c4b18e"},{"n":3,"t":"tf","q":"Pigs dig forward with their nose.","ko":"돼지는 코를 사용하여 앞으로 땅을 판다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Pigs dig forward with their nose.","돼지는 그들의 코를 사용하여 앞으로 땅을 판다."]],"w":"5번 문장에 Pigs dig forward with their nose라고 그대로 나와요.","c":"T"},"h":"1ec7140e58"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (People think that this represents progress.)","ko":"사람들은 이것이 진보를 ( ) 생각한다.","opts":["피한다고","끝낸다고","나타낸다고","섞는다고"],"word":"represents","r":{"a":"3) 나타낸다고","ev":"5~6번 문장","s":[[5,"Pigs dig forward with their nose.","돼지는 그들의 코를 사용하여 앞으로 땅을 판다."],[6,"People think that this represents progress.","사람들은 이것이 진보를 나타낸다고 생각한다."]],"w":"5번에서 돼지가 코로 앞으로 땅을 파요. 6번은 이 모습이 진보를 나타낸다고 보는 거예요. represent = 나타내다, 상징하다.","c":3},"h":"2486d22f89"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They eat them to gain money, love, or other kinds of good fortune.)","ko":"그들은 돈, 사랑, 또는 다른 종류들의 행운을 ( ) 위해 그것들을 먹는다.","opts":["잃기","얻기","주기","팔기"],"word":"gain","r":{"a":"2) 얻기","ev":"2번 문장","s":[[2,"They eat them to gain money, love, or other kinds of good fortune.","그들은 돈, 사랑, 또는 다른 종류들의 행운을 얻기 위해 그것들을 먹는다."]],"w":"2번은 행운의 음식을 먹는 목적을 말해요. 돈, 사랑, 행운을 얻으려고 먹는 것이므로 gain = 얻다예요.","c":2},"h":"17c927a00e"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nFor this reason, people believe that they will bring money and luck.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이런 이유로, 사람들은 그것들이 돈과 행운을 가져다줄 것이라고 믿는다.","opts":["미국 남부 사람들","동전과 지폐","동부콩과 녹색 채소","중국인들"],"r":{"a":"3) 동부콩과 녹색 채소","ev":"11~13번 문장","s":[[11,"Black-eyed peas and greens are good luck foods on New Year’s Day for people in the Southern US.","동부콩과 녹색 채소는 미국 남부의 사람들에게 새해 첫날 (먹는) 행운의 음식들이다."],[12,"Black-eyed peas look like coins, and greens resemble dollar bills.","동부콩은 동전처럼 보이고, 녹색 채소는 달러 지폐와 닮았다."],[13,"For this reason, people believe that they will bring money and luck.","이런 이유로, 사람들은 그것들이 돈과 행운을 가져다줄 것이라고 믿는다."]],"w":"13번의 For this reason은 12번 내용을 받아요. 돈과 행운을 가져다줄 것이라고 믿는 대상은 11번의 Black-eyed peas and greens예요. 동전과 지폐는 이 음식들이 닮은 것일 뿐이에요.","c":3},"h":"f674854207"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They believe that they can live a long life by doing this.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 이것을 함으로써 그들이 긴 인생을 살 수 있다고 믿는다.","opts":["그들은 국수를 먹음으로써 자신들이 오래 살 수 있다고 믿는다.","그들은 오래 살면 국수를 먹을 수 있다고 믿는다.","그들은 국수를 먹지 않으면 오래 살 수 있다고 믿는다.","그들은 국수를 먹음으로써 다른 사람들이 오래 산다고 믿는다."],"r":{"a":"1) 그들은 국수를 먹음으로써 자신들이 오래 살 수 있다고 믿는다.","ev":"9~10번 문장","s":[[9,"So the Chinese eat noodles on New Year’s Day.","그래서 중국인들은 새해 첫날에 국수를 먹는다."],[10,"They believe that they can live a long life by doing this.","그들은 이것을 함으로써 그들이 긴 인생을 살 수 있다고 믿는다."]],"w":"by doing this는 '이것을 함으로써'라는 방법을 나타내요. this는 9번의 국수를 먹는 것이에요. 그러니 국수를 먹음으로써 자신들이 오래 살 수 있다고 믿는다는 뜻이에요.","c":1},"h":"a0a045c808"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["중국인들은 새해 첫날에 국수를 먹는다.","돼지는 코를 사용하여 뒤로 땅을 판다.","동부콩은 유럽에서만 먹는다.","중국에서 긴 국수는 밤에만 먹는다."],"opts":["The Chinese eat noodles on New Year’s Day.","Pigs dig backward with their nose.","Black-eyed peas are eaten only in Europe.","In China, long noodles are eaten only at night."],"r":{"a":"1) The Chinese eat noodles on New Year’s Day. (중국인들은 새해 첫날에 국수를 먹는다.)","ev":"9번 문장","s":[[9,"So the Chinese eat noodles on New Year’s Day.","그래서 중국인들은 새해 첫날에 국수를 먹는다."]],"w":"9번 So the Chinese eat noodles on New Year’s Day(그래서 중국인들은 새해 첫날에 국수를 먹는다)와 같아요. 돼지는 앞으로(forward) 땅을 파고, 동부콩은 미국 남부 사람들이 먹으며, 국수를 밤에만 먹는다는 말은 없어요.","c":1},"h":"33708e3711"},{"n":9,"t":"sum","q":"Some (A) eat (B) on New Year’s Day.","ko":"일부 (A)은(는) 새해 첫날에 (B)을(를) 먹는다.","oko":["(A) 유럽인들 / (B) 돼지고기","(A) 유럽인들 / (B) 국수","(A) 중국인들 / (B) 돼지고기","(A) 중국인들 / (B) 콩","(A) 한국인들 / (B) 콩"],"opts":["(A) Europeans / (B) pork","(A) Europeans / (B) noodles","(A) Chinese / (B) pork","(A) Chinese / (B) peas","(A) Koreans / (B) peas"],"r":{"a":"1) (A) Europeans / (B) pork ((A) 유럽인들 / (B) 돼지고기)","ev":"4번 문장","s":[[4,"Some Europeans eat pork on this day.","일부 유럽인들은 이날에 돼지고기를 먹는다."]],"w":"4번 Some Europeans eat pork on this day(일부 유럽인들은 이날에 돼지고기를 먹는다)에서 가져왔어요. 국수는 중국인들, 콩은 미국 남부 사람들이 먹는 음식이라 유럽인들과 짝이 맞지 않아요.","c":1},"h":"9cf020986a"},{"n":10,"t":"fill","q":"Black-eyed peas [A] like coins, and greens [B] dollar bills.","ko":"동부콩은 동전처럼 [A], 녹색 채소는 달러 지폐와 [B].","bank":["look","resemble","sleep","dig","fly","believe"],"bko":{"look":"보인다","resemble":"닮았다","sleep":"잔다","dig":"땅을 판다","fly":"난다","believe":"믿는다"},"r":{"a":"[A] look (보인다), [B] resemble (닮았다)","ev":"12번 문장","s":[[12,"Black-eyed peas look like coins, and greens resemble dollar bills.","동부콩은 동전처럼 보이고, 녹색 채소는 달러 지폐와 닮았다."]],"w":"12번 Black-eyed peas look like coins, and greens resemble dollar bills(동부콩은 동전처럼 보이고, 녹색 채소는 달러 지폐와 닮았다)에서 가져왔어요. look 뒤에는 like가 오고, resemble은 like 없이 바로 목적어가 와요. sleep, dig, fly, believe는 뜻이 맞지 않아요.","c":null},"h":"01d7dfa06a"}]},{"u":3,"id":"rj1-03-1","no":1,"ko":"발톱보다 빠른 손톱","items":[{"n":1,"t":"tf","q":"People use their fingers more often than their toes.","ko":"사람들은 발가락보다 손가락을 더 자주 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"We use our fingers much more than our toes.","우리는 발가락보다 손가락을 훨씬 더 많이 사용한다."]],"w":"3번 문장에서 우리는 발가락보다 손가락을 훨씬 더 많이 사용한다고 해요. 같은 내용이에요.","c":"T"},"h":"184e45d4df"},{"n":2,"t":"tf","q":"Toenails get more nutrients than fingernails because toes are very active.","ko":"발가락은 매우 활동적이어서 발톱은 손톱보다 영양소를 더 많이 얻는다.","r":{"a":"F (본문과 다른 내용)","ev":"9~10번 문장","s":[[9,"There is much less activity in the toes.","발가락에는 활동이 훨씬 적다."],[10,"So the toenails get fewer nutrients.","그래서 발톱은 영양소를 덜 얻는다."]],"w":"9번에서 발가락에는 활동이 훨씬 적다고 하고, 10번에서 그래서 발톱은 영양소를 덜 얻는다고 해요. 더 많이 얻는다는 말은 반대예요.","c":"F"},"h":"605c15d728"},{"n":3,"t":"tf","q":"Sunlight has no effect on how nails grow.","ko":"햇빛은 손톱이 자라는 데 아무 영향도 주지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"In addition, nail growth is affected by vitamin D from sunlight.","게다가, 손톱, 발톱의 성장은 햇빛의 비타민 D에 의해 영향을 받는다."]],"w":"11번에서 손톱, 발톱의 성장은 햇빛의 비타민 D에 의해 영향을 받는다고 해요. 영향이 없다는 말은 반대예요.","c":"F"},"h":"92fb5f0f99"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This increased blood flow delivers more nutrients to the area, ...)","ko":"이렇게 증가된 혈류는 그 부위에 더 많은 영양소를 ( ), ...","opts":["빼앗는다","막는다","전달한다","없앤다"],"word":"delivers","r":{"a":"3) 전달한다","ev":"7번 문장","s":[[7,"This increased blood flow delivers more nutrients to the area, which speeds up nail growth.","이렇게 증가된 혈류는 그 부위에 더 많은 영양소를 전달하고, 이것은 손톱 성장을 빠르게 한다."]],"w":"7번에서 증가된 혈류가 그 부위에 영양소를 더 많이 가져다줘서 손톱 성장이 빨라져요. deliver는 전달하다예요.","c":3},"h":"221d6fc88d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But socks and shoes prevent toes from receiving as much sunlight as fingers.)","ko":"그러나 양말과 신발은 발가락이 손가락만큼 햇빛을 많이 받는 것을 ( ).","opts":["막는다","돕는다","권한다","기다린다"],"word":"prevent","r":{"a":"1) 막는다","ev":"12번 문장","s":[[12,"But socks and shoes prevent toes from receiving as much sunlight as fingers.","그러나 양말과 신발은 발가락이 손가락만큼 햇빛을 많이 받지 못하게 한다."]],"w":"12번은 양말과 신발 때문에 발가락이 햇빛을 덜 받는다는 내용이에요. prevent A from -ing는 A가 ~하는 것을 막다예요.","c":1},"h":"8b25767c85"},{"n":6,"t":"ref","q":"What does the underlined \"These actions\" refer to?\nThese actions are a stimulus.","ko":"밑줄 친 These actions가 가리키는 것은?","sko":"이러한 행동은 자극이 된다.","opts":["발가락으로 하는 활동들","우리가 손가락으로 하는 여러 가지 일","혈액을 자극이 있는 곳으로 보내는 것","손톱과 발톱이 자라는 것"],"r":{"a":"2) 우리가 손가락으로 하는 여러 가지 일","ev":"3~5번 문장","s":[[3,"We use our fingers much more than our toes.","우리는 발가락보다 손가락을 훨씬 더 많이 사용한다."],[4,"We touch or grab items, and type on our smartphones.","우리는 물건을 만지거나 잡고, 스마트폰에 입력을 한다."],[5,"These actions are a stimulus.","이러한 행동은 자극이 된다."]],"w":"These actions는 바로 앞 4번의 We touch or grab items, and type on our smartphones(우리는 물건을 만지거나 잡고, 스마트폰에 입력을 한다)를 가리켜요. 3번에서 말한 것처럼 손가락을 많이 쓰는 행동들이에요.","c":2},"h":"aeb6eb2d38"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Our bodies send more blood to where the stimulus is.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리 몸은 더 많은 혈액을 자극이 있는 곳으로 보낸다.","opts":["우리 몸은 자극이 없는 곳으로 혈액을 더 많이 보낸다.","우리 몸은 자극이 있는 곳의 혈액을 줄인다.","우리 몸은 혈액을 자극으로 바꾼다.","우리 몸은 자극을 받는 곳으로 혈액을 더 많이 보낸다."],"r":{"a":"4) 우리 몸은 자극을 받는 곳으로 혈액을 더 많이 보낸다.","ev":"6번 문장","s":[[6,"Our bodies send more blood to where the stimulus is.","우리 몸은 더 많은 혈액을 자극이 있는 곳으로 보낸다."]],"w":"where the stimulus is는 '자극이 있는 곳'이에요. 혈액이 자극이 있는 곳으로 더 많이 간다는 뜻이에요.","c":4},"h":"46d746b5c5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["우리의 손과 발에는 모두 손톱, 발톱이 있다.","손톱이 발톱보다 더 느리게 자란다.","손가락을 쓸 때는 혈액이 더 적게 간다.","양말과 신발은 발가락이 햇빛을 더 많이 받게 돕는다."],"opts":["We have nails on both our hands and feet.","Fingernails grow more slowly than toenails.","Fingers get less blood when we use them.","Socks and shoes help toes get more sunlight."],"r":{"a":"1) We have nails on both our hands and feet. (우리의 손과 발에는 모두 손톱, 발톱이 있다.)","ev":"1번 문장","s":[[1,"We have nails on our hands and feet.","우리의 손과 발에는 손톱, 발톱이 있다."]],"w":"1번 We have nails on our hands and feet(우리의 손과 발에는 손톱, 발톱이 있다)와 같아요. 손톱은 발톱보다 더 빨리 자라고, 손가락은 혈액을 더 많이 받으며, 양말과 신발은 햇빛을 막아서 나머지 보기는 본문과 달라요.","c":1},"h":"c2d970d9a8"},{"n":9,"t":"sum","q":"We (A) or grab items, and type on our (B).","ko":"우리는 물건을 (A)거나 잡고, (B)에 입력을 한다.","oko":["(A) 만지 / (B) 스마트폰","(A) 만지 / (B) 신발","(A) 차 / (B) 스마트폰","(A) 차 / (B) 신발","(A) 씻 / (B) 양말"],"opts":["(A) touch / (B) smartphones","(A) touch / (B) shoes","(A) kick / (B) smartphones","(A) kick / (B) shoes","(A) wash / (B) socks"],"r":{"a":"1) (A) touch / (B) smartphones ((A) 만지 / (B) 스마트폰)","ev":"4번 문장","s":[[4,"We touch or grab items, and type on our smartphones.","우리는 물건을 만지거나 잡고, 스마트폰에 입력을 한다."]],"w":"4번 We touch or grab items, and type on our smartphones(우리는 물건을 만지거나 잡고, 스마트폰에 입력을 한다)에서 가져왔어요. kick, wash는 본문에 없고, shoes, socks는 입력하는 물건이 아니에요.","c":1},"h":"1fe6fe4fa2"},{"n":10,"t":"fill","q":"But some people have one big [A] about them: Why do fingernails grow much [B] than toenails?","ko":"하지만 어떤 사람들은 그것들에 대해 한 가지 큰 [A]을(를) 가지고 있다. 왜 손톱은 발톱보다 훨씬 더 [B] 자랄까?","bank":["question","faster","color","sleep","louder","sweeter"],"bko":{"question":"질문","faster":"더 빨리","color":"색깔","sleep":"잠","louder":"더 시끄럽게","sweeter":"더 달게"},"r":{"a":"[A] question (질문), [B] faster (더 빨리)","ev":"2번 문장","s":[[2,"But some people have one big question about them: Why do fingernails grow much faster than toenails?","하지만 어떤 사람들은 그것들에 대해 한 가지 큰 질문을 가지고 있다. 왜 손톱은 발톱보다 훨씬 더 빨리 자랄까?"]],"w":"2번 But some people have one big question about them: Why do fingernails grow much faster than toenails?(하지만 어떤 사람들은 한 가지 큰 질문을 가지고 있다. 왜 손톱은 발톱보다 훨씬 더 빨리 자랄까?)에서 가져왔어요. color, sleep은 big 뒤의 명사로 뜻이 안 맞고, louder, sweeter는 손톱이 자라는 모습을 설명하지 못해요.","c":null},"h":"52a567a05f"}]},{"u":3,"id":"rj1-03-2","no":2,"ko":"취미로 건강해질 수 있다?","items":[{"n":1,"t":"tf","q":"Creative hobbies such as painting or writing can reduce stress.","ko":"그림 그리기나 글쓰기 같은 창의적인 취미는 스트레스를 덜 받게 해 줄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Studies suggest that creative hobbies such as painting, writing, or playing a musical instrument reduce stress.","연구들은 그림 그리기, 글쓰기, 혹은 악기 연주와 같은 창의적인 취미들이 스트레스를 줄인다는 것을 시사한다."]],"w":"4번에서 그림 그리기, 글쓰기, 악기 연주 같은 창의적인 취미가 스트레스를 줄인다고 해요.","c":"T"},"h":"95a143eb19"},{"n":2,"t":"tf","q":"Only drawing is good for the brain.","ko":"그림 그리기만 뇌에 좋다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"It doesn’t matter whether you draw, sing, or dance.","당신이 그림을 그리든, 노래를 부르든, 춤을 추든 상관이 없다."],[12,"Expressing your creativity is good for the brain.","당신의 창의력을 표현하는 것은 뇌에 좋다."]],"w":"11번에서 그림을 그리든, 노래를 부르든, 춤을 추든 상관없다고 하고, 12번에서 창의력을 표현하는 것이 뇌에 좋다고 해요. 그림만 좋다는 말은 아니에요.","c":"F"},"h":"fecf135b5d"},{"n":3,"t":"tf","q":"Creative hobbies are also good for our brain.","ko":"창의적인 취미는 또한 우리의 뇌에도 좋다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Creative hobbies are also good for our brain.","창의적인 취미는 또한 우리의 뇌에도 좋다."]],"w":"7번 문장에 Creative hobbies are also good for our brain이라고 그대로 나와요.","c":"T"},"h":"763025a872"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Studies suggest that creative hobbies ... reduce stress.)","ko":"연구들은 창의적인 취미들이 스트레스를 ( ) 것을 시사한다.","opts":["늘린다","줄인다","만든다","피한다"],"word":"reduce","r":{"a":"2) 줄인다","ev":"4번 문장","s":[[4,"Studies suggest that creative hobbies such as painting, writing, or playing a musical instrument reduce stress.","연구들은 그림 그리기, 글쓰기, 혹은 악기 연주와 같은 창의적인 취미들이 스트레스를 줄인다는 것을 시사한다."]],"w":"4번은 창의적인 취미가 스트레스에 어떤 영향을 주는지 말해요. 5번에서 덜 걱정하고 덜 슬퍼진다고 하니 스트레스를 줄인다는 뜻이에요. reduce는 줄이다예요.","c":2},"h":"804d65cec2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This is because it helps us release our negative emotions.)","ko":"이것은 우리가 ( ) 감정들을 방출하는 것을 돕기 때문이다.","opts":["긍정적인","새로운","조용한","부정적인"],"word":"negative","r":{"a":"4) 부정적인","ev":"5~6번 문장","s":[[5,"Doing creative things makes us feel less worried and sad.","창의적인 것을 하는 일은 우리를 덜 걱정하고 덜 슬프게 한다."],[6,"This is because it helps us release our negative emotions.","이것은 우리가 부정적인 감정들을 방출하는 것을 돕기 때문이다."]],"w":"5번에서 덜 걱정하고 덜 슬퍼진다고 했어요. 걱정과 슬픔 같은 감정을 내보낸다는 이야기라서 negative는 부정적인이에요.","c":4},"h":"56a643dfe9"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey activate both sides of the brain.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 뇌의 양쪽을 활성화시킨다.","opts":["창의적인 취미","음악가들","뇌의 양쪽","다양한 감정들"],"r":{"a":"1) 창의적인 취미","ev":"7~8번 문장","s":[[7,"Creative hobbies are also good for our brain.","창의적인 취미는 또한 우리의 뇌에도 좋다."],[8,"They activate both sides of the brain.","그것들은 뇌의 양쪽을 활성화시킨다."]],"w":"8번의 They는 바로 앞 7번의 Creative hobbies(창의적인 취미)를 가리켜요. 창의적인 취미가 뇌의 양쪽을 활성화시킨다는 뜻이에요.","c":1,"k":"They = 창의적인 취미"},"pron":"They","h":"acd067f966"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But creative hobbies can also make us healthy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 창의적인 취미는 또한 우리를 건강하게 만들 수 있다.","opts":["하지만 창의적인 취미도 우리를 건강하게 만들 수 있다.","하지만 창의적인 취미는 우리를 아프게 만들 수 있다.","하지만 운동만이 우리를 건강하게 만든다.","하지만 건강한 사람만 창의적인 취미를 가질 수 있다."],"r":{"a":"1) 하지만 창의적인 취미도 우리를 건강하게 만들 수 있다.","ev":"2~3번 문장","s":[[2,"Exercise probably comes to mind first.","운동이 아마도 먼저 떠오를 것이다."],[3,"But creative hobbies can also make us healthy.","하지만 창의적인 취미는 또한 우리를 건강하게 만들 수 있다."]],"w":"2번에서 운동이 먼저 떠오른다고 했고, 3번은 But으로 이어져 창의적인 취미도 건강하게 만든다고 해요. also는 '~도'라는 뜻이에요.","c":1},"h":"875855a69a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["운동만이 건강을 지키는 유일한 방법이다.","건강을 생각할 때 운동이 아마도 먼저 떠오를 것이다.","창의적인 취미는 음악가에게만 좋다.","창의적인 취미는 우리의 뇌에 나쁘다."],"opts":["Exercise is the only way to stay healthy.","Exercise probably comes to mind first when we think about health.","Creative hobbies are good only for musicians.","Creative hobbies are bad for our brain."],"r":{"a":"2) Exercise probably comes to mind first when we think about health. (건강을 생각할 때 운동이 아마도 먼저 떠오를 것이다.)","ev":"1~2번 문장","s":[[1,"What can make us healthy?","무엇이 우리를 건강하게 만들 수 있을까?"],[2,"Exercise probably comes to mind first.","운동이 아마도 먼저 떠오를 것이다."]],"w":"1~2번에서 건강을 만드는 것으로 운동이 먼저 떠오른다고 했어요(Exercise probably comes to mind first. 운동이 아마도 먼저 떠오를 것이다). 하지만 3번에서 창의적인 취미도 건강하게 만든다고 했으니 운동이 유일한 방법은 아니에요.","c":2},"h":"1a021bf6dd"},{"n":9,"t":"sum","q":"Doing creative things makes us feel less (A) and (B).","ko":"창의적인 것을 하는 일은 우리가 덜 (A) 덜 (B) 느끼게 만든다.","oko":["(A) 걱정되는 / (B) 슬픈","(A) 걱정되는 / (B) 행복한","(A) 피곤한 / (B) 슬픈","(A) 행복한 / (B) 신나는","(A) 피곤한 / (B) 배고픈"],"opts":["(A) worried / (B) sad","(A) worried / (B) happy","(A) tired / (B) sad","(A) happy / (B) excited","(A) tired / (B) hungry"],"r":{"a":"1) (A) worried / (B) sad ((A) 걱정되는 / (B) 슬픈)","ev":"5번 문장","s":[[5,"Doing creative things makes us feel less worried and sad.","창의적인 것을 하는 일은 우리를 덜 걱정하고 덜 슬프게 한다."]],"w":"5번 Doing creative things makes us feel less worried and sad(창의적인 것을 하는 일은 우리를 덜 걱정하고 덜 슬프게 한다)에서 가져왔어요. happy, excited는 좋은 기분이라 less와 맞지 않고, tired, hungry는 본문에 나오지 않아요.","c":1},"h":"a306b918f8"},{"n":10,"t":"fill","q":"Research [A] that the left and right sides of musicians’ brains are better [B].","ko":"연구는 음악가들의 뇌의 왼쪽과 오른쪽이 더 잘 [B] 것을 [A].","bank":["shows","connected","eats","sleeps","blue","quiet"],"bko":{"shows":"보여준다","connected":"연결된","eats":"먹는다","sleeps":"잔다","blue":"파란","quiet":"조용한"},"r":{"a":"[A] shows (보여준다), [B] connected (연결된)","ev":"9번 문장","s 다예요.","c":3},"h":"25d2e84ec1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (For example, doctors must perform difficult jobs with their hands and use a computer at the same time.)","ko":"예를 들어, 의사들은 손으로 어려운 일을 ( ) 동시에 컴퓨터를 사용해야만 한다.","opts":["수행하다","포기하다","설명하다","구경하다"],"word":"perform","r":{"a":"1) 수행하다","ev":"12번 문장","s":[[12,"For example, doctors must perform difficult jobs with their hands and use a computer at the same time.","예를 들어, 의사들은 손으로 어려운 일을 하면서 동시에 컴퓨터를 사용해야만 한다."]],"w":"12번은 의사들이 손으로 어려운 일을 하는 모습이에요. perform은 일을 수행하다예요.","c":1},"h":"5567a3b142"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen you move your eyes, it follows them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"당신이 눈을 움직일 때, 그것이 그것들을 따라간다.","opts":["카메라","컴퓨터 화면","손들","당신의 눈들"],"r":{"a":"4) 당신의 눈들","ev":"8번 문장","s":[[8,"When you move your eyes, it follows them.","당신이 눈을 움직일 때, 그것(카메라)이 그것들(눈)을 따라간다."]],"w":"8번의 them은 같은 문장의 your eyes를 가리켜요. 당신이 눈을 움직이면 카메라(it)가 눈들(them)을 따라간다는 뜻이에요.","c":4},"h":"e2f425cbd3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is not something from science fiction.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 공상 과학 소설에서 나오는 어떤 것이 아니다.","opts":["이것은 공상 과학 소설에서 가져온 이야기이다.","이것은 공상 과학 소설에나 나오는 일이 아니라 실제로 있는 것이다.","이것은 공상 과학 소설을 쓰는 방법이다.","이것은 공상 과학 소설보다 더 재미없다."],"r":{"a":"2) 이것은 공상 과학 소설에나 나오는 일이 아니라 실제로 있는 것이다.","ev":"4~5번 문장","s":[[4,"This is not something from science fiction.","이것은 공상 과학 소설에서 나오는 어떤 것이 아니다."],[5,"It is an eye-tracking computer.","그것은 안구 추적 컴퓨터이다."]],"w":"4번은 이것이 공상 과학 소설에서 나오는 어떤 것이 아니라는 말이고, 5번에서 안구 추적 컴퓨터라고 정체를 밝혀요. 실제로 있는 컴퓨터라는 뜻이에요.","c":2},"h":"cf6e8db745"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["안구 추적 컴퓨터를 쓰려면 안경을 써야 한다.","어떤 것을 클릭하려면 손이 꼭 필요하다.","눈을 깜빡임으로써 어떤 것을 클릭할 수 있다.","카메라는 당신의 눈을 따라갈 수 없다."],"opts":["You must wear glasses to use an eye-tracking computer.","You need your hands to click on something.","You can click on some past, people couldn’t make a single cup of tea.","과거에 사람들은 단 한 잔의 차만을 만들 수는 없었다."],[2,"They had to make a whole pot.","그들은 주전자 가득 만들어야 했다."]],"w":"1번에서 과거에는 차 한 잔만 만들 수 없었다고 하고, 2번에서 주전자 가득 만들어야 했다고 해요.","c":"T"},"h":"83c4189466"},{"n":2,"t":"tf","q":"Sullivan wanted customers to put the whole bag in the water.","ko":"설리번은 고객들이 봉지 전체를 물에 넣기를 원했다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"He expected them to put only the tea leaves in boiling water.","그는 그들이 끓는 물에 찻잎만 넣기를 기대했다."]],"w":"10번에서 설리번은 고객들이 끓는 물에 찻잎만 넣기를 기대했다고 해요. 봉지 째 넣은 것은 일부 고객이 우연히 한 일이에요(11번).","c":"F"},"h":"917b7f8421"},{"n":3,"t":"tf","q":"The way people make tea changed because of tea bags.","ko":"티백 때문에 사람들이 차를 만드는 방법이 바뀌었다.","r":{"a":"T (본문과 맞는 내용)","ev":"14~15번 문장","s":[[14,"So Sullivan started selling tea bags in his shop.","그래서 Sullivan은 그의 가게에서 티백을 팔기 시작했다."],[15,"The way people make tea was changed forever.","사람들이 차를 만드는 방법은 영원히 바뀌었다."]],"w":"14번에서 설리번이 가게에서 티백을 팔기 시작했고, 15번에서 사람들이 차를 만드는 방법이 영원히 바뀌었다고 해요.","c":"T"},"h":"556190b0a5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This was inconvenient and created waste.)","ko":"이것은 ( ), 낭비를 만들었다.","opts":["편리했고","불편했고","값쌌고","특별했고"],"word":"inconvenient","r":{"a":"2) 불편했고","ev":"2~3번 문장","s":[[2,"They had to make a whole pot.","그들은 주전자 가득 만들어야 했다."],[3,"This was inconvenient and created waste.","이것은 불편했고 낭비를 만들었다."]],"w":"2번에서 차 한 잔을 위해 주전자 가득 만들어야 했고, 3번에서 그 일이 낭비를 만들었다고 해요. 그래서 inconvenient는 불편한이에요.","c":2},"h":"af673fbca2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But some of them accidentally put the whole bag in.)","ko":"그러나 그들 중 일부가 ( ) 전체 봉지를 넣었다.","opts":["일부러","빠르게","우연히","천천히"],"word":"accidentally","r":{"a":"3) 우연히","ev":"10~11번 문장","s":[[10,"He expected them to put only the tea leaves in boiling water.","그는 그들이 끓는 물에 찻잎만 넣기를 기대했다."],[11,"But some of them accidentally put the whole bag in.","그러나 그들 중 일부가 우연히 전체 봉지를 넣었다."]],"w":"10번에서 설리번은 찻잎만 넣기를 기대했어요. 11번의 But 뒤는 예상 밖의 일이라 봉지 전체를 의도하지 않고 넣었다는 뜻이에요. accidentally는 우연히예요.","c":3},"h":"81065cd82f"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThere are several stories about who created it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"누가 그것을 만들었는지에 관한 몇 가지 이야기가 있다.","opts":["주전자 가득 만든 차","티백","차 한 잔","Thomas Sullivan"],"r":{"a":"2) 티백","ev":"4~5번 문장","s":[[4,"But then the tea bag was invented.","하지만 그 후 티백이 발명되었다."],[5,"There are several stories about who created it.","누가 그것을 만들었는지에 관한 몇 가지 이야기가 있다."]],"w":"5번의 it은 4번에서 발명된 the tea bag(티백)이에요. 누가 티백을 만들었는지에 관한 이야기가 여러 개 있다는 뜻이에요.","c":2},"h":"bd8f5aa358"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But then the tea bag was invented.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그 후 티백이 발명되었다.","opts":["하지만 그 후 티백이 사라졌다.","하지만 그 후 티백을 발명한 사람이 죽었다.","하지만 그 후 티백이 발명되었다.","하지만 그 후 사람들은 티백을 버렸다."],"r":{"a":"3) 하지만 그 후 티백이 발명되었다.","ev":"4번 문장","s":[[4,"But then the tea bag was invented.","하지만 그 후 티백이 발명되었다."]],"w":"4번 But then the tea bag was invented(하지만 그 후 티백이 발명되었다)에서 was invented는 ‘발명되었다’라는 뜻이에요. 티백이 사라지거나 버려졌다는 말은 없어요.","c":3},"h":"ca69335815"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["일부 고객들은 티백이 차를 만드는 데 편리하다고 생각했다.","설리번은 호텔에 차를 팔았다.","고객들은 더 큰 찻주전자를 원했다.","티백이 있기 전에도 사람들은 차 한 잔만 만들 수 있었다."],"opts":["Some customers found the tea bag convenient for brewing tea.","Sullivan sold his tea to hotels.","Customers wanted a bigger tea pot.","People could make a single cup of tea before tea bags."],"r":{"a":"1) Some customers found the tea bag convenient for brewing tea.","ev":"12번 문장","s":[[12,"They found it convenient for brewing tea.","그들은 그것이 차를 만드는 데 편리하다고 생각했다."]],"w":"12번 They found it convenient for brewing tea(그들은 그것이 차를 만드는 데 편리하다고 생각했다)와 같아요. 설리번은 뉴욕에서 차를 팔았고, 고객들은 티백을 더 요구했으며, 티백 전에는 한 잔만 만들 수 없었어요.","c":1},"h":"d2915d94f8"},{"n":9,"t":"sum","q":"Customers (A) for more tea bags, so Sullivan started (B) tea bags in his shop.","ko":"고객들이 더 많은 티백을 (A), 그래서 Sull
