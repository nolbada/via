<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>보카스위치 미션 고교편</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&family=Gaegu:wght@400;700&family=Source+Serif+4:ital,wght@0,400;0,600;1,400&display=swap">
<style>

/* Layout: single column app. Header with two tabs; mission cards; book-note list; sentence list with tap-to-open rows. */
:root{
  --bg:#f4f6f8;
  --surface:#ffffff;
  --fg:#16202a;
  --muted:#5b6876;
  --line:#d9e0e7;
  --accent:#0b5fa5;        /* target word */
  --accent-soft:#e3eefa;
  --ok:#1b7a43;
  --ok-soft:#e2f3e8;
  --bad:#b3261e;
  --bad-soft:#fbe6e4;
  --font:'Noto Sans KR',system-ui,-apple-system,'Segoe UI','Malgun Gothic',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f161d;--surface:#18222c;--fg:#e8eef4;--muted:#9aa8b6;--line:#2a3846;
    --accent:#6db3f2;--accent-soft:#1a2f45;--ok:#5fcf8c;--ok-soft:#173225;--bad:#ff8a80;--bad-soft:#3a1f1d;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f161d;--surface:#18222c;--fg:#e8eef4;--muted:#9aa8b6;--line:#2a3846;
  --accent:#6db3f2;--accent-soft:#1a2f45;--ok:#5fcf8c;--ok-soft:#173225;--bad:#ff8a80;--bad-soft:#3a1f1d;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.55;padding-inline:16px;padding-block:16px 48px}
.wrap{max-width:640px;margin-inline:auto;display:flex;flex-direction:column;gap:16px}
header{display:flex;flex-direction:column;gap:12px}
.brand{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.brand h1{font-size:1.15rem;margin:0;letter-spacing:.04em}
.brand span{color:var(--muted);font-size:.85rem}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{appearance:none;border:0;background:none;font:inherit;color:var(--muted);padding:10px 14px;min-height:44px;cursor:pointer;border-bottom:3px solid transparent;margin-bottom:-1px}
.tab[aria-selected="true"]{color:var(--fg);font-weight:700;border-bottom-color:var(--accent)}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:16px}
.prog{display:flex;align-items:center;gap:12px;color:var(--muted);font-size:.85rem;font-variant-numeric:tabular-nums}
.bar{flex:1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);width:0;transition:width .25s}
.word{font-size:2rem;font-weight:700;color:var(--accent);margin:0;line-height:1.2;letter-spacing:.01em}
.addr{display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.addr .pg{font-size:.9rem;color:var(--muted);margin-right:4px}
.chip{display:inline-flex;align-items:center;justify-content:center;min-width:52px;height:44px;padding-inline:12px;border-radius:8px;border:1px solid var(--line);background:var(--bg);font-weight:700;font-size:1.15rem;font-variant-numeric:tabular-nums}
.q{margin:0;font-weight:500}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{appearance:none;font:inherit;font-weight:500;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:10px 16px;min-height:48px;cursor:pointer;flex:1 1 140px}
.opt:hover{border-color:var(--accent)}
.opt[disabled]{opacity:.5;cursor:default}
.msg{padding:10px 14px;border-radius:8px;font-size:.95rem}
.msg.bad{background:var(--bad-soft);color:var(--bad)}
.msg.ok{background:var(--ok-soft);color:var(--ok);font-weight:500}
.reveal{display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--line);padding-top:16px}
.rv{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline}
.rv .no{font-weight:700;font-variant-numeric:tabular-nums;min-width:40px}
.rv .mean{font-weight:700;color:var(--accent)}
.rv .sent{grid-column:2;color:var(--muted);font-size:.9rem}
.rv .ko,.nrow .ko,.rv .tg,.nrow .tg{grid-column:2}
.tg{color:var(--muted);font-size:.9rem}
.nrow .ko{color:var(--muted);font-size:.95rem}
.primary{appearance:none;font:inherit;font-weight:700;background:var(--accent);color:var(--bg);border:0;border-radius:8px;padding:12px 20px;min-height:48px;cursor:pointer;align-self:flex-start}
.t{color:var(--accent);font-weight:700}
u{text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:4px}
/* note */
.note h2,.corner h2{margin:0;font-size:1.1rem}
.score{color:var(--muted);font-size:.95rem}
.pghead{font-weight:700;font-size:.9rem;color:var(--muted);letter-spacing:.04em;margin-top:8px;padding-bottom:4px;border-bottom:1px solid var(--line)}
.nrow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line)}
.nrow .no{font-weight:700;font-variant-numeric:tabular-nums}
.nrow .vb{font-size:.95rem}
.nrow.hd{grid-template-columns:84px minmax(0,1fr);margin-top:8px;border-bottom:0;padding-bottom:0}
.sym{font-size:1.3rem;font-weight:700;white-space:nowrap;margin-right:6px}
.wline{font-size:1.05rem}
.nrow .mean{font-weight:700;color:var(--accent);grid-column:2}
/* corner */
.legend{display:flex;flex-wrap:wrap;gap:16px;font-size:.9rem;color:var(--muted)}
.srow{display:grid;grid-template-columns:40px minmax(0,1fr);gap:6px 12px;padding:14px 0;border-bottom:1px solid var(--line);align-items:baseline}
.srow .no{font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.srow .en{font-size:1.02rem;overflow-wrap:anywhere}
.srow .info{grid-column:2;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:baseline}
.srow .m{background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:2px 10px}
.srow .k{color:var(--fg)}
.mrow{display:flex;flex-direction:column;gap:8px;padding-block:8px}
.mrow .lab{display:flex;align-items:center;gap:8px;font-weight:700}
.opt.sel{border-color:var(--accent);background:var(--accent-soft);color:var(--accent);font-weight:700}
.pgline{color:var(--muted);font-size:.9rem}
@media (prefers-reduced-motion:reduce){.bar i{transition:none}}

.sel{font:inherit;font-weight:700;color:var(--fg);background:var(--surface);border:1.5px solid var(--line);border-radius:8px;padding:8px 12px;min-height:44px}
.top{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.memolink{margin-left:auto;color:var(--accent);font-weight:700;text-decoration:none;font-size:.9rem;padding:10px 4px}


.msum{margin:0}
.msum .mh{font-size:13px;font-weight:700;color:var(--muted);margin:0 0 6px}
.msum .ml{display:grid;grid-template-columns:22px 1fr;gap:6px;padding:5px 0;font-size:15px}
.msum .ml .i{color:var(--muted)}
.msum .ml em{font-style:normal;font-size:13px;color:var(--muted);margin-left:6px}
.msum .meg{margin-top:12px;background:var(--bad-soft);border-radius:10px;padding:12px}
.msum .meg .lb{font-size:12px;color:var(--muted);margin:6px 0 0}
.msum .meg .a{margin:0;font-size:15px;overflow-wrap:anywhere}
.msum .meg .a.x{text-decoration:line-through}
.msum .meg .a.ok{font-weight:700}
.msum .meg .why{font-size:13px;margin:8px 0 0}


.cover{position:fixed;inset:0;z-index:100;display:flex;justify-content:center;background:var(--c4);font-family:"Noto Sans KR","Malgun Gothic","Apple SD Gothic Neo",system-ui,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
.cover[hidden]{display:none}
.cover .pg{width:100%;max-width:min(760px,calc(100vh * .5));height:100%;display:flex;flex-direction:column;container-type:inline-size}
.cover .c-top{flex:1.25;min-height:0;background:var(--c1);color:#151415;padding:6cqw 7cqw;display:flex;flex-direction:column;justify-content:space-between}
.cover .c-top small{font-size:3.6cqw;font-weight:700;letter-spacing:.22em}
.cover .c-top h1{margin:0;font-size:19cqw;font-weight:900;letter-spacing:-.03em;line-height:1.02}
.cover .c-mid{background:var(--c3);color:#151415;display:flex;align-items:center;justify-content:space-between;padding:5cqw 7cqw}
.cover .tg{width:24cqw;height:12cqw;border-radius:999px;background:rgba(255,255,255,.9);position:relative;box-shadow:inset 0 0 0 .8cqw rgba(0,0,0,.12)}
.cover .tg::after{content:"";position:absolute;top:1.4cqw;left:1.4cqw;width:9.2cqw;height:9.2cqw;border-radius:50%;background:var(--c4);transition:left .25s}
.cover:active .tg::after{left:13.4cqw}
.cover .c-mid div{text-align:right;line-height:1}
.cover .c-mid b{display:block;font-size:6.2cqw;font-weight:800;margin-bottom:1.4cqw}
.cover .c-mid i{font-style:normal;font-size:21cqw;font-weight:300;letter-spacing:.01em}
.cover .c-bot{flex:1;min-height:0;background:var(--c4);color:#fff;padding:6cqw 7cqw;display:flex;flex-direction:column;justify-content:space-between}
.cover .c-bot em{font-style:normal;font-size:4.3cqw;color:var(--c2);line-height:1.5}
.cover .c-bot p{margin:0;font-size:12.5cqw;font-weight:300;letter-spacing:.02em;line-height:1.18}
.cover .c-bot button{align-self:flex-start;font:inherit;font-size:5.4cqw;font-weight:800;color:#151415;background:var(--c1);border:0;border-radius:999px;padding:3.2cqw 12cqw;min-height:44px}

html,body{max-width:100%;overflow-x:hidden;overscroll-behavior-x:none}
body{touch-action:pan-y pinch-zoom;-webkit-text-size-adjust:100%}
.wrap{width:100%;min-width:0}
.tabs{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2px}
.tab{padding:10px 2px;font-size:.88rem;text-align:center;white-space:nowrap;min-width:0}
.card,.srow .en,.nrow{min-width:0}
:root{--tk:#e97b44;--tk-soft:rgba(233,123,68,.13)}
.memo{display:flex;flex-direction:column;gap:16px}
.mhead{display:flex;flex-direction:column;gap:4px;padding:4px 2px 0}
.mhead .mk{align-self:flex-start;background:var(--tk);color:#151415;font-weight:900;font-size:.8rem;letter-spacing:.06em;padding:3px 10px;border-radius:999px}
.mhead h2{margin:0;font-size:1.35rem;font-weight:900;letter-spacing:-.01em}
.mc{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden;min-width:0}
.mc .top2{display:flex;gap:10px;align-items:center;padding:12px 14px;background:var(--tk-soft);border-bottom:1px solid var(--line)}
.mc .nb{flex:none;width:28px;height:28px;border-radius:50%;background:var(--tk);color:#151415;font-weight:900;display:grid;place-items:center;font-size:.9rem}
.mc .tt{margin:0;font-size:1.02rem;font-weight:800;line-height:1.35;overflow-wrap:anywhere;min-width:0}
.grp{padding:12px 14px 4px;min-width:0}
.gh{display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline;margin-bottom:4px}
.gh b{font-family:'Source Serif 4',Georgia,serif;font-size:1.05rem;color:var(--accent)}
.gh span{font-weight:700;font-size:.92rem}
.easy{font-size:.88rem;color:var(--muted);margin:0 0 8px;padding-left:10px;border-left:3px solid var(--tk)}
.cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);font-size:.72rem;font-weight:700;letter-spacing:.08em;color:var(--muted);padding:8px 14px 0;gap:0 12px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:0 12px;padding:9px 0;border-top:1px dashed var(--line);align-items:start}
.pair:first-of-type{border-top:0}
.pair .l{font-family:'Source Serif 4',Georgia,serif;font-size:.98rem;line-height:1.5;overflow-wrap:anywhere;min-width:0}
.pair .l .pn{display:inline-block;font-family:var(--font);font-size:.75rem;font-weight:800;color:var(--muted);margin-right:5px}
.pair .rr{font-size:.92rem;line-height:1.5;border-left:2px solid var(--line);padding-left:10px;overflow-wrap:anywhere;min-width:0}
.pair .rr .mp{display:inline-block;background:var(--accent-soft);color:var(--accent);font-weight:700;border-radius:6px;padding:0 7px;margin-bottom:3px;font-size:.85rem}
.care2{margin:8px 14px 12px;background:var(--tk-soft);border-radius:10px;padding:10px 12px;font-size:.92rem;font-weight:500}
.care2 b{display:block;font-size:.72rem;letter-spacing:.08em;color:var(--muted);margin-bottom:2px}
.mc .chk2{appearance:none;font:inherit;font-weight:700;font-size:.9rem;color:var(--fg);background:var(--bg);border:1.5px solid var(--line);border-radius:999px;padding:8px 14px;margin:0 14px 14px;min-height:44px;cursor:pointer;display:inline-flex;align-items:center;gap:8px}
.mc .chk2 i{width:18px;height:18px;border:2px solid var(--muted);border-radius:5px;display:inline-block;position:relative}
.mc .chk2[aria-pressed="true"]{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mc .chk2[aria-pressed="true"] i{background:var(--ok);border-color:var(--ok)}
.mc .chk2[aria-pressed="true"] i::after{content:"";position:absolute;left:4px;top:0;width:5px;height:10px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.egg2{background:var(--surface);border:1px dashed var(--tk);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:8px}
.egg2 label{font-weight:800;font-size:.92rem}
.egg2 .sent{font-family:'Source Serif 4',Georgia,serif;font-size:1rem;margin:0;overflow-wrap:anywhere}
.egg2 input{width:100%;font:inherit;font-size:1rem;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;min-height:46px}
.go{display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.go p{margin:0;font-size:.92rem;color:var(--muted)}
.go .primary{align-self:stretch;text-align:center;background:var(--tk);color:#151415;font-size:1.05rem}
@media (max-width:340px){.cols{display:none}.pair{grid-template-columns:minmax(0,1fr)}.pair .rr{border-left:0;padding-left:0;margin-top:4px}}
.msub{margin:0;color:var(--muted);font-weight:700;font-size:1rem}
.go .mis{display:flex;gap:10px;align-items:center}
.go .mis b{flex:none;background:var(--tk);color:#151415;padding:3px 12px;border-radius:999px;font-size:.8rem;letter-spacing:.06em}
.go .mis p{color:var(--fg);font-weight:800;font-size:1.05rem}
.pghead{line-height:1.6}
.card>.opt{flex:none}
.photo{border-radius:18px;overflow:hidden;background:var(--surface);border:1px solid var(--line)}
.ph-top{background:var(--tk);color:#151415;padding:22px 22px 20px;display:flex;flex-direction:column;gap:4px}
.ph-top small{font-weight:800;letter-spacing:.2em;font-size:.72rem}
.ph-top h2{margin:0;font-size:3.2rem;font-weight:900;line-height:1.05;letter-spacing:-.02em}
.ph-top span{font-weight:700;font-size:1rem}
.ph-grid{display:grid;grid-template-columns:1fr 1fr}
.ph-grid>div{padding:22px 20px;display:flex;flex-direction:column;gap:6px;min-width:0}
.ph-grid>div+div{border-left:1px solid var(--line)}
.ph-grid i{font-style:normal;font-weight:700;font-size:.85rem;color:var(--muted)}
.ph-grid b{font-size:2.1rem;font-weight:900;line-height:1.1;font-variant-numeric:tabular-nums}
.mis{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-left:5px solid var(--tk);border-radius:12px;padding:12px 14px}
.mis b{flex:none;background:var(--tk);color:#151415;padding:3px 10px;border-radius:999px;font-size:.78rem;letter-spacing:.04em}
.mis p{margin:0;font-weight:800;font-size:1rem;line-height:1.4;min-width:0}
.card>.mis{background:var(--bg)}
.wl{display:flex;flex-direction:column;gap:2px}
.wl .mis{margin-bottom:8px;background:var(--bg)}
.wrow{display:grid;grid-template-columns:48px minmax(0,1fr);gap:0 8px;padding:10px 0;border-bottom:1px solid var(--line)}
.wrow .no{font-weight:700;font-variant-numeric:tabular-nums}
</style>
</head>
<body>
<div id="cover" class="cover" style="--c1:#e97b44;--c2:#7cbadd;--c3:#5d9dcb;--c4:#3f221c"><div class="pg">
<div class="c-top"><small>VOCA SWITCH · HIGH SCHOOL</small><h1>보카<br>스위치</h1></div>
<div class="c-mid"><span class="tg"></span><div><b>고교</b><i>1260</i></div></div>
<div class="c-bot"><em>문맥 속에서 다의어 감을 잡는<br>콜로케이션 연습</em><p>CONTEXT<br>COMPLETE</p><button type="button" id="cstart">시작</button></div>
</div></div>
<div class="wrap">
  <header>
    <div class="brand"><h1>VOCA SWITCH</h1><span>고교 어휘 · UNIT 01–63</span></div>
    <div class="top"><select id="usel" class="sel" aria-label="UNIT"></select></div>
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" id="tab-k" aria-selected="true">이것만은 꼭</button>
      <button class="tab" role="tab" id="tab-m" aria-selected="false">스위치 미션</button>
      <button class="tab" role="tab" id="tab-c" aria-selected="false">해석 코너</button>
      <button class="tab" role="tab" id="tab-r" aria-selected="false">오답노트</button>
    </div>
  </header>
  <main id="view"></main>
</div>

  if(wrong.length){
    var cur2=state.wr[state.i]||[];
    wrong.forEach(function(n){if(cur2.indexOf(n)<0)cur2.push(n)});
    state.wr[state.i]=cur2;
  }
  result(wrong.length===0);
}
var memoSt={};
function MS(u){if(!memoSt[u.id])memoSt[u.id]={done:u.cards.map(function(){return false}),fix:''};return memoSt[u.id]}
function xs(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;')}
function pad2(u){return (u<10?'0':'')+u}
function pairHTML(n,labelFallback,mean){
  var d=S[n];
  var en=d?d[0]:xs(labelFallback),ko=d?d[2]:'';
  return '<div class="pair"><div class="l"><span class="pn">'+n+'</span>'+en+'</div><div class="rr"><span class="mp">'+xs(mean)+'</span><br>'+ko+'</div></div>';
}
function renderMemo(){
  var u=MEMO[cur];
  if(!u){var c0=el('section','card');c0.appendChild(el('div','msg ok','이 UNIT은 메모 없음'));view.appendChild(c0);return}
  var s=MS(u),n=u.cards.length,y=window.pageYOffset;
  var wrap=el('div','memo');
  wrap.appendChild(el('div','mhead','<span class="mk">UNIT '+pad2(cur)+'</span><h2>이것만은 꼭!</h2><p class="msub">핵심 '+n+'가지</p>'));
  wrap.appendChild(el('div','mis','<b>미션 1</b><p>교재 여백에 해석 쓰기 + 포인트 적기</p>'));
  u.cards.forEach(function(c,i){
    var h='<div class="top2"><span class="nb">'+(i+1)+'</span><p class="tt">'+xs(c.t)+'</p></div><div class="cols"><span>본문</span><span>해석</span></div>';
    c.rows.forEach(function(r){
      var nums=(String(r[1]).match(/\d+/g)||[]).map(Number);
      h+='<div class="grp"><div class="gh"><b>'+xs(r[0])+'</b><span>'+xs(r[2])+'</span></div><p class="easy">'+xs(r[3])+'</p>';
      nums.forEach(function(k){h+=pairHTML(k,r[0],r[2])});
      h+='</div>';
    });
    if(c.ex)h+='<div class="grp"><div class="pair"><div class="l">'+xs(c.ex.en)+'</div><div class="rr">'+xs(c.ex.ko)+'</div></div></div>';
    h+='<div class="care2"><b>포인트</b>'+xs(c.care)+'</div>';
    var card=el('section','mc',h);wrap.appendChild(card);
  });
  if(u.egg){wrap.appendChild(el('div','egg2','<label for="fix">#'+u.egg.n+' 문장 어색한 곳 1군데 고쳐 쓰기</label><p class="sent">'+xs(u.egg.wrong)+'</p><input id="fix" type="text" maxlength="80" value="'+xs(s.fix)+'" autocomplete="off">'))}
  var go=el('div','go');
  var gb=el('button','primary','스위치 미션 시작');gb.onclick=function(){state.tab='m';render();window.scrollTo(0,0)};
  go.appendChild(gb);wrap.appendChild(go);
  view.appendChild(wrap);
  var f=wrap.querySelector('#fix');if(f)f.oninput=function(){s.fix=f.value};
}
function memoSummary(){
  var u=MEMO[cur];var box=el('div','msum');if(!u)return box;
  var s=MS(u);var h='';
  if(u.egg){var f=u.egg;function x(v){return String(v).replace(/&/g,'&amp;').replace(/</g,'&lt;')}
    h+='<div class="meg"><div class="mh">숨은그림 확인 : '+f.n+'번</div><p class="lb">책 문장</p><p class="a x">'+x(f.wrong)+'</p><p class="lb">내가 고친 문장</p><p class="a">'+((s.fix||'').trim()?x(s.fix):'(작성 없음)')+'</p><p class="lb">정답</p><p class="a ok">'+x(f.right)+'</p><p class="why">'+x(f.why)+'</p></div>'}
  box.innerHTML=h;return box;
}
function renderNote(){
  var card=el('section','card note');
  var d=new Date();var dn=['일','월','화','수','목','금','토'];
  var items=[];
  M.forEach(function(m,i){(state.wr[i]||[]).forEach(function(n){items.push({n:n,w:m.w})})});
  items.sort(function(a,b){return a.n-b.n});
  if(!state.saved){
    state.saved=true;state.secs=Math.round((Date.now()-(state.t0||Date.now()))/1000);
    var recs=loadRecs();
    recs.push({t:d.getTime(),date:(d.getMonth()+1)+'/'+d.getDate()+'('+dn[d.getDay()]+')',time:ftime(d),unit:cur,ok:state.firstOK,total:M.length,dur:state.secs,
      items:items.map(function(it){return {n:it.n,w:it.w,en:S[it.n][0],m:S[it.n][1],tg:tag(it.n),ko:S[it.n][2]}})});
    saveRecs(recs);
  }
  var photo=el('div','photo','<div class="ph-top"><small>VOCA SWITCH · '+(TRACK==='h'?'HIGH SCHOOL':'CSAT')+'</small><h2>UNIT '+(cur<10?'0':'')+cur+'</h2><span>'+(d.getMonth()+1)+'/'+d.getDate()+'('+dn[d.getDay()]+') '+ftime(d)+'</span></div><div class="ph-grid"><div><i>학습 시간</i><b>'+fdur(state.secs||0)+'</b></div><div><i>첫 시도 정답</i><b>'+state.firstOK+' / '+M.length+'</b></div></div>');
  view.appendChild(photo);
  var wl=el('div','wl');
  wl.appendChild(el('div','mis','<b>미션 2</b><p>틀린 문제는 책에 번호 체크 + 단어 뜻만</p>'));
  if(!items.length)wl.appendChild(el('div','msg ok','틀린 문제 없음'));
  items.forEach(function(it){wl.appendChild(el('div','wrow','<span class="no">'+it.n+'번</span><span><b class="t">'+it.w+'</b> '+S[it.n][1]+'</span>'))});
  card.appendChild(wl);
  card.appendChild(memoSummary());
  var b=el('button','primary','해석 코너 열기');
  b.onclick=function(){state.tab='c';render()};
  card.appendChild(b);
  var rd=el('button','opt','처음부터 다시 풀기');
  rd.onclick=function(){resetRun()};
  card.appendChild(rd);
  view.appendChild(card);
}
function renderRecs(){
  var card=el('section','card corner');
  card.appendChild(el('h2','','오답노트'));
  var recs=loadRecs();
  if(!recs.length){
    card.appendChild(el('div','msg ok','저장된 기록 없음'));
    view.appendChild(card);return;
  }
  var text=[];
  recs.slice().reverse().forEach(function(r){
    var l1=r.date+(r.time?' '+r.time:'')+(r.dur!=null?' · 소요 '+fdur(r.dur):''),l2='UNIT '+r.unit+' 첫 시도 정답 '+r.ok+' / '+r.total;
    card.appendChild(el('div','pghead',l1+'<br>'+l2));
    text.push(l1+'\n'+l2);
    if(!r.items.length){card.appendChild(el('div','srow','<span class="no"></span><span class="en">표시할 문장 없음</span>'));text.push('표시할 문장 없음');return}
    r.items.forEach(function(it){
      card.appendChild(el('div','srow','<span class="no">'+it.n+'</span><span class="en">'+it.en+'</span><div class="info"><span class="m">'+it.m+'</span><span class="tg">'+it.tg+'</span><span class="k">'+it.ko+'</span></div>'));
      var d=document.createElement('div');d.innerHTML=it.en;
      text.push(it.n+'번 '+d.textContent+' / '+it.m+' '+it.tg+' / '+it.ko);
    });
  });
  view.appendChild(card);
}
function renderCorner(){
  var card=el('section','card corner');
  card.appendChild(el('h2','','UNIT '+(cur<10?'0':'')+cur+' 해석 코너'));
  card.appendChild(el('div','legend','<span><b class="t">파란 글씨</b> 대상 단어</span><span><u>밑줄</u> 동사</span>'));
  Object.keys(S).map(Number).sort(function(a,b){return a-b}).forEach(function(n){
    card.appendChild(el('div','srow','<span class="no">'+n+'</span><span class="en">'+S[n][0]+'</span><div class="info"><span class="m">'+S[n][1]+'</span><span class="tg">'+tag(n)+'</span><span class="k">'+S[n][2]+'</span></div>'));
  });
  view.appendChild(card);
}
document.documentElement.style.setProperty('--tk',TRACK==='h'?'#e97b44':'#e0609f');document.documentElement.style.setProperty('--tk-soft',TRACK==='h'?'rgba(233,123,68,.14)':'rgba(237,130,179,.16)');
setUnit(cur);
