rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Do you ever mix up people with similar names?","ko":"여러분은 비슷한 이름을 가진 사람들을 혼동하곤 하나요?","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"On the late 19th century, there were two French painter who had similar names: Manet and Monet.","ko":"19세기 후반에 비슷한 이름을 가진 프랑스 화가 두 명이 있었어요. 마네와 모네입니다.","ok":false,"foot":[],"fixes":[{"wrong":"On","right":"In","partial":false,"at":[0],"point":"기본전치사: '~세기에'는 전치사 In 사용","topic":"기본전치사","memo":"'~세기에'는 전치사 In 사용"},{"wrong":"painter","right":"painters","partial":false,"at":[9],"point":"명사의 복수형: two 뒤에는 복수명사 painters 사용","topic":"명사의 복수형","memo":"two 뒤에는 복수명사 painters 사용"}]},{"n":3,"tag":null,"en":"One day, Manet heared people at an exhibit. They was praising a painter.","ko":"어느 날, 마네는 전시회에서 사람들의 말을 들었어요. 그들은 한 화가를 칭찬하고 있었어요.","ok":false,"foot":[],"fixes":[{"wrong":"heared","right":"heard","partial":false,"at":[3],"point":"불규칙 과거형: hear의 과거형은 heard (heared 아님)","topic":"불규칙 과거형","memo":"hear의 과거형은 heard (heared 아님)"},{"wrong":"was","right":"were","partial":false,"at":[9],"point":"be동사의 과거형: 복수 주어 They에는 were 사용","topic":"be동사의 과거형","memo":"복수 주어 They에는 were 사용"}]},{"n":4,"tag":null,"en":"He thought they were talking about him. He feeled happy, but they were actually talking about Monet!","ko":"그는 그들이 자신에 대해서 말하고 있다고 생각했어요. 그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요!","ok":false,"foot":[],"fixes":[{"wrong":"feeled","right":"felt","partial":false,"at":[8],"point":"불규칙 과거형: feel의 과거형은 felt (feeled 아님)","topic":"불규칙 과거형","memo":"feel의 과거형은 felt (feeled 아님)"}]},{"n":5,"tag":null,"en":"When Manet realized this, he got upsetting and shouted, \"Who is this Monet whose name sounds just like my?\"","ko":"마네가 이것을 깨달았을 때, 그는 기분이 상해서 외쳤어요. \"꼭 내 이름처럼 들리는 이름의 이 모네라는 사람은 누구야?\"","ok":false,"foot":[],"fixes":[{"wrong":"upsetting","right":"upset","partial":false,"at":[6],"point":"감정 분사형용사: '화가 난' 감정은 과거분사 upset 사용","topic":"감정 분사형용사","memo":"'화가 난' 감정은 과거분사 upset 사용"},{"wrong":"my","right":"mine","partial":false,"at":[18],"point":"소유대명사: like 뒤에 명사 없이 쓰는 소유대명사 mine 사용","topic":"소유대명사","memo":"like 뒤에 명사 없이 쓰는 소유대명사 mine 사용"}]},{"n":6,"tag":null,"en":"Even today, many people still confuses Manet with Monet. So, what are the differences between them?","ko":"오늘날까지도, 많은 사람들은 여전히 마네와 모네를 혼동해요. 그렇다면, 그들 사이의 차이점은 무엇일까요?","ok":false,"foot":[],"fixes":[{"wrong":"confuses","right":"confuse","partial":false,"at":[5],"point":"주어와 동사의 수일치: many people(복수)는 confuse (confuses 아님)","topic":"주어와 동사의 수일치","memo":"many people(복수)는 confuse (confuses 아님)"}]},{"n":7,"tag":null,"en":"First, the focus of their paintings is differently. Manet focused on people.","ko":"첫째, 그들의 그림의 초점이 달라요. 마네는 사람들에게 초점을 맞추었어요.","ok":false,"foot":[],"fixes":[{"wrong":"differently","right":"different","partial":false,"at":[7],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 different 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 different 사용"}]},{"n":8,"tag":null,"en":"He painted people in everyday life. For example, in him painting Boating, Manet painted a man and an woman on a boat.","ko":"그는 일상 속 사람들을 그렸습니다. 예를 들어, 그의 그림인 '뱃놀이(Boating)'에서, 마네는 배에 탄 남자와 여자를 그렸어요.","ok":false,"foot":[],"fixes":[{"wrong":"him","right":"his","partial":false,"at":[9],"point":"인칭대명사의 소유격: 명사 painting 앞에는 소유격 his 사용","topic":"인칭대명사의 소유격","memo":"명사 painting 앞에는 소유격 his 사용"},{"wrong":"an","right":"a","partial":false,"at":[17],"point":"관사 a/an: 자음 소리 woman 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 woman 앞에는 a 사용"}]},{"n":9,"tag":null,"en":"Unlike Manet, Monet liked to painting landscapes and gardens. He enjoyed watching nature in different seasons and times of day.","ko":"마네와 달리, 모네는 풍경과 정원을 그리는 것을 좋아했어요. 그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요.","ok":false,"foot":[],"fixes":[{"wrong":"painting","right":"paint","partial":false,"at":[5],"point":"to부정사: like to 뒤에는 동사원형: paint (painting 아님)","topic":"to부정사","memo":"like to 뒤에는 동사원형: paint (painting 아님)"}]},{"n":10,"tag":null,"en":"He painted the same subject many times. He created about 250 different painting of water lilies for him series Water Lilies.","ko":"그는 같은 주제를 여러 번 그렸어요. 모네는 그의 연작인 '수련(Water Lilies)'을 위해 약 250점의 다양한 수련 그림을 그렸습니다.","ok":false,"foot":[],"fixes":[{"wrong":"painting","right":"paintings","partial":false,"at":[12],"point":"명사의 복수형: 250 뒤에는 복수명사 paintings 사용","topic":"명사의 복수형","memo":"250 뒤에는 복수명사 paintings 사용"},{"wrong":"him","right":"his","partial":false,"at":[17],"point":"인칭대명사의 소유격: 명사 series 앞에는 소유격 his 사용","topic":"인칭대명사의 소유격","memo":"명사 series 앞에는 소유격 his 사용"}]},{"n":11,"tag":null,"en":"Manet and Monet also differ on their use of color. Manet was a master in the use of black.","ko":"마네와 모네는 또한 색 사용에서도 달라요. 마네는 검은색 사용의 대가였어요.","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"in","partial":false,"at":[5],"point":"기본전치사: '~에서 다르다'는 differ in 사용","topic":"기본전치사","memo":"'~에서 다르다'는 differ in 사용"}]},{"n":12,"tag":null,"en":"His painting Masked Ball at the Opera is a good examples.","ko":"그의 그림인 '오페라 하우스의 가면무도회(Masked Ball at the Opera)'가 좋은 예입니다.","ok":false,"foot":[],"fixes":[{"wrong":"examples","right":"example","partial":false,"at":[10],"point":"명사의 단수형: a 뒤에는 단수명사 example 사용","topic":"명사의 단수형","memo":"a 뒤에는 단수명사 example 사용"}]},{"n":13,"tag":null,"en":"However, in Monet's paintings, black was not use. Dark brown was used instead.","ko":"그러나 모네의 그림에서는 검은색이 사용되지 않았어요. 대신에 짙은 갈색이 사용되었습니다.","ok":false,"foot":[],"fixes":[{"wrong":"use","right":"used","partial":false,"at":[7],"point":"수동태: 수동태는 be동사 + 과거분사 used 사용","topic":"수동태","memo":"수동태는 be동사 + 과거분사 used 사용"}]},{"n":14,"tag":null,"en":"Monet also used a lots of light colors in his paintings.","ko":"모네는 또한 그의 그림에서 연한 색을 많이 사용했어요.","ok":false,"foot":[],"fixes":[{"wrong":"lots","right":"lot","partial":false,"at":[4],"point":"수량 표현: '많은'은 a lot of 사용 (lots 아님)","topic":"수량 표현","memo":"'많은'은 a lot of 사용 (lots 아님)"}]},{"n":15,"tag":null,"en":"You will see them if you look at paintings such as Waterloo Bridge, London, at Sunset or Waves Breaking.","ko":"'해 질 녘 런던 워털루 다리(Waterloo Bridge, London, at Sunset)'나 '부서지는 파도(Waves Breaking)'와 같은 그림을 보면 그것들을 보게 될 거예요.","ok":true,"foot":[],"fixes":[]},{"n":16,"tag":null,"en":"The name Manet and Monet sound similar, but their painting styles are very different.","ko":"마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요.","ok":false,"foot":[],"fixes":[{"wrong":"name","right":"names","partial":false,"at":[1],"point":"명사의 복수형: Manet and Monet 두 이름이므로 names 사용","topic":"명사의 복수형","memo":"Manet and Monet 두 이름이므로 names 사용"}]},{"n":17,"tag":null,"en":"Do you see dark colors and people in the painting? It's probably Manet.","ko":"그림에서 어두운 색상과 사람들이 보이나요? 그것은 아마도 마네일 거예요.","ok":true,"foot":[],"fixes":[]},{"n":18,"tag":null,"en":"Does you see light colors and gardens? It's probably Monet.","ko":"연한 색과 정원이 보이나요? 그것은 아마도 모네일 거예요.","ok":false,"foot":[],"fixes":[{"wrong":"Does","right":"Do","partial":false,"at":[0],"point":"do/does 의문문: 주어 you에는 Do 사용","topic":"do/does 의문문","memo":"주어 you에는 Do 사용"}]},{"n":19,"tag":null,"en":"If you remember these questions, you can easy tell them apart.","ko":"이러한 질문들을 기억하면, 여러분은 그들을 쉽게 구별할 수 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"easy","right":"easily","partial":false,"at":[7],"point":"형용사와 부사: 동사 tell을 꾸미는 부사 easily 사용","topic":"형용사와 부사","memo":"동사 tell을 꾸미는 부사 easily 사용"}]}];var PP=[["Do you ever mix up people with similar names?","여러분은 비슷한 이름을 가진 사람들을 혼동하곤 하나요?",1],["In the late 19th century, there were two French painters who had similar names: Manet and Monet.","19세기 후반에 비슷한 이름을 가진 프랑스 화가 두 명이 있었어요. 마네와 모네입니다.",0],["One day, Manet heard people at an exhibit.","어느 날, 마네는 전시회에서 사람들의 말을 들었어요.",1],["They were praising a painter.","그들은 한 화가를 칭찬하고 있었어요.",0],["He thought they were talking about him.","그는 그들이 자신에 대해서 말하고 있다고 생각했어요.",0],["He felt happy, but they were actually talking about Monet!","그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요!",0],["When Manet realized this, he got upset and shouted, \"Who is this Monet whose name sounds just like mine?\"","마네가 이것을 깨달았을 때, 그는 기분이 상해서 외쳤어요. \"꼭 내 이름처럼 들리는 이름의 이 모네라는 사람은 누구야?\"",0],["Even today, many people still confuse Manet with Monet.","오늘날까지도, 많은 사람들은 여전히 마네와 모네를 혼동해요.",0],["So, what are the differences between them?","그렇다면, 그들 사이의 차이점은 무엇일까요?",0],["First, the focus of their paintings is different.","첫째, 그들의 그림의 초점이 달라요.",1],["Manet focused on people.","마네는 사람들에게 초점을 맞추었어요.",0],["He painted people in everyday life.","그는 일상 속 사람들을 그렸습니다.",0],["For example, in his painting Boating, Manet painted a man and a woman on a boat.","예를 들어, 그의 그림인 '뱃놀이(Boating)'에서, 마네는 배에 탄 남자와 여자를 그렸어요.",0],["Unlike Manet, Monet liked to paint landscapes and gardens.","마네와 달리, 모네는 풍경과 정원을 그리는 것을 좋아했어요.",0],["He enjoyed watching nature in different seasons and times of day.","그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요.",0],["He painted the same subject many times.","그는 같은 주제를 여러 번 그렸어요.",0],["He created about 250 different paintings of water lilies for his series Water Lilies.","모네는 그의 연작인 '수련(Water Lilies)'을 위해 약 250점의 다양한 수련 그림을 그렸습니다.",0],["Manet and Monet also differ in their use of color.","마네와 모네는 또한 색 사용에서도 달라요.",1],["Manet was a master in the use of black.","마네는 검은색 사용의 대가였어요.",0],["His painting Masked Ball at the Opera is a good example.","그의 그림인 '오페라 하우스의 가면무도회(Masked Ball at the Opera)'가 좋은 예입니다.",0],["However, in Monet's paintings, black was not used.","그러나 모네의 그림에서는 검은색이 사용되지 않았어요.",1],["Dark brown was used instead.","대신에 짙은 갈색이 사용되었습니다.",0],["Monet also used a lot of light colors in his paintings.","모네는 또한 그의 그림에서 연한 색을 많이 사용했어요.",0],["You will see them if you look at paintings such as Waterloo Bridge, London, at Sunset or Waves Breaking.","'해 질 녘 런던 워털루 다리(Waterloo Bridge, London, at Sunset)'나 '부서지는 파도(Waves Breaking)'와 같은 그림을 보면 그것들을 보게 될 거예요.",0],["The names Manet and Monet sound similar, but their painting styles are very different.","마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요.",1],["Do you see dark colors and people in the painting?","그림에서 어두운 색상과 사람들이 보이나요?",0],["It's probably Manet.","그것은 아마도 마네일 거예요.",0],["Do you see light colors and gardens?","연한 색과 정원이 보이나요?",0],["It's probably Monet.","그것은 아마도 모네일 거예요.",0],["If you remember these questions, you can easily tell them apart.","이러한 질문들을 기억하면, 여러분은 그들을 쉽게 구별할 수 있어요.",0]];var RNUM=26;var TITLE_EN="Manet and Monet";var PASS_EN=["Manet and Monet","Do you ever mix up people with similar names? In the late 19th century, there were two French painters who had similar names: Manet and Monet.","One day, Manet heard people at an exhibit. They were praising a painter. He thought they were talking about him. He felt happy, but they were actually talking about Monet! When Manet realized this, he got upset and shouted, \"Who is this Monet whose name sounds just like mine?\" Even today, many people still confuse Manet with Monet. So, what are the differences between them?","First, the focus of their paintings is different. Manet focused on people. He painted people in everyday life. For example, in his painting Boating, Manet painted a man and a woman on a boat. Unlike Manet, Monet liked to paint landscapes and gardens. He enjoyed watching nature in different seasons and times of day. He painted the same subject many times. He created about 250 different paintings of water lilies for his series Water Lilies.","Manet and Monet also differ in their use of color. Manet was a master in the use of black. His painting Masked Ball at the Opera is a good example.","However, in Monet's paintings, black was not used. Dark brown was used instead. Monet also used a lot of light colors in his paintings. You will see them if you look at paintings such as Waterloo Bridge, London, at Sunset or Waves Breaking.","The names Manet and Monet sound similar, but their painting styles are very different. Do you see dark colors and people in the painting? It's probably Manet. Do you see light colors and gardens? It's probably Monet. If you remember these questions, you can easily tell them apart."];var PASS_KO=["마네와 모네","여러분은 비슷한 이름을 가진 사람들을 혼동하곤 하나요? 19세기 후반에 비슷한 이름을 가진 프랑스 화가 두 명이 있었어요. 마네와 모네입니다.","어느 날, 마네는 전시회에서 사람들의 말을 들었어요. 그들은 한 화가를 칭찬하고 있었어요. 그는 그들이 자신에 대해서 말하고 있다고 생각했어요. 그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요! 마네가 이것을 깨달았을 때, 그는 기분이 상해서 외쳤어요. \"꼭 내 이름처럼 들리는 이름의 이 모네라는 사람은 누구야?\" 오늘날까지도, 많은 사람들은 여전히 마네와 모네를 혼동해요. 그렇다면, 그들 사이의 차이점은 무엇일까요?","첫째, 그들의 그림의 초점이 달라요. 마네는 사람들에게 초점을 맞추었어요. 그는 일상 속 사람들을 그렸습니다. 예를 들어, 그의 그림인 '뱃놀이(Boating)'에서, 마네는 배에 탄 남자와 여자를 그렸어요. 마네와 달리, 모네는 풍경과 정원을 그리는 것을 좋아했어요. 그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요. 그는 같은 주제를 여러 번 그렸어요. 모네는 그의 연작인 '수련(Water Lilies)'을 위해 약 250점의 다양한 수련 그림을 그렸습니다.","마네와 모네는 또한 색 사용에서도 달라요. 마네는 검은색 사용의 대가였어요. 그의 그림인 '오페라 하우스의 가면무도회(Masked Ball at the Opera)'가 좋은 예입니다.","그러나 모네의 그림에서는 검은색이 사용되지 않았어요. 대신에 짙은 갈색이 사용되었습니다. 모네는 또한 그의 그림에서 연한 색을 많이 사용했어요. '해 질 녘 런던 워털루 다리(Waterloo Bridge, London, at Sunset)'나 '부서지는 파도(Waves Breaking)'와 같은 그림을 보면 그것들을 보게 될 거예요.","마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요. 그림에서 어두운 색상과 사람들이 보이나요? 그것은 아마도 마네일 거예요. 연한 색과 정원이 보이나요? 그것은 아마도 모네일 거예요. 이러한 질문들을 기억하면, 여러분은 그들을 쉽게 구별할 수 있어요."];var DG=[{"qs":[{"n":1,"q":"Why does Henry think standing is better at the concert?","o":["They can see the musicians more closely.","The standing tickets are cheaper.","They can sit and rest during the show.","They can meet the musicians after the concert.","The standing area is quieter."],"a":0,"ans":"They can see the musicians more closely.","evs":[["G: Why do you think so?","왜 그렇게 생각하니?"],["B: We can see the musicians more closely.","음악가들을 더 가까이에서 볼 수 있잖아."]],"ev":["G: Why do you think so?","왜 그렇게 생각하니?"],"ow":["정답 ○ — 이유를 묻는 'Why do you think so?'(왜 그렇게 생각하니?)에 헨리가 'We can see the musicians more closely.'(음악가들을 더 가까이에서 볼 수 있잖아.)라고 답했으므로 정답.","오답 ✕ — 표 값에 대한 말은 없다. 소녀는 'I'll buy two standing tickets'(서서 보는 표 두 장을 살게)라고만 했다.","오답 ✕ — 서서 보는 것이 더 좋다고 했으므로 'sit and rest'(앉아서 쉰다)는 이유가 될 수 없고, 그런 말도 없다.","오답 ✕ — 공연 후에 음악가들을 만난다는 말은 대화에 없다. 'We can see the musicians more closely.'는 공연 중에 가까이 본다는 뜻이다.","오답 ✕ — 서서 보는 곳이 조용하다는 말은 없고, 오히려 'We can also dance to the music.'(음악에 맞춰 춤도 출 수 있고)라고 했다."],"memo":["정답 ①: 음악가들을 더 가까이에서 볼 수 있어서","근거: We can see the musicians more closely.(음악가들을 더 가까이에서 볼 수 있잖아.)","함정: ③은 Standing is better.(서서 보는 게 더 좋아)와 반대라 ✕"],"why":"서서 보면 음악가들을 더 가까이에서 볼 수 있어서 서는 것이 낫다고 했다."},{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["이번 주 일요일은 7월 9일이다.","Henry는 원래 이번 주 일요일의 계획이 없었다.","Henry는 콘서트를 앉아서 보길 원한다.","소녀는 콘서트 표 2장을 구매할 것이다.","두 화자는 음악가들은 더 가까이에서 볼 수 있을 것이다."],"a":2,"ans":"Henry는 콘서트를 앉아서 보길 원한다.","evs":[["B: Standing is better.","서서 보는 게 더 좋아."],["G: Okay. I'll buy two standing tickets, then.","알겠어. 그럼 내가 서서 보는 표 두 장을 살게."]],"ev":["B: Standing is better.","서서 보는 게 더 좋아."],"ow":["일치 — 헨리가 'Oh, you mean July 9.'(아, 7월 9일 말이구나.)라고 했으므로 이번 주 일요일은 7월 9일이다.","일치 — 'Nothing special.'(특별한 건 없어.)이라고 했으므로 원래 계획이 없었다.","정답 ○ (불일치) — 헨리는 'Standing is better.'(서서 보는 게 더 좋아.)라고 했으므로 앉아서 보길 원한다는 것은 틀리다.","일치 — 소녀가 'I'll buy two standing tickets, then.'(그럼 내가 서서 보는 표 두 장을 살게.)이라고 했으므로 표 2장을 산다.","일치 — 'We can see the musicians more closely.'(음악가들을 더 가까이에서 볼 수 있잖아.)라고 했으므로 더 가까이에서 볼 수 있다."],"memo":["정답 ③: 헨리는 앉아서가 아니라 서서 보는 것이 더 좋다고 했다.","근거: Standing is better.(서서 보는 게 더 좋아.)","함정: ④는 two standing tickets와 일치"],"why":"헨리는 서서 보는 것이 더 좋다고 했으므로 앉아서 보길 원한다는 말이 틀리다."}],"dlg":[["G","Henry, do you have any plans for this Sunday?","헨리, 이번 주 일요일에 무슨 계획 있니?"],["B","Oh, you mean July 9. Nothing special.","아, 7월 9일 말이구나. 특별한 건 없어."],["G","Do you want to go to The New Kids' concert with me? It's a must-see.","나랑 The New Kids 콘서트에 갈래? 꼭 봐야 하는 공연이야."],["B","That sounds great! Let's go together.","좋아! 같이 가자."],["G","Which is better, sitting or standing at the concert?","콘서트에서는 앉아서 보는 게 좋을까, 서서 보는 게 좋을까?"],["B","Standing is better.","서서 보는 게 더 좋아."],["G","Why do you think so?","왜 그렇게 생각하니?"],["B","We can see the musicians more closely. We can also dance to the music.","음악가들을 더 가까이에서 볼 수 있잖아. 음악에 맞춰 춤도 출 수 있고."],["G","Okay. I'll buy two standing tickets, then.","알겠어. 그럼 내가 서서 보는 표 두 장을 살게."]]},{"qs":[{"n":3,"q":"위 대화의 주제로 알맞은 것은?","o":["이 그림의 인기","이 그림이 상징하는 바","이 그림에 사용된 다양한 기법","같은 작품에 대한 다른 생각들","작품을 감상하는 재미있는 방법들"],"a":3,"ans":"같은 작품에 대한 다른 생각들","evs":[["G: Hmm, it looks a bit strange.","음, 조금 이상해 보여."],["B: I see your point, but I think it's really unique.","네 말뜻은 알겠지만, 나는 정말 독특하다고 생각해."],["G: Everyone sees art differently.","사람마다 예술을 다르게 보니까."]],"ev":["G: Hmm, it looks a bit strange.","음, 조금 이상해 보여."],"ow":["오답 ✕ — 그림이 인기 있다는 말은 대화에 없다. 'it looks a bit strange'(조금 이상해 보여), 'it's really unique'(정말 독특해)처럼 각자의 생각이 나온다.","오답 ✕ — 그림이 무엇을 상징하는지에 대한 이야기는 없다. 사람들이 거꾸로 서 있고 색이 어둡다는 느낌만 말한다.","오답 ✕ — 그림에 쓰인 기법에 대한 설명은 없다. 'The people are standing upside down.'은 기법이 아니라 보이는 모습이다.","정답 ○ — 한 명은 'it looks a bit strange'(조금 이상해 보여)라고, 다른 한 명은 'it's really unique'(정말 독특해)라고 하고, 'Everyone sees art differently.'(사람마다 예술을 다르게 봐.)로 마무리하므로 같은 작품에 대한 다른 생각들이 주제이다.","오답 ✕ — 'I guess that's the fun of it.'(그게 재미인 것 같아.)이라는 말이 있지만, 작품을 감상하는 방법들을 소개하는 대화가 아니다."],"memo":["정답 ④: 같은 작품에 대한 다른 생각들","근거: Everyone sees art differently.(사람마다 예술을 다르게 봐.)","함정: ⑤는 마지막 문장의 fun만 보고 고른 함정이라 ✕"],"why":"같은 그림을 두고 이상하다, 독특하다 하며 서로 다르게 보는 대화이다."}],"dlg":[["B","Wow, what do you think of this artwork?","와, 이 작품 어떻게 생각해?"],["G","Hmm, it looks a bit strange.","음, 조금 이상해 보여."],["B","Why do you think so?","왜 그렇게 생각하니?"],["G","The people are standing upside down. Also, the colors are so dark.","사람들이 거꾸로 서 있잖아. 그리고 색깔도 너무 어두워."],["B","I see your point, but I think it's really unique.","네 말뜻은 알겠지만, 나는 정말 독특하다고 생각해."],["G","Everyone sees art differently. I guess that's the fun of it.","사람마다 예술을 다르게 보니까. 그게 예술의 재미인 것 같아."]]},{"qs":[{"n":4,"q":"Why does Yuna think yoga is better than soccer?","o":["It is helpful for the mind and the body.","It is more exciting than soccer.","She can do it with many friends.","It is cheaper than soccer.","It makes her taller."],"a":0,"ans":"It is helpful for the mind and the body.","evs":[["G: I think yoga is better. It's helpful for the mind and the body.","나는 요가가 더 좋다고 생각해. 마음과 몸에 도움이 돼."],["You can also do it inside on rainy days.","비 오는 날에는 실내에서도 할 수 있어."]],"ev":["G: I think yoga is better. It's helpful for the mind and the body.","나는 요가가 더 좋다고 생각해. 마음과 몸에 도움이 돼."],"ow":["정답 ○ — 유나는 'It's helpful for the mind and the body.'(마음과 몸에 도움이 돼.)라고 이유를 말했으므로 정답.","오답 ✕ — 'I think yoga is better.'(요가가 더 좋다고 생각해.)의 이유는 도움이 되기 때문이지, 축구보다 더 신난다는 말은 없다.","오답 ✕ — 친구들과 함께 한다는 말은 대화에 없다.","오답 ✕ — 가격에 대한 말은 대화에 없다.","오답 ✕ — 키가 큰다는 말은 대화에 없다. 이유는 'helpful for the mind and the body'와 'inside on rainy days'이다."],"memo":["정답 ①: 요가는 마음과 몸에 도움이 되기 때문이다.","근거: It's helpful for the mind and the body.(마음과 몸에 도움이 돼.)","함정: 가격·친구·키 이야기는 대화에 없어서 ✕"],"why":"유나는 요가가 마음과 몸에 도움이 되고 비 오는 날 실내에서도 할 수 있어서 더 좋다고 했다."},{"n":5,"q":"위 대화의 주제로 알맞은 것은?","o":["mental health benefits of yoga","the merits of making a change","two exercises for staying healthy","the advice to the boy about exercise","playing soccer with friends on weekends"],"a":3,"ans":"the advice to the boy about exercise","evs":[["B: Yuna, I need a change. Do you have any ideas?","유나야, 나는 변화가 필요해. 좋은 생각 있니?"],["G: Why don't you exercise?","운동해 보는 게 어때?"]],"ev":["B: Yuna, I need a change. Do you have any ideas?","유나야, 나는 변화가 필요해. 좋은 생각 있니?"],"ow":["오답 ✕ — 'It's helpful for the mind and the body.'(마음과 몸에 도움이 돼.)라는 말이 있지만 요가의 정신 건강 효과를 설명하는 대화가 아니라 운동을 권하는 대화라서 틀림.","오답 ✕ — 소년이 'I need a change.'(나는 변화가 필요해.)라고 했을 뿐, 변화를 주는 것의 장점을 말하는 대화가 아니라서 틀림.","오답 ✕ — 'I do yoga during the week. I play soccer every Saturday.'(주중에는 요가를 하고 토요일마다 축구를 해.)처럼 두 운동이 나오지만, 건강을 지키는 두 운동을 소개하는 것이 중심이 아니라 소년에게 운동을 권하는 조언이다.","정답 ○ — 소년이 'I need a change. Do you have any ideas?'(변화가 필요해. 좋은 생각 있니?)라고 묻자 유나가 'Why don't you exercise?'(운동해 보는 게 어때?)라고 조언했으므로 소년에게 하는 운동 조언이 주제이다.","오답 ✕ — 'I play soccer every Saturday.'(토요일마다 축구를 해.)는 한 부분일 뿐, 친구들과 축구하는 이야기가 아니다."],"memo":["정답 ④: 소년에게 운동을 하라고 하는 조언","근거: Why don't you exercise?(운동해 보는 게 어때?)","함정: ③은 두 운동이 나오지만 중심은 조언이라 ✕"],"why":"변화가 필요한 소년에게 유나가 운동을 해 보라고 조언하는 대화이다."}],"dlg":[["B","Yuna, I need a change. Do you have any ideas?","유나야, 나는 변화가 필요해. 좋은 생각 있니?"],["G","Why don't you exercise?","운동해 보는 게 어때?"],["B","That sounds good. Do you like to work out?","좋은 생각이야. 너는 운동하는 걸 좋아하니?"],["G","Yeah! I do yoga during the week. I play soccer every Saturday.","응! 나는 주중에는 요가를 하고, 토요일마다 축구를 해."],["B","Which is better, yoga or soccer?","요가와 축구 중에서 어느 것이 더 좋니?"],["G","I think yoga is better. It's helpful for the mind and the body. You can also do it inside on rainy days.","나는 요가가 더 좋다고 생각해. 마음과 몸에 도움이 돼. 비 오는 날에는 실내에서도 할 수 있어."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하지 않는 것은?","o":["마네와 모네는 19세기 화가였다.","마네와 모네는 프랑스 사람이었다.","마네는 전시회에서 사람들이 한 화가에 대해 이야기하는 것을 들었다.","마네는 사람들이 모네를 칭찬하는 것을 알고 기분이 좋았다.","오늘날까지도 사람들이 마네와 모네를 혼동한다."],"a":3,"ans":"마네는 사람들이 모네를 칭찬하는 것을 알고 기분이 좋았다.","evs":[["He felt happy, but they were actually talking about Monet!","그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요!"],["When Manet realized this, he got upset and shouted, \"Who is this Monet whose name sounds just like mine?\"","마네가 이것을 깨달았을 때, 그는 기분이 상해서 외쳤어요. \"꼭 내 이름처럼 들리는 이름의 이 모네라는 사람은 누구야?\""]],"ev":["He felt happy, but they were actually talking about Monet!","그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요!"],"ow":["일치 — 'In the late 19th century, there were two French painters'(19세기 후반에 프랑스 화가 두 명이 있었어요)라고 했으므로 19세기 화가가 맞다.","일치 — 'two French painters'(프랑스 화가 두 명)라고 했으므로 프랑스 사람이다.","일치 — 'Manet heard people at an exhibit. They were praising a painter.'(마네는 전시회에서 사람들이 한 화가를 칭찬하는 것을 들었어요.)와 맞다.","정답 ○ (불일치) — 마네는 처음에는 자신이 칭찬받는 줄 알고 기뻤지만, 'they were actually talking about Monet!'(사실 모네에 대한 이야기였어요!)임을 알고 'he got upset'(기분이 상했다)고 했으므로 기분이 좋았다는 말은 틀리다.","일치 — 'Even today, many people still confuse Manet with Monet.'(오늘날까지도 많은 사람들은 여전히 마네와 모네를 혼동해요.)와 맞다."],"memo":["정답 ④: 마네는 모네에 대한 칭찬임을 알고 기분이 상했다.","근거: When Manet realized this, he got upset(마네가 이것을 깨달았을 때, 그는 기분이 상해서)","함정: 처음에 기뻤던 것(He felt happy)은 자기 얘기라고 착각했을 때뿐이라 ✕"],"why":"마네는 칭찬이 모네에 대한 것임을 알고 기분이 상했으므로 기분이 좋았다는 말이 틀리다."}],"pp":[["Do you ever mix up people with similar names?","여러분은 비슷한 이름을 가진 사람들을 혼동하곤 하나요?"],["In the late 19th century, there were two French painters who had similar names: Manet and Monet.","19세기 후반에 비슷한 이름을 가진 프랑스 화가 두 명이 있었어요. 마네와 모네입니다."],["One day, Manet heard people at an exhibit.","어느 날, 마네는 전시회에서 사람들의 말을 들었어요."],["They were praising a painter.","그들은 한 화가를 칭찬하고 있었어요."],["He thought they were talking about him.","그는 그들이 자신에 대해서 말하고 있다고 생각했어요."],["He felt happy, but they were actually talking about Monet!","그는 기뻤지만, 사실 그들은 모네에 대해서 이야기하고 있었어요!"],["When Manet realized this, he got upset and shouted, \"Who is this Monet whose name sounds just like mine?\"","마네가 이것을 깨달았을 때, 그는 기분이 상해서 외쳤어요. \"꼭 내 이름처럼 들리는 이름의 이 모네라는 사람은 누구야?\""],["Even today, many people still confuse Manet with Monet.","오늘날까지도, 많은 사람들은 여전히 마네와 모네를 혼동해요."],["So, what are the differences between them?","그렇다면, 그들 사이의 차이점은 무엇일까요?"]]},{"qs":[{"n":7,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["people - landscapes","landscapes - people","animals - landscapes","people - portraits","gardens - landscapes"],"a":0,"ans":"people - landscapes","evs":[["Manet focused on people.","마네는 사람들에게 초점을 맞추었어요."],["Unlike Manet, Monet liked to paint landscapes and gardens.","마네와 달리, 모네는 풍경과 정원을 그리는 것을 좋아했어요."]],"ev":["Manet focused on people.","마네는 사람들에게 초점을 맞추었어요."],"ow":["정답 ○ — 'Manet focused on people.'(마네는 사람들에게 초점을 맞추었어요.)이므로 (A)는 people이고, 'Monet liked to paint landscapes and gardens.'(모네는 풍경과 정원을 그리는 것을 좋아했어요.)이므로 (B)는 landscapes이다.","오답 ✕ — 본문과 정반대이다. 사람에 초점을 맞춘 것은 마네이고, 풍경과 정원은 모네이다.","오답 ✕ — 마네가 그린 것은 동물이 아니라 'people in everyday life'(일상 속 사람들)이다. (B) landscapes만 맞다.","오답 ✕ — (A) people은 맞지만 모네가 좋아한 것은 'landscapes and gardens'(풍경과 정원)이지 초상화(portraits)가 아니다.","오답 ✕ — 마네가 초점을 맞춘 것은 정원이 아니라 'people'(사람들)이다. (B) landscapes만 맞다."],"memo":["정답 ①: 마네는 사람들(people), 모네는 풍경(landscapes)과 정원을 그렸다.","근거: Manet focused on people.(마네는 사람들에게 초점을 맞추었어요.)","함정: ②는 마네와 모네를 반대로 바꾼 것이라 ✕"],"why":"마네는 일상 속 사람들을, 모네는 풍경과 정원을 주로 그렸다.","sum":"Manet focused on (A) ______ in everyday life, but Monet liked to paint (B) ______ and gardens.","lab":"완성된 요약문 : "},{"n":8,"q":"윗글의 내용과 일치하지 않는 것은?","o":["Manet and Monet focused on different things in their paintings.","Manet's paintings were about people in everyday life.","Monet enjoyed painting landscapes and gardens.","Monet watched nature change with the time of day.","Monet did not like to paint the same subject many times."],"a":4,"ans":"Monet did not like to paint the same subject many times.","evs":[["He painted the same subject many times.","그는 같은 주제를 여러 번 그렸어요."],["He created about 250 different paintings of water lilies for his series Water Lilies.","모네는 그의 연작인 '수련(Water Lilies)'을 위해 약 250점의 다양한 수련 그림을 그렸습니다."]],"ev":["He painted the same subject many times.","그는 같은 주제를 여러 번 그렸어요."],"ow":["일치 — 'First, the focus of their paintings is different.'(첫째, 그들의 그림의 초점이 달라요.)라고 했으므로 맞다.","일치 — 'He painted people in everyday life.'(그는 일상 속 사람들을 그렸습니다.)와 맞다.","일치 — 'Monet liked to paint landscapes and gardens.'(모네는 풍경과 정원을 그리는 것을 좋아했어요.)와 맞다.","일치 — 'He enjoyed watching nature in different seasons and times of day.'(그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요.)와 맞다.","정답 ○ (불일치) — 'He painted the same subject many times.'(그는 같은 주제를 여러 번 그렸어요.)라고 했으므로 같은 주제를 여러 번 그리는 것을 좋아하지 않았다는 말은 틀리다."],"memo":["정답 ⑤: 모네는 같은 주제를 여러 번 그렸다(수련 약 250점).","근거: He painted the same subject many times.(그는 같은 주제를 여러 번 그렸어요.)","함정: ④는 계절과 시간대에 따른 자연을 감상했다는 내용과 일치"],"why":"모네는 같은 주제를 여러 번 그렸으므로 그렇지 않았다는 말이 틀리다."}],"pp":[["First, the focus of their paintings is different.","첫째, 그들의 그림의 초점이 달라요."],["Manet focused on people.","마네는 사람들에게 초점을 맞추었어요."],["He painted people in everyday life.","그는 일상 속 사람들을 그렸습니다."],["For example, in his painting Boating, Manet painted a man and a woman on a boat.","예를 들어, 그의 그림인 '뱃놀이(Boating)'에서, 마네는 배에 탄 남자와 여자를 그렸어요."],["Unlike Manet, Monet liked to paint landscapes and gardens.","마네와 달리, 모네는 풍경과 정원을 그리는 것을 좋아했어요."],["He enjoyed watching nature in different seasons and times of day.","그는 계절과 시간대에 따라 달라지는 자연을 감상하는 것을 즐겼어요."],["He painted the same subject many times.","그는 같은 주제를 여러 번 그렸어요."],["He created about 250 different paintings of water lilies for his series Water Lilies.","모네는 그의 연작인 '수련(Water Lilies)'을 위해 약 250점의 다양한 수련 그림을 그렸습니다."]]},{"qs":[{"n":9,"q":"What is true about the colors that Manet and Monet used?","o":["Manet was a master in the use of black, but black was not used in Monet's paintings.","Monet was a master in the use of black.","Manet used a lot of light colors in his paintings.","Both painters used black the most.","Monet used dark brown and black together."],"a":0,"ans":"Manet was a master in the use of black, but black was not used in Monet's paintings.","evs":[["Manet was a master in the use of black.","마네는 검은색 사용의 대가였어요."],["However, in Monet's paintings, black was not used.","그러나 모네의 그림에서는 검은색이 사용되지 않았어요."]],"ev":["Manet was a master in the use of black.","마네는 검은색 사용의 대가였어요."],"ow":["정답 ○ — 'Manet was a master in the use of black.'(마네는 검은색 사용의 대가였어요.)이고 'in Monet's paintings, black was not used'(모네의 그림에서는 검은색이 사용되지 않았어요)이므로 정답.","오답 ✕ — 검은색 사용의 대가는 마네이고, 모네의 그림에는 'black was not used'(검은색이 사용되지 않았다)라고 했다.","오답 ✕ — 연한 색을 많이 쓴 사람은 마네가 아니라 모네이다. 'Monet also used a lot of light colors'(모네는 연한 색을 많이 사용했어요.)라고 했다.","오답 ✕ — 검은색은 마네가 잘 썼고 모네는 쓰지 않았으므로 둘 다 많이 썼다는 말은 틀리다.","오답 ✕ — 모네의 그림에서는 'Dark brown was used instead.'(대신에 짙은 갈색이 사용되었습니다.)라고 했으므로 검은색은 쓰이지 않았다."],"memo":["정답 ①: 마네는 검은색의 대가이고 모네는 검은색을 쓰지 않았다.","근거: However, in Monet's paintings, black was not used.(그러나 모네의 그림에서는 검은색이 사용되지 않았어요.)","함정: ⑤는 짙은 갈색(dark brown)을 검은색과 섞어 쓴 함정이라 ✕"],"why":"마네는 검은색을 잘 썼지만 모네는 검은색 대신 짙은 갈색과 연한 색을 썼다."}],"pp":[["Manet and Monet also differ in their use of color.","마네와 모네는 또한 색 사용에서도 달라요."],["Manet was a master in the use of black.","마네는 검은색 사용의 대가였어요."],["His painting Masked Ball at the Opera is a good example.","그의 그림인 '오페라 하우스의 가면무도회(Masked Ball at the Opera)'가 좋은 예입니다."],["However, in Monet's paintings, black was not used.","그러나 모네의 그림에서는 검은색이 사용되지 않았어요."],["Dark brown was used instead.","대신에 짙은 갈색이 사용되었습니다."],["Monet also used a lot of light colors in his paintings.","모네는 또한 그의 그림에서 연한 색을 많이 사용했어요."],["You will see them if you look at paintings such as Waterloo Bridge, London, at Sunset or Waves Breaking.","'해 질 녘 런던 워털루 다리(Waterloo Bridge, London, at Sunset)'나 '부서지는 파도(Waves Breaking)'와 같은 그림을 보면 그것들을 보게 될 거예요."]]},{"qs":[{"n":10,"q":"How can we tell Manet's and Monet's paintings apart?","o":["Dark colors and people mean Manet, and light colors and gardens mean Monet.","Light colors and people mean Manet, and dark colors and gardens mean Monet.","Dark colors and gardens mean Manet, and light colors and people mean Monet.","Dark colors mean Monet, and light colors mean Manet.","Only the names can tell them apart."],"a":0,"ans":"Dark colors and people mean Manet, and light colors and gardens mean Monet.","evs":[["Do you see dark colors and people in the painting?","그림에서 어두운 색상과 사람들이 보이나요?"],["It's probably Manet.","그것은 아마도 마네일 거예요."],["Do you see light colors and gardens?","연한 색과 정원이 보이나요?"],["It's probably Monet.","그것은 아마도 모네일 거예요."]],"ev":["Do you see dark colors and people in the painting?","그림에서 어두운 색상과 사람들이 보이나요?"],"ow":["정답 ○ — 'Do you see dark colors and people in the painting? It's probably Manet.'(어두운 색상과 사람들이 보이면 아마도 마네)이고 'Do you see light colors and gardens? It's probably Monet.'(연한 색과 정원이 보이면 아마도 모네)이므로 정답.","오답 ✕ — 사람과 어두운 색이 마네, 정원과 연한 색이 모네이다. 이 보기는 색과 소재를 반대로 연결해서 틀림.","오답 ✕ — 'dark colors and people'(어두운 색과 사람들)은 마네의 특징이고, 정원은 모네의 특징이다. 이 보기는 섞여 있어서 틀림.","오답 ✕ — 'Do you see light colors and gardens? It's probably Monet.'(연한 색과 정원이면 아마도 모네)라고 했으므로 연한 색은 모네이다.","오답 ✕ — 'If you remember these questions, you can easily tell them apart.'(이 질문들을 기억하면 쉽게 구별할 수 있어요.)라고 했으므로 이름이 아니라 그림의 색과 소재로 구별한다."],"memo":["정답 ①: 어두운 색과 사람은 마네, 연한 색과 정원은 모네","근거: Do you see dark colors and people in the painting? It's probably Manet.(어두운 색상과 사람들이 보이면 아마도 마네)","함정: ④는 어두운 색을 모네로 바꾼 것이라 ✕"],"why":"어두운 색과 사람이 보이면 마네, 연한 색과 정원이 보이면 모네로 구별한다."}],"pp":[["The names Manet and Monet sound similar, but their painting styles are very different.","마네와 모네의 이름은 비슷하게 들리지만, 그들의 화풍은 매우 달라요."],["Do you see dark colors and people in the painting?","그림에서 어두운 색상과 사람들이 보이나요?"],["It's probably Manet.","그것은 아마도 마네일 거예요."],["Do you see light colors and gardens?","연한 색과 정원이 보이나요?"],["It's probably Monet.","그것은 아마도 모네일 거예요."],["If you remember these questions, you can easily tell them apart.","이러한 질문들을 기억하면, 여러분은 그들을 쉽게 구별할 수 있어요."]]}];
