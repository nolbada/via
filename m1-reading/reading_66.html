<script>
var D=[{"n":1,"tag":"Host","en":"Welcome to the Paran Quiz Show! I'm your host, Suji. Today, we have two finalist, Namjun from Class 2 and Sara from Class 5. Namjun and Sara, how are you today?","ko":"파란 퀴즈 쇼에 오신 것을 환영합니다! 저는 진행자인 수지입니다. 오늘 두 명의 결승 진출자인 2반의 남준이와 5반의 Sara가 나와 있습니다. 남준과 Sara, 오늘 어떤가요?","ok":false,"foot":["1finalist 결승 진출자"],"fixes":[{"wrong":"finalist","right":"finalists","partial":false,"at":[14],"point":"가산명사 수일치: two 뒤에는 복수형 finalists 사용","topic":"가산명사 수일치","memo":"two 뒤에는 복수형 finalists 사용"}]},{"n":2,"tag":"Namjun & Sara","en":"I'm nervous, but I'll do my best. I'm exciting!","ko":"저는 긴장되지만, 최선을 다하겠습니다. 저는 신이 나요!","ok":false,"foot":[],"fixes":[{"wrong":"exciting","right":"excited","partial":false,"at":[8],"point":"감정형용사: 주어가 사람이고 감정을 느낄 때는 -ed형 excited 사용","topic":"감정형용사","memo":"주어가 사람이고 감정을 느낄 때는 -ed형 excited 사용"}]},{"n":3,"tag":"Host","en":"The winner will receive a Fast Pass for lunch. Today's topic is amazing facts about the world. I'm going ask you three questions. Are you ready answer them?","ko":"우승자는 점심 패스트 패스(줄을 서지 않고 먼저 갈 수 있는 표)를 받게 됩니다. 오늘의 주제는 세상에 관한 놀라운 사실들이에요. 여러분에게 세 문제를 낼 거예요. 답할 준비가 됐나요?","ok":false,"foot":["1Fast Pass (급식실에서) 줄을 서지 않고 먼저 갈 수 있는 표"],"fixes":[{"wrong":"going ask","right":"going to ask","partial":false,"at":[18],"point":"be going to: be동사+going 뒤에는 반드시 to+동사원형 사용 (going to ask)","topic":"be going to","memo":"be동사+going 뒤에는 반드시 to+동사원형 사용 (going to ask)"},{"wrong":"ready answer","right":"ready to answer","partial":false,"at":[25],"point":"to부정사의 부사적 용법: 형용사 ready 뒤에서 목적을 나타낼 때는 to+동사원형 (ready to answer)","topic":"to부정사의 부사적 용법","memo":"형용사 ready 뒤에서 목적을 나타낼 때는 to+동사원형 (ready to answer)"}]},{"n":4,"tag":"Namjun & Sara","en":"Yes, I'm ready!","ko":"네, 준비됐습니다!","ok":true,"foot":[],"fixes":[]},{"n":5,"tag":"Host","en":"Here is the first question. What is the large desert in the world?","ko":"첫 번째 문제입니다. 세계에서 가장 큰 사막은 무엇일까요?","ok":false,"foot":[],"fixes":[{"wrong":"large","right":"largest","partial":false,"at":[8],"point var QS=[{title:'대화문 내용 파악',groups:[{dlg:DLG,qs:BQ}]},{title:'본문 내용 파악',groups:[{pass:0,qs:DQ}]}];
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=c[0][1]+c[1][1],ok=c[0][0]+c[1][0],pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb"><tr><td>2 대화문 내용</td><td>'+r.c[0][0]+' / '+r.c[0][1]+'</td></tr><tr><td>3 본문 내용</td><td>'+r.c[1][0]+' / '+r.c[1][1]+'</td></tr></table>'
 +(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}

}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pass!=null)h+=passHtml(g.pass,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/5</span><button data-subq="'+p+'">제출하기</button></div>';

function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div><div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div><div class="pt" style="margin-top:4px">'+esc(q.why)+'</div></div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 5문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
