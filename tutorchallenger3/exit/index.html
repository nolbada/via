것은 높은 이산화탄소 수치의 실내 공간에서 작물이 재배된 실험들에서 입증되었다."]],"w":"6번에서 ‘이산화탄소가 크게 늘면 식물에 부정적’이라고 주장하고, 7번에서 그 주장을 실험으로 확인해 보였어요. 그래서 has been demonstrated는 ‘입증되었다’예요.","c":3},"h":"52da7216c1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In each case, important minerals such as calcium, potassium, zinc and iron were reduced.)","ko":"각각의 경우에, 칼슘, 칼륨, 아연, 철과 같은 중요한 미네랄이 ____.","opts":["줄어들었다","섞였다","발견되었다","늘어났다"],"word":"reduced","r":{"a":"1) 줄어들었다","ev":"9번 문장","s":[[9,"In each case, important minerals such as calcium, potassium, zinc and iron were reduced.","각각의 경우에, 칼슘, 칼륨, 아연, 철과 같은 중요한 미네랄이 감소되었다."]],"w":"5~6번 흐름은 이산화탄소가 늘면 영양분이 떨어진다는 거예요. 그래서 실험 결과로 미네랄이 줄어든 것이 맞고, were reduced는 ‘줄어들었다’예요.","c":1},"h":"297e93a51e"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAlthough plants require CO2 to grow, a large increase in CO2 seems to have a negative effect on them.","ko":"밑줄 친 them이 가리키는 것은?","opts":["과학자들","이산화탄소 수치","영양분","식물"],"sko":"비록 식물이 자라는 데 이산화탄소가 필요하지만, 이산화탄소의 큰 증가는 식물에 부정적인 영향을 미치는 것처럼 보인다.","r":{"a":"4) 식물","ev":"6번 문장","s":[[6,"Although plants require CO2 to grow, a large increase in CO2 seems to have a negative effect on them.","비록 식물이 자라는 데 이산화탄소가 필요하지만, 이산화탄소의 큰 증가는 식물에 부정적인 영향을 미치는 것처럼 보인다."]],"w":"부정적 영향을 받는 쪽은 Although 절에 나온 plants(식물)예요. 이산화탄소(CO2) 자체가 아니라, 이산화탄소가 크게 늘 때 영향을 받는 대상이 them이에요.","c":4},"h":"8171ced0f6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, others suggest it has been caused by the increase of carbon dioxide (CO2) in the air over the same period.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["다른 과학자들은 같은 기간 식용 작물이 더 많이 재배된 것이 원인이라고 말한다.","다른 과학자들은 같은 기간 대기 중 이산화탄소가 늘어난 것이 원인일 수 있다고 말한다.","다른 과학자들은 이산화탄소가 줄어든 것이 원인이라고 말한다.","다른 과학자들은 이산화탄소가 영양분이 되어 작물을 더 크게 키운다고 말한다."],"sko":"그러나, 다른 과학자들은 그것이 같은 기간 동안 대기 중 이산화탄소의 증가에 의해 야기되었다고 시사한다.","r":{"a":"2) 다른 과학자들은 같은 기간 대기 중 이산화탄소가 늘어난 것이 원인일 수 있다고 말한다.","ev":"5번 문장","s":[[5,"However, others suggest it has been caused by the increase of carbon dioxide (CO2) in the air over the same period.","그러나, 다른 과학자들은 그것이 같은 기간 동안 대기 중 이산화탄소의 증가에 의해 야기되었다고 시사한다."]],"w":"others는 4번의 Some scientists와 다른 과학자들이에요. 이들은 같은 기간(the same period) 공기 중 이산화탄소가 ‘증가한’ 것이 원인이라고 해요. 3번은 감소를 반대로 쓴 것이고, 1번과 4번은 본문에 없어요.","c":2},"h":"43830e8abf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The experiments were done on outdoor farms.","Plants cannot grow without CO2, so more CO2 always helps them.","The writer begins by asking whether climate change can make our food less healthy.","The drop in nutrients started only in the last five years."],"oko":["실험은 야외 농장에서 이루어졌다.","식물은 이산화탄소 없이 자랄 수 없으므로, 이산화탄소가 늘면 언제나 도움이 된다.","글쓴이는 기후 변화가 우리 음식을 덜 건강하게 만들 수 있는지 묻는 것으로 글을 시작한다.","영양분의 하락은 최근 5년 동안에만 시작되었다."],"r":{"a":"3) The writer begins by asking whether climate change can make our food less healthy.","ev":"1번, 3번 문장","s":[[1,"Can climate change make the food you eat less healthy?","기후 변화가 당신이 먹는 음식을 덜 건강하게 만들 수 있을까?"],[3,"Studies have shown that the levels of minerals, vitamins, and proteins in food crops have been dropping over the past 50 to 70 years.","연구는 식용 작물의 미네랄, 비타민, 그리고 단백질 수준이 과거 50년에서 70년에 걸쳐 계속 하락해 오고 있다는 걸 보여 준다."]],"w":"1번이 바로 기후 변화가 음식을 덜 건강하게 만들 수 있느냐는 질문이에요. 실험은 실내(7번)였고, 이산화탄소가 크게 늘면 부정적(6번)이며, 영양 하락은 50~70년 동안(3번)이에요.","c":3},"h":"32a0837ae0"},{"n":9,"t":"sum","q":"Although it may sound (A), it could be (B) that climate change affects the food we eat.","ko":"비록 (A) 들릴지 몰라도, 기후 변화가 우리가 먹는 음식에 영향을 미치는 것은 (B) 일일 수 있다.","opts":["(A) strange / (B) possible","(A) strange / (B) impossible","(A) funny / (B) possible","(A) easy / (B) false","(A) boring / (B) wrong"],"oko":["(A) 이상한 / (B) 가능한","(A) 이상한 / (B) 불가능한","(A) 웃긴 / (B) 가능한","(A) 쉬운 / (B) 거짓인","(A) 지루한 / (B) 틀린"],"r":{"a":"1) (A) strange / (B) possible ((A) 이상한 / (B) 가능한)","ev":"2번 문장","s":[[2,"As strange as it may sound, it could be possible.","이상하게 들릴지 모르지만, 그것은 가능할지도 모른다."]],"w":"2번 문장은 이상하게(strange) 들릴지 몰라도 그럴 수도 있다(possible)는 뜻이에요. impossible은 반대이고 funny·easy·boring과 false·wrong은 본문에 없어요.","c":1},"h":"348d40450a"},{"n":10,"t":"fill","q":"[A] have shown that the levels of minerals, vitamins, and proteins in food crops have been dropping over the [B] 50 to 70 years.","ko":"[A]에 따르면, 식용 작물 속 미네랄, 비타민, 단백질의 수치가 [B] 50년에서 70년 동안 줄어들고 있다.","bank":["Studies","past","levels","vitamins","dropping","crops"],"bko":{"Studies":"연구들","past":"지난","levels":"수치, 수준","vitamins":"비타민","dropping":"줄어드는","crops":"작물"},"r":{"a":"[A] Studies (연구들), [B] past (지난)","ev":"3번 문장","s":[[3,"Studies have shown that the levels of minerals, vitamins, and proteins in food crops have been dropping over the past 50 to 70 years.","연구는 식용 작물의 미네랄, 비타민, 그리고 단백질 수준이 과거 50년에서 70년에 걸쳐 계속 하락해 오고 있다는 걸 보여 준다."]],"w":"3번 문장은 연구들(Studies)에 따르면 식용 작물 속 영양소 수치가 지난(past) 50~70년 동안 줄어들고 있다는 뜻이에요. levels·vitamins·dropping·crops는 빈칸에 넣으면 문장이 성립하지 않아요.","c":null},"h":"ca9a980c2c"}]},{"u":9,"id":"ch3-09-3","no":3,"ko":"알프스의 노스페이스","items":[{"n":1,"t":"tf","q":"Four more climbers died the year after the first pair of climbers died.","ko":"첫 두 등반가가 죽은 다음 해에 네 명의 등반가가 더 죽었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The next year, four more climbers died after bad weather forced them to turn back.","그 다음 해에는 네 명의 등반가들이 악천후로 인해 되돌아가다가 사망했다."]],"w":"4번에서 The next year(다음 해), four more climbers died(네 명이 더 죽었다)라고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"c9e04f35ab"},{"n":2,"t":"tf","q":"After the early deaths, climbers stopped trying to climb the north face.","ko":"초기의 죽음들 이후, 등반가들은 북쪽 면을 오르려는 시도를 그만두었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Nevertheless, there were always more brave climbers willing to test themselves by attempting to scale the north face.","그럼에도 불구하고, 북쪽 면을 오르려고 시도함으로써 자기 자신을 시험하고자 하는 용감한 등반가들이 늘 더 있었다."]],"w":"6번에서 Nevertheless(그럼에도 불구하고) 북쪽 면을 오르려는 용감한 등반가들이 늘 더 있었다고 해요. 그만두었다는 말은 반대예요.","c":"F"},"h":"b4e2978dd0"},{"n":3,"t":"tf","q":"Climbers who reach the top say that they want to climb the Eiger again.","ko":"정상에 오른 등반가들은 아이거를 다시 오르고 싶다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Climbers who are able to somehow overcome all of these obstacles and reach the top all make the same vow: they will never try to do it again.","이 모든 장애물들을 어떻게든 극복하고 정상에 오를 수 있는 등반가들은 모두 똑같은 맹세를 한다. 다시는 그것을 하려고 하지 않겠다는 것이다."]],"w":"11번에서 정상에 오른 등반가들은 모두 they will never try to do it again(다시는 하려고 하지 않겠다)이라는 맹세를 해요. 다시 오르고 싶다는 말은 반대예요.","c":"F"},"h":"1af47e238b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (There are several reasons that the Eiger is so difficult for climbers to conquer.)","ko":"등반가들이 아이거를 ____하기 어려운 데에는 몇 가지 이유가 있다.","opts":["포기하다","정복하다","발견하다","기록하다"],"word":"conquer","r":{"a":"2) 정복하다","ev":"7번 문장","s":[[7,"There are several reasons that the Eiger is so difficult for climbers to conquer.","등반가들이 아이거 산을 정복하기가 그렇게 어려운 데에는 몇 가지 이유가 있다."]],"w":"7번은 아이거가 왜 어려운지 이유를 예고하는 문장이에요. 12번에서 Defeating the Eiger(아이거를 이기는 것)라고 이어지니, conquer는 ‘정복하다’예요.","c":2},"h":"ba58ef1647"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… similar tragedies continued to take the lives of unfortunate climbers.)","ko":"… 유사한 비극이 계속해서 ____ 등반가들의 생명을 앗아갔다.","opts":["유명한","경험 많은","젊은","운이 나쁜"],"word":"unfortunate","r":{"a":"4) 운이 나쁜","ev":"5번 문장","s":[[5,"Year after year, similar tragedies continued to take the lives of unfortunate climbers.","해마다 유사한 비극이 계속해서 운이 나쁜 등반가들의 생명을 앗아갔다."]],"w":"5번은 비극이 등반가들의 생명을 앗아갔다는 내용이에요. 그러니 unfortunate climbers는 사고를 당한 ‘운이 나쁜’ 등반가들이에요. 유명하거나 젊다는 말은 본문에 없어요.","c":4},"h":"f15d575427"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nThe weather can also be a serious problem; the Eiger is known for its storms, which are both terrible and unpredictable.","ko":"밑줄 친 which가 가리키는 것은?","opts":["아이거","날씨","그곳의 폭풍","심각한 문제"],"sko":"날씨 또한 심각한 문제가 될 수도 있다. 아이거 산은 그곳의 폭풍으로 유명한데, 그것은 끔찍하면서도 예측 불가능하다.","r":{"a":"3) 그곳의 폭풍","ev":"10번 문장","s":[[10,"The weather can also be a serious problem; the Eiger is known for its storms, which are both terrible and unpredictable.","날씨 또한 심각한 문제가 될 수도 있다. 아이거 산은 그곳의 폭풍으로 유명한데, 그것은 끔찍하면서도 예측 불가능하다."]],"w":"which 뒤의 동사가 are(복수)라서 단수인 the Eiger나 a serious problem이 아니에요. 바로 앞의 its storms(그곳의 폭풍)를 받아서 끔찍하고 예측할 수 없다고 덧붙여요.","c":3},"h":"fdbaee4647"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Defeating the Eiger is truly a once in a lifetime experience.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["아이거를 정복하는 일은 평생 단 한 번뿐인 경험이다.","아이거를 정복하는 일은 평생 매일 반복되는 경험이다.","아이거를 정복하는 일은 누구나 쉽게 여러 번 할 수 있다.","아이거를 정복하는 일은 평생 한 번도 해 볼 수 없다."],"sko":"아이거 산을 정복하는 것은 진정으로 평생 단 한 번뿐인 경험이다.","r":{"a":"1) 아이거를 정복하는 일은 평생 단 한 번뿐인 경험이다.","ev":"11~12번 문장","s":[[11,"Climbers who are able to somehow overcome all of these obstacles and reach the top all make the same vow: they will never try to do it again.","이 모든 장애물들을 어떻게든 극복하고 정상에 오를 수 있는 등반가들은 모두 똑같은 맹세를 한다. 다시는 그것을 하려고 하지 않겠다는 것이다."],[12,"Defeating the Eiger is truly a once in a lifetime experience.","아이거 산을 정복하는 것은 진정으로 평생 단 한 번뿐인 경험이다."]],"w":"once in a lifetime은 평생 단 한 번뿐이라는 뜻이에요. 11번에서 정상에 오른 사람도 다시는 하지 않겠다고 하니 이 뜻과 이어져요. 매일 반복되거나 여러 번 할 수 있다는 건 본문과 반대예요.","c":1},"h":"1aa6b9a436"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Fewer than 50 people have died on the Eiger since 1935.","Alpine mountaineers avoid the Eiger because of its dangers.","The weather on the Eiger is terrible, but it is easy to predict.","The Eiger’s north face is seen as one of the greatest challenges for alpine mountaineers."],"oko":["1935년 이래로 50명보다 적은 사람이 아이거에서 사망했다.","알프스 산악인들은 위험하기 때문에 아이거를 피한다.","아이거의 날씨는 끔찍하지만 예측하기는 쉽다.","아이거의 북쪽 면은 알프스 산악인들에게 가장 위대한 도전 중 하나로 여겨진다."],"r":{"a":"4) The Eiger’s north face is seen as one of the greatest challenges for alpine mountaineers.","ev":"1번, 2번, 10번 문장","s":[[1,"The 1,800-meter tall north face of the Eiger, a mountain in the Swiss Alps, is known as one of the most difficult in the world to climb; more than 50 people have lost their lives attempting to do so since 1935.","스위스의 알프스 산맥에 있는 산인 아이거의 1,800미터 높이의 북쪽 면은 세상에서 가장 오르기 어려운 산 중 하나로 알려져 있다. 1935년 이후로 50명 이상의 사람들이 그것을 시도하다 목숨을 잃었다."],[2,"Despite the extreme dangers, it is considered one of the greatest challenges for alpine mountaineers.","극도의 위험에도 불구하고, 그것은 알프스 산악인들에게 가장 위대한 도전 중 하나로 여겨진다."],[10,"The weather can also be a serious problem; the Eiger is known for its storms, which are both terrible and unpredictable.","날씨 또한 심각한 문제가 될 수도 있다. 아이거 산은 그곳의 폭풍으로 유명한데, 그것은 끔찍하면서도 예측 불가능하다."]],"w":"2번에서 극도의 위험에도 불구하고 알프스 산악인들에게 가장 위대한 도전 중 하나로 여겨진다고 해요. 1번은 50명 이상 사망, 10번은 폭풍이 예측 불가능하다고 하니 나머지는 틀려요.","c":4},"h":"ed3c5fedec"},{"n":9,"t":"sum","q":"The Eiger’s north face is extremely (A) and full of loose (B) that can fall on climbers.","ko":"아이거의 북쪽 면은 매우 (A) 곳이며, 등반가들 위로 떨어질 수 있는 느슨한 (B)(으)로 가득하다.","opts":["(A) steep / (B) trees","(A) steep / (B) stones","(A) flat / (B) stones","(A) soft / (B) flowers","(A) warm / (B) leaves"],"oko":["(A) 가파른 / (B) 나무","(A) 가파른 / (B) 돌","(A) 평평한 / (B) 돌","(A) 부드러운 / (B) 꽃","(A) 따뜻한 / (B) 나뭇잎"],"r":{"a":"2) (A) steep / (B) stones ((A) 가파른 / (B) 돌)","ev":"8번 문장","s":[[8,"It is extremely steep and full of loose stones that can easily break off and fall on climbers.","그곳은 매우 가파르며, 쉽게 떨어져 나와 등반가들 위로 떨어질 수 있는 헐거운 돌들로 가득 차 있다."]],"w":"8번 문장에서 아이거는 몹시 가파르고(steep) 등반가들 위로 떨어질 수 있는 느슨한 돌(stones)로 가득하다고 해요. trees·flowers·leaves는 본문에 없고, flat·soft·warm은 ‘가파른’과 반대이거나 맞지 않아요.","c":2},"h":"a4324f3d9d"},{"n":10,"t":"fill","q":"Climbers who [A] all the obstacles and reach the top all make the same [B]: they will never try again.","ko":"모든 장애물을 [A] 정상에 오르는 등반가들은 모두 같은 [B]을(를) 한다. 다시는 시도하지 않겠다는 것이다.","bank":["overcome","vow","weather","avalanche","altitude","tragedy"],"bko":{"overcome":"극복하다","vow":"맹세","weather":"날씨","avalanche":"눈사태","altitude":"고도","tragedy":"비극"},"r":{"a":"[A] overcome, [B] vow","ev":"11번 문장","s":[[11,"Climbers who are able to somehow overcome all of these obstacles and reach the top all make the same vow: they will never try to do it again.","이 모든 장애물들을 어떻게든 극복하고 정상에 오를 수 있는 등반가들은 모두 똑같은 맹세를 한다. 다시는 그것을 하려고 하지 않겠다는 것이다."]],"w":"11번에서 모든 장애물을 극복하고(overcome) 정상에 오른 등반가들은 같은 맹세(vow)를 한다고 해요. steep·avalanche·altitude·tragedy는 8~10번의 위험이나 3~5번의 사건을 말하는 단어라 이 문장의 빈칸 자리에 맞지 않아요.","c":null},"h":"4e721202e9"}]},{"u":9,"id":"ch3-09-4","no":4,"ko":"수능:ON 함의 추론","items":[{"n":1,"t":"tf","q":"The writer says that real disasters can be more unpredictable and chaotic than simulations.","ko":"글쓴이는 실제 재난이 모의실험보다 더 예측하기 어렵고 혼란스러울 수 있다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This is because real disasters can be far more unpredictable and chaotic than simulations allow.","이것은 왜냐하면 실제 재난이 모의 실험이 허락하는 것보다 훨씬 더 예상 불가능하고 혼란스러울 수 있기 때문이다."]],"w":"3번에서 real disasters can be far more unpredictable and chaotic than simulations allow(실제 재난은 모의실험이 허락하는 것보다 훨씬 더 예상 불가능하고 혼란스러울 수 있다)고 해요.","c":"T"},"h":"0769741203"},{"n":2,"t":"tf","q":"Marathon runners usually practice by running the full twenty-six miles.","ko":"마라톤 선수들은 보통 26마일 전체를 달리면서 연습한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Marathon runners do not practice by running the full course of twenty-six miles; rather, they get into shape by running shorter distances and building up their endurance with cross-training.","마라톤 선수들은 26마일 전체 코스를 달리는 것으로 연습하는 것이 아니라 오히려 더 짧은 거리를 달리고 여러 운동을 조합한 훈련법으로 자신의 지구력을 강화함으로써 몸 상태를 좋게 만든다."]],"w":"5번에서 Marathon runners do not practice by running the full course of twenty-six miles(26마일 전체 코스를 달리는 것으로 연습하지 않는다)라고 해요. 정반대예요.","c":"F"},"h":"b30b15a0a9"},{"n":3,"t":"tf","q":"The writer says disaster-preparation planning is more like training for a sprinting event than for a marathon.","ko":"글쓴이는 재난 대비 계획이 마라톤보다 단거리 달리기를 위한 훈련에 더 가깝다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Disaster-preparation planning is more like training for a marathon than training for a high- jump competition or a sprinting event.","재난 대비 계획 세우기는 높이뛰기 시합이나 단거리 달리기 경주를 위해 훈련하는 것이라기보다는 마라톤을 위해 훈련하는 것과 더 비슷하다."]],"w":"4번에서 재난 대비 계획은 높이뛰기나 단거리 달리기보다 마라톤을 위해 훈련하는 것과 ‘더’ 비슷하다고 해요. 비교 대상이 바뀐 반대 내용이에요.","c":"F"},"h":"de3ab03cb2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (No matter how many mock disasters are staged according to prior plans, …)","ko":"아무리 많은 모의 재난이 사전 계획에 따라 ____더라도, …","opts":["무시되","숨겨지","마련되어 실시되","취소되"],"word":"staged","r":{"a":"3) 마련되어 실시되","ev":"2번 문장","s":[[2,"No matter how many mock disasters are staged according to prior plans, a real disaster will never mirror any one of them.","아무리 많은 모의 재난이 사전 계획에 따라 조직되더라도 실제 재난은 그것들 중 어느 하나라도 결코 그대로 반영하지 않을 것이다."]],"w":"mock disasters(모의 재난)가 prior plans(사전 계획)에 따라 staged라는 건 계획대로 만들어져 실시된다는 뜻이에요. 그래서 ‘마련되어 실시되다’가 맞아요.","c":3},"h":"e7b6980a18"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… they get into shape by running shorter distances and building up their endurance with cross-training.)","ko":"… 더 짧은 거리를 달리고 여러 운동을 조합한 훈련법으로 자신의 ____을 강화함으로써 몸 상태를 좋게 만든다.","opts":["속도","지구력","거리","예측"],"word":"endurance","r":{"a":"2) 지구력","ev":"5번 문장","s":[[5,"Marathon runners do not practice by running the full course of twenty-six miles; rather, they get into shape by running shorter distances and building up their endurance with cross-training.","마라톤 선수들은 26마일 전체 코스를 달리는 것으로 연습하는 것이 아니라 오히려 더 짧은 거리를 달리고 여러 운동을 조합한 훈련법으로 자신의 지구력을 강화함으로써 몸 상태를 좋게 만든다."]],"w":"전체 코스를 달리지 않고도 몸 상태를 좋게 만들려면 오래 버티는 힘이 필요해요. building up their endurance는 ‘지구력을 강화한다’는 뜻이에요.","c":2},"h":"1d86c72747"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is normal marathon preparation.","ko":"밑줄 친 This가 가리키는 것은?","opts":["26마일 전체 코스를 매일 달리는 것","모의 재난을 여러 번 실시하는 것","날씨를 정확히 예측하는 것","짧은 거리와 교차 훈련으로 몸을 만들어 마라톤을 달릴 최적의 상태가 되는 것"],"sko":"이것이 보통의 마라톤 준비이다.","r":{"a":"4) 짧은 거리와 교차 훈련으로 몸을 만들어 마라톤을 달릴 최적의 상태가 되는 것","ev":"5~7번 문장","s":[[5,"Marathon runners do not practice by running the full course of twenty-six miles; rather, they get into shape by running shorter distances and building up their endurance with cross-training.","마라톤 선수들은 26마일 전체 코스를 달리는 것으로 연습하는 것이 아니라 오히려 더 짧은 거리를 달리고 여러 운동을 조합한 훈련법으로 자신의 지구력을 강화함으로써 몸 상태를 좋게 만든다."],[6,"If they have prepared successfully, then they are in optimal condition to run the marathon over its predetermined course and length, assuming a range of weather conditions, predicted or not.","만약 그들이 성공적으로 준비했다면, 그들은 마라톤의 미리 정해진 코스와 길이에 걸쳐 예상되든 아니든 다양한 기상 조건을 가정하면서 마라톤을 달릴 수 있는 최적의 상태에 있다."],[7,"This is normal marathon preparation.","이것이 보통의 마라톤 준비이다."]],"w":"7번 This는 5~6번에서 설명한 준비 과정이에요. 전체 코스를 달리는 대신 짧은 거리와 교차 훈련으로 몸을 만들어 최적의 상태가 되는 것이 보통의 마라톤 준비라는 뜻이에요.","c":4},"h":"4b862a199a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Knowing that contingencies exist, without precisely knowing beforehand what those contingencies are, shows that disaster preparation is not the same thing as disaster rehearsal.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["어떤 비상사태가 닥칠지 정확히 모른다는 것은 재난 대비가 필요 없다는 뜻이다.","비상사태가 있다는 걸 알아도 그것이 어떤 것일지 미리 정확히 알 수 없다면, 재난 대비는 재난 예행연습과는 다르다는 것을 알 수 있다.","재난 예행연습을 많이 하면 재난 대비가 완벽해진다는 것을 알 수 있다.","비상사태가 무엇인지 정확히 알게 되면 재난 예행연습이 불필요해진다."],"sko":"비상사태가 존재한다는 것을 아는 것은, 그 비상사태가 어떤 것일지 사전에 정확히 아는 것이 없이, 재난 대비가 재난 예행연습과 똑같은 것이 아니라는 것을 보여 준다.","r":{"a":"2) 비상사태가 있다는 걸 알아도 그것이 어떤 것일지 미리 정확히 알 수 없다면, 재난 대비는 재난 예행연습과는 다르다는 것을 알 수 있다.","ev":"1번 문장","s":[[1,"Knowing that contingencies exist, without precisely knowing beforehand what those contingencies are, shows that disaster preparation is not the same thing as disaster rehearsal.","비상사태가 존재한다는 것을 아는 것은, 그 비상사태가 어떤 것일지 사전에 정확히 아는 것이 없이, 재난 대비가 재난 예행연습과 똑같은 것이 아니라는 것을 보여 준다."]],"w":"핵심은 shows 뒤의 that절이에요. 비상사태가 있다는 건 알아도 어떤 것일지는 미리 모르니, 재난 대비와 재난 예행연습은 같지 않다는 말이에요. 나머지는 본문에 없는 내용이나 반대 내용이에요.","c":2},"h":"cedf506400"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Runners who prepare well can run the marathon only if the weather is predicted correctly.","Real disasters are easier to predict than simulations are.","A real disaster will copy one of the planned mock disasters exactly.","Runners who prepare successfully are in optimal condition for the marathon whether or not the weather is predicted."],"oko":["잘 준비한 선수는 날씨가 정확히 예측될 때에만 마라톤을 달릴 수 있다.","실제 재난은 모의실험보다 예측하기 쉽다.","실제 재난은 계획된 모의 재난 중 하나를 정확히 그대로 따라 한다.","성공적으로 준비한 선수는 날씨가 예상되든 아니든 마라톤을 달릴 최적의 상태에 있다."],"r":{"a":"4) Runners who prepare successfully are in optimal condition for the marathon whether or not the weather is predicted.","ev":"2번, 3번, 6번 문장","s":[[2,"No matter how many mock disasters are staged according to prior plans, a real disaster will never mirror any one of them.","아무리 많은 모의 재난이 사전 계획에 따라 조직되더라도 실제 재난은 그것들 중 어느 하나라도 결코 그대로 반영하지 않을 것이다."],[3,"This is because real disasters can be far more unpredictable and chaotic than simulations allow.","이것은 왜냐하면 실제 재난이 모의 실험이 허락하는 것보다 훨씬 더 예상 불가능하고 혼란스러울 수 있기 때문이다."],[6,"If they have prepared successfully, then they are in optimal condition to run the marathon over its predetermined course and length, assuming a range of weather conditions, predicted or not.","만약 그들이 성공적으로 준비했다면, 그들은 마라톤의 미리 정해진 코스와 길이에 걸쳐 예상되든 아니든 다양한 기상 조건을 가정하면서 마라톤을 달릴 수 있는 최적의 상태에 있다."]],"w":"6번에서 성공적으로 준비한 선수는 날씨가 예상되든 아니든(predicted or not) 마라톤을 달릴 최적의 상태에 있다고 해요. 3번은 실제 재난이 더 예측하기 어렵고, 2번은 실제 재난이 모의 재난 중 어느 것도 그대로 닮지 않는다고 하니 나머지는 틀려요.","c":4},"h":"ee3a557cb9"},{"n":9,"t":"sum","q":"A real disaster will never (A) any planned mock disaster, so preparing for one is more like marathon training than training for a high-jump (B).","ko":"실제 재난은 계획된 어떤 모의 재난도 결코 (A) 않을 것이므로, 재난 대비는 높이뛰기 (B)을(를) 위한 훈련보다는 마라톤 훈련에 더 가깝다.","opts":["(A) mirror / (B) competition","(A) mirror / (B) shoe","(A) avoid / (B) competition","(A) cancel / (B) rule","(A) delay / (B) stadium"],"oko":["(A) 그대로 반영하다 / (B) 경기","(A) 그대로 반영하다 / (B) 신발","(A) 피하다 / (B) 경기","(A) 취소하다 / (B) 규칙","(A) 미루다 / (B) 경기장"],"r":{"a":"1) (A) mirror / (B) competition ((A) 그대로 반영하다 / (B) 경기)","ev":"2번, 4번 문장","s":[[2,"No matter how many mock disasters are staged according to prior plans, a real disaster will never mirror any one of them.","아무리 많은 모의 재난이 사전 계획에 따라 조직되더라도 실제 재난은 그것들 중 어느 하나라도 결코 그대로 반영하지 않을 것이다."],[4,"Disaster-preparation planning is more like training for a marathon than training for a high- jump competition or a sprinting event.","재난 대비 계획 세우기는 높이뛰기 시합이나 단거리 달리기 경주를 위해 훈련하는 것이라기보다는 마라톤을 위해 훈련하는 것과 더 비슷하다."]],"w":"2번 문장에서 실제 재난은 계획된 모의 재난 중 어느 것도 그대로 반영하지(mirror) 않는다고 해요. 4번 문장에서 재난 대비 계획은 높이뛰기 경기(competition)보다 마라톤 훈련에 더 가깝다고 해요. 나머지 단어는 본문과 맞지 않아요.","c":1},"h":"088eaa20ea"},{"n":10,"t":"fill","q":"If they have prepared successfully, then they are in optimal condition to run the marathon over its [A] course and [B], assuming a range of weather conditions, predicted or not.","ko":"만약 그들이 성공적으로 준비했다면, 예상됐든 아니든 다양한 날씨 조건을 가정하고, [A] 코스와 [B]에 걸쳐 마라톤을 달릴 최적의 상태에 있는 것이다.","bank":["predetermined","length","predict","stage","allow","rehearse"],"bko":{"predetermined":"미리 정해진","length":"길이","predict":"예측하다","stage":"연출하다","allow":"허용하다","rehearse":"예행연습하다"},"r":{"a":"[A] predetermined (미리 정해진), [B] length (길이)","ev":"6번 문장","s":[[6,"If they have prepared successfully, then they are in optimal condition to run the marathon over its predetermined course and length, assuming a range of weather conditions, predicted or not.","만약 그들이 성공적으로 준비했다면, 그들은 마라톤의 미리 정해진 코스와 길이에 걸쳐 예상되든 아니든 다양한 기상 조건을 가정하면서 마라톤을 달릴 수 있는 최적의 상태에 있다."]],"w":"6번 문장은 잘 준비한 선수가 미리 정해진(predetermined) 코스와 길이(length)의 마라톤을 달릴 최적의 상태라는 뜻이에요. predict·stage·allow·rehearse는 빈칸에 넣으면 문장이 성립하지 않아요.","c":null},"h":"db13e788d5"}]},{"u":10,"id":"ch3-10-1","no":1,"ko":"초콜릿이 녹아서","items":[{"n":1,"t":"tf","q":"Percy Spencer panicked when he found that his chocolate bar was melting.","ko":"퍼시 스펜서는 자신의 초콜릿 바가 녹고 있다는 것을 알았을 때 당황했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"But Spencer didn’t panic.","하지만 스펜서는 당황하지 않았다."]],"w":"4번 문장에서 But Spencer didn’t panic(하지만 스펜서는 당황하지 않았다)이라고 했어요. 당황했다는 말은 반대예요.","c":"F"},"h":"8a1ee04dcf"},{"n":2,"t":"tf","q":"Meat did not turn brown in the first microwave ovens.","ko":"최초의 전자레인지에서는 고기가 갈색으로 변하지 않았다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Meat didn’t turn brown, and French fries turned white.","고기는 갈색으로 변하지 않았고, 프렌치 프라이는 하얗게 변했다."]],"w":"12번 문장에서 Meat didn’t turn brown(고기는 갈색으로 변하지 않았다)이라고 했어요. 본문과 맞아요.","c":"T"},"h":"1062073477"},{"n":3,"t":"tf","q":"The first microwave oven was small and light enough to fit in a family’s kitchen.","ko":"최초의 전자레인지는 가정 주방에 들어갈 만큼 작고 가벼웠다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"The first of these devices was enormous.","최초의 이 기기는 거대했다."],[9,"It was 167 centimeters tall and weighed 340 kilograms.","그것은 167센티미터 높이에 무게가 340킬로그램이었다."]],"w":"8번에서 최초의 기기는 enormous(거대한)했고, 9번에서 167센티미터 높이에 340킬로그램이라고 했어요. 작고 가벼웠다는 말은 반대예요.","c":"F"},"h":"832c154eaa"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…a natural inventor who knew how to apply his curiosity.)","ko":"(…자신의 호기심을 …하는 방법을 아는 타고난 발명가…)","word":"apply","opts":["신청하다","거절하다","응용하다","억누르다"],"r":{"a":"3) 응용하다","ev":"1번 문장","s":[[1,"Percy Spencer was a natural inventor who knew how to apply his curiosity.","퍼시 스펜서는 자신의 호기심을 응용하는 방법을 아는 타고난 발명가였다."]],"w":"1번은 스펜서가 호기심을 ‘활용해서 새로운 것에 쓰는’ 방법을 아는 발명가라는 뜻이에요. 여기서 apply = 응용하다, 적용하다예요. ‘신청하다’는 apply의 다른 뜻이라 이 문장에는 맞지 않아요.","c":3},"h":"3d94248d07"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As Spencer had suspected, the small hard kernels soon exploded…)","ko":"(스펜서가 …했던 것처럼, 작고 딱딱한 알맹이들은 곧 터졌다…)","word":"suspected","opts":["후회하다","거부하다","설명하다","짐작하다"],"r":{"a":"4) 짐작하다","ev":"6번 문장","s":[[6,"As Spencer had suspected, the small hard kernels soon exploded, becoming fluffy and white.","스펜서가 짐작했던 것처럼, 작고 딱딱한 알맹이들은 곧 터져서 솜털 같고 하얗게 되었다."]],"w":"스펜서는 5번에서 팝콘을 마그네트론 앞에 들었고, 6번에서 알맹이가 ‘그가 짐작한 대로’ 터졌어요. suspect = 짐작하다예요. 이미 예상했기 때문에 실험을 한 거예요.","c":4},"h":"e6dbea7947"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nInstead, he put some unpopped popcorn in a bag and held it in front of the magnetron.","ko":"밑줄 친 it이 가리키는 것은?","sko":"대신에, 그는 봉지 안에 튀기지 않은 팝콘을 조금 넣고 그것을 마그네트론 앞에서 들고 있었다.","opts":["주머니 속 초콜릿 바","마그네트론","팝콘이 든 봉지","레이더 시스템"],"r":{"a":"3) 팝콘이 든 봉지","ev":"5번 문장","s":[[5,"Instead, he put some unpopped popcorn in a bag and held it in front of the magnetron.","대신에, 그는 봉지 안에 튀기지 않은 팝콘을 조금 넣고 그것을 마그네트론 앞에서 들고 있었다."]],"w":"스펜서가 팝콘을 봉지에 넣고(put ~ in a bag), 그것을 마그네트론 앞에 ‘들고 있었다(held)’는 문장이에요. 들고 있는 것은 팝콘이 든 봉지예요. 마그네트론은 이미 ‘앞(in front of)’에 있는 장치라서 들고 있을 수 없어요.","c":3},"h":"c745db6132"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But, over decades, improvements were made, and eventually the microwave oven reached the point where it was the perfect addition to the average family’s kitchen.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러나 수십 년에 걸쳐 개선이 이루어졌고, 마침내 전자레인지는 일반 가정 주방의 완벽한 추가 구성물이 되는 지점에 이르렀다.","opts":["수십 년 동안 개선되었지만 전자레인지는 일반 가정에는 맞지 않았다.","수십 년 동안 개선된 끝에 전자레인지가 일반 가정의 주방에 딱 맞는 기기가 되었다.","수십 년 동안 일반 가정의 주방이 전자레인지에 맞게 바뀌었다.","수십 년이 지나자 전자레인지는 개선할 필요가 없어졌다."],"r":{"a":"2) 수십 년 동안 개선된 끝에 전자레인지가 일반 가정의 주방에 딱 맞는 기기가 되었다.","ev":"13번 문장","s":[[13,"But, over decades, improvements were made, and eventually the microwave oven reached the point where it was the perfect addition to the average family’s kitchen.","그러나 수십 년에 걸쳐 개선이 이루어졌고, 마침내 전자레인지는 일반 가정 주방의 완벽한 추가 구성물이 되는 지점에 이르렀다."]],"w":"improvements were made는 ‘개선이 이루어졌다’이고, reached the point where ~는 ‘~인 지점에 이르렀다’예요. 전자레인지가 개선되어 가정 주방에 딱 맞는 기기가 되었다는 뜻이에요. 바뀐 것은 주방이 아니라 전자레인지이고, 가정에 맞지 않았다는 말도 아니에요.","c":2},"h":"2eb2ff6dfa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["스펜서의 팝콘 알맹이는 마그네트론 앞에서 딱딱한 채로 있었다.","최초의 전자레인지는 요리사들이 많은 음식을 빠르게 조리해야 하는 식당에서만 사용되었다.","최초의 전자레인지는 제2차 세계대전 이전에 발명되었다.","전자레인지는 너무 커져서 어떤 가정의 주방에도 들어가지 않게 되었다."],"opts":["Spencer’s popcorn kernels stayed hard in front of the magnetron.","The first microwave oven was used only in restaurants, where chefs needed to cook a lot of food quickly.","The first microwave oven was invented before World War II.","The microwave oven became too big to fit in any family’s kitchen."],"r":{"a":"2) The first microwave oven was used only in restaurants, where chefs needed to cook a lot of food quickly. (최초의 전자레인지는 요리사들이 많은 음식을 빠르게 조리해야 하는 식당에서만 사용되었다.)","ev":"10번 문장","s":[[10,"Because of this, it was only used in restaurants where chefs needed to cook a lot of food in a short time.","이 때문에, 그것은 요리사들이 짧은 시간에 많은 음식을 요리해야 하는 식당에서만 사용되었다."]],"w":"10번 문장에서 최초의 전자레인지는 요리사들이 많은 음식을 짧은 시간에 조리해야 하는 식당에서만 사용되었다고 해요. 알맹이는 곧 터졌고(6번), 전자레인지는 제2차 세계대전 직후에 발명되었으며(2번), 나중에는 일반 가정 주방에 딱 맞게 되었어요(13번).","c":2},"h":"bd5122e81c"},{"n":9,"t":"sum","q":"Percy Spencer (A) that a chocolate bar in his pocket was melting, and his simple (B) with popcorn led to the microwave oven.","ko":"퍼시 스펜서는 주머니 속 초콜릿 바가 녹고 있다는 것을 (A), 팝콘으로 한 그의 간단한 (B)이(가) 전자레인지로 이어졌다.","oko":["(A) 깨달았고 / (B) 실험","(A) 깨달았고 / (B) 여행","(A) 잊었고 / (B) 실험","(A) 부인했고 / (B) 농담","(A) 바랐고 / (B) 교훈"],"opts":["(A) realized / (B) experiment","(A) realized / (B) trip","(A) forgot / (B) experiment","(A) denied / (B) joke","(A) hoped / (B) lesson"],"r":{"a":"1) (A) realized / (B) experiment ((A) 깨달았고 / (B) 실험)","ev":"3번, 7번 문장","s":[[3,"Suddenly, he realized that a chocolate bar in his pocket was melting.","갑자기, 그는 자신의 주머니 속에 있던 초콜릿 바가 녹고 있다는 것을 깨달았다."],[7,"This simple experiment eventually led to the invention of the microwave oven.","이 간단한 실험은 결국 전자레인지의 발명으로 이어졌다."]],"w":"3번 문장에서 스펜서는 주머니 속 초콜릿 바가 녹고 있다는 것을 깨달았고(realized), 7번 문장에서 이 간단한 실험(experiment)이 전자레인지의 발명으로 이어졌다고 해요. 나머지 단어는 본문과 맞지 않아요.","c":1},"h":"a603654869"},{"n":10,"t":"fill","q":"Percy Spencer was walking through his [A] when he [B] in front of a magnetron, a device used to power radar systems.","ko":"퍼시 스펜서는 자신의 [A]을(를) 걸어가다가 레이더 시스템에 전력을 공급하는 장치인 마그네트론 앞에서 [B].","bank":["laboratory","paused","pocket","popcorn","kernels","exploded"],"bko":{"laboratory":"실험실","paused":"잠시 멈췄다","pocket":"주머니","popcorn":"팝콘","kernels":"알맹이들","exploded":"터졌다"},"r":{"a":"[A] laboratory (실험실), [B] paused (잠시 멈췄다)","ev":"2번 문장","s":[[2,"Shortly after World War II, he was walking through his laboratory when he paused in front of a magnetron, a device used to power radar systems.","제2차 세계대전 직후, 그가 레이더 시스템에 전력을 공급하는 데 사용되는 장치인 마그네트론 앞에 잠시 멈춰 섰을 때, 그는 자신의 실험실에서 걸어다니는 중이었다."]],"w":"2번 문장은 스펜서가 자신의 실험실(laboratory)을 걸어가다가 마그네트론 앞에서 잠시 멈췄다(paused)는 뜻이에요. pocket·popcorn·kernels·exploded는 빈칸에 넣으면 문장이 성립하지 않아요.","c":null},"h":"ca40e9b3b9"}]},{"u":10,"id":"ch3-10-2","no":2,"ko":"차에도 날개가 필요해요","items":[{"n":1,"t":"tf","q":"Race cars usually have spoilers only at the rear of the vehicle.","ko":"경주용 자동차는 보통 차량의 뒤쪽에만 스포일러를 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Fans of motorsports are probably aware that race cars usually have a kind of wing, called a spoiler, on both the front and the rear of the vehicle.","모터스포츠 팬들은 아마 경주용 차들이 일반적으로 차량의 전방과 후방에 스포일러라고 불리는 일종의 날개를 가지고 있다는 것을 알고 있을 것이다."]],"w":"1번 문장에서 스포일러는 on both the front and the rear(앞과 뒤 모두)에 있다고 했어요. 뒤쪽에만 있다는 말은 틀려요.","c":"F"},"h":"e73d84b2c0"},{"n":2,"t":"tf","q":"Spoilers are set at a precise angle so that passing air is forced upward.","ko":"스포일러는 지나가는 공기가 위쪽으로 가도록 정확한 각도로 놓인다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"These spoilers are set at a precise angle in order to force passing air up and through them.","이 스포일러들은 지나가는 공기가 위쪽으로, 그리고 그것들(=스포일러들)을 통과하게 하도록 정확한 각도로 놓인다."]],"w":"3번 문장에서 정확한 각도로 놓는 까닭이 in order to force passing air up(지나가는 공기를 위로 보내려고)이에요. 본문과 맞아요.","c":"T"},"h":"4733767a73"},{"n":3,"t":"tf","q":"Downforce reduces the friction between a car’s tires and the track.","ko":"다운포스는 자동차 타이어와 도로 사이의 마찰을 줄여 준다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"This is important when racing at high speeds, as downforce increases the friction between the car’s tires and the track, which prevents the car from sliding.","이것은 빠른 속도로 경주할 때 중요한데, 다운포스가 자동차 타이어와 도로 사이의 마찰을 증가시켜서, 자동차가 미끄러지는 것을 방지하기 때문이다."]],"w":"6번 문장에서 downforce increases the friction(마찰을 증가시킨다)이라고 했어요. 줄인다는 말은 반대예요.","c":"F"},"h":"a0c74b0645"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…they are only used to make the car look cool, but they actually serve a practical purpose.)","ko":"(…그것들은 그저 차를 멋지게 보이게 하려고 사용되는 것 같지만, 사실 실용적인 목적에 쓸모가 있다.)","word":"practical","opts":["장식적인","위험한","비밀스러운","실용적인"],"r":{"a":"4) 실용적인","ev":"2번 문장","s":[[2,"It might seem like they are only used to make the car look cool, but they actually serve a practical purpose.","그것들이 그저 차를 멋지게 보이게 하려고 사용되는 것 같겠지만, 사실 그것들은 실용적인 목적으로 쓸모가 있다."]],"w":"2번은 ‘멋 내기용’처럼 보여도 but 뒤에서 사실은 도움이 되는 목적이 있다고 해요. 그래서 practical = 실용적인이에요. ‘장식적인’은 겉으로 보이는 오해(only used to make the car look cool)를 말해요.","c":4},"h":"721d24594b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…correctly calculating the downforce can mean the difference between winning the race and crashing into a wall.)","ko":"(…다운포스를 정확히 계산하는 것은 경주에서 이기는 것과 벽에 …하는 것 사이의 차이를 의미할 수 있다.)","word":"crashing","opts":["충돌하다","착륙하다","멈추다","양보하다"],"r":{"a":"1) 충돌하다","ev":"10번 문장","s":[[10,"In a Formula One race car going through a turn at 300 kilometers per hour, correctly calculating the downforce can mean the difference between winning the race and crashing into a wall.","시속 300km로 회전을 하는 포뮬러 원 경주용 자동차에서, 다운포스를 정확히 계산하는 것은 경주에서 이기는 것과 벽에 부딪히는 것 사이의 차이를 의미할 수 있다."]],"w":"10번은 이기는 것과 대비되는 나쁜 결과를 말해요. crashing into a wall은 ‘벽에 부딪히다’라서 crash = 충돌하다예요.","c":1},"h":"4b91f0a672"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIt might seem like they are only used to make the car look cool, but they actually serve a practical purpose.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그것들이 그저 차를 멋지게 보이게 하려고 사용되는 것 같겠지만, 사실 그것들은 실용적인 목적으로 쓸모가 있다.","opts":["모터스포츠 팬들","스포일러(차의 날개)들","경주용 차의 타이어들","실용적인 목적들"],"r":{"a":"2) 스포일러(차의 날개)들","ev":"1~2번 문장","s":[[1,"Fans of motorsports are probably aware that race cars usually have a kind of wing, called a spoiler, on both the front and the rear of the vehicle.","모터스포츠 팬들은 아마 경주용 차들이 일반적으로 차량의 전방과 후방에 스포일러라고 불리는 일종의 날개를 가지고 있다는 것을 알고 있을 것이다."],[2,"It might seem like they are only used to make the car look cool, but they actually serve a practical purpose.","그것들이 그저 차를 멋지게 보이게 하려고 사용되는 것 같겠지만, 사실 그것들은 실용적인 목적으로 쓸모가 있다."]],"w":"1번에서 경주용 차의 앞뒤에 달린 일종의 날개를 a spoiler라고 했어요. 2번의 they는 ‘멋을 내려고 쓰이는 것처럼 보이는 것’으로, 1번의 wing(spoiler)들을 가리켜요. 팬들은 알고 있는 사람들이지 ‘차를 멋지게 보이게 하려고 쓰이는’ 것이 아니에요.","c":2},"h":"db9cbabd19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"One of the basic laws of physics is that for every force there is an equal and opposite force; therefore spoilers, by forcing air upward, create a force that pushes the car downward.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"물리학의 기본 법칙 중 하나는, 모든 힘에 대해서는 동등하고 반대로 작용하는 힘이 있다는 것이다. 따라서 스포일러는 공기를 위로 밀어 올림으로써 차량을 아래로 누르는 힘을 만들어낸다.","opts":["스포일러가 차를 위로 들어 올리므로 공기가 아래로 눌린다.","모든 힘에는 같은 크기의 반대 힘이 있어서, 스포일러가 공기를 위로 보내면 차를 아래로 누르는 힘이 생긴다.","스포일러는 공기를 아래로 보내기 때문에 차가 위로 떠오른다.","물리 법칙에 따라 스포일러가 없는 차는 공기를 위로 보낼 수 없다."],"r":{"a":"2) 모든 힘에는 같은 크기의 반대 힘이 있어서, 스포일러가 공기를 위로 보내면 차를 아래로 누르는 힘이 생긴다.","ev":"4번 문장","s":[[4,"One of the basic laws of physics is that for every force there is an equal and opposite force; therefore spoilers, by forcing air upward, create a force that pushes the car downward.","물리학의 기본 법칙 중 하나는, 모든 힘에 대해서는 동등하고 반대로 작용하는 힘이 있다는 것이다. 따라서 스포일러는 공기를 위로 밀어 올림으로써 차량을 아래로 누르는 힘을 만들어낸다."]],"w":"법칙은 ‘모든 힘에는 같은 크기의 반대 방향 힘이 있다’이고, therefore(따라서) 스포일러가 공기를 위로 보내면 그 반대 힘인 ‘차를 아래로 누르는 힘’이 생겨요. 방향이 거꾸로 된 선지들은 본문과 달라요.","c":2},"h":"e41c5a1997"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["다운포스는 자동차의 속도보다 더 느린 비율로 증가한다.","다운포스는 경주용 자동차가 더 쉽게 미끄러지게 만든다.","자동차의 속도가 두 배가 되면 다운포스는 네 배 더 강해진다.","스포일러는 타이어와 도로 사이의 마찰을 낮춘다."],"opts":["Downforce increases at a slower rate than a car’s speed.","Downforce makes a race car slide more easily.","If a car’s speed doubles, its downforce becomes four times stronger.","Spoilers lower the friction between the tires and the track."],"r":{"a":"3) If a car’s speed doubles, its downforce becomes four times stronger.","ev":"5번, 8~9번 문장","s":[[5,"In effect, this force, known as downforce, increases the automobile’s weight without increasing its mass.","다운포스라고 알려진 이 힘은, 사실상 자동차의 질량을 증가시키지 않고도 그것의 무게를 증가시킨다."],[8,"Downforce, however, increases at a faster rate.","그러나 다운포스는 더 빠른 비율로 증가한다."],[9,"If the car’s speed doubles, its downforce will become four times stronger; this is important information for race car drivers.","만약 자동차의 속도가 두 배가 되면, 그것의 다운포스는 네 배 더 강해질 것이며, 이것은 경주용 자동차 운전자들에게 중요한 정보이다."]],"w":"9번에서 속도가 두 배가 되면 다운포스는 네 배 더 강해진다고 했어요. 8번에서 다운포스는 속도보다 ‘더 빠른 비율’로 늘고, 6번에서 다운포스는 마찰을 늘려 차가 미끄러지는 것을 막아 줘요.","c":3},"h":"2e6ce6ce83"},{"n":9,"t":"sum","q":"The downforce of a race car (A) as its speed goes up, and it grows at a (B) rate than the speed itself.","ko":"경주용 자동차의 다운포스는 속도가 오를 때 (A), 속도 자체보다 더 (B) 비율로 늘어난다.","oko":["(A) 줄어들고 / (B) 빠른","(A) 오르고 / (B) 느린","(A) 그대로이고 / (B) 빠른","(A) 오르고 / (B) 빠른","(A) 줄어들고 / (B) 느린"],"opts":["(A) falls / (B) faster","(A) rises / (B) slower","(A) stays the same / (B) faster","(A) rises / (B) faster","(A) falls / (B) slower"],"r":{"a":"4) (A) rises / (B) faster","ev":"7~8번 문장","s":[[7,"As a race car’s speed increases, so does the downforce created by its spoilers.","경주용 자동차의 속도가 증가함에 따라, 자동차의 스포일러에 의해 만들어지는 다운포스 또한 증가한다."],[8,"Downforce, however, increases at a faster rate.","그러나 다운포스는 더 빠른 비율로 증가한다."]],"w":"7번에서 속도가 증가하면 다운포스도 증가한다고 하므로 (A)는 rises예요. 8번 however 뒤에서 다운포스가 ‘더 빠른 비율(faster rate)’로 증가한다고 하므로 (B)는 faster예요.","c":4},"h":"8ea30e4955"},{"n":10,"t":"fill","q":"In effect, this force, [A] as downforce, increases the automobile’s [B] without increasing its mass.","ko":"사실상, 다운포스로 [A] 이 힘은 자동차의 질량을 늘리지 않으면서 자동차의 [B]을(를) 늘린다.","bank":["known","weight","speed","friction","tire","angle"],"bko":{"known":"알려진","weight":"무게","speed":"속도","friction":"마찰","tire":"타이어","angle":"각도"},"r":{"a":"[A] known (알려진), [B] weight (무게)","ev":"5번 문장","s":[[5,"In effect, this force, known as downforce, increases the automobile’s weight without increasing its mass.","다운포스라고 알려진 이 힘은, 사실상 자동차의 질량을 증가시키지 않고도 그것의 무게를 증가시킨다."]],"w":"5번 문장은 다운포스라고 알려진(known) 이 힘이 자동차의 질량은 늘리지 않으면서 무게(weight)를 늘린다는 뜻이에요. speed·friction·tire·angle은 본문의 설명과 맞지 않거나 빈칸에 들어가지 않아요.","c":null},"h":"3b5bb83b75"}]},{"u":10,"id":"ch3-10-3","no":3,"ko":"정밀 타격, 암을 겨누다","items":[{"n":1,"t":"tf","q":"Carbon ions used in heavy ion therapy are smaller and lighter than the particles used in conventional radiation therapies.","ko":"중입자 치료에 쓰이는 탄소 이온은 전통적인 방사선 치료에 쓰이는 입자보다 더 작고 가볍다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"This advanced form of radiation treatment utilizes carbon ions, which are larger and heavier compared to the particles used in conventional radiation therapies, enhancing their effectiveness in eliminating cancer cells.","방사선 치료의 이 선진적인 형태는 탄소 이온을 사용하는데, 이는 전통적인 방사선 치료에서 사용되는 입자와 비교하여 더 크고 무거우며, 암 세포를 제거하는 데 효과성을 높인다."]],"w":"2번 문장에서 탄소 이온은 larger and heavier(더 크고 무겁다)고 했어요. 작고 가볍다는 말은 반대예요.","c":"F"},"h":"afd9092a3e"},{"n":2,"t":"tf","q":"Doctors can match the depth where carbon ions release the most energy to the location of the tumor.","ko":"의사들은 탄소 이온이 가장 많은 에너지를 방출하는 깊이를 종양의 위치에 맞출 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Doctors can align the specific depth at which the carbon ions release the most energy, known as the Bragg Peak, with the location of the tumor.","의사들은 탄소 이온이 가장 많은 에너지를 방출하는, Bragg Peak라고 알려진 특정한 깊이를 종양 위치에 맞춰 조정할 수 있다."]],"w":"5번 문장에서 의사들은 the specific depth at which the carbon ions release the most energy(Bragg Peak)를 종양 위치에 맞춰 조정할 수 있다고 했어요. 본문과 맞아요.","c":"T"},"h":"e2a5f6f57e"},{"n":3,"t":"tf","q":"A key advantage of heavy ion therapy is that it costs less than other treatments.","ko":"중입자 치료의 주요 장점은 다른 치료법보다 비용이 적게 든다는 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"A key advantage of this method is the precision of the treatment.","이 방법의 주요 장점은 치료의 정밀성이다."]],"w":"4번 문장은 이 방법의 주요 장점이 the precision of the treatment(치료의 정밀성)라고 했어요. 비용에 대한 말은 본문에 없고, 장점은 정밀성이에요.","c":"F"},"h":"42896f3343"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…this method propels carbon ions to near-light speeds…)","ko":"(…이 방법은 탄소 이온을 빛에 가까운 속도로 …시킨다…)","word":"propels","opts":["멈추게 하다","추진시키다","숨기다","분리하다"],"r":{"a":"2) 추진시키다","ev":"3번 문장","s":[[3,"Unlike standard treatments, this method propels carbon ions to near-light speeds, allowing them to penetrate directly to the tumor and release energy that damages the DNA of cancer cells.","일반적인 치료법과 달리, 이 방법은 탄소 이온을 빛의 속도에 가깝게 추진시켜, 그것들이 종양에 직접 침투하게 하고 암 세포의 DNA를 손상시키는 에너지를 방출하게 한다."]],"w":"3번은 탄소 이온을 빛에 가까운 속도로 보내 종양까지 곧바로 들어가게 한다는 내용이에요. 그래서 propel = 추진시키다(앞으로 나아가게 하다)예요. 멈추게 하는 것은 near-light speeds와 반대예요.","c":2},"h":"b633764848"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Thanks to its remarkable capabilities, heavy ion therapy has earned the nickname “the dream cancer treatment,”…)","ko":"(이것의 …한 능력 덕분에 중입자 치료는 ‘꿈의 암 치료법’이라는 별명을 얻었으며…)","word":"remarkable","opts":["평범한","위험한","오래된","놀라운"],"r":{"a":"4) 놀라운","ev":"9번 문장","s":[[9,"Thanks to its remarkable capabilities, heavy ion therapy has earned the nickname “the dream cancer treatment,” emerging as a game-changer in the fight against incurable cancers.","이것의 놀라운 능력 덕분에 중입자 치료는 ‘꿈의 암 치료법’이라는 별명을 얻었으며, 불치의 암과의 싸움에서 판도를 바꾸는 요소로서 떠오르고 있다."]],"w":"‘꿈의 암 치료법’이라는 별명을 얻게 한 능력이니 대단한 능력이에요. remarkable = 놀라운, 주목할 만한이에요. 평범하거나 위험한 능력으로는 이런 별명이 붙기 어려워요.","c":4},"h":"e4dce7ceff"},{"n":6,"t":"ref","q":"What does the underlined \"those\" refer to?\nHeavy ion therapy shows promise in boosting effectiveness for tumors that are hard to treat, such as those found in the lungs and liver.","ko":"밑줄 친 those가 가리키는 것은?","sko":"중입자 치료는 폐와 간에서 발견되는 종양과 같이 치료가 어려운 종양에 대한 효과성을 높일 가능성을 보여 준다.","opts":["폐와 간","의사들","종양들","탄소 이온들"],"r":{"a":"3) 종양들","ev":"7번 문장","s":[[7,"Heavy ion therapy shows promise in boosting effectiveness for tumors that are hard to treat, such as those found in the lungs and liver.","중입자 치료는 폐와 간에서 발견되는 종양과 같이 치료가 어려운 종양에 대한 효과성을 높일 가능성을 보여 준다."]],"w":"such as those found in the lungs and liver는 ‘폐와 간에서 발견되는 (것들)’이라는 뜻이고, 폐와 간에서 ‘발견되는’ 것은 앞에 나온 tumors(종양들)예요. those는 같은 명사의 반복을 피하려고 쓴 말이에요.","c":3},"h":"27c0a8333a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This ensures the radiation targets only cancer cells without destroying too much of the surrounding healthy tissue.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 방사선이 주변의 건강한 조직들을 너무 많이 파괴하지 않고 암 세포만을 조준하게 한다.","opts":["방사선이 건강한 조직을 먼저 파괴한 뒤에 암세포를 공격하게 된다.","방사선이 주변 조직 전체에 똑같이 퍼지도록 만들어 준다.","방사선이 암세포를 겨냥하면서 주변의 건강한 조직은 크게 해치지 않도록 해 준다.","방사선이 암세포 대신 건강한 조직만 겨냥하게 된다."],"r":{"a":"3) 방사선이 암세포를 겨냥하면서 주변의 건강한 조직은 크게 해치지 않도록 해 준다.","ev":"6번 문장","s":[[6,"This ensures the radiation targets only cancer cells without destroying too much of the surrounding healthy tissue.","이것은 방사선이 주변의 건강한 조직들을 너무 많이 파괴하지 않고 암 세포만을 조준하게 한다."]],"w":"ensure는 ‘확실하게 하다’, target은 ‘겨냥하다’예요. only cancer cells without destroying too much of the surrounding healthy tissue는 ‘주변의 건강한 조직은 너무 많이 파괴하지 않고 암세포만’이라는 뜻이에요.","c":3},"h":"92ae4c58bf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["중입자 치료는 수술로 쉽게 제거할 수 있는 암에만 쓰일 것으로 예상된다.","중입자 치료는 희귀한 암이나 수술로 제거하기 어려운 암에 널리 쓰일 것으로 예상된다.","의사들은 중입자 치료가 폐와 간의 종양에는 거의 쓰이지 않을 것으로 예상한다.","중입자 치료는 ‘최후 수단 치료법’이라는 별명을 얻었다."],"opts":["Heavy ion therapy is expected to be used only for cancers that are easy to remove by surgery.","Heavy ion therapy is expected to be widely used for rare cancers and cancers that are hard to remove surgically.","Doctors expect heavy ion therapy to be rarely used for tumors in the lungs and liver.","Heavy ion therapy has been given the nickname “the last-resort treatment.”"],"r":{"a":"2) Heavy ion therapy is expected to be widely used for rare cancers and cancers that are hard to remove surgically.","ev":"7~9번 문장","s":[[7,"Heavy ion therapy shows promise in boosting effectiveness for tumors that are hard to treat, such as those found in the lungs and liver.","중입자 치료는 폐와 간에서 발견되는 종양과 같이 치료가 어려운 종양에 대한 효과성을 높일 가능성을 보여 준다."],[8,"It is also anticipated to be widely adopted in treating rare forms of cancer or cancers that are hard to remove surgically.","그것은 또한 암의 희귀한 형태나 수술로 제거하기 어려운 암을 치료하는 데 널리 적용될 것으로 예상된다."],[9,"Thanks to its remarkable capabilities, heavy ion therapy has earned the nickname “the dream cancer treatment,” emerging as a game-changer in the fight against incurable cancers.","이것의 놀라운 능력 덕분에 중입자 치료는 ‘꿈의 암 치료법’이라는 별명을 얻었으며, 불치의 암과의 싸움에서 판도를 바꾸는 요소로서 떠오르고 있다."]],"w":"8번에서 희귀한 암이나 수술로 제거하기 어려운 암에 널리 쓰일 것으로 예상된다고 했어요. 수술이 쉬운 암에만 쓰인다는 말은 반대이고, 폐와 간의 종양은 7번에서 효과의 가능성을 보인 예이며, 별명은 9번에서 ‘꿈의 암 치료법’이라고 했어요.","c":2},"h":"4d2ac39524"},{"n":9,"t":"sum","q":"Carbon ions in heavy ion therapy go (A) to the tumor and release energy that (B) the DNA of cancer cells.","ko":"중입자 치료의 탄소 이온은 종양까지 (A) 도달하여 암세포의 DNA를 (B) 에너지를 내놓는다.","oko":["(A) 곧바로 / (B) 손상시키는","(A) 천천히 / (B) 손상시키는","(A) 곧바로 / (B) 복구하는","(A) 결코 ~않고 / (B) 먹여 살리는","(A) 조용히 / (B) 복사하는"],"opts":["(A) directly / (B) damages","(A) slowly / (B) damages","(A) directly / (B) repairs","(A) never / (B) feeds","(A) quietly / (B) copies"],"r":{"a":"1) (A) directly / (B) damages ((A) 곧바로 / (B) 손상시키는)","ev":"3번 문장","s":[[3,"Unlike standard treatments, this method propels carbon ions to near-light speeds, allowing them to penetrate directly to the tumor and release energy that damages the DNA of cancer cells.","일반적인 치료법과 달리, 이 방법은 탄소 이온을 빛의 속도에 가깝게 추진시켜, 그것들이 종양에 직접 침투하게 하고 암 세포의 DNA를 손상시키는 에너지를 방출하게 한다."]],"w":"3번 문장에서 탄소 이온은 종양까지 곧바로(directly) 도달해 암세포의 DNA를 손상시키는(damages) 에너지를 내놓는다고 해요. slowly·never·quietly와 repairs·feeds·copies는 본문과 맞지 않아요.","c":1},"h":"3af77d28f8"},{"n":10,"t":"fill","q":"Imagine a world where cancer treatment is no longer a tough [A], and cutting-edge [B] offers new hope— even for the most challenging cancers— through heavy ion therapy.","ko":"암 치료가 더 이상 힘든 [A]이(가) 아니고, 최첨단 [B]이(가) 중입자 치료를 통해 가장 어려운 암에게까지 새로운 희망을 주는 세상을 상상해 보라.","bank":["battle","technology","speed","depth","liver","tissue"],"bko":{"battle":"싸움","technology":"기술","speed":"속도","depth":"깊이","liver":"간","tissue":"조직"},"r":{"a":"[A] battle (싸움), [B] technology (기술)","ev":"1번 문장","s":[[1,"Imagine a world where cancer treatment is no longer a tough battle, and cutting-edge technology offers new hope— even for the most challenging cancers— through heavy ion therapy.","암 치료가 더 이상 힘든 싸움이 아니며, 최첨단 기술이 중입자 치료를 통해 심지어 가장 (치료가) 어려운 암에도 새로운 희망을 제공하는 세상을 상상해 봐라."]],"w":"1번 문장은 암 치료가 더 이상 힘든 싸움(battle)이 아니고, 최첨단 기술(technology)이 새로운 희망을 주는 세상을 상상해 보라는 뜻이에요. speed·depth·liver·tissue는 빈칸에 넣으면 뜻이 맞지 않아요.","c":null},"h":"d164503d92"}]},{"u":10,"id":"ch3-10-4","no":4,"ko":"수능:ON 요약문","items":[{"n":1,"t":"tf","q":"Some products are labeled “chemical-free” even though everything contains chemicals.","ko":"어떤 제품들은 모든 것에 화학 물질이 들어 있는데도 ‘화학 물질 없음’이라고 표기되어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Some products are labeled “chemical-free,” when the fact is that everything contains chemicals, including plants and animals.","몇몇 제품들에는 사실은 식물과 동물을 포함해서 모든 것에 화학 물질이 들어있을 때에도 ‘화학 물질 없음’ 이라고 표기되어 있다."]],"w":"4번 문장에서 Some products are labeled “chemical-free,” when the fact is that everything contains chemicals라고 했어요. 본문과 맞아요.","c":"T"},"h":"99d3bb7d9c"},{"n":2,"t":"tf","q":"Environmental advocates say that shoppers are already well informed about the environmental impact of the products they buy.","ko":"환경 옹호자들은 소비자들이 자신이 구매하는 제품의 환경적 영향에 대해 이미 충분히 알고 있다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Environmental advocates agree that there is still a long way to go to ensure that shoppers are adequately informed about the environmental impact of the products they buy.","환경 옹호자들은 소비자들이 그들이 구매하는 제품의 환경적 영향력에 대하여 적절하게 정보를 제공받는 것을 확실하게 하기 위해서는 여전히 갈 길이 멀다는 점에 동의한다."]],"w":"6번 문장에서 환경 옹호자들은 there is still a long way to go(아직 갈 길이 멀다)고 했어요. 이미 충분히 알고 있다는 말은 반대예요.","c":"F"},"h":"a6d343c953"},{"n":3,"t":"tf","q":"Most consumers find out about the false claims before they buy the product.","ko":"대부분의 소비자는 제품을 구매하기 전에 거짓 주장에 대해 알게 된다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Many consumers do not find out about the false claims until after the purchase.","많은 소비자들은 구매 이후까지 거짓 주장에 대해 알아채지 못한다."]],"w":"8번 문장에서 많은 소비자가 do not find out ~ until after the purchase(구매 이후까지 알아채지 못한다)고 했어요. 구매 전에 알게 된다는 말은 반대예요.","c":"F"},"h":"676bbbaec7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Researchers have shown that claims on products are often too vague or misleading.)","ko":"(연구자들은 제품에 관한 주장이 종종 지나치게 …하거나 현혹적이라는 점을 보여 주었다.)","word":"vague","opts":["정확한","모호한","화려한","새로운"],"r":{"a":"2) 모호한","ev":"3번 문장","s":[[3,"Researchers have shown that claims on products are often too vague or misleading.","연구자들은 제품에 관한 주장이 종종 지나치게 모호하거나 현혹적이라는 점을 보여 주었다."]],"w":"3번은 제품에 관한 주장이 너무 ‘vague or misleading’이라고 지적해요. or로 현혹적(misleading)이라는 부정적인 말과 이어졌으니 vague = 모호한이에요. ‘정확한’은 문제라는 흐름과 반대예요.","c":2},"h":"3b643f18ce"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The most common reason for greenwashing is to attract environmentally conscious consumers.)","ko":"(그린워싱의 가장 흔한 이유는 환경적으로 …하는 소비자들을 유인하는 것이다.)","word":"conscious","opts":["~에 무관심한","~에 지친","~에 놀란","~을 의식하는"],"r":{"a":"4) ~을 의식하는","ev":"7번 문장","s":[[7,"The most common reason for greenwashing is to attract environmentally conscious consumers.","그린워싱의 가장 흔한 이유는 환경적으로 의식 있는 소비자들을 유인하는 것이다."]],"w":"그린워싱은 친환경인 척해서 소비자를 끌어들이는 일이에요. 그러니 끌어들이려는 대상은 환경을 신경 쓰는 소비자예요. conscious = 의식하는이고, ‘무관심한’은 반대예요.","c":4},"h":"55c64aeb44"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nGreenwashing involves misleading a consumer into thinking a good or service is more environmentally friendly than it really is.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그린워싱은 소비자가 재화나 서비스를 그것이 실제로 그런 것보다 더 친환경적이라고 생각하도록 현혹시키는 것을 포함한다.","opts":["소비자","재화나 서비스","환경","그린워싱"],"r":{"a":"2) 재화나 서비스","ev":"1번 문장","s":[[1,"Greenwashing involves misleading a consumer into thinking a good or service is more environmentally friendly than it really is.","그린워싱은 소비자가 재화나 서비스를 그것이 실제로 그런 것보다 더 친환경적이라고 생각하도록 현혹시키는 것을 포함한다."]],"w":"문장은 a good or service가 ‘실제보다 더 친환경적’이라고 소비자가 생각하게 만든다는 뜻이에요. than it really is의 it은 비교되는 대상인 a good or service(재화나 서비스)예요. 친환경적이라고 생각되는 것은 소비자가 아니라 상품이에요.","c":2},"h":"333c11f20d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, this strategy can seriously backfire when consumers find out they are being deceived.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 이 전략은 소비자들이 자신들이 기만당하고 있다는 것을 알게 될 때 심각하게 역화를 일으킬 수 있다.","opts":["소비자들이 속고 있다는 것을 알면, 이 전략은 오히려 더 큰 성공을 거둘 수 있다.","소비자들이 속고 있다는 것을 알게 되면, 이 전략은 크게 역효과를 낼 수 있다.","소비자들이 속고 있다는 것을 알지 못하는 한, 이 전략은 크게 실패한다.","소비자들이 이 전략으로 다른 사람들을 속이고 있음을 알면 심각하게 후회한다."],"r":{"a":"2) 소비자들이 속고 있다는 것을 알게 되면, 이 전략은 크게 역효과를 낼 수 있다.","ev":"10번 문장","s":[[10,"However, this strategy can seriously backfire when consumers find out they are being deceived.","하지만, 이 전략은 소비자들이 자신들이 기만당하고 있다는 것을 알게 될 때 심각하게 역화를 일으킬 수 있다."]],"w":"backfire는 ‘역효과를 내다’이고, when consumers find out they are being deceived는 ‘소비자들이 속고 있다는 것을 알게 될 때’예요. 속은 것을 알면 전략이 역효과를 낸다는 뜻이에요. 알지 못할 때는 9번처럼 판매가 늘 수 있어요.","c":2},"h":"0bac2aa078"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그린워싱은 사기에까지 이르는 일은 결코 없다.","법에 의해 이미 요구되는 주장은 제품을 믿을 강한 이유가 된다.","그린워싱에는 환경적 주장을 과장하는 것이 포함되며, 이를 과대 광고라고 한다.","과대 광고는 제품의 환경적 영향을 숨기는 것을 뜻한다."],"opts":["Greenwashing never goes as far as fraud.","A claim that is already required by law is a strong reason to trust a product.","Greenwashing includes exaggerating environmental claims, which is called puffery.","Puffery means hiding the environmental impact of a product."],"r":{"a":"3) Greenwashing includes exaggerating environmental claims, which is called puffery.","ev":"2번 문장","s":[[2,"Greenwashing ranges from making environmental claims that are already required by law, and therefore irrelevant (CFC-free for example), to puffery (exaggerating environmental claims), and even fraud.","그린워싱은 법에 의해 이미 요구되는 환경적 주장을 하는 것, 그래서 무의미한 것(예를 들면 CFC 없음)에서부터 과대 광고(환경적 주장을 과장하는 것)와 사기에 이르기까지를 포함한다."]],"w":"2번에서 그린워싱은 법이 이미 요구해서 의미 없는 주장에서부터 puffery(환경적 주장을 과장하는 것)와 사기(fraud)에 이르기까지라고 했어요. 사기도 포함되고, 법이 요구하는 주장은 무의미하며(irrelevant), puffery는 숨기는 것이 아니라 과장하는 것이에요.","c":3},"h":"6aed437b0d"},{"n":9,"t":"sum","q":"Greenwashing may (A) sales in the short (B).","ko":"그린워싱은 짧은 (B) 동안 판매를 (A) 수 있다.","oko":["(A) 늘릴 / (B) 기간","(A) 늘릴 / (B) 셔츠","(A) 줄일 / (B) 기간","(A) 숨길 / (B) 지도","(A) 줄일 / (B) 달"],"opts":["(A) increase / (B) term","(A) increase / (B) shirt","(A) reduce / (B) term","(A) hide / (B) map","(A) reduce / (B) moon"],"r":{"a":"1) (A) increase / (B) term ((A) 늘릴 / (B) 기간)","ev":"9번 문장","s":[[9,"Therefore, greenwashing may increase sales in the short term.","그러므로 그린워싱은 단기적으로는 판매량을 증가시킬 수도 있다."]],"w":"9번 문장에서 그린워싱은 단기적으로(in the short term) 판매를 늘릴(increase) 수 있다고 해요. reduce와 hide는 반대이거나 맞지 않고, shirt·map·moon은 문장에 들어가지 않아요.","c":1},"h":"4ea38c79a7"},{"n":10,"t":"fill","q":"Products with the highest number of misleading or unverifiable claims include laundry [A], household cleaners, and [B].","ko":"현혹적이거나 확인할 수 없는 주장이 가장 많은 제품에는 세탁 [A], 가정용 세제, 그리고 [B]이(가) 포함된다.","bank":["detergents","paints","plants","animals","fraud","claims"],"bko":{"detergents":"세제","paints":"페인트","plants":"식물","animals":"동물","fraud":"사기","claims":"주장"},"r":{"a":"[A] detergents, [B] paints","ev":"5번 문장","s":[[5,"Products with the highest number of misleading or unverifiable claims include laundry detergents, household cleaners, and paints.","현혹적이고 확인할 수 없는 주장이 가장 많이 포함된 제품들은 세탁 세제, 가정용 세제, 그리고 페인트이다."]],"w":"5번에서 현혹적이거나 확인할 수 없는 주장이 가장 많은 제품은 세탁 세제(laundry detergents), 가정용 세제(household cleaners), 페인트(paints)라고 했어요. plants·animals는 4번에서 모든 것에 화학 물질이 있다는 예이고, fraud·claims는 제품이 아니라서 목록에 들어갈 수 없어요.","c":null},"h":"e24e1cb4ea"}]}];
