3번은 수술 없이 교정한다고 해요.","c":2},"h":"dc8f235490"},{"n":9,"t":"sum","q":"Mewing works especially well on (A) whose bones are still growing, but even some (B) say it works for them.","ko":"뮤잉은 뼈가 아직 자라고 있는 (A)에게 특히 효과가 좋지만, 일부 (B)도 자신에게 효과가 있다고 말한다.","oko":["(A) 어린아이 / (B) 의사","(A) 성인 / (B) 어린아이","(A) 어린아이 / (B) 성인","(A) 치과의사 / (B) 환자","(A) 성인 / (B) 의사"],"opts":["(A) children / (B) doctors","(A) adults / (B) children","(A) children / (B) adults","(A) dentists / (B) patients","(A) adults / (B) doctors"],"r":{"a":"3) (A) children / (B) adults","ev":"11~12번 문장","s":[[11,"Mewing is especially effective on young children whose bones are still growing.","뮤잉은 특히 뼈가 아직 자라고 있는 어린아이들에게 효과적이다."],[12,"But even some adults say that mewing works well on them, too!","하지만 일부 성인들은 뮤잉이 그들에게도 상당히 효과가 있다고 말한다!"]],"w":"11번에서 뼈가 자라는 어린아이에게 특히 효과적이라고 하고, 12번에서 But 일부 성인도 효과가 있다고 말한다고 해요.","c":3},"h":"03d8862307"},{"n":10,"t":"fill","q":"To do mewing, place the whole [A] against the roof of the mouth, and then close the [B].","ko":"뮤잉을 하려면 [A] 전체를 입천장에 갖다 대고, 그다음 [B]을 다문다.","bank":["tongue","lips","chin","bones","surgery","habits"],"bko":{"tongue":"혀","lips":"입술","chin":"턱","bones":"뼈","surgery":"수술","habits":"습관"},"r":{"a":"[A] tongue, [B] lips","ev":"5, 7번 문장","s":[[5,"The practice of mewing is simple: Place the entire tongue against the roof of the mouth.","뮤잉의 실천은 간단하다. 혀 전체를 입천장에 갖다 대어 두어라."],[7,"Then, close the lips while keeping the upper and lower teeth apart.","그 다음, 윗니와 아랫니를 떨어뜨린 상태를 유지하면서 입술을 다물어라."]],"w":"5번에서 the entire tongue을 입천장에 갖다 대고, 7번에서 Then, close the lips(그 다음 입술을 다물어라)라고 해요. chin, bones, surgery, habits는 이 방법에 나오지 않아요.","c":null},"h":"bc4de8d7da"}]},{"u":7,"id":"hk4-07-2","no":2,"ko":"세상에 비밀은 없다\b","items":[{"n":1,"t":"tf","q":"Nate was removed from the football team because of his social media account.","ko":"Nate는 그의 소셜 미디어 계정 때문에 미식축구팀에서 제외되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He was removed from the football team because of his social media account!","그는 그의 소셜 미디어 계정 때문에 미식축구팀에서 제외되었다!"]],"w":"3번 문장에서 He was removed from the football team because of his social media account라고 해요.","c":"T"},"h":"3836ae1e45"},{"n":2,"t":"tf","q":"Nate left the university because he was not a good player.","ko":"Nate는 뛰어난 선수가 아니어서 대학을 떠났다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Although he was a good player, it made Cornell worry about his personality, and he had to leave the university.","비록 그는 뛰어난 선수였지만, 이것은 코넬 대학이 그의 인성에 대해 우려하도록 만들었고, 그는 대학을 떠나야 했다."]],"w":"5번 문장은 Although he was a good player(뛰어난 선수였지만)라고 해요. 인성에 대한 우려 때문에 떠난 거라서 실력 때문이라는 말은 틀려요.","c":"F"},"h":"f5e68687f8"},{"n":3,"t":"tf","q":"When a person applies for a U.S. visa, the government collects social media information.","ko":"미국 비자를 신청하면 정부는 소셜 미디어 정보를 수집한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Nowadays, when a person applies for a U.S. visa, the government collects social media information.","요즘에는, 한 사람이 미국 비자를 신청하면, 정부가 소셜 미디어 정보를 수집한다."]],"w":"11번 문장에서 비자를 신청하면 정부가 소셜 미디어 정보를 수집한다고 해요.","c":"T"},"h":"3c980b5ade"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He was removed from the football team because of his social media account!)","ko":"그는 그의 소셜 미디어 계정 때문에 미식축구팀에서 ( )!","opts":["뽑힌","칭찬받은","제외된","소개된"],"word":"removed","r":{"a":"3) 제외된","ev":"3번 문장","s":[[3,"He was removed from the football team because of his social media account!","그는 그의 소셜 미디어 계정 때문에 미식축구팀에서 제외되었다!"]],"w":"2번에서 충격적인 소식(shocking news)을 받았다고 했고, 3번이 그 소식이에요. was removed from the team은 '팀에서 제외되었다'예요. remove = 제외하다, 제거하다.","c":3},"h":"be713d6497"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…photos with inappropriate behavior…)","ko":"그들은 ( ) 행동을 한 사진과 인종, 성별 또는 종교에 관한 부정적인 게시글을 살펴본다.","opts":["훌륭한","유명한","안전한","부적절한"],"word":"inappropriate","r":{"a":"4) 부적절한","ev":"8번 문장","s":[[8,"They search the applicants’ accounts for things like photos with inappropriate behavior and negative posts about race, gender, or religion.","그들은 부적절한 행동을 한 사진과 인종, 성별 또는 종교에 관한 부정적인 게시글과 같은 것들에 대해 지원자들의 계정을 살펴본다."]],"w":"고용주가 찾아보는 것은 좋지 않은 사진과 부정적인 글이에요. 그래서 inappropriate는 '부적절한'이 알맞아요.","c":4},"h":"3a4a2bed6d"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt then uses this to determine whether the applicant is a threat to the country.","ko":"밑줄 친 It이 가리키는 것은?","sko":"정부는 그 후 이것을 신청자가 나라에 위협적인 존재인지 아닌지 판단하기 위해 이용한다.","opts":["구직자","미국 정부","고용주","소셜 미디어 사이트"],"r":{"a":"2) 미국 정부","ev":"11~12번 문장","s":[[11,"Nowadays, when a person applies for a U.S. visa, the government collects social media information.","요즘에는, 한 사람이 미국 비자를 신청하면, 정부가 소셜 미디어 정보를 수집한다."],[12,"It then uses this to determine whether the applicant is a threat to the country.","정부는 그 후 이것을 신청자가 나라에 위협적인 존재인지 아닌지 판단하기 위해 이용한다."]],"w":"11번에서 비자를 신청하면 the government(정부)가 소셜 미디어 정보를 수집한다고 했고, 12번의 It은 그 정부예요.","c":2},"h":"bb2bb7c170"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Such content can take away job opportunities.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그러한 콘텐츠는 취업 기회를 없앨 수 있다.","opts":["그런 게시글은 취업 기회를 잃게 만들 수 있다.","그런 게시글은 취업 기회를 더 늘려 준다.","그런 게시글은 취업 기회와 아무 상관이 없다.","그런 게시글을 올리면 회사가 월급을 올려 준다."],"r":{"a":"1) 그런 게시글은 취업 기회를 잃게 만들 수 있다.","ev":"8~9번 문장","s":[[8,"They search the applicants’ accounts for things like photos with inappropriate behavior and negative posts about race, gender, or religion.","그들은 부적절한 행동을 한 사진과 인종, 성별 또는 종교에 관한 부정적인 게시글과 같은 것들에 대해 지원자들의 계정을 살펴본다."],[9,"Such content can take away job opportunities.","그러한 콘텐츠는 취업 기회를 없앨 수 있다."]],"w":"take away는 '없애다, 가져가다'예요. 부적절한 게시글(8번)은 취업 기회를 없앨 수 있다는 뜻이에요.","c":1},"h":"2446cbaf07"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고용주의 7퍼센트만 소셜 미디어를 본다.","고용주는 소셜 미디어를 전혀 보지 않는다.","고용주의 70퍼센트가 채용 과정에서 소셜 미디어로 구직자를 심사한다.","고용주는 사진만 보고 글은 보지 않는다."],"opts":["Only 7% of employers use social media for hiring.","Employers never check social media.","70% of employers use social media to review job applicants.","Employers look only at photos, not posts."],"r":{"a":"3) 70% of employers use social media to review job applicants.","ev":"7~8번 문장","s":[[7,"In fact, 70% of employers use social media to review job applicants during their hiring process.","실제로, 고용주들의 70퍼센트가 채용 과정 동안 구직자들을 심사하기 위해 소셜 미디어를 이용한다."],[8,"They search the applicants’ accounts for things like photos with inappropriate behavior and negative posts about race, gender, or religion.","그들은 부적절한 행동을 한 사진과 인종, 성별 또는 종교에 관한 부정적인 게시글과 같은 것들에 대해 지원자들의 계정을 살펴본다."]],"w":"7번에서 고용주의 70%가 채용 과정 동안 소셜 미디어로 구직자를 심사한다고 해요. 8번에는 사진뿐 아니라 부정적인 게시글도 살펴본다고 나와요.","c":3},"h":"437d2b6d58"},{"n":9,"t":"sum","q":"Inappropriate posts can take away (A) opportunities and become (B) to visiting the country.","ko":"부적절한 게시글은 (A) 기회를 없애고 나라를 방문하는 데 (B)이 될 수 있다.","oko":["(A) 여행 / (B) 보상","(A) 운동 / (B) 도움","(A) 취업 / (B) 선물","(A) 학교 / (B) 이유","(A) 취업 / (B) 장애물"],"opts":["(A) travel / (B) rewards","(A) sports / (B) help","(A) job / (B) gifts","(A) school / (B) reasons","(A) job / (B) obstacles"],"r":{"a":"5) (A) job / (B) obstacles","ev":"9~10번 문장","s":[[9,"Such content can take away job opportunities.","그러한 콘텐츠는 취업 기회를 없앨 수 있다."],[10,"In addition, socially unacceptable posts can be obstacles to visiting the country.","게다가, 사회적으로 받아들일 수 없는 게시글은 그 나라를 방문하는 것에 장애물이 될 수 있다."]],"w":"9번에서 그런 콘텐츠는 job opportunities(취업 기회)를 없앨 수 있다고 하고, 10번에서 나라를 방문하는 데 obstacles(장애물)가 될 수 있다고 해요.","c":5},"h":"87dd54dff4"},{"n":10,"t":"fill","q":"Nate and his friend posted a [A] with [B] content, so Nate had to leave the university.","ko":"Nate와 그의 친구는 [B] 내용이 담긴 [A]을 올렸고, 그래서 Nate는 대학을 떠나야 했다.","bank":["video","racist","semester","hiring","threat","freshman"],"bko":{"video":"영상","racist":"인종차별적인","semester":"학기","hiring":"채용","threat":"위협적인 존재","freshman":"신입생"},"r":{"a":"[A] video, [B] racist","ev":"4~5번 문장","s":[[4,"Nate and his friend had posted a video with racist content on a social media site.","Nate와 그의 친구는 인종차별적인 내용의 영상을 소셜 미디어 사이트에 올렸었다."],[5,"Although he was a good player, it made Cornell worry about his personality, and he had to leave the university.","비록 그는 뛰어난 선수였지만, 이것은 코넬 대학이 그의 인성에 대해 우려하도록 만들었고, 그는 대학을 떠나야 했다."]],"w":"4번에서 Nate와 친구가 a video with racist content(인종차별적인 내용의 영상)를 올렸고, 5번에서 그것 때문에 Nate가 대학을 떠나야 했어요. semester, hiring, threat, freshman은 이 사건의 내용이 아니에요.","c":null},"h":"4a3f7a9804"}]},{"u":7,"id":"hk4-07-3","no":3,"ko":"놀다 보니 어느새...?\b","items":[{"n":1,"t":"tf","q":"Researchers at Oxford University developed a VR program to treat the fear of heights.","ko":"옥스퍼드 대학의 연구원들은 고소공포증을 치료하는 VR 프로그램을 개발했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Recently, researchers at Oxford University have developed a program to treat the fear of heights using virtual reality (VR).","최근, 옥스퍼드 대학의 연구원들은 가상현실(VR)을 이용하여 고소공포증을 치료하는 프로그램을 개발했다."]],"w":"3번 문장에 그대로 나와요. 가상현실(VR)을 이용해 고소공포증(fear of heights)을 치료하는 프로그램이에요.","c":"T"},"h":"fe20db4b92"},{"n":2,"t":"tf","q":"The participants did the tasks in a real two-story building.","ko":"참가자들은 실제 2층짜리 건물에서 과제를 했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"During the treatment, the participants put on a VR headset and completed several tasks in a virtual 10-story shopping mall.","치료 동안, 참가자들은 VR 헤드셋을 착용했고 가상의 10층짜리 쇼핑몰에서 몇 가지 과제를 완료했다."]],"w":"5번 문장은 virtual 10-story shopping mall(가상의 10층짜리 쇼핑몰)이라고 해요. 실제 건물도, 2층도 아니에요.","c":"F"},"h":"cae2950f08"},{"n":3,"t":"tf","q":"The tasks were designed to be fun to help people overcome their fear.","ko":"과제는 사람들이 공포를 이겨내도록 돕기 위해 재미있도록 설계되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The tasks were designed to be fun to help people overcome their fear more easily.","과제는 사람들이 공포를 더 쉽게 이겨내도록 돕기 위해 재미있도록 설계되었다."]],"w":"6번 문장 The tasks were designed to be fun to help people overcome their fear more easily와 같은 내용이에요.","c":"T"},"h":"022a1f2f74"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…help people overcome their fear more easily.)","ko":"과제는 사람들이 공포를 더 쉽게 ( ) 돕기 위해 재미있도록 설계되었다.","opts":["키우도록","이겨내도록","숨기도록","잊어버리도록"],"word":"overcome","r":{"a":"2) 이겨내도록","ev":"6번 문장","s":[[6,"The tasks were designed to be fun to help people overcome their fear more easily.","과제는 사람들이 공포를 더 쉽게 이겨내도록 돕기 위해 재미있도록 설계되었다."]],"w":"과제를 재미있게 만든 목적은 공포를 더 쉽게 '이겨내도록' 돕는 거예요. overcome = 이겨내다, 극복하다.","c":2},"h":"d5447c1fc1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…they involved rescuing a cat from a tree…)","ko":"…나무에서 고양이를 ( ) 것…","opts":["그리는","키우는","구출하는","팔아 주는"],"word":"rescuing","r":{"a":"3) 구출하는","ev":"7번 문장","s":[[7,"For example, they involved rescuing a cat from a tree, walking across a rope bridge, or even riding a flying whale!","예를 들어, 그것들은 나무에서 고양이를 구출하는 것, 밧줄로 된 다리를 걸어서 건너는 것, 또는 심지어 나는 고래를 타는 것을 포함했다!"]],"w":"나무에서 고양이를 어떻게 하는 과제인지 생각해 보세요. 나무 위에 있는 고양이를 도와 내려오게 하는 것이라 rescue는 '구출하다'예요.","c":3},"h":"03902d50c0"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAfter the final session, about 70% of them said that they were much less afraid!","ko":"밑줄 친 them이 가리키는 것은?","sko":"마지막 활동 후에, 그들의 약 70퍼센트가 훨씬 덜 두려워한다고 말했다!","opts":["연구원들","과제들","참가자들","쇼핑몰의 손님들"],"r":{"a":"3) 참가자들","ev":"9~10번 문장","s":[[9,"In this way, they went through 30-minute VR treatment sessions over two weeks.","이 방식으로, 그들은 2주에 걸쳐서 30분짜리 VR 치료 활동들을 끝마쳤다."],[10,"After the final session, about 70% of them said that they were much less afraid!","마지막 활동 후에, 그들의 약 70퍼센트가 훨씬 덜 두려워한다고 말했다!"]],"w":"두려움이 줄었다고 말한 사람들은 치료 활동을 끝마친 참가자들이에요. 9번의 they(참가자들)를 10번에서 them으로 받았어요.","c":3},"h":"7db72321ad"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Once the participants succeeded in one task, they would go up to a higher floor and start another.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"일단 참가자들이 한 과제에 성공했다면, 그들은 더 높은 층으로 올라가서 또 하나의 과제를 시작할 것이다.","opts":["한 과제에 실패하면 1층으로 돌아가서 처음부터 다시 한다.","모든 과제를 한 층에서 한꺼번에 끝낸다.","과제에 성공하면 쇼핑몰 밖으로 나가서 치료를 마친다.","한 과제에 성공하면 더 높은 층에서 다른 과제를 시작한다."],"r":{"a":"4) 한 과제에 성공하면 더 높은 층에서 다른 과제를 시작한다.","ev":"8번 문장","s":[[8,"Once the participants succeeded in one task, they would go up to a higher floor and start another.","일단 참가자들이 한 과제에 성공했다면, 그들은 더 높은 층으로 올라가서 또 하나의 과제를 시작할 것이다."]],"w":"Once는 '일단 ~하면'이에요. 한 과제에 성공하고 나면 더 높은 층으로 올라가 다른 과제를 시작하는 거예요.","c":4},"h":"200042c935"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["치료는 30분짜리 활동으로 2주에 걸쳐 진행되었다.","치료는 하루에 30분씩 일 년 동안 진행되었다.","치료는 한 번의 3시간짜리 활동으로 끝났다.","치료는 2주 동안 하루에 30시간씩 진행되었다."],"opts":["The treatment took 30-minute sessions over two weeks.","The treatment took 30 minutes a day for a year.","The treatment was a single three-hour session.","The treatment took 30 hours a day for two weeks."],"r":{"a":"1) The treatment took 30-minute sessions over two weeks.","ev":"9번 문장","s":[[9,"In this way, they went through 30-minute VR treatment sessions over two weeks.","이 방식으로, 그들은 2주에 걸쳐서 30분짜리 VR 치료 활동들을 끝마쳤다."]],"w":"9번에서 30-minute VR treatment sessions를 2주에 걸쳐(over two weeks) 끝마쳤다고 해요.","c":1},"h":"eb7cca6d45"},{"n":9,"t":"sum","q":"Researchers used (A) to treat the fear of heights, and about 70% of the participants felt much (B) afraid.","ko":"연구원들은 고소공포증을 치료하기 위해 (A)을 이용했고, 참가자들의 약 70%는 훨씬 (B) 두려워했다.","oko":["(A) 약 / (B) 덜","(A) 음악 / (B) 더","(A) 가상현실 / (B) 더","(A) 약 / (B) 더","(A) 가상현실 / (B) 덜"],"opts":["(A) medicine / (B) less","(A) music / (B) more","(A) virtual reality / (B) more","(A) medicine / (B) more","(A) virtual reality / (B) less"],"r":{"a":"5) (A) virtual reality / (B) less","ev":"3, 10번 문장","s":[[3,"Recently, researchers at Oxford University have developed a program to treat the fear of heights using virtual reality (VR).","최근, 옥스퍼드 대학의 연구원들은 가상현실(VR)을 이용하여 고소공포증을 치료하는 프로그램을 개발했다."],[10,"After the final session, about 70% of them said that they were much less afraid!","마지막 활동 후에, 그들의 약 70퍼센트가 훨씬 덜 두려워한다고 말했다!"]],"w":"3번에서 가상현실(VR)을 이용한 프로그램을 개발했다고 하고, 10번에서 약 70%가 훨씬 덜(much less) 두려워한다고 말했어요.","c":5},"h":"48fc59f9f0"},{"n":10,"t":"fill","q":"Participants wore a VR [A] and did tasks like rescuing a cat or walking across a rope [B].","ko":"참가자들은 VR [A]를 쓰고 고양이를 구출하거나 밧줄 [B]를 건너는 것 같은 과제를 했다.","bank":["headset","bridge","whale","mall","decade","solution"],"bko":{"headset":"헤드셋","bridge":"다리","whale":"고래","mall":"쇼핑몰","decade":"10년","solution":"해결책"},"r":{"a":"[A] headset, [B] bridge","ev":"5, 7번 문장","s":[[5,"During the treatment, the participants put on a VR headset and completed several tasks in a virtual 10-story shopping mall.","치료 동안, 참가자들은 VR 헤드셋을 착용했고 가상의 10층짜리 쇼핑몰에서 몇 가지 과제를 완료했다."],[7,"For example, they involved rescuing a cat from a tree, walking across a rope bridge, or even riding a flying whale!","예를 들어, 그것들은 나무에서 고양이를 구출하는 것, 밧줄로 된 다리를 걸어서 건너는 것, 또는 심지어 나는 고래를 타는 것을 포함했다!"]],"w":"5번에서 참가자들이 VR headset을 착용했고, 7번에서 walking across a rope bridge(밧줄로 된 다리를 걸어서 건너기)가 과제의 예로 나와요. whale은 타는 대상, mall은 과제를 하는 장소라서 빈칸에 맞지 않아요.","c":null},"h":"fb81a176d9"}]},{"u":7,"id":"hk4-07-4","no":4,"ko":"1,000억짜리 계란\b","items":[{"n":1,"t":"tf","q":"In Zimbabwe in 2008, three eggs cost 100 billion dollars.","ko":"2008년 짐바브웨에서는 계란 세 알이 1,000억 달러였다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"But, what if you couldn’t even buy an egg because three eggs cost 100 billion dollars?","하지만, 만약 계란 세 알이 1,000억 달러이기 때문에 계란 한 알조차 살 수 없다면 어떨까?"],[4,"In 2008, this actually happened in Zimbabwe.","2008년에, 이것은 짐바브웨에서 실제로 일어났다."]],"w":"3번에서 계란 세 알이 1,000억 달러라면 어떨까라고 물었고, 4번에서 이 일이 2008년 짐바브웨에서 실제로 일어났다고 해요.","c":"T"},"h":"9a73d37f23"},{"n":2,"t":"tf","q":"Zimbabwe has never been a rich country in Africa.","ko":"짐바브웨는 아프리카에서 부유한 나라였던 적이 한 번도 없다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Zimbabwe was once one of the richest countries in Africa.","짐바브웨는 한때 아프리카에서 가장 부유한 나라들 중 하나였다."]],"w":"5번에서 짐바브웨는 한때 아프리카에서 가장 부유한 나라들 중 하나(once one of the richest countries)였다고 해요.","c":"F"},"h":"02b65144e6"},{"n":3,"t":"tf","q":"People used one-billion-dollar bills as firewood and wallpaper.","ko":"사람들은 10억 달러짜리 지폐를 장작과 벽지로 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"In the end, people used one-billion-dollar bills as firewood, wallpaper, and even toilet paper.","결국, 사람들은 10억 달러짜리 지폐를 장작, 벽지, 그리고 심지어 휴지로 사용했다."]],"w":"13번 문장에 지폐를 장작(firewood), 벽지(wallpaper), 휴지로 썼다고 나와요.","c":"T"},"h":"24d5194b72"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…severe droughts sharply reduced crop production.)","ko":"…( ) 가뭄이 작물 생산량을 급격히 감소시킨 것이다.","opts":["극심한","부드러운","짧은","귀중한"],"word":"severe","r":{"a":"1) 극심한","ev":"7번 문장","s":[[7,"The first of these reasons is that severe droughts sharply reduced crop production.","이러한 이유 중 첫 번째는 극심한 가뭄이 작물 생산량을 급격히 감소시킨 것이다."]],"w":"가뭄 때문에 작물 생산량이 급격히 줄었다고 했으니 가뭄이 아주 심했다는 뜻이에요. severe = 극심한, 심각한.","c":1},"h":"b2bfe5217e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…as the money became less valuable.)","ko":"…돈이 덜 ( ) 됨에 따라…","opts":["위험한","놀라운","불필요한","가치 있는"],"word":"valuable","r":{"a":"4) 가치 있는","ev":"11번 문장","s":[[11,"Unfortunately, this only made matters worse, as the money became less valuable.","유감스럽게도, 돈이 덜 가치 있게 됨에 따라, 이것은 문제가 더 악화되도록 만들기만 했다."]],"w":"돈을 더 많이 발행하면 돈 한 장의 값어치가 떨어져요. less valuable은 '덜 가치 있는'이에요. 12번에서 물가가 급격히 올랐다는 것도 같은 흐름이에요.","c":4},"h":"bd13f2b5ac"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nIn 2008, this actually happened in Zimbabwe.","ko":"밑줄 친 this가 가리키는 것은?","sko":"2008년에, 이것은 짐바브웨에서 실제로 일어났다.","opts":["10억 달러로 전용기를 사는 일","계란 세 알이 1,000억 달러여서 계란 한 알조차 살 수 없는 일","짐바브웨가 아프리카에서 가장 부유한 나라가 된 일","정부가 지폐를 장작으로 쓴 일"],"r":{"a":"2) 계란 세 알이 1,000억 달러여서 계란 한 알조차 살 수 없는 일","ev":"3~4번 문장","s":[[3,"But, what if you couldn’t even buy an egg because three eggs cost 100 billion dollars?","하지만, 만약 계란 세 알이 1,000억 달러이기 때문에 계란 한 알조차 살 수 없다면 어떨까?"],[4,"In 2008, this actually happened in Zimbabwe.","2008년에, 이것은 짐바브웨에서 실제로 일어났다."]],"w":"4번의 this는 바로 앞 3번의 상황, 즉 계란 세 알이 1,000억 달러여서 계란 한 알도 못 사는 일이에요.","c":2},"h":"4fee6c278a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As a result, the country became short of money.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 결과, 그 나라는 돈이 부족해졌다.","opts":["그 결과 그 나라는 돈이 너무 많아졌다.","그 결과 그 나라는 가뭄이 사라졌다.","그 결과 그 나라는 돈이 모자라게 되었다.","그 결과 그 나라는 다른 나라에 돈을 빌려주었다."],"r":{"a":"3) 그 결과 그 나라는 돈이 모자라게 되었다.","ev":"8~9번 문장","s":[[8,"Furthermore, economic policy failures and political corruption increased the national debt.","게다가, 경제 정책 실패와 정치적 부패가 국가 부채를 증가시켰다."],[9,"As a result, the country became short of money.","그 결과, 그 나라는 돈이 부족해졌다."]],"w":"short of money는 '돈이 부족한'이에요. 가뭄으로 작물이 줄고(7번) 정책 실패와 부패로 빚이 늘어서(8번) 나라에 돈이 부족해졌어요.","c":3},"h":"8011100667"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["정부는 돈을 줄여서 문제를 해결하려고 했다.","정부는 지폐를 모두 없애서 문제를 해결하려고 했다.","정부는 외국에서 돈을 빌려서 문제를 해결하려고 했다.","정부는 더 많은 돈을 발행해서 문제를 해결하려고 했다."],"opts":["The government tried to solve the problem by reducing money.","The government tried to solve the problem by removing all bills.","The government tried to solve the problem by borrowing money from other countries.","The government tried to solve the problem by printing more money."],"r":{"a":"4) The government tried to solve the problem by printing more money.","ev":"10번 문장","s":[[10,"The government tried to solve the problem by printing more money and creating larger bills.","정부는 더 많은 돈을 발행하고 더 큰 금액의 지폐를 만듦으로써 문제를 해결하려고 노력했다."]],"w":"10번에서 정부는 더 많은 돈을 발행하고(printing more money) 더 큰 금액의 지폐를 만들어서 문제를 해결하려고 했어요.","c":4},"h":"e50a935d8e"},{"n":9,"t":"sum","q":"Zimbabwe’s economy declined because (A) reduced crop production and economic policy failures increased the national (B).","ko":"짐바브웨의 경제가 쇠퇴한 것은 (A)가 작물 생산량을 줄이고 경제 정책 실패가 국가 (B)를 늘렸기 때문이다.","oko":["(A) 홍수 / (B) 세금","(A) 가뭄 / (B) 소득","(A) 전쟁 / (B) 부채","(A) 홍수 / (B) 부채","(A) 가뭄 / (B) 부채"],"opts":["(A) floods / (B) taxes","(A) droughts / (B) income","(A) wars / (B) debt","(A) floods / (B) debt","(A) droughts / (B) debt"],"r":{"a":"5) (A) droughts / (B) debt","ev":"7~8번 문장","s":[[7,"The first of these reasons is that severe droughts sharply reduced crop production.","이러한 이유 중 첫 번째는 극심한 가뭄이 작물 생산량을 급격히 감소시킨 것이다."],[8,"Furthermore, economic policy failures and political corruption increased the national debt.","게다가, 경제 정책 실패와 정치적 부패가 국가 부채를 증가시켰다."]],"w":"7번에서 극심한 가뭄(droughts)이 작물 생산량을 줄였고, 8번에서 경제 정책 실패와 정치적 부패가 국가 부채(national debt)를 늘렸어요.","c":5},"h":"9fd6092b58"},{"n":10,"t":"fill","q":"The government tried to solve the problem by printing more [A], but the money became less [B].","ko":"정부는 더 많은 [A]을 발행해서 문제를 해결하려고 했지만, 돈은 덜 [B] 되었다.","bank":["money","valuable","drought","debt","firewood","corruption"],"bko":{"money":"돈","valuable":"가치 있는","drought":"가뭄","debt":"부채","firewood":"장작","corruption":"부패"},"r":{"a":"[A] money, [B] valuable","ev":"10~11번 문장","s":[[10,"The government tried to solve the problem by printing more money and creating larger bills.","정부는 더 많은 돈을 발행하고 더 큰 금액의 지폐를 만듦으로써 문제를 해결하려고 노력했다."],[11,"Unfortunately, this only made matters worse, as the money became less valuable.","유감스럽게도, 돈이 덜 가치 있게 됨에 따라, 이것은 문제가 더 악화되도록 만들기만 했다."]],"w":"10번에서 정부가 printing more money(더 많은 돈을 발행)했고, 11번에서 돈이 less valuable(덜 가치 있는)해졌다고 해요. 나머지는 명사라서 [B]의 자리(become less ~)에 맞지 않고, 내용도 달라요.","c":null},"h":"78ab7c383d"}]},{"u":8,"id":"hk4-08-1","no":1,"ko":"당신의 취향을 저격해 드립니다\b","items":[{"n":1,"t":"tf","q":"John clicks the advertisement and buys the shoes.","ko":"John은 그 광고를 클릭해서 그 신발을 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Eventually, John clicks the advertisement and buys the shoes.","마침내, John은 그 광고를 클릭해서 그 신발을 산다."]],"w":"5번 문장에서 마침내 John이 광고를 클릭해서 신발을 산다고 해요.","c":"T"},"h":"9e1cb33428"},{"n":2,"t":"tf","q":"John buys the running shoes right after searching for them at the first online shopping mall.","ko":"John은 첫 번째 온라인 쇼핑몰에서 러닝화를 검색한 직후 바로 산다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"He searches for them on an online shopping mall but decides not to buy them.","그는 그것들을 온라인 쇼핑몰에서 검색하지만 사지 않기로 결정한다."]],"w":"2번 문장은 검색하지만 사지 않기로 결정한다(decides not to buy them)고 해요. 산 것은 광고를 여러 번 본 뒤(5번)예요.","c":"F"},"h":"7ee77c14eb"},{"n":3,"t":"tf","q":"Programmatic advertising shows the same advertisement to everyone.","ko":"프로그래매틱 광고는 모든 사람에게 같은 광고를 보여준다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"Since advertisements are selectively shown to those who are more likely to buy the goods, the results are quite effective.","광고가 상품을 살 가능성이 더 높은 사람들에게 선택적으로 보이기 때문에, 결과는 꽤 효과적이다."]],"w":"13번에서 광고는 상품을 살 가능성이 더 높은 사람들에게 선택적으로(selectively) 보인다고 해요. 모든 사람에게 같은 광고를 보여주는 것이 아니에요.","c":"F"},"h":"6632796fda"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…you might have wondered why you see the same advertisement…)","ko":"…당신은 왜 같은 광고를 다양한 웹사이트에서 보는지 ( ) 수도 있다.","opts":["잊었던","자랑했던","궁금했던","싫어했던"],"word":"wondered","r":{"a":"3) 궁금했던","ev":"7번 문장","s":[[7,"If so, you might have wondered why you see the same advertisement on different websites.","만약 그렇다면, 당신은 왜 같은 광고를 다양한 웹사이트에서 보는지 궁금했을 수도 있다."]],"w":"7번은 같은 광고를 여러 웹사이트에서 보는 이유를 묻는 말이에요. why 이하가 궁금한 내용이라 wonder는 '궁금하다'예요.","c":3},"h":"541d860532"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the program analyzes your interests and preferences.)","ko":"…프로그램은 당신의 관심사와 선호도를 ( ).","opts":["분석한다","삭제한다","복사한다","판매한다"],"word":"analyzes","r":{"a":"1) 분석한다","ev":"11번 문장","s":[[11,"By using these cookies, the program analyzes your interests and preferences.","이 쿠키를 사용하여, 프로그램은 당신의 관심사와 선호도를 분석한다."]],"w":"11번은 프로그램이 쿠키를 이용해 내 관심사와 선호도를 살펴보는 내용이에요. 그 결과로 12번에서 알맞은 광고를 보여주므로 analyze는 '분석하다'예요.","c":1},"h":"1b280af285"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThen it shows the best advertisements for you.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그 다음 그것은 당신을 위한 최고의 광고를 보여준다.","opts":["인터넷 쿠키","관심사와 선호도를 분석하는 프로그램","당신의 기기","John"],"r":{"a":"2) 관심사와 선호도를 분석하는 프로그램","ev":"11~12번 문장","s":[[11,"By using these cookies, the program analyzes your interests and preferences.","이 쿠키를 사용하여, 프로그램은 당신의 관심사와 선호도를 분석한다."],[12,"Then it shows the best advertisements for you.","그 다음 그것은 당신을 위한 최고의 광고를 보여준다."]],"w":"11번의 주어 the program(프로그램)이 쿠키로 관심사를 분석하고, 12번의 it은 그 프로그램이에요. 쿠키는 분석에 쓰이는 재료예요.","c":2},"h":"eb0874717e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Every time you search something online, Internet cookies are created and stored on your device.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 온라인상에서 무언가를 검색할 때마다, 인터넷 쿠키가 만들어지고 당신의 기기에 저장된다.","opts":["검색을 한 번 하면 쿠키가 모두 지워진다.","쿠키는 광고 회사의 컴퓨터에서만 만들어진다.","온라인에서 검색할 때는 쿠키가 만들어지지 않는다.","온라인에서 검색할 때마다 쿠키가 만들어져 내 기기에 저장된다."],"r":{"a":"4) 온라인에서 검색할 때마다 쿠키가 만들어져 내 기기에 저장된다.","ev":"10번 문장","s":[[10,"Every time you search something online, Internet cookies are created and stored on your device.","당신이 온라인상에서 무언가를 검색할 때마다, 인터넷 쿠키가 만들어지고 당신의 기기에 저장된다."]],"w":"Every time은 '~할 때마다'예요. 검색할 때마다 쿠키가 만들어지고(created) 내 기기에 저장돼요(stored on your device).","c":4},"h":"5a5ccb0bcf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["프로그래매틱 광고는 직원이 광고를 직접 골라서 보낸다.","프로그래매틱 광고는 한 웹사이트에서만 광고를 보여준다.","프로그래매틱 광고는 자동 프로그램으로 광고를 소비자와 연결한다.","프로그래매틱 광고는 쿠키를 전혀 이용하지 않는다."],"opts":["Programmatic advertising uses staff to choose advertisements by hand.","Programmatic advertising shows advertisements on only one website.","Programmatic advertising uses an automatic program to match advertisements to customers.","Programmatic advertising never uses cookies."],"r":{"a":"3) Programmatic advertising uses an automatic program to match advertisements to customers.","ev":"9~11번 문장","s":[[9,"It uses an automatic program to match advertisements to customers.","그것은 광고를 소비자들과 연결시키는 자동 프로그램을 사용한다."],[10,"Every time you search something online, Internet cookies are created and stored on your device.","당신이 온라인상에서 무언가를 검색할 때마다, 인터넷 쿠키가 만들어지고 당신의 기기에 저장된다."],[11,"By using these cookies, the program analyzes your interests and preferences.","이 쿠키를 사용하여, 프로그램은 당신의 관심사와 선호도를 분석한다."]],"w":"9번에서 자동 프로그램으로 광고를 소비자들과 연결한다고 해요. 10~11번에서 쿠키를 이용하므로 '쿠키를 전혀 이용하지 않는다'는 틀리고, 3~4번에서 여러 웹사이트에 광고가 보이므로 '한 웹사이트에서만'도 틀려요.","c":3},"h":"8bb104a64c"},{"n":9,"t":"sum","q":"John kept seeing the same (A) on several websites, and eventually he (B) the shoes.","ko":"John은 몇몇 웹사이트에서 같은 (A)를 계속 보았고, 마침내 그 신발을 (B).","oko":["(A) 친구 / (B) 팔았다","(A) 가게 / (B) 반품했다","(A) 광고 / (B) 팔았다","(A) 친구 / (B) 샀다","(A) 광고 / (B) 샀다"],"opts":["(A) friend / (B) sold","(A) store / (B) returned","(A) advertisement / (B) sold","(A) friend / (B) bought","(A) advertisement / (B) bought"],"r":{"a":"5) (A) advertisement / (B) bought","ev":"4~5번 문장","s":[[4,"He visits several others and notices the same advertisement again and again.","그는 몇몇 다른 웹사이트를 방문하고 같은 광고를 몇 번이고 본다."],[5,"Eventually, John clicks the advertisement and buys the shoes.","마침내, John은 그 광고를 클릭해서 그 신발을 산다."]],"w":"4번에서 John은 같은 광고를 몇 번이고 보고, 5번에서 마침내 광고를 클릭해서 신발을 사요. sold(팔았다), returned(반품했다)는 맞지 않아요.","c":5},"h":"1e1b407355"},{"n":10,"t":"fill","q":"The program uses stored Internet [A] to analyze your interests and shows the best [B] for you.","ko":"프로그램은 저장된 인터넷 [A]를 이용해 당신의 관심사를 분석하고 당신을 위한 최고의 [B]를 보여준다.","bank":["cookies","advertisements","customers","analysis","experience","device"],"bko":{"cookies":"쿠키","advertisements":"광고","customers":"소비자","analysis":"분석","experience":"경험","device":"기기"},"r":{"a":"[A] cookies, [B] advertisements","ev":"11~12번 문장","s":[[11,"By using these cookies, the program analyzes your interests and preferences.","이 쿠키를 사용하여, 프로그램은 당신의 관심사와 선호도를 분석한다."],[12,"Then it shows the best advertisements for you.","그 다음 그것은 당신을 위한 최고의 광고를 보여준다."]],"w":"11번에서 these cookies를 사용해 관심사를 분석하고, 12번에서 the best advertisements(최고의 광고)를 보여줘요. customers, analysis, experience, device는 이 흐름의 빈칸에 알맞지 않아요.","c":null},"h":"9b2b95f071"}]},{"u":8,"id":"hk4-08-2","no":2,"ko":"여기에 벌레가 들어 있다고?\b","items":[{"n":1,"t":"tf","q":"The cochineal is a tiny insect that lives on cactus.","ko":"코치닐은 선인장을 먹고 사는 작은 곤충이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It is a tiny insect called the cochineal, which lives on cactus in Central and South America.","그것은 코치닐이라고 불리는 작은 곤충인데, 이것은 중남미에 있는 선인장을 먹고 산다."]],"w":"2번 문장에서 코치닐은 중남미의 선인장을 먹고 사는 작은 곤충(a tiny insect)이라고 해요.","c":"T"},"h":"cca6e9a9d8"},{"n":2,"t":"tf","q":"Ancient Mayans and Aztecs used cochineals only for food.","ko":"고대 마야인들과 아즈텍인들은 코치닐을 음식에만 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Ancient Mayans and Aztecs used them to color cloth and pottery.","고대 마야인들과 아즈텍인들은 그것들을 옷감과 도자기를 염색하기 위해 사용했다."]],"w":"5번 문장에서 고대 마야인과 아즈텍인은 코치닐을 옷감과 도자기를 염색하는 데 사용했다고 해요. 음식에만 썼다는 말은 틀려요.","c":"F"},"h":"283dc5f767"},{"n":3,"t":"tf","q":"The protein in cochineal dye can cause an allergic reaction in some people.","ko":"코치닐 염료에 있는 단백질은 몇몇 사람들에게 알레르기 반응을 일으킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"The protein in cochineal dye can cause an allergic reaction in some people.","코치닐 염료에 있는 단백질은 몇몇 사람들에게 알레르기 반응을 일으킬 수 있다."]],"w":"9번 문장과 같은 내용이에요. 단백질이 알레르기 반응을 일으킬 수 있다는 것이 우려 중 하나예요.","c":"T"},"h":"94cfb31695"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…and crushed into a powder…)","ko":"이 곤충은 채집되고, 말려지고, 그리고 그 후 선명한 빨간색 염료로 사용되는 가루로 ( ).","opts":["팔린다","으깨진다","그려진다","키워진다"],"word":"crushed","r":{"a":"2) 으깨진다","ev":"3번 문장","s":[[3,"These insects are collected, dried, and crushed into a powder that is then used as a bright red dye.","이 곤충은 채집되고, 말려지고, 그리고 그 후 선명한 빨간색 염료로 사용되는 가루로 으깨진다."]],"w":"곤충을 채집해서 말린 다음 가루(powder)로 만드는 과정이에요. 가루가 되려면 부수어야 하니 crush는 '으깨다'예요.","c":2},"h":"4cab3cc731"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…too many cochineals are being sacrificed…)","ko":"…너무 많은 코치닐이 ( ) 있는데, 1킬로그램의 염료를 얻는 데 10만 마리 이상의 코치닐이 든다!","opts":["보호받고","수입되고","희생되고","사랑받고"],"word":"sacrificed","r":{"a":"3) 희생되고","ev":"10번 문장","s":[[10,"Furthermore, too many cochineals are being sacrificed—it takes more than 100,000 cochineals to get a single kilogram of dye!","게다가, 너무 많은 코치닐이 희생되고 있는데, 1킬로그램의 염료를 얻는 데 10만 마리 이상의 코치닐이 든다!"]],"w":"염료 1킬로그램에 코치닐이 10만 마리 이상 든다는 것은 그만큼 많은 코치닐이 목숨을 잃는다는 뜻이에요. sacrifice = 희생하다.","c":3},"h":"f20bfdc77f"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAncient Mayans and Aztecs used them to color cloth and pottery.","ko":"밑줄 친 them이 가리키는 것은?","sko":"고대 마야인들과 아즈텍인들은 그것들을 옷감과 도자기를 염색하기 위해 사용했다.","opts":["선인장","옷감과 도자기","아즈텍 여성들","코치닐"],"r":{"a":"4) 코치닐","ev":"4~5번 문장","s":[[4,"Cochineals have been used as a natural dye for a long time.","코치닐은 오랜 시간 동안 천연염료로 사용되어 왔다."],[5,"Ancient Mayans and Aztecs used them to color cloth and pottery.","고대 마야인들과 아즈텍인들은 그것들을 옷감과 도자기를 염색하기 위해 사용했다."]],"w":"4번에서 Cochineals가 오랫동안 천연염료로 사용되어 왔다고 하고, 5번의 them은 그 Cochineals예요. 옷감과 도자기는 염색하는 대상이에요.","c":4},"h":"2492029fea"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Furthermore, too many cochineals are being sacrificed—it takes more than 100,000 cochineals to get a single kilogram of dye!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"게다가, 너무 많은 코치닐이 희생되고 있는데, 1킬로그램의 염료를 얻는 데 10만 마리 이상의 코치닐이 든다!","opts":["염료 1킬로그램을 얻으려면 코치닐이 10만 마리 넘게 필요해서 너무 많이 희생된다.","염료 10만 킬로그램을 얻는 데 코치닐 한 마리면 충분하다.","코치닐은 10만 마리가 있어도 염료를 만들 수 없다.","염료 1킬로그램을 만들 때 코치닐은 거의 희생되지 않는다."],"r":{"a":"1) 염료 1킬로그램을 얻으려면 코치닐이 10만 마리 넘게 필요해서 너무 많이 희생된다.","ev":"10번 문장","s":[[10,"Furthermore, too many cochineals are being sacrificed—it takes more than 100,000 cochineals to get a single kilogram of dye!","게다가, 너무 많은 코치닐이 희생되고 있는데, 1킬로그램의 염료를 얻는 데 10만 마리 이상의 코치닐이 든다!"]],"w":"it takes A to-v는 'v하는 데 A가 들다'예요. 염료 1킬로그램에 코치닐이 10만 마리 이상 든다는 말이라서, 그만큼 많은 코치닐이 희생된다는 뜻이에요.","c":1},"h":"74b940a2be"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["오늘날 코치닐 염료는 더 이상 사용되지 않는다.","오늘날 코치닐 염료는 옷감에만 사용된다.","오늘날 코치닐 염료는 음식과 음료부터 화장품까지 널리 사용된다.","오늘날 코치닐 염료는 립스틱에만 사용된다."],"opts":["Cochineal dye is no longer used today.","Cochineal dye is used only for clothes today.","Cochineal dye is widely used from food and drinks to cosmetics today.","Cochineal dye is used only in lipsticks today."],"r":{"a":"3) Cochineal dye is widely used from food and drinks to cosmetics today.","ev":"7번 문장","s":[[7,"Today, cochineal dye is widely used in products from food and drinks to cosmetics, including lipsticks.","오늘날, 코치닐 염료는 음식과 음료부터 립스틱을 포함한 화장품까지 상품에 널리 사용된다."]],"w":"7번에서 코치닐 염료가 음식과 음료부터 립스틱을 포함한 화장품까지 널리 사용된다고 해요. 한 가지에만 쓰이거나 더 이상 쓰이지 않는다는 말은 틀려요.","c":3},"h":"959cd462c9"},{"n":9,"t":"sum","q":"Ancient people used cochineals to color (A), and Aztec women colored their (B) red with crushed cochineals.","ko":"고대 사람들은 코치닐로 (A)을 염색했고, 아즈텍 여성들은 으깬 코치닐로 (B)를 빨갛게 염색했다.","oko":["(A) 음식 / (B) 머리카락","(A) 종이 / (B) 손톱","(A) 음식 / (B) 치아","(A) 옷감 / (B) 머리카락","(A) 옷감 / (B) 치아"],"opts":["(A) food / (B) hair","(A) paper / (B) nails","(A) food / (B) teeth","(A) cloth / (B) hair","(A) cloth / (B) teeth"],"r":{"a":"5) (A) cloth / (B) teeth","ev":"5~6번 문장","s":[[5,"Ancient Mayans and Aztecs used them to color cloth and pottery.","고대 마야인들과 아즈텍인들은 그것들을 옷감과 도자기를 염색하기 위해 사용했다."],[6,"Aztec women also colored their teeth red with crushed cochineals to make themselves look more attractive.","아즈텍 여성들은 자신들을 더 매력적으로 보이도록 만들기 위해 으깬 코치닐로 치아를 빨간색으로 염색하기도 했다."]],"w":"5번에서 옷감(cloth)과 도자기를 염색했고, 6번에서 아즈텍 여성들은 으깬 코치닐로 치아(teeth)를 빨갛게 염색했어요.","c":5},"h":"edd810625e"},{"n":10,"t":"fill","q":"A cochineal is a tiny [A] that lives on cactus, and it is crushed into a powder used as a red [B].","ko":"코치닐은 선인장을 먹고 사는 작은 [A]이고, 으깨져서 빨간색 [B]로 사용되는 가루가 된다.","bank":["insect","dye","cactus","protein","cosmetics","pottery"],"bko":{"insect":"곤충","dye":"염료","cactus":"선인장","protein":"단백질","cosmetics":"화장품","pottery":"도자기"},"r":{"a":"[A] insect, [B] dye","ev":"2~3번 문장","s":[[2,"It is a tiny insect called the cochineal, which lives on cactus in Central and South America.","그것은 코치닐이라고 불리는 작은 곤충인데, 이것은 중남미에 있는 선인장을 먹고 산다."],[3,"These insects are collected, dried, and crushed into a powder that is then used as a bright red dye.","이 곤충은 채집되고, 말려지고, 그리고 그 후 선명한 빨간색 염료로 사용되는 가루로 으깨진다."]],"w":"2번에서 코치닐은 a tiny insect(작은 곤충)이고, 3번에서 가루로 으깨져 bright red dye(선명한 빨간색 염료)로 사용돼요. cactus는 먹고 사는 곳이고 protein, cosmetics, pottery는 이 문장의 빈칸에 맞지 않아요.","c":null},"h":"e314d0638e"}]},{"u":8,"id":"hk4-08-3","no":3,"ko":"내 머리가 어때서~\b","items":[{"n":1,"t":"tf","q":"Until recently, natural hairstyles were rejected in some workplaces and schools.","ko":"최근까지, 타고난 헤어스타일은 일부 직장과 학교에서 거부되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"But until recently, these styles were rejected in some workplaces and schools.","하지만 최근까지, 이러한 스타일은 일부 직장과 학교에서 거부되었다."]],"w":"3번 문장에서 최근까지 이런 스타일이 일부 직장과 학교에서 거부되었다(were rejected)고 해요.","c":"T"},"h":"a67f20283c"},{"n":2,"t":"tf","q":"Some African Americans wore wigs to show their natural curls.","ko":"일부 아프리카계 미국인들은 타고난 곱슬머리를 보여주기 위해 가발을 썼다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Others wore wigs to hide their natural curls.","다른 사람들은 타고난 곱슬머리를 숨기기 위해 가발을 썼다."]],"w":"6번 문장은 타고난 곱슬머리를 숨기기 위해(to hide) 가발을 썼다고 해요. 보여주려고 썼다는 말은 반대예요.","c":"F"},"h":"9cc1bbbff4"},{"n":3,"t":"tf","q":"Ayanna Pressley gave important speeches with her curly hair braided.","ko":"아이아나 프레슬리는 곱슬머리를 땋은 채로 중요한 연설을 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"That same year, congresswoman Ayanna Pressley gave important speeches with her curly hair braided.","같은 해, 국회의원 아이아나 프레슬리는 곱슬머리를 땋은 채로 중요한 연설을 했다."]],"w":"8번 문장 congresswoman Ayanna Pressley gave important speeches with her curly hair braided와 같은 내용이에요.","c":"T"},"h":"fe49f1a8a2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…these styles were rejected in some workplaces and schools.)","ko":"하지만 최근까지, 이러한 스타일은 일부 직장과 학교에서 ( ).","opts":["인정받았다","유행했다","거부되었다","허락되었다"],"word":"rejected","r":{"a":"3) 거부되었다","ev":"3~4번 문장","s":[[3,"But until recently, these styles were rejected in some workplaces and schools.","하지만 최근까지, 이러한 스타일은 일부 직장과 학교에서 거부되었다."],[4,"That’s because they were considered messy and unprofessional.","그것은 그것들이 지저분하고 전문가답지 못하다고 여겨졌기 때문이다."]],"w":"4번에서 그 스타일이 지저분하고 전문가답지 못하다고 여겨졌다고 해요. 그런 이유라면 받아들여지지 않고 거부되었겠지요. reject = 거부하다.","c":3},"h":"a12738e450"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…straightened their hair with harsh chemicals…)","ko":"…머리를 ( ) 화학 물질로 곧게 폈거나 짧게 잘랐다.","opts":["독한","향기로운","값싼","천연의"],"word":"harsh","r":{"a":"1) 독한","ev":"5번 문장","s":[[5,"So, many African Americans, especially women, straightened their hair with harsh chemicals or cut their hair short.","그래서, 많은 아프리카계 미국인들, 특히 여성들은, 머리를 독한 화학 물질로 곧게 폈거나 짧게 잘랐다."]],"w":"곱슬머리를 곧게 펴려고 쓰는 화학 물질이라 머리에 센 성분이에요. harsh = 독한, 혹독한.","c":1},"h":"7af1c5196a"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nNow, their actions have encouraged many African Americans to show their natural hair.","ko":"밑줄 친 their(첫 번째)가 가리키는 것은?","sko":"이제, 그들의 행동은 많은 아프리카계 미국인들에게 타고난 머리를 보여주도록 용기를 주고 있다.","opts":["아프리카계 미국인들","미셸 오바마와 아이아나 프레슬리","잡지 기자들","직장 상사들"],"r":{"a":"2) 미셸 오바마와 아이아나 프레슬리","ev":"7~9번 문장","s":[[7,"However, Michelle Obama, the former First Lady, proudly revealed her naturally curly hair on the cover of a magazine in 2018.","하지만, 전 영부인인 미셸 오바마가, 2018년에 한 잡지의 표지에서 당당하게 그녀의 타고나기를 곱슬인 머리를 드러냈다."],[8,"That same year, congresswoman Ayanna Pressley gave important speeches with her curly hair braided.","같은 해, 국회의원 아이아나 프레슬리는 곱슬머리를 땋은 채로 중요한 연설을 했다."],[9,"Now, their actions have encouraged many African Americans to show their natural hair.","이제, 그들의 행동은 많은 아프리카계 미국인들에게 타고난 머리를 보여주도록 용기를 주고 있다."]],"w":"7번에서 미셸 오바마가, 8번에서 아이아나 프레슬리가 곱슬머리를 드러냈어요. 9번의 their actions는 그 두 사람의 행동이에요.","c":2},"h":"3774787529"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is a sign of overcoming prejudice and building confidence.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 편견을 극복하고 자신감을 쌓는다는 상징이다.","opts":["그것은 편견을 키우고 자신감을 잃는 일이다.","그것은 유행이 지나가고 있다는 신호이다.","그것은 직장에서 쫓겨났다는 증거이다.","그것은 편견을 극복하고 자신감을 쌓고 있다는 표시이다."],"r":{"a":"4) 그것은 편견을 극복하고 자신감을 쌓고 있다는 표시이다.","ev":"10~11번 문장","s":[[10,"It is not just a matter of style and appearance.","그것은 단지 스타일과 외모의 문제가 아니다."],[11,"It is a sign of overcoming prejudice and building confidence.","그것은 편견을 극복하고 자신감을 쌓는다는 상징이다."]],"w":"a sign of ~는 '~의 표시, 상징'이에요. overcoming prejudice(편견을 극복하는 것)와 building confidence(자신감을 쌓는 것)가 그 내용이에요.","c":4},"h":"ce5e184f98"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아프리카계 미국인들은 직장에 맞추려고 머리를 바꾼 적이 없다.","많은 아프리카계 미국인들이 독한 화학 물질로 머리를 펴거나 짧게 잘랐다.","남성들만 화학 물질로 머리를 폈다.","아프리카계 미국인들은 머리를 곧게 펴야 한다고 법으로 정해져 있었다."],"opts":["African Americans never changed their hair to fit workplaces.","Many African Americans straightened their hair with harsh chemicals or cut it short.","Only men straightened their hair with chemicals.","African Americans had to straighten their hair by law."],"r":{"a":"2) Many African Americans straightened their hair with harsh chemicals or cut it short.","ev":"5~6번 문장","s":[[5,"So, many African Americans, especially women, straightened their hair with harsh chemicals or cut their hair short.","그래서, 많은 아프리카계 미국인들, 특히 여성들은, 머리를 독한 화학 물질로 곧게 폈거나 짧게 잘랐다."],[6,"Others wore wigs to hide their natural curls.","다른 사람들은 타고난 곱슬머리를 숨기기 위해 가발을 썼다."]],"w":"5번에서 많은 아프리카계 미국인들, 특히 여성들이 독한 화학 물질로 머리를 펴거나 짧게 잘랐다고 해요. 6번에서는 가발도 썼다고 해요.","c":2},"h":"bea72942a6"},{"n":9,"t":"sum","q":"The actions of Michelle Obama and Ayanna Pressley (A) many African Americans to show their natural hair, which is a sign of overcoming (B).","ko":"미셸 오바마와 아이아나 프레슬리의 행동은 많은 아프리카계 미국인들에게 타고난 머리를 보여주도록 (A), 그것은 (B)를 극복한다는 상징이다.","oko":["(A) 낙담시켰고 / (B) 편견","(A) 용기를 주었고 / (B) 유행","(A) 강요했고 / (B) 유행","(A) 낙담시켰고 / (B) 유행","(A) 용기를 주었고 / (B) 편견"],"opts":["(A) discouraged / (B) prejudice","(A) encouraged / (B) fashion","(A) forced / (B) fashion","(A) discouraged / (B) fashion","(A) encouraged / (B) prejudice"],"r":{"a":"5) (A) encouraged / (B) prejudice","ev":"9, 11번 문장","s":[[9,"Now, their actions have encouraged many African Americans to show their natural hair.","이제, 그들의 행동은 많은 아프리카계 미국인들에게 타고난 머리를 보여주도록 용기를 주고 있다."],[11,"It is a sign of overcoming prejudice and building confidence.","그것은 편견을 극복하고 자신감을 쌓는다는 상징이다."]],"w":"9번에서 두 사람의 행동이 많은 사람들에게 타고난 머리를 보여주도록 용기를 주었고(encouraged), 11번에서 그것은 편견(prejudice)을 극복하고 자신감을 쌓는 상징이라고 해요.","c":5},"h":"7879afb0cd"},{"n":10,"t":"fill","q":"Some African Americans straightened their hair with harsh [A], and others wore [B] to hide their natural curls.","ko":"일부 아프리카계 미국인들은 독한 [A]로 머리를 폈고, 다른 사람들은 타고난 곱슬머리를 숨기기 위해 [B]를 썼다.","bank":["chemicals","wigs","cover","confidence","schools","magazine"],"bko":{"chemicals":"화학 물질","wigs":"가발","cover":"표지","confidence":"자신감","schools":"학교","magazine":"잡지"},"r":{"a":"[A] chemicals, [B] wigs","ev":"5~6번 문장","s":[[5,"So, many African Americans, especially women, straightened their hair with harsh chemicals or cut their hair short.","그래서, 많은 아프리카계 미국인들, 특히 여성들은, 머리를 독한 화학 물질로 곧게 폈거나 짧게 잘랐다."],[6,"Others wore wigs to hide their natural curls.","다른 사람들은 타고난 곱슬머리를 숨기기 위해 가발을 썼다."]],"w":"5번에서 harsh chemicals(독한 화학 물질)로 머리를 폈고, 6번에서 Others wore wigs(다른 사람들은 가발을 썼다)라고 해요. cover, magazine은 7번의 오바마 이야기이고 confidence, schools는 이 방법과 관련이 없어요.","c":null},"h":"5557767bd4"}]},{"u":8,"id":"hk4-08-4","no":4,"ko":"80:20의 법칙\b","items":[{"n":1,"t":"tf","q":"Vilfredo Pareto was an Italian economist in the early 1900s.","ko":"빌프레도 파레토는 1900년대 초 이탈리아의 경제학자였다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Vilfredo Pareto was an Italian economist in the early 1900s.","빌프레도 파레토는 1900년대 초 이탈리아의 경제학자였다."]],"w":"1번 문장에 그대로 나와요.","c":"T"},"h":"7347a9cb0f"},{"n":2,"t":"tf","q":"Pareto found that 20% of the peas came from 80% of his pea plants.","ko":"파레토는 완두콩의 20퍼센트가 완두콩 식물의 80퍼센트에서 나온다는 것을 발견했다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It turned out that 80% of the peas came from 20% of his pea plants.","완두콩의 80퍼센트가 그의 완두콩 식물의 20퍼센트에서 나오는 것으로 드러났다."]],"w":"3번 문장은 80%의 완두콩이 20%의 식물에서 나왔다고 해요. 숫자가 서로 뒤바뀐 선지예요.","c":"F"},"h":"69c3bca548"},{"n":3,"t":"tf","q":"80% of Italy’s land was owned by 20% of its population.","ko":"이탈리아 땅의 80퍼센트는 이탈리아 인구의 20퍼센트에 의해 소유되어 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"For example, 80% of Italy’s land was owned by 20% of its population.","예를 들어, 이탈리아 땅의 80퍼센트가 이탈리아 인구의 20퍼센트에 의해 소유되어 있었다."]],"w":"5번 문장에 그대로 나와요. 경제에도 80/20 패턴이 있다는 예시예요.","c":"T"},"h":"d6413d0190"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…he made an interesting observation while harvesting peas…)","ko":"어느 날, 그는 정원에서 완두콩을 수확하면서 흥미로운 ( )을 했다.","opts":["요리","관찰","여행","발표"],"word":"observation","r":{"a":"2) 관찰","ev":"2~3번 문장","s":[[2,"One day, he made an interesting observation while harvesting peas in his garden.","어느 날, 그는 정원에서 완두콩을 수확하면서 흥미로운 관찰을 했다."],[3,"It turned out that 80% of the peas came from 20% of his pea plants.","완두콩의 80퍼센트가 그의 완두콩 식물의 20퍼센트에서 나오는 것으로 드러났다."]],"w":"정원에서 완두콩을 수확하다가 80%의 완두콩이 20%의 식물에서 나온다는 것을 알아차렸어요(3번). 그러니 observation은 '관찰'이에요.","c":2},"h":"d8299e9e26"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the new group would be composed of only hard-working ants.)","ko":"…그 새로운 집단이 열심히 일하는 개미로만 ( ) 것이라고 생각할지도 모른다.","opts":["구성될","쫓겨날","굶주릴","사라질"],"word":"composed","r":{"a":"1) 구성될","ev":"11번 문장","s":[[11,"You might think that if you separated these active ants from the others, the new group would be composed of only hard-working ants.","당신은 만약 이 활동적인 개미를 나머지 개미로부터 분리한다면, 그 새로운 집단이 열심히 일하는 개미로만 구성될 것이라고 생각할지도 모른다."]],"w":"be composed of ~는 '~으로 이루어지다'예요. 활동적인 개미만 분리해서 새 집단을 만들면 열심히 일하는 개미로만 이루어질 것이라는 예상이에요.","c":1},"h":"09262654ff"},{"n":6,"t":"ref","q":"What does the underlined \"this group\" refer to?\nBut interestingly, the rule would apply to this group as well.","ko":"밑줄 친 this group이 가리키는 것은?","sko":"하지만 흥미롭게도, 그 법칙은 이 집단에도 적용될 것이다.","opts":["남아 있는 80퍼센트의 개미들","파레토의 완두콩 식물","활동적인 개미만 분리해서 만든 새로운 집단","이탈리아의 인구"],"r":{"a":"3) 활동적인 개미만 분리해서 만든 새로운 집단","ev":"11~12번 문장","s":[[11,"You might think that if you separated these active ants from the others, the new group would be composed of only hard-working ants.","당신은 만약 이 활동적인 개미를 나머지 개미로부터 분리한다면, 그 새로운 집단이 열심히 일하는 개미로만 구성될 것이라고 생각할지도 모른다."],[12,"But interestingly, the rule would apply to this group as well.","하지만 흥미롭게도, 그 법칙은 이 집단에도 적용될 것이다."]],"w":"11번에서 활동적인 개미를 나머지에서 분리해 만든 the new group을 말했고, 12번의 this group은 그 새로운 집단이에요.","c":3},"h":"e44495b514"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He concluded that 80% of effects come from 20% of causes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 결과의 80퍼센트가 원인의 20퍼센트에서 나온다고 결론을 내렸다.","opts":["그는 결과의 20퍼센트가 원인의 80퍼센트에서 나온다고 결론을 내렸다.","그는 원인과 결과가 아무 상관이 없다고 결론을 내렸다.","그는 원인의 80퍼센트가 결과를 없앤다고 결론을 내렸다.","그는 결과의 80퍼센트가 원인의 20퍼센트에서 나온다고 결론을 내렸다."],"r":{"a":"4) 그는 결과의 80퍼센트가 원인의 20퍼센트에서 나온다고 결론을 내렸다.","ev":"6번 문장","s":[[6,"He concluded that 80% of effects come from 20% of causes.","그는 결과의 80퍼센트가 원인의 20퍼센트에서 나온다고 결론을 내렸다."]],"w":"effects는 결과, causes는 원인이에요. 80%의 결과가 20%의 원인에서 나온다는 뜻이고, 숫자가 바뀐 선지는 틀려요.","c":4},"h":"dd67701fd7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["개미의 20퍼센트만이 나머지 개미들을 위해 먹이를 구하려고 열심히 일한다.","모든 개미가 똑같이 열심히 일해서 먹이를 구한다.","개미의 80퍼센트가 나머지 20퍼센트를 위해 먹이를 구한다.","개미는 먹이를 서로 나누지 않는다."],"opts":["Only 20% of the ants work hard to get food for the other ants.","All ants work equally hard to get food.","80% of the ants work hard to get food for the other 20%.","Ants never share food."],"r":{"a":"1) Only 20% of the ants work hard to get food for the other ants.","ev":"10번 문장","s":[[10,"If you observe a group of ants, you will see that just 20% of the ants work hard to get food for the remaining 80% of the ants.","만약 당신이 한 무리의 개미를 관찰한다면, 당신은 개미의 20퍼센트만이 남아 있는 80퍼센트의 개미를 위한 먹이를 구하기 위해 열심히 일하는 것을 볼 것이다."]],"w":"10번에서 개미의 20%만이 남아 있는 80%의 개미를 위한 먹이를 구하려고 열심히 일한다고 해요.","c":1},"h":"c4b1c4435e"},{"n":9,"t":"sum","q":"Even in a new group of only active ants, the rule would apply, so only (A)% of the members would be (B).","ko":"활동적인 개미만으로 이루어진 새 집단에서도 법칙이 적용되어, 구성원의 (A)퍼센트만이 (B) 것이다.","oko":["(A) 80 / (B) 게으를","(A) 20 / (B) 게으를","(A) 80 / (B) 생산적일","(A) 50 / (B) 생산적일","(A) 20 / (B) 생산적일"],"opts":["(A) 80 / (B) lazy","(A) 20 / (B) lazy","(A) 80 / (B) productive","(A) 50 / (B) productive","(A) 20 / (B) productive"],"r":{"a":"5) (A) 20 / (B) productive","ev":"12~13번 문장","s":[[12,"But interestingly, the rule would apply to this group as well.","하지만 흥미롭게도, 그 법칙은 이 집단에도 적용될 것이다."],[13,"In other words, only 20% of the members would be productive!","다시 말해서, 구성원들의 20퍼센트만이 생산적일 것이다!"]],"w":"12번에서 새 집단에도 법칙이 적용되고, 13번에서 구성원의 20%만 productive(생산적인)일 것이라고 해요.","c":5},"h":"030e7daf0d"},{"n":10,"t":"fill","q":"Pareto saw that 80% of the [A] came from 20% of his pea plants, and 80% of Italy’s [B] was owned by 20% of its population.","ko":"파레토는 [A]의 80퍼센트가 완두콩 식물의 20퍼센트에서 나오고, 이탈리아 [B]의 80퍼센트가 인구의 20퍼센트에게 소유되어 있다는 것을 알았다.","bank":["peas","land","ants","economist","observation","principle"],"bko":{"peas":"완두콩","land":"땅","ants":"개미","economist":"경제학자","observation":"관찰","principle":"법칙"},"r":{"a":"[A] peas, [B] land","ev":"3, 5번 문장","s":[[3,"It turned out that 80% of the peas came from 20% of his pea plants.","완두콩의 80퍼센트가 그의 완두콩 식물의 20퍼센트에서 나오는 것으로 드러났다."],[5,"For example, 80% of Italy’s land was owned by 20% of its population.","예를 들어, 이탈리아 땅의 80퍼센트가 이탈리아 인구의 20퍼센트에 의해 소유되어 있었다."]],"w":"3번에서 80%의 peas(완두콩)가 20%의 식물에서 나오고, 5번에서 이탈리아 land(땅)의 80%를 인구의 20%가 소유했다고 해요. ants는 10번의 예이고 economist, observation, principle은 이 빈칸에 맞지 않아요.","c":null},"h":"22e83050ed"}]},{"u":9,"id":"hk4-09-1","no":1,"ko":"‘혼’쭐내거나, ‘돈’쭐내거나\b","items":[{"n":1,"t":"tf","q":"Company B donates regularly to animal shelters.","ko":"B사는 정기적으로 동물 보호소에 기부한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Company B, on the other hand, doesn’t do animal testing, and it regularly donates to animal shelters.","반면에, B사는 동물 실험을 하지 않고, 정기적으로 동물 보호소에 기부를 한다."]],"w":"3번 문장에 it regularly donates to animal shelters가 있어요. B사가 정기적으로 동물 보호소에 기부한다는 내용과 같아요.","c":"T"},"h":"ec1b7721dc"},{"n":2,"t":"tf","q":"Company A’s product is not tested on animals.","ko":"A사의 상품은 동물에게 실험되지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Company A’s product is tested on animals.","A사의 상품은 동물에게 실험된다."]],"w":"2번 문장에서 A사의 상품은 동물에게 실험된다(is tested on animals)고 해요. 실험되지 않는다는 말은 반대예요.","c":"F"},"h":"b47d53a498"},{"n":3,"t":"tf","q":"A boycott and a buycott are both active behaviors of consumers.","ko":"보이콧과 바이콧은 둘 다 소비자의 적극적인 행동이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Both of them are active behaviors of consumers to express protest or support.","그것들 둘 다 항의 또는 지지를 표현하기 위한 소비자들의 적극적인 행동이다."]],"w":"6번 문장에서 Both of them are active behaviors of consumers라고 해요. 둘 다 소비자의 적극적인 행동이 맞아요.","c":"T"},"h":"3b54f1cc0f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (During boycott, people refuse to buy products from certain companies.)","ko":"보이콧 동안, 사람들은 특정 회사의 상품을 사는 것을 ( ).","opts":["허락한다","거부한다","기대한다","추천한다"],"word":"refuse","r":{"a":"2) 거부한다","ev":"7번 문장","s":[[7,"During boycott, people refuse to buy products from certain companies that have environmental, political, or moral issues.","보이콧 동안, 사람들은 환경적, 정치적, 또는 도덕적인 문제가 있는 특정 회사의 상품을 사는 것을 거부한다."]],"w":"보이콧은 항의하는 행동이라서 상품을 사지 않아요. refuse(거부하다)는 ‘사는 것을 거부한다’로 이어져요.","c":2},"h":"2ef62f6bf0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This usually occurs when people agree with a company’s policies.)","ko":"이것은 보통 사람들이 회사의 정책에 동의할 때 ( ).","opts":["사라진다","끝난다","멈춘다","일어난다"],"word":"occurs","r":{"a":"4) 일어난다","ev":"9번 문장","s":[[9,"This usually occurs when people agree with a company’s policies.","이것은 보통 사람들이 회사의 정책에 동의할 때 일어난다."]],"w":"바이콧이 보통 언제 생기는지를 말하는 문장이에요. occur(일어나다)는 ‘사람들이 정책에 동의할 때 일어난다’로 이어져요.","c":4},"h":"a15d6926ce"},{"n":6,"t":"ref","q":"What does the underlined \"the latter\" refer to?\nIn this case, the former is called a boycott and the latter is called a buycott.","ko":"밑줄 친 the latter가 가리키는 것은?","sko":"이 경우, 전자는 보이콧이라고 불리고 후자는 바이콧이라고 불린다.","opts":["B사의 로션을 사는 행동","A사의 로션을 피하는 행동","동물 실험을 하는 것","동물 보호소에 기부하는 것"],"r":{"a":"1) B사의 로션을 사는 행동","ev":"4~5번 문장","s":[[4,"If you love animals, you would avoid Company A’s lotion and buy B’s lotion instead.","만약 동물을 좋아한다면, 당신은 A사의 로션은 피하고 대신 B사의 로션을 살 것이다."],[5,"In this case, the former is called a boycott and the latter is called a buycott.","이 경우, 전자는 보이콧이라고 불리고 후자는 바이콧이라고 불린다."]],"w":"4번에서 먼저 나온 것은 A사 로션을 피하는 행동(전자), 나중에 나온 것은 B사 로션을 사는 행동(후자)이에요. the latter는 나중에 나온 B사 로션 사기예요.","c":1},"h":"8efca7d826"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Whether it’s a boycott or a buycott, it gives consumers the power to make a decision to create change.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"보이콧이든 바이콧이든, 그것은 소비자들에게 변화를 만드는 결정을 내릴 수 있는 힘을 준다.","opts":["바이콧만 소비자에게 변화를 만드는 힘을 준다.","보이콧을 하면 회사가 소비자에게 힘을 준다.","보이콧이든 바이콧이든 소비자가 변화를 만드는 결정을 할 힘을 얻는다.","보이콧과 바이콧 중 하나를 고르는 것은 힘과 상관없다."],"r":{"a":"3) 보이콧이든 바이콧이든 소비자가 변화를 만드는 결정을 할 힘을 얻는다.","ev":"11번 문장","s":[[11,"Whether it’s a boycott or a buycott, it gives consumers the power to make a decision to create change.","보이콧이든 바이콧이든, 그것은 소비자들에게 변화를 만드는 결정을 내릴 수 있는 힘을 준다."]],"w":"Whether A or B는 ‘A이든 B이든’이에요. 어느 쪽이든 소비자에게 변화를 만들 결정의 힘이 생긴다는 뜻이에요.","c":3},"h":"253a921e76"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["바이콧은 태풍으로 과일이 손상된 판매자들을 돕는 것이 될 수 있다.","A사는 정기적으로 동물 보호소에 기부한다.","바이콧에서 사람들은 한 회사의 상품 사기를 거부한다.","바이콧은 사람들이 회사의 정책에 동의하지 않을 때 일어난다."],"opts":["A buycott can mean helping sellers whose fruit was damaged by a typhoon.","Company A donates regularly to animal shelters.","In a buycott, people refuse to buy products from a company.","A buycott happens when people disagree with a company’s policies."],"r":{"a":"1) A buycott can mean helping sellers whose fruit was damaged by a typhoon.","ev":"10번 문장","s":[[10,"A buycott can also be the act of helping out sellers in need, such as those selling fruit damaged by a typhoon.","바이콧은 또한 태풍에 의해 손상된 과일을 파는 사람들과 같이 도움이 필요한 판매자들을 도와주는 행동이 될 수 있다."]],"w":"10번 문장에서 바이콧은 태풍으로 손상된 과일을 파는 판매자 같은, 도움이 필요한 판매자를 돕는 행동이 될 수 있다고 해요. A사가 아니라 B사가 기부하고(3번), 거부는 보이콧(7번)이며, 바이콧은 정책에 동의할 때예요(9번).","c":1},"h":"21b4989eb4"},{"n":9,"t":"sum","q":"In a boycott, people (A) to buy products from companies with issues. In a buycott, people (B) goods to support companies.","ko":"보이콧에서 사람들은 문제가 있는 회사의 상품을 사는 것을 (A)한다. 바이콧에서 사람들은 회사를 지지하려고 상품을 (B)한다.","oko":["(A) 거부 / (B) 판다","(A) 동의 / (B) 산다","(A) 아주 좋아함 / (B) 실험한다","(A) 피함 / (B) 손상시킨다","(A) 거부 / (B) 산다"],"opts":["(A) refuse / (B) sell","(A) agree / (B) buy","(A) love / (B) test","(A) avoid / (B) damage","(A) refuse / (B) buy"],"r":{"a":"5) (A) refuse / (B) buy","ev":"7~8번 문장","s":[[7,"During boycott, people refuse to buy products from certain companies that have environmental, political, or moral issues.","보이콧 동안, 사람들은 환경적, 정치적, 또는 도덕적인 문제가 있는 특정 회사의 상품을 사는 것을 거부한다."],[8,"Meanwhile, a buycott is the act of buying companies’ goods to support them.","한편, 바이콧은 회사를 지지하기 위해 그들의 상품을 사는 행동이다."]],"w":"7번에서 보이콧은 상품 사기를 거부하는(refuse) 것이고, 8번에서 바이콧은 회사를 지지하려고 상품을 사는(buy) 것이에요.","c":5},"h":"66b888b2cc"},{"n":10,"t":"fill","q":"Company A’s product is tested on animals, but Company B does not test on animals. If you love animals, you would [A] Company A’s lotion and [B] B’s lotion instead.","ko":"A사의 상품은 동물에게 실험되지만 B사는 동물 실험을 하지 않는다. 동물을 좋아한다면, A사의 로션은 [A]하고 대신 B사의 로션은 [B]할 것이다.","bank":["avoid","buy","tested","damaged","policies","shelters"],"bko":{"avoid":"피하다","buy":"사다","tested":"실험된","damaged":"손상된","policies":"정책들","shelters":"보호소들"},"r":{"a":"[A] avoid, [B] buy","ev":"2~4번 문장","s":[[2,"Company A’s product is tested on animals.","A사의 상품은 동물에게 실험된다."],[3,"Company B, on the other hand, doesn’t do animal testing, and it regularly donates to animal shelters.","반면에, B사는 동물 실험을 하지 않고, 정기적으로 동물 보호소에 기부를 한다."],[4,"If you love animals, you would avoid Company A’s lotion and buy B’s lotion instead.","만약 동물을 좋아한다면, 당신은 A사의 로션은 피하고 대신 B사의 로션을 살 것이다."]],"w":"4번 문장에서 가져왔어요. would 뒤에는 동사원형이 오므로 tested, damaged는 맞지 않고, policies와 shelters는 명사라 동사 자리에 들어갈 수 없어요.","c":null},"h":"1f11b94340"}]},{"u":9,"id":"hk4-09-2","no":2,"ko":"날개가 필요 없어요\b","items":[{"n":1,"t":"tf","q":"People can easily get hurt by the rotating blades of a bladeless fan.","ko":"사람들은 날개 없는 선풍기의 회전하는 날개에 쉽게 다칠 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"You don’t have to worry about getting hurt by the rotating blades.","당신은 회전하는 날개에 의해 다치는것에 대해 걱정하지 않아도 된다."]],"w":"5번 문장에서 회전하는 날개에 다치는 것을 걱정하지 않아도 된다고 해요. 쉽게 다칠 수 있다는 말은 반대예요.","c":"F"},"h":"0e35e2f58b"},{"n":2,"t":"tf","q":"A bladeless fan has two main parts: a base and an upper ring.","ko":"날개 없는 선풍기는 받침대와 위쪽의 고리라는 두 개의 주요 부품이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The fan consists of two main parts: a base and an upper ring.","그 선풍기는 받침대와 위쪽의 고리라는 두 개의 주요 부품으로 구성되어 있다."]],"w":"7번 문장에 two main parts: a base and an upper ring이 그대로 나와요.","c":"T"},"h":"64c6e17c06"},{"n":3,"t":"tf","q":"The volume of air that comes out is the same as the amount taken in at the base.","ko":"나오는 공기의 양은 받침대에 빨아들여진 양과 같다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"In fact, the volume of air that comes out is 15 times higher than the amount taken in at the base!","실제로, 밖으로 나오는 공기의 양은 받침대에 빨아들여진 양보다 15배 더 많다!"]],"w":"12번 문장에서 나오는 공기의 양은 빨아들여진 양보다 15배 더 많다고 해요. 같다는 말은 달라요.","c":"F"},"h":"5ed522a9a5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The fan consists of two main parts: a base and an upper ring.)","ko":"그 선풍기는 받침대와 위쪽의 고리라는 두 개의 주요 부품으로 ( ).","opts":["판매된다","설치된다","구성되어 있다","멈춘다"],"word":"consists","r":{"a":"3) 구성되어 있다","ev":"7번 문장","s":[[7,"The fan consists of two main parts: a base and an upper ring.","그 선풍기는 받침대와 위쪽의 고리라는 두 개의 주요 부품으로 구성되어 있다."]],"w":"consist of는 ‘~으로 구성되다’예요. 뒤에 두 개의 주요 부품(받침대와 고리)이 이어지므로 ‘구성되어 있다’가 알맞아요.","c":3},"h":"7230810aa2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, a bladeless fan can be a good alternative on a hot summer day.)","ko":"그래서, 날개 없는 선풍기는 더운 여름날에 좋은 ( )이 될 수 있다.","opts":["대안","광고","습관","위험"],"word":"alternative","r":{"a":"1) 대안","ev":"13번 문장","s":[[13,"So, a bladeless fan can be a good alternative on a hot summer day.","그래서, 날개 없는 선풍기는 더운 여름날에 좋은 대안이 될 수 있다."]],"w":"13번은 장점과 원리를 설명한 뒤의 결론이에요. 보통 선풍기 대신 쓸 수 있는 좋은 ‘대안’이라는 뜻이에요.","c":1},"h":"68e263c658"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis creates a very strong airflow.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 매우 강력한 기류를 만들어낸다.","opts":["회전하는 날개에 다치는 것","모터가 꺼지는 것","구멍이 막히는 것","받침대가 공기를 고리로 밀어내는 것"],"r":{"a":"4) 받침대가 공기를 고리로 밀어내는 것","ev":"10~11번 문장","s":[[10,"Then, the base pushes the air out through the ring.","그 다음, 받침대는 고리를 통해 공기를 밀어낸다."],[11,"This creates a very strong airflow.","이것은 매우 강력한 기류를 만들어낸다."]],"w":"10번에서 받침대가 공기를 고리를 통해 밀어내요. 11번의 This는 그 일을 가리키고, 그 결과로 강한 기류가 만들어져요.","c":4},"h":"f592ef87fd"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In fact, the volume of air that comes out is 15 times higher than the amount taken in at the base!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"실제로, 밖으로 나오는 공기의 양은 받침대에 빨아들여진 양보다 15배 더 많다!","opts":["빨아들인 공기의 양이 나오는 공기의 양보다 15배 많다.","나오는 공기의 양이 빨아들인 공기의 양보다 15배 많다.","나오는 공기의 양과 빨아들인 양이 같다.","나오는 공기의 양이 빨아들인 양의 15분의 1이다."],"r":{"a":"2) 나오는 공기의 양이 빨아들인 공기의 양보다 15배 많다.","ev":"12번 문장","s":[[12,"In fact, the volume of air that comes out is 15 times higher than the amount taken in at the base!","실제로, 밖으로 나오는 공기의 양은 받침대에 빨아들여진 양보다 15배 더 많다!"]],"w":"15 times higher than은 ‘~보다 15배 더 많은’이에요. 비교 대상(than 뒤)은 빨아들인 양이고, 15배 큰 쪽은 나오는 공기예요.","c":2},"h":"4cbd454914"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["위쪽의 고리에 전기 모터가 들어 있다.","날개 없는 선풍기는 보통 선풍기보다 전력을 더 많이 사용한다.","받침대에 숨겨진 날개가 돌면서 구멍으로 공기를 빨아들인다.","받침대는 고리를 통해 공기를 끌어들인다."],"opts":["The upper ring contains the electric motor.","A bladeless fan uses more electricity than a regular fan.","The blades hidden in the base spin and take in the air through holes.","The base pulls the air in through the ring."],"r":{"a":"3) The blades hidden in the base spin and take in the air through holes.","ev":"8~9번 문장","s":[[8,"The base contains an electric motor with hidden blades.","받침대에는 숨겨진 날개가 있는 전기 모터가 들어 있다."],[9,"When the motor is activated, the blades spin, and it sucks in the surrounding air through holes.","모터가 작동하면, 날개가 돌아가고, 모터는 구멍을 통해 주변의 공기를 빨아들인다."]],"w":"8번에서 받침대에 숨겨진 날개가 달린 모터가 있고, 9번에서 날개가 돌며 구멍으로 공기를 빨아들여요. 모터는 받침대에 있고(8번), 전력은 더 적게 쓰며(3번), 공기는 고리로 내보내요(10번).","c":3},"h":"444649c5bc"},{"n":9,"t":"sum","q":"A bladeless fan uses (A) electricity than a regular fan. Also, it is safer because you don’t have to worry about getting hurt by (B) blades.","ko":"날개 없는 선풍기는 보통 선풍기보다 (A) 전력을 사용한다. 또한 (B) 날개에 다치는 것을 걱정하지 않아도 되어 더 안전하다.","oko":["(A) 더 많은 / (B) 회전하는","(A) 더 적은 / (B) 부서진","(A) 더 많은 / (B) 부서진","(A) 더 적은 / (B) 회전하는","(A) 같은 / (B) 차가운"],"opts":["(A) more / (B) rotating","(A) less / (B) broken","(A) more / (B) broken","(A) less / (B) rotating","(A) same / (B) cold"],"r":{"a":"4) (A) less / (B) rotating","ev":"3, 5번 문장","s":[[3,"Not only does a bladeless fan cool you off better, but it also uses less electricity.","날개 없는 선풍기는 당신의 열기를 더 잘 식혀 줄 뿐만 아니라, 더 적은 전력을 사용하기도 한다."],[5,"You don’t have to worry about getting hurt by the rotating blades.","당신은 회전하는 날개에 의해 다치는것에 대해 걱정하지 않아도 된다."]],"w":"3번에서 날개 없는 선풍기는 전력을 더 적게(less) 쓰고, 5번에서 회전하는(rotating) 날개에 다칠 걱정이 없다고 해요.","c":4},"h":"6ba1de21c6"},{"n":10,"t":"fill","q":"The base [A] the air out through the ring, and this creates a very strong [B].","ko":"받침대는 공기를 고리를 통해 밖으로 [A]하고, 이것은 매우 강력한 [B]를 만들어낸다.","bank":["pushes","airflow","blades","ring","base","holes"],"bko":{"pushes":"밀어내다","airflow":"기류","blades":"날개들","ring":"고리","base":"받침대","holes":"구멍들"},"r":{"a":"[A] pushes, [B] airflow","ev":"10~11번 문장","s":[[10,"Then, the base pushes the air out through the ring.","그 다음, 받침대는 고리를 통해 공기를 밀어낸다."],[11,"This creates a very strong airflow.","이것은 매우 강력한 기류를 만들어낸다."]],"w":"10번 the base pushes the air out through the ring과 11번 This creates a very strong airflow에서 가져왔어요. 나머지는 부품 이름이라 동사 자리나 ‘강력한 ~’ 자리에 맞지 않아요.","c":null},"h":"1f81f8674f"}]},{"u":9,"id":"hk4-09-3","no":3,"ko":"공룡이 사라졌다, 왜?\b","items":[{"n":1,"t":"tf","q":"The rock samples from the crater had no sulfur in them.","ko":"분화구의 암석 표본에는 황이 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Then, they found out that there was no sulfur in them, while the area surrounding the crater was rich in sulfur.","그 후, 그들은 암석 표본에는 황이 없는데, 반면에 그 분화구를 둘러싼 지역에는 황이 많았다는 것을 발견했다."]],"w":"6번 문장에서 과학자들은 암석 표본에는 황이 없다는 것(there was no sulfur in them)을 발견했어요.","c":"T"},"h":"7a1fae4d2e"},{"n":2,"t":"tf","q":"The global winter would have lasted for only a few days.","ko":"지구의 겨울은 단 며칠만 지속되었을 것이다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"This global winter would have lasted for decades.","이러한 지구의 겨울은 수십 년 동안 지속되었을 것이다."]],"w":"9번 문장에서 지구의 겨울은 수십 년(decades) 동안 지속되었을 것이라고 해요. 며칠이 아니에요.","c":"F"},"h":"f2317c11a3"},{"n":3,"t":"tf","q":"Scientists assume that about 75% of all life on the planet was killed off.","ko":"과학자들은 지구상의 모든 생명체의 약 75퍼센트가 몰살되었다고 추정한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The scientists assume this event killed off not only the dinosaurs but also about 75% of all life on the planet!","과학자들은 이 사건이 공룡뿐만 아니라 지구상의 모든 생명체의 약 75퍼센트를 몰살시켰을 것이라고 추정한다!"]],"w":"11번 문장에서 이 사건이 공룡뿐만 아니라 모든 생명체의 약 75퍼센트를 몰살시켰다고 추정한다고 해요.","c":"T"},"h":"d4c1b0008b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists uncovered new information that might solve the mystery.)","ko":"과학자들은 그 수수께끼를 풀어 줄 수도 있는 새로운 정보를 ( ).","opts":["숨겼다","알아냈다","잃어버렸다","팔았다"],"word":"uncovered","r":{"a":"2) 알아냈다","ev":"4번 문장","s":[[4,"However, recently, scientists uncovered new information that might solve the mystery.","하지만, 최근에, 과학자들은 그 수수께끼를 풀어 줄 수도 있는 새로운 정보를 알아냈다."]],"w":"4번은 ‘수수께끼를 풀어 줄 새 정보’를 이야기해요. 정보를 ‘알아낸다(uncover)’는 흐름이에요.","c":2},"h":"9b3ebdd71b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The impact caused a huge amount of sulfur to evaporate into the atmosphere.)","ko":"그 충돌이 막대한 양의 황이 대기로 ( ) 만들었다.","opts":["가라앉도록","얼도록","쌓이도록","증발하도록"],"word":"evaporate","r":{"a":"4) 증발하도록","ev":"7번 문장","s":[[7,"This led them to assume the impact caused a huge amount of sulfur from the crater to evaporate into the atmosphere.","이것은 그들로 하여금 그 충돌이 분화구로부터 막대한 양의 황이 대기로 증발하도록 만들었다고 추정하게 했다."]],"w":"황이 분화구에서 대기로 올라가 구름이 되었다는 흐름이에요(8번). evaporate는 ‘증발하다’예요.","c":4},"h":"e4fa30e595"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThen, they found out that there was no sulfur in them, while the area surrounding the crater was rich in sulfur.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그 후, 그들은 암석 표본에는 황이 없는데, 반면에 그 분화구를 둘러싼 지역에는 황이 많았다는 것을 발견했다.","opts":["과학자들","공룡들","분화구에서 가져온 암석 표본들","분화구를 둘러싼 지역들"],"r":{"a":"3) 분화구에서 가져온 암석 표본들","ev":"5~6번 문장","s":[[5,"They first collected and analyzed rock samples from the crater.","그들은 먼저 분화구에서 암석 표본을 수집하고 분석했다."],[6,"Then, they found out that there was no sulfur in them, while the area surrounding the crater was rich in sulfur.","그 후, 그들은 암석 표본에는 황이 없는데, 반면에 그 분화구를 둘러싼 지역에는 황이 많았다는 것을 발견했다."]],"w":"5번에서 과학자들이 분화구의 암석 표본을 수집하고 분석했어요. 6번의 them은 그 암석 표본들이고, 둘러싼 지역은 황이 많은 쪽이라 반대예요.","c":3},"h":"48b1a163b7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"A large cloud of sulfur would have blocked the sun, and the average temperature of the planet may have decreased by about 15°C.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"거대한 황 구름이 태양을 가렸을 것이고, 지구의 평균 기온이 약 15도 정도 떨어졌을 수도 있다.","opts":["황 구름이 태양을 가렸고 그 때문에 지구의 기온이 떨어졌을 것으로 추측된다.","황 구름이 태양을 가렸고 그 때문에 지구의 기온이 15도 올랐다.","황 구름이 태양을 가리지 못해서 기온이 변하지 않았을 것이다.","태양이 황 구름을 가려서 지구가 따뜻해졌을 것이다."],"r":{"a":"1) 황 구름이 태양을 가렸고 그 때문에 지구의 기온이 떨어졌을 것으로 추측된다.","ev":"8번 문장","s":[[8,"A large cloud of sulfur would have blocked the sun, and the average temperature of the planet may have decreased by about 15°C.","거대한 황 구름이 태양을 가렸을 것이고, 지구의 평균 기온이 약 15도 정도 떨어졌을 수도 있다."]],"w":"would have blocked는 ‘가렸을 것이다’, may have decreased는 ‘떨어졌을 수도 있다’로 과거 일에 대한 추측이에요. 태양이 가려지니 기온이 떨어졌다는 뜻이에요.","c":1},"h":"577063ca7e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["소행성은 약 6만 6천 년 전에 지구를 강타했다.","지구의 겨울 동안 식물이 죽고 먹이사슬이 붕괴되었을 것이다.","분화구를 둘러싼 지역에는 황이 없었다.","과학자들은 충돌이 어떻게 멸종을 야기했는지 이미 정확히 알고 있었다."],"opts":["The asteroid hit the Earth about 66 thousand years ago.","Plants would have died and the food chain would have broken down during the global winter.","The area surrounding the crater had no sulfur.","Scientists already knew exactly how the impact caused the extinction."],"r":{"a":"2) Plants would have died and the food chain would have broken down during the global winter.","ev":"10번 문장","s":[[10,"During this period, plants would have died, and the food chain would have broken down.","이 기간 동안, 식물이 죽고, 먹이사슬은 붕괴되었을 것이다."]],"w":"10번 문장에서 이 기간 동안 식물이 죽고 먹이사슬이 붕괴되었을 것이라고 해요. 소행성은 6천 6백만 년 전이고(1번), 황이 없는 곳은 암석 표본이며(6번), 어떻게 멸종했는지는 불명확했어요(3번).","c":2},"h":"e6b580b80b"},{"n":9,"t":"sum","q":"A huge amount of sulfur (A) into the atmosphere, and the temperature of the planet may have (B).","ko":"막대한 양의 황이 대기로 (A), 지구의 기온은 (B) 수도 있다.","oko":["(A) 증발했고 / (B) 올랐을","(A) 얼어붙었고 / (B) 떨어졌을","(A) 증발했고 / (B) 떨어졌을","(A) 얼어붙었고 / (B) 올랐을","(A) 가라앉았고 / (B) 올랐을"],"opts":["(A) evaporated / (B) increased","(A) froze / (B) decreased","(A) evaporated / (B) decreased","(A) froze / (B) increased","(A) sank / (B) increased"],"r":{"a":"3) (A) evaporated / (B) decreased","ev":"7~8번 문장","s":[[7,"This led them to assume the impact caused a huge amount of sulfur from the crater to evaporate into the atmosphere.","이것은 그들로 하여금 그 충돌이 분화구로부터 막대한 양의 황이 대기로 증발하도록 만들었다고 추정하게 했다."],[8,"A large cloud of sulfur would have blocked the sun, and the average temperature of the planet may have decreased by about 15°C.","거대한 황 구름이 태양을 가렸을 것이고, 지구의 평균 기온이 약 15도 정도 떨어졌을 수도 있다."]],"w":"7번에서 충돌로 막대한 양의 황이 대기로 증발했고(evaporated), 8번에서 황 구름이 태양을 가려 지구의 평균 기온이 떨어졌을(decreased) 수도 있다고 해요.","c":3},"h":"cb6e5f94b9"},{"n":10,"t":"fill","q":"A giant [A] hit the Earth and created a massive [B] beneath the Gulf of Mexico.","ko":"거대한 [A]이 지구를 강타했고 멕시코만 아래에 거대한 [B]를 만들었다.","bank":["asteroid","crater","sulfur","samples","atmosphere","dinosaurs"],"bko":{"asteroid":"소행성","crater":"분화구","sulfur":"황","samples":"표본들","atmosphere":"대기","dinosaurs":"공룡들"},"r":{"a":"[A] asteroid, [B] crater","ev":"1~2번 문장","s":[[1,"Around 66 million years ago, a giant asteroid hit the Earth.","약 6천 6백만 년 전에, 거대한 소행성이 지구를 강타했다."],[2,"The impact created a massive crater beneath the Gulf of Mexico.","그 충돌은 멕시코만 아래에 거대한 분화구를 만들었다."]],"w":"1번에서 거대한 소행성(asteroid)이 지구를 강타했고, 2번에서 멕시코만 아래에 거대한 분화구(crater)를 만들었어요. 황, 표본, 대기, 공룡은 지구를 강타하거나 분화구를 만든 주인공이 아니에요.","c":null},"h":"407781307d"}]},{"u":9,"id":"hk4-09-4","no":4,"ko":"되찾은 달콤한 그 맛!\b","items":[{"n":1,"t":"tf","q":"Roca added the scent of rain on dry soil to Javier’s chocolate.","ko":"Roca는 Javier의 초콜릿에 마른 땅 위의 비 냄새를 첨가했다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"So, Roca decorated the chocolate with cacao leaves and added the scent of rain on dry soil.","그래서, Roca는 초콜릿을 카카오 잎으로 장식했고 마른 땅 위의 비 냄새를 첨가했다."]],"w":"7번 문장에서 Roca는 초콜릿을 카카오 잎으로 장식하고 마른 땅 위의 비 냄새를 첨가했다고 해요.","c":"T"},"h":"d2f3bd35e5"},{"n":2,"t":"tf","q":"Roca’s friend could no longer taste food after a car accident.","ko":"Roca의 친구는 교통사고 후에 더 이상 음식의 맛을 느낄 수 없었다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Chef Jordi Roca had a friend who could no longer taste food after cancer treatment.","Jordi Roca 셰프에게는 암 치료 후에 더 이상 음식의 맛을 느낄 수 없게 된 친구가 있었다."]],"w":"1번 문장에서 친구가 맛을 느끼지 못하게 된 때는 암 치료 후(after cancer treatment)예요. 교통사고가 아니에요.","c":"F"},"h":"84516f2e06"},{"n":3,"t":"tf","q":"Javier still cannot taste chocolate after the project.","ko":"Javier는 프로젝트 후에도 여전히 초콜릿의 맛을 느낄 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"But now I can finally taste it again!”","하지만 이제 드디어 그 맛을 다시 느낄 수 있어요!”라고 말했다."]],"w":"11번 문장에서 Javier는 이제 드디어 그 맛을 다시 느낄 수 있다고 말해요. 여전히 느끼지 못한다는 말은 반대예요.","c":"F"},"h":"8fd256cdad"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then, he made chocolate that was specifically created for each person.)","ko":"그 후, 그는 각 사람을 위해 ( ) 제작된 초콜릿을 만들었다.","opts":["우연히","몰래","특별히","빠르게"],"word":"specifically","r":{"a":"3) 특별히","ev":"5번 문장","s":[[5,"Then, he made chocolate that was specifically created for each person.","그 후, 그는 각 사람을 위해 특별히 제작된 초콜릿을 만들었다."]],"w":"사람마다 다른 기억을 물어보고(4번) 그에 맞춰 만들었으니, 각 사람을 위해 ‘특별히’ 제작되었다는 뜻이에요.","c":3},"h":"d95422e4a7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This stimulated his nerve cells to feel what he had tasted back then.)","ko":"이것은 그의 신경 세포가 그 당시에 그가 맛봤던 것을 느끼도록 ( ).","opts":["자극했다","방해했다","멈추게 했다","잊게 했다"],"word":"stimulated","r":{"a":"1) 자극했다","ev":"9번 문장","s":[[9,"This stimulated his nerve cells to feel what he had tasted back then.","이것은 그의 신경 세포가 그 당시에 그가 맛봤던 것을 느끼도록 자극했다."]],"w":"기억이 떠오른 것(8번)이 신경 세포를 움직여 옛 맛을 느끼게 했어요. stimulate는 ‘자극하다’예요.","c":1},"h":"a33dfb9d52"},{"n":6,"t":"ref","q":"What does the underlined \"those memories\" refer to?\nWhen Javier took a bite of the chocolate, it reminded him of those memories.","ko":"밑줄 친 those memories가 가리키는 것은?","sko":"Javier가 초콜릿을 한입 베어 물었을 때, 그것은 그에게 그 기억들이 생각나게 했다.","opts":["암 치료를 받던 때의 기억","Roca가 처음 초콜릿을 만들던 때의 기억","친구와 함께 요리하던 기억","산에서 캠핑하며 초콜릿을 먹었던 어린 시절의 기억"],"r":{"a":"4) 산에서 캠핑하며 초콜릿을 먹었던 어린 시절의 기억","ev":"6, 8번 문장","s":[[6,"One participant named Javier shared his childhood memories of eating chocolate while camping in the mountains.","Javier라는 이름의 참가자는 산에서 캠핑을 하면서 초콜릿을 먹었던 어린 시절 기억을 공유했다."],[8,"When Javier took a bite of the chocolate, it reminded him of those memories.","Javier가 초콜릿을 한입 베어 물었을 때, 그것은 그에게 그 기억들이 생각나게 했다."]],"w":"6번에서 Javier가 말한 것은 산에서 캠핑하며 초콜릿을 먹은 어린 시절 기억이에요. 8번의 those memories는 그 기억이고, Roca는 그에 맞춰 초콜릿을 만들었어요(7번).","c":4},"h":"32a957fa76"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Eating chocolate used to feel like chewing metal.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"초콜릿을 먹는 것은 금속을 씹는 것 같은 느낌이 들곤 했어요.","opts":["지금도 초콜릿을 먹으면 금속을 씹는 것 같은 느낌이 든다.","예전에는 초콜릿을 먹으면 금속을 씹는 것 같은 느낌이 들었다.","금속을 씹으면 초콜릿 맛이 나곤 했다.","초콜릿을 금속 그릇에 담아 먹곤 했다."],"r":{"a":"2) 예전에는 초콜릿을 먹으면 금속을 씹는 것 같은 느낌이 들었다.","ev":"10번 문장","s":[[10,"He was thrilled and said, “Eating chocolate used to feel like chewing metal.","그는 감격하며, “초콜릿을 먹는 것은 금속을 씹는 것 같은 느낌이 들곤 했어요."]],"w":"used to는 ‘~하곤 했다, 전에는 ~이었다’예요. 뒤의 But now(11번)와 이어 보면 예전에는 그랬지만 지금은 달라졌다는 뜻이에요.","c":2},"h":"0672e9aeac"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Roca는 프로젝트를 위해 케이크를 선택했다.","Javier는 프로젝트 중에 캠핑을 하면서 초콜릿을 먹었다.","Javier의 초콜릿은 그에게 캠핑했던 기억을 떠올리게 했다.","Roca는 모든 참가자에게 똑같은 초콜릿을 만들어 주었다."],"opts":["Roca chose cake for his project.","Javier ate the chocolate while camping during the project.","Javier’s chocolate reminded him of his camping memories.","Roca made the same chocolate for every participant."],"r":{"a":"3) Javier’s chocolate reminded him of his camping memories.","ev":"6, 8번 문장","s":[[6,"One participant named Javier shared his childhood memories of eating chocolate while camping in the mountains.","Javier라는 이름의 참가자는 산에서 캠핑을 하면서 초콜릿을 먹었던 어린 시절 기억을 공유했다."],[8,"When Javier took a bite of the chocolate, it reminded him of those memories.","Javier가 초콜릿을 한입 베어 물었을 때, 그것은 그에게 그 기억들이 생각나게 했다."]],"w":"6번에서 Javier는 어린 시절 캠핑하며 초콜릿을 먹은 기억을 말했고, 8번에서 Roca의 초콜릿이 그 기억을 떠올리게 했어요. Roca가 고른 음식은 초콜릿이고(4번), 초콜릿은 사람마다 달랐어요(5번).","c":3},"h":"c0ef767470"},{"n":9,"t":"sum","q":"Roca chose (A) because most people have strong and happy (B) about it.","ko":"대부분의 사람들이 그것에 대해 강렬하고 행복한 (B)을 가지고 있어서 Roca는 (A)을 선택했다.","oko":["(A) 케이크 / (B) 기억","(A) 초콜릿 / (B) 문제","(A) 케이크 / (B) 문제","(A) 금속 / (B) 기억","(A) 초콜릿 / (B) 기억"],"opts":["(A) cake / (B) memories","(A) chocolate / (B) problems","(A) cake / (B) problems","(A) metal / (B) memories","(A) chocolate / (B) memories"],"r":{"a":"5) (A) chocolate / (B) memories","ev":"3~4번 문장","s":[[3,"To achieve this goal, Roca tried to find a food that most people have strong and happy memories about.","이 목표를 달성하기 위해, Roca는 대부분의 사람들이 강렬하고 행복한 기억을 가진 음식을 찾으려고 노력했다."],[4,"He finally chose chocolate and asked people what memories they had of it.","그는 마침내 초콜릿을 선택했고 사람들에게 그것에 대해 어떤 기억을 가지고 있는지 물었다."]],"w":"3번에서 대부분의 사람이 강렬하고 행복한 기억(memories)을 가진 음식을 찾았고, 4번에서 초콜릿(chocolate)을 선택했어요.","c":5},"h":"641be78a18"},{"n":10,"t":"fill","q":"When Javier took a bite of the chocolate, it [A] him of those memories, and this [B] his nerve cells.","ko":"Javier가 초콜릿을 한입 베어 물자, 그것은 그에게 그 기억들을 [A]했고, 이것은 그의 신경 세포를 [B]했다.","bank":["reminded","stimulated","decorated","shared","chewing","camping"],"bko":{"reminded":"생각나게 하다","stimulated":"자극하다","decorated":"장식하다","shared":"공유하다","chewing":"씹는","camping":"캠핑하는"},"r":{"a":"[A] reminded, [B] stimulated","ev":"8~9번 문장","s":[[8,"When Javier took a bite of the chocolate, it reminded him of those memories.","Javier가 초콜릿을 한입 베어 물었을 때, 그것은 그에게 그 기억들이 생각나게 했다."],[9,"This stimulated his nerve cells to feel what he had tasted back then.","이것은 그의 신경 세포가 그 당시에 그가 맛봤던 것을 느끼도록 자극했다."]],"w":"8번 it reminded him of those memories와 9번 This stimulated his nerve cells에서 가져왔어요. remind A of B는 ‘A에게 B가 생각나게 하다’이고, decorated와 shared는 뜻이 맞지 않으며 chewing과 camping은 동사 자리에 맞지 않아요.","c":null},"h":"d7c67b24e2"}]},{"u":10,"id":"hk4-10-1","no":1,"ko":"2등이라서 응원해\b","items":[{"n":1,"t":"tf","q":"We usually cheer for the underdog when it competes against the top dog.","ko":"우리는 보통 언더독이 탑독과 경쟁할 때 언더독을 응원한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Interestingly, we usually cheer for the underdog when the two compete against each other.","흥미롭게도, 그 둘이 서로 경쟁할 때, 우리는 보통 언더독을 응원한다."]],"w":"5번 문장에서 둘이 경쟁할 때 우리는 보통 언더독을 응원한다고 해요.","c":"T"},"h":"e4e64eec6f"},{"n":2,"t":"tf","q":"Our brains react more sensitively to expected events than to unexpected ones.","ko":"우리의 뇌는 예상치 못한 사건보다 예상된 사건에 더 민감하게 반응한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"This is because our brains react more sensitively to unexpected events than to expected ones.","이것은 우리의 뇌가 예상된 사건보다 예상치 못한 것들에 더 민감하게 반응하기 때문이다."]],"w":"7번 문장은 반대로 예상된 사건보다 예상치 못한 사건에 더 민감하게 반응한다고 해요.","c":"F"},"h":"727c43b674"},{"n":3,"t":"tf","q":"It feels fair when the underdog overcomes obstacles and succeeds.","ko":"언더독이 장애를 이겨내고 성공하면 공정하게 느껴진다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"It feels just for the underdog to overcome obstacles and achieve success.","언더독이 장애를 이겨내고 성공을 거두는 것은 공정하다고 느껴진다."]],"w":"9번 문장에서 언더독이 장애를 이겨내고 성공을 거두는 것은 공정하다고 느껴진다고 해요.","c":"T"},"h":"a5efd78da0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is because our brains react more sensitively to unexpected events than to expected ones.)","ko":"이것은 우리의 뇌가 예상된 사건보다 예상치 못한 것들에 더 ( ) 반응하기 때문이다.","opts":["느리게","조용하게","민감하게","우연히"],"word":"sensitively","r":{"a":"3) 민감하게","ev":"7번 문장","s":[[7,"This is because our brains react more sensitively to unexpected events than to expected ones.","이것은 우리의 뇌가 예상된 사건보다 예상치 못한 것들에 더 민감하게 반응하기 때문이다."]],"w":"예상 밖의 일에 뇌가 더 크게 반응해서 언더독의 승리가 더 놀랍게 느껴진다는 흐름이에요. sensitively는 ‘민감하게’예요.","c":3},"h":"ed5f2595d6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It feels just for the underdog to overcome obstacles and achieve success.)","ko":"언더독이 ( )을 이겨내고 성공을 거두는 것은 공정하다고 느껴진다.","opts":["장애물","상대 선수","관중","기회"],"word":"obstacles","r":{"a":"1) 장애물","ev":"9번 문장","s":[[9,"It feels just for the underdog to overcome obstacles and achieve success.","언더독이 장애를 이겨내고 성공을 거두는 것은 공정하다고 느껴진다."]],"w":"성공하기 전에 넘어야 할 어려움이라는 뜻이에요. 약한 쪽이 장애물을 이겨내서 성공하니 공정하게 느껴진다는 흐름이에요.","c":1},"h":"54f8195e3c"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nFor these reasons, we tend to support the underdog and relate to their joy whenever they win.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이러한 이유들로, 우리는 언더독을 지지하는 경향이 있고 그들이 이길 때마다 그들의 기쁨에 공감한다.","opts":["탑독","언더독","경기를 보는 사람들","우리의 뇌"],"r":{"a":"2) 언더독","ev":"10번 문장","s":[[10,"For these reasons, we tend to support the underdog and relate to their joy whenever they win.","이러한 이유들로, 우리는 언더독을 지지하는 경향이 있고 그들이 이길 때마다 그들의 기쁨에 공감한다."]],"w":"우리가 기쁨에 공감하는 대상은 우리가 지지하는 언더독이에요. whenever they win의 they는 앞에 나온 the underdog이에요.","c":2},"h":"02c0c70698"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Moreover, when only the strong win, we think it unfair.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"게다가, 우리는 강자만이 이기면, 그것이 불공평하다고 생각한다.","opts":["강한 쪽이 이기면 우리는 그것이 가장 공정하다고 느낀다.","강한 쪽만 계속 이기면 우리는 그것을 불공평하다고 느낀다.","약한 쪽만 이기면 우리는 그것을 불공평하다고 느낀다.","강한 쪽이 이기든 약한 쪽이 이기든 우리는 신경 쓰지 않는다."],"r":{"a":"2) 강한 쪽만 계속 이기면 우리는 그것을 불공평하다고 느낀다.","ev":"8번 문장","s":[[8,"Moreover, when only the strong win, we think it unfair.","게다가, 우리는 강자만이 이기면, 그것이 불공평하다고 생각한다."]],"w":"the strong은 ‘강한 사람들’이고 think it unfair는 ‘그것을 불공평하다고 생각하다’예요. 강자만 이기는 상황을 불공평하다고 느낀다는 뜻이에요.","c":2},"h":"8edb7925f9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["탑독은 질 것 같은 팀이나 사람이다.","우리는 둘이 경쟁할 때 보통 탑독을 응원한다.","우리는 언더독이 이길 때 그 기쁨에 공감하는 경향이 있다.","우리의 뇌는 예상된 사건에 더 민감하게 반응한다."],"opts":["A top dog is a team or person that is likely to lose.","We usually cheer for the top dog when the two compete.","We tend to share the joy of the underdog when it wins.","Our brains react more sensitively to expected events."],"r":{"a":"3) We tend to share the joy of the underdog when it wins.","ev":"10번 문장","s":[[10,"For these reasons, we tend to support the underdog and relate to their joy whenever they win.","이러한 이유들로, 우리는 언더독을 지지하는 경향이 있고 그들이 이길 때마다 그들의 기쁨에 공감한다."]],"w":"10번 문장에서 우리는 언더독을 지지하고 그들이 이길 때마다 기쁨에 공감하는 경향이 있다고 해요. 탑독은 이길 것 같은 쪽(3번)이고, 우리는 언더독을 응원하며(5번), 뇌는 예상 밖의 일에 더 민감해요(7번).","c":3},"h":"b59fcdfb17"},{"n":9,"t":"sum","q":"We find the underdog winning more (A) than the top dog winning because our brains react more sensitively to (B) events.","ko":"우리는 언더독이 이기는 것이 탑독이 이기는 것보다 더 (A) 느끼는데, 우리의 뇌가 (B) 사건에 더 민감하게 반응하기 때문이다.","oko":["(A) 놀랍다고 / (B) 예상치 못한","(A) 놀랍다고 / (B) 예상된","(A) 지루하다고 / (B) 예상치 못한","(A) 지루하다고 / (B) 예상된","(A) 불공평하다고 / (B) 예상치 못한"],"opts":["(A) surprising / (B) unexpected","(A) surprising / (B) expected","(A) boring / (B) unexpected","(A) boring / (B) expected","(A) unfair / (B) unexpected"],"r":{"a":"1) (A) surprising / (B) unexpected","ev":"6~7번 문장","s":[[6,"While the top dog winning is not that exciting, the underdog winning is far more surprising and pleasing.","탑독이 이기는 것은 그렇게 흥미진진하지 않은 반면, 언더독이 이기는 것은 훨씬 더 놀랍고 만족스럽다."],[7,"This is because our brains react more sensitively to unexpected events than to expected ones.","이것은 우리의 뇌가 예상된 사건보다 예상치 못한 것들에 더 민감하게 반응하기 때문이다."]],"w":"6번에서 언더독이 이기는 것이 훨씬 더 놀랍고(surprising) 만족스럽다고 하고, 7번에서 그 이유는 뇌가 예상치 못한(unexpected) 사건에 더 민감하기 때문이라고 해요.","c":1},"h":"492f5f3b52"},{"n":10,"t":"fill","q":"A top dog is likely to [A], while an underdog is likely to [B].","ko":"탑독은 [A]할 것 같고, 반면에 언더독은 [B]할 것 같다.","bank":["win","lose","unfair","fair","brains","obstacles"],"bko":{"win":"이기다","lose":"지다","unfair":"불공평한","fair":"공평한","brains":"뇌","obstacles":"장애물"},"r":{"a":"[A] win, [B] lose","ev":"3~4번 문장","s":[[3,"A team or person that is likely to win in a match is called a top dog.","경기에서 이길 것 같은 팀이나 사람은 탑독(강자)이라고 불린다."],[4,"On the other hand, the one that is likely to lose is called an underdog.","반면에, 질 것 같은 팀이나 사람은 언더독(약자)이라고 불린다."]],"w":"3번에서 탑독은 이길 것 같은(likely to win) 쪽, 4번에서 언더독은 질 것 같은(likely to lose) 쪽이에요. likely to 뒤에는 동사가 와야 해서 unfair, fair, brains, obstacles는 들어갈 수 없어요.","c":null},"h":"9138074068"}]},{"u":10,"id":"hk4-10-2","no":2,"ko":"집 나간 벌을 찾습니다\b","items":[{"n":1,"t":"tf","q":"The remaining bees, including the queen, survive after the worker bees leave.","ko":"여왕벌을 포함해 남아 있는 벌들은 일벌이 떠난 뒤에도 살아남는다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"The remaining bees, including the queen and the young bees, starve to death.","여왕벌과 어린 벌을 포함하여, 남아 있는 벌은 굶어 죽는다."]],"w":"3번 문장에서 여왕벌과 어린 벌을 포함해 남아 있는 벌은 굶어 죽는다고 해요. 살아남는다는 말은 반대예요.","c":"F"},"h":"aca10c6a8a"},{"n":2,"t":"tf","q":"Some researchers blame electronic signals from mobile phones.","ko":"몇몇 연구원들은 휴대폰의 전자 신호를 탓한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Some researchers also blame electronic signals from mobi
