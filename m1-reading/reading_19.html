usic project now. We will make a music video with Melodia, a singing club in Singapore. Melodia and New Voice are not in the same country, but we can create one beautiful sound."];var PASS_KO=["학교 동아리 활동에 로그인해 봐","오늘은 학교 동아리의 날이다. 동아리 회원들은 지금 재미있는 활동을 하고 있다. 그들을 만나 보자!","너는 로봇을 좋아하니? 나는 로봇 동아리 We Makers의 예지야. 우리 동아리 회원들은 프로그래밍을 배우고 로봇을 만들어. 지금 우리는 우리의 로봇을 테스트하는 중이야. 이것은 Jake의 거미 로봇이야. 조심해! 그의 로봇이 도망치고 있어!","안녕! 나는 Brian이야. 이곳은 Dream and Draw이고, 우리 동아리 회원들은 웹툰을 만들어. 미나는 이야기를 쓰고 있고, 나는 그림을 그리고 있어. 나는 내 그림을 위해 그림 그리기 앱을 사용해. 이 앱으로 나는 다양한 붓과 색상을 사용할 수 있어. 우리 동아리 회원들은 이번 주 금요일에 우리의 새로운 웹툰을 소셜 미디어 사이트에 게시할 거야. 우리 소셜 미디어 사이트에 방문해서 우리의 웹툰을 읽어 보는 게 어때?","우리 동아리 New Voice에 온 걸 환영해. 나는 하윤이야. 우리 동아리 회원들은 함께 노래를 부르고 공연을 해. 나의 동아리는 지금 세계적인 음악 프로젝트를 위해 연습하고 있어. 우리는 싱가포르에 있는 노래 동아리인 Melodia와 함께 뮤직비디오를 만들 거야. Melodia와 New Voice는 같은 나라에 있지 않지만, 우리는 하나의 아름다운 소리를 만들 수 있어."];var DG=[{"qs":[{"n":1,"q":"위 대화에 대한 내용으로 알맞지 않은 것은?","o":["Yuna는 그녀의 학교를 소개하고 있다.","Yuna의 학교에는 큰 운동장이 있다.","Yuna는 매일 축구 연습을 한다.","Yuna는 축구를 잘하지 못한다.","Yuna의 학교 도서관에는 특별한 로봇이 있다."],"a":3,"ans":"Yuna는 축구를 잘하지 못한다.","evs":[["I practice soccer here every day, so I'm good at it.","나는 여기서 매일 축구를 연습해서 축구를 잘해."]],"ev":["I practice soccer here every day, so I'm good at it.","나는 여기서 매일 축구를 연습해서 축구를 잘해."],"ow":["오답 ✕ — 'I'll introduce my school to you.'(내가 너에게 우리 학교를 소개할게.)라고 했으므로 Yuna가 학교를 소개하고 있다는 보기는 대화와 일치해서 정답이 될 수 없음.","오답 ✕ — 'Look, it has a large sports field.'(봐, 우리 학교에는 넓은 운동장이 있어.)라고 했으므로 큰 운동장이 있다는 보기는 일치함.","오답 ✕ — 'I practice soccer here every day'(나는 여기서 매일 축구를 연습해)라고 했으므로 매일 축구 연습을 한다는 보기는 일치함.","정답 ○ — 'I practice soccer here every day, so I'm good at it.'(나는 여기서 매일 축구를 연습해서 축구를 잘해.)이라고 했는데, 이 보기는 축구를 잘하지 못한다고 해서 대화와 일치하지 않음.","오답 ✕ — 'My school library has a special robot.'(우리 학교 도서관에는 특별한 로봇이 있어.)라고 했으므로 도서관에 특별한 로봇이 있다는 보기는 일치함."],"memo":["정답 ④: Yuna는 축구를 잘하지 못한다. (✕ 불일치)","근거: I practice soccer here every day, so I'm good at it.(매일 축구를 연습해서 잘해.)","함정: 불일치 문제이므로 '잘한다'고 말한 부분과 반대되는 보기를 고른다."],"why":"Yuna는 매일
