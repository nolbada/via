nd messages.","ko":"밑줄 친 this network가 가리키는 것은?","sko":"이 네트워크를 통해 나무들은 물, 양분, 메시지를 나눌 수 있다.","opts":["땅속에서 나무 뿌리를 연결하는 곰팡이 네트워크","나무의 잎에서 만들어지는 화학 물질","숲 위로 부는 바람","벌레들이 모여 사는 집"],"pron":"this network","r":{"a":"1) 땅속에서 나무 뿌리를 연결하는 곰팡이 네트워크","ev":"2번, 4번 문장","s":[[2,"There is a network of fungi underground that connects tree roots and allows them to communicate.","땅속에는 나무 뿌리를 연결하고 나무들이 서로 소통할 수 있게 해 주는 곰팡이 네트워크가 있다."],[4,"Through this network, trees can share water, food, and messages.","이 네트워크를 통해 나무들은 물, 양분, 메시지를 나눌 수 있다."]],"w":"2번에서 땅속에는 나무 뿌리를 연결하고 나무들이 서로 소통할 수 있게 해 주는 곰팡이 네트워크가 있다고 함. 4번의 this network는 이 네트워크를 가리킴.","c":1,"k":"this network = 땅속에서 나무 뿌리를 연결하는 곰팡이 네트워크"},"h":"0f7ed1633e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Without this help, many young trees would not survive.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 도움이 없다면, 많은 어린 나무들은 살아남지 못할 것이다.","opts":["이 도움 덕분에 어린 나무들은 훨씬 빨리 자란다.","어린 나무들은 도움을 거절해서 오히려 살아남는다.","많은 어린 나무는 이 도움 때문에 죽는다.","이 도움이 없다면 많은 어린 나무는 살아남지 못할 것이다."],"r":{"a":"4) 이 도움이 없다면 많은 어린 나무는 살아남지 못할 것이다.","w":"11번의 Without this help는 이 도움이 없다면. this help는 10번에서 나이 든 나무가 영양분을 보내 주는 도움. 그 도움이 없으면 어린 나무가 못 산다는 뜻.","c":4,"ev":"10~11번 문장","s":[[10,"Older trees send them nutrients through the network.","더 나이 든 나무들이 네트워크를 통해 그들에게 영양분을 보내 준다."],[11,"Without this help, many young trees would not survive.","이 도움이 없다면, 많은 어린 나무들은 살아남지 못할 것이다."]]},"h":"ee128ea7a0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Trees cannot share anything with each other.","The network actively keeps the whole forest alive.","Bugs use the network to help trees grow.","Only young trees can use the network."],"oko":["나무들은 서로 아무것도 나눌 수 없다.","네트워크는 숲 전체를 활발하게 살아 있게 한다.","벌레들은 네트워크를 이용해 나무가 자라도록 돕는다.","어린 나무들만 네트워크를 이용할 수 있다."],"r":{"a":"2) The network actively keeps the whole forest alive. (네트워크는 숲 전체를 활발하게 살아 있게 한다.)","ev":"13번 문장","s":[[13,"However, it actively sustains the whole forest underground.","하지만 그것은 땅속에서 숲 전체를 활발하게 지탱해 준다."]],"w":"13번에 it actively sustains the whole forest underground라고 나옴. sustain은 \"지탱하다, 유지시키다\"라는 뜻. ①은 4번에서 물, 양분, 메시지를 나눈다고 해서 반대, ③은 5번에서 벌레는 나무를 공격한다고 해서 반대, ④는 8번에서 큰 나무도 네트워크로 작은 나무를 돕는다고 해서 반대.","c":2},"h":"3507674577"},{"n":9,"t":"sum","q":"In (A) places, young trees cannot make enough food from (B).","ko":"(A) 곳에서는 어린 나무들이 (B)(으)로 충분한 양분을 만들 수 없다.","opts":["(A) shady / (B) sunlight","(A) shady / (B) soil","(A) sunny / (B) sunlight","(A) sunny / (B) soil","(A) windy / (B) soil"],"oko":["(A) 그늘진 / (B) 햇빛","(A) 그늘진 / (B) 흙","(A) 햇볕이 잘 드는 / (B) 햇빛","(A) 햇볕이 잘 드는 / (B) 흙","(A) 바람이 센 / (B) 흙"],"r":{"a":"1) (A) shady / (B) sunlight ((A) 그늘진 / (B) 햇빛)","ev":"9번 문장","s":[[9,"In shady places, young trees cannot make enough food from sunlight.","그늘진 곳에서는 어린 나무들이 햇빛으로 충분한 양분을 만들 수 없다."]],"w":"9번 문장에 In shady places, young trees cannot make enough food from sunlight라고 나옴. 그래서 shady와 sunlight.","c":1},"h":"5ec9d197f7"},{"n":10,"t":"fill","q":"The network also [A] big trees to help [B] ones.","ko":"이 네트워크는 또한 큰 나무가 [B] 나무를 도울 수 있게 [A].","bank":["allows","small","weather","chemicals","nutrients","forest"],"bko":{"allows":"~하게 해 준다","small":"작은","weather":"날씨","chemicals":"화학 물질들","nutrients":"영양분","forest":"숲"},"r":{"a":"[A] allows (~하게 해 준다), [B] small (작은)","ev":"8번 문장","s":[[8,"The network also allows big trees to help small ones.","이 네트워크는 또한 큰 나무가 작은 나무를 도울 수 있게 해 준다."]],"w":"8번 문장 The network also allows big trees to help small ones에서 가져옴. allows는 allow(~하게 해 주다)의 3인칭 단수형이고, small ones는 \"작은 나무들\". weather, chemicals, nutrients, forest는 이 자리에 들어가면 문법과 뜻이 맞지 않음.","c":null},"h":"75e55822aa"}]},{"u":8,"id":"b2-08-4","no":4,"ko":"초콜릿이 사라질지도 모른다고?","items":[{"n":1,"t":"tf","q":"Cacao trees grow in hot, rainy regions like West Africa.","ko":"카카오나무는 서아프리카 같은 덥고 비가 많이 오는 지역에서 자란다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장 cacao trees, which grow in hot, rainy regions like West Africa와 같은 내용.","c":"T","ev":"3번 문장","s":[[3,"Chocolate comes from cacao trees, which grow in hot, rainy regions like West Africa.","초콜릿은 서아프리카 같은 덥고 비가 많이 오는 지역에서 자라는 카카오나무에서 나온다."]]},"h":"b2c600ff27"},{"n":2,"t":"tf","q":"West Africa has never had steady rainfall.","ko":"서아프리카는 꾸준한 강우량을 가진 적이 한 번도 없다.","r":{"a":"F (본문과 다른 내용)","w":"4번 문장에서 These regions once had steady rainfall and stable temperatures라고 함. 한때는 꾸준한 강우량이 있었으므로 never는 틀림.","c":"F","ev":"4번 문장","s":[[4,"These regions once had steady rainfall and stable temperatures.","이 지역들은 한때 꾸준한 강우량과 안정적인 기온을 가지고 있었다."]]},"h":"d08f9e696e"},{"n":3,"t":"tf","q":"Some farmers are moving their crops to cooler hillsides.","ko":"일부 농부들은 작물을 더 시원한 언덕 비탈로 옮기고 있다.","r":{"a":"T (본문과 맞는 내용)","w":"14번 문장 some farmers are moving their crops to cooler hillsides와 같은 내용.","c":"T","ev":"14번 문장","s":[[14,"Also, some farmers are moving their crops to cooler hillsides with more stable conditions.","또한 일부 농부들은 더 안정적인 조건을 가진 더 시원한 언덕 비탈로 작물을 옮기고 있다."]]},"h":"0b6e9183c7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These regions once had steady rainfall and stable temperatures.)","ko":"이 지역들은 한때 꾸준한 강우량과 ( ) 기온을 가지고 있었다.","opts":["불규칙한","안정적인","높은","낮은"],"word":"stable","r":{"a":"2) 안정적인","w":"4번에서 once(한때)의 좋았던 상태를 말하고, 5~6번에서 But now 비가 덜 규칙적이고 기온이 오른다고 함. 그 반대라 stable = 안정적인.","c":2,"ev":"4~6번 문장","s":[[4,"These regions once had steady rainfall and stable temperatures.","이 지역들은 한때 꾸준한 강우량과 안정적인 기온을 가지고 있었다."],[5,"But now, the climate is changing.","하지만 이제 기후가 변하고 있다."],[6,"Rainfall is less regular and temperatures are rising.","강우량은 덜 규칙적이고 기온은 오르고 있다."]]},"h":"8c8b5b2e5c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the farmers who rely on cacao for their income.)","ko":"... 카카오로 소득을 얻는 데 ( ) 농부들","opts":["의지하는","반대하는","잊어버린","섞어 놓은"],"word":"rely","r":{"a":"1) 의지하는","w":"11번에서 농부들은 카카오로 소득을 얻음. 그래서 카카오 생산이 줄면 농부들의 소득도 영향을 받음. rely on = ~에 의지하다.","c":1,"ev":"11번 문장","s":[[11,"This affects both chocolate production and the farmers who rely on cacao for their income.","이것은 초콜릿 생산과 카카오로 소득을 얻는 농부들 모두에게 영향을 준다."]]},"h":"5b8143f809"},{"n":6,"t":"ref","q":"What does the underlined \"These trees\" refer to?\nThese trees can grow well in this changing weather.","ko":"밑줄 친 These trees가 가리키는 것은?","sko":"이 나무들은 이렇게 변하는 날씨에서도 잘 자랄 수 있다.","opts":["서아프리카의 오래된 나무들","시원한 언덕으로 옮겨 심은 작물","과학자들이 개발하고 있는 더 강한 카카오나무","초콜릿을 좋아하는 농부들"],"pron":"These trees","r":{"a":"3) 과학자들이 개발하고 있는 더 강한 카카오나무","ev":"12~13번 문장","s":[[12,"To help, scientists are developing stronger cacao trees.","돕기 위해, 과학자들은 더 강한 카카오나무를 개발하고 있다."],[13,"These trees can grow well in this changing weather.","이 나무들은 이렇게 변하는 날씨에서도 잘 자랄 수 있다."]],"w":"12번에서 과학자들이 더 강한 카카오나무를 개발하고 있다고 함. 13번의 These trees는 이 나무들을 가리킴. 그래서 변하는 날씨에서도 잘 자랄 수 있다는 뜻.","c":3,"k":"These trees = 과학자들이 개발하고 있는 더 강한 카카오나무"},"h":"61c46e472f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But in the future, it might not be so easy to enjoy.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 앞으로는 그것을 즐기기가 그렇게 쉽지 않을지도 모른다.","opts":["앞으로는 초콜릿을 더 쉽게 즐길 수 있게 될 것이다.","앞으로 초콜릿은 완전히 사라질 것이다.","앞으로 아이들이 초콜릿을 싫어하게 될 것이다.","앞으로는 초콜릿을 즐기기가 어려워질 수도 있다."],"r":{"a":"4) 앞으로는 초콜릿을 즐기기가 어려워질 수도 있다.","w":"2번의 might not be so easy는 쉽지 않을지도 모른다는 뜻. 1번에서 인기 있는 간식이라고 한 뒤 But으로 미래의 걱정을 말함. 사라질 것이라고 확정한 말은 아니고, 아이들 취향 이야기도 없음.","c":4,"ev":"1~2번 문장","s":[[1,"Chocolate is one of the world’s most popular treats.","초콜릿은 세계에서 가장 인기 있는 간식 중 하나이다."],[2,"But in the future, it might not be so easy to enjoy.","하지만 앞으로는 그것을 즐기기가 그렇게 쉽지 않을지도 모른다."]]},"h":"b90e0272b6"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Temperatures in these regions are going down.","Rainfall has become more regular than before.","Rainfall is less regular and temperatures are rising in these regions.","All farmers have stopped growing cacao."],"oko":["이 지역들의 기온은 내려가고 있다.","강우량이 전보다 더 규칙적으로 되었다.","이 지역들에서는 강우량이 덜 규칙적이고 기온이 오르고 있다.","모든 농부가 카카오 재배를 그만두었다."],"r":{"a":"3) Rainfall is less regular and temperatures are rising in these regions. (이 지역들에서는 강우량이 덜 규칙적이고 기온이 오르고 있다.)","ev":"6번 문장","s":[[6,"Rainfall is less regular and temperatures are rising.","강우량은 덜 규칙적이고 기온은 오르고 있다."]],"w":"6번에 Rainfall is less regular and temperatures are rising이라고 나옴. ①은 기온이 오르고 있어서 반대, ②는 덜 규칙적이라서 반대, ④는 일부 농부들이 작물을 옮기고 있다는 내용이라 본문과 다름.","c":3},"h":"7c3b74c128"},{"n":9,"t":"sum","q":"Too little rain (A) ______ the trees, and too much rain damages the roots and spreads (B) ______.","ko":"비가 너무 적으면 나무를 (A), 비가 너무 많으면 뿌리가 손상되고 (B)이 퍼진다.","oko":["(A) 키운다 / (B) 감염","(A) 말라 버리게 한다 / (B) 꽃","(A) 말라 버리게 한다 / (B) 감염","(A) 키운다 / (B) 물","(A) 식힌다 / (B) 꽃"],"opts":["(A) feeds / (B) infection","(A) dries out / (B) flowers","(A) dries out / (B) infection","(A) feeds / (B) water","(A) cools / (B) flowers"],"r":{"a":"3) (A) dries out / (B) infection","w":"7번에서 비가 너무 적으면 나무가 말라 버리고(dries out), 8번에서 비가 너무 많으면 뿌리가 손상되고 감염(infection)이 퍼짐. 꽃은 9번의 기온 이야기라 이 문장과 맞지 않음.","c":3,"ev":"7~8번 문장","s":[[7,"Too little rain dries out the trees.","비가 너무 적으면 나무가 말라 버린다."],[8,"Too much damages the roots and spreads infection.","비가 너무 많으면 뿌리가 손상되고 감염이 퍼진다."]]},"h":"dea207286b"},{"n":10,"t":"fill","q":"A temperature rise of just 2 [A] can stop cacao flowers from growing. As a result, many trees are producing fewer cacao [B].","ko":"단 2 [A]의 기온 상승이 카카오 꽃이 자라는 것을 막을 수 있다. 그 결과, 많은 나무가 더 적은 카카오 [B]을(를) 생산하고 있다.","bank":["degrees","pods","rainfall","income","farmers","hillsides"],"bko":{"degrees":"도(온도 단위, degree의 복수형)","pods":"꼬투리(pod의 복수형)","rainfall":"강우량","income":"소득","farmers":"농부들","hillsides":"언덕 비탈"},"r":{"a":"[A] degrees (도(온도 단위, degree의 복수형)), [B] pods (꼬투리(pod의 복수형))","ev":"9~10번 문장","s":[[9,"A temperature rise of just 2 degrees can stop cacao flowers from growing.","단 2도의 기온 상승이 카카오 꽃이 자라는 것을 막을 수 있다."],[10,"As a result, many trees are producing fewer cacao pods.","그 결과, 많은 나무가 더 적은 카카오 열매 꼬투리를 생산하고 있다."]],"w":"9번 A temperature rise of just 2 degrees, 10번 many trees are producing fewer cacao pods에서 가져옴. 2 degrees는 \"2도\", fewer 뒤에는 셀 수 있는 복수명사 pods(꼬투리)가 옴. rainfall, income, farmers, hillsides는 뜻이 맞지 않음.","c":null},"h":"eba974a3db"}]},{"u":9,"id":"b2-09-1","no":1,"ko":"뱀파이어는 어떻게 진짜가 되었을까?","items":[{"n":1,"t":"tf","q":"In the 1700s, people in Eastern Europe knew the cause of the terrible diseases.","ko":"1700년대 동유럽 사람들은 무서운 질병의 원인을 알고 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"In Eastern Europe in the 1700s, terrible diseases spread, but no one knew why.","1700년대 동유럽에서는 무서운 질병이 퍼졌지만, 아무도 그 이유를 알지 못했다."]],"w":"3번 문장에 no one knew why(아무도 이유를 몰랐다)가 있음. 원인을 알고 있었다는 말은 반대임.","c":"F"},"h":"8678727a03"},{"n":2,"t":"tf","q":"The villagers dug up graves to look for proof.","ko":"마을 사람들은 증거를 찾으려고 무덤을 파헤쳤다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"So they dug up graves to look for proof.","그래서 그들은 증거를 찾으려고 무덤을 파헤쳤다."]],"w":"6번 문장에 So they dug up graves to look for proof가 그대로 있음. dig up(파내다)은 땅속의 것을 꺼내는 것.","c":"T"},"h":"1706a17418"},{"n":3,"t":"tf","q":"To stop vampires, villagers burned the bodies or put stakes into their hearts.","ko":"뱀파이어를 막으려고 마을 사람들은 시체를 불태우거나 심장에 말뚝을 박았다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"To stop them, villagers burned the bodies or put stakes into their hearts.","그것들을 막으려고, 마을 사람들은 시체를 불태우거나 심장에 말뚝을 박았다."]],"w":"11번 문장에 To stop them, villagers burned the bodies or put stakes into their hearts가 있음. them은 10번의 뱀파이어를 가리킴.","c":"T"},"h":"b489402693"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The villagers suspected the dead could return and harm the living.)","ko":"마을 사람들은 죽은 사람이 돌아와 산 사람을 해칠 수 있다고 ( ).","opts":["확인했다","의심했다","잊어버렸다","기뻐했다"],"word":"suspected","r":{"a":"2) 의심했다","ev":"5번 문장","s":[[5,"The villagers suspected the dead could return and harm the living.","마을 사람들은 죽은 사람이 돌아와 산 사람을 해칠 수도 있다고 의심했다."]],"w":"5번 문장의 suspect(의심하다)는 '아직 확실하지 않지만 그럴지도 모른다고 생각하다'. 이 의심 때문에 6번에서 증거를 찾으러 무덤을 팠음.","c":2},"h":"4efb51a9ca"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But even today, the idea of vampires still fascinates us.)","ko":"하지만 오늘날에도 뱀파이어라는 생각은 여전히 우리를 ( ).","opts":["두렵게 한다","지루하게 한다","속인다","매료시킨다"],"word":"fascinates","r":{"a":"4) 매료시킨다","ev":"14번 문장","s":[[14,"But even today, the idea of vampires still fascinates us.","하지만 오늘날에도 뱀파이어라는 생각은 여전히 우리를 매료시킨다."]],"w":"14번 문장의 fascinate(매료시키다)는 마음을 확 끌어당긴다는 뜻. But 뒤에 오늘날에도 여전하다고 했으니 관심이 이어진다는 방향이라, 지루하게 한다는 반대임.","c":4},"h":"c13faac667"},{"n":6,"t":"ref","q":"What does the underlined \"these\" refer to?\nThey didn’t know these were normal changes after death.","ko":"밑줄 친 these가 가리키는 것은?","sko":"그들은 이것이 죽은 뒤에 나타나는 정상적인 변화라는 것을 알지 못했다.","opts":["입 근처의 피와 길어 보이는 머리카락과 손톱","마을 사람들이 파헤친 무덤들","1700년대 동유럽의 질병","시체를 불태우는 일"],"pron":"these","r":{"a":"1) 입 근처의 피와 길어 보이는 머리카락과 손톱","ev":"7~8번 문장","s":[[7,"The villagers often saw blood near a dead person’s mouth or hair and nails that looked longer.","마을 사람들은 죽은 사람의 입 근처에 있는 피나 더 길어 보이는 머리카락과 손톱을 자주 보았다."],[8,"They didn’t know these were normal changes after death.","그들은 이것이 죽은 뒤에 나타나는 정상적인 변화라는 것을 알지 못했다."]],"w":"7번에서 마을 사람들은 죽은 사람의 입 근처의 피나 더 길어 보이는 머리카락과 손톱을 자주 보았다고 함. 8번의 these는 이것들을 가리키며, 이것들이 죽은 뒤의 정상적인 변화라는 것을 몰랐다는 뜻.","c":1,"k":"these = 입 근처의 피와 길어 보이는 머리카락과 손톱"},"h":"c261510b40"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But long ago, many people believed they were real.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 아주 오래전에는 많은 사람들이 뱀파이어가 실제로 존재한다고 믿었다.","opts":["아주 오래전에는 많은 사람들이 뱀파이어가 실제로 존재한다고 믿었다.","아주 오래전에는 아무도 뱀파이어를 몰랐다.","아주 오래전에는 뱀파이어가 책 속에서만 나왔다.","오늘날에는 모든 사람들이 뱀파이어가 실제라고 믿는다."],"r":{"a":"1) 아주 오래전에는 많은 사람들이 뱀파이어가 실제로 존재한다고 믿었다.","ev":"1~2번 문장","s":[[1,"Today, vampires are just fun characters in books and movies.","오늘날 뱀파이어는 책과 영화 속의 재미있는 캐릭터일 뿐이다."],[2,"But long ago, many people believed they were real.","하지만 아주 오래전에는 많은 사람들이 뱀파이어가 실제로 존재한다고 믿었다."]],"w":"But long ago는 \"하지만 아주 오래전에는\", believed they were real은 \"그것들이 실제라고 믿었다\"는 뜻. 앞 문장의 뱀파이어를 가리키므로 1번.","c":1},"h":"71a7feee8e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Vampires have never appeared in books or movies.","Today, vampires are fun characters in books and movies.","Long ago, vampires were only characters in movies.","Today, many people in Eastern Europe believe vampires are real."],"oko":["뱀파이어는 책이나 영화에 한 번도 나온 적이 없다.","오늘날 뱀파이어는 책과 영화 속의 재미있는 캐릭터이다.","아주 오래전에 뱀파이어는 영화 속 캐릭터일 뿐이었다.","오늘날 동유럽의 많은 사람들은 뱀파이어가 실제라고 믿는다."],"r":{"a":"2) Today, vampires are fun characters in books and movies. (오늘날 뱀파이어는 책과 영화 속의 재미있는 캐릭터이다.)","ev":"1~2번 문장","s":[[1,"Today, vampires are just fun characters in books and movies.","오늘날 뱀파이어는 책과 영화 속의 재미있는 캐릭터일 뿐이다."],[2,"But long ago, many people believed they were real.","하지만 아주 오래전에는 많은 사람들이 뱀파이어가 실제로 존재한다고 믿었다."]],"w":"1번에 Today, vampires are just fun characters in books and movies라고 나옴. ①은 책과 영화에 나온다고 해서 반대, ③은 2번에서 아주 오래전에는 많은 사람들이 실제라고 믿었다고 해서 반대, ④는 오늘날에는 재미있는 캐릭터일 뿐이라서 반대.","c":2},"h":"001a4a1e42"},{"n":9,"t":"sum","q":"When people died (A), (B) filled the villages.","ko":"사람들이 (A) 죽자, (B)이(가) 마을마다 가득 찼다.","opts":["(A) suddenly / (B) fear","(A) suddenly / (B) joy","(A) slowly / (B) fear","(A) slowly / (B) joy","(A) quietly / (B) joy"],"oko":["(A) 갑자기 / (B) 두려움","(A) 갑자기 / (B) 기쁨","(A) 천천히 / (B) 두려움","(A) 천천히 / (B) 기쁨","(A) 조용히 / (B) 기쁨"],"r":{"a":"1) (A) suddenly / (B) fear ((A) 갑자기 / (B) 두려움)","ev":"4번 문장","s":[[4,"When people died suddenly, fear filled the villages.","사람들이 갑자기 죽자, 두려움이 마을마다 가득 찼다."]],"w":"4번 문장에 When people died suddenly, fear filled the villages라고 나옴. 그래서 suddenly와 fear.","c":1},"h":"6d560bdbfa"},{"n":10,"t":"fill","q":"These stories about vampires soon [A] across Europe. Later, [B] explained what really happened, and people realized vampires weren’t real.","ko":"뱀파이어에 관한 이 이야기들은 곧 유럽 전역으로 [A]. 나중에 [B]이(가) 실제로 무슨 일이 있었는지 설명해 주었고, 사람들은 뱀파이어가 실제가 아니라는 것을 깨달았다.","bank":["spread","science","diseases","graves","stakes","blood"],"bko":{"spread":"퍼졌다(spread의 과거)","science":"과학","diseases":"질병들","graves":"무덤들","stakes":"말뚝들","blood":"피"},"r":{"a":"[A] spread (퍼졌다(spread의 과거)), [B] science (과학)","ev":"12~13번 문장","s":[[12,"These stories about vampires soon spread across Europe.","뱀파이어에 관한 이 이야기들은 곧 유럽 전역으로 퍼졌다."],[13,"Later, science explained what really happened, and people realized vampires weren’t real.","나중에 과학이 실제로 무슨 일이 있었는지 설명해 주었고, 사람들은 뱀파이어가 실제가 아니라는 것을 깨달았다."]],"w":"12번 These stories about vampires soon spread across Europe, 13번 Later, science explained what really happened에서 가져옴. spread는 \"퍼지다\"이고 과거형도 spread. diseases, graves, stakes, blood는 명사라서 [A]의 동사 자리에 쓸 수 없고, [B]에 넣으면 뜻이 맞지 않음.","c":null},"h":"58174f0834"}]},{"u":9,"id":"b2-09-2","no":2,"ko":"괴물이 된 아름다운 여인, 메두사의 진짜 이야기","items":[{"n":1,"t":"tf","q":"Medusa was once a beautiful woman in Greek mythology.","ko":"그리스 신화에서 메두사는 한때 아름다운 여인이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"In Greek mythology, however, she was once a beautiful woman.","그러나 그리스 신화에서 그녀는 한때 아름다운 여인이었다."]],"w":"2번 문장에 she was once a beautiful woman이 있음. 1번에서는 무서운 괴물로 알려졌지만, however 뒤에서 이야기가 반전됨.","c":"T"},"h":"ba4aa8d807"},{"n":2,"t":"tf","q":"Perseus killed Medusa by looking at her directly.","ko":"페르세우스는 메두사를 직접 쳐다보면서 죽였다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"This way, he could move close and kill her without looking at her directly.","이렇게 해서 그는 그녀를 직접 쳐다보지 않고도 가까이 다가가 그녀를 죽일 수 있었다."]],"w":"8번 문장에 he could move close and kill her without looking at her directly가 있음. 직접 쳐다보지 않고 죽였다는 내용이라 반대임.","c":"F"},"h":"e20d9af9dc"},{"n":3,"t":"tf","q":"Athena placed Medusa’s head on her shield for protection.","ko":"아테나는 보호를 위해 메두사의 머리를 자신의 방패에 달았다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Later, he gave the head to Athena, and she placed it on her shield for protection.","나중에 그는 그 머리를 아테나에게 주었고, 아테나는 그것을 보호를 위해 자신의 방패에 달았다."]],"w":"11번 문장에 she placed it on her shield for protection이 있음. it은 앞에 나온 메두사의 머리(the head).","c":"T"},"h":"c019713e66"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Athena turned her hair into snakes and gave her a deadly gaze.)","ko":"아테나는 그녀의 머리카락을 뱀으로 바꾸고 ( ) 시선을 주었다.","opts":["부드러운","슬픈","치명적인","아름다운"],"word":"deadly","r":{"a":"3) 치명적인","ev":"4~5번 문장","s":[[4,"As punishment, Athena turned her hair into snakes and gave her a deadly gaze.","벌로 아테나는 그녀의 머리카락을 뱀으로 바꾸고 치명적인 시선을 주었다."],[5,"Anyone who looked at Medusa would turn into stone.","메두사를 쳐다본 사람은 누구든 돌로 변했다."]],"w":"4번의 deadly gaze(치명적인 시선)가 무슨 뜻인지는 5번이 알려 줌. 쳐다본 사람은 누구든 돌로 변하니 목숨을 위협하는 '치명적인' 시선.","c":3},"h":"a41125a990"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He used his shiny shield like a mirror and watched her reflection.)","ko":"그는 반짝이는 방패를 거울처럼 사용해 그녀의 ( )을 지켜보았다.","opts":["비친 모습","그림자","깊은 생각","목소리"],"word":"reflection","r":{"a":"1) 비친 모습","ev":"7번 문장","s":[[7,"He used his shiny shield like a mirror and watched her reflection.","그는 반짝이는 방패를 거울처럼 사용해 그녀의 비친 모습을 지켜보았다."]],"w":"7번에서 방패를 거울처럼 썼다고 했으니 reflection은 방패 면에 비친 모습. 8번에서 직접 쳐다보지 않았다는 말과 이어짐.","c":1},"h":"18d43fb59c"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nOne day, she angered the goddess Athena, and everything changed.","ko":"밑줄 친 she가 가리키는 것은?","sko":"어느 날 그녀는 여신 아테나를 화나게 했고, 모든 것이 바뀌었다.","opts":["메두사","여신 아테나","영웅 페르세우스","메두사의 어머니"],"pron":"she","r":{"a":"1) 메두사","ev":"2~3번 문장","s":[[2,"In Greek mythology, however, she was once a beautiful woman.","그러나 그리스 신화에서 그녀는 한때 아름다운 여인이었다."],[3,"One day, she angered the goddess Athena, and everything changed.","어느 날 그녀는 여신 아테나를 화나게 했고, 모든 것이 바뀌었다."]],"w":"2번에서 메두사는 한때 아름다운 여인이었다고 함. 3번의 she는 이 메두사를 가리키며, 그녀가 여신 아테나를 화나게 해서 모든 것이 바뀌었다는 뜻.","c":1,"k":"she = 메두사"},"h":"4c20732271"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"From then on, Medusa’s image changed from a symbol of fear into one of strength and protection.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그때부터 메두사의 모습은 두려움의 상징에서 힘과 보호의 상징으로 바뀌었다.","opts":["그때부터 메두사는 힘의 상징에서 두려움의 상징으로 바뀌었다.","그때부터 메두사는 다시 아름다운 여인의 모습으로 돌아갔다.","그때부터 아테나는 두려움을 이기고 힘을 얻게 되었다.","그때부터 메두사는 두려움의 상징이 아니라 힘과 보호의 상징이 되었다."],"r":{"a":"4) 그때부터 메두사는 두려움의 상징이 아니라 힘과 보호의 상징이 되었다.","ev":"12번 문장","s":[[12,"From then on, Medusa’s image changed from a symbol of fear into one of strength and protection.","그때부터 메두사의 모습은 두려움의 상징에서 힘과 보호의 상징으로 바뀌었다."]],"w":"12번은 from a symbol of fear(두려움의 상징에서) into one of strength and protection(힘과 보호의 상징으로)임. 방향이 두려움 → 힘과 보호. 반대로 쓴 선지는 오답.","c":4},"h":"b72ca0980d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["The hero Perseus found a clever way to face Medusa.","Everyone looked at Medusa without any fear.","Medusa was a hero who fought Perseus.","Athena killed Medusa with a sword."],"oko":["영웅 페르세우스는 메두사를 마주할 영리한 방법을 찾았다.","모든 사람이 아무 두려움 없이 메두사를 쳐다보았다.","메두사는 페르세우스와 싸운 영웅이었다.","아테나는 칼로 메두사를 죽였다."],"r":{"a":"1) The hero Perseus found a clever way to face Medusa. (영웅 페르세우스는 메두사를 마주할 영리한 방법을 찾았다.)","ev":"6번 문장","s":[[6,"No one dared to look at Medusa, but the hero Perseus found a clever way.","아무도 감히 메두사를 쳐다보지 못했지만, 영웅 페르세우스는 영리한 방법을 찾았다."]],"w":"6번에 No one dared to look at Medusa, but the hero Perseus found a clever way라고 나옴. ②는 아무도 감히 쳐다보지 못했다는 내용과 반대, ③은 페르세우스가 영웅이라서 반대, ④는 페르세우스가 메두사를 죽였으므로 반대.","c":1},"h":"252bf152d6"},{"n":9,"t":"sum","q":"Medusa angered Athena, and as (A), Athena turned her hair into snakes and gave her a gaze that could turn people into (B).","ko":"메두사는 아테나를 화나게 했고, (A)(으)로 아테나는 그녀의 머리카락을 뱀으로 바꾸고 사람들을 (B)(으)로 변하게 하는 시선을 주었다.","opts":["(A) reward / (B) stone","(A) punishment / (B) snakes","(A) punishment / (B) stone","(A) gift / (B) light","(A) reward / (B) snakes"],"oko":["(A) 상 / (B) 돌","(A) 벌 / (B) 뱀","(A) 벌 / (B) 돌","(A) 선물 / (B) 빛","(A) 상 / (B) 뱀"],"r":{"a":"3) (A) punishment / (B) stone ((A) 벌 / (B) 돌)","ev":"3~5번 문장","s":[[3,"One day, she angered the goddess Athena, and everything changed.","어느 날 그녀는 여신 아테나를 화나게 했고, 모든 것이 바뀌었다."],[4,"As punishment, Athena turned her hair into snakes and gave her a deadly gaze.","벌로 아테나는 그녀의 머리카락을 뱀으로 바꾸고 치명적인 시선을 주었다."],[5,"Anyone who looked at Medusa would turn into stone.","메두사를 쳐다본 사람은 누구든 돌로 변했다."]],"w":"3~5번 문장에 As punishment, Athena turned her hair into snakes and gave her a deadly gaze, Anyone who looked at Medusa would turn into stone이라고 나옴. 그래서 punishment와 stone.","c":3},"h":"cfd43bb0c8"},{"n":10,"t":"fill","q":"Even after her [A], Medusa’s power [B] strong.","ko":"그녀의 [A] 뒤에도 메두사의 힘은 여전히 강하게 [B].","bank":["death","remained","directly","shiny","clever","deadly"],"bko":{"death":"죽음","remained":"남아 있었다(remain의 과거)","directly":"직접","shiny":"반짝이는","clever":"영리한","deadly":"치명적인"},"r":{"a":"[A] death (죽음), [B] remained (남아 있었다(remain의 과거))","ev":"9번 문장","s":[[9,"Even after her death, Medusa’s power remained strong.","그녀가 죽은 뒤에도 메두사의 힘은 여전히 강했다."]],"w":"9번 문장 Even after her death, Medusa’s power remained strong에서 가져옴. after her death는 \"그녀가 죽은 뒤에도\", remained strong은 \"계속 강했다\". directly, shiny, clever, deadly는 [A]나 [B]의 자리에 문법과 뜻이 맞지 않음.","c":null},"h":"d7743177b6"}]},{"u":9,"id":"b2-09-3","no":3,"ko":"발자국 하나가 만든 전설, 빅풋","items":[{"n":1,"t":"tf","q":"Bigfoot stories were known to the general public before the 1950s.","ko":"빅풋 이야기는 1950년대 이전에 일반 대중에게 알려져 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Until the 1950s, these stories stayed mostly within Native American communities.","1950년대까지 이 이야기들은 대부분 아메리카 원주민 공동체 안에만 머물렀다."]],"w":"3번 문장에 Until the 1950s, these stories stayed mostly within Native American communities가 있음. 1950년대까지는 원주민 공동체 안에만 머물렀으니 일반 대중에게 알려졌다는 말은 반대임.","c":"F"},"h":"835f0e7bcc"},{"n":2,"t":"tf","q":"A road worker in California found huge footprints in 1958.","ko":"1958년에 캘리포니아의 한 도로 공사 인부가 거대한 발자국을 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Then public interest grew sharply in 1958, when a road worker in California discovered huge footprints about 40 centimeters long.","그러다 1958년에 캘리포니아의 한 도로 공사 인부가 길이 약 40센티미터의 거대한 발자국을 발견하면서 대중의 관심이 급격히 커졌다."]],"w":"4번 문장에 in 1958, when a road worker in California discovered huge footprints가 있음. discover(발견하다)는 처음 2},"h":"b14700de09"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nPeople said that the land changed shape wherever they went.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"사람들은 그들이 가는 곳마다 땅의 모양이 바뀌었다고 말했다.","opts":["폴 버니언과 베이브","이야기를 전한 정착민들","나무와 연못들","애리조나 사막의 사람들"],"r":{"a":"1) 폴 버니언과 베이브","ev":"7~8번 문장","s":[[7,"He traveled with Babe, his blue ox.","그는 파란 황소 베이브와 함께 다녔다."],[8,"People said that the land changed shape wherever they went.","사람들은 그들이 가는 곳마다 땅의 모양이 바뀌었다고 말했다."]],"w":"8번 the land changed shape wherever they went에서 they는 바로 앞 7번의 He traveled with Babe에서 함께 다니는 폴 버니언과 베이브. 이야기 속에서 가는 곳마다 땅의 모양이 바뀜.","c":1},"h":"6524a4f7e8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He was so tall that trees looked like grass beside him.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 너무 커서 그 옆에서는 나무가 풀처럼 보였다.","opts":["그는 풀처럼 키가 작아서 나무 옆에서는 눈에 띄지 않았다.","그는 나무만큼 키가 커서 풀밭에서도 쉽게 눈에 띄었다.","그는 너무 커서 그 옆에 있으면 나무가 풀처럼 작아 보였다.","그는 풀을 좋아해서 나무 옆에 풀을 심어 주었다."],"r":{"a":"3) 그는 너무 커서 그 옆에 있으면 나무가 풀처럼 작아 보였다.","ev":"5번 문장","s":[[5,"He was so tall that trees looked like grass beside him.","그는 너무 커서 그 옆에서는 나무가 풀처럼 보였다."]],"w":"5번 so tall that trees looked like grass는 '너무 커서 나무가 풀처럼 보였다'. 나무가 풀로 보일 만큼 폴이 거대하다는 뜻이라, 폴이 작다는 선지는 반대.","c":3},"h":"666870f6bf"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Paul Bunyan was a huge lumberjack.","Paul Bunyan traveled alone because he did not like animals.","Babe was a small white horse that lived in a town.","Paul Bunyan was a small fisherman who lived by the sea."],"oko":["폴 버니언은 거대한 나무꾼이었다.","폴 버니언은 동물을 싫어해서 혼자 다녔다.","베이브는 마을에 사는 작고 하얀 말이었다.","폴 버니언은 바닷가에 사는 작은 어부였다."],"r":{"a":"1) Paul Bunyan was a huge lumberjack. (폴 버니언은 거대한 나무꾼이었다.)","ev":"4번, 7번 문장","s":[[4,"One famous hero was Paul Bunyan, a huge lumberjack.","유명한 영웅 중 하나는 거대한 나무꾼 폴 버니언이었다."],[7,"He traveled with Babe, his blue ox.","그는 파란 황소 베이브와 함께 다녔다."]],"w":"4번에 One famous hero was Paul Bunyan, a huge lumberjack이라고 나옴. ②는 7번에서 파란 황소 베이브와 함께 다녔다고 해서 반대, ③은 베이브가 파란 황소라서 반대, ④는 폴이 거대한 나무꾼이라서 반대.","c":1},"h":"4a33de1d61"},{"n":9,"t":"sum","q":"With each step, the (A) cut into the dry ground, and the deep cut became the (B).","ko":"걸음마다 (A)이(가) 메마른 땅을 파고들었고, 그 깊게 파인 자국은 (B)이(가) 되었다.","opts":["(A) blade / (B) Grand Canyon","(A) blade / (B) pond","(A) tree / (B) Grand Canyon","(A) tree / (B) pond","(A) rope / (B) pond"],"oko":["(A) 도끼날 / (B) 그랜드캐니언","(A) 도끼날 / (B) 연못","(A) 나무 / (B) 그랜드캐니언","(A) 나무 / (B) 연못","(A) 밧줄 / (B) 연못"],"r":{"a":"1) (A) blade / (B) Grand Canyon ((A) 도끼날 / (B) 그랜드캐니언)","ev":"10~11번 문장","s":[[10,"With each step, the blade cut into the dry ground.","걸음마다 도끼날이 메마른 땅을 파고들었다."],[11,"After hundreds of miles, this deep cut became what we now call the Grand Canyon.","수백 마일을 가자, 이 깊게 파인 자국은 오늘날 우리가 그랜드캐니언이라고 부르는 곳이 되었다."]],"w":"10번에 the blade cut into the dry ground, 11번에 this deep cut became what we now call the Grand Canyon이라고 나옴. 그래서 blade와 Grand Canyon.","c":1},"h":"53550ddd0f"},{"n":10,"t":"fill","q":"But these tall tales [A] settlers something to laugh about and helped them face another [B] day.","ko":"하지만 이 허풍스러운 이야기들은 정착민들에게 웃을 거리를 [A], 또 다른 [B] 하루를 맞이하는 데 도움이 되었다.","bank":["gave","hard","ponds","west","giant","deep"],"bko":{"gave":"주었다(give의 과거)","hard":"힘든","ponds":"연못들","west":"서쪽","giant":"거대한","deep":"깊은"},"r":{"a":"[A] gave (주었다(give의 과거)), [B] hard (힘든)","ev":"13번 문장","s":[[13,"But these tall tales gave settlers something to laugh about and helped them face another hard day.","하지만 이 허풍스러운 이야기들은 정착민들에게 웃을 거리를 주었고, 또 다른 힘든 하루를 맞이하는 데 도움이 되었다."]],"w":"13번 문장 But these tall tales gave settlers something to laugh about and helped them face another hard day에서 가져옴. gave는 give의 과거형이고, another hard day는 \"또 다른 힘든 하루\". ponds, west, giant, deep은 이 자리에 들어가면 문법이나 뜻이 맞지 않음.","c":null},"h":"f8d3902fac"}]},{"u":10,"id":"b2-10-1","no":1,"ko":"선수 뒤에서 뛰는 사람, 스포츠 에이전트","items":[{"n":1,"t":"tf","q":"Sports agents help athletes only on the field.","ko":"스포츠 에이전트는 선수를 경기장 안에서만 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Agents help athletes in many ways off the field.","에이전트는 경기장 밖에서 여러 면으로 선수들을 돕는다."]],"w":"2번 문장에 Agents help athletes in many ways off the field가 있음. off the field는 '경기장 밖에서'라서 경기장 안에서만 돕는다는 말은 반대임.","c":"F"},"h":"0e910be6e9"},{"n":2,"t":"tf","q":"Agents manage a player’s social media and public image.","ko":"에이전트는 선수의 소셜 미디어와 대중적 이미지를 관리한다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Agents also manage a player’s social media and public image.","에이전트는 또한 선수의 소셜 미디어와 대중적 이미지를 관리한다."]],"w":"4번 문장에 Agents also manage a player’s social media and public image가 그대로 있음.","c":"T"},"h":"da99af9d5e"},{"n":3,"t":"tf","q":"Sports agents do not need a license before they start working.","ko":"스포츠 에이전트는 일을 시작하기 전에 면허가 필요 없다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"They need to get a license before they can work.","그들은 일을 하기 전에 면허를 취득해야 한다."]],"w":"9번 문장에 They need to get a license before they can work가 있음. 일하기 전에 면허가 필요하니 면허 없이 시작할 수 있다는 말은 반대임.","c":"F"},"h":"6cd38b3376"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They deal with player contracts, arrange transfers between teams, and find sponsors.)","ko":"그들은 선수 계약을 다루고, 팀 간의 이적을 ( ), 후원사를 찾는다.","opts":["주선하고","거절하고","취소하고","비교하고"],"word":"arrange","r":{"a":"1) 주선하고","ev":"3번 문장","s":[[3,"They deal with player contracts, arrange transfers between teams, and find sponsors.","그들은 선수 계약을 다루고, 팀 간의 이적을 주선하며, 후원사를 찾는다."]],"w":"3번에서 에이전트가 하는 일 세 가지가 나열됨. arrange transfers는 팀 사이의 이적이 이루어지도록 준비하고 주선하는 것. 거절하거나 취소하면 선수를 돕는 일이 아님.","c":1},"h":"3a8e3264d9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Being a sports agent takes knowledge and effort.)","ko":"스포츠 에이전트가 되는 것은 지식과 ( )이 필요하다.","opts":["휴식","노력","행운","장비"],"word":"effort","r":{"a":"2) 노력","ev":"10번 문장","s":[[10,"Being a sports agent takes knowledge and effort.","스포츠 에이전트가 되는 것은 지식과 노력이 필요하다."]],"w":"10번은 에이전트가 되려면 knowledge(지식)와 함께 effort가 필요하다는 말. 11번의 But 앞에서 어려운 점을 말하는 부분이라, 힘을 들여 애쓰는 '노력'이 알맞음. 휴식이나 행운은 어려운 점이 아님.","c":2},"h":"54bca47ce7"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nBut for those who love sports, it can be an enjoyable job.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만 스포츠를 사랑하는 사람들에게는 즐거운 직업이 될 수 있다.","opts":["스포츠 에이전트로 일하는 것","스포츠 경기를 보러 가는 것","프로 선수가 되는 것","면허 시험 문제를 만드는 것"],"pron":"it","r":{"a":"1) 스포츠 에이전트로 일하는 것","ev":"10~11번 문장","s":[[10,"Being a sports agent takes knowledge and effort.","스포츠 에이전트가 되는 것은 지식과 노력이 필요하다."],[11,"But for those who love sports, it can be an enjoyable job.","하지만 스포츠를 사랑하는 사람들에게는 즐거운 직업이 될 수 있다."]],"w":"10번에서 스포츠 에이전트가 되는 것은 지식과 노력이 필요하다고 함. 11번의 it은 이 일, 즉 스포츠 에이전트로 일하는 것을 가리킴. 그래서 스포츠를 사랑하는 사람에게는 즐거운 직업이 될 수 있다는 뜻.","c":1,"k":"it = 스포츠 에이전트로 일하는 것"},"h":"eee86b1066"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"If you love sports, becoming a sports agent could be a great job.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"스포츠를 좋아한다면, 스포츠 에이전트가 되는 것은 훌륭한 직업이 될 수 있다.","opts":["스포츠를 좋아한다면 스포츠 에이전트가 되는 것은 훌륭한 직업이 될 수 있다.","스포츠를 좋아하면 스포츠 에이전트가 될 수 없다.","스포츠를 싫어하는 사람만 스포츠 에이전트가 될 수 있다.","스포츠 에이전트는 스포츠를 좋아하는 사람에게는 나쁜 직업이다."],"r":{"a":"1) 스포츠를 좋아한다면 스포츠 에이전트가 되는 것은 훌륭한 직업이 될 수 있다.","ev":"1번 문장","s":[[1,"If you love sports, becoming a sports agent could be a great job.","스포츠를 좋아한다면, 스포츠 에이전트가 되는 것은 훌륭한 직업이 될 수 있다."]],"w":"If you love sports는 \"스포츠를 좋아한다면\", could be a great job은 \"훌륭한 직업이 될 수 있다\"는 뜻. 그래서 1번.","c":1},"h":"3eec05b6b5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Agents must be professional athletes before they can work.","In some sports, like soccer, agents must pass an exam.","Soccer agents never need to take any test.","Only former soccer players can become sports agents."],"oko":["에이전트는 일하기 전에 프로 선수여야 한다.","축구와 같은 일부 스포츠에서는 에이전트가 시험에 합격해야 한다.","축구 에이전트는 어떤 시험도 볼 필요가 없다.","전직 축구 선수만 스포츠 에이전트가 될 수 있다."],"r":{"a":"2) In some sports, like soccer, agents must pass an exam. (축구와 같은 일부 스포츠에서는 에이전트가 시험에 합격해야 한다.)","ev":"8번 문장","s":[[8,"Also, in some sports, like soccer, agents must pass an exam.","또한 축구와 같은 일부 스포츠에서는 에이전트가 시험에 합격해야 한다."]],"w":"8번에 Also, in some sports, like soccer, agents must pass an exam이라고 나옴. ③은 시험에 합격해야 한다는 내용과 반대. ①, ④는 본문에 없는 내용이며, 6번에서 스포츠 경영, 경영학, 법학을 공부하면 좋다고 했을 뿐 선수여야 한다는 말은 없음.","c":2},"h":"e75126275b"},{"n":9,"t":"sum","q":"This lets players (A) only on (B) and games.","ko":"이것은 선수들이 (B)과(와) 경기에만 (A) 수 있게 해 준다.","opts":["(A) focus / (B) training","(A) focus / (B) shopping","(A) rest / (B) training","(A) rest / (B) shopping","(A) argue / (B) shopping"],"oko":["(A) 집중할 / (B) 훈련","(A) 집중할 / (B) 쇼핑","(A) 쉴 / (B) 훈련","(A) 쉴 / (B) 쇼핑","(A) 다툴 / (B) 쇼핑"],"r":{"a":"1) (A) focus / (B) training ((A) 집중할 / (B) 훈련)","ev":"5번 문장","s":[[5,"This lets players focus only on training and games.","이것은 선수들이 훈련과 경기에만 집중할 수 있게 해 준다."]],"w":"5번 문장에 This lets players focus only on training and games라고 나옴. 그래서 focus와 training.","c":1},"h":"f3f7a13099"},{"n":10,"t":"fill","q":"To become a sports agent, it is good to study sports management, business, or [A]. It is important to be good at [B] with people and making deals.","ko":"스포츠 에이전트가 되려면 스포츠 경영, 경영학, 또는 [A]을(를) 공부하는 것이 좋다. 사람들과 [B] 거래를 성사시키는 것을 잘하는 것이 중요하다.","bank":["law","talking","exam","license","agent","contract"],"bko":{"law":"법학","talking":"이야기하기","exam":"시험","license":"면허","agent":"에이전트","contract":"계약"},"r":{"a":"[A] law (법학), [B] talking (이야기하기)","ev":"6~7번 문장","s":[[6,"To become a sports agent, it is good to study sports management, business, or law.","스포츠 에이전트가 되려면, 스포츠 경영, 경영학, 또는 법학을 공부하는 것이 좋다."],[7,"It is important to be good at talking with people and making deals.","사람들과 이야기하고 거래를 성사시키는 것을 잘하는 것이 중요하다."]],"w":"6번 study sports management, business, or law, 7번 good at talking with people and making deals에서 가져옴. be good at 뒤에는 동명사 talking이 오고, exam, license, agent, contract는 관사 없이 쓰거나 이 자리에 넣으면 문법과 뜻이 맞지 않음.","c":null},"h":"7820457139"}]},{"u":10,"id":"b2-10-2","no":2,"ko":"팔이 없 ive up. (파라 양궁 선수들은 계속 노력하고 절대 포기하지 않는다.)","ev":"8번 문장","s":[[8,"In this sport, players keep trying and never give up.","이 스포츠에서 선수들은 계속 노력하고 절대 포기하지 않는다."]],"w":"8번에 In this sport, players keep trying and never give up이라고 나옴. ①은 절대 포기하지 않는다는 내용과 반대이고, ③, ④는 본문에 없는 내용임.","c":2},"h":"eef1ce1a3b"},{"n":9,"t":"sum","q":"Thanks to his skill, Matt Stutzman won (A) in big (B).","ko":"그의 기술 덕분에 맷 스터츠먼은 큰 (B)에서 (A)을(를) 땄다.","opts":["(A) medals / (B) competitions","(A) medals / (B) classrooms","(A) money / (B) competitions","(A) money / (B) classrooms","(A) friends / (B) classrooms"],"oko":["(A) 메달 / (B) 대회","(A) 메달 / (B) 교실","(A) 돈 / (B) 대회","(A) 돈 / (B) 교실","(A) 친구 / (B) 교실"],"r":{"a":"1) (A) medals / (B) competitions ((A) 메달 / (B) 대회)","ev":"11번 문장","s":[[11,"This skill helped him win medals in big competitions.","이 기술은 그가 큰 대회에서 메달을 따는 데 도움이 되었다."]],"w":"11번 문장에 This skill helped him win medals in big competitions라고 나옴. 그래서 medals와 competitions.","c":1},"h":"8925c1decc"},{"n":10,"t":"fill","q":"These tools [A] each archer shoot in a way that [B] their body.","ko":"이 도구들은 각 선수가 자신의 몸에 [B] 방식으로 쏠 수 있도록 [A].","bank":["help","fits","famous","goals","American","skill"],"bko":{"help":"돕다","fits":"맞다(fit의 3인칭 단수)","famous":"유명한","goals":"목표","American":"미국의","skill":"기술"},"r":{"a":"[A] help (돕다), [B] fits (맞다(fit의 3인칭 단수))","ev":"7번 문장","s":[[7,"These tools help each archer shoot in a way that fits their body.","이 도구들은 각 선수가 자신의 몸에 맞는 방식으로 쏠 수 있게 도와준다."]],"w":"7번 문장 These tools help each archer shoot in a way that fits their body에서 가져옴. help + 사람 + 동사원형은 \"~가 …하도록 돕다\", a way that fits는 \"~에 맞는 방식\". famous, goals, American, skill은 동사 자리에 들어갈 수 없음.","c":null},"h":"99c6cce5f8"}]},{"u":10,"id":"b2-10-3","no":3,"ko":"테니스 공이 인인지 아웃인지, 이제는 AI가 판정한다","items":[{"n":1,"t":"tf","q":"In the past, human referees made all the decisions in sports.","ko":"과거에는 사람 심판이 스포츠의 모든 판정을 내렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In the past, all decisions in sports were made by human referees, so their judgments weren’t always perfect.","과거에는 스포츠의 모든 판정을 사람 심판이 내렸기 때문에, 그들의 판단이 항상 완벽하지는 않았다."]],"w":"1번 문장에 all decisions in sports were made by human referees가 있음. were made by는 '~에 의해 내려졌다'.","c":"T"},"h":"1c4eb8e84d"},{"n":2,"t":"tf","q":"High-speed cameras follow the ball from only one angle.","ko":"고속 카메라는 오직 한 각도에서만 공을 따라간다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"High-speed cameras follow the ball from many angles.","고속 카메라가 여러 각도에서 공을 따라간다."]],"w":"5번 문장에 High-speed cameras follow the ball from many angles가 있음. many angles(여러 각도)라서 only one angle(한 각도)은 반대임.","c":"F"},"h":"1bafa5dca1"},{"n":3,"t":"tf","q":"Some complex decisions still need a referee’s experience.","ko":"일부 복잡한 판정에는 여전히 심판의 경험이 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Some complex decisions still need a referee’s experience and understanding of the game.","일부 복잡한 판정에는 여전히 심판의 경험과 경기에 대한 이해가 필요하다."]],"w":"10번 문장에 Some complex decisions still need a referee’s experience and understanding of the game이 있음. still은 지금도 여전히.","c":"T"},"h":"dd3af49b16"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (All decisions in sports were made by human referees, so their judgments weren’t always perfect.)","ko":"스포츠의 모든 판정은 사람 심판이 내렸기 때문에, 그들의 ( )이 항상 완벽하지는 않았다.","opts":["응원","규칙","판단, 판정","기록"],"word":"judgments","r":{"a":"3) 판단, 판정","ev":"1~2번 문장","s":[[1,"In the past, all decisions in sports were made by human referees, so their judgments weren’t always perfect.","과거에는 스포츠의 모든 판정을 사람 심판이 내렸기 때문에, 그들의 판단이 항상 완벽하지는 않았다."],[2,"Sometimes mistakes caused unfair results and made players and fans upset.","때때로 실수는 불공정한 결과를 낳았고 선수들과 팬들을 화나게 했다."]],"w":"1번에서 심판이 내린 decisions(결정) 뒤에 their judgments weren’t always perfect라고 함. 2번에서 그 때문에 실수와 불공정한 결과가 생겼으니 judgments는 심판의 판단·판정.","c":3},"h":"73477ec5cd"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This helps make sports more accurate and fair.)","ko":"이것은 스포츠를 더 ( ) 공정하게 만드는 데 도움이 된다.","opts":["정확한","빠른","비싼","어려운"],"word":"accurate","r":{"a":"1) 정확한","ev":"7~8번 문장","s":[[7,"The result appears on the screen in seconds, so the game can continue quickly.","결과는 몇 초 만에 화면에 나타나서, 경기는 빠르게 계속될 수 있다."],[8,"This helps make sports more accurate and fair.","이것은 스포츠를 더 정확하고 공정하게 만드는 데 도움이 된다."]],"w":"7번에서는 결과가 빨리 나온다고 했고, 8번에서는 그래서 더 accurate and fair하다고 함. 2번의 실수·불공정과 반대 방향이므로 accurate는 '정확한'. 빠른은 7번의 quickly와 헷갈린 오답.","c":1},"h":"47512e2c56"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nTo reduce this, sports now use AI technology.","ko":"밑줄 친 this이(가) 가리키는 것은?","sko":"이를 줄이기 위해, 스포츠는 이제 AI 기술을 사용한다.","opts":["AI 기술","심판의 실수로 불공정한 결과가 생겨 선수와 팬들이 화나는 문제","선수와 팬들의 응원","테니스 경기의 점수"],"r":{"a":"2) 심판의 실수로 불공정한 결과가 생겨 선수와 팬들이 화나는 문제","ev":"2~3번 문장","s":[[2,"Sometimes mistakes caused unfair results and made players and fans upset.","때때로 실수는 불공정한 결과를 낳았고 선수들과 팬들을 화나게 했다."],[3,"To reduce this, sports now use AI technology.","이를 줄이기 위해, 스포츠는 이제 AI 기술을 사용한다."]],"w":"3번 To reduce this에서 this는 앞 2번의 내용. 심판의 실수가 불공정한 결과를 낳아 선수와 팬을 화나게 하는 문제를 줄이려고 AI 기술을 쓴다는 흐름. AI 기술은 줄이는 수단이지 줄일 대상이 아님.","c":2},"h":"9094ac2e31"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The result appears on the screen in seconds, so the game can continue quickly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결과는 몇 초 만에 화면에 나타나서, 경기는 빠르게 계속될 수 있다.","opts":["결과가 화면에 나타날 때까지 경기가 오래 멈춰 있어야 한다.","결과가 몇 초 안에 나와서 경기가 일찍 끝난다.","결과는 화면이 아니라 심판에게만 전해진다.","결과가 몇 초 안에 화면에 나타나므로 경기가 빠르게 이어질 수 있다."],"r":{"a":"4) 결과가 몇 초 안에 화면에 나타나므로 경기가 빠르게 이어질 수 있다.","ev":"7번 문장","s":[[7,"The result appears on the screen in seconds, so the game can continue quickly.","결과는 몇 초 만에 화면에 나타나서, 경기는 빠르게 계속될 수 있다."]],"w":"7번의 The result appears on the screen in seconds, so the game can continue quickly는 결과가 화면에 몇 초 만에 나타나서 경기가 빠르게 계속된다는 뜻. 오래 멈춘다, 일찍 끝난다, 심판에게만 전해진다는 말은 없음.","c":4},"h":"788def5d28"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","opts":["Tennis uses AI on :10,"id":"b2-10-4","no":4,"ko":"우리는 왜 약한 팀을 응원할까?","items":[{"n":1,"t":"tf","q":"An underdog is a team or player that is not expected to win.","ko":"언더독은 이길 것으로 예상되지 않는 팀이나 선수이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Many people cheer for the underdog, the team or player that is not expected to win.","많은 사람들이 이길 것으로 예상되지 않는 팀이나 선수인 언더독을 응원한다."]],"w":"2번 문장에 the underdog, the team or player that is not expected to win이 있음. not expected to win은 '이길 것으로 예상되지 않는'.","c":"T"},"h":"ab3a655b4a"},{"n":2,"t":"tf","q":"Underdogs usually feel more pressure than other teams.","ko":"언더독은 보통 다른 팀보다 더 큰 부담을 느낀다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Underdogs usually feel less pressure, so they can play more freely.","언더독은 보통 부담을 덜 느껴서 더 자유롭게 경기할 수 있다."]],"w":"8번 문장에 Underdogs usually feel less pressure가 있음. less(더 적은)라서 more pressure(더 큰 부담)는 반대임.","c":"F"},"h":"89836bd404"},{"n":3,"t":"tf","q":"Many people think that cheering for underdogs is unnatural.","ko":"많은 사람들은 언더독을 응원하는 것이 부자연스럽다고 생각한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Cheering for underdogs is natural.","언더독을 응원하는 것은 자연스러운 일이다."]],"w":"4번 문장에 Cheering for underdogs is natural이 있음. natural(자연스러운)이라서 unnatural(부자연스러운)은 반대임.","c":"F"},"h":"7bb2a2371e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Underdogs usually feel less pressure, so they can play more freely.)","ko":"언더독은 보통 ( )을 덜 느껴서 더 자유롭게 경기할 수 있다.","opts":["속도","부담","점수","응원"],"word":"pressure","r":{"a":"2) 부담","ev":"8번 문장","s":[[8,"Underdogs usually feel less pressure, so they can play more freely.","언더독은 보통 부담을 덜 느껴서 더 자유롭게 경기할 수 있다."]],"w":"8번의 less pressure, so they can play more freely에서 부담이 적어서 자유롭게 경기한다는 원인과 결과가 이어짐. pressure는 마음을 누르는 '부담, 압박'.","c":2},"h":"188ab8ac37"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Because others do not expect much from them, they also try harder to prove themselves.)","ko":"다른 사람들이 그들에게 큰 기대를 하지 않기 때문에, 그들은 스스로를 ( ) 더 열심히 노력하기도 한다.","opts":["숨   else if(it.opts){var g=el("div","opts");it.opts.forEach(function(t,i){var b=el("button","o");b.innerHTML="<i>"+(i+1)+"</i><span></span>";b.lastChild.textContent=t;b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===i+1));b.onclick=function(){setAns(p,it,i+1);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.t==="fill"){q.appendChild(el("p","bank","보기: "+it.bank.join(" / ")))}
  if(fin){var pk=(ans[p.id]||{})[it.n];if(it.t==="tf"){Array.prototype.forEach.call(q.querySelector(".tf").children,function(b){var v=b.textContent;if(v===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(v===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}else if(it.opts){Array.prototype.forEach.call(q.querySelector(".opts").children,function(b,i){if(i+1===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(i+1===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}}
  if(fin&&it.r){var rv=el("div","rv");
   var z1=el("div","zone z-tr");z1.appendChild(el("h4",null,"한글 해석"));
   function ln(l,t){var p2=el("p","ln");p2.appendChild(el("b",null,l));p2.appendChild(document.createTextNode(t));z1.appendChild(p2)}
   if(it.ko)ln("문제",it.ko);if(it.sko)ln("문장",it.sko);
   if(it.oko){var ol=el("ol");it.oko.forEach(function(x){ol.appendChild(el("li",null,x))});var lb=el("p","ln");lb.appendChild(el("b",null,"선택지"));z1.appendChild(lb);z1.appendChild(ol)}
   if(it.bko){var bl=el("p","ln");bl.appendChild(el("b",null,"보기 단어"));bl.appendChild(document.createTextNode(it.bank.map(function(w){return w+" "+(it.bko[w]||"")}).join(" / ")));z1.appendChild(bl)}
   if(z1.children.length>1)rv.appendChild(z1);
   var z2=el("div","zone z-an");z2.appendChild(el("h4",null,"정답 · 해설"));z2.appendChild(el("p","ra","정답: "+it.r.a));z2.appendChild(el("div","rl","교재 근거 ("+it.r.ev+")"));it.r.s.forEach(function(x){var d=el("div","rs");var e=el("span","en");e.appendChild(el("span","sn",x[0]+"번"));e.appendChild(document.createTextNode(x[1]));d.appendChild(e);d.appendChild(el("span","ko",x[2]));z2.appendChild(d)});z2.appendChild(el("div","rl","정리"));z2.appendChild(el("p","rw",it.r.w));rv.appendChild(z2);if(okm){rv.style.display="none";var tg=el("button","tgl","해설 보기");tg.onclick=function(){var s=rv.style.display==="none";rv.style.display=s?"block":"none";tg.textContent=s?"해설 닫기":"해설 보기"};q.appendChild(tg)}q.appendChild(rv)}
  box.appendChild(q)});
 v.appendChild(box);

function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
function showScore(p){var sb=document.getElementById("sbar");sb.innerHTML="";var d=done[p.id];var c=el("div","score");c.appendChild(el("span",null,readName(p)+" 점수"));c.appendChild(el("b",null,(d.s*10)+"점"));c.appendChild(el("span",null,d.s+" / 10 문항"));sb.style.display="block";sb.appendChild(c);sb.appendChild(navBar())}
boot();

  var t=document.createElement("div");t.className="top";
  t.innerHTML='<span class="tk">EXIT TEST</span><h1></h1><p class="sub">Reading별 10문항</p>';t.querySelector("h1").textContent=document.title.replace(/ Exit Test$/,"");v.appendChild(t);
  var last=null;
  P.forEach(function(p){
    if(p.u!==last){last=p.u;var g=document.createElement("div");g.className="grp";g.textContent=secName(p.u);v.appendChild(g)}
    var ok=ready(p.id);
    var r=document.createElement(ok?"a":"div");r.className="pk"+(ok?"":" lk");if(ok)r.href="?r="+encodeURIComponent(p.id);
    var l=document.createElement("div");var b=document.createElement("b");b.textContent=readName(p);var s=document.createElement("span");s.className="t";s.textContent=p.ko;l.appendChild(b);l.appendChild(s);r.appendChild(l);
    var st=document.createElement("span");st.className="st";st.textContent=ok?"응시 가능":"잠김";r.appendChild(st);v.appendChild(r)});
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("홈으로","../",true));v.appendChild(n)}
function gate(p){var v=document.getElementById("view");v.innerHTML="";v.appendChild(testHead(p));
  var g=document.createElement("div");g.className="gate";g.innerHTML="<b>아직 응시할 수 없어요</b><p>지문 읽기와 문제 선지를 모두 마친 뒤에 열려요.</p>";v.appendChild(g);
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("이 Reading으로 돌아가기","../?r="+encodeURIComponent(p.id),true));n.appendChild(lnk("Exit test 목록","./"));v.appendChild(n)}
function boot(){var m=/[?&]r=([^&]+)/.exec(location.search);
  if(m){var id=decodeURIComponent(m[1]);var p=P.filter(function(x){return x.id===id})[0];
    if(p){cur=id;if(!ready(id)){gate(p);return}view();return}}
  picker()}
