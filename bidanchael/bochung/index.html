<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>비단챌 보충</title>
<style>
:root{--bg:#f1efe9;--panel:#fff;--ink:#1f1d1a;--mute:#5d584f;--soft:#8a847a;--line:#e0dbd0;--accent:#2f4858;
--V:#ffb3ae;--S:#fff08a;--OC:#a9e6a4;--MA:#d5bbff;--MB:#ffcf8f;--CJ:#dcdcdc;--font:'Noto Sans KR',system-ui,-apple-system,'Apple SD Gothic Neo','Malgun Gothic',sans-serif}
*{box-sizing:border-box}html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.55;padding:18px max(16px,env(safe-area-inset-right)) 60px max(16px,env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer}
.shell{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
h1{font-size:26px;font-weight:900;margin:0}h2{font-size:15px;font-weight:800;margin:6px 0 0;color:var(--mute)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.big{background:var(--panel);border:0;border-radius:14px;padding:18px 14px;text-align:left;font-weight:800;font-size:17px;border-left:6px solid var(--c,#888)}
.big small{display:block;font-weight:500;font-size:12px;color:var(--soft);margin-top:2px}
.wide{grid-column:1/-1}
.row{display:flex;gap:10px;align-items:flex-start;background:var(--panel);border:0;border-radius:12px;padding:12px 14px;text-align:left;width:100%}
.row .n{font-weight:800;color:var(--soft);font-variant-numeric:tabular-nums;min-width:38px}
.row .t{flex:1;font-size:15.5px}
.card{background:var(--panel);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.sent{font-size:21px;line-height:2.1;font-weight:600;overflow-wrap:anywhere}
.ck{padding:2px 3px;border-radius:4px;transition:background .15s}
.ck.sh-V{background:var(--V)}.ck.sh-S{background:var(--S)}.ck.sh-OC{background:var(--OC)}.ck.sh-MA{background:var(--MA)}.ck.sh-MB{background:var(--MB)}.ck.sh-CJ{background:var(--CJ)}
.steps{display:flex;flex-wrap:wrap;gap:8px}
.st{border:2px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:700;font-size:14px;display:inline-flex;align-items:center;gap:7px}
.st i{width:12px;height:12px;border-radius:3px;display:inline-block;background:var(--c)}
.st.on{border-color:var(--accent);background:#eef2f5}
.pane{background:#faf8f3;border-radius:12px;padding:12px 14px;font-size:15px;display:none;flex-direction:column;gap:6px}
.pane.on{display:flex}
.pane .it{display:flex;gap:8px;align-items:baseline;flex-wrap:wrap}
.tag{font-size:12px;font-weight:800;border-radius:6px;padding:2px 7px;color:#2a2a2a}
.sub{margin-left:14px;border-left:3px solid var(--line);padding-left:10px;display:flex;flex-direction:column;gap:4px}
.w{display:grid;grid-template-columns:auto 52px 1fr;gap:4px 10px;align-items:baseline}
.w .en{font-weight:800}.w .pos{font-size:12px;color:var(--soft)}.w .note{grid-column:2/-1;font-size:13px;color:var(--mute);margin-bottom:4px}
.ghost{border:2px solid var(--line);background:#fff;border-radius:999px;padding:9px 16px;font-weight:700;font-size:14px}
.ghost.on{border-color:var(--accent);background:#eef2f5}
.box{background:#f4efe3;border-radius:12px;padding:12px 14px;font-size:15px;display:none}
.box.on{display:block}.box .bs{font-weight:800;margin-bottom:4px}
.nav{display:flex;gap:10px}.nav button{flex:1;border:0;border-radius:999px;padding:13px;font-weight:800;background:var(--accent);color:#fff;font-size:15px}
.nav button[disabled]{opacity:.35}
.back{border:0;background:var(--panel);border-radius:999px;padding:14px;font-weight:800;font-size:15px;width:100%}
.ko{color:var(--mute)}
.meta{font-size:12px;color:var(--soft)}
</style>
</head>

<script>
const DATA={"sets": [{"id": "gibon", "label": "기본", "group": "book", "color": "#81cc46", "sub": "", "items": [{"no": "0001", "en": "The students like history class.", "ko": "학생들은 역사 수업을 좋아한다.", "pattern": "3형식", "chunks": [{"t": "The students", "role": "S"}, {"t": "like", "role": "V"}, {"t": "history class", "role": "O"}], "words": [{"w": "The", "pos": "관사", "mean": "그 (정해진 대상 앞에 붙임)"}, {"w": "students", "pos": "명사", "mean": "학생", "note": "명사 student의 복수형 (여러 명이라 -s)"}, {"w": "like", "pos": "동사", "mean": "좋아하다"}, {"w": "history", "pos": "명사", "mean": "역사"}, {"w": "class", "pos": "명사", "mean": "수업"}], "line": "뼈대는 The students + like + history class"}, {"no": "0002", "en": "Do you have time to help?", "ko": "도와줄 시간 있어요?", "pattern": "3형식(의문문)", "chunks": [{"t": "Do", "role": "V"}, {"t": "you", "role": "S"}, {"t": "have", "role": "V"}, {"t": "time", "role": "O"}, {"t": "to help", "role": "M", "kind": "to부정사(형용사적 용법)", "to": "time"}], "words": [{"w": "Do", "pos": "조동사", "mean": "(의문문을 만드는 말, 해석 안 함)"}, {"w": "you", "pos": "대명사", "mean": "너, 당신"}, {"w": "have", "pos": "동사", "mean": "가지다"}, {"w": "time", "pos": "명사", "mean": "시간"}, {"w": "to", "pos": "to(부정사)", "mean": "~할"}, {"w": "help", "pos": "동사", "mean": "돕다"}], "line": "의문문은 Do + 주어 + 동사원형으로 뼈대 확인, time을 to help가 꾸밈", "memo": {"basis": "기준: 의문문의 Do는 have와 함께 V로 묶어 표시, to help는 time을 꾸미는 형용사적 용법", "text": "시간을 '도울 (시간)'으로 보면 형용사적 용법. '돕기 위해 시간을 가지다'로 보면 부사적 용법으로도 읽히나, time 바로 뒤라 형용사적 용법으로 확정."}}, {"no": "0003", "en": "Look at that man on the bus.", "ko": "저 버스에 탄 남자를 보세요.", "pattern": "3형식(명령문)", "chunks": [{"t": "Look at", "role": "V"}, {"t": "that man", "role": "O"}, {"t": "on the bus", "role": "M", "kind": "형용사구", "to": "man"}], "words": [{"w": "Look", "pos": "동사", "mean": "(~을) 보다"}, {"w": "at", "pos": "전치사", "mean": "(Look at의 일부)"}, {"w": "that", "pos": "형용사", "mean": "저"}, {"w": "man", "pos": "명사", "mean": "남자"}, {"w": "on", "pos": "전치사", "mean": "~에 (타고 있는)"}, {"w": "the", "pos": "관사", "mean": "그"}, {"w": "bus", "pos": "명사", "mean": "버스"}], "line": "명령문은 주어(You) 생략, Look at + that man, on the bus는 man 수식", "memo": {"basis": "기준: look at은 구동사로 보아 V 한 덩어리, 목적어를 취하는 3형식", "text": "on the bus는 바로 앞 man을 꾸미는 형용사구(버스에 탄 남자)로 처리. 주어 You는 생략."}}, {"no": "0004", "en": "Please put the bag over there.", "ko": "저기에 가방을 놓아 주세요.", "pattern": "3형식(명령문)", "chunks": [{"t": "Please", "role": "M", "kind": "부사", "to": "put"}, {"t": "put", "role": "V"}, {"t": "the bag", "role": "O"}, {"t": "over there", "role": "M", "kind": "부사구", "to": "put"}], "words": [{"w": "Please", "pos": "부사", "mean": "제발, 부디(부탁하는 말)"}, {"w": "put", "pos": "동사", "mean": "놓다, 두다"}, {"w": "the", "pos": "관사", "mean": "그"}, {"w": "bag", "pos": "명사", "mean": "가방"}, {"w": "over", "pos": "부사", "mean": "저기에"}, {"w": "there", "pos": "부사", "mean": "(over there의 일부)"}], "line": "명령문 뼈대는 put + the bag, 놓을 장소 over there는 수식어", "memo": {"basis": "기준: 거의 필수에 가까운 부사구는 수식어로 처리", "text": "put은 놓을 장소가 거의 꼭 필요하지만, 엄밀한 기준대로 over there는 수식어(M)로 표시. 주어 You는 생략."}}, {"no": "0005", "en": "Do you see a house?", "ko": "집이 보이니?", "pattern": "3형식(의문문)", "chunks": [{"t": "Do", "role": "V"}, {"t": "you", "role": "S"}, {"t": "see", "role": "V"}, {"t": "a house", "role": "O"}], "words": [{"w": "Do", "pos": "조동사", "mean": "(의문문을 만드는 말, 해석 안 함)"}, {"w": "you", "pos": "대명사", "mean": "너, 당신"}, {"w": "see", "pos": "동사", "mean": "보다"}, {"w": "a", "pos": "관사", "mean": "하나의, 어떤"}, {"w": "house", "pos": "명사", "mean": "집"}], "line": "의문문도 뼈대는 you + see + a house"}, {"no": "0006", "en": "My dad let me go to the party.", "ko": "아빠는 내가 파티에 가게 해 주셨다.", "pattern": "5형식", "chunks": [{"t": "My dad", "role": "S"}, {"t": "let", "role": "V"}, {"t": "me", "role": "O"}, {"t": "go", "role": "OC"}, {"t": "to the party", "role": "M", "kind": "부사구", "to": "go"}], "words": [{"w": "My", "pos": "대명사", "mean": "나의", "note": "I의 소유격 (뒤 명사가 '나의 것'임을 나타냄)"}, {"w": "dad", "pos": "명사", "mean": "아빠"}, {"w": "let", "pos": "동사", "mean": "허락하다, ~하게 하다", "note": "동사 let의 과거형 (let-let-le r", "pos": "대명사", "mean": "그들의", "note": "대명사 they의 소유격 (명사 앞에서 ‘그들의’)"}, {"w": "heart", "pos": "명사", "mean": "심장"}, {"w": "stops", "pos": "동사", "mean": "멈추다", "note": "동사 stop의 3인칭 단수형 (주어 their heart가 3인칭 단수라 -s)"}, {"w": "beating", "pos": "동사", "mean": "뛰다", "note": "동명사 (beat의 -ing형, stops의 목적어 역할)"}], "line": "and로 이어진 두 절, 뼈대는 They + stop + breathing / their heart + stops + beating", "memo": {"basis": "기준: stop + -ing는 ‘~하는 것을 멈추다’는 뜻의 동명사 목적어로 처리", "text": "stop to V(~하기 위해 멈추다)와 구별되며, 여기서는 숨쉬기·뛰기를 멈춘다는 뜻의 동명사"}}, {"no": "35", "en": "But don’t worry.", "ko": "그러나 걱정하지 마세요.", "pattern": "1형식(부정 명령문)", "chunks": [{"t": "But", "role": "M", "kind": "접속사", "to": "절 연결"}, {"t": "don’t worry", "role": "V", "kind": "", "to": ""}], "words": [{"w": "But", "pos": "접속사", "mean": "그러나"}, {"w": "don’t", "pos": "조동사", "mean": "~하지 않다", "note": "do not의 줄임말 (부정 명령문)"}, {"w": "worry", "pos": "동사", "mean": "걱정하다"}], "line": "명령문이라 주어 You 생략, 뼈대는 don’t + worry"}, {"no": "36", "en": "When spring comes, they come back to life.", "ko": "봄이 오면, 그들은 다시 살아납니다.", "pattern": "1형식", "chunks": [{"t": "When spring comes,", "role": "M", "kind": "부사절", "to": "come back", "sub": [{"t": "When", "role": "M", "kind": "접속사", "to": "spring comes"}, {"t": "spring", "role": "S", "kind": "", "to": ""}, {"t": "comes", "role": "V", "kind": "", "to": ""}]}, {"t": "they", "role": "S", "kind": "", "to": ""}, {"t": "come back", "role": "V", "kind": "", "to": ""}, {"t": "to life", "role": "M", "kind": "부사구", "to": "come back"}], "words": [{"w": "When", "pos": "접속사", "mean": "~할 때"}, {"w": "spring", "pos": "명사", "mean": "봄"}, {"w": "comes", "pos": "동사", "mean": "오다", "note": "동사 come의 3인칭 단수형 (주어 spring이 3인칭 단수라 -s)"}, {"w": "they", "pos": "대명사", "mean": "그들"}, {"w": "come", "pos": "동사", "mean": "되살아나다 (come back to life)"}, {"w": "back", "pos": "부사", "mean": "(come back to life의 일부)"}, {"w": "to", "pos": "전치사", "mean": "(come back to life의 일부)"}, {"w": "life", "pos": "명사", "mean": "(come back to life의 일부)"}], "line": "when절은 수식어, 뼈대는 they + come back", "memo": {"basis": "기준: 거의 필수에 가까운 부사구는 수식어로 처리", "text": "come back to life의 to life는 뜻을 완성하지만 엄밀히 수식어로 처리"}}, {"no": "37", "en": "Nature is so amazing.", "ko": "자연은 정말 경이로워요.", "pattern": "2형식", "chunks": [{"t": "Nature", "role": "S", "kind": "", "to": ""}, {"t": "is", "role": "V", "kind": "", "to": ""}, {"t": "so amazing", "role": "C", "kind": "", "to": ""}], "words": [{"w": "Nature", "pos": "명사", "mean": "자연"}, {"w": "is", "pos": "동사", "mean": "~이다", "note": "동사 be의 3인칭 단수 현재형 (주어가 단수라 is)"}, {"w": "so", "pos": "부사", "mean": "매우, 너무"}, {"w": "amazing", "pos": "형용사", "mean": "놀라운", "note": "동사 amaze의 -ing형에서 나온 형용사 (‘놀라게 하는’)"}], "line": "뼈대는 Nature + is + so amazing"}]}]};
const ROLEMAP={V:'V',S:'S',O:'OC',IO:'OC',DO:'OC',C:'OC',OC:'OC'};
const STEPS=[{k:'V',n:'동사',c:'var(--V)'},{k:'S',n:'주어',c:'var(--S)'},{k:'OC',n:'보어 목적어',c:'var(--OC)'},{k:'M',n:'수식어',c:'var(--MB)'},{k:'W',n:'품사 뜻',c:'#bbb'}];
const ROLENAME={S:'주어',V:'동사',O:'목적어',IO:'간접목적어',DO:'직접목적어',C:'보어',OC:'목적격보어',M:'수식어'};
const app=document.getElementById('app');
let cur=null,idx=0;
function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function en(s){return '<span lang="en" translate="no">'+esc(s)+'</span>'}
function mcls(c){return /형용사/.test(c.kind||'')?'MA':'MB'}
function key(c){if(c.role==='M')return c.kind==='접속사'?'CJ':mcls(c);return ROLEMAP[c.role]}
function home(){
  cur=null;
  const bc=DATA.sets.filter(s=>s.group==='book'),tx=DATA.sets.filter(s=>s.group==='text');
  app.innerHTML='<h1>보충</h1><h2>비단챌</h2><div class="grid">'+bc.map(s=>'<button class="big" style="--c:'+s.color+'" data-id="'+s.id+'">'+esc(s.label)+'<small>'+s.items.length+'문장</small></button>').join('')+'</div><h2>교과서</h2><div class="grid">'+tx.map(s=>'<button class="big wide" style="--c:'+s.color+'" data-id="'+s.id+'">'+esc(s.label)+'<small>'+esc(s.sub)+' · '+s.items.length+'문장</small></button>').join('')+'</div>';
  app.querySelectorAll('.big').forEach(b=>b.onclick=()=>list(b.dataset.id));
  window.scrollTo(0,0);
}
function list(id){
  cur=DATA.sets.find(s=>s.id===id);
  app.innerHTML='<h1>'+esc(cur.label)+'</h1><div class="stack" style="display:flex;flex-direction:column;gap:8px">'+cur.items.map((it,i)=>'<button class="row" data-i="'+i+'"><span class="n">'+esc(it.no)+'</span><span class="t">'+en(it.en)+'</span></button>').join('')+'</div><button class="back" id="bk">처음으로</button>';
  app.querySelectorAll('.row').forEach(b=>b.onclick=()=>show(+b.dataset.i));
  document.getElementById('bk').onclick=home;window.scrollTo(0,0);
}
function chunkHTML(chs){
  let out='';
  chs.forEach((c,i)=>{
    const sp=(i>0&&!/^['’.,?!;:]/.test(c.t))?' ':'';
    out+=sp+'<span class="ck" data-k="'+key(c)+'">'+esc(c.t)+'</span>';
  });
  return out;
}
function subHTML(chs){
  return chs.map(c=>'<div class="it"><span class="tag" style="background:'+(c.role==='M'?'var(--MB)':c.role==='V'?'var(--V)':c.role==='S'?'var(--S)':'var(--OC)')+'">'+ROLENAME[c.role]+'</span>'+en(c.t)+(c.role==='M'?'<span class="meta">'+esc(c.kind)+' → '+en(c.to)+'</span>':c.kind?'<span class="meta">'+esc(c.kind)+'</span>':'')+'</div>'+(c.sub?'<div class="sub">'+subHTML(c.sub)+'</div>':'')).join('');
}
function pane(it,k){
  const flat=it.chunks;
  if(k==='W')return '<div class="w">'+it.words.map(w=>'<span class="en" lang="en" translate="no">'+esc(w.w)+'</span><span class="pos">'+esc(w.pos)+'</span><span>'+esc(w.mean)+'</span>'+(w.note?'<span class="note">'+esc(w.note)+'</span>':'')).join('')+'</div>';
  const pick=c=>k==='M'?c.role==='M':(k==='OC'?(ROLEMAP[c.role]==='OC'):c.role===k);
  const arr=flat.filter(pick);
  if(!arr.length)return '<div class="meta">해당 없음</div>';
  return arr.map(c=>'<div class="it"><span class="tag" style="background:'+(c.role==='M'?(mcls(c)==='MA'?'var(--MA)':'var(--MB)'):'var(--'+key(c)+')')+'">'+ROLENAME[c.role]+'</span>'+en(c.t)+(c.role==='M'?'<span class="meta">'+esc(c.kind)+' → '+en(c.to)+'</span>':c.kind?'<span class="meta">'+esc(c.kind)+'</span>':'')+'</div>'+(c.sub?'<div class="sub">'+subHTML(c.sub)+'</div>':'')).join('');
}
function show(i){
  idx=i;const it=cur.items[i];
  const sentEn=it.en.match(/[.?!]+["”]?$/);
  app.innerHTML=
  '<div class="meta">'+esc(cur.label)+' · '+esc(it.no)+'</div>'+
  '<div class="card"><div class="sent" lang="en" translate="no" id="sent">'+chunkHTML(it.chunks)+esc(sentEn?sentEn[0]:'')+'</div>'+
  '<div class="steps">'+STEPS.map(s=>'<button class="st" data-k="'+s.k+'" style="--c:'+s.c+'"><i></i>'+s.n+'</button>').join('')+'</div>'+
  STEPS.map(s=>'<div class="pane" id="p'+s.k+'"></div>').join('')+
  '<div class="steps"><button class="ghost" id="bko">해석</button><button class="ghost" id="bln">한 줄 정리</button>'+(it.memo?'<button class="ghost" id="bmm">memo</button>':'')+'</div>'+
  '<div class="box" id="xko"><span class="ko">'+esc(it.ko)+'</span><div class="meta" style="margin-top:6px">'+esc(it.pattern)+'</div></div>'+
  '<div class="box" id="xln">'+esc(it.line)+'</div>'+
  (it.memo?'<div class="box" id="xmm"><div class="bs">'+esc(it.memo.basis)+'</div>'+esc(it.memo.text||'')+'</div>':'')+
  '</div>'+
  '<div class="nav"><button id="pv"'+(i===0?' disabled':'')+'>이전 문장</button><button id="nx"'+(i===cur.items.length-1?' disabled':'')+'>다음 문장</button></div>'+
  '<button class="back" id="bk">목록으로</button>';
  const sent=document.getElementById('sent');
  app.querySelectorAll('.st').forEach(b=>b.onclick=()=>{
    const k=b.dataset.k,p=document.getElementById('p'+k),on=!b.classList.contains('on');
    b.classList.toggle('on',on);
    if(on&&!p.innerHTML)p.innerHTML=pane(it,k);
    p.classList.toggle('on',on);
    if(k!=='W')sent.querySelectorAll('.ck').forEach(sp=>{
      const kk=sp.dataset.k;
      if((k==='M'&&(kk==='MA'||kk==='MB'||kk==='CJ'))||kk===k){sp.classList.toggle('sh-'+kk,on)}
    });
  });
  [['bko','xko'],['bln','xln'],['bmm','xmm']].forEach(([a,b])=>{const A=document.getElementById(a),B=document.getElementById(b);if(A)A.onclick=()=>{const on=!A.classList.contains('on');A.classList.toggle('on',on);B.classList.toggle('on',on)}});
  document.getElementById('pv').onclick=()=>show(i-1);
  document.getElementById('nx').onclick=()=>show(i+1);
  document.getElementById('bk').onclick=()=>list(cur.id);
  window.scrollTo(0,0);
}
home();
</script>
