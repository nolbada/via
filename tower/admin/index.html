<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<title>관제탑 등록</title>
<style>
  :root{--ink:#1f2328;--sub:#667085;--line:#e3e5e8;--bg:#f5f4f0;--pri:#2b5cab;--warn:#b4402c}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);margin:0;line-height:1.5}
  .wrap{max-width:560px;margin:0 auto;padding:16px 14px 80px}
  h1{font-size:19px;margin:6px 0 12px}
  button{font:inherit;border-radius:8px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:9px 14px;cursor:pointer}
  button.p{background:var(--pri);border-color:var(--pri);color:#fff}
  button.w{color:var(--warn);border-color:#e8c9c2}
  button:disabled{opacity:.5}
  #gate{max-width:420px;margin:60px auto;padding:24px;background:#fff;border:1px solid var(--line);border-radius:12px;text-align:center}
  #gerr,#msg{color:var(--sub);min-height:22px;margin:8px 2px;font-size:14px}
  #msg.no,#gerr{color:var(--warn)}
  .grp{font-size:13px;color:var(--sub);margin:14px 2px 6px}
  .row{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
  .row .n{font-weight:600}
  .row .s{margin-left:auto;display:flex;gap:8px;align-items:center;font-size:13px;color:var(--sub)}
  .row.out .n{color:var(--sub);text-decoration:line-through}
  .bar{display:flex;gap:8px;margin-bottom:8px}
</style>
</head>
<body>
<div id="gate" style="display:none"><h1>관제탑 등록</h1><button class="p" id="glog" style="width:100%">구글로 로그인</button><div id="gerr"></div></div>
<div class="wrap" id="app" style="display:none">
  <h1>관제탑 등록</h1>
  <div class="bar"><button class="p" id="reg">빠진 학생 등록</button><button id="reload">새로 읽기</button></div>
  <div id="msg"></div>
  <div id="list"></div>
</div>
<script>
/* tower-admin 261121a — 선생님 전용. 학생 문서 등록(이미 있으면 건드리지 않음)·재원/퇴원 전환. 모든 변경은 tower_log 에 새로 쌓인다. */
(function(){
var ROSTER={"M초6A":["윤여름","조서인"],"M초6C":["김동권","김은찬","김이한","민윤찬","박윤수","신도건","이상윤"],"T초6B":["김지율","김태율","노지훈","이재빈","연휘건"],"T초6C":["김예슬","노예린","류이안","이연서","이재인","조은유","연다혜"],"M중1B":["김시원","김윤슬","류아인","박대환","이지성","임건호","정해윤"],"T중1A":["김태건","장도율","조이준","최민준","홍윤제"]};
var ORDER=["M초6A","M초6C","T초6B","T초6C","M중1B","T중1A"];
var DB="projects/h-roadmap/databases/(default)",BASE="https://firestore.googleapis.com/v1/"+DB+"/documents";
var AUTH=null,EMAIL="",DOCS=[],BUSY=false,ARM="";
function $(i){return document.getElementById(i);}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
function say(t,no){$("msg").textContent=t||"";$("msg").className=no?"no":"";}
function norm(s){return String(s||"").normalize("NFC").replace(/\s+/g,"");}
function docId(name){
  return crypto.subtle.digest("SHA-256",new TextEncoder().encode("tower|"+norm(name))).then(function(h){
    return Array.prototype.map.call(new Uint8Array(h),function(x){return ("0"+x.toString(16)).slice(-2);}).join("").slice(0,20);
  });
}
function S(v){return {stringValue:String(v)};}
function api(path,opt){return AUTH.token().then(function(t){opt=opt||{};opt.headers={"Authorization":"Bearer "+t,"Content-Type":"application/json"};return fetch(BASE+path,opt);});}
function logW(act,name,cls){
  var t=Date.now(),id=t+"_"+Math.random().toString(36).slice(2,8);
  return {update:{name:DB+"/documents/tower_log/"+id,fields:{t:{integerValue:String(t)},who:S(EMAIL),act:S(act),name:S(name),cls:S(cls)}},currentDocument:{exists:false}};
}
function load(){
  DOCS=[];
  function page(tok){
    return api("/tower_s?pageSize=100"+(tok?"&pageToken="+encodeURIComponent(tok):"")).then(function(r){
      if(r.status===401||r.status===403)throw {auth:1};
      if(!r.ok)throw new Error("읽기 실패 "+r.status);
      return r.json().then(function(j){
        (j.documents||[]).forEach(function(d){var f=d.fields||{};DOCS.push({id:d.name.split("/").pop(),ut:d.updateTime,name:(f.name||{}).stringValue,cls:(f.cls||{}).stringValue,status:(f.status||{}).stringValue});});
        if(j.nextPageToken)return page(j.nextPageToken);
      });
    });
  }
  return page("");
}
function render(){
  var by={};DOCS.forEach(function(d){(by[d.cls]=by[d.cls]||[]).push(d);});
  var h="";
  ORDER.concat(Object.keys(by).filter(function(c){return ORDER.indexOf(c)<0;})).forEach(function(c){
    var a=by[c];if(!a)return;
    var n=a.filter(function(d){return d.status==="active";}).length;
    h+='<div class="grp">'+esc(c)+" · 재원 "+n+"명</div>";
    a.sort(function(x,y){return x.name<y.name?-1:1;}).forEach(function(d){
      var out=d.status!=="active";
      h+='<div class="row'+(out?" out":"")+'"><span class="n">'+esc(d.name)+'</span><span class="s">'+(out?"퇴원":"재원")+'<button class="'+(out?"":"w")+'" data-id="'+d.id+'">'+(out?"다시 재원":"퇴원 처리")+"</button></span></div>";
    });
  });
  $("list").innerHTML=h||'<div class="grp">등록된 학생이 없습니다</div>';
  var missing=allNames().length-DOCS.filter(function(d){return allNames().some(function(x){return x[1]===d.name;});}).length;
  $("reg").textContent=missing>0?"빠진 학생 등록 ("+missing+"명)":"빠진 학생 없음";
  $("reg").disabled=missing<=0||BUSY;
}
function allNames(){var o=[];ORDER.forEach(function(c){ROSTER[c].forEach(function(n){o.push([c,n]);});});return o;}
function fail(e){BUSY=false;if(e&&e.auth){authFail();return;}say(String(e&&e.message||e),1);render();}
function reload(msg){return load().then(function(){render();say(msg||"");},fail);}
$("reg").onclick=function(){
  if(BUSY)return;BUSY=true;say("등록 중...");
  load().then(function(){
    var have={};DOCS.forEach(function(d){have[d.name]=1;});
    var todo=allNames().filter(function(x){return !have[x[1]];});
    if(!todo.length){BUSY=false;render();say("빠진 학생이 없습니다.");return;}
    return Promise.all(todo.map(function(x){return docId(x[1]);})).then(function(ids){
      var w=[];
      todo.forEach(function(x,i){
        w.push({update:{name:DB+"/documents/tower_s/"+ids[i],fields:{
          name:S(x[1]),cls:S(x[0]),status:S("active"),season:S("비내신"),
          pos:{mapValue:{fields:{}}},pend:{arrayValue:{values:[]}},pin:{nullValue:null},v:{integerValue:"1"},created:{integerValue:String(Date.now())}
        }},currentDocument:{exists:false}});
        w.push(logW("register",x[1],x[0]));
      });
      return api(":commit",{method:"POST",body:JSON.stringify({writes:w})}).then(function(r){
        if(r.status===401||r.status===403)throw {auth:1};
        if(!r.ok)throw new Error("등록 실패 "+r.status+" (이미 있는 학생이 있으면 새로 읽고 다시 해 주세요)");
        BUSY=false;return reload(todo.length+"명을 등록했습니다.");
      });
    });
  }).catch(fail);
};
$("reload").onclick=function(){say("읽는 중...");reload();};
$("list").onclick=function(ev){
  var b=ev.target.closest("[data-id]");if(!b||BUSY)return;
  var d=DOCS.filter(function(x){return x.id===b.getAttribute("data-id");})[0];if(!d)return;
  var to=d.status==="active"?"left":"active";
  if(to==="left"&&ARM!==d.id){ARM=d.id;say(d.name+" 학생을 퇴원 처리하려면 한 번 더 눌러 주세요. 기록은 지워지지 않고 입장만 막힙니다.");setTimeout(function(){ARM="";},4000);return;}
  ARM="";BUSY=true;say("저장 중...");
  var w=[{update:{name:DB+"/documents/tower_s/"+d.id,fields:{status:S(to)}},updateMask:{fieldPaths:["status"]},currentDocument:{updateTime:d.ut}},logW(to==="left"?"left":"active",d.name,d.cls)];
  api(":commit",{method:"POST",body:JSON.stringify({writes:w})}).then(function(r){
    if(r.status===401||r.status===403)throw {auth:1};
    if(!r.ok)throw new Error("저장 실패 "+r.status+" (새로 읽고 다시 해 주세요)");
    BUSY=false;return reload(d.name+" 학생을 "+(to==="left"?"퇴원":"재원")+"으로 바꿨습니다.");
  }).catch(fail);
};
function authFail(){$("app").style.display="none";$("gate").style.display="block";$("gerr").textContent="이 계정으로는 열 수 없습니다. 선생님 계정으로 로그인해 주세요.";if(AUTH)AUTH.signOut();}
function start(){$("gate").style.display="none";$("app").style.display="block";say("읽는 중...");reload();}
$("glog").onclick=function(){var b=this;$("gerr").textContent="";if(!AUTH){$("gerr").textContent="준비 중입니다. 잠시 뒤 다시 눌러 주세요.";return;}b.disabled=true;AUTH.signIn().then(function(){b.disabled=false;},function(e){b.disabled=false;var c=e&&e.code||"";$("gerr").textContent=(c==="auth/popup-closed-by-user"||c==="auth/cancelled-popup-request")?"":"로그인 실패: "+(c||e);});};
window.__tReady=function(a){AUTH=a;};
window.__tUser=function(u){EMAIL=u?u.email:"";if(u)start();else{$("app").style.display="none";$("gate").style.display="block";}};
})();
</script>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, signInWithRedirect, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
const auth=getAuth(initializeApp({apiKey:"AIzaSyC88G-OjMJOqVqnIVqunzh7fvk91wtKKnA",authDomain:"nolbada.github.io",projectId:"h-roadmap",appId:"1:575520405083:web:b9f40b64cb0ae3d1a9317e"}));
let first=true;
onAuthStateChanged(auth,u=>{
  if(first){first=false;window.__tReady({
    token:()=>auth.currentUser?auth.currentUser.getIdToken():Promise.reject({auth:1}),
    signIn:()=>{const p=new GoogleAuthProvider();p.setCustomParameters({prompt:"select_account"});return signInWithPopup(auth,p).catch(e=>{const c=e&&e.code||"";if(c==="auth/popup-blocked"||c==="auth/operation-not-supported-in-this-environment"||c==="auth/web-storage-unsupported")return signInWithRedirect(auth,p);throw e;});},
    signOut:()=>signOut(auth)
  });}
  window.__tUser(u);
});
</script>
</body>
</html>
