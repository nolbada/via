<title>M2 Reading 39</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}

.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}

.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}

.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Aloha! Welcome to Hawaii!","ko":"알로하! 하와이에 오신 것을 환영해요!","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"Aloha mean \"hello\" or \"goodbye\" in the Hawaiian language. I'm Malia, and I'm you hula teacher for today.","ko":"'알로하'는 하와이어로 '안녕하세요' 또는 '안녕히 가세요'라는 뜻이에요. 저는 Malia이고 오늘 당신의 훌라 선생님이에요.","ok":false,"foot":[],"fixes":[{"wrong":"mean","right":"means","partial":false,"at":[1],"point":"3인칭 단수 현재형: 3인칭 단수 주어 Aloha에는 means 사용","topic":"3인칭 단수 현재형","memo":"3인칭 단수 주어 Aloha에는 means 사용"},{"wrong":"you","right":"your","partial":false,"at":[13],"point":"인칭대명사의 격: 명사 앞 소유격 your 사용","topic":"인칭대명사의 격","memo":"명사 앞 소유격 your 사용"}]},{"n":3,"tag":null,"en":"Have you heard of hula before? How much do you know about hula?","ko":"훌라에 대해 전에 들어 본 적이 있나요? 훌라에 대해 얼마나 알고 있나요?","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"Before we start our lesson, I want tell you about it.","ko":"수업을 시작하기 전에 그것에 대해 말씀드리고 싶어요.","ok":false,"foot":[],"fixes":[{"wrong":"tell","right":"to tell","partial":false,"at":[7],"point":"to부정사: want 뒤에는 to tell 사용","topic":"to부정사","memo":"want 뒤에는 to tell 사용","alt":[6]}]},{"n":5,"tag":null,"en":"Hula is an traditional dance from Hawaii, and it has been a part of Hawaiian life since a long time.","ko":"훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[2],"point":"관사 a/an: 자음 소리 traditional 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 traditional 앞에는 a 사용"},{"wrong":"since","right":"for","partial":false,"at":[16],"point":"기본전치사: 기간 a long time 앞에는 for 사용","topic":"기본전치사","memo":"기간 a long time 앞에는 for 사용"}]},{"n":6,"tag":null,"en":"The early Hawaiians didn't have a writing systems, so them used hula to tell stories.","ko":"초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요.","ok":false,"foot":[],"fixes":[{"wrong":"systems","right":"system","partial":false,"at":[7],"point":"명사의 복수형: a 뒤에는 단수명사 system 사용","topic":"명사의 복수형","memo":"a 뒤에는 단수명사 system 사용"},{"wrong":"them","right":"they","partial":false,"at":[9],"point":"인칭대명사의 격: 주어 자리에는 주격 they 사용","topic":"인칭대명사의 격","memo":"주어 자리에는 주격 they 사용"}]},{"n":7,"tag":null,"en":"Hula is a language through body movements, and it has pass down stories from one generation to the next.","ko":"훌라는 몸의 움직임을 통한 언어로, 한 세대에서 다음 세대로 이야기를 전해 왔습니다.","ok":false,"foot":[],"fixes":[{"wrong":"pass","right":"passed","partial":false,"at":[10],"point":"현재완료: 현재완료는 has + 과거분사: has passed (pass 아님)","topic":"현재완료","memo":"현재완료는 has + 과거분사: has passed (pass 아님)"}]},{"n":8,"tag":null,"en":"Now it's time to dance! Remember that you become a storyteller when you dance hula.","ko":"이제 춤을 출 시간이에요! 훌라를 출 때는 당신이 이야기꾼이 된다는 것을 기억하세요.","ok":true,"foot":[],"fixes":[]},{"n":9,"tag":null,"en":"You tell a story with your hands, foot, and hips. Oh, you need to take off your shoes and socks!","ko":"당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요. 아, 신발과 양말을 벗어야 해요!","ok":false,"foot":[],"fixes":[{"wrong":"foot","right":"feet","partial":false,"at":[7],"point":"불규칙 복수형: foot의 복수형은 feet","topic":"불규칙 복수형","memo":"foot의 복수형은 feet"}]},{"n":10,"tag":null,"en":"Hula is always done barefoot.","ko":"훌라는 항상 맨발로 하거든요.","ok":true,"foot":[],"fixes":[]},{"n":11,"tag":null,"en":"Let's starts with the hand gestures. Every gestures in hula has a meaning.","ko":"손동작부터 시작할게요. 훌라의 모든 동작에는 의미가 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"starts","right":"start","partial":false,"at":[1],"point":"Let's 제안문: Let's 뒤에는 동사원형 start 사용","topic":"Let's 제안문","memo":"Let's 뒤에는 동사원형 start 사용"},{"wrong":"gestures","right":"gesture","partial":false,"at":[7],"point":"every + 단수명사: Every 뒤에는 단수명사 gesture 사용","topic":"every + 단수명사","memo":"Every 뒤에는 단수명사 gesture 사용"}]},{"n":12,"tag":null,"en":"Wave yours fingers while you move your arms up and down. This gesture is called ua at the Hawaiian language, and it mean \"rain.\"","ko":"팔을 위아래로 움직이면서 손가락을 흔들어 보세요. 이 동작은 하와이어로 'ua'라고 불리고, '비'를 뜻해요.","ok":false,"foot":[],"fixes":[{"wrong":"yours","right":"your","partial":false,"at":[1],"point":"인칭대명사의 격: 명사 앞 소유격 your 사용 (yours 아님)","topic":"인칭대명사의 격","memo":"명사 앞 소유격 your 사용 (yours 아님)"},{"wrong":"at","right":"in","partial":false,"at":[16],"point":"기본전치사: '~어로'는 in the Hawaiian language","topic":"기본전치사","memo":"'~어로'는 in the Hawaiian language"},{"wrong":"mean","right":"means","partial":false,"at":[22],"point":"3인칭 단수 현재형: 주어 it에는 means 사용","topic":"3인칭 단수 현재형","memo":"주어 it에는 means 사용"}]},{"n":13,"tag":null,"en":"What about the sun? Hawaiians makes a circle with their arms above their heads.","ko":"태양은 어떨까요? 하와이 사람들은 팔을 머리 위로 올려 원을 만들어요.","ok":false,"foot":[],"fixes":[{"wrong":"makes","right":"make","partial":false,"at":[5],"point":"주어와 동사의 수일치: 주어 Hawaiians(복수)는 동사원형: make (makes 아님)","topic":"주어와 동사의 수일치","memo":"주어 Hawaiians(복수)는 동사원형: make (makes 아님)"}]},{"n":14,"tag":null,"en":"That's ka lā, the \"sun.\" These gestures are so simple that you can easy remember them.","ko":"그것이 '태양'인 'ka lā'입니다. 이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요.","ok":false,"foot":[],"fixes":[{"wrong":"easy","right":"easily","partial":false,"at":[13],"point":"형용사와 부사: 동사 remember를 꾸밀 때는 부사 easily 사용","topic":"형용사와 부사","memo":"동사 remember를 꾸밀 때는 부사 easily 사용"}]},{"n":15,"tag":null,"en":"Next, bend your knees a few and step from side to side. While you step to the side, move your hips natural.","ko":"다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요. 옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요.","ok":false,"foot":[],"fixes":[{"wrong":"few","right":"little","partial":false,"at":[5],"point":"수량 형용사: '조금'은 a little 사용 (a few는 가산명사용)","topic":"수량 형용사","memo":"'조금'은 a little 사용 (a few는 가산명사용)"},{"wrong":"natural","right":"naturally","partial":false,"at":[21],"point":"형용사와 부사: 동사 move를 꾸밀 때는 부사 naturally 사용","topic":"형용사와 부사","memo":"동사 move를 꾸밀 때는 부사 naturally 사용"}]},{"n":16,"tag":null,"en":"Now move your hands with your hips and foots!","ko":"이제 엉덩이와 발과 함께 손을 움직이세요!","ok":false,"foot":[],"fixes":[{"wrong":"foots","right":"feet","partial":false,"at":[8],"point":"불규칙 복수형: foot의 복수형은 feet","topic":"불규칙 복수형","memo":"foot의 복수형은 feet"}]},{"n":17,"tag":null,"en":"Well, time's up! That's all for today.","ko":"자, 시간이 다 되었네요! 오늘은 여기까지예요.","ok":true,"foot":[],"fixes":[]},{"n":18,"tag":null,"en":"Remember that hula are not just a dance. Hula is a language and a way of storytelling, so it is importantly to Hawaiians.","ko":"훌라는 단순한 춤이 아니라는 것을 기억하세요. 훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[3],"point":"be동사 수일치: 단수 주어 hula에는 is 사용","topic":"be동사 수일치","memo":"단수 주어 hula에는 is 사용"},{"wrong":"importantly","right":"important","partial":false,"at":[20],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 important 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 important 사용"}]},{"n":19,"tag":null,"en":"As an hula teacher, I always tries to continue the history and culture of Hawaii. If you want to learn more, come to my next class.","ko":"훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력합니다. 더 배우고 싶으시다면 제 다음 수업에 오세요.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[1],"point":"관사 a/an: 자음 소리 hula 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 hula 앞에는 a 사용"},{"wrong":"tries","right":"try","partial":false,"at":[6],"point":"3인칭 단수 현재형: 주어 I에는 try (3인칭 아님)","topic":"3인칭 단수 현재형","memo":"주어 I에는 try (3인칭 아님)"}]},{"n":20,"tag":null,"en":"Everyone are welcome. Aloha!","ko":"모두 환영해요. 알로하!","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[1],"point":"be동사 수일치: Everyone은 단수 취급, is 사용","topic":"be동사 수일치","memo":"Everyone은 단수 취급, is 사용"}]}];var PP=[["Aloha!","알로하!",1],["Welcome to Hawaii!","하와이에 오신 것을 환영해요!",0],["Aloha means \"hello\" or \"goodbye\" in the Hawaiian language.","'알로하'는 하와이어로 '안녕하세요' 또는 '안녕히 가세요'라는 뜻이에요.",0],["I'm Malia, and I'm your hula teacher for today.","저는 Malia이고 오늘 당신의 훌라 선생님이에요.",0],["Have you heard of hula before?","훌라에 대해 전에 들어 본 적이 있나요?",0],["How much do you know about hula?","훌라에 대해 얼마나 알고 있나요?",0],["Before we start our lesson, I want to tell you about it.","수업을 시작하기 전에 그것에 대해 말씀드리고 싶어요.",0],["Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.","훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요.",1],["The early Hawaiians didn't have a writing system, so they used hula to tell stories.","초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요.",0],["Hula is a language through body movements, and it has passed down stories from one generation to the next.","훌라는 몸의 움직임을 통한 언어로, 한 세대에서 다음 세대로 이야기를 전해 왔습니다.",0],["Now it's time to dance!","이제 춤을 출 시간이에요!",1],["Remember that you become a storyteller when you dance hula.","훌라를 출 때는 당신이 이야기꾼이 된다는 것을 기억하세요.",0],["You tell a story with your hands, feet, and hips.","당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요.",0],["Oh, you need to take off your shoes and socks!","아, 신발과 양말을 벗어야 해요!",0],["Hula is always done barefoot.","훌라는 항상 맨발로 하거든요.",0],["Let's start with the hand gestures.","손동작부터 시작할게요.",1],["Every gesture in hula has a meaning.","훌라의 모든 동작에는 의미가 있어요.",0],["Wave your fingers while you move your arms up and down.","팔을 위아래로 움직이면서 손가락을 흔들어 보세요.",0],["This gesture is called ua in the Hawaiian language, and it means \"rain.\"","이 동작은 하와이어로 'ua'라고 불리고, '비'를 뜻해요.",0],["What about the sun?","태양은 어떨까요?",0],["Hawaiians make a circle with their arms above their heads.","하와이 사람들은 팔을 머리 위로 올려 원을 만들어요.",0],["That's ka lā, the \"sun.\"","그것이 '태양'인 'ka lā'입니다.",0],["These gestures are so simple that you can easily remember them.","이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요.",0],["Next, bend your knees a little and step from side to side.","다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요.",1],["While you step to the side, move your hips naturally.","옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요.",0],["Now move your hands with your hips and feet!","이제 엉덩이와 발과 함께 손을 움직이세요!",0],["Well, time's up!","자, 시간이 다 되었네요!",1],["That's all for today.","오늘은 여기까지예요.",0],["Remember that hula is not just a dance.","훌라는 단순한 춤이 아니라는 것을 기억하세요.",0],["Hula is a language and a way of storytelling, so it is important to Hawaiians.","훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다.",0],["As a hula teacher, I always try to continue the history and culture of Hawaii.","훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력합니다.",0],["If you want to learn more, come to my next class.","더 배우고 싶으시다면 제 다음 수업에 오세요.",0],["Everyone is welcome.","모두 환영해요.",0],["Aloha!","알로하!",0]];var RNUM=39;var TITLE_EN="Hula, More than Just a Dance";var PASS_EN=["Hula, More than Just a Dance","Aloha! Welcome to Hawaii! Aloha means \"hello\" or \"goodbye\" in the Hawaiian language. I'm Malia, and I'm your hula teacher for today. Have you heard of hula before? How much do you know about hula? Before we start our lesson, I want to tell you about it.","Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time. The early Hawaiians didn't have a writing system, so they used hula to tell stories. Hula is a language through body movements, and it has passed down stories from one generation to the next.","Now it's time to dance! Remember that you become a storyteller when you dance hula. You tell a story with your hands, feet, and hips. Oh, you need to take off your shoes and socks! Hula is always done barefoot.","Let's start with the hand gestures. Every gesture in hula has a meaning. Wave your fingers while you move your arms up and down. This gesture is called ua in the Hawaiian language, and it means \"rain.\" What about the sun? Hawaiians make a circle with their arms above their heads. That's ka lā, the \"sun.\" These gestures are so simple that you can easily remember them.","Next, bend your knees a little and step from side to side. While you step to the side, move your hips naturally. Now move your hands with your hips and feet!","Well, time's up! That's all for today. Remember that hula is not just a dance. Hula is a language and a way of storytelling, so it is important to Hawaiians. As a hula teacher, I always try to continue the history and culture of Hawaii. If you want to learn more, come to my next class. Everyone is welcome. Aloha!"];var PASS_KO=["단순한 춤 그 이상인 훌라","알로하! 하와이에 오신 것을 환영해요! '알로하'는 하와이어로 '안녕하세요' 또는 '안녕히 가세요'라는 뜻이에요. 저는 Malia이고 오늘 당신의 훌라 선생님이에요. 훌라에 대해 전에 들어 본 적이 있나요? 훌라에 대해 얼마나 알고 있나요? 수업을 시작하기 전에 그것에 대해 말씀드리고 싶어요.","훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요. 초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요. 훌라는 몸의 움직임을 통한 언어로, 한 세대에서 다음 세대로 이야기를 전해 왔습니다.","이제 춤을 출 시간이에요! 훌라를 출 때는 당신이 이야기꾼이 된다는 것을 기억하세요. 당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요. 아, 신발과 양말을 벗어야 해요! 훌라는 항상 맨발로 하거든요.","손동작부터 시작할게요. 훌라의 모든 동작에는 의미가 있어요. 팔을 위아래로 움직이면서 손가락을 흔들어 보세요. 이 동작은 하와이어로 'ua'라고 불리고, '비'를 뜻해요. 태양은 어떨까요? 하와이 사람들은 팔을 머리 위로 올려 원을 만들어요. 그것이 '태양'인 'ka lā'입니다. 이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요.","다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요. 옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요. 이제 엉덩이와 발과 함께 손을 움직이세요!","자, 시간이 다 되었네요! 오늘은 여기까지예요. 훌라는 단순한 춤이 아니라는 것을 기억하세요. 훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다. 훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력합니다. 더 배우고 싶으시다면 제 다음 수업에 오세요. 모두 환영해요. 알로하!"];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["experience of visiting another country","the history of the Statue of Liberty","famous attractions in the world","my plans for summer vacation","where to visit in New York"],"a":4,"ans":"where to visit in New York","evs":[["There are many places to visit. Where should we start?","가 볼 곳이 정말 많네. 어디부터 시작할까?"],["How about the Statue of Liberty?","자유의 여신상은 어때?"]],"ev":["There are many places to visit. Where should we start?","가 볼 곳이 정말 많네. 어디부터 시작할까?"],"ow":["오답 ✕ — 'This is my first time here.'(나는 여기 처음 와 봐.)라고 했듯이 이미 뉴욕에 와 있고, 다른 나라를 방문한 경험을 이야기하는 대화가 아니라서 틀림.","오답 ✕ — 자유의 여신상은 'You know the big green statue of a woman.'(커다란 초록색 여인 동상 알잖아.)라고 설명만 하고, 그 역사는 나오지 않아서 너무 좁은 보기라 틀림.","오답 ✕ — 세계의 유명한 명소 전반이 아니라 뉴욕의 명소(자유의 여신상, 엠파이어 스테이트 빌딩)만 다루고 있어서 너무 넓은 보기라 틀림.","오답 ✕ — 'my plans for summer vacation'(내 여름방학 계획)은 대화에 나오지 않는다. 두 사람은 방학이 아니라 지금 뉴욕에서 어디를 갈지 정하고 있음.","정답 ○ — \"There are many places to visit. Where should we start?\"(가 볼 곳이 정말 많네. 어디부터 시작할까?)라며 자유의 여신상과 엠파이어 스테이트 빌딩을 정하므로 뉴욕에서 방문할 곳이 주제임."],"memo":["정답 ⑤ where to visit in New York(뉴욕에서 어디를 방문할지)","근거: There are many places to visit. Where should we start?(가 볼 곳이 정말 많네. 어디부터 시작할까?)","함정: ② 자유의 여신상의 '역사'는 나오지 않는다 ✕"],"why":"뉴욕에서 자유의 여신상과 엠파이어 스테이트 빌딩 등 방문할 곳을 정하는 대화이다."},{"n":2,"q":"위 대화의 내용과 일치하는 것은?","o":["Ben은 전에 뉴욕에 와 본 적이 있다.","두 사람은 엠파이어 스테이트 빌딩을 먼저 방문하기로 했다.","자유의 여신상은 작은 파란색 남자 동상이다.","두 사람은 자유의 여신상을 먼저 방문하기로 했다.","엠파이어 스테이트 빌딩은 모나리자로 유명하다."],"a":3,"ans":"두 사람은 자유의 여신상을 먼저 방문하기로 했다.","evs":[["Of course. It's a landmark of New York. Let's visit there first.","물론이지. 그건 뉴욕의 상징물이잖아. 거기부터 가 보자."]],"ev":["Of course. It's a landmark of New York. Let's visit there first.","물론이지. 그건 뉴욕의 상징물이잖아. 거기부터 가 보자."],"ow":["오답 ✕ — Ben이 \"This is my first time here.\"(나는 여기 처음 와 봐.)라고 했는데 이 보기는 전에 와 본 적이 있다고 해서 틀림.","오답 ✕ — Mia가 자유의 여신상을 \"Let's visit there first.\"(거기부터 가 보자.)라고 했고, Ben이 \"After that, maybe we can go to the Empire State Building.\"(그다음에는 엠파이어 스테이트 빌딩에 가도 될 것 같아.)라고 했으므로 순서가 반대라서 틀림.","오답 ✕ — 본문에는 \"the big green statue of a woman\"(커다란 초록색 여인 동상)이라고 했는데 이 보기는 작은 파란색 남자 동상이라고 해서 틀림.","정답 ○ — Mia가 \"It's a landmark of New York. Let's visit there first.\"(그건 뉴욕의 상징물이잖아. 거기부터 가 보자.)라고 했으므로 자유의 여신상을 먼저 방문하기로 한 것이 맞음.","오답 ✕ — 본문에는 \"It's famous for the fantastic view.\"(그곳은 멋진 전망으로 유명해.)라고 했는데 이 보기는 모나리자로 유명하다고 해서 틀림. 모나리자는 루브르 박물관의 작품이다."],"memo":["정답 ④: 두 사람은 자유의 여신상을 먼저 방문하기로 했다.","근거: Let's visit there first.(거기부터 가 보자.) — 자유의 여신상이 먼저","함정: ② 엠파이어 스테이트 빌딩은 그다음(After that) 순서이다 ✕"],"why":"두 사람은 자유의 여신상을 먼저 보고, 그다음 엠파이어 스테이트 빌딩에 가기로 한다."},{"n":3,"q":"위 대화의 내용을 요약한 문장의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["Statue - view","Museum - view","Statue - food","Bridge - music","Park - weather"],"a":0,"ans":"Statue - view","evs":[["How about the Statue of Liberty?","자유의 여신상은 어때?"],["Good. After that, maybe we can go to the Empire State Building. It's famous for the fantastic view.","좋아. 그다음에는 엠파이어 스테이트 빌딩에 가도 될 것 같아. 그곳은 멋진 전망으로 유명해."]],"ev":["How about the Statue of Liberty?","자유의 여신상은 어때?"],"ow":["정답 ○ — \"How about the Statue of Liberty?\"(자유의 여신상은 어때?)와 \"It's famous for the fantastic view.\"(그곳은 멋진 전망으로 유명해.)에 맞으므로 Statue - view가 정답임.","오답 ✕ — (B) view는 맞지만, 첫 방문지는 \"the Statue of Liberty\"(자유의 여신상)이므로 Museum(박물관)이 아니라서 틀림.","오답 ✕ — (A) Statue는 맞지만, 본문에는 \"It's famous for the fantastic view.\"(그곳은 멋진 전망으로 유명해.)라고 했는데 이 보기는 food(음식)라고 해서 틀림.","오답 ✕ — 본문에는 \"How about the Statue of Liberty?\"(자유의 여신상은 어때?)라고 했는데 이 보기는 Bridge(다리)라고 하고, 유명한 이유도 music(음악)이 아니라 view(전망)라서 둘 다 틀림.","오답 ✕ — 첫 방문지는 \"the Statue of Liberty\"(자유의 여신상)이지 Park(공원)가 아니고, 유명한 이유도 weather(날씨)가 아니라 view(전망)라서 둘 다 틀림."],"memo":["정답 ①: Statue(동상) - view(전망)","근거: the Statue of Liberty / famous for the fantastic view(자유의 여신상 / 멋진 전망으로 유명)","함정: (A)만 맞고 (B)가 틀린 ③ food에 주의 ✕"],"why":"자유의 여신상을 먼저 가고 전망으로 유명한 엠파이어 스테이트 빌딩에 가기로 한다.","sum":"Mia and Ben decide to visit the (A)________ of Liberty first and then go to the Empire State Building, which is famous for its fantastic (B)________.","lab":"완성된 요약문 : "}],"dlg":[["Mia","Ben, I can't believe we're in New York!","Ben, 우리가 뉴욕에 있다니 믿을 수가 없어!"],["Ben","Yeah. This is my first time here.","그래. 나는 여기 처음 와 봐."],["Mia","Me, too. There are many places to visit. Where should we start?","나도 그래. 가 볼 곳이 정말 많네. 어디부터 시작할까?"],["Ben","How about the Statue of Liberty?","자유의 여신상은 어때?"],["Mia","Pardon?","뭐라고?"],["Ben","The Statue of Liberty. You know the big green statue of a woman.","자유의 여신상 말이야. 커다란 초록색 여인 동상 알잖아."],["Mia","Of course. It's a landmark of New York. Let's visit there first.","물론이지. 그건 뉴욕의 상징물이잖아. 거기부터 가 보자."],["Ben","Good. After that, maybe we can go to the Empire State Building. It's famous for the fantastic view.","좋아. 그다음에는 엠파이어 스테이트 빌딩에 가도 될 것 같아. 그곳은 멋진 전망으로 유명해."],["Mia","That sounds great!","그거 좋다!"]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["B는 A의 말을 한 번에 알아듣고 대답했다.","Happy Snacks는 달콤하고 매운 떡볶이로 유명하다.","방과 후에 같이 가자고 제안한 사람은 A이다.","두 사람은 주말에 Happy Snacks에 가기로 했다.","Happy Snacks는 햄버거로 유명하다."],"a":1,"ans":"Happy Snacks는 달콤하고 매운 떡볶이로 유명하다.","evs":[["Happy Snacks. It's famous for sweet and spicy tteokbokki.","Happy Snacks 말이야. 거기는 달콤하고 매운 떡볶이로 유명해."],["Oh, really? Let's go there after school together.","아, 정말? 방과 후에 같이 거기 가자."]],"ev":["Happy Snacks. It's famous for sweet and spicy tteokbokki.","Happy Snacks 말이야. 거기는 달콤하고 매운 떡볶이로 유명해."],"ow":["오답 ✕ — B는 \"Pardon?\"(뭐라고?)이라고 되물었으므로 한 번에 알아듣지 못했다. 그래서 틀림.","정답 ○ — A가 \"It's famous for sweet and spicy tteokbokki.\"(거기는 달콤하고 매운 떡볶이로 유명해.)라고 했으므로 맞음.","오답 ✕ — \"Let's go there after school together.\"(방과 후에 같이 거기 가자.)라고 제안한 사람은 A가 아니라 B이므로 틀림.","오답 ✕ — 본문에는 \"Let's go there after school together.\"(방과 후에 같이 거기 가자.)라고 했는데 이 보기는 주말에 간다고 해서 틀림.","오답 ✕ — 본문에는 \"It's famous for sweet and spicy tteokbokki.\"(거기는 달콤하고 매운 떡볶이로 유명해.)라고 했는데 이 보기는 햄버거로 유명하다고 해서 틀림."],"memo":["정답 ②: Happy Snacks는 달콤하고 매운 떡볶이로 유명하다.","근거: It's famous for sweet and spicy tteokbokki.(거기는 달콤하고 매운 떡볶이로 유명해.)","함정: ③ 같이 가자고 한 사람은 A가 아니라 B ✕"],"why":"Happy Snacks는 달콤하고 매운 떡볶이로 유명한 곳이다."}],"dlg":[["A","Do you know Happy Snacks?","너 Happy Snacks 알아?"],["B","Pardon?","뭐라고?"],["A","Happy Snacks. It's famous for sweet and spicy tteokbokki.","Happy Snacks 말이야. 거기는 달콤하고 매운 떡볶이로 유명해."],["B","Oh, really? Let's go there after school together.","아, 정말? 방과 후에 같이 거기 가자."]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["B는 A의 첫 말을 정확히 알아들었다.","루브르 박물관은 에펠탑으로 유명하다.","B는 루브르 박물관에 가고 싶어 하지 않는다.","B는 루브르 박물관을 항상 보고 싶어 했다.","두 사람은 루브르 박물관 대신 다른 곳에 가기로 했다."],"a":3,"ans":"B는 루브르 박물관을 항상 보고 싶어 했다.","evs":[["Oh, right! I've always wanted to see it. Let's visit there!","아, 맞다! 나는 항상 그걸 보고 싶었어. 거기 가 보자!"],["I said the Louvre Museum. It's famous for the Mona Lisa.","루브르 박물관이라고 했어. 그곳은 모나리자로 유명해."]],"ev":["Oh, right! I've always wanted to see it. Let's visit there!","아, 맞다! 나는 항상 그걸 보고 싶었어. 거기 가 보자!"],"ow":["오답 ✕ — B가 \"I beg your pardon?\"(뭐라고 했어?)이라고 되물었으므로 첫 말을 정확히 알아듣지 못했다. 그래서 틀림.","오답 ✕ — 본문에는 \"It's famous for the Mona Lisa.\"(그곳은 모나리자로 유명해.)라고 했는데 이 보기는 에펠탑으로 유명하다고 해서 틀림.","오답 ✕ — 본문에는 \"I've always wanted to see it.\"(나는 항상 그걸 보고 싶었어.)라고 했는데 이 보기는 가고 싶어 하지 않는다고 해서 틀림.","정답 ○ — B가 \"I've always wanted to see it.\"(나는 항상 그걸 보고 싶었어.)라고 했으므로 맞음.","오답 ✕ — B가 \"Let's visit there!\"(거기 가 보자!)라고 하고 A도 \"Sounds great!\"(좋아!)라고 했으므로 루브르 박물관에 가기로 한 것이라서 틀림."],"memo":["정답 ④: B는 루브르 박물관을 항상 보고 싶어 했다.","근거: I've always wanted to see it.(나는 항상 그걸 보고 싶었어.)","함정: ② 루브르는 모나리자로 유명하다(에펠탑 ✕)"],"why":"B는 모나리자로 유명한 루브르 박물관을 항상 보고 싶어 했고 둘은 함께 가기로 한다."}],"dlg":[["A","I can't believe I'm in Paris. Look! That's the Louvre Museum!","내가 파리에 있다니 믿을 수가 없어. 봐! 저게 루브르 박물관이야!"],["B","I beg your pardon?","뭐라고 했어?"],["A","I said the Louvre Museum. It's famous for the Mona Lisa.","루브르 박물관이라고 했어. 그곳은 모나리자로 유명해."],["B","Oh, right! I've always wanted to see it. Let's visit there!","아, 맞다! 나는 항상 그걸 보고 싶었어. 거기 가 보자!"],["A","Sounds great!","좋아!"]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["초기 하와이인들은 문자로 이야기를 기록했다.","훌라는 최근에 만들어진 춤이다.","Malia는 오늘 수영 선생님이다.","훌라는 하와이의 전통 춤으로 오랫동안 하와이 생활의 일부였다.","알로하는 하와이어로 '감사합니다'라는 뜻이다."],"a":3,"ans":"훌라는 하와이의 전통 춤으로 오랫동안 하와이 생활의 일부였다.","evs":[["Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.","훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요."]],"ev":["Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.","훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요."],"ow":["오답 ✕ — 본문에는 \"The early Hawaiians didn't have a writing system, so they used hula to tell stories.\"(초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요.)라고 했는데 이 보기는 문자로 기록했다고 해서 틀림.","오답 ✕ — 본문에는 \"it has been a part of Hawaiian life for a long time\"(오랫동안 하와이 생활의 일부였어요)라고 했는데 이 보기는 최근에 만들어졌다고 해서 틀림.","오답 ✕ — 본문에는 \"I'm Malia, and I'm your hula teacher for today.\"(저는 Malia이고 오늘 당신의 훌라 선생님이에요.)라고 했는데 이 보기는 수영 선생님이라고 해서 틀림.","정답 ○ — \"Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.\"(훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요.)라고 했으므로 맞음.","오답 ✕ — 본문에는 \"Aloha means 'hello' or 'goodbye' in the Hawaiian language.\"(알로하는 하와이어로 '안녕하세요' 또는 '안녕히 가세요'라는 뜻이에요.)라고 했는데 이 보기는 '감사합니다'라고 해서 틀림."],"memo":["정답 ④: 훌라는 하와이의 전통 춤으로 오랫동안 생활의 일부였다.","근거: Hula is a traditional dance from Hawaii.(훌라는 하와이의 전통 춤이에요.)","함정: ⑤ 알로하는 '안녕하세요/안녕히 가세요'이지 '감사합니다'가 아님 ✕"],"why":"훌라는 하와이의 전통 춤으로 오랫동안 하와이 사람들의 생활의 일부였다."},{"n":7,"q":"윗글의 내용을 요약한 문장의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["writing - stories","counting - jokes","writing - lies","farming - songs","voting - rules"],"a":0,"ans":"writing - stories","evs":[["The early Hawaiians didn't have a writing system, so they used hula to tell stories.","초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요."]],"ev":["The early Hawaiians didn't have a writing system, so they used hula to tell stories.","초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요."],"ow":["정답 ○ — \"The early Hawaiians didn't have a writing system, so they used hula to tell stories.\"(초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요.)에 그대로 맞음.","오답 ✕ — 본문의 \"writing system\"(문자 체계)이 아니라 counting(셈하기)이라고 했고, 훌라로 전한 것도 \"stories\"(이야기)이지 jokes(농담)가 아니라서 둘 다 틀림.","오답 ✕ — (A) writing은 맞지만, 훌라로 전한 것은 \"stories\"(이야기)이지 lies(거짓말)가 아니라서 틀림.","오답 ✕ — 본문에는 \"didn't have a writing system\"(문자가 없었다)이라고 했는데 이 보기는 farming(농사)이라고 하고, 전한 것도 songs(노래)라고 해서 둘 다 틀림.","오답 ✕ — 본문에는 \"didn't have a writing system\"(문자가 없었다)이라고 했는데 이 보기는 voting(투표)이라고 하고, rules(규칙)를 전한다는 말도 없어서 둘 다 틀림."],"memo":["정답 ①: writing(문자) - stories(이야기)","근거: didn't have a writing system, so they used hula to tell stories(문자가 없어서 이야기를 하기 위해 훌라를 사용했다)","함정: (A)만 맞고 (B)가 틀린 ③ lies에 주의 ✕"],"why":"문자가 없던 초기 하와이인들은 훌라로 이야기를 전했다.","sum":"The early Hawaiians didn't have a (A)________ system, so they used hula to tell (B)________.","lab":"완성된 요약문 : "}],"pp":[["Aloha!","알로하!"],["Welcome to Hawaii!","하와이에 오신 것을 환영해요!"],["Aloha means \"hello\" or \"goodbye\" in the Hawaiian language.","'알로하'는 하와이어로 '안녕하세요' 또는 '안녕히 가세요'라는 뜻이에요."],["I'm Malia, and I'm your hula teacher for today.","저는 Malia이고 오늘 당신의 훌라 선생님이에요."],["Have you heard of hula before?","훌라에 대해 전에 들어 본 적이 있나요?"],["How much do you know about hula?","훌라에 대해 얼마나 알고 있나요?"],["Before we start our lesson, I want to tell you about it.","수업을 시작하기 전에 그것에 대해 말씀드리고 싶어요."],["Hula is a traditional dance from Hawaii, and it has been a part of Hawaiian life for a long time.","훌라는 하와이의 전통 춤으로, 오랫동안 하와이 생활의 일부였어요."],["The early Hawaiians didn't have a writing system, so they used hula to tell stories.","초기 하와이인들은 문자가 없어서 이야기를 하기 위해 훌라를 사용했어요."],["Hula is a language through body movements, and it has passed down stories from one generation to the next.","훌라는 몸의 움직임을 통한 언어로, 한 세대에서 다음 세대로 이야기를 전해 왔습니다."]]},{"qs":[{"n":8,"q":"윗글의 제목으로 알맞은 것은?","o":["Two Types of Hula","How Did the Hula Start?","Why Is the Hula Popular?","Let's Learn to Dance the Hula","The Meaning of Hula Gestures"],"a":3,"ans":"Let's Learn to Dance the Hula","evs":[["Now it's time to dance!","이제 춤을 출 시간이에요!"],["Let's start with the hand gestures.","손동작부터 시작할게요."]],"ev":["Now it's time to dance!","이제 춤을 출 시간이에요!"],"ow":["오답 ✕ — 훌라의 종류가 두 가지라는 내용은 본문에 없다. 대신 \"Let's start with the hand gestures.\"(손동작부터 시작할게요.)처럼 순서대로 춤을 배워 나가서 틀림.","오답 ✕ — 훌라가 어떻게 시작되었는지는 앞부분의 설명이고, 이 글은 \"Now it's time to dance!\"(이제 춤을 출 시간이에요!)이라며 춤을 직접 배우는 수업이라서 틀림.","오답 ✕ — 훌라가 왜 인기가 있는지에 대한 이야기는 없다. 가장 가까운 문장은 \"it is important to Hawaiians\"(하와이 사람들에게 중요하다)인데 인기가 아니라 중요성을 말하는 것임.","정답 ○ — \"Now it's time to dance!\"(이제 춤을 출 시간이에요!)라며 손동작, 발동작, 엉덩이 움직임을 차례로 가르치므로 훌라 춤을 배워 보자는 제목이 알맞음.","오답 ✕ — 손동작의 의미(ua는 비, ka lā는 태양)는 글의 일부일 뿐, 발동작과 엉덩이 움직임(\"bend your knees a little and step from side to side\")까지 다루는 전체 내용에 비해 너무 좁아서 틀림."],"memo":["정답 ④ Let's Learn to Dance the Hula(훌라 춤을 배워 보자)","근거: Now it's time to dance!(이제 춤을 출 시간이에요!)","함정: ⑤ 손동작의 의미는 글의 일부일 뿐이라 너무 좁다 ✕"],"why":"손, 발, 엉덩이 동작을 차례로 배우는 훌라 수업이므로 제목은 Let's Learn to Dance the Hula이다."},{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["훌라의 동작에는 특별한 의미가 없다.","팔을 위아래로 움직이며 손가락을 흔드는 동작은 '태양'을 뜻한다.","팔로 머리 위에 원을 만드는 동작은 'ka lā'로 '태양'을 뜻한다.","훌라는 신발을 신고 춘다.","훌라를 출 때는 손만 사용한다."],"a":2,"ans":"팔로 머리 위에 원을 만드는 동작은 'ka lā'로 '태양'을 뜻한다.","evs":[["Hawaiians make a circle with their arms above their heads.","하와이 사람들은 팔을 머리 위로 올려 원을 만들어요."],["That's ka lā, the \"sun.\"","그것이 '태양'인 'ka lā'입니다."]],"ev":["Hawaiians make a circle with their arms above their heads.","하와이 사람들은 팔을 머리 위로 올려 원을 만들어요."],"ow":["오답 ✕ — 본문에는 \"Every gesture in hula has a meaning.\"(훌라의 모든 동작에는 의미가 있어요.)라고 했는데 이 보기는 의미가 없다고 해서 틀림.","오답 ✕ — 본문에는 \"This gesture is called ua in the Hawaiian language, and it means 'rain.'\"(이 동작은 하와이어로 'ua'라고 불리고, '비'를 뜻해요.)라고 했는데 이 보기는 태양이라고 해서 틀림.","정답 ○ — \"Hawaiians make a circle with their arms above their heads. That's ka lā, the 'sun.'\"(하와이 사람들은 팔을 머리 위로 올려 원을 만들어요. 그것이 '태양'인 'ka lā'입니다.)라고 했으므로 맞음.","오답 ✕ — 본문에는 \"Hula is always done barefoot.\"(훌라는 항상 맨발로 하거든요.)라고 했는데 이 보기는 신발을 신고 춘다고 해서 틀림.","오답 ✕ — 본문에는 \"You tell a story with your hands, feet, and hips.\"(당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요.)라고 했는데 이 보기는 손만 사용한다고 해서 틀림."],"memo":["정답 ③: 팔로 머리 위에 원을 만드는 동작은 ka lā(태양)이다.","근거: That's ka lā, the \"sun.\"(그것이 '태양'인 'ka lā'입니다.)","함정: ② 손가락을 흔드는 동작 ua는 '태양'이 아니라 '비'(rain) ✕"],"why":"팔로 머리 위에 원을 만드는 동작이 태양(ka lā)을 뜻한다."},{"n":10,"q":"윗글의 내용을 요약한 문장의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["language - Hawaiians","game - tourists","language - teachers","song - children","sport - Koreans"],"a":0,"ans":"language - Hawaiians","evs":[["Hula is a language and a way of storytelling, so it is important to Hawaiians.","훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다."]],"ev":["Hula is a language and a way of storytelling, so it is important to Hawaiians.","훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다."],"ow":["정답 ○ — \"Hula is a language and a way of storytelling, so it is important to Hawaiians.\"(훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다.)에 그대로 맞음.","오답 ✕ — 본문에는 \"Hula is a language\"(훌라는 언어이다)라고 했는데 이 보기는 game(게임)이라고 하고, 중요한 대상도 \"Hawaiians\"(하와이 사람들)이지 tourists(관광객)가 아니라서 둘 다 틀림.","오답 ✕ — (A) language는 맞지만, 본문에는 \"it is important to Hawaiians\"(하와이 사람들에게 중요하다)라고 했는데 이 보기는 teachers(선생님들)라고 해서 틀림.","오답 ✕ — 본문에는 \"Hula is a language\"(훌라는 언어이다)라고 했는데 이 보기는 song(노래)이라고 하고, 중요한 대상도 children(어린이)이 아니라서 둘 다 틀림.","오답 ✕ — 본문에는 \"Hula is a language\"(훌라는 언어이다)라고 했는데 이 보기는 sport(운동)라고 하고, 중요한 대상도 \"Hawaiians\"가 아니라 Koreans(한국인)라서 둘 다 틀림."],"memo":["정답 ①: language(언어) - Hawaiians(하와이 사람들)","근거: Hula is a language and a way of storytelling, so it is important to Hawaiians.(훌라는 언어이자 이야기하는 방법이어서 하와이 사람들에게 중요하다.)","함정: (A)만 맞고 (B)가 틀린 ③ teachers에 주의 ✕"],"why":"훌라는 춤을 넘어 언어이자 이야기를 전하는 방법이라 하와이 사람들에게 중요하다.","sum":"Hula is not just a dance but a (A)________ and a way of storytelling, so it is important to (B)________.","lab":"완성된 요약문 : "}],"pp":[["Now it's time to dance!","이제 춤을 출 시간이에요!"],["Remember that you become a storyteller when you dance hula.","훌라를 출 때는 당신이 이야기꾼이 된다는 것을 기억하세요."],["You tell a story with your hands, feet, and hips.","당신은 당신의 손, 발, 엉덩이로 이야기를 하는 거예요."],["Oh, you need to take off your shoes and socks!","아, 신발과 양말을 벗어야 해요!"],["Hula is always done barefoot.","훌라는 항상 맨발로 하거든요."],["Let's start with the hand gestures.","손동작부터 시작할게요."],["Every gesture in hula has a meaning.","훌라의 모든 동작에는 의미가 있어요."],["Wave your fingers while you move your arms up and down.","팔을 위아래로 움직이면서 손가락을 흔들어 보세요."],["This gesture is called ua in the Hawaiian language, and it means \"rain.\"","이 동작은 하와이어로 'ua'라고 불리고, '비'를 뜻해요."],["What about the sun?","태양은 어떨까요?"],["Hawaiians make a circle with their arms above their heads.","하와이 사람들은 팔을 머리 위로 올려 원을 만들어요."],["That's ka lā, the \"sun.\"","그것이 '태양'인 'ka lā'입니다."],["These gestures are so simple that you can easily remember them.","이 동작들은 매우 간단해서 당신은 그것들을 쉽게 기억할 수 있어요."],["Next, bend your knees a little and step from side to side.","다음으로, 무릎을 약간 구부리고 좌우로 걸음을 옮기세요."],["While you step to the side, move your hips naturally.","옆으로 내딛는 동안 엉덩이를 자연스럽게 움직이세요."],["Now move your hands with your hips and feet!","이제 엉덩이와 발과 함께 손을 움직이세요!"],["Well, time's up!","자, 시간이 다 되었네요!"],["That's all for today.","오늘은 여기까지예요."],["Remember that hula is not just a dance.","훌라는 단순한 춤이 아니라는 것을 기억하세요."],["Hula is a language and a way of storytelling, so it is important to Hawaiians.","훌라는 언어이자 이야기하는 한 방법이어서 그것은 하와이 사람들에게 중요하답니다."],["As a hula teacher, I always try to continue the history and culture of Hawaii.","훌라 선생님으로서 저는 항상 하와이의 역사와 문화를 이어가기 위해 노력합니다."],["If you want to learn more, come to my next class.","더 배우고 싶으시다면 제 다음 수업에 오세요."],["Everyone is welcome.","모두 환영해요."],["Aloha!","알로하!"]]}];
