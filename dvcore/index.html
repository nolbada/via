<style>

}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12191b; --card:#1b2528; --ink:#eef2f1; --sub:#9db0b3; --line:#2c393c;
  --accent:#58c2b9; --accent-ink:#0d1c1b; --accent-soft:#1d3a39;
  --good:#6fd6a0; --good-bg:#1c3a2b; --bad:#ff8f86; --bad-bg:#432220; --miss:#8fb7f0; --miss-bg:#1f2f48;
  --chip:#243134; --star:#f0c24a; --shadow:0 8px 24px rgba(0,0,0,.35); color-scheme:dark; } }
:root[data-theme="dark"]{
  --bg:#12191b; --card:#1b2528; --ink:#eef2f1; --sub:#9db0b3; --line:#2c393c;
  --accent:#58c2b9; --accent-ink:#0d1c1b; --accent-soft:#1d3a39;

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:calc(14px*var(--fs));line-height:1.5;overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.app{height:100%;height:100dvh;display:flex;flex-direction:column;max-width:560px;margin:0 auto;padding-block:10px calc(12px + env(safe-area-inset-bottom,0px))}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:4px 2px 8px}
.top b{font-family:"DM Serif Display",serif;font-weight:400;font-size:calc(18px*var(--fs));letter-spacing:.2px}
.top span{color:var(--sub);font-size:calc(12px*var(--fs));font-variant-numeric:tabular-nums}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:10px}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s}
.deck{flex:1;min-height:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none;gap:12px}
.deck::-webkit-scrollbar{display:none}
.slide{flex:0 0 100%;scroll-snap-align:center;min-width:0;height:100%}
.card{height:100%;background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:var(--shadow);overflow-y:auto;overflow-x:hidden;padding:22px 20px 26px;position:relative}
.no{font-size:calc(12px*var(--fs));letter-spacing:.14em;color:var(--sub);font-variant-numeric:tabular-nums}
.head{font-family:"DM Serif Display",serif;font-size:calc(30px*var(--fs));line-height:1.1;margin:6px 0 4px;white-space:nowrap;min-width:0}
.ask{margin:14px 0 6px;font-weight:700;font-size:calc(15px*var(--fs))}
mark{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:0 3px}
.hrow{display:flex;align-items:center;gap:12px}
.spk{flex:0 0 auto;width:42px;height:42px;border-radius:50%;border:1.5px solid var(--line);background:var(--chip);color:var(--accent);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.spk svg{width:20px;height:20px}
.kan{border-top:1px dashed var(--line);padding:14px 0 6px}

.sense{font-weight:500;font-size:calc(13px*var(--fs))}
.q{font-size:calc(13px*var(--fs));color:var(--sub);margin:8px 0 10px}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opt{border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:14px;padding:9px 10px;font:inherit;font-size:calc(14px*var(--fs));font-weight:500;text-align:left;cursor:pointer;min-width:0;word-break:break-word}
.opt{position:relative;padding-right:34px}
.osp{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;color:var(--accent);border-radius:50%}
.opt small{display:block;font-weight:400;font-size:calc(11px*var(--fs));color:var(--sub);margin-top:2px;min-height:0}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.good{border-color:var(--good);background:var(--good-bg)}
.opt.bad{border-color:var(--bad);background:var(--bad-bg)}
.mtag{display:block;font-style:normal;font-weight:700;font-size:calc(11px*var(--fs));color:var(--miss);margin-top:3px} .opt.miss{border-color:var(--miss);background:var(--miss-bg)}
.opt[disabled]{cursor:default}
.go{margin-top:14px;width:100%;border:0;border-radius:14px;padding:13px;background:var(--accent);color:var(--accent-ink);font:inherit;font-weight:700;cursor:pointer}

.res{margin-top:12px;font-weight:700}

.back .lock{filter:blur(7px);pointer-events:none;user-select:none}
.row{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.pill{border-radius:999px;padding:3px 10px;font-size:calc(13px*var(--fs));font-weight:500}

.other{color:var(--sub);font-size:calc(13px*var(--fs))}
.note{font-size:calc(13px*var(--fs));margin:3px 0;color:var(--ink)}

.nuS{font-size:calc(14px*var(--fs));font-weight:600;margin:2px 0}

.nuF b{display:block;font-size:calc(14px*var(--fs));font-weight:700}

.nuR{display:flex;gap:6px;align-items:baseline;font-size:calc(13px*var(--fs));margin:3px 0}

.mine{font-size:calc(12px*var(--fs));color:var(--sub)}

.starb{position:absolute;top:12px;right:14px;border:0;background:none;font-size:calc(24px*var(--fs));line-height:1;color:var(--sub);cursor:pointer;padding:4px}

.starb2{float:right;border:0;background:none;font-size:calc(18px*var(--fs));line-height:1;color:var(--sub);cursor:pointer;padding:0 2px}
.inp{width:100%;border:1.5px solid var(--line);background:var(--chip);color:var(--ink);border-radius:12px;padding:11px 12px;font:inherit;font-size:calc(15px*var(--fs));margin:8px 0}
.msg{font-size:calc(13px*var(--fs));color:var(--bad);min-height:18px}
.tsec{margin-top:26px;border-top:1px dashed var(--line);padding-top:12px}
.sub2{margin-top:10px;width:100%;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px;font:inherit;cursor:pointer}
.dgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:6px 0 10px}
.dbtn{position:relative;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:12px 0;font:inherit;font-size:calc(15px*var(--fs));font-weight:700;cursor:pointer;font-variant-numeric:tabular-nums}
.dbtn i{position:absolute;top:3px;right:6px;font-style:normal;font-size:calc(10px*var(--fs));font-weight:700;color:var(--bad)}

.prog{margin:4px 0 14px;padding:14px 16px;border:1.5px solid var(--line);border-radius:14px;background:var(--card)}
.prog .big2{font-size:calc(26px*var(--fs));font-weight:700;color:var(--accent);font-variant-numeric:tabular-nums}
.prog .big2 small{font-size:calc(13px*var(--fs));font-weight:500;color:var(--sub);margin-left:4px}

.prog .bar{height:8px;border-radius:99px;background:var(--chip);margin-top:10px;overflow:hidden}
.prog .bar b{display:block;height:100%;background:var(--accent);border-radius:99px}
.dbtn.dn{background:var(--accent-soft);border-color:var(--accent)}
.map{position:relative;margin:14px 0 6px}
.map>svg{position:absolute;left:0;top:0;pointer-events:none;z-index:0;overflow:visible}
.ln{fill:none;stroke-width:2;stroke-linecap:round;opacity:.55}
.ln.ls{stroke:var(--good)} .ln.ra{stroke:var(--bad)}
.ln.miss{stroke:var(--miss);stroke-dasharray:5 5;opacity:1;stroke-width:2.5}
.ln.bad{opacity:.2}
.mc{position:relative;z-index:1;width:max-content;max-width:100%;margin:0 auto;text-align:center;background:var(--accent);color:var(--accent-ink);border-radius:18px;padding:10px 18px 12px;box-shadow:var(--shadow)}
.mc .mch{display:flex;align-items:center;justify-content:center;gap:8px;font-family:"DM Serif Display",serif;font-size:calc(26px*var(--fs));line-height:1.15}
.mc .spk2{border:0;background:rgba(255,255,255,.22);color:inherit;width:30px;height:30px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;cursor:pointer;padding:0}
.mc .spk2 svg{width:16px;height:16px}
.mc .ms{font-size:calc(13px*var(--fs));margin-top:2px;opacity:.95}
.mc .tag{background:rgba(255,255,255,.22);color:inherit}
.mcols{position:relative;z-index:1;display:grid;grid-template-columns:1fr 1fr;column-gap:34px;margin-top:30px;align-items:start}
.mcol{display:flex;flex-direction:column;gap:8px;min-width:0}
.mh{font-size:calc(12px*var(--fs));font-weight:700;letter-spacing:.04em;text-align:center;padding-bottom:2px}
.mcol.l .mh{color:var(--good)} .mcol.r .mh{color:var(--bad)}
.mh u{display:block;text-decoration:none;font-weight:500;color:var(--sub);font-size:calc(11px*var(--fs))}
.mnone{font-size:calc(12px*var(--fs));color:var(--sub);text-align:center;padding:10px 0}
.mw{position:relative;z-index:1;text-align:left;border:1.5px solid var(--line);background:var(--card);color:var(--ink);border-radius:14px;padding:8px 10px;font:inherit;cursor:pointer;min-width:0;display:flex;flex-direction:column;gap:1px}
.mw .mwh{display:flex;align-items:center;justify-content:space-between;gap:6px;font-weight:700;font-size:calc(15px*var(--fs));word-break:break-word}
.mw .mwh svg{color:var(--accent);flex:0 0 auto}
.mw em{font-style:normal;font-size:calc(12px*var(--fs));color:var(--sub);word-break:break-word}
.mw i{font-style:normal;font-weight:700;font-size:calc(11px*var(--fs));margin-top:2px}
.mw.l{border-color:var(--good);background:var(--good-bg)}
.mw.r{border-color:var(--bad);background:var(--bad-bg)}

.mw.d{background:transparent;border-style:dashed;opacity:.8}
.mw.d.bad{opacity:1}
.slide.on .mw{animation:mwin .45s ease both}
.slide.on .mcol .mw:nth-child(3){animation-delay:.08s}.slide.on .mcol .mw:nth-child(4){animation-delay:.16s}.slide.on .mcol .mw:nth-child(5){animation-delay:.24s}.slide.on .mcol .mw:nth-child(n+6){animation-delay:.3s}

@keyframes mwin{from{opacity:0}}
.rvnote{font-size:calc(12px*var(--fs));color:var(--sub);margin-top:14px}
.rvchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}

.dbtn i{color:var(--star)}
.starb{z-index:2}
</style>

<script>

    var ss=window.speechSynthesis;if(!ss||typeof SpeechSynthesisUtterance==='undefined'){note('이 화면에서는 음성 읽기를 쓸 수 없음');return}
    loadV();ss.cancel();if(ss.paused)ss.resume();
    KEEP=[];
    texts.forEach(function(t){
      var u=new SpeechSynthesisUtterance(t);u.lang='en-US';u.rate=0.85;
      var v=pickV();if(v)u.voice=v;
      u.onerror=function(e){note('음성 오류: '+(e&&e.error?e.error:'알 수 없음'))};KEEP.push(u);ss.speak(u);
    });
  if(!VOICES.length)setTimeout(function(){loadV();if(!VOICES.length)note('영어 음성이 없음 (음성 목록 0개)')},800);
  }catch(e){note('음성 오류: '+e)}
}
