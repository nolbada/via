n② motive: 동기\n③ intuition: 직관, 직감","m":0,"s":"\"의도\"","c":["will","motive","intuition","intent"],"mn":"의도","hk":"intent(의도)는 intend(의도하다)와 같은 뿌리. will(의지), motive(동기), intuition(직관)과 구분","ex":[["She had [[no intent]] to hurt him.","그녀는 그를 해칠 [[의도가 없었다]]."],["What is [[the intent]] of this rule?","이 규칙의 [[의도]]는 무엇이니?"],["He went there with [[the intent]] of helping them.","그는 그들을 돕겠다는 [[의도]]로 그곳에 갔다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"campaign","a":"3","e":"③ campaign: (계획된 일련의 활동 / 일정 기간에 걸쳐 이루어지는 / 사회적이거나 정치적인 결과를 이루기 위해) 캠페인, (조직적) 운동","w":"① protest: 항의, 시위\n② subsidy: 보조금\n④ rally: 집회","k":"계획된 일련의 활동 / 일정 기간에 걸쳐 이루어지는 / 사회적이거나 정치적인 결과를 이루기 위해","m":0,"s":"\"a series of planned actions carried out over a period of time to achieve a social or political result\"","c":["protest","subsidy","campaign","rally"],"mn":"캠페인, (조직적) 운동","hk":"campaign(캠페인)은 계획된 일련의 활동. protest(항의)는 반대 표시, subsidy(보조금), rally(집회)는 한 번 모이는 행사","ex":[["The city started [[a campaign]] to save water.","시는 물을 아끼기 위한 [[캠페인]]을 시작했다."],["He led [[an election campaign]] for mayor.","그는 시장 [[선거 운동]]을 이끌었다."],["[[A safety campaign]] reduced road accidents.","[[안전 캠페인]]이 도로 사고를 줄였다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"cost","a":"cost","e":"cost (동) (비용이) 들다 / (명) 비용, 값","k":"손상된 지붕을 교체하는 것은 그 가족이 예상한 것보다 훨씬 더 많은 비용이 들 것이다.\n그 공장은 더 싼 재료를 사용해서 생산 비용을 줄였다.","m":0,"s":"Replacing the damaged roof will c______ far more than the family expected.\nThe factory cut the c______ of production by using cheaper materials.","mn":"들다 / 비용, 값","hk":"cost(들다, 비용)는 동사면 (돈이) 들다, 명사면 비용. 문장에서 동사 자리인지 명사 자리인지로 구분","ex":[["This bag will [[cost a lot]].","이 가방은 [[많은 돈이 들]] 것이다.","cost (동) (비용이) 들다"],["It [[costs ten dollars]] to enter.","들어가는 데 [[10달러가 든다]].","cost (동) (비용이) 들다"],["We must lower [[the cost]] of food.","우리는 음식의 [[비용]]을 낮춰야 한다.","cost (명) 비용, 값"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"annual","a":"1","e":"① yearly: 매년의, 연례의 (그 회사는 3월 첫째 주에 연례 회의를 연다.) / annual(매년의, 연간의)의 유의어.","w":"② monthly: 매월의\n③ weekly: 매주의\n④ daily: 매일의","k":"그 회사는 3월 첫째 주에 연례 회의를 연다.","m":0,"s":"The company holds its annual meeting in the first week of March.","h":"annual","c":["yearly","monthly","weekly","daily"],"mn":"매년의, 연간의","hk":"annual(연간의)은 yearly(매년의)와 같은 뜻. monthly(매월의), weekly(매주의), daily(매일의)는 기간이 달라 오답","ex":[["The town has [[an annual fair]] every spring.","그 마을은 매년 봄 [[연례 장터]]를 연다."],["The school holds [[an annual festival]] in October.","그 학교는 10월에 [[연례 축제]]를 연다."],["His [[annual income]] is about fifty thousand dollars.","그의 [[연간 소득]]은 약 5만 달러이다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"surroundings","a":"surroundings","e":"※ settings는 ‘배경·설정’이라 사람이 자란 형편에는 쓰지 않는다. 처지·환경은 surroundings.","k":"그는 가난한 환경에서 자랐지만 나중에 유명한 의사가 되었다.","m":0,"s":"He grew up in poor s______ but later became a famous doctor.","hk":"surround(둘러싸다)에 -ings가 붙어 r이 두 개, 끝에 s. settings(설정)는 배경이라 사람의 형편에는 안 씀","ex":[["The hotel is in [[beautiful surroundings]].","그 호텔은 [[아름다운 환경]]에 있다."],["Cats need time to get used to [[new surroundings]].","고양이는 [[새로운 환경]]에 익숙해질 시간이 필요하다."],["Children learn from [[their surroundings]].","아이들은 [[자신의 주변 환경]]에서 배운다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"summary","a":"3","e":"summary (명) 요약 - summarize (동) 요약하다\n③ terror (명) 공포 - terrify (동) 겁먹게 하다","w":"① deep (형) 깊은 - deepen (동) 깊게 하다\n② short (형) 짧은 - shorten (동) 짧게 하다\n④ weak (형) 약한 - weaken (동) 약하게 하다","m":0,"s":"summary - summarize","c":["deep - deepen","short - shorten","terror - terrify","weak - weaken"],"mn":"요약","hk":"명사에서 동사로: summary(요약)에서 summarize(요약하다)처럼 terror(공포)에서 terrify(겁먹게 하다). 나머지는 형용사 출발","ex":[["Write [[a short summary]] of the story.","그 이야기의 [[짧은 요약]]을 써라.","summary (명) 요약"],["Can you [[summarize the story]]?","[[그 이야기를 요약해]] 줄 수 있니?","summarize (동) 요약하다"],["She screamed in [[terror]].","그녀는 [[공포]]에 질려 비명을 질렀다.","terror (명) 공포"],["Loud thunder can [[terrify]] small dogs.","큰 천둥소리는 작은 개를 [[겁먹게 할]] 수 있다.","terrify (동) 겁먹게 하다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"relieved","a":"1","e":"① relieved: 안도하는, 다행으로 여기는 (그녀는 아들이 공항에 무사히 도착했다는 말을 듣고 안도했다.)","w":"② depressed: 우울한\n③ anxious: 불안해하는, 걱정하는\n④ annoyed: 짜증이 난","k":"그녀는 아들이 공항에 무사히 도착했다는 말을 듣고 안도했다.","m":0,"s":"She was ________ to hear that her son had arrived safely at the airport.","c":["relieved","depressed","anxious","annoyed"],"mn":"안도하는, 다행으로 여기는","hk":"relieved(안도하는)는 걱정이 풀린 기분. anxious(불안해하는), depressed(우울한), annoyed(짜증이 난)는 무사 도착 소식과 반대","ex":[["I was [[relieved to hear]] the good news.","나는 좋은 소식을 [[듣고 안도했다]]."],["She felt [[very relieved]] after the exam.","그녀는 시험 후에 [[매우 안도했다]]."],["We were [[relieved]] that nobody was hurt.","아무도 다치지 않아서 우리는 [[안도했다]]."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"theory","a":"4","e":"④ theory: 이론","w":"① formula: 공식\n② experiment: 실험\n③ evidence: 증거","m":0,"s":"theory","c":["공식","실험","증거","이론"],"mn":"이론","hk":"theory(이론)는 현상을 설명하는 생각의 틀. experiment(실험)와 evidence(증거)는 확인하는 쪽, formula(공식)는 계산에 쓰는 식","ex":[["Darwin's [[theory of evolution]] is famous.","다윈의 [[진화론]]은 유명하다."],["She has [[a theory]] about why cats purr.","그녀는 고양이가 왜 가르랑거리는지에 대한 [[이론]]이 있다."],["[[In theory]], the plan should work.","[[이론적으로는]] 그 계획이 통해야 한다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"generous","a":"2,3","e":"② selfish: 이기적인 (그녀의 후한 기부금이 도서관 건물 전체의 비용을 댔다.) / generous(너그러운, 인심 좋은)의 반의어.\n③ greedy: 탐욕스러운","w":"① kind: 친절한\n④ charitable: 자비로운, 관대한","k":"그녀의 후한 기부금이 도서관 건물 전체의 비용을 댔다.","m":2,"s":"Her generous donation paid for the whole library building.","h":"generous","c":["kind","selfish","greedy","charitable"],"mn":"너그러운, 인심 좋은","hk":"generous(너그러운)의 반대편은 selfish(이기적인)와 greedy(탐욕스러운), 정답 2개. kind(친절한)와 charitable(자비로운)은 같은 편","ex":[["He is [[a generous man]] who shares his food.","그는 음식을 나누는 [[너그러운 사람]]이다.","generous (형) 너그러운, 인심 좋은"],["It was [[a selfish act]] to take it all.","전부 가져가는 것은 [[이기적인 행동]]이었다.","selfish (형) 이기적인"],["[[The greedy king]] took all the gold.","[[탐욕스러운 왕]]은 금을 모두 가져갔다.","greedy (형) 탐욕스러운"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"landmark","a":"1","e":"① landmark: (건물이나 장소 / 알아보기 쉬운 / 그리고 사람들이 자신이 어디에 있는지 알도록 돕는) 랜드마크, 주요 지표","w":"② signpost: 표지판\n③ milestone: 이정표\n④ checkpoint: 검문소","k":"건물이나 장소 / 알아보기 쉬운 / 그리고 사람들이 자신이 어디에 있는지 알도록 돕는","m":0,"s":"\"a building or place that is easy to recognize and helps people know where they are\"","c":["landmark","signpost","milestone","checkpoint"],"mn":"랜드마크, 주요 지표","hk":"landmark(랜드마크)는 눈에 잘 띄어 위치를 알려 주는 건물이나 장소. signpost(표지판), milestone(이정표), checkpoint(검문소)는 오답","ex":[["The tower is [[a famous landmark]] in Paris.","그 탑은 파리의 [[유명한 랜드마크]]이다."],["We used the old tree as [[a landmark]].","우리는 그 오래된 나무를 [[길잡이 표지]]로 삼았다."],["The museum is [[a local landmark]].","그 박물관은 [[지역 랜드마크]]이다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"habit","a":"2","e":"② habit: 습관, 버릇 (일어나는 순간 휴대전화를 확인하는 것이 그의 나쁜 습관이 되었다.)","w":"① hobby: 취미\n③ manner: 태도, 방식\n④ duty: 의무, 임무","k":"일어나는 순간 휴대전화를 확인하는 것이 그의 나쁜 습관이 되었다.","m":0,"s":"Checking his phone the moment he wakes up has become a bad ________.","c":["hobby","habit","manner","duty"],"mn":"습관, 버릇","hk":"habit(습관)는 bad(나쁜) habit(나쁜 습관) 짝으로 기억. hobby(취미), manner(태도), duty(의무)는 반복해서 굳은 행동이 아님","ex":[["Biting your nails is [[a bad habit]].","손톱을 물어뜯는 것은 [[나쁜 습관]]이다."],["Reading every night became [[a good habit]].","매일 밤 책 읽기는 [[좋은 습관]]이 되었다."],["Try to [[break the habit]] of eating late.","늦게 먹는 [[습관을 깨려고]] 노력해라."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"insult","a":"2","e":"② offend: 모욕하다, 기분을 상하게 하다 (그는 부주의한 농담으로 누구도 모욕할 생각이 아니었다.) / insult(모욕하다, 무례하게 굴다)의 유의어.","w":"① scold: 야단치다, 꾸짖다\n③ praise: 칭찬하다\n④ blame: 비난하다, 탓하다","k":"그는 부주의한 농담으로 누구도 모욕할 생각이 아니었다.","m":0,"s":"He did not mean to insult anyone with his careless joke.","h":"insult","c":["scold","offend","praise","blame"],"mn":"모욕하다, 무례하게 굴다","hk":"insult(모욕하다)는 offend(기분을 상하게 하다)와 같은 편. praise(칭찬하다)는 반대, scold(야단치다)와 blame(탓하다)은 다른 뜻","ex":[["Never [[insult your friends]] in public.","사람들 앞에서 [[친구를 모욕하지]] 마라."],["She was [[insulted]] by his rude words.","그녀는 그의 무례한 말에 [[모욕을 느꼈다]]."],["It is rude to [[insult the cook]].","[[요리사를 모욕하는]] 것은 무례하다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"union","a":"union","e":"union 연합, 조합","k":"노동자 조합은 더 짧은 근무 시간과 더 안전한 기계를 요구했다.","m":0,"s":"The workers' u______ demanded shorter hours and safer machines.","mn":"연합, 조합","hk":"union(조합)은 uni(하나)에서 온 말로 하나로 뭉친 단체. 철자 순서는 u-n-i-o-n","ex":[["Teachers formed [[a union]] to protect their rights.","교사들은 권리를 지키려고 [[조합]]을 만들었다."],["He is [[a union member]] at the factory.","그는 그 공장의 [[조합원]]이다."],["[[The European Union]] has many member countries.","[[유럽 연합]]은 많은 회원국을 두고 있다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"attend","a":"3","e":"①참석하다 / ②참석하다 / ③돌보다, 간호하다 / ④참석하다 [③번만 의미가 다름]","k":"①그녀는 폭풍 때문에 사촌의 결혼식에 참석할 수 없었다.\n②오백 명이 넘는 사람들이 개막식에 참석했다.\n③간호사 두 명이 구급차가 도착할 때까지 부상당한 운전자를 돌보았다.\n④모든 회원은 금요일 안전 회의에 참석할 것으로 기대된다.","m":0,"c":["She could not attend her cousin's wedding because of the storm.","More than five hundred people attended the opening ceremony.","Two nurses attended the injured driver until the ambulance arrived.","Every member is expected to attend the safety meeting on Friday."],"hc":"attend|attended|attended|attend","mn":"참석하다 / 돌보다, 간호하다","hk":"③번만 attend(돌보다, 간호하다)이고 나머지는 attend(참석하다). meeting(회의)이나 wedding(결혼식) 같은 행사와 붙으면 참석","ex":[["Nearly all students [[attended the meeting]].","거의 모든 학생이 [[회의에 참석했다]].","attend (동) 참석하다"],["We will [[attend the wedding]] on Saturday.","우리는 토요일에 [[결혼식에 참석할]] 것이다.","attend (동) 참석하다"],["A doctor [[attended the sick child]] all night.","의사가 밤새 [[아픈 아이를 돌보았다]].","attend (동) 돌보다, 간호하다"]]}]},{"day":61,"q":[{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"combine","a":"4","e":"④ separate: 나누다, 분리하다 (그 요리사는 크림을 만들기 위해 달걀, 우유, 설탕을 결합할 것이다.) / combine(결합하다, 합치다)의 반의어.","w":"① join: 잇다, 연결하다\n② mix: 섞다\n③ unite: 결속시키다, 단결시키다","k":"그 요리사는 크림을 만들기 위해 달걀, 우유, 설탕을 결합할 것이다.","m":0,"s":"The chef will combine eggs, milk, and sugar to make the cream.","h":"combine","c":["join","mix","unite","separate"],"mn":"결합하다, 합치다","hk":"combine(결합하다)의 반대편은 separate(분리하다). join(잇다), mix(섞다), unite(결속시키다)는 모두 같은 편의 함정.","ex":[["We can [[combine work and fun]] on this trip.","이번 여행에서 우리는 [[일과 재미를 결합할]] 수 있다.","combine (동) 결합하다, 합치다"],["Please [[combine the flour and sugar]] in a large bowl.","큰 그릇에 [[밀가루와 설탕을 합쳐]] 주세요.","combine (동) 결합하다, 합치다"],["[[Separate the white from the yolk]] first.","먼저 [[흰자와 노른자를 분리하세요]].","separate (동) 나누다, 분리하다"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"observe","a":"2","e":"② ignore: 무시하다 (연구원들은 매일 아침 숨겨진 텐트에서 야생 조류를 관찰한다.) / observe(관찰하다, 지켜보다)의 반의어.","w":"① notice: 알아차리다\n③ examine: 살펴보다, 조사하다\n④ inspect: 점검하다, 검사하다","k":"연구원들은 매일 아침 숨겨진 텐트에서 야생 조류를 관찰한다.","m":0,"s":"The researchers observe the wild birds from a hidden tent every morning.","h":"observe","c":["notice","ignore","examine","inspect"],"mn":"관찰하다, 지켜보다","hk":"observe(관찰하다)의 반대편은 ignore(무시하다). notice(알아차리다), examine(살펴보다), inspect(점검하다)는 눈여겨보는 같은 편.","ex":[["Children [[observe their parents]] and copy them.","아이들은 [[부모를 관찰하고]] 따라 한다.","observe (동) 관찰하다, 지켜보다"],["We [[observe the moon]] through a small telescope.","우리는 작은 망원경으로 [[달을 관찰한다]].","observe (동) 관찰하다, 지켜보다"],["Don't [[ignore the warning sign]].","[[경고 표지판을 무시하지]] 마세요.","ignore (동) 무시하다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"tradition","a":"1","e":"① tradition: 전통 (가족의 요리법을 어머니에게서 딸에게 물려주는 것은 오래된 한국의 전통이다.)","w":"② rumor: 소문\n③ myth: 신화\n④ legend: 전설","k":"가족의 요리법을 어머니에게서 딸에게 물려주는 것은 오래된 한국의 전통이다.","m":0,"s":"Passing down family recipes from mother to daughter is an old Korean ________.","c":["tradition","rumor","myth","legend"],"mn":"전통","hk":"tradition(전통)은 대대로 이어 온 풍습. rumor(소문), myth(신화), legend(전설)는 이야기라서 물려주는 요리법과 안 맞는 오답.","ex":[["Eating rice cake soup on New Year's Day is [[a Korean tradition]].","설날에 떡국을 먹는 것은 [[한국의 전통]]이다."],["[[Family traditions]] make holidays special.","[[가족의 전통]]은 휴일을 특별하게 만든다."],["The town follows [[an old tradition]] of lighting lanterns.","그 마을은 등불을 밝히는 [[오랜 전통]]을 따른다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"gravity","a":"1","e":"① gravity: 중력 (물체가 땅으로 떨어지는 것은 중력이 그것들을 지구 쪽으로 끌어당기기 때문이다.)","w":"② motion: 움직임, 운동\n③ heat: 열\n④ magnet: 자석","k":"물체가 땅으로 떨어지는 것은 중력이 그것들을 지구 쪽으로 끌어당기기 때문이다.","m":0,"s":"Objects fall to the ground because ________ pulls them toward the earth.","c":["gravity","motion","heat","magnet"],"mn":"중력","hk":"gravity(중력)는 물체를 땅으로 끌어당기는 힘. magnet(자석)은 쇠를 당길 뿐이라 함정, motion(움직임)과 heat(열)도 오답.","ex":[["[[The force of gravity]] keeps us on the ground.","[[중력의 힘]]이 우리를 땅 위에 붙어 있게 한다."],["The moon has less [[gravity]] than the earth.","달은 지구보다 [[중력]]이 약하다."],["Astronauts float in [[zero gravity]].","우주비행사들은 [[무중력]] 상태에서 떠다닌다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"accomplish","a":"4","e":"accomplish (동) 성취하다, 이루다 - accomplishment (명) 성과, 달성\n④ reduce (동) 줄이다, 낮추다 - reduction (명) 축소, 감소","w":"① ambitious (형) 야심 있는 - ambition (명) 야망\n② flexible (형) 유연한 - flexibility (명) 유연성\n③ jealous (형) 질투하는 - jealousy (명) 질투","m":0,"s":"accomplish - accomplishment","c":["ambitious - ambition","flexible - flexibility","jealous - jealousy","reduce - reduction"],"mn":"성취하다, 이루다","hk":"accomplish(성취하다)와 accomplishment(성과)는 동사에서 명사로 바뀐 짝. reduce(줄이다)와 reduction(감소)만 같은 방향, 나머지는 형용사에서 명사.","ex":[["She worked hard to [[accomplish her goal]].","그녀는 [[목표를 이루려고]] 열심히 노력했다.","accomplish (동) 성취하다, 이루다"],["Winning the prize was [[a great accomplishment]].","그 상을 받은 것은 [[큰 성과]]였다.","accomplishment (명) 성과, 달성"],["We should [[reduce plastic waste]].","우리는 [[플라스틱 쓰레기를 줄여야]] 한다.","reduce (동) 줄이다, 낮추다"],["The shop announced [[a price reduction]].","그 가게는 [[가격 인하]]를 알렸다.","reduction (명) 축소, 감소"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"surface","a":"4","e":"④ outside: 바깥쪽, 겉면 (두꺼운 먼지가 오래된 나무 상자의 표면을 덮고 있었다.) / surface(표면, 겉면)의 유의어.","w":"① layer: 층\n② corner: 모서리, 구석\n③ bottom: 바닥","k":"두꺼운 먼지가 오래된 나무 상자의 표면을 덮고 있었다.","m":0,"s":"Thick dust covered the surface of the old wooden box.","h":"surface","c":["layer","corner","bottom","outside"],"mn":"표면, 겉면","hk":"surface(표면)와 outside(바깥쪽, 겉면)는 겉에 보이는 면이라는 같은 편. layer(층)는 겹, corner(모서리)와 bottom(바닥)은 특정 부분이라 오답.","ex":[["[[The surface of the table]] is very smooth.","[[탁자의 표면]]은 매우 매끄럽다."],["Oil floats on [[the surface of water]].","기름은 [[물의 표면]] 위에 뜬다."],["The road has [[a rough surface]].","그 길은 [[거친 표면]]을 가지고 있다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"alliance","a":"4","e":"④ alliance: 동맹, 연합","w":"① treaty: 조약\n② rivalry: 경쟁, 대립\n③ negotiation: 협상","m":0,"s":"alliance","c":["조약","경쟁, 대립","협상","동맹, 연합"],"mn":"동맹, 연합","hk":"alliance(동맹)는 같은 편으로 손잡은 관계. treaty(조약)는 약속 문서, rivalry(경쟁)는 맞서는 사이, negotiation(협상)은 조율 과정이라 오답.","ex":[["The two countries formed [[an alliance]].","두 나라는 [[동맹]]을 맺었다."],["They signed [[a military alliance]] last year.","그들은 작년에 [[군사 동맹]]에 서명했다."],["The king decided to [[break the alliance]].","왕은 [[동맹을 깨기로]] 결정했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"scholarship","a":"scholarship","e":"scholarship 장학금","k":"그녀의 우수한 성적은 그녀에게 명문 대학의 전액 장학금을 안겨 주었다.","m":0,"s":"Her excellent grades won her a full s______ to a top university.","mn":"장학금","hk":"scholarship(장학금)은 scholar(학자)에 접미사 -ship을 붙인 모양. sch로 시작하고 끝의 -ship을 빠뜨리지 않기.","ex":[["She won [[a full scholarship]] to college.","그녀는 대학 [[전액 장학금]]을 받았다."],["He decided to [[apply for a scholarship]].","그는 [[장학금을 신청하기로]] 결정했다."],["Only five students can [[receive a scholarship]] this year.","올해 다섯 명의 학생만 [[장학금을 받을]] 수 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"ban","a":"3,4","e":"③ stop: 막다, 못하게 하다\n④ block: 저지하다, 막다 (시의회는 오래된 시장 거리에 자동차가 들어오는 것을 금지하기로 결정했다.) / ban(금지하다)의 유의어.","w":"① warn: 경고하다\n② punish: 처벌하다","k":"시의회는 오래된 시장 거리에 자동차가 들어오는 것을 금지하기로 결정했다.","m":2,"s":"The city council decided to ban cars from entering the old market street.","h":"ban","c":["warn","punish","stop","block"],"mn":"금지하다","hk":"ban(금지하다)은 못 하게 막는 것. stop(막다)과 block(저지하다)이 같은 편, warn(경고하다)과 punish(처벌하다)는 막는 게 아니라 알리거나 벌주는 오답.","ex":[["The school will [[ban phones]] in class.","학교는 수업 중 [[휴대폰을 금지할]] 것이다."],["Many countries [[ban smoking]] in restaurants.","많은 나라가 식당 내 [[흡연을 금지한다]]."],["The government plans to [[ban the sale of fireworks]].","정부는 [[폭죽 판매를 금지할]] 계획이다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"curriculum","a":"1","e":"① curriculum: (과목과 과정의 전체 묶음 / 학교가 계획하고 가르치는) 교육 과정","w":"② faculty: 교수진, 학부\n③ semester: 학기\n④ campus: 캠퍼스, 교정","k":"과목과 과정의 전체 묶음 / 학교가 계획하고 가르치는","m":0,"s":"\"the whole set of subjects and courses that a school plans and teaches\"","c":["curriculum","faculty","semester","campus"],"mn":"교육 과정","hk":"curriculum(교육 과정)은 학교가 계획해 가르치는 과목 전체. faculty(교수진)는 사람들, semester(학기)는 기간, campus(캠퍼스)는 장소라 오답.","ex":[["The school changed [[its curriculum]] this year.","그 학교는 올해 [[교육 과정]]을 바꿨다."],["Music is part of [[the school curriculum]].","음악은 [[학교 교육 과정]]의 일부이다."],["In Korea, schools follow [[the national curriculum]].","한국의 학교들은 [[국가 교육 과정]]을 따른다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"stereotype","a":"3","e":"③ stereotype: 고정관념","w":"① instinct: 본능\n② insight: 통찰력\n④ assessment: 평가","m":0,"s":"\"고정관념\"","c":["instinct","insight","stereotype","assessment"],"mn":"고정관념","hk":"stereotype(고정관념)은 한 집단을 모두 똑같다고 단정하는 굳은 생각. instinct(본능), insight(통찰력), assessment(평가)는 뜻이 달라 오답.","ex":[["That is [[a common stereotype]] about teenagers.","그것은 십 대에 대한 [[흔한 고정관념]]이다."],["We should break [[gender stereotypes]].","우리는 [[성별 고정관념]]을 깨야 한다."],["She tried to [[challenge the stereotype]].","그녀는 그 [[고정관념에 도전하려]] 했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"expedition","a":"expedition","e":"expedition 원정, 탐험","k":"그 팀은 남극으로의 원정을 준비하는 데 2년을 보냈다.","m":0,"s":"The team spent two years preparing an e______ to the South Pole.","mn":"원정, 탐험","hk":"expedition(원정, 탐험)은 ex-pe-di-tion 네 박자로 끊어 철자 기억. 가운데 pe를 빠뜨리지 않는 것이 포인트.","ex":[["The team prepared for [[an expedition]] to the jungle.","그 팀은 정글로의 [[원정]]을 준비했다."],["[[A scientific expedition]] left yesterday.","[[과학 탐험]]이 어제 출발했다."],["They [[went on an expedition]] across the desert.","그들은 사막을 가로지르는 [[원정을 떠났다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"tuition","a":"4","e":"④ tuition: (돈 / 학생이 학교나 대학에 반드시 내야 하는 / 가르침에 대한 대가로) 등록금","w":"① fare: (교통) 요금\n② salary: 월급, 봉급\n③ bonus: 상여금, 보너스","k":"돈 / 학생이 학교나 대학에 반드시 내야 하는 / 가르침에 대한 대가로","m":0,"s":"\"the money that a student must pay to a school or college in return for teaching\"","c":["fare","salary","bonus","tuition"],"mn":"등록금","hk":"tuition(등록금)은 가르침의 대가로 학교에 내는 돈. fare(요금)는 교통 요금, salary(월급)와 bonus(보너스)는 받는 돈이라 오답.","ex":[["Many students work to pay [[their tuition]].","많은 학생들이 [[등록금]]을 내려고 일한다."],["Students protested [[a tuition increase]].","학생들은 [[등록금 인상]]에 항의했다."],["[[Tuition fees]] went up again this year.","올해 다시 [[등록금]]이 올랐다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"classic","a":"classic","e":"classic (명) 고전 / (형) 전형적인, 고전적인","k":"그 흑백 영화는 이제 세계 영화의 고전으로 연구된다.\n준비 운동을 건너뛰는 것은 어린 운동선수들 사이에서 전형적인 실수이다.","m":0,"s":"The black-and-white film is now studied as a c______ of world cinema.\nSkipping the warm-up is a c______ mistake among young athletes.","mn":"고전 / 전형적인, 고전적인","hk":"classic(고전, 전형적인)은 같은 철자로 명사 고전과 형용사 전형적인의 두 쓰임. 뒤에 명사가 바로 따라오면 형용사.","ex":[["The novel is now [[a classic]] of Korean literature.","그 소설은 이제 한국 문학의 [[고전]]이다.","classic (명) 고전"],["She wore [[a classic black dress]].","그녀는 [[고전적인 검은 드레스]]를 입었다.","classic (형) 전형적인, 고전적인"],["That was [[a classic mistake]] for beginners.","그것은 초보자들의 [[전형적인 실수]]였다.","classic (형) 전형적인, 고전적인"]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"reason","a":"1","e":"①이성, 사리분별 / ②이유, 까닭 / ③이유, 까닭 / ④이유, 까닭 [①번만 의미가 다름]","k":"①그 노인은 사고 후에 서서히 이성을 잃었다.\n②내일 시험에 대해 걱정할 이유가 없다.\n③갑작스러운 결석의 이유를 나에게 말해 주세요.\n④지연의 주된 이유는 폭설이었다.","m":0,"c":["The old man slowly lost his reason after the accident.","There is no reason to worry about tomorrow's test.","Please tell me the reason for your sudden absence.","The main reason for the delay was the heavy snow."],"hc":"reason|reason|reason|reason","mn":"이유, 까닭 / 이성, 사리분별","hk":"reason(이유, 까닭)은 대부분 까닭이지만, lose one's reason(이성을 잃다)처럼 쓰이면 이성, 사리분별. 다른 뜻은 첫 번째 문장 하나뿐.","ex":[["The old man slowly [[lost his reason]] after the accident.","그 노인은 사고 후에 서서히 [[이성을 잃었다]].","reason (명) 이성, 사리분별"],["There is [[no reason to worry]] about the test.","시험에 대해 [[걱정할 이유가 없다]].","reason (명) 이유, 까닭"],["Please tell me [[the reason for your absence]].","[[결석 이유]]를 말해 주세요.","reason (명) 이유, 까닭"]]}]},{"day":62,"q":[{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"gesture","a":"2","e":"② gesture: 몸짓, 제스처 (그녀는 우리에게 조용히 하라고 손으로 작은 몸짓을 했다.)","w":"① whisper: 속삭임\n③ posture: 자세\n④ gaze: 응시, 시선","k":"그녀는 우리에게 조용히 하라고 손으로 작은 몸짓을 했다.","m":0,"s":"She made a small ________ with her hand to tell us to be quiet.","c":["whisper","gesture","posture","gaze"],"mn":"몸짓, 제스처","hk":"gesture(몸짓)는 손이나 몸으로 하는 신호. whisper(속삭임)는 소리, posture(자세)는 몸의 모양, gaze(응시)는 눈빛이라 손으로 한 동작과 안 맞는 오답.","ex":[["He made [[a friendly gesture]] to the visitors.","그는 방문객들에게 [[친근한 몸짓]]을 했다."],["She pointed to the door with [[a hand gesture]].","그녀는 [[손짓]]으로 문을 가리켰다."],["Nodding is [[a common gesture]] for yes.","고개를 끄덕이는 것은 승낙을 뜻하는 [[흔한 몸짓]]이다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"orbit","a":"orbit","e":"orbit (명) 궤도 / (동) 궤도를 돌다","k":"그 인공위성은 그 행성 주위의 안정적인 궤도에 머물러야 한다.\n달이 지구를 한 바퀴 도는 데 약 27일이 걸린다.","m":0,"s":"The satellite must stay in a stable o______ around the planet.\nIt takes the moon about 27 days to o______ the earth once.","mn":"궤도 / 궤도를 돌다","hk":"orbit(궤도, 궤도를 돌다)은 철자가 같은 명사와 동사. 명사는 도는 길, 동사는 그 길을 따라 돌다.","ex":[["The satellite stays in [[a stable orbit]].","그 인공위성은 [[안정적인 궤도]]에 머문다.","orbit (명) 궤도"],["[[Earth's orbit]] is almost a circle.","[[지구의 궤도]]는 거의 원에 가깝다.","orbit (명) 궤도"],["The earth takes a year to [[orbit the sun]].","지구는 [[태양을 도는]] 데 1년이 걸린다.","orbit (동) 궤도를 돌다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"curiosity","a":"3","e":"③ curiosity: (강한 감정 / 어떤 것에 대해 알거나 배우고 싶어 하는) 호기심","w":"① anxiety: 불안, 걱정\n② patience: 인내심\n④ sympathy: 동정, 공감","k":"강한 감정 / 어떤 것에 대해 알거나 배우고 싶어 하는","m":0,"s":"\"a strong feeling of wanting to know or learn about something\"","c":["anxiety","patience","curiosity","sympathy"],"mn":"호기심","hk":"curiosity(호기심)는 알고 싶어 하는 강한 마음. anxiety(불안)와 sympathy(동정)는 다른 감정, patience(인내심)는 기다리는 힘이라 오답.","ex":[["Children have [[great curiosity]] about everything.","아이들은 모든 것에 [[큰 호기심]]을 갖는다."],["She asked questions [[out of curiosity]].","그녀는 [[호기심에서]] 질문을 했다."],["Read this book to [[satisfy your curiosity]].","이 책을 읽고 [[호기심을 채우세요]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"react","a":"react","e":"※ respond는 ‘(질문·요청에) 답하다’라서 화학 반응에는 쓸 수 없다. react with가 굳어진 표현.","k":"이 두 화학 물질은 서로 반응해서 새로운 물질을 만들어 낸다.","m":0,"s":"These two chemicals r______ with each other to produce a new substance.","hk":"react(반응하다)는 re(다시)와 act(행동하다)를 합친 철자. 화학 반응은 react with(~와 반응하다)이고 respond(답하다)는 오답.","ex":[["These chemicals [[react with water]].","이 화학 물질은 [[물과 반응한다]]."],["She did not [[react to the joke]].","그녀는 [[농담에 반응하지]] 않았다."],["Don't [[react angrily]].","[[화내며 반응하지]] 마세요."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"mechanism","a":"mechanism","e":"mechanism 기계 장치, 메커니즘","k":"기술자들은 비행 전에 문의 잠금 장치를 점검했다.","m":0,"s":"Engineers checked the locking m______ of the door before the flight.","mn":"기계 장치, 메커니즘","hk":"mechanism(기계 장치, 메커니즘)은 끝이 ism으로 끝나는 철자. mechanic(정비공)처럼 ic로 끝내지 않는 것이 포인트.","ex":[["The door has [[a locking mechanism]].","그 문에는 [[잠금 장치]]가 있다."],["The watch has [[a complex mechanism]].","그 시계는 [[복잡한 장치]]를 가지고 있다."],["The body has a natural [[defense mechanism]].","몸에는 자연적인 [[방어 메커니즘]]이 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"decrease","a":"1,3","e":"① drop: 떨어지다, 줄다 (그 마을 학교의 학생 수는 작년부터 줄어들기 시작했다.) / decrease(감소하다, 줄다)의 유의어.\n③ shrink: 줄어들다","w":"② rise: 오르다, 증가하다\n④ climb: 올라가다","k":"그 마을 학교의 학생 수는 작년부터 줄어들기 시작했다.","m":2,"s":"The number of students in the village school began to decrease last year.","h":"decrease","c":["drop","rise","shrink","climb"],"mn":"감소하다, 줄다","hk":"decrease(감소하다)는 줄어드는 방향. drop(떨어지다)과 shrink(줄어들다)가 같은 편, rise(오르다)와 climb(올라가다)는 반대 방향의 오답.","ex":[["Sales [[decreased by ten percent]] last month.","지난달 매출이 [[10퍼센트 줄었다]]."],["Eating less sugar can [[decrease the risk]] of illness.","설탕을 덜 먹으면 병의 [[위험을 줄일]] 수 있다."],["The ice began to [[decrease in size]].","얼음의 [[크기가 줄기]] 시작했다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"debt","a":"1","e":"① debt: 빚, 부채 (그는 자신의 막대한 빚을 갚기 위해 수년간 두 가지 일을 했다.)","w":"② fund: 기금, 자금\n③ wealth: 재산, 부\n④ savings: 저축, 예금","k":"그는 자신의 막대한 빚을 갚기 위해 수년간 두 가지 일을 했다.","m":0,"s":"He worked two jobs for years to pay off his huge ________.","c":["debt","fund","wealth","savings"],"mn":"빚, 부채","hk":"debt(빚, 부채)는 갚아야 할 돈. fund(기금), wealth(재산), savings(저축)는 쌓아 둔 돈이라 pay off(다 갚다)와 안 맞는 오답.","ex":[["He worked hard to [[pay off his debt]].","그는 [[빚을 갚으려고]] 열심히 일했다."],["Many students graduate [[in debt]].","많은 학생이 [[빚을 진 채]] 졸업한다."],["The country has [[a huge debt]].","그 나라는 [[막대한 부채]]를 가지고 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"lead","a":"4","e":"④ guide: 안내하다 (지역 관리인이 방문객들을 숲길로 안내할 것이다.) / lead(이끌다, 안내하다)의 유의어.","w":"① abandon: 버리다, 버려두다\n② follow: 따라가다\n③ serve: 시중들다, 봉사하다","k":"지역 관리인이 방문객들을 숲길로 안내할 것이다.","m":0,"s":"A local ranger will lead the visitors through the forest trail.","h":"lead","c":["abandon","follow","serve","guide"],"mn":"이끌다, 안내하다","hk":"lead(이끌다, 안내하다)는 앞서 길을 보여 주는 것. guide(안내하다)가 같은 편, follow(따라가다)는 반대 방향, abandon(버리다)과 serve(시중들다)는 다른 뜻.","ex":[["She will [[lead the visitors]] to the museum.","그녀는 [[방문객들을 안내해]] 박물관으로 갈 것이다."],["He [[led the way]] through the dark cave.","그는 어두운 동굴 속에서 [[길을 안내했다]]."],["He [[leads the team]] well.","그는 [[팀을 잘 이끈다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"rely","a":"4","e":"④ doubt: 의심하다 (소규모 농부들은 여전히 작물을 위해 비에 의존한다.) / rely(의지하다, 믿다)의 반의어.","w":"① believe: 믿다\n② depend: 의지하다\n③ trust: 믿다, 신뢰하다","k":"소규모 농부들은 여전히 작물을 위해 비에 의존한다.","m":0,"s":"Small farmers still rely on the rain for their crops.","h":"rely","c":["believe","depend","trust","doubt"],"mn":"의지하다, 믿다","hk":"rely(의지하다)는 믿고 기대는 것. 반대편은 doubt(의심하다). believe(믿다), depend(의지하다), trust(신뢰하다)는 모두 같은 편의 함정.","ex":[["You can [[rely on me]].","당신은 [[나를 믿어도]] 된다.","rely (동) 의지하다, 믿다"],["Farmers [[rely on rain]].","농부들은 [[비에 의존한다]].","rely (동) 의지하다, 믿다"],["I [[doubt]] that he is telling the truth.","나는 그가 진실을 말하고 있는지 [[의심한다]].","doubt (동) 의심하다"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"polite","a":"3","e":"polite (형) 예의 바른 - politely (부) 예의 바르게\n③ brave (형) 용감한 - bravely (부) 용감하게","w":"① amaze (동) 깜짝 놀라게 하다 - amazingly (부) 놀랄 만큼\n② increase (동) 증가하다 - increasingly (부) 점점 더\n④ surprise (동) 놀라게 하다 - surprisingly (부) 놀랍게도","m":0,"s":"polite - politely","c":["amaze - amazingly","increase - increasingly","brave - bravely","surprise - surprisingly"],"mn":"예의 바른","hk":"polite(예의 바른)와 politely(예의 바르게)는 형용사에서 부사로 바뀐 짝. brave(용감한)와 bravely(용감하게)가 같은 방향, 나머지는 동사에서 부사.","ex":[["He is [[polite to everyone]].","그는 [[모두에게 예의 바르다]].","polite (형) 예의 바른"],["She [[politely refused]] the offer.","그녀는 그 제안을 [[정중하게 거절했다]].","politely (부) 예의 바르게"],["It takes [[a brave person]] to speak up.","목소리를 내려면 [[용감한 사람]]이어야 한다.","brave (형) 용감한"],["The soldiers [[fought bravely]].","군인들은 [[용감하게 싸웠다]].","bravely (부) 용감하게"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"active","a":"2","e":"② lazy: 게으른 (우리 할머니는 연세에 비해 여전히 매우 활동적이시다.) / active(활동적인, 활발한)의 반의어.","w":"① energetic: 활기 넘치는\n③ busy: 바쁜\n④ lively: 활발한","k":"우리 할머니는 연세에 비해 여전히 매우 활동적이시다.","m":0,"s":"My grandmother is still very active for her age.","h":"active","c":["energetic","lazy","busy","lively"],"mn":"활동적인, 활발한","hk":"active(활동적인)의 반대편은 lazy(게으른). energetic(활기 넘치는)과 lively(활발한)는 같은 편이고, busy(바쁜)는 일이 많은 상태라 함정.","ex":[["He leads [[an active life]].","그는 [[활동적인 삶]]을 산다.","active (형) 활동적인, 활발한"],["She is [[active in]] school clubs.","그녀는 학교 동아리에서 [[활발하게 활동한다]].","active (형) 활동적인, 활발한"],["He was [[too lazy to clean]] his room.","그는 방을 [[청소하기엔 너무 게을렀다]].","lazy (형) 게으른"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"horizon","a":"4","e":"④ horizon: (멀리 떨어져 있는 선 / 하늘이 땅이나 바다와 맞닿는 것처럼 보이는) 지평선, 수평선","w":"① border: 경계, 국경\n② shoreline: 해안선\n③ slope: 경사면, 비탈","k":"멀리 떨어져 있는 선 / 하늘이 땅이나 바다와 맞닿는 것처럼 보이는","m":0,"s":"\"the line far away where the sky seems to meet the land or the sea\"","c":["border","shoreline","slope","horizon"],"mn":"지평선, 수평선","hk":"horizon(지평선, 수평선)은 하늘과 땅이나 바다가 만나 보이는 먼 선. border(경계), shoreline(해안선), slope(비탈)는 실제 땅의 선이나 면이라 오답.","ex":[["The sun sank [[below the horizon]].","해가 [[지평선 아래로]] 졌다."],["A small boat appeared [[on the horizon]].","작은 배 한 척이 [[수평선 위에]] 나타났다."],["The desert stretched [[to the horizon]].","사막이 [[지평선까지]] 펼쳐졌다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"civilization","a":"4","e":"④ civilization: 문명","w":"① settlement: 정착지, 정착\n② population: 인구\n③ generation: 세대","m":0,"s":"\"문명\"","c":["settlement","population","generation","civilization"],"mn":"문명","hk":"civilization(문명)은 도시, 문자, 법을 갖춘 큰 사회. settlement(정착지), population(인구), generation(세대)은 일부 요소라 오답.","ex":[["Egypt is one of [[the oldest civilizations]].","이집트는 [[가장 오래된 문명]] 중 하나이다."],["[[Modern civilization]] depends on electricity.","[[현대 문명]]은 전기에 의존한다."],["Archaeologists found traces of [[a lost civilization]].","고고학자들은 [[사라진 문명]]의 흔적을 발견했다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"commerce","a":"1","e":"① commerce: 상업, 무역","w":"② agriculture: 농업\n③ economy: 경제, 경기\n④ finance: 재무, 금융","m":0,"s":"commerce","c":["상업, 무역","농업","경제, 경기","재무, 금융"],"mn":"상업, 무역","hk":"commerce(상업, 무역)는 물건을 사고파는 일. agriculture(농업), economy(경제), finance(금융)는 다른 분야나 전체 구조라 오답.","ex":[["The port grew rich through [[international commerce]].","그 항구는 [[국제 무역]]으로 부유해졌다."],["Online shopping is called [[electronic commerce]].","온라인 쇼핑은 [[전자 상거래]]라고 불린다."],["Good roads helped [[commerce]] grow.","좋은 도로는 [[상업]]이 성장하도록 도왔다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"atmosphere","a":"1","e":"①대기 / ②분위기 / ③분위기 / ④분위기 [①번만 의미가 다름]","k":"①두꺼운 기체층이 지구의 대기를 형성한다.\n②강가에 있는 그 작은 카페는 따뜻하고 친근한 분위기를 지니고 있다.\n③기말고사 전에 교실의 분위기가 긴장되었다.\n④부드러운 음악과 촛불이 저녁 식사에 편안한 분위기를 만들어 냈다.","m":0,"c":["A thick blanket of gases forms the earth's atmosphere.","The small café near the river has a warm and friendly atmosphere.","The atmosphere in the classroom became tense before the final exam.","Soft music and candles created a relaxing atmosphere at dinner."],"hc":"atmosphere|atmosphere|atmosphere|atmosphere","mn":"분위기 / 대기","hk":"atmosphere(분위기, 대기)는 느껴지는 기운이 분위기, 지구를 둘러싼 기체층이 대기. 첫 번째 문장만 대기 뜻.","ex":[["The earth's [[atmosphere]] is a thick blanket of gases.","지구의 [[대기]]는 두꺼운 기체층이다.","atmosphere (명) 대기"],["The café has [[a warm atmosphere]].","그 카페는 [[따뜻한 분위기]]를 지니고 있다.","atmosphere (명) 분위기"],["The room had [[a tense atmosphere]] before the exam.","시험 전 교실은 [[긴장된 분위기]]였다.","atmosphere (명) 분위기"]]}]},{"day":63,"q":[{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"conclude","a":"3","e":"③ conclude: 결론짓다, 끝내다 (세 시간의 토론 끝에, 회원들은 그 계획이 너무 위험하다고 결론지을 준비가 되어 있었다.)","w":"① review: 검토하다\n② interrupt: 방해하다, 가로막다\n④ postpone: 연기하다, 미루다","k":"세 시간의 토론 끝에, 회원들은 그 계획이 너무 위험하다고 결론지을 준비가 되어 있었다.","m":0,"s":"After three hours of debate, the members were ready to ________ that the plan was too risky.","c":["review","interrupt","conclude","postpone"],"mn":"결론짓다, 끝내다","hk":"conclude(결론짓다)는 conclude that(~라고 결론짓다)으로 기억. review(검토하다), interrupt(방해하다), postpone(연기하다)는 오답.","ex":[["We can [[conclude that]] the test was fair.","우리는 그 시험이 공정했다고 [[결론지을]] 수 있다."],["The speaker will [[conclude the meeting]] soon.","발표자는 곧 [[회의를 끝낼]] 것이다."],["He [[concluded his speech]] with a joke.","그는 농담으로 [[연설을 마무리했다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"feat","a":"feat","e":"feat 업적, 솜씨","k":"한겨울에 혼자 그 산을 오른 것은 놀라운 업적이었다.","m":0,"s":"Climbing that mountain alone in the middle of winter was an amazing f______.","mn":"업적, 솜씨","hk":"feat(업적, 솜씨)는 feet(발들)과 발음이 같은 짝. 업적 쪽은 ea, 발 쪽은 ee로 구분.","ex":[["Crossing the ocean alone was [[a great feat]].","혼자 바다를 건넌 것은 [[대단한 업적]]이었다."],["Building the bridge was [[an engineering feat]].","그 다리를 짓는 것은 [[공학적 위업]]이었다."],["Finishing the race in the rain was [[no small feat]].","빗속에서 경주를 마친 것은 [[보통 일이 아니었다]]."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"monument","a":"3","e":"③ monument: 기념물, 유적","w":"① statue: 조각상\n② tower: 탑\n④ shrine: 사당, 성지","m":0,"s":"\"기념물, 유적\"","c":["statue","tower","monument","shrine"],"mn":"기념물, 유적","hk":"monument(기념물, 유적)는 기억하려고 세운 큰 건조물. statue(조각상), tower(탑), shrine(사당)은 한 종류씩이라 넓은 뜻과 안 맞는 오답.","ex":[["The old castle is [[a national monument]].","그 옛 성은 [[국가 기념물]]이다."],["Rome has many [[historic monuments]].","로마에는 [[역사적 유적]]이 많다."],["They built [[a monument]] to the heroes.","그들은 영웅들을 위한 [[기념물]]을 세웠다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"priority","a":"3","e":"③ priority: (어떤 것 / 당신이 다른 무엇보다 더 중요하게 여기는 / 그리고 가장 먼저 처리하는) 우선순위","w":"① preference: 선호, 더 좋아함\n② standard: 기준, 표준\n④ purpose: 목적","k":"어떤 것 / 당신이 다른 무엇보다 더 중요하게 여기는 / 그리고 가장 먼저 처리하는","m":0,"s":"\"the thing that you treat as more important than anything else and deal with first\"","c":["preference","standard","priority","purpose"],"mn":"우선순위","hk":"priority(우선순위)는 prior(먼저의)에서 나온 단어로 가장 먼저 할 일. preference(선호), standard(기준), purpose(목적)는 먼저 처리한다는 뜻이 없는 오답.","ex":[["Safety is our [[first priority]].","안전이 우리의 [[최우선 사항]]이다."],["Health should [[take priority over]] work.","건강이 일보다 [[우선시되어야]] 한다."],["Hospitals [[give priority to]] serious patients.","병원은 중증 환자에게 [[우선권을 준다]]."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"civic","a":"4","e":"④ civic: 시민의","w":"① religious: 종교의\n② military: 군사의\n③ industrial: 산업의, 공업의","m":0,"s":"civic","c":["종교의","군사의","산업의, 공업의","시민의"],"mn":"시민의","hk":"civic(시민의)은 citizen(시민)과 한 가족인 단어. religious(종교의), military(군사의), industrial(산업의)은 시민과 관계없는 분야의 오답.","ex":[["Voting is [[a civic duty]].","투표는 [[시민의 의무]]이다."],["She joined [[a civic group]].","그녀는 [[시민 단체]]에 가입했다."],["The concert was held at [[the civic center]].","그 콘서트는 [[시민 회관]]에서 열렸다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"addicted","a":"3","e":"③ free: 자유로운, 얽매이지 않은 (많은 십 대들이 단 몇 주 만에 짧은 동영상 앱에 중독된다.) / addicted(중독된, 푹 빠진)의 반의어.","w":"① hooked: 푹 빠진\n② attached: 애착을 가진\n④ obsessed: 사로잡힌","k":"많은 십 대들이 단 몇 주 만에 짧은 동영상 앱에 중독된다.","m":0,"s":"Many teenagers become addicted to short video apps within just a few weeks.","h":"addicted","c":["hooked","attached","free","obsessed"],"mn":"중독된, 푹 빠진","hk":"addicted(중독된)는 빠져서 못 벗어나는 상태, 반대편은 free(자유로운). hooked(푹 빠진)와 obsessed(사로잡힌)는 같은 편, attached(애착을 가진)는 함정.","ex":[["He is [[addicted to online games]].","그는 [[온라인 게임에 중독되어]] 있다.","addicted (형) 중독된, 푹 빠진"],["Many people are [[addicted to caffeine]].","많은 사람들이 [[카페인에 중독되어]] 있다.","addicted (형) 중독된, 푹 빠진"],["After the treatment, he was [[free from addiction]].","치료 후 그는 [[중독에서 벗어났다]].","free (형) 자유로운, 얽매이지 않은"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"rough","a":"3","e":"rough (형) 거친, 고르지 못한 - roughly (부) 대략, 거칠게\n③ accurate (형) 정확한, 틀림없는 - accurately (부) 정확하게","w":"① coward (명) 겁쟁이 - cowardly (형) 겁이 많은\n② hour (명) 시간 - hourly (형) 매시간의\n④ time (명) 시간, 때 - timely (형) 시기적절한","m":0,"s":"rough - roughly","c":["coward - cowardly","hour - hourly","accurate - accurately","time - timely"],"mn":"거친, 고르지 못한","hk":"rough(거친)와 roughly(대략)는 형용사에서 부사로 바뀐 짝. accurate(정확한)와 accurately(정확하게)가 같은 방향, 나머지는 명사에서 형용사.","ex":[["We walked on [[a rough road]].","우리는 [[거친 길]]을 걸었다.","rough (형) 거친, 고르지 못한"],["It takes [[roughly an hour]].","[[대략 한 시간]]이 걸린다.","roughly (부) 대략, 거칠게"],["He gave [[an accurate answer]].","그는 [[정확한 답]]을 말했다.","accurate (형) 정확한, 틀림없는"],["The machine can [[measure accurately]].","그 기계는 [[정확하게 측정할]] 수 있다.","accurately (부) 정확하게"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"suspend","a":"4","e":"④ delay: 미루다, 연기하다 (그 회사는 더 많은 자금을 찾을 때까지 건축 사업을 중지해야 했다.) / suspend(중단하다, 유예하다)의 유의어.","w":"① proceed: 진행하다, 계속하다\n② launch: 시작하다, 착수하다\n③ extend: 늘리다, 연장하다","k":"그 회사는 더 많은 자금을 찾을 때까지 건축 사업을 중지해야 했다.","m":0,"s":"The company had to suspend the building project until more money was found.","h":"suspend","c":["proceed","launch","extend","delay"],"mn":"중단하다, 유예하다","hk":"suspend(중단하다)는 하던 일을 잠시 멈추는 것. delay(미루다)가 같은 편, proceed(진행하다)와 launch(시작하다)는 반대 방향, extend(늘리다)는 함정.","ex":[["The school will [[suspend classes]] because of the storm.","학교는 폭풍 때문에 [[수업을 중단할]] 것이다."],["The team had to [[suspend the search]].","수색대는 [[수색을 중단해야]] 했다."],["The airline [[suspended all flights]] for a week.","항공사는 일주일 동안 [[모든 항공편을 중단했다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"bold","a":"3,4","e":"③ shy: 수줍어하는, 소심한 (자신의 사업을 시작하겠다는 그녀의 대담한 결정은 조용한 가족들을 놀라게 했다.) / bold(대담한, 용감한)의 반의어.\n④ timid: 소심한, 겁이 많은","w":"① daring: 대담한, 겁 없는\n② fearless: 두려움 없는","k":"자신의 사업을 시작하겠다는 그녀의 대담한 결정은 조용한 가족들을 놀라게 했다.","m":2,"s":"Her bold decision to start her own business surprised her quiet family.","h":"bold","c":["daring","fearless","shy","timid"],"mn":"대담한, 용감한","hk":"bold(대담한)의 반대편은 shy(수줍어하는)와 timid(소심한). daring(대담한)과 fearless(두려움 없는)는 같은 편의 오답.","ex":[["It was [[a bold move]] to quit his job.","직장을 그만둔 것은 [[대담한 행동]]이었다.","bold (형) 대담한, 용감한"],["She is [[shy with strangers]].","그녀는 [[낯선 사람 앞에서 수줍어한다]].","shy (형) 수줍어하는, 소심한"],["The [[timid rabbit]] ran away.","[[겁 많은 토끼]]는 달아났다.","timid (형) 소심한, 겁이 많은"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"thesis","a":"thesis","e":"thesis 논문, 주제","k":"그녀는 기후 변화에 관한 졸업 논문을 쓰는 데 거의 2년을 보냈다.","m":0,"s":"She spent almost two years writing her graduation t______ on climate change.","mn":"논문, 주제","hk":"thesis(논문, 주제)는 th로 시작해 sis로 끝나는 철자. 복수형은 theses(논문들)로 sis가 ses로 바뀜.","ex":[["He wrote [[a master's thesis]] on robots.","그는 로봇에 관한 [[석사 논문]]을 썼다."],["The students must [[submit their thesis]] by May.","학생들은 5월까지 [[논문을 제출해야]] 한다."],["The main [[thesis]] of the essay is that sleep matters.","그 글의 핵심 [[주제]]는 잠이 중요하다는 것이다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"tip","a":"tip","e":"tip (명) 팁, 봉사료 / (명) 조언, 비결","k":"어떤 나라에서는 웨이터에게 후한 팁을 남기는 것이 예의로 여겨진다.\n우리 코치는 장거리를 달리는 동안 숨 쉬는 방법에 대한 유용한 조언을 해 주었다.","m":0,"s":"In some countries, leaving a generous t______ for the waiter is considered polite.\nOur coach gave us a useful t______ on how to breathe while running long distances.","mn":"팁, 봉사료 / 조언, 비결","hk":"tip(팁, 조언)은 철자가 같은 명사. 웨이터에게 건네면 돈인 팁, 코치가 알려 주면 요령인 조언.","ex":[["Do you [[leave a tip]] in this country?","이 나라에서는 [[팁을 남기나요]]?","tip (명) 팁, 봉사료"],["Here is [[a useful tip]] for studying.","공부에 대한 [[유용한 조언]]이 여기 있다.","tip (명) 조언, 비결"],["She shared [[a cooking tip]] with us.","그녀는 우리에게 [[요리 비결]]을 알려 주었다.","tip (명) 조언, 비결"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"reality","a":"1","e":"① truth: 진실, 사실 (많은 사람들이 그 오래된 이야기를 믿지만, 현실은 상당히 다르다.) / reality(현실, 실제)의 유의어.","w":"② fantasy: 환상, 공상\n③ illusion: 착각, 환영\n④ rumor: 소문","k":"많은 사람들이 그 오래된 이야기를 믿지만, 현실은 상당히 다르다.","m":0,"s":"Many people believe the old story, but the reality is quite different.","h":"reality","c":["truth","fantasy","illusion","rumor"],"mn":"현실, 실제","hk":"reality(현실, 실제)는 꾸미지 않은 실제 모습. truth(진실)가 같은 편, fantasy(환상)와 illusion(착각)은 반대편, rumor(소문)는 확인 안 된 말.","ex":[["She had to [[face reality]].","그녀는 [[현실을 마주해야]] 했다."],["[[In reality]], the test was easy.","[[실제로는]] 그 시험이 쉬웠다."],["His dream finally [[became reality]].","그의 꿈은 마침내 [[현실이 되었다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"expression","a":"2","e":"② expression: 표현, 표정 (선생님이 그에게 그 질문을 했을 때 어리둥절한 표정이 그의 얼굴에 나타났다.)","w":"① impression: 인상, 느낌\n③ attitude: 태도\n④ concept: 개념","k":"선생님이 그에게 그 질문을 했을 때 어리둥절한 표정이 그의 얼굴에 나타났다.","m":0,"s":"A puzzled ________ appeared on his face when the teacher asked him the question.","c":["impression","expression","attitude","concept"],"mn":"표현, 표정","hk":"expression(표정)은 얼굴에 드러나는 모습이라 puzzled(어리둥절한)와 짝. 철자가 비슷한 impression(인상)은 받는 느낌, attitude(태도)와 concept(개념)도 오답.","ex":[["She had [[a happy expression]] on her face.","그녀의 얼굴에는 [[행복한 표정]]이 떠올랐다."],["[[Facial expressions]] show feelings.","[[얼굴 표정]]은 감정을 보여 준다."],["Smiling is [[an expression of joy]].","미소는 [[기쁨의 표현]]이다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"texture","a":"4","e":"④ texture: (느낌 / 표면이나 재료가 주는 / 당신이 그것을 만질 때) 질감, 감촉","w":"① grain: 결, 알갱이\n② fabric: 천, 직물\n③ moisture: 수분, 습기","k":"느낌 / 표면이나 재료가 주는 / 당신이 그것을 만질 때","m":0,"s":"\"the way that a surface or material feels when you touch it\"","c":["grain","fabric","moisture","texture"],"mn":"질감, 감촉","hk":"texture(질감)는 만졌을 때 느껴지는 표면의 느낌. grain(결), fabric(천), moisture(습기)는 재료나 상태 자체이지 느낌이 아닌 오답.","ex":[["The cake has [[a soft texture]].","그 케이크는 [[부드러운 질감]]을 가졌다."],["I like [[the texture of this cloth]].","나는 [[이 천의 질감]]이 좋다."],["Sandpaper has [[a rough texture]].","사포는 [[거친 질감]]을 가졌다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"case","a":"4","e":"①경우, 사례 / ②경우, 사례 / ③경우, 사례 / ④소송 (사건) [④번만 의미가 다름]","k":"①그런 경우에는, 너는 즉시 사무실에 전화해야 한다.\n②모든 경우에, 그 오래된 기계는 10분 후에 멈췄다.\n③이것은 새가 건조한 사막에서 사는 드문 사례이다.\n④그 변호사는 3년간의 재판 끝에 마침내 그 소송에서 이겼다.","m":0,"c":["In that case, you should call the office immediately.","In every case, the old machine stopped after ten minutes.","This is a rare case of a bird living in the dry desert.","The lawyer finally won the case after a three-year trial."],"hc":"case|case|case|case","mn":"경우, 사례 / 소송 (사건)","hk":"case(경우, 사례)는 상황을 뜻하는 쓰임이 기본, win the case(소송에서 이기다)만 소송. 네 번째 문장만 다른 뜻.","ex":[["[[In that case]], you should call the office.","[[그런 경우에는]] 사무실에 전화해야 한다.","case (명) 경우, 사례"],["This is [[a rare case]] of a bird living in the desert.","이것은 사막에 사는 새의 [[드문 사례]]이다.","case (명) 경우, 사례"],["The lawyer [[won the case]] after the trial.","그 변호사는 재판 끝에 [[소송에서 이겼다]].","case (명) 소송 (사건)"]]}]},{"day":64,"q":[{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"consume","a":"3","e":"③ conserve: 아끼다, 아껴 쓰다 (현대의 공장들은 매일 엄청난 양의 전기를 소비한다.) / consume(소비하다, 써 버리다)의 반의어.","w":"① absorb: 흡수하다\n② burn: 태우다\n④ waste: 낭비하다","k":"현대의 공장들은 매일 엄청난 양의 전기를 소비한다.","m":0,"s":"Modern factories consume huge amounts of electricity every single day.","h":"consume","c":["absorb","burn","conserve","waste"],"mn":"소비하다, 써 버리다","hk":"consume(소비하다)의 반대편은 conserve(아끼다). waste(낭비하다)는 많이 쓰는 쪽이라 함정, absorb(흡수하다)와 burn(태우다)도 오답.","ex":[["Cars [[consume a lot of fuel]].","자동차는 [[많은 연료를 소비한다]].","consume (동) 소비하다, 써 버리다"],["Big cities [[consume a lot of water]].","큰 도시는 [[많은 물을 소비한다]].","consume (동) 소비하다, 써 버리다"],["We should [[conserve water]].","우리는 [[물을 아껴야]] 한다.","conserve (동) 아끼다, 아껴 쓰다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"conscience","a":"2","e":"② conscience: (당신 안에 있는 감각 / 당신에게 알려 주는 / 당신이 하고 있는 일이 옳은지 그른지를) 양심","w":"① guilt: 죄책감\n③ shame: 수치심\n④ pride: 자부심, 자존심","k":"당신 안에 있는 감각 / 당신에게 알려 주는 / 당신이 하고 있는 일이 옳은지 그른지를","m":0,"s":"\"the feeling inside you that tells you whether what you are doing is right or wrong\"","c":["guilt","conscience","shame","pride"],"mn":"양심","hk":"conscience(양심)는 옳고 그름을 알려 주는 마음속 소리. guilt(죄책감)와 shame(수치심)은 잘못한 뒤의 감정, pride(자부심)는 다른 감정이라 오답.","ex":[["I have [[a clear conscience]].","나는 [[양심에 거리낌이 없다]]."],["You should [[follow your conscience]].","너는 [[양심을 따라야]] 한다."],["He lied against [[his conscience]].","그는 [[양심]]을 거슬러 거짓말을 했다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"lesson","a":"lesson","e":"lesson (명) 교훈 / (명) 수업","k":"그녀의 할머니의 옛이야기는 그녀에게 인내에 관한 귀중한 교훈을 가르쳐 주었다.\n그는 매주 목요일 저녁 방과 후에 개인 바이올린 수업을 받는다.","m":0,"s":"Her grandmother's old story taught her a valuable l______ about patience.\nHe takes a private violin l______ every Thursday evening after school.","mn":"교훈 / 수업","hk":"lesson(교훈, 수업)은 배울 내용이라는 한 줄기. learn a lesson(교훈을 얻다), take a lesson(수업을 받다)으로 구분.","ex":[["I learned [[a valuable lesson]] from my mistake.","나는 실수에서 [[귀중한 교훈]]을 얻었다.","lesson (명) 교훈"],["He takes [[a piano lesson]] every Friday.","그는 매주 금요일 [[피아노 수업]]을 받는다.","lesson (명) 수업"],["The story [[teaches a lesson]] about honesty.","그 이야기는 정직에 관한 [[교훈을 준다]].","lesson (명) 교훈"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"penalize","a":"3","e":"③ penalize: 처벌하다, 불리하게 하다","w":"① excuse: 봐주다, 용서하다\n② reward: 보상하다\n④ forgive: 용서하다","m":0,"s":"\"처벌하다, 불리하게 하다\"","c":["excuse","reward","penalize","forgive"],"mn":"처벌하다, 불리하게 하다","hk":"penalize(처벌하다)는 penalty(벌칙)에서 나온 동사로 벌을 주는 것. excuse(봐주다)와 forgive(용서하다)는 반대 방향, reward(보상하다)도 반대의 오답.","ex":[["Teachers should not [[penalize students]] for honest mistakes.","교사는 솔직한 실수로 [[학생에게 불이익을 주면]] 안 된다."],["The law [[penalizes littering]].","그 법은 [[쓰레기 투기를 처벌한다]]."],["The referee [[penalized the team]] for a foul.","심판은 반칙으로 [[그 팀에 벌칙을 주었다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"manuscript","a":"1","e":"① manuscript: (작가의 원래 원고 / 책이나 기사의 / 그것이 인쇄되기 전의) (글의) 원고","w":"② booklet: 소책자\n③ preface: 서문, 머리말\n④ edition: 판, 호","k":"작가의 원래 원고 / 책이나 기사의 / 그것이 인쇄되기 전의","m":0,"s":"\"a writer's original text of a book or an article before it is printed\"","c":["manuscript","booklet","preface","edition"],"mn":"(글의) 원고","hk":"manuscript(원고)는 manu(손)와 script(쓴 글)가 합쳐진 말로 원래 손으로 쓴 글. booklet(소책자), preface(서문), edition(판)은 인쇄된 책 쪽이라 오답.","ex":[["The writer sent [[her manuscript]] to a publisher.","작가는 출판사에 [[원고]]를 보냈다."],["He is still [[revising the manuscript]].","그는 아직 [[원고를 수정하고]] 있다."],["An old [[handwritten manuscript]] was found.","오래된 [[손으로 쓴 원고]]가 발견되었다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"sketch","a":"4","e":"④ sketch: 스케치, 초안","w":"① sculpture: 조각상\n② frame: 액자, 틀\n③ brush: 붓","m":0,"s":"sketch","c":["조각상","액자, 틀","붓","스케치, 초안"],"mn":"스케치, 초안","hk":"sketch(스케치, 초안)는 완성 전에 대충 그린 그림. sculpture(조각상), frame(액자), brush(붓)는 작품이나 도구이지 그린 초안이 아닌 오답.","ex":[["He made [[a quick sketch]] of the park.","그는 공원의 [[재빠른 스케치]]를 그렸다."],["She drew [[a rough sketch]] of her plan.","그녀는 계획의 [[대략적인 초안]]을 그렸다."],["The artist [[made a sketch]] before painting.","화가는 그림을 그리기 전에 [[스케치를 했다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"remove","a":"4","e":"④ eliminate: 없애다, 제거하다 (청소부는 오래된 카펫에서 짙은 얼룩을 제거하기 위해 특별한 액체를 사용했다.) / remove(제거하다, 없애다)의 유의어.","w":"① highlight: 두드러지게 하다, 강조하다\n② preserve: 보존하다\n③ dissolve: 녹이다, 용해시 을 고르시오.","wd":"point","a":"3","e":"①요점, 핵심 / ②요점, 주장 / ③(경기의) 점수 / ④의견, 주장 [③번만 의미가 다름]","k":"①당신 연설의 요점을 한 번 더 설명해 주시겠어요?\n②그 작가는 이 책에서 학교 규칙에 관한 중요한 주장을 편다.\n③우리 팀은 맨 마지막 순간에 결승 득점을 올렸다.\n④나는 당신의 주장을 이해하지만, 여전히 당신에게 동의할 수 없다.","m":0,"c":["Could you explain the main point of your speech one more time?","The writer makes an important point about school rules in this book.","Our team scored the winning point in the very last second.","I understand your point, but I still cannot agree with you."],"hc":"point|point|point|point","mn":"요점, 핵심 / (경기의) 점수","hk":"point(요점, 주장)는 말의 핵심이 기본, score a point(점수를 따다)처럼 경기에서는 점수. 세 번째 문장만 다른 뜻.","ex":[["That is [[a good point]].","그것은 [[좋은 지적]]이다.","point (명) 요점, 주장"],["Could you explain [[the main point]] again?","[[요점]]을 다시 설명해 주시겠어요?","point (명) 요점, 핵심"],["Our team [[scored the winning point]].","우리 팀이 [[결승 득점을 올렸다]].","point (명) (경기의) 점수"]]}]},{"day":65,"q":[{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"major","a":"3","e":"③ minor: 사소한, 중요하지 않은 (교통사고는 여전히 젊은 운전자들의 주요한 사망 원인이다.) / major(주요한, 중대한)의 반의어.","w":"① vital: 필수적인, 매우 중요한\n② central: 중심적인, 가장 중요한\n④ chief: 주요한, 최고의","k":"교통사고는 여전히 젊은 운전자들의 주요한 사망 원인이다.","m":0,"s":"Traffic accidents are still a major cause of death among young drivers.","h":"major","c":["vital","central","minor","chief"],"mn":"주요한, 중대한","hk":"major(주요한)의 반대편은 minor(사소한). vital(필수적인), central(중심적인), chief(주요한)는 모두 같은 편의 오답.","ex":[["Smoking is [[a major cause]] of illness.","흡연은 질병의 [[주요 원인]]이다.","major (형) 주요한, 중대한"],["The city faced [[a major problem]].","그 도시는 [[중대한 문제]]에 직면했다.","major (형) 주요한, 중대한"],["It was only [[a minor injury]].","그것은 단지 [[가벼운 부상]]이었다.","minor (형) 사소한, 중요하지 않은"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"purchase","a":"3","e":"③ purchase: (어떤 것을 얻다 / 그것에 대해 돈을 지불함으로써) 구매하다, 구입하다","w":"① afford: ~할 여유가 있다\n② donate: 기부하다\n④ exchange: 교환하다","k":"어떤 것을 얻다 / 그것에 대해 돈을 지불함으로써","m":0,"s":"\"to get something by paying money for it\"","c":["afford","donate","purchase","exchange"],"mn":"구매하다, 구입하다","hk":"purchase(구매하다)는 돈을 내고 얻는 것으로 buy(사다)와 같은 편. afford(~할 여유가 있다), donate(기부하다), exchange(교환하다)는 오답.","ex":[["You can [[purchase tickets]] online.","온라인으로 [[표를 구매할]] 수 있다."],["They [[purchased a new house]].","그들은 [[새 집을 구입했다]]."],["He saved money to [[purchase a car]].","그는 [[자동차를 사려고]] 돈을 모았다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"applaud","a":"3","e":"applaud (동) 박수를 치다 - applause (명) 박수갈채\n③ locate (동) 위치를 찾아내다 - location (명) 위치, 장소","w":"① loyal (형) 충성스러운 - loyalty (명) 충성심\n② sensitive (형) 세심한, 예민한 - sensitivity (명) 세심함, 예민함\n④ imaginative (형) 상상력이 풍부한 - imagination (명) 상상력","m":0,"s":"applaud - applause","c":["loyal - loyalty","sensitive - sensitivity","locate - location","imaginative - imagination"],"mn":"박수를 치다","hk":"applaud(박수를 치다)와 applause(박수갈채)는 동사에서 명사로 바뀐 짝. locate(위치를 찾아내다)와 location(위치)이 같은 방향, 나머지는 형용사에서 명사.","ex":[["The fans [[applauded loudly]].","팬들은 [[큰 소리로 박수를 쳤다]].","applaud (동) 박수를 치다"],["The singer received [[loud applause]].","그 가수는 [[큰 박수갈채]]를 받았다.","applause (명) 박수갈채"],["Can you [[locate the problem]]?","[[문제의 위치를 찾아낼]] 수 있나요?","locate (동) 위치를 찾아내다"],["This is [[a good location]] for a shop.","여기는 가게를 열기에 [[좋은 위치]]이다.","location (명) 위치, 장소"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"witness","a":"4","e":"④ witness: 목격자","w":"① prosecutor: 검사, 검찰관\n② juror: 배심원\n③ defendant: 피고인","m":0,"s":"witness","c":["검사, 검찰관","배심원","피고인","목격자"],"mn":"목격자","hk":"witness(목격자)는 사건을 직접 본 사람. prosecutor(검사), juror(배심원), defendant(피고인)는 재판의 다른 역할이라 오답.","ex":[["The police are looking for [[a witness]].","경찰은 [[목격자]]를 찾고 있다."],["He was [[a witness to the crime]].","그는 [[범죄의 목격자]]였다."],["[[A key witness]] saw everything.","[[핵심 목격자]] 한 명이 모든 것을 보았다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"marine","a":"3","e":"③ marine: 바다의, 해양의 (많은 해양 생물 종이 바다의 플라스틱 쓰레기 때문에 죽어가고 있다 ]].","enthusiastic (형) 열정적인, 열의가 넘치는"],["The fans gave [[an enthusiastic welcome]].","팬들은 [[열렬한 환영]]을 보냈다.","enthusiastic (형) 열정적인, 열의가 넘치는"],["He looked [[bored]] in class.","그는 수업 시간에 [[지루해]] 보였다.","bored (형) 지루해하는, 심드렁한"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"mammal","a":"3","e":"③ mammal: 포유동물","w":"① insect: 곤충\n② predator: 포식자\n④ reptile: 파충류","m":0,"s":"\"포유동물\"","c":["insect","predator","mammal","reptile"],"mn":"포유동물","hk":"mammal(포유동물)은 새끼에게 젖을 먹이는 동물. insect(곤충)와 reptile(파충류)은 다른 무리, predator(포식자)는 먹이 사슬의 역할이라 오답.","ex":[["A whale is [[a mammal]], not a fish.","고래는 물고기가 아니라 [[포유동물]]이다."],["Bats are [[the only flying mammals]].","박쥐는 [[유일하게 하늘을 나는 포유동물]]이다."],["Elephants are [[large mammals]].","코끼리는 [[큰 포유동물]]이다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"quality","a":"2,3","e":"② grade: 등급, 품질 수준 (이 작은 가게는 가죽 가방의 높은 품질로 유명하다.) / quality(질, 품질)의 유의어.\n③ standard: 수준, 기준","w":"① quantity: 수량, 분량\n④ amount: 양, 총액","k":"이 작은 가게는 가죽 가방의 높은 품질로 유명하다.","m":2,"s":"This small shop is famous for the high quality of its leather bags.","h":"quality","c":["quantity","grade","standard","amount"],"mn":"질, 품질","hk":"quality(질, 품질)는 얼마나 좋은지의 정도. grade(등급)와 standard(수준)가 같은 편, quantity(수량)와 amount(양)는 많고 적음이라 함정.","ex":[["We care about [[the quality of our products]].","우리는 [[우리 제품의 품질]]을 중요하게 여긴다."],["These shoes are [[of good quality]].","이 신발은 [[품질이 좋다]]."],["[[Air quality]] is bad today.","오늘은 [[공기 질]]이 나쁘다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"literary","a":"3","e":"③ literary: 문학의 (그 젊은 작가는 작년에 중요한 문학상을 받았다.)","w":"① scientific: 과학의\n② academic: 학업의, 학문의\n④ musical: 음악의","k":"그 젊은 작가는 작년에 중요한 문학상을 받았다.","m":0,"s":"The young writer won an important ________ prize last year.","c":["scientific","academic","literary","musical"],"mn":"문학의","hk":"literary(문학의)는 literature(문학)의 형용사로 literary prize(문학상)가 짝. scientific(과학의), academic(학업의), musical(음악의)은 오답.", 래된 교회 종은 축제의 시작을 알리기 위해 정오에 울릴 것이다.","m":0,"s":"She slipped a silver r______ onto her finger just before the ceremony began.\nThe old church bell will r______ at noon to mark the beginning of the festival.","mn":"반지, 고리 / 울리다","hk":"명사 ring(반지, 고리)과 동사 ring(울리다)은 철자가 같은 한 단어. 손가락엔 반지, 종엔 울림.","ex":[["She wore [[a gold ring]] on her left hand.","그녀는 왼손에 [[금반지]]를 끼고 있었다.","ring (명) 반지, 고리"],["He lost the [[key ring]] on the bus.","그는 버스에서 [[열쇠고리]]를 잃어버렸다.","ring (명) 반지, 고리"],["Please [[ring the bell]] when you arrive.","도착하면 [[벨을 울려]] 주세요.","ring (동) 울리다"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"protect","a":"2","e":"② guard: 지키다, 보호하다 (두꺼운 털은 이 동물들이 얼어붙을 듯한 바람으로부터 스스로를 보호하도록 돕는다.) / protect(보호하다, 지키다)의 유의어.","w":"① hurt: 다치게 하다\n③ threaten: 위협하다\n④ attack: 공격하다","k":"두꺼운 털은 이 동물들이 얼어붙을 듯한 바람으로부터 스스로를 보호하도록 돕는다.","m":0,"s":"Thick fur helps these animals protect themselves from the freezing wind.","h":"protect","c":["hurt","guard","threaten","attack"],"mn":"보호하다, 지키다","hk":"protect(보호하다)와 같은 편은 guard(지키다). hurt(다치게 하다), threaten(위협하다), attack(공격하다)은 해치는 반대편 속임수.","ex":[["Sunscreen can [[protect your skin]] from the sun.","선크림은 햇빛으로부터 [[피부를 보호할]] 수 있다."],["Helmets [[protect]] riders from serious injuries.","헬멧은 운전자를 심한 부상으로부터 [[보호한다]]."],["We must [[protect the environment]] for our children.","우리는 아이들을 위해 [[환경을 보호해야]] 한다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"economic","a":"2","e":"② economic: 경제의, 경제학의 (그 나라는 긴 전쟁 후에 심각한 경제 위기를 겪고 있다.)","w":"① physical: 신체의, 물리적인\n③ dental: 치아의, 치과의\n④ historical: 역사적인","k":"그 나라는 긴 전쟁 후에 심각한 경제 위기를 겪고 있다.","m":0,"s":"The country is going through a serious ________ crisis after the long war.","c":["physical","economic","dental","historical"],"mn":"경제의, 경제학의","hk":"economic(경제의)은 economic crisis(경제 위기)의 짝. 철자가 비슷한 economical(절약하는)과 구분.","ex":[["The government has a new [[economic plan]].","정부는 새로운 [[경제 계획]]을 가지고 있다."],["[[Economic growth]] helps many families.","[[경제 성장]]은 많은 가족에게 도움이 된다."],["He studies [[economic history]] at university.","그는 대학에서 [[경제사]]를 공부한다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"continent","a":"3","e":"③ continent: 대륙","w":"① island: 섬\n② glacier: 빙하\n④ peninsula: 반도","m":0,"s":"\"대륙\"","c":["island","glacier","continent","peninsula"],"mn":"대륙","hk":"continent(대륙)는 가장 큰 땅덩어리. island(섬), peninsula(반도)는 더 작은 땅이고 glacier(빙하)는 얼음 덩어리 속임수.","ex":[["Asia is the largest [[continent]] on Earth.","아시아는 지구에서 가장 큰 [[대륙]]이다."],["They traveled [[across the continent]] by train.","그들은 기차로 [[대륙을 가로질러]] 여행했다."],["Penguins live on [[the Antarctic continent]].","펭귄은 [[남극 대륙]]에 산다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"resist","a":"4","e":"resist (동) 저항하다, 견디다 - resistance (명) 저항\n④ reproduce (동) 번식하다, 복제하다 - reproduction (명) 번식, 복제","w":"① responsible (형) 책임이 있는 - responsibility (명) 책임\n② innocent (형) 결백한, 무죄의 - innocence (명) 결백, 무죄\n③ wise (형) 현명한 - wisdom (명) 지혜","m":0,"s":"resist - resistance","c":["responsible - responsibility","innocent - innocence","wise - wisdom","reproduce - reproduction"],"mn":"저항하다, 견디다","hk":"관계는 동사에서 명사. resist(저항하다)-resistance(저항)와 reproduce(번식하다)-reproduction(번식). 나머지는 형용사에서 명사.","ex":[["The town did not [[resist]] the army.","그 마을은 군대에 [[저항하지]] 않았다.","resist (동) 저항하다, 견디다"],["The army met strong [[resistance]] at the border.","군대는 국경에서 강한 [[저항]]에 부딪혔다.","resistance (명) 저항"],["Rabbits [[reproduce]] very quickly.","토끼는 매우 빠르게 [[번식한다]].","reproduce (동) 번식하다, 복제하다"],["The farm studies the [[reproduction]] of sheep.","그 농장은 양의 [[번식]]을 연구한다.","reproduction (명) 번식, 복제"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"theme","a":"theme","e":"※ theme park(테마파크)는 굳어진 표현이라 topic으로 바꿔 쓸 수 없다.","k":"우리는 놀이공원에서 하루 종일 보내며 모든 롤러코스터를 탔다.","m":0,"s":"We spent the whole day at the t______ park and rode every roller coaster.","hk":"theme(주제)은 th(티에이치)로 시작하는 철자. theme park(테마파크)는 topic(화제)으로 못 바꾸는 굳은 표현.","ex":[["We spent Sunday at [[a theme park]].","우리는 일요일을 [[테마파크]]에서 보냈다."],["The main [[theme of the story]] is friendship.","[[그 이야기의 주제]]는 우정이다."],["The party has [[a space theme]].","그 파티는 [[우주 테마]]로 열린다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"abolish","a":"2,3","e":"② establish: 설립하다, 제정하다\n③ create: 만들어 내다, 창조하다 (새 정부는 불공정한 세금 제도를 폐지하겠다고 약속했다.) / abolish(폐지하다, 없애다)의 반의어.","w":"① reject: 거부하다\n④ cancel: 취소하다","k":"새 정부는 불공정한 세금 제도를 폐지하겠다고 약속했다.","m":2,"s":"The new government promised to abolish the unfair tax system.","h":"abolish","c":["reject","establish","create","cancel"],"mn":"폐지하다, 없애다","hk":"abolish(폐지하다)의 반대편은 establish(설립하다)와 create(만들어 내다). reject(거부하다), cancel(취소하다)은 없애는 쪽 속임수.","ex":[["Many countries chose to [[abolish]] slavery long ago.","많은 나라가 오래전에 노예제를 [[폐지하기로]] 했다.","abolish (동) 폐지하다, 없애다"],["They [[established a new school]] in the village.","그들은 마을에 [[새 학교를 세웠다]].","establish (동) 설립하다, 제정하다"],["She likes to [[create new recipes]].","그녀는 [[새 요리법을 만들어 내는]] 것을 좋아한다.","create (동) 만들어 내다, 창조하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"resource","a":"3","e":"③ resource: (물, 석탄, 또는 땅 같은 어떤 것 / 한 나라가 가지고 있고 쓸 수 있는) 자원","w":"① industry: 산업\n② treasure: 보물\n④ territory: 영토, 영역","k":"물, 석탄, 또는 땅 같은 어떤 것 / 한 나라가 가지고 있고 쓸 수 있는","m":0,"s":"\"something such as water, coal, or land that a country has and can use\"","c":["industry","treasure","resource","territory"],"mn":"자원","hk":"resource(자원)는 물, 석탄, 땅처럼 나라가 쓸 수 있는 것. 대표 짝은 natural resources(천연자원). territory(영토)는 땅 자체라 속임수.","ex":[["Oil is an important [[natural resource]].","석유는 중요한 [[천연자원]]이다."],["Water is [[a limited resource]] in the desert.","물은 사막에서 [[한정된 자원]]이다."],["The company values its [[human resources]].","그 회사는 [[인적 자원]]을 중요하게 여긴다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"consumer","a":"2","e":"② consumer: 소비자","w":"① producer: 생산자\n③ investor: 투자자\n④ supplier: 공급자","m":0,"s":"consumer","c":["생산자","소비자","투자자","공급자"],"mn":"소비자","hk":"consumer(소비자)는 사서 쓰는 사람이고 반대편은 producer(생산자). supplier(공급자), investor(투자자)와 역할 구분.","ex":[["The shop sells [[consumer goods]] for daily life.","그 가게는 일상생활용 [[소비재]]를 판다."],["Prices rose, so [[consumers]] spent less money.","물가가 올라서 [[소비자들은]] 돈을 덜 썼다."],["[[Consumer prices]] went up last month.","지난달 [[소비자 물가]]가 올랐다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"solution","a":"3","e":"③ key: 해답, 비결 (모든 사람이 그 도시의 교통 문제에 대한 해결책을 찾고 있었다.) / solution(해결책, 해답)의 유의어.","w":"① crisis: 위기\n② obstacle: 장애물\n④ difficulty: 어려움","k":"모든 사람이 그 도시의 교통 문제에 대한 해결책을 찾고 있었다.","m":0,"s":"Everyone was looking for a solution to the city's traffic problem.","h":"solution","c":["crisis","obstacle","key","difficulty"],"mn":"해결책, 해답","hk":"solution(해결책)과 같은 편은 key(해답, 비결). crisis(위기), obstacle(장애물), difficulty(어려움)는 문제 쪽 반대 방향.","ex":[["We need [[a quick solution]] to this problem.","우리는 이 문제의 [[빠른 해결책]]이 필요하다."],["Nobody could find [[the solution]] to the puzzle.","아무도 그 퍼즐의 [[해답]]을 찾지 못했다."],["Talking is [[the best solution]] for most fights.","대화는 대부분의 싸움에 대한 [[최선의 해결책]]이다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"disregard","a":"3","e":"③ disregard: 무시하다 (너는 실험실에서 일할 때 절대 안전 수칙을 무시해서는 안 된다.)","w":"① accept: 받아들이다\n② obey: 따르다, 복종하다\n④ memorize: 암기하다","k":"너는 실험실에서 일할 때 절대 안전 수칙을 무시해서는 안 된다.","m":0,"s":"You must never ________ the safety rules when you work in the laboratory.","c":["accept","obey","disregard","memorize"],"mn":"무시하다","hk":"disregard(무시하다)는 dis-(반대)+regard(관심)로 관심 끊기. safety rules(안전 수칙) 앞 반대편 단어는 obey(따르다).","ex":[["Drivers should never [[disregard traffic signs]].","운전자는 절대 [[교통 표지를 무시해서는]] 안 된다."],["He chose to [[disregard my advice]].","그는 [[내 충고를 무시하기로]] 했다."],["Don't [[disregard the warning]] on the box.","상자의 [[경고를 무시하지]] 마라."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"exclude","a":"2","e":"② include: 포함하다 (그 여행 상품 가격은 모든 식사와 개인 경비를 제외할 것이다.) / exclude(제외하다, 배제하다)의 반의어.","w":"① skip: 건너뛰다\n③ omit: 생략하다, 빠뜨리다\n④ delete: 삭제하다","k":"그 여행 상품 가격은 모든 식사와 개인 경비를 제외할 것이다.","m":0,"s":"The tour price will exclude all meals and personal expenses.","h":"exclude","c":["skip","include","omit","delete"],"mn":"제외하다, 배제하다","hk":"exclude(제외하다)의 반대편은 include(포함하다). ex-(밖으로)와 in-(안으로)의 방향 대비. skip(건너뛰다), omit(생략하다), delete(삭제하다)는 같은 편.","ex":[["Please do not [[exclude anyone]] from the game.","게임에서 [[누구도 제외하지]] 마세요.","exclude (동) 제외하다, 배제하다"],["The ticket price will [[include lunch]].","표 가격에는 점심이 [[포함된다]].","include (동) 포함하다"],["The price [[includes tax]].","가격에는 [[세금이 포함되어]] 있다.","include (동) 포함하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"broadcast","a":"2","e":"② broadcast: (프로그램을 내보내다 / 사람들이 그것을 보거나 들을 수 있도록 / 텔레비전이나 라디오로) 방송하다","w":"① perform: 공연하다, 수행하다\n③ publish: 출판하다, 발행하다\n④ record: 녹음하다, 기록하다","k":"프로그램을 내보내다 / 사람들이 그것을 보거나 들을 수 있도록 / 텔레비전이나 라디오로","m":0,"s":"\"to send out a program so that people can watch or hear it on television or radio\"","c":["perform","broadcast","publish","record"],"mn":"방송하다","hk":"broadcast(방송하다)는 TV(텔레비전)나 radio(라디오)로 널리 내보내기. perform(공연하다), publish(출판하다), record(녹음하다)는 속임수.","ex":[["The channel will [[broadcast the match live]].","그 채널이 [[경기를 생중계로 방송할]] 것이다."],["The radio station [[broadcasts news]] every hour.","그 라디오 방송국은 매시간 [[뉴스를 방송한다]]."],["The speech was [[broadcast]] around the world.","그 연설은 전 세계에 [[방송되었다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"democracy","a":"democracy","e":"democracy 민주주의","k":"민주주의 국가에서, 시민들은 몇 년마다 치러지는 자유로운 선거를 통해 그들의 지도자를 선택한다.","m":0,"s":"In a d______, citizens choose their leaders through free elections held every few years.","mn":"민주주의","hk":"democracy(민주주의)는 demo(민중)와 cracy(통치) 두 덩어리로 끊어 철자 기억.","ex":[["Greece is known as the birthplace of [[democracy]].","그리스는 [[민주주의]]의 발상지로 알려져 있다."],["Freedom of speech is important in [[a democracy]].","[[민주주의 국가]]에서는 언론의 자유가 중요하다."],["Some small towns use [[direct democracy]].","일부 작은 마을은 [[직접 민주주의]]를 사용한다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"measures","a":"2","e":"①조치, 대책 / ②척도, 기준 / ③조치, 대책 / ④조치, 대책 [②번만 의미가 다름]","k":"①학교에서 괴롭힘을 막기 위해 강력한 조치가 취해졌다.\n②돈은 한 사람의 행복을 재는 좋은 척도가 아니다.\n③그 도시는 공기를 더 깨끗하게 만들기 위한 새로운 조치를 발표했다.\n④그 병원은 지난 3월에 엄격한 안전 조치를 도입했다.","m":0,"c":["Strong measures were taken to stop bullying in schools.","Money is not a good measure of a person's happiness.","The city announced new measures to make the air cleaner.","The hospital introduced strict safety measures last March."],"hc":"measures|measure|measures|measures","mn":"조치, 대책 / 척도, 기준","hk":"measures(조치, 대책)는 take measures(조치를 취하다)처럼 복수로 자주 씀. 하나만 단수 measure(척도, 기준) 뜻, happiness(행복)를 재는 잣대.","ex":[["The school took [[strict measures]] against bullying.","학교는 괴롭힘에 대해 [[강력한 조치]]를 취했다.","measures (명) 조치, 대책"],["The city announced [[new measures]] for clean air.","시는 깨끗한 공기를 위한 [[새로운 조치]]를 발표했다.","measures (명) 조치, 대책"],["Money is not a good [[measure]] of happiness.","돈은 행복의 좋은 [[척도]]가 아니다.","measure (명) 척도, 기준"]]}]},{"day":67,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"stationery","a":"3","e":"③ stationery: (종이, 봉투, 펜, 그리고 그 밖의 물건들 / 사람들이 글을 쓰는 데 사용하는) 문구류, 편지지","w":"① luggage: (여행용) 짐, 수하물\n② garment: 의복, 옷 한 벌\n④ equipment: 장비, 용품","k":"종이, 봉투, 펜, 그리고 그 밖의 물건들 / 사람들이 글을 쓰는 데 사용하는","m":0,"s":"\"paper, envelopes, pens, and other things that people use for writing\"","c":["luggage","garment","stationery","equipment"],"mn":"문구류, 편지지","hk":"stationery(문구류)는 글쓰기용 종이와 펜. 철자가 비슷한 stationary(정지한)와 구분. luggage(짐), garment(의복), equipment(장비)는 속임수.","ex":[["I bought some [[stationery]] for school.","나는 학교에서 쓸 [[문구류]]를 샀다."],["She wrote on [[hotel stationery]].","그녀는 [[호텔 편지지]]에 글을 썼다."],["[[A stationery store]] is near my school.","내 학교 근처에 [[문구점]]이 있다."]]},{"t":"ANT","tn"
