<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 40</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}
.sec{margin:26px 0 8px;font-weight:700;color:var(--pri);font-size:15px;border-left:4px solid var(--pri);padding-left:8px}
.sent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:10px;align-items:flex-start}.n{min-width:24px;color:var(--mut);font-size:13px;padding-top:3px}
.txt{font-size:18px;line-height:2}

.wd:hover{background:#eef3f8}.wd.on{background:var(--sel);box-shadow:inset 0 -2px 0 var(--selb)}
.locked .wd{cursor:default}.locked .wd:hover{background:none}
.wd.hit{background:var(--okbg);box-shadow:inset 0 -2px 0 var(--ok)}.wd.miss{background:var(--badbg);box-shadow:inset 0 -2px 0 var(--bad)}.wd.x{text-decoration:line-through;color:var(--mut)}
.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}
.note{margin:10px 0 0 34px;padding:10px 12px;border-radius:8px;font-size:14.5px}
.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Kia Orana! I'm Nikau from New Zealand.","ko":"안녕하세요! 저는 뉴질랜드에서 온 Nikau입니다.","ok":true,"foot":[],"fixes":[]},{"n":2,"tag":null,"en":"I'm work at a whale research center in the Cook Islands. I thinks humpback whales are the more amazing animals in the ocean.","ko":"저는 쿡 제도에 있는 고래 연구소에서 일하고 있어요. 저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요.","ok":false,"foot":[],"fixes":[{"wrong":"work","right":"working","partial":false,"at":[1],"point":"현재진행형: 현재진행형은 be + -ing: working (work 아님)","topic":"현재진행형","memo":"현재진행형은 be + -ing: working (work 아님)"},{"wrong":"thinks","right":"think","partial":false,"at":[12],"point":"3인칭 단수 현재형: 주어 I에는 think 사용","topic":"3인칭 단수 현재형","memo":"주어 I에는 think 사용"},{"wrong":"more","right":"most","partial":false,"at":[17],"point":"최상급: the ~ in the ocean은 최상급 most 사용","topic":"최상급","memo":"the ~ in the ocean은 최상급 most 사용"}]},{"n":3,"tag":null,"en":"I have kept a diary about them to record my work and thoughts.","ko":"저는 제 일과 생각들을 기록하기 위해서 그들에 대한 일기를 써 오고 있습니다.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":"Nikau · 7월 1일","en":"Final, the humpback whales are back! They have traveled about 6,500 km from the Southern Ocean to give birth.","ko":"마침내, 혹등고래들이 돌아왔다! 그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다.","ok":false,"foot":[],"fixes":[{"wrong":"Final","right":"Finally","partial":false,"at":[0],"point":"형용사와 부사: 문장 전체를 꾸미는 부사 Finally 사용","topic":"형용사와 부사","memo":"문장 전체를 꾸미는 부사 Finally 사용"}]},{"n":5,"tag":null,"en":"The big and friendly giants came closely to ours boat and played for a while.","ko":"그 크고 친근한 거대한 동물들이 우리의 보트에 가까이 왔고 잠시 동안 놀았다.","ok":false,"foot":[],"fixes":[{"wrong":"closely","right":"close","partial":false,"at":[6],"point":"형용사와 부사: came close to는 형용사 close 사용","topic":"형용사와 부사","memo":"came close to는 형용사 close 사용"},{"wrong":"ours","right":"our","partial":false,"at":[8],"point":"인칭대명사의 소유격: 명사 앞 소유격은 our 사용","topic":"인칭대명사의 소유격","memo":"명사 앞 소유격은 our 사용"}]},{"n":6,"tag":null,"en":"All of a sudden, they jumped up high and made huge splashes. Watching whales never get boring.","ko":"갑자기, 그들이 높이 뛰어올라 거대한 물보라를 만들었다. 고래들을 보는 것은 절대로 지루해지지 않는다.","ok":false,"foot":[],"fixes":[{"wrong":"get","right":"gets","partial":false,"at":[15],"point":"3인칭 단수 현재형: 동명사 주어에는 단수동사 gets 사용","topic":"3인칭 단수 현재형","memo":"동명사 주어에는 단수동사 gets 사용"}]},{"n":7,"tag":"Nikau · 7월 17일","en":"Today, I flew a drone to tag humpback whales. I followed them closely and dropped tags careful onto their backs.","ko":"오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다. 나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다.","ok":false,"foot":[],"fixes":[{"wrong":"careful","right":"carefully","partial":false,"at":[16],"point":"형용사와 부사: 동사 dropped를 꾸미는 부사 carefully 사용","topic":"형용사와 부사","memo":"동사 dropped를 꾸미는 부사 carefully 사용"}]},{"n":8,"tag":null,"en":"We get a lot of informations about them from the tags.","ko":"우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다.","ok":false,"foot":[],"fixes":[{"wrong":"informations","right":"information","partial":false,"at":[5],"point":"셀 수 없는 명사: information은 불가산이라 복수형 없음","topic":"셀 수 없는 명사","memo":"information은 불가산이라 복수형 없음"}]},{"n":9,"tag":null,"en":"I am particularly interested on their songs, and the tags have recorded them for several year.","ko":"나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다.","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"in","partial":false,"at":[4],"point":"기본전치사: '~에 관심 있는'은 interested in 사용","topic":"기본전치사","memo":"'~에 관심 있는'은 interested in 사용"},{"wrong":"year","right":"years","partial":false,"at":[15],"point":"명사의 복수형: several 뒤에는 복수명사 years 사용","topic":"명사의 복수형","memo":"several 뒤에는 복수명사 years 사용"}]},{"n":10,"tag":null,"en":"Their songs last up to 30 minute and can travels thousands of kilometers underwater!","ko":"그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다!","ok":false,"foot":[],"fixes":[{"wrong":"minute","right":"minutes","partial":false,"at":[6],"point":"명사의 복수형: 30 뒤에는 복수명사 minutes 사용","topic":"명사의 복수형","memo":"30 뒤에는 복수명사 minutes 사용"},{"wrong":"travels","right":"travel","partial":false,"at":[9],"point":"조동사: 조동사 can 뒤에는 동사원형 travel 사용","topic":"조동사","memo":"조동사 can 뒤에는 동사원형 travel 사용"}]},{"n":11,"tag":null,"en":"The songs are beautiful, but we still don't know much about them.","ko":"그 노래들은 아름답지만, 우리는 여전히 그것들에 대해 많이 알지 못한다.","ok":true,"foot":[],"fixes":[]},{"n":12,"tag":"Nikau · 8월 2일","en":"I was filming some humpback whales underwater. Suddenly, one whales came close and pushed me hard.","ko":"나는 물속에서 몇몇 혹등고래를 찍고 있었다. 갑자기, 고래 한 마리가 가까이 와서 나를 세게 밀었다.","ok":false,"foot":[],"fixes":[{"wrong":"whales","right":"whale","partial":false,"at":[9],"point":"수량 형용사: one 뒤에는 단수명사 whale 사용","topic":"수량 형용사","memo":"one 뒤에는 단수명사 whale 사용"}]},{"n":13,"tag":null,"en":"I tried to swim away, but it kept pushing my out of the water. I was so surprised.","ko":"나는 헤엄쳐 가려고 노력했지만, 그것은 계속해서 나를 물 밖으로 밀어냈다. 나는 정말 놀랐다.","ok":false,"foot":[],"fixes":[{"wrong":"my","right":"me","partial":false,"at":[9],"point":"인칭대명사의 목적격: 동사 pushing의 목적어는 목적격 me 사용","topic":"인칭대명사의 목적격","memo":"동사 pushing의 목적어는 목적격 me 사용"}]},{"n":14,"tag":null,"en":"Then somebody shouted from the boat, \"A tiger shark are coming!\" I safely got on the boat.","ko":"그때 누군가 배에서 소리쳤다. \"뱀상어가 오고 있다!\" 나는 안전하게 배 위에 탔다.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[9],"point":"현재진행형: 주어 A tiger shark에는 is 사용","topic":"현재진행형","memo":"주어 A tiger shark에는 is 사용"}]},{"n":15,"tag":null,"en":"I realized that the whale were trying to save me.","ko":"나는 그 고래가 나를 구하려고 애썼다는 것을 깨달았다.","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[5],"point":"be동사의 긍정문: 주어 the whale에는 was 사용","topic":"be동사의 긍정문","memo":"주어 the whale에는 was 사용"}]},{"n":16,"tag":null,"en":"Humpback whales sometimes help others sea animals, but I never expected they to save my life.","ko":"혹등고래는 때때로 다른 동물들을 돕지만, 나는 그들이 내 생명을 살리리라고 전혀 예상하지 못했다.","ok":false,"foot":[],"fixes":[{"wrong":"others","right":"other","partial":false,"at":[4],"point":"형용사 other/others: 명사 앞에는 형용사 other 사용","topic":"형용사 other/others","memo":"명사 앞에는 형용사 other 사용"},{"wrong":"they","right":"them","partial":false,"at":[11],"point":"인칭대명사의 목적격: expect의 목적어는 목적격 them 사용","topic":"인칭대명사의 목적격","memo":"expect의 목적어는 목적격 them 사용"}]}];var PP=[["Kia Orana!","안녕하세요!",1],["I'm Nikau from New Zealand.","저는 뉴질랜드에서 온 Nikau입니다.",0],["I'm working at a whale research center in the Cook Islands.","저는 쿡 제도에 있는 고래 연구소에서 일하고 있어요.",0],["I think humpback whales are the most amazing animals in the ocean.","저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요.",0],["I have kept a diary about them to record my work and thoughts.","저는 제 일과 생각들을 기록하기 위해서 그들에 대한 일기를 써 오고 있습니다.",0],["July 1st","7월 1일",1],["Finally, the humpback whales are back!","마침내, 혹등고래들이 돌아왔다!",1],["They have traveled about 6,500 km from the Southern Ocean to give birth.","그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다.",0],["The big and friendly giants came close to our boat and played for a while.","그 크고 친근한 거대한 동물들이 우리의 보트에 가까이 왔고 잠시 동안 놀았다.",0],["All of a sudden, they jumped up high and made huge splashes.","갑자기, 그들이 높이 뛰어올라 거대한 물보라를 만들었다.",0],["Watching whales never gets boring.","고래들을 보는 것은 절대로 지루해지지 않는다.",0],["July 17th","7월 17일",1],["Today, I flew a drone to tag humpback whales.","오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다.",1],["I followed them closely and dropped tags carefully onto their backs.","나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다.",0],["We get a lot of information about them from the tags.","우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다.",0],["I am particularly interested in their songs, and the tags have recorded them for several years.","나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다.",0],["Their songs last up to 30 minutes and can travel thousands of kilometers underwater!","그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다!",0],["The songs are beautiful, but we still don't know much about them.","그 노래들은 아름답지만, 우리는 여전히 그것들에 대해 많이 알지 못한다.",0],["August 2nd","8월 2일",1],["I was filming some humpback whales underwater.","나는 물속에서 몇몇 혹등고래를 찍고 있었다.",1],["Suddenly, one whale came close and pushed me hard.","갑자기, 고래 한 마리가 가까이 와서 나를 세게 밀었다.",0],["I tried to swim away, but it kept pushing me out of the water.","나는 헤엄쳐 가려고 노력했지만, 그것은 계속해서 나를 물 밖으로 밀어냈다.",0],["I was so surprised.","나는 정말 놀랐다.",0],["Then somebody shouted from the boat, \"A tiger shark is coming!\"","그때 누군가 배에서 소리쳤다. \"뱀상어가 오고 있다!\"",0],["I safely got on the boat.","나는 안전하게 배 위에 탔다.",0],["I realized that the whale was trying to save me.","나는 그 고래가 나를 구하려고 애썼다는 것을 깨달았다.",0],["Humpback whales sometimes help other sea animals, but I never expected them to save my life.","혹등고래는 때때로 다른 동물들을 돕지만, 나는 그들이 내 생명을 살리리라고 전혀 예상하지 못했다.",0]];var RNUM=40;var TITLE_EN="I Love Humpback Whales";var PASS_EN=["I Love Humpback Whales","Kia Orana! I'm Nikau from New Zealand. I'm working at a whale research center in the Cook Islands. I think humpback whales are the most amazing animals in the ocean. I have kept a diary about them to record my work and thoughts.","July 1st","Finally, the humpback whales are back! They have traveled about 6,500 km from the Southern Ocean to give birth. The big and friendly giants came close to our boat and played for a while. All of a sudden, they jumped up high and made huge splashes. Watching whales never gets boring.","July 17th","Today, I flew a drone to tag humpback whales. I followed them closely and dropped tags carefully onto their backs. We get a lot of information about them from the tags. I am particularly interested in their songs, and the tags have recorded them for several years. Their songs last up to 30 minutes and can travel thousands of kilometers underwater! The songs are beautiful, but we still don't know much about them.","August 2nd","I was filming some humpback whales underwater. Suddenly, one whale came close and pushed me hard. I tried to swim away, but it kept pushing me out of the water. I was so surprised. Then somebody shouted from the boat, \"A tiger shark is coming!\" I safely got on the boat. I realized that the whale was trying to save me. Humpback whales sometimes help other sea animals, but I never expected them to save my life."];var PASS_KO=["나는 혹등고래를 사랑해","안녕하세요! 저는 뉴질랜드에서 온 Nikau입니다. 저는 쿡 제도에 있는 고래 연구소에서 일하고 있어요. 저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요. 저는 제 일과 생각들을 기록하기 위해서 그들에 대한 일기를 써 오고 있습니다.","7월 1일","마침내, 혹등고래들이 돌아왔다! 그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다. 그 크고 친근한 거대한 동물들이 우리의 보트에 가까이 왔고 잠시 동안 놀았다. 갑자기, 그들이 높이 뛰어올라 거대한 물보라를 만들었다. 고래들을 보는 것은 절대로 지루해지지 않는다.","7월 17일","오늘, 나는 혹등고래에 태그를 달기 위해 드론을 날렸다. 나는 그들을 가까이 따라갔고 그들의 등에 태그를 조심스럽게 떨어뜨렸다. 우리는 그 태그로부터 그들에 대한 많은 정보를 얻는다. 나는 특히 그들의 노래에 관심을 가지고 있고, 그 태그들은 그것들을 몇 년 동안 녹음해 오고 있다. 그들의 노래는 30분까지 지속되며, 물속에서 수천 킬로미터를 이동할 수 있다! 그 노래들은 아름답지만, 우리는 여전히 그것들에 대해 많이 알지 못한다.","8월 2일","나는 물속에서 몇몇 혹등고래를 찍고 있었다. 갑자기, 고래 한 마리가 가까이 와서 나를 세게 밀었다. 나는 헤엄쳐 가려고 노력했지만, 그것은 계속해서 나를 물 밖으로 밀어냈다. 나는 정말 놀랐다. 그때 누군가 배에서 소리쳤다. \"뱀상어가 오고 있다!\" 나는 안전하게 배 위에 탔다. 나는 그 고래가 나를 구하려고 애썼다는 것을 깨달았다. 혹등고래는 때때로 다른 동물들을 돕지만, 나는 그들이 내 생명을 살리리라고 전혀 예상하지 못했다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하는 것은?","o":["모든 호랑이는 서로 다른 줄무늬를 가지고 있다.","모든 호랑이는 똑같은 줄무늬를 가지고 있다.","호랑이는 줄무늬가 없는 동물이다.","호랑이의 줄무늬는 나이가 들면 사라진다.","소년은 이미 호랑이의 줄무늬에 대해 다 알고 있었다."],"a":0,"ans":"모든 호랑이는 서로 다른 줄무늬를 가지고 있다.","evs":[["No, they don't. They all have different stripes.","아니, 그렇지 않아. 호랑이들은 모두 줄무늬가 달라."]],"ev":["No, they don't. They all have different stripes.","아니, 그렇지 않아. 호랑이들은 모두 줄무늬가 달라."],"ow":["정답 ○ — 소녀가 'They all have different stripes.'(호랑이들은 모두 줄무늬가 달라.)라고 했으므로 모든 호랑이의 줄무늬는 서로 다르다.","오답 ✕ — 소년이 'Do all tigers have the same stripes?'(모든 호랑이가 같은 줄무늬를 가지고 있을까?)라고 묻자 소녀가 'No, they don't.'(아니, 그렇지 않아.)라고 했으므로 틀림.","오답 ✕ — 소녀가 'I think tigers' stripes are cool.'(호랑이의 줄무늬가 멋있다고 생각해.)라고 했으므로 줄무늬가 있는 동물이라서 틀림.","오답 ✕ — 대화에는 줄무늬가 나이가 들면 사라진다는 내용이 없고 'They all have different stripes.'(모두 줄무늬가 달라.)라고만 해서 틀림.","오답 ✕ — 소년은 'I'm so curious about it.'(정말 궁금하다.)이라고 했고 'Oh, that's surprising!'(아, 놀랍다!)이라고 했으므로 몰랐던 사실이라서 틀림."],"memo":["정답: 호랑이는 모두 서로 다른 줄무늬를 가지고 있다.","근거: They all have different stripes.(호랑이들은 모두 줄무늬가 달라.)","함정: same(같은)과 different(다른)를 헷갈리지 말기."],"why":"호랑이는 저마다 다른 줄무늬를 가지고 있다."}],"dlg":[["G","I think tigers' stripes are cool.","나는 호랑이의 줄무늬가 멋있다고 생각해."],["B","Right. Do all tigers have the same stripes? I'm so curious about it.","맞아. 모든 호랑이가 같은 줄무늬를 가지고 있을까? 정말 궁금하다."],["G","No, they don't. They all have different stripes.","아니, 그렇지 않아. 호랑이들은 모두 줄무늬가 달라."],["B","Oh, that's surprising!","아, 놀랍다!"]]},{"qs":[{"n":2,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["The boy is talking about facts about octopuses.","The girl wonders about the number of octopuses' brains.","Octopuses have more than five brains.","Octopuses have three hearts.","The girl isn't surprised by the facts about octopuses."],"a":4,"ans":"The girl isn't surprised by the facts about octopuses.","evs":[["Wow, that's surprising.","와, 놀랍다."],["They have nine brains.","아홉 개야."]],"ev":["Wow, that's surprising.","와, 놀랍다."],"ow":["일치 ○ — 소년이 'Did you know that octopuses have many brains?'(문어에게 뇌가 많다는 거 알았니?)라고 했으므로 문어에 관한 사실을 말하고 있다.","일치 ○ — 소녀가 'How many brains do they have?'(뇌가 몇 개 있어?)라고 물었으므로 뇌의 개수가 궁금한 것이 맞다.","일치 ○ — 소년이 'They have nine brains.'(아홉 개야.)라고 했으므로 5개보다 많이 가지고 있다.","일치 ○ — 소년이 'They also have three hearts!'(심장도 세 개나 있어!)라고 했으므로 맞는 설명이다.","정답 ○(일치하지 않음) — 소녀가 'Wow, that's surprising.'(와, 놀랍다.)이라고 했으므로 놀라지 않았다는 설명은 반대이다."],"memo":["정답 ⑤: 소녀는 문어에 대한 사실에 놀랐다.","근거: Wow, that's surprising.(와, 놀랍다.)","함정: 문어는 뇌 9개, 심장 3개이다."],"why":"소녀는 문어의 사실에 놀랐으므로 ⑤가 틀린 내용이다."}],"dlg":[["B","Did you know that octopuses have many brains?","문어에게 뇌가 많다는 거 알았니?"],["G","No, I didn't. I'm so curious about it. How many brains do they have?","아니, 몰랐어. 정말 궁금하다. 뇌가 몇 개 있어?"],["B","They have nine brains. And you know what? They also have three hearts!","아홉 개야. 그리고 있잖아? 심장도 세 개나 있어!"],["G","Wow, that's surprising.","와, 놀랍다."]]},{"qs":[{"n":3,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["sleep - surprised","run - bored","eat - angry","sleep - sad","jump - worried"],"a":0,"ans":"sleep - surprised","evs":[["Horses can sleep on their feet.","말은 선 채로 잘 수 있대."],["That's surprising!","놀랍다!"]],"ev":["Horses can sleep on their feet.","말은 선 채로 잘 수 있대."],"ow":["정답 ○ — 'Horses can sleep on their feet.'(말은 선 채로 잘 수 있대.)와 소년의 'That's surprising!'(놀랍다!)이므로 sleep과 surprised가 맞다.","오답 ✕ — 'Horses can sleep on their feet.'(말은 선 채로 잘 수 있대.)라고 했는데 run은 아니고, 소년은 'That's surprising!'(놀랍다!)이라고 했는데 bored(지루한)도 반대여서 틀림.","오답 ✕ — 말은 sleep 한다고 했는데 eat이 아니고, 소년은 화가 난 것이 아니라 'That's surprising!'(놀랍다!)이라고 했으므로 틀림.","오답 ✕ — (A) sleep은 맞지만, 소년은 슬퍼한 것이 아니라 'That's surprising!'(놀랍다!)이라고 했으므로 sad는 틀림.","오답 ✕ — 말은 'sleep on their feet'(서서 잔다)이지 jump가 아니고, 소년은 걱정한 것이 아니라 놀랐으므로 틀림."],"memo":["정답: 말은 선 채로 sleep 하고, 소년은 surprised 했다.","근거: Horses can sleep on their feet.(말은 선 채로 잘 수 있대.)","함정: surprising(놀라운)은 사실, surprised(놀란)는 사람의 감정이다."],"why":"말이 서서 잔다는 사실에 소년이 놀랐다.","sum":"The girl read in a magazine that horses can (A) on their feet, and the boy was (B).","lab":"완성된 요약문 : "}],"dlg":[["G","I read an interesting fact about horses in a magazine.","나 잡지에서 말에 관한 흥미로운 사실을 읽었어."],["B","What is it? I'm so curious about it.","그게 뭐야? 정말 궁금하다."],["G","Horses can sleep on their feet.","말은 선 채로 잘 수 있대."],["B","That's surprising!","놀랍다!"],["G","You can read more about other animals in this magazine. Take a look.","이 잡지에서 다른 동물들에 대해서도 더 읽을 수 있어. 한번 봐."]]},{"qs":[{"n":4,"q":"위 대화의 주제로 알맞은 것은?","o":["기린의 서식지","기린의 혀의 기능","기린에 관한 다큐멘터리 제작","기린에 대한 재미있는 사실들","기린의 흥미로운 생존 전략들"],"a":3,"ans":"기린에 대한 재미있는 사실들","evs":[["Did you know that their tongues are very unique?","기린의 혀가 아주 독특하다는 거 알았니?"],["Also, I learned that their tongues are black.","또, 기린의 혀가 검은색이라는 것도 알게 됐어."]],"ev":["Did you know that their tongues are very unique?","기린의 혀가 아주 독특하다는 거 알았니?"],"ow":["오답 ✕ — 'giraffes are the tallest land animals in the world'(기린은 세상에서 가장 키가 큰 육지 동물이야)라는 말은 있지만 기린이 사는 곳(서식지)에 대한 언급은 없어서 틀림.","오답 ✕ — 'Giraffes can reach the highest leaves with their tongues.'(혀로 가장 높은 잎까지 닿을 수 있어.)처럼 혀 이야기는 일부일 뿐, 대화 전체는 기린에 대한 여러 사실이어서 너무 좁아 틀림.","오답 ✕ — 'Did you watch the documentary about giraffes yesterday?'(어제 기린에 관한 다큐멘터리 봤니?)로 시작하지만 다큐멘터리를 만드는 이야기는 없어서 틀림.","정답 ○ — 키가 가장 큰 육지 동물, 긴 목과 다리, 50cm의 혀, 검은 혀 등 기린에 대한 흥미로운 사실들을 이야기하므로 맞다.","오답 ✕ — 'Giraffes can reach the highest leaves with their tongues.'(혀로 가장 높은 잎까지 닿을 수 있어.)가 나오지만 생존 전략을 말하는 대화는 아니어서 틀림."],"memo":["정답: 기린에 대한 재미있는 사실들","근거: Wow, giraffes are so interesting!(와, 기린은 정말 흥미롭다!)","함정: 혀 이야기는 여러 사실 중 일부이다."],"why":"기린에 대한 재미있는 사실들을 나누는 대화이다."},{"n":5,"q":"위 대화를 읽고 답할 수 없는 것은?","o":["When did Alex watch the documentary about giraffes?","How long are giraffes' necks and legs?","How long are giraffes' tongues?","Where do giraffes reach with their tongues?","What color are giraffes' tongues?"],"a":1,"ans":"How long are giraffes' necks and legs?","evs":[["Right. Their necks and legs are so long.","맞아. 목과 다리가 정말 길어."],["They're really long. They're about 50 cm!","정말 길어. 약 50cm나 돼!"]],"ev":["Right. Their necks and legs are so long.","맞아. 목과 다리가 정말 길어."],"ow":["답할 수 있음 ✕ — 'Did you watch the documentary about giraffes yesterday?'(어제 기린에 관한 다큐멘터리 봤니?)에 Alex가 'Yes, I did.'(응, 봤어.)라고 했으므로 어제 봤다는 것을 알 수 있어서 정답이 아님.","정답 ○(답할 수 없음) — 'Their necks and legs are so long.'(목과 다리가 정말 길어.)라고만 했지 몇 센티미터인지는 나오지 않아 알 수 없다.","답할 수 있음 ✕ — 'They're about 50 cm!'(약 50cm나 돼!)라고 했으므로 혀의 길이는 알 수 있어서 정답이 아님.","답할 수 있음 ✕ — 'Giraffes can reach the highest leaves with their tongues.'(혀로 가장 높은 곳의 잎까지 닿을 수 있어.)라고 했으므로 알 수 있어서 정답이 아님.","답할 수 있음 ✕ — 'I learned that their tongues are black.'(기린의 혀가 검은색이라는 것도 알게 됐어.)라고 했으므로 색깔은 알 수 있어서 정답이 아님."],"memo":["정답 ②: 기린의 목과 다리의 구체적인 길이는 나오지 않는다.","근거: Their necks and legs are so long.(목과 다리가 정말 길어.) — 숫자는 없음","함정: 혀의 길이는 50cm로 나오지만 목과 다리의 길이는 안 나온다."],"why":"목과 다리의 길이는 숫자로 나오지 않아 답할 수 없다."}],"dlg":[["Minji","Kate, Alex! Did you watch the documentary about giraffes yesterday?","케이트, 알렉스! 어제 기린에 관한 다큐멘터리 봤니?"],["Alex","Yes, I did. It was interesting.","응, 봤어. 흥미로웠어."],["Kate","Oh, I didn't. What did you learn about them?","아, 난 못 봤어. 그것에 대해 뭘 알게 됐니?"],["Minji","You know, giraffes are the tallest land animals in the world.","있잖아, 기린은 세상에서 키가 가장 큰 육지 동물이야."],["Alex","Right. Their necks and legs are so long.","맞아. 목과 다리가 정말 길어."],["Minji","Did you know that their tongues are very unique?","기린의 혀가 아주 독특하다는 거 알았니?"],["Kate","What do you mean? I'm curious about it.","무슨 말이야? 궁금하다."],["Alex","They're really long. They're about 50 cm! Giraffes can reach the highest leaves with their tongues.","정말 길어. 약 50cm나 돼! 기린은 혀로 가장 높은 곳에 있는 잎까지 닿을 수 있어."],["Kate","That's surprising!","놀랍다!"],["Minji","Also, I learned that their tongues are black.","또, 기린의 혀가 검은색이라는 것도 알게 됐어."],["Kate","Wow, giraffes are so interesting!","와, 기린은 정말 흥미롭다!"]]}];var BG=[{"qs":[{"n":6,"q":"다음 요약문의 빈칸 (A), (B)에 들어갈 말로 알맞은 것은?","o":["diary - most amazing","diary - most dangerous","report - most amazing","letter - most friendly","song - most beautiful"],"a":0,"ans":"diary - most amazing","evs":[["I think humpback whales are the most amazing animals in the ocean.","저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요."],["I have kept a diary about them to record my work and thoughts.","저는 제 일과 생각들을 기록하기 위해서 그들에 대한 일기를 써 오고 있습니다."]],"ev":["I think humpback whales are the most amazing animals in the ocean.","저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요."],"ow":["정답 ○ — 'I have kept a diary about them'(그들에 대한 일기를 써 오고 있습니다)와 'humpback whales are the most amazing animals in the ocean'(혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요)이므로 diary와 most amazing이 맞다.","오답 ✕ — (A) diary는 맞지만, 'the most amazing animals'(가장 놀라운 동물)라고 했으므로 most dangerous(가장 위험한)는 틀림.","오답 ✕ — (B) most amazing은 맞지만, 'I have kept a diary'(일기를 써 오고 있습니다)라고 했으므로 report(보고서)는 틀림.","오답 ✕ — 본문에는 'a diary'(일기)라고 했으므로 letter(편지)가 아니고, 'most amazing'이므로 most friendly도 틀림. friendly는 'The big and friendly giants'(크고 친근한 거대한 동물들)에서 나온 표현일 뿐이다.","오답 ✕ — Nikau가 쓰는 것은 'a diary'(일기)이지 노래(song)가 아니고, 'most amazing'인데 most beautiful은 틀림."],"memo":["정답: Nikau는 혹등고래에 대한 diary를 쓰고 고래를 most amazing animals라고 생각한다.","근거: I think humpback whales are the most amazing animals in the ocean.(저는 혹등고래가 바다에서 가장 놀라운 동물이라고 생각해요.)","함정: friendly는 7월 1일 일기에 나오는 표현이다."],"why":"Nikau는 고래 일기를 쓰며 혹등고래를 가장 놀라운 동물로 생각한다.","sum":"Nikau works at a whale research center and keeps a (A) about humpback whales, which he thinks are the (B) animals in the ocean.","lab":"완성된 요약문 : "},{"n":7,"q":"7월 1일 일기의 내용과 일치하는 것은?","o":["혹등고래들이 새끼를 낳으려고 약 6,500km를 이동해 돌아왔다.","고래들은 보트를 보고 멀리 도망갔다.","Nikau는 고래를 보는 것이 곧 지루해진다고 했다.","고래들은 물속에서 조용히 헤엄치기만 했다.","혹등고래들은 먹이를 찾으려고 남극해로 떠났다."],"a":0,"ans":"혹등고래들이 새끼를 낳으려고 약 6,500km를 이동해 돌아왔다.","evs":[["They have traveled about 6,500 km from the Southern Ocean to give birth.","그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다."],["The big and friendly giants came close to our boat and played for a while.","그 크고 친근한 거대한 동물들이 우리의 보트에 가까이 왔고 잠시 동안 놀았다."]],"ev":["They have traveled about 6,500 km from the Southern Ocean to give birth.","그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다."],"ow":["정답 ○ — 'They have traveled about 6,500 km from the Southern Ocean to give birth.'(그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다.)이므로 맞는 설명이다.","오답 ✕ — 본문에는 'came close to our boat and played for a while'(우리의 보트에 가까이 와서 잠시 동안 놀았다)라고 했으므로 도망간 것이 아니라 가까이 와서 놀았다. 그래서 틀림.","오답 ✕ — 본문에는 'Watching whales never gets boring.'(고래들을 보는 것은 절대로 지루해지지 않는다.)라고 했으므로 지루해진다는 설명은 반대여서 틀림.","오답 ✕ — 본문에는 'they jumped up high and made huge splashes'(높이 뛰어올라 거대한 물보라를 만들었다)라고 했으므로 조용히 헤엄치기만 한 것이 아니라서 틀림.","오답 ✕ — 본문에는 'traveled ... from the Southern Ocean'(남극해로부터 이동했다)이라고 했으므로 남극해로 떠난 것이 아니라 남극해에서 온 것이라서 틀림. 또 이유도 먹이가 아니라 'to give birth'(새끼를 낳기 위해)이다."],"memo":["정답: 혹등고래들은 새끼를 낳으려고 남극해에서 약 6,500km를 이동해 왔다.","근거: They have traveled about 6,500 km from the Southern Ocean to give birth.(그들은 새끼를 낳기 위해 남극해로부터 약 6,500km를 이동하였다.)","함정: from(~로부터)과 to give birth(새끼를 낳기 위해)를 정확히 읽기."],"why":"혹등고래들은 새끼를 낳으려고 먼 거리를 이동해 왔다."}],"pp":[["Kia Orana!","안녕하세요!"],["I'm Nikau from New Zealand.","저는 뉴질랜드에서 온 Nikau입니다."],["I'm working at a whale research center in the Cook Islands.","저는 쿡 제도에 있는 고래 연구소에서 일하고 있어요."],["I think humpback whales are the most amazing animals in  return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
