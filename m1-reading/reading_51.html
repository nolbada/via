,"point":"to부정사의 명사적 용법: 동사 wanted의 목적어로 to부정사 사용 (동명사 singing 불가)","topic":"to부정사의 명사적 용법","memo":"동사 wanted의 목적어로 to부정사 사용 (동명사 singing 불가)"},{"wrong":"to sing","right":"sing","partial":false,"at":[14],"point":"조동사: can 뒤에는 동사원형 사용 (to 불필요)","topic":"조동사","memo":"can 뒤에는 동사원형 사용 (to 불필요)"}]}];var RNUM=51;var TITLE_EN="Happy Hangeul Day";var PASS_EN=["Happy Hangeul Day","Reporter: Today is October 9, a special day for Hangeul, the Korean alphabet. I’m at a Hangeul festival now. People are enjoying fun activities here. They look happy and excited. I’m going to interview three Hangeul lovers.","Pueng, 13, student, Thailand","Anna, 27, designer, Switzerland","William, 51, professor, Canada","Reporter: Here is my first question. Why do you like Hangeul?","Pueng: I like Hangeul because it is easy to learn. I learned the 24 letters of Hangeul, and I am able to read any Korean word now.","Anna: The shapes of Hangeul look unique and beautiful. I like the Korean word for Switzerland, “스위스[seu-wi-seu].” It looks like a soldier between two mountains. It looks great!","William: I like Hangeul because its history is amazing. A long time ago, most Koreans couldn’t read or write. King Sejong felt bad about this, so he created a new alphabet for his people.","Reporter: You all really love Hangeul! How did you start learning it?","Pueng: I’m a big fan of K-pop songs. Because I wanted to sing Korean songs, I started learning Hangeul. Now I can sing many K-pop songs!","William: I wanted to teach the science of Hangeul to my students. Some letters look like the shape of the mouth and tongue for their sounds. King Sejong made it that way. It’s very scientific.","Reporter: Thank you for sharing your stories. Enjoy this festival!"];var PASS_KO=["행복한 한글날","기자: 오늘은 한국의 문자인 한글을 위한 특별한 날인 10월 9일입니다. 저는 지금 한글 축제에 와 있습니다. 사람들은 이곳에서 재미있는 활동들을 즐기고 있습니다. 그들은 행복하고 신나 보입니다. 저는 세 명의 한글 애호가를 인터뷰할 것입니다.","Pueng, 13세, 학생, 태국","Anna, 27세, 디자이너, 스위스","William, 51세, 교수, 캐나다","기자: 저의 첫 번째 질문입니다. 여러분은 왜 한글을 좋아하시나요?","Pueng: 저는 한글이 배우기 쉽기 때문에 그것을 좋아해요. 저는 한글의 24개 글자를 배웠고, 이제 어떤 한글 단어든 읽을 수 있어요.","Anna: 한글의 모양은 독특하고 아름다워 보여요. 저는 스위스를 나타내는 한글 단어 ‘스위스’를 좋아해요. 그것은 두 개의 산들 사이에 있는 군인처럼 보여요. 그것은 멋져 보여요!","William: 저는 한글의 역사가 대단하기 때문에 그것을 좋아해요. 오래전, 대부분의 한국인들은 읽거나 쓸 수 없었어요. 세종대왕은 이것에 대해 안타깝게 느껴서, 그의 백성들을 위해 새로운 문자를 창제했어요.","기자: 여러분 모두 한글을 정말 사랑하시네요! 여러분은 어떻게 그것을 배우기 시작하셨나요?","Pueng: 저는 케이팝 노래의 열렬한 팬이에요. 저는 한국 노래를 부르고 싶었기 때문에, 한글을 배우기 시작했어요. 이제 저는 많은 케이팝 노래를 부를 수 있어요!","Anna: 저는 저의 디자인에 한글을 사용하는 것에 관심이 있었어요. 그래서 저는 한글의 모양을 공부했어요. 저는 한글로 옷에 독특한 무늬들을 만들 수 있어요.","William: 저는 저의 학생들에게 한글의 과학을 가르쳐 주고 싶었어요. 몇몇 글자들은 그것들의 소리를 내기 위한 입과 혀의 모양처럼 보여요. 세종대왕이 그런 방식으로 그것을 만들었죠. 그것은 매우 과학적이에요.","기자: 여러분의 이야기를 공유해 주셔서 감사드립니다. 이 축제를 즐기세요!"];var DLG=[["G","Hi, Yejun! How was your trip to Andong?","안녕, 예준아! 안동 여행은 어땠어?"],["B","It was great! I watched a Hahoe talchum performance.","정말 좋았어! 나는 하회 탈춤 공연을 봤어."],["G","What is Hahoe talchum?","하회 탈춤이 뭐야?"],["B","It is a traditional Korean dance drama. The dancers wear masks and dance to exciting music.","그건 한국의 전통 무용극이야. 무용수들은 탈을 쓰고 신나는 음악에 맞춰 춤을 춰."],["G","Sounds interesting! What else did you do?","흥미롭다! 그 밖에 또 뭘 했어?"],["B","I ate jjimdak. Andong is famous for jjimdak! It is a chicken dish, and it’s delicious.","나는 찜닭을 먹었어. 안동은 찜닭으로 유명해! 그건 닭고기 요리이고, 맛있어."],["G","Wow, I really want to try it.","와, 나도 정말 먹어 보고 싶다."],["B","Why don’t we eat jjimdak together sometime?","언제 같이 찜닭을 먹는 게 어때?"],["G","I’d love to.","좋아, 그러고 싶어."]];var BQ=[{"n":1,"q":"Yejun은 어디를 여행하고 왔나요?","o":["전주","부산","안동","경주","제주"],"a":2,"ev":["How was your trip to Andong?","안동 여행은 어땠어?"],"why":"소녀가 여행지를 넣어 물어본 문장에 답이 있어요.","ans":"안동","memo":["Yejun의 여행지 = 안동","How was your trip to Andong? (안동 여행은 어땠어?)"]},{"n":2,"q":"Yejun이 여행에서 본 것은 무엇인가요?","o":["하회 탈춤 공연","농악 공연","한글 축제","전통 혼례식","불꽃놀이"],"a":0,"ev":["I watched a Hahoe talchum performance.","나는 하회 탈춤 공연을 봤어."],"why":"watched 뒤에 본 것이 나와요.","ans":"하회 탈춤 공연","memo":["Yejun이 본 것 = 하회 탈춤 공연","I watched a Hahoe talchum performance. (나는 하회 탈춤 공 function relayUp(){var st=[aDone(),!!qdone[0],!!qdone[1]],nm=['본문 오류 찾기','대화문 내용 5문제','본문 내용 5문제'],f=-1;for(var i=0;i<3;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}

function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})}

function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];

 });

function dlgHtml(d,lock){
 var h='<div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pass!=null)h+=passHtml(g.pass,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/5</span><button data-subq="'+p+'">제출하기</button></div>';
 return h;
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div><div class="pt" style="margin-top:4px">'+esc(q.why)+'</div></div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 5문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">틀린 문제'+(ms.length>cap?' '+ms.length+'개 중 '+cap+'개':'')+'만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

render();
</script></body></html>
