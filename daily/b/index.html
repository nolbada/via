 the two brothers divided their property equally."],"hc":"property|property|property|property","mn":"재산 / 속성, 성질","hk":"property(재산, 속성)에서 ①번만 소금이 가진 성질 뜻. ②③④는 모두 누군가가 소유한 재산.","ex":[["Oil has [[the property of floating]] on water.","기름은 물 위에 [[뜨는 성질]]이 있다.","property (명) 속성, 성질"],["Do not enter [[private property]].","[[사유 재산]]에 들어가지 마세요.","property (명) 재산"],["He sold [[his property]] and moved abroad.","그는 [[자신의 재산]]을 팔고 해외로 이사했다.","property (명) 재산"]]}]},{"day":16,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"specific","a":"1,4","e":"① precise: 정확한, 정밀한 (그 판사는 대략적인 추측이 아니라 구체적인 날짜와 시간을 요구했다.) / specific(구체적인, 명확한)의 유의어.\n④ particular: 특정한, 특별한","w":"② broad: 광범위한, 넓은\n③ overall: 전반적인","k":"그 판사는 대략적인 추측이 아니라 구체적인 날짜와 시간을 요구했다.","m":2,"s":"The judge asked for a specific date and time, not a rough guess.","h":"specific","c":["precise","broad","overall","particular"],"mn":"구체적인, 명확한","hk":"specific(구체적인)은 precise(정확한), particular(특정한)와 같은 편. broad(광범위한), overall(전반적인)은 반대 느낌이라 오답.","ex":[["The teacher gave us [[specific instructions]] for the test.","선생님은 시험에 대한 [[구체적인 지시]]를 우리에게 주셨다."],["Please give me [[a specific example]] of your idea.","당신의 생각에 대한 [[구체적인 예]]를 하나 들어 주세요."],["She has not made [[a specific plan]] for the weekend yet.","그녀는 아직 주말에 대한 [[구체적인 계획]]을 세우지 않았다."]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"imaginative","a":"2","e":"② imaginative: 상상력이 풍부한","w":"① 상상 속의, 가상의(imaginary)\n③ 감수성이 예민한(sensitive)\n④ 인상적인(impressive)","m":0,"s":"imaginative","c":["상상 속의, 가상의","상상력이 풍부한","감수성이 예민한","인상적인"],"mn":"상상력이 풍부한","hk":"imaginative(상상력이 풍부한)는 imagine(상상하다)에서 나온 말. imaginary(상상 속의)와 철자가 닮았지만 사람의 능력이 아니라 가상.","ex":[["She is [[an imaginative child]] who loves making up stories.","그녀는 이야기 지어내기를 좋아하는 [[상상력이 풍부한 아이]]이다."],["The artist found [[an imaginative way]] to reuse old boxes.","그 예술가는 낡은 상자를 다시 쓸 [[상상력이 풍부한 방법]]을 찾아냈다."],["His story is full of [[imaginative ideas]].","그의 이야기는 [[상상력이 풍부한 생각]]으로 가득하다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"commerce","a":"commerce","e":"commerce 상업, 무역","k":"온라인 상업은 사람들이 물건을 사고파는 방식을 완전히 바꾸었다.","m":0,"s":"Online c______ has completely changed the way people buy and sell goods.","mn":"상업, 무역","hk":"commerce(상업)는 m을 두 번 쓰고 끝은 -erce. 대표 짝 e-commerce(전자 상거래)로 철자 기억.","ex":[["[[Online commerce]] is growing very fast.","[[온라인 상업]]이 매우 빠르게 성장하고 있다."],["The town is a center of [[trade and commerce]].","그 도시는 [[무역과 상업]]의 중심지이다."],["Many small shops now sell goods through [[e-commerce]].","많은 작은 가게들이 이제 [[전자 상거래]]로 물건을 판다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"community","a":"2","e":"② community: (같은 지역에 사는 모든 사람들 / 그리고 같은 관습과 관심사를 함께 나누는) 공동체, 지역 사회 (같은 지역에 살면서 같은 관습과 관심사를 공유하는 모든 사람들)","w":"① population: 인구\n③ audience: 청중, 관객\n④ household: 가정, 세대","k":"같은 지역에 사는 모든 사람들 / 그리고 같은 관습과 관심사를 함께 나누는","m":0,"s":"\"all the people who live in the same area and share the same customs and interests\"","c":["population","community","audience","household"],"mn":"공동체, 지역 사회 (같은 지역에 살면서 같은 관습과 관심사를 공유하는 모든 사람들)","hk":"community(공동체)는 같은 지역에 살며 관습을 나누는 사람들. population(인구), audience(청중), household(가정)는 범위나 성격이 달라 오답.","ex":[["Our [[local community]] helped the family after the fire.","우리 [[지역 사회]]는 화재 후에 그 가족을 도왔다."],["The school asked students to do [[community service]].","학교는 학생들에게 [[지역 사회 봉사]]를 하라고 요청했다."],["The small town has [[a strong sense of community]].","그 작은 마을에는 [[강한 공동체 의식]]이 있다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"eventual","a":"4","e":"eventual (형) 최종적인, 결국의 - eventually (부) 결국, 마침내\n④ mutual (형) 상호간의, 서로의 - mutually (부) 서로, 상호간에","w":"① mercy (명) 자비, 인정 - mercifully (부) 자비롭게, 다행스럽게도\n② consequence (명) 결과, 영향 - consequently (부) 그 결과, 따라서\n③ fortune (명) 행운, 재산 - fortunately (부) 다행히도","m":0,"s":"eventual - eventually","c":["mercy - mercifully","consequence - consequently","fortune - fortunately","mutual - mutually"],"mn":"최종적인, 결국의","hk":"형용사에서 부사로 가는 관계. eventual(최종적인)-eventually(결국)처럼 mutual(상호간의)-mutually(서로). 나머지는 명사 출발이라 오답.","ex":[["The [[eventual winner]] was a girl from Busan.","[[최종 우승자]]는 부산 출신의 한 소녀였다.","eventual (형) 최종적인, 결국의"],["[[Eventually]], we found the right road.","[[결국]] 우리는 올바른 길을 찾았다.","eventually (부) 결국, 마침내"],["They share [[a mutual friend]].","그들은 [[서로 아는 친구]]가 한 명 있다.","mutual (형) 상호간의, 서로의"],["They [[mutually agreed]] to end the contest.","그들은 시합을 끝내기로 [[서로 합의했다]].","mutually (부) 서로, 상호간에"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"concrete","a":"2","e":"② abstract: 추상적인 (그 보고서는 구체적인 사실과 명확한 숫자로 가득 차 있었다.) / concrete(구체적인, 실체가 있는)의 반의어.","w":"① definite: 확실한, 분명한\n③ factual: 사실에 근거한\n④ practical: 실용적인","k":"그 보고서는 구체적인 사실과 명확한 숫자로 가득 차 있었다.","m":0,"s":"The report was full of concrete facts and clear numbers.","h":"concrete","c":["definite","abstract","factual","practical"],"mn":"구체적인, 실체가 있는","hk":"concrete(구체적인)는 눈에 보이고 만져지는 느낌. 반대편은 abstract(추상적인). definite(확실한), practical(실용적인)은 뜻이 달라 오답.","ex":[["The teacher gave us [[concrete examples]] to explain the rule.","선생님은 규칙을 설명하려고 우리에게 [[구체적인 예]]를 주셨다.","concrete (형) 구체적인, 실체가 있는"],["We need [[concrete evidence]], not just guesses.","우리는 추측이 아니라 [[구체적인 증거]]가 필요하다.","concrete (형) 구체적인, 실체가 있는"],["Love is [[an abstract idea]] that is hard to touch or see.","사랑은 만지거나 볼 수 없는 [[추상적인 개념]]이다.","abstract (형) 추상적인"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"reacted","a":"3","e":"③ reacted: 반응하다 (react의 과거형) (그녀는 한밤중에 경보가 울렸을 때 재빨리 반응했다.)","w":"① whispered: 속삭이다 (whisper의 과거형)\n② replied: 대답하다 (reply의 과거형)\n④ nodded: 고개를 끄덕이다 (nod의 과거형)","k":"그녀는 한밤중에 경보가 울렸을 때 재빨리 반응했다.","m":0,"s":"She ________ quickly when the alarm went off in the middle of the night.","c":["whispered","replied","reacted","nodded"],"mn":"반응하다","hk":"reacted(반응했다)는 react(반응하다)의 과거형, react to(~에 반응하다) 짝. whispered(속삭였다), replied(대답했다), nodded(끄덕였다)는 오답.","ex":[["The dog [[reacted quickly]] to the loud noise.","그 개는 큰 소음에 [[재빨리 반응했다]]."],["Fans [[reacted angrily]] to the referee's decision.","팬들은 심판의 판정에 [[화를 내며 반응했다]]."],["She [[reacted with surprise]] when she saw the gift.","그녀는 선물을 보고 [[깜짝 놀라 반응했다]]."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"score","a":"score","e":"score (명) 점수 / (동) 득점하다","k":"마지막 호루라기 소리가 난 직후 최종 점수가 칠판에 적혔다.\n그는 팀을 구하기 위해 마지막 10분에 두 번 득점하려고 했다.","m":0,"s":"The final s______ was written on the board right after the last whistle.\nHe tried to s______ twice in the last ten minutes to save his team.","mn":"점수 / 득점하다","hk":"score(점수, 명사)와 score(득점하다, 동사)는 철자가 같은 쌍둥이. 문장 속 자리가 명사 자리인지 동사 자리인지로 구분.","ex":[["The [[final score]] was three to one.","[[최종 점수]]는 3대 1이었다.","score (명) 점수, 득점"],["He got [[a high score]] on the math test.","그는 수학 시험에서 [[높은 점수]]를 받았다.","score (명) 점수, 득점"],["Kim hopes to [[score a goal]] before the game ends.","김 선수는 경기가 끝나기 전에 [[골을 넣기를]] 바란다.","score (동) 득점하다"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"academic","a":"4","e":"④ academic: 학업의, 학문의","w":"① artistic: 예술의, 예술적인\n② athletic: 운동의, 체육의\n③ domestic: 국내의, 가정의","m":0,"s":"\"학업의, 학문의\"","c":["artistic","athletic","domestic","academic"],"mn":"학업의, 학문의","hk":"academic(학업의)은 academy(학원, 학교)에서 나온 말로 학업과 학문 쪽. artistic(예술의), athletic(운동의), domestic(국내의)은 -ic 끝만 닮은 속임수.","ex":[["Her [[academic performance]] improved this year.","그녀의 [[학업 성적]]은 올해 향상되었다."],["The new [[academic year]] starts in March.","새 [[학년도]]는 3월에 시작한다."],["He wrote an essay for [[an academic journal]].","그는 [[학술지]]에 실을 글을 썼다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"occupation","a":"1","e":"① profession: 직업, 전문직 (이 양식에 당신의 이름, 나이, 직업을 적어 주세요.) / occupation(직업, 일)의 유의어.","w":"② birthplace: 출생지\n③ nationality: 국적\n④ education: 학력, 교육","k":"이 양식에 당신의 이름, 나이, 직업을 적어 주세요.","m":0,"s":"Please write your name, age, and occupation on this form.","h":"occupation","c":["profession","birthplace","nationality","education"],"mn":"직업, 일","hk":"occupation(직업)은 profession(직업, 전문직)과 같은 편. birthplace(출생지), nationality(국적), education(학력)은 직업이 아님.","ex":[["What is your [[current occupation]]?","당신의 [[현재 직업]]은 무엇입니까?"],["Teaching is [[a rewarding occupation]] for many people.","가르치는 일은 많은 사람에게 [[보람 있는 직업]]이다."],["His [[main occupation]] is farming, but he also paints.","그의 [[주된 직업]]은 농사이지만 그림도 그린다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"diet","a":"3","e":"③ diet: (음식의 종류 / 사람이나 동물이 보통 먹는) 식단, 식생활 (사람이나 동물이 평소에 먹는 음식의 종류)","w":"① appetite: 식욕\n② meal: 식사, 끼니\n④ nutrition: 영양","k":"음식의 종류 / 사람이나 동물이 보통 먹는","m":0,"s":"\"the kind of food that a person or an animal usually eats\"","c":["appetite","meal","diet","nutrition"],"mn":"식단, 식생활 (사람이나 동물이 평소에 먹는 음식의 종류)","hk":"diet(식단)는 평소에 먹는 음식의 종류. appetite(식욕), meal(식사), nutrition(영양)은 입맛, 한 끼, 성분 얘기라 오답. 짝 a healthy diet(건강한 식단).","ex":[["Eating [[a healthy diet]] keeps your body strong.","[[건강한 식단]]을 먹으면 몸이 튼튼해진다."],["The panda's [[diet]] is mostly bamboo.","판다의 [[식단]]은 대부분 대나무이다."],["The doctor told him to [[change his diet]].","의사는 그에게 [[식단을 바꾸라고]] 말했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"delivery","a":"delivery","e":"delivery 배달","k":"그 가게는 이틀 안에 무료 배달을 약속했다.","m":0,"s":"The store promised free d______ within two days.","mn":"배달","hk":"delivery(배달)는 deliver(배달하다)에 -y만 붙인 모양, 마지막은 -ery. 대표 짝 free delivery(무료 배달)로 철자 기억.","ex":[["The store offers [[free delivery]] on big orders.","그 가게는 큰 주문에 [[무료 배달]]을 제공한다."],["[[Home delivery]] saves time for busy families.","[[집까지 배달]]은 바쁜 가족의 시간을 아껴 준다."],["The pizza [[delivery]] was late because of the rain.","비 때문에 피자 [[배달]]이 늦어졌다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"urban","a":"3","e":"③ rural: 시골의, 전원의 (더 많은 젊은이들이 조용한 산골 마을에서 살기 위해 도시 지역을 떠나고 있다.) / urban(도시의)의 반의어.","w":"① suburban: 교외의\n② crowded: 붐비는\n④ coastal: 해안의","k":"더 많은 젊은이들이 조용한 산골 마을에서 살기 위해 도시 지역을 떠나고 있다.","m":0,"s":"More young people are leaving urban areas to live in quiet mountain villages.","h":"urban","c":["suburban","crowded","rural","coastal"],"mn":"도시의","hk":"urban(도시의)의 반대편은 rural(시골의). suburban(교외의), crowded(붐비는), coastal(해안의)은 시골이 아니라 오답.","ex":[["Millions of people live in [[urban areas]].","수백만 명이 [[도시 지역]]에 산다.","urban (형) 도시의"],["[[Urban life]] is busy and noisy.","[[도시 생활]]은 바쁘고 시끄럽다.","urban (형) 도시의"],["They moved to a quiet [[rural area]] near the mountains.","그들은 산 근처의 조용한 [[시골 지역]]으로 이사했다.","rural (형) 시골의, 전원의"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"relationship","a":"1","e":"① relationship: 관계 (의사는 모든 환자와 신뢰하는 관계를 쌓아야 한다.)","w":"② membership: 회원 자격\n③ citizenship: 시민권\n④ hardship: 고난, 어려움","k":"의사는 모든 환자와 신뢰하는 관계를 쌓아야 한다.","m":0,"s":"A doctor must build a trusting ________ with every patient.","c":["relationship","membership","citizenship","hardship"],"mn":"관계","hk":"relationship(관계)은 relation(관련)에 -ship이 붙은 말. membership(회원 자격), citizenship(시민권), hardship(고난)는 속임수.","ex":[["She has [[a close relationship]] with her grandmother.","그녀는 할머니와 [[가까운 관계]]를 맺고 있다."],["Teachers try to [[build a relationship]] with each student.","선생님들은 학생 한 명 한 명과 [[관계를 쌓으려고]] 노력한다."],["The two countries have [[a good relationship]].","두 나라는 [[좋은 관계]]를 맺고 있다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"rest","a":"3","e":"①휴식 / ②휴식 / ③나머지 / ④휴식 [③번만 의미가 다름]","k":"①너 피곤해 보여; 정말 푹 자는 휴식이 필요하다.\n②긴 도보 여행 뒤에 우리는 큰 나무 아래에서 짧은 휴식을 취했다.\n③그녀는 피자의 절반을 먹고 나머지를 냉장고에 넣었다.\n④의사는 그에게 일주일 동안 충분한 휴식을 취하라고 말했다.","m":0,"c":["You look tired; you really need a good night's rest.","After the long hike, we took a short rest under a big tree.","She ate half of the pizza and put the rest in the fridge.","The doctor told him to get plenty of rest for a week."],"hc":"rest|rest|rest|rest","mn":"휴식 / 나머지","hk":"rest(휴식) 세 개 가운데 the rest(나머지)는 남은 부분이라 ③번만 다름. 쉬는 문맥이면 휴식, 남은 것을 가리키면 나머지.","ex":[["We took [[a short rest]] before climbing again.","우리는 다시 오르기 전에 [[짧은 휴식]]을 취했다.","rest (명) 휴식"],["You need [[a good rest]] after a long day.","긴 하루가 지나면 [[충분한 휴식]]이 필요하다.","rest (명) 휴식"],["Please finish [[the rest of your homework]] tonight.","오늘 밤 [[숙제의 나머지]]를 끝내라.","rest (명) 나머지"]]}]},{"day":17,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"skill","a":"3","e":"③ skill: (어떤 것을 잘하는 능력 / 당신이 그것을 많이 연습했기 때문에 생긴) 기술, 능력 (많이 연습했기 때문에 어떤 일을 잘할 수 있는 능력)","w":"① method: 방법\n② effort: 노력\n④ hobby: 취미","k":"어떤 것을 잘하는 능력 / 당신이 그것을 많이 연습했기 때문에 생긴","m":0,"s":"\"the ability to do something well because you have practiced it a lot\"","c":["method","effort","skill","hobby"],"mn":"기술, 능력 (많이 연습했기 때문에 어떤 일을 잘할 수 있는 능력)","hk":"skill(기술)은 연습을 많이 해서 생긴 능력. method(방법), effort(노력), hobby(취미)는 연습으로 생긴 능력과 뜻이 달라 오답.","ex":[["Cooking is [[a useful skill]] for everyone.","요리는 모두에게 [[유용한 기술]]이다."],["She has [[great writing skills]].","그녀는 [[뛰어난 글쓰기 실력]]을 가졌다."],["Reading is [[a basic skill]] we learn in school.","읽기는 학교에서 배우는 [[기본 기술]]이다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"neglect","a":"1","e":"① overlook: 간과하다, 못 보고 넘어가다 (바쁜 부모들은 때때로 자녀의 기분에 나타나는 작은 변화를 지나쳐 버린다.) / neglect(간과하다, 소홀히 하다)의 유의어.","w":"② monitor: 관찰하다, 감시하다\n③ correct: 바로잡다\n④ interpret: 해석하다","k":"바쁜 부모들은 때때로 자녀의 기분에 나타나는 작은 변화를 지나쳐 버린다.","m":0,"s":"Busy parents sometimes neglect the small changes in their children's mood.","h":"neglect","c":["overlook","monitor","correct","interpret"],"mn":"간과하다, 소홀히 하다","hk":"neglect(간과하다)는 overlook(간과하다)과 같은 편, 눈여겨보지 않고 지나침. monitor(관찰하다), correct(바로잡다), interpret(해석하다)는 다른 일.","ex":[["Don't [[neglect your health]] when you are busy.","바쁠 때 [[건강을 소홀히]] 하지 마라."],["He [[neglected his homework]] and got a bad grade.","그는 [[숙제를 소홀히 했고]] 나쁜 성적을 받았다."],["The owner [[neglected the garden]] for years.","주인은 몇 년 동안 [[정원을 돌보지 않았다]]."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"industrial","a":"3","e":"③ industrial: 산업의, 공업의","w":"① agricultural: 농업의\n② residential: 주거의\n④ commercial: 상업의","m":0,"s":"\"산업의, 공업의\"","c":["agricultural","residential","industrial","commercial"],"mn":"산업의, 공업의","hk":"industrial(산업의)은 industry(산업)에 -al이 붙은 형용사. agricultural(농업의), residential(주거의), commercial(상업의)은 분야가 다른 오답.","ex":[["The city has a large [[industrial area]].","그 도시에는 큰 [[산업 지역]]이 있다."],["[[Industrial waste]] pollutes the river.","[[산업 폐기물]]이 강을 오염시킨다."],["England led the [[Industrial Revolution]].","영국은 [[산업 혁명]]을 이끌었다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"network","a":"network","e":"network 네트워크, 망","k":"그 회사는 전국에 걸쳐 작은 사무실들의 망을 구축했다.","m":0,"s":"The company built a n______ of small offices across the whole country.","mn":"네트워크, 망","hk":"network(네트워크)는 net(그물)과 work(일)를 이어 붙인 두 토막 단어. 대표 짝 a network of roads(도로망).","ex":[["[[A computer network]] connects all the offices.","[[컴퓨터 네트워크]]가 모든 사무실을 연결한다."],["[[A network of roads]] connects the small towns.","[[도로망]]이 작은 마을들을 연결한다."],["Our school uses [[a wireless network]].","우리 학교는 [[무선 네트워크]]를 쓴다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"physical","a":"1,3","e":"① spiritual: 정신적인, 영적인 (매일 하는 수영이 그의 신체적인 힘을 조금씩 길러 주었다.) / physical(육체적인, 물질적인)의 반의어.\n③ mental: 정신의, 마음의","w":"② muscular: 근육의\n④ bodily: 신체의","k":"매일 하는 수영이 그의 신체적인 힘을 조금씩 길러 주었다.","m":2,"s":"Daily swimming built up his physical strength little by little.","h":"physical","c":["spiritual","muscular","mental","bodily"],"mn":"육체적인, 물질적인","hk":"physical(육체적인)의 반대편은 mental(정신의), spiritual(정신적인). muscular(근육의), bodily(신체의)는 같은 편이라 오답.","ex":[["Regular exercise gives you [[physical strength]].","규칙적인 운동은 당신에게 [[신체적인 힘]]을 준다.","physical (형) 육체적인, 물질적인"],["Many people look for [[spiritual peace]] in nature.","많은 사람이 자연에서 [[정신적 평화]]를 찾는다.","spiritual (형) 정신적인, 영적인"],["Stress can hurt your [[mental health]].","스트레스는 당신의 [[정신 건강]]을 해칠 수 있다.","mental (형) 정신의, 마음의"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"coach","a":"2","e":"② coach: 코치, 감독 (그 감독은 세 번 연속 패배한 뒤에 팀의 훈련 계획을 바꿨다.)","w":"① spectator: 관중\n③ referee: 심판\n④ reporter: 기자","k":"그 감독은 세 번 연속 패배한 뒤에 팀의 훈련 계획을 바꿨다.","m":0,"s":"The ________ changed the team's training plan after three straight losses.","c":["spectator","coach","referee","reporter"],"mn":"코치, 감독","hk":"coach(코치)는 팀 훈련 계획을 바꾸는 사람. spectator(관중)는 보는 사람, referee(심판)는 판정하는 사람, reporter(기자)는 기사 쓰는 사람이라 오답.","ex":[["The [[head coach]] praised the whole team.","[[감독]]은 팀 전체를 칭찬했다."],["She works as [[a swimming coach]].","그녀는 [[수영 코치]]로 일한다."],["Our [[coach]] told us to run ten laps.","우리 [[코치]]님은 열 바퀴를 뛰라고 하셨다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"manage","a":"4","e":"manage (동) 관리하다, 해내다 - manageable (형) 감당할 수 있는\n④ accept (동) 받아들이다 - acceptable (형) 받아들일 만한","w":"① fashion (명) 유행, 패션 - fashionable (형) 유행하는\n② misery (명) 비참함, 고통 - miserable (형) 비참한\n③ charity (명) 자선, 자선 단체 - charitable (형) 자선의, 인정 많은","m":0,"s":"manage - manageable","c":["fashion - fashionable","misery - miserable","charity - charitable","accept - acceptable"],"mn":"관리하다, 해내다","hk":"동사에 -able(~할 수 있는)이 붙어 형용사. manage(관리하다)-manageable(감당할 수 있는)처럼 accept(받아들이다)-acceptable(받아들일 만한). 명사 출발은 오답.","ex":[["She can [[manage her time well]].","그녀는 [[시간을 잘 관리할]] 수 있다.","manage (동) 관리하다, 해내다"],["The workload is [[manageable]] if we share it.","일을 나누면 업무량은 [[감당할 수 있다]].","manageable (형) 감당할 수 있는"],["Please [[accept my apology]].","[[제 사과를 받아]] 주세요.","accept (동) 받아들이다"],["Is this answer [[acceptable]] to you?","이 답이 당신에게 [[받아들일 만한가요]]?","acceptable (형) 받아들일 만한"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"literary","a":"3","e":"③ literary: 문학의","w":"① 읽고 쓸 줄 아는(literate)\n② 도서관의(library의)\n④ 글자 그대로의(literal)","m":0,"s":"literary","c":["읽고 쓸 줄 아는","도서관의","문학의","글자 그대로의"],"mn":"문학의","hk":"literary(문학의)는 literature(문학)와 한 가족. literate(읽고 쓸 줄 아는), literal(글자 그대로의), library(도서관)와 철자가 비슷한 속임수.","ex":[["She loves reading [[literary works]].","그녀는 [[문학 작품]] 읽기를 좋아한다."],["He won a famous [[literary prize]].","그는 유명한 [[문학상]]을 받았다."],["[[A literary magazine]] printed her poem.","[[문학 잡지]] 한 곳이 그녀의 시를 실었다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"context","a":"3","e":"③ context: (한 단어 주위에 있는 다른 단어들 / 당신이 이해하도록 돕는 / 그 단어가 무슨 뜻인지를) 문맥, 맥락 (어떤 단어가 무엇을 뜻하는지 이해하도록 도와주는 그 단어 주변의 다른 말들)","w":"① remark: 발언, 언급\n② phrase: 구, 어구\n④ heading: 표제, 제목","k":"한 단어 주위에 있는 다른 단어들 / 당신이 이해하도록 돕는 / 그 단어가 무슨 뜻인지를","m":0,"s":"\"the other words around a word that help you understand what it means\"","c":["remark","phrase","context","heading"],"mn":"문맥, 맥락 (어떤 단어가 무엇을 뜻하는지 이해하도록 도와주는 그 단어 주변의 다른 말들)","hk":"context(문맥)는 단어 주변의 다른 말들. remark(발언), phrase(구), heading(제목)은 말이나 글의 한 조각일 뿐. 대표 짝 in context(문맥 속에서).","ex":[["You can guess the meaning from [[the context]].","[[문맥]]으로 뜻을 짐작할 수 있다."],["Words can change meaning in [[a different context]].","단어는 [[다른 맥락]]에서 뜻이 달라질 수 있다."],["Try to read the word [[in context]].","그 단어를 [[문맥 속에서]] 읽어 보라."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"automatic","a":"1","e":"① manual: 수동의, 손으로 하는 (이 문은 자동이어서, 너는 그것을 직접 밀어서 열 필요가 전혀 없다.) / automatic(자동의, 자동으로 되는)의 반의어.","w":"② mechanical: 기계의\n③ portable: 휴대용의\n④ electric: 전기의","k":"이 문은 자동이어서, 너는 그것을 직접 밀어서 열 필요가 전혀 없다.","m":0,"s":"This gate is automatic, so you never have to push it open yourself.","h":"automatic","c":["manual","mechanical","portable","electric"],"mn":"자동의, 자동으로 되는","hk":"automatic(자동의)의 반대편은 manual(수동의), 손으로 직접 하는 느낌. mechanical(기계의), portable(휴대용의), electric(전기의)은 자동 여부와 무관한 종류.","ex":[["The store has [[automatic doors]].","그 가게에는 [[자동문]]이 있다.","automatic (형) 자동의, 자동으로 되는"],["I set [[an automatic reply]] for my emails.","나는 이메일에 [[자동 응답]]을 설정했다.","automatic (형) 자동의, 자동으로 되는"],["Press the button to switch to [[manual mode]].","[[수동 모드]]로 바꾸려면 버튼을 눌러라.","manual (형) 수동의, 손으로 하는"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"vacuum","a":"vacuum","e":"vacuum (명) 진공 / (동) 진공청소기로 청소하다","k":"우주 공간은 거의 완벽한 진공이어서 소리가 그것을 통과해 이동할 수 없다.\n직원들은 내일 손님들이 도착하기 전에 모든 방을 진공청소기로 청소할 것이다.","m":0,"s":"Outer space is almost a perfect v______, so sound cannot travel through it.\nThe staff will v______ every room before the guests arrive tomorrow.","mn":"진공 / 진공청소기로 청소하다","hk":"vacuum(진공)은 명사, vacuum(진공청소기로 청소하다)은 동사. 우주 공간 문장은 명사 자리, 방을 청소하는 문장은 동사 자리.","ex":[["Sound cannot travel through [[a vacuum]].","소리는 [[진공]]을 통과해 이동할 수 없다.","vacuum (명) 진공"],["I need to [[vacuum the floor]] before guests come.","손님이 오기 전에 [[바닥을 청소기로 청소해야]] 한다.","vacuum (동) 진공청소기로 청소하다"],["She will [[vacuum the carpet]] every Friday.","그녀는 매주 금요일마다 [[카펫을 청소기로 청소할]] 것이다.","vacuum (동) 진공청소기로 청소하다"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"intelligent","a":"3","e":"③ clever: 영리한, 똑똑한 (까마귀는 먹이를 얻기 위해 작은 도구를 사용할 수 있는 놀랍도록 총명한 새이다.) / intelligent(총명한, 지능이 높은)의 유의어.","w":"① witty: 재치 있는\n② playful: 장난기 많은\n④ fearless: 겁 없는","k":"까마귀는 먹이를 얻기 위해 작은 도구를 사용할 수 있는 놀랍도록 총명한 새이다.","m":0,"s":"Crows are surprisingly intelligent birds that can use small tools to get food.","h":"intelligent","c":["witty","playful","clever","fearless"],"mn":"총명한, 지능이 높은","hk":"intelligent(총명한)은 clever(영리한)와 같은 편. witty(재치 있는), playful(장난기 많은), fearless(겁 없는)는 성격 쪽이라 오답.","ex":[["She is [[an intelligent girl]] who learns fast.","그녀는 빨리 배우는 [[총명한 소녀]]이다."],["Dolphins are [[intelligent animals]].","돌고래는 [[지능이 높은 동물]]이다."],["He gave [[an intelligent answer]] to the hard question.","그는 어려운 질문에 [[총명한 대답]]을 했다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"civic","a":"4","e":"④ civic: 시민의 (시장은 학생들에게 공원 청소 같은 시민 활동에 참여해 달라고 요청했다.)\n※ civic activities(시민 활동)는 굳어진 표현이며, moral·national·religious는 공원 청소와 어울리지 않는다.","w":"① moral: 도덕적인\n② national: 국가의\n③ religious: 종교의","k":"시장은 학생들에게 공원 청소 같은 시민 활동에 참여해 달라고 요청했다.","m":0,"s":"The mayor asked students to join ________ activities such as cleaning the park.","c":["moral","national","religious","civic"],"mn":"시민의","hk":"civic(시민의)은 civic activities(시민 활동)로 굳어진 표현. moral(도덕적인), national(국가의), religious(종교의)는 공원 청소와 어울리지 않음.","ex":[["Voting is [[a civic duty]].","투표는 [[시민의 의무]]이다."],["The town built a new [[civic center]].","그 마을은 새 [[시민 회관]]을 지었다."],["Students joined [[civic activities]] after school.","학생들은 방과 후에 [[시민 활동]]에 참여했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"virtual","a":"virtual","e":"virtual 가상의","k":"팬데믹 기간 동안 우리는 매일 아침 집에서 가상 수업에 참여했다.","m":0,"s":"During the pandemic we joined a v______ class from home every morning.","mn":"가상의","hk":"virtual(가상의)은 가운데 tu를 놓치기 쉬운 철자. 대표 짝 virtual reality(가상 현실)로 기억.","ex":[["She tried [[virtual reality]] games at the museum.","그녀는 박물관에서 [[가상 현실]] 게임을 해 보았다."],["You can take [[a virtual tour]] of the museum online.","온라인으로 박물관의 [[가상 견학]]을 할 수 있다."],["[[A virtual classroom]] lets students learn from home.","[[가상 교실]]은 학생들이 집에서 배우게 해 준다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"article","a":"3","e":"①기사 / ②기사 / ③물품, 물건 / ④기사 [③번만 의미가 다름]","k":"①기후 변화에 관한 그 기사는 1면에 실렸다.\n②그녀는 지난주에 학교 신문에 실을 기사를 썼다.\n③그 가게의 모든 물품이 그 주말에 할인 판매되었다.\n④나는 오늘 아침 우주여행에 관한 흥미로운 기사를 읽었다.","m":0,"c":["The article about climate change appeared on the front page.","She wrote an article for the school newspaper last week.","Every article in the shop was on sale that weekend.","I read an interesting article about space travel this morning."],"hc":"article|article|article|article","mn":"기사 / 물품, 물건","hk":"article(기사)는 신문과 잡지의 글, article(물품)은 가게의 물건. shop(가게) 문장인 ③번만 물품이라 뜻이 다름.","ex":[["He read [[a newspaper article]] about the flood.","그는 홍수에 관한 [[신문 기사]]를 읽었다.","article (명) 기사"],["[[A magazine article]] explains how bees make honey.","[[잡지 기사]]가 벌이 꿀을 만드는 방법을 설명한다.","article (명) 기사"],["The store sells [[household articles]] like pots and towels.","그 가게는 냄비와 수건 같은 [[가정용품]]을 판다.","article (명) 물품, 물건"]]}]},{"day":18,"q":[{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"biological","a":"1","e":"① biological: 생물학적인","w":"② 유전적인(genetic)\n③ 심리적인(psychological)\n④ 해부학적인(anatomical)","m":0,"s":"biological","c":["생물학적인","유전적인","심리적인","해부학적인"],"mn":"생물학적인","hk":"biological(생물학적인)은 biology(생물학)에서 나온 형용사. genetic(유전적인), psychological(심리적인), anatomical(해부학적인)은 세부 분야라 뜻이 다름.","ex":[["She is the child's [[biological mother]].","그녀는 그 아이의 [[친어머니]]이다."],["Hunger is [[a biological need]].","배고픔은 [[생물학적 욕구]]이다."],["Scientists study [[biological changes]] in animals.","과학자들은 동물의 [[생물학적 변화]]를 연구한다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"element","a":"1,3","e":"① factor: 요인, 요소 (신중한 계획이 성공적인 사업의 핵심 요소이다.) / element(요소, 성분)의 유의어.\n③ component: 구성 요소, 부품","w":"② structure: 구조, 구조물\n④ result: 결과","k":"신중한 계획이 성공적인 사업의 핵심 요소이다.","m":2,"s":"Careful planning is the key element of a successful business.","h":"element","c":["factor","structure","component","result"],"mn":"요소, 성분","hk":"element(요소)는 factor(요인), component(구성 요소)와 같은 편, 전체를 이루는 한 조각. structure(구조)는 전체 짜임, result(결과)는 끝에 나온 것이라 오답.","ex":[["Water is [[a key element]] of life.","물은 생명의 [[핵심 요소]]이다."],["Trust is [[an important element]] in any friendship.","신뢰는 어떤 우정에서도 [[중요한 요소]]이다."],["The plan needs [[an element of surprise]].","그 계획에는 [[놀라움의 요소]]가 필요하다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"review","a":"2","e":"② review: 복습하다, 검토하다 (너는 노트를 다시 읽으면서 내일 쪽지 시험에 대비해 복습해야 한다.)\n※ review는 review for + 시험처럼 목적어 없이 쓸 수 있지만, summarize·preview·rewrite는 반드시 목적어가 필요하다.","w":"① summarize: 요약하다\n③ preview: 미리 보다, 예습하다\n④ rewrite: 다시 쓰다","k":"너는 노트를 다시 읽으면서 내일 쪽지 시험에 대비해 복습해야 한다.","m":0,"s":"You should ________ for tomorrow's quiz by reading your notes again.","c":["summarize","review","preview","rewrite"],"mn":"복습하다, 검토하다","hk":"review(복습하다)는 review for(~에 대비해 복습하다)처럼 목적어 없이 가능. summarize(요약하다), preview(미리 보다), rewrite(다시 쓰다)는 목적어 필수.","ex":[["I will [[review the lesson]] tonight.","나는 오늘 밤 [[수업을 복습할]] 것이다."],["Let's [[review for the test]] together.","함께 [[시험에 대비해 복습하자]]."],["The teacher will [[review our essays]].","선생님이 우리 [[에세이를 검토해]] 주실 것이다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"advertisement","a":"advertisement","e":"advertisement 광고 (※ ad, advert도 정답 인정)","k":"그 회사는 신문에 전면 광고를 실었다.","m":0,"s":"The company placed a full-page a______ in the newspaper.","al":"ad | advert","mn":"광고 (※ ad, advert도 정답 인정)","hk":"advertisement(광고)는 advertise(광고하다)에 -ment가 붙은 모양, 끝은 -isement. 줄임말 ad(광고)도 정답 인정.","ex":[["The company made [[a TV advertisement]].","그 회사는 [[텔레비전 광고]]를 만들었다."],["I saw [[an advertisement]] for a new phone.","나는 새 휴대전화 [[광고]]를 봤다."],["[[Advertisements]] can make people want to buy things.","[[광고]]는 사람들이 물건을 사고 싶게 만들 수 있다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"literal","a":"2","e":"② figurative: 비유적인 (그 시인은 이 행에서 'storm'이라는 단어의 문자 그대로의 의미를 사용하지 않았다.) / literal(문자 그대로의, 직역의)의 반의어.","w":"① casual: 격식 없는, 평상시의\n③ poetic: 시적인\n④ formal: 격식을 갖춘","k":"그 시인은 이 행에서 'storm'이라는 단어의 문자 그대로의 의미를 사용하지 않았다.","m":0,"s":"The poet did not use the literal meaning of the word \"storm\" in this line.","h":"literal","c":["casual","figurative","poetic","formal"],"mn":"문자 그대로의, 직역의","hk":"literal(문자 그대로의)의 반대편은 figurative(비유적인). casual(격식 없는), poetic(시적인), formal(격식을 갖춘)은 문자 그대로 여부와 무관해 오답.","ex":[["Do not take his words in [[the literal sense]].","그의 말을 [[문자 그대로의 의미로]] 받아들이지 마라.","literal (형) 문자 그대로의, 직역의"],["The book is [[a literal translation]] of the poem.","그 책은 그 시의 [[직역]]이다.","literal (형) 문자 그대로의, 직역의"],["'Time is money' is [[a figurative expression]].","'시간은 돈이다'는 [[비유적인 표현]]이다.","figurative (형) 비유적인"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"organ","a":"4","e":"④ organ: (몸속에 있는 한 부분 / 심장이나 폐 같은 / 특별한 역할을 맡고 있는) (신체의) 장기, 기관 (심장이나 폐처럼 특별한 역할을 하는 몸속의 한 부분)","w":"① nerve: 신경\n② tissue: (생물의) 조직\n③ muscle: 근육","k":"몸속에 있는 한 부분 / 심장이나 폐 같은 / 특별한 역할을 맡고 있는","m":0,"s":"\"a part inside the body, such as the heart or the lungs, that has a special job\"","c":["nerve","tissue","muscle","organ"],"mn":"(신체의) 장기, 기관 (심장이나 폐처럼 특별한 역할을 하는 몸속의 한 부분)","hk":"organ(장기)은 심장·폐처럼 특별한 역할을 맡은 몸속 부분. nerve(신경), tissue(조직), muscle(근육)은 장기의 정의와 다름. 짝 organ donation(장기 기증).","ex":[["The heart is [[an important organ]].","심장은 [[중요한 장기]]이다."],["He needs [[an organ transplant]].","그는 [[장기 이식]]이 필요하다."],["She signed up for [[organ donation]].","그녀는 [[장기 기증]]을 신청했다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"emphasis","a":"3","e":"emphasis (명) 강조 - emphasize (동) 강조하다\n③ character (명) 성격, 특징 - characterize (동) 특징짓다","w":"① visual (형) 시각의 - visualize (동) 시각화하다, 마음속에 그리다\n② stable (형) 안정된 - stabilize (동) 안정시키다\n④ personal (형) 개인의, 사적인 - personalize (동) 개인 맞춤형으로 만들다","m":0,"s":"emphasis - emphasize","c":["visual - visualize","stable - stabilize","character - characterize","personal - personalize"],"mn":"강조","hk":"명사에 -ize가 붙어 동사가 되는 관계. emphasis(강조)-emphasize(강조하다)처럼 character(특징)-characterize(특징짓다). 형용사 출발은 오답.","ex":[["The teacher put [[great emphasis]] on reading.","선생님은 읽기에 [[큰 강조]]를 두셨다.","emphasis (명) 강조"],["The coach likes to [[emphasize teamwork]].","그 코치는 [[팀워크를 강조하기]]를 좋아한다.","emphasize (동) 강조하다"],["Her [[strong character]] helped her succeed.","그녀의 [[강한 성격]]이 성공을 도왔다.","character (명) 성격, 특징"],["Kindness [[characterizes]] her whole family.","친절함은 그녀의 온 가족을 [[특징짓는다]].","characterize (동) 특징짓다"]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"catch","a":"catch","e":"catch (동) 붙잡다, 잡다 / (동) (병에) 걸리다","k":"그 골키퍼는 공이 선을 넘기 직전에 높이 뛰어올라 그것을 잡아냈다.\n손을 자주 씻는 아이들은 감기에 걸릴 가능성이 더 적다.","m":0,"s":"The goalkeeper jumped high to c______ the ball just before it crossed the line.\nChildren who wash their hands often are less likely to c______ a cold.","mn":"붙잡다, 잡다 / 걸리다","hk":"catch(붙잡다, 병에 걸리다)는 동사. 목적어가 ball(공)이면 잡다, a cold(감기)면 걸리다. 대표 짝 catch a cold(감기에 걸리다).","ex":[["The dog can [[catch a ball]] in the air.","그 개는 공중에서 [[공을 잡을]] 수 있다.","catch (동) 붙잡다, 잡다"],["Wear a coat, or you will [[catch a cold]].","코트를 입지 않으면 [[감기에 걸릴]] 것이다.","catch (동) (병에) 걸리다"],["The police [[caught the thief]] last night.","경찰은 어젯밤 [[도둑을 잡았다]].","catch (동) 붙잡다, 잡다"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"motivate","a":"2","e":"② inspire: 격려하다, 영감을 주다 (좋은 지도자는 희망을 잃은 사람들에게 동기를 부여하는 법을 안다.) / motivate(동기를 부여하다, 자극하다)의 유의어.","w":"① scold: 꾸짖다\n③ educate: 교육하다\n④ recruit: 모집하다","k":"좋은 지도자는 희망을 잃은 사람들에게 동기를 부여하는 법을 안다.","m":0,"s":"A good leader knows how to motivate people who have lost hope.","h":"motivate","c":["scold","inspire","educate","recruit"],"mn":"동기를 부여하다, 자극하다","hk":"motivate(동기를 부여하다)는 inspire(격려하다, 영감을 주다)와 같은 편. scold(꾸짖다)는 반대 느낌, educate(교육하다), recruit(모집하다)는 다른 일.","ex":[["Good teachers [[motivate students]] to try harder.","좋은 선생님은 [[학생들에게 동기를 부여해]] 더 노력하게 한다."],["Winning the prize [[motivated her]] to keep practicing.","상을 받은 일이 [[그녀에게 동기를 부여해]] 계속 연습하게 했다."],["Music can [[motivate people]] to exercise.","음악은 [[사람들에게 동기를 부여해]] 운동하게 할 수 있다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"therefore","a":"4","e":"④ therefore: 그러므로, 그 결과 (그 실험은 세 번 실패했다; 그러므로 그 팀은 방법을 바꾸기로 결정했다.)\n※ instead(대신에)는 앞에 대체되는 대상이 있어야 쓸 수 있다. 여기는 앞이 원인, 뒤가 결과이므로 therefore.","w":"① instead: 대신에\n② however: 그러나\n③ unless: ~하지 않는다면","k":"그 실험은 세 번 실패했다; 그러므로 그 팀은 방법을 바꾸기로 결정했다.","m":0,"s":"The experiment failed three times; ________, the team decided to change the method.","c":["instead","however","unless","therefore"],"mn":"그러므로, 그 결과","hk":"therefore(그러므로)는 앞이 원인, 뒤가 결과일 때 쓰는 연결어. instead(대신에)는 대체, however(그러나)는 반대, unless(~하지 않는다면)는 조건이라 오답.","ex":[["It rained all day; [[therefore]], we stayed home.","하루 종일 비가 왔다; [[그러므로]] 우리는 집에 있었다."],["He studied hard. [[Therefore]], he passed the test.","그는 열심히 공부했다. [[그러므로]] 시험에 합격했다."],["The tickets were free, and [[therefore]] the hall was full.","표가 무료였고, [[그 결과]] 홀이 가득 찼다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"wireless","a":"1","e":"① wireless: 무선의","w":"② digital: 디지털의\n③ electronic: 전자의\n④ magnetic: 자석의, 자기의","m":0,"s":"\"무선의\"","c":["wireless","digital","electronic","magnetic"],"mn":"무선의","hk":"wireless(무선의)는 wire(전선)에 -less(~없는)가 붙은 말. digital(디지털의), electronic(전자의), magnetic(자석의)은 전선 유무와 무관.","ex":[["I use [[wireless earphones]] when I run.","나는 달릴 때 [[무선 이어폰]]을 쓴다."],["The cafe offers [[wireless internet]].","그 카페는 [[무선 인터넷]]을 제공한다."],["She bought [[a wireless mouse]] for her laptop.","그녀는 노트북에 쓸 [[무선 마우스]]를 샀다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"tip","a":"4","e":"④ tip: (작지만 유용한 조언 / 어떻게 하면 어떤 일을 더 잘할 수 있는지에 대한) 조언, 비결 (어떤 일을 더 잘하는 방법에 관한 작지만 유용한 조언)","w":"① notice: 공지, 알림\n② rumor: 소문\n③ clue: 단서","k":"작지만 유용한 조언 / 어떻게 하면 어떤 일을 더 잘할 수 있는지에 대한","m":0,"s":"\"a small but useful piece of advice about how to do something better\"","c":["notice","rumor","clue","tip"],"mn":"조언, 비결 (어떤 일을 더 잘하는 방법에 관한 작지만 유용한 조언)","hk":"tip(조언)은 더 잘하는 방법에 관한 작고 유용한 조언. notice(공지), rumor(소문), clue(단서)는 정보이지만 조언이 아님. 짝 a useful tip(유용한 조언).","ex":[["My teacher gave me [[a useful tip]] for the exam.","선생님은 시험에 대한 [[유용한 조언]]을 주셨다."],["Here are [[some tips]] for saving money.","다음은 돈을 아끼는 [[몇 가지 비결]]이다."],["She shared [[a cooking tip]] with us.","그녀는 우리에게 [[요리 비결]]을 알려 주었다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"slim","a":"1","e":"① stout: 뚱뚱한, 튼튼한 (그는 매일 세 달 동안 수영을 한 뒤 놀랄 만큼 날씬해 보였다.) / slim(날씬한, 호리호리한)의 반의어.","w":"② elegant: 우아한\n③ fit: 건강한\n④ skinny: 삐쩍 마른","k":"그는 매일 세 달 동안 수영을 한 뒤 놀랄 만큼 날씬해 보였다.","m":0,"s":"He looked surprisingly slim after three months of swimming every day.","h":"slim","c":["stout","elegant","fit","skinny"],"mn":"날씬한, 호리호리한","hk":"slim(날씬한)의 반대편은 stout(뚱뚱한). skinny(삐쩍 마른)는 오히려 같은 편이라 속임수. elegant(우아한), fit(건강한)도 몸집의 반대말이 아님.","ex":[["He tries to [[stay slim]] by running every day.","그는 매일 달려서 [[날씬함을 유지하려고]] 한다.","slim (형) 날씬한, 호리호리한"],["The model has [[a slim figure]].","그 모델은 [[날씬한 몸매]]를 가졌다.","slim (형) 날씬한, 호리호리한"],["The old farmer was [[a stout man]] with strong arms.","그 늙은 농부는 강한 팔을 가진 [[뚱뚱한 남자]]였다.","stout (형) 뚱뚱한, 튼튼한"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"battery","a":"battery","e":"battery 배터리, 건전지","k":"내 스마트워치는 전지가 완전히 다 되어서 작동을 멈췄다.","m":0,"s":"My smart watch stopped working because the b______ was completely dead.","mn":"배터리, 건전지","hk":"battery(배터리)는 t가 두 번 겹쳐 batt-ery로 쓰기. 대표 짝 a dead battery(방전된 배터리)로 기억.","ex":[["I need to [[charge the battery]].","나는 [[배터리를 충전해야]] 한다."],["The remote needs [[new batteries]].","그 리모컨에는 [[새 건전지]]가 필요하다."],["[[A dead battery]] kept the car from starting.","[[다 된 배터리]] 때문에 차 시동이 걸리지 않았다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"odd","a":"2","e":"①이상한 / ②홀수의 / ③이상한 / ④이상한 [②번만 의미가 다름]","k":"①그가 내 질문에 대답하는 방식에는 뭔가 이상한 점이 있었다.\n②이 거리에서 홀수 번지의 집들은 왼쪽에 있다.\n③파티에서의 그의 행동은 그곳의 모든 사람에게 이상해 보였다.\n④그녀는 한밤중에 부엌에서 나는 이상한 소리를 들었다.","m":0,"c":["There was something odd about the way he answered my question.","Houses on this street with odd numbers are on the left side.","His behavior at the party seemed odd to everyone there.","She heard an odd noise coming from the kitchen at midnight."],"hc":"odd|odd|odd|odd","mn":"이상한 / 홀수의","hk":"odd(이상한)는 세 문장, odd numbers(홀수)는 숫자를 꾸밀 때라 ②번만 다름. odd(홀수의)의 반대편은 even(짝수의).","ex":[["That is [[an odd smell]].","저것은 [[이상한 냄새]]이다.","odd (형) 이상한"],["It is [[odd]] that he is late again.","그가 또 늦다니 [[이상하다]].","odd (형) 이상한"],["Three, five, and seven are [[odd numbers]].","3, 5, 7은 [[홀수]]이다.","odd (형) 홀수의"]]}]},{"day":19,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"negotiate","a":"4","e":"④ negotiate: 협상하다, 교섭하다","w":"① debate: 논쟁하다, 토론하다\n② confess: 인정하다, 자백하다\n③ counsel: 충고[조언]하다","m":0,"s":"\"협상하다, 교섭하다\"","c":["debate","confess","counsel","negotiate"],"mn":"협상하다, 교섭하다","hk":"negotiate(협상하다)는 negotiate with(~와 협상하다) 짝. debate(토론하다)는 겨루기, confess(자백하다)는 인정하기, counsel(조언하다)은 충고하기.","ex":[["The workers will [[negotiate with]] the company.","노동자들은 회사와 [[협상할]] 것이다."],["They tried to [[negotiate a deal]].","그들은 [[거래를 협상하려고]] 했다."],["Leaders met to [[negotiate peace]].","지도자들은 [[평화를 협상하려고]] 만났다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"combine","a":"2,3","e":"② mix: 섞다\n③ blend: 섞다, 혼합하다 (이 두 색을 섞으면 따뜻한 주황색 색조를 얻게 될 것이다.) / combine(결합하다, 합치다)의 유의어.","w":"① bend: 굽히다, 구부리다\n④ convert: 전환하다, 개조하다","k":"이 두 색을 섞으면 따뜻한 주황색 색조를 얻게 될 것이다.","m":2,"s":"If you combine these two colors, you will get a warm orange tone.","h":"combine","c":["bend","mix","blend","convert"],"mn":"결합하다, 합치다","hk":"combine(결합하다)은 mix(섞다), blend(섞다, 혼합하다)와 같은 편. bend(굽히다)는 blend(혼합하다)와 철자만 닮은 속임수, convert(전환하다)는 바꾸는 일.","ex":[["[[Combine the flour and sugar]] in a bowl.","그릇에 [[밀가루와 설탕을 섞어라]]."],["We should [[combine our ideas]] into one plan.","우리는 [[아이디어를 합쳐]] 하나의 계획으로 만들어야 한다."],["This game [[combines fun and learning]].","이 게임은 [[재미와 배움을 결합한다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"forecast","a":"1","e":"① forecast: (당신이 생각하는 것을 말하다 / 앞으로 일어날 것이라고 / 특히 날씨에 대해) 예측하다, 예보하다","w":"② presume: 가정하다, 추정하다\n③ perceive: 인지하다, 알아차리다\n④ indicate: 나타내다, 보여 주다","k":"당신이 생각하는 것을 말하다 / 앞으로 일어날 것이라고 / 특히 날씨에 대해","m":0,"s":"\"to say what you think will happen in the future, especially about the weather\"","c":["forecast","presume","perceive","indicate"],"mn":"예측하다, 예보하다","hk":"forecast(예보하다)는 앞일을 미리 말하는 것, 특히 날씨. presume(가정하다), perceive(알아차리다), indicate(나타내다)는 오답.","ex":[["It is hard to [[forecast the weather]].","[[날씨를 예보하기]]는 어렵다."],["Economists [[forecast slow growth]] next year.","경제학자들은 내년에 [[느린 성장을 예측한다]]."],["The news [[forecasts heavy snow]] this weekend.","뉴스는 이번 주말 [[폭설을 예보한다]]."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"sign","a":"sign","e":"sign (동) 서명하다 / (명) 표지판, 징후","k":"떠나시기 전에 페이지 맨 아래에 성함을 서명해 주세요.\n의사는 그 부기가 더 심각한 무언가의 징후일 수 있다고 말했다.","m":0,"s":"Please s______ your name at the bottom of the page before you leave.\nThe doctor said the swelling might be a s______ of something more serious.","mn":"서명하다 / 표지판, 징후","hk":"sign(서명하다)은 동사, sign(징후, 표지판)은 명사. 이름을 쓰는 문장은 동사 자리, a sign of(~의 징후)는 명사 자리.","ex":[["Please [[sign the form]] below.","아래 [[양식에 서명해]] 주세요.","sign (동) 서명하다"],["Red leaves are [[a sign of autumn]].","붉은 잎은 [[가을의 징후]]이다.","sign (명) 징후"],["Read the [[road sign]] carefully.","[[도로 표지판]]을 주의 깊게 읽어라.","sign (명) 표지판"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"generate","a":"2","e":"② generate: 만들어 내다, 발생시키다 (태양 전지판은 햇빛으로 전기를 만들어 낸다.)","w":"① operate: 작동하다\n③ transmit: 전송하다, 전염시키다\n④ install: 설치하다, 설비하다","k":"태양 전지판은 햇빛으로 전기를 만들어 낸다.","m":0,"s":"Solar panels ________ electricity from sunlight.","c":["operate","generate","transmit","install"],"mn":"만들어 내다, 발생시키다","hk":"generate(만들어 내다)는 전기·열을 새로 만들 때 쓰고 generator(발전기)와 한 가족. operate(작동하다), transmit(전송하다), install(설치하다)은 오답.","ex":[["Wind turbines [[generate electricity]].","풍력 터빈은 [[전기를 만들어 낸다]]."],["Good ideas can [[generate new jobs]].","좋은 아이디어는 [[새 일자리를 만들어 낼]] 수 있다."],["The machine [[generates heat]] when it runs.","그 기계는 작동할 때 [[열을 발생시킨다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"bold","a":"4","e":"bold (형) 대담한, 용감한 - boldness (명) 대담함\n④ active (형) 활동적인, 적극적인 - activity (명) 활동","w":"① abolish (동) 폐지하다, 없애다 - abolition (명) 폐지\n② applaud (동) 박수를 치다 - applause (명) 박수갈채\n③ consume (동) 소비하다, 다 써버리다 - consumption (명) 소비","m":0,"s":"bold - boldness","c":["abolish - abolition","applaud - applause","consume - consumption","active - activity"],"mn":"대담한, 용감한","hk":"형용사에서 명사로 가는 관계. bold(대담한)-boldness(대담함)처럼 active(활동적인)-activity(활동). abolish(폐지하다) 등은 동사 출발이라 오답.","ex":[["She made [[a bold decision]].","그녀는 [[대담한 결정]]을 내렸다.","bold (형) 대담한, 용감한"],["Everyone admired [[her boldness]] on stage.","모두가 무대에서의 [[그녀의 대담함]]에 감탄했다.","boldness (명) 대담함"],["He lives [[an active life]].","그는 [[활동적인 삶]]을 산다.","active (형) 활동적인, 적극적인"],["There are many [[outdoor activities]] here.","이곳에는 많은 [[야외 활동]]이 있다.","activity (명) 활동"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"technology","a":"technology","e":"technology 기술, 과학기술","k":"기술의 발전은 사람들이 서로 대화하는 방식을 완전히 바꾸어 놓았다.","m":0,"s":"Advances in t______ have completely changed the way people talk to each other.","mn":"기술, 과학기술","hk":"technology(기술)는 c 뒤에 h가 붙고 끝이 -logy인 철자 주의. 대표 짝 modern technology(현대 기술)로 기억.","ex":[["[[Modern technology]] makes life easier.","[[현대 기술]]은 삶을 더 편하게 해 준다."],["She works in [[information technology]].","그녀는 [[정보 기술]] 분야에서 일한다."],["[[New technology]] helps farmers grow more food.","[[신기술]]은 농부들이 더 많은 식량을 기르도록 돕는다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"wealthy","a":"3","e":"③ poor: 가난한 (그의 가족은 작은 사업이 해외에서 빠르게 성장한 후 부유해졌다.) / wealthy(부유한, 재산이 많은)의 반의어.","w":"① respectable: 존경할 만한\n② successful: 성공한, 성공적인\n④ industrious: 근면한, 부지런한","k":"그의 가족은 작은 사업이 해외에서 빠르게 성장한 후 부유해졌다.","m":0,"s":"His family became wealthy after their small business grew rapidly overseas.","h":"wealthy","c":["respectable","successful","poor","industrious"],"mn":"부유한, 재산이 많은","hk":"wealthy(부유한)의 반대편은 poor(가난한). respectable(존경할 만한), successful(성공한), industrious(근면한)는 재산과 무관한 성격이라 오답.","ex":[["He became [[a wealthy businessman]].","그는 [[부유한 사업가]]가 되었다.","wealthy (형) 부유한, 재산이 많은"],["The city has many [[wealthy families]].","그 도시에는 [[부유한 가족]]이 많다.","wealthy (형) 부유한, 재산이 많은"],["[[The poor family]] could not buy new shoes.","[[그 가난한 가족]]은 새 신발을 살 수 없었다.","poor (형) 가난한"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"thorough","a":"1","e":"① thorough: 빈틈없는, 철저한","w":"② consistent: 일관된, 한결같은\n③ adequate: 적당한, 충분한\n④ acute: 심한, 격렬한","m":0,"s":"thorough","c":["빈틈없는, 철저한","일관된, 한결같은","적당한, 충분한","심한, 격렬한"],"mn":"빈틈없는, 철저한","hk":"thorough(철저한)는 빠짐없이 끝까지 하는 느낌. consistent(일관된), adequate(적당한), acute(심한)와 뜻이 다름. though(비록 ~일지라도)와 -ough 주의.","ex":[["The doctor did [[a thorough check]].","의사는 [[철저한 검사]]를 했다."],["We need [[a thorough cleaning]].","우리는 [[철저한 청소]]가 필요하다."],["She gave [[a thorough explanation]].","그녀는 [[빈틈없는 설명]]을 했다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"immediate","a":"3","e":"③ immediate: 즉시의, 즉각적인 (그 운전자는 충돌 사고 후 즉각적인 치료가 필요했다.)","w":"① annual: 매년의, 연례의\n② previous: 이전의, 앞의\n④ successive: 연속적인, 연이은","k":"그 운전자는 충돌 사고 후 즉각적인 치료가 필요했다.","m":0,"s":"The driver needed ________ medical help after the crash.","c":["annual","previous","immediate","successive"],"mn":"즉시의, 즉각적인","hk":"immediate(즉각적인)는 지체 없이 바로인 느낌, 짝 immediate help(즉각적인 도움). annual(매년의), previous(이전의), successive(연속적인)는 오답.","ex":[["The patient needs [[immediate care]].","그 환자는 [[즉각적인 치료]]가 필요하다."],["We got [[an immediate reply]].","우리는 [[즉각적인 답장]]을 받았다."],["Take [[immediate action]] to stop the fire.","불을 끄기 위해 [[즉각적인 조치]]를 취하라."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"victory","a":"3","e":"③ win: 이김, 승리 (결승전에서의 그 팀의 승리는 모두를 놀라게 했다.) / victory(승리, 우승)의 유의어.","w":"① competition: 대회, 시합\n② collapse: 붕괴, 무너짐\n④ defeat: 패배","k":"결승전에서의 그 팀의 승리는 모두를 놀라게 했다.","m":0,"s":"The team's victory in the final match surprised everyone.","h":"victory","c":["competition","collapse","win","defeat"],"mn":"승리, 우승","hk":"victory(승리)는 win(승리)과 같은 편, 반대편은 defeat(패배). competition(대회), collapse(붕괴)는 승패의 결과가 아니라 오답.","ex":[["The team celebrated [[a great victory]].","그 팀은 [[대단한 승리]]를 축하했다."],["Her [[victory in the race]] made her famous.","[[경주에서의 승리]]가 그녀를 유 ":"나아지다, 개선하다","hk":"improve(나아지다)의 반대편은 worsen(악화되다). elevate(높이다), evolve(발전하다), modify(수정하다)는 좋아지는 쪽이거나 중립이라 오답.","ex":[["Daily practice will [[improve your English]].","매일 연습하면 [[영어 실력이 좋아질]] 것이다.","improve (동) 나아지다, 개선하다"],["His health began to [[improve]] after the surgery.","수술 후 그의 건강은 [[나아지기]] 시작했다.","improve (동) 나아지다, 개선하다"],["If you don't rest, your cold may [[worsen]].","쉬지 않으면 감기가 [[악화될]] 수도 있다.","worsen (동) 악화되다, 나빠지다"]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"charge","a":"3","e":"①요금 / ②요금 / ③책임, 담당 / ④요금 [③번만 의미가 다름]","k":"①그 호텔은 우리 총액에 적은 서비스 요금을 추가했다.\n②그 박물관은 15세 미만 학생에게는 요금을 받지 않는다.\n③그녀는 새 마케팅 팀을 담당하고 있다.\n④이 탁자의 배송 요금은 겨우 3달러이다.","m":0,"c":["The hotel added a small service charge to our total.","The museum makes no charge for students under fifteen.","She is in charge of the new marketing team.","The delivery charge for this table is only three dollars."],"hc":"charge|charge|charge|charge","mn":"요금 / 책임, 담당","hk":"charge(요금)가 세 문장이고 in charge of(~을 담당하는)는 책임을 맡는 뜻이라 ③번만 다름. free of charge(무료로)의 요금 뜻과 구분.","ex":[["Is there [[an extra charge]] for the room?","그 방에는 [[추가 요금]]이 있나요?","charge (명) 요금"],["Delivery is [[free of charge]] this week.","이번 주에는 배달이 [[무료이다]].","charge (명) 요금"],["Who is [[in charge of]] this project?","이 프로젝트를 [[담당하는]] 사람은 누구입니까?","charge (명) 책임, 담당"]]}]},{"day":20,"q":[{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"pupil","a":"2","e":"② pupil: (어린 사람 / 학교에서 가르침을 받고 있는) 제자, 학생","w":"① criminal: 범인, 범죄자\n③ priest: 사제, 신부, 성직자\n④ professional: 전문가, 전문직 종사자","k":"어린 사람 / 학교에서 가르침을 받고 있는","m":0,"s":"\"a young person who is being taught in a school\"","c":["criminal","pupil","priest","professional"],"mn":"제자, 학생","hk":"pupil(제자)은 teacher(선생님)에게 가르침을 받는 어린 사람. criminal(범죄자), priest(사제), professional(전문가)은 학교의 배움과 무관해 오답.","ex":[["The teacher praised [[her best pupil]].","선생님은 [[가장 뛰어난 제자]]를 칭찬했다."],["[[Pupils]] must wear uniforms in this school.","이 학교에서는 [[학생들]]이 했다]]."],["We had [[awful weather]] all week.","우리는 일주일 내내 [[끔찍한 날씨]]를 겪었다."],["That was [[an awful mistake]].","그것은 [[끔찍한 실수]]였다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"reduce","a":"1,3","e":"① lower: 낮추다 (그 공장은 매일 사용하는 물의 양을 줄이겠다고 약속했다.) / reduce(줄이다, 낮추다)의 유의어.\n③ cut: 줄이다, 삭감하다","w":"② expand: 확대하다, 팽창시키다\n④ adjust: 적응하다, 조정하다","k":"그 공장은 매일 사용하는 물의 양을 줄이겠다고 약속했다.","m":2,"s":"The factory promised to reduce the amount of water it uses each day.","h":"reduce","c":["lower","expand","cut","adjust"],"mn":"줄이다, 낮추다","hk":"reduce(줄이다)는 lower(낮추다), cut(줄이다)과 같은 편, 양이나 수준을 아래로. expand(확대하다)는 반대편, adjust(조정하다)는 늘고 줄음이 정해지지 않음.","ex":[["We must [[reduce waste]].","우리는 [[쓰레기를 줄여야]] 한다."],["Exercise can [[reduce stress]].","운동은 [[스트레스를 줄일]] 수 있다."],["The store will [[reduce prices]] next week.","그 가게는 다음 주에 [[가격을 낮출]] 것이다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"spill","a":"1","e":"① spill: 엎지르다 (뜨거운 수프를 새 카펫에 엎지르지 않도록 조심해라.)","w":"② dip: 담그다\n③ toss: 던지다, 던져올리다\n④ stir: 뒤섞다, 휘젓다","k":"뜨거운 수프를 새 카펫에 엎지르지 않도록 조심해라.","m":0,"s":"Be careful not to ________ the hot soup on the new carpet.","c":["spill","dip","toss","stir"],"mn":"엎지르다","hk":"spill(엎지르다)은 액체를 실수로 쏟는 동작. dip(담그다), toss(던지다), stir(휘젓다)는 카펫 위에 수프를 쏟는 상황과 안 맞음.","ex":[["Be careful not to [[spill the milk]].","[[우유를 엎지르지]] 않게 조심해라."],["The child [[spilled juice]] on the table.","아이가 탁자에 [[주스를 엎질렀다]]."],["Don't [[spill water]] on your laptop.","노트북에 [[물을 엎지르지]] 마라."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"wave","a":"wave","e":"wave (명) 파도, 물결 / (동) 흔들다","k":"거대한 파도가 갑판을 휩쓸어 선원 두 명을 넘어뜨렸다.\n그녀는 문 앞에 서서 기차가 천천히 떠날 때 손을 흔들기 시작했다.","m":0,"s":"A huge w______ swept over the deck and knocked two sailors off their feet.\nShe stood at the gate and began to w______ her hand as the train slowly left.","mn":"파도, 물결 / 흔들다","hk":"wave(파도)는 명사, wave(흔들다)는 동사. 바다의 큰 물결이면 명사 자리, hand(손)를 흔드는 동작이면 동사 자리.","ex":[["A huge [[wave]] hit the boat.","거대한 [[파도]]가 배를 덮쳤다.","wave (명) 파도, 물결"],["Children [[wave their hands]] at the bus.","아이들이 버스를 향해 [[손을 흔든다]].","wave (동) 흔들다"],["Please [[wave goodbye]] to Grandma.","할머니께 [[손을 흔들어 작별 인사]]를 하렴.","wave (동) 흔들다"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"protect","a":"1","e":"protect (동) 보호하다, 지키다 - protection (명) 보호, 방어\n① remove (동) 치우다, 제거하다 - removal (명) 제거","w":"② arrogant (형) 오만한, 거만한 - arrogance (명) 오만함\n③ addicted (형) 중독된, 빠진 - addiction (명) 중독\n④ major (형) 주요한, 중요한 - majority (명) 대다수","m":0,"s":"protect - protection","c":["remove - removal","arrogant - arrogance","addicted - addiction","major - majority"],"mn":"보호하다, 지키다","hk":"동사에서 명사가 되는 관계. protect(보호하다)-protection(보호)처럼 remove(제거하다)-removal(제거). 형용사 출발은 오답.","ex":[["Masks [[protect people]] from dust.","마스크는 먼지로부터 [[사람들을 보호한다]].","protect (동) 보호하다, 지키다"],["The law gives [[legal protection]] to children.","그 법은 아이들에게 [[법적 보호]]를 준다.","protection (명) 보호, 방어"],["This soap can [[remove the stain]].","이 비누는 [[얼룩을 제거할]] 수 있다.","remove (동) 치우다, 제거하다"],["[[Stain removal]] takes some time.","[[얼룩 제거]]에는 시간이 좀 걸린다.","removal (명) 제거"]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"attain","a":"1","e":"① attain: 달성하다, 이루다","w":"② strive: 노력하다, 분발하다\n③ pursue: 뒤쫓다, 추적하다\n④ aspire: 갈망[열망]하다","m":0,"s":"\"달성하다, 이루다\"","c":["attain","strive","pursue","aspire"],"mn":"달성하다, 이루다","hk":"attain(달성하다)은 attain a goal(목표를 달성하다)처럼 이뤄 내는 쪽. strive(노력하다), pursue(추구하다), aspire(열망하다)는 이루기 위한 과정이나 마음.","ex":[["She worked hard to [[attain her goal]].","그녀는 [[목표를 달성하려고]] 열심히 노력했다."],["It took years to [[attain fame]].","[[명성을 얻기]]까지 몇 년이 걸렸다."],["Few students can [[attain a perfect score]].","[[만점을 달성하는]] 학생은 드물다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"locate","a":"2","e":"② lose: 잃어버리다 (구조대는 강 근처에서 실종된 등산객들을 찾아내려고 애썼다.) / locate(찾아내다, 위치를 알아내다)의 반의어.","w":"① capture: 붙잡다, 포획하다\n③ receive: 받다\n④ reach: 도달하다, 도착하다","k":"구조대는 강 근처에서 실종된 등산객들을 찾아내려고 애썼다.","m":0,"s":"The rescue team tried to locate the missing hikers near the river.","h":"locate","c":["capture","lose","receive","reach"],"mn":"찾아내다, 위치를 알아내다","hk":"locate(찾아내다)의 반대편은 lose(잃어버리다). capture(붙잡다)는 찾는 쪽과 가깝고 receive(받다), reach(도달하다)는 찾고 잃는 일과 무관.","ex":[["Police [[located the missing car]].","경찰은 [[실종된 차를 찾아냈다]].","locate (동) 찾아내다, 위치를 알아내다"],["Can you [[locate our school]] on this map?","이 지도에서 [[우리 학교의 위치를 찾을]] 수 있니?","locate (동) 찾아내다, 위치를 알아내다"],["Be careful not to [[lose your keys]].","[[열쇠를 잃어버리지]] 않도록 조심해라.","lose (동) 잃어버리다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"income","a":"3","e":"③ income: 소득, 수입 (그들의 월 소득은 식비와 주거비를 내기에 충분하지 않다.)","w":"① volume: 용량, 용적\n② deal: 거래, 합의\n④ stock: 주식","k":"그들의 월 소득은 식비와 주거비를 내기에 충분하지 않다.","m":0,"s":"Their monthly ________ is not enough to pay for food and housing.","c":["volume","deal","income","stock"],"mn":"소득, 수입","hk":"income(소득)은 in(안으로) 들어오는 돈. volume(용량), deal(거래), stock(주식)은 월 소득 자리에 안 맞음. 짝 monthly income(월 소득).","ex":[["Her [[monthly income]] is small.","그녀의 [[월 소득]]은 적다."],["Many families have [[a low income]].","많은 가족이 [[낮은 소득]]을 가지고 있다."],["People with [[a high income]] pay more tax.","[[높은 소득]]을 가진 사람들은 세금을 더 낸다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"channel","a":"channel","e":"channel 채널, 경로","k":"그 프로그램이 다른 방송 번호로 옮겨가서 많은 시청자들이 그것을 찾지 못했다.","m":0,"s":"The show moved to a different c______, so many viewers could not find it.","mn":"채널, 경로","hk":"channel(채널)은 ch로 시작하고 n이 두 번 겹치는 철자. 대표 짝 TV channel(텔레비전 채널)로 기억.","ex":[["Change [[the TV channel]], please.","[[텔레비전 채널]]을 바꿔 주세요."],["She runs [[a YouTube channel]] about cooking.","그녀는 요리에 관한 [[유튜브 채널]]을 운영한다."],["[[A news channel]] reported the storm.","[[뉴스 채널]]이 폭풍을 보도했다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"launch","a":"4","e":"④ launch: (새로 scale is broken, so it shows the wrong weight."],"hc":"scale|scale|scale|scale","mn":"저울 / 규모","hk":"scale(저울)이 세 문장이고 on a larger scale(더 큰 규모로)의 scale(규모)만 ②번이라 뜻이 다름. 무게 재는 도구면 저울, 크기와 정도면 규모.","ex":[["Step on [[the scale]] to check your weight.","몸무게를 재려면 [[저울]]에 올라서라.","scale (명) 저울"],["I bought [[a kitchen scale]] for baking.","나는 베이킹을 하려고 [[주방 저울]]을 샀다.","scale (명) 저울"],["The fire spread [[on a large scale]].","화재는 [[대규모로]] 번졌다.","scale (명) 규모"]]}]},{"day":21,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"rely","a":"1","e":"① trust: 믿다 (이 지역의 농부들은 농작물을 위해 여름비에 의존한다.) / rely(의지하다, 믿다)의 유의어.","w":"② suppose: 생각하다, 추측하다\n③ assert: 주장하다, 단언하다\n④ consider: 고려하다","k":"이 지역의 농부들은 농작물을 위해 여름비에 의존한다.","m":0,"s":"Farmers in this area rely on the summer rain for their crops.","h":"rely","c":["trust","suppose","assert","consider"],"mn":"의지하다, 믿다","hk":"rely on(의지하다)은 trust(믿다)와 같은 편, 짝으로 묶어 기억. suppose(추측하다), assert(주장하다), consider(고려하다)는 믿는 뜻이 아님","ex":[["Farmers [[rely on]] the rain for water.","농부들은 물을 위해 비에 [[의존한다]]."],["You can [[rely on]] me to help you.","너는 내가 도와줄 거라고 [[믿어도 된다]]."],["Many people [[rely heavily on]] their phones.","많은 사람이 휴대폰에 [[크게 의존한다]]."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"inquire","a":"1","e":"① inquire: 문의하다, 묻다","w":"② suggest: 암시[시사]하다, 제안하다\n③ dictate: 명령[지시]하다\n④ clarify: 분명히 (말)하다, 명백하게 하다","m":0,"s":"\"문의하다, 묻다\"","c":["inquire","suggest","dictate","clarify"],"mn":"문의하다, 묻다","hk":"inquire about(~에 대해 문의하다)처럼 묻는 동작. suggest(제안하다), dictate(지시하다), clarify(분명히 하다)는 묻는 뜻이 아닌 속임수","ex":[["I will [[inquire about]] the price.","나는 가격에 대해 [[문의할 것이다]]."],["She [[inquired about]] the bus schedule.","그녀는 버스 시간표에 대해 [[문의했다]]."],["Please [[inquire]] at the front desk.","안내 데스크에서 [[문의하세요]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"classical","a":"classical","e":"classical 고전적인, 클래식의","k":"그는 오늘날의 팝송보다 모차르트와 베토벤 같은 고전 음악을 더 좋아한다.","m":0,"s":"He prefers c______ music such as Mozart and Beethoven to today's pop songs.","mn":"고전적인, 클래식의","hk":"classical(고전적인)은 가운데 자음이 두 번 겹치는 철자. classical music(고전 음악)으로 묶어 기억","ex":[["He loves [[classical music]].","그는 [[고전 음악]]을 아주 좋아한다."],["She took [[classical dance]] lessons.","그녀는 [[고전 무용]] 수업을 들었다."],["They study [[classical Greek]] at school.","그들은 학교에서 [[고전 그리스어]]를 공부한다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"punish","a":"2","e":"② punish: 처벌하다, 벌주다 (학교는 도서관 벽에 낙서를 한 학생들을 처벌하기로 결정했다.)","w":"① provoke: 유발하다, 선동하다\n③ threaten: 위협하다, 위태롭게 하다\n④ insult: 모욕하다","k":"학교는 도서관 벽에 낙서를 한 학생들을 처벌하기로 결정했다.","m":0,"s":"The school decided to ________ the students who wrote on the library walls.","c":["provoke","punish","threaten","insult"],"mn":"처벌하다, 벌주다","hk":"punish A for B(B 때문에 A를 벌주다)로 기억. provoke(유발하다), threaten(위협하다), insult(모욕하다)는 벌을 주는 동작이 아님","ex":[["The teacher will [[punish]] bad behavior.","선생님은 나쁜 행동을 [[벌줄 것이다]]."],["He was [[punished for]] being late.","그는 지각해서 [[벌을 받았다]]."],["The law will [[punish]] those who break it.","법은 그것을 어기는 사람들을 [[처벌할 것이다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"suspend","a":"1,2","e":"① resume: 재개하다, 다시 시작하다 (그 도시는 강한 바람 때문에 야외 콘서트를 중지해야 했다.) / suspend(중단하다, 유예하다)의 반의어.\n② continue: 계속하다","w":"③ stop: 멈추다\n④ freeze: 얼다, 얼리다","k":"그 도시는 강한 바람 때문에 야외 콘서트를 중지해야 했다.","m":2,"s":"The city had to suspend the outdoor concert because of the strong wind.","h":"suspend","c":["resume","continue","stop","freeze"],"mn":"중단하다, 유예하다","hk":"suspend(중단하다)의 반대편은 resume(재개하다)과 continue(계속하다). stop(멈추다)은 오히려 같은 편, freeze(얼리다)는 뜻이 다른 속임수","ex":[["They had to [[suspend]] the game because of rain.","그들은 비 때문에 경기를 [[중단해야]] 했다.","suspend (동) 중단하다, 유예하다"],["The class will [[resume]] after lunch.","수업은 점심 뒤에 [[재개될 것이다]].","resume (동) 재개하다, 다시 시작하다"],["Please [[continue]] your story.","네 이야기를 [[계속해]] 줘.","continue (동) 계속하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"evidence","a":"3","e":"③ evidence: (사실이나 징후 / 분명하게 보여주는 / 어떤 것이 사실이라는 것을) 증거, 근거","w":"① bias: 선입견, 편견\n② notion: 개념, 생각\n④ admission: 시인[인정]","k":"사실이나 징후 / 분명하게 보여주는 / 어떤 것이 사실이라는 것을","m":0,"s":"\"facts or signs that show clearly that something is true\"","c":["bias","notion","evidence","admission"],"mn":"증거, 근거","hk":"evidence(증거)는 사실을 분명히 보여 주는 근거. bias(편견), notion(개념), admission(인정)은 증거가 아니라 생각이나 태도","ex":[["The police found [[strong evidence]].","경찰은 [[강력한 증거]]를 찾았다."],["Where is the [[evidence]] for your claim?","네 주장의 [[근거]]가 어디 있니?"],["Footprints are [[evidence of]] a visitor.","발자국은 방문객이 있었다는 [[증거이다]]."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"attractive","a":"3","e":"attractive (형) 매력적인 - attract (동) 마음을 끌다\n③ modern (형) 현대의, 최신의 - modernize (동) 현대화하다\n※ ①②④는 모두 명사→동사이고, 제시어처럼 형용사→동사인 것은 ③뿐이다.","w":"① length (명) 길이 - lengthen (동) 길게 하다\n② signal (명) 신호 - signify (동) 의미하다, 나타내다\n④ symbol (명) 상징 - symbolize (동) 상징하다","m":0,"s":"attractive - attract","c":["length - lengthen","signal - signify","modern - modernize","symbol - symbolize"],"mn":"매력적인","hk":"제시어는 형용사에서 동사로 가는 관계. modern(현대의)-modernize(현대화하다)가 같은 방향이고, 나머지는 모두 명사에서 동사","ex":[["The beach is an [[attractive place]] to visit.","그 해변은 방문하기 [[매력적인 곳]]이다.","attractive (형) 매력적인"],["Bright colors [[attract]] small birds.","밝은 색은 작은 새들을 [[끌어들인다]].","attract (동) 마음을 끌다"],["She likes [[modern art]].","그녀는 [[현대 미술]]을 좋아한다.","modern (형) 현대의, 최신의"],["They plan to [[modernize]] the old school.","그들은 낡은 학교를 [[현대화할]] 계획이다.","modernize (동) 현대화하다"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"keen","a":"3","e":"③ keen: 열심인, 열정적인","w":"① individual: 개성 있는\n② respectful: 공손한, 존경심을 보이는\n④ anxious: 염려하는, 불안해하는","m":0,"s":"keen","c":["개성 있는","공손한, 존경심을 보이는","열심인, 열정적인","염려하는, 불안해하는"],"mn":"열심인, 열정적인","hk":"be keen on(~에 열심이다)으로 기억. anxious(염려하는), respectful(공손한), individual(개성 있는)은 열의와 거리가 먼 뜻","ex":[["He is [[keen on]] soccer.","그는 축구에 [[열심이다]]."],["She is a [[keen reader]].","그녀는 [[열렬한 독서가]]이다."],["They showed a [[keen interest]] in art.","그들은 미술에 [[깊은 관심]]을 보였다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"economy","a":"economy","e":"economy (명) 경제, 경기 / (명) 절약, 아껴 씀","k":"오랜 전쟁의 기간 동안 세계 경제는 급격히 둔화되었다.\n이런 건기에는 물을 사용하는 데 있어 절약이 선택이 아니라 의무이다.","m":0,"s":"The world e______ slowed down sharply during the long years of war.\nIn a dry season like this, e______ in using water is not a choice but a duty.","mn":"경제, 경기 / 절약, 아껴 씀","hk":"economy(경제, 절약)는 두 뜻. world economy(세계 경제)와 economy in using water(물 사용의 절약)로 구분","ex":[["The [[world economy]] is growing again.","[[세계 경제]]가 다시 성장하고 있다.","economy (명) 경제, 경기"],["The [[economy]] was weak last year.","작년에는 [[경기]]가 약했다.","economy (명) 경제, 경기"],["We must practice [[economy]] in daily life.","우리는 일상에서 [[절약]]을 실천해야 한다.","economy (명) 절약, 아껴 씀"]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"accomplish","a":"1","e":"① achieve: 이루다, 성취하다 (그녀는 자신의 식당을 여는 꿈을 이루기 위해 수년간 일했다.) / accomplish(완수하다, 해내다)의 유의어.","w":"② overcome: 극복하다\n③ endeavor: 노력하다, 애쓰다\n④ excel: 능가하다, 뛰어나다","k":"그녀는 자신의 식당을 여는 꿈을 이루기 위해 수년간 일했다.","m":0,"s":"She worked for years to accomplish her dream of opening her own restaurant.","h":"accomplish","c":["achieve","overcome","endeavor","excel"],"mn":"완수하다, 해내다","hk":"accomplish(완수하다)는 achieve(이루다)와 같은 편. endeavor(노력하다)는 애쓰는 과정만 말할 뿐 결과를 이룬다는 뜻이 아님","ex":[["He wants to [[accomplish his goal]].","그는 [[목표를 이루고]] 싶어 한다."],["We [[accomplished the task]] in one hour.","우리는 한 시간 만에 [[과제를 해냈다]]."],["She [[accomplished]] a lot this week.","그녀는 이번 주에 많은 것을 [[해냈다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"essential","a":"1","e":"① essential: 필수의, 매우 중요한 (충분한 수면은 건강한 삶에 필수적이다.)","w":"② potential: 잠재적인\n③ evident: 명백한, 분명한\n④ multiple: 다수의, 다양한","k":"충분한 수면은 건강한 삶에 필수적이다.","m":0,"s":"Enough sleep is ________ for a healthy life.","c":["essential","potential","evident","multiple"],"mn":"필수의, 매우 중요한","hk":"be essential for(~에 필수적이다)로 기억. potential(잠재적인)은 꼬리 모양만 비슷한 속임수, evident(명백한), multiple(다수의)도 아님","ex":[["Water is [[essential for]] life.","물은 생명에 [[필수적이다]]."],["Exercise is an [[essential part]] of my day.","운동은 내 하루의 [[필수적인 부분]]이다."],["Good tools are [[essential]] to this job.","좋은 도구는 이 일에 [[필수이다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"artist","a":"artist","e":"artist 화가, 예술가","k":"그 화가는 자신의 가장 큰 그림을 완성하는 데 세 달을 보냈다.","m":0,"s":"The a______ spent three months finishing his largest painting.","mn":"화가, 예술가","hk":"artist(화가)는 art(미술) 뒤에 ist(~하는 사람)를 붙인 꼴. pianist(피아니스트)도 같은 꼬리","ex":[["The [[artist]] painted a blue sea.","그 [[화가]]는 푸른 바다를 그렸다."],["She is a young [[street artist]].","그녀는 젊은 [[거리 예술가]]이다."],["Many [[artists]] visit this town.","많은 [[예술가들]]이 이 마을을 찾는다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"wander","a":"2","e":"② wander: (어떤 장소를 천천히 걸어 돌아다니다 / 아무런 뚜렷한 목적이나 방향 없이) 돌아다니다, 헤매다","w":"① peer: 자세히 들여다보다\n③ emerge: 나오다, 나타나다\n④ leap: 뛰다[뛰어오르다]","k":"어떤 장소를 천천히 걸어 돌아다니다 / 아무런 뚜렷한 목적이나 방향 없이","m":0,"s":"\"to walk slowly around a place without any clear purpose or direction\"","c":["peer","wander","emerge","leap"],"mn":"돌아다니다, 헤매다","hk":"wander(돌아다니다)는 목적 없이 천천히 걷는 느낌, wander around(이리저리 돌아다니다)로 기억. peer(자세히 들여다보다), leap(뛰어오르다)은 동작이 다름","ex":[["We [[wandered around]] the old town.","우리는 옛 도시를 [[이리저리 돌아다녔다]]."],["He likes to [[wander]] in the park.","그는 공원에서 [[거닐기를]] 좋아한다."],["Don't [[wander off]] alone at night.","밤에 혼자 [[돌아다니지]] 마라."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"resist","a":"4","e":"④ obey: 복종하다, 따르다 (마을 사람들은 시장이 그들의 말을 들어줄 때까지 새 법에 저항하기로 결정했다.) / resist(저항하다, 반항하다)의 반의어.","w":"① flee: 달아나다, 도망치다\n② struggle: 애쓰다, 분투하다\n③ argue: 논쟁하다, 논의하다","k":"마을 사람들은 시장이 그들의 말을 들어줄 때까지 새 법에 저항하기로 결정했다.","m":0,"s":"The villagers decided to resist the new law until the mayor listened to them.","h":"resist","c":["flee","struggle","argue","obey"],"mn":"저항하다, 반항하다","hk":"resist(저항하다)의 반대편은 obey(복종하다). flee(달아나다), struggle(애쓰다), argue(논쟁하다)는 반대가 아닌 속임수","ex":[["The villagers will [[resist]] the new rule.","마을 사람들은 새 규칙에 [[저항할 것이다]].","resist (동) 저항하다, 반항하다"],["Dogs should [[obey]] their owners.","개는 주인에게 [[복종해야]] 한다.","obey (동) 복종하다, 따르다"],["Drivers must [[obey]] traffic rules.","운전자는 교통 규칙을 [[따라야]] 한다.","obey (동) 복종하다, 따르다"]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"runs","a":"3","e":"①운영하다 / ②운영하다 / ③달리다 / ④운영하다 [③번만 의미가 다름]","k":"①그녀의 아버지는 시내 중심가에서 호텔을 운영한다.\n②내 이모는 역 근처에서 작은 꽃집을 운영한다.\n③그는 매일 아침 강을 따라 5킬로미터를 달린다.\n④그들은 어린아이들을 위한 어학원을 운영한다.","m":0,"c":["Her father runs a hotel in the center of town.","My aunt runs a small flower shop near the station.","He runs five kilometers along the river every morning.","They run a language school for young children."],"hc":"runs|runs|runs|run","mn":"운영하다 / 달리다","hk":"run a hotel(호텔을 운영하다)처럼 운영하다가 세 개. ③번 runs five kilometers(5킬로미터를 달리다)만 뜻이 다름","ex":[["My uncle [[runs a restaurant]].","내 삼촌은 [[식당을 운영한다]].","run (동) 운영하다, 경영하다"],["She [[runs a small shop]] downtown.","그녀는 시내에서 [[작은 가게를 운영한다]].","run (동) 운영하다, 경영하다"],["He [[runs]] in the park every day.","그는 매일 공원에서 [[달린다]].","run (동) 달리다"]]}]},{"day":22,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"movement","a":"1","e":"① motion: 움직임, 운동 (그 카메라는 무대 위 무용수의 모든 움직임을 담아냈다.) / movement(움직임, 이동)의 유의어.","w":"② rhythm: 리듬, 박자\n③ pace: 속도, 걸음걸이\n④ posture: 자세","k":"그 카메라는 무대 위 무용수의 모든 움직임을 담아냈다.","m":0,"s":"The camera captured every movement of the dancer on the stage.","h":"movement","c":["motion","rhythm","pace","posture"],"mn":"움직임, 이동","hk":"movement(움직임)는 motion(움직임, 운동)과 같은 편. rhythm(리듬), pace(속도), posture(자세)는 관련은 있어도 같은 뜻이 아닌 속임수","ex":[["Any [[sudden movement]] may scare the cat.","[[갑작스러운 움직임]]은 고양이를 놀라게 할 수 있다."],["The map shows
