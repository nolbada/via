ether crown shyness is driven by external forces, like branches colliding in strong winds, or by a survival strategy, such as ensuring fair distribution of resources and limiting the spread of disease.","과학자들은 수관기피가 강풍에 가지가 부딪치는 것과 같은 외부의 힘 때문인지, 아니면 자원의 공평한 분배와 질병 확산 억제 같은 생존 전략 때문인지를 아직 연구하고 있다."]],"w":"2번 avoid contact(접촉을 피함), 5번 sunlight can reach lower branches. 가지는 닿기를 원하는 게 아니라 피하고, 틈으로 오는 것은 바람이나 질병이 아니라 햇빛.","c":1},"h":"f96a8a983a"},{"n":10,"t":"fill","q":"It is clear [A] of nature’s remarkable [B] to maintain delicate balance and harmony.","ko":"이것은 자연이 섬세한 균형과 조화를 유지하는 놀라운 [B]을(를) 지녔다는 분명한 [A].","bank":["evidence","ability","disease","resources","contact","gaps"],"bko":{"evidence":"증거","ability":"능력","disease":"질병","resources":"자원","contact":"접촉","gaps":"틈"},"r":{"a":"[A] evidence (증거), [B] ability (능력)","ev":"9번 문장","s":[[9,"It is clear evidence of nature’s remarkable ability to maintain delicate balance and harmony.","이것은 자연이 섬세한 균형과 조화를 유지하는 놀라운 능력을 지녔다는 분명한 증거이다."]],"w":"9번 문장 It is clear evidence of nature’s remarkable ability to maintain delicate balance and harmony에서 가져옴. evidence는 '증거', ability는 '능력'. disease, resources, contact, gaps는 clear 뒤 또는 remarkable 뒤 명사 자리에 뜻이 맞지 않음.","c":null},"h":"6156190ab0"}]},{"u":4,"id":"rg6-04-2","no":2,"ko":"내가 좋아하는 정보만 쏙쏙?","items":[{"n":1,"t":"tf","q":"A person who often searches for budget-friendly travel tips may see more affordable destinations in later searches.","ko":"저비용 여행 팁을 자주 검색하는 사람은 이후 검색에서 더 저렴한 여행지를 보게 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"For example, if a person frequently searches for budget-friendly travel tips, their search engine will prioritize affordable destinations and low-cost vacation ideas in future searches.","예를 들어, 어떤 사람이 저비용 여행 팁을 자주 검색하면, 그의 검색 엔진은 이후 검색에서 저렴한 여행지와 저비용 휴가 아이디어를 우선시할 것이다."]],"w":"4번 문장에서 저비용 여행 팁을 자주 검색하면 저렴한 여행지와 휴가 아이디어를 우선시한다고 함. 본문과 같은 내용.","c":"T"},"h":"138018fa99"},{"n":2,"t":"tf","q":"If someone searches for a political stance, the search engine tends to show both sides equally.","ko":"누군가가 정치적 입장을 검색하면, 검색 엔진은 양쪽을 똑같이 보여 주는 경향이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Similarly, if someone searches for a specific political stance, the search engine is likely to keep presenting that side of the argument, hiding other important perspectives.","마찬가지로, 누군가가 특정한 정치적 입장을 검색하면, 검색 엔진은 다른 중요한 관점들은 숨기면서 계속 그쪽 주장을 보여 줄 가능성이 있다."]],"w":"6번 문장에서 검색 엔진은 그쪽 주장만 계속 보여 주고 다른 중요한 관점은 숨긴다고 함. 양쪽을 똑같이 보여 준다는 말은 반대.","c":"F"},"h":"c1c5708b33"},{"n":3,"t":"tf","q":"Filter bubbles can keep us in a cycle where we only meet ideas we have accepted before.","ko":"필터 버블은 우리가 이전에 받아들였던 생각만 접하는 순환 속에 우리를 가둘 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Over time, this can narrow our perspective and keep us in a cycle where we only encounter ideas that we’ve accepted before.","시간이 지나면서, 이것은 우리의 관점을 좁히고, 우리가 이전에 받아들였던 생각만 접하게 되는 순환 속에 우리를 계속 가둘 수 있다."]],"w":"3번 문장에서 우리의 관점을 좁히고 이전에 받아들인 생각만 접하는 순환 속에 가둔다고 함. 본문과 맞음.","c":"T"},"h":"3a30a6b047"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… prioritize affordable destinations and low-cost vacation ideas …)","ko":"… ( ) 여행지와 저비용 휴가 아이디어를 우선시할 것이다.","opts":["값비싼","살 만한 가격의","위험한","유명한"],"word":"affordable","r":{"a":"2) 살 만한 가격의","ev":"4번 문장","s":[[4,"For example, if a person frequently searches for budget-friendly travel tips, their search engine will prioritize affordable destinations and low-cost vacation ideas in future searches.","예를 들어, 어떤 사람이 저비용 여행 팁을 자주 검색하면, 그의 검색 엔진은 이후 검색에서 저렴한 여행지와 저비용 휴가 아이디어를 우선시할 것이다."]],"w":"4번 문장에서 affordable destinations는 budget-friendly(저비용) 여행 팁을 검색한 사람에게 나오는 여행지, 뒤의 low-cost와도 이어짐. 그래서 '살 만한 가격의'. 값비싼은 반대.","c":2},"h":"e149f3f4eb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (We need to stay cautious about how search engines shape the information we see.)","ko":"우리는 검색 엔진이 우리가 보는 정보를 어떻게 형성하는지에 대해 ( ) 태도를 가질 필요가 있다.","opts":["무관심한","만족하는","편안한","주의 깊은"],"word":"cautious","r":{"a":"4) 주의 깊은","ev":"9번 문장","s":[[9,"We need to stay cautious about how search engines shape the information we see.","우리는 검색 엔진이 우리가 보는 정보를 어떻게 형성하는지에 대해 경계할 필요가 있다."]],"w":"9번 문장은 검색 엔진이 정보를 형성하는 방식을 그냥 믿지 말고 조심하라는 필자의 주장. stay cautious = 주의 깊게 지내다. 10번의 '잘못 인도되는 것을 피한다'와도 이어짐.","c":4},"h":"4021cc09aa"},{"n":6,"t":"ref","q":"What does the underlined \"those results\" refer to?\nEven if they want to explore luxury options, those results might be harder to find.","ko":"밑줄 친 those results이 가리키는 것은?","sko":"그가 호화로운 선택권을 탐색하고 싶더라도, 그런 결과는 찾기 더 어려울 수 있다.","opts":["호화로운 선택권에 대한 결과","저비용 여행지에 대한 결과","과거 관심사에 대한 결과","정치적 입장에 대한 결과"],"r":{"a":"1) 호화로운 선택권에 대한 결과","ev":"5번 문장","s":[[5,"Even if they want to explore luxury options, those results might be harder to find.","그가 호화로운 선택권을 탐색하고 싶더라도, 그런 결과는 찾기 더 어려울 수 있다."]],"w":"4번 문장의 a person(저비용 여행 팁을 자주 검색하는 사람)이 5번의 they. 이 사람이 호화로운 여행을 알아보고 싶어도 결과가 안 나온다는 흐름.","c":1,"k":"those results = 호화로운 선택권에 대한 결과"},"pron":"those results","h":"823804218a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While search engines make our lives easier, this convenience comes at a cost.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"검색 엔진이 우리의 삶을 더 편리하게 만들어 주기는 하지만, 이 편리함에는 대가가 따른다.","opts":["검색 엔진이 삶을 편하게 해 주지만, 그 편리함에는 대가가 따른다.","검색 엔진 덕분에 삶이 편해졌고, 그 편리함은 아무 대가 없이 누릴 수 있다.","검색 엔진은 삶을 불편하게 만들지만 비용은 적게 든다.","검색 엔진이 너무 비싸서 삶이 편해지기 어렵다."],"r":{"a":"1) 검색 엔진이 삶을 편하게 해 주지만, 그 편리함에는 대가가 따른다.","ev":"8번 문장","s":[[8,"While search engines make our lives easier, this convenience comes at a cost.","검색 엔진이 우리의 삶을 더 편리하게 만들어 주기는 하지만, 이 편리함에는 대가가 따른다."]],"w":"While은 '~이긴 하지만', comes at a cost는 '대가가 따른다'. 장점 + 단점이 이어지는 문장. 대가 없이 누린다는 말은 반대.","c":1},"h":"b409320709"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["검색 엔진은 우리가 정보를 빨리 찾는 것을 도와주지 못한다.","필터 버블은 우리가 이전에 본 적 없는 생각을 더 많이 보여 준다.","강한 정치적 입장을 가진 사람에게 검색 엔진은 다른 입장을 더 자주 보여 준다.","필터 버블은 과거 관심사를 기반으로 한 결과를 우선시해서 우리가 보는 것을 제한한다."],"opts":["Search engines do not help us find information quickly.","Filter bubbles show us more ideas that we have never seen before.","Search engines show other positions more often to people with a strong stance.","Filter bubbles limit what we see by prioritizing results based on our past interests."],"r":{"a":"4) Filter bubbles limit what we see by prioritizing results based on our past interests.","ev":"2번 문장","s":[[2,"However, they sometimes create “filter bubbles,” which limit what we see by prioritizing results based on our past interests.","그러나 그것은 때때로 '필터 버블'을 만들어, 우리의 과거 관심사를 기반으로 한 결과를 우선시함으로써 우리가 보는 것을 제한한다."]],"w":"2번 문장에서 필터 버블은 과거 관심사를 기반으로 결과를 우선시해서 우리가 보는 것을 제한한다고 함. 나머지는 1번(빠르고 쉽게), 3번(이전에 받아들인 생각만), 6번(다른 관점은 숨김)과 반대.","c":4},"h":"0224f2ba10"},{"n":9,"t":"sum","q":"To avoid being (A) by personalized results, we should be (B) of the limitations of search engines.","ko":"맞춤형 결과에 (A)하는 것을 피하려면, 우리는 검색 엔진의 한계를 (B)해야 한다.","oko":["(A) 도움받는 / (B) 모르는","(A) 잘못 인도되는 / (B) 모르는","(A) 기뻐하는 / (B) 알고 있는","(A) 갇히는 / (B) 부주의한","(A) 잘못 인도되는 / (B) 알고 있는"],"opts":["(A) helped / (B) unaware","(A) misled / (B) unaware","(A) pleased / (B) aware","(A) trapped / (B) careless","(A) misled / (B) aware"],"r":{"a":"5) (A) misled / (B) aware","ev":"9~10번 문장","s":[[9,"We need to stay cautious about how search engines shape the information we see.","우리는 검색 엔진이 우리가 보는 정보를 어떻게 형성하는지에 대해 경계할 필요가 있다."],[10,"By being aware of the limitations of personalized results, we can avoid being misled and trapped in our own biases.","맞춤형 검색 결과의 한계를 인식함으로써, 우리는 잘못 인도되거나 우리 자신의 편견에 갇히는 것을 피할 수 있다."]],"w":"10번 문장에서 맞춤형 결과의 한계를 인식하면(aware) 잘못 인도되는(misled) 것을 피할 수 있다고 함. 한계를 모르거나 부주의하면 오히려 피할 수 없음.","c":5},"h":"46c668a57f"},{"n":10,"t":"fill","q":"This [A] of information makes it [B] for people to see things from various angles and make well-informed decisions.","ko":"이러한 정보의 [A]은(는) 사람들이 다양한 관점에서 사물을 바라보고 충분한 정보를 바탕으로 결정을 내리는 것을 [B] 일로 만든다.","bank":["narrowing","impossible","cautious","affordable","powerful","quick"],"bko":{"narrowing":"축소","impossible":"불가능한","cautious":"주의 깊은","affordable":"저렴한","powerful":"강력한","quick":"빠른"},"r":{"a":"[A] narrowing (축소), [B] impossible (불가능한)","ev":"7번 문장","s":[[7,"This narrowing of information makes it impossible for people to see things from various angles and make well-informed decisions.","이러한 정보의 축소는 사람들이 다양한 관점에서 사물을 바라보고 충분한 정보를 바탕으로 결정을 내리는 것을 불가능하게 만든다."]],"w":"2번 prioritizing results based on our past interests, 3번 this can narrow our perspective에서 가져옴. limitation, convenience는 명사이고 cautious, affordable은 형용사라 동사 자리에 들어갈 수 없음.","c":null},"h":"2de17355a3"}]},{"u":4,"id":"rg6-04-3","no":3,"ko":"이민이 가장 쉬웠어요","items":[{"n":1,"t":"tf","q":"Svalbard has the world's northernmost town, university, and church.","ko":"스발바르에는 세계 최북단의 마을, 대학, 교회가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It has the world’s northernmost town, university, and church.","이곳에는 세계 최북단의 마을, 대학, 그리고 교회가 있다."]],"w":"3번 문장에서 세계 최북단의 마을, 대학, 교회가 있다고 함. 본문과 같은 내용.","c":"T"},"h":"c3ed11a12a"},{"n":2,"t":"tf","q":"People must get a visa before they can settle in Svalbard.","ko":"사람들은 스발바르에 정착하기 전에 비자를 받아야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Thanks to the Svalbard Treaty, citizens of 46 countries can settle here without obtaining a visa.","스발바르 조약 덕분에, 46개국 시민들은 비자를 받지 않고도 이곳에 정착할 수 있다."]],"w":"5번 문장에서 스발바르 조약 덕분에 비자를 받지 않고도(without obtaining a visa) 정착할 수 있다고 함. 비자가 필요하다는 말은 반대.","c":"F"},"h":"2db0f6c5c3"},{"n":3,"t":"tf","q":"Svalbard's tax-free status makes it a financially attractive place to live and work.","ko":"스발바르의 세금 면제 제도는 이곳을 거주하고 일하기에 경제적으로 매력적인 곳으로 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The island’s tax-free status makes it a financially attractive place to live and work.","이 섬의 세금 면제 제도는 이곳을 거주하고 근무하기에 경제적으로 매력적인 장소로 만든다."]],"w":"8번 문장에서 세금 면제 제도가 경제적으로 매력적인 장소로 만든다고 함. 본문과 맞음.","c":"T"},"h":"407ea1fc20"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… it is one of the easiest places in the world to immigrate to.)","ko":"… 세계에서 ( ) 가장 쉬운 곳 중 하나이다.","opts":["여행하다","탈출하다","이민을 오다","투자하다"],"word":"immigrate","r":{"a":"3) 이민을 오다","ev":"4~5번 문장","s":[[4,"Most importantly, it is one of the easiest places in the world to immigrate to.","무엇보다 중요한 것은, 이곳이 세계에서 가장 쉽게 이민을 갈 수 있는 곳 중 하나라는 점이다."],[5,"Thanks to the Svalbard Treaty, citizens of 46 countries can settle here without obtaining a visa.","스발바르 조약 덕분에, 46개국 시민들은 비자를 받지 않고도 이곳에 정착할 수 있다."]],"w":"4번에서 이민이 가장 쉬운 곳이라 하고, 5번에서 비자 없이 정착할 수 있다고 이어짐. 다른 나라로 들어와 사는 것이 immigrate(이민 오다).","c":3},"h":"f365f3c661"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The local hospital lacks childbirth facilities …)","ko":"현지 병원에는 출산 시설이 ( ) …","opts":["충분히 갖추고 있다","~이 없다","새로 짓다","자랑하다"],"word":"lacks","r":{"a":"2) ~이 없다","ev":"13번 문장","s":[[13,"The local hospital lacks childbirth facilities, and burials are not allowed because the permafrost blocks natural decomposition of bodies.","현지 병원에는 출산 시설이 없고, 영구 동토층이 시신의 자연스러운 분해를 막기 때문에 매장도 허용되지 않는다."]],"w":"13번은 어려움을 말하는 부분(11번 however 이후). 병원에 출산 시설이 '없다'는 뜻이라서 lack = ~이 없다, 부족하다.","c":2},"h":"a9a502437d"},{"n":6,"t":"ref","q":"What does the underlined \"where\" refer to?\nAdding to its charm is its lively multicultural atmosphere, where residents connect with people from around the world and share a variety of experiences.","ko":"밑줄 친 where이 가리키는 것은?","sko":"이곳의 매력을 더해 주는 것은 활기찬 다문화 분위기인데, 그곳에서 주민들은 전 세계 사람들과 교류하며 다양한 경험을 공유한다.","opts":["활기찬 다문화 분위기","북극의 자연환경","세계 각지","노르웨이 본토"],"r":{"a":"1) 활기찬 다문화 분위기","ev":"10번 문장","s":[[10,"Adding to its charm is its lively multicultural atmosphere, where residents connect with people from around the world and share a variety of experiences.","이곳의 매력을 더해 주는 것은 활기찬 다문화 분위기인데, 그곳에서 주민들은 전 세계 사람들과 교류하며 다양한 경험을 공유한다."]],"w":"8번에서 The island's tax-free status로 섬 이야기를 하고, 9번 Its는 그 island(스발바르)의 자연환경이라는 뜻. 세금 면제 제도가 아름다운 자연환경을 가질 수는 없음.","c":1,"k":"where = 활기찬 다문화 분위기"},"pron":"where","h":"ba9a5587e8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"As long as you have a job and a place to live, you are welcome — and everyone is treated equally.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 일자리와 거주할 곳이 있는 한 당신은 환영받으며, 모든 사람이 평등하게 대우받는다.","opts":["일자리가 있으면 환영하지만 외국인은 차별 대우를 받는다.","일자리와 살 곳만 있으면 환영받고, 모든 사람이 평등하게 대우받는다.","살 곳만 있으면 일자리가 없어도 환영받는다.","환영받으려면 46개국 시민이어야 하고 모두 같은 직업을 가져야 한다."],"r":{"a":"2) 일자리와 살 곳만 있으면 환영받고, 모든 사람이 평등하게 대우받는다.","ev":"6번 문장","s":[[6,"As long as you have a job and a place to live, you are welcome — and everyone is treated equally.","당신이 일자리와 거주할 곳이 있는 한 당신은 환영받으며, 모든 사람이 평등하게 대우받는다."]],"w":"as long as는 '~하기만 하면'. 조건은 일자리와 살 곳 두 가지이고, everyone is treated equally는 모두 평등한 대우. 차별한다는 말이나 일자리가 필요 없다는 말은 틀림.","c":2},"h":"9a58d1e5e7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["스발바르 병원에서는 많은 아기가 태어난다.","영구 동토층이 분해를 도와서 매장이 허용된다.","스발바르의 포장도로는 약 400km이다.","스발바르는 노르웨이 본토에서 북쪽으로 약 800km 떨어져 있다."],"opts":["The island has a hospital where many babies are born.","Burials are allowed because the permafrost helps bodies decompose.","Paved roads in Svalbard total about 400 km.","Svalbard is about 800 km north of mainland Norway."],"r":{"a":"4) Svalbard is about 800 km north of mainland Norway.","ev":"1번 문장","s":[[1,"Svalbard, a remote island group in the Arctic Ocean, is located about 800 km north of mainland Norway.","북극해의 외딴 군도인 스발바르는 노르웨이 본토에서 북쪽으로 약 800km 떨어진 곳에 위치해 있다."]],"w":"1번 문장에서 노르웨이 본토 북쪽 약 800km에 있다고 함. 나머지는 13번(출산 시설 없음, 분해를 막아서 매장 불가), 12번(포장도로 40km)과 반대.","c":4},"h":"c6c15e917c"},{"n":9,"t":"sum","q":"Living in Svalbard is difficult because of the extreme (A) and limited (B).","ko":"스발바르에서 사는 것은 극심한 (A)와 제한된 (B) 때문에 어렵다.","oko":["(A) 기후 / (B) 세금","(A) 비자 / (B) 사회 기반 시설","(A) 기후 / (B) 사회 기반 시설","(A) 인구 / (B) 세금","(A) 활동 / (B) 자연환경"],"opts":["(A) climate / (B) taxes","(A) visas / (B) infrastructure","(A) climate / (B) infrastructure","(A) population / (B) taxes","(A) activities / (B) environment"],"r":{"a":"3) (A) climate / (B) infrastructure","ev":"12번 문장","s":[[12,"The extreme climate, months of polar night, and limited infrastructure — like only 40 km of paved roads — make daily life difficult.","혹독한 기후, 수개월간의 극야, 그리고 포장된 도로가 40km에 불과한 것과 같은 제한된 사회 기반 시설은 일상생활을 어렵게 만든다."]],"w":"12번 문장 The extreme climate … and limited infrastructure가 일상생활을 어렵게 만든다고 함. 세금은 오히려 장점(8번), 비자는 필요 없음(5번).","c":3},"h":"3df09b538e"},{"n":10,"t":"fill","q":"Thanks to the Svalbard [A], citizens of 46 countries can settle here without [B] a visa.","ko":"스발바르 [A] 덕분에, 46개국 시민들은 비자를 [B] 없이 이곳에 정착할 수 있다.","bank":["treaty","obtaining","thrilling","unique","extreme","lack"],"bko":{"treaty":"조약","obtaining":"얻는 것","thrilling":"스릴 넘치는","unique":"독특한","extreme":"극심한","lack":"~이 없다"},"r":{"a":"[A] treaty (조약), [B] obtaining (얻는 것)","ev":"5번 문장","s":[[5,"Thanks to the Svalbard Treaty, citizens of 46 countries can settle here without obtaining a visa.","스발바르 조약 덕분에, 46개국 시민들은 비자를 받지 않고도 이곳에 정착할 수 있다."]],"w":"5번 Thanks to the Svalbard Treaty, citizens of 46 countries can settle here without obtaining a visa에서 가져옴. permafrost, infrastructure, atmosphere는 비자 없이 정착하게 해 주는 것이 아니고, lack은 '정착하다'와 뜻이 다름.","c":null},"h":"f369a531d5"}]},{"u":5,"id":"rg6-05-1","no":1,"ko":"박테리아를 입는다고요?","items":[{"n":1,"t":"tf","q":"Modern Synthesis uses bacteria to make new materials for clothing.","ko":"Modern Synthesis는 의류용 새 소재를 만들기 위해 박테리아를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Modern Synthesis, a UK-based company, is using bacteria to make new materials for clothing that don’t require animals or plastic.","영국에 기반을 둔 회사인 Modern Synthesis는 동물이나 플라스틱이 필요하지 않은 새로운 의류용 소재를 만들기 위해 박테리아를 사용하고 있다."]],"w":"2번 문장에서 Modern Synthesis가 동물이나 플라스틱이 필요 없는 새 의류 소재를 만들기 위해 박테리아를 사용한다고 함. 본문과 같은 내용.","c":"T"},"h":"c863659d85"},{"n":2,"t":"tf","q":"The process starts with bacteria taken from cotton and wood.","ko":"그 과정은 면과 나무에서 얻은 박테리아로 시작한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The process starts with bacteria taken from kombucha, a fermented tea.","그 과정은 발효차인 콤부차에서 얻은 박테리아로 시작한다."]],"w":"4번 문장에서 박테리아는 발효차인 콤부차에서 얻는다고 함. 면과 나무는 5번에서 섬유소가 발견되는 식물 재료로만 나옴.","c":"F"},"h":"233b5b9f22"},{"n":3,"t":"tf","q":"The fabric works for all kinds of styles, from minimalist designs to bold, eye-catching creations.","ko":"그 직물은 미니멀한 디자인부터 대담하고 시선을 사로잡는 창작물까지 모든 종류의 스타일에 적합하다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The fabric works for all kinds of styles, from minimalist designs to bold, eye-catching creations.","그 직물은 미니멀한 디자인부터 대담하고 시선을 사로잡는 창작물까지 모든 종류의 스타일에 적합하다."]],"w":"11번 문장에서 모든 종류의 스타일에 적합하다고 하면서 미니멀한 디자인부터 대담한 창작물까지라고 함. 본문과 같은 내용.","c":"T"},"h":"8bc0599c1b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… the cellulose is processed into super-strong fibers …)","ko":"… 그 섬유소는 초강력 섬유로 ( ) …","opts":["버려지다","섞이다","가공되다","사라지다"],"word":"processed","r":{"a":"3) 가공되다","ev":"6번 문장","s":[[6,"Afterward, the cellulose is processed into super-strong fibers that are then made into fabric.","이후, 그 섬유소는 초강력 섬유로 가공된 다음, 직물로 만들어진다."]],"w":"6번 문장은 섬유소가 초강력 섬유가 되고 다시 직물이 되는 제작 단계. process into ~ = ~로 가공하다, is processed는 수동이라 '가공되다'.","c":3},"h":"65922ec956"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This innovative fabric proves that …)","ko":"이 ( ) 직물은 …을 증명한다.","opts":["평범한","혁신적인","오래된","위험한"],"word":"innovative","r":{"a":"2) 혁신적인","ev":"12번 문장","s":[[12,"This innovative fabric proves that protecting the environment doesn’t mean giving up on style.","이 혁신적인 직물은 환경을 보호하는 것이 스타일을 포기하는 것을 의미하지 않는다는 것을 증명한다."]],"w":"12번은 박테리아로 만든 새 직물이 환경과 스타일을 모두 지킨다는 것을 증명한다는 문장. 새롭고 앞서가는 직물이므로 '혁신적인'. 평범한, 오래된은 반대 방향.","c":2},"h":"6d173f0a5c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhat makes this fabric special is that it can handle any style.","ko":"밑줄 친 it이 가리키는 것은?","sko":"이 직물을 특별하게 만드는 것은 그것이 어떤 스타일이든 소화할 수 있다는 점이다.","opts":["이 직물","어떤 스타일","박테리아","강철"],"r":{"a":"1) 이 직물","ev":"8번 문장","s":[[8,"What makes this fabric special is that it can handle any style.","이 직물을 특별하게 만드는 것은 그것이 어떤 스타일이든 소화할 수 있다는 점이다."]],"w":"which 앞에 sugar(설탕)가 있고, which they use to produce cellulose는 '박테리아가 섬유소를 만드는 데 사용하는 것 = 설탕'. 섬유소는 which 뒤에서 만들어지는 결과물.","c":1,"k":"it = 이 직물"},"pron":"it","h":"fbe845747e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This fabric can be even stronger than steel at the fiber level!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 직물은 섬유 단위에서 강철보다도 더 튼튼할 수 있다!","opts":["이 직물은 섬유 단위에서는 강철보다도 더 튼튼할 수 있다.","이 직물은 강철로 만든 섬유로 짜여 있다.","이 직물은 강철만큼 무겁지만 더 부드럽다.","이 직물은 강철보다 가벼워서 섬유로는 쓸 수 없다."],"r":{"a":"1) 이 직물은 섬유 단위에서는 강철보다도 더 튼튼할 수 있다.","ev":"7번 문장","s":[[7,"This fabric can be even stronger than steel at the fiber level!","이 직물은 섬유 단위에서 강철보다도 더 튼튼할 수 있다!"]],"w":"stronger than steel은 '강철보다 튼튼한'. at the fiber level은 섬유 단위에서. 강철로 만들었다거나 무겁다는 말은 본문에 없음.","c":1},"h":"12c863ff04"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["그 직물은 박테리아 없이 만들어진다.","그 직물은 한 가지 스타일에만 쓸 수 있다.","박테리아로 소재를 만드는 것은 패션을 지구에 더 이롭게 만들기 위한 새로운 걸음이다.","디자이너는 그 직물의 색상을 바꿀 수 없다."],"opts":["The fabric is made without bacteria.","The fabric can be used for only one style.","Making materials with bacteria is a new step toward making fashion better for the planet.","Designers cannot change the color of the fabric."],"r":{"a":"3) Making materials with bacteria is a new step toward making fashion better for the planet. (박테리아로 소재를 만드는 것은 패션을 지구에 더 이롭게 만들기 위한 새로운 걸음이다.)","ev":"2~3번 문장","s":[[2,"Modern Synthesis, a UK-based company, is using bacteria to make new materials for clothing that don’t require animals or plastic.","영국에 기반을 둔 회사인 Modern Synthesis는 동물이나 플라스틱이 필요하지 않은 새로운 의류용 소재를 만들기 위해 박테리아를 사용하고 있다."],[3,"This is a new step toward making fashion better for the planet.","이것은 패션을 지구에 더 이롭게 만들기 위한 새로운 걸음이다."]],"w":"9번 문장에서 튼튼할 뿐 아니라 유연해서 현대 패션에 딱 맞는다고 함. 나머지는 1번(박테리아 사용), 5번(식물성 재료), 10번(밝은 색을 더할 수 있음)과 반대.","c":3},"h":"97cb0df60a"},{"n":9,"t":"sum","q":"The process starts with bacteria taken from (A), a fermented tea. The bacteria are fed (B), which they use to produce cellulose.","ko":"그 과정은 발효차인 (A)에서 얻은 박테리아로 시작한다. 박테리아는 (B)을(를) 먹고, 그것을 사용해 섬유소를 만든다.","oko":["(A) 콤부차 / (B) 설탕","(A) 면 / (B) 설탕","(A) 콤부차 / (B) 강철","(A) 나무 / (B) 강철","(A) 면 / (B) 플라스틱"],"opts":["(A) kombucha / (B) sugar","(A) cotton / (B) sugar","(A) kombucha / (B) steel","(A) wood / (B) steel","(A) cotton / (B) plastic"],"r":{"a":"1) (A) kombucha / (B) sugar ((A) 콤부차 / (B) 설탕)","ev":"4~5번 문장","s":[[4,"The process starts with bacteria taken from kombucha, a fermented tea.","그 과정은 발효차인 콤부차에서 얻은 박테리아로 시작한다."],[5,"The bacteria are fed sugar, which they use to produce cellulose, a natural material found in plant materials like cotton and wood.","박테리아는 설탕을 먹고, 그것을 면이나 나무와 같은 식물성 재료에서 발견되는 천연 물질인 섬유소를 만드는 데 사용한다."]],"w":"4번에서 박테리아는 콤부차에서 얻고, 5번에서 설탕을 이용해 섬유소(cellulose)를 만들며, 6번에서 섬유소가 섬유와 직물이 됨. 면·나무는 섬유소가 발견되는 곳, 강철은 비교 대상일 뿐.","c":1},"h":"910ddc3b81"},{"n":10,"t":"fill","q":"The fabric is not only strong but also [A], and designers can add [B] colors and fun patterns to it.","ko":"그 직물은 튼튼할 뿐만 아니라 [A] 직물이기도 하며, 디자이너들은 거기에 [B] 색상과 재미있는 패턴을 더할 수 있다.","bank":["flexible","bright","steel","plastic","bacteria","cotton"],"bko":{"flexible":"유연한","bright":"밝은","steel":"강철","plastic":"플라스틱","bacteria":"박테리아","cotton":"면"},"r":{"a":"[A] flexible (유연한), [B] bright (밝은)","ev":"9~10번 문장","s":[[9,"It is not only strong but also flexible, which makes it perfect for modern fashion.","그것은 튼튼할 뿐만 아니라 유연하기까지 해서, 현대 패션에 딱 맞는다."],[10,"Designers can add bright colors, fun patterns, and creative textures.","디자이너들은 밝은 색상, 재미있는 패턴, 그리고 독창적인 질감을 더할 수 있다."]],"w":"9번 not only strong but also flexible, 10번 Designers can add bright colors에서 가져옴. steel, sugar, bacteria, cotton은 모두 재료 이름(명사)이라 '튼튼할 뿐만 아니라 ~한'이나 '~한 색상' 자리에 안 맞음.","c":null},"h":"5c0eb379f0"}]},{"u":5,"id":"rg6-05-2","no":2,"ko":"지도에는 없는 이상한 도로들","items":[{"n":1,"t":"tf","q":"Ghost roads are illegally constructed paths in rainforests.","ko":"유령 도로는 열대우림에 불법적으로 건설된 길이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Among them are “ghost roads” — illegally constructed paths in rainforests.","그중에는 '유령 도로', 즉 열대우림에 불법적으로 건설된 도로가 있다."]],"w":"2번 문장에서 ghost roads를 illegally constructed paths in rainforests라고 설명함. 본문과 같은 내용.","c":"T"},"h":"c8e2218d99"},{"n":2,"t":"tf","q":"The researchers found fewer roads than the officially recorded number.","ko":"연구원들은 공식적으로 기록된 수치보다 더 적은 도로를 발견했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"That is three to seven times more than what is officially recorded.","그것은 공식적으로 기록된 것보다 3배에서 7배 더 많은 수치이다."]],"w":"8번 문장에서 발견된 도로는 공식 기록보다 3배에서 7배 더 많다고 함. 더 적다는 말은 반대.","c":"F"},"h":"2c3299d103"},{"n":3,"t":"tf","q":"Ghost roads are difficult to monitor because they do not appear on maps.","ko":"유령 도로는 지도에 나타나지 않기 때문에 감시하기 어렵다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Since these roads do not appear on maps, they are extremely difficult to monitor or control.","이 도로들은 지도에 나타나지 않기 때문에, 감시하거나 통제하기가 매우 어렵다."]],"w":"9번 문장에서 지도에 나타나지 않으므로 감시하거나 통제하기가 매우 어렵다고 함. 본문과 같은 내용.","c":"T"},"h":"2eb52d88f0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These roads provide unauthorized access to untouched forests …)","ko":"이 도로들은 훼손되지 않은 숲에 ( ) 접근을 제공한다 …","opts":["허가받지 않은","환영받는","안전한","무료의"],"word":"unauthorized","r":{"a":"1) 허가받지 않은","ev":"2~3번 문장","s":[[2,"Among them are “ghost roads” — illegally constructed paths in rainforests.","그중에는 '유령 도로', 즉 열대우림에 불법적으로 건설된 도로가 있다."],[3,"These roads provide unauthorized access to untouched forests and are becoming increasingly common in the Asia-Pacific region.","이러한 도로는 훼손되지 않은 숲에 무단으로 접근할 수 있게 하며, 아시아 태평양 지역에서 갈수록 더 흔해지고 있다."]],"w":"2번에서 유령 도로는 '불법적으로' 만든 도로이고, 3번에서 그 도로가 숲에 접근하게 해 준다고 함. 허가 없이 들어가는 것이므로 '허가받지 않은'.","c":1},"h":"3b43361281"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… to cut down trees and harvest valuable resources.)","ko":"… 나무를 베고 귀중한 자원을 ( ) 위해서이다.","opts":["심다","채취하다","팔다","보호하다"],"word":"harvest","r":{"a":"2) 채취하다","ev":"4번 문장","s":[[4,"Loggers, miners, and land grabbers use these roads to cut down trees and harvest valuable resources.","벌목꾼, 광부, 불법 토지 점유자들은 나무를 베고 귀중한 자원을 채취하는 데 이 도로들을 이용한다."]],"w":"4번은 벌목꾼·광부가 도로를 쓰는 이유. 나무를 베고(cut down) 귀중한 자원을 캐내는 것이므로 harvest = 거두다, 채취하다. 심거나 보호하는 것은 반대.","c":2},"h":"9a4579bea8"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSince these roads do not appear on maps, they are extremely difficult to monitor or control.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이 도로들은 지도에 나타나지 않기 때문에, 감시하거나 통제하기가 매우 어렵다.","opts":["이 도로들","지도들","감시하는 사람들","호주의 연구원들"],"r":{"a":"1) 이 도로들","ev":"9번 문장","s":[[9,"Since these roads do not appear on maps, they are extremely difficult to monitor or control.","이 도로들은 지도에 나타나지 않기 때문에, 감시하거나 통제하기가 매우 어렵다."]],"w":"7번에서 연구원들이 137만 km의 도로를 발견했다고 하고, 8번 That은 그 수치. 공식 기록보다 3~7배 많다는 비교의 대상.","c":1,"k":"they = 이 도로들"},"pron":"they","h":"a3395f092f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The impact of ghost roads extends well beyond deforestation.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"유령 도로의 영향은 삼림 벌채를 훨씬 넘어선다.","opts":["유령 도로의 영향은 삼림 벌채가 전부이다.","유령 도로는 삼림 벌채에 영향을 주지 않는다.","유령 도로의 영향은 삼림 벌채가 끝나면 사라진다.","유령 도로의 영향은 삼림 벌채에서 멈추지 않고 훨씬 더 넓게 퍼진다."],"r":{"a":"4) 유령 도로의 영향은 삼림 벌채에서 멈추지 않고 훨씬 더 넓게 퍼진다.","ev":"11번 문장","s":[[11,"The impact of ghost roads extends well beyond deforestation.","유령 도로의 영향은 삼림 벌채를 훨씬 넘어선다."]],"w":"extend beyond는 '~을 넘어서다'. 11번 뒤 12~13번에서 생태계 교란과 기후 조절 능력 약화까지 나오므로, 영향이 삼림 벌채에서 멈추지 않는다는 뜻.","c":4},"h":"930d1ac433"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["유령 도로는 숲이 더 많은 야생동물을 살게 도와준다.","유령 도로는 서식지를 파괴하여 생태계를 교란시킨다.","유령 도로는 아시아 태평양 지역에서만 발견된다.","유령 도로는 대부분의 지도에 공식적으로 기록되어 있다."],"opts":["Ghost roads help forests support more wildlife.","Ghost roads disrupt ecosystems by destroying habitats.","Ghost roads are found only in the Asia-Pacific region.","Ghost roads are officially recorded on most maps."],"r":{"a":"2) Ghost roads disrupt ecosystems by destroying habitats.","ev":"12번 문장","s":[[12,"They disrupt entire ecosystems by destroying habitats and making it harder for forests to support wildlife.","그것들은 서식지를 파괴하고 숲이 야생동물을 살게 하기 더 어렵게 만듦으로써 전체 생태계를 교란시킨다."]],"w":"12번 문장에서 서식지를 파괴함으로써 전체 생태계를 교란시킨다고 함. 나머지는 12번(야생동물이 살기 더 어려워짐), 10번(다른 지역에서도 발견), 9번(지도에 나타나지 않음)과 반대.","c":2},"h":"9381b9434b"},{"n":9,"t":"sum","q":"If ghost roads keep spreading, they may weaken forests' (A) to regulate the climate, and the damage may become (B).","ko":"유령 도로가 계속 퍼지면, 기후를 조절하는 숲의 (A)을(를) 약화시킬 수 있고 그 피해는 (B)이(가) 될 수 있다.","oko":["(A) 능력 / (B) 되돌릴 수 있는","(A) 경향 / (B) 되돌릴 수 없는","(A) 능력 / (B) 일시적인","(A) 필요 / (B) 되돌릴 수 있는","(A) 능력 / (B) 되돌릴 수 없는"],"opts":["(A) ability / (B) reversible","(A) tendency / (B) irreversible","(A) ability / (B) temporary","(A) need / (B) reversible","(A) ability / (B) irreversible"],"r":{"a":"5) (A) ability / (B) irreversible","ev":"13~14번 문장","s":[[13,"Furthermore, they weaken forests’ ability to regulate the climate.","게다가, 그것들은 기후를 조절하는 숲의 능력을 약화시킨다."],[14,"If ghost roads continue to spread, the damage to rainforests — and to the planet — may become irreversible.","만약 유령 도로가 계속 퍼져나간다면, 열대우림과 지구에 대한 피해는 되돌릴 수 없게 될지도 모른다."]],"w":"13번에서 기후를 조절하는 숲의 능력(ability)을 약화시키고, 14번에서 피해가 되돌릴 수 없게(irreversible) 될지도 모른다고 함.","c":5},"h":"992ea9fc19"},{"n":10,"t":"fill","q":"Recently, researchers and volunteers in Australia used [A] images to map these hidden roads in [B] forests across Borneo, Sumatra, and New Guinea.","ko":"최근, 호주의 연구원들과 자원봉사자들은 [A] 이미지를 사용해 보르네오, 수마트라, 그리고 뉴기니 전역의 [B] 숲에 있는 이 숨겨진 도로들의 지도를 만들었다.","bank":["satellite","tropical","officially","illegally","increasingly","strongly"],"bko":{"satellite":"위성","tropical":"열대의","officially":"공식적으로","illegally":"불법적으로","increasingly":"점점 더","strongly":"강하게"},"r":{"a":"[A] satellite (위성), [B] tropical (열대의)","ev":"6번 문장","s":[[6,"Recently, researchers and volunteers in Australia used satellite images to map these hidden roads in tropical forests across Borneo, Sumatra, and New Guinea.","최근, 호주의 연구원들과 자원봉사자들은 위성 이미지를 사용해 보르네오, 수마트라, 그리고 뉴기니 전역의 열대우림에 있는 이 숨겨진 도로들의 지도를 만들었다."]],"w":"6번 used satellite images to map these hidden roads, 8번 more than what is officially recorded에서 가져옴. ecosystems, habitats, forests는 명사라 '~하기 위해 ○○했다'의 동사 자리나 recorded 앞 부사 자리에 안 들어가고, irreversible은 형용사.","c":null},"h":"e0e0bbc730"}]},{"u":5,"id":"rg6-05-3","no":3,"ko":"위태롭게 서 있는 바위가 하는 일","items":[{"n":1,"t":"tf","q":"Precariously balanced rocks can be found in many places around the world.","ko":"위태롭게 균형을 이룬 바위들은 전 세계 여러 곳에서 발견될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Precariously balanced rocks (PBRs) are amazing natural formations that are found in many places around the world.","위태롭게 균형을 이룬 바위들(PBR)은 전 세계 여러 곳에서 발견되는 놀라운 자연 형성물이다."]],"w":"1번 문장에서 PBR은 전 세계 많은 곳에서 발견되는 자연 형성물이라고 함. 본문과 같은 내용.","c":"T"},"h":"67c849214b"},{"n":2,"t":"tf","q":"Omak Rock rests on a wide and strong foundation.","ko":"Omak Rock은 넓고 튼튼한 기반 위에 놓여 있다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Another is Omak Rock in Washington State, which rests delicately on a thin foundation.","또 다른 예는 워싱턴주의 Omak Rock인데, 이것은 얇은 기반 위에 섬세하게 놓여 있다."]],"w":"4번 문장에서 Omak Rock은 얇은 기반(a thin foundation) 위에 섬세하게 놓여 있다고 함. 넓고 튼튼하다는 말은 반대.","c":"F"},"h":"b6db58bd50"},{"n":3,"t":"tf","q":"By analyzing how long the rocks have stayed in place, scientists can learn about the region's earthquake history.","ko":"바위들이 얼마나 오래 제자리에 있었는지 분석함으로써, 과학자들은 그 지역의 지진 역사를 알 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"By analyzing how long these rocks have remained in place without falling, scientists can learn about the region’s earthquake history.","이 바위들이 쓰러지지 않고 얼마나 오랫동안 제자리를 지켜 왔는지 분석함으로써, 과학자들은 그 지역의 지진 역사에 대해 알 수 있다."]],"w":"9번 문장에서 쓰러지지 않고 제자리를 지킨 기간을 분석하면 지역의 지진 역사를 알 수 있다고 함. 본문과 같은 내용.","c":"T"},"h":"f8087aa8a4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… which rests delicately on a thin foundation.)","ko":"… 그것은 얇은 기반 위에 ( ) 놓여 있다.","opts":["거칠게","무겁게","섬세하게","빠르게"],"word":"delicately","r":{"a":"3) 섬세하게","ev":"4번 문장","s":[[4,"Another is Omak Rock in Washington State, which rests delicately on a thin foundation.","또 다른 예는 워싱턴주의 Omak Rock인데, 이것은 얇은 기반 위에 섬세하게 놓여 있다."]],"w":"4번은 얇은 기반 위에 겨우 균형을 잡고 있는 Omak Rock. 얇은 기반 위이니 조심스럽고 섬세하게 놓여 있다는 뜻이라 delicately = 섬세하게. 거칠게, 무겁게는 어울리지 않음.","c":3},"h":"d4bae67b1c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… glaciers, which carried massive rocks and left them in odd positions …)","ko":"… 빙하는 ( ) 바위들을 옮겼고 그것들을 이상한 위치에 남겨 두었다.","opts":["거대한","작은","얇은","부드러운"],"word":"massive","r":{"a":"1) 거대한","ev":"6번 문장","s":[[6,"Some may have been formed by glaciers, which carried massive rocks and left them in odd positions as the ice melted.","일부는 빙하에 의해 형성되었을 수도 있는데, 그 빙하는 거대한 바위들을 옮겼고 얼음이 녹으면서 그것들을 이상한 위치에 남겨 두었다."]],"w":"6번에서 빙하가 바위를 옮겨 이상한 위치에 남겼다고 함. 빙하가 옮길 만큼 크고 무거운 바위이므로 massive = 거대한.","c":1},"h":"b66fa50e77"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nPBRs are interesting to look at, but they are also valuable for assessing ground stability.","ko":"밑줄 친 they가 가리키는 것은?","sko":"PBR은 보기에 흥미롭지만, 지반 안정성을 평가하는 데에도 가치가 있다.","opts":["PBR(위태롭게 균형을 이룬 바위들)","과학자들","지반","빙하들"],"r":{"a":"1) PBR(위태롭게 균형을 이룬 바위들)","ev":"8번 문장","s":[[8,"PBRs are interesting to look at, but they are also valuable for assessing ground stability.","PBR은 보기에 흥미롭지만, 지반 안정성을 평가하는 데에도 가치가 있다."]],"w":"빙하가 carried massive rocks(거대한 바위들을 옮겼다)하고 left them in odd positions(그것들을 이상한 위치에 남겼다). 남겨진 것은 빙하가 옮긴 바위들.","c":1,"k":"they = PBR(위태롭게 균형을 이룬 바위들)"},"pron":"they","h":"bb48ed5e8e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These rocks are balanced in strange, or seemingly impossible positions.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 바위들은 이상하거나 겉보기에 불가능해 보이는 위치에서 균형을 이루고 있다.","opts":["이 바위들은 평평한 땅 위에 안정적으로 놓여 있다.","이 바위들은 위치가 이상해서 곧 균형을 잃고 쓰러진다.","이 바위들은 사람들이 일부러 균형을 맞춰 쌓아 놓은 것이다.","이 바위들은 이상하거나 불가능해 보이는 자리에서도 균형을 잡고 있다."],"r":{"a":"4) 이 바위들은 이상하거나 불가능해 보이는 자리에서도 균형을 잡고 있다.","ev":"2번 문장","s":[[2,"These rocks are balanced in strange, or seemingly impossible positions.","이 바위들은 이상하거나 겉보기에 불가능해 보이는 위치에서 균형을 이루고 있다."]],"w":"seemingly impossible은 '겉보기에는 불가능해 보이는'. 그런 자리에서도 균형을 이룬 것이 PBR. 평평한 땅이라거나 사람이 쌓았다는 말은 없고, 쓰러진다는 말도 없음.","c":4},"h":"5a4b06dc68"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["PBR은 몇 년 안에 빠르게 형성된다.","모든 PBR은 빙하에 의해 만들어졌다.","일부 PBR은 바람과 물이 바위의 밑부분을 깎아서 만들어졌을 수도 있다.","Bubble Rock은 평평한 들판 한가운데에 있다."],"opts":["PBRs are formed quickly within a few years.","All PBRs were shaped by glaciers.","Some PBRs may have been shaped as wind and water wore away the bottom of the rock.","Bubble Rock sits in the middle of a flat field."],"r":{"a":"3) Some PBRs may have been shaped as wind and water wore away the bottom of the rock.","ev":"7번 문장","s":[[7,"Others may have been shaped as wind and water slowly wore away the bottom of the rock until only a narrow base remained.","다른 것들은 바람과 물이 바위의 밑부분을 서서히 닳게 하여 좁은 기반만 남을 때까지 형성되었을 수도 있다."]],"w":"7번 문장에서 바람과 물이 바위의 밑부분을 서서히 깎아 좁은 기반만 남았을 수도 있다고 함. 나머지는 5번(수천 년), 6~7번(일부는 빙하, 다른 것은 바람과 물), 3번(절벽 가장자리)과 반대.","c":3},"h":"b377d238d4"},{"n":9,"t":"sum","q":"This data is used to create more (A) earthquake hazard maps. It can also guide decisions about where to build (B) structures, such as power plants and dams, in the most stable locations.","ko":"이 자료는 더 (A) 지진 위험 지도를 만드는 데 사용된다. 그것은 또한 발전소나 댐과 같은 (B) 시설을 가장 안정적인 위치 중 어디에 건설해야 할지에 대한 결정에도 도움을 줄 수 있다.","oko":["(A) 정확한 / (B) 중요한","(A) 정확한 / (B) 장식용","(A) 대략적인 / (B) 중요한","(A) 대략적인 / (B) 장식용","(A) 값싼 / (B) 고대의"],"opts":["(A) accurate / (B) critical","(A) accurate / (B) decorative","(A) rough / (B) critical","(A) rough / (B) decorative","(A) cheap / (B) ancient"],"r":{"a":"1) (A) accurate / (B) critical ((A) 정확한 / (B) 중요한)","ev":"10~11번 문장","s":[[10,"This data is used to create more accurate earthquake hazard maps.","이 자료는 더 정확한 지진 위험 지도를 만드는 데 사용된다."],[11,"It can also guide decisions about where to build critical structures, such as power plants and dams, in the most stable locations.","그것은 또한 발전소나 댐과 같은 중요한 시설을 가장 안정적인 위치 중 어디에 건설해야 할지에 대한 결정에도 도움을 줄 수 있다."]],"w":"10번에서 더 정확한 earthquake hazard maps를 만들고, 11번에서 발전소·댐 같은 critical structures를 가장 안정적인 곳에 짓는 결정에 도움이 된다고 함.","c":1},"h":"b716735f4d"},{"n":10,"t":"fill","q":"For example, Bubble Rock in Maine, U.S., sits right near the [A] of a [B].","ko":"예를 들어, 미국 메인주의 Bubble Rock은 한 [B]의 [A] 바로 옆에 놓여 있다.","bank":["edge","cliff","stability","legends","dams","glaciers"],"bko":{"edge":"가장자리","cliff":"절벽","stability":"안정성","legends":"전설","dams":"댐","glaciers":"빙하"},"r":{"a":"[A] edge (가장자리), [B] cliff (절벽)","ev":"3번 문장","s":[[3,"For example, Bubble Rock in Maine, U.S., sits right near the edge of a cliff.","예를 들어, 미국 메인주의 Bubble Rock은 절벽 가장자리 바로 옆에 놓여 있다."]],"w":"6번 formed by glaciers, 7번 wore away the bottom of the rock에서 가져옴. stability, legends, dams는 바위를 옮기거나 깎는 것이 아니고, cliff(절벽)는 3번에서 Bubble Rock이 놓인 곳일 뿐 '바위의 ○○'으로 깎이는 부분이 아님.","c":null},"h":"24abee1060"}]},{"u":6,"id":"rg6-06-1","no":1,"ko":"10만 장의 반 고흐를 그린 화가","items":[{"n":1,"t":"tf","q":"Zhao Xiaoyong produced over 100,000 copies of Van Gogh's paintings.","ko":"Zhao Xiaoyong은 반 고흐의 그림을 10만 장 이상 복제했다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Zhao was among the most skilled, producing over 100,000 copies of Van Gogh’s paintings.","Zhao는 가장 숙련된 사람 중 한 명으로, 반 고흐의 그림을 10만 장 이상 만들어냈다."]],"w":"3번 문장에서 Zhao는 가장 숙련된 사람 중 하나로 반 고흐 그림을 10만 장 넘게 만들었다고 함. 본문과 같은 내용.","c":"T"},"h":"711ff6f586"},{"n":2,"t":"tf","q":"Zhao felt that nothing was missing in his work as a copy artist.","ko":"Zhao는 복제 예술가로서의 일에 빠진 것이 없다고 느꼈다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"His talent brought him steady work, but as the years passed, Zhao felt something important was missing.","그의 재능은 그에게 꾸준한 일을 가져다주었지만, 세월이 흐르면서 Zhao는 중요한 무언가가 빠져 있다고 느꼈다."]],"w":"4번 문장에서 Zhao는 중요한 무언가가 빠져 있다고(something important was missing) 느꼈다고 함. 빠진 것이 없다는 말은 반대.","c":"F"},"h":"efc30c7d5c"},{"n":3,"t":"tf","q":"Zhao's works began to draw attention from collectors and galleries.","ko":"Zhao의 작품들은 수집가들과 갤러리의 주목을 끌기 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"His works soon began to draw attention from collectors and galleries.","그의 작품들은 곧 수집가들과 갤러리의 주목을 끌기 시작했다."]],"w":"11번 문장에서 그의 작품들이 곧 수집가들과 갤러리의 주목을 끌기 시작했다고 함. 본문과 같은 내용.","c":"T"},"h":"82c250d244"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This village is well-known for its artists who replicate masterpieces.)","ko":"이 마을은 명화를 ( ) 예술가들로 잘 알려져 있다.","opts":["감상하다","수집하다","복제하다","판매하다"],"word":"replicate","r":{"a":"3) 복제하다","ev":"1~2번 문장","s":[[1,"For 20 years, Zhao Xiaoyong worked as a copy artist in Dafen Village, China.","20년 동안, Zhao Xiaoyong은 중국 Dafen 마을에서 복제 예술가로 일했다."],[2,"This village is well-known for its artists who replicate masterpieces.","이 마을은 명화를 복제하는 예술가들로 잘 알려져 있다."]],"w":"1번에서 Zhao는 이 마을에서 복제 예술가(copy artist)로 일했고, 2번은 그 마을 예술가들의 이야기. 7번에서도 같은 동사 replicate가 '복제하다'로 쓰임.","c":3},"h":"8bce3dc52a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The dynamic colors, energy, and the raw emotion of the originals overwhelmed him.)","ko":"원화의 역동적인 색채와 에너지, 그리고 원초적인 감정이 그를 ( ).","opts":["실망시켰다","압도했다","지루하게 했다","웃게 했다"],"word":"overwhelmed","r":{"a":"2) 압도했다","ev":"6번 문장","s":[[6,"The dynamic colors, energy, and the raw emotion of the originals overwhelmed him.","원화의 역동적인 색채와 에너지, 그리고 원초적인 감정이 그를 압도했다."]],"w":"6번은 Zhao가 원화를 처음 본 전환점(5번). 역동적인 색과 감정에 큰 충격을 받은 것이고 7번에서 깨달음으로 이어지므로 '압도했다'. 지루하거나 실망했다면 깨달음으로 이어지지 않음.","c":2},"h":"a82f7ad4f0"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nIn that moment, Zhao realized that he could never truly replicate the passion and spirit of Van Gogh’s work.","ko":"밑줄 친 he가 가리키는 것은?","sko":"그 순간, Zhao는 그가 반 고흐 작품에 담긴 열정과 정신을 결코 진정으로 복제할 수 없다는 것을 깨달았다.","opts":["Zhao","반 고흐","Dafen 마을의 복제 예술가들","Dafen 마을의 수집가"],"r":{"a":"1) Zhao","ev":"7번 문장","s":[[7,"In that moment, Zhao realized that he could never truly replicate the passion and spirit of Van Gogh’s work.","그 순간, Zhao는 자신이 반 고흐 작품에 담긴 열정과 정신을 결코 진정으로 복제할 수 없다는 것을 깨달았다."]],"w":"5번에서 Zhao가 암스테르담에서 Van Gogh's original paintings를 처음 보았다고 함. 6번의 the originals는 그 반 고흐의 원화들.","c":1,"k":"he = Zhao"},"pron":"he","h":"2c5f69fb4d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When Zhao returned to Dafen, he made a bold decision: no longer would he paint as Van Gogh, but as Zhao Xiaoyong.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Zhao가 Dafen으로 돌아왔을 때, 그는 대담한 결정을 내렸다. 더 이상 반 고흐로서 그리지 않고, Zhao Xiaoyong으로서 그리기로 한 것이다.","opts":["Zhao는 Dafen으로 돌아온 뒤, 더 이상 반 고흐처럼 그리지 않고 Zhao Xiaoyong으로서 그리기로 결심했다.","Zhao는 Dafen으로 돌아온 뒤, 반 고흐처럼 더 잘 그리기로 결심했다.","Zhao는 Dafen으로 돌아가지 않고 다른 나라에서 살기로 했다.","Zhao는 Dafen으로 돌아온 뒤, 반 고흐가 아닌 다른 화가를 복제하기로 했다."],"r":{"a":"1) Zhao는 Dafen으로 돌아온 뒤, 더 이상 반 고흐처럼 그리지 않고 Zhao Xiaoyong으로서 그리기로 결심했다.","ev":"8번 문장","s":[[8,"When Zhao returned to Dafen, he made a bold decision: no longer would he paint as Van Gogh, but as Zhao Xiaoyong.","Zhao가 Dafen으로 돌아왔을 때, 그는 대담한 결정을 내렸다. 더 이상 반 고흐로서 그리지 않고, Zhao Xiaoyong으로서 그리기로 한 것이다."]],"w":"no longer would he paint as ~ but as ~ = 더 이상 ~로서가 아니라 ~로서 그리겠다는 뜻. 반 고흐처럼 그리는 것을 그만두고 자기 자신으로 그리겠다는 결심. 다른 화가를 복제한다는 말은 없음.","c":1},"h":"73c3b0aada"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["Zhao는 자신이 반 고흐의 열정을 복제할 수 있다고 자신했다.","Zhao는 Dafen으로 돌아와서도 반 고흐의 복제품만 그렸다.","독창적인 작품을 그릴수록 Zhao의 공허함은 더 커졌다.","Zhao는 점차 복제가에서 진정한 예술가로 변화했다."],"opts":["Zhao felt confident that he could copy the passion of Van Gogh.","Zhao returned to Dafen and kept painting only copies of Van Gogh.","Zhao's emptiness grew stronger as he painted original works.","Zhao gradually changed from a copyist into a true artist."],"r":{"a":"4) Zhao gradually changed from a copyist into a true artist.","ev":"12번 문장","s":[[12,"Zhao gradually transformed from a copyist into a true artist.","Zhao는 점차 복제가에서 진정한 예술가로 변화했다."]],"w":"12번 문장에서 Zhao가 점차 복제가에서 진정한 예술가로 변화했다고 함. 나머지는 7번(복제할 수 없다고 깨달음), 8~9번(독창적 작품), 10번(공허함이 사라짐)과 반대.","c":4},"h":"31afaef328"},{"n":9,"t":"sum","q":"The (A) point came when Zhao traveled to (B) and saw Van Gogh’s original paintings for the first time.","ko":"(A)점은 Zhao가 (B)(으)로 여행을 가서 반 고흐의 원화를 처음 보았을 때 찾아왔다.","oko":["(A) 전환 / (B) 암스테르담","(A) 시작 / (B) 암스테르담","(A) 전환 / (B) 파리","(A) 시작 / (B) 파리","(A) 종료 / (B) 서울"],"opts":["(A) turning / (B) Amsterdam","(A) starting / (B) Amsterdam","(A) turning / (B) Paris","(A) starting / (B) Paris","(A) ending / (B) Seoul"],"r":{"a":"1) (A) turning / (B) Amsterdam ((A) 전환 / (B) 암스테르담)","ev":"5번 문장","s":[[5,"The turning point came when Zhao traveled to Amsterdam and saw Van Gogh’s original paintings for the first time.","전환점은 Zhao가 암스테르담으로 여행을 가서 반 고흐의 원화를 처음 보았을 때 찾아왔다."]],"w":"9번에서 독창적인(original) 작품을 만들기 시작했고, 10번에서 한때 느꼈던 공허함(emptiness)이 서서히 사라졌다고 함. 복제한 작품이 아니고 사라진 것은 자부심이나 분노가 아님.","c":1},"h":"53e28f22ff"},{"n":10,"t":"fill","q":"True art begins with finding your own [A], and it is never too [B] to start your own artistic journey.","ko":"진정한 예술은 자신만의 [A]을(를) 찾는 것에서 시작되며, 자신만의 예술적 여정을 시작하기에 결코 너무 [B] 때는 없다.","bank":["voice","late","gallery","replicate","village","collector"],"bko":{"voice":"목소리","late":"늦은","gallery":"갤러리","replicate":"복제하다","village":"마을","collector":"수집가"},"r":{"a":"[A] voice (목소리), [B] late (늦은)","ev":"13~14번 문장","s":[[13,"The message in Zhao’s story is clear: true art begins with finding your own voice.","Zhao의 이야기가 전하는 메시지는 분명하다. 진정한 예술은 자신만의 목소리를 찾는 것에서 시작된다."],[14,"And just as important, it’s never too late to start your own artistic journey.","그리고 마찬가지로 중요한 것은, 자신만의 예술적 여정을 시작하는 데에는 결코 너무 늦은 때가 없다는 것이다."]],"w":"13번 true art begins with finding your own voice, 14번 it's never too late to start your own artistic journey에서 가져옴. emptiness, village, collector는 '찾는 것'의 대상이나 '너무 ~한' 자리에 어울리지 않고, replicate는 동사라 never too 뒤에 안 맞음.","c":null},"h":"a4b9c2a071"}]},{"u":6,"id":"rg6-06-2","no":2,"ko":"'카마 무타'의 감정을 느껴보았나요?","items":[{"n":1,"t":"tf","q":"Kama muta is an ancient Sanskrit phrase meaning 'moved by love.'","ko":"카마 무타는 '사랑에 감동받은'이라는 뜻의 고대 산스크리트어 표현이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This ancient Sanskrit phrase, meaning ‘moved by love,’ describes the emotions we feel in such heartwarming moments.","'사랑에 감동받은'이라는 뜻의 이 고대 산스크리트어 표현은 그런 가슴 따뜻한 순간에 우리가 느끼는 감정을 묘사한다."]],"w":"3번 문장에서 이 고대 산스크리트어 표현이 '사랑에 감동받은'이라는 뜻이라고 함. 본문과 같은 내용.","c":"T"},"h":"e4bc0ac318"},{"n":2,"t":"tf","q":"In the passage, feeling 'moved' by the beauty of nature is given as an example of kama muta.","ko":"이 글에서 자연의 아름다움에 '감동받는' 것은 카마 무타의 예로 제시된다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"To put it in perspective, you might feel ‘moved’ by the beauty of nature or an inspiring piece of music.","쉽게 설명하자면, 당신은 자연의 아름다움이나 영감을 주는 음악에 '감동받을' 수 있다."]],"w":"6번 문장에서 자연의 아름다움이나 음악에 '감동받는' 것은 일반적인 'moved'의 예. 카마 무타의 예는 사람 사이의 유대 순간(7번)이라 이 진술은 틀림.","c":"F"},"h":"3c082f04d2"},{"n":3,"t":"tf","q":"Kama muta reminds us that we are part of something bigger, like a family or a community.","ko":"카마 무타는 우리가 가족이나 공동체처럼 더 큰 무언가의 일부라는 것을 일깨워 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"It’s a feeling of genuine love, kindness, and belonging that reminds us that we’re part of something bigger — like a family, a community, or even the world around us.","그것은 우리가 가족, 공동체, 나아가 우리를 둘러싼 세상과 같이 더 큰 무언가의 일부라는 것을 일깨워 주는 진실한 사랑과 친절, 그리고 소속감의 감정이다."]],"w":"8번 문장에서 카마 무타는 우리가 가족, 공동체 등 더 큰 무언가의 일부라는 것을 일깨워 주는 감정이라고 함. 본문과 같은 내용.","c":"T"},"h":"f5e2ab67ea"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… while witnessing an act of love or devotion …)","ko":"… 사랑이나 ( )의 행동을 목격하는 동안 …","opts":["분노","실수","헌신","경쟁"],"word":"devotion","r":{"a":"3) 헌신","ev":"1번 문장","s":[[1,"Have you ever felt goosebumps or a warmth in your chest while witnessing an act of love or devotion — like a superhero sacrificing himself or a soldier reuniting with his family?","당신은 슈퍼히어로가 자신을 희생하는 순간이나 군인이 가족과 재회하는 순간처럼, 사랑이나 헌신의 행동을 목격하는 동안 닭살이 돋거나 가슴이 따뜻해지는 것을 느낀 적이 있는가?"]],"w":"1번에서 love or devotion의 예가 슈퍼히어로의 희생, 군인의 가족 재회. 남을 위해 자신을 바치는 마음이므로 devotion = 헌신. 분노, 경쟁은 따뜻한 감정과 반대.","c":3},"h":"c3b74a504f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… moments of human connection or compassion …)","ko":"… 인간적 유대나 ( )의 순간 …","opts":["경쟁","동정심(공감)","피로","비판"],"word":"compassion","r":{"a":"2) 동정심(공감)","ev":"7번 문장","s":[[7,"Kama muta, however, is more likely to appear in moments of human connection or compassion — like witnessing someone helping a stranger or sharing their last bit of food.","그러나 카마 무타는 누군가가 낯선 사람을 돕거나 자신의 마지막 남은 음식을 나누는 것을 목격하는 것과 같은, 인간적 유대나 공감의 순간에 나타날 가능성이 더 높다."]],"w":"7번에서 compassion의 예는 낯선 사람을 돕거나 마지막 음식을 나누는 것을 보는 순간. 남의 어려움에 마음을 쓰는 것이므로 '동정심, 공감'. 경쟁, 비판은 반대 방향.","c":2},"h":"14c81b8b91"},{"n":6,"t":"ref","q":"What does the underlined \"himself\" refer to?\nHave you ever felt goosebumps or a warmth in your chest while witnessing an act of love or devotion — like a superhero sacrificing himself or a soldier reuniting with his family?","ko":"밑줄 친 himself이 가리키는 것은?","sko":"당신은 슈퍼히어로가 자신을 희생하는 순간이나 군인이 가족과 재회하는 순간처럼, 사랑이나 헌신의 행동을 목격하는 동안 닭살이 돋거나 가슴이 따뜻해지는 것을 느낀 적이 있는가?","opts":["슈퍼히어로","군인","당신","가족"],"r":{"a":"1) 슈퍼히어로","ev":"1번 문장","s":[[1,"Have you ever felt goosebumps or a warmth in your chest while witnessing an act of love or devotion — like a superhero sacrificing himself or a soldier reuniting with his family?","당신은 슈퍼히어로가 자신을 희생하는 순간이나 군인이 가족과 재회하는 순간처럼, 사랑이나 헌신의 행동을 목격하는 동안 닭살이 돋거나 가슴이 따뜻해지는 것을 느낀 적이 있는가?"]],"w":"7번이 Kama muta에 대한 문장이고, 8번 It은 그 카마 무타. 8번은 카마 무타가 어떤 감정인지 정리해 주는 마지막 문장.","c":1,"k":"himself = 슈퍼히어로"},"pron":"himself","h":"99338b46e7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That powerful feeling has a name you might not know: kama muta.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 강렬한 감정에는 당신이 모를 수도 있는 이름이 있는데, 바로 '카마 무타'이다.","opts":["그 강렬한 감정에는 당신이 모를 수도 있는 이름이 있는데, 바로 카마 무타이다.","그 강렬한 감정에는 이름이 없어서 아무도 부르지 못한다.","당신이 이미 알고 있는 이름이 그 강렬한 감정에 붙어 있다.","카마 무타라는 이름의 사람이 그 강렬한 감정을 처음 느꼈다."],"r":{"a":"1) 그 강렬한 감정에는 당신이 모를 수도 있는 이름이 있는데, 바로 카마 무타이다.","ev":"2번 문장","s":[[2,"That powerful feeling has a name you might not know: kama muta.","그 강렬한 감정에는 당신이 모를 수도 있는 이름이 있는데, 바로 '카마 무타'이다."]],"w":"Although는 '비록 ~이지만': 공통점(감동적인 경험에서 생김) 뒤에 차이점(관계와 연대감)이 온다. 두 감정이 같다거나 감동적 경험과 무관하다는 말은 틀림.","c":1},"h":"9d3888224a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["카마 무타는 과학자들이 만든 현대 영어 단어이다.","카마 무타는 주로 자신의 성공에 자부심을 느낄 때 나타난다.","카마 무타는 누군가가 낯선 사람을 돕는 것을 목격할 때 나타나기 쉽다.","'감동받은' 감정과 카마 무타는 모든 면에서 똑같다."],"opts":["Kama muta is a modern English word created by scientists.","Kama muta mostly appears when we feel proud of our own success.","Kama muta is more likely to appear when we witness someone helping a stranger.","Feeling 'moved' and kama muta are the same in every way."],"r":{"a":"3) Kama muta is more likely to appear when we witness someone helping a stranger.","ev":"7번 문장","s":[[7,"Kama muta, however, is more likely to appear in moments of human connection or compassion — like witnessing someone helping a stranger or sharing their last bit of food.","그러나 카마 무타는 누군가가 낯선 사람을 돕거나 자신의 마지막 남은 음식을 나누는 것을 목격하는 것과 같은, 인간적 유대나 공감의 순간에 나타날 가능성이 더 높다."]],"w":"7번 문장에서 카마 무타는 누군가가 낯선 사람을 돕는 것을 목격하는 것 같은 유대의 순간에 나타나기 쉽다고 함. 나머지는 3번(고대 산스크리트어), 7번(인간적 유대), 4~5번(감동받은 것과 다름)과 반대.","c":3},"h":"25d4c099ce"},{"n":9,"t":"sum","q":"Kama muta is (A) because it is all about connection and (B).","ko":"카마 무타는 관계와 (B)에 관한 것이기 때문에 (A).","oko":["(A) 특별하다 / (B) 연대감","(A) 흔하다 / (B) 연대감","(A) 특별하다 / (B) 경쟁","(A) 흔하다 / (B) 경쟁","(A) 불분명하다 / (B) 외로움"],"opts":["(A) unique / (B) togetherness","(A) common / (B) togetherness","(A) unique / (B) competition","(A) common / (B) competition","(A) unclear / (B) loneliness"],"r":{"a":"1) (A) unique / (B) togetherness ((A) 특별하다 / (B) 연대감)","ev":"5번 문장","s":[[5,"Although both emotions arise from touching experiences, kama muta is unique because it’s all about connection and togetherness.","두 감정 모두 감동적인 경험에서 생기지만, 카마 무타는 전적으로 관계와 연대감에 관한 것이라는 점에서 특별하다."]],"w":"8번에서 카마 무타는 진실한 사랑, 친절, 소속감(love, kindness, belonging)의 감정이고, 7번에서 인간적 유대(human connection)의 순간에 나타난다고 함.","c":1},"h":"a2e99ee27f"},{"n":10,"t":"fill","q":"This ancient Sanskrit phrase, meaning ‘moved by love,’ describes the [A] we feel in such [B] moments.","ko":"‘사랑에 감동받은’이라는 뜻의 이 고대 산스크리트어 표현은 그런 [B] 순간에 우리가 느끼는 [A]을(를) 묘사한다.","bank":["emotions","heartwarming","stranger","reunite","witness","share"],"bko":{"emotions":"감정","heartwarming":"가슴 따뜻한","stranger":"낯선 사람","reunite":"재회하다","witness":"목격하다","share":"나누다"},"r":{"a":"[A] emotions (감정), [B] heartwarming (가슴 따뜻한)","ev":"3번 문장","s":[[3,"This ancient Sanskrit phrase, meaning ‘moved by love,’ describes the emotions we feel in such heartwarming moments.","'사랑에 감동받은'이라는 뜻의 이 고대 산스크리트어 표현은 그런 가슴 따뜻한 순간에 우리가 느끼는 감정을 묘사한다."]],"w":"3번 This ancient Sanskrit phrase, meaning 'moved by love,' describes the emotions we feel in such heartwarming moments에서 가져옴. stranger와 food는 7번의 예시에 나오는 명사라 '산스크리트어 표현'을 꾸미지도, '우리가 느끼는 것'도 아니고, reunite와 witness는 1번에 나오는 동사라 두 자리에 들어갈 수 없음.","c":null},"h":"08ee34f3c8"}]},{"u":6,"id":"rg6-06-3","no":3,"ko":"공짜로 살게 해드립니다","items":[{"n":1,"t":"tf","q":"The Zero Yen Vacant Home Bank offers empty homes to new residents at no cost.","ko":"Zero Yen Vacant Home Bank는 새 거주자들에게 빈집을 무료로 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"This program offers empty homes to new residents at no cost.","이 프로그램은 새 거주자들에게 빈집을 무상으로 제공한다."]],"w":"2번 문장에서 이 프로그램이 새 거주자들에게 빈집을 무료로(at no cost) 제공한다고 함. 본문과 같은 내용.","c":"T"},"h":"4d0e6f7c48"},{"n":2,"t":"tf","q":"In Kamiichi, younger residents stayed while older residents moved away.","ko":"Kamiichi에서는 젊은 주민들은 남고 나이 든 주민들이 떠났다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Like many rural areas in Japan, it has faced population decline as younger residents move away, whereas older ones remain.","일본의 많은 농촌 지역들처럼, 이 마을도 젊은 주민들은 떠나는 반면 나이 든 주민들은 남아 있으면서 인구 감소를 겪어 왔다."]],"w":"5번 문장에서 젊은 주민들이 떠나고(move away) 나이 든 주민들이 남는다(remain)고 함. 반대로 말한 진술.","c":"F"},"h":"ec1b95fc78"},{"n":3,"t":"tf","q":"The program drew strong interest, even from overseas.","ko":"그 프로그램은 심지어 해외로부터도 큰 관심을 끌었다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"The program drew strong interest, even from overseas, and the homes were quickly taken.","그 프로그램은 심지어 해외로부터도 큰 관심을 끌었고, 집들은 빠르게 차지되었다."]],"w":"8번 문장에서 큰 관심을 끌었고 해외로부터도 그랬다고 함. 본문과 같은 내용.","c":"T"},"h":"266f5566a3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… to solve the problem of declining populations in small towns …)","ko":"… 소도시의 ( ) 인구 문제를 해결하기 위해 …","opts":["증가하는","안정된","감소하는","다양한"],"word":"declining","r":{"a":"3) 감소하는","ev":"1번 문장","s":[[1,"Japan has come up with a creative idea to solve the problem of declining populations in small towns: the Zero Yen Vacant Home Bank.","일본은 소도시의 인구 감소 문제를 해결하기 위해 창의적인 아이디어를 생각해 냈는데, 바로 Zero Yen Vacant Home Bank(빈집 무상 제공 제도)이다."]],"w":"1번은 소도시의 인구 문제. 5번에서 젊은 사람들이 떠나 인구 감소를 겪었다고 이어지므로 declining = 감소하는. 증가하는은 반대 뜻.","c":3},"h":"83032f3c8c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… the town saw hope to reverse its population decline.)","ko":"… 그 마을은 인구 감소를 ( ) 희망을 보았다.","opts":["유지하다","반전시키다","숨기다","설명하다"],"word":"reverse","r":{"a":"2) 반전시키다","ev":"9번 문장","s":[[9,"For the first time in over a decade, the town saw hope to reverse its population decline.","10년이 넘는 기간 만에 처음으로, 그 마을은 인구 감소를 반전시킬 수 있는 희망을 보았다."]],"w":"9번은 줄기만 하던 인구에 희망이 생겼다는 문장. 줄어드는 흐름을 거꾸로 돌리는 것이므로 reverse = 반전시키다, 뒤집다. 유지한다면 희망이 될 수 없음.","c":2},"h":"e429d5729a"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIt’s a win for everyone involved: house owners can avoid taking care of and paying fees for houses they don’t need anymore, new residents get a free place to live, and towns can welcome fresh energy into their communities.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이것은 관련된 모든 사람에게 이득이다. 주택 소유자는 더 이상 필요하지 않은 집을 관리하거나 유지비를 내지 않아도 되고, 새 거주자는 거주할 집을 무료로 얻을 수 있으며, 마을은 지역사회에 새로운 활력을 맞이할 수 있다.","opts":["주택 소유자들","새 거주자들","마을 사람들","이웃 주민들"],"r":{"a":"1) 주택 소유자들","ev":"3번 문장","s":[[3,"It’s a win for everyone involved: house owners can avoid taking care of and paying fees for houses they don’t need anymore, new residents get a free place to live, and towns can welcome fresh energy into their communities.","이것은 관련된 모든 사람에게 이득이다. 주택 소유자는 더 이상 필요하지 않은 집을 관리하거나 유지비를 내지 않아도 되고, 새 거주자는 거주할 집을 무료로 얻을 수 있으며, 마을은 지역사회에 새로운 활력을 맞이할 수 있다."]],"w":"3번 문장에서 they는 houses they don’t need anymore 안에서 쓰였고, 그 집을 더 이상 필요로 하지 않는 사람은 앞에 나온 house owners(주택 소유자들)임. 집(houses)은 they가 아니라 앞의 목적어이므로 오답.","c":1,"k":"they = 주택 소유자들"},"pron":"they","h":"56c24cdef6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While the program alone may not provide a permanent solution to population decline, it is bringing attention and hope to struggling towns.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 프로그램만으로는 인구 감소에 대한 영구적인 해결책을 제공하지 못할 수도 있지만, 그것은 어려움을 겪고 있는 마을들에 관심과 희망을 가져다주고 있다.","opts":["이 프로그램은 인구 감소를 영구적으로 해결했고, 그래서 마을들이 주목받고 있다.","이 프로그램만으로 인구 감소가 완전히 해결되지는 않을 수 있지만, 어려운 마을들에 관심과 희망을 주고 있다.","이 프로그램은 인구 감소와 관계가 없으며 마을에 관심도 주지 못했다.","이 프로그램은 어려운 마을들을 포기하게 만들어 인구 감소를 더 키웠다."],"r":{"a":"2) 이 프로그램만으로 인구 감소가 완전히 해결되지는 않을 수 있지만, 어려운 마을들에 관심과 희망을 주고 있다.","ev":"10번 문장","s":[[10,"While the program alone may not provide a permanent solution to population decline, it is bringing attention and hope to struggling towns.","이 프로그램만으로는 인구 감소에 대한 영구적인 해결책을 제공하지 못할 수도 있지만, 그것은 어려움을 겪고 있는 마을들에 관심과 희망을 가져다주고 있다."]],"w":"While은 '~이긴 하지만'. 앞 절은 영구적인 해결책이 못 될 수도 있다는 한계, 뒤 절은 그래도 관심과 희망을 준다는 긍정. 해결했다거나 관계없다는 말은 틀림.","c":2},"h":"72da3edda9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 것은?","oko":["그 프로그램은 해외에서 온 사람들에게만 집을 제공했다.","Kamiichi는 일본 남부의 큰 도시이다.","Kamiichi의 집들은 오랫동안 빈 채로 남아 있었다.","Kamiichi는 이 프로그램이 어떻게 운영되는지를 보여 주는 좋은 사례이다."],"opts":["The program offered homes only to people from overseas.","Kamiichi is a large city in southern Japan.","The homes in Kamiichi stayed empty for a long time.","Kamiichi is a good example of how the program works."],"r":{"a":"4) Kamiichi is a good example of how the program works. (Kamiichi는 이 프로그램이 어떻게 운영되는지를 보여 주는 좋은 사례이다.)","ev":"4번 문장","s":[[4,"Kamiichi, a small town in central Japan, is a good example of how the program works.","일본 중부의 작은 마을인 Kamiichi는 이 프로그램이 어떻게 운영되는지를 보여 주는 좋은 사례이다."]],"w":"6번 문장에서 2023년에 이 프로그램을 통해 13채의 집을 제공했다고 함. 나머지는 8번(해외에서도 관심, 국내 포함), 7번(재정적 지원도 제공), 8번(집들이 빠르게 차지됨)과 반대.","c":4},"h":"58ddf4153e"},{"n":9,"t":"sum","q":"In (A), the town provided (B) homes through the Zero Yen Vacant Home Bank.","ko":"(A)년, 그 마을은 Zero Yen Vacant Home Bank를 통해 (B)채의 집을 제공했다.","oko":["(A) 2023 / (B) 13","(A) 2023 / (B) 30","(A) 2013 / (B) 13","(A) 2013 / (B) 30","(A) 2003 / (B) 3"],"opts":["(A) 2023 / (B) 13","(A) 2023 / (B) 30","(A) 2013 / (B) 13","(A) 2013 / (B) 30","(A) 2003 / (B) 3"],"r":{"a":"1) (A) 2023 / (B) 13 ((A) 2023 / (B) 13)","ev":"6번 문장","s":[[6,"In 2023, the town provided 13 homes through the Zero Yen Vacant Home Bank.","2023년, 그 마을은 Zero Yen Vacant Home Bank를 통해 13채의 집을 제공했다."]],"w":"2번에서 empty homes를 새 거주자에게 무료로 제공하고, 3번에서 집 주인은 필요 없는 집의 fees(요금, 비용)를 내지 않아도 된다고 함.","c":1},"h":"b4e4c5ad43"},{"n":10,"t":"fill","q":"Hopefully, more [A] ideas like this will [B] new life into these neighborhoods.","ko":"바라건대, 이와 같은 더 많은 [A] 아이디어가 이런 동네들에 새로운 생명을 [B].","bank":["innovative","breathe","remain","forget","hope","miss"],"bko":{"innovative":"혁신적인","breathe":"불어넣다","remain":"남아 있다","forget":"잊다","hope":"바라다","miss":"놓치다"},"r":{"a":"[A] innovative (혁신적인), [B] breathe (불어넣다)","ev":"11번 문장","s":[[11,"Hopefully, more innovative ideas like this will breathe new life into these neighborhoods.","바라건대, 이와 같은 더 많은 혁신적인 아이디어들이 이런 동네들에 새로운 생명을 불어넣을 것이다."]],"w":"11번 문장 more innovative ideas like this will breathe new life into these neighborhoods에서 가져옴. innovative는 ideas를 꾸며 주는 말, breathe는 will 뒤 동사. remain, forget, hope, miss는 뜻이나 문장 모양이 맞지 않음.","c":null},"h":"7c2c0f23e2"}]},{"u":7,"id":"rg6-07-1","no":1,"ko":"바느질하는 새가 있다고요?","items":[{"n":1,"t":"tf","q":"A tailorbird weighs about 6–10 grams.","ko":"재봉새의 무게는 약 6~10그램이다.","r":{"a":"T (본문과 맞는 내용)","s":[[3,"These tiny birds are about 10–14 cm long, weigh just 6–10 grams, and have bright green or grey feathers.","이 작은 새들은 길이가 약 10~14cm이고, 무게는 6~10그램에 불과하며, 밝은 초록색 또는 회색 깃털을 가지고 있다."]],"w":"3번 문장에 weigh just 6–10 grams(무게가 6~10그램에 불과하다)가 있음. 아주 가벼운 새라는 내용과 일치.","c":"T","ev":"3번 문장"},"h":"57deeca4b8"},{"n":2,"t":"tf","q":"The male tailorbird makes small holes in leaves with his beak.","ko":"수컷 재봉새는 부리로 잎에 작은 구멍을 낸다.","r":{"a":"F (본문과 다른 내용)","s":[[6,"Using her beak like a needle, she makes tiny holes along the edges.","자신의 부리를 바늘처럼 사용하여, 암컷은 잎의 가장자리를 따라 작은 구멍들을 낸다."],[8,"Meanwhile, the male gathers soft materials — such as grass, feathers, and animal hair — and lines the inner nest with them to help keep the eggs warm.","그러는 동안, 수컷은 풀, 깃털, 동물 털 같은 부드러운 재료들을 모아 그것들로 둥지 안쪽을 덮어 알을 따뜻하게 유지하도록 돕는다."]],"w":"6번 문장에서 부리로 구멍을 내는 쪽은 암컷(she)임. 수컷은 8번에서 부드러운 재료를 모아 둥지 안쪽을 덮음.","c":"F","ev":"6번, 8번 문장"},"h":"4c81b66a38"},{"n":3,"t":"tf","q":"Both parents take care of the chicks until they are strong enough to leave.","ko":"부모 둘 다 새끼들이 떠날 만큼 강해질 때까지 돌본다.","r":{"a":"T (본문과 맞는 내용)","s":[[10,"Inside, the female lays 3–5 eggs, and both parents care for the chicks until they are strong enough to leave.","그 안에서, 암컷은 3~5개의 알을 낳고, 부모 새 둘 다 새끼들이 떠날 만큼 충분히 강해질 때까지 돌본다."]],"w":"10번 문장에 both parents care for the chicks until they are strong enough to leave가 그대로 나옴.","c":"T","ev":"10번 문장"},"h":"92ca6645f9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then, she weaves plant fibers or silk through the holes with her beak.)","ko":"그런 다음, 암컷은 식물 섬유나 실을 구멍 사이로 부리로 ( ).","opts":["엮다","자르다","녹이다","던지다"],"word":"weaves","r":{"a":"1) 엮다","s":[[7,"Then, she weaves plant fibers or silk from insects through the holes with her beak, just like sewing.","그런 다음, 암컷은 바느질하듯 식물 섬유나 곤충에서 나온 실을 자신의 부리로 그 구멍들 사이로 엮는다."]],"w":"7번 문장에서 구멍 사이로 실을 넣어 바느질하듯 하는 일이 weave. 문장 끝의 just like sewing(바느질하듯)이 힌트. 자르거나 던지는 것은 바느질과 거리가 멀음.","c":1,"ev":"7번 문장"},"h":"2253674a34"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The bird gets its name from its remarkable ability to stitch leaves together.)","ko":"그 새는 잎들을 꿰매는 ( ) 능력에서 이름을 얻었다.","opts":["평범한","위험한","놀라운","숨겨진"],"word":"remarkable","r":{"a":"3) 놀라운","s":[[4,"The bird gets its name from its remarkable ability to stitch leaves together to build its nest.","그 새는 둥지를 짓기 위해 잎들을 꿰매는 놀라운 능력에서 그 이름을 얻었다."]],"w":"이름이 붙을 만큼 특별한 능력이니 remarkable은 ‘놀라운’. 평범한 능력이면 이름의 까닭이 될 수 없음.","c":3,"ev":"4번 문장"},"h":"8cb34263cd"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThe process of building their nest begins with the female selecting fresh, strong leaves and folding them into a cup shape.","ko":"밑줄 친 them이 가리키는 것은?","opts":["신선하고 튼튼한 잎들","암컷들","컵들","둥지들"],"sko":"둥지를 짓는 과정은 암컷이 신선하고 튼튼한 잎을 골라 그것들을 컵 모양으로 접는 것으로 시작된다.","r":{"a":"1) 신선하고 튼튼한 잎들","s":[[5,"The process of building their nest begins with the female selecting fresh, strong leaves and folding them into a cup shape.","둥지를 짓는 과정은 암컷이 신선하고 튼튼한 잎을 골라 그것들을 컵 모양으로 접는 것으로 시작된다."]],"w":"수컷이 모은 것은 부드러운 재료들(grass, feathers, animal hair)이고, 그것들로 둥지 안쪽을 덮는다는 뜻. them은 바로 앞에 나온 soft materials를 받음.","c":1,"ev":"5번 문장","k":"them = 신선하고 튼튼한 잎들"},"pron":"them","h":"60a59a8512"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Once the nest is complete, it becomes a safe shelter in which the chicks can stay hidden from predators.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["둥지가 완성되면 포식자들이 그 안에서 새끼들을 지킨다.","둥지가 완성되면 새끼들이 포식자를 피해 숨어 지낼 수 있는 안전한 집이 된다.","둥지가 완성되기 전에 새끼들이 포식자로부터 숨는다.","둥지가 완성되면 새끼들은 곧바로 포식자를 쫓아낸다."],"sko":"둥지가 완성되면, 그것은 새끼 새들이 포식자로부터 숨을 수 있는 안전한 주거지가 된다.","r":{"a":"2) 둥지가 완성되면 새끼들이 포식자를 피해 숨어 지낼 수 있는 안전한 집이 된다.","s":[[9,"Once the nest is complete, it becomes a safe shelter in which the chicks can stay hidden from predators.","둥지가 완성되면, 그것은 새끼 새들이 포식자로부터 숨을 수 있는 안전한 주거지가 된다."]],"w":"in which 뒤는 ‘그 안에서 새끼들이 포식자로부터 숨어 있을 수 있는’이라는 뜻. 새끼들이 숨는 장소가 둥지이고, 완성된 뒤의 이야기임.","c":2,"ev":"9번 문장"},"h":"1266ab6e6f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["Tailorbirds are large birds that live only in Africa.","The male tailorbird builds the whole nest by himself.","Other tailorbird pairs may reuse a nest that was left behind.","Tailorbirds lay more than ten eggs at a time."],"oko":["재봉새는 아프리카에서만 사는 큰 새이다.","수컷 재봉새가 혼자서 둥지 전체를 짓는다.","다른 재봉새 짝들이 남겨진 둥지를 재사용할 수도 있다.","재봉새는 한 번에 열 개가 넘는 알을 낳는다."],"r":{"a":"3) Other tailorbird pairs may reuse a nest that was left behind. (다른 재봉새 짝들이 남겨진 둥지를 재사용할 수도 있다.)","s":[[11,"Afterward, the nest is left behind and might be reused by other tailorbird pairs.","그 후, 둥지는 남겨지며, 다른 재봉새 짝들에 의해 재사용될 수도 있다."]],"w":"6번 문장에서 암컷이 부리로 잎에 구멍을 냄. 재봉새는 아시아에 사는 작은 새(2번, 3번)이고, 둥지는 암컷과 수컷이 나눠 짓고(5~8번), 쓴 둥지는 다시 쓰일 수도 있음(11번).","c":3,"ev":"11번 문장"},"h":"320fd1bf1f"},{"n":9,"t":"sum","q":"This (A) nest-building strategy is crucial for protecting their young and for the (B) of the tailorbird.","ko":"이 (A) 둥지 짓기 전략은 새끼 새들을 보호하고 재봉새의 (B)에 매우 중요하다.","opts":["(A) clever / (B) survival","(A) clumsy / (B) survival","(A) clever / (B) extinction","(A) clumsy / (B) extinction","(A) noisy / (B) travel"],"oko":["(A) 영리한 / (B) 생존","(A) 서투른 / (B) 생존","(A) 영리한 / (B) 멸종","(A) 서투른 / (B) 멸종","(A) 시끄러운 / (B) 여행"],"r":{"a":"1) (A) clever / (B) survival ((A) 영리한 / (B) 생존)","s":[[12,"This clever nest-building strategy is crucial for protecting their young and for the survival of the tailorbird.","이 영리한 둥지 짓기 전략은 새끼 새들을 보호하고 재봉새가 살아남는 데 매우 중요하다."]],"w":"6번 문장에서 부리를 바늘(needle)처럼 사용하고, 9번 문장에서 둥지가 새끼들이 포식자(predators)로부터 숨을 수 있는 곳이 된다고 함. 칼이나 날씨 이야기는 본문에 없음.","c":1,"ev":"12번 문장"},"h":"8e671b8035"},{"n":10,"t":"fill","q":"It’s called the tailorbird, a [A] found in [B].","ko":"그것은 재봉새라고 불리며, [B]에서 발견되는 [A].","bko":{"songbird":"명금","Asia":"아시아","sings":"노래하다","stays":"머물다","tastes":"맛보다","sleeps":"잠자다"},"bank":["songbird","Asia","sings","stays","tastes","sleeps"],"r":{"a":"[A] songbird (명금), [B] Asia (아시아)","s":[[2,"It’s called the tailorbird, a songbird found in Asia.","그것은 재봉새(tailorbird)라고 불리며, 아시아에서 발견되는 명금(고운 소리로 노래하는 새)이다."]],"w":"8번 문장에서 수컷이 부드러운 재료를 모음(gathers), 10번 문장에서 부모 둘 다 새끼를 돌봄(care for). sleeps, sings, tastes는 재료나 새끼를 대하는 말로 문맥이 맞지 않음.","c":null,"ev":"2번 문장"},"h":"34950b2c50"}]},{"u":7,"id":"rg6-07-2","no":2,"ko":"교도소에 고양이를 풀어놓으면 생기는 일","items":[{"n":1,"t":"tf","q":"The program in an Indiana prison started in 2015.","ko":"인디애나주 교도소의 그 프로그램은 2015년에 시작되었다.","r":{"a":"T (본문과 맞는 내용)","s":[[1,"In a prison in Indiana, U.S., a unique program is transforming lives.","미국 인디애나주(州)의 한 교도소에서, 독특한 프로그램이 삶을 변화시키고 있다."],[2,"Since its start in 2015, the program has brought shelter cats — often abandoned or abused — into the prison to live alongside prisoners.","2015년에 시작된 이후로, 그 프로그램은 보통 유기되거나 학대받았던 보호소 고양이들을 수감자들과 함께 살기 위해 교도소로 데려왔다."]],"w":"1번 문장에서 인디애나주의 교도소 이야기이고, 2번 문장에서 Since its start in 2015(2015년에 시작된 이후)라고 함.","c":"T","ev":"1~2번 문장"},"h":"017fa6384f"},{"n":2,"t":"tf","q":"The program helps only the cats and does nothing for the prisoners.","ko":"그 프로그램은 고양이에게만 도움이 되고 수감자에게는 아무 도움도 되지 않는다.","r":{"a":"F (본문과 다른 내용)","s":[[4,"The program benefits both prisoners and cats.","그 프로그램은 수감자와 고양이 모두에게 이롭다."]],"w":"4번 문장에서 프로그램이 수감자와 고양이 모두에게 이롭다(benefits both)고 함. 수감자도 도움을 받음.","c":"F","ev":"4번 문장"},"h":"ed2499eaaa"},{"n":3,"t":"tf","q":"Prisoners feed the cats and even knit clothes for them.","ko":"수감자들은 고양이에게 먹이를 주고 심지어 옷도 떠 준다.","r":{"a":"T (본문과 맞는 내용)","s":[[5,"For prisoners, caring for the cats — feeding, grooming, and even knitting their clothes — gives them a sense of purpose.","수감자들에게는, 고양이를 돌보는 것 — 먹이 주기, 털 관리해 주기, 심지어 고양이 옷을 뜨개질해 주기와 같은 — 이 그들에게 목적의식을 부여해 준다."]],"w":"5번 문장에 feeding, grooming, and even knitting their clothes가 나옴.","c":"T","ev":"5번 문장"},"h":"6609961138"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The program has brought shelter cats — often abandoned or abused — into the prison.)","ko":"그 프로그램은 종종 ( ) 또는 학대받은 보호소 고양이들을 교도소로 데려왔다.","opts":["사랑받는","잘 훈련된","버려진","값비싼"],"word":"abandoned","r":{"a":"3) 버려진","s":[[2,"Since its start in 2015, the program has brought shelter cats — often abandoned or abused — into the prison to live alongside prisoners.","2015년에 시작된 이후로, 그 프로그램은 보통 유기되거나 학대받았던 보호소 고양이들을 수감자들과 함께 살기 위해 교도소로 데려왔다."]],"w":"2번 문장에서 abandoned or abused는 ‘버려지거나 학대받은’. 이런 고양이들이라서 보호소에 있었던 것. 사랑받거나 값비싼 고양이는 보호소에 올 이유가 없음.","c":3,"ev":"2번 문장"},"h":"aaacb4bfe4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It also provides comfort and companionship, sometimes for the first time in their lives.)","ko":"그것은 또한 위안과 ( )을 제공하는데, 때로는 인생에서 처음이다.","opts":["동료애, 우정","경쟁","두려움","자유"],"word":"companionship","r":{"a":"1) 동료애, 우정","s":[[6,"It also provides comfort and companionship, sometimes for the first time in their lives.","그것은 또한 위안과 동료애를 제공해 주는데, 이는 때로는 그들의 인생에서 처음 있는 일이다."]],"w":"6번 문장은 고양이를 돌보는 일이 주는 좋은 점이라 companionship은 함께하는 친구 같은 정, 즉 동료애. 경쟁이나 두려움은 좋은 점이 아님.","c":1,"ev":"6번 문장"},"h":"19149ec6c2"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey get healthier, more playful, and ready for adoption under the love and care of the prisoners.","ko":"밑줄 친 They가 가리키는 것은?","opts":["수감자들","고양이들","교도관들","입양 가족들"],"sko":"그들은 수감자들의 사랑과 보살핌 속에서 더 건강해지고, 더 장난기가 많아지며, 입양될 준비가 된다.","r":{"a":"2) 고양이들","s":[[7,"The cats, in turn, learn to trust people again.","그 결과, 고양이들은 다시 사람을 신뢰하는 법을 배운다."],[8,"They get healthier, more playful, and ready for adoption under the love and care of the prisoners.","그들은 수감자들의 사랑과 보살핌 속에서 더 건강해지고, 더 장난기가 많아지며, 입양될 준비가 된다."]],"w":"7번 문장에서 The cats가 주어이고, 8번의 They는 그 고양이들. ‘입양될 준비가 된다’는 말도 고양이에게 맞음. 수감자들은 사랑과 보살핌을 주는 쪽.","c":2,"ev":"7~8번 문장"},"h":"82f5ec2003"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By the time they leave prison, they will have been better prepared to adapt to society.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["교도소를 떠난 뒤에야 사회에 적응하는 법을 배우기 시작할 것이다.","교도소를 떠나기 전에 이미 사회에 완전히 적응해 있었다.","교도소를 떠나면 사회가 그들에게 적응해야 할 것이다.","교도소를 떠날 때쯤에는 사회에 적응할 준비가 더 잘 되어 있을 것이다."],"sko":"그들이 교도소를 떠날 때쯤, 그들은 사회에 적응할 준비가 더 잘 되어 있을 것이다.","r":{"a":"4) 교도소를 떠날 때쯤에는 사회에 적응할 준비가 더 잘 되어 있을 것이다.","s":[[12,"By the time they leave prison, they will have been better prepared to adapt to society.","그들이 교도소를 떠날 때쯤, 그들은 사회에 적응할 준비가 더 잘 되어 있을 것이다."]],"w":"By the time ~는 ‘~할 때쯤에는’이고 will have been prepared는 ‘준비되어 있을 것이다’. 떠나기 전에 준비가 더 잘 된다는 뜻. 떠난 뒤에 시작한다는 말은 아님.","c":4,"ev":"12번 문장"},"h":"0ba125f5c5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["The cats learn to trust people again.","Prisoners are not allowed to touch the cats.","The cats become more nervous and less playful with the prisoners.","The program only accepts cats that were raised in happy homes."],"oko":["고양이들은 다시 사람을 신뢰하는 법을 배운다.","수감자들은 고양이를 만지는 것이 허락되지 않는다.","고양이들은 수감자들과 있으면 더 겁이 많아지고 덜 장난스러워진다.","그 프로그램은 행복한 가정에서 자란 고양이만 받는다."],"r":{"a":"1) The cats learn to trust people again. (고양이들은 다시 사람을 신뢰하는 법을 배운다.)","s":[[7,"The cats, in turn, learn to trust people again.","그 결과, 고양이들은 다시 사람을 신뢰하는 법을 배운다."]],"w":"5번 문장에 먹이 주기, 털 손질, 옷 뜨개질이 나옴. 수감자가 고양이를 못 만진다는 말은 없고, 고양이들은 더 장난기 많아지며(8번), 프로그램의 고양이는 유기·학대받은 고양이들임(2번).","c":1,"ev":"7번 문장"},"h":"bd31ef629f"},{"n":9,"t":"sum","q":"In a place defined by strict rules and steel bars, both the abandoned cats and the prisoners find warmth, (A), and a second (B) together.","ko":"엄격한 규칙과 철창으로 정의된 곳에서, 유기된 고양이들과 수감자들은 함께 따뜻함, (A), 그리고 두 번째 (B)을(를) 발견한다.","opts":["(A) connection / (B) chance","(A) conflict / (B) chance","(A) connection / (B) punishment","(A) conflict / (B) punishment","(A) boredom / (B) warning"],"oko":["(A) 연대감 / (B) 기회","(A) 갈등 / (B) 기회","(A) 연대감 / (B) 벌","(A) 갈등 / (B) 벌","(A) 지루함 / (B) 경고"],"r":{"a":"1) (A) connection / (B) chance ((A) 연대감 / (B) 기회)","s":[[13,"In a place defined by strict rules and steel bars, both the abandoned cats and the prisoners find warmth, connection, and a second chance together.","엄격한 규칙과 철창으로 정의된 곳에서, 유기된 고양이들과 수감자들은 함께 따뜻함, 연대감, 그리고 두 번째 기회를 발견한다."]],"w":"7번 문장에서 고양이들이 사람을 다시 신뢰(trust)하는 법을 배우고, 8번 문장에서 입양(adoption)될 준비가 됨. 두려워하거나 벌을 받는 이야기는 없음.","c":1,"ev":"13번 문장"},"h":"e2d5eca868"},{"n":10,"t":"fill","q":"It teaches meaningful social [A] like patience and responsibility, helping them better understand how to form positive [B].","ko":"그것은 인내심과 책임감 같은 의미 있는 사회적 [A]을(를) 가르쳐 주며, 수감자들이 긍정적인 [B]을(를) 형성하는 방법을 더 잘 이해하도록 도와준다.","bko":{"skills":"기술","relationships":"관계","comfort":"위안","shelter":"주거지","bars":"철창","adoption":"입양"},"bank":["skills","relationships","comfort","shelter","bars","adoption"],"r":{"a":"[A] skills (기술), [B] relationships (관계)","s":[[10,"It teaches meaningful social skills like patience and responsibility, helping them better understand how to form positive relationships.","그것은 인내심과 책임감 같은 의미 있는 사회적 기술들을 가르쳐 주며, 수감자들이 긍정적인 관계를 형성하는 방법을 더 잘 이해하도록 도와준다."]],"w":"10번 문장에서 social skills like patience and responsibility(인내심, 책임감 같은 사회적 기술)를 가르치고, 11번 문장에서 respect for life(생명에 대한 존중)를 기름. comfort, shelter, bars, adoption은 이 문맥에 들어가지 않음.","c":null,"ev":"10번 문장"},"h":"5300957774"}]},{"u":7,"id":"rg6-07-3","no":3,"ko":"건들면 깨져버릴 거예요!","items":[{"n":1,"t":"tf","q":"Princess Alexandra Amelie believed that she had swallowed a whole glass piano as a child.","ko":"Alexandra Amelie 공주는 어릴 적 유리 피아노 전체를 삼켰다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","s":[[2,"She believed she had swallowed a whole glass piano as a child and moved carefully, as if it were about to break at any moment.","그녀는 어릴 적 유리로 된 피아노 전체를 삼켰다고 믿었으며, 마치 그것이 언제든 깨질 수 있는 것처럼 조심스럽게 움직였다."]],"w":"2번 문장에 She believed she had swallowed a whole glass piano as a child가 그대로 나옴.","c":"T","ev":"2번 문장"},"h":"f34a2ef6f0"},{"n":2,"t":"tf","q":"Doctors at the time could easily explain the cause of the glass delusion.","ko":"당시 의사들은 유리 망상의 원인을 쉽게 설명할 수 있었다.","r":{"a":"F (본문과 다른 내용)","s":[[9,"Doctors at the time struggled to explain the cause of this delusion.","당시 의사들은 이 망상의 원인을 설명하려고 애썼다."]],"w":"9번 문장에서 의사들은 원인을 설명하려고 애썼다(struggled to explain)고 함. 쉽게 설명한 것이 아님.","c":"F","ev":"9번 문장"},"h":"b733dae403"},{"n":3,"t":"tf","q":"The first recorded case of the glass delusion was in the Middle Ages.","ko":"유리 망상의 최초 기록 사례는 중세 시대였다.","r":{"a":"T (본문과 맞는 내용)","s":[[5,"The first recorded case was in the Middle Ages, and the condition became more common in the 16th and 17th centuries.","최초로 기록된 사례는 중세 시대였으며, 그 질환은 16세기와 17세기에 더 흔해졌다."]],"w":"5번 문장에 The first recorded case was in the Middle Ages가 나옴.","c":"T","ev":"5번 문장"},"h":"a658322366"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (He believed that his body was entirely made of glass.)","ko":"그는 자신의 몸이 ( ) 유리로 되어 있다고 믿었다.","opts":["거의","완전히, 전부","가끔","조금"],"word":"entirely","r":{"a":"2) 완전히, 전부","s":[[7,"He believed that his body was entirely made of glass and, to avoid breaking, he would stay still for hours, wrapped in thick blankets.","그는 자신의 몸이 전부 유리로 되어 있다고 믿었고, 깨지지 않기 위해 두꺼운 담요에 싸인 채로 수 시간 동안 가만히 있곤 했다."]],"w":"7번 문장에서 몸이 ‘전부’ 유리라고 믿어서 깨질까 봐 몇 시간씩 가만히 있었음. entirely는 완전히. 조금이나 가끔이면 그렇게까지 행동하지 않음.","c":2,"ev":"7번 문장"},"h":"e1a04d7524"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Princess Alexandra Amelie was convinced that her body contained glass.)","ko":"Alexandra Amelie 공주는 자신의 몸에 유리가 들어 있다고 ( ).","opts":["의심했다","잊어버렸다","부인했다","확신했다"],"word":"convinced","r":{"a":"4) 확신했다","s":[[1,"In the late 1840s, Princess Alexandra Amelie of Bavaria was convinced that her body contained glass.","1840년대 후반, 바이에른의 Alexandra Amelie 공주는 자신의 몸 안에 유리가 들어 있다고 확신했다."]],"w":"1번 문장은 공주가 몸속에 유리가 있다고 철석같이 믿어서 2번처럼 조심스럽게 움직였다는 이야기로 이어짐. be convinced that은 ‘~라고 확신하다’.","c":4,"ev":"1번 문장"},"h":"246674f3bf"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSome linked it to depression common among nobles. Psychologists today suggest it revealed how vulnerable and exposed they felt in their highly public roles, along with a desire to escape their pressures.","ko":"밑줄 친 they가 가리키는 것은?","opts":["귀족들","심리학자들","의사들","유리 피아노"],"sko":"오늘날의 심리학자들은 그것이 그들이 매우 공적인 역할 속에서 얼마나 취약하고 노출되었다고 느꼈는지를, 그 압박에서 벗어나고자 하는 욕구와 함께 나타냈다고 본다.","r":{"a":"1) 귀족들","s":[[10,"Some linked it to depression common among nobles.","일부는 그것이 귀족들 사이에서 흔했던 우울증과 관련이 있다고 보았다."],[11,"Psychologists today suggest it revealed how vulnerable and exposed they felt in their highly public roles, along with a desire to escape their pressures.","오늘날의 심리학자들은 그것이 귀족들이 매우 공적인 역할 속에서 얼마나 취약하고 노출되었다고 느꼈는지를, 그 압박에서 벗어나고자 하는 욕구와 함께 나타냈다고 본다."]],"w":"11번 문장에서 “취약하고 노출되었다고 느낀” 주체가 they이고, 바로 앞 10번 문장에 나온 nobles(귀족들)를 가리킴. 심리학자들은 생각을 말하는 사람이지 그렇게 느낀 사람이 아님.","c":1,"ev":"10~11번 문장","k":"they = 귀족들"},"pron":"they","h":"18a0067288"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Others believed they had glass hearts, feet, or heads; one royal even thought he was a glass vase.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","opts":["어떤 사람들은 자신의 심장, 발, 머리가 유리라고 믿었고, 한 왕족은 심지어 자신이 유리 꽃병이라고 생각했다.","어떤 사람들은 유리 장식을 심장, 발, 머리에 달고 다녔고, 한 왕족은 유리 꽃병을 모았다.","어떤 사람들은 심장, 발, 머리가 아픈 것을 유리 때문이라 했고, 한 왕족은 꽃병을 깨뜨려 벌을 받았다.","어떤 사람들은 유리로 된 심장, 발, 머리 모형을 만들었고, 한 왕족은 유리 꽃병을 선물로 받았다."],"sko":"어떤 사람들은 자신이 유리 심장, 발, 또는 머리를 가졌다고 믿었고, 한 왕족은 심지어 자신이 유리 꽃병이라고 생각하기도 했다.","r":{"a":"1) 어떤 사람들은 자신의 심장, 발, 머리가 유리라고 믿었고, 한 왕족은 심지어 자신이 유리 꽃병이라고 생각했다.","s":[[8,"Others believed they had glass hearts, feet, or heads; one royal even thought he was a glass vase.","어떤 사람들은 자신이 유리 심장, 발, 또는 머리를 가졌다고 믿었고, 한 왕족은 심지어 자신이 유리 꽃병이라고 생각하기도 했다."]],"w":"8번 문장의 believed they had glass hearts는 ‘자신의 심장이 유리라고 믿었다’는 망상이고, thought he was a glass vase는 ‘자기가 꽃병이라고 생각했다’는 뜻. 물건을 모으거나 만든 이야기가 아님.","c":1,"ev":"8번 문장"},"h":"9ab989c1fe"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","opts":["Only poor farmers suffered from the glass delusion.","Many royals and nobles throughout history shared the same delusion.","No royals or nobles ever believed they were made of glass.","The glass delusion appeared only in one family in Bavaria."],"oko":["가난한 농부들만 유리 망상을 겪었다.","역사 속 많은 왕족과 귀족들이 같은 망상을 겪었다.","어떤 왕족이나 귀족도 자신이 유리로 되어 있다고 믿은 적이 없다.","유리 망상은 바이에른의 한 가문에서만 나타났다."],"r":{"a":"2) Many royals and nobles throughout history shared the same delusion. (역사 속 많은 왕족과 귀족들이 같은 망상을 겪었다.)","s":[[4,"Many royals and nobles throughout history shared the same delusion.","역사 속 많은 왕족과 귀족들이 똑같은 망상을 겪었다."]],"w":"4번 문장에서 역사 속 많은 왕족과 귀족들이 똑같은 망상을 겪었다고 함. 가난한 농부만, 아무도 없었다, 한 가문에서만이라는 말은 4번과 맞지 않음.","c":2,"ev":"4번 문장"},"h":"d61dc6f704"},{"n":9,"t":"sum","q":"This (A) belief was known as “the glass delusion,” a psychological condition in which people believed their bodies were (B) glass.","ko":"이 (A) 믿음은 ‘유리 망상’으로 알려졌는데, 이는 사람들이 자신의 몸이 (B) 유리라고 믿는 정신적 질환이었다.","opts":["(A) peculiar / (B) heavy","(A) ordinary / (B) fragile","(A) peculiar / (B) fragile","(A) ordinary / (B) heavy","(A) pleasant / (B) fragile"],"oko":["(A) 기이한 / (B) 무거운","(A) 평범한 / (B) 깨지기 쉬운","(A) 기이한 / (B) 깨지기 쉬운","(A) 평범한 / (B) 무거운","(A) 유쾌한 / (B) 깨지기 쉬운"],"r":{"a":"3) (A) peculiar / (B) fragile ((A) 기이한 / (B) 깨지기 쉬운)","s":[[3,"This peculiar belief was known as “the glass delusion,” a psychological condition in which individuals believed their bodies or parts of them were fragile glass.","이 기이한 믿음은 ‘유리 망상’으로 알려졌는데, 이는 사람들이 자신의 몸이나 신체 일부가 깨지기 쉬운 유리라고 믿는 정신적 질환이었다."]],"w":"3번 문장에서 이 믿음을 기이한(peculiar) 믿음이라 하고, 몸이 깨지기 쉬운(fragile) 유리라고 믿는 질환이라고 함. 평범한·유쾌한·무거운은 본문과 다름.","c":3,"ev":"3번 문장"},"h":"979b3a35e4"},{"n":10,"t":"fill","q":"Additionally, the idea of glass as a [A] and precious material, often found in palaces, likely [B] the delusion.","ko":"또한, 유리가 궁전에서 자주 볼 수 있는 [A] 그리고 귀중한 재료라는 생각이 그 망상을 [B] 가능성이 높다.","bko":{"rare":"희귀한","reinforced":"강화했을","explain":"설명하다","escape":"벗어나다","depression":"우울증","pressures":"압박들"},"bank":["rare","reinforced","explain","escape","depression","pressures"],"r":{"a":"[A] rare (희귀한), [B] reinforced (강화했을)","s":[[12,"Additionally, the idea of glass as a rare and precious material, often found in palaces, likely reinforced the delusion.","또한, 유리가 궁전에서 자주 볼 수 있는 희귀하고 귀중한 재료라는 생각이 그 망상을 더 강화했을 가능성이 높다."]],"w":"12번 문장에서 유리는 희귀하고(rare) 귀중한 재료였고, 그 생각이 망상을 강화했을(reinforced) 가능성이 높다고 함. [A]는 귀중한과 이어지는 형용사, [B]는 과거 동사 자리라 explain·escape 같은 동사 원형이나 명사는 들어갈 수 없음.","c":null,"ev":"12번 문장"},"h":"00690b6839"}]},{"u":8,"id":"rg6-08-1","no":1,"ko":"비둘기가 훈장을 받은 이유","items":[{"n":1,"t":"tf","q":"Cher Ami was trained by the U.S. Army as one of 600 pigeons.","ko":"Cher Ami는 600마리의 비둘기 중 한 마리로 미 육군에게 훈련받았다.","r":{"a":"T (본문과 맞는 내용)","s":[[4,"Cher Ami was trained by the U.S. Army as one of 600 pigeons used to deliver messages during battles.","Cher Ami는 전투 중 메시지를 전달하기 위해 사용된 600마리의 비둘기 중 한 마리로 미 육군에 의해 훈련받았다."]],"w":"4번 문장에 Cher Ami was trained by the U.S. Army as one of 600 pigeons가 나옴.","c":"T","ev":"4번 문장"},"h":"0bbbc4fbb5"},{"n":2,"t":"tf","q":"Cher Ami died in 1918 during the battle.","ko":"Cher Ami는 1918년 전투 중에 죽었다.","r":{"a":"F (본문과 다른 내용)","s":[[5,"Having completed several successful missions, Cher Ami took on his most important mission during a critical battle in 1918.","몇 차례의 성공적인 임무를 마친 후, Cher Ami는 1918년의 한 중대한 전투 중에 가장 중요한 임무를 맡게 되었다."],[11,"He died in 1919 from his wounds, but his courage is remembered to this day.","그는 부상으로 인해 1919년에 사망했지만, 그의 용기는 오늘날까지 기억되고 있다."]],"w":"1918년은 가장 중요한 임무를 맡은 때(5번)이고, 죽은 것은 전쟁이 끝나고 부상 때문에 1919년(11번). 전투 중에 죽은 것이 아님.","c":"F","ev":"5번, 11번 문장"},"h":"5037d1fe38"},{"n":3,"t":"tf","q":"Cher Ami received a medal for bravery after the war.","ko":"Cher Ami는 전쟁 후 용맹함으로 메달을 받았다.","r":{"a":"T (본문과 맞는 내용)","s":[[10,"After the war, Cher Ami returned to the U.S. and was awarded a medal for bravery.","전쟁이 끝난 후, Cher Ami는 미국으로 돌아와 용맹함에 대한 메달을 수여받았다."]],"w":"10번 문장에 After the war, ... was awarded a medal for bravery가 나옴.","c":"T","ev":"10번 문장"},"h":"462223cd05"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (During World War I, pigeons were crucial to military communication.)","ko":"제1차 세계대전 때 비둘기는 군사 통신에 ( ) 존재였다.","opts":["쓸모없는","위험한","매우 중요한","어려운"],"word":"crucial","r":{"a":"3) 매우 중요한","s":[[1,"Pigeons may not be the most welcomed animals today, but during World War I, they were crucial to military communication.","오늘날 비둘기는 가장 환영받는 동물은 아닐지도 모르지만, 제1차 세계대전 동안에는, 그들이 군사 통신에 매우 중요했다."]],"w":"1번 문장 but 앞에서 오늘날엔 환영받지 못하지만, 전쟁 때는 달랐다는 대비. 2번에서 생명을 구하는 메시지를 전달했으니 crucial은 매우 중요한.","c":3,"ev":"1번 문장"},"h":"83d4151122"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Cher Ami flew through intense gunfire.)","ko":"Cher Ami는 ( ) 총격을 뚫고 날아갔다.","opts":["약한","격렬한","조용한","짧은"],"word":"intense","r":{"a":"2) 격렬한","s":[[9,"Cher Ami flew through intense gunfire and, despite being shot in the chest, managed to deliver the message that saved 194 men.","Cher Ami는 격렬한 총격을 뚫고 날아갔고, 가슴에 총을 맞았음에도 불구하고 194명의 병사를 구한 메시지를 전달하는 데 성공했다."]],"w":"9번 문장에서 가슴에 총까지 맞고도 날아갔으니 총격은 격렬한(intense). 약하거나 조용한 총격이면 despite(~에도 불구하고)를 쓸 만한 어려움이 되지 않음.","c":2,"ev":"9번 문장"},"h":"98a8e49a3a"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nA soldier tied a message to Cher Ami’s leg, which pleaded for the bombing to stop.","ko":"밑줄 친 which이 가리키는 것은?","opts":["Cher Ami의 다리","병사","Cher Ami","폭격을 멈춰 달라는 메시지"],"sko":"한 병사가 Cher Ami의 다리에 메시지를 묶었고, 그것은 폭격을 멈춰달라고 간청하는 내용이었다.","r":{"a":"4) 폭격을 멈춰 달라는 메시지","s":[[8,"A soldier tied a message to Cher Ami’s leg, which pleaded for the bombing to stop.","한 병사가 Cher Ami의 다리에 메시지를 묶었고, 그 메시지는 폭격을 멈춰달라고 간청하는 내용이었다."]],"w":"which 뒤의 pleaded for the bombing to stop(폭격을 멈춰 달라고 간청했다)은 메시지가 하는 일. 다리나 병사는 간청을 할 수 없음. which는 바로 앞 a message를 받음.","c":4,"ev":"8번 문장","k":"which = 폭격을 멈춰 달라는 메시지"},"pron":"which","h":"ae50668bf3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"His body is displayed at a historical museum in Washington, D.C., reminding us that these o
