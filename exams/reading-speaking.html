다.","fx":[{"w":"earlier","r":"early","at":4,"t":"비교급","m":"비교 대상이 없으면 원급 early 사용"},{"w":"were","r":"was","at":6,"t":"be동사의 긍정문","m":"주어 It에는 was 사용"}]},{"n":12,"en":"Subin said, \"The sun is rise. Make a wish!\"","ko":"수빈이가 \"해가 떠오르고 있어. 소원을 빌어!\"라고 말했다.","fx":[{"w":"rise","r":"rising","at":5,"t":"현재진행형","m":"현재진행형은 be + 동사ing, rising 사용"}]},{"n":13,"en":"I closed me eyes and made a wish.","ko":"나는 눈을 감고 소원을 빌었다.","fx":[{"w":"me","r":"my","at":2,"t":"인칭대명사의 소유격","m":"명사 앞 소유격은 my 사용"}]},{"n":14,"en":"For lunch, we eated gamjajeon. It was like a pancake.","ko":"점심 식사로, 우리는 감자전을 먹었다. 그것은 팬케이크 같았다.","fx":[{"w":"eated","r":"ate","at":3,"t":"불규칙 과거형","m":"eat의 과거형은 ate (eated 아님)"}]},{"n":15,"en":"I loved it. After lunch, we visited to Sokcho Lighthouse Observatory.","ko":"난 그것이 정말 좋았다. 점심 식사 후에, 우리는 속초 등대 전망대에 방문했다.","fx":[{"w":"to Sokcho","r":"Sokcho","at":7,"t":"기본전치사","m":"visit은 타동사라 전치사 없이 목적어 사용"}]},{"n":16,"en":"We walked up much steep stairs. Our legs was tired.","ko":"우리는 많은 가파른 계단을 걸어 올라갔다. 우리의 다리는 피곤했다.","fx":[{"w":"much","r":"many","at":3,"t":"수량 형용사 many/much","m":"복수명사 stairs 앞에는 many 사용"},{"w":"was","r":"were","at":8,"t":"be동사의 수일치","m":"주어 legs는 복수: were (was 아님)"}]},{"n":17,"en":"But at the top, the view was beautifully. We saw the city, the ocean, and the mountains.","ko":"하지만 꼭대기에서, 경치가 아름다웠다. 우리는 그 도시와 바다, 그리고 산들을 보았다.","fx":[{"w":"beautifully","r":"beautiful","at":7,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 beautiful 사용"}]},{"n":18,"en":"Subin said, \"These lighthouse is about 70 years old. It still shines it light for ships at night.\"","ko":"수빈이는 \"이 등대는 약 70년이 되었어. 이것은 아직 밤에 선박들을 위해 빛을 비춰.\"라고 말했다.","fx":[{"w":"These","r":"This","at":2,"t":"지시형용사 this/these","m":"단수명사 lighthouse 앞에는 This 사용"},{"w":"it","r":"its","at":12,"t":"인칭대명사의 소유격","m":"명사 앞 소유격은 its 사용"}]},{"n":20,"en":"Every moments of this trip was wonderful. I took many picture.","ko":"이 여행의 모든 순간이 훌륭했다. 나는 많은 사진을 찍었다.","fx":[{"w":"moments","r":"moment","at":1,"t":"수량 형용사","m":"Every 뒤에는 단수명사 moment 사용"},{"w":"picture","r":"pictures","at":10,"t":"명사의 복수형","m":"many 뒤에는 복수명사 pictures 사용"}]},{"n":21,"en":"I will always remembers Korea.","ko":"나는 언제나 한국을 기억할 것이다.","fx":[{"w":"remembers","r":"remember","at":3,"t":"조동사","m":"조동사 will 뒤에는 동사원형 remember 사용"}]}]},{"no":"46","t":"Small Actions, Big Change","q":[{"n":1,"en":"Last month, I sawed \"#ZeroWasteChallenge\" on Jiwoo's social media. The challenge was make no trash.","ko":"지난달에 나는 지우의 소셜 미디어에서 '#제로웨이스트챌린지'를 보았다. 그 챌린지는 쓰레기를 만들지 않는 것이었다.","fx":[{"w":"sawed","r":"saw","at":3,"t":"불규칙 과거형","m":"see의 과거형은 saw (sawed 아님)"},{"w":"make","r":"making","at":12,"t":"동명사","m":"was 뒤 보어로 '~하는 것'은 making 사용"}]},{"n":2,"en":"I liked she idea and tried the challenge. Here is my one-week plan for an trash-free life.","ko":"나는 그녀의 생각이 마음에 들어서 그 챌린지를 해 보았다. 여기에 쓰레기 없는 생활을 위한 나의 일주일 계획이 있다.","fx":[{"w":"she","r":"her","at":2,"t":"인칭대명사의 소유격","m":"명사 idea 앞에는 소유격 her 사용"},{"w":"an","r":"a","at":14,"t":"관사 a/an","m":"trash는 자음 소리로 시작하므로 a 사용"}]},{"n":4,"en":"Today is the first day on the challenge. Jiwoo gived me some advice.","ko":"오늘은 챌린지의 첫날이다. 지우는 나에게 몇 가지 조언을 해 주었다.","fx":[{"w":"on","r":"of","at":5,"t":"기본전치사","m":"'~의 첫째 날'은 first day of 사용"},{"w":"gived","r":"gave","at":9,"t":"불규칙 과거형","m":"give의 과거형은 gave (gived 아님)"}]},{"n":5,"en":"She said, \"Knowing your trash is very importantly.\" So I went through my garbage.","ko":"그녀는 \"너의 쓰레기를 아는 것이 아주 중요해.\"라고 말했다. 그래서 나는 나의 쓰레기를 살펴보았다.","fx":[{"w":"importantly","r":"important","at":7,"t":"형용사와 부사","m":"be동사 뒤 보어는 형용사 important 사용"}]},{"n":6,"en":"I were throwing away too much paper and plastic! I should not be so wasteful.","ko":"나는 너무 많은 종이와 플라스틱을 버리고 있었다! 나는 그렇게 낭비해서는 안 된다.","fx":[{"w":"were","r":"was","at":1,"t":"be동사의 과거형","m":"주어 I의 과거진행형: was (were 아님)"}]},{"n":8,"en":"It was really hot today, so Dad buyed me lemonade. It came with an straw.","ko":"오늘은 정말 더워서 아빠가 나에게 레모네이드를 사 주셨다. 그것은 빨대와 함께 나왔다.","fx":[{"w":"buyed","r":"bought","at":7,"t":"불규칙 과거형","m":"buy의 과거형은 bought (buyed 아님)"},{"w":"an","r":"a","at":13,"t":"관사 a/an","m":"straw는 자음 소리로 시작하므로 a 사용"}]},{"n":10,"en":"I should said this more often.","ko":"나는 이 말을 더 자주 해야겠다.","fx":[{"w":"said","r":"say","at":2,"t":"조동사 뒤 동사원형","m":"조동사 should 뒤에는 동사원형 say 사용"}]},{"n":12,"en":"Today I cleaned my room and found too many T-shirt. I didn't wore some of them for a long time.","ko":"오늘 나는 내 방을 정리하다가 너무 많은 티셔츠를 찾아냈다. 나는 그중 어떤 것은 오랫동안 입지 않았다.","fx":[{"w":"T-shirt","r":"T-shirts","at":9,"t":"명사의 복수형","m":"many 뒤에는 복수명사 T-shirts 사용"},{"w":"wore","r":"wear","at":12,"t":"did not 뒤 동사원형","m":"didn't 뒤에는 동사원형: wear (wore 아님)"}]},{"n":14,"en":"To my surprised, one person wanted one, and I sold it to he. With those money, I bought a used badminton racket.","ko":"놀랍게도, 한 사람이 하나를 원해서 나는 그것을 그에게 팔았다. 그 돈으로, 나는 중고 배드민턴 라켓을 샀다.","fx":[{"w":"surprised","r":"surprise","at":2,"t":"품사 구별","m":"my 뒤에는 명사 surprise 사용"},{"w":"he","r":"him","at":12,"t":"인칭대명사의 목적격","m":"전치사 to 뒤에는 목적격 him 사용"},{"w":"those","r":"that","at":14,"t":"지시형용사","m":"셀 수 없는 단수 money 앞에는 that 사용"}]},{"n":17,"en":"These morning, I ran out of shampoo. I took the empty bottle and went to an zero-waste shop.","ko":"오늘 아침에 나는 샴푸를 다 써 버렸다. 나는 빈 병을 가지고 제로웨이스트 상점에 갔다.","fx":[{"w":"These","r":"This","at":0,"t":"지시형용사","m":"단수명사 morning 앞에는 This 사용"},{"w":"an","r":"a","at":15,"t":"관사 a/an","m":"zero는 자음 소리로 시작하므로 a 사용"}]},{"n":18,"en":"I filled my bottle with shampoo there. It smelled so well!","ko":"나는 거기서 나의 병을 샴푸로 채웠다. 그것은 무척 좋은 냄새가 났다!","fx":[{"w":"well","r":"good","at":10,"t":"형용사와 부사","m":"감각동사 smell 뒤에는 형용사 good 사용"}]},{"n":19,"en":"This way, I cuts down on plastic.","ko":"이런 방법으로 나는 플라스틱을 줄였다.","fx":[{"w":"cuts","r":"cut","at":3,"t":"일반동사의 수일치","m":"주어 I는 cut (cuts 아님)"}]}]},{"no":"47","t":"Give LIKEs to Our Game","q":[{"n":2,"en":"Last summers, my friends and I maked our own adventure game, \"The Lost Island.\" We worked together as an team.","ko":"지난여름, 내 친구들과 나는 우리만의 모험 게임인 '잃어버린 섬'을 만들었어. 우리는 팀으로서 함께 일했어.","fx":[{"w":"summers","r":"summer","at":1,"t":"명사의 단수·복수","m":"'지난여름'은 단수 Last summer 사용"},{"w":"maked","r":"made","at":6,"t":"불규칙 과거형","m":"make의 과거형은 made"},{"w":"an","r":"a","at":18,"t":"관사 a/an","m":"team은 자음 소리로 시작하므로 a 사용"}]},{"n":4,"en":"One days you wake up on an island. There is many monsters on the island.","ko":"어느 날 당신은 섬에서 깨어납니다. 그 섬에는 많은 괴물들이 있습니다.","fx":[{"w":"days","r":"day","at":1,"t":"명사의 단수·복수","m":"'어느 날'은 One day 사용 (one 뒤 단수)"},{"w":"is","r":"are","at":9,"t":"There is/are 구문","m":"many monsters는 복수: are (is 아님)"}]},{"n":5,"en":"You goes through a highly mountain, a long river, and a giant tower. Choose five items and get off the island.","ko":"당신은 높은 산, 긴 강, 그리고 거대한 탑을 거쳐 갑니다. 다섯 가지 아이템을 골라서 그 섬을 탈출해 보세요.","fx":[{"w":"goes","r":"go","at":1,"t":"3인칭 단수 현재형","m":"주어 You에는 동사원형 go 사용"},{"w":"highly","r":"high","at":4,"t":"형용사와 부사","m":"명사 mountain 앞에는 형용사 high 사용"}]},{"n":6,"en":"Sujin made the background musics and monster sounds. Jean drawed the main character and NPCs.","ko":"수진이는 배경 음악과 괴물 소리들을 만들었어. Jean은 주인공과 NPC들을 그렸지.","fx":[{"w":"musics","r":"music","at":4,"t":"셀 수 없는 명사","m":"music은 셀 수 없으므로 복수형 불가"},{"w":"drawed","r":"drew","at":9,"t":"불규칙 과거형","m":"draw의 과거형은 drew (drawed 아님)"}]},{"n":7,"en":"Every character look real. Minwoo coded the game.","ko":"모든 캐릭터는 진짜처럼 보였어. 민우는 게임을 코딩했어.","fx":[{"w":"look","r":"looked","at":2,"t":"일반동사의 과거형","m":"과거 이야기: looked (look 아님)"}]},{"n":8,"en":"Him put all the parts together. Sounds, characters, and a story were in the game.","ko":"그는 모든 부분들을 합쳤어. 소리, 캐릭터들, 그리고 이야기가 게임 안에 있었어.","fx":[{"w":"Him","r":"He","at":0,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 He 사용"}]},{"n":9,"en":"Ours game looked and sounded good.","ko":"우리들의 게임은 좋아 보였고, 좋게 들렸어.","fx":[{"w":"Ours","r":"Our","at":0,"t":"인칭대명사의 소유격","m":"명사 game 앞에는 소유격 Our 사용"}]},{"n":10,"en":"Sumin played the game much times. Then she shared her ideas.","ko":"수민이는 게임을 여러 번 했어. 그러고 나서 그녀는 자기 생각을 공유했지.","fx":[{"w":"much","r":"many","at":4,"t":"수량 형용사 many/much","m":"셀 수 있는 복수명사 앞에는 many 사용"}]},{"n":11,"en":"She said, \"I enjoyed to play the game. But it ends to soon.","ko":"그녀는 \"나는 그 게임을 하는 것을 즐겼어. 하지만 그건 너무 빨리 끝나.","fx":[{"w":"to play","r":"playing","at":4,"t":"동명사","m":"enjoy는 동명사를 목적어로 취함: playing"},{"w":"to","r":"too","at":11,"t":"부사 too","m":"'너무'는 부사 too 사용 (to 아님)"}]},{"n":12,"en":"It needs one more stage. And add more items like an life jacket.\"","ko":"하나의 단계가 더 필요해. 그리고 구명조끼와 같은 더 많은 아이템을 추가해.\"라고 말했어.","fx":[{"w":"an","r":"a","at":10,"t":"관사 a/an","m":"life는 자음 소리로 시작하므로 a 사용"}]},{"n":13,"en":"So we added an ice lake stage and more usefuler items. Now our game looked greatly.","ko":"그래서 우리는 얼음 호수 단계와 좀 더 유용한 아이템들을 추가했어. 이제 우리 게임은 멋져 보였어.","fx":[{"w":"usefuler","r":"useful","at":9,"t":"비교급","m":"긴 형용사의 비교급은 more useful (usefuler 아님)"},{"w":"greatly","r":"great","at":15,"t":"형용사와 부사","m":"감각동사 look 뒤에는 형용사 great 사용"}]},{"n":14,"en":"We finally published the game on the app market. We got a lots of reviews!","ko":"우리는 마침내 그 게임을 앱 시장에 출시했어. 우리는 많은 후기도 받았어!","fx":[{"w":"lots","r":"lot","at":12,"t":"수량 표현","m":"'많은'은 a lot of 사용 (a lots of 아님)"}]},{"n":15,"en":"Making a game were hard, but we did it together as a team.","ko":"게임을 만드는 것은 힘들었지만, 우리는 팀으로서 함께 해냈지.","fx":[{"w":"were","r":"was","at":3,"t":"be동사의 과거형","m":"동명사 주어(단수 취급)에는 was 사용"}]}]},{"no":"48","t":"My Trip to Ganghwado","q":[{"n":1,"en":"Last weekend, I taked a day trip to Ganghwado with me family. Ganghwado is a island with a rich history and beautiful nature.","ko":"지난 주말에 나는 가족들과 강화도에 당일치기 여행을 갔다. 강화도는 풍부한 역사와 아름다운 자연을 지닌 섬이다.","fx":[{"w":"taked","r":"took","at":3,"t":"불규칙 과거형","m":"take의 과거형은 took 사용"},{"w":"me","r":"my","at":10,"t":"인칭대명사의 소유격","m":"명사 family 앞에는 소유격 my 사용"},{"w":"a","r":"an","at":14,"t":"관사 a/an","m":"island는 모음 소리라 an 사용"}]},{"n":2,"en":"Our first stop was Chojijin. In the 19th century, Joseon have battles against France, the U.S., and Japan here.","ko":"우리가 처음으로 들른 곳은 초지진이었다. 19세기에 조선은 이곳에서 프랑스, 미국, 일본에 대항하여 전투를 벌였다.","fx":[{"w":"have","r":"had","at":10,"t":"과거 시제","m":"19세기는 과거 시점: had (have 아님)"}]},{"n":4,"en":"What a historic places it is!","ko":"이곳은 얼마나 역사적인 장소인가!","fx":[{"w":"places","r":"place","at":3,"t":"감탄문","m":"What a 뒤에는 단수명사 place 사용"}]},{"n":5,"en":"Next, we visited Ganghwa Bugeunri Goindol. It is the most large stone tomb on Ganghwado.","ko":"다음으로 우리는 강화 부근리 고인돌에 갔다. 그것은 강화도에서 가장 큰 돌무덤이다.","fx":[{"w":"most large","r":"largest","at":9,"t":"최상급","m":"large의 최상급은 the largest 사용"}]},{"n":6,"en":"It are about 3,000 years old. It looks like a big table.","ko":"그것은 약 3,000년이 되었다. 그것은 큰 탁자처럼 생겼다.","fx":[{"w":"are","r":"is","at":1,"t":"be동사의 수일치","m":"주어 It(단수)는 is (are 아님)"}]},{"n":7,"en":"The cover stone is heavy than 50 cars! How could people move such a big stone so long ago?","ko":"고인돌의 덮개돌은 자동차 50대보다도 더 무겁다! 그렇게 오래전에 사람들은 어떻게 그렇게 큰 돌을 옮길 수 있었을까?","fx":[{"w":"heavy","r":"heavier","at":4,"t":"비교급","m":"than 앞에는 비교급 heavier 사용"}]},{"n":8,"en":"Our last stop was Dongmak Beach. I heard that this beach have one of the largest mud flat in the world.","ko":"우리가 마지막으로 들른 곳은 동막 해변이었다. 내가 듣기로 이 해변은 세계에서 가장 넓은 갯벌 중 하나를 갖고 있다.","fx":[{"w":"have","r":"has","at":11,"t":"3인칭 단수 현재형","m":"단수 주어 this beach에는 has 사용"},{"w":"flat","r":"flats","at":17,"t":"명사의 복수형","m":"one of 뒤에는 복수명사 mud flats 사용"}]},{"n":9,"en":"Lucky, we saw a wide mud flat that day. I took off me shoes and felt the mud.","ko":"운 좋게도 우리는 그날 넓은 갯벌을 보았다. 나는 신발을 벗고 갯벌을 느껴 보았다.","fx":[{"w":"Lucky","r":"Luckily","at":0,"t":"형용사와 부사","m":"문장 전체를 꾸미는 부사 Luckily 사용"},{"w":"me","r":"my","at":12,"t":"인칭대명사의 소유격","m":"명사 shoes 앞에는 소유격 my 사용"}]},{"n":10,"en":"A little small crabs walked by my feet.","ko":"작은 게 몇 마리가 내 발 옆을 걸어갔다.","fx":[{"w":"little","r":"few","at":1,"t":"수량 형용사 few/little","m":"셀 수 있는 crabs 앞에는 A few 사용"}]},{"n":11,"en":"Our trip came to an end with a beautiful sunset. I think I will never forgot this trip.","ko":"우리의 여행은 아름다운 일몰과 함께 끝이 났다. 나는 이 여행을 잊지 못할 것 같다.","fx":[{"w":"forgot","r":"forget","at":15,"t":"조동사","m":"조동사 will 뒤에는 동사원형: forget (forgot 아님)"}]}]},{"no":"49","t":"Growing Season","q":[{"n":1,"en":"El and Jo were the smallest students in the class. They was always together.","ko":"El과 Jo는 반에서 가장 작은 학생들이었다. 그들은 항상 함께였다.","fx":[{"w":"was","r":"were","at":11,"t":"be동사의 과거형","m":"주어 They(복수)에는 were 사용"}]},{"n":2,"en":"Them even watered the plants together in the class because they could not reach the pots lonely.","ko":"그들은 혼자서는 화분에 닿을 수 없었기 때문에 심지어는 교실에서 함께 식물에 물을 주기도 했다.","fx":[{"w":"Them","r":"They","at":0,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 They 사용"},{"w":"lonely","r":"alone","at":16,"t":"형용사와 부사","m":"동사 reach를 꾸미는 부사 alone 사용"}]},{"n":3,"en":"However, on the spring, something was DIFFERENT. Jo grew TALLER!","ko":"하지만 봄에는 무언가가 달라졌다. Jo의 키가 더 커졌다!","fx":[{"w":"on","r":"in","at":1,"t":"기본전치사","m":"'봄에'는 in the spring 사용"}]},{"n":4,"en":"Jo was tall than El, so Jo could water the plants alone. El felt smaller every day.","ko":"Jo는 El보다 키가 더 컸고, 그래서 Jo는 혼자 식물에 물을 줄 수 있었다. El은 매일 더 작아지는 기분이었다.","fx":[{"w":"tall","r":"taller","at":2,"t":"비교급","m":"than 앞에는 비교급 taller 사용"}]},{"n":5,"en":"On the last day of school, Mr. Diaz said, \"Class, you can to take an flower home and care for it over the summer.\"","ko":"학교 마지막 날에 Diaz 선생님이 말씀하셨다. \"여러분, 꽃을 하나 집에 가져가서 여름 동안 돌보세요.\"","fx":[{"w":"to take","r":"take","at":12,"t":"조동사","m":"조동사 can 뒤에는 동사원형 take 사용"},{"w":"an","r":"a","at":14,"t":"관사 a/an","m":"flower는 자음 소리로 시작하므로 a 사용"}]},{"n":6,"en":"All the student ran to the window. El's classmates reached for the pots over tinily El.","ko":"모든 학생이 창문으로 달려갔다. El의 학급 친구들은 작은 El 너머 화분에 손을 뻗었다.","fx":[{"w":"student","r":"students","at":2,"t":"명사의 복수형","m":"All the 뒤에는 복수명사 students 사용"},{"w":"tinily","r":"tiny","at":14,"t":"형용사와 부사","m":"명사 El 앞에는 형용사 tiny 사용"}]},{"n":7,"en":"They took every the pots with colorful flowers.","ko":"그들은 형형색색의 꽃이 있는 화분을 모두 가져갔다.","fx":[{"w":"every","r":"all","at":2,"t":"수량 형용사","m":"the와 함께 쓸 때는 all the pots 사용"}]},{"n":9,"en":"\"I feel just like your, little plant,\" said El. Mr. Diaz looked at El and said, \"That's a aster plant.","ko":"\"나도 너와 같은 심정이야, 작은 식물아.\" El이 말했다. Diaz 선생님이 El을 보며 말씀하셨다. \"그것은 과꽃 식물이야.","fx":[{"w":"your","r":"you","at":4,"t":"인칭대명사의 목적격","m":"전치사 like 뒤에는 목적격 you 사용"},{"w":"a","r":"an","at":17,"t":"관사 a/an","m":"모음 소리 aster 앞에는 an 사용"}]},{"n":10,"en":"In time, it'll grows and have beautiful flowers.\"","ko":"시간이 지나면, 그것은 자라서 아름다운 꽃을 피울 거야.\"","fx":[{"w":"grows","r":"grow","at":3,"t":"조동사","m":"will 뒤에는 동사원형 grow 사용"}]},{"n":11,"en":"\"But it's just a little green plant,\" said El. She were not so sure.","ko":"\"하지만 그것은 작은 녹색 식물일 뿐이에요.\" El이 말했다. 그녀는 확신이 없었다.","fx":[{"w":"were","r":"was","at":10,"t":"be동사의 과거형","m":"주어 She에는 was 사용"}]},{"n":12,"en":"\"You can have my zinnia plant,\" Jo said to El, \"I'll be to my grandma's all summer.\"","ko":"\"너는 내 백일홍을 가져도 돼.\" Jo가 El에게 말했다. \"나는 여름 내내 할머니 댁에 있을 거야.\"","fx":[{"w":"to","r":"at","at":12,"t":"기본전치사","m":"'~에(장소)'는 전치사 at 사용"}]},{"n":14,"en":"\"They'll been good friends—just like us!\" said Jo. El smiled.","ko":"\"그것들은 좋은 친구가 될 거야—바로 우리처럼!\" Jo가 말했다. El은 미소 지었다.","fx":[{"w":"been","r":"be","at":1,"t":"조동사","m":"조동사 will 뒤 동사원형: be (been 아님)"}]},{"n":15,"en":"El plant the flowers in her garden. It was growing season.","ko":"El은 그녀의 정원에 꽃들을 심었다. 성장하는 시기였다.","fx":[{"w":"plant","r":"planted","at":1,"t":"일반동사의 과거형","m":"과거 이야기이므로 planted (plant 아님)"}]},{"n":16,"en":"All summer long, she care for them.","ko":"여름 내내 그녀는 그것들을 돌보았다.","fx":[{"w":"care","r":"cared","at":4,"t":"일반동사의 과거형","m":"과거 이야기이므로 cared (care 아님)"}]},{"n":17,"en":"On the last day of summer, Jo came to El's house. El and Jo ran to the garden and sudden stopped.","ko":"여름의 마지막 날, Jo가 El의 집에 왔다. El과 Jo는 정원으로 달려가다가 갑자기 멈췄다.","fx":[{"w":"sudden","r":"suddenly","at":19,"t":"형용사와 부사","m":"동사 stopped를 꾸미는 부사 suddenly 사용"}]},{"n":18,"en":"Something was DIFFERENT! There were flower on the aster ... and El grew TALLER, TOO!","ko":"무엇인가가 달라졌다! 과꽃에 꽃들이 있었다 ... 그리고 El도 키가 더 커졌다!","fx":[{"w":"flower","r":"flowers","at":5,"t":"명사의 복수형","m":"There were 뒤에는 복수명사 flowers 사용"}]}]},{"no":"50","t":"Garam's Travel Diary to Tongyeong","q":[{"n":1,"en":"I getted up at six in the morning. It were the first day of my family trip to Tongyeong.","ko":"나는 아침 여섯 시에 일어났다. 통영으로의 우리 가족 여행의 첫날이었다.","fx":[{"w":"getted","r":"got","at":1,"t":"불규칙 과거형","m":"get의 과거형은 got (getted 아님)"},{"w":"were","r":"was","at":9,"t":"be동사의 과거형","m":"주어 It은 was (were 아님)"}]},{"n":2,"en":"I was exciting!","ko":"나는 신이 났다!","fx":[{"w":"exciting","r":"excited","at":2,"t":"감정 분사형용사","m":"'신이 난' 감정은 과거분사 excited 사용"}]},{"n":3,"en":"We arrived at Jungang Market at 1 p.m. There we had Chungmu gimbap for lunch. There were only rice inside the roll!","ko":"우리는 오후 1시에 중앙시장에 도착했다. 그곳에서 우리는 점심으로 충무김밥을 먹었다. 롤 안에는 밥만 있었다!","fx":[{"w":"were","r":"was","at":16,"t":"There is/are 구문","m":"셀 수 없는 rice에는 There was 사용"}]},{"n":5,"en":"It was a bit spicily but tasty.","ko":"그것은 약간 매웠지만 맛있었다.","fx":[{"w":"spicily","r":"spicy","at":4,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 spicy 사용"}]},{"n":7,"en":"On the afternoon, we went to Yi Sun-sin Park. There were a huge statue of Admiral Yi.","ko":"오후에 우리는 이순신 공원에 갔다. 이순신 장군의 거대한 동상이 있었다.","fx":[{"w":"On","r":"In","at":0,"t":"기본전치사","m":"'오후에'는 in the afternoon 사용"},{"w":"were","r":"was","at":10,"t":"There is/are 구문","m":"단수 statue이므로 was (were 아님)"}]},{"n":8,"en":"I imagined the great battle right off the coast of Tongyeong. Then we enjoyed to take a walk along the coast.","ko":"나는 통영의 해안 바로 앞에서 있었던 위대한 전투를 상상했다. 그다음에 우리는 해안을 따라 산책하는 것을 즐겼다.","fx":[{"w":"to take","r":"taking","at":14,"t":"동명사","m":"enjoy는 동명사 목적어: taking (to take 아님)"}]},{"n":9,"en":"The sunset was beautifully. I closed my eyes.","ko":"일몰이 아름다웠다. 나는 눈을 감았다.","fx":[{"w":"beautifully","r":"beautiful","at":3,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 beautiful 사용"}]},{"n":10,"en":"I could feel Admiral Yi's love for the country. Everything were really peaceful.","ko":"나는 이순신 장군의 나라에 대한 사랑을 느낄 수 있었다. 모든 것이 정말 평화로웠다.","fx":[{"w":"were","r":"was","at":10,"t":"be동사의 과거형","m":"Everything은 단수 취급하여 was 사용"}]},{"n":11,"en":"Early in the morning, we went at Dongpirang. There were many pretty painting on the walls.","ko":"아침 일찍, 우리는 동피랑에 갔다. 벽에는 많은 예쁜 그림들이 있었다.","fx":[{"w":"at","r":"to","at":6,"t":"기본전치사","m":"'~에 가다'는 went to 사용"},{"w":"painting","r":"paintings","at":12,"t":"명사의 복수형","m":"many 뒤에는 복수명사 paintings 사용"}]},{"n":12,"en":"It was the most good place for taking pictures! Mom and I taked hundreds of pictures.","ko":"그곳은 사진을 찍기에 최고의 장소였다! 엄마와 나는 수백 장의 사진을 찍었다.","fx":[{"w":"most good","r":"best","at":3,"t":"최상급","m":"good의 최상급은 best 사용"},{"w":"taked","r":"took","at":12,"t":"불규칙 과거형","m":"take의 과거형은 took (taked 아님)"}]},{"n":14,"en":"'Dong' mean 'east,' and 'pirang' means 'cliff.' There is also Seopirang.","ko":"'동'은 '동쪽'을 의미하고, '피랑'은 '절벽'을 의미한다. 서피랑도 있다.","fx":[{"w":"mean","r":"means","at":1,"t":"3인칭 단수 현재형","m":"3인칭 단수 주어 'Dong'에는 means 사용"}]},{"n":15,"en":"Next, we went to the Jeon Hyuck-lim Museum on Art. The painter's nickname is 'The Magician of Color.'","ko":"다음으로, 우리는 전혁림 미술관에 갔다. 그 화가의 별명은 '색채의 마술사'이다.","fx":[{"w":"on","r":"of","at":8,"t":"기본전치사","m":"'미술관'은 Museum of Art 사용"}]},{"n":16,"en":"He painted the sea of Tongyeong with various blue color. I enjoyed his paintings very many.","ko":"그는 통영의 바다를 다양한 푸른색으로 칠했다. 나는 그의 그림들을 아주 많이 즐겼다.","fx":[{"w":"color","r":"colors","at":9,"t":"명사의 복수형","m":"various 뒤에는 복수명사 colors 사용"},{"w":"many","r":"much","at":15,"t":"수량 형용사 many/much","m":"동사 enjoyed를 꾸미는 much 사용 (many 아님)"}]},{"n":17,"en":"What a great experiences! Going on a family trip are always fun.","ko":"정말 좋은 경험이었구나! 가족 여행을 가는 것은 언제나 재미있다.","fx":[{"w":"experiences","r":"experience","at":3,"t":"명사의 복수형","m":"a 뒤에는 단수명사 experience 사용"},{"w":"are","r":"is","at":9,"t":"주어와 동사의 수일치","m":"동명사 주어는 단수: is (are 아님)"}]}]},{"no":"51","t":"Happy Hangeul Day","q":[{"n":1,"en":"Reporter: Today is October 9, a special day for Hangeul, the Korean alphabets. I'm at a Hangeul festival now.","ko":"기자: 오늘은 한국의 문자인 한글을 위한 특별한 날인 10월 9일입니다. 저는 지금 한글 축제에 와 있습니다.","fx":[{"w":"alphabets","r":"alphabet","at":12,"t":"명사의 단수형","m":"Hangeul 하나를 가리키므로 단수 alphabet 사용"}]},{"n":2,"en":"People are enjoying fun activities here. They look happily and excited.","ko":"사람들은 이곳에서 재미있는 활동들을 즐기고 있습니다. 그들은 행복하고 신나 보입니다.","fx":[{"w":"happily","r":"happy","at":8,"t":"형용사와 부사","m":"look 뒤 보어는 형용사 happy 사용"}]},{"n":3,"en":"I'm going to interview three Hangeul lover.","ko":"저는 세 명의 한글 애호가를 인터뷰할 것입니다.","fx":[{"w":"lover","r":"lovers","at":6,"t":"명사의 복수형","m":"three 뒤에는 복수명사 lovers 사용"}]},{"n":5,"en":"Pueng: I like Hangeul because it is easy learn. I learned the 24 letter of Hangeul, and I am able to reads any Korean word now.","ko":"Pueng: 저는 한글이 배우기 쉽기 때문에 그것을 좋아해요. 저는 한글의 24개 글자를 배웠고, 이제 어떤 한글 단어든 읽을 수 있어요.","fx":[{"w":"learn","r":"to learn","at":8,"t":"to부정사의 부사적 용법","m":"형용사 easy 뒤에는 to learn 사용"},{"w":"letter","r":"letters","at":13,"t":"명사의 복수형","m":"숫자 24 뒤에는 복수명사 letters 사용"},{"w":"reads","r":"read","at":21,"t":"be able to","m":"to 뒤에는 동사원형 read 사용"}]},{"n":6,"en":"William: I like Hangeul because its history is amazed. A long time ago, most Koreans couldn't read or write.","ko":"William: 저는 한글의 역사가 대단하기 때문에 그것을 좋아해요. 오래전, 대부분의 한국인들은 읽거나 쓸 수 없었어요.","fx":[{"w":"amazed","r":"amazing","at":8,"t":"현재분사와 과거분사","m":"주어 history가 놀라게 하므로 amazing 사용"}]},{"n":7,"en":"King Sejong felt bad about this, so he created an new alphabet for him people.","ko":"세종대왕은 이것에 대해 안타깝게 느껴서, 그의 백성들을 위해 새로운 문자를 창제했어요.","fx":[{"w":"an","r":"a","at":9,"t":"관사 a/an","m":"자음 소리 new 앞에는 a 사용"},{"w":"him","r":"his","at":13,"t":"인칭대명사의 소유격","m":"people 앞에는 소유격 his 사용"}]},{"n":8,"en":"Reporter: You all real love Hangeul! How did you start learning it?","ko":"기자: 여러분 모두 한글을 정말 사랑하시네요! 여러분은 어떻게 그것을 배우기 시작하셨나요?","fx":[{"w":"real","r":"really","at":3,"t":"형용사와 부사","m":"동사 love를 꾸미는 부사 really 사용"}]},{"n":9,"en":"Pueng: I'm an big fan of K-pop songs. Because I wanted to sing Korean songs, I started learning Hangeul.","ko":"Pueng: 저는 케이팝 노래의 열렬한 팬이에요. 저는 한국 노래를 부르고 싶었기 때문에, 한글을 배우기 시작했어요.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 big 앞에는 a 사용"}]},{"n":10,"en":"Now I can sings many K-pop songs!","ko":"이제 저는 많은 케이팝 노래를 부를 수 있어요!","fx":[{"w":"sings","r":"sing","at":3,"t":"조동사 뒤 동사원형","m":"can 뒤에는 동사원형 sing: sings 아님"}]}]},{"no":"52","t":"Our Digital Footprints","q":[{"n":1,"en":"When you walk on snow, you leaves footprints. When you uses social media and visit websites, you leave data.","ko":"당신은 눈 위를 걸을 때, 발자국을 남깁니다. 당신이 소셜 미디어를 사용하고 웹사이트를 방문할 때, 데이터를 남깁니다.","fx":[{"w":"leaves","r":"leave","at":6,"t":"일반동사 현재형","m":"주어 you에는 동사원형: leave (leaves 아님)"},{"w":"uses","r":"use","at":10,"t":"일반동사 현재형","m":"주어 you에는 동사원형 use 사용"}]},{"n":2,"en":"They are you digital footprints.","ko":"그것들이 당신의 디지털 발자국입니다.","fx":[{"w":"you","r":"your","at":2,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 your 사용"}]},{"n":4,"en":"Yesterday, my friend found an photo on the internet. It was me with a funnily face!","ko":"어제 내 친구가 인터넷에서 사진 하나를 찾았어. 그건 우스운 표정을 하고 있는 나였어!","fx":[{"w":"an","r":"a","at":4,"t":"관사 a/an","m":"photo는 자음 소리로 시작하므로 a photo"},{"w":"funnily","r":"funny","at":14,"t":"형용사와 부사","m":"명사 face를 꾸미는 형용사 funny 사용"}]},{"n":5,"en":"I wanted run away. I posted the photo on my social media account two year ago and forget about it.","ko":"나는 도망치고 싶었어. 나는 2년 전에 내 소셜 미디어 계정에 그 사진을 올렸고 그것에 대해 잊고 있었어.","fx":[{"w":"run","r":"to run","at":2,"t":"to부정사의 명사적 용법","m":"want 뒤에는 to부정사 to run 사용"},{"w":"year","r":"years","at":14,"t":"명사의 복수형","m":"two 뒤에는 복수명사 years 사용"},{"w":"forget","r":"forgot","at":17,"t":"동사의 시제","m":"과거 posted와 병렬이므로 과거형 forgot 사용"}]},{"n":6,"en":"I typed my name on the internet. Then, I finded my address, phone number, and school name.","ko":"나는 인터넷에 내 이름을 쳤어. 그리고 나는 내 주소, 전화번호, 그리고 학교 이름을 발견했어.","fx":[{"w":"finded","r":"found","at":9,"t":"불규칙 과거형","m":"find의 과거형은 found (finded 아님)"}]},{"n":7,"en":"Did I share that informations? Is there other information about me on the internet?","ko":"내가 그 정보를 공유했었나? 인터넷에 나에 대한 다른 정보가 있을까?","fx":[{"w":"informations","r":"information","at":4,"t":"셀 수 없는 명사","m":"information은 셀 수 없는 명사라 복수형 불가"}]},{"n":9,"en":"This afternoon, I logged into my email account on the library computer and printed my homeworks.","ko":"오늘 오후, 나는 도서관 컴퓨터에서 내 이메일 계정에 로그인해서 숙제를 인쇄했어.","fx":[{"w":"homeworks","r":"homework","at":15,"t":"셀 수 없는 명사","m":"homework는 셀 수 없는 명사라 복수형 불가"}]},{"n":10,"en":"Then, I met a friend and walked home with she. But wait a minute.","ko":"그리고 나는 친구를 만났고 그녀와 함께 집으로 걸어왔어. 하지만 잠시만.","fx":[{"w":"she","r":"her","at":9,"t":"인칭대명사의 목적격","m":"전치사 with 뒤에는 목적격 her 사용"}]},{"n":11,"en":"Did I logged out of my email account? Oh, no!","ko":"내가 이메일 계정에서 로그아웃했었나? 어떡해!","fx":[{"w":"logged","r":"log","at":2,"t":"일반동사의 과거 의문문","m":"Did 뒤에는 동사원형 log 사용"}]},{"n":13,"en":"What do this stories show? You should check you posts and comments on your social media account regular.","ko":"이 이야기들은 무엇을 보여 주나요? 당신은 당신의 소셜 미디어 계정에 올려진 게시물과 댓글을 정기적으로 확인해야 합니다.","fx":[{"w":"this","r":"these","at":2,"t":"지시형용사","m":"복수명사 stories 앞에는 these 사용"},{"w":"you","r":"your","at":8,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 your 사용"},{"w":"regular","r":"regularly","at":17,"t":"형용사와 부사","m":"동사 check를 꾸미는 부사 regularly 사용"}]},{"n":15,"en":"Log out of your email or social media account when you are not use your own computer. Remember!","ko":"자신의 컴퓨터를 사용하고 있지 않을 때는 이메일이나 소셜 미디어 계정에서 로그아웃하세요. 기억하세요!","fx":[{"w":"use","r":"using","at":13,"t":"현재진행형","m":"be동사 뒤에는 동사원형+ing, using 사용"}]},{"n":16,"en":"The internet forgets never.","ko":"인터넷은 절대 잊지 않아요.","fx":[{"w":"forgets never","r":"never forgets","at":2,"t":"빈도부사의 위치","m":"빈도부사 never는 일반동사 앞에 위치"}]}]},{"no":"53","t":"What Should I Do?","q":[{"n":1,"en":"These days, we spend a lot time in the digital world. We like chatting and posting photos online.","ko":"요즘 우리는 디지털 세계에서 많은 시간을 보냅니다. 우리는 온라인에서 대화하고 사진을 게시하는 것을 좋아합니다.","fx":[{"w":"time","r":"of time","at":6,"t":"수량 표현","m":"a lot 뒤에는 of가 필요: a lot of time"}]},{"n":2,"en":"We also enjoy watch videos. But we sometimes face unhappy situation.","ko":"우리는 영상을 보는 것도 즐깁니다. 하지만 우리는 가끔 언짢은 상황에 직면합니다.","fx":[{"w":"watch","r":"watching","at":3,"t":"동명사","m":"enjoy 뒤에는 동명사 watching 사용"},{"w":"situation","r":"situations","at":10,"t":"명사의 복수형","m":"형용사 뒤 가산명사는 복수형 situations 사용"}]},{"n":3,"en":"Three students share their stories here. Please give them advices.","ko":"세 학생이 그들의 이야기를 여기에 공유합니다. 그들에게 조언해 주세요.","fx":[{"w":"advices","r":"advice","at":9,"t":"셀 수 없는 명사","m":"advice는 셀 수 없는 명사라 -s 안 붙임"}]},{"n":4,"en":"My friend, Jian, sends me too much texts. He even texts in the middle of the night.","ko":"내 친구 지안이는 내게 너무 많은 문자를 보낸다. 그는 심지어 한밤중에도 문자를 보낸다.","fx":[{"w":"much","r":"many","at":6,"t":"수량 형용사 many/much","m":"셀 수 있는 texts 앞에는 many 사용"}]},{"n":5,"en":"When I don't reply, he sends me angrily emojis. Jian is my good friends, and I want be kind to him.","ko":"내가 답장하지 않을 때는 그는 내게 화난 표정의 이모지를 보낸다. 지안이는 나의 좋은 친구이고, 나는 그에게 친절하게 대하고 싶다.","fx":[{"w":"angrily","r":"angry","at":7,"t":"형용사와 부사","m":"명사 emojis 수식은 형용사 angry 사용"},{"w":"friends","r":"friend","at":13,"t":"명사의 복수형","m":"Jian은 한 명이므로 단수 friend 사용"},{"w":"be","r":"to be","at":17,"t":"to부정사","m":"want 뒤에는 to be 사용"}]},{"n":7,"en":"↳ It sounds stressfully. Only text him short, simple messages.","ko":"↳ 스트레스받을 것 같아. 그에게 그냥 짧고 간단한 메시지를 보내.","fx":[{"w":"stressfully","r":"stressful","at":3,"t":"형용사와 부사","m":"sounds 뒤 보어는 형용사 stressful 사용"}]},{"n":9,"en":"Yumin, Sia, and I is good friends. Yumin's hobby is posting photos online.","ko":"유민이, 시아 그리고 나는 좋은 친구 사이이다. 유민이의 취미는 온라인에 사진 올리기이다.","fx":[{"w":"is","r":"are","at":4,"t":"be동사의 긍정문","m":"주어가 복수(셋)이므로 are 사용"}]},{"n":10,"en":"Yesterday, when I saw photos on she social media account, I was surprising.","ko":"어제 그녀의 소셜 미디어 계정에서 사진을 봤을 때 나는 깜짝 놀랐다.","fx":[{"w":"she","r":"her","at":6,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 her 사용"},{"w":"surprising","r":"surprised","at":12,"t":"현재분사와 과거분사","m":"사람이 놀란 감정은 surprised 사용"}]},{"n":11,"en":"In one photo, Sia has a strange face and make a funny gesture. It had a lot of likes and rude comments about her.","ko":"한 사진에서 시아가 이상한 표정을 짓고 웃긴 제스처를 하고 있었다. 그것에는 많은 '좋아요'와 그녀에 대한 예의 없는 댓글이 있었다.","fx":[{"w":"make","r":"makes","at":9,"t":"3인칭 단수 현재형","m":"주어 Sia는 3인칭 단수: makes (make 아님)"}]},{"n":12,"en":"Sia knows nothing about this. Should I tell she?","ko":"시아는 이것에 대해 아무것도 알지 못한다. 내가 그녀에게 말해 줘야 할까?","fx":[{"w":"she","r":"her","at":8,"t":"인칭대명사의 목적격","m":"동사 tell 뒤에는 목적격 her 사용"}]},{"n":13,"en":"↳ Of course! You should to tell her.","ko":"↳ 물론이지! 너는 그녀에게 말해야 해.","fx":[{"w":"to tell","r":"tell","at":5,"t":"조동사","m":"조동사 should 뒤에는 동사원형 tell 사용"}]},{"n":15,"en":"↳ Ask Yumin first. Maybe she don't understand the problem.","ko":"↳ 유민이에게 먼저 물어봐. 어쩌면 그녀가 문제를 이해하지 못하고 있을지도 몰라.","fx":[{"w":"don't","r":"doesn't","at":6,"t":"do동사의 부정문","m":"she는 3인칭 단수: doesn't (don't 아님)"}]},{"n":16,"en":"I was in a group chat with four friend. We enjoyed talking about much topics: sports, music, teachers, and classmates.","ko":"나는 친구 네 명과 함께 그룹 대화방에 있었다. 우리는 스포츠나 음악, 선생님들 그리고 학급 친구들과 같은 많은 주제에 관해 이야기하는 것을 즐겼다.","fx":[{"w":"friend","r":"friends","at":8,"t":"명사의 복수형","m":"four 뒤에는 복수명사 friends 사용"},{"w":"much","r":"many","at":13,"t":"수량 형용사 many/much","m":"셀 수 있는 topics 앞에는 many 사용"}]},{"n":17,"en":"I sometimes shared my problems with these friend. One day, one of them invited his friend to our group chat.","ko":"나는 가끔 이 친구들에게 나의 고민을 공유했다. 어느 날, 그들 중 한 명이 우리의 그룹 대화방에 그의 친구를 초대했다.","fx":[{"w":"friend","r":"friends","at":7,"t":"지시형용사","m":"these 뒤에는 복수명사 friends 사용"}]},{"n":18,"en":"Later, he invited another new persons. Now I doesn't feel good in the new group chat.","ko":"그 후에 그는 또 다른 새로운 사람을 초대했다. 이제 나는 새로운 그룹 대화방에서 기분이 좋지 않다.","fx":[{"w":"persons","r":"person","at":5,"t":"명사의 단수형","m":"another 뒤에는 단수명사 person 사용"},{"w":"doesn't","r":"don't","at":8,"t":"do동사의 부정문","m":"주어 I에는 don't 사용"}]},{"n":19,"en":"↳ I understand. Your friend was carelessly.","ko":"↳ 나는 이해가 돼. 네 친구가 경솔했어.","fx":[{"w":"carelessly","r":"careless","at":6,"t":"형용사와 부사","m":"be동사 보어는 형용사 careless 사용"}]}]},{"no":"54","t":"Join the Zero-Waste Challenge","q":[{"n":1,"en":"Every days, we produce lots of waste, and the Earth are getting sicker and sicker. Do you want to save the Earth?","ko":"매일 우리는 많은 쓰레기를 만들고, 지구는 점점 더 병들고 있습니다. 여러분은 지구를 구하고 싶나요?","fx":[{"w":"days","r":"day","at":1,"t":"명사의 단수형","m":"every 뒤에는 단수명사 day 사용"},{"w":"are","r":"is","at":10,"t":"be동사의 긍정문","m":"주어 the Earth(단수)에는 is 사용"}]},{"n":2,"en":"Then, join the zero-waste challenge, and share you stories.","ko":"그렇다면 제로 웨이스트 챌린지에 동참하고 여러분의 이야기를 공유해 주세요.","fx":[{"w":"you","r":"your","at":7,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 your 사용"}]},{"n":3,"en":"Olivia: My birthday was last Saturday, and my family and I eated out. There were lots of leftovers, but we brought them home.","ko":"Olivia: 내 생일은 지난 토요일이었고, 가족들과 나는 외식을 했어. 남은 음식이 많아서 우리는 그것들을 집으로 가져왔어.","fx":[{"w":"eated","r":"ate","at":11,"t":"불규칙 과거형","m":"eat의 과거형은 ate (eated 아님)"}]},{"n":4,"en":"The next day, I maked a nice lunch out of them. FYI, you can find great cooking ideas for leftovers on the Internet.","ko":"그다음 날, 나는 그것들로 맛있는 점심을 만들었어. 참고로, 인터넷에서 남은 음식을 위한 멋진 요리 아이디어를 찾을 수 있어.","fx":[{"w":"maked","r":"made","at":4,"t":"불규칙 과거형","m":"make의 과거형은 made (maked 아님)"}]},{"n":5,"en":"Domingo: My dog teared my bag. I wanted to buy a new one, but I thought again.","ko":"Domingo: 내 개가 내 가방을 찢었어. 나는 새것을 사고 싶었지만, 다시 생각해 봤어.","fx":[{"w":"teared","r":"tore","at":3,"t":"불규칙 과거형","m":"tear의 과거형은 tore (teared 아님)"}]},{"n":6,"en":"I learned that reusing is importantly for zero-waste living. So, I decided to fix it and reuse it.","ko":"나는 재사용이 제로 웨이스트 생활에 중요하다고 배웠어. 그래서 나는 그것을 수선해서 재사용하기로 결심했어.","fx":[{"w":"importantly","r":"important","at":5,"t":"형용사와 부사","m":"be동사 보어는 형용사 important 사용"}]},{"n":7,"en":"I'm not very good in sewing, and I don't think that the bag looks perfectly. I guess it's all right.","ko":"나는 바느질을 아주 잘하지 못하고, 가방이 완벽해 보인다고 생각하진 않아. 그래도 괜찮은 것 같아.","fx":[{"w":"in","r":"at","at":4,"t":"기본전치사","m":"'~을 잘하는'은 good at 사용"},{"w":"perfectly","r":"perfect","at":14,"t":"형용사와 부사","m":"looks 뒤 보어는 형용사 perfect 사용"}]},{"n":9,"en":"Emma: I often uses food delivery services, but today I didn't.","ko":"Emma: 나는 종종 음식 배달 서비스를 이용하는데, 오늘은 이용하지 않았어.","fx":[{"w":"uses","r":"use","at":3,"t":"일반동사의 현재형","m":"주어 I에는 use 사용"}]},{"n":10,"en":"Instead, I walked to me favorite restaurant with an reusable container and picked up the food.","ko":"대신, 재사용할 수 있는 용기를 가지고 내가 가장 좋아하는 식당에 걸어가서 음식을 가져왔어.","fx":[{"w":"me","r":"my","at":4,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"},{"w":"an","r":"a","at":8,"t":"관사 a/an","m":"자음 소리 reusable 앞에는 a 사용"}]},{"n":11,"en":"I heard that plastic never go away completely. I didn't use many single-use plastic today.","ko":"플라스틱은 절대로 완전히 없어지지 않는다고 들었어. 나는 오늘 어떤 일회용 플라스틱도 사용하지 않았어.","fx":[{"w":"go","r":"goes","at":5,"t":"3인칭 단수 현재형","m":"주어 plastic은 단수: goes (go 아님)"},{"w":"many","r":"any","at":11,"t":"수량 형용사 any/many","m":"셀 수 없는 plastic 앞에는 any 사용"}]},{"n":13,"en":"Minsu: Yesterday, I took some plastic and glass bottles to an recycling machine near my house.","ko":"민수: 어제 나는 플라스틱과 유리병 몇 개를 집 근처에 있는 재활용 기계에 가져갔어.","fx":[{"w":"an","r":"a","at":10,"t":"관사 a/an","m":"자음 소리 recycling 앞에는 a 사용"}]},{"n":14,"en":"I put them into the machine one by one, and I got some points in return. Who can I do with those points?","ko":"나는 그것들을 하나씩 기계에 집어넣었고, 대가로 포인트를 받았어. 그 포인트로 무엇을 할 수 있냐고?","fx":[{"w":"Who","r":"What","at":16,"t":"의문사","m":"'무엇'을 묻는 What 사용 (Who 아님)"}]},{"n":15,"en":"Well, I can use them like moneys. Don't you think that's cool?","ko":"음, 나는 그것들을 돈처럼 사용할 수 있어. 멋지다고 생각하지 않니?","fx":[{"w":"moneys","r":"money","at":6,"t":"셀 수 없는 명사","m":"money는 셀 수 없는 명사라 -s 안 붙임"}]}]},{"no":"55","t":"Food Around the World","q":[{"n":1,"en":"There is many islands in Hawaii. People in Hawaii enjoys eating fish.","ko":"하와이에는 많은 섬이 있다. 하와이 사람들은 생선을 먹는 것을 즐긴다.","fx":[{"w":"is","r":"are","at":1,"t":"There be동사 수일치","m":"복수 islands에는 are (is 아님)"},{"w":"enjoys","r":"enjoy","at":9,"t":"동사의 수일치","m":"주어 People(복수)에는 enjoy 사용"}]},{"n":2,"en": :"수량 형용사 many","m":"Many 뒤에는 복수명사 people 사용"}]},{"n":13,"en":"Tom yum goong has shrimp in them. People like eating tom yum goong with a rice.","ko":"똠얌꿍은 그 안에 새우가 들어 있다. 사람들은 밥과 함께 똠얌꿍을 먹는 것을 좋아한다.","fx":[{"w":"them","r":"it","at":6,"t":"인칭대명사","m":"Tom yum goong은 단수, 대명사 it 사용"},{"w":"a rice","r":"rice","at":14,"t":"셀 수 없는 명사","m":"rice는 셀 수 없으므로 a 없이 with rice 사용"}]}]},{"no":"56","t":"Who Do I Want to Be?","q":[{"n":1,"en":"My teacher told we about tomorrow's presentation. He asked us, \"What does you want to be when you grow up?\"","ko":"나의 선생님은 우리에게 내일 발표에 대해서 말씀하셨다. 선생님은 우리에게 “여러분은 커서 무엇이 되고 싶은가요?”라고 물어보셨다.","fx":[{"w":"we","r":"us","at":3,"t":"인칭대명사의 목적격","m":"동사 told 뒤에는 목적격 us 사용"},{"w":"does","r":"do","at":11,"t":"do/does 의문문","m":"주어 you에는 do 사용 (does 아님)"}]},{"n":3,"en":"What do me want to be? I have not idea.\"","ko":"내가 뭐가 되고 싶냐고? 모르겠어.”","fx":[{"w":"me","r":"I","at":2,"t":"인칭대명사의 주격","m":"의문문의 주어 자리에는 주격 I 사용"},{"w":"not","r":"no","at":8,"t":"no와 not","m":"명사 idea 앞에는 형용사 no 사용"}]},{"n":4,"en":"In home, I asked my family about their dream jobs. Dad said, \"Well, I wanted to be a astronaut when I were young.","ko":"집에서 나는 가족들에게 그들의 꿈의 직업에 대해 물었다. 아빠는 말씀하셨다. “글쎄, 나는 어렸을 때는 우주 비행사가 되고 싶었단다.","fx":[{"w":"In","r":"At","at":0,"t":"기본전치사","m":"\"집에서\"는 전치사 at home 사용"},{"w":"a","r":"an","at":17,"t":"관사 a/an","m":"모음 소리 astronaut 앞에는 an 사용"},{"w":"were","r":"was","at":21,"t":"be동사의 과거형","m":"주어 I에는 was 사용"}]},{"n":5,"en":"I wanted travel to the moon.\"","ko":"나는 달로 여행 가고 싶었거든.”","fx":[{"w":"travel","r":"to travel","at":2,"t":"to부정사","m":"wanted 뒤에는 to travel(to부정사) 사용"}]},{"n":6,"en":"\"When I grow up, I'm going to be a robot designers,\" said me big sister Angela.","ko":"“나는 커서 로봇 디자이너가 될 거야.” 나의 누나 Angela가 말했다.","fx":[{"w":"designers","r":"designer","at":10,"t":"명사의 단수/복수","m":"a 뒤에는 단수명사 designer 사용"},{"w":"me","r":"my","at":12,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"}]},{"n":8,"en":"Dad asked I, \"What about you, Noah? What does you want to be?\"","ko":"아빠가 내게 물어보셨다. “Noah, 너는 어떠니? 너는 무엇이 되고 싶어?”","fx":[{"w":"I","r":"me","at":2,"t":"인칭대명사의 목적격","m":"동사 asked 뒤에는 목적격 me 사용"},{"w":"does","r":"do","at":8,"t":"do/does 의문문","m":"주어 you에는 do 사용"}]},{"n":10,"en":"Later, Mom came to home from work.","ko":"나중에 엄마가 퇴근하셨다.","fx":[{"w":"to home","r":"home","at":3,"t":"기본전치사","m":"home은 부사로 쓰여 전치사 없이 came home 사용"}]},{"n":11,"en":"\"Noah, are everything okay?\" she asked.","ko":"“Noah, 모든 것이 괜찮니?” 엄마가 물으셨다.","fx":[{"w":"are","r":"is","at":1,"t":"be동사의 의문문","m":"everything은 단수 취급하므로 is 사용"}]},{"n":12,"en":"\"No, Mom. Something is wrongly with me.","ko":"“아니요, 엄마. 저한테 뭔가 문제가 있어요.","fx":[{"w":"wrongly","r":"wrong","at":4,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 wrong 사용"}]},{"n":13,"en":"I'm not going to be anything on the future.\"","ko":"저는 미래에 아무것도 되지 못할 거예요.”","fx":[{"w":"on","r":"in","at":6,"t":"기본전치사","m":"\"미래에\"는 in the future 사용"}]},{"n":15,"en":"\"Everyone have a dream job. Even Sophie do.","ko":"“모두에게는 꿈의 직업이 있잖아요. 심지어 Sophie에게도요.","fx":[{"w":"have","r":"has","at":1,"t":"3인칭 단수 현재형","m":"주어 Everyone(단수)은 has: have 아님"},{"w":"do","r":"does","at":7,"t":"3인칭 단수 현재형","m":"주어 Sophie(3인칭 단수)에는 does 사용"}]},{"n":16,"en":"And she are only three!\" I cried.","ko":"그리고 걔는 고작 세 살이라고요!” 나는 울부짖었다.","fx":[{"w":"she are","r":"she's","at":1,"t":"be동사의 현재형","m":"주어 she에는 is(she's) 사용"}]},{"n":17,"en":"\"Oh, Noah. I don't know mine dream job.\"","ko":"“오, Noah. 나는 내 꿈의 직업을 몰라.”","fx":[{"w":"mine","r":"my","at":5,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용 (mine 아님)"}]},{"n":18,"en":"\"What? But you're a grown-up, and you have an job,\" I said.","ko":"“뭐라고요? 그렇지만 엄마는 어른이고 직업이 있잖아요.” 나는 말했다.","fx":[{"w":"an","r":"a","at":8,"t":"관사 a/an","m":"job은 자음 소리로 시작하므로 a 사용"}]},{"n":19,"en":"\"And you takes care of everyone. You have the answers to everything,\" I went on.","ko":"“그리고 엄마는 모든 사람을 돌보시잖아요. 엄마는 모든 것에 대한 답을 갖고 있으시고요.” 나는 계속했다.","fx":[{"w":"takes","r":"take","at":2,"t":"일반동사의 현재형","m":"주어 you는 take (takes 아님)"}]},{"n":20,"en":"\"You're always nicely, and you're not afraid of anything. Most of all, you're my mom!\"","ko":"“엄마는 언제나 친절하시고 어떤 것도 두려워하지 않으시잖아요. 무엇보다도 엄마는 제 엄마잖아요!”","fx":[{"w":"nicely","r":"nice","at":2,"t":"형용사와 부사","m":"be동사 뒤 보어 자리에는 형용사 nice 사용"}]},{"n":21,"en":"Mom smiled and said, \"I hope you are right. I wanted to become that kind of persons.\"","ko":"엄마는 미소를 지으며 말씀하셨다. “네가 맞기를 바라. 나는 그런 종류의 사람이 되고 싶었거든.”","fx":[{"w":"persons","r":"person","at":16,"t":"명사의 단수/복수","m":"that kind of 뒤에는 단수명사 person 사용"}]},{"n":23,"en":"Just then, I had a idea. \"That's it!","ko":"바로 그때, 나는 생각이 떠올랐다. “바로 그거야!","fx":[{"w":"a","r":"an","at":4,"t":"관사 a/an","m":"모음 소리 idea 앞에는 an 사용"}]}]},{"no":"57","t":"My Summer Days in Alaska","q":[{"n":1,"en":"Last summer, I visit my uncle in Alaska. Can you guess the time in the picture?","ko":"지난 여름, 나는 알래스카에 계신 삼촌을 방문했어. 사진 속 시간을 추측할 수 있겠니?","fx":[{"w":"visit","r":"visited","at":3,"t":"동사의 과거형","m":"Last summer(과거)이므로 visited (visit 아님)"}]},{"n":2,"en":"It was actual 9 p.m. My uncle said, \"The sun don't set from May to July. So Alaska is 'The Land of the Midnight Sun.'\"","ko":"사실은 오후 9시였어. 나의 삼촌은 말씀하셨어. \"태양이 5월부터 7월까지 지지 않는단다. 그래서 알래스카는 '한밤중의 태양의 땅'이라고 하지.\"","fx":[{"w":"actual","r":"actually","at":2,"t":"형용사와 부사","m":"동사 was를 꾸미는 부사 actually 사용"},{"w":"don't","r":"doesn't","at":10,"t":"do 부정문","m":"주어 The sun(3인칭 단수)에는 doesn't 사용"}]},{"n":3,"en":"One day, my uncle took I and my cousin, Jimmy, to the Alaska State Fair. Jimmy signed up for the wood cutting game.","ko":"어느 날, 삼촌이 나와 나의 사촌, Jimmy를 알래스카주 축제에 데려가셨어. Jimmy는 나무 자르기 게임을 신청했어.","fx":[{"w":"I","r":"me","at":5,"t":"인칭대명사의 목적격","m":"동사 뒤 목적어는 목적격 me 사용"}]},{"n":4,"en":"People started cut the wood fast. I cheered for him, but he didn't got the prize.","ko":"사람들은 나무를 빠르게 자르기 시작했어. 나는 Jimmy를 응원했지만, 그는 상을 타진 못 했어.","fx":[{"w":"cut","r":"cutting","at":2,"t":"동명사","m":"start 뒤 목적어는 -ing 또는 to부정사: cutting"},{"w":"got","r":"get","at":13,"t":"do 부정문","m":"didn't 뒤에는 동사원형 get 사용"}]},{"n":6,"en":"We got hungry, so we goed to the food court. We had salmon sandwich.","ko":"우리는 배가 고파져서 푸드 코트에 갔어. 우리는 연어 샌드위치를 먹었지.","fx":[{"w":"goed","r":"went","at":5,"t":"불규칙 과거형","m":"go의 과거형은 went (goed 아님)"},{"w":"sandwich","r":"sandwiches","at":13,"t":"명사의 복수형","m":"여러 개이므로 복수 sandwiches 사용"}]},{"n":8,"en":"They were tasty because the salmon was such fresh.","ko":"연어가 매우 신선했기 때문에 연어 샌드위치는 맛있었어.","fx":[{"w":"such","r":"so","at":7,"t":"so와 such","m":"형용사 앞에는 so, such는 명사 앞에 사용"}]},{"n":9,"en":"We, then, went to the Giant Vegetable Contest. All the vegetables was huge!","ko":"우리는 그러고 나서 거대 채소 대회에 갔어. 모든 채소들은 거대했어!","fx":[{"w":"was","r":"were","at":11,"t":"be동사의 과거형","m":"주어 vegetables는 복수: were (was 아님)"}]},{"n":10,"en":"My uncle entered the contest with his pumpkin. It was more big than a pig!","ko":"나의 삼촌은 그의 호박을 가지고 대회에 참가했어. 그것은 돼지보다 더 컸어!","fx":[{"w":"more big","r":"bigger","at":10,"t":"비교급","m":"짧은 형용사는 big의 비교급 bigger 사용"}]},{"n":11,"en":"\"The crops get about 20 hour of sunlight a day during summer. So they grow bigger and more sweeter,\" my uncle said.","ko":"\"농작물들은 여름 동안 하루에 약 20시간의 햇빛을 받지. 그래서 농작물들이 더 크고 더 달게 자라는 거야.\"라고 삼촌이 말했어.","fx":[{"w":"hour","r":"hours","at":5,"t":"명사의 복수형","m":"20 뒤에는 복수명사 hours 사용"},{"w":"more sweeter","r":"sweeter","at":17,"t":"비교급","m":"sweet의 비교급은 sweeter (more와 중복 불가)"}]},{"n":12,"en":"When we left the fair in 10 p.m., it was not so dark. It was an fun day.","ko":"우리가 밤 10시에 축제를 떠났을 때, 그렇게 어둡지 않았어. 재밌는 하루였어.","fx":[{"w":"in","r":"at","at":5,"t":"기본전치사","m":"'~시에'는 전치사 at 사용"},{"w":"an","r":"a","at":15,"t":"관사 a/an","m":"fun은 자음 소리라 a fun day 사용"}]}]},{"no":"58","t":"Trees for Goals","q":[{"n":1,"en":"Lesein Mutunkei are a young man from Kenya. He loves playing soccer, and he cares about the environment.","ko":"Lesein Mutunkei는 케냐의 청년이다. 그는 축구하는 것을 정말 좋아하고 환경에 대해 관심이 있다.","fx":[{"w":"are","r":"is","at":2,"t":"be동사 수일치·과거","m":"주어 Lesein Mutunkei(단수): is (are 아님)"}]},{"n":2,"en":"In the past, people on Kenya cut down a lot of tree for farming. Every days, more than 50 soccer fields of forest land disappeared.","ko":"과거에 케냐 사람들은 농사를 위해 많은 나무를 베었다. 매일 50개 이상의 축구 경기장 크기의 숲이 사라졌다.","fx":[{"w":"on","r":"in","at":4,"t":"기본전치사","m":"'케냐에 있는'은 전치사 in 사용"},{"w":"tree","r":"trees","at":11,"t":"명사의 복수형","m":"a lot of 뒤 복수명사 trees 사용"},{"w":"days","r":"day","at":15,"t":"every + 단수명사","m":"Every 뒤에는 단수명사 day 사용"}]},{"n":4,"en":"He came up with a idea. It was to planting one tree for each goal in his soccer games.","ko":"그는 아이디어를 하나 생각해 냈다. 그것은 자신의 축구 경기에서 골을 하나 넣을 때마다 나무를 한 그루씩 심는 것이었다.","fx":[{"w":"a","r":"an","at":4,"t":"관사 a/an","m":"모음 소리 idea 앞에는 an 사용"},{"w":"planting","r":"plant","at":9,"t":"to부정사","m":"be to + 동사원형: to plant (planting 아님)"}]},{"n":6,"en":"His soccer team members joined to his campaign and planted eleven trees for each goals.","ko":"그의 축구팀 동료들도 그의 캠페인에 참여했고, 골을 하나 넣을 때마다 열한 그루의 나무를 심었다.","fx":[{"w":"to his","r":"his","at":5,"t":"기본전치사","m":"join은 전치사 없이 목적어를 받음 (joined his)"},{"w":"goals","r":"goal","at":14,"t":"every/each + 단수명사","m":"each 뒤에는 단수명사 goal 사용"}]},{"n":7,"en":"Eleven trees stands for the eleven players on a soccer team. Soon, his school baseball team also joined.","ko":"열한 그루의 나무는 축구팀의 열한 명의 선수들을 상징했다. 곧, 그의 학교 야구팀 또한 캠페인에 참여했다.","fx":[{"w":"stands","r":"stood","at":2,"t":"시제","m":"과거 이야기이므로 과거형 stood (stands 아님)"}]},{"n":8,"en":"Thanks of the campaign, his school planted nearly 1,500 trees around Nairobi.","ko":"캠페인 덕분에 그의 학교는 나이로비 주변에 거의 1,500그루의 나무를 심었다.","fx":[{"w":"of","r":"to","at":1,"t":"기본전치사","m":"'~ 덕분에'는 Thanks to 사용"}]},{"n":9,"en":"Now, Lesein's dream are to run his campaign across Kenya and then across Africa.","ko":"이제 Lesein의 꿈은 자신의 캠페인을 케냐 전역에서, 그러고 나서 아프리카 전역에서 진행하는 것이다.","fx":[{"w":"are","r":"is","at":3,"t":"be동사 수일치","m":"단수 주어 dream에는 is 사용"}]},{"n":11,"en":"Then, much people will join the campaign, and the world will become more greener!","ko":"그러면 더 많은 사람들이 캠페인에 참여할 것이고, 세상은 더욱 푸르게 될 것이다!","fx":[{"w":"much","r":"more","at":1,"t":"수량 형용사","m":"people 앞에는 many 사용"},{"w":"more greener","r":"greener","at":12,"t":"비교급","m":"이중 비교급 불가, greener만 사용"}]},{"n":12,"en":"Lesein said, \"There are an African story about a small bird in a forest fire.","ko":"Lesein은 \"아프리카에는 산불이 났을 때 작은 새에 관한 이야기가 있습니다.","fx":[{"w":"are","r":"is","at":3,"t":"be동사 수일치·과거","m":"There is + 단수명사 story: is (are 아님)"}]},{"n":14,"en":"Like this little bird, me want to do something for the environment. Small actions can make a big difference.\"","ko":"이 작은 새처럼 저도 환경을 위해 무언가를 하고 싶습니다. 작은 행동들이 큰 변화를 가져올 수 있으니까요.\"라고 말했다.","fx":[{"w":"me","r":"I","at":4,"t":"인칭대명사의 격","m":"주어 자리에는 주격 I 사용"}]}]},{"no":"59","t":"Joys of Working in Nature","q":[{"n":1,"en":"Some people loves to work in nature. They work in the sea, mountains, or even in the Arctic.","ko":"어떤 사람들은 자연에서 일하는 것을 아주 좋아한다. 그들은 바다, 산, 심지어 북극에서도 일한다.","fx":[{"w":"loves","r":"love","at":2,"t":"일반동사의 현재형","m":"주어 people(복수)에는 love 사용"}]},{"n":2,"en":"Let's meet them and listen to they stories.","ko":"그들을 만나 보고 그들의 이야기를 들어 보자.","fx":[{"w":"they","r":"their","at":6,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 their 사용"}]},{"n":4,"en":"I dive in the water and collect seafoods. In the morning, I checks the tide and the weather.","ko":"저는 물에 잠수해서 해산물을 채집합니다. 아침에, 저는 조수와 날씨를 확인합니다.","fx":[{"w":"seafoods","r":"seafood","at":7,"t":"셀 수 없는 명사","m":"seafood는 셀 수 없는 명사라 -s 안 붙임"},{"w":"checks","r":"check","at":12,"t":"주어-동사 수일치","m":"주어 I에는 check (checks 아님)"}]},{"n":5,"en":"I wear a diving suit and swimming glasses to work in the water. I love diving and spending time in the beautifully sea.","ko":"저는 물속에서 일하기 위해 잠수복을 입고 수경을 씁니다. 저는 잠수하는 것과 아름다운 바다에서 시간을 보내는 것을 아주 좋아합니다.","fx":[{"w":"beautifully","r":"beautiful","at":21,"t":"형용사와 부사","m":"명사 sea 수식은 형용사 beautiful 사용"}]},{"n":6,"en":"I don't collects too much seafood. This is good for the ocean.","ko":"저는 너무 많은 해산물을 채집하지 않습니다. 이것이 바다에 좋습니다.","fx":[{"w":"collects","r":"collect","at":2,"t":"일반동사의 부정문","m":"don't 뒤는 동사원형 collect (collects 아님)"}]},{"n":7,"en":"This days, I see a lot of trashes in the water, so I pick up the trash. I believe that we should care about the ocean.","ko":"요즘은 물속에 쓰레기가 많이 보여서 쓰레기를 줍습니다. 저는 우리가 바다에 신경을 써야 한다고 믿습니다.","fx":[{"w":"This","r":"These","at":0,"t":"지시형용사","m":"days가 복수이므로 These 사용"},{"w":"trashes","r":"trash","at":7,"t":"셀 수 없는 명사","m":"trash는 셀 수 없는 명사라 -s 안 붙임"}]},{"n":8,"en":"My name is Jihan. I am an vet at the wild animal care center in Jirisan.","ko":"제 이름은 지한입니다. 저는 지리산 야생 동물 보호 센터의 수의사입니다.","fx":[{"w":"an","r":"a","at":6,"t":"관사 a/an","m":"자음 소리 vet 앞에는 a 사용"}]},{"n":9,"en":"I take care of sick wild animals in the center and sends them back to their homes.","ko":"저는 센터의 아픈 야생 동물을 돌보고 그들을 집으로 돌려보냅니다.","fx":[{"w":"sends","r":"send","at":11,"t":"주어-동사 수일치","m":"주어 I에는 send (sends 아님)"}]},{"n":10,"en":"Also, I often climb the mountain to look after wild animals like bears. I'm proud for my job.","ko":"또한 저는 곰과 같은 야생 동물을 돌보기 위해 자주 산을 오릅니다. 저는 제 직업이 자랑스럽습니다.","fx":[{"w":"for","r":"of","at":15,"t":"기본전치사","m":"'~이 자랑스러운'은 proud of 사용"}]},{"n":11,"en":"I think that protecting wild animals is important. We should keep a eye on them and their homes to live together.","ko":"저는 야생 동물을 보호하는 것이 중요하다고 생각합니다. 우리는 함께 살아가기 위해 그들과 그들의 서식처를 계속 지켜보아야 합니다.","fx":[{"w":"a","r":"an","at":11,"t":"관사 a/an","m":"모음 소리 eye 앞에는 an 사용"}]},{"n":12,"en":"My name is Eun, and I am an Arctic scientist. I work at the Arctic Dasan Station on Norway.","ko":"제 이름은 은이고, 저는 극지 과학자입니다. 저는 노르웨이의 북극 다산 과학 기지에서 일합니다.","fx":[{"w":"on","r":"in","at":17,"t":"기본전치사","m":"'노르웨이에 있는'은 in Norway 사용"}]},{"n":13,"en":"I study the soil, seawater, and ice in the Arctic. I often travel on the specially ship, Araon.","ko":"저는 북극의 토양, 바닷물, 얼음을 연구합니다. 저는 특별한 배인 아라온호를 타고 자주 이동합니다.","fx":[{"w":"specially","r":"special","at":15,"t":"형용사와 부사","m":"명사 ship 수식은 형용사 special 사용"}]},{"n":14,"en":"This ship is more stronger than other ships. It can break thick ice across the ocean.","ko":"이 배는 다른 배보다 더 튼튼합니다. 그것은 바다를 가로질러 두꺼운 얼음을 깰 수 있습니다.","fx":[{"w":"more stronger","r":"stronger","at":3,"t":"비교급","m":"strong의 비교급은 stronger (more 안 씀)"}]},{"n":15,"en":"Thanks to Araon, I can collects seawater samples. The Arctic Ocean have the answers to the climate crisis.","ko":"아라온호 덕분에 저는 바닷물 표본을 채집할 수 있습니다. 북극해는 기후 위기에 대한 해답을 가지고 있습니다.","fx":[{"w":"collects","r":"collect","at":5,"t":"조동사","m":"조동사 can 뒤에는 동사원형 collect 사용"},{"w":"have","r":"has","at":11,"t":"3인칭 단수 현재형","m":"주어 Ocean(단수)에는 has 사용"}]},{"n":16,"en":"I hope that my work can helps the Earth.","ko":"저는 제 일이 지구를 도울 수 있기를 바랍니다.","fx":[{"w":"helps","r":"help","at":6,"t":"조동사","m":"조동사 can 뒤에는 동사원형 help 사용"}]}]},{"no":"60","t":"Pictures Talk About the Artist!","q":[{"n":2,"en":"Welcome to me husband's gallery. Look at me.","ko":"제 남편의 미술관에 오신 것을 환영합니다. 저를 보세요.","fx":[{"w":"me","r":"my","at":2,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"}]},{"n":3,"en":"Does you think that I'm strange? My husband, Henri Matisse, color my face in green.","ko":"여러분은 제가 이상하다고 생각하세요? 제 남편, 앙리 마티스가 제 얼굴을 녹색으로 색칠했어요.","fx":[{"w":"Does","r":"Do","at":0,"t":"do/does 의문문","m":"주어 you에는 Do 사용"},{"w":"color","r":"colored","at":10,"t":"과거시제","m":"과거 이야기: color가 아니라 colored"}]},{"n":4,"en":"Don't worry. My face isn't actual green.","ko":"걱정하지 마세요. 제 얼굴은 실제로 녹색이 아니에요.","fx":[{"w":"actual","r":"actually","at":5,"t":"형용사와 부사","m":"형용사 green을 꾸미는 말은 부사 actually 사용"}]},{"n":5,"en":"Why did he painted me this way then? He wanted to express he emotions with bright and wildly colors.","ko":"그러면 왜 그는 저를 이런 식으로 칠했을까요? 그는 밝고 거친 색으로 그의 감정을 표현하기를 원했거든요.","fx":[{"w":"painted","r":"paint","at":3,"t":"did 뒤 동사원형","m":"did 뒤에는 동사원형 paint 사용"},{"w":"he","r":"his","at":12,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 his 사용"},{"w":"wildly","r":"wild","at":17,"t":"형용사와 부사","m":"명사 colors를 꾸미는 말은 형용사 wild 사용"}]},{"n":6,"en":"People didn't like these painting style at first. Some people thought that an beast painted me.","ko":"사람들은 처음에 이 그림 스타일을 좋아하지 않았어요. 어떤 사람들은 야수가 저를 그렸다고 생각했죠.","fx":[{"w":"these","r":"this","at":3,"t":"지시형용사 this/these","m":"단수명사 style이므로 this 사용"},{"w":"an","r":"a","at":12,"t":"관사 a/an","m":"beast는 자음 소리로 시작하므로 a 사용"}]},{"n":7,"en":"So, he got the nickname Wild Beast. He kept his own style and finally becomed famous.","ko":"그래서 그는 ‘야수’라는 별명을 얻었어요. 그는 자신만의 스타일을 지켰고 마침내 유명해졌어요.","fx":[{"w":"becomed","r":"became","at":14,"t":"불규칙 과거형","m":"become의 과거형은 becomed가 아니라 became"}]},{"n":8,"en":"Hi, there. Can you finds me in the picture?","ko":"안녕하세요. 여러분은 그림에서 저를 찾을 수 있나요?","fx":[{"w":"finds","r":"find","at":4,"t":"조동사 뒤 동사원형","m":"조동사 Can 뒤에는 동사원형 find 사용"}]},{"n":9,"en":"Actually, I'm an animal. Start from the green shape on the middle.","ko":"사실, 저는 동물이에요. 가운데에 있는 녹색 모양부터 시작하세요.","fx":[{"w":"on","r":"in","at":9,"t":"기본전치사","m":"\"한가운데에\"는 in the middle 사용"}]},{"n":10,"en":"Then trace another shapes with your finger. They look like a snail shell.","ko":"그런 다음, 여러분의 손가락으로 다른 모양들을 따라가세요. 그것들은 달팽이 껍데기처럼 생겼어요.","fx":[{"w":"another","r":"the other","at":2,"t":"수량 한정사 another/other","m":"another는 단수명사와 쓰고 복수는 the other shapes 사용"}]},{"n":11,"en":"Yes, I'm a snail! Matisse create me in a unique way.","ko":"네, 저는 달팽이예요! 마티스는 저를 독특한 방식으로 창조했어요.","fx":[{"w":"create","r":"created","at":5,"t":"과거시제","m":"과거 이야기: create가 아니라 created"}]},{"n":12,"en":"He painted paper and cut out shapes with a scissors. Then he put the shapes together and make me.","ko":"그는 종이를 색칠하고 가위로 모양들을 오려 냈어요. 그런 다음, 그는 그 모양들을 합쳐서 저를 만들었어요.","fx":[{"w":"a scissors","r":"scissors","at":8,"t":"셀 수 없는 명사","m":"scissors는 복수형이므로 a 없이 with scissors 사용"},{"w":"make","r":"made","at":17,"t":"과거시제","m":"and로 이어진 과거 동사: make가 아니라 made"}]},{"n":13,"en":"At the age of 70, Matisse got much sick. However, he never gave up art.","ko":"70세의 나이에, 마티스는 매우 아팠어요. 하지만 그는 예술을 결코 포기하지 않았어요.","fx":[{"w":"much","r":"very","at":7,"t":"부사 very/much","m":"형용사 sick 앞에는 very 사용"}]},{"n":14,"en":"He created a new art forms. It's cut-outs.","ko":"그는 새로운 예술 형식을 만들었어요. 그것은 종이 오리기(cut-outs)예요.","fx":[{"w":"forms","r":"form","at":5,"t":"명사의 단수/복수","m":"a new 뒤에는 단수명사 form 사용"}]},{"n":15,"en":"Do you want to find more artworks like me? Look around the gallery and explore Henri Matisse's world on art!","ko":"여러분은 저와 같은 예술 작품을 더 찾아보고 싶으신가요? 미술관을 둘러보며 앙리 마티스의 예술 세계를 탐험해 보세요!","fx":[{"w":"on","r":"of","at":18,"t":"기본전치사","m":"\"예술의 세계\"는 전치사 of 사용"}]}]},{"no":"61","t":"You're an Environmental Superhero!","q":[{"n":1,"en":"Pollution is a big problem. Luckily, three superheroes is working to protect the environment.","ko":"오염은 큰 문제입니다. 다행히, 세 명의 슈퍼히어로가 환경을 보호하기 위해서 일하고 있습니다.","fx":[{"w":"is","r":"are","at":8,"t":"be동사의 수일치","m":"복수 주어 superheroes에는 are 사용"}]},{"n":2,"en":"They wants to make the world clean. Will you joins them?","ko":"그들은 세상을 깨끗하게 만들고 싶어 합니다. 당신도 그들과 함께하시겠어요?","fx":[{"w":"wants","r":"want","at":1,"t":"일반동사의 수일치","m":"주어 They는 복수: want (wants 아님)"},{"w":"joins","r":"join","at":9,"t":"조동사 뒤 동사원형","m":"Will 뒤에는 동사원형: join (joins 아님)"}]},{"n":4,"en":"People waste too much resources. But recycling can saves them.","ko":"사람들은 너무 많은 자원을 낭비해요. 하지만 재활용은 그것들을 절약할 수 있어요.","fx":[{"w":"much","r":"many","at":3,"t":"수량 형용사 many/much","m":"복수명사 resources 앞에는 many 사용"},{"w":"saves","r":"save","at":8,"t":"조동사 can","m":"조동사 can 뒤에는 동사원형 save 사용"}]},{"n":5,"en":"For example, recycling 1,000 kilograms for paper can save about 19 tree and 29,000 liters of water.","ko":"예를 들어, 종이 1,000kg을 재활용하는 것은 약 19그루의 나무와 29,000리터의 물을 절약할 수 있어요.","fx":[{"w":"for","r":"of","at":5,"t":"수량 표현","m":"'~킬로그램의 종이'는 kilograms of 사용"},{"w":"tree","r":"trees","at":11,"t":"명사의 복수형","m":"숫자 19 뒤에는 복수명사 trees 사용"}]},{"n":6,"en":"Do you want to being a wizard at recycling? Then you should recycle proper!","ko":"여러분은 재활용 마법사가 되고 싶나요? 그렇다면 재활용을 제대로 해야 합니다!","fx":[{"w":"being","r":"be","at":4,"t":"to부정사","m":"to 뒤에는 동사원형: to be (being 아님)"},{"w":"proper","r":"properly","at":13,"t":"형용사와 부사","m":"동사 recycle을 꾸미는 말은 부사 properly 사용"}]},{"n":8,"en":"Look of the waste below. Draw a line from each pieces of waste to the right bin.","ko":"아래 쓰레기를 보세요. 각 쓰레기 조각에서 알맞은 쓰레기통까지 선을 그어 보세요.","fx":[{"w":"of","r":"at","at":1,"t":"기본전치사","m":"'~을 보다'는 look at 사용"},{"w":"pieces","r":"piece","at":10,"t":"each + 단수명사","m":"each 뒤에는 단수명사 piece 사용"}]},{"n":11,"en":"People throws away clothes too often. They become waste and hurt the environment.","ko":"사람들은 옷을 너무 자주 버려요. 그것들은 쓰레기가 되어 환경을 해쳐요.","fx":[{"w":"throws","r":"throw","at":1,"t":"일반동사의 수일치","m":"복수 주어 People에는 throw 사용"}]},{"n":12,"en":"Did you knew that some clothes take over 200 year to break down? Don't buy too much clothes.","ko":"몇몇 옷들은 분해되는 데 200년이 넘게 걸린다는 것을 알고 있었나요? 너무 많은 옷을 사지 마세요.","fx":[{"w":"knew","r":"know","at":2,"t":"일반동사의 과거 의문문","m":"Did 뒤에는 동사원형 know 사용"},{"w":"year","r":"years","at":9,"t":"명사의 복수형","m":"숫자 200 뒤에는 복수명사 years 사용"},{"w":"much","r":"many","at":16,"t":"수량 형용사 many/much","m":"복수명사 clothes 앞에는 many 사용"}]},{"n":13,"en":"Wear you clothes for a long time. You can also create new items from your old clothes!","ko":"여러분의 옷을 오랫동안 입으세요. 여러분의 헌 옷으로 새로운 물건을 만들 수도 있어요!","fx":[{"w":"you","r":"your","at":1,"t":"인칭대명사의 소유격","m":"clothes 앞에는 소유격 your 사용"}]},{"n":14,"en":"Let's make old clothes usefully.","ko":"헌 옷을 유용하게 만들어 봅시다.","fx":[{"w":"usefully","r":"useful","at":4,"t":"형용사와 부사","m":"make A B에서 B 자리에는 형용사 useful 사용"}]},{"n":15,"en":"There are some items below. What can you make with this old clothes?","ko":"아래에 몇 가지 물건들이 있어요. 여러분은 이 헌 옷들로 무엇을 만들 수 있나요?","fx":[{"w":"this","r":"these","at":10,"t":"지시형용사","m":"복수명사 clothes 앞에는 these 사용"}]}]},{"no":"62","t":"Talk Across Cultures","q":[{"n":1,"en":"Korean Teacher: Hello, everyone! Today, we has a special online class with students from Brazil.","ko":"Korean Teacher: 안녕하세요, 여러분! 오늘은 브라질에서 온 학생들과 함께하는 특별한 온라인 수업이 있습니다.","fx":[{"w":"has","r":"have","at":6,"t":"일반동사 수일치","m":"주어 we는 복수 → have (has 아님)"}]},{"n":2,"en":"Let's learn about Brazil from our Brazilian friends. Does you have any questions?","ko":"브라질 친구들에게 브라질에 대해 배워 봅시다. 질문 있나요?","fx":[{"w":"Does","r":"Do","at":8,"t":"do동사의 의문문","m":"주어 you에는 Do 사용"}]},{"n":3,"en":"Seoyeon: Is Brazil a large countries?","ko":"Seoyeon: 브라질은 큰 나라인가요?","fx":[{"w":"countries","r":"country","at":5,"t":"명사의 복수형","m":"a 뒤에는 단수명사 country 사용"}]},{"n":4,"en":"Rafael: Yes, it is the largest countries in South America.","ko":"Rafael: 네, 브라질은 남아메리카에서 가장 큰 나라입니다.","fx":[{"w":"countries","r":"country","at":6,"t":"명사의 단수형","m":"the largest 뒤에는 단수명사 country 사용"}]},{"n":5,"en":"Isabela: We also have the bigger rainforest in the world. It's the Amazon Rainforest.","ko":"Isabela: 우리나라에는 세계에서 가장 큰 열대 우림도 있어요. 아마존 열대 우림이에요.","fx":[{"w":"bigger","r":"biggest","at":5,"t":"최상급","m":"in the world와 함께 최상급 the biggest 사용"}]},{"n":6,"en":"Doyun: How's the weather on Brazil?","ko":"Doyun: 브라질 날씨는 어떤가요?","fx":[{"w":"on","r":"in","at":4,"t":"기본전치사","m":"나라 안에서는 전치사 in 사용"}]},{"n":7,"en":"Rafael: It is difference across the country. We're on Rio de Janeiro.","ko":"Rafael: 나라 전체에 걸쳐 다릅니다. 저희는 리우데자네이루에 있어요.","fx":[{"w":"difference","r":"different","at":3,"t":"품사 (형용사)","m":"be동사 뒤 보어는 형용사 different 사용"},{"w":"on","r":"in","at":8,"t":"기본전치사","m":"도시 안에 있다는 in Rio de Janeiro 사용"}]},{"n":8,"en":"It's near the sea. So, we have warmer winters and cooler summers than Brasilia, the capital cities.","ko":"바다 근처죠. 그래서 수도인 브라질리아보다 겨울이 더 따뜻하고 여름이 더 서늘해요.","fx":[{"w":"cities","r":"city","at":16,"t":"명사의 단수형","m":"the capital 뒤에는 단수명사 city 사용"}]},{"n":10,"en":"Doyun: It's cold now. This year is cold than last year.","ko":"Doyun: 지금은 춥습니다. 올해는 지난해보다 더 추워요.","fx":[{"w":"cold","r":"colder","at":7,"t":"비교급","m":"than 앞에는 비교급 colder 사용"}]},{"n":12,"en":"Isabela: The Rio Carnival is the more famous carnival in the world. There is samba parades, street events, and colorful clothes.","ko":"Isabela: 리우 카니발은 세계에서 가장 유명한 카니발이에요. 삼바 퍼레이드, 거리 행사, 그리고 다채로운 의상들이 있어요.","fx":[{"w":"more","r":"most","at":6,"t":"최상급","m":"the 와 in the world에는 최상급 most famous 사용"},{"w":"is","r":"are","at":13,"t":"be동사의 수일치","m":"복수명사 parades → are (is 아님)"}]},{"n":13,"en":"Seoyeon: Do you goes there every year?","ko":"Seoyeon: 매년 거기 가나요?","fx":[{"w":"goes","r":"go","at":3,"t":"do동사의 의문문","m":"Do 뒤에는 동사원형: go (goes 아님)"}]},{"n":14,"en":"Isabela: Yes! I enjoys music, dancing, and delicious food there.","ko":"Isabela: 네! 거기서 음악, 춤, 그리고 맛있는 음식을 즐기죠.","fx":[{"w":"enjoys","r":"enjoy","at":3,"t":"일반동사 수일치","m":"주어 I에는 동사원형 enjoy 사용"}]},{"n":16,"en":"Doyun: Is there an K-culture festival in Brazil?","ko":"Doyun: 브라질에 K-문화 축제가 있나요?","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"K는 자음 소리 [케이]로 시작하므로 a 사용"}]},{"n":17,"en":"Rafael: Yes. K-culture are popular here.","ko":"Rafael: 네. 여기서도 K-문화가 인기 있어요.","fx":[{"w":"are","r":"is","at":3,"t":"be동사의 수일치","m":"단수 주어 K-culture에는 is 사용"}]},{"n":18,"en":"I watched Korea movies and saw taekwondo at the festival.","ko":"전 축제에서 한국 영화와 태권도를 보았답니다.","fx":[{"w":"Korea","r":"Korean","at":2,"t":"품사 (형용사)","m":"명사 movies 앞에는 형용사 Korean 사용"}]},{"n":19,"en":"Isabela: I also saw me favorite K-pop stars there. I loves K-pop music.","ko":"Isabela: 저도 제가 좋아하는 K-팝 연예인들을 그곳에서 봤어요. 저는 K-팝 음악을 정말 좋아해요.","fx":[{"w":"me","r":"my","at":4,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 my 사용"},{"w":"loves","r":"love","at":10,"t":"일반동사 수일치","m":"주어 I → love (loves 아님)"}]},{"n":21,"en":"Brazilian Teacher: Great! Let's talks about Korean culture next time.","ko":"Brazilian Teacher: 좋습니다! 다음 시간에는 한국 문화에 대해 이야기해 보아요.","fx":[{"w":"talks","r":"talk","at":4,"t":"Let's + 동사원형","m":"Let's 뒤에는 동사원형: talk (talks 아님)"}]}]},{"no":"63","t":"We Look Funny but Taste Great!","q":[{"n":1,"en":"This is an special market for funny-looking fruits and vegetables. They greet each others and start to talk.","ko":"이곳은 우스꽝스럽게 생긴 과일과 채소를 위한 특별한 시장입니다. 그들은 서로에게 인사하며 이야기를 시작합니다.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"special은 자음 소리로 시작하므로 a special"},{"w":"others","r":"other","at":13,"t":"대명사 each other","m":"'서로'는 each other (others 아님)"}]},{"n":2,"en":"Apple: What a nice day! I'm here because I has many spots on my skin.","ko":"사과: 정말 좋은 날이야! 나는 내 껍질에 점이 많아서 이곳에 왔어.","fx":[{"w":"has","r":"have","at":9,"t":"일반동사의 수일치","m":"주어 I는 have (has 아님)"}]},{  사람들이 있었어. 아, 누군가가 나를 집어 들었어.","fx":[{"w":"I","r":"me","at":12,"t":"인칭대명사의 목적격","m":"동사 picked 뒤에는 목적격 me 사용"}]},{"n":15,"en":"How a long journey! I am finally in a bathtub with these boy, Mike.","ko":"정말 긴 여행이었어! 나는 드디어 Mike라는 이 소년과 함께 욕조에 있어.","fx":[{"w":"How","r":"What","at":0,"t":"감탄문","m":"\"What a + 형용사 + 명사\" 어순이므로 What 사용"},{"w":"these","r":"this","at":11,"t":"지시형용사 this/these","m":"단수명사 boy이므로 this 사용"}]},{"n":16,"en":"How luckily I am! But sometimes I think about my others duck friends.","ko":"나는 얼마나 운이 좋은지! 그러나 때때로 나는 나의 다른 오리 친구들을 생각해.","fx":[{"w":"luckily","r":"lucky","at":1,"t":"형용사와 부사","m":"How 뒤에는 형용사 lucky 사용"},{"w":"others","r":"other","at":10,"t":"수량 한정사 other/others","m":"명사 앞에는 other 사용 (others는 단독 대명사)"}]},{"n":17,"en":"Are they still in the ocean? I hope to see they all someday.","ko":"그들은 아직도 바다에 있을까? 나는 언젠가 그들 모두를 만나기를 바라.","fx":[{"w":"they","r":"them","at":10,"t":"인칭대명사의 목적격","m":"동사 see 뒤에는 목적격 them 사용"}]}]},{"no":"68","t":"Why Do Animals Travel?","q":[{"n":1,"en":"Do you know animals also leaves their homes and travel? Many animals travel for difference reasons.","ko":"동물들도 자신의 집을 떠나 여행한다는 것을 알고 있는가? 많은 동물이 다양한 이유로 여행한다.","fx":[{"w":"leaves","r":"leave","at":5,"t":"주어와 동사의 수일치","m":"복수 주어 animals는 leave (leaves 아님)"},{"w":"difference","r":"different","at":14,"t":"품사 혼동","m":"명사 수식은 형용사 different 사용"}]},{"n":3,"en":"From October to December, millions of fruit bat fly to Zambia's Kasanka National Park. These bats come from all over Africa.","ko":"10월부터 12월 사이에 수백만 마리의 과일박쥐들이 잠비아의 카산카 국립공원으로 날아간다. 이 박쥐들은 아프리카의 전 지역에서 온다.","fx":[{"w":"bat","r":"bats","at":7,"t":"명사의 복수형","m":"millions of 뒤에는 복수명사 bats 사용"}]},{"n":4,"en":"Who do they travel to the park? They go there to eat wildly fruit.","ko":"왜 그들이 그 공원으로 여행을 하는 것일까? 그들은 야생 과일을 먹기 위해 그곳에 간다.","fx":[{"w":"Who","r":"Why","at":0,"t":"의문사","m":"이유를 묻을 때는 Why 사용"},{"w":"wildly","r":"wild","at":12,"t":"형용사와 부사","m":"명사 fruit 수식은 형용사 wild 사용"}]},{"n":5,"en":"They are big eaters. They eats more than their weight in a night.","ko":"그들은 대식가이다. 그들은 하룻밤에 자신의 몸무게보다 더 많은 양을 먹는다.","fx":[{"w":"eats","r":"eat","at":5,"t":"일반동사의 현재형","m":"복수 주어 They는 eat (eats 아님)"}]},{"n":7,"en":"However, when the rainy season begins on October, millions of red crabs march toward the ocean to laying eggs.","ko":"하지만 10월에 우기가 시작되면, 수백만 마리의 붉은게들이 알을 낳기 위해 바다 쪽으로 행진한다.","fx":[{"w":"on","r":"in","at":6,"t":"기본전치사","m":"'~월에'는 전치사 in 사용"},{"w":"laying","r":"lay","at":17,"t":"to부정사","m":"to 뒤에는 동사원형 lay 사용"}]},{"n":8,"en":"During these period, they are all over the place, and the whole island turns redly.","ko":"이 기간 동안에는 그들이 모든 곳에 걸쳐 있어서 섬 전체가 붉게 변한다.","fx":[{"w":"these","r":"this","at":1,"t":"지시형용사","m":"단수명사 period에는 this 사용"},{"w":"redly","r":"red","at":14,"t":"형용사와 부사","m":"turns 뒤 보어는 형용사 red 사용"}]},{"n":9,"en":"People close some roads and build bridges to protect them. With their help, the crabs move to the ocean safe.","ko":"사람들은 그들을 보호하기 위해 일부 도로를 폐쇄하고 다리를 놓는다. 사람들의 도움으로 게들은 바다로 안전하게 이동한다.","fx":[{"w":"safe","r":"safely","at":19,"t":"형용사와 부사","m":"동사 move 수식은 부사 safely 사용"}]},{"n":11,"en":"Jellyfish Lake in Palau is home to golden jellyfish. Every day, they moves across the lake and then swim back.","ko":"팔라우의 젤리피시 호수는 황금해파리의 집이다. 매일 그들은 호수를 가로질러 이동한 뒤에 다시 헤엄쳐 돌아온다.","fx":[{"w":"moves","r":"move","at":12,"t":"일반동사의 현재형","m":"복수 주어 they는 move (moves 아님)"}]},{"n":12,"en":"Why do they travel every day? They follow the sun to get energies from it.","ko":"왜 그들은 매일 여행을 할까? 그들은 태양으로부터 에너지를 얻기 위해 태양을 따라간다.","fx":[{"w":"energies","r":"energy","at":12,"t":"셀 수 없는 명사","m":"energy는 셀 수 없는 명사"}]},{"n":13,"en":"When the sun rises in the morning, the jellyfish begin to swimming toward the sun.","ko":"아침에 태양이 뜨면, 황금해파리들은 태양 쪽으로 헤엄치기 시작한다.","fx":[{"w":"swimming","r":"swim","at":11,"t":"to부정사","m":"to 뒤에는 동사원형 swim 사용"}]}]},{"no":"69","t":"Henri's Scissors","q":[{"n":1,"en":"In a small towns in France, there lived a young boy. Him name was Henri Matisse.","ko":"프랑스의 작은 마을에 어린 소년이 살았다. 그의 이름은 Henri Matisse였다.","fx":[{"w":"towns","r":"town","at":3,"t":"부정관사와 단수명사","m":"a 뒤에는 단수명사 town 사용"},{"w":"Him","r":"His","at":11,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 His 사용"}]},{"n":2,"en":"He liked to drew pictures. He drew pictures in the sand and in him books.","ko":"그는 그림 그리는 것을 좋아했다. 그는 모래와 그의 책에 그림을 그렸다.","fx":[{"w":"drew","r":"draw","at":3,"t":"to부정사","m":"to 뒤에는 동사원형: draw (drew 아님)"},{"w":"him","r":"his","at":13,"t":"인칭대명사의 소유격","m":"명사 앞에는 소유격 his 사용"}]},{"n":3,"en":"When Matisse grown up, he left his town and becomed an artist in Paris. He painted pictures day after day and year after years.","ko":"Matisse가 어른이 되었을 때, 그는 마을을 떠나 파리에서 화가가 되었다. 그는 날마다, 해마다 그림을 그렸다.","fx":[{"w":"grown","r":"grew","at":2,"t":"불규칙 과거형","m":"grow의 과거형은 grew (grown 아님)"},{"w":"becomed","r":"became","at":9,"t":"불규칙 과거형","m":"become의 과거형은 became (becomed 아님)"},{"w":"years","r":"year","at":23,"t":"반복 표현 A after A","m":"'year after year'는 단수명사 반복"}]},{"n":4,"en":"He was happy with his life. More and more people began to notice he.","ko":"그는 그의 삶에 행복해했다. 점점 더 많은 사람들이 그를 알아보기 시작했다.","fx":[{"w":"he","r":"him","at":13,"t":"인칭대명사의 목적격","m":"동사 notice의 목적어는 목적격 him 사용"}]},{"n":6,"en":"When Matisse became an old man, he falled ill. He could only lie in bed and slept.","ko":"Matisse가 노인이 되었을 때, 그는 병에 걸렸다. 그는 침대에 누워 잠만 잘 수 있었다.","fx":[{"w":"falled","r":"fell","at":7,"t":"불규칙 과거형","m":"fall의 과거형은 fell (falled 아님)"},{"w":"slept","r":"sleep","at":16,"t":"조동사 뒤 동사원형","m":"could only lie and sleep: 동사원형 sleep 사용"}]},{"n":7,"en":"He couldn't paint at all. He could only paints in his dreams.","ko":"그는 그림을 전혀 그릴 수 없었다. 그는 오직 그의 꿈속에서만 그릴 수 있었다.","fx":[{"w":"paints","r":"paint","at":8,"t":"조동사 뒤 동사원형","m":"could 뒤에는 동사원형: paint (paints 아님)"}]},{"n":8,"en":"When Matisse opened his eyes, they were full in sadness.","ko":"Matisse가 눈을 떴을 때, 그의 눈은 슬픔으로 가득 차 있었다.","fx":[{"w":"in","r":"of","at":8,"t":"형용사+전치사","m":"'~로 가득 찬'은 full of 사용"}]},{"n":9,"en":"Luckily, before long, he could sit. A few later, he started to paint again.","ko":"다행히도, 얼마 지나지 않아 그는 앉을 수 있었다. 조금 후에, 그는 다시 그림을 그리기 시작했다.","fx":[{"w":"few","r":"little","at":7,"t":"수량 형용사 a little/a few","m":"시간 later 앞 표현은 A little later 사용"}]},{"n":10,"en":"However, he realized that he couldn't paint good anymore.","ko":"하지만 그는 더 이상 그림을 잘 그릴 수 없다는 것을 깨달았다.","fx":[{"w":"good","r":"well","at":7,"t":"형용사와 부사","m":"동사 paint를 꾸미는 말은 부사 well 사용"}]},{"n":11,"en":"One day, Matisse got an brilliant idea. He picked up scissors, cut some paper, and made beautiful shapes.","ko":"어느 날, Matisse는 멋진 생각을 해냈다. 그는 가위를 집어 들어 종이를 자르고, 아름다운 모양을 만들었다.","fx":[{"w":"an","r":"a","at":4,"t":"관사 a/an","m":"자음 소리 brilliant 앞에는 a 사용"}]},{"n":12,"en":"He cut out birds and flowers. He was draw with SCISSORS!","ko":"그는 새와 꽃을 잘라 냈다. 그는 가위로 그림을 그리고 있었다!","fx":[{"w":"draw","r":"drawing","at":8,"t":"과거진행형","m":"was 뒤에는 현재분사 drawing 사용"}]},{"n":13,"en":"He said to himself, \"My pleasure in cutting things grows and grows. Scissors gave I another chance.\"","ko":"그는 \"무엇인가를 오려 내는 나의 기쁨이 더욱 커지고 있어. 가위는 내게 또 다른 기회를 주었어.\"라고 자기 자신에게 말했다.","fx":[{"w":"I","r":"me","at":14,"t":"인칭대명사의 목적격","m":"동사 gave의 목적어는 목적격 me 사용"}]},{"n":16,"en":"\"I stay in bed most of the times, but I made a small paper garden all around I. There is leaves, fruits, and birds ...","ko":"\"나는 대부분 시간을 침대에 머물러 있지만, 온 주변에 작은 종이 정원을 만들었어. 나뭇잎, 과일, 그리고 새들이 있지 …","fx":[{"w":"times","r":"time","at":7,"t":"명사의 단수·복수","m":"'대부분의 시간'은 단수 the time 사용"},{"w":"I","r":"me","at":17,"t":"인칭대명사의 목적격 (전치사 뒤)","m":"전치사 around 뒤에는 목적격 me 사용"},{"w":"is","r":"are","at":19,"t":"There is/are 구문","m":"복수 leaves 앞에는 There are 사용"}]},{"n":17,"en":"I are really happy,\" he thought.","ko":"난 정말 행복해.\"라고 그는 생각했다.","fx":[{"w":"are","r":"am","at":1,"t":"be동사의 현재형","m":"주어 I에는 am 사용"}]},{"n":19,"en":"Some of the stars may comes from his scissors.","ko":"별들 중 일부는 그의 가위에서 나온 것일지도 모른다.","fx":[{"w":"comes","r":"come","at":5,"t":"조동사 뒤 동사원형","m":"may 뒤에는 동사원형: come (comes 아님)"}]}]},{"no":"70","t":"Omelets Around the World","q":[{"n":1,"en":"I has a shell, but I'm not a crab.","ko":"저는 껍데기가 있지만, 게는 아니에요.","fx":[{"w":"has","r":"have","at":1,"t":"일반동사의 현재형","m":"주어 I에는 have (has 아님)"}]},{"n":3,"en":"I'm more big than an olive, but I'm smaller than an avocado.","ko":"저는 올리브보다 더 크지만, 아보카도보다 더 작아요.","fx":[{"w":"more big","r":"bigger","at":1,"t":"비교급","m":"big의 비교급은 bigger"}]},{"n":5,"en":"Do you know the answer? Yes, it are an egg.","ko":"여러분은 정답을 알고 있나요? 네, 그것은 달걀입니다.","fx":[{"w":"are","r":"is","at":7,"t":"be동사의 현재형","m":"주어 it은 is (are 아님)"}]},{"n":6,"en":"There are much different egg dishes around the world. Who is your favorite egg dish?","ko":"전 세계에는 많은 다양한 달걀 요리가 있습니다. 여러분이 가장 좋아하는 달걀 요리는 무엇인가요?","fx":[{"w":"much","r":"many","at":2,"t":"수량 형용사 many/much","m":"복수명사 dishes 앞에는 many 사용"},{"w":"Who","r":"What","at":9,"t":"의문사","m":"사물을 묻는 의문사 What 사용"}]},{"n":8,"en":"The omelet is a popularly egg dish. You can makes it easily.","ko":"오믈렛은 인기 있는 달걀 요리입니다. 여러분은 그것을 쉽게 만들 수 있습니다.","fx":[{"w":"popularly","r":"popular","at":4,"t":"형용사와 부사","m":"명사 egg 앞에는 형용사 popular 사용"},{"w":"makes","r":"make","at":9,"t":"조동사","m":"조동사 can 뒤에는 동사원형 make 사용"}]},{"n":10,"en":"Do your want a more delicious omelet? Just add cheese, vegetables, or meat.","ko":"여러분은 더 맛있는 오믈렛을 원하나요? 그저 치즈, 채소, 또는 고기를 더해 보세요.","fx":[{"w":"your","r":"you","at":1,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 you 사용"}]},{"n":11,"en":"It will taste more good!","ko":"그것은 더 맛있을 것입니다!","fx":[{"w":"more good","r":"better","at":3,"t":"비교급","m":"good의 비교급은 better"}]},{"n":12,"en":"There is an interested story about omelets. One days, Napoleon and him army stayed near the town of Bessières.","ko":"오믈렛에 관한 재미있는 이야기가 하나 있습니다. 어느 날, 나폴레옹과 그의 군대가 베시에르 마을 근처에 머물렀습니다.","fx":[{"w":"interested","r":"interesting","at":3,"t":"분사형 형용사","m":"story를 꾸미는 말은 interesting 사용"},{"w":"days","r":"day","at":8,"t":"명사의 단수형","m":"One 뒤에는 단수명사 day 사용"},{"w":"him","r":"his","at":11,"t":"인칭대명사의 소유격","m":"명사 앞 소유격은 his 사용"}]},{"n":13,"en":"Napoleon tried an omelet from the town, and he enjoyed it very many. He asked at a giant omelet for his army the next day.","ko":"나폴레옹은 마을에서 만든 오믈렛을 먹어 보았고, 그는 그것을 매우 즐겼습니다. 그는 다음 날 그의 군대를 위해 거대한 오믈렛을 요청했습니다.","fx":[{"w":"many","r":"much","at":12,"t":"수량 형용사 many/much","m":"동사 enjoyed를 꾸미는 말은 very much 사용"},{"w":"at","r":"for","at":15,"t":"기본전치사","m":"'~을 요청하다'는 ask for 사용"}]},{"n":14,"en":"This days, people in Bessières makes a giant omelet for their omelet festival every year.","ko":"오늘날, 베시에르 사람들은 매년 그들의 오믈렛 축제를 위해 거대한 오믈렛을 만듭니다.","fx":[{"w":"This","r":"These","at":0,"t":"지시형용사 this/these","m":"복수명사 days 앞에는 These 사용"},{"w":"makes","r":"make","at":5,"t":"3인칭 복수 현재형","m":"복수 주어 people에는 make 사용"}]},{"n":16,"en":"In Spanish, 'patata' mean 'a potato.' You need eggs and potatoes for this omelet.","ko":"스페인어로 patata는 '감자'를 의미합니다. 여러분은 이 오믈렛을 위해 달걀과 감자가 필요합니다.","fx":[{"w":"mean","r":"means","at":3,"t":"3인칭 단수 현재형","m":"주어 'patata'에는 means 사용"}]},{"n":17,"en":"In Malaysia, people wraps chicken fried rice with a thin omelet. The name of this special omelet is Nasi Goreng Pattaya.","ko":"말레이시아에서 사람들은 닭고기 볶음밥을 얇은 오믈렛으로 감쌉니다. 이 특별한 오믈렛의 이름은 Nasi Goreng Pattaya(나시 고렝 파타야)입니다.","fx":[{"w":"wraps","r":"wrap","at":3,"t":"주어와 동사의 수일치","m":"주어 people(복수)은 wrap (wraps 아님)"}]},{"n":19,"en":"Do you feel hungrily now? How about try an omelet?","ko":"여러분은 지금 배가 고프다고 느끼나요? 오믈렛을 먹어 보는 건 어떤가요?","fx":[{"w":"hungrily","r":"hungry","at":3,"t":"형용사와 부사","m":"feel 뒤 보어 자리에는 형용사 hungry 사용"},{"w":"try","r":"trying","at":7,"t":"동명사","m":"전치사 about 뒤에는 동명사 trying 사용"}]}]},{"no":"71","t":"The Story of a Perfect Girl","q":[{"n":1,"en":"For Beatrice, Friday began like any other day. She wore the same white socks on both of her foots.","ko":"Beatrice에게 금요일은 어느 다른 날처럼 시작되었다. 그녀는 그녀의 양쪽 발에 똑같은 흰 양말을 신었다.","fx":[{"w":"foots","r":"feet","at":18,"t":"불규칙 복수형","m":"foot의 복수형은 feet"}]},{"n":2,"en":"Then she made an sandwich. She put exact the same amount of peanut butter on each piece of bread.","ko":"그러고 나서 그녀는 샌드위치를 만들었다. 그녀는 각 빵 조각에 정확히 같은 양의 땅콩버터를 발랐다.","fx":[{"w":"an","r":"a","at":3,"t":"관사 a/an","m":"자음 소리 sandwich 앞에는 a 사용"},{"w":"exact","r":"exactly","at":7,"t":"형용사와 부사","m":"the same을 꾸미는 말은 부사 exactly 사용"}]},{"n":3,"en":"On her way at school, her neighbor said, \"Good morning, Perfect Girl.\"","ko":"학교에 가는 길에, 그녀의 이웃이 \"좋은 아침이야, 완벽한 소녀.\"라고 말했다.","fx":[{"w":"at","r":"to","at":3,"t":"기본전치사","m":"'학교로 가는 길'은 way to school"}]},{"n":4,"en":"People called Beatrice \"Perfect Girl\" because she never maked mistakes.","ko":"Beatrice는 한 번도 실수를 하지 않았기 때문에 사람들은 그녀를 '완벽한 소녀'라고 불렀다.","fx":[{"w":"maked","r":"made","at":8,"t":"불규칙 과거형","m":"make의 과거형은 made"}]},{"n":5,"en":"\"Is you ready for tonight's talent show?\" her neighbor asked. Beatrice just smiled.","ko":"\"오늘 밤 장기 자랑 준비됐니?\"라고 그녀의 이웃이 물었다. Beatrice는 그저 미소를 지었다.","fx":[{"w":"Is","r":"Are","at":0,"t":"be동사의 의문문","m":"주어 you에는 Are 사용"}]},{"n":6,"en":"She was an juggling champion. She won the talent show every years.","ko":"그녀는 저글링 챔피언이었다. 그녀는 매년 장기 자랑에서 우승했다.","fx":[{"w":"an","r":"a","at":2,"t":"관사 a/an","m":"자음 소리 juggling 앞에는 a 사용"},{"w":"years","r":"year","at":11,"t":"every + 단수명사","m":"every 뒤에는 단수명사 year 사용"}]},{"n":7,"en":"How wonderfully she was!","ko":"그녀는 참 멋졌다!","fx":[{"w":"wonderfully","r":"wonderful","at":1,"t":"감탄문","m":"How 뒤에는 형용사 wonderful 사용"}]},{"n":8,"en":"At school, Beatrice have a cooking class. To make a cake, she carefully took some eggs out to the refrigerator.","ko":"학교에서 Beatrice는 요리 수업을 들었다. 케이크를 만들기 위해, 그녀는 조심스럽게 냉장고에서 달걀 몇 개를 꺼냈다.","fx":[{"w":"have","r":"had","at":3,"t":"일반동사의 과거형","m":"과거 이야기이므로 had 사용"},{"w":"to","r":"of","at":17,"t":"기본전치사","m":"'~에서 꺼내다'는 out of 사용"}]},{"n":9,"en":"When she turn around, she stepped on something slippery. She was about to falling!","ko":"그녀가 뒤돌아보았을 때, 그녀는 미끄러운 무언가를 밟았다. 그녀는 막 넘어지려고 했다!","fx":[{"w":"turn","r":"turned","at":2,"t":"과거시제","m":"When절도 과거이므로 turned 사용"},{"w":"falling","r":"fall","at":13,"t":"be about to","m":"be about to 뒤에는 동사원형 fall 사용"}]},{"n":11,"en":"She almost made a mistakes. Because of this, she began to feel nervously.","ko":"그녀는 거의 실수할 뻔했다. 이것 때문에, 그녀는 불안을 느끼기 시작했다.","fx":[{"w":"mistakes","r":"mistake","at":4,"t":"명사의 단수형","m":"a 뒤에는 단수명사 mistake 사용"},{"w":"nervously","r":"nervous","at":12,"t":"형용사와 부사","m":"feel 뒤 보어 자리에는 형용사 nervous 사용"}]},{"n":12,"en":"It was time to the talent show. The school gym was full in people.","ko":"장기 자랑 시간이 되었다. 학교 체육관은 사람들로 가득 찼다.","fx":[{"w":"to","r":"for","at":3,"t":"기본전치사","m":"'~할 시간(행사)'은 time for the talent show"},{"w":"in","r":"of","at":12,"t":"관용 표현 be full of","m":"'~로 가득 찬'은 full of 사용"}]},{"n":14,"en":"Beatrice had butterflies in she stomach. \"Will I mess up?","ko":"Beatrice는 마음이 편치 않았다. '내가 망칠까?","fx":[{"w":"she","r":"her","at":4,"t":"인칭대명사의 소유격","m":"stomach 앞에는 소유격 her 사용"}]},{"n":16,"en":"Beatrice throwed an egg into the air. Next, she added a salt shaker.","ko":"Beatrice는 공중으로 달걀을 던졌다. 다음으로, 그녀는 소금 통을 추가했다.","fx":[{"w":"throwed","r":"threw","at":1,"t":"불규칙 과거형","m":"throw의 과거형은 threw"}]},{"n":17,"en":"Finally, she added a water balloon. What a well start!","ko":"마지막으로, 그녀는 물풍선을 추가했다. 참 좋은 시작이었다!","fx":[{"w":"well","r":"good","at":8,"t":"형용사와 부사","m":"명사 start를 꾸미는 말은 형용사 good 사용"}]},{"n":18,"en":"But then she felt something strange… Uh-oh! Beatrice's nose started to itching.","ko":"하지만 그다음에 그녀는 무언가 이상함을 느꼈다… 이런! Beatrice의 코가 간지럽기 시작했다.","fx":[{"w":"itching","r":"itch","at":11,"t":"to부정사","m":"to 뒤에는 동사원형 itch 사용"}]},{"n":20,"en":"Beatrice missed the water balloon, and they fell to the floor. Then… OOPS!","ko":"Beatrice는 물풍선을 놓쳤고, 그것은 바닥으로 떨어졌다. 그러고 나서… 어이쿠!","fx":[{"w":"they","r":"it","at":6,"t":"대명사의 수일치","m":"balloon은 단수이므로 it 사용"}]},{"n":21,"en":"The egg broke on top of she head.","ko":"달걀이 그녀의 머리 위에서 깨졌다.","fx":[{"w":"she","r":"her","at":6,"t":"인칭대명사의 소유격","m":"head 앞에는 소유격 her 사용"}]},{"n":22,"en":"For the first time ever, Beatrice made a mistake. What an surprise!","ko":"난생처음으로, Beatrice는 실수를 했다. 정말 놀라운 일이었다!","fx":[{"w":"an","r":"a","at":10,"t":"관사 a/an","m":"자음 소리 surprise 앞에는 a 사용"}]},{"n":23,"en":"She thought, \"What should I does? Cry?","ko":"그녀는 '내가 무엇을 해야 하지? 울까?","fx":[{"w":"does","r":"do","at":5,"t":"조동사 should","m":"조동사 should 뒤에는 동사원형 do 사용"}]},{"n":24,"en":"Run off the stage?\" Sudden, she began to laugh loudly.","ko":"무대에서 도망칠까?'라고 생각했다. 갑자기, 그녀는 큰 소리로 웃기 시작했다.","fx":[{"w":"Sudden","r":"Suddenly","at":4,"t":"형용사와 부사","m":"문장을 꾸미는 말은 부사 Suddenly 사용"}]},{"n":25,"en":"The people looks at each other. Then everyone started to laugh together.","ko":"사람들은 서로를 바라보았다. 그러더니 모두 함께 웃기 시작했다.","fx":[{"w":"looks","r":"looked","at":2,"t":"일반동사의 수일치","m":"The people은 복수, 과거형 looked 사용"}]},{"n":26,"en":"That night, Beatrice had a deep sleep. The next mornings, she woke up with a smile.","ko":"그날 밤, Beatrice는 깊은 잠을 잤다. 다음 날 아침, 그녀는 미소를 지으며 일어났다.","fx":[{"w":"mornings","r":"morning","at":9,"t":"명사의 단수형","m":"the next 뒤에는 단수명사 morning 사용"}]},{"n":27,"en":"She put a white sock on her left feet… and an green sock on her right foot!","ko":"그녀는 왼발에 흰 양말을 신었다… 그리고 오른발에는 초록색 양말을 신었다!","fx":[{"w":"feet","r":"foot","at":8,"t":"명사의 단수형","m":"'왼쪽 발' 한 쪽이므로 단수 foot 사용"},{"w":"an","r":"a","at":10,"t":"관사 a/an","m":"자음 소리 green 앞에는 a 사용"}]},{"n":28,"en":"Now, people no longer calls her \"Perfect Girl.\" They just call her Beatrice.","ko":"이제, 사람들은 더 이상 그녀를 '완벽한 소녀'라고 부르지 않는다. 그들은 그녀를 그저 Beatrice라고 부른다.","fx":[{"w":"calls","r":"call","at":4,"t":"일반동사의 수일치","m":"복수 주어 people에는 call 사용"}]}]},{"no":"72","t":"A Green Life for the World","q":[{"n":1,"en":"Seojun are a middle school student. One day, him watched a video about polar bears in danger.","ko":"서준이는 중학생입니다. 어느 날, 그는 위험에 처한 북극곰에 관한 영상을 보았습니다.","fx":[{"w":"are","r":"is","at":1,"t":"be동사의 현재형","m":"주어 Seojun 단수: is (are 아님)"},{"w":"him","r":"he","at":8,"t":"인칭대명사의 주격","m":"주어 자리에는 주격 he 사용"}]},{"n":2,"en":"He felt sorry for them, so he decided to do something. Now he does a lot of thing to help the Earth.","ko":"그는 그들이 안타까웠고, 그래서 무언가를 하기로 결심했습니다. 이제 그는 지구를 돕기 위해 많은 것들을 해요.","fx":[{"w":"thing","r":"things","at":17,"t":"명사의 복수형","m":"a lot of 뒤에는 복수명사 things 사용"}]},{"n":4,"en":"Seojun always carries his bottle with him to drink waters. He doesn't use paper cups.","ko":"서준이는 물을 마시기 위해 항상 물병을 가지고 다닙니다. 그는 종이컵을 사용하지 않아요.","fx":[{"w":"waters","r":"water","at":9,"t":"셀 수 없는 명사","m":"water는 셀 수 없는 명사라 복수형 불가"}]},{"n":5,"en":"Also, Seojun don't use paper towels when he dries his hands on restrooms. He uses his own handkerchief.","ko":"또한, 서준이는 화장실에서 손을 말릴 때 종이 타월을 사용하지 않습니다. 그는 자신의 손수건을 사용해요.","fx":[{"w":"don't","r":"doesn't","at":2,"t":"일반동사의 부정문","m":"3인칭 단수 주어 Seojun에는 doesn't 사용"},{"w":"on","r":"in","at":11,"t":"기본전치사","m":"'화장실에서'는 전치사 in 사용"}]},{"n":6,"en":"Every weekend, Seojun's family have special meatless meals. Seojun's parents make him fresh salads with fruits and vegetables.","ko":"매주 주말, 서준이의 가족은 고기 없는 특별한 식사를 합니다. 서준이의 부모님은 그에게 과일과 야채가 든 신선한 샐러드를 만들어 줍니다.","fx":[{"w":"have","r":"has","at":4,"t":"3인칭 단수 현재형","m":"주어 family(단수)는 has (have 아님)"}]},{"n":7,"en":"He also enjoys deliciously beans and mushrooms. The food comes from local farms, so it doesn't travels far.","ko":"그는 또한 맛있는 콩과 버섯도 즐겨 먹어요. 그 음식들은 지역 농장에서 오는 것들이라, 멀리 이동하지 않습니다.","fx":[{"w":"deliciously","r":"delicious","at":3,"t":"형용사와 부사","m":"명사 beans를 꾸미는 형용사 delicious 사용"},{"w":"travels","r":"travel","at":16,"t":"일반동사의 부정문","m":"doesn't 뒤에는 동사원형 travel 사용"}]},{"n":8,"en":"In Fridays, Seojun takes plastic bottles and cans to an zero waste shop. Then, he gets green points.","ko":"금요일마다, 서준이는 플라스틱 병과 캔을 제로 웨이스트 가게로 가지고 갑니다. 그러고 나서, 그는 친환경 포인트를 받습니다.","fx":[{"w":"In","r":"On","at":0,"t":"기본전치사","m":"요일 앞에는 전치사 On 사용"},{"w":"an","r":"a","at":9,"t":"관사 a/an","m":"자음 소리 zero 앞에는 a 사용"}]},{"n":9,"en":"With this points, Seojun buys green products like eco-bags and bamboo toothbrushes.","ko":"서준이는 이 포인트로 에코백이나 대나무 칫솔과 같은 친환경 제품을 구매합니다.","fx":[{"w":"this","r":"these","at":1,"t":"지시형용사","m":"복수명사 points 앞에는 these 사용"}]},{"n":11,"en":"Seojun's green life teaches us a well lesson. Like Seojun, we can makes some simple changes in us every
