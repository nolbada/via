gratulate him, fans bought a hat and gave it to him as a gift.","ko":"밑줄 친 him이 가리키는 것은?","sko":"그래서, 그를 축하하기 위해, 팬들은 모자를 사서 선물로 그에게 주었다.","opts":["타자 한 명","한 팬","경기를 본 아이","투수"],"r":{"a":"4) 투수","ev":"9번, 11번 문장","s":[[9,"For the first time in 1858, a bowler defeated three batsmen with only three throws.","1858년에 처음으로, 한 투수가 단 세 번의 투구로 세 명의 타자를 이겼다."],[11,"So, to congratulate him, fans bought a hat and gave it to him as a gift.","그래서, 그를 축하하기 위해, 팬들은 모자를 사서 선물로 그에게 주었다."]],"w":"팬들이 축하해 준 사람은 9번에서 세 번 던져 세 명의 타자를 이긴 투수(a bowler)예요.","c":4},"h":"c2c5677c35"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"An excellent “trick” was worth receiving a “hat”!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"훌륭한 ‘재주’는 ‘모자’를 받을 가치가 있었다!","opts":["훌륭한 ‘재주’는 ‘모자’를 받을 가치가 있었다!","‘모자’를 쓰면 훌륭한 ‘재주’를 부릴 수 있었다!","‘재주’를 부리다가 ‘모자’를 잃어버렸다!","‘모자’는 훌륭한 ‘재주’를 위해 꼭 필요한 물건이었다!"],"r":{"a":"1) 훌륭한 ‘재주’는 ‘모자’를 받을 가치가 있었다!","ev":"13번 문장","s":[[13,"An excellent “trick” was worth receiving a “hat”!","훌륭한 ‘재주’는 ‘모자’를 받을 가치가 있었다!"]],"w":"be worth -ing는 '~할 가치가 있다'예요. 그래서 '훌륭한 재주(trick)는 모자(hat)를 받을 가치가 있었다'는 뜻이에요.","c":1},"h":"48aec716c4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["축구 팬들은 해트트릭이 나오면 항상 잔디 위에 모자를 던진다.","아이스하키 선수들은 경기를 시작하려고 모자를 던진다.","아이스하키 팬들은 가끔 해트트릭을 축하하려고 모자를 얼음 위에 던진다.","아이스하키 팬들은 팀이 졌을 때 모자를 던진다."],"opts":["Soccer fans always throw their hats on the grass when there is a hat trick.","Ice hockey players throw their hats to start a game.","Ice hockey fans sometimes throw their hats on the ice to celebrate a hat trick.","Ice hockey fans throw their hats when their team loses."],"r":{"a":"3) Ice hockey fans sometimes throw their hats on the ice to celebrate a hat trick.","ev":"3번 문장","s":[[3,"When this happens in ice hockey, fans sometimes throw their hats on the ice to celebrate it.","이것이 아이스하키에서 일어나면, 팬들은 가끔 축하하기 위해 그들의 모자를 얼음 위에 던진다."]],"w":"3번 문장에서 아이스하키에서 해트트릭이 나오면 팬들이 가끔 축하하려고 모자를 얼음 위에 던진다고 해요. 나머지 선지는 이 내용과 어긋나요.","c":3},"h":"2f4e08f60a"},{"n":9,"t":"sum","q":"In 1858, a bowler defeated three batsmen with only (A) throws, so fans gave him a (B) as a gift.","ko":"1858년에 투수가 단 (A)번의 투구로 세 명의 타자를 이겼고, 그래서 팬들은 선물로 그에게 (B)을(를) 주었다.","oko":["(A) 다섯 / (B) 공","(A) 세 / (B) 공","(A) 열 / (B) 모자","(A) 다섯 / (B) 모자","(A) 세 / (B) 모자"],"opts":["(A) five / (B) ball","(A) three / (B) ball","(A) ten / (B) hat","(A) five / (B) hat","(A) three / (B) hat"],"r":{"a":"5) (A) three / (B) hat","ev":"9~11번 문장","s":[[9,"For the first time in 1858, a bowler defeated three batsmen with only three throws.","1858년에 처음으로, 한 투수가 단 세 번의 투구로 세 명의 타자를 이겼다."],[10,"This was a rare accomplishment since it’s hard to get even one batsman out.","한 명의 타자를 아웃시키는 것조차 어렵기 때문에 이것은 드문 업적이었다."],[11,"So, to congratulate him, fans bought a hat and gave it to him as a gift.","그래서, 그를 축하하기 위해, 팬들은 모자를 사서 선물로 그에게 주었다."]],"w":"9번에서 투수가 단 세 번(three) 던져 세 명의 타자를 이겼고, 11번에서 팬들이 모자(hat)를 선물로 주었어요.","c":5},"h":"0588a7d1d8"},{"n":10,"t":"fill","q":"Hat trick comes from [A], a traditional English sport, in which a [B] throws the ball and a batsman hits it.","ko":"해트트릭은 전통적인 영국 스포츠인 [A]에서 유래했으며, 그 경기에서는 [B]이(가) 공을 던지고 타자가 그것을 친다.","bank":["cricket","bowler","hat","trick","gift","match"],"bko":{"cricket":"크리켓","bowler":"투수","hat":"모자","trick":"재주","gift":"선물","match":"경기"},"r":{"a":"[A] cricket, [B] bowler","ev":"5번, 8번 문장","s":[[5,"The term hat trick originally comes from a traditional English sport, cricket.","해트트릭이라는 용어는 원래 전통적인 영국 스포츠인 크리켓에서 유래한다."],[8,"The bowler throws the ball, and the batsman hits it.","투수는 공을 던지고, 타자는 그것을 친다."]],"w":"5번에서 hat trick은 전통 영국 스포츠인 크리켓(cricket)에서 유래했다고 하고, 8번에서 투수(bowler)는 공을 던지고 타자는 그것을 친다고 해요.","c":null},"h":"ce56e83a8f"}]},{"u":7,"id":"hk2-07-4","no":4,"ko":"얼음 땡!","items":[{"n":1,"t":"tf","q":"Wood frogs freeze when winter comes.","ko":"겨울이 오면 송장 개구리는 언다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"When winter comes, wood frogs freeze.","겨울이 오면, 송장 개구리는 언다."]],"w":"6번 문장에서 겨울이 오면 송장 개구리가 언다고 해요. 본문과 맞아요.","c":"T"},"h":"daa3c574bd"},{"n":2,"t":"tf","q":"The antifreeze substance stops all of the water in wood frogs’ bodies from freezing.","ko":"동결 방지 물질은 송장 개구리 몸의 모든 물이 어는 것을 막는다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"This prevents one-third of the water in their bodies from freezing.","이것은 몸에 있는 물의 3분의 1이 어는 것을 막는다."]],"w":"11번 문장에서 이 물질이 막는 것은 몸속 물의 '3분의 1'이 어는 것이에요. 모든 물이라는 말은 틀려요.","c":"F"},"h":"6dd8940f46"},{"n":3,"t":"tf","q":"Medical experts are studying the ability of wood frogs.","ko":"의료전문가들은 송장 개구리의 능력을 연구하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"Nowadays, medical experts are studying this amazing ability of wood frogs.","요즘, 의료전문가들은 송장 개구리의 이 놀라운 능력을 연구하고 있다."]],"w":"13번 문장에서 요즘 의료전문가들이 송장 개구리의 놀라운 능력을 연구하고 있다고 해요.","c":"T"},"h":"0fe775bf6f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, when spring comes, they revive!)","ko":"하지만, 봄이 오면, 그것들은 ( )!","opts":["사라진다","되살아난다","도망간다","잠든다"],"word":"revive","r":{"a":"2) 되살아난다","ev":"8~9번 문장","s":[[8,"This lasts for months, so they seem dead.","이것은 몇 달 동안 지속되어서, 그것들은 죽은 것처럼 보인다."],[9,"However, when spring comes, they revive!","하지만, 봄이 오면, 그것들은 되살아난다!"]],"w":"8번에서 개구리는 몇 달 동안 죽은 것처럼 보여요. 그런데 However(하지만)로 반전이 오니, 봄에는 다시 살아난다는 뜻의 revive(되살아나다)가 알맞아요.","c":2},"h":"760307c7e3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This lasts for months, so they seem dead.)","ko":"이것은 몇 달 동안 ( ), 그래서 그것들은 죽은 것처럼 보인다.","opts":["끝난다","달라진다","멈춘다","지속된다"],"word":"lasts","r":{"a":"4) 지속된다","ev":"7~8번 문장","s":[[7,"Their breathing as well as their brain and heart activity stops completely.","뇌와 심장 활동뿐만 아니라 호흡도 완전히 멈춘다."],[8,"This lasts for months, so they seem dead.","이것은 몇 달 동안 지속되어서, 그것들은 죽은 것처럼 보인다."]],"w":"7번에서 호흡과 심장이 멈춘 상태가 몇 달 동안 이어져서 죽은 것처럼 보여요. last는 '지속되다'예요.","c":4},"h":"027713dcb4"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nIf their bodies weren’t able to produce it, they would freeze to death.","ko":"밑줄 친 it이 가리키는 것은?","sko":"만약 그것들의 몸이 그것을 만들어내지 못한다면, 그것들은 얼어 죽을 것이다.","opts":["겨울의 낮은 온도","몸에 있는 물","특수한 동결 방지 물질","얼음 덩어리"],"r":{"a":"3) 특수한 동결 방지 물질","ev":"10번, 12번 문장","s":[[10,"When wood frogs start to freeze, their bodies produce a special antifreeze substance.","송장 개구리가 얼기 시작할 때, 그것들의 몸은 특수한 동결 방지 물질을 만들어낸다."],[12,"If their bodies weren’t able to produce it, they would freeze to death.","만약 그것들의 몸이 그것을 만들어내지 못한다면, 그것들은 얼어 죽을 것이다."]],"w":"몸이 '만들어내는' 것은 10번의 special antifreeze substance(특수한 동결 방지 물질)예요. 12번은 이 물질을 만들지 못하면 얼어 죽는다는 내용이에요.","c":3},"h":"bc3a8d2f7d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Someday, they may find a way to freeze and unfreeze a person!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"언젠가는, 그들이 사람을 얼리고 녹이는 방법을 찾을지도 모른다!","opts":["그들은 이미 사람을 얼리고 녹이는 방법을 널리 쓰고 있다!","언젠가, 그들은 사람이 개구리로 변하는 방법을 찾을지도 모른다!","그들은 사람을 얼리는 일이 불가능하다는 것을 확인했다!","언젠가, 그들은 사람을 얼리고 녹이는 방법을 찾을지도 모른다!"],"r":{"a":"4) 언젠가, 그들은 사람을 얼리고 녹이는 방법을 찾을지도 모른다!","ev":"14번 문장","s":[[14,"Someday, they may find a way to freeze and unfreeze a person!","언젠가는, 그들이 사람을 얼리고 녹이는 방법을 찾을지도 모른다!"]],"w":"Someday는 '언젠가', may find는 '찾을지도 모른다', a way to freeze and unfreeze a person은 '사람을 얼리고 녹이는 방법'이에요. 지금은 아직 못 찾았다는 뜻이에요.","c":4},"h":"dbeadcb7e4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["송장 개구리는 북아메리카 전역에서 발견되고 북극에도 산다.","송장 개구리는 얼어 있는 동안에도 계속 숨을 쉰다.","송장 개구리는 따뜻한 곳에서만 산다.","송장 개구리는 봄이 오면 얼어 죽는다."],"opts":["Wood frogs are found across North America and even live in the Arctic.","Wood frogs keep breathing while they are frozen.","Wood frogs live only in warm places.","Wood frogs freeze to death when spring comes."],"r":{"a":"1) Wood frogs are found across North America and even live in the Arctic.","ev":"4번, 7번, 9번 문장","s":[[4,"Wood frogs, which are found across North America, even live in the Arctic.","송장 개구리는, 북아메리카 전역에서 발견되는데, 심지어 북극에도 산다."],[7,"Their breathing as well as their brain and heart activity stops completely.","뇌와 심장 활동뿐만 아니라 호흡도 완전히 멈춘다."],[9,"However, when spring comes, they revive!","하지만, 봄이 오면, 그것들은 되살아난다!"]],"w":"4번에서 송장 개구리는 북아메리카 전역에서 발견되고 심지어 북극에도 산다고 해요. 얼면 호흡이 멈추고(7번), 봄에는 되살아나요(9번).","c":1},"h":"ca62aec7b0"},{"n":9,"t":"sum","q":"In winter, wood frogs (A) and seem dead, but in spring they (B).","ko":"겨울에 송장 개구리는 (A)하고 죽은 것처럼 보이지만, 봄에는 (B).","oko":["(A) 잠자고 / (B) 떠난다","(A) 얼고 / (B) 죽는다","(A) 이동하고 / (B) 되살아난다","(A) 먹고 / (B) 언다","(A) 얼고 / (B) 되살아난다"],"opts":["(A) sleep / (B) leave","(A) freeze / (B) die","(A) migrate / (B) revive","(A) eat / (B) freeze","(A) freeze / (B) revive"],"r":{"a":"5) (A) freeze / (B) revive","ev":"6번, 8번, 9번 문장","s":[[6,"When winter comes, wood frogs freeze.","겨울이 오면, 송장 개구리는 언다."],[8,"This lasts for months, so they seem dead.","이것은 몇 달 동안 지속되어서, 그것들은 죽은 것처럼 보인다."],[9,"However, when spring comes, they revive!","하지만, 봄이 오면, 그것들은 되살아난다!"]],"w":"6번에서 겨울에 송장 개구리는 얼고(freeze), 8번에서 죽은 것처럼 보이다가 9번에서 봄이 오면 되살아나요(revive).","c":5},"h":"d1ec929c0b"},{"n":10,"t":"fill","q":"Wood frogs produce a special [A] substance, and it prevents one-third of the water in their bodies from [B].","ko":"송장 개구리는 특수한 [A] 물질을 만들어내고, 그것은 몸속 물의 3분의 1이 [B]하는 것을 막는다.","bank":["antifreeze","freezing","survive","spring","revive","brain"],"bko":{"antifreeze":"동결 방지의","freezing":"어는 것","survive":"견뎌내다","spring":"봄","revive":"되살아나다","brain":"뇌"},"r":{"a":"[A] antifreeze, [B] freezing","ev":"10~11번 문장","s":[[10,"When wood frogs start to freeze, their bodies produce a special antifreeze substance.","송장 개구리가 얼기 시작할 때, 그것들의 몸은 특수한 동결 방지 물질을 만들어낸다."],[11,"This prevents one-third of the water in their bodies from freezing.","이것은 몸에 있는 물의 3분의 1이 어는 것을 막는다."]],"w":"10번에서 몸이 만드는 것은 특수한 동결 방지(antifreeze) 물질이고, 11번에서 이것이 몸속 물의 3분의 1이 어는(freezing) 것을 막는다고 해요.","c":null},"h":"2f9058d3b6"}]},{"u":8,"id":"hk2-08-1","no":1,"ko":"단순하지만 매력 있어","items":[{"n":1,"t":"tf","q":"All the brand logos above use the same typeface.","ko":"위의 브랜드 로고들은 모두 같은 서체를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They all use the same typeface—Helvetica!","그것들은 모두 헬베티카라는 같은 서체를 사용한다!"]],"w":"3번 문장에서 로고들이 모두 같은 서체인 헬베티카를 쓴다고 해요. 본문과 맞아요.","c":"T"},"h":"86c28e65a0"},{"n":2,"t":"tf","q":"Helvetica is rarely used in corporate logos or websites.","ko":"헬베티카는 기업 로고나 웹사이트에 거의 쓰이지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Though you may not have noticed, Helvetica is used in many corporate logos, posters, and websites.","비록 알아차리지 못했을 수도 있지만, 헬베티카는 많은 기업 로고, 포스터, 그리고 웹사이트에 사용된다."]],"w":"4번 문장에서 헬베티카는 많은 기업 로고, 포스터, 웹사이트에 쓰인다고 해요. 거의 쓰이지 않는다는 말은 반대예요.","c":"F"},"h":"d6942dad7f"},{"n":3,"t":"tf","q":"Each letter of Helvetica is almost the same width and height.","ko":"헬베티카의 각 글자는 폭과 높이가 거의 같다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Each letter is almost the same width and height.","각각의 글자는 폭과 높이가 거의 같다."]],"w":"7번 문장에 each letter is almost the same width and height가 그대로 나와요.","c":"T"},"h":"93535525bd"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Helvetica has a uniform appearance.)","ko":"헬베티카는 ( ) 모양을 가지고 있다.","opts":["복잡한","불규칙한","균일한","화려한"],"word":"uniform","r":{"a":"3) 균일한","ev":"6~7번 문장","s":[[6,"Helvetica has a uniform appearance.","헬베티카는 균일한 모양을 가지고 있다."],[7,"Each letter is almost the same width and height.","각각의 글자는 폭과 높이가 거의 같다."]],"w":"6번의 uniform appearance를 7번이 풀어 줘요. 각 글자의 폭과 높이가 거의 같다는 것이니 uniform은 '균일한'이에요.","c":3},"h":"36d4c76d79"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In addition, Helvetica is neutral and simple.)","ko":"게다가, 헬베티카는 ( )이고 단순하다.","opts":["화려한","중성적인","자극적인","값비싼"],"word":"neutral","r":{"a":"2) 중성적인","ev":"9~11번 문장","s":[[9,"In addition, Helvetica is neutral and simple.","게다가, 헬베티카는 중성적이고 단순하다."],[10,"Most other fonts are designed to give you a certain feeling about the text.","대부분의 다른 서체들은 글자에 대한 특정한 느낌을 주도록 디자인되어 있다."],[11,"However, Helvetica is not supposed to stand out or call attention to itself.","하지만, 헬베티카는 눈에 띄거나 그것 자체에 주의를 끌도록 되어 있지 않다."]],"w":"10~11번에서 다른 서체는 특정한 느낌을 주지만 헬베티카는 눈에 띄지 않는다고 해요. 한쪽으로 치우치지 않는다는 뜻이라 neutral은 '중성적인'이에요.","c":2},"h":"69617fdf00"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis makes the font easy to read.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 그 서체를 읽기 쉽게 만든다.","opts":["헬베티카가 인기 있는 것","디자이너가 서체를 고르는 것","로고에 서체를 쓰는 것","각 글자의 폭과 높이가 거의 같은 것"],"r":{"a":"4) 각 글자의 폭과 높이가 거의 같은 것","ev":"7~8번 문장","s":[[7,"Each letter is almost the same width and height.","각각의 글자는 폭과 높이가 거의 같다."],[8,"This makes the font easy to read.","이것은 그 서체를 읽기 쉽게 만든다."]],"w":"읽기 쉽게 만드는 원인은 바로 앞 7번의 내용, 즉 각 글자의 폭과 높이가 거의 같다는 점이에요.","c":4},"h":"49466a445a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"No matter what they do, it fits right in!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들이 무엇을 하더라도, 그것은 딱 들어맞는다!","opts":["그들이 무엇을 하더라도, 그것은 딱 들어맞는다!","그들이 무엇을 하는지 때문에, 그것은 눈에 띈다!","그들이 아무것도 하지 않으면, 그것은 어울리지 않는다!","그들이 무엇을 하든, 그것은 점점 사라진다!"],"r":{"a":"1) 그들이 무엇을 하더라도, 그것은 딱 들어맞는다!","ev":"13번 문장","s":[[13,"No matter what they do, it fits right in!","그들이 무엇을 하더라도, 그것은 딱 들어맞는다!"]],"w":"No matter what ~은 '무엇을 ~하더라도'이고 fit in은 '어울리다, 들어맞다'예요. 디자이너가 어떻게 쓰든 헬베티카는 잘 어울린다는 뜻이에요.","c":1},"h":"3d056cd517"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대부분의 서체는 헬베티카처럼 눈에 띄지 않게 만들어진다.","헬베티카는 읽는 사람에게 특정한 느낌을 주려고 만들어졌다.","헬베티카는 눈에 띄거나 주의를 끌도록 되어 있지 않다.","헬베티카는 로고에 처음으로 쓰인 서체이다."],"opts":["Most fonts are made not to stand out, just like Helvetica.","Helvetica was made to give readers a certain feeling.","Helvetica is not supposed to stand out or call attention to itself.","Helvetica was the first typeface used in logos."],"r":{"a":"3) Helvetica is not supposed to stand out or call attention to itself.","ev":"10~11번 문장","s":[[10,"Most other fonts are designed to give you a certain feeling about the text.","대부분의 다른 서체들은 글자에 대한 특정한 느낌을 주도록 디자인되어 있다."],[11,"However, Helvetica is not supposed to stand out or call attention to itself.","하지만, 헬베티카는 눈에 띄거나 그것 자체에 주의를 끌도록 되어 있지 않다."]],"w":"11번에서 헬베티카는 눈에 띄거나 주의를 끌도록 되어 있지 않다고 해요. 10번에서 대부분의 다른 서체는 특정한 느낌을 주도록 디자인되어 있다고 해서 1, 2번 선지와 어긋나요.","c":3},"h":"35b96bdc05"},{"n":9,"t":"sum","q":"Helvetica is (A) and simple, so designers can use it in many (B) ways.","ko":"헬베티카는 (A)이고 단순해서, 디자이너들은 그것을 많은 (B) 방식으로 사용할 수 있다.","oko":["(A) 눈에 띄는 / (B) 창의적인","(A) 중성적인 / (B) 위험한","(A) 화려한 / (B) 지루한","(A) 중성적인 / (B) 창의적인","(A) 비싼 / (B) 위험한"],"opts":["(A) loud / (B) creative","(A) neutral / (B) dangerous","(A) colorful / (B) boring","(A) neutral / (B) creative","(A) expensive / (B) dangerous"],"r":{"a":"4) (A) neutral / (B) creative","ev":"9번, 12번 문장","s":[[9,"In addition, Helvetica is neutral and simple.","게다가, 헬베티카는 중성적이고 단순하다."],[12,"So, designers can use it in a variety of creative ways.","그래서, 디자이너들은 그것을 다양한 창의적인 방식으로 사용할 수 있다."]],"w":"9번에서 헬베티카는 중성적이고(neutral) 단순하며, 12번에서 그래서 디자이너들이 다양한 창의적인(creative) 방식으로 쓸 수 있다고 해요.","c":4},"h":"fcaee09766"},{"n":10,"t":"fill","q":"Helvetica has a [A] appearance because each letter is almost the same [B] and height.","ko":"헬베티카는 각 글자의 [B]과(와) 높이가 거의 같아서 [A] 모양을 가지고 있다.","bank":["uniform","width","noticed","typeface","designer","logo"],"bko":{"uniform":"균일한","width":"폭","noticed":"알아차렸다","designer":"디자이너","logo":"로고","typeface":"서체"},"r":{"a":"[A] uniform, [B] width","ev":"6~7번 문장","s":[[6,"Helvetica has a uniform appearance.","헬베티카는 균일한 모양을 가지고 있다."],[7,"Each letter is almost the same width and height.","각각의 글자는 폭과 높이가 거의 같다."]],"w":"6번에서 헬베티카는 균일한(uniform) 모양을 가지고 있고, 7번에서 각 글자의 폭(width)과 높이가 거의 같다고 해요.","c":null},"h":"6b52d70312"}]},{"u":8,"id":"hk2-08-2","no":2,"ko":"3, 2, 1... 해피 뉴 이어!","items":[{"n":1,"t":"tf","q":"In Denmark, everyone jumps down when the clock strikes 12.","ko":"덴마크에서는 시계가 12시를 알리면 모든 사람이 뛰어내린다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"When the clock strikes 12, everyone jumps down!","시계가 12시를 알리면, 모든 사람은 뛰어내린다!"]],"w":"4번 문장에서 시계가 12시를 알리면 모든 사람이 뛰어내린다고 해요. 본문과 맞아요.","c":"T"},"h":"96287579ec"},{"n":2,"t":"tf","q":"In the Philippines, square things are symbols of fortune.","ko":"필리핀에서는 네모난 것이 행운의 상징이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Coins represent wealth in the coming year because round things are symbols of fortune in the Philippines.","동전은 다가오는 해의 부를 상징하는데, 왜냐하면 필리핀에서 둥근 것은 행운의 상징이기 때문이다."]],"w":"7번 문장에서 필리핀에서 행운의 상징은 둥근(round) 것이에요. 네모난 것이라는 말은 틀려요.","c":"F"},"h":"a39a4049f0"},{"n":3,"t":"tf","q":"In the Philippines, children pick up the coins that were scattered in homes.","ko":"필리핀에서는 아이들이 집 안에 뿌려진 동전을 줍는다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"These are later picked up by children, who put them in their pockets.","이 동전은 나중에 아이들에 의해 주워지는데, 그들은 그것들을 주머니에 넣는다."]],"w":"9번 문장에서 뿌려진 동전을 나중에 아이들이 주워 주머니에 넣는다고 해요.","c":"T"},"h":"ff56e2ee3a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (On December 31, people scatter coins inside their homes.)","ko":"12월 31일에, 사람들은 집 안에 동전을 ( ).","opts":["모은다","뿌린다","숨긴다","센다"],"word":"scatter","r":{"a":"2) 뿌린다","ev":"8~9번 문장","s":[[8,"On December 31, people scatter coins inside their homes.","12월 31일에, 사람들은 그들의 집 안에 동전을 뿌린다."],[9,"These are later picked up by children, who put them in their pockets.","이 동전은 나중에 아이들에 의해 주워지는데, 그들은 그것들을 주머니에 넣는다."]],"w":"8번 뒤 9번에서 아이들이 그 동전을 주워서 주머니에 넣어요. 동전이 집 안 여기저기 널려 있어야 줍는 일이 생기니, scatter는 '뿌리다'예요.","c":2},"h":"7632a14894"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This is because the loud noise scares bad luck away.)","ko":"이것은 큰 소음이 불운을 ( ) 때문이다.","opts":["가져오기","기록하기","부르기","쫓아버리기"],"word":"scares","r":{"a":"4) 쫓아버리기","ev":"10~11번 문장","s":[[10,"Then, at midnight, the children shake their pockets filled with the coins.","그러고 나서, 자정에, 아이들은 동전으로 가득 찬 주머니를 흔든다."],[11,"This is because the loud noise scares bad luck away.","이것은 큰 소음이 불운을 쫓아버리기 때문이다."]],"w":"10번에서 아이들이 동전이 든 주머니를 흔들어 큰 소리를 내요. 11번은 그 이유로 소음이 불운을 겁주어 쫓아버린다는 뜻의 scare away(쫓아버리다)를 써요.","c":4},"h":"f01dc34093"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis means they are jumping into the new year.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 그들이 새해로 뛰어든다는 것을 의미한다.","opts":["카운트다운을 하는 것","의자와 소파를 사는 것","시계가 12시를 알릴 때 모두 뛰어내리는 것","새해에 대한 질문을 던지는 것"],"r":{"a":"3) 시계가 12시를 알릴 때 모두 뛰어내리는 것","ev":"4~5번 문장","s":[[4,"When the clock strikes 12, everyone jumps down!","시계가 12시를 알리면, 모든 사람은 뛰어내린다!"],[5,"This means they are jumping into the new year.","이것은 그들이 새해로 뛰어든다는 것을 의미한다."]],"w":"새해 속으로 뛰어든다는 의미를 갖는 행동은 바로 앞 4번의 '시계가 12시를 알릴 때 모든 사람이 뛰어내리는 것'이에요.","c":3},"h":"5b8595433c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The more coins they shake, the louder the noise is and the better their year will be.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들이 더 많은 동전을 흔들수록, 소음이 더 커지고 그들의 한 해가 더 좋아질 것이다.","opts":["동전을 더 많이 흔들수록, 소음이 더 커지고 한 해도 더 좋아질 것이다.","동전을 더 많이 흔들수록, 소음이 작아지고 한 해는 나빠질 것이다.","소음이 커질수록, 동전은 더 적어지고 한 해는 좋아질 것이다.","동전을 얼마나 흔드는지는 소음이나 한 해와 관계가 없다."],"r":{"a":"1) 동전을 더 많이 흔들수록, 소음이 더 커지고 한 해도 더 좋아질 것이다.","ev":"12번 문장","s":[[12,"The more coins they shake, the louder the noise is and the better their year will be.","그들이 더 많은 동전을 흔들수록, 소음이 더 커지고 그들의 한 해가 더 좋아질 것이다."]],"w":"「The+비교급 ~, the+비교급 …」은 '~할수록 더 …하다'예요. 동전을 많이 흔들수록 소음이 커지고 한 해가 좋아진다는 뜻이에요.","c":1},"h":"40c210ecfd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["필리핀에서 동전은 불운을 상징한다.","덴마크 사람들은 의자, 소파, 탁자 위에서 새해로 뛰어내린다.","필리핀에서는 어른들이 뿌려진 동전을 줍는다.","덴마크에서는 사람들이 뛴 다음에 카운트다운을 한다."],"opts":["In the Philippines, coins stand for bad luck.","In Denmark, people jump into the new year from chairs, sofas, or tables.","In the Philippines, adults pick up the scattered coins.","In Denmark, people count down after they jump."],"r":{"a":"2) In Denmark, people jump into the new year from chairs, sofas, or tables.","ev":"2~5번 문장","s":[[2,"In Denmark, people get ready to jump right after the countdown.","덴마크에서는, 사람들이 카운트다운 직후에 뛸 준비를 한다."],[3,"They stand on chairs, sofas, or tables.","그들은 의자, 소파, 또는 탁자 위에 선다."],[4,"When the clock strikes 12, everyone jumps down!","시계가 12시를 알리면, 모든 사람은 뛰어내린다!"],[5,"This means they are jumping into the new year.","이것은 그들이 새해로 뛰어든다는 것을 의미한다."]],"w":"2~5번에서 덴마크 사람들은 의자, 소파, 탁자 위에 섰다가 12시에 뛰어내려 새해로 뛰어든다고 해요. 필리핀의 동전은 부를 상징하고(7번), 줍는 사람은 아이들이며(9번), 뛰는 일은 카운트다운 직후예요(2번).","c":2},"h":"cc8b113c42"},{"n":9,"t":"sum","q":"In the Philippines, people (A) coins at home on December 31, and the children (B) their pockets at midnight to scare bad luck away.","ko":"필리핀에서는 12월 31일에 집에서 동전을 (A)하고, 아이들은 자정에 불운을 쫓으려고 주머니를 (B).","oko":["(A) 모으고 / (B) 던진다","(A) 숨기고 / (B) 씻는다","(A) 뿌리고 / (B) 흔든다","(A) 뿌리고 / (B) 센다","(A) 팔고 / (B) 흔든다"],"opts":["(A) collect / (B) throw","(A) hide / (B) wash","(A) scatter / (B) shake","(A) scatter / (B) count","(A) sell / (B) shake"],"r":{"a":"3) (A) scatter / (B) shake","ev":"8번, 10번, 11번 문장","s":[[8,"On December 31, people scatter coins inside their homes.","12월 31일에, 사람들은 그들의 집 안에 동전을 뿌린다."],[10,"Then, at midnight, the children shake their pockets filled with the coins.","그러고 나서, 자정에, 아이들은 동전으로 가득 찬 주머니를 흔든다."],[11,"This is because the loud noise scares bad luck away.","이것은 큰 소음이 불운을 쫓아버리기 때문이다."]],"w":"8번에서 12월 31일에 집 안에 동전을 뿌리고(scatter), 10번에서 자정에 아이들이 주머니를 흔들며(shake), 11번에서 그 소음이 불운을 쫓는다고 해요.","c":3},"h":"859b435a15"},{"n":10,"t":"fill","q":"The start of the new year is usually celebrated with a [A], but some countries do more to [B].","ko":"새해의 시작은 보통 [A]과(와) 함께 기념되지만, 몇몇 나라들은 [B]하기 위해 더 많은 것을 한다.","bank":["countdown","celebrate","scatter","wealth","pockets","jump"],"bko":{"countdown":"카운트다운","celebrate":"기념하다","scatter":"뿌리다","wealth":"부","pockets":"주머니","jump":"뛰다"},"r":{"a":"[A] countdown, [B] celebrate","ev":"1번 문장","s":[[1,"The start of the new year is usually celebrated with a countdown, but some countries do more to celebrate.","새해의 시작은 보통 카운트다운과 함께 기념되지만, 몇몇 나라들은 기념하기 위해 더 많은 것을 한다."]],"w":"1번에서 새해의 시작은 보통 countdown(카운트다운)과 함께 기념되지만, 몇몇 나라들은 celebrate(기념하다)하기 위해 더 많은 것을 한다고 해요.","c":null},"h":"1bdfa587b7"}]},{"u":8,"id":"hk2-08-3","no":3,"ko":"슬기로운 호흡 생활","items":[{"n":1,"t":"tf","q":"The tiny hairs in your nose keep dust and dirt from entering the lungs.","ko":"콧속의 작은 털들은 티끌과 먼지가 폐에 들어가는 것을 막는다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"First of all, the tiny hairs in your nose trap dust and dirt, so they don’t enter the lungs.","우선, 콧속의 작은 털들은 티끌과 먼지를 가둬서, 그것들이 폐에 들어가지 않는다."]],"w":"4번 문장에서 콧속의 작은 털들이 티끌과 먼지를 가두어서 폐에 들어가지 않는다고 해요. 본문과 맞아요.","c":"T"},"h":"6ebf6dd008"},{"n":2,"t":"tf","q":"Breathing through your mouth makes the inside of the mouth very wet.","ko":"입으로 숨 쉬면 입 안이 매우 축축해진다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Mainly, it makes the inside of the mouth very dry.","주로, 그것은 입 안을 매우 건조하게 만든다."]],"w":"9번 문장에서 입으로 숨 쉬면 입 안이 매우 '건조해진다(dry)'고 해요. 축축해진다는 말은 반대예요.","c":"F"},"h":"4a2fa0fb10"},{"n":3,"t":"tf","q":"Breathing through your nose helps you think and exercise better.","ko":"코로 숨 쉬는 것은 생각과 운동을 더 잘하도록 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"As a result, you can think and exercise better, since the brain and muscles are well supplied with oxygen.","결과적으로, 당신은 생각과 운동을 더 잘할 수 있는데, 왜냐하면 뇌와 근육이 산소를 잘 공급받기 때문이다."]],"w":"7번 문장에서 코로 숨 쉬면 뇌와 근육이 산소를 잘 공급받아서 생각과 운동을 더 잘할 수 있다고 해요.","c":"T"},"h":"ac430f9182"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the tiny hairs in your nose trap dust and dirt, so they don’t enter the lungs.)","ko":"…콧속의 작은 털들은 티끌과 먼지를 ( ), 그래서 그것들이 폐에 들어가지 않는다.","opts":["퍼뜨려서","가둬서","먹어서","키워서"],"word":"trap","r":{"a":"2) 가둬서","ev":"4번 문장","s":[[4,"First of all, the tiny hairs in your nose trap dust and dirt, so they don’t enter the lungs.","우선, 콧속의 작은 털들은 티끌과 먼지를 가둬서, 그것들이 폐에 들어가지 않는다."]],"w":"먼지가 폐에 들어가지 않으려면 콧털이 먼지를 붙잡아 두어야 해요. 그래서 trap은 '가두다'예요.","c":2},"h":"9f170cde6a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This allows the blood to absorb more oxygen.)","ko":"이것은 혈액이 더 많은 산소를 ( )하도록 한다.","opts":["내보내도록","만들도록","흡수하도록","멈추도록"],"word":"absorb","r":{"a":"3) 흡수하도록","ev":"5~6번 문장","s":[[5,"In addition, a special chemical produced in the nose kills viruses and expands blood vessels.","게다가, 콧속에서 분비되는 특별한 화학 물질은 바이러스를 죽이고 혈관을 팽창시킨다."],[6,"This allows the blood to absorb more oxygen.","이것은 혈액이 더 많은 산소를 흡수하도록 한다."]],"w":"5번에서 혈관이 넓어지고, 6번에서 그 결과 혈액이 산소를 더 많이 받아들여요. absorb는 '흡수하다'예요.","c":3},"h":"ea9872fe1b"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis can produce bad breath and cavities.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 입 냄새와 충치를 만들어낼 수 있다.","opts":["입 안이 매우 건조해지는 것","코로 숨 쉬는 것","콧속의 작은 털","혈관이 팽창하는 것"],"r":{"a":"1) 입 안이 매우 건조해지는 것","ev":"9~10번 문장","s":[[9,"Mainly, it makes the inside of the mouth very dry.","주로, 그것은 입 안을 매우 건조하게 만든다."],[10,"This can produce bad breath and cavities.","이것은 입 냄새와 충치를 만들어낼 수 있다."]],"w":"입 냄새와 충치의 원인은 바로 앞 9번에서 말한 '입 안이 매우 건조해지는 것'이에요.","c":1},"h":"968d41168e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"On the other hand, when you use your mouth to breathe, a lot of issues arise.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"반면에, 당신이 숨 쉬기 위해 입을 사용하면, 많은 문제들이 발생한다.","opts":["반면에, 입으로 숨 쉬면 문제가 하나도 생기지 않는다.","반면에, 숨 쉬기 위해 입을 쓰면 코가 많은 문제를 겪는다.","반면에, 입을 사용하는 사람들은 많은 문제를 해결한다.","반면에, 숨 쉬기 위해 입을 사용하면, 많은 문제들이 생긴다."],"r":{"a":"4) 반면에, 숨 쉬기 위해 입을 사용하면, 많은 문제들이 생긴다.","ev":"8번 문장","s":[[8,"On the other hand, when you use your mouth to breathe, a lot of issues arise.","반면에, 당신이 숨 쉬기 위해 입을 사용하면, 많은 문제들이 발생한다."]],"w":"On the other hand는 '반면에'예요. arise는 '생기다'라서 입으로 숨 쉬면 문제가 많이 생긴다는 뜻이에요.","c":4},"h":"9fd71172ea"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["코로 숨 쉬면 입 안이 건조해진다.","입으로 숨 쉬면 혈액이 산소를 더 많이 흡수한다.","어린 시절에 입으로 숨 쉬면 얼굴이 더 길어질 수 있다.","코로 숨 쉬면 충치가 생긴다."],"opts":["Breathing through the nose makes the inside of the mouth dry.","Mouth breathing helps the blood absorb more oxygen.","Mouth breathing during childhood can make the face longer.","Breathing through the nose causes cavities."],"r":{"a":"3) Mouth breathing during childhood can make the face longer.","ev":"11번 문장","s":[[11,"Furthermore, mouth breathing during childhood can result in uneven teeth and a longer face.","게다가, 어린 시절 동안 입으로 숨 쉬는 것은 고르지 않은 치열과 더 긴 얼굴형을 야기할 수 있다."]],"w":"11번 문장에서 어린 시절에 입으로 숨 쉬면 고르지 않은 치아와 더 긴 얼굴형이 될 수 있다고 해요. 나머지는 입 안 건조(9번), 산소 흡수(5~6번), 충치(10번)와 어긋나요.","c":3},"h":"f16cae4cde"},{"n":9,"t":"sum","q":"Breathing through the (A) is better for you, because mouth breathing makes the inside of the mouth very (B).","ko":"(A)로 숨 쉬는 것이 더 좋은데, 입으로 숨 쉬면 입 안이 매우 (B)해지기 때문이다.","oko":["(A) 입 / (B) 건조","(A) 코 / (B) 축축","(A) 입 / (B) 축축","(A) 코 / (B) 뜨거워","(A) 코 / (B) 건조"],"opts":["(A) mouth / (B) dry","(A) nose / (B) wet","(A) mouth / (B) wet","(A) nose / (B) hot","(A) nose / (B) dry"],"r":{"a":"5) (A) nose / (B) dry","ev":"3번, 9번 문장","s":[[3,"Breathing through your nose is much more beneficial than through your mouth.","코로 숨 쉬는 것은 입으로 숨 쉬는 것보다 훨씬 더 유익하다."],[9,"Mainly, it makes the inside of the mouth very dry.","주로, 그것은 입 안을 매우 건조하게 만든다."]],"w":"3번에서 코로 숨 쉬는 것이 훨씬 유익하다고 하고, 9번에서 입으로 숨 쉬면 입 안이 매우 건조(dry)해진다고 해요.","c":5},"h":"caeb7457b5"},{"n":10,"t":"fill","q":"A special chemical in the nose kills [A] and expands blood [B].","ko":"콧속의 특별한 화학 물질은 [A]을(를) 죽이고 [B]을(를) 팽창시킨다.","bank":["viruses","vessels","childhood","lungs","cavities","muscles"],"bko":{"viruses":"바이러스","vessels":"혈관","childhood":"어린 시절","lungs":"폐","cavities":"충치","muscles":"근육"},"r":{"a":"[A] viruses, [B] vessels","ev":"5번 문장","s":[[5,"In addition, a special chemical produced in the nose kills viruses and expands blood vessels.","게다가, 콧속에서 분비되는 특별한 화학 물질은 바이러스를 죽이고 혈관을 팽창시킨다."]],"w":"5번에서 콧속의 특별한 화학 물질은 바이러스(viruses)를 죽이고 혈관(blood vessels)을 팽창시킨다고 해요.","c":null},"h":"e562aa77b5"}]},{"u":8,"id":"hk2-08-4","no":4,"ko":"쓱싹쓱싹, 얼음을 문질러요","items":[{"n":1,"t":"tf","q":"Every curling team has two sweepers.","ko":"모든 컬링팀에는 두 명의 스위퍼가 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"Every curling team has two players who are called sweepers.","모든 컬링팀에는 스위퍼라고 불리는 두 명의 선수가 있다."]],"w":"4번 문장에서 모든 컬링팀에는 스위퍼라고 불리는 두 명의 선수가 있다고 해요. 본문과 맞아요.","c":"T"},"h":"aa1b33ef72"},{"n":2,"t":"tf","q":"If sweepers don’t sweep at all, the stone moves faster.","ko":"스위퍼들이 전혀 쓸어내지 않으면 스톤은 더 빠르게 움직인다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"On the other hand, if they sweep softly or don’t sweep at all, the stone will slow down and curve more.","반면에, 만약 그들이 살살 쓸어내거나 전혀 쓸어내지 않는다면, 스톤은 느려지고 더 휠 것이다."]],"w":"8번 문장에서 전혀 쓸어내지 않으면 스톤은 느려지고 더 휜다고 해요. 더 빠르다는 말은 반대예요.","c":"F"},"h":"298318871d"},{"n":3,"t":"tf","q":"When the captain says “Whoa!”, the sweepers have to sweep more.","ko":"주장이 “Whoa!”라고 말하면 스위퍼들은 더 쓸어내야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"If it needs less, the captain says “Whoa!”","만약 그것이 덜 필요하다면, 주장은 “Whoa!”라고 말한다."]],"w":"11번 문장에서 얼음이 덜 필요할 때 주장이 “Whoa!”라고 말해요. 즉 덜 쓸어내라는 신호이고, 더 쓸라는 신호는 “Hard!”예요(10번).","c":"F"},"h":"946e542d95"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…to heat up the ice and reduce friction.)","ko":"얼음을 데우고 ( )을 줄이기 위해…","opts":["속도","온도","마찰","소리"],"word":"friction","r":{"a":"3) 마찰","ev":"5번 문장","s":[[5,"They sweep in front of the curling stone to heat up the ice and reduce friction.","그들은 얼음을 데우고 마찰을 줄이기 위해서 컬링 스톤의 앞을 쓸어낸다."]],"w":"스톤 앞을 쓸어서 얼음을 데우면 스톤이 더 잘 미끄러져요. 그래서 줄이려는 것은 마찰(friction)이에요.","c":3},"h":"1a6b459c4f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the stone will slow down and curve more.)","ko":"…스톤은 느려지고 더 ( ).","opts":["빨라진다","휜다","멈춘다","뜨거워진다"],"word":"curve","r":{"a":"2) 휜다","ev":"7~8번 문장","s":[[7,"If they sweep hard, the stone moves faster and straighter.","만약 그들이 세게 쓸어내면, 스톤은 더 빠르고 곧게 움직인다."],[8,"On the other hand, if they sweep softly or don’t sweep at all, the stone will slow down and curve more.","반면에, 만약 그들이 살살 쓸어내거나 전혀 쓸어내지 않는다면, 스톤은 느려지고 더 휠 것이다."]],"w":"7번에서 세게 쓸면 스톤이 곧게 가요. 8번은 그 반대라서 느려지고 더 휜다(curve)는 뜻이에요.","c":2},"h":"d73fcbd4f2"},{"n":6,"t":"ref","q":"What does the underlined \"doing so\" refer to?\nBy doing so, they can control the direction and speed of the ce needs (A) sweeping, and “Whoa!” when it needs (B) sweeping.","ko":"주장은 얼음을 (A) 쓸어내야 할 때 “Hard!”라고 외치고, (B) 쓸어내도 될 때 “Whoa!”라고 외친다.","oko":["(A) 덜 / (B) 더","(A) 더 / (B) 더","(A) 덜 / (B) 덜","(A) 전혀 안 / (B) 더","(A) 더 / (B) 덜"],"opts":["(A) less / (B) more","(A) more / (B) more","(A) less / (B) less","(A) no / (B) more","(A) more / (B) less"],"r":{"a":"5) (A) more / (B) less","ev":"10~11번 문장","s":[[10,"If the ice needs more sweeping, the captain will yell “Hard!”","만약 얼음을 더 쓸어낼 필요가 있다면, 주장은 “Hard!”라고 소리칠 것이다."],[11,"If it needs less, the captain says “Whoa!”","만약 그것이 덜 필요하다면, 주장은 “Whoa!”라고 말한다."]],"w":"10번에서 더 쓸어야 하면(more) “Hard!”, 11번에서 덜 필요하면(less) “Whoa!”라고 해요.","c":5},"h":"8ad429ac5a"},{"n":10,"t":"fill","q":"Sweepers sweep in front of the stone to reduce [A], so they can control the direction and [B] of the stone.","ko":"스위퍼들은 [A]을(를) 줄이려고 스톤 앞을 쓸어내고, 그래서 스톤의 방향과 [B]을(를) 조절할 수 있다.","bank":["friction","speed","captain","broom","sweepers","janitors"],"bko":{"friction":"마찰","speed":"속도","captain":"주장","broom":"빗자루","sweepers":"스위퍼","janitors":"청소부"},"r":{"a":"[A] friction, [B] speed","ev":"5~6번 문장","s":[[5,"They sweep in front of the curling stone to heat up the ice and reduce friction.","그들은 얼음을 데우고 마찰을 줄이기 위해서 컬링 스톤의 앞을 쓸어낸다."],[6,"By doing so, they can control the direction and speed of the stone.","그렇게 함으로써, 그들은 스톤의 방향과 속도를 조절할 수 있다."]],"w":"5번에서 스톤 앞을 쓸어 마찰(friction)을 줄이고, 6번에서 그렇게 해서 스톤의 방향과 속도(speed)를 조절할 수 있다고 해요.","c":null},"h":"c54d6b673b"}]},{"u":9,"id":"hk2-09-1","no":1,"ko":"우주의 골칫덩어리","items":[{"n":1,"t":"tf","q":"About 500,000 pieces of junk are floating around in space.","ko":"약 50만 개의 쓰레기 조각들이 우주에 떠다니고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"There are about 500,000 pieces of junk floating around in space.","약 50만 개의 쓰레기 조각들이 우주에 떠다니고 있다."]],"w":"5번 문장에 about 500,000 pieces of junk floating around in space가 그대로 나와요.","c":"T"},"h":"2ebc56ed02"},{"n":2,"t":"tf","q":"A piece of junk as tiny as a pea is too small to hurt a spacecraft.","ko":" ns during the night.)","ko":"그 인형이 밤 동안 당신의 ( )을 없애줄 것이다.","opts":["선물","걱정","친구","용기"],"word":"concerns","r":{"a":"2) 걱정","ev":"12번 문장","s":[[12,"The worry doll will take away your concerns during the night.","걱정 인형이 밤 동안 당신의 걱정을 없애줄 것이다."]],"w":"걱정 인형이 없애 주는 것은 걱정이에요. concern = 걱정, 염려(worry와 비슷한 말).","c":2},"h":"fb699fd9ee"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nFinally, put it under your pillow and go to sleep.","ko":"밑줄 친 it가 가리키는 것은?","sko":"마지막으로, 그것을 당신의 베개 아래에 놓고 잠들어라.","opts":["이쑤시개","인형","걱정","베개"],"r":{"a":"2) 인형","ev":"10~11번 문장","s":[[10,"Then, tell your doll about something that is bothering you.","그러고 나서, 인형에게 당신을 신경 쓰이게 하는 것에 대해 말해라."],[11,"Finally, put it under your pillow and go to sleep.","마지막으로, 그것을 당신의 베개 아래에 놓고 잠들어라."]],"w":"10번에서 your doll에게 이야기하라고 했고, 11번의 put it under your pillow의 it은 그 인형이에요.","c":2},"h":"caab868942"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When you wake up, you will be worry-free and at ease!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"깨어나면, 당신은 걱정 없이 마음이 편안할 것이다!","opts":["일어나면 걱정 없이 마음이 편안해질 것이다.","일어나면 더 많은 걱정이 생길 것이다.","잠들면 걱정이 사라진 것을 알게 될 것이다.","일어나고 싶을 때까지 걱정 없이 잘 것이다."],"r":{"a":"1) 일어나면 걱정 없이 마음이 편안해질 것이다.","ev":"13번 문장","s":[[13,"When you wake up, you will be worry-free and at ease!","깨어나면, 당신은 걱정 없이 마음이 편안할 것이다!"]],"w":"worry-free는 '걱정이 없는', at ease는 '마음이 편안한'이라서 깨어나면 걱정이 없고 편안하다는 뜻이에요.","c":1},"h":"2167bf5675"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["인형을 금속과 돌로 만든다.","인형에게 당신을 신경 쓰이게 하는 것에 대해 말한다.","인형에게 이쑤시개로 옷을 입힌다.","잠들기 전에 인형을 물속에 넣는다."],"opts":["You make the doll from metal and stone.","You tell the doll about something that bothers you.","You dress the doll with toothpicks.","You put the doll in water before going to sleep."],"r":{"a":"2) You tell the doll about something that bothers you.","ev":"10번 문장","s":[[10,"Then, tell your doll about something that is bothering you.","그러고 나서, 인형에게 당신을 신경 쓰이게 하는 것에 대해 말해라."]],"w":"10번에서 인형에게 자신을 신경 쓰이게 하는 것에 대해 말하라고 해요. 인형은 종이와 털실(5번)로 만들고, 이쑤시개는 팔과 다리(8번)고, 인형은 베개 아래에 둬요(11번).","c":2},"h":"02aa7b72af"},{"n":9,"t":"sum","q":"You (A) your doll about your worries and put it under your pillow; during the night, it will take (B) your concerns.","ko":"당신은 인형에게 걱정을 (A)하고 베개 아래에 두면, 밤 동안 인형이 걱정을 (B).","oko":["(A) 숨기고 / (B) 없애 준다","(A) 말하고 / (B) 되돌려 준다","(A) 보여 주고 / (B) 벗겨 낸다","(A) 잊고 / (B) 없애 준다","(A) 말하고 / (B) 없애 준다"],"opts":["(A) hide / (B) away","(A) tell / (B) back","(A) show / (B) off","(A) forget / (B) away","(A) tell / (B) away"],"r":{"a":"5) (A) tell / (B) away","ev":"10~12번 문장","s":[[10,"Then, tell your doll about something that is bothering you.","그러고 나서, 인형에게 당신을 신경 쓰이게 하는 것에 대해 말해라."],[11,"Finally, put it under your pillow and go to sleep.","마지막으로, 그것을 당신의 베개 아래에 놓고 잠들어라."],[12,"The worry doll will take away your concerns during the night.","걱정 인형이 밤 동안 당신의 걱정을 없애줄 것이다."]],"w":"10번에서 인형에게 걱정을 말하고(tell), 11번에서 베개 아래에 두고 자요. 12번에서 인형이 밤 동안 걱정을 없애줘요(take away).","c":5},"h":"f3d0265e9f"},{"n":10,"t":"fill","q":"Dress the doll with colorful [A], and stick [B] to the paper to make its arms and legs.","ko":"인형에게 알록달록한 [A]로 옷을 입히고, 팔과 다리를 만들기 위해 종이에 [B]를 붙여라.","bank":["threads","toothpicks","worry-free","during","rectangular","easily"],"bko":{"threads":"실","toothpicks":"이쑤시개","worry-free":"걱정이 없는","during":"~ 동안","rectangular":"직사각형의","easily":"쉽게"},"r":{"a":"[A] threads, [B] toothpicks","ev":"8~9번 문장","s":[[8,"Stick toothpicks to the paper to make its arms and legs.","팔과 다리를 만들기 위해 종이에 이쑤시개를 붙여라."],[9,"Dress the doll with colorful threads.","인형에게 알록달록한 실로 옷을 입혀라."]],"w":"9번 colorful threads, 8번 toothpicks에서 가져왔어요. 나머지는 빈칸 뜻과 맞지 않아요.","c":null},"h":"7a2b29322b"}]},{"u":10,"id":"hk2-10-3","no":3,"ko":"두 얼굴의 아보카도","items":[{"n":1,"t":"tf","q":"Avocados contain healthy fats and lots of vitamins.","ko":"아보카도는 건강에 좋은 지방과 많은 비타민을 함유하고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Avocados contain healthy fats and lots of vitamins, so they are good for your body.","아보카도는 건강에 좋은 지방과 많은 비타민을 함유하고 있어서, 몸에 좋다."]],"w":"2번 문장에 그대로 나와요.","c":"T"},"h":"917b2b4482"},{"n":2,"t":"tf","q":"Avocado roots can absorb water very well.","ko":"아보카도의 뿌리는 물을 매우 잘 흡수할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"These roots cannot absorb water very well.","이 뿌리는 물을 매우 잘 흡수하지 못한다."]],"w":"6번에서 이 뿌리는 물을 매우 잘 흡수하지 못한다(cannot absorb water very well)고 해요. 반대예요.","c":"F"},"h":"96a2b57509"},{"n":3,"t":"tf","q":"Producing a single avocado usually requires about 70 liters of water.","ko":"아보카도 한 개를 생산하는 데는 보통 약 70리터의 물이 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"So, producing a single avocado usually requires a lot of water—about 70 liters.","그래서, 한 개의 아보카도를 생산하는 데 보통 약 70리터의 많은 물이 필요하다."]],"w":"7번 문장에 그대로 나와요.","c":"T"},"h":"427c94d3d0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These roots cannot absorb water very well.)","ko":"이 뿌리는 물을 매우 잘 ( ) 못한다.","opts":["흡수하지","만들지","운반하지","얼리지"],"word":"absorb","r":{"a":"1) 흡수하지","ev":"6번 문장","s":[[6,"These roots cannot absorb water very well.","이 뿌리는 물을 매우 잘 흡수하지 못한다."]],"w":"5번에서 뿌리가 덜 발달하고 털이 없다고 했어요. 그래서 물을 빨아들이지 못해요. absorb = 흡수하다.","c":1},"h":"911d90e72a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In fact, residents have to get water from water trucks.)","ko":"실제로, ( )들은 급수 트럭에서 물을 얻어야 한다.","opts":["농장주","주민","판매원","관광객"],"word":"residents","r":{"a":"2) 주민","ev":"10~11번 문장","s":[[10,"In fact, in Chile’s Petorca region, one of the country’s largest producers of avocados, residents have to get water from water trucks.","실제로, 칠레의 가장 큰 아보카도 생산지 중 하나인 페토르카 지역에서는, 주민들이 급수 트럭에서 물을 얻어야 한다."],[11,"Avocado farms use so much water that there isn’t enough water left for homes!","아보카도 농장들이 너무 많은 물을 사용해서 가정용으로 남겨진 물이 충분하지 않은 것이다!"]],"w":"10번에서 물을 구하러 급수 트럭을 쓰는 사람들이고, 11번에서 가정용 물이 모자란다고 해요. 그래서 resident는 '주민'이에요.","c":2},"h":"60a07c05a4"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThis is because they have underdeveloped, hairless roots.","ko":"밑줄 친 they가 가리키는 것은?","sko":"이것은 그것들이 덜 진화된, 털이 없는 뿌리를 가졌기 때문이다.","opts":["다른 작물들","아보카도","오렌지","농장들"],"r":{"a":"2) 아보카도","ev":"4~5번 문장","s":[[4,"Avocados need much more water to grow than other crops.","아보카도가 자라기 위해서는 다른 작물들보다 훨씬 더 많은 물을 필요로 한다."],[5,"This is because they have underdeveloped, hairless roots.","이것은 그것들이 덜 진화된, 털이 없는 뿌리를 가졌기 때문이다."]],"w":"4번에서 Avocados가 물을 많이 필요로 한다고 한 뒤, 5번에서 이유를 말하며 they로 받았어요. 덜 발달한 털 없는 뿌리를 가진 것은 아보카도예요.","c":2},"h":"b0ff0ec450"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Avocado farms use so much water that there isn’t enough water left for homes!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아보카도 농장들이 너무 많은 물을 사용해서 가정용으로 남겨진 물이 충분하지 않은 것이다!","opts":["아보카도 농장이 물을 너무 많이 써서 가정에서 쓸 물이 충분하지 않다.","아보카도 농장이 가정에 물을 나눠 주어서 물이 충분하다.","아보카도 농장은 물이 너무 부족해서 농사를 못 짓는다.","가정에서 물을 너무 많이 써서 농장에 쓸 물이 부족하다."],"r":{"a":"1) 아보카도 농장이 물을 너무 많이 써서 가정에서 쓸 물이 충분하지 않다.","ev":"11번 문장","s":[[11,"Avocado farms use so much water that there isn’t enough water left for homes!","아보카도 농장들이 너무 많은 물을 사용해서 가정용으로 남겨진 물이 충분하지 않은 것이다!"]],"w":"so much water that ~은 '너무 많은 물을 써서 ~하다'이고, 뒤에서 가정용으로 남은 물이 충분하지 않다고 해요.","c":1},"h":"a2329e580e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["아보카도는 다른 작물보다 물이 덜 필요하다.","오렌지는 22리터의 물이 필요하고 토마토는 5리터 정도가 필요하다.","페토르카 주민들은 집 근처 강에서 물을 얻는다.","아보카도는 당신의 몸에 나쁘다."],"opts":["Avocados need less water than other crops.","Oranges need 22 liters of water, and tomatoes need around 5 liters.","Residents in Petorca get water from rivers near their homes.","Avocados are bad for your body."],"r":{"a":"2) Oranges need 22 liters of water, and tomatoes need around 5 liters.","ev":"8번 문장","s":[[8,"In comparison, oranges need 22 liters and tomatoes only need around 5 liters.","그에 비해, 오렌지는 (물이) 22리터가 필요하고 토마토는 5리터 정도만 필요하다."]],"w":"8번에 오렌지 22리터, 토마토 5리터가 그대로 나와요. 아보카도는 다른 작물보다 물이 더 필요하고(4번), 주민들은 급수 트럭에서 물을 얻고(10번), 아보카도는 몸에 좋아요(2번).","c":2}, een, just like herself.","ko":"밑줄 친 She가 가리키는 것은?","sko":"그녀는 이제 딸이 꼭 그녀 자신처럼 현명한 여왕이 될 것이라고 믿을 수 있었다.","opts":["Elizabeth 공주","Clever 여왕","모든 사람들","Wise West 왕국"],"r":{"a":"2) Clever 여왕","ev":"11~12번 문장","s":[[11,"“That is the correct answer!” said the Queen proudly.","“그것이 정답이다!”라고 여왕이 자랑스럽게 말했다."],[12,"She could now trust her daughter to become a wise queen, just like herself.","그녀는 이제 딸이 꼭 그녀 자신처럼 현명한 여왕이 될 것이라고 믿을 수 있었다."]],"w":"11번에서 정답이라고 자랑스럽게 말한 사람이 the Queen이고, 12번의 She는 그 여왕이에요. 믿는 대상은 her daughter(딸)예요.","c":2},"h":"322f00d09e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Therefore, the answer must be knowledge.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"따라서, 정답은 틀림없이 지식입니다.”","opts":["따라서 정답은 틀림없이 지식이다.","따라서 정답은 지식이 될 수 없다.","따라서 지식은 반드시 정답을 말해야 한다.","따라서 정답을 알면 지식이 생길 것이다."],"r":{"a":"1) 따라서 정답은 틀림없이 지식이다.","ev":"10번 문장","s":[[10,"Therefore, the answer must be knowledge.”","따라서, 정답은 틀림없이 지식입니다.”"]],"w":"must be는 '틀림없이 ~이다'라는 강한 추측이에요. 그래서 'the answer must be knowledge'는 '정답은 틀림없이 지식이다'예요.","c":1},"h":"b382c9c602"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Elizabeth가 여왕에게 수수께끼를 냈다.","여왕은 그 답이 마음에 들지 않았다.","공주는 정답이 명성이어야 한다고 말했다.","여왕은 딸이 현명한 여왕이 될 것이라고 믿을 수 있었다."],"opts":["Elizabeth gave a riddle to the Queen.","The Queen was not happy with the answer.","The princess said the answer must be fame.","The Queen could trust her daughter to become a wise queen."],"r":{"a":"4) The Queen could trust her daughter to become a wise queen.","ev":"12번 문장","s":[[12,"She could now trust her daughter to become a wise queen, just like herself.","그녀는 이제 딸이 꼭 그녀 자신처럼 현명한 여왕이 될 것이라고 믿을 수 있었다."]],"w":"12번에서 여왕은 이제 딸이 현명한 여왕이 될 것이라고 믿을 수 있었어요. 수수께끼를 낸 쪽은 여왕이고(4번), 정답이라며 자랑스러워했고(11번), 공주의 답은 지식이에요(10번).","c":4},"h":"a26429dc43"},{"n":9,"t":"sum","q":"The Queen gave Elizabeth a (A) to see whether she could rule the kingdom as wisely as her, and Elizabeth's answer was (B).","ko":"여왕은 Elizabeth가 자신만큼 현명하게 다스릴
