<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14303f">
<meta name="application-name" content="FBI 수업">
<meta name="apple-mobile-web-app-title" content="FBI 수업">
<title>FBI 수업</title>
<style>
:root{--bg:#f4f6f8;--card:#ffffff;--ink:#14202b;--sub:#566474;--line:#d9e0e7;--g1:#14303f;--g2:#6c1c44}
@media (prefers-color-scheme:dark){:root{--bg:#0c1f2b;--card:#14303f;--ink:#e8eef2;--sub:#9db0bd;--line:#24465a;--g1:#f79a85;--g2:#94d8bc}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Malgun Gothic","Apple SD Gothic Neo","Noto Sans KR",system-ui,sans-serif}
main{max-width:560px;margin:0 auto;padding:28px 16px 40px}
h1{font-size:22px;margin:0 0 20px;letter-spacing:-.01em}
a.app{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--card);border:1px solid var(--line);border-left:8px solid var(--g1);border-radius:10px;padding:20px 16px;margin-bottom:10px;color:var(--ink);text-decoration:none;font-size:18px;font-weight:700}
a.app.g2{border-left-color:var(--g2)}
a.app:active{background:var(--line)}
</style>
</head>
<body>
<main>
<h1>FBI 수업</h1>
<a class="app g2" href="https://nolbada.github.io/via/fbi/g2-6-class/">FBI 고2 6월</a>
</main>
</body>
</html>
