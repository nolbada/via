<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>브릭스 중학독해 3 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
</style>
</head>

<script>
var P=[{"u":1,"id":"b3-01-1","no":1,"ko":"1층이라고 해서 갔는데, 사무실이 없다?","items":[{"n":1,"t":"tf","q":"Kevin went straight to the first floor to find Oliver.","ko":"케빈은 올리버를 찾으려고 곧장 1층(first floor)으로 갔다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"When Kevin arrived at the London office, he went straight to the first floor to find Oliver.","케빈이 런던 사무실에 도착했을 때, 그는 올리버를 찾으려고 곧장 1층으로 갔다."]],"w":"3번 문장에 he went straight to the first floor to find Oliver가 그대로 나옴. went는 go(가다)의 과거형.","c":"T"},"h":"a733e3783c"},{"n":2,"t":"tf","q":"Oliver worked in New York, and Kevin was based in London.","ko":"올리버는 뉴욕에서 일했고, 케빈은 런던에 근무지가 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"While Kevin worked in New York, Oliver was based in London.","케빈은 뉴욕에서 일했고, 올리버는 런던에 근무지가 있었다."]],"w":"2번 문장에서 케빈이 뉴욕에서 일했고(Kevin worked in New York) 올리버가 런던에 근무지가 있었음(Oliver was based in London). worked는 work(일하다)의 과거형. 두 사람의 도시가 서로 바뀐 진술이라 F.","c":"F"},"h":"b594bc6149"},{"n":3,"t":"tf","q":"In the U.S., the first floor is at street level.","ko":"미국에서 first floor는 길거리 높이에 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"In the U.S., the first floor is located at street level.","미국에서 first floor는 길거리 높이에 있는 층이다."]],"w":"9번 문장에 In the U.S., the first floor is located at street level이라고 나옴. 같은 내용이라 T.","c":"T"},"h":"d57cca95ee"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... he remained confused by the situation.)","ko":"... 그는 그 상황에 대해 여전히 헷갈렸다.","opts":["화난","편안한","헷갈린","자랑스러운"],"word":"confused","r":{"a":"3) 헷갈린","ev":"7번 문장","s":[[7,"Although Kevin followed him up the stairs, he remained confused by the situation.","케빈은 그를 따라 계단을 올라갔지만, 여전히 그 상황이 헷갈렸다."]],"w":"7번에서 케빈은 올리버를 따라 계단을 올랐지만 아직 왜 그런지 몰랐음. 그래서 confused는 헷갈린. 화나거나 자랑스럽다는 감정은 나오지 않음.","c":3},"h":"fecdda51af"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (English words can have separate meanings in different regions of the world.)","ko":"영어 단어는 세계의 서로 다른 지역에서 서로 다른 뜻을 가질 수 있다.","opts":["별개의, 서로 다른","똑같은","쉬운","새로운"],"word":"separate","r":{"a":"1) 별개의, 서로 다른","ev":"11번 문장","s":[[11,"English words can have separate meanings in different regions of the world.","영어 단어는 세계의 지역에 따라 서로 다른 뜻을 가질 수 있다."]],"w":"11번의 separate meanings는 지역마다 따로 있는, 서로 다른 뜻. 미국과 영국에서 first floor의 뜻이 달랐던 것(8~10번)과 같은 이야기. 똑같다는 뜻이 아님.","c":1},"h":"598677fe64"},{"n":6,"t":"ref","q":"What does the underlined \"this level\" refer to?\nIn contrast, this level is usually called the ground floor in the U.K., while the first floor is one level above the ground.","ko":"밑줄 친 this level이 가리키는 것은?","sko":"반대로 영국에서는 이 층을 보통 ground floor라고 부르고, first floor는 지면보다 한 층 위이다.","opts":["지면보다 한 층 위의 층","길거리 높이에 있는 층","올리버가 일하는 사무실","런던의 모든 층"],"r":{"a":"2) 길거리 높이에 있는 층","ev":"9~10번 문장","s":[[9,"In the U.S., the first floor is located at street level.","미국에서 first floor는 길거리 높이에 있는 층이다."],[10,"In contrast, this level is usually called the ground floor in the U.K., while the first floor is one level above the ground.","반대로 영국에서는 이 층을 보통 ground floor라고 부르고, first floor는 지면보다 한 층 위이다."]],"w":"10번은 In contrast(반대로)로 시작하는데, 바로 앞 9번에서 미국의 first floor가 street level이라고 했음. this level은 그 street level 층이고, 영국에서는 그 층을 ground floor라고 부름. 한 층 위는 영국의 first floor라서 오답.","c":2},"h":"6e757e7a07"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The mix-up happened because “first floor” means different things in the U.S. and the U.K.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 착오는 ‘first floor’가 미국과 영국에서 서로 다른 것을 뜻하기 때문에 생겼다.","opts":["미국과 영국의 건물 모양이 달라서 케빈이 길을 잃었다.","영국 사람들은 first floor라는 말을 아예 쓰지 않아서 혼란이 생겼다.","케빈이 영국 영어를 몰라서 올리버와 대화가 되지 않았다.","first floor가 두 나라에서 다른 층을 가리켜서 착오가 생겼다."],"r":{"a":"4) first floor가 두 나라에서 다른 층을 가리켜서 착오가 생겼다.","ev":"8번 문장","s":[[8,"The mix-up happened because “first floor” means different things in the U.S. and the U.K.","이 착오는 ‘first floor’가 미국과 영국에서 서로 다른 것을 뜻하기 때문에 생겼다."]],"w":"8번의 because 뒤가 이유: first floor가 미국과 영국에서 서로 다른 것을 뜻함. 영국에서도 first floor라는 말을 쓰지만 지면보다 한 층 위를 가리킴(10번). 건물 모양이나 대화가 안 된 것이 원인은 아님.","c":4},"h":"bed2abd3aa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["영국에서는 길거리 높이의 층을 보통 ground floor라고 부른다.","올리버는 뉴욕에서 일하고 있었다.","케빈이 올리버보다 먼저 상대를 발견했다.","미국에서 first floor는 지면보다 한 층 위이다."],"opts":["In the U.K., the street-level floor is usually called the ground floor.","Oliver was working in New York.","Kevin found Oliver before Oliver found Kevin.","In the U.S., the first floor is one level above the ground."],"r":{"a":"1) In the U.K., the street-level floor is usually called the ground floor.","ev":"2번, 5번, 9~10번 문장","s":[[2,"While Kevin worked in New York, Oliver was based in London.","케빈은 뉴욕에서 일했고, 올리버는 런던에 근무지가 있었다."],[5,"A few minutes later, Oliver found Kevin and laughed.","몇 분 후, 올리버가 케빈을 발견하고 웃었다."],[9,"In the U.S., the first floor is located at street level.","미국에서 first floor는 길거리 높이에 있는 층이다."],[10,"In contrast, this level is usually called the ground floor in the U.K., while the first floor is one level above the ground.","반대로 영국에서는 이 층을 보통 ground floor라고 부르고, first floor는 지면보다 한 층 위이다."]],"w":"10번에서 영국은 길거리 층(this level)을 ground floor라고 부른다고 함. 올리버는 런던(2번), 먼저 발견한 쪽은 올리버(5번), 미국의 first floor는 길거리 높이(9번)라서 나머지는 모두 본문과 다름.","c":1},"h":"ac20b66d14"},{"n":9,"t":"sum","q":"The word \"first floor\" has (A) meanings in the U.S. and the U.K., so remember that English can (B) from place to place.","ko":"‘first floor’는 미국과 영국에서 (A) 뜻을 가지므로, 영어가 지역마다 (B)할 수 있다는 것을 기억하라.","oko":["(A) 비슷한 / (B) 변하다","(A) 다른 / (B) 그대로이다","(A) 다른 / (B) 변하다","(A) 비슷한 / (B) 그대로이다","(A) 숨겨진 / (B) 사라지다"],"opts":["(A) similar / (B) change","(A) different / (B) stay the same","(A) different / (B) change","(A) similar / (B) stay the same","(A) hidden / (B) disappear"],"r":{"a":"3) (A) different / (B) change","ev":"11~12번 문장","s":[[11,"English words can have separate meanings in different regions of the world.","영어 단어는 세계의 지역에 따라 서로 다른 뜻을 가질 수 있다."],[12,"So when someone uses a word differently than you expect, remember that English changes from place to place.","그러니 누군가 여러분이 예상한 것과 다르게 단어를 쓸 때는, 영어가 지역마다 달라진다는 것을 기억하라."]],"w":"11번에서 영어 단어는 지역마다 서로 다른(separate) 뜻을 가질 수 있다고 하고, 12번에서 영어는 지역마다 변한다(changes from place to place)고 함. 그래서 different와 change. similar나 stay the same은 반대 뜻.","c":3},"h":"a127f44ceb"},{"n":10,"t":"fill","q":"In the U.S., the [A] floor is at street level, but in the U.K., that level is called the [B] floor.","ko":"미국에서는 [A]층이 길거리 높이에 있지만, 영국에서는 그 층을 [B]층이라고 부른다.","bko":{"first":"첫 번째의, 1층의","ground":"지면, 땅","second":"두 번째의","office":"사무실","top":"맨 위의","stairs":"계단"},"bank":["first","ground","second","office","top","stairs"],"r":{"a":"[A] first, [B] ground","ev":"9~10번 문장","s":[[9,"In the U.S., the first floor is located at street level.","미국에서 first floor는 길거리 높이에 있는 층이다."],[10,"In contrast, this level is usually called the ground floor in the U.K., while the first floor is one level above the ground.","반대로 영국에서는 이 층을 보통 ground floor라고 부르고, first floor는 지면보다 한 층 위이다."]],"w":"9번에서 미국은 the first floor가 street level, 10번에서 영국은 그 층(this level)을 the ground floor라고 부름. second, top은 street level이 아니고, office와 stairs는 층 이름이 아님.","c":null},"h":"e2b29c2c25"}]},{"u":1,"id":"b3-01-2","no":2,"ko":"산속에서 휘파람만 부는데 대화라고?","items":[{"n":1,"t":"tf","q":"In Kuşdili, each whistle stands for a syllable in Turkish.","ko":"쿠슈딜리에서는 각각의 휘파람이 튀르키예어의 음절 하나를 나타낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"In Kuşdili, each whistle stands for a syllable in Turkish, like letters in the alphabet.","쿠슈딜리에서는 알파벳의 글자처럼, 각각의 휘파람이 튀르키예어의 음절 하나를 나타낸다."]],"w":"11번 문장에 each whistle stands for a syllable in Turkish가 그대로 나옴.","c":"T"},"h":"66419d4c29"},{"n":2,"t":"tf","q":"Kuşköy is a flat place where voices carry well.","ko":"쿠쉬쾨이는 목소리가 잘 전달되는 평평한 곳이다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It’s a steep, mountainous place in Türkiye, where voices don’t carry well.","그곳은 튀르키예의 가파르고 산이 많은 곳으로, 목소리가 잘 전달되지 않는다."]],"w":"7번 문장에서 쿠쉬쾨이는 가파르고 산이 많은 곳(steep, mountainous)이고, 목소리가 잘 전달되지 않는다(voices don’t carry well)고 함. 평평하고 소리가 잘 전달된다는 말은 반대라서 F.","c":"F"},"h":"304ee27470"},{"n":3,"t":"tf","q":"The villagers created a whistling language to communicate from a distance.","ko":"마을 사람들은 멀리서 의사소통하기 위해 휘파람 언어를 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"To communicate from a distance, they created a whistling language and have used it for hundreds of years.","멀리서 의사소통하기 위해, 그들은 휘파람 언어를 만들었고 수백 년 동안 그것을 사용해 왔다."]],"w":"10번 문장 To communicate from a distance, they created a whistling language와 같은 내용이라 T. created는 create(만들다)의 과거형.","c":"T"},"h":"48e236f2ae"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some of the people there are separated by a deep valley.)","ko":"그곳 사람들 중 일부는 깊은 골짜기로 떨어져 있다.","opts":["도와주는","떨어져 있는","섞여 있는","초대받은"],"word":"separated","r":{"a":"2) 떨어져 있는","ev":"8번 문장","s":[[8,"Some of the people there are separated by a deep valley.","그곳 사람들 중 일부는 깊은 골짜기로 떨어져 있다."]],"w":"8번에서 깊은 골짜기가 사람들 사이를 가르고 있음. 그래서 서로 방문하려면 먼 길을 걸어야 한다는 9번 내용으로 이어짐. separated = 떨어져 있는. 섞여 있다면 멀리 걸을 필요가 없었을 것.","c":2},"h":"fc92ee83e8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To visit each other, they must walk long and twisty paths.)","ko":"서로를 방문하려면, 그들은 길고 구불구불한 길을 걸어야 한다.","opts":["곧은","넓은","짧은","구불구불한"],"word":"twisty","r":{"a":"4) 구불구불한","ev":"9번 문장","s":[[9,"To visit each other, they must walk long and twisty paths.","서로를 방문하려면, 그들은 길고 구불구불한 길을 걸어야 한다."]],"w":"9번의 long and twisty paths는 산속의 길고 굽이굽이 이어진 길. twisty = 구불구불한. 곧은 길이나 짧은 길이면 걷기 힘들다는 맥락과 맞지 않음.","c":4},"h":"b47f679209"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nTo visit each other, they must walk long and twisty paths.","ko":"밑줄 친 they가 가리키는 것은?","sko":"서로를 방문하려면, 그들은 길고 구불구불한 길을 걸어야 한다.","opts":["튀르키예 정부 사람들","휘파람 소리들","깊은 골짜기로 떨어져 사는 마을 사람들","유네스코 직원들"],"r":{"a":"3) 깊은 골짜기로 떨어져 사는 마을 사람들","ev":"8~9번 문장","s":[[8,"Some of the people there are separated by a deep valley.","그곳 사람들 중 일부는 깊은 골짜기로 떨어져 있다."],[9,"To visit each other, they must walk long and twisty paths.","서로를 방문하려면, 그들은 길고 구불구불한 길을 걸어야 한다."]],"w":"8번에서 Some of the people there(그곳 사람들 중 일부)가 깊은 골짜기로 떨어져 있다고 했고, 9번의 they는 그 사람들. 서로 방문해야 하는 사람들이 바로 이들임.","c":3},"h":"10b2431bd8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In Kuşdili, each whistle stands for a syllable in Turkish, like letters in the alphabet.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"쿠슈딜리에서는 알파벳의 글자처럼, 각각의 휘파람이 튀르키예어의 음절 하나를 나타낸다.","opts":["쿠슈딜리에서는 휘파람 하나가 튀르키예어의 소리 단위 하나를 나타내며, 알파벳 글자처럼 쓰인다.","쿠슈딜리의 휘파람은 알파벳 글자 모양을 그려 낸다.","쿠슈딜리에서는 한 번 부는 휘파람이 문장 하나 전체를 뜻한다.","쿠슈딜리에서는 알파벳 대신 숫자로 의사소통한다."],"r":{"a":"1) 쿠슈딜리에서는 휘파람 하나가 튀르키예어의 소리 단위 하나를 나타내며, 알파벳 글자처럼 쓰인다.","ev":"11번 문장","s":[[11,"In Kuşdili, each whistle stands for a syllable in Turkish, like letters in the alphabet.","쿠슈딜리에서는 알파벳의 글자처럼, 각각의 휘파람이 튀르키예어의 음절 하나를 나타낸다."]],"w":"stand for는 ~을 나타낸다는 뜻이고, syllable은 소리의 한 덩어리(음절). 알파벳 글자가 소리를 나타내듯 휘파람 하나가 음절 하나를 나타냄. 문장 전체나 모양, 숫자 이야기는 없음.","c":1},"h":"fe438d3a04"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["쿠쉬쾨이 사람들은 휘파람 언어를 겨우 몇 년 전부터 썼다.","쿠슈딜리의 휘파람은 오직 놀이를 할 때만 쓰인다.","쿠슈딜리로는 이름, 숫자, 새로운 단어도 휘파람으로 부를 수 있다.","현대 기술은 휘파람 전통이 커지도록 돕고 있다."],"opts":["The people in Kuşköy have used the whistling language for only a few years.","Whistling in Kuşdili is used only for playing games.","People can whistle names, numbers, and even new words in Kuşdili.","Modern technology is helping the whistling tradition grow."],"r":{"a":"3) People can whistle names, numbers, and even new words in Kuşdili.","ev":"4번, 10번, 12~13번 문장","s":[[4,"They’re not just playing but having a real conversation!","그들은 단지 노는 것이 아니라 진짜 대화를 하고 있는 것이다!"],[10,"To communicate from a distance, they created a whistling language and have used it for hundreds of years.","멀리서 의사소통하기 위해, 그들은 휘파람 언어를 만들었고 수백 년 동안 그것을 사용해 왔다."],[12,"So people can whistle names, numbers, and even new words.","그래서 사람들은 이름, 숫자, 심지어 새로운 단어까지도 휘파람으로 불 수 있다."],[13,"However, modern technology such as cell phones and the Internet is causing this tradition to disappear.","하지만 휴대전화와 인터넷 같은 현대 기술이 이 전통을 사라지게 하고 있다."]],"w":"12번 So people can whistle names, numbers, and even new words와 일치. 수백 년 사용(10번)이라 몇 년은 틀림, 놀이만이 아니라 진짜 대화(4번), 현대 기술은 전통을 사라지게 함(13번).","c":3},"h":"313903700c"},{"n":9,"t":"sum","q":"To (A) from a distance, the villagers created a whistling language, but modern technology is making this tradition (B).","ko":"멀리서 (A)하기 위해 마을 사람들은 휘파람 언어를 만들었지만, 현대 기술이 이 전통을 (B)하게 만들고 있다.","oko":["(A) 여행하다 / (B) 커지다","(A) 의사소통하다 / (B) 퍼지다","(A) 숨다 / (B) 사라지다","(A) 의사소통하다 / (B) 사라지다","(A) 여행하다 / (B) 사라지다"],"opts":["(A) travel / (B) grow","(A) communicate / (B) spread","(A) hide / (B) disappear","(A) communicate / (B) disappear","(A) travel / (B) disappear"],"r":{"a":"4) (A) communicate / (B) disappear","ev":"10번, 13번 문장","s":[[10,"To communicate from a distance, they created a whistling language and have used it for hundreds of years.","멀리서 의사소통하기 위해, 그들은 휘파람 언어를 만들었고 수백 년 동안 그것을 사용해 왔다."],[13,"However, modern technology such as cell phones and the Internet is causing this tradition to disappear.","하지만 휴대전화와 인터넷 같은 현대 기술이 이 전통을 사라지게 하고 있다."]],"w":"10번 To communicate from a distance, they created a whistling language에서 (A)는 communicate. 13번 modern technology is causing this tradition to disappear에서 (B)는 disappear. travel은 걷는 이야기(9번)와 섞은 함정이고 grow, spread는 13번과 반대.","c":4},"h":"d0b606cf85"},{"n":10,"t":"fill","q":"Each whistle in Kuşdili stands for a [A] in Turkish, so people can [B] names, numbers, and even new words.","ko":"쿠슈딜리에서는 각각의 휘파람이 튀르키예어의 [A] 하나를 나타내므로, 사람들은 이름, 숫자, 심지어 새로운 단어까지 [B]할 수 있다.","bko":{"syllable":"음절","whistle":"휘파람을 불다","tradition":"전통","forget":"잊다","valley":"골짜기","hide":"숨기다"},"bank":["syllable","whistle","tradition","forget","valley","hide"],"r":{"a":"[A] syllable, [B] whistle","ev":"11~12번 문장","s":[[11,"In Kuşdili, each whistle stands for a syllable in Turkish, like letters in the alphabet.","쿠슈딜리에서는 알파벳의 글자처럼, 각각의 휘파람이 튀르키예어의 음절 하나를 나타낸다."],[12,"So people can whistle names, numbers, and even new words.","그래서 사람들은 이름, 숫자, 심지어 새로운 단어까지도 휘파람으로 불 수 있다."]],"w":"11번 each whistle stands for a syllable, 12번 people can whistle names, numbers, and even new words에서 가져옴. tradition(전통)은 13번 이야기이고, valley(골짜기)는 8번에 나오는 말이며, forget(잊다)과 hide(숨기다)는 12번 내용과 맞지 않음.","c":null},"h":"e2a72c3f86"}]},{"u":1,"id":"b3-01-3","no":3,"ko":"문자가 없던 언어가 한글을 만난 이유","items":[{"n":1,"t":"tf","q":"The Cia-Cia language did not have its own writing system.","ko":"찌아찌아어에는 자체 문자 체계가 없었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They speak their own language, but a writing system for it was never developed.","그들은 자신들의 언어를 말하지만, 그 언어를 위한 문자 체계는 한 번도 만들어진 적이 없었다."]],"w":"2번에서 그 언어를 위한 문자 체계는 한 번도 만들어진 적이 없다(was never developed)고 함. 같은 내용이라 T.","c":"T"},"h":"4d5bf24257"},{"n":2,"t":"tf","q":"The Arabic alphabet fit the Cia-Cia sounds perfectly.","ko":"아랍 문자는 찌아찌아어 소리에 완벽하게 맞았다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"But the Roman alphabet didn’t fit the sounds, and the Arabic alphabet was missing some letters.","하지만 로마자는 그 소리에 맞지 않았고, 아랍 문자는 몇몇 글자가 없었다."]],"w":"7번에서 아랍 문자는 몇몇 글자가 없었다(was missing some letters)고 함. 완벽하게 맞았다는 말은 반대라서 F.","c":"F"},"h":"0f38104891"},{"n":3,"t":"tf","q":"South Korean scholars introduced Hangul to the Cia-Cia in 2020.","ko":"한국 학자들은 2020년에 찌아찌아족에게 한글을 소개했다.","r":{"a":"F (본문과 다른 내용)","ev":"8번, 12번 문장","s":[[8,"In 2009, South Korean scholars visited and introduced Hangul.","2009년에 한국 학자들이 찾아와 한글을 소개했다."],[12,"In 2020, the first Cia-Cia dictionary written in Hangul was published.","2020년에는 한글로 쓰인 첫 찌아찌아어 사전이 출간되었다."]],"w":"한글을 소개한 해는 2009년(8번)이고, 2020년은 한글로 쓴 첫 찌아찌아어 사전이 출간된 해(12번)임. 연도가 뒤섞인 진술이라 F.","c":"F"},"h":"038358d246"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...a writing system for it was never developed.)","ko":"... 그 언어를 위한 문자 체계는 한 번도 만들어진 적이 없었다.","opts":["잊힌","만들어진","팔린","금지된"],"word":"developed","r":{"a":"2) 만들어진","ev":"2번 문장","s":[[2,"They speak their own language, but a writing system for it was never developed.","그들은 자신들의 언어를 말하지만, 그 언어를 위한 문자 체계는 한 번도 만들어진 적이 없었다."]],"w":"2번은 말은 있지만 글로 적는 체계가 한 번도 만들어지지 않았다는 뜻. 그래서 3번에서 이야기를 기록하기 어려웠다고 이어짐. developed = (체계가) 만들어진.","c":2},"h":"3e02ea7ac7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Hangul can represent sounds by combining letters...)","ko":"한글은 글자를 조합해 소리를 ... 수 있다.","opts":["나타내다","숨기다","섞다","잊다"],"word":"represent","r":{"a":"1) 나타내다","ev":"9번 문장","s":[[9,"Hangul can represent sounds by combining letters, so it worked better than the other alphabets.","한글은 글자를 조합해 소리를 나타낼 수 있어서, 다른 문자들보다 더 잘 맞았다."]],"w":"9번의 represent sounds는 글자로 소리를 나타낸다는 뜻. 한글이 글자를 조합해 소리를 보여 줄 수 있어서 다른 문자들보다 잘 맞았다는 이유가 됨.","c":1},"h":"6d793074b3"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt wasn’t perfect, but it showed Cia-Cia sounds more clearly.","ko":"밑줄 친 It이 가리키는 것은?","sko":"완벽하지는 않았지만, 한글은 찌아찌아어 소리를 더 분명하게 보여 주었다.","opts":["인도네시아의 국가 언어","로마자","한글","아랍 문자"],"r":{"a":"3) 한글","ev":"9~10번 문장","s":[[9,"Hangul can represent sounds by combining letters, so it worked better than the other alphabets.","한글은 글자를 조합해 소리를 나타낼 수 있어서, 다른 문자들보다 더 잘 맞았다."],[10,"It wasn’t perfect, but it showed Cia-Cia sounds more clearly.","완벽하지는 않았지만, 한글은 찌아찌아어 소리를 더 분명하게 보여 주었다."]],"w":"9번에서 한글(Hangul)이 다른 문자들보다 잘 맞았다고 했고, 10번의 It은 그 한글. 로마자와 아랍 문자는 7번에서 맞지 않았다고 한 문자들이라 오답.","c":3},"h":"ef9c60a29a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But the Roman alphabet didn’t fit the sounds, and the Arabic alphabet was missing some letters.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 로마자는 그 소리에 맞지 않았고, 아랍 문자는 몇몇 글자가 없었다.","opts":["로마자와 아랍 문자 둘 다 찌아찌아어 소리에 완벽하게 맞았다.","로마자는 찌아찌아어 소리에 잘 맞지 않았고, 아랍 문자는 필요한 글자 몇 개가 없었다.","로마자는 읽기 어려웠고, 아랍 문자는 가르칠 사람이 없었다.","로마자는 소리가 너무 많았고, 아랍 문자는 글자가 너무 많았다."],"r":{"a":"2) 로마자는 찌아찌아어 소리에 잘 맞지 않았고, 아랍 문자는 필요한 글자 몇 개가 없었다.","ev":"7번 문장","s":[[7,"But the Roman alphabet didn’t fit the sounds, and the Arabic alphabet was missing some letters.","하지만 로마자는 그 소리에 맞지 않았고, 아랍 문자는 몇몇 글자가 없었다."]],"w":"didn’t fit the sounds는 소리에 맞지 않았다, was missing some letters는 글자 몇 개가 빠져 있었다는 뜻. 앞의 But 때문에 두 문자 모두 해결책이 아니었다는 내용. 완벽했다거나 가르칠 사람이 없다는 말은 없음.","c":2},"h":"4d163b3c5b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["한글은 20세기 초부터 찌아찌아어를 적는 데 쓰여 왔다.","찌아찌아족은 한국에 있는 섬에 산다.","한글은 아랍 문자보다 덜 성공적이었다.","전문가들은 찌아찌아어를 지키기 위해 로마자와 아랍 문자를 써 보려고 했다."],"opts":["Hangul has been used to write Cia-Cia since the early 1900s.","The Cia-Cia people live on an island in South Korea.","Hangul was less successful than the Arabic alphabet.","Experts tried using the Roman and Arabic alphabets to protect the Cia-Cia language."],"r":{"a":"4) Experts tried using the Roman and Arabic alphabets to protect the Cia-Cia language.","ev":"1번, 6번, 8~9번 문장","s":[[1,"The Cia-Cia people live on Buton, an island in Indonesia.","찌아찌아족은 인도네시아의 섬인 부톤섬에 산다."],[6,"To protect their language, experts tried using the Roman and Arabic alphabets.","자신들의 언어를 지키기 위해, 전문가들은 로마자와 아랍 문자를 써 보려고 했다."],[8,"In 2009, South Korean scholars visited and introduced Hangul.","2009년에 한국 학자들이 찾아와 한글을 소개했다."],[9,"Hangul can represent sounds by combining letters, so it worked better than the other alphabets.","한글은 글자를 조합해 소리를 나타낼 수 있어서, 다른 문자들보다 더 잘 맞았다."]],"w":"6번에 To protect their language, experts tried using the Roman and Arabic alphabets가 그대로 나옴. 한글은 2009년에 소개됨(8번), 섬은 인도네시아(1번), 한글이 다른 문자들보다 더 잘 맞음(9번)이라 나머지는 모두 틀림.","c":4},"h":"d6445e3922"},{"n":9,"t":"sum","q":"After Hangul was (A) to the Cia-Cia, they used it to teach their language, and the language now has a better chance of (B).","ko":"한글이 찌아찌아족에게 (A)된 뒤, 그들은 한글로 언어를 가르쳤고, 그 언어는 이제 (B)할 더 나은 가능성을 갖게 되었다.","oko":["(A) 소개 / (B) 사라짐","(A) 금지 / (B) 살아남음","(A) 금지 / (B) 사라짐","(A) 비교 / (B) 사라짐","(A) 소개 / (B) 살아남음"],"opts":["(A) introduced / (B) disappearance","(A) forbidden / (B) survival","(A) forbidden / (B) disappearance","(A) compared / (B) disappearance","(A) introduced / (B) survival"],"r":{"a":"5) (A) introduced / (B) survival","ev":"8번, 11번, 13번 문장","s":[[8,"In 2009, South Korean scholars visited and introduced Hangul.","2009년에 한국 학자들이 찾아와 한글을 소개했다."],[11,"Since then, the Cia-Cia have used Hangul to teach their language.","그 이후로 찌아찌아족은 한글을 사용해 자신들의 언어를 가르쳐 왔다."],[13,"Thanks to Hangul, the Cia-Cia language now has a better chance of survival.","한글 덕분에, 찌아찌아어는 이제 살아남을 더 나은 가능성을 갖게 되었다."]],"w":"8번 South Korean scholars visited and introduced Hangul에서 (A)는 introduced(introduce 소개하다의 과거형). 11번에서 한글로 언어를 가르쳐 왔고, 13번에서 살아남을 더 나은 가능성(a better chance of survival)이라고 함. forbidden, disappearance는 본문과 반대.","c":5},"h":"f0dee7ed6e"},{"n":10,"t":"fill","q":"Hangul can [A] sounds by combining letters, and it [B] Cia-Cia sounds more clearly.","ko":"한글은 글자를 조합해 소리를 [A]할 수 있고, 찌아찌아어 소리를 더 분명하게 [B].","bko":{"represent":"나타내다","showed":"보여 주었다","lost":"잃었다","protect":"지키다","invent":"발명하다","missing":"빠져 있는"},"bank":["represent","showed","lost","protect","invent","missing"],"r":{"a":"[A] represent, [B] showed","ev":"9~10번 문장","s":[[9,"Hangul can represent sounds by combining letters, so it worked better than the other alphabets.","한글은 글자를 조합해 소리를 나타낼 수 있어서, 다른 문자들보다 더 잘 맞았다."],[10,"It wasn’t perfect, but it showed Cia-Cia sounds more clearly.","완벽하지는 않았지만, 한글은 찌아찌아어 소리를 더 분명하게 보여 주었다."]],"w":"9번 Hangul can represent sounds by combining letters, 10번 it showed Cia-Cia sounds more clearly에서 가져옴. showed는 show(보여 주다)의 과거형. missing은 7번에서 아랍 문자 이야기에 쓰인 말이고, protect는 6번에서 언어를 지키려는 목적에 쓰인 말이라 이 두 문장의 내용이 아님. lost(잃었다)와 invent(발명하다)는 한글이 소리를 나타내고 보여 줬다는 내용과 맞지 않음.","c":null},"h":"8c3caceda2"}]},{"u":1,"id":"b3-01-4","no":4,"ko":"꼬리 하나로 싸움도 하고 사랑도 한다고?","items":[{"n":1,"t":"tf","q":"Ring-tailed lemurs hold their tails high like a flag when they move as a group.","ko":"알락꼬리여우원숭이는 무리를 지어 움직일 때 꼬리를 깃발처럼 높이 든다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"When lemurs move as a group, they hold their tails high like a flag.","여우원숭이가 무리를 지어 움직일 때, 그들은 꼬리를 깃발처럼 높이 든다."]],"w":"4번 문장 When lemurs move as a group, they hold their tails high like a flag와 같은 내용.","c":"T"},"h":"ae939ec2f8"},{"n":2,"t":"tf","q":"In a stink fight, male lemurs hit their rivals with their tails.","ko":"냄새 싸움에서 수컷 여우원숭이는 꼬리로 라이벌을 때린다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"This is called a “stink fight,” and its goal is to scare rivals away without any physical touching.","이것은 ‘냄새 싸움(stink fight)’이라고 불리며, 그 목표는 몸을 부딪치지 않고 라이벌을 쫓아 버리는 것이다."]],"w":"8번에서 냄새 싸움의 목표는 몸을 부딪치지 않고(without any physical touching) 라이벌을 쫓는 것. 꼬리로 때린다는 말은 반대라서 F.","c":"F"},"h":"dde56ecea7"},{"n":3,"t":"tf","q":"Ring-tailed lemurs live in the wet rainforests of Madagascar.","ko":"알락꼬리여우원숭이는 마다가스카르의 습한 열대우림에 산다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Ring-tailed lemurs live in the dry forests of Madagascar.","알락꼬리여우원숭이는 마다가스카르의 건조한 숲에 산다."]],"w":"1번에서 사는 곳은 마다가스카르의 건조한 숲(dry forests). 습한 열대우림(wet rainforests)이 아니라서 F.","c":"F"},"h":"1f32428418"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...they rub a strong scent from their bodies onto their tails...)","ko":"... 그들은 몸에서 나는 강한 냄새를 꼬리에 문질러 묻힌다...","opts":["소리","냄새","색깔","무게"],"word":"scent","r":{"a":"2) 냄새","ev":"7번 문장","s":[[7,"When they meet a rival, they rub a strong scent from their bodies onto their tails and wave them through the air.","그들은 라이벌을 만나면, 몸에서 나는 강한 냄새를 꼬리에 문질러 묻히고 그것을 공중에서 흔든다."]],"w":"7번의 strong scent from their bodies는 몸에서 나는 강한 냄새. 이 냄새를 꼬리에 묻혀 흔들기 때문에 이름이 stink(고약한 냄새) fight(8번).","c":2},"h":"f3126d9c75"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...wave them to show their health and attract a female.)","ko":"... 그것을 흔들어 자신의 건강을 보여 주고 암컷을 끌어들인다.","opts":["쫓아내다","숨기다","놀라게 하다","끌어들이다"],"word":"attract","r":{"a":"4) 끌어들이다","ev":"10번 문장","s":[[10,"Males spread a different, gentler scent on their tails and wave them to show their health and attract a female.","수컷은 다른, 더 순한 냄새를 꼬리에 퍼뜨리고 그것을 흔들어 자신의 건강을 보여 주고 암컷을 끌어들인다."]],"w":"10번의 목적은 건강을 보여 주고 암컷을 끌어들이는 것. attract = 끌어들이다. 8번의 scare away(쫓아내다)와 반대 방향이라 헷갈리지 않게 주의.","c":4},"h":"ffe86db829"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is called a “stink fight,” and its goal is to scare rivals away without any physical touching.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 ‘냄새 싸움’이라고 불리며, 그 목표는 몸을 부딪치지 않고 라이벌을 쫓아 버리는 것이다.","opts":["여우원숭이가 꼬리를 깃발처럼 높이 드는 것","여우원숭이가 키 큰 풀 속에서 함께 머무는 것","수컷이 라이벌을 만나 냄새를 묻힌 꼬리를 공중에서 흔드는 행동","수컷이 짝짓기 철에 건강을 보여 주는 것"],"r":{"a":"3) 수컷이 라이벌을 만나 냄새를 묻힌 꼬리를 공중에서 흔드는 행동","ev":"7~8번 문장","s":[[7,"When they meet a rival, they rub a strong scent from their bodies onto their tails and wave them through the air.","그들은 라이벌을 만나면, 몸에서 나는 강한 냄새를 꼬리에 문질러 묻히고 그것을 공중에서 흔든다."],[8,"This is called a “stink fight,” and its goal is to scare rivals away without any physical touching.","이것은 ‘냄새 싸움(stink fight)’이라고 불리며, 그 목표는 몸을 부딪치지 않고 라이벌을 쫓아 버리는 것이다."]],"w":"8번의 This는 바로 앞 7번 문장의 행동(라이벌을 만나 냄새를 꼬리에 문질러 공중에서 흔드는 것)을 가리킴. 그 행동의 이름이 stink fight. 꼬리를 높이 드는 것(4번)이나 짝짓기(10번)는 아님.","c":3},"h":"d2361dc303"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This allows them to show each other where to go and stay together, even in tall grass.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그들이 키 큰 풀 속에서도 서로에게 어디로 갈지 보여 주고 함께 머물 수 있게 해 준다.","opts":["꼬리를 높이 들면 키 큰 풀 속에서도 서로 방향을 알려 주고 함께 있을 수 있다.","꼬리를 높이 들면 키 큰 풀을 피해 따로 흩어질 수 있다.","꼬리 때문에 키 큰 풀 속에서 서로를 놓치게 된다.","키 큰 풀 속에서만 꼬리를 흔들어 라이벌을 쫓아낸다."],"r":{"a":"1) 꼬리를 높이 들면 키 큰 풀 속에서도 서로 방향을 알려 주고 함께 있을 수 있다.","ev":"4~5번 문장","s":[[4,"When lemurs move as a group, they hold their tails high like a flag.","여우원숭이가 무리를 지어 움직일 때, 그들은 꼬리를 깃발처럼 높이 든다."],[5,"This allows them to show each other where to go and stay together, even in tall grass.","이것은 그들이 키 큰 풀 속에서도 서로에게 어디로 갈지 보여 주고 함께 머물 수 있게 해 준다."]],"w":"5번의 This는 4번의 꼬리를 높이 드는 행동. allow ~ to 는 ~할 수 있게 해 준다는 뜻이라 서로 방향을 알리고(show each other where to go) 함께 머물 수(stay together) 있다는 내용. 흩어지거나 놓친다는 말은 반대.","c":1},"h":"641a785dac"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["여우원숭이는 꼬리를 오직 예뻐 보이려고만 쓴다.","냄새 싸움에서 수컷은 꼬리로 라이벌을 때린다.","수컷은 암컷을 끌어들이려고 더 순한 냄새를 꼬리에 퍼뜨린다.","여우원숭이는 키 큰 풀에 숨으려고 꼬리를 낮게 내린다."],"opts":["Lemurs use their tails only to look beautiful.","In a stink fight, male lemurs hit rivals with their tails.","Male lemurs spread a gentler scent on their tails to attract a female.","Lemurs hold their tails low to hide in tall grass."],"r":{"a":"3) Male lemurs spread a gentler scent on their tails to attract a female.","ev":"3번, 4번, 8번, 10번 문장","s":[[3,"However, their tails are not only eye-catching but also play a key role in communication.","하지만 그들의 꼬리는 눈길을 끌 뿐만 아니라 의사소통에서 핵심적인 역할도 한다."],[4,"When lemurs move as a group, they hold their tails high like a flag.","여우원숭이가 무리를 지어 움직일 때, 그들은 꼬리를 깃발처럼 높이 든다."],[8,"This is called a “stink fight,” and its goal is to scare rivals away without any physical touching.","이것은 ‘냄새 싸움(stink fight)’이라고 불리며, 그 목표는 몸을 부딪치지 않고 라이벌을 쫓아 버리는 것이다."],[10,"Males spread a different, gentler scent on their tails and wave them to show their health and attract a female.","수컷은 다른, 더 순한 냄새를 꼬리에 퍼뜨리고 그것을 흔들어 자신의 건강을 보여 주고 암컷을 끌어들인다."]],"w":"10번에서 수컷이 더 순한 냄새를 꼬리에 퍼뜨려 암컷을 끌어들인다고 함. 꼬리는 눈길을 끌 뿐 아니라 의사소통에도 쓰이고(3번), 냄새 싸움은 몸이 닿지 않으며(8번), 꼬리는 높이 듦(4번)이라 나머지는 틀림.","c":3},"h":"d25c19c8e0"},{"n":9,"t":"sum","q":"In a stink fight, male lemurs scare rivals away (A) physical touching, and during the mating season they use a (B) scent to attract females.","ko":"냄새 싸움에서 수컷은 몸을 (A) 라이벌을 쫓아내고, 짝짓기 철에는 암컷을 끌어들이려고 (B) 냄새를 쓴다.","oko":["(A) 부딪치며 / (B) 더 강한","(A) 부딪치지 않고 / (B) 더 강한","(A) 부딪치며 / (B) 더 순한","(A) 부딪친 뒤 / (B) 더 순한","(A) 부딪치지 않고 / (B) 더 순한"],"opts":["(A) with / (B) stronger","(A) without / (B) stronger","(A) with / (B) gentler","(A) after / (B) gentler","(A) without / (B) gentler"],"r":{"a":"5) (A) without / (B) gentler","ev":"8번, 10번 문장","s":[[8,"This is called a “stink fight,” and its goal is to scare rivals away without any physical touching.","이것은 ‘냄새 싸움(stink fight)’이라고 불리며, 그 목표는 몸을 부딪치지 않고 라이벌을 쫓아 버리는 것이다."],[10,"Males spread a different, gentler scent on their tails and wave them to show their health and attract a female.","수컷은 다른, 더 순한 냄새를 꼬리에 퍼뜨리고 그것을 흔들어 자신의 건강을 보여 주고 암컷을 끌어들인다."]],"w":"8번에서 냄새 싸움은 without any physical touching(몸이 닿지 않고)이고, 10번에서 짝짓기 철에는 a different, gentler scent(더 순한 냄새)를 씀. 7번의 강한 냄새(strong)는 라이벌에게 쓰는 것이라 B에 stronger는 함정.","c":5},"h":"51dd1d97e4"},{"n":10,"t":"fill","q":"Lemurs hold their tails high like a flag to show each other [A] to go and to stay [B].","ko":"여우원숭이는 서로에게 [A] 갈지 보여 주고 [B] 머물려고 꼬리를 깃발처럼 높이 든다.","bko":{"where":"어디로","together":"함께","scent":"냄새","rivals":"라이벌","health":"건강","flag":"깃발"},"bank":["where","together","scent","rivals","health","flag"],"r":{"a":"[A] where, [B] together","ev":"4~5번 문장","s":[[4,"When lemurs move as a group, they hold their tails high like a flag.","여우원숭이가 무리를 지어 움직일 때, 그들은 꼬리를 깃발처럼 높이 든다."],[5,"This allows them to show each other where to go and stay together, even in tall grass.","이것은 그들이 키 큰 풀 속에서도 서로에게 어디로 갈지 보여 주고 함께 머물 수 있게 해 준다."]],"w":"5번 This allows them to show each other where to go and stay together에서 가져옴. flag는 4번의 비유(깃발처럼)에 나온 말이지만 이 문장에서 꼬리가 하는 일을 설명하는 말이 아님. scent, rivals, health는 7~10번 수컷 이야기에 나오는 말.","c":null},"h":"ad6c100e19"}]},{"u":2,"id":"b3-02-1","no":1,"ko":"소금 좀 주세요가 실례가 되는 나라","items":[{"n":1,"t":"tf","q":"In Egypt, asking for salt or pepper might give the impression that the food is not good enough.","ko":"이집트에서는 소금이나 후추를 달라고 하면 음식이 충분히 좋지 않다는 인상을 줄 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"For these reasons, asking for extra seasoning, such as salt or pepper, might give the impression that the food isn’t good enough.","이러한 이유로, 소금이나 후추 같은 추가 양념을 요청하는 것은 음식이 충분히 좋지 않다는 인상을 줄 수 있다."]],"w":"8번에서 소금이나 후추 같은 추가 양념을 요청하면 음식이 충분히 좋지 않다는 인상을 줄 수 있다(might give the impression)고 함. 같은 내용이라 T.","c":"T"},"h":"8157efce6a"},{"n":2,"t":"tf","q":"In the United States, people often ask for some salt when their food is too salty.","ko":"미국에서는 음식이 너무 짤 때 종종 소금을 달라고 한다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"In the United States, people often ask for some salt when their food tastes a little bland.","미국에서는 사람들이 음식이 약간 싱겁게 느껴질 때 종종 소금을 달라고 한다."]],"w":"1번에서 미국 사람들은 음식이 약간 싱거울 때(a little bland) 소금을 달라고 함. 너무 짤 때가 아니므로 F.","c":"F"},"h":"3e5ce58437"},{"n":3,"t":"tf","q":"Many traditional Egyptian dishes follow recipes passed down for generations.","ko":"많은 이집트 전통 요리는 대대로 전해 내려온 조리법을 따른다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Many traditional dishes follow recipes passed down for generations, and families take great pride in them.","많은 전통 요리는 대대로 전해 내려온 조리법을 따르며, 가족들은 그것에 큰 자부심을 갖는다."]],"w":"6번에서 Many traditional dishes follow recipes passed down for generations라고 함. 같은 내용이라 T.","c":"T"},"h":"57615526e1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...when their food tastes a little bland.)","ko":"... 음식이 약간 싱겁게 느껴질 때","opts":["매운","뜨거운","신","싱거운"],"word":"bland","r":{"a":"4) 싱거운","ev":"1번 문장","s":[[1,"In the United States, people often ask for some salt when their food tastes a little bland.","미국에서는 사람들이 음식이 약간 싱겁게 느껴질 때 종종 소금을 달라고 한다."]],"w":"1번에서 음식이 bland해서 소금을 달라고 함. 소금을 더 넣고 싶을 때는 맛이 밋밋하고 싱거운 때. 매운, 신 음식에는 소금을 찾지 않음.","c":4},"h":"88f4dcd6a0"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...families take great pride in them.)","ko":"... 가족들은 그것에 큰 자부심을 갖는다.","opts":["자부심","걱정","부끄러움","피로"],"word":"pride","r":{"a":"1) 자부심","ev":"6번 문장","s":[[6,"Many traditional dishes follow recipes passed down for generations, and families take great pride in them.","많은 전통 요리는 대대로 전해 내려온 조리법을 따르며, 가족들은 그것에 큰 자부심을 갖는다."]],"w":"6번에서 대대로 이어 온 조리법을 가족들이 소중히 여김. take great pride in은 ~을 매우 자랑스러워한다는 뜻이므로 pride = 자부심. 걱정이나 부끄러움은 전통 요리 이야기와 어울리지 않음.","c":1},"h":"0108c7e79e"},{"n":6,"t":"ref","q":"What does the underlined \"such a request\" refer to?\nThe cook may feel hurt by such a request.","ko":"밑줄 친 such a request가 가리키는 것은?","sko":"요리사는 그런 요청에 상처받을 수 있다.","opts":["음식을 더 많이 달라고 하는 것","조리법을 알려 달라고 하는 것","소금이나 후추 같은 추가 양념을 달라고 하는 것","식사에 초대해 달라고 하는 것"],"r":{"a":"3) 소금이나 후추 같은 추가 양념을 달라고 하는 것","ev":"8~9번 문장","s":[[8,"For these reasons, asking for extra seasoning, such as salt or pepper, might give the impression that the food isn’t good enough.","이러한 이유로, 소금이나 후추 같은 추가 양념을 요청하는 것은 음식이 충분히 좋지 않다는 인상을 줄 수 있다."],[9,"The cook may feel hurt by such a request.","요리사는 그런 요청에 상처받을 수 있다."]],"w":"9번 바로 앞 8번에서 asking for extra seasoning, such as salt or pepper(소금이나 후추 같은 추가 양념을 요청하는 것)가 나옴. 9번의 such a request는 바로 그 요청. 음식 양이나 조리법 이야기는 없음.","c":3},"h":"6ea48234a5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Hosts put a lot of time, effort, and skill into preparing these dishes to make the meal as perfect as possible.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"주인은 식사를 가능한 한 완벽하게 만들려고 이 요리들을 준비하는 데 많은 시간, 노력, 기술을 쏟는다.","opts":["주인은 식사를 최대한 완벽하게 하려고 요리에 시간과 노력과 기술을 많이 들인다.","주인은 식사 시간을 줄이려고 요리 기술을 사용한다.","손님은 완벽한 식사를 위해 시간과 노력을 들여야 한다.","주인은 요리가 서툴러서 완벽한 식사를 포기한다."],"r":{"a":"1) 주인은 식사를 최대한 완벽하게 하려고 요리에 시간과 노력과 기술을 많이 들인다.","ev":"7번 문장","s":[[7,"Hosts put a lot of time, effort, and skill into preparing these dishes to make the meal as perfect as possible.","주인은 식사를 가능한 한 완벽하게 만들려고 이 요리들을 준비하는 데 많은 시간, 노력, 기술을 쏟는다."]],"w":"put A into B는 B에 A를 쏟아 붓는다는 뜻, to make the meal as perfect as possible은 목적(식사를 가능한 한 완벽하게 하려고). 그래서 주인이 시간, 노력, 기술을 요리에 많이 쏟는다는 내용. 시간을 줄이거나 포기한다는 말은 없고, 이 일을 하는 사람은 손님이 아니라 주인.","c":1},"h":"267badac8a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["이집트에서 추가 양념을 요청하는 것은 식사를 즐긴다는 것을 보여 준다.","이집트 가족들은 전통 요리에 대한 자부심이 거의 없다.","이집트 문화에서 식사를 나누는 것은 환대의 중요한 행위이다.","이집트에서는 손님이 식사 전에 소금을 준비해 가는 것이 예의이다."],"opts":["In Egypt, asking for extra seasoning shows that you enjoy the meal.","Egyptian families feel little pride in their traditional dishes.","In Egyptian culture, sharing a meal is an important act of hospitality.","In Egypt, guests are expected to bring salt before the meal."],"r":{"a":"3) In Egyptian culture, sharing a meal is an important act of hospitality.","ev":"3번, 6번, 8번 문장","s":[[3,"In Egyptian culture, sharing a meal is an important act of hospitality.","이집트 문화에서 식사를 함께 나누는 것은 환대의 중요한 행위이다."],[6,"Many traditional dishes follow recipes passed down for generations, and families take great pride in them.","많은 전통 요리는 대대로 전해 내려온 조리법을 따르며, 가족들은 그것에 큰 자부심을 갖는다."],[8,"For these reasons, asking for extra seasoning, such as salt or pepper, might give the impression that the food isn’t good enough.","이러한 이유로, 소금이나 후추 같은 추가 양념을 요청하는 것은 음식이 충분히 좋지 않다는 인상을 줄 수 있다."]],"w":"3번 In Egyptian culture, sharing a meal is an important act of hospitality와 일치. 추가 양념 요청은 오히려 음식이 부족하다는 인상을 줌(8번), 가족들은 큰 자부심을 가짐(6번). 소금을 가져온다는 말은 없음.","c":3},"h":"2b8f43c994"},{"n":9,"t":"sum","q":"In Egypt, asking for extra (A) can hurt the cook, so guests should (B) the food as it is.","ko":"이집트에서는 추가 (A)을 요청하면 요리사가 상처받을 수 있으므로, 손님은 음식을 있는 그대로 (B)해야 한다.","oko":["(A) 조리법 / (B) 즐기다","(A) 양념 / (B) 바꾸다","(A) 조리법 / (B) 바꾸다","(A) 양념 / (B) 즐기다","(A) 요리 / (B) 남기다"],"opts":["(A) recipes / (B) enjoy","(A) seasoning / (B) change","(A) recipes / (B) change","(A) seasoning / (B) enjoy","(A) dishes / (B) leave"],"r":{"a":"4) (A) seasoning / (B) enjoy","ev":"8~10번 문장","s":[[8,"For these reasons, asking for extra seasoning, such as salt or pepper, might give the impression that the food isn’t good enough.","이러한 이유로, 소금이나 후추 같은 추가 양념을 요청하는 것은 음식이 충분히 좋지 않다는 인상을 줄 수 있다."],[9,"The cook may feel hurt by such a request.","요리사는 그런 요청에 상처받을 수 있다."],[10,"So, if you’re ever invited to dine in Egypt, enjoy the food as it is.","그러니 이집트에서 식사 초대를 받게 된다면, 음식을 있는 그대로 즐겨라."]],"w":"8번에서 추가 양념(extra seasoning)을 요청하면 음식이 부족하다는 인상을 주고, 9번에서 요리사가 상처받을 수 있으며, 10번에서 음식을 있는 그대로 즐기라고(enjoy the food as it is) 함. recipes는 6번 단어를 섞은 함정이고, change나 leave는 10번과 맞지 않음.","c":4},"h":"e3f4066377"},{"n":10,"t":"fill","q":"In Egypt, sharing a meal is an important act of [A], and preparing food is a sign of care and [B].","ko":"이집트에서 식사를 나누는 것은 [A]의 중요한 행위이고, 음식을 준비하는 것은 배려와 [B]의 표시이다.","bko":{"hospitality":"환대","respect":"존중","seasoning":"양념","mistake":"실수","recipes":"조리법","request":"요청"},"bank":["hospitality","respect","seasoning","mistake","recipes","request"],"r":{"a":"[A] hospitality, [B] respect","ev":"3~5번 문장","s":[[3,"In Egyptian culture, sharing a meal is an important act of hospitality.","이집트 문화에서 식사를 함께 나누는 것은 환대의 중요한 행위이다."],[4,"When a host prepares food, it is not just cooking.","주인이 음식을 준비할 때, 그것은 단순한 요리가 아니다."],[5,"It is a sign of care and respect.","그것은 배려와 존중의 표시이다."]],"w":"3번 sharing a meal is an important act of hospitality, 5번 It is a sign of care and respect에서 가져옴. seasoning, mistake는 1~2번과 8번에서 문제가 되는 말이고, recipes는 6번의 요리 이야기이고 request(요청)는 9번에 나오는 말이라 이 두 문장에 맞지 않음.","c":null},"h":"1297589439"}]},{"u":2,"id":"b3-02-2","no":2,"ko":"쓴 물이라 불린 음료가 신들의 선물이었다고?","items":[{"n":1,"t":"tf","q":"The Aztecs mixed crushed cocoa beans with water to make a chocolate drink.","ko":"아즈텍인들은 으깬 카카오 콩을 물과 섞어 초콜릿 음료를 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They crushed cocoa beans and mixed them with water to make it.","그들은 카카오 콩을 으깨어 물과 섞어 그것을 만들었다."]],"w":"3번에서 카카오 콩을 으깨어 물과 섞어(crushed cocoa beans and mixed them with water) 만든다고 함. 같은 내용이라 T. crushed는 crush(으깨다), mixed는 mix(섞다)의 과거형.","c":"T"},"h":"300f91540b"},{"n":2,"t":"tf","q":"Xocolatl means “sweet water.”","ko":"xocolatl은 ‘단 물’이라는 뜻이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"It was called xocolatl, which means “bitter water.”","그것은 ‘쓴 물’이라는 뜻의 xocolatl이라고 불렸다."]],"w":"4번에서 xocolatl은 bitter water(쓴 물)라는 뜻. 단 물(sweet water)이 아니라서 F.","c":"F"},"h":"ac8ce06cdd"},{"n":3,"t":"tf","q":"Chocolate was served only at weddings.","ko":"초콜릿은 결혼식에서만 제공되었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It was served at weddings, festivals, and religious ceremonies.","그것은 결혼식, 축제, 종교 의식에서 제공되었다."]],"w":"7번에서 초콜릿은 결혼식뿐 아니라 축제, 종교 의식에서도 제공되었다(weddings, festivals, and religious ceremonies). only가 틀려서 F.","c":"F"},"h":"460886b470"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They crushed cocoa beans and mixed them with water...)","ko":"그들은 카카오 콩을 으깨어 물과 섞었다...","opts":["심었다","으깼다","팔았다","구웠다"],"word":"crushed","r":{"a":"2) 으깼다","ev":"3번 문장","s":[[3,"They crushed cocoa beans and mixed them with water to make it.","그들은 카카오 콩을 으깨어 물과 섞어 그것을 만들었다."]],"w":"3번은 카카오 콩으로 음료를 만드는 순서. 콩을 으깬 뒤 물과 섞어야 마시는 초콜릿이 됨. crushed = 으깼다(crush 으깨다).","c":2},"h":"f3107f9192"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (People drank chocolate to treat stomach problems, fevers, and tiredness.)","ko":"사람들은 배탈, 열, 피로를 치료하려고 초콜릿을 마셨다.","opts":["즐기다","요리하다","나누다","치료하다"],"word":"treat","r":{"a":"4) 치료하다","ev":"10번 문장","s":[[10,"People drank chocolate to treat stomach problems, fevers, and tiredness.","사람들은 배탈, 열, 피로를 치료하려고 초콜릿을 마셨다."]],"w":"10번은 9번의 ‘약으로 쓰였다’를 구체적으로 설명하는 문장. 배탈, 열, 피로를 고치려는 것이므로 treat = 치료하다(treat 치료하다). 즐기다나 나누다는 앞뒤 흐름에 맞지 않음.","c":4},"h":"7395464822"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey crushed cocoa beans and mixed them with water to make it.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그들은 카카오 콩을 으깨어 물과 섞어 그것을 만들었다.","opts":["으깬 카카오 콩","물","아즈텍인들","향신료"],"r":{"a":"1) 으깬 카카오 콩","ev":"3번 문장","s":[[3,"They crushed cocoa beans and mixed them with water to make it.","그들은 카카오 콩을 으깨어 물과 섞어 그것을 만들었다."]],"w":"3번에서 crushed cocoa beans(으깬 카카오 콩)를 mixed them with water(그것들을 물과 섞었다)라고 함. them은 복수형 cocoa beans. 물은 섞는 대상이 아니라 함께 섞는 재료이고, 향신료는 5번에서 따로 나옴.","c":1},"h":"8344aa1433"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Sometimes, they mixed it with other things like honey or tree bark to make it work better.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"때때로 그들은 그것이 더 잘 듣게 하려고 꿀이나 나무껍질 같은 다른 것들과 섞었다.","opts":["꿀이나 나무껍질을 먹으려고 초콜릿을 사용했다.","초콜릿 맛을 더 쓰게 만들려고 나무껍질을 섞었다.","초콜릿이 더 잘 듣도록 꿀이나 나무껍질 같은 것과 섞기도 했다.","꿀과 나무껍질로 초콜릿 음료를 만들어 팔았다."],"r":{"a":"3) 초콜릿이 더 잘 듣도록 꿀이나 나무껍질 같은 것과 섞기도 했다.","ev":"11번 문장","s":[[11,"Sometimes, they mixed it with other things like honey or tree bark to make it work better.","때때로 그들은 그것이 더 잘 듣게 하려고 꿀이나 나무껍질 같은 다른 것들과 섞었다."]],"w":"it은 초콜릿, to make it work better는 더 잘 듣게(효과가 있게) 하려고라는 목적. 9~10번에서 약으로 쓴 내용에 이어, 약효를 높이려고 다른 재료를 섞었다는 뜻. 맛을 쓰게 한다거나 판다는 말은 없음.","c":3},"h":"82b66657f7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["아즈텍인들은 1428년 이전에 멕시코 중부를 다스렸다.","아즈텍인들은 초콜릿이 신들의 선물이라고 믿었다.","초콜릿은 약으로만 사용되었다.","초콜릿은 아즈텍인의 삶에서 중요하지 않았다."],"opts":["The Aztecs ruled central Mexico before 1428.","The Aztecs believed chocolate was a gift from the gods.","Chocolate was used only as medicine.","Chocolate was not important in Aztec life."],"r":{"a":"2) The Aztecs believed chocolate was a gift from the gods.","ev":"1번, 6번, 9번, 12번 문장","s":[[1,"Did you know the Aztecs, who ruled central Mexico between 1428 and 1521 CE, were some of the world’s first chocolate lovers?","1428년부터 1521년 사이에 멕시코 중부를 다스린 아즈텍인들이 세계 최초의 초콜릿 애호가들이었다는 것을 알고 있었는가?"],[6,"Chocolate played an important role in Aztec life.","초콜릿은 아즈텍인의 삶에서 중요한 역할을 했다."],[9,"Chocolate was also used as medicine.","초콜릿은 약으로도 쓰였다."],[12,"The Aztecs believed chocolate was a gift from the gods with special powers.","아즈텍인들은 초콜릿이 특별한 힘을 가진 신들의 선물이라고 믿었다."]],"w":"12번에서 아즈텍인들은 초콜릿이 신들의 선물이라고 믿었다고 함. 통치 기간은 1428~1521년(1번), 약으로만 쓰이지 않았고 음료와 행사에도 쓰임(2번, 7번, 9번의 also), 초콜릿은 삶에서 중요한 역할을 함(6번).","c":2},"h":"aaeb980476"},{"n":9,"t":"sum","q":"The Aztecs served chocolate at (A), used it as medicine, and believed it was a (B) from the gods.","ko":"아즈텍인들은 (A)에서 초콜릿을 제공했고, 약으로도 썼으며, 그것이 신들의 (B)라고 믿었다.","oko":["(A) 시장 / (B) 선물","(A) 의식 / (B) 벌","(A) 시장 / (B) 벌","(A) 의식 / (B) 도구","(A) 의식 / (B) 선물"],"opts":["(A) markets / (B) gift","(A) ceremonies / (B) punishment","(A) markets / (B) punishment","(A) ceremonies / (B) tool","(A) ceremonies / (B) gift"],"r":{"a":"5) (A) ceremonies / (B) gift","ev":"7번, 12번 문장","s":[[7,"It was served at weddings, festivals, and religious ceremonies.","그것은 결혼식, 축제, 종교 의식에서 제공되었다."],[12,"The Aztecs believed chocolate was a gift from the gods with special powers.","아즈텍인들은 초콜릿이 특별한 힘을 가진 신들의 선물이라고 믿었다."]],"w":"7번에서 초콜릿은 결혼식, 축제, 종교 의식(ceremonies)에서 제공되었고, 12번에서 신들의 선물(a gift from the gods)이라고 믿었음. markets(시장)는 본문에 없고, punishment(벌)나 tool(도구)은 12번과 맞지 않음.","c":5},"h":"cf7ad8fa10"},{"n":10,"t":"fill","q":"The Aztecs [A] cocoa beans and mixed them with water, and sometimes added [B] like chili or vanilla.","ko":"아즈텍인들은 카카오 콩을 [A] 물과 섞었고, 때때로 칠리나 바닐라 같은 [B]를 넣었다.","bko":{"crushed":"으깨어","spices":"향신료","honey":"꿀","bark":"나무껍질","medicine":"약","ceremonies":"의식"},"bank":["crushed","spices","honey","bark","medicine","ceremonies"],"r":{"a":"[A] crushed, [B] spices","ev":"3번, 5번 문장","s":[[3,"They crushed cocoa beans and mixed them with water to make it.","그들은 카카오 콩을 으깨어 물과 섞어 그것을 만들었다."],[5,"Sometimes, they added spices like chili or vanilla to give it a special flavor.","때때로 그들은 특별한 맛을 내기 위해 칠리나 바닐라 같은 향신료를 넣었다."]],"w":"3번 They crushed cocoa beans and mixed them with water, 5번 they added spices like chili or vanilla에서 가져옴. honey와 bark는 11번에서 약으로 쓸 때 섞은 것이고, medicine과 ceremonies는 쓰임을 말하는 단어라 이 문장과 맞지 않음.","c":null},"h":"6de9aba869"}]},{"u":2,"id":"b3-02-3","no":3,"ko":"아마존 부족은 왜 숲속에 숨어 지낼까?","items":[{"n":1,"t":"tf","q":"Many outsiders rushed into the Amazon forest because the demand for rubber grew quickly.","ko":"고무에 대한 수요가 빠르게 늘어서 많은 외부인들이 아마존 숲으로 몰려들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5~6번 문장","s":[[5,"At the time, the demand for rubber grew quickly in Europe and the United States.","당시 유럽과 미국에서 고무에 대한 수요가 빠르게 늘었다."],[6,"As a result, many outsiders rushed into the forest.","그 결과, 많은 외부인들이 숲으로 몰려들었다."]],"w":"5번에서 고무 수요가 빠르게 늘었고, 6번에서 As a result(그 결과) 많은 외부인들이 숲으로 몰려들었다고 함. 원인과 결과가 맞게 연결되어 T.","c":"T"},"h":"cb86b24448"},{"n":2,"t":"tf","q":"After the suffering, many tribes moved out of the forest to live near outsiders.","ko":"고통을 겪은 뒤 많은 부족이 외부인들 가까이에서 살려고 숲 밖으로 나갔다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Because of the suffering, many tribes moved deeper into the forest and have stayed hidden ever since.","그 고통 때문에 많은 부족이 숲속 더 깊은 곳으로 옮겨 갔고 그 후로 줄곧 숨어 지내 왔다."]],"w":"10번에서 부족들은 고통 때문에 숲 밖이 아니라 숲속 더 깊은 곳(deeper into the forest)으로 옮겨 가 숨어 지냈음. 반대 방향이라 F. moved는 move(옮기다)의 과거형.","c":"F"},"h":"004319e9d0"},{"n":3,"t":"tf","q":"Today, everyone agrees that people should contact the tribes.","ko":"오늘날 모든 사람이 부족들과 접촉해야 한다는 데 동의한다.","r":{"a":"F (본문과 다른 내용)","ev":"11~12번 문장","s":[[11,"Today, there are some attempts to contact these tribes.","오늘날 이 부족들과 접촉하려는 시도가 일부 있다."],[12,"However, some say they should be free to live in their own way.","하지만 일부는 그들이 자신들의 방식대로 살 자유가 있어야 한다고 말한다."]],"w":"11번에서 접촉하려는 시도가 일부(some attempts) 있다고 하고, 12번에서 일부는 그들이 자신들의 방식대로 살 자유가 있어야 한다고 말함. 모든 사람이 동의한다는 말은 틀려서 F.","c":"F"},"h":"8a3eacb620"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Why do they remain isolated?)","ko":"그들은 왜 고립된 채로 남아 있을까?","opts":["유명한","붐비는","고립된","부유한"],"word":"isolated","r":{"a":"3) 고립된","ev":"1번, 3번 문장","s":[[1,"Deep in the Amazon rainforest of Brazil, some tribes still live without contact with the outside world.","브라질의 아마존 열대우림 깊은 곳에서는 일부 부족이 여전히 바깥세상과 접촉 없이 살고 있다."],[3,"Why do they remain isolated?","그들은 왜 고립된 채로 남아 있을까?"]],"w":"1번에서 일부 부족은 바깥세상과 접촉 없이(without contact with the outside world) 산다고 함. 3번의 isolated는 그렇게 외따로 떨어진 상태. 붐비거나 유명하다는 뜻과는 반대.","c":3},"h":"85bd3e6cf7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (At the time, the demand for rubber grew quickly...)","ko":"당시 고무에 대한 수요가 빠르게 늘었다...","opts":["공급","수요","가격","거절"],"word":"demand","r":{"a":"2) 수요","ev":"5번 문장","s":[[5,"At the time, the demand for rubber grew quickly in Europe and the United States.","당시 유럽과 미국에서 고무에 대한 수요가 빠르게 늘었다."]],"w":"5번은 유럽과 미국에서 고무를 찾는 사람이 빠르게 늘었다는 내용. 그래서 6번의 As a result(그 결과) 외부인들이 몰려듦. demand = 수요(사려는 요구). 공급은 반대 방향의 말.","c":2},"h":"4cb95d8bb4"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nLocal tribes suddenly faced outsiders, and this changed their lives.","ko":"밑줄 친 this가 가리키는 것은?","sko":"지역 부족들은 갑자기 외부인들을 마주하게 되었고, 이것이 그들의 삶을 바꾸었다.","opts":["고무나무가 숲을 가득 채운 것","고무 수요가 빠르게 는 것","외부인들이 질병에 걸린 것","부족들이 갑자기 외부인들을 마주하게 된 것"],"r":{"a":"4) 부족들이 갑자기 외부인들을 마주하게 된 것","ev":"6~7번 문장","s":[[6,"As a result, many outsiders rushed into the forest.","그 결과, 많은 외부인들이 숲으로 몰려들었다."],[7,"Local tribes suddenly faced outsiders, and this changed their lives.","지역 부족들은 갑자기 외부인들을 마주하게 되었고, 이것이 그들의 삶을 바꾸었다."]],"w":"7번 문장 안에서 and 앞의 Local tribes suddenly faced outsiders가 this가 가리키는 내용. 6번에서 외부인이 몰려든 결과로 부족들이 그들을 마주하게 되었고, 그것이 삶을 바꿈. 고무나무나 수요는 더 앞의 원인임.","c":4},"h":"4a8c0d1c0f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because of the suffering, many tribes moved deeper into the forest and have stayed hidden ever since.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 고통 때문에 많은 부족이 숲속 더 깊은 곳으로 옮겨 갔고 그 후로 줄곧 숨어 지내 왔다.","opts":["많은 부족이 고통을 겪고 숲속 깊은 곳으로 옮겨 가 그 후로 계속 숨어 지내 왔다.","많은 부족이 고통을 피하려고 숲 밖으로 나와 외부인과 함께 살아왔다.","많은 부족이 숲속 깊은 곳에서 나와 고무 농장을 세웠다.","많은 부족이 고통 때문에 사라져 지금은 한 명도 남지 않았다."],"r":{"a":"1) 많은 부족이 고통을 겪고 숲속 깊은 곳으로 옮겨 가 그 후로 계속 숨어 지내 왔다.","ev":"10번 문장","s":[[10,"Because of the suffering, many tribes moved deeper into the forest and have stayed hidden ever since.","그 고통 때문에 많은 부족이 숲속 더 깊은 곳으로 옮겨 갔고 그 후로 줄곧 숨어 지내 왔다."]],"w":"Because of the suffering은 앞(8~9번)의 강제 노동과 질병 때문이라는 뜻이고, moved deeper into the forest는 숲속 더 깊이 옮겨 갔다, have stayed hidden ever since는 그 후로 줄곧 숨어 지내 왔다는 뜻. 숲 밖으로 나왔다거나 모두 사라졌다는 말은 없음.","c":1},"h":"b0b2b9ef0c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["아와족과 코루보족은 브라질의 도시에서 산다.","1900년대 초 아마존에는 고무나무가 드물었다.","많은 지역 사람들이 고무 농장에서 일하도록 강요받았다.","부족들은 외부인을 만난 뒤 더 건강해졌다."],"opts":["The Awá and Korubo people live in the cities of Brazil.","Rubber trees were rare in the Amazon in the early 1900s.","Many local people were forced to work in rubber plantations.","The tribes became healthier after meeting outsiders."],"r":{"a":"3) Many local people were forced to work in rubber plantations.","ev":"1번, 4번, 8~9번 문장","s":[[1,"Deep in the Amazon rainforest of Brazil, some tribes still live without contact with the outside world.","브라질의 아마존 열대우림 깊은 곳에서는 일부 부족이 여전히 바깥세상과 접촉 없이 살고 있다."],[4,"In the early 1900s, the Amazon rainforest was full of rubber trees.","1900년대 초, 아마존 열대우림은 고무나무로 가득했다."],[8,"Many were taken and forced to work in rubber plantations.","많은 사람들이 붙잡혀 고무 농장에서 일하도록 강요받았다."],[9,"They also died from new diseases like colds and the flu.","그들은 또한 감기와 독감 같은 새로운 질병으로 죽었다."]],"w":"8번에서 Many were taken and forced to work in rubber plantations라고 함. 아와족과 코루보족은 열대우림 깊은 곳에 산다(1번), 1900년대 초 숲은 고무나무로 가득함(4번), 부족들은 새로운 질병으로 죽음(9번).","c":3},"h":"39c82d63be"},{"n":9,"t":"sum","q":"The rubber boom brought outsiders who forced tribes to work and spread (A), so many tribes moved deeper into the forest and have stayed (B).","ko":"고무 붐은 부족들에게 일을 강요하고 (A)를 퍼뜨린 외부인들을 불러왔고, 그래서 많은 부족이 숲속 깊이 옮겨 가 줄곧 (B) 있다.","oko":["(A) 돈 / (B) 숨어","(A) 질병 / (B) 눈에 띄어","(A) 돈 / (B) 눈에 띄어","(A) 음식 / (B) 숨어","(A) 질병 / (B) 숨어"],"opts":["(A) money / (B) hidden","(A) diseases / (B) visible","(A) money / (B) visible","(A) food / (B) hidden","(A) diseases / (B) hidden"],"r":{"a":"5) (A) diseases / (B) hidden","ev":"8~10번 문장","s":[[8,"Many were taken and forced to work in rubber plantations.","많은 사람들이 붙잡혀 고무 농장에서 일하도록 강요받았다."],[9,"They also died from new diseases like colds and the flu.","그들은 또한 감기와 독감 같은 새로운 질병으로 죽었다."],[10,"Because of the suffering, many tribes moved deeper into the forest and have stayed hidden ever since.","그 고통 때문에 많은 부족이 숲속 더 깊은 곳으로 옮겨 갔고 그 후로 줄곧 숨어 지내 왔다."]],"w":"8번 고무 농장에서 일하도록 강요, 9번 새로운 질병(new diseases)으로 죽음, 10번 숲속 깊이 옮겨 가 줄곧 숨어(stayed hidden) 지냄. money, food는 본문에 없고, visible은 hidden과 반대.","c":5},"h":"995a559199"},{"n":10,"t":"fill","q":"Some say the tribes should be [A] to live in their own way, and with [B], they can continue their peaceful lives.","ko":"일부는 부족들이 자신들의 방식대로 살 수 있도록 [A] 상태여야 한다고 말하고, [B]가 있다면 그들은 평화로운 삶을 이어 갈 수 있다.","bko":{"free":"자유로운","respect":"존중","rubber":"고무","isolated":"고립된","diseases":"질병","demand":"수요"},"bank":["free","respect","rubber","isolated","diseases","demand"],"r":{"a":"[A] free, [B] respect","ev":"12~13번 문장","s":[[12,"However, some say they should be free to live in their own way.","하지만 일부는 그들이 자신들의 방식대로 살 자유가 있어야 한다고 말한다."],[13,"With respect, they can continue their peaceful lives in the forest.","존중이 있다면, 그들은 숲속에서 평화로운 삶을 계속 이어 갈 수 있다."]],"w":"12번 some say they should be free to live in their own way, 13번 With respect, they can continue their peaceful lives에서 가져옴. isolated는 3번에서 부족의 상태를 말한 단어지만 12번의 주장과 맞지 않고, rubber, diseases, demand는 과거 이야기(4~9번)에 나온 말.","c":null},"h":"7af8739963"}]},{"u":2,"id":"b3-02-4","no":4,"ko":"기니피그를 한 마리만 키우면 벌금?","items":[{"n":1,"t":"tf","q":"Switzerland has a law that bans keeping social animals alone.","ko":"스위스에는 사회적 동물을 혼자 키우는 것을 금지하는 법이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The country has a law that bans keeping social animals alone.","이 나라에는 사회적 동물을 혼자 키우는 것을 금지하는 법이 있다."]],"w":"2번 문장 The country has a law that bans keeping social animals alone과 같은 내용.","c":"T"},"h":"66caa62929"},{"n":2,"t":"tf","q":"In the wild, guinea pigs usually live alone.","ko":"야생에서 기니피그는 보통 혼자 산다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Guinea pigs, for example, live in groups of up to 10 in the wild.","예를 들어 기니피그는 야생에서 최대 10마리까지 무리를 지어 산다."]],"w":"6번에서 기니피그는 야생에서 최대 10마리까지 무리를 지어(in groups of up to 10) 산다고 함. 혼자 산다는 말은 반대라서 F.","c":"F"},"h":"408f376db5"},{"n":3,"t":"tf","q":"The Swiss government provides guidelines on cage size, exercise, and diet.","ko":"스위스 정부는 우리 크기, 운동, 식단에 대한 지침을 제공한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The Swiss government also provides guidelines on cage size, exercise, and diet.","스위스 정부는 또한 우리 크기, 운동, 식단에 대한 지침도 제공한다."]],"w":"11번 문장 The Swiss government also provides guidelines on cage size, exercise, and diet와 같은 내용.","c":"T"},"h":"1b9cff95ba"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The country has a law that bans keeping social animals alone.)","ko":"이 나라에는 사회적 동물을 혼자 키우는 것을 금지하는 법이 있다.","opts":["허락하다","금지하다","권하다","돕다"],"word":"bans","r":{"a":"2) 금지하다","ev":"1~2번 문장","s":[[1,"In Switzerland, people cannot keep just one pet guinea pig.","스위스에서는 사람들이 기니피그를 한 마리만 키울 수 없다."],[2,"The country has a law that bans keeping social animals alone.","이 나라에는 사회적 동물을 혼자 키우는 것을 금지하는 법이 있다."]],"w":"1번에서 기니피그를 한 마리만 키울 수 없다고 했고, 2번의 법이 사회적 동물을 혼자 키우는 것을 ban한다는 뜻. 그래서 bans = 금지하다. 허락하거나 권한다면 1번과 반대.","c":2},"h":"137703b2a5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (That’s why Switzerland requires owners to raise them in pairs or groups.)","ko":"그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다.","opts":["거절하다","빌려주다","잊다","요구하다"],"word":"requires","r":{"a":"4) 요구하다","ev":"9번 문장","s":[[9,"That’s why Switzerland requires owners to raise them in pairs or groups.","그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다."]],"w":"9번은 혼자 키우면 안 된다는 8번의 결과로, 주인에게 쌍이나 무리로 키우라고 요구한다는 뜻. 그래서 requires = 요구하다. 10번에서 지키지 않으면 벌금을 내야 한다고 한 것과도 이어짐.","c":4},"h":"5ee77d119a"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThat’s why Switzerland requires owners to raise them in pairs or groups.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다.","opts":["스위스 정부","주인들","반려 기니피그들","벌금들"],"r":{"a":"3) 반려 기니피그들","ev":"8~9번 문장","s":[[8,"When pet guinea pigs are kept alone, they can become sad, stressed, or even sick.","반려 기니피그가 혼자 길러지면, 슬퍼하고 스트레스를 받거나 심지어 병이 날 수 있다."],[9,"That’s why Switzerland requires owners to raise them in pairs or groups.","그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다."]],"w":"9번 바로 앞 8번의 주어가 pet guinea pigs(반려 기니피그들). 주인들(owners)이 키우는 대상이 them. 스위스나 주인은 요구하고 키우는 쪽이라 them이 될 수 없음.","c":3},"h":"f4c0f0c20a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Under this law, animals that live in groups must be kept with others of the same species.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 법에 따라, 무리 지어 사는 동물은 같은 종의 다른 동물들과 함께 길러져야 한다.","opts":["이 법에 따라 무리 지어 사는 동물은 같은 종의 다른 동물과 함께 길러야 한다.","이 법에 따라 무리 지어 사는 동물은 다른 종의 동물과 섞어서 길러야 한다.","이 법에 따라 무리 지어 사는 동물은 각자 따로 우리에 넣어 길러야 한다.","이 법에 따라 무리 지어 사는 동물은 야생에 풀어 주어야 한다."],"r":{"a":"1) 이 법에 따라 무리 지어 사는 동물은 같은 종의 다른 동물과 함께 길러야 한다.","ev":"3번 문장","s":[[3,"Under this law, animals that live in groups must be kept with others of the same species.","이 법에 따라, 무리 지어 사는 동물은 같은 종의 다른 동물들과 함께 길러져야 한다."]],"w":"must be kept with others of the same species는 같은 종의 다른 동물들과 함께 길러져야 한다는 뜻. 2번의 ‘혼자 키우는 것 금지’를 구체적으로 설명한 문장. 다른 종과 섞거나 따로 기른다는 말은 없음.","c":1},"h":"e6073aa142"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["기니피그는 몸짓 언어로만 의사소통한다.","스위스에서는 우리 지침을 지키면 기니피그를 혼자 키워도 된다.","스위스의 법은 기니피그에게만 적용된다.","혼자 길러진 기니피그는 슬퍼하고 스트레스를 받거나 병이 날 수 있다."],"opts":["Guinea pigs communicate only with body language.","In Switzerland, people can keep one guinea pig if they follow the cage guidelines.","The Swiss law applies only to guinea pigs.","Guinea pigs kept alone can become sad, stressed, or even sick."],"r":{"a":"4) Guinea pigs kept alone can become sad, stressed, or even sick.","ev":"5번, 7~9번 문장","s":[[5,"It applies to pets such as hamsters, guinea pigs, rats, parrots, and even some fish.","이 법은 햄스터, 기니피그, 쥐, 앵무새, 심지어 일부 물고기 같은 반려동물에 적용된다."],[7,"They communicate using body language and sounds.","그들은 몸짓과 소리로 의사소통한다."],[8,"When pet guinea pigs are kept alone, they can become sad, stressed, or even sick.","반려 기니피그가 혼자 길러지면, 슬퍼하고 스트레스를 받거나 심지어 병이 날 수 있다."],[9,"That’s why Switzerland requires owners to raise them in pairs or groups.","그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다."]],"w":"8번에서 혼자 길러지면 슬퍼하거나 스트레스를 받거나 병이 날 수 있다고 함. 의사소통은 몸짓과 소리 둘 다(7번), 법은 햄스터, 쥐, 앵무새 등에도 적용(5번), 혼자 키우는 것은 쌍이나 무리로 키우도록 요구하므로 금지(9번).","c":4},"h":"13b7ae725f"},{"n":9,"t":"sum","q":"Guinea pigs kept (A) can become sad or sick, so Switzerland requires owners to raise them in (B).","ko":"(A) 길러지는 기니피그는 슬퍼지거나 병이 날 수 있어서, 스위스는 주인에게 그들을 (B)로 키우도록 요구한다.","oko":["(A) 무리로 / (B) 쌍","(A) 혼자 / (B) 야생","(A) 혼자 / (B) 쌍이나 무리","(A) 쌍으로 / (B) 야생","(A) 혼자 / (B) 벌금"],"opts":["(A) in groups / (B) pairs","(A) alone / (B) the wild","(A) alone / (B) pairs or groups","(A) in pairs / (B) the wild","(A) alone / (B) fines"],"r":{"a":"3) (A) alone / (B) pairs or groups","ev":"8~9번 문장","s":[[8,"When pet guinea pigs are kept alone, they can become sad, stressed, or even sick.","반려 기니피그가 혼자 길러지면, 슬퍼하고 스트레스를 받거나 심지어 병이 날 수 있다."],[9,"That’s why Switzerland requires owners to raise them in pairs or groups.","그래서 스위스는 주인에게 그들을 쌍이나 무리로 키우도록 요구한다."]],"w":"8번 When pet guinea pigs are kept alone, they can become sad, stressed, or even sick, 9번 requires owners to raise them in pairs or groups에서 가져옴. the wild(야생)는 6번에 나오는 말이고 fines(벌금)는 10번에 나오는 말이지만 요구 사항(B)이 아니고, in groups(A)는 문제가 되는 상황이 아님.","c":3},"h":"70ae6f8ba3"},{"n":10,"t":"fill","q":"The law was introduced to [A] stress and suffering in [B] animals, and it applies to pets such as hamsters, guinea pigs, and parrots.","ko":"이 법은 [B] 동물이 겪는 스트레스와 고통을 [A] 위해 도입되었고, 햄스터, 기니피그, 앵무새 같은 반려동물에 적용된다.","bko":{"prevent":"막다","social":"사회적인","species":"종","fine":"벌금","raise":"기르다","pairs":"쌍"},"bank":["prevent","social","species","fine","raise","pairs"],"r":{"a":"[A] prevent, [B] social","ev":"4~5번 문장","s":[[4,"The law was introduced to prevent stress and suffering in social animals.","이 법은 사회적 동물이 겪는 스트레스와 고통을 막기 위해 도입되었다."],[5,"It applies to pets such as hamsters, guinea pigs, rats, parrots, and even some fish.","이 법은 햄스터, 기니피그, 쥐, 앵무새, 심지어 일부 물고기 같은 반려동물에 적용된다."]],"w":"4번 The law was introduced to prevent stress and suffering in social animals, 5번 It applies to pets such as hamsters, guinea pigs, rats, parrots에서 가져옴. species는 3번에서 같은 종을 말하는 단어이고 fine, raise, pairs는 9~10번에서 나온 말이라 이 문장에 맞지 않음.","c":null},"h":"90cf3be863"}]},{"u":3,"id":"b3-03-1","no":1,"ko":"828m 초고층이 바람에 꿈쩍 않는 비결은?","items":[{"n":1,"t":"tf","q":"At around 100 meters, the wind is stronger than it is near the ground.","ko":"약 100미터 높이에서는 바람이 지상 근처보다 더 강하다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"At around 100 meters, the wind is 1.5 times stronger than near the ground.","약 100미터 높이에서는 바람이 지상 근처보다 1.5배 더 강하다."]],"w":"2번 문장에 At around 100 meters, the wind is 1.5 times stronger than near the ground가 있음. 100미터 높이의 바람이 지상보다 1.5배 강하다는 내용과 일치.","c":"T"},"h":"2a0d9d38e2"},{"n":2,"t":"tf","q":"Each level of the Burj Khalifa is bigger than the one below.","ko":"부르즈 할리파의 각 층은 그 아래층보다 더 크다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Each level of the Burj Khalifa is smaller than the one below.","부르즈 할리파의 각 층은 그 아래층보다 더 작다."]],"w":"8번 문장은 각 층이 아래층보다 smaller(더 작다)라고 함. bigger(더 큰)라고 한 것은 반대임.","c":"F"},"h":"2328a10ff6"},{"n":3,"t":"tf","q":"The Burj Khalifa stays stable even in the strongest desert winds.","ko":"부르즈 할리파는 가장 강한 사막 바람 속에서도 안정적으로 서 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"14번 문장","s":[[14,"Thanks to these designs, the Burj Khalifa remains stable even in the strongest desert winds.","이런 설계 덕분에 부르즈 할리파는 가장 강한 사막 바람 속에서도 안정적으로 서 있다."]],"w":"14번 문장에 remains stable even in the strongest desert winds가 있음. remain(계속 ~한 상태이다)은 '변함없이 안정적이다'라는 뜻이라 본문과 일치.","c":"T"},"h":"c08f4c6bd1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... and prevent them from striking the tower all at once.)","ko":"... 바람이 탑을 한꺼번에 때리는 것을 막아 준다","opts":["돕다","막다","보내다","늘리다"],"word":"prevent","r":{"a":"2) 막다","ev":"9번 문장","s":[[9,"These step-like shapes break up strong winds and prevent them from striking the tower all at once.","이런 계단 같은 모양은 강한 바람을 흩어 놓아, 바람이 탑을 한꺼번에 때리는 것을 막아 준다."]],"w":"9번 문장은 계단 모양이 바람을 흩어 놓고, 바람이 탑을 한꺼번에 때리지 못하게 한다는 내용. prevent A from -ing는 'A가 ~하지 못하게 막다'라는 뜻.","c":2},"h":"b43483099f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (A thinner top has less area exposed to the wind, ...)","ko":"더 가는 꼭대기는 바람에 ... 면적이 더 적어서","opts":["숨겨진","덮인","높아진","노출된"],"word":"exposed","r":{"a":"4) 노출된","ev":"13번 문장","s":[[13,"A thinner top has less area exposed to the wind, so the wind puts less pressure on the building.","더 가는 꼭대기는 바람에 노출되는 면적이 더 적어서, 바람이 건물에 주는 압력이 더 작다."]],"w":"13번 문장은 꼭대기가 가늘면 바람을 맞는 면적이 줄어서 압력도 줄어든다는 내용. area exposed to the wind는 '바람에 드러난 면적'이므로 exposed = 노출된.","c":4},"h":"7430ba96fa"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThese step-like shapes break up strong winds and prevent them from striking the tower all at once.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이런 계단 같은 모양은 강한 바람을 흩어 놓아, 바람이 탑을 한꺼번에 때리는 것을 막아 준다.","opts":["계단 모양의 건물들","타워의 각 층","강한 바람","건축가들"],"r":{"a":"3) 강한 바람","ev":"9번 문장","s":[[9,"These step-like shapes break up strong winds and prevent them from striking the tower all at once.","이런 계단 같은 모양은 강한 바람을 흩어 놓아, 바람이 탑을 한꺼번에 때리는 것을 막아 준다."]],"w":"9번 문장에서 계단 모양이 break up(흩뜨리다)하는 것은 strong winds(강한 바람)이고, 탑을 때리려는(strike) 것도 그 바람. 그래서 them은 강한 바람.","c":3},"h":"7043d8a78b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In addition to the setbacks, the tower becomes thinner toward the top.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"셋백 외에도 탑은 위로 갈수록 더 가늘어진다.","opts":["셋백이 있어서 탑이 위로 갈수록 가늘어진다.","셋백 말고도, 탑은 위로 갈수록 더 가늘어진다.","셋백 때문에 탑의 꼭대기가 더 넓어진다.","셋백을 없애고 나서 탑이 가늘어졌다."],"r":{"a":"2) 셋백 말고도, 탑은 위로 갈수록 더 가늘어진다.","ev":"11번 문장","s":[[11,"In addition to the setbacks, the tower becomes thinner toward the top.","셋백 외에도 탑은 위로 갈수록 더 가늘어진다."]],"w":"In addition to ~는 '~ 외에도'라는 뜻이라 셋백에 더해 또 다른 방법이 있다는 말. 가늘어지는 것은 셋백의 결과가 아니라 별도의 설계(12번: tapering)임.","c":2},"h":"3ff8cd9c6d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["지상 근처의 바람이 100미터 높이의 바람보다 1.5배 더 강하다.","셋백은 탑을 한 덩어리로 곧게 짓는 방식이다.","탑은 위로 갈수록 더 넓어진다.","부르즈 할리파는 높이가 828미터이며 바람 속에서도 꿈쩍하지 않는다."],"opts":["The wind near the ground is 1.5 times stronger than at 100 meters.","A setback means building the tower as one straight block.","The tower becomes wider toward the top.","The Burj Khalifa is 828 meters tall and stands still in the wind."],"r":{"a":"4) The Burj Khalifa is 828 meters tall and stands still in the wind.","ev":"2~3, 7, 11번 문장","s":[[2,"At around 100 meters, the wind is 1.5 times stronger than near the ground.","약 100미터 높이에서는 바람이 지상 근처보다 1.5배 더 강하다."],[3,"But the Burj Khalifa in Dubai, which is 828 meters tall, stands still.","하지만 높이가 828미터인 두바이의 부르즈 할리파는 꿈쩍도 하지 않고 서 있다."],[7,"This means building the tower in sections, like steps.","이것은 탑을 계단처럼 여러 구간으로 나누어 짓는 것을 뜻한다."],[11,"In addition to the setbacks, the tower becomes thinner toward the top.","셋백 외에도 탑은 위로 갈수록 더 가늘어진다."]],"w":"3번 문장에서 828미터이고 stand still(가만히 서 있다)이라고 함. 1번은 2번 문장과 반대(100미터 바람이 더 강함), 2번은 7번의 '구간으로 나누어 짓기'와 다름, 3번은 11번의 '위로 갈수록 가늘어짐'과 반대.","c":4},"h":"c38f6e4e70"},{"n":9,"t":"sum","q":"Step-like shapes (A) strong winds, and a thinner top has (B) area exposed to the wind.","ko":"계단 모양은 강한 바람을 (A)하고, 더 가는 꼭대기는 바람에 노출되는 면적이 (B)다.","oko":["(A) 흩어 놓는다 / (B) 더 적은","(A) 늘린다 / (B) 더 적은","(A) 흩어 놓는다 / (B) 더 넓은","(A) 강하게 한다 / (B) 더 넓은","(A) 숨긴다 / (B) 더 적은"],"opts":["(A) break up / (B) less","(A) increase / (B) less","(A) break up / (B) more","(A) strengthen / (B) more","(A) hide / (B) less"],"r":{"a":"1) (A) break up / (B) less","ev":"9, 13번 문장","s":[[9,"These step-like shapes break up strong winds and prevent them from striking the tower all at once.","이런 계단 같은 모양은 강한 바람을 흩어 놓아, 바람이 탑을 한꺼번에 때리는 것을 막아 준다."],[13,"A thinner top has less area exposed to the wind, so the wind puts less pressure on the building.","더 가는 꼭대기는 바람에 노출되는 면적이 더 적어서, 바람이 건물에 주는 압력이 더 작다."]],"w":"9번 문장 break up strong winds(강한 바람을 흩뜨리다), 13번 문장 less area exposed to the wind(바람에 노출되는 면적이 더 적다). 따라서 break up과 less.","c":1},"h":"4decf7b4eb"},{"n":10,"t":"fill","q":"The Burj Khalifa uses a [A], which means building the tower in sections, and [B], which makes the top thinner.","ko":"부르즈 할리파는 탑을 구간으로 나누어 짓는 [A]와, 꼭대기를 더 가늘게 만드는 [B]를 쓴다.","bank":["setback","tapering","pressure","stable","structure","section"],"bko":{"setback":"셋백(계단식 구조)","tapering":"테이퍼링(위로 갈수록 가늘게 하기)","pressure":"압력","stable":"안정된","structure":"구조물","section":"구간"},"r":{"a":"[A] setback, [B] tapering","ev":"6~7, 11~12번 문장","s":[[6,"One helpful design was a setback.","도움이 된 한 가지 설계는 셋백이었다."],[7,"This means building the tower in sections, like steps.","이것은 탑을 계단처럼 여러 구간으로 나누어 짓는 것을 뜻한다."],[11,"In addition to the setbacks, the tower becomes thinner toward the top.","셋백 외에도 탑은 위로 갈수록 더 가늘어진다."],[12,"This is another smart solution, known as tapering.","이것은 테이퍼링이라고 알려진 또 다른 영리한 해결책이다."]],"w":"6~7번 문장에서 setback은 탑을 계단처럼 구간으로 나누어 짓는 것, 11~12번 문장에서 tapering은 위로 갈수록 가늘어지는 것. pressure·stable·structure는 본문에 나오지만 설계 이름이 아님.","c":null},"h":"e8f91e0b07"}]},{"u":3,"id":"b3-03-2","no":2,"ko":"집을 퍼즐처럼 조립한다고?","items":[{"n":1,"t":"tf","q":"Most parts of a modular house are made in a factory.","ko":"조립식 집의 대부분은 공장에서 만들어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"With this method, most parts of a house are made in a factory.","이 방법에서는 집의 대부분이 공장에서 만들어진다."]],"w":"4번 문장에 With this method, most parts of a house are made in a factory가 있음. 공장에서 대부분을 만든다는 내용과 일치.","c":"T"},"h":"04af0a0c36"},{"n":2,"t":"tf","q":"A module cannot be moved once it is built.","ko":"모듈은 한번 지어지면 옮길 수 없다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Each module can also be taken apart, moved, and reused in different places.","각 모듈은 분해하고, 옮기고, 다른 장소에서 다시 사용할 수도 있다."]],"w":"10번 문장은 each module can also be taken apart, moved, and reused(분해하고, 옮기고, 다시 쓸 수 있다)라고 함. 옮길 수 없다는 말은 반대임.","c":"F"},"h":"8764e06fe3"},{"n":3,"t":"tf","q":"In emergencies, modular buildings can quickly become shelters, clinics, or homes.","ko":"비상시에 조립식 건물은 빠르게 대피소, 진료소, 또는 집이 될 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"In emergencies, they can quickly become shelters, clinics, or homes when time or space is limited.","비상시에는 시간이나 공간이 제한될 때 그 건물들이 빠르게 대피소, 진료소, 또는 집이 될 수 있다."]],"w":"9번 문장에 In emergencies, they can quickly become shelters, clinics, or homes가 있음. they는 8번의 미리 지어 둔 조립식 건물. 내용이 일치함.","c":"T"},"h":"fb2e96f239"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is faster and cheaper than traditional construction.)","ko":"이것은 ... 건설보다 더 빠르고 더 저렴하다","opts":["현대적인","임시의","전통적인","값비싼"],"word":"traditional","r":{"a":"3) 전통적인","ev":"6번 문장","s":[[6,"This is faster and cheaper than traditional construction.","이것은 전통적인 건설보다 더 빠르고 더 저렴하다."]],"w":"6번 문장은 조립식이 전통적인 건설 방식보다 빠르고 싸다는 내용. 조립식(새 방식)과 비교되는 옛날부터 해 온 방식이므로 traditional = 전통적인.","c":3},"h":"921716847a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... when time or space is limited.)","ko":"시간이나 공간이 ... 때","opts":["제한된","넉넉한","사라진","오래된"],"word":"limited","r":{"a":"1) 제한된","ev":"9번 문장","s":[[9,"In emergencies, they can quickly become shelters, clinics, or homes when time or space is limited.","비상시에는 시간이나 공간이 제한될 때 그 건물들이 빠르게 대피소, 진료소, 또는 집이 될 수 있다."]],"w":"9번 문장은 비상시, 곧 시간이나 공간이 부족한 상황. limited는 '한정된, 제한된'이라는 뜻으로 넉넉하다는 말과 반대.","c":1},"h":"e6b6148b77"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIn emergencies, they can quickly become shelters, clinics, or homes when time or space is limited.","ko":"밑줄 친 they가 가리키는 것은?","sko":"비상시에는 시간이나 공간이 제한될 때 그 건물들이 빠르게 대피소, 진료소, 또는 집이 될 수 있다.","opts":["일부 조립식 건물","공장의 일꾼들","비상 상황들","대피소와 진료소"],"r":{"a":"1) 일부 조립식 건물","ev":"8~9번 문장","s":[[8,"Some modular buildings are built in advance.","일부 조립식 건물은 미리 지어 둔다."],[9,"In emergencies, they can quickly become shelters, clinics, or homes when time or space is limited.","비상시에는 시간이나 공간이 제한될 때 그 건물들이 빠르게 대피소, 진료소, 또는 집이 될 수 있다."]],"w":"8번 문장 Some modular buildings are built in advance(일부 조립식 건물은 미리 지어 둔다)에 이어 9번에서 they가 빠르게 대피소 등이 된다고 함. 그래서 they는 미리 지어 둔 조립식 건물.","c":1},"h":"e7b683052a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This system sounds great, but it's not perfect.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 시스템은 훌륭하게 들리지만 완벽하지는 않다.","opts":["이 시스템은 소리가 커서 완벽하지 않다.","이 시스템은 훌륭해 보이지만 완벽하지는 않다.","이 시스템은 훌륭해서 고칠 곳이 전혀 없다.","이 시스템은 완벽
