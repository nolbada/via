en called “the Poison Garden.” It’s filled with over 100 different poisonous plants.","그리고 2005년에, Jane은 ‘Poison Garden’이라고 불리는 특별한 정원을 추가했다. 그 정원은 100종이 넘는 다양한 독성 식물로 가득 차 있다."]],"w":"3번에서 제1대 공작이 1750년에 만든 것은 Alnwick Garden이고, Poison Garden은 8번에서 2005년에 Jane이 추가한 것임.","c":"F"},"h":"2c200be0e1"},{"n":2,"t":"tf","q":"Signs in the Poison Garden warn visitors not to touch or smell anything.","ko":"Poison Garden의 표지판들은 방문객들에게 아무것도 만지거나 냄새를 맡지 말라고 경고한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Signs in the Poison Garden warn visitors not to touch or smell anything.","Poison Garden의 표지판들은 방문객들에게 아무것도 만지거나 냄새를 맡지 말라고 경고한다."]],"w":"10번 문장 그대로임.","c":"T"},"h":"d8349a6a03"},{"n":3,"t":"tf","q":"The Alnwick Garden has only a few visitors because of the dangers.","ko":"위험 때문에 Alnwick Garden에는 방문객이 거의 없다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"But despite the dangers, the Alnwick Garden attracts over 600,000 visitors every year.","하지만 그런 위험에도 불구하고, Alnwick Garden은 매년 600,000명이 넘는 방문객들을 끌어들인다."]],"w":"11번에서 위험에도 불구하고 매년 60만 명이 넘는 방문객이 온다고 함. 방문객이 거의 없다는 말과 반대임.","c":"F"},"h":"e61cbedd07"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Jane Percy … decided to recreate the garden.)","ko":"Jane Percy는 그 정원을 ＿＿＿＿＿ 결정했다.","opts":["팔다","숨기다","되살리다, 다시 만들다","부수다"],"word":"recreate","r":{"a":"3) 되살리다, 다시 만들다","ev":"5~6번 문장","s":[[5,"But over time, the garden was forgotten.","그러나 시간이 지나면서, 그 정원은 잊혔다."],[6,"In 1995, Jane Percy, the 12th Duke’s wife, decided to recreate the garden.","1995년에, 제12대 공작의 아내인 Jane Percy는 그 정원을 되살리기로 결정했다."]],"w":"5번에서 정원이 잊혔고, 6번에서 Jane이 그 정원을 다시 만들기로 결정함. recreate = 되살리다, 다시 만들다.","c":3},"h":"e283f4065d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…the Alnwick Garden attracts over 600,000 visitors every year.)","ko":"Alnwick Garden은 매년 600,000명이 넘는 방문객들을 ＿＿＿＿＿.","opts":["쫓아내다","끌어들이다","가르치다","경고하다"],"word":"attracts","r":{"a":"2) 끌어들이다","ev":"11번 문장","s":[[11,"But despite the dangers, the Alnwick Garden attracts over 600,000 visitors every year.","하지만 그런 위험에도 불구하고, Alnwick Garden은 매년 600,000명이 넘는 방문객들을 끌어들인다."]],"w":"11번은 위험한데도 방문객이 매년 60만 명 넘게 온다는 내용. attract = 끌어들이다. 쫓아낸다는 말은 문맥과 반대임.","c":2},"h":"8e0bb3d064"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nHowever, don’t stop to smell the flowers in its Poison Garden — they can actually poison you!","ko":"밑줄 친 they가 가리키는 것은?","sko":"그러나, 그곳의 Poison Garden에 있는 꽃들의 냄새를 맡기 위해 멈추지는 마라 — 그것들은 실제로 당신에게 독이 될 수 있다!","opts":["방문객들","공작들","Poison Garden의 꽃들","정원의 표지판들"],"r":{"a":"3) Poison Garden의 꽃들","ev":"2번 문장","s":[[2,"However, don’t stop to smell the flowers in its Poison Garden — they can actually poison you!","그러나, 그곳의 Poison Garden에 있는 꽃들의 냄새를 맡기 위해 멈추지는 마라 — 그것들은 실제로 당신에게 독이 될 수 있다!"]],"w":"2번에서 냄새를 맡지 말라고 한 것은 Poison Garden의 flowers(꽃들)이고, they는 그 꽃들을 가리킴. 독이 될 수 있는 것은 꽃들임.","c":3},"h":"2619a2eb32"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But despite the dangers, the Alnwick Garden attracts over 600,000 visitors every year.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 그런 위험에도 불구하고, Alnwick Garden은 매년 600,000명이 넘는 방문객들을 끌어들인다.","opts":["위험하기 때문에 방문객이 한 명도 오지 않는다.","위험이 있어도 매년 60만 명이 넘는 방문객이 찾아온다.","방문객들이 위험을 몰라서 매년 60만 명이 왔다.","위험해서 방문객이 매년 점점 늘고 있다."],"r":{"a":"2) 위험이 있어도 매년 60만 명이 넘는 방문객이 찾아온다.","ev":"11번 문장","s":[[11,"But despite the dangers, the Alnwick Garden attracts over 600,000 visitors every year.","하지만 그런 위험에도 불구하고, Alnwick Garden은 매년 600,000명이 넘는 방문객들을 끌어들인다."]],"w":"despite the dangers는 ‘위험에도 불구하고’. 그래도 매년 60만 명이 넘게 온다는 뜻임. 위험 때문에 늘었다거나 몰라서 왔다는 말은 본문에 없음.","c":2},"h":"2c75b37050"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Alnwick Garden은 1995년에 처음 만들어졌다.","Poison Garden에는 식물이 열 종도 안 된다.","Jane Percy는 2005년에 Poison Garden을 추가했다.","방문객들은 식물의 냄새를 맡으라고 안내받는다."],"opts":["The Alnwick Garden was first created in 1995.","The Poison Garden has fewer than ten kinds of plants.","Jane Percy added the Poison Garden in 2005.","Visitors are told to smell the plants."],"r":{"a":"3) Jane Percy added the Poison Garden in 2005.","ev":"3번, 6번, 8번, 10번 문장","s":[[3,"The 1st Duke of Northumberland created the Alnwick Garden in 1750.","Northumberland의 제1대 공작은 1750년에 Alnwick Garden을 만들었다."],[6,"In 1995, Jane Percy, the 12th Duke’s wife, decided to recreate the garden.","1995년에, 제12대 공작의 아내인 Jane Percy는 그 정원을 되살리기로 결정했다."],[8,"Then in 2005, Jane added a special garden called “the Poison Garden.” It’s filled with over 100 different poisonous plants.","그리고 2005년에, Jane은 ‘Poison Garden’이라고 불리는 특별한 정원을 추가했다. 그 정원은 100종이 넘는 다양한 독성 식물로 가득 차 있다."],[10,"Signs in the Poison Garden warn visitors not to touch or smell anything.","Poison Garden의 표지판들은 방문객들에게 아무것도 만지거나 냄새를 맡지 말라고 경고한다."]],"w":"8번에 2005년에 Jane이 Poison Garden을 추가했다고 함. 처음 만든 때는 1750년(3번), 식물은 100종이 넘고(8번), 표지판은 냄새를 맡지 말라고 함(10번).","c":3},"h":"a52ce061ac"},{"n":9,"t":"sum","q":"In 1750 the Duke (A) the Alnwick Garden, and in 2005 Jane added a garden filled with (B) plants.","ko":"1750년에 공작은 Alnwick Garden을 (A)했고, 2005년에 Jane은 (B) 식물로 가득 찬 정원을 추가했다.","oko":["(A) 잊었다 / (B) 아름다운","(A) 만들었다 / (B) 값싼","(A) 팔았다 / (B) 독이 있는","(A) 만들었다 / (B) 독이 있는","(A) 청소했다 / (B) 희귀한"],"opts":["(A) forgot / (B) beautiful","(A) created / (B) cheap","(A) sold / (B) poisonous","(A) created / (B) poisonous","(A) cleaned / (B) rare"],"r":{"a":"4) (A) created / (B) poisonous","ev":"3번, 8번 문장","s":[[3,"The 1st Duke of Northumberland created the Alnwick Garden in 1750.","Northumberland의 제1대 공작은 1750년에 Alnwick Garden을 만들었다."],[8,"Then in 2005, Jane added a special garden called “the Poison Garden.” It’s filled with over 100 different poisonous plants.","그리고 2005년에, Jane은 ‘Poison Garden’이라고 불리는 특별한 정원을 추가했다. 그 정원은 100종이 넘는 다양한 독성 식물로 가득 차 있다."]],"w":"3번에서 1750년에 공작이 정원을 created(만들었다). 8번에서 2005년에 Jane이 poisonous plants(독이 있는 식물)로 가득한 정원을 추가함.","c":4},"h":"5e224682a8"},{"n":10,"t":"fill","q":"Jane hopes the garden will [A] people about the good and bad [B] of plants.","ko":"Jane은 그 정원이 사람들에게 식물의 좋고 나쁜 [B]에 대해 [A]해 주기를 바란다.","bko":{"teach":"가르치다","effect":"영향","forget":"잊다","danger":"위험","visit":"방문하다","safety":"안전"},"bank":["teach","effect","forget","danger","visit","safety"],"r":{"a":"[A] teach, [B] effect","ev":"12번 문장","s":[[12,"Jane hopes the garden will teach people about the good and bad effect of plants.","Jane은 그 정원이 사람들에게 식물의 좋은 영향과 나쁜 영향에 대해 가르쳐 주기를 바란다."]],"w":"12번 Jane hopes the garden will teach people about the good and bad effect of plants에서 가져옴. forget(잊다), visit(방문하다)은 ‘사람들에게 ~에 대해 …하다’ 자리에 맞지 않고, danger(위험), safety(안전)는 good and bad(좋고 나쁜)와 어울리지 않음.","c":null},"h":"507555e450"}]},{"u":4,"id":"rg2-04-3","no":3,"ko":"안경 쓴 아이가 디즈니를 움직인 편지?","items":[{"n":1,"t":"tf","q":"Lowri’s mom wrote a letter to the Unicode Consortium.","ko":"Lowri의 엄마가 유니코드 협회에 편지를 썼다.","r":{"a":"F (본문과 다른 내용)","ev":"4번, 10번 문장","s":[[4,"My mom shared my letter on Facebook and lots of people liked it.","저희 엄마는 페이스북에 제 편지를 공유했고, 많은 사람들이 그것을 좋아해 주었어요."],[10,"So, I wrote a letter to the Unicode Consortium to ask for more emojis with glasses.","그래서 저는 유니코드 협회에 안경을 쓴 이모티콘을 더 많이 만들어 달라고 요청하기 위해 편지를 썼어요."]],"w":"10번에서 유니코드 협회에 편지를 쓴 사람은 Lowri(I wrote a letter)임. 엄마는 4번에서 Lowri의 편지를 페이스북에 공유했을 뿐임.","c":"F"},"h":"71e5276b1e"},{"n":2,"t":"tf","q":"Disney created the character Mirabel in the movie Encanto.","ko":"디즈니는 영화 Encanto에서 Mirabel이라는 캐릭터를 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Thankfully, Disney listened and created the character, Mirabel in the movie Encanto.","고맙게도, 디즈니는 제 얘기를 듣고 영화 「Encanto」의 Mirabel이라는 캐릭터를 만들어 냈어요."]],"w":"5번 문장 그대로. 디즈니가 Lowri의 얘기를 듣고 안경을 쓴 캐릭터를 만들어 냈다고 함.","c":"T"},"h":"28e183a66a"},{"n":3,"t":"tf","q":"There were many emojis with glasses that looked like Lowri.","ko":"Lowri와 닮은, 안경을 쓴 이모티콘이 많이 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"There were few emojis with glasses, and they didn’t look like me.","안경을 쓴 이모티콘은 거의 없었고, 그것들은 저와 닮아 보이지 않았어요."]],"w":"9번에서 안경을 쓴 이모티콘은 few(거의 없었다)이고, 그것들도 Lowri와 닮아 보이지 않았다고 함.","c":"F"},"h":"a754c80002"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (I also started a campaign called #GlassesOn.)","ko":"저는 또한 #GlassesOn이라는 ＿＿＿＿＿을 시작했어요.","opts":["여행","시합","캠페인, 사회적 운동","상품"],"word":"campaign","r":{"a":"3) 캠페인, 사회적 운동","ev":"7~8번, 10번 문장","s":[[7,"I also started a campaign called #GlassesOn.","저는 또한 #GlassesOn이라는 캠페인을 시작했어요."],[8,"The idea started when my mom was looking for an emoji for me.","그 아이디어는 저희 엄마가 저를 위한 이모티콘을 찾고 있었을 때 시작되었어요."],[10,"So, I wrote a letter to the Unicode Consortium to ask for more emojis with glasses.","그래서 저는 유니코드 협회에 안경을 쓴 이모티콘을 더 많이 만들어 달라고 요청하기 위해 편지를 썼어요."]],"w":"7번에서 #GlassesOn이라는 campaign을 시작했다고 하고, 8~10번에서 이모티콘을 늘려 달라고 편지를 쓴 활동을 함. 여러 사람이 함께하는 활동이라 campaign은 캠페인, 사회적 운동.","c":3},"h":"e6e5930a05"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (There were few emojis with glasses…)","ko":"안경을 쓴 이모티콘은 ＿＿＿＿＿＿ 있었다…","opts":["아주 많은","거의 없는","아주 큰","새로운"],"word":"few","r":{"a":"2) 거의 없는","ev":"9~10번 문장","s":[[9,"There were few emojis with glasses, and they didn’t look like me.","안경을 쓴 이모티콘은 거의 없었고, 그것들은 저와 닮아 보이지 않았어요."],[10,"So, I wrote a letter to the Unicode Consortium to ask for more emojis with glasses.","그래서 저는 유니코드 협회에 안경을 쓴 이모티콘을 더 많이 만들어 달라고 요청하기 위해 편지를 썼어요."]],"w":"9번의 few는 ‘거의 없는’. 그래서(So) 10번에서 유니코드 협회에 더 만들어 달라고 요청한 것임. 많다는 뜻이면 요청할 이유가 없음.","c":2},"h":"f22ba5f878"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nThere were few emojis with glasses, and they didn’t look like me.","ko":"밑줄 친 they가 가리키는 것은?","sko":"안경을 쓴 이모티콘은 거의 없었고, 그것들은 저와 닮아 보이지 않았어요.","opts":["영화 속 캐릭터들","Lowri의 가족들","대기업 직원들","안경을 쓴 이모티콘들"],"r":{"a":"4) 안경을 쓴 이모티콘들","ev":"9번 문장","s":[[9,"There were few emojis with glasses, and they didn’t look like me.","안경을 쓴 이모티콘은 거의 없었고, 그것들은 저와 닮아 보이지 않았어요."]],"w":"9번에서 There were few emojis with glasses 뒤의 they didn’t look like me에서 they는 바로 앞의 emojis(이모티콘들)를 가리킴. Lowri와 닮아 보이지 않았던 것은 그 이모티콘들.","c":4},"h":"7526a17a80"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The idea started when my mom was looking for an emoji for me.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 아이디어는 저희 엄마가 저를 위한 이모티콘을 찾고 있었을 때 시작되었어요.","opts":["이모티콘을 먼저 만든 뒤에 엄마가 이 아이디어를 떠올렸다.","엄마가 Lowri에게 줄 이모티콘을 찾고 있을 때 이 아이디어가 시작되었다.","엄마가 이모티콘 회사에서 일하다가 이 아이디어가 시작되었다.","Lowri가 엄마에게 이모티콘을 사 달라고 해서 이 아이디어가 시작되었다."],"r":{"a":"2) 엄마가 Lowri에게 줄 이모티콘을 찾고 있을 때 이 아이디어가 시작되었다.","ev":"8번 문장","s":[[8,"The idea started when my mom was looking for an emoji for me.","그 아이디어는 저희 엄마가 저를 위한 이모티콘을 찾고 있었을 때 시작되었어요."]],"w":"The idea started when my mom was looking for an emoji for me는 ‘엄마가 나를 위한 이모티콘을 찾고 있을 때 아이디어가 시작되었다’는 뜻. 회사 이야기나 사 달라는 이야기는 본문에 없음.","c":2},"h":"8c8a87ba72"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Lowri의 엄마는 Lowri의 편지를 페이스북에 공유했다.","디즈니는 안경을 쓴 캐릭터를 만들기를 거절했다.","Lowri는 구글에만 편지를 보냈다.","Lowri는 영화 Encanto의 감독이다."],"opts":["Lowri’s mom shared Lowri’s letter on Facebook.","Disney refused to make a character with glasses.","Lowri sent letters only to Google.","Lowri is the director of the movie Encanto."],"r":{"a":"1) Lowri’s mom shared Lowri’s letter on Facebook.","ev":"4~5번, 10~11번 문장","s":[[4,"My mom shared my letter on Facebook and lots of people liked it.","저희 엄마는 페이스북에 제 편지를 공유했고, 많은 사람들이 그것을 좋아해 주었어요."],[5,"Thankfully, Disney listened and created the character, Mirabel in the movie Encanto.","고맙게도, 디즈니는 제 얘기를 듣고 영화 「Encanto」의 Mirabel이라는 캐릭터를 만들어 냈어요."],[10,"So, I wrote a letter to the Unicode Consortium to ask for more emojis with glasses.","그래서 저는 유니코드 협회에 안경을 쓴 이모티콘을 더 많이 만들어 달라고 요청하기 위해 편지를 썼어요."],[11,"I also sent a letter to big tech companies like Google.","저는 구글과 같은 첨단 기술 대기업에도 편지를 보냈어요."]],"w":"4번에서 엄마가 편지를 페이스북에 공유했다고 함. 디즈니는 캐릭터를 만들어 줌(5번), 편지는 유니코드 협회와 구글 같은 대기업들에 보냄(10~11번), Lowri가 감독이라는 말은 없음.","c":1},"h":"521628768f"},{"n":9,"t":"sum","q":"Lowri asked Disney to make more (A) wearing glasses, and Disney (B) the character Mirabel.","ko":"Lowri는 디즈니에 안경을 쓴 더 많은 (A)을 만들어 달라고 부탁했고, 디즈니는 Mirabel이라는 캐릭터를 (B).","oko":["(A) 이모티콘 / (B) 잊었다","(A) 선생님들 / (B) 만들었다","(A) 캐릭터들 / (B) 만들었다","(A) 캐릭터들 / (B) 거절했다","(A) 이모티콘 / (B) 팔았다"],"opts":["(A) emojis / (B) forgot","(A) teachers / (B) created","(A) characters / (B) created","(A) characters / (B) refused","(A) emojis / (B) sold"],"r":{"a":"3) (A) characters / (B) created","ev":"3번, 5번 문장","s":[[3,"I asked them to make more characters wearing glasses.","저는 그들에게 안경을 쓰고 있는 더 많은 캐릭터를 만들어 달라고 부탁했어요."],[5,"Thankfully, Disney listened and created the character, Mirabel in the movie Encanto.","고맙게도, 디즈니는 제 얘기를 듣고 영화 「Encanto」의 Mirabel이라는 캐릭터를 만들어 냈어요."]],"w":"3번에서 안경을 쓴 more characters를 만들어 달라고 부탁했고, 5번에서 디즈니가 Mirabel 캐릭터를 created(만들어 냈다). 그래서 characters와 created.","c":3},"h":"603d4091b4"},{"n":10,"t":"fill","q":"Lowri wrote a letter to [A] for more emojis with glasses, and many people now [B] with her.","ko":"Lowri는 안경을 쓴 이모티콘을 더 만들어 달라고 [A]하는 편지를 썼고, 지금은 많은 사람들이 그녀의 의견에 [B]한다.","bko":{"ask":"요청하다","agree":"동의하다","wear":"쓰다, 입다","forget":"잊다","finish":"끝내다","build":"짓다"},"bank":["ask","agree","wear","forget","finish","build"],"r":{"a":"[A] ask, [B] agree","ev":"10번, 12번 문장","s":[[10,"So, I wrote a letter to the Unicode Consortium to ask for more emojis with glasses.","그래서 저는 유니코드 협회에 안경을 쓴 이모티콘을 더 많이 만들어 달라고 요청하기 위해 편지를 썼어요."],[12,"Many people agree with me now, and we’ll keep trying!","이제 많은 사람들이 제 의견에 동의하며, 우리는 계속 노력할 거예요!"]],"w":"10번 to ask for more emojis with glasses와 12번 Many people agree with me now에서 가져옴. wear(쓰다), finish(끝내다) 등은 for, with와 이어지는 자리에 맞지 않음.","c":null},"h":"e29913ecff"}]},{"u":5,"id":"rg2-05-1","no":1,"ko":"멸종 위기에서 벗어난 귀여운 새의 비결은?","items":[{"n":1,"t":"tf","q":"Puffins are afraid of people.","ko":"퍼핀은 사람들을 무서워한다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"Puffins are very friendly, so they aren’t afraid of people.","퍼핀은 매우 호의적이어서 사람들을 무서워하지 않는다."]],"w":"2번에서 퍼핀은 매우 friendly해서 사람들을 무서워하지 않는다(aren’t afraid of people)고 함.","c":"F"},"h":"1cc45ec2a5"},{"n":2,"t":"tf","q":"Steve Kress used fake puffins because he thought the real puffins might see them as friends.","ko":"Steve Kress는 진짜 퍼핀들이 가짜 퍼핀을 친구로 볼지도 모른다고 생각해서 가짜 퍼핀을 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"He also used fake puffins because he thought the real puffins might see them as friends.","그는 가짜 퍼핀도 사용했는데, 진짜 퍼핀들이 그것들을 친구로 볼지도 모른다고 생각했기 때문이다."]],"w":"8번 문장 그대로임.","c":"T"},"h":"c5b93f273f"},{"n":3,"t":"tf","q":"The number of tourists in the U.K. increased during the COVID-19 pandemic.","ko":"코로나19 대유행 동안 영국에서 관광객의 수가 늘었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"During the COVID-19 pandemic in the U.K., there were fewer tourists.","코로나19 대유행 동안 영국에서는 관광객이 더 적었다."]],"w":"11번에서 영국에는 fewer tourists(더 적은 관광객)가 있었다고 함. 늘었다는 말과 반대임.","c":"F"},"h":"dccec6dd77"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But puffins were once an endangered species.)","ko":"하지만 퍼핀은 한때 ＿＿＿＿＿＿ 종이었다.","opts":["번성한","멸종 위기에 처한","유명한","귀여운"],"word":"endangered","r":{"a":"2) 멸종 위기에 처한","ev":"4~5번 문장","s":[[4,"But puffins were once an endangered species.","하지만 퍼핀은 한때 멸종 위기종이었다."],[5,"The Earth and the ocean are getting warmer, and this put puffins in danger.","지구와 바다가 점점 더 따뜻해지고 있고, 이것이 퍼핀을 위험에 빠뜨렸다."]],"w":"4번의 endangered species는 ‘멸종 위기에 처한 종’. 5번에서 지구와 바다가 따뜻해져 퍼핀이 위험에 빠졌다고 해서 위기라는 뜻이 맞음. 번성했다면 위험이 아님.","c":2},"h":"2158dcc6b4"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He also used fake puffins because he thought the real puffins might see them as friends.)","ko":"그는 ＿＿＿ 퍼핀도 사용했는데, 진짜 퍼핀들이 그것들을 친구로 볼지도 모른다고 생각했기 때문이다.","opts":["가짜의","진짜의","야생의","아기의"],"word":"fake","r":{"a":"1) 가짜의","ev":"8번 문장","s":[[8,"He also used fake puffins because he thought the real puffins might see them as friends.","그는 가짜 퍼핀도 사용했는데, 진짜 퍼핀들이 그것들을 친구로 볼지도 모른다고 생각했기 때문이다."]],"w":"8번에서 fake puffins와 the real puffins가 대조됨. real(진짜의)의 반대인 fake는 ‘가짜의’.","c":1},"h":"3d54ea0c17"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nHe made a better home for them in nature.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그는 자연에 그들을 위한 더 나은 보금자리를 만들어 주었다.","opts":["관광객들","가짜 퍼핀들","사람들","퍼핀들"],"r":{"a":"4) 퍼핀들","ev":"6~7번 문장","s":[[6,"A man named Steve Kress from Maine, the U.S., wanted to help puffins.","미국 메인주 출신의 Steve Kress라는 남자는 퍼핀들을 돕고 싶었다."],[7,"He made a better home for them in nature.","그는 자연에 그들을 위한 더 나은 보금자리를 만들어 주었다."]],"w":"6번에서 Steve Kress는 퍼핀들(puffins)을 돕고 싶어 했고, 7번 He made a better home for them의 them은 그 퍼핀들. 보금자리는 퍼핀들을 위한 것임.","c":4},"h":"9e82451508"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The Earth and the ocean are getting warmer, and this put puffins in danger.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"지구와 바다가 점점 더 따뜻해지고 있고, 이것이 퍼핀을 위험에 빠뜨렸다.","opts":["퍼핀 때문에 지구와 바다가 더 위험해졌다.","지구와 바다가 점점 차가워지면서 퍼핀이 위험에 빠졌다.","지구와 바다가 점점 따뜻해지면서 퍼핀이 위험에 빠졌다.","퍼핀이 바다를 따뜻하게 만들어서 위험에 빠졌다."],"r":{"a":"3) 지구와 바다가 점점 따뜻해지면서 퍼핀이 위험에 빠졌다.","ev":"5번 문장","s":[[5,"The Earth and the ocean are getting warmer, and this put puffins in danger.","지구와 바다가 점점 더 따뜻해지고 있고, 이것이 퍼핀을 위험에 빠뜨렸다."]],"w":"are getting warmer는 ‘점점 더 따뜻해지고 있다’이고, this put puffins in danger는 ‘이것이 퍼핀을 위험에 빠뜨렸다’는 뜻. 원인은 지구와 바다의 온도 상승임.","c":3},"h":"c282d0c324"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["퍼핀은 남대서양 바다 근처에서만 산다.","미국 어류 및 야생동물관리국은 2020년 12월에 퍼핀을 멸종 위기종 목록에서 제외했다.","Steve Kress는 영국 출신이다.","지금은 전보다 퍼핀이 더 적다."],"opts":["Puffins live near the ocean only in the South Atlantic.","The US Fish and Wildlife Service removed puffins from the endangered species list in December 2020.","Steve Kress is from the U.K.","There are fewer puffins now than before."],"r":{"a":"2) The US Fish and Wildlife Service removed puffins from the endangered species list in December 2020.","ev":"1번, 6번, 10번, 13번 문장","s":[[1,"Puffins are cute birds living near the ocean in the North Atlantic.","퍼핀은 북대서양의 바다 근처에 사는 귀여운 새이다."],[6,"A man named Steve Kress from Maine, the U.S., wanted to help puffins.","미국 메인주 출신의 Steve Kress라는 남자는 퍼핀들을 돕고 싶었다."],[10,"Now, there are more puffins than before.","이제, 전보다 더 많은 퍼핀들이 있다."],[13,"As a result, the US Fish and Wildlife Service removed them from the endangered species list in December 2020.","그 결과, 미국 어류 및 야생동물관리국은 2020년 12월에 퍼핀을 멸종 위기종 목록에서 제외했다."]],"w":"13번에서 2020년 12월에 멸종 위기종 목록에서 제외했다고 함. 퍼핀은 북대서양(1번), Steve Kress는 미국 메인주(6번), 지금은 퍼핀이 더 많음(10번)이라 나머지는 틀림.","c":2},"h":"66f367e9e3"},{"n":9,"t":"sum","q":"Steve Kress helped puffins by making a better (A) for them and using (B) puffins.","ko":"Steve Kress는 퍼핀들을 위해 더 나은 (A)를 만들고 (B) 퍼핀을 사용해서 퍼핀들을 도왔다.","oko":["(A) 집 / (B) 진짜","(A) 먹이 / (B) 가짜","(A) 장난감 / (B) 가짜","(A) 집 / (B) 가짜","(A) 우리 / (B) 아기"],"opts":["(A) home / (B) real","(A) food / (B) fake","(A) toys / (B) fake","(A) home / (B) fake","(A) cage / (B) baby"],"r":{"a":"4) (A) home / (B) fake","ev":"6~8번 문장","s":[[6,"A man named Steve Kress from Maine, the U.S., wanted to help puffins.","미국 메인주 출신의 Steve Kress라는 남자는 퍼핀들을 돕고 싶었다."],[7,"He made a better home for them in nature.","그는 자연에 그들을 위한 더 나은 보금자리를 만들어 주었다."],[8,"He also used fake puffins because he thought the real puffins might see them as friends.","그는 가짜 퍼핀도 사용했는데, 진짜 퍼핀들이 그것들을 친구로 볼지도 모른다고 생각했기 때문이다."]],"w":"7번에서 퍼핀을 위한 더 나은 home(집, 보금자리)을 만들었고, 8번에서 fake puffins(가짜 퍼핀)를 사용함. 그래서 home과 fake.","c":4},"h":"925692adf4"},{"n":10,"t":"fill","q":"During the pandemic, there were [A] tourists in the U.K., so puffins could have more [B].","ko":"대유행 동안 영국에는 관광객이 [A] 있었고, 그래서 퍼핀들은 더 많은 [B]을 낳을 수 있었다.","bko":{"fewer":"더 적은 수의","babies":"새끼들","ocean":"바다","warmer":"더 따뜻한","endangered":"멸종 위기에 처한","fake":"가짜의"},"bank":["fewer","babies","ocean","warmer","endangered","fake"],"r":{"a":"[A] fewer, [B] babies","ev":"11~12번 문장","s":[[11,"During the COVID-19 pandemic in the U.K., there were fewer tourists.","코로나19 대유행 동안 영국에서는 관광객이 더 적었다."],[12,"So the puffins could have more babies.","그래서 퍼핀들은 더 많은 새끼를 낳을 수 있었다."]],"w":"11번 there were fewer tourists와 12번 the puffins could have more babies에서 가져옴. ocean(바다)은 1번에 나오지만 퍼핀이 낳는 것이 아니고, warmer는 5번의 지구와 바다 이야기임.","c":null},"h":"03c4f89ba9"}]},{"u":5,"id":"rg2-05-2","no":2,"ko":"영화 같은 소행성 충돌, 현실에서 막을 수 있을까?","items":[{"n":1,"t":"tf","q":"The DART experiment was done in 2002.","ko":"DART 실험은 2002년에 했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"In 2022, NASA did an experiment called DART.","2022년에, NASA는 DART라고 불리는 실험을 했다."]],"w":"4번에서 NASA가 DART 실험을 한 해는 2022년임. 2002년이 아님.","c":"F"},"h":"877604f1b7"},{"n":2,"t":"tf","q":"The spaceship followed Dimorphos for 10 months.","ko":"우주선은 Dimorphos를 10개월 동안 따라다녔다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The spaceship followed an asteroid named Dimorphos for 10 months.","그 우주선은 Dimorphos라는 이름의 소행성을 10개월 동안 따라다녔다."]],"w":"7번 문장 그대로. 우주선이 Dimorphos라는 소행성을 10개월 동안 따라다녔다고 함.","c":"T"},"h":"f6625fb6f1"},{"n":3,"t":"tf","q":"Scientists say the chance of an asteroid hitting the Earth is very high right now.","ko":"과학자들은 지금 소행성이 지구에 충돌할 가능성이 매우 높다고 말한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Scientists say that right now, the chance of an asteroid hitting the Earth is very low.","과학자들은 소행성이 지구에 충돌할 가능성이 지금 당장은 매우 낮다고 말한다."]],"w":"10번에서 과학자들은 지금 충돌 가능성이 매우 낮다(very low)고 함. 높다는 말과 반대임.","c":"F"},"h":"7330bf3bb7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…it crashed into Dimorphos very fast and changed its path.)","ko":"…그것은 Dimorphos와 매우 빠르게 충돌했고 그 소행성의 ＿＿＿＿ 바꿨다.","opts":["경로","속도","색깔","크기"],"word":"path","r":{"a":"1) 경로","ev":"5번, 8~9번 문장","s":[[5,"NASA wanted to see if hitting an asteroid could change its path.","NASA는 소행성에 충돌해 그 궤도를 바꿀 수 있는지 알아보고 싶었다."],[8,"When the spaceship had the opportunity, it crashed into Dimorphos very fast and changed its path.","우주선이 기회를 얻었을 때, 그것은 Dimorphos와 매우 빠르게 충돌했고, 그 소행성의 경로를 바꿨다."],[9,"NASA successfully changed the orbit of an asteroid!","NASA는 성공적으로 한 소행성의 궤도를 바꾸었다!"]],"w":"5번에서 NASA가 알아보려던 것은 충돌로 path를 바꿀 수 있는지이고, 9번에서는 같은 뜻으로 orbit(궤도)을 바꿨다고 함. path = 길, 경로.","c":1},"h":"e516600488" f"},{"n":10,"t":"fill","q":"NASA wanted to see if hitting an asteroid could [A] its path, so they sent a [B] into space.","ko":"NASA는 소행성에 충돌해서 그 경로를 [A] 수 있는지 알고 싶었고, 그래서 [B]을 우주로 보냈다.","bko":{"change":"바꾸다","spaceship":"우주선","forget":"잊다","movie":"영화","chance":"가능성, 기회","story":"이야기"},"bank":["change","spaceship","forget","movie","chance","story"],"r":{"a":"[A] change, [B] spaceship","ev":"5~6번 문장","s":[[5,"NASA wanted to see if hitting an asteroid could change its path.","NASA는 소행성에 충돌해 그 궤도를 바꿀 수 있는지 알아보고 싶었다."],[6,"So they built a spaceship with a camera and sent it into space.","그래서 그들은 카메라가 달린 우주선을 만들어 우주로 보냈다."]],"w":"5번 could change its path와 6번 built a spaceship … and sent it into space에서 가져옴. movie, story는 1번에 나오는 영화 이야기이고, forget(잊다)은 문맥에 맞지 않음.","c":null},"h":"08fa1cd8a2"}]},{"u":5,"id":"rg2-05-3","no":3,"ko":"미끄러운 기둥, 혼자서는 절대 못 오르는 이유?","items":[{"n":1,"t":"tf","q":"Panjat Pinang takes place every January 1st.","ko":"Panjat Pinang은 매년 1월 1일에 열린다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"This game takes place every August 17th, and it was started to celebrate Indonesia’s independence from the Netherlands.","이 게임은 매년 8월 17일에 열리며, 네덜란드로부터의 인도네시아 독립을 기념하기 위해 시작되었다."]],"w":"2번에서 이 게임은 매년 8월 17일에 열린다고 함. 1월 1일이 아님.","c":"F"},"h":"2a544e2fda"},{"n":2,"t":"tf","q":"Friends and family form teams and help each other climb.","ko":"친구들과 가족들은 팀을 이루어 서로 올라가는 것을 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"They form teams and help each other climb.","그들은 팀을 이루어 서로 올라가는 것을 돕는다."]],"w":"6번 문장 그대로. 혼자서는 못 올라가니 팀을 이루어 서로 도움.","c":"T"},"h":"2fad217188"},{"n":3,"t":"tf","q":"At the top of the poles, there are only bags of sugar.","ko":"기둥의 꼭대기에는 설탕 봉지만 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"At the top of the poles, there are prizes like bicycles, electronics, and bags of sugar.","기둥의 꼭대기에는 자전거, 전자제품, 그리고 설탕 봉지와 같은 상품들이 있다."]],"w":"7번에서 꼭대기에는 자전거, 전자제품, 설탕 봉지가 있다고 함. 설탕 봉지만 있다는 말은 틀림.","c":"F"},"h":"69b09eb224"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the poles are really slippery and tall…)","ko":"…그 기둥들은 정말 ＿＿＿＿＿ 높아서…","opts":["미끄러운","부드러운","무거운","뜨거운"],"word":"slippery","r":{"a":"1) 미끄러운","ev":"4번 문장","s":[[4,"However, the poles are really slippery and tall, so it’s not possible to climb them alone.","그러나, 그 기둥들은 매우 미끄럽고 높아서, 그것들을 혼자 올라가는 것은 가능하지 않다."]],"w":"4번에서 기름을 바른 기둥(3번)이라 slippery해서 혼자 올라갈 수 없다고 함. slippery = 미끄러운.","c":1},"h":"2521b16ad5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Panjat Pinang teaches people the importance of teamwork and cooperation.)","ko":"Panjat Pinang은 사람들에게 팀워크와 ＿＿＿＿의 중요성을 가르친다.","opts":["경쟁","협동, 협력","휴식","실수"],"word":"cooperation","r":{"a":"2) 협동, 협력","ev":"5~6번, 10번 문장","s":[[5,"Friends and family need to work together.","친구들과 가족들은 함께 협력해야 한다."],[6,"They form teams and help each other climb.","그들은 팀을 이루어 서로 올라가는 것을 돕는다."],[10,"Panjat Pinang teaches people the importance of teamwork and cooperation.","Panjat Pinang은 사람들에게 팀워크와 협동의 중요성을 가르친다."]],"w":"5~6번에서 친구와 가족이 함께 work together하고 서로 돕는다고 함. 10번의 teamwork and cooperation은 함께 힘을 모으는 일. cooperation = 협동, 협력.","c":2},"h":"07d3cc2e8d"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey form teams and help each other climb.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 팀을 이루어 서로 올라가는 것을 돕는다.","opts":["상품들","기둥들","여성들과 아이들","친구들과 가족들"],"r":{"a":"4) 친구들과 가족들","ev":"5~6번 문장","s":[[5,"Friends and family need to work together.","친구들과 가족들은 함께 협력해야 한다."],[6,"They form teams and help each other climb.","그들은 팀을 이루어 서로 올라가는 것을 돕는다."]],"w":"5번에서 Friends and family가 함께 협력해야 한다고 하고, 6번 They form teams의 They는 바로 그 친구들과 가족들임.","c":4},"h":"e3733b38b3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It’s exciting to see who will get the prizes first.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"누가 상품을 먼저 얻을지 지켜보는 것은 신나는 일이다.","opts":["상품을 먼저 얻은 사람을 보는 일은 지루하다.","누가 상품을 만들었는지 알아내는 일은 신난다.","누가 상품을 먼저 얻을지 지켜보는 것은 신나는 일이다.","상품을 먼저 얻으려고 싸우는 일은 신난다."],"r":{"a":"3) 누가 상품을 먼저 얻을지 지켜보는 것은 신나는 일이다.","ev":"9번 문장","s":[[9,"It’s exciting to see who will get the prizes first.","누가 상품을 먼저 얻을지 지켜보는 것은 신나는 일이다."]],"w":"It’s exciting to see who will get the prizes first는 ‘누가 상품을 먼저 얻을지 지켜보는 것은 신난다’는 뜻. It은 가짜 주어이고 진짜 주어는 to see 이하.","c":3},"h":"d7c3fe4d1c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["여성들과 아이들이 기둥을 가장 먼저 올라간다.","이 게임은 일본으로부터의 독립을 기념하기 위해 시작되었다.","꼭대기의 상품은 과일과 꽃이다.","기둥이 너무 미끄럽고 높아서 혼자 올라가기는 불가능하다."],"opts":["Women and children climb the poles first.","The game was started to celebrate independence from Japan.","The prizes at the top are fruits and flowers.","The poles are too slippery and tall to climb alone."],"r":{"a":"4) The poles are too slippery and tall to climb alone.","ev":"2번, 4번, 7~8번 문장","s":[[2,"This game takes place every August 17th, and it was started to celebrate Indonesia’s independence from the Netherlands.","이 게임은 매년 8월 17일에 열리며, 네덜란드로부터의 인도네시아 독립을 기념하기 위해 시작되었다."],[4,"However, the poles are really slippery and tall, so it’s not possible to climb them alone.","그러나, 그 기둥들은 매우 미끄럽고 높아서, 그것들을 혼자 올라가는 것은 가능하지 않다."],[7,"At the top of the poles, there are prizes like bicycles, electronics, and bags of sugar.","기둥의 꼭대기에는 자전거, 전자제품, 그리고 설탕 봉지와 같은 상품들이 있다."],[8,"Women and children cheer for their friends and family.","여성들과 아이들은 그들의 친구들과 가족들을 응원한다."]],"w":"4번에서 기둥이 미끄럽고 높아 혼자 올라가는 것은 가능하지 않다고 함. 여성과 아이들은 응원함(8번), 독립은 네덜란드로부터(2번), 상품은 자전거 등(7번)이라 나머지는 틀림.","c":4},"h":"193acc00b1"},{"n":9,"t":"sum","q":"Because the poles are slippery and tall, people work (A) in teams, and the game teaches the importance of (B).","ko":"기둥이 미끄럽고 높아서 사람들은 팀으로 (A) 협력하고, 이 게임은 (B)의 중요성을 가르친다.","oko":["(A) 함께 / (B) 팀워크","(A) 혼자 / (B) 팀워크","(A) 함께 / (B) 경쟁","(A) 혼자 / (B) 돈","(A) 조용히 / (B) 설탕"],"opts":["(A) together / (B) teamwork","(A) alone / (B) teamwork","(A) together / (B) competition","(A) alone / (B) money","(A) quietly / (B) sugar"],"r":{"a":"1) (A) together / (B) teamwork","ev":"5~ 신 맑은 물을 사용한다’는 뜻. instead of는 ‘~ 대신에’이고 to make the designs는 ‘디자인을 만들기 위해’.","c":4},"h":"3c4335692d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Chabaixi는 몇 해 전에 중국에서 시작되었다.","Chabaixi를 만들 때 예술가들은 먼저 찻잎을 가루로 만든다.","Chabaixi의 그림은 하루 종일 남아 있다.","라테 아트는 찻잎 가루로 만든다."],"opts":["Chabaixi began in China a few years ago.","In Chabaixi, artists first turn tea leaves into powder.","The picture in Chabaixi stays for a whole day.","Latte art is made with tea powder."],"r":{"a":"2) In Chabaixi, artists first turn tea leaves into powder.","ev":"2~3번, 5번, 11번 문장","s":[[2,"It is known as “latte art.” It’s a creative way to decorate coffee using milk.","그것은 ‘라테 아트’라고 알려져 있어요. 그것은 우유를 사용해 커피를 장식하는 창의적인 방법이에요."],[3,"Interestingly, something similar was happening thousands of years ago in China!","흥미롭게도, 수천 년 전 중국에서도 비슷한 일이 일어나고 있었어요!"],[5,"It means “a hundred tricks with tea.” To make Chabaixi, artists first turned tea leaves into powder.","그것은 ‘차를 이용한 백 가지 묘기’라는 뜻이에요. Chabaixi를 만들기 위해, 예술가들은 먼저 찻잎을 가루로 만들었어요."],[11,"Although the picture disappears in just 20 minutes, that’s enough time to enjoy the beautiful designs!","비록 그 그림은 20분 만에 사라지지만, 그것은 아름다운 디자인을 즐기기에 충분한 시간이에요."]],"w":"5번에서 예술가들이 먼저 찻잎을 가루로 만든다고 함. Chabaixi는 수천 년 전(3번), 그림은 20분 만에 사라지고(11번), 라테 아트는 우유로 만듦(2번)이라 나머지는 틀림.","c":2},"h":"ec63ed27f1"},{"n":9,"t":"sum","q":"To make Chabaixi, artists mixed (A) with tea powder until it became foamy, and then used a special (B) to draw pictures.","ko":"Chabaixi를 만들기 위해 예술가들은 거품이 생길 때까지 찻잎 가루에 (A)을 섞었고, 그다음 그림을 그리려고 특별한 (B)을 사용했다.","oko":["(A) 물 / (B) 숟가락","(A) 우유 / (B) 숟가락","(A) 물 / (B) 칼","(A) 설탕 / (B) 펜","(A) 우유 / (B) 컵"],"opts":["(A) water / (B) spoon","(A) milk / (B) spoon","(A) water / (B) knife","(A) sugar / (B) pen","(A) milk / (B) cup"],"r":{"a":"1) (A) water / (B) spoon","ev":"6~7번 문장","s":[[6,"Then, they mixed water with the powder until it became foamy.","그다음에, 그들은 거품이 생길 때까지 물과 가루를 섞었어요."],[7,"After that, they used a special spoon to draw pictures, like bamboo and mountains.","그 후, 그들은 대나무와 산과 같은 그림을 그리기 위해 특별한 숟가락을 사용했어요."]],"w":"6번에서 water를 powder와 섞어 거품을 만들고, 7번에서 special spoon으로 그림을 그림. 우유는 라테 아트에 쓰는 재료임(2번).","c":1},"h":"529aaa5b1b"},{"n":10,"t":"fill","q":"Chabaixi uses clear [A] instead of milk, but the picture [B] in just 20 minutes.","ko":"Chabaixi는 우유 대신 맑은 [A]을 사용하지만, 그림은 단 20분 만에 [B].","bko":{"water":"물","disappears":"사라진다","spoon":"숟가락","bamboo":"대나무","foamy":"거품이 생기는","mountains":"산들"},"bank":["water","disappears","spoon","bamboo","foamy","mountains"],"r":{"a":"[A] water, [B] disappears","ev":"9번, 11번 문장","s":[[9,"It uses clear water instead of milk to make the designs.","그것은 디자인을 만들기 위해 우유 대신 맑은 물을 사용해요."],[11,"Although the picture disappears in just 20 minutes, that’s enough time to enjoy the beautiful designs!","비록 그 그림은 20분 만에 사라지지만, 그것은 아름다운 디자인을 즐기기에 충분한 시간이에요."]],"w":"9번 uses clear water instead of milk와 11번 the picture disappears in just 20 minutes에서 가져옴. spoon, bamboo는 7번의 그림 그리는 이야기이고, foamy는 6번의 거품 상태임.","c":null},"h":"ede499d0d1"}]},{"u":6,"id":"rg2-06-3","no":3,"ko":"식물이 팝콘처럼 톡톡 소리를 낸다고?","items":[{"n":1,"t":"tf","q":"Tomato plants made popping sounds only when they were not stressed.","ko":"토마토 식물들은 스트레스를 받지 않았을 때만 톡 하고 터지는 소리를 냈다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"When the plants were stressed — such as when their stems were cut — they made 30 to 50 popping sounds in an hour!","그 식물들이 스트레스를 받았을 때 — 예를 들어 줄기가 잘렸을 때 — 한 시간에 30에서 50번의 톡 하고 터지는 소리를 냈어요!"]],"w":"7번에서 식물들이 스트레스를 받았을 때(줄기가 잘렸을 때 등) 한 시간에 30~50번 소리를 냈다고 함. 스트레스를 받지 않았을 때만이라는 말은 반대임.","c":"F"},"h":"b235a09f7a"},{"n":2,"t":"tf","q":"Some plants can make sounds like popping popcorn.","ko":"몇몇 식물들은 톡 하고 터지는 팝콘과 같은 소리를 낼 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"Some plants have a surprising secret.","몇몇 식물들은 놀라운 비밀을 가지고 있어요."],[2,"They can actually make sounds like popping popcorn!","그것들은 사실 톡 하고 터지는 팝콘과 같은 소리를 낼 수 있어요!"]],"w":"2번 문장에서 식물들이 popping popcorn 같은 소리를 낼 수 있다고 함.","c":"T"},"h":"97b938140b"},{"n":3,"t":"tf","q":"The sounds of plants are loud, so people can usually hear them.","ko":"식물의 소리는 커서 사람들이 보통 들을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"But these sounds are very quiet, so we can’t usually hear them.","그러나 이 소리는 매우 조용해서, 우리는 보통 그것들을 들을 수 없어요."]],"w":"3번에서 이 소리들은 매우 조용해서(very quiet) 우리가 보통 들을 수 없다고 함.","c":"F"},"h":"12513ce069"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This shows that plants react to stress, just like we do.)","ko":"이는 식물들이 우리처럼 스트레스에 ＿＿＿＿＿ 것을 보여 준다.","opts":["반응하다","도망가다","잊다","끝내다"],"word":"react","r":{"a":"1) 반응하다","ev":"7~8번 문장","s":[[7,"When the plants were stressed — such as when their stems were cut — they made 30 to 50 popping sounds in an hour!","그 식물들이 스트레스를 받았을 때 — 예를 들어 줄기가 잘렸을 때 — 한 시간에 30에서 50번의 톡 하고 터지는 소리를 냈어요!"],[8,"This shows that plants react to stress, just like we do.","이는 식물들이 우리처럼 스트레스에 반응한다는 것을 보여 줘요."]],"w":"7번에서 스트레스를 받으면 소리를 더 많이 냈고, 8번에서 그것이 스트레스에 react하는 것이라고 함. react = 반응하다.","c":1},"h":"df14c1ebaa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Making sounds is just their unique way of reacting to stress.)","ko":"소리를 내는 것은 단지 스트레스에 반응하는 그들만의 ＿＿＿ 방법이다.","opts":["흔한","독특한","시끄러운","작은"],"word":"unique","r":{"a":"2) 독특한","ev":"9~10번 문장","s":[[9,"But this reaction doesn’t mean that plants communicate with each other by making sounds.","하지만 이 반응이 식물들이 소리를 내어 서로 의사소통한다는 의미는 아니에요."],[10,"Making sounds is just their unique way of reacting to stress.","소리를 내는 것은 단지 스트레스에 반응하는 그들만의 독특한 방법이에요."]],"w":"10번의 unique way는 ‘그들만의 특별한 방법’. 9번에서 서로 의사소통하는 것이 아니라 식물 나름의 반응 방법이라고 하므로 unique = 독특한.","c":2},"h":"3a1fd68201"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey studied tomato plants with special microphones that can hear the quietest sounds.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 가장 작은 소리도 들을 수 있는 특별한 마이크로 토마토 식물을 연구했어요.","opts":["토마토 식물들","마이크들","과학자들","소리들"],"r":{"a":"3) 과학자들","ev":"5~6번 문장","s":[[5,"However, scientists discovered something interesting.","하지만, 과학자들이 흥미로운 점을 발견했어요."],[6,"They studied tomato plants with special microphones that can hear the quietest sounds.","그들은 가장 작은 소리도 들을 수 있는 특별한 마이크로 토마토 식물을 연구했어요."]],"w":"5번에서 scientists(과학자들)가 흥미로운 점을 발견했다고 하고, 6번의 They가 토마토 식물을 연구한 사람들임. 연구 대상은 tomato plants.","c":3},"h":"3231f9b86e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even though you can’t hear anything, they might be shouting for help!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 여러분은 아무것도 들을 수 없지만, 그것들은 도와달라고 외치고 있을지도 몰라요!","opts":["아무것도 들을 수 없으니 식물은 도움이 필요 없다.","아무것도 들을 수 없어서 식물은 소리를 지르지 않는다.","식물이 도와달라고 외치는 소리를 우리는 분명히 듣는다.","비록 아무것도 들을 수 없어도, 식물들은 도와달라고 외치고 있을지도 모른다."],"r":{"a":"4) 비록 아무것도 들을 수 없어도, 식물들은 도와달라고 외치고 있을지도 모른다.","ev":"12번 문장","s":[[12,"Even though you can’t hear anything, they might be shouting for help!","비록 여러분은 아무것도 들을 수 없지만, 그것들은 도와달라고 외치고 있을지도 몰라요!"]],"w":"Even though는 ‘비록 ~이지만’, might be shouting for help는 ‘도와달라고 외치고 있을지도 모른다’. 우리가 듣지 못해도 식물이 신호를 보내고 있을 수 있다는 뜻.","c":4},"h":"957da39d4e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["과학자들은 특별한 마이크로 토마토 식물을 연구했다.","토마토 식물은 기분이 좋을 때만 소리를 냈다.","식물은 평소에 한 시간에 30~50번 소리를 낸다.","과학자들은 식물이 서로 대화한다는 것을 발견했다."],"opts":["Scientists studied tomato plants with special microphones.","Tomato plants made sounds only when they were happy.","Plants normally make 30 to 50 sounds every hour.","Scientists found that plants talk to each other."],"r":{"a":"1) Scientists studied tomato plants with special microphones.","ev":"4번, 6~7번, 9번 문장","s":[[4,"The plants normally make one tiny popping sound each hour.","그 식물들은 보통 한 시간에 한 번씩 아주 작은 톡 하고 터지는 소리를 내요."],[6,"They studied tomato plants with special microphones that can hear the quietest sounds.","그들은 가장 작은 소리도 들을 수 있는 특별한 마이크로 토마토 식물을 연구했어요."],[7,"When the plants were stressed — such as when their stems were cut — they made 30 to 50 popping sounds in an hour!","그 식물들이 스트레스를 받았을 때 — 예를 들어 줄기가 잘렸을 때 — 한 시간에 30에서 50번의 톡 하고 터지는 소리를 냈어요!"],[9,"But this reaction doesn’t mean that plants communicate with each other by making sounds.","하지만 이 반응이 식물들이 소리를 내어 서로 의사소통한다는 의미는 아니에요."]],"w":"6번에서 과학자들이 특별한 마이크로 토마토 식물을 연구했다고 함. 소리가 늘어난 때는 스트레스를 받았을 때(7번), 평소에는 한 시간에 1번(4번), 식물끼리 의사소통한다는 말은 아님(9번).","c":1},"h":"e87588fb1f"},{"n":9,"t":"sum","q":"Plants normally make one tiny popping sound each hour, but when they are (A), they make (B) popping sounds.","ko":"식물들은 보통 한 시간에 아주 작은 소리를 한 번 내지만, (A) 때는 (B) 소리를 낸다.","oko":["(A) 행복할 / (B) 더 적은","(A) 스트레스를 받을 / (B) 더 적은","(A) 행복할 / (B) 더 많은","(A) 졸릴 / (B) 아무","(A) 스트레스를 받을 / (B) 더 많은"],"opts":["(A) happy / (B) fewer","(A) stressed / (B) fewer","(A) happy / (B) more","(A) sleepy / (B) no","(A) stressed / (B) more"],"r":{"a":"5) (A) stressed / (B) more","ev":"4번, 7번 문장","s":[[4,"The plants normally make one tiny popping sound each hour.","그 식물들은 보통 한 시간에 한 번씩 아주 작은 톡 하고 터지는 소리를 내요."],[7,"When the plants were stressed — such as when their stems were cut — they made 30 to 50 popping sounds in an hour!","그 식물들이 스트레스를 받았을 때 — 예를 들어 줄기가 잘렸을 때 — 한 시간에 30에서 50번의 톡 하고 터지는 소리를 냈어요!"]],"w":"4번에서 평소에는 한 시간에 한 번이고, 7번에서 stressed(스트레스를 받은) 때는 30~50번이라 more(더 많은) 소리를 냄.","c":5},"h":"9bbb5863a8"},{"n":10,"t":"fill","q":"Plants [A] to stress just like we do, and making sounds is their [B] way of reacting.","ko":"식물들은 우리처럼 스트레스에 [A], 소리를 내는 것은 반응하는 그들만의 [B] 방법이다.","bko":{"react":"반응하다","unique":"독특한","communicate":"의사소통하다","hear":"듣다","shout":"외치다","stem":"줄기"},"bank":["react","unique","communicate","hear","shout","stem"],"r":{"a":"[A] react, [B] unique","ev":"8번, 10번 문장","s":[[8,"This shows that plants react to stress, just like we do.","이는 식물들이 우리처럼 스트레스에 반응한다는 것을 보여 줘요."],[10,"Making sounds is just their unique way of reacting to stress.","소리를 내는 것은 단지 스트레스에 반응하는 그들만의 독특한 방법이에요."]],"w":"8번 plants react to stress, just like we do와 10번 their unique way of reacting to stress에서 가져옴. communicate는 9번에서 아니라고 한 내용이고, hear는 우리가 하는 일이며, shout는 12번의 농담 같은 말임. stem(줄기)은 ‘그들만의 …한 방법’ 자리에 맞지 않음.","c":null},"h":"508e6da5f3"}]},{"u":7,"id":"rg2-07-1","no":1,"ko":"얼음이 녹자 집이 흔들린다? 마을이 이사 가는 이유","items":[{"n":1,"t":"tf","q":"Permafrost is a kind of soil that stays frozen all the time.","ko":"영구 동토층은 항상 얼어붙은 상태로 유지되는 토양의 한 종류이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번 문장 It’s a kind of soil that stays frozen all the time이 그대로 나옴. It은 4번의 permafrost.","c":"T","s":[[5,"It’s a kind of soil that stays frozen all the time.","그것은 항상 얼어붙은 상태로 유지되는 토양의 한 종류이다."]]},"h":"d17b13cb88"},{"n":2,"t":"tf","q":"Newtok is on the east coast of Alaska.","ko":"Newtok은 알래스카의 동해안에 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","w":"2번 문장에서 Newtok은 on the west coast(서해안)라고 함. 동해안이 아니라 서해안이라 틀림.","c":"F","s":[[2,"It is on the west coast of Alaska, U.S.","그곳은 미국 알래스카의 서해안에 있다."]]},"h":"fb08a146cb"},{"n":3,"t":"tf","q":"Houses in Newtok shake when people walk inside them.","ko":"Newtok의 집들은 사람들이 그 안에서 걸을 때 흔들린다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","w":"10번 문장 In fact, houses in Newtok shake when people walk inside them. 그대로 나옴. 영구 동토층이 녹아서 땅이 약해졌기 때문.","c":"T","s":[[10,"In fact, houses in Newtok shake when people walk inside them.","사실, Newtok의 집들은 사람들이 그 안에서 걸어 다닐 때 흔들린다."]]},"h":"972df8ebc2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is making the ice inside the permafrost melt.)","ko":"(이것이 영구 동토층 안의 얼음을 ... 만들고 있다.)","opts":["얼다","녹다","흔들리다","이사하다"],"word":"melt","r":{"ev":"8번 문장","w":"8번 문장에서 얼음(ice)이 melt하게 만든다는 내용. 따뜻해지는 날씨(7번) 때문에 얼음이 녹는 것. 얼다(freeze)는 반대 뜻.","c":2,"s":[[8,"This is making the ice inside the permafrost melt.","이것이 영구 동토층 안에 있는 얼음을 녹게 만들고 있다."]],"a":"2) 녹다"},"h":"29535c9dcb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The people of Newtok feel both sad and relieved about it.)","ko":"(Newtok의 사람들은 그것에 대해 슬프면서도 ... 느낀다.)","opts":["화난","지루한","놀란","안도하는"],"word":"relieved","r":{"ev":"12번 문장","w":"12번 문장에서 both sad and relieved. 슬프기도 하지만 위험한 집에서 벗어나 마음이 놓인다는 뜻이라 relieved = 안도하는. sad와 함께 쓰여 서로 다른 두 감정을 말함.","c":4,"s":[[12,"The people of Newtok feel both sad and relieved about it.","Newtok의 사람들은 그것에 대해 슬프면서도 안도감을 느낀다."]],"a":"4) 안도하는"},"h":"4253a9750e"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt’s a kind of soil that stays frozen all the time.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 항상 얼어붙은 상태로 유지되는 토양의 한 종류이다.","opts":["Newtok 마을","알래스카","영구 동토층","기후 변화"],"r":{"ev":"4~5번 문장","w":"4번에서 Newtok은 permafrost라고 불리는 땅 위에 있다고 함. 5번 It은 바로 앞에 나온 permafrost(영구 동토층)이고, 그것은 얼어 있는 토양.","c":3,"s":[[4,"Newtok is on land called permafrost.","Newtok은 영구 동토층이라고 불리는 땅 위에 있다."],[5,"It’s a kind of soil that stays frozen all the time.","그것은 항상 얼어붙은 상태로 유지되는 토양의 한 종류이다."]],"a":"3) 영구 동토층"},"h":"4b7f914a0b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why Newtok has to move to a safer place.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 Newtok이 더 안전한 곳으로 이사해야 하는 이유이다.","opts":["앞에서 말한 일들 때문에 Newtok은 더 안전한 곳으로 이사해야 한다.","Newtok이 더 안전한 곳이 되어서 사람들이 이사 오고 있다.","Newtok은 안전한 곳으로 이사해서 문제가 모두 해결되었다.","Newtok 사람들은 이사하고 싶어서 집을 일부러 부수었다."],"r":{"ev":"9~11번 문장","w":"That’s why는 ‘그것이 ~한 이유이다’. 앞의 원인(9~10번: 건물이 부서지고 집이 흔들림) 때문에 이사해야 한다는 결과를 말함. 문제가 해결되었다거나 집을 부쉈다는 말은 없음.","c":1,"s":[[9,"When permafrost melts, this can break buildings and roads.","영구 동토층이 녹으면, 이것은 건물과 도로를 부술 수 있다."],[10,"In fact, houses in Newtok shake when people walk inside them.","사실, Newtok의 집들은 사람들이 그 안에서 걸어 다닐 때 흔들린다."],[11,"That’s why Newtok has to move to a safer place.","그것이 Newtok이 더 안전한 곳으로 이사해야 하는 이유이다."]],"a":"1) 앞에서 말한 일들 때문에 Newtok은 더 안전한 곳으로 이사해야 한다."},"h":"cc1f84253f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Newtok은 알래스카에 있는 큰 도시이다.","Newtok의 땅은 한 번도 얼어 있었던 적이 없다.","Newtok은 기후 변화 때문에 이주하는 마지막 마을이 되었다.","영구 동토층이 녹으면 건물과 도로가 부서질 수 있다."],"opts":["Newtok is a large city in Alaska.","The ground in Newtok has never been frozen.","Newtok became the last village to move because of climate change.","When permafrost melts, buildings and roads can break."],"r":{"ev":"1번, 5번, 9번, 13번 문장","w":"9번에서 영구 동토층이 녹으면 건물과 도로를 부술 수 있다고 함. 1번 small village(작은 마을), 5번 항상 얼어 있는 땅, 13번 first villages(최초의 마을 중 하나)라서 나머지는 틀림.","c":4,"s":[[1,"Newtok is a small village in the Arctic area.","Newtok은 북극 지방의 작은 마을이다."],[5,"It’s a kind of soil that stays frozen all the time.","그것은 항상 얼어붙은 상태로 유지되는 토양의 한 종류이다."],[9,"When permafrost melts, this can break buildings and roads.","영구 동토층이 녹으면, 이것은 건물과 도로를 부술 수 있다."],[13,"Newtok became one of the first villages to move because of climate change.","Newtok은 기후 변화 때문에 이주하는 최초의 마을 중 하나가 되었다."]],"a":"4) When permafrost melts, buildings and roads can break."},"h":"23cf140680"},{"n":9,"t":"sum","q":"Because of climate change, the (A) in the permafrost is melting, so Newtok has to (B) to a safer place.","ko":"기후 변화 때문에 영구 동토층 안의 (A)이 녹고 있어서, Newtok은 더 안전한 곳으로 (B)해야 한다.","oko":["(A) 흙 / (B) 머무르다","(A) 바람 / (B) 흔들리다","(A) 얼음 / (B) 이주하다","(A) 얼음 / (B) 머무르다","(A) 도로 / (B) 이주하다"],"opts":["(A) soil / (B) stay","(A) wind / (B) shake","(A) ice / (B) move","(A) ice / (B) stay","(A) road / (B) move"],"r":{"ev":"8번, 11번 문장","w":"8번에서 영구 동토층 안의 ice가 melt하고, 11번에서 그래서 더 안전한 곳으로 move해야 한다고 함. stay(머무르다)는 반대 방향, soil·wind·road는 녹는 것이 아님.","c":3,"s":[[8,"This is making the ice inside the permafrost melt.","이것이 영구 동토층 안에 있는 얼음을 녹게 만들고 있다."],[11,"That’s why Newtok has to move to a safer place.","그것이 Newtok이 더 안전한 곳으로 이사해야 하는 이유이다."]],"a":"3) (A) ice / (B) move"},"h":"5e502d915c"},{"n":10,"t":"fill","q":"Newtok was one of the first [A] to move because of climate change, and in the [B], more places might be like it.","ko":"Newtok은 기후 변화 때문에 이주한 최초의 [A] 중 하나였고, [B]에는 더 많은 곳이 Newtok처럼 될지도 모른다.","bank":["villages","future","past","cities","roads","summer"],"bko":{"villages":"마을들","future":"미래","past":"과거","cities":"도시들","roads":"도로들","summer":"여름"},"r":{"a":"[A] villages, [B] future","ev":"13~14번 문장","w":"13번 one of the first villages(마을들) to move, 14번 more villages might be like Newtok in the future(미래에). cities(도시들)는 본문에 나오지 않고, past(과거)는 14번 in the future(미래)와 반대.","c":null,"s":[[13,"Newtok became one of the first villages to move because of climate change.","Newtok은 기후 변화 때문에 이주하는 최초의 마을 중 하나가 되었다."],[14,"Sadly, more villages might be like Newtok in the future.","안타깝게도, 미래에는 더 많은 마을들이 Newtok처럼 될지도 모른다."]]},"h":"9acf145911"}]},{"u":7,"id":"rg2-07-2","no":2,"ko":"사진으로 노래를 만든다고? 반려동물 작곡가","items":[{"n":1,"t":"tf","q":"Noam uses pet photos to create beautiful songs.","ko":"Noam은 아름다운 노래를 만들기 위해 반려동물의 사진을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장 He uses pet photos to create beautiful songs. 그대로 나옴.","c":"T","s":[[6,"He uses pet photos to create beautiful songs.","그는 아름다운 노래를 만들기 위해 반려동물의 사진을 사용한다."]]},"h":"5a16ead569"},{"n":2,"t":"tf","q":"If the pet is calm, Noam makes happy music.","ko":"반려동물이 차분하면, Noam은 행복한 음악을 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","w":"11번 문장에서 반려동물이 calm(차분한)이면 gentle music(온화한 음악)을 만든다고 함. 행복한 음악은 활발한(lively) 반려동물의 경우(10번).","c":"F","s":[[11,"If the pet is calm, he makes gentle music.","만약 반려동물이 차분하면, 그는 온화한 음악을 만든다."]]},"h":"e70a5e2bfa"},{"n":3,"t":"tf","q":"Noam learns about the pets from their owners before composing.","ko":"Noam은 작곡하기 전에 주인으로부터 반려동물에 대해 알아본다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","w":"9번 문장 Before composing, he learns about the pets from their owners. 주인에게서 알아본 뒤에 작곡함.","c":"T","s":[[9,"Before composing, he learns about the pets from their owners.","작곡을 하기 전에, 그는 주인으로부터 반려동물에 대해 알아본다."]]},"h":"53ffc7ae62"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...a project that combines the words “symphony” and “paw.”)","ko":"(... ‘symphony’와 ‘paw’라는 단어를 ... 프로젝트)","opts":["나누다","지우다","결합하다","던지다"],"word":"combines","r":{"ev":"5번 문장","w":"5번에서 Sympawnies는 symphony(교향곡)와 paw(발) 두 단어를 합쳐 만든 이름. combine = 결합하다, 합치다. 나누다는 반대 방향.","c":3,"s":[[5,"So, he started “Sympawnies,” a project that combines the words “symphony” and “paw.”","그래서 그는 ‘symphony(교향곡)’와 ‘paw(동물의 발)’라는 단어를 결합한 프로젝트인 ‘Sympawnies’를 시작했다."]],"a":"3) 결합하다"},"h":"0843010333"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If the pet is lively, he makes happy music.)","ko":"(만약 반려동물이 ...하면, 그는 행복한 음악을 만든다.)","opts":["활발한","슬픈","조용한","뚱뚱한"],"word":"lively","r":{"ev":"10번 문장","w":"10번에서 lively한 반려동물에게 happy music을 만든다고 함. 11번 calm(차분한)과 대비되므로 lively = 활발한, 명랑한.","c":1,"s":[[10,"If the pet is lively, he makes happy music.","만약 반려동물이 활발하면, 그는 행복한 음악을 만든다."]],"a":"1) 활발한"},"h":"dfbe788ec8"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nSo, he started “Sympawnies,” a project that combines the words “symphony” and “paw.”","ko":"밑줄 친 that이 가리키는 것은?","sko":"그래서 그는 ‘symphony’와 ‘paw’라는 단어를 결합한 프로젝트인 ‘Sympawnies’를 시작했다.","opts":["Noam","Sympawnies라는 프로젝트","반려동물 사진","음악 선생님"],"r":{"ev":"5번 문장","w":"that은 바로 앞의 a project를 꾸며 주는 관계대명사. 단어 symphony와 paw를 합친 것은 프로젝트(Sympawnies).","c":2,"s":[[5,"So, he started “Sympawnies,” a project that combines the words “symphony” and “paw.”","그래서 그는 ‘symphony(교향곡)’와 ‘paw(동물의 발)’라는 단어를 결합한 프로젝트인 ‘Sympawnies’를 시작했다."]],"a":"2) Sympawnies라는 프로젝트"},"h":"9b1c9abb63"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The results are fun for both the eyes and the ears.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 결과물은 눈과 귀 모두를 즐겁게 해 준다.","opts":["결과물은 눈으로 볼 때만 재미있다.","결과물은 귀로 들을 때만 재미있다.","눈과 귀가 불편한 사람들을 위한 결과물이다.","결과물은 눈으로 보는 것도, 귀로 듣는 것도 모두 즐겁다."],"r":{"ev":"7~8번 문장","w":"both A and B는 ‘A와 B 둘 다’. 7번에서 악보가 반려동물과 똑같이 생겼으니 눈이 즐겁고, 노래는 귀가 즐거움. 한쪽만 즐겁다는 선지는 both와 맞지 않음.","c":4,"s":[[7,"Surprisingly, the scores look exactly like the pets.","놀랍게도, 그 악보들은 반려동물들과 똑같이 생겼다."],[8,"The results are fun for both the eyes and the ears.","그 결과물은 눈과 귀 모두를 즐겁게 해 준다."]],"a":"4) 결과물은 눈으로 보는 것도, 귀로 듣는 것도 모두 즐겁다."},"h":"7e31f4d589"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["Noam은 노래를 만들 때 반려동물의 이름만 사용한다.","Noam은 노래를 만든 뒤에 주인에게서 반려동물에 대해 알아본다.","Noam은 활발한 반려동물에게는 온화한 음악을 만든다.","Noam은 Chubby Cat이 상냥하고 장난기가 많다고 생각했다."],"opts":["Noam uses only the names of pets to make songs.","Noam learns about the pets after he makes the songs.","For a lively pet, Noam makes gentle music.","Noam thought Chubby Cat was sweet and playful."],"r":{"ev":"6번, 9~10번, 12번 문장","w":"12번 문장에서 Chubby Cat이 sweet and playful하다고 생각했다고 함. 6번 이름이 아니라 사진, 9번 작곡 전에 주인에게서 알아봄, 10번 활발하면 행복한 음악이라서 나머지는 틀림.","c":4,"s":[[6,"He uses pet photos to create beautiful songs.","그는 아름다운 노래를 만들기 위해 반려동물의 사진을 사용한다."],[9,"Before composing, he learns about the pets from their owners.","작곡을 하기 전에, 그는 주인으로부터 반려동물에 대해 알아본다."],[10,"If the pet is lively, he makes happy music.","만약 반려동물이 활발하면, 그는 행복한 음악을 만든다."],[12,"For example, he thought a cat named Chubby Cat was sweet and playful.","예를 들어, 그는 Chubby Cat이라는 이름의 고양이가 상냥하고 장난기가 많다고 생각했다."]],"a":"4) Noam thought Chubby Cat was sweet and playful."},"h":"7220353e49"},{"n":9,"t":"sum","q":"Noam uses pet (A) to create songs, and the scores (B) exactly like the pets.","ko":"Noam은 노래를 만들기 위해 반려동물의 (A)을 사용하고, 그 악보들은 반려동물과 똑같이 (B).","oko":["(A) 이름 / (B) 소리가 난다","(A) 주인 / (B) 생겼다","(A) 사진 / (B) 생겼다","(A) 사진 / (B) 소리가 난다","(A) 노래 / (B) 느껴진다"],"opts":["(A) names / (B) sound","(A) owners / (B) look","(A) photos / (B) look","(A) photos / (B) sound","(A) songs / (B) feel"],"r":{"ev":"6~7번 문장","w":"6번 pet photos로 노래를 만들고, 7번 the scores look exactly like the pets. 악보는 ‘소리’가 아니라 ‘모양’이 반려동물과 닮은 것이라 look.","c":3,"s":[[6,"He uses pet photos to create beautiful songs.","그는 아름다운 노래를 만들기 위해 반려동물의 사진을 사용한다."],[7,"Surprisingly, the scores look exactly like the pets.","놀랍게도, 그 악보들은 반려동물들과 똑같이 생겼다."]],"a":"3) (A) photos / (B) look"},"h":"4d82f964b0"},{"n":10,"t":"fill","q":"If the pet is [A], Noam makes happy music, and if the pet is [B], he makes gentle music.","ko":"반려동물이 [A]하면 Noam은 행복한 음악을 만들고, 반려동물이 [B]하면 온화한 음악을 만든다.","bank":["lively","calm","chubby","special","sad","lost"],"bko":{"lively":"활발한","calm":"차분한","chubby":"포동포동한","special":"특별한","s
