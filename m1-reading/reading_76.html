<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M1 Reading 76</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}

.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}

.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}

button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}

.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":"Andy의 이야기","en":"I'm blind. I walks with a stick.","ko":"나는 시각 장애인이다. 나는 지팡이를 이용하여 걷는다.","ok":false,"foot":[],"fixes":[{"wrong":"walks","right":"walk","partial":false,"at":[3],"point":"일반동사의 현재형: 주어 I는 3인칭 단수가 아니므로 walk (walks 아님)","topic":"일반동사의 현재형","memo":"주어 I는 3인칭 단수가 아니므로 walk (walks 아님)"}]},{"n":2,"tag":null,"en":"One day, me homeroom teacher said, \"There will be an school event, Friendship Marathon. In these event, two people run as a team.\"","ko":"어느 날, 나의 담임 선생님께서 \"'우정 마라톤'이라는 학교 행사가 있을 거예요. 이 행사에서는 두 명이 한 팀으로 뛰게 됩니다.\"라고 말씀하셨다.","ok":false,"foot":[],"fixes":[{"wrong":"me","right":"my","partial":false,"at":[2],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 my 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 my 사용"},{"wrong":"an","right":"a","partial":false,"at":[9],"point":"관사 a/an: school은 자음 소리로 시작하므로 a 사용","topic":"관사 a/an","memo":"school은 자음 소리로 시작하므로 a 사용"},{"wrong":"these","right":"this","partial":false,"at":[15],"point":"지시형용사: 단수명사 event에는 this 사용","topic":"지시형용사","memo":"단수명사 event에는 this 사용"}]},{"n":3,"tag":null,"en":"Everyone talk about it. I also got interesting.","ko":"모든 사람들이 그것에 대해 이야기했다. 나도 관심이 생겼다.","ok":false,"foot":[],"fixes":[{"wrong":"talk","right":"talked","partial":false,"at":[1],"point":"일반동사의 과거형: 과거 이야기이므로 talked 사용","topic":"일반동사의 과거형","memo":"과거 이야기이므로 talked 사용"},{"wrong":"interesting","right":"interested","partial":false,"at":[7],"point":"분사형용사: '흥미를 느끼는'은 interested 사용","topic":"분사형용사","memo":"'흥미를 느끼는'은 interested 사용"}]},{"n":4,"tag":null,"en":"\"But can I run?\" I were not sure.","ko":"\"하지만 내가 뛸 수 있을까?\" 나는 확신할 수 없었다.","ok":false,"foot":[],"fixes":[{"wrong":"were","right":"was","partial":false,"at":[5],"point":"be동사의 과거형: 주어 I에는 was 사용","topic":"be동사의 과거형","memo":"주어 I에는 was 사용"}]},{"n":5,"tag":null,"en":"So I talked about it with my most good friend, Junha. He said, \"Don't worry!","ko":"그래서 나는 그것에 대해 나의 가장 친한 친구 준하와 이야기했다. 그는 \"걱정하지마!","ok":false,"foot":[],"fixes":[{"wrong":"most good","right":"best","partial":false,"at":[7],"point":"최상급: good의 최상급은 best 사용","topic":"최상급","memo":"good의 최상급은 best 사용"}]},{"n":6,"tag":null,"en":"I'll run with you.\"","ko":"내가 너와 함께 뛸 거야.\"라고 말했다.","ok":true,"foot":[],"fixes":[]},{"n":7,"tag":null,"en":"On the day of the marathon, we tied an string around our fingers to feeling each other's movement.","ko":"마라톤 날에, 우리는 서로의 움직임을 느끼기 위해 우리의 손가락에 끈을 묶었다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[8],"point":"관사 a/an: string은 자음 소리로 시작하므로 a 사용","topic":"관사 a/an","memo":"string은 자음 소리로 시작하므로 a 사용"},{"wrong":"feeling","right":"feel","partial":false,"at":[14],"point":"to부정사: to 뒤에는 동사원형 feel 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 feel 사용"}]},{"n":8,"tag":null,"en":"I listened to him very careful and ran with him. The wind was blowing through me and it felt greatly!","ko":"나는 그의 말을 매우 주의 깊게 들었고 그와 함께 뛰었다. 바람이 내게 불어오고 있었는데 그 느낌이 정말 좋았다.","ok":false,"foot":[],"fixes":[{"wrong":"careful","right":"carefully","partial":false,"at":[5],"point":"형용사와 부사: 동사 listened를 꾸미는 부사 carefully 사용","topic":"형용사와 부사","memo":"동사 listened를 꾸미는 부사 carefully 사용"},{"wrong":"greatly","right":"great","partial":false,"at":[19],"point":"형용사와 부사: felt 뒤 보어 자리에는 형용사 great 사용","topic":"형용사와 부사","memo":"felt 뒤 보어 자리에는 형용사 great 사용"}]},{"n":9,"tag":null,"en":"At the finish line, everyone cheered for us. I was proud in myself.","ko":"결승선에서, 모든 사람들이 우리를 응원했다. 나는 내 자신이 자랑스러웠다.","ok":false,"foot":[],"fixes":[{"wrong":"in","right":"of","partial":false,"at":[11],"point":"기본전치사: '~이 자랑스러운'은 proud of 사용","topic":"기본전치사","memo":"'~이 자랑스러운'은 proud of 사용"}]},{"n":10,"tag":null,"en":"Before the marathon, I thought that I couldn't do it. But now, I want to try another things.","ko":"마라톤 전에, 나는 그것을 할 수 없다고 생각했다. 그러나 지금, 나는 다른 것들을 해 보고 싶다.","ok":false,"foot":[],"fixes":[{"wrong":"another","right":"other","partial":false,"at":[16],"point":"수량 형용사: 복수명사 things 앞에는 other 사용","topic":"수량 형용사","memo":"복수명사 things 앞에는 other 사용"}]},{"n":11,"tag":null,"en":"I think that I can tries a bike ride next time!","ko":"나는 다음번에는 자전거 타기를 해 볼 수 있다고 생각한다.","ok":false,"foot":[],"fixes":[{"wrong":"tries","right":"try","partial":false,"at":[5],"point":"조동사 뒤 동사원형: 조동사 can 뒤에는 동사원형: try (tries 아님)","topic":"조동사 뒤 동사원형","memo":"조동사 can 뒤에는 동사원형: try (tries 아님)"}]},{"n":12,"tag":"준하의 이야기","en":"Andy and I signed up of Friendship Marathon. I was his guide runner.","ko":"Andy와 나는 '우정 마라톤'에 등록했다. 나는 그의 가이드 러너였다.","ok":false,"foot":[],"fixes":[{"wrong":"of","right":"for","partial":false,"at":[5],"point":"기본전치사: '~에 등록하다'는 sign up for 사용","topic":"기본전치사","memo":"'~에 등록하다'는 sign up for 사용"}]},{"n":13,"tag":null,"en":"We runned together every day with a string. I told him, \"Andy, a bike are coming.","ko":"우리는 끈을 이용하여 매일 함께 뛰었다. 나는 \"Andy, 자전거가 오고 있어.","ok":false,"foot":[],"fixes":[{"wrong":"runned","right":"ran","partial":false,"at":[1],"point":"불규칙 과거형: run의 과거형은 ran (runned 아님)","topic":"불규칙 과거형","memo":"run의 과거형은 ran (runned 아님)"},{"wrong":"are","right":"is","partial":false,"at":[14],"point":"be동사의 현재형: 주어 a bike는 단수: is (are 아님)","topic":"be동사의 현재형","memo":"주어 a bike는 단수: is (are 아님)"}]},{"n":14,"tag":null,"en":"So let's moving to the right.\" As a team, we practiced hard to win the marathon.","ko":"그러니까 오른쪽으로 움직이자.\"라고 그에게 말했다. 한 팀으로서, 우리는 마라톤에서 우승하기 위해 열심히 연습했다.","ok":false,"foot":[],"fixes":[{"wrong":"moving","right":"move","partial":false,"at":[2],"point":"청유문: Let's 뒤에는 동사원형 move 사용","topic":"청유문","memo":"Let's 뒤에는 동사원형 move 사용"}]},{"n":15,"tag":null,"en":"During the marathon, I ran with Andy and guided him in the same time. It was hard, but we didn't stop running.","ko":"마라톤 동안, 나는 Andy와 함께 뛰면서 동시에 그를 안내했다. 그것은 힘들었지만, 우리는 뛰는 것을 멈추지 않았다.","ok":false,"foot":[],"fixes":[{"wrong":"in","right":"at","partial":false,"at":[10],"point":"기본전치사: '동시에'는 at the same time 사용","topic":"기본전치사","memo":"'동시에'는 at the same time 사용"}]},{"n":16,"tag":null,"en":"At last, we made it to the finish line! We didn't won the race.","ko":"마침내, 우리는 결승선에 도착했다! 우리는 그 경주에서 우승하지 못했다. e day of the marathon, we tied a string around our fingers to feel each other's movement. I listened to him very carefully and ran with him. The wind was blowing through me and it felt great! At the finish line, everyone cheered for us. I was proud of myself.","Before the marathon, I thought that I couldn't do it. But now, I want to try other things. I think that I can try a bike ride next time!","Junha's Story","Andy and I signed up for Friendship Marathon. I was his guide runner. We ran together every day with a string. I told him, \"Andy, a bike is coming. So let's move to the right.\" As a team, we practiced hard to win the marathon.","During the marathon, I ran with Andy and guided him at the same time. It was hard, but we didn't stop running. At last, we made it to the finish line! We didn't win the race. But I knew that we did our best.","Finishing something was not easy for me. But this time I did it! I was very happy. Andy looked happy, too."];var PASS_KO=["트러스트 스트링(믿음의 끈)","Andy의 이야기","나는 시각 장애인이다. 나는 지팡이를 이용하여 걷는다. 어느 날, 나의 담임 선생님께서 \"'우정 마라톤'이라는 학교 행사가 있을 거예요. 이 행사에서는 두 명이 한 팀으로 뛰게 됩니다.\"라고 말씀하셨다. 모든 사람들이 그것에 대해 이야기했다. 나도 관심이 생겼다. \"하지만 내가 뛸 수 있을까?\" 나는 확신할 수 없었다. 그래서 나는 그것에 대해 나의 가장 친한 친구 준하와 이야기했다. 그는 \"걱정하지마! 내가 너와 함께 뛸 거야.\"라고 말했다.","마라톤 날에, 우리는 서로의 움직임을 느끼기 위해 우리의 손가락에 끈을 묶었다. 나는 그의 말을 매우 주의 깊게 들었고 그와 함께 뛰었다. 바람이 내게 불어오고 있었는데 그 느낌이 정말 좋았다. 결승선에서, 모든 사람들이 우리를 응원했다. 나는 내 자신이 자랑스러웠다.","마라톤 전에, 나는 그것을 할 수 없다고 생각했다. 그러나 지금, 나는 다른 것들을 해 보고 싶다. 나는 다음번에는 자전거 타기를 해 볼 수 있다고 생각한다.","준하의 이야기","Andy와 나는 '우정 마라톤'에 등록했다. 나는 그의 가이드 러너였다. 우리는 끈을 이용하여 매일 함께 뛰었다. 나는 \"Andy, 자전거가 오고 있어. 그러니까 오른쪽으로 움직이자.\"라고 그에게 말했다. 한 팀으로서, 우리는 마라톤에서 우승하기 위해 열심히 연습했다.","마라톤 동안, 나는 Andy와 함께 뛰면서 동시에 그를 안내했다. 그것은 힘들었지만, 우리는 뛰는 것을 멈추지 않았다. 마침내, 우리는 결승선에 도착했다! 우리는 그 경주에서 우승하지 못했다. 하지만 나는 우리가 최선을 다했다는 것을 알았다.","무언가를 끝내는 것은 나에게 쉽지 않았다. 그러나 이번에는 나는 해냈다! 나는 매우 행복했다. Andy도 행복해 보였다."];var DG=[{"qs":[{"n":1,"q":"What did the man do at a nursing home?","o":["스마트폰으로 어르신들 사진 찍어 드리기","어르신들께 스마트폰 사용법 알 렸어.)에서 남자가 주말에 양로원에서 한 봉사 활동이 대화의 주제이다."],"memo":["주제: 남자가 주말에 양로원에서 한 봉사 활동","근거: I went to a nursing home and helped out.(나는 양로원에 가서 도와드렸어.)","함정: 학교 동아리(①)나 조부모 방문 계획(④)은 나오지 않는다."],"why":"남자가 주말에 양로원에서 봉사한 이야기이다."}],"dlg":[["W","How was your weekend?","주말은 어땠니?"],["M","Good. I went to a nursing home and helped out.","좋았어. 나는 양로원에 가서 도와드렸어."],["W","What did you do?","무엇을 했니?"],["M","They couldn't use smartphones well. So I taught them.","그분들은 스마트폰을 잘 사용하지 못하셨어. 그래서 내가 가르쳐 드렸어."]]},{"qs":[{"n":3,"q":"윗글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["leave - bring","join - sell","join - bring","visit - bring","join - wash"],"a":2,"ans":"join - bring","evs":[["Our club is going to send clothes and food to help others. Do you want to join us?","우리 동아리는 다른 사람들을 돕기 위해 옷과 음식을 보낼 거야. 너도 함께할래?"],["Yes, of course. I can bring some clothes, too.","응, 물론이지. 나도 옷을 좀 가져올 수 있어."]],"ev":["Our club is going to send clothes and food to help others. Do you want to join us?","우리 동아리는 다른 사람들을 돕기 위해 옷과 음식을 보낼 거야. 너도 함께할래?"],"ow":["오답 ✕ — 'Do you want to join us?'(너도 함께할래?)라고 했으므로 leave(떠나다)가 아니라 join이다. bring은 맞다.","오답 ✕ — join은 맞지만 Lena는 'I can bring some clothes, too.'(나도 옷을 좀 가져올 수 있어.)라고 했으므로 옷을 파는(sell) 것이 아니다.","정답 ○ — 'Do you want to join us?'(너도 함께할래?)에서 (A)는 join이고, 'I can bring some clothes, too.'(나도 옷을 좀 가져올 수 있어.)에서 (B)는 bring이다.","오답 ✕ — bring은 맞지만 동아리를 '방문'하라는 말은 없고 'join us'(우리와 함께하다)이다.","오답 ✕ — join은 맞지만 옷을 씻는(wash) 이야기는 없다. Lena는 옷을 가져올 수 있다고 했다."],"memo":["(A) join, (B) bring","근거: Yes, of course. I can bring some clothes, too.(응, 물론이지. 나도 옷을 좀 가져올 수 있어.)","함정: sell, wash, leave는 대화에 나오지 않는다."],"why":"Dylan이 동아리에 함께하자고 했고 Lena는 옷을 가져오겠다고 했다.","sum":"Dylan asks Lena to (A) his club, and Lena says she can (B) some clothes.","lab":"완성된 요약문 : "}],"dlg":[["M","Can you help me, Lena?","도와줄 수 있니, Lena?"],["W","Sure, Dylan. What is it?","물론이지, Dylan. 뭔데?"],["M","Our club is going to send clothes and food to help others. Do you want to join us?","우리 동아리는 다른 사람들을 돕기 위해 옷과 음식을 보낼 거야. 너도 함께할래?"],["W","Yes, of course. I can bring some clothes, too.","응, 물론이지. 나도 옷을 좀 가져올 수 있어."],["M","Oh, great! Thank you.","오, 좋아! 고마워."]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["남자는 여자의 휴일에 대해 묻는다.","여자의 사촌은 속초에 살고 있다.","여자는 휴일에 해변에 갔다.","해변에는 눈이 덮여 있었다.","여자는 해변이 아름답다고 생각했다."],"a":1,"ans":"여자의 사촌은 속초에 살고 있다.","evs":[["Yes. I visited my uncle in Sokcho.","응. 속초에 있는 삼촌을 방문했어."]],"ev":["Yes. I visited my uncle in Sokcho.","응. 속초에 있는 삼촌을 방문했어."],"ow":["오답 ✕ — 남자가 'Did you have a good holiday?'(휴일 잘 보냈니?)라고 물으므로 여자의 휴일에 대해 묻는다. 일치한다.","정답 ○ — 여자는 'I visited my uncle in Sokcho.'(속초에 있는 삼촌을 방문했어.)라고 했다. 속초에 사는 사람은 사촌이 아니라 삼촌이므로 일치하지 않는다.","오답 ✕ — 'We went to the beach.'(우리는 해변에 갔어.)이므로 해변에 갔다. 일치한다.","오답 ✕ — 'The snowy beach'(눈 덮인 해변)라고 했으므로 일치한다.","오답 ✕ — 'The snowy beach was so beautiful.'(눈 덮인 해변이 정말 아름다웠어.)이므로 일치한다."],"memo":["속초에 사는 사람은 사촌이 아니라 삼촌이다.","근거: I visited my uncle in Sokcho.(속초에 있는 삼촌을 방문했어.)","함정: uncle(삼촌)과 cousin(사촌)을 바꿔 놓은 보기이다."],"why":"속초에는 삼촌이 살고 있으므로 ②가 불일치."},{"n":5,"q":"윗글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["cousin - sunny","friend - snowy","uncle - sunny","uncle - snowy","cousin - snowy"],"a":3,"ans":"uncle - snowy","evs":[["Yes. I visited my uncle in Sokcho.","응. 속초에 있는 삼촌을 방문했어."],["We went to the beach. The snowy beach was so beautiful.","우리는 해변에 갔어. 눈 덮인 해변이 정말 아름다웠어."]],"ev":["Yes. I visited my uncle in Sokcho.","응. 속초에 있는 삼촌을 방문했어."],"ow":["오답 ✕ — 속초에서 만난 사람은 cousin(사촌)이 아니라 'my uncle'(삼촌)이고, 해변은 sunny(화창한)가 아니라 'snowy'(눈 덮인)이다.","오답 ✕ — snowy는 맞지만 'I visited my uncle in Sokcho.'(속초에 있는 삼촌을 방문했어.)에서 방문한 사람은 친구가 아니라 삼촌이다.","오답 ✕ — uncle은 맞지만 'The snowy beach'(눈 덮인 해변)라고 했으므로 sunny가 아니다.","정답 ○ — 'I visited my uncle in Sokcho.'(속초에 있는 삼촌을 방문했어.)와 'The snowy beach was so beautiful.'(눈 덮인 해변이 정말 아름다웠어.)에서 (A) uncle, (B) snowy이다.","오답 ✕ — snowy는 맞지만 방문한 사람은 사촌이 아니라 삼촌이다."],"memo":["(A) uncle, (B) snowy","근거: The snowy beach was so beautiful.(눈 덮인 해변이 정말 아름다웠어.)","함정: cousin(사촌)·sunny(화창한)는 본문에 없다."],"why":"속초의 삼촌을 방문했고 눈 덮인 해변이 아름다웠다.","sum":"The woman visited her (A) in Sokcho and thought the (B) beach was beautiful.","lab":"완성된 요약문 : "}],"dlg":[["M","Did you have a good holiday?","휴일 잘 보냈니?"],["W","Yes. I visited my uncle in Sokcho.","응. 속초에 있는 삼촌을 방문했어."],["M","Sounds great. What did you do there?","좋았겠다. 거기서 뭘 했니?"],["W","We went to the beach. The snowy beach was so beautiful.","우리는 해변에 갔어. 눈 덮인 해변이 정말 아름다웠어."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 내용과 일치하는 것은?","o":["나는 지팡이 없이 걸을 수 있다.","많은 학생들은 우정 마라톤에 관심이 없었다.","준하는 나와 함께 뛰겠다고 했다.","나는 달릴 때, 준하의 말을 귀담아 듣지 않았다.","나는 다른 것들을 시도하고 싶지 않아졌다."],"a":2,"ans":"준하는 나와 함께 뛰겠다고 했다.","evs":[["I'll run with you.\"","내가 너와 함께 뛸 거야.\"라고 말했다."],["I walk with a stick.","나는 지팡이를 이용하여 걷는다."],["Everyone talked about it.","모든 사람들이 그것에 대해 이야기했다."]],"ev":["I'll run with you.\"","내가 너와 함께 뛸 거야.\"라고 말했다."],"ow":["오답 ✕ — 'I walk with a stick.'(나는 지팡이를 이용하여 걷는다.)이라고 했으므로 지팡이 없이 걷는 것이 아니다.","오답 ✕ — 'Everyone talked about it.'(모든 사람들이 그것에 대해 이야기했다.)이므로 많은 학생들이 관심을 가졌다.","정답 ○ — 준하가 'Don't worry! I'll run with you.'(걱정하지마! 내가 너와 함께 뛸 거야.)라고 했으므로 준하는 Andy와 함께 뛰겠다고 했다.","오답 ✕ — 'I listened to him very carefully and ran with him.'(나는 그의 말을 매우 주의 깊게 들었고 그와 함께 뛰었다.)이므로 준하의 말을 귀담아 들었다.","오답 ✕ — 'But now, I want to try other things.'(그러나 지금, 나는 다른 것들을 해 보고 싶다.)이므로 새로운 것을 시도하고 싶어졌다."],"memo":["준하는 Andy와 함께 뛰겠다고 말했다.","근거: Don't worry! I'll run with you.(걱정하지마! 내가 너와 함께 뛸 거야.)","함정: Andy는 준하의 말을 '주의 깊게 들었다'(④ ✕)."],"why":"준하가 함께 뛰겠다고 약속했다."},{"n":7,"q":"윗글의 주제로 알맞은 것은?","o":["마라톤에서 우승하는 방법","학교 운동회의 다양한 활동","친구의 도움으로 해낸 도전","Andy의 훈련 비법과 달리기 연습","자연 속을 달리며 느낀 시원한 바람"],"a":2,"ans":"친구의 도움으로 해낸 도전","evs":[["I'll run with you.\"","내가 너와 함께 뛸 거야.\"라고 말했다."],["Before the marathon, I thought that I couldn't do it.","마라톤 전에, 나는 그것을 할 수 없다고 생각했다."],["But now, I want to try other things.","그러나 지금, 나는 다른 것들을 해 보고 싶다."]],"ev":["I'll run with you.\"","내가 너와 함께 뛸 거야.\"라고 말했다."],"ow":["오답 ✕ — Andy의 이야기에는 우승하는 방법이 나오지 않는다. 핵심은 우승이 아니라 'I'll run with you.'(내가 너와 함께 뛸 거야.)라는 친구의 도움으로 해낸 경험이다.","오답 ✕ — 학교 행사로 Friendship Marathon 하나가 나올 뿐, 운동회의 다양한 활동은 나오지 않는다.","정답 ○ — Andy는 'Before the marathon, I thought that I couldn't do it.'(마라톤 전에, 나는 그것을 할 수 없다고 생각했다.)고 했지만 준하와 함께 뛰고 'I was proud of myself.'(나는 내 자신이 자랑스러웠다.)라고 말한다. 친구의 도움으로 도전을 해낸 이야기이다.","오답 ✕ — Andy가 훈련 비법을 말하지 않는다. 연습 이야기는 준하의 이야기에 나오며 비법이 아니다.","오답 ✕ — 'The wind was blowing through me and it felt great!'(바람이 내게 불어오고 있었는데 그 느낌이 정말 좋았다.)는 일부 장면일 뿐 글 전체의 주제는 아니다."],"memo":["주제: 친구의 도움으로 해낸 도전","근거: Before the marathon, I thought that I couldn't do it. … I was proud of myself.(마라톤 전에 나는 할 수 없다고 생각했다 … 나는 내 자신이 자랑스러웠다.)","함정: 시원한 바람(⑤)은 일부 장면이다."],"why":"Andy가 친구 준하와 함께 마라톤을 해내며 자신감을 얻었다."},{"n":8,"q":"윗글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["could - stop","could - try","couldn't - try","couldn't - avoid","couldn't - forget"],"a":2,"ans":"couldn't - try","evs":[["Before the marathon, I thought that I couldn't do it.","마라톤 전에, 나는 그것을 할 수 없다고 생각했다."],["But now, I want to try other things.","그러나 지금, 나는 다른 것들을 해 보고 싶다."]],"ev":["Before the marathon, I thought that I couldn't do it.","마라톤 전에, 나는 그것을 할 수 없다고 생각했다."],"ow":["오답 ✕ — 'Before the marathon, I thought that I couldn't do it.'(마라톤 전에, 나는 그것을 할 수 없다고 생각했다.)이므로 could가 아니라 couldn't이고, 지금은 stop이 아니라 try이다.","오답 ✕ — try는 맞지만 마라톤 전에는 할 수 있다고 생각한 것이 아니라 'I couldn't do it.'이라고 생각했다.","정답 ○ — 'I thought that I couldn't do it.'(나는 그것을 할 수 없다고 생각했다.)와 'But now, I want to try other things.'(그러나 지금, 나는 다른 것들을 해 보고 싶다.)에서 (A) couldn't, (B) try이다.","오답 ✕ — couldn't는 맞지만 'I want to try other things.'라고 했으므로 avoid(피하다)가 아니다.","오답 ✕ — couldn't는 맞지만 다른 것을 잊고(forget) 싶다는 말은 없고 해 보고 싶다고 했다."],"memo":["(A) couldn't, (B) try","근거: But now, I want to try other things.(그러나 지금, 나는 다른 것들을 해 보고 싶다.)","함정: 마라톤 전과 후의 생각이 반대로 바뀐 것이 핵심이다."],"why":"Andy는 할 수 없다고 생각했지만 이제 다른 것도 해 보고 싶다.","sum":"Before the marathon, Andy thought he (A) do it, but now he wants to (B) other things.","lab":"완성된 요약문 : "}],"pp":[["Andy's Story","Andy의 이야기"],["I'm blind.","나는 시각 장애인이다."],["I walk with a stick.","나는 지팡이를 이용하여 걷는다."],["One day, my homeroom teacher said, \"There will be a school event, Friendship Marathon.","어느 날, 나의 담임 선생님께서 \"'우정 마라톤'이라는 학교 행사가 있을 거예요."],["In this event, two people run as a team.\"","이 행사에서는 두 명이 한 팀으로 뛰게 됩니다.\"라고 말씀하셨다."],["Everyone talked about it.","모든 사람들이 그것에 대해 이야기했다."],["I also got interested.","나도 관심이 생겼다."],["\"But can I run?\"","\"하지만 내가 뛸 수 있을까?\""],["I was not sure.","나는 확신할 수 없었다."],["So I talked about it with my best friend, Junha.","그래서 나는 그것에 대해 나의 가장 친한 친구 준하와 이야기했다."],["He said, \"Don't worry!","그는 \"걱정하지마!"],["I'll run with you.\"","내가 너와 함께 뛸 거야.\"라고 말했다."],["On the day of the marathon, we tied a string around our fingers to feel each other's movement.","마라톤 날에, 우리는 서로의 움직임을 느끼기 위해 우리의 손가락에 끈을 묶었다."],["I listened to him very carefully and ran with him.","나는 그의 말을 매우 주의 깊게 들었고 그와 함께 뛰었다."],["The wind was blowing through me and it felt great!","바람이 내게 불어오고 있었는데 그 느낌이 정말 좋았다."],["At the finish line, everyone cheered for us.","결승선에서, 모든 사람들이 우리를 응원했다."],["I was proud of myself.","나는 내 자신이 자랑스러웠다."],["Before the marathon, I thought that I couldn't do it.","마라톤 전에, 나는 그것을 할 수 없다고 생각했다."],["But now, I want to try other things.","그러나 지금, 나는 다른 것들을 해 보고 싶다."],["I think that I can try a bike ride next time!","나는 다음번에는 자전거 타기를 해 볼 수 있다고 생각한다."]]},{"qs":[{"n":9,"q":"윗글의 제목으로 알맞은 것은?","o":["Bike Riding with Andy","The Job of a Guide Runner","Our Daily Running Schedule","Running Together as a Team","Simple Exercises for Teenagers"],"a":3,"ans":"Running Together as a Team","evs":[["I was his guide runner.","나는 그의 가이드 러너였다."],["We ran together every day with a string.","우리는 끈을 이용하여 매일 함께 뛰었다."],["As a team, we practiced hard to win the marathon.","한 팀으로서, 우리는 마라톤에서 우승하기 위해 열심히 연습했다."],["At last, we made it to the finish line!","마침내, 우리는 결승선에 도착했다!"]],"ev":["I was his guide runner.","나는 그의 가이드 러너였다."],"ow":["오답 ✕ — 'a bike is coming'(자전거가 오고 있어)은 달리기 중 위험을 알려 주는 말이다. 자전거 타기는 A var secs=[],cur=null;
D.forEach(function(it,i){if(it.tag||!cur){cur={name:it.tag||'',items:[]};secs.push(cur)}cur.items.push(i)});
var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,lead+f.right+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}

  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}

 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}

function ppHtml(pp,lock){

 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';

function dlgHtml(d,lock){

 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m1-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m1-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});

 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m1-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m1-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m1-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m1-st',JSON.stringify(st));localStorage.setItem('m1-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m1-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
