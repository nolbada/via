lunteers go into the [B] and give out the bags to homeless people.","ko":"그 모든 과정이 [A] 후, 자원봉사자들은 [B](으)로 가서 노숙자들에게 침낭을 나눠준다.","bank":["completed","streets","example","padding","jackets","volunteers"],"bko":{"completed":"끝난(complete의 과거분사)","streets":"거리","example":"예","padding":"충전재","jackets":"재킷들","volunteers":"자원봉사자들"},"r":{"a":"[A] completed (끝난(complete의 과거분사)), [B] streets (거리)","ev":"10번 문장","s":[[10,"After the whole process is completed, the volunteers go into the streets and give out the bags to homeless people.","그 모든 과정이 끝나면, 자원봉사자들은 거리로 가서 노숙자들에게 그 침낭들을 나눠준다."]],"w":"7번에서 봉지를 뜨거운 비눗물에 soaked(담근다), 9번에서 충전재를 침낭 inside(안에) 넣어요. volunteers, garbage, example, nonprofit은 빈칸의 문법과 의미에 맞지 않아요.","c":null},"h":"431850f0b0"}]},{"u":2,"id":"rj4-02-2","no":2,"ko":"함께 해변을 즐겨요","items":[{"n":1,"t":"tf","q":"The chair is managed by remote control.","ko":"그 의자는 리모컨으로 조작된다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The chair is managed by remote control.","그 의자는 리모컨에 의해 조작된다."]],"w":"6번 문장에서 의자는 리모컨(remote control)에 의해 조작된다고 해요.","c":"T"},"h":"c9b68acac8"},{"n":2,"t":"tf","q":"The system has been mainly funded by tourists.","ko":"그 장치는 주로 관광객들에 의해 자금이 지원되어 왔다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"The system has been mainly funded by the Greek government and the EU.","그 장치는 주로 그리스 정부와 유럽 연합에 의해 자금이 지원되어 왔다."]],"w":"11번 문장에서 주로 그리스 정부와 유럽 연합이 자금을 지원했다고 해요. 관광객이 아니에요.","c":"F"},"h":"c70a2e28eb"},{"n":3,"t":"tf","q":"People have to pay to use the Seatrac service in Greece.","ko":"사람들은 그리스에서 Seatrac 서비스를 이용하려면 돈을 내야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"People can use the Seatrac service for free in Greece.","사람들은 그리스에서 Seatrac 서비스를 무료로 이용할 수 있다."]],"w":"10번 문장에서 Seatrac 서비스를 무료로(for free) 이용할 수 있다고 해요.","c":"F"},"h":"ee9fe22c9a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It carries the user into the sea safely and smoothly.)","ko":"그것은 사용자를 안전하고 ( ) 바다로 나른다.","opts":["시끄럽게","부드럽게","위험하게","힘들게"],"word":"smoothly","r":{"a":"2) 부드럽게","ev":"4번 문장","s":[[4,"It carries the user into the sea safely and smoothly.","그것은 사용자를 안전하고 부드럽게 바다로 나른다."]],"w":"4번에서 Seatrac이 사용자를 안전하고(safely) 부드럽게 바다로 나른다고 해요. safely와 함께 나온 smoothly는 '부드럽게'라는 뜻이에요.","c":2},"h":"79de83d99a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Seatrac looks like a chair attached to a long track that stretches into the water.)","ko":"Seatrac은 물 속으로 ( ) 긴 트랙에 부착된 의자처럼 보인다.","opts":["뻗어 있는","부서지는","녹아내리는","멈춰 서는"],"word":"stretches","r":{"a":"1) 뻗어 있는","ev":"3번 문장","s":[[3,"Seatrac looks like a chair attached to a long track that stretches into the water.","Seatrac은 물 속으로 뻗어 있는 긴 트랙에 부착된 의자처럼 보인다."]],"w":"3번에서 의자가 붙어 있는 긴 트랙이 물 속으로 이어져 있어요. 그래야 사용자를 바다까지 나를 수 있으므로 stretch = 뻗어 있다예요.","c":1},"h":"1532be9f9c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nUsers can use the remote control to operate the chair and move it along the track.","ko":"밑줄 친 it이 가리키는 것은?","sko":"사용자들은 의자를 가동해서 그것을 트랙에 따라 이동시키기 위해 리모컨을 사용할 수 있다.","opts":["리모컨","트랙","의자","바닷물"],"r":{"a":"3) 의자","ev":"7번 문장","s":[[7,"Users can use the remote control to operate the chair and move it along the track.","사용자들은 의자를 가동해서 그것을 트랙에 따라 이동시키기 위해 리모컨을 사용할 수 있다."]],"w":"7번에서 리모컨으로 the chair를 가동하고, and move it으로 이어져요. 트랙을 따라 움직이는 것은 의자예요.","c":3},"h":"09ba91464a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The hope is that everyone can access Greece’s beautiful beaches without any difficulties.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"바람은 모든 사람들이 아무 어려움 없이 그리스의 아름다운 해변에 접근하는 것이다.","opts":["모든 사람이 아무 어려움 없이 그리스의 아름다운 해변에 갈 수 있기를 바란다.","그리스의 해변에 아무도 접근하지 못하게 하기를 바란다.","어려움 없이 새로운 해변을 만들기를 바란다.","장애가 있는 사람들만 해변을 이용하기를 바란다."],"r":{"a":"1) 모든 사람이 아무 어려움 없이 그리스의 아름다운 해변에 갈 수 있기를 바란다.","ev":"12번 문장","s":[[12,"The hope is that everyone can access Greece’s beautiful beaches without any difficulties.","바람은 모든 사람들이 아무 어려움 없이 그리스의 아름다운 해변에 접근하는 것이다."]],"w":"The hope is that ~은 '바람은 ~이다'예요. everyone can access ~ without any difficulties는 모든 사람이 어려움 없이 접근하는 것을 뜻해요.","c":1},"h":"8e95aa6217"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Seatrac은 사용자를 배에 태워 바다로 데려간다.","Seatrac은 어린이만 사용할 수 있다.","Seatrac은 여러 종류의 전력이 필요하다.","Seatrac은 걷는 데 어려움이 있는 임신부와 노인에게 이상적이다."],"opts":["Seatrac takes users to the sea on a boat.","Seatrac can be used only by young children.","Seatrac needs several kinds of power.","Seatrac is ideal for pregnant women and the elderly who have trouble walking."],"r":{"a":"4) Seatrac is ideal for pregnant women and the elderly who have trouble walking. (Seatrac은 걷는 데 어려움이 있는 임신부와 노인에게 이상적이다.)","ev":"3번, 5번, 8~9번 문장","s":[[3,"Seatrac looks like a chair attached to a long track that stretches into the water.","Seatrac은 물 속으로 뻗어 있는 긴 트랙에 부착된 의자처럼 보인다."],[5,"The system is ideal for people who have trouble walking, including pregnant women and the elderly.","그 장치는 임신부와 노인을 포함하여, 걷는 데 어려움이 있는 사람들에게 이상적이다."],[8,"The system is powered entirely by solar energy.","그 장치는 전적으로 태양 에너지에 의해 작동된다."],[9,"It does not need any other form of power.","그것은 다른 형태의 전력을 필요로 하지 않는다."]],"w":"11번에서 주로 그리스 정부와 유럽 연합이 자금을 지원했다고 해요. 사용자는 트랙을 따라 바다로 가고(3번), 걷기 어려운 사람들이 대상이며(5번), 다른 형태의 전력이 필요 없어요(9번).","c":4},"h":"7e5478f44f"},{"n":9,"t":"sum","q":"Visiting the beach can be (A) for people with trouble walking, so Greece developed Seatrac, a new (B) for them to reach the sea.","ko":"걷는 데 어려움이 있는 사람들에게 해변을 방문하는 것은 (A) 일일 수 있어서, 그리스는 그들이 바다에 닿는 새로운 (B)인 Seatrac을 개발했다.","oko":["(A) 쉬운 / (B) 방법","(A) 힘든 / (B) 게임","(A) 지루한 / (B) 메뉴","(A) 힘든 / (B) 취미","(A) 힘든 / (B) 방법"],"opts":["(A) easy / (B) way","(A) tough / (B) game","(A) boring / (B) menu","(A) tough / (B) hobby","(A) tough / (B) way"],"r":{"a":"5) (A) tough / (B) way","ev":"1~2번 문장","s":[[1,"For people who have difficulty walking, visiting a beach can be tough.","걷는 데 어려움을 겪는 사람들에게 해변을 방문하는 것은 힘들 수도 있다."],[2,"Thankfully, Greece has developed a new way for disabled people to access the sea—Seatrac.","다행스럽게도, 그리스는 장애가 있는 사람들이 바다에 접근하는 새로운 방법인 Seatrac을 개발했다."]],"w":"1번에서 걷기 어려운 사람들에게 해변 방문은 tough(힘든)할 수 있어요. 2번에서 그리스가 바다에 접근하는 새로운 방법(a new way)인 Seatrac을 개발했어요.","c":5},"h":"98683dfc6a"},{"n":10,"t":"fill","q":"The Seatrac system is powered entirely by [A] energy, so it does not need any other [B] of power.","ko":"Seatrac 장치는 전적으로 [A] 에너지로 작동되어서, 다른 형태의 전력을 필요로 하지 않는다.","bank":["solar","form","chair","track","pregnant","elderly"],"bko":{"solar":"태양의","form":"형태","chair":"의자","track":"트랙","pregnant":"임신한","elderly":"연세가 드신"},"r":{"a":"[A] solar, [B] form","ev":"8~9번 문장","s":[[8,"The system is powered entirely by solar energy.","그 장치는 전적으로 태양 에너지에 의해 작동된다."],[9,"It does not need any other form of power.","그것은 다른 형태의 전력을 필요로 하지 않는다."]],"w":"8번에서 Seatrac은 전적으로 solar energy(태양 에너지)로 작동하고, 9번에서 any other form of power(다른 형태의 전력)는 필요 없다고 해요. chair, track, pregnant, elderly는 빈칸에 문법과 의미가 맞지 않아요.","c":null},"h":"ffc4f2070b"}]},{"u":2,"id":"rj4-02-3","no":3,"ko":"웃고 우는 책","items":[{"n":1,"t":"tf","q":"Readers can borrow human books and have conversations with them.","ko":"독자는 인간 책을 빌려서 그들과 대화할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Readers can “borrow” human books and have conversations with them.","독자는 인간 책을 ‘빌려서’ 그들과 대화할 수 있다."]],"w":"8번 문장에서 독자는 인간 책을 ‘빌릴’ 수 있고 그들과 대화할 수 있다고 해요.","c":"T"},"h":"5f1c26c4ad"},{"n":2,"t":"tf","q":"People who visit human libraries to learn are called human books.","ko":"배우기 위해 인간 도서관을 방문하는 사람들은 인간 책이라고 불린다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"People who visit human libraries to learn are called “readers.”","배우기 위해 인간 도서관을 방문하는 사람들은 ‘독자’라고 불린다."]],"w":"7번 문장에서 배우기 위해 방문하는 사람들은 readers(독자)라고 불려요. human book은 전문가를 부르는 말이에요(6번).","c":"F"},"h":"2557eb30c9"},{"n":3,"t":"tf","q":"Each expert is called a human book.","ko":"각 전문가는 ‘인간 책’이라고 불린다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Each expert is called a “human book.”","각 전문가는 ‘인간 책’이라고 불린다."]],"w":"6번 문장에서 각 전문가를 human book이라고 부른다고 해요.","c":"T"},"h":"dc1daea84e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Why not talk directly to a vegetarian at a human library?)","ko":"인간 도서관에서 채식주의자와 ( ) 이야기해보는 것이 어떤가?","opts":["천천히","몰래","직접","크게"],"word":"directly","r":{"a":"3) 직접","ev":"4번 문장","s":[[4,"Why not talk directly to a vegetarian at a human library?","인간 도서관에서 채식주의자와 직접 이야기해 보는 것이 어떤가?"]],"w":"4번에서 인터넷이나 도서관 책 대신 채식주의자와 바로 이야기해 보자고 해요. 중간을 거치지 않으므로 directly = 직접이에요.","c":3},"h":"e947ac1fb5"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Human books can share their real life experiences with their own voices, and readers can ask any specific questions they have.)","ko":"인간 책들은 그들의 실제 삶의 경험을 그들 자신의 목소리로 공유할 수 있고, 독자들은 그들이 가진 어떤 ( ) 질문이든 할 수 있다.","opts":["구체적인","어려운","웃긴","쓸모없는"],"word":"specific","r":{"a":"1) 구체적인","ev":"10번 문장","s":[[10,"Human books can share their real life experiences with their own voices, and readers can ask any specific questions they have.","인간 책들은 그들의 실제 삶의 경험을 그들 자신의 목소리로 공유할 수 있고, 독자들은 그들이 가진 어떤 구체적인 질문이든 할 수 있다."]],"w":"10번에서 독자는 궁금한 점을 자세히 물어볼 수 있어요. 막연한 질문이 아니라 콕 집어 묻는 질문이므로 specific = 구체적인이에요.","c":1},"h":"fea43779ce"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nAlso, human libraries encourage understanding between people who would not normally meet. It is hoped that this will reduce problems caused by prejudice and stereotypes.","ko":"밑줄 친 this가 가리키는 것은?","sko":"또한, 인간 도서관은 보통은 만나지 않을 사람들 간의 이해를 장려한다. 이것이 편견과 고정 관념에 의해 야기된 문제들을 줄일 것이라 희망된다.","opts":["독자들이 숙제를 하는 것","채식주의자가 도서관을 방문하는 것","독자가 질문을 하는 것","인간 도서관이 사람들 간의 이해를 장려하는 것"],"r":{"a":"4) 인간 도서관이 사람들 간의 이해를 장려하는 것","ev":"11~12번 문장","s":[[11,"Also, human libraries encourage understanding between people who would not normally meet.","또한, 인간 도서관은 보통은 만나지 않을 사람들 간의 이해를 장려한다."],[12,"It is hoped that this will reduce problems caused by prejudice and stereotypes.","이것이 편견과 고정 관념에 의해 야기된 문제들을 줄일 것이라 희망된다."]],"w":"12번의 this는 바로 앞 11번 내용을 가리켜요. 인간 도서관이 보통 만나지 않을 사람들 사이의 이해를 장려하는 것이 편견 문제를 줄일 거라는 뜻이에요.","c":4},"pron":"this","h":"085589f99b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Human libraries, sometimes referred to as ‘living libraries,’ give people the chance to learn about topics from living experts.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"때때로 ‘살아 있는 도서관’이라고 불리는 인간 도서관은 사람들에게 살아 있는 전문가들로부터 주제들에 관해 배울 기회를 제공한다.","opts":["인간 도서관은 살아 있는 동물들을 구경하는 도서관이다.","인간 도서관은 ‘살아 있는 도서관’이라고도 불리며, 살아 있는 전문가에게서 배울 기회를 준다.","인간 도서관은 돌아가신 전문가들의 책을 모아 놓은 도서관이다.","인간 도서관은 전문가가 되는 방법을 책으로만 알려 주는 곳이다."],"r":{"a":"2) 인간 도서관은 ‘살아 있는 도서관’이라고도 불리며, 살아 있는 전문가에게서 배울 기회를 준다.","ev":"5번 문장","s":[[5,"Human libraries, sometimes referred to as “living libraries,” give people the chance to learn about topics from living experts.","때때로 ‘살아 있는 도서관’이라고 불리는 인간 도서관은 사람들에게 살아 있는 전문가들로부터 주제들에 관해 배울 기회를 제공한다."]],"w":"sometimes referred to as ‘living libraries’는 ‘살아 있는 도서관’이라고도 불린다는 뜻이에요. give people the chance to learn은 배울 기회를 준다는 뜻이고, from living experts는 살아 있는 전문가에게서예요.","c":2},"h":"a6ab273f4c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["독자들을 human book이라고 부른다.","인간 도서관은 채식주의를 공부하는 사람만 이용할 수 있다.","이 글은 독자에게 채식주의에 관한 과제를 낸다고 상상해 보라고 한다.","인간 도서관은 편견과 고정 관념으로 인한 문제를 더 심하게 만든다."],"opts":["Readers are called human books.","Human libraries are only for people who study vegetarianism.","The passage asks the reader to imagine homework about vegetarianism.","Human libraries make problems caused by prejudice and stereotypes worse."],"r":{"a":"3) The passage asks the reader to imagine homework about vegetarianism. (이 글은 독자에게 채식주의에 관한 과제를 낸다고 상상해 보라고 한다.)","ev":"1번, 4번, 7번, 12번 문장","s":[[1,"Imagine your teacher gives you homework about vegetarianism.","당신의 선생님이 당신에게 채식주의에 관한 과제를 낸다고 상상해 봐라."],[4,"Why not talk directly to a vegetarian at a human library?","인간 도서관에서 채식주의자와 직접 이야기해 보는 것이 어떤가?"],[7,"People who visit human libraries to learn are called “readers.”","배우기 위해 인간 도서관을 방문하는 사람들은 ‘독자’라고 불린다."],[12,"It is hoped that this will reduce problems caused by prejudice and stereotypes.","이것이 편견과 고정 관념에 의해 야기된 문제들을 줄일 것이라 희망된다."]],"w":"10번에서 인간 책들은 자기 목소리로 실제 삶의 경험을 공유할 수 있다고 해요. 독자는 readers이고(7번), 채식주의는 과제의 예일 뿐이며(1~4번), 인간 도서관은 편견 문제를 줄이길 바라요(12번).","c":3},"h":"27a246285d"},{"n":9,"t":"sum","q":"To get (B) about a topic, you could (A) it on the Internet or visit a library.","ko":"주제에 관한 (B)을(를) 얻기 위해, 당신은 인터넷에서 그것을 (A) 방법을 쓰거나 도서관을 방문할 수 있다.","oko":["(A) 무시하는 / (B) 과제","(A) 조사하는 / (B) 과제","(A) 무시하는 / (B) 정보","(A) 조사하는 / (B) 정보","(A) 잊는 / (B) 고정 관념"],"opts":["(A) ignore / (B) homework","(A) research / (B) homework","(A) ignore / (B) information","(A) research / (B) information","(A) forget / (B) stereotypes"],"r":{"a":"4) (A) research / (B) information (조사하는 / 정보)","ev":"2번 문장","s":[[2,"You could research the topic on the Internet or visit a library to find information.","당신은 정보를 찾기 위해 인터넷에서 그 주제에 대해 조사하거나 도서관을 방문할 수 있다."]],"w":"8번에서 독자는 인간 책을 borrow(빌려서) 대화할 수 있고, 9번에서 인간 도서관의 목적은 사람들이 서로에게서 learn(배우도록) 돕는 거예요.","c":4},"h":"b6af1a955b"},{"n":10,"t":"fill","q":"The [A] of human libraries is to help people learn from one another through direct [B].","ko":"인간 도서관의 [A]은(는) 사람들이 중간 과정 없이 이루어지는 [B]을(를) 통해 서로에게서 배우도록 돕는 것이다.","bank":["purpose","communication","borrow","prejudice","living","expert"],"bko":{"purpose":"목적","communication":"의사소통","borrow":"빌리다","living":"살아 있는","expert":"전문가","prejudice":"편견"},"r":{"a":"[A] purpose (목적), [B] communication (의사소통)","ev":"9번 문장","s":[[9,"The purpose of human libraries is to help people learn from one another through direct communication.","인간 도서관의 목적은 사람들이 직접적인 의사소통을 통해 서로에게서 배우도록 돕는 것이다."]],"w":"11번에서 인간 도서관은 사람들 사이의 understanding(이해)을 장려하고, 12번에서 그것이 편견·고정 관념 문제를 reduce(줄이길) 바란다고 해요. borrow, expert, voice, library는 빈칸에 의미가 맞지 않아요.","c":null},"h":"9241f68bd0"}]},{"u":2,"id":"rj4-02-4","no":4,"ko":"아기가 자고 있어요!","items":[{"n":1,"t":"tf","q":"Babies in Denmark sometimes sleep in strollers in front of shops.","ko":"덴마크의 아기들은 때때로 가게 앞의 유모차에서 잠을 잔다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"The babies inside them are sleeping in front of shops even when the weather is cold!","유모차 안에 있는 아기들은 날씨가 추울 때도 가게 앞에서 잠을 자고 있다!"]],"w":"2번 문장에서 유모차 안의 아기들이 날씨가 추울 때도 가게 앞에서 자고 있다고 해요.","c":"T"},"h":"20bc8d92a8"},{"n":2,"t":"tf","q":"People in Denmark tend to use small strollers.","ko":"덴마크 사람들은 작은 유모차를 사용하는 경향이 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"People in Denmark tend to use large strollers.","덴마크 사람들은 큰 유모차를 사용하는 경향이 있다."]],"w":"7번 문장에서 덴마크 사람들은 large strollers(큰 유모차)를 사용하는 경향이 있다고 해요.","c":"F"},"h":"6135db09e9"},{"n":3,"t":"tf","q":"Some parents use a thermometer to make sure it is not too cold in the stroller.","ko":"어떤 부모들은 유모차 안이 너무 춥지 않은지 확인하기 위해 온도계를 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Some parents use a thermometer to make sure it’s not too cold in the stroller.","어떤 부모들은 유모차 안이 너무 춥지 않은지 확인하기 위해 온도계를 사용한다."]],"w":"11번 문장에서 어떤 부모들은 유모차 안이 너무 춥지 않은지 확인하려고 온도계를 쓴다고 해요.","c":"T"},"h":"76183df9c8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In Denmark, people frequently leave napping infants outdoors.)","ko":"덴마크에서 사람들은 낮잠을 자는 아기들을 ( ) 야외에 둔다.","opts":["드물게","갑자기","자주","몰래"],"word":"frequently","r":{"a":"3) 자주","ev":"3번 문장","s":[[3,"In Denmark, people frequently leave napping infants outdoors.","덴마크에서 사람들은 낮잠을 자는 아기들을 자주 야외에 둔다."]],"w":"3번에서 덴마크에서는 아기를 밖에서 재우는 일이 흔하고, 이어지는 문장들에서도 그 이유를 설명해요. 그래서 frequently = 자주예요.","c":3},"h":"c86d40ecd2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They believe it helps babies to get used to cold weather, which is essential in northern countries.)","ko":"그들은 그것이 아기들이 추운 날씨에 적응하는 데 도움을 준다고 믿는데, 그것은 북부 국가들에서 ( )이다.","opts":["필수적인","위험한","불필요한","낯선"],"word":"essential","r":{"a":"1) 필수적인","ev":"4번 문장","s":[[4,"They believe it helps babies to get used to cold weather, which is essential in northern countries.","그들은 그것이 아기들이 추운 날씨에 적응하는 데 도움을 준다고 믿는데, 그것은 북부 국가들에서 필수적이다."]],"w":"4번에서 북부 국가는 날씨가 추워서 추위에 적응하는 것이 꼭 필요하다는 말이에요. 그래서 essential = 필수적인이에요.","c":1},"h":"93011abe97"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey also think that breathing fresh outdoor air can strengthen the babies’ immune systems, reducing illness and supporting healthy lungs.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 또한 신선한 외부 공기를 마시는 것이 아기들의 면역 체계를 강화시켜, 병을 줄이고 건강한 폐를 지원한다고 생각한다.","opts":["덴마크 사람들","아기들","유모차들","신선한 외부 공기"],"r":{"a":"1) 덴마크 사람들","ev":"3~5번 문장","s":[[3,"In Denmark, people frequently leave napping infants outdoors.","덴마크에서 사람들은 낮잠을 자는 아기들을 자주 야외에 둔다."],[4,"They believe it helps babies to get used to cold weather, which is essential in northern countries.","그들은 그것이 아기들이 추운 날씨에 적응하는 데 도움을 준다고 믿는데, 그것은 북부 국가들에서 필수적이다."],[5,"They also think that breathing fresh outdoor air can strengthen the babies’ immune systems, reducing illness and supporting healthy lungs.","그들은 또한 신선한 외부 공기를 마시는 것이 아기들의 면역 체계를 강화시켜, 병을 줄이고 건강한 폐를 지원한다고 생각한다."]],"w":"7번에서 덴마크 사람들이 large strollers를 쓴다고 하고, 8번 They는 그 유모차들을 가리켜요. 오래된 건물에 잘 맞지 않는 것은 큰 유모차예요.","c":1,"k":"They = 덴마크 사람들"},"pron":"They","h":"380b0f0e9e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The babies may look unsafe, but don’t worry!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아기들이 위험해 보일 수 있지만, 걱정하지 말아라!","opts":["아기들이 안전해 보이지만 걱정해야 한다.","아기들이 위험하니 당장 집으로 데려와야 한다.","아기들이 즐거워 보이지만 곧 울 것이다.","아기들이 위험해 보일 수 있지만 걱정하지 않아도 된다."],"r":{"a":"4) 아기들이 위험해 보일 수 있지만 걱정하지 않아도 된다.","ev":"10~12번 문장","s":[[10,"The babies may look unsafe, but don’t worry!","아기들이 위험해 보일 수 있지만, 걱정하지 말아라!"],[11,"Some parents use a thermometer to make sure it’s not too cold in the stroller.","어떤 부모들은 유모차 안이 너무 춥지 않은지 확인하기 위해 온도계를 사용한다."],[12,"Others use a monitor to keep constant watch over the baby.","다른 부모들은 아기를 계속 지키기 위해 감시 장치를 사용한다."]],"w":"may look unsafe는 위험해 보일 수 있다는 뜻이고, but don’t worry는 걱정하지 말라는 뜻이에요. 11~12번에서 부모들이 온도계와 감시 장치로 아기를 챙긴다고 하며 이유를 알려 줘요.","c":4},"h":"f8be3d0a8b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["덴마크 사람들은 찬 공기가 아기들을 아프게 한다고 생각한다.","덴마크에서는 날씨가 따뜻할 때만 아기를 밖에 둔다.","덴마크의 어떤 부모들은 아기를 계속 지키기 위해 감시 장치를 사용한다.","덴마크 부모들은 아기와 함께 유모차를 가게 안에 들여놓는다."],"opts":["Danish people think the cold air makes babies sick.","Babies in Denmark are left outside only when the weather is warm.","Some Danish parents use a monitor to keep constant watch over the baby.","Danish parents put the strollers inside shops with the babies."],"r":{"a":"3) Some Danish parents use a monitor to keep constant watch over the baby.","ev":"2번, 4~5번, 9번, 12번 문장","s":[[2,"The babies inside them are sleeping in front of shops even when the weather is cold!","유모차 안에 있는 아기들은 날씨가 추울 때도 가게 앞에서 잠을 자고 있다!"],[4,"They believe it helps babies to get used to cold weather, which is essential in northern countries.","그들은 그것이 아기들이 추운 날씨에 적응하는 데 도움을 준다고 믿는데, 그것은 북부 국가들에서 필수적이다."],[5,"They also think that breathing fresh outdoor air can strengthen the babies’ immune systems, reducing illness and supporting healthy lungs.","그들은 또한 신선한 외부 공기를 마시는 것이 아기들의 면역 체계를 강화시켜, 병을 줄이고 건강한 폐를 지원한다고 생각한다."],[9,"So, maybe the practice is just to avoid the difficulty of bringing strollers indoors.","그래서 아마도 그 관행은 단지 유모차를 실내로 가져오는 것의 어려움을 피하기 위한 것일지도 모른다."],[12,"Others use a monitor to keep constant watch over the baby.","다른 부모들은 아기를 계속 지키기 위해 감시 장치를 사용한다."]],"w":"12번에서 다른 부모들은 아기를 계속 지키기 위해 monitor(감시 장치)를 쓴다고 해요. 덴마크 사람들은 큰 유모차를 쓰고(7~8번), 날씨가 추울 때도 밖에 두며(2번), 신선한 공기가 면역 체계를 강화한다고 생각해요(5번).","c":3},"h":"274e3b4708"},{"n":9,"t":"sum","q":"When you walk around the streets of Denmark, you may (A) strollers outside, and there may be another (B) for this.","ko":"덴마크의 거리를 돌아다니면 밖에서 유모차를 (A) 수 있고, 이것에 대한 또 다른 (B)이(가) 있을 수도 있다.","oko":["(A) 알아차릴 / (B) 가격","(A) 무시할 / (B) 이유","(A) 씻을 / (B) 가격","(A) 알아차릴 / (B) 이유","(A) 씻을 / (B) 이유"],"opts":["(A) notice / (B) price","(A) ignore / (B) reason","(A) wash / (B) price","(A) notice / (B) reason","(A) wash / (B) reason"],"r":{"a":"4) (A) notice / (B) reason (알아차릴 / 이유)","ev":"1번, 6번 문장","s":[[1,"When you walk around the streets of Denmark, you may notice strollers outside.","당신은 덴마크의 거리를 돌아다닐 때, 밖에서 유모차를 볼 수도 있다."],[6,"However, there may be another reason for this.","그러나, 이것에 대한 또 다른 이유가 있을지도 모른다."]],"w":"4번에서 밖에서 재우면 아기들이 cold weather에 적응하도록 돕는다고 믿고, 5번에서 신선한 공기가 면역 체계를 strengthen(강화)한다고 생각해요.","c":4},"h":"a58209af41"},{"n":10,"t":"fill","q":"They do not [A] easily in buildings that were constructed 80 to 100 years ago. So, maybe the practice is just to avoid the difficulty of bringing strollers [B].","ko":"그것들은 80년에서 100년 전에 지어진 건물에는 잘 [A]지 않는다. 그래서 아마도 그 관행은 단지 유모차를 [B] 가져오는 것의 어려움을 피하기 위한 것일지도 모른다.","bank":["fit","indoors","thermometer","lungs","northern","illness"],"bko":{"fit":"맞다","indoors":"실내로","thermometer":"온도계","lungs":"폐","northern":"북쪽의","illness":"병"},"r":{"a":"[A] fit (맞다), [B] indoors (실내로)","ev":"8~9번 문장","s":[[8,"They do not fit easily in buildings that were constructed 80 to 100 years ago.","그것들은 80년에서 100년 전에 지어진 건물에는 잘 맞지 않는다."],[9,"So, maybe the practice is just to avoid the difficulty of bringing strollers indoors.","그래서 아마도 그 관행은 단지 유모차를 실내로 가져오는 것의 어려움을 피하기 위한 것일지도 모른다."]],"w":"8번에서 큰 유모차는 오래된 건물에 잘 fit하지 않는다고 하고, 9번에서 유모차를 indoors(실내로) 가져오는 어려움을 피하려는 것일지도 모른다고 해요. thermometer, lungs, northern, illness는 빈칸에 의미가 맞지 않아요.","c":null},"h":"b86af56312"}]},{"u":3,"id":"rj4-03-1","no":1,"ko":"일곱 개의 돌을 맞혀라!","items":[{"n":1,"t":"tf","q":"If a team fails to knock the pile down, the other team gets a chance to throw the ball.","ko":"한 팀이 더미를 쓰러뜨리지 못하면, 다른 팀이 공을 던질 기회를 얻는다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"If the team fails to knock the pile down, then the opposing team gets a chance to throw a ball at the pile.","만약 그 팀이 더미를 쓰러뜨리지 못한다면, 그 이후 상대 팀이 더미를 향해 공을 던질 기회를 얻는다."]],"w":"5번 문장에서 더미를 쓰러뜨리지 못하면(fails to knock the pile down) 상대 팀이 공을 던질 기회를 얻는다고 해요. 그대로 같은 내용이에요.","c":"T"},"h":"44a2d0092e"},{"n":2,"t":"tf","q":"The defending team tries to hit the players of the attacking team above the knees.","ko":"공격을 막는 쪽 팀은 공격팀 선수들의 무릎 위를 맞히려고 한다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"While they are doing this, the defending team tries to hit any player of the attacking team below the knees with the ball.","그들이 이렇게 하는 동안, 수비팀은 공격팀의 어떤 선수든 공으로 무릎 아래를 맞히려고 한다."]],"w":"7번 문장에서 수비팀이 맞히려는 곳은 무릎 아래(below the knees)예요. 무릎 위라고 한 것이 틀렸어요.","c":"F"},"h":"f516d77d05"},{"n":3,"t":"tf","q":"Players on the defending team can pass the ball to their teammates, but they cannot run with it.","ko":"공격을 막는 쪽 팀 선수들은 팀 동료에게 공을 넘겨줄 수는 있지만, 공을 가지고 뛸 수는 없다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"They may not run with the ball, but they can pass it to their teammates.","그들은 공을 가지고 뛸 수는 없지만, 팀 동료들에게 공을 넘겨줄 수는 있다."]],"w":"8번 문장에서 공을 가지고 뛰는 것은 안 되고(may not run with the ball), 팀 동료에게 넘겨주는 것은 된다(can pass it)고 해요.","c":"T"},"h":"1fec5707e3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But if they succeed, they become the attacking team, and they must stack the stones.)","ko":"하지만 그들이 성공한다면, 그들은 공격팀이 되고, 돌을 ( ) 한다.","opts":["던지다","쌓다","숨기다","세다"],"word":"stack","r":{"a":"2) 쌓다","ev":"6번 문장","s":[[6,"But if they succeed, they become the attacking team, and they must stack the stones.","하지만 그들이 성공한다면, 그들은 공격팀이 되고, 그다음 돌을 쌓아야 한다."]],"w":"6번에서 성공하면 공격팀이 되어 돌을 'stack' 해야 해요. 9번에서 돌을 성공적으로 stack하면 점수를 얻으니, stack은 돌을 쌓는다는 뜻이에요. 던지는 것은 공이에요.","c":2},"h":"23a4a7a895"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (While they are doing this, the defending team tries to hit any player of the attacking team below the knees with the ball.)","ko":"그들이 이렇게 하는 동안, ( ) 팀은 공격팀의 어떤 선수든 공으로 무릎 아래를 맞히려고 한다.","opts":["공격하는","응원하는","수비하는","심판 보는"],"word":"defending","r":{"a":"3) 수비하는","ev":"7번, 10번 문장","s":[[7,"While they are doing this, the defending team tries to hit any player of the attacking team below the knees with the ball.","그들이 이렇게 하는 동안, 수비팀은 공격팀의 어떤 선수든 공으로 무릎 아래를 맞히려고 한다."],[10,"But if the defending team hits any of the attacking team’s players, the teams switch roles.","하지만 수비팀이 공격팀의 어떤 선수든 맞힌다면, 팀들은 역할을 바꾼다."]],"w":"공격팀(attacking team)이 돌을 쌓는 동안 상대 팀은 공으로 맞히려 해요. 이 팀이 defending team, 즉 수비하는 팀이에요. 10번에서 수비팀이 공격팀 선수를 맞히면 역할이 바뀌어요.","c":3},"h":"19a0b2385c"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt is played by two teams with a rubber ball and a pile of seven flat stones.","ko":"밑줄 친 \"It\"이 가리키는 것은?","sko":"그것은 고무공과 납작한 7개의 돌 더미를 이용하여 두 팀에 의해 진행된다.","opts":["라고리 놀이","고무공","납작한 돌","두 팀"],"r":{"a":"1) 라고리 놀이","ev":"1~2번 문장","s":[[1,"Lagori, also known as seven stones, is a traditional Indian game.","seven stones라고도 알려진 lagori는 인도의 전통 놀이이다."],[2,"It is played by two teams with a rubber ball and a pile of seven flat stones.","그것은 고무공과 납작한 7개의 돌 더미를 이용하여 두 팀에 의해 진행된다."]],"w":"7번의 While they are doing this에서 they는 돌을 쌓고 있는 팀이에요. 6번에서 성공한 팀이 공격팀이 되어 돌을 쌓아야 한다고 했어요. 수비팀은 쉼표 뒤의 the defending team이라 따로 나와요.","c":1,"k":"It = 라고리 놀이"},"pron":"It","h":"04a0936179"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Each player gets three chances to knock it down.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"각 선수는 그것을 쓰러뜨릴 세 번의 기회를 얻는다.","opts":["각 선수는 더미를 세 번 쓰러뜨려야 한다.","각 선수는 더미를 쓰러뜨릴 기회가 세 번 있다.","세 명의 선수가 더미를 함께 쓰러뜨린다.","각 선수는 공을 세 개씩 받는다."],"r":{"a":"2) 각 선수는 더미를 쓰러뜨릴 기회가 세 번 있다.","ev":"4번 문장","s":[[4,"Each player gets three chances to knock it down.","각 선수는 그것을 쓰러뜨릴 세 번의 기회를 얻는다."]],"w":"three chances to knock it down은 '그것을 쓰러뜨릴 세 번의 기회'예요. 세 번 모두 쓰러뜨려야 하는 것이 아니라, 기회가 세 번 주어진다는 뜻이에요.","c":2},"h":"31238f6cd5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["두 팀의 선수들이 동시에 더미를 향해 공을 던진다.","한 팀의 선수들은 더미를 향해 공을 던져야 한다.","선수들은 공을 가지고 뛸 수 있지만 팀 동료에게 공을 넘길 수는 없다.","각 선수는 더미를 쓰러뜨릴 기회를 다섯 번 얻는다."],"opts":["The players of both teams throw a ball at the pile at the same time.","The players of one team must throw a ball at the pile.","Players can run with the ball but cannot pass it to teammates.","Each player gets five chances to knock the pile down."],"r":{"a":"2) The players of one team must throw a ball at the pile. (한 팀의 선수들은 더미를 향해 공을 던져야 한다.)","ev":"3번 문장","s":[[3,"The players of one team must throw a ball at the pile.","한 팀의 선수들은 더미를 향해 공을 던져야 한다."]],"w":"3번 문장에서 한 팀의 선수들이 더미를 향해 공을 던져야 한다(must throw a ball at the pile)고 해요. 두 팀이 동시에 던진다는 말은 없어요.","c":2,"k":null},"h":"60d0832b03"},{"n":9,"t":"sum","q":"Lagori, which is also (A) as seven stones, is a (B) Indian game.","ko":"seven stones라고도 (A) lagori는 인도의 (B) 놀이이다.","oko":["(A) 알려진 / (B) 현대적인","(A) 숨겨진 / (B) 전통적인","(A) 알려진 / (B) 전통적인","(A) 숨겨진 / (B) 현대적인","(A) 놀아진 / (B) 현대적인"],"opts":["(A) known / (B) modern","(A) hidden / (B) traditional","(A) known / (B) traditional","(A) hidden / (B) modern","(A) played / (B) modern"],"r":{"a":"3) (A) known / (B) traditional (알려진 / 전통적인)","ev":"1번 문장","s":[[1,"Lagori, also known as seven stones, is a traditional Indian game.","seven stones라고도 알려진 lagori는 인도의 전통 놀이이다."]],"w":"1번 문장에서 lagori는 seven stones라고도 알려진(known) 인도의 전통적인(traditional) 놀이라고 해요.","c":3},"h":"667fd53dcc"},{"n":10,"t":"fill","q":"But if the defending team hits any of the attacking team’s players, the teams [A] [B].","ko":"하지만 상대 팀이 공격팀의 어떤 선수든 맞힌다면, 팀들은 [B]을(를) [A].","bank":["switch","roles","pile","flat","successfully","rubber"],"bko":{"switch":"바꾸다","roles":"역할","flat":"납작한","successfully":"성공적으로","rubber":"고무","pile":"더미"},"r":{"a":"[A] switch (바꾸다), [B] roles (역할)","ev":"10번 문장","s":[[10,"But if the defending team hits any of the attacking team’s players, the teams switch roles.","하지만 수비팀이 공격팀의 어떤 선수든 맞힌다면, 팀들은 역할을 바꾼다."]],"w":"9번에서 공격팀이 성공적으로 stack(쌓다)하면 점수를 얻고, 10번에서 수비팀이 공격팀 선수를 hit(맞히다)하면 역할이 바뀌어요. point, knees는 명사라서 동사 자리에 맞지 않고, runs, fails는 돌을 쌓거나 선수를 맞히는 뜻이 아니에요.","c":null},"h":"ed426b2f0c"}]},{"u":3,"id":"rj4-03-2","no":2,"ko":"이 정도는 돼야 고수지!","items":[{"n":1,"t":"tf","q":"The writer says that winning a grand slam is better than simply winning.","ko":"글쓴이는 그랜드 슬램을 얻는 것이 그냥 이기는 것보다 더 좋다고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"But do you know what is better than winning?","그런데 무엇이 이기는 것보다 더 좋은지 당신은 알고 있는가?"],[3,"Winning a grand slam!","그랜드 슬램을 얻는 것이다!"]],"w":"2번에서 무엇이 이기는 것보다 더 좋은지 묻고(better than winning), 3번에서 Winning a grand slam이라고 답해요. 그대로 같은 내용이에요.","c":"T"},"h":"b2a422ba37"},{"n":2,"t":"tf","q":"A sports reporter first used the term when a golfer won four major events.","ko":"한 스포츠 기자는 골프 선수가 네 개의 주요 대회를 이겼을 때 처음 그 용어를 사용했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"A sports reporter first used the term when a tennis player won the four major tennis events.","한 테니스 선수가 네 개의 주요 테니스 대회를 이겼을 때 한 스포츠 기자가 처음 그 용어를 사용했다."]],"w":"5번에서 기자가 처음 그 말을 쓴 때는 테니스 선수가 네 개의 주요 테니스 대회를 이겼을 때예요. 골프 선수가 아니에요.","c":"F"},"h":"584a1b0a36"},{"n":3,"t":"tf","q":"The term is also used in track and field, figure skating, and mountain climbing.","ko":"그 용어는 육상 경기, 피겨 스케이팅, 등산에서도 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"The term is also used in many other sports, such as track and field, figure skating, and mountain climbing.","그 용어는 또한 육상 경기와 피겨 스케이팅, 등산과 같은 많은 다른 스포츠에서도 사용된다."]],"w":"9번 문장에 육상 경기(track and field), 피겨 스케이팅, 등산이 그대로 나와요.","c":"T"},"h":"4ad3dc64e4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For example, a golfer achieves a grand slam when he or she wins all of the major golf championships.)","ko":"예를 들어, 골프 선수는 그나 그녀가 주요 골프 선수권 대회를 모두 이길 때 그랜드 슬램을 ( ).","opts":["포기한다","시작한다","달성한다","가르친다"],"word":"achieves","r":{"a":"3) 달성한다","ev":"7번 문장","s":[[7,"For example, a golfer achieves a grand slam when he or she wins all of the major golf championships.","예를 들어, 골프 선수는 그나 그녀가 주요 골프 선수권 대회를 모두 이길 때 그랜드 슬램을 달성한다."]],"w":"7번에서 골프 선수가 주요 대회를 모두 이기면 그랜드 슬램을 achieve(달성하다) 한다고 해요. 6번에서 위대한 일을 성취한다(accomplish)고 한 것과 같은 뜻으로 이어져요.","c":3},"h":"ceb7c12d45"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Eventually, “grand slam” became a term used when players in other sports accomplish great things, too.)","ko":"( ), ‘그랜드 슬램’은 다른 스포츠의 선수들이 위대한 것들을 성취할 때에도 사용되는 용어가 되었다.","opts":["결국","갑자기","우연히","먼저"],"word":"Eventually","r":{"a":"1) 결국","ev":"6번 문장","s":[[6,"Eventually, “grand slam” became a term used when players in other sports accomplish great things, too.","결국, ‘그랜드 슬램’은 다른 스포츠의 선수들이 위대한 것들을 성취할 때에도 사용되는 용어가 되었다."]],"w":"4번에서 처음에는 카드 게임, 5번에서 테니스에서 쓰였고, 6번에서 시간이 지나 다른 스포츠로도 퍼졌어요. 이렇게 변화의 마지막 결과를 말할 때 Eventually(결국)를 써요.","c":1},"h":"ccf05da553"},{"n":6,"t":"ref","q":"What does the underlined \"he or she\" refer to?\nFor example, a golfer achieves a grand slam when he or she wins all of the major golf championships.","ko":"밑줄 친 he or she가 가리키는 것은?","sko":"…골프 선수는 그나 그녀가 주요 골프 선수권 대회를 모두 이길 때…","opts":["테니스 선수","야구 감독","골프 선수","스포츠 기자"],"r":{"a":"3) 골프 선수","ev":"7번 문장","s":[[7,"For example, a golfer achieves a grand slam when he or she wins all of the major golf championships.","예를 들어, 골프 선수는 그나 그녀가 주요 골프 선수권 대회를 모두 이길 때 그랜드 슬램을 달성한다."]],"w":"7번은 a golfer(골프 선수)가 주요 골프 선수권 대회를 모두 이길 때를 말해요. when he or she wins에서 he or she는 바로 앞의 a golfer를 가리켜요.","c":3},"h":"da40793049"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Winning feels great.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이기는 것은 기분 좋다.","opts":["이기는 것은 기분이 좋게 느껴진다.","이기는 것은 기분이 나쁘게 느껴진다.","이기는 것은 전혀 기쁘지 않다.","지는 것은 기분이 좋게 느껴진다."],"r":{"a":"1) 이기는 것은 기분이 좋게 느껴진다.","ev":"1번 문장","s":[[1,"Winning feels great.","이기는 것은 기분 좋다."]],"w":"6번은 그랜드 슬램이 처음 쓰인 곳을 넘어 다른 스포츠 선수들이 great things(위대한 일)를 이룰 때도 쓰이게 되었다는 뜻이에요. 카드 게임에만 남은 것도, 테니스 선수만 쓰는 것도 아니에요.","c":1},"h":"bf4a3df30d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["야구에서 그랜드 슬램은 홈런이 하나도 없이 끝난 경기이다.","골프 선수는 주요 대회에서 딱 한 번만 우승해도 그랜드 슬램을 얻는다.","‘그랜드 슬램’이라는 용어는 테니스에서만 사용된다.","‘그랜드 슬램’은 이제 온라인 게임에서 이룬 위대한 업적에도 사용된다."],"opts":["In baseball, a grand slam is a game that ends without any home run.","A golfer gets a grand slam by winning just one major championship.","The term “grand slam” is used only in the sport of tennis.","The term “grand slam” is now used for great achievements even in online games."],"r":{"a":"4) The term “grand slam” is now used for great achievements even in online games.","ev":"7~10번 문장","s":[[7,"For example, a golfer achieves a grand slam when he or she wins all of the major golf championships.","예를 들어, 골프 선수는 그나 그녀가 주요 골프 선수권 대회를 모두 이길 때 그랜드 슬램을 달성한다."],[8,"When it comes to baseball, a grand slam is when a batter hits a home run with players on all the bases.","야구에 관해서라면, 그랜드 슬램은 선수들이 모든 루에 있는 상태에서 타자가 홈런을 칠 때이다."],[9,"The term is also used in many other sports, such as track and field, figure skating, and mountain climbing.","그 용어는 또한 육상 경기와 피겨 스케이팅, 등산과 같은 많은 다른 스포츠에서도 사용된다."],[10,"These days, “grand slam” is even used for great achievements in other fields, such as online games.","오늘날, ‘그랜드 슬램’은 심지어 온라인 게임과 같은 다른 분야에서의 위대한 업적에도 사용된다."]],"w":"10번에서 요즘은 온라인 게임 같은 다른 분야의 위대한 업적에도 쓴다고 해요. 야구는 모든 루에 선수가 있을 때의 홈런이고(8번), 골프는 주요 대회를 모두 이겨야 하며(7번), 원래 쓰인 곳은 카드 게임 bridge예요(4번).","c":4},"h":"88ecf87b14"},{"n":9,"t":"sum","q":"The term “grand slam” was (A) used to refer to an outstanding victory in the card game (B).","ko":"‘그랜드 슬램’이라는 용어는 (A) 카드 게임 (B)에서 두드러지는 승리를 지칭하는 데 사용되었다.","oko":["(A) 원래 / (B) 체스","(A) 최근에 / (B) 브리지","(A) 원래 / (B) 브리지","(A) 최근에 / (B) 체스","(A) 한 번도 / (B) 축구"],"opts":["(A) originally / (B) chess","(A) recently / (B) bridge","(A) originally / (B) bridge","(A) recently / (B) chess","(A) never / (B) soccer"],"r":{"a":"3) (A) originally / (B) bridge (원래 / 브리지)","ev":"4번 문장","s":[[4,"The term “grand slam” was originally used to refer to an outstanding victory in the card game bridge.","‘그랜드 슬램’이라는 용어는 원래 카드 게임인 bridge에서 두드러지는 승리를 지칭하는 데 사용되었다."]],"w":"7번에서 골프는 주요 대회를 모두(all) 이겨야 하고, 8번에서 야구는 모든(all) 루에 선수가 있을 때 홈런을 쳐야 해요. 하나만 이기거나 루가 비어 있는 경우는 해당되지 않아요.","c":3},"h":"c06237591c"},{"n":10,"t":"fill","q":"When it comes to baseball, a grand slam is when a [A] hits a home run with players on all the [B].","ko":"야구에 관해서라면, 그랜드 슬램은 선수들이 모든 [B]에 있는 상태에서 [A]이(가) 홈런을 칠 때이다.","bank":["batter","bases","reporter","victory","championships","term"],"bko":{"batter":"타자","bases":"루(베이스)","reporter":"기자","victory":"승리","championships":"선수권 대회들","term":"용어"},"r":{"a":"[A] batter (타자), [B] bases (루(베이스))","ev":"8번 문장","s":[[8,"When it comes to baseball, a grand slam is when a batter hits a home run with players on all the bases.","야구에 관해서라면, 그랜드 슬램은 선수들이 모든 루에 있는 상태에서 타자가 홈런을 칠 때이다."]],"w":"4번에서 처음에는 카드 게임 bridge에서 쓰였고, 5번에서 테니스 선수가 네 개의 주요 테니스 대회를 이겼을 때 기자가 처음 썼다고 해요. baseball은 8번에서 나중에 쓰이는 예로 나올 뿐이고, chess, boxing, soccer는 글에 나오지 않아요.","c":null},"h":"b13a60b46c"}]},{"u":3,"id":"rj4-03-3","no":3,"ko":"끝난 게 아니야","items":[{"n":1,"t":"tf","q":"Bethany Hamilton began surfing as a little girl in Hawaii.","ko":"Bethany Hamilton은 하와이에서 어린 소녀일 때 서핑을 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Bethany Hamilton grew up in Hawaii, where she began surfing as a little girl.","Bethany Hamilton은 하와이에서 자랐고, 그곳에서 그녀는 어린 소녀일 때 서핑을 시작했다."]],"w":"1번 문장에서 하와이에서 자랐고, 그곳에서 어린 소녀일 때(as a little girl) 서핑을 시작했다고 해요.","c":"T"},"h":"c54428c300"},{"n":2,"t":"tf","q":"After the shark attack, doctors could not save Bethany’s life.","ko":"상어의 공격 뒤, 의사들은 Bethany의 목숨을 구하지 못했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"She was taken to a hospital, where doctors saved her life, but she lost her arm.","그녀는 병원에 이송되었고, 그곳에서 의사들이 그녀의 목숨을 구했지만, 그녀는 그녀의 팔을 잃었다."]],"w":"4번에서 병원에서 의사들이 목숨을 구했다고 해요(saved her life). 목숨을 구하지 못했다는 말은 틀렸어요. 잃은 것은 팔이에요.","c":"F"},"h":"d19b35b94c"},{"n":3,"t":"tf","q":"Bethany entered a surfing competition less than a year after the attack.","ko":"Bethany는 공격 후 일 년이 채 되지 않아 서핑 대회에 참가했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Less than a year after her attack, Bethany entered a surfing competition.","공격 후 일 년이 채 되지 않아, Bethany는 서핑 대회에 참가했다."]],"w":"9번 문장 Less than a year after her attack, Bethany entered a surfing competition과 같은 내용이에요.","c":"T"},"h":"0d766f8a88"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Bethany, however, had no intention of giving up.)","ko":"하지만, Bethany는 포기할 ( )가 없었다.","opts":["기회","의도","이유","경험"],"word":"intention","r":{"a":"2) 의도","ev":"6번 문장","s":[[6,"Bethany, however, had no intention of giving up.","하지만, Bethany는 포기할 의사가 없었다."]],"w":"6번 had no intention of giving up은 '포기할 생각(의도)이 없었다'예요. 5번에서 사람들은 서핑을 못 할 거라고 믿었지만 Bethany는 그렇지 않았어요.","c":2},"h":"2cb3e73dff"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (She is still a passionate professional surfer.)","ko":"그녀는 여전히 ( ) 프로 서퍼이다.","opts":["수줍은","조용한","열정적인","피곤한"],"word":"passionate","r":{"a":"3) 열정적인","ev":"10~11번 문장","s":[[10,"Bethany is now married and has four children.","Bethany는 현재 결혼을 해서 네 명의 아이가 있다."],[11,"She is still a passionate professional surfer.","그녀는 여전히 열정적인 프로 서퍼이다."]],"w":"11번 She is still a passionate professional surfer에서 passionate는 '열정적인'이에요. 10번에서 결혼해 아이가 넷이 되었어도 여전히(still) 서핑에 열정이 있는 프로 서퍼라는 뜻이에요.","c":3},"h":"d2c9ac4e8a"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nHowever, when Bethany was 13, a shark attacked her and bit her left arm.","ko":"밑줄 친 \"her\"가 가리키는 것은?","sko":"하지만, Bethany가 열세 살이었을 때, 상어가 그녀를 공격해 그녀의 왼쪽 팔을 물었다.","opts":["Bethany","상어","의사","Bethany의 어머니"],"r":{"a":"1) Bethany","ev":"3번 문장","s":[[3,"However, when Bethany was 13, a shark attacked her and bit her left arm.","하지만, Bethany가 열세 살이었을 때, 상어가 그녀를 공격해 그녀의 왼쪽 팔을 물었다."]],"w":"4번의 ', where doctors saved her life'에서 where는 바로 앞의 a hospital(병원)을 가리켜요. 의사들이 목숨을 구한 곳이 병원이에요.","c":1,"k":"her = Bethany"},"pron":"her","h":"e80ba967a5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Bethany knew when she was a little girl that she wanted to be a surfer, and nothing could stop her.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"Bethany는 그녀가 어린 소녀였을 때 자신은 서퍼가 되고 싶다는 것을 알았고, 아무것도 그녀를 막을 수 없었다.","opts":["Bethany는 서퍼가 되고 싶었지만 상어 때문에 포기했다.","Bethany는 어릴 때 서퍼가 되고 싶다는 것을 알았지만, 부모님이 그녀를 막았다.","Bethany는 어릴 때 서퍼가 되고 싶지 않다는 것을 알았다.","Bethany는 어릴 때부터 서퍼가 되고 싶다는 것을 알았고, 그녀를 막을 수 있는 것은 없었다."],"r":{"a":"4) Bethany는 어릴 때부터 서퍼가 되고 싶다는 것을 알았고, 그녀를 막을 수 있는 것은 없었다.","ev":"12번 문장","s":[[12,"Bethany knew when she was a little girl that she wanted to be a surfer, and nothing could stop her.","Bethany는 그녀가 어린 소녀였을 때 자신은 서퍼가 되고 싶다는 것을 알았고, 아무것도 그녀를 막을 수 없었다."]],"w":"nothing could stop her는 '아무것도 그녀를 막을 수 없었다'예요. 그래서 어릴 때부터 품은 꿈을 이루려는 마음을 상어도 꺾지 못했다는 뜻이에요. 포기했다는 선지는 6번과 맞지 않아요.","c":4},"h":"219931e356"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Bethany는 상어의 공격으로 오른쪽 팔을 잃었다.","대부분의 사람들은 Bethany가 대회에서 우승할 거라고 확신했다.","Bethany는 퇴원한 지 한 달 뒤에 서핑으로 돌아갔다.","Bethany는 서핑을 그만두고 지금은 대회를 구경만 한다."],"opts":["Bethany lost her right arm in a shark attack.","Most people were sure that Bethany would win a competition.","Bethany went back to surfing one month after she left the hospital.","Bethany stopped surfing and now only watches competitions."],"r":{"a":"3) Bethany went back to surfing one month after she left the hospital.","ev":"3~5번, 7번 문장","s":[[3,"However, when Bethany was 13, a shark attacked her and bit her left arm.","하지만, Bethany가 열세 살이었을 때, 상어가 그녀를 공격해 그녀의 왼쪽 팔을 물었다."],[4,"She was taken to a hospital, where doctors saved her life, but she lost her arm.","그녀는 병원에 이송되었고, 그곳에서 의사들이 그녀의 목숨을 구했지만, 그녀는 그녀의 팔을 잃었다."],[5,"Most people believed that Bethany would never surf again.","대부분의 사람들은 Bethany가 결코 다시는 서핑을 하지 않을 거라고 믿었다."],[7,"One month after leaving the hospital, Bethany was back to surfing.","퇴원 한 달 뒤에, Bethany는 서핑으로 돌아왔다."]],"w":"7번에서 퇴원 한 달 뒤에 서핑으로 돌아왔다고 해요. 잃은 것은 왼쪽 팔이고(3번), 사람들은 다시 서핑 못 할 거라고 믿었고(5번), 지금도 프로 서퍼예요(11번).","c":3},"h":"6ce064aa1d"},{"n":9,"t":"sum","q":"Bethany was in the (A) almost every day, (B) to surf without her left arm.","ko":"Bethany는 왼쪽 팔 없이 서핑하는 것을 (B) 거의 매일 (A)에 있었다.","oko":["(A) 병원 / (B) 익히며","(A) 바다 / (B) 거부하며","(A) 부엌 / (B) 잊어버리며","(A) 바다 / (B) 익히며","(A) 병원 / (B) 거부하며"],"opts":["(A) hospital / (B) learning","(A) ocean / (B) refusing","(A) kitchen / (B) forgetting","(A) ocean / (B) learning","(A) hospital / (B) refusing"],"r":{"a":"4) (A) ocean / (B) learning (바다 / 익히며)","ev":"8번 문장","s":[[8,"She was in the ocean almost every day, learning to surf without her left arm.","그녀는 왼쪽 팔 없이 서핑하는 것을 익히며 거의 매일 바다에 있었다."]],"w":"8번에서 팔 없이 서핑하는 것을 익혔고(learn), 9번에서 일 년이 채 되기 전에 대회에 참가했어요(enter). 대회를 놓치거나 피했다는 말은 없어요.","c":4},"h":"20e4ccd20d"},{"n":10,"t":"fill","q":"Most people [A] that Bethany would [B] surf again.","ko":"대부분의 사람들은 Bethany가 [B] 다시 서핑을 하지 않을 거라고 [A].","bank":["believed","never","lost","entered","little","professional"],"bko":{"believed":"믿었다(believe의 과거)","never":"결코 ~않다","lost":"잃었다(lose의 과거)","entered":"참가했다(enter의 과거)","little":"작은","professional":"전문적인"},"r":{"a":"[A] believed (믿었다(believe의 과거)), [B] never (결코 ~않다)","ev":"5번 문장","s":[[5,"Most people believed that Bethany would never surf again.","대부분의 사람들은 Bethany가 결코 다시는 서핑을 하지 않을 거라고 믿었다."]],"w":"3번에서 상어(shark)가 Bethany를 공격해 팔을 물었어요. 4번에서 의사들이 목숨은 구했지만(saved her life) 팔은 잃었어요(lost her arm). saved는 목숨을 구한 것이고 팔에는 쓸 수 없어요.","c":null},"h":"4d3689b84d"}]},{"u":3,"id":"rj4-03-4","no":4,"ko":"껌을 씹는 이유가 뭘까?","items":[{"n":1,"t":"tf","q":"Many baseball and soccer players chew gum.","ko":"많은 야구 선수와 축구 선수들이 껌을 씹는다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Many of them chew gum!","그들 중 많은 선수들이 껌을 씹는다!"]],"w":"1번에서 야구나 축구를 보면 선수들에 대해 알아차릴 수 있다고 하고, 2번에서 그들 중 많은 선수들이 껌을 씹는다(Many of them chew gum)고 해요.","c":"T"},"h":"2a23051035"},{"n":2,"t":"tf","q":"The action of chewing sends electrical signals to the stomach.","ko":"씹는 동작은 위에 전기 신호를 보낸다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The action of chewing sends electrical signals to the brain, and this keeps the mind active.","씹는 동작은 뇌에 전기 신호를 보내고, 이것은 정신을 활동적으로 유지시킨다."]],"w":"5번에서 씹는 동작이 전기 신호를 보내는 곳은 뇌(the brain)예요. 위(stomach)가 아니에요.","c":"F"},"h":"edd1307d3c"},{"n":3,"t":"tf","q":"Athletes who chew gum have relatively lower levels of cortisol.","ko":"껌을 씹는 운동선수들은 코티솔 수준이 비교적 더 낮다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Research has shown that athletes who chew gum have relatively lower levels of a stress hormone called cortisol.","연구는 껌을 씹는 운동선수들은 코티솔이라고 불리는 스트레스 호르몬의 수준이 상대적으로 더 낮다는 것을 보여줬다."]],"w":"9번 문장에서 연구가 껌을 씹는 운동선수들의 코티솔 수준이 상대적으로 더 낮다는 것을 보여줬다고 해요.","c":"T"},"h":"df350c8c7b"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Researchers have claimed that chewing gum improves athletes’ performance.)","ko":"연구원들은 껌을 씹는 것이 운동선수들의 성과를 향상시킨다고 ( ).","opts":["숨겼다","주장했다","의심했다","잊었다"],"word":"claimed","r":{"a":"2) 주장했다","ev":"4번 문장","s":[[4,"Researchers have claimed that chewing gum improves athletes’ performance.","연구원들은 껌을 씹는 것이 운동선수들의 성과를 향상시킨다고 주장했다."]],"w":"4번은 연구원들의 주장이에요. that 뒤의 내용(껌을 씹으면 성과가 좋아진다)을 말한 것이니 claim은 '주장하다'예요. 뒤에서 그 이유를 설명하고 있어요.","c":2},"h":"3d048c8397"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Research has shown that athletes who chew gum have relatively lower levels of a stress hormone called cortisol.)","ko":"연구는 껌을 씹는 운동선수들은 코티솔이라고 불리는 스트레스 호르몬의 수준이 ( ) 더 낮다는 것을 보여줬다.","opts":["항상","갑자기","전혀","상대적으로"],"word":"relatively","r":{"a":"4) 상대적으로","ev":"9번 문장","s":[[9,"Research has shown that athletes who chew gum have relatively lower levels of a stress hormone called cortisol.","연구는 껌을 씹는 운동선수들은 코티솔이라고 불리는 스트레스 호르몬의 수준이 상대적으로 더 낮다는 것을 보여줬다."]],"w":"relatively lower는 '(다른 선수들과 비교해) 상대적으로 더 낮은'이라는 뜻이에요. 껌을 씹는 선수들이 다른 선수들보다 코티솔 수준이 낮다는 비교를 담고 있어요.","c":4},"h":"694a140d3b"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThe next time you see athletes chewing gum, remember that it helps them perform at their best!","ko":"밑줄 친 \"them\"이 가리키는 것은?","sko":"다음번에 당신이 껌을 씹는 운동선수를 본다면, 그것이 그들의 가장 좋은 상태에서 경기를 하도록 도와준다는 것을 기억해라!","opts":["운동선수들","당신","연구원들","껌"],"r":{"a":"1) 운동선수들","ev":"13번 문장","s":[[13,"The next time you see athletes chewing gum, remember that it helps them perform at their best!","다음번에 당신이 껌을 씹는 운동선수를 본다면, 그것이 그들의 가장 좋은 상태에서 경기를 하도록 도와준다는 것을 기억해라!"]],"w":"5번의 this는 바로 앞의 'The action of chewing sends electrical signals to the brain'이라는 절 전체예요. 신호를 보내는 일이 정신을 활동적으로 유지시켜요.","c":1,"k":"them = 운동선수들"},"pron":"them","h":"3d44332e1b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Those are not the only benefits of chewing gum, though.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 이것들만이 껌을 씹는 것의 이점은 아니다.","opts":["껌을 씹는 것에는 이점이 전혀 없다.","껌을 씹는 것의 이점은 이것들만 있는 것이 아니다.","껌을 씹는 것의 이점은 이것들뿐이다.","껌을 씹는 것은 이점이 아니라 단점이다."],"r":{"a":"2) 껌을 씹는 것의 이점은 이것들만 있는 것이 아니다.","ev":"8번 문장","s":[[8,"Those are not the only benefits of chewing gum, though.","하지만 이것들만이 껌을 씹는 것의 이점은 아니다."]],"w":"not the only benefits는 '유일한 이점이 아니다', 즉 이점이 더 있다는 뜻이에요. 그래서 9번에서 코티솔에 관한 새 이점이 이어져요.","c":2},"h":"8eed86bcc4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["더 낮은 코티솔 수준은 사람들이 침착함을 유지하도록 도울 수 있다.","껌을 씹는 운동선수들은 코티솔 수준이 더 높다.","껌을 씹는 것은 운동선수들의 반응을 더 느리게 만든다.","껌을 씹는 것은 뇌가 작동하지 못하게 막는다."],"opts":["Lower cortisol levels can help people stay calm.","Athletes who chew gum have higher levels of cortisol.","Chewing gum makes athletes’ reactions slower.","Chewing gum stops the brain from working."],"r":{"a":"1) Lower cortisol levels can help people stay calm. (더 낮은 코티솔 수준은 사람들이 침착함을 유지하도록 도울 수 있다.)","ev":"5번, 7번, 9~10번 문장","s":[[5,"The action of chewing sends electrical signals to the brain, and this keeps the mind active.","씹는 동작은 뇌에 전기 신호를 보내고, 이것은 정신을 활동적으로 유지시킨다."],[7,"Their reactions will also be faster.","그들의 반응 또한 더 빨라질 것이다."],[9,"Research has shown that athletes who chew gum have relatively lower levels of a stress hormone called cortisol.","연구는 껌을 씹는 운동선수들은 코티솔이라고 불리는 스트레스 호르몬의 수준이 상대적으로 더 낮다는 것을 보여줬다."],[10,"Lower cortisol levels can help people remain calm.","더 낮은 코티솔 수준은 사람들이 침착하게 유지할 수 있도록 도울 수 있다."]],"w":"11번에서 침착하면 압박감 속에서 현명한 결정을 내리고 실수를 피할 수 있다고 해요. 코티솔은 더 낮고(9번), 반응은 더 빨라지며(7번), 뇌에는 신호가 가요(5번).","c":1},"h":"e105948c92"},{"n":9,"t":"sum","q":"If athletes chew gum while they play, they can think (A) and concentrate (B) on the game.","ko":"운동선수들이 경기하는 동안 껌을 씹으면, 그들은 더 (A) 생각하고 경기에 더 (B) 집중할 수 있다.","oko":["(A) 느리게 / (B) 잘","(A) 빠르게 / (B) 못","(A) 느리게 / (B) 못","(A) 빠르게 / (B) 잘","(A) 열심히 / (B) 늦게"],"opts":["(A) slower / (B) better","(A) faster / (B) worse","(A) slower / (B) worse","(A) faster / (B) better","(A) harder / (B) later"],"r":{"a":"4) (A) faster / (B) better","ev":"6번 문장","s":[[6,"So if athletes chew gum while they play, they can think faster and concentrate better on the game.","그래서 운동선수들이 경기하는 동안 껌을 씹는다면, 그들은 더 빠르게 생각하고 경기에 더 잘 집중할 수 있다."]],"w":"6번에서 껌을 씹는 선수는 더 빠르게(faster) 생각하고 경기에 더 잘(better) 집중할 수 있다고 해요. 느리거나 못 집중한다는 말은 반대예요.","c":4},"h":"5154b66c5d"},{"n":10,"t":"fill","q":"When athletes stay calm, they can make smart decisions under [A] and avoid [B].","ko":"운동선수들이 침착할 때, 그들은 [A] 속에서 현명한 결정을 내리고 [B]을(를) 피할 수 있다.","bank":["pressure","mistakes","signals","levels","benefits","hormone"],"bko":{"pressure":"압박감","mistakes":"실수들","signals":"신호","levels":"수준","benefits":"이점","hormone":"호르몬"},"r":{"a":"[A] pressure (압박감), [B] mistakes (실수들)","ev":"11번 문장","s":[[11,"When athletes stay calm, they can make smart decisions under pressure and avoid mistakes.","운동선수들이 침착할 때, 그들은 압박감 속에서 현명한 결정을 내리고 실수를 피할 수 있다."]],"w":"10번에서 코티솔이 낮으면 침착함(calm)을 유지하고, 11번에서 침착하면 압박감 속에서 현명한 결정(decisions)을 내려요. 긴장한(nervous) 상태가 아니라 침착한 상태라서 실수를 피할 수 있어요.","c":null},"h":"4139ad7eea"}]},{"u":4,"id":"rj4-04-1","no":1,"ko":"계란, 그림에 양보하세요","items":[{"n":1,"t":"tf","q":"When we make a cake, we use eggs to make sure that the cake does not fall apart.","ko":"우리는 케이크를 만들 때, 케이크가 무너지지 않도록 하기 위해 계란을 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"When we make a cake, we use eggs to make sure that the dough sticks together and the cake doesn’t fall apart.","우리가 케이크를 만들 때, 우리는 반죽이 함께 붙어서 케이크가 무너지지 않도록 하기 위해 계란을 사용한다."]],"w":"1번 문장에서 계란을 쓰는 이유가 반죽이 함께 붙어서 케이크가 무너지지 않게 하기 위해서(the cake doesn’t fall apart)라고 해요.","c":"T"},"h":"225443b3b3"},{"n":2,"t":"tf","q":"To make egg tempera, you need dry pigment and egg white.","ko":"계란 템페라를 만들려면 건조한 색소와 계란 흰자가 필요하다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"To make egg tempera, you need dry pigment and egg yolk.","계란 템페라를 만들기 위해, 건조한 색소와 계란 노른자가 필요하다."]],"w":"5번에서 필요한 재료는 건조한 색소(dry pigment)와 계란 노른자(egg yolk)예요. 흰자가 아니에요.","c":"F"},"h":"d19d0eb286"},{"n":3,"t":"tf","q":"Egg tempera does not fade as quickly as oil paint.","ko":"계란 템페라는 유화 물감만큼 빨리 바래지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"However, it produces a smooth finish, and it does not fade as quickly as oil paint does.","하지만 그것은 매끄러운 마무리를 만들어내고, 유화만큼 빨리 바래지 않는다."]],"w":"9번 문장 it does not fade as quickly as oil paint does에서 it은 계란 템페라예요. 유화 물감만큼 빨리 바래지 않는다는 뜻이에요.","c":"T"},"h":"db65094961"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They help bind the mixture of a certain kind of paint called egg tempera.)","ko":"그것들은 계란 템페라라고 불리는 특정한 종류의 물감의 혼합물을 ( ) 것을 돕는다.","opts":["나누는","씻는","뭉치는","던지는"],"word":"bind","r":{"a":"3) 뭉치는","ev":"1번, 3번 문장","s":[[1,"When we make a cake, we use eggs to make sure that the dough sticks together and the cake doesn’t fall apart.","우리가 케이크를 만들 때, 우리는 반죽이 함께 붙어서 케이크가 무너지지 않도록 하기 위해 계란을 사용한다."],[3,"They help bind the mixture of a certain kind of paint called egg tempera.","그것들은 계란 템페라라고 불리는 특정한 종류의 물감의 혼합물을 뭉치는 것을 돕는다."]],"w":"1번에서 계란은 반죽이 함께 붙게 해 줘요. 3번은 예술에서도 비슷한 목적(2번)이라는 뜻이니, bind는 물감 혼합물이 서로 붙도록 '뭉치다, 묶다'예요.","c":3},"h":"500a3dddfa"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So painters using egg tempera had to work quickly because they needed to apply the paint before it dried.)","ko":"그래서 계란 템페라를 사용하는 화가들은 마르기 전에 물감을 ( ) 했기 때문에 빠르게 작업해야 했다.","opts":["신청해야","칠해야","팔아야","지워야"],"word":"apply","r":{"a":"2) 칠해야","ev":"8번 문장","s":[[8,"So painters using egg tempera had to work quickly because they needed to apply the paint before it dried.","그래서 계란 템페라를 사용하는 화가들은 마르기 전에 물감을 칠해야 했기 때문에 빠르게 작업해야 했다."]],"w":"8번은 물감이 마르기 전에 해야 하는 일을 말해요. 물감을 apply하는 것은 그림에 물감을 '바르다, 칠하다'예요. '신청하다'는 이 문장과 맞지 않아요.","c":2},"h":"333e808cda"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nPaintings such as Michael Damaskinos’s The Last Supper were made centuries ago with egg tempera, and they can still be seen today!","ko":"밑줄 친 \"they\"가 가리키는 것은?","sko":"미카엘 다마스키노스의 <마지막 만찬>과 같은 그림들은 수 세기 전에 계란 템페라로 만들어졌고, 그것들은 오늘날도 여전히 볼 수 있다!","opts":["그림들","계란들","화가들","세기들"],"r":{"a":"1) 그림들","ev":"10번 문장","s":[[10,"Paintings such as Michael Damaskinos’s The Last Supper were made centuries ago with egg tempera, and they can still be seen today!","미카엘 다마스키노스의 <마지막 만찬>과 같은 그림들은 수 세기 전에 계란 템페라로 만들어졌고, 그것들은 오늘날도 여전히 볼 수 있다!"]],"w":"9번의 it은 8번에서 말한 계란 템페라(egg tempera)예요. 8번의 불편한 점 뒤에 However로 같은 물감의 좋은 점(매끈한 마무리, 안 바램)을 말해요. 유화 물감은 as ~ as 뒤에서 비교 대상으로 따로 나와요.","c":1,"k":"they = 그림들"},"pron":"they","h":"7270a02086"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Eggs can be used for a similar purpose in art.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"계란은 비슷한 목적으로 예술에서도 사용될 수 있다.","opts":["계란은 예술에서도 비슷한 목적으로 쓰일 수 있다.","계란은 예술에서는 전혀 쓰일 수 없다.","계란은 케이크를 만들 때만 쓰인다.","예술에서 계란은 먹기 위해서만 쓰인다."],"r":{"a":"1) 계란은 예술에서도 비슷한 목적으로 쓰일 수 있다.","ev":"2번 문장","s":[[2,"Eggs can be used for a similar purpose in art.","계란은 비슷한 목적으로 예술에서도 사용될 수 있다."]],"w":"The pigment provides the color는 '색소가 색을 낸다'이고, the yolk allows the pigment to stick to a surface는 '노른자가 색소를 표면에 붙게 해 준다'는 뜻이에요. 역할이 서로 달라요.","c":1},"h":"ac526c2ba0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["계란 템페라는 유화 물감보다 마르는 데 더 오래 걸린다.","계란 템페라는 건조한 색소와 식용유로 만든다.","계란 템페라는 오늘날 어떤 그림에서도 볼 수 없다.","계란 템페라는 유화 물감보다 더 빨리 마른다."],"opts":["Egg tempera takes longer to dry than oil paint.","Egg tempera is made with dry pigment and cooking oil.","Egg tempera cannot be seen in any painting today.","Egg tempera dries more quickly than oil paint."],"r":{"a":"4) Egg tempera dries more quickly than oil paint. (계란 템페라는 유화 물감보다 더 빨리 마른다.)","ev":"5번, 7번, 10번 문장","s":[[5,"To make egg tempera, you need dry pigment and egg yolk.","계란 템페라를 만들기 위해, 건조한 색소와 계란 노른자가 필요하다."],[7,"Egg tempera dries more quickly than oil paint.","계란 템페라는 유화보다 더 빨리 마른다."],[10,"Paintings such as Michael Damaskinos’s The Last Supper were made centuries ago with egg tempera, and they can still be seen today!","미카엘 다마스키노스의 <마지막 만찬>과 같은 그림들은 수 세기 전에 계란 템페라로 만들어졌고, 그것들은 오늘날도 여전히 볼 수 있다!"]],"w":"10번에서 수 세기 전 계란 템페라 그림을 오늘날도 볼 수 있다고 해요. 계란 템페라는 더 빨리 마르고(7번), 유화가 인기를 얻기 전까지 흔히 쓰였고(4번), 유화만큼 빨리 바래지 않아요(9번).","c":4},"h":"d72f24eae5"},{"n":9,"t":"sum","q":"Egg tempera was (A) used in Europe until oil paints became more (B) around the 1500s.","ko":"계란 템페라는 1500년대 무렵 유화가 더 (B) 때까지 유럽에서 (A) 사용되었다.","oko":["(A) 드물게 / (B) 인기 있어질","(A) 흔히 / (B) 값비싸질","(A) 드물게 / (B) 값비싸질","(A) 흔히 / (B) 인기 있어질","(A) 한 번도 / (B) 다채로워질"],"opts":["(A) rarely / (B) popular","(A) commonly / (B) expensive","(A) rarely / (B) expensive","(A) commonly / (B) popular","(A) never / (B) colorful"],"r":{"a":"4) (A) commonly / (B) popular (흔히 / 인기 있어질)","ev":"4번 문장","s":[[4,"Egg tempera was commonly used in Europe until oil paints became more popular around the 1500s.","계란 템페라는 1500년대 무렵 유화가 더 인기를 얻을 때까지 유럽에서 흔히 사용되었다."]],"w":"4번 문장에서 계란 템페라는 유화가 더 인기를 얻을(popular) 때까지 유럽에서 흔히(commonly) 사용되었다고 해요.","c":4},"h":"c4f33524f8"},{"n":10,"t":"fill","q":"The pigment provides the color, and the [A] allows the pigment to stick to a [B].","ko":"색소는 색을 제공하고, [A]은(는) 그 색소가 [B]에 붙도록 한다.","bank":["yolk","surface","century","reason","tiny","similar"],"bko":{"yolk":"노른자","surface":"표면","century":"세기","reason":"이유","tiny":"아주 작은","similar":"비슷한"},"r":{"a":"[A] yolk (노른자), [B] surface (표면)","ev":"6번 문장","s":[[6,"The pigment provides the color, and the yolk allows the pigment to stick to a surface.","색소는 색을 제공하고, 노른자는 그 색소가 표면에 붙도록 한다."]],"w":"6번 문장에서 색소(pigment)는 색을 제공하고, 노른자(yolk)는 색소가 표면(surface)에 붙도록 해 준다고 해요.","c":null},"h":"5d0b853817"}]},{"u":4,"id":"rj4-04-2","no":2,"ko":"머리가 없어도 놀라지 마세요!","items":[{"n":1,"t":"tf","q":"Some Roman statues lost their heads by accident.","ko":"일부 고대 로마 조각상은 우연히 머리를 잃었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Accidental damage is an obvious reason for some of the missing heads.","우연히 생긴 손상이 몇몇의 머리가 없어진 것에 대한 명백한 이유이다."]],"w":"2번에서 우연히 생긴 손상(Accidental damage)이 머리가 없어진 이유 중 하나라고 해요.","c":"T"},"h":"b490fc09cb"},{"n":2,"t":"tf","q":"The Romans wanted their artistic works to stay the same in every situation.","ko":"로마인들은 자신의 예술 작품이 모든 상황에서 똑같이 유지되기를 원했다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"So, they wanted their artistic works to be adaptable to new situations.","그래서 그들은 그들의 예술 작품들이 새로운 상황들에 적응할 수 있기를 원했다."]],"w":"5번에서 로마인들은 작품이 새로운 상황에 적응할 수 있기를(adaptable to new situations) 원했어요. 똑같이 유지되기를 원한 것이 아니에요.","c":"F"},"h":"e74381cefe"},{"n":3,"t":"tf","q":"Most Roman statues had changeable heads because the head was important for identity.","ko":"머리가 정체성에 중요했기 때문에 대부분의 로마 조각상은 바꿀 수 있는 머리를 가지고 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"13번 문장","s":[[13,"However, the head was considered important for identity, so most statues had changeable heads.","그러나 머리는 정체성을 위해 중요하게 여겨져서, 대부분의 조각상은 바꿀 수 있는 머리를 가지고 있었다."]],"w":"13번에서 머리가 정체성에 중요하게 여겨졌기 때문에 대부분의 조각상이 바꿀 수 있는 머리를 가졌다고 해요.","c":"T"},"h":"ac73131c0c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Accidental damage is an obvious reason for some of the missing heads.)","ko":"우연히 생긴 손상이 몇몇의 머리가 없어진 것에 대한 ( ) 이유이다.","opts":["위험한","값비싼","명백한","오래된"],"word":"obvious","r":{"a":"3) 명백한","ev":"2번 문장","s":[[2,"Accidental damage is an obvious reason for some of the missing heads.","우연히 생긴 손상이 몇몇의 머리가 없어진 것에 대한 명백한 이유이다."]],"w":"2번은 우연한 손상이 머리가 없는 이유로 누구나 바로 알 수 있는 것이라는 뜻이에요. 3번 However 뒤에서 '다른 이유'가 따로 나오는 것과 대비돼요.","c":3},"h":"9a5bf2935c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (There was an easy solution—simply remove the head and replace it with another.)","ko":"단순히 머리를 제거하고 다른 것으로 ( ) 것이다.","opts":["숨기는","교체하는","그리는","파는"],"word":"replace","r":{"a":"2) 교체하는","ev":"9번 문장","s":[[9,"There was an easy solution—simply remove the head and replace it with another.","쉬운 해결책이 있었다. 단순히 머리를 제거하고 다른 것으로 교체하는 것이다."]],"w":"9번은 인물이 인기를 잃었을 때의 쉬운 해결책이에요. 머리를 떼어 내고(remove) 다른 머리로 replace(교체하다)하는 거예요.","c":2},"h":"1c8e5aaa8c"},{"n":6,"t":"ref","q":"What does the underlined \"their\" refer to?\nHowever, some statues seem to be without their heads for another reason.","ko":"밑줄 친 \"their\"가 가리키는 것은?","sko":"그러나 일부의 조각상들은 다른 이유로 머리가 없는 것처럼 보인다.","opts":["일부 조각상들","로마인들","예술가들","방문객들"],"r":{"a":"1) 일부 조각상들","ev":"3번 문장","s":[[3,"However, some statues seem to be without their heads for another reason.","그러나 일부의 조각상들은 다른 이유로 머리가 없는 것처럼 보인다."]],"w":"9번에서 it은 바로 앞에서 제거한 the head(머리)예요. 머리를 제거하고 그 머리를 다른 머리로 교체한다는 뜻이에요.","c":1,"k":"their = 일부 조각상들"},"pron":"their","h":"d5a6568ba5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By simply changing the head, the statue could become anyone.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"단순히 머리를 바꿈으로써, 그 조각상은 누구나 될 수 있었다.","opts":["머리를 바꾸려면, 먼저 조각상 전체를 새로 만들어야 했다.","머리를 바꾸면, 그 조각상은 아무도 될 수 없었다.","머리만 바꾸면, 그 조각상은 누구든 될 수 있었다.","조각상은 한 번 만들면 다른 사람이 될 수 없었다."],"r":{"a":"3) 머리만 바꾸면, 그 조각상은 누구든 될 수 있었다.","ev":"11번 문장","s":[[11,"By simply changing the head, the statue could become anyone.","단순히 머리를 바꿈으로써, 그 조각상은 누구나 될 수 있었다."]],"w":"By simply changing the head는 '머리만 바꿈으로써'이고, the statue could become anyone은 '그 조각상은 누구든 될 수 있었다'예요. 10번에서 몸통은 평범하게 만들고 머리만 뗄 수 있게 했기 때문이에요.","c":3},"h":"1c7bda8013"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고대 로마 예술가들은 제거할 수 있는 머리를 가진 전형적인 몸통만 만들면 되었다.","로마 조각상의 없어진 머리는 모두 우연히 잃어버린 것이다.","로마 조각상은 새 머리를 달아 본 적이 없다.","로마 예술가들은 사람마다 새 몸통을 만들었다."],"opts":["Roman artists only needed to make a typical body with a removable head.","All the missing heads of Roman statues were lost by accident.","Roman statues were never given new heads.","Roman artists made a new body for each person."],"r":{"a":"1) Roman artists only needed to make a typical body with a removable head.","ev":"10번 문장","s":[[10,"Therefore, artists only needed to create a typical body with a removable head.","따라서 예술가들은 단지 제거할 수 있는 머리를 가진 전형적인 몸통을 만들기만 하면 되었다."]],"w":"10번에서 예술가들은 전형적인 몸통에 제거할 수 있는 머리를 만들기만 하면 되었어요. 우연한 손상 말고 다른 이유가 있고(3번), 머리를 교체했으며(9번), 몸통은 같았어요(10번).","c":1},"h":"743efb66b1"},{"n":9,"t":"sum","q":"Imagine you paid for an (A) sculpture of a (B) figure of the time.","ko":"당신이 그 시대의 (B) 인물의 (A) 조각품에 돈을 지불했다고 상상해 보아라.","oko":["(A) 값싼 / (B) 영웅적인","(A) 값비싼 / (B) 평범한","(A) 값비싼 / (B) 영웅적인","(A) 값싼 / (B) 평범한","(A) 아주 작은 / (B) 화난"],"opts":["(A) cheap / (B) heroic","(A) expensive / (B) ordinary","(A) expensive / (B) heroic","(A) cheap / (B) ordinary","(A) tiny / (B) angry"],"r":{"a":"3) (A) expensive / (B) heroic (값비싼 / 영웅적인)","ev":"7번 문장","s":[[7,"Imagine you paid for an expensive sculpture of a heroic figure of the time.","당신이 그 시대의 영웅적인 인물의 값비싼 조각품에 돈을 지불했다고 상상해 보아라."]],"w":"8번에서 인물이 갑자기 인기가 없어지면(unpopular) 어떨까 묻고, 9번에서 쉬운 해결책은 머리를 제거하고(remove) 다른 것으로 교체하는 거라고 해요.","c":3},"h":"ab11e41f45"},{"n":10,"t":"fill","q":"They [A] that public [B] could change.","ko":"그들은 대중의 [B]이(가) 바뀔 수 있다는 것을 [A].","bank":["understood","opinion","practical","removable","adaptable","created"],"bko":{"understood":"이해했다(understand의 과거)","opinion":"의견","practical":"실용적인","removable":"제거할 수 있는","created":"만들었다(create의 과거)","adaptable":"적응할 수 있는"},"r":{"a":"[A] understood (이해했다(understand의 과거)), [B] opinion (의견)","ev":"6번 문장","s":[[6,"They understood that public opinion could change.","그들은 여론이 바뀔 수 있다는 것을 이해했다."]],"w":"6번 문장에서 로마인들은 여론(public opinion)이 바뀔 수 있다는 것을 이해했다(understood)고 해요. 5번에서 작품이 새로운 상황에 맞게 바뀌기를 원했다고 이어져요.","c":null},"h":"9c3ed47c69"}]},{"u":4,"id":"rj4-04-3","no":3,"ko":"나도 이 집에 살고 싶어!","items":[{"n":1,"t":"tf","q":"Some old dollhouses were up to two meters tall.","ko":"일부 오래된 인형의 집은 높이가 최대 2미터였다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"They were up to two meters tall and open on one side.","그것들은 높이가 2m까지 되었고 한쪽이 개방되어 있었다."]],"w":"2번에서 인형의 집은 높이가 최대 2미터(up to two meters tall)까지 되었다고 해요.","c":"T"},"h":"008f94a11c"},{"n":2,"t":"tf","q":"The old dollhouses were toys for children to play with.","ko":"그 오래된 인형의 집들은 아이들이 가지고 노는 장난감이었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"Interestingly, these houses were not toys to play with.","흥미롭게도, 이 집들은 가지고 놀 장난감이 아니었다."]],"w":"7번에서 이 집들은 가지고 놀 장난감이 아니었다(not toys to play with)고 해요.","c":"F"},"h":"6c40f48b72"},{"n":3,"t":"tf","q":"Some dollhouses even had small paintings done by famous artists.","ko":"일부 인형의 집에는 심지어 유명한 화가들이 그린 작은 그림도 있었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Some houses even had small paintings done by famous artists!","몇몇 집들은 심지어 유명한 화가들에 의해 그려진 작은 그림들도 있었다!"]],"w":"5번에서 몇몇 집에는 유명한 화가들이 그린 작은 그림(small paintings done by famous artists)도 있었다고 해요.","c":"T"},"h":"a5c3d6adec"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Each of the objects was handmade and decorated in great detail.)","ko":"각각의 물건들은 수제였고 아주 세밀하게 ( ).","opts":["부서졌다","팔렸다","장식되었다","숨겨졌다"],"word":"decorated","r":{"a":"3) 장식되었다","ev":"4번 문장","s":[[4,"Each of the objects was handmade and decorated in great detail.","각각의 물건들은 수제였고 아주 세밀하게 장식되었다."]],"w":"4번은 물건이 손으로 만들어지고(handmade) 세밀하게 꾸며졌다는 뜻이에요. decorate는 '장식하다'이고, 5번에서 작은 그림까지 있었다는 말로 이어져요.","c":3},"h":"e94f1a6b4d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In modern times, these luxurious dollhouses have turned out to have historical value as well.)","ko":"현대에, 이 ( ) 인형의 집들은 역사적 가치 또한 지닌 것으로 밝혀졌다.","opts":["가난한","호화로운","작은","평범한"],"word":"luxurious","r":{"a":"2) 호화로운","ev":"9번 문장","s":[[9,"In modern times, these luxurious dollhouses have turned out to have historical value as well.","현대에, 이 사치스러운 인형의 집들은 역사적 가치 또한 지닌 것으로 밝혀졌다."]],"w":"3~6번에서 인형의 집은 수제 물건과 유명 화가의 그림이 있고 돈이 많이 든 호화로운 집이에요. luxurious는 '사치스러운, 호화로운'이라는 뜻이에요.","c":2},"h":"60d016a5ea"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nIt is no wonder that the owners spent a lot of money creating them.","ko":"밑줄 친 \"them\"이 가리키는 것은?","sko":"소유자들이 그것들을 만드는 데 많은 돈을 쓴 것은 조금도 놀랄 일이 아니다.","opts":["인형의 집들","소유자들","유명한 화가들","성인 여성들"],"r":{"a":"1) 인형의 집들","ev":"6번 문장","s":[[6,"It is no wonder that the owners spent a lot of money creating them.","소유자들이 그것들을 만드는 데 많은 돈을 쓴 것은 조금도 놀랄 일이 아니다."]],"w":"8번에서 Collecting them(그것들을 모으는 것)은 취미로 여겨졌다고 해요. 바로 앞 7번에서 말한 these houses, 즉 인형의 집이에요.","c":1,"k":"them = 인형의 집들"},"pron":"them","h":"ce8ede4a72"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since the real homes are no longer around, we can look at these old dollhouses to see how people lived at that time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"실제 집들이 더 이상 주위에 없기 때문에, 우리는 그 당시에 사람들이 어떻게 살았는지 알기 위해 이 오래된 인형의 집들을 살펴볼 수 있다.","opts":["실제 집들이 더 이상 남아 있지 않아서, 오래된 인형의 집을 보면 당시 사람들이 어떻게 살았는지 알 수 있다.","실제 집들이 아직 많이 남아 있어서, 인형의 집을 살펴볼 필요가 없다.","인형의 집이 모두 사라져서, 당시 사람들이 어떻게 살았는지 알 수 없다.","당시 사람들이 어떻게 살았는지 알기 위해, 우리는 인형의 집을 모두 없애야 한다."],"r":{"a":"1) 실제 집들이 더 이상 남아 있지 않아서, 오래된 인형의 집을 보면 당시 사람들이 어떻게 살았는지 알 수 있다.","ev":"11번 문장","s":[[11,"Since the real homes are no longer around, we can look at these old dollhouses to see how people lived at that time.","실제 집들이 더 이상 주위에 없기 때문에, 우리는 그 당시에 사람들이 어떻게 살았는지 알기 위해 이 오래된 인형의 집들을 살펴볼 수 있다."]],"w":"11번 문장은 실제 집들이 더 이상 없으니(Since the real homes are no longer around), 인형의 집을 보면 그 당시 사람들이 어떻게 살았는지 알 수 있다는 뜻이에요.","c":1},"h":"d5c5da93aa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["일부 오래된 인형의 집에는 매우 오래된 유럽의 집 내부에만 존재했던 특별한 방들이 있다.","17, 18세기의 인형의 집은 어린아이들의 장난감이었다.","인형의 집 안에는 단순한 물건이 몇 개만 있었다.","소유자들은 인형의 집에 돈을 거의 쓰지 않았다."],"opts":["Some old dollhouses have special rooms that existed only inside very old European houses.","Dollhouses in the 17th and 18th century were toys for young children.","The dollhouses had only a few simple objects inside.","The owners spent very little money on their dollhouses."],"r":{"a":"1) Some old dollhouses have special rooms that existed only inside very old European houses.","ev":"3~4번, 6~7번, 10번 문장","s":[[3,"They also contained many objects in each room, including tiny books, furniture, and dishes.","그것들은 또한 각 방에, 아주 작은 책들과 가구 그리고 접시들을 포함하여 많은 물건들이 들어 있었다."],[4,"Each of the objects was handmade and decorated in great detail.","각각의 물건들은 수제였고 아주 세밀하게 장식되었다."],[6,"It is no wonder that the owners spent a lot of money creating them.","소유자들이 그것들을 만드는 데 많은 돈을 쓴 것은 조금도 놀랄 일이 아니다."],[7,"Interestingly, these houses were not toys to play with.","흥미롭게도, 이 집들은 가지고 놀 장난감이 아니었다."],[10,"Some of them have special rooms that existed only inside very old European houses.","그것들 중 몇몇은 매우 오래된 유럽의 집 내부에만 존재했던 특별한 방들이 있다."]],"w":"10번에서 일부 인형의 집에는 아주 오래된 유럽의 집 내부에만 있었던 특별한 방이 있다고 해요. 인형의 집은 장난감이 아니었고(7번), 안에 물건이 많았으며(3번), 진짜 집들은 이제 남아 있지 않아요(11번).","c":1},"h":"d30e1c41a2"},{"n":9,"t":"sum","q":"They also (A) many objects in each room, including tiny books, (B), and dishes.","ko":"그것들은 또한 각 방에, 아주 작은 책들과 (B) 그리고 접시들을 포함하여 많은 물건들이 (A).","oko":["(A) 없었다 / (B) 가구","(A) 들어 있었다 / (B) 동물","(A) 들어 있었다 / (B) 가구","(A) 없었다 / (B) 동물","(A) 팔았다 / (B) 정원"],"opts":["(A) lacked / (B) furniture","(A) contained / (B) animals","(A) contained / (B) furniture","(A) lacked / (B) animals","(A) sold / (B) gardens"],"r":{"a":"3) (A) contained / (B) furniture (들어 있었다 / 가구)","ev":"3번 문장","s":[[3,"They also contained many objects in each room, including tiny books, furniture, and dishes.","그것들은 또한 각 방에, 아주 작은 책들과 가구 그리고 접시들을 포함하여 많은 물건들이 들어 있었다."]],"w":"3번에서 각 방에 작은 책, 가구, 접시 같은 많은 물건(objects)이 있었고, 4번에서 각각의 물건은 수제(handmade)이고 세밀하게 장식되었다고 해요.","c":3},"h":"79d3c8677f"},{"n":10,"t":"fill","q":"In 17th and 18th century Europe, some [A] women had dollhouses that looked exactly like real homes but were [B].","ko":"17, 18세기 유럽에서, 몇몇 [A] 여인들은 실제 집과 똑같이 보이지만 [B] 인형의 집들을 가지고 있었다.","bank":["wealthy","smaller","paintings","owners","dishes","century"],"bko":{"wealthy":"부유한","smaller":"더 작은","paintings":"그림들","owners":"소유자들","dishes":"접시들","century":"세기"},"r":{"a":"[A] wealthy (부유한), [B] smaller (더 작은)","ev":"1번 문장","s":[[1,"In 17th and 18th century Europe, some wealthy women had dollhouses that looked exactly like real homes but were smaller.","17, 18세기 유럽에서, 몇몇 부유한 여인들은 실제 집과 똑같이 보이지만 더 작은 인형의 집들을 가지고 있었다."]],"w":"1번 문장에서 부유한(wealthy) 여인들이 실제 집과 똑같이 보이지만 더 작은(smaller) 인형의 집을 가지고 있었다고 해요.","c":null},"h":"887f6b296f"}]},{"u":4,"id":"rj4-04-4","no":4,"ko":"누가 여자고 누가 남자게?","items":[{"n":1,"t":"tf","q":"The women in many of Michelangelo’s paintings look unnatural.","ko":"미켈란젤로의 많은 그림 속 여성들은 부자연스럽게 보인다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The appearances of the women in many of his paintings are unnatural.","그의 많은 그림들 속 여성들의 모습이 부자연스럽다."]],"w":"3번 문장에서 그의 많은 그림 속 여성들의 모습이 부자연스럽다(unnatural)고 해요.","c":"T"},"h":"a4d55f630e"},{"n":2,"t":"tf","q":"The women in the paintings have narrow shoulders and broad hips.","ko":"그림 속 여성들은 좁은 어깨와 넓은 엉덩이를 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"They have broad shoulders and narrow hips.","그들은 넓은 어깨와 좁은 엉덩이를 가진다."]],"w":"8번에서 그 여성들은 넓은 어깨(broad shoulders)와 좁은 엉덩이(narrow hips)를 가졌다고 해요. 어깨와 엉덩이가 반대로 되어 있어요.","c":"F"},"h":"44b83778c8"},{"n":3,"t":"tf","q":"Researchers studied the women painted on the ceiling of the Sistine Chapel.","ko":"연구원들은 시스티나 성당의 천장에 그려진 여성들을 연구했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Researchers studied the women painted on the ceiling of the Sistine Chapel, one of Michelangelo’s masterpieces.","연구원들은 미켈란젤로의 걸작들 중 하나인 시스티나 성당의 천장에 그려진 여성들을 연구했다."]],"w":"6번 문장에서 연구원들이 시스티나 성당의 천장에 그려진 여성들을 연구했다고 해요.","c":"T"},"h":"243648cc64"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The appearances of the women in many of his paintings are unnatural.)","ko":"그의 많은 그림들 속 여성들의 모습이 ( ).","opts":["아름답다","부자연스럽다","평범하다","편안하다"],"word":"unnatural","r":{"a":"2) 부자연스럽다","ev":"3~4번 문장","s":[[3,"The appearances of the women in many of his paintings are unnatural.","그의 많은 그림들 속 여성들의 모습이 부자연스럽다."],[4,"Many seem too muscular to be women.","많은 이들이 여성이라기엔 너무 근육질로 보인다."]],"w":"3번에서 여성들의 모습이 ( )하다고 한 뒤, 4번에서 여성이라기엔 너무 근육질로 보인다고 이어져요. un-이 붙은 unnatural은 natural(자연스러운)의 반대로 '부자연스러운'이에요.","c":2},"h":"1bd531d2c7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (So, most likely, Michelangelo made sketches of male models and painted women’s clothing on top of them to complete his paintings.)","ko":"그래서, 아마도 틀림없이, 미켈란젤로는 남성 모델들의 스케치들을 그렸고 그의 그림들을 ( ) 위해 그 위에 여성의 옷을 그렸을 것이다.","opts":["시작하기","설명하기","지우기","완성하기"],"word":"complete","r":{"a":"4) 완성하기","ev":"12번 문장","s":[[12,"So, most likely, Michelangelo made sketches of male models and painted women’s clothing on top of them to complete his paintings.","그래서, 아마도 틀림없이, 미켈란젤로는 남성 모델들의 스케치들을 그렸고 그의 그림들을 완성하기 위해 그 위에 여성의 옷을 그렸을 것이다."]],"w":"12번에서 스케치를 그리고 그 위에 여성의 옷을 그려서 그림이 마무리돼요. to complete his paintings는 '그의 그림들을 완성하기 위해'라는 뜻이에요.","c":4},"h":"e53a301715"},{"n":6,"t":"ref","q":"What does the underlined \"His\" refer to?\nI am sure you have heard of the great Italian artist Michelangelo. His paintings are all amazing, but if you look closely, you might discover something strange.","ko":"밑줄 친 \"His\"가 가리키는 것은?","sko":"당신이 위대한 이탈리아의 화가인 미켈란젤로에 대해 들어본 적이 있을 것이라고 나는 확신한다. 그의 그림들은 모두 놀랍지만, 만약 당신이 자세히 살펴본다면, 당신은 이상한 점을 발견할지도 모른다.","opts":["미켈란젤로","독자","연구원들","이탈리아"],"r":{"a":"1) 미켈란젤로","ev":"1~2번 문장","s":[[1,"I am sure you have heard of the great Italian artist Michelangelo.","당신이 위대한 이탈리아의 화가인 미켈란젤로에 대해 들어본 적이 있을 것이라고 나는 확신한다."],[2,"His paintings are all amazing, but if you look closely, you might discover something strange.","그의 그림들은 모두 놀랍지만, 만약 당신이 자세히 살펴본다면, 당신은 이상한 점을 발견할지도 모른다."]],"w":"12번에서 먼저 남성 모델들의 스케치를 그리고, 그 스케치 위에 여성의 옷을 그렸다고 해요. painted women’s clothing on top of them에서 them은 바로 앞의 sketches of male models(남성 모델들의 스케치)예요.","c":1,"k":"His = 미켈란젤로"},"pron":"His","h":"387196eed0"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"According to the study, the women have many features unique to the male body.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 연구에 따르면, 그 여성들은 남성 신체의 고유한 많은 특징들을 가진다.","opts":["그 연구에 따르면, 그림 속 여성들은 남성의 몸에서만 볼 수 있는 특징을 많이 가지고 있다.","그 연구에 따르면, 그림 속 여성들은 여성의 몸에서만 볼 수 있는 특징을 많이 가지고 있다.","그 연구에 따르면, 그림 속 남성들은 여성의 몸과 같은 특징을 많이 가지고 있다.","그 연구에 따르면, 그림 속 여성들에게는 특별한 특징이 하나도 없다."],"r":{"a":"1) 그 연구에 따르면, 그림 속 여성들은 남성의 몸에서만 볼 수 있는 특징을 많이 가지고 있다.","ev":"7번 문장","s":[[7,"According to the study, the women have many features unique to the male body.","그 연구에 따르면, 그 여성들은 남성 신체의 고유한 많은 특징들을 가진다."]],"w":"7번 문장의 features unique to the male body는 남성의 몸에만 있는 특징이라는 뜻이에요. 그래서 그림 속 여성들이 남성 몸의 특징을 많이 가졌다는 말이에요.","c":1},"h":"a68cdd854c"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["미켈란젤로의 그림은 하나도 놀랍지 않다.","미켈란젤로는 어떤 모델도 쓰지 않고 여성들을 그렸다.","미켈란젤로의 시대에는 여성 모델을 찾기 쉬웠다.","미켈란젤로의 시대에는 여성 모델을 찾는 것이 아마 어려웠을 것이다."],"opts":["Michelangelo’s paintings are not amazing at all.","Michelangelo painted the women without using any models.","It was easy to find female models in Michelangelo’s time.","It was probably difficult to find female models in Michelangelo’s time."],"r":{"a":"4) It was probably difficult to find female models in Michelangelo’s time. (미켈란젤로의 시대에는 여성 모델을 찾는 것이 아마 어려웠을 것이다.)","ev":"11번 문장","s":[[11,"No one knows for sure, but it was probably difficult to find female models at that time.","아무도 확실히 알지 못하지만, 그 당시에 여성 모델들을 찾는 것이 아마 어려웠을 것이다."]],"w":"11번 문장에서 그 당시에는 여성 모델을 찾는 것이 아마 어려웠을 것이라고 해요.","c":4},"h":"7544230bed"},{"n":9,"t":"sum","q":"This (A) Michelangelo likely used male models to (B) the women.","ko":"이것은 미켈란젤로가 여성들을 (B) 위해 아마도 남성 모델들을 썼다는 것을 (A).","oko":["(A) 숨긴다 / (B) 지우기","(A) 의미한다 / (B) 지우기","(A) 숨긴다 / (B) 그리기","(A) 의미한다 / (B) 그리기","(A) 의미한다 / (B) 파괴하기"],"opts":["(A) hides / (B) erase","(A) means / (B) erase","(A) hides / (B) draw","(A) means / (B) draw","(A) means / (B) destroy"],"r":{"a":"4) (A) means / (B) draw (의미한다 / 그리기)","ev":"10번 문장","s":[[10,"This means Michelangelo likely used male models to draw the women.","이것은 미켈란젤로가 여성들을 그리기 위해 아마도 남성 모델들을 썼다는 것을 의미한다."]],"w":"10번 문장에서 이것은(This) 미켈란젤로가 여성들을 그리기(draw) 위해 아마도 남성 모델들을 썼다는 것을 의미한다(means)고 해요.","c":4},"h":"6ba3a93f7f"},{"n":10,"t":"fill","q":"Actually, a study was [A] on this [B].","ko":"실제로, 이 [B]에 대해 한 연구가 [A].","bank":["conducted","subject","models","narrow","unique","difficult"],"bko":{"conducted":"시행되었다(conduct의 과거분사)","subject":"주제","narrow":"좁은","unique":"고유한","difficult":"어려운","models":"모델들"},"r":{"a":"[A] conducted (시행되었다(conduct의 과거분사)), [B] subject (주제)","ev":"5번 문장","s":[[5,"Actually, a study was conducted on this subject.","실제로, 이 주제에 대해 한 연구가 시행되었다."]],"w":"10번에서 여성들을 그리려고 남성 모델들(male models)을 썼을 것이라고 하고, 12번에서 남성 모델들의 스케치 위에 여성의 옷(clothing)을 그렸을 거라고 해요. 11번에는 여성 모델을 구하기 어려웠을 거라는 말이 있어서, 여성 모델을 썼다는 뜻이 아니에요.","c":null},"h":"83b35c734f"}]},{"u":5,"id":"rj4-05-1","no":1,"ko":"생명을 지키는 뜨개질","items":[{"n":1,"t":"tf","q":"Aymara women traditionally knit clothes and blankets.","ko":"Aymara 여성들은 전통적으로 옷과 담요를 뜬다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Aymara women traditionally knit clothes and blankets.","Aymara 여성들은 전통적으로 옷과 담요를 (실로) 뜬다."]],"w":"7번 문장에 Aymara women traditionally knit clothes and blankets가 그대로 나와요. 옷과 담요를 뜨는 것이 전통이라는 내용과 일치해요.","c":"T"},"h":"86da8d1c43"},{"n":2,"t":"tf","q":"Babies with a hole in their heart can breathe easily and grow well.","ko":"심장에 구멍이 있는 아기들은 쉽게 숨을 쉬고 잘 자랄 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"Some of these newborns have a hole in their heart.","이 신생아 중 일부는 심장에 구멍을 가지고 있다."],[3,"They struggle to breathe and do not grow properly.","그들은 숨 쉬는 데 고군분투하고 제대로 자라지 못한다."]],"w":"2번에서 심장에 구멍이 있는 아기들이 나오고, 3번에서 그 아기들은 숨 쉬는 데 고군분투하고 제대로 자라지 못한다고 해요. 쉽게 숨 쉬고 잘 자란다는 말은 반대예요.","c":"F"},"h":"3fc6976f9a"},{"n":3,"t":"tf","q":"It took about three hours to insert the device into the heart and close the hole.","ko":"그 장치를 심장에 삽입하고 구멍을 막는 데 세 시간쯤 걸렸다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Because the device was very small and sophisticated, it took only 30 minutes to insert it into the heart and close the hole.","그 장치는 매우 작고 정교했기 때문에, 그것을 심장에 삽입하고 구멍을 막는 데 30분밖에 걸리지 않았다."]],"w":"10번에서 장치를 심장에 삽입하고 구멍을 막는 데 only 30 minutes(30분밖에) 걸렸다고 해요. 세 시간은 본문과 달라요.","c":"F"},"h":"6cfd3fb816"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Since its initial success in Bolivia, the device has been used to save babies...)","ko":"볼리비아에서의 ( ) 성공 이후로, 그 장치는 아기들을 구하는 데 사용되어 왔다.","opts":["마지막의","처음의","가짜의","비싼"],"word":"initial","r":{"a":"2) 처음의","ev":"12번 문장","s":[[12,"Since its initial success in Bolivia, the device has been used to save babies in nearly 60 other countries.","볼리비아에서 첫 성공 이후로 그 장치는 거의 60개의 다른 나라에서도 아기들을 구하는 데 사용되어 오고 있다."]],"w":"12번은 볼리비아에서의 첫 성공 이후로 다른 나라에서도 쓰였다는 내용이에요. 그래서 initial은 '처음의'예요.","c":2},"h":"6543f0d242"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Because the device was very small and sophisticated, it took only 30 minutes...)","ko":"그 장치는 매우 작고 ( ) 때문에, 30분밖에 걸리지 않았다.","opts":["투박한","무거운","값싼","정교한"],"word":"sophisticated","r":{"a":"4) 정교한","ev":"10번 문장","s":[[10,"Because the device was very small and sophisticated, it took only 30 minutes to insert it into the heart and close the hole.","그 장치는 매우 작고 정교했기 때문에, 그것을 심장에 삽입하고 구멍을 막는 데 30분밖에 걸리지 않았다."]],"w":"작고 정교하게 만들어졌기 때문에 심장에 넣고 구멍을 막는 데 30분밖에 안 걸렸다는 흐름이에요. 그래서 sophisticated는 '정교한'이에요.","c":4},"h":"0a9a719b75"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt had to be small enough to fit in their tiny hearts.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 그 아이들의 작은 심장에 맞을 만큼 충분히 작아야 했다.","opts":["아기","볼리비아의 의사","아기들을 도울 장치","심장의 구멍"],"r":{"a":"3) 아기들을 도울 장치","ev":"4~5번 문장","s":[[4,"A doctor in Bolivia decided to create a device that can help these babies.","볼리비아의 한 의사는 이러한 아기들을 도울 수 있는 장치를 만들기로 결심했다."],[5,"It had to be small enough to fit in their tiny hearts.","그것은 그 아이들의 작은 심장에 맞을 만큼 충분히 작아야 했다."]],"w":"4번에서 의사가 아기들을 도울 수 있는 장치(a device)를 만들기로 했고, 5번의 It은 그 장치예요. 심장에 맞을 만큼 작아야 하는 것은 장치예요.","c":3},"h":"b1428a942f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This made the doctor think of the Aymara people.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 점은 의사가 Aymara 사람들을 떠올리게 했다.","opts":["이 점은 의사가 Aymara 사람들을 떠올리게 했다.","Aymara 사람들이 이 의사를 떠올리게 되었다.","의사는 Aymara 사람들을 만나러 볼리비아를 떠났다.","의사는 Aymara 사람들 때문에 장치 만들기를 그만두었다."],"r":{"a":"1) 이 점은 의사가 Aymara 사람들을 떠올리게 했다.","ev":"6번 문장","s":[[6,"This made the doctor think of the Aymara people.","이 점은 의사가 Aymara 사람들을 떠올리게 했다."]],"w":"made the doctor think of ~는 '의사가 ~을 떠올리게 했다'예요. 떠올린 쪽은 의사이고, 떠오른 대상이 Aymara 사람들이에요. 다른 보기는 6번에 없는 내용이에요.","c":1},"h":"5fc101d2fe"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 장치는 아기들의 작은 심장에 들어가기에는 너무 컸다.","전 세계 아기 100명 중 1명은 심장병을 앓는다.","의사는 그 장치를 혼자서 직접 뜨개질로 만들었다.","아기들은 그 장치를 쓴 뒤 몸이 아파졌다."],"opts":["The device was too large for babies' tiny hearts.","One in every hundred babies in the world suffers from heart disease.","The doctor knitted the device by himself.","Babies became sick after using the device."],"r":{"a":"2) One in every hundred babies in the world suffers from heart disease. (전 세계 아기 100명 중 1명은 심장병을 앓는다.)","ev":"1번, 5번, 8번, 11번 문장","s":[[1,"One of every hundred babies born across the world suffers from heart disease.","전 세계에서 태어난 100명의 아기 중 한 명은 심장병을 앓는다."],[5,"It had to be small enough to fit in their tiny hearts.","그것은 그 아이들의 작은 심장에 맞을 만큼 충분히 작아야 했다."],[8,"He asked some of the Aymara women to use their knitting skills to make the device.","그 의사는 Aymara 여성들 중 몇 명에게 그 장치를 만들기 위해 뜨개질 기술을 사용해달라고 부탁했다."],[11,"Thanks to this device, the babies could avoid major surgery.","이 장치 덕분에 아기들은 큰 수술을 피할 수 있었다."]],"w":"12번에서 거의 60개의 다른 나라에서 사용되어 왔다고 해요. 장치는 아기 심장에 맞게 작았고(5번), 의사는 Aymara 여성들에게 부탁했고(8번), 아기들은 큰 수술을 피할 수 있었어요(11번).","c":2},"h":"910ba8474b"},{"n":9,"t":"sum","q":"A doctor in Bolivia (A) to (B) a device that can help these babies.","ko":"볼리비아의 한 의사는 이러한 아기들을 도울 수 있는 장치를 (B) 것을 (A).","oko":["(A) 거절했다 / (B) 파는","(A) 결심했다 / (B) 부수는","(A) 결심했다 / (B) 만드는","(A) 거절했다 / (B) 부수는","(A) 잊
