<style>

-s를 붙이고, 둘 이상이면 -s를 붙이지 않아요. People(사람들)은 여러 명이라 celebrate, The stars(주인공들)도 여러 개라 are예요. 반대로 This festival(축제 하나)은 하나라서 takes처럼 -s가 붙어요.", "c": "b"}, {"t": "take place · from A to B", "x": "take place는 두 단어가 한 덩어리로 “열리다”라는 뜻의 동사예요. from March 15 to 19는 from A to B(A부터 B까지) 모양이라 “3월 15일부터 19일까지”예요.", "c": "g"}, {"t": "during + 명사 = ~ 동안", "x": "during 뒤에는 the festival 같은 명사가 와요. during the festival은 “축제 기간 동안”이에요.", "c": "b"}, {"t": "동격 : 쉼표로 다시 설명하기", "x": "fallas와 giant wooden statues는 같은 것을 가리켜요. 쉼표 뒤에서 앞말을 한 번 더 설명해 주는 거예요. “거대한 나무 조각상인 파야들”처럼 읽어요.", "c": "b"}, {"t": "hundreds of ~ = 수백 개의 ~", "x": "hundred에 -s가 붙은 hundreds of는 “수백 개의 ~”예요. 뒤에는 them이나 복수명사가 와요.", "c": "g"}, {"t": "수동태 : be동사 + 과거분사", "x": "are burned는 “불태워진다”예요. 파야들이 불을 지르는 쪽이 아니라 불태움을 당하는 쪽이라서 수동태를 써요. on the last day처럼 “날”에는 전치사 on을 써요.", "c": "b"}, {"t": "동명사 주어 : ~하는 것은", "x": "Burning them은 “그것들을 태우는 것은”이라는 뜻의 주어예요. 동사에 -ing를 붙여 “~하는 것”으로 쓰는 걸 동명사라고 해요. 동명사 주어는 하나로 보기 때문에 symbolizes처럼 -s가 붙어요. 뒤의 saying goodbye ~도 “작별하는 것”이라는 동명사예요.", "c": "b"}, {"t": "대명사 them = 파야들", "x": "them은 앞에 나온 fallas를 가리키는 대명사예요. 5번의 them도, 7번의 Burning them(그것들을 태우는 것)의 them도 모두 파야들이에요. 대명사가 나오면 “누구? 무엇?”을 바로 앞에서 찾아요.", "c": "o"}]}, {"no": "2", "sym": "❷", "en": "Midsummer Festival in Sweden", "ko": "스웨덴의 한여름 축제", "sents": [{"n": 8, "rows": [["Winter in Sweden is long and dark, /", "스웨덴의 겨울은 길고 어둡다, /"], ["so the people there especially welcome summer.", "그래서 그곳 사람들은 여름을 특히 환영한다."]], "nat": "스웨덴의 겨울은 길고 어두워서 그곳 사람들은 여름을 특히 환영한다.", "mk": "Winter in Sweden is long and dark, [1|so] the people there especially welcome summer."}, {"n": 9, "rows": [["To celebrate the longest day of the year, /", "일 년 중 낮이 가장 긴 날을 기념하기 위해 /"], ["they have a special festival.", "그들은 특별한 축제를 연다."]], "nat": "일 년 중 낮이 가장 긴 날을 기념하기 위해 그들은 특별한 축제를 연다.", "mk": "[2|To celebrate] [3|the longest day of the year], [9|they] have a special festival."}, {"n": 10, "rows": [["They call it the Midsummer festival.", "그들은 그것을 한여름 축제라고 부른다."]], "nat": "이 축제   if(S.corner=='gr'&&S.drill)return h+vDrill();
  if(S.corner=='an'){
    return h+'<h2>7과 핵심 문장 분석</h2><div class="sub" style="margin-bottom:10px">본문 26문장을 4일에 나눠 한 문장씩 뜯어 봐요.</div>'+
    [1,2,3,4].map(function(d){return '<div class="card"><b style="font-size:16px">Day '+d+'</b> <span class="sub">'+DAYS[d]+'</span><a class="cta k" href="../basic/?day='+d+'"><b>기본</b><span>우리말 순서부터 차근차근</span></a><a class="cta s" href="../adv/?day='+d+'"><b>심화</b><span>덩어리 안쪽까지 파고들기</span></a></div>'}).join('')}
  h+=psel();
  var a=s.sents[0].n,b=s.sents[s.sents.length-1].n;
  if(S.corner=='tr'){
    h+='<div class="row"><div><h2 style="margin:0">7과 · 본문 '+s.sym+' 문장 해석</h2><div class="sub">'+esc(s.ko)+' · '+a+'~'+b+'번</div></div></div>';
    h+='<div class="tog"><button id="b1" class="'+(S.hide?'':'on')+'">해석 보이기</button><button id="b2" class="'+(S.hide?'on':'')+'">해석 가리기</button></div><div class="sub" style="margin:0 2px 6px">해석을 가렸을 때는 한 줄씩 눌러서 열어 보세요.</div>';
    h+='<div id="list" class="'+(S.hide?'hide':'')+'">'+s.sents.map(function(x){return '<div class="card"><div class="no">'+x.n+'</div>'+x.rows.map(function(r){return '<div class="pair"><div class="en">'+esc(r[0])+'</div><div class="ko">'+esc(r[1])+'</div></div>'}).join('')+'<div class="nat">'+esc(x.nat)+'</div></div>'}).join('')+'</div>';
  }else{
    h+='<h2>7과 · 본문 '+s.sym+' 문법 설명</h2><div class="sub" style="margin-bottom:8px">'+a+'~'+b+'번</div>'+legend();
    h+='<div class="sub" style="font-weight:800;margin:2px 2px 6px">색깔별로 모아서 풀어 보기 (백지복습)</div>'+drillBar('');
    h+='<div class="card"><div class="sub" style="font-weight:800;margin-bottom:4px">본문에서 찾아요 · 색칠한 부분을 아래 같은 번호와 연결해요</div>'+s.sents.map(function(x){return '<div class="ps"><i>'+x.n+'</i><span>'+plainMark(x.mk,s)+'</span></div>'}).join('')+'</div>';
    h+=s.items.map(function(it,i){var c=D.cat[it.c];return '<div class="it" style="background:'+c.l+'88;border:1.5px solid '+c.d+'"><h4><span class="b l" style="background:'+c.d+'">'+(i+1)+'</span><span style="color:'+c.d+';flex:1">'+esc(it.t)+'</span><span style="font-size:11.5px;color:#fff;background:'+c.d+';border-radius:99px;padding:2px 9px">'+(it.c=='g'?'어휘·청크':esc(c.n))+'</span></h4><p>'+esc(it.x)+'</p></div>'}).join('');
  }
  return h}
function ymd(d){return d.getFullYear()+'-'+('0'+(d.getMonth()+1)).slice(-2)+'-'+('0'+d.getDate()).slice(-2)}
function vToday(){
  var now=new Date(),t=ymd(now);
  if(!S.ym)S.ym=[now.getFullYear(),now.getMonth()];
  if(!S.sel)S.sel=t;
  var y=S.ym[0],m=S.ym[1],first=new Date(y,m,1),lead=(first.getDay()+6)%7,days=new Date(y,m+1,0).getDate();
  var g='';for(var i=0;i<lead;i++)g+='<button disabled></button>';
  for(var d=1;d<=days;d++){var key=y+'-'+('0'+(m+1)).slice(-2)+'-'+('0'+d).slice(-2),col=(lead+d-1)%7,c=[];
    if(col==6)c.push('sun');if(SCHEDULE[key])c.push('l7');if(key==t)c.push('today');if(key==S.sel)c.push('sel');
    g+='<button data-d="'+key+'" class="'+c.join(' ')+'">'+d+'</button>'}
  var h='<div class="mon"><h2 style="margin:0">오늘의 학습</h2><div><button id="pm">‹</button><b>'+y+'년 '+(m+1)+'월</b><button id="nm">›</button></div></div>';
  h+='<div class="cal"><div class="hd"><div>월</div><div>화</div><div>수</div><div>목</div><div>금</div><div>토</div><div>일</div></div><div class="gr">'+g+'</div></div>';
  var sd=S.sel.split('-'),dt=new Date(+sd[0],+sd[1]-1,+sd[2]),wk='일월화수목금토'[dt.getDay()];
  h+='<div class="row" style="margin-top:14px"><b style="font-size:16px">'+(+sd[1])+'월 '+(+sd[2])+'일 '+wk+'요일</b>'+(SCHEDULE[S.sel]?'<span class="sub">7과 · 축제</span>':'')+'</div>';
  var dn=SCHEDULE[S.sel];
  if(dn){h+='<div class="card" style="border:1.5px solid #8fb3ac;padding:14px"><b style="font-size:18px">문장 분석</b><div class="sub">7과 · Day '+dn+' · '+DAYS[dn]+' 문장</div><div style="display:flex;gap:8px"><a class="cta k" style="flex:1" href="../basic/?day='+dn+'"><b>기본</b><span>우리말 순서부터 차근차근</span></a><a class="cta s" style="flex:1" href="../adv/?day='+dn+'"><b>심화</b><span>덩어리 안쪽까지 파고들기</span></a></div></div>'}
  else h+='<div class="card sub">이 날은 정해진 학습이 없어요.</div>';
  return h}
function vKey(){return '<h2>답안지</h2><div class="card sub" style="margin-top:10px">7과·8과 답안지는 곧 열려요.</div>'}
var ICON={text:'<path d="M6 3h9l4 4v14H6z"/><path d="M14 3v5h5"/><path d="M9 13h7M9 17h7"/>',key:'<rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12l3 3 5-6"/>',today:'<rect x="3" y="5" width="18" height="16" rx="3"/><path d="M3 10h18M8 3v4M16 3v4"/>'};
function render(){
  var v=S.tab=='text'?vText():S.tab=='key'?vKey():vToday();
  document.getElementById('app').innerHTML=v;
  document.getElementById('tabbar').innerHTML=[['text','원문'],['key','답안지'],['today','오늘의 학습']].map(function(x){return '<button data-t="'+x[0]+'" class="'+(S.tab==x[0]?'on':'')+'"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">'+ICON[x[0]]+'</svg><span>'+x[1]+'</span></button>'}).join('');
  window.scrollTo(0,0)}
document.addEventListener('click',function(e){
  var L=document.getElementById('list');
  if(L){
    var bb=e.target.closest('#b1,#b2');
    if(bb){S.hide=bb.id=='b2';L.classList.toggle('hide',S.hide);document.getElementById('b1').className=S.hide?'':'on';document.getElementById('b2').className=S.hide?'on':'';
      var o=L.querySelectorAll('.show');for(var i=0;i<o.length;i++)o[i].classList.remove('show');return}
    var bl=e.target.closest('.bl');if(bl){bl.classList.toggle('open');return}
    if(S.hide){var p=e.target.closest('.pair');if(p){p.querySelector('.ko').classList.toggle('show');return}
      var n=e.target.closest('.nat');if(n){n.classList.toggle('show');return}}
  }
  var t=e.target.closest('button');if(!t)return;
  if(t.dataset.t){S.tab=t.dataset.t}
  else if(t.dataset.c){S.corner=t.dataset.c;S.drill=null}
  else if(t.dataset.dr){S.drill=S.drill==t.dataset.dr?null:t.dataset.dr}
  else if(t.id=='dclose'){var o2=document.querySelectorAll('.bl.open');for(var q=0;q<o2.length;q++)o2[q].classList.remove('open');return}
  else if(t.dataset.s){S.sec=t.dataset.s}
  else if(t.dataset.d){S.sel=t.dataset.d}
  else if(t.id=='pm'||t.id=='nm'){var d=new Date(S.ym[0],S.ym[1]+(t.id=='pm'?-1:1),1);S.ym=[d.getFullYear(),d.getMonth()]}
  else return;
  render()});
try{var p=new URLSearchParams(location.search).get('tab');if(p)S.tab=p}catch(e){}
render();
</script></body></html>
