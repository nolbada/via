<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 5</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}

.row{display:flex;gap:10px;align-items:flex-start}.n{min-width:24px;color:var(--mut);font-size:13px;padding-top:3px}
.txt{font-size:18px;line-height:2}
.wd{cursor:pointer;border-radius:5px;padding:1px 2px;margin:0 1px;-webkit-tap-highlight-color:transparent}
.wd:hover{background:#eef3f8}.wd.on{background:var(--sel);box-shadow:inset 0 -2px 0 var(--selb)}
.locked .wd{cursor:default}.locked .wd:hover{background:none}
.wd.hit{background:var(--okbg);box-shadow:inset 0 -2px 0 var(--ok)}.wd.miss{background:var(--badbg);box-shadow:inset 0 -2px 0 var(--bad)}.wd.x{text-decoration:line-through;color:var(--mut)}
.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}
.note{margin:10px 0 0 34px;padding:10px 12px;border-radius:8px;font-size:14.5px}
.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}
button{font:inherit;background:var(--pri);color:#fff;border:0;border-radius:8px;padding:9px 18px;font-weight:700;cursor:pointer}
button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<div class="relay" id="relay"></div><div class="rn">RELAY &middot; 앞 단계를 끝내야 다음 단계 오픈</div><div class="bmw"><span id="bm" class="bmk" style="display:none">책갈피 저장됨 &middot; 다음에 이어서 풀기<button type="button">처음부터</button></span></div><div id="app"></div>
</div>
<script>
var D=[{"n": 1, "tag": null, "en": "The new school year is here! Do you get nervously when you talks to other students?", "ko": "새 학년이 되었다! 당신은 다른 학생들과 대화할 때 긴장되는가?", "ok": false, "foot": [], "fixes": [{"wrong": "nervously", "right": "nervous", "partial": false, "at": [9], "point": "어법: get 뒤에는 형용사 nervous가 보어로 옴 (부사 nervously 아님)", "topic": "어법", "memo": "get 뒤에는 형용사 nervous가 보어로 옴 (부사 nervously 아님)"}, {"wrong": "talks", "right": "talk", "partial": false, "at": [12], "point": "수일치: 주어 you 뒤에는 동사원형 talk 사용", "topic": "수일치", "memo": "주어 you 뒤에는 동사원형 talk 사용"}]}, {"n": 2, "tag": null, "en": "Do you have trouble to start conversations?", "ko": "당신은 대화를 시작하는 데 어려움이 있는가?", "ok": false, "foot": [], "fixes": [{"wrong": "to start", "right": "starting", "partial": false, "at": [4], "point": "어법: have trouble (in) v-ing는 '~하는 데 어려움을 겪다'라는 뜻의 관용표현으로 동명사 starting 사용", "topic": "어법", "memo": "have trouble (in) v-ing는 '~하는 데 어려움을 겪다'라는 뜻의 관용표현으로 동명사 starting 사용"}]}, {"n": 3, "tag": null, "en": "Having a good conversation is not easy.", "ko": "대화를 잘하는 것은 쉽지 않다.", "ok": true, "foot": [], "fixes": []}, {"n": 4, "tag": null, "en": "But doesn’t worry. Here are some tips for having a good conversation.", "ko": "하지만 걱정하지 마라. 여기 좋은 대화를 나누기 위한 몇 가지 조언이 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "doesn’t", "right": "don’t", "partial": false, "at": [1], "point": "어법: 명령문의 부정형은 Don’t + 동사원형으로 씀 (doesn’t 아님)", "topic": "어법", "memo": "명령문의 부정형은 Don’t + 동사원형으로 씀 (doesn’t 아님)"}, {"wrong": "for having", "right": "to have", "partial": false, "at": [7], "point": "어법: 명사 tips를 꾸미는 to부정사의 형용사적 용법 (tips to have)", "topic": "어법", "memo": "명사 tips를 꾸미는 to부정사의 형용사적 용법 (tips to have)"}]}, {"n": 5, "tag": "Tip 1 · 가벼운 대화로 시작하기", "en": "Begin conversations with a easy topic. Talk about the weather or hobbies.", "ko": "쉬운 주제로 대화를 시작해라. 날씨나 취미에 관해 말해라.", "ok": false, "foot": [], "fixes": [{"wrong": "a", "right": "an", "partial": false, "at": [3], "point": "관사: 모음으로 시작하는 easy 앞에는 부정관사 an 사용", "topic": "관사", "memo": "모음으로 시작하는 easy 앞에는 부정관사 an 사용"}]}, {"n": 6, "tag": null, "en": "For example, say, “The weather is so nice today, doesn’t it?”", "ko": "예를 들면, “오늘 날씨가 아주 좋아, 그렇지 않니?”라고 말해라.", "ok": false, "foot": [], "fixes": [{"wrong": "doesn’t it", "right": "isn’t it", "partial": false, "at": [9], "point": "어법: 부가의문문은 앞 문장의 be동사 (is)를 부정형으로 반복 (isn’t it)", "topic": "어법", "memo": "부가의문문은 앞 문장의 be동사 (is)를 부정형으로 반복 (isn’t it)"}]}, {"n": 7, "tag": null, "en": "Then the other person can answer easily.", "ko": "그러면 상대방은 쉽게 대답할 수 있다.", "ok": true, "foot": [], "fixes": []}, {"n": 8, "tag": null, "en": "Small talk can lead to other funny topics to talk about.", "ko": "가벼운 대화는 대화할 다른 재미있는 주제로 이어질 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "funny", "right": "fun", "partial": false, "at": [6], "point": "어휘: funny는 '우스꽝스러운'이라는 뜻이고, '재미있는'은 fun 사용", "topic": "어휘", "memo": "funny는 '우스꽝스러운'이라는 뜻이고, '재미있는'은 fun 사용"}]}, {"n": 9, "tag": "Tip 2 · 적극적으로 듣기", "en": "Don’t just sitting still and listen. Active listen.", "ko": "그저 가만히 앉아서 듣지 마라. 적극적으로 들어라.", "ok": false, "foot": [], "fixes": [{"wrong": "sitting", "right": "sit", "partial": false, "at": [2], "point": "병렬구조: Don’t 뒤에는 동사원형이 and로 병렬 연결되어야 함 (sit – and listen)", "topic": "병렬구조", "memo": "Don’t 뒤에는 동사원형이 and로 병렬 연결되어야 함 (sit – and listen)"}, {"wrong": "Active", "right": "Actively", "partial": false, "at": [6], "point": "어법: 동사 listen을 수식하는 것은 부사 Actively (형용사 Active 아님)", "topic": "어법", "memo": "동사 listen을 수식하는 것은 부사 Actively (형용사 Active 아님)"}]}, {"n": 10, "tag": null, "en": "Do eye contact with the speaker.", "ko": "화자와 눈을 맞춰라.", "ok": false, "foot": [], "fixes": [{"wrong": "Do", "right": "Make", "partial": false, "at": [0], "point": "어휘: '눈을 맞추다'는 make eye contact (do가 아닌 make 사용)", "topic": "어휘", "memo": "'눈을 맞추다'는 make eye contact (do가 아닌 make 사용)"}]}, {"n": 11, "tag": null, "en": "Nodding your head from time to time.", "ko": "때때로 당신의 고개를 끄덕여라.", "ok": false, "foot": [], "fixes": [{"wrong": "Nodding", "right": "Nod", "partial": false, "at": [0], "point": "어법: 명령문은 동사원형으로 시작 (Nod)", "topic": "어법", "memo": "명령문은 동사원형으로 시작 (Nod)"}]}, {"n": 12, "tag": null, "en": "You can also says, “Right,” or “I see.”", "ko": "당신은 또한 “맞아.” 또는 “그렇구나.”라고 말할 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "says", "right": "say", "partial": false, "at": [3], "point": "어법: 조동사 can 뒤에는 동사원형 say 사용", "topic": "어법", "memo": "조동사 can 뒤에는 동사원형 say 사용"}]}, {"n": 13, "tag": null, "en": "These things will show that you’re really listen.", "ko": "이러한 것들은 당신이 정말로 듣고 있다는 것을 보여줄 것이다.", "ok": false, "foot": [], "fixes": [{"wrong": "listen", "right": "listening", "partial": false, "at": [7], "point": "현재진행형: be동사(you’re) + v-ing(listening) 사용", "topic": "현재진행형", "memo": "be동사(you’re) + v-ing(listening) 사용"}]}, {"n": 14, "tag": "Tip 3 · 몸짓 언어 사용하기", "en": "Use good gestures. When you say, “I don’t know,” you can raise both your shoulders or hands.", "ko": "적절한 몸짓을 사용해라. 당신이 “나는 모르겠어.”라고 말할 때, 당신의 어깨와 손을 둘 다 들어 올릴 수 있다.", "ok": false, "foot": ["1gestures 몸짓, 제스처"], "fixes": [{"wrong": "both your shoulders or hands", "right": "both your shoulders and hands", "partial": false, "at": [12], "point": "어법: both A and B 구문은 both 뒤에 and로 연결 (or 아님)", "topic": "어법", "memo": "both A and B 구문은 both 뒤에 and로 연결 (or 아님)"}]}, {"n": 15, "tag": null, "en": "You can also make face expressions. Lift your eyebrows or sticking out your lower lip.", "ko": "당신은 또한 얼굴 표정을 지을 수 있다. 눈썹을 올리거나 아랫입술을 내밀어라.", "ok": false, "foot": ["1eyebrows 눈썹"], "fixes": [{"wrong": "face", "right": "facial", "partial": false, "at": [4], "point": "어휘: '얼굴 표정'은 facial expressions (face가 아닌 형용사 facial 사용)", "topic": "어휘", "memo": "'얼굴 표정'은 facial expressions (face가 아닌 형용사 facial 사용)"}, {"wrong": "sticking", "right": "stick", "partial": false, "at": [10], "point": "병렬구조: 명령문에서 or로 연결된 두 동사원형 (Lift ~ or stick ~)", "topic": "병렬구조", "memo": "명령문에서 or로 연결된 두 동사원형 (Lift ~ or stick ~)"}]}, {"n": 16, "tag": null, "en": "Use good body language, and your message wil 것이다.", 0], ["Follow these tips, and everyone will want to talk with you.", "이 조언들을 따라라, 그러면 모든 사람이 당신과 이야기하고 싶어 할 것이다.", 0], ["You will be the greatest talker in the class.", "당신은 반에서 가장 대화를 잘하는 사람이 될 것이다.", 0]];var RNUM=5;var TITLE_EN="Have a Good Talk!";var PASS_EN=["Have a Good Talk!", "The new school year is here! Do you get nervous when you talk to other students? Do you have trouble starting conversations? Having a good conversation is not easy. But don’t worry. Here are some tips to have a good conversation.", "Begin conversations with an easy topic. Talk about the weather or hobbies. For example, say, “The weather is so nice today, isn’t it?” Then the other person can answer easily. Small talk can lead to other fun topics to talk about.", "Don’t just sit still and listen. Actively listen. Make eye contact with the speaker. Nod your head from time to time. You can also say, “Right,” or “I see.” These things will show that you’re really listening.", "Use good gestures. When you say, “I don’t know,” you can raise both your shoulders and hands. You can also make facial expressions. Lift your eyebrows or stick out your lower lip. Use good body language, and your message will be stronger and clearer.", "Be brave and tell your personal story. For example, you can talk about your childhood. You can say, “When I was 10, I was the slowest runner in my class.” When you open up, the other person will do the same. This can lead to a more meaningful conversation.", "Different people have different opinions. You need to respect others’ ideas. Say things like, “That’s really interesting.” When you disagree, you can say, “That’s a good point, but I have a different opinion.” Show respect to others, and they will show respect to you. Follow these tips, and everyone will want to talk with you. You will be the greatest talker in the class."];var PASS_KO=["좋은 대화를 나눠라!", "새 학년이 되었다! 당신은 다른 학생들과 대화할 때 긴장되는가? 당신은 대화를 시작하는 데 어려움이 있는가? 대화를 잘하는 것은 쉽지 않다. 하지만 걱정하지 마라. 여기 좋은 대화를 나누기 위한  else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';

function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');

});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}

document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});

 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
