<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>브릭스 중학독해 4 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"b4-01-1","no":1,"ko":"독감 주사, 왜 해마다 맞아야 할까?","items":[{"n":1,"t":"tf","q":"The flu spreads easily during the winter.","ko":"독감은 겨울 동안 쉽게 퍼진다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"The flu is a common illness that spreads easily during the winter.","독감은 겨울 동안 쉽게 퍼지는 흔한 병이다."]],"w":"1번 문장에 spreads easily during the winter가 있음. 겨울에 쉽게 퍼진다는 내용과 일치.","c":"T"},"h":"63d530b876"},{"n":2,"t":"tf","q":"Your body makes enough antibodies in just one day after the shot.","ko":"접종 후 단 하루 만에 몸이 충분한 항체를 만든다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"It usually takes about two weeks to produce enough of them to protect your body effectively.","몸을 효과적으로 보호할 만큼 충분한 항체를 만들어 내는 데는 보통 약 2주가 걸린다."]],"w":"7번 문장에 about two weeks(약 2주)가 걸린다고 나와 있음. 하루 만이라는 말은 본문과 다름.","c":"F"},"h":"1c8756f4d5"},{"n":3,"t":"tf","q":"You should get a new flu shot every year.","ko":"해마다 새 독감 예방접종을 맞아야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"Therefore, you must get a new flu shot every year to stay fully protected.","그러므로 완전히 보호받으려면 해마다 새 독감 예방접종을 맞아야 한다."]],"w":"12번 문장 you must get a new flu shot every year. 해마다 새로 맞아야 한다는 내용과 일치.","c":"T"},"h":"eb5f8bf932"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… enough of them to protect your body effectively.)","ko":"… 몸을 ( ) 보호할 만큼 충분한 …","opts":["우연히","효과적으로","느리게","조용히"],"word":"effectively","r":{"a":"2) 효과적으로","ev":"7번 문장","s":[[7,"It usually takes about two weeks to produce enough of them to protect your body effectively.","몸을 효과적으로 보호할 만큼 충분한 항체를 만들어 내는 데는 보통 약 2주가 걸린다."]],"w":"7번 문장은 항체를 충분히 만들어 몸을 잘 지킨다는 뜻이라 effectively = 효과적으로. 느리게는 반대 느낌이고, 우연히·조용히는 문맥에 안 맞음.","c":2},"h":"550c163570"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… you may have only a mild illness or not feel sick at all.)","ko":"… ( ) 병만 앓거나 전혀 아프지 않을 수도 있다.","opts":["심한","오래 가는","가벼운","전염되는"],"word":"mild","r":{"a":"3) 가벼운","ev":"9번 문장","s":[[9,"As a result, you may have only a mild illness or not feel sick at all.","그 결과, 가벼운 병만 앓거나 전혀 아프지 않을 수도 있다."]],"w":"9번 문장은 'only a mild illness or not feel sick at all', 즉 조금만 아프거나 아예 안 아프다는 뜻. mild = 가벼운. 심한은 정반대.","c":3},"h":"5b9e2a37b0"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nAfter this, if the real flu virus enters your body, the antibodies can destroy it quickly.","ko":"밑줄 친 it이(가) 가리키는 것은?","sko":"이후에 진짜 독감 바이러스가 몸에 들어오면, 항체가 그것을 빠르게 없앨 수 있다.","opts":["항체","당신의 몸","독감 예방접종","진짜 독감 바이러스"],"r":{"a":"4) 진짜 독감 바이러스","ev":"8번 문장","s":[[8,"After this, if the real flu virus enters your body, the antibodies can destroy it quickly.","이후에 진짜 독감 바이러스가 몸에 들어오면, 항체가 그것을 빠르게 없앨 수 있다."]],"w":"항체(antibodies)가 없애는 대상이 it. 앞에 나온 the real flu virus(진짜 독감 바이러스)를 가리킴. 항체는 없애는 쪽(주어)이라 답이 아님.","c":4},"h":"f12e040867"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It cannot make you sick, but it is enough for your body to practice fighting it.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 당신을 아프게 할 수는 없지만, 당신의 몸이 그것과 싸우는 연습을 하기에는 충분하다.","opts":["접종은 병을 일으키지는 않지만, 몸이 바이러스와 싸우는 연습을 하기에는 충분하다.","접종은 병을 일으킬 수 있지만, 몸이 싸우는 연습을 하기에는 부족하다.","접종은 병을 일으키지 않아서 몸이 싸우는 연습을 할 필요가 없다.","접종은 몸을 아프게 하고, 그래서 바이러스를 없앤다."],"r":{"a":"1) 접종은 병을 일으키지는 않지만, 몸이 바이러스와 싸우는 연습을 하기에는 충분하다.","ev":"4번 문장","s":[[4,"It cannot make you sick, but it is enough for your body to practice fighting it.","그것은 당신을 아프게 할 수는 없지만, 당신의 몸이 그것과 싸우는 연습을 하기에는 충분하다."]],"w":"but 앞은 '아프게 할 수 없다', 뒤는 '싸우는 연습에는 충분하다'. 선지 1이 이 두 부분을 그대로 담음. 선지 2는 '일으킬 수 있다'와 '부족하다'가 거꾸로임.","c":1},"h":"d2fad9ba75"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["항체는 독감 접종 직후에 완전히 사라진다.","독감 바이러스는 해마다 똑같이 유지된다.","항체는 몸이 진짜 독감 바이러스를 빠르게 없애도록 돕는다.","독감 접종에는 살아 있는 바이러스가 들어 있어서 조금 아프게 만든다."],"opts":["Antibodies disappear completely right after a flu shot.","The flu virus stays exactly the same every year.","Antibodies help your body destroy the real flu virus quickly.","A flu shot contains a living virus that makes you mildly sick."],"r":{"a":"3) Antibodies help your body destroy the real flu virus quickly.","ev":"8번 문장","s":[[8,"After this, if the real flu virus enters your body, the antibodies can destroy it quickly.","이후에 진짜 독감 바이러스가 몸에 들어오면, 항체가 그것을 빠르게 없앨 수 있다."]],"w":"8번에서 항체가 진짜 바이러스를 빠르게 없앤다고 함. 선지 1은 항체가 사라진다는 말이 본문에 없고, 선지 2는 11번에서 바이러스가 해마다 조금씩 변한다고 해 틀림. 선지 4는 3번의 죽은 바이러스와 반대.","c":3},"h":"5f9c0ea319"},{"n":9,"t":"sum","q":"After a flu shot, your body makes (A) to fight the virus, but the flu virus (B) a little every year, so you need a new shot each year.","ko":"접종 후 몸은 바이러스와 싸우는 (A)을(를) 만들지만, 독감 바이러스가 해마다 조금씩 (B)해서 해마다 새 접종이 필요하다.","oko":["(A) 바이러스 / (B) 사라진다","(A) 항체 / (B) 변한다","(A) 약 / (B) 변한다","(A) 항체 / (B) 사라진다","(A) 바이러스 / (B) 변한다"],"opts":["(A) viruses / (B) disappears","(A) antibodies / (B) changes","(A) medicines / (B) changes","(A) antibodies / (B) disappears","(A) viruses / (B) changes"],"r":{"a":"2) (A) antibodies / (B) changes","ev":"5번, 11번 문장","s":[[5,"When this virus enters your body, your defense system creates special protectors called antibodies.","이 바이러스가 몸에 들어오면, 방어 체계가 항체라고 불리는 특별한 보호자를 만든다."],[11,"The number of antibodies in your body goes down over time, and the flu virus changes a little bit every year.","몸속 항체의 수는 시간이 지나면서 줄어들고, 독감 바이러스는 해마다 조금씩 변한다."]],"w":"5번에서 몸이 antibodies(항체)를 만든다고 하고, 11번에서 바이러스가 해마다 조금씩 changes(변한다)고 함. 바이러스나 약을 만든다는 말은 없고, 사라지는 건 항체 수가 줄어드는 것이지 바이러스가 아님.","c":2},"h":"3dd832dcdd"},{"n":10,"t":"fill","q":"A flu shot contains a [A] version of the virus, so it cannot make you sick, but it helps your body [B] fighting it.","ko":"독감 예방접종에는 [A] 형태의 바이러스가 들어 있어 아프게 하지 않지만, 몸이 그것과 싸우는 것을 [B]하도록 돕는다.","bank":["dead","practice","destroy","protect","produce","recognize"],"bko":{"dead":"죽은","practice":"연습하다","destroy":"없애다","protect":"보호하다","produce":"만들어 내다","recognize":"알아보다"},"r":{"a":"[A] dead, [B] practice","ev":"3~4번 문장","s":[[3,"The flu shot contains a dead version of the virus.","독감 예방접종에는 죽은 형태의 바이러스가 들어 있다."],[4,"It cannot make you sick, but it is enough for your body to practice fighting it.","그것은 당신을 아프게 할 수는 없지만, 당신의 몸이 그것과 싸우는 연습을 하기에는 충분하다."]],"w":"3번 a dead version of the virus(죽은 형태의 바이러스), 4번 practice fighting it(싸우는 연습)에서 가져옴. destroy·protect·produce·recognize는 본문에 나오지만 이 빈칸 문장에는 뜻과 모양이 맞지 않음.","c":null},"h":"49679aade6"}]},{"u":1,"id":"b4-01-2","no":2,"ko":"운동 두 가지, 몸에는 어떻게 다를까?","items":[{"n":1,"t":"tf","q":"Aerobic exercise includes activities like running and swimming.","ko":"유산소 운동에는 달리기와 수영 같은 활동이 포함된다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Aerobic exercise includes activities like running or swimming, which keep your body moving for a long time.","유산소 운동에는 달리기나 수영 같은 활동이 포함되는데, 그것들은 몸을 오랫동안 움직이게 한다."]],"w":"3번 문장에 Aerobic exercise includes activities like running or swimming이 그대로 나옴.","c":"T"},"h":"c57c0c57d4"},{"n":2,"t":"tf","q":"Strength training involves long and slow exercises.","ko":"근력 운동은 길고 느린 운동을 포함한다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Strength training, on the other hand, involves short, intense exercises like push-ups or lifting weights.","반면에 근력 운동은 팔굽혀펴기나 역기 들기 같은 짧고 강도 높은 운동을 포함한다."]],"w":"8번 문장은 short, intense exercises(짧고 강도 높은 운동)라고 함. 길고 느린 운동이라는 말과 반대.","c":"F"},"h":"387844d1e1"},{"n":3,"t":"tf","q":"You should leave rest days between strength training sessions.","ko":"근력 운동 사이에는 쉬는 날을 두어야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Try this two or three times a week, leaving rest days in between so your muscles can recover.","근육이 회복될 수 있도록 중간에 쉬는 날을 두고, 일주일에 두세 번 이것을 해 보라."]],"w":"10번 문장에 leaving rest days in between so your muscles can recover가 있음. 쉬는 날을 두라는 내용과 일치.","c":"T"},"h":"bc34aeca6a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It challenges your muscles to work harder, …)","ko":"그것은 근육이 더 열심히 일하도록 ( ).","opts":["쉬게 해 주다","힘껏 해 보도록 자극하다","병들게 하다","사라지게 하다"],"word":"challenges","r":{"a":"2) 힘껏 해 보도록 자극하다","ev":"9번 문장","s":[[9,"It challenges your muscles to work harder, helping them grow stronger.","그것은 근육이 더 열심히 일하도록 자극하여, 근육이 더 강하게 자라도록 돕는다."]],"w":"9번 문장은 근력 운동이 근육에게 더 열심히 일하라고 요구해 더 강해지게 한다는 흐름이라 challenges = 힘껏 해 보도록 자극하다. 쉬게 해 준다는 뜻과는 반대.","c":2},"h":"7e7e2c55b3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Strength training involves short, intense exercises like push-ups or lifting weights.)","ko":"근력 운동은 팔굽혀펴기나 역기 들기 같은 짧고 ( ) 운동을 포함한다.","opts":["부드러운","지루한","강도 높은","조용한"],"word":"intense","r":{"a":"3) 강도 높은","ev":"8번 문장","s":[[8,"Strength training, on the other hand, involves short, intense exercises like push-ups or lifting weights.","반면에 근력 운동은 팔굽혀펴기나 역기 들기 같은 짧고 강도 높은 운동을 포함한다."]],"w":"8번 문장에서 근력 운동은 팔굽혀펴기, 역기 들기처럼 짧지만 힘이 많이 드는 운동. intense = 강도 높은. 부드러운은 반대 느낌.","c":3},"h":"b66915f0df"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nIt challenges your muscles to work harder, helping them grow stronger.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"그것은 근육이 더 열심히 일하도록 자극하여, 근육이 더 강하게 자라도록 돕는다.","opts":["운동","팔굽혀펴기","쉬는 날","근육"],"r":{"a":"4) 근육","ev":"9번 문장","s":[[9,"It challenges your muscles to work harder, helping them grow stronger.","그것은 근육이 더 열심히 일하도록 자극하여, 근육이 더 강하게 자라도록 돕는다."]],"w":"them 바로 앞에 your muscles가 있고, 더 강하게 자라는 것은 근육. them = 근육.","c":4},"h":"dba4013d97"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Try this for about an hour, six to seven days a week, to keep your body active.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"몸을 활동적으로 유지하려면 일주일에 6~7일, 약 한 시간씩 이것을 해 보라.","opts":["몸을 활동적으로 유지하려면 일주일에 6~7일, 약 한 시간씩 이 운동을 해 보라는 뜻이다.","일주일에 한 번, 6~7시간 이 운동을 해야 한다는 뜻이다.","하루에 6~7번, 한 시간씩 쉬지 않고 해야 한다는 뜻이다.","6~7일에 한 번, 약 한 시간 하면 충분하다는 뜻이다."],"r":{"a":"1) 몸을 활동적으로 유지하려면 일주일에 6~7일, 약 한 시간씩 이 운동을 해 보라는 뜻이다.","ev":"7번 문장","s":[[7,"Try this for about an hour, six to seven days a week, to keep your body active.","몸을 활동적으로 유지하려면 일주일에 6~7일, 약 한 시간씩 이것을 해 보라."]],"w":"about an hour(약 한 시간), six to seven days a week(일주일에 6~7일)를 그대로 옮긴 것이 1번. 나머지는 횟수와 시간을 바꿔 놓았음.","c":1},"h":"c8562f9d28"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["근력 운동은 쉬지 않고 매일 해야 한다.","유산소 운동은 주로 역기를 드는 것이다.","유산소 운동은 시간이 지나면서 심장과 폐를 더 튼튼하게 한다.","두 종류의 운동은 정확히 같은 방식으로 몸에 도움이 된다."],"opts":["Strength training should be done every day without rest.","Aerobic exercise is mostly about lifting weights.","Aerobic exercise makes your heart and lungs stronger over time.","Both types of exercise help your body in exactly the same way."],"r":{"a":"3) Aerobic exercise makes your heart and lungs stronger over time.","ev":"6번, 11번 문장","s":[[6,"Over time, these exercises strengthen your heart and lungs.","시간이 지나면서, 이런 운동은 심장과 폐를 튼튼하게 한다."],[11,"Both types of exercise help your body in different ways, so keep a balanced routine to get the most benefits.","두 종류의 운동은 서로 다른 방식으로 몸에 도움이 되므로, 가장 많은 이점을 얻으려면 균형 잡힌 루틴을 유지하라."]],"w":"6번에서 유산소 운동이 시간이 지나면 심장과 폐를 튼튼하게 한다고 함. 선지 1은 10번의 쉬는 날과 반대, 선지 2는 3번의 달리기·수영과 다름, 선지 4는 11번의 different ways(서로 다른 방식)와 반대.","c":3},"h":"ae22938dbf"},{"n":9,"t":"sum","q":"Aerobic exercise (A) your heart and lungs, while strength training helps your (B) grow stronger.","ko":"유산소 운동은 심장과 폐를 (A)하고, 근력 운동은 (B)이(가) 더 강하게 자라도록 돕는다.","oko":["(A) 약하게 한다 / (B) 뼈","(A) 약하게 한다 / (B) 근육","(A) 튼튼하게 한다 / (B) 뼈","(A) 지치게 한다 / (B) 심장","(A) 튼튼하게 한다 / (B) 근육"],"opts":["(A) weakens / (B) bones","(A) weakens / (B) muscles","(A) strengthens / (B) bones","(A) tires / (B) heart","(A) strengthens / (B) muscles"],"r":{"a":"5) (A) strengthens / (B) muscles","ev":"6번, 9번 문장","s":[[6,"Over time, these exercises strengthen your heart and lungs.","시간이 지나면서, 이런 운동은 심장과 폐를 튼튼하게 한다."],[9,"It challenges your muscles to work harder, helping them grow stronger.","그것은 근육이 더 열심히 일하도록 자극하여, 근육이 더 강하게 자라도록 돕는다."]],"w":"6번에서 유산소 운동이 심장과 폐를 strengthen(튼튼하게)하고, 9번에서 근력 운동이 muscles(근육)를 더 강하게 자라게 함. 뼈 이야기는 본문에 없음.","c":5},"h":"07087af196"},{"n":10,"t":"fill","q":"Your lungs take in more [A] from the air, and your heart beats more quickly to [B] blood throughout your body.","ko":"폐는 공기에서 더 많은 [A]을(를) 받아들이고, 심장은 온몸으로 피를 [B]하려고 더 빠르게 뛴다.","bank":["oxygen","deliver","challenge","recover","breathe","active"],"bko":{"oxygen":"산소","deliver":"전달하다","challenge":"자극하다","recover":"회복하다","breathe":"숨 쉬다","active":"활동적인"},"r":{"a":"[A] oxygen, [B] deliver","ev":"4~5번 문장","s":[[4,"As you move, you breathe faster, and your lungs take in more oxygen from the air.","움직이면 더 빠르게 숨을 쉬고, 폐는 공기에서 더 많은 산소를 받아들인다."],[5,"Your heart also beats more quickly to deliver oxygen-rich blood throughout your body.","심장도 산소가 풍부한 피를 온몸으로 전달하기 위해 더 빠르게 뛴다."]],"w":"4번 your lungs take in more oxygen from the air, 5번 to deliver oxygen-rich blood에서 가져옴. challenge·recover·breathe·active는 본문 다른 곳의 낱말이라 이 문장의 뜻과 모양에 맞지 않음.","c":null},"h":"f4f3cb6ac0"}]},{"u":1,"id":"b4-01-3","no":3,"ko":"손만 씻었는데 산모들이 살았다고?","items":[{"n":1,"t":"tf","q":"Semmelweis noticed that many mothers died from a fever after childbirth.","ko":"제멜바이스는 많은 산모가 출산 후 열병으로 사망한다는 것을 알아차렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In the 1840s, Ignaz Semmelweis, a doctor in Austria, noticed that many mothers in his hospital died from a fever after childbirth.","1840년대에 오스트리아의 의사였던 이그나즈 제멜바이스는 자신의 병원에서 많은 산모가 출산 후 열병으로 사망한다는 것을 알아차렸다."]],"w":"1번 문장에 many mothers in his hospital died from a fever after childbirth가 있음. 같은 내용.","c":"T"},"h":"0670fa2d8f"},{"n":2,"t":"tf","q":"The death rate went up after doctors began washing their hands.","ko":"의사들이 손을 씻기 시작한 후 사망률이 올라갔다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"As a result, the death rate dropped sharply, from 18% to 1%.","그 결과, 사망률이 18%에서 1%로 급격히 떨어졌다."]],"w":"8번 문장에서 사망률이 18%에서 1%로 dropped sharply(급격히 떨어졌다). 올라갔다는 말은 반대.","c":"F"},"h":"fb71a7d9d0"},{"n":3,"t":"tf","q":"Semmelweis's advice was recognized only after his death.","ko":"제멜바이스의 조언은 그가 죽은 후에야 인정받았다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"His advice was only recognized after his death.","그의 조언은 그가 죽은 후에야 인정받았다."]],"w":"10번 문장 His advice was only recognized after his death. 그대로 일치.","c":"T"},"h":"725f3bbf4e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Soon, a tragic event gave him clear evidence.)","ko":"곧, ( ) 사건이 그에게 분명한 증거를 주었다.","opts":["우스운","평범한","비극적인","놀라운"],"word":"tragic","r":{"a":"3) 비극적인","ev":"5~6번 문장","s":[[5,"Soon, a tragic event gave him clear evidence.","곧, 비극적인 사건이 그에게 분명한 증거를 주었다."],[6,"A colleague cut his finger during an autopsy and later died with the same symptoms as the mothers.","한 동료가 부검 중에 손가락을 베었고 나중에 산모들과 같은 증상으로 사망했다."]],"w":"tragic event의 내용은 6번의 동료가 다쳐서 산모들과 같은 증상으로 죽은 일. 슬픈 일이므로 tragic = 비극적인. 우스운은 반대.","c":3},"h":"7aa7801e1d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (As a result, the death rate dropped sharply, from 18% to 1%.)","ko":"그 결과, 사망률이 18%에서 1%로 ( ) 떨어졌다.","opts":["급격하게","서서히","가끔","조금도"],"word":"sharply","r":{"a":"1) 급격하게","ev":"8번 문장","s":[[8,"As a result, the death rate dropped sharply, from 18% to 1%.","그 결과, 사망률이 18%에서 1%로 급격히 떨어졌다."]],"w":"18%에서 1%로 크게 떨어졌으니 sharply = 급격하게. 서서히는 천천히라는 뜻이라 맞지 않음.","c":1},"h":"c075758683"},{"n":6,"t":"ref","q":"What does the underlined \"this\" refer to?\nAfter this, he ordered doctors in his hospital to wash their hands with chlorinated lime before helping with births.","ko":"밑줄 친 this이(가) 가리키는 것은?","sko":"이후 그는 병원의 의사들에게 출산을 돕기 전에 염화 석회로 손을 씻으라고 명령했다.","opts":["제멜바이스가 출산을 도운 일","동료가 부검 중 다쳐 산모들과 같은 증상으로 죽은 일","의사들이 손을 씻은 일","사망률이 떨어진 일"],"r":{"a":"2) 동료가 부검 중 다쳐 산모들과 같은 증상으로 죽은 일","ev":"6~7번 문장","s":[[6,"A colleague cut his finger during an autopsy and later died with the same symptoms as the mothers.","한 동료가 부검 중에 손가락을 베었고 나중에 산모들과 같은 증상으로 사망했다."],[7,"After this, he ordered doctors in his hospital to wash their hands with chlorinated lime before helping with births.","이후 그는 병원의 의사들에게 출산을 돕기 전에 염화 석회로 손을 씻으라고 명령했다."]],"w":"After this는 '이 일 뒤에'. 제멜바이스가 손 씻기를 명령하게 된 계기는 6번의 동료의 죽음. 손 씻기와 사망률 감소는 7번 이후의 일이라 답이 아님.","c":2},"h":"9cc57f3db1"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Despite this success, other doctors refused to believe him because the idea of germs had not yet been discovered.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 성공에도 불구하고, 세균이라는 개념이 아직 발견되지 않았기 때문에 다른 의사들은 그를 믿기를 거부했다.","opts":["이 성공 덕분에 세균이 발견되어서 다른 의사들이 그를 믿게 되었다.","이 성공 때문에 다른 의사들이 세균을 연구하기 시작했다.","이 실패에도 불구하고 다른 의사들은 세균의 존재를 믿었다.","이 성공에도 불구하고, 세균이라는 개념이 아직 없어서 다른 의사들은 그의 말을 믿으려 하지 않았다."],"r":{"a":"4) 이 성공에도 불구하고, 세균이라는 개념이 아직 없어서 다른 의사들은 그의 말을 믿으려 하지 않았다.","ev":"9번 문장","s":[[9,"Despite this success, other doctors refused to believe him because the idea of germs had not yet been discovered.","이 성공에도 불구하고, 세균이라는 개념이 아직 발견되지 않았기 때문에 다른 의사들은 그를 믿기를 거부했다."]],"w":"Despite(~에도 불구하고)는 성공했는데도 믿지 않았다는 뜻. because 뒤에 세균 개념이 아직 없었다는 이유가 나옴. 나머지는 성공·실패와 믿음의 방향이 틀림.","c":4},"h":"f82dccd092"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["제멜바이스는 의사들에게 부검을 그만두라고 명령했다.","부검 중 손가락을 벤 동료는 나중에 산모들과 같은 증상으로 사망했다.","손 씻기 후 사망률이 1%에서 18%로 떨어졌다.","다른 의사들은 제멜바이스의 생각을 곧바로 받아들였다."],"opts":["Semmelweis ordered doctors to stop doing autopsies.","A colleague who cut his finger during an autopsy later died with the same symptoms as the mothers.","The death rate dropped from 1% to 18% after handwashing.","Other doctors quickly accepted Semmelweis's idea."],"r":{"a":"2) A colleague who cut his finger during an autopsy later died with the same symptoms as the mothers.","ev":"6번 문장","s":[[6,"A colleague cut his finger during an autopsy and later died with the same symptoms as the mothers.","한 동료가 부검 중에 손가락을 베었고 나중에 산모들과 같은 증상으로 사망했다."]],"w":"6번에 A colleague cut his finger during an autopsy and later died with the same symptoms가 있음. 선지 1은 손을 씻으라고 했지 부검을 그만두라고 하지 않았고, 선지 3은 숫자가 거꾸로, 선지 4는 9번에서 믿기를 거부했다고 함.","c":2},"h":"21e7e92701"},{"n":9,"t":"sum","q":"Semmelweis found that mothers died because doctors did not wash their (A) after autopsies, and handwashing made the death rate (B).","ko":"제멜바이스는 의사들이 부검 후 (A)을(를) 씻지 않아 산모들이 죽는다는 것을 알아냈고, 손 씻기는 사망률을 (B)하게 했다.","oko":["(A) 손 / (B) 오르다","(A) 도구 / (B) 떨어지다","(A) 옷 / (B) 그대로이다","(A) 도구 / (B) 오르다","(A) 손 / (B) 떨어지다"],"opts":["(A) hands / (B) rise","(A) tools / (B) drop","(A) clothes / (B) stay the same","(A) tools / (B) rise","(A) hands / (B) drop"],"r":{"a":"5) (A) hands / (B) drop","ev":"3번, 8번 문장","s":[[3,"As he observed the doctors at work, he noticed that many doctors did autopsies and then helped deliver babies without washing their hands.","그가 의사들이 일하는 모습을 관찰하면서, 많은 의사가 부검을 한 뒤 손을 씻지 않고 아기 출산을 도왔다는 것을 알아차렸다."],[8,"As a result, the death rate dropped sharply, from 18% to 1%.","그 결과, 사망률이 18%에서 1%로 급격히 떨어졌다."]],"w":"3번에서 의사들이 부검 후 손(hands)을 씻지 않고 출산을 도왔고, 8번에서 손을 씻게 한 결과 사망률이 drop(떨어지다)함. 도구나 옷을 씻는다는 말은 없음.","c":5},"h":"232b28cf16"},{"n":10,"t":"fill","q":"A colleague [A] with the same symptoms as the mothers after cutting his finger during an autopsy, and this gave Semmelweis clear [B].","ko":"한 동료가 부검 중에 손가락을 베고 산모들과 같은 증상으로 [A]했고, 이것은 제멜바이스에게 분명한 [B]을(를) 주었다.","bank":["died","evidence","observed","ordered","germs","rate"],"bko":{"died":"사망했다","evidence":"증거","observed":"관찰했다","ordered":"명령했다","germs":"세균","rate":"비율"},"r":{"a":"[A] died, [B] evidence","ev":"5~6번 문장","s":[[5,"Soon, a tragic event gave him clear evidence.","곧, 비극적인 사건이 그에게 분명한 증거를 주었다."],[6,"A colleague cut his finger during an autopsy and later died with the same symptoms as the mothers.","한 동료가 부검 중에 손가락을 베었고 나중에 산모들과 같은 증상으로 사망했다."]],"w":"6번 later died with the same symptoms(같은 증상으로 사망했다), 5번 gave him clear evidence(분명한 증거를 주었다)에서 가져옴. observed·ordered는 동료가 한 일이 아니고, germs·rate는 증거 자리에 맞지 않음.","c":null},"h":"551296858c"}]},{"u":1,"id":"b4-01-4","no":4,"ko":"과자 봉지 뒷면 표, 이렇게 읽으면 된다","items":[{"n":1,"t":"tf","q":"You can find a Nutrition Facts label on packaged food.","ko":"포장 식품에서 영양 성분표를 찾을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"When you buy packaged food, you can find a Nutrition Facts label on the package.","포장 식품을 사면, 포장지에서 영양 성분표를 찾을 수 있다."]],"w":"1번 문장에 When you buy packaged food, you can find a Nutrition Facts label on the package가 있음.","c":"T"},"h":"92927b3c02"},{"n":2,"t":"tf","q":"If you eat two servings, the numbers on the label stay the same.","ko":"두 번 분량을 먹어도 표의 숫자는 그대로이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"If you eat two servings, you must double all the other numbers!","두 번 분량을 먹으면, 다른 모든 숫자를 두 배로 해야 한다!"]],"w":"5번 문장에서 두 번 분량을 먹으면 you must double all the other numbers(다른 모든 숫자를 두 배로 해야 한다)라고 함. 그대로라는 말은 반대.","c":"F"},"h":"6984414e52"},{"n":3,"t":"tf","q":"Too many calories can cause weight gain.","ko":"열량이 너무 많으면 체중 증가를 일으킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Too many calories can cause weight gain.","열량이 너무 많으면 체중 증가를 일으킬 수 있다."]],"w":"7번 문장 Too many calories can cause weight gain. 그대로 같은 내용.","c":"T"},"h":"0ecfcf48cf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Next, the label displays calories to show how much energy the food provides.)","ko":"다음으로, 표는 열량을 ( ) 음식이 주는 에너지의 양을 알려 준다.","opts":["숨기다","보여 주다","빼앗다","없애다"],"word":"displays","r":{"a":"2) 보여 주다","ev":"6번 문장","s":[[6,"Next, the label displays calories to show how much energy the food provides.","다음으로, 표에는 그 음식이 얼마나 많은 에너지를 주는지 보여 주기 위해 열량이 나타난다."]],"w":"6번 문장은 표가 열량을 나타내서 음식이 주는 에너지 양을 알려 준다는 뜻이라 displays = 보여 주다(나타내다). 숨기다·없애다는 반대 뜻.","c":2},"h":"ae695e4155"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If you eat two servings, you must double all the other numbers!)","ko":"두 번 분량을 먹으면, 다른 모든 숫자를 ( ) 해야 한다!","opts":["반으로 줄이다","지우다","그대로 두다","두 배로 하다"],"word":"double","r":{"a":"4) 두 배로 하다","ev":"5번 문장","s":[[5,"If you eat two servings, you must double all the other numbers!","두 번 분량을 먹으면, 다른 모든 숫자를 두 배로 해야 한다!"]],"w":"두 번 분량이면 먹는 양이 2배이므로 숫자도 2배. double = 두 배로 하다. 반으로 줄이다는 반대.","c":4},"h":"685c0a682f"},{"n":6,"t":"ref","q":"What does the underlined \"this amount\" refer to?\nAll the numbers on the label are based on this amount.","ko":"밑줄 친 this amount이(가) 가리키는 것은?","sko":"표에 있는 모든 숫자는 이 양을 기준으로 한다.","opts":["한 번 먹는 양(1회 제공량)","포장 전체의 양","하루에 필요한 열량","음식의 가격"],"r":{"a":"1) 한 번 먹는 양(1회 제공량)","ev":"3~4번 문장","s":[[3,"At the top, it indicates the serving size, which tells you the amount for one serving.","맨 위에는 1회 제공량이 표시되는데, 그것은 한 번 먹는 양을 알려 준다."],[4,"All the numbers on the label are based on this amount.","표에 있는 모든 숫자는 이 양을 기준으로 한다."]],"w":"3번에서 serving size가 one serving의 양이라고 설명한 뒤 4번에서 this amount라고 받음. 그래서 한 번 먹는 양. 포장 전체의 양이 아님.","c":1},"h":"17f4cfbd1e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"For example, if a bowl of cereal contains 30% DV of fiber, it means one serving gives about one-third of the fiber your body needs in a day.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"예를 들어, 시리얼 한 그릇에 식이섬유가 일일 권장량의 30% 들어 있다면, 1회 제공량이 하루에 필요한 식이섬유의 약 3분의 1을 준다는 뜻이다.","opts":["시리얼 한 그릇을 먹으면 식이섬유를 하루에 30%만 먹어도 된다는 뜻이다.","시리얼 한 그릇의 무게 중 30%가 식이섬유라는 뜻이다.","시리얼 1회 분량이 하루에 필요한 식이섬유의 약 3분의 1을 채워 준다는 뜻이다.","시리얼 한 그릇에 하루에 필요한 식이섬유가 모두 들어 있다는 뜻이다."],"r":{"a":"3) 시리얼 1회 분량이 하루에 필요한 식이섬유의 약 3분의 1을 채워 준다는 뜻이다.","ev":"10번 문장","s":[[10,"For example, if a bowl of cereal contains 30% DV of fiber, it means one serving gives about one-third of the fiber your body needs in a day.","예를 들어, 시리얼 한 그릇에 식이섬유가 일일 권장량의 30% 들어 있다면, 1회 제공량이 하루에 필요한 식이섬유의 약 3분의 1을 준다는 뜻이다."]],"w":"30% DV는 하루 필요량의 30%이고, 그것이 약 one-third(3분의 1). 선지 2는 무게의 30%로 잘못 읽은 것이고, 선지 4는 100%라는 뜻이라 틀림.","c":3},"h":"2ac00da603"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["표의 숫자는 포장 전체를 기준으로 한다.","표는 음식이 주는 에너지의 양을 알려 주기 위해 열량을 보여 준다.","비타민은 열량 위에 나열되어 있다.","표는 신선 식품에서만 찾을 수 있다."],"opts":["The numbers on the label are based on the whole package.","The label shows calories to tell how much energy the food provides.","Vitamins are listed above the calories.","The label can only be found on fresh food."],"r":{"a":"2) The label shows calories to tell how much energy the food provides.","ev":"6번 문장","s":[[6,"Next, the label displays calories to show how much energy the food provides.","다음으로, 표에는 그 음식이 얼마나 많은 에너지를 주는지 보여 주기 위해 열량이 나타난다."]],"w":"6번에서 열량은 음식이 얼마나 많은 에너지를 주는지 보여 줌. 선지 1은 4번의 this amount(1회 제공량)와 다르고, 선지 3은 8번에서 Below the calories(열량 아래)라고 했고, 선지 4는 1번에서 packaged food(포장 식품)라고 함.","c":2},"h":"347d73e438"},{"n":9,"t":"sum","q":"The (A) size on a food label tells you the amount for one serving, and checking the label helps you make (B) food choices.","ko":"식품 표의 (A) 크기는 한 번 먹는 양을 알려 주고, 표를 확인하면 더 (B) 음식 선택을 할 수 있다.","oko":["(A) 포장 / (B) 더 저렴한","(A) 1회 제공량 / (B) 더 저렴한","(A) 포장 / (B) 더 건강한","(A) 열량 / (B) 더 건강한","(A) 1회 제공량 / (B) 더 건강한"],"opts":["(A) package / (B) cheaper","(A) serving / (B) cheaper","(A) package / (B) healthier","(A) calorie / (B) healthier","(A) serving / (B) healthier"],"r":{"a":"5) (A) serving / (B) healthier","ev":"3번, 11번 문장","s":[[3,"At the top, it indicates the serving size, which tells you the amount for one serving.","맨 위에는 1회 제공량이 표시되는데, 그것은 한 번 먹는 양을 알려 준다."],[11,"By checking the label, you can make healthier food choices.","표를 확인하면, 더 건강한 음식 선택을 할 수 있다."]],"w":"3번 serving size가 한 번 먹는 양을 알려 주고, 11번 healthier food choices(더 건강한 음식 선택)를 할 수 있다고 함. 저렴한 음식이나 포장 크기는 본문에 없음.","c":5},"h":"ff8f0d1b99"},{"n":10,"t":"fill","q":"Below the calories, you will find a list of [A] like fats, protein, and vitamins, and the Percent Daily Value shows how much one serving [B] to your daily needs.","ko":"열량 아래에는 지방, 단백질, 비타민 같은 [A] 목록이 있고, 일일 권장량 비율은 1회 제공량이 하루에 필요한 양에 얼마나 [B]하는지 보여 준다.","bank":["nutrients","contributes","servings","double","provides","check"],"bko":{"nutrients":"영양소","contributes":"기여하다","servings":"1회 분량","double":"두 배로 하다","provides":"제공하다","check":"확인하다"},"r":{"a":"[A] nutrients, [B] contributes","ev":"8~9번 문장","s":[[8,"Below the calories, you will find a list of nutrients like fats, protein, and vitamins.","열량 아래에는 지방, 단백질, 비타민 같은 영양소 목록이 있다."],[9,"Next to each nutrient, the Percent Daily Value (%DV) is shown to explain how much a nutrient in one serving contributes to your daily needs.","각 영양소 옆에는, 1회 제공량에 든 영양소가 하루에 필요한 양에 얼마나 기여하는지 설명하기 위해 일일 권장량 비율(%DV)이 표시된다."]],"w":"8번 a list of nutrients like fats, protein, and vitamins와 9번 contributes to your daily needs에서 가져옴. servings는 지방·단백질과 같은 종류가 아니고, double·provides·check는 'to your daily needs'와 이어지지 않음.","c":null},"h":"dd5962bff1"}]},{"u":2,"id":"b4-02-1","no":1,"ko":"색 가루를 뿌리면 모두가 똑같아진다고?","items":[{"n":1,"t":"tf","q":"Holi is celebrated in early spring in India.","ko":"홀리는 인도에서 이른 봄에 열린다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Every year in early spring, India comes alive with the festival of Holi.","해마다 이른 봄이면, 인도는 홀리 축제로 활기를 띤다."]],"w":"1번 문장 Every year in early spring, India comes alive with the festival of Holi와 같은 내용.","c":"T"},"h":"61ad2ea05f"},{"n":2,"t":"tf","q":"People at Holi throw only colored powders and never use water.","ko":"홀리에서 사람들은 색 가루만 던지고 물은 전혀 쓰지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"They sing, dance, and join in the fun as they throw colorful powders into the air and splash water on friends, family, and even strangers.","사람들은 노래하고 춤추며, 형형색색의 가루를 공중에 던지고 친구, 가족, 심지어 낯선 사람에게도 물을 뿌리면서 즐거움에 함께한다."]],"w":"4번 문장에서 가루를 던지고 splash water(물을 뿌리다)도 한다고 함. 물을 안 쓴다는 말은 반대.","c":"F"},"h":"331090e349"},{"n":3,"t":"tf","q":"Many people use Holi to forget old arguments.","ko":"많은 사람이 홀리 때 오래된 다툼을 잊는다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Many people use this moment to forget old arguments.","많은 사람이 이 순간을 이용해 오래된 다툼을 잊는다."]],"w":"9번 문장 Many people use this moment to forget old arguments. 같은 내용.","c":"T"},"h":"0f190f4d97"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This experience of looking alike creates a feeling of equality and harmony.)","ko":"서로 비슷하게 보이는 이 경험은 ( )과 조화의 느낌을 만들어 낸다.","opts":["경쟁","평등","두려움","자유"],"word":"equality","r":{"a":"2) 평등","ev":"6~7번 문장","s":[[6,"When everyone is covered in bright powders, differences in age, wealth, or social status seem to disappear.","모두가 밝은 가루로 뒤덮이면, 나이, 부, 사회적 지위의 차이가 사라지는 것처럼 보인다."],[7,"This experience of looking alike creates a feeling of equality and harmony.","서로 비슷하게 보이는 이 경험은 평등과 조화의 느낌을 만들어 낸다."]],"w":"6번에서 나이, 부, 지위의 차이가 사라져 모두 비슷해 보인다고 함. 그래서 equality = 평등. 경쟁은 차이를 겨루는 것이라 반대.","c":2},"h":"938030ec55"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… splash water on friends, family, and even strangers.)","ko":"… 친구, 가족, 심지어 낯선 사람에게도 물을 ( ).","opts":["마시다","닦다","뿌리다","끓이다"],"word":"splash","r":{"a":"3) 뿌리다","ev":"4번 문장","s":[[4,"They sing, dance, and join in the fun as they throw colorful powders into the air and splash water on friends, family, and even strangers.","사람들은 노래하고 춤추며, 형형색색의 가루를 공중에 던지고 친구, 가족, 심지어 낯선 사람에게도 물을 뿌리면서 즐거움에 함께한다."]],"w":"4번에서 가루를 던지는 것과 나란히 나오는 행동이고, 물을 친구·가족·낯선 사람에게 하는 것이니 splash = 뿌리다. 마시거나 닦는다면 축제의 즐거운 장면과 맞지 않음.","c":3},"h":"9ae9849ca6"},{"n":6,"t":"ref","q":"What does the underlined \"this moment\" refer to?\nMany people use this moment to forget old arguments.","ko":"밑줄 친 this moment이(가) 가리키는 것은?","sko":"많은 사람이 이 순간을 이용해 오래된 다툼을 잊는다.","opts":["봄이 막 시작되는 때","거리에서 음악을 연주하는 때","축제가 끝난 다음 날","서로에게 색을 묻혀 주며 함께 웃고 이야기하는 때"],"r":{"a":"4) 서로에게 색을 묻혀 주며 함께 웃고 이야기하는 때","ev":"8~9번 문장","s":[[8,"The act of gently putting color on someone also makes it easier to smile, talk, and have fun together.","누군가에게 부드럽게 색을 묻혀 주는 행동은 또한 함께 웃고, 이야기하고, 즐기기 더 쉽게 만든다."],[9,"Many people use this moment to forget old arguments.","많은 사람이 이 순간을 이용해 오래된 다툼을 잊는다."]],"w":"바로 앞 8번에서 색을 부드럽게 묻혀 주며 웃고 이야기하기 쉬워진다고 했고, 9번의 this moment는 그 순간을 받음. 그때 다툼을 잊음.","c":4},"h":"a460bf32ec"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"When everyone is covered in bright powders, differences in age, wealth, or social status seem to disappear.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"모두가 밝은 가루로 뒤덮이면, 나이, 부, 사회적 지위의 차이가 사라지는 것처럼 보인다.","opts":["모두가 가루로 뒤덮이면 나이, 재산, 지위의 차이가 눈에 띄지 않게 된다.","가루를 뿌리면 나이가 많은 사람이 더 부자가 된다.","가루를 뿌리기 전에 사람들은 서로의 나이와 지위를 먼저 확인한다.","가루 때문에 나이, 재산, 지위에 따라 사람들이 나뉜다."],"r":{"a":"1) 모두가 가루로 뒤덮이면 나이, 재산, 지위의 차이가 눈에 띄지 않게 된다.","ev":"6번 문장","s":[[6,"When everyone is covered in bright powders, differences in age, wealth, or social status seem to disappear.","모두가 밝은 가루로 뒤덮이면, 나이, 부, 사회적 지위의 차이가 사라지는 것처럼 보인다."]],"w":"seem to disappear(사라지는 것처럼 보인다)는 차이가 눈에 띄지 않는다는 뜻. 선지 4는 차이 때문에 사람들이 나뉜다는 뜻이라 반대.","c":1},"h":"853087c83e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["홀리는 늦가을에 열린다.","사람들은 홀리를 가족과만 즐긴다.","홀리는 ‘색의 축제’로 알려져 있다.","홀리 동안에는 나이와 부의 차이가 더 중요해진다."],"opts":["Holi is held in late autumn.","People only enjoy Holi with their families.","Holi is known as the “Festival of Colors.”","Differences in age and wealth become more important during Holi."],"r":{"a":"3) Holi is known as the “Festival of Colors.”","ev":"2번 문장","s":[[2,"Holi is known around the world as the “Festival of Colors,” which celebrates the arrival of spring and new beginnings.","홀리는 전 세계에 ‘색의 축제’로 알려져 있으며, 봄의 도래와 새로운 시작을 기념한다."]],"w":"2번에서 Holi is known around the world as the “Festival of Colors”라고 함. 선지 1은 1번의 early spring(이른 봄)과 다르고, 선지 2는 4번의 낯선 사람과도 즐긴다는 것과 어긋나고, 선지 4는 6번에서 차이가 사라진다는 것과 반대.","c":3},"h":"10913a3b07"},{"n":9,"t":"sum","q":"During Holi, differences in age and wealth seem to (A), which creates a feeling of (B).","ko":"홀리 동안 나이와 부의 차이가 (A)하는 것처럼 보이고, 이것이 (B)의 느낌을 만든다.","oko":["(A) 커지다 / (B) 경쟁","(A) 사라지다 / (B) 경쟁","(A) 커지다 / (B) 조화","(A) 그대로이다 / (B) 두려움","(A) 사라지다 / (B) 조화"],"opts":["(A) grow / (B) competition","(A) disappear / (B) competition","(A) grow / (B) harmony","(A) stay / (B) fear","(A) disappear / (B) harmony"],"r":{"a":"5) (A) disappear / (B) harmony","ev":"6~7번 문장","s":[[6,"When everyone is covered in bright powders, differences in age, wealth, or social status seem to disappear.","모두가 밝은 가루로 뒤덮이면, 나이, 부, 사회적 지위의 차이가 사라지는 것처럼 보인다."],[7,"This experience of looking alike creates a feeling of equality and harmony.","서로 비슷하게 보이는 이 경험은 평등과 조화의 느낌을 만들어 낸다."]],"w":"6번에서 차이가 disappear(사라지다)하고, 7번에서 평등과 조화(harmony)의 느낌이 생김. 경쟁이나 두려움은 본문에 없음.","c":5},"h":"5b62d5c754"},{"n":10,"t":"fill","q":"The act of gently putting color on someone makes it [A] to smile and talk together, and for many, Holi is a time to share warm [B].","ko":"누군가에게 부드럽게 색을 묻혀 주는 행동은 함께 웃고 이야기하기 [A] 만들고, 많은 사람에게 홀리는 따뜻한 [B]을(를) 나누는 시간이다.","bank":["easier","wishes","forget","gather","splash","disappear"],"bko":{"easier":"더 쉬운","wishes":"소망","forget":"잊다","gather":"모이다","splash":"뿌리다","disappear":"사라지다"},"r":{"a":"[A] easier, [B] wishes","ev":"8번, 10번 문장","s":[[8,"The act of gently putting color on someone also makes it easier to smile, talk, and have fun together.","누군가에게 부드럽게 색을 묻혀 주는 행동은 또한 함께 웃고, 이야기하고, 즐기기 더 쉽게 만든다."],[10,"For many, Holi is a time to share warm wishes with others and start their relationships fresh.","많은 사람에게 홀리는 다른 사람들과 따뜻한 소망을 나누고 관계를 새롭게 시작하는 시간이다."]],"w":"8번 makes it easier to smile, talk…, 10번 share warm wishes에서 가져옴. forget·gather·splash·disappear는 본문의 다른 문장에 나오는 동사라 'makes it ___ to'나 'warm ___' 자리에 말이 되지 않음.","c":null},"h":"bbfadca885"}]},{"u":2,"id":"b4-02-2","no":2,"ko":"에티오피아는 왜 아직 과거에 살고 있을까?","items":[{"n":1,"t":"tf","q":"Ethiopia follows its own ancient calendar.","ko":"에티오피아는 자신들만의 고대 달력을 따른다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"This is because Ethiopia follows its own ancient calendar.","이는 에티오피아가 자신들만의 고대 달력을 따르기 때문이다."]],"w":"3번 문장 Ethiopia follows its own ancient calendar. 그대로 같은 내용.","c":"T"},"h":"eb9836406e"},{"n":2,"t":"tf","q":"Ethiopia celebrates its New Year on January 1 like most countries.","ko":"에티오피아는 대부분의 나라처럼 1월 1일에 새해를 기념한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Ethiopia celebrates its New Year on Meskerem 1, which falls on September 11 or 12 on the international calendar.","에티오피아는 새해를 메스케렘 1일에 기념하는데, 이날은 국제 달력으로 9월 11일 또는 12일에 해당한다."]],"w":"10번 문장에서 새해는 Meskerem 1이고 국제 달력으로 9월 11일 또는 12일. 1월 1일이 아님.","c":"F"},"h":"b48ada4669"},{"n":3,"t":"tf","q":"Ethiopians see their calendar as a part of their identity.","ko":"에티오피아 사람들은 자신들의 달력을 정체성의 일부로 본다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"For Ethiopians, this unique calendar is a part of their identity and reflects traditions that have been passed down for centuries.","에티오피아 사람들에게 이 독특한 달력은 그들의 정체성의 일부이며 수 세기 동안 전해져 내려온 전통을 반영한다."]],"w":"11번 문장 this unique calendar is a part of their identity와 같은 내용.","c":"T"},"h":"4d26aea728"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This is because Ethiopia follows its own ancient calendar.)","ko":"이는 에티오피아가 자신들만의 ( ) 달력을 따르기 때문이다.","opts":["현대의","새로운","고대의","수입된"],"word":"ancient","r":{"a":"3) 고대의","ev":"3~4번 문장","s":[[3,"This is because Ethiopia follows its own ancient calendar.","이는 에티오피아가 자신들만의 고대 달력을 따르기 때문이다."],[4,"While many countries count their years from the date they believe Jesus was born, the Ethiopian Orthodox Church uses a traditional method that sets this date several years later.","많은 나라가 예수가 태어났다고 믿는 날짜부터 연도를 세는 반면, 에티오피아 정교회는 이 날짜를 몇 년 더 늦게 정하는 전통적인 방식을 사용한다."]],"w":"3번 뒤 4번에서 전통적인(traditional) 방식을 쓴다고 이어짐. 오래전부터 내려온 달력이므로 ancient = 고대의. 현대의·새로운은 반대.","c":3},"h":"4404714047"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… this unique calendar is a part of their identity and reflects traditions that have been passed down for centuries.)","ko":"… 이 독특한 달력은 정체성의 일부이며 수 세기 동안 전해져 내려온 전통을 ( ).","opts":["숨긴다","반영한다","막는다","잊는다"],"word":"reflects","r":{"a":"2) 반영한다","ev":"11번 문장","s":[[11,"For Ethiopians, this unique calendar is a part of their identity and reflects traditions that have been passed down for centuries.","에티오피아 사람들에게 이 독특한 달력은 그들의 정체성의 일부이며 수 세기 동안 전해져 내려온 전통을 반영한다."]],"w":"11번에서 달력은 정체성의 일부이고, 수 세기 전해진 전통이 달력에 그대로 나타난다는 흐름이라 reflects = 반영한다. 숨긴다·막는다·잊는다는 달력을 자랑스러워하는 흐름과 맞지 않음.","c":2},"h":"44735bd0f7"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThis difference makes the year of the Ethiopian calendar seem behind that of the international calendar.","ko":"밑줄 친 that이(가) 가리키는 것은?","sko":"이 차이 때문에 에티오피아 달력의 연도는 국제 달력의 연도보다 뒤처져 보인다.","opts":["에티오피아 달력","정교회","국제 달력","연도(the year)"],"r":{"a":"4) 연도(the year)","ev":"5번 문장","s":[[5,"This difference makes the year of the Ethiopian calendar seem behind that of the international calendar.","이 차이 때문에 에티오피아 달력의 연도는 국제 달력의 연도보다 뒤처져 보인다."]],"w":"the year of the Ethiopian calendar와 that of the international calendar를 비교하는 문장. 같은 말의 반복을 피하려고 that이 the year를 대신함. 즉 국제 달력의 연도.","c":4},"h":"c2b3794ef9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"While many countries count their years from the date they believe Jesus was born, the Ethiopian Orthodox Church uses a traditional method that sets this date several years later.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"많은 나라가 예수가 태어났다고 믿는 날짜부터 연도를 세는 반면, 에티오피아 정교회는 이 날짜를 몇 년 더 늦게 정하는 전통적인 방식을 사용한다.","opts":["많은 나라는 예수가 태어났다고 믿는 날부터 연도를 세지만, 에티오피아 정교회는 그 날짜를 몇 년 뒤로 잡는 전통 방식을 쓴다.","많은 나라와 에티오피아 정교회는 예수가 태어난 날짜를 똑같이 정한다.","에티오피아 정교회는 예수가 태어난 날짜를 몇 년 앞당겨 연도를 센다.","많은 나라는 전통 방식으로 연도를 세고, 에티오피아 정교회는 국제 달력 방식을 쓴다."],"r":{"a":"1) 많은 나라는 예수가 태어났다고 믿는 날부터 연도를 세지만, 에티오피아 정교회는 그 날짜를 몇 년 뒤로 잡는 전통 방식을 쓴다.","ev":"4번 문장","s":[[4,"While many countries count their years from the date they believe Jesus was born, the Ethiopian Orthodox Church uses a traditional method that sets this date several years later.","많은 나라가 예수가 태어났다고 믿는 날짜부터 연도를 세는 반면, 에티오피아 정교회는 이 날짜를 몇 년 더 늦게 정하는 전통적인 방식을 사용한다."]],"w":"While은 '~인 반면'으로 대조. 많은 나라 vs 에티오피아 정교회가 다르다는 뜻이고, sets this date several years later는 날짜를 몇 년 뒤로 정한다는 뜻. 선지 3은 '앞당겨'라 반대.","c":1},"h":"784d801d28"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["에티오피아는 세계 나머지 지역과 같은 달력을 따른다.","에티오피아 정교회는 예수의 탄생 날짜를 몇 년 더 늦게 정한다.","에티오피아 달력은 각각 31일인 12개월로 되어 있다.","에티오피아 사람들은 자신들의 달력이 정체성과 거의 상관없다고 생각한다."],"opts":["Ethiopia follows the same calendar as the rest of the world.","The Ethiopian Orthodox Church sets the date of Jesus’s birth several years later.","The Ethiopian calendar has 12 months of 31 days each.","Ethiopians think their calendar has little to do with their identity."],"r":{"a":"2) The Ethiopian Orthodox Church sets the date of Jesus’s birth several years later.","ev":"4번 문장","s":[[4,"While many countries count their years from the date they believe Jesus was born, the Ethiopian Orthodox Church uses a traditional method that sets this date several years later.","많은 나라가 예수가 태어났다고 믿는 날짜부터 연도를 세는 반면, 에티오피아 정교회는 이 날짜를 몇 년 더 늦게 정하는 전통적인 방식을 사용한다."]],"w":"4번에서 정교회는 이 날짜(예수가 태어났다고 믿는 날짜)를 몇 년 더 늦게 정함. 선지 1은 3번의 its own calendar와 반대, 선지 3은 7번의 30일과 다르고, 선지 4는 11번의 identity와 반대.","c":2},"h":"961bf88a40"},{"n":9,"t":"sum","q":"The Ethiopian calendar is about 7 or 8 years (A) the international calendar because it sets the date of Jesus’s birth (B).","ko":"에티오피아 달력은 예수의 탄생 날짜를 (B) 정하기 때문에 국제 달력보다 약 7~8년 (A).","oko":["(A) 앞서 있다 / (B) 더 일찍","(A) 뒤처져 있다 / (B) 더 일찍","(A) 앞서 있다 / (B) 더 늦게","(A) 뒤처져 있다 / (B) 더 늦게","(A) 같다 / (B) 더 늦게"],"opts":["(A) ahead of / (B) earlier","(A) behind / (B) earlier","(A) ahead of / (B) later","(A) behind / (B) later","(A) the same as / (B) later"],"r":{"a":"4) (A) behind / (B) later","ev":"2번, 4번 문장","s":[[2,"The Ethiopian calendar is about 7 or 8 years behind the rest of the world.","에티오피아 달력은 세계 나머지 지역보다 약 7~8년 뒤처져 있다."],[4,"While many countries count their years from the date they believe Jesus was born, the Ethiopian Orthodox Church uses a traditional method that sets this date several years later.","많은 나라가 예수가 태어났다고 믿는 날짜부터 연도를 세는 반면, 에티오피아 정교회는 이 날짜를 몇 년 더 늦게 정하는 전통적인 방식을 사용한다."]],"w":"2번에서 달력이 7~8년 behind(뒤처져)이고, 4번에서 날짜를 several years later(몇 년 더 늦게) 정함. 날짜를 늦게 잡으니 연도 숫자가 작아 뒤처져 보임.","c":4},"h":"f5c5181334"},{"n":10,"t":"fill","q":"Since 12 months of 30 days make only [A] days, a short 13th month is added to [B] the year.","ko":"30일씩인 12개월은 [A]일밖에 되지 않으므로, 한 해를 [B] 위해 짧은 13번째 달이 추가된다.","bank":["360","complete","reflect","follow","behind","ancient"],"bko":{"360":"360","complete":"채우다, 완성하다","reflect":"반영하다","follow":"따르다","behind":"뒤처진","ancient":"고대의"},"r":{"a":"[A] 360, [B] complete","ev":"7~8번 문장","s":[[7,"It has 12 months of exactly 30 days each.","그것은 정확히 각각 30일인 12개월로 이루어져 있다."],[8,"Since this makes only 360 days, a short 13th month with 5 or 6 days is added to complete the year.","이것은 360일밖에 되지 않기 때문에, 한 해를 채우기 위해 5일 또는 6일의 짧은 13번째 달이 추가된다."]],"w":"8번 Since this makes only 360 days, … is added to complete the year에서 가져옴. reflect·follow는 다른 문장(11번, 3번)의 낱말이고, behind·ancient도 이 문장의 뜻과 맞지 않음.","c":null},"h":"6542fca6a5"}]},{"u":2,"id":"b4-02-3","no":3,"ko":"슈퍼볼, 경기 말고 다들 뭘 볼까?","items":[{"n":1,"t":"tf","q":"The Super Bowl began in 1967 as a contest between two leagues.","ko":"슈퍼볼은 1967년 두 리그 간의 대결로 시작했다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It began in 1967 as a contest between two leagues, but it has grown into one of the biggest annual events in the U.S.","슈퍼볼은 1967년 두 리그 간의 대결로 시작했지만, 미국에서 가장 큰 연례행사 중 하나로 성장했다."]],"w":"2번 문장 It began in 1967 as a contest between two leagues와 같은 내용.","c":"T"},"h":"8f8d13a370"},{"n":2,"t":"tf","q":"The Super Bowl is held every autumn.","ko":"슈퍼볼은 매년 가을에 열린다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Every February, the United States comes alive for the Super Bowl, the championship game of American football.","매년 2월, 미국은 미식축구 챔피언 결정전인 슈퍼볼로 활기를 띤다."]],"w":"1번 문장에서 Every February(매년 2월)라고 함. 가을이 아님.","c":"F"},"h":"fb2fbf8245"},{"n":3,"t":"tf","q":"Families and friends gather for parties on Super Bowl Sunday.","ko":"가족과 친구들은 슈퍼볼 일요일에 파티를 위해 모인다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Families and friends gather for parties filled with snacks, music, and games.","가족과 친구들은 간식, 음악, 게임으로 가득한 파티를 위해 모인다."]],"w":"11번 문장 Families and friends gather for parties… 같은 내용.","c":"T"},"h":"30d875368f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One reason for the Super Bowl’s huge appeal is its format.)","ko":"슈퍼볼의 엄청난 ( )의 한 가지 이유는 그 방식이다.","opts":["비용","매력","규칙","기록"],"word":"appeal","r":{"a":"2) 매력","ev":"3~4번 문장","s":[[3,"One reason for the Super Bowl’s huge appeal is its format.","슈퍼볼의 엄청난 인기의 한 가지 이유는 그 방식이다."],[4,"Because there is only one game to decide the champion, the event is filled with drama and high-pressure moments.","챔피언을 가리는 경기가 단 한 번뿐이기 때문에, 이 행사는 극적인 장면과 큰 압박감의 순간들로 가득하다."]],"w":"3번 뒤 4~5번에서 극적인 순간 때문에 시청자가 계속 흥분한다고 이유를 설명함. 사람들을 끄는 힘이므로 appeal = 매력(인기). 비용·기록은 이어지는 내용과 안 맞음.","c":2},"h":"52ce0ef5ce"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… it has grown into one of the biggest annual events in the U.S.)","ko":"… 미국에서 가장 큰 ( ) 행사 중 하나로 성장했다.","opts":["하루짜리","주간의","해외의","해마다 열리는"],"word":"annual","r":{"a":"4) 해마다 열리는","ev":"1~2번 문장","s":[[1,"Every February, the United States comes alive for the Super Bowl, the championship game of American football.","매년 2월, 미국은 미식축구 챔피언 결정전인 슈퍼볼로 활기를 띤다."],[2,"It began in 1967 as a contest between two leagues, but it has grown into one of the biggest annual events in the U.S.","슈퍼볼은 1967년 두 리그 간의 대결로 시작했지만, 미국에서 가장 큰 연례행사 중 하나로 성장했다."]],"w":"1번에서 매년(Every) 2월에 열린다고 했으니 annual = 해마다 열리는. 하루짜리·주간의는 매년이라는 말과 맞지 않음.","c":4},"h":"23a1f17c3e"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis keeps viewers excited throughout the match.","ko":"밑줄 친 This이(가) 가리키는 것은?","sko":"이것은 경기 내내 시청자들을 흥분하게 만든다.","opts":["슈퍼볼이 1967년에 시작된 것","하프타임 쇼가 열리는 것","경기가 단 한 번뿐이라 극적이고 긴장되는 순간이 가득한 것","광고가 비싼 것"],"r":{"a":"3) 경기가 단 한 번뿐이라 극적이고 긴장되는 순간이 가득한 것","ev":"4~5번 문장","s":[[4,"Because there is only one game to decide the champion, the event is filled with drama and high-pressure moments.","챔피언을 가리는 경기가 단 한 번뿐이기 때문에, 이 행사는 극적인 장면과 큰 압박감의 순간들로 가득하다."],[5,"This keeps viewers excited throughout the match.","이것은 경기 내내 시청자들을 흥분하게 만든다."]],"w":"바로 앞 4번에서 경기가 한 번뿐이어서 drama and high-pressure moments(극적이고 압박감 큰 순간)가 가득하다고 함. This는 그 상황을 가리킴. 하프타임 쇼와 광고는 6번 이후의 이야기.","c":3},"h":"5d2d868ccc"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"With so much excitement packed into one day, Super Bowl Sunday feels almost like a holiday.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하루에 너무나 많은 흥분이 담겨 있어서, 슈퍼볼 일요일은 거의 명절처럼 느껴진다.","opts":["하루에 흥분되는 일이 너무 많이 담겨 있어서, 슈퍼볼 일요일은 명절 같은 기분이 든다.","슈퍼볼 일요일은 실제로 나라에서 정한 공휴일이다.","하루에 일이 너무 많아서 사람들이 지쳐 쉬고 싶어 한다.","슈퍼볼 일요일에는 경기가 하루 종일 한 번도 끊기지 않는다."],"r":{"a":"1) 하루에 흥분되는 일이 너무 많이 담겨 있어서, 슈퍼볼 일요일은 명절 같은 기분이 든다.","ev":"10번 문장","s":[[10,"With so much excitement packed into one day, Super Bowl Sunday feels almost like a holiday.","하루에 너무나 많은 흥분이 담겨 있어서, 슈퍼볼 일요일은 거의 명절처럼 느껴진다."]],"w":"feels almost like a holiday는 '거의 명절처럼 느껴진다'는 비유이지 진짜 공휴일이라는 뜻이 아님. 흥분되는 일이 하루에 가득 찬 날이라는 뜻.","c":1},"h":"e1c5c219a4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["슈퍼볼은 여러 경기를 통해 챔피언을 가린다.","슈퍼볼 광고는 싸서 신경 쓰는 기업이 거의 없다.","하프타임 쇼는 스포츠 행사 한가운데에서 열리는 콘서트와 거의 같다.","슈퍼볼 일요일의 파티는 경기장에서만 열린다."],"opts":["The Super Bowl decides the champion over several games.","Super Bowl commercials are cheap, so few companies care about them.","The halftime show is almost like a concert in the middle of a sports event.","Parties on Super Bowl Sunday are held only in stadiums."],"r":{"a":"3) The halftime show is almost like a concert in the middle of a sports event.","ev":"7번 문장","s":[[7,"The halftime show brings famous artists, dancers, and special effects, almost like a concert in the middle of a sports event.","하프타임 쇼는 유명 가수, 댄서, 특수 효과를 선보여, 마치 스포츠 행사 한가운데에서 열리는 콘서트 같다."]],"w":"7번에서 하프타임 쇼를 almost like a concert in the middle of a sports event라고 함. 선지 1은 4번의 only one game과 반대, 선지 2는 9번의 millions of dollars와 반대, 선지 4는 11번의 families and friends 파티와 맞지 않음.","c":3},"h":"9a1d6fc2f2"},{"n":9,"t":"sum","q":"Because only (A) game decides the champion, the event is full of drama, which keeps viewers (B).","ko":"챔피언을 가리는 경기가 (A) 번뿐이라 행사가 극적인 순간으로 가득하고, 이것이 시청자들을 (B) 만든다.","oko":["(A) 여러 / (B) 지루하게","(A) 한 / (B) 흥분하게","(A) 여러 / (B) 흥분하게","(A) 한 / (B) 지루하게","(A) 두 / (B) 흥분하게"],"opts":["(A) many / (B) bored","(A) one / (B) excited","(A) many / (B) excited","(A) one / (B) bored","(A) two / (B) excited"],"r":{"a":"2) (A) one / (B) excited","ev":"4~5번 문장","s":[[4,"Because there is only one game to decide the champion, the event is filled with drama and high-pressure moments.","챔피언을 가리는 경기가 단 한 번뿐이기 때문에, 이 행사는 극적인 장면과 큰 압박감의 순간들로 가득하다."],[5,"This keeps viewers excited throughout the match.","이것은 경기 내내 시청자들을 흥분하게 만든다."]],"w":"4번 only one game to decide the champion(챔피언을 가리는 경기는 단 한 번), 5번 keeps viewers excited(시청자를 흥분하게 함). 여러 경기나 지루함은 본문과 반대.","c":2},"h":"4fb77334d6"},{"n":10,"t":"fill","q":"Each 30-second advertisement [A] millions of dollars, so companies make [B] advertisements that people talk about long after the game.","ko":"30초짜리 광고 하나는 수백만 달러가 [A], 기업들은 경기가 끝난 뒤에도 사람들이 이야기하는 [B] 광고를 만든다.","bank":["costs","creative","decide","gather","talk","turn"],"bko":{"costs":"(비용이) 들다","creative":"창의적인","decide":"결정하다","gather":"모이다","talk":"이야기하다","turn":"바꾸다"},"r":{"a":"[A] costs, [B] creative","ev":"9번 문장","s":[[9,"Each 30-second advertisement costs millions of dollars, so companies make creative advertisements that people talk about long after the game.","30초짜리 광고 하나가 수백만 달러가 들기 때문에, 기업들은 경기가 끝난 뒤에도 오랫동안 사람들이 이야기하는 창의적인 광고를 만든다."]],"w":"9번 Each 30-second advertisement costs millions of dollars, so companies make creative advertisements에서 가져옴. decide·gather·talk·turn은 본문의 다른 곳에 나오는 동사라 이 빈칸의 뜻과 모양에 맞지 않음.","c":null},"h":"e83921fa4b"}]},{"u":2,"id":"b4-02-4","no":4,"ko":"덴마크에서는 아이 이름을 마음대로 못 짓는다고?","items":[{"n":1,"t":"tf","q":"Parents in Denmark must choose from an official list of approved names.","ko":"덴마크의 부모는 승인된 이름의 공식 목록에서 골라야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Parents in Denmark must choose from an official list of over 18,000 approved names.","덴마크의 부모는 18,000개가 넘는 승인된 이름의 공식 목록에서 골라야 한다."]],"w":"3번 문장 Parents in Denmark must choose from an official list of over 18,000 approved names와 같은 내용.","c":"T"},"h":"2446ee8fc3"},{"n":2,"t":"tf","q":"Names like Monkey are allowed in Denmark.","ko":"Monkey 같은 이름은 덴마크에서 허용된다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Names that are considered rude, very unusual, or likely to cause problems, like Monkey, are not allowed.","Monkey처럼 무례하거나, 매우 특이하거나, 문제를 일으킬 가능성이 있다고 여겨지는 이름은 허용되지 않는다."]],"w":"5번 문장에서 Monkey처럼 무례하거나 문제를 일으킬 수 있는 이름은 are not allowed(허용되지 않는다)라고 함.","c":"F"},"h":"936aa0ba6f"},{"n":3,"t":"tf","q":"Parents can apply for approval if their preferred name is not on the list.","ko":"원하는 이름이 목록에 없으면 부모는 승인을 신청할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"If their preferred name is not on the list, they can apply for approval through a government agency.","원하는 이름이 목록에 없으면, 그들은 정부 기관을 통해 승인을 신청할 수 있다."]],"w":"7번 문장 If their preferred name is not on the list, they can apply for approval…과 같은 내용.","c":"T"},"h":"e7d2c894e6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… an official list of over 18,000 approved names.)","ko":"… 18,000개가 넘는 ( ) 이름의 공식 목록.","opts":["금지된","승인된","오래된","외국의"],"word":"approved","r":{"a":"2) 승인된","ev":"3번 문장","s":[[3,"Parents in Denmark must choose from an official list of over 18,000 approved names.","덴마크의 부모는 18,000개가 넘는 승인된 이름의 공식 목록에서 골라야 한다."]],"w":"3번에서 부모가 이 목록에서 골라야 하고, 7번에서 목록에 없으면 승인을 신청한다고 함. 그래서 approved = 승인된. 금지된은 반대.","c":2},"h":"7ac34e7934"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (While these naming laws might seem strict, they are meant to protect children…)","ko":"이러한 작명 법이 ( ) 보일 수 있지만, 그것은 아이들을 보호하기 위한 것이다.","opts":["느슨해","재미있어","엄격해","쉬워"],"word":"strict","r":{"a":"3) 엄격해","ev":"9번 문장","s":[[9,"While these naming laws might seem strict, they are meant to protect children from shame, confusion, or even bullying.","이러한 작명 법이 엄격해 보일 수 있지만, 그것은 아이들을 수치심, 혼란, 심지어 괴롭힘으로부터 보호하기 위한 것이다."]],"w":"2~5번에서 이름을 마음대로 못 짓고 지침과 목록을 따라야 한다고 했으므로 법이 strict = 엄격해 보임. While(~이지만)은 그래도 보호하려는 것이라는 대조를 만듦.","c":3},"h":"47af5ebf90"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nIf their preferred name is not on the list, they can apply for approval through a government agency.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"원하는 이름이 목록에 없으면, 그들은 정부 기관을 통해 승인을 신청할 수 있다.","opts":["이름 목록","정부 기관 직원들","덴마크어 철자 규칙","다른 문화권에서 온, 가족의 유산을 담은 이름을 원하는 부모들"],"r":{"a":"4) 다른 문화권에서 온, 가족의 유산을 담은 이름을 원하는 부모들","ev":"6~7번 문장","s":[[6,"But what about parents from other cultures who want a name that reflects their family heritage?","하지만 가족의 유산을 반영하는 이름을 원하는 다른 문화권의 부모는 어떨까?"],[7,"If their preferred name is not on the list, they can apply for approval through a government agency.","원하는 이름이 목록에 없으면, 그들은 정부 기관을 통해 승인을 신청할 수 있다."]],"w":"6번에서 가족의 유산을 반영하는 이름을 원하는 다른 문화권의 부모를 말했고, 7번의 they는 그 부모들. 승인을 신청하는 쪽이므로 정부 기관 직원이 아님.","c":4},"h":"bcc1366e69"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Beyond that, the rules reflect Denmark’s effort to preserve cultural identity.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 너머에, 이 규칙들은 문화적 정체성을 지키려는 덴마크의 노력을 반영한다.","opts":["그 외에도, 이 규칙들은 문화적 정체성을 지키려는 덴마크의 노력을 보여 준다.","그 이후로 덴마크는 문화적 정체성을 버리려고 노력해 왔다.","이 규칙들은 덴마크가 문화적 정체성을 잃어서 생긴 결과이다.","이 규칙들 때문에 덴마크의 다른 문화가 사라지고 있다."],"r":{"a":"1) 그 외에도, 이 규칙들은 문화적 정체성을 지키려는 덴마크의 노력을 보여 준다.","ev":"10번 문장","s":[[10,"Beyond that, the rules reflect Denmark’s effort to preserve cultural identity.","그 너머에, 이 규칙들은 문화적 정체성을 지키려는 덴마크의 노력을 반영한다."]],"w":"Beyond that은 '그것 외에도'로 9번의 이유에 하나를 더한다는 뜻. preserve cultural identity는 문화적 정체성을 지킨다는 뜻이라 버린다·잃는다는 말은 반대.","c":1},"h":"6456b26c73"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 같은 내용은?","oko":["덴마크의 부모는 원하는 이름을 마음대로 고를 수 있다.","이름은 남성, 여성, 또는 남녀 공용으로 표시된다.","부모가 원하는 이름은 모두 자동으로 승인된다.","해마다 약 10개의 이름만 검토된다."],"opts":["Danish parents can choose any name they like.","Names are marked as male, female, or unisex.","Every name that parents want is approved automatically.","Only about 10 names are reviewed each year."],"r":{"a":"2) Names are marked as male, female, or unisex.","ev":"4번 문장","s":[[4,"Each name is marked as male, female, or unisex, and it has to follow Danish spelling rules.","각 이름은 남성, 여성, 또는 남녀 공용으로 표시되며, 덴마크어 철자 규칙을 따라야 한다."]],"w":"4번에서 Each name is marked as male, female, or unisex라고 함. 선지 1은 2번의 정부 지침과 반대, 선지 3은 7번에서 승인을 신청해야 한다고 했고, 선지 4는 8번에서 1,100개가 넘는다고 함.","c":2},"h":"59947b3a84"},{"n":9,"t":"sum","q":"Denmark has naming rules to (A) children from shame, confusion, or bullying and to (B) its cultural identity.","ko":"덴마크는 아이들을 수치심, 혼란, 괴롭힘으로부터 (A)하고 문화적 정체성을 (B)하기 위해 작명 규칙을 둔다.","oko":["(A) 가르치다 / (B) 보존하다","(A) 보호하다 / (B) 잃다","(A) 벌주다 / (B) 보존하다","(A) 가르치다 / (B) 바꾸다","(A) 보호하다 / (B) 보존하다"],"opts":["(A) teach / (B) preserve","(A) protect / (B) lose","(A) punish / (B) preserve","(A) teach / (B) change","(A) protect / (B) preserve"],"r":{"a":"5) (A) protect / (B) preserve","ev":"9~10번 문장","s":[[9,"While these naming laws might seem strict, they are meant to protect children from shame, confusion, or even bullying.","이러한 작명 법이 엄격해 보일 수 있지만, 그것은 아이들을 수치심, 혼란, 심지어 괴롭힘으로부터 보호하기 위한 것이다."],[10,"Beyond that, the rules reflect Denmark’s effort to preserve cultural identity.","그 너머에, 이 규칙들은 문화적 정체성을 지키려는 덴마크의 노력을 반영한다."]],"w":"9번 meant to protect children(아이들을 보호하기 위한 것), 10번 effort to preserve cultural identity(문화적 정체성을 지키려는 노력). 가르치거나 벌주는 내용은 없고, 정체성을 잃거나 바꾸려는 것도 아님.","c":5},"h":"d24cfacc0c"},{"n":10,"t":"fill","q":"If their preferred name is not on the list, they can [A] for approval through a government agency, and over 1,100 names are [B] this way each year.","ko":"원하는 이름이 목록에 없으면 정부 기관을 통해 승인을 [A]할 수 있고, 해마다 1,100개가 넘는 이름이 이런 방식으로 [B].","bank":["apply","reviewed","follow","protect","reflect","preserve"],"bko":{"apply":"신청하다","reviewed":"검토되는","follow":"따르다","protect":"보호하다","reflect":"반영하다","preserve":"지키다"},"r":{"a":"[A] apply, [B] reviewed","ev":"7~8번 문장","s":[[7,"If their preferred name is not on the list, they can apply for approval through a government agency.","원하는 이름이 목록에 없으면, 그들은 정부 기관을 통해 승인을 신청할 수 있다."],[8,"Each year, over 1,100 names are reviewed this way.","해마다 1,100개가 넘는 이름이 이런 방식으로 검토된다."]],"w":"7번 they can apply for approval, 8번 over 1,100 names are reviewed this way에서 가져옴. follow·protect·reflect·preserve는 다른 문장의 동사라 'are ___ this way'(수동형)나 'for approval'과 이어지지 않음.","c":null},"h":"6f0453e89e"}]},{"u":3,"id":"b4-03-1","no":1,"ko":"누구는 향긋, 누구는 비누? 고수 맛의 비밀","items":[{"n":1,"t":"tf","q":"Aldehydes in cilantro give it a sharp, soapy scent.","ko":"고수 속 알데하이드는 날카롭고 비누 같은 냄새를 낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","w":"6번 문장에 chemicals that give it a sharp, soapy scent가 있음. 알데하이드가 비누 같은 냄새를 낸다는 내용과 일치.","c":"T","s":[[6,"Cilantro contains aldehydes, chemicals that give it a sharp, soapy scent.","고수에는 날카롭고 비누 같은 냄새를 내는 화학 물질인 알데하이드가 들어 있다."]]},"h":"2d6ee806f0"},{"n":2,"t":"tf","q":"Only people who dislike cilantro carry the OR6A2 gene.","ko":"고수를 싫어하는 사람만 OR6A2 유전자를 가지고 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번 문장에 Everyone carries a gene called OR6A2라고 되어 있음. 모든 사람이 가지고 있고, 일부만 변이를 가지고 있는 것이라 본문과 다름.","c":"F","s":[[7,"Everyone carries a gene called OR6A2 that detects these chemicals.","모든 사람은 이 화학 물질을 감지하는 OR6A2라는 유전자를 가지고 있다."]]},"h":"83f6cbf699"},{"n":3,"t":"tf","q":"Cilantro is a popular herb used in many dishes around the world.","ko":"고수는 전 세계 많은 요리에 쓰이는 인기 있는 허브이다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번 문장에 a popular herb used in many dishes around the world가 그대로 나옴. 본문과 일치.","c":"T","s":[[2,"It is a popular herb used in many dishes around the world.","그것은 전 세계 많은 요리에 쓰이는 인기 있는 허브이다."]]},"h":"b7c822d001"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... not just picky eating!)","ko":"… 단지 ( ) 식습관 때문만은 아닌","opts":["서두르는","양이 많은","까다로운, 편식하는","건강한"],"word":"picky","r":{"a":"3) 까다로운, 편식하는","ev":"12번 문장","w":"12번 문장 picky eating은 음식을 가리는 편식. picky = 입맛이 까다로운. 건강하거나 양이 많다는 뜻은 아님.","c":3,"s":[[12,"So if you think cilantro tastes bad, it might be because of both your genes and experiences, not just picky eating!","그러니 고수가 맛없다고 생각한다면, 그것은 단지 편식 때문이 아니라 유전자와 경험 둘 다 때문일 수도 있다!"]]},"h":"a27e2de2d9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Everyone carries a gene called OR6A2 that detects these chemicals.)","ko":"모든 사람은 이 화학 물질을 ( ) OR6A2라는 유전자를 가지고 있다.","opts":["감지하다","없애다","섞다","만들다"],"word":"detects","r":{"a":"1) 감지하다","ev":"7번 문장","w":"7번 문장에서 OR6A2 유전자가 알데하이드를 알아채는 일을 함. detect(detects의 기본형) = 감지하다. 없애거나 만든다는 말은 없음.","c":1,"s":[[7,"Everyone carries a gene called OR6A2 that detects these chemicals.","모든 사람은 이 화학 물질을 감지하는 OR6A2라는 유전자를 가지고 있다."]]},"h":"0ee11f40ff"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nAs a result, cilantro tastes like soap to them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그 결과, 그들에게 고수는 비누 같은 맛이 난다.","opts":["고수를 처음 먹는 사람들","알데하이드라는 화학 물질","고수를 요리하는 사람들","유전자 변이를 가진 일부 사람들"],"r":{"a":"4) 유전자 변이를 가진 일부 사람들","ev":"8~9번 문장","w":"9번의 As a result(그 결과)는 8번의 내용 때문에 생긴 결과. 8번에서 알데하이드에 더 민감한 사람들이 some people이므로 them은 그 사람들.","c":4,"s":[[8,"However, some people have a variation of this gene that makes them more sensitive to aldehydes.","하지만 어떤 사람들은 이 유전자의 변이를 가지고 있어서 알데하이드에 더 민감하다."],[9,"As a result, cilantro tastes like soap to them.","그 결과, 그들에게 고수는 비누 같은 맛이 난다."]]},"h":"8bd0be7eee"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But genes explain only part of this difference.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 유전자는 이 차이의 일부만 설명한다.","opts":["유전자는 고수 맛의 차이와 전혀 관계가 없다.","유전자만으로는 사람마다 맛이 다른 이유를 다 설명할 수 없다.","유전자가 고수 맛의 차이를 모두 결정한다.","고수 맛의 차이는 문화 때문에만 생긴다."],"r":{"a":"2) 유전자만으로는 사람마다 맛이 다른 이유를 다 설명할 수 없다.","ev":"10번 문장","w":"only part(일부만)는 전부가 아니라는 뜻. 유전자도 이유의 일부지만 나머지는 다른 요인(11번). '전혀 관계없다'나 '모두 결정한다'는 only part와 맞지 않음.","c":2,"s":[[10,"But genes explain only part of this difference.","하지만 유전자는 이 차이의 일부만 설명한다."]]},"h":"260d6dff58"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["모든 사람은 유전자가 같아서 고수에 대해 똑같이 느낀다.","고수는 몇몇 나라에서만 인기가 있다.","어떤 사람들은 고수에서 비누 맛이 난다고 느낀다.","고수를 싫어하는 사람만 OR6A2 유전자를 가지고 있다."],"opts":["Everyone feels the same about cilantro because their genes are the same.","Cilantro is popular in only a few countries.","Some people find that cilantro tastes like soap.","Only people who dislike cilantro carry the OR6A2 gene."],"r":{"a":"3) Some people find that cilantro tastes like soap.","ev":"3번, 8~9번 문장","w":"8~9번에서 변이를 가진 사람들은 알데하이드에 민감해 고수가 비누 맛이 난다고 함. 선지 1은 3번(사람마다 반응이 다름), 선지 2는 2번(전 세계 요리), 선지 4는 7번(모든 사람이 유전자를 가짐)과 어긋남.","c":3,"s":[[3,"Some people love its fresh flavor and smell, but others really dislike it.","어떤 사람들은 고수의 신선한 맛과 향을 아주 좋아하지만, 다른 사람들은 정말 싫어한다."],[8,"However, some people have a variation of this gene that makes them more sensitive to aldehydes.","하지만 어떤 사람들은 이 유전자의 변이를 가지고 있어서 알데하이드에 더 민감하다."],[9,"As a result, cilantro tastes like soap to them.","그 결과, 그들에게 고수는 비누 같은 맛이 난다."]]},"h":"772cb3d9ca"},{"n":9,"t":"sum","q":"Some people have a (A) of the OR6A2 gene that makes them more (B) to aldehydes, so cilantro tastes like soap to them.","ko":"어떤 사람들은 OR6A2 유전자의 (A)을 가지고 있어 알데하이드에 더 (B)해서, 고수가 비누 맛으로 느껴진다.","oko":["(A) 변이 / (B) 보지 못하는","(A) 부족 / (B) 민감한","(A) 변이 / (B) 영향받지 않는","(A) 실수 / (B) 끌리는","(A) 변이 / (B) 민감한"],"opts":["(A) variation / (B) blind","(A) shortage / (B) sensitive","(A) variation / (B) immune","(A) mistake / (B) attracted","(A) variation / (B) sensitive"],"r":{"a":"5) (A) variation / (B) sensitive","ev":"8~9번 문장","w":"8번에 a variation of this gene(유전자의 변이)과 more sensitive to aldehydes(알데하이드에 더 민감한)가 그대로 나옴. 9번이 그 결과. 다른 선지는 의미가 맞지 않음.","c":5,"s":[[8,"However, some people have a variation of this gene that makes them more sensitive to aldehydes.","하지만 어떤 사람들은 이 유전자의 변이를 가지고 있어서 알데하이드에 더 민감하다."],[9,"As a result, cilantro tastes like soap to them.","그 결과, 그들에게 고수는 비누 같은 맛이 난다."]]},"h":"eaadb7c5d5"},{"n":10,"t":"fill","q":"Our [A] and our [B], such as culture and what we ate growing up, both affect whether we like cilantro.","ko":"우리의 [A]와 문화·어릴 때 먹은 음식 같은 [B]는 모두 우리가 고수를 좋아하는지에 영향을 준다.","bank":["aldehydes","genes","herb","experiences","variation","scent"],"bko":{"aldehydes":"알데하이드","genes":"유전자","herb":"허브","experiences":"경험","variation":"변이","scent":"냄새"},"r":{"a":"[A] genes, [B] experiences","ev":"11~12번 문장","w":"11번에서 음식·문화가 영향을 주고, 12번에서 both your genes and experiences(유전자와 경험 둘 다)라고 정리함. aldehydes, scent 등은 '우리의 ~'로 쓰기 어색하고 이 결론과 맞지 않음.","c":null,"s":[[11,"What you eat while growing up and your culture may also affect whether you enjoy the flavor of cilantro.","어린 시절에 무엇을 먹었는지와 문화도 고수의 맛을 즐기는지에 영향을 줄 수 있다."],[12,"So if you think cilantro tastes bad, it might be because of both your genes and experiences, not just picky eating!","그러니 고수가 맛없다고 생각한다면, 그것은 단지 편식 때문이 아니라 유전자와 경험 둘 다 때문일 수도 있다!"]]},"h":"d05e7232b0"}]},{"u":3,"id":"b4-03-2","no":2,"ko":"얼음인데 녹지 않는다? 드라이아이스의 두 얼굴","items":[{"n":1,"t":"tf","q":"Dry ice can get as cold as -78.5°C.","ko":"드라이아이스는 영하 78.5°C까지 차가워질 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","w":"3번 문장에 can reach temperatures as low as -78.5°C가 있음. 영하 78.5°C까지 내려간다는 내용과 일치.","c":"T","s":[[3,"Because of this, dry ice becomes extremely cold and can reach temperatures as low as -78.5°C.","이 때문에 드라이아이스는 극도로 차가워지며 영하 78.5°C까지 내려갈 수 있다."]]},"h":"984da7d542"},{"n":2,"t":"tf","q":"Dry ice melts into a liquid when it gets warm.","ko":"드라이아이스는 따뜻해지면 녹아서 액체가 된다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","w":"4번에서 doesn’t melt into a liquid(액체로 녹지 않는다)라고 하고, 5번에서 곧바로 기체로 변한다고 함. 액체가 된다는 말은 본문과 반대.","c":"F","s":[[4,"It also doesn’t melt into a liquid.","또한 그것은 녹아서 액체가 되지 않는다."],[5,"Instead, it changes directly from a solid into a gas.","대신, 고체에서 곧바로 기체로 변한다."]]},"h":"7cb6c79807"},{"n":3,"t":"tf","q":"Dry ice should be used in open places for safety.","ko":"안전을 위해 드라이아이스는 트인 장소에서 사용해야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"15번 문장","w":"15번 문장에 handled with gloves and used in open places가 있음. 장갑을 끼고 트인 장소에서 쓴다는 내용과 일치.","c":"T","s":[[15,"For safety, it should be handled with gloves and used in open places.","안전을 위해 장갑을 끼고 트인 장소에서 사용해야 한다."]]},"h":"25cce2f7bf"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Dry ice may look like regular ice, but it has very different properties.)","ko":"드라이아이스는 보통 얼음처럼 보일 수 있지만, 매우 다른 ( )을 가지고 있다.","opts":["재산","성질, 특성","가격","크기"],"word":"properties","r":{"a":"2) 성질, 특성","ev":"1번 문장","w":"1번에서 겉모습은 비슷해도 properties가 다르다고 함. 뒤의 2~5번이 얼음의 재료, 온도, 녹지 않는 점 등 성질을 설명하므로 properties = 성질. '재산'은 property의 다른 뜻이라 여기서는 틀림.","c":2,"s":[[1,"Dry ice may look like regular ice, but it has very different properties.","드라이아이스는 보통 얼음처럼 보일 수 있지만, 매우 다른 성질을 가지고 있다."]]},"h":"8efddeb993"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... the gas it releases can build up in small spaces and make it hard to breathe.)","ko":"… 그것이 내뿜는 기체는 좁은 공간에 ( ) 숨쉬기 어렵게 만들 수 있다.","opts":["사라지다","얼어붙다","퍼져 나가다","쌓이다, 모이다"],"word":"build up","r":{"a":"4) 쌓이다, 모이다","ev":"14번 문장","w":"14번에서 기체가 좁은 공간에 계속 나와 숨쉬기 어렵게 된다는 것이니 기체가 쌓인다는 뜻. 사라지거나 퍼져 나가면 숨쉬기 어려워질 이유가 없음.","c":4,"s":[[14,"Also, the gas it releases can build up in small spaces and make it hard to breathe.","또한, 그것이 내뿜는 기체는 좁은 공간에 쌓여 숨쉬기 어렵게 만들 수 있다."]]},"h":"27ce5f1335"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is why it is called “dry” ice.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것이 그것이 '드라이(마른)' 아이스라고 불리는 이유이다.","opts":["드라이아이스가 녹아서 액체가 되지 않고 고체에서 곧바로 기체로 변하는 것","드라이아이스가 영하 78.5°C까지 내려가는 것","보통 얼음이 얼린 물로 만들어지는 것","드라이아이스가 하얀 안개를 만드는 것"],"r":{"a":"1) 드라이아이스가 녹아서 액체가 되지 않고 고체에서 곧바로 기체로 변하는 것","ev":"4~6번 문장","w":"6번 This는 바로 앞 4~5번의 내용. 액체가 되지 않고 곧장 기체가 되므로 젖지 않아 dry(마른)라고 부름.","c":1,"s":[[4,"It also doesn’t melt into a liquid.","또한 그것은 녹아서 액체가 되지 않는다."],[5,"Instead, it changes directly from a solid into a gas.","대신, 고체에서 곧바로 기체로 변한다."],[6,"This is why it is called “dry” ice.","이것이 그것이 '드라이(마른)' 아이스라고 불리는 이유이다."]]},"h":"08d838592e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Touching it with bare hands can freeze the skin instantly.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"맨손으로 만지면 피부가 순식간에 얼 수 있다.","opts":["드라이아이스를 만지면 손이 따뜻해지고 부드러워진다.","드라이아이스를 만지고 한참 지난 뒤에야 피부가 얼 수 있다.","장갑 없이 드라이아이스를 만지면 피부가 아주 빨리 얼어붙을 수 있다.","장갑을 끼고 만져야만 드라이아이스가 얼음으로 변한다."],"r":{"a":"3) 장갑 없이 드라이아이스를 만지면 피부가 아주 빨리 얼어붙을 수 있다.","ev":"13번 문장","w":"bare hands는 맨손, instantly는 순식간에라는 뜻. 장갑 없이 만지면 피부가 바로 얼 수 있다는 경고. 따뜻해진다거나 한참 뒤에 언다는 말은 본문과 반대.","c":3,"s":[[13,"Touching it with bare hands can freeze the skin instantly.","맨손으로 만지면 피부가 순식간에 얼 수 있다."]]},"h":"094c7195a8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["보통 얼음은 이산화탄소로 만들어진다.","드라이아이스는 이산화탄소의 고체 형태이다.","드라이아이스는 콘서트에서 안개를 만드는 데만 쓰인다.","드라이아이스는 맨손으로 만져도 안전하다."],"opts":["Regular ice is made of carbon dioxide.","Dry ice is the solid form of carbon dioxide.","Dry ice is used only for making fog at concerts.","Dry ice is safe to touch with bare hands."],"r":{"a":"2) Dry ice is the solid form of carbon dioxide.","ev":"2번 문장","w":"2번에서 dry ice is the solid form of carbon dioxide라고 함. 선지 1은 보통 얼음이 얼린 물로 만들어진다는 2번과 반대, 선지 3은 8번에서 음식과 약을 보관하는 데도 쓰인다고 했고, 선지 4는 13번에서 맨손으로 만지면 위험하다고 함.","c":2,"s":[[2,"Regular ice is made of frozen water, but dry ice is the solid form of carbon dioxide.","보통 얼음은 얼린 물로 만들어지지만, 드라이아이스는 이산화탄소의 고체 형태이다."]]},"h":"d367489b1f"},{"n":9,"t":"sum","q":"Dry ice’s special properties make it (A) in many situations, such as keeping food and medicine (B) during shipping.","ko":"드라이아이스의 특별한 성질은 여러 상황에서 그것을 (A)하게 만들며, 예를 들어 운송 중 음식과 약을 (B)하게 유지한다.","oko":["(A) 위험한 / (B) 신선한","(A) 유용한 / (B) 뜨거운","(A) 쓸모없는 / (B) 신선한","(A) 유용한 / (B) 신선한","(A) 해로운 / (B) 따뜻한"],"opts":["(A) dangerous / (B) fresh","(A) useful / (B) hot","(A) useless / (B) fresh","(A) useful / (B) fresh","(A) harmful / (B) warm"],"r":{"a":"4) (A) useful / (B) fresh","ev":"7~8번 문장","w":"7번 make dry ice useful(유용하게 만든다), 8번 keep food and medicine fresh(신선하게 유지). 위험하다·해롭다는 12번 이후의 이야기이고, hot이나 warm은 매우 차가운 성질과 반대.","c":4,"s":[[7,"These special properties make dry ice useful in many situations.","이러한 특별한 성질 덕분에 드라이아이스는 여러 상황에서 유용하다."],[8,"It is often used to keep food and medicine fresh during shipping.","그것은 운송 중에 음식과 약을 신선하게 유지하는 데 자주 쓰인다."]]},"h":"ccb6068509"},{"n":10,"t":"fill","q":"Dry ice can be [A] if not handled carefully, because it can [B] the skin instantly and its gas can build up in small spaces.","ko":"드라이아이스는 조심해서 다루지 않으면 [A]할 수 있는데, 피부를 순식간에 [B] 수 있고 그 기체가 좁은 공간에 쌓일 수 있기 때문이다.","bank":["dangerous","freeze","form","useful","warm","fog"],"bko":{"dangerous":"위험한","freeze":"얼리다","form":"만들다","useful":"유용한","warm":"따뜻한","fog":"안개"},"r":{"a":"[A] dangerous, [B] freeze","ev":"12~14번 문장","w":"12번 However 이후는 안전하게 다뤄야 한다는 위험 이야기이고, 13번에 can freeze the skin instantly(피부를 순식간에 얼릴 수 있다), 14번에 기체가 쌓여 숨쉬기 어렵다는 위험이 나옴. form(만들다)은 '피부를 만들다'가 되어 말이 안 되고, useful·warm은 위험하다는 흐름과 반대이며, fog는 명사라 빈칸에 맞지 않음.","c":null,"s":[[12,"However, dry ice must be handled safely.","하지만 드라이아이스는 안전하게 다루어야 한다."],[13,"Touching it with bare hands can freeze the skin instantly.","맨손으로 만지면 피부가 순식간에 얼 수 있다."],[14,"Also, the gas it releases can build up in small spaces and make it hard to breathe.","또한, 그것이 내뿜는 기체는 좁은 공간에 쌓여 숨쉬기 어렵게 만들 수 있다."]]},"h":"bf40613eb3"}]},{"u":3,"id":"b4-03-3","no":3,"ko":"가만히 서 있는 식물, 씨앗은 어떻게 여행할까?","items":[{"n":1,"t":"tf","q":"Seeds that travel by water often have hard shells.","ko":"물로 이동하는 씨앗은 단단한 껍질을 가진 경우가 많다.","r":{"a":"T (본문과 맞는 내용)","ev":"7~8번 문장","w":"7번에서 물로 이동하는 씨앗을 소개하고, 8번에서 hard shells to protect them(보호하는 단단한 껍질)이 있다고 함. 본문과 일치.","c":"T","s":[[7,"Other seeds travel by water.","다른 씨앗들은 물을 통해 이동한다."],[8,"These seeds often have hard shells to protect them during long journeys.","이 씨앗들은 긴 여정 동안 씨앗을 보호하는 단단한 껍질을 가진 경우가 많다."]]},"h":"938abd07b8"},{"n":2,"t":"tf","q":"Maple seeds float like tiny parachutes.","ko":"단풍나무 씨앗은 작은 낙하산처럼 떠다닌다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","w":"6번에서 낙하산처럼 떠다니는 것은 민들레(dandelion) 씨앗. 단풍나무 씨앗은 날개 모양 때문에 공중에서 빙글빙글 돈다고 함.","c":"F","s":[[6,"For example, dandelion seeds float like tiny parachutes, while maple seeds spin through the air due to their wing-like shape.","예를 들어, 민들레 씨앗은 작은 낙하산처럼 떠다니고, 단풍나무 씨앗은 날개 같은 모양 덕분에 공중에서 빙글빙글 돈다."]]},"h":"8018bc944e"},{"n":3,"t":"tf","q":"Animals do not play a role in spreading seeds.","ko":"동물은 씨앗을 퍼뜨리는 데 아무런 역할을 하지 않는다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","w":"10번에 Animals also play a key role in spreading seeds(동물도 중요한 역할을 한다)라고 함. 역할이 없다는 말은 본문과 반대.","c":"F","s":[[10,"Animals also play a key role in spreading seeds.","동물도 씨앗을 퍼뜨리는 데 중요한 역할을 한다."]]},"h":"b72eaa4ea9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... they will compete for sunlight, water, and nutrients.)","ko":"... 그것들은 햇빛, 물, 영양분을 두고 ( )하게 될 것이다.","opts":["협력하다","경쟁하다","나누다","기다리다"],"word":"compete","r":{"a":"2) 경쟁하다","ev":"2번 문장","w":"2번에서 씨앗이 한곳에 모여 자라면 햇빛·물·영양분을 두고 서로 차지하려 다툼. compete(경쟁하다). 협력하거나 나눈다면 문제가 되지 않음.","c":2,"s":[[2,"If all the seeds grow near the parent plant, they will compete for sunlight, water, and nutrients.","모든 씨앗이 어미 식물 가까이에서 자라면, 그것들은 햇빛, 물, 영양분을 두고 경쟁하게 될 것이다."]]},"h":"382438e0ce"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Coconuts can cross oceans and survive until they reach a suitable place to grow.)","ko":"코코넛은 바다를 건너 자라기에 ( ) 곳에 닿을 때까지 살아남을 수 있다.","opts":["위험한","먼","알맞은, 적합한","좁은"],"word":"suitable","r":{"a":"3) 알맞은, 적합한","ev":"9번 문장","w":"9번에서 코코넛은 긴 여행 끝에 자랄 수 있는 곳에 닿을 때까지 버팀. suitable place to grow = 자라기에 알맞은 곳. 위험하거나 좁은 곳이면 자랄 수 없음.","c":3,"s":[[9,"Coconuts can cross oceans and survive until they reach a suitable place to grow.","코코넛은 바다를 건너 자라기에 알맞은 곳에 닿을 때까지 살아남을 수 있다."]]},"h":"21a4ee69bf"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThese seeds are light and often have soft hairs or thin wings that help them ride the wind.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이 씨앗들은 가볍고 바람을 타도록 돕는 부드러운 털이나 얇은 날개를 가진 경우가 많다.","opts":["부드러운 털","얇은 날개","어미 식물들","바람에 의존하는 씨앗들"],"r":{"a":"4) 바람에 의존하는 씨앗들","ev":"4~5번 문장","w":"5번 These seeds는 4번에서 말한 바람에 의존하는 식물의 씨앗. 털과 날개가 이 씨앗들이 바람을 타도록 돕는 것이므로, 도움을 받는 them은 씨앗들.","c":4,"s":[[4,"Some plants rely on wind.","어떤 식물들은 바람에 의존한다."],[5,"These seeds are light and often have soft hairs or thin wings that help them ride the wind.","이 씨앗들은 가볍고 바람을 타도록 돕는 부드러운 털이나 얇은 날개를 가진 경우가 많다."]]},"h":"a5cc60ff0f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Apple seeds are inside the fruit, and when animals eat the fruit, the seeds pass through their bodies and are dropped in new places.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"사과 씨앗은 과일 안에 있고, 동물이 그 과일을 먹으면 씨앗은 동물의 몸을 통과해 새로운 곳에 버려진다.","opts":["동물이 과일을 먹으면 그 속의 씨앗이 동물의 몸을 지나 다른 곳에 떨어져 퍼진다.","사과 씨앗은 동물이 먹기 전에 스스로 날아가 새로운 곳에 닿는다.","동물이 사과 씨앗을 먹으면 씨앗은 몸속에서 모두 죽는다.","사과 씨앗은 갈고리로 동물의 털에 붙어서 옮겨진다."],"r":{"a":"1) 동물이 과일을 먹으면 그 속의 씨앗이 동물의 몸을 지나 다른 곳에 떨어져 퍼진다.","ev":"12번 문장","w":"pass through their bodies는 동물의 몸을 통과한다는 뜻, are dropped in new places는 새 장소에 떨어진다는 뜻. 날아가거나, 죽거나, 갈고리로 붙는다는 말은 없음(갈고리는 우엉 씨앗).","c":1,"s":[[12,"Apple seeds are inside the fruit, and when animals eat the fruit, the seeds pass through their bodies and are dropped in new places.","사과 씨앗은 과일 안에 있고, 동물이 그 과일을 먹으면 씨앗은 동물의 몸을 통과해 새로운 곳에 버려진다."]]},"h":"e57dfa9a37"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["민들레 씨앗은 날개 같은 모양 때문에 공중에서 빙글빙글 돈다.","코코넛은 바다를 건너는 긴 여행에서도 살아남을 수 있다.","바람으로 이동하는 씨앗은 무겁고 단단한 껍질이 있다.","우엉 씨앗은 물로부터 보호하는 단단한 껍질이 있다."],"opts":["Dandelion seeds spin through the air because of their wing-like shape.","Coconuts can survive long trips across the ocean.","Seeds that travel by wind are heavy and have hard shells.","Burdock seeds have hard shells to protect them from water."],"r":{"a":"2) Coconuts can survive long trips across the ocean.","ev":"5~6번, 8~9번, 11번 문장","w":"9번에서 코코넛은 바다를 건너 살아남는다고 함. 나머지는 틀림: 날개 모양 때문에 도는 것은 단풍나무(6번), 바람 씨앗은 가벼움(5번), 갈고리가 있는 것은 우엉(11번).","c":2,"s":[[5,"These seeds are light and often have soft hairs or thin wings that help them ride the wind.","이 씨앗들은 가볍고 바람을 타도록 돕는 부드러운 털이나 얇은 날개를 가진 경우가 많다."],[6,"For example, dandelion seeds float like tiny parachutes, while maple seeds spin through the air due to their wing-like shape.","예를 들
