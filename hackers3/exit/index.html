s to the way product information spreads quickly and widely, like the way a virus infects people.","‘바이럴’이라는 용어는 바이러스가 사람들을 감염시키는 방식처럼, 제품 정보가 빠르게 널리 퍼지는 방식을 나타낸다."]],"w":"2번은 viral이라는 말의 뜻을 설명하는 문장이에요. 그 용어가 '정보가 빠르게 퍼지는 방식'을 가리킨다는 뜻이에요. refer to = ~을 나타내다, 가리키다.","c":3},"h":"a454258f99"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It revealed a fun image of an Oreo inspired by pop culture.)","ko":"그것은 대중문화에서 ( ) 오레오의 재미있는 사진을 공개했다. (밑줄 친 단어의 뜻은?)","opts":["지친","영감을 얻은","숨겨진","팔린"],"word":"inspired","r":{"a":"2) 영감을 얻은","ev":"5번, 7번 문장","s":[[5,"It revealed a fun image of an Oreo inspired by pop culture once a day for 100 days.","그것은 100일 동안 하루에 한 번 대중문화에서 영감을 얻은 오레오의 재미있는 사진을 공개했다."],[7,"For example, a “Batman Oreo” image was posted when The Dark Knight Rises movie came out.","예를 들어, <다크 나이트 라이즈> 영화가 나왔을 때 ‘배트맨 오레오’ 사진이 올려졌다."]],"w":"5번에서 오레오 사진은 대중문화에서 나온 것이고, 7번에서 영화가 나왔을 때 올린 배트맨 오레오가 그 예예요. inspired by ~는 '~에서 영감을 얻은'이에요.","c":2},"h":"235f93725c"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThere was also a “Gangnam Style Oreo” that showed the famous horse dance.","ko":"밑줄 친 that이(가) 가리키는 것은?","sko":"또한 그 유명한 말춤을 보여준 ‘강남 스타일 오레오’도 있었다.","opts":["‘강남 스타일 오레오’ 사진","<다크 나이트 라이즈> 영화","‘배트맨 오레오’ 사진","오레오의 소셜 미디어 페이지"],"r":{"a":"1) ‘강남 스타일 오레오’ 사진","ev":"8번 문장","s":[[8,"There was also a “Gangnam Style Oreo” that showed the famous horse dance.","또한 그 유명한 말춤을 보여준 ‘강남 스타일 오레오’도 있었다."]],"w":"8번의 that은 바로 앞의 “Gangnam Style Oreo”를 가리켜요. 말춤을 보여준 것이 강남 스타일 오레오 사진이에요.","c":1,"k":"that = ‘강남 스타일 오레오’ 사진"},"pron":"that","h":"4feb2ea08c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Though Oreo didn’t ask people to share the event, the images were all over social media, spreading as fast as a virus!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오레오가 사람들에게 이벤트를 공유해달라고 요청하지 않았는데도, 사진들은 바이러스만큼 빠르게 퍼지면서, 소셜 미디어 곳곳에 있었다!","opts":["오레오가 이벤트를 공유해 달라고 요청하지 않았는데도, 사진들은 바이러스만큼 빠르게 퍼지며 소셜 미디어 곳곳에 있었다.","오레오가 이벤트를 공유해 달라고 요청했기 때문에, 사진들이 소셜 미디어 곳곳에 퍼졌다.","오레오가 요청한 대로, 사진들은 소셜 미디어에서 아주 천천히 퍼졌다.","사람들은 소셜 미디어에서 오레오 사진을 보고 싶어 하지 않았다."],"r":{"a":"1) 오레오가 이벤트를 공유해 달라고 요청하지 않았는데도, 사진들은 바이러스만큼 빠르게 퍼지며 소셜 미디어 곳곳에 있었다.","ev":"11번 문장","s":[[11,"Though Oreo didn’t ask people to share the event, the images were all over social media, spreading as fast as a virus!","오레오가 사람들에게 이벤트를 공유해달라고 요청하지 않았는데도, 사진들은 바이러스만큼 빠르게 퍼지면서, 소셜 미디어 곳곳에 있었다!"]],"w":"Though는 '~하는데도'라서 오레오가 요청하지 않았는데도 사진들이 퍼졌다는 뜻이에요. spreading as fast as a virus는 '바이러스만큼 빠르게 퍼지면서'예요.","c":1},"h":"bebe2fc4f4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["강남 스타일 오레오 사진은 <다크 나이트 라이즈>가 나왔을 때 올려졌다.","배트맨 오레오 사진은 <다크 나이트 라이즈>가 만들어지기 전에 올려졌다.","오레오는 매일 똑같은 쿠키 사진을 올렸다.","배트맨 오레오 사진은 <다크 나이트 라이즈>가 나왔을 때 올려졌다."],"opts":["The Gangnam Style Oreo image was posted when The Dark Knight Rises came out.","A Batman Oreo image was posted before The Dark Knight Rises was made.","Oreo posted images of the same cookie every day.","A Batman Oreo image was posted when The Dark Knight Rises came out."],"r":{"a":"4) A Batman Oreo image was posted when The Dark Knight Rises came out. (배트맨 오레오 사진은 <다크 나이트 라이즈>가 나왔을 때 올려졌다.)","ev":"7~8번 문장","s":[[7,"For example, a “Batman Oreo” image was posted when The Dark Knight Rises movie came out.","예를 들어, <다크 나이트 라이즈> 영화가 나왔을 때 ‘배트맨 오레오’ 사진이 올려졌다."],[8,"There was also a “Gangnam Style Oreo” that showed the famous horse dance.","또한 그 유명한 말춤을 보여준 ‘강남 스타일 오레오’도 있었다."]],"w":"7번에서 영화 <다크 나이트 라이즈>가 나왔을 때 ‘배트맨 오레오’ 사진이 올려졌다고 해요.","c":4},"h":"62cc00edeb"},{"n":9,"t":"sum","q":"Viral marketing is a (A) tool for (B).","ko":"바이럴 마케팅은 (B)을(를) 위한 (A) 도구이다.","oko":["(A) 약한 / (B) 광고","(A) 강력한 / (B) 요리","(A) 쓸모없는 / (B) 스포츠","(A) 강력한 / (B) 광고","(A) 위험한 / (B) 학교"],"opts":["(A) weak / (B) advertising","(A) powerful / (B) cooking","(A) useless / (B) sports","(A) powerful / (B) advertising","(A) dangerous / (B) school"],"r":{"a":"4) (A) powerful / (B) advertising ((A) 강력한 / (B) 광고)","ev":"1번 문장","s":[[1,"Viral marketing is a powerful advertising tool.","바이럴 마케팅은 강력한 광고 수단이다."]],"w":"1번에서 바이럴 마케팅은 강력한 광고 수단(a powerful advertising tool)이라고 해요.","c":4},"h":"f861784bfa"},{"n":10,"t":"fill","q":"In honor of its 100-year [A], the company started a new [B].","ko":"그 회사는 100년 [A]을(를) 기념하여 새로운 [B]을(를) 시작했다.","bank":["anniversary","promotion","image","cookie","virus","movie"],"bko":{"anniversary":"기념일","promotion":"홍보 활동","image":"사진","cookie":"쿠키","virus":"바이러스","movie":"영화"},"r":{"a":"[A] anniversary (기념일), [B] promotion (홍보 활동)","ev":"4번 문장","s":[[4,"In honor of its 100-year anniversary, the company started a new promotion.","100주년을 기념하여, 그 회사는 새로운 홍보 활동을 시작했다."]],"w":"4번에서 회사가 100주년 기념일(100-year anniversary)을 기념해 새로운 홍보 활동(promotion)을 시작했다고 해요.","c":null},"h":"9d8094c4fa"}]},{"u":6,"id":"hk3-06-3","no":3,"ko":"땀은 모든 걸 알고 있다","items":[{"n":1,"t":"tf","q":"A sweat sensor is small, thin, and flexible.","ko":"땀 센서는 작고, 얇고, 탄력 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"A sweat sensor is a patch that is small, thin, and flexible.","땀 센서는 작고, 얇고, 탄력 있는 패치이다."]],"w":"4번 문장에서 땀 센서는 작고, 얇고, 탄력 있는(small, thin, and flexible) 패치라고 해요. 글의 내용과 같아요.","c":"T"},"h":"a3059b4004"},{"n":2,"t":"tf","q":"You have to put a sweat sensor inside your body.","ko":"땀 센서는 몸속에 넣어야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"You stick it on your body, and it measures specific chemicals in your sweat.","그것을 당신의 몸에 붙이면, 땀속의 특정 화학 성분들을 측정한다."]],"w":"5번 문장에서 센서를 몸 위에 붙이면(stick it on your body) 된다고 해요. 몸속에 넣는다는 말은 없어요.","c":"F"},"h":"4cf372ef99"},{"n":3,"t":"tf","q":"A sweat sensor can help people predict heart attacks by checking potassium levels.","ko":"땀 센서는 칼륨 수치를 확인해서 사람들이 심장마비를 예측하도록 도울 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"It can even help people predict heart attacks by checking the potassium levels in their sweat.","그것은 심지어 땀 속의 칼륨 수치를 확인함으로써 사람들이 심장마비를 예측하도록 도울 수도 있다."]],"w":"9번 문장에서 땀 속의 칼륨 수치를 확인함으로써 심장마비를 예측하도록 도울 수 있다고 해요. 글의 내용과 같아요.","c":"T"},"h":"59f33531b7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Most people hate sweating because it makes them smell bad and feel sticky.)","ko":"대부분의 사람은 땀 흘리는 것이 안 좋은 냄새가 나게 하고 ( ) 느끼게 만들기 때문에 싫어한다. (밑줄 친 단어의 뜻은?)","opts":["가벼운","끈적거리는","시원한","졸린"],"word":"sticky","r":{"a":"2) 끈적거리는","ev":"1번 문장","s":[[1,"Most people hate sweating because it makes them smell bad and feel sticky.","대부분의 사람은 땀 흘리는 것이 안 좋은 냄새가 나게 하고 끈적거림을 느끼게 만들기 때문에 싫어한다."]],"w":"1번은 사람들이 땀을 싫어하는 이유예요. 냄새와 함께 나오는 나쁜 느낌이니 시원하거나 가벼운 것이 아니에요. sticky = 끈적거리는.","c":2},"h":"93b5f94160"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (it measures specific chemicals in your sweat)","ko":"그것은 땀 속의 특정 화학 성분들을 ( ). (밑줄 친 단어의 뜻은?)","opts":["숨긴다","던진다","측정한다","판매한다"],"word":"measures","r":{"a":"3) 측정한다","ev":"5~6번 문장","s":[[5,"You stick it on your body, and it measures specific chemicals in your sweat.","그것을 당신의 몸에 붙이면, 땀속의 특정 화학 성분들을 측정한다."],[6,"For example, it can show glucose levels.","예를 들어, 그것은 포도당 수치를 보여줄 수 있다."]],"w":"5번에서 센서를 몸에 붙이면 땀 속 화학 성분을 알아내고, 6번에서 포도당 수치를 보여준다고 해요. 수치를 알아내는 일이니 measure = 측정하다예요.","c":3},"h":"6d43805923"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAnd best of all, they are comfortable to wear!","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"그리고 무엇보다도, 그것은 착용하기에 편하다!","opts":["땀 센서들","당뇨가 있는 사람들","혈액 검사들","화학 성분들"],"r":{"a":"1) 땀 센서들","ev":"12번 문장","s":[[12,"And best of all, they are comfortable to wear!","그리고 무엇보다도, 그것은 착용하기에 편하다!"]],"w":"12번의 they는 “착용하기에 편한(comfortable to wear)” 것이에요. 몸에 붙여서 쓰는 것은 땀 센서(패치)예요.","c":1,"k":"they = 땀 센서들"},"pron":"they","h":"5bc65240be"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Sweat sensors are able to reduce the time and effort required to check certain health conditions.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"땀 센서는 특정 건강 상태를 확인하기 위해 필요한 시간과 수고를 줄일 수 있다.","opts":["땀 센서는 건강 상태를 확인하는 데 더 많은 시간과 수고가 들게 한다.","땀 센서를 만들려면 많은 시간과 수고가 필요하다.","땀 센서는 특정한 건강 상태만 약하게 만들 수 있다.","땀 센서는 특정 건강 상태를 확인하는 데 필요한 시간과 수고를 줄일 수 있다."],"r":{"a":"4) 땀 센서는 특정 건강 상태를 확인하는 데 필요한 시간과 수고를 줄일 수 있다.","ev":"10번 문장","s":[[10,"Sweat sensors are able to reduce the time and effort required to check certain health conditions.","땀 센서는 특정 건강 상태를 확인하기 위해 필요한 시간과 수고를 줄일 수 있다."]],"w":"reduce는 '줄이다'이고, required to check ~는 앞의 the time and effort를 꾸며서 '~를 확인하는 데 필요한 시간과 수고'가 돼요. 센서가 그것을 줄여 준다는 뜻이에요.","c":4},"h":"cc55533959"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["땀 센서는 당신이 물을 얼마나 마셨는지만 보여줄 수 있다.","땀 센서는 포도당 수치를 보여줄 수 있다.","땀 센서는 포도당 수치를 보여줄 수 없다.","땀 센서는 땀 냄새를 더 좋게 만든다."],"opts":["A sweat sensor can only show how much water you drank.","A sweat sensor can show glucose levels.","A sweat sensor cannot show glucose levels.","A sweat sensor makes your sweat smell better."],"r":{"a":"2) A sweat sensor can show glucose levels. (땀 센서는 포도당 수치를 보여줄 수 있다.)","ev":"6번 문장","s":[[6,"For example, it can show glucose levels.","예를 들어, 그것은 포도당 수치를 보여줄 수 있다."]],"w":"6번에서 땀 센서는 포도당 수치(glucose levels)를 보여줄 수 있다고 해요.","c":2},"h":"e69e93129d"},{"n":9,"t":"sum","q":"A sweat sensor is (A) to people with diabetes because, without it, they would need many (B) tests during the day.","ko":"땀 센서는 당뇨가 있는 사람들에게 (A)한데, 그것이 없으면 그들은 하루 동안 많은 (B) 검사를 받아야 하기 때문이다.","oko":["(A) 해로운 / (B) 혈액","(A) 유용한 / (B) 눈","(A) 쓸모없는 / (B) 혈액","(A) 해가 없는 / (B) 수면","(A) 유용한 / (B) 혈액"],"opts":["(A) harmful / (B) blood","(A) useful / (B) eye","(A) useless / (B) blood","(A) harmless / (B) sleep","(A) useful / (B) blood"],"r":{"a":"5) (A) useful / (B) blood","ev":"7~8번 문장","s":[[7,"This is particularly useful to those with diabetes.","이것은 당뇨가 있는 사람들에게 특히 유용하다."],[8,"Without it, they have to get multiple blood tests throughout the day just to check their glucose levels.","그것이 없다면, 그들은 단지 포도당 수치를 확인하기 위해 하루 종일 다수의 혈액 검사를 받아야 한다."]],"w":"7번에서 센서는 당뇨가 있는 사람들에게 특히 유용하다(useful)고 하고, 8번에서 센서가 없으면 하루 종일 다수의 혈액(blood) 검사를 받아야 한다고 해요.","c":5},"h":"5caf41a008"},{"n":10,"t":"fill","q":"They can even make it possible to [A] the [B] conditions in real time.","ko":"그것은 심지어 실시간으로 [B] 상태를 [A] 수 있게 만들 수도 있다.","bank":["monitor","physical","patch","potassium","effort","stick"],"bko":{"monitor":"확인하다, 관찰하다","physical":"신체의, 몸의","patch":"패치","potassium":"칼륨","effort":"수고","stick":"붙이다"},"r":{"a":"[A] monitor (확인하다, 관찰하다), [B] physical (신체의, 몸의)","ev":"11번 문장","s":[[11,"They can even make it possible to monitor the physical conditions in real time.","그것은 심지어 몸 상태를 실시간으로 확인하는 것을 가능하게 만들 수도 있다."]],"w":"11번에서 땀 센서는 몸 상태(physical conditions)를 실시간으로 확인하는(monitor) 것을 가능하게 한다고 해요.","c":null},"h":"f3916cd568"}]},{"u":6,"id":"hk3-06-4","no":4,"ko":"이거 완전 내 얘기잖아~","items":[{"n":1,"t":"tf","q":"In the test, you check a box if the statement applies to you.","ko":"검사에서 그 말이 자신에게 해당하면 칸에 표시한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Check the box if the statement applies to you.","만약 그 말이 당신에게 해당한다면 칸에 표시를 해라."]],"w":"2번 문장에서 그 말이 당신에게 해당한다면(if the statement applies to you) 칸에 표시를 하라고 해요. 글의 내용과 같아요.","c":"T"},"h":"edba35f8b2"},{"n":2,"t":"tf","q":"The Barnum Effect happens because the descriptions are really very specific.","ko":"바넘 효과는 묘사가 정말로 매우 구체적이기 때문에 발생한다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"This psychological effect happens because the descriptions sound specific, but only on the surface.","이러한 심리적인 효과는 그 묘사가 구체적이게 들리기 때문에 발생하지만, 그것은 겉보기에만 그렇다."]],"w":"10번 문장에서 묘사가 구체적이게 들리기 때문에 발생하지만 겉보기에만(only on the surface) 그렇다고 해요. 정말 구체적인 것은 아니에요.","c":"F"},"h":"b93736177f"},{"n":3,"t":"tf","q":"Horoscopes and fortune cookies also use the Barnum Effect.","ko":"점성술과 포춘 쿠키도 바넘 효과를 이용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"In fact, personality tests, horoscopes, and fortune cookies all use the Barnum Effect.","실제로, 성격 검사, 점성술, 그리고 포춘 쿠키 모두 바넘 효과를 이용한다."]],"w":"12번 문장에서 성격 검사, 점성술, 포춘 쿠키 모두 바넘 효과를 이용한다고 해요. 글의 내용과 같아요.","c":"T"},"h":"2c45ca0642"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (You sometimes doubt if you have made the right decision.)","ko":"당신은 가끔 옳은 결정을 했는지 ( ). (밑줄 친 단어의 뜻은?)","opts":["확신하다","기억하다","의심하다","반복하다"],"word":"doubt","r":{"a":"3) 의심하다","ev":"4번 문장","s":[[4,"You sometimes doubt if you have made the right decision.","당신은 가끔 옳은 결정을 했는지 의심한다."]],"w":"4번은 '옳은 결정을 했는지(if ~)' 하는 말이에요. 가끔 그런지 아닌지 확신이 없어서 마음이 흔들린다는 뜻이에요. doubt = 의심하다.","c":3},"h":"a53a3e15e7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If we take a closer look, we discover they are so vague and general that they can apply to everyone.)","ko":"더 자세히 살펴보면, 우리는 그것들이 너무 ( ) 일반적이어서 누구에게나 해당할 수 있다는 것을 발견한다. (밑줄 친 단어의 뜻은?)","opts":["정확한","모호한","재미있는","위험한"],"word":"vague","r":{"a":"2) 모호한","ev":"10~11번 문장","s":[[10,"This psychological effect happens because the descriptions sound specific, but only on the surface.","이러한 심리적인 효과는 그 묘사가 구체적이게 들리기 때문에 발생하지만, 그것은 겉보기에만 그렇다."],[11,"If we take a closer look, we discover they are so vague and general that they can apply to everyone.","만약 더 자세히 살펴보면, 우리는 그것들이 너무 모호하고 일반적이어서 누구에게나 해당할 수 있다는 것을 발견한다."]],"w":"10번에서 겉보기에만 구체적이라고 했으니 사실은 구체적이지 않다는 뜻이에요. 그래서 누구에게나 해당할 수 있다고 해요. vague = 모호한.","c":2},"h":"9b06506a38"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nIf you checked all four of them, you’ve just experienced the Barnum Effect.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"만약 당신이 그것들 네 개 모두에 표시했다면, 당신은 방금 바넘 효과를 경험하였다.","opts":["네 가지 말(진술)","바넘 효과","당신의 친구들","성격 검사들"],"r":{"a":"1) 네 가지 말(진술)","ev":"8번 문장","s":[[8,"If you checked all four of them, you’ve just experienced the Barnum Effect.","만약 당신이 그것들 네 개 모두에 표시했다면, 당신은 방금 바넘 효과를 경험하였다."]],"w":"8번의 them은 앞에서 칸에 표시했던 네 가지 말(진술)을 가리켜요. 그 네 개에 모두 표시하면 바넘 효과를 경험한 거예요.","c":1,"k":"them = 네 가지 말(진술)"},"pron":"them","h":"85a9f47f5d"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It refers to our tendency to believe that personality descriptions are accurate and apply specifically to us.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 성격 묘사가 정확하고 특히 우리에게 해당한다고 믿는 성향을 말한다.","opts":["그것은 성격 묘사가 정확하고 특히 우리에게 해당한다고 믿는 우리의 성향을 말한다.","그것은 성격 묘사가 틀렸다고 생각하는 우리의 성향을 말한다.","그것은 성격 묘사가 다른 사람에게만 해당한다고 믿는 성향을 말한다.","그것은 성격 묘사를 믿지 않으려고 노력하는 성향을 말한다."],"r":{"a":"1) 그것은 성격 묘사가 정확하고 특히 우리에게 해당한다고 믿는 우리의 성향을 말한다.","ev":"9번 문장","s":[[9,"It refers to our tendency to believe that personality descriptions are accurate and apply specifically to us.","그것은 성격 묘사가 정확하고 특히 우리에게 해당한다고 믿는 성향을 말한다."]],"w":"to believe ~는 our tendency를 꾸며서 '~을 믿는 성향'이에요. 믿는 내용은 성격 묘사가 정확하고(accurate) 특히 우리에게 해당한다는 것이에요.","c":1},"h":"4bc62ceb71"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["한 말은 당신이 절대 수줍어하지 않는다고 한다.","한 말은 당신이 항상 자신에게 만족한다고 한다.","한 말은 당신이 가끔 외향적이고 가끔 수줍음이 많다고 한다.","한 말은 당신이 다른 사람이 자신을 좋아하길 절대 원하지 않는다고 한다."],"opts":["One statement says that you are never shy.","One statement says that you are always happy with yourself.","One statement says that you are sometimes outgoing and sometimes shy.","One statement says that you never want others to like you."],"r":{"a":"3) One statement says that you are sometimes outgoing and sometimes shy. (한 말은 당신이 가끔 외향적이고 가끔 수줍음이 많다고 한다.)","ev":"6번 문장","s":[[6,"Sometimes you are outgoing, but other times you are shy.","가끔 당신은 외향적이지만, 다른 때에는 수줍음이 많다."]],"w":"6번에 “가끔 당신은 외향적이지만, 다른 때에는 수줍음이 많다(Sometimes you are outgoing, but other times you are shy)”라는 말이 있어요.","c":3},"h":"b0686e7592"},{"n":9,"t":"sum","q":"If you show the statements to your (A) one by one, they will probably all say the statements describe them (B).","ko":"그 말을 하나씩 당신의 (A)에게 보여주면, 그들은 아마 모두 그 말이 자신을 (B) 묘사한다고 말할 것이다.","oko":["(A) 선생님들 / (B) 형편없이","(A) 친구들 / (B) 형편없이","(A) 부모님 / (B) 느리게","(A) 친구들 / (B) 완벽하게","(A) 선생님들 / (B) 완벽하게"],"opts":["(A) teachers / (B) badly","(A) friends / (B) badly","(A) parents / (B) slowly","(A) friends / (B) perfectly","(A) teachers / (B) perfectly"],"r":{"a":"4) (A) friends / (B) perfectly ((A) 친구들 / (B) 완벽하게)","ev":"13~15번 문장","s":[[13,"Try it out on your friends.","당신의 친구들에게 그것을 시도해보아라."],[14,"Show the statements to each friend individually.","각 친구에게 개별적으로 그 말을 보여줘라."],[15,"They will probably all say the statements describe them perfectly!","그들은 아마 모두 그 말이 그들을 완벽하게 묘사한다고 말할 것이다!"]],"w":"13~15번에서 친구들에게 그 말을 보여주면 아마 모두 자신을 완벽하게(perfectly) 묘사한다고 말할 거라고 해요.","c":4},"h":"93dbfc6fc8"},{"n":10,"t":"fill","q":"You have a [A] for others to like and [B] you.","ko":"당신은 다른 사람들이 당신을 좋아하고 [B] 주길 바라는 [A]을(를) 느낀다.","bank":["need","admire","shy","outgoing","critical","sometimes"],"bko":{"need":"욕구, 필요","admire":"동경하다, 감탄하다","shy":"수줍음이 많은","outgoing":"외향적인","critical":"비판적인","sometimes":"가끔"},"r":{"a":"[A] need (욕구, 필요), [B] admire (동경하다, 감탄하다)","ev":"3번 문장","s":[[3,"You have a need for others to like and admire you.","당신은 다른 사람들이 당신을 좋아하고 동경해줄 욕구를 느낀다."]],"w":"3번에서 당신은 다른 사람들이 좋아하고 동경해 줄(admire) 욕구(need)를 느낀다고 해요.","c":null},"h":"ea115b561f"}]},{"u":7,"id":"hk3-07-1","no":1,"ko":"고생 끝에 한정판이 온다","items":[{"n":1,"t":"tf","q":"Some people even put up a tent in front of the store while waiting.","ko":"일부 사람들은 기다리는 동안 심지어 상점 앞에 텐트를 치기도 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Many people wait in line for hours, and some even put up a tent in front of the store.","많은 사람들이 몇 시간 동안 줄을 서서 기다리고, 일부는 심지어 상점 앞에 텐트를 치기도 한다."]],"w":"2번 문장에 some even put up a tent in front of the store(일부는 심지어 상점 앞에 텐트를 친다)가 그대로 나와요.","c":"T"},"h":"634c144e1e"},{"n":2,"t":"tf","q":"Most of the people waiting in line complain about the long wait.","ko":"줄 서서 기다리는 대부분의 사람들은 오랜 기다림에 대해 불평한다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"Interestingly, none of these people complain.","흥미롭게도, 이 사람들 중 아무도 불평하지 않는다."]],"w":"3번 문장에서 none of these people complain(이 사람들 중 아무도 불평하지 않는다)이라고 해요. 대부분이 불평한다는 말은 반대예요.","c":"F"},"h":"a3587a9b65"},{"n":3,"t":"tf","q":"Limited-edition products are very common, so everyone can buy them.","ko":"한정판 제품은 매우 흔해서 모두가 살 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"These are very rare, and not everyone can buy them.","이것들은 매우 희귀하고, 모두가 그것들을 살 수 있는 것은 아니다."]],"w":"7번 문장에서 한정판은 very rare(매우 희귀)하고 not everyone can buy them(모두가 살 수 있는 것은 아니다)이라고 해요. 흔하다는 말은 반대예요.","c":"F"},"h":"a1a455fbae"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (What makes them willing to spend such a long time waiting?)","ko":"무엇이 그들이 그렇게 오랜 시간을 ( ) 기다리는 데 보내도록 만들까?","opts":["꺼리는","두려워하는","기꺼이 ~하는","어쩔 수 없이 ~하는"],"word":"willing","r":{"a":"3) 기꺼이 ~하는","ev":"3~4번 문장","s":[[3,"Interestingly, none of these people complain.","흥미롭게도, 이 사람들 중 아무도 불평하지 않는다."],[4,"What makes them willing to spend such a long time waiting?","무엇이 그들이 그렇게 오랜 시간을 기꺼이 기다리는 데 보내도록 만들까?"]],"w":"3번에서 사람들은 불평하지 않았어요. 4번은 '무엇이 그들을 기꺼이 오래 기다리게 만들까?'라는 질문이에요. be willing to = 기꺼이 ~하다.","c":3},"h":"a178505bd6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Because people feel more satisfied once they get them, they don’t mind waiting for these items.)","ko":"일단 사람들은 그것들을 갖게 되면 더 만족을 느끼기 때문에, 그들은 이러한 물건을 위해 기다리는 것을 ( ) 않는다.","opts":["꺼리다","즐기다","잊다","포기하다"],"word":"mind","r":{"a":"1) 꺼리다","ev":"8번 문장","s":[[8,"Because people feel more satisfied once they get them, they don’t mind waiting for these items.","일단 사람들은 그것들을 갖게 되면 더 만족을 느끼기 때문에, 그들은 이러한 물건을 위해 기다리는 것을 꺼리지 않는다."]],"w":"갖게 되면 더 만족해서 기다리는 걸 괜찮게 여겨요. mind(꺼리다)가 don't와 함께 쓰여 '꺼리지 않는다'가 돼요.","c":1},"h":"c9a9314639"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey might be collaborations between brands and artists, or items that celebrities used to wear.","ko":"밑줄 친 They이(가) 가리키는 것은?","sko":"그것들은 브랜드와 예술가 사이의 공동 제작품이거나 유명인이 착용하곤 했던 물건일 수도 있다.","opts":["한정판 제품들","줄을 서서 기다리는 사람들","브랜드와 예술가들","상점 직원들"],"r":{"a":"1) 한정판 제품들","ev":"6번 문장","s":[[6,"They might be collaborations between brands and artists, or items that celebrities used to wear.","그것들은 브랜드와 예술가 사이의 공동 제작품이거나 유명인이 착용하곤 했던 물건일 수도 있다."]],"w":"6번의 They는 “브랜드와 예술가의 공동 제작품이거나 유명인이 입던 물건”인 것들이에요. 앞 문장에서 말한 한정판 제품들을 가리켜요.","c":1,"k":"They = 한정판 제품들"},"pron":"They","h":"d3777130e3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"There are some products you can only buy for a short time or in limited numbers.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 짧은 시간 동안만 또는 한정된 수량으로만 살 수 있는 몇몇 제품들이 있다.","opts":["어떤 제품들은 오래 기다리면 누구나 살 수 있다.","모든 제품은 원하는 때에 원하는 만큼 살 수 있다.","어떤 제품들은 값이 싸서 짧은 시간 동안만 팔린다.","어떤 제품들은 짧은 기간 동안만, 또는 한정된 수량으로만 살 수 있다."],"r":{"a":"4) 어떤 제품들은 짧은 기간 동안만, 또는 한정된 수량으로만 살 수 있다.","ev":"5번 문장","s":[[5,"There are some products you can only buy for a short time or in limited numbers.","당신이 짧은 시간 동안만 또는 한정된 수량으로만 살 수 있는 몇몇 제품들이 있다."]],"w":"you can only buy for a short time or in limited numbers는 짧은 시간 동안만, 또는 한정된 수량으로만 살 수 있다는 뜻이에요. 값이 싸다는 내용은 없어요.","c":4},"h":"83959c4370"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["나이키 에어 맥스 신발은 한정판 제품의 한 예이다.","나이키 에어 맥스 신발은 일 년 내내 모든 상점에서 팔린다.","나이키 에어 맥스 신발은 유명인만을 위해 만들어진다.","나이키 에어 맥스 신발을 사려고 줄을 서 본 사람은 아무도 없다."],"opts":["Nike Air Max shoes are an example of a limited-edition product.","Nike Air Max shoes are sold in every store all year.","Nike Air Max shoes are made only for celebrities.","Nobody has ever stood in line to buy Nike Air Max shoes."],"r":{"a":"1) Nike Air Max shoes are an example of a limited-edition product. (나이키 에어 맥스 신발은 한정판 제품의 한 예이다.)","ev":"1번 문장","s":[[1,"Have you ever stood in line to buy a limited-edition product, such as Nike Air Max shoes?","당신은 나이키 에어 맥스 신발과 같은 한정판 제품을 사기 위해서 줄을 서 본 적이 있는가?"]],"w":"1번에서 나이키 에어 맥스 신발을 한정판 제품(limited-edition product)의 예로 들고 있어요.","c":1},"h":"d3be7b9d85"},{"n":9,"t":"sum","q":"Waiting in line may not be so (A), and you may even make a new (B).","ko":"줄을 서서 기다리는 것은 그렇게 (A)하지 않을 수도 있고, 심지어 새로운 (B)을(를) 사귈지도 모른다.","oko":["(A) 비싼 / (B) 친구","(A) 나쁜 / (B) 적","(A) 나쁜 / (B) 친구","(A) 웃긴 / (B) 텐트","(A) 비싼 / (B) 적"],"opts":["(A) expensive / (B) friend","(A) bad / (B) enemy","(A) bad / (B) friend","(A) funny / (B) tent","(A) expensive / (B) enemy"],"r":{"a":"3) (A) bad / (B) friend ((A) 나쁜 / (B) 친구)","ev":"9~11번 문장","s":[[9,"Besides, waiting in line may not be so bad.","게다가, 줄을 서서 기다리는 것은 그렇게 나쁘지 않을 수도 있다."],[11,"You may even make a new friend!","당신은 심지어 새로운 친구를 만들지도 모른다!"]],"w":"9번에서 줄을 서서 기다리는 것은 그렇게 나쁘지 않을 수도 있다(may not be so bad)고 하고, 11번에서 새로운 친구를 만들지도 모른다고 해요.","c":3},"h":"bfef4e27d2"},{"n":10,"t":"fill","q":"You and everyone else in the line share a common [A], so you can have a nice [B] with them.","ko":"당신과 줄에 있는 다른 모든 사람들은 공통의 [A]을(를) 가지고 있어서, 그들과 좋은 [B]을(를) 할 수 있다.","bank":["interest","chat","stood","complain","rare","satisfied"],"bko":{"interest":"관심사","chat":"대화","stood":"섰다(stand의 과거)","complain":"불평하다","rare":"희귀한","satisfied":"만족한"},"r":{"a":"[A] interest (관심사), [B] chat (대화)","ev":"10번 문장","s":[[10,"You and everyone else in the line share a common interest, so you can have a nice chat with them.","당신과 줄에 있는 다른 모든 사람들은 공통의 관심사를 가지고 있어서, 그들과 좋은 대화를 할 수 있다."]],"w":"10번에서 줄에 선 사람들은 공통의 관심사(interest)를 가지고 있어서 좋은 대화(chat)를 할 수 있다고 해요.","c":null},"h":"4caeedc9b8"}]},{"u":7,"id":"hk3-07-2","no":2,"ko":"다시 만난 ‘색’다른 세계","items":[{"n":1,"t":"tf","q":"The gift from William’s wife looked like a pair of ordinary sunglasses.","ko":"William의 부인이 준 선물은 한 쌍의 평범한 선글라스처럼 보였다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"The gift looked like a pair of ordinary sunglasses.","그 선물은 한 쌍의 평범한 선글라스처럼 보였다."]],"w":"4번 문장에 The gift looked like a pair of ordinary sunglasses(그 선물은 평범한 선글라스처럼 보였다)가 있어요.","c":"T"},"h":"8ea4d7a60c"},{"n":2,"t":"tf","q":"William had always been able to see colors before he put on the glasses.","ko":"William은 그 안경을 쓰기 전에도 항상 색을 볼 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"It was the first time that he was able to see color because William was color-blind.","William은 색맹이었기 때문에 그가 색을 볼 수 있는 것은 처음이었다."],[7,"Until that moment, his life had always been in black and white.","그 순간까지, 그의 삶은 항상 흑백으로 되어 있었다."]],"w":"6번 문장에서 안경을 쓴 때가 색을 볼 수 있었던 첫 번째(the first time)였고, 7번 문장에서 그때까지 삶이 항상 흑백이었다고 해요.","c":"F"},"h":"d57bf7b751"},{"n":3,"t":"tf","q":"The special glasses work for all types of color blindness.","ko":"그 특수 안경은 모든 유형의 색맹에 효과가 있다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"For now, these glasses don’t work for all types of color blindness.","현재로서는, 이 안경이 모든 유형의 색맹에 효과가 있지는 않다."]],"w":"12번 문장에서 지금은 이 안경이 all types of color blindness(모든 유형의 색맹)에 효과가 있지는 않다고 해요.","c":"F"},"h":"131ef76bd2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The gift looked like a pair of ordinary sunglasses.)","ko":"그 선물은 한 쌍의 ( ) 선글라스처럼 보였다.","opts":["값비싼","화려한","평범한","낡은"],"word":"ordinary","r":{"a":"3) 평범한","ev":"4~5번 문장","s":[[4,"The gift looked like a pair of ordinary sunglasses.","그 선물은 한 쌍의 평범한 선글라스처럼 보였다."],[5,"William put them on, and all of a sudden, everything around him looked different!","William은 그것을 썼고, 갑자기 주위의 모든 것이 다르게 보였다!"]],"w":"4번에서 겉모습은 보통 선글라스 같았는데, 5번에서 쓰자 갑자기 모든 게 다르게 보였어요. 겉보기엔 특별하지 않았다는 뜻이라 ordinary는 '평범한'이에요.","c":3},"h":"01020c75ed"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This makes colors look much richer and more vivid.)","ko":"이것은 색이 훨씬 더 풍부하고 더 ( ) 보이도록 만든다.","opts":["희미한","차가운","단단한","선명한"],"word":"vivid","r":{"a":"4) 선명한","ev":"9~10번 문장","s":[[9,"The lenses are coated with a material that exaggerates certain wavelengths of light.","그 렌즈에는 빛의 특정 파장을 과장하는 물질이 칠해져 있다."],[10,"This makes colors look much richer and more vivid.","이것은 색이 훨씬 더 풍부하고 선명하게 보이도록 만든다."]],"w":"렌즈의 물질이 빛의 파장을 과장해서 색이 더 풍부하고 뚜렷하게 보여요. 그래서 vivid는 '선명한'이에요.","c":4},"h":"7800b512bd"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWilliam put them on, and all of a sudden, everything around him looked different!","ko":"밑줄 친 them가 가리키는 것은?","sko":"William은 그것을 썼고, 갑자기 주위의 모든 것이 다르게 보였다!","opts":["William의 가족","한 쌍의 선글라스","여러 가지 색깔","주위의 사물들"],"r":{"a":"2) 한 쌍의 선글라스","ev":"4~5번 문장","s":[[4,"The gift looked like a pair of ordinary sunglasses.","그 선물은 한 쌍의 평범한 선글라스처럼 보였다."],[5,"William put them on, and all of a sudden, everything around him looked different!","William은 그것을 썼고, 갑자기 주위의 모든 것이 다르게 보였다!"]],"w":"put them on은 '그것들을 쓰다'예요. 쓸 수 있는 것은 4번 문장의 a pair of ordinary sunglasses(선글라스)예요.","c":2},"h":"a595fd95f9"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Until that moment, his life had always been in black and white.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 순간까지, 그의 삶은 항상 흑백으로 되어 있었다.","opts":["그 순간까지 그의 삶은 줄곧 색이 없는 흑백이었다.","그 순간부터 그의 삶은 흑백이 되었다.","그는 그 순간까지 흑백 영화를 자주 보았다.","그의 삶은 그 순간에 처음으로 색을 잃었다."],"r":{"a":"1) 그 순간까지 그의 삶은 줄곧 색이 없는 흑백이었다.","ev":"7번 문장","s":[[7,"Until that moment, his life had always been in black and white.","그 순간까지, 그의 삶은 항상 흑백으로 되어 있었다."]],"w":"Until that moment는 '그 순간까지'이고 had always been은 줄곧 계속된 상태예요. 그래서 삶은 그때까지 항상 흑백이었어요. 색을 잃은 것은 아니에요.","c":1},"h":"00522efeb5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["William은 생일에 가족과 함께 파티를 즐기고 있었다.","William은 생일에 혼자 사무실에서 일하고 있었다.","William은 생일에 다른 나라로 여행하고 있었다.","William은 생일에 집에서 자고 있었다."],"opts":["William was enjoying a party with his family on his birthday.","William was working alone at his office on his birthday.","William was traveling to another country on his birthday.","William was sleeping at home on his birthday."],"r":{"a":"1) William was enjoying a party with his family on his birthday. (William은 생일에 가족과 함께 파티를 즐기고 있었다.)","ev":"1번 문장","s":[[1,"On his 66th birthday, William Reed was enjoying a party with his family.","William Reed는 그의 66번째 생일에, 가족과 함께 파티를 즐기고 있었다."]],"w":"1번에서 William Reed는 66번째 생일에 가족과 함께 파티를 즐기고 있었어요.","c":1},"h":"10ccd5d70b"},{"n":9,"t":"sum","q":"The special glasses have (A) many color-blind people experience a (B) world.","ko":"그 특수 안경은 많은 색맹인 사람들이 (B) 세상을 경험하도록 (A).","oko":["(A) 막아 왔다 / (B) 형형색색의","(A) 도와줘 왔다 / (B) 조용한","(A) 도와줘 왔다 / (B) 형형색색의","(A) 강요해 왔다 / (B) 어두운","(A) 막아 왔다 / (B) 지루한"],"opts":["(A) stopped / (B) colorful","(A) helped / (B) quiet","(A) helped / (B) colorful","(A) forced / (B) dark","(A) stopped / (B) boring"],"r":{"a":"3) (A) helped / (B) colorful ((A) 도와줘 왔다 / (B) 형형색색의)","ev":"13번 문장","s":[[13,"Yet, they have helped many color-blind people experience a colorful world.","그렇지만, 그것은 많은 색맹인 사람들이 형형색색의 세상을 경험하도록 도와줘 왔다."]],"w":"13번에서 그 안경은 많은 색맹인 사람들이 형형색색의 세상을 경험하도록 도와줘 왔다고 해요.","c":3},"h":"610255c74e"},{"n":10,"t":"fill","q":"The lenses are [A] with a material that exaggerates certain [B] of light.","ko":"그 렌즈에는 빛의 특정 [B]을(를) 과장하는 물질이 [A] 있다.","bank":["coated","wavelengths","birthday","family","party","sunglasses"],"bko":{"coated":"칠해진(coat의 과거분사)","wavelengths":"파장","birthday":"생일","family":"가족","party":"파티","sunglasses":"선글라스"},"r":{"a":"[A] coated (칠해진(coat의 과거분사)), [B] wavelengths (파장)","ev":"9번 문장","s":[[9,"The lenses are coated with a material that exaggerates certain wavelengths of light.","그 렌즈에는 빛의 특정 파장을 과장하는 물질이 칠해져 있다."]],"w":"9번에서 렌즈에는 빛의 특정 파장(wavelengths)을 과장하는 물질이 칠해져(coated) 있다고 해요.","c":null},"h":"a6b0ef6794"}]},{"u":7,"id":"hk3-07-3","no":3,"ko":"일상의 재발견","items":[{"n":1,"t":"tf","q":"Viewers can get tips for everyday life through vlogs.","ko":"시청자들은 브이로그를 통해 일상생활에 대한 정보를 얻을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Viewers sometimes receive tips for everyday life through these videos.","시청자들은 가끔 이러한 영상을 통해 일상생활에 대한 정보를 받는다."]],"w":"5번 문장에 Viewers sometimes receive tips for everyday life through these videos(시청자들은 가끔 영상을 통해 일상생활 정보를 받는다)가 있어요.","c":"T"},"h":"b5d9aa0e8c"},{"n":2,"t":"tf","q":"GRWM is a type of vlog that shows a person cooking a meal.","ko":"GRWM은 한 사람이 요리하는 모습을 보여 주는 브이로그의 한 종류이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"GRWM (Get Ready With Me) is a popular type of vlog that shows a person getting ready for school, work, or an event.","GRWM(나와 함께 준비해요)은 학교, 직장, 또는 행사에 가려고 준비하는 사람을 보여주는 인기 있는 브이로그의 한 종류이다."]],"w":"4번 문장에서 GRWM은 학교, 직장, 행사를 위해 준비하는(getting ready) 사람을 보여 줘요. 요리하는 사람이 아니에요.","c":"F"},"h":"40f0c5b8c4"},{"n":3,"t":"tf","q":"Celebrities often use vlogs to connect directly with their fans.","ko":"유명인들은 종종 팬들과 직접 소통하기 위해 브이로그를 이용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"They often use vlogs to directly connect with their fans.","그들은 종종 팬들과 직접적으로 소통하기 위해 브이로그를 이용한다."]],"w":"9번 문장에 They often use vlogs to directly connect with their fans(그들은 종종 팬들과 직접 소통하려고 브이로그를 이용한다)가 그대로 나와요.","c":"T"},"h":"a0810827bb"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This makes the content sound more sincere and gives fans the impression of having a personal relationship with them.)","ko":"이것은 그 내용이 더 ( ) 들리도록 만들고, 팬들에게 그들과 사적인 관계를 쌓고 있다는 인상을 준다.","opts":["화난","진실된","지루한","복잡한"],"word":"sincere","r":{"a":"2) 진실된","ev":"10~11번 문장","s":[[10,"They also show their real personalities in their daily lives through vlogs.","그들은 또한 브이로그를 통해서 일상생활 속에서의 그들의 실제 성격을 보여준다."],[11,"This makes the content sound more sincere and gives fans the impression of having a personal relationship with them.","이것은 그 내용이 더 진실되게 들리도록 만들고, 팬들에게 그들과 사적인 관계를 쌓고 있다는 인상을 준다."]],"w":"10번에서 유명인이 일상 속 실제 성격을 보여 줘요. 그래서 내용이 거짓 없이 느껴져 sincere는 '진실된'이에요.","c":2},"h":"04a3dd0e5e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They often use vlogs to directly connect with their fans.)","ko":"그들은 종종 팬들과 ( ) 소통하기 위해 브이로그를 이용한다.","opts":["가끔","우연히","느리게","직접적으로"],"word":"directly","r":{"a":"4) 직접적으로","ev":"9번 문장","s":[[9,"They often use vlogs to directly connect with their fans.","그들은 종종 팬들과 직접적으로 소통하기 위해 브이로그를 이용한다."]],"w":"브이로그를 통해 중간 과정 없이 팬들과 바로 소통한다는 뜻이에요. directly = 직접적으로.","c":4},"h":"9295071d18"},{"n":6,"t":"ref","q":"What does the underlined \"These\" refer to?\nThese are called video blogs, or vlogs.","ko":"밑줄 친 These이(가) 가리키는 것은?","sko":"이것들은 영상 블로그, 또는 브이로그라고 불린다.","opts":["온라인에 공유되는 일상 영상들","유명인들","시청자들","요리법들"],"r":{"a":"1) 온라인에 공유되는 일상 영상들","ev":"3번 문장","s":[[3,"These are called video blogs, or vlogs.","이것들은 영상 블로그, 또는 브이로그라고 불린다."]],"w":"3번의 These는 앞 문장에서 말한, 사람들이 일상생활을 녹화해 공유하는 영상들을 가리켜요. 그 영상들을 video blog, 줄여서 vlog라고 불러요.","c":1,"k":"These = 온라인에 공유되는 일상 영상들"},"pron":"These","h":"9af272a7d0"},{"n":7,"t":"s 과일은 아니다."]],"w":"10번 문장에서 Pineapples are not the only fruit with this enzyme(파인애플이 이 효소를 가진 유일한 과일은 아니다)이라고 해요.","c":"F"},"h":"7bba6df610"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It’s because pineapples contain an enzyme that makes your mouth burn!)","ko":"그것은 파인애플에 입이 ‘( )’ 상태가 되게 만드는 효소가 들어 있기 때문이다!","opts":["화끈거리다","얼다","젖다","가렵다"],"word":"burn","r":{"a":"1) 화끈거리다","ev":"1번, 3번 문장","s":[[1,"You may have noticed that your tongue sometimes feels painful when you eat pineapple.","당신은 파인애플을 먹을 때 혀가 가끔 아프다는 것을 알아차렸을 수도 있다."],[3,"It’s because pineapples contain an enzyme that makes your mouth burn!","그것은 파인애플에 입이 화끈거리게 만드는 효소가 들어 있기 때문이다!"]],"w":"1번에서 혀가 아프다고 했고, 3번은 그 원인이에요. 효소가 입을 따갑고 뜨겁게 만든다는 뜻이라 여기서 burn은 '화끈거리다'예요.","c":1},"h":"672233fe72"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It breaks down the protein in the food we eat, which makes it easier to digest.)","ko":"그것은 우리가 먹는 음식 안의 단백질을 분해하는데, 이는 ‘( )’ 일을 더 쉽게 만든다.","opts":["저장하다","요리하다","소화하다","씹다"],"word":"digest","r":{"a":"3) 소화하다","ev":"8번 문장","s":[[8,"It breaks down the protein in the food we eat, which makes it easier to digest.","그것은 우리가 먹는 음식 안의 단백질을 분해하는데, 이는 소화를 더 쉽게 만든다."]],"w":"효소가 단백질을 분해하면 몸이 음식을 받아들이기 쉬워져요. 먹은 음식과 관련된 digest는 '소화하다'예요.","c":3},"h":"b2b7694b5f"},{"n":6,"t":"ref","q":"What does the underlined \"itself\" refer to?\nAnd your mouth is capable of healing itself quickly.","ko":"밑줄 친 itself이(가) 가리키는 것은?","sko":"그리고 당신의 입은 스스로 빠르게 치유할 수 있다.","opts":["당신의 입","파인애플","효소","당신의 혀"],"r":{"a":"1) 당신의 입","ev":"6번 문장","s":[[6,"And your mouth is capable of healing itself quickly.","그리고 당신의 입은 스스로 빠르게 치유할 수 있다."]],"w":"6번의 itself는 같은 문장의 주어 your mouth를 가리켜요. 입이 스스로 빠르게 치유할 수 있다는 뜻이에요.","c":1,"k":"itself = 당신의 입"},"pron":"itself","h":"0b60ed24ef"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Besides, this enzyme is what makes pineapple helpful.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"게다가, 이 효소는 파인애플을 도움이 되도록 만들어주는 것이다.","opts":["게다가, 파인애플은 이 효소를 도와주는 것이다.","게다가, 이 효소 때문에 파인애플은 도움이 되지 않는다.","게다가, 이 효소는 파인애플에 들어 있지 않은 것이다.","게다가, 이 효소는 파인애플을 도움이 되게 만드는 것이다."],"r":{"a":"4) 게다가, 이 효소는 파인애플을 도움이 되게 만드는 것이다.","ev":"7번 문장","s":[[7,"Besides, this enzyme is what makes pineapple helpful.","게다가, 이 효소는 파인애플을 도움이 되도록 만들어주는 것이다."]],"w":"what makes pineapple helpful은 '파인애플을 도움이 되게 만드는 것'이에요. this enzyme이 바로 그것이라는 뜻이에요.","c":4},"h":"262dccb64e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파인애플은 소고기나 돼지고기 요리에 단백질이 거의 없어서 함께 제공된다.","파인애플은 종종 많은 단백질이 들어 있는 요리들과 함께 제공된다.","파인애플 속 효소는 단백질을 설탕으로 바꾼다.","파인애플 속 효소는 파인애플 잎에서만 발견된다."],"opts":["Pineapple is served with beef or pork because those dishes have little protein.","Pineapple is often served with dishes that contain lots of protein.","The enzyme in pineapple turns protein into sugar.","The enzyme in pineapple is found only in pineapple leaves."],"r":{"a":"2) Pineapple is often served with dishes that contain lots of protein. (파인애플은 종종 많은 단백질이 들어 있는 요리들과 함께 제공된다.)","ev":"9번 문장","s":[[9,"For this reason, pineapple is often served with dishes that contain lots of protein, such as beef or pork.","이러한 이유로, 파인애플은 종종 소고기나 돼지고기와 같이 많은 단백질이 들어 있는 요리들과 함께 제공된다."]],"w":"9번에서 파인애플은 종종 소고기나 돼지고기처럼 단백질이 많은 요리와 함께 제공된다고 해요.","c":2},"h":"90f001c17d"},{"n":9,"t":"sum","q":"Other fruits like (A) and mangoes also cause a (B) feeling.","ko":"(A)와(과) 망고 같은 다른 과일들도 (B) 느낌을 유발한다.","oko":["(A) 사과 / (B) 달콤한","(A) 키위 / (B) 달콤한","(A) 키위 / (B) 찌르는 듯한","(A) 사과 / (B) 찌르는 듯한","(A) 포도 / (B) 차가운"],"opts":["(A) apples / (B) sweet","(A) kiwis / (B) sweet","(A) kiwis / (B) stinging","(A) apples / (B) stinging","(A) grapes / (B) cold"],"r":{"a":"3) (A) kiwis / (B) stinging ((A) 키위 / (B) 찌르는 듯한)","ev":"11번 문장","s":[[11,"Many other fruits like kiwis and mangoes have it, and they cause a stinging feeling, too!","키위와 망고 같은 많은 다른 과일들이 그것을 가지고 있고, 그것들 역시 찌르는 듯한 느낌을 유발한다!"]],"w":"11번에서 키위와 망고 같은 다른 과일들도 찌르는 듯한(stinging) 느낌을 유발한다고 해요.","c":3},"h":"634f779c87"},{"n":10,"t":"fill","q":"You may have [A] that your [B] sometimes feels painful when you eat pineapple.","ko":"당신은 파인애플을 먹을 때 [B]이(가) 가끔 아프다는 것을 [A] 수도 있다.","bank":["noticed","tongue","pineapple","enzyme","damage","mangoes"],"bko":{"noticed":"알아차렸다(notice의 과거분사)","tongue":"혀","pineapple":"파인애플","enzyme":"효소","damage":"손상","mangoes":"망고들"},"r":{"a":"[A] noticed (알아차렸다(notice의 과거분사)), [B] tongue (혀)","ev":"1번 문장","s":[[1,"You may have noticed that your tongue sometimes feels painful when you eat pineapple.","당신은 파인애플을 먹을 때 혀가 가끔 아프다는 것을 알아차렸을 수도 있다."]],"w":"1번에서 파인애플을 먹을 때 혀(tongue)가 가끔 아프다는 것을 알아차렸을(noticed) 수도 있다고 해요.","c":null},"h":"ffc70236f5"}]},{"u":8,"id":"hk3-08-1","no":1,"ko":"비단길 따라 6,400km","items":[{"n":1,"t":"tf","q":"Aladdin and the Magic Lamp is a popular story of an Arabian character named Aladdin.","ko":"<알라딘과 마법의 램프>는 알라딘이라는 이름의 아랍인 캐릭터에 대한 인기 있는 이야기이다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Aladdin and the Magic Lamp is a popular story of an Arabian character named Aladdin.","<알라딘과 마법의 램프>는 알라딘이라는 이름의 한 아랍인 캐릭터에 대한 인기 있는 이야기이다."]],"w":"1번 문장에 그대로 나와요. 알라딘이라는 이름의 아랍인 캐릭터에 대한 인기 있는 이야기라고 해요.","c":"T"},"h":"a3a8fc7623"},{"n":2,"t":"tf","q":"In the original book, the story takes place in the Middle East.","ko":"원작에서, 그 이야기는 중동에서 일어난다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"However, in the original book, the story is set somewhere in China!","하지만, 원작에서, 그 이야기는 중국 어딘가를 배경으로 한다!"]],"w":"3번 문장에서 원작에서는 이야기가 중국 어딘가를 배경으로 한다고 해요. 중동은 많은 책과 영화(2번)의 배경이에요.","c":"F"},"h":"8e80a1db2b"},{"n":3,"t":"tf","q":"The Silk Road got its name because silk was the most popular item sold along it.","ko":"비단길은 비단이 그 길을 따라 팔린 가장 인기 있는 상품이었기 때문에 그 이름을 얻었다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Silk was the most popular item, so it became the road’s name.","비단이 가장 인기있는 상품이어서, 그것이 길의 이름이 되었다."]],"w":"9번 문장에서 Silk was the most popular item, so it became the road's name(비단이 가장 인기 있는 상품이어서 길의 이름이 되었다)이라고 해요.","c":"T"},"h":"905ef7fe31"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Chinese merchants sold various kinds of goods, including tea and silk, along the routes to the Middle East and Rome.)","ko":"중국 ( )은 중동과 로마로 향하는 경로를 따라, 차와 비단을 포함하여, 다양한 종류의 상품을 팔았다.","opts":["상인들","학자들","군인들","농부들"],"word":"merchants","r":{"a":"1) 상인들","ev":"8번 문장","s":[[8,"Chinese merchants sold various kinds of goods, including tea and silk, along the routes to the Middle East and Rome.","중국 상인들은 중동과 로마로 향하는 경로를 따라, 차와 비단을 포함하여, 다양한 종류의 상품을 팔았다."]],"w":"상품을 팔았다는 말에서 merchants는 물건을 사고파는 '상인들'이에요. 10번에서 같은 사람들을 traders(상인들)라고도 불러요.","c":1},"h":"9afda2eefd"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In addition to merchandise, Chinese traders also shared various other things, like their food and fables.)","ko":"상품에 더해, 중국 상인들은 그들의 음식과 ( )와 같은 다양한 다른 것들도 공유했다.","opts":["무기","약","지도","우화"],"word":"fables","r":{"a":"4) 우화","ev":"10~11번 문장","s":[[10,"In addition to merchandise, Chinese traders also shared various other things, like their food and fables.","상품에 더해, 중국 상인들은 그들의 음식과 우화와 같은 다양한 다른 것들도 공유했다."],[11,"As a result of this cultural exchange, stories like Aladdin’s developed.","이러한 문화적 교류의 결과로, 알라딘의 이야기와 같은 이야기들이 생겨났다."]],"w":"음식과 함께 공유한 것이고, 11번에서 그 결과 알라딘 같은 이야기들이 생겼다고 해요. 그래서 fables는 옛이야기인 '우화'예요.","c":4},"h":"e9e609f3b2"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis 6,400-kilometer-long road connected China to countries in the West.","ko":"밑줄 친 This이(가) 가리키는 것은?","sko":"이 6,400킬로미터 길이의 길은 중국을 서구권에 연결해 주었다.","opts":["비단길","중국 상인들이 팔던 상품","알라딘의 이야기","중동의 한 도시"],"r":{"a":"1) 비단길","ev":"7번 문장","s":[[7,"This 6,400-kilometer-long road connected China to countries in the West.","이 6,400킬로미터 길이의 길은 중국을 서구권에 연결해 주었다."]],"w":"7번의 This road는 앞 문장에서 설명한 비단길(Silk Road)이에요. 중국을 서구권에 연결해 준 길이었어요.","c":1,"k":"This = 비단길"},"pron":"This","h":"94e0d938eb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In many books and movies, the story takes place in the Middle East.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"많은 책과 영화에서, 그 이야기는 중동에서 일어난다.","opts":["많은 책과 영화에서, 그 이야기는 중동을 배경으로 한다.","많은 책과 영화에서, 그 이야기는 중국에서 시작해 중동으로 끝난다.","책과 영화에서는, 그 이야기를 거의 다루지 않는다.","중동에는 그 이야기를 다룬 책과 영화가 많지 않다."],"r":{"a":"1) 많은 책과 영화에서, 그 이야기는 중동을 배경으로 한다.","ev":"2번 문장","s":[[2,"In many books and movies, the story takes place in the Middle East.","많은 책과 영화에서, 그 이야기는 중동에서 일어난다."]],"w":"2번에서 많은 책과 영화에서 알라딘 이야기는 중동에서 일어난다(takes place in the Middle East)고 해요.","c":1},"h":"25d9ae4181"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["비단길은 고대 무역 경로의 연결망이었다.","비단길은 작년에 지어진 새 고속도로였다.","비단길은 중국을 가로질러 흐르는 강이었다.","비단길은 한 도시 안의 작은 길이었다."],"opts":["The Silk Road was a network of ancient trade routes.","The Silk Road was a new highway built last year.","The Silk Road was a river that flowed through China.","The Silk Road was a small road inside one city."],"r":{"a":"1) The Silk Road was a network of ancient trade routes. (비단길은 고대 무역 경로의 연결망이었다.)","ev":"6번 문장","s":[[6,"The Silk Road was a network of ancient trade routes.","비단길은 고대 무역 경로의 연결망이었다."]],"w":"6번에서 비단길은 고대 무역 경로의 연결망(a network of ancient trade routes)이었다고 해요.","c":1},"h":"d142c58148"},{"n":9,"t":"sum","q":"As a result of this cultural (A), stories like Aladdin’s (B).","ko":"이러한 문화적 (A)의 결과로, 알라딘의 이야기와 같은 이야기들이 (B).","oko":["(A) 전쟁 / (B) 생겨났다","(A) 교류 / (B) 사라졌다","(A) 교류 / (B) 생겨났다","(A) 전쟁 / (B) 사라졌다","(A) 여행 / (B) 끝났다"],"opts":["(A) war / (B) developed","(A) exchange / (B) disappeared","(A) exchange / (B) developed","(A) war / (B) disappeared","(A) trip / (B) ended"],"r":{"a":"3) (A) exchange / (B) developed ((A) 교류 / (B) 생겨났다)","ev":"11번 문장","s":[[11,"As a result of this cultural exchange, stories like Aladdin’s developed.","이러한 문화적 교류의 결과로, 알라딘의 이야기와 같은 이야기들이 생겨났다."]],"w":"11번에서 문화적 교류(cultural exchange)의 결과로 알라딘과 같은 이야기들이 생겨났다(developed)고 해요.","c":3},"h":"dd9c8915ab"},{"n":10,"t":"fill","q":"How did two very [A] cultures [B] in one old story, then?","ko":"그렇다면, 서로 매우 [A] 두 문화가 하나의 옛이야기 속에 어떻게 [B] 것일까?","bank":["different","appear","silk","sold","along","tea"],"bko":{"different":"다른","appear":"나타나다","silk":"비단","sold":"팔았다(sell의 과거)","along":"~을 따라","tea":"차"},"r":{"a":"[A] different (다른), [B] appear (나타나다)","ev":"4번 문장","s":[[4,"How did two very different cultures appear in one old story, then?","그렇다면, 서로 매우 다른 두 문화가 어떻게 하나의 옛이야기 속에 나타났을까?"]],"w":"4번에서 서로 매우 다른(different) 두 문화가 어떻게 하나의 옛이야기 속에 나타났는지(appear) 묻고 있어요.","c":null},"h":"ff4695e06f"}]},{"u":8,"id":"hk3-08-2","no":2,"ko":"커튼이 왜 거기서 나와?","items":[{"n":1,"t":"tf","q":"Valley Curtain was a 381-meter-long wall of orange cloth.","ko":"<계곡의 커튼>은 381미터 길이의 주황색 천으로 된 벽이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It was a 381-meter-long wall of orange cloth hanging between two Colorado mountain slopes.","그것은 두 콜로라도 산비탈 사이에 걸려 있는 381미터 길이의 주황색 천으로 된 벽이었다."]],"w":"2번 문장에 It was a 381-meter-long wall of orange cloth가 그대로 나와요.","c":"T"},"h":"dd19ef61f0"},{"n":2,"t":"tf","q":"The artists installed the curtain before they sketched its shape.","ko":"작가들은 커튼의 형태를 밑그림으로 그리기 전에 커튼을 설치했다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"For 28 months between 1970 and 1972, they sketched the curtain’s shape, dyed a huge piece of fabric, and found a suitable valley.","1970년에서 1972년 사이의 28개월 동안, 그들은 커튼의 형태의 밑그림을 그리고, 엄청난 크기의 천 조각을 염색하고, 그리고 적절한 계곡을 발견했다."],[5,"Then, they gathered a team of 100 engineers and installed the curtain.","그 다음, 그들은 100명의 공학자들로 된 팀을 모으고 커튼을 설치했다."]],"w":"4번에서 밑그림을 그리고 염색하고 계곡을 찾은 다음, 5번에서 Then(그 다음) 커튼을 설치했어요. 순서가 반대예요.","c":"F"},"h":"ae0ffa5781"},{"n":3,"t":"tf","q":"Land artists want their work to be a part of nature.","ko":"대지 미술가들은 그들의 작품이 자연의 일부가 되기를 원한다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Land artists want their work to be a part of nature.","대지 미술가들은 그들의 작품이 자연의 일부가 되기를 원한다."]],"w":"10번 문장에 Land artists want their work to be a part of nature가 그대로 나와요.","c":"T"},"h":"4bb1ad4b8e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For 28 months between 1970 and 1972, they sketched the curtain’s shape, dyed a huge piece of fabric, and found a suitable valley.)","ko":"1970년에서 1972년 사이의 28개월 동안, 그들은 커튼의 형태의 밑그림을 그리고, 엄청난 크기의 천 조각을 염색하고, ( ) 계곡을 발견했다.","opts":["위험한","거대한","낡은","적절한"],"word":"suitable","r":{"a":"4) 적절한","ev":"4번 문장","s":[[4,"For 28 months between 1970 and 1972, they sketched the curtain’s shape, dyed a huge piece of fabric, and found a suitable valley.","1970년에서 1972년 사이의 28개월 동안, 그들은 커튼의 형태의 밑그림을 그리고, 엄청난 크기의 천 조각을 염색하고, 그리고 적절한 계곡을 발견했다."]],"w":"커튼을 걸 수 있는 곳을 찾는 일이에요. 준비 과정에서 알맞은 계곡을 찾았다는 뜻이라 suitable은 '적절한'이에요.","c":4},"h":"4fcb5249cb"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They had to remove the work, but they were not frustrated.)","ko":"그들은 그 작품을 치워야 했지만, ‘( )’ 상태는 아니었다.","opts":["기뻐하는","좌절한","놀란","피곤한"],"word":"frustrated","r":{"a":"2) 좌절한","ev":"7~8번 문장","s":[[7,"They had to remove the work, but they were not frustrated.","그들은 그 작품을 치워야 했지만, 좌절하지 않았다."],[8,"In fact, this was close to what they expected!","사실, 이것은 그들이 기대했던 것에 가까웠다!"]],"w":"but(하지만)으로 앞과 대조돼요. 작품을 치워야 했지만 좌절하지 않았고, 8번에서 사실은 기대했던 것에 가까웠다고 해요. frustrated는 '좌절한'이에요.","c":2},"h":"e069d8f2a8"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt looked like a curtain laid down by a giant.","ko":"밑줄 친 It이(가) 가리키는 것은?","sko":"그것은 거인에 의해 놓인 커튼처럼 보였다.","opts":["<계곡의 커튼> 작품","거인","콜로라도의 산비탈","크리스토의 가족"],"r":{"a":"1) <계곡의 커튼> 작품","ev":"3번 문장","s":[[3,"It looked like a curtain laid down by a giant.","그것은 거인에 의해 놓인 커튼처럼 보였다."]],"w":"3번의 It은 앞 문장에서 설명한 <계곡의 커튼>이에요. 산비탈 사이에 걸린 거대한 주황색 천 벽이 거인이 놓은 커튼처럼 보였다는 뜻이에요.","c":1,"k":"It = <계곡의 커튼> 작품"},"pron":"It","h":"69a7eb9a9f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the end, it was also finished by nature.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"결국, 그것은 자연에 의해 마무리도 지어졌다.","opts":["마지막에는 그 작품도 자연의 힘으로 끝이 났다.","마지막에는 그 작품이 자연보다 더 오래 남았다.","마지막에는 작가들이 직접 작품을 완성했다.","마지막에는 자연이 작품을 만드는 것을 도왔다."],"r":{"a":"1) 마지막에는 그 작품도 자연의 힘으로 끝이 났다.","ev":"12번 문장","s":[[12,"In the end, it was also finished by nature.","결국, 그것은 자연에 의해 마무리도 지어졌다."]],"w":"finished by nature는 '자연에 의해 마무리되다'예요. 작품은 자연과 함께 변하다가 결국 자연(강풍)에 의해 끝났어요.","c":1},"h":"78518a61c5"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["<계곡의 커튼>은 크리스토와 잔느 클로드가 만들었다.","<계곡의 커튼>은 거인이 만들었다.","<계곡의 커튼>은 콜로라도 농부들로 된 팀이 만들었다.","<계곡의 커튼>은 오직 자연이 만들었다."],"opts":["Valley Curtain was made by Christo and Jeanne-Claude.","Valley Curtain was made by a giant.","Valley Curtain was made by a team of Colorado farmers.","Valley Curtain was made by nature alone."],"r":{"a":"1) Valley Curtain was made by Christo and Jeanne-Claude. (<계곡의 커튼>은 크리스토와 잔느 클로드가 만들었다.)","ev":"1번 문장","s":[[1,"Valley Curtain was a work by the artists Christo and Jeanne-Claude.","<계곡의 커튼>은 예술가 크리스토와 잔느 클로드에 의해 만들어진 작품이었다."]],"w":"1번에서 <계곡의 커튼>은 예술가 크리스토와 잔느 클로드의 작품이었다고 해요.","c":1},"h":"347c5923b2"},{"n":9,"t":"sum","q":"Valley Curtain was (A) by strong winds just 28 (B) after it was installed.","ko":"<계곡의 커튼>은 설치된 지 단 28 (B) 후에 강풍에 의해 (A).","oko":["(A) 지어졌다 / (B) 시간","(A) 파괴되었다 / (B) 년","(A) 지어졌다 / (B) 년","(A) 파괴되었다 / (B) 시간","(A) 팔렸다 / (B) 일"],"opts":["(A) built / (B) hours","(A) destroyed / (B) years","(A) built / (B) years","(A) destroyed / (B) hours","(A) sold / (B) days"],"r":{"a":"4) (A) destroyed / (B) hours ((A) 파괴되었다 / (B) 시간)","ev":"6번 문장","s":[[6,"However, the work was destroyed by strong winds, just 28 hours after it was installed.","하지만, 그 작품은 설치된 지 단 28시간 후에, 강풍에 의해 파괴되었다."]],"w":"6번에서 그 작품은 설치된 지 28시간 만에 강풍에 의해 파괴되었다(destroyed)고 해요.","c":4},"h":"0d53fa13a0"},{"n":10,"t":"fill","q":"Valley Curtain, for example, [A] as the wind blew, so it changed with the [B] of nature.","ko":"예를 들어, <계곡의 커튼>은 바람이 불 때 [A] 자연의 [B]과(와) 함께 변화했다.","bank":["swayed","movement","engineers","cloth","giant","slopes"],"bko":{"swayed":"흔들렸다(sway의 과거)","movement":"움직임","engineers":"공학자들","cloth":"천","giant":"거인","slopes":"비탈"},"r":{"a":"[A] swayed (흔들렸다(sway의 과거)), [B] movement (움직임)","ev":"11번 문장","s":[[11,"Valley Curtain, for example, swayed as the wind blew, so it changed with the movement of nature.","예를 들어, <계곡의 커튼>은 바람이 불 때 흔들려서, 자연의 움직임과 함께 변화했다."]],"w":"11번에서 <계곡의 커튼>은 바람이 불 때 흔들려서(swayed) 자연의 움직임(movement)과 함께 변화했다고 해요.","c":null},"h":"d8735d35d9"}]},{"u":8,"id":"hk3-08-3","no":3,"ko":"횡단보도가 둥둥 떠 있어요!","items":[{"n":1,"t":"tf","q":"Tim soon realized that the floating crosswalk was just an illusion.","ko":"Tim은 떠다니는 횡단보도가 단지 환상이라는 것을 곧 깨달았다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"He slowed down with caution and soon realized that it was just an illusion.","그는 경계심과 함께 속도를 줄였고 곧 그것이 단지 환상이었다는 것을 깨달았다."]],"w":"3번 문장에 He slowed down with caution and soon realized that it was just an illusion이 나와요.","c":"T"},"h":"46bebd8e06"},{"n":2,"t":"tf","q":"The first crosswalk of this type was invented in a town in Spain.","ko":"이런 유형의 첫 횡단보도는 스페인의 한 마을에서 만들어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"This was a new type of crosswalk that was invented in a town in Iceland.","이것은 아이슬란드의 한 마을에서 만들어진 새로운 유형의 횡단보도였다."]],"w":"4번 문장에서 이 새로운 유형의 횡단보도는 아이슬란드의 한 마을에서 만들어졌다고 해요. 스페인은 12번에서 사용하는 나라 중 하나예요.","c":"F"},"h":"caaf012f53"},{"n":3,"t":"tf","q":"The crosswalks are used in several other countries, such as France, China, and Spain.","ko":"그 횡단보도는 프랑스, 중국, 스페인 같은 여러 다른 나라들에서 사용된다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"The crosswalks are now used in several other countries, including France, China, and Spain.","그 횡단보도는 현재 프랑스, 중국, 그리고 스페인을 포함하여, 여러 다른 나라들에서 사용된다."]],"w":"12번 문장에 several other countries, including France, China, and Spain이 나와요.","c":"T"},"h":"1cba0f5644"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (One day, Tim saw something astonishing while driving to work.)","ko":"어느 날, Tim은 직장으로 운전을 하는 동안 무언가 ( ) 것을 봤다.","opts":["지루한","익숙한","놀라운","끔찍한"],"word":"astonishing","r":{"a":"3) 놀라운","ev":"1~2번 문장","s":[[1,"One day, Tim saw something astonishing while driving to work.","어느 날, Tim은 직장으로 운전을 하는 동안 무언가 놀라운 것을 봤다."],[2,"The crosswalk was floating!","횡단보도가 떠다니고 있었다!"]],"w":"2번에서 횡단보도가 떠다니고 있었어요. 길 위에서 횡단보도가 떠다니는 모습이니 astonishing은 '놀라운'이에요.","c":3},"h":"3f5cdea968"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (He slowed down with caution and soon realized that it was just an illusion.)","ko":"그는 ( )과 함께 속도를 줄였고 곧 그것이 단지 환상이었다는 것을 깨달았다.","opts":["경계심","분노","기쁨","피로"],"word":"caution","r":{"a":"1) 경계심","ev":"3번 문장","s":[[3,"He slowed down with caution and soon realized that it was just an illusion.","그는 경계심과 함께 속도를 줄였고 곧 그것이 단지 환상이었다는 것을 깨달았다."]],"w":"떠다니는 횡단보도를 보고 조심하면서 속도를 줄였어요. caution은 '경계심, 조심'이에요.","c":1},"h":"4057958fa2"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThey are painted on a flat surface by using clever shading techniques that make them look like white boards floating above the street!","ko":"밑줄 친 them이 가리키는 것은?","sko":"그것은 길 위에 떠다니는 흰색 판자들처럼 보이도록 만드는 기발한 명암 기법을 이용해서 평평한 표면 위에 그려진다!","opts":["흰색 판자들","횡단보도들","운전자들","과속방지턱들"],"r":{"a":"2) 횡단보도들","ev":"6~7번 문장","s":[[6,"These crosswalks appeared to be 3D, but are actually optical illusions.","이 횡단보도는 3D인 것처럼 보였지만, 실제로는 착시 현상이다."],[7,"They are painted on a flat surface by using clever shading techniques that make them look like white boards floating above the street!","그것은 길 위에 떠다니는 흰색 판자들처럼 보이도록 만드는 기발한 명암 기법을 이용해서 평평한 표면 위에 그려진다!"]],"w":"them은 '흰 판자처럼 보이게 되는' 대상이에요. 7번 앞부분의 They는 6번의 These crosswalks이고, them도 그 횡단보도들이에요. 흰 판자는 비교 대상(look like ~)이에요.","c":2},"h":"d1df6bac23"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"From far away, people appear as if they were walking on air.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"멀리서, 사람들은 마치 공중에서 걷고 있는 것처럼 보인다.","opts":["멀리서 보면 사람들이 마치 공중을 걷고 있는 것처럼 보인다.","멀리서 보면 사람들이 실제로 공중에서 걷고 있다.","가까이서 보면 사람들이 공중을 걷는 것처럼 보인다.","멀리서 보면 사람들이 걷지 않고 서 있는 것처럼 보인다."],"r":{"a":"1) 멀리서 보면 사람들이 마치 공중을 걷고 있는 것처럼 보인다.","ev":"11번 문장","s":[[11,"From far away, people appear as if they were walking on air.","멀리서, 사람들은 마치 공중에서 걷고 있는 것처럼 보인다."]],"w":"as if ~는 '마치 ~인 것처럼'이에요. 실제로 공중을 걷는 것이 아니라, 멀리서 그렇게 보인다는 뜻이에요.","c":1},"h":"6970d64845"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["마을은 주민들이 빠르게 달리는 차를 두려워해서 특별한 횡단보도를 설치했다.","그 마을의 주민들은 빠르게 달리는 차를 아주 좋아했다.","마을은 횡단보도가 너무 낡아서 모두 없앴다.","Tim은 그 특별한 횡단보도를 혼자 만들었다."],"opts":["The town installed special crosswalks because the residents were afraid of fast-driving cars.","The residents of the town loved fast-driving cars.","The town removed all its crosswalks because they were too old.","Tim built the special crosswalks by himself."],"r":{"a":"1) The town installed special crosswalks because the residents were afraid of fast-driving cars. (마을은 주민들이 빠르게 달리는 차를 두려워해서 특별한 횡단보도를 설치했다.)","ev":"5번 문장","s":[[5,"The residents were afraid of fast-driving cars, so special crosswalks were installed in the town.","그 주민들은 빠르게 달리는 차들을 두려워해서, 특별한 횡단보도가 마을에 설치되었다."]],"w":"5번에서 주민들이 빠르게 달리는 차를 두려워해서 특별한 횡단보도가 설치되었다고 해요.","c":1},"h":"60668b49cb"},{"n":9,"t":"sum","q":"The crosswalks are much (A) than speed (B), but they still make drivers careful.","ko":"그 횡단보도는 과속 (B)보다 훨씬 (A)지만, 여전히 운전자들을 조심하게 만든다.","oko":["(A) 더 싸 / (B) 표지판","(A) 더 싸 / (B) 방지턱","(A) 더 느리 / (B) 방지턱","(A) 더 비싸 / (B) 차","(A) 더 비싸 / (B) 표지판"],"opts":["(A) cheaper / (B) signs","(A) cheaper / (B) bumps","(A) slower / (B) bumps","(A) more expensive / (B) cars","(A) more expensive / (B) signs"],"r":{"a":"2) (A) cheaper / (B) bumps ((A) 더 싸 / (B) 방지턱)","ev":"9번 문장","s":[[9,"They’re much cheaper than speed bumps, but they still increase drivers’ caution.","그것은 과속방지턱보다 훨씬 더 싸지만, 여전히 운전자들의 경계심을 높인다."]],"w":"9번에서 그 횡단보도는 과속방지턱(speed bumps)보다 훨씬 싸지만(cheaper) 여전히 운전자들의 경계심을 높인다고 해요.","c":2},"h":"90d8926ffb"},{"n":10,"t":"fill","q":"These crosswalks are [A] in many [B].","ko":"이 횡단보도는 많은 [B]에서 [A].","bank":["helpful","ways","residents","surface","techniques","cars"],"bko":{"helpful":"도움이 되 l which day of the week it was or would be.","어떠한 날짜가 주어진다고 하더라도, 그는 그것이 그 주의 어느 요일이었는지 또는 어느 요일이 될지를 즉시 말할 수 있었다."]],"w":"5번에 Given any date, he could immediately tell which day of the week it was or would be가 있어요. 어떤 날짜든 요일을 바로 말했다는 뜻이에요.","c":"T"},"h":"0e6b0e70d0"},{"n":3,"t":"tf","q":"Most people with savant syndrome get it later in life.","ko":"서번트 증후군을 가진 대부분의 사람은 생애 나중에 그것을 얻는다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"Only a few people in the world have this syndrome, and they are usually born with it.","전 세계에서 단 몇 명의 사람들만 이 증후군을 가지고 있고, 그들은 보통 그것을 가지고 태어난다."]],"w":"10번에서 그들은 보통 그것을 가지고 태어난다(they are usually born with it)고 해요. 나중에 얻는 건 드물어요.","c":"F"},"h":"d924275d52"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, when the pain ended, something unusual happened.)","ko":"하지만, 그 통증이 멎었을 때, 무언가 ( ) 일이 일어났다.","opts":["평범한","이상한","행복한","위험한"],"word":"unusual","r":{"a":"2) 이상한","ev":"3~4번 문장","s":[[3,"However, when the pain ended, something unusual happened.","하지만, 그 통증이 멎었을 때, 무언가 이상한 일이 일어났다."],[4,"He could suddenly perform calendar calculations.","그는 갑자기 달력에 관한 계산을 할 수 있었다."]],"w":"통증이 멎은 뒤 4번에서 갑자기 달력 계산을 할 수 있게 되었어요. 보통 일어나지 않는 일이라서 unusual = 이상한, 특이한이에요.","c":2},"h":"dd6dd4707a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is rare to acquire savant syndrome later in life like Orlando.)","ko":"Orlando처럼 서번트 증후군을 생애에서 나중에 ( ) 것은 드문 일이다.","opts":["치료하다","잃다","설명하다","얻다"],"word":"acquire","r":{"a":"4) 얻다","ev":"10~11번 문장","s":[[10,"Only a few people in the world have this syndrome, and they are usually born with it.","전 세계에서 단 몇 명의 사람들만 이 증후군을 가지고 있고, 그들은 보통 그것을 가지고 태어난다."],[11,"It is rare to acquire savant syndrome later in life like Orlando.","Orlando처럼 서번트 증후군을 생애에서 나중에 얻는 것은 드문 일이다."]],"w":"10번에서 보통은 태어날 때부터 가지고 있다고 했어요. 그래서 11번은 Orlando처럼 나중에 얻는 일이 드물다는 뜻이고, acquire = 얻다, 습득하다예요.","c":4},"h":"f7791f4ae3"},{"n":6,"t":"ref","q":"What does the underlined \"he\" refer to?\nLater, the doctor said that he had developed savant syndrome from the injury.","ko":"밑줄 친 he이(가) 가리키는 것은?","sko":"이후에, 의사는 그 부상으로 그에게서 서번트 증후군이 생겼다고 말했다.","opts":["Orlando","그 의사","야구 선수","Orlando의 부모님"],"r":{"a":"1) Orlando","ev":"9번 문장","s":[[9,"Later, the doctor said that he had developed savant syndrome from the injury.","이후에, 의사는 그 부상으로 그에게서 서번트 증후군이 생겼다고 말했다."]],"w":"9번의 he는 의사가 한 말의 주인공, 즉 부상 때문에 서번트 증후군이 생겼다는 Orlando예요.","c":1,"k":"he = Orlando"},"pron":"he","h":"142ab24cc6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"He knew what the weather was like, what clothes he was wearing, and every other detail of each day.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그는 날씨가 어땠는지, 그가 무슨 옷을 입고 있었는지, 그리고 각 날마다의 다른 모든 세부 사항을 알고 있었다.","opts":["그는 날씨와 옷에 대해서만 알았고 다른 세부 사항은 몰랐다.","그는 날씨를 알아보려고 매일 옷을 갈아입었다.","그는 날씨가 어땠는지, 무슨 옷을 입고 있었는지, 그리고 매일의 다른 모든 세부 사항을 알았다.","그는 날씨와 다른 사람들의 하루도 모두 알고 있었다."],"r":{"a":"3) 그는 날씨가 어땠는지, 무슨 옷을 입고 있었는지, 그리고 매일의 다른 모든 세부 사항을 알았다.","ev":"8번 문장","s":[[8,"He knew what the weather was like, what clothes he was wearing, and every other detail of each day.","그는 날씨가 어땠는지, 그가 무슨 옷을 입고 있었는지, 그리고 각 날마다의 다른 모든 세부 사항을 알고 있었다."]],"w":"what the weather was like, what clothes he was wearing, and every other detail of each day는 날씨, 입은 옷, 매일의 다른 모든 세부 사항을 나열한 거예요. 그래서 3번이에요.","c":3},"h":"5d50fe4291"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Orlando는 사고 이후 하루하루를 완벽하게 기억할 수 있었다.","Orlando는 오랜 병 때문에 서번트 증후군이 생겼다.","서번트 증후군을 나중에 얻는 사람은 많다.","Orlando의 날짜 질문에 대한 대답은 가끔 틀렸다."],"opts":["Orlando could remember every day perfectly after the accident.","Orlando got savant syndrome from a long illness.","Many people acquire savant syndrome later in life.","Orlando’s answers to date questions were sometimes wrong."],"r":{"a":"1) Orlando could remember every day perfectly after the accident. (Orlando는 사고 이후 하루하루를 완벽하게 기억할 수 있었다.)","ev":"7번 문장","s":[[7,"In addition, he was able to remember every day perfectly after the accident.","게다가, 그는 사고 이후 하루하루를 완벽하게 기억할 수 있었다."]],"w":"7번에서 Orlando는 사고 이후 하루하루를 완벽하게 기억할 수 있었다고 해요.","c":1},"h":"a9722f1d61"},{"n":9,"t":"sum","q":"Doctors are now (A) his mind to solve the (B) of his incredible ability.","ko":"의사들은 그의 놀라운 능력의 (B)을(를) 풀기 위해 현재 그의 정신을 (A) 있다.","oko":["(A) 무시하고 / (B) 가격","(A) 연구하고 / (B) 가격","(A) 연구하고 / (B) 불가사의","(A) 잊고 / (B) 게임","(A) 무시하고 / (B) 불가사의"],"opts":["(A) ignoring / (B) price","(A) studying / (B) price","(A) studying / (B) mystery","(A) forgetting / (B) game","(A) ignoring / (B) mystery"],"r":{"a":"3) (A) studying / (B) mystery ((A) 연구하고 / (B) 불가사의)","ev":"12번 문장","s":[[12,"Therefore, doctors are now studying his mind to solve the mystery of his incredible ability.","따라서, 의사들은 그의 놀라운 능력의 불가사의를 풀기 위해 현재 그의 정신을 연구하고 있다."]],"w":"12번에서 의사들은 그의 놀라운 능력의 불가사의(mystery)를 풀기 위해 현재 그의 정신을 연구하고 있다(studying)고 해요.","c":3},"h":"2996f5b377"},{"n":10,"t":"fill","q":"He could suddenly [A] [B] calculations.","ko":"그는 갑자기 [B] 계산을 [A] 수 있었다.","bank":["perform","calendar","doctor","baseball","headache","boy"],"bko":{"perform":"수행하다","calendar":"달력","doctor":"의사","baseball":"야구","headache":"두통","boy":"소년"},"r":{"a":"[A] perform (수행하다), [B] calendar (달력)","ev":"4번 문장","s":[[4,"He could suddenly perform calendar calculations.","그는 갑자기 달력에 관한 계산을 할 수 있었다."]],"w":"4번에서 그는 갑자기 달력(calendar) 계산을 수행할(perform) 수 있었다고 해요.","c":null},"h":"51db7320d9"}]},{"u":9,"id":"hk3-09-4","no":4,"ko":"영화는 하나, ‘이것’은 여러 개","items":[{"n":1,"t":"tf","q":"The poster for Avengers: Endgame in China showed the most popular characters in a bigger size.","ko":"중국의 <어벤져스: 엔드게임> 포스터는 가장 인기 있는 등장인물을 더 큰 크기로 보여 주었다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"For example, the poster in China emphasized all of the characters equally by keeping them the same size.","예를 들어, 중국의 포스터는 모든 등장인물들을 같은 크기로 두어서 똑같이 강조했다."]],"w":"2번에서 중국 포스터는 모든 등장인물을 같은 크기로 두어서 똑같이 강조했어요. 더 크게 보여 준 건 다른 나라들의 포스터예요(3번).","c":"F"},"h":"ffd19058ec"},{"n":2,"t":"tf","q":"The original poster of The Host showed only the main characters.","ko":"<괴물>의 원래 포스터는 주인공들만 보여 주었다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It only showed the main characters.","그것은 주인공들만 보여줬다."]],"w":"6번에 It only showed the main characters(그것은 주인공들만 보여줬다)가 나와요. It은 5번의 원래 포스터예요.","c":"T"},"h":"40c007b321"},{"n":3,"t":"tf","q":"The Host was released in only a few foreign countries.","ko":"<괴물>은 해외의 몇몇 나라에서만 개봉되었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Likewise, there are different posters for The Host, a Korean monster film, which was released in 202 foreign countries.","마찬가지로, 한국의 괴수 영화인 <괴물>에도 서로 다른 포스터가 있는데, 이것은 해외 202개국에서 개봉되었다."]],"w":"4번에서 <괴물>은 202개의 해외 국가에서 개봉되었다고 해요. 몇몇 나라만이 아니에요.","c":"F"},"h":"447c756133"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (…the poster in China emphasized all of the characters equally…)","ko":"중국의 포스터는 모든 등장인물들을 같은 크기로 두어서 똑같이 ( ).","opts":["숨겼다","줄였다","강조했다","바꿨다"],"word":"emphasized","r":{"a":"3) 강조했다","ev":"2번 문장","s":[[2,"For example, the poster in China emphasized all of the characters equally by keeping them the same size.","예를 들어, 중국의 포스터는 모든 등장인물들을 같은 크기로 두어서 똑같이 강조했다."]],"w":"모든 인물을 같은 크기로 두었다는 건 어느 한 명만 더 크게 하지 않고 모두를 똑같이 눈에 띄게 했다는 뜻이에요. emphasize = 강조하다.","c":3},"h":"535332d518"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Most of them portrayed the scene of a girl…)","ko":"그것들 대부분은 괴물의 꼬리에 붙잡혀 있는 한 소녀의 장면을 ( ).","opts":["묘사했다","삭제했다","촬영했다","개봉했다"],"word":"portrayed","r":{"a":"1) 묘사했다","ev":"8번 문장","s":[[8,"Most of them portrayed the scene of a girl who was being grabbed by the tail of the monster.","그것들 대부분은 괴물의 꼬리에 붙잡혀 있는 한 소녀의 장면을 묘사했다."]],"w":"포스터에 소녀가 괴물의 꼬리에 붙잡힌 장면을 그림으로 나타냈다는 뜻이에요. portray = 묘사하다.","c":1},"h":"9ddd62c112"},{"n":6,"t":"ref","q":"What does the underlined \"Their\" refer to?\nTheir designs depend on what will draw a larger audience in each country.","ko":"밑줄 친 Their이(가) 가리키는 것은?","sko":"그것들의 디자인은 각 나라에서 무엇이 더 많은 관객을 끌어들일 것인지에 달려있다.","opts":["영화 포스터들의","관객들의","나라들의","주인공들의"],"r":{"a":"1) 영화 포스터들의","ev":"10번 문장","s":[[10,"Their designs depend on what will draw a larger audience in each country.","그것들의 디자인은 각 나라에서 무엇이 더 많은 관객을 끌어들일 것인지에 달려 있다."]],"w":"10번의 Their는 앞 문장에서 말한 영화 포스터들을 가리켜요. 포스터의 디자인은 각 나라에서 무엇이 더 많은 관객을 끌어들일지에 달려 있어요.","c":1,"k":"Their = 영화 포스터들의"},"pron":"Their","h":"990ec046aa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the original version of the poster, there was no monster.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 포스터의 원래 버전에는, 괴물이 없었다.","opts":["포스터의 원래 버전에는 괴물이 없었다.","포스터의 원래 버전에는 괴물만 있었다.","포스터의 원래 버전에는 괴물이 아주 크게 그려져 있었다.","포스터의 원래 버전은 만들어지지 않았다."],"r":{"a":"1) 포스터의 원래 버전에는 괴물이 없었다.","ev":"5번 문장","s":[[5,"In the original version of the poster, there was no monster.","그 포스터의 원래 버전에는, 괴물이 없었다."]],"w":"5번에서 포스터의 원래 버전에는 괴물이 없었다(there was no monster)고 해요.","c":1},"h":"5a293ee745"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["<괴물>의 포스터는 다른 나라들에서 많이 다르게 생겼다.","<괴물>의 포스터는 모든 나라에서 완전히 똑같이 생겼다.","<괴물>의 포스터는 한국에서만 만들어졌다.","<괴물>의 포스터는 모든 나라에서 같은 장면을 보여 주었다."],"opts":["The Host posters looked a lot different in other countries.","The Host posters looked exactly the same in all countries.","The Host posters were only made in Korea.","The Host posters showed the same scene in every country."],"r":{"a":"1) The Host posters looked a lot different in other countries. (<괴물>의 포스터는 다른 나라들에서 많이 다르게 생겼다.)","ev":"7번 문장","s":[[7,"However, the posters looked a lot different in other countries.","하지만, 다른 나라들에서는 포스터가 많이 다르게 생겼다."]],"w":"7번에서 다른 나라들에서는 포스터가 많이 다르게 생겼다고 해요.","c":1},"h":"32f413df63"},{"n":9,"t":"sum","q":"Designers want to (A) a larger audience, so posters (B) from country to country.","ko":"디자이너들은 더 많은 관객을 (A) 위해, 영화 포스터는 나라마다 (B).","oko":["(A) 잃기 / (B) 같다","(A) 끌어들이기 / (B) 같다","(A) 끌어들이기 / (B) 달라진다","(A) 잃기 / (B) 달라진다","(A) 숨기기 / (B) 같다"],"opts":["(A) lose / (B) agree","(A) attract / (B) agree","(A) attract / (B) change","(A) lose / (B) change","(A) hide / ."]],"w":"12번에서 자각몽은 정신이 깨어 있게 해서 피로를 느끼게 한다고 해요. 푹 쉬었다는 말과 반대예요.","c":"F"},"h":"cb3ffdbfec"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then you could change where you are just by thinking about it and escape.)","ko":"그러면 당신은 그냥 그것에 대해 생각함으로써 당신이 있는 곳을 바꾸고 ( ) 수 있다.","opts":["들어갈","잠들","탈출할","웃을"],"word":"escape","r":{"a":"3) 탈출할","ev":"5~6번 문장","s":[[5,"For example, let’s say you are dreaming that zombies are chasing you.","예를 들어, 좀비들이 당신을 뒤쫓고 있는 꿈을 꾸고 있다고 가정해보자."],[6,"Then you could change where you are just by thinking about it and escape.","그러면 당신은 그냥 당신이 있는 곳에 대해 생각함으로써 당신이 있는 곳을 바꾸고 탈출할 수 있다."]],"w":"5번에서 좀비들이 당신을 뒤쫓고 있어요. 6번에서 장소를 바꿔서 그 상황에서 빠져나오는 거예요. escape = 탈출하다.","c":3},"h":"43ce4f5dd6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Scientists say lucid dreams reduce anxiety and stress.)","ko":"과학자들은 자각몽이 ( )과 스트레스를 줄인다고 말한다.","opts":["기쁨","피로","창의력","불안"],"word":"anxiety","r":{"a":"4) 불안","ev":"7번 문장","s":[[7,"Scientists say lucid dreams reduce anxiety and stress.","과학자들은 자각몽이 불안과 스트레스를 줄인다고 말한다."]],"w":"7번은 자각몽의 좋은 점이에요. 줄어드는 것은 stress(스트레스)와 함께 나쁜 마음 상태인 anxiety = 불안이에요.","c":4},"h":"000d53015d"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nSome artists have reported that they can try different artistic techniques in lucid dreams and then apply them in real life.","ko":"밑줄 친 they이(가) 가리키는 것은?","sko":"일부 예술가들은 그들이 자각몽에서 다양한 예술적 기법들을 시도할 수 있고 그 후 그것들을 현실에 적용할 수 있다고 보고했다.","opts":["일부 예술가들","자각몽들","과학자들","예술적 기법들"],"r":{"a":"1) 일부 예술가들","ev":"10번 문장","s":[[10,"Some artists have reported that they can try different artistic techniques in lucid dreams and then apply them in real life.","일부 예술가들은 그들이 자각몽에서 다양한 예술적 기법들을 시도할 수 있고 그 후 그것들을 현실에 적용할 수 있다고 보고했다."]],"w":"10번의 they는 같은 문장의 주어 Some artists예요. 예술가들이 자각몽에서 다양한 기법을 시도할 수 있다고 보고했어요.","c":1,"k":"they = 일부 예술가들"},"pron":"they","h":"115ca97927"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Sometimes you can even control what happens in a lucid dream.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"가끔은 심지어 자각몽에서 일어나는 일을 조종할 수도 있다.","opts":["가끔은 자각몽에서 일어나는 일을 직접 조종할 수도 있다.","자각몽에서는 아무것도 바꿀 수 없다.","자각몽에서는 다른 사람이 일어나는 일을 정해 준다.","자각몽은 일어나는 일을 조종하지 못해 무서워진다."],"r":{"a":"1) 가끔은 자각몽에서 일어나는 일을 직접 조종할 수도 있다.","ev":"4번 문장","s":[[4,"Sometimes you can even control what happens in a lucid dream.","가끔은 심지어 자각몽에서 일어나는 일을 조종할 수도 있다."]],"w":"4번에서 가끔은 자각몽에서 일어나는 일을 조종할 수도 있다(control)고 해요.","c":1},"h":"00614a8300"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["꿈을 꿀 때, 당신은 보통 꿈을 꾸고 있다는 것을 바로 알아차린다.","꿈을 꿀 때, 당신은 깨어날 때까지 꿈을 꾸고 있다는 것을 보통 알아차리지 못한다.","꿈을 꿀 때, 당신은 항상 꿈 중간에 깨어난다.","꿈을 꿀 때, 당신은 아무것도 기억하지 못한다."],"opts":["When you dream, you usually realize you are dreaming right away.","When you dream, you usually don’t realize you’re dreaming until you wake up.","When you dream, you always wake up in the middle of the dream.","When you dream, you cannot remember anything at all."],"r":{"a":"2) When you dream, you usually don’t realize you’re dreaming until you wake up. (꿈을 꿀 때, 당신은 깨어날 때까지 꿈을 꾸고 있다는 것을 보통 알아차리지 못한다.)","ev":"2번 문장","s":[[2,"When you dream, you usually don’t realize you’re dreaming until you wake up.","꿈을 꿀 때, 당신은 깨어날 때까지 꿈을 꾸고 있다는 것을 보통 알아차리지 못한다."]],"w":"2번에서 꿈을 꿀 때는 깨어날 때까지 꿈을 꾸고 있다는 것을 보통 알아차리지 못한다고 해요.","c":2},"h":"138bd4f364"},{"n":9,"t":"sum","q":"Lucid dreams can (A) your (B).","ko":"자각몽은 당신의 (B)을(를) (A) 수 있다.","oko":["(A) 줄일 / (B) 창의력","(A) 신장시킬 / (B) 피로","(A) 줄일 / (B) 건강","(A) 잃을 / (B) 피로","(A) 신장시킬 / (B) 창의력"],"opts":["(A) reduce / (B) creativity","(A) boost / (B) fatigue","(A) reduce / (B) health","(A) lose / (B) fatigue","(A) boost / (B) creativity"],"r":{"a":"5) (A) boost / (B) creativity ((A) 신장시킬 / (B) 창의력)","ev":"9번 문장","s":[[9,"These dreams are also known to boost creativity.","이러한 꿈은 창의력을 신장시킨다고도 알려져 있다."]],"w":"9번에서 자각몽은 창의력(creativity)을 신장시킨다(boost)고 알려져 있다고 해요.","c":5},"h":"4a9e1ffac5"},{"n":10,"t":"fill","q":"For example, let’s n by 287 votes.","ko":"“자, [A] [B] 끝에, 그 후보가 287표 차이로 이겼습니다.","bank":["tough","race","originally","usually","held","both"],"bko":{"tough":"힘겨운","race":"경쟁","originally":"원래","usually":"보통","held":"열렸다(hold의 과거분사)","both":"둘 다"},"r":{"a":"[A] tough (힘겨운), [B] race (경쟁)","ev":"1번 문장","s":[[1,"“Well, after a tough race, the candidate won by 287 votes.","“자, 힘겨운 경쟁 끝에, 그 후보가 287표 차이로 이겼습니다."]],"w":"1번에서 힘겨운(tough) 경쟁(race) 끝에 그 후보가 287표 차이로 이겼다고 해요.","c":null},"h":"0f37b74170"}]},{"u":10,"id":"hk3-10-3","no":3,"ko":"이것도 재활용이 된다고?","items":[{"n":1,"t":"tf","q":"The Dragon returned to the Earth without much damage.","ko":"Dragon호는 많은 손상 없이 지구로 돌아왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"However, the Dragon succeeded in returning home without much damage.","하지만, Dragon호는 많은 손상 없이 본부로 돌아오는 데 성공했다."]],"w":"7번에 the Dragon succeeded in returning home without much damage가 있어요. 진술문과 같아요.","c":"T"},"h":"14f62a169e"},{"n":2,"t":"tf","q":"Spacecraft never need to withstand high temperatures when they return.","ko":"우주선은 돌아올 때 높은 온도를 견딜 필요가 전혀 없다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"They must withstand temperatures of up to 1,850°C.","그것은 최고 섭씨 1,850도의 온도를 견뎌야 한다."]],"w":"4번에서 우주선은 최고 섭씨 1,850도의 온도를 견뎌야 한다(must withstand)고 해요. 견딜 필요가 없다는 말은 반대예요.","c":"F"},"h":"a45b1068cb"},{"n":3,"t":"tf","q":"Most of the Dragon's parts could not be used again.","ko":"Dragon호의 부품 대부분은 다시 사용될 수 없었다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"As a result, most of its parts were reusable, which saved the time and money needed to make new ones.","그 결과, 그것의 부품 중 대부분이 재사용할 수 있었는데, 이는 새로운 부품을 만들기 위해 필요한 시간과 돈을 절약했다."]],"w":"8번에서 부품 중 대부분이 재사용할 수 있었다(reusable)고 해요. 다시 사용될 수 없었다는 말은 반대예요.","c":"F"},"h":"5b70350af1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They must withstand temperatures of up to 1,850°C.)","ko":"그것은 최고 섭씨 1,850도의 온도를 ( ) 한다.","opts":["피해야","만들어야","견뎌야","측정해야"],"word":"withstand","r":{"a":"3) 견뎌야","ev":"3~4번 문장","s":[[3,"Usually, when spacecraft are sent into space, it’s extremely difficult for them to return without damage.","보통, 우주선이 우주로 보내질 때, 그것이 손상 없이 돌아오는 것은 극히 어렵다."],[4,"They must withstand temperatures of up to 1,850°C.","그것은 최고 섭씨 1,850도의 온도를 견뎌야 한다."]],"w":"3번에서 우주선이 돌아오는 것이 극히 어렵다고 했고, 4번에서 그 이유로 아주 높은 온도를 말해요. 돌아오는 동안 그 열을 견뎌야 하니까 withstand = 견디다예요.","c":3},"h":"ebd00bce6a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (…most of its parts were reusable, which saved the time and money…)","ko":"그 결과, 그것의 부품 중 대부분이 ( ), 이는 새로운 부품을 만들기 위해 필요한 시간과 돈을 절약했다.","opts":["값비쌌고","다시 쓸 수 있었고","위험했고","무거웠고"],"word":"reusable","r":{"a":"2) 다시 쓸 수 있었고","ev":"8번 문장","s":[[8,"As a result, most of its parts were reusable, which saved the time and money needed to make new ones.","그 결과, 그것의 부품 중 대부분이 재사용할 수 있었는데, 이는 새로운 부품을 만들기 위해 필요한 시간과 돈을 절약했다."]],"w":"새것을 만드는 데 필요한 시간과 돈을 아꼈다는 말이 뒤에 이어져요. 있던 부품을 다시 쓸 수 있었기 때문이에요. reusable = 다시 쓸 수 있는.","c":2},"h":"9f67e7ded0"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nUsually, when spacecraft are sent into space, it’s extremely difficult for them to return without damage.","ko":"밑줄 친 them이(가) 가리키는 것은?","sko":"보통, 우주선이 우주로 보내질 때, 그것이 손상 없이 돌아오는 것은 극히 어렵다.","opts":["우주선들","우주 정거장들","우주 비행사들","손상된 부품들"],"r":{"a":"1) 우주선들","ev":"3번 문장","s":[[3,"Usually, when spacecraft are sent into space, it’s extremely difficult for them to return without damage.","보통, 우주선이 우주로 보내질 때, 그것이 손상 없이 돌아오는 것은 극히 어렵다."]],"w":"3번의 them은 같은 문장의 spacecraft예요. 우주선이 손상 없이 돌아오는 것은 극히 어렵다는 뜻이에요.","c":1,"k":"them = 우주선들"},"pron":"them","h":"7116a86e42"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Moreover, they don’t always land in the right place.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"게다가, 그것이 항상 올바른 장소에 착륙하는 것은 아니다.","opts":["게다가 그것들은 항상 올바른 장소에 착륙한다.","게다가 그것들은 절대 올바른 장소에 착륙하지 않는다.","게다가 그것들은 올바른 장소에만 착륙하려고 한다.","게다가 그것들은 항상 올바른 장소에 착륙하는 것은 아니다."],"r":{"a":"4) 게다가 그것들은 항상 올바른 장소에 착륙하는 것은 아니다.","ev":"5번 문장","s":[[5,"Moreover, they don’t always land in the right place.","게다가, 그것이 항상 올바른 장소에 착륙하는 것은 아니다."]],"w":"don't always ~는 '항상 ~하는 것은 아니다'라는 부분 부정이에요. 올바른 곳에 착륙할 때도 있지만 항상은 아니라는 뜻이라서 4번이에요.","c":4},"h":"df1717fa22"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["대기 상층부의 강한 바람은 착륙구역으로 비행하기 어렵게 만든다.","Dragon호는 달로 보내진 첫 번째 우주선이었다.","Dragon호의 부품은 너무 손상되어 다시 쓸 수 없었다.","Dragon호는 2010년에 마지막 임무를 마치고 돌아왔다."],"opts":["Heavy winds in the upper atmosphere make it difficult to navigate to the landing zone.","The Dragon was the first spacecraft ever sent to the Moon.","The Dragon’s parts were too damaged to be used again.","The Dragon returned from its final mission in 2010."],"r":{"a":"1) Heavy winds in the upper atmosphere make it difficult to navigate to the landing zone. (대기 상층부의 강한 바람은 착륙구역으로 비행하기 어렵게 만든다.)","ev":"6번 문장","s":[[6,"Heavy winds blowing in the upper atmosphere make it difficult to navigate to the landing zone.","대기 상층부에서 부는 강한 바람은 착륙구역으로 비행하는 것을 어렵게 만든다."]],"w":"6번에서 대기 상층부에서 부는 강한 바람이 착륙구역으로 비행하는 것을 어렵게 만든다고 해요.","c":1},"h":"d7cbe027e8"},{"n":9,"t":"sum","q":"Spacecraft like the Dragon will eventually allow for more (A) and (B) space travel.","ko":"Dragon호와 같은 우주선은 결국 더 (A) 더 (B) 우주여행을 가능하게 할 것이다.","oko":["(A) 드문 / (B) 저렴한","(A) 빈번한 / (B) 느린","(A) 드문 / (B) 느린","(A) 빈번한 / (B) 저렴한","(A) 드문 / (B) 위험한"],"opts":["(A) rare / (B) cheaper","(A) frequent / (B) slower","(A) rare / (B) slower","(A) frequent / (B) cheaper","(A) rare / (B) dangerous"],"r":{"a":"4) (A) frequent / (B) cheaper ((A) 빈번한 / (B) 저렴한)","ev":"9번 문장","s":[[9,"Spacecraft like the Dragon will eventually allow for more frequent and cheaper space travel.","Dragon호와 같은 우주선은 결국 더 빈번하고 더 저렴한 우주여행을 가능하게 할 것이다."]],"w":"9번에서 Dragon호와 같은 우주선은 결국 더 빈번하고(frequent) 더 저렴한(cheaper) 우주여행을 가능하게 할 것이라고 해요.","c":4},"h":"75d48850a7"},{"n":10,"t":"fill","q":"It was the first spacecraft to make [A] trips to the [B] Space Station.","ko":"그것은 [B] 우주 정거장으로 [A] 운행을 한 첫 번째 우주선이었다.","bank":["multiple","Interna   if(it.t==="tf"){var g=el("div","tf");["T","F"].forEach(function(x){var b=el("button","o",x);b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===x));b.onclick=function(){setAns(p,it,x);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.opts){var g=el("div","opts");it.opts.forEach(function(t,i){var b=el("button","o");b.innerHTML="<i>"+(i+1)+"</i><span></span>";b.lastChild.textContent=t;b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===i+1));b.onclick=function(){setAns(p,it,i+1);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}

  if(fin){var pk=(ans[p.id]||{})[it.n];if(it.t==="tf"){Array.prototype.forEach.call(q.querySelector(".tf").children,function(b){var v=b.textContent;if(v===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(v===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}else if(it.opts){Array.prototype.forEach.call(q.querySelector(".opts").children,function(b,i){if(i+1===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(i+1===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}}

function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
