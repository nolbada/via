"correctly", "partial": false, "at": [5], "point": "형용사와 부사: 동사 understood를 꾸밀 때는 부사 correctly 사용", "topic": "형용사와 부사", "memo": "동사 understood를 꾸밀 때는 부사 correctly 사용"}]}, {"n": 7, "tag": null, "en": "You can use expression like BRT (be right there), JK (just kidding), or LOL (laughing out loud) when you text your friends.", "ko": "친구들에게 문자 메시지를 보낼 때 BRT(곧 갈게), JK(농담이야), 또는 LOL(소리 내어 웃음) 같은 표현들을 사용할 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "expression", "right": "expressions", "partial": false, "at": [3], "point": "명사의 복수형: 관사 없는 일반 의미는 복수 expressions 사용", "topic": "명사의 복수형", "memo": "관사 없는 일반 의미는 복수 expressions 사용"}]}, {"n": 8, "tag": null, "en": "However, be carefully with such expressions when you text your teachers or parents.", "ko": "하지만 선생님이나 부모님께 문자 메시지를 보낼 때는 그런 표현을 쓰는 것에 주의해라.", "ok": false, "foot": [], "fixes": [{"wrong": "carefully", "right": "careful", "partial": false, "at": [2], "point": "형용사와 부사: be 뒤 보어 자리에는 형용사 careful 사용", "topic": "형용사와 부사", "memo": "be 뒤 보어 자리에는 형용사 careful 사용"}]}, {"n": 9, "tag": null, "en": "You need to understand that some of them may not knows the meanings of such expressions.", "ko": "그들 중 일부는 이런 표현의 의미를 모를 수도 있다는 것을 이해해야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "knows", "right": "know", "partial": false, "at": [10], "point": "조동사: 조동사 may not 뒤 동사원형: know (knows 아님)", "topic": "조동사", "memo": "조동사 may not 뒤 동사원형: know (knows 아님)"}]}, {"n": 10, "tag": null, "en": "2. You need to understand that people uses emojis differently.", "ko": "2. 당신은 사람들이 이모지를 다르게 사용한다는 점을 이해해야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "uses", "right": "use", "partial": false, "at": [7], "point": "be동사/일반동사 수일치: people은 복수 취급, use 사용", "topic": "be동사/일반동사 수일치", "memo": "people은 복수 취급, use 사용"}]}, {"n": 11, "tag": null, "en": "Yesterday, Jisu gave a birthday gift to her little brother Jihoo. Later, she got the following text message.", "ko": "어제 지수는 남동생 지후에게 생일 선물을 주었다. 이후에, 그녀는 다음과 같은 문자 메시지를 받았다.", "ok": true, "foot": [], "fixes": []}, {"n": 12, "tag": null, "en": "- I loved you gift. Thanks a lot. :)", "ko": "- 선물이 아주 마음에 들었어. 정말 고마워. :)", "ok": false, "foot": [], "fixes": [{"wrong": "you", "right": "your", "partial": false, "at": [3], "point": "인칭대명사의 격: 명사 앞 소유격 your 사용", "topic": "인칭대명사의 격", "memo": "명사 앞 소유격 your 사용"}]}, {"n": 13, "tag": null, "en": "\"Only one smiling faces (:))? I guess he didn't liked my gift,\" Jisu thought.", "ko": "\"웃는 얼굴(:))이 하나뿐이네? 내 선물이 마음에 안 들었나 봐.\"라고 지수는 생각했다.", "ok": false, "foot": [], "fixes": [{"wrong": "faces", "right": "face", "partial": false, "at": [3], "point": "명사의 복수형: one 뒤에는 단수명사 face 사용", "topic": "명사의 복수형", "memo": "one 뒤에는 단수명사 face 사용"}, {"wrong": "liked", "right": "like", "partial": false, "at": [9], "point": "과거 부정문: didn't 뒤에는 동사원형 like 사용", "topic": "과거 부정문", "memo": "didn't 뒤에는 동사원형 like 사용"}]}, {"n": 14, "tag": null, "en": "When we talk with someone, we use not only words but also facial expressions and body language. In texting, we use emojis instead.", "ko": "우리는 누군가와 대화할 때, 말뿐만 아니라 얼굴 표정과 몸짓 언어도 사용한다. 문자 메시지를 보낼 때, 우리는 대신 이모지를 사용한다.", "ok": true, "foot": [], "fixes": []}, {"n": 15, "tag": null, "en": "Sometimes, a little emoji like :) can speak louder than much words. The problem is that not everybody use emojis in the same way.", "ko": "때때로 :) 같은 작은 이모지가 많은 말보다 더 큰 의미를 말할 수 있다. 문제는 모든 사람이 이모지를 같은 방식으로 사용하는 것은 아니라는 것이다.", "ok": false, "foot": [], "fixes": [{"wrong": "much", "right": "many", "partial": false, "at": [10], "point": "수량 형용사: words(복수) 앞에는 many 사용", "topic": "수량 형용사", "memo": "words(복수) 앞에는 many 사용"}, {"wrong": "use", "right": "uses", "partial": false, "at": [18], "point": "주어와 동사의 수일치: everybody는 단수 취급: uses (use 아님)", "topic": "주어와 동사의 수일치", "memo": "everybody는 단수 취급: uses (use 아님)"}]}, {"n": 16, "tag": null, "en": "Some people like to use them a lot, and some doesn't. In addition, the same emojis can mean different thing to different people.", "ko": "어떤 사람들은 이모지를 많이 사용하는 것을 좋아하고, 어떤 사람들은 그렇지 않다. 게다가 같은 이모지도 사람마다 다른 것을 의미할 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "doesn't", "right": "don't", "partial": false, "at": [10], "point": "do/does: 복수 주어 some은 don't (doesn't 아님)", "topic": "do/does", "memo": "복수 주어 some은 don't (doesn't 아님)"}, {"wrong": "thing", "right": "things", "partial": false, "at": [19], "point": "명사의 복수형: different 뒤 복수명사 things 사용", "topic": "명사의 복수형", "memo": "different 뒤 복수명사 things 사용"}]}];var PP=[["Texting is the main way of communication for many people these days, especially for teenagers.", "문자 메시지는 요즘 많은 사람들, 특히 십 대들의 주요 의사소통 수단이다.", 1], ["Do you want to know how you can communicate better through texting?", "문자 메시지를 통해 어떻게 의사소통을 더 잘할 수 있는지 알고 싶은가?", 0], ["Here are some useful tips.", "여기 몇 가지 유용한 팁이 있다.", 0], ["1. You need to know who you are talking to.", "1. 당신이 누구와 이야기하고 있는지 알아야 한다.", 1], ["Henry just sent the following text message to his mother.", "Henry는 방금 엄마에게 다음과 같은 문자 메시지를 보냈다.", 1], ["- Mom, I want you to wait just a little longer.", "- 엄마, 조금만 더 기다려 주세요.", 1], ["BRT.", "BRT.", 0], ["Do you think Henry's mother correctly understood BRT?", "당신은 Henry의 엄마가 BRT를 정확히 이해했다고 생각하는가?", 1], ["Probably not.", "아마도 그렇지 않을 것이다.", 0], ["You can use expressions like BRT (be right there), JK (just kidding), or LOL (laughing out loud) when you text your friends.", "친구들에게 문자 메시지를 보낼 때 BRT(곧 갈게), JK(농담이야), 또는 LOL(소리 내어 웃음) 같은 표현들을 사용할 수 있다.", 1], ["However, be careful with such expressions when you text your teachers or parents.", "하지만 선생님이나 부모님께 문자 메시지를 보낼 때는 그런 표현을 쓰는 것에 주의해라.", 0], ["You need to understand that some of them may not know the meanings of such expressions.", "그들 중 일부는 이런 표현의 의미를 모를 수도 있다는 것을 이해해야 한다.", 0], ["2. You need to understand that people use emojis differently.", "2. 당신은 사람들이 이모지를 다르게 사용한다는 점을 이해해야 한다.", 1], ["Yesterday, Jisu gave a birthday gift to her little brother Jihoo.", "어제 지수는 남동생 지후에게 생일 선물을 주었다.", 1], ["Later, she got the following text message.", "이후에, 그녀는 다음과 같은 문자 메시지를 받았다.", 0], ["- I loved your gift."
