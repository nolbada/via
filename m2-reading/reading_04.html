.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

var D=[{"n": 1, "tag": null, "en": "You can work with NGOs as a teenager.", "ko": "너는 십 대 청소년으로서 NGO와 함께 활동할 수 있다.", "ok": true, "foot": ["1NGOs 비영리 민간단체들"], "fixes": []}, {"n": 2, "tag": null, "en": "It is a great way learning about social issues and making the world better.", "ko": "그것은 사회 문제에 대해 배우고 세상을 더 좋게 만드는 좋은 방법이다.", "ok": false, "foot": ["1social issues 사회 문제"], "fixes": [{"wrong": "learning", "right": "to learn", "partial": false, "at": [5], "point": "to부정사의 형용사적 용법: a way를 꾸미는 말은 to부정사 to learn이 알맞음", "topic": "to부정사의 형용사적 용법", "memo": "a way를 꾸미는 말은 to부정사 to learn이 알맞음"}, {"wrong": "making", "right": "make", "partial": false, "at": [10], "point": "병렬구조: to learn과 대등하게 연결되는 두 번째 동사는 to 없이 동사원형 make를 사용", "topic": "병렬구조", "memo": "to learn과 대등하게 연결되는 두 번째 동사는 to 없이 동사원형 make를 사용"}]}, {"n": 3, "tag": null, "en": "Are you interesting?", "ko": "너는 관심이 있니?", "ok": false, "foot": [], "fixes": [{"wrong": "interesting", "right": "interested", "partial": false, "at": [2], "point": "어휘: 사람이 관심이 있을 때는 interested, 사물이 흥미로울 때는 interesting을 사용 -- 주어가 you(사람)이므로 interested가 알맞음", "topic": "어휘", "memo": "사람이 관심이 있을 때는 interested, 사물이 흥미로울 때는 interesting을 사용 -- 주어가 you(사람)이므로 interested가 알맞음"}]}, {"n": 4, "tag": null, "en": "Then, read Inho's blog below, or it will give to you many ideas.", "ko": "그렇다면 아래에서 인호의 블로그를 읽어봐, 그러면 그것이 너에게 많은 아이디어를 줄 거야.", "ok": false, "foot": [], "fixes": [{"wrong": "or", "right": "and", "partial": false, "at": [5], "point": "명령문+and/or: 명령문 뒤에 '그러면(순접)'의 의미로 이어질 때는 and를 사용 (or는 '그렇지 않으면'이라는 반대의 의미)", "topic": "명령문+and/or", "memo": "명령문 뒤에 '그러면(순접)'의 의미로 이어질 때는 and를 사용 (or는 '그렇지 않으면'이라는 반대의 의미)"}, {"wrong": "give to you many ideas", "right": "give you many ideas", "partial": false, "at": [8], "point": "4형식(수여동사): give+간접목적어(you)+직접목적어(many ideas) 순서에서는 간접목적어 앞에 전치사 to를 쓰지 않음", "topic": "4형식(수여동사)", "memo": "give+간접목적어(you)+직접목적어(many ideas) 순서에서는 간접목적어 앞에 전치사 to를 쓰지 않음"}]}, {"n": 5, "tag": "JAN 5", "en": "I grew up in Jeju-do, so I have many chances to see dolphins.", "ko": "나는 제주도에서 자라서 돌고래를 볼 기회가 많았다.", "ok": false, "foot": [], "fixes": [{"wrong": "have", "right": "had", "partial": false, "at": [7], "point": "시제: 과거 시제 문맥(grew up)과 이어지는 내용이므로 과거형 had 사용", "topic": "시제", "memo": "과거 시제 문맥(grew up)과 이어지는 내용이므로 과거형 had 사용"}]}, {"n": 6, "tag": null, "en": "Then, I learned that many dolphins are in dangerous.", "ko": "그러다 나는 많은 돌고래들이 위험에 처해 있다는 것을 알았다.", "ok": false, "foot": [], "fixes": [{"wrong": "dangerous", "right": "danger", "partial": false, "at": [8], "point": "어휘: '위험에 처한'이라는 표현은 in danger(전치사+명사) -- dangerous는 형용사라 전치사 in 뒤에 바로 쓸 수 없음", "topic": "어휘", "memo": "'위험에 처한'이라는 표현은 in danger(전치사+명사) -- dangerous는 형용사라 전치사 in 뒤에 바로 쓸 수 없음"}]}, {"n": 7, "tag": null, "en": "Some are even endangering.", "ko": "일부는 심지어 멸종 위기에 처해 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "endangering", "right": "endangered", "partial": false, "at": [3], "point": "어휘/분사: endangered(멸종 위기에 처한, 수동의 의미) vs endangering(위태롭게 하는, 능동의 의미) -- 주어가 위험한 상태에 처한 것이므로 endangered 사용", "topic": "어휘/분사", "memo": "endangered(멸종 위기에 처한, 수동의 의미) vs endangering(위태롭게 하는, 능동의 의미) -- 주어가 위험한 상태에 처한 것이므로 endangered 사용"}]}, {"n": 8, "tag": null, "en": "I thought I should to do something.", "ko": "나는 무언가를 해야겠다고 생각했다.", "ok": false, "foot": [], "fixes": [{"wrong": "should to do", "right": "should do", "partial": false, "at": [3], "point": "조동사: should 뒤에는 동사원형이 오므로 to 없이 do 사용", "topic": "조동사", "memo": "should 뒤에는 동사원형이 오므로 to 없이 do 사용"}]}, {"n": 9, "tag": null, "en": "So, I search the Internet and found a NGO, Dolphin Lovers.", "ko": "그래서 나는 인터넷을 검색하다가 NGO인 Dolphin Lovers를 찾았다.", "ok": false, "foot": [], "fixes": [{"wrong": "search", "right": "searched", "partial": false, "at": [2], "point": "시제/병렬구조: found와 대등하게 연결되는 과거형 동사이므로 searched 사용", "topic": "시제/병렬구조", "memo": "found와 대등하게 연결되는 과거형 동사이므로 searched 사용"}, {"wrong": "a", "right": "an", "partial": false, "at": [7], "point": "관사: NGO는 모음 발음[en]으로 시작하므로 부정관사 an 사용", "topic": "관사", "memo": "NGO는 모음 발음[en]으로 시작하므로 부정관사 an 사용"}]}, {"n": 10, "tag": null, "en": "It does various activities such as cleaning up beaches and help dolphins.", "ko": "이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "help", "right": "helping", "partial": false, "at": [10], "point": "병렬구조: cleaning과 대등하게 연결되는 동명사이므로 helping 사용", "topic": "병렬구조", "memo": "cleaning과 대등하게 연결되는 동명사이므로 helping 사용"}]}, {"n": 11, "tag": null, "en": "After some thought, I joined them today.", "ko": "고민 끝에 나는 오늘 그곳에 가입했다.", "ok": false, "foot": [], "fixes": [{"wrong": "them", "right": "it", "partial": false, "at": [5], "point": "대명사: 단체(Dolphin Lovers)를 가리킬 때는 단수 대명사 it 사용 (them은 복수 대상에 사용)", "topic": "대명사", "memo": "단체(Dolphin Lovers)를 가리킬 때는 단수 대명사 it 사용 (them은 복수 대상에 사용)"}]}, {"n": 12, "tag": "JAN 20", "en": "Many dolphins get sick or even die because plastic waste and fishing nets, so cleaning up beaches are important.", "ko": "많은 돌고래들이 플라스틱 쓰레기와 어망 때문에 병에 걸리거나 심지어 죽기도 하므로, 해변을 청소하는 것은 중요하다.", "ok": false, "foot": [], "fixes": [{"wrong": "because", "right": "because of", "partial": false, "at": [7], "point": "어휘: 뒤에 명사(구)가 오므로 because of 사용 (because는 뒤에 주어+동사가 옴)", "topic": "어휘", "memo": "뒤에 명사(구)가 오므로 because of 사용 (because는 뒤에 주어+동사가 옴)"}, {"wrong": "are important", "right": "is important", "partial": false, "at": [17], "point": "수일치: 동명사구(Cleaning up beaches)가 주어이면 단수 취급하여 is 사용", "topic": "수일치", "memo": "동명사구(Cleaning up beaches)가 주어이면 단수 취급하여 is 사용"}]}, {"n": 13, "tag": null, "en": "There was a beach cleanup party today, and I took part of it.", "ko": "오늘 해변 청소 모임이 있었고, 나는 그 모임에 참가했다.", "ok": false, "foot": ["1cleanup 청소, 정화"], "fixes": [{"wrong": "took part of it", "right": "took part in it", "partial": false, "at": [9], "point": "어휘/관용표현: take part in ~(~에 참가하다)이 올바른 표현 (part of가 아님)", "topic": "어휘/관용표현", "memo": "take part in ~(~에 참가하다)이 올바른 표현 (part of가 아님)"}]}, {"n": 14, "tag": null, "en": "Cleaning up the beach was not easy, but I enjoy it.", "ko": "해변을 청소하는 일이 est", "partial": false, "at": [1], "point": "최상급: 여러 프로젝트 중 '가장 최근의'라는 의미이므로 최상급 latest 사용 (late-later-latest)", "topic": "최상급", "memo": "여러 프로젝트 중 '가장 최근의'라는 의미이므로 최상급 latest 사용 (late-later-latest)"}]}, {"n": 20, "tag": null, "en": "For this, both Halla and Olle first needs to learn some skills.", "ko": "이를 위해 한라와 올레 둘 다 먼저 몇 가지 기술을 배워야 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "needs", "right": "need", "partial": false, "at": [7], "point": "both A and B: both A and B는 복수 취급하므로 동사원형 need 사용", "topic": "both A and B", "memo": "both A and B는 복수 취급하므로 동사원형 need 사용"}]}, {"n": 21, "tag": null, "en": "They will need them survive in wild.", "ko": "그들은 야생에서 살아남기 위해 이 기술들이 필요할 것이다.", "ok": false, "foot": [], "fixes": [{"wrong": "survive", "right": "to survive", "partial": false, "at": [4], "point": "to부정사의 목적격보어: need+목적어+to부정사 구조이므로 to survive 사용", "topic": "to부정사의 목적격보어", "memo": "need+목적어+to부정사 구조이므로 to survive 사용"}, {"wrong": "wild", "right": "the wild", "partial": false, "at": [6], "point": "관사: '야생에서'라는 의미의 관용표현은 in the wild (정관사 필요)", "topic": "관사", "memo": "'야생에서'라는 의미의 관용표현은 in the wild (정관사 필요)"}]}, {"n": 22, "tag": null, "en": "I really wanted being part of the project.", "ko": "나는 그 프로젝트에 정말 참여하고 싶었다.", "ok": false, "foot": [], "fixes": [{"wrong": "wanted being", "right": "wanted to be", "partial": false, "at": [2], "point": "동명사 vs to부정사: want는 목적어로 to부정사를 취함 (동명사 불가)", "topic": "동명사 vs to부정사", "memo": "want는 목적어로 to부정사를 취함 (동명사 불가)"}]}, {"n": 23, "tag": null, "en": "Luckily, I got a chance.", "ko": "다행히 나는 그 기회를 얻었다.", "ok": false, "foot": [], "fixes": [{"wrong": "a chance", "right": "the chance", "partial": false, "at": [3], "point": "관사: 앞에서 언급된 특정한 기회를 가리키므로 정관사 the 사용", "topic": "관사", "memo": "앞에서 언급된 특정한 기회를 가리키므로 정관사 the 사용"}]}, {"n": 24, "tag": null, "en": "I just run some errands in the training class today, but the experience made me so exciting.", "ko": "나는 오늘 훈련 수업에서 그저 몇 가지 심부름을 했을 뿐이지만, 그 경험은 나를 매우 신나게 했다.", "ok": false, "foot": ["1errands 심부름"], "fixes": [{"wrong": "run", "right": "ran", "partial": false, "at": [2], "point": "시제/불규칙동사: 과거 시제 문맥이므로 run의 과거형 ran 사용 (run-ran-run)", "topic": "시제/불규칙동사", "memo": "과거 시제 문맥이므로 run의 과거형 ran 사용 (run-ran-run)"}, {"wrong": "exciting", "right": "excited", "partial": false, "at": [16], "point": "분사형용사: made+목적어+목적격보어에서 감정을 느끼는 대상(me)에는 excited 사용 (exciting은 감정을 유발하는 대상에 사용)", "topic": "분사형용사", "memo": "made+목적어+목적격보어에서 감정을 느끼는 대상(me)에는 excited 사용 (exciting은 감정을 유발하는 대상에 사용)"}]}, {"n": 25, "tag": "APR 22", "en": "Today, Halla and Olle went back to the sea.", "ko": "오늘 한라와 올레가 바다로 돌아갔다.", "ok": true, "foot": [], "fixes": []}, {"n": 26, "tag": null, "en": "There was a small ceremony, and all the members of Dolphin Lovers was there.", "ko": "작은 기념식이 있었고, Dolphin Lovers의 모든 회원들이 그곳에 있었다.", "ok": false, "foot": ["1ceremony 기념식, 의식"], "fixes": [{"wrong": "was", "right": "were", "partial": false, "at": [12], "point": "수일치: 주어 all the members(복수)에 맞춰 동사 were 사용", "topic": "수일치", "memo": "주어 all the members(복수)에 맞춰 동사 were 사용"}]}, {"n": 27, "tag": null, "en": "The ceremony made us quite emotionally.", "ko": "그 기념식은 우리를 매우 울컥하게 했다.", "ok": false, "foot": [], "fixes": [{"wrong": "emotionally", "right": "emotional", "partial": false, "at": [5], "point": "5형식: made+목적어(us)+목적격보어 자리에는 형용사 emotional 사용 (부사 emotionally 불가)", "topic": "5형식", "memo": "made+목적어(us)+목적격보어 자리에는 형용사 emotional 사용 (부사 emotionally 불가)"}]}, {"n": 28, "tag": null, "en": "In fact, I cryed a little.", "ko": "사실, 나는 조금 울었다.", "ok": false, "foot": [], "fixes": [{"wrong": "cryed", "right": "cried", "partial": false, "at": [3], "point": "불규칙동사 철자: 자음+y로 끝나는 동사(cry)는 y를 i로 바꾸고 -ed를 붙여 cried", "topic": "불규칙동사 철자", "memo": "자음+y로 끝나는 동사(cry)는 y를 i로 바꾸고 -ed를 붙여 cried"}]}, {"n": 29, "tag": null, "en": "Now I cannot see Halla and Olle no more!", "ko": "이제 나는 한라와 올레를 더는 볼 수 없다!", "ok": false, "foot": [], "fixes": [{"wrong": "no more", "right": "anymore", "partial": false, "at": [7], "point": "어휘: 부정문에서 '더 이상 ~않다'는 not[cannot] ~ anymore로 표현 (no more와 함께 쓰면 이중부정이 됨)", "topic": "어휘", "memo": "부정문에서 '더 이상 ~않다'는 not[cannot] ~ anymore로 표현 (no more와 함께 쓰면 이중부정이 됨)"}]}, {"n": 30, "tag": null, "en": "However, I was very happier at the same time.", "ko": "하지만 나는 동시에 매우 행복했다.", "ok": false, "foot": [], "fixes": [{"wrong": "happier", "right": "happy", "partial": false, "at": [4], "point": "비교급: very는 비교급을 수식할 수 없으므로 단순히 '매우 행복한' 상태를 나타낼 때는 원급 happy 사용", "topic": "비교급", "memo": "very는 비교급을 수식할 수 없으므로 단순히 '매우 행복한' 상태를 나타낼 때는 원급 happy 사용"}]}, {"n": 31, "tag": null, "en": "After 10 years of hardly life in an aquarium, now all sea is their home.", "ko": "수족관에서의 10년간의 힘든 삶 후에, 이제 모든 바다가 그들의 집이다.", "ok": false, "foot": [], "fixes": [{"wrong": "hardly", "right": "hard", "partial": false, "at": [4], "point": "어휘: hardly(부사, 거의 ~않다)와 hard(형용사, 힘든) 혼동 -- life를 꾸미는 형용사 hard 필요", "topic": "어휘", "memo": "hardly(부사, 거의 ~않다)와 hard(형용사, 힘든) 혼동 -- life를 꾸미는 형용사 hard 필요"}, {"wrong": "all sea", "right": "all the sea", "partial": false, "at": [10], "point": "관사: '모든 바다'라는 특정한 의미를 나타낼 때는 정관사 the가 필요 (all the sea)", "topic": "관사", "memo": "'모든 바다'라는 특정한 의미를 나타낼 때는 정관사 the가 필요 (all the sea)"}]}, {"n": 32, "tag": null, "en": "“Live free and happily ever after!” I shouted and wave goodbye to them.", "ko": "“자유롭고 행복하게 오래오래 살기를!” 나는 외치며 그들에게 손을 흔들어 작별 인사를 했다.", "ok": false, "foot": [], "fixes": [{"wrong": "free", "right": "freely", "partial": false, "at": [1], "point": "병렬구조/부사: 동사 live를 꾸미는 부사이므로 happily와 병렬을 이루는 freely 사용 (free는 형용사)", "topic": "병렬구조/부사", "memo": "동사 live를 꾸미는 부사이므로 happily와 병렬을 이루는 freely 사용 (free는 형용사)"}, {"wrong": "wave", "right": "waved", "partial": false, "at": [9], "point": "시제/병렬구조: shouted와 대등하게 연결되는 과거형 동사이므로 waved 사용", "topic": "시제/병렬구조", "memo": "shouted와 대등하게 연결되는 과거형 동사이므로 waved 사용"}]}];var PP=[["You can work with NGOs as a teenager.", "너는 십 대 청소년으로서 NGO와 함께 활동할 수 있다.", 0], ["It is a great way to learn about social issues and make the world better.", "그것은 사회 문제에 대해 배우고 세상을 더 좋게 만드는 좋은 방법이다.", 0], ["Are you interested?", "너는 관심이 있니?", 0], ["Then, read Inho's blog below, and it will give you many ideas.", "그렇다면 아래에서 인호의 블로그를 읽어봐, 그러면 그것이 너에게 많은 아이디어를 줄 거야.", 0], ["I grew up in Jeju-do, so I had many chances to see dolphins.", "나는 제주도에서 자라서 돌고래를 볼 기회가 많았다.", 0], ["Then, I learned that many dolphins are in danger.", "그러다 나는 많은 돌고래들이 위험에 처해 있다는 것을 알았다.", 0], ["Some are even endangered.", "일부는 심지어 멸종 위기에 처해 있다.", 0], ["I thought I should do something.", "나는 무언가를 해야겠다고 생각했다.", 0], ["So, I searched the Internet and found an NGO, Dolphin Lovers.", "그래서 나는 인터넷을 검색하다가 NGO인 Dolphin Lovers를 찾았다.", 0], ["It does various activities such as cleaning up beaches and helping dolphins.", "이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다.", 0], ["After some thought, I joined it today.", "고민 끝에 나는 오늘 그곳에 가입했다.", 0], ["Many dolphins get sick or even die because of plastic waste and fishing nets, so cleaning up beaches is important.", "많은 돌고래들이 플라스틱 쓰레기와 어망 때문에 병에 걸리거나 심지어 죽기도 하므로, 해변을 청소하는 것은 중요하다.", 0], ["There was a beach cleanup party today, and I took part in it.", "오늘 해변 청소 모임이 있었고, 나는 그 모임에 참가했다.", 0], ["Cleaning up the beach was not easy, but I enjoyed it.", "해변을 청소하는 일이 쉽지는 않았지만 나는 즐거웠다.", 0], ["Oh, I saw Aunt Sumi there.", "아, 나는 그곳에서 수미 이모를 만났다.", 0], ["She is also a member of Dolphin Lovers.", "그녀도 Dolphin Lovers의 회원이다.", 0], ["What a small world!!", "세상 참 좁다!", 0], ["This afternoon, I took part in a training class for Halla and Olle, two dolphins in an aquarium in Jeju-do.", "오늘 오후에 나는 제주도의 한 수족관에 있는 돌고래 두 마리, 한라와 올레의 훈련 수업에 참여했다.", 0], ["The latest project of Dolphin Lovers is to return them to the sea.", "Dolphin Lovers의 최근 프로젝트는 그들을 바다로 돌려보내는 것이다.", 0], ["For this, both Halla and Olle first need to learn some skills.", "이를 위해 한라와 올레 둘 다 먼저 몇 가지 기술을 배워야 한다.", 0], ["They will need them to survive in the wild.", "그들은 야생에서 살아남기 위해 이 기술들이 필요할 것이다.", 0], ["I really wanted to be part of the project.", "나는 그 프로젝트에 정말 참여하고 싶었다.", 0], ["Luckily, I got the chance.", "다행히 나는 그 기회를 얻었다.", 0], ["I just ran some errands in the training class today, but the experience made me so excited.", "나는 오늘 훈련 수업에서 그저 몇 가지 심부름을 했을 뿐이지만, 그 경험은 나를 매우 신나게 했다.", 0], ["Today, Halla and Olle went back to the sea.", "오늘 한라와 올레가 바다로 돌아갔다.", 0], ["There was a small ceremony, and all the members of Dolphin Lovers were there.", "작은 기념식이 있었고, Dolphin Lovers의 모든 회원들이 그곳에 있었다.", 0], ["The ceremony made us quite emotional.", "그 기념식은 우리를 매우 울컥하게 했다.", 0], ["In fact, I cried a little.", "사실, 나는 조금 울었다.", 0], ["Now I cannot see Halla and Olle anymore!", "이제 나는 한라와 올레를 더는 볼 수 없다!", 0], ["However, I was very happy at the same time.", "하지만 나는 동시에 매우 행복했다.", 0], ["After 10 years of hard life in an aquarium, now all the sea is their home.", "수족관에서의 10년간의 힘든 삶 후에, 이제 모든 바다가 그들의 집이다.", 0], ["“Live freely and happily ever after!” I shouted and waved goodbye to them.", "“자유롭고 행복하게 오래오래 살기를!” 나는 외치며 그들에게 손을 흔들어 작별 인사를 했다.", 0]];var RNUM=4;var TITLE_EN="Live Freely and Happily Ever After!";var PASS_EN=["Live Freely and Happily Ever After!", "You can work with NGOs as a teenager. It is a great way to learn about social issues and make the world better. Are you interested? Then, read Inho's blog below, and it will give you many ideas.", "I grew up in Jeju-do, so I had many chances to see dolphins. Then, I learned that many dolphins are in danger. Some are even endangered. I thought I should do something. So, I searched the Internet and found an NGO, Dolphin Lovers. It does various activities such as cleaning up beaches and helping dolphins. After some thought, I joined it today.", "Many dolphins get sick or even die because of plastic waste and fishing nets, so cleaning up beaches is important. There was a beach cleanup party today, and I took part in it. Cleaning up the beach was not easy, but I enjoyed it. Oh, I saw Aunt Sumi there. She is also a member of Dolphin Lovers. What a small world!!", "This afternoon, I took part in a training class for Halla and Olle, two dolphins in an aquarium in Jeju-do. The latest project of Dolphin Lovers is to return them to the sea. For this, both Halla and Olle first need to learn some skills. They will need them to survive in the wild. I really wanted to be part of the project. Luckily, I got the chance. I just ran some errands in the training class today, but the experience made me so excited.", "Today, Halla and Olle went back to the sea. There was a small ceremony, and all the members of Dolphin Lovers were there. The ceremony made us quite emotional. In fact, I cried a little. Now I cannot see Halla and Olle anymore! However, I was very happy at the same time. After 10 years of hard life in an aquarium, now all the sea is their home. “Live freely and happily ever after!” I shouted and waved goodbye to them."];var PASS_KO=["자유롭고 행복하게 오래오래 살기를!", "너는 십 대 청소년으로서 NGO와 함께 활동할 수 있다. 그것은 사회 문제에 대해 배우고 세상을 더 좋게 만드는 좋은 방법이다. 너는 관심이 있니? 그렇다면 아래에서 인호의 블로그를 읽어봐, 그러면 그것이 너에게 많은 아이디어를 줄 거야.", "나는 제주도에서 자라서 돌고래를 볼 기회가 많았다. 그러다 나는 많은 돌고래들이 위험에 처해 있다는 것을 알았다. 일부는 심지어 멸종 위기에 처해 있다. 나는 무언가를 해야겠다고 생각했다. 그래서 나는 인터넷을 검색하다가 NGO인 Dolphin Lovers를 찾았다. 이 단체는 해변 청소하기와 돌고래 돕기 같은 다양한 활동을 한다. 고민 끝에 나는 오늘 그곳에 가입했다.", "많은 돌고래들이 플라스틱 쓰레기와 어망 때문에 병에 걸리거나 심지어 죽기도 하므로, 해변을 청소하는 것은 중요하다. 오늘 해변 청소 모임이 있었고, 나는 그 모임에 참가했다. 해변을 청소하는 일이 쉽지는 않았지만 나는 즐거웠다. 아, 나는 그곳에서 수미 이모를 만났다. 그녀도 Dolphin Lovers의 회원이다. 세상 참 좁다!", "오늘 오후에 나는 제주도의 한 수족관에 있는 돌고래 두 마리, 한라와 올레의 훈련 수업에 참여했다. Dolphin Lovers의 최근 프로젝트는 그들을 바다로 돌려보내는 것이다. 이를 위해 한라와 올레 둘 다 먼저 몇 가지 기술을 배워야 한다. 그들은 야생에서 살아남기 위해 이 기술들이 필요할 것이다. 나는 그 프로젝트에 정말 참여하고 싶었다. 다행히 나는 그 기회를 얻었다. 나는 오늘 훈련 수업에서 그저 몇 가지 심부름을 했을 뿐이지만, 그 경험은 나를 매우 신나게 했다.", "오늘 한라와 올레가 바다로 돌아갔다. 작은 기념식이 있었고, Dolphin Lovers의 모든 회원들이 그곳에 있었다. 그 기념식은 우리를 매우 울컥하게 했다. 사실, 나는 조금 울었다. 이제 나는 한라와 올레를 더는 볼 수 없다! 하지만 나는 동시에 매우 행복했다. 수족관에서의 10년간의 힘든 삶 후에, 이제 모든 바다가 그들의 집이다. “자유롭고 행복하게 오래오래 살기를!” 나는 외치며 그들에게 손을 흔들어 작별 인사를 했다."];var DG=[{"dlg": [["M", "You look a little worried, Somi.", "소미야, 너 좀 걱정스러워 보이는구나."], ["G", "Well, I just joined the NGO VANK. Remember? You once talked about it in class.", "음, 저 방금 VANK라는 NGO에 가입했어요. 기억하세요? 선생님께서 예전에 수업 시간에 그곳에 대해 말씀하셨잖아요."], ["M", "Of course, I do. Its main goal is to introduce Korea to the world.", "물론 기억하지. 그곳의 주된 목표는 한국을 세계에 알리는 거야."], ["G", "You know, I’m interested in Korean history and culture.", "아시다시피, 저는 한국의 역사와 문화에 관심이 있어요."], ["M", "Then, it’s the perfect choice for you. So, what are you worried about?", "그렇다면 너에게 딱 맞는 선택이구나. 그런데 무엇이 걱정이니?"], ["G", "Well, it’s just … my English is not good enough.", "음, 그냥… 제 영어 실력이 충분히 좋지 않아서요."], ["M", "Oh, don’t worry, Somi. Your English is OK. You’ll do fine.", "오, 걱정하지 마, 소미야. 네 영어는 괜찮아. 넌 잘할 거야."], ["G", "Do you really think so?", "정말 그렇게 생각하세요?"], ["M", "Sure. I just hope you have a chance to learn more about Korean history.", "물론이지. 나는 그저 네가 한국 역사에 대해 더 배울 기회를 갖길 바란다."], ["G", "Thanks, Mr. Hopkins. I’ll do my best.", "감사합니다, Hopkins 선생님. 최선을 다할게요."]], "qs": [{"n": 1, "q": "위 대화의 내용과 일치하지 않는 것은?", "o": ["소미는 방금 VANK라는 NGO에 가입했다.", "VANK의 목적은 한국을 세계에 알리는 것이다.", "소미는 한국 역사와 문화에 관심이 있다.", "Hopkins 선생님은 소미가 VANK에 가입한 것은 딱 맞는 선택이었다고 생각한다.", "소미는 영어 실력에 자신감을 보인다."], "a": 4, "ans": "소미는 영어 실력에 자신감을 보인다.", "evs": [["G: Well, it’s just … my English is not good enough.", "음, 그냥… 제 영어 실력이 충분히 좋지 않아서요."], ["M: Oh, don’t worry, Somi. Your English is OK. You’ll do fine.", "오, 걱정하지 마, 소미야. 네 영어는 괜찮아. 넌 잘할 거야."]], "ev": ["G: Well, it’s just … my English is not good enough.", "음, 그냥… 제 영어 실력이 충분히 좋지 않아서요."], "memo": ["G: Well, it’s just … my English is not good enough.  (음, 그냥… 제 영어 실력이 충분히 좋지 않아서요.)", "M: Oh, don’t worry, Somi. Your English is OK. You’ll do fine.  (오, 걱정하지 마, 소미야. 네 영어는 괜찮아. 넌 잘할 거야.)"]}]}, {"dlg": [["B", "Hello, teens! Do you want to make the world better?", "안녕하세요, 십 대 여러분! 세상을 더 좋게 만들고 싶나요?"], ["B", "Then, join Green Teens!", "그렇다면 Green Teens에 가입하세요!"], ["B", "Our goal is to stop global warming.", "우리의 목표는 지구 온난화를 막는 것입니다."], ["B", "For this, we do various activities.", "이를 위해 우리는 다양한 활동을 합니다."], ["B", "For example, function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})}

  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});

}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭! · 이대로 받아적기</h2><div class="hint">해설은 읽기만. 노트에는 아래 줄만 그대로 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});

function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
