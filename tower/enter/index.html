<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="google" content="notranslate">
<meta name="robots" content="noindex,nofollow">
<title>입장</title>
<style>
  :root{--ink:#1f2328;--sub:#667085;--line:#e3e5e8;--bg:#f5f4f0;--pri:#2b5cab;--warn:#b4402c}
  *{box-sizing:border-box}
  body{font-family:system-ui,-apple-system,"Malgun Gothic",sans-serif;background:var(--bg);color:var(--ink);margin:0;line-height:1.5}
  .wrap{max-width:480px;margin:0 auto;padding:40px 16px 60px}
  h1{font-size:20px;margin:0 0 14px}
  .card{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px;margin-bottom:12px}
  input{width:100%;font:inherit;font-size:18px;padding:12px;border:1px solid var(--line);border-radius:8px}
  button{font:inherit;font-size:17px;width:100%;padding:12px;border-radius:8px;border:1px solid var(--pri);background:var(--pri);color:#fff;margin-top:10px;cursor:pointer}
  button.sub{background:#fff;color:var(--ink);border-color:var(--line)}
  button:disabled{opacity:.5}
  #err{color:var(--warn);min-height:22px;margin-top:8px;font-size:15px}
  .k{color:var(--sub);font-size:13px}
  .row{display:flex;justify-content:space-between;gap:10px;padding:9px 0;border-top:1px solid var(--line)}
  .row:first-child{border-top:0}
  .it{cursor:pointer}
  .it.done .t{text-decoration:line-through;color:var(--sub)}
  .it.off{cursor:default}
  #tmsg{color:var(--warn);font-size:14px;min-height:0;margin-top:6px}
</style>
</head>
<body>
<div class="wrap">
  <div id="s1">
    <h1>이름</h1>
    <div class="card">
      <input id="nm" autocomplete="off" autocapitalize="off" spellcheck="false">
      <button id="go">들어가기</button>
      <div id="err"></div>
    </div>
  </div>
  <div id="s2" style="display:none">
    <h1 id="who"></h1>
    <div class="card" id="info"></div>
    <div class="card" id="pos"></div>
    <div class="card" id="today" style="display:none"></div>
    <button class="sub" id="out">나가기</button>
  </div>
</div>
<script>
/* tower-enter 261121e — 이름 입력 입장. 위치·카드는 읽기만 하고, 체크 기능이 켜진 학생만 오늘 체크를 서버(tower_c)에 저장한다. 기기에는 아무것도 저장하지 않는다. */
(function(){
var KEY="AIzaSyC88G-OjMJOqVqnIVqunzh7fvk91wtKKnA";
var BASE="https://firestore.googleapis.com/v1/projects/h-roadmap/databases/(default)/documents/tower_s/";
function $(i){return document.getElementById(i);}
function norm(s){return String(s||"").normalize("NFC").replace(/\s+/g,"");}
function docId(name){
  var b=new TextEncoder().encode("tower|"+norm(name));
  return crypto.subtle.digest("SHA-256",b).then(function(h){
    return Array.prototype.map.call(new Uint8Array(h),function(x){return ("0"+x.toString(16)).slice(-2);}).join("").slice(0,20);
  });
}
function val(f){
  if(!f)return null;
  if("stringValue" in f)return f.stringValue;
  if("integerValue" in f)return Number(f.integerValue);
  if("booleanValue" in f)return f.booleanValue;
  if("nullValue" in f)return null;
  if("arrayValue" in f)return (f.arrayValue.values||[]).map(val);
  if("mapValue" in f){var o={},m=f.mapValue.fields||{};for(var k in m)o[k]=val(m[k]);return o;}
  return null;
}
function esc(s){return String(s==null?"":s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];});}
var CBASE="https://firestore.googleapis.com/v1/projects/h-roadmap/databases/(default)/documents/board/";
/* 카드 읽기: 기존 카드 시스템(board)의 우선순위를 그대로 따른다. 이 화면은 카드를 읽기만 한다. */
var CARDDOC="2000-01-04|_카드";
function cPick(CC,cls,slot,name,date){
  var v=CC.day&&CC.day[date]&&CC.day[date][name]&&CC.day[date][name][slot];if(v)return {id:v,src:"이 날만"};
  var rg=CC.rg||[];for(var i=rg.length-1;i>=0;i--){var r=rg[i];if(r.slot===slot&&date>=r.from&&date<=r.to&&r.names.indexOf(name)>-1)return {id:r.card,src:"기간 지정"}}
  v=CC.st&&CC.st[name]&&CC.st[name][slot];if(v)return {id:v,src:"개별 지정"};
  v=CC.cls&&CC.cls[cls]&&CC.cls[cls][slot];if(v)return {id:v,src:"반 기본"};
  return {id:"",src:""};
}
function cItems(CC,cls,slot,name,date){
  var tid=cPick(CC,cls,slot,name,date).id,tp=(tid&&tid!=="-")?CC.cards.filter(function(x){return x.id===tid})[0]:null,sk=(CC.st&&CC.st[name]&&CC.st[name].skip)||[];
  var out=(tp&&tp.items)?tp.items.filter(function(i){return !i.plus}).concat(tp.items.filter(function(i){return i.plus})):[];
  return sk.length?out.filter(function(i){return sk.indexOf(i.id)<0}):out;
}
function cParse(j){
  try{var chk=JSON.parse(j.fields.chk.stringValue),c=JSON.parse(chk.cards.j);return Array.isArray(c.cards)?c:null;}catch(e){return null;}
}
function cIso(d){return d.getFullYear()+"-"+("0"+(d.getMonth()+1)).slice(-2)+"-"+("0"+d.getDate()).slice(-2);}
var SLN={reg:"정규",fri:"금요일",sat:"토요일",nae:"내신",hw:"숙제",add:"추가 숙제"};
function cSlots(CC,cls,name,date){
  var w=new Date().getDay(),main=w===5?"fri":w===6?"sat":"reg",s;
  if(cItems(CC,cls,"nae",name,date).length)return ["nae"];
  s=[main];["hw","add"].forEach(function(x){if(cItems(CC,cls,x,name,date).length)s.push(x);});
  return s;
}
var CKB="https://firestore.googleapis.com/v1/projects/h-roadmap/databases/(default)/documents/tower_c/";
var CHK={k:{},m:"",u:0},CKON=false,CKID="",CCC=null,CKD=null,wbusy=false,wdirty=false;
function ckDate(){return cIso(new Date()).replace(/-/g,"");}
function hm(){var t=new Date();return ("0"+t.getHours()).slice(-2)+":"+("0"+t.getMinutes()).slice(-2);}
function ckFlush(){
  if(wbusy){wdirty=true;return;}
  wbusy=true;wdirty=false;
  var f={sid:{stringValue:CUR},d:{stringValue:cIso(new Date())},m:{stringValue:CHK.m||""},u:{integerValue:String(CHK.u||0)},k:{mapValue:{fields:{}}}};
  for(var x in CHK.k)f.k.mapValue.fields[x]={stringValue:CHK.k[x]};
  var q="updateMask.fieldPaths=sid&updateMask.fieldPaths=d&updateMask.fieldPaths=m&updateMask.fieldPaths=u&updateMask.fieldPaths=k&key="+KEY;
  fetch(CKB+CKID+"?"+q,{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({fields:f})}).then(function(r){
    if(!r.ok)throw 1;$("tmsg").textContent="";
  }).catch(function(){$("tmsg").textContent="저장이 안 됐습니다. 연결을 확인하고 다시 눌러 주세요";wdirty=false;}).then(function(){wbusy=false;if(wdirty)ckFlush();});
}
function drawToday(d){
  var CC=CCC;if(!CC)return;
  var date=cIso(new Date()),sl=cSlots(CC,d.cls,d.name,date).slice(),h="";
  if(CKON&&CHK.m&&sl.indexOf(CHK.m)>0){sl.splice(sl.indexOf(CHK.m),1);sl.unshift(CHK.m);}
  sl.forEach(function(s){
    var it=cItems(CC,d.cls,s,d.name,date);if(!it.length)return;
    h+='<div class="k" style="margin-top:6px">'+esc(SLN[s]||s)+'</div>'+it.map(function(i){
      var key=s+"~"+i.id,tm=CHK.k[key];
      return '<div class="row it'+(CKON?"":" off")+(tm?" done":"")+'" data-s="'+esc(s)+'" data-i="'+esc(i.id)+'"><span class="t">'+esc(i.t)+'</span><span class="k">'+esc(tm||i.sub||"")+'</span></div>';
    }).join("");
  });
  if(!h){$("today").style.display="none";return;}
  var t=new Date(),W=["일","월","화","수","목","금","토"];
  $("today").innerHTML='<div style="font-weight:600">오늘 할 일 '+(t.getMonth()+1)+"/"+t.getDate()+"("+W[t.getDay()]+")"+'</div>'+h+'<div id="tmsg"></div>';$("today").style.display="";
}
function today(d){
  $("today").style.display="none";CCC=null;CHK={k:{},m:"",u:0};CKON=d.ck===true;CKID=CUR+"_"+ckDate();
  var pc=fetch(CBASE+encodeURIComponent(CARDDOC)+"?key="+KEY).then(function(r){return r.ok?r.json():null;}).then(function(j){return j&&cParse(j);}).catch(function(){return null;});
  var pk=CKON?fetch(CKB+CKID+"?key="+KEY).then(function(r){return r.ok?r.json():null;}).catch(function(){return null;}):Promise.resolve(null);
  Promise.all([pc,pk]).then(function(a){
    if($("who").textContent!==d.name||!a[0])return;
    CCC=a[0];
    if(a[1]&&a[1].fields){var f=a[1].fields,k={},m=(f.k&&f.k.mapValue&&f.k.mapValue.fields)||{};for(var x in m)k[x]=m[x].stringValue;CHK={k:k,m:(f.m&&f.m.stringValue)||"",u:Number((f.u&&f.u.integerValue)||0)};}
    drawToday(d);
  });
}
$("today").onclick=function(ev){
  var r=ev.target.closest(".it");if(!r||!CKON||!CCC)return;
  var s=r.getAttribute("data-s"),key=s+"~"+r.getAttribute("data-i");
  if(CHK.k[key]){delete CHK.k[key];}else{CHK.k[key]=hm();CHK.m=s;}
  CHK.u=Date.now();
  drawToday({cls:CURD.cls,name:CURD.name});ckFlush();
};
var CURD={cls:"",name:""};
function show(d){
  $("who").textContent=d.name;
  $("info").innerHTML='<div class="row"><span class="k">반</span><span>'+esc(d.cls)+'</span></div><div class="row"><span class="k">소속</span><span>'+esc(d.season)+'</span></div>';
  var p=d.pos||[],h="",ov=(d.ov&&typeof d.ov==="object"&&!Array.isArray(d.ov))?d.ov:{},seen={};
  if(!Array.isArray(p))p=[];
  p.forEach(function(x){seen[x.k]=1;var o=ov[x.k];var v=(o&&o.b===x.v)?o.t:x.v;h+='<div class="row"><span>'+esc(x.k)+'</span><span>'+esc(v)+'</span></div>';});
  Object.keys(ov).forEach(function(k){var o=ov[k];if(!seen[k]&&o&&(o.b===""||o.b==null))h+='<div class="row"><span>'+esc(k)+'</span><span>'+esc(o.t)+'</span></div>';});
  var asg=Array.isArray(d.asg)?d.asg:[];
  (d.pend||[]).forEach(function(x){var a=null;asg.forEach(function(q){if(q&&q.p===x)a=q;});h+='<div class="row"><span>'+esc(x)+'</span><span'+(a?'':' class="k"')+'>'+(a?esc("지정: "+a.t):"선생님 지정 대기")+'</span></div>';});
  if(d.sy){var t=new Date(d.sy),W=["일","월","화","수","목","금","토"];h+='<div class="k" style="margin-top:8px">'+(t.getMonth()+1)+"/"+t.getDate()+"("+W[t.getDay()]+") "+("0"+t.getHours()).slice(-2)+":"+("0"+t.getMinutes()).slice(-2)+" 기준</div>";}
  $("pos").innerHTML=h||'<span class="k">연결 준비 중</span>';
  $("s1").style.display="none";$("s2").style.display="";window.scrollTo(0,0);
  CURD={cls:d.cls,name:d.name};today(d);
}
var CUR="";
function enter(){
  var n=norm($("nm").value);if(!n)return;
  $("go").disabled=true;$("err").textContent="";
  docId(n).then(function(id){CUR=id;return fetch(BASE+id+"?key="+KEY);}).then(function(r){
    if(r.ok)return r.json().then(function(j){
      var f=j.fields||{},d={};for(var k in f)d[k]=val(f[k]);
      if(d.status!=="active")throw {nf:1};
      show(d);
    });
    if(r.status===403||r.status===404)throw {nf:1};
    throw {net:1};
  }).catch(function(e){$("err").textContent=e&&e.nf?"이름을 찾을 수 없습니다":"연결이 안 됩니다. 잠시 뒤 다시 해 주세요";}).then(function(){$("go").disabled=false;});
}
$("go").onclick=enter;
$("nm").onkeydown=function(e){if(e.key==="Enter")enter();};
$("out").onclick=function(){$("today").style.display="none";$("nm").value="";$("err").textContent="";$("s2").style.display="none";$("s1").style.display="";window.scrollTo(0,0);};
window.__docId=docId;
})();
</script>
</body>
</html>
