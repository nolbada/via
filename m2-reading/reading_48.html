alking ten dog in the same time.", "ko": "때때로 나는 잔디 위에 누워 사람들이 지나가는 것을 보았다. 한번은 도그 워커가 열 마리의 개를 동시에 산책시키는 것을 보았다.", "ok": false, "foot": [], "fixes": [{"wrong": "dog", "right": "dogs", "partial": false, "at": [20], "point": "명사의 복수형: ten 뒤에는 복수명사 dogs 사용", "topic": "명사의 복수형", "memo": "ten 뒤에는 복수명사 dogs 사용"}, {"wrong": "in", "right": "at", "partial": false, "at": [21], "point": "기본전치사: '동시에'는 at the same time 사용", "topic": "기본전치사", "memo": "'동시에'는 at the same time 사용"}]}, {"n": 6, "tag": null, "en": "It was amazing!", "ko": "정말 놀라웠다!", "ok": true, "foot": [], "fixes": []}, {"n": 7, "tag": null, "en": "After spend time in the park, I often visited a famous bagel shop near the park. It haved more than 20 toppings.", "ko": "나는 공원에서 시간을 보낸 후에 공원 근처의 유명한 베이글 가게에 자주 갔다. 거기에는 20개가 넘는 토핑이 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "spend", "right": "spending", "partial": false, "at": [1], "point": "동명사: 전치사 After 뒤에는 동명사 spending 사용", "topic": "동명사", "memo": "전치사 After 뒤에는 동명사 spending 사용"}, {"wrong": "haved", "right": "had", "partial": false, "at": [17], "point": "불규칙 과거형: have의 과거형은 had (haved 아님)", "topic": "불규칙 과거형", "memo": "have의 과거형은 had (haved 아님)"}]}, {"n": 8, "tag": null, "en": "Among the toppings that I tried, bacon and cheese were my favorites.", "ko": "내가 먹어 본 토핑 중에서, 베이컨과 치즈는 내가 가장 좋아하는 것이었다.", "ok": true, "foot": [], "fixes": []}, {"n": 9, "tag": null, "en": "I enjoyed to visit museums such as the Met and MoMA. They had many famous works of art that I saw in art books.", "ko": "나는 Met과 MoMA 같은 박물관에 가는 것을 즐겼다. 그것들은 내가 미술책에서 보았던 유명한 예술품들을 많이 소장했다.", "ok": false, "foot": [], "fixes": [{"wrong": "to visit", "right": "visiting", "partial": false, "at": [2], "point": "동명사: enjoy 뒤에는 동명사 visiting 사용", "topic": "동명사", "memo": "enjoy 뒤에는 동명사 visiting 사용"}]}, {"n": 10, "tag": null, "en": "At the Met, there were a room full of paintings by Vincent van Gogh.", "ko": "Met에는 Vincent van Gogh가 그린 그림들로 가득 찬 방이 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [4], "point": "be동사의 수일치: a room은 단수: was (were 아님)", "topic": "be동사의 수일치", "memo": "a room은 단수: was (were 아님)"}]}, {"n": 11, "tag": null, "en": "I could not believes that I was looking at his works of art up close. In another rooms, I saw people copying Edgar Degas' paintings.", "ko": "나는 내가 그의 작품들을 가까이에서 보고 있다는 것을 믿을 수 없었다. 다른 방에서는 사람들이 Edgar Degas의 그림을 따라 그리고 있는 것을 보았다.", "ok": false, "foot": [], "fixes": [{"wrong": "believes", "right": "believe", "partial": false, "at": [3], "point": "조동사 뒤 동사원형: could not 뒤에는 동사원형: believe (believes 아님)", "topic": "조동사 뒤 동사원형", "memo": "could not 뒤에는 동사원형: believe (believes 아님)"}, {"wrong": "rooms", "right": "room", "partial": false, "at": [17], "point": "수량 형용사 another: another 뒤에는 단수명사 room 사용", "topic": "수량 형용사 another", "memo": "another 뒤에는 단수명사 room 사용"}]}, {"n": 12, "tag": null, "en": "I also copied one of his paintings, Dancer. It was quite a special experience.", "ko": "나도 그의 그림 중 하나인 <Dancer>를 따라 그렸다. 그것은 매우 특별한 경험이었다.", "ok": true, "foot": [], "fixes": []}, {"n": 13, "tag": null, "en": "Watching The Lion King on Broadway were the most unforgettable moment.", "ko": "브로드웨이에서 <The Lion King>을 관람한 것은 가장 잊지 못할 순간이었다.", "ok": false, "foot": [], "fixes": [{"wrong": "were", "right": "was", "partial": false, "at": [6], "point": "be동사의 수일치: 동명사구 주어는 단수 취급하여 was 사용", "topic": "be동사의 수일치", "memo": "동명사구 주어는 단수 취급하여 was 사용"}]}, {"n": 14, "tag": null, "en": "When I saw the colorfully stage, I felt like I was in the middle of a African jungle.", "ko": "다채로운 무대를 보았을 때, 나는 마치 아프리카 정글 한가운데에 있는 것 같은 기분이 들었다.", "ok": false, "foot": [], "fixes": [{"wrong": "colorfully", "right": "colorful", "partial": false, "at": [4], "point": "형용사와 부사: 명사 stage를 꾸미는 형용사 colorful 사용", "topic": "형용사와 부사", "memo": "명사 stage를 꾸미는 형용사 colorful 사용"}, {"wrong": "a", "right": "an", "partial": false, "at": [15], "point": "관사 a/an: African은 모음 소리로 시작하므로 an", "topic": "관사 a/an", "memo": "African은 모음 소리로 시작하므로 an"}]}, {"n"  Month in New York City", "Last summer, I spent a month at my cousin's place in New York City. Each day I enjoyed the city, and it was an unforgettable experience.", "New York City is famous for its high-rise buildings, but it also has beautiful parks. As my cousin's apartment was near Central Park, I often went there. I attended a free yoga class and rowed a boat on the lake. Sometimes, I lay down on the grass and watched people passing by. I once saw a dog walker walking ten dogs at the same time. It was amazing!", "After spending time in the park, I often visited a famous bagel shop near the park. It had more than 20 toppings. Among the toppings that I tried, bacon and cheese were my favorites.", "I enjoyed visiting museums such as the Met and MoMA. They had many famous works of art that I saw in art books. At the Met, there was a room full of paintings by Vincent van Gogh. I could not believe that I was looking at his works of art up close. In another room, I saw people copying Edgar Degas' paintings. I also copied one of his paintings, Dancer. It was quite a special experience.", "Watching The Lion King on Broadway was the most unforgettable moment. When I saw the colorful stage, I felt like I was in the middle of an African jungle. The actors danced like real animals and sang in perfect harmony. In the last scene, the hero Simba showed his baby lion to the world, and tears rolled down my face. When I came out, huge, colorful signs were shining brightly. At that moment, I knew I would never forget this amazing city."];var PASS_KO=["뉴욕시에서 한 달 살기", "지난여름 나는 뉴욕시의 사촌 집에서 한 달을 보냈다. 매일 나는 그 도시를 즐겼고 그것은 잊지 못할 경험이었다.", "뉴욕시는 고층 건물로 유명하지만, 아름다운 공원들도 있다. 내 사촌의 아파트가 센트럴 파크 근처에 있었기 때문에 나는 자주 거기에 갔다. 나는 무료 요가 수업에 참여했고 호수에서 보트의 노를 저었다. 때때로 나는 잔디 위에 누워 사람들이 지나가는 것을 보았다. 한번은 도그 워커가 열 마리의 개를 동시에 산책시키는 것을 보았다. 정말 놀라웠다!", "나는 공원에서 시간을 보낸 후에 공원 근처의 유명한 베이글 가게에 자주 갔다. 거기에는 20개가 넘는 토핑이 있었다. 내가 먹어 본 토핑 중에서, 베이컨과 치즈는 내가 가장 좋아하는 것이었다.", "나는 Met과 MoMA 같은 박물관에 가는 것을 즐겼다. 그것들은 내가 미술책에서 보았던 유명한 예술품들을 많이 소장했다. Met에는 Vincent van Gogh가 그린 그림들로 가득 찬 방이 있었다. 나는 내가 그의 작품들을 가까이에서 보고 있다는 것을 믿을 수 없었다. 다른 방에서는 사람들이 Edgar Degas의 그림을 따라 그리고 있는 것을 보았다. 나도 그의 그림 중 하나인 <Dancer>를 따라 그렸다. 그것은 매우 특별한 경험이었다.", "브로드웨이에서 <The Lion King>을 관람한 것은 가장 잊지 못할 순간이었다. 다채로운 무대를 보았을 때, 나는 마치 아프리카 정글 한가운데에 있는 것 같은 기분이 들었다. 배우들은 진짜 동물처럼 춤을 췄고 완벽한 조화를 이루어 노래를 불렀다. 마지막 장면에서 주인공 Simba가 자신의 새끼 사자를 세상에 보여 주었는데, 눈물이 내 얼굴을 타고 흘러내렸다. 내가 밖으로 나왔을 때 크고 화려한 광고판들이 밝게 빛나고 있었다. 그 순간 나는 이 멋진 도시를 결코 잊지 못할 것이라는 것을 알았다."];
