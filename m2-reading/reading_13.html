.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Many students has “turtle neck.”", "ko": "많은 학생들이 '거북목'을 가지고 있다.", "ok": false, "foot": ["1turtle neck 거북목"], "fixes": [{"wrong": "has", "right": "have", "partial": false, "at": [2], "point": "수일치: 주어 students(복수)에 맞춰 동사 have 사용", "topic": "수일치", "memo": "주어 students(복수)에 맞춰 동사 have 사용"}]}, {"n": 2, "tag": null, "en": "This happens when their head stick forward.", "ko": "이것은 그들의 머리가 앞으로 나올 때 발생한다.", "ok": false, "foot": [], "fixes": [{"wrong": "stick", "right": "sticks", "partial": false, "at": [5], "point": "수일치: 주어 head(단수)에 맞춰 동사 sticks 사용", "topic": "수일치", "memo": "주어 head(단수)에 맞춰 동사 sticks 사용"}]}, {"n": 3, "tag": null, "en": "It often come from using smartphones, study, or sitting for a long time.", "ko": "그것은 스마트폰을 사용하거나 공부를 하거나 혹은 오랜 시간 동안 앉아 있는 것에서 흔히 비롯된다.", "ok": false, "foot": [], "fixes": [{"wrong": "come", "right": "comes", "partial": false, "at": [2], "point": "수일치: 주어 It(단수)에 맞춰 동사 comes 사용", "topic": "수일치", "memo": "주어 It(단수)에 맞춰 동사 comes 사용"}, {"wrong": "study", "right": "studying", "partial": false, "at": [6], "point": "병렬구조: using, studying, sitting이 모두 동명사로 나열되어야 하므로 studying 사용", "topic": "병렬구조", "memo": "using, studying, sitting이 모두 동명사로 나열되어야 하므로 studying 사용"}]}, {"n": 4, "tag": null, "en": "When you have turtle neck, you may get a neck pain, back pain, or headaches.", "ko": "여러분이 거북목을 가지고 있을 때 여러분은 목 통증, 허리 통증, 또는 두통이 있을 수 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "a neck pain", "right": "neck pain", "partial": false, "at": [8], "point": "어휘/관사: neck pain(통증)은 셀 수 없는 명사이므로 부정관사 a를 붙이지 않음", "topic": "어휘/관사", "memo": "neck pain(통증)은 셀 수 없는 명사이므로 부정관사 a를 붙이지 않음"}]}, {"n": 5, "tag": null, "en": "But don't worry! Here are some easy stretches to help with turtle neck.", "ko": "그러나 걱정하지 마라! 여기 거북목에 도움이 되는 쉬운 스트레칭이 몇 가지 있다.", "ok": true, "foot": [], "fixes": []}, {"n": 6, "tag": "Desk Stretch", "en": "Sit up straight and moves your head slow from side to side.", "ko": "똑바로 앉고 머리를 천천히 좌우로 움직여라.", "ok": false, "foot": [], "fixes": [{"wrong": "moves", "right": "move", "partial": false, "at": [4], "point": "어법: 명령문은 동사원형으로 시작하므로 move 사용 (moves 불가)", "topic": "어법", "memo": "명령문은 동사원형으로 시작하므로 move 사용 (moves 불가)"}, {"wrong": "slow", "right": "slowly", "partial": false, "at": [7], "point": "어휘/품사: 동사를 수식하려면 부사 slowly 사용 (slow는 형용사)", "topic": "어휘/품사", "memo": "동사를 수식하려면 부사 slowly 사용 (slow는 형용사)"}]}, {"n": 7, "tag": null, "en": "Put your right hand in the left side of your head. Then gentle pull your head to the right.", "ko": "오른손을 머리의 왼쪽에 두어라. 그러고 나서 머리를 오른쪽으로 부드럽게 당겨라.", "ok": false, "foot": [], "fixes": [{"wrong": "in", "right": "on", "partial": false, "at": [4], "point": "전치사: '~의 왼쪽에'는 on the left side 사용", "topic": "전치사", "memo": "'~의 왼쪽에'는 on the left side 사용"}, {"wrong": "gentle", "right": "gently", "partial": false, "at": [12], "point": "어휘/품사: 동사 pull을 수식하려면 부사 gently 사용 (gentle은 형용사)", "topic": "어휘/품사", "memo": "동사 pull을 수식하려면 부사 gently 사용 (gentle은 형용사)"}]}, {"n": 8, "tag": null, "en": "Hold during 5 seconds. Repeats on your left side.", "ko": "5초 동안 유지하라. 왼쪽에 반복하라.", "ok": false, "foot": [], "fixes": [{"wrong": "during", "right": "for", "partial": false, "at": [1], "point": "전치사: 구체적인 숫자로 표현된 지속 시간 앞에는 for 사용 (during은 특정 기간을 나타내는 명사 앞)", "topic": "전치사", "memo": "구체적인 숫자로 표현된 지속 시간 앞에는 for 사용 (during은 특정 기간을 나타내는 명사 앞)"}, {"wrong": "Repeats", "right": "Repeat", "partial": false, "at": [4], "point": "어법: 명령문은 동사원형으로 시작하므로 Repeat 사용", "topic": "어법", "memo": "명령문은 동사원형으로 시작하므로 Repeat 사용"}]}, {"n": 9, "tag": null, "en": "Finally, put your hands together and holding your chin with your thumbs.", "ko": "마지막으로, 두 손을 함께 모으고 엄지손가락으로 턱을 잡아라.", "ok": false, "foot": ["1thumb 엄지손가락"], "fixes": [{"wrong": "holding", "right": "hold", "partial": false, "at": [6], "point": "병렬구조: put과 and로 연결되므로 동사원형 hold 사용", "topic": "병렬구조", "memo": "put과 and로 연결되므로 동사원형 hold 사용"}]}, {"n": 10, "tag": null, "en": "Pushed your head back slowly.", "ko": "머리를 천천히 뒤로 밀어라.", "ok": false, "foot": [], " om using smartphones, studying, or sitting for a long time. When you have turtle neck, you may get neck pain, back pain, or headaches. But don't worry! Here are some easy stretches to help with turtle neck.", "Sit up straight and move your head slowly from side to side. Put your right hand on the left side of your head. Then gently pull your head to the right. Hold for 5 seconds. Repeat on your left side. Finally, put your hands together and hold your chin with your thumbs. Push your head back slowly. Hold for 10 seconds. If you do this set of stretches, you'll feel better.", "Stand and spread your feet. Bend your arms to make a W shape. Then lean your head backward. Look up at a 45-degree angle. Hold for 10 seconds. This stretch is great for your neck and shoulders.", "Lie on your bed with your head at the edge. Let your head hang off the bed. Hold for 60 seconds. Don't do this for longer than 60 seconds. It can make you feel dizzy. This stretch helps relax your neck and back. One thing is more important than stretching: good habits in everyday life. Don't look down at your smartphone or computer monitor. Try to keep it at eye level. When you are sitting, sit up straight and keep your feet on the floor. If you are studying for a long time, you should stretch every 50 minutes. Good habits keep your neck healthy and strong."];var PASS_KO=["당신의 목은 괜찮은가요?", "많은 학생들이 '거북목'을 가지고 있다. 이것은 그들의 머리가 앞으로 나올 때 발생한다. 그것은 스마트폰을 사용하거나 공부를 하거나 혹은 오랜 시간 동안 앉아 있는 것에서 흔히 비롯된다. 여러분이 거북목을 가지고 있을 때 여러분은 목 통증, 허리 통증, 또는 두통이 있을 수 있다. 그러나 걱정하지 마라! 여기 거북목에 도움이 되는 쉬운 스트레칭이 몇 가지 있다.", "똑바로 앉고 머리를 천천히 좌우로 움직여라. 오른손을 머리의 왼쪽에 두어라. 그러고 나서 머리를 오른쪽으로 부드럽게 당겨라. 5초 동안 유지하라. 왼쪽에 반복하라. 마지막으로, 두 손을 함께 모으고 엄지손가락으로 턱을 잡아라. 머리를 천천히 뒤로 밀어라. 10초 동안 유지하라. 만약 이 스트레칭 세트를 하면, 여러분은 더 나아질 것이다.", "서서 두 발을 벌려라. W 모양을 만들기 위해 팔을 구부려라. 그런 다음 머리를 뒤로 젖혀라. 45도 각도로 위를 바라보라. 10초 동안 유지하라. 이 스트레칭은 목과 어깨에 좋다.", "머리를 침대의 가장자리에 두고 누워라. 머리를 침대 밖으로 늘어뜨려라. 60초 동안 유지하라. 이것을 60초 이상 하지 마라. 이것은 어지러움을 느끼게 만들 수 있다. 이 스트레칭은 목과 등을 이완하는 데 도움
