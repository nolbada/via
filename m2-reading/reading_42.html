spect their efforts.", "ko": "대신 다른 사람을 위해 기뻐하고 그들의 노력을 존중해 보세요.", "ok": false, "foot": [], "fixes": [{"wrong": "of", "right": "for", "partial": false, "at": [5], "point": "기본전치사: '~를 기뻐하는'은 happy for 사용", "topic": "기본전치사", "memo": "'~를 기뻐하는'은 happy for 사용"}]}, {"n": 13, "tag": null, "en": "With positive word, you can learn from your friends, get along better, and focus in your own growth.", "ko": "긍정적인 말을 통해 여러분은 친구에게서 배우고, 더 잘 지내며, 자신의 성장에 집중할 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "word", "right": "words", "partial": false, "at": [2], "point": "명사의 복수형: 일반적인 '말'은 복수 words 사용", "topic": "명사의 복수형", "memo": "일반적인 '말'은 복수 words 사용"}, {"wrong": "in", "right": "on", "partial": false, "at": [14], "point": "기본전치사: '~에 집중하다'는 focus on 사용", "topic": "기본전치사", "memo": "'~에 집중하다'는 focus on 사용"}]}, {"n": 14, "tag": null, "en": "Say It! \"He did an great job.", "ko": "말해 보세요! \"그가 정말 잘했어.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [4], "point": "관사 a/an: 자음 소리 great 앞에는 a 사용", "topic": "관사 a/an", "memo": "자음 소리 great 앞에는 a 사용"}]}, {"n": 15, "tag": null, "en": "Good for him! I'll try hard, too!\"", "ko": "잘됐다! 나도 열심히 할 거야!\"", "ok": true, "foot": [], "fixes": []}, {"n": 16, "tag": null, "en": "\"We lost the game because your mistake. It's your fault.\"", "ko": "\"우리는 네 실수 때문에 게임에서 졌어. 네 잘못이야.\"", "ok": false, "foot": [], "fixes": [{"wrong": "your", "right": "of your", "partial": false, "at": [5], "point": "전치사와 접속사: 명사구 앞에는 because of 사용", "topic": "전치사와 접속사", "memo": "명사구 앞에는 because of 사용", "alt": [4]}]}, {"n": 17, "tag": null, "en": "When things goes wrong, we sometimes blame others.", "ko": "일이 잘못되었을 때 우리는 가끔 다른 사람을 비난하기도 합니다.", "ok": false, "foot": [], "fixes": [{"wrong": "goes", "right": "go", "partial": false, "at": [2], "point": "주어와 동사의 수일치: 주어 things는 복수: go (goes 아님)", "topic": "주어와 동사의 수일치", "memo": "주어 things는 복수: go (goes 아님)"}]}, {"n": 18, "tag": null, "en": "However, negative words like \"It's your fault\" can hurt they feelings and damage your friendship.", "ko": "하지만 \"네 잘못이야\"와 같은 부정적인 말은 상대방의 감정을 상하게 하고 우정을 해칠 수 있습니다.", "ok": false, "foot": [], "fixes": [{"wrong": "they", "right": "their", "partial": false, "at": [9], "point": "인칭대명사의 소유격: 명사 feelings 앞에는 소유격 their 사용", "topic": "인칭대명사의 소유격", "memo": "명사 feelings 앞에는 소유격 their 사용"}]}, {"n": 19, "tag": null, "en": "Instead, show your support and cheer them up.", "ko": "대신 지지를 보내고 그들을 응원해 주세요.", "ok": true, "foot": [], "fixes": []}, {"n": 20, "tag": null, "en": "Positive words will make your team develop a strong teamwork and perform better next time.", "ko": "긍정적인 말은 여러분의 팀이 강한 팀워크를 키우고 다음에는 더 잘할 수 있게 할 것입니다.", "ok": false, "foot": [], "fixes": [{"wrong": "a strong", "right": "strong", "partial": false, "at": [7], "point": "셀 수 없는 명사: teamwork는 셀 수 없어 a 불가", "topic": "셀 수 없는 명사", "memo": "teamwork는 셀 수 없어 a 불가"}]}, {"n": 21, "tag": null, "en": "Say It! \"You're an team member whom I trust.", "ko": "말해 보세요! \"너는 내가 믿는 팀원이야.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [3], "point": "관사 a/an: 자음 소리 team 앞에는 a 사용", "topic": "관사 a/an", "memo": "자음 소리 team 앞에는 a 사용"}]}, {"n": 22, "tag": null, "en": "Let's keep doing our better together, and we'll win the next game.\"", "ko": "함께 계속 최선을 다하면 다음 게임에서 이길 수 있을 거야.\"", "ok": false, "foot": [], "fixes": [{"wrong": "better", "right": "best", "partial": false, "at": [4], "point": "최상급: do our best: 최상급 best 사용", "topic": "최상급", "memo": "do our best: 최상급 best 사용"}]}];var PP=[["Words have power.", "말에는 힘이 있습니다.", 1], ["They can make us feel good or bad.", "말은 우리를 기분 좋거나 나쁘게 만들 수 있습니다.", 0], ["The words which we choose can influence our thoughts, emotions, and friendships.", "우리가 선택하는 말은 우리의 생각, 감정, 그리고 우정에 영향을 미칠 수 있습니다.", 0], ["Let's explore some common problems that students usually face.", "학생들이 흔히 겪는 일반적인 문제들을 함께 살펴봅시다.", 0], ["You will understand the amazing power of words.", "여러분은 말의 놀라운 힘을 이해하게 될 것입니다.", 0], ["\"I didn't
