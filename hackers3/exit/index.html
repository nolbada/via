<!doctype html>
<html lang="ko" translate="no">
<head>
<meta charset="utf-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>해커스 리딩스마트 3 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#1e3a8a;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:nowrap;gap:6px;margin:16px -16px 10px;padding:2px 16px 8px;overflow-x:auto;-webkit-overflow-scrolling:touch;scrollbar-width:none}.units::-webkit-scrollbar{display:none}
.ub{flex:none;white-space:nowrap;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;flex-direction:column;gap:8px;margin:6px 0 14px}
.tab{display:block;width:100%;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:15px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere;white-space:pre-line}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}

.top{margin:0 0 14px}.top .tk{display:inline-block;font-size:12px;font-weight:800;letter-spacing:.12em;color:#fff;background:var(--accent);border-radius:6px;padding:3px 10px}
.top h1{margin:8px 0 2px}.top .sub{margin:0}
.nav{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 0}
.nav a{flex:1 1 140px;display:block;text-align:center;text-decoration:none;font-weight:700;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;min-height:44px}
.nav a.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.banner .nav a{background:rgba(255,255,255,.7);color:#14213d;border-color:currentColor}.banner .nav a.pri{background:var(--accent);color:#fff;border-color:var(--accent)}
.grp{margin:22px 2px 8px;font-size:13px;font-weight:800;color:var(--muted);letter-spacing:.04em}
.pk{display:flex;gap:10px;align-items:center;width:100%;text-align:left;text-decoration:none;color:var(--ink);border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:10px 12px;margin-bottom:8px;min-height:44px}
.pk b{display:block;font-size:15px}.pk span.t{display:block;font-size:12px;color:var(--muted)}
.pk .st{margin-left:auto;flex:none;font-size:12px;font-weight:800;border-radius:999px;padding:2px 10px;border:1px solid var(--ok);color:var(--ok)}
.pk.lk{opacity:.55;border-style:dashed}.pk.lk .st{border-color:var(--muted);color:var(--muted)}
.gate{background:var(--surface);border:2px dashed var(--muted);border-radius:12px;padding:22px;text-align:center}
.gate b{display:block;font-size:17px;margin-bottom:4px}.gate p{margin:0;color:var(--muted)}
.leave{display:block;text-align:center;margin:22px 0 0;color:var(--muted);font-size:13px}
.rst{display:block;width:100%;margin-top:10px;border:2px solid var(--line);background:var(--surface);color:var(--muted);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rst.arm{border-color:#b42318;color:#b42318}.rst:disabled{opacity:.6;cursor:default}
</style>

<script>
var P=[{"u":1,"id":"hk3-01-1","no":1,"ko":"언제 어디서나 출동!","items":[{"n":1,"t":"tf","q":"A drone can deliver blood bags in only 15 minutes.","ko":"드론은 혈액 주머니를 15분 만에 배달할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"It only takes 15 minutes to deliver the bags!","혈액 주머니를 배달하는 데 15분밖에 걸리지 않는다!"]],"w":"6번 문장에 It only takes 15 minutes to deliver the bags!가 있어요. 드론으로 보내면 15분밖에 걸리지 않는다는 내용과 일치해요.","c":"T"},"h":"8ea32de429"},{"n":2,"t":"tf","q":"Drones have to land on the ground to deliver a box.","ko":"드론은 상자를 배달하려면 땅에 착륙해야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"8~9번 문장","s":[[8,"And they make the deliveries without landing.","그리고 그것들은 착륙을 하지 않고 배달한다."],[9,"The drones simply drop a box containing medical supplies from the sky.","드론은 의료보급품이 들어 있는 상자를 하늘에서 그냥 떨어뜨린다."]],"w":"8번에서 드론은 착륙하지 않고(without landing) 배달한다고 하고, 9번에서 하늘에서 상자를 떨어뜨린다고 해요. 땅에 착륙해야 한다는 말은 반대예요.","c":"F"},"h":"5c1c44e6af"},{"n":3,"t":"tf","q":"The box dropped by a drone is attached to a small parachute.","ko":"드론이 떨어뜨리는 상자는 작은 낙하산에 붙어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"The box is attached to a small parachute, which allows it to land safely.","그 상자는 작은 낙하산에 붙어있고, 이는 상자가 안전하게 착륙하도록 한다."]],"w":"10번에서 The box is attached to a small parachute라고 해요. 낙하산 덕분에 상자가 안전하게 착륙해요.","c":"T"},"h":"88c43c9202"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Imagine someone has been rushed to the hospital after a car accident.)","ko":"자동차 사고 후에 누군가가 병원으로 ( ) 상상해 보아라.","opts":["천천히 걸어가게 되었다","몰래 숨게 되었다","급히 수송되었다","조용히 쉬게 되었다"],"word":"rushed","r":{"a":"3) 급히 수송되었다","ev":"1번 문장","s":[[1,"Imagine someone has been rushed to the hospital after a car accident.","자동차 사고 후에 누군가가 병원으로 급히 수송되었다고 상상해 보아라."]],"w":"사고를 당한 사람이 병원으로 바삐 옮겨지는 상황이에요. has been rushed는 ‘급히 수송되었다’예요.","c":3},"h":"0aad5fbfe3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Drones can search in the dark or in areas that are hard to reach.)","ko":"드론은 어둠 속이나 ( ) 지역에서 수색을 할 수 있다.","opts":["닿다, 도달하다","잊다","만들다","고치다"],"word":"reach","r":{"a":"1) 닿다, 도달하다","ev":"13번 문장","s":[[13,"Drones can search in the dark or in areas that are hard to reach.","드론은 어둠 속이나 닿기 힘든 지역에서 수색을 할 수 있다."]],"w":"areas that are hard to reach는 ‘닿기 힘든 지역’이에요. 사람이 가기 어려운 곳이라서 드론이 수색에 도움이 돼요.","c":1},"h":"53d4673005"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThe box is attached to a small parachute, which allows it to land safely.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그 상자는 작은 낙하산에 붙어있고, 이는 그것이 안전하게 착륙하도록 한다.","opts":["드론","상자","병원","낙하산"],"r":{"a":"2) 상자","ev":"9~10번 문장","s":[[9,"The drones simply drop a box containing medical supplies from the sky.","드론은 의료보급품이 들어 있는 상자를 하늘에서 그냥 떨어뜨린다."],[10,"The box is attached to a small parachute, which allows it to land safely.","그 상자는 작은 낙하산에 붙어있고, 이는 상자가 안전하게 착륙하도록 한다."]],"w":"9번에서 드론이 떨어뜨리는 것은 상자(a box)예요. 10번에서 안전하게 착륙하는 것도 그 상자라서 it은 상자를 가리켜요.","c":2},"h":"1bdca1771c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"However, this isn’t the only task drones perform to save lives.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만, 이것이 드론이 생명을 살리기 위해서 수행하는 유일한 임무는 아니다.","opts":["드론은 사람을 구하는 일을 전혀 하지 않는다.","드론이 하는 일은 오직 배달뿐이다.","드론은 생명을 살리기 위해 배달 말고도 다른 임무를 한다.","드론의 임무는 모두 위험하다."],"r":{"a":"3) 드론은 생명을 살리기 위해 배달 말고도 다른 임무를 한다.","ev":"11번 문장","s":[[11,"However, this isn’t the only task drones perform to save lives.","하지만, 이것이 드론이 생명을 살리기 위해서 수행하는 유일한 임무는 아니다."]],"w":"isn’t the only task는 ‘유일한 임무가 아니다’라는 뜻이에요. 배달 말고도 다른 임무가 있다는 말이고, 그다음 12번에서 실종자 수색이 나와요.","c":3},"h":"bc56e3f6be"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["드론은 의료품을 배달할 때 반드시 땅에 내려야 한다.","드론은 자연재해 뒤에 실종된 사람들을 찾는 데 큰 역할을 한다.","차로 혈액을 배달하는 것이 드론보다 빠르다.","드론은 밝은 낮에만 수색할 수 있다."],"opts":["Drones must land on the ground to deliver medical supplies.","Drones play a big role in finding missing people after disasters.","Delivering blood by car is faster than by drone.","Drones can search only in the daytime."],"r":{"a":"2) Drones play a big role in finding missing people after disasters.","ev":"12~13번 문장","s":[[12,"They play an especially big role when looking for missing people after natural disasters.","그것들은 자연재해 이후 실종된 사람들을 찾을 때 특히 큰 역할을 한다."],[13,"Drones can search in the dark or in areas that are hard to reach.","드론은 어둠 속이나 닿기 힘든 지역에서 수색을 할 수 있다."]],"w":"12번에서 자연재해 이후 실종된 사람들을 찾을 때 큰 역할을 한다고 해요. 드론은 착륙하지 않고(8번) 배달하고, 차보다 빠르며(4, 6번), 어둠 속에서도 수색해요(13번).","c":2},"h":"02a74ae49a"},{"n":9,"t":"sum","q":"Drones have already made 25,000 (A) deliveries in (B) alone.","ko":"드론은 이미 25,000번이나 (A) 배달을 (B)에서만 했다.","oko":["A 생명을 살리는 …… / B 아프리카","A 생명을 살리는 …… / B 아시아","A 위험한 …… / B 아프리카","A 무료의 …… / B 아시아","A 값비싼 …… / B 유럽"],"opts":["(A) life-saving / (B) Africa","(A) life-saving / (B) Asia","(A) dangerous / (B) Africa","(A) free / (B) Asia","(A) expensive / (B) Europe"],"r":{"a":"1) (A) life-saving / (B) Africa (A 생명을 살리는 …… / B 아프리카)","ev":"7번 문장","s":[[7,"Drones have already made life-saving deliveries like this 25,000 times in Africa alone.","드론은 이미 이와 같이 생명을 살리는 배달을 아프리카에서만 25,000번을 했다."]],"w":"7번 문장에서 드론은 아프리카에서만 생명을 살리는(life-saving) 배달을 25,000번 했다고 해요.","c":1,"k":null},"h":"f66549f58d"},{"n":10,"t":"fill","q":"The hospital asks the supply [A] for more blood. But it can take [B] to deliver blood bags by car.","ko":"병원은 보급 [A]에 더 많은 혈액을 요청한다. 하지만 차로 혈액 주머니를 배달하는 데는 [B]이(가) 걸릴 수 있다.","bank":["center","hours","patient","accident","sky","parachute"],"bko":{"center":"본부","hours":"몇 시간","patient":"환자","accident":"사고","sky":"하늘","parachute":"낙하산"},"r":{"a":"[A] center (본부), [B] hours (몇 시간)","ev":"3~4번 문장","s":[[3,"The hospital asks the supply center for more blood.","병원은 보급 본부에 더 많은 혈액을 요청한다."],[4,"But it can take hours to deliver blood bags by car.","하지만 차로 혈액 주머니를 배달하는 데는 몇 시간이 걸릴 수 있다."]],"w":"3번에서 병원은 보급 본부(supply center)에 혈액을 요청하고, 4번에서 차로 배달하면 몇 시간(hours)이 걸릴 수 있다고 해요.","c":null,"k":null},"h":"4c3722d1d6"}]},{"u":1,"id":"hk3-01-2","no":2,"ko":"미운 정 들었어","items":[{"n":1,"t":"tf","q":"Maupassant liked the Eiffel Tower from the beginning.","ko":"모파상은 처음부터 에펠탑을 좋아했다.","r":{"a":"F (본문과 다른 내용)","ev":"2~3번 문장","s":[[2,"He said, “It is the only place in Paris where I can sit and not actually see the tower!”","그는, “여기가 파리에서 유일하게 내가 앉아서 사실상 그 탑을 보지 않을 수 있는 곳이에요!”라고 말했다."],[3,"Like him, many Parisians hated the Eiffel Tower at first.","그와 같이, 많은 파리 사람들이 처음에는 에펠탑을 싫어했다."]],"w":"2번에서 모파상은 탑을 보지 않을 수 있는 곳이라서 식당에 간다고 했고, 3번에서 모파상처럼 많은 파리 사람들이 처음에는 탑을 싫어했다고 해요.","c":"F"},"h":"5f5e6c345c"},{"n":2,"t":"tf","q":"The Parisians got used to the Eiffel Tower as time passed.","ko":"파리 사람들은 시간이 지나면서 에펠탑에 익숙해졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Over time, they got used to it and started to love it.","시간이 지나면서, 그들은 그것에 익숙해졌고 그것을 좋아하기 시작했다."]],"w":"5번에 Over time, they got used to it and started to love it.이 있어요. 시간이 지나면서 익숙해졌고 좋아하기 시작했다는 내용이에요.","c":"T"},"h":"8abe9ed47f"},{"n":3,"t":"tf","q":"Advertisers use a different commercial every time.","ko":"광고주들은 매번 다른 광고를 사용한다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Advertisers use the same commercial repeatedly.","광고주들은 반복적으로 같은 광고를 사용한다."]],"w":"9번에서 광고주들은 같은 광고(the same commercial)를 반복적으로 사용한다고 해요. 매번 다른 광고라는 말은 반대예요.","c":"F"},"h":"90a79cc8d1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (At first, you may be indifferent or even annoyed by it.)","ko":"처음에는, ( ) 또는 심지어 그것에 짜증이 날 수도 있다.","opts":["아주 기쁜","무관심한","매우 놀란","몹시 슬픈"],"word":"indifferent","r":{"a":"2) 무관심한","ev":"10번 문장","s":[[10,"At first, you may be indifferent or even annoyed by it.","처음에는, 무관심하거나 그것에 짜증이 날 수도 있다."]],"w":"indifferent or even annoyed는 ‘무관심하거나 심지어 짜증이 난’이에요. 처음에는 광고에 별 관심이 없거나 짜증이 난다는 뜻이에요.","c":2},"h":"6e3ea75ac3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The more you are exposed to something, the more you like it.)","ko":"어떤 것에 더 많이 ( ) 수록, 당신은 그것을 더 많이 좋아하게 된다.","opts":["숨겨진","칭찬받은","선택된","노출된"],"word":"exposed","r":{"a":"4) 노출된","ev":"7번 문장","s":[[7,"The more you are exposed to something, the more you like it.","어떤 것에 더 많이 노출될수록, 당신은 그것을 더 많이 좋아하게 된다."]],"w":"be exposed to는 ‘~에 노출되다’예요. 자주 접할수록 더 좋아한다는 친숙성 원칙의 핵심 표현이에요.","c":4},"h":"625e7a6a3e"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nHowever, the tower was located in the city’s center, so people naturally saw it every day.","ko":"밑줄 친 it이 가리키는 것은?","sko":"하지만, 그 탑은 도시의 중심에 위치해 있어서, 사람들은 자연스럽게 그것을 매일 봤다.","opts":["도시의 중심","에펠탑","모파상","광고"],"r":{"a":"2) 에펠탑","ev":"4번 문장","s":[[4,"However, the tower was located in the city’s center, so people naturally saw it every day.","하지만, 그 탑은 도시의 중심에 위치해 있어서, 사람들은 자연스럽게 그것을 매일 봤다."]],"w":"4번 문장에서 탑이 도시의 중심에 있어서 사람들이 그것(it)을 매일 봤다고 해요. 매일 본 것은 에펠탑이에요.","c":2,"k":"it = 에펠탑"},"pron":"it","h":"bee4c82247"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But later, you find yourself choosing the brand you saw in the commercial.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 나중에, 당신은 광고에서 본 그 브랜드를 고르고 있는 자신의 모습을 발견한다.","opts":["나중에는 광고에서 본 브랜드를 고르고 있는 자신을 발견하게 된다.","나중에는 광고에서 본 브랜드를 절대 고르지 않게 된다.","나중에는 브랜드를 보지 않고 광고만 고르게 된다.","나중에는 광고를 만드는 일을 하게 된다."],"r":{"a":"1) 나중에는 광고에서 본 브랜드를 고르고 있는 자신을 발견하게 된다.","ev":"11번 문장","s":[[11,"But later, you find yourself choosing the brand you saw in the commercial.","하지만 나중에, 당신은 광고에서 본 그 브랜드를 고르고 있는 자신의 모습을 발견한다."]],"w":"11번 문장은 \"나중에는 광고에서 본 브랜드를 고르는 자신을 발견한다\"는 뜻이에요.","c":1,"k":null},"h":"2e6131a329"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["에펠탑은 파리의 중심에서 멀리 떨어져 있었다.","모파상은 에펠탑 안의 식당에서 매일 점심을 먹곤 했다.","파리 사람들은 에펠탑에 끝내 익숙해지지 않았다.","광고는 사람들이 곧바로 그 브랜드를 싫어하게 만든다."],"opts":["The Eiffel Tower was located far from the center of Paris.","Maupassant used to have lunch at a restaurant inside the Eiffel Tower every day.","The Parisians never got used to the Eiffel Tower.","Commercials make people hate the brand right away."],"r":{"a":"2) Maupassant used to have lunch at a restaurant inside the Eiffel Tower every day.","ev":"1번 문장","s":[[1,"Guy de Maupassant, a famous writer, used to have lunch every day at a restaurant inside the Eiffel Tower.","유명 작가인 기 드 모파상은, 에펠탑 안에 있는 식당에서 매일 점심을 먹곤 했다."]],"w":"1번에 모파상이 에펠탑 안의 식당에서 매일 점심을 먹곤 했다고 나와요. 탑은 도시 중심에 있었고(4번), 파리 사람들은 익숙해져 좋아하게 되었으며(5번), 광고도 결국 좋아하게 만든다고 해요(12번).","c":2},"h":"0f784f1cf2"},{"n":9,"t":"sum","q":"Just like the Parisians and the Eiffel Tower, you get so (A) with it that you like it in the (B).","ko":"마치 파리 사람들과 에펠탑처럼, 당신은 그것에 너무 (A) (B)에는 그것을 좋아하게 된다.","oko":["A 익숙해져서 …… / B 끝","A 익숙해져서 …… / B 처음","A 화가 나서 …… / B 끝","A 화가 나서 …… / B 처음","A 낯설어져서 …… / B 처음"],"opts":["(A) familiar / (B) end","(A) familiar / (B) start","(A) angry / (B) end","(A) angry / (B) start","(A) strange / (B) start"],"r":{"a":"1) (A) familiar / (B) end (A 익숙해져서 …… / B 끝)","ev":"12번 문장","s":[[12,"Just like the Parisians and the Eiffel Tower, you get so familiar with it that you like it in the end.","마치 파리 사람들과 에펠탑처럼, 당신은 그것에 너무 익숙해져서 결국 그것을 좋아하게 된다."]],"w":"12번 문장에서 파리 사람들과 에펠탑처럼, 그것에 너무 익숙해져서(familiar) 결국(in the end) 좋아하게 된다고 해요.","c":1,"k":null},"h":"163324adf3"},{"n":10,"t":"fill","q":"You may have had this [A] with [B].","ko":"당신은 [B]에 대해 이런 [A]을(를) 했을 수도 있다.","bank":["experience","advertisements","tower","writer","restaurant","principle"],"bko":{"experience":"경험","advertisements":"광고(복수)","tower":"탑","writer":"작가","restaurant":"식당","principle":"원칙"},"r":{"a":"[A] experience (경험), [B] advertisements (광고(복수))","ev":"8번 문장","s":[[8,"You may have had this experience with advertisements.","당신은 광고에 대해 이런 경험을 했을 수도 있다."]],"w":"8번 문장은 \"당신은 광고에 대해 이런 경험을 했을 수도 있다\"는 뜻이에요.","c":null,"k":null},"h":"cccbc44e8d"}]},{"u":1,"id":"hk3-01-3","no":3,"ko":"알고 보면 달라 달라~","items":[{"n":1,"t":"tf","q":"The most basic difference between the two sports is the track length.","ko":"두 스포츠의 가장 기본적인 차이점은 트랙 길이이다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The most basic difference is the track length.","가장 기본적인 차이점은 트랙 길이이다."]],"w":"3번에 The most basic difference is the track length.가 그대로 있어요.","c":"T"},"h":"4e460fd602"},{"n":2,"t":"tf","q":"The track for speed skating is shorter than the track for short-track skating.","ko":"스피드 스케이팅 트랙은 쇼트트랙 스케이팅 트랙보다 짧다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The track for speed skating, which is 400 meters long, is around four times longer than that for short-track skating.","400미터 길이인 스피드 스케이팅 트랙은 쇼트트랙 스케이팅의 트랙보다 네 배 정도 더 길다."]],"w":"4번에서 스피드 스케이팅 트랙은 쇼트트랙 트랙보다 네 배 정도 더 길다(four times longer)고 해요. 짧다는 말은 반대예요.","c":"F"},"h":"a0c551999f"},{"n":3,"t":"tf","q":"In speed skating, each skater skates in his or her own lane.","ko":"스피드 스케이팅에서는 각 선수가 자기 레인에서 스케이트를 탄다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"But in speed skating, only two skaters are on the ice, each skating in his or her own lane.","하지만 스피드 스케이팅에서는, 두 명의 스케이트 선수들만 빙판 위에 있고, 각자 자기 자신의 레인에서 스케이트를 탄다."]],"w":"8번에서 스피드 스케이팅은 두 명만 빙판 위에 있고, 각자 자기 자신의 레인에서 탄다고 해요.","c":"T"},"h":"59dd65824e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Passing competitors and navigating around them quickly are important skills.)","ko":"경쟁자들을 추월하고 그들 주위에서 빠르게 ( ) 것이 중요한 기술들이다.","opts":["길을 포기하는","얼음을 깨는","길을 찾는","동작을 멈추는"],"word":"navigating","r":{"a":"3) 길을 찾는","ev":"7번 문장","s":[[7,"Because there are so many skaters on the track, passing competitors and navigating around them quickly are important skills.","트랙 위에 너무 많은 선수들이 있기 때문에, 경쟁자들을 추월하고 그들 주위에서 빠르게 길을 찾는 것이 중요한 기술들이다."]],"w":"선수가 많은 트랙에서 경쟁자들 사이를 빠져나가며 방향을 찾는 기술이에요. navigate around them은 ‘그들 주위에서 길을 찾다’예요.","c":3},"h":"4344e21778"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In addition, the blades of speed skates are long to provide more speed.)","ko":"게다가, 스피드 스케이트의 ( )은 길어서 더 빠른 속도를 제공한다.","opts":["(스케이트) 날","신발 끈","얼음 조각","트랙 바닥"],"word":"blades","r":{"a":"1) (스케이트) 날","ev":"10번 문장","s":[[10,"In addition, the blades of speed skates are long to provide more speed.","게다가, 스피드 스케이트의 날은 길어서 더 빠른 속도를 제공한다."]],"w":"스케이트에서 길어서 더 빠른 속도를 내는 부분이 날이에요. 11번에도 쇼트트랙 스케이트의 날(blades)이 짧다고 나와요.","c":1},"h":"e18f7c7624"},{"n":6,"t":"ref","q":"What does the underlined \"that\" refer to?\nThe track for speed skating, which is 400 meters long, is around four times longer than that for short-track skating.","ko":"밑줄 친 that이 가리키는 것은?","sko":"400미터 길이인 스피드 스케이팅 트랙은 쇼트트랙 스케이팅의 그것보다 네 배 정도 더 길다.","opts":["선수","트랙","규칙","올림픽"],"r":{"a":"2) 트랙","ev":"3~4번 문장","s":[[3,"The most basic difference is the track length.","가장 기본적인 차이점은 트랙 길이이다."],[4,"The track for speed skating, which is 400 meters long, is around four times longer than that for short-track skating.","400미터 길이인 스피드 스케이팅 트랙은 쇼트트랙 스케이팅의 트랙보다 네 배 정도 더 길다."]],"w":"비교하는 대상은 ‘스피드 스케이팅 트랙’과 ‘쇼트트랙 스케이팅 트랙’이에요. than that for short-track skating은 than the track for short-track skating이라는 뜻이라 that은 트랙(the track)이에요.","c":2},"h":"cd9bb68bfa"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Skaters only focus on going as fast as possible.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"스케이트 선수들은 가능한 한 빠르게 달리는 데만 집중한다.","opts":["스케이트 선수들은 천천히 달리는 데 집중한다.","스케이트 선수들은 다른 선수를 추월하는 데만 집중한다.","스케이트 선수들은 가능한 한 오래 달리려고 한다.","스케이트 선수들은 가능한 한 빠르게 달리는 데만 집중한다."],"r":{"a":"4) 스케이트 선수들은 가능한 한 빠르게 달리는 데만 집중한다.","ev":"9번 문장","s":[[9,"Skaters only focus on going as fast as possible.","스케이트 선수들은 가능한 한 빠르게 달리는 데만 집중한다."]],"w":"「as + 부사 + as possible」은 ‘가능한 한 ~하게’예요. as fast as possible은 ‘가능한 한 빠르게’이고, only focus on은 ‘~에만 집중한다’예요.","c":4},"h":"92f31c56bc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["쇼트트랙에서는 한 번에 두 명만 겨룬다.","쇼트트랙에서는 한 번에 네 명에서 여덟 명의 선수가 겨룬다.","스피드 스케이팅은 쇼트트랙 스케이팅과 규칙이 똑같다.","쇼트트랙 스케이팅의 트랙은 스피드 스케이팅의 트랙보다 길다."],"opts":["Only two skaters compete at once in short-track skating.","Four to eight skaters compete at once in short-track skating.","Speed skating has the same rules as short-track skating.","The track for short-track skating is longer than that for speed skating."],"r":{"a":"2) Four to eight skaters compete at once in short-track skating. (쇼트트랙에서는 한 번에 네 명에서 여덟 명의 선수가 겨룬다.)","ev":"6번 문장","s":[[6,"In short-track skating, four to eight skaters compete at once.","쇼트트랙 스케이팅에서는, 네 명에서 여덟 명의 스케이트 선수들이 한 번에 겨룬다."]],"w":"6번 문장에서 쇼트트랙은 네 명에서 여덟 명의 선수가 한 번에 겨룬다고 해요.","c":2,"k":null},"h":"976afd08f2"},{"n":9,"t":"sum","q":"If you have ever seen the Winter (A), you may have thought that short-track skating and speed skating look very (B).","ko":"만약 당신이 동계 (A)을(를) 본 적 있다면, 쇼트트랙 스케이팅과 스피드 스케이팅이 매우 (B) 보인다고 생각했을 수도 있다.","oko":["A 올림픽 …… / B 비슷하게","A 올림픽 …… / B 다르게","A 축제 …… / B 비슷하게","A 축제 …… / B 다르게","A 콘서트 …… / B 위험하게"],"opts":["(A) Olympics / (B) similar","(A) Olympics / (B) different","(A) Festival / (B) similar","(A) Festival / (B) different","(A) Concert / (B) dangerous"],"r":{"a":"1) (A) Olympics / (B) similar (A 올림픽 …… / B 비슷하게)","ev":"1번 문장","s":[[1,"If you’ve ever seen the Winter Olympics, you may have thought short-track skating and speed skating look very similar.","만약 당신이 동계 올림픽을 본 적 있다면, 쇼트트랙 스케이팅과 스피드 스케이팅이 매우 비슷하게 보인다고 생각했을 수도 있다."]],"w":"1번 문장에서 동계 올림픽(Olympics)을 본 적 있다면 두 종목이 매우 비슷하게(similar) 보인다고 생각했을 수 있다고 해요.","c":1,"k":null},"h":"4aea0587b8"},{"n":10,"t":"fill","q":"The blades of short-track skates, on the other hand, are shorter so that the skaters can make [A] more [B].","ko":"반면에, 쇼트트랙 스케이트의 날은 더 짧아서 선수들이 [A]을(를) 더 [B] 할 수 있다.","bank":["turns","easily","lanes","ice","blades","rules"],"bko":{"turns":"방향 전환","easily":"쉽게","lanes":"레인","ice":"얼음","blades":"(스케이트) 날","rules":"규칙"},"r":{"a":"[A] turns (방향 전환), [B] easily (쉽게)","ev":"11번 문장","s":[[11,"The blades of short-track skates, on the other hand, are shorter so that the skaters can make turns more easily.","반면에, 쇼트트랙 스케이트의 날은, 스케이트 선수들이 방향을 더 쉽게 틀 수 있도록 더 짧다."]],"w":"11번 문장은 날이 더 짧아서 선수들이 방향 전환(turns)을 더 쉽게(easily) 할 수 있다는 뜻이에요.","c":null,"k":null},"h":"1c54d8d64b"}]},{"u":1,"id":"hk3-01-4","no":4,"ko":"#너도 나도 챌린지!","items":[{"n":1,"t":"tf","q":"People open the bottle cap by kicking it with the tips of their toes.","ko":"사람들은 발끝으로 뚜껑을 차 참여했다."]],"w":"루게릭병을 알리려고 시작된 챌린지에 전 세계 사람들이 함께한 것이므로 participated는 ‘참여했다’예요.","c":3},"h":"715e648315"},{"n":6,"t":"ref","q":"What does the underlined \"themselves\" refer to?\nThe most famous one is the Ice Bucket Challenge, where people poured ice water over themselves.","ko":"밑줄 친 themselves가 가리키는 것은?","sko":"가장 유명한 것은 아이스버킷 챌린지인데, 여기서 사람들은 자기 자신에게 얼음물을 부었다.","opts":["사람들","얼음물","아이스버킷 챌린지","무술가들"],"r":{"a":"1) 사람들","ev":"10번 문장","s":[[10,"The most famous one is the Ice Bucket Challenge, where people poured ice water over themselves.","가장 유명한 것은 아이스버킷 챌린지인데, 여기서 사람들은 자기 자신에게 얼음물을 부었다."]],"w":"10번 문장에서 얼음물을 부은 사람은 people이에요. themselves는 그 사람들 자신을 가리켜요.","c":1,"k":"themselves = 사람들"},"pron":"themselves","h":"8a4091bb19"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But many challenges are also carried out in the public interest.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 많은 챌린지가 공익을 위해 실시되기도 한다.","opts":["많은 챌린지는 돈을 벌기 위해서만 실시된다.","많은 챌린지는 공익을 위해서도 실시된다.","공익을 위한 챌린지는 거의 없다.","챌린지는 공익을 해친다."],"r":{"a":"2) 많은 챌린지는 공익을 위해서도 실시된다.","ev":"9번 문장","s":[[9,"But many challenges are also carried out in the public interest.","하지만 많은 챌린지가 공익을 위해 실시되기도 한다."]],"w":"are carried out은 ‘실시된다’, in the public interest는 ‘공익을 위해’예요. also(~도)가 있어서 재미뿐 아니라 공익을 위한 챌린지도 많다는 뜻이에요.","c":2},"h":"da14f5fbce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["무술가들은 소셜 미디어에서 유명해지려고 이 챌린지를 만들었다.","병뚜껑 챌린지에서는 얼음물을 자기 몸에 붓는다.","병뚜껑 챌린지는 영상을 지운 뒤에 끝난다.","유명인들이 소셜 미디어에서 한 뒤에 이 챌린지는 인기를 얻었다."],"opts":["Martial artists made the challenge to become famous on social media.","In the Bottle Cap Challenge, people pour ice water over themselves.","The Bottle Cap Challenge is over after people delete the video.","The challenge became popular after celebrities did it on social media."],"r":{"a":"4) The challenge became popular after celebrities did it on social media.","ev":"6~7번 문장","s":[[6,"Actually, martial artists used to do this to increase the w":"11번에서 루게릭병에 대한 인식(awareness)을 높이려고 시작되었고, 12번에서 결과적으로 많은 사람들이 그 병에 대해 알게 되었어요(learned about).","c":null},"h":"1fe7b26318"}]},{"u":2,"id":"hk3-02-1","no":1,"ko":"입안에서 불꽃놀이가 팡팡!","items":[{"n":1,"t":"tf","q":"Pop Rocks give a popping sensation as they melt in your mouth.","ko":"파핑 캔디는 입안에서 녹을 때 터지는 느낌을 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"They provide a unique sensation by popping as they melt in your mouth.","그것들은 입안에서 녹을 때 터짐으로써 독특한 느낌을 제공한다."]],"w":"4번에서 파핑 캔디는 입안에서 녹을 때 터짐으로써 독특한 느낌을 제공한다고 해요.","c":"T"},"h":"36d2aa9428"},{"n":2,"t":"tf","q":"Pop Rocks are made without any gas.","ko":"파핑 캔디는 가스 없이 만들어진다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"To make Pop Rocks, carbon dioxide gas is poured into sugar water.","파핑 캔디를 만들기 위해서, 이산화탄소 가스는 설탕물에 부어진다."]],"w":"7번에서 파핑 캔디를 만들려면 이산화탄소 가스를 설탕물에 붓는다고 해요. 가스 없이 만든다는 말은 반대예요.","c":"F"},"h":"bd1f6e0201"},{"n":3,"t":"tf","q":"Carbon dioxide is also contained in many soft drinks.","ko":"이산화탄소는 많은 탄산음료에도 들어 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Carbon dioxide is also contained in many soft drinks.","이산화탄소는 많은 탄산음료에도 들어 있다."]],"w":"11번에 Carbon dioxide is also contained in many soft drinks.가 그대로 있어요.","c":"T"},"h":"0f53af707f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When you eat it, you can feel tiny explosions in your mouth.)","ko":"그것을 먹을 때, 당신은 입안에서 ( ) 폭발들을 느낄 수 있다.","opts":["거대한","아주 작은","뜨거운","단단한"],"word":"tiny","r":{"a":"2) 아주 작은","ev":"2번 문장","s":[[2,"When you eat it, you can feel tiny explosions in your mouth.","그것을 먹을 때, 당신은 입안에서 작은 폭발들을 느낄 수 있다."]],"w":"입안에서 느끼는 폭발은 큰 폭발이 아니라 톡톡 터지는 작은 느낌이에요. tiny explosions는 ‘아주 작은 폭발들’이에요.","c":2},"h":"42da7b7091"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The key is carbon dioxide trapped inside the candy.)","ko":"비결은 사탕 내부에 ( ) 이산화탄소이다.","opts":["섞여 있는","녹아 있는","사라진","갇혀 있는"],"word":"trapped","r":{"a":"4) 갇혀 있는","ev":"6번 문장","s":[[6,"The key is carbon dioxide trapped inside the candy.","비결은 사탕 내부에 갇혀있는 이산화탄소이다."]],"w":"이산화탄소가 사탕 안에 갇혀 있다가 사탕이 녹으면 빠져나오며 터져요(9번). trapped는 ‘갇혀 있는’이에요.","c":4},"h":"4b9184a189"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen you eat them, the outer layer of sugar melts and the carbon dioxide gas escapes into the air.","ko":"밑줄 친 them이 가리키는 것은?","sko":"당신이 그것들을 먹을 때, 바깥의 설탕 층이 녹고 이산화탄소 가스가 공기 중으로 빠져나온다.","opts":["파핑 캔디","설탕물","탄산음료","아이스크림"],"r":{"a":"1) 파핑 캔디","ev":"3번, 9번 문장","s":[[3,"This is caused by candies called Pop Rocks.","이것은 파핑 캔디라고 불리는 사탕에 의해 일어난다."],[9,"When you eat them, the outer layer of sugar melts and the carbon dioxide gas escapes into the air.","당신이 그것들을 먹을 때, 바깥의 설탕 층이 녹고 이산화탄소 가스가 공기 중으로 빠져나온다."]],"w":"설탕 층이 녹고 가스가 빠져나오는 것은 파핑 캔디(Pop Rocks)를 먹을 때예요. 3번에서 소개된 Pop Rocks를 9번에서 them으로 받았어요.","c":1},"h":"00b6e518db"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"That’s why it feels like bubbles are popping in your mouth when you drink them!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것이 많은 탄산음료를 마실 때 입안에서 방울들이 터지고 있는 것처럼 느껴지는 이유이다!","opts":["그래서 탄산음료를 마시면 입안이 얼어붙는 느낌이 든다.","그래서 탄산음료는 파핑 캔디로 만들어진다.","그래서 탄산음료를 마실 때 입안에서 방울들이 터지는 것처럼 느껴진다.","그래서 탄산음료에는 설탕이 들어 있지 않다."],"r":{"a":"3) 그래서 탄산음료를 마실 때 입안에서 방울들이 터지는 것처럼 느껴진다.","ev":"12번 문장","s":[[12,"That’s why it feels like bubbles are popping in your mouth when you drink them!","그것이 많은 탄산음료를 마실 때 입안에서 방울들이 터지고 있는 것처럼 느껴지는 이유이다!"]],"w":"That’s why는 ‘그것이 ~한 이유이다’라는 뜻이에요. 탄산음료에 이산화탄소가 들어 있기 때문에(11번) 마실 때 방울이 터지는 것처럼 느껴져요.","c":3},"h":"ef07f81dc3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["파핑 캔디는 열을 가해서 터지게 만든다.","파핑 캔디의 혼합물은 얼려져서 여러 조각으로 부서진다.","이산화탄소 가스는 먹은 뒤에도 사탕에 계속 남아 있다.","탄산음료에는 이산화탄소가 전혀 없다."],"opts":["Pop Rocks are made to pop by heating them.","The mixture for Pop Rocks is frozen and broken into pieces.","The carbon dioxide gas stays in the candy even after it is eaten.","Soft drinks have no carbon dioxide in them."],"r":{"a":"2) The mixture for Pop Rocks is frozen and broken into pieces.","ev":"8~9번 문장","s":[[8,"Then the mixture is frozen and broken into pieces.","그러고 나서 그 혼합물은 냉동되고 여러 조각들로 부서진다."],[9,"When you eat them, the outer layer of sugar melts and the carbon dioxide gas escapes into the air.","당신이 그것들을 먹을 때, 바깥의 설탕 층이 녹고 이산화탄소 가스가 공기 중으로 빠져나온다."]],"w":"8번에서 혼합물은 냉동되고 여러 조각들로 부서진다고 해요. 가스는 먹을 때 빠져나오고(9번), 탄산음료에도 이산화탄소가 들어 있어요(11번).","c":2},"h":"53b7515792"},{"n":9,"t":"sum","q":"The gas that escapes in your mouth causes a popping feeling and also the (A) (B) that comes with it.","ko":"입안에서 빠져나오는 가스는 터지는 느낌과 함께 따라오는 (A) (B)도 일으킨다.","oko":["A 깨지는 …… / B 소리","A 깨지는 …… / B 냄새","A 노래하는 …… / B 소리","A 빛나는 …… / B 빛","A 빛나는 …… / B 냄새"],"opts":["(A) cracking / (B) sound","(A) cracking / (B) smell","(A) singing / (B) sound","(A) shining / (B) light","(A) shining / (B) smell"],"r":{"a":"1) (A) cracking / (B) sound (A 깨지는 …… / B 소리)","ev":"10번 문장","s":[[10,"This causes the popping sensation in your mouth, as well as the cracking sound that comes with it.","이것은 당신의 입안에서 터지는 느낌과, 그와 함께 나는 탁탁 갈라지는 소리를 일으킨다."]],"w":"10번 문장에서 이 현상은 터지는 느낌과 함께 따라오는 깨지는(cracking) 소리(sound)도 일으킨다고 해요.","c":1,"k":null},"h":"b666ef3c9c"},{"n":10,"t":"fill","q":"To make Pop Rocks, carbon dioxide gas is [A] into sugar [B].","ko":"파핑 캔디를 만들기 위해서, 이산화탄소 가스는 설탕 [B]에 [A].","bank":["poured","water","mouth","layer","explosion","candy"],"bko":{"poured":"부어진(pour의 과거분사)","water":"물","mouth":"입","layer":"층","explosion":"폭발","candy":"사탕"},"r":{"a":"[A] poured (부어진(pour의 과거분사)), [B] water (물)","ev":"7번 문장","s":[[7,"To make Pop Rocks, carbon dioxide gas is poured into sugar water.","파핑 캔디를 만들기 위해서, 이산화탄소 가스는 설탕물에 부어진다."]],"w":"7번 문장은 이산화탄소 가스를 설탕물(sugar water)에 붓는다(poured)는 뜻이에요.","c":null,"k":null},"h":"f72a091b7c"}]},{"u":2,"id":"hk3-02-2","no":2,"ko":"고객님, 어디세요?","items":[{"n":1,"t":"tf","q":"Customers who never show up and don’t cancel beforehand are called no-shows.","ko":"아예 나타나지 않고 사전에 취소도 하지 않는 고객들은 노쇼라고 불린다.","r":{"a":"T (본문과 맞는 내용)","ev":"2~3번 문장","s":[[2,"However, some customers never show up and don’t cancel beforehand.","하지만, 일부 고객들은 아예 나타나지 않고 사전에 취소를 하지 않는다."],[3,"These customers are called no-shows.","이러한 고객들은 노쇼라고 불린다."]],"w":"2번에서 일부 고객은 나타나지 않고 사전에 취소도 하지 않는다고 하고, 3번에서 이런 고객들을 노쇼(no-shows)라고 불러요.","c":"T"},"h":"bb1837a38e"},{"n":2,"t":"tf","q":"No-shows cause problems only for restaurants.","ko":"노쇼는 식당에만 문제를 일으킨다.","r":{"a":"F (본문과 다른 내용)","ev":"4~5번 문장","s":[[4,"No-shows cause problems for other customers.","노쇼는 다른 고객들에게 문제를 일으킨다."],[5,"For example, some people may not be able to board a train or plane because of unused tickets bought by no-shows.","예를 들어, 몇몇 사람들은 노쇼에 의해 구매된 사용되지 않은 표 때문에 기차나 비행기에 탑승하지 못할 수도 있다."]],"w":"4번에서 노쇼는 다른 고객들에게 문제를 일으킨다고 하고, 5번에서 기차나 비행기에 탑승하지 못하는 사람들을 예로 들어요. 식당에만 문제를 일으키는 것이 아니에요.","c":"F"},"h":"265d13f550"},{"n":3,"t":"tf","q":"A restaurant loses the chance to accept other customers while it waits for a no-show.","ko":"식당은 노쇼를 기다리는 동안 다른 고객들을 받을 기회를 잃는다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"In addition, the restaurant loses an opportunity to accept other customers while waiting for the no-show.","게다가, 식당은 노쇼를 기다리는 동안 다른 고객들을 받을 기회를 잃는다."]],"w":"10번에서 식당은 노쇼를 기다리는 동안 다른 고객들을 받을 기회를 잃는다(loses an opportunity to accept other customers)고 해요.","c":"T"},"h":"c15cbf93dc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Some customers never show up and don’t cancel beforehand.)","ko":"일부 고객들은 아예 나타나지 않고 ( ) 취소를 하지 않는다.","opts":["나중에","사전에","갑자기","천천히"],"word":"beforehand","r":{"a":"2) 사전에","ev":"2번 문장","s":[[2,"However, some customers never show up and don’t cancel beforehand.","하지만, 일부 고객들은 아예 나타나지 않고 사전에 취소를 하지 않는다."]],"w":"노쇼는 약속 전에 미리 취소하지 않는 사람이에요. beforehand는 ‘사전에, 미리’예요.","c":2},"h":"ba62f20443"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Many businesses try to prevent no-shows by charging ahead of time or making a blacklist.)","ko":"많은 사업체들은 미리 요금을 청구하거나 블랙리스트를 만듦으로써 노쇼를 ( ) 위해 노력한다.","opts":["늘리다","허락하다","기다리다","막다"],"word":"prevent","r":{"a":"4) 막다","ev":"12번 문장","s":[[12,"Nowadays, many businesses try to prevent no-shows by charging ahead of time or making a blacklist.","요즘에, 많은 사업체들은 미리 요금을 청구하거나 블랙리스트를 만듦으로써 노쇼를 막기 위해 노력한다."]],"w":"요금을 미리 받거나 블랙리스트를 만드는 것은 노쇼가 생기지 않게 하려는 노력이에요. prevent는 ‘막다’예요.","c":4},"h":"196461593f"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey can damage the business itself.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 사업체 자체에 피해를 입힐 수 있다.","opts":["노쇼들","기차와 비행기","다른 고객들","식당 종업원들"],"r":{"a":"1) 노쇼들","ev":"6~7번 문장","s":[[6,"In the restaurant business, no-shows are even worse.","요식업에서, 노쇼는 훨씬 더 심각하다."],[7,"They can damage the business itself.","그들은 사업체 자체에 피해를 입힐 수 있다."]],"w":"6번에서 요식업에서 노쇼가 훨씬 더 심각하다고 했고, 7번에서 사업체 자체에 피해를 입힐 수 있는 것은 그 노쇼들이에요.","c":1},"h":"f70b537785"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the restaurant business, no-shows are even worse.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"요식업에서, 노쇼는 훨씬 더 심각하다.","opts":["요식업에서는 노쇼가 거의 없다.","요식업에서는 노쇼가 환영받는다.","요식업에서는 노쇼가 훨씬 더 심각하다.","요식업에서는 노쇼가 기차에서 더 심각하다."],"r":{"a":"3) 요식업에서는 노쇼가 훨씬 더 심각하다.","ev":"6번 문장","s":[[6,"In the restaurant business, no-shows are even worse.","요식업에서, 노쇼는 훨씬 더 심각하다."]],"w":"even은 비교급 worse를 강조해서 ‘훨씬 더 나쁜’이라는 뜻이에요. 앞 5번의 기차·비행기 예시보다 식당에서는 더 심각하다는 말이에요.","c":3},"h":"8bfb3ba887"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["식당은 손님이 오지 않아도 추가 수입을 얻는다.","미리 음식을 주문한 사람들이 오지 않으면, 그 음식은 낭비된다.","노쇼는 이제 사업체들에게 더 이상 문제가 아니다.","일찍 예약한 고객은 모두 노쇼라고 불린다."],"opts":["Restaurants earn extra money when customers do not come.","When people who ordered food in advance do not come, the food goes to waste.","No-shows are no longer a problem for businesses.","All customers who book early are called no-shows."],"r":{"a":"2) When people who ordered food in advance do not come, the food goes to waste. (미리 음식을 주문한 사람들이 오지 않으면, 그 음식은 낭비된다.)","ev":"8~9번 문장","s":[[8,"Customers sometimes make reservations or order food in advance.","고객들은 가끔 미리 예약을 하거나 음식을 주문한다."],[9,"If the people don’t come, the restaurant doesn’t get paid for the work and the food goes to waste.","만약 그 사람들이 오지 않는다면, 식당은 일에 대한 돈을 받지 못하고 음식은 낭비된다."]],"w":"8~9번 문장에서 미리 주문한 사람들이 오지 않으면 식당은 돈을 받지 못하고 음식이 낭비된다고 해요.","c":2,"k":null},"h":"52f5be014b"},{"n":9,"t":"sum","q":"Because of unused (A) bought by no-shows, some people may not be able to (B) a train or plane.","ko":"노쇼가 산 사용되지 않은 (A) 때문에, 몇몇 사람들은 기차나 비행기에 (B)하지 못할 수도 있다.","oko":["A 표 …… / B 탑승","A 표 …… / B 취소","A 가방 …… / B 탑승","A 가방 …… / B 지불","A 메뉴 …… / B 취소"],"opts":["(A) tickets / (B) board","(A) tickets / (B) cancel","(A) bags / (B) board","(A) bags / (B) pay","(A) menus / (B) cancel"],"r":{"a":"1) (A) tickets / (B) board (A 표 …… / B 탑승)","ev":"5번 문장","s":[[5,"For example, some people may not be able to board a train or plane because of unused tickets bought by no-shows.","예를 들어, 몇몇 사람들은 노쇼에 의해 구매된 사용되지 않은 표 때문에 기차나 비행기에 탑승하지 못할 수도 있다."]],"w":"5번 문장에서 노쇼가 산 사용되지 않은 표(tickets) 때문에 다른 사람이 기차나 비행기에 탑승하지(board) 못할 수 있다고 해요.","c":1,"k":null},"h":"369da823c2"},{"n":10,"t":"fill","q":"People often make [A] in advance for products or [B].","ko":"사람들은 종종 제품이나 [B]을(를) 위해 미리 [A]을(를) 한다.","bank":["reservations","services","ahead","cancel","prevent","beforehand"],"bko":{"reservations":"예약(복수)","services":"서비스(복수)","ahead":"앞에, 미리","cancel":"취소하다","prevent":"막다","beforehand":"사전에"},"r":{"a":"[A] reservations (예약(복수)), [B] services (서비스(복수))","ev":"1번 문장","s":[[1,"People often make reservations in advance for products or services.","사람들은 종종 제품이나 서비스를 위해 미리 예약을 한다."]],"w":"1번 문장은 사람들이 제품이나 서비스를 위해 미리 예약(reservations)을 한다는 뜻이에요.","c":null,"k":null},"h":"9caf81e4df"}]},{"u":2,"id":"hk3-02-3","no":3,"ko":"이런 건 안 주느니만 못해","items":[{"n":1,"t":"tf","q":"For Vietnamese people, cups symbolize the end of a relationship.","ko":"베트남 사람들에게 컵은 관계의 끝을 상징한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"For Vietnamese people, cups symbolize the end of a relationship since they often crack or break.","베트남 사람들에게, 컵은 자주 금이 가거나 깨지기 때문에 관계의 끝을 상징한다."]],"w":"5번에서 컵은 자주 금이 가거나 깨지기 때문에 관계의 끝을 상징한다고 해요.","c":"T"},"h":"e38c3e10d7"},{"n":2,"t":"tf","q":"In Russia, yellow flowers are good gifts because they bring good luck.","ko":"러시아에서 노란 꽃은 행운을 가져와서 좋은 선물이다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Never give yellow flowers as they are thought to be bad luck.","노란 꽃은 불운으로 여겨지므로 절대 주지 말아라."]],"w":"9번에서 노란 꽃은 불운(bad luck)으로 여겨지므로 절대 주지 말라고 해요. 행운이라는 말은 반대예요.","c":"F"},"h":"23e40bd564"},{"n":3,"t":"tf","q":"In Russia, even numbers of flowers are only given at funerals.","ko":"러시아에서 짝수의 꽃은 장례식에서만 주어진다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"Even numbers of flowers are only given at funerals.","짝수의 꽃은 장례식에서만 주어진다."]],"w":"11번에 Even numbers of flowers are only given at funerals.가 그대로 있어요.","c":"T"},"h":"f6d2942a60"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For Vietnamese people, cups symbolize the end of a relationship.)","ko":"베트남 사람들에게, 컵은 관계의 끝을 ( ).","opts":["상징하다","깨뜨리다","숨기다","구입하다"],"word":"symbolize","r":{"a":"1) 상징하다","ev":"5번 문장","s":[[5,"For Vietnamese people, cups symbolize the end of a relationship since they often crack or break.","베트남 사람들에게, 컵은 자주 금이 가거나 깨지기 때문에 관계의 끝을 상징한다."]],"w":"컵이 자주 깨지니까 관계의 끝을 나타낸다는 뜻이에요. symbolize는 ‘상징하다’예요.","c":1},"h":"319a31bcd6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Handkerchiefs are not appropriate because they are used to dry a person’s tears.)","ko":"손수건은 사람의 눈물을 닦기 위해 쓰이기 때문에 ( ) 않다.","opts":["비싼","적절한","흔한","위험한"],"word":"appropriate","r":{"a":"2) 적절한","ev":"6번 문장","s":[[6,"Similarly, handkerchiefs are not appropriate because they are used to dry a person’s tears.","비슷하게, 손수건은 사람의 눈물을 닦기 위해 쓰이기 때문에 적절하지 않다."]],"w":"손수건은 눈물을 닦는 물건이라 선물로 알맞지 않다는 말이에요. not appropriate는 ‘적절하지 않은’이에요.","c":2},"h":"f51a719f76"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nMeanwhile, in Russia, flowers are a favorite gift, but you must be careful when giving them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"한편, 러시아에서, 꽃은 가장 인기 있는 선물이지만, 그것을 줄 때 조심해야 한다.","opts":["꽃","러시아 사람들","선물을 받는 사람","컵"],"r":{"a":"1) 꽃","ev":"8번 문장","s":[[8,"Meanwhile, in Russia, flowers are a favorite gift, but you must be careful when giving them.","한편, 러시아에서, 꽃은 가장 인기 있는 선물이지만, 그것을 줄 때 조심해야 한다."]],"w":"8번 문장에서 러시아에서 가장 인기 있는 선물은 꽃(flowers)이고, 줄 때 조심해야 하는 것(them)도 꽃이에요.","c":1,"k":"them = 꽃"},"pron":"them","h":"b740cec8c2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This is especially true when he or she is from another country.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 그 또는 그녀가 다른 나라 출신일 때 특히 그렇다.","opts":["선물을 고르는 것은 다른 나라 사람에게는 쉽다.","선물을 고르는 것은 같은 나라 사람일 때 특히 어렵다.","선물을 고르는 것은 상대가 다른 나라 출신일 때 특히 어렵다.","선물은 다른 나라 사람에게 줄 필요가 없다."],"r":{"a":"3) 선물을 고르는 것은 상대가 다른 나라 출신일 때 특히 어렵다.","ev":"1~2번 문장","s":[[1,"Getting a gift for a boyfriend or girlfriend can be difficult.","남자친구 또는 여자친구를 위해 선물을 마련하는 것은 어려울 수 있다."],[2,"This is especially true when he or she is from another country.","이것은 그 또는 그녀가 다른 나라 출신일 때 특히 그렇다."]],"w":"1번에서 선물을 마련하는 것이 어려울 수 있다고 하고, 2번의 This가 그 내용이에요. especially true는 ‘특히 그렇다’이고, 다른 나라 출신일 때 더 어렵다는 뜻이에요.","c":3},"h":"b0a5fcb686"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["러시아에서는 꽃을 선물로 주면 안 된다.","러시아에서는 꽃다발에 홀수의 꽃을 넣어야 한다.","베트남에서는 손수건이 가장 좋은 선물이다.","러시아에서 짝수의 꽃은 기쁜 날에 주어진다."],"opts":["In Russia, flowers should never be given as gifts.","In Russia, a bouquet should have an odd number of flowers.","In Vietnam, handkerchiefs are the best gifts.","In Russia, even numbers of flowers are given on happy days."],"r":{"a":"2) In Russia, a bouquet should have an odd number of flowers.","ev":"10번 문장","s":[[10,"In addition, always give bouquets with an odd number of flowers.","또한, 항상 홀수의 꽃으로 된 꽃다발을 줘라."]],"w":"10번에서 항상 홀수의 꽃으로 된 꽃다발을 주라고 해요. 러시아에서 꽃은 인기 있는 선물이고(8번), 베트남에서 손수건은 안 좋은 선물이며(4번), 짝수는 장례식에서만 줘요(11번).","c":2},"h":"b207ec4fd9"},{"n":9,"t":"sum","q":"In Vietnam, cups and handkerchiefs are (A) gifts because cups mean the end of a relationship and handkerchiefs represent (B) after a breakup.","ko":"베트남에서 컵과 손수건은 (A) 선물인데, 컵은 관계의 끝을, 손수건은 이별 후의 (B)을 나타내기 때문이다.","oko":["(A) 좋은 / (B) 기쁨","(A) 안 좋은 / (B) 행운","(A) 비싼 / (B) 슬픔","(A) 좋은 / (B) 슬픔","(A) 안 좋은 / (B) 슬픔"],"opts":["(A) good / (B) joy","(A) bad / (B) luck","(A) expensive / (B) sadness","(A) good / (B) sadness","(A) bad / (B) sadness"],"r":{"a":"5) (A) bad / (B) sadness","ev":"4~7번 문장","s":[[4,"In Vietnam, cups and handkerchiefs are very bad gifts.","베트남에서, 컵과 손수건은 매우 안 좋은 선물이다."],[5,"For Vietnamese people, cups symbolize the end of a relationship since they often crack or break.","베트남 사람들에게, 컵은 자주 금이 가거나 깨지기 때문에 관계의 끝을 상징한다."],[6,"Similarly, handkerchiefs are not appropriate because they are used to dry a person’s tears.","비슷하게, 손수건은 사람의 눈물을 닦기 위해 쓰이기 때문에 적절하지 않다."],[7,"In other words, they represent sadness after a breakup.","다시 말해서, 그것은 이별 후의 슬픔을 나타낸다."]],"w":"4번에서 베트남에서는 컵과 손수건이 매우 안 좋은(bad) 선물이라 하고, 5번에서 컵은 관계의 끝을, 7번에서 손수건은 이별 후의 슬픔(sadness)을 나타낸다고 해요.","c":5},"h":"e242e65d45"},{"n":10,"t":"fill","q":"Here are a few [A] of why it’s important to understand a [B] when you give gifts.","ko":"여기 선물을 줄 때 [B]을(를) 이해하는 것이 왜 중요한지에 대한 몇 가지 [A]이(가) 있다.","bank":["examples","culture","symbolize","crack","dry","represent"],"bko":{"examples":"예시(복수)","culture":"문화","symbolize":"상징하다","crack":"금이 가다","dry":"닦다, 말리다","represent":"나타내다"},"r":{"a":"[A] examples (예시(복수)), [B] culture (문화)","ev":"3번 문장","s":[[3,"Here are a few examples of why it’s important to understand a culture when you give gifts.","여기 선물을 줄 때 문화를 이해하는 것이 왜 중요한지에 대한 몇 가지 예시가 있다."]],"w":"3번 문장은 선물을 줄 때 문화(culture)를 이해하는 것이 왜 중요한지 보여 주는 몇 가지 예시(examples)가 있다는 뜻이에요.","c":null,"k":null},"h":"2047a82182"}]},{"u":2,"id":"hk3-02-4","no":4,"ko":"집 나와라 뚝딱!","items":[{"n":1,"t":"tf","q":"A single 3D-printed house takes only about a day to build.","ko":"3D 프린터로 만든 집 한 채는 짓는 데 겨우 약 하루가 걸린다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Surprisingly, a single 3D-printed house takes only about a day to build.","놀랍게도, 3D 프린터로 만든 집 한 채는 짓는 데 겨우 약 하루가 걸린다."]],"w":"2번에 a single 3D-printed house takes only about a day to build가 그대로 있어요.","c":"T"},"h":"b595543b81"},{"n":2,"t":"tf","q":"A lot of workers are needed to control the 3D printer.","ko":"3D 프린터를 제어하는 데 많은 작업자가 필요하다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"It doesn’t even require a lot of workers to construct it because the 3D printer is controlled by special software on a tablet.","3D 프린터는 태블릿의 특별한 소프트웨어로 제어되기 때문에 그것을 건설하는 데 많은 작업자들을 필요로 하지도 않는다."]],"w":"3번에서 3D 프린터는 태블릿의 특별한 소프트웨어로 제어되기 때문에 많은 작업자를 필요로 하지도 않는다고 해요. 많은 작업자가 필요하다는 말은 반대예요.","c":"F"},"h":"0d12aa41a5"},{"n":3,"t":"tf","q":"A 3D-printed house can remain standing through hurricanes and earthquakes.","ko":"3D 프린터로 만든 집은 폭풍과 지진 속에서도 서 있을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"It can even remain standing through hurricanes and earthquakes.","그것은 심지어 폭풍과 지진 속에서도 서 있을 수 있다."]],"w":"7번에 It can even remain standing through hurricanes and earthquakes.가 그대로 있어요.","c":"T"},"h":"2e26ebafe8"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (It doesn’t even require a lot of workers to construct it.)","ko":"그것을 건설하는 데 많은 작업자들을 ( ) 하지도 않는다.","opts":["판매하다","거절하다","필요로 하다","허락하다"],"word":"require","r":{"a":"3) 필요로 하다","ev":"3번 문장","s":[[3,"It doesn’t even require a lot of workers to construct it because the 3D printer is controlled by special software on a tablet.","3D 프린터는 태블릿의 특별한 소프트웨어로 제어되기 때문에 그것을 건설하는 데 많은 작업자들을 필요로 하지도 않는다."]],"w":"doesn’t require a lot of workers는 ‘많은 작업자들을 필요로 하지 않는다’예요. 소프트웨어가 프린터를 제어하기 때문에 사람이 많이 필요하지 않아요.","c":3},"h":"7d0407ff7c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In the future, we may be able to make entire cities with the push of a button.)","ko":"미래에, 우리는 버튼 한 번 누르는 것으로 ( ) 도시들을 만들 수 있을지도 모른다.","opts":["전체의","작은","오래된","새로운"],"word":"entire","r":{"a":"1) 전체의","ev":"10번 문장","s":[[10,"In the future, we may be able to make entire cities with the push of a button.","미래에, 우리는 버튼 한 번 누르는 것으로 도시 전체를 만들 수 있을지도 모른다."]],"w":"집 한 채가 아니라 도시 전체를 만든다는 뜻이에요. entire cities는 ‘도시 전체’예요.","c":1},"h":"b9d590fb39"},{"n":6,"t":"ref","q":"What does the underlined \"this program\" refer to?\nWith this program, it can be built by a small crew of four to six people in a day.","ko":"밑줄 친 this program이 가리키는 것은?","sko":"이 프로그램으로, 그것은 네 명에서 여섯 명으로 된 작은 무리에 의해 하루 안에 지어질 수 있다.","opts":["3D 프린터","태블릿의 특별한 소프트웨어","작은 작업팀","기초적인 구조물"],"r":{"a":"2) 태블릿의 특별한 소프트웨어","ev":"3~4번 문장","s":[[3,"It doesn’t even require a lot of workers to construct it because the 3D printer is controlled by special software on a tablet.","3D 프린터는 태블릿의 특별한 소프트웨어로 제어되기 때문에 그것을 건설하는 데 많은 작업자들을 필요로 하지도 않는다."],[4,"With this program, it can be built by a small crew of four to six people in a day.","이 프로그램으로, 그것은 네 명에서 여섯 명으로 된 작은 무리에 의해 하루 안에 지어질 수 있다."]],"w":"3번에서 3D 프린터가 태블릿의 특별한 소프트웨어로 제어된다고 했고, 4번의 this program은 그 소프트웨어를 가리켜요.","c":2},"h":"972ae61762"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The workers just have to watch the printer building the basic structure and make a few adjustments.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"작업자들은 프린터가 기초적인 구조물을 짓고 있는 것을 지켜보고 몇 가지를 조정하기만 하면 된다.","opts":["작업자들은 기초 구조물을 직접 모두 쌓아야 한다.","작업자들은 프린터를 지켜볼 수 없다.","작업자들은 프린터를 전혀 조정할 필요가 없다.","작업자들은 프린터가 기초 구조물을 짓는 것을 지켜보고 몇 가지를 조정하기만 하면 된다."],"r":{"a":"4) 작업자들은 프린터가 기초 구조물을 짓는 것을 지켜보고 몇 가지를 조정하기만 하면 된다.","ev":"5번 문장","s":[[5,"The workers just have to watch the printer building the basic structure and make a few adjustments.","작업자들은 프린터가 기초적인 구조물을 짓고 있는 것을 지켜보고 몇 가지를 조정하기만 하면 된다."]],"w":"just have to는 ‘~하기만 하면 된다’예요. watch the printer building은 ‘프린터가 짓고 있는 것을 지켜보다’이고, make a few adjustments는 ‘몇 가지를 조정하다’예요.","c":4},"h":"e49fa3925f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["3D 프린터로 만든 집은 짓는 데 약 1년이 걸린다.","3D 프린터로 만든 집은 앞으로 더 비싸질 것이다.","기술이 개선될수록 3D 프린터로 만든 집은 더 싸고 빠르게 지을 수 있을 것이다.","작업자들은 기초 구조물을 손으로 직접 만들어야 한다."],"opts":["A 3D-printed house takes about a year to build.","3D-printed houses will become more expensive in the future.","As technology improves, 3D-printed houses will become cheaper and faster to build.","The workers must make the basic structure by hand."],"r":{"a":"3) As technology improves, 3D-printed houses will become cheaper and faster to build.","ev":"9번 문장","s":[[9,"As technology improves, 3D-printed houses will become cheaper and faster to build, and their quality will increase.","기술이 개선될수록, 3D 프린터로 만든 집은 더 저렴하고 빠르게 지을 수 있을 것이고, 그것의 품질은 높아질 것이다."]],"w":"9번에서 기술이 개선될수록 더 저렴하고 빠르게 지을 수 있고 품질도 높아진다고 해요. 짓는 데 하루가 걸리고(2번), 기초 구조물은 프린터가 짓는다고 해요(5번).","c":3},"h":"09370f552e"},{"n":9,"t":"sum","q":"Building a (B) home with a 3D printer (A) only about $10,000.","ko":"3D 프린터로 (B) 집을 짓는 데는 겨우 약 10,000달러가 (A).","oko":["A 든다 …… / B 완전히 새로운","A 아껴 준다 …… / B 낡은","A 든다 …… / B 낡은","A 번다 …… / B 완전히 새로운","A 아껴 준다 …… / B 부서진"],"opts":["(A) costs / (B) brand-new","(A) saves / (B) old","(A) costs / (B) old","(A) earns / (B) brand-new","(A) saves / (B) broken"],"r":{"a":"1) (A) costs / (B) brand-new (A 든다 …… / B 완전히 새로운)","ev":"8번 문장","s":[[8,"Best of all, it costs only about $10,000 to build a brand-new home!","무엇보다도, 완전히 새로운 집을 짓는 데 겨우 약 10,000달러가 든다!"]],"w":"8번 문장에서 완전히 새로운(brand-new) 집을 짓는 데 겨우 약 10,000달러가 든다(costs)고 해요.","c":1,"k":null},"h":"46391b6da7"},{"n":10,"t":"fill","q":"This structure is so [A] that the house can [B] extreme weather.","ko":"이 구조물은 매우 [A] 정도라서 그 집은 극심한 날씨를 [B] 수 있다.","bank":["strong","withstand","controlled","improve","earthquake","button"],"bko":{"strong":"튼튼한","withstand":"견디다","controlled":"제어된","improve":"개선되다","earthquake":"지진","button":"버튼"},"r":{"a":"[A] strong (튼튼한), [B] withstand (견디다)","ev":"6번 문장","s":[[6,"This structure is so strong that the house can withstand extreme weather.","이 구조물은 매우 튼튼해서 그 집은 극심한 날씨를 견딜 수 있다."]],"w":"6번에서 구조물이 매우 튼튼해서(so strong) 집이 극심한 날씨를 견딜 수(withstand) 있다고 해요.","c":null},"h":"bca4bed73b"}]},{"u":3,"id":"hk3-03-1","no":1,"ko":"매일매일이 설레는 이유","items":[{"n":1,"t":"tf","q":"There is a different gift behind each door of an Advent calendar.","ko":"강림절 달력의 각각의 문 뒤에는 서로 다른 선물이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It has 24 little “doors,” and there is a different gift behind each one.","이것에는 24개의 작은 ‘문’이 있고, 각각의 문 뒤에는 다른 선물이 있다."]],"w":"3번 문장에 there is a different gift behind each one(각각의 문 뒤에는 다른 선물이 있다)이 그대로 나와요.","c":"T"},"h":"cb0b643201"},{"n":2,"t":"tf","q":"You open all the doors of an Advent calendar on December 1.","ko":"당신은 12월 1일에 강림절 달력의 모든 문을 연다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"From December 1, you open one door a day.","12월 1일부터, 당신은 하루에 하나의 문을 연다."]],"w":"4번 문장에서 12월 1일부터 하루에 문 하나씩(one door a day) 연다고 해요. 한꺼번에 모두 여는 것이 아니에요.","c":"F"},"h":"a3ad110d63"},{"n":3,"t":"tf","q":"Beauty product samples can be behind the doors of an Advent calendar.","ko":"화장품 샘플이 강림절 달력의 문 뒤에 있을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Beauty product samples or popular character figures can be behind the doors!","화장품 샘플이나 인기 있는 캐릭터 인형들이 문 뒤에 있을 수 있다!"]],"w":"8번 문장에 Beauty product samples ... can be behind the doors!(화장품 샘플 ... 이 문 뒤에 있을 수 있다)라고 나와요.","c":"T"},"h":"0320f53843"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Usually, Advent calendars contain chocolates, sweets, or Christmas decorations.)","ko":"보통, 강림절 달력에는 초콜릿, 사탕, 또는 크리스마스 장식이 ( ).","opts":["담고 있다","팔고 있다","버리고 있다","빌려 주고 있다"],"word":"contain","r":{"a":"1) 담고 있다","ev":"6번 문장","s":[[6,"Usually, Advent calendars contain chocolates, sweets, or Christmas decorations.","보통, 강림절 달력에는 초콜릿, 사탕, 또는 크리스마스 장식이 들어 있다."]],"w":"6번 문장은 달력 안에 무엇이 들어 있는지 말해요. contain(담고 있다)은 안에 넣고 있다는 뜻이라서 '초콜릿, 사탕, 장식이 들어 있다'가 돼요.","c":1},"h":"0b01f4ab6d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (You can include whatever the receiver likes, so the handmade calendars are more personal.)","ko":"받는 사람이 좋아하는 무엇이든지 넣을 수 있어서, 수제 달력은 더 ( ) 느낌이다.","opts":["값비싼","평범한","개인적인","복잡한"],"word":"personal","r":{"a":"3) 개인적인","ev":"11번 문장","s":[[11,"You can include whatever the receiver likes, so the handmade calendars are more personal.","받는 사람이 좋아하는 무엇이든지 넣을 수 있어서, 수제 달력은 더 개인적이다."]],"w":"수제 달력에는 받는 사람이 좋아하는 것을 마음대로 넣을 수 있어요. 그래서 그 사람만을 위한 '개인적인' 달력이 되는 거예요.","c":3},"h":"367afc9177"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nYou can fill it with letters or photos and give it to your family or friends.","ko":"밑줄 친 it이 가리키는 것은?","sko":"당신은 그것을 편지나 사진으로 채워 가족이나 친구들에게 줄 수 있다.","opts":["24개의 작은 문","당신이 직접 만든 강림절 달력","크리스마스 장식","가족이나 친구들"],"r":{"a":"2) 당신이 직접 만든 강림절 달력","ev":"9~10번 문장","s":[[9,"You can also make your own Advent calendar.","당신은 또한 당신 자신의 강림절 달력을 만들 수 있다."],[10,"You can fill it with letters or photos and give it to your family or friends.","당신은 그것을 편지나 사진으로 채워 가족이나 친구들에게 줄 수 있다."]],"w":"편지나 사진으로 채워서 가족에게 주는 것은 9번에서 말한 '당신 자신의 강림절 달력'이에요. 10번의 it은 9번 문장의 own Advent calendar를 받은 말이에요.","c":2},"h":"b4f93b1605"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Advent calendars let you enjoy every day you spend waiting for Christmas.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"강림절 달력은 당신이 크리스마스를 기다리며 보내는 매일을 즐기게 해준다.","opts":["강림절 달력은 크리스마스를 기다리는 시간을 하루로 줄여 준다.","강림절 달력은 크리스마스 당일에만 열어 볼 수 있다.","강림절 달력은 크리스마스를 기다리는 일을 잊게 해준다.","강림절 달력은 크리스마스를 기다리는 날들을 매일 즐겁게 보내게 해준다."],"r":{"a":"4) 강림절 달력은 크리스마스를 기다리는 날들을 매일 즐겁게 보내게 해준다.","ev":"12번 문장","s":[[12,"Advent calendars let you enjoy every day you spend waiting for Christmas.","강림절 달력은 당신이 크리스마스를 기다리며 보내는 매일을 즐기게 해준다."]],"w":"let you enjoy는 '당신이 즐기게 해준다', every day you spend waiting for Christmas는 '크리스마스를 기다리며 보내는 매일'이에요. 기다리는 날들을 매일 즐겁게 해준다는 뜻이에요.","c":4},"h":"e7bcb60825"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["당신은 강림절 달력의 문을 크리스마스 당일에만 열 수 있다.","강림절 달력에는 초콜릿만 들어 있다.","당신은 크리스마스까지 매일 깜짝 선물을 받는다.","직접 만든 강림절 달력에는 주는 사람이 좋아하는 것만 넣어야 한다."],"opts":["You can open the doors of an Advent calendar only on Christmas Day.","Advent calendars contain only chocolates.","You get a surprise every day until Christmas.","A handmade Advent calendar should include only what the giver likes."],"r":{"a":"3) You get a surprise every day until Christmas. (당신은 크리스마스까지 매일 깜짝 선물을 받는다.)","ev":"5번 문장","s":[[5,"You receive a surprise every day until Christmas.","당신은 크리스마스까지 매일 깜짝 선물을 받는다."]],"w":"5번 문장에서 크리스마스까지 매일 깜짝 선물을 받는다고 해요.","c":3,"k":null},"h":"9df3552b19"},{"n":9,"t":"sum","q":"You can also (A) your (B) Advent calendar.","ko":"당신은 또한 당신 (B)의 강림절 달력을 (A) 수 있다.","oko":["A 만들 …… / B 자신","A 부술 …… / B 자신","A 만들 …… / B 잃어버린","A 잊어버릴 …… / B 잃어버린","A 부술 …… / B 낡은"],"opts":["(A) make / (B) own","(A) break / (B) own","(A) make / (B) lost","(A) forget / (B) lost","(A) break / (B) old"],"r":{"a":"1) (A) make / (B) own (A 만들 …… / B 자신)","ev":"9번 문장","s":[[9,"You can also make your own Advent calendar.","당신은 또한 당신 자신의 강림절 달력을 만들 수 있다."]],"w":"9번 문장은 당신 자신의(own) 강림절 달력을 만들(make) 수도 있다는 뜻이에요.","c":1,"k":null},"h":"aefb3c7b0c"},{"n":10,"t":"fill","q":"Sometimes, more special [A] are found [B] them.","ko":"가끔은, 더 특별한 [A]이(가) 그것들 [B] 발견된다.","bank":["items","inside","waiting","calendar","every","until"],"bko":{"items":"물건들","inside":"안에","waiting":"기다리는 것","calendar":"달력","every":"모든, 매","until":"~까지"},"r":{"a":"[A] items (물건들), [B] inside (안에)","ev":"7번 문장","s":[[7,"Sometimes, more special items are found inside them.","가끔은, 더 특별한 물건들이 그것 안에서 발견된다."]],"w":"7번 문장은 더 특별한 물건들(items)이 그것들 안에(inside) 들어 있기도 하다는 뜻이에요.","c":null,"k":null},"h":"4eeb9c5ad6"}]},{"u":3,"id":"hk3-03-2","no":2,"ko":"씹어서 예방해요!","items":[{"n":1,"t":"tf","q":"The S. mutans bacteria mistake xylitol for sugar and eat it.","ko":"뮤탄스균은 자일리톨을 설탕으로 착각하고 먹는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"For this reason, when you eat xylitol, the S. mutans bacteria mistake it for sugar and consume it.","이러한 이유 때문에, 당신이 자일리톨을 먹을 때, 뮤탄스균은 그것을 설탕으로 착각하고 먹는다."]],"w":"8번 문장에서 the S. mutans bacteria mistake it for sugar and consume it이라고 해요. 자일리톨을 설탕으로 착각해서 먹는다는 내용과 같아요.","c":"T"},"h":"75e0175dfc"},{"n":2,"t":"tf","q":"S. mutans can digest xylitol and get energy from it.","ko":"뮤탄스균은 자일리톨을 소화해서 그것으로부터 에너지를 얻을 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"But they cannot digest xylitol, so they get no energy from it.","하지만 그것들은 자일리톨을 소화하지 못해서, 자일리톨로부터 에너지를 얻지 못한다."]],"w":"9번 문장에서 they cannot digest xylitol, so they get no energy from it이라고 해요. 소화하지 못하고 에너지도 얻지 못하니 반대 내용이에요.","c":"F"},"h":"2dcd2d5c3a"},{"n":3,"t":"tf","q":"Some of the bacteria in your mouth cause tooth decay.","ko":"입안의 세균 중 일부는 충치를 일으킨다.","r":{"a":"T (본문과 맞는 내용)","ev":"1~2번 문장","s":[[1,"Many types of bacteria live in your mouth.","많은 종류의 세균이 당신의 입안에 산다."],[2,"Among them, there are harmful bacteria that cause tooth decay.","그것들 중에는, 충치를 유발하는 해로운 세균이 있다."]],"w":"1번에서 입안에 많은 종류의 세균이 산다고 하고, 2번에서 그중에 충치를 일으키는 해로운 세균이 있다고 해요.","c":"T"},"h":"8adf0b95c4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Among them, there are harmful bacteria that cause tooth decay.)","ko":"그것들 중에는, 충치를 일으키는 ( ) 세균이 있다.","opts":["유용한","새로운","해로운","귀여운"],"word":"harmful","r":{"a":"3) 해로운","ev":"2번 문장","s":[[2,"Among them, there are harmful bacteria that cause tooth decay.","그것들 중에는, 충치를 유발하는 해로운 세균이 있다."]],"w":"충치를 일으키는 세균이니 몸에 나쁜 세균이에요. harmful은 '해로운'이라는 뜻이에요.","c":3},"h":"96da45b3b8"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...the S. mutans bacteria mistake it for sugar and consume it.)","ko":"...뮤탄스균은 그것을 설탕으로 착각하고 그것을 ( ).","opts":["버린다","먹는다","만든다","숨긴다"],"word":"consume","r":{"a":"2) 먹는다","ev":"8번 문장","s":[[8,"For this reason, when you eat xylitol, the S. mutans bacteria mistake it for sugar and consume it.","이러한 이유 때문에, 당신이 자일리톨을 먹을 때, 뮤탄스균은 그것을 설탕으로 착각하고 먹는다."]],"w":"세균이 자일리톨을 설탕으로 착각하는 이유는 먹으려고 하기 때문이에요. consume은 여기서 '먹다'라는 뜻이고, 10번에서 먹으려는 시도(attempts to eat)로 이어져요.","c":2},"h":"8e79381460"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nBut they cannot digest xylitol, so they get no energy from it.","ko":"밑줄 친 they가 가리키는 것은?","sko":"하지만 그것들은 자일리톨을 소화하지 못해서, 자일리톨로부터 에너지를 얻지 못한다.","opts":["설탕","자일리톨","당신의 입","뮤탄스균"],"r":{"a":"4) 뮤탄스균","ev":"8~9번 문장","s":[[8,"For this reason, when you eat xylitol, the S. mutans bacteria mistake it for sugar and consume it.","이러한 이유 때문에, 당신이 자일리톨을 먹을 때, 뮤탄스균은 그것을 설탕으로 착각하고 먹는다."],[9,"But they cannot digest xylitol, so they get no energy from it.","하지만 그것들은 자일리톨을 소화하지 못해서, 자일리톨로부터 에너지를 얻지 못한다."]],"w":"자일리톨을 먹었다가 소화하지 못하는 쪽은 8번의 the S. mutans bacteria(뮤탄스균)예요. 9번의 they는 그 세균들을 받은 말이에요.","c":4},"h":"2ed5c7f2c7"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In other words, xylitol causes them to starve to death!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"다시 말해서, 자일리톨은 그것들이 굶어 죽도록 만든다!","opts":["자일리톨은 세균이 굶어 죽게 만든다.","자일리톨은 세균에게 더 많은 먹이를 준다.","자일리톨은 세균을 빠르게 자라게 한다.","자일리톨은 세균을 설탕으로 바꾼다."],"r":{"a":"1) 자일리톨은 세균이 굶어 죽게 만든다.","ev":"11번 문장","s":[[11,"In other words, xylitol causes them to starve to death!","다시 말해서, 자일리톨은 그것들이 굶어 죽도록 만든다!"]],"w":"「cause + 목적어 + to-v」는 '~가 …하도록 만들다'예요. xylitol causes them to starve to death는 '자일리톨이 세균을 굶어 죽게 만든다'예요.","c":1},"h":"ed0af2c70e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["자일리톨은 뮤탄스균이 쉽게 소화하는 설탕이다.","뮤탄스균은 자일리톨로부터 에너지를 얻는다.","뮤탄스균은 보통 당신이 먹는 음식에 있는 설탕으로부터 에너지를 얻는다.","해로운 세균은 입안에 전혀 살지 않는다."],"opts":["Xylitol is a sugar that S. mutans digests easily.","S. mutans gets energy from xylitol.","S. mutans usually gets energy from the sugar in the food you eat.","Harmful bacteria never live in your mouth."],"r":{"a":"3) S. mutans usually gets energy from the sugar in the food you eat. (뮤탄스균은 보통 당신이 먹는 음식에 있는 설탕으로부터 에너지를 얻는다.)","ev":"4번 문장","s":[[4,"This type of bacteria usually gets energy from the sugar in the food you eat.","이러한 종류의 세균은 보통 당신이 먹는 음식에 있는 설탕으로부터 에너지를 얻는다."]],"w":"4번 문장에서 이 세균은 보통 음식 속 설탕으로부터 에너지를 얻는다고 해요.","c":3,"k":null},"h":"2c49a73b96"},{"n":9,"t":"sum","q":"Xylitol is a natural (A) with chemical (B) similar to those of sugar.","ko":"자일리톨은 설탕과 비슷한 화학적 (B)을(를) 가진 천연 (A)이다.","oko":["A 감미료 …… / B 성질","A 감미료 …… / B 색깔","A 음료 …… / B 성질","A 음료 …… / B 색깔","A 약 …… / B 크기"],"opts":["(A) sweetener / (B) qualities","(A) sweetener / (B) colors","(A) drink / (B) qualities","(A) drink / (B) colors","(A) medicine / (B) sizes"],"r":{"a":"1) (A) sweetener / (B) qualities (A 감미료 …… / B 성질)","ev":"6~7번 문장","s":[[6,"It’s a natural sweetener called xylitol.","그것은 자일리톨이라고 불리는 천연 감미료이다."],[7,"It has chemical qualities similar to those of sugar.","그것은 설탕과 비슷한 화학적 성질을 가진다."]],"w":"6~7번 문장에서 자일리톨은 천연 감미료(sweetener)이고 설탕과 비슷한 화학적 성질(qualities)을 가진다고 해요.","c":1,"k":null},"h":"ee3672ede3"},{"n":10,"t":"fill","q":"After a few [A] to eat xylitol, the bacteria [B] run out of energy, die, and fall out of your mouth.","ko":"자일리톨을 먹으려는 몇 번의 [A] 후에, 그 세균은 [B] 에너지를 다 써버리고, 죽어서, 입에서 떨어져 나온다.","bank":["attempts","finally","mouth","harmful","natural","digest"],"bko":{"attempts":"시도(복수)","finally":"마침내","mouth":"입","harmful":"해로운","natural":"천연의","digest":"소화하다"},"r":{"a":"[A] attempts (시도(복수)), [B] finally (마침내)","ev":"10번 문장","s":[[10,"After a few attempts to eat xylitol, the bacteria finally run out of energy, die, and fall out of your mouth.","자일리톨을 먹으려는 몇 차례 시도 후에, 그 세균은 마침내 에너지를 다 써버리고, 죽어서, 당신의 입에서 떨어져 나온다."]],"w":"10번 문장은 자일리톨을 먹으려는 몇 번의 시도(attempts) 후에 세균이 마침내(finally) 에너지를 다 써버린다는 뜻이에요.","c":null,"k":null},"h":"915b3dc1c6"}]},{"u":3,"id":"hk3-03-3","no":3,"ko":"현금은 됐어요, 정말로요!","items":[{"n":1,"t":"tf","q":"In China, people can pay for things by scanning a QR code with their phones.","ko":"중국에서, 사람들은 휴대폰으로 QR 코드를 스캔해서 물건값을 지불할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","s":[[3,"Instead, she scans a QR code with her phone, and the payment is made!","대신에, 그녀가 휴대폰으로 QR 코드를 스캔하면, 결제가 이루어진다!"],[4,"In China, this is a common method for buying things.","중국에서, 이것은 물건을 사는 흔한 방식이다."]],"w":"3번에서 휴대폰으로 QR 코드를 스캔하면 결제가 이루어지고, 4번에서 중국에서는 이것이 물건을 사는 흔한 방식이라고 해요.","c":"T"},"h":"f5617494e0"},{"n":2,"t":"tf","q":"After scanning a QR code, users must pay with cash.","ko":"QR 코드를 스캔한 뒤, 사용자들은 현금으로 지불해야 한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Apps such as AliPay and WeChat Pay are connected to users’ bank accounts, and their payments are automatically transferred when they scan the QR codes.","AliPay와 WeChat Pay 같은 앱들은 사용자들의 은행 계좌에 연결되어 있고, 그들의 결제 금액은 그들이 QR 코드를 스캔할 때 자동으로 옮겨진다."]],"w":"5번에서 QR 코드를 스캔하면 결제 금액이 자동으로 옮겨진다고 해요. 현금으로 따로 내야 한다는 말은 없어요.","c":"F"},"h":"b511f8fe8f"},{"n":3,"t":"tf","q":"Street performers and musicians in China also accept tips this way.","ko":"중국의 거리공연가들과 음악가들도 이 방식으로 팁을 받는다.","r":{"a":"T (본문과 맞는 내용)","ev":"8번 문장","s":[[8,"Even street performers and musicians accept tips this way.","심지어 거리공연가들과 음악가들도 이 방식으로 팁을 받는다."]],"w":"8번에 Even street performers and musicians accept tips this way라고 나와요. this way는 QR 코드 결제 방식이에요.","c":"T"},"h":"8e231948c9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...their payments are automatically transferred when they scan the QR codes.)","ko":"...그들의 결제 금액은 그들이 QR 코드를 스캔할 때 ( ) 옮겨진다.","opts":["천천히","자동으로","직접","가끔"],"word":"automatically","r":{"a":"2) 자동으로","ev":"5번 문장","s":[[5,"Apps such as AliPay and WeChat Pay are connected to users’ bank accounts, and their payments are automatically transferred when they scan the QR codes.","AliPay와 WeChat Pay 같은 앱들은 사용자들의 은행 계좌에 연결되어 있고, 그들의 결제 금액은 그들이 QR 코드를 스캔할 때 자동으로 옮겨진다."]],"w":"스캔만 하면 앱이 은행 계좌와 연결되어 있어서 따로 하지 않아도 돈이 옮겨져요. automatically는 '자동으로'라는 뜻이에요.","c":2},"h":"e2f16e7506"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This not only makes it unnecessary to carry around cash or credit cards...)","ko":"이것은 현금이나 신용카드를 가지고 다니는 것을 ( ) 만들 뿐만 아니라...","opts":["위험한","어려운","귀찮은","불필요한"],"word":"unnecessary","r":{"a":"4) 불필요한","ev":"6번 문장","s":[[6,"This not only makes it unnecessary to carry around cash or credit cards but also makes processing payments much faster and simpler.","이것은 현금이나 신용카드를 가지고 다니는 것을 불필요하게 만들 뿐만 아니라 결제를 처리하는 것을 훨씬 더 빠르고 간편하게 만들기도 한다."]],"w":"QR 결제를 하면 현금이나 카드를 가지고 다닐 필요가 없어요. 그래서 unnecessary는 '불필요한(필요 없는)'이라는 뜻이에요.","c":4},"h":"349c7aadda"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nMany believe it will soon become the main form of payment in other parts of the world, too.","ko":"밑줄 친 it이 가리키는 것은?","sko":"많은 이들은 그것이 곧 세계의 다른 지역들에서도 주된 결제 형태가 될 것이라고 믿는다.","opts":["복숭아 바구니","QR 코드를 이용한 결제 기술","중국의 은행 계좌","거리공연가들의 팁"],"r":{"a":"2) QR 코드를 이용한 결제 기술","ev":"7, 9번 문장","s":[[7,"Now, the technology is so popular that it can be seen all across the country.","현재, 그 기술은 매우 인기 있어서 전국 곳곳에서 보일 수 있다."],[9,"Many believe it will soon become the main form of payment in other parts of the world, too.","많은 이들은 그것이 곧 세계의 다른 지역들에서도 주된 결제 형태가 될 것이라고 믿는다."]],"w":"7번에서 전국 곳곳에서 보이는 the technology는 QR 코드 결제 기술이에요. 9번의 it은 이 기술을 받아서 '세계 다른 곳에서도 주된 결제 형태가 될 것'이라는 뜻이에요.","c":2},"h":"3f83a199d5"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Now, the technology is so popular that it can be seen all across the country.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"현재, 그 기술은 매우 인기 있어서 전국 곳곳에서 보일 수 있다.","opts":["그 기술은 너무 인기가 없어서 거의 볼 수 없다.","그 기술은 매우 인기가 있어서 한 도시에서만 볼 수 있다.","그 기술은 매우 인기가 있어서 전국 곳곳에서 볼 수 있다.","그 기술은 인기가 있지만 전국 곳곳에서 볼 수는 없다."],"r":{"a":"3) 그 기술은 매우 인기가 있어서 전국 곳곳에서 볼 수 있다.","ev":"7번 문장","s":[[7,"Now, the technology is so popular that it can be seen all across the country.","현재, 그 기술은 매우 인기 있어서 전국 곳곳에서 보일 수 있다."]],"w":"「so + 형용사 + that절」은 '매우 ~해서 …하다'예요. 매우 인기 있어서 전국 곳곳(all across the country)에서 볼 수 있다는 뜻이에요.","c":3},"h":"e634c64a39"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["식료품점의 여성은 계산대에 가서 결제한다.","QR 코드 결제는 중국의 몇몇 가게에서만 쓰인다.","사람들은 QR 코드 결제가 다른 나라에는 퍼지지 않을 것이라고 생각한다.","AliPay와 WeChat Pay 같은 앱은 사용자들의 은행 계좌에 연결되어 있다."],"opts":["The woman in the story goes to a checkout counter to pay.","QR code payment is used only in a few stores in
