ea":"벼룩"},"r":{"a":"[A] epidemic, [B] population","ev":"1번 문장","s":[[1,"In the 14th century, a deadly epidemic known as the Black Death swept across Europe, claiming nearly a third of the continent’s population.","14세기에, 흑사병으로 알려진 치명적인 전염병이 그 대륙 인구의 거의 3분의 1을 앗아가면서 유럽 전역을 휩쓸었다."]],"w":"1번에서 흑사병은 유럽을 휩쓴 전염병(epidemic)이고, 유럽 인구(population)의 거의 3분의 1을 앗아갔어요. outfit, herbs, beak는 뒤에 나오는 의사들의 복장 이야기이고, flea는 5번의 전염 경로라서 이 자리에 맞지 않아요.","c":null},"h":"0247d79d2a"}]},{"u":6,"id":"ms1-06-3","no":3,"ko":"간지럼은 남로내불?!","items":[{"n":1,"t":"tf","q":"When someone else tickles a person, brain areas related to touch, emotions, and pleasure become active.","ko":"누군가가 사람을 간지럽힐 때, 촉각, 감정, 쾌락과 관련된 뇌 영역이 활성화된다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Brain scans of people being tickled show activation in brain areas related to touch, emotions, and pleasure.","간지럼을 당하는 사람들의 뇌 스캔은 촉각, 감정, 그리고 쾌락과 관련된 뇌 영역들의 활성화를 보여준다."]],"w":"6번에서 간지럼을 당하는 사람들의 뇌 스캔은 촉각, 감정, 쾌락과 관련된 뇌 영역의 활성화를 보여 줘요. 진술문과 같은 내용이에요.","c":"T"},"h":"55d3953633"},{"n":2,"t":"tf","q":"Most people find it easy to tickle themselves because of the way the brain processes touch.","ko":"대부분의 사람들은 뇌가 접촉을 처리하는 방식 때문에 스스로를 간지럽히는 것이 쉽다고 알게 된다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Most will find it impossible, and the reason lies in how the brain processes touch.","대부분은 그것이 불가능하다는 것을 알게 될 것인데, 그 이유는 뇌가 접촉을 처리하는 방식에 있다."]],"w":"4번에서 대부분은 스스로 간지럽히는 것이 불가능하다고 알게 되고, 그 이유가 뇌가 접촉을 처리하는 방식에 있다고 해요. 진술문은 '쉽다'로 바꿔 놓았어요.","c":"F"},"h":"c7388db0dc"},{"n":3,"t":"tf","q":"The cerebellum helps the brain areas responsible for touch and pleasure activate even more strongly.","ko":"소뇌는 촉각과 쾌락을 담당하는 뇌 영역이 훨씬 더 강하게 활성화되도록 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"As a result, it stops the brain areas responsible for touch and pleasure from activating.","그 결과, 그것은 촉각과 쾌락을 담당하는 뇌 영역들이 활성화되는 것을 막는다."]],"w":"10번에서 소뇌는 촉각과 쾌락을 담당하는 뇌 영역이 활성화되는 것을 막아요(stops ... from activating). 돕는다는 말은 정반대예요.","c":"F"},"h":"c6d8d21e1d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Instantly, uncontrollable laughter erupts, as if that hidden “laugh spot” had been waiting for the perfect tickle!)","ko":"즉시, 마치 숨겨져 있던 ‘웃음 포인트’가 그 완벽한 간지럼을 기다려 왔던 것처럼 주체할 수 없는 웃음이 터져 나온다!","word":"erupts","opts":["사라진다","멈춘다","숨겨진다","터져 나온다"],"r":{"a":"4) 터져 나온다","ev":"2번 문장","s":[[2,"Instantly, uncontrollable laughter erupts, as if that hidden “laugh spot” had been waiting for the perfect tickle!","즉시, 마치 숨겨져 있던 ‘웃음 포인트’가 그 완벽한 간지럼을 기다려 왔던 것처럼 주체할 수 없는 웃음이 터져 나온다!"]],"w":"2번은 간지럼을 당하자마자 주체할 수 없는 웃음이 갑자기 나오는 장면이에요. 그래서 erupts는 '터져 나온다'예요.","c":4},"h":"a4535ce2db"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… ensuring we stay more sensitive to unexpected touches that might require our attention.)","ko":"… 우리의 주의를 필요로 할 수 있는 예상치 못한 접촉에 우리가 더 민감하게 반응할 수 있도록 해준다.","word":"sensitive","opts":["둔감한","민감한","무관심한","두려워하는"],"r":{"a":"2) 민감한","ev":"11번 문장","s":[[11,"This mechanism helps the brain distinguish between sensations caused by our own actions and those coming from the outside world, ensuring we stay more sensitive to unexpected touches that might require our attention.","이 메커니즘은 뇌가 우리 자신의 행동에 의해 발생한 감각들과 외부 세계로부터 오는 그것들을 구분하도록 돕고, 우리의 주의를 필요로 할 수 있는 예상치 못한 접촉에 우리가 더 민감하게 반응할 수 있도록 해준다."]],"w":"11번은 예상치 못한 접촉에 더 잘 반응하게 해 준다는 좋은 점을 말해요. stay more sensitive는 '더 민감한 상태를 유지하다'라서 sensitive는 '민감한'이에요.","c":2},"h":"9b34832a9b"},{"n":6,"t":"ref","q":"What does the underlined \"These activated regions\" refer to?\nThese activated regions process the tickling sensation and lead to laughter.","ko":"밑줄 친 These activated regions가 가리키는 것은?","sko":"이 활성화된 영역들은 간지럼의 감각을 처리하고 웃음을 유발한다.","opts":["손과 겨드랑이","소뇌의 근육","간지럼을 당하는 사람의 뇌에서 활성화된 부분들","간지럼을 당하는 사람들"],"r":{"a":"3) 간지럼을 당하는 사람의 뇌에서 활성화된 부분들","ev":"6~7번 문장","s":[[6,"Brain scans of people being tickled show activation in brain areas related to touch, emotions, and pleasure.","간지럼을 당하는 사람들의 뇌 스캔은 촉각, 감정, 그리고 쾌락과 관련된 뇌 영역들의 활성화를 보여준다."],[7,"These activated regions process the tickling sensation and lead to laughter.","이 활성화된 영역들은 간지럼의 감각을 처리하고 웃음을 유발한다."]],"w":"7번의 These activated regions는 바로 앞 6번에서 활성화를 보인 뇌 영역들을 가리켜요. 손과 겨드랑이는 1번의 장면이고, 소뇌는 8번에 나와요.","c":3,"k":"These activated regions = 간지럼을 당하는 사람의 뇌에서 활성화된 부분들"},"h":"ac245120f4"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"On the other hand, in the case of self-tickling, the cerebellum —the part of the brain responsible for body and muscle control— becomes active.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"반면에, 스스로를 간지럽히는 경우, 신체 및 근육 제어를 담당하는 뇌 부위인 소뇌가 활성화된다.","opts":["스스로를 간지럽히는 경우에는 신체와 근육 제어를 담당하는 뇌 부위인 소뇌가 활성화된다.","스스로를 간지럽히는 경우에는 소뇌가 활동을 멈추고 근육이 움직이지 않는다.","소뇌는 다른 사람이 간지럽힐 때만 신체와 근육을 제어하기 위해 활성화된다.","스스로를 간지럽히면 촉각을 담당하는 뇌 영역이 소뇌로 대체된다."],"r":{"a":"1) 스스로를 간지럽히는 경우에는 신체와 근육 제어를 담당하는 뇌 부위인 소뇌가 활성화된다.","ev":"8번 문장","s":[[8,"On the other hand, in the case of self-tickling, the cerebellum —the part of the brain responsible for body and muscle control— becomes active.","반면에, 스스로를 간지럽히는 경우, 신체 및 근육 제어를 담당하는 뇌 부위인 소뇌가 활성화된다."]],"w":"8번에서 스스로 간지럽히는 경우에는 몸과 근육 제어를 담당하는 소뇌가 활성화된다고 해요. 소뇌가 멈추거나 다른 사람이 간지럽힐 때만 움직인다는 말은 없어요.","c":1},"h":"43bfe4f3b1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["손 하나가 갑자기 몰래 당신의 겨드랑이 쪽으로 다가온다.","친구가 뒤에서 큰 소리로 당신의 이름을 부른다.","누군가가 앞에서 당신의 어깨를 부드럽게 두드린다.","손 하나가 당신의 겨드랑이에서 천천히 멀어진다."],"opts":["A hand suddenly and quietly comes up toward your armpit.","A friend loudly calls your name from behind.","Someone gently pats your shoulder from the front.","A hand slowly moves away from your armpit."],"r":{"a":"1) A hand suddenly and quietly comes up toward your armpit. (손 하나가 갑자기 몰래 당신의 겨드랑이 쪽으로 다가온다.)","ev":"1번 문장","s":[[1,"Out of nowhere, a hand sneaks up under your armpit.","어디선가 갑자기, 당신의 겨드랑이 밑으로 손이 슬며시 다가온다."]],"w":"1번에서 어디선가 갑자기 손 하나가 겨드랑이 밑으로 슬며시 다가온다고 해요. 큰 소리로 부르는 친구, 어깨를 두드리는 사람, 멀어지는 손은 본문에 없어요.","c":1},"h":"94ee2e0cbd"},{"n":9,"t":"sum","q":"When someone else tickles us, the touch is (A), and this plays a (B) role.","ko":"누군가가 우리를 간지럽힐 때 그 접촉은 (A) 것이고, 이것이 (B) 역할을 한다.","oko":["(A) 예측 가능한 / (B) 핵심적인","(A) 예측 불가능한 / (B) 사소한","(A) 예측 가능한 / (B) 사소한","(A) 예측 불가능한 / (B) 핵심적인","(A) 해로운 / (B) 핵심적인"],"opts":["(A) predictable / (B) key","(A) unpredictable / (B) minor","(A) predictable / (B) minor","(A) unpredictable / (B) key","(A) harmful / (B) key"],"r":{"a":"4) (A) unpredictable / (B) key (예측 불가능한 / 핵심적인)","ev":"5번 문장","s":[[5,"When someone else tickles us, the unpredictability of the touch plays a key role.","누군가가 우리를 간지럽힐 때, 그 접촉의 예측 불가능성이 핵심적인 역할을 한다."]],"w":"5번에서 누군가가 우리를 간지럽힐 때 그 접촉의 예측 불가능성(unpredictability)이 핵심적인(key) 역할을 한다고 해요. 예측 가능한, 사소한, 해로운은 본문과 맞지 않아요.","c":4},"h":"e09cc81b78"},{"n":10,"t":"fill","q":"The cerebellum is highly [A] of our bodily [B], allowing us to expect that we are about to tickle ourselves.","ko":"소뇌는 우리의 신체 [B]에 대해 매우 [A] 상태여서, 우리가 막 스스로를 간지럽히려 하는 참이라는 것을 예상할 수 있게 한다.","bank":["aware","movements","armpit","laughter","hidden","perfect"],"bko":{"aware":"인지하는","movements":"움직임","armpit":"겨드랑이","laughter":"웃음","hidden":"숨겨진","perfect":"완벽한"},"r":{"a":"[A] aware (인지하는), [B] movements (움직임)","ev":"9번 문장","s":[[9,"The cerebellum is highly aware of our bodily movements, allowing us to expect that we are about to tickle ourselves.","소뇌는 우리의 신체 움직임을 매우 잘 인지하여, 우리가 막 스스로를 간지럽히려 하는 참이라는 것을 예상할 수 있게 한다."]],"w":"9번에서 소뇌는 우리 신체의 움직임(movements)을 매우 잘 인지하고(aware) 있어서 스스로 간지럽히려는 것을 미리 예상할 수 있어요. armpit, laughter는 1~2번의 장면이고 hidden, perfect는 2번에 나온 다른 표현이라 이 자리에 맞지 않아요.","c":null},"h":"7de768eaa6"}]},{"u":6,"id":"ms1-06-4","no":4,"ko":"Keep Your Hands Off Mickey!","items":[{"n":1,"t":"tf","q":"Mickey Mouse’s first copyright, which began with the film Steamboat Willie in 1928, lasted for 56 years.","ko":"1928년 영화 <증기선 윌리>와 함께 시작된 미키마우스의 최초 저작권은 56년 동안 유지되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"When this character first appeared in the 1928 film Steamboat Willie, its original copyright was valid for 56 years.","이 캐릭터가 1928년 영화 <증기선 윌리>에 처음 등장했을 때, 그것의 최초 저작권은 56년 동안 유효했다."]],"w":"5번에서 이 캐릭터가 1928년 영화 <증기선 윌리>에 처음 나왔을 때 최초 저작권은 56년 동안 유효했어요. 진술문과 같은 내용이에요.","c":"T"},"h":"40b8b027d2"},{"n":2,"t":"tf","q":"In the 1970s, Disney asked Congress to shorten the copyright protection of Mickey Mouse.","ko":"1970년대에 디즈니는 의회에 미키마우스의 저작권 보호를 단축해 달라고 요청했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"However, in the 1970s, Disney lobbied Congress to extend this protection.","하지만, 1970년대에 디즈니는 이 보호를 연장하기 위해 의회에 로비를 했다."]],"w":"7번에서 디즈니는 의회에 로비해 이 보호를 연장(extend)하려고 했어요. 단축해 달라는 것은 정반대예요.","c":"F"},"h":"a7cac83211"},{"n":3,"t":"tf","q":"After 2024, only Disney could use the original version of Mickey Mouse from Steamboat Willie.","ko":"2024년 이후에는 오직 디즈니만이 <증기선 윌리>에 나온 미키마우스의 최초 버전을 사용할 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"In 2024, the original version of the character from Steamboat Willie entered the public domain, making it free for anyone to use without permission.","2024년에, <증기선 윌리>에 나온 캐릭터의 최초 버전은 공공 영역에 진입하여, 누구나 그것을 허가 없이 자유롭게 사용할 수 있게 했다."]],"w":"11번에서 2024년에 최초 버전이 공공 영역에 들어가서 누구나 허가 없이 자유롭게 쓸 수 있게 되었어요. 디즈니만 쓸 수 있다는 말은 틀려요.","c":"F"},"h":"492a329d4c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… resulting in the passage of the Mickey Mouse Protection Act in 1998.)","ko":"… 1998년 미키마우스 보호법의 통과라는 결과를 낳았다.","word":"passage","opts":["폐지","통과","낭독","설명"],"r":{"a":"2) 통과","ev":"9번 문장","s":[[9,"Even more lobbying followed in the 1990s, resulting in the passage of the Mickey Mouse Protection Act in 1998.","훨씬 더 많은 로비가 1990년대에 이어졌고, 1998년 미키마우스 보호법의 통과라는 결과를 낳았다."]],"w":"로비의 결과로 1998년에 미키마우스 보호법이 만들어졌어요. 그래서 the passage of the Act는 법안의 '통과'예요.","c":2},"h":"b2addf2917"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This guaranteed Disney’s rights to Mickey Mouse until the end of 2023.)","ko":"이것은 2023년 말까지 미키마우스에 대한 디즈니의 권리를 보장했다.","word":"guaranteed","opts":["의심했다","금지했다","보장했다","양도했다"],"r":{"a":"3) 보장했다","ev":"10번 문장","s":[[10,"This guaranteed Disney’s rights to Mickey Mouse until the end of 2023.","이것은 2023년 말까지 미키마우스에 대한 디즈니의 권리를 보장했다."]],"w":"1998년 법이 통과된 결과로 디즈니의 권리가 2023년 말까지 지켜지게 되었어요. 그래서 guaranteed는 '보장했다'예요.","c":3},"h":"2116e9a738"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nTheir efforts paid off in 1976 when they successfully ensured their ownership for an additional 19 years.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그들의 노력은 그들이 그들의 소유권을 성공적으로 추가로 19년 동안 확보했던 1976년에 결실을 맺었다.","opts":["디즈니","의회","미키마우스의 팬들","영화 제작자들"],"r":{"a":"1) 디즈니","ev":"7~8번 문장","s":[[7,"However, in the 1970s, Disney lobbied Congress to extend this protection.","하지만, 1970년대에 디즈니는 이 보호를 연장하기 위해 의회에 로비를 했다."],[8,"Their efforts paid off in 1976 when they successfully ensured their ownership for an additional 19 years.","그들의 노력은 그들이 그들의 소유권을 성공적으로 추가로 19년 동안 확보했던 1976년에 결실을 맺었다."]],"w":"7번에서 로비를 한 것은 Disney이고, 8번의 Their efforts는 그 노력을 말해요. when they ensured their ownership의 they는 소유권을 확보한 디즈니예요. 의회(Congress)는 로비를 받은 대상이에요.","c":1},"h":"103d8c0918"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The company valued him so much that it strived to make a law to protect him!\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 회사는 그를 너무 소중하게 여겨서 그것은 그를 보호하기 위한 법을 만들기 위해 노력했다!","opts":["디즈니는 미키마우스를 너무 소중하게 여겨서 그를 보호하기 위한 법을 만들려고 노력했다.","디즈니는 미키마우스가 너무 유명해져서 그를 위한 법을 바꾸려고 했다.","디즈니는 미키마우스를 보호하는 법 때문에 그를 소중하게 여기게 되었다.","디즈니는 미키마우스를 소중하게 여기지 않아서 법을 만들려는 노력을 포기했다."],"r":{"a":"1) 디즈니는 미키마우스를 너무 소중하게 여겨서 그를 보호하기 위한 법을 만들려고 노력했다.","ev":"3번 문장","s":[[3,"The company valued him so much that it strived to make a law to protect him!","그 회사는 그를 너무 소중하게 여겨서 그것은 그를 보호하기 위한 법을 만들기 위해 노력했다!"]],"w":"3번에서 디즈니는 미키마우스를 너무 소중하게 여겨서(valued him so much) 그를 보호하는 법을 만들려고 노력했다고 해요. 법 때문에 소중하게 여기게 된 것이 아니고, 노력을 포기하지도 않았어요.","c":1},"h":"d968375dda"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["디즈니의 창작자들도 모두가 그렇듯 미키마우스를 사랑한다.","디즈니의 창작자들은 미키마우스에 싫증이 났다.","미키마우스는 어린이들만 사랑한다.","디즈니의 창작자들은 미키마우스 영화를 그만 만들고 싶어 했다."],"opts":["Disney’s creators love Mickey Mouse too, just as everyone does.","Disney’s creators were tired of Mickey Mouse.","Only children love Mickey Mouse.","Disney’s creators wanted to stop making Mickey Mouse films."],"r":{"a":"1) Disney’s creators love Mickey Mouse too, just as everyone does. (디즈니의 창작자들도 모두가 그렇듯 미키마우스를 사랑한다.)","ev":"1~2번 문장","s":[[1,"Everyone loves Mickey Mouse.","모두가 미키마우스를 사랑한다."],[2,"And so do his creators at Disney.","그리고 디즈니의 창작자들 또한 그러하다."]],"w":"1~2번에서 모두가 미키마우스를 사랑하고, 디즈니의 창작자들 또한 그렇다고 해요. 싫증이 났다, 어린이들만 사랑한다, 영화를 그만 만들고 싶어 했다는 말은 본문에 없어요.","c":1},"h":"4aba3a1208"},{"n":9,"t":"sum","q":"Until 1984, only Disney had (A) rights to make a (B) from Mickey Mouse.","ko":"1984년까지 오직 디즈니만이 미키마우스로 (B)을(를) 낼 (A) 권리를 가졌다.","oko":["(A) 공유된 / (B) 이익","(A) 독점적인 / (B) 손실","(A) 제한된 / (B) 손실","(A) 독점적인 / (B) 이익","(A) 공유된 / (B) 손실"],"opts":["(A) shared / (B) profit","(A) exclusive / (B) loss","(A) limited / (B) loss","(A) exclusive / (B) profit","(A) shared / (B) loss"],"r":{"a":"4) (A) exclusive / (B) profit (독점적인 / 이익)","ev":"6번 문장","s":[[6,"This meant Disney had exclusive rights to profit from the use of Mickey Mouse until 1984.","이것은 디즈니가 1984년까지 미키마우스의 사용으로부터 이익을 얻을 독점적 권리를 가졌음을 의미했다."]],"w":"6번에서 디즈니는 1984년까지 미키마우스의 사용으로 이익(profit)을 얻을 독점적(exclusive) 권리를 가졌다고 해요. 공유된, 제한된, 손실은 본문과 맞지 않아요.","c":4},"h":"2337673c43"},{"n":10,"t":"fill","q":"While this act has been [A], many criticized it for extending copyrights only to benefit large [B] like Disney.","ko":"이 법은 디즈니와 같은 대형 [B]에게만 이익이 되도록 저작권을 연장한다는 이유로 많은 사람들이 비판하면서 [A] 법이 되어 왔다.","bank":["controversial","corporations","intellectual","additional","ownership","passage"],"bko":{"controversial":"논란이 많은","corporations":"기업","intellectual":"지적인","additional":"추가의","ownership":"소유권","passage":"통과"},"r":{"a":"[A] controversial, [B] corporations","ev":"12번 문장","s":[[12,"While this act has been controversial, as many criticized it for extending copyrights only to benefit large corporations like Disney, some people view it as highlighting the importance of protecting intellectual property within the entertainment industry.","이 법은 디즈니와 같은 대기업에게만 이익이 되도록 저작권을 연장한다는 이유로 많은 사람들이 그것을 비판하면서 논란이 되어 왔지만, 일부 사람들은 그것을 엔터테인먼트 산업 내에서 지적 재산권을 보호하는 것의 중요성을 강조하는 것으로 본다."]],"w":"12번에서 이 법은 대기업에게만 이익이 된다는 비판 때문에 논란이 되는(controversial) 법이고, 디즈니 같은 대기업(corporations)이 언급돼요. intellectual, additional, ownership, passage는 이 문장 앞뒤에서 맞지 않아요.","c":null},"h":"a20c8146bf"}]},{"u":7,"id":"ms1-07-1","no":1,"ko":"어른이 되기 싫은 피터 팬들","items":[{"n":1,"t":"tf","q":"People with Peter Pan Syndrome tend to depend heavily on their family members.","ko":"피터 팬 증후군을 앓는 사람들은 가족 구성원들에게 크게 의존하는 경향이 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"They tend to rely heavily on family members to cope with the challenges of everyday life.","그들은 일상생활의 어려움에 대처하기 위해 가족 구성원들에게 크게 의존하는 경향이 있다."]],"w":"5번에서 이 사람들은 일상생활의 어려움에 대처하려고 가족 구성원들에게 크게 의존하는 경향이 있다고 해요. rely heavily on을 depend heavily on으로 바꿔 쓴 같은 뜻이에요.","c":"T"},"h":"57a4f2e161"},{"n":2,"t":"tf","q":"People with Peter Pan Syndrome are eager to take on adult responsibilities.","ko":"피터 팬 증후군을 앓는 사람들은 성인의 책임을 떠맡기를 열망한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"They are reluctant to embrace adult responsibilities, which makes it challenging to navigate the demands of adult life.","그들은 성인의 책임을 받아들이기를 꺼려 하는데, 이는 성인 생활의 요구들을 헤쳐 나가는 것을 어렵게 만든다."]],"w":"6번에서 이 사람들은 성인의 책임을 받아들이기를 꺼려 한다(reluctant)고 해요. 열망한다(eager)는 반대 내용이에요.","c":"F"},"h":"4ab6d3f9b7"},{"n":3,"t":"tf","q":"Parents’ protection in the teenage years gives adolescents more chances to make important decisions.","ko":"십 대 시절 부모의 보호는 청소년들에게 중요한 결정을 내릴 기회를 더 많이 준다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Especially, when parents are overly protective during their children’s teenage years, it can limit adolescents’ opportunities to make important decisions and face the consequences of their mistakes.","특히, 부모가 자녀의 십 대 시절 동안 과잉보호할 때, 그것은 청소년들이 중요한 결정을 내리고 그들 실수의 결과에 직면할 기회를 제한할 수 있다."]],"w":"8번에서 부모가 과잉보호하면 청소년이 중요한 결정을 내리고 실수의 결과에 직면할 기회가 제한된다고 해요. 기회가 늘어난다는 말은 반대예요.","c":"F"},"h":"af0d7f3528"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Individuals suffering from Peter Pan Syndrome generally exhibit immature behavior.)","ko":"피터 팬 증후군을 앓는 개인들은 일반적으로 미성숙한 행동을 보인다.","opts":["감춘다","보인다","고친다","흉내 낸다"],"word":"exhibit","r":{"a":"2) 보인다","ev":"4번 문장","s":[[4,"Individuals suffering from Peter Pan Syndrome generally exhibit immature behavior.","피터 팬 증후군을 앓고 있는 개인들은 일반적으로 미성숙한 행동을 보인다."]],"w":"4번에서 이 사람들이 미성숙한 행동을 ‘보인다(드러낸다)’는 뜻이에요. 5번과 6번이 그 행동을 구체적으로 설명해 줘요.","c":2},"h":"4d0560b766"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They seem to echo the wishes of many “Peter Pans” in our society!)","ko":"그들은 우리 사회의 많은 “피터 팬들”의 소망을 반영하는 것처럼 보인다!","opts":["반영하다","피하다","설명하다","방해하다"],"word":"echo","r":{"a":"1) 반영하다","ev":"2번 문장","s":[[2,"They seem to echo the wishes of many “Peter Pans” in our society!","그들은 우리 사회의 많은 “피터 팬들”의 소망을 반영하는 것처럼 보인다!"]],"w":"2번에서 ‘Forever Young’ 노래들이 피터 팬들의 소망을 되울려 ‘반영한다’는 뜻이에요. 3번에서 그 소망이 어른이 되기 싫은 마음으로 이어져요.","c":1},"h":"ee88ce13b7"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nJust like the fictional character Peter Pan, adulthood still feels out of reach for them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"가상의 인물 피터팬처럼, 성인기는 그들에게 여전히 손에 닿지 않는 곳에 있는 것처럼 느껴진다.","opts":["피터팬 이야기의 독자들","노래를 발표한 아티스트들","우리 사회의 많은 ‘피터 팬들’","그들의 부모들"],"r":{"a":"3) 우리 사회의 많은 ‘피터 팬들’","ev":"2~3번 문장","s":[[2,"They seem to echo the wishes of many “Peter Pans” in our society!","그들은 우리 사회의 많은 “피터 팬들”의 소망을 반영하는 것처럼 보인다!"],[3,"Just like the fictional character Peter Pan, adulthood still feels out of reach for them.","가상의 인물 피터팬처럼, 성인기는 그들에게 여전히 손에 닿지 않는 곳에 있는 것처럼 느껴진다."]],"w":"3번의 them은 바로 앞 2번에 나온 우리 사회의 많은 ‘피터 팬들’을 가리켜요. 아티스트들은 노래를 발표한 사람들이고, 부모들과 독자들은 이 문장에 나오지 않아요.","c":3,"k":"them = 우리 사회의 많은 ‘피터 팬들’"},"pron":"them","h":"b365a278a3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Although the exact causes of this reluctance are not fully understood, many experts believe it results from early life experiences.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"비록 이 거부감의 정확한 원인들이 완전히 이해되지는 않았지만, 많은 전문가들은 그것이 어린 시절의 경험에서 비롯된다고 믿는다.","opts":["이 거부감의 정확한 원인이 완전히 이해된 것은 아니지만, 많은 전문가들은 그것이 어린 시절의 경험에서 비롯된다고 믿는다.","이 거부감의 원인이 완전히 밝혀졌기 때문에 전문가들은 그것이 어린 시절의 경험에서 비롯된다고 믿는다.","전문가들은 이 거부감이 어린 시절의 경험과는 아무 관계가 없다고 믿는다.","이 거부감의 원인은 알려졌지만 전문가들은 그것이 어린 시절의 경험에서 비롯된다고는 믿지 않는다."],"r":{"a":"1) 이 거부감의 정확한 원인이 완전히 이해된 것은 아니지만, 많은 전문가들은 그것이 어린 시절의 경험에서 비롯된다고 믿는다.","ev":"7번 문장","s":[[7,"Although the exact causes of this reluctance are not fully understood, many experts believe it results from early life experiences.","비록 이 거부감의 정확한 원인들이 완전히 이해되지는 않았지만, 많은 전문가들은 그것이 어린 시절의 경험에서 비롯된다고 믿는다."]],"w":"7번은 원인이 완전히 이해되지는 않았지만(Although ... not fully understood) 많은 전문가들이 어린 시절의 경험에서 비롯된다고 믿는다는 뜻이에요. 원인이 밝혀졌다거나 어린 시절과 관계없다는 말은 없어요.","c":1},"h":"2fb4e52092"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["피터 팬 증후군을 이해하려면 어린 시절 가정생활과 함께 사회적 뿌리도 고려해야 한다.","전문가들은 어른이 되기를 꺼리는 마음의 원인 하나를 분명히 밝혀냈다.","경제적 어려움은 어른이 되는 것을 더 쉽게 만들었다.","피터 팬 증후군을 앓는 사람들은 가족에게 거의 의존하지 않는다."],"opts":["Societal roots should be considered along with early home life to understand Peter Pan Syndrome.","Experts have found one clear cause of people’s reluctance to take on adult responsibilities.","Economic challenges have made becoming an adult easier.","People with Peter Pan Syndrome hardly depend on their family members."],"r":{"a":"1) Societal roots should be considered along with early home life to understand Peter Pan Syndrome.","ev":"9번 문장","s":[[9,"However, we must understand Peter Pan Syndrome beyond early home life and consider its societal roots.","하지만, 피터팬 증후군을 어린 시절 가정생활 너머로 이해하고 그것의 사회적 뿌리를 고려해야 한다."]],"w":"9번에서 피터 팬 증후군을 어린 시절 가정생활 너머로 이해하고 사회적 뿌리도 고려해야 한다고 해요. 원인은 완전히 이해되지 않았고(7번), 경제적 어려움은 어른이 되기를 더 어렵게 했으며(10번), 이 사람들은 가족에게 크게 의존해요(5번).","c":1},"h":"3207a1a1bc"},{"n":9,"t":"sum","q":"Rising living costs and job instability have made being an adult (A), leading to (B) dependence on parents.","ko":"치솟는 생활비와 직업 불안정성은 어른이 되는 것을 (A) 만들어, 부모에 대한 (B) 의존으로 이어졌다.","oko":["(A) 더 쉽게 / (B) 일시적인","(A) 더 어렵게 / (B) 일시적인","(A) 더 쉽게 / (B) 장기적인","(A) 더 어렵게 / (B) 장기적인","(A) 더 안전하게 / (B) 장기적인"],"opts":["(A) easier / (B) short","(A) harder / (B) short","(A) easier / (B) prolonged","(A) harder / (B) prolonged","(A) safer / (B) prolonged"],"r":{"a":"4) (A) harder / (B) prolonged (더 어렵게 / 장기적인)","ev":"10번 문장","s":[[10,"Economic challenges, such as rising living costs and job instability, have made being an adult much harder, causing prolonged dependence on parents.","치솟는 생활비와 직업 불안정성과 같은 경제적 어려움들은 어른이 되는 것을 훨씬 더 어렵게 만들었고, 부모에 대한 장기적인 의존을 야기했다."]],"w":"10번에서 치솟는 생활비와 직업 불안정성은 어른이 되는 것을 훨씬 더 어렵게(harder) 만들었고, 부모에 대한 장기적인(prolonged) 의존을 야기했다고 해요. 더 쉽게, 일시적인, 더 안전하게는 본문과 맞지 않아요.","c":4},"h":"4bb553f4f6"},{"n":10,"t":"fill","q":"From Bob Dylan to BLACKPINK, many [A] across generations have released [B] titled “Forever Young.”","ko":"밥 딜런에서 블랙핑크에 이르기까지, 세대를 뛰어넘어 많은 [A]이(가) “Forever Young”이라는 제목의 [B]을(를) 발표해 왔다.","bank":["artists","songs","causes","behavior","responsibilities","adulthood"],"bko":{"artists":"아티스트들","songs":"노래들","causes":"원인들","behavior":"행동","responsibilities":"책임들","adulthood":"성인기"},"r":{"a":"[A] artists (아티스트들), [B] songs (노래들)","ev":"1번 문장","s":[[1,"From Bob Dylan to BLACKPINK, many artists across generations have released songs titled “Forever Young.”","밥 딜런에서 블랙핑크에 이르기까지, 세대를 뛰어넘어 많은 아티스트들이 “Forever Young”이라는 제목의 노래들을 발표해 왔다."]],"w":"1번에서 밥 딜런부터 블랙핑크까지 세대를 뛰어넘어 많은 아티스트들(artists)이 ‘Forever Young’이라는 제목의 노래들(songs)을 발표해 왔다고 해요. causes, behavior, responsibilities, adulthood는 피터 팬 증후군 설명에 나오는 말이라 이 자리에 맞지 않아요.","c":null},"h":"dccce98f33"}]},{"u":7,"id":"ms1-07-2","no":2,"ko":"흑역사를 사랑하라...?","items":[{"n":1,"t":"tf","q":"Nietzsche’s idea means we should celebrate our failures as often as our successes.","ko":"니체의 생각은 우리가 성공만큼 자주 실패도 기념해야 한다는 뜻이다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In practice, this means we should celebrate our failures as often as our successes.","실제로, 이것은 우리가 성공만큼이나 자주 실패를 기념해야 함을 의미한다."]],"w":"5번에서 In practice, this means we should celebrate our failures as often as our successes라고 해요. 실패를 성공만큼 자주 기념하라는 말과 같아요.","c":"T"},"h":"e517c5cab0"},{"n":2,"t":"tf","q":"Nietzsche urged us only to accept our lives, not to appreciate every twist and turn.","ko":"니체는 우리에게 삶을 받아들이기만 하고 모든 우여곡절을 가치 있게 여기지는 말라고 촉구했다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"He urged us not merely to accept our lives but to appreciate every twist and turn with open arms.","그는 우리에게 단지 삶을 받아들이는 것뿐만 아니라, 두 팔 벌려 모든 우여곡절을 가치 있게 여기라고 촉구했다."]],"w":"2번은 not merely to accept but to appreciate라서, 받아들이는 것뿐 아니라 모든 우여곡절을 가치 있게 여기라는 뜻이에요. 가치 있게 여기지 말라는 말은 반대예요.","c":"F"},"h":"7db475090f"},{"n":3,"t":"tf","q":"Nietzsche believed that one must see everything as both necessary and beautiful to truly live.","ko":"니체는 진정으로 살기 위해서는 모든 것을 필연적이고 아름다운 것으로 보아야 한다고 믿었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4번 문장","s":[[4,"He, however, believed that to truly live, one must see everything as both necessary and beautiful, as if it were part of a cosmic plan.","그러나 그는 진정으로 살기 위해서는 모든 것을 마치 우주적 계획의 일부인 것처럼 필연적이고 아름다운 것으로 보아야 한다고 믿었다."]],"w":"4번에서 to truly live, one must see everything as both necessary and beautiful이라고 해요. 진정으로 살기 위한 조건으로 그렇게 보라는 뜻이에요.","c":"T"},"h":"f3b73625c9"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In a world where we often feel lost in difficult situations, Nietzsche’s call might seem radical.)","ko":"우리가 종종 어려운 상황 속에서 길을 잃었다고 느끼는 세상에서, 니체의 요구는 급진적으로 보일 수 있다.","opts":["익숙한","온화한","급진적인","시시한"],"word":"radical","r":{"a":"3) 급진적인","ev":"3번 문장","s":[[3,"In a world where we often feel lost in difficult situations, Nietzsche’s call might seem radical.","우리가 종종 어려운 상황 속에서 길을 잃었다고 느끼는 세상에서, 니체의 요구는 급진적으로 보일 수 있다."]],"w":"3번에서 모든 우여곡절을 가치 있게 여기라는 요구가 어려운 상황 속 사람들에게는 받아들이기 힘든 극단적인 말로 보일 수 있다는 뜻이에요. 그래서 radical은 ‘급진적인’이에요.","c":3},"h":"4bdb8ed91e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Instead of being paralyzed by the fear of making mistakes, we can learn to view every misstep as a stepping stone toward personal growth.)","ko":"실수를 저지르는 것에 대한 두려움에 마비되는 대신, 우리는 모든 실수를 개인적 성장을 향한 디딤돌로 바라보는 법을 배울 수 있다.","opts":["이끌린","마비된","보호받는","자유로워진"],"word":"paralyzed","r":{"a":"2) 마비된","ev":"6번 문장","s":[[6,"Instead of being paralyzed by the fear of making mistakes, we can learn to view every misstep as a stepping stone toward personal growth.","실수를 저지르는 것에 대한 두려움에 마비되는 대신, 우리는 모든 실수를 개인적 성장을 향한 디딤돌로 바라보는 법을 배울 수 있다."]],"w":"paralyzed는 ‘마비된’이에요. 실수가 두려워서 아무것도 못 하고 꼼짝 못 하는 모습을 말하고, 그 대신 실수를 디딤돌로 보자는 흐름이에요.","c":2},"h":"14557d8d9d"},{"n":6,"t":"ref","q":"What does the underlined \"He\" refer to?\nHe urged us not merely to accept our lives but to appreciate every twist and turn with open arms.","ko":"밑줄 친 He가 가리키는 것은?","sko":"그는 우리에게 단지 삶을 받아들이는 것뿐만 아니라, 두 팔 벌려 모든 우여곡절을 가치 있게 여기라고 촉구했다.","opts":["프리드리히 니체","이 글의 독자들","‘아모르 파티’라는 라틴어 구절","어려운 상황에 처한 사람들"],"r":{"a":"1) 프리드리히 니체","ev":"1~2번 문장","s":[[1,"Amor fati, a Latin phrase meaning “love of fate,” is a weighty philosophical concept explored by Friedrich Nietzsche.","‘운명에 대한 사랑’을 의미하는 라틴어 구절인 ‘아모르 파티’는 프리드리히 니체에 의해 탐구된 중대한 철학적 개념이다."],[2,"He urged us not merely to accept our lives but to appreciate every twist and turn with open arms.","그는 우리에게 단지 삶을 받아들이는 것뿐만 아니라, 두 팔 벌려 모든 우여곡절을 가치 있게 여기라고 촉구했다."]],"w":"2번의 He는 바로 앞 1번에 나온 철학자 프리드리히 니체를 가리켜요. 아모르 파티는 라틴어 구절이고, 독자들이나 어려운 상황의 사람들은 사람을 촉구한 주체가 아니에요.","c":1,"k":"He = 프리드리히 니체"},"pron":"He","h":"d228898e5e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Amor fati, a Latin phrase meaning “love of fate,” is a weighty philosophical concept explored by Friedrich Nietzsche.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"‘운명에 대한 사랑’을 의미하는 라틴어 구절인 ‘아모르 파티’는 프리드리히 니체에 의해 탐구된 중대한 철학적 개념이다.","opts":["아모르 파티는 ‘운명에 대한 사랑’을 뜻하는 라틴어이고, 니체가 탐구한 중요한 철학적 개념이다.","아모르 파티는 니체가 만든 새로운 라틴어 단어이고, 운명을 미워하는 마음을 뜻한다.","아모르 파티는 철학과 관계없는 일상 표현이고, 니체가 번역한 문장이다.","아모르 파티는 라틴어로 쓴 니체의 책 제목이며, 사랑 이야기를 다룬다."],"r":{"a":"1) 아모르 파티는 ‘운명에 대한 사랑’을 뜻하는 라틴어이고, 니체가 탐구한 중요한 철학적 개념이다.","ev":"1번 문장","s":[[1,"Amor fati, a Latin phrase meaning “love of fate,” is a weighty philosophical concept explored by Friedrich Nietzsche.","‘운명에 대한 사랑’을 의미하는 라틴어 구절인 ‘아모르 파티’는 프리드리히 니체에 의해 탐구된 중대한 철학적 개념이다."]],"w":"Amor fati를 a Latin phrase가 다시 설명하고, meaning “love of fate”가 뜻을 알려 줘요. explored by Friedrich Nietzsche는 앞의 concept를 꾸미는 말로 ‘니체가 탐구한’이에요.","c":1},"h":"39403efa25"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["모든 실수를 디딤돌로 보면 우리가 개인적으로 성장하는 데 도움이 될 수 있다.","실수는 아무도 볼 수 없도록 숨겨야 한다.","실수를 하는 것은 언제나 사람들의 성장을 멈추게 한다.","개인적 성장은 결코 실패하지 않는 사람에게만 가능하다."],"opts":["Seeing every mistake as a stepping stone can help us grow personally.","Mistakes should be hidden so that no one can see them.","Making mistakes always stops people from growing.","Personal growth is possible only for people who never fail."],"r":{"a":"1) Seeing every mistake as a stepping stone can help us grow personally. (모든 실수를 디딤돌로 보면 우리가 개인적으로 성장하는 데 도움이 될 수 있다.)","ev":"6번 문장","s":[[6,"Instead of being paralyzed by the fear of making mistakes, we can learn to view every misstep as a stepping stone toward personal growth.","실수를 저지르는 것에 대한 두려움에 마비되는 대신, 우리는 모든 실수를 개인적 성장을 향한 디딤돌로 바라보는 법을 배울 수 있다."]],"w":"6번에서 모든 실수를 개인적 성장을 향한 디딤돌로 바라보는 법을 배울 수 있다고 해요. 실수를 숨겨야 한다거나 성장을 멈춘다는 말은 본문에 없어요.","c":1},"h":"5e743ffaa2"},{"n":9,"t":"sum","q":"Viewing mistakes this way builds (A) and deepens our appreciation for the (B) of life itself.","ko":"이렇게 바라보는 것은 (A)을(를) 길러 주고 삶 그 자체의 (B)에 대한 감사를 깊게 한다.","oko":["(A) 약점 / (B) 여정","(A) 회복력 / (B) 끝","(A) 약점 / (B) 끝","(A) 회복력 / (B) 여정","(A) 분노 / (B) 여정"],"opts":["(A) weakness / (B) journey","(A) resilience / (B) end","(A) weakness / (B) end","(A) resilience / (B) journey","(A) anger / (B) journey"],"r":{"a":"4) (A) resilience / (B) journey (회복력 / 여정)","ev":"7번 문장","s":[[7,"This mindset not only fosters resilience but also cultivates a deeper appreciation for the journey of life itself!","이러한 사고방식은 회복력을 길러줄 뿐만 아니라 삶의 여정 그 자체에 대한 더 깊은 감사를 함양한다!"]],"w":"7번에서 이러한 사고방식은 회복력(resilience)을 길러 주고 삶의 여정(journey) 그 자체에 대한 더 깊은 감사를 키운다고 해요. 약점, 분노, 끝은 본문과 맞지 않아요.","c":4},"h":"04ce6e3e87"},{"n":10,"t":"fill","q":"He, however, believed that to truly live, one must see everything as both necessary and beautiful, as if it were part of a [A] [B].","ko":"그러나 그는 진정으로 살기 위해서는 모든 것을 마치 [A] [B]의 일부인 것처럼 필연적이고 아름다운 것으로 보아야 한다고 믿었다.","bank":["cosmic","plan","accept","celebrate","urged","learn"],"bko":{"cosmic":"우주적인","plan":"계획","accept":"받아들이다","celebrate":"기념하다","urged":"촉구했다(urge의 과거)","learn":"배우다"},"r":{"a":"[A] cosmic (우주적인), [B] plan (계획)","ev":"4번 문장","s":[[4,"He, however, believed that to truly live, one must see everything as both necessary and beautiful, as if it were part of a cosmic plan.","그러나 그는 진정으로 살기 위해서는 모든 것을 마치 우주적 계획의 일부인 것처럼 필연적이고 아름다운 것으로 보아야 한다고 믿었다."]],"w":"4번에서 니체는 모든 것을 마치 우주적인(cosmic) 계획(plan)의 일부인 것처럼 필연적이고 아름답게 보아야 한다고 믿었어요. accept, celebrate, urged, learn은 동사라서 ‘a ___ ___’ 자리에 들어갈 수 없어요.","c":null},"h":"75a5b926d4"}]},{"u":7,"id":"ms1-07-3","no":3,"ko":"파멸로 이끄는 새 집","items":[{"n":1,"t":"tf","q":"In the wild, hermit crabs typically protect their soft bodies with empty snail shells.","ko":"야생에서 소라게는 일반적으로 빈 달팽이 껍데기로 부드러운 몸을 보호한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In the wild, they typically protect their soft bodies with empty snail shells.","야생에서, 그들은 일반적으로 빈 달팽이 껍데기로 그들의 부드러운 몸을 보호한다."]],"w":"5번에서 야생의 소라게는 일반적으로 빈 달팽이 껍데기로 부드러운 몸을 보호한다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"e05ebc6d18"},{"n":2,"t":"tf","q":"Hermit crabs are attracted to plastic containers because they cannot find any empty snail shells.","ko":"소라게는 빈 달팽이 껍데기를 전혀 찾을 수 없기 때문에 플라스틱 용기에 끌린다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"This is because they are attracted to oleamide, a chemical found in some plastics.","이것은 그들이 일부 플라스틱에서 발견되는 화학 물질인 올레아미드에 끌리기 때문이다."]],"w":"8번에서 소라게가 플라스틱에 끌리는 이유는 일부 플라스틱에서 발견되는 화학 물질 올레아미드 때문이라고 해요. 빈 껍데기를 못 찾아서라는 말은 본문에 없어요.","c":"F"},"h":"89bf6abe36"},{"n":3,"t":"tf","q":"Some hermit crabs carry a bright blue plastic container on their backs instead of natural shells.","ko":"어떤 소라게들은 자연산 껍데기 대신 밝은 파란색 플라스틱 용기를 등에 지고 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"But instead of natural shells, some of them have something shocking on their backs—a bright blue plastic container.","그러나 자연산 껍데기 대신, 그들 중 일부는 등에 충격적인 것을 갖고 있는데, 바로 밝은 파란색 플라스틱 용기다."]],"w":"2번에서 일부 소라게는 자연산 껍데기 대신 등에 밝은 파란색 플라스틱 용기를 갖고 있다고 해요. 본문과 같은 내용이에요.","c":"T"},"h":"d88b59fc4c"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… they undergo behavioral changes that reduce their food-foraging ability.)","ko":"… 그들은 그들의 먹이를 찾는 능력을 감소시키는 행동 변화를 경험한다.","opts":["피한다","돕는다","겪는다","끝낸다"],"word":"undergo","r":{"a":"3) 겪는다","ev":"9번 문장","s":[[9,"When crabs absorb harmful chemical compounds from plastics into their bodies, they undergo behavioral changes that reduce their food-foraging ability.","게들이 플라스틱에서 나오는 유해한 화학 화합물을 그들의 체내로 흡수하면, 그들은 그들의 먹이를 찾는 능력을 감소시키는 행동 변화를 경험한다."]],"w":"9번에서 해로운 화합물을 흡수한 소라게가 행동의 변화를 ‘겪는다’는 뜻이에요. 그 변화가 먹이를 찾는 능력을 줄여요.","c":3},"h":"24d56e7fc7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (In addition, using brightly colored plastic containers as shells makes them more visible to predators.)","ko":"게다가, 밝은 색상의 플라스틱 용기를 껍데기처럼 사용하는 것은 그들이 포식자에게 더 잘 보이게 만든다.","opts":["눈에 잘 띄는","냄새가 강한","움직임이 빠른","크기가 작은"],"word":"visible","r":{"a":"1) 눈에 잘 띄는","ev":"10번 문장","s":[[10,"In addition, using brightly colored plastic containers as shells makes them more visible to predators.","게다가, 밝은 색상의 플라스틱 용기를 껍데기처럼 사용하는 것은 그들이 포식자에게 더 잘 보이게 만든다."]],"w":"밝은 색의 용기를 쓰면 포식자의 눈에 더 잘 ‘보이게’ 된다는 뜻이에요. 그래서 visible은 ‘눈에 잘 띄는’이에요.","c":1},"h":"7f8219b34b"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThis serves as an effective defense mechanism against predators, thereby keeping them safe.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이것은 포식자로부터의 효과적인 방어 수단의 역할을 하며, 그렇게 함으로써 그들을 안전하게 지켜준다.","opts":["소라게들","포식자들","달팽이들","그들의 먹이"],"r":{"a":"1) 소라게들","ev":"5~6번 문장","s":[[5,"In the wild, they typically protect their soft bodies with empty snail shells.","야생에서, 그들은 일반적으로 빈 달팽이 껍데기로 그들의 부드러운 몸을 보호한다."],[6,"This serves as an effective defense mechanism against predators, thereby keeping them safe.","이것은 포식자로부터의 효과적인 방어 수단의 역할을 하며, 그렇게 함으로써 그들을 안전하게 지켜준다."]],"w":"6번의 them은 포식자로부터 안전하게 지켜지는 대상, 즉 앞 5번에서 부드러운 몸을 보호하는 소라게들을 가리켜요. 포식자들은 위협이 되는 쪽이고, 달팽이와 먹이는 안전하게 지켜 주는 대상이 아니에요.","c":1,"k":"them = 소라게들"},"pron":"them","h":"8334855b0f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Hermit crabs are marine creatures found in various coastal environments.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"소라게는 다양한 해안 환경에서 발견되는 해양 생물이다.","opts":["소라게는 여러 곳의 바닷가 환경에서 볼 수 있는 바다 생물이다.","소라게는 깊은 산속에서만 볼 수 있는 육지 생물이다.","소라게는 한 종류의 해안에서만 사는 물고기이다.","소라게는 해안에서는 볼 수 없는 깊은 바다의 생물이다."],"r":{"a":"1) 소라게는 여러 곳의 바닷가 환경에서 볼 수 있는 바다 생물이다.","ev":"4번 문장","s":[[4,"Hermit crabs are marine creatures found in various coastal environments.","소라게는 다양한 해안 환경에서 발견되는 해양 생물이다."]],"w":"4번은 소라게가 다양한 해안 환경에서 발견되는 해양 생물(marine creatures)이라는 뜻이에요. 육지 생물, 한 종류의 해안에만 사는 물고기, 해안에서 볼 수 없는 생물은 본문과 달라요.","c":1},"h":"1b5b536fb4"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["매년 수백만 톤의 플라스틱 폐기물이 바다로 들어간다.","최근 몇 년 사이 바다의 플라스틱 폐기물이 줄어들었다.","아주 적은 양의 플라스틱 폐기물만 바다에 닿는다.","플라스틱 폐기물은 매년 바다에서 건져 올려진다."],"opts":["Millions of tons of plastic waste go into the oceans every year.","Plastic waste in the oceans has decreased in recent years.","Only a small amount of plastic waste reaches the oceans.","Plastic waste is taken out of the oceans every year."],"r":{"a":"1) Millions of tons of plastic waste go into the oceans every year. (매년 수백만 톤의 플라스틱 폐기물이 바다로 들어간다.)","ev":"7번 문장","s":[[7,"However, as millions of tons of plastic waste enter the oceans each year, hermit crabs are increasingly using plastic containers instead of natural shells.","그러나, 매년 수백만 톤의 플라스틱 폐기물이 바다로 들어가면서, 소라게들은 자연산 껍데기 대신 플라스틱 용기를 점점 더 많이 사용하고 있다."]],"w":"7번에서 매년 수백만 톤의 플라스틱 폐기물이 바다로 들어간다고 해요. 폐기물이 줄었다거나 아주 적다거나 건져 올려진다는 말은 본문에 없어요.","c":1},"h":"794d48cdbf"},{"n":9,"t":"sum","q":"Using plastic containers as shells (A) the chances of (B) for hermit crabs in the wild.","ko":"플라스틱 용기를 껍데기로 쓰는 것은 야생에서 소라게의 (B) 가능성을 (A).","oko":["(A) 높인다 / (B) 생존","(A) 낮춘다 / (B) 탈출","(A) 높인다 / (B) 탈출","(A) 낮춘다 / (B) 생존","(A) 지킨다 / (B) 탈출"],"opts":["(A) raises / (B) survival","(A) lowers / (B) escape","(A) raises / (B) escape","(A) lowers / (B) survival","(A) protects / (B) escape"],"r":{"a":"4) (A) lowers / (B) survival (낮춘다 / 생존)","ev":"11번 문장","s":[[11,"This lowers their chances of survival in the wild.","이것은 야생에서 그들의 생존 가능성을 낮춘다."]],"w":"11번에서 플라스틱 용기를 껍데기로 쓰는 것은 야생에서 생존(survival) 가능성을 낮춘다(lowers)고 해요. 높인다, 지킨다, 탈출은 본문과 맞지 않아요.","c":4},"h":"279c9f853b"},{"n":10,"t":"fill","q":"As the sun sets, hermit crabs come out of their [A] to [B] for food.","ko":"해가 지면, 소라게들은 그들의 [A] 밖으로 나와 먹이를 [B].","bank":["burrows","search","natural","bright","soft","marine"],"bko":{"burrows":"굴","search":"찾다","natural":"자연산의","bright":"밝은","soft":"부드러운","marine":"해양의"},"r":{"a":"[A] burrows (굴), [B] search (찾다)","ev":"1번 문장","s":[[1,"As the sun sets, hermit crabs come out of their burrows to search for food.","해가 지면, 소라게들은 그들의 굴 밖으로 나와 먹이를 찾아나선다."]],"w":"1번에서 해가 지면 소라게들은 굴(burrows) 밖으로 나와 먹이를 찾는다(search)고 해요. natural, bright, soft, marine은 형용사라서 이 자리에 들어갈 수 없어요.","c":null},"h":"e3c8da6c47"}]},{"u":7,"id":"ms1-07-4","no":4,"ko":"Am I Competing with Myself?","items":[{"n":1,"t":"tf","q":"The hot chocolate has been the bestseller of the café for years.","ko":"핫초코는 수년간 그 카페의 베스트셀러였다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"It has been your bestseller for years.","그것은 수년간 당신 카페의 베스트셀러였다."]],"w":"2번에서 It has been your bestseller for years라고 해요. It은 1번의 핫초코예요.","c":"T"},"h":"730031c698"},{"n":2,"t":"tf","q":"You hesitate to introduce the new drink because you are sure customers will love it.","ko":"당신은 고객들이 그것을 좋아할 것이라고 확신하기 때문에 새 음료를 내놓기를 주저한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"But you hesitate to introduce the new drink because you are worried that customers might stop buying the hot chocolate.","그러나 당신은 고객들이 핫초코를 구매하는 것을 그만둘 수도 있을까 봐 걱정하기 때문에 그 새로운 음료를 내놓는 것을 주저한다."]],"w":"5번에서 주저하는 이유는 고객들이 핫초코를 구매하는 것을 그만둘까 봐 걱정되기 때문이에요. 고객이 좋아할 것이라고 확신한다는 말은 반대예요.","c":"F"},"h":"80ab209ed8"},{"n":3,"t":"tf","q":"Steve Jobs said that a company should be afraid of cannibalizing itself.","ko":"스티브 잡스는 기업이 스스로를 자기 잠식하는 것을 두려워해야 한다고 말했다.","r":{"a":"F (본문과 다른 내용)","ev":"13번 문장","s":[[13,"Still, Apple’s co-founder Steve Jobs argued that a company should not be afraid of “cannibalizing” itself, because if it doesn’t, someone else will.","그럼에도, 애플의 공동 창업주 스티브 잡스는 기업이 스스로 ‘자기 잠식하는 것’을 두려워해서는 안 된다고 주장했는데, 그렇지 않으면 다른 누군가가 그렇게 할 것이기 때문이라고 했다."]],"w":"13번에서 잡스는 기업이 자기 잠식을 두려워해서는 안 된다고 주장했어요. 두려워해야 한다는 말은 반대예요.","c":"F"},"h":"3707a19621"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… to launch a brand-new sweet milk tea at an affordable price.)","ko":"… 저렴한 가격에 완전히 새로운 달콤한 밀크티를 출시하는 것이다.","opts":["비싼","저렴한","독특한","오래된"],"word":"affordable","r":{"a":"2) 저렴한","ev":"4번 문장","s":[[4,"One day, you get a great idea: to launch a brand-new sweet milk tea at an affordable price.","어느 날, 당신은 훌륭한 아이디어를 얻는데, 바로 저렴한 가격에 완전히 새로운 달콤한 밀크티를 출시하는 것이다."]],"w":"4번에서 새 밀크티를 출시하는 가격이 affordable, 즉 부담 없이 살 수 있는 ‘저렴한’ 가격이라는 뜻이에요.","c":2},"h":"571a13aaef"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… increase a company’s overall market share by expanding product lines to meet changing consumer preferences.)","ko":"… 변화하는 소비자 선호도를 충족하기 위해 제품 라인을 확장함으로써 회사의 전체적인 시장 점유율을 높일 수 있다.","opts":["불만","가격","선호도","나이"],"word":"preferences","r":{"a":"3) 선호도","ev":"8번 문장","s":[[8,"On the bright side, it can drive innovation and increase a company’s overall market share by expanding product lines to meet changing consumer preferences.","긍정적인 측면에서, 그것은 변화하는 소비자 선호도를 충족하기 위해 제품 라인을 확장함으로써 혁신을 촉진하고 회사의 전체적인 시장 점유율을 높일 수 있다."]],"w":"changing consumer preferences는 ‘변화하는 소비자 선호도’예요. 소비자가 좋아하는 것이 바뀌면 거기에 맞춰 제품 라인을 확장한다는 흐름이에요.","c":3},"h":"936e0b7354"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nEven if the new product threatened an older bestseller, Apple pushed forward, which led to one of the most significant sales increases in the company’s history.","ko":"밑줄 친 which가 가리키는 것은?","sko":"새로운 제품이 기존의 베스트셀러를 위협할 수도 있었지만, 애플은 밀고 나갔고, 이는 회사 역사상 가장 큰 매출 증가 중 하나로 이어졌다.","opts":["새 제품이 기존 베스트셀러를 위협한 것","애플이 위협을 무릅쓰고 밀고 나간 것","스티브 잡스가 한 주장","아이팟의 매출이 줄어든 것"],"r":{"a":"2) 애플이 위협을 무릅쓰고 밀고 나간 것","ev":"14번 문장","s":[[14,"Even if the new product threatened an older bestseller, Apple pushed forward, which led to one of the most significant sales increases in the company’s history.","새로운 제품이 기존의 베스트셀러를 위협할 수도 있었지만, 애플은 밀고 나갔고, 이는 회사 역사상 가장 큰 매출 증가 중 하나로 이어졌다."]],"w":"14번의 which는 앞에 나온 ‘애플이 밀고 나갔다(Apple pushed forward)’는 내용을 가리켜요. 그 결과 회사 역사상 가장 큰 매출 증가 중 하나로 이어졌다는 흐름이에요. 새 제품의 위협은 밀고 나간 이유가 아니라 장애물이에요.","c":2,"k":"which = 애플이 위협을 무릅쓰고 밀고 나간 것"},"pron":"which","h":"6962ac2443"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Many companies face this tension between innovating and protecting existing business.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"많은 회사들이 혁신과 기존 사업 보호 사이의 이러한 긴장에 직면한다.","opts":["많은 기업이 혁신과 기존 사업을 지키는 일 사이에서 갈등을 겪는다.","많은 기업이 혁신 덕분에 기존 사업을 쉽게 지킬 수 있다.","많은 기업이 혁신을 포기하고 기존 사업만 지키기로 결정한다.","많은 기업이 기존 사업이 없어서 혁신하지 못한다."],"r":{"a":"1) 많은 기업이 혁신과 기존 사업을 지키는 일 사이에서 갈등을 겪는다.","ev":"10번 문장","s":[[10,"Many companies face this tension between innovating and protecting existing business.","많은 회사들이 혁신과 기존 사업 보호 사이의 이러한 긴장에 직면한다."]],"w":"face는 ‘직면하다’이고 this tension between A and B는 ‘A와 B 사이의 이러한 긴장’이에요. innovating(혁신하는 것)과 protecting existing business(기존 사업을 지키는 것) 사이에서 갈등한다는 뜻이에요.","c":1},"h":"f1c169b59a"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["핫초코가 한 번도 인기가 없어서 주인은 판매를 멈춘다.","새 음료는 더 비싼 가격에 파는 핫초코이다.","주인은 매출을 끌어올리고 싶어서 새로운 메뉴를 생각하기 시작한다.","주인은 새 메뉴를 만드는 데 전혀 관심이 없다."],"opts":["The owner stops selling hot chocolate because it has never been popular.","The new drink is a hot chocolate sold at a higher price.","The owner wants to boost sales and starts thinking of a new menu item.","The owner is not interested in making any new menu items."],"r":{"a":"3) The owner wants to boost sales and starts thinking of a new menu item. (주인은 매출을 끌어올리고 싶어서 새로운 메뉴를 생각하기 시작한다.)","ev":"3번 문장","s":[[3,"Still, you’re eager to boost your sales and start thinking of a new menu item.","그런데도, 당신은 몹시 매출을 끌어올리고 싶어 하며 새로운 메뉴를 생각해 내기 시작한다."]],"w":"3번에서 당신은 매출을 끌어올리고 싶어서 새로운 메뉴를 생각하기 시작한다고 해요. 판매를 멈춘다, 더 비싼 핫초코다, 관심이 없다는 말은 본문에 없어요.","c":3},"h":"7a9f79dcec"},{"n":9,"t":"sum","q":"A new product may (A) with an existing one, and the company risks (B) customers and sales.","ko":"신제품은 기존 제품과 (A) 수 있고, 그 경우 회사는 고객과 매출을 (B) 위험이 있다.","oko":["(A) 동의할 / (B) 얻을","(A) 경쟁할 / (B) 얻을","(A) 동의할 / (B) 잃을","(A) 협력할 / (B) 잃을","(A) 경쟁할 / (B) 잃을"],"opts":["(A) agree / (B) gain","(A) compete / (B) gain","(A) agree / (B) lose","(A) cooperate / (B) lose","(A) compete / (B) lose"],"r":{"a":"5) (A) compete / (B) lose (경쟁할 / 잃을)","ev":"7번, 9번 문장","s":[[7,"Cannibalization describes a situation in which a company’s new product competes with an existing one.","카니발리제이션은 회사의 신제품이 기존의 제품과 경쟁하는 상황을 묘사한다."],[9,"On the other hand, the company risks losing customers and sales of the existing product.","반면에, 회사는 기존 제품의 고객과 매출을 잃을 위험이 있다."]],"w":"7번에서 신제품은 기존 제품과 경쟁할(compete) 수 있고, 9번에서 회사는 기존 제품의 고객과 매출을 잃을(losing) 위험이 있다고 해요. 동의할, 협력할, 얻을은 본문과 맞지 않아요.","c":5},"h":"835afcf8e1"},{"n":10,"t":"fill","q":"When Apple introduced the iPhone, it included music [A] that could replace a separate music [B] like the iPod.","ko":"애플이 아이폰을 출시했을 때, 그것은 아이팟과 같은 별도의 음악 [B]을(를) 대체할 수 있는 음악 [A]을(를) 포함하고 있었다.","bank":["features","player","launched","delayed","threatened","innovating"],"bko":{"features":"기능들","player":"플레이어","launched":"출시했다","delayed":"미뤘다","threatened":"위협했다","innovating":"혁신하는(innovate의 -ing형)"},"r":{"a":"[A] features (기능들), [B] player (플레이어)","ev":"12번 문장","s":[[12,"When Apple introduced the iPhone, it included music features that could replace a separate music player like the iPod.","애플이 아이폰을 출시했을 때, 그것은 아이팟과 같은 별도의 음악 플레이어를 대체할 수 있는 음악 기능을 포함하고 있었다."]],"w":"12번에서 아이폰에는 아이팟 같은 별도의 음악 플레이어(player)를 대체할 수 있는 음악 기능들(features)이 들어 있었어요. launched, delayed, threatened, innovating은 동사 형태라서 이 자리에 들어갈 수 없어요.","c":null},"h":"768d872992"}]},{"u":8,"id":"ms1-08-1","no":1,"ko":"손 못 드는 너한테 알려주고 싶어","items":[{"n":1,"t":"tf","q":"The belief people have in their ability to accomplish specific tasks affects how students approach challenges.","ko":"특정 과업을 성취할 수 있는 자신의 능력에 대한 사람들의 믿음은 학생들이 도전에 접근하는 방식에 영향을 미친다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It refers to people’s belief in their ability to accomplish specific tasks, and it influences how students approach challenges.","그것은 특정 과업을 성취할 수 있는 자신의 능력에 대한 사람들의 믿음을 가리키며, 그것은 학생들이 도전에 접근하는 방식에 영향을 미친다."]],"w":"3번에서 자기 효능감은 특정 과업을 해낼 수 있다는 믿음이고 그것이 학생들이 도전에 접근하는 방식에 영향을 준다고 해요.","c":"T"},"h":"51cce80427"},{"n":2,"t":"tf","q":"Watching a friend master a skill makes people doubt that they can succeed.","ko":"친구가 기술을 익히는 것을 보면 사람들은 자신이 성공할 수 있다는 것을 의심하게 된다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Watching a friend master a skill can make you feel that you can succeed as well.","친구가 기술을 익히는 것을 보면, 자신도 성공할 수 있다는 느낌이 들 수 있다."]],"w":"8번에서는 친구가 기술을 익히는 것을 보면 자신도 성공할 수 있다는 느낌이 들 수 있다고 해요. 의심하게 된다는 말은 반대예요.","c":"F"},"h":"4b038171b3"},{"n":3,"t":"tf","q":"Teachers or parents can strengthen a student’s faith in his or her abilities through verbal encouragement.","ko":"교사나 부모는 언어적 격려를 통해 학생의 능력에 대한 믿음을 강화할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Third, verbal encouragement from teachers or parents can lead to greater faith in one’s abilities.","셋째, 교사나 부모에게서 받은 언어적 격려는 자신의 능력에 대한 더 큰 믿음으로 이어질 수 있다."]],"w":"9번에서 교사나 부모의 언어적 격려가 자신의 능력에 대한 더 큰 믿음으로 이어질 수 있다고 해요.","c":"T"},"h":"01783ef6a3"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (First, personal experiences play a crucial role.)","ko":"첫째, 개인의 경험이 중요한 역할을 한다.","opts":["사소한","중요한","위험한","우연한"],"word":"crucial","r":{"a":"2) 중요한","ev":"5번 문장","s":[[5,"First, personal experiences play a crucial role.","첫째, 개인의 경험이 중요한 역할을 한다."]],"w":"5번은 네 가지 원천 중 첫째로 개인의 경험을 소개하며 play a crucial role이라고 해요. 원천으로 꼽은 것이므로 '중요한'이에요.","c":2},"h":"6f14c597da"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (… some students who confidently raise their hands while others hesitate.)","ko":"자신감 있게 손을 드는 학생들도 있는 반면에 다른 학생들은 머뭇거린다.","opts":["서두르다","웃다","머뭇거리다","자랑하다"],"word":"hesitate","r":{"a":"3) 머뭇거리다","ev":"1번 문장","s":[[1,"In class, there are always some students who confidently raise their hands while others hesitate.","수업 시간에, 다른 학생들은 머뭇거리는 반면에 자신감 있게 손을 드는 학생들도 항상 있다."]],"w":"1번에서 while로 대비되는 두 부류 중 손을 자신감 있게 드는 학생과 반대되는 쪽이에요. 그래서 hesitate는 '머뭇거리다'예요.","c":3},"h":"fd4a958702"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThis will help them develop confidence, ultimately leading to better academic performance and personal growth.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이것은 그들이 자신감을 키우도록 도와줄 것이며, 궁극적으로 더 나은 학업 성취와 개인의 성장으로 이어질 것이다.","opts":["교사와 부모","심리학자들","친구들","학생들"],"r":{"a":"4) 학생들","ev":"13번 문장","s":[[13,"This will help them develop confidence, ultimately leading to better academic performance and personal growth.","이것은 그들이 자신감을 키우도록 도와줄 것이며, 궁극적으로 더 나은 학업 성취와 개인의 성장으로 이어질 것이다."]],"w":"13번의 them은 바로 앞 12번의 주어 Students(학생들)를 가리켜요. 12번에 teachers and parents가 나오지만, 그들은 피드백을 주는 사람이에요. 자신감을 키우도록 도움받는 사람은 학생들이에요.","c":4},"h":"5a19507738"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Reducing feelings of stress or anxiety helps one to feel more capable.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"스트레스나 불안의 감정을 줄이는 것은 자신이 더 유능하다고 느끼도록 돕는다.","opts":["스트레스나 불안을 줄이면 스스로 더 유능하다고 느끼게 된다.","유능하다고 느끼는 사람은 항상 스트레스나 불안을 더 느낀다.","스트레스나 불안을 줄이려면 먼저 더 유능해져야 한다.","스트레스나 불안은 사람을 더 유능하다고 느끼게 만든다."],"r":{"a":"1) 스트레스나 불안을 줄이면 스스로 더 유능하다고 느끼게 된다.","ev":"11번 문장","s":[[11,"Reducing feelings of stress or anxiety helps one to feel more capable.","스트레스나 불안의 감정을 줄이는 것은 자신이 더 유능하다고 느끼도록 돕는다."]],"w":"Reducing feelings of stress or anxiety가 주어이고 helps one to feel more capable가 동사 이하예요. 줄이는 것이 원인이고 유능하다고 느끼는 것이 결과예요.","c":1},"h":"f117199e82"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["어려운 문제를 혼자 풀면 학생들은 항상 자신감을 잃는다.","스스로 어려운 수학 문제를 성공적으로 풀면 비슷한 과업에 대한 자신감이 커진다.","혼자 수학 문제를 푼 학생이 자신감을 느끼려면 먼저 교사의 칭찬을 기다려야 한다.","수학 문제는 너무 어려워서 학생들이 자기 효능감을 키울 수 없다."],"opts":["Solving difficult problems alone always makes students lose confidence.","Successfully solving difficult math problems by yourself boosts your confidence for similar tasks.","A student who solves math problems alone must wait for a teacher’s praise before feeling confident.","Math problems are too difficult for students to build self-efficacy."],"r":{"a":"2) Successfully solving difficult math problems by yourself boosts your confidence for similar tasks. (스스로 어려운 수학 문제를 성공적으로 풀면 비슷한 과업에 대한 자신감이 커진다.)","ev":"6번 문장","s":[[6,"For example, successfully solving difficult math problems by oneself boosts confidence for similar tasks.","예를 들어, 스스로 어려운 수학 문제를 성공적으로 푸는 것은 유사한 과업에 대한 자신감을 증진시킨다."]],"w":"6번에서 스스로 어려운 수학 문제를 성공적으로 푸는 것은 비슷한 과업에 대한 자신감을 높여 준다고 해요. 자신감을 잃는다, 칭찬을 기다려야 한다, 키울 수 없다는 말은 본문에 없어요.","c":2},"h":"f0de328858"},{"n":9,"t":"sum","q":"Self-efficacy comes from four (A), such as personal experiences, observing others, verbal encouragement, and psychological (B).","ko":"자기 효능감은 개인의 경험, 타인 관찰, 언어적 격려, 그리고 심리적 (B) 등 네 가지 (A)에서 비롯된다.","oko":["(A) 과업 / (B) 문제","(A) 원천 / (B) 문제","(A) 목표 / (B) 상태","(A) 원천 / (B) 상태","(A) 과업 / (B) 상태"],"opts":["(A) tasks / (B) problems","(A) sources / (B) problems","(A) goals / (B) states","(A) sources / (B) states","(A) tasks / (B) states"],"r":{"a":"4) (A) sources / (B) states (원천 / 상태)","ev":"4번, 10번 문장","s":[[4,"According to Bandura, self-efficacy stems from four sources.","반두라에 따르면, 자기 효능감은 네 가지 원천에서 비롯된다."],[10,"Finally, psychological states are important.","마지막으로, 심리적 상태가 중요하다."]],"w":"4번에서 자기 효능감은 네 가지 원천(sources)에서 비롯되고, 10번에서 마지막 원천은 심리적 상태(states)라고 해요. 과업, 문제, 목표는 본문과 맞지 않아요.","c":4},"h":"d34a4d6e3f"},{"n":10,"t":"fill","q":"Students can develop self-efficacy by [A] small, achievable goals to experience success, seeking constructive feedback, and implementing effective stress [B] techniques.","ko":"학생들은 성공을 경험하기 위해 작고 달성 가능한 목표를 [A] 것, 건설적인 피드백을 구하는 것, 효과적인 스트레스 [B] 기법을 실행하는 것으로 자기 효능감을 키울 수 있다.","bank":["setting","management","reflexes","confidence","hesitate","feelings"],"bko":{"setting":"세우는","management":"관리","reflexes":"반사 신경","confidence":"자신감","hesitate":"머뭇거리다","feelings":"감정"},"r":{"a":"[A] setting, [B] management","ev":"12번 문장","s":[[12,"Students can develop self-efficacy by setting small, achievable goals to experience success, seeking constructive feedback from teachers and parents, and implementing effective stress management techniques.","학생들은 성공을 경험하기 위해 작고 달성 가능한 목표를 세우고, 교사와 부모에게서 건설적인 피드백을 구하고, 효과적인 스트레스 관리 기법을 실행함으로써 자기 효능감을 키울 수 있다."]],"w":"12번에서 첫 번째 방법은 작고 달성 가능한 목표를 '세우는 것(setting)'이고, 세 번째는 스트레스 '관리(management)' 기법이에요. 나머지 단어는 이 자리에서 문법이나 뜻이 맞지 않아요.","c":null},"h":"60332d672b"}]},{"u":8,"id":"ms1-08-2","no":2,"ko":"덕질도 육각형 시대","items":[{"n":1,"t":"tf","q":"K-pop fans are not satisfied with simply consuming existing content from major entertainment agencies.","ko":"케이팝 팬들은 주요 엔터테인먼트 기획사의 기존 콘텐츠를 단순히 소비하는 것에 만족하지 않는다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Their enthusiasm is so intense that they are not satisfied with simply consuming existing content from major K-pop entertainment agencies.","그들의 열정은 너무 강해서, 그들은 주요 케이팝 엔터테인먼트 기획사의 기존 콘텐츠를 단순히 소비하는 것에 만족하지 않는다."]],"w":"3번에서 팬들의 열정이 너무 강해서 기획사의 기존 콘텐츠를 단순히 소비하는 것에 만족하지 않는다고 해요.","c":"T"},"h":"dc290531b3"},{"n":2,"t":"tf","q":"In a fandustry, entertainment agencies are the producers and fans are only consumers.","ko":"팬더스트리에서는 엔터테인먼트 기획사가 생산자이고 팬들은 소비자일 뿐이다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"It represents a truly fan-driven industry where both producers and consumers are fans themselves.","그것은 생산자와 소비자 모두가 팬들 자신인, 진정한 팬 주도의 산업을 의미한다."]],"w":"6번에서 팬더스트리는 생산자와 소비자 모두가 팬 자신인 산업이라고 해요. 팬들이 소비자일 뿐이라는 말은 본문과 달라요.","c":"F"},"h":"bf74fe4365"},{"n":3,"t":"tf","q":"Fans raise money through crowdfunding to buy concert tickets for their stars.","ko":"팬들은 스타를 위한 콘서트 티켓을 사려고 크라우드펀딩으로 자금을 모은다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","s":[[8,"Other enthusiastic fans raise money through crowdfunding to display advertisements on subway stations and downtown billboards to celebrate stars’ birthdays or other milestones.","또 다른 열정적인 팬들은 스타들의 생일이나 다른 중요한 행사를 축하하고자, 지하철역이나 시내 광고판에 광고를 게시하기 위해 크라우드펀딩을 통해 자금을 모은다."]],"w":"8번에서 크라우드펀딩으로 모은 돈의 쓰임은 지하철역과 시내 광고판에 광고를 올려 스타의 생일 등을 축하하는 것이에요. 콘서트 티켓은 나오지 않아요.","c":"F"},"h":"afb2ff2702"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Their enthusiasm is so intense that they are not satisfied …)","ko":"그들의 열정은 너무 강해서 그들은 만족하지 않는다.","opts":["약한","미지근한","강한","불안한"],"word":"intense","r":{"a":"3) 강한","ev":"3번 문장","s":[[3,"Their enthusiasm is so intense that they are not satisfied with simply consuming existing content from major K-pop entertainment agencies.","그들의 열정은 너무 강해서, 그들은 주요 케이팝 엔터테인먼트 기획사의 기존 콘텐츠를 단순히 소비하는 것에 만족하지 않는다."]],"w":"3번의 so intense that은 '너무 강해서 ~한다'예요. 소비에 만족하지 못할 만큼 열정이 큰 것이므로 intense는 '강한'이에요.","c":3},"h":"b1f29723ba"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (They line up all night at pop-up stores for exclusive fan goods …)","ko":"그들은 한정판 팬 굿즈를 얻기 위해 팝업 스토어에서 밤새 줄을 선다.","opts":["한정판의","흔한","낡은","공짜의"],"word":"exclusive","r":{"a":"1) 한정판의","ev":"2번 문장","s":[[2,"They line up all night at pop-up stores for exclusive fan goods or purchase dozens of albums to increase their chances of winning a raffle to meet their idols.","그들은 한정판 팬 굿즈를 얻기 위해 팝업 스토어에서 밤새 줄을 서거나 자신의 아이돌을 만나는 추첨에 당첨될 확률을 높이기 위해 수십 장의 앨범을 구매한다."]],"w":"2번에서 팬들이 밤새 줄을 서는 이유가 굿즈예요. 아무나 쉽게 못 사기 때문에 줄을 서는 것이므로 exclusive는 '한정판의'예요.","c":1},"h":"5cdaab9d3e"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nFor example, some fans create their own goods, such as dolls, keychains, and custom art, which often sell out instantly to eager fans.","ko":"밑줄 친 which가 가리키는 것은?","sko":"예를 들어, 일부 팬들은 인형, 열쇠고리, 그리고 커스텀 아트 같은 자신만의 굿즈를 직접 제작하는데, 이것들은 열성적인 팬들에게 종종 즉시 완판된다.","opts":["일부 팬들","팬들이 직접 만든 굿즈","열성적인 팬들","스타들의 생일"],"r":{"a":"2) 팬들이 직접 만든 굿즈","ev":"7번 문장","s":[[7,"For example, some fans create their own goods, such as dolls, keychains, and custom art, which often sell out instantly to eager fans.","예를 들어, 일부 팬들은 인형, 열쇠고리, 그리고 커스텀 아트 같은 자신만의 굿즈를 직접 제작하는데, 이것들은 열성적인 팬들에게 종종 즉시 완판된다."]],"w":"which 앞 쉼표 앞의 their own goods, such as dolls, keychains, and custom art를 받아요. 즉시 완판되는 것은 팬들이 직접 만든 굿즈예요.","c":2},"h":"5569fbf327"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"They even rent out entire cafes to host “birthday cafes”, fan events dedicated to celebrating stars’ birthdays.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들은 심지어 스타들의 생일을 축하하는 데 헌정되는 팬 이벤트인 ‘생일 카페’를 주최하기 위해 카페 전체를 대관하기도 한다.","opts":["그들은 카페 주인에게 스타의 생일 행사를 열어 달라고 부탁하기까지 한다.","그들은 생일 카페에서 일하려고 카페를 통째로 사들이기까지 한다.","그들은 스타의 생일에 카페가 문을 닫는 것에 항의하기까지 한다.","그들은 스타의 생일을 축하하는 팬 이벤트를 열기 위해 카페 전체를 대관하기까지 한다."],"r":{"a":"4) 그들은 스타의 생일을 축하하는 팬 이벤트를 열기 위해 카페 전체를 대관하기까지 한다.","ev":"9번 문장","s":[[9,"They even rent out entire cafes to host “birthday cafes”, fan events dedicated to celebrating stars’ birthdays.","그들은 심지어 스타들의 생일을 축하하는 데 헌정되는 팬 이벤트인 ‘생일 카페’를 주최하기 위해 카페 전체를 대관하기도 한다."]],"w":"rent out은 '대관하다', host는 '주최하다', dedicated to는 '~에 헌정되는'이에요. fan events … 는 birthday cafes를 다시 설명해 줘요.","c":4},"h":"eed2d2e7c3"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["케이팝 팬들은 세계에서 가장 열정적인 팬들 중 하나이다.","케이팝 팬들은 다른 나라의 팬들보다 덜 열정적이다.","케이팝 팬들은 자신의 열정을 사람들 앞에서 거의 드러내지 않는다.","전 세계에 케이팝 팬은 소수만 존재한다."],"opts":["K-pop fans are some of the most passionate fans in the world.","K-pop fans are less passionate than fans in other countries.","K-pop fans rarely show their passion in public.","Only a small number of K-pop fans exist worldwide."],"r":{"a":"1) K-pop fans are some of the most passionate fans in the world. (케이팝 팬들은 세계에서 가장 열정적인 팬들 중 하나이다.)","ev":"1번 문장","s":[[1,"K-pop fans are among the most passionate in the world.","케이팝 팬들은 세계에서 가장 열정적인 팬들 중 하나이다."]],"w":"1번에서 케이팝 팬들은 세계에서 가장 열정적인 팬들 중 하나라고 해요. 다른 나라 팬들보다 덜 열정적이라거나, 열정을 드러내지 않는다거나, 팬이 소수라는 말은 본문에 없어요.","c":1},"h":"91a97ddd26"},{"n":9,"t":"sum","q":"In the fandustry, fans are not only buyers but also (A) and (B).","ko":"팬더스트리에서 팬들은 단순한 구매자일 뿐 아니라 (A)와(과) (B)(이)기도 하다.","oko":["(A) 창작자 / (B) 주도자","(A) 구경꾼 / (B) 주도자","(A) 창작자 / (B) 낯선 사람","(A) 구경꾼 / (B) 낯선 사람","(A) 비평가 / (B) 경쟁자"],"opts":["(A) creators / (B) leaders","(A) spectators / (B) leaders","(A) creators / (B) strangers","(A) spectators / (B) strangers","(A) critics / (B) rivals"],"r":{"a":"1) (A) creators / (B) leaders (창작자 / 주도자)","ev":"4번 문장","s":[[4,"In the fandustry, fans are also producers, creators, and leaders.","팬더스트리에서 팬들은 또한 생산자이자, 창작자, 그리고 주도자가 되기도 한다."]],"w":"4번에서 팬더스트리의 팬들은 생산자이자 창작자(creators), 그리고 주도자(leaders)가 되기도 한다고 해요. 구경꾼, 낯선 사람, 비평가, 경쟁자는 본문과 맞지 않아요.","c":1},"h":"85aae5a77e"},{"n":10,"t":"fill","q":"The term fandustry, which [A] fan and industry, refers to a rapidly growing industry with an [B] market size of $600 million.","ko":"‘팬’과 ‘산업’을 [A] ‘팬더스트리’라는 용어는 [B] 시장 규모가 6억 달러인 급속히 성장하는 산업을 가리킨다.","bank":["combines","estimated","raise","celebrate","display","rent"],"bko":{"combines":"결합한(combine의 현재형)","estimated":"추정되는","raise":"모으다","celebrate":"축하하다","display":"게시하다","rent":"대관하다"},"r":{"a":"[A] combines (결합한), [B] estimated (추정되는)","ev":"5번 문장","s":[[5,"The term fandustry, which combines fan and industry, refers to a rapidly growing industry with an estimated market size of $600 million.","‘팬’과 ‘산업’을 결합한 ‘팬더스트리’라는 용어는 시장 규모가 6억 달러로 추정되는 급속히 성장하는 산업을 가리킨다."]],"w":"5번에서 팬더스트리는 ‘팬’과 ‘산업’을 결합한(combines) 용어이고, 시장 규모가 6억 달러로 추정되는(estimated) 산업을 가리켜요. raise, celebrate, display, rent는 동사 원형이라 이 자리에 들어갈 수 없어요.","c":null},"h":"201c523d89"}]},{"u":8,"id":"ms1-08-3","no":3,"ko":"내 안의 야수를 깨워라","items":[{"n":1,"t":"tf","q":"Marshawn Lynch was the person who popularized the expression beast mode.","ko":"마숀 린치는 비스트 모드라는 표현을 대중화한 사람이다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"The expression was popularized by former National Football League (NFL) superstar Marshawn Lynch.","이 표현은 전 프로미식축구리그(NFL) 슈퍼스타 마숀 린치에 의해 대중화되었다."]],"w":"6번에서 이 표현은 전 NFL 슈퍼스타 마숀 린치에 의해 대중화되었다고 해요.","c":"T"},"h":"c7424b6f9c"},{"n":2,"t":"tf","q":"Beast mode is a state in which a person saves energy in order to rest and recover.","ko":"비스트 모드는 사람이 쉬고 회복하기 위해 에너지를 아끼는 상태이다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Beast mode is a state in which a person releases overwhelming energy and passion to reach a higher level of performance.","비스트 모드는 사람이 더 높은 수준의 수행 능력에 도달하기 위해 압도적인 에너지와 열정을 발산하는 상태이다."]],"w":"5번에서 beast mode는 압도적인 에너지와 열정을 발산해 더 높은 수준의 수행 능력에 도달하는 상태예요. 에너지를 아껴 쉬는 상태가 아니에요.","c":"F"},"h":"4640037298"},{"n":3,"t":"tf","q":"An adrenaline rush lowers alertness while it improves the function of muscles.","ko":"아드레날린 급증은 근육의 기능을 향상시키면서 각성도를 낮춘다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"It significantly boosts the function of muscles and organs like the heart and lungs, while increasing alertness.","그것은 각성도를 높이면서, 근육과 심장 및 폐와 같은 기관들의 기능을 크게 향상시킨다."]],"w":"11번에서 아드레날린은 근육과 기관의 기능을 크게 향상시키면서 각성도를 높여요(increasing alertness). 낮춘다는 말은 반대예요.","c":"F"},"h":"5395a42cec"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (But then, something kicks in, and you suddenly feel unstoppable.)","ko":"하지만 그러고 나서, 무언가가 발동되고, 당신은 갑자기 멈출 수 없는 상태라고 느낀다.","opts":["사라진다","멈춘다","발동된다","쓰러진다"],"word":"kicks","r":{"a":"3) 발동된다","ev":"2번 문장","s":[[2,"But then, something kicks in, and you suddenly feel unstoppable.","하지만 그러고 나서, 무언가가 발동되고, 당신은 갑자기 멈출 수 없는 상태라고 느낀다."]],"w":"2번에서 But then 뒤에 무언가가 kicks in하자 갑자기 멈출 수 없다고 느낀다고 해요. 느낌이 시작되는 것이므로 kick in은 '발동되다'예요.","c":3},"h":"cdb45b63e2"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (His explosive performances became known as beast mode.)","ko":"그의 폭발적인 수행 능력은 비스트 모드로 알려지게 되었다.","opts":["폭발적인","조용한","느린","불안정한"],"word":"explosive","r":{"a":"1) 폭발적인","ev":"9번 문장","s":[[9,"His explosive performances became known as beast mode.","그의 폭발적인 수행 능력은 비스트 모드로 알려지게 되었다."]],"w":"7번에서 린치가 달리기 시작하면 아무도 막지 못했고, 8번에서 야수로 변한 것 같았다고 해요. 그래서 explosive performances는 '폭발적인 수행 능력'이에요.","c":1},"h":"a67f3d10cf"},{"n":6,"t":"ref","q":"What does the underlined \"him\" refer to?\nOnce he grabbed the ball and started running, no one could stop him.","ko":"밑줄 친 him이 가리키는 것은?","sko":"일단 그가 공을 잡고 달리기 시작하면, 아무도 그를 막을 수 없었다.","opts":["공","마숀 린치","상대 선수","관중"],"r":{"a":"2) 마숀 린치","ev":"7번 문장","s":[[7,"Once he grabbed the ball and started running, no one could stop him.","일단 그가 공을 잡고 달리기 시작하면, 아무도 그를 막을 수 없었다."]],"w":"him은 같은 문장의 주어 he, 곧 공을 잡고 달리기 시작한 사람을 받아요. 앞 6번의 Marshawn Lynch예요. 아무도 막을 수 없었던 사람이 린치예요.","c":2},"h":"5669f88881"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It was as if he transformed into a beast.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"마치 그는 야수로 변한 것 같았다.","opts":["그는 길들인 야수를 데리고 경기장에 나타났다.","그는 야수가 된 뒤 경기장을 떠나 버렸다.","야수가 그의 모습으로 변해서 사람들을 놀라게 했다.","그는 마치 야수로 변한 것처럼 보일 만큼 압도적이었다."],"r":{"a":"4) 그는 마치 야수로 변한 것처럼 보일 만큼 압도적이었다.","ev":"8번 문장","s":[[8,"It was as if he transformed into a beast.","마치 그는 야수로 변한 것 같았다."]],"w":"It was as if he transformed into a beast에서 as if는 '마치 ~인 것처럼'이에요. 실제로 야수가 된 것이 아니라, 그만큼 막을 수 없었다는 비유예요.","c":4},"h":"c89b4e3fc0"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["운동 도중에 근육이 매우 지쳐서 거의 탈진한 상태이다.","운동을 막 시작해서 기운이 넘친다.","운동을 마치고 쉬고 있다.","근육이 완전히 편안해서 운동이 즐겁다."],"opts":["In the middle of a workout, your muscles feel very tired and you are almost exhausted.","You have just started your workout and feel full of energy.","You have finished your workout and are resting.","You enjoy your workout because your muscles feel completely relaxed."],"r":{"a":"1) In the middle of a workout, your muscles feel very tired and you are almost exhausted. (운동 도중에 근육이 매우 지쳐서 거의 탈진한 상태이다.)","ev":"1번 문장","s":[[1,"You’re halfway through your workout, your muscles are screaming for mercy, and you are almost exhausted.","당신은 운동의 절반쯤을 마쳤고, 당신의 근육은 자비를 구하는 비명을 지르고 있으며, 당신은 거의 탈진한 상태이다."]],"w":"1번에서 당신은 운동의 절반쯤을 마쳤고 근육이 비명을 지르며 거의 탈진한 상태라고 해요. 막 시작했거나 이미 끝났거나 근육이 편안하다는 말은 본문에 없어요.","c":1},"h":"beb576a08c"},{"n":9,"t":"sum","q":"It is (A) to reach beast mode, but once the inner beast is unleashed, you can push yourself beyond your (B).","ko":"비스트 모드에 도달하는 것은 (A)(이)지만, 일단 내면의 야수가 풀려나면 자신의 (B)을(를) 넘어 자신을 밀어붙일 수 있다.","oko":["(A) 쉬운 일 / (B) 한계","(A) 어려운 일 / (B) 규칙","(A) 쉬운 일 / (B) 규칙","(A) 어려운 일 / (B) 한계","(A) 위험한 일 / (B) 규칙"],"opts":["(A) easy / (B) limits","(A) difficult / (B) rules","(A) easy / (B) rules","(A) difficult / (B) limits","(A) dangerous / (B) rules"],"r":{"a":"4) (A) difficult / (B) limits (어려운 일 / 한계)","ev":"13~14번 문장","s":[[13,"Of course, it is difficult to reach beast mode.","물론, 비스트 모드에 도달하는 것은 어렵다."],[14,"But once the inner beast is unleashed, you can push yourself beyond your limits!","하지만 일단 내면의 야수가 풀려나면, 당신은 자신의 한계를 넘어 자신을 밀어붙일 수 있다!"]],"w":"13번에서 비스트 모드에 도달하는 것은 어렵다(difficult)고 하고, 14번에서 일단 내면의 야수가 풀려나면 자신의 한계(limits)를 넘어 자신을 밀어붙일 수 있다고 해요. 쉬운, 위험한, 규칙은 본문과 맞지 않아요.","c":4},"h":"bae7118e92"},{"n":10,"t":"fill","q":"This enhanced state improves muscle endurance, sharpens [A], and increases [B] efficiency, elevating performance to meet extreme physical demands.","ko":"이렇게 강화된 상태는 근지구력을 향상시키고, [A]을(를) 기민하게 하며, [B] 효율성을 증가시켜서, 극한의 신체적 요구를 충족시킬 수 있도록 수행 능력을 높인다.","bank":["reflexes","oxygen","releases","reach","push","grabbed"],"bko":{"reflexes":"반사 신경","oxygen":"산소","releases":"발산한다(release의 3인칭 단수)","reach":"도달하다","push":"밀어붙이다","grabbed":"잡았다(grab의 과거)"},"r":{"a":"[A] reflexes (반사 신경), [B] oxygen (산소)","ev":"12번 문장","s":[[12,"This enhanced state improves muscle endurance, sharpens reflexes, and increases oxygen efficiency, elevating performance to meet extreme physical demands.","이렇게 강화된 상태는 근지구력을 향상시키고, 반사 신경을 기민하게 하며, 산소 효율성을 증가시켜서, 극한의 신체적 요구를 충족시킬 수 있도록 수행 능력을 높인다."]],"w":"12번에서 강화된 상태는 근지구력을 향상시키고 반사 신경(reflexes)을 기민하게 하며 산소(oxygen) 효율성을 증가시켜요. releases, reach, push, grabbed는 동사라서 이 자리에 들어갈 수 없어요.","c":null},"h":"0f6d605f29"}]},{"u":8,"id":"ms1-08-4","no":4,"ko":"Serving Up Equality","items":[{"n":1,"t":"tf","q":"Billie Jean King won her first Wimbledon Women’s Doubles Championship in 1961.","ko":"빌리 진 킹은 1961년에 첫 윔블던 여자 복식 챔피언십에서 우승했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In 1961, Billie Jean King won her first Wimbledon Women’s Doubles Championship, partnering with Karen Hantze.","1961년에, 빌리 진 킹은 카렌 한체와 함께 팀을 이루어 윔블던 여자 복식 챔피언십에서 첫 우승을 차지했다."]],"w":"6번에서 1961년에 카렌 한체와 함께 팀을 이루어 윔블던 여자 복식 챔피언십에서 첫 우승을 차지했다고 해요.","c":"T"},"h":"389cbfddb9"},{"n":2,"t":"tf","q":"King and Karen Hantze were the oldest team to win the Wimbledon doubles title at that time.","ko":"킹과 카렌 한체는 당시 윔블던 복식 우승 타이틀을 차지한 최고령 팀이었다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"They became the youngest team to win the Wimbledon doubles title at that time.","그들은 당시 윔블던 복식 우승 타이틀을 차지한 최연소 팀이 되었다."]],"w":"7번에서 그들은 당시 윔블던 복식 우승 타이틀을 차지한 최연소(youngest) 팀이었다고 해요. 최고령이라는 말은 반대예요.","c":"F"},"h":"ea2451148c"},{"n":3,"t":"tf","q":"Bobby Riggs defeated Billie Jean King in 1973.","ko":"바비 릭스는 1973년에 빌리 진 킹을 이겼다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"Among her many achievements, the most influential was her victory against Bobby Riggs in 1973.","그녀의 많은 업적 중에서, 가장 영향력 있었던 것은 1973년에 바비 릭스를 상대로 거둔 그녀의 승리였다."]],"w":"9번에서 1973년에 이긴 사람은 킹이에요. 킹이 바비 릭스를 상대로 승리했다고 해요.","c":"F"},"h":"f7bd664bd1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… strengthened her ongoing campaign for equal prize money between men and women.)","ko":"… 남성과 여성 간의 동일한 상금을 위한 그녀의 지속적인 캠페인에 힘을 실어주었다.","opts":["끝난","갑작스러운","지속적인","불법적인"],"word":"ongoing","r":{"a":"3) 지속적인","ev":"10번 문장","s":[[10,"It not only led to increased women’s participation in sports but also strengthened her ongoing campaign for equal prize money between men and women.","그것은 여성들의 스포츠 참여를 증가시켰을 뿐만 아니라 남성과 여성 간의 동일한 상금을 위한 그녀의 지속적인 캠페인에 힘을 실어주었다."]],"w":"10번에서 동일 상금 캠페인은 승리 이전부터 이어져 온 활동이고 승리가 거기에 힘을 실어 줬어요. 그래서 ongoing은 '지속적인'이에요.","c":3},"h":"d6428fd2e1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (She established the Women’s Tennis Association and the Women’s Sports Foundation.)","ko":"그녀는 여자 테니스 협회와 여성 스포츠 재단을 설립했다.","opts":["설립했다","폐지했다","방문했다","합병했다"],"word":"established","r":{"a":"1) 설립했다","ev":"12번 문장","s":[[12,"She established the Women’s Tennis Association and the Women’s Sports Foundation.","그녀는 여자 테니스 협회와 여성 스포츠 재단을 설립했다."]],"w":"12번에서 협회와 재단은 11번의 여성 권리 증진을 위한 구체적인 활동이에요. 그래서 established는 '설립했다'예요.","c":1},"h":"dbc28a3c2d"},{"n":6,"t":"ref","q":"What does the underlined \"she\" refer to?\nWith a deep breath, she served; this moment marked a milestone for women’s sports!","ko":"밑줄 친 she가 가리키는 것은?","sko":"깊은 숨을 들이마시며, 그녀는 서브를 넣었고, 이 순간은 여성 스포츠에 있어 획기적인 사건이 되었다!","opts":["빌리 진 킹","바비 릭스","경기를 지켜본 관중","경기 심판"],"r":{"a":"1) 빌리 진 킹","ev":"1번, 3번 문장","s":[[1,"As Billie Jean King, a female tennis star, stepped onto the court, 90 million people watched.","여성 테니스 스타인 빌리 진 킹이 코트에 들어서자, 9천만 명의 사람들이 지켜보았다."],[3,"With a deep breath, she served; this moment marked a milestone for women’s sports!","깊은 숨을 들이마시며, 그녀는 서브를 넣었고, 이 순간은 여성 스포츠에 있어 획기적인 사건이 되었다!"]],"w":"3번의 she는 1번에서 코트에 들어선 여성 테니스 스타 빌리 진 킹을 가리켜요. 바비 릭스는 남자 선수라서 she가 될 수 없고, 관중과 심판은 서브를 넣는 사람이 아니에요.","c":1,"k":"she = 빌리 진 킹"},"pron":"she","h":"297bf70614"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In recognition of her contributions, the women’s international team tennis competition, formerly known as the Fed Cup, was renamed the Billie Jean King Cup in 2020.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그녀의 공헌을 인정하여, 이전에 페드컵으로 알려졌던 여성 국제 단체 테니스 대회는 2020년에 빌리 진 킹 컵으로 이름이 바뀌었다.","opts":["킹이 페드컵을 만든 공로로 2020년에 상을 받았다.","빌리 진 킹 컵은 2020년에 폐지되고 페드컵으로 대체되었다.","킹의 공헌을 인정하여, 이전에 페드컵이던 대회의 이름이 2020년에 빌리 진 킹 컵으로 바뀌었다.","킹의 공헌 때문에 2020년에 여성 국제 대회가 열리지 못하게 되었다."],"r":{"a":"3) 킹의 공헌을 인정하여, 이전에 페드컵이던 대회의 이름이 2020년에 빌리 진 킹 컵으로 바뀌었다.","ev":"13번 문장","s":[[13,"In recognition of her contributions, the women’s international team tennis competition, formerly known as the Fed Cup, was renamed the Billie Jean King Cup in 2020.","그녀의 공헌을 인정하여, 이전에 페드컵으로 알려졌던 여성 국제 단체 테니스 대회는 2020년에 빌리 진 킹 컵으로 이름이 바뀌었다."]],"w":"In recognition of her contributions는 '그녀의 공헌을 인정하여'이고, formerly known as the Fed Cup은 이전 이름이에요. was renamed는 '이름이 바뀌었다'이므로 페드컵이 빌리 진 킹 컵으로 바뀐 거예요.","c":3},"h":"9c3a9c5684"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["킹은 21살에 테니스를 시작했다.","킹은 1943년에 캘리포니아주 롱비치에서 태어났다.","킹과 릭스의 경기는 9백만 명이 지켜보았다.","킹은 한체와 함께한 첫 윔블던 복식 결승에서 졌다."],"opts":["King began playing tennis at the age of 21.","King was born in Long Beach, California, in 1943.","The match between King and Riggs was watched by 9 million people.","King lost the first Wimbledon doubles final with Hantze."],"r":{"a":"2) King was born in Long Beach, California, in 1943.","ev":"4번 문장","s":[[4,"King was born in Long Beach, California, in 1943.","킹은 1943년에 캘리포니아주 롱비치에서 태어났다."]],"w":"4번에서 킹은 1943년 캘리포니아주 롱비치에서 태어났어요. 테니스는 11살에 시작했고(5번), 지켜본 사람은 9천만 명이며(1번), 첫 윔블던 복식에서는 우승했어요(6번).","c":2},"h":"363f588e2c"},{"n":9,"t":"sum","q":"Besides her impact on the court, King actively (A) women’s (B) in sports.","ko":"킹은 코트에서의 영향력 외에도 스포츠에서 여성의 (B)을(를) 적극적으로 (A).","oko":["(A) 무시했다 / (B) 권리","(A) 증진시켰다 / (B) 기록","(A) 무시했다 / (B) 기록","(A) 증진시켰다 / (B) 권리","(A) 반대했다 / (B) 기록"],"opts":["(A) ignored / (B) rights","(A) promoted / (B) records","(A) ignored / (B) records","(A) promoted / (B) rights","(A) opposed / (B) records"],"r":{"a":"4) (A) promoted / (B) rights (증진시켰다 / 권리)","ev":"11번 문장","s":[[11,"In addition to her impact on the court, she actively promoted women’s rights in sports.","코트에서의 영향력뿐만 아니라 그녀는 스포츠에서 여성의 권리를 적극적으로 증진시켰다."]],"w":"11번에서 킹은 코트에서의 영향력뿐만 아니라 스포츠에서 여성의 권리(rights)를 적극적으로 증진시켰다(promoted)고 해요. 무시했다, 반대했다, 기록은 본문과 맞지 않아요.","c":4},"h":"7ed71bdf1f"},{"n":10,"t":"fill","q":"On the [A] side [B] Bobby Riggs, former men’s tennis No.1.","ko":"[A]편에는 과거 남자 테니스 랭킹 1위였던 바비 릭스가 [B].","bank":["opposite","stood","achieve","enter","strengthen","recognize"],"bko":{"opposite":"반대","stood":"서 있었다(stand의 과거)","achieve":"달성하다","strengthen":"강화하다","recognize":"인정하다","enter":"들어가다"},"r":{"a":"[A] opposite (반대), [B] stood (서 있었다)","ev":"2번 문장","s":[[2,"On the opposite side stood Bobby Riggs, former men’s tennis No.1.","반대편에는 과거 남자 테니스 랭킹 1위였던 바비 릭스가 서 있었다."]],"w":"2번에서 반대편(opposite side)에는 바비 릭스가 서 있었다(stood)고 해요. achieve, enter, strengthen, recognize는 동사 원형이라 이 자리에 들어갈 수 없어요.","c":null},"h":"dac3114bef"}]},{"u":9,"id":"ms1-09-1","no":1,"ko":"할머니! 이 옷 어디서 난 거야?","items":[{"n":1,"t":"tf","q":"The passage suggests looking at your grandmother’s closet if you need an idea for a trendy outfit.","ko":"이 글은 트렌디한 의상 아이디어가 필요하면 할머니의 옷장을 살펴보라고 말한다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"If you need an idea for a trendy outfit, you might want to check your grandmother’s closet.","트렌디한 의상을 위한 아이디어가 필요하다면, 당신은 할머니의 옷장을 살펴보는 것도 좋을 것이다."]],"w":"1번에서 트렌디한 의상 아이디어가 필요하다면 할머니의 옷장을 살펴보는 것도 좋다고 해요. might want to check는 '살펴보는 것도 좋겠다'는 권유예요.","c":"T"},"h":"4daaea2013"},{"n":2,"t":"tf","q":"Granny Chic has been loved by young people for several decades.","ko":"그래니 시크는 수십 년 동안 젊은이들에게 사랑받아 왔다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"The unique fashion trend called “Grandmillennial” or Granny Chic has recently captured the hearts of young people.","‘그랜드밀레니얼’ 또는 그래니 시크라고 불리는 독특한 패션 트렌드는 최근 젊은이들의 마음을 사로잡았다."]],"w":"3번에서 그래니 시크는 최근(recently) 젊은이들의 마음을 사로잡았다고 해요. 수십 년이라는 말은 본문과 달라요.","c":"F"},"h":"e52b1c243a"},{"n":3,"t":"tf","q":"Granny Chic requires people to buy new clothes instead of secondhand ones.","ko":"그래니 시크는 사람들이 중고 옷 대신 새 옷을 사야 한다고 요구한다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"While you may buy new clothes for Granny Chic, you can also choose secondhand clothes, which is a sustainable way to be stylish!","당신은 그래니 시크를 위해 새 옷을 구매할 수도 있지만, 중고 옷을 선택할 수도 있는데, 이는 멋을 낼 수 있는 지속 가능한 방법이다!"]],"w":"6번에서 새 옷을 살 수도 있지만 중고 옷을 선택할 수도 있다고 해요. 새 옷만 사야 한다는 말은 없어요.","c":"F"},"h":"909ec738c5"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (… vintage pieces that are traditionally overlooked by younger generations)","ko":"… 젊은 세대들에 의해 전통적으로 간과되는 빈티지 아이템들","opts":["높이 평가된","간과된","새로 만들어진","비싸게 팔린"],"word":"overlooked","r":{"a":"2) 간과된","ev":"7번 문장","s":[[7,"Granny Chic allows for personal expression through creative combinations of vintage pieces that are traditionally overlooked by younger generations.","그래니 시크는 전통적으로 젊은 세대들에 의해 간과되는 빈티지 아이템들의 창의적인 조합을 통해 개인적인 표현을 가능하게 한다."]],"w":"7번은 빈티지 아이템이 젊은 세대에게 전통적으로 눈길을 받지 못했다는 말이에요. overlook(간과하다)의 수동태 overlooked는 '간과된, 그냥 지나쳐진'이에요.","c":2},"h":"af29914c50"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It features cozy fabrics and vintage clothing.)","ko":"그것은 포근한 원단과 빈티지 옷을 특징으로 한다.","opts":["~을 팔다","~을 없애다","~을 특징으로 하다","~을 요구하다"],"word":"features","r":{"a":"3) ~을 특징으로 하다","ev":"4번 문장","s":[[4,"It features cozy fabrics and vintage clothing.","그것은 포근한 원단과 빈티지 옷을 특징으로 한다."]],"w":"4번은 그래니 시크의 특징이 포근한 원단과 빈티지 옷이라는 문장이에요. features(feature)는 여기서 '~을 특징으로 하다'예요.","c":3},"h":"225316322f"},{"n":6,"t":"ref","q":"What does the underlined \"her\" refer to?\nOne of the latest fashion trends is based on her style.","ko":"밑줄 친 her가 가리키는 것은?","sko":"가장 최근의 패션 트렌드들 중 하나는 그녀의 스타일을 기반으로 한다.","opts":["젊은 여성","할머니","패션 디자이너","당신의 친구"],"r":{"a":"2) 할머니","ev":"1~2번 문장","s":[[1,"If you need an idea for a trendy outfit, you might want to check your grandmother’s closet.","트렌디한 의상을 위한 아이디어가 필요하다면, 당신은 할머니의 옷장을 살펴보는 것도 좋을 것이다."],[2,"One of the latest fashion trends is based on her style.","가장 최근의 패션 트렌드들 중 하나는 그녀의 스타일을 기반으로 한다."]],"w":"1번에서 옷 아이디어가 필요하면 grandmother(할머니)의 옷장을 살펴보라고 했고, 2번의 her style은 그 할머니의 스타일이에요.","c":2},"h":"369b84b76f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The comfortable nature of oversized sweaters appeals to those looking for relief from modern life’s stress.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"큰 사이즈 스웨터의 편안한 특성은 현대 생활의 스트레스로부터 해방을 찾는 사람들의 관심을 끈다.","opts":["큰 사이즈 스웨터의 편안함이 현대 생활의 스트레스에서 벗어나고 싶은 사람들의 관심을 끈다.","큰 사이즈 스웨터는 스트레스를 받는 사람들이 입기에 불편해서 인기가 없다.","현대 생활이 편안해져서 사람들이 큰 사이즈 스웨터를 찾는다.","큰 사이즈 스웨터를 만드는 일이 현대 생활의 스트레스에서 벗어나게 해 준다."],"r":{"a":"1) 큰 사이즈 스웨터의 편안함이 현대 생활의 스트레스에서 벗어나고 싶은 사람들의 관심을 끈다.","ev":"5번 문장","s":[[5,"The comfortable nature of oversized sweaters appeals to those looking for relief from modern life’s stress.","큰 사이즈 스웨터의 편안한 특성은 현대 생활의 스트레스로부터 해방을 찾는 사람들의 관심을 끈다."]],"w":"appeals to those looking for relief는 '해방을 찾는 사람들의 관심을 끈다'예요. 편안한 특성이 스트레스에서 벗어나고 싶은 사람들을 끌어당긴다는 뜻이에요.","c":1},"h":"2adcea2405"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["할머니의 스타일은 최근 패션 트렌드들 중 하나의 바탕이 된다.","어떤 패션 트렌드도 할머니의 스타일과 관련이 없다.","가장 최근의 트렌드는 젊은 유명인들의 스타일을 기반으로 한다.","할머니들은 최근 빈티지 옷을 입는 것을 그만두었다."],"opts":["A grandmother’s style is the basis of one of the latest fashion trends.","No fashion trend is related to a grandmother’s style.","The newest trend is based on the style of young celebrities.","Grandmothers have recently stopped wearing vintage clothes."],"r":{"a":"1) A grandmother’s style is the basis of one of the latest fashion trends. (할머니의 스타일은 최근 패션 트렌드들 중 하나의 바탕이 된다.)","ev":"2번 문장","s":[[2,"One of the latest fashion trends is based on her style.","가장 최근의 패션 트렌드들 중 하나는 그녀의 스타일을 기반으로 한다."]],"w":"2번에서 가장 최근의 패션 트렌드들 중 하나가 할머니의 스타일을 기반으로 한다고 해요. 관련이 없다거나 젊은 유명인이 바탕이라거나 할머니들이 입기를 그만두었다는 말은 본문에 없어요.","c":1},"h":"5fa68096e2"},{"n":9,"t":"sum","q":"Granny Chic fans can combine oversized (A) with bright floral (B) to show their individuality.","ko":"그래니 시크를 즐기는 사람들은 개성을 보여 주기 위해 큰 사이즈의 (A)와(과) 밝은 꽃무늬 (B)을(를) 조합할 수 있다.","oko":["(A) 모자 / (B) 신발","(A) 장신구 / (B) 신발","(A) 신발 / (B) 옷감","(A) 장신구 / (B) 옷감","(A) 모자 / (B) 옷감"],"opts":["(A) hats / (B) shoes","(A) jewelry / (B) shoes","(A) shoes / (B) prints","(A) jewelry / (B) prints","(A) hats / (B) prints"],"r":{"a":"4) (A) jewelry / (B) prints (장신구 / 옷감)","ev":"8번 문장","s":[[8,"You can mix and match oversized jewelry, like brooches or ear clips, with bright floral prints to express your individuality.","당신은 당신의 개성을 표현하기 위해 브로치나 이어 클립과 같은 큰 사이즈의 장신구와 밝은 꽃무늬의 옷감을 믹스 앤 매치할 수 있다."]],"w":"8번에서 브로치나 이어 클립 같은 큰 사이즈의 장신구(jewelry)를 밝은 꽃무늬 옷감(prints)과 믹스 앤 매치할 수 있다고 해요. 모자와 신발은 본문에 나오지 않아요.","c":4},"h":"35dd6ba123"},{"n":10,"t":"fill","q":"This style proves that sometimes, the best fashion [A] comes from the [B].","ko":"이 스타일은 최고의 패션 [A]이(가) 때때로 [B]에서 온다는 것을 증명한다.","bank":["inspiration","past","relief","stress","combinations","sweaters"],"bko":{"inspiration":"영감","past":"과거","relief":"해방","stress":"스트레스","combinations":"조합","sweaters":"스웨터"},"r":{"a":"[A] inspiration, [B] past","ev":"9번 문장","s":[[9,"This style proves that sometimes, the best fashion inspiration comes from the past.","이 스타일은 최고의 패션 영감이 때때로 과거로부터 온다는 것을 증명한다."]],"w":"9번은 최고의 패션 영감(inspiration)이 때로는 과거(past)에서 온다는 결론이에요. relief, stress, combinations, sweaters는 다른 문장에 나오는 말이라 이 자리의 의미에 맞지 않아요.","c":null},"h":"20f6bba4be"}]},{"u":9,"id":"ms1-09-2","no":2,"ko":"문이 닫혔다, 천재가 열었다","items":[{"n":1,"t":"tf","q":"A fan who had been at the show suggested that Anderson stay at his nearby home.","ko":"공연장에 있었던 한 팬이 앤더슨에게 근처에 있는 자신의 집에 머물라고 제안했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Fortunately, a fan who had been at the show heard this and suggested that she stay at his nearby home.","다행히도, 그 공연장에 있었던 한 팬이 이것을 듣고 그녀에게 근처에 있는 자신의 집에 머물 것을 제안했다."]],"w":"5번에서 공연장에 있었던 한 팬이 거절당했다는 소식을 듣고 앤더슨에게 근처에 있는 자신의 집에 머물라고 제안했어요.","c":"T"},"h":"b1c1fc96ae"},{"n":2,"t":"tf","q":"A hotel turned Anderson away because her performance was poor.","ko":"한 호텔은 앤더슨의 공연이 형편없었기 때문에 그녀를 거절했다.","r":{"a":"F (본문과 다른 내용)","ev":"3~4번 문장","s":[[3,"Despite her outstanding performance, however, she was turned away by a hotel in the area.","그러나, 그녀의 뛰어난 공연에도 불구하고, 그녀는 그 지역의 한 호텔에서 거절당했다."],[4,"The only reason was that she was Black.","유일한 이유는 그녀가 흑인이었기 때문이었다."]],"w":"3번에서 앤더슨의 공연은 뛰어났는데도(outstanding) 거절당했고, 4번에서 유일한 이유는 그녀가 흑인이었기 때문이라고 해요.","c":"F"},"h":"111b281cd4"},{"n":3,"t":"tf","q":"Einstein was renowned for his role in the civil rights movement, while Anderson urged white Americans to confront racism.","ko":"아인슈타인은 시민권 운동에서의 역할로 유명했던 한편, 앤더슨은 백인 미국인들에게 인종차별에 맞서라고 촉구했다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"Anderson was renowned for her role in the civil rights movement, while Einstein urged white Americans to confront the problem of racism, calling it “a disease of white people.”","앤더슨은 시민권 운동에서의 그녀의 역할로 유명했던 한편, 아인슈타인은 인종차별을 ‘백인들의 질병’이라고 부르면서, 백인 미국인들에게 인종 차별 문제에 맞서도록 촉구했다."]],"w":"12번에서 시민권 운동에서의 역할로 유명했던 사람은 앤더슨이고, 백인 미국인들에게 인종차별에 맞서라고 촉구한 사람은 아인슈타인이에요. 두 사람의 역할을 서로 바꿔 놓은 문장이에요.","c":"F"},"h":"f399624959"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Believe it or not, this generous fan was the great physicist, Albert Einstein!)","ko":"믿거나 말거나, 이 관대한 팬은 위대한 물리학자 알베르트 아인슈타인이었다!","opts":["인색한","수줍은","관대한","무례한"],"word":"generous","r":{"a":"3) 관대한","ev":"5~6번 문장","s":[[5,"Fortunately, a fan who had been at the show heard this and suggested that she stay at his nearby home.","다행히도, 그 공연장에 있었던 한 팬이 이것을 듣고 그녀에게 근처에 있는 자신의 집에 머물 것을 제안했다."],[6,"Believe it or not, this generous fan was the great physicist, Albert Einstein!","믿거나 말거나, 이 관대한 팬은 위대한 물리학자 알베르트 아인슈타인이었다!"]],"w":"5번에서 이 팬은 거절당한 앤더슨에게 자기 집에 머물라고 제안했어요. 거절당한 앤더슨에게 자기 집을 내주겠다고 한 마음이므로 generous는 '관대한, 너그러운'이에요.","c":3},"h":"9d3e1c6b9a"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The whole audience applauded her enthusiastically!)","ko":"모든 관객이 그녀에게 열렬히 박수를 보냈다!","opts":["열렬히","마지못해","무심하게","서둘러"],"word":"enthusiastically","r":{"a":"1) 열렬히","ev":"2번 문장","s":[[2,"The whole audience applauded her enthusiastically!","모든 관객이 그녀에게 열렬히 박수를 보냈다!"]],"w":"2번은 관객이 박수를 보냈다는 문장이고, 3번에서 however로 반전돼요. 반전 전의 좋은 반응이므로 enthusiastically는 '열렬히'예요.","c":1},"h":"2869025d05"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey both raised their voices against racism.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 모두 인종차별에 맞서 목소리를 높였다.","opts":["앤더슨과 아인슈타인","앤더슨과 호텔 직원","아인슈타인과 공연장의 팬들","백인 미국인들"],"r":{"a":"1) 앤더슨과 아인슈타인","ev":"10~11번 문장","s":[[10,"But that wasn’t the only thing they had in common.","그러나 그것이 그들이 공통적으로 가지고 있었던 유일한 것은 아니었다."],[11,"They both raised their voices against racism.","그들은 모두 인종차별에 맞서 목소리를 높였다."]],"w":"11번의 They는 앞 문장들에서 공통점을 가졌다고 이야기한 앤더슨과 아인슈타인을 가리켜요. 호텔 직원은 앤더슨을 거절한 쪽이고, 백인 미국인들은 아인슈타인이 맞서라고 촉구한 대상이에요.","c":1,"k":"They = 앤더슨과 아인슈타인"},"pron":"They","h":"fdc9f2600e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Einstein loved music so much that he once said, “If I were not a physicist, I would probably be a musician.”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"아인슈타인은 음악을 너무나 사랑해서 그는 한때 “내가 물리학자가 아니었다면, 나는 아마도 음악가였을 것이다”라고 말하기도 했다.","opts":["아인슈타인은 물리학자가 되기 전에 음악가로 일했다고 말한 적이 있다.","아인슈타인은 음악가의 재능이 부족해서 물리학자가 되었다고 말한 적이 있다.","아인슈타인은 물리학자가 되려고 음악을 그만두었다고 말한 적이 있다.","아인슈타인은 음악을 매우 사랑해서 물리학자가 아니었다면 아마도 음악가였을 것이라고 말한 적이 있다."],"r":{"a":"4) 아인슈타인은 음악을 매우 사랑해서 물리학자가 아니었다면 아마도 음악가였을 것이라고 말한 적이 있다.","ev":"9번 문장","s":[[9,"Einstein loved music so much that he once said, “If
