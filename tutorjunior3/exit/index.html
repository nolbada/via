"q":"The dried-up sea left behind [A] sand, which was [B] across the land by the wind.","ko":"마른 바다는 [A] 모래를 남겼고, 그것은 바람에 의해 육지 전역으로 [B].","bank":["salty","carried","ruined","shocking","tragic","cotton"],"bko":{"salty":"소금기 있는","carried":"옮겨졌다","ruined":"망쳐졌다","shocking":"충격적인","tragic":"비극적인","cotton":"목화"},"r":{"a":"[A] salty, [B] carried","ev":"7~8번 문장","s":[[7,"As the sea dried up, it left behind salty sand.","그 바다가 마르면서, 그것은 소금기 있는 모래를 남겼다."],[8,"It was picked up by the wind and carried across the land.","그것은 바람에 의해 집어 올려져 육지 전역으로 옮겨졌다."]],"w":"7번에서 바다가 마르면서 소금기 있는(salty) 모래를 남겼고, 8번에서 그 모래가 바람에 집어 올려져 육지 전역으로 옮겨졌어요(carried). ruined(망쳐졌다)는 밭이 입은 피해이지 모래가 한 일이 아니에요(9번).","c":null},"h":"5160af686c"}]},{"u":9,"id":"rj3-09-4","no":4,"ko":"인류의 미래가 바로 이곳에","items":[{"n":1,"t":"tf","q":"The Svalbard Global Seed Vault used to be an old mine.","ko":"스발바르 국제 종자 저장고는 예전에 오래된 광산이었다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"The vault used to be an old mine in an icy mountain in Norway.","그 저장고는 노르웨이에 있는 얼음으로 뒤덮인 산에 있는 오래된 광산이었다."]],"w":"7번 문장에서 저장고는 노르웨이의 얼음으로 뒤덮인 산에 있는 오래된 광산(an old mine)이었다고 해요.","c":"T"},"h":"7bf9071471"},{"n":2,"t":"tf","q":"The seeds in the vault are kept in ordinary paper bags.","ko":"저장고의 씨앗들은 평범한 종이봉투에 보관된다.","r":{"a":"F (본문과 다른 내용)","ev":"10번 문장","s":[[10,"They are put into special bags that are free of moisture and air.","그것들은 습기와 공기가 없는 특별한 봉투 안에 넣어진다."]],"w":"10번 문장에서 씨앗은 습기와 공기가 없는 '특별한' 봉투(special bags)에 넣어진다고 해요. 평범한 종이봉투라는 말은 본문과 달라요.","c":"F"},"h":"161dbbcc70"},{"n":3,"t":"tf","q":"Scientists can use seeds to create new crops that may solve problems of the future.","ko":"과학자들은 씨앗을 이용해 미래의 문제들을 해결할지도 모르는 새로운 작물을 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"Using them, scientists can create new crops that may solve problems of the future, like unknown plant diseases or a lack of food.","그것들을 이용하여, 과학자들은 발생한 적이 없는 식물 병이나 식량 부족과 같은 미래의 문제들을 해결할지도 모르는 새로운 작물들을 만들어 낼 수 있다."]],"w":"2번 문장에서 씨앗을 이용해 미래의 문제(식물 병이나 식량 부족)를 해결할지도 모르는 새 작물을 만들 수 있다고 해요.","c":"T"},"h":"f382743b5d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The mine was renovated into a vault that can withstand extreme climate change and nuclear explosions.)","ko":"그 광산은 극심한 기후 변화와 핵폭발을 ( ) 수 있는 저장고로 개조되었다.","opts":["일으킬","예측할","견뎌낼","피할"],"word":"withstand","r":{"a":"3) 견뎌낼","ev":"8번 문장","s":[[8,"The mine was renovated into a vault that can withstand extreme climate change and nuclear explosions.","그 광산은 극심한 기후 변화와 핵폭발을 견뎌낼 수 있는 저장고로 개조되었다."]],"w":"8번은 광산을 극심한 기후 변화와 핵폭발에도 끄떡없는 저장고로 개조했다는 말이에요. 그래서 withstand는 '견뎌내다'예요. 피하는 것이 아니라 그 안에서 버티는 거예요.","c":3},"h":"9ab31aebb7"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Using them, scientists can create new crops that may solve problems of the future, like unknown plant diseases or a lack of food.)","ko":"그것들을 이용하여, 과학자들은 발생한 적이 없는 식물 병이나 식량 ( )과 같은 미래의 문제들을 해결할지도 모르는 새로운 작물들을 만들어 낼 수 있다.","opts":["부족","맛","풍부함","선택"],"word":"lack","r":{"a":"1) 부족","ev":"2번 문장","s":[[2,"Using them, scientists can create new crops that may solve problems of the future, like unknown plant diseases or a lack of food.","그것들을 이용하여, 과학자들은 발생한 적이 없는 식물 병이나 식량 부족과 같은 미래의 문제들을 해결할지도 모르는 새로운 작물들을 만들어 낼 수 있다."]],"w":"2번은 미래에 생길 수 있는 문제 두 가지를 말해요. 식물 병과 'a lack of food'예요. 새 작물이 해결해야 할 문제이므로 lack은 '부족'이에요. '풍부함'은 문제가 아니라서 반대예요.","c":1},"h":"361f9229bd"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey are put into special bags that are free of moisture and air.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 습기와 공기가 없는 특별한 봉투 안에 넣어진다.","opts":["광산들","전 세계의 과학자들","특별한 봉투들","전 세계에서 온 씨앗들"],"r":{"a":"4) 전 세계에서 온 씨앗들","ev":"9~10번 문장","s":[[9,"Deep inside the vault, seeds from around the world are kept.","그 저장고의 안쪽 깊숙이, 전 세계에서 온 씨앗들이 보관되어 있다."],[10,"They are put into special bags that are free of moisture and air.","그것들은 습기와 공기가 없는 특별한 봉투 안에 넣어진다."]],"w":"10번의 They are put into special bags에서 봉투에 '넣어지는' 것은 앞 문장 9번에서 보관된다고 한 seeds예요. 봉투 자체는 담기는 쪽이라 They가 될 수 없어요.","c":4},"h":"28440d2a4b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Scientists do the same thing with seeds —they put them in the Svalbard Global Seed Vault.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"과학자들은 씨앗들을 가지고 같은 일을 하는데, 그들은 그것들을 스발바르 국제 종자 저장고에 넣어 둔다.","opts":["과학자들은 씨앗을 은행 금고에서 꺼내 스발바르 저장고로 옮긴다.","과학자들은 씨앗을 가지고도 같은 일을 하는데, 그것들을 스발바르 국제 종자 저장고에 넣어 둔다.","과학자들은 씨앗을 이용해 스발바르 국제 종자 저장고를 만든다.","과학자들은 귀중한 물건을 모두 스발바르 국제 종자 저장고에 넣어 둔다."],"r":{"a":"2) 과학자들은 씨앗을 가지고도 같은 일을 하는데, 그것들을 스발바르 국제 종자 저장고에 넣어 둔다.","ev":"5~6번 문장","s":[[5,"When we have valuable things, we put them into a safety deposit box at a bank.","우리가 귀중한 물건을 가지고 있을 때, 우리는 그것들을 은행에 있는 안전 금고 안에 넣어 둔다."],[6,"Scientists do the same thing with seeds —they put them in the Svalbard Global Seed Vault.","과학자들은 씨앗들을 가지고 같은 일을 하는데, 그들은 그것들을 스발바르 국제 종자 저장고에 넣어 둔다."]],"w":"6번의 the same thing은 5번의 '귀중한 물건을 안전 금고에 넣어 두는 일'이에요. 과학자들은 씨앗으로 그 일을 하는데, 씨앗을 스발바르 저장고에 넣어 둬요. 저장고에 넣는 것은 귀중한 물건 전부가 아니라 씨앗이에요.","c":2},"h":"7d34b64748"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["저장고는 아프리카의 따뜻한 나라에 있다.","저장고의 씨앗들은 습기와 공기로 가득 찬 봉투에 보관된다.","과학자들은 씨앗을 은행의 안전 금고에 보관한다.","그 광산은 극심한 기후 변화를 견딜 수 있는 저장고로 바뀌었다."],"opts":["The vault is located in a warm country in Africa.","Seeds in the vault are kept in bags full of moisture and air.","Scientists keep the seeds in a safety deposit box at a bank.","The mine was changed into a vault that can withstand extreme climate change."],"r":{"a":"4) The mine was changed into a vault that can withstand extreme climate change.","ev":"5~8, 10번 문장","s":[[5,"When we have valuable things, we put them into a safety deposit box at a bank.","우리가 귀중한 물건을 가지고 있을 때, 우리는 그것들을 은행에 있는 안전 금고 안에 넣어 둔다."],[6,"Scientists do the same thing with seeds —they put them in the Svalbard Global Seed Vault.","과학자들은 씨앗들을 가지고 같은 일을 하는데, 그들은 그것들을 스발바르 국제 종자 저장고에 넣어 둔다."],[7,"The vault used to be an old mine in an icy mountain in Norway.","그 저장고는 노르웨이에 있는 얼음으로 뒤덮인 산에 있는 오래된 광산이었다."],[8,"The mine was renovated into a vault that can withstand extreme climate change and nuclear explosions.","그 광산은 극심한 기후 변화와 핵폭발을 견뎌낼 수 있는 저장고로 개조되었다."],[10,"They are put into special bags that are free of moisture and air.","그것들은 습기와 공기가 없는 특별한 봉투 안에 넣어진다."]],"w":"8번에서 광산이 극심한 기후 변화와 핵폭발을 견디는 저장고로 개조되었다고 해요. 저장고는 노르웨이에 있고(7번), 봉투는 습기와 공기가 없고(10번), 씨앗을 넣는 곳은 은행 금고가 아니라 스발바르 저장고예요(5~6번).","c":4},"h":"e54be90662"},{"n":9,"t":"sum","q":"Seeds are (A) resources, but they are (B). So scientists store them in a special vault.","ko":"씨앗은 (A) 자원이지만 (B). 그래서 과학자들은 씨앗을 특별한 저장고에 보관한다.","oko":["(A) 값싼 / (B) 늘어나고 있다","(A) 귀중한 / (B) 사라지고 있다","(A) 귀중한 / (B) 늘어나고 있다","(A) 위험한 / (B) 사라지고 있다","(A) 흔한 / (B) 자라고 있다"],"opts":["(A) cheap / (B) increasing","(A) valuable / (B) disappearing","(A) valuable / (B) increasing","(A) dangerous / (B) disappearing","(A) common / (B) growing"],"r":{"a":"2) (A) valuable / (B) disappearing","ev":"1, 3번 문장","s":[[1,"Seeds are one of our earth’s most valuable resources.","씨앗들은 우리 지구의 가장 귀중한 자원들 중 하나이다."],[3,"Sadly, this resource is disappearing.","애석하게도, 이 자원이 사라지고 있다."]],"w":"1번에서 씨앗은 가장 귀중한 자원들 중 하나(valuable)라고 하고, 3번에서 이 자원이 사라지고 있다(disappearing)고 해요. 그래서 4~6번에서 어떻게 보호할지 이야기하고 저장고가 나와요.","c":2},"h":"b5fc7152a3"},{"n":10,"t":"fill","q":"Seeds are kept in special bags that are free of [A] and air, so all of the seeds will be [B] no matter what happens.","ko":"씨앗들은 [A]와 공기가 없는 특별한 봉투에 보관되어서, 무슨 일이 일어나더라도 모든 씨앗은 [B] 것이다.","bank":["moisture","safe","icy","nuclear","unknown","renovated"],"bko":{"moisture":"습기","safe":"안전한","icy":"얼음으로 뒤덮인","nuclear":"핵의","unknown":"알려지지 않은","renovated":"개조된"},"r":{"a":"[A] moisture, [B] safe","ev":"10~11번 문장","s":[[10,"They are put into special bags that are free of moisture and air.","그것들은 습기와 공기가 없는 특별한 봉투 안에 넣어진다."],[11,"Therefore, all of the seeds will be safe no matter what happens.","그러므로, 무슨 일이 일어나더라도 모든 씨앗은 안전할 것이다."]],"w":"10번에서 씨앗은 습기(moisture)와 공기가 없는 특별한 봉투에 넣어져요. 그래서 11번에서 무슨 일이 일어나더라도 모든 씨앗은 안전할(safe) 것이라고 해요. icy는 저장고가 있는 산을 설명하는 말이고(7번), 봉투 이야기와는 상관없어요.","c":null},"h":"ce57a291d5"}]},{"u":10,"id":"rj3-10-1","no":1,"ko":"스페인의 특별한 마을","items":[{"n":1,"t":"tf","q":"About 3,000 people live in Setenil de las Bodegas.","ko":"약 3,000명이 Setenil de las Bodegas에 산다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"Setenil de las Bodegas is a Spanish town with about 3,000 residents.","Setenil de las Bodegas는 약 3,000명의 주민이 사는 스페인의 마을이다."]],"w":"1번 문장에서 이 마을에는 약 3,000명의 주민(residents)이 있다고 해요.","c":"T"},"h":"2d3130a2f5"},{"n":2,"t":"tf","q":"The Moors built complete new homes instead of using natural caves.","ko":"무어인들은 자연 동굴을 이용하는 대신 완전히 새로운 집을 지었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Instead of building complete homes, they simply added walls to natural caves.","완전한 집을 짓는 대신, 그들은 그저 자연 동굴에 벽을 추가했다."]],"w":"6번 문장은 Instead of building complete homes로 시작해요. 무어인들은 완전한 집을 짓는 대신 자연 동굴에 벽만 더했어요. 새 집을 지었다는 말은 반대예요.","c":"F"},"h":"f0fcef4b6f"},{"n":3,"t":"tf","q":"The rock hanging over the streets of the town gives shade.","ko":"마을 거리 위에 걸쳐 있는 바위는 그늘을 만들어 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"The rock hanging over the town’s streets even provides shade.","마을의 거리에 걸쳐 있는 바위는 심지어 그늘을 제공한다."]],"w":"11번 문장에서 마을의 거리에 걸쳐 있는 바위가 심지어 그늘(shade)까지 제공한다고 해요.","c":"T"},"h":"8f00b75af2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (They were likely created by the Moors, who established the town in the 12th century.)","ko":"그것들은 아마 12세기에 그 마을을 ( ) 무어인들에 의해 만들어졌을 것이다.","opts":["허물었다","방문했다","설립했다","잊어버렸다"],"word":"established","r":{"a":"3) 설립했다","ev":"5번 문장","s":[[5,"They were likely created by the Moors, who established the town in the 12th century.","그것들은 아마 12세기에 그 마을을 설립한 무어인들에 의해 만들어졌을 것이다."]],"w":"5번에서 무어인들은 12세기에 마을을 세운 사람들이에요. 그래서 establish는 '설립하다, 세우다'예요. 마을이 만들어진 이야기이므로 '허물었다'는 맞지 않아요.","c":3},"h":"7febb62825"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (These days, Setenil de las Bodegas attracts many tourists who want to take photos of this amazing town.)","ko":"요즘, Setenil de las Bodegas는 이 놀라운 마을의 사진을 찍고 싶어 하는 많은 관광객들을 ( ).","opts":["쫓아낸다","걱정시킨다","가르친다","끌어들인다"],"word":"attracts","r":{"a":"4) 끌어들인다","ev":"12번 문장","s":[[12,"These days, Setenil de las Bodegas attracts many tourists who want to take photos of this amazing town.","요즘, Setenil de las Bodegas는 이 놀라운 마을의 사진을 찍고 싶어 하는 많은 관광객들을 유치한다."]],"w":"12번에서 관광객들은 이 놀라운 마을의 사진을 찍고 싶어서 와요. 마을이 관광객을 끌어당기는 거라 attract는 '끌어들이다'예요.","c":4},"h":"f93ea4344b"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nMoreover, they keep the residents cool during hot summers.","ko":"밑줄 친 they가 가리키는 것은?","sko":"게다가, 그것들은 뜨거운 여름 동안 거주자들을 시원하게 유지해준다.","opts":["무어인들","동굴 집들","거주자들","관광객들"],"r":{"a":"2) 동굴 집들","ev":"9~10번 문장","s":[[9,"They are unlikely to be damaged by earthquakes or fire.","그것들은 지진이나 화재로 인해 피해를 볼 가능성이 작다."],[10,"Moreover, they keep the residents cool during hot summers.","게다가, 그것들은 뜨거운 여름 동안 거주자들을 시원하게 유지해준다."]],"w":"10번의 they keep the residents cool에서 거주자들(the residents)을 시원하게 '해 주는' 쪽은 동굴 집들이에요. 거주자들은 시원해지는 대상이라 they가 될 수 없어요. 앞 8~9번의 They도 같은 동굴 집들이에요.","c":2},"h":"0a6be97d74"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This architectural style is believed to be based on ancient Arabic cave homes.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 건축 양식은 고대 아랍 동굴 집들을 기반으로 한 것으로 믿어진다.","opts":["이 건축 양식은 고대 아랍 동굴 집들을 바탕으로 한 것으로 믿어진다.","이 건축 양식은 고대 아랍 동굴 집들을 허물어서 만든 것이 확실하다.","이 건축 양식은 고대 스페인의 성을 본떠 만든 것으로 믿어진다.","이 건축 양식은 아랍 사람들이 믿던 종교에서 나왔다고 한다."],"r":{"a":"1) 이 건축 양식은 고대 아랍 동굴 집들을 바탕으로 한 것으로 믿어진다.","ev":"3~4번 문장","s":[[3,"Its homes were built inside the rock walls.","그것의 집들은 암벽 안에 지어졌다."],[4,"This architectural style is believed to be based on ancient Arabic cave homes.","이 건축 양식은 고대 아랍 동굴 집들을 기반으로 한 것으로 믿어진다."]],"w":"is believed to be based on은 '~에 기초를 둔 것으로 믿어진다'는 뜻이에요. 확실하다고 말한 것이 아니라 그렇게 믿어진다는 거예요. 고대 아랍 동굴 집이 바탕이고, 성이나 종교 이야기는 나오지 않아요.","c":1},"h":"4b4f11ca91"},{"n":8  [B] 안에 지어졌다.","bank":["valley","walls","tourists","shade","summers","residents"],"bko":{"valley":"계곡","walls":"벽","tourists":"관광객","shade":"그늘","summers":"여름","residents":"주민"},"r":{"a":"[A] valley, [B] walls","ev":"2~3번 문장","s":[[2,"It is located inside a narrow river valley.","그것은 좁은 강 계곡 안에 위치해 있다."],[3,"Its homes were built inside the rock walls.","그것의 집들은 암벽 안에 지어졌다."]],"w":"2번에서 마을은 좁은 강 계곡(valley) 안에 있어요. 3번에서 집들은 암벽(rock walls) 안에 지어졌어요. shade는 11번에서 바위가 만드는 그늘이라 집이 지어진 곳이 아니에요.","c":null},"h":"c3de20a6e2"}]},{"u":10,"id":"rj3-10-2","no":2,"ko":"우리 집이 사라졌어","items":[{"n":1,"t":"tf","q":"Trulli were built with rocks but without cement.","ko":"trulli는 돌로 지어졌지만 시멘트 없이 지어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"They were built with rocks but without cement or other materials for holding the rocks together.","그것들은 돌들로 지어졌지만, 그 돌들을 접합하기 위한 시멘트나 다른 재료들 없이 지어졌다."]],"w":"3번 문장에서 trulli는 돌로 지어졌고, 돌을 붙이는 시멘트나 다른 재료는 쓰지 않았다고 해요.","c":"T"},"h":"8904835775"},{"n":2,"t":"tf","q":"Common people in the 17th century could easily pay the high tax on their houses.","ko":"17세기의 서민들은 집에 대한 높은 세금을 쉽게 낼 수 있었다.","r":{"a":"F (본문과 다른 내용)","ev":"6~7번 문장","s":[[6,"In the 17th century, people had to pay a high tax on their houses.","17세기에, 사람들은 그들의 집에 대한 높은 세금을 내야 했다."],[7,"Common people could not afford it.","서민들은 그것을 감당할 형편이 되지 않았다."]],"w":"6번에서 높은 세금을 내야 했고, 7번에서 서민들은 그것을 감당할 형편이 되지 않았다(could not afford it)고 해요. 쉽게 낼 수 있었다는 말은 반대예요.","c":"F"},"h":"055244f78b"},{"n":3,"t":"tf","q":"Houses like trulli can be seen in Alberobello, Spain.","ko":"trulli 같은 집들은 스페인의 Alberobello에서 볼 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"2번 문장","s":[[2,"You can see houses like this, called trulli, in Alberobello, Italy.","당신은 trulli라고 불리는 이와 같은 집들을 이탈리아의 Alberobello에서 볼 수 있다."]],"w":"2번 문장에서 trulli는 이탈리아(Italy)의 Alberobello에서 볼 수 있다고 해요. 스페인이라는 말은 틀려요.","c":"F"},"h":"d563857904"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In order to trick the government, they built these 민들은 그것을 감당할 형편이 되지 않았다."],[8,"In order to trick the government, they built these special houses.","정부를 속이기 위해, 그들은 이 특별한 집들을 지었다."]],"w":"6~7번에서 서민들은 높은 세금을 감당할(afford) 수 없었어요. 그래서 8번에서 정부를 속이려고 특별한 집을 지었어요(built). 세금을 거두는 쪽은 정부이지 서민이 아니에요.","c":5},"h":"093729b81c"},{"n":10,"t":"fill","q":"When government workers were coming, people took their houses [A], and after the workers left, they put the houses back [B].","ko":"정부 일꾼들이 오고 있을 때 사람들은 집을 [A] 분해했고, 일꾼들이 떠난 후에는 집을 다시 [B] 합했다.","bank":["apart","together","tax","rocks","cement","tourists"],"bko":{"apart":"따로따로","together":"함께","tax":"세금","rocks":"돌","cement":"시멘트","tourists":"관광객"},"r":{"a":"[A] apart, [B] together","ev":"9~10번 문장","s":[[9,"When they heard the government workers were coming to the town, they quickly took their houses apart.","정부에서 일하는 사람들이 마을로 오고 있다는 것을 그들이 들으면, 그들은 재빨리 그들의 집을 분해했다."],[10,"Then, after the workers left, they put the houses back together.","그러고 나서, 그 일하는 사람들이 떠난 후에, 그들은 집을 다시 합했다."]],"w":"9번에서 정부 사람들이 온다는 소식을 들으면 집을 분해했고(took apart), 10번에서 그들이 떠난 후 집을 다시 합했어요(put back together). apart와 together는 서로 반대 방향의 동작이라 자리를 바꾸면 안 돼요.","c":null},"h":"93a9a2d62b"}]},{"u":10,"id":"rj3-10-3","no":3,"ko":"두 발 아래 3만 명이!","items":[{"n":1,"t":"tf","q":"Derinkuyu was found by a man under his house in 1963.","ko":"Derinkuyu는 1963년에 한 남자가 그의 집 아래에서 발견했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1, 3번 문장","s":[[1,"In 1963, a man found a secret room beneath his house in Cappadocia, Türkiye.","1963년에, 튀르키예의 Cappadocia에서 한 남자가 그의 집 아래에 있는 비밀의 방을 발견했다."],[3,"This was the discovery of Derinkuyu, an ancient underground city.","이는 고대 지하 도시인 Derinkuyu의 발견이었다."]],"w":"1번에서 1963년에 한 남자가 집 아래의 비밀의 방을 발견했고, 3번에서 그것이 Derinkuyu 발견이었다고 해요.","c":"T"},"h":"84576c1820"},{"n":2,"t":"tf","q":"The underground city has only three floors.","ko":"그 지하 도시는 층이 세 개뿐이다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"The city has eighteen floors and reaches a depth of 85 meters.","그 도시는 18개의 층이 있고 85m의 깊이에 이른다."]],"w":"4번 문장에서 이 도시는 18개의 층(eighteen floors)이 있고 깊이가 85m에 이른다고 해요. 세 개뿐이라는 말은 틀려요.","c":"F"},"h":"8ede1b33e9"},{"n":3,"t":"tf","q":"1,500 tunnels brought fresh air to even the deepest floor.","ko":"1,500개의 터널이 가장 깊은 층까지도 맑은 공기를 들여왔다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"There was fresh, flowing water, and 1,500 tunnels brought fresh air to even the deepest floor.","흐르는 신선한 물이 있었고, 1,500개의 터널이 심지어 가장 깊은 층까지도 맑은 공기를 들여왔다."]],"w":"10번 문장에 그대로 나와요. 터널들이 가장 깊은 층까지도 맑은 공기를 들여왔어요.","c":"T"},"h":"4fba4e3365"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 1963, a man found a secret room beneath his house in Cappadocia, Türkiye.)","ko":"1963년에, 튀르키예의 Cappadocia에서 한 남자가 그의 집 ( ) 있는 비밀의 방을 발견했다.","opts":["~ 위에","~ 옆에","~ 아래에","~ 뒤쪽에"],"word":"beneath","r":{"a":"3) ~ 아래에","ev":"1번 문장","s":[[1,"In 1963, a man found a secret room beneath his house in Cappadocia, Türkiye.","1963년에, 튀르키예의 Cappadocia에서 한 남자가 그의 집 아래에 있는 비밀의 방을 발견했다."]],"w":"1번에서 남자는 자기 집 아래에서 비밀의 방을 발견했고, 그 방이 다른 방으로 이어져 지하 도시가 되었어요(2~3번). 그래서 beneath는 '~ 아래에'예요.","c":3},"h":"d415348a62"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It is big enough to hold about 30,000 people.)","ko":"그것은 약 30,000명의 사람들을 ( ) 만큼 충분히 크다.","opts":["수용할","숨길","던질","무너뜨릴"],"word":"hold","r":{"a":"1) 수용할","ev":"5번 문장","s":[[5,"It is big enough to hold about 30,000 people.","그것은 약 30,000명의 사람들을 수용할 만큼 충분히 크다."]],"w":"5번은 도시가 얼마나 큰지 말하는 문장이에요. 약 30,000명이 들어갈 수 있다는 뜻이라 hold는 '(사람을) 수용하다'예요. 4번의 층수·깊이와 이어져요.","c":1},"h":"812255ebf9"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt also included shops, schools, churches, and space for farm animals.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 또한 상점과 학교, 교회, 그리고 가축을 위한 공간을 포함했다.","opts":["연구자들","지하 도시 Derinkuyu","한 남자의 집","고고학자들"],"r":{"a":"2) 지하 도시 Derinkuyu","ev":"9~11번 문장","s":[[9,"Unlike what you might expect, the old underground city was probably quite comfortable.","당신이 예상할지도 모르는 것과는 다르게, 그 오래된 지하 도시는 아마도 꽤 편안했을 것이다."],[10,"There was fresh, flowing water, and 1,500 tunnels brought fresh air to even the deepest floor.","흐르는 신선한 물이 있었고, 1,500개의 터널이 심지어 가장 깊은 층까지도 맑은 공기를 들여왔다."],[11,"It also included shops, schools, churches, and space for farm animals.","그것은 또한 상점과 학교, 교회, 그리고 가축을 위한 공간을 포함했다."]],"w":"11번의 It also included shops, schools...는 앞에서 계속 이야기한 지하 도시 Derinkuyu예요. 9~10번에서 편안했다고 한 도시에 상점과 학교도 있었다는 내용이에요.","c":2},"h":"0020197bf6"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Unlike what you might expect, the old underground city was probably quite comfortable.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"당신이 예상할지도 모르는 것과는 다르게, 그 오래된 지하 도시는 아마도 꽤 편안했을 것이다.","opts":["당신이 예상하는 대로, 그 오래된 지하 도시는 아마도 꽤 불편했을 것이다.","당신이 예상할지도 모르는 것과는 달리, 그 오래된 지하 도시는 확실히 매우 위험했다.","당신이 예상할지도 모르는 것과 같이, 그 지하 도시는 새로 지어져서 편안했다.","당신이 예상할지도 모르는 것과는 달리, 그 오래된 지하 도시는 아마도 꽤 편안했을 것이다."],"r":{"a":"4) 당신이 예상할지도 모르는 것과는 달리, 그 오래된 지하 도시는 아마도 꽤 편안했을 것이다.","ev":"9번 문장","s":[[9,"Unlike what you might expect, the old underground city was probably quite comfortable.","당신이 예상할지도 모르는 것과는 다르게, 그 오래된 지하 도시는 아마도 꽤 편안했을 것이다."]],"w":"Unlike what you might expect는 '예상과는 달리'예요. 그래서 지하 도시가 불편할 것 같다는 예상과 반대로 probably quite comfortable, 즉 아마도 꽤 편안했다는 뜻이에요. 위험했다는 말은 없고, 도시는 새로 지은 것이 아니라 오래된 도시예요.","c":4},"h":"eff543838d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["고고학자들은 이미 그 도시의 모든 부분을 찾았다.","고고학자들은 아직도 그 도시의 새로운 부분을 찾고 있다.","그 도시는 너무 작아서 많은 사람을 수용할 수 없다.","그 도시는 1963년에 고고학자들에 의해 발견되었다."],"opts":["Archaeologists have already found every part of the city.","Archaeologists are still finding new parts of the city.","The city is too small to hold many people.","The city was discovered by archaeologists in 1963."],"r":{"a":"2) Archaeologists are still finding new parts of the city.","ev":"1, 5, 12번 문장","s":[[1,"In 1963, a man found a secret room beneath his house in Cappadocia, Türkiye.","1963년에, 튀르키예의 Cappadocia에서 한 남자가 그의 집 아래에 있는 비밀의 방을 발견했다."],[5,"It is big enough to hold about 30,000 people.","그것은 약 30,000명의 사람들을 수용할 만큼 충분히 크다."],[12,"The city is so big that archaeologists are still finding new parts!","그 도시는 매우 커서 고고학자들은 아직도 새로운 부분들을 찾아내고 있다!"]],"w":"12번에서 도시가 너무 커서 고고학자들이 아직도 새로운 부분을 찾아내고 있다고 해요. 도시는 약 30,000명을 수용할 만큼 크고(5번), 1963년에 발견한 사람은 고고학자가 아니라 한 남자예요(1번).","c":2},"h":"e217883c8b"},{"n":9,"t":"sum","q":"The heavy stone doors of Derinkuyu could be (A) like wheels to (B) the city from the inside.","ko":"Derinkuyu의 무거운 바위 문들은 도시를 안쪽에서 (B)하기 위해 바퀴처럼 (A) 수 있었다.","oko":["(A) 굴려질 / (B) 열","(A) 칠해질 / (B) 봉쇄","(A) 굴려질 / (B) 파괴","(A) 들어 올려질 / (B) 열","(A) 굴려질 / (B) 봉쇄"],"opts":["(A) rolled / (B) open","(A) painted / (B) seal","(A) rolled / (B) destroy","(A) lifted / (B) open","(A) rolled / (B) seal"],"r":{"a":"5) (A) rolled / (B) seal","ev":"8번 문장","s":[[8,"The doors, made of heavy stones, can be rolled like wheels to seal the city from the inside.","그 문들은 무거운 바위로 만들어졌는데, 도시를 안쪽에서 봉쇄하기 위해 바퀴처럼 굴려질 수 있었다."]],"w":"8번에서 문들은 무거운 바위로 만들어졌고 바퀴처럼 굴려질(rolled) 수 있었으며, 도시를 안쪽에서 봉쇄하기(seal) 위한 것이었어요. 문을 열거나 도시를 파괴하는 것이 아니에요.","c":5},"h":"12098c8f46"},{"n":10,"t":"fill","q":"There was fresh, flowing [A], and the city also included shops, schools, churches, and [B] for farm animals.","ko":"신선하게 흐르는 [A]이 있었고, 그 도시에는 또한 상점, 학교, 교회, 그리고 가축을 위한 [B]도 있었다.","bank":["water","space","enemies","wheels","comfortable","archaeologists"],"bko":{"water":"물","space":"공간","enemies":"적","wheels":"바퀴","comfortable":"편안한","archaeologists":"고고학자"},"r":{"a":"[A] water, [B] space","ev":"10~11번 문장","s":[[10,"There was fresh, flowing water, and 1,500 tunnels brought fresh air to even the deepest floor.","흐르는 신선한 물이 있었고, 1,500개의 터널이 심지어 가장 깊은 층까지도 맑은 공기를 들여왔다."],[11,"It also included shops, schools, churches, and space for farm animals.","그것은 또한 상점과 학교, 교회, 그리고 가축을 위한 공간을 포함했다."]],"w":"10번에서 흐르는 신선한 물(water)이 있었고, 11번에서 상점, 학교, 교회와 함께 가축을 위한 공간(space)도 있었어요. enemies나 wheels는 8번의 문과 숨는 이야기에 나오는 말이라 이 문장에는 맞지 않아요.","c":null},"h":"bd29b7b2d9"}]},{"u":10,"id":"rj3-10-4","no":4,"ko":"싸워보지도 못하고 지다니","items":[{"n":1,"t":"tf","q":"Finn built a causeway to cross the sea to Scotland.","ko":"Finn은 스코틀랜드로 바다를 건너기 위해 둑길을 지었다.","r":{"a":"T (본문과 맞는 내용)","ev":"4~5번 문장","s":[[4,"There is a sea between Scotland and Ireland.","스코틀랜드와 아일랜드 사이에는 바다가 있다."],[5,"So Finn built a causeway and started to cross it.","그래서 Finn은 둑길을 짓고 그것을 건너기 시작했다."]],"w":"4번에서 스코틀랜드와 아일랜드 사이에는 바다가 있고, 5번에서 Finn이 둑길을 짓고 그것을 건너기 시작했다고 해요.","c":"T"},"h":"84140faeff"},{"n":2,"t":"tf","q":"Finn thought he could easily defeat Benadonner.","ko":"Finn은 자신이 Benadonner를 쉽게 이길 수 있다고 생각했다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"On the way to Scotland, he saw Benadonner and realized that his rival was too large to defeat!","스코틀랜드로 가는 길에, 그는 Benadonner를 보았고 그의 경쟁자가 너무 커서 이길 수 없다는 것을 깨달았다!"]],"w":"6번 문장에서 Finn은 Benadonner가 너무 커서 이길 수 없다(too large to defeat)는 것을 깨달아요. 쉽게 이긴다고 생각했다는 말은 반대예요.","c":"F"},"h":"06f8299fa3"},{"n":3,"t":"tf","q":"Benadonner thought the baby was Finn’s son.","ko":"Benadonner는 그 아기가 Finn의 아들이라고 생각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"When Benadonner came to Ireland and found the baby, he thought the baby was Finn’s son.","Benadonner가 아일랜드에 와서 그 아기를 발견했을 때, 그는 그 아기가 Finn의 아들이라고 생각했다."]],"w":"9번 문장에 그대로 나와요. Benadonner는 아기를 Finn의 아들이라고 생각했어요. 사실 그 아기는 Finn 본인이에요.","c":"T"},"h":"b3258dee59"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (According to the legend, Finn MacCool, an Irish giant, decided to go to fight his Scottish rival, Benadonner.)","ko":"그 전설에 따르면, 아일랜드 거인인 Finn MacCool은 그의 스코틀랜드 ( )인 Benadonner와 싸우러 가기로 결심했다.","opts":["친구","가족","경쟁자","이웃"],"word":"rival","r":{"a":"3) 경쟁자","ev":"3번 문장","s":[[3,"According to the legend, Finn MacCool, an Irish giant, decided to go to fight his Scottish rival, Benadonner.","그 전설에 따르면, 아일랜드 거인인 Finn MacCool은 그의 스코틀랜드 경쟁자인 Benadonner와 싸우러 가기로 결심했다."]],"w":"3번에서 Finn은 Benadonner와 싸우러 가기로 결심해요. 싸울 상대이므로 rival은 '경쟁자'예요. 6번에서도 Finn이 his rival(Benadonner)이 너무 커서 이길 수 없다고 깨달아요.","c":3},"h":"088d5ddc7e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Cleverly, she dressed him like a baby and laid him in a huge cradle.)","ko":"영리하게, 그녀는 그를 아기처럼 옷을 입혀서 거대한 ( )에 눕혔다.","opts":["둑길","아기 침대","옷장","절벽"],"word":"cradle","r":{"a":"2) 아기 침대","ev":"8번 문장","s":[[8,"Cleverly, she dressed him like a baby and laid him in a huge cradle.","영리하게, 그녀는 그를 아기처럼 옷을 입혀서 거대한 아기 침대에 눕혔다."]],"w":"8번에서 Finn의 아내는 Finn에게 아기처럼 옷을 입히고 거대한 cradle에 눕혔어요. 9번에서 Benadonner가 '아기'를 발견하는 것과 이어지므로 cradle은 '아기 침대'예요.","c":2},"h":"99f5a22802"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nSo Finn built a causeway and started to cross it.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그래서 Finn은 둑길을 짓고 그것을 건너기 시작했다.","opts":["Benadonner","스코틀랜드의 절벽","아기 침대","둑길"],"r":{"a":"4) 둑길","ev":"4~5번 문장","s":[[4,"There is a sea between Scotland and Ireland.","스코틀랜드와 아일랜드 사이에는 바다가 있다."],[5,"So Finn built a causeway and started to cross it.","그래서 Finn은 둑길을 짓고 그것을 건너기 시작했다."]],"w":"5번의 So Finn built a causeway and started to cross it에서 건너기 시작한 것은 방금 지은 a causeway(둑길)예요. 건너려고 둑길을 지은 거예요.","c":4},"h":"74dcd0c6b2"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"“His father must be even more enormous!”\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"“그의 아버지는 훨씬 더 거대할 것이 틀림없어!”","opts":["그의 아버지는 훨씬 더 거대한 것이 틀림없어!","그의 아버지는 훨씬 더 작은 것이 틀림없어!","그의 아버지는 이 아기만큼만 거대할지도 몰라!","그의 아버지는 이 아기와 같은 크기라고 했어!"],"r":{"a":"1) 그의 아버지는 훨씬 더 거대한 것이 틀림없어!","ev":"10~11번 문장","s":[[10,"“What a gigantic baby!” he cried.","“이 얼마나 거대한 아기인가!”라고 그가 외쳤다."],[11,"“His father must be even more enormous!”","“그의 아버지는 훨씬 더 거대할 것이 틀림없어!”"]],"w":"must be는 '~임에 틀림없다'라는 강한 추측이고, even more enormous는 '훨씬 더 거대한'이에요. 아기가 이렇게 크니 아버지는 훨씬 더 클 것이라는 뜻이에요.","c":1},"h":"27593a3e65"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["Finn은 Benadonner가 오는 것을 막으려고 둑길을 파괴했다.","Benadonner는 아일랜드에 남아서 Finn과 싸웠다.","Benadonner는 집으로 달려가면서 그의 뒤로 둑길을 파괴했다.","Benadonner는 Finn의 아내를 만나러 가기 위해 둑길을 지었다."],"opts":["Finn destroyed the causeway to stop Benadonner from coming.","Benadonner stayed in Ireland and fought with Finn.","Benadonner ran home and destroyed the causeway behind him.","Benadonner built the causeway to visit Finn’s wife."],"r":{"a":"3) Benadonner ran home and destroyed the causeway behind him.","ev":"5, 12~13번 문장","s":[[5,"So Finn built a causeway and started to cross it.","그래서 Finn은 둑길을 짓고 그것을 건너기 시작했다."],[12,"Benadonner ran home quickly, destroying the causeway behind him.","Benadonner는 그의 뒤로 그 둑길을 파괴하면서 빠르게 집으로 달려갔다."],[13,"The Giant’s Causeway is what remains.","Giant’s Causeway는 남아 있는 것이다."]],"w":"12번에서 Benadonner는 집으로 빠르게 달려가면서 뒤의 둑길을 파괴했고, 13번에서 남은 것이 지금의 Giant's Causeway라고 해요. 둑길을 지은 것은 Finn이에요(5번).","c":3},"h":"3b98fbb278"},{"n":9,"t":"sum","q":"Finn found that Benadonner was too (A), so his wife dressed him like a (B) to trick Benadonner.","ko":"Finn은 Benadonner가 너무 (A) 것을 알았고, 그래서 그의 아내는 Benadonner를 속이려고 Finn을 (B)처럼 옷을 입혔다.","oko":["(A) 작은 / (B) 아기","(A) 큰 / (B) 거인","(A) 작은 / (B) 거인","(A) 빠른 / (B) 아기","(A) 큰 / (B) 아기"],"opts":["(A) small / (B) baby","(A) large / (B) giant","(A) small / (B) giant","(A) fast / (B) baby","(A) large / (B) baby"],"r":{"a":"5) (A) large / (B) baby","ev":"6, 8번 문장","s":[[6,"On the way to Scotland, he saw Benadonner and realized that his rival was too large to defeat!","스코틀랜드로 가는 길에, 그는 Benadonner를 보았고 그의 경쟁자가 너무 커서 이길 수 없다는 것을 깨달았다!"],[8,"Cleverly, she dressed him like a baby and laid him in a huge cradle.","영리하게, 그녀는 그를 아기처럼 옷을 입혀서 거대한 아기 침대에 눕혔다."]],"w":"6번에서 Finn은 Benadonner가 너무 커서(large) 이길 수 없다고 깨달아요. 그래서 8번에서 아내는 Finn에게 아기(baby)처럼 옷을 입히고 아기 침대에 눕혔어요.","c":5},"h":"70675e2848"},{"n":10,"t":"fill","q":"Benadonner thought the [A] was Finn’s son, and cried, “His father must be even more [B]!”","ko":"Benadonner는 그 [A]가 Finn의 아들이라고 생각하고 외쳤다. “그의 아버지는 훨씬 더 [B]한 것이 틀림없어!”","bank":["baby","enormous","cradle","causeway","rival","legend"],"bko":{"baby":"아기","enormous":"거대한","cradle":"아기 침대","causeway":"둑길","rival":"경쟁자","legend":"전설"},"r":{"a":"[A] baby, [B] enormous","ev":"9~11번 문장","s":[[9,"When Benadonner came to Ireland and found the baby, he thought the baby was Finn’s son.","Benadonner가 아일랜드에 와서 그 아기를 발견했을 때, 그는 그 아기가 Finn의 아들이라고 생각했다."],[10,"“What a gigantic baby!” he cried.","“이 얼마나 거대한 아기인가!”라고 그가 외쳤다."],[11,"“His father must be even more enormous!”","“그의 아버지는 훨씬 더 거대할 것이 틀림없어!”"]],"w":"9번에서 Benadonner는 아기(baby)를 Finn의 아들이라고 생각해요. 10~11번에서 이렇게 거대한 아기라면 아버지는 훨씬 더 거대할(enormous) 것이라고 외쳐요. 아버지의 크기를 말하는 자리에는 형용사가 와야 해서 enormous만 들어갈 수 있어요.","c":null},"h":"a96d34d5f5"}]}];

 if(fin){var d0=done[p.id],pass=d0.s*10>=70,wr0=p.items.filter(function(it){return !d0.ok[it.n]}).map(function(it){return it.n});var bn=el("div","banner "+(pass?"pass":"fail"));bn.id="bn";bn.appendChild(el("span","vd",pass?"PASS":"FAIL"));bn.appendChild(el("span","sc",(d0.s*10)+"점 ("+d0.s+" / 10)"));bn.appendChild(el("span","wr",wr0.length?"틀린 문항: "+wr0.join(", ")+"번":"전 문항 정답"));bn.appendChild(el("span","rule",pass?"70점 이상 통과":"70점 미만: 클래스카드 추가학습을 하세요."));bn.appendChild(navBar());v.appendChild(bn)}
 var box=el("div",fin?"locked":"");
 p.items.forEach(function(it){
  var q=el("section","q");var h=el("div","qh");h.appendChild(el("span","qn",it.n));h.appendChild(el("span",null,LAB[it.t]));var okm=fin?done[p.id].ok[it.n]:null;if(fin){h.appendChild(el("span","mk "+(okm?"o1":"x1"),okm?"O":"X"));if(!okm)q.className+=" wrong"}q.appendChild(h);
  var qt=el("p","qt");
  if(it.t==="fill"){var parts=it.q.split(/(\[A\]|\[B\])/);parts.forEach(function(s){if(s==="[A]"||s==="[B]"){var k=s==="[A]"?0:1;var sel=el("select");var o0=el("option",null,s);o0.value="";sel.appendChild(o0);it.bank.forEach(function(w){var o=el("option",null,w);o.value=w;sel.appendChild(o)});var cu=(ans[p.id]||{})[it.n];if(cu&&cu[k])sel.value=cu[k];sel.onchange=function(){var c=((ans[p.id]||{})[it.n]||["",""]).slice();c[k]=sel.value;setAns(p,it,c);foot()};qt.appendChild(sel)}else qt.appendChild(document.createTextNode(s))});q.appendChild(qt)}
  else{if(it.t==="vocab"&&it.word){qt.innerHTML=esc(it.q).replace(esc(it.word),"<b>"+esc(it.word)+"</b>")}else qt.textContent=it.q;q.appendChild(qt)}
  if(it.t==="tf"){var g=el("div","tf");["T","F"].forEach(function(x){var b=el("button","o",x);b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===x));b.onclick=function(){setAns(p,it,x);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.opts){var g=el("div","opts");it.opts.forEach(function(t,i){var b=el("button","o");b.innerHTML="<i>"+(i+1)+"</i><span></span>";b.lastChild.textContent=t;b.setAttribute("aria-pressed",String((ans[p.id]||{})[it.n]===i+1));b.onclick=function(){setAns(p,it,i+1);Array.prototype.forEach.call(g.children,function(c){c.setAttribute("aria-pressed",String(c===b))});foot()};g.appendChild(b)});q.appendChild(g)}
  else if(it.t==="fill"){q.appendChild(el("p","bank","보기: "+it.bank.join(" / ")))}
  if(fin){var pk=(ans[p.id]||{})[it.n];if(it.t==="tf"){Array.prototype.forEach.call(q.querySelector(".tf").children,function(b){var v=b.textContent;if(v===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(v===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}else if(it.opts){Array.prototype.forEach.call(q.querySelector(".opts").children,function(b,i){if(i+1===it.r.c){b.className+=" good";b.appendChild(el("span","tg","정답"))}else if(i+1===pk&&!okm){b.className+=" bad";b.appendChild(el("span","tg","내 답"))}})}}
  if(fin&&it.r){var rv=el("div","rv");
   var z1=el("div","zone z-tr");z1.appendChild(el("h4",null,"한글 해석"));

   if(it.oko){var ol=el("ol");it.oko.forEach(function(x){ol.appendChild(el("li",null,x))});var lb=el("p","ln");lb.appendChild(el("b",null,"선택지"));z1.appendChild(lb);z1.appendChild(ol)}
   if(it.bko){var bl=el("p","ln");bl.appendChild(el("b",null,"보기 단어"));bl.appendChild(document.createTextNode(it.bank.map(function(w){return w+" "+(it.bko[w]||"")}).join(" / ")));z1.appendChild(bl)}
   if(z1.children.length>1)rv.appendChild(z1);
   var z2=el("div","zone z-an");z2.appendChild(el("h4",null,"정답 · 해설"));z2.appendChild(el("p","ra","정답: "+it.r.a));z2.appendChild(el("div","rl","교재 근거 ("+it.r.ev+")"));it.r.s.forEach(function(x){var d=el("div","rs");var e=el("span","en");e.appendChild(el("span","sn",x[0]+"번"));e.appendChild(document.createTextNode(x[1]));d.appendChild(e);d.appendChild(el("span","ko",x[2]));z2.appendChild(d)});z2.appendChild(el("div","rl","정리"));z2.appendChild(el("p","rw",it.r.w));rv.appendChild(z2);if(okm){rv.style.display="none";var tg=el("button","tgl","해설 보기");tg.onclick=function(){var s=rv.style.display==="none";rv.style.display=s?"block":"none";tg.textContent=s?"해설 닫기":"해설 보기"};q.appendChild(tg)}q.appendChild(rv)}
  box.appendChild(q)});
 v.appendChild(box);
 var sb=el("div","sbar");sb.id="sbar";v.appendChild(sb);foot();
 if(fin)showScore(p)}
function foot(){var p=pr(),sb=document.getElementById("sbar");if(!sb||done[p.id])return;sb.innerHTML="";var n=p.items.filter(function(it){return answered(p,it)}).length;sb.appendChild(el("span","cnt","답한 문항 "+n+" / 10"));var b=el("button","sub-btn","제출");b.disabled=n<10;b.onclick=function(){submit(p)};sb.appendChild(b)}
async function hash(s){var d=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return Array.prototype.map.call(new Uint8Array(d),function(b){return b.toString(16).padStart(2,"0")}).join("").slice(0,10)}
async function submit(p){var s=0,ok={};for(var i=0;i<p.items.length;i++){var it=p.items[i],a=(ans[p.id]||{})[it.n];var str=it.t==="fill"?a.map(function(x){return x.toLowerCase()}).join(","):String(a);if(await hash(p.id+"|"+it.n+"|"+str)===it.h){s++;ok[it.n]=true}else ok[it.n]=false}done[p.id]={s:s,ok:ok};view();window.scrollTo(0,0)}
function showScore(p){var sb=document.getElementById("sbar");sb.innerHTML="";var d=done[p.id];var c=el("div","score");c.appendChild(el("span",null,readName(p)+" 점수"));c.appendChild(el("b",null,(d.s*10)+"점"));c.appendChild(el("span",null,d.s+" / 10 문항"));sb.style.display="block";sb.appendChild(c);sb.appendChild(navBar())}
boot();

  var t=document.createElement("div");t.className="top";
  t.innerHTML='<span class="tk">EXIT TEST</span><h1></h1><p class="sub">Reading별 10문항</p>';t.querySelector("h1").textContent=document.title.replace(/ Exit Test$/,"");v.appendChild(t);
  var last=null;
  P.forEach(function(p){
    if(p.u!==last){last=p.u;var g=document.createElement("div");g.className="grp";g.textContent=secName(p.u);v.appendChild(g)}
    var ok=ready(p.id);
    var r=document.createElement(ok?"a":"div");r.className="pk"+(ok?"":" lk");if(ok)r.href="?r="+encodeURIComponent(p.id);
    var l=document.createElement("div");var b=document.createElement("b");b.textContent=readName(p);var s=document.createElement("span");s.className="t";s.textContent=p.ko;l.appendChild(b);l.appendChild(s);r.appendChild(l);
    var st=document.createElement("span");st.className="st";st.textContent=ok?"응시 가능":"잠김";r.appendChild(st);v.appendChild(r)});
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("홈으로","../",true));v.appendChild(n)}
function gate(p){var v=document.getElementById("view");v.innerHTML="";v.appendChild(testHead(p));
  var g=document.createElement("div");g.className="gate";g.innerHTML="<b>아직 응시할 수 없어요</b><p>지문 읽기와 문제 선지를 모두 마친 뒤에 열려요.</p>";v.appendChild(g);
  var n=document.createElement("div");n.className="nav";n.appendChild(lnk("이 Reading으로 돌아가기","../?r="+encodeURIComponent(p.id),true));n.appendChild(lnk("Exit test 목록","./"));v.appendChild(n)}
function boot(){var m=/[?&]r=([^&]+)/.exec(location.search);
  if(m){var id=decodeURIComponent(m[1]);var p=P.filter(function(x){return x.id===id})[0];
    if(p){cur=id;if(!ready(id)){gate(p);return}view();return}}
  picker()}
