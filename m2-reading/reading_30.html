<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 30</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}
.sec{margin:26px 0 8px;font-weight:700;color:var(--pri);font-size:15px;border-left:4px solid var(--pri);padding-left:8px}
.sent{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.row{display:flex;gap:10px;align-items:flex-start}.n{min-width:24px;color:var(--mut);font-size:13px;padding-top:3px}

.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}
.note{margin:10px 0 0 34px;padding:10px 12px;border-radius:8px;font-size:14.5px}
.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}

button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Soccer are a popular sport all over the world. It is also quite simply.","ko":"축구는 전 세계에서 인기 있는 운동입니다. 그것은 꽤 단순하기도 하죠.","ok":false,"foot":[],"fixes":[{"wrong":"are","right":"is","partial":false,"at":[1],"point":"be동사의 수일치: 주어 Soccer(단수)는 is (are 아님)","topic":"be동사의 수일치","memo":"주어 Soccer(단수)는 is (are 아님)"},{"wrong":"simply","right":"simple","partial":false,"at":[13],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 simple 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 simple 사용"}]},{"n":2,"tag":null,"en":"You just need an ball, a small open space, and the desire to kicking! Oh, don't forget one more thing.","ko":"여러분은 공, 작은 열린 공간, 그리고 (공을) 찰 욕구만이 필요해요! 아, 한 가지 더 잊지 마세요.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[3],"point":"관사 a/an: 자음 소리 ball 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 ball 앞에는 a 사용"},{"wrong":"kicking","right":"kick","partial":false,"at":[13],"point":"to부정사: to 뒤에는 동사원형 kick 사용","topic":"to부정사","memo":"to 뒤에는 동사원형 kick 사용"}]},{"n":3,"tag":null,"en":"You need to understand the important of colors!","ko":"여러분은 색깔의 중요성을 이해해야 해요!","ok":false,"foot":[],"fixes":[{"wrong":"important","right":"importance","partial":false,"at":[5],"point":"품사: 관사 the 뒤에는 명사 importance 사용","topic":"품사","memo":"관사 the 뒤에는 명사 importance 사용"}]},{"n":4,"tag":"흑백 축구공","en":"Soccer balls today come on various colors, but black and white balls is quite common.","ko":"오늘날 축구공은 다양한 색깔로 나오지만, 검고 흰 축구공이 상당히 흔합니다.","ok":false,"foot":[],"fixes":[{"wrong":"on","right":"in","partial":false,"at":[4],"point":"기본전치사: '~색으로 나오다'는 come in 사용","topic":"기본전치사","memo":"'~색으로 나오다'는 come in 사용"},{"wrong":"is","right":"are","partial":false,"at":[12],"point":"be동사의 수일치: 복수 주어 balls에는 are 사용","topic":"be동사의 수일치","memo":"복수 주어 balls에는 are 사용"}]},{"n":5,"tag":null,"en":"Have you heard about the origin of this popular design? Black and white balls comes out during the 1970 World Cup on Mexico.","ko":"여러분은 이 인기 있는 디자인의 기원에 대해 들어 본 적 있나요? 검고 흰 축구공은 1970년 멕시코 월드컵 동안에 나왔습니다.","ok":false,"foot":[],"fixes":[{"wrong":"comes","right":"came","partial":false,"at":[14],"point":"일반동사의 과거형: 과거 이야기이므로 came 사용","topic":"일반동사의 과거형","memo":"과거 이야기이므로 came 사용"},{"wrong":"on","right":"in","partial":false,"at":[21],"point":"기본전치사: '멕시코에서(나라 안)'는 in Mexico 사용","topic":"기본전치사","memo":"'멕시코에서(나라 안)'는 in Mexico 사용"}]},{"n":6,"tag":null,"en":"People could spotted them easily on their black and white TVs. Isn't that smart?","ko":"사람들은 그들의 흑백 TV에서 그것들을 쉽게 발견할 수 있었어요. 그것은 똑똑하지 않나요?","ok":false,"foot":[],"fixes":[{"wrong":"spotted","right":"spot","partial":false,"at":[2],"point":"조동사 뒤 동사원형: 조동사 could 뒤에는 동사원형: spot (spotted 아님)","topic":"조동사 뒤 동사원형","memo":"조동사 could 뒤에는 동사원형: spot (spotted 아님)"}]},{"n":7,"tag":null,"en":"Now we have color televisions, but we still kick the classic black and white soccer balls.","ko":"이제 우리는 컬러텔레비전을 갖고 있지만, 우리는 여전히 이 고전적인 검고 흰 축구공을 찹니다.","ok":true,"foot":[],"fixes":[]},{"n":8,"tag":"유니폼 색깔","en":"Players on each team wears uniforms with their own colors. Uniform colors have the power to unite the team under the same spirit.","ko":"각 팀의 선수들은 자신들만의 색깔이 있는 유니폼을 입습니다. 유니폼 색깔은 팀을 같은 정신 아래 결속시키는 힘을 가졌습니다.","ok":false,"foot":[],"fixes":[{"wrong":"wears","right":"wear","partial":false,"at":[4],"point":"주어와 동사의 수일치: 주어 Players(복수)는 wear (wears 아님)","topic":"주어와 동사의 수일치","memo":"주어 Players(복수)는 wear (wears 아님)"}]},{"n":9,"tag":null,"en":"They are also usefully on the field. Players can spot each other and make quickly decisions thanks for their team's unique colors.","ko":"그것들은 또한 경기장에서 유용합니다. 선수들은 그들의 팀의 고유한 색깔 덕분에 서로를 알아보고 빠른 결정을 내릴 수 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"usefully","right":"useful","partial":false,"at":[3],"point":"형용사와 부사: be동사 뒤 보어 자리에는 형용사 useful 사용","topic":"형용사와 부사","memo":"be동사 뒤 보어 자리에는 형용사 useful 사용"},{"wrong":"quickly","right":"quick","partial":false,"at":[14],"point":"형용사와 부사: 명사 decisions를 꾸미는 말은 형용사 quick 사용","topic":"형용사와 부사","memo":"명사 decisions를 꾸미는 말은 형용사 quick 사용"},{"wrong":"for","right":"to","partial":false,"at":[17],"point":"관용 표현: '~덕분에'는 thanks to 사용","topic":"관용 표현","memo":"'~덕분에'는 thanks to 사용"}]},{"n":10,"tag":null,"en":"On the field, referees wear uniforms with special colors because they need to stand out from the players.","ko":"경기장에서, 심판들은 선수들로부터 눈에 띄어야 할 필요가 있기 때문에 특별한 색깔의 유니폼을 입습니다.","ok":true,"foot":[],"fixes":[]},{"n":11,"tag":null,"en":"Among several color, black has been their favorite. Black looks powerful, and it sends an strong \"Don't argue with me!\" messages.","ko":"몇몇의 색깔 중에서, 검은색은 그들이 가장 좋아하는 것입니다. 검은색은 강력해 보이고 \"나와 논쟁하지 마시오!\"라는 강한 메시지를 전합니다.","ok":false,"foot":[],"fixes":[{"wrong":"color","right":"colors","partial":false,"at":[2],"point":"명사의 복수형: several 뒤에는 복수명사 colors 사용","topic":"명사의 복수형","memo":"several 뒤에는 복수명사 colors 사용"},{"wrong":"an","right":"a","partial":false,"at":[14],"point":"관사 a/an: 자음 소리 strong 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 strong 앞에는 a 사용"},{"wrong":"messages","right":"message","partial":false,"at":[20],"point":"명사의 단수형: a strong 뒤에는 단수명사 message 사용","topic":"명사의 단수형","memo":"a strong 뒤에는 단수명사 message 사용"}]},{"n":12,"tag":"의사소통 색깔 카드","en":"Referees have used yellow and red cards since 1970. Different color cards send different messages to players.","ko":"심판은 1970년부터 노란색과 빨간색 카드를 사용해 왔습니다. 다른 색깔의 카드는 선수들에게 다른 메시지를 전합니다.","ok":true,"foot":[],"fixes":[]},{"n":13,"tag":null,"en":"Yellow cards say, \"Be careful with that fouls!\" Red cards mean \"You're out!\"","ko":"옐로카드는 \"그러한 반칙들을 조심하시오!\"라고 말합니다. 레드카드는 \"당신은 퇴장입니다!\"를 의미합니다.","ok":false,"foot":[],"fixes":[{"wrong":"that","right":"those","partial":false,"at":[6],"point":"지시형용사: 복수명사 fouls 앞에는 those 사용","topic":"지시형용사","memo":"복수명사 fouls 앞에는 those 사용"}]},{"n":14,"tag":null,"en":"All players from different country clearly understand the meaning of these card.","ko":"다양한 나라 출신의 모든 선수들은 이 카드들의 의미를 분명하게 이해합니다.","ok":false,"foot":[],"fixes":[{"wrong":"country","right":"countries","partial":false,"at":[4],"point":"명사의 복수형: different 뒤에 at smart? Now we have color televisions, but we still kick the classic black and white soccer balls.","The Uniform Colors","Players on each team wear uniforms with their own colors. Uniform colors have the power to unite the team under the same spirit. They are also useful on the field. Players can spot each other and make quick decisions thanks to their team's unique colors. On the field, referees wear uniforms with special colors because they need to stand out from the players. Among several colors, black has been their favorite. Black looks powerful, and it sends a strong \"Don't argue with me!\" message.","Color Cards for Communication","Referees have used yellow and red cards since 1970. Different color cards send different messages to players. Yellow cards say, \"Be careful with those fouls!\" Red cards mean \"You're out!\" All players from different countries clearly understand the meaning of these cards.","Do you have a plan to watch a soccer match? Then check out the various colors on the field. It will be more fun!"];var PASS_KO=["축구에서의 색깔","축구는 전 세계에서 인기 있는 운동입니다. 그것은 꽤 단순하기도 하죠. 여러분은 공, 작은 열린 공간, 그리고 (공을) 찰 욕구만이 필요해요! 아, 한 가지 더 잊지 마세요. 여러분은 색깔의 중요성을 이해해야 해요!","검고 흰 축구공","오늘날 축구공은 다양한 색깔로 나오지만, 검고 흰 축구공이 상당히 흔합니다. 여러분은 이 인기 있는 디자인의 기원에 대해 들어 본 적 있나요? 검고 흰 축구공은 1970년 멕시코 월드컵 동안에 나왔습니다. 사람들은 그들의 흑백 TV에서 그것들을 쉽게 발견할 수 있었어요. 그것은 똑똑하지 않나요? 이제 우리는 컬러텔레비전을 갖고 있지만, 우리는 여전히 이 고전적인 검고 흰 축구공을 찹니다.","유니폼 색깔","각 팀의 선수들은 자신들만의 색깔이 있는 유니폼을 입습니다. 유니폼 색깔은 팀을 같은 정신 아래 결속시키는 힘을 가졌습니다. 그것들은 또한 경기장에서 유용합니다. 선수들은 그들의 팀의 고유한 색깔 덕분에 서로를 알아보고 빠른 결정을 내릴 수 있습니다. 경기장에서, 심판들은 선수들로부터 눈에 띄어야 할 필요가 있기 때문에 특별한 색깔의 유니폼을 입습니다. 몇몇의 색깔 중에서, 검은색은 그들이 가장 좋아하는 것입니다. 검은색은 강력해 보이고 \"나와 논쟁하지 마시오!\"라는 강한 메시지를 전합니다.","의사소통을 위한 색깔 카드","심판은 1970년부터 노란색과 빨간색 카드를 사용해 왔습니다. 다른 색깔의 카드는 선수들에게 다른 메시지를 전합니다. 옐로카드는 \"그러한 반칙들을 조심하시오!\"라고 말합니다. 레드카드는 \"당신은 퇴장입니다!\"를 의미합니다. 다양한 나라 출신의 모든 선수들은 이 카드들의 의미를 분명하게 이해합니다.","여러분은 축구 경기를 볼 계획이 있나요? 그렇다면 경기장에서의 다양한 색깔을 확인해 보세요. 그것은 더 재미있을 것입니다!"];var DG=[{"qs":[{"n":1,"q":"위 대화의 주제로 알맞은 것은?","o":["여행 약속 정하기","좋아하는 주말 활동","농구 경기 관람에 좋은 좌석","농구 경기 관람 약속 정하기","농구 경기 관람 후의 소감 나누기"],"a":3,"ans":"농구 경기 관람 약속 정하기","evs":[["Kate: I'm going to go to a basketball game this Saturday. I have free tickets. Do you want to join me?","나 이번 주 토요일에 농구 경기 보러 갈 거야. 무료 입장권이 있거든. 나랑 같이 갈래?"],["Junho: Then let's meet in front of the main gate. Can you make it at 1 p.m.?","그럼 정문 앞에서 만나자. 오후 1시에 만날 수 있어?"]],"ev":["Kate: I'm going to go to a basketball game this Saturday. I have free tickets. Do you want to join me?","나 이번 주 토요일에 농구 경기 보러 갈 거야. 무료 입장권이 있거든. 나랑 같이 갈래?"],"ow":["오답 ✕ — 'I have a family trip this weekend.'(이번 주말에 가족 여행이 있어.)라는 민지의 사정만 있을 뿐, 여행 약속을 정하는 대화가 아니라서 틀림.","오답 ✕ — 'What are you going to do this Saturday?'(이번 주 토요일에 뭐 할 거야?)로 시작하지만 좋아하는 주말 활동을 말하는 대화가 아니라 농구 경기 약속이 중심이다.","오답 ✕ — 'It's at 2 p.m. at Dream Stadium.'(오후 2시에 Dream 경기장에서 해.)이라고 경기 장소와 시간은 나오지만 좋은 좌석에 대한 이야기는 없다.","정답 ○ — Kate가 'Do you want to join me?'(나랑 같이 갈래?)라고 하고 'Can you make it at 1 p.m.?'(1시에 만날 수 있어?), 'That works for me.'(난 좋아.)로 만날 시간과 장소를 정하므로 농구 경기 관람 약속을 정하는 대화이다.","오답 ✕ — 경기를 본 뒤의 감상은 없다. 마지막에 'I hope you have a good time.'(즐거운 시간 보내길 바라.)은 경기 전의 인사이다."],"memo":["정답 ④: 농구 경기 관람 약속 정하기","근거: Can you make it at 1 p.m.?(1시에 만날 수 있어?) - That works for me.(난 좋아.)","함정: ⑤ 경기를 본 후의 소감은 나오지 않아서 ✕"],"why":"Kate가 농구 경기에 가자고 제안하고 만날 시간과 장소를 정하는 대화이다."},{"n":2,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Kate는 농구 경기 무료입장권이 있다.","Kate는 친구들에게 농구 경기를 보러갈 것을 제안한다.","민지는 이번 주말에 가족과 함께 여행을 갈 것이다.","농구 경기는 오후 2시에 시작한다.","준호와 Kate는 경기 시작 직전에 만날 것이다."],"a":4,"ans":"준호와 Kate는 경기 시작 직전에 만날 것이다.","evs":[["Junho: Then let's meet in front of the main gate. Can you make it at 1 p.m.?","그럼 정문 앞에서 만나자. 오후 1시에 만날 수 있어?"],["Kate: It's at 2 p.m. at Dream Stadium.","오후 2시에 Dream 경기장에서 해."]],"ev":["Junho: Then let's meet in front of the main gate. Can you make it at 1 p.m.?","그럼 정문 앞에서 만나자. 오후 1시에 만날 수 있어?"],"ow":["오답 ✕ — 지문과 일치한다. 'I have free tickets.'(무료 입장권이 있거든.)라고 했다.","오답 ✕ — 지문과 일치한다. 'Do you want to join me?'(나랑 같이 갈래?)라고 제안했다.","오답 ✕ — 지문과 일치한다. 민지는 'I have a family trip this weekend.'(이번 주말에 가족 여행이 있어.)라고 했다.","오답 ✕ — 지문과 일치한다. 'It's at 2 p.m.'(오후 2시에 해.)라고 했다.","정답 ○ — 경기는 2시인데 'Can you make it at 1 p.m.?'(1시에 만날 수 있어?)이라고 했다. 경기 시작 직전이 아니라 한 시간 전에 만나므로 지문과 다르다."],"memo":["정답 ⑤: 준호와 Kate는 경기 시작 한 시간 전(1시)에 만난다.","근거: Can you make it at 1 p.m.?(오후 1시에 만날 수 있어?) / It's at 2 p.m.(경기는 오후 2시)","함정: 경기 시작 '직전'이 아니라 1시간 전이라서 ⑤는 ✕"],"why":"경기는 2시에 시작하고 두 사람은 그보다 한 시간 앞선 1시에 만난다."}],"dlg":[["Kate","What are you going to do this Saturday?","이번 주 토요일에 뭐 할 거야?"],["Junho","Nothing special. Why?","특별한 건 없어. 왜?"],["Kate","I'm going to go to a basketball game this Saturday. I have free tickets. Do you want to join me?","나 이번 주 토요일에 농구 경기 보러 갈 거야. 무료 입장권이 있거든. 나랑 같이 갈래?"],["Junho","That sounds great! I love basketball. How about you, Minji?","좋아! 나 농구 정말 좋아해. 민지야, 너는 어때?"],["Minji","Sorry, I can't. I really want to go, but I have a family trip this weekend.","미안, 난 못 가. 정말 가고 싶은데, 이번 주말에 가족 여행이 있어."],["Kate","Oh, I see. You can come with us next time.","아, 그렇구나. 다음에 우리랑 같이 가면 돼."],["Junho","What time is the game?","경기는 몇 시야?"],["Kate","It's at 2 p.m. at Dream Stadium.","오후 2시에 Dream 경기장에서 해."],["Junho","Then let's meet in front of the main gate. Can you make it at 1 p.m.?","그럼 정문 앞에서 만나자. 오후 1시에 만날 수 있어?"],["Kate","That works for me. We can buy some snacks before the game.","난 좋아. 경기 전에 간식을 좀 살 수 있겠다."],["Minji","I hope you have a good time.","너희 즐거운 시간 보내길 바라."]]},{"qs":[{"n":3,"q":"What will the boy do before he meets the girl this Saturday?","o":["He will see the taekwondo show.","He will practice taekwondo.","He will help his parents.","He will clean his room.","He will work at home."],"a":2,"ans":"He will help his parents.","evs":[["B: Sorry, I can't. I have to help my parents. But I can make it at 10:30 a.m.","미안, 안 돼. 부모님을 도와드려야 하거든. 하지만 오전 10시 30분에는 만날 수 있어."],["G: That works for me, too. Let's meet then.","나도 그때 괜찮아. 그때 만나자."]],"ev":["B: Sorry, I can't. I have to help my parents. But I can make it at 10:30 a.m.","미안, 안 돼. 부모님을 도와드려야 하거든. 하지만 오전 10시 30분에는 만날 수 있어."],"ow":["오답 ✕ — 태권도 공연('the show')은 11시에 시작하고 만나는 시간은 10시 30분이다. 만나기 전이 아니라 만난 뒤에 보는 것이라 틀림.","오답 ✕ — 소년이 하는 일은 'I have to help my parents.'(부모님을 도와드려야 해.)이다. 태권도를 연습한다는 말은 없다.","정답 ○ — 'I can't. I have to help my parents.'(부모님을 도와드려야 해서 10시는 안 돼.)라고 했으므로 만나기 전에 부모님을 도울 것이다.","오답 ✕ — 방을 청소한다는 말은 대화에 없다. 소년이 할 일은 부모님을 돕는 것이다.","오답 ✕ — 집에서 일한다는 말은 없다. 'help my parents'(부모님을 돕다)와는 다르다."],"memo":["정답 ③: 소년은 소녀를 만나기 전에 부모님을 도울 것이다.","근거: I have to help my parents.(부모님을 도와드려야 하거든.)","함정: ①은 공연을 만난 '뒤에' 보는 거라서 ✕"],"why":"소년은 부모님을 도와야 해서 10시 대신 10시 30분에 만나기로 한다."}],"dlg":[["G","Let's go see the taekwondo performance this Saturday.","이번 주 토요일에 태권도 공연 보러 가자."],["B","What time is the show?","공연은 몇 시야?"],["G","It's at 11 a.m. Can you make it at 10?","오전 11시야. 10시에 만날 수 있어?"],["B","Sorry, I can't. I have to help my parents. But I can make it at 10:30 a.m.","미안, 안 돼. 부모님을 도와드려야 하거든. 하지만 오전 10시 30분에는 만날 수 있어."],["G","That works for me, too. Let's meet then.","나도 그때 괜찮아. 그때 만나자."]]},{"qs":[{"n":4,"q":"위 대화의 내용과 일치하는 것은?","o":["The boy wants to watch a taekwondo show.","The ssireum match starts at 1 p.m.","The girl agrees to meet the boy at 1 p.m.","The girl can't make it at 1 p.m.","The ssireum match is on Sunday."],"a":2,"ans":"The girl agrees to meet the boy at 1 p.m.","evs":[["B: It's at 3 p.m. this Saturday. Can you make it at 1 p.m.?","이번 주 토요일 오후 3시야. 오후 1시에 만날 수 있어?"],["G: Sure. See you then!","물론이지. 그때 보자!"]],"ev":["B: It's at 3 p.m. this Saturday. Can you make it at 1 p.m.?","이번 주 토요일 오후 3시야. 오후 1시에 만날 수 있어?"],"ow":["오답 ✕ — 소년은 'I want to watch the ssireum match.'(나 씨름 경기 보고 싶어.)라고 했다. 태권도 공연이 아니라서 틀림.","오답 ✕ — 'It's at 3 p.m. this Saturday.'(이번 주 토요일 오후 3시야.)라고 했다. 1시는 만나는 시간이라서 틀림.","정답 ○ — 소년이 'Can you make it at 1 p.m.?'(1시에 만날 수 있어?)라고 묻자 소녀가 'Sure. See you then!'(물론이지. 그때 보자!)이라고 했으므로 맞다.","오답 ✕ — 소녀는 'Sure.'(물론이지.)라고 대답했다. 1시에 만날 수 있어서 이 보기는 틀림.","오답 ✕ — 'this Saturday'(이번 주 토요일)라고 했다. 일요일이 아니라서 틀림."],"memo":["정답 ③: 소녀는 1시에 만나는 것에 동의한다.","근거: Sure. See you then!(물론이지. 그때 보자!)","함정: ②는 경기 시간(3시)과 만나는 시간(1시)을 헷갈린 보기라서 ✕"],"why":"경기는 토요일 3시이고, 두 사람은 1시에 만나기로 한다."}],"dlg":[["B","I want to watch the ssireum match. Will you go with me?","나 씨름 경기 보고 싶어. 나랑 같이 갈래?"],["G","I'd love to! When is it?","좋아! 언제야?"],["B","It's at 3 p.m. this Saturday. Can you make it at 1 p.m.?","이번 주 토요일 오후 3시야. 오후 1시에 만날 수 있어?"],["G","Sure. See you then!","물론이지. 그때 보자!"]]},{"qs":[{"n":5,"q":"위 대화의 내용과 일치하는 것은?","o":["The volleyball match starts at 2 p.m.","The girl can meet the boy at 2 p.m.","The boy has a piano lesson.","They will meet at the main gate.","They will meet at 3 p.m. in front of the clock tower."],"a":4,"ans":"They will meet at 3 p.m. in front of the clock tower.","evs":[["B: No problem! Let's meet then in front of the clock tower.","좋아! 그럼 그때 시계탑 앞에서 만나자."],["G: Sorry, I can't. I have a piano lesson. How about 3 p.m.?","미안, 안 돼. 피아노 수업이 있거든. 오후 3시는 어때?"]],"ev":["B: No problem! Let's meet then in front of the clock tower.","좋아! 그럼 그때 시계탑 앞에서 만나자."],"ow":["오답 ✕ — 'It's at 4 p.m.'(오후 4시에 해.)라고 했다. 2시는 소년이 만나자고 한 시간이라서 틀림.","오답 ✕ — 소녀는 'Sorry, I can't.'(미안, 안 돼.)라고 했다. 2시에는 만날 수 없다.","오답 ✕ — 피아노 수업이 있는 사람은 소녀이다('I have a piano lesson.'). 소년이 아니라서 틀림.","오답 ✕ — 만나는 장소는 'in front of the clock tower'(시계탑 앞)이다. 정문이 아니라서 틀림.","정답 ○ — 3시에 만나기로 하고('How about 3 p.m.?', 'Okay. I'll be there by 3.') 소년이 'in front of the clock tower'(시계탑 앞)에서 만나자고 했으므로 맞다."],"memo":["정답 ⑤: 두 사람은 3시에 시계탑 앞에서 만날 것이다.","근거: Let's meet then in front of the clock tower.(그때 시계탑 앞에서 만나자.)","함정: ①은 경기가 4시, 만나자고 한 시간이 2시라서 ✕"],"why":"소녀가 2시에 안 되어서 3시에 시계탑 앞에서 만나기로 한다."}],"dlg":[["G","Do you want to see the volleyball match? It's at 4 p.m.","배구 경기 보러 갈래? 오후 4시에 해."],["B","Wow! I'd love to. Can we meet at 2 p.m.?","와! 좋아. 오후 2시에 만날 수 있어?"],["G","Sorry, I can't. I have a piano lesson. How about 3 p.m.?","미안, 안 돼. 피아노 수업이 있거든. 오후 3시는 어때?"],["B","No problem! Let's meet then in front of the clock tower.","좋아! 그럼 그때 시계탑 앞에서 만나자."],["G","Okay. I'll be there by 3.","알았어. 3시까지 거기로 갈게."]]}];var BG=[{"qs":[{"n":6,"q":"윗글의 제목으로 알맞은 것은?","o":["How to Make a Soccer Ball","Soccer: The Most Popular Sport","The History of Black and White TVs","How Did Black and White Soccer Balls Appear?","Soccer Ball: The Meaning of White and Black"],"a":3,"ans":"How Did Black and White Soccer Balls Appear?","evs":[["Have you heard about the origin of this popular design?","여러분은 이 인기 있는 디자인의 기원에 대해 들어 본 적 있나요?"],["Black and white balls came out during the 1970 World Cup in Mexico.","검고 흰 축구공은 1970년 멕시코 월드컵 동안에 나왔습니다."]],"ev":["Have you heard about the origin of this popular design?","여러분은 이 인기 있는 디자인의 기원에 대해 들어 본 적 있나요?"],"ow":["오답 ✕ — 축구공을 만드는 방법은 나오지 않는다. 검고 흰 축구공이 언제, 왜 나왔는지를 설명한다.","오답 ✕ — 'Soccer: The Most Popular Sport'는 글 첫머리의 소개일 뿐, 이 부분은 검고 흰 공의 기원을 다룬다.","오답 ✕ — 'on their black and white TVs'(흑백 TV)가 나오지만 TV의 역사가 아니라 TV에서 공을 잘 보이게 하려던 이유이다. 너무 좁다.","정답 ○ — 'the origin of this popular design'(이 인기 있는 디자인의 기원)을 묻고, 1970년 월드컵에서 흑백 TV로 쉽게 보이도록 나왔다고 설명하므로 검고 흰 축구공이 어떻게 나왔는지가 제목이다.","오답 ✕ — 흰색과 검은색이 무엇을 '의미'하는지는 나오지 않는다. 기원(origin)을 설명하는 글이라서 틀림."],"memo":["정답 ④: How Did Black and White Soccer Balls Appear?","근거: Black and white balls came out during the 1970 World Cup in Mexico.(검고 흰 공은 1970년 멕시코 월드컵 때 나왔다.)","함정: ⑤ 색의 의미가 아니라 나온 이유(기원)를 설명해서 ✕"],"why":"검고 흰 축구공이 1970년 흑백 TV에서 잘 보이려고 나왔다는 기원을 설명한다."},{"n":7,"q":"윗글의 내용을 요약한 아래 문장의 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["spot - black and white","kick - color","hide - black and white","spot - color","paint - digital"],"a":0,"ans":"spot - black and white","evs":[["People could spot them easily on their black and white TVs.","사람들은 그들의 흑백 TV에서 그것들을 쉽게 발견할 수 있었어요."],["Black and white balls came out during the 1970 World Cup in Mexico.","검고 흰 축구공은 1970년 멕시코 월드컵 동안에 나왔습니다."]],"ev":["People could spot them easily on their black and white TVs.","사람들은 그들의 흑백 TV에서 그것들을 쉽게 발견할 수 있었어요."],"ow":["정답 ○ — 'People could spot them easily on their black and white TVs.'(흑백 TV에서 쉽게 발견할 수 있었다.)이므로 spot - black and white가 맞다.","오답 ✕ — 지문은 'spot'(발견하다)이라고 했지 kick(차다)이 아니다. 또 당시 TV는 color가 아니라 black and white였다.","오답 ✕ — hide(숨다)는 반대 뜻이다. 공이 쉽게 보였다('spot them easily')고 했으므로 틀림.","오답 ✕ — spot은 맞지만 1970년의 TV는 컬러가 아니었다. 'Now we have color televisions'(이제는 컬러 TV가 있다)는 지금의 이야기이다.","오답 ✕ — paint나 digital TV에 대한 이야기는 지문에 없다. 'black and white TVs'(흑백 TV)가 나온다."],"memo":["정답 ①: spot - black and white","근거: People could spot them easily on their black and white TVs.(흑백 TV에서 쉽게 발견할 수 있었다.)","함정: ④ 컬러 TV는 지금의 이야기(Now we have color televisions)라서 ✕"],"why":"흑백 TV에서 공이 눈에 잘 띄도록 검고 흰 공이 나왔다.","sum":"Black and white balls were made so that people could (A) ______ them easily on (B) ______ TVs.","lab":"완성된 요약문 : "}],"pp":[["Black and White Soccer Balls","검고 흰 축구공"],["Soccer balls today come in various colors, but black and white balls are quite common.","오늘날 축구공은 다양한 색깔로 나오지만, 검고 흰 축구공이 상당히 흔합니다."],["Have you heard about the origin of this popular design?","여러분은 이 인기 있는 디자인의 기원에 대해 들어 본 적 있나요?"],["Black and white balls came out during the 1970 World Cup in Mexico.","검고 흰 축구공은 1970년 멕시코 월드컵 동안에 나왔습니다."],["People could spot them easily on their black and white TVs.","사람들은 그들의 흑백 TV에서 그것들을 쉽게 발견할 수 있었어요."],["Isn't that smart?","그것은 똑똑하지 않나요?"],["Now we have color televisions, but we still kick the classic black and white soccer balls.","이제 우리는 컬러텔레비전을 갖고 있지만, 우리는 여전히 이 고전적인 검고 흰 축구공을 찹니다."]]},{"qs":[{"n":8,"q":"윗글의 내용과 일치하지 않는 것은?","o":["유니폼 색깔은 팀을 하나로 모아준다.","유니폼 색깔 덕분에 선수들은 서로를 구분한다.","심판들은 선수들에게 튀지 않는 색깔의 유니폼을 입는다.","심판들은 주로 검은색 유니폼을 입는다.","심판의 검은색 유니폼은 자신과 논쟁하지 말라는 뜻을 전한다."],"a":2,"ans":"심판들은 선수들에게 튀지 않는 색깔의 유니폼을 입는다.","evs":[["On the field, referees wear uniforms with special colors because they need to stand out from the players.","경기장에서, 심판들은 선수들로부터 눈에 띄어야 할 필요가 있기 때문에 특별한 색깔의 유니폼을 입습니다."],["Among several colors, black has been their favorite.","몇몇의 색깔 중에서, 검은색은 그들이 가장 좋아하는 것입니다."]],"ev":["On the field, referees wear uniforms with special colors because they need to stand out from the players.","경기장에서, 심판들은 선수들로부터 눈에 띄어야 할 필요가 있기 때문에 특별한 색깔의 유니폼을 입습니다."],"ow":["오답 ✕ — 지문과 일치한다. 'Uniform colors have the power to unite the team under the same spirit.'(팀을 같은 정신 아래 결속시킨다.)라고 했다.","오답 ✕ — 지문과 일치한다. 'Players can spot each other'(선수들은 서로를 알아볼 수 있다)고 했다.","정답 ○ — 심판은 'they need to stand out from the players'(선수들로부터 눈에 띄어야 한다)고 했다. 튀지 않는 색이 아니라 눈에 띄는 특별한 색이므로 지문과 다르다.","오답 ✕ — 지문과 일치한다. 'Among several colors, black has been their favorite.'(검은색이 가장 좋아하는 색이다.)라고 했다.","오답 ✕ — 지문과 일치한다. 검은색은 'Don't argue with me!'(나와 논쟁하지 마시오!)라는 강한 메시지를 전한다."],"memo":["정답 ③: 심판은 튀지 않는 색이 아니라 눈에 띄는 특별한 색의 유니폼을 입는다.","근거: referees wear uniforms with special colors because they need to stand out(눈에 띄어야 해서 특별한 색깔의 유니폼을 입는다.)","함정: stand out(눈에 띄다)을 '튀지 않다'로 바꾼 보기라서 ✕"],"why":"심판은 선수들과 구별되도록 눈에 띄는 특별한 색의 유니폼을 입는다."},{"n":9,"q":"윗글의 내용과 일치하는 것은?","o":["Players on the same team wear uniforms with different colors.","Referees wear the same colors as the players.","Uniform colors help players spot each other on the field.","Referees do not like black uniforms.","Black sends the message \"Be careful with those fouls!\""],"a":2,"ans":"Uniform colors help players spot each other on the field.","evs":[["Players can spot each other and make quick decisions thanks to their team's unique colors.","선수들은 그들의 팀의 고유한 색깔 덕분에 서로를 알아보고 빠른 결정을 내릴 수 있습니다."],["Black looks powerful, and it sends a strong \"Don't argue with me!\" message.","검은색은 강력해 보이고 \"나와 논쟁하지 마시오!\"라는 강한 메시지를 전합니다."]],"ev":["Players can spot each other and make quick decisions thanks to their team's unique colors.","선수들은 그들의 팀의 고유한 색깔 덕분에 서로를 알아보고 빠른 결정을 내릴 수 있습니다."],"ow":["오답 ✕ — 'Players on each team wear uniforms with their own colors.'(각 팀의 선수들은 자신들만의 색깔이 있는 유니폼을 입는다.)라고 했다. 같은 팀은 같은 색이라서 틀림.","오답 ✕ — 심판은 'special colors'(특별한 색깔)를 입어 선수들로부터 눈에 띄어야 한다. 선수들과 같은 색이 아니라서 틀림.","정답 ○ — 'Players can spot each other ... thanks to their team's unique colors.'(팀의 고유한 색깔 덕 f these cards.","다양한 나라 출신의 모든 선수들은 이 카드들의 의미를 분명하게 이해합니다."],"ow":["오답 ✕ — 지문과 일치한다. 'Referees have used yellow and red cards since 1970.'(1970년부터 사용해 왔다.)라고 했다.","오답 ✕ — 지문과 일치한다. 'Yellow cards say, \"Be careful with those fouls!\"'(옐로카드는 반칙을 조심하라고 한다.)라고 했다.","오답 ✕ — 지문과 일치한다. 'Red cards mean \"You're out!\"'(레드카드는 퇴장을 의미한다.)라고 했다.","정답 ○ — 'All players from different countries clearly understand the meaning of these cards.'(모든 선수들이 카드의 의미를 분명하게 이해한다.)라고 했다. 모르는 선수가 있다는 말은 지문과 다르다.","오답 ✕ — 지문과 일치한다. 'It will be more fun!'(그것은 더 재미있을 것입니다!)이라고 했다."],"memo":["정답 ④: 모든 선수들은 카드의 의미를 분명하게 이해한다(모르는 선수가 있다는 말은 틀림).","근거: All players from different countries clearly understand the meaning of these cards.(모든 선수들이 이 카드들의 의미를 분명하게 이해한다.)","함정: Some players don't know는 All players understand와 반대라서 ✕"],"why":"옐로카드는 반칙 주의, 레드카드는 퇴장을 뜻하며 모든 선수가 그 뜻을 이해한다."}],"pp":[["Color Cards for Communication","의사소통을 위한 색깔 카드"],["Referees have used yellow and red cards since 1970. Different color cards send different messages to players.","심판은 1970년부터 노란색과 빨간색 카드를 사용해 왔습니다. 다른 색깔의 카드는 선수들에게 다른 메시지를 전합니다."],["Yellow cards say, \"Be careful with those fouls!\"","옐로카드는 \"그러한 반칙들을 조심하시오!\"라고 말합니다."],["Red cards mean \"You're out!\"","레드카드는 \"당신은 퇴장입니다!\"를 의미합니다."],["All players from different countries clearly understand the meaning of these cards.","다양한 나라 출신의 모든 선수들은 이 카드들의 의미를 분명하게 이해합니다."],["Do you have a plan to watch a soccer match?","여러분은 축구 경기를 볼 계획이 있나요?"],["Then check out the various colors on the field.","그렇다면 경기장에서의 다양한 색깔을 확인해 보세요."],["It will be more fun!","그것은 더 재미있을 것입니다!"]]}];
var BK='m2-find-r'+RNUM+'-best';
var secs=[],cur=null;
D.forEach(function(it,i){if(it.tag||!cur){cur={name:it.tag||'',items:[]};secs.push(cur)}cur.items.push(i)});
var sel={},done={};
function key(i,t){return i+':'+t}
function esc(s){return s.replace(/[&<>]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;'}[c]})}
function span(it){var r=[];it.fixes.forEach(function(f,k){var n=f.wrong.split(/\s+/).length;f.at.forEach(function(a){r.push({s:a,e:a+n,f:f,k:k})});(f.alt||[]).forEach(function(a){r.push({s:a,e:a+1,f:f,k:k,alt:1})})});return r}
function render(){
 var h='<div class="stage">1 · 본문 오류 찾기</div>';
 secs.forEach(function(S,si){
  var N=errN(S),c=S.items.reduce(function(a,i){return a+countSel(i)},0);
  h+='<section class="grp"><div class="sec"><span>'+esc(S.name)+'</span><span class="bd">틀린 것 '+N+'개</span>'+(done[si]?'':'<span class="bd2">고른 곳 '+c+' / '+N+'개</span>')+'</div>';
  S.items.forEach(function(i){h+=sentHtml(i,done[si])});
  if(done[si]){h+=summary(S,si)}
  else{h+='<div class="bar"><span class="c">고른 곳 <b>'+c+'</b> / '+N+'개</span><button data-sub="'+si+'">제출하기</button></div>'}
  h+='</section>';
 });
 h+=partsHtml();
 document.getElementById('app').innerHTML=h;relayUp();if(typeof persist==='function')persist();
 var b=load();document.getElementById('best').textContent=b!=null?'최고 기록: 찾은 오류 '+b+'개':'';
}
function relayUp(){var st=[aDone()].concat(QS.map(function(P,i){return !!qdone[i]})),nm=['본문 오류 찾기'].concat(QS.map(function(P){var c=0;P.groups.forEach(function(g){c+=g.qs.length});return P.title.replace(' 파악','')+' '+c+'문제'})),f=-1;for(var i=0;i<st.length;i++)if(!st[i]){f=i;break}document.getElementById('relay').innerHTML=nm.map(function(n,i){return '<div class="rs '+(st[i]?'ok':i===f?'now':'lk')+'"><b>STEP '+(i+1)+(st[i]?' &middot; 완료':'')+'</b>'+n+'</div>'}).join('')}
function errN(S){return S.items.reduce(function(a,i){return a+D[i].fixes.length},0)}
function countSel(i){var c=0;for(var k in sel)if(k.indexOf(i+':')===0)c++;return c}
function sentHtml(i,lock){
 var it=D[i],toks=it.en.split(/\s+/),sp=span(it),h='';
 h+='<div class="sent'+(lock?' locked':'')+'"><div class="row"><div class="n">'+String(it.n).padStart(2,'0')+'</div><div class="txt">';
 toks.forEach(function(t,ti){
  var cls='wd',inSp=sp.filter(function(x){return ti>=x.s&&ti<x.e}).length>0,inMain=sp.filter(function(x){return !x.alt&&ti>=x.s&&ti<x.e}).length>0,on=!!sel[key(i,ti)];
  if(lock){if(inSp&&on)cls+=' hit';else if(inMain)cls+=(sp.some(function(x){return !x.alt&&ti>=x.s&&ti<x.e&&foundFix(i,x.k)})?' hit':' miss');else if(on)cls+=' x'}
  else if(on)cls+=' on';
  h+='<span class="'+cls+'" data-i="'+i+'" data-t="'+ti+'">'+esc(t)+'</span> ';
 });
 h+='</div></div>';
 h+='<div class="gl kr">'+esc(it.ko)+'</div>';
 if(it.foot.length)h+=it.foot.map(function(f){return '<div class="gl">'+esc(f.replace(/^\d+/,''))+'</div>'}).join('');
 if(lock)h+=noteHtml(i);
 return h+'</div>';
}
function foundFix(i,k){var it=D[i],f=it.fixes[k],n=f.wrong.split(/\s+/).length;return f.at.some(function(a){for(var t=a;t<a+n;t++)if(sel[key(i,t)])return true;return false})||(f.alt||[]).some(function(t){return !!sel[key(i,t)]})}
function wrongPicks(i){var it=D[i],sp=span(it),c=0;for(var k in sel){var p=k.split(':');if(+p[0]!==i)continue;var t=+p[1];if(!sp.some(function(x){return t>=x.s&&t<x.e}))c++}return c}
function noteHtml(i){
 var it=D[i],h='',wp=wrongPicks(i);
 if(it.ok){return '<div class="note fine"><b>맞는 문장이에요'+(wp?' (고른 곳은 틀린 곳이 아니에요)':'')+'</b><div class="pt">어법 오류 없음</div></div>'}
 var fo=0;it.fixes.forEach(function(f,k){if(foundFix(i,k))fo++});
 var all=fo===it.fixes.length;
 h+='<div class="note '+(all?'found':'lost')+'"><b>'+(all?'모두 찾았어요':fo?'일부 놓쳤어요 ('+fo+'/'+it.fixes.length+')':'놓쳤어요')+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</b>';
 it.fixes.forEach(function(f,k){h+='<div class="fx">'+(foundFix(i,k)?'✔ ':'✘ ')+(it.fixes.length>1?'①②'.charAt(k)+' ':'')+'<span class="wr">'+esc(f.wrong)+'</span> <span class="arr">→</span> <span class="rt">'+esc(f.right)+'</span><div class="pt">'+esc(f.point)+'</div></div>'});
 h+='</div>';return h;
}
function missed(S){return S.items.filter(function(i){var it=D[i];return !it.ok&&it.fixes.some(function(f,k){return !foundFix(i,k)})})}
function fixedEn(it){var tk=it.en.split(/\s+/);
 it.fixes.forEach(function(f){
  var n=f.wrong.split(/\s+/).length,pos=f.all?f.at:[f.at[0]];
  pos.forEach(function(a){
   if(f.partial){tk[a]=tk[a].replace(f.wrong,f.right);return}
   var seg=tk.slice(a,a+n),lead=(seg[0].match(/^[^\w]*/)||[''])[0],trail=(seg[seg.length-1].match(/[^\w]*$/)||[''])[0];
   tk.splice.apply(tk,[a,n,f.right==='(삭제)'?'\u0000':lead+f.right.split('/')[0]+trail].concat(Array(n-1).fill('\u0000')))});
 });
 return tk.join(' ').replace(/ ?\u0000/g,'')}
function summary(S,si){
 var tot=0,fo=0,wp=0;S.items.forEach(function(i){var it=D[i];it.fixes.forEach(function(f,k){tot++;if(foundFix(i,k))fo++});wp+=wrongPicks(i)});
 var h='<div class="sum"><b>'+esc(S.name)+'</b> · 오류 '+tot+'개 중 <b>'+fo+'개</b> 찾았어요'+(wp?' · 틀리게 고른 곳 '+wp+'개':'')+'</div>';
 var ms=missed(S),cap=3;
 if(ms.length){
  var show=ms.slice(0,3);
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">'+show.length+'문장'+(ms.length>cap?' (놓친 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  show.forEach(function(i){var it=D[i];
   h+='<div class="mi"><span class="no">'+String(it.n).padStart(2,'0')+'</span><span class="en">'+esc(fixedEn(it))+'</span><ul>';
   it.fixes.forEach(function(f,k){if(!foundFix(i,k))h+='<li><b>'+esc(f.topic)+'</b> : '+esc(f.memo)+'</li>'});
   h+='</ul><div class="k">'+esc(it.ko)+'</div></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>문법 memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function load(){try{var v=localStorage.getItem(BK);return v==null?null:+v}catch(e){return null}}
function save(n){try{var b=load();if(b==null||n>b)localStorage.setItem(BK,n)}catch(e){}}
document.getElementById('app').addEventListener('click',function(e){
 var w=e.target.closest('.wd');
 if(w){var i=+w.dataset.i,t=w.dataset.t,si=secs.findIndex(function(S){return S.items.indexOf(i)>=0});if(done[si])return;
  var k=key(i,t);if(sel[k])delete sel[k];else sel[k]=1;
  var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-sub]');
 if(b){done[+b.dataset.sub]=true;logA(+b.dataset.sub);render();
  var tot=0,fo=0;secs.forEach(function(S,si){if(done[si])S.items.forEach(function(i){D[i].fixes.forEach(function(f,k){if(foundFix(i,k))fo++})})});
  if(secs.every(function(S,si){return done[si]}))save(fo);
  var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});
var QS=[];if(DG.length)QS.push({title:'대화문 내용 파악',groups:DG});if(BG.length)QS.push({title:'본문 내용 파악',groups:BG});
var PASS_PCT=70,ATT=0,ORIG=null;
function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}
 QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){var O=ORIG[q.n],idx=O.o.map(function(_,i){return i});
  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}
function calcRes(){var c=QS.map(function(P){var a=0,n=0;P.groups.forEach(function(g){g.qs.forEach(function(q){n++;if(pick[q.n]===q.a)a++})});return[a,n]});
 var n=0,ok=0;c.forEach(function(x){n+=x[1];ok+=x[0]});var pct=Math.round(ok*100/n);return{c:c,ok:ok,n:n,pct:pct,pass:pct>=PASS_PCT}}
function resultHtml(){var r=calcRes();
 return '<div class="stage">결과 &middot; 2~3단계 합산</div><div class="res '+(r.pass?'rp':'rf')+'"><div class="rt2">'+(r.pass?'통과':'통과선 미달')+'</div><div class="rpct">'+r.pct+'<small>점</small></div><div class="rl2">100점 만점 &middot; 통과선 '+PASS_PCT+'점'+(ATT?' &middot; '+(ATT+1)+'번째 도전':'')+'</div>'
 +'<table class="rtb">'+QS.map(function(P,i){return '<tr><td>'+(i+2)+' '+P.title.replace(' 파악','')+'</td><td>'+r.c[i][0]+' / '+r.c[i][1]+'</td></tr>'}).join('')+'</table>'
 +'<div class="rl2">총 학습 시간 '+fmtT(TM.act)+'</div>'+(r.pass?'':'<button type="button" data-redo="1">2~3단계 다시 도전 (보기 순서가 바뀌어요)</button>')+'</div>'}
var pick={},qdone={};
var CN='①②③④⑤';
function aDone(){return secs.every(function(S,si){return done[si]})}
function partsHtml(){
 if(!aDone())return '';
 var h='';
 for(var p=0;p<QS.length;p++){if(p>0&&!qdone[p-1])break;h+=partHtml(p)}
 if(QS.every(function(P,p){return qdone[p]}))h+=resultHtml();
 return h;
}
function passHtml(si,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){PP.forEach(function(p){h+='<div class="ln pp'+(p[2]?' np':'')+'"><div>'+(p[0]?'<div class="en">'+esc(p[0])+'</div>':'')+'<div class="k">'+esc(p[1])+'</div></div></div>'})}
 else{var cur='';PP.forEach(function(p){if(!p[0])return;if(p[2]&&cur){h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>';cur=''}cur+=(cur?' ':'')+p[0]});if(cur)h+='<div class="ln"><div class="en">'+esc(cur)+'</div></div>'}
 return h+'</div></div>';
}
function ppHtml(pp,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg"><div class="who">'+esc(TITLE_EN)+'</div>';
 if(lock){pp.forEach(function(p){h+='<div class="ln pp"><div><div class="en">'+esc(p[0])+'</div><div class="k">'+esc(p[1])+'</div></div></div>'})}
 else h+='<div class="ln"><div class="en">'+esc(pp.map(function(p){return p[0]}).join(' '))+'</div></div>';
 return h+'</div></div>';
}
function dlgHtml(d,lock){
 var h='<div class="pane'+(lock?' open':'')+'"><div class="dlg">';
 d.forEach(function(l){h+='<div class="ln"><span class="sp">'+l[0]+'</span><div><div class="en">'+esc(l[1])+'</div>'+(lock?'<div class="k">'+esc(l[2])+'</div>':'')+'</div></div>'});
 return h+'</div></div>';
}
function partHtml(p){
 var P=QS[p],lock=!!qdone[p],h='<section class="part"><div class="stage">'+(p+2)+' · '+P.title+'</div>',c=0,dn=0,tot=0;P.groups.forEach(function(g){tot+=g.qs.length});
 P.groups.forEach(function(g){h+='<div class="grp">';
  if(g.dlg)h+=dlgHtml(g.dlg,lock);
  if(g.pp)h+=ppHtml(g.pp,lock);
  if(P.ox)h+='<div class="stem">대화와 일치하지 않는 문장을 모두 고르세요.</div>';g.qs.forEach(function(q){q.dn=++dn;h+=P.ox?sHtml(q,lock):qHtml(q,lock);if(pick[q.n]!=null)c++});h+='</div>';
 });
 if(lock)h+=P.ox?oxSummary(p):qSummary(p);
 else h+='<div class="bar"><span class="c">답한 문제 <b>'+c+'</b>/'+tot+'</span><button data-subq="'+p+'">제출하기</button></div>';
 return h+'</section>';
}
function qHtml(q,lock){
 var h='<div class="q"><div class="qt"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>'+(q.sum?'<div class="sumbox">'+esc(q.sum)+'</div>':'');
 q.o.forEach(function(t,i){
  var cls='opt';
  if(lock){if(i===q.a)cls+=' good';else if(pick[q.n]===i)cls+=' bad'}
  else if(pick[q.n]===i)cls+=' on';
  h+='<div class="'+cls+(q.o.length===2?' ox':'')+'" data-q="'+q.n+'" data-o="'+i+'">'+(q.o.length===2?'':'<span class="cn">'+CN[i]+'</span>')+esc(t)+'</div>';
 });
 if(lock){
  var ok=pick[q.n]===q.a;
  h+='<div class="note '+(ok?'found':'lost')+'"><b>'+(ok?'맞았어요':'놓쳤어요')+' · 정답 '+CN[q.a]+'</b>'
   +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+(q.ow?'<div class="hl">보기별 해설</div>'+q.ow.map(function(x,j){return '<div class="ow'+(j===q.a?' g':'')+'"><b>'+CN[j]+'</b>'+esc(x)+'</div>'}).join(''):'')+'</div>';
 }
 return h+'</div>';
}
function sHtml(q,lock){
 var on=pick[q.n]===1,cls='st';
 if(lock){if(q.bad&&on)cls+=' hit';else if(q.bad)cls+=' miss';else if(on)cls+=' x'}
 else if(on)cls+=' on';
 var h='<div class="'+cls+'" data-s="'+q.n+'"><span class="qn">'+q.dn+'</span>'+esc(q.q)+'</div>';
 if(lock){
  var t=q.bad?(on?'찾았어요':'놓쳤어요'):(on?'틀리게 골랐어요 (대화와 일치하는 문장)':'일치');
  h+='<div class="note '+(q.bad?(on?'found':'lost'):(on?'lost':'fine'))+' sn"><b>'+t+'</b>'+(q.bad?'<div class="pt">맞는 내용 : '+esc(q.fact)+'</div>':'')+'<div class="pt">근거 : '+esc(q.ev[0])+'</div><div class="ko">'+esc(q.ev[1])+'</div></div>';
 }
 return h;
}
function oxSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · 일치하지 않는 문장 '+bad.length+'개 중 <b>'+found.length+'개</b> 찾았어요'+(fp.length?' · 틀리게 고른 문장 '+fp.length+'개':'')+'</div>';
 if(ms.length){
  h+='<div class="memo"><h2>memo · 노트에 꼭 쓸 것</h2><div class="hint">놓친 문장만 쓰면 돼요. 아래 내용만 그대로 쓰세요.</div>';
  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){
 var P=QS[p],all=[];P.groups.forEach(function(g){g.qs.forEach(function(q){all.push(q)})});
 var ok=all.filter(function(q){return pick[q.n]===q.a}).length;
 var ms=all.filter(function(q){return pick[q.n]!==q.a}),cap=P.ox?5:3;
 var h='<div class="sum"><b>'+esc(P.title)+'</b> · '+all.length+'문제 중 <b>'+ok+'개</b> 맞았어요</div>';
 if(ms.length){
  h+='<div class="memo"><h2>이것만은 꼭 써요!</h2><div class="hint">해설은 읽기만! 노트에는 노란 칸의 글만 그대로 옮겨 쓰세요 &middot; 총 '+ms.slice(0,cap).reduce(function(a,q){return a+q.memo.length},0)+'줄'+(ms.length>cap?' (틀린 '+ms.length+'개 중 '+cap+'개)':'')+'</div>';
  ms.slice(0,cap).forEach(function(q){
   h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">정답 '+(q.o.length===2?'':CN[q.a]+' ')+esc(q.ans)+'</span><ul>'+q.memo.map(function(m){return '<li>'+esc(m)+'</li>'}).join('')+'</ul></div>';
  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
document.getElementById('app').addEventListener('click',function(e){
 var st=e.target.closest('.st');
 if(st&&!st.closest('.locked')){var n0=+st.dataset.s,p0=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n0})})});if(qdone[p0])return;if(pick[n0]===1)delete pick[n0];else pick[n0]=1;var y0=window.scrollY;render();window.scrollTo(0,y0);return}
 var o=e.target.closest('.opt');
 if(o){var n=+o.dataset.q,p=QS.findIndex(function(P){return P.groups.some(function(g){return g.qs.some(function(q){return q.n===n})})});
  if(qdone[p])return;pick[n]=+o.dataset.o;var y=window.scrollY;render();window.scrollTo(0,y);return}
 var b=e.target.closest('button[data-subq]');
 if(b){qdone[+b.dataset.subq]=true;logQ(+b.dataset.subq);if(QS.every(function(P,p){return qdone[p]})){tmFlush();TM.done=1}var y2=window.scrollY;render();var s=document.querySelectorAll('.sum');if(s.length)s[s.length-1].scrollIntoView({behavior:'smooth',block:'start'})}
});

function wlog(key,title,items){try{var W=JSON.parse(localStorage.getItem('m2-wrong')||'{}');var r=W[RNUM]||(W[RNUM]={t:TITLE_EN,e:{}});r.t=TITLE_EN;if(r.e[key])return;r.e[key]={h:title,i:items,ts:Date.now()};localStorage.setItem('m2-wrong',JSON.stringify(W))}catch(e){}}
function logA(si){var S=secs[si];var it=missed(S).map(function(i){var x=D[i];var p=[];x.fixes.forEach(function(f,k){if(!foundFix(i,k))p.push([f.topic,f.memo])});return{n:x.n,en:fixedEn(x),ko:x.ko,p:p}});wlog('a'+si,'1단계 · '+S.name,it)}
function logQ(p){var P=QS[p],it=[];P.groups.forEach(function(g){g.qs.forEach(function(q){if(pick[q.n]!==q.a)it.push({n:q.dn,a:(q.o.length===2?'':CN[q.a]+' ')+q.ans,m:q.memo})})});wlog('q'+p,(p+2)+'단계 · '+P.title,it)}
var TM={act:0,lv:0,lt:0,done:0},_last=Date.now(),_hid=0;
function tmFlush(){if(TM.done||document.hidden)return;var n=Date.now();TM.act+=n-_last;_last=n}
function fmtT(ms){var s=Math.round(ms/1000),m=Math.floor(s/60);return m?m+'분 '+('0'+(s%60)).slice(-2)+'초':s+'초'}
document.addEventListener('visibilitychange',function(){var n=Date.now();if(document.hidden){if(!TM.done){TM.act+=n-_last;TM.lv++}_hid=n;persist()}else{if(!TM.done&&_hid)TM.lt+=n-_hid;_last=n;_hid=0}});
setInterval(function(){if(!document.hidden&&!TM.done){tmFlush();persist()}},5000);
var PK='m2-prog-'+RNUM;
function persist(){try{var any=Object.keys(sel).length||Object.keys(pick).length||Object.keys(done).length||Object.keys(qdone).length;
 if(any)localStorage.setItem(PK,JSON.stringify({sel:sel,done:done,pick:pick,qdone:qdone,att:ATT,tm:TM}));else localStorage.removeItem(PK);
 var st=JSON.parse(localStorage.getItem('m2-st')||'{}');var n=(aDone()?1:0)+QS.filter(function(P,i){return qdone[i]}).length;var rs=JSON.parse(localStorage.getItem('m2-res')||'{}');if(n>=1+QS.length){var cr=calcRes();rs[RNUM]={p:cr.pct,ok:cr.pass?1:0,t:Math.round(TM.act/1000)}}else{delete rs[RNUM]}localStorage.setItem('m2-res',JSON.stringify(rs));if(any){st[RNUM]=(n>=1+QS.length?3:n);localStorage.setItem('m2-st',JSON.stringify(st));localStorage.setItem('m2-last',String(RNUM))}else{delete st[RNUM];localStorage.setItem('m2-st',JSON.stringify(st))}
 var el=document.getElementById('bm');if(el)el.style.display=any?'inline-flex':'none'}catch(e){}}
try{var sv=JSON.parse(localStorage.getItem(PK)||'null');if(sv){sel=sv.sel||{};done=sv.done||{};pick=sv.pick||{};qdone=sv.qdone||{};ATT=sv.att||0;if(sv.tm){TM=sv.tm;TM.done=TM.done||0;_last=Date.now()}shuf()}}catch(e){}
document.getElementById('app').addEventListener('click',function(e){if(e.target.closest('button[data-redo]')){ATT++;shuf();pick={};qdone={};TM.done=0;_last=Date.now();render();var s=document.querySelectorAll('.stage');s[1]&&s[1].scrollIntoView()}});
document.getElementById('bm').addEventListener('click',function(e){if(e.target.closest('button')){if(confirm('이 Reading의 진행 기록을 지우고 처음부터 다시 할까요?')){try{localStorage.removeItem(PK)}catch(x){}sel={};done={};pick={};qdone={};ATT=0;TM={act:0,lv:0,lt:0,done:0};_last=Date.now();shuf();render();window.scrollTo(0,0)}}});
render();
</script></body></html>
