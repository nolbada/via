번까지의 설명이고 대사를 거의 다 노래로 부르므로, 말로 하는 대사를 섞는 쪽은 뮤지컬.","c":3,"ev":"8~9번 문장"},"h":"2437b2575e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Almost every word is sung, while the orchestra creates the mood of each scene.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"거의 모든 대사가 노래로 불리고, 한편 오케스트라가 각 장면의 분위기를 만든다.","opts":["대사가 거의 다 노래로 불리고, 장면의 분위기는 오케스트라가 만든다.","대사는 거의 다 말로 하고, 노래는 오케스트라가 부른다.","오케스트라가 노래하는 동안 가수들이 장면의 분위기를 만든다.","대사가 거의 없고, 오케스트라가 장면을 설명한다."],"r":{"a":"1) 대사가 거의 다 노래로 불리고, 장면의 분위기는 오케스트라가 만든다.","s":[[7,"Almost every word is sung, while the orchestra creates the mood of each scene.","거의 모든 대사가 노래로 불리고, 한편 오케스트라가 각 장면의 분위기를 만든다."]],"w":"Almost every word is sung은 거의 모든 말이 노래로 불린다는 뜻이고, the orchestra creates the mood는 오케스트라가 분위기를 만든다는 뜻. 노래는 가수가, 분위기는 오케스트라가 맡음.","c":1,"ev":"7번 문장"},"h":"0374a0dad1"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["Opera began in the United States a few years ago.","Musicals mix spoken lines with songs and dance.","Opera focuses on pop, jazz, or rock music.","Musicals are an older form of theater than opera."],"oko":["오페라는 몇 년 전 미국에서 시작되었다.","뮤지컬은 말로 하는 대사에 노래와 춤을 섞는다.","오페라는 팝, 재즈, 록 음악에 중점을 둔다.","뮤지컬은 오페라보다 더 오래된 공연 형태이다."],"r":{"a":"2) Musicals mix spoken lines with songs and dance.","s":[[4,"Opera began in Europe hundreds of years ago.","오페라는 수백 년 전 유럽에서 시작되었다."],[5,"It focuses on classical music.","그것은 클래식 음악에 중점을 둔다."],[8,"Musicals, on the other hand, are a more modern form of theater.","반면에 뮤지컬은 더 현대적인 형태의 공연이다."],[9,"They mix spoken lines with songs and dance.","그것들은 말로 하는 대사에 노래와 춤을 섞는다."]],"w":"9번 문장과 일치. 4번에서 오페라는 수백 년 전 유럽에서 시작됐으므로 첫 선지는 틀림. 5번에서 오페라는 클래식 음악이라 세 번째도 틀림. 8번에서 뮤지컬이 더 현대적인 형태이므로 마지막도 틀림.","c":2,"ev":"4~5번, 8~9번 문장"},"h":"35d5604560"},{"n":9,"t":"sum","q":"Opera and musical theater both (A) music, acting, and storytelling, but they do this in very (B) ways.","ko":"오페라와 뮤지컬은 둘 다 음악, 연기, 이야기를 (A), 이를 아주 (B) 방식으로 한다.","opts":["(A) hide / (B) similar","(A) combine / (B) similar","(A) combine / (B) different","(A) forget / (B) different","(A) hide / (B) different"],"oko":["(A) 숨기고 / (B) 비슷한","(A) 결합하지만 / (B) 비슷한","(A) 결합하지만 / (B) 다른","(A) 잊지만 / (B) 다른","(A) 숨기고 / (B) 다른"],"r":{"a":"3) (A) combine / (B) different","s":[[2,"They combine music, acting, and storytelling.","그것들은 음악, 연기, 이야기를 결합한다."],[3,"But they do this in very different ways.","하지만 그것들은 이를 아주 다른 방식으로 해낸다."]],"w":"2번에서 둘 다 음악, 연기, 이야기를 결합한다(combine)고 하고, 3번 But으로 방식은 아주 다르다(different)고 함. similar(비슷한)는 3번과 반대이고, hide(숨기다), forget(잊다)은 본문에 없음.","c":3,"ev":"2~3번 문장"},"h":"babc34f46b"},{"n":10,"t":"fill","q":"Musicals mix [A] lines with songs and dance, and singers usually use [B].","ko":"뮤지컬은 [A] 대사에 노래와 춤을 섞고, 가수들은 보통 [B]를 사용한다.","bank":["spoken","microphones","classical","orchestra","theater","mood"],"bko":{"spoken":"말로 하는","microphones":"마이크","classical":"클래식의","orchestra":"오케스트라","theater":"극장","mood":"분위기"},"r":{"a":"[A] spoken, [B] microphones","s":[[9,"They mix spoken lines with songs and dance.","그것들은 말로 하는 대사에 노래와 춤을 섞는다."],[10,"Singers usually use microphones, and the music can include pop, jazz, or rock.","가수들은 보통 마이크를 사용하고, 음악에는 팝, 재즈, 또는 록이 들어갈 수 있다."]],"w":"9번 They mix spoken lines with songs and dance와 10번 Singers usually use microphones에서 가져옴. classical, orchestra, theater, mood는 오페라 설명(4~7번)이나 다른 말로, 뮤지컬의 대사나 가수가 쓰는 것과 맞지 않음.","c":null,"ev":"9~10번 문장"},"h":"ed6535d5e2"}]},{"u":4,"id":"b2-04-1","no":1,"ko":"언덕에서 치즈를 쫓아 구르는 사람들","items":[{"n":1,"t":"tf","q":"The Cooper's Hill Cheese Rolling Competition is held every spring.","ko":"쿠퍼스 힐 치즈 굴리기 대회는 매년 봄에 열린다.","r":{"a":"T (본문과 맞는 내용)","s":[[1,"Each spring near Gloucester, England, crowds gather for a strange and exciting race.","매년 봄 영국 글로스터 근처에서는 사람들이 모여 특이하고 흥미진진한 경주를 벌인다."],[2,"It's called the Cooper's Hill Cheese Rolling Competition.","그것은 쿠퍼스 힐 치즈 굴리기 대회라고 불린다."]],"w":"1번에서 Each spring(매년 봄) 사람들이 모여 경주를 한다고 하고, 2번에서 그 경주의 이름이 Cooper's Hill Cheese Rolling Competition이라고 함. 매년 봄에 열린다는 내용과 일치.","c":"T","ev":"1~2번 문장"},"h":"76c91f9a9a"},{"n":2,"t":"tf","q":"The goal of the race is to catch the cheese.","ko":"이 경주의 목표는 치즈를 잡는 것이다.","r":{"a":"F (본문과 다른 내용)","s":[[7,"So, the goal isn't actually to catch the cheese.","그래서 목표는 사실 치즈를 잡는 것이 아니다."]],"w":"7번 문장에서 the goal isn't actually to catch the cheese, 즉 목표는 사실 치즈를 잡는 것이 아니라고 함. 반대 내용.","c":"F","ev":"7번 문장"},"h":"70be7b25ba"},{"n":3,"t":"tf","q":"The hill is so flat that participants can run easily down it.","ko":"언덕이 너무 평평해서 참가자들은 쉽게 달려 내려갈 수 있다.","r":{"a":"F (본문과 다른 내용)","s":[[5,"The hill is so steep that they usually end up tumbling and sliding down rather than running.","언덕이 너무 가팔라서 그들은 보통 달리기보다는 구르고 미끄러져 내려가게 된다."]],"w":"5번 문장에서 언덕은 so steep(너무 가파른)해서 참가자들이 달리기보다는 구르고 미끄러져 내려간다고 함. 평평하다는 말은 반대.","c":"F","ev":"5번 문장"},"h":"99e23e41cc"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The hill is so steep that they usually end up tumbling and sliding down rather than running.)","ko":"언덕이 너무 ( ) 그들은 보통 달리기보다는 구르고 미끄러져 내려가게 된다.","opts":["평평한","가파른","넓은","낮은"],"word":"steep","r":{"a":"2) 가파른","s":[[5,"The hill is so steep that they usually end up tumbling and sliding down rather than running.","언덕이 너무 가팔라서 그들은 보통 달리기보다는 구르고 미끄러져 내려가게 된다."]],"w":"5번에서 언덕 때문에 달리지 못하고 구르고 미끄러져 내려간다고 함. 그렇게 되려면 언덕이 '가파른' 것이 맞음. 평평하거나 낮은 언덕이면 달릴 수 있음.","c":2,"ev":"5번 문장"},"h":"7bc8abccdc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, it continues to be one of England's most unusual traditions.)","ko":"그러나 그것은 여전히 영국에서 가장 ( ) 전통 중 하나로 이어지고 있다.","opts":["평범한","오래된","흔한","특이한"],"word":"unusual","r":{"a":"4) 특이한","s":[[1,"Each spring near Gloucester, England, crowds gather for a strange and exciting race.","매년 봄 영국 글로스터 근처에서는 사람들이 모여 특이하고 흥미진진한 경주를 벌인다."],[12,"However, it continues to be one of England's most unusual traditions.","그러나 그것은 여전히 영국에서 가장 특이한 전통 중 하나로 이어지고 있다."]],"w":"1번에서 이 경주를 strange and exciting race(이상하고 흥미진진한 경주)라고 소개했고, 12번에서 가장 unusual한 전통 중 하나라고 함. 흔한 일이 아니라 '특이한' 것이라는 뜻. 평범한, 흔한은 반대.","c":4,"ev":"1번, 12번 문장"},"h":"ef40467b2f"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nThen participants chase after it as fast as they can.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그러면 참가자들이 가능한 한 빨리 그것을 쫓아간다.","opts":["언덕","경주","치즈","결승선"],"r":{"a":"3) 치즈","s":[[3,"From the top of Cooper's Hill, a large round cheese is rolled down.","쿠퍼스 힐의 꼭대기에서 크고 둥근 치즈가 아래로 굴려진다."],[4,"Then participants chase after it as fast as they can.","그러면 참가자들이 가능한 한 빨리 그것을 쫓아간다."]],"w":"3번에서 언덕 꼭대기에서 치즈가 굴려지고, 4번에서 참가자들이 그것(it)을 쫓아간다고 함. 쫓아가는 대상은 굴러가는 치즈.","c":3,"ev":"3~4번 문장"},"h":"fb28b6c693"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"So, the goal isn't actually to catch the cheese.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그래서 목표는 사실 치즈를 잡는 것이 아니다.","opts":["치즈를 잡는 것은 위험해서 사실 이 경주의 목표가 아니다.","치즈를 가장 먼저 잡는 것이 이 경주의 목표이다.","치즈를 잡을 수 있어서 이 경주의 목표가 되었다.","치즈 대신 다른 물건을 잡는 것이 이 경주의 목표이다."],"r":{"a":"1) 치즈를 잡는 것은 위험해서 사실 이 경주의 목표가 아니다.","s":[[6,"Catching the cheese would be almost impossible and very dangerous.","치즈를 잡는 것은 거의 불가능하고 매우 위험할 것이다."],[7,"So, the goal isn't actually to catch the cheese.","그래서 목표는 사실 치즈를 잡는 것이 아니다."]],"w":"6번에서 치즈를 잡는 것은 거의 불가능하고 위험하다고 하고, 7번 So 뒤에서 그래서 목표는 치즈를 잡는 것이 아니라고 함. 잡는 것이 목표라는 선지(②, ③)는 반대이고, 다른 물건을 잡는다는 선지(④)는 본문에 없는 내용임.","c":1,"ev":"6~7번 문장"},"h":"45231041a9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","opts":["The race is held in England every winter.","Participants usually run smoothly down the hill.","The first person to cross the finish line gets the cheese as a prize.","The event started only a few years ago."],"oko":["이 경주는 영국에서 매년 겨울에 열린다.","참가자들은 보통 언덕을 부드럽게 달려 내려간다.","결승선을 가장 먼저 통과한 사람이 치즈를 상으로 받는다.","이 행사는 몇 년 전에 처음 시작되었다."],"r":{"a":"3) The first person to cross the finish line gets the cheese as a prize.","s":[[1,"Each spring near Gloucester, England, crowds gather for a strange and exciting race.","매년 봄 영국 글로스터 근처에서는 사람들이 모여 특이하고 흥미진진한 경주를 벌인다."],[5,"The hill is so steep that they usually end up tumbling and sliding down rather than running.","언덕이 너무 가팔라서 그들은 보통 달리기보다는 구르고 미끄러져 내려가게 된다."],[8,"Instead, the first person to cross the finish line is the winner and gets the cheese as a prize.","대신 결승선을 가장 먼저 통과하는 사람이 우승자가 되고, 상으로 그 치즈를 받는다."],[9,"This wild event is believed to be over 600 years old.","이 거친 행사는 600년이 넘은 것으로 여겨진다."]],"w":"8번 문장과 일치. 1번에서 매년 봄이므로 겨울은 틀림. 5번에서 달리기보다 구르고 미끄러진다고 했으므로 부드럽게 달린다는 말은 틀림. 9번에서 600년이 넘은 행사이므로 몇 년 전은 틀림.","c":3,"ev":"1번, 5번, 8~9번 문장"},"h":"1ec436d715"},{"n":9,"t":"sum","q":"Because catching the cheese is almost (A) and very dangerous, the winner is the first person to cross the finish (B).","ko":"치즈를 잡는 것은 거의 (A) 매우 위험하기 때문에, 우승자는 (B)를 가장 먼저 통과하는 사람이다.","opts":["(A) easy / (B) line","(A) impossible / (B) hill","(A) impossible / (B) cheese","(A) easy / (B) hill","(A) impossible / (B) line"],"oko":["(A) 쉽고 / (B) 선","(A) 불가능하고 / (B) 언덕","(A) 불가능하고 / (B) 치즈","(A) 쉽고 / (B) 언덕","(A) 불가능하고 / (B) 선"],"r":{"a":"5) (A) impossible / (B) line","s":[[6,"Catching the cheese would be almost impossible and very dangerous.","치즈를 잡는 것은 거의 불가능하고 매우 위험할 것이다."],[8,"Instead, the first person to cross the finish line is the winner and gets the cheese as a prize.","대신 결승선을 가장 먼저 통과하는 사람이 우승자가 되고, 상으로 그 치즈를 받는다."]],"w":"6번에서 치즈를 잡는 것은 almost impossible and very dangerous라고 하고, 8번에서 결승선(finish line)을 가장 먼저 통과하는 사람이 우승자라고 함. easy는 6번과 반대이고, hill, cheese는 통과하는 대상이 아님.","c":5,"ev":"6번, 8번 문장"},"h":"c46092587e"},{"n":10,"t":"fill","q":"This wild event is believed to be over 600 years [A], but no one knows exactly how it [B].","ko":"이 거친 행사는 600년이 넘게 [A] 것으로 여겨지지만, 아무도 그것이 정확히 어떻게 [B]는지 모른다.","bank":["old","began","steep","winner","finish","prize"],"bko":{"old":"오래된","began":"시작되었다","steep":"가파른","winner":"우승자","finish":"끝내다","prize":"상"},"r":{"a":"[A] old, [B] began","s":[[9,"This wild event is believed to be over 600 years old.","이 거친 행사는 600년이 넘은 것으로 여겨진다."],[11,"No one knows exactly how it omes white at noon, and appears golden at sunset.","그것은 아침에는 분홍색으로 보이고, 정오에는 흰색이 되며, 해 질 녘에는 황금빛으로 보인다."]],"w":"5번 so 앞이 원인이고 뒤가 결과: 돌이 햇빛을 reflect해서 건물 색이 변해 보임. 6번에서 시간에 따라 분홍색, 흰색, 황금빛으로 보이므로 햇빛을 되비추는 '반사한다'가 맞음.","c":2,"ev":"5~6번 문장"},"h":"4aaf97f17c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This balance makes the Taj Mahal harmonious and beautiful.)","ko":"이 균형은 타지마할을 ( ) 아름답게 만든다.","opts":["시끄럽고","오래되고","조화롭고","위험하고"],"word":"harmonious","r":{"a":"3) 조화롭고","s":[[7,"Another well-known feature is its perfect symmetry.","또 하나의 잘 알려진 특징은 완벽한 대칭이다."],[10,"This balance makes the Taj Mahal harmonious and beautiful.","이 균형은 타지마할을 조화롭고 아름답게 만든다."]],"w":"7번에서 완벽한 대칭을 소개하고, 10번에서 그 균형이 타지마할을 harmonious하고 아름답게 만든다고 함. 좌우가 균형 있게 어우러지는 모습이므로 '조화롭고'. 시끄럽고, 위험하고는 어울리지 않음.","c":3,"ev":"7번, 10번 문장"},"h":"939b4e9714"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt looks pink in the morning, becomes white at noon, and appears golden at sunset.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 아침에는 분홍색으로 보이고, 정오에는 흰색이 되며, 해 질 녘에는 황금빛으로 보인다.","opts":["타지마할","햇빛","정원","대리석 조각"],"r":{"a":"1) 타지마할","s":[[5,"This special stone reflects sunlight, so the building seems to change color during the day.","이 특별한 돌은 햇빛을 반사해서, 건물이 낮 동안 색이 변하는 것처럼 보인다."],[6,"It looks pink in the morning, becomes white at noon, and appears golden at sunset.","그것은 아침에는 분홍색으로 보이고, 정오에는 흰색이 되며, 해 질 녘에는 황금빛으로 보인다."]],"w":"5번에서 햇빛을 반사하는 돌 때문에 the building(건물)의 색이 변하는 것처럼 보인다고 하고, 6번의 It은 그 건물, 즉 타지마할. 햇빛은 색을 비추는 것이지 색이 변해 보이는 대상이 아님.","c":1,"ev":"5~6번 문장"},"h":"79ebf0c25f"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Even the gardens and pools follow this design.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"정원과 연못조차도 이 설계를 따른다.","opts":["정원과 연못은 이 설계와 관계없이 만들어졌다.","정원과 연못이 건물보다 먼저 만들어졌다.","정원과 연못은 건물보다 훨씬 크게 만들어졌다.","건물뿐 아니라 정원과 연못에도 이 설계가 적용되어 있다."],"r":{"a":"4) 건물뿐 아니라 정원과 연못에도 이 설계가 적용되어 있다.","s":[[8,"The left and right sides of the building look exactly the es brothers came up with their bold idea in 2019.","ko":"존스 형제는 2019년에 대담한 아이디어를 떠올렸다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In 2019, they came up with a bold idea.","2019년에 그들은 대담한 아이디어를 떠올렸다."]],"w":"3번 문장에 In 2019, they came up with a bold idea라고 나옴. 2019년에 아이디어를 떠올렸다는 내용과 맞음.","c":"T"},"h":"fff36d444a"},{"n":2,"t":"tf","q":"The brothers built the drones by themselves, without any team.","ko":"형제는 팀 없이 스스로 드론을 만들었다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"With a team of engineers and scientists, they built drones that drop special seed pods.","엔지니어와 과학자로 이루어진 팀과 함께, 그들은 특별한 씨앗 꼬투리를 떨어뜨리는 드론을 만들었다."]],"w":"6번 문장에 With a team of engineers and scientists(엔지니어와 과학자 팀과 함께)라고 나옴. 형제 혼자가 아니라 팀과 함께 만들었으므로 틀림.","c":"F"},"h":"38f93bc200"},{"n":3,"t":"tf","q":"The Jones brothers have planted fewer than one million trees so far.","ko":"존스 형제는 지금까지 100만 그루도 안 되는 나무를 심었다.","r":{"a":"F (본문과 다른 내용)","ev":"11번 문장","s":[[11,"Thanks to this, the Jones brothers have already planted over 2.9 million trees all over the world.","이 덕분에 존스 형제는 이미 전 세계에 290만 그루가 넘는 나무를 심었다."]],"w":"11번 문장에 over 2.9 million trees(290만 그루가 넘는)라고 나옴. 100만 그루보다 훨씬 많으므로 틀림.","c":"F"},"h":"96996eae3f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In 2019, they came up with a bold idea.)","ko":"2019년에 그들은 ( ) 아이디어를 떠올렸다.","opts":["조심스러운","대담한","오래된","쉬운"],"word":"bold","r":{"a":"2) 대담한","ev":"3~4번 문장","s":[[3,"In 2019, they came up with a bold idea.","2019년에 그들은 대담한 아이디어를 떠올렸다."],[4,"They imagined drones that could plant trees from the sky!","그들은 하늘에서 나무를 심을 수 있는 드론을 상상했다!"]],"w":"bold idea 다음 4번에서 하늘에서 나무를 심는 드론을 상상했다고 이어짐. 그런 과감한 생각이니 bold는 '대담한'.","c":2},"h":"d25f692200"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When the pod meets water, it breaks down naturally.)","ko":"꼬투리가 물을 만나면 ( ) 분해된다.","opts":["갑자기","비싸게","자연스럽게","힘들게"],"word":"naturally","r":{"a":"3) 자연스럽게","ev":"8번 문장","s":[[8,"When the pod meets water, it breaks down naturally.","꼬투리가 물을 만나면 자연스럽게 분해된다."]],"w":"물을 만나면 사람이 힘을 쓰지 않아도 저절로 분해된다는 뜻이라 naturally는 '자연스럽게'.","c":3},"h":"18e02e6b8c"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nWhen the pod meets water, it breaks down naturally.","ko":"밑줄 친 it이 가리키는 것은?","sko":"꼬투리가 물을 만나면 그것이 자연스럽게 분해된다.","opts":["드론","물","씨앗","꼬투리"],"r":{"a":"4) 꼬투리","ev":"7~8번 문장","s":[[7,"Each pod holds a tree seed, plant food, and helpful fungi.","각 꼬투리에는 나무 씨앗, 식물 영양분, 그리고 도움이 되는 균류가 들어 있다."],[8,"When the pod meets water, it breaks down naturally.","꼬투리가 물을 만나면 자연스럽게 분해된다."]],"w":"7번에서 each pod(각 꼬투리)가 나오고, 8번 문장 앞부분 the pod가 바로 it. 물을 만나는 주인공이 분해되는 것이라 꼬투리.","c":4},"h":"a6e92d06ad"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Their work gives new hope to our planet's forests.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그들의 작업은 우리 지구의 숲에 새로운 희망을 준다.","opts":["그들의 작업이 지구의 숲이 다시 살아날 거라는 희망을 준다.","그들의 작업 때문에 지구의 숲이 모두 사라질 것이다.","그들이 새로운 숲을 사려고 희망하고 있다.","그들의 작업은 이미 끝나서 더 이상 할 일이 없다."],"r":{"a":"1) 그들의 작업이 지구의 숲이 다시 살아날 거라는 희망을 준다.","ev":"12번 문장","s":[[12,"Their work gives new hope to our planet’s forests.","그들의 작업은 우리 지구의 숲에 새로운 희망을 준다."]],"w":"hope는 희망, new hope는 새로운 희망. 숲을 다시 심는 일이 숲에 희망을 준다는 뜻이므로 ①이 답. 나머지는 숲이 사라지거나 일이 끝났다는 말로 본문과 반대.","c":1},"h":"f304996c38"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["산불이 난 뒤 손으로 나무를 심는 일은 금방 끝난다.","꼬투리에는 나무 씨앗만 들어 있다.","드론은 하루에 수천 그루의 나무를 심을 수 있다.","플래시 포레스트는 2019년 이전에 두 자매가 만든 회사다."],"opts":["Planting trees by hand after a wildfire is finished quickly.","Each pod holds only a tree seed.","The drones can plant thousands of trees in one day.","Flash Forest was started by two sisters before 2019."],"r":{"a":"3) The drones can plant thousands of trees in one day.","ev":"1번, 7번, 10번 문장","s":[[1,"After a wildfire, planting trees by hand can take years.","산불이 난 뒤에는 손으로 나무를 심는 데 몇 년이 걸릴 수 있다."],[7,"Each pod holds a tree seed, plant food, and helpful fungi.","각 꼬투리에는 나무 씨앗, 식물 영양분, 그리고 도움이 되는 균류가 들어 있다."],[10,"The drones can plant thousands of trees in just one day, even in hard-to-reach places.","드론은 접근하기 어려운 곳에서도 단 하루에 수천 그루의 나무를 심을 수 있다."]],"w":"10번에 in just one day, thousands of trees라고 나옴. ①은 1번에서 몇 년 걸린다고 해서 반대, ②는 7번에서 씨앗 외에 영양분·균류도 있다고 해서 틀림, ④는 형제(brothers)가 만든 회사라 틀림.","c":3},"h":"98a3db9e60"},{"n":9,"t":"sum","q":"The Jones brothers wanted a (A) way to replant forests, so they made drones that can plant trees even in (B) places.","ko":"존스 형제는 숲을 다시 심을 (A) 방법을 원해서, (B) 곳에서도 나무를 심을 수 있는 드론을 만들었다.","oko":["(A) 더 느린 / (B) 접근하기 어려운","(A) 더 빠른 / (B) 접근하기 쉬운","(A) 더 저렴한 / (B) 위험한","(A) 더 빠른 / (B) 접근하기 어려운","(A) 더 느린 / (B) 접근하기 쉬운"],"opts":["(A) slower / (B) hard-to-reach","(A) faster / (B) easy-to-reach","(A) cheaper / (B) dangerous","(A) faster / (B) hard-to-reach","(A) slower / (B) easy-to-reach"],"r":{"a":"4) (A) faster / (B) hard-to-reach","ev":"2번, 10번 문장","s":[[2,"Cameron and Bryce Jones, two brothers from Canada, wanted to find a faster way to replant forests.","캐나다 출신의 두 형제인 카메론과 브라이스 존스는 숲을 다시 심을 더 빠른 방법을 찾고 싶었다."],[10,"The drones can plant thousands of trees in just one day, even in hard-to-reach places.","드론은 접근하기 어려운 곳에서도 단 하루에 수천 그루의 나무를 심을 수 있다."]],"w":"2번에서 a faster way(더 빠른 방법)를 찾고 싶어 했고, 10번에서 hard-to-reach places(접근하기 어려운 곳)에서도 심을 수 있다고 함. 그래서 faster와 hard-to-reach.","c":4},"h":"4aa914272f"},{"n":10,"t":"fill","q":"Each pod holds a tree seed and plant food. When it meets [A], it breaks down naturally, and the seed can [B] and grow into a tree.","ko":"각 꼬투리에는 나무 씨앗과 식물 영양분이 들어 있다. 꼬투리가 [A]을(를) 만나면 자연스럽게 분해되고, 씨앗은 [B]하여 나무로 자랄 수 있다.","bank":["fire","hold","water","sprout","pods","sky"],"bko":{"fire":"불","hold":"담고 있다","water":"물","sprout":"싹이 트다","pods":"꼬투리들","sky":"하늘"},"r":{"a":"[A] water, [B] sprout","ev":"7~9번 문장","s":[[7,"Each pod holds a tree seed, plant food, and helpful fungi.","각 꼬투리에는 나무 씨앗, 식물 영양분, 그리고 도움이 되는 균류가 들어 있다."],[8,"When the pod meets water, it breaks down naturally.","꼬투리가 물을 만나면 자연스럽게 분해된다."],[9,"From there, the seed can sprout and grow into a tree.","거기서부터 씨앗은 싹을 틔워 나무로 자랄 수 있다."]],"w":"8번 When the pod meets water, 9번 the seed can sprout and grow into a tree에서 가져옴. fire(불)는 본문에 없고, hold·pods·sky는 문장 뜻이 맞지 않음.","c":null},"h":"9a8c834653"}]},{"u":5,"id":"b2-05-2","no":2,"ko":"추락하던 엘리베이터를 멈춘 발명가의 한 수는?","items":[{"n":1,"t":"tf","q":"In the early 1800s, elevators were mainly used in homes and offices.","ko":"1800년대 초에 엘리베이터는 주로 집과 사무실에서 사용되었다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"In the early 1800s, elevators were mainly used in factories and warehouses to lift heavy goods.","1800년대 초에 엘리베이터는 주로 무거운 물건을 들어 올리는 공장과 창고에서 사용되었다."]],"w":"1번 문장에 factories and warehouses(공장과 창고)라고 나옴. 집과 사무실이 아니므로 틀림.","c":"F"},"h":"31f5729337"},{"n":2,"t":"tf","q":"Elisha Otis invented the safety brake in 1853.","ko":"엘리샤 오티스는 1853년에 안전 제동장치를 발명했다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"In 1853, he invented the safety brake.","1853년에 그는 안전 제동장치를 발명했다."]],"w":"6번 문장에 In 1853, he invented the safety brake라고 나옴. 연도와 발명품이 모두 맞음.","c":"T"},"h":"6bdff7eec1"},{"n":3,"t":"tf","q":"When the rope was cut in Otis's demonstration, the elevator fell to the ground.","ko":"오티스의 시연에서 밧줄이 잘렸을 때 엘리베이터는 바닥으로 떨어졌다.","r":{"a":"F (본문과 다른 내용)","ev":"12번 문장","s":[[12,"The brake worked and the elevator stopped immediately.","제동장치는 작동했고 엘리베이터는 즉시 멈췄다."]],"w":"12번 문장에 The brake worked and the elevator stopped immediately라고 나옴. 떨어진 게 아니라 즉시 멈췄으므로 틀림.","c":"F"},"h":"6204ecc88f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (If a rope broke, the elevator crashed.)","ko":"밧줄이 끊어지면 엘리베이터는 ( ).","opts":["흔들렸다","추락했다","멈췄다","올라갔다"],"word":"crashed","r":{"a":"2) 추락했다","ev":"3~4번 문장","s":[[3,"If a rope broke, the elevator crashed.","밧줄이 끊어지면 엘리베이터는 추락했다."],[4,"Because of this, people were afraid to use them.","이 때문에 사람들은 엘리베이터 타기를 두려워했다."]],"w":"밧줄이 끊어졌는데 그다음 4번에서 사람들이 무서워했다고 함. 큰 사고가 났다는 뜻이라 crashed는 '추락했다'.","c":2},"h":"48f029ff96"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (To prove it was safe, Otis gave a public demonstration.)","ko":"그것이 안전하다는 것을 ( ) 위해 오티스는 공개 시연을 했다.","opts":["숨기다","바꾸다","증명하다","돕다"],"word":"prove","r":{"a":"3) 증명하다","ev":"10번 문장","s":[[10,"To prove it was safe, Otis gave a public demonstration.","그것이 안전하다는 것을 증명하기 위해 오티스는 공개 시연을 했다."]],"w":"안전하다는 것을 사람들에게 보여 주려고 시연을 했으므로 prove는 '증명하다'.","c":3},"h":"87fd5b5dd9"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBecause of this, people were afraid to use them.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이 때문에 사람들은 그것들을 사용하기를 두려워했다.","opts":["공장과 창고","무거운 물건","밧줄","엘리베이터"],"r":{"a":"4) 엘리베이터","ev":"3~4번 문장","s":[[3,"If a rope broke, the elevator crashed.","밧줄이 끊어지면 엘리베이터는 추락했다."],[4,"Because of this, people were afraid to use them.","이 때문에 사람들은 엘리베이터 타기를 두려워했다."]],"w":"3번에서 밧줄이 끊어지면 엘리베이터가 추락한다고 함. 그래서 사람들이 타기 두려워한 것은 엘리베이터(them). 밧줄은 추락의 원인일 뿐.","c":4},"h":"fa00847005"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"This serious problem was solved by American inventor Elisha Otis.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 심각한 문제는 미국의 발명가 엘리샤 오티스에 의해 해결되었다.","opts":["엘리베이터가 추락해 사람들이 두려워하던 문제를 미국인 발명가 오티스가 해결했다.","미국인 발명가 오티스가 엘리베이터가 추락하는 사고를 처음 일으켰다.","오티스는 이 문제를 풀지 못하고 다른 발명가에게 넘겼다.","사람들이 오티스의 발명 때문에 엘리베이터를 더 두려워하게 되었다."],"r":{"a":"1) 엘리베이터가 추락해 사람들이 두려워하던 문제를 미국인 발명가 오티스가 해결했다.","ev":"5번 문장","s":[[5,"This serious problem was solved by American inventor Elisha Otis.","이 심각한 문제는 미국의 발명가 엘리샤 오티스에 의해 해결되었다."]],"w":"this serious problem은 3~4번의 추락과 두려움. solved by는 '~에 의해 해결되었다'. 오티스가 해결한 사람이라 ①이 답.","c":1},"h":"79628a3559"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["1800년대 초 엘리베이터는 안전해서 사람들이 좋아했다.","오티스의 제동장치는 밧줄을 더 길게 만들어 엘리베이터를 멈췄다.","오티스는 밧줄이 잘릴 때 엘리베이터 위에 서 있었다.","오티스의 발명 이전에도 높은 건물이 흔했다."],"opts":["Elevators in the early 1800s were safe, so people liked them.","Otis's brake stopped the elevator by making the rope longer.","Otis stood on the elevator when the rope was cut.","Tall buildings were already common before Otis's invention."],"r":{"a":"3) Otis stood on the elevator when the rope was cut.","ev":"10~11번 문장","s":[[10,"To prove it was safe, Otis gave a public demonstration.","그것이 안전하다는 것을 증명하기 위해 오티스는 공개 시연을 했다."],[11,"He stood on the elevator and ordered the rope to be cut.","그는 엘리베이터 위에 서서 밧줄을 자르라고 명령했다."]],"w":"11번에 He stood on the elevator and ordered the rope to be cut이라고 나옴. ①은 4번에서 사람들이 두려워했다고 해서 반대, ②는 8~9번에서 스프링과 갈고리가 멈춘다고 해서 틀림, ④는 14번에서 오티스의 발명으로 높은 건물이 가능해졌다고 해서 반대.","c":3},"h":"cc6cbf9ec4"},{"n":9,"t":"sum","q":"If a rope broke, early elevators (A), but with Otis's safety brake, the hooks grabbed the side rails and (B) the elevator.","ko":"밧줄이 끊어지면 초기 엘리베이터는 (A)했지만, 오티스의 안전 제동장치로는 갈고리가 옆 레일을 붙잡아 엘리베이터를 (B)했다.","oko":["(A) 올라갔다 / (B) 들어 올렸다","(A) 추락했다 / (B) 들어 올렸다","(A) 멈췄다 / (B) 추락시켰다","(A) 올라갔다 / (B) 멈추게 했다","(A) 추락했다 / (B) 멈추게 했다"],"opts":["(A) rose / (B) lifted","(A) crashed / (B) lifted","(A) stopped / (B) crashed","(A) rose / (B) stopped","(A) crashed / (B) stopped"],"r":{"a":"5) (A) crashed / (B) stopped","ev":"3번, 9번 문장","s":[[3,"If a rope broke, the elevator crashed.","밧줄이 끊어지면 엘리베이터는 추락했다."],[9,"The hooks then grabbed the side rails and stopped the elevator.","그러면 갈고리가 옆 레일을 붙잡아 엘리베이터를 멈춰 세웠다."]],"w":"3번에서 밧줄이 끊어지면 엘리베이터가 crashed(추락했다)라고 하고, 9번에서 갈고리가 레일을 붙잡아 엘리베이터를 stopped(멈췄다)라고 함. 그래서 crashed와 stopped.","c":5},"h":"5b4170255e"},{"n":10,"t":"fill","q":"To prove it was safe, Otis gave a public [A], and this success made people [B] elevators.","ko":"그것이 안전하다는 것을 증명하기 위해 오티스는 공개 [A]을(를) 했고, 이 성공은 사람들이 엘리베이터를 [B]하게 만들었다.","bank":["brake","trust","rope","demonstration","hook","factory"],"bko":{"brake":"제동장치","trust":"믿다","rope":"밧줄","demonstration":"시연","hook":"갈고리","factory":"공장"},"r":{"a":"[A] demonstration, [B] trust","ev":"10번, 13번 문장","s":[[10,"To prove it was safe, Otis gave a public demonstration.","그것이 안전하다는 것을 증명하기 위해 오티스는 공개 시연을 했다."],[13,"This success finally made people trust elevators.","이 성공은 마침내 사람들이 엘리베이터를 믿게 만들었다."]],"w":"10번 gave a public demonstration, 13번 This success finally made people trust elevators에서 가져옴. brake, rope, hook, platform은 모두 장치 이름이라 빈칸 문장에 맞지 않음.","c":null},"h":"c174d4a4b8"}]},{"u":5,"id":"b2-05-3","no":3,"ko":"문학상을 받은 가수, 그 이유는?","items":[{"n":1,"t":"tf","q":"In 2016, a Nobel Prize in Literature was given to an American musician.","ko":"2016년에 노벨 문학상이 미국의 음악가에게 주어졌다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"However, in 2016, the world was surprised when one was given to American musician Bob Dylan.","그러나 2016년에 미국의 음악가 밥 딜런에게 노벨상이 주어졌을 때 세상은 놀랐다."]],"w":"2번 문장에 in 2016 ... one was given to American musician Bob Dylan이라고 나옴. 2016년, 음악가에게 상이 주어졌다는 내용과 맞음.","c":"T"},"h":"b7a84c5746"},{"n":2,"t":"tf","q":"Most Nobel Prizes in Literature go to musicians.","ko":"문학 부문 노벨상 대부분은 음악가에게 돌아간다.","r":{"a":"F (본문과 다른 내용)","ev":"1번 문장","s":[[1,"Most Nobel Prizes in Literature go to people who write books or poems.","문학 부문 노벨상 대부분은 책이나 시를 쓰는 사람들에게 돌아간다."]],"w":"1번 문장에 대부분은 people who write books or poems(책이나 시를 쓰는 사람들)에게 간다고 나옴. 음악가가 아니라서 틀림.","c":"F"},"h":"b72d86b7bd"},{"n":3,"t":"tf","q":"Some critics argued that song lyrics are different from literature.","ko":"일부 비평가들은 노래 가사가 문학과 다르다고 주장했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"Some critics argued that song lyrics are different from literature.","일부 비평가들은 노래 가사가 문학과는 다르다고 주장했다."]],"w":"9번 문장에 Some critics argued that song lyrics are different from literature라고 그대로 나옴.","c":"T"},"h":"d0075f3f25"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (These events influenced his music.)","ko":"이런 사건들은 그의 음악에 ( ).","opts":["방해했다","끝냈다","영향을 주었다","따라 했다"],"word":"influenced","r":{"a":"3) 영향을 주었다","ev":"3~4번 문장","s":[[3,"Dylan became famous in the 1960s, a time of war and protest in the U.S.","딜런은 전쟁과 시위의 시대였던 1960년대 미국에서 유명해졌다."],[4,"These events influenced his music.","이런 사건들은 그의 음악에 영향을 주었다."]],"w":"3번의 전쟁과 시위 같은 사건들이 딜런의 음악에 어떤 힘을 미쳤다는 내용. 5~6번에서 그 영향이 노랫말에 나타난다. 그래서 influenced는 '영향을 주었다'.","c":3},"h":"e1f5fab1dc"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, others supported the decision.)","ko":"그러나 다른 사람들은 그 결정을 ( ).","opts":["반대했다","지지했다","잊었다","바꿨다"],"word":"supported","r":{"a":"2) 지지했다","ev":"9~10번 문장","s":[[9,"Some critics argued that song lyrics are different from literature.","일부 비평가들은 노래 가사가 문학과는 다르다고 주장했다."],[10,"However, others supported the decision.","그러나 다른 사람들은 그 결정을 지지했다."]],"w":"9번에서 일부 비평가가 가사는 문학이 아니라고 주장했고, 10번 However(그러나)로 다른 사람들의 입장이 이어짐. 비평가들과 반대되는 입장이므로 supported는 '지지했다'. '반대했다'는 9번 비평가들의 태도.","c":2},"h":"bbf70b959b"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey said his meaningful lyrics were like modern poetry.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 그의 의미 있는 가사가 현대 시와 같다고 말했다.","opts":["일부 비평가들","노벨 위원회","밥 딜런","결정을 지지한 다른 사람들"],"r":{"a":"4) 결정을 지지한 다른 사람들","ev":"10~11번 문장","s":[[10,"However, others supported the decision.","그러나 다른 사람들은 그 결정을 지지했다."],[11,"They said his meaningful lyrics were like modern poetry.","그들은 그의 의미 있는 가사가 현대 시와 같다고 말했다."]],"w":"10번에서 others supported the decision(결정을 지지한 다른 사람들)이 나오고, 11번 They가 바로 그 사람들. 가사가 현대 시 같다는 말은 지지하는 쪽의 말.","c":4},"h":"942455f26e"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Dylan's award showed that literature is not only written in books.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"딜런의 수상은 문학이 책 속에만 쓰이는 것이 아님을 보여 주었다.","opts":["딜런의 수상은 문학이 책으로만 이루어지지 않는다는 것을 보여 주었다.","딜런의 수상은 문학이 책에서만 만들어져야 한다는 것을 보여 주었다.","딜런이 책을 많이 써서 상을 받았다는 것을 보여 주었다.","딜런의 수상은 음악이 문학보다 못하다는 것을 보여 주었다."],"r":{"a":"1) 딜런의 수상은 문학이 책으로만 이루어지지 않는다는 것을 보여 주었다.","ev":"12번 문장","s":[[12,"Dylan’s award showed that literature is not only written in books.","딜런의 수상은 문학이 책 속에만 쓰이는 것이 아님을 보여 주었다."]],"w":"not only written in books는 '책 속에만 쓰이는 것이 아니다'. 13번에서 음악으로도 노래되고 느껴질 수 있다고 이어짐. 그래서 ①이 답.","c":1},"h":"77ff25193d"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["딜런은 책을 많이 써서 노벨 문학상을 받았다.","모든 비평가는 딜런의 수상을 지지했다.","딜런의 음악은 그 시대의 일에 영향을 받지 않았다.","딜런은 전쟁과 시위의 시대인 1960년대에 유명해졌다."],"opts":["Dylan won the Nobel Prize in Literature because he wrote many books.","All critics supported Dylan's award.","Dylan's music was not influenced by the events of his time.","Dylan became famous in the 1960s, a time of war and protest."],"r":{"a":"4) Dylan became famous in the 1960s, a time of war and protest.","ev":"3~4번 문장","s":[[3,"Dylan became famous in the 1960s, a time of war and protest in the U.S.","딜런은 전쟁과 시위의 시대였던 1960년대 미국에서 유명해졌다."],[4,"These events influenced his music.","이런 사건들은 그의 음악에 영향을 주었다."]],"w":"3번에 became famous in the 1960s, a time of war and protest라고 나옴. ①은 음악가라 책이 아니라 노래로 받았고(2번), ②는 9번에 반대하는 비평가가 있고, ③은 4번에서 영향을 주었다고 해서 반대.","c":4},"h":"a0a1887e1f"},{"n":9,"t":"sum","q":"Dylan wrote songs with (A) language about freedom, peace, and justice, and his music gave people (B).","ko":"딜런은 자유, 평화, 정의에 관한 노래를 (A) 언어로 썼고, 그의 음악은 사람들에게 (B)을(를) 주었다.","oko":["(A) 화난 / (B) 두려움","(A) 단순한 / (B) 평화","(A) 시적인 / (B) 두려움","(A) 단순한 / (B) 희망","(A) 시적인 / (B) 희망"],"opts":["(A) angry / (B) fear","(A) simple / (B) peace","(A) poetic / (B) fear","(A) simple / (B) hope","(A) poetic / (B) hope"],"r":{"a":"5) (A) poetic / (B) hope","ev":"5~6번 문장","s":[[5,"He used poetic language to write songs about freedom, peace, and justice.","그는 시적인 언어를 사용해 자유, 평화, 정의에 관한 노래를 썼다."],[6,"His music reflected the social changes of the time and gave people hope.","그의 음악은 그 시대의 사회 변화를 반영했고 사람들에게 희망을 주었다."]],"w":"5번에서 poetic language(시적인 언어)로 자유·평화·정의 노래를 썼고, 6번에서 gave people hope(사람들에게 희망을 주었다)라고 함. 그래서 poetic과 hope.","c":5},"h":"a8ac65a26c"},{"n":10,"t":"fill","q":"Dylan's award showed that literature is not only written in books, but can also be [A] and [B] through music.","ko":"딜런의 수상은 문학이 책에만 쓰이는 것이 아니라 음악을 통해 [A]고 [B]도 할 수 있음을 보여 주었다.","bank":["sung","decision","felt","prize","protest","poetry"],"bko":{"sung":"노래되다","decision":"결정","felt":"느껴지다","prize":"상","protest":"시위","poetry":"시"},"r":{"a":"[A] sung, [B] felt","ev":"12~13번 문장","s":[[12,"Dylan’s award showed that literature is not only written in books.","딜런의 수상은 문학이 책 속에만 쓰이는 것이 아님을 보여 주었다."],[13,"It can also be sung and felt through music.","문학은 또한 음악을 통해 노래되고 느껴질 수 있다."]],"w":"13번 It can also be sung and felt through music에서 가져옴. decision, prize, protest, poetry는 모두 명사라서 be 뒤에 '음악을 통해 ~되다'로 이어지지 않음.","c":null},"h":"14680c3ac9"}]},{"u":5,"id":"b2-05-4","no":4,"ko":"사고로 누운 침대에서 시작된 그림, 어떻게 위대한 예술이 되었나?","items":[{"n":1,"t":"tf","q":"Frida Kahlo was eighteen when she had a terrible bus accident.","ko":"프리다 칼로는 열여덟 살 때 끔찍한 버스 사고를 당했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","s":[[1,"In 1925, when Frida Kahlo was eighteen, a terrible bus accident changed her life forever.","1925년, 프리다 칼로가 열여덟 살이었을 때, 끔찍한 버스 사고가 그녀의 삶을 영원히 바꾸어 놓았다."]],"w":"1번 문장에 when Frida Kahlo was eighteen, a terrible bus accident라고 나옴. 나이와 사고가 모두 맞음.","c":"T"},"h":"be02c25089"},{"n":2,"t":"tf","q":"After her body healed, the pain from her injuries went away completely.","ko":"몸이 회복된 뒤 부상으로 인한 고통은 완전히 사라졌다.","r":{"a":"F (본문과 다른 내용)","ev":"5~6번 문장","s":[[5,"Over time, Frida’s body healed.","시간이 지나면서 프리다의 몸은 회복되었다."],[6,"But the pain from her injuries never went away completely.","하지만 부상으로 인한 고통은 완전히 사라지지 않았다."]],"w":"5번에서 몸은 회복되었지만, 6번에서 But the pain ... never went away completely라고 함. 고통이 완전히 사라지지 않았으므로 틀림.","c":"F"},"h":"2c1b655400"},{"n":3,"t":"tf","q":"Frida began to paint because she wanted to become a famous artist.","ko":"프리다는 유명한 예술가가 되고 싶어서 그림을 그리기 시작했다.","r":{"a":"F (본문과 다른 내용)","ev":"3번 문장","s":[[3,"During those long, painful days, she began to paint to pass the time.","그 길고 고통스러운 날들 동안, 그녀는 시간을 보내기 위해 그림을 그리기 시작했다."]],"w":"3번 문장에 she began to paint to pass the time(시간을 보내려고)이라고 나옴. 유명해지려는 목적이 아니므로 틀림.","c":"F"},"h":"7d22973e55"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In this way, she revealed the strength she carried throughout her life.)","ko":"이렇게 해서 그녀는 평생 지니고 있던 강인함을 ( ).","opts":[" "ev":"5~7번 문장","s":[[5,"The sweeteners are much sweeter, so only a tiny amount is needed.","감미료는 훨씬 더 달아서 아주 적은 양만 필요하다."],[6,"This small quantity adds almost no calories.","이 적은 양은 칼로리를 거의 더하지 않는다."],[7,"This is why the drink can be labeled “zero-calorie.”","이것이 그 음료에 '제로 칼로리'라는 표시를 붙일 수 있는 이유이다."]],"w":"5번에서 아주 적은 양만 필요하고, 6번에서 그 적은 양이 칼로리를 거의 더하지 않는다고 함. 7번 This is why는 그 내용이 제로 칼로리 표시의 이유라는 말. 건강한 선택처럼 보인다는 이야기는 8번.","c":3},"h":"d6cd72c9be"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Zero-calorie drinks can help people avoid sugar, but they're not a perfect solution.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"제로 칼로리 음료는 사람들이 설탕을 피하는 데 도움이 될 수 있지만, 완벽한 해결책은 아니다.","opts":["제로 칼로리 음료는 설탕을 피하는 데 전혀 도움이 되지 않는다.","제로 칼로리 음료는 설탕을 피하는 데 도움이 되지만 완벽한 해결책은 아니다.","제로 칼로리 음료는 완벽한 해결책이라 마음껏 마셔도 된다.","제로 칼로리 음료는 사람들이 설탕을 더 많이 먹게 만든다."],"r":{"a":"2) 제로 칼로리 음료는 설탕을 피하는 데 도움이 되지만 완벽한 해결책은 아니다.","ev":"13번 문장","s":[[13,"Zero-calorie drinks can help people avoid sugar, but they’re not a perfect solution.","제로 칼로리 음료는 사람들이 설탕을 피하는 데 도움이 될 수 있지만, 완벽한 해결책은 아니다."]],"w":"can help는 '도움이 될 수 있다', but 뒤의 not a perfect solution은 '완벽한 해결책은 아니다'. 장점과 한계를 함께 말한 2번.","c":2},"h":"c3d34c05ad"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["일부 연구자들은 인공 감미료가 뇌의 단맛 감각을 혼란스럽게 할 수 있다고 생각한다.","연구자들은 인공 감미료가 완전히 안전하다고 말한다.","인공 감미료는 뇌가 단맛을 잊어버리게 만든다.","연구자들은 감미료가 모든 건강 문제를 막아 준다고 밝혔다."],"opts":["Some researchers think artificial sweeteners might confuse the brain's sense of sweetness.","Researchers say artificial sweeteners are completely safe.","Artificial sweeteners make the brain forget about sweetness.","Researchers found that sweeteners prevent all health problems."],"r":{"a":"1) Some researchers think artificial sweeteners might confuse the brain's sense of sweetness.","ev":"9~10번 문장","s":[[9,"However, some researchers warn about side effects.","하지만 일부 연구자들은 부작용을 경고한다."],[10,"They suggest that artificial sweeteners might confuse the brai
