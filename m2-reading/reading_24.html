rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": "Bicycle", "en": "Mt. Tambora, who is a volcano in Indonesia, exploded in 1815.", "ko": "1815년 인도네시아의 화산인 탐보라산이 폭발했다.", "ok": false, "foot": [], "fixes": [{"wrong": "who", "right": "which", "partial": false, "at": [2], "point": "관계대명사: 사물(화산)을 가리키므로 which 사용", "topic": "관계대명사", "memo": "사물(화산)을 가리키므로 which 사용"}]}, {"n": 2, "tag": null, "en": "The explosion created an huge cloud of ash, so crops fail around the world.", "ko": "이 폭발은 거대한 재 구름을 만들었고, 그래서 전 세계적으로 농작물이 자라지 못했다.", "ok": false, "foot": ["1ash 재"], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [3], "point": "관사: huge는 자음 발음[h]으로 시작하므로 부정관사 a 사용", "topic": "관사", "memo": "huge는 자음 발음[h]으로 시작하므로 부정관사 a 사용"}, {"wrong": "fail", "right": "failed", "partial": false, "at": [10], "point": "시제: 과거 시제 문맥이므로 failed 사용", "topic": "시제", "memo": "과거 시제 문맥이므로 failed 사용"}]}, {"n": 3, "tag": null, "en": "As a result, people didn’t have enough food eating.", "ko": "그 결과, 사람들은 먹을 음식이 충분하지 않았다.", "ok": false, "foot": [], "fixes": [{"wrong": "eating", "right": "to eat", "partial": false, "at": [8], "point": "to부정사의 형용사적 용법: food를 수식하는 to eat 사용", "topic": "to부정사의 형용사적 용법", "memo": "food를 수식하는 to eat 사용"}]}, {"n": 4, "tag": null, "en": "Surprisingly, this made traveling difficultly.", "ko": "놀랍게도, 이로 인해 이동이 어려워졌다.", "ok": false, "foot": [], "fixes": [{"wrong": "difficultly", "right": "difficult", "partial": false, "at": [4], "point": "5형식 목적격보어: make의 목적격보어 자리에는 형용사 difficult 사용", "topic": "5형식 목적격보어", "memo": "make의 목적격보어 자리에는 형용사 difficult 사용"}]}, {"n": 5, "tag": null, "en": "Why? In those days, people rode horses, but they had many horses kill for food.", "ko": "왜일까? 당시 사람들은 말을 탔는데, 사람들은 많은 말들을 식용으로 죽게 했다.", "ok": false, "foot": [], "fixes": [{"wrong": "kill", "right": "killed", "partial": false, "at": [12], "point": "5형식 사역동사: have + 목적어 + 과거분사(killed) — 목적어(horses)가 ‘죽임을 당하는’ 수동 관계", "topic": "5형식 사역동사", "memo": "have + 목적어 + 과거분사(killed) — 목적어(horses)가 ‘죽임을 당하는’ 수동 관계"}]}, {"n": 6, " t. Surprisingly, this made traveling difficult. Why? In those days, people rode horses, but they had many horses killed for food. People needed a new way to travel, and Karl von Drais invented the first bicycle in Germany in 1817. Drais’s bicycle had two wooden wheels but no pedals. How did it move without pedals? Well, riders simply pushed the bicycle forward with their feet. The bicycle has been the result of many inventors’ work since the 19th century.", "Whiteout was invented by Bette Graham. In 1956, Graham was working at a bank in Texas, USA. At that time, people had to retype the whole page when they made even a small mistake. Graham was a bad typist, so she needed a solution. One day, Graham saw some window painters. When they made a mistake, they corrected it by simply painting over it. The next day, she made her own white paint and used it to correct her typing mistakes. Surprisingly, nobody noticed! This encouraged everyone at the bank to use it.", "The first webcam was invented to watch a coffee pot. In 1991, Dr. Quentin Stafford-Fraser and Dr. Paul Jardetzky were working at a computer lab in England. To work better, they needed lots of coffee. However, there was only one coffee machine in the building. So, they had to make many disappointing trips to the empty coffee pot. As a solution, the two researchers set up a camera in front of the coffee machine. The camera took pictures of the coffee pot three times a minute. With special software, all the researchers in the building could see the pictures on their local network. No more disappointing trips!"];var PASS_KO=["필요는 발명의 어머니이다", "1815년 인도네시아의 화산인 탐보라산이 폭발했다. 이 폭발은 거대한 재 구름을 만들었고, 그래서 전 세계적으로 농작물이 자라지 못했다. 그 결과, 사람들은 먹을 음식이 충분하지 않았다. 놀랍게도, 이로 인해 이동이 어려워졌다. 왜일까? 당시 사람들은 말을 탔는데, 사람들은 많은 말들을 식용으로 죽게 했다. 사람들은 이동하기 위한 새로운 수단이 필요했고, 1817년 독일에서 Karl von Drais가 최초의 자전거를 발명했다. Drais의 자전거는 나무로 된 두 개의 바퀴가 있었지만 페달은 없었다. 페달 없이 어떻게 움직였을까? 음, 타는 사람들이 단순히 발로 자전거를 앞으로 밀었다. 자전거는 19세기부터 지금까지 많은 발명가들의 노력의 결과이다.", "수정액은 Bette Graham에 의해 발명되었다. 1956년 Graham은 미국 텍사스의 한 은행에서 일하고 있었다. 그 당시, 사람들은 작은 실수 하나라도 하면 전체 페이지를 다시 입력해야 했다. Graham은 타자 실력이 좋지 않아서 해결책이 필요했다. 어느 날 Graham은 창문을 칠하는 페인트공들을 보았다. 그들은 실수했을 때 단순히 그 위에 페인트를 덧칠하는 것으로 실수를 수정했다. 그다음 날 그녀는 자신만의 흰색 페인트를 만들어 오타를 수정하는 데 사용했다. 놀랍게도, 아무도 알아차리지 못했다! 이것은 은행의 모든 사람들이 그것을 사용하도록 부추겼다.", "최초의 웹캠은 커피포트를 지켜보기 위해 발명되었다. 1991년 Quentin Stafford-Fraser 박사와 Paul Jardetzky 박사는 영국의 한 컴퓨터 연구소에서 일하고 있었다. 일을 더 잘하기 위해, 그들은 많은 양의 커피가 필요했다. 하지만 건물에는 커피 머신이 한 대뿐이었다. 그래서 그들은 비어 있는 커피포트로 실망스러운 발걸음을 많이 해야 했다. 해결책으로, 두 연구원은 커피 머신 앞에 카메라를 설치했다. 그 카메라는 1분에 세 번씩 커피포트의 사진을 찍었다. 특수 소프트웨어를 사용해 건물에 있는 모든 연구원들이 사내 통신망으로 사진을 볼 수 있었다. 더 이상 실망스러운 발걸음은 없었다!"];var DG=[{"dlg": [["G", "Look at this program, Liam. This Saturday is Science Day, and there are lots of interesting activities.", "이 프로그램 좀 봐, Liam. 이번 토요일이 과학의 날인데, 재미있는 활동이 많이 있어."], ["B", "You mean April 21?", "4월 21일 말하는 거야?"], ["G", "Yes. All the activities look fun, and they’re all free.", "응. 모든 활동이 재미있어 보이고, 전부 무료야."], ["B", "All of them? Are you sure?", "전부 다? 확실해?"], ["G", "Yes, I’m quite sure. I saw it on the poster. Anyway, which ones are you interested in?", "응, 꽤 확실해. 포스터에서 봤어. 그나저나, 너는 어떤 것들에 관심이 있어?"], ["B", "I want to go to the drone-flying class the most. How about you, Somi?", "나는 드론 날리기 수업에 가장 가고 싶어. 너는 어때, 소미야?"], ["G", "Well, I want to go to Dr. Lee’s lecture on AI.", "음, 나는 이 박사님의 인공지능 강연에 가고 싶어."], ["B", "Oh, I like that, too. Let’s go to both classes.", "오, 나도 그거 좋아. 두 수업 다 가자."], ["G", "Let’s see. The drone-flying class is on Saturday afternoon, and Dr. Lee’s lecture is on Sunday morning.", "어디 보자. 드론 날리기 수업은 토요일 오후이고, 이 박사님 강연은 일요일 오전이야."], ["B", "Perfect. I can’t wait.", "완벽해. 정말 기대된다."]], "qs": [{"n": 1, "q": "위 대화의 주제로 알맞은 것은?", "o": ["choosing fun club activities", "sharing their free-time activities", "preparing events for Science Day", "doing exciting science experiments", "planning interesting activities for Science Day"], "a": 4, "ans": "planning interesting activities for Science Da    +'<div class="hl">해설</div>'+(q.evs||[q.ev]).map(function(x,j){return '<div class="pt">'+(j?'':(q.lab||'근거 : '))+esc(x[0])+'</div><div class="ko">'+esc(x[1])+'</div>'}).join('')+''+(q.why?'<div class="pt" style="margin-top:4px">'+esc(q.why)+'</div>':'')+'</div>';
 }

function sHtml(q,lock){

function oxSummary(p){

 var bad=all.filter(function(q){return q.bad}),found=bad.filter(function(q){return pick[q.n]===1}),ms=bad.filter(function(q){return pick[q.n]!==1}),fp=all.filter(function(q){return !q.bad&&pick[q.n]===1});

  ms.forEach(function(q){h+='<div class="mi"><span class="no">'+q.dn+'</span><span class="en">'+esc(q.q)+' → 불일치</span><ul><li>'+esc(q.fact)+'</li><li>'+esc(q.ev[0])+' ('+esc(q.ev[1])+')</li></ul></div>'});
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
function qSummary(p){

  ms.slice(0,cap).forEach(function(q){

  });
  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">틀린 문제가 없어요. 쓸 것이 없습니다.</div></div>';
 return h;
}
