어, 민들레 씨앗은 작은 낙하산처럼 떠다니고, 단풍나무 씨앗은 날개 같은 모양 덕분에 공중에서 빙글빙글 돈다."],[8,"These seeds often have hard shells to protect them during long journeys.","이 씨앗들은 긴 여정 동안 씨앗을 보호하는 단단한 껍질을 가진 경우가 많다."],[9,"Coconuts can cross oceans and survive until they reach a suitable place to grow.","코코넛은 바다를 건너 자라기에 알맞은 곳에 닿을 때까지 살아남을 수 있다."],[11,"Burdock seeds have small hooks that attach to animal fur and later fall off in distant areas.","우엉 씨앗은 동물의 털에 붙는 작은 갈고리가 있어서 나중에 멀리 떨어진 곳에서 떨어져 나간다."]]},"h":"e23cd54c81"},{"n":9,"t":"sum","q":"If all the seeds grow near the parent plant, they will (A) for sunlight, water, and nutrients, so plants have developed ways to (B) their seeds.","ko":"모든 씨앗이 어미 식물 가까이에서 자라면 햇빛, 물, 영양분을 두고 (A)하게 되므로, 식물은 씨앗을 (B)는 방법을 발달시켜 왔다.","oko":["(A) 나누다 / (B) 퍼뜨리다","(A) 경쟁하다 / (B) 모으다","(A) 기다리다 / (B) 숨기다","(A) 경쟁하다 / (B) 퍼뜨리다","(A) 자라다 / (B) 파괴하다"],"opts":["(A) share / (B) spread","(A) compete / (B) collect","(A) wait / (B) hide","(A) compete / (B) spread","(A) grow / (B) destroy"],"r":{"a":"4) (A) compete / (B) spread","ev":"2~3번 문장","w":"2번에서 씨앗들이 compete(경쟁하다)하게 되고, 3번에서 이를 막으려고 ways to spread their seeds(씨앗을 퍼뜨리는 방법)를 발달시켰다고 함. share나 collect는 문제를 해결하는 방향이 아님.","c":4,"s":[[2,"If all the seeds grow near the parent plant, they will compete for sunlight, water, and nutrients.","모든 씨앗이 어미 식물 가까이에서 자라면, 그것들은 햇빛, 물, 영양분을 두고 경쟁하게 될 것이다."],[3,"To prevent this, plants have developed various ways to spread their seeds.","이를 막기 위해, 식물은 씨앗을 퍼뜨리는 다양한 방법을 발달시켜 왔다."]]},"h":"2486bbea69"},{"n":10,"t":"fill","q":"Burdock seeds attach to animal [A] with small hooks, and apple seeds travel through animals’ [B] after they eat the fruit.","ko":"우엉 씨앗은 작은 갈고리로 동물의 [A]에 붙고, 사과 씨앗은 동물이 과일을 먹은 뒤 동물의 [B]을 통과해 이동한다.","bank":["fur","bodies","shells","roots","hooks","parachutes"],"bko":{"fur":"털","bodies":"몸","shells":"껍질","roots":"뿌리","hooks":"갈고리","parachutes":"낙하산"},"r":{"a":"[A] fur, [B] bodies","ev":"11~12번 문장","w":"11번에서 우엉 씨앗의 갈고리가 attach to animal fur(동물 털에 붙는다), 12번에서 씨앗이 pass through their bodies(동물의 몸을 통과한다)라고 함. shells는 물로 이동하는 씨앗, parachutes는 민들레 씨앗 이야기.","c":null,"s":[[11,"Burdock seeds have small hooks that attach to animal fur and later fall off in distant areas.","우엉 씨앗은 동물의 털에 붙는 작은 갈고리가 있어서 나중에 멀리 떨어진 곳에서 떨어져 나간다."],[12,"Apple seeds are inside the fruit, and when animals eat the fruit, the seeds pass through their bodies and are dropped in new places.","사과 씨앗은 과일 안에 있고, 동물이 그 과일을 먹으면 씨앗은 동물의 몸을 통과해 새로운 곳에 버려진다."]]},"h":"31ba1aace6"}]},{"u":3,"id":"b4-03-4","no":4,"ko":"참치는 붉고 대구는 하얀 이유는?","items":[{"n":1,"t":"tf","q":"Fish whose muscles have a lot of myoglobin have deep red flesh.","ko":"근육에 미오글로빈이 많은 물고기는 살이 짙은 붉은색이다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","w":"7번에 a high level of myoglobin, which makes their flesh a deep red color가 있음. 미오글로빈이 많으면 짙은 붉은색 살이 된다는 내용과 일치.","c":"T","s":[[7,"Because of this, their muscles contain a high level of myoglobin, which makes their flesh a deep red color.","이 때문에 그들의 근육에는 미오글로빈이 많이 들어 있고, 이것이 그들의 살을 짙은 붉은색으로 만든다."]]},"h":"cf5e503060"},{"n":2,"t":"tf","q":"Cod and flatfish have deep red flesh because they swim constantly.","ko":"대구와 넙치류는 쉬지 않고 헤엄치기 때문에 살이 짙은 붉은색이다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","w":"10~11번에서 대구와 넙치류는 살이 옅거나 하얀 물고기의 예라고 함. 쉬지 않고 헤엄치는 물고기는 참치와 고등어(6번).","c":"F","s":[[10,"As a result, their flesh looks pale or white.","그 결과, 이들의 살은 옅거나 하얗게 보인다."],[11,"Fish such as cod and flatfish are examples of this.","대구와 넙치류 같은 물고기가 이것의 예이다."]]},"h":"4a8bf59208"},{"n":3,"t":"tf","q":"Myoglobin helps muscles make energy by delivering oxygen to them.","ko":"미오글로빈은 근육에 산소를 전달해 에너지를 만드는 것을 돕는다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","w":"5번에 stores and delivers oxygen to the muscles to help them produce energy가 있음. 산소를 전달해 에너지 만들기를 돕는다는 내용과 일치.","c":"T","s":[[5,"Myoglobin stores and delivers oxygen to the muscles to help them produce energy.","미오글로빈은 산소를 저장하고 근육에 전달해 근육이 에너지를 만들도록 돕는다."]]},"h":"b0a15cda6a"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... so they need a steady supply of oxygen to their muscles.)","ko":"... 그래서 그들은 근육에 산소가 ( ) 공급되어야 한다.","opts":["꾸준한, 일정한","갑작스러운","적은","위험한"],"word":"steady","r":{"a":"1) 꾸준한, 일정한","ev":"6번 문장","w":"6번에서 참치와 고등어는 쉬지 않고 헤엄치므로 산소도 끊기지 않고 계속 공급되어야 함. steady = 꾸준한. 갑자기 오거나 적게 필요하다면 쉬지 않고 헤엄칠 수 없음.","c":1,"s":[[6,"Fish like tuna and mackerel swim constantly and travel long distances, so they need a steady supply of oxygen to their muscles.","참치와 고등어 같은 물고기는 쉬지 않고 헤엄치며 먼 거리를 이동하기 때문에, 근육에 산소가 꾸준히 공급되어야 한다."]]},"h":"4a67b31727"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Since their muscles demand far less oxygen, they contain only a small amount of myoglobin.)","ko":"이들의 근육은 산소를 훨씬 적게 ( ) 때문에, 미오글로빈이 소량만 들어 있다.","opts":["저장하다","내보내다","필요로 하다, 요구하다","거부하다"],"word":"demand","r":{"a":"3) 필요로 하다, 요구하다","ev":"9번 문장","w":"9번에서 가만히 지내는 물고기의 근육은 산소가 조금만 필요함. demand far less oxygen = 산소를 훨씬 적게 필요로 한다는 뜻. '저장하다'는 5번 stores의 뜻이라 헷갈리기 쉬움.","c":3,"s":[[9,"Since their muscles demand far less oxygen, they contain only a small amount of myoglobin.","이들의 근육은 산소를 훨씬 적게 필요로 하기 때문에, 미오글로빈이 소량만 들어 있다."]]},"h":"e89c92e389"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nBecause of this, their muscles contain a high level of myoglobin, which makes their flesh a deep red color.","ko":"밑줄 친 which가 가리키는 것은?","sko":"이 때문에 그들의 근육에는 미오글로빈이 많이 들어 있고, 이것이 그들의 살을 짙은 붉은색으로 만든다.","opts":["참치와 고등어가 헤엄치는 것","산소가 부족한 것","근육에 미오글로빈이 많이 들어 있는 것","물고기가 먼 거리를 이동하는 것"],"r":{"a":"3) 근육에 미오글로빈이 많이 들어 있는 것","ev":"7번 문장","w":"which 앞의 their muscles contain a high level of myoglobin 전체를 받음. 미오글로빈이 많은 것이 살을 짙은 붉은색으로 만든다는 내용.","c":3,"s":[[7,"Because of this, their muscles contain a high level of myoglobin, which makes their flesh a deep red color.","이 때문에 그들의 근육에는 미오글로빈이 많이 들어 있고, 이것이 그들의 살을 짙은 붉은색으로 만든다."]]},"h":"042b062418"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In contrast, many fish remain still for most of the day and move only when they must escape danger or catch prey.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"반면에, 많은 물고기는 하루 대부분 가만히 있다가 위험을 피하거나 먹이를 잡아야 할 때만 움직인다.","opts":["많은 물고기는 하루 종일 쉬지 않고 먹이를 찾아 헤엄친다.","많은 물고기는 위험할 때는 가만히 있고 평소에는 계속 움직인다.","많은 물고기는 먹이를 잡은 뒤에만 가만히 쉰다.","많은 물고기는 거의 하루 종일 가만히 있고, 도망치거나 먹이를 잡을 때만 움직인다."],"r":{"a":"4) 많은 물고기는 거의 하루 종일 가만히 있고, 도망치거나 먹이를 잡을 때만 움직인다.","ev":"8번 문장","w":"In contrast는 앞의 쉬지 않고 헤엄치는 물고기와 반대라는 신호. remain still for most of the day = 하루 대부분 가만히 있음, only when ~ = ~할 때만 움직임. 쉬지 않고 헤엄친다는 선지는 반대.","c":4,"s":[[8,"In contrast, many fish remain still for most of the day and move only when they must escape danger or catch prey.","반면에, 많은 물고기는 하루 대부분 가만히 있다가 위험을 피하거나 먹이를 잡아야 할 때만 움직인다."]]},"h":"d7aa58a9cc"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["미오글로빈이 적은 물고기는 살이 짙은 붉은색이다.","미오글로빈은 근육이 에너지를 만드는 데 필요한 산소를 얻도록 돕는다.","참치와 고등어는 하루 대부분 가만히 있다.","대구와 넙치류는 쉬지 않고 먼 거리를 헤엄친다."],"opts":["Fish with little myoglobin have deep red flesh.","Myoglobin helps muscles get the oxygen they need to make energy.","Tuna and mackerel stay still for most of the day.","Cod and flatfish swim long distances without rest."],"r":{"a":"2) Myoglobin helps muscles get the oxygen they need to make energy.","ev":"5번, 6~7번, 9~11번 문장","w":"5번에서 미오글로빈이 근육에 산소를 전달해 에너지를 만들도록 돕는다고 함. 나머지는 틀림: 미오글로빈이 적으면 살이 옅음(9~10번), 참치·고등어는 쉬지 않고 헤엄침(6번), 대구·넙치류는 살이 옅은 쪽(10~11번).","c":2,"s":[[5,"Myoglobin stores and delivers oxygen to the muscles to help them produce energy.","미오글로빈은 산소를 저장하고 근육에 전달해 근육이 에너지를 만들도록 돕는다."],[6,"Fish like tuna and mackerel swim constantly and travel long distances, so they need a steady supply of oxygen to their muscles.","참치와 고등어 같은 물고기는 쉬지 않고 헤엄치며 먼 거리를 이동하기 때문에, 근육에 산소가 꾸준히 공급되어야 한다."],[7,"Because of this, their muscles contain a high level of myoglobin, which makes their flesh a deep red color.","이 때문에 그들의 근육에는 미오글로빈이 많이 들어 있고, 이것이 그들의 살을 짙은 붉은색으로 만든다."],[9,"Since their muscles demand far less oxygen, they contain only a small amount of myoglobin.","이들의 근육은 산소를 훨씬 적게 필요로 하기 때문에, 미오글로빈이 소량만 들어 있다."],[10,"As a result, their flesh looks pale or white.","그 결과, 이들의 살은 옅거나 하얗게 보인다."],[11,"Fish such as cod and flatfish are examples of this.","대구와 넙치류 같은 물고기가 이것의 예이다."]]},"h":"6b14486921"},{"n":9,"t":"sum","q":"Fish that swim constantly need a steady (A) of oxygen, so their muscles contain a lot of (B), which gives them deep red flesh.","ko":"쉬지 않고 헤엄치는 물고기는 산소의 꾸준한 (A)이 필요하므로, 근육에 (B)이 많이 들어 있어 살이 짙은 붉은색이다.","oko":["(A) 부족 / (B) 미오글로빈","(A) 공급 / (B) 지방","(A) 공급 / (B) 미오글로빈","(A) 부족 / (B) 지방","(A) 양 / (B) 위험"],"opts":["(A) shortage / (B) myoglobin","(A) supply / (B) fat","(A) supply / (B) myoglobin","(A) shortage / (B) fat","(A) amount / (B) danger"],"r":{"a":"3) (A) supply / (B) myoglobin","ev":"6~7번 문장","w":"6번 steady supply of oxygen(산소의 꾸준한 공급), 7번 a high level of myoglobin(많은 미오글로빈)이 그대로 나옴. shortage(부족)나 fat(지방)은 본문에 없는 내용.","c":3,"s":[[6,"Fish like tuna and mackerel swim constantly and travel long distances, so they need a steady supply of oxygen to their muscles.","참치와 고등어 같은 물고기는 쉬지 않고 헤엄치며 먼 거리를 이동하기 때문에, 근육에 산소가 꾸준히 공급되어야 한다."],[7,"Because of this, their muscles contain a high level of myoglobin, which makes their flesh a deep red color.","이 때문에 그들의 근육에는 미오글로빈이 많이 들어 있고, 이것이 그들의 살을 짙은 붉은색으로 만든다."]]},"h":"ccd2f5083c"},{"n":10,"t":"fill","q":"Because their muscles demand far less [A], fish that remain still have only a small amount of [B], so their flesh looks pale.","ko":"근육이 [A]을 훨씬 적게 필요로 하므로, 가만히 지내는 물고기는 [B]이 소량만 있어서 살이 옅어 보인다.","bank":["oxygen","myoglobin","prey","danger","tuna","distance"],"bko":{"oxygen":"산소","myoglobin":"미오글로빈","prey":"먹이","danger":"위험","tuna":"참치","distance":"거리"},"r":{"a":"[A] oxygen, [B] myoglobin","ev":"9~10번 문장","w":"9번에서 근육이 oxygen을 훨씬 적게 필요로 하므로 myoglobin이 소량만 있고, 10번에서 그 결과 살이 옅거나 하얗게 보인다고 함. prey와 danger는 8번 문장에서 움직이는 이유로만 나온 말이고, tuna는 붉은 살 물고기.","c":null,"s":[[9,"Since their muscles demand far less oxygen, they contain only a small amount of myoglobin.","이들의 근육은 산소를 훨씬 적게 필요로 하기 때문에, 미오글로빈이 소량만 들어 있다."],[10,"As a result, their flesh looks pale or white.","그 결과, 이들의 살은 옅거나 하얗게 보인다."]]},"h":"a9bc05e495"}]},{"u":4,"id":"b4-04-1","no":1,"ko":"아마존 정글에서 찾은 플라스틱을 먹는 곰팡이","items":[{"n":1,"t":"tf","q":"In 2011, a group of Yale University students joined a research trip to the Amazon rainforest.","ko":"2011년, 예일대 학생들이 아마존 열대우림으로 가는 연구 여행에 참여했다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","w":"1번 문장에 In 2011, a group of Yale University students joined a research trip to the Amazon rainforest가 그대로 있음.","c":"T","s":[[1,"In 2011, a group of Yale University students joined a research trip to the Amazon rainforest.","2011년, 예일대 학생들이 아마존 열대우림으로 연구 여행을 떠났다."]]},"h":"f9798bd13e"},{"n":2,"t":"tf","q":"The students tested the microbes in the Amazon rainforest.","ko":"학생들은 아마존 열대우림에서 미생물을 시험했다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","w":"4번에서 Back at their university lab(대학 실험실로 돌아와서) 미생물을 키우고 시험했다고 함. 아마존에서 시험했다는 말은 본문과 다름.","c":"F","s":[[4,"Back at their university lab, the students grew the microbes and tested how they acted with different materials.","대학 실험실로 돌아온 학생들은 미생물을 키우며 여러 물질과 어떻게 반응하는지 시험했다."]]},"h":"70aaab052c"},{"n":3,"t":"tf","q":"The fungus released special chemicals that cut plastic into smaller pieces.","ko":"그 곰팡이는 플라스틱을 더 작은 조각으로 자르는 특별한 화학 물질을 내보냈다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","w":"7번에 released special chemicals that cut the plastic into smaller pieces가 있음. 본문과 일치.","c":"T","s":[[7,"The fungus released special chemicals that cut the plastic into smaller pieces.","그 곰팡이는 플라스틱을 더 작은 조각으로 자르는 특별한 화학 물질을 내보냈다."]]},"h":"44f992bdda"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then it absorbed those pieces and used them as energy, almost like food.)","ko":"그런 다음 그것은 그 조각들을 ( ) 거의 음식처럼 에너지로 사용했다.","opts":["버리다","흡수하다","자르다","키우다"],"word":"absorbed","r":{"a":"2) 흡수하다","ev":"8번 문장","w":"8번에서 곰팡이가 조각을 받아들여 에너지로 썼다고 함. absorb(absorbed의 기본형) = 흡수하다. '자르다'는 7번의 cut이라 헷갈리기 쉬움.","c":2,"s":[[8,"Then it absorbed those pieces and used them as energy, almost like food.","그런 다음 그것은 그 조각들을 흡수해서 거의 음식처럼 에너지로 사용했다."]]},"h":"e9dcf481fe"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (This discovery is very important because polyurethane hardly breaks down...)","ko":"이 발견은 매우 중요한데, 폴리우레탄은 ( ) 분해되지 않기 때문이다.","opts":["열심히","아주 쉽게","빠르게","거의 ~않다"],"word":"hardly","r":{"a":"4) 거의 ~않다","ev":"9번 문장","w":"9번에서 폴리우레탄은 매립지에 아주 오래 남는다고 했으니 잘 분해되지 않는다는 뜻. hardly = 거의 ~않다. hard(열심히, 단단한)와 모양이 비슷해서 헷갈리기 쉬움.","c":4,"s":[[9,"This discovery is very important because polyurethane hardly breaks down and stays in landfills for a very long time.","이 발견은 매우 중요한데, 폴리우레탄은 거의 분해되지 않아서 매우 오랫동안 쓰레기 매립지에 남아 있기 때문이다."]]},"h":"3f0c81522e"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nThen it absorbed those pieces and used them as energy, almost like food.","ko":"밑줄 친 them이 가리키는 것은?","sko":"그런 다음 그것은 그 조각들을 흡수해서 거의 음식처럼 에너지로 사용했다.","opts":["플라스틱이 잘려 생긴 작은 조각들","곰팡이가 내보낸 특별한 화학 물질들","시료를 채집한 학생들","폴리우레탄 매립지들"],"r":{"a":"1) 플라스틱이 잘려 생긴 작은 조각들","ev":"7~8번 문장","w":"8번의 used them as energy에서 them은 바로 앞 those pieces. 7번에서 화학 물질이 플라스틱을 잘라 만든 작은 조각들. 화학 물질은 플라스틱을 자른 도구일 뿐 에너지로 쓰인 것이 아님.","c":1,"s":[[7,"The fungus released special chemicals that cut the plastic into smaller pieces.","그 곰팡이는 플라스틱을 더 작은 조각으로 자르는 특별한 화학 물질을 내보냈다."],[8,"Then it absorbed those pieces and used them as energy, almost like food.","그런 다음 그것은 그 조각들을 흡수해서 거의 음식처럼 에너지로 사용했다."]]},"h":"5bfecb6536"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"One day, these tiny life forms may help fight plastic pollution.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"언젠가 이 작은 생명체들이 플라스틱 오염과 싸우는 데 도움이 될지도 모른다.","opts":["언젠가 이 작은 생명체들이 플라스틱 오염을 줄이는 데 도움이 될 수도 있다.","이 작은 생명체들이 이미 플라스틱 오염을 모두 없앴다.","이 작은 생명체들이 플라스틱 오염을 일으켰다.","이 작은 생명체들은 플라스틱 오염과 싸우는 데 도움이 될 수 없다."],"r":{"a":"1) 언젠가 이 작은 생명체들이 플라스틱 오염을 줄이는 데 도움이 될 수도 있다.","ev":"11번 문장","w":"One day는 앞으로의 어느 날, may help는 도움이 될지도 모른다는 가능성. 이미 없앴다는 말은 없고, 오염을 일으켰다거나 도움이 될 수 없다는 말은 반대.","c":1,"s":[[11,"One day, these tiny life forms may help fight plastic pollution.","언젠가 이 작은 생명체들이 플라스틱 오염과 싸우는 데 도움이 될지도 모른다."]]},"h":"6dbfdd6e5b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["학생들은 대학 근처 쓰레기 매립지에서 그 곰팡이를 발견했다.","그 곰팡이는 플라스틱을 더 잘 깨지지 않게 만드는 화학 물질을 내보냈다.","그 곰팡이는 잘린 플라스틱 조각을 에너지로 사용했다.","과학자들은 이미 그 곰팡이로 모든 매립지를 깨끗하게 했다."],"opts":["Students found the fungus in a landfill near their university.","The fungus released chemicals that made plastic harder to break.","The fungus used the broken pieces of plastic as energy.","Scientists have already used the fungus to clean all landfills."],"r":{"a":"3) The fungus used the broken pieces of plastic as energy.","ev":"6~8번, 10번 문장","w":"8번에서 곰팡이가 잘린 조각을 흡수해 에너지로 썼다고 함. 나머지는 틀림: 곰팡이는 한 시료에서 발견(6번), 화학 물질은 플라스틱을 작게 자름(7번), 과학자들은 아직 더 연구하는 중(10번).","c":3,"s":[[6,"One sample contained a fungus that could break down polyurethane, a very common kind of plastic.","한 시료에는 매우 흔한 플라스틱의 한 종류인 폴리우레탄을 분해할 수 있는 곰팡이가 들어 있었다."],[7,"The fungus released special chemicals that cut the plastic into smaller pieces.","그 곰팡이는 플라스틱을 더 작은 조각으로 자르는 특별한 화학 물질을 내보냈다."],[8,"Then it absorbed those pieces and used them as energy, almost like food.","그런 다음 그것은 그 조각들을 흡수해서 거의 음식처럼 에너지로 사용했다."],[10,"Today, scientists are discovering more plastic-eating fungi and studying how their abilities can be used in real life.","오늘날 과학자들은 플라스틱을 먹는 곰팡이를 더 많이 발견하고 있으며, 그 능력을 실생활에 어떻게 쓸 수 있을지 연구하고 있다."]]},"h":"c51d2327d4"},{"n":9,"t":"sum","q":"Polyurethane (A) breaks down, so it stays in (B) for a very long time.","ko":"폴리우레탄은 (A) 분해되어서, (B)에 아주 오랫동안 남아 있다.","oko":["(A) 거의 ~않게 / (B) 매립지","(A) 쉽게 / (B) 매립지","(A) 거의 ~않게 / (B) 실험실","(A) 쉽게 / (B) 아마존","(A) 빠르게 / (B) 숲"],"opts":["(A) hardly / (B) landfills","(A) easily / (B) landfills","(A) hardly / (B) laboratories","(A) easily / (B) the Amazon","(A) quickly / (B) forests"],"r":{"a":"1) (A) hardly / (B) landfills","ev":"9번 문장","w":"9번에 polyurethane hardly breaks down and stays in landfills for a very long time이 그대로 나옴. easily나 quickly는 반대 뜻이고, laboratories와 the Amazon은 다른 장소.","c":1,"s":[[9,"This discovery is very important because polyurethane hardly breaks down and stays in landfills for a very long time.","이 발견은 매우 중요한데, 폴리우레탄은 거의 분해되지 않아서 매우 오랫동안 쓰레기 매립지에 남아 있기 때문이다."]]},"h":"fc06d7998b"},{"n":10,"t":"fill","q":"The students chose the Amazon because its warm and wet [A] supports many [B] that scientists have never studied.","ko":"학생들이 아마존을 고른 이유는 따뜻하고 습한 [A]가 과학자들이 한 번도 연구하지 못한 많은 [B]를 살게 하기 때문이다.","bank":["climate","microbes","fungus","plastic","energy","lab"],"bko":{"climate":"기후","microbes":"미생물","fungus":"곰팡이","plastic":"플라스틱","energy":"에너지","lab":"실험실"},"r":{"a":"[A] climate, [B] microbes","ev":"2~3번 문장","w":"3번에 warm and wet climate supports many microbes that scientists have never studied before가 있음. 2번에서 학생들이 모으려던 것도 microbes. fungus는 6번에서 발견된 곰팡이고 plastic, energy, lab은 이 문장의 내용과 관계없음.","c":null,"s":[[2,"They wanted to collect microbes living inside plants and see what special abilities they might have.","그들은 식물 속에 사는 미생물을 채집해서 그것들이 어떤 특별한 능력을 가졌을지 알아보고 싶었다."],[3,"They chose the Amazon because its warm and wet climate supports many microbes that scientists have never studied before.","그들이 아마존을 고른 이유는, 따뜻하고 습한 기후가 과학자들이 한 번도 연구하지 못한 많은 미생물을 살게 하기 때문이었다."]]},"h":"cf6c5bb0b9"}]},{"u":4,"id":"b4-04-2","no":2,"ko":"밤하늘 별은 어디로 사라졌을까?","items":[{"n":1,"t":"tf","q":"The faint glow over buildings at night comes from light pollution.","ko":"밤에 건물 위에 퍼진 희미한 빛무리는 빛 공해에서 나온다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","w":"2번에 This glow comes from light pollution이 그대로 나옴. 본문과 일치.","c":"T","s":[[2,"This glow comes from light pollution.","이 빛무리는 빛 공해에서 나온다."]]},"h":"2094c0d2e9"},{"n":2,"t":"tf","q":"Baby sea turtles follow city lights to find the ocean after hatching.","ko":"아기 바다거북은 부화한 뒤 바다를 찾기 위해 도시의 불빛을 따라간다.","r":{"a":"F (본문과 다른 내용)","ev":"8번 문장","w":"8번에서 아기 바다거북이 따라가는 것은 달빛(the moonlight). 도시의 불빛은 이들을 엉뚱한 방향으로 끌어당기는 방해물.","c":"F","s":[[8,"Likewise, baby sea turtles, which follow the moonlight to the ocean after hatching, are often pulled in the wrong direction by bright city lights.","마찬가지로, 부화한 뒤 달빛을 따라 바다로 가는 아기 바다거북은 밝은 도시의 불빛 때문에 엉뚱한 방향으로 이끌리는 경우가 많다."]]},"h":"e710b8d22b"},{"n":3,"t":"tf","q":"Too much light at night can cause sleep problems.","ko":"밤에 빛이 너무 많으면 수면 문제를 일으킬 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","w":"10번에 Too much light at night confuses our body clocks, which can cause sleep problems가 있음. 본문과 일치.","c":"T","s":[[10,"Too much light at night confuses our body clocks, which can cause sleep problems and increase the risk of heart disease.","밤에 빛이 너무 많으면 우리의 생체 시계가 혼란스러워져, 수면 문제를 일으키고 심장병의 위험을 높일 수 있다."]]},"h":"f8b35e1141"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Have you seen a faint glow spreading over buildings at night?)","ko":"밤에 건물 위로 퍼져 있는 ( ) 빛무리를 본 적이 있나요?","opts":["희미한","눈부신","거대한","따뜻한"],"word":"faint","r":{"a":"1) 희미한","ev":"1번 문장","w":"1번의 glow는 밤하늘에 은은하게 퍼진 빛무리. 별이 가려질 정도로 퍼지긴 해도(4번) 눈부신 불빛이 아니라 은은한 빛이므로 faint = 희미한.","c":1,"s":[[1,"Have you seen a faint glow spreading over buildings at night?","밤에 건물 위로 퍼져 있는 희미한 빛무리를 본 적이 있나요?"]]},"h":"4bf4862b17"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Too much light at night confuses our body clocks...)","ko":"밤에 빛이 너무 많으면 우리의 생체 시계가 ( ).","opts":["안정시키다","깨우다","혼란스럽게 하다","강하게 하다"],"word":"confuses","r":{"a":"3) 혼란스럽게 하다","ev":"10번 문장","w":"10번에서 밤에 빛이 많으면 몸의 시계가 제대로 맞지 않아 수면 문제까지 생김. confuse(confuses의 기본형) = 혼란스럽게 하다. 안정시킨다면 수면 문제가 생길 리 없음.","c":3,"s":[[10,"Too much light at night confuses our body clocks, which can cause sleep problems and increase the risk of heart disease.","밤에 빛이 너무 많으면 우리의 생체 시계가 혼란스러워져, 수면 문제를 일으키고 심장병의 위험을 높일 수 있다."]]},"h":"ced4f46fc9"},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nLikewise, baby sea turtles, which follow the moonlight to the ocean after hatching, are often pulled in the wrong direction by bright city lights.","ko":"밑줄 친 which가 가리키는 것은?","sko":"마찬가지로, 부화한 뒤 달빛을 따라 바다로 가는 아기 바다거북은 밝은 도시의 불빛 때문에 엉뚱한 방향으로 이끌리는 경우가 많다.","opts":["달빛","아기 바다거북","바다","도시의 불빛"],"r":{"a":"2) 아기 바다거북","ev":"8번 문장","w":"which 바로 앞의 baby sea turtles가 달빛을 따라 바다로 가는 주인공. 달빛(moonlight)은 따라가는 대상이지 따라가는 주체가 아님.","c":2,"s":[[8,"Likewise, baby sea turtles, which follow the moonlight to the ocean after hatching, are often pulled in the wrong direction by bright city lights.","마찬가지로, 부화한 뒤 달빛을 따라 바다로 가는 아기 바다거북은 밝은 도시의 불빛 때문에 엉뚱한 방향으로 이끌리는 경우가 많다."]]},"h":"0059ace150"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"We can use lights that shine downward and use timers or sensors to turn them off when not needed.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우리는 아래쪽으로 비추는 조명을 사용하고, 필요하지 않을 때는 타이머나 센서로 조명을 끌 수 있다.","opts":["위쪽을 비추는 조명을 늘리고 밤새 켜 둘 수 있다.","조명을 모두 없애고 타이머만 설치해야 한다.","조명은 항상 켜 두고 센서로 밝기만 높일 수 있다.","아래쪽을 비추는 조명을 쓰고, 필요 없을 때는 타이머나 센서로 끌 수 있다."],"r":{"a":"4) 아래쪽을 비추는 조명을 쓰고, 필요 없을 때는 타이머나 센서로 끌 수 있다.","ev":"12번 문장","w":"shine downward = 아래쪽으로 비추다, turn them off when not needed = 필요하지 않을 때 끄다. 위쪽을 비추거나 밤새 켜 두는 것은 3번의 원인과 같은 방식이라 오히려 문제를 키움.","c":4,"s":[[12,"We can use lights that shine downward and use timers or sensors to turn them off when not needed.","우리는 아래쪽으로 비추는 조명을 사용하고, 필요하지 않을 때는 타이머나 센서로 조명을 끌 수 있다."]]},"h":"79cca2d742"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["아기 바다거북은 밝은 도시의 불빛 때문에 엉뚱한 방향으로 이끌릴 수 있다.","빛 공해는 별을 더 잘 보이게 한다.","사람은 몸이 쉬는 데 어둠이 필요하지 않다.","별로 길을 찾는 새들은 빛 공해의 도움을 받는다."],"opts":["Baby sea turtles can be pulled in the wrong direction by bright city lights.","Light pollution makes stars easier to see.","Humans do not need darkness to rest their bodies.","Birds that use stars for navigation are helped by light pollution."],"r":{"a":"1) Baby sea turtles can be pulled in the wrong direction by bright city lights.","ev":"4번, 7~9번 문장","w":"8번에서 아기 바다거북이 도시 불빛에 엉뚱한 방향으로 이끌린다고 함. 나머지는 틀림: 별이 가려져 잘 안 보임(4번), 새는 길을 잃을 수 있음(7번), 사람도 쉬려면 어둠이 중요함(9번).","c":1,"s":[[4,"Because of this, it hides the stars and makes them difficult to see.","이 때문에 별이 가려져서 잘 보이지 않게 된다."],[7,"Some birds that use stars for navigation can get lost.","별을 길잡이로 삼는 일부 새들은 길을 잃을 수 있다."],[8,"Likewise, baby sea turtles, which follow the moonlight to the ocean after hatching, are often pulled in the wrong direction by bright city lights.","마찬가지로, 부화한 뒤 달빛을 따라 바다로 가는 아기 바다거북은 밝은 도시의 불빛 때문에 엉뚱한 방향으로 이끌리는 경우가 많다."],[9,"For humans, darkness is important for our bodies to rest.","사람의 경우, 어둠은 우리 몸이 쉬는 데 중요하다."]]},"h":"bb431b6856"},{"n":9,"t":"sum","q":"Artificial light that shines (A) spreads through the air and (B) the stars, making them difficult to see.","ko":"(A) 비추는 인공 불빛이 공기 중에 퍼져 별을 (B), 별을 보기 어렵게 만든다.","oko":["(A) 아래쪽으로 / (B) 가린다","(A) 위쪽으로 / (B) 보여 준다","(A) 아래쪽으로 / (B) 보여 준다","(A) 옆쪽으로 / (B) 부순다","(A) 위쪽으로 / (B) 가린다"],"opts":["(A) downward / (B) hides","(A) upward / (B) shows","(A) downward / (B) shows","(A) sideways / (B) breaks","(A) upward / (B) hides"],"r":{"a":"5) (A) upward / (B) hides","ev":"3~4번 문장","w":"3번에 shines upward and spreads through the air, 4번에 it hides the stars and makes them difficult to see가 있음. downward(아래쪽)는 12번에서 해결책으로 나오는 방향이고, shows(보여 준다)는 4번과 반대.","c":5,"s":[[3,"It happens when artificial light from streetlights, buildings, and signs shines upward and spreads through the air.","그것은 가로등, 건물, 간판에서 나온 인공 불빛이 위쪽으로 비추며 공기 중에 퍼질 때 생긴다."],[4,"Because of this, it hides the stars and makes them difficult to see.","이 때문에 별이 가려져서 잘 보이지 않게 된다."]]},"h":"484d62f568"},{"n":10,"t":"fill","q":"The good news is that we can [A] this problem, and small changes can help bring back [B] and healthier nights.","ko":"좋은 소식은 우리가 이 문제를 [A]할 수 있다는 것이고, 작은 변화가 [B]과 더 건강한 밤을 되찾는 데 도움이 될 수 있다.","bank":["reduce","stars","sensors","downward","timers","heart"],"bko":{"reduce":"줄이다","stars":"별","sensors":"센서","downward":"아래쪽으로","timers":"타이머","heart":"심장"},"r":{"a":"[A] reduce, [B] stars","ev":"11번, 13번 문장","w":"11번에 we can reduce this problem, 13번에 bring back stars and healthier nights가 있음. sensors(센서)와 timers(타이머)는 12번에서 조명을 끄는 도구로만 나오고, downward(아래쪽으로)와 heart(심장)는 이 빈칸에 들어가면 뜻이 맞지 않음.","c":null,"s":[[11,"The good news is that we can reduce this problem.","좋은 소식은 이 문제를 줄일 수 있다는 것이다."],[13,"These small changes can help bring back stars and healthier nights.","이런 작은 변화들이 별과 더 건강한 밤을 되찾는 데 도움이 될 수 있다."]]},"h":"243bb659c8"}]},{"u":4,"id":"b4-04-3","no":3,"ko":"약을 싱크대에 버리면 어떤 일이 생길까?","items":[{"n":1,"t":"tf","q":"Many people throw away unused medicine in the trash or wash it down the sink.","ko":"많은 사람들이 쓰지 않는 약을 쓰레기통에 버리거나 싱크대에 흘려보낸다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","w":"1번 문장에 throw away unused or expired medicine in the trash or wash it down the sink가 있음. 본문과 일치.","c":"T","s":[[1,"Many people throw away unused or expired medicine in the trash or wash it down the sink.","많은 사람들이 쓰지 않거나 유통기한이 지난 약을 쓰레기통에 버리거나 싱크대에 흘려보낸다."]]},"h":"b5bd27b9da"},{"n":2,"t":"tf","q":"Hormone medicines can turn female fish into male fish.","ko":"호르몬제는 암컷 물고기를 수컷 물고기로 바꿀 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","w":"5번에서 호르몬제가 바꾸는 방향은 수컷(male)에서 암컷(female). 암컷을 수컷으로 바꾼다는 말은 방향이 반대.","c":"F","s":[[5,"They can even turn male fish into female fish.","심지어 수컷 물고기를 암컷 물고기로 바꿔 놓을 수도 있다."]]},"h":"4f66bf6afc"},{"n":3,"t":"tf","q":"Bacteria that resist drugs can spread through water, soil, or animals.","ko":"약에 내성이 생긴 세균은 물, 토양, 또는 동물을 통해 퍼질 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10~11번 문장","w":"10번에서 세균이 항생제에 내성을 키우고, 11번에서 이 세균들이 물, 토양, 동물을 통해 퍼질 수 있다고 함.","c":"T","s":[[10,"Over time, they develop resistance to antibiotics and become harder to kill.","시간이 지나면서 그들은 항생제에 대한 내성을 키우고 죽이기가 더 어려워진다."],[11,"These bacteria can spread through water, soil, or animals and reach people.","이 세균들은 물, 토양, 또는 동물을 통해 퍼져 사람에게까지 닿을 수 있다."]]},"h":"f31077fd58"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (For example, hormone medicines can damage aquatic ecosystems.)","ko":"예를 들어, 호르몬제는 ( ) 생태계를 손상시킬 수 있다.","opts":["땅 위의","물속의, 수중의","공중의","지하의"],"word":"aquatic","r":{"a":"2) 물속의, 수중의","ev":"4~5번 문장","w":"5번에서 물고기 이야기가 이어지므로 aquatic ecosystems = 물속 생태계. 땅 위나 공중, 지하의 생태계라면 물고기 이야기가 이어질 수 없음.","c":2,"s":[[4,"For example, hormone medicines can damage aquatic ecosystems.","예를 들어, 호르몬제는 수중 생태계를 손상시킬 수 있다."],[5,"They can even turn male fish into female fish.","심지어 수컷 물고기를 암컷 물고기로 바꿔 놓을 수도 있다."]]},"h":"a5609fe47d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... we must use pharmacy return boxes or local take-back programs to dispose of medicine safely.)","ko":"... 우리는 약국 반납함이나 지역 회수 프로그램을 이용해 약을 안전하게 ( ) 한다.","opts":["사용하다","팔다","모으다","버리다, 처리하다"],"word":"dispose of","r":{"a":"4) 버리다, 처리하다","ev":"13번 문장","w":"13번은 앞에서 약을 잘못 버려 생긴 문제들을 막기 위한 방법이므로, 반납함과 회수 프로그램으로 약을 올바르게 버린다는 뜻. dispose of = 버리다, 처리하다.","c":4,"s":[[13,"To prevent these problems, we must use pharmacy return boxes or local take-back programs to dispose of medicine safely.","이런 문제를 막기 위해, 우리는 약국 반납함이나 지역 회수 프로그램을 이용해 약을 안전하게 폐기해야 한다."]]},"h":"c0f43661cc"},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nWhen these drugs enter the environment, bacteria in water and soil are exposed to them over long periods of time.","ko":"밑줄 친 them이 가리키는 것은?","sko":"이런 약물이 환경에 들어가면, 물과 토양 속 세균은 오랜 기간 동안 그것에 노출된다.","opts":["물과 토양","세균들","이런 약물들","오랜 기간"],"r":{"a":"3) 이런 약물들","ev":"8번 문장","w":"are exposed to them에서 세균이 노출되는 대상은 문장 앞쪽의 these drugs. 세균(bacteria)은 노출되는 주체이지 노출되는 대상이 아님.","c":3,"s":[[8,"When these drugs enter the environment, bacteria in water and soil are exposed to them over long periods of time.","이런 약물이 환경에 들어가면, 물과 토양 속 세균은 오랜 기간 동안 그것에 노출된다."]]},"h":"ea47485054"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Because the chemicals are too weak to kill the bacteria, some survive.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 화학 물질이 세균을 죽이기에는 너무 약해서, 일부 세균은 살아남는다.","opts":["약 성분이 너무 약해서 세균을 다 죽이지 못해 일부 세균이 살아남는다.","약 성분이 너무 강해서 세균이 모두 죽는다.","세균이 너무 약해서 약 성분에 쉽게 죽는다.","일부 세균이 약 성분을 먹고 더 커진다."],"r":{"a":"1) 약 성분이 너무 약해서 세균을 다 죽이지 못해 일부 세균이 살아남는다.","ev":"9번 문장","w":"too weak to kill = 죽이기에는 너무 약하다. 약이 약하니 세균이 다 죽지 않고 일부가 살아남음. 강해서 모두 죽는다는 선지는 정반대.","c":1,"s":[[9,"Because the chemicals are too weak to kill the bacteria, some survive.","그 화학 물질이 세균을 죽이기에는 너무 약해서, 일부 세균은 살아남는다."]]},"h":"76dd24a722"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["일반적인 정화 시설은 강한 약 성분을 쉽게 제거할 수 있다.","약한 약물에서 살아남은 세균은 죽이기가 더 어려워질 수 있다.","호르몬제는 암컷 물고기를 수컷 물고기로 바꾼다.","항생제는 감염을 치료하기 더 쉽게 만든다."],"opts":["Normal cleaning systems can easily remove strong drug chemicals.","Bacteria that survive weak drugs can become harder to kill.","Hormone medicines turn female fish into male fish.","Antibiotics make infections easier to treat."],"r":{"a":"2) Bacteria that survive weak drugs can become harder to kill.","ev":"2번, 5번, 9~10번, 12번 문장","w":"9~10번에서 살아남은 세균이 시간이 지나 내성을 키워 죽이기 더 어려워진다고 함. 나머지는 틀림: 정화 시설은 제거 못 함(2번), 수컷이 암컷으로 바뀜(5번), 감염은 치료하기 더 어려워짐(12번).","c":2,"s":[[2,"If these strong drug chemicals leak into the soil or water, normal cleaning systems cannot remove them.","이런 강한 약 성분이 토양이나 물로 새어 들어가면, 일반적인 정화 시설로는 그것을 제거할 수 없다."],[5,"They can even turn male fish into female fish.","심지어 수컷 물고기를 암컷 물고기로 바꿔 놓을 수도 있다."],[9,"Because the chemicals are too weak to kill the bacteria, some survive.","그 화학 물질이 세균을 죽이기에는 너무 약해서, 일부 세균은 살아남는다."],[10,"Over time, they develop resistance to antibiotics and become harder to kill.","시간이 지나면서 그들은 항생제에 대한 내성을 키우고 죽이기가 더 어려워진다."],[12,"When they cause infections, the sickness becomes harder to treat.","그것들이 감염을 일으키면, 병은 치료하기가 더 어려워진다."]]},"h":"0f20708bdf"},{"n":9,"t":"sum","q":"Because the chemicals are too (A) to kill all the bacteria, some survive and develop (B) to antibiotics.","ko":"그 화학 물질이 세균을 모두 죽이기에는 너무 (A)해서, 일부 세균이 살아남아 항생제에 대한 (B)을 키운다.","oko":["(A) 강한 / (B) 내성","(A) 약한 / (B) 민감성","(A) 약한 / (B) 내성","(A) 강한 / (B) 약점","(A) 값싼 / (B) 감염"],"opts":["(A) strong / (B) resistance","(A) weak / (B) sensitivity","(A) weak / (B) resistance","(A) strong / (B) weakness","(A) cheap / (B) infection"],"r":{"a":"3) (A) weak / (B) resistance","ev":"9~10번 문장","w":"9번의 too weak to kill the bacteria와 10번의 develop resistance to antibiotics가 그대로 나옴. strong이면 세균이 다 죽으므로 맞지 않고, sensitivity(민감성)는 내성과 반대.","c":3,"s":[[9,"Because the chemicals are too weak to kill the bacteria, some survive.","그 화학 물질이 세균을 죽이기에는 너무 약해서, 일부 세균은 살아남는다."],[10,"Over time, they develop resistance to antibiotics and become harder to kill.","시간이 지나면서 그들은 항생제에 대한 내성을 키우고 죽이기가 더 어려워진다."]]},"h":"6055493649"},{"n":10,"t":"fill","q":"Hormone medicines can damage [A] ecosystems, and they make it difficult for fish to [B], so the fish population can decrease.","ko":"호르몬제는 [A] 생태계를 손상시킬 수 있고, 물고기가 [B]하기 어렵게 만들어 물고기 개체 수가 줄어들 수 있다.","bank":["aquatic","reproduce","bacteria","infection","trash","sink"],"bko":{"aquatic":"물속의","reproduce":"번식하다","bacteria":"세균","infection":"감염","trash":"쓰레기통","sink":"싱크대"},"r":{"a":"[A] aquatic, [B] reproduce","ev":"4번, 6번 문장","w":"4번에 hormone medicines can damage aquatic ecosystems, 6번에 makes it difficult for fish to reproduce, and their population can decrease가 있음. bacteria(세균)와 infection(감염)은 항생제 이야기, trash(쓰레기통)와 sink(싱크대)는 약을 버리는 곳이라 이 문장의 빈칸에 맞지 않음.","c":null,"s":[[4,"For example, hormone medicines can damage aquatic ecosystems.","예를 들어, 호르몬제는 수중 생태계를 손상시킬 수 있다."],[6,"This change makes it difficult for fish to reproduce, and their population can decrease.","이 변화는 물고기가 번식하기 어렵게 만들고, 그 개체 수가 감소할 수 있다."]]},"h":"ec82a2636a"}]},{"u":4,"id":"b4-04-4","no":4,"ko":"바다가 오르내리는 힘으로 전기를 만든다고?","items":[{"n":1,"t":"tf","q":"The ocean water rises and falls in a steady rhythm and creates tides.","ko":"바닷물은 일정한 리듬으로 오르내리며 조수를 만든다.","r":{"a":"T (본문과 맞는 내용)","ev":"1번 문장","w":"1번에 The water in the ocean rises and falls in a steady rhythm, and this movement creates tides가 있음. 본문과 일치.","c":"T","s":[[1,"The water in the ocean rises and falls in a steady rhythm, and this movement creates tides.","바닷물은 일정한 리듬으로 오르내리고, 이 움직임이 조수(밀물과 썰물)를 만든다."]]},"h":"b996aa7a0a"},{"n":2,"t":"tf","q":"During low tide, water from the sea flows into the basin and spins the turbines.","ko":"썰물 때, 바다의 물이 저수지로 흘러 들어가 터빈을 돌린다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","w":"7번에서 바다 물이 저수지로 들어가 터빈을 돌리는 때는 밀물(high tide). 썰물(low tide)이 아니므로 본문과 다름.","c":"F","s":[[7,"During high tide, water from the sea flows through the dam into a basin and spins the turbines.","밀물 때, 바다의 물이 댐을 통해 저수지로 흘러 들어가며 터빈을 돌린다."]]},"h":"297ebc3f1f"},{"n":3,"t":"tf","q":"Using tides to make electricity is called tidal power.","ko":"조수를 이용해 전기를 만드는 것을 조력 발전이라고 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"3~4번 문장","w":"3번에서 자연의 움직임(조수)으로 전기를 만들 수 있다고 하고, 4번에서 이 아이디어를 tidal power라고 부른다고 함.","c":"T","s":[[3,"This natural movement can be used to generate electricity.","이 자연의 움직임은 전기를 만드는 데 쓰일 수 있다."],[4,"This idea is called tidal power.","이 아이디어를 조력 발전이라고 한다."]]},"h":"102b2df12f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (This natural movement can be used to generate electricity.)","ko":"이 자연의 움직임은 전기를 ( ) 데 쓰일 수 있다.","opts":["막다","낭비하다","만들어 내다, 생산하다","저장하다"],"word":"generate","r":{"a":"3) 만들어 내다, 생산하다","ev":"3번 문장","w":"3번에서 조수의 움직임을 이용해 전기를 얻을 수 있다는 뜻이고, 8번에서 발전기가 electricity를 produce(만들어 내다)한다고 나옴. generate = 만들어 내다. '저장하다'는 11번의 stored 쪽 뜻이라 헷갈리기 쉬움.","c":3,"s":[[3,"This natural movement can be used to generate electricity.","이 자연의 움직임은 전기를 만드는 데 쓰일 수 있다."]]},"h":"933e85fdd9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... tidal barrages can produce clean and renewable energy without burning fuel.)","ko":"... 조력 방조제는 연료를 태우지 않고도 깨끗하고 ( ) 에너지를 만들 수 있다.","opts":["재생 가능한","값비싼","위험한","한정된"],"word":"renewable","r":{"a":"1) 재생 가능한","ev":"12번 문장","w":"12번에서 조수가 매일 반복되므로 에너지를 계속 얻을 수 있다는 뜻. renewable = 다시 얻을 수 있는, 재생 가능한. '한정된'은 반대 뜻.","c":1,"s":[[12,"Because the tides repeat every day, tidal barrages can produce clean and renewable energy without burning fuel.","조수는 매일 반복되기 때문에, 조력 방조제는 연료를 태우지 않고도 깨끗하고 재생 가능한 에너지를 만들 수 있다."]]},"h":"c1110c38dc"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAs the turbines spin, they drive the generators to produce electricity.","ko":"밑줄 친 they가 가리키는 것은?","sko":"터빈이 돌아가면서, 그것들은 발전기를 움직여 전기를 만들어 낸다.","opts":["발전기들","수문들","조수들","터빈들"],"r":{"a":"4) 터빈들","ev":"8번 문장","w":"As the turbines spin 바로 뒤의 they는 돌고 있는 터빈들. 터빈들이 발전기를 움직여(drive) 전기를 만듦. generators는 움직임을 당하는 쪽.","c":4,"s":[[8,"As the turbines spin, they drive the generators to produce electricity.","터빈이 돌아가면서, 그것들은 발전기를 움직여 전기를 만들어 낸다."]]},"h":"1e57cc4dfb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"After the basin fills, the gates are closed to hold the water.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"저수지가 가득 차면, 물을 가두기 위해 수문이 닫힌다.","opts":["저수지에 물이 가득 차면, 그 물을 붙잡아 두려고 수문을 닫는다.","저수지가 비면, 물이 빠지도록 수문을 연다.","저수지가 차기 전에, 물을 내보내려고 수문을 닫는다.","수문이 닫혀야만 저수지에 물이 채워진다."],"r":{"a":"1) 저수지에 물이 가득 차면, 그 물을 붙잡아 두려고 수문을 닫는다.","ev":"9번 문장","w":"After the basin fills = 저수지가 가득 찬 뒤, to hold the water = 물을 가두려고. 다음 10번에서 썰물이 되면 수문이 다시 열림.","c":1,"s":[[9,"After the basin fills, the gates are closed to hold the water.","저수지가 가득 차면, 물을 가두기 위해 수문이 닫힌다."]]},"h":"0fc49d1fc9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["조력 방조제는 썰물 때만 전기를 만들 수 있다.","조력 방조제는 발전기를 돌리기 위해 연료를 태운다.","저수지에 저장된 물은 바다로 다시 흘러가 터빈을 또 한 번 돌린다.","조수는 한 달에 한 번만 바뀐다."],"opts":["A tidal barrage can only produce electricity at low tide.","Tidal barrages burn fuel to turn the generators.","Water stored in the basin flows back to the sea and turns the turbines again.","The tides change only once a month."],"r":{"a":"3) Water stored in the basin flows back to the sea and turns the turbines again.","ev":"7번, 11~12번 문장","w":"11번에서 저장된 물이 바다로 쏟아져 나가며 터빈을 두 번째로 돌린다고 함. 나머지는 틀림: 밀물 때도 전기가 만들어짐(7번), 연료를 태우지 않음(12번), 조수는 매일 반복됨(12번).","c":3,"s":[[7,"During high tide, water from the sea flows through the dam into a basin and spins the turbines.","밀물 때, 바다의 물이 댐을 통해 저수지로 흘러 들어가며 터빈을 돌린다."],[11,"The stored water rushes back to the sea and turns the turbines a second time, once again powering the generators.","저장된 물이 바다로 쏟아져 나가며 터빈을 두 번째로 돌리고, 다시 한번 발전기를 작동시킨다."],[12,"Because the tides repeat every day, tidal barrages can produce clean and renewable energy without burning fuel.","조수는 매일 반복되기 때문에, 조력 방조제는 연료를 태우지 않고도 깨끗하고 재생 가능한 에너지를 만들 수 있다."]]},"h":"f1bfcc58b3"},{"n":9,"t":"sum","q":"During high tide, water from the sea flows through the dam into a (A) and spins the (B), which drive the generators.","ko":"밀물 때, 바다의 물이 댐을 통해 (A)로 흘러 들어가 (B)을 돌리고, 그것이 발전기를 움직인다.","oko":["(A) 저수지 / (B) 수문","(A) 만 / (B) 조수","(A) 연료 / (B) 터빈","(A) 저수지 / (B) 터빈","(A) 수문 / (B) 연료"],"opts":["(A) basin / (B) gates","(A) bay / (B) tides","(A) fuel / (B) turbines","(A) basin / (B) turbines","(A) gate / (B) fuel"],"r":{"a":"4) (A) basin / (B) turbines","ev":"7~8번 문장","w":"7번에 flows through the dam into a basin and spins the turbines, 8번에 they(터빈들) drive the generators가 있음. 수문은 9~10번에서 물을 가두고 여는 장치이고, 연료는 12번에서 쓰지 않는다고 한 것.","c":4,"s":[[7,"During high tide, water from the sea flows through the dam into a basin and spins the turbines.","밀물 때, 바다의 물이 댐을 통해 저수지로 흘러 들어가며 터빈을 돌린다."],[8,"As the turbines spin, they drive the generators to produce electricity.","터빈이 돌아가면서, 그것들은 발전기를 움직여 전기를 만들어 낸다."]]},"h":"33b8962d3c"},{"n":10,"t":"fill","q":"Tidal barrages do not burn fuel, so their energy is [A]. The tides repeat every day, so the energy is also [B].","ko":"조력 방조제는 연료를 태우지 않으므로 그 에너지는 [A]하다. 조수는 매일 반복되므로 그 에너지는 또한 [B]하다.","bank":["clean","renewable","costly","harmful","limited","risky"],"bko":{"clean":"깨끗한","renewable":"재생 가능한","costly":"비용이 많이 드는","harmful":"해로운","limited":"한정된","risky":"위험한"},"r":{"a":"[A] clean, [B] renewable","ev":"12번 문장","w":"12번에서 연료를 태우지 않고(without burning fuel) 깨끗한(clean) 에너지, 조수가 매일 반복되므로 재생 가능한(renewable) 에너지를 만든다고 함. costly(비용이 많이 드는), harmful(해로운), limited(한정된), risky(위험한)는 본문에 나오지 않고 12번과 정반대 느낌의 말.","c":null,"s":[[12,"Because the tides repeat every day, tidal barrages can produce clean and renewable energy without burning fuel.","조수는 매일 반복되기 때문에, 조력 방조제는 연료를 태우지 않고도 깨끗하고 재생 가능한 에너지를 만들 수 있다."]]},"h":"4808f2adc4"}]},{"u":5,"id":"b4-05-1","no":1,"ko":"선물 하나 받았을 뿐인데, 서재까지 바뀐 이유?","items":[{"n":1,"t":"tf","q":"Diderot received a beautiful red robe as a gift.","ko":"디드로는 선물로 아름다운 붉은 가운을 받았다.","r":{"a":"T (본문과 맞는 내용)","s":[[4,"One day, he received a beautiful red robe as a gift.","어느 날, 그는 선물로 아름다운 붉은 가운을 받았다."]],"w":"4번 문장에 he received a beautiful red robe as a gift가 그대로 나옴. receive(받다)한 것이 선물로 받은 붉은 가운이므로 본문과 같음.","c":"T","ev":"4번 문장"},"h":"6ed061f150"},{"n":2,"t":"tf","q":"After getting the robe, Diderot replaced only his chair.","ko":"가운을 얻은 후, 디드로는 의자만 바꿨다.","r":{"a":"F (본문과 다른 내용)","s":[[6,"He started by replacing his chair, then his desk, and eventually his entire study.","그는 의자를 바꾸는 것으로 시작해서, 그다음에는 책상을, 결국에는 서재 전체를 바꿨다."]],"w":"6번에서 의자로 시작해서(started by replacing his chair), 그다음 책상, 결국 서재 전체까지 바꿨음. 의자만 바꾼 게 아니므로 F.","c":"F","ev":"6번 문장"},"h":"62bb602d3c"},{"n":3,"t":"tf","q":"A new item of higher quality can make us dissatisfied with what we already own.","ko":"품질이 더 높은 새 물건은 우리가 이미 가진 것에 불만을 느끼게 만들 수 있다.","r":{"a":"T (본문과 맞는 내용)","s":[[8,"When we bring a new item into our lives, especially one of higher quality or a different style, it can create a feeling of dissatisfaction with our existing possessions.","우리가 새로운 물건, 특히 더 품질이 높거나 스타일이 다른 물건을 생활에 들일 때, 그것은 우리가 이미 가진 소유물에 대한 불만족의 느낌을 만들어 낼 수 있다."]],"w":"8번에서 새 물건(특히 더 품질이 높은 것)이 기존 소유물에 대한 dissatisfaction(불만족)을 만들 수 있다고 함. 선지와 같은 내용.","c":"T","ev":"8번 문장"},"h":"22d012f5c2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... his other possessions suddenly seemed old and mismatched.)","ko":"... 그의 다른 소유물들이 갑자기 낡고 ( ) 보였다.","opts":["새로 산","값이 싼","서로 어울리지 않는","깨끗한"],"word":"mismatched","r":{"a":"3) 서로 어울리지 않는","s":[[5,"It was so elegant that his other possessions suddenly seemed old and mismatched.","그것은 너무 우아해서 그의 다른 소유물들이 갑자기 낡고 어울리지 않아 보였다."]],"w":"5번에서 새 가운이 너무 우아해서 다른 소유물이 old and mismatched로 보였다고 함. 새것과 짝이 안 맞는다는 뜻이라 '서로 어울리지 않는'이 답. 깨끗한이나 새로 산은 old와 반대 방향.","c":3,"ev":"5번 문장"},"h":"74f325973d"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... in an attempt to restore harmony.)","ko":"... 조화를 ( ) 시도로","opts":["깨뜨리다","되찾다","숨기다","팔다"],"word":"restore","r":{"a":"2) 되찾다","s":[[9,"This leads us to make unplanned purchases in an attempt to restore harmony.","이것은 우리가 조화를 되찾으려는 시도로 계획에 없던 구매를 하게 만든다."]],"w":"9번에서 새 물건 때문에 깨진 조화(어울림)를 다시 만들려고 계획에 없던 구매를 한다는 뜻. restore harmony = 조화를 되찾다. 깨뜨리다는 반대 뜻.","c":2,"ev":"9번 문장"},"h":"9e5f91f432"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis led him to a cycle of endless spending.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것은 그를 끝없는 소비의 순환으로 이끌었다.","opts":["프랑스에서 글을 쓰는 일","의자, 책상, 서재를 차례로 바꾼 일","선물을 준 사람을 만난 일","가운을 팔아 버린 일"],"r":{"a":"2) 의자, 책상, 서재를 차례로 바꾼 일","s":[[6,"He started by replacing his chair, then his desk, and eventually his entire study.","그는 의자를 바꾸는 것으로 시작해서, 그다음에는 책상을, 결국에는 서재 전체를 바꿨다."],[7,"This led him to a cycle of endless spending.","이것은 그를 끝없는 소비의 순환으로 이끌었다."]],"w":"7번의 This는 바로 앞 6번 내용, 즉 의자 → 책상 → 서재를 차례로 바꾼 일. 그 일이 끝없는 소비의 순환으로 이어졌다는 흐름.","c":2,"ev":"6~7번 문장"},"h":"92b674cb4a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Instead of falling into this trap, remember Diderot’s story the next time you consider a new purchase.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 함정에 빠지는 대신, 다음에 새로운 구매를 고려할 때 디드로의 이야기를 기억하라.","opts":["다음에 물건을 살 때 디드로의 이야기를 떠올려 함정에 빠지지 않도록 하라.","디드로처럼 새 물건을 사면 모든 가구를 바꾸라.","디드로의 이야기는 잊고 마음껏 새 물건을 사라.","새로운 구매는 절대 하지 말고 이야기만 기억하라."],"r":{"a":"1) 다음에 물건을 살 때 디드로의 이야기를 떠올려 함정에 빠지지 않도록 하라.","s":[[11,"Instead of falling into this trap, remember Diderot’s story the next time you consider a new purchase.","이 함정에 빠지는 대신, 다음에 새로운 구매를 고려할 때 디드로의 이야기를 기억하라."]],"w":"Instead of falling into this trap은 '이 함정에 빠지는 대신'. 새 구매를 고려할 때 디드로의 이야기를 기억하라는 조언이므로 ①. 구매를 아예 금지한다는 말은 없음.","c":1,"ev":"11번 문장"},"h":"d1ae190133"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["디드로 효과는 21세기 미국 작가의 이야기에서 나왔다.","디드로는 처음에 서재 전체를 바꾼 뒤 의자를 바꿨다.","새 물건은 때로 이미 가진 물건에 대한 불만족을 만든다.","디드로는 새 가운이 마음에 들지 않아 팔아 버렸다."],"opts":["The Diderot Effect comes from a story of an American writer in the 21st century.","Diderot replaced his entire study first and then his chair.","A new item can sometimes create dissatisfaction with what we already own.","Diderot disliked the new robe and sold it."],"r":{"a":"3) 새 물건은 때로 이미 가진 물건에 대한 불만족을 만든다.","s":[[3,"It comes from the story of Denis Diderot, an 18th-century French writer.","그것은 18세기 프랑스 작가 드니 디드로의 이야기에서 나왔다."],[6,"He started by replacing his chair, then his desk, and eventually his entire study.","그는 의자를 바꾸는 것으로 시작해서, 그다음에는 책상을, 결국에는 서재 전체를 바꿨다."],[8,"When we bring a new item into our lives, especially one of higher quality or a different style, it can create a feeling of dissatisfaction with our existing possessions.","우리가 새로운 물건, 특히 더 품질이 높거나 스타일이 다른 물건을 생활에 들일 때, 그것은 우리가 이미 가진 소유물에 대한 불만족의 느낌을 만들어 낼 수 있다."]],"w":"8번에서 새 물건이 기존 소유물에 대한 불만족을 만들 수 있다고 함. ①은 3번(18세기 프랑스 작가)과 다르고, ②는 6번의 순서(의자 → 책상 → 서재)와 반대. ④는 가운이 우아했다는 5번과 맞지 않음.","c":3,"ev":"3번, 6번, 8번 문장"},"h":"9d2eabf9dd"},{"n":9,"t":"sum","q":"When we bring in a new item, we may feel (A) with our current possessions, and this can lead to (B) purchases.","ko":"새 물건을 들이면 우리는 현재 소유물에 (A)을 느낄 수 있고, 이것은 (B) 구매로 이어질 수 있다.","oko":["(A) 만족 / (B) 계획에 없던","(A) 불만족 / (B) 계획된","(A) 자랑스러움 / (B) 계획에 없던","(A) 불만족 / (B) 계획에 없던","(A) 불만족 / (B) 값싼"],"opts":["(A) satisfaction / (B) unplanned","(A) dissatisfaction / (B) planned","(A) pride / (B) unplanned","(A) dissatisfaction / (B) unplanned","(A) dissatisfaction / (B) cheap"],"r":{"a":"4) (A) dissatisfaction / (B) unplanned","s":[[8,"When we bring a new item into our lives, especially one of higher quality or a different style, it can create a feeling of dissatisfaction with our existing possessions.","우리가 새로운 물건, 특히 더 품질이 높거나 스타일이 다른 물건을 생활에 들일 때, 그것은 우리가 이미 가진 소유물에 대한 불만족의 느낌을 만들어 낼 수 있다."],[9,"This leads us to make unplanned purchases in an attempt to restore harmony.","이것은 우리가 조화를 되찾으려는 시도로 계획에 없던 구매를 하게 만든다."]],"w":"8번에서 새 물건이 기존 소유물에 대한 dissatisfaction(불만족)을 만들고, 9번에서 그것이 unplanned purchases(계획에 없던 구매)로 이어진다고 함. planned(계획된)는 반대, cheap(값싼)은 본문에 없음.","c":4,"ev":"8~9번 문장"},"h":"d07818dc59"},{"n":10,"t":"fill","q":"The Diderot Effect shows how one purchase can quickly lead to [A] (too much spending) and [B].","ko":"디드로 효과는 하나의 구매가 빠르게 [A](너무 많이 쓰는 것)와 [B]로 이어질 수 있음을 보여 준다.","bank":["overspending","waste","robe","chair","study","writer"],"bko":{"overspending":"과소비","waste":"낭비","robe":"가운","chair":"의자","study":"서재","writer":"작가"},"r":{"a":"[A] overspending, [B] waste","s":[[6,"He started by replacing his chair, then his desk, and eventually his entire study.","그는 의자를 바꾸는 것으로 시작해서, 그다음에는 책상을, 결국에는 서재 전체를 바꿨다."],[10,"The Diderot Effect shows how one purchase can quickly lead to overspending and waste.","디드로 효과는 하나의 구매가 어떻게 빠르게 과소비와 낭비로 이어질 수 있는지를 보여 준다."]],"w":"10번에서 one purchase can quickly lead to overspending and waste(하나의 구매가 과소비와 낭비로 이어짐)라고 함. robe(가운), chair(의자), study(서재), writer(작가)는 본문에 나오는 물건·사람 이름이라 '구매가 이어지는 결과'로는 맞지 않음.","c":null,"ev":"6번, 10번 문장"},"h":"def2437e2e"}]},{"u":5,"id":"b4-05-2","no":2,"ko":"가게마다 카드를 들고 다니던 시대, 한 장으로 끝낸 비결?","items":[{"n":1,"t":"tf","q":"Stores gave small cards to trusted customers so they could pay later.","ko":"가게들은 믿을 만한 고객들이 나중에 지불할 수 있도록 작은 카드를 주었다.","r":{"a":"T (본문과 맞는 내용)","s":[[3,"They gave small cards to trusted customers so they could take items home and pay later.","그들은 믿을 만한 고객들에게 작은 카드를 주어서, 고객들이 물건을 집에 가져가고 나중에 지불할 수 있게 했다."]],"w":"3번에서 They gave small cards to trusted customers so they could take items home and pay later라고 함. 믿을 만한 고객에게 카드를 주어 나중에 내게 했으므로 본문과 같음.","c":"T","ev":"3번 문장"},"h":"0507c98f35"},{"n":2,"t":"tf","q":"People who visited different shops needed only one store credit card.","ko":"여러 가게를 방문하는 사람들은 가게 카드 한 장만 있으면 됐다.","r":{"a":"F (본문과 다른 내용)","s":[[4,"However, each card worked only at one store, so people who visited different shops or restaurants often needed several cards.","하지만 각 카드는 한 가게에서만 쓸 수 있었기 때문에, 여러 가게나 식당을 방문하는 사람들은 종종 여러 장의 카드가 필요했다."]],"w":"4번에서 각 카드는 한 가게에서만 쓸 수 있어서(only at one store) 여러 가게를 다니는 사람은 여러 장(several cards)이 필요했다고 함. 한 장이면 된다는 말은 반대.","c":"F","ev":"4번 문장"},"h":"907de4b630"},{"n":3,"t":"tf","q":"The Diners Club card could be used at several New York City restaurants.","ko":"다이너스 클럽 카드는 뉴욕시의 여러 식당에서 쓸 수 있었다.","r":{"a":"T (본문과 맞는 내용)","s":[[7,"The company issued a card that members could use at several New York City restaurants.","그 회사는 회원들이 뉴욕시의 여러 식당에서 쓸 수 있는 카드를 발급했다."]],"w":"7번에 a card that members could use at several New York City restaurants가 있음. 회원들이 뉴욕시의 여러 식당에서 쓸 수 있었으므로 본문과 같음.","c":"T","ev":"7번 문장"},"h":"e35fb3ec58"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The company issued a card that members could use at several restaurants.)","ko":"그 회사는 회원들이 여러 식당에서 쓸 수 있는 카드를 ( ).","opts":["취소했다","발급했다","빌렸다","숨겼다"],"word":"issued","r":{"a":"2) 발급했다","s":[[7,"The company issued a card that members could use at several New York City restaurants.","그 회사는 회원들이 뉴욕시의 여러 식당에서 쓸 수 있는 카드를 발급했다."]],"w":"7번에서 회사(Diners Club)가 회원들이 쓸 카드를 만들어 내주었다는 흐름. issue(발급하다)의 과거형 issued = 발급했다. 취소했다는 반대 방향.","c":2,"ev":"7번 문장"},"h":"745877b4e1"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (The idea proved successful.)","ko":"그 아이디어는 성공적임이 ( ).","opts":["실패했다","잊혔다","(~임이) 입증되었다","금지되었다"],"word":"proved","r":{"a":"3) (~임이) 입증되었다","s":[[9,"The idea proved successful.","그 아이디어는 성공적임이 입증되었다."]],"w":"9번의 proved successful은 '성공적임이 입증되었다'. 바로 뒤 10번에서 더 많은 식당, 호텔, 상점, 항공사가 참여했으니 성공이 확인된 것. prove(입증하다)의 과거형임.","c":3,"ev":"9번 문장"},"h":"352574feee"},{"n":6,"t":"ref","q":"What does the underlined \"The idea\" refer to?\nThe idea proved successful.","ko":"밑줄 친 The idea가 가리키는 것은?","sko":"그 아이디어는 성공적임이 입증되었다.","opts":["현금을 더 많이 가지고 다니는 것","가게마다 다른 카드를 만들어 주는 것","은행이 직접 호텔을 운영하는 것","한 장의 카드로 여러 식당에서 쓰고 청구서를 한 번에 받는 것"],"r":{"a":"4) 한 장의 카드로 여러 식당에서 쓰고 청구서를 한 번에 받는 것","s":[[7,"The company issued a card that members could use at several New York City restaurants.","그 회사는 회원들이 뉴욕시의 여러 식당에서 쓸 수 있는 카드를 발급했다."],[8,"Diners Club then sent customers a single monthly bill.","그러고 나서 다이너스 클럽은 고객들에게 한 장의 월별 청구서를 보냈다."],[9,"The idea proved successful.","그 아이디어는 성공적임이 입증되었다."]],"w":"The idea는 바로 앞 7~8번의 내용, 즉 카드 한 장을 여러 식당에서 쓰고 한 장의 월별 청구서를 받는 방식. 가게마다 다른 카드는 오히려 4번의 불편한 점.","c":4,"ev":"7~9번 문장"},"h":"bd633c7f93"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Over time, businesses realized there was a need for a single card that worked in many places.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"시간이 지나면서, 사업가들은 여러 곳에서 쓸 수 있는 한 장의 카드가 필요하다는 것을 깨달았다.","opts":["시간이 지나면서 사업가들은 여러 곳에서 쓸 수 있는 카드 한 장이 필요하다는 것을 알게 되었다.","사업가들은 가게마다 새 카드를 따로 만들어야 한다고 생각하게 되었다.","시간이 지나면서 사업가들은 한 곳에서만 쓰는 카드가 더 안전하다고 생각하게 되었다.","사업가들은 카드 없이 현금만 쓰기로 결정했다."],"r":{"a":"1) 시간이 지나면서 사업가들은 여러 곳에서 쓸 수 있는 카드 한 장이 필요하다는 것을 알게 되었다.","s":[[5,"Over time, businesses realized there was a need for a single card that worked in many places.","시간이 지나면서, 사업가들은 여러 곳에서 쓸 수 있는 한 장의 카드가 필요하다는 것을 깨달았다."]],"w":"a single card that worked in many places는 '여러 곳에서 쓸 수 있는 한 장의 카드'. 4번의 불편(가게마다 한 장씩)을 해결하려는 생각이라 ②, ③은 반대.","c":1,"ev":"5번 문장"},"h":"280c1ff5dd"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["20세기 초에는 많은 현금을 가지고 다니는 것이 안전하고 편리했다.","가게 카드는 여러 가게에서 모두 쓸 수 있었다.","다이너스 클럽은 고객들에게 한 달에 한 장의 청구서를 보냈다.","은행은 다이너스 클럽이 시작되기 전에 이미 신용카드를 내놓았다."],"opts":["Carrying a lot of cash was safe and convenient in the early 20th century.","Store credit cards could be used at all stores.","Diners Club sent customers one bill each month.","Banks had already introduced credit cards before Diners Club began."],"r":{"a":"3) 다이너스 클럽은 고객들에게 한 달에 한 장의 청구서를 보냈다.","s":[[1,"In the early 20th century, cash was the main way to pay for things, but carrying a lot of money was unsafe and inconvenient.","20세기 초에는 현금이 물건값을 지불하는 주된 방법이었지만, 많은 돈을 가지고 다니는 것은 안전하지 않고 불편했다."],[4,"However, each card worked only at one store, so people who visited different shops or restaurants often needed several cards.","하지만 각 카드는 한 가게에서만 쓸 수 있었기 때문에, 여러 가게나 식당을 방문하는 사람들은 종종 여러 장의 카드가 필요했다."],[8,"Diners Club then sent customers a single monthly bill.","그러고 나서 다이너스 클럽은 고객들에게 한 장의 월별 청구서를 보냈다."],[11,"By the late 1950s and 1960s, banks introduced their own cards and helped create the global credit card networks used today.","1950년대 후반과 1960년대에는 은행들이 자체 카드를 내놓았고 오늘날 쓰이는 세계적인 신용카드 망을 만드는 데 일조했다."]],"w":"8번 single monthly bill과 일치. ①은 1번에서 unsafe and inconvenient(안전하지 않고 불편)라고 해서 반대. ②는 4번에서 한 가게에서만 쓸 수 있다고 해서 반대. ④는 11번에서 은행 카드가 1950년대 후반 이후라서 시기가 반대.","c":3,"ev":"1번, 4번, 8번, 11번 문장"},"h":"d92a758e48"},{"n":9,"t":"sum","q":"Store credit cards worked only at (A) store each, so people needed (B) cards, and this led to the idea of a single card.","ko":"가게 카드는 각각 (A) 가게에서만 쓸 수 있어서 사람들은 (B) 카드가 필요했고, 이것이 한 장의 카드라는 아이디어로 이어졌다.","oko":["(A) 많은 / (B) 한 장의","(A) 많은 / (B) 여러 장의","(A) 한 / (B) 아무 카드도 필요 없는","(A) 두 / (B) 한 장의","(A) 한 / (B) 여러 장의"],"opts":["(A) many / (B) one","(A) many / (B) several","(A) one / (B) no","(A) two / (B) one","(A) one / (B) several"],"r":{"a":"5) (A) one / (B) several","s":[[4,"However, each card worked only at one store, so people who visited different shops or restaurants often needed several cards.","하지만 각 카드는 한 가게에서만 쓸 수 있었기 때문에, 여러 가게나 식당을 방문하는 사람들은 종종 여러 장의 카드가 필요했다."],[5,"Over time, businesses realized there was a need for a single card that worked in many places.","시간이 지나면서, 사업가들은 여러 곳에서 쓸 수 있는 한 장의 카드가 필요하다는 것을 깨달았다."]],"w":"4번에서 each card worked only at one store(한 가게에서만)여서 often needed several cards(여러 장 필요). 그래서 5번에서 a single card의 필요를 깨달음. 많은 가게에서 쓰였다면 여러 장이 필요 없었을 것.","c":5,"ev":"4~5번 문장"},"h":"272fa082af"},{"n":10,"t":"fill","q":"Diners Club sent members a [A] monthly bill, and soon hotels, shops, and [B] joined.","ko":"다이너스 클럽은 회원들에게 [A] 월별 청구서를 보냈고, 곧 호텔, 상점, [B]이 참여했다.","bank":["single","airlines","cash","unsafe","several","bills"],"bko":{"single":"하나의, 한 장의","airlines":"항공사","cash":"현금","unsafe":"안전하지 않은","several":"여러 개의","bills":"청구서"},"r":{"a":"[A] single, [B] airlines","s":[[8,"Diners Club then sent customers a single monthly bill.","그러고 나서 다이너스 클럽은 고객들에게 한 장의 월별 청구서를 보냈다."],[10,"More restaurants joined, and soon hotels, shops, and airlines followed.","더 많은 식당들이 참여했고, 곧 호텔, 상점, 항공사가 뒤를 이었다."]],"w":"8번에서 Diners Club then sent customers a single monthly bill(한 장의 월별 청구서), 10번에서 hotels, shops, and airlines followed라고 함. cash, unsafe, several, bills는 빈칸 문장에 넣으면 뜻이 맞지 않음.","c":null,"ev":"8번, 10번 문장"},"h":"3d0f418680"}]},{"u":5,"id":"b4-05-3","no":3,"ko":"버려진 철도가 공원이 되었더니 생긴 일은?","items":[{"n":1,"t":"tf","q":"The city turned an old freight railway into a public park called the High Line.","ko":"시는 오래된 화물 철도를 하이라인이라는 공공 공원으로 바꾸었다.","r":{"a":"T (본문과 맞는 내용)","s":[[5,"Instead of removing it, they turned it into a public park called the High Line.","그것을 없애는 대신, 그들은 그것을 하이라인이라는 공공 공원으로 바꾸었다."]],"w":"5번에서 they turned it into a public park called the High Line이라고 함. 철도를 없애지 않고 공원으로 바꾼 것이므로 본문과 같음.","c":"T","ev":"5번 문장"},"h":"7db0699640"},{"n":2,"t":"tf","q":"The city decided to remove the old railway instead of reusing it.","ko":"시는 오래된 철도를 재사용하는 대신 없애기로 결정했다.","r":{"a":"F (본문과 다른 내용)","s":[[4,"One major idea was to reuse an old elevated freight railway that had once carried goods to the factories.","한 가지 주요 아이디어는 한때 공장으로 물건을 실어 나르던 오래된 고가 화물 철도를 재사용하는 것이었다."]],"w":"4번에서 One major idea was to reuse an old elevated freight railway(오래된 고가 철도를 재사용하는 것)라고 함. 없애는 것이 아니라 재사용했으므로 F.","c":"F","ev":"4번 문장"},"h":"6508461533"},{"n":3,"t":"tf","q":"Higher rents made it harder for some longtime residents to stay.","ko":"임대료가 오르자 일부 오래 살아온 주민들이 머물기가 더 어려워졌다.","r":{"a":"T (본문과 맞는 내용)","s":[[9,"However, higher rents made it harder for some longtime residents and small businesses to stay.","하지만 임대료가 오르면서 일부 오래 살아온 주민들과 소규모 사업체가 머물기가 더 어려워졌다."]],"w":"9번에 higher rents made it harder for some longtime residents and small businesses to stay가 있음. 선지는 그 앞부분과 같은 내용.","c":"T","ev":"9번 문장"},"h":"9ce68fb136"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... reuse an old elevated freight railway that had once carried goods to the factories.)","ko":"... 한때 공장으로 물건을 실어 나르던 오래된 ( ) 화물 철도를 재사용하는 것","opts":["땅속의","높이 올려진","끊어진","새로 지은"],"word":"elevated","r":{"a":"2) 높이 올려진","s":[[4,"One major idea was to reuse an old elevated freight railway that had once carried goods to the factories.","한 가지 주요 아이디어는 한때 공장으로 물건을 실어 나르던 오래된 고가 화물 철도를 재사용하는 것이었다."]],"w":"4번에서 elevated는 old와 freight 사이에서 railway를 꾸며 '높이 올려진, 고가의 철도'라는 뜻. 땅속의는 반대 방향.","c":2,"ev":"4번 문장"},"h":"a155913341"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... trendy shops and restaurants moved in ...)","ko":"... ( ) 상점과 식당이 들어왔고","opts":["오래된","값싼","조용한","유행하는"],"word":"trendy","r":{"a":"4) 유행하는","s":[[7,"As more people visited, trendy shops and restaurants moved in, and new luxury apartments were built.","더 많은 사람들이 방문하면서, 유행하는 상점과 식당이 들어왔고 새로운 고급 아파트가 지어졌다."]],"w":"7번에서 공원을 보러 사람들이 몰려오자 새로 들어온 상점과 식당이 trendy. 곧이어 luxury apartments(고급 아파트)도 지어졌다는 흐름이라 '유행하는'이 맞음. 오래된, 값싼은 이 흐름과 반대.","c":4,"ev":"7번 문장"},"h":"6a1fbe042a"},{"n":6,"t":"ref","q":"What does the underlined \"it\" refer to?\nInstead of removing it, they turned it into a public park called the High Line.","ko":"밑줄 친 it이 가리키는 것은?","sko":"그것을 없애는 대신, 그들은 그것을 하이라인이라는 공공 공원으로 바꾸었다.","opts":["오래된 고가 화물 철도","공장 건물","뉴욕시","빈 창고"],"r":{"a":"1) 오래된 고가 화물 철도","s":[[4,"One major idea was to reuse an old elevated freight railway that had once carried goods to the factories.","한 가지 주요 아이디어는 한때 공장으로 물건을 실어 나르던 오래된 고가 화물 철도를 재사용하는 것이었다."],[5,"Instead of removing it, they turned it into a public park called the High Line.","그것을 없애는 대신, 그들은 그것을 하이라인이라는 공공 공원으로 바꾸었다."]],"w":"4번에서 재사용하자고 한 것이 an old elevated freight railway. 5번의 it은 이 철도를 가리키고, 그 철도를 없애지 않고 공원으로 바꾼 것.","c":1,"ev":"4~5번 문장"},"h":"2405e0329c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It shows why city growth can be both exciting and unfair at the same time.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이것은 도시의 성장이 왜 신나는 일이면서 동시에 불공평한 일일 수 있는지를 보여 준다.","opts":["도시가 성장하면 모두에게 똑같이 이익이 된다.","도시의 성장은 지루하고 아무도 관심이 없다.","도시의 성장은 좋은 면도 있지만 불공평한 면도 함께 있을 수 있다.","도시의 성장은 불공평하기 때문에 멈춰야 한다."],"r":{"a":"3) 도시의 성장은 좋은 면도 있지만 불공평한 면도 함께 있을 수 있다.","s":[[11,"It shows why city growth can be both exciting and unfair at the same time.","이것은 도시의 성장이 왜 신나는 일이면서 동시에 불공평한 일일 수 있는지를 보여 준다."]],"w":"both exciting and unfair at the same time은 '신나기도 하고 동시에 불공평하기도 하다'. 6~8번 좋은 면과 9번 나쁜 면을 한 번에 정리한 말. 멈춰야 한다는 말은 본문에 없음.","c":3,"ev":"11번 문장"},"h":"9a40c110f8"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["공원이 생긴 뒤 부동산 가치가 떨어졌다.","부동산 가치가 오르고 그 지역은 더 비싸졌다.","시는 철도를 없애고 그 자리에 아파트를 지었다.","임대료가 낮아져서 오래 산 주민들이 계속 머물 수 있었다."],"opts":["Property values fell after the park opened.","Property values rose, and the area became more expensive.","The city removed the railway and built apartments there.","Rents became lower, so longtime residents could stay."],"r":{"a":"2) 부동산 가치가 오르고 그 지역은 더 비싸졌다.","s":[[5,"Instead of removing it, they turned it into a public park called the High Line.","그것을 없애는 대신, 그들은 그것을 하이라인이라는 공공 공원으로 바꾸었다."],[8,"Property values rose, and the area became more popular and more expensive.","부동산 가치가 올랐고, 그 지역은 더 인기 있고 더 비싸졌다."],[9,"However, higher rents made it harder for some longtime residents and small businesses to stay.","하지만 임대료가 오르면서 일부 오래 살아온 주민들과 소규모 사업체가 머물기가 더 어려워졌다."]],"w":"8번에서 property values rose(부동산 가치가 올랐다), more expensive(더 비싸졌다)라고 함. ①은 반대, ③은 5번(없애지 않고 공원으로 바꿈)과 다르며, ④는 9번(임대료가 높아짐)과 반대.","c":2,"ev":"5번, 8~9번 문장"},"h":"e9f80205df"},{"n":9,"t":"sum","q":"Investment can improve a neighborhood, but higher (A) can make it (B) for longtime residents to stay.","ko":"투자는 동네를 개선할 수 있지만, 더 높은 (A)는 오래 살아온 주민들이 머물기 (B) 만들 수 있다.","oko":["(A) 세금 / (B) 더 어렵게","(A) 임대료 / (B) 더 쉽게","(A) 공원 / (B) 더 어렵게","(A) 공장 / (B) 더 쉽게","(A) 임대료 / (B) 더 어렵게"],"opts":["(A) taxes / (B) harder","(A) rents / (B) easier","(A) parks / (B) harder","(A) factories / (B) easier","(A) rents / (B) harder"],"r":{"a":"5) (A) rents / (B) harder","s":[[9,"However, higher rents made it harder for some longtime residents and small businesses to stay.","하지만 임대료가 오르면서 일부 오래 살아온 주민들과 소규모 사업체가 머물기가 더 어려워졌다."],[10,"This kind of change, where investment improves a neighborhood but also pushes out existing communities, is called gentrification.","투자가 동네를 개선하지만 기존 공동체를 밀어내기도 하는 이런 종류의 변화는 젠트리피케이션이라고 불린다."]],"w":"9번에서 higher rents made it harder for some longtime residents ... to stay라고 함. 세금(taxes)은 본문에 없고, easier는 반대 뜻.","c":5,"ev":"9~10번 문장"},"h":"4b25763d7b"},{"n":10,"t":"fill","q":"As more people visited, trendy shops moved in, new [A] apartments were built, and property [B] rose.","ko":"더 많은 사람이 방문하면서 유행하는 상점이 들어왔고, 새로운 [A] 아파트가 지어졌으며, 부동산 [B]이 올랐다.","bank":["luxury","values","freight","busy","closed","unfair"],"bko":{"luxury":"고급의","values":"가치","freight":"화물","busy":"북적이는","closed":"닫힌","unfair":"불공평한"},"r":{"a":"[A] luxury, [B] values","s":[[7,"As more people visited, trendy shops and restaurants moved in, and new luxury apartments were built.","더 많은 사람들이 방문하면서, 유행하는 상점과 식당이 들어왔고 새로운 고급 아파트가 지어졌다."],[8,"Property values rose, and the area became more popular and more expensive.","부동산 가치가 올랐고, 그 지역은 더 인기 있고 더 비싸졌다."]],"w":"7번에서 사람이 늘자 new luxury apartments(새 고급 아파트)가 지어졌고, 8번에서 property values rose(부동산 가치가 올랐다)라고 함. freight(화물)는 철도 설명, busy(북적이는)는 1번 옛 모습, closed(닫힌)는 2번 공장, unfair(불공평한)는 11번 말이라 이 빈칸에는 맞지 않음.","c":null,"ev":"7~8번 문장"},"h":"765510a394"}]},{"u":5,"id":"b4-05-4","no":4,"ko":"사지 않고 빌려 쓰는 시대, 구독 경제의 두 얼굴?","items":[{"n":1,"t":"tf","q":"People once bought products mainly to use them for a short time.","ko":"사람들은 한때 주로 제품을 짧게 사용하기 위해 샀다.","r":{"a":"F (본문과 다른 내용)","s":[[1,"People once bought products mainly to own them.","사람들은 한때 주로 제품을 소유하기 위해 샀다."]],"w":"1번에서 People once bought products mainly to own them(소유하기 위해)이라고 함. 짧게 쓰려고 산 것이 아니므로 F.","c":"F","ev":"1번 문장"},"h":"b66a6195cb"},{"n":2,"t":"tf","q":"In the subscription economy, people pay a small monthly fee to use products or services.","ko":"구독 경제에서 사람들은 제품이나 서비스를 이용하기 위해 적은 월 이용료를 낸다.","r":{"a":"T (본문과 맞는 내용)","s":[[3,"This change has led to the subscription economy, where people pay a small monthly fee to use products or services for a certain time.","이 변화는 구독 경제로 이어졌는데, 구독 경제에서는 사람들이 일정 기간 제품이나 서비스를 이용하기 위해 적은 월 이용료를 낸다."]],"w":"3번에서 subscription economy를 where people pay a small monthly fee to use products or services라고 설명함. 선지와 같음.","c":"T","ev":"3번 문장"},"h":"6d64d5cd47"},{"n":3,"t":"tf","q":"Music and movie streaming services are examples of subscriptions.","ko":"음악 및 영화 스트리밍 서비스는 구독의 예이다.","r":{"a":"T (본문과 맞는 내용)","s":[[4,"These include music and movie streaming services and even furniture.","여기에는 음악 및 영화 스트리밍 서비스와 심지어 가구도 포함된다."]],"w":"4번에서 These include music and movie streaming services and even furniture라고 함. 이 서비스들이 구독 경제의 예이므로 T.","c":"T","ev":"4번 문장"},"h":"977b2c3453"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... without worrying about owning or maintaining anything.)","ko":"... 소유하거나 ( ) 것을 걱정하지 않고","opts":["버리는","빌려 주는","관리하고 유지하는","새로 만드는"],"word":"maintaining","r":{"a":"3) 관리하고 유지하는","s":[[6,"This convenient access also allows consumers to explore new services and switch between them without worrying about owning or maintaining anything.","이 편리한 접근은 또한 소비자가 소유하거나 관리하는 것을 걱정하지 않고 새로운 서비스를 체험해 보고 그것들 사이를 바꿀 수 있게 해 준다."]],"w":"6번에서 구독은 owning(소유하는 것)이나 maintaining(관리·유지하는 것)을 걱정하지 않고 서비스를 바꿀 수 있다는 장점. 물건을 가지고 있을 때 따라오는 일이므로 '관리하고 유지하는'이 맞음.","c":3,"ev":"6번 문장"},"h":"1db445b12e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, there are drawbacks, too.)","ko":"하지만 ( )도 있다.","opts":["이점","규칙","선물","단점"],"word":"drawbacks","r":{"a":"4) 단점","s":[[7,"However, there are drawbacks, too.","하지만 단점도 있다."]],"w":"7번 앞(5~6번)은 장점, 뒤(8~10번)는 총비용이 높아지고 소유하지 못한다는 내용. However로 방향이 바뀐 것이므로 drawbacks = 단점. 이점은 반대 뜻.","c":4,"ev":"7번 문장"},"h":"9c0fe08ad9"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt offers convenience and choice, but it also requires consumers to make thoughtful decisions about what they pay for.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 편리함과 선택권을 주지만, 소비자가 무엇에 돈을 낼지 신중하게 결정해야 하기도 한다.","opts":["디지털 기술","구독 경제","월별 요금","소비자들"],"r":{"a":"2) 구독 경제","s":[[11,"Today, the subscription economy is a major part of modern life.","오늘날 구독 경제는 현대 생활의 중요한 부분이다."],[12,"It offers convenience and choice, but it also requires consumers to make thoughtful decisions about what they pay for.","그것은 편리함과 선택권을 주지만, 소비자가 무엇에 돈을 낼지 신중하게 결정해야 하기도 한다."]],"w":"11번에서 the subscription economy is a major part of modern life라고 했고, 12번의 It은 이 구독 경제를 가리킴. 구독 경제가 편리함과 선택권을 주고, 신중한 결정도 요구한다는 뜻.","c":2,"ev":"11~12번 문장"},"h":"23b6bb7c1b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But as digital technology has spread, consumers have begun to value convenience and variety more than ownership.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 디지털 기술이 퍼지면서, 소비자들은 소유보다 편리함과 다양함을 더 중요하게 여기기 시작했다.","opts":["디지털 기술이 퍼지면서 소비자들은 소유보다 편리함과 다양함을 더 중요하게 여기게 되었다.","디지털 기술 때문에 소비자들은 편리함보다 소유를 더 중요하게 여기게 되었다.","디지털 기술이 퍼지기 전에는 소비자들이 다양함을 가장 중요하게 여겼다.","소비자들은 편리함과 다양함이 싫어서 소유에 집착하기 시작했다."],"r":{"a":"1) 디지털 기술이 퍼지면서 소비자들은 소유보다 편리함과 다양함을 더 중요하게 여기게 되었다.","s":[[2,"But as digital technology has spread, consumers have begun to value convenience and variety more than ownership.","하지만 디지털 기술이 퍼지면서, 소비자들은 소유보다 편리함과 다양함을 더 중요하게 여기기 시작했다."]],"w":"value A more than B는 'B보다 A를 더 중요하게 여기다'. A = convenience and variety, B = ownership이라 소유보다 편리함과 다양함이 더 중요해졌다는 뜻.","c":1,"ev":"2번 문장"},"h":"bbdbc66c01"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["구독하려면 큰 금액의 연회비를 내야 한다.","여러 서비스를 구독하면 총비용이 낮아진다.","요금 내는 것을 멈추면 이용이 바로 끝난다.","구독 서비스를 이용하려면 제품을 소유해야 한다."],"opts":["You must pay a large yearly fee to subscribe.","Subscribing to many services keeps the total cost low.","Your access ends right away when you stop paying the fee.","Subscriptions require consumers to own the products."],"r":{"a":"3) 요금 내는 것을 멈추면 이용이 바로 끝난다.","s":[[3,"This change has led to the subscription economy, where people pay a small monthly fee to use products or services for a certain time.","이 변화는 구독 경제로 이어졌는데, 구독 경제에서는 사람들이 일정 기간 제품이나 서비스를 이용하기 위해 적은 월 이용료를 낸다."],[8,"If you subscribe to many services, the total monthly cost can become very high.","여러 서비스를 구독하면 한 달 총비용이 매우 높아질 수 있다."],[10,"Once you stop paying the fee, your access ends right away.","요금 내는 것을 멈추면, 당신의 이용 권한은 바로 끝난다."]],"w":"10번에서 Once you stop paying the fee, your access ends right away라고 함. ①은 3번의 small monthly fee(적은 월 이용료)와 다름. ②는 8번(총비용이 매우 높아질 수 있음)과 반대. ④는 구독은 소유가 아니라 이용이라서 다름.","c":3,"ev":"3번, 8번, 10번 문장"},"h":"9a89176c83"},{"n":9,"t":"sum","q":"Subscriptions give consumers quick (A) to many options through one (B) payment, and let them switch services without worrying about owning anything.","ko":"구독은 소비자에게 하나의 (B) 결제로 많은 선택지에 빠른 (A)을 주고, 아무것도 소유할 걱정 없이 서비스를 바꾸게 해 준다.","oko":["(A) 소유 / (B) 월별","(A) 접근 / (B) 연간","(A) 소유 / (B) 연간","(A) 비용 / (B) 월별","(A) 접근 / (B) 월별"],"opts":["(A) ownership / (B) monthly","(A) access / (B) yearly","(A) ownership / (B) yearly","(A) cost / (B) monthly","(A) access / (B) monthly"],"r":{"a":"5) (A) access / (B) monthly","s":[[5,"Subscriptions attract consumers by offering quick access to a wide range of options through one monthly payment.","구독은 하나의 월 결제로 폭넓은 선택지에 빠르게 접근할 수 있게 해 줌으로써 소비자를 끌어들인다."],[6,"This convenient access also allows consumers to explore new services and switch between them without worrying about owning or maintaining anything.","이 편리한 접근은 또한 소비자가 소유하거나 관리하는 것을 걱정하지 않고 새로운 서비스를 체험해 보고 그것들 사이를 바꿀 수 있게 해 준다."]],"w":"5번에서 quick access to a wide range of options through one monthly payment(하나의 월 결제로 폭넓은 선택지에 빠르게 접근)라고 함. 구독은 소유가 아니라 접근(이용)이고, 결제는 yearly가 아니라 monthly.","c":5,"ev":"5~6번 문장"},"h":"0701926537"},{"n":10,"t":"fill","q":"If you subscribe to many services, the total monthly [A] can become very high, and you never truly [B] the items or content.","ko":"여러 서비스를 구독하면 한 달 총 [A]이 매우 높아질 수 있고, 그 물건이나 콘텐츠를 결코 진짜로 [B] 못한다.","bank":["cost","own","ownership","furniture","digital","technology"],"bko":{"cost":"비용","own":"소유하다","ownership":"소유(권)","furniture":"가구","digital":"디지털의","technology":"기술"},"r":{"a":"[A] cost, [B] own","s":[[8,"If you subscribe to many services, the total monthly cost can become very high.","여러 서비스를 구독하면 한 달 총비용이 매우 높아질 수 있다."],[9,"Also, you never truly own the items or content.","또한 당신은 그 물건이나 콘텐츠를 결코 진짜로 소유하지 못한다."]],"w":"8번에서 the total monthly cost can become very high, 9번에서 you never truly own the items or content라고 함. ownership(소유)은 명사라서 [B] 자리에 맞지 않고, furniture(가구), digital(디지털의), technology(기술)는 이 두 빈칸의 뜻과 맞지 않음.","c":null,"ev":"8~9번 문장"},"h":"fc850ae0b9"}]},{"u":6,"id":"b4-06-1","no":1,"ko":"조용한 속삭임이 몸에 일으키는 변화는?","items":[{"n":1,"t":"tf","q":"Scientists experimented with 38 young adults to find out whether ASMR affects the body and brain.","ko":"과학자들은 ASMR이 몸과 뇌에 영향을 주는지 알아보기 위해 38명의 젊은 성인을 대상으로 실험했다.","r":{"a":"T (본문과 맞는 내용)","s":[[6,"But can ASMR actually affect the body and brain?","하지만 ASMR이 실제로 몸과 뇌에 영향을 줄 수 있을까?"],[7,"To find out, scientists experimented with 38 young adults.","알아보기 위해, 과학자들은 38명의 젊은 성인을 대상으로 실험했다."]],"w":"6번에서 ASMR이 몸과 뇌에 영향을 줄 수 있는지 묻고, 7번에서 To find out(알아보기 위해) 38명의 젊은 성인으로 실험했다고 함. 선지와 같음.","c":"T","ev":"6~7번 문장"},"h":"88922afd28"},{"n":2,"t":"tf","q":"Almost 60% of the participants said they experienced a tingling feeling during the videos.","ko":"참가자의 거의 60%가 영상을 보는 동안 찌릿한 느낌을 경험했다고 말했다.","r":{"a":"F (본문과 다른 내용)","s":[[10,"Almost 40% of the participants said they experienced a tingling feeling during the videos.","참가자의 거의 40%가 영상을 보는 동안 찌릿한 느낌을 경험했다고 말했다."]],"w":"10번에서 찌릿한 느낌을 경험했다고 한 사람은 almost 40%임. 60%가 아니므로 F.","c":"F","ev":"10번 문장"},"h":"949b3bac7c"},{"n":3,"t":"tf","q":"Most participants’ heart rates slowed down after watching the videos.","ko":"대부분 참가자의 심박수는 영상을 본 후에 느려졌다.","r":{"a":"T (본문과 맞는 내용)","s":[[12,"Most participants’ heart rates also slowed down, which means their bodies became calmer.","대부분 참가자의 심박수도 느려졌는데, 이는 그들의 몸이 더 차분해졌다는 뜻이다."]],"w":"12번에서 Most participants’ heart rates also slowed down이라고 함. 심박수가 느려졌다는 내용과 같음.","c":"T","ev":"12번 문장"},"h":"11b16bfca6"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (ASMR is a pleasant tingling feeling triggered by certain sounds.)","ko":"ASMR은 특정한 소리에 의해 ( ) 기분 좋은 찌릿한 느낌이다.","opts":["숨겨지는","유발되는","팔리는","멈춰지는"],"word":"triggered","r":{"a":"2) 유발되는","s":[[3,"ASMR is a pleasant tingling feeling triggered by certain sounds.","ASMR은 특정한 소리에 의해 유발되는 기분 좋은 찌릿한 느낌이다."],[4,"Common ASMR triggers include whispering, tapping, crinkling materials, and brushing sounds.","흔한 ASMR 유발 소리에는 속삭이는 소리, 두드리는 소리, 바스락거리는 재료 소리, 솔질하는 소리가 있다."]],"w":"3번 뒤 4번에서 whispering, tapping 같은 소리들을 ASMR triggers라고 소개함. 소리가 찌릿한 느낌을 일으키는 것이므로 triggered by = '~에 의해 유발되는'.","c":2,"ev":"3~4번 문장"},"h":"28508d9152"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (Brain scans revealed that they had increased focus and attention after watching.)","ko":"뇌 검사에서 그들이 시청 후에 집중력과 주의력이 ( ) 것이 드러났다.","opts":["줄어든","사라진","느려진","높아진"],"word":"increased","r":{"a":"4) 높아진","s":[[13,"Brain scans revealed that they had increased focus and attention after watching.","뇌 검사에서 그들이 시청 후에 집중력과 주의력이 높아졌음이 드러났다."]],"w":"13번은 ASMR이 몸과 뇌에 좋은 영향을 준다는 결과. 14~15번에서 기분이 나아진다고 정리하므로 increased = 높아진. 줄어든(reduce)은 반대 방향.","c":4,"ev":"13번 문장"},"h":"835916b487"},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\nAlmost 40% of the particip
