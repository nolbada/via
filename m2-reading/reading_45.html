rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

var D=[{"n": 1, "tag": "Monica · 이탈리아 베네치아", "en": "Hello, friends! My name is Monica, and I lives in Venice.", "ko": "안녕, 친구들! 내 이름은 Monica이고, 나는 베네치아에서 살고 있어.", "ok": false, "foot": [], "fixes": [{"wrong": "lives", "right": "live", "partial": false, "at": [8], "point": "수일치: 주어 I에는 동사원형 live 사용", "topic": "수일치", "memo": "주어 I에는 동사원형 live 사용"}]}, {"n": 2, "tag": null, "en": "Have you hear of Venice?", "ko": "베네치아에 대해 들어 본 적 있니?", "ok": false, "foot": [], "fixes": [{"wrong": "hear", "right": "heard", "partial": false, "at": [2], "point": "현재완료시제: Have동사 + 과거분사이므로 heard 사용", "topic": "현재완료시제", "memo": "Have동사 + 과거분사이므로 heard 사용"}]}, {"n": 3, "tag": null, "en": "It is a beauty city on the water in Italy.", "ko": "그것은 이탈리아의 물 위에 있는 아름다운 도시야.", "ok": false, "foot": [], "fixes": [{"wrong": "beauty", "right": "beautiful", "partial": false, "at": [3], "point": "어휘/품사: 명사(city)를 꾸미는 자리이므로 형용사 beautiful 사용", "topic": "어휘/품사", "memo": "명사(city)를 꾸미는 자리이므로 형용사 beautiful 사용"}]}, {"n": 4, "tag": null, "en": "Venice is famous for its canals and historic buildings.", "ko": "베네치아는 운하와 역사적인 건물들로 유명해.", "ok": true, "foot": ["1canals 운하, 수로", "2historic 역사적으로 중요한"], "fixes": []}, {"n": 5, "tag": null, "en": "Many tourist come to see they every year.", "ko": "많은 여행객들이 매년 그것들을 보러 와.", "ok": false, "foot": [], "fixes": [{"wrong": "tourist", "right": "tourists", "partial": false, "at": [1], "point": "수일치: many 뒤에는 복수명사 tourists 사용", "topic": "수일치", "memo": "many 뒤에는 복수명사 tourists 사용"}, {"wrong": "they", "right": "them", "partial": false, "at": [5], "point": "대명사 격: 동사 see의 목적어 자리이므로 목적격 대명사 them 사용", "topic": "대명사 격", "memo": "동사 see의 목적어 자리이므로 목적격 대명사 them 사용"}]}, {"n": 6, "tag": null, "en": "But now, we has a big problem.", "ko": "그런데 지금, 우리는 큰 문제를 겪고 있어.", "ok": false, "foot": [], "fixes": [{"wrong": "has", "right": "have", "partial": false, "at": [3], "point": "수일치: 주어 we에는 동사원형 have 사용", "topic": "수일치", "memo": "주어 we에는 동사원형 have 사용"}]}, {"n": 7, "tag": null, "en": "Last week, the streets were flood.", "ko": "지난주에, 거리가 침수됐어.", "ok": false, "foot": [], "fixes": [{"wrong": "flood", "right": "flooded", "partial": false, "at": [5], "point": "수동태: be동사(were) + 과거분사 flooded 형태로 사용", "topic": "수동태", "memo": "be동사(were) + 과거분사 flooded 형태로 사용"}]}, {"n": 8, "tag": null, "en": "I can’t go to school, and my parent’s bakery had to close.", "ko": "나는 학교에 갈 수 없었고, 우리 부모님의 빵집은 문을 닫아야 했어.", "ok": false, "foot": [], "fixes": [{"wrong": "can’t", "right": "couldn’t", "partial": false, "at": [1], "point": "시제: 과거 상황이므로 can의 과거형 couldn’t 사용", "topic": "시제", "memo": "과거 상황이므로 can의 과거형 couldn’t 사용"}, {"wrong": "parent’s", "right": "parents’", "partial": false, "at": [7], "point": "어법: 부모님(복수)의 소유격은 parents’로 표기", "topic": "어법", "memo": "부모님(복수)의 소유격은 parents’로 표기"}]}, {"n": 9, "tag": null, "en": "I had to wear tall rain boot all the times.", "ko": "나는 줄곧 긴 장화를 신어야 했어.", "ok": false, "foot": [], "fixes": [{"wrong": "boot", "right": "boots", "partial": false, "at": [6], "point": "어휘/수: rain boots는 항상 복수형으로 사용", "topic": "어휘/수", "memo": "rain boots는 항상 복수형으로 사용"}, {"wrong": "times", "right": "time", "partial": false, "at": [9], "point": "어휘: ‘항상’을 뜻하는 all the time에서 time은 불가산명사로 단수형 사용", "topic": "어휘", "memo": "‘항상’을 뜻하는 all the time에서 time은 불가산명사로 단수형 사용"}]}, {"n": 10, "tag": null, "en": "I’m real worried.", "ko": "나는 정말 걱정이야.", "ok": false, "foot": [], "fixes": [{"wrong": "real", "right": "really", "partial": false, "at": [1], "point": "어법: 형용사(worried)를 꾸미는 부사 really 사용", "topic": "어법", "memo": "형용사(worried)를 꾸미는 부사 really 사용"}]}, {"n": 11, "tag": null, "en": "The warm the Earth gets, the high the water in Venice rises.", "ko": "지구가 더 더워질수록 베네치아의 수위는 더 상승해.", "ok": false, "foot": [], "fixes": [{"wrong": "warm", "right": "warmer", "partial": false, "at": [1], "point": "비교급: the + 비교급 ~, the + 비교급 ... 구문이므로 warmer 사용", "topic": "비교급", "memo": "the + 비교급 ~, the + 비교급 ... 구문이므로 warmer 사용"}, {"wrong": "high", "right": "higher", "partial": false, "at": [6], "point": "비교급: 동 othy from the United States.", "안녕, Monica! 나는 미국의 Timothy야.", 0], ["My family visited Venice three years ago and we loved it!", "우리 가족은 3년 전에 베네치아를 방문했고 우리는 그곳을 아주 좋아했어!", 0], ["I am surprised and sad to hear your news.", "나는 네 소식을 듣고 놀랐고 슬퍼.", 0], ["I want to do my part to help your city and the Earth.", "나는 너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어.", 0], ["I recently found out something interesting.", "나는 최근에 재미있는 것을 알게 됐어.", 0], ["The more meat we eat, the hotter our planet gets.", "우리가 더 많은 고기를 먹을수록 우리의 행성은 더 뜨거워져.", 0], ["This is because lots of trees are cut down to make animal farms. This increases greenhouse gases.", "이것은 동물 농장을 만들기 위해 많은 나무가 베어지기 때문이야. 이것은 온실가스를 증가시켜.", 0], ["Also, cows pass a lot of gas. Smelly!", "또한, 소는 많은 가스를 배출해. 고약한 냄새가 나!", 0], ["But this is not the worst part. The gas from cows also adds to greenhouse gases.", "그런데 이것이 최악인 부분은 아니야. 소에게서 나온 가스는 또한 온실가스에 추가돼.", 0], ["Greenhouse gases make the Earth hotter.", "온실가스는 지구를 더 뜨겁게 만들어.", 0], ["So, I’m trying to eat less meat to slow down global warming.", "그래서, 나는 지구 온난화를 늦추기 위해서 고기를 덜 먹으려고 노력하고 있어.", 0], ["It isn’t easy to change my eating habits, but I’m doing my best.", "나의 식습관을 바꾸는 것은 쉽지 않지만, 나는 최선을 다하고 있어.", 0], ["Hello, I’m Suin from Korea.", "안녕, 나는 한국의 수인이야.", 0], ["Every summer, it rains a lot here.", "매년 여름에 여기는 비가 많이 와.", 0], ["Sometimes, we have floods and they are really scary.", "때때로, 우리는 홍수를 겪고 그것들은 정말 무서워.", 0], ["The situation in Venice must be scary, too.", "베네치아의 상황도 무서울 게 틀림없어.", 0], ["I’ve never been to Venice, but I have seen many beautiful pictures of it.", "나는 베네치아에 가 본 적이 없지만, 그곳의 많은 아름다운 사진들을 본 적이 있어.", 0], ["I talked to my friends about the floods in your city.", "나는 너희 도시의 홍수에 관해 친구들과 이야기했어.", 0], ["We wanted to help Venice, so we started the 3R campaign.", "우리는 베네치아를 돕고 싶어서, 3R 캠페인을 시작했어.", 0], ["The 3Rs are Recycle, Reuse, and Reduce.", "3R은 ‘재활용하다’, ‘재사용하다’, 그리고 ‘줄이다’야.", 0], ["Now, many students at my school are doing these three things every day.", "지금, 우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어.", 0], ["It is important to do our part for Venice. Together, we can make a difference!", "베네치아를 위해 우리의 역할을 하는 것이 중요해. 함께, 우리는 변화를 만들 수 있어!", 0]];var RNUM=45;var TITLE_EN="Save the City on the Water";var PASS_EN=["Save the City on the Water", "Hello, friends! My name is Monica, and I live in Venice. Have you heard of Venice? It is a beautiful city on the water in Italy. Venice is famous for its canals and historic buildings. Many tourists come to see them every year. But now, we have a big problem. Last week, the streets were flooded. I couldn’t go to school, and my parents’ bakery had to close. I had to wear tall rain boots all the time. I’m really worried. The warmer the Earth gets, the higher the water in Venice rises. Venice could be underwater soon. My city needs your help!", "Hi, Monica! I’m Timothy from the United States. My family visited Venice three years ago and we loved it! I am surprised and sad to hear your news. I want to do my part to help your city and the Earth. I recently found out something interesting. The more meat we eat, the hotter our planet gets. This is because lots of trees are cut down to make animal farms. This increases greenhouse gases. Also, cows pass a lot of gas. Smelly! But this is not the worst part. The gas from cows also adds to greenhouse gases. Greenhouse gases make the Earth hotter. So, I’m trying to eat less meat to slow down global warming. It isn’t easy to change my eating habits, but I’m doing my best.", "Hello, I’m Suin from Korea. Every summer, it rains a lot here. Sometimes, we have floods and they are really scary. The situation in Venice must be scary, too. I’ve never been to Venice, but I have seen many beautiful pictures of it. I talked to my friends about the floods in your city. We wanted to help Venice, so we started the 3R campaign. The 3Rs are Recycle, Reuse, and Reduce. Now, many students at my school are doing these three things every day. It is important to do our part for Venice. Together, we can make a difference!"];var PASS_KO=["물 위의 도시를 구하라", "안녕, 친구들! 내 이름은 Monica이고, 나는 베네치아에서 살고 있어. 베네치아에 대해 들어 본 적 있니? 그것은 이탈리아의 물 위에 있는 아름다운 도시야. 베네치아는 운하와 역사적인 건물들로 유명해. 많은 여행객들이 매년 그것들을 보러 와. 그런데 지금, 우리는 큰 문제를 겪고 있어. 지난주에, 거리가 침수됐어. 나는 학교에 갈 수 없었고, 우리 부모님의 빵집은 문을 닫아야 했어. 나는 줄곧 긴 장화를 신어야 했어. 나는 정말 걱정이야. 지구가 더 더워질수록 베네치아의 수위는 더 상승해. 베네치아는 곧 물에 잠길 수도 있어. 나의 도시는 너희들의 도움이 필요해!", "안녕, Monica! 나는 미국의 Timothy야. 우리 가족은 3년 전에 베네치아를 방문했고 우리는 그곳을 아주 좋아했어! 나는 네 소식을 듣고 놀랐고 슬퍼. 나는 너희 도시와 지구를 돕기 위해 내 역할을 하고 싶어. 나는 최근에 재미있는 것을 알게 됐어. 우리가 더 많은 고기를 먹을수록 우리의 행성은 더 뜨거워져. 이것은 동물 농장을 만들기 위해 많은 나무가 베어지기 때문이야. 이것은 온실가스를 증가시켜. 또한, 소는 많은 가스를 배출해. 고약한 냄새가 나! 그런데 이것이 최악인 부분은 아니야. 소에게서 나온 가스는 또한 온실가스에 추가돼. 온실가스는 지구를 더 뜨겁게 만들어. 그래서, 나는 지구 온난화를 늦추기 위해서 고기를 덜 먹으려고 노력하고 있어. 나의 식습관을 바꾸는 것은 쉽지 않지만, 나는 최선을 다하고 있어.", "안녕, 나는 한국의 수인이야. 매년 여름에 여기는 비가 많이 와. 때때로, 우리는 홍수를 겪고 그것들은 정말 무서워. 베네치아의 상황도 무서울 게 틀림없어. 나는 베네치아에 가 본 적이 없지만, 그곳의 많은 아름다운 사진들을 본 적이 있어. 나는 너희 도시의 홍수에 관해 친구들과 이야기했어. 우리는 베네치아를 돕고 싶어서, 3R 캠페인을 시작했어. 3R은 ‘재활용하다’, ‘재사용하다’, 그리고 ‘줄이다’야. 지금, 우리 학교에서 많은 학생들이 이 세 가지를 매일 하고 있어. 베네치아를 위해 우리의 역할을 하는 것이 중요해. 함께, 우리는 변화를 만들 수 있어!"];var DG=[{"dlg": [["G", "Eric, I like your bag! It’s so cute.", "Eric, 네 가방 마음에 든다! 정말 귀여워."], ["B", "Thanks, Yena. I made it from old jeans.", "고마워, 예나야. 나는 그것을 낡은 청바지로 만들었어."], ["G", "Really? That’s amazing!", "정말? 놀랍다!"], ["B", "We can make new things from old things. It’s called upcycling.", "우리는 낡은 물건으로 새로운 물건을 만들 수 있어. 그걸 업사이클링이라고 해."], ["G", "I’d like to try it. What can I do to start upcycling?", "나도 해 보고 싶어. 업사이클링을 시작하려면 뭘 하면 돼?"], ["B", "First, you can find something you don’t need.", "먼저, 너에게 필요 없는 물건을 찾으면 돼."], ["G", "Well, I have an old skirt at home.", "음, 나 집에 낡은 치마가 있어."], ["B", "Good. Then think about an item you want to make.", "좋아. 그럼 네가 만들고 싶은 물건을 생각해 봐."], ["G", "Oh, I want to make a pencil case.", "아, 나는 필통을 만들고 싶어."], ["B", "Perfect. And don’t forget to wash the skirt before upcycling.", "완벽해. 그리고 업사이클링하기 전에 치마를 빠는 것을 잊지 마."]], "qs": [{"n": 1, "q": function mb(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuf(){if(!ORIG){ORIG={};QS.forEach(function(P){P.groups.forEach(function(g){g.qs.forEach(function(q){ORIG[q.n]={o:q.o.slice(),a:q.a}})})})}

  if(ATT>0){var r=mb(ATT*977+q.n*31);for(var i=idx.length-1;i>0;i--){var j=Math.floor(r()*(i+1)),t=idx[i];idx[i]=idx[j];idx[j]=t}}
  q.o=idx.map(function(i){return O.o[i]});q.a=idx.indexOf(O.a)})})})}

  h+='</div>';
 } else h+='<div class="memo"><h2>memo</h2><div class="hint">놓친 문장이 없어요. 쓸 것이 없습니다.</div></div>';
