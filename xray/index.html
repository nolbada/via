<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>문장 엑스레이 · 비타민영어클리닉</title>
<link href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;500;700;900&family=Lexend:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: one narrow column, phone-first. Home = Day grid; Play = 3-step card (order, role, meaning); roles are color-coded. */
:root{
  --bg:#f4f6f8; --surface:#ffffff; --fg:#14202b; --muted:#566474; --line:#d9e0e7;
  --accent:#0f766e; --accent-fg:#ffffff; --good:#15803d; --bad:#b91c1c; --bad-bg:#fde8e8; --good-bg:#e3f4e8;
  --s-bg:#dbeafe; --s-fg:#1e40af;
  --v-bg:#dfe5ee; --v-fg:#1e293b;
  --o-bg:#dcfce7; --o-fg:#166534;
  --io-bg:#cffafe; --io-fg:#155e75;
  --do-bg:#ecfccb; --do-fg:#3f6212;
  --c-bg:#ffedd5; --c-fg:#9a3412;
  --oc-bg:#fef3c7; --oc-fg:#92400e;
  --m-bg:#ede9fe; --m-fg:#5b21b6;
  --cj-bg:#e5e7eb; --cj-fg:#374151;
  --hl:#fde047;--hlfg:#14202b;
  --ko:"Gothic A1","Malgun Gothic","Apple SD Gothic Neo",sans-serif;
  --en:"Lexend","Segoe UI",Arial,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e141b; --surface:#17212b; --fg:#e6ebf0; --muted:#9aa8b6; --line:#2a3744;
  --accent:#2dd4bf; --accent-fg:#04201d; --good:#4ade80; --bad:#f87171; --bad-bg:#3a1d1f; --good-bg:#15301f;
  --s-bg:#1e2f5c; --s-fg:#bfdbfe; --v-bg:#3a4658; --v-fg:#e2e8f0; --o-bg:#14392a; --o-fg:#bbf7d0;
  --io-bg:#0f3a44; --io-fg:#a5f3fc; --do-bg:#2d3a12; --do-fg:#d9f99d; --c-bg:#4a2410; --c-fg:#fed7aa;
  --oc-bg:#46330a; --oc-fg:#fde68a; --m-bg:#34235e; --m-fg:#ddd6fe; --cj-bg:#2f3340; --cj-fg:#d1d5db;
  --hl:#a16207;--hlfg:#fff7d6;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e141b; --surface:#17212b; --fg:#e6ebf0; --muted:#9aa8b6; --line:#2a3744;
  --accent:#2dd4bf; --accent-fg:#04201d; --good:#4ade80; --bad:#f87171; --bad-bg:#3a1d1f; --good-bg:#15301f;
  --s-bg:#1e2f5c; --s-fg:#bfdbfe; --v-bg:#3a4658; --v-fg:#e2e8f0; --o-bg:#14392a; --o-fg:#bbf7d0;
  --io-bg:#0f3a44; --io-fg:#a5f3fc; --do-bg:#2d3a12; --do-fg:#d9f99d; --c-bg:#4a2410; --c-fg:#fed7aa;
  --oc-bg:#46330a; --oc-fg:#fde68a; --m-bg:#34235e; --m-fg:#ddd6fe; --cj-bg:#2f3340; --cj-fg:#d1d5db;
  color-scheme:dark}
*{box-sizing:border-box}
.cp{margin-top:10px;padding:12px;border:1.5px dashed var(--accent);border-radius:12px;background:var(--bg)}
.cpl{font-size:12px;font-weight:700;color:var(--muted);margin:0 0 6px}
.ckv{border:2.5px solid var(--v-fg);border-radius:999px;padding:1px 8px}
.hlm{background:var(--hl);color:var(--hlfg);padding:1px 3px;border-radius:3px}
.cpw{font-size:16px;font-weight:700;margin:6px 0 0}
.rtask{margin-top:12px}
.cmb{display:block;font-size:12.5px;font-weight:700;color:var(--good);line-height:1.3;margin-top:1px}
.cflow{display:flex;flex-wrap:wrap;gap:10px 14px;align-items:flex-start}
.cch{display:flex;flex-direction:column;gap:3px;min-width:0}
.cen{font-family:var(--en);font-size:15px;font-weight:500;line-height:1.35}
.cko{font-size:12.5px;font-weight:700;color:var(--good);line-height:1.3;min-height:17px}
.rtask .mdir{font-size:14px;font-weight:600;line-height:1.5}
.rtask .cpw{font-size:14px;font-weight:600}
.rtask .hint{font-size:13px;padding:8px 10px;color:var(--muted)}
.cflow.tap{cursor:pointer}
.cflow.tap .cko::after{content:'···';color:var(--muted);font-weight:400;letter-spacing:.12em}
.rec{border:1.5px solid var(--accent);border-radius:16px;padding:18px 16px;background:var(--card,var(--bg));text-align:center}
.rec-h{font-size:12px;color:var(--muted);letter-spacing:.02em}
.rec-t{font-size:20px;font-weight:800;margin-top:6px}
.rec-d{font-size:14px;color:var(--muted);margin-top:2px}
.rec-big{font-size:44px;font-weight:800;line-height:1.2;margin:10px 0 6px}
.rec-big.ok{color:var(--good)}.rec-big.no{color:var(--bad)}
.rec-l{font-size:15px;margin-top:4px}
.rec-chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:6px 0 8px}
.rec-chip{font-size:13px;padding:3px 9px;border-radius:999px;border:1px solid var(--line)}
.rec-chip.o{color:var(--good);border-color:var(--good)}.rec-chip.x{color:var(--bad);border-color:var(--bad)}
.trkrow{display:block;width:100%;text-align:left;margin-top:8px;padding:10px 12px;border:1.5px solid var(--line);border-radius:12px;background:var(--surface);color:inherit;font:inherit;cursor:pointer}
.trks{margin-top:8px}.trke{font-size:15px;font-weight:600;line-height:1.4}.trkk{font-size:13px;color:var(--good);margin-top:2px}.trkh{font-size:12px;color:var(--muted);margin-top:6px}
.popq{margin-top:12px}
.trkrow.on{border-color:var(--good);background:var(--good-bg)}
.trkrow span{display:block}.trkt{font-size:12px;color:var(--muted)}.trkw{font-size:18px;margin:2px 0}.trkd{font-size:14px}
.trkchips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.trkchip{padding:6px 10px;border:1.5px solid var(--line);border-radius:999px;background:var(--surface);color:inherit;font:inherit;font-size:13px;cursor:pointer}.trkchip.sel{border-color:var(--accent);background:var(--accent);color:var(--accent-fg)}
.rec-sub{font-size:13px;color:var(--muted);margin-top:2px}
.rec-big.pend{color:var(--muted);font-size:30px}
.rec-q{font-size:13px;color:var(--muted);margin-top:6px}
.rec-c{font-size:13px;color:var(--muted);margin-top:10px}
.rec-f{font-size:12px;color:var(--muted);margin-top:12px;border-top:1px dashed var(--line);padding-top:8px}
.hrow{display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:14px}
.hrow span{color:var(--muted);flex:none}
.hrow b{text-align:right;font-weight:600}
.rtask.done{opacity:.75}
body{background:var(--bg);color:var(--fg);font-family:var(--ko);font-size:16px;line-height:1.55;word-break:keep-all}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.wrap{max-width:640px;margin:0 auto;padding-inline:16px;padding-block:16px 40px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:12px}
.brand{font-weight:900;letter-spacing:.02em;font-size:17px}
.brand small{display:block;font-weight:500;font-size:12px;color:var(--muted);letter-spacing:.04em}
.pts{font-family:var(--en);font-weight:600;font-variant-numeric:tabular-nums;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:6px 14px;white-space:nowrap}
.pts b{color:var(--accent)}
h1{font-size:22px;margin:18px 0 6px;text-wrap:balance}
h2{font-size:15px;margin:22px 0 10px;color:var(--muted);letter-spacing:.04em}
.lead{color:var(--muted);margin:0 0 4px;font-size:15px}
.days{display:grid;grid-template-columns:repeat(auto-fill,minmax(68px,1fr));gap:8px}
.day{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;min-height:64px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}
.day .dn{font-family:var(--en);font-weight:600;font-size:20px;font-variant-numeric:tabular-nums}
.day .st{font-size:12px;color:var(--accent);letter-spacing:1px;min-height:18px}
.day.done{border-color:var(--accent)}
.foot{margin-top:28px;font-size:13px;color:var(--muted)}
.back{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px}
.ttl{font-weight:700;font-size:17px;text-align:center;flex:1}
.prog{height:6px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:6px}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.pcount{font-size:13px;color:var(--muted);margin-bottom:12px;font-family:var(--en)}
.steps.two{grid-template-columns:1fr 1fr}
.steps{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:14px}
.steps div{text-align:center;padding:8px 4px;border-radius:10px;font-size:14px;font-weight:700;border:1px solid var(--line);color:var(--muted);background:var(--surface)}
.steps div.on{background:var(--accent);color:var(--accent-fg);border-color:var(--accent)}
.steps div.ok{color:var(--good);border-color:var(--good)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
.ask{margin:0 0 12px;font-weight:700;font-size:17px;text-wrap:balance}
.line{min-height:64px;border:2px dashed var(--line);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:14px}
.line .ph{color:var(--muted);font-size:14px;padding-inline:4px}
.pool{display:flex;flex-wrap:wrap;gap:8px;min-height:52px}
.tile{font-family:var(--en);font-size:17px;padding:10px 14px;min-height:46px;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);overflow-wrap:anywhere;text-align:left}
.line .tile{background:var(--surface);border-color:var(--accent)}
.tile.bad{background:var(--bad-bg);border-color:var(--bad);color:var(--bad)}
.tile.good{background:var(--good-bg);border-color:var(--good)}
.acts{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.ghost{background:transparent;border:1px solid var(--line);border-radius:10px;padding:8px 14px;min-height:44px;color:var(--muted)}
.primary{background:var(--accent);color:var(--accent-fg);border:0;border-radius:12px;padding:12px 20px;min-height:48px;font-weight:700;font-size:16px;width:100%;margin-top:14px}
.krow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;padding:10px;background:var(--bg);border-radius:10px;min-height:48px}
.klbl{font-size:12px;font-weight:700;color:var(--muted);width:100%}
.kblk{font:inherit;font-size:14px;cursor:pointer;padding:6px 10px;border-radius:8px;background:var(--surface);border:1.5px solid var(--good);color:var(--good);font-size:14px;font-weight:700}
.kblk.go{box-shadow:0 0 0 2px var(--accent)}
.rslot{min-height:24px;text-align:center;font-size:13px;font-weight:700;border-radius:6px;padding:2px 6px}
.minp{width:100%;box-sizing:border-box;padding:12px;font-size:16px;font-family:var(--en);border:1.5px solid var(--line);border-radius:10px;background:var(--surface);color:inherit}
.mission{margin-top:12px}
.mline{margin:0 0 8px;font-size:15px;line-height:1.5}
.mdir{margin:0;font-size:15px;font-weight:700}
.mk{display:inline-block;padding:2px 8px;border-radius:6px;font-size:13px;margin-right:4px}
.mans{margin-top:12px;border-top:1px solid var(--line);padding-top:10px}
.msent{margin:0 0 10px;font-family:var(--en);font-size:15px;line-height:1.6}
.kfull{margin:0;font-size:16px;font-weight:700;line-height:1.5}
.kflow{display:flex;flex-wrap:wrap;gap:6px}
.r2.down{animation:slideDown .35s ease both}
@keyframes slideDown{from{transform:translateY(-14px);opacity:0}to{transform:none;opacity:1}}
.kslot.wait{border-top-color:var(--accent);min-height:24px}
.kdone{font-size:13px;color:var(--muted)}
.hint{margin:12px 0 0;padding:10px 12px;background:var(--bg);border-radius:10px;font-size:15px}
.msg{margin:12px 0 0;padding:10px 12px;border-radius:10px;font-size:15px;font-weight:700}
.msg.ok{background:var(--good-bg);color:var(--good)}
.msg.no{background:var(--bad-bg);color:var(--bad)}
.r2{padding:12px 0;border-top:1px solid var(--line)}
.r2:first-of-type{border-top:0}
.r2 .chunk{font-family:var(--en);font-size:18px;font-weight:500;margin-bottom:8px;overflow-wrap:anywhere}
.r2.done{display:flex;align-items:center;justify-content:space-between;gap:10px}
.r2.done .chunk{margin:0}
.tgt{display:block;font-size:13px;color:var(--muted);margin-top:2px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 12px;min-height:44px;font-weight:500}
.opt.bad{text-decoration:line-through;color:var(--bad);border-color:var(--bad);background:var(--bad-bg);opacity:.8}
.tg{background:var(--accent);color:var(--accent-fg);border-radius:8px;padding:2px 8px;font-weight:600}
.qsent{font-family:var(--en);font-size:20px;line-height:2.1;margin:6px 0 16px;overflow-wrap:anywhere}
.qopts{display:flex;flex-wrap:wrap;gap:8px}
.qopts .opt{min-height:48px;font-size:16px;padding:10px 16px}
.quizbtn{width:100%;text-align:left;background:var(--surface);border:1.5px solid var(--accent);border-radius:14px;padding:14px 16px;margin:16px 0 4px;min-height:60px}
.quizbtn b{display:block;font-size:17px;color:var(--accent)}
.quizbtn span{font-size:14px;color:var(--muted)}
.badge,.blk{border-radius:8px;font-weight:700}
.badge{padding:4px 10px;font-size:14px;white-space:nowrap}
.role-s{background:var(--s-bg);color:var(--s-fg)}.role-v{background:var(--v-bg);color:var(--v-fg)}
.role-o{background:var(--o-bg);color:var(--o-fg)}.role-io{background:var(--io-bg);color:var(--io-fg)}
.role-do{background:var(--do-bg);color:var(--do-fg)}.role-c{background:var(--c-bg);color:var(--c-fg)}
.role-oc{background:var(--oc-bg);color:var(--oc-fg)}.role-m{background:var(--m-bg);color:var(--m-fg)}
.role-cj{background:var(--cj-bg);color:var(--cj-fg)}
.match{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.col{display:flex;flex-direction:column;gap:8px;min-width:0}
.col h3{margin:0 0 2px;font-size:13px;color:var(--muted)}
.ml,.mr{border:1.5px solid var(--line);background:var(--bg);border-radius:10px;padding:10px;min-height:52px;text-align:left;overflow-wrap:anywhere;min-width:0}
.ml{font-family:var(--en);font-size:15px}
.ml small{display:block;font-family:var(--ko);font-size:13px;margin-top:4px;color:var(--good);font-weight:700}
.mr{font-size:15px}
.ml.sel,.mr.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.ml.ok,.mr.ok{border-color:var(--good);background:var(--good-bg)}
.mr.ok{opacity:.55}
.ml.bad,.mr.bad{border-color:var(--bad);background:var(--bad-bg)}
.ml .badge{display:inline-block;margin-bottom:4px;font-size:12px;padding:2px 8px;font-family:var(--ko)}
.stage{display:flex;flex-wrap:wrap;gap:6px 5px;min-height:74px;padding:10px 8px;margin-bottom:14px;border-radius:14px;background:var(--bg);border:1.5px solid var(--line)}
.slot{width:44px;height:46px;border:2px dashed var(--line);border-radius:10px}
.sblk{display:inline-flex;flex-direction:column;padding:5px 8px;border-radius:10px;background:var(--surface);border:1.5px solid var(--good);min-width:0}
.sblk b{font-family:var(--en);font-weight:500;font-size:15px;overflow-wrap:anywhere}
.sblk small{font-size:12px;font-weight:700;color:var(--good)}
.slot.lab{width:auto;min-width:56px;padding:6px 10px;display:inline-flex;align-items:center;justify-content:center}
.slot.lab small{font-size:13px;color:var(--muted);font-weight:700}
.slot.next{border-color:var(--accent);background:var(--surface)}
.tile.hl{box-shadow:0 0 0 4px #f97316;border-color:#f97316;background:#ffedd5;color:#7c2d12}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tile.hl{background:#5a2a0a;color:#ffedd5}}
.col3{display:flex;flex-direction:column;gap:3px;align-items:stretch;min-width:44px;max-width:100%}
.col3 .slot{width:auto;min-width:44px;height:46px}
.kslot{min-height:22px;font-size:12px;font-weight:700;color:var(--good);text-align:center;border-top:2px dashed var(--line);padding-top:4px;line-height:1.3}
.kslot.filled{border-top-color:transparent}
@media (prefers-reduced-motion:no-preference){.drop{animation:dropIn .6s .28s both cubic-bezier(.2,.8,.2,1)}@keyframes dropIn{from{transform:translateY(-90px);opacity:0}to{transform:none;opacity:1}}}
@media (prefers-reduced-motion:no-preference){.hl{animation:pl 1s infinite}@keyframes pl{50%{box-shadow:0 0 0 8px rgba(249,115,22,.25)}}}
.seq{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 14px}
.seq .arr{color:var(--muted);font-weight:700}
.seqlbl{font-size:13px;color:var(--muted);margin-right:4px}
.banner{margin:10px 0 0;padding:10px 12px;border-radius:10px;background:var(--surface);border:1px dashed var(--accent);font-size:14px}
.sblk.st2 small{color:inherit;opacity:.9}
.sblk.st2{border-color:transparent}
.sblk{position:relative}
.sblk .no{position:absolute;top:-9px;left:-6px;width:20px;height:20px;border-radius:50%;background:var(--ink,#222);color:var(--surface,#fff);font-style:normal;font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.sblk.pick{font:inherit;cursor:pointer;color:inherit}
.sblk.wait{border:2px solid var(--muted);background:var(--surface);color:var(--text,inherit);opacity:1}
.sblk.wait.now{border:2px solid #f97316;background:#ffedd5;color:#7c2d12;box-shadow:0 0 0 4px rgba(249,115,22,.35)}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .sblk.wait.now{background:#5a2a0a;color:#ffedd5}}
.sblk.wait.sel{border:2px solid var(--accent);background:color-mix(in srgb,var(--accent) 14%,var(--surface))}
.sblk.wait b{color:inherit}
.nth{display:inline-block;font-family:var(--ui,inherit);font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.ml.free{border-style:dashed}
.ml.free small{color:var(--muted);font-weight:500}
.sent{display:flex;flex-wrap:wrap;gap:8px;margin:4px 0 14px}
.blk{display:inline-flex;flex-direction:column;padding:8px 12px}
.blk b{font-family:var(--en);font-weight:500;font-size:17px;overflow-wrap:anywhere}
.blk small{font-size:12px;font-weight:700;opacity:.85}
.kor{font-size:18px;font-weight:700;margin:0 0 12px;text-wrap:balance}
.notes{margin:0 0 12px;padding:0;list-style:none;font-size:14px;color:var(--muted)}
.notes li{padding:4px 0}
.notes span{font-family:var(--en);color:var(--fg)}
.gain{font-size:15px;margin:0}
.gain b{font-family:var(--en);font-size:22px;color:var(--accent)}
.big{font-family:var(--en);font-size:44px;font-weight:600;font-variant-numeric:tabular-nums;margin:6px 0}
.stars{font-size:28px;color:var(--accent);letter-spacing:4px}
.center{text-align:center}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.two .primary,.two .ghost{margin:0;width:100%}
@media (prefers-reduced-motion:no-preference){.shake{animation:sh .25s}@keyframes sh{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
button,select,a,.day,.tile,.opt{touch-action:manipulation}
input,select,textarea{font-size:16px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
/* 문장 엑스레이 (정밀분석 100) - 단독 판. (c) 동남비타민영어학원 비타민영어클리닉. All rights reserved. */

  o+='</div></div><div class="bk-kd"><i></i><span>K와 E 비교</span><i></i></div><div class="bk-kb e"><div><span class="bk-kt e">E</span><span class="bk-ks">'+esc(b.src.split(' \u00b7 ')[0])+'</span></div><div class="bk-sent" style="line-height:2">';
  E.forEach(function(c,i){o+=cell(c,i===K.newIdx);});
  return o+'</div></div>';
}
function head(){
  var b=cur(),n=steps().length;
  return '<div class="top"><button class="back" data-act="bk-list">목록</button><div class="ttl">정밀분석 '+b.id+'</div><button class="back" data-act="bk-ref">닮은꼴 5개</button></div>'+
    '<div class="prog"><i style="width:'+Math.round(st.i/n*100)+'%"></i></div><div class="pcount">'+b.src+' · '+'분석 '+(Math.min(st.i+1,n))+' / '+n+'  ·  실수 '+st.miss+'개</div>'+
    '<div class="hint" style="margin:0 0 12px;font-size:14px;color:var(--muted)">'+esc(b.ko)+'</div>';
}
function sheetHtml(){
  if(!st.sheet)return '';
  var o='<div class="bk-sheet" data-act="bk-refx"><div class="in"><h3>닮은꼴 5개</h3>';
  PAT.forEach(function(p){o+='<div class="bk-pat"><div class="bk-sent" style="font-size:18px;line-height:1.6">'+p.en+'</div><div style="font-size:13px;color:var(--muted)"><span class="bk-rp bk-fm">'+p.k+'</span>'+p.f+(p.rel?' · '+p.rel:'')+'</div></div>';});
  o+='<div style="font-size:13px;color:var(--muted);margin:6px 0 10px">= 는 같은 대상이나 상태, \u2260 는 서로 다른 대상이에요.</div>';
  return o+'<button class="primary" data-act="bk-ref">닫기</button></div></div>';
}
var lastRK='';
function sbox(s){return '<div class="bk-sbox"><span class="bk-lab">문장</span>'+sentHtml(s)+'</div>';}
function orLine(t){return '<div class="bk-or"><i></i><span>'+t+'</span><i></i></div>';}
function render(keepScroll){
  if(!app)return;
  var y=window.scrollY;
  if(st.mode==='list'){listView();return;}
  if(st.mode==='review'){review();return;}
  var b=cur();
  if(st.mode==='bridge'){bridge();return;}
  if(st.mode==='choose'){choose();return;}
  var S=steps();
  if(st.i>=S.length){if(st.ph==='quiz'){if(st.qm<=1){finish(true);}else{st.mode='bridge';st.ph='exam';st.i=0;saveProg();st.ph='quiz';bridge();}}else finish();return;}
  var s=S[st.i],h=head(),body='';curHL=s.hl||[];
  if(s.type==='words'){
    body='<div class="card"><p class="ask">'+s.q+'</p>'+wordsHtml(s)+(L.done?'':'<button class="primary" data-act="bk-chk"'+(L.sel.length?'':' disabled style="opacity:.4"')+'>확인</button>')+'</div>';
  }else if(s.type==='pat'){
    var q=L.phase==='map'?'같은 자리끼리 짝을 지어요. 문장 한 칸, 닮은꼴 한 칸을 차례로 누르세요':s.q;
    body='<div class="card"><p class="ask">'+q+'</p>'+sbox(s)+(L.phase==='map'?'<div class="bk-gap"></div>'+mapHtml(s):orLine('닮은꼴 5개 중에서 고르세요')+patHtml(s))+'</div>';
  }else if(s.type==='pair'){
    body='<div class="card"><p class="ask">'+s.q+'</p><div class="hint" style="margin:0 0 10px;font-size:14px;color:var(--muted)">왼쪽 한 칸, 오른쪽 한 칸을 차례로 누르면 같은 자리끼리 선으로 이어져요.</div>'+pairHtml(s)+pairsSum(s)+'</div>';
  }else if(s.type==='choice'){
    body='<div class="card"><p class="ask">'+s.q+'</p>'+sbox(s)+orLine('보기')+'<div class="bk-opts">'+s.opts.map(function(x,i){
      return '<button class="bk-opt'+(L.done&&i===s.ans?' ok':(L.pick===i?(i===s.ans?' ok':' no'):''))+'" data-act="bk-c" data-i="'+i+'"><span class="e">'+x[0]+'</span><span class="s">'+x[1]+'</span></button>';}).join('')+'</div></div>';
  }else if(s.type==='k'){
    body='<div class="card"><p class="ask">'+s.q+'</p>'+kHtml()+orLine('보기')+'<div class="bk-opts">'+s.opts.map(function(x,i){
      return '<button class="bk-opt'+(L.done&&i===s.ans?' ok':(L.pick===i?(i===s.ans?' ok':' no'):''))+'" data-act="bk-c" data-i="'+i+'"><span class="e">'+x[0]+'</span><span class="s">'+x[1]+'</span></button>';}).join('')+'</div></div>';
  }
  var fbh=L.fb?'<p class="msg '+(L.fb.t==='good'?'ok':'no')+'" style="font-weight:500">'+L.fb.h+'</p>':'';
  body+=fbh;
  if(L.done)body+='<button class="primary" data-act="bk-next">'+(st.i===S.length-1&&st.ph==='exam'?'끝내기':'다음')+'</button>';
  app.innerHTML='<div class="bkv">'+h+body+'</div>'+sheetHtml();
  app.style.paddingBottom='';
  var rk=st.ph+':'+st.i+':'+(b&&b.id);
  window.scrollTo(0,(keepScroll||rk===lastRK)?y:0);lastRK=rk;
  if(L.done){var nb=app.querySelector('[data-act="bk-next"]');if(nb){var bt=nb.getBoundingClientRect().bottom;if(bt>window.innerHeight)window.scrollBy(0,bt-window.innerHeight+16);}}
  if(s.type==='pair')drawLines();
}
function choose(){
  var b=cur(),pg=bstore().prog[kk(b)],n=b.steps.length;
  app.innerHTML='<div class="top"><button class="back" data-act="bk-list">목록</button><div class="ttl">정밀분석 '+b.id+'</div><div class="pts"></div></div>'+
   '<div class="card"><p class="ask">'+esc(b.ko)+'</p><p class="lead">'+esc(b.src)+' · 분석 '+Math.min(pg.i+1,n)+' / '+n+'까지 풀었어요.</p>'+
   '<button class="primary" data-act="bk-resume">이어서 풀기</button><div style="height:10px"></div><button class="ghost" data-act="bk-again" style="width:100%">처음부터 다시 풀기</button></div>';
  window.scrollTo(0,0);
}
function listView(){
  var bs=bstore(),h='<div class="top"><div class="ttl" style="text-align:left">'+LABEL+'</div><div class="pts"><b>'+Object.keys(bs.done).length+'</b> / '+BRICKS.length+'</div></div>'+
   '<p class="lead">문장 100개의 뼈대와 꾸밈을 하나씩 분석해서 채워 보세요. 순서는 마음대로 골라도 돼요.</p><p class="lead bk-lg"><span class="bk-stm">\u2605</span> 표시는 구조가 복잡한 도전 문장이에요.</p><h2>정밀분석</h2><div class="days">';
  BRICKS.forEach(function(b,i){
    var d=bs.done[kk(b)];
    var pg=bs.prog[kk(b)];
    h+='<button class="day'+(d?' done':'')+(b.star?' bk-star':'')+'" data-act="'+(d&&!pg?'bk-rev':'bk-open')+'" data-b="'+i+'">'+(b.star?'<span class="bk-stm bk-stp">\u2605</span>':'')+'<span class="dn">'+b.id+'</span><span class="bk-ds">'+esc(b.src.split(' \u00b7 ')[0])+'</span><span class="st">'+(pg?'이어하기':(d?'실수 '+d.miss:''))+'</span></button>';
  });
  app.innerHTML=h+'</div>';window.scrollTo(0,0);
}
function tabsHtml(active){
  return '<div class="bk-tabs"><button class="bk-tab'+(active==='home'?' on':'')+'" data-act="home">수업 · 복습</button><button class="bk-tab'+(active==='bk'?' on':'')+'" data-act="bk-list">'+LABEL+'</button></div>';
}
function fOne(d){var r=d.rv&&d.rv.length?d.rv[d.rv.length-1][1]:null;return '<span class="bk-ch '+(r?ROLE[r]+(r==='V'?' v':''):'n')+'">'+esc(d.t)+'</span>';}
function sentFinal(b){
  var C=b.chunks,o='<div class="bk-sent" style="font-size:16px;line-height:1.9">';
  for(var i=0;i<C.length;i++){
    var grp=[C[i]];
    while(i+1<C.length&&C[i+1].att){i++;grp.push(C[i]);}
    o+=grp.length===1?fOne(grp[0]):'<span class="bk-grp">'+grp.map(fOne).join('')+'</span>';
  }
  return o+'</div>';
}
function bridge(){
  var b=cur();
  app.innerHTML='<div class="top"><button class="back" data-act="bk-list">목록</button><div class="ttl">정밀분석 '+b.id+'</div><div class="pts"></div></div>'+
   '<div class="card"><p class="ask">이 문장은 자세히 분석해 볼게요</p><div class="hint" style="font-size:15px">퀴즈에서 '+st.qm+'개 틀렸어요. 문장을 하나씩 뜯어서 확인해 볼게요.</div></div>'+
   '<button class="primary" data-act="bk-go">분석 시작</button>';
  window.scrollTo(0,0);
}
function finish(pass){
  var b=cur(),bs=bstore();
  var prev=bs.done[kk(b)];if(!prev||st.miss<prev.miss){bs.done[kk(b)]={miss:st.miss,at:stamp()};}
  delete bs.prog[kk(b)];bs.last[kk(b)]={miss:st.miss,qm:st.qm,at:stamp(),pass:!!pass,log:JSON.parse(JSON.stringify(st.log))};
  saveFn();st.mode='review';review();
}
function review(){
  var b=cur(),bs=bstore(),r=bs.last[kk(b)]||{miss:(bs.done[kk(b)]||{}).miss||0,at:(bs.done[kk(b)]||{}).at||'',pass:false,log:{}};
  var all=b.quiz.map(function(x){return ['quiz:'+x.id,x];}).concat(b.steps.map(function(x){return ['exam:'+x.id,x];}));
  var wr='';
  all.forEach(function(p){if(r.log[p[0]]){var x=p[1];wr+='<div class="bk-wr"><div class="bk-wq">'+(p[0].indexOf('quiz')===0?'퀴즈 · ':'분석 · ')+esc(x.q)+' <span>('+r.log[p[0]]+'번 틀림)</span></div><div class="bk-wa">'+x.good+'</div></div>';}});
  var h='<div class="top"><button class="back" data-act="bk-list">목록</button><div class="ttl">정밀분석 '+b.id+'</div><div class="pts"><b>실수 '+r.miss+'</b>개</div></div>'+
   '<div class="rec"><div class="rec-h">'+r.at+'</div><div class="rec-t">정밀분석 '+b.id+(r.pass?' 퀴즈 통과':' 분석 완료')+'</div><div class="rec-sub">'+b.src+'</div>'+
   '<div class="rec-big '+(r.miss<=2?'ok':'no')+'">실수 '+r.miss+'개</div>'+
   '<div style="text-align:left;margin:6px 0 10px">'+sentFinal(b)+'</div>'+
   '<div class="hint" style="margin:0 0 10px;font-size:14px;color:var(--muted)">'+esc(b.ko)+'</div>'+
   (r.pass?'<div class="hrow"><span>자세한 분석</span><b>건너뜀</b></div>':'')+(r.pass?b.qsum:b.sum).map(function(x){return '<div class="hrow"><span>'+x[0]+'</span><b>'+x[1]+'</b></div>';}).join('')+'</div>'+
   '<div class="card"><p class="ask" style="font-size:16px">틀렸던 곳</p>'+(wr||'<div class="hint">틀린 곳이 없어요.</div>')+'</div>'+
   (r.pass||bs.prog[kk(b)]?'<button class="primary bk-exb" style="margin:10px 0 8px" data-act="bk-ex">'+(bs.prog[kk(b)]?'이어서 분석하기':'자세히 분석해 보기')+'</button>':'')+'<div class="two"><button class="ghost" data-act="bk-again">다시 풀기</button><button class="primary" data-act="bk-list">목록</button></div>';
  app.innerHTML=h;window.scrollTo(0,0);
}
function miss(h){
  st.miss++;var cs=steps()[st.i];
  if(cs){var k=st.ph+':'+cs.id;st.log[k]=(st.log[k]||0)+1;}
  if(st.ph==='quiz'&&cs){
    st.qm++;L.qm=true;L.done=true;
    if(cs.type==='words'){L.res={};cs.ans.forEach(function(j){L.res[j]='ok';});L.sel=[];}
    L.fb={t:'bad',h:'<b>아쉬워요.</b><br>'+cs.good.replace(/^맞아요\.\s*/,'')};render();return;
  }
  L.fb={t:'bad',h:h+' (실수 '+st.miss+'개)'};render(true);
}
function ok(s){L.done=true;L.fb={t:'good',h:s.good};render();}

function onClick(e){
  var t=e.target.closest('[data-act]');if(!t)return;
  var a=t.getAttribute('data-act');if(a.indexOf('bk-')!==0)return;
  e.stopPropagation();
  if(a==='bk-refx'){if(e.target===t){st.sheet=false;render(true);}return;}
  if(a==='bk-ref'){st.sheet=!st.sheet;render(true);return;}
  if(a==='bk-list'){st.mode='list';st.sheet=false;render();return;}
  if(a==='bk-rev'){st.b=Number(t.getAttribute('data-b'));st.mode='review';st.sheet=false;render();return;}
  if(a==='bk-open'){st.b=Number(t.getAttribute('data-b'));if(bstore().prog[kk(cur())]){st.mode='choose';render();return;}st.i=0;st.miss=0;st.qm=0;st.log={};st.ph='exam';st.mode='play';resetL();render();return;}
  if(a==='bk-resume'){resume();return;}
  if(a==='bk-again'){delete bstore().prog[kk(cur())];st.i=0;st.miss=0;st.qm=0;st.log={};st.ph='exam';st.mode='play';resetL();render();return;}
  if(a==='bk-ex'){var bp=bstore();if(bp.prog[kk(cur())]){resume();return;}var lr=bp.last[kk(cur())]||{};st.ph='exam';st.i=0;st.miss=lr.miss||0;st.qm=lr.qm||0;st.log=JSON.parse(JSON.stringify(lr.log||{}));st.mode='play';st.sheet=false;resetL();render();return;}
  if(a==='bk-go'){st.ph='exam';st.i=0;st.mode='play';resetL();render();return;}
  var b=cur(),s=steps()[st.i];if(!s)return;
  if(a==='bk-next'){st.i++;resetL();if(st.ph==='exam'&&st.i<steps().length)saveProg();render();return;}
  if(L.done)return;
  var i=Number(t.getAttribute('data-i'));
  if(a==='bk-w'){var k=L.sel.indexOf(i);if(s.ans.length===1)L.sel=[i];else if(k>=0)L.sel.splice(k,1);else L.sel.push(i);L.fb=null;render(true);return;}
  if(a==='bk-chk'){
    var x=s.ans.slice().sort(function(p,q){return p-q;}).join(),y=L.sel.slice().sort(function(p,q){return p-q;}).join();
    if(x===y){L.res={};s.ans.forEach(function(j){L.res[j]='ok';});ok(s);return;}
    var lines=[];
    L.sel.forEach(function(j){if(s.ans.indexOf(j)<0){var w=b.words[j];lines.push('<b>'+esc(w)+'</b> : '+(s.memo&&s.memo[j]?s.memo[j]:'여기는 답이 아니에요.'));}});
    var gotAns=s.ans.filter(function(j){return L.sel.indexOf(j)>=0;}).length;
    if(!lines.length)lines.push(s.hint);else if(gotAns<s.ans.length&&s.ans.length>1)lines.push(s.hint);
    L.sel=[];miss(lines.join('<span class="bk-l"></span>').replace(/<span class="bk-l"><\/span>/g,'<br>'));return;
  }
  if(a==='bk-p'){
    L.pick=i;
    if(i===s.ans){if(s.nomap||s.light){ok(s);}else{L.phase='map';L.fb=null;render(true);}}
    else miss('아니에요. 동사 뒤에 무엇이 오는지 보세요.');
    return;
  }
  if(a==='bk-mu'||a==='bk-mt'){
    if(a==='bk-mu'){if(L.mdone[i])return;L.mu=i;}else{if(L.mtdone[i])return;L.mt=i;}
    L.fb=null;
    if(L.mu!=null&&L.mt!=null){
      var u=s.map[L.mu],tk=PAT[s.ans].tok[L.mt];
      if(u.r===tk[1]){
        L.mdone[L.mu]=L.mt+1;L.mtdone[L.mt]=true;L.mu=null;L.mt=null;
        if(Object.keys(L.mdone).length===s.map.length){ok(s);return;}
        render(true);
      }else{L.mu=null;L.mt=null;miss('짝이 아니에요. 같은 자리끼리 이어 보세요.');}
      return;
    }
    render(true);return;
  }
  if(a==='bk-c'){L.pick=i;if(i===s.ans)ok(s);else miss(s.hint);return;}
  if(a==='bk-ke'||a==='bk-kk'){
    var K=b.K,side=(a==='bk-ke'?'E':'K');
    if(L.kfin)return;
    if(side==='E'&&L.kdone['E'+i])return;
    if(side==='K'&&L.kdone['K'+i])return;
    if(side==='E'&&i===K.newIdx){miss('이 덩어리는 K에 없어요. 나머지를 먼저 짝지어 보세요.');return;}
    var sel=L.ks;
    if(!sel||sel.side===side){L.ks={side:side,i:i};L.fb=null;render(true);return;}
    var ei=(side==='E'?i:sel.i),kj=(side==='K'?i:sel.i);
    L.ks=null;
    if(K.map[ei]===kj){
      L.kdone['E'+ei]=true;
      var all=true;K.map.forEach(function(m,x){if(m===kj&&!L.kdone['E'+x])all=false;});
      if(all)L.kdone['K'+kj]=true;
      var rest=true;K.map.forEach(function(m,x){if(m>=0&&!L.kdone['E'+x])rest=false;});
      if(rest){L.kphase='attach';L.kfin=true;ok(s);return;}
      L.fb=null;render(true);
    }else{miss('짝이 아니에요. 같은 자리끼리 이어 보세요.');}
    return;
  }
}

window.BRK={
  init:function(a,gs,sv){
    app=a;getStore=gs;saveFn=sv;
    if(!document.getElementById('bk-css')){var el=document.createElement('style');el.id='bk-css';el.textContent=css;document.head.appendChild(el);}
    app.addEventListener('click',onClick,true);
  },
  tabs:function(active){return tabsHtml(active||'home');},
  start:function(){st.mode='list';st.sheet=false;render();}
};
})();

</script>
<script>
(function(){
var KEY='xray-v1',store={};
try{store=JSON.parse(localStorage.getItem(KEY))||{};}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(store));}catch(e){}}
var app=document.getElementById('app');
BRK.init(app,function(){return store;},save);
BRK.start();
})();
</script>
