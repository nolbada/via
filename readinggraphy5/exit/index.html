<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>리딩그라피 5 Exit Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--sel:#c2570c;--bg:#f4f5f8;--surface:#fff;--ink:#1b2130;--muted:#5a6376;--line:#dadfe8;--accent:#2c4a9a;--accent-soft:#e6ebf8;--ok:#2f7d57;--font:"Noto Sans KR","Noto Sans CJK KR","Malgun Gothic",system-ui,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#11151d;--surface:#1a202b;--ink:#e8ebf2;--muted:#9aa3b5;--line:#2b3344;--accent:#93acff;--accent-soft:#232c44;--ok:#6fcf9f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.6;padding:20px max(16px,env(safe-area-inset-right,0px)) 56px max(16px,env(safe-area-inset-left,0px))}
.wrap{max-width:720px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;font-weight:700}
.sub{margin:0;color:var(--muted);font-size:13px}
.units{display:flex;flex-wrap:wrap;gap:6px;margin:16px 0 10px}
.ub{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:6px 10px;font:inherit;font-size:13px;cursor:pointer;min-width:44px}
.ub[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);font-weight:700}
.tabs{display:flex;gap:8px;margin:6px 0 14px;flex-wrap:wrap}
.tab{flex:1 1 150px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;cursor:pointer}
.tab b{display:block;font-size:14px}.tab span{display:block;font-size:12px;color:var(--muted)}
.tab[aria-selected="true"]{border-color:var(--accent);background:var(--accent-soft)}
button:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.q{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:10px}
.qh{display:flex;gap:8px;align-items:center;margin-bottom:6px;font-size:12px;color:var(--muted);font-weight:700}
.qn{display:inline-grid;place-content:center;min-width:26px;height:26px;border-radius:13px;background:var(--accent-soft);color:var(--accent);font-size:13px}
.qt{margin:0 0 10px;overflow-wrap:anywhere}
.qt b{background:var(--accent-soft);padding:0 4px;border-radius:3px}
.opts{display:grid;gap:8px}
.o{display:flex;gap:10px;align-items:flex-start;width:100%;text-align:left;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:10px 12px;font:inherit;font-size:15px;cursor:pointer;min-height:44px}
.o i{font-style:normal;font-weight:700;color:var(--muted);flex:none;min-width:18px}
.o[aria-pressed="true"]{border:2px solid var(--sel);background:var(--sel);color:#fff;font-weight:700}.o[aria-pressed="true"] i{color:#fff}
.tf{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tf .o{justify-content:center;font-weight:700;font-size:17px}
select{font:inherit;font-size:15px;border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:6px;padding:4px 6px;max-width:100%}
.bank{margin:8px 0 0;color:var(--muted);font-size:13px}
.sbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:16px 2px 0;flex-wrap:wrap}
.cnt{color:var(--muted);font-size:14px}
.sub-btn{border:0;background:var(--accent);color:#fff;border-radius:8px;padding:12px 22px;font:inherit;font-weight:700;font-size:16px;cursor:pointer;min-height:44px}
.sub-btn:disabled{opacity:.4;cursor:not-allowed}
.score{background:var(--surface);border:2px solid var(--accent);border-radius:12px;padding:22px;margin:16px 0;text-align:center}
.score b{display:block;font-size:40px;line-height:1.2}
.score span{color:var(--muted);font-size:14px}.score .wr{display:block;margin-top:6px;font-weight:700;color:var(--ink)}
.locked .o,.locked select{pointer-events:none}
.mk{margin-left:auto;font-size:13px;font-weight:700;border-radius:6px;padding:1px 9px}
.mk.o1{background:#e3f4ea;color:#1f6b46}.mk.x1{background:#fbe5e5;color:#a02c2c}
@media (prefers-color-scheme:dark){.mk.o1{background:#1d3a2d;color:#7fe0ae}.mk.x1{background:#432225;color:#f2a3a3}}
.q.wrong{border-color:#d98b8b}
.rv{margin-top:12px;border-top:1px dashed var(--line);padding-top:10px;font-size:15px}
.rv .ra{font-weight:700;margin:0 0 8px}
.rv .rl{font-size:12px;font-weight:700;color:var(--muted);margin:10px 0 4px}
.rs{margin:0 0 8px;padding:8px 10px;background:var(--bg);border-radius:8px}
.rs .en{display:block;font-weight:500}.rs .ko{display:block;color:var(--muted);margin-top:2px}
.rs .sn{display:inline-block;font-size:12px;font-weight:700;color:var(--accent);margin-right:6px}
.rw{margin:0}

.banner{border-radius:12px;padding:18px 16px;margin:0 0 14px;text-align:center;border:3px solid}
.banner.pass{background:#e3f4ea;border-color:#2f7d57;color:#14482e}
.banner.fail{background:#fbe5e5;border-color:#c04545;color:#7a1f1f}
.banner .vd{display:block;font-size:34px;font-weight:800;line-height:1.2;letter-spacing:.02em}
.banner .sc{display:block;font-size:20px;font-weight:700;margin-top:2px}
.banner .wr{display:block;margin-top:6px;font-size:14px}
@media (prefers-color-scheme:dark){.banner.pass{background:#17382a;color:#a6ebc7;border-color:#4fa87b}.banner.fail{background:#3b1d20;color:#f5b3b3;border-color:#d46b6b}}
.o.good{border:2px solid #2f7d57;background:#e3f4ea}.o.bad{border:2px solid #c04545;background:#fbe5e5}
.o .tg{margin-left:auto;flex:none;font-size:12px;font-weight:700;padding:0 7px;border-radius:5px;background:#fff;color:#333}
@media (prefers-color-scheme:dark){.o.good{background:#17382a;border-color:#4fa87b}.o.bad{background:#3b1d20;border-color:#d46b6b}.o .tg{background:#11151d;color:#e8ebf2}}
.rv{margin:16px -14px -14px;border-top:0;padding:0;border-radius:0 0 10px 10px;overflow:hidden}
.zone{padding:12px 14px 14px;border-top:4px solid}
.zone h4{margin:0 0 8px;font-size:14px;font-weight:800;letter-spacing:.02em}
.z-tr{background:#e9f0fc;border-color:#4a72c9;color:#14213d}.z-tr h4{color:#2c4a9a}
.z-an{background:#fff4d6;border-color:#d99a1c;color:#3a2a05}.z-an h4{color:#8a5a00}
@media (prefers-color-scheme:dark){.z-tr{background:#1c2740;border-color:#6c8de0;color:#e8ebf2}.z-tr h4{color:#a9c0ff}.z-an{background:#3a3016;border-color:#c9922a;color:#f3e8cb}.z-an h4{color:#f0c36a}}
.zone .rs{background:rgba(255,255,255,.65)}
@media (prefers-color-scheme:dark){.zone .rs{background:rgba(0,0,0,.25)}}
.zone .rs .ko,.zone .rl{color:inherit;opacity:.8}
.zone .ln{margin:0 0 6px}.zone .ln b{font-size:12px;opacity:.75;margin-right:6px}
.zone ol{margin:0 0 6px;padding-left:22px}.zone li{margin:0 0 3px}
.rs-btn{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--surface);color:var(--ink);border-radius:8px;padding:12px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}.rs-btn.arm{border-color:#c04545;color:#c04545}
.banner .rule{display:block;margin-top:10px;padding-top:10px;border-top:1px solid currentColor;font-size:15px;font-weight:700}
.tgl{display:block;width:100%;margin-top:12px;border:2px solid var(--line);background:var(--bg);color:var(--ink);border-radius:8px;padding:11px;font:inherit;font-weight:700;min-height:44px;cursor:pointer}
.o.good,.o.bad{color:var(--ink)}.o.good i,.o.bad i{color:var(--muted)}
.o.good{font-weight:700}
</style>
</head>

<script>
var P=[{"u":1,"id":"r01","no":1,"ko":"디즈니가 선택한 패션 아이템, 그 이유는?","items":[{"n":1,"t":"tf","q":"Animators looked for ways to save time because they had to draw each frame by hand.","h":"c96bfb9551","ko":"애니메이션 제작자들은 각 화면을 손으로 그려야 해서 시간을 아낄 방법을 찾았다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Animators had to draw each frame by hand, so they looked for ways to save time.","애니메이션 제작자들은 각 프레임을 손으로 그려야 했기 때문에, 그들은 시간을 절약할 방법을 찾았다."]],"w":"6번 문장에 draw each frame by hand, so they looked for ways to save time이 있음. 손으로 그려야 해서 시간 절약 방법을 찾았다는 내용과 일치.","c":"T"}},{"n":2,"t":"tf","q":"Animators saved time by making hands square instead of round.","h":"c138ffae0f","ko":"애니메이션 제작자들은 손을 둥글게 하는 대신 네모나게 만들어 시간을 아꼈다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"One trick was to simplify the design of hands by making them round instead of drawing detailed fingers.","한 가지 요령은 세밀한 손가락을 그리는 대신 손을 둥글게 만들어 손의 디자인을 단순화하는 것이었다."]],"w":"7번 문장은 손을 둥글게(round) 만들어 단순화했다고 함. square로 바꾼 것이 오답.","c":"F"}},{"n":3,"t":"tf","q":"White gloves also made characters like Mickey Mouse seem more human.","h":"6fad51131b","ko":"흰 장갑은 미키마우스 같은 캐릭터가 더 인간적으로 보이게도 했다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"Although gloves were chosen for (B) needs, they also made characters like Mickey Mouse seem more human and relatable.","장갑은 실용적인 필요로 선택되었지만, 그것들은 또한 미키마우스와 같은 캐릭터를 더 인간적이고 공감되어 보이도록 했다."]],"w":"10번 문장에 they also made characters like Mickey Mouse seem more human and relatable이 있음. 본문과 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... instead of drawing detailed fingers.)","h":"01f2aca28c","ko":"... 상세한 손가락을 그리는 대신","opts":["둥근","상세한","단순한","어두운"],"word":"detailed","r":{"a":"2) 상세한","ev":"7번 문장","s":[[7,"One trick was to simplify the design of hands by making them round instead of drawing detailed fingers.","한 가지 요령은 세밀한 손가락을 그리는 대신 손을 둥글게 만들어 손의 디자인을 단순화하는 것이었다."]],"w":"7번 문장의 detailed fingers는 '자세히 그린 손가락'. detailed = 상세한. 단순한은 simplify 쪽 뜻이라 반대 방향.","c":2}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (... gloves as a reflection of animation's early history.)","h":"b3415aace2","ko":"... 장갑은 애니메이션 초기 역사의 반영이다.","opts":["복제","숙고, 깊은 생각","모방","반영"],"word":"reflection","r":{"a":"4) 반영","ev":"12번 문장","s":[[12,"Even today, many characters wear gloves as a reflection of animation’s early history.","오늘날에도, 많은 캐릭터들이 애니메이션의 초기 역사에 대한 반영으로 장갑을 끼고 있다."]],"w":"reflection은 다의어. 이 문장에서는 '(상태·속성의) 반영'. 초기 역사가 오늘날 장갑에 반영되어 있다는 흐름.","c":4}},{"n":6,"t":"ref","q":"What does the underlined \"them\" refer to?\nBut why do they wear them?","h":"ffda423cdb","ko":"밑줄 친 them이 가리키는 것은?","sko":"그런데 그들은 왜 그것을 끼고 있을까?","opts":["디즈니 캐릭터들","애니메이션 제작자들","흰 장갑","캐릭터들의 개성"],"r":{"a":"3) 흰 장갑","ev":"1~2번 문장","s":[[1,"Mickey, Minnie, Goofy, Pinocchio, and many other Disney characters all share one thing in common — white gloves.","미키, 미니, 구피, 피노키오, 그리고 다른 많은 디즈니 캐릭터들은 모두 흰색 장갑이라는 한 가지 공통점을 가지고 있다."],[2,"But why do they wear them?","그런데 그들은 왜 그것을 끼고 있을까?"]],"w":"1번 문장에서 캐릭터들이 공유하는 것이 white gloves. 2번의 they는 캐릭터들, them은 그들이 끼는 흰 장갑.","c":3}},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"White gloves solved this problem by making the hands stand out clearly.\"","h":"42acccacae","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"흰색 장갑은 손이 명확하게 눈에 띄도록 하여 이 문제를 해결했다.","opts":["흰 장갑이 손을 눈에 띄게 해서 손이 잘 안 보이던 문제를 해결했다.","흰 장갑 덕분에 손가락을 더 자세히 그릴 수 있어 문제가 해결됐다.","흰 장갑이 배경을 밝게 만들어 문제가 해결됐다.","흰 장갑이 그리는 시간을 줄여서 문제가 해결됐다."],"r":{"a":"1) 흰 장갑이 손을 눈에 띄게 해서 손이 잘 안 보이던 문제를 해결했다.","ev":"8~9번 문장","s":[[8,"But there was another problem with black-and-white cartoons: characters’ hands often became hard to see in dark or busy backgrounds.","하지만 흑백 만화영화에는 캐릭터의 손이 종종 어둡거나 복잡한 배경에서 보기 어렵다는 또 다른 문제가 있었다."],[9,"White gloves solved this problem by making the hands stand out clearly.","흰색 장갑은 손이 명확하게 눈에 띄도록 하여 이 문제를 해결했다."]],"w":"this problem은 8번의 어둡거나 복잡한 배경에서 손이 보기 어려웠던 문제. 흰 장갑이 손을 눈에 띄게 해 해결. 배경을 바꾸거나 시간을 줄였다는 말은 없음.","c":1}},{"n":8,"t":"match","q":"Which is the same as the passage?","h":"4eebe81ef4","ko":"본문의 내용과 일치하는 것은?","oko":["제작자들은 모든 손에 세밀한 손가락을 그려서 시간을 아꼈다.","장갑이 없어도 어두운 배경에서 손이 쉽게 보였다.","현대 애니메이션에서 디즈니 캐릭터들은 장갑 끼는 것을 그만두었다.","흰색 장갑은 어둡거나 복잡한 배경에서 손이 눈에 띄게 했다."],"opts":["Animators saved time by drawing detailed fingers on every hand.","Hands were easy to see in dark backgrounds even without gloves.","Disney characters stopped wearing gloves in modern animation.","White gloves made hands stand out in dark or busy backgrounds."],"r":{"a":"4) White gloves made hands stand out in dark or busy backgrounds.","ev":"7~9번, 12번 문장","s":[[7,"One trick was to simplify the design of hands by making them round instead of drawing detailed fingers.","한 가지 요령은 세밀한 손가락을 그리는 대신 손을 둥글게 만들어 손의 디자인을 단순화하는 것이었다."],[8,"But there was another problem with black-and-white cartoons: characters’ hands often became hard to see in dark or busy backgrounds.","하지만 흑백 만화영화에는 캐릭터의 손이 종종 어둡거나 복잡한 배경에서 보기 어렵다는 또 다른 문제가 있었다."],[9,"White gloves solved this problem by making the hands stand out clearly.","흰색 장갑은 손이 명확하게 눈에 띄도록 하여 이 문제를 해결했다."],[12,"Even today, many characters wear gloves as a reflection of animation’s early history.","오늘날에도, 많은 캐릭터들이 애니메이션의 초기 역사에 대한 반영으로 장갑을 끼고 있다."]],"w":"④만 8~9번 문장과 일치. ①은 7번(손가락 대신 둥글게), ②는 8번(어두운 배경에서 안 보임), ③은 12번(오늘날에도 장갑)과 어긋남.","c":4}},{"n":9,"t":"sum","q":"In early animation, animators (A) the design of hands to save time, and white gloves made the hands (B) in dark or busy backgrounds.","h":"8975906b3b","ko":"초기 애니메이션에서 제작자들은 시간을 아끼려고 손 모양을 (A)했고, 흰 장갑은 어둡거나 복잡한 배경에서 손이 (B)하게 했다.","oko":["(A) 복잡하게 만들었다 / (B) 눈에 보이는","(A) 단순화했다 / (B) 숨겨진","(A) 단순화했다 / (B) 눈에 보이는","(A) 복잡하게 만들었다 / (B) 숨겨진","(A) 없앴다 / (B) 눈에 보이는"],"opts":["(A) complicated / (B) visible","(A) simplified / (B) hidden","(A) simplified / (B) visible","(A) complicated / (B) hidden","(A) removed / (B) visible"],"r":{"a":"3) (A) simplified / (B) visible","ev":"7~9번 문장","s":[[7,"One trick was to simplify the design of hands by making them round instead of drawing detailed fingers.","한 가지 요령은 세밀한 손가락을 그리는 대신 손을 둥글게 만들어 손의 디자인을 단순화하는 것이었다."],[8,"But there was another problem with black-and-white cartoons: characters’ hands often became hard to see in dark or busy backgrounds.","하지만 흑백 만화영화에는 캐릭터의 손이 종종 어둡거나 복잡한 배경에서 보기 어렵다는 또 다른 문제가 있었다."],[9,"White gloves solved this problem by making the hands stand out clearly.","흰색 장갑은 손이 명확하게 눈에 띄도록 하여 이 문제를 해결했다."]],"w":"7번 simplify the design of hands(단순화), 9번 hands stand out(눈에 띔=잘 보임). 따라서 simplified와 visible.","c":3}},{"n":10,"t":"fill","q":"To save time, animators tried to [A] the design of hands, and white gloves became a [B] feature in early animation.","h":"20518a2c1b","ko":"시간을 아끼려고 제작자들은 손 모양을 [A]하려 했고, 흰 장갑은 초기 애니메이션의 [B] 특징이 되었다.","bko":{"solve":"해결하다","common":"흔한, 공통적인","busy":"복잡한","simplify":"단순화하다","detailed":"세밀한","save":"절약하다"},"bank":["solve","common","busy","simplify","detailed","save"],"r":{"a":"[A] simplify, [B] common","ev":"6~7번, 11번 문장","s":[[6,"Animators had to draw each frame by hand, so they looked for ways to save time.","애니메이션 제작자들은 각 프레임을 손으로 그려야 했기 때문에, 그들은 시간을 절약할 방법을 찾았다."],[7,"One trick was to simplify the design of hands by making them round instead of drawing detailed fingers.","한 가지 요령은 세밀한 손가락을 그리는 대신 손을 둥글게 만들어 손의 디자인을 단순화하는 것이었다."],[11,"Over time, gloves became a common feature in early animation.","시간이 지나면서, 장갑은 초기 애니메이션에서 공통적인 특징이 되었다."]],"w":"7번 One trick was to simplify the design of hands, 11번 gloves became a common feature in early animation에서 가져옴. busy, detailed는 배경과 손가락 묘사에 쓰인 말이라 문맥이 맞지 않음.","c":null}}]},{"u":1,"id":"r02","no":2,"ko":"도로 위 3색 신호의 시작","items":[{"n":1,"t":"tf","q":"In the early railroad system, white meant 'caution' and green meant 'go.'","h":"d0e1801c34","ko":"초기 철도 체계에서 흰색은 '주의', 초록은 '가기'를 뜻했다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"White was used for ‘go,’ and green was for ‘caution.’","흰색은 ‘출발’로, 녹색은 ‘주의’로 사용되었다."]],"w":"7번 문장은 White가 go, green이 caution. 뜻이 서로 바뀌어 있어 거짓.","c":"F"}},{"n":2,"t":"tf","q":"At night, train operators sometimes mistook a bright white light for stars.","h":"a1bef20e85","ko":"밤에 기차 기사들은 가끔 밝은 흰 불빛을 별로 착각했다.","r":{"a":"T (본문과 맞는 내용)","ev":"9번 문장","s":[[9,"At night, train operators sometimes mistook the bright white light for stars, causing confusion.","밤에, 기관사들이 때때로 밝은 흰색 불빛을 별로 착각하여 혼란을 초래했다."]],"w":"9번 문장에 At night, train operators sometimes mistook the bright white light for stars가 있음. 일치.","c":"T"}},{"n":3,"t":"tf","q":"Railroads used colored lanterns to guide trains.","h":"16b087a6e2","ko":"철도는 기차를 안내하려고 색깔 있는 랜턴을 사용했다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"Back then, railroads used colored lanterns to guide trains.","그 당시, 철도 시설은 기차를 안내하기 위해 색이 있는 랜턴을 사용했다."]],"w":"5번 문장에 railroads used colored lanterns to guide trains가 있음. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (However, this system had a flaw.)","h":"453c0250a7","ko":"하지만 이 체계에는 결함이 있었다.","opts":["결함","장점","신호","위험"],"word":"flaw","r":{"a":"1) 결함","ev":"8~9번 문장","s":[[8,"However, this system had a flaw.","그러나, 이 체계에는 결함이 있었다."],[9,"At night, train operators sometimes mistook the bright white light for stars, causing confusion.","밤에, 기관사들이 때때로 밝은 흰색 불빛을 별로 착각하여 혼란을 초래했다."]],"w":"8번 뒤 9번에서 흰 불빛을 별로 착각해 혼란이 생김. 문제점이므로 flaw = 결함.","c":1}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (To address this, green was reassigned ...)","h":"3979020a30","ko":"이것에 대처하기 위해 초록이 재배정되었다.","opts":["~에 주소를 쓰다","~에게 연설하다","(문제에) 대처하다","피하다, 회피하다"],"word":"address","r":{"a":"3) (문제에) 대처하다","ev":"10번 문장","s":[[10,"To address this, green was reassigned to signal ‘go’ as it strongly contrasted with red.","이러한 문제에 대처하기 위해, 녹색은 빨간색과 강하게 대비를 이루므로 ‘출발’ 신호를 나타내도록 재배치되었다."]],"w":"address는 다의어. 여기서는 9번의 혼란 문제를 해결하려는 내용이라 '(문제에) 대처하다'. 주소, 연설 뜻은 문맥에 맞지 않음.","c":3}},{"n":6,"t":"ref","q":"What does the underlined \"which\" refer to?\nWhy aren't colors like blue or pink, which seem more appealing, used instead?","h":"8ab85b153d","ko":"밑줄 친 which가 가리키는 것은?","sko":"파란색이나 분홍색처럼 더 매력적으로 보이는 색상들이 왜 대신 사용되지 않을까?","opts":["신호등","파랑이나 분홍 같은 색","빨강과 초록","철도 랜턴"],"r":{"a":"2) 파랑이나 분홍 같은 색","ev":"3번 문장","s":[[3,"Why aren’t colors like blue or pink, which seem more appealing, used instead?","파란색이나 분홍색처럼 더 매력적으로 보이는 색상들이 왜 대신 사용되지 않을까?"]],"w":"which 바로 앞이 colors like blue or pink. 더 매력적으로 보이는 것은 파랑이나 분홍 같은 색.","c":2}},{"n":7,"t":"sense","q":"Sentence 8 says, \"However, this system had a flaw.\" What is explained right after this sentence?","h":"6fa53bf6e5","ko":"8번 문장 \"However, this system had a flaw.\" 바로 다음에 설명되는 내용으로 가장 알맞은 것은?","sko":"그러나, 이 체계에는 결함이 있었다.","opts":["철도 산업이 시작된 시기","빨간색이 정지를 뜻하게 된 이유","파랑과 분홍이 쓰이지 않는 이유","밤에 흰 불빛을 별로 착각해 혼란이 생긴 일"],"r":{"a":"4) 밤에 흰 불빛을 별로 착각해 혼란이 생긴 일","ev":"8~9번 문장","s":[[8,"However, this system had a flaw.","그러나, 이 체계에는 결함이 있었다."],[9,"At night, train operators sometimes mistook the bright white light for stars, causing confusion.","밤에, 기관사들이 때때로 밝은 흰색 불빛을 별로 착각하여 혼란을 초래했다."]],"w":"However로 결함을 예고한 뒤 9번에서 구체적으로 밤에 흰 불빛을 별로 착각한 일을 설명. 나머지는 8번 앞 내용(3·4·6번).","c":4}},{"n":8,"t":"match","q":"Which is the same as the passage?","h":"1e34ec1e00","ko":"본문의 내용과 일치하는 것은?","oko":["파란색과 분홍색은 초기 철도 체계에서 사용되었다.","노란색은 빨간색과 녹색에서 구별하기 쉬워서 선택되었다.","기관사들은 낮에 밝은 흰색 불빛을 별로 착각했다.","신호등은 19세기에 해운업에서 처음 나왔다."],"opts":["Blue and pink were used in the early railroad system.","Yellow was chosen because it was easy to tell from red and green.","Train operators mistook the bright white light for stars during the day.","Traffic lights first came from the shipping industry in the 19th century."],"r":{"a":"2) Yellow was chosen because it was easy to tell from red and green.","ev":"4~7번, 9번, 11번 문장","s":[[4,"The color system for traffic lights originates from the railroad industry in the early 19th century.","신호등의 색상 체계는 19세기 초 철도 산업에서 유래했다."],[5,"Back then, railroads used colored lanterns to guide trains.","그 당시, 철도 시설은 기차를 안내하기 위해 색이 있는 랜턴을 사용했다."],[6,"Red was used for ‘stop’ because it has long been associated with danger.","빨간색은 오랫동안 위험과 관련되어 왔기 때문에 ‘정지’로 사용되었다."],[7,"White was used for ‘go,’ and green was for ‘caution.’","흰색은 ‘출발’로, 녹색은 ‘주의’로 사용되었다."],[9,"At night, train operators sometimes mistook the bright white light for stars, causing confusion.","밤에, 기관사들이 때때로 밝은 흰색 불빛을 별로 착각하여 혼란을 초래했다."],[11,"Yellow was introduced to mean ‘caution’ as it stood out well from both red and green.","노란색은 빨간색과 녹색 모두에서 잘 구별되기 때문에 ‘주의’를 의미하도록 도입되었다."]],"w":"②는 11번(stood out well from both red and green)과 일치. ①은 7번 초기 색(빨강·흰색·초록), ③은 9번 At night, ④는 4번 railroad industry와 어긋남.","c":2}},{"n":9,"t":"sum","q":"The traffic light color system came from the (A) industry, and it was changed to fix a problem with the (B) light.","h":"9a144efcad","ko":"신호등 색 체계는 (A) 산업에서 나왔고, (B) 불빛의 문제를 고치려고 바뀌었다.","oko":["(A) 철도 / (B) 흰색","(A) 철도 / (B) 빨간색","(A) 해운 / (B) 흰색","(A) 랜턴 / (B) 녹색","(A) 해운 / (B) 노란색"],"opts":["(A) railroad / (B) white","(A) railroad / (B) red","(A) shipping / (B) white","(A) lantern / (B) green","(A) shipping / (B) yellow"],"r":{"a":"1) (A) railroad / (B) white","ev":"4번, 9~10번 문장","s":[[4,"The color system for traffic lights originates from the railroad industry in the early 19th century.","신호등의 색상 체계는 19세기 초 철도 산업에서 유래했다."],[9,"At night, train operators sometimes mistook the bright white light for stars, causing confusion.","밤에, 기관사들이 때때로 밝은 흰색 불빛을 별로 착각하여 혼란을 초래했다."],[10,"To address this, green was reassigned to signal ‘go’ as it strongly contrasted with red.","이러한 문제에 대처하기 위해, 녹색은 빨간색과 강하게 대비를 이루므로 ‘출발’ 신호를 나타내도록 재배치되었다."]],"w":"4번 railroad industry에서 유래. 9번에서 문제가 된 것은 bright white light를 별로 착각한 것. 빨간색은 문제가 아니었음.","c":1}},{"n":10,"t":"fill","q":"In the early system, [A] meant 'go,' but it was often mistaken for stars, so [B] was reassigned to mean 'go.'","h":"8b9e2ed657","ko":"초기 체계에서 [A]은 '가기'를 뜻했지만 종종 별로 오인되어, [B]이 '가기'를 뜻하도록 재배정되었다.","bko":{"yellow":"노란색","white":"흰색","lanterns":"랜턴들","green":"녹색","stars":"별들","red":"빨간색"},"bank":["yellow","white","lanterns","green","stars","red"],"r":{"a":"[A] white, [B] green","ev":"7번, 9~10번 문장","s":[[7,"White was used for ‘go,’ and green was for ‘caution.’","흰색은 ‘출발’로, 녹색은 ‘주의’로 사용되었다."],[9,"At night, train operators sometimes mistook the bright white light for stars, causing confusion.","밤에, 기관사들이 때때로 밝은 흰색 불빛을 별로 착각하여 혼란을 초래했다."],[10,"To address this, green was reassigned to signal ‘go’ as it strongly contrasted with red.","이러한 문제에 대처하기 위해, 녹색은 빨간색과 강하게 대비를 이루므로 ‘출발’ 신호를 나타내도록 재배치되었다."]],"w":"7번 White was used for 'go', 9번 흰 불빛을 별로 착각, 10번 green was reassigned to signal 'go'. yellow는 caution용으로 새로 도입, red는 계속 stop.","c":null}}]},{"u":1,"id":"r03","no":3,"ko":"깊은 바다의 지략가","items":[{"n":1,"t":"tf","q":"Some fish moved only when the octopus led the way.","h":"1a7759f470","ko":"일부 물고기는 문어가 앞장설 때만 움직였다.","r":{"a":"T (본문과 맞는 내용)","ev":"6번 문장","s":[[6,"Even more fascinating, some fish moved only when the octopus led the way.","더욱 흥미로운 점은, 문어가 길을 이끌 때만 일부 물고기들이 움직였다는 것이다."]],"w":"6번 문장에 some fish moved only when the octopus led the way가 있음. 일치.","c":"T"}},{"n":2,"t":"tf","q":"Octopuses punched fish to make them leave the group.","h":"236f3c011a","ko":"문어는 물고기를 무리에서 쫓아내려고 쳤다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"The octopuses played an active role, sometimes punching fish to keep them focused and on task.","그 문어들은 적극적인 역할을 했으며, 때때로 물고기를 때려서 그들이 집중하고 임무에 전념하도록 했다."]],"w":"5번 문장은 물고기를 쳐서 집중하고 맡은 일을 하게 함(keep them focused and on task). 쫓아내려는 것이 아님.","c":"F"}},{"n":3,"t":"tf","q":"The fish help octopuses by driving out hidden prey from tight spaces.","h":"00d7ad22de","ko":"물고기는 좁은 틈에서 숨은 먹이를 쫓아내서 문어를 돕는다.","r":{"a":"F (본문과 다른 내용)","ev":"10~11번 문장","s":[[10,"Octopuses help the fish by reaching into tight spaces to drive out hidden prey.","문어는 숨겨진 먹이를 몰아내려고 좁은 공간까지 몸을 뻗어 물고기를 돕는다."],[11,"In return, the fish help octopuses by using their sharp senses to find areas with plenty of food.","그 대가로, 물고기는 그들의 예리한 감각을 사용하여 풍부한 먹이가 있는 곳을 찾아내어 문어를 돕는다."]],"w":"좁은 틈에서 숨은 먹이를 쫓아내는 쪽은 문어(10번). 물고기는 예민한 감각으로 먹이 많은 곳을 찾아 줌(11번). 주체가 뒤바뀜.","c":"F"}},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Even more fascinating, some fish moved only when ...)","h":"09f7dcd817","ko":"더욱 흥미로운 것은, 일부 물고기가 ... 때만 움직였다는 것이다.","opts":["지루한","위험한","매혹적인","평범한"],"word":"fascinating","r":{"a":"3) 매혹적인","ev":"6번 문장","s":[[6,"Even more fascinating, some fish moved only when the octopus led the way.","더욱 흥미로운 점은, 문어가 길을 이끌 때만 일부 물고기들이 움직였다는 것이다."]],"w":"Even more은 더 놀랍다는 뜻으로 앞의 흥미로운 사실에 덧붙임. fascinating = 매혹적인, 흥미를 끄는.","c":3}},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word in this context? (The octopuses played an active role ...)","h":"2bdbc35d31","ko":"문어들은 적극적인 역할을 ...","opts":["(역할을) 맡았다","놀았다","연주했다","경기를 했다"],"word":"played","r":{"a":"1) (역할을) 맡았다","ev":"5번 문장","s":[[5,"The octopuses played an active role, sometimes punching fish to keep them focused and on task.","그 문어들은 적극적인 역할을 했으며, 때때로 물고기를 때려서 그들이 집중하고 임무에 전념하도록 했다."]],"w":"play a role은 '역할을 맡다'. play의 놀다, 연주하다 뜻은 문맥에 맞지 않음. played는 동사 play의 과거형.","c":1}},{"n":6,"t":"ref","q":"What does the underlined \"they\" refer to?\n... and if they even have favorite hunting partners.","h":"def50dff86","ko":"밑줄 친 they가 가리키는 것은?","sko":"그리고 그들이 심지어 선호하는 사냥 파트너가 있는지를 (궁금해한다).","opts":["과학자들","물고기들","사냥 파트너들","문어들"],"r":{"a":"4) 문어들","ev":"13번 문장","s":[[13,"Scientists are now curious to see if octopuses learn this behavior over time, and if they even have favorite hunting partners.","이제 과학자들은 문어가 시간이 지나면서 이러한 행동을 학습하는지, 그리고 그들이 심지어 선호하는 사냥 파트너가 있는지를 궁금해한다."]],"w":"if 뒤 절에서 앞의 주어 octopuses를 이어 받음. 좋아하는 사냥 파트너를 가졌는지 궁금한 대상은 문어.","c":4}},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"These behaviors suggest that the octopus may be the group's main decision-maker.\"","h":"66856117f8","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"이 행동들은 문어가 그 무리의 주요 의사 결정자일 수 있다는 것을 시사한다.","opts":["물고기가 무리의 결정을 내리는 중심일 수 있다.","문어가 무리의 주요 결정을 내리는 역할일 수도 있다.","문어는 물고기에게 의존해 사냥하고 있다.","문어는 혼자 사냥한다는 것이 확인되었다."],"r":{"a":"2) 문어가 무리의 주요 결정을 내리는 역할일 수도 있다.","ev":"5~7번 문장","s":[[5,"The octopuses played an active role, sometimes punching fish to keep them focused and on task.","그 문어들은 적극적인 역할을 했으며, 때때로 물고기를 때려서 그들이 집중하고 임무에 전념하도록 했다."],[6,"Even more fascinating, some fish moved only when the octopus led the way.","더욱 흥미로운 점은, 문어가 길을 이끌 때만 일부 물고기들이 움직였다는 것이다."],[7,"These behaviors suggest that the octopus may be the group’s main decision-maker.","이 행동들은 문어가 그 무리의 주요 의사 결정자일 수 있다는 것을 시사한다."]],"w":"5~6번에서 문어가 물고기를 치고 앞장서는 행동을 보임. 이를 근거로 문어가 의사 결정자일 수 있다고 시사.","c":2}},{"n":8,"t":"match","q":"Which is the same as the passage?","h":"b895263702","ko":"본문의 내용과 일치하는 것은?","oko":["문어와 물고기는 함께 사냥할 때 서로 돕는다.","물고기가 무리를 이끌고 문어가 그들을 따라간다.","과학자들은 문어가 물고기에게서 사냥을 배운다는 것을 이미 증명했다.","문어는 항상 혼자 사냥하며 물고기는 결코 함께하지 않는다."],"opts":["Octopuses and fish help each other when they hunt together.","Fish lead the group, and octopuses follow them.","Scientists have already proved that octopuses learn hunting from fish.","Octopuses always hunt alone, and fish never join them."],"r":{"a":"1) Octopuses and fish help each other when they hunt together.","ev":"6~7번, 10~11번, 13번 문장","s":[[6,"Even more fascinating, some fish moved only when the octopus led the way.","더욱 흥미로운 점은, 문어가 길을 이끌 때만 일부 물고기들이 움직였다는 것이다."],[7,"These behaviors suggest that the octopus may be the group’s main decision-maker.","이 행동들은 문어가 그 무리의 주요 의사 결정자일 수 있다는 것을 시사한다."],[10,"Octopuses help the fish by reaching into tight spaces to drive out hidden prey.","문어는 숨겨진 먹이를 몰아내려고 좁은 공간까지 몸을 뻗어 물고기를 돕는다."],[11,"In return, the fish help octopuses by using their sharp senses to find areas with plenty of food.","그 대가로, 물고기는 그들의 예리한 감각을 사용하여 풍부한 먹이가 있는 곳을 찾아내어 문어를 돕는다."],[13,"Scientists are now curious to see if octopuses learn this behavior over time, and if they even have favorite hunting partners.","이제 과학자들은 문어가 시간이 지나면서 이러한 행동을 학습하는지, 그리고 그들이 심지어 선호하는 사냥 파트너가 있는지를 궁금해한다."]],"w":"①은 10~11번 서로 돕는 내용과 일치. ②는 6~7번(문어가 이끎), ③은 13번(배우는지 궁금해하는 단계), ④는 2번(물고기와 팀을 이룸)과 어긋남.","c":1}},{"n":9,"t":"sum","q":"Octopuses, known as (A) hunters, were found to hunt with fish and may (B) the group.","h":"eb5a9ccf15","ko":"문어는 (A) 사냥꾼으로 알려졌지만 물고기와 함께 사냥하며 무리를 (B)할 수도 있다.","oko":["(A) 사회적인 / (B) 따르다","(A) 사회적인 / (B) 이끌다","(A) 독립적인 / (B) 따르다","(A) 위험한 / (B) 떠나다","(A) 독립적인 / (B) 이끌다"],"opts":["(A) social / (B) follow","(A) social / (B) lead","(A) independent / (B) follow","(A) dangerous / (B) leave","(A) independent / (B) lead"],"r":{"a":"5) (A) independent / (B) lead","ev":"1~2번, 6~7번 문장","s":[[1,"Octopuses are often known as independent hunters, using camouflage on the seafloor.","문어는 해저에서 위장술을 사용하는 독립적인 사냥꾼으로 종종 알려져 있다."],[2,"But new research reveals a surprising discovery: some octopuses team up with fish to hunt.","그러나 새로운 연구는 일부 문어들이 사냥하기 위해 물고기와 팀을 이룬다는 놀라운 발견을 밝혀냈다."],[6,"Even more fascinating, some fish moved only when the octopus led the way.","더욱 흥미로운 점은, 문어가 길을 이끌 때만 일부 물고기들이 움직였다는 것이다."],[7,"These behaviors suggest that the octopus may be the group’s main decision-maker.","이 행동들은 문어가 그 무리의 주요 의사 결정자일 수 있다는 것을 시사한다."]],"w":"1번 independent hunters로 알려졌으나 2번에서 물고기와 팀을 이룬다는 새 발견. 6~7번에서 문어가 앞장서 이끎(led the way).","c":5}},{"n":10,"t":"fill","q":"Octopuses help fish by reaching into tight spaces to [A] out hidden prey, and fish use their sharp [B] to find food.","h":"36f3c4006f","ko":"문어는 좁은 틈에 손을 뻗어 숨은 먹이를 [A] 내며 물고기를 돕고, 물고기는 예민한 [B]으로 먹이를 찾는다.","bko":{"collaborate":"협력하다","senses":"감각들","partners":"파트너들, 협력자들","drive":"몰아내다","species":"종","creatures":"생물들"},"bank":["collaborate","senses","partners","drive","species","creatures"],"r":{"a":"[A] drive, [B] senses","ev":"10~11번 문장","s":[[10,"Octopuses help the fish by reaching into tight spaces to drive out hidden prey.","문어는 숨겨진 먹이를 몰아내려고 좁은 공간까지 몸을 뻗어 물고기를 돕는다."],[11,"In return, the fish help octopuses by using their sharp senses to find areas with plenty of food.","그 대가로, 물고기는 그들의 예리한 감각을 사용하여 풍부한 먹이가 있는 곳을 찾아내어 문어를 돕는다."]],"w":"10번 drive out hidden prey, 11번 using their sharp senses to find areas with plenty of food. drive out은 '쫓아내다'. 나머지는 문법·의미상 들어갈 수 없음.","c":null}}]},{"u":2,"id":"r04","no":4,"ko":"못생길수록 최고라고요?","items":[{"n":1,"t":"tf","q":"A healthy lawn needs about 2.5 centimeters of water per week.","h":"78239b58d9","ko":"건강한 잔디밭은 일주일에 약 2.5센티미터의 물이 필요하다.","r":{"a":"T (본문과 맞는 내용)","ev":"2번 문장","s":[[2,"On average, a healthy lawn requires 2.5 centimeters of water per week — which is quite a lot — especially when it’s only there to make your yard look pretty.","평균적으로, 건강한 잔디밭은 일주일에 2.5센티미터의 물을 필요로 하는데, 그것은 꽤 많은 양이다, 특히 그것이 오로지 당신의 마당을 예쁘게 보이도록 하기 위해 존재하는 것을 생각하면 말이다."]],"w":"2번 문장에 requires 2.5 centimeters of water per week 가 그대로 나옴. 일치.","c":"T"}},{"n":2,"t":"tf","q":"The Ugliest Lawn Contest started in Sweden in 2024.","h":"b2f63d49cb","ko":"가장 못생긴 잔디밭 대회는 2024년 스웨덴에서 시작되었다.","r":{"a":"F (본문과 다른 내용)","ev":"9번 문장","s":[[9,"The contest started as a local event in Gotland, Sweden, in 2022, after water shortages prompted the community to reconsider their water use.","그 대회는 물 부족이 지역 사회로 하여금 그들의 물 사용을 재고하도록 촉구한 이후인 2022년에 스웨덴 고틀란드에서 지역 행사로 시작되었다."]],"w":"대회는 2022년에 스웨덴 Gotland에서 시작됨(9번). 2024년은 세계적 운동으로 커진 시점(10번). 연도를 바꾼 진술.","c":"F"}},{"n":3,"t":"tf","q":"People are asked to share a photo of their lawn on Instagram.","h":"4fca3ce607","ko":"사람들은 자신의 잔디밭 사진을 인스타그램에 공유하도록 요청받는다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"Then, snap a photo of your “ugly” lawn and share it on Instagram.","그런 다음, 당신의 ‘못생긴’ 잔디밭의 사진을 찍어 인스타그램에 공유해라."]],"w":"7번 문장 snap a photo ... and share it on Instagram. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"What does the underlined word “conserve” mean in sentence 4?","h":"60bdd7c78a","ko":"4번 문장의 밑줄 친 “conserve”의 뜻은?","opts":["낭비하다","오염시키다","절약하다","측정하다"],"word":"conserve","r":{"a":"3) 절약하다","ev":"4번 문장","s":[[4,"This fun competition encourages people to conserve water by ________.","이 재미있는 대회는 그들의 잔디밭을 방치함으로써 사람들이 물을 절약하도록 장려한다."]],"w":"conserve water = 물을 절약하다. 잔디에 물을 주지 않아 물을 아끼자는 .","그 대회는 잔디밭을 더 예쁘게 보이게 하려고 만들어졌다."],"opts":["The contest is held only in Sweden.","Participants must water their lawns every day.","The contest began after water shortages made the community rethink its water use.","The contest was created to make lawns look prettier."],"r":{"a":"3) The contest began after water shortages made the community rethink its water use.","ev":"9번 문장","s":[[9,"The contest started as a local event in Gotland, Sweden, in 2022, after water shortages prompted the community to reconsider their water use.","그 대회는 물 부족이 지역 사회로 하여금 그들의 물 사용을 재고하도록 촉구한 이후인 2022년에 스웨덴 고틀란드에서 지역 행사로 시작되었다."]],"w":"9번 문장 water shortages prompted the community to reconsider their water use. 1은 10번(전 세계 참가자)과 반대, 2는 5번(물 주지 않기)과 반대, 4는 3번(물 절약이 목적)과 어긋남.","c":3}},{"n":9,"t":"sum","q":"The World’s Ugliest Lawn Contest asks people to stop (A) their lawns so that they can (B) water.","h":"4fbc71a714","ko":"가장 못생긴 잔디밭 대회는 사람들이 물을 (B)할 수 있도록 잔디밭에 (A)하는 것을 그만두라고 요청한다.","oko":["(A) 물을 주는 것 / (B) 낭비하다","(A) 사진을 찍는 것 / (B) 절약하다","(A) 심는 것 / (B) 낭비하다","(A) 물을 주는 것 / (B) 절약하다","(A) 공유하는 것 / (B) 절약하다"],"opts":["(A) watering / (B) waste","(A) photographing / (B) conserve","(A) planting / (B) waste","(A) watering / (B) conserve","(A) sharing / (B) conserve"],"r":{"a":"4) (A) watering / (B) conserve","ev":"3~5번 문장","s":[[3,"That’s exactly why The World’s Ugliest Lawn Contest was created!","그것이 바로 ‘세계에서 가장 못생긴 잔디밭 대회’가 만들어진 이유이다!"],[4,"This fun competition encourages people to conserve water by ________.","이 재미있는 대회는 그들의 잔디밭을 방치함으로써 사람들이 물을 절약하도록 장려한다."],[5,"Here’s what you need to do: instead of watering your lawn, let it dry out naturally.","당신이 해야 하는 것은 바로 잔디밭에 물을 주는 대신, 잔디를 자연적으로 완전히 마르게 하는 것이다."]],"w":"5번 instead of watering your lawn, 4번 conserve water. 물 주기를 멈추고 물을 절약하는 것이 대회의 핵심.","c":4}},{"n":10,"t":"fill","q":"To save water, people stop [A] their lawns and let them [B] out naturally, then share photos of them.","h":"c6592bfb5c","ko":"물을 아끼기 위해 사람들은 잔디밭에 [A]를 멈추고 자연스럽게 [B]도록 ,"(A) active / (B) marketing","(A) lazy / (B) cooking","(A) hungry / (B) security"],"r":{"a":"3) (A) active / (B) marketing","ev":"6~10번 문장","s":[[6,"The device records their steps and activity levels without disturbing them.","그 장치는 닭들을 방해하지 않으며 걸음 수와 활동 수준을 기록한다."],[7,"On average, each chicken takes over 21,000 steps in just 12 hours.","평균적으로, 각각의 닭은 12시간 만에 21,000보 이상의 걸음을 걷는다."],[8,"This is a huge contrast to the motionless lives of caged chickens — or even most humans!","이것은 새장에 갇혀 움직이지 않는 닭의 삶, 심지어 대부분의 인간들의 삶과도 큰 대조를 이룬다!"],[9,"The activity data is printed directly onto the eggs, offering consumers a clear view of the chickens’ quality of (B).","그 활동 데이터는 달걀에 바로 인쇄되어, 소비자들에게 닭들의 삶의 질에 대한 명확한 시각을 제공한다."],[10,"FitChix is more than just a tool for animal welfare; it’s a powerful marketing strategy.","FitChix는 동물 복지를 위한 단순한 도구 이상으로, 강력한 마케팅 전략이기도 하다."]],"w":"6번 activity levels 기록, 7번 21,000 steps로 활동적인 닭을 보여 줌. 10번 powerful marketing strategy.","c":3}},{"n":10,"t":"fill","q":"FitChix [A] each chicken’s steps, and the data helps [B] consumers that the chickens live well.","h":"46cf0a47dd","ko":"FitChix는 닭 한 마리 한 마리의 걸음 수를 [A]하고, 그 데이터는 닭이 잘 지낸다는 것을 소비자에게 [B]하는 데 도움이 된다.","bko":{"roam":"돌아다니다","records":"기록하다","demand":"수요","spacious":"넓은","disturb":"방해하다","assure":"안심시키다"},"bank":["roam","records","demand","spacious","disturb","assure"],"r":{"a":"[A] records, [B] assure","ev":"2번, 6번 문장","s":[[2,"An Australian company, Honest Eggs, has found a creative way to assure you that their chickens are healthy and happy: a fitness tracker for chickens called FitChix.","호주의 한 기업인 Honest Eggs는 그들의 닭이 건강하고 행복하다고 당신을 안심시켜 줄 창의적인 방법을 찾아냈는데, 바로 FitChix라고 불리는 닭을 위한 건강 지표 추적기이다."],[6,"The device records their steps and activity levels without disturbing them.","그 장치는 닭들을 방해하지 않으며 걸음 수와 활동 수준을 기록한다."]],"w":"6번 The device records their steps, 2번 a creative way to assure you. [A]는 주어 FitChix 뒤 3인칭 단수 records, [B]는 help 뒤 동사원형 assure(안심시키다).","c":null}}]},{"u":2,"id":"r06","no":6,"ko"  “last” mean in sentence 10?","h":"d56f843dc6","ko":"10번 문장의 밑줄 친 “last”의 뜻은?","opts":["지속되다","최근의","첫 번째의","마지막의"],"word":"last","r":{"a":"4) 마지막의","ev":"10번 문장","s":[[10,"The last known knocker-upper was an 84-year-old man who retired in that decade.","마지막으로 알려진 노커 어퍼는 그 시대에 은퇴한 84세의 남성이었다."]],"w":"last known knocker-upper의 last는 형용사 ‘마지막의’. 동사 last(지속되다)와 구별해야 하는 다의어. 11번에서 end(끝)로 이어짐.","c":4}},{"n":6,"t":"ref","q":"In sentence 5, what does “They” refer to?","h":"dfdb683579","ko":"5번 문장의 “They”가 가리키는 것은?","sko":"그들은 노동자들의 창문이나 문을 두드리거나 노크하기 위해 이런 도구를 사용했다.","opts":["노커 어퍼","공장 노동자","창문과 문","영국 사람들"],"r":{"a":"1) 노커 어퍼","ev":"4번 문장","s":[[4,"As the sun began to rise, knocker-uppers walked through the streets carrying long sticks, soft hammers, or pea shooters.","해가 뜨기 시작할 때, 노커 어퍼는 긴 막대, 부드러운 재질의 망치, 또는 완두콩 총을 든 채 거리를 걸었다."]],"w":"They는 4번 문장의 주어 knocker-uppers를 가리킴. 도구를 들고 창문과 문을 두드린 사람들.","c":1}},{"n":7,"t":"sense","q":"What does sentence 6, “The knocks were hard enough to wake the person inside but soft enough not to bother anyone else.”, mean?","h":"f4e0f6efad","ko":"6번 문장 “The knocks were hard enough to wake the person inside but soft enough not to bother anyone else.”의 의미로 알맞은 것은?","sko":"노크는 안에 있는 사람을 깨울 정도로 충분히 셌지만 다른 사람을 방해하지 않을 정도로 충분히 부드러웠다.","opts":["두드리는 소리가 약해서 안의 사람이 깨지 못했다","안의 사람은 깨우되 다른 사람은 방해하지 않을 세기였다","이웃 모두를 깨울 만큼 컸다","소리 없이 두드렸다"],"r":{"a":"2) 안의 사람은 깨우되 다른 사람은 방해하지 않을 세기였다","ev":"6번 문장","s":[[6,"The knocks were hard enough to wake the person inside but soft enough not to bother anyone else.","노크는 안에 있는 사람을 깨울 정도로 충분히 셌지만 다른 사람을 방해하지 않을 정도로 충분히 부드러웠다."]],"w":"「형용사 + enough to-v」 = ~할 만큼 충분히 …한. 안의 사람은 깨울 만큼 세게, 다른 사람은 방해하지 않을 만큼 부드럽게.","c":2}},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","h":"666f421433","ko":"본문의 내용과 일치하는 것은?","oko":["노커 어퍼는 절대 변하지 않는 고정 요금을 받았다.","알람 시계는 산업혁명 이전에 보편화되었다.","노커 어퍼라는 직업은 1940년대에 모든 곳에서 사라졌다.","노커 어퍼는 사람들을 깨우려고 막대, 부드러운 망치, 또는 완두콩 총을 들고 다녔다."],"opts":["Knocker-uppers received a fixed fee that never changed.","Alarm clocks became common before the Industrial Revolution.","The job of the knocker-upper disappeared everywhere in the 1940s.","Knocker-uppers carried sticks, soft hammers, or pea shooters to wake people."],"r":{"a":"4) Knocker-uppers carried sticks, soft hammers, or pea shooters to wake people.","ev":"4번 문장","s":[[4,"As the sun began to rise, knocker-uppers walked through the streets carrying long sticks, soft hammers, or pea shooters.","해가 뜨기 시작할 때, 노커 어퍼는 긴 막대, 부드러운 재질의 망치, 또는 완두콩 총을 든 채 거리를 걸었다."]],"w":"4번 문장 carrying long sticks, soft hammers, or pea shooters. 1은 7번(varied)과 반대, 2는 8번(1940~50년대)과 어긋남, 3은 9번(일부 지역은 1970년대까지)과 반대.","c":4}},{"n":9,"t":"sum","q":"Factory workers in Britain relied on (A) to wake up, but the job (B) after alarm clocks and electricity became common.","h":"9bfcae923c","ko":"영국 공장 노동자들은 일어나기 위해 (A)에 의존했지만, 알람 시계와 전기가 흔해지자 그 직업은 (B).","oko":["(A) 노커 어퍼 / (B) 덜 인기 있게 되었다","(A) 노커 어퍼 / (B) 더 인기 있게 되었다","(A) 알람 시계 / (B) 덜 인기 있게 되었다","(A) 공장 주인 / (B) 더 인기 있게 되었다","(A) 알람 시계 / (B) 더 인기 있게 되었다"],"opts":["(A) knocker-uppers / (B) became less popular","(A) knocker-uppers / (B) became more popular","(A) alarm clocks / (B) became less popular","(A) factory owners / (B) became more popular","(A) alarm clocks / (B) became more popular"],"r":{"a":"1) (A) knocker-uppers / (B) became less popular","ev":"3번, 8번 문장","s":[[3,"Factory workers, (A), relied on a person called a ‘knocker-upper’ to wake them up each morning.","공장 노동자들은, 특히, 매일 아침 그들을 깨우는 데 ‘노커 어퍼’라고 불리는 사람에 의존했다."],[8,"By the 1940s and 1950s, alarm clocks and electricity became common and made the job less popular.","1940년대와 1950년대쯤에는, 알람 시계와 전기가 보편화되었고 그 직업을 덜 인기 있게 만들었다."]],"w":"3번 relied on a person called a ‘knocker-upper’, 8번 made the job less popular. 알람 시계가 생기기 전의 일.","c":1}},{"n":10,"t":"fill","q":"Knocker-uppers [A] a small fee for their service, but the job faded when alarm clocks became [B].","h":"0885697601","ko":"노커 어퍼는 서비스의 대가로 적은 요금을 [A]지 the flower and attempts to mate with the fake fly.","수컷 파리는 꽃에 내려앉아 가짜 파리와 짝짓기하려고 시도한다."],[7,"While its efforts fail, the daisy ⓔ benefits by collecting pollen from the male fly.","그것의 노력이 실패하는 동안, 데이지는 수컷 파리로부터 꽃가루를 얻어 이익을 얻는다."]],"w":"4번 문장에서 가짜 파리를 만들고(creating), 5~7번 문장에서 속아 날아온 수컷 파리에게서 꽃가루를 모음. 암컷이 아니라 수컷이 속는 쪽.","c":5}},{"n":10,"t":"fill","q":"The daisy creates [A] female flies on its petals, and male flies are [B] into thinking they have found a mate.","h":"4b3910d4e0","ko":"데이지는 꽃잎에 가짜 암컷 파리를 만들고, 수컷 파리는 짝을 찾았다고 생각하게 속는다.","bko":{"fake":"가짜의","fooled":"속은","harsh":"혹독한","secure":"지키다, 확보하다","short":"짧은","challenging":"힘든, 도전적인"},"bank":["fake","fooled","harsh","secure","short","challenging"],"r":{"a":"[A] fake, [B] fooled","ev":"4~5번 문장","s":[[4,"It uses bright colors and sweet smells to attract pollinators, but it also has another ⓒ brilliant trick: creating fake female flies on its petals!","그것은 꽃가루 매개체를 유인하는 데 밝은색과 달콤한 냄새를 사용하지만, 또 다른 탁월한 속임수도 가지고 있는데, 바로 꽃잎 위에 가짜 암컷 파리를 만들어내는 것이다!"],[5,"These three-dimensional fake flies, complete with hairy bumps and white markings, look so ⓓ unrealistic that male flies are fooled into thinking they’ve found a mate.","털이 많은 돌기와 흰색 무늬까지 모두 갖춘 이 입체적인 가짜 파리들은, 너무나 가짜처럼(→ 진짜처럼) 보여서 수컷 파리들은 짝을 찾은 것처럼 속게 된다."]],"w":"4번 문장의 fake female flies, 5번 문장의 male flies are fooled into thinking they’ve found a mate에서 가져온 표현. 나머지는 환경을 설명하는 단어.","c":null}}]},{"u":3,"id":"r09","no":9,"ko":"둘 다 잘해야 진짜 챔피언","items":[{"n":1,"t":"tf","q":"Chessboxing players alternate between chess rounds and boxing rounds.","h":"97e87f34d1","ko":"체스복싱 선수들은 체스 라운드와 복싱 라운드를 번갈아 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"5번 문장","s":[[5,"In chessboxing, players are divided into weight classes and alternate between chess and boxing rounds.","체스복싱에서는, 선수들이 체급으로 나뉘며 체스와 복싱 라운드를 번갈아 해야 합니다."]],"w":"5번 문장에 alternate between chess and boxing rounds. 그대로 일치.","c":"T"}},{"n":2,"t":"tf","q":"A chessboxing match ends only when a player wins by knockout.","h":"5ef7c32c60","ko":"체스복싱 경기는 한 선수가 녹아웃으로 이길 때만 끝난다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"The match continues until a player wins in either game — by checkmate, knockout (KO), or resignation.","경기는 한 선수가 체크메이트, 녹아웃(KO), 또는 기권으로 어느 한 시합에서든 승리할 때까지 계속됩니다."]],"w":"6번 문장에서 승리 방법은 checkmate, knockout, resignation 세 가지. 녹아웃만이 아님.","c":"F"}},{"n":3,"t":"tf","q":"Competitors must have a chess rating and boxing experience to compete in an official match.","h":"699e5ff6dc","ko":"공식 경기에 나가려면 체스 등급과 복싱 경험이 있어야 한다.","r":{"a":"T (본문과 맞는 내용)","ev":"7번 문장","s":[[7,"To compete in an official match, competitors must have a recognized chess rating and experience in boxing.","공식 경기에 출전하려면, 참가자는 공인된 체스 등급과 복싱 경험이 있어야 합니다."]],"w":"7번 문장에 must have a recognized chess rating and experience in boxing. 일치.","c":"T"}},{"n":4,"t":"vocab","q":"Players alternate between chess and boxing rounds.","h":"7fb601b537","ko":"선수들은 체스 라운드와 복싱 라운드를 번갈아 한다.","opts":["대신하다","선택하다","번갈아 하다","반복을 피하다"],"word":"alternate","r":{"a":"3) 번갈아 하다","ev":"5번 문장","s":[[5,"In chessboxing, players are divided into weight classes and alternate between chess and boxing rounds.","체스복싱에서는, 선수들이 체급으로 나뉘며 체스와 복싱 라운드를 번갈아 해야 합니다."]],"w":"alternate between A and B = A와 B를 번갈아 하다. 체스와 복싱 라운드가 교대로 진행되는 뜻.","c":3}},{"n":5,"t":"vocab","q":"Chess is quiet and strategic, while boxing is loud and physical.","h":"467e3311b2","ko":"체스는 조용하고 전략적인 반면, 복싱은 시끄럽고 격렬하다.","opts":["물리학의","육체적인, 몸을 쓰는","정신적인","전략적인"],"word":"physical","r":{"a":"2) 육체적인, 몸을 쓰는","ev":"9번 문장","s":[[9,"Chess is quiet and strategic, while boxing is loud and physical.","체스는 조용하고 전략적인 반면, 복싱은 소리가 크고 육체적입니다."]],"w":"while로 체스(quiet, strategic)와 복싱(loud, physical)을 대비. physical은 여기서 '몸을 쓰는, 육체적인'. 물리학 뜻은 문맥에 맞지 않음.","c":2}},{"n":6,"t":"ref","q":"In sentence 11, 'it' refers to ___.","h":"95ff27bfbb","ko":"11번 문장의 it이 가리키는 것은?","sko":"한 번 움직이면, 되돌릴 수 없습니다","opts":["한 번의 움직임","체스 말 하나","하나의 경기","오랜 연습"],"r":{"a":"1) 한 번의 움직임","ev":"11번 문장","s":[[11,"In both, every move counts — once you make it, there’s no turning back.","둘 다에서, 매 움직임이 중요합니다 — 한 번 움직이면, 되돌릴 수 없습니다."]],"w":"앞 절 every move counts의 move를 받음. 한 번 움직임을 하면(make it) 되돌릴 수 없다는 뜻.","c":1}},{"n":7,"t":"sense","q":"[8] At first glance, chess and boxing seem like complete opposites.","h":"7ca6418d5b","ko":"처음 봐서는 체스와 복싱은 완전히 정반대처럼 보인다.","sko":"처음 봐서는, 체스와 복싱은 완전히 반대인 것처럼 보입니다.","opts":["체스와 복싱은 실제로 완전히 같음","처음에는 체스를 먼저 시작함","복싱이 체스보다 먼저 생김","체스와 복싱은 처음 보면 정반대로 보임"],"r":{"a":"4) 체스와 복싱은 처음 보면 정반대로 보임","ev":"8~9번 문장","s":[[8,"At first glance, chess and boxing seem like complete opposites.","처음 봐서는, 체스와 복싱은 완전히 반대인 것처럼 보입니다."],[9,"Chess is quiet and strategic, while boxing is loud and physical.","체스는 조용하고 전략적인 반면, 복싱은 소리가 크고 육체적입니다."]],"w":"at first glance = 처음 봐서는. seem like = ~처럼 보인다. 이어지는 9번 문장에서 quiet와 loud 대비로 설명하고, 10번 문장의 Yet에서 공통점으로 전환.","c":4}},{"n":8,"t":"match","q":"Which is consistent with the passage?","h":"4f20dcc9cd","ko":"글의 내용과 일치하는 것은?","oko":["체스복싱은 같은 나이의 선수들끼리만 한다.","체스복싱 선수들은 체급으로 나뉜다.","체스와 복싱은 둘 다 약간의 연습만 요구한다.","그 스포츠는 세계복싱협회가 관리한다."],"opts":["Chessboxing is played only by players of the same age.","Players in chessboxing are divided into weight classes.","Chess and boxing both demand only a little practice.","The sport is governed by the World Boxing Association."],"r":{"a":"2) Players in chessboxing are divided into weight classes.","ev":"5번 문장","s":[[5,"In chessboxing, players are divided into weight classes and alternate between chess and boxing rounds.","체스복싱에서는, 선수들이 체급으로 나뉘며 체스와 복싱 라운드를 번갈아 해야 합니다."]],"w":"5번 문장에 players are divided into weight classes. 3번은 years of practice(10번 문장)와 반대. 4번은 World Chessboxing Organization(4번 문장). 1번은 본문에 없음.","c":2}},{"n":9,"t":"sum","q":"Chess and boxing look (A) ___, but both demand (B) ___, so chessboxing is a hybrid sport.","h":"191fffd76f","ko":"체스와 복싱은 (A)해 보이지만 둘 다 (B)을 요구하므로 체스복싱은 혼합 스포츠이다.","oko":["(A) 비슷한 / (B) 운","(A) 다른 / (B) 운","(A) 비슷한 / (B) 집중","(A) 지루한 / (B) 돈","(A) 다른 / (B) 집중"],"opts":["(A) similar / (B) luck","(A) different / (B) luck","(A) similar / (B) focus","(A) boring / (B) money","(A) different / (B) focus"],"r":{"a":"5) (A) different / (B) focus","ev":"8~12번 문장","s":[[8,"At first glance, chess and boxing seem like complete opposites.","처음 봐서는, 체스와 복싱은 완전히 반대인 것처럼 보입니다."],[9,"Chess is quiet and strategic, while boxing is loud and physical.","체스는 조용하고 전략적인 반면, 복싱은 소리가 크고 육체적입니다."],[10,"Yet, both demand intense focus, stamina, and years of practice to master.","그러나, 둘 다 숙달하기 위해서는 강한 집중력, 체력, 그리고 수년간의 연습을 필요로 합니다."],[11,"In both, every move counts — once you make it, there’s no turning back.","둘 다에서, 매 움직임이 중요합니다 — 한 번 움직이면, 되돌릴 수 없습니다."],[12,"This blend of opposites and similarities makes chessboxing a perfect hybrid sport.","이러한 반대되는 점과 유사점의 조합은 체스복싱을 완벽한 하이브리드 스포츠로 만듭니다."]],"w":"8번 문장에서 정반대처럼 보이지만(different), 10번 문장에서 둘 다 intense focus를 요구한다고 함. 12번 문장에서 이 조합을 hybrid sport라 부름.","c":5}},{"n":10,"t":"fill","q":"Chess and boxing seem like complete [A], but both demand intense focus, so chessboxing is a perfect [B] sport.","h":"5cae0251a4","ko":"체스와 복싱은 완전히 정반대처럼 보이지만 둘 다 강한 집중을 요구하므로, 체스복싱은 완벽한 혼합 스포츠이다.","bko":{"opposites":"정반대(인 것)","hybrid":"혼합의, 하이브리드","similarities":"유사점","officially":"공식적으로","recognized":"공인된","resignation":"기권, 사임"},"bank":["opposites","hybrid","similarities","officially","recognized","resignation"],"r":{"a":"[A] opposites, [B] hybrid","ev":"8번, 10번, 12번 문장","s":[[8,"At first glance, chess and boxing seem like complete opposites.","처음 봐서는, 체스와 복싱은 완전히 반대인 것처럼 보입니다."],[10,"Yet, both demand intense focus, stamina, and years of practice to master.","그러나, 둘 다 숙달하기 위해서는 강한 집중력, 체력, 그리고 수년간의 연습을 필요로 합니다."],[12,"This blend of opposites and similarities makes chessboxing a perfect hybrid sport.","이러한 반대되는 점과 유사점의 조합은 체스복싱을 완벽한 하이브리드 스포츠로 만듭니다."]],"w":"8번 문장 complete opposites, 12번 문장 perfect hybrid sport에서 가져온 표현. similarities는 8번 문장 내용과 반대.","c":null}}]},{"u":4,"id":"r10","no":10,"ko":"내 꿈에서는 내가 결정해!","items":[{"n":1,"t":"tf","q":"Unlike ordinary dreams, lucid dreaming allows you to take control of the story.","h":"53638e92ac","ko":"일반 꿈과 달리 자각몽에서는 이야기를 통제할 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"Unlike ordinary dreams, lucid dreaming allows you to ⓐ take control of the story.","일반적인 꿈과 달리, 자각몽은 당신이 이야기를 통제할 수 있게 한다."]],"w":"3번 문장 그대로. Unlike ordinary dreams 뒤에 take control of the story가 나옴.","c":"T"}},{"n":2,"t":"tf","q":"Lucid dreaming usually occurs during a deep sleep stage.","h":"db70809f31","ko":"자각몽은 보통 깊은 수면 단계에서 발생한다.","r":{"a":"F (본문과 다른 내용)","ev":"5번 문장","s":[[5,"Lucid dreaming usually occurs during REM sleep, a light sleep stage when dreams are the most vivid.","자각몽은 보통 꿈이 가장 생생한 얕은 수면 단계인 렘수면 중에 발생한다."]],"w":"5번 문장은 REM sleep, a light sleep stage(얕은 수면 단계)라고 함. deep으로 바꾼 것이 오류.","c":"F"}},{"n":3,"t":"tf","q":"Athletes use lucid dreams as a mental space to rehearse their techniques.","h":"33ba151bee","ko":"운동선수들은 자각몽을 기술을 예행연습하는 정신적 공간으로 사용한다.","r":{"a":"T (본문과 맞는 내용)","ev":"12번 문장","s":[[12,"In the same way, athletes use lucid dreams as a mental space to rehearse and refine their techniques.","마찬가지로, 운동선수들은 자각몽을 그들의 기술을 연습하고 개선하는 정신적 공간으로 활용한다."]],"w":"12번 문장에 mental space to rehearse and refine their techniques가 그대로 나옴.","c":"T"}},{"n":4,"t":"vocab","q":"Choose the meaning of the underlined word in the sentence: \"a light sleep stage when dreams are the most vivid.\"","h":"cd6e99fd5a","ko":"밑줄 친 단어의 뜻: \"꿈이 가장 생생한 얕은 수면 단계\"","opts":["조용한","희미한","생생한","짧은"],"word":"vivid","r":{"a":"3) 생생한","ev":"5번 문장","s":[[5,"Lucid dreaming usually occurs during REM sleep, a light sleep stage when dreams are the most vivid.","자각몽은 보통 꿈이 가장 생생한 얕은 수면 단계인 렘수면 중에 발생한다."]],"w":"vivid = 생생한, 선명한. REM 수면은 꿈이 가장 생생한 단계라는 문맥. 희미한(faint)은 반대 뜻.","c":3}},{"n":5,"t":"vocab","q":"Choose the meaning of the underlined word \"state\" in sentence 6: \"This self-aware dream state offers meaningful benefits.\"","h":"bc039879b7","ko":"6번 문장 \"이 자각하는 꿈의 상태는 의미 있는 이점을 제공한다\"에서 밑줄 단어의 뜻","opts":["주(州)","상태","말하다","나라"],"word":"state","r":{"a":"2) 상태","ev":"6번 문장","s":[[6,"This self-aware dream state offers meaningful ⓑ benefits.","이 자각하는 꿈의 상태는 의미 있는 이점들을 제공한다."]],"w":"state는 '주, 나라, 말하다' 등 여러 뜻이 있으나 dream state는 꿈의 상태. 문맥상 '상태'.","c":2}},{"n":6,"t":"ref","q":"In sentence 8, \"They\" refers to","h":"aa223d49aa","ko":"8번 문장의 They가 가리키는 것은?","sko":"그들은 스트레스가 많은 시나리오를 중립적이거나 심지어 긍정적인 시나리오로 바꿀 수 있다.","opts":["악몽을 자주 꾸는 사람들","예술가와 작가들","스트레스를 주는 상황들","운동선수들"],"r":{"a":"1) 악몽을 자주 꾸는 사람들","ev":"7~8번 문장","s":[[7,"For those who frequently experience nightmares, realizing that they are dreaming allows them to reshape their dreams as they wish.","악몽을 자주 경험하는 사람들에게는, 자신이 꿈을 꾸고 있다는 것을 깨닫는 것이 그들이 원하는 대로 꿈을 고칠 수 있게 해준다."],[8,"They can transform stressful scenarios into neutral or even positive ones.","그들은 스트레스가 많은 시나리오를 중립적이거나 심지어 긍정적인 시나리오로 바꿀 수 있다."]],"w":"7번 문장의 주인공은 악몽을 자주 꾸는 사람들(those who frequently experience nightmares). 8번 They는 그들을 받음. 스트레스 상황은 transform의 대상(목적어).","c":1}},{"n":7,"t":"sense","q":"What does \"In the same way\" at the start of sentence 12 signal?","h":"ddc88a17f0","ko":"12번 문장 첫머리의 In the same way가 나타내는 흐름은?","sko":"마찬가지로 (앞 문장과 같은 방식으로)","opts":["앞 문장과 반대되는 사례를 든다","앞 문장(예술가·작가)과 비슷한 활용 사례를 덧붙인다","앞 문장 내용의 결과를 말한다","전혀 다른 주제로 바꾼다"],"r":{"a":"2) 앞 문장(예술가·작가)과 비슷한 활용 사례를 덧붙인다","ev":"11~12번 문장","s":[[11,"Artists and writers often gain inspiration by exploring fresh ideas and unique stories in their lucid dreams.","예술가와 작가들은 그들의 자각몽 속에서 신선한 아이디어와 독특한 이야기를 탐구하며 종종 영감을 얻는다."],[12,"In the same way, athletes use lucid dreams as a mental space to rehearse and refine their techniques.","마찬가지로, 운동선수들은 자각몽을 그들의 기술을 연습하고 개선하는 정신적 공간으로 활용한다."]],"w":"In the same way = 마찬가지로. 11번의 예술가·작가 사례에 이어 운동선수 사례를 덧붙임. 반대/결과/주제 전환 표현이 아님.","c":2}},{"n":8,"t":"match","q":"Which of the following is true according to the passage?","h":"44ab03c8d2","ko":"본문과 일치하는 것은?","oko":["자각몽은 항상 가장 깊은 수면 단계에서 일어난다.","운동선수들은 꿈을 통해 현실의 기술을 향상시킬 수 없다.","사람들은 스트레스를 주는 꿈속 상황을 긍정적인 상황으로 바꿀 수 있다.","자각몽은 대부분의 사람들에게 악몽을 더 스트레스 받게 만든다."],"opts":["Lucid dreaming always happens during the deepest sleep stage.","Athletes cannot improve real-life skills through their dreams.","People can turn stressful dream scenarios into positive ones.","Lucid dreaming makes nightmares more stressful for most people."],"r":{"a":"3) People can turn stressful dream scenarios into positive ones.","ev":"8번 문장","s":[[8,"They can transform stressful scenarios into neutral or even positive ones.","그들은 스트레스가 많은 시나리오를 중립적이거나 심지어 긍정적인 시나리오로 바꿀 수 있다."]],"w":"8번 문장: transform stressful scenarios into neutral or even positive ones. ①은 5번(얕은 수면)과 다름, ②는 13번(real-life improvements)과 반대, ④는 7~8번과 반대.","c":3}},{"n":9,"t":"sum","q":"Lucid dreaming lets people take (A) of their dreams and turn (B) scenes into neutral or positive ones.","h":"4a5b7ca599","ko":"자각몽은 사람들이 꿈을 (A)하게 하고 (B) 장면을 중립적이거나 긍정적인 장면으로 바꾸게 해 준다.","oko":["(A) 책임 / (B) 지루한","(A) 통제 / (B) 스트레스를 주는","(A) 메모 / (B) 창의적인","(A) 두려움 / (B) 스트레스를 주는","(A) 통제 / (B) 익숙한"],"opts":["(A) charge / (B) boring","(A) control / (B) stressful","(A) notes / (B) creative","(A) fear / (B) stressful","(A) control / (B) familiar"],"r":{"a":"2) (A) control / (B) stressful","ev":"3번, 7~8번 문장","s":[[3,"Unlike ordinary dreams, lucid dreaming allows you to ⓐ take control of the story.","일반적인 꿈과 달리, 자각몽은 당신이 이야기를 통제할 수 있게 한다."],[7,"For those who frequently experience nightmares, realizing that they are dreaming allows them to reshape their dreams as they wish.","악몽을 자주 경험하는 사람들에게는, 자신이 꿈을 꾸고 있다는 것을 깨닫는 것이 그들이 원하는 대로 꿈을 고칠 수 있게 해준다."],[8,"They can transform stressful scenarios into neutral or even positive ones.","그들은 스트레스가 많은 시나리오를 중립적이거나 심지어 긍정적인 시나리오로 바꿀 수 있다."]],"w":"꿈을 자기 뜻대로 바꿀 수 있고(take control, reshape), 스트레스를 주는 장면(stressful scenarios)을 중립적이거나 긍정적으로 바꿈. 정답 control + stressful.","c":2}},{"n":10,"t":"fill","q":"Lucid dreaming lets people [A] their dreams as they wish and [B] their creativity.","h":"8a349f121f","ko":"자각몽은 사람들이 바라는 대로 꿈을 [A]하고 창의성을 [B]하게 해 준다.","bko":{"reshape":"고 땅에서 들어 올려 다른 발을 땅속으로 더 깊숙이 누른다."]],"w":"6번 문장: To pinpoint the vibration's source, elephants sometimes lift one foot off the ground.","c":"T"}},{"n":4,"t":"vocab","q":"Choose the meaning of the underlined word in the sentence: \"pick up these faint signals.\"","h":"c1b89d97c4","ko":"밑줄 친 단어의 뜻: \"이 희미한 신호들을 포착한다\"","opts":["희미한","강한","무거운","시끄러운"],"word":"faint","r":{"a":"1) 희미한","ev":"5번 문장","s":[[5,"The thick, fatty pads under their feet pick up these faint signals, and special nerve endings in their feet detect ⓒ them.","그들의 발 아래의 두껍고 지방이 많은 패드는 이 희미한 신호들을 포착하고, 그들의 발에 있는 특수 신경 말단은 그것들을 감지한다."]],"w":"faint = 희미한. 발바닥이 약한 신호까지 잡아낸다는 문맥. 책 단어목록에도 faint 희미한.","c":1}},{"n":5,"t":"vocab","q":"Choose the meaning of the underlined word in the sentence: \"The thick, fatty pads ... pick up these faint signals.\"","h":"075672cd15","ko":"밑줄 친 pick up의 문맥상 뜻: \"두껍고 지방이 많은 패드가 이 희미한 신호들을 ~한다\"","opts":["집어 올리다","차로 데리러 가다","점점 나아지다","포착하다"],"word":"pick up","r":{"a":"4) 포착하다","ev":"5번 문장","s":[[5,"The thick, fatty pads under their feet pick up these faint signals, and special nerve endings in their feet detect ⓒ them.","그들의 발 아래의 두껍고 지방이 많은 패드는 이 희미한 신호들을 포착하고, 그들의 발에 있는 특수 신경 말단은 그것들을 감지한다."]],"w":"pick up은 다의어(집어 올리다, 데리러 가다, 나아지다, 포착하다). 신호가 목적어이므로 '포착하다'.","c":4}},{"n":6,"t":"ref","q":"In sentence 5, \"them\" refers to","h":"2c544dfb3d","ko":"5번 문장의 them이 가리키는 것은?","sko":"그들의 발에 있는 특수 신경 말단은 그것들을 감지한다","opts":["코끼리의 발","신경 말단","희미한 신호들","지방질 패드"],"r":{"a":"3) 희미한 신호들","ev":"5번 문장","s":[[5,"The thick, fatty pads under their feet pick up these faint signals, and special nerve endings in their feet detect ⓒ them.","그들의 발 아래의 두껍고 지방이 많은 패드는 이 희미한 신호들을 포착하고, 그들의 발에 있는 특수 신경 말단은 그것들을 감지한다."]],"w":"신경 말단이 감지(detect)하는 대상은 앞의 these faint signals(희미한 신호들). 발·패드·신경 말단은 감지하는 쪽.","c":3}},{"n":7,"t":"sense","q":"What does sentence 2, \"it goes without saying that survival is a daily struggle,\" mean?","h":"9108832c1d","ko":"2번 문장 \"생존이 매일의 힘든 일이라는 것은 말할 필요도 없다\"의 의미로 알맞은 것은?","sko":"생
