P(1,"CU",1,"c","(알맞지 않은 것) Joan is a ___ girl.","love","Joan is a smart girl. / Joan is a polite girl.","조앤은 영리한[공손한] 소녀이다.",U1A1,"1) girl(소녀)은 명사예요. 명사 앞에서 꾸며 주는 말은 형용사예요.  2) smart(영리한), polite(공손한), love(사랑, 사랑하다) 중 형용사가 아닌 것을 찾아요.","l로 시작하고 네 글자예요. 꾸며 주는 말이 아니에요.","a ___ girl(명사 앞) → 형용사만 가능 (love는 형용사 아님)",["smart","polite","love"]);
P(1,"CU",2,"c","(알맞지 않은 것) We have ___ time now.","a few","We have a little time now. / We have a lot of time now.","우리는 지금 시간이 조금[많이] 있다.",U1B2,"1) time(시간)은 셀 수 없는 명사예요.  2) a few(조금 있는)는 셀 수 있는 명사의 복수형 앞에만, a little(조금 있는)과 a lot of(많은)는 셀 수 없는 명사 앞에도 쓸 수 있어요.","셀 수 있는 명사의 복수형 앞에 쓰는 말이에요. a로 시작해요.","time(셀 수 없음) → a few 는 안 돼요",["a few","a little","a lot of"]);
P(1,"S1",1,"c","They were (friend, friendly) to me.","friendly","They were friendly to me.","그들은 나에게 친절했다.",U1A2,"1) were(원형 be ~이다) 뒤에 와서 주어 They(그들)를 설명하고 있어요.  2) 사람이 ‘친절하다’고 설명하려면 명사 friend(친구)가 아니라 형용사가 필요해요.","-ly로 끝나지만 부사가 아니라 형용사예요. f로 시작해요.","be동사 뒤 보어 → 형용사 friendly(친절한)",["friend","friendly"]);
P(1,"S1",2,"c","Seven is a (luck, lucky) number.","lucky","Seven is a lucky number.","7은 행운의 숫자이다.",U1A1,"1) number(숫자)는 명사예요.  2) 명사 앞에서 꾸며 주는 말은 형용사예요. luck(행운)은 명사, 형용사는 ‘행운의’예요.","l로 시작하고 -y로 끝나요.","a ___ number(명사 앞) → 형용사 lucky(행운의)",["luck","lucky"]);
P(1,"S1",3,"c","I invited (a few, a little) people for dinner.","a few","I invited a few people for dinner.","나는 저녁 식사에 몇 사람을 초대했다.",U1B2,"1) people(사람들)은 셀 수 있는 명사의 복수형이에요.  2) 셀 수 있는 복수명사 앞에는 a few(조금 있는, 약간의), 셀 수 없는 명사 앞에는 a little(조금 있는, 약간의)을 써요.","두 단어이고 둘째 단어가 f로 시작해요.","people(셀 수 있는 복수) → a few",["a few","a little"]);
P(1,"S1",4,"c","She doesn’t have (many, much) experience.","much","She doesn’t have much experience.","그녀는 경험이 많지 않다.",U1B1,"1) experience(경험)는 셀 수 없는 명사예요. s가 붙지 않았어요.  2) 셀 수 없는 명사 앞에는 much(많은), 셀 수 있는 복수명사 앞에는 many(많은)를 써요.","m으로 시작하고 네 글자예요.","experience(셀 수 없음) → much",["many","much"]);
P(1,"S1",5,"c","There’s (wrong something, something wrong) with my computer.","something wrong","There’s something wrong with my computer.","내 컴퓨터에 뭔가 문제가 있다.",U1A1,"1) ‘-thing’으로 끝나는 말(something, 어떤 것)이 있어요.  2) -thing, -body, -one으로 끝나는 대명사는 형용사가 뒤에서 꾸며요.","something이 먼저 오고 wrong(잘못된)이 뒤에 와요.","-thing + 형용사 (something이 앞)",["wrong something","something wrong"]);
P(1,"S2",1,"c","I ⓐ need ⓑ a ⓒ bicycle. (new)","ⓒ","I need a new bicycle.","나는 새 자전거가 필요하다.",U1A1,"1) new(새로운)는 형용사예요. 형용사는 꾸미는 명사 바로 앞에 와요.  2) 꾸밀 명사 bicycle(자전거) 바로 앞이 어디인지 찾아요.","a와 bicycle 사이예요. 번호는 세 번째예요.","a ⓒ bicycle → 명사 바로 앞",["ⓐ","ⓑ","ⓒ"]);
P(1,"S2",2,"c","These ⓐ cakes ⓑ look ⓒ. (delicious)","ⓒ","These cakes look delicious.","이 케이크들은 맛있어 보인다.",U1A2,"1) look(원형 look ~해 보이다) 뒤에는 주어를 설명하는 말(보어)이 와요.  2) delicious(맛있는)는 형용사라서 동사 뒤에서 cakes(케이크들)를 설명할 수 있어요.","문장 맨 끝, 마침표 바로 앞이에요. 세 번째예요.","동사 look 뒤 → 보어 자리",["ⓐ","ⓑ","ⓒ"]);
P(1,"S2",3,"c","That’s ⓐ a ⓑ problem ⓒ. (serious)","ⓑ","That’s a serious problem.","그것은 심각한 문제이다.",U1A1,"1) serious(심각한)는 형용사예요. 명사 problem(문제) 앞에서 꾸며요.  2) a와 problem 사이에 넣으면 ‘a + 형용사 + 명사’가 돼요.","a와 problem 사이예요. 번호는 두 번째예요.","a ⓑ problem → 명사 바로 앞",["ⓐ","ⓑ","ⓒ"]);
P(1,"S2",4,"c","That song ⓐ makes ⓑ me ⓒ. (sad)","ⓒ","That song makes me sad.","그 노래는 나를 슬프게 만든다.",U1A2,"1) makes(원형 make 만들다) me 뒤에 목적어(me, 나)를 설명하는 말이 와요.  2) sad(슬픈)는 형용사라서 목적어 뒤에서 목적어를 보충 설명해요.","me 뒤, 문장 맨 끝이에요. 세 번째예요.","make + 목적어 + 형용사 (목적어 뒤 보어)",["ⓐ","ⓑ","ⓒ"]);
P(1,"S3",1,"w","I have ___ money. I can’t buy that jacket.","little","I have little money. I can’t buy that jacket.","나는 돈이 거의 없다. 나는 그 재킷을 살 수 없다.",U1B2,"1) money(돈)는 셀 수 없는 명사예요.  2) 재킷을 못 산다고 했으니 ‘거의 없는’ 뜻이에요. 보기 few, little, a lot of, much 중 셀 수 없는 명사 앞에 ‘거의 없는’을 쓰는 말을 찾아요.","l로 시작하는 여섯 글자예요.","money(셀 수 없음) + 거의 없는 → little 쪽",null);
P(1,"S3",2,"w","She reads ___ books. She is a bookworm.","a lot of","She reads a lot of books. She is a bookworm.","그녀는 책을 많이 읽는다. 그녀는 책벌레이다.",U1B1,"1) books(책들)는 셀 수 있는 복수명사이고, 책벌레(bookworm)라서 ‘많이’ 읽어요.  2) 남은 보기 중 복수명사 앞에서 ‘많은’을 뜻하는 말을 찾아요.","세 단어이고 a로 시작해 of로 끝나요.","books(복수) + 많은 → a lot of",null);
P(1,"S3",3,"w","There were ___ people on the train. It wasn’t crowded.","few","There were few people on the train. It wasn’t crowded.","기차에는 사람이 거의 없었다. 붐비지 않았다.",U1B2,"1) people(사람들)은 셀 수 있는 복수명사예요.  2) 붐비지 않았으니 ‘거의 없는’이에요. 복수명사 앞에서 ‘거의 없는’을 쓰는 말을 찾아요.","f로 시작하는 세 글자예요.","people(복수) + 거의 없는 → few",null);
P(1,"S3",4,"w","Tony doesn’t have ___ work this week. He’s not busy.","much","Tony doesn’t have much work this week. He’s not busy.","토니는 이번 주에 일이 많지 않다. 그는 바쁘지 않다.",U1B1,"1) work(일)는 셀 수 없는 명사예요.  2) doesn’t have(원형 have 가지다)가 앞에 있는 부정문이라 ‘많지 않다’가 돼요. 보기 중 마지막으로 남은 말이에요.","m으로 시작하는 네 글자예요.","work(셀 수 없음) + 부정문 → much",null);
P(1,"S4",1,"w","Nora는 어제 아팠다. (sick)<br>→ Nora ___ yesterday.","was sick","Nora was sick yesterday.","Nora는 어제 아팠다.",U1A2,"1) yesterday(어제)는 과거예요. ‘아팠다’는 be동사 + 형용사 sick(아픈)이에요.  2) Nora는 한 명이고 과거예요.","두 단어예요: be동사의 과거형(w로 시작) + sick.","Nora(한 명) + yesterday(과거) → was + 형용사",null);
P(1,"S4",2,"w","나는 커피를 거의 마시지 않는다. (coffee)<br>→ I drink ___.","little coffee","I drink little coffee.","나는 커피를 거의 마시지 않는다.",U1B2,"1) coffee(커피)는 셀 수 없는 명사예요.  2) ‘거의 ~ 않는’은 little(거의 없는)을 명사 앞에 써요.","두 단어예요: l로 시작하는 말 + coffee.","셀 수 없는 coffee + 거의 없는 → little",null);
P(1,"S4",3,"w","이 잼에는 많은 설탕이 들어있다. (sugar)<br>→ This jam has ___ in it.","lots of sugar","This jam has lots of sugar in it.","이 잼에는 설탕이 많이 들어 있다.",U1B1,"1) sugar(설탕)는 셀 수 없는 명사예요.  2) ‘많은’을 나타내는 말 중 셀 수 없는 명사 앞에 쓸 수 있고 ‘~ of’ 꼴인 말을 찾아요.","세 단어예요: l로 시작하는 말 + of + sugar.","셀 수 없는 sugar + 많은 → lots of",null);
P(1,"S4",4,"w","그는 너를 어떤 좋은 사람에게 소개해 줄 것이다. (nice, someone)<br>→ He’ll introduce you to ___.","someone nice","He’ll introduce you to someone nice.","그는 너를 어떤 좋은 사람에게 소개해 줄 것이다.",U1A1,"1) someone(어떤 사람)은 -one으로 끝나는 대명사예요.  2) 이런 대명사는 형용사가 뒤에서 꾸며요.","두 단어예요: s로 시작하는 대명사 + nice.","-one 대명사 + 형용사 (형용사가 뒤)",null);

P(2,"CU",1,"c","(알맞지 않은 것) She talked ___.","easy","She talked quietly. / She talked seriously.","그녀는 조용히[진지하게] 말했다.",U2B,"1) talked(원형 talk 말하다)는 동사예요. 동사를 꾸미는 말은 부사예요.  2) quietly(조용히), seriously(진지하게)는 형용사 + -ly 모양의 부사이고, easy(쉬운)는 형용사 그대로예요.","e로 시작하는 형용사예요. 부사가 되려면 y를 i로 고치고 -ly를 붙여야 해요.","동사 talked 꾸밈 → 부사 (easy는 형용사)",["easy","quietly","seriously"]);
P(2,"CU",2,"c","(알맞지 않은 것) Kevin drives ___.","careful","Kevin drives fast. / Kevin drives slowly.","케빈은 빠르게[천천히] 운전한다.",U2B,"1) drives(원형 drive 운전하다)는 동사예요. 동사를 꾸미는 말은 부사예요.  2) fast(빠르게)는 형용사와 같은 모양의 부사, slowly(천천히)는 형용사 + -ly 부사예요. careful(조심하는)은 어떤 말일까요?","c로 시작하는 형용사예요. 부사로 쓰려면 -ly가 필요해요.","동사 drives 꾸밈 → 부사 (careful은 형용사)",["fast","slowly","careful"]);
P(2,"S1",1,"c","My father eats (fast, fastly).","fast","My father eats fast.","우리 아버지는 빨리 드신다.",U2B,"1) eats(원형 eat 먹다)는 동사예요. 꾸밀 말은 부사예요.  2) 표의 ‘형용사와 형태가 같은 부사’에 fast가 있어요. fastly라는 말은 없어요.","f로 시작하는 네 글자예요.","fast(빠른) → fast(빠르게)  (-ly 안 붙임)",["fast","fastly"]);
P(2,"S1",2,"c","It is raining (heavy, heavily).","heavily","It is raining heavily.","비가 심하게 내리고 있다.",U2B,"1) is raining(원형 rain 비가 오다)은 동사예요. 동사를 꾸미는 말은 부사예요.  2) -y로 끝나는 형용사 heavy(무거운)는 y를 i로 고치고 -ly를 붙여요.","h로 시작하고 -ily로 끝나요.","heavy → heavily  (y를 i로 + -ly)",["heavy","heavily"]);
P(2,"S1",3,"c","(Sad, Sadly), my best friend moved to another city.","Sadly","Sadly, my best friend moved to another city.","슬프게도 내 가장 친한 친구가 다른 도시로 이사했다.",U2A,"1) 쉼표 앞의 한 단어가 문장 전체를 꾸며 줘요.  2) 문장 전체를 꾸미는 말은 부사예요. 형용사 sad(슬픈)에 -ly를 붙여요.","S로 시작하고 -ly로 끝나요.","문장 전체 꾸밈 → 부사 Sadly(슬프게도)",["Sad","Sadly"]);
P(2,"S1",4,"c","He came (late, lately) to the meeting again.","late","He came late to the meeting again.","그는 그 회의에 또 늦게 왔다.",U2B,"1) came(원형 come 오다)을 꾸미는 부사가 필요하고, ‘늦게’라는 뜻이에요.  2) late는 형용사(늦은)와 부사(늦게)가 같은 모양이에요. lately는 ‘최근에’라는 다른 뜻이에요.","l로 시작하는 네 글자예요. -ly가 없어요.","late(늦게)  ≠  lately(최근에)",["late","lately"]);
P(2,"S1",5,"c","I (always eat, eat always) healthy meals.","always eat","I always eat healthy meals.","나는 항상 건강한 식사를 한다.",U2C,"1) always(항상)는 빈도부사예요.  2) 빈도부사는 be동사나 조동사의 뒤, 일반동사의 앞에 써요. eat(먹다)는 일반동사예요.","빈도부사가 먼저 오고 일반동사가 뒤에 와요.","일반동사 앞 → always + eat",["always eat","eat always"]);
P(2,"S2",1,"w","I studied <u>hard</u> for the test.","studied","I studied hard for the test. (hard는 studied를 꾸며 준다)","나는 시험을 위해 열심히 공부했다.","본책 p.106 A-1 ‘부사의 쓰임’을 펴세요. 부사는 주로 동사, 형용사를 꾸며요.","1) hard(열심히)는 어떻게 했는지 알려 줘요.  2) 무엇을 어떻게 했나요? 문장에서 ‘공부했다’에 해당하는 동사를 찾아요.","동사예요. 과거형이고 s로 시작해요.","hard(열심히) → 동사 studied를 꾸밈");
P(2,"S2",2,"w","<u>Surprisingly</u>, this tree is 500 years old.","this tree is 500 years old","Surprisingly, this tree is 500 years old. (Surprisingly는 문장 전체를 꾸민다)","놀랍게도 이 나무는 500살이다.","본책 p.106 A-2 ‘부사의 쓰임’을 펴세요. 부사는 문장 전체를 꾸며 주기도 해요.","1) Surprisingly(놀랍게도)는 쉼표로 따로 떨어져 있어요.  2) 이런 부사는 한 단어가 아니라 뒤에 오는 문장 전체를 꾸며요.","쉼표 뒤 전체예요. this로 시작해 old로 끝나요.","쉼표로 떨어진 부사 → 뒤 문장 전체를 꾸밈");
P(2,"S2",3,"w","She spent her money <u>wisely</u>.","spent","She spent her money wisely. (wisely는 spent를 꾸며 준다)","그녀는 돈을 현명하게 썼다.","본책 p.106 A-1 ‘부사의 쓰임’을 펴세요. 부사는 주로 동사를 꾸며요.","1) wisely(현명하게)는 어떻게 썼는지 알려 줘요.  2) ‘썼다’에 해당하는 동사(원형 spend 쓰다)의 과거형을 찾아요.","s로 시작하는 동사예요.","wisely(현명하게) → 동사 spent를 꾸밈");
P(2,"S2",4,"w","The movie was <u>really</u> long.","long","The movie was really long. (really는 long을 꾸며 준다)","그 영화는 정말 길었다.","본책 p.106 A-1 ‘부사의 쓰임’을 펴세요. 부사는 형용사도 꾸며요.","1) really(정말)는 ‘얼마나’ 그런지 정도를 알려 줘요.  2) was 뒤에서 영화를 설명하는 형용사를 찾아요.","l로 시작하는 형용사예요.","really(정말) → 형용사 long을 꾸밈");
P(2,"S2",5,"w","Emily speaks <u>very</u> loudly.","loudly","Emily speaks very loudly. (very는 부사 loudly를 꾸며 준다)","에밀리는 매우 크게 말한다.","본책 p.106 A-2 ‘부사의 쓰임’을 펴세요. 부사는 다른 부사도 꾸며요.","1) very(매우)는 정도를 알려 줘요.  2) very 바로 뒤에 있는 말이 무엇인지 보세요. ‘크게’를 뜻하는 부사예요.","l로 시작하고 -ly로 끝나요.","very(매우) → 부사 loudly를 꾸밈");
P(2,"S2",6,"w","<u>Honestly</u>, I don’t remember his name.","I don’t remember his name","Honestly, I don’t remember his name. (Honestly는 문장 전체를 꾸민다)","솔직히 나는 그의 이름이 기억나지 않는다.","본책 p.106 A-2 ‘부사의 쓰임’을 펴세요. 부사는 문장 전체를 꾸며 주기도 해요.","1) Honestly(솔직히)는 쉼표로 따로 떨어져 있어요.  2) 이런 부사는 뒤에 오는 문장 전체를 꾸며요.","쉼표 뒤 전체예요. I로 시작해 name으로 끝나요.","쉼표로 떨어진 부사 → 뒤 문장 전체를 꾸밈");
P(2,"S3",1,"w","You should lock the door. (always)<br>→ You ___.","should always lock the door","You should always lock the door.","너는 항상 문을 잠가야 한다.",U2C,"1) always(항상)는 빈도부사예요.  2) 빈도부사는 be동사나 조동사의 뒤, 일반동사의 앞에 써요. should(~해야 한다)는 조동사예요.","순서: should / always / lock the door.","조동사 should 뒤 + 일반동사 앞 → always");
P(2,"S3",2,"w","He is absent from work. (rarely)<br>→ He ___.","is rarely absent from work","He is rarely absent from work.","그는 직장에 거의 결근하지 않는다.",U2C,"1) rarely(거의 ~ 않다)는 빈도부사예요.  2) is(원형 be ~이다)는 be동사예요. 빈도부사는 be동사의 뒤에 써요.","순서: is / rarely / absent from work.","be동사 is 뒤 → rarely");
P(2,"S3",3,"w","I will tell your secret to others. (never)<br>→ I ___.","will never tell your secret to others","I will never tell your secret to others.","나는 네 비밀을 다른 사람들에게 절대 말하지 않을 것이다.",U2C,"1) never(결코 ~ 않다)는 빈도부사예요.  2) will(~할 것이다)은 조동사예요. 빈도부사는 조동사 뒤, 일반동사 앞에 써요.","순서: will / never / tell your secret to others.","조동사 will 뒤 + 일반동사 앞 → never");
P(2,"S3",4,"w","Jane has strawberry ice cream for dessert. (usually)<br>→ Jane ___.","usually has strawberry ice cream for dessert","Jane usually has strawberry ice cream for dessert.","제인은 보통 후식으로 딸기 아이스크림을 먹는다.",U2C,"1) usually(보통, 대개)는 빈도부사예요.  2) has(원형 have 가지다, 먹다)는 일반동사예요. 빈도부사는 일반동사의 앞에 써요.","순서: usually / has / strawberry ice cream for dessert.","일반동사 has 앞 → usually");
P(2,"S4",1,"w","그는 일찍 잠자리에 든다. (go to bed, early)<br>→ He ___.","goes to bed early","He goes to bed early.","그는 일찍 잠자리에 든다.",U2B,"1) 주어 He는 한 명이고 지금 이야기(현재)예요.  2) early는 형용사(이른)와 부사(일찍)의 모양이 같아요.","순서: goes(원형 go 가다) to bed + early.","go to bed → goes (He 한 명), early는 그대로");
P(2,"S4",2,"w","우리는 그 건물을 쉽게 찾았다. (find, easy)<br>→ We ___ the building ___.","found, easily","We found the building easily.","우리는 그 건물을 쉽게 찾았다.",U2B,"1) ‘찾았다’는 과거예요. find(찾다)는 불규칙 변화 동사예요.  2) ‘쉽게’는 동사를 꾸미는 부사예요. -y로 끝나는 easy(쉬운)는 y를 i로 고치고 -ly를 붙여요.","첫 칸은 f로 시작하는 과거형, 둘째 칸은 e로 시작하고 -ily로 끝나요.","find → found (과거), easy → easily");
P(2,"S4",3,"w","Oliver는 거의 밤을 새지 않는다. (stay up, seldom)<br>→ Oliver ___ all night.","seldom stays up","Oliver seldom stays up all night.","올리버는 거의 밤을 새지 않는다.",U2C,"1) seldom(거의 ~ 않다)은 빈도부사예요.  2) stay up(밤새우다)은 일반동사예요. 빈도부사는 일반동사 앞에 써요. Oliver는 한 명이니 현재형에 s를 붙여요.","순서: seldom + stays(원형 stay 머물다) up.","일반동사 앞 → seldom + stays up");

P(3,"CU",1,"c","Jessica is the ___ person in her family.","youngest","Jessica is the youngest person in her family.","제시카는 가족 중 가장 어린 사람이다.",U3C,"1) the가 앞에 있고 in her family(가족 중)가 뒤에 있어요.  2) 이런 모양은 ‘가장 ~한’을 뜻하는 최상급이에요. young(어린)의 최상급을 찾아요.","y로 시작하고 -est로 끝나요.","the + 형용사 + -est → 최상급",["young","younger","youngest"]);
P(3,"S1",1,"c","The shirt is as (new, newer) as the sweater.","new","The shirt is as new as the sweater.","그 셔츠는 그 스웨터만큼 새것이다.",U3A,"1) as ___ as 모양이에요.  2) as + 형용사/부사의 원급 + as는 ‘~만큼 …한’이에요. 원급은 아무것도 붙이지 않은 기본 모양이에요.","n으로 시작하는 세 글자예요. 아무것도 붙지 않아요.","as ___ as 사이 → 원급",["new","newer"]);
P(3,"S1",2,"c","Next week will be (hot, hotter) than this week.","hotter","Next week will be hotter than this week.","다음 주는 이번 주보다 더 더울 것이다.",U3B,"1) 뒤에 than(~보다)이 있어요.  2) ‘더 ~한’은 비교급이에요. hot은 <단모음 + 단자음>으로 끝나서 자음을 한 번 더 쓰고 -er을 붙여요.","h로 시작하고 -ter로 끝나요. t가 두 개예요.","than 앞 → 비교급 (자음 겹치고 + -er)",["hot","hotter"]);
P(3,"S1",3,"c","She speaks English (well, better) than me.","better","She speaks English better than me.","그녀는 나보다 영어를 더 잘한다.",U3D,"1) 뒤에 than(~보다)이 있어요. 비교급이 필요해요.  2) 표의 ‘불규칙 변화’를 보면 well(잘)의 비교급은 -er이 아니라 완전히 다른 모양이에요.","b로 시작하고 -er로 끝나요.","than 앞 + well(잘)의 비교급",["well","better"]);
P(3,"S1",4,"c","That man has the (longer, longest) name in the world.","longest","That man has the longest name in the world.","저 남자는 세계에서 가장 긴 이름을 가지고 있다.",U3C,"1) the가 앞에 있고 in the world(세계에서)가 뒤에 있어요.  2) ‘가장 ~한’ 최상급이에요. 최상급 앞에는 the, 뒤에는 범위(in + 장소)를 써요.","l로 시작하고 -est로 끝나요.","the + 형용사 + -est + in the world → 최상급",["longer","longest"]);
P(3,"S1",5,"c","The sofa is (more comfortable, most comfortable) than the chair.","more comfortable","The sofa is more comfortable than the chair.","그 소파는 그 의자보다 더 편안하다.",U3D,"1) 뒤에 than(~보다)이 있어요. 비교급이에요.  2) comfortable(편안한)은 3음절 이상의 긴 형용사예요. 이런 말은 -er을 붙이지 않고 앞에 more를 써요.","m으로 시작하는 두 단어이고 첫 단어는 more예요.","than 앞 + 긴 형용사 → more + 원급",["more comfortable","most comfortable"]);
P(3,"S2",1,"w","Daniel is ___ me. (tall)","taller than","Daniel is taller than me.","대니얼은 나보다 키가 더 크다.",U3B,"1) 비교급은 ‘형용사의 비교급 + than’ 모양이에요.  2) tall(키가 큰)은 짧은 형용사라서 -er을 붙여요.","두 단어예요: t로 시작하고 -er로 끝나는 말 + than.","tall + -er + than");
P(3,"S2",2,"w","China is ___ India. (large)","larger than","China is larger than India.","중국은 인도보다 더 크다.",U3D,"1) 비교급은 ‘형용사의 비교급 + than’ 모양이에요.  2) large(큰)는 -e로 끝나는 형용사예요. 표에서 -e로 끝나는 말은 -r만 붙여요.","두 단어예요: l로 시작하고 -er로 끝나는 말 + than. e는 한 번만 써요.","large + -r + than");
P(3,"S2",3,"w","This laptop is ___ that one. (thin)","thinner than","This laptop is thinner than that one.","이 노트북은 저것보다 더 얇다.",U3D,"1) 비교급은 ‘형용사의 비교급 + than’ 모양이에요.  2) thin(얇은)은 <단모음 + 단자음>으로 끝나요. 표에서 이런 말은 자음을 한 번 더 써요.","두 단어예요: t로 시작하고 n이 두 개인 말 + than.","thin → n을 겹치고 + -er + than");
P(3,"S2",4,"w","My sister’s room is ___ mine. (big)","bigger than","My sister’s room is bigger than mine.","내 여동생의 방은 내 방보다 더 크다.",U3D,"1) 비교급은 ‘형용사의 비교급 + than’ 모양이에요.  2) big(큰)은 <단모음 + 단자음>으로 끝나요. 자음을 한 번 더 써요.","두 단어예요: b로 시작하고 g가 두 개인 말 + than.","big → g를 겹치고 + -er + than");
P(3,"S2",5,"w","My father came home ___ me today. (early)","earlier than","My father came home earlier than me today.","우리 아버지는 오늘 나보다 집에 더 일찍 오셨다.",U3D,"1) 비교급은 ‘부사의 비교급 + than’ 모양이에요.  2) early(일찍)는 -y로 끝나요. 표에서 -y로 끝나는 말은 y를 i로 고치고 -er을 붙여요.","두 단어예요: e로 시작하고 -ier로 끝나는 말 + than.","early → y를 i로 + -er + than");
P(3,"S2",6,"w","This test is ___ the last one. (difficult)","more difficult than","This test is more difficult than the last one.","이번 시험은 지난번 것보다 더 어렵다.",U3D,"1) 비교급은 ‘형용사의 비교급 + than’ 모양이에요.  2) difficult(어려운)는 3음절 이상의 긴 형용사예요. -er을 붙이지 않고 앞에 more를 써요.","세 단어예요: more + difficult + than.","긴 형용사 → more + 원급 + than");
P(3,"S3",1,"w","Max is ___ student in the class. He always gets As.","the smartest","Max is the smartest student in the class. He always gets As.","맥스는 반에서 가장 똑똑한 학생이다. 그는 항상 A를 받는다.",U3C,"1) 앞뒤 단서: ‘항상 A를 받는다’ → 똑똑해요. 보기 bad, smart, strong, crowded 중 똑똑한을 뜻하는 말이에요.  2) 최상급은 ‘the + 형용사의 최상급’ 모양이에요. smart(똑똑한)는 짧은 형용사라서 -est를 붙여요.","두 단어예요: the + s로 시작하고 -est로 끝나는 말.","the + smart + -est");
P(3,"S3",2,"w","That team is ___ of all. They will win the championship.","the strongest","That team is the strongest of all. They will win the championship.","그 팀은 모든 팀 중에서 가장 강하다. 그들은 우승할 것이다.",U3C,"1) 앞뒤 단서: ‘우승할 것이다’ → 강해요. 보기 중 강한을 뜻하는 말이에요.  2) 최상급 뒤에는 「of + 복수명사」로 범위를 나타내요. strong(강한)에 -est를 붙여요.","두 단어예요: the + s로 시작하고 -est로 끝나는 말.","the + strong + -est (of all)");
P(3,"S3",3,"w","Yesterday was ___ day of my life. I made a terrible mistake.","the worst","Yesterday was the worst day of my life. I made a terrible mistake.","어제는 내 인생에서 최악의 날이었다. 나는 끔찍한 실수를 했다.",U3D,"1) 앞뒤 단서: ‘끔찍한 실수를 했다’ → 나쁜 날이에요. 보기 중 나쁜을 뜻하는 말이에요.  2) 표의 ‘불규칙 변화’에서 bad(나쁜)의 최상급을 찾아요.","두 단어예요: the + w로 시작하고 -st로 끝나는 말.","the + bad의 최상급(불규칙)");
P(3,"S3",4,"w","This is ___ restaurant in the city. It serves excellent food.","the most crowded","This is the most crowded restaurant in the city. It serves excellent food.","이곳은 시내에서 가장 붐비는 식당이다. 이곳은 훌륭한 음식을 낸다.",U3D,"1) 앞뒤 단서: ‘훌륭한 음식’ → 사람이 많이 몰려요. 남은 보기는 crowded(붐비는)예요.  2) crowded는 -ed로 끝나는 2음절 형용사예요. -est를 붙이지 않고 most를 앞에 써요.","세 단어예요: the + most + crowded.","긴 형용사 → the most + 원급");
P(3,"S4",1,"w","Joan은 나보다 더 빨리 수영한다. (fast)<br>→ Joan swims ___ me.","faster than","Joan swims faster than me.","Joan은 나보다 더 빨리 수영한다.",U3B,"1) ‘더 빨리’는 비교급이고, ‘~보다’는 than이에요.  2) fast(빠르게)는 짧은 말이라서 -er을 붙여요.","두 단어예요: f로 시작하고 -er로 끝나는 말 + than.","fast + -er + than");
P(3,"S4",2,"w","이곳은 시내에서 가장 좋은 호텔이다. (good, hotel)<br>→ This is ___ in town.","the best hotel","This is the best hotel in town.","이곳은 시내에서 가장 좋은 호텔이다.",U3D,"1) ‘가장 좋은’은 최상급이고 앞에 the를 써요.  2) 표의 ‘불규칙 변화’에서 good(좋은)의 최상급을 찾아요.","세 단어예요: the + b로 시작하는 최상급 + hotel.","the + good의 최상급(불규칙) + 명사");
P(3,"S4",3,"w","이 신발은 저 신발만큼 멋지다. (nice)<br>→ These shoes are ___ those ones.","as nice as","These shoes are as nice as those ones.","이 신발은 저 신발만큼 멋지다.",U3A,"1) ‘~만큼 …한’은 원급 비교예요.  2) 원급 비교는 as + 형용사/부사의 원급 + as 모양이에요. nice는 그대로 써요.","세 단어예요: as + nice + as.","as + 원급 + as (~만큼 …한)");
P(3,"S4",4,"w","그 영화는 책보다 더 인기 있었다. (popular)<br>→ The movie was ___ the book.","more popular than","The movie was more popular than the book.","그 영화는 책보다 더 인기 있었다.",U3D,"1) ‘~보다 더 …한’은 비교급 + than이에요.  2) popular(인기 있는)는 3음절 이상의 긴 형용사라서 more를 앞에 써요.","세 단어예요: more + popular + than.","긴 형용사 → more + 원급 + than");
// ---------- GRAMMAR FOR WRITING ----------
P("GW","A",1,"w","Maria는 정직하다. (honest)<br>→ Maria ___.","is honest","Maria is honest.","Maria는 정직하다.","본책 p.104 A-2 ‘형용사의 쓰임’(보어 역할)을 펴세요.","1) ‘정직하다’는 be동사 + 형용사예요.  2) Maria는 한 명이고 지금 이야기(현재)예요.","두 단어예요: be동사(i로 시작) + honest.","Maria(한 명) + 현재 → is + 형용사");
P("GW","A",2,"w","벽에 아름다운 그림 하나가 있었다. (beautiful, picture)<br>→ There was a ___ on the wall.","beautiful picture","There was a beautiful picture on the wall.","벽에 아름다운 그림 한 점이 있었다.",U1A1,"1) a 뒤에 명사 picture(그림)가 와요.  2) 형용사 beautiful(아름다운)은 꾸미는 명사 바로 앞에 와요.","두 단어예요: beautiful + picture 순서예요.","a + 형용사 + 명사");
P("GW","A",3,"w","그는 문을 조용히 닫았다. (the door, quiet)<br>→ He closed ___.","the door quietly","He closed the door quietly.","그는 문을 조용히 닫았다.",U2B,"1) closed(원형 close 닫다)를 꾸미는 말이라서 부사가 필요해요.  2) quiet(조용한)에 -ly를 붙이고, 목적어 the door 뒤에 써요.","세 단어예요: the door + q로 시작하는 부사.","동사 꾸밈 → 형용사 + -ly");
P("GW","A",4,"w","교실에 몇몇 학생들이 있다. (students)<br>→ There are ___ in the classroom.","some students / a few students","There are some students in the classroom. / There are a few students in the classroom.","교실에 몇몇 학생들이 있다.",U1B2,"1) students(학생들)는 셀 수 있는 복수명사예요.  2) ‘몇몇의’는 some 또는 a few(조금 있는, 약간의)로 나타내요.","두 단어예요: s 또는 a few로 시작하는 말 + students.","복수명사 앞 → some / a few");
P("GW","A",5,"w","목성은 금성보다 훨씬 더 크다. (much, big, Venus)<br>→ Jupiter is ___.","much bigger than Venus","Jupiter is much bigger than Venus.","목성은 금성보다 훨씬 더 크다.","본책 p.108 B ‘비교급’을 펴세요. 비교급 앞에 much, still, far, a lot, even 등을 써서 강조할 수 있어요.","1) ‘~보다 더 …한’은 비교급 + than이에요. big(큰)은 g를 한 번 더 써요.  2) ‘훨씬’은 비교급 앞에 much를 써요.","네 단어예요: much + b로 시작하는 비교급 + than + Venus.","much + 비교급 + than");
P("GW","A",6,"w","이것은 그 영화에서 가장 유명한 장면이다. (famous, scene)<br>→ This is ___ in the movie.","the most famous scene","This is the most famous scene in the movie.","이것은 그 영화에서 가장 유명한 장면이다.",U3C+" 아래 ‘in + 장소, 단체’로 범위를 나타내요.","1) ‘가장 ~한’은 the + 최상급이에요.  2) famous(유명한)는 -ous로 끝나는 2음절어라서 most를 앞에 써요.","네 단어예요: the + most + famous + scene.","the most + 원급 + 명사");
P("GW","A",7,"w","그 배우는 거의 인터뷰를 하지 않는다. (rarely, have interviews)<br>→ The actor ___.","rarely has interviews","The actor rarely has interviews.","그 배우는 거의 인터뷰를 하지 않는다.",U2C,"1) rarely(거의 ~ 않다)는 빈도부사예요.  2) 빈도부사는 일반동사 앞에 써요. The actor는 한 명이라 have는 has가 돼요.","세 단어예요: rarely + has(원형 have 가지다) + interviews.","rarely + 일반동사(has)");
P("GW","B",1,"w","그녀는 그 소식에 슬펐다. (felt, about the news, sad, she)<br>→ ___.","She felt sad about the news","She felt sad about the news.","그녀는 그 소식에 슬펐다.",U1A2,"1) ‘슬펐다’는 felt(원형 feel 느끼다) 뒤에 형용사 sad(슬픈)가 와요.  2) 주어 She가 맨 앞이고, ‘그 소식에’는 about the news예요.","순서: She / felt / sad / about the news.","주어 + 동사 + 형용사(보어) + ~에 대해");
P("GW","B",2,"w","그는 빵 위에 약간의 버터를 발랐다. (little, spread, he, a, butter)<br>→ ___ on the bread.","He spread a little butter","He spread a little butter on the bread.","그는 빵 위에 약간의 버터를 발랐다.",U1B2,"1) butter(버터)는 셀 수 없는 명사예요.  2) 셀 수 없는 명사 앞에 ‘약간의’는 a little이에요.","순서: He / spread(원형 spread 바르다) / a little / butter.","주어 + 동사 + a little + 명사");
P("GW","B",3,"w","John은 그의 팀에서 가장 훌륭한 선수이다. (the, player, is, best, on his team)<br>→ John ___.","is the best player on his team","John is the best player on his team.","John은 그의 팀에서 가장 훌륭한 선수이다.",U3C,"1) ‘가장 훌륭한’은 the + 최상급이에요. 표의 ‘불규칙 변화’에서 good의 최상급을 찾아요.  2) 최상급 뒤에 「in + 단체」 같은 범위가 와요.","순서: is / the best / player / on his team.","be동사 + the + 최상급 + 명사");
P("GW","B",4,"w","나는 Amy만큼 열심히 공부했다. (as, studied, as, hard, Amy)<br>→ I ___.","studied as hard as Amy","I studied as hard as Amy.","나는 Amy만큼 열심히 공부했다.",U3A,"1) ‘~만큼 …하게’는 as + 원급 + as예요.  2) hard(열심히)는 형용사와 같은 모양의 부사예요. 그대로 as 사이에 넣어요.","순서: studied(원형 study 공부하다) / as / hard / as / Amy.","동사 + as + 원급 + as");
P("GW","B",5,"w","내게는 수학이 과학보다 훨씬 더 재미있다. (more, science, interesting, than, much)<br>→ Math is ___ for me.","much more interesting than science","Math is much more interesting than science for me.","내게는 수학이 과학보다 훨씬 더 재미있다.",U3B,"1) interesting(재미있는)은 긴 형용사라서 more interesting이 비교급이에요.  2) ‘훨씬’을 뜻하는 much는 비교급 바로 앞에 써요.","순서: much / more / interesting / than / science.","much + more + 원급 + than");
P("GW","B",6,"w","Kevin은 자주 두통을 앓는다. (often, a headache, Kevin, has)<br>→ ___.","Kevin often has a headache","Kevin often has a headache.","Kevin은 자주 두통을 앓는다.",U2C,"1) often(자주)은 빈도부사예요.  2) 빈도부사는 일반동사의 앞에 써요. has(원형 have 가지다)는 일반동사예요.","순서: Kevin / often / has / a headache.","주어 + 빈도부사 + 일반동사");
P("GW","C",1,"w","Emily and Ann are my cousins. Emily is ten years old. Ann is eight years old.<br>→ Emily is ___ Ann. (old)","older than","Emily is older than Ann.","Emily와 Ann은 내 사촌이다. Emily는 열 살이고 Ann은 여덟 살이다. Emily는 Ann보다 나이가 더 많다.",U3B,"1) Emily는 10살, Ann은 8살이니 Emily가 더 많아요.  2) ‘더 ~한’은 비교급 + than이에요. old(나이 든)는 짧은 말이라 -er을 붙여요.","두 단어예요: o로 시작하고 -er로 끝나는 말 + than.","old + -er + than");
P("GW","C",2,"w","I bought a novel and a comic book at the bookstore. The novel cost $8. The comic book cost $4.<br>→ The novel was ___ the comic book. (expensive)","more expensive than","The novel was more expensive than the comic book.","나는 서점에서 소설책과 만화책을 샀다. 소설책은 8달러였고 만화책은 4달러였다. 소설책이 만화책보다 더 비쌌다.",U3D,"1) 소설 8달러, 만화책 4달러이니 소설이 더 비싸요.  2) expensive(비싼)는 3음절 이상의 긴 형용사예요. 앞에 more를 써요.","세 단어예요: more + expensive + than.","긴 형용사 → more + 원급 + than");
P("GW","C",3,"w","We have three runners in our class: Judy, Steve, and Lucy. Judy runs 100 meters in 16 seconds. Steve runs 100 meters in 15 seconds. Lucy runs 100 meters in 17 seconds.<br>→ Steve is ___ runner in our class. (fast)","the fastest","Steve is the fastest runner in our class.","우리 반에는 달리기 선수가 세 명 있다: Judy, Steve, Lucy. Judy는 100미터를 16초에, Steve는 15초에, Lucy는 17초에 달린다. Steve가 우리 반에서 가장 빠른 선수이다.",U3C,"1) 세 명을 비교해요. 15초로 가장 짧게 걸린 사람이 가장 빨라요.  2) 셋 이상 중 ‘가장 ~한’은 the + 최상급이에요. fast(빠른)에 -est를 붙여요.","두 단어예요: the + f로 시작하고 -est로 끝나는 말.","the + fast + -est");
P("GW","D",1,"w","(그림: 상어가 이빨을 드러내고 있다)<br>Sharks have ___. (tooth)","many teeth","Sharks have many teeth.","상어는 이빨이 많다.",U1B1,"1) 그림을 보면 이빨이 아주 많아요. tooth(이빨)의 복수형은 teeth예요.  2) 보기 little, few, many, much 중 셀 수 있는 복수명사 앞에서 ‘많은’을 뜻하는 말을 골라요.","두 단어예요: m으로 시작하는 네 글자 + teeth.","복수명사 + 많은 → many",null);
P("GW","D",2,"w","(그림: 주차장에 차가 두 대뿐이다)<br>There are ___ in the parking lot. (car)","few cars","There are few cars in the parking lot.","주차장에 차가 거의 없다.",U1B2,"1) 그림을 보면 주차장이 거의 비어 있고 차가 몇 대밖에 없어요.  2) cars(차들)는 셀 수 있는 복수명사예요. 복수명사 앞에서 ‘거의 없는’을 쓰는 말을 골라요.","두 단어예요: f로 시작하는 세 글자 + cars.","복수명사 + 거의 없는 → few",null);
P("GW","D",3,"w","(그림: 한 남자가 급하게 뛰어가고 있다)<br>I don’t have ___. I should hurry up. (time)","much time","I don’t have much time. I should hurry up.","나는 시간이 많지 않다. 서둘러야 한다.",U1B1,"1) 그림 속 남자가 서둘러요. 시간이 많지 않아요.  2) time(시간)은 셀 수 없는 명사예요. 부정문에서 ‘많은’을 뜻하고 셀 수 없는 명사 앞에 쓰는 말을 골라요.","두 단어예요: m으로 시작하는 네 글자 + time.","셀 수 없는 time + 부정문 → much",null);
P("GW","D",4,"w","(그림: 쩍쩍 갈라진 메마른 땅)<br>We had ___ last year. It was too dry. (rain)","little rain","We had little rain last year. It was too dry.","우리는 작년에 비가 거의 오지 않았다. 너무 건조했다.",U1B2,"1) 그림은 메마른 땅이에요. 비가 거의 안 왔어요.  2) rain(비)은 셀 수 없는 명사예요. 셀 수 없는 명사 앞에서 ‘거의 없는’을 쓰는 말을 골라요.","두 단어예요: l로 시작하는 여섯 글자 + rain.","셀 수 없는 rain + 거의 없는 → little",null);

P("RT","RT",1,"c","(알맞지 않은 것) A ___ baby is sleeping in the bed.","⑤ happily","A cute baby is sleeping in the bed.","귀여운 아기가 침대에서 자고 있다.",U1A1,"1) baby(아기)는 명사예요. 명사 앞에서 꾸미는 말은 형용사예요.  2) cute(귀여운), pretty(예쁜), little(작은), lovely(사랑스러운), happily(행복하게) 중 -ly로 끝나지만 형용사가 아닌 것을 찾아요.","마지막 번호예요. 부사라서 명사를 꾸미지 못해요.","baby(명사) 꾸밈 → 형용사 (happily는 부사)",["① cute","② pretty","③ little","④ lovely","⑤ happily"]);
P("RT","RT",2,"c","(알맞지 않은 것) The train is ___ faster than the bus.","① very","The train is much faster than the bus.","그 기차는 버스보다 훨씬 더 빠르다.",U3B,"1) faster than(~보다 더 빠른)은 비교급이에요.  2) 비교급 앞에서 ‘훨씬’으로 강조하는 말은 much, still, far, a lot, even 등이에요. 이 목록에 없는 말을 찾아요.","첫 번째 보기예요. v로 시작해요.","비교급 강조: much, even, far, a lot (very는 안 됨)",["① very","② much","③ even","④ far","⑤ a lot"]);
P("RT","RT",3,"c","(밑줄 친 부분이 올바른 것)","⑤ This sweater feels <u>good</u>.","This sweater feels good.","이 스웨터는 느낌이 좋다.",U1A2,"1) 동사 뒤에서 주어를 설명하면 형용사, 동사를 꾸미면 부사, 명사를 꾸미면 형용사예요.  2) 각 보기의 밑줄 친 말이 어떤 자리에 있는지 하나씩 보세요. fast, quiet, expensive, large를 부사로 만들 필요가 있는지 따져요.","마지막 보기예요. feels(원형 feel 느끼다) 뒤에 형용사가 와요.","feels 뒤 → 형용사 good",["① Andrew walks <u>fastly</u>.","② The people were <u>quietly</u>.","③ This bicycle is <u>expensively</u>.","④ They live in a <u>largely</u> house.","⑤ This sweater feels <u>good</u>."]);
P("RT","RT",4,"c","(밑줄 친 부분이 올바른 것)","② He listened to me <u>carefully</u>.","He listened to me carefully.","그는 주의 깊게 내 말을 들었다.",U2B,"1) 명사(view)를 꾸밀 때는 형용사, 동사(speaks, finished)를 꾸밀 때는 부사를 써요.  2) 부사는 대부분 형용사 + -ly 모양이에요. 각 보기마다 꾸미는 말이 맞는 품사인지 보세요.","두 번째 보기예요. 동사 listened(원형 listen 듣다)를 부사로 꾸며요.","동사 꾸밈 → careful + -ly",["① This room has a <u>nicely</u> view.","② He listened to me <u>carefully</u>.","③ Jisu speaks English <u>perfect</u>.","④ Sue looked <u>well</u> in a red dress.","⑤ She finished her homework <u>quick</u>."]);
P("RT","RT",5,"w","Susan is ___ her mother. They’re both 160 cm tall. (tall)","as tall as","Susan is as tall as her mother. They’re both 160 cm tall.","수잔은 어머니만큼 키가 크다. 두 사람 모두 키가 160cm이다.",U3A,"1) 두 사람 키가 똑같아요.  2) 똑같은 정도는 as + 원급 + as(~만큼 …한)로 나타내요.","세 단어예요: as + tall + as.","키가 같다 → as + 원급 + as");
P("RT","RT",6,"w","My bag is ___ Eric’s bag. I have more books in it. (heavy)","heavier than","My bag is heavier than Eric’s bag. I have more books in it.","내 가방이 에릭의 가방보다 더 무겁다. 내 가방에는 책이 더 많이 들어 있다.",U3D,"1) 내 가방이 더 무거워요. 비교급 + than이에요.  2) heavy(무거운)는 -y로 끝나요. y를 i로 고치고 -er을 붙여요.","두 단어예요: h로 시작하고 -ier로 끝나는 말 + than.","heavy → y를 i로 + -er + than");
P("RT","RT",7,"w","Tokyo is ___ city in Japan. It is also the capital of the country. (big)","the biggest","Tokyo is the biggest city in Japan. It is also the capital of the country.","도쿄는 일본에서 가장 큰 도시이다. 그곳은 그 나라의 수도이기도 하다.",U3C,"1) 일본 안의 도시 중 ‘가장 큰’이니 최상급이에요.  2) 최상급은 the + 최상급이에요. big(큰)은 g를 한 번 더 쓰고 -est를 붙여요.","두 단어예요: the + b로 시작하고 g가 두 개인 말.","the + big의 -est형");
P("RT","RT",8,"c","(usually)<br>I ① go ② to ③ school ④ by ⑤ bus.","①","I usually go to school by bus.","나는 보통 버스로 학교에 간다.",U2C,"1) usually(보통, 대개)는 빈도부사예요.  2) 빈도부사는 일반동사의 앞에 써요. go(가다)는 일반동사예요.","주어 I와 일반동사 go 사이를 찾아 보세요. 가장 앞쪽 번호예요.","일반동사 앞 → I usually go",["①","②","③","④","⑤"]);
P("RT","RT",9,"c","(never)<br>I ① will ② tell ③ a lie ④ to ⑤ you.","②","I will never tell a lie to you.","나는 너에게 절대 거짓말을 하지 않을 것이다.",U2C,"1) never(결코 ~ 않다)는 빈도부사예요.  2) will(~할 것이다)은 조동사예요. 빈도부사는 조동사 뒤, 일반동사 앞에 써요.","will과 tell 사이예요. 두 번째 번호예요.","조동사 will 뒤 + 일반동사 앞 → never",["①","②","③","④","⑤"]);
P("RT","RT",10,"c","(밑줄 친 부분이 잘못된 것)","④ This is my <u>newly</u> address.","This is my new address.","이것은 내 새 주소이다.",U1A1,"1) 명사 address(주소) 앞에는 형용사가 와요.  2) newly는 -ly가 붙은 부사예요. 명사를 꾸밀 수 있는 말인가요?","네 번째 보기예요. 명사 앞에 부사를 썼어요.","명사 꾸밈 → 형용사 new (newly는 부사)",["① He is an <u>honest</u> boy.","② The glass is <u>nearly</u> empty.","③ She <u>kindly</u> helped us.","④ This is my <u>newly</u> address.","⑤ Baseball is an <u>exciting</u> sport."]);
P("RT","RT",11,"c","(밑줄 친 부분이 잘못된 것)","⑤ Today was <u>the most cold</u> day of the year.","Today was the coldest day of the year.","오늘은 올해 가장 추운 날이었다.",U3D,"1) 최상급 만드는 법을 보세요: 짧은 형용사는 -est, 긴 형용사나 -ous, -ful로 끝나는 2음절어는 most를 써요.  2) cold(추운)는 짧은 형용사예요.","다섯 번째 보기예요. the most를 잘못 썼어요.","짧은 형용사 cold → the coldest (most 아님)",["① My suitcase is <u>lighter than</u> yours.","② He plays the piano <u>better than</u> me.","③ The skirt costs <u>more than</u> the shorts.","④ This book is <u>as useful as</u> that book.","⑤ Today was <u>the most cold</u> day of the year."]);
P("RT","RT",12,"c","우리 언니는 나보다 더 빠르게 타자를 친다.","⑤ My sister types more quickly than me.","My sister types more quickly than me.","우리 언니는 나보다 더 빠르게 타자를 친다.",U3D,"1) 주어는 ‘우리 언니’이고 ‘더 빠르게’는 비교급 부사예요.  2) 부사 quickly(빠르게)는 긴 말이라서 more를 써요. more에 -er을 또 붙이지는 않아요.","다섯 번째 보기예요. 주어가 My sister이고 more quickly than이 들어가요.","언니가 주어 + more + 부사 + than",["① I type more quick than my sister.","② I type more quickly than my sister.","③ My sister types as quick as me.","④ My sister types more quicker than me.","⑤ My sister types more quickly than me."]);
P("RT","RT",13,"c","그녀는 학교에서 가장 어린 학생이다.","④ She is the youngest student in school.","She is the youngest student in school.","그녀는 학교에서 가장 어린 학생이다.",U3C,"1) ‘가장 어린’은 최상급이에요. 앞에 the, 뒤에 범위(in school)가 있어요.  2) young(어린)은 짧은 형용사라서 -est를 붙여요. most와 -est를 같이 쓰면 안 돼요.","네 번째 보기예요. the + y로 시작하는 -est형이에요.","the + young + -est (most 없이)",["① She is young student in school.","② She is younger student in school.","③ She is the most young student in school.","④ She is the youngest student in school.","⑤ She is the most youngest student in school."]);
P("RT","RT",14,"w","I don’t have ___ furniture in my room.","much","I don’t have much furniture in my room.","내 방에는 가구가 많지 않다.",U1B1,"1) furniture(가구)는 셀 수 없는 명사예요.  2) 보기 a few, much, little 중 셀 수 없는 명사 앞에서 부정문에 ‘많은’을 뜻하는 말이에요.","m으로 시작하는 네 글자예요.","furniture(셀 수 없음) + 부정문 → much");
P("RT","RT",15,"w","I bought ___ magazines at the bookstore.","a few","I bought a few magazines at the bookstore.","나는 서점에서 잡지 몇 권을 샀다.",U1B2,"1) magazines(잡지들)는 셀 수 있는 복수명사예요.  2) 복수명사 앞에서 ‘약간의’를 뜻하는 말을 보기에서 찾아요.","두 단어예요: a로 시작하고 f로 시작하는 말이 이어져요.","복수명사 + 약간의 → a few");
P("RT","RT",16,"w","There is ___ air in the balloon. It is almost empty.","little","There is little air in the balloon. It is almost empty.","풍선에 공기가 거의 없다. 거의 비어 있다.",U1B2,"1) air(공기)는 셀 수 없는 명사예요.  2) 거의 비어 있다고 했으니 ‘거의 없는’이에요. 남은 보기를 보세요.","l로 시작하는 여섯 글자예요.","air(셀 수 없음) + 거의 없는 → little");
P("RT","RT",17,"c","• A turtle is (A) ___.<br>• You should eat your food (B) ___.","③ slow – slowly","A turtle is slow. / You should eat your food slowly.","거북이는 느리다. / 너는 음식을 천천히 먹어야 한다.",U1A2,"1) (A)는 be동사 뒤에서 주어 A turtle을 설명해요 → 형용사.  2) (B)는 동사 eat(먹다)을 꾸며요 → 부사.","(A)는 -ly가 없고 (B)는 -ly가 있어요. 세 번째 보기예요.","주어 설명 → 형용사, 동사 꾸밈 → 부사",["① slow – slow","② slowly – slow","③ slow – slowly","④ slowly – slowly","⑤ slower – slow"]);
P("RT","RT",18,"c","• It was a (A) ___ question. I couldn’t answer it.<br>• The two women (B) ___ know each other.","② hard – hardly","It was a hard question. / The two women hardly know each other.","그것은 어려운 질문이었다. 나는 답할 수 없었다. / 그 두 여자는 서로를 거의 알지 못한다.",U2B,"1) (A)는 명사 question(질문) 앞이라 형용사, ‘어려운’이에요.  2) (B)는 동사 know를 꾸며요. 표 ‘<부사 + ly>가 다른 뜻을 가지는 부사’에서 hard와 hardly의 뜻을 비교하세요.","(A)는 hard, (B)는 hard에 -ly가 붙은 말이에요. 두 번째 보기예요.","hard(어려운, 열심히)  /  hardly(거의 ~ 않는)",["① hard – hard","② hard – hardly","③ hardly – hardly","④ hardly – hard","⑤ hardest – hard"]);
P("RT","RT",19,"w","내 새로운 휴대 전화는 예전 것보다 더 좋다. (good)<br>→ My new cell phone is ___ my old one.","better than","My new cell phone is better than my old one.","내 새 휴대 전화는 예전 것보다 더 좋다.",U3D,"1) ‘~보다 더 좋은’은 비교급 + than이에요.  2) 표의 ‘불규칙 변화’에서 good(좋은)의 비교급을 찾아요.","두 단어예요: b로 시작하고 -er로 끝나는 말 + than.","good → 불규칙 비교급 + than");
P("RT","RT",20,"w","아인슈타인은 역사상 가장 똑똑한 사람이다. (intelligent, person)<br>→ Einstein is ___ in history.","the most intelligent person","Einstein is the most intelligent person in history.","아인슈타인은 역사상 가장 똑똑한 사람이다.",U3D,"1) ‘가장 ~한’은 the + 최상급이에요.  2) intelligent(똑똑한)는 3음절 이상의 긴 형용사예요. 앞에 most를 써요.","네 단어예요: the + most + intelligent + person.","긴 형용사 → the most + 원급 + 명사");
P("RT","RT",21,"w","이번 봄은 작년 봄만큼 따뜻하다. (as, is, warm, last spring, as)<br>→ This spring ___.","is as warm as last spring","This spring is as warm as last spring.","이번 봄은 작년 봄만큼 따뜻하다.",U3A,"1) ‘~만큼 …한’은 as + 원급 + as예요.  2) 주어 This spring 뒤에 be동사가 와요.","순서: is / as / warm / as / last spring.","be동사 + as + 원급 + as");
P("RT","RT",22,"w","우리는 인터넷에서 흥미로운 것을 발견했다. (found, we, interesting, something)<br>→ ___ on the internet.","We found something interesting","We found something interesting on the internet.","우리는 인터넷에서 흥미로운 것을 발견했다.",U1A1,"1) something(어떤 것)은 -thing으로 끝나는 대명사예요.  2) 이런 대명사는 형용사가 뒤에서 꾸며요.","순서: We / found(원형 find 찾다) / something / interesting.","-thing + 형용사 (뒤에서 꾸밈)");
P("RT","RT",23,"c","(their, visit, they, grandparents, often, will)를 바르게 배열할 때 세 번째에 오는 단어는?","④ often","They will often visit their grandparents.","그들은 자주 그들의 조부모님을 방문할 것이다.",U2C,"1) 주어 They가 맨 앞이고 will(~할 것이다)은 조동사예요.  2) 빈도부사(자주, 가끔 같은 말)는 조동사 뒤, 일반동사 앞에 써요.","순서: ___ / ___ / ___ / visit / their / grandparents. 주어와 조동사 다음 세 번째 자리에 빈도부사가 와요.","주어 + 조동사 + 빈도부사 + 일반동사",["① their","② visit","③ they","④ often","⑤ will"]);
P("RT","RT",24,"w","(표) Soul: 1 hour 47 minutes / Toy Story 4: 1 hour 40 minutes<br>조건: be동사, short를 이용, 현재시제<br>→ Toy Story 4 ___.","is shorter than Soul","Toy Story 4 is shorter than Soul.","Toy Story 4는 Soul보다 더 짧다.",U3B,"1) Toy Story 4가 7분 더 짧아요. 비교급 + than이에요.  2) 조건: be동사를 쓰고 현재시제이니 is예요. short(짧은)는 짧은 형용사라 -er을 붙여요.","네 단어예요: is + s로 시작하는 비교급 + than + Soul.","be동사 + short + -er + than");
P("RT","RT",25,"w","(어법상 옳은 것을 모두 고르면?) ① Kelly saw a cute dog today. ② Sumi buys sometimes things online. ③ The show was quite boring. ④ I’ll tell you something funny. ⑤ I have a little problems with my sister.","①, ③, ④","옳은 문장: ① Kelly saw a cute dog today. ③ The show was quite boring. ④ I’ll tell you something funny.","① Kelly는 오늘 귀여운 개를 보았다. ③ 그 쇼는 꽤 지루했다. ④ 내가 너에게 재미있는 것을 말해 줄게.",U2C,"1) ②는 빈도부사 sometimes(가끔)의 자리, ⑤는 a little의 쓰임을 확인해요.  2) ④는 -thing 대명사를 꾸미는 형용사의 자리를 확인해요.","옳은 것은 세 개예요. ②는 빈도부사가 일반동사 앞에 와야 하고, ⑤는 problems(복수)와 a little이 어울리지 않아요.","①, ③, ④ 옳음  /  ② sometimes buys,  ⑤ (a) few");
P("RT","RT",26,"c","(어법상 옳은 것으로 바르게 짝지어진 것은?) a. I spent a few money in the market. b. Canada is as cold as Russia. c. My hair is longer than yours. d. I go rarely to the park for jogging. e. Colin’s hat is more nice than mine.","① b, c","b. Canada is as cold as Russia. c. My hair is longer than yours.","b. 캐나다는 러시아만큼 춥다. c. 내 머리카락은 네 것보다 더 길다.",U3D,"1) a는 money(셀 수 없음)와 a few가 어울리는지, d는 빈도부사 rarely의 자리, e는 nice(멋진)의 비교급 만드는 법을 확인해요.  2) 틀린 것을 하나씩 지워 나가요.","옳은 것은 b와 c예요. 보기 중 b, c만 짝지은 것을 찾아요.","a, d, e는 각각 어디가 틀렸는지 찾아 지우면 정답이 남아요.",["① b, c","② c, e","③ a, b, c","④ b, c, d","⑤ b, c, e"]);
P("RT","RT",27,"c","• Suddenly, he fell down the stairs. • Kate often feels tired these days. • Jill is much kinder than Tracy. • Andy didn’t put many salt in his soup. • Did you hear new anything?","③ 3개","옳은 문장: Suddenly, he fell down the stairs. / Kate often feels tired these days. / Jill is much kinder than Tracy.","옳은 문장: 갑자기 그는 계단에서 굴러떨어졌다. / Kate는 요즘 자주 피곤함을 느낀다. / Jill은 Tracy보다 훨씬 더 친절하다.",U1B1,"1) salt(소금)는 셀 수 없는 명사예요. many와 어울리는지 보세요.  2) anything(어떤 것)은 -thing 대명사예요. 형용사 new의 위치를 보세요.","다섯 문장 중 틀린 문장이 몇 개인지 세어 5에서 빼요.","many salt → much salt,  new anything → anything new",["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"]);
P("RT","RT",28,"w","This cake has <u>few</u> sugar, so it’s not very sweet. (O / X)","X, little","This cake has little sugar, so it’s not very sweet.","이 케이크에는 설탕이 거의 없어서 그다지 달지 않다.",U1B2,"1) sugar(설탕)는 셀 수 없는 명사예요.  2) 셀 수 없는 명사 앞에서 ‘거의 없는’은 few가 아니라 다른 말이에요.","X예요. few를 l로 시작하는 말로 고쳐요.","few는 셀 수 있는 복수명사용 → 셀 수 없는 sugar엔 little");
P("RT","RT",29,"w","My cat can jump <u>highly</u> in the air. (O / X)","X, high","My cat can jump high in the air.","내 고양이는 공중에서 높이 뛸 수 있다.","본책 p.106 B ‘부사의 형태’ 표의 ‘<부사 + ly>가 다른 뜻을 가지는 부사’를 보세요.","1) 높이 뛴다는 뜻이에요.  2) high는 형용사와 부사의 모양이 같아요. highly는 ‘매우’라는 다른 뜻이에요.","X예요. highly에서 -ly를 빼요.","‘높게’ = high (highly는 ‘매우’)");
P("RT","RT",30,"w","Dad drives usually the car slowly. But today he was very lately. He had to drive fast! (2개)","drives usually → usually drives / lately → late","Dad usually drives the car slowly. But today he was very late. He had to drive fast!","아빠는 보통 차를 천천히 운전하신다. 하지만 오늘은 매우 늦으셨다. 아빠는 빠르게 운전해야 했다!",U2C,"1) 빈도부사 usually(보통)는 일반동사 drives(원형 drive 운전하다)의 앞에 써요.  2) was(원형 be ~이다) 뒤에서 he를 설명하는 ‘늦은’은 lately(최근에)가 아니라 다른 말이에요.","첫째는 두 단어의 순서를 바꾸고, 둘째는 lately에서 -ly를 빼요.","빈도부사는 일반동사 앞, be동사 뒤 보어 → late");
P("RT","RT",31,"w","A: I had a greatly vacation. I traveled through Europe.<br>B: That sounds amazing! Where did you like the most?<br>A: Switzerland. It was the more beautiful country of all. (2개)","greatly → great / more beautiful → most beautiful","A: I had a great vacation. I traveled through Europe. B: That sounds amazing! Where did you like the most? A: Switzerland. It was the most beautiful country of all.","A: 나는 멋진 휴가를 보냈어. 나는 유럽을 여행했어. B: 멋지다! 어디가 가장 좋았어? A: 스위스. 그곳이 모든 나라 중에서 가장 아름다운 나라였어.",U3D,"1) vacation(휴가)은 명사예요. 명사를 꾸미는 말은 부사가 아니에요.  2) ‘of all(모든 것 중에서)’이 있으니 ‘가장 ~한’이에요. beautiful(아름다운)은 긴 형용사예요.","첫째는 greatly에서 -ly를 빼요. 둘째는 more를 같은 뜻으로 ‘가장’을 나타내는 말로 바꿔요.","명사 꾸밈 → 형용사 great, ‘가장’ → most + 원급");
P("RT","RT",32,"w","My friend Joan is the most smart girl in the class. She is also the funnyest. She tells us much funny stories. (3개)","the most smart → the smartest / the funnyest → the funniest / much → many","My friend Joan is the smartest girl in the class. She is also the funniest. She tells us many funny stories.","내 친구 Joan은 반에서 가장 똑똑한 소녀이다. 그녀는 또한 가장 웃기다. 그녀는 우리에게 재미있는 이야기를 많이 들려준다.",U3D,"1) smart(똑똑한)는 짧은 형용사라 most를 쓰지 않아요.  2) funny(웃기는)는 -y로 끝나서 y를 i로 고쳐요.  3) stories(이야기들)는 복수명사라 much가 어울리지 않아요.","세 군데예요. smart의 최상급, funny의 최상급(철자!), 복수명사 앞의 ‘많은’을 고쳐요.","짧은 형용사 → -est,  -y → -iest,  복수명사 → many");

P("LR","LR",1,"w","I want something ___. (나는 차가운 것을 원한다.)","cold","I want something cold.","나는 차가운 것을 원한다.","본책 p.104 A-1 ‘형용사의 쓰임’을 펴세요.","1) something(어떤 것)은 -thing으로 끝나는 대명사예요.  2) 이런 대명사는 형용사가 뒤에서 꾸며요. ‘차가운’이 필요해요.","c로 시작하는 네 글자 형용사예요.","something + 형용사(뒤에서 꾸밈)");
P("LR","LR",2,"w","There isn’t ___ water in the bottle. (병에 물이 많지 않다.)","much / a lot of / lots of","There isn’t much water in the bottle. / There isn’t a lot of water in the bottle. / There isn’t lots of water in the bottle.","병에 물이 많지 않다.",U1B1,"1) water(물)는 셀 수 없는 명사예요.  2) 부정문에서 ‘많은’은 셀 수 없는 명사 앞에 쓰는 말이에요.","답은 세 가지가 가능해요. 하나만 써도 돼요. much는 m으로 시작해요.","셀 수 없는 water + 많은 → much / a lot of / lots of");
P("LR","LR",3,"w","___ animals can live in the desert. (사막에서는 동물들이 거의 살 수 없다.)","Few","Few animals can live in the desert.","사막에서는 동물들이 거의 살 수 없다.",U1B2,"1) animals(동물들)는 셀 수 있는 복수명사예요.  2) ‘거의 없는’이에요. 문장 맨 앞이라 대문자로 써요.","F로 시작하는 세 글자예요.","복수명사 + 거의 없는 → Few");
P("LR","LR",4,"w","We had ___ snow last winter. (우리는 지난 겨울에 눈이 거의 없었다.)","little","We had little snow last winter.","우리는 지난 겨울에 눈이 거의 오지 않았다.",U1B2,"1) snow(눈)는 셀 수 없는 명사예요.  2) 셀 수 없는 명사 앞에서 ‘거의 없는’을 뜻하는 말이에요.","l로 시작하는 여섯 글자예요.","셀 수 없는 snow + 거의 없는 → little");
P("LR","LR",5,"w","Mike is working ___. (Mike는 열심히 일하고 있다.)","hard","Mike is working hard.","Mike는 열심히 일하고 있다.",U2B,"1) ‘열심히’는 동사 working(원형 work 일하다)을 꾸미는 부사예요.  2) 표의 ‘형용사와 형태가 같은 부사’에 있는 말이에요.","h로 시작하는 네 글자예요. -ly가 없어요.","hard(열심히) — 형용사와 모양이 같은 부사");
P("LR","LR",6,"w","Laura is ___ busy on weekends. (Laura는 주말에 항상 바쁘다.)","always","Laura is always busy on weekends.","Laura는 주말에 항상 바쁘다.",U2C,"1) ‘항상’을 나타내는 빈도부사예요.  2) 빈도부사는 be동사 뒤에 써요. 표에서 100%인 말이에요.","a로 시작하는 여섯 글자예요.","be동사 뒤 + 항상 → always");
P("LR","LR",7,"w","I am ___ old ___ you. (나는 너랑 나이가 같다.)","as, as","I am as old as you.","나는 너랑 나이가 같다.",U3A,"1) ‘~만큼 …한’은 원급 비교예요.  2) as + 원급 + as 모양이에요. 두 빈칸에 같은 말이 들어가요.","두 칸 모두 a로 시작하는 두 글자예요.","as + 원급 + as");
P("LR","LR",8,"w","Today is warmer ___ yesterday. (오늘은 어제보다 더 따뜻하다.)","than","Today is warmer than yesterday.","오늘은 어제보다 더 따뜻하다.",U3B,"1) warmer(더 따뜻한)는 비교급이에요.  2) 비교급 뒤에는 ‘~보다’를 뜻하는 말이 와요.","t로 시작하는 네 글자예요.","비교급 + than (~보다)");
P("LR","LR",9,"w","This is ___ way to the airport. (이것이 공항으로 가는 가장 빠른 길이다.)","the fastest","This is the fastest way to the airport.","이것이 공항으로 가는 가장 빠른 길이다.",U3C,"1) ‘가장 빠른’은 최상급이에요.  2) the + 최상급이고 fast(빠른)에 -est를 붙여요.","두 단어예요: the + f로 시작하고 -est로 끝나는 말.","the + fast + -est");
P("LR","LR",10,"w","It’s the ___ camera in this shop. (이것이 이 가게에서 가장 좋은 카메라이다.)","best","It’s the best camera in this shop.","이것이 이 가게에서 가장 좋은 카메라이다.",U3D,"1) the 뒤에 ‘가장 좋은’이 와요. 최상급이에요.  2) 표의 ‘불규칙 변화’에서 good(좋은)의 최상급을 찾아요.","b로 시작하는 네 글자예요.","the + good의 최상급(불규칙) → best");

 h:["본책 p.120 A ‘형용사적 용법’과 B-3 ‘결과’를 펴세요.","1) 나머지 넷은 to-v가 앞의 명사(newspaper, anything, something, dress)를 ‘~할’로 꾸며 줘요.  2) 하나는 ‘살아서 ~이 되었다’는 결과예요.","woman이 나오는 문장이에요."],

RW(28,"밑줄 친 부분이 어법상 옳은지 판단하고, 틀리면 바르게 고치시오.<br>She will keep taking selfies until she <u>will get</u> a good one.<br>(O / X)","X, gets","She will keep taking selfies until she gets a good one.","그녀는 괜찮은 사진을 얻을 때까지 계속 셀카를 찍을 것이다.",

RW(30,"어법상 틀린 부분을 찾아 바르게 고치시오. (2개)<br>I think it Julia should be class president. If she will become class president, she’ll make our class the best in the school.","think it → think (that) / will become → becomes","I think (that) Julia should be class president. If she becomes class president, she’ll make our class the best in the school.","나는 줄리아가 반장이 되어야 한다고 생각한다. 그녀가 반장이 되면 그녀는 우리 반을 학교에서 최고로 만들 것이다.",

RW(31,"어법상 틀린 부분을 찾아 바르게 고치시오. (3개)<br>Yesterday was a holiday, but I didn’t go to school. I went to the amusement park with Peter or Pam. We were tired or happy.","but → so / Peter or Pam → Peter and Pam / tired or happy → tired but happy","Yesterday was a holiday, so I didn’t go to school. I went to the amusement park with Peter and Pam. We were tired but happy.","어제는 휴일이어서 나는 학교에 가지 않았다. 나는 피터와 팸과 함께 놀이공원에 갔다. 우리는 피곤했지만 행복했다.",

[["A: Eric has a blog, ___ ___?<br>B: ___, ___ ___.","doesn’t he / No, he doesn’t","A: Eric has a blog, doesn’t he? B: No, he doesn’t.","A: 에릭은 블로그가 있지, 그렇지 않니? B: 아니, 없어.","표에서 blog는 Daisy만 → 긍정 + has → doesn’t he? / No, he doesn’t","1) 표를 보면 블로그가 있는 사람은 Daisy예요. Eric은 없어요.  2) 앞 문장은 긍정(has)이라 부가의문문은 doesn’t he, 대답은 부정이라 No","앞 두 칸은 d로 시작하고 n’t가 붙은 말 + he, 대답은 N으로 시작하는 말 + he + d로 시작하는 말"],

 ["A: Daisy and Melody came from New York, ___ ___?<br>B: ___, ___ ___.","didn’t they / Yes, they did","A: Daisy and Melody came from New York, didn’t they? B: Yes, they did.","A: 데이지와 멜로디는 뉴욕에서 왔지, 그렇지 않니? B: 응, 맞아.","긍정 + came(과거) → didn’t they? / 표에서 둘 다 New York → Yes, they did","1) 표를 보면 Daisy와 Melody 둘 다 New York에서 왔어요.  2) 긍정문이라 didn’t they, 내용이 맞으니 대답은 Yes","앞 두 칸은 d로 시작하고 n’t가 붙은 말 + they, 대답은 Y로 시작하는 말 + they + d로 시작하는 말"],

A("RT","RT",16,"c",{q:"다음 대답에 알맞은 의문문을 고르시오.<br>I went there with Jane.",opts:o,ans:o[4],full:"Who did you go to the theater with? - I went there with Jane.",ko:"너는 극장에 누구와 함께 갔니? - 나는 제인과 함께 갔어.",
 h:["본책 p.160 A ‘who: 누구’를 펴세요.","1) 대답의 with Jane(제인과 함께)은 사람이에요.  2) 사람을 묻는 의문사를 찾아요. 문장 끝에 with가 남아 있어요.","W로 시작하는 세 글자이고, 보기 문장 끝이 with예요."],
 pen:"대답 with Jane(사람) → Who ~ with?"});
A("RT","RT",17,"w",{q:"• A: ___ much is this shirt?<br>&nbsp;&nbsp;B: It is $50.<br>• A: ___ did you spend your weekend?<br>&nbsp;&nbsp;B: I went camping with my family.",ans:"How",full:"A: How much is this shirt? B: It is $50. / A: How did you spend your weekend? B: I went camping with my family.",ko:"A: 이 셔츠는 얼마니? B: 50달러야. / A: 주말을 어떻게 보냈니? B: 가족과 캠핑을 갔어.",
 h:["본책 p.162 D ‘how: 어떤, 어떻게, 얼마나 ~한/하게’를 펴세요.","1) 첫 문장: much 앞이라 how much(얼마)  2) 둘째 문장: 주말을 ‘어떻게’ 보냈는지 묻는 말이에요. 두 칸에 모두 같은 말이 들어가요.","H로 시작하는 세 글자예요."],
 pen:"how much(얼마) / How(어떻게) → 공통 How"});
A("RT","RT",18,"w",{q:"• ___ waste your time.<br>• A: ___ you know this song?<br>&nbsp;&nbsp;B: No, I don’t. But it sounds great.",ans:"Don’t",full:"Don’t waste your time. / A: Don’t you know this song? B: No, I don’t. But it sounds great.",ko:"네 시간을 낭비하지 마라. / A: 너는 이 노래를 모르니? B: 응, 몰라. 하지만 좋게 들린다.",
 h:["본책 p.168 A-1 ‘Don’t[Do not] + 동사원형’과 p.166 A-1 부정의문문 표를 펴세요.","1) 첫 문장: 동사원형 waste(낭비하다) 앞 → ‘~하지 마라’  2) 둘째 문장: 일반동사 know 앞에 오는 부정의문문의 시작 Don’t you ~?","D로 시작하고 n’t가 붙은 말이에요."],
 pen:"~하지 마라 / Don’t you ~? → 공통 Don’t"});
o=mk(["How did you invite Tim to your birthday party?","How can you invite Tim to your birthday party?","Why do you invite Tim to your birthday party?","Why don’t you invite Tim to your birthday party?","Why don’t we invite Tim to your birthday party?"]);
A("RT","RT",19,"c",{q:"다음 우리말을 영어로 바르게 옮긴 것은?<br>너 네 생일 파티에 Tim을 초대하는 게 어때?",opts:o,ans:o[3],full:"Why don’t you invite Tim to your birthday party?",ko:"너 네 생일 파티에 Tim을 초대하는 게 어때?",
 h:["본책 p.162 C 아래 cf. ‘Why don’t you ~?’와 ‘Why don’t we ~?’를 펴세요.","1) ‘(너) ~하는 게 어때?’는 Why don’t you ~?, ‘우리 ~하지 않을래?’는 Why don’t we ~?예요.  2) 우리말의 주어는 ‘너’예요.","Why don’t로 시작하고 뒤에 you가 오는 보기예요."],
 pen:"(너) ~하는 게 어때? → Why don’t you ~?"});
A("RT","RT",20,"w",{q:"코트를 입어라, 그러지 않으면 너는 감기에 걸릴 것이다. (wear)<br>→ ___ a coat, ___ you will catch a cold.",ans:"Wear, or",full:"Wear a coat, or you will catch a cold.",ko:"코트를 입어라, 그러지 않으면 너는 감기에 걸릴 것이다.",
 h:["본책 p.168 오른쪽 PLUS ‘명령문 + and/or ~’를 펴세요.","1) ‘입어라’는 명령문이라 동사원형 wear로 시작해요.  2) ‘~해라, 그러지 않으면 …할 것이다’는 「명령문, or ~」예요.","첫 칸은 W로 시작하는 동사원형, 둘째 칸은 o로 시작하는 두 글자예요."],
 pen:"명령문, or ~ = ~해라, 그러지 않으면 …"});
A("RT","RT",21,"w",{q:"우리 버스 정류장을 찾아보자. (find)<br>→ ___ ___ a bus stop.",ans:"Let’s find",full:"Let’s find a bus stop.",ko:"우리 버스 정류장을 찾아보자.",
 h:["본책 p.168 A-2 ‘Let’s + 동사원형: ~하자’를 펴세요.","1) ‘~하자’는 권유예요.  2) Let’s + 동사원형(find 찾다)","두 칸: L로 시작하는 말 / find"],
 pen:"~하자 → Let’s + 동사원형"});
A("RT","RT",22,"w",{q:"우리에게 돈이 얼마나 있습니까?<br>(we, how, do, have, much, money)<br>→ ___ ?",ans:"How much money do we have",full:"How much money do we have?",ko:"우리에게 돈이 얼마나 있습니까?",
 h:["본책 p.162 D-2 ‘how much + 셀 수 없는 명사: 얼마나 많은 양의 ~’를 펴세요.","1) money(돈)는 셀 수 없는 명사라서 how much + money  2) 그 뒤에 일반동사 의문문 순서: do + 주어(we) + 동사원형(have)","How much money로 시작하고 do we가 이어져요."],
 pen:"셀 수 없는 명사 → How much + 명사 + do + 주어 + 동사?"});
A("RT","RT",23,"w",{q:"당신의 차를 여기에 주차하지 마세요.<br>(your car, don’t, here, park)<br>→ ___ .",ans:"Don’t park your car here",full:"Don’t park your car here.",ko:"당신의 차를 여기에 주차하지 마세요.",
 h:["본책 p.168 A-1 ‘Don’t[Do not] + 동사원형 ~: ~하지 마라’를 펴세요.","1) ‘~하지 마세요’ → 금지하는 명령문  2) Don’t + 동사원형(park) + 목적어(your car) + 장소(here)","Don’t로 시작하고 park가 바로 뒤에 와요."],
 pen:"~하지 마라 → Don’t + 동사원형 + 목적어"});
A("RT","RT",24,"w",{q:"그것은 정말 좋은 계획이구나!<br><조건> 1. a nice plan, it을 이용할 것<br>2. 주어, 동사를 생략하지 말 것<br>→ ___ !",ans:"What a nice plan it is",full:"What a nice plan it is!",ko:"그것은 정말 좋은 계획이구나!",
 h:["본책 p.168 B ‘what으로 시작하는 감탄문’을 펴세요. What an exciting game (it is)!도 보세요.","1) a nice plan은 a + 형용사 + 명사예요.  2) What + a(n) + 형용사 + 명사 + 주어(it) + 동사(is)! 이번에는 주어, 동사를 꼭 써요.","What으로 시작하는 여섯 단어이고, 끝은 it is예요."],
 pen:"What + a + 형용사 + 명사 + 주어 + 동사!"});
A("RT","RT",25,"w",{q:"다음 중 어법상 옳은 것을 모두 고르면?<br>① Doesn’t Frank wear glasses?<br>② When does your class start?<br>③ Let’s don’t talk about the exam.<br>④ How much English books do you have?<br>⑤ Tom doesn’t like Asian food, does he?",ans:"①, ②, ⑤",full:"① Doesn’t Frank wear glasses? ② When does your class start? ⑤ Tom doesn’t like Asian food, does he?",ko:"① 프랭크는 안경을 쓰지 않니? ② 너희 수업은 언제 시작하니? ⑤ 톰은 아시아 음식을 좋아하지 않지, 그렇지?",
 h:["본책 p.168 A-2(Let’s not), p.162 D-2(how many / how much), p.164 A-2(부가의문문), p.166 A-1(부정의문문)을 펴세요.","1) ③은 ‘~하지 말자’의 not 자리를 확인해요.  2) ④는 books(책들)가 셀 수 있는지 확인해요.","틀린 것은 ③과 ④ 두 개예요. 나머지 세 개의 번호를 모두 쓰세요."],
 pen:"③ Let’s not / ④ How many가 되어야 틀림"});
o=["① a, c, d","② a, c, e","③ a, d, e","④ b, c, d","⑤ c, d, e"];
A("RT","RT",26,"c",{q:"다음 중 어법상 옳은 것으로 바르게 짝지어진 것은?<br>a. Be kind to your friends.<br>b. What a lucky girls we are!<br>c. Whose father is that man?<br>d. Be careful, won’t you?<br>e. We should finish the work today, shouldn’t we?",opts:o,ans:o[1],full:"a. Be kind to your friends. c. Whose father is that man? e. We should finish the work today, shouldn’t we?",ko:"a. 네 친구들에게 친절하게 대해라. c. 저 남자는 누구의 아버지니? e. 우리는 오늘 그 일을 끝내야 해, 그렇지 않니?",
 h:["본책 p.168 B cf.(복수 명사의 감탄문)와 p.164 PLUS(명령문의 부가의문문)를 펴세요.","1) b는 girls(복수)인데 a가 붙어 있어요.  2) d는 명령문이라서 부가의문문이 ~, will you? 이어야 해요.","틀린 것은 b와 d예요. 이 둘이 빠진 보기를 고르세요."],
 pen:"b 복수 명사엔 a 없음 / d 명령문 → will you"});
o=["① 1개","② 2개","③ 3개","④ 4개","⑤ 5개"];
A("RT","RT",27,"c",{q:"다음 중 어법상 옳은 것의 개수는?<br>• How diligent are they!<br>• Let’s have some ice cream, shall we?<br>• When did you learn Spanish?<br>• What kind of movies does she like?<br>• Don’t turns off the air conditioner.",opts:o,ans:o[2],full:"Let’s have some ice cream, shall we? / When did you learn Spanish? / What kind of movies does she like?",ko:"우리 아이스크림 좀 먹자, 그럴래? / 너는 스페인어를 언제 배웠니? / 그녀는 어떤 종류의 영화를 좋아하니?",
 h:["본책 p.168 B ‘감탄문’(How + 형용사 + 주어 + 동사), A-1 ‘명령문’, p.164 PLUS를 펴세요.","1) 감탄문은 How diligent they are!처럼 주어 동사 순서예요.  2) Don’t 뒤에는 동사원형이 와요.","다섯 문장 중 틀린 것이 두 개예요. 나머지 개수를 세세요."],
 pen:"감탄문은 주어+동사 순 / Don’t 뒤 동사원형 → 틀린 2개"});
A("RT","RT",28,"w",{q:"A: Doesn’t Ann have a brother?<br>B: <u>No, she doesn’t.</u> His name is Larry.<br>(밑줄 친 부분이 맞으면 O, 틀리면 X와 바르게 고친 말) (O / X)",ans:"X, Yes, she does.",full:"A: Doesn’t Ann have a brother? B: Yes, she does. His name is Larry.",ko:"A: 앤은 남자 형제가 없니? B: 아니, 있어. 그의 이름은 래리야.",
 h:["본책 p.166 A-2 ‘대답’을 펴세요.","1) 뒤에 His name is Larry(그의 이름은 래리야)라고 해서 남자 형제가 있다는 내용이에요.  2) 내용이 긍정이면 질문이 부정의문문이어도 Yes로 답해요.","O/X 중 X이고, 고친 말은 Y로 시작하는 Yes, she ___.예요."],
 pen:"내용이 긍정(형제 있음) → Yes, she does"});
A("RT","RT",29,"w",{q:"Danny had an appointment with you yesterday, <u>hadn’t Danny</u>?<br>(O / X)",ans:"X, didn’t he",full:"Danny had an appointment with you yesterday, didn’t he?",ko:"대니는 어제 너와 약속이 있었지, 그렇지 않니?",
 h:["본책 p.164 A-2 ‘부가의문문 만드는 법’ 표를 펴세요.","1) 주어는 대명사로 바꿔요 (Danny → he).  2) had(가졌다)는 일반동사 과거라서 did를 써요: 긍정문이니 부정 didn’t","X이고, 고친 말은 d로 시작하고 n’t가 붙은 말 + he예요."],
 pen:"일반동사 had(과거) → didn’t he? (주어는 대명사)"});
A("RT","RT",30,"w",{q:"A: Who <u>know</u> Luke’s number?<br>B: Kate may know it.<br>(O / X)",ans:"X, knows",full:"A: Who knows Luke’s number? B: Kate may know it.",ko:"A: 누가 루크의 전화번호를 아니? B: 케이트가 알지도 몰라.",
 h:["본책 p.160 오른쪽 PLUS ‘의문사가 주어일 때는 3인칭 단수 취급’을 펴세요.","1) Who가 주어예요.  2) 의문사가 주어이면 3인칭 단수 취급이라 현재 동사에 -s를 붙여요.","X이고, 고친 말은 know에 s를 붙인 한 단어예요."],
 pen:"Who가 주어 → 3인칭 단수 (know → knows)"});
A("RT","RT",31,"w",{q:"What dirty it is! Clean your room, shall you?<br>(틀린 부분 2개를 찾아 바르게 고치기)",ans:"What dirty → How dirty, shall you → will you",full:"How dirty it is! Clean your room, will you?",ko:"정말 더럽구나! 네 방을 청소해라, 그래 줄래?",
 h:["본책 p.168 B ‘감탄문’ 표와 p.164 오른쪽 PLUS ‘명령문과 권유문의 부가의문문’을 펴세요.","1) 첫 문장: dirty(더러운)는 형용사만 있고 명사가 없어요.  2) 둘째 문장: Clean your room은 명령문이에요. 명령문의 부가의문문은 항상 ~, will you?","첫째는 What 대신 H로 시작하는 말로, 둘째는 shall 대신 w로 시작하는 말로 고쳐요."],
 pen:"형용사만 → How / 명령문 → , will you?"});
A("RT","RT",32,"w",{q:"A: Which do you want to drink, coffee and tea?<br>B: Coffee, please.<br>A: What do you like coffee?<br>B: Because it smells great.<br>(틀린 부분 2개를 찾아 바르게 고치기)",ans:"and → or, What → Why",full:"A: Which do you want to drink, coffee or tea? B: Coffee, please. A: Why do you like coffee? B: Because it smells great.",ko:"A: 커피와 차 중 어느 것을 마시고 싶니? B: 커피 주세요. A: 너는 왜 커피를 좋아하니? B: 냄새가 좋기 때문이에요.",
 h:["본책 p.166 B-1 ‘선택의문문’과 p.162 C ‘why: 왜’를 펴세요.","1) 첫 질문 Which ~, A ___ B?는 선택의문문이에요.  2) 둘째 질문의 대답이 Because(왜냐하면)로 시작해요.","첫째는 a로 시작하는 말을 o로 시작하는 말로, 둘째는 What을 W로 시작하는 세 글자 의문사로 고쳐요."],
 pen:"선택의문문 → A or B / 대답 Because → Why"});
A("RT","RT",33,"w",{q:"A: Looked at the sky! It’s so lovely, is it?<br>B: Yes, it is. Why do we go on a picnic?<br>A: That’s a good idea.<br>(틀린 부분 3개를 찾아 바르게 고치기)",ans:"Looked → Look, is it → isn’t it, Why do we → Why don’t we",full:"A: Look at the sky! It’s so lovely, isn’t it? B: Yes, it is. Why don’t we go on a picnic? A: That’s a good idea.",ko:"A: 하늘을 봐! 정말 아름답지, 그렇지 않니? B: 응, 그래. 우리 소풍 가지 않을래? A: 좋은 생각이야.",
 h:["본책 p.168 A-1 ‘명령문’, p.164 A-2 ‘부가의문문 만드는 법’, p.162 C 아래 cf. ‘Why don’t we ~?’를 펴세요.","1) 첫째: 명령문은 동사원형으로 시작해요.  2) 둘째: 긍정문 It’s ~ 뒤에는 부정의 부가의문문  3) 셋째: ‘우리 ~하지 않을래?’는 Why don’t we ~?","첫째는 Look(동사원형), 둘째는 i로 시작하고 n’t가 붙은 말 + it, 셋째는 Why d로 시작하는 말 + we로 고쳐요."],
 pen:"명령문=동사원형 / 긍정→isn’t it? / ~하지 않을래? Why don’t we"});
// ---------- LET’S REVIEW ----------
[["___ is that man?<br>(저 남자는 누구니?)","Who","Who is that man?","저 남자는 누구니?","본책 p.160 A ‘who: 누구’를 펴세요.","1) 한글이 ‘누구니?’  2) 사람을 묻는 의문사예요.","W로 시작하는 세 글자예요.","사람을 묻는 말 → Who"],
 ["___ day is it today?<br>(오늘은 무슨 요일이니?)","What","What day is it today?","오늘은 무슨 요일이니?","본책 p.160 B ‘what: 무엇, 무슨 (~)’을 펴세요.","1) 한글이 ‘무슨 요일’  2) 뒤에 명사 day가 오는 ‘무슨’이에요.","W로 시작하는 네 글자예요.","무슨 + 명사 → What"],
 ["___ is better, this one or that one?<br>(이것과 저것 중에 어느 것이 더 낫니?)","Which","Which is better, this one or that one?","이것과 저것 중에 어느 것이 더 낫니?","본책 p.160 C ‘which: 어느 것, 어떤 (~)’을 펴세요.","1) 한글이 ‘어느 것’, this one or that one은 둘 중 고르기예요.  2) 고르는 질문이에요.","W로 시작하는 다섯 글자예요.","A or B 고르기 → Which"],
 ["___ is the post office?<br>(우체국은 어디에 있니?)","Where","Where is the post office?","우체국은 어디에 있니?","본책 p.162 B ‘where: 어디에, 어디서’를 펴세요.","1) 한글이 ‘어디에 있니?’  2) 장소를 묻는 의문사예요.","W로 시작하는 다섯 글자예요.","장소를 물음 → Where"],
 ["A: ___ are you so upset?<br>B: Because we lost the game.<br>(너는 왜 그렇게 화가 났니? / 왜냐하면 우리가 경기에서 졌기 때문이야.)","Why","A: Why are you so upset? B: Because we lost the game.","A: 너는 왜 그렇게 화가 났니? B: 왜냐하면 우리가 경기에서 졌기 때문이야.","본책 p.162 C ‘why: 왜’를 펴세요.","1) 한글이 ‘왜’이고 대답이 Because예요.  2) 이유를 묻는 의문사예요.","W로 시작하는 세 글자예요.","이유 질문, 대답 Because → Why"],
 ["___ do you spend your free time?<br>(너는 여가 시간을 어떻게 보내니?)","How","How do you spend your free time?","너는 여가 시간을 어떻게 보내니?","본책 p.162 D-1 ‘어떤, 어떻게’를 펴세요.","1) 한글이 ‘어떻게’  2) 방법을 묻는 의문사예요.","H로 시작하는 세 글자예요.","방법 → How"],
 ["Your mother was a cook, ___ she?<br>(네 어머니는 요리사셨어, 그렇지 않니?)","wasn’t","Your mother was a cook, wasn’t she?","네 어머니는 요리사셨어, 그렇지 않니?","본책 p.164 A-2 ‘부가의문문 만드는 법’을 펴세요.","1) 앞 문장이 긍정문(was)이라 부가의문문은 부정  2) be동사 과거 was를 같이 써요.","w로 시작하고 n’t가 붙은 말이에요.","긍정 was → wasn’t she?"],
 ["A: Do you want to go out ___ stay at home?<br>B: I want to stay at home.<br>(너는 밖에 나가고 싶니 집에 있고 싶니? / 나는 집에 있고 싶어.)","or","A: Do you want to go out or stay at home? B: I want to stay at home.","A: 너는 밖에 나가고 싶니 집에 있고 싶니? B: 나는 집에 있고 싶어.","본책 p.166 B-1 ‘선택의문문’을 펴세요.","1) 나가기와 집에 있기 둘 중 고르는 질문이에요.  2) 고르게 하는 연결어를 써요.","o로 시작하는 두 글자예요.","선택의문문 → A or B"],
 ["___ play soccer after school.<br>(방과 후에 축구 하자.)","Let’s","Let’s play soccer after school.","방과 후에 축구 하자.","본책 p.168 A-2 ‘Let’s + 동사원형: ~하자’를 펴세요.","1) 한글이 ‘~하자’  2) 뒤에 동사원형 play가 와요.","L로 시작하는 말이에요.","~하자 → Let’s + 동사원형"],
 ["___ an exciting game (it is)!<br>(매우 흥미진진한 경기구나!)","What","What an exciting game (it is)!","매우 흥미진진한 경기구나!","본책 p.168 B ‘what으로 시작하는 감탄문’을 펴세요.","1) 빈칸 뒤가 an exciting game → a(n) + 형용사 + 명사  2) What + a(n) + 형용사 + 명사!","W로 시작하는 네 글자예요.","a(n) + 형용사 + 명사 → What"]
].forEach((r,i)=>A("LR","LR",i+1,"w",{q:r[0],ans:r[1],full:r[2],ko:r[3],h:[r[4],r[5],r[6]],pen:r[7]}));

}
const KEY="gi-l1-2021-v2",PIN="7372";
const PEN='<svg class="pen" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l1-4L16.5 4.5a2 2 0 0 1 2.8 0l.2.2a2 2 0 0 1 0 2.8L8 19z"/><path d="M14.5 6.5l3 3"/></svg>';
function fresh(){return{it:{},last:0}}
let S;try{S=JSON.parse(localStorage.getItem(KEY))||fresh()}catch(e){S=fresh()}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
const $=s=>document.querySelector(s);
let view="home",cur=null,curCh=0,sh=0,wrong=0,pinv="",tab="stuck";
function st(id){return S.it[id]||(S.it[id]={h:0,tries:0,ok:null,rev:0,pen:0})}
function IT(id){return ITEMS.find(x=>x.id==id)}
function R(h){document.getElementById("app").innerHTML=h;try{window.scrollTo(0,0)}catch(e){}}
function go(v){view=v;render()}
function render(){({home,chapter,item,unitend,pin,teacher})[view]()}
const doneOf=L=>L.filter(x=>st(x.id).pen).length;
const chItems=c=>ITEMS.filter(x=>x.ch==c),unItems=uk=>ITEMS.filter(x=>x.uk==uk);
const chList=()=>Object.keys(CHAPS).map(Number).sort((a,b)=>a-b);
function pad2(n){return(n<10?"0":"")+n}
function home(){
 let h='<div class="top"><h1>Grammar Inside L1</h1><div class="sub">본책 도우미 · 2021 개정판</div></div>';
 h+='<div class="card"><b>답 대신 힌트</b><div class="small">막히면 힌트를 1 → 2 → 3 순서로 열어요. 맞혀도 연필 한 줄은 꼭 써요.</div></div>';
 chList().forEach(c=>{const L=chItems(c),d=doneOf(L);
  h+='<button class="row" onclick="openCh('+c+')"><span><b>CHAPTER '+pad2(c)+'</b> '+CHAPS[c].name+'</span><span class="pill '+(d==L.length?"on":"")+'">'+d+' / '+L.length+'</span></button>'});
 h+='<div class="foot"><a onclick="go(\'pin\')">선생님</a></div>';R(h)}
function openCh(c){curCh=c;go("chapter")}
function chapter(){const c=curCh;
 let h='<div class="bk"><a onclick="go(\'home\')">목록</a><span class="small">CHAPTER '+pad2(c)+'</span></div><h2>'+CHAPS[c].name+'</h2>';
 CHAPS[c].units.forEach(k=>{const uk=c+"-"+k,L=unItems(uk),U=UN[uk];if(!L.length)return;const d=doneOf(L);
  h+='<button class="row" onclick="start(\''+uk+'\')"><span><b>'+U.n+'</b> '+U.t+'<span class="small"> · '+(U.cp?"개념 "+U.cp+" · ":"")+"문제 "+U.pp+'</span></span><span class="pill '+(d==L.length?"on":"")+'">'+d+' / '+L.length+'</span></button>'});
 R(h)}
function start(uk){const L=unItems(uk),n=L.find(x=>!st(x.id).pen)||L[0];open_(n.id)}
function open_(id){cur=id;sh=st(id).h||0;wrong=0;go("item")}
function item(){
 const it=IT(cur),s=st(cur),U=UN[it.uk],L=unItems(it.uk);
 let h='<div class="bk"><a onclick="openCh('+it.ch+')">목록</a><span class="small">CH'+pad2(it.ch)+' · '+U.n+' · '+SECLAB(it)+'</span></div>';
 h+='<div class="q">'+it.q.replace(/___/g,'<span class="blank"></span>')+'</div>';
 if(it.bank)h+='<div class="small">보기 : '+it.bank.join(" · ")+' (한 번씩만)</div>';
 if(it.kind=="w"&&!s.rev)h+='<div class="small">본책에 직접 써요.</div>';
 h+='<div class="hint">';
 for(let i=0;i<3;i++){h+=i<sh?'<div class="hp"><b>힌트 '+(i+1)+'</b> '+it.h[i]+'</div>':(i==sh?'<button class="btn ghost" onclick="openHint()">힌트 '+(i+1)+' 열기 : '+["본책 어디?","생각 순서","거의 답"][i]+'</button>':'')}
 h+='</div>';
 if(!s.rev){
  if(it.kind=="c")h+='<div class="opts">'+it.opts.map((o,i)=>'<button class="opt" onclick="pick('+i+')">'+o+'</button>').join("")+'</div>'+(wrong?'<div class="note">다시 한 번 골라 봐요. 힌트를 열어서 따라가 보세요.</div>':'');
  else h+='<button class="btn" onclick="wrote()">다 썼어요 · 답 보기</button>';
 }else{
  h+='<div class="ans"><div class="small">정답</div><b>'+it.full+'</b><div class="small">'+it.ko+'</div></div>';
  if(it.kind=="w"&&s.self==null)h+='<div class="note">내가 쓴 답과 비교해 보세요.</div><div class="two"><button class="btn" onclick="selfck(1)">똑같이 썼어요</button><button class="btn ghost" onclick="selfck(0)">고쳐 썼어요</button></div>';
  else{
   h+='<div class="post"><div class="pt">'+PEN+' 책에 쓰기 · 본책 '+U.pp+' 이 문제 옆 여백에 이 한 줄만</div><div class="pl">'+it.pen+'</div><div class="pt2">맞혔어도 이 한 줄은 꼭 써요.</div></div>';
   if(!s.pen)h+='<button class="btn pencil" onclick="penDone()">'+PEN+' 다 썼어요</button>';
   else{const last=L[L.length-1].id==cur;h+='<div class="small ok">연필 한 줄 완료</div><button class="btn" onclick="nextItem()">'+(last?"이 파트 마무리":"다음 문제")+'</button>'}
  }
 }
 R(h)}
function openHint(){sh++;st(cur).h=Math.max(st(cur).h,sh);save();render()}
function pick(i){const it=IT(cur),s=st(cur);s.tries++;
 if(it.opts[i]==it.ans){s.rev=1;s.ok=s.tries==1?1:0}
 else{wrong++;if(wrong>=2){s.rev=1;s.ok=0}}save();render()}
function wrote(){st(cur).rev=1;save();render()}
function selfck(v){const s=st(cur);s.self=v;s.ok=v;save();render()}
function penDone(){st(cur).pen=1;save();render()}
function nextItem(){const it=IT(cur),L=unItems(it.uk),i=L.findIndex(x=>x.id==cur);
 if(i==L.length-1){go("unitend");return}open_(L[i+1].id)}
function unitend(){const it=IT(cur),L=unItems(it.uk),U=UN[it.uk];
 const ok=L.filter(x=>st(x.id).ok).length,hs=L.reduce((a,x)=>a+st(x.id).h,0);
 R('<div class="bk"><a onclick="openCh('+it.ch+')">목록</a></div><h2>'+U.n+' 끝</h2><div class="small">처음에 바로 맞힌 문제 '+ok+' / '+L.length+' · 힌트 사용 '+hs+'회</div><div class="post"><div class="pt">'+PEN+' 오늘 쓴 줄 모아 보기</div>'+L.map(x=>'<div class="pl"><span class="small">'+SECSHORT(x)+'</span> '+x.pen+'</div>').join("")+'</div><button class="btn" onclick="openCh('+it.ch+')">목록으로</button>')}
function pin(){pinv="";pinui()}
function pinui(){R('<div class="bk"><a onclick="go(\'home\')">목록</a></div><h2>선생님 확인</h2><div class="dots">'+[0,1,2,3].map(i=>'<i class="'+(i<pinv.length?"f":"")+'"></i>').join("")+'</div><div class="pad">'+[1,2,3,4,5,6,7,8,9,"",0,"←"].map(k=>k===""?'<span></span>':'<button onclick="pk(\''+k+'\')">'+k+'</button>').join("")+'</div>')}
function pk(k){if(k=="←")pinv=pinv.slice(0,-1);else if(pinv.length<4)pinv+=k;if(pinv.length==4){if(pinv==PIN){tab="stuck";go("teacher");return}pinv=""}pinui()}
function teacher(){
 let h='<div class="bk"><a onclick="go(\'home\')">나가기</a><span class="small">선생님 화면</span></div><div class="tabs">'+[["stuck","막힌 문제"],["ctl","관리"]].map(([k,n])=>'<button class="'+(tab==k?"on":"")+'" onclick="tab=\''+k+'\';render()">'+n+'</button>').join("")+'</div>';
 if(tab=="stuck"){
  const pen=ITEMS.filter(x=>st(x.id).pen).length;
  h+='<div class="small">이 기기에서 푼 기록입니다. 실시간 연결은 EM보드에 넣을 때 붙입니다.</div><div class="card"><b>연필 한 줄 완료</b> '+pen+' / '+ITEMS.length+'</div>';
  chList().forEach(c=>{const L=chItems(c);h+='<div class="small">CHAPTER '+pad2(c)+' '+CHAPS[c].name+' : '+doneOf(L)+' / '+L.length+'</div>'});
  const S2=ITEMS.filter(x=>st(x.id).h>=2||st(x.id).ok===0);
  h+='<div class="small" style="margin-top:10px">막힌 문제 (힌트 2단계 이상 또는 바로 못 맞힘)</div>';
  if(!S2.length)h+='<div class="card small">아직 없어요.</div>';
  S2.forEach(x=>{const s=st(x.id);h+='<div class="card"><b>CH'+pad2(x.ch)+' · '+UN[x.uk].n+' · '+SECLAB(x)+'</b><div class="small">힌트 '+s.h+'단계 · 시도 '+s.tries+'회</div><div class="small">'+x.pen+'</div></div>'});
  h+='<div class="small">힌트를 3단계까지 써도 못 맞히면 개념을 오프라인으로 설명하고, 힌트 없이 바로 맞히면 다음 난이도로 넘겨요.</div>';
 }else h+='<div class="card"><b>초기화</b><div class="small">이 기기의 기록을 지웁니다.</div><button class="btn ghost" onclick="S=fresh();save();go(\'home\')">지우기</button></div>';
 R(h)}
render();
</script></body></html>
