ot": [], "fixes": [{"wrong": "saved", "right": "was saved", "partial": false, "at": [2], "point": "수동태: 건물이 '보존된' 것이라 was saved", "topic": "수동태", "memo": "건물이 '보존된' 것이라 was saved"}]}, {"n": 5, "tag": "아르헨티나 · 엘 아테네오", "en": "El Ateneo is one of the most beautiful bookstore in the world. The building opened as a theater in 1919 and many performances held there at that time.", "ko": "엘 아테네오는 세계에서 가장 아름다운 서점들 중 하나이다. 이 건물은 1919년에 극장으로 문을 열었으며, 그 당시 많은 공연들이 이곳에서 열렸다.", "ok": false, "foot": [], "fixes": [{"wrong": "bookstore", "right": "bookstores", "partial": false, "at": [8], "point": "one of + 복수명사: one of the most beautiful 뒤에는 복수명사", "topic": "one of + 복수명사", "memo": "one of the most beautiful 뒤에는 복수명사"}, {"wrong": "held", "right": "were held", "partial": false, "at": [23], "point": "수동태: 공연이 '열린' 것이라 were held", "topic": "수동태", "memo": "공연이 '열린' 것이라 were held"}]}, {"n": 6, "tag": null, "en": "Now, the seats are gone, and books fill the space instead. However, the bookstore still has the stage and balconies of the old theater.", "ko": "이제 좌석은 사라지고, 대신 책들이 공간을 채우고 있다. 그러나 서점에는 여전히 옛 극장의 무대와 발코니가 그대로 있다.", "ok": true, "foot": [], "fixes": []}, {"n": 7, "tag": null, "en": "Visitors can not only read books but also enjoying coffee on the stage.", "ko": "방문객들은 무대에서 책을 읽을 수 있을 뿐만 아니라 커피를 즐길 수도 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "enjoying", "right": "enjoy", "partial": false, "at": [8], "point": "상관접속사의 병렬: not only A but also B에서 A, B의 형태를 맞춤 (read - enjoy)", "topic": "상관접속사의 병렬", "memo": "not only A but also B에서 A, B의 형태를 맞춤 (read - enjoy)"}]}, {"n": 8, "tag": "스페인 · 카오스 신전", "en": "Anyone which sees this skate park can tell its past easily. The building was originally used as a church, but it was empty for many years.", "ko": "이 스케이트보드장을 보는 사람은 누구나 그것의 과거를 쉽게 알 수 있다. 이 건물은 원래 교회로 사용되었으나, 여러 해 동안 비어 있었다.", "ok": false, "foot": [], "fixes": [{"wrong": "which", "right": "who", "partial": false, "at": [1], "point": "주격 관계대명사: 선행사 Anyone은 사람이라 who", "topic": 려 했다.", 0], ["Luckily, it was saved and found a new life as a museum.", "다행히도 그것은 보존되어 미술관으로서 새로운 삶을 찾았다.", 0], ["Its rounded roof and large clock still show traces of the old train station.", "둥근 지붕과 커다란 시계는 여전히 옛 기차역의 흔적을 보여 준다.", 0], ["El Ateneo Bookstore, Buenos Aires, Argentina", "아르헨티나 부에노스아이레스의 엘 아테네오 서점", 1], ["El Ateneo is one of the most beautiful bookstores in the world.", "엘 아테네오는 세계에서 가장 아름다운 서점들 중 하나이다.", 0], ["The building opened as a theater in 1919 and many performances were held there at that time.", "이 건물은 1919년에 극장으로 문을 열었으며, 그 당시 많은 공연들이 이곳에서 열렸다.", 0], ["Now, the seats are gone, and books fill the space instead.", "이제 좌석은 사라지고, 대신 책들이 공간을 채우고 있다.", 0], ["However, the bookstore still has the stage and balconies of the old theater.", "그러나 서점에는 여전히 옛 극장의 무대와 발코니가 그대로 있다.", 0], ["Visitors can not only read books but also enjoy coffee on the stage.", "방문객들은 무대에서 책을 읽을 수 있을 뿐만 아니라 커피를 즐길 수도 있다.", 0], ["Kaos Temple, Llanera, Spain", "스페인 야네라의 카오스 신전", 1], ["Anyone who sees this skate park can tell its past easily.", "이 스케이트보드장을 보는 사람은 누구나 그것의 과거를 쉽게 알 수 있다.", 0], ["The building was originally used as a church, but it was empty for many years.", "이 건물은 원래 교회로 사용되었으나, 여러 해 동안 비어 있었다.", 0], ["In 2015, a group of people started a project to renew it.", "2015년에 한 무리의 사람들이 그것을 새로 단장하는 프로젝트를 시작했다.", 0], ["They kept the structure of the building and painted the walls and ceiling with colorful pictures.", "그들은 건물의 구조를 유지하고 벽과 천장에 화려한 그림을 그렸다.", 0], ["The result was amazing.", "그 결과는 놀라웠다.", 0], ["Now, not only skaters but also art lovers enjoy this unique skate park.", "이제 스케이트보드를 타는 사람들뿐만 아니라 예술을 사랑하는 사람들도 이 독특한 스케이트보드장을 즐긴다.", 0]];var RNUM=68;var TITLE_EN="A Second Life for Old Buildings";var PASS_EN=["A Second Life for Old Buildings", "What happens to buildings when they become too old? While many of them are destroyed, some get a second chance and change into something new. These new buildings show a wonderful harmony between the past and the present.", "Orsay Museum, Paris, France", "Orsay Museum is famous for many paintings by artists such as Van Gogh and Monet. When visitors enter the museum, they are first impressed by the beautiful building itself. This building was originally built as a train station in 1900, but its life as a train station was short. Years later, in 1970, the city tried to tear it down. Luckily, it was saved and found a new life as a museum. Its rounded roof and large clock still show traces of the old train station.", "El Ateneo Bookstore, Buenos Aires, Argentina", "El Ateneo is one of the most beautiful bookstores in the world. The building opened as a theater in 1919 and many performances were held there at that time. Now, the seats are gone, and books fill the space instead. However, the bookstore still has the stage and balconies of the old theater. Visitors can not only read books but also enjoy coffee on the stage.", "Kaos Temple, Llanera, Spain", "Anyone who sees this skate park can tell its past easily. The building was originally used as a church, but it was empty for many years. In 2015, a group of people started a project to renew it. They kept the structure of the building and painted the walls and ceiling with colorful pictures. The result was amazing. Now, not only skaters but also art lovers enjoy this unique skate park."];var PASS_KO=["낡은 건물들의 두 번째 삶", "건물들이 너무 오래되었을 때 무슨 일이 생길까? 많은 건물들이 철거되는 반면, 일부는 두 번째 기회를 얻어 새로운 것으로 바뀐다. 이러한 새 건물들은 과거와 현재 사이의 멋진 조화를 보여 준다.", "프랑스 파리의 오르세 미술관", "오르세 미술관은 Van Gogh와 Monet 같은 예술가들이 그린 많은 그림으로 유명하다. 방문객들이 미술관에 들어서면, 그들은 먼저 아름다운 건물 자체에 감명을 받는다. 이 건물은 원래 1900년에 기차역으로 지어졌지만, 기차역으로서의 수명은 짧았다. 여러 해가 지난 뒤, 1970년에 시에서 그것을 철거하려 했다. 다행히도 그것은 보존되어 미술관으로서 새로운 삶을 찾았다. 둥근 지붕과 커다란 시계는 여전히 옛 기차역의 흔적을 보여 준다.", "아르헨티나 부에노스아이레스의 엘 아테네오 서점", "엘 아테네오는 세계에서 가장 아름다운 서점들 중 하나이다. 이 건물은 1919년에 극장으로 문을 열었으며, 그 당시 많은 공연들이 이곳에서 열렸다. 이제 좌석은 사라지고, 대신 책들이 공간을 채우고 있다. 그러나 서점에는 여전히 옛 극장의 무대와 발코니가 그대로 있다. 방문객들은 무대에서 책을 읽을 수 있을 뿐만 아니라 커피를 즐길 수도 있다.", "스페인 야네라의 카오스 신전", "이 스케이트보드장을 보는 사람은 누구나 그것의 과거를 쉽게 알 수 있다. 이 건물은 원래 교회로 사용되었으나, 여러 해 동안 비어 있었다. 2015년에 한 무리의 사람들이 그것을 새로 단장하는 프로젝트를 시작했다. 그들은 건물의 구조를 유지하고 벽과 천장에 화려한 그림을 그렸다. 그 결과는 놀라웠다. 이제 스케이트보드를 타는 사람들뿐만 아니라 예술을 사랑하는 사람들도 이 독특한 스케이트보드장을 즐긴다."];var BG=[{"qs": [{"n": 6, "q": "윗글의 내용과 일치하지 않는 것은?", "o": ["Many old buildings are broken down.", "The Orsay Museum was a train station in the past.", "The building was used as a train station for a very long time.", "The city tried to destroy the old train station building in 1970.", "The museum still has a roof and a clock from the old train station."], "a": 2, "ans": "The building was used as a train station for a very long time.", "ko": ["많은 오래된 건물들이 철거된다.", "오르세 미술관은 과거에 기차역이었다.", "그 건물은 아주 오랫동안 기차역으로 사용되었다.", "시는 1970년에 옛 기차역 건물을 철거하려 했다.", "미술관에는 여전히 옛 기차역의 지붕과 시계가 남아 있다."], "evs": [["This building was originally built as a train station in 1900, but its life as a train station was short.", "이 건물은 원래 1900년에 기차역으로 지어졌지만, 기차역으로서의 수명은 짧았다."]], "ow": ["오답 ✕ — 'many of them are destroyed'(많은 건물들이 철거된다)라고 했으므로 일치.", "오답 ✕ — 'originally built as a train station'(원래 기차역으로 지어졌다)이라고 했으므로 일치.", "정답 ○ — 'its life as a train station was short'(기차역으로서의 수명은 짧았다)이므로 아주 오랫동안 사용되었다는 말은 일치하지 않는다.", "오답 ✕ — 'in 1970, the city tried to tear it down'(1970년에 시가 철거하려 했다)라고 했으므로 일치.", "오답 ✕ — 'Its rounded roof and large clock still show traces'(둥근 지붕과 시계가 여전히 흔적을 보여 준다)라고 했으므로 일치."], "memo": ["정답 ③: 기차역으로서의 수명은 짧았다.", "근거: its life as a train station was short(기차역으로서의 수명은 짧았다)", "함정: 일치하지 않는 것 찾기! short(짧았다)를 a very long time(아주 오랫동안)으로 바꿔 놓음"], "why": "건물은 기차역으로 오래 쓰이지 못했다.", "ev": ["This building was originally built as a train station in 1900, but its life as a train station was short.", "이 건물은 원래 1900년에 기차역으로 지어졌지만, 기차역으로서의 수명은 짧았다."]}, {"n": 7, "q": "윗글의 제목으로 알맞은 것은?", "o": ["The Old Train Stations in Paris", "The Most Beautiful Museums in France", "Famous Paintings in the Orsay Museum", "A Train Station's New Life as a Museum", "Why Should Old Buildings Be Dest
