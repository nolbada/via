A("RT","RT",5,"c",{q:"Mike ___(A)___ sick last week. He ___(B)___ fine now.",opts:["is … is","is … was","was … is","was … was","were … is"],ans:"was … is",full:"Mike was sick last week. He is fine now.",ko:"마이크는 지난주에 아팠다. 그는 지금은 괜찮다.",h:["본책 UNIT 01의 be동사 현재형·과거형 표를 떠올려요.","(A) 뒤에 last week(지난주)가 있고, (B) 뒤에는 now(지금)가 있어요.","Mike는 한 명이에요. (A)는 과거형, (B)는 현재형으로 골라요."],pen:"(A) last week → 과거 / (B) now → 현재",tr:"마이크는 지난주에 아 ___(A)___. 그는 지금은 괜찮 ___(B)___.",ex:["fine = 괜찮은, 건강한"]});
A("RT","RT",6,"c",{q:"There ___(A)___ thirty books on the bookshelf. They ___(B)___ my brother’s.",opts:["is … is","is … are","are … am","are … is","are … are"],ans:"are … are",full:"There are thirty books on the bookshelf. They are my brother’s.",ko:"책꽂이에 책이 서른 권 있다. 그것들은 내 형(동생)의 것이다.",h:["본책 UNIT 01의 There is/are 부분과 현재형 표를 떠올려요.","(A)는 There 뒤의 thirty books가 하나인지 여러 개인지 보세요. (B)의 주어는 They예요.","(A)와 (B) 모두 여러 개와 짝이 되는 현재형이에요."],pen:"(A) thirty books(여러 권) / (B) They(여러 개)",tr:"책꽂이에 책이 서른 권 ___(A)___. 그것들은 내 형(동생)의 것 ___(B)___.",ex:["bookshelf = 책꽂이","brother’s = 형(동생)의 것"]});
A("RT","RT",7,"w",{q:"___ three middle schools in this town.",ans:"There are",full:"There are three middle schools in this town.",ko:"이 마을에는 중학교가 세 곳 있다.",h:["본책 UNIT 01의 ‘~이 있다’ 문장 만드는 법을 떠올려요.","있는 것이 three middle schools(중학교 세 곳)예요. 여러 개이고 현재예요.","There 뒤에 여러 개와 짝이 되는 3글자 be동사를 써요."],pen:"three middle schools(여러 개) → There are",tr:"이 마을에는 중학교가 세 곳 ___.",ex:["town = 마을"]});
A("RT","RT",8,"w",{q:"___ a rock near the tree.",ans:"There is",full:"There is a rock near the tree.",ko:"나무 근처에 바위가 하나 있다.",h:["본책 UNIT 01의 ‘~이 있다’ 문장 만드는 법을 떠올려요.","있는 것이 a rock(바위 하나)이에요. 하나이고 현재예요.","There 뒤에 하나일 때 쓰는 2글자 be동사를 써요."],pen:"a rock(하나) → There is",tr:"나무 근처에 바위가 하나 ___.",ex:["rock = 바위"]});
A("RT","RT",9,"w",{q:"A: ___ you and Brandon at the station yesterday?<br>B: Yes, we ___.",ans:"Were, were",full:"A: Were you and Brandon at the station yesterday?<br>B: Yes, we were.",ko:"A: 너와 브랜던은 어제 역에 있었니?<br>B: 응, 우리는 있었어.",h:["본책 UNIT 02의 be동사 의문문과 대답 방법을 떠올려요.","yesterday(어제)가 있어서 과거예요. you and Brandon은 we로 대답해요.","두 칸 모두 We와 짝이 되는 과거형이에요. 앞 칸은 대문자로 시작해요."],pen:"yesterday(과거) + you and Brandon(여러 명)",tr:"A: 너와 브랜던은 어제 역에 ___?<br>B: 응, 우리는 ___.",ex:["station = 역"]});
A("RT","RT",10,"w",{q:"A: ___ it rainy outside now?<br>B: No, it ___. It’s just cloudy.",ans:"Is, isn’t",full:"A: Is it rainy outside now?<br>B: No, it isn’t. It’s just cloudy.",ko:"A: 지금 밖에 비가 오니?<br>B: 아니, 안 와. 그냥 흐려.",h:["본책 UNIT 02의 be동사 의문문과 부정 대답을 떠올려요.","now(지금)가 있어서 현재예요. 대답이 No라서 부정이에요.","앞 칸은 It과 짝인 2글자 현재형, 뒤 칸은 그것의 부정 줄임말이에요."],pen:"it + now(현재) → Is / No → isn’t",tr:"A: 지금 밖에 비가 ___?<br>B: 아니, ___. 그냥 흐려.",ex:["rainy = 비가 오는","cloudy = 흐린"]});
A("RT","RT",11,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것은?",opts:["It <u>is</u> sunny today.","Jason <u>is</u> funny.","They <u>are</u> busy last month.","The scissors <u>were</u> in the drawer.","Mary’s birthday <u>was</u> last Friday."],ans:"They <u>are</u> busy last month.",full:"They were busy last month.",ko:"그들은 지난달에 바빴다.",h:["본책 UNIT 01의 be동사 현재형·과거형 표를 떠올려요.","각 문장의 때를 나타내는 말(today, last month, last Friday)과 be동사의 시제를 비교해요.","‘지난달’ 같은 과거 표현이 있는데 현재형을 쓴 문장을 찾아요."],pen:"last month(과거) → 현재형은 어색",tr:"① 오늘은 날씨가 맑다.<br>② 제이슨은 재미있다.<br>③ 그들은 지난달에 바빴다.<br>④ 가위는 서랍 안에 있었다.<br>⑤ 메리의 생일은 지난 금요일이었다.",ex:["scissors = 가위","drawer = 서랍"]});
A("RT","RT",12,"c",{q:"다음 문장에서 not이 들어갈 위치로 적절한 것은?<br>Math ⓐ and ⓑ science ⓒ are ⓓ my favorite subjects. ⓔ",opts:["ⓐ","ⓑ","ⓒ","ⓓ","ⓔ"],ans:"ⓓ",full:"Math and science are not my favorite subjects.",ko:"수학과 과학은 내가 가장 좋아하는 과목이 아니다.",h:["본책 UNIT 02의 be동사 부정문(be동사 + not) 부분을 떠올려요.","이 문장의 be동사가 어느 자리에 있는지 찾아요.","not은 be동사 바로 뒤에 와요. be동사 다음 기호를 골라요."],pen:"be동사 바로 뒤에 not",tr:"수학과 과학은 내가 가장 좋아하는 과목 ___.",ex:["subject = 과목"]});
A("RT","RT",13,"c",{q:"다음 중 대화가 자연스럽지 않은 것은?",opts:["A: Is this card $5?<br>B: Yes, it is.","A: Is Chris a kind boy?<br>B: Yes, he is.","A: Are you a writer?<br>B: Yes, I’m.","A: Is your sister eleven years old?<br>B: Yes, she is.","A: Are Amy and Sam from England?<br>B: No, they aren’t."],ans:"A: Are you a writer?<br>B: Yes, I’m.",full:"A: Are you a writer?<br>B: Yes, I am.",ko:"A: 너는 작가니?<br>B: 응, 나는 작가야.",h:["본책 UNIT 02의 be동사 의문문과 대답(Yes, 주어 + be동사) 부분을 떠올려요.","질문의 주어와 대답의 주어·be동사가 서로 맞는지 하나씩 확인해요.","Yes로 대답할 때는 줄임말을 쓰지 않는 형태가 있어요. 그런 대답을 찾아요."],pen:"Yes 대답은 줄임말로 끝내지 않는다",tr:"① A: 이 카드는 5달러니?<br>B: 응, 그래.<br>② A: 크리스는 친절한 소년이니?<br>B: 응, 그래.<br>③ A: 너는 작가니?<br>B: 응, 그래.<br>④ A: 네 언니(누나)는 열한 살이니?<br>B: 응, 그래.<br>⑤ A: 에이미와 샘은 영국 출신이니?<br>B: 아니, 아니야.",ex:["writer = 작가"]});
A("RT","RT",14,"c",{q:"빈칸에 들어갈 말이 나머지 넷과 다른 것은?",opts:["This ___ a gift for you.","The song ___ very popular.","My wallet ___ in my pocket.","The vase ___ on the table.","LA and Miami ___ cities in the US."],ans:"LA and Miami ___ cities in the US.",full:"LA and Miami are cities in the US.",ko:"LA와 마이애미는 미국의 도시들이다.",h:["본책 UNIT 01의 be동사 현재형 표를 떠올려요.","각 문장의 주어를 찾아 한 개인지 여러 개인지 비교해요.","주어가 하나인 문장이 네 개예요. 다른 한 문장의 주어는 여러 개예요."],pen:"LA and Miami(둘) → are / 나머지는 하나 → is",tr:"① 이것은 너를 위한 선물 ___.<br>② 그 노래는 매우 인기 ___.<br>③ 내 지갑은 내 주머니 안에 ___.<br>④ 그 꽃병은 탁자 위에 ___.<br>⑤ LA와 마이애미는 미국의 도시들 ___.",ex:["wallet = 지갑","vase = 꽃병"]});
A("RT","RT",15,"c",{q:"다음 우리말을 영어로 바르게 옮긴 것은?<br>이 책들은 Jessy를 위한 선물들이니?",opts:["Is these books presents for Jessy?","Am these books presents for Jessy?","Are these books presents for Jessy?","Was these books presents for Jessy?","Were these books presents for Jessy?"],ans:"Are these books presents for Jessy?",full:"Are these books presents for Jessy?",ko:"이 책들은 Jessy를 위한 선물들이니?",h:["본책 UNIT 02의 be동사 의문문(be동사 + 주어) 부분을 떠올려요.","주어 these books는 여러 권이고, 우리말에 과거를 나타내는 말이 없어요.","여러 개와 짝이 되는 현재형 be동사가 맨 앞에 온 문장을 골라요."],pen:"these books(여러 권) + 현재 → Are",tr:"① 이 책들은 제시를 위한 선물들이니?<br>② 이 책들은 제시를 위한 선물들이니?<br>③ 이 책들은 제시를 위한 선물들이니?<br>④ 이 책들은 제시를 위한 선물들이니?<br>⑤ 이 책들은 제시를 위한 선물들이니?",ex:["present = 선물"]});
A("RT","RT",16,"w",{q:"John was a shy student. (부정문으로)<br>→ ___.",ans:"John wasn’t a shy student / John was not a shy student",full:"John wasn’t a shy student.",ko:"존은 수줍음이 많은 학생이 아니었다.",h:["본책 UNIT 02의 be동사 부정문(be동사 + not) 부분을 떠올려요.","과거형 was는 그대로 두고 부정을 만들어요.","was 바로 뒤에 not을 붙이면 돼요. 줄임말로 써도 돼요."],pen:"was + not → wasn’t",tr:"존은 수줍음이 많은 학생 ___.",ex:["shy = 수줍음이 많은"]});
A("RT","RT",17,"w",{q:"The kids are at school. (부정문으로)<br>→ ___.",ans:"The kids aren’t at school / The kids are not at school",full:"The kids aren’t at school.",ko:"아이들은 학교에 있지 않다.",h:["본책 UNIT 02의 be동사 부정문(be동사 + not) 부분을 떠올려요.","현재형 are는 그대로 두고 부정을 만들어요.","are 바로 뒤에 not을 붙여요. 줄임말로 써도 돼요."],pen:"are + not → aren’t",tr:"아이들은 학교에 ___.",ex:["kid = 아이"]});
A("RT","RT",18,"w",{q:"Julia was with her family. (의문문으로)<br>→ ___?",ans:"Was Julia with her family",full:"Was Julia with her family?",ko:"줄리아는 가족과 함께 있었니?",h:["본책 UNIT 02의 be동사 의문문(be동사를 맨 앞으로) 부분을 떠올려요.","be동사 was를 문장 맨 앞으로 보내요.","be동사 다음에 주어, 그 뒤에 나머지를 그대로 이어요. 끝에는 물음표를 써요."],pen:"be동사를 맨 앞으로 → Was Julia …?",tr:"줄리아는 가족과 함께 ___?",ex:[]});
A("RT","RT",19,"w",{q:"Karen and Mark were doctors. (의문문으로)<br>→ ___?",ans:"Were Karen and Mark doctors",full:"Were Karen and Mark doctors?",ko:"카렌과 마크는 의사였니?",h:["본책 UNIT 02의 be동사 의문문(be동사를 맨 앞으로) 부분을 떠올려요.","be동사 were를 문장 맨 앞으로 보내요.","be동사 다음에 주어, 그 뒤에 나머지를 그대로 이어요. 끝에는 물음표를 써요."],pen:"be동사를 맨 앞으로 → Were Karen and Mark …?",tr:"카렌과 마크는 의사 ___?",ex:[]});
A("RT","RT",20,"w",{q:"___ on the desk.",ans:"There were some photos",full:"There were some photos on the desk.",ko:"책상 위에 사진이 몇 장 있었다.",words:"there, some photos",h:["본책 UNIT 01의 There is/are와 과거형 표를 함께 떠올려요.","우리말이 ‘있었다’라서 과거이고, 있었던 것은 some photos(여러 장)예요.","There 뒤에 여러 개와 짝이 되는 과거형을 쓰고 주어진 말을 이어요."],pen:"some photos(여러 장) + 과거 → There were",tr:"___ 책상 위에.",ex:["photo = 사진"]});
A("RT","RT",21,"w",{q:"___ yours?",ans:"Are those pens",full:"Are those pens yours?",ko:"저 펜들은 네 것이니?",words:"those pens",h:["본책 UNIT 02의 be동사 의문문(be동사 + 주어) 부분을 떠올려요.","those pens는 여러 개이고 우리말에 과거 표현이 없어서 현재예요.","여러 개와 짝이 되는 현재형 be동사를 맨 앞에 쓰고 주어진 말을 이어요."],pen:"those pens(여러 개) + 현재 → Are",tr:"___ 네 것?",ex:["yours = 네 것"]});
A("RT","RT",22,"w",{q:"오늘은 월요일이다. 어제는 일요일이었다. (Monday, Sunday)<br>→ It ___ today. It ___ yesterday.",ans:"is Monday, was Sunday",full:"It is Monday today. It was Sunday yesterday.",ko:"오늘은 월요일이다. 어제는 일요일이었다.",h:["본책 UNIT 01의 be동사 현재형·과거형 표를 떠올려요.","첫 문장은 today(오늘)라서 현재, 둘째 문장은 yesterday(어제)라서 과거예요.","각 칸에 ‘be동사 + 요일’을 써요. 앞 칸은 현재형, 뒤 칸은 과거형이에요."],pen:"today → is Monday / yesterday → was Sunday",tr:"오늘은 ___. 어제는 ___.",ex:[]});
A("RT","RT",23,"w",{q:"이 도넛은 건강에 좋진 않지만 맛있다. (healthy, tasty)<br>→ This donut ___, but it ___.",ans:"isn’t healthy, is tasty",full:"This donut isn’t healthy, but it is tasty.",ko:"이 도넛은 건강에 좋진 않지만 맛있다.",h:["본책 UNIT 02의 be동사 부정문과 UNIT 01의 현재형 표를 떠올려요.","앞 칸은 ‘건강에 좋지 않다(부정)’, 뒤 칸은 ‘맛있다(긍정)’예요.","앞 칸은 be동사 부정 + healthy, 뒤 칸은 be동사 + tasty를 써요."],pen:"앞 칸 부정 + healthy / 뒤 칸 긍정 + tasty",tr:"이 도넛은 ___, 하지만 그것은 ___.",ex:["healthy = 건강에 좋은","tasty = 맛있는"]});
A("RT","RT",24,"w",{q:"A: Are Mr. Bonds American?<br>B: No, he aren’t. He’s British. (2개)",ans:"Are Mr. Bonds → Is Mr. Bonds, he aren’t → he isn’t",full:"A: Is Mr. Bonds American?<br>B: No, he isn’t. He’s British.",ko:"A: 본즈 씨는 미국인이니?<br>B: 아니, 아니야. 그는 영국인이야.",h:["본책 UNIT 02의 be동사 의문문·부정문과 주어에 맞는 be동사를 떠올려요.","Mr. Bonds와 he는 한 명이에요. 한 명인데 복수용 be동사가 쓰인 곳을 찾아요.","질문의 be동사와 대답의 be동사, 두 곳을 모두 한 명용으로 고쳐요."],pen:"Mr. Bonds / he = 한 명 → 두 곳 모두 Is / isn’t 계열",tr:"A: 본즈 씨는 미국인이니?<br>B: 아니, 아니야. 그는 영국인이야.",ex:["British = 영국의, 영국인"]});
A("RT","RT",25,"w",{q:"It is my birthday yesterday. There was a party at my house. The party weren’t big, but it was very fun! (2개)",ans:"It is → It was, The party weren’t → The party wasn’t",full:"It was my birthday yesterday. There was a party at my house. The party wasn’t big, but it was very fun!",ko:"어제는 내 생일이었다. 우리 집에서 파티가 열렸다. 파티는 크지 않았지만 매우 재미있었다!",h:["본책 UNIT 01·02의 be동사 시제와 주어 짝을 떠올려요.","첫 문장은 yesterday(어제)가 있어요. 셋째 문장은 The party가 하나인데 쓰인 be동사를 확인해요.","하나는 때와 시제가 안 맞는 곳, 다른 하나는 주어와 be동사 짝이 안 맞는 곳이에요."],pen:"yesterday → 과거 / The party(하나) → 한 명용 과거형",tr:"어제는 내 생일이었다. 우리 집에서 파티가 열렸다. 파티는 크지 않았지만 매우 재미있었다!",ex:["birthday = 생일","party = 파티"]});

A("RT","RT",8,"w",{"q":"A: Does Diana have dogs?<br>B: No, ___. She has two cats.","ans":"she doesn’t","full":"No, she doesn’t. She has two cats.","ko":"아니, 안 키워. 그녀는 고양이 두 마리가 있어.","h":["본책 UNIT 04: Does로 물으면 does/doesn’t로 대답해요.","주어 Diana는 여자 한 명이에요. 대답에서는 대명사로 바꿔요.","No이니까 she 다음에 does의 부정 줄임말을 써요."],"pen":"Does Diana~? → No, she + doesn’t","tr":"A: 다이애나는 개를 키우니?<br>B: 아니, ___. 그녀는 고양이 두 마리가 있어.","ex":[]});
A("RT","RT",9,"w",{"q":"[9-10] 다음 밑줄 친 부분 ⓐ, ⓑ를 바르게 고치시오.<br>Jack is a chef. He ⓐ work in a restaurant. Every day, he ⓑ go to work by subway.<br>ⓐ ___ ⓑ ___","ans":"works, goes","full":"Jack is a chef. He works in a restaurant. Every day, he goes to work by subway.","ko":"잭은 요리사이다. 그는 식당에서 일한다. 매일 그는 지하철로 출근한다.","h":["본책 UNIT 01: 현재 이야기에서 주어가 He이면 동사에 -s/-es.","He는 한 명이고 Every day는 매일 하는 일이에요. 동사 두 개 모두 모양을 봐요.","ⓐ는 s만, ⓑ는 es를 붙여요(go는 o로 끝나요)."],"pen":"He + 현재 → work+s, go+es","tr":"잭은 요리사이다. 그는 식당에서 ___. 매일 그는 지하철로 출근___.","ex":["chef = 요리사","by subway = 지하철로"]});
A("RT","RT",10,"w",{"q":"[9-10] 다음 밑줄 친 부분 ⓐ, ⓑ를 바르게 고치시오.<br>Last week, I ⓐ watch a horror movie on TV. That night, I ⓑ have a scary dream.<br>ⓐ ___ ⓑ ___","ans":"watched, had","full":"Last week, I watched a horror movie on TV. That night, I had a scary dream.","ko":"지난주에 나는 TV로 공포 영화를 보았다. 그날 밤 나는 무서운 꿈을 꾸었다.","h":["본책 UNIT 02: 지난 일 이야기이면 동사도 과거형.","Last week와 That night는 모두 과거를 나타내요.","ⓐ는 -ed, ⓑ는 have의 불규칙 과거형(h로 시작하는 세 글자)을 써요."],"pen":"Last week → watch+ed, have → 불규칙 과거","tr":"지난주에 나는 TV로 공포 영화를 ___. 그날 밤 나는 무서운 꿈을 ___.","ex":["horror movie = 공포 영화","scary = 무서운"]});
A("RT","RT",11,"c",{"q":"Andrew always ___(A)___ his car on Sundays. After that, he ___(B)___ to the gym.","opts":["wash … go","wash … goes","washes … go","washes … goes","washed … goes"],"ans":"washes … goes","full":"Andrew always washes his car on Sundays. After that, he goes to the gym.","ko":"앤드루는 일요일마다 항상 자기 차를 닦는다. 그 후에 그는 체육관에 간다.","h":["본책 UNIT 01: 3인칭 단수 현재형은 -s/-es.","always, on Sundays는 반복되는 습관(현재)이고 주어 Andrew는 한 명이에요.","wash와 go가 어떤 글자로 끝나는지 보고 -s인지 -es인지 정해요."],"pen":"Andrew(한 명) + 현재 → wash+es, go+es","tr":"앤드루는 일요일마다 항상 자기 차를 (A). 그 후에 그는 체육관에 (B).","ex":["gym = 체육관"]});
A("RT","RT",12,"c",{"q":"Yesterday, my sister and I ___(A)___ a walk in the park. We ___(B)___ our dog with us.","opts":["take … don’t bring","take … doesn’t bring","takes … didn’t bring","took … doesn’t bring","took … didn’t bring"],"ans":"took … didn’t bring","full":"Yesterday, my sister and I took a walk in the park. We didn’t bring our dog with us.","ko":"어제 여동생과 나는 공원에서 산책을 했다. 우리는 개를 데려가지 않았다.","h":["본책 UNIT 02, 03: 과거 이야기에서는 과거형, 부정은 didn’t + 동사원형.","Yesterday가 단서예요. 같은 이야기 속 (A), (B) 모두 과거예요.","(A)는 take의 불규칙 과거형, (B)는 did의 부정 줄임말 + 원래 모양이에요."],"pen":"Yesterday → take의 과거, didn’t + bring","tr":"어제 여동생과 나는 공원에서 산책을 (A). 우리는 우리 개를 함께 (B).","ex":["take a walk = 산책하다"]});
A("RT","RT",13,"c",{"q":"다음 중 대화가 자연스럽지 않은 것은?","opts":["A: Do you miss Robert?<br>B: Yes, I do.","A: Does your father cook?<br>B: Yes, he does.","A: Did you clean your room?<br>B: No, you didn’t.","A: Does Charlie study in Paris?<br>B: No, he doesn’t.","A: Did Eric and Andy practice the guitar last night?<br>B: Yes, they did."],"ans":"A: Did you clean your room?<br>B: No, you didn’t.","full":"A: Did you clean your room?<br>B: No, I didn’t.","ko":"A: 너는 네 방을 청소했니?<br>B: 아니, 안 했어.","h":["본책 UNIT 04: 대답은 같은 조동사(Do/Does/Did)를 쓰고 주어는 질문과 맞게 바꿔요.","각 대화의 질문 조동사와 대답 조동사가 같은지, 주어가 맞는지 하나씩 봐요.","you로 물으면 대답하는 사람은 자기 자신을 가리켜요. 대답 주어를 확인해요."],"pen":"Did you~? → No, I didn’t (you 아님)","tr":"① A: 너는 로버트가 그립니? B: 응, 그래.<br>② A: 네 아버지는 요리하시니? B: 응, 하셔.<br>③ A: 너는 네 방을 청소했니? B: 아니, 안 했어.<br>④ A: 찰리는 파리에서 공부하니? B: 아니, 안 해.<br>⑤ A: 에릭과 앤디는 어젯밤에 기타를 연습했니? B: 응, 했어.","ex":[]});
A("RT","RT",14,"c",{"q":"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.","opts":["I always go to bed before 10:00 p.m.","Kate stays at my house yesterday.","Minsu drinks a lot of milk every day.","Mom baked some cookies yesterday.","He sends me a birthday card every year."],"ans":"Kate stays at my house yesterday.","full":"Kate stayed at my house yesterday.","ko":"케이트는 어제 우리 집에서 머물렀다.","h":["본책 UNIT 01, 02: 지난 때는 과거형, 매일·매년 같은 습관은 현재형.","yesterday, every day, every year 같은 때 표현과 동사 시제가 맞는지 봐요.","yesterday가 있는 문장 중 동사가 현재형인 것을 찾아요."],"pen":"yesterday + stays(현재) → 과거형으로","tr":"① 나는 항상 밤 10시 전에 잔다.<br>② 케이트는 어제 우리 집에서 머물렀다.<br>③ 민수는 매일 우유를 많이 마신다.<br>④ 엄마는 어제 쿠키를 구우셨다.<br>⑤ 그는 해마다 내게 생일 카드를 보낸다.","ex":[]});
A("RT","RT",15,"c",{"q":"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.","opts":["Mike don’t like steak.","Mr. Kim doesn’t teach history.","I didn’t pass the final exam last week.","We didn’t enjoy the festival yesterday.","Susan doesn’t talk much about her boyfriend."],"ans":"Mike don’t like steak.","full":"Mike doesn’t like steak.","ko":"마이크는 스테이크를 좋아하지 않는다.","h":["본책 UNIT 03: 부정문은 주어와 시제에 맞는 don’t / doesn’t / didn’t + 동사원형.","각 문장의 주어가 한 명인지 여러 명인지, 현재인지 과거인지 확인해요.","주어가 한 사람인 현재 문장인데 don’t를 쓴 것을 찾아요."],"pen":"Mike(한 명) + 현재 부정 → doesn’t","tr":"① 마이크는 스테이크를 좋아하지 않는다.<br>② 김 선생님은 역사를 가르치지 않는다.<br>③ 나는 지난주에 기말고사에 통과하지 못했다.<br>④ 우리는 어제 축제를 즐기지 않았다.<br>⑤ 수잔은 남자 친구에 대해 많이 말하지 않는다.","ex":["final exam = 기말고사"]});
A("RT","RT",16,"w",{"q":"I ___ taekwondo two years ago. It was very exciting. (learn)","ans":"learned","full":"I learned taekwondo two years ago. It was very exciting.","ko":"나는 2년 전에 태권도를 배웠다. 그것은 매우 신났다.","h":["본책 UNIT 02: 과거를 나타내는 말(ago)이 있으면 동사를 과거형으로.","two years ago(2년 전)가 단서예요. learn은 규칙 동사예요.","learn 끝에 ed를 붙여요."],"pen":"two years ago → learn+ed","tr":"나는 2년 전에 태권도를 ___. 그것은 매우 신났다.","ex":["exciting = 신나는"]});
A("RT","RT",17,"w",{"q":"My sister ___ clothes. She always wears mine! (not/buy)","ans":"doesn’t buy / does not buy","full":"My sister doesn’t buy clothes. She always wears mine!","ko":"내 여동생은 옷을 사지 않는다. 그녀는 항상 내 옷을 입는다!","h":["본책 UNIT 03: 부정문은 주어와 시제에 맞는 조동사 부정 + 동사원형.","always wears(현재)이고 주어 My sister는 한 명이에요.","한 명 주어의 현재 부정 말 뒤에 괄호 동사를 s 없이 써요."],"pen":"My sister(한 명) + 현재 부정 → does not + 동사원형","tr":"내 여동생은 옷을 ___. 그녀는 항상 내 옷을 입는다!","ex":[]});
A("RT","RT",18,"c",{"q":"다음 우리말을 영어로 바르게 옮긴 것은?<br>그들은 내게 새로운 노래를 가르쳐 주지 않았다.","opts":["They don’t teach me a new song.","They don’t taught me a new song.","They doesn’t teach me a new song.","They didn’t teach me a new song.","They didn’t taught me a new song."],"ans":"They didn’t teach me a new song.","full":"They didn’t teach me a new song.","ko":"그들은 내게 새로운 노래를 가르쳐 주지 않았다.","h":["본책 UNIT 03: 과거 부정문은 주어에 관계없이 didn’t + 동사원형.","우리말 ‘주지 않았다’는 과거 부정이에요.","didn’t 뒤에는 동사 원래 모양이어야 해요. 그 두 가지를 모두 만족하는 보기를 골라요."],"pen":"과거 부정 → didn’t + teach(원래 모양)","tr":"① 그들은 내게 새로운 노래를 가르쳐 주지 않는다.<br>② 그들은 내게 새로운 노래를 가르쳐 주지 않는다.<br>③ 그들은 내게 새로운 노래를 가르쳐 주지 않는다.<br>④ 그들은 내게 새로운 노래를 가르쳐 주지 않았다.<br>⑤ 그들은 내게 새로운 노래를 가르쳐 주지 않았다.","ex":[]});
A("RT","RT",19,"w",{"q":"어젯밤에 비가 왔니? (it, rain)<br>___ last night?","ans":"Did it rain","full":"Did it rain last night?","ko":"어젯밤에 비가 왔니?","h":["본책 UNIT 04: 과거 의문문은 Did + 주어 + 동사원형.","last night(어젯밤)이 단서이고 주어는 it이에요.","과거 조동사를 맨 앞에 쓰고, 주어와 동사(원래 모양)를 이어요."],"pen":"last night → Did + it + rain","tr":"___ 어젯밤에?","ex":[]});
A("RT","RT",20,"w",{"q":"나는 어제 자전거를 탔다. (ride a bike)<br>I ___ yesterday.","ans":"rode a bike","full":"I rode a bike yesterday.","ko":"나는 어제 자전거를 탔다.","h":["본책 UNIT 02: 지난 일은 과거형. ride는 불규칙 동사예요.","yesterday(어제)가 단서예요.","ride는 불규칙 동사예요. i가 o로 바뀐 과거형 뒤에 a bike를 이어요."],"pen":"yesterday → ride의 불규칙 과거 + a bike","tr":"나는 어제 ___.","ex":[]});
A("RT","RT",21,"w",{"q":"도서관은 일요일에 열지 않는다. (open)<br>The library ___ on Sundays.","ans":"doesn’t open / does not open","full":"The library doesn’t open on Sundays.","ko":"도서관은 일요일에 열지 않는다.","h":["본책 UNIT 03: 3인칭 단수 현재 부정문은 doesn’t(does not) + 동사원형.","The library는 한 곳이고 ‘일요일에’는 늘 그렇다는 현재 습관이에요.","한 곳 주어의 현재 부정 말 뒤에 괄호 동사를 s 없이 써요."],"pen":"The library(한 곳) + 현재 부정 → doesn’t + open","tr":"도서관은 일요일에 ___.","ex":[]});
A("RT","RT",22,"w",{"q":"Billy는 체육관에서 운동하니? (Billy, at the gym, exercise, does)<br>___?","ans":"Does Billy exercise at the gym","full":"Does Billy exercise at the gym?","ko":"Billy는 체육관에서 운동하니?","h":["본책 UNIT 04: 3인칭 단수 현재 의문문은 Does + 주어 + 동사원형.","Does를 문장 맨 앞에 두고, 장소(at the gym)는 맨 뒤에 둬요.","조동사, 주어, 동사, 장소 순서예요. 끝에 물음표를 써요."],"pen":"Does + Billy + exercise + 장소","tr":"빌리는 체육관에서 ___?","ex":["exercise = 운동하다"]});
A("RT","RT",23,"w",{"q":"네가 어젯밤 내게 전화했니? (you, me, call, did)<br>___ last night?","ans":"Did you call me","full":"Did you call me last night?","ko":"네가 어젯밤 내게 전화했니?","h":["본책 UNIT 04: 과거 의문문은 Did + 주어 + 동사원형.","Did가 문장 맨 앞에 오고, 뒤에 last night이 이미 있어요.","조동사, 주어, 동사, ‘누구에게’ 순서예요."],"pen":"Did + you + call + me","tr":"___ 어젯밤에?","ex":[]});
A("RT","RT",24,"w",{"q":"[24-25] 밑줄 친 부분이 어법상 옳은지 판단하고, 틀리면 바르게 고치시오.<br>I didn’t gave you that chocolate. (O / X)","ans":"X, give","full":"I didn’t give you that chocolate.","ko":"나는 네게 그 초콜릿을 주지 않았다.","h":["본책 UNIT 03: didn’t 뒤에는 동사원형이 와요.","didn’t에 이미 과거의 뜻이 있어요. 뒤 동사를 봐요.","gave를 원래 모양으로 고쳐서 X 뒤에 써요."],"pen":"didn’t + 동사원형 → gave를 give로","tr":"나는 네게 그 초콜릿을 주지 않았다.","ex":[]});
A("RT","RT",25,"w",{"q":"[24-25] 밑줄 친 부분이 어법상 옳은지 판단하고, 틀리면 바르게 고치시오.<br>William and his brother walk home from school every day. (O / X)","ans":"◯","full":"William and his brother walk home from school every day.","ko":"윌리엄과 그의 형(동생)은 매일 걸어서 학교에서 집으로 간다.","h":["본책 UNIT 01: 복수 주어의 현재형은 -s를 붙이지 않아요.","주어 William and his brother는 두 사람이고 every day는 현재 습관이에요.","walk에 s가 없는 것이 맞는지 생각해요."],"pen":"William and his brother(복수) + 현재 → walk","tr":"윌리엄과 그의 형(동생)은 매일 걸어서 학교에서 집으로 간다.","ex":[]});

}

BEGIN(3,"조동사",{1:{n:"UNIT 01",t:"can, may",pp:"p.28-30"},2:{n:"UNIT 02",t:"must, have to, should",pp:"p.31-33"},RT:{n:"REVIEW TEST",t:"챕터 마무리 테스트",pp:"p.34-36"}});
A(1,"A",1,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"He can (sleep, sleeps) late on weekends.",ko:"",words:"",ans:"sleep",full:"He can sleep late on weekends.",tr:"그는 주말에 늦게까지 잘 수 있다.",ex:[],h:["본책 UNIT 01 규칙을 떠올려요 — can 같은 조동사 뒤에는 동사의 어떤 모습이 올까요?","주어가 He(그, 한 명)이라서 동사에 -s를 붙이고 싶어지지만, 조동사가 있으면 어떨까요?","조동사 뒤에서는 주어가 누구든 동사가 변하지 않아요. -s가 없는 쪽을 고르세요."]});
A(1,"A",2,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"Your key may (be, is) on the table.",ko:"",words:"",ans:"be",full:"Your key may be on the table.",tr:"네 열쇠는 탁자 위에 있을지도 모른다.",ex:[],h:["본책 UNIT 01의 may 규칙을 떠올려요 — may도 can처럼 조동사예요.","may 바로 뒤에 어떤 모양의 동사가 오는지 보기를 살펴보세요.","조동사 뒤에는 동사원형(원래 모습)만 와요. am, are, is의 원래 모습인 두 글자 단어를 고르세요."]});
A(1,"A",3,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"(May, Can) you understand Spanish?",ko:"",words:"",ans:"Can",full:"Can you understand Spanish?",tr:"너는 스페인어를 ___?",ex:[],h:["본책 UNIT 01에서 can과 may의 뜻 차이를 비교해 보세요.","may는 ‘~해도 된다(허락)’나 ‘~일지도 모른다(추측)’, 다른 하나는 ‘~할 수 있다(능력)’예요.","스페인어를 이해하는 것은 허락일까요, 능력일까요? 능력을 나타내는 말은 c로 시작해요."]});
A(1,"A",4,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"Jeff could (answer, answered) the question.",ko:"",words:"",ans:"answer",full:"Jeff could answer the question.",tr:"제프는 그 질문에 답할 수 있었다.",ex:[],h:["본책 UNIT 01에서 could는 can의 과거형이라고 배웠어요.","could도 조동사예요. 뒤에 오는 동사가 어떤 모양이어야 하는지 생각해 보세요.","과거형이어도 동사에 -ed를 또 붙이지 않아요. 조동사 뒤에는 동사원형이 와요."]});
A(1,"A",5,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"Penguins are birds, but they (can’t, may not) fly.",ko:"",words:"",ans:"can’t",full:"Penguins are birds, but they can’t fly.",tr:"펭귄은 새이지만, 날 수 ___.",ex:["penguin = 펭귄"],h:["본책 UNIT 01에서 can’t(~할 수 없다)와 may not(~하지 않을지도 모른다)을 구분해요.","펭귄이 나는 것은 ‘불가능한 사실’인지 ‘그럴지도 모르는 추측’인지 생각해 보세요.","펭귄은 날지 못해요. 능력이 없다는 뜻이니 ‘can + not’ 줄임말을 고르세요."]});
A(1,"A",6,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"Take your coat. It (may, may not) be cold at night.",ko:"",words:"",ans:"may",full:"Take your coat. It may be cold at night.",tr:"코트를 가져가라. 밤에는 추울지도 ___.",ex:[],h:["본책 UNIT 01의 may 추측 용법을 떠올려요 — ‘~일지도 모른다’.","앞 문장 ‘코트를 가져가라’와 이어지는 이유가 되어야 해요.","코트가 필요한 이유는 밤에 추울 수도 있기 때문이에요. not이 없는 쪽을 고르세요."]});
A(1,"A",7,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"We (able to, are able to) help you, so don’t worry.",ko:"",words:"",ans:"are able to",full:"We are able to help you, so don’t worry.",tr:"우리는 너를 도울 수 있다, 그러니 걱정하지 마.",ex:["worry = 걱정하다"],h:["본책 UNIT 01의 be able to(~할 수 있다) 형태를 떠올려요.","be able to는 can과 같은 뜻인데, 앞에 be동사가 꼭 필요해요.","주어가 We이니 be동사는 어떤 모양일까요? 보기 중 be동사가 들어 있는 쪽이 정답이에요."]});
A(1,"A",8,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"She (not may, may not) go on the picnic today. She looks tired.",ko:"",words:"",ans:"may not",full:"She may not go on the picnic today. She looks tired.",tr:"그녀는 오늘 소풍에 가지 않을지도 모른다. 그녀는 피곤해 보인다.",ex:["picnic = 소풍"],h:["본책 UNIT 01의 부정문 규칙을 떠올려요 — 조동사의 부정은 어디에 not을 둘까요?","not이 조동사 앞에 오는지 뒤에 오는지 두 보기를 비교해 보세요.","부정문은 ‘조동사 + not + 동사원형’ 순서예요. 조동사가 먼저 나오는 쪽을 고르세요."]});
A(1,"A",9,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"Maria (can’t, couldn’t) come home early. She was too busy.",ko:"",words:"",ans:"couldn’t",full:"Maria couldn’t come home early. She was too busy.",tr:"마리아는 일찍 집에 ___. 그녀는 너무 바빴다.",ex:[],h:["본책 UNIT 01에서 can’t는 현재, couldn’t는 과거라고 배웠어요.","둘째 문장 She was too busy의 동사가 과거인지 현재인지 살펴보세요.","was(과거)가 쓰였으니 첫 문장도 과거예요. 과거형 부정을 고르세요."]});
A(1,"A",10,"s",{ins:"( ) 안에서 알맞은 말을 고르시오.",q:"It is very cloudy. It (may, may not) rain in the afternoon.",ko:"",words:"",ans:"may",full:"It is very cloudy. It may rain in the afternoon.",tr:"매우 흐리다. 오후에 비가 올지도 ___.",ex:["cloudy = 흐린"],h:["본책 UNIT 01의 may 추측 용법을 떠올려요.","첫 문장 ‘매우 흐리다’를 보면 비가 올 가능성이 어떨지 생각해 보세요.","구름이 많으면 비가 올 수도 있어요. not이 없는 쪽을 고르세요."]});
A(1,"B",1,"s",{ins:"알맞은 조동사와 ( ) 안의 말을 이용하여 문장을 완성하시오.",q:"Larry’s father is a chef. He ___ very well.<br>(can 또는 can’t를 쓸 것)",ko:"",words:"cook",ans:"can cook",full:"Larry’s father is a chef. He can cook very well.",tr:"래리의 아버지는 요리사이다. 그는 아주 잘 ___.",ex:["chef = 요리사"],h:["본책 UNIT 01의 can 규칙을 떠올려요 — ‘조동사 + 동사원형’ 순서예요.","아버지의 직업이 요리사예요. 요리를 잘할까요, 못할까요? can과 can’t 중 고르세요.","요리사니까 요리를 잘해요. not이 없는 조동사 + 괄호 안 동사 그대로 쓰세요."]});

A(1,"B",3,"s",{ins:"알맞은 조동사와 ( ) 안의 말을 이용하여 문장을 완성하시오.",q:"I’m strong. I ___ 30 kg.<br>(can 또는 can’t를 쓸 것)",ko:"",words:"lift",ans:"can lift",full:"I’m strong. I can lift 30 kg.",tr:"나는 힘이 세다. 나는 30킬로그램을 ___.",ex:["lift = 들어 올리다"],h:["본책 UNIT 01의 can(능력) 쓰임을 떠올려요.","첫 문장 ‘나는 힘이 세다’가 단서예요.","힘이 세니 들 수 있어요. not이 없는 조동사 뒤에 동사원형을 쓰세요."]});
A(1,"B",4,"s",{ins:"알맞은 조동사와 ( ) 안의 말을 이용하여 문장을 완성하시오.",q:"My sister broke her arm. She ___ it.<br>(can 또는 can’t를 쓸 것)",ko:"",words:"use",ans:"can’t use",full:"My sister broke her arm. She can’t use it.",tr:"내 여동생은 팔이 부러졌다. 그녀는 그것을 ___.",ex:["break = 부러뜨리다, 깨다"],h:["본책 UNIT 01의 can’t 쓰임을 떠올려요.","첫 문장에서 팔이 부러졌어요. 그 팔을 쓸 수 있을지 생각해 보세요.","쓰지 못하는 상황이에요. 줄임말로 쓰고 뒤에 동사원형을 이으세요."]});
A(1,"B",5,"s",{ins:"알맞은 조동사와 ( ) 안의 말을 이용하여 문장을 완성하시오.",q:"Mika studies art. She ___ pictures very well.<br>(can 또는 can’t를 쓸 것)",ko:"",words:"draw",ans:"can draw",full:"Mika studies art. She can draw pictures very well.",tr:"미카는 미술을 공부한다. 그녀는 그림을 아주 잘 ___.",ex:["art = 미술"],h:["본책 UNIT 01의 can(능력) 쓰임을 떠올려요.","미술을 공부하는 사람이 그림을 ‘아주 잘’ 그릴 수 있는지 생각해 보세요.","잘 그린다는 뜻이니 not이 없어요. 조동사 + 동사원형 순서로 쓰세요."]});

A(1,"B",7,"s",{ins:"알맞은 조동사와 ( ) 안의 말을 이용하여 문장을 완성하시오.",q:"Jimmy is busy. He ___ us for lunch today.<br>(may 또는 may not을 쓸 것)",ko:"",words:"join",ans:"may not join",full:"Jimmy is busy. He may not join us for lunch today.",tr:"지미는 바쁘다. 그는 오늘 점심에 우리와 함께 ___.",ex:["join = 함께하다, 합류하다"],h:["본책 UNIT 01의 may(추측)와 부정 may not을 떠올려요.","지미가 바쁘다는 것이 단서예요. 점심에 올 수 있을지 생각해 보세요.","바쁘니까 못 올지도 몰라요. ‘조동사 + not + 동사원형’ 순서로 쓰세요."]});

A(1,"B",9,"s",{ins:"알맞은 조동사와 ( ) 안의 말을 이용하여 문장을 완성하시오.",q:"The kids left some food. They ___ full.<br>(may 또는 may not을 쓸 것)",ko:"",words:"be",ans:"may be",full:"The kids left some food. They may be full.",tr:"아이들이 음식을 조금 남겼다. 그들은 배가 ___.",ex:["leave = 남기다","full = 배부른"],h:["본책 UNIT 01의 may(추측) ‘~일지도 모른다’를 떠올려요.","음식을 남겼다는 것이 단서예요. 배가 부른 것일까요, 아닐까요?","배가 불러서 남겼을지도 몰라요. not 없이 조동사 뒤에 be를 쓰세요."]});
A(1,"B",10,"s",{ins:"알맞은 조동사와 ( ) 안의 말을 이용하여 문장을 완성하시오.",q:"She doesn’t enjoy sweets. She ___ this chocolate.<br>(may 또는 may not을 쓸 것)",ko:"",words:"like",ans:"may not like",full:"She doesn’t enjoy sweets. She may not like this chocolate.",tr:"그녀는 단것을 즐기지 않는다. 그녀는 이 초콜릿을 ___.",ex:["sweets = 단것, 사탕류"],h:["본책 UNIT 01의 부정 추측 ‘~하지 않을지도 모른다’를 떠올려요.","첫 문장 ‘단것을 즐기지 않는다’가 단서예요.","단것을 싫어하니 초콜릿도 안 좋아할지도 몰라요. 조동사 + not + 동사원형으로 쓰세요."]});
A(1,"C",1,"s",{ins:"보기와 같이 be able to 또는 be not able to를 이용하여 문장을 바꿔 쓰시오. (보기: She can type English very fast. → She is able to type English very fast.)",q:"I can jump rope very well.<br>→ I ___ rope very well.",ko:"",words:"",ans:"am able to jump",full:"I am able to jump rope very well.",tr:"나는 줄넘기를 아주 잘 할 수 있다.",ex:[],h:["본책 UNIT 01의 can = be able to 바꿔 쓰기를 떠올려요.","be able to는 be동사가 필요해요. 주어 I에 맞는 be동사는 무엇일까요?","‘be동사(주어 I용) + able to + 동사원형’ 순서예요. 동사원형은 원래 문장에서 가져오세요."]});
A(1,"C",2,"s",{ins:"보기와 같이 be able to 또는 be not able to를 이용하여 문장을 바꿔 쓰시오. (보기: She can type English very fast. → She is able to type English very fast.)",q:"We can’t finish the project by tomorrow.<br>→ We ___ the project by tomorrow.",ko:"",words:"",ans:"aren’t able to finish / are not able to finish",full:"We aren’t able to finish the project by tomorrow.",tr:"우리는 내일까지 그 프로젝트를 끝낼 수 없다.",ex:["project = 과제, 프로젝트"],h:["본책 UNIT 01의 can’t = be not able to 바꿔 쓰기를 떠올려요.","원래 문장이 can’t(부정)이니 바꾼 문장도 부정이어야 해요.","주어 We용 be동사 뒤에 not을 붙이고(줄임말도 가능) able to + 동사원형을 이으세요."]});
A(1,"C",3,"s",{ins:"보기와 같이 be able to 또는 be not able to를 이용하여 문장을 바꿔 쓰시오. (보기: She can type English very fast. → She is able to type English very fast.)",q:"Tim and Amy cannot play the piano.<br>→ Tim and Amy ___ the piano.",ko:"",words:"",ans:"aren’t able to play / are not able to play",full:"Tim and Amy aren’t able to play the piano.",tr:"팀과 에이미는 피아노를 칠 수 없다.",ex:[],h:["본책 UNIT 01의 cannot = be not able to를 떠올려요.","원래 문장이 cannot(부정)이에요. 주어 Tim and Amy는 두 사람이에요.","두 사람(복수)용 be동사 + not + able to + 동사원형 순서로 쓰세요."]});
A(1,"C",4,"s",{ins:"보기와 같이 be able to 또는 be not able to를 이용하여 문장을 바꿔 쓰시오. (보기: She can type English very fast. → She is able to type English very fast.)",q:"He can get tickets for the baseball game.<br>→ He ___ tickets for the baseball game.",ko:"",words:"",ans:"is able to get",full:"He is able to get tickets for the baseball game.",tr:"그는 야구 경기 표를 구할 수 있다.",ex:["get = 구하다, 얻다"],h:["본책 UNIT 01의 can = be able to 바꿔 쓰기를 떠올려요.","원래 문장은 부정이 아니에요. 주어 He(한 명)에 맞는 be동사를 찾으세요.","‘be동사(He용) + able to + 동사원형’ 순서로 쓰세요."]});
A(1,"C",5,"s",{ins:"보기와 같이 be able to 또는 be not able to를 이용하여 문장을 바꿔 쓰시오. (보기: She can type English very fast. → She is able to type English very fast.)",q:"You passed the driving test. You can drive now.<br>→ You passed the driving test. You ___ now.",ko:"",words:"",ans:"are able to drive",full:"You passed the driving test. You are able to drive now.",tr:"너는 운전 시험에 합격했다. 너는 이제 운전할 수 있다.",ex:["pass = 합격하다","driving test = 운전 시험"],h:["본책 UNIT 01의 can = be able to 바꿔 쓰기를 떠올려요.","주어가 You예요. You와 함께 쓰는 be동사는 정해져 있어요.","‘be동사(You용) + able to + 동사원형’ 순서로 쓰세요. 부정이 아니에요."]});
A(1,"C",6,"s",{ins:"보기와 같이 be able to 또는 be not able to를 이용하여 문장을 바꿔 쓰시오. (보기: She can type English very fast. → She is able to type English very fast.)",q:"She can’t arrive on time. She took the wrong bus.<br>→ She ___ on time. She took the wrong bus.",ko:"",words:"",ans:"isn’t able to arrive / is not able to arrive",full:"She isn’t able to arrive on time. She took the wrong bus.",tr:"그녀는 제시간에 도착할 수 없다. 그녀는 잘못된 버스를 탔다.",ex:["on time = 제시간에","wrong = 잘못된"],h:["본책 UNIT 01의 can’t = be not able to를 떠올려요.","원래 문장이 can’t(부정)예요. 주어 She(한 명)에 맞는 be동사를 쓰세요.","be동사 뒤에 not을 붙이고(줄임말 가능) able to + 동사원형을 이으세요."]});

A(2,"WB",6,"s",{ins:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.",q:"___ this company?",ko:"당신은 이 회사에서 일할 예정인가요?",words:"you, going to, work for, are",ans:"Are you going to work for",full:"Are you going to work for this company?",tr:"___ 이 회사에서 ___?",ex:["work for = ~에서 일하다", "company = 회사"],h:["본책 UNIT 02: be going to + 동사원형. 부정은 be동사 뒤에 not, 의문은 be동사를 앞으로.", "의문문이라 be동사가 맨 앞이고 그다음 주어예요.", "순서: be동사 → 주어 → going to → 동사."],eo:"~인가요 / 당신은 / 일할 예정인 / 이 회사에서"});
A("RT","RT",1,"c",{q:"다음 중 동사의 v-ing형이 잘못 연결된 것을 고르시오.",opts:["eat – eating", "stop – stoping", "bake – baking", "bring – bringing", "leave – leaving"],ans:"stop – stoping",full:"stop – stopping",ko:"멈추다 – 멈추고 있는",h:["본책 UNIT 01: v-ing 만드는 규칙 — 그냥 ing / e로 끝나면 e 빼고 ing / 짧은 모음+자음이면 자음 한 번 더 / ie는 y로.", "다섯 개를 하나씩 규칙에 대어 보세요. bake, leave는 e로 끝나요.", "‘짧은 모음 + 자음 하나’로 끝나는 동사는 어떻게 해야 할까요?"],pen:"stop(짧은 모음+자음) → 자음을 한 번 더 → stopping",tr:"① eat = 먹다 – 먹고 있는<br>② stop = 멈추다 – 멈추고 있는<br>③ bake = 굽다 – 굽고 있는<br>④ bring = 가져오다 – 가져오고 있는<br>⑤ leave = 떠나다 – 떠나고 있는",ex:[]});
A("RT","RT",2,"c",{q:"다음 중 동사의 v-ing형이 잘못 연결된 것을 고르시오.",opts:["fly – flying", "die – dying", "lose – loseing", "watch – watching", "shop – shopping"],ans:"lose – loseing",full:"lose – losing",ko:"잃다 – 잃고 있는",h:["본책 UNIT 01: v-ing 만드는 규칙 — 그냥 ing / e로 끝나면 e 빼고 ing / 짧은 모음+자음이면 자음 한 번 더 / ie는 y로.", "각 동사 끝 글자를 보세요. -e, -ie, -y, 짧은 모음+자음으로 나눠요.", "e로 끝나는 동사는 e를 어떻게 하나요?"],pen:"lose는 e로 끝나요 → e를 빼고 ing → losing",tr:"① fly = 날다 – 날고 있는<br>② die = 죽다 – 죽어 가는<br>③ lose = 잃다 – 잃고 있는<br>④ watch = 보다 – 보고 있는<br>⑤ shop = 쇼핑하다 – 쇼핑하고 있는",ex:[]});
A("RT","RT",3,"c",{q:"We ___ spend our vacation in Italy.",opts:["are going", "going to", "be going to", "is going to", "are going to"],ans:"are going to",full:"We are going to spend our vacation in Italy.",ko:"우리는 이탈리아에서 방학을 보낼 것이다.",h:["본책 UNIT 02: 미래를 말하는 be going to는 be동사 + going to + 동사원형이에요.", "주어가 We(여럿)이고 뒤에 spend(원형)가 있어요. to가 포함돼야 해요.", "be동사가 빠지거나, 단수 be동사(is)인 보기는 지워요. 남는 것은?"],pen:"We(여럿) → are + going to + spend",tr:"우리는 이탈리아에서 방학을 ___.",ex:["vacation = 방학, 휴가"]});
A("RT","RT",4,"c",{q:"Oscar has a map. He ___ get lost.",opts:["isn’t", "is going to", "are going to", "will", "won’t"],ans:"won’t",full:"Oscar has a map. He won’t get lost.",ko:"오스카는 지도를 가지고 있다. 그는 길을 잃지 않을 것이다.",h:["본책 UNIT 02: will/won’t 뒤에는 동사원형이 와요. be going to는 be동사 + going to예요.", "get이 원형이니 빈칸 뒤에 바로 원형이 올 수 있는 말이어야 해요. 지도가 있으니 길을 잃을까요?", "원형 앞에 올 수 있고 부정의 뜻인 줄임말을 골라요."],pen:"지도가 있다 → 길을 잃지 않을 것 → won’t get lost",tr:"오스카는 지도를 가지고 있다. 그는 길을 ___.",ex:["get lost = 길을 잃다"]});
A("RT","RT",5,"c",{q:"A: Were you reading a book?<br>B: No. I ___ my homework.",opts:["do", "am doing", "was doing", "will do", "am going to do"],ans:"was doing",full:"A: Were you reading a book?<br>B: No. I was doing my homework.",ko:"A: 너는 책을 읽고 있었니?<br>B: 아니. 나는 숙제를 하고 있었어.",h:["본책 UNIT 01: 질문이 과거진행형(Were you reading)이면 대답도 같은 때로 해요.", "A가 ‘읽고 있었니?’라고 과거에 하던 일을 물었어요. B도 그때 하던 일을 말해요.", "I와 짝인 과거 be동사 + v-ing 모양을 골라요."],pen:"Were you reading(과거 진행) → I was doing",tr:"A: 너는 책을 읽고 있었니?<br>B: 아니. 나는 숙제를 ___.",ex:[]});
A("RT","RT",6,"c",{q:"• The waiter ___ serve dessert.<br>• ___ they check their emails?",opts:["is[Is]", "are[Are]", "do[Do]", "does[Does]", "will[Will]"],ans:"will[Will]",full:"The waiter will serve dessert. / Will they check their emails?",ko:"웨이터가 후식을 내올 것이다. / 그들은 이메일을 확인할까?",h:["본책 UNIT 02: will + 동사원형. will은 주어가 무엇이든 모양이 같아요.", "두 문장 모두 빈칸 바로 뒤에 동사의 원형(serve, check)이 있어요. 한 단어가 두 곳에 모두 들어가야 해요.", "주어가 단수(The waiter)와 복수(they) 둘 다 맞는 말이 필요해요."],pen:"The waiter / they 모두 + 원형 → will",tr:"• 그 웨이터는 후식을 ___.<br>• 그들은 이메일을 ___?",ex:["serve = (음식을) 내놓다", "dessert = 후식"]});
A("RT","RT",7,"c",{q:"• ___ you watching TV last night?<br>• Ted and Lucy ___ flying kites in the park yesterday.",opts:["be[Be]", "are[Are]", "was[Was]", "were[Were]", "will[Will]"],ans:"were[Were]",full:"Were you watching TV last night? / Ted and Lucy were flying kites in the park yesterday.",ko:"너는 어젯밤에 TV를 보고 있었니? / 테드와 루시는 어제 공원에서 연을 날리고 있었다.",h:["본책 UNIT 01: 과거진행형은 was/were + v-ing예요.", "last night, yesterday는 과거예요. 주어는 you와 Ted and Lucy(여럿)예요.", "you와 여럿 모두와 짝이 되는 과거 be동사를 골라요."],pen:"you/Ted and Lucy(여럿) + 과거진행 → were",tr:"• 너는 어젯밤에 TV를 ___?<br>• 테드와 루시는 어제 공원에서 연을 ___.",ex:["fly a kite = 연을 날리다"]});
A("RT","RT",8,"w",{q:"A: ___ Dave practicing the piano now?<br>B: Yes, he ___. His concert is next week.",ans:"Is, is",full:"A: Is Dave practicing the piano now?<br>B: Yes, he is. His concert is next week.",ko:"A: 데이브는 지금 피아노를 연습하고 있니?<br>B: 응, 그래. 그의 콘서트는 다음 주야.",h:["본책 UNIT 01: 진행형 의문문은 be동사를 맨 앞에 두고, 대답에도 같은 be동사를 써요.", "now(지금), 주어는 Dave(한 명)예요. 대답은 Yes, he ___.", "두 칸 모두 같은 단어예요. he와 짝인 be동사 현재형이에요."],pen:"Dave(he) + now → Is / Yes, he is",tr:"A: 데이브는 지금 피아노를 ___?<br>B: 응, 그는 ___. 그의 콘서트는 다음 주야.",ex:["concert = 콘서트"]});
A("RT","RT",9,"w",{q:"A: Will it snow on Christmas Day?<br>B: No, it ___. It ___ be sunny.",ans:"won’t, will / won’t, is going to",full:"A: Will it snow on Christmas Day?<br>B: No, it won’t. It will be sunny.",ko:"A: 크리스마스에 눈이 올까?<br>B: 아니, 안 올 거야. 날씨는 맑을 거야.",h:["본책 UNIT 02: Will 의문문에는 will/won’t로 대답해요.", "첫 칸은 No의 대답이라 부정 줄임말, 둘째 칸 뒤에는 be(원형)가 와요.", "첫 칸은 w로 시작하는 will의 부정 줄임말. 둘째 칸은 미래 조동사(또는 be going to의 일부)예요."],pen:"No → won’t / 뒤에 be → will 또는 is going to",tr:"A: 크리스마스에 눈이 올까?<br>B: 아니, ___. 날씨는 맑을 ___.",ex:[]});
A("RT","RT",10,"c",{q:"다음 중 대화가 자연스럽지 않은 것은?",opts:["A: The phone is ringing.<br>B: I’ll get it.", "A: Are you sleeping this morning?<br>B: Yes, I was. I was tired.", "A: Are you making tea?<br>B: Yes. Do you want some?", "A: Is Eric going to buy a new car?<br>B: No, he isn’t. He likes his old car.", "A: Kate is angry at you.<br>B: I know. But I’m not going to say sorry to her."],ans:"A: Are you sleeping this morning?<br>B: Yes, I was. I was tired.",full:"A: Were you sleeping this morning?<br>B: Yes, I was. I was tired.",ko:"A: 너 오늘 아침에 자고 있었니?<br>B: 응, 그랬어. 피곤했거든.",h:["본책 UNIT 01: 질문의 be동사와 대답의 be동사는 같은 때(현재/과거)와 같은 형태여야 해요.", "대답이 Yes, I am/was처럼 되는지, 질문과 때가 맞는지 다섯 개를 하나씩 확인해요.", "질문은 현재진행(Are)인데 대답은 과거(was)인 대화가 있는지 찾아요."],pen:"질문 Are → 대답도 am, 그런데 was라서 어색",tr:"① A: 전화가 울리고 있어.<br>B: 내가 받을게.<br>② A: 너는 오늘 아침에 자고 있니?<br>B: 응, 그랬어. 나는 피곤했어.<br>③ A: 너는 차를 만들고 있니?<br>B: 응. 너도 좀 마실래?<br>④ A: 에릭은 새 차를 살 거니?<br>B: 아니, 안 사. 그는 자기 낡은 차를 좋아해.<br>⑤ A: 케이트가 너에게 화났어.<br>B: 알아. 하지만 나는 그녀에게 미안하다고 말하지 않을 거야.",ex:["ring = (전화가) 울리다", "say sorry = 미안하다고 말하다"]});
A("RT","RT",11,"w",{q:"다음 밑줄 친 부분을 바르게 고치시오.<br>I’m <u>ⓐ going give</u> this flower to Amy.<br>Will <u>ⓑ she likes</u> it?",ans:"going to give, she like",full:"I’m going to give this flower to Amy. Will she like it?",ko:"나는 이 꽃을 에이미에게 줄 것이다. 그녀가 그것을 좋아할까?",h:["본책 UNIT 02: be going to + 동사원형, Will + 주어 + 동사원형.", "ⓐ는 going 뒤에 빠진 말이 있고, ⓑ는 Will 뒤 동사에 -s가 붙었어요.", "ⓐ에는 to를 넣고, ⓑ는 she 뒤 동사를 원래 모양으로 바꿔요."],pen:"ⓐ going → going to / ⓑ Will + 주어 + 원형",tr:"나는 이 꽃을 에이미에게 줄 것이다.<br>그녀가 그것을 좋아할까?",ex:[]});
A("RT","RT",12,"w",{q:"다음 밑줄 친 부분을 바르게 고치시오.<br>We’re <u>ⓐ going not to</u> eat out tonight.<br>Dad <u>ⓑ is cook</u> dinner now.",ans:"not going to, is cooking",full:"We’re not going to eat out tonight. Dad is cooking dinner now.",ko:"우리는 오늘 밤 외식하지 않을 것이다. 아빠는 지금 저녁을 요리하고 계신다.",h:["본책 UNIT 02(ⓐ)와 UNIT 01(ⓑ): be going to의 not 위치, 진행형의 v-ing.", "ⓐ는 not의 자리가 틀렸어요(be동사 바로 뒤에!). ⓑ는 now(지금)인데 is 뒤 동사 모양이 틀렸어요.", "ⓐ는 going과 not의 순서를 바꾸고, ⓑ는 cook에 -ing를 붙여요."],pen:"ⓐ be + not + going to / ⓑ is + v-ing",tr:"우리는 오늘 밤 외식하지 ___.<br>아빠는 지금 저녁을 ___.",ex:["eat out = 외식하다"]});
A("RT","RT",13,"c",{q:"빈칸에 들어갈 말이 바르게 짝지어진 것은?<br>The class will ___(A)___ over at 5:00 p.m. After class, we ___(B)___ to a buffet.",opts:["be … is going to go", "be … are going to go", "is … will going", "is … are going to go", "are … is going to go"],ans:"be … are going to go",full:"The class will be over at 5:00 p.m. After class, we are going to go to a buffet.",ko:"수업은 오후 5시에 끝날 것이다. 수업이 끝난 후에 우리는 뷔페에 갈 것이다.",h:["본책 UNIT 02: will 뒤에는 동사원형, be going to에는 주어에 맞는 be동사가 와요.", "(A)는 will 바로 뒤예요. (B)의 주어는 we예요.", "(A)는 be동사의 원래 모양, (B)는 we와 짝인 be동사 + going to go."],pen:"(A) will + 원형 / (B) we + are going to",tr:"수업은 오후 5시에 ___. 수업이 끝난 후에 우리는 뷔페에 ___.",ex:["be over = 끝나다", "buffet = 뷔페"]});
A("RT","RT",14,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.",opts:["I <u>was thinking</u> about you.", "Jenny <u>is running</u> in the field.", "Ryan <u>is opening</u> a package.", "<u>Is</u> our team <u>losing</u> the game?", "Ellen <u>is cleaning</u> the floor a few minutes ago."],ans:"Ellen <u>is cleaning</u> the floor a few minutes ago.",full:"Ellen was cleaning the floor a few minutes ago.",ko:"엘런은 몇 분 전에 바닥을 청소하고 있었다.",h:["본책 UNIT 01: 현재진행형은 지금, 과거진행형은 지난 때를 말해요.", "각 문장의 시간 표현을 찾아 be동사와 때가 맞는지 확인해요.", "a few minutes ago(몇 분 전)와 be동사의 때가 맞지 않는 문장을 찾아요."],pen:"ago(과거) + is(현재) → 어색",tr:"① 나는 너에 대해 생각하고 있었다.<br>② 제니는 들판에서 달리고 있다.<br>③ 라이언은 소포를 열고 있다.<br>④ 우리 팀이 경기에서 지고 있니?<br>⑤ 엘런은 몇 분 전에 바닥을 청소하고 ___.",ex:["field = 들판", "package = 소포"]});
A("RT","RT",15,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.",opts:["<u>Will</u> Fred <u>pass</u> the audition?", "I’m <u>going fry</u> these eggs.", "They <u>won’t be</u> here on time.", "It <u>is going to be</u> windy tonight.", "Grace <u>will ask</u> for your phone number."],ans:"I’m <u>going fry</u> these eggs.",full:"I’m going to fry these eggs.",ko:"나는 이 달걀들을 부칠 것이다.",h:["본책 UNIT 02: will + 동사원형 / be going to + 동사원형.", "다섯 문장을 하나씩 will, going to 모양과 동사 모양을 확인해요.", "going 뒤에 꼭 있어야 하는 작은 말이 빠진 문장을 찾아요."],pen:"going 뒤에 to가 빠졌어요",tr:"① 프레드는 오디션에 합격할까?<br>② 나는 이 달걀들을 부칠 것이다.<br>③ 그들은 제시간에 여기에 오지 않을 것이다.<br>④ 오늘 밤에는 바람이 불 것이다.<br>⑤ 그레이스는 네 전화번호를 물어볼 것이다.",ex:["audition = 오디션", "on time = 제시간에", "ask for = ~을 요청하다"]});
A("RT","RT",16,"c",{q:"다음 우리말을 영어로 바르게 옮긴 것은?<br>너는 피자를 만들고 있었니?",opts:["Are you making pizza?", "Did you make pizza?", "Will you make pizza?", "Were you making pizza?", "Are you going to make pizza?"],ans:"Were you making pizza?",full:"Were you making pizza?",ko:"너는 피자를 만들고 있었니?",h:["본책 UNIT 01: 과거진행형 의문문은 Was/Were + 주어 + v-ing예요.", "‘~하고 있었니?’는 지난 때에 하던 일을 물어요. 주어는 you예요.", "be동사 과거형이 맨 앞이고 making이 뒤에 있는 문장을 골라요."],pen:"you → Were + you + making",tr:"① 너는 피자를 만들고 있니?<br>② 너는 피자를 만들었니?<br>③ 너는 피자를 만들 거니?<br>④ 너는 피자를 만들고 있었니?<br>⑤ 너는 피자를 만들 예정이니?",ex:[]});
A("RT","RT",17,"w",{q:"다음 문장을 ( ) 안의 지시대로 바꿔 쓰시오.<br>John is going to be fifteen next year. (will을 이용하여)",ans:"John will be fifteen next year",full:"John will be fifteen next year.",ko:"존은 내년에 열다섯 살이 될 것이다.",h:["본책 UNIT 02: be going to와 will은 둘 다 미래를 나타내요.", "is going to를 지우고 그 자리에 will을 넣어요.", "will + 동사원형(be). 나머지 말은 그대로 둬요."],pen:"is going to be → will be",tr:"존은 내년에 열다섯 살이 될 것이다.",ex:[]});
A("RT","RT",18,"w",{q:"다음 문장을 ( ) 안의 지시대로 바꿔 쓰시오.<br>I won’t eat this cake. (be going to를 이용하여)",ans:"I’m not going to eat this cake / I am not going to eat this cake",full:"I’m not going to eat this cake.",ko:"나는 이 케이크를 먹지 않을 것이다.",h:["본책 UNIT 02: won’t는 will not이에요. be going to의 부정은 be동사 + not + going to.", "주어가 I이니 be동사는 am이에요(줄임말 I’m도 가능).", "I와 짝인 be동사 + not + going to + 동사원형 + 나머지 말 순서로 써요."],pen:"won’t eat → am not going to eat",tr:"나는 이 케이크를 먹지 ___.",ex:[]});
A("RT","RT",19,"w",{q:"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>Alice는 문을 잠그는 중이다. (lock)<br>Alice ___ the door.",ans:"is locking",full:"Alice is locking the door.",ko:"앨리스는 문을 잠그는 중이다.",h:["본책 UNIT 01: ‘~하는 중이다’는 현재진행형 be동사 + v-ing예요.", "주어 Alice는 한 명이고 지금 하는 중이에요.", "she와 짝인 be동사 + lock + ing(k 뒤 그냥 ing)."],pen:"Alice(she) + 하는 중 → is + v-ing",tr:"앨리스는 문을 ___.",ex:[]});
A("RT","RT",20,"w",{q:"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>그 가게는 다음 주 월요일에 세일을 하지 않을 것이다. (will, have)<br>The store ___ a sale next Monday.",ans:"won’t have / will not have",full:"The store won’t have a sale next Monday.",ko:"그 가게는 다음 주 월요일에 세일을 하지 않을 것이다.",h:["본책 UNIT 02: will의 부정은 will not 또는 won’t + 동사원형이에요.", "‘~하지 않을 것이다’이니 부정이고, 동사 have(원형)가 뒤에 와요.", "will의 부정(줄임말 가능) 뒤에 괄호 안 동사를 원래 모양 그대로 이어요."],pen:"will의 부정 + have",tr:"그 가게는 다음 주 월요일에 세일을 ___.",ex:["sale = 세일, 할인 판매"]});
A("RT","RT",21,"w",{q:"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>나는 머리를 자르지 않을 것이다. (be going to, get)<br>___ a haircut.",ans:"I’m not going to get / I am not going to get",full:"I’m not going to get a haircut.",ko:"나는 머리를 자르지 않을 것이다.",h:["본책 UNIT 02: be going to의 부정은 be동사 + not + going to + 동사원형이에요.", "주어는 I이고 말하고 싶은 내용은 ‘~하지 않을 것이다’(부정)예요.", "I와 짝인 be동사 + not + going to + 동사원형 순서로 써요(줄임말 가능)."],pen:"I + am not going to + get",tr:"___ 머리를 ___.",ex:["get a haircut = 머리를 자르다"]});
A("RT","RT",22,"w",{q:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그가 골을 넣을까? (a goal, he, will, score)<br>→ ___?",ans:"Will he score a goal",full:"Will he score a goal?",ko:"그가 골을 넣을까?",h:["본책 UNIT 02: will 의문문은 Will + 주어 + 동사원형이에요.", "의문문이니 will이 맨 앞(대문자)에 와요.", "순서: Will → 주어 → 동사원형 → 목적어."],pen:"Will + 주어 + 원형 + 목적어",tr:"우리말 문제예요. 위의 우리말을 보고 써 보세요.",ex:["score a goal = 골을 넣다"]});
A("RT","RT",23,"w",{q:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그들은 눈을 감고 있니? (their eyes, they, closing, are)<br>→ ___?",ans:"Are they closing their eyes",full:"Are they closing their eyes?",ko:"그들은 눈을 감고 있니?",h:["본책 UNIT 01: 진행형 의문문은 be동사 + 주어 + v-ing예요.", "‘~하고 있니?’는 지금 하는 중인 일을 물어요. be동사가 맨 앞이에요.", "순서: be동사 → 주어 → v-ing → 목적어."],pen:"Are + they + closing + 목적어",tr:"우리말 문제예요. 위의 우리말을 보고 써 보세요.",ex:[]});
A("RT","RT",24,"w",{q:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>Lucy는 그녀의 개를 훈련시킬 예정이다. (is, her dog, train, going to)<br>→ Lucy ___.",ans:"is going to train her dog",full:"Lucy is going to train her dog.",ko:"루시는 그녀의 개를 훈련시킬 예정이다.",h:["본책 UNIT 02: be going to + 동사원형.", "Lucy 뒤에 be동사, 그 뒤에 going to, 그다음 동사와 목적어예요.", "순서: be동사 → going to → 동사원형 → 목적어."],pen:"Lucy + is going to + train + 목적어",tr:"루시는 ___.",ex:[]});
A("RT","RT",25,"w",{q:"밑줄 친 부분이 어법상 옳은지 판단하고, 틀리면 바르게 고치시오.<br>Richard <u>was solving</u> the puzzle in his room. (O / X)",ans:"◯",full:"Richard was solving the puzzle in his room.",ko:"리처드는 자기 방에서 퍼즐을 풀고 있었다.",h:["본책 UNIT 01: 과거진행형은 was/were + v-ing예요.", "주어 Richard는 한 명이에요. 한 명과 짝인 과거 be동사가 쓰였는지, v-ing 모양인지 살펴보세요.", "solve는 e로 끝나서 e를 빼고 ing를 붙여요. 밑줄 부분이 규칙에 맞으면 O예요."],pen:"was + solving → 과거진행 OK",tr:"리처드는 자기 방에서 퍼즐을 풀고 있었다.",ex:["solve = (문제를) 풀다", "puzzle = 퍼즐"]});
A("RT","RT",26,"w",{q:"밑줄 친 부분이 어법상 옳은지 판단하고, 틀리면 바르게 고치시오.<br>The president <u>will visits</u> our town next week. (O / X)",ans:"X, will visit",full:"The president will visit our town next week.",ko:"대통령은 다음 주에 우리 마을을 방문할 것이다.",h:["본책 UNIT 02: will 뒤에는 동사원형이 와요. 주어가 3인칭 단수여도 -s를 붙이지 않아요.", "The president는 한 명이고 next week(다음 주)는 미래예요.", "will 뒤 동사의 -s를 떼어 원래 모양으로 고쳐요. 틀렸으니 X!"],pen:"will + 원형 (will visits는 X)",tr:"대통령은 다음 주에 우리 마을을 방문할 것이다.",ex:["president = 대통령", "town = 마을"]});

A(3,"WA",7,"s",{ins:"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.",q:"The judge ___.",ko:"판사는 그에게 100달러를 지불하라고 명령했다.",words:"order, he, pay $100",ans:"ordered him to pay $100",full:"The judge ordered him to pay $100.",tr:"판사는 ___.",ex:[],h:["본책 UNIT 03: order + 사람 + to부정사 구조예요.","he는 목적어 자리라 모양이 바뀌고, 우리말이 과거(~명령했다)예요.","order의 과거형 → 목적격 → to + 괄호 안 말 순서로 써요."],eo:"명령했다 / 그에게 / 지불하라고 / 100달러를"});

A(3,"WB",1,"s",{ins:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.",q:"His first novel ___.",ko:"그의 첫 소설은 그를 유명하게 만들어 주었다.",words:"him, made, famous",ans:"made him famous",full:"His first novel made him famous.",tr:"그의 첫 소설은 ___.",ex:[],h:["본책 UNIT 03: make + 목적어 + 형용사 구조예요.","주어 His first novel(소설) 뒤에 동사부터 이어요.","동사 → 목적어 → 형용사 순서로 놓아요."],eo:"만들어 주었다 / 그를 / 유명하게"});
A(3,"WB",2,"s",{ins:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.",q:"I ___.",ko:"나는 그녀가 정직할 것이라고 기대한다.",words:"her, expect, to, honest, be",ans:"expect her to be honest",full:"I expect her to be honest.",tr:"나는 ___.",ex:[],h:["본책 UNIT 03: expect + 목적어 + to부정사 구조예요.","to be는 to + 동사원형이에요. 형용사 honest는 맨 뒤에 와요.","동사 → 목적어 → to + 동사원형 → 형용사 순서로 놓아요."],eo:"기대한다 / 그녀가 / ~일 것을 / 정직한"});
A(3,"WB",3,"s",{ins:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.",q:"You’ll ___.",ko:"너는 이 신발이 편하다는 것을 알게 될 것이다.",words:"find, comfortable, these shoes",ans:"find these shoes comfortable",full:"You’ll find these shoes comfortable.",tr:"너는 ___ 것이다.",ex:[],h:["본책 UNIT 03: find + 목적어 + 형용사 구조예요.","You’ll 뒤라서 find는 원형 그대로예요.","동사원형 → 목적어 → 형용사 순서로 놓아요."],eo:"알게 되다 / 이 신발이 / 편한"});
A(3,"WB",4,"s",{ins:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.",q:"The music video ___.",ko:"그 뮤직비디오는 그를 대스타로 만들었다.",words:"him, a big star, made",ans:"made him a big star",full:"The music video made him a big star.",tr:"그 뮤직비디오는 ___.",ex:[],h:["본책 UNIT 03: make + 목적어 + 명사 구조예요.","주어 the music video 뒤에 동사부터 이어요.","동사 → 목적어 → 명사 순서로 놓아요."],eo:"만들었다 / 그를 / 대스타로"});
A(3,"WB",5,"s",{ins:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.",q:"___ with him.",ko:"그는 나에게 자신과 함께 저녁을 먹자고 요청했다.",words:"he, to, asked, have dinner, me",ans:"He asked me to have dinner",full:"He asked me to have dinner with him.",tr:"그와 함께 ___.",ex:[],h:["본책 UNIT 03: ask + 사람 + to부정사 구조예요.","주어 he로 시작하고, 뒤에 with him이 이미 있어요.","주어 → 동사 → 사람 → to + 동사원형 덩어리 순서로 놓아요. 첫 글자는 대문자예요."],eo:"그는 / 요청했다 / 나에게 / 저녁을 먹자고"});
A(3,"WB",6,"s",{ins:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.",q:"My parents ___.",ko:"우리 부모님은 나에게 중국어를 배우라고 조언하셨다.",words:"learn, advised, to, me, Chinese",ans:"advised me to learn Chinese",full:"My parents advised me to learn Chinese.",tr:"우리 부모님은 ___.",ex:[],h:["본책 UNIT 03: advise + 사람 + to부정사 구조예요.","주어 My parents 뒤에 동사부터 이어요.","동사 → 사람 → to + 동사원형 → 목적어 순서로 놓아요."],eo:"조언하셨다 / 나에게 / 배우라고 / 중국어를"});

A("RT","RT",1,"c",{q:"Julia’s sunglasses look ___.",opts:["well","great","badly","terribly","wonderfully"],ans:"great",full:"Julia’s sunglasses look great.",ko:"Julia의 선글라스는 멋져 보인다.",h:["본책 UNIT 01: look(~해 보이다) 뒤에는 부사가 아니라 형용사를 써요.","보기 중 -ly로 끝나는 말은 부사예요. well은 ‘잘’이라는 부사로 쓰는 말이에요.","남은 보기 하나는 -ly가 없고 ‘멋진’이라는 뜻의 형용사예요."],pen:"look(~해 보이다) + 형용사 → great",tr:"Julia의 선글라스는 ___ 보인다.",ex:["sunglasses = 선글라스"]});
A("RT","RT",2,"c",{q:"I was sick. Daniel cooked soup ___ me.",opts:["to","for","of","at","from"],ans:"for",full:"I was sick. Daniel cooked soup for me.",ko:"나는 아팠다. Daniel이 나를 위해 수프를 끓여 주었다.",h:["본책 UNIT 02: 3형식에서 쓰는 전치사는 동사 그룹마다 달라요(to / for / of).","cooked(요리했다)는 ‘만들어 주는’ 동사예요. 아픈 나를 위해 해 준 일이에요.","‘~을 위해’ 뜻의 전치사를 골라요. f로 시작해요."],pen:"cook(만들어 주다) → for me",tr:"나는 아팠다. Daniel이 나 ___ 수프를 요리했다.",ex:["sick = 아픈"]});
A("RT","RT",3,"c",{q:"My parents expect me ___ home early.",opts:["come","comes","came","will come","to come"],ans:"to come",full:"My parents expect me to come home early.",ko:"부모님은 내가 일찍 집에 오기를 기대하신다.",h:["본책 UNIT 03: expect + 목적어 + to부정사 구조예요.","me(목적어) 뒤에 오는 동사의 모양을 정해요.","동사원형 앞에 to가 붙은 보기를 골라요."],pen:"expect + me + to + 동사원형",tr:"부모님은 내가 일찍 집에 ___ 기대하신다.",ex:["expect = 기대하다"]});
A("RT","RT",4,"c",{q:"A: Let’s take a walk after lunch.<br>B: That ___ great.",opts:["looks","feels","sounds","smells","tastes"],ans:"sounds",full:"A: Let’s take a walk after lunch.<br>B: That sounds great.",ko:"A: 점심 먹고 산책하자. B: 좋은 생각이야.",h:["본책 UNIT 01: 상대 말을 듣고 반응할 땐 sound를 써요.","A가 제안을 말했어요. B는 그 말을 어떻게 느꼈을까요?","‘~하게 들리다’ 뜻이고 주어 That이 단수라 -s가 붙은 보기예요."],pen:"That(상대 말) → 들리다 → sounds",tr:"A: 점심 먹고 산책하자. <br>B: 그거 멋지게 ___.",ex:["take a walk = 산책하다"]});
A("RT","RT",5,"c",{q:"A: Do you know that singer’s real name?<br>B: No, I don’t. People just ___ her Spider.",opts:["send","call","say","tell","give"],ans:"call",full:"A: Do you know that singer’s real name?<br>B: No, I don’t. People just call her Spider.",ko:"A: 그 가수의 진짜 이름을 아니? B: 아니, 몰라. 사람들은 그냥 그녀를 Spider라고 불러.",h:["본책 UNIT 03: ‘~을 …라고 부르다’ 동사를 떠올려요(목적어 + 명사).","her 뒤에 이름 Spider가 바로 와요. 두 말이 같은 사람이에요.","‘부르다’ 뜻이고 c로 시작해요."],pen:"~을 …라고 부르다 → call her Spider",tr:"A: 그 가수의 진짜 이름을 아니? <br>B: 아니, 몰라. 사람들은 그냥 그녀를 Spider라고 ___.",ex:[]});
A("RT","RT",6,"w",{q:"The man showed us his ID card.<br>→ The man showed ___.",ans:"his ID card to us",full:"The man showed his ID card to us.",ko:"그 남자는 우리에게 자신의 신분증을 보여 주었다.",h:["본책 UNIT 02: 4형식을 3형식으로 바꿀 땐 사람(us)을 뒤로 보내고 전치사를 붙여요.","show는 to를 쓰는 동사예요.","물건을 먼저 쓰고, show와 짝인 전치사 + 사람을 붙여요."],pen:"show → 물건 먼저 + to + 사람",tr:"그 남자는 우리에게 자신의 신분증을 보여 주었다. (두 문장은 뜻이 같아요.)",ex:["ID card = 신분증"]});
A("RT","RT",7,"w",{q:"My sister bought me a scarf.<br>→ My sister bought ___.",ans:"a scarf for me",full:"My sister bought a scarf for me.",ko:"내 여동생은 나에게 스카프를 사 주었다.",h:["본책 UNIT 02: 4형식을 3형식으로 바꿀 땐 사람(me)을 뒤로 보내요.","buy는 for를 쓰는 동사예요.","물건을 먼저 쓰고, buy와 짝인 전치사 + 사람을 붙여요."],pen:"buy → 물건 먼저 + for + 사람",tr:"내 여동생은 나에게 스카프를 사 주었다. (두 문장은 뜻이 같아요.)",ex:["scarf = 스카프"]});
A("RT","RT",8,"w",{q:"Can you bring her that book?<br>→ Can you bring ___?",ans:"that book to her",full:"Can you bring that book to her?",ko:"그녀에게 그 책을 가져다줄 수 있니?",h:["본책 UNIT 02: 사람(her)을 뒤로 보내고 전치사를 붙여요.","bring은 to를 쓰는 동사예요.","물건을 먼저 쓰고, bring과 짝인 전치사 + 사람을 붙여요."],pen:"bring → 물건 먼저 + to + 사람",tr:"그녀에게 그 책을 가져다줄 수 있니? (두 문장은 뜻이 같아요.)",ex:[]});
A("RT","RT",9,"c",{q:"밑줄 친 부분의 쓰임이 나머지 넷과 다른 것은?",opts:["His death <u>made</u> me sad.","He <u>made</u> his son a teacher.","Christine <u>made</u> us green tea.","The TV show <u>made</u> her popular.","His experience <u>made</u> him a great reporter."],ans:"Christine <u>made</u> us green tea.",full:"Christine made us green tea.",ko:"Christine은 우리에게 녹차를 만들어 주었다.",h:["본책 UNIT 03: make + 목적어 + 보어는 ‘~을 …로/하게 만들다’이고, 보어는 목적어와 같은 것이에요.","각 문장에서 made 뒤의 두 말이 ‘같은 대상’(예: me = sad)인지 비교해요.","한 문장만 us ≠ green tea예요. ‘만들어 주다’ 뜻이에요."],pen:"us ≠ green tea → 만들어 주다(보어 아님)",tr:"① 그의 죽음은 나를 슬프게 ___.<br>② 그는 아들을 선생님으로 ___.<br>③ Christine은 우리에게 녹차를 ___.<br>④ 그 TV 프로그램은 그녀를 인기 있게 ___.<br>⑤ 그의 경험은 그를 훌륭한 기자로 ___.",ex:[]});
A("RT","RT",10,"c",{q:"다음 중 대화가 자연스럽지 않은 것은?",opts:["A: Are you okay?<br>B: No. I feel tired.","A: This cake tastes delicious!<br>B: Thanks. I made it.","A: Can you lend me ten dollars?<br>B: Sure. Wait a minute.","A: What did the coach tell you?<br>B: He told me practice hard.","A: Do you keep your room clean?<br>B: Yes. I clean it every day."],ans:"A: What did the coach tell you?<br>B: He told me practice hard.",full:"A: What did the coach tell you?<br>B: He told me to practice hard.",ko:"A: 코치님이 너에게 뭐라고 하셨어? B: 열심히 연습하라고 말씀하셨어.",h:["본책 UNIT 03: tell + 사람 + to부정사 구조예요.","각 대화에서 동사 뒤 모양이 맞는지 하나씩 살펴요.","tell 뒤에서 동사원형만 쓴 대화가 틀려요."],pen:"told me + to + 동사원형",tr:"① A: 괜찮니? B: 아니. 피곤해.<br>② A: 이 케이크 맛있다! B: 고마워. 내가 만들었어.<br>③ A: 나에게 10달러 빌려줄 수 있니? B: 물론이지. 잠깐만 기다려.<br>④ A: 코치님이 너에게 뭐라고 하셨어? B: 나에게 열심히 연습하라고 말씀하셨어.<br>⑤ A: 네 방을 깨끗하게 유지하니? B: 응. 매일 청소해.",ex:["coach = 코치"]});
A("RT","RT",11,"c",{q:"• Harry lent his notebook ___ Fred.<br>• I asked my neighbor ___ watch my dog.",opts:["for","with","of","at","to"],ans:"to",full:"Harry lent his notebook to Fred. / I asked my neighbor to watch my dog.",ko:"Harry는 Fred에게 공책을 빌려주었다. / 나는 이웃에게 내 개를 봐 달라고 부탁했다.",h:["본책 UNIT 02와 03: lend의 3형식 전치사와 ask + 사람 + ( ) + 동사원형 구조를 떠올려요.","첫 문장은 전치사 자리, 둘째 문장은 to부정사의 첫 글자 자리예요.","두 글자 t로 시작하는 말 하나가 두 곳에 모두 들어가요."],pen:"lend … to 사람 / ask 사람 to 동사",tr:"• Harry는 Fred에게 공책을 ___.<br>• 나는 이웃에게 내 개를 ___ 부탁했다.",ex:["neighbor = 이웃","notebook = 공책"]});
A("RT","RT",12,"c",{q:"• Your gift ___ me happy.<br>• His effort ___ him a winner.",opts:["found","wanted","told","made","called"],ans:"made",full:"Your gift made me happy. / His effort made him a winner.",ko:"네 선물은 나를 행복하게 만들었다. / 그의 노력은 그를 우승자로 만들었다.",h:["본책 UNIT 03: 목적어 뒤에 형용사도 명사도 올 수 있는 ‘~을 …하게(로) 만들다’ 동사를 떠올려요.","me happy는 형용사 보어, him a winner는 명사 보어예요. 둘 다 같은 동사가 맞아야 해요.","불규칙 과거형이고 m으로 시작해요."],pen:"make + 목적어 + 보어(형용사/명사)",tr:"• 네 선물은 나를 행복하게 ___.<br>• 그의 노력은 그를 우승자로 ___.",ex:["effort = 노력","winner = 우승자"]});
A("RT","RT",13,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.",opts:["The man <u>looked gentle</u>.","They <u>asked me close</u> the door.","Did you <u>send an email to me</u>?","Your story <u>made me sad</u>.","Someone <u>kept the door open</u>."],ans:"They <u>asked me close</u> the door.",full:"They asked me to close the door.",ko:"그들은 나에게 문을 닫아 달라고 부탁했다.",h:["본책 UNIT 01~03에서 배운 모양을 하나씩 확인해요(look + 형용사, make/keep + 목적어 + 형용사).","ask는 ‘~에게 …해 달라고 부탁하다’일 때 뒤 모양이 정해져 있어요.","ask + 사람 뒤에 to가 빠진 문장이 틀려요."],pen:"ask + 사람 + to + 동사원형",tr:"① 그 남자는 점잖아 보였다.<br>② 그들은 나에게 문을 닫아 달라고 부탁했다.<br>③ 너는 나에게 이메일을 보냈니?<br>④ 네 이야기는 나를 슬프게 만들었다.<br>⑤ 누군가가 문을 열어 두었다.",ex:["gentle = 점잖은, 온화한"]});
A("RT","RT",14,"c",{q:"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.",opts:["She <u>named her baby Emily</u>.","Eric <u>found his new house nice</u>.","After the exam, we <u>felt excited</u>.","Mary <u>cooked pasta to her boyfriend</u>.","We <u>expected our parents to come</u> to school today."],ans:"Mary <u>cooked pasta to her boyfriend</u>.",full:"Mary cooked pasta for her boyfriend.",ko:"Mary는 남자친구를 위해 파스타를 요리했다.",h:["본책 UNIT 02: 3형식에서 전치사는 동사마다 달라요(to / for / of).","cook은 ‘만들어 주는’ 동사예요. 어느 전치사 그룹인지 떠올려요.","cook 뒤 전치사가 to로 되어 있으면 틀려요. for로 바꿔야 해요."],pen:"cook → for (to 아님)",tr:"① 그녀는 자기 아기의 이름을 Emily라고 지었다.<br>② Eric은 새 집이 좋다고 생각했다.<br>③ 시험 후에 우리는 신이 났다.<br>④ Mary는 남자친구에게 파스타를 요리해 주었다.<br>⑤ 우리는 부모님이 오늘 학교에 오실 거라고 기대했다.",ex:["exam = 시험"]});
A("RT","RT",15,"w",{q:"다음 밑줄 친 부분을 바르게 고치시오.<br>I watched this movie last Sunday. The movie poster <u>ⓐ watched</u> boring. But I found the movie very <u>ⓑ interest</u>.<br>ⓐ ___ ⓑ ___",ans:"looked, interesting",full:"I watched this movie last Sunday. The movie poster looked boring. But I found the movie very interesting.",ko:"나는 지난 일요일에 이 영화를 보았다. 영화 포스터는 지루해 보였다. 하지만 나는 그 영화가 매우 재미있다고 생각했다.",h:["본책 UNIT 01과 03: ⓐ는 감각동사 + 형용사, ⓑ는 find + 목적어 + 형용사예요.","ⓐ watched는 ‘보다’라서 ‘~해 보이다’ 뜻이 아니에요. ⓑ interest는 형용사가 아니에요.","ⓐ는 l로 시작하는 과거형, ⓑ는 -ing로 끝나는 형용사예요."],pen:"ⓐ ~해 보였다(과거) / ⓑ interest → 형용사",tr:"나는 지난 일요일에 이 영화를 보았다. 영화 포스터는 지루하게 ___. 하지만 나는 그 영화가 매우 ___ 알게 되었다.",ex:["poster = 포스터"]});
A("RT","RT",16,"w",{q:"다음 밑줄 친 부분을 바르게 고치시오.<br>My brother talked on the phone loudly last night. It made <u>ⓐ for me</u> upset. I went to his room and told him <u>ⓑ be</u> quiet.<br>ⓐ ___ ⓑ ___",ans:"me, to be",full:"My brother talked on the phone loudly last night. It made me upset. I went to his room and told him to be quiet.",ko:"내 남동생은 어젯밤에 큰 소리로 통화했다. 그것이 나를 화나게 했다. 나는 그의 방에 가서 그에게 조용히 하라고 말했다.",h:["본책 UNIT 03: ⓐ make + 목적어 + 형용사, ⓑ tell + 사람 + to부정사 구조예요.","ⓐ에는 필요 없는 전치사가 붙어 있고, ⓑ에는 빠진 말이 있어요.","ⓐ는 for를 빼고 목적격만, ⓑ는 be 앞에 두 글자 말을 넣어요."],pen:"ⓐ made + 목적어 + 형용사 / ⓑ told + 사람 + to + 동사원형",tr:"내 남동생은 어젯밤에 큰 소리로 통화했다. 그것은 나를 ___ 만들었다. 나는 그의 방에 가서 그에게 ___ 말했다.",ex:["upset = 화난, 속상한","loudly = 큰 소리로"]});
A("RT","RT",17,"c",{q:"다음 우리말을 영어로 바르게 옮긴 것을 고르시오.<br>나는 친구들에게 핫도그를 사주었다.",opts:["I bought hot dogs my friends.","I bought my friends hot dogs.","I bought hot dogs to my friends.","I bought for hot dogs my friends.","I bought my friends for hot dogs."],ans:"I bought my friends hot dogs.",full:"I bought my friends hot dogs.",ko:"나는 친구들에게 핫도그를 사주었다.",h:["본책 UNIT 02: 4형식은 동사 + 사람 + 물건 순서, 3형식은 동사 + 물건 + for + 사람이에요.","buy는 to가 아니라 for를 쓰는 동사예요. 그리고 for는 사람 바로 앞에만 와요.","전치사가 없고 사람(my friends)이 물건 앞에 오는 문장을 골라요."],pen:"bought + 사람 + 물건 (전치사 없음)",tr:"① 나는 친구들에게 핫도그를 사주었다.<br>② 나는 친구들에게 핫도그를 사주었다.<br>③ 나는 친구들에게 핫도그를 사주었다.<br>④ 나는 친구들에게 핫도그를 사주었다.<br>⑤ 나는 친구들에게 핫도그를 사주었다.",ex:[]});
A("RT","RT",18,"c",{q:"다음 우리말을 영어로 바르게 옮긴 것을 고르시오.<br>나는 그 식당이 훌륭하다는 걸 알게 되었다.",opts:["I found the restaurant great.","I found the restaurant greatly.","I found the restaurant to great.","I found the restaurant be great.","I found the restaurant to be greatly."],ans:"I found the restaurant great.",full:"I found the restaurant great.",ko:"나는 그 식당이 훌륭하다는 걸 알게 되었다.",h:["본책 UNIT 03: find + 목적어 + 형용사는 ‘~이 …하다고 알게 되다’예요.","목적어 the restaurant 뒤에는 형용사만 와요. 부사나 to, be는 필요 없어요.","-ly가 없고 to와 be도 없는 가장 짧은 문장을 골라요."],pen:"found + 목적어 + 형용사",tr:"① 나는 그 식당이 훌륭하다는 걸 알게 되었다.<br>② 나는 그 식당이 훌륭하다는 걸 알게 되었다.<br>③ 나는 그 식당이 훌륭하다는 걸 알게 되었다.<br>④ 나는 그 식당이 훌륭하다는 걸 알게 되었다.<br>⑤ 나는 그 식당이 훌륭하다는 걸 알게 되었다.",ex:[]});
A("RT","RT",19,"w",{q:"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>그녀의 목소리는 또렷하게 들린다. (clear)<br>→ Her voice ___.",ans:"sounds clear",full:"Her voice sounds clear.",ko:"그녀의 목소리는 또렷하게 들린다.",h:["본책 UNIT 01: 감각동사 + 형용사 구조예요. 목소리는 귀로 느끼는 거예요.","주어 Her voice는 단수이고 현재형이에요.","s로 시작하는 감각동사에 -s를 붙이고 clear를 이어요."],pen:"Her voice(단수) + 들리다 → sounds + clear",tr:"그녀의 목소리는 ___.",ex:[]});
A("RT","RT",20,"w",{q:"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>이 종이는 거친 느낌이 든다. (rough)<br>→ This paper ___.",ans:"feels rough",full:"This paper feels rough.",ko:"이 종이는 거친 느낌이 든다.",h:["본책 UNIT 01: 감각동사 + 형용사 구조예요. 종이는 손으로 만져 보는 거예요.","주어 This paper는 단수이고 현재형이에요.","f로 시작하는 감각동사에 -s를 붙이고 rough를 이어요."],pen:"This paper(단수) + 느끼다 → feels + rough",tr:"이 종이는 ___.",ex:["rough = 거친"]});
A("RT","RT",21,"w",{q:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>그는 내게 그의 방을 보여주었다. (me, to, his room, showed)<br>→ He ___.",ans:"showed his room to me",full:"He showed his room to me.",ko:"그는 내게 그의 방을 보여주었다.",h:["본책 UNIT 02: to가 주어졌으니 동사 + 물건 + to + 사람 순서예요.","동사 showed는 이미 과거형이에요.","동사 → 물건 → to → 사람 순서로 놓아요."],pen:"showed + 물건 + to + 사람",tr:"그는 ___.",ex:[]});
A("RT","RT",22,"w",{q:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>신선한 공기는 우리를 건강하게 유지해 준다. (us, healthy, fresh air, keeps)<br>→ ___.",ans:"Fresh air keeps us healthy",full:"Fresh air keeps us healthy.",ko:"신선한 공기는 우리를 건강하게 유지해 준다.",h:["본책 UNIT 03: keep + 목적어 + 형용사 구조예요.","주어는 fresh air(신선한 공기)예요. 첫 글자는 대문자로 써요.","주어 → 동사 → 목적어 → 형용사 순서로 놓아요."],pen:"주어 + keeps + 목적어 + 형용사",tr:"우리말 문제예요. 위의 우리말을 보고 써 보세요.",ex:[]});
A("RT","RT",23,"w",{q:"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>교장 선생님께서 네가 교장실로 오길 원하셔. (you, to, wants, the principal, come)<br>→ ___ to his office.",ans:"The principal wants you to come",full:"The principal wants you to come to his office.",ko:"교장 선생님께서 네가 교장실로 오길 원하셔.",h:["본책 UNIT 03: want + 목적어 + to부정사 구조예요.","주어는 the principal(교장 선생님)이에요. 뒤에 to his office가 이미 있어요.","주어 → 동사 → 목적어 → to + 동사원형 순서로 놓아요."],pen:"주어 + wants + 목적어 + to + 동사원형",tr:"그의 사무실(교장실)로 ___.",ex:["principal = 교장 선생님","office = 사무실"]});
A("RT","RT",24,"w",{q:"어법상 틀린 부분을 찾아 바르게 고치시오.<br>A: This cheese smells badly!<br>B: I know. But it tastes greatly. (2개)",ans:"smells bad, tastes great",full:"A: This cheese smells bad!<br>B: I know. But it tastes great.",ko:"A: 이 치즈 냄새가 안 좋아! B: 알아. 하지만 맛은 좋아.",h:["본책 UNIT 01: 감각동사 뒤에는 부사가 아니라 형용사를 써요.","badly와 greatly는 -ly가 붙은 부사예요. 감각동사 smells, tastes 뒤에서 어색해요.","두 곳 모두 -ly를 떼어 형용사로 고쳐요."],pen:"감각동사 + 형용사 (-ly 부사 X)",tr:"A: 이 치즈 냄새가 ___! <br>B: 알아. 하지만 맛은 ___.",ex:["cheese = 치즈"]});
A("RT","RT",25,"w",{q:"어법상 틀린 부분을 찾아 바르게 고치시오.<br>I told my secret for Rachel. I expected her keep it. But she told everyone about it. It made me very angrily! (3개)",ans:"to Rachel, to keep, angry",full:"I told my secret to Rachel. I expected her to keep it. But she told everyone about it. It made me very angry!",ko:"나는 내 비밀을 Rachel에게 말했다. 나는 그녀가 비밀을 지켜 줄 거라고 기대했다. 하지만 그녀는 모두에게 그것에 대해 말했다. 그것은 나를 매우 화나게 만들었다!",h:["본책 UNIT 01~03: tell은 to를 쓰고, expect + 목적어 + to부정사, make + 목적어 + 형용사예요.","첫 문장 전치사, 둘째 문장 keep 앞, 마지막 문장 angrily(부사)에 오류가 있어요.","전치사 for를 다른 전치사로, keep 앞에 to를, angrily를 형용사로 고쳐요."],pen:"told … to 사람 / expected 목적어 to 동사 / made 목적어 형용사",tr:"나는 내 비밀을 Rachel에게 ___. 나는 그녀가 비밀을 ___ 기대했다. 하지만 그녀는 모두에게 그것에 대해 말했다. 그것은 나를 매우 ___ 만들었다!",ex:["secret = 비밀"]});

A("RT","RT",1,"c",{"q":"Jimin and Yumi will be late. I have to wait for ___.","opts":["me","him","her","us","them"],"ans":"them","full":"Jimin and Yumi will be late. I have to wait for them.","ko":"지민이와 유미는 늦을 것이다. 나는 그들을 기다려야 한다.","h":["본책 UNIT 01 인칭대명사 표 — 전치사(for) 뒤에는 목적격을 써요","Jimin and Yumi(지민이와 유미)는 두 명의 사람이에요. 나(I)는 아니에요","여러 사람을 가리키는 ‘그들을’ 모양이고 th로 시작해요"],"pen":"Jimin and Yumi(두 명) + for 뒤 → them","tr":"지민이와 유미는 늦을 것이다. 나는 ___ 기다려야 한다.","ex":["be late = 늦다"]});

A("RT","RT",5,"c",{"q":"Do you want ___(A)___ hot cocoa?<br>I found ___(B)___ socks under the sofa.","opts":["any … this","any … that","some … this","some … these","some … it"],"ans":"some … these","full":"Do you want some hot cocoa? I found these socks under the sofa.","ko":"뜨거운 코코아 좀 마실래? 나는 소파 밑에서 이 양말들을 찾았다.","h":["본책 UNIT 03의 some/any와 UNIT 02의 this/these를 모두 떠올려요","(A)는 권하는 질문이에요. (B)는 socks(양말들)가 복수예요","(A)는 권할 때 쓰는 말이고, (B)는 this의 복수 모양이에요"],"pen":"(A) 권유 → some, (B) socks 복수 → these","tr":"(A) ___ 뜨거운 코코아를 마실래?<br>(B) 나는 소파 밑에서 ___ 양말들을 찾았다.","ex":["cocoa = 코코아","sofa = 소파"]});
A("RT","RT",6,"c",{"q":"Sorry, I didn’t bring ___(A)___ gifts.<br>I liked the white shirt, but Mom bought me a black ___(B)___.","opts":["some … one","some … it","any … one","any … ones","any … it"],"ans":"any … one","full":"Sorry, I didn’t bring any gifts. I liked the white shirt, but Mom bought me a black one.","ko":"미안해, 나는 선물을 하나도 안 가져왔어. 나는 흰 셔츠가 좋았지만, 엄마는 나에게 검은 것을 사 주셨다.","h":["본책 UNIT 03 — 부정문의 any, 그리고 one/ones/it의 차이를 떠올려요","(A)는 didn’t bring(가져오지 않았다) 뒤예요. (B)는 a(하나) 뒤라서 단수예요","(A)는 부정문에 쓰는 말, (B)는 s가 없는 ‘하나’ 말이에요"],"pen":"(A) 부정문 → any, (B) a black + 단수 → one","tr":"미안해, 나는 선물을 ___ 안 가져왔어.<br>나는 흰 셔츠가 좋았지만, 엄마는 나에게 검은 ___ 사 주셨다.","ex":["gift = 선물"]});
A("RT","RT",7,"c",{"q":"밑줄 친 it의 쓰임이 나머지 넷과 다른 것은?","opts":["Where did you find <u>it</u>?","I like this toy. <u>It</u> is cute.","<u>It</u>’s my father’s trophy.","<u>It</u> is cloudy and windy today.","That is my wallet. Give <u>it</u> to me."],"ans":"<u>It</u> is cloudy and windy today.","full":"It is cloudy and windy today.","ko":"오늘은 흐리고 바람이 분다.","h":["본책 UNIT 02 — it은 앞의 물건을 가리키는 때와, 날씨·시간처럼 해석하지 않는 때가 있어요","①②③⑤는 it이 어떤 물건을 가리켜요. ④는 어떤 이야기인지 살펴봐요","나머지 넷은 ‘그것’으로 해석되는데, 하나만 해석되지 않아요"],"pen":"날씨 문장의 it은 해석하지 않는다","tr":"① 너는 그것을 어디서 찾았니?<br>② 나는 이 장난감이 좋다. 그것은 귀엽다.<br>③ 그것은 우리 아버지의 트로피이다.<br>④ 오늘은 흐리고 바람이 분다.<br>⑤ 저것은 내 지갑이다. 그것을 나에게 줘.","ex":["trophy = 트로피","wallet = 지갑"]});
A("RT","RT",8,"w",{"q":"빈칸에 알맞은 말을 보기에서 골라 대화를 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: one, ones, it<br>A: Where is your cell phone?<br>B: I put ___ in my pocket.","ans":"it","full":"A: Where is your cell phone?<br>B: I put it in my pocket.","ko":"A: 네 휴대폰 어디 있니?<br>B: 나는 그것을 주머니에 넣었어.","h":["본책 UNIT 03 — 바로 그 물건은 it으로 받아요","A가 물은 ‘네 휴대폰’ 바로 그것을 주머니에 넣었어요","보기 중 두 글자 말이에요"],"pen":"바로 그 휴대폰 → it","tr":"A: 네 휴대폰 어디 있니?<br>B: 나는 ___ 주머니에 넣었어.","ex":["pocket = 주머니"]});
A("RT","RT",9,"w",{"q":"빈칸에 알맞은 말을 보기에서 골라 대화를 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: one, ones, it<br>A: Do you need this eraser?<br>B: No, thanks. I already have ___.","ans":"one","full":"A: Do you need this eraser?<br>B: No, thanks. I already have one.","ko":"A: 이 지우개 필요하니?<br>B: 아니, 고마워. 나는 이미 하나 있어.","h":["본책 UNIT 03 — 같은 종류의 다른 하나는 one이에요","A가 준 ‘이 지우개’가 아니라, 내가 가진 같은 종류 하나예요","보기 중 s가 없는 세 글자 말이에요"],"pen":"같은 종류의 다른 하나(단수) → one","tr":"A: 이 지우개 필요하니?<br>B: 아니, 고마워. 나는 이미 ___ 있어.","ex":["eraser = 지우개"]});
A("RT","RT",10,"w",{"q":"빈칸에 알맞은 말을 보기에서 골라 대화를 완성하시오. (단, 한 번씩만 쓸 것)<br>보기: one, ones, it<br>A: Can you show me other shoes?<br>B: Okay. These are the best-selling ___ in our store.","ans":"ones","full":"A: Can you show me other shoes?<br>B: Okay. These are the best-selling ones in our store.","ko":"A: 다른 신발을 보여 주시겠어요?<br>B: 네. 이것들이 저희 가게에서 가장 잘 팔리는 것들이에요.","h":["본책 UNIT 03 — 복수 명사의 반복은 ones로 말해요","These are(이것들은)와 shoes(신발, 복수)가 복수예요","보기 중 복수 모양이에요"],"pen":"shoes 복수 → ones","tr":"A: 다른 신발을 보여 주시겠어요?<br>B: 네. 이것들이 저희 가게에서 가장 잘 팔리는 ___ 이에요.","ex":["best-selling = 가장 잘 팔리는"]});
A("RT","RT",11,"c",{"q":"다음 중 대화가 자연스럽지 않은 것은?","opts":["A: Can I get you a towel?<br>B: Thanks, but I have one.","A: Did you get my package?<br>B: Yes, I got it this morning.","A: Did you do well on the test?<br>B: No, I made some mistakes.","A: We need bananas.<br>B: I’ll get some from the market.","A: Do you have any problems?<br>B: No, I don’t have some."],"ans":"A: Do you have any problems?<br>B: No, I don’t have some.","full":"A: Do you have any problems?<br>B: No, I don’t have any.","ko":"A: 문제가 있니?<br>B: 아니, 없어.","h":["본책 UNIT 03 — some/any와 one/it의 쓰임을 보기마다 확인해요","각 대화의 B의 대답이 A의 질문과 맞는지, 부정문인지 긍정문인지 봐요","부정문(don’t have)에 긍정문용 말이 쓰인 대화를 찾아요"],"pen":"부정문 → any (some은 안 됨)","tr":"① A: 수건 갖다 줄까? B: 고마워, 하지만 나는 하나 있어.<br>② A: 내 택배 받았니? B: 응, 오늘 아침에 그것을 받았어.<br>③ A: 시험 잘 봤니? B: 아니, 몇 개 틀렸어.<br>④ A: 우리 바나나가 필요해. B: 내가 시장에서 좀 사 올게.<br>⑤ A: 문제가 있니? B: 아니, 나는 ___ 없어.","ex":["package = 택배, 소포","mistake = 실수"]});
A("RT","RT",12,"c",{"q":"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.","opts":["I bought <u>some</u> magazines.","They didn’t sing <u>some</u> songs.","There isn’t <u>any</u> paper on the desk.","Did you have <u>any</u> fruit today?","Do you want <u>some</u> sugar in your coffee?"],"ans":"They didn’t sing <u>some</u> songs.","full":"They didn’t sing any songs.","ko":"그들은 노래를 하나도 부르지 않았다.","h":["본책 UNIT 03 — 긍정문·권유문은 some, 부정문·일반 의문문은 any예요","보기마다 문장이 긍정문인지 부정문인지 표시해 봐요","부정문(didn’t)에 some이 쓰인 문장을 찾아요"],"pen":"부정문(didn’t) → any","tr":"① 나는 잡지를 몇 권 샀다.<br>② 그들은 노래를 ___ 부르지 않았다.<br>③ 책상 위에 종이가 한 장도 없다.<br>④ 너 오늘 과일 좀 먹었니?<br>⑤ 커피에 설탕 좀 넣을래?","ex":["magazine = 잡지"]});
A("RT","RT",13,"c",{"q":"다음 중 밑줄 친 부분이 잘못된 것을 고르시오.","opts":["Did you tell <u>them</u> the truth?","<u>It’s</u> 6:15 p.m. We’ll take a break now.","The children are riding <u>theirs</u> bikes.","What’s the answer? I don’t know <u>it</u>.","These letters are for me, and <u>those ones</u> are for you."],"ans":"The children are riding <u>theirs</u> bikes.","full":"The children are riding their bikes.","ko":"아이들이 그들의 자전거를 타고 있다.","h":["본책 UNIT 01·02 — 소유격(명사 앞)과 소유대명사(명사 없이)를 구분해요","각 보기에서 밑줄 친 말 뒤에 명사가 있는지, 없는지 확인해요","밑줄 친 말 뒤에 bikes(자전거들)가 있는데 ‘~의 것’ 모양이 쓰였어요"],"pen":"명사(bikes) 앞 → 소유격 their","tr":"① 너는 그들에게 사실을 말했니?<br>② 오후 6시 15분이다. 우리는 이제 쉴 것이다.<br>③ 아이들이 그들의 자전거를 타고 있다.<br>④ 답이 뭐야? 나는 그것을 몰라.<br>⑤ 이 편지들은 나를 위한 것이고, 저것들은 너를 위한 것이다.","ex":["truth = 사실, 진실","take a break = 쉬다","letter = 편지"]});
A("RT","RT",14,"c",{"q":"다음 중 밑줄 친 부분을 잘못 고친 것은?","opts":["Can you help <u>we</u>? → us","<u>That</u> is July 10 today. → It","I didn’t bring <u>some</u> food today. → any","Look at <u>this</u> beautiful roses. → that","Kevin enjoyed <u>him</u> on the trip. → himself"],"ans":"Look at <u>this</u> beautiful roses. → that","full":"Look at these beautiful roses.","ko":"이 아름다운 장미들을 봐.","h":["본책 UNIT 01~03 — 보기마다 고친 말이 규칙에 맞는지 하나씩 확인해요","화살표(→) 뒤의 말이 원래 문장의 뜻과 문법에 맞는지 살펴봐요","roses(장미들)가 복수인데 고친 말이 단수예요"],"pen":"roses(복수) → these","tr":"① 너 나를 도와줄 수 있니?<br>② 오늘은 7월 10일이다.<br>③ 나는 오늘 음식을 가져오지 않았다.<br>④ 이 아름다운 장미들을 봐.<br>⑤ 케빈은 여행에서 즐거운 시간을 보냈다.","ex":["enjoy oneself = 즐거운 시간을 보내다"]});
A("RT","RT",15,"c",{"q":"다음 우리말을 영어로 바르게 옮긴 것은?<br>Henry는 자기 자신을 잘 안다.","opts":["Henry knows him well.","Henry knows his well.","Henry knows himself well.","Henry knows oneself well.","Henry knows itself well."],"ans":"Henry knows himself well.","full":"Henry knows himself well.","ko":"헨리는 자기 자신을 잘 안다.","h":["본책 UNIT 01 — 주어와 목적어가 같은 사람이면 -self 모양을 써요","주어가 Henry(헨리, 남자 한 명)이고 ‘자기 자신’을 안다는 뜻이에요","he에 맞는 -self 모양이고 h로 시작해요"],"pen":"주어 = 목적어(남자) → himself","tr":"①~⑤는 모두 ‘헨리는 자기 자신을 잘 안다.’를 영어로 옮기려는 문장이에요. 차이는 know(알다) 뒤의 대명사 모양뿐이에요.","ex":[]});
A("RT","RT",16,"w",{"q":"밑줄 친 부분을 대신하는 알맞은 대명사를 빈칸에 쓰시오.<br>I like <u>this restaurant</u> because ___ food is great.","ans":"its","full":"I like this restaurant because its food is great.","ko":"나는 이 식당이 좋다. 그곳의 음식이 훌륭하기 때문이다.","h":["본책 UNIT 01 소유격 — 명사(food) 앞에서 ‘~의’를 말해요","밑줄 친 this restaurant(이 식당)는 사물 하나예요","it의 ‘~의’ 모양이고 세 글자예요"],"pen":"사물 하나 + food 앞 → its","tr":"나는 이 식당이 좋다. ___ 음식이 훌륭하기 때문이다.","ex":["restaurant = 식당"]});
A("RT","RT",17,"w",{"q":"밑줄 친 부분을 대신하는 알맞은 대명사를 빈칸에 쓰시오.<br>Take these keys to <u>Jonathan</u>. They are ___.","ans":"his","full":"Take these keys to Jonathan. They are his.","ko":"이 열쇠들을 조나단에게 가져다줘. 그것들은 그의 것이다.","h":["본책 UNIT 01 소유대명사 — ‘~의 것’은 한 단어로 말해요","밑줄 친 Jonathan(조나단)은 남자 한 명이에요. 열쇠는 그의 것이에요","he에 맞는 ‘~의(것)’ 모양이고 세 글자예요"],"pen":"남자(Jonathan) + 뒤에 명사 없음 → his","tr":"이 열쇠들을 조나단에게 가져다줘. 그것들은 ___ 이다.","ex":[]});
A("RT","RT",18,"w",{"q":"대화가 성립되도록 ( ) 안에서 알맞은 말을 골라 쓰시오.<br>A: Hello, I’m looking for a camera. I want a cheap ⓐ (one, ones).<br>B: This black model is good.<br>A: All right. How much is ⓑ (one, it)?","ans":"one, it","full":"A: Hello, I’m looking for a camera. I want a cheap one.<br>B: This black model is good.<br>A: All right. How much is it?","ko":"A: 안녕하세요, 카메라를 찾고 있어요. 저는 싼 것을 원해요.<br>B: 이 검은색 모델이 좋아요.<br>A: 좋아요. 이것은 얼마예요?","h":["본책 UNIT 03 — one은 같은 종류의 다른 것, it은 바로 그것이에요","ⓐ는 a camera(카메라 하나) 같은 종류의 싼 것이고, ⓑ는 B가 보여 준 바로 이 모델이에요","ⓐ는 s 없는 세 글자 말, ⓑ는 두 글자 말이에요"],"pen":"ⓐ 같은 종류 단수 → one, ⓑ 바로 그것 → it","tr":"A: 안녕하세요, 카메라를 찾고 있어요. 저는 싼 ___ 원해요.<br>B: 이 검은색 모델이 좋아요.<br>A: 좋아요. ___ 얼마예요?","ex":["look for = ~을 찾다","model = 제품, 모델"]});
A("RT","RT",19,"w",{"q":"대화가 성립되도록 ( ) 안에서 알맞은 말을 골라 쓰시오.<br>A: What are you doing?<br>B: I’m baking ⓐ (any, some) cookies. ⓑ (It, They) are for Peter.","ans":"some, They","full":"A: What are you doing?<br>B: I’m baking some cookies. They are for Peter.","ko":"A: 뭐 하고 있니?<br>B: 나는 쿠키를 좀 굽고 있어. 그것들은 피터를 위한 거야.","h":["본책 UNIT 03의 some/any와 UNIT 01의 인칭대명사를 떠올려요","ⓐ는 긍정문이에요. ⓑ는 앞의 cookies(쿠키들)를 받고 뒤에 are가 있어요","ⓐ는 s로 시작하고, ⓑ는 여럿을 가리키는 대문자 T로 시작하는 말이에요"],"pen":"ⓐ 긍정문 → some, ⓑ cookies 복수 → They","tr":"A: 뭐 하고 있니?<br>B: 나는 쿠키를 ___ 굽고 있어. ___ 피터를 위한 거야.","ex":["bake = (빵·과자를) 굽다"]});
A("RT","RT",20,"w",{"q":"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>3월 25일이지만, 밖은 여전히 춥다. (March 25)<br>___, but it is still cold outside.","ans":"It’s March 25 / It is March 25","full":"It’s March 25, but it is still cold outside.","ko":"3월 25일이지만, 밖은 여전히 춥다.","h":["본책 UNIT 02 — 날짜를 말하는 문장의 주어는 it이에요","괄호 속 March 25(3월 25일)가 날짜예요","It’s나 It is로 시작하고 괄호 속 말이 뒤에 와요"],"pen":"날짜 문장 → It is + March 25","tr":"___, 하지만 밖은 여전히 춥다.","ex":["still = 여전히"]});
A("RT","RT",21,"w",{"q":"우리말과 일치하도록 ( ) 안의 말을 이용하여 문장을 완성하시오.<br>도넛을 마음껏 드세요. (help oneself to, the donuts)<br>Please ___.","ans":"help yourself to the donuts","full":"Please help yourself to the donuts.","ko":"도넛을 마음껏 드세요.","h":["본책 UNIT 01 재귀대명사 관용 표현 — ‘마음껏 드세요’를 말해요","Please로 시작하는 명령문이라 주어는 you(너)예요","help로 시작하고 oneself 자리에 you에 맞는 -self를 써요"],"pen":"명령문(you) → help yourself to","tr":"도넛을 ___.","ex":["donut = 도넛"]});
A("RT","RT",22,"w",{"q":"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>이곳에서부터 공원까지는 300m이다. (300 meters, is, from here, it)<br>___ to the park.","ans":"It is 300 meters from here","full":"It is 300 meters from here to the park.","ko":"이곳에서부터 공원까지는 300m이다.","h":["본책 UNIT 02 — 거리를 말하는 문장의 주어는 it이에요","‘~이다’는 is, 주어 → is → 거리 → 출발점 순서예요","It으로 시작하고 from here는 맨 끝에 와요"],"pen":"거리 문장 → It is + 300 meters","tr":"___ 공원까지.","ex":["meter = 미터"]});
A("RT","RT",23,"w",{"q":"우리말과 일치하도록 ( ) 안에 주어진 말을 바르게 배열하시오.<br>이 빌딩들은 매우 높다. (buildings, very, are, these, tall)<br>___.","ans":"These buildings are very tall","full":"These buildings are very tall.","ko":"이 빌딩들은 매우 높다.","h":["본책 UNIT 02 — 가까이 있는 여러 개는 these + 복수 명사예요","주어(이 빌딩들) → are → very tall 순서예요","These로 시작하고 very는 tall 바로 앞에 와요"],"pen":"These + 복수 명사 + are","tr":"우리말 문제예요. 주어진 말을 영어 순서대로 놓아 보세요.","ex":["building = 빌딩, 건물"]});
A("RT","RT",24,"w",{"q":"어법상 틀린 부분을 찾아 바르게 고치시오.<br>A: Did you write this poem yourself?<br>B: Yes. I wrote them in the English class. (1개)","ans":"wrote them → wrote it","full":"A: Did you write this poem yourself?<br>B: Yes. I wrote it in the English class.","ko":"A: 이 시를 직접 썼니?<br>B: 응. 나는 영어 수업 시간에 그것을 썼어.","h":["본책 UNIT 03 — 앞에 나온 바로 그 물건은 it으로 받아요","A가 물은 것은 this poem(이 시) 하나예요","them이 가리키는 것이 여러 개가 아니라 하나라서, 두 글자 말로 바꿔요"],"pen":"poem(하나) → them 대신 it","tr":"A: 이 시를 직접 썼니?<br>B: 응. 나는 영어 수업 시간에 그것을 썼어.","ex":["poem = 시"]});
A("RT","RT",25,"w",{"q":"어법상 틀린 부분을 찾아 바르게 고치시오.<br>A: Excuse me. Is there a bakery near here?<br>B: Yes, there is it on Oxford Road.<br>A: Thanks. Is it far?<br>B: No. It’s right around the corner. You can’t miss one. (2개)","ans":"there is it → there is one, miss one → miss it","full":"A: Excuse me. Is there a bakery near here?<br>B: Yes, there is one on Oxford Road.<br>A: Thanks. Is it far?<br>B: No. It’s right around the corner. You can’t miss it.","ko":"A: 실례합니다. 이 근처에 빵집이 있나요?<br>B: 네, 옥스퍼드 로에 하나 있어요.<br>A: 고마워요. 먼가요?<br>B: 아니요. 바로 모퉁이를 돌면 있어요. 놓칠 수 없을 거예요.","h":["본책 UNIT 03 — one은 같은 종류의 다른 하나, it은 바로 그것이에요","There is 뒤는 ‘처음 소개되는 하나’이고, can’t miss 뒤는 ‘방금 말한 바로 그 빵집’이에요","두 군데를 서로 바꾸는 문제예요. 처음 소개되는 곳과 바로 그것을 가리키는 곳을 구분해요"],"pen":"there is it → there is one, miss one → miss it","tr":"A: 실례합니다. 이 근처에 빵집이 있나요?<br>B: 네, 옥스퍼드 로에 ___ 있어요.<br>A: 고마워요. 먼가요?<br>B: 아니요. 바로 모퉁이를 돌면 있어요. ___ 놓칠 수 없을 거예요.","ex":["bakery = 빵집","around the corner = 모퉁이를 돌면 바로"]});

}

A(1,"A",1,"s",{"ins": "( ) 안에서 알맞은 말을 고르시오.", "q": "The lake looks (peace, peaceful).", "ko": "", "words": "", "ans": "peaceful", "full": "The lake looks peaceful.", "tr": "그 호수는 평화로워 보인다.", "ex": ["lake = 호수"], "h": ["본책 UNIT 01의 look 뒤 규칙을 떠올려요. look 같은 동사 뒤에는 상태를 말하는 형용사가 와요.", "보기 둘 중 하나는 명사(평화), 하나는 ‘~한’이라는 뜻의 형용사예요.", "명사 뒤에 -ful을 붙이면 ‘~이 가득한’ 형용사가 돼요. -ful이 붙은 쪽을 골라요."]});
A(1,"A",2,"s",{"ins": "( ) 안에서 알맞은 말을 고르시오.", "q": "I don’t have (many, much) time.", "ko": "", "words": "", "ans": "much", "full": "I don’t have much time.", "tr": "나는 시간이 많지 않다.", "ex": [], "h": ["본책 UNIT 01의 many와 much 구분표를 떠올려요. 셀 수 있으면 many, 못 세면 much예요.", "time(시간)은 하나, 둘 하고 셀 수 있는 물건인지 생각해 봐요.", "시간은 셀 수 없는 말이에요. m으로 시작하는 두 말 중 ‘셀 수 없는 것’ 쪽이에요."]});
