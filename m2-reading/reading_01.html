rflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

nd of Friend Are You?", "A new school year started! You can make new friends and be a good friend to others, too. What kind of friend do you want to be? Three students will tell you their stories.", "I want to be someone who is happy about my friends’ good news. Minji and I are both interested in art. When she won first prize in the school’s art competition, I felt jealous. I couldn’t congratulate her at first. But I knew she worked really hard. Finally, I congratulated her, and she was happy about it.", "I want to be a friend who gives honest advice. One of my friends was always late. People had to wait for him, and it made everyone upset. So, I decided to talk to him. “Can you please be on time?” I said. “We want to fully enjoy our time together.” Talking to my friend about this problem was not easy. But thankfully, he understood. Now he is always on time!", "I try to cheer up my friends when they are having a hard time. One day, Jisu posted, “It was a hard day,” on her social media. I wanted to do something to make her happy. So, I bought her chocolate cookies, her favorite snack. Then we watched a movie that had a funny story and took pictures together at a photo booth. We had a great time, and she said she felt better."];var PASS_KO=["당신은 어떤 종류의 친구인가요?", "새로운 학년이 시작되었습니다! 여러분은 새로운 친구를 사귀고, 다른 이들에게 좋은 친구가 될 수도 있습니다. 여러분은 어떤 종류의 친구가 되고 싶은가요? 세 학생이 여러분에게 그들의 이야기를 들려줄 겁니다.", "나는 친구의 좋은 소식에 기뻐하는 사람이 되고 싶어요. 민지와 나는 둘 다 미술에 관심이 있어요. 그녀가 학교 미술 대회에서 우승했을 때, 나는 질투가 났어요. 처음에 나는 그녀를 축하할 수 없었어요. 하지만 나는 그녀가 정말 열심히 노력한 것을 알았어요. 결국 나는 그녀를 축하해 주었고 그녀는 그것을 기뻐했어요.", "나는 솔직한 충고를 해주는 친구가 되고 싶어요. 내 친구 중 하나는 항상 늦었어요. 사람들은 그를 기다려야 했고, 그게 모두를 속상하게 만들었어요. 그래서 나는 그에게 이야기하기로 마음을 먹었어요. 나는 “시간을 지켜주겠니?”라고 말했어요. “우리는 우리의 시간을 온전히 함께 즐기고 싶어.” 이 문제에 관해 친구와 얘기하는 것은 쉽지 않았어요. 하지만 고맙게도 그는 이해했어요. 이제 그는 항상 시간을 지켜요!", "나는 친구들이 힘든 시간을 보낼 때 그들을 격려하려 노력해요. 어느 날 지수가 자신의 소셜 미디어에 “힘든 하루였다.”라고 게시했어요. 나는 그녀를 기쁘게 하기 위해 무언가를 하고 싶었어요. 그래서 나는 그녀가 제일 좋아하는 간식인 초콜릿 쿠키를 그녀에게 사주었어요. 그런 다음 우리는 재미있는 이야기로 된 영화를 보고, 사진 촬영
