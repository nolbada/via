<style>

.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}</style></head><body><div class="wrap">

<script>
var D=[{"n": 1, "tag": null, "en": "Some animals have been our friends for thousands of years.", "ko": "어떤 동물들은 수천 년 동안 우리의 친구였다.", "ok": true, "foot": [], "fixes": []}, {"n": 2, "tag": null, "en": "They have helped and protect us.", "ko": "그들은 우리를 돕고 보호해 왔다.", "ok": false, "foot": [], "fixes": [{"wrong": "protect", "right": "protected", "partial": false, "at": [4], "point": "병렬구조/현재완료: have 뒤에 이어지는 두 동사(helped, protected)의 형태를 일치시켜 protected 사용", "topic": "병렬구조/현재완료", "memo": "have 뒤에 이어지는 두 동사(helped, protected)의 형태를 일치시켜 protected 사용"}]}, {"n": 3, "tag": null, "en": "To celebrate these animal friends, people in Ireland and Nepal holds special festivals every year.", "ko": "이러한 동물 친구들을 기념하기 위해 아일랜드와 네팔의 사람들은 매년 특별한 축제를 연다.", "ok": false, "foot": [], "fixes": [{"wrong": "holds", "right": "hold", "partial": false, "at": [10], "point": "수일치: 주어 people(복수)에는 동사원형 hold 사용", "topic": "수일치", "memo": "주어 people(복수)에는 동사원형 hold 사용"}]}, {"n": 4, "tag": null, "en": "These festivals show a strongly bond between human and animals.", "ko": "이러한 축제는 인간과 동물들 간의 강한 유대를 보여 준다.", "ok": false, "foot": ["1bond 유대"], "fixes": [{"wrong": "strongly", "right": "strong", "partial": false, "at": [4], "point": "어법: 명사 bond를 수식하는 형용사 strong 사용(부사 strongly 아님)", "topic": "어법", "memo": "명사 bond를 수식하는 형용사 strong 사용(부사 strongly 아님)"}, {"wrong": "human", "right": "humans", "partial": false, "at": [7], "point": "수일치: 상호관계를 나타내는 복수형 humans 사용", "topic": "수일치", "memo": "상호관계를 나타내는 복수형 humans 사용"}]}, {"n": 5, "tag": "아일랜드 · 야생 염소 축제", "en": "Every year from August 10 to 12, people in Killorglin hold a festival to celebrate wild goats.", "ko": "매년 8월 10일부터 12일까지 킬로글린의 사람들은 야생 염소를 기리기 위해 축제를 연다.", "ok": true, "foot": [], "fixes": []}, {"n": 6, "tag": null, "en": "There is one story about the festival's begin.", "ko": "그 축제의 시작에 대한 한 가지 일화가 있다.", "ok": false, "foot": [], "fixes": [{"wrong": "begin", "right": "beginning", "partial": false, "at": [7], "point": "어휘: 소유격(festival's) 뒤에는 명사 beginning 사용(동사원형 n with this festival.", "ko": "그 이후로, 야생 염소는 킬로글린의 사람들에 의해 이 축제로 기념되어 왔다.", "ok": false, "foot": [], "fixes": [{"wrong": "have been celebrate", "right": "have been celebrated", "partial": false, "at": [4], "point": "현재완료 수동태: have been + 과거분사(celebrated) 형태 사용", "topic": "현재완료 수동태", "memo": "have been + 과거분사(celebrated) 형태 사용"}]}, {"n": 12, "tag": null, "en": "At the festival, people crown a goats showing thanks to it.", "ko": "축제에서 사람들은 염소에게 감사를 표하기 위해 왕관을 씌워 준다.", "ok": false, "foot": ["1crown (동사) 왕관을 씌우다"], "fixes": [{"wrong": "goats", "right": "goat", "partial": false, "at": [6], "point": "관사와 수일치: 부정관사 a 뒤에는 단수명사 goat 사용", "topic": "관사와 수일치", "memo": "부정관사 a 뒤에는 단수명사 goat 사용"}, {"wrong": "showing", "right": "to show", "partial": false, "at": [7], "point": "부사적 용법의 to부정사 to show 사용(동명사 아님)", "topic": "어법", "memo": "부사적 용법의 to부정사 to show 사용(동명사 아님)"}]}, {"n": 13, "tag": null, "en": "They also give it a lot of foods and taking good care of it.", "ko": "그들은 또한 염소에게 많은 먹이를 주고 잘 돌봐준다.", "ok": false, "foot": [], "fixes": [{"wrong": "foods", "right": "food", "partial": false, "at": [7], "point": "어휘: food는 불가산명사이므로 복수형 불가", "topic": "어휘", "memo": "food는 불가산명사이므로 복수형 불가"}, {"wrong": "taking", "right": "take", "partial": false, "at": [9], "point": "병렬구조: 등위접속사 and로 연결된 동사는 형태를 일치시켜 take 사용", "topic": "병렬구조", "memo": "등위접속사 and로 연결된 동사는 형태를 일치시켜 take 사용"}]}, {"n": 14, "tag": null, "en": "People then parade, dances, and sing.", "ko": "그런 다음 사람들은 퍼레이드를 하고 춤추며 노래를 부른다.", "ok": false, "foot": [], "fixes": [{"wrong": "dances", "right": "dance", "partial": false, "at": [3], "point": "병렬구조: 세 동사(parade, dance, sing)의 형태를 일치", "topic": "병렬구조", "memo": "세 동사(parade, dance, sing)의 형태를 일치"}]}, {"n": 15, "tag": "네팔 · 개 축제", "en": "People say, “Every dog has it's day.”", "ko": "사람들은 “모든 개는 자신들의 날이 있다.”라고 한다.", "ok": false, "foot": [], "fixes": [{"wrong": "it's", "right": "its", "partial": false, "at": [5], "point": "어법: 소유격 대명사 its 사용(it's는 it is의 축약형)", "topic": "어법", "memo": "소유격 대 ere is one story about the festival's beginning.", "그 축제의 시작에 대한 한 가지 일화가 있다.", 0], ["When the English army was attacking Ireland in the 17th century, they came across a group of wild goats in a field.", "17세기에 영국 군대가 아일랜드를 공격하고 있었을 때, 그들은 들판에서 야생 염소 떼와 마주쳤다.", 0], ["Most of the goats ran away to the mountains, but one goat ran toward the village.", "대부분의 염소는 산으로 도망을 갔지만 염소 한 마리는 마을 쪽으로 달렸다.", 0], ["The scared goat made the villagers realize that danger was coming.", "겁에 질린 그 염소는 마을 사람들이 위험이 다가오고 있다는 것을 깨닫게 했다.", 0], ["The goat's warning allowed the villagers to prepare and protect themselves.", "그 염소의 경고 덕분에 마을 사람들은 대비하고 자신들을 보호할 수 있었다.", 0], ["Since then, wild goats have been celebrated by people in Killorglin with this festival.", "그 이후로, 야생 염소는 킬로글린의 사람들에 의해 이 축제로 기념되어 왔다.", 0], ["At the festival, people crown a goat to show thanks to it.", "축제에서 사람들은 염소에게 감사를 표하기 위해 왕관을 씌워 준다.", 0], ["They also give it a lot of food and take good care of it.", "그들은 또한 염소에게 많은 먹이를 주고 잘 돌봐준다.", 0], ["People then parade, dance, and sing.", "그런 다음 사람들은 퍼레이드를 하고 춤추며 노래를 부른다.", 0], ["People say, “Every dog has its day.”", "사람들은 “모든 개는 자신들의 날이 있다.”라고 한다.", 0], ["In Nepal, this saying is literally true.", "네팔에서 이 격언은 문자 그대로 사실이다.", 0], ["Dogs have been an important part of Nepalese culture for hundreds of years.", "개는 수백 년 동안 네팔 문화의 중요한 일부였다.", 0], ["The Nepalese believe that dogs, which are helpers of the god of death, guide souls to heaven.", "네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다.", 0], ["Because of this belief, Nepal has a special day to celebrate dogs.", "이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다.", 0], ["This dog festival usually takes place in October or November.", "이 개 축제는 보통 10월이나 11월에 열린다.", 0], ["On this day, people give dogs flower necklaces and delicious food.", "이날 사람들은 개에게 꽃목걸이와 맛있는 먹이를 준다.", 0], ["They also put a red mark on dogs' foreheads to wish them good luck.", "그들은 또한 개에게 행운을 빌어 주기 위해 그것의 이마에 빨간색 마크를 찍는다.", 0], ["If people want to show dogs love and thanks, they even bow to them.", "심지어 그들은 개에게 사랑과 감사를 표하기 위해 고개 숙여 인사하기도 한다.", 0]];var RNUM=28;var TITLE_EN="Festivals for Our Animal Friends";var PASS_EN=["Festivals for Our Animal Friends", "Some animals have been our friends for thousands of years. They have helped and protected us. To celebrate these animal friends, people in Ireland and Nepal hold special festivals every year. These festivals show a strong bond between humans and animals.", "Every year from August 10 to 12, people in Killorglin hold a festival to celebrate wild goats. There is one story about the festival's beginning. When the English army was attacking Ireland in the 17th century, they came across a group of wild goats in a field. Most of the goats ran away to the mountains, but one goat ran toward the village. The scared goat made the villagers realize that danger was coming. The goat's warning allowed the villagers to prepare and protect themselves. Since then, wild goats have been celebrated by people in Killorglin with this festival. At the festival, people crown a goat to show thanks to it. They also give it a lot of food and take good care of it. People then parade, dance, and sing.", "People say, “Every dog has its day.” In Nepal, this saying is literally true. Dogs have been an important part of Nepalese culture for hundreds of years. The Nepalese believe that dogs, which are helpers of the god of death, guide souls to heaven. Because of this belief, Nepal has a special day to celebrate dogs. This dog festival usually takes place in October or November. On this day, people give dogs flower necklaces and delicious food. They also put a red mark on dogs' foreheads to wish them good luck. If people want to show dogs love and thanks, they even bow to them."];var PASS_KO=["우리의 동물 친구들을 위한 축제들", "어떤 동물들은 수천 년 동안 우리의 친구였다. 그들은 우리를 돕고 보호해 왔다. 이러한 동물 친구들을 기념하기 위해 아일랜드와 네팔의 사람들은 매년 특별한 축제를 연다. 이러한 축제는 인간과 동물들 간의 강한 유대를 보여 준다.", "매년 8월 10일부터 12일까지 킬로글린의 사람들은 야생 염소를 기리기 위해 축제를 연다. 그 축제의 시작에 대한 한 가지 일화가 있다. 17세기에 영국 군대가 아일랜드를 공격하고 있었을 때, 그들은 들판에서 야생 염소 떼와 마주쳤다. 대부분의 염소는 산으로 도망을 갔지만 염소 한 마리는 마을 쪽으로 달렸다. 겁에 질린 그 염소는 마을 사람들이 위험이 다가오고 있다는 것을 깨닫게 했다. 그 염소의 경고 덕분에 마을 사람들은 대비하고 자신들을 보호할 수 있었다. 그 이후로, 야생 염소는 킬로글린의 사람들에 의해 이 축제로 기념되어 왔다. 축제에서 사람들은 염소에게 감사를 표하기 위해 왕관을 씌워 준다. 그들은 또한 염소에게 많은 먹이를 주고 잘 돌봐준다. 그런 다음 사람들은 퍼레이드를 하고 춤추며 노래를 부른다.", "사람들은 “모든 개는 자신들의 날이 있다.”라고 한다. 네팔에서 이 격언은 문자 그대로 사실이다. 개는 수백 년 동안 네팔 문화의 중요한 일부였다. 네팔 사람들은 개가 죽음의 신을 도와주는 역할을 해서 영혼을 하늘로 인도한다고 믿는다. 이러한 믿음 때문에 네팔은 개를 기념하기 위해 특별한 날을 갖는다. 이 개 축제는 보통 10월이나 11월에 열린다. 이날 사람들은 개에게 꽃목걸이와 맛있는 먹이를 준다. 그들은 또한 개에게 행운을 빌어 주기 위해 그것의 이마에 빨간색 마크를 찍는다. 심지어 그들은 개에게 사랑과 감사를 표하기 위해 고개 숙여 인사하기도 한다."];var DG=[{"dlg": [["B", "Look! There will be a St. Patrick’s Day parade in town this Saturday. Have you been to the parade before?", "봐! 이번 주 토요일에 시내에서 성 패트릭의 날 퍼레이드가 있을 거래. 너 전에 그 퍼레이드에 가 본 적 있어?"], ["G", "Oh, yes. I went to the parade last year, and it was amazing.", "오, 응. 작년에 그 퍼레이드에 갔었는데, 정말 멋졌어."], ["B", "Did you do something special at the parade?", "퍼레이드에서 뭔가 특별한 걸 했니?"], ["G", "I just watched the parade last year. This year I’m going to wear a green costume, paint my face green, and walk in the parade.", "작년에는 퍼레이드를 구경만 했어. 올해는 초록색 의상을 입고, 얼굴을 초록색으로 칠하고, 퍼레이드에서 행진할 거야."], ["B", "That sounds fun! I think I should go, too.", "그거 재미있겠다! 나도 가야겠어."], ["G", "That’s nice! By the way, what’s the weather like this Saturday? Do you know?", "좋아! 그런데, 이번 주 토요일 날씨는 어때? 너 알아?"], ["B", "It’ll be rainy in the morning but sunny in the afternoon.", "오전에는 비가 오지만 오후에는 맑을 거야."], ["G", "Great! We won’t have any problem then.", "잘됐다! 그럼 아무 문제 없겠다."]], "qs": [{"n": 1, "q": "위 대화의 내용과 일치하지 않는 것은?", "o": ["성 패트릭의 날 퍼레이드는 이번 주말에 있을 예정이다.", "소녀는 작년에 퍼레이드를 보기만 했다.", "소녀는 올해 퍼레이드에 적극적으로 참여할 것이다.", "소년은 이번 퍼레이드에 갈 것이다.", "이번 주 토요일은 하루 종일 맑을 것이다."], "a": 4, "ans": "이번 주 토요일은 하루 종일 맑을 것이다.", "evs": [["B: It’ll be rainy in the morning but sunny in the afternoon.", "오전에는 비가 오지만 오후에는 맑을 거야."]], "ev": ["B: It’ll be rainy in the morning but sunny in the afterno
