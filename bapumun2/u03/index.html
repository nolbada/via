": [{"n": "①", "en": "Tom is watering the plants.", "ko": "Tom은 식물에 물을 주고 있다.", "ok": false, "why": "현재진행형이라서 지금 하는 일을 말해 맞아요."}, {"n": "②", "en": "I am waiting for my friend now.", "ko": "나는 지금 친구를 기다리고 있다.", "ok": false, "why": "now와 현재진행형이 어울려요."}, {"n": "③", "en": "He was drawing his dog tomorrow.", "ko": "그는 내일 자기 개를 그리고 있었다.", "ok": true, "why": "과거진행형과 미래를 나타내는 tomorrow가 어울리지 않아요."}, {"n": "④", "en": "The baby was sleeping an hour ago.", "ko": "아기는 한 시간 전에 자고 있었다.", "ok": false, "why": "과거진행형과 an hour ago가 어울려요."}, {"n": "⑤", "en": "Ted was studying in the library then.", "ko": "Ted는 그때 도서관에서 공부하고 있었다.", "ok": false, "why": "과거진행형과 then(그때)이 어울려요."}], "pencil": "과거진행형은 tomorrow 같은 ___ 를 나타내는 말과 안 맞는다", "pencilKey": "미래", "page": 31, "sec": "s1"}, {"id": "S1-19", "step": 1, "no": 19, "qtype": "유형 04 진행 시제의 형태와 쓰임", "type": "mc", "ans": "③", "concept": ["015", "014"], "gap": "", "words": [["watch", "보다"], ["alone", "혼자"], ["television", "텔레비전"]], "h1": "'그녀는 혼자 텔레비전을 보고 있다'는 지금 하고 있는 일이에요. 어떤 시제의 모양이 필요한지 먼저 정하세요.", "h2": "현재진행 시제의 모양은 「be동사 + 동사원형 + -ing」예요. 이 모양을 지킨 보기를 찾고, is와 does를 함께 쓴 이상한 모양은 지워 보세요.", "why": "지금 하고 있는 일이라서 현재진행 시제를 써요. She is watching TV alone.처럼 be동사 is 뒤에 watching(원형 watch 보다)을 써요.", "opts": [{"n": "①", "en": "She is watches TV alone.", "ko": "그녀는 혼자 TV를 본다.", "ok": false, "why": "is와 일반동사 watches를 함께 쓸 수 없어요."}, {"n": "②", "en": "She is watched TV alone.", "ko": "그녀는 혼자 TV를 보여졌다.", "ok": false, "why": "is 뒤에 과거형 watched를 쓰면 진행형이 아니에요."}, {"n": "③", "en": "She is watching TV alone.", "ko": "그녀는 혼자 TV를 보고 있다.", "ok": true, "why": "is + 동사원형 + -ing라서 현재진행형이에요."}, {"n": "④", "en": "She does watches TV alone.", "ko": "(does와 watches가 겹친 형태)", "ok": false, "why": "does 뒤에는 동사원형이 오는데 watches라서 틀려요."}, {"n": "⑤", "en": "She does watching TV alone.", "ko": "(does와 -ing가 겹친 형태)", "ok": false, "why": "does 뒤에는 동사원형이 와야 하고 진행형도 아니에요."}], "pencil": "현재진행 시제는 is + 동사원형 + ___", "pencilKey": "-ing", "page": 31, "sec": "s1"}, {"id": "S1-20", "step": 1 ", "ans": "(1) rains (2) moves (3) grew", "concept": ["042", "014", "009"], "gap": "변하지 않는 사실·속담은 현재 시제, 역사적 사실은 과거 시제", "words": [["rain", "비가 오다"], ["move", "움직이다"], ["grow", "기르다"], ["cabbage", "양배추"], ["go hiking", "하이킹하러 가다"]], "h1": "(1) If로 시작하는 문장, (2) 지구가 태양 주위를 도는 사실, (3) last year(작년)의 일이에요. 세 문장이 각각 어떤 시제인지 먼저 정하세요.", "h2": "조건의 if절 안에서는 미래를 현재 시제로 써요. 변하지 않는 사실은 현재 시제로, 작년의 일은 과거 시제로 써요. 주어가 3인칭 단수일 때는 -s를 붙이는 점도 확인하세요.", "why": "(1) if절은 현재 시제이고 it이 3인칭 단수라서 rains예요. (2) 변하지 않는 사실이고 The Earth가 3인칭 단수라서 moves예요. (3) 작년의 일이라서 grew(원형 grow 기르다)를 써요.", "opts": [], "pencil": "if절 안에서는 미래를 ___ 시제로 쓴다", "pencilKey": "현재", "page": 33, "sec": "s2"}, {"id": "S2-12", "step": 2, "no": 12, "qtype": "진행 시제의 형태와 쓰임", "type": "write", "ans": "were catching fish", "concept": ["015", "014"], "gap": "", "words": [["catch fish", "물고기를 잡다"], ["river", "강"]], "h1": "'아버지와 나는 낚시를 하고 있었다'는 과거에 진행 중이던 일이에요. 주어 Dad and I에 맞는 be동사의 과거형을 정하세요.", "h2": "과거진행은 「be동사의 과거형 + 동사원형 + -ing」예요. Dad and I는 두 사람이라서 단수일까요, 복수일까요?", "why": "Dad and I는 복수라서 be동사의 과거형은 were예요. 그래서 were catching fish(원형 catch 잡다)가 돼요.", "opts": [], "pencil": "과거진행 시제는 ___ + 동사원형 + -ing (주어가 복수일 때)", "pencilKey": "were", "page": 33, "sec": "s2"}, {"id": "S2-13", "step": 2, "no": 13, "qtype": "진행 시제의 형태와 쓰임", "type": "write", "ans": "wants", "concept": ["015", "014"], "gap": "진행형으로 쓰지 않는 동사(know, like, want, own 등 상태·소유·감정·인식 동사)", "words": [["travel", "여행하다"], ["around the country", "전국을"], ["want", "원하다"]], "h1": "밑줄 친 is wanting(원형 want 원하다)을 보세요. want(원하다)의 뜻이 어떤 종류인지 먼저 생각해 보세요.", "h2": "원하다, 좋아하다, 알다처럼 마음의 상태를 말하는 동사는 보통 진행형으로 쓰지 않아요. 앞 문장 Joan has a son.의 시제도 힌트예요.", "why": "want(원하다)는 감정을 나타내는 동사라서 진행형으로 쓸 수 없어요. 앞 문장처럼 현재 시제를 쓰고 주어 She가 3인칭 단수라서 wants로 고쳐요.", "opts": [], "pencil": "감정을 나타내는 동사는 ___ 으로 쓰지 않는다", "pencilKey": "진행형", "page": 33, "sec": "s2"}, {"id": "S2-14", "step": 2, "no": 14, "qtype": "진행 시제의 형태와 쓰임", "type": "write", "ans": "is repairing the bike", "concept": ["015", "014"], "gap": "", " 째가 복수 주어에 맞지 않고, 셋째는 1996년의 일이라 will start가 아니에요."}, {"n": "④", "en": "have - gets - started", "ko": "가진다 - 된다 - 시작했다", "ok": true, "why": "복수 주어에 have, it에 gets, 과거의 일에 started라서 모두 맞아요."}, {"n": "⑤", "en": "has - will get - will start", "ko": "가진다 - 될 것이다 - 시작할 것이다", "ok": false, "why": "시간의 절 안에서는 will을 쓰지 않고, 셋째도 1996년의 일이라 과거형이어야 해요."}], "pencil": "시간·조건 부사절에서는 미래를 ___ 시제로 쓴다", "pencilKey": "현재", "page": 34, "sec": "s3"}, {"id": "S3-02", "step": 3, "no": 2, "qtype": "과거, 현재, 미래 시제의 형태와 쓰임", "type": "mc", "ans": "①", "concept": ["042", "014", "012"], "gap": "가까운 미래의 확정된 일정을 현재 시제로, 예정된 계획을 현재진행형으로 나타내기", "words": [["take", "타다"], ["subway", "지하철"], ["late for school", "학교에 늦은"], ["train", "기차"]], "h1": "두 문장에서 빈칸에 같은 모양이 들어가요. 첫 문장은 정해진 기차 시간, 둘째 문장은 If가 이끄는 조건의 문장이에요. 각각 어떤 시제일지 정하세요.", "h2": "가까운 미래의 확정된 일정은 현재 시제로 쓸 수 있어요. If가 이끄는 조건의 절 안에서는 미래를 현재 시제로 써요. 두 문장 모두에서 주어가 We, you라는 점도 확인하세요.", "why": "첫 문장은 정해진 기차 시간표라서 현재형으로 미래를 나타내요. 둘째 문장은 if절 안이라서 미래도 현재형으로 써요. 주어가 We, you라서 모두 take(원형 take 타다)예요.", "opts": [{"n": "①", "en": "take", "ko": "탄다(현재형)", "ok": true, "why": "정해진 일정과 if절 모두 현재 시제를 쓰고 주어가 We, you라서 맞아요."}, {"n": "②", "en": "takes", "ko": "탄다(3인칭 단수형)", "ok": false, "why": "주어가 We, you라서 -s를 붙이지 않아요."}, {"n": "③", "en": "took", "ko": "탔다(과거형)", "ok": false, "why": "두 문장 모두 미래를 말하는 문장이라서 과거형은 안 돼요."}, {"n": "④", "en": "will take", "ko": "탈 것이다", "ok": false, "why": "if절 안에서는 will을 쓰지 않아요."}, {"n": "⑤", "en": "be going to take", "ko": "탈 것이다", "ok": false, "why": "be going to는 be동사 없이 쓸 수 없고 if절에도 쓰지 않아요."}], "pencil": "if절 안에서는 미래를 ___ 시제로 쓴다", "pencilKey": "현재", "page": 34, "sec": "s3"}, {"id": "S3-03", "step": 3, "no": 3, "qtype": "미래 시제의 다양한 표현", "type": "mc", "ans": "④", "concept": ["012", "015"], "gap": "be going to + 동사원형 (will과 같은 뜻의 미래 표현) / 현재진행형(is going to + 장소)과의 구별", "words": [["pay for", "~의 값을 치르다"], ["lost and found", "분실물 보관소"], ["main character", "주인공"], ["musical", "뮤지컬"]], "h1": "will로 바꿔 쓸 수 있는 것은 '~할 것이다'라는 미래 표현이에요. 밑줄 친 are/is going to 뒤에 무엇이 오는지 하나씩 확인하세요.", "h2": "going to 뒤에 동사원형이 오면 will과 바꿀 수 있어요. 그런데 to 뒤에 명사(장소)가 오면 '~로 가고 있다'는 뜻의 현재진행형이라서 will로 바꿀 수 없어요.", "why": "She is going to the lost and found now.는 to 뒤에 명사가 와서 '분실물 보관소에 가고 있다'는 현재진행형이에요. 그래서 will로 바꿀 수 없어요.", "opts": [{"n": "①", "en": "We are going to pay for the tickets.", "ko": "우리는 표값을 낼 것이다.", "ok": false, "why": "to 뒤에 동사원형 pay가 와서 will pay로 바꿀 수 있어요."}, {"n": "②", "en": "Janet is going to wear a white dress.", "ko": "Janet은 흰 드레스를 입을 것이다.", "ok": false, "why": "to 뒤에 동사원형 wear가 와서 will wear로 바꿀 수 있어요."}, {"n": "③", "en": "Tom is going to buy a new computer.", "ko": "Tom은 새 컴퓨터를 살 것이다.", "ok": false, "why": "to 뒤에 동사원형 buy가 와서 will buy로 바꿀 수 있어요."}, {"n": "④", "en": "She is going to the lost and found now.", "ko": "그녀는 지금 분실물 보관소에 가고 있다.", "ok": true, "why": "to 뒤에 명사가 와서 현재진행형이라 will로 바꿀 수 없어요."}, {"n": "⑤", "en": "I am going to play the main character in the musical.", "ko": "나는 뮤지컬에서 주인공을 맡을 것이다.", "ok": false, "why": "to 뒤에 동사원형 play가 와서 will play로 바꿀 수 있어요."}], "pencil": "be going to + ___ 이면 will로 바꿀 수 있다", "pencilKey": "동사원형", "page": 34, "sec": "s3"}, {"id": "S3-04", "step": 3, "no": 4, "qtype": "과거, 현재, 미래 시제의 형태와 쓰임", "type": "mc", "ans": "③", "concept": ["014", "009", "042"], "gap": "변하지 않는 사실·속담은 현재 시제, 역사적 사실은 과거 시제", "words": [["bark", "짖다"], ["bakery", "빵집"], ["land", "착륙하다"], ["hurry", "서두르다"], ["get up", "일어나다"]], "h1": "'어법상 어색한 문장'을 고르는 문제예요. 문장마다 때를 나타내는 말(last night, every day, in 1969, tomorrow morning)과 동사의 시제가 맞는지 확인하세요.", "h2": "지난 연도가 나오는 역사적인 일은 어떤 시제로 쓰는지 떠올려 보세요. If가 이끄는 절의 동사 모양도 함께 확인하세요.", "why": "in 1969는 지난 해이고 달 착륙은 역사적 사실이라서 과거형을 써요. lands(원형 land 착륙하다)는 landed로 고쳐야 해요.", "opts": [{"n": "①", "en": "Why did your dog bark last night?", "ko": "네 개는 어젯밤 왜 짖었니?", "ok": false, "why": "last night과 did bark(과거)가 어울려서 맞아요."}, {"n": "②", "en": "The bakery opens at 7:30 every day.", "ko": "그 빵집은 매일 7시 30분에 문을 연다.", "ok": false, "why": "every day가 있는 반복되는 일이라 현재형이 맞아요."}, {"n": "③", "en": "Armstrong lands on the moon in 1969.", "ko": "Armstrong은 1969년에 달에 착륙한다.", "ok": true, "why": "1969년은 지난 때라서 lands가 아니라 landed여야 해요."}, {"n": "④", "en": "If you hurry, you'll get there on time.", "ko": "서두르면 제시간에 도착할 것이다.", "ok": false, "why": "if절은 현재형, 주절은 will로 맞아요."}, {"n": "⑤", "en": "Mina will get up early tomorrow morning.", "ko": "Mina는 내일 아침 일찍 일어날 것이다.", "ok": false, "why": "tomorrow morning과 will이 어울려서 맞아요."}], "pencil": "역사적 사실은 ___ 시제로 쓴다", "pencilKey": "과거", "page": 34, "sec": "s3"}, {"id": "S3-05", "step": 3, "no": 5, "qtype": "진행 시제의 형태와 쓰임", "type": "mc", "ans": "⑤", "concept": ["015", "014"], "gap": "", "words": [["drone", "드론"], ["feed", "먹이를 주다"], ["enjoy", "즐기다"], ["exercise", "운동하다"], ["gym", "체육관"]], "h1": "문장마다 진행형(am/is/are/was + -ing)과 now, then 같은 때를 나타내는 말이 어울리는지 확인하세요.", "h2": "now는 지금이라서 현재진행, then은 그때라서 과거진행이 어울려요. 때를 나타내는 말과 be동사의 시제가 맞지 않는 문장을 찾으세요.", "why": "then(그때)은 지난 때를 말해서 과거진행형 was exercising(원형 exercise 운동하다)이 어울려요. is exercising은 시제가 맞지 않아요.", "opts": [{"n": "①", "en": "I am looking at the drone now.", "ko": "나는 지금 드론을 보고 있다.", "ok": false, "why": "now와 현재진행형이 어울려서 맞아요."}, {"n": "②", "en": "Jessica wasn't feeding the dogs.", "ko": "Jessica는 개들에게 먹이를 주고 있지 않았다.", "ok": false, "why": "과거진행 부정문이라서 맞아요."}, {"n": "③", "en": "They are enjoying the rock festival.", "ko": "그들은 록 페스티벌을 즐기고 있다.", "ok": false, "why": "현재진행형이라서 맞아요."}, {"n": "④", "en": "The boy is having a hamburger now.", "ko": "그 소년은 지금 햄버거를 먹고 있다.", "ok": false, "why": "have가 '먹다'일 때는 진행형이 가능하고 now와 어울려요."}, {"n": "⑤", "en": "My uncle is exercising in the gym then.", "ko": "우리 삼촌은 그때 체육관에서 운동하고 있다.", "ok": true, "why": "then은 과거인데 현재진행형이라 어색해요. was exercising이어야 해요."}], "pencil": "then(그때)이 있으면 진행형은 ___ + 동사원형 + -ing", "pencilKey": "was/were", "page": 34, "sec": "s3"}, {"id": "S3-06", "step": 3, "no": 6, "qtype": "진행 시제의 형태와 쓰임", "type": "mc", "ans": "④, ⑤", "concept": ["015", "014", "041"], "gap": "진행형으로 쓰지 않는 동사(know, like, want, own 등 상태·소유·감정·인식 동사)", "words": [["study", "공부하다"], ["climb up", "올라가다"], ["schedule", "일정"], ["do the dishes", "설거지를 하다"], ["sleep", "자다"]], "h1": "'어색한 것을 모두 고르면'이라서 답이 두 개예요. 진행형으로 쓰기에 맞지 않는 동사가 있는 문장, 그리고 두 절의 시제가 맞지 않는 문장을 찾아보세요.", "h2": "know(알다)처럼 마음의 상태를 말하는 동사는 진행형으로 쓰지 않아요. 또 while이 이끄는 절에 과거진행이 쓰였다면 주절의 시제도 맞춰야 해요.", "why": "④ know(알다)는 인식을 나타내는 동사라서 진행형이 안 되고 knows가 맞아요. ⑤ while 절에 과거진행 was sleeping이 있으므로 주절도 과거형 did로 써야 해요.", "opts": [{"n": "①", "en": "He is studying for the exam.", "ko": "그는 시험 공부를 하고 있다.", "ok": false, "why": "동작을 나타내는 동사의 현재진행형이라서 맞아요."}, {"n": "②", "en": "Jim wasn't waiting for the bus.", "ko": "Jim은 버스를 기다리고 있지 않았다.", "ok": false, "why": "과거진행 부정문이라서 맞아요."}, {"n": "③", "en": "A bear is climbing up the tree.", "ko": "곰 한 마리가 나무를 올라가고 있다.", "ok": false, "why": "동작을 나타내는 동사의 현재진행형이라서 맞아요."}, {"n": "④", "en": "The manager is knowing her schedule.", "ko": "그 관리자는 자기 일정을 알고 있다.", "ok": true, "why": "know는 인식을 나타내는 동사라서 진행형으로 쓸 수 없어요. 어색해요."}, {"n": "⑤", "en": "I do the dishes while he was sleeping.", "ko": "나는 그가 자고 있는 동안 설거지를 한다.", "ok": true, "why": "while 절이 과거진행이라서 주절도 과거형 did여야 해요. 어색해요."}], "pencil": "know 같은 인식 동사는 ___ 으로 쓰지 않는다", "pencilKey": "진행형", "page": 34, "sec": "s3"}, {"id": "S3-07", "step": 3, "no": 7, "qtype": "진행 시제의 형태와 쓰임", "type": "mc", "ans": "④", "concept": ["015", "014"], "gap": "", "words": [["text message", "문자 메시지"], ["send", "보내다"], ["check", "확인하다"], ["email", "이메일"]], "h1": "A가 Were you sending ... then?(그때 문자를 보내고 있었니?)이라고 물었어요. 어떤 시제로 물었는지 보고 B의 대답을 맞춰 보세요.", "h2": "과거진행(was/were + -ing)으로 물었으면 대답도 같은 시제로 해요. No, I wasn't.와 이어지는 문장이라는 점도 확인하세요.", "why": "과거진행으로 물었으니 대답도 was checking(원형 check 확인하다)으로 해요. 그래서 'I was checking my emails.'가 돼요.", "opts": [{"n": "①", "en": "check", "ko": "확인한다(원형)", "ok": false, "why": "시제가 맞지 않고 대화 흐름도 어색해요."}, {"n": "②", "en": "checked", "ko": "확인했다(과거형)", "ok": false, "why": "'~하고 있었다'라는 진행의 뜻이 없어요."}, {"n": "③", "en": "am checking", "ko": "확인하고 있다", "ok": false, "why": "현재진행형이라서 과거에 하고 있던 일을 말할 수 없어요."}, {"n": "    h+='<div class="lab">내 답은?</div><div class="nav"><button class="btn s" onclick="selfW(\''+d.id+'\',true)">맞았어요</button><button class="btn g" onclick="selfW(\''+d.id+'\',false)">다시 볼래요</button></div>';
  }else{
   h+='<div class="res '+(r.right?'ok':'ng')+'">'+(r.right?'잘했어요':'정답과 비교해서 고쳐 써 보세요')+'</div>';
  }
 }
 if(d.pencil){
  h+='<div class="pen"><div class="ph">'+PEN+'핵심 한 줄 · 책 문제 아래 공백에 쓰세요</div><div class="pt">'+esc(d.pencil).replace("___",'<span class="bl'+(r.pen?' show':'')+'">'+esc(d.pencilKey||"")+'</span>')+'</div>'+(r.pen?'':'<button class="btn s" onclick="penDone(\''+d.id+'\')">책에 썼어요</button>')+'</div>';
 }
 if(d.concept&&d.concept.length){h+='<div class="cn">'+d.concept.map(function(c){return '<a href="'+cockLink(c)+'">개념 다시 보기 · '+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>'}
 var hu=r.h||0;h+='<div class="meter">'+(hu===0?'힌트 없이 풀었어요':(hu===1?'먼저 볼 것으로 풀었어요':'한 걸음 더까지 보고 풀었어요'))+'</div>';
 return h;
}
function summary(){
 var its=items(st.tab),n=its.length,done=its.filter(function(d){return rec(d.id).done}).length;
 var ok=its.filter(function(d){return rec(d.id).done&&rec(d.id).right}).length;
 var pct=n?Math.round(ok/n*100):0;
 var h='<div class="card sum"><h2>'+esc(STEPS[st.tab].name)+' 결과</h2>';
 h+='<div class="srow">푼 문제<span>'+done+' / '+n+'</span></div><div class="srow">맞힌 문제<span>'+ok+' / '+n+' ('+pct+'%)</span></div>';
 var wrong=its.filter(function(d){var r=rec(d.id);return r.done&&!r.right});
 if(done===n&&pct<80){
  var cs={};wrong.forEach(function(d){(d.concept||[]).forEach(function(c){cs[c]=1})});
  h+='<div class="warn">80%가 안 됐어요. 틀린 문제의 개념을 먼저 읽고, 핵심 한 줄을 다시 써 보세요.';
  var ks=Object.keys(cs);if(ks.length)h+='<div class="cn">'+ks.map(function(c){return '<a href="'+cockLink(c)+'">'+esc(CONCEPT_NAMES[c]||c)+'</a>'}).join("")+'</div>';
  h+='</div>';
  if(wrong.length)h+='<div class="nums" style="margin-top:12px">'+wrong.map(function(d){return '<button class="nb ng" onclick="goIdx('+(its.indexOf(d))+')">'+d.no+'</button>'}).join("")+'</div>';
 }else if(done===n){h+='<div class="res ok" style="margin-top:14px">'+esc(STEPS[st.tab].name)+' 완료</div>'}
 else{h+='<div class="note">아직 안 푼 문제가 있어요. 위 번호에서 이어서 풀어요.</div>'}
 if(st.tab<STEPS.length-1)h+='<button class="btn p" onclick="goTab('+(st.tab+1)+')">다음 단계로</button>';
 h+='</div>';return h;
}
ld();render();
</script></body></html>
