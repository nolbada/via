 이들을 해쳤다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"arise","a":"1,4","e":"① occur: 발생하다\n④ happen: 일어나다 (큰 프로젝트가 시작되면 새로운 문제들이 항상 발생한다.) / arise(발생하다, 생기다)의 유의어.","w":"② fade: 희미해지다, 사라지다\n③ diminish: 줄어들다, 약해지다","k":"큰 프로젝트가 시작되면 새로운 문제들이 항상 발생한다.","m":2,"s":"New problems always arise when a big project starts.","h":"arise","c":["occur","fade","diminish","happen"],"mn":"발생하다, 생기다","hk":"arise(발생하다)는 occur(발생하다), happen(일어나다)과 같은 편. fade(희미해지다), diminish(줄어들다)는 사라지는 반대 방향 속임수","ex":[["Problems may [[arise]] at any time.","문제는 언제든 [[생길]] 수 있다."],["A new [[question arose]] in class.","수업 중에 새로운 [[질문이 생겼다]]."],["If any trouble [[arises]], call me.","문제가 [[생기면]] 내게 전화해."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"diagnose","a":"4","e":"④ diagnose: 진단하다 (의사가 그 희귀한 질병을 진단하기까지 여러 차례의 검사가 필요했다.)","w":"① examine: 검사하다, 진찰하다\n② cure: 치료하다\n③ prescribe: 처방하다","k":"의사가 그 희귀한 질병을 진단하기까지 여러 차례의 검사가 필요했다.","m":0,"s":"It took several tests before the doctor could ________ the rare disease.","c":["examine","cure","prescribe","diagnose"],"mn":"진단하다","hk":"diagnose a disease(병을 진단하다)로 기억. cure(치료하다)와 prescribe(처방하다)는 진단 다음 단계, examine(검사하다)은 진단 전 살피기라 속임수","ex":[["Doctors can [[diagnose]] the problem quickly.","의사들은 문제를 빠르게 [[진단할]] 수 있다."],["He was [[diagnosed with]] a cold.","그는 감기 [[진단을 받았다]]."],["It is hard to [[diagnose a disease]] early.","병을 일찍 [[진단하기는]] 어렵다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"temple","a":"temple","e":"temple 사원, 절","k":"수백 명의 방문객이 언덕 위의 고대 사원에 이르기 위해 돌계단을 올랐다.","m":0,"s":"Hundreds of visitors climbed the stone steps to reach the ancient t______ on the hill.","mn":"사원, 절","hk":"temple(사원, 절)은 simple(간단한)처럼 자음 뒤에 le로 끝나는 철자. Buddhist temple(불교 사원)으로 묶어 기억","ex":[["We visited an old [[temple]] in Kyoto.","우리는 교토의 오래된 [[절]]을 방문했다."],["Monks pray at the [[Buddhist temple]].","승려들은 [[불교 사원]]에서 기도한다."],["They saw a [[stone temple]] on the hill.","그들은 언덕 위에서 [[돌 사원]]을 보았다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"significant","a":"3","e":"③ insignificant: 중요하지 않은, 사소한 (그 새로운 약은 환자들의 상태에 상당한 차이를 만들었다.) / significant(중요한, 의미 있는)의 반의어.","w":"① striking: 두드러진, 인상적인\n② remarkable: 주목할 만한\n④ notable: 눈에 띄는, 유명한","k":"그 새로운 약은 환자들의 상태에 상당한 차이를 만들었다.","m":0,"s":"The new medicine made a significant difference in the patients' condition.","h":"significant","c":["striking","remarkable","insignificant","notable"],"mn":"중요한, 의미 있는","hk":"significant(중요한)에 부정 접두사 in(아닌)을 붙이면 insignificant(중요하지 않은). striking(두드러진), remarkable(주목할 만한)은 같은 편 속임수","ex":[["There was a [[significant change]] in prices.","가격에 [[중요한 변화]]가 있었다.","significant (형) 중요한, 의미 있는"],["The cost is [[insignificant]].","그 비용은 [[사소하다]].","insignificant (형) 중요하지 않은, 사소한"],["It was an [[insignificant]] mistake.","그것은 [[대수롭지 않은]] 실수였다.","insignificant (형) 중요하지 않은, 사소한"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"transparent","a":"4","e":"④ transparent: 투명한, 비치는","w":"① harsh: 거친, 가혹한\n② dense: 빽빽한, 밀집한\n③ showy: 화려한, 눈에 띄는","m":0,"s":"transparent","c":["거친, 가혹한","빽빽한, 밀집한","화려한, 눈에 띄는","투명한, 비치는"],"mn":"투명한, 비치는","hk":"transparent(투명한)는 trans(통과해서) 보인다는 뜻의 뿌리를 가진 말. dense(빽빽한)는 반대 느낌, harsh(거친), showy(화려한)도 비치는 뜻이 아님","ex":[["The glass is clear and [[transparent]].","그 유리는 맑고 [[투명하다]]."],["She wore a [[transparent raincoat]].","그녀는 [[투명한 비옷]]을 입었다."],["Use [[transparent tape]] for this.","이것에는 [[투명 테이프]]를 써라."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"category","a":"3","e":"category (명) 범주, 부류 - categorize (동) 분류하다\n③ memory (명) 기억, 기억력 - memorize (동) 암기하다\n※ ①②④는 모두 형용사→동사이고, 제시어처럼 명사→동사인 것은 ③뿐이다.","w":"① popular (형) 인기 있는 - popularize (동) 대중화하다\n② central (형) 중심의 - centralize (동) 중앙으로 집중시키다\n④ equal (형) 평등한 - equalize (동) 평등하게 하다","m":0,"s":"category - categorize","c":["popular - popularize","central - centralize","memory - memorize","equal - equalize"],"mn":"범주, 부류","hk":"제시어는 명사에서 동사. category(범주)-categorize(분류하다)처럼 memory(기억)-memorize(암기하다)가 같은 방향이고, 나머지는 형용사에서 동사","ex":[["Books are sorted by [[category]].","책은 [[범주]]별로 정리된다.","category (명) 범주, 부류"],["Please [[categorize]] these photos.","이 사진들을 [[분류해]] 주세요.","categorize (동) 분류하다"],["She has a good [[memory]].","그녀는 [[기억력]]이 좋다.","memory (명) 기억, 기억력"],["I must [[memorize]] ten words.","나는 단어 열 개를 [[암기해야]] 한다.","memorize (동) 암기하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"exhibit","a":"4","e":"④ exhibit: (물건들을 공공장소에 놓아두다 / 사람들이 그것들을 볼 수 있도록) 전시하다","w":"① discard: 버리다, 폐기하다\n② conceal: 숨기다, 감추다\n③ auction: 경매로 팔다","k":"물건들을 공공장소에 놓아두다 / 사람들이 그것들을 볼 수 있도록","m":0,"s":"\"to put objects in a public place so that people can look at them\"","c":["discard","conceal","auction","exhibit"],"mn":"전시하다","hk":"exhibit(전시하다)는 밖에 내놓아 보여 주는 동작, exhibition(전시회)과 한 가족. conceal(숨기다)은 반대편, discard(버리다), auction(경매로 팔다)은 속임수","ex":[["The museum will [[exhibit]] new paintings.","박물관은 새 그림들을 [[전시할]] 것이다."],["Her photos were [[exhibited at]] the gallery.","그녀의 사진은 미술관에 [[전시되었다]]."],["Artists [[exhibit]] their work every spring.","예술가들은 매년 봄 작품을 [[전시한다]]."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"novel","a":"novel","e":"novel (형) 참신한, 새로운 / (명) 소설","k":"그 회사는 플라스틱 폐기물을 연료로 바꾸는 참신한 방법을 생각해 냈다.\n그 교수는 18세기를 배경으로 한 역사 소설을 쓰는 데 10년을 보냈다.","m":0,"s":"The company came up with a n______ way of turning plastic waste into fuel.\nThe professor spent ten years writing a historical n______ set in the 18th century.","mn":"참신한, 새로운 / 소설","hk":"novel(참신한, 소설)은 new(새로운)와 같은 뿌리. a novel way(참신한 방법)와 a historical novel(역사 소설)로 구분","ex":[["She found a [[novel way]] to learn words.","그녀는 단어를 배우는 [[참신한 방법]]을 찾았다.","novel (형) 참신한, 새로운"],["That is a [[novel idea]].","그것은 [[참신한 아이디어]]이다.","novel (형) 참신한, 새로운"],["He is reading a long [[novel]].","그는 긴 [[소설]]을 읽고 있다.","novel (명) 소설"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"avoid","a":"4","e":"④ face: 직면하다, 맞서다 (그는 화제를 바꿈으로써 그 어려운 질문을 피하려고 했다.) / avoid(피하다, 회피하다)의 반의어.","w":"① evade: 회피하다, 모면하다\n② postpone: 미루다, 연기하다\n③ dodge: 피하다, 슬쩍 비키다","k":"그는 화제를 바꿈으로써 그 어려운 질문을 피하려고 했다.","m":0,"s":"He tried to avoid the difficult question by changing the subject.","h":"avoid","c":["evade","postpone","dodge","face"],"mn":"피하다, 회피하다","hk":"avoid(피하다)의 반대는 face(직면하다). evade(회피하다), dodge(피하다)는 같은 편, postpone(미루다)도 피하는 쪽이라 속임수","ex":[["Try to [[avoid]] sugary drinks.","단 음료를 [[피하려고]] 해라.","avoid (동) 피하다, 회피하다"],["You must [[face]] your fear.","너는 두려움에 [[맞서야]] 한다.","face (동) 직면하다, 맞서다"],["She [[faced]] the problem bravely.","그녀는 그 문제에 용감하게 [[맞섰다]].","face (동) 직면하다, 맞서다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"polish","a":"3","e":"③ polish: 닦다, 윤을 내다 (그는 가죽 구두가 거울처럼 빛날 때까지 광을 내야 했다.)","w":"① wipe: 닦아 내다\n② sweep: 쓸다, 청소하다\n④ scrub: 문질러 닦다","k":"그는 가죽 구두가 거울처럼 빛날 때까지 광을 내야 했다.","m":0,"s":"He had to ________ his leather shoes until they shone like a mirror.","c":["wipe","sweep","polish","scrub"],"mn":"닦다, 윤을 내다","hk":"polish shoes(구두를 닦다)처럼 반짝이게 광을 냄. wipe(닦아 내다)와 scrub(문질러 닦다)은 깨끗이 하는 동작, sweep(쓸다)은 빗자루질","ex":[["He [[polishes his shoes]] every morning.","그는 매일 아침 [[구두를 닦는다]]."],["She [[polished]] the silver spoons.","그녀는 은수저를 [[윤이 나게 닦았다]]."],["[[Polish]] the table until it shines.","탁자가 빛날 때까지 [[윤을 내라]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"intelligence","a":"2","e":"② intellect: 지성, 지력 (그 검사는 지식보다는 아이의 지능을 측정하도록 고안되었다.) / intelligence(지능, 지성)의 유의어.","w":"① emotion: 감정\n③ patience: 인내심\n④ curiosity: 호기심","k":"그 검사는 지식보다는 아이의 지능을 측정하도록 고안되었다.","m":0,"s":"The test is designed to measure a child's intelligence rather than knowledge.","h":"intelligence","c":["emotion","intellect","patience","curiosity"],"mn":"지능, 지성","hk":"intelligence(지능)는 intellect(지성)와 같은 편. emotion(감정), patience(인내심), curiosity(호기심)는 머리 쓰는 힘이 아닌 속임수","ex":[["She has [[high intelligence]].","그녀는 [[높은 지능]]을 가졌다."],["Robots use [[artificial intelligence]].","로봇은 [[인공지능]]을 사용한다."],["Crows show [[great intelligence]].","까마귀는 [[뛰어난 지능]]을 보인다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"coast","a":"2","e":"② coast: (바다와 맞닿아 있는 땅) 해안, 연안","w":"① valley: 계곡, 골짜기\n③ slope: 경사지, 비탈\n④ cave: 동굴","k":"바다와 맞닿아 있는 땅","m":0,"s":"\"the land that lies next to the sea\"","c":["valley","coast","slope","cave"],"mn":"해안, 연안","hk":"coast(해안)는 바다와 맞닿은 땅. valley(계곡), slope(비탈), cave(동굴)는 바다와 상관없는 지형","ex":[["They live on the [[east coast]].","그들은 [[동쪽 해안]]에 산다."],["We drove [[along the coast]].","우리는 [[해안을 따라]] 운전했다."],["The [[coast guard]] saved the sailors.","[[해안 경비대]]가 선원들을 구했다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"republic","a":"republic","e":"republic 공화국","k":"수년간의 투쟁 끝에 그 식민지는 마침내 자체 대통령을 가진 독립 공화국이 되었다.","m":0,"s":"After years of struggle, the colony finally became an independent r______ with its own president.","mn":"공화국","hk":"republic(공화국)은 re와 public(공공의)이 붙은 철자. 라틴어 '공공의 일'에서 온 말로, 나라가 국민 모두의 것이라는 뜻","ex":[["The colony became an [[independent republic]].","그 식민지는 [[독립 공화국]]이 되었다."],["The [[Republic of Korea]] is my country.","[[대한민국]]은 나의 조국이다."],["The country [[became a republic]] in 1900.","그 나라는 1900년에 [[공화국이 되었다]]."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"grounds","a":"1","e":"①근거, 이유 / ②땅바닥, 지면 / ③땅바닥, 지면 / ④땅바닥, 지면 [①번만 의미가 다름]","k":"①그 판사는 그런 결정을 내릴 법적 근거가 없었다.\n②폭설이 겨우내 땅을 뒤덮었다.\n③아이들은 비가 온 뒤 젖은 땅에 앉았다.\n④공이 그의 다리를 맞혔을 때 그는 땅바닥에 쓰러졌다.","m":0,"c":["The judge had no legal grounds for such a decision.","Heavy snow covered the ground all winter long.","The children sat on the wet ground after the rain.","He fell to the ground when the ball hit his leg."],"hc":"grounds|ground|ground|ground","mn":"땅바닥, 지면 / 근거, 이유","hk":"grounds(근거, 이유)는 legal grounds(법적 근거)처럼 이유를 뜻함. 나머지는 발이 닿는 ground(땅바닥)라 ①번만 다름","ex":[["They had no [[legal grounds]] to stop us.","그들에게는 우리를 막을 [[법적 근거]]가 없었다.","grounds (명) 근거, 이유"],["She left [[on the grounds of]] illness.","그녀는 병을 [[이유로]] 떠났다.","grounds (명) 근거, 이유"],["The ball rolled on the [[ground]].","공이 [[땅바닥]]에서 굴러갔다.","ground (명) 땅바닥, 지면"]]}]},{"day":25,"q":[{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"light","a":"light","e":"light (명) 빛, 신호등 / (형) 가벼운","k":"그 작은 기름 램프에서 나오는 빛은 누구든 책을 읽기에는 너무 약했다.\n그 캠핑 텐트는 너무 가벼워서 아이가 혼자 언덕 위로 옮길 수 있었다.","m":0,"s":"The l______ from the tiny oil lamp was too weak for anyone to read by.\nThe camping tent was so l______ that a child could carry it up the hill alone.","mn":"빛, 신호등 / 가벼운","hk":"light(빛, 가벼운)는 명사일 땐 빛, 형용사일 땐 가벼운. 형용사 뜻의 반대편은 heavy(무거운)","ex":[["The room needs more [[light]].","그 방은 더 많은 [[빛]]이 필요하다.","light (명) 빛, 신호등"],["Stop at the red [[light]].","빨간 [[신호등]]에서 멈춰라.","light (명) 빛, 신호등"],["This bag is [[light]].","이 가방은 [[가볍다]].","light (형) 가벼운"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"mechanism","a":"4","e":"④ mechanism: 기계 장치, 메커니즘","w":"① material: 재료, 원료\n② purpose: 목적, 의도\n③ device: 장비, 기기","m":0,"s":"mechanism","c":["재료, 원료","목적, 의도","장비, 기기","기계 장치, 메커니즘"],"mn":"기계 장치, 메커니즘","hk":"mechanism(기계 장치)은 machine(기계)과 같은 뿌리. locking mechanism(잠금 장치)처럼 쓰임. material(재료), purpose(목적)는 다른 뜻","ex":[["The door has a [[locking mechanism]].","문에는 [[잠금 장치]]가 있다."],["Pull the lever to start the [[mechanism]].","그 [[장치]]를 작동시키려면 레버를 당겨라."],["A [[safety mechanism]] stopped the machine.","[[안전 장치]]가 기계를 멈췄다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"active","a":"2","e":"② lively: 활기찬, 활발한 (내 할아버지는 여든이시지만, 여전히 대부분의 젊은 사람들보다 더 활동적이시다.) / active(활동적인, 활발한)의 유의어.","w":"① gentle: 온화한, 부드러운\n③ patient: 참을성 있는\n④ nervous: 초조한, 불안해하는","k":"내 할아버지는 여든이시지만, 여전히 대부분의 젊은 사람들보다 더 활동적이시다.","m":0,"s":"My grandfather is eighty, but he is still more active than most young people.","h":"active","c":["gentle","lively","patient","nervous"],"mn":"활동적인, 활발한","hk":"active(활동적인)는 act(행동하다)와 같은 뿌리로 lively(활기찬)와 같은 편. gentle(온화한), patient(참을성 있는), nervous(초조한)는 활발함과 거리가 먼 성격","ex":[["He stays [[active]] by running.","그는 달리기로 [[활동적으로]] 지낸다."],["She is an [[active member]] of the club.","그녀는 그 동아리의 [[활발한 회원]]이다."],["Kids are [[very active]] after lunch.","아이들은 점심 후에 [[매우 활발하다]]."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"frequent","a":"3","e":"③ frequent: 잦은, 빈번한 (연습에 자주 빠졌기 때문에, 감독은 그를 팀에서 제외했다.)","w":"① rare: 드문, 희귀한\n② brief: 짧은, 잠시의\n④ occasional: 가끔의, 이따금의","k":"연습에 자주 빠졌기 때문에, 감독은 그를 팀에서 제외했다.","m":0,"s":"Because of his ________ absences from practice, the coach dropped him from the team.","c":["rare","brief","frequent","occasional"],"mn":"잦은, 빈번한","hk":"frequent absences(잦은 결석)로 기억. rare(드문), occasional(가끔의)은 횟수가 적은 반대편 속임수, brief(짧은)는 길이 이야기","ex":[["He makes [[frequent mistakes]].","그는 [[잦은 실수]]를 한다."],["Rain is [[frequent]] in June.","6월에는 비가 [[잦다]]."],["She is a [[frequent visitor]] here.","그녀는 이곳에 [[자주 오는 방문객]]이다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"tradition","a":"tradition","e":"tradition 전통","k":"설날에 떡을 만드는 것은 가족들이 오늘날까지도 지키는 오래된 한국의 전통이다.","m":0,"s":"Making rice cake on New Year's Day is an old Korean t______ that families still keep today.","mn":"전통","hk":"tradition(전통)은 traditional(전통적인)의 뿌리 단어이고 끝은 tion 철자. keep a tradition(전통을 지키다)으로 묶어 기억","ex":[["Families [[keep this tradition]] every year.","가족들은 해마다 이 [[전통을 지킨다]]."],["It is a [[family tradition]].","그것은 [[가족 전통]]이다."],["Korea has a [[long tradition]] of kimchi making.","한국에는 김치 담그는 [[오랜 전통]]이 있다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"bold","a":"3","e":"bold (형) 대담한, 용감한 - boldness (명) 대담함\n③ enthusiastic (형) 열정적인 - enthusiasm (명) 열정","w":"① encourage (동) 격려하다, 부추기다 - encouragement (명) 격려, 응원\n② exist (동) 존재하다, 살아가다 - existence (명) 존재\n④ announce (동) 알리다, 발표하다 - announcement (명) 발표, 안내","m":0,"s":"bold - boldness","c":["encourage - encouragement","exist - existence","enthusiastic - enthusiasm","announce - announcement"],"mn":"대담한, 용감한","hk":"제시어는 형용사에서 명사. bold(대담한)-boldness(대담함)처럼 enthusiastic(열정적인)-enthusiasm(열정)이 같은 방향이고, 나머지는 동사에서 명사","ex":[["She made a [[bold move]].","그녀는 [[대담한 행동]]을 했다.","bold (형) 대담한, 용감한"],["His [[boldness]] surprised us.","그의 [[대담함]]이 우리를 놀라게 했다.","boldness (명) 대담함"],["The fans were [[enthusiastic]].","팬들은 [[열정적이었다]].","enthusiastic (형) 열정적인"],["She spoke with great [[enthusiasm]].","그녀는 큰 [[열정]]으로 말했다.","enthusiasm (명) 열정"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"public","a":"3","e":"③ private: 사적인, 개인의 (누구나 여기서 수영할 수 있는데, 그곳이 공공 해변이기 때문이다.) / public(공적인, 공공의)의 반의어.","w":"① social: 사회의, 사교적인\n② common: 공동의, 흔한\n④ open: 열린, 공개된","k":"누구나 여기서 수영할 수 있는데, 그곳이 공공 해변이기 때문이다.","m":0,"s":"Anyone may swim here because it is a public beach.","h":"public","c":["social","common","private","open"],"mn":"공적인, 공공의","hk":"public(공적인)의 반대는 private(사적인), 사적인 해변은 private beach(개인 해변). social(사회의), common(흔한), open(열린)은 같은 편 속임수","ex":[["The library is a [[public place]].","도서관은 [[공공장소]]이다.","public (형) 공적인, 공공의"],["This is a [[private beach]].","여기는 [[개인 해변]]이다.","private (형) 사적인, 개인의"],["Please respect my [[private life]].","내 [[사생활]]을 존중해 주세요.","private (형) 사적인, 개인의"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"decade","a":"3","e":"③ decade: (십 년의 기간) 10년","w":"① generation: 세대\n② century: 세기, 100년\n④ era: 시대, 시기","m":0,"s":"\"a period of ten years\"","c":["generation","century","decade","era"],"mn":"10년","hk":"decade(10년)는 열을 뜻하는 뿌리를 가진 말. century(세기, 100년)와 헷갈리지 말고, generation(세대)과 era(시대)는 정해진 햇수가 없음","ex":[["He lived there for a [[decade]].","그는 그곳에서 [[십 년]] 동안 살았다."],["Prices rose over the [[last decade]].","물가가 [[지난 십 년]] 동안 올랐다."],["It happened [[decades ago]].","그것은 [[수십 년 전에]] 일어났다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"decrease","a":"2","e":"② increase: 늘어나다, 증가하다 (축제가 끝나자마자 방문객 수가 줄어들기 시작했다.) / decrease(감소하다, 줄다)의 반의어.","w":"① reduce: 줄이다, 낮추다\n③ shrink: 줄어들다, 오그라들다\n④ fall: 떨어지다, 감소하다","k":"축제가 끝나자마자 방문객 수가 줄어들기 시작했다.","m":0,"s":"The number of visitors began to decrease as soon as the festival ended.","h":"decrease","c":["reduce","increase","shrink","fall"],"mn":"감소하다, 줄다","hk":"decrease(감소하다)의 반대는 increase(증가하다), 앞 글자만 다른 짝. reduce(줄이다), shrink(줄어들다), fall(떨어지다)은 같은 편 속임수","ex":[["The price will [[decrease]] soon.","가격이 곧 [[감소할]] 것이다.","decrease (동) 감소하다, 줄다"],["The number of cars will [[increase]].","자동차 수가 [[늘어날]] 것이다.","increase (동) 늘어나다, 증가하다"],["Exercise can [[increase]] your energy.","운동은 네 에너지를 [[늘릴]] 수 있다.","increase (동) 늘어나다, 증가하다"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"flexible","a":"2","e":"② flexible: 유연한, 잘 구부러지는 (고무는 유연한 재료여서, 부러지지 않고 쉽게 구부러진다.)","w":"① stiff: 뻣뻣한, 딱딱한\n③ hollow: 속이 빈\n④ fragile: 부서지기 쉬운","k":"고무는 유연한 재료여서, 부러지지 않고 쉽게 구부러진다.","m":0,"s":"Rubber is a ________ material, so it bends easily without breaking.","c":["stiff","flexible","hollow","fragile"],"mn":"유연한, 잘 구부러지는","hk":"flexible(유연한)은 flex(구부리다)에 ible(~할 수 있는)이 붙은 꼴, -able(~할 수 있는)이 아닌 -ible 주의. stiff(뻣뻣한)는 반대편, hollow(속이 빈)는 속임수","ex":[["Rubber is a [[flexible material]].","고무는 [[유연한 재료]]이다."],["Yoga makes your body [[flexible]].","요가는 몸을 [[유연하게]] 만든다."],["I have a [[flexible schedule]].","나는 [[유연한 일정]]을 가졌다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"purchase","a":"purchase","e":"purchase 구매하다, 구입하다","k":"그녀는 원하던 노트북을 구매할 수 있기까지 여섯 달 동안 돈을 모았다.","m":0,"s":"She saved money for six months before she could p______ the laptop she wanted.","mn":"구매하다, 구입하다","hk":"purchase(구매하다)는 buy(사다)보다 격식 있는 말. 뒷부분 철자가 chase(쫓다)와 같음","ex":[["He will [[purchase]] a new bike.","그는 새 자전거를 [[구매할]] 것이다."],["You can [[purchase tickets]] online.","온라인으로 [[표를 구매할]] 수 있다."],["They [[purchased]] a house last year.","그들은 작년에 집을 [[구입했다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"gallery","a":"1","e":"① gallery: (방이나 건물 / 그림과 그 밖의 예술 작품들이 사람들에게 보여지는) 미술관, 화랑","w":"② theater: 극장\n③ studio: 작업실, 스튜디오\n④ library: 도서관","k":"방이나 건물 / 그림과 그 밖의 예술 작품들이 사람들에게 보여지는","m":0,"s":"\"a room or building where paintings and other works of art are shown to people\"","c":["gallery","theater","studio","library"],"mn":"미술관, 화랑","hk":"gallery(미술관, 화랑)는 art gallery(미술관)로 기억, 그림을 보여 주는 곳. studio(작업실)는 만드는 곳, theater(극장), library(도서관)는 용도가 다름","ex":[["We visited an [[art gallery]].","우리는 [[미술관]]을 방문했다."],["The [[gallery]] opens at ten.","그 [[화랑]]은 열 시에 문을 연다."],["The city has a famous [[photo gallery]].","그 도시에는 유명한 [[사진 전시관]]이 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"combine","a":"2,3","e":"② mix: 섞다\n③ join: 하나로 합치다 (파란 물감을 노란 물감과 섞으면 초록색이 된다.) / combine(결합하다, 합치다)의 유의어.","w":"① separate: 나누다, 분리하다\n④ divide: 나누다, 가르다","k":"파란 물감을 노란 물감과 섞으면 초록색이 된다.","m":2,"s":"If you combine blue paint with yellow paint, you get green.","h":"combine","c":["separate","mix","join","divide"],"mn":"결합하다, 합치다","hk":"combine A with B(A를 B와 합치다)로 기억하면 mix(섞다), join(합치다)과 같은 편. separate(나누다)와 divide(가르다)는 반대편 속임수","ex":[["Please [[combine]] the two lists.","두 목록을 [[합쳐]] 주세요."],["You can [[combine]] rice with beans.","쌀을 콩과 [[섞을]] 수 있다."],["The two companies decided to [[combine]].","두 회사는 [[합치기로]] 했다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"galaxy","a":"4","e":"④ galaxy: 은하, 은하계","w":"① planet: 행성\n② comet: 혜성\n③ universe: 우주","m":0,"s":"\"은하, 은하계\"","c":["planet","comet","universe","galaxy"],"mn":"은하, 은하계","hk":"galaxy(은하)는 별이 모인 큰 무리. 크기 순서는 planet(행성), galaxy(은하), universe(우주)이고 comet(혜성)은 꼬리 있는 천체","ex":[["Our [[galaxy]] has billions of stars.","우리 [[은하]]에는 수십억 개의 별이 있다."],["The Milky Way is a [[spiral galaxy]].","은하수는 [[나선 은하]]이다."],["Telescopes can see a [[distant galaxy]].","망원경은 [[먼 은하]]를 볼 수 있다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"covers","a":"1","e":"①(주제 등을) 다루다 / ②가리다, 덮다 / ③덮다, 씌우다 / ④덮다, 가리다 [①번만 의미가 다름]","k":"①오늘 수업은 로마 제국의 역사를 다룬다.\n②그는 무서운 장면 동안 두 손으로 눈을 가렸다.\n③그녀는 자고 있는 아기를 따뜻한 담요로 덮어 주었다.\n④두꺼운 구름이 아침 내내 산꼭대기를 덮고 있었다.","m":0,"c":["Today's lesson covers the history of the Roman Empire.","He covered his eyes with both hands during the scary scene.","She covered the sleeping baby with a warm blanket.","Thick clouds covered the top of the mountain all morning."],"hc":"covers|covered|covered|covered","mn":"가리다, 덮다 / (주제 등을) 다루다","hk":"cover(덮다, 가리다)는 ②③④번에서 같은 뜻. ①번만 cover a topic(주제를 다루다)이라 다름","ex":[["Snow [[covered]] the whole town.","눈이 온 마을을 [[덮었다]].","cover (동) 덮다, 가리다"],["She [[covered]] her mouth with her hand.","그녀는 손으로 입을 [[가렸다]].","cover (동) 덮다, 가리다"],["This book [[covers]] world history.","이 책은 세계사를 [[다룬다]].","cover (동) (주제 등을) 다루다"]]}]},{"day":26,"q":[{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"judge","a":"judge","e":"judge (동) 판단하다 / (명) 판사, 심판, 심사위원","k":"한 번의 작은 실수로 사람의 능력을 판단하지 마라.\n그 심사위원은 그 어린 피아니스트에게 대회 최고점을 주었다.","m":0,"s":"Never j______ a person's ability by one small mistake.\nThe j______ gave the young pianist the highest score in the contest.","mn":"판단하다 / 판사, 심판, 심사위원","hk":"judge(판단하다, 동사)는 사람을 평가하는 일, judge(심사위원, 명사)는 평가하는 사람. 같은 철자에 동사와 명사 두 쓰임.","ex":[["Don't [[judge people]] by how they look.","겉모습으로 [[사람을 판단하지]] 마라.","judge (동) 판단하다"],["It is hard to [[judge the distance]] in the dark.","어둠 속에서는 [[거리를 판단하기]] 어렵다.","judge (동) 판단하다"],["The [[judge of the contest]] was a famous singer.","[[대회의 심사위원]]은 유명한 가수였다.","judge (명) 판사, 심판, 심사위원"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"arranged","a":"3","e":"③ arranged: 배열하다, 정리하다 (arrange의 과거형) (선생님은 모두가 서로를 볼 수 있도록 책상을 원형으로 배열했다.)","w":"① repaired: 수리하다 (repair의 과거형)\n② stacked: 쌓아 올리다 (stack의 과거형)\n④ scattered: 흩어 놓다 (scatter의 과거형)","k":"선생님은 모두가 서로를 볼 수 있도록 책상을 원형으로 배열했다.","m":0,"s":"The teacher ________ the desks in a circle so that everyone could see each other.","c":["repaired","stacked","arranged","scattered"],"mn":"배열하다, 정리하다","hk":"arranged(배열했다)는 질서 있게 놓는 일. 반대 느낌인 scattered(흩어 놓았다)는 함정, 책상을 원형으로 놓은 문맥에 안 맞음.","ex":[["He [[arranged the books]] by size.","그는 크기순으로 [[책을 배열했다]]."],["The kids [[arranged the chairs]] in two rows.","아이들은 두 줄로 [[의자를 배열했다]]."],["She [[arranged the flowers]] in a glass vase.","그녀는 유리 꽃병에 [[꽃을 가지런히 꽂았다]]."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"tuition","a":"4","e":"④ tuition: 등록금","w":"① wage: 임금, 급료\n② tax: 세금\n③ fare: 교통 요금","m":0,"s":"\"등록금\"","c":["wage","tax","fare","tuition"],"mn":"등록금","hk":"tuition(등록금)은 학교에 내는 돈. wage(임금)는 일하고 받는 돈, tax(세금)는 나라에 내는 돈, fare(교통 요금)는 타고 내는 돈으로 구분.","ex":[["The university raised its [[tuition fees]] again.","그 대학은 또다시 [[등록금]]을 올렸다."],["Many students work part-time to pay [[their tuition]].","많은 학생들이 [[등록금]]을 내려고 아르바이트를 한다."],["She received a scholarship that covers [[her tuition]].","그녀는 [[등록금]]을 충당해 주는 장학금을 받았다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"continent","a":"3","e":"③ continent: (지구 위의 아주 큰 일곱 개 땅덩어리 중 하나 / 아프리카나 아시아 같은) 대륙","w":"① region: 지역, 지방\n② territory: 영토, 지역\n④ peninsula: 반도","k":"지구 위의 아주 큰 일곱 개 땅덩어리 중 하나 / 아프리카나 아시아 같은","m":0,"s":"\"one of the seven very large areas of land on the earth, such as Africa or Asia\"","c":["region","territory","continent","peninsula"],"mn":"대륙","hk":"continent(대륙)는 Africa(아프리카)나 Asia(아시아) 같은 큰 땅덩어리. region(지역)은 더 작은 구역, peninsula(반도)는 바다로 뻗은 땅.","ex":[["Africa is the second largest [[continent]] in the world.","아프리카는 세계에서 두 번째로 큰 [[대륙]]이다."],["Penguins live on the [[continent of Antarctica]].","펭귄은 [[남극 대륙]]에 산다."],["They traveled across [[the European continent]] by train.","그들은 기차로 [[유럽 대륙]]을 가로질러 여행했다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"spend","a":"4","e":"④ pay: 지불하다 (그는 재킷 한 벌에 50달러가 넘는 돈을 쓰고 싶지 않았다.) / spend((돈을) 쓰다, 소비하다)의 유의어.","w":"① borrow: 빌리다\n② save: 아끼다, 저축하다\n③ earn: (돈을) 벌다","k":"그는 재킷 한 벌에 50달러가 넘는 돈을 쓰고 싶지 않았다.","m":0,"s":"He did not want to spend more than fifty dollars on a single jacket.","h":"spend","c":["borrow","save","earn","pay"],"mn":"(돈을) 쓰다, 소비하다","hk":"spend(쓰다)는 돈을 내보내는 일이라 pay(지불하다)와 같은 편. earn(벌다)·save(아끼다)는 반대 방향이라 함정.","ex":[["He [[spends money]] on comic books every month.","그는 매달 만화책에 [[돈을 쓴다]]."],["I try not to [[spend more than]] ten dollars a day.","나는 하루에 10달러 [[넘게 쓰지]] 않으려 한다."],["We [[spent fifty dollars]] on dinner.","우리는 저녁 식사에 [[50달러를 썼다]]."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"consumer","a":"4","e":"④ consumer: (상품이나 서비스를 사서 사용하는 사람) 소비자","w":"① producer: 생산자\n② investor: 투자자\n③ employer: 고용주","k":"상품이나 서비스를 사서 사용하는 사람","m":0,"s":"\"a person who buys and uses goods or services\"","c":["producer","investor","employer","consumer"],"mn":"소비자","hk":"consumer(소비자)는 사서 쓰는 사람. 반대편 producer(생산자)는 만드는 사람, employer(고용주)는 사람을 쓰는 사람. -er(~하는 사람)은 공통 꼬리.","ex":[["Smart [[consumers]] compare prices before they buy.","똑똑한 [[소비자]]는 사기 전에 가격을 비교한다."],["[[Consumer prices]] went up last month.","지난달 [[소비자 물가]]가 올랐다."],["As a [[consumer]], you can return a broken product.","[[소비자]]로서 너는 고장 난 제품을 반품할 수 있다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"strategy","a":"3,4","e":"③ method: 방법 (쉬는 시간 동안, 감독은 후반전을 위한 새로운 전략을 설명했다.) / strategy(전략, 계획)의 유의어.\n④ plan: 계획","w":"① goal: 목표\n② rule: 규칙","k":"쉬는 시간 동안, 감독은 후반전을 위한 새로운 전략을 설명했다.","m":2,"s":"During the break, the coach explained a new strategy for the second half.","h":"strategy","c":["goal","rule","method","plan"],"mn":"전략, 계획","hk":"strategy(전략)는 목표를 이루는 큰 계획이라 plan(계획), method(방법)와 같은 편. goal(목표)은 도착점, rule(규칙)은 지킬 약속이라 함정.","ex":[["Our coach [[came up with a new strategy]] for the final game.","우리 감독님은 결승전을 위해 [[새로운 전략을 생각해 냈다]]."],["Saving a little money each day is a [[smart strategy]].","매일 조금씩 저축하는 것은 [[현명한 전략]]이다."],["The company changed its [[marketing strategy]].","그 회사는 [[마케팅 전략]]을 바꿨다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"observe","a":"1","e":"observe (동) 관찰하다, 준수하다 - observation (명) 관찰, 준수\n① improve (동) 향상시키다, 나아지다 - improvement (명) 개선, 향상","w":"② complex (형) 복잡한 - complexity (명) 복잡성\n③ wealthy (형) 부유한, 돈이 많은 - wealth (명) 재산, 부\n④ accurate (형) 정확한, 틀림없는 - accuracy (명) 정확성","m":0,"s":"observe - observation","c":["improve - improvement","complex - complexity","wealthy - wealth","accurate - accuracy"],"mn":"관찰하다, 준수하다","hk":"observe(관찰하다)→observation(관찰)은 동사→명사 짝. 정답 improve(향상시키다)→improvement(향상)도 같은 방향, 나머지는 complex(복잡한) 등 형용사→명사.","ex":[["Scientists [[observe the stars]] with big telescopes.","과학자들은 큰 망원경으로 [[별을 관찰한다]].","observe (동) 관찰하다, 준수하다"],["Careful [[observation]] helped her find the answer.","신중한 [[관찰]]이 그녀가 답을 찾도록 도왔다.","observation (명) 관찰, 준수"],["I want to [[improve my English]] this year.","나는 올해 [[영어를 향상시키고]] 싶다.","improve (동) 향상시키다, 나아지다"],["There was a big [[improvement]] in his grades.","그의 성적에 큰 [[향상]]이 있었다.","improvement (명) 개선, 향상"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"deliver","a":"1","e":"① deliver: 배달하다, 전달하다 (그 가게는 금요일 전에 소파를 우리 집으로 배달해 주기로 약속했다.)","w":"② return: 반품하다, 돌려주다\n③ pack: 포장하다, 싸다\n④ collect: 수거하다, 모으다","k":"그 가게는 금요일 전에 소파를 우리 집으로 배달해 주기로 약속했다.","m":0,"s":"The store promised to ________ the sofa to my house before Friday.","c":["deliver","return","pack","collect"],"mn":"배달하다, 전달하다","hk":"deliver(배달하다)는 물건을 목적지까지 가져다주는 일. return(돌려주다)·collect(수거하다)는 반대 방향이라 sofa(소파)를 집으로 보내는 문맥에 안 맞음.","ex":[["The postman [[delivers letters]] every morning.","우편 배달부는 매일 아침 [[편지를 배달한다]]."],["Can you [[deliver the pizza]] to my office?","내 사무실로 [[피자를 배달해]] 주실 수 있나요?"],["The speaker [[delivered a message]] of hope.","연설자는 희망의 [[메시지를 전달했다]]."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"curiosity","a":"curiosity","e":"curiosity 호기심","k":"다락방에서 나는 이상한 소리는 아이들을 호기심으로 가득 채웠다.","m":0,"s":"The strange noise coming from the attic filled the children with c______.","mn":"호기심","hk":"curiosity(호기심)는 curious(호기심 많은)에서 나온 명사. -ous(형용사 꼬리)가 -osity(명사 꼬리)로 바뀌니 중간의 i-o-s-i 순서를 지켜 쓰기.","ex":[["Children are [[full of curiosity]].","아이들은 [[호기심으로 가득하다]]."],["He asked questions [[out of curiosity]].","그는 [[호기심에서]] 질문을 했다."],["The museum visit [[satisfied her curiosity]] about dinosaurs.","박물관 방문은 공룡에 대한 [[그녀의 호기심을 채워 주었다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"victory","a":"4","e":"④ defeat: 패배 (선수들은 마지막 라운드에서의 승리 후에 기쁨의 눈물을 흘렸다.) / victory(승리, 우승)의 반의어.","w":"① triumph: 승리, 대성공\n② success: 성공\n③ win: 승리, 이김","k":"선수들은 마지막 라운드에서의 승리 후에 기쁨의 눈물을 흘렸다.","m":0,"s":"The players cried with joy after their victory in the final round.","h":"victory","c":["triumph","success","win","defeat"],"mn":"승리, 우승","hk":"victory(승리)의 반대편은 defeat(패배). triumph(대성공)·success(성공)·win(승리)은 모두 같은 편이라 함정.","ex":[["The team celebrated [[its victory]] with a big party.","팀은 큰 파티로 [[승리]]를 축하했다.","victory (명) 승리, 우승"],["It was a [[great victory]] for the small team.","그것은 작은 팀에게 [[큰 승리]]였다.","victory (명) 승리, 우승"],["The team learned a lot from [[its defeat]].","그 팀은 [[패배]]에서 많은 것을 배웠다.","defeat (명) 패배"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"recycle","a":"recycle","e":"recycle 재활용하다","k":"플라스틱 병을 버리는 대신, 우리는 그것들을 씻어서 재활용해야 한다.","m":0,"s":"Instead of throwing plastic bottles away, we should wash them and rec______ them.","mn":"재활용하다","hk":"recycle(재활용하다)은 re-(다시)와 cycle(순환)이 합쳐진 말. r-e-c-y-c-l-e에서 c가 두 번 나오는 자리 확인.","ex":[["We [[recycle plastic bottles]] at home.","우리는 집에서 [[플라스틱 병을 재활용한다]]."],["You can [[recycle old paper]] to make new paper.","[[낡은 종이를 재활용해서]] 새 종이를 만들 수 있다."],["This bag is made from [[recycled plastic]].","이 가방은 [[재활용된 he boy can [[count to ten]].","그 소년은 [[열까지 셀]] 수 있다.","count (동) 세다, 계산하다"],["Please [[count the money]] again.","다시 [[돈을 세어]] 주세요.","count (동) 세다, 계산하다"],["Your opinion [[counts]] a lot in our team.","우리 팀에서 네 의견은 매우 [[중요하다]].","count (동) 중요하다"]]}]},{"day":27,"q":[{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"border","a":"1","e":"① edge: 가장자리, 끝 (키 큰 나무들이 그 넓은 밭의 가장자리를 따라 자라고 있다.) / border(가장자리, 경계)의 유의어.","w":"② path: 오솔길, 좁은 길\n③ gate: 문, 출입구\n④ center: 중앙, 중심","k":"키 큰 나무들이 그 넓은 밭의 가장자리를 따라 자라고 있다.","m":0,"s":"A row of tall trees grows along the border of the wide field.","h":"border","c":["edge","path","gate","center"],"mn":"가장자리, 경계","hk":"border(가장자리)는 땅이나 물건이 끝나는 부분이라 edge(가장자리)와 같은 편. center(중앙)는 반대편, path(오솔길)·gate(문)는 함정.","ex":[["Flowers grow along the [[border of the garden]].","꽃들이 [[정원의 가장자리]]를 따라 자란다."],["She drew a red line around the [[border of the paper]].","그녀는 [[종이의 가장자리]]를 따라 빨간 선을 그렸다."],["The river is the [[border between the two towns]].","그 강은 [[두 마을 사이의 경계]]이다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"solar","a":"4","e":"④ solar: 태양의 (그 새 건물은 햇빛을 전기로 바꾸기 위해 태양광 패널을 사용한다.)","w":"① digital: 디지털의\n② magnetic: 자기의, 자석의\n③ chemical: 화학의","k":"그 새 건물은 햇빛을 전기로 바꾸기 위해 태양광 패널을 사용한다.","m":0,"s":"The new building uses ________ panels to turn sunlight into electricity.","c":["digital","magnetic","chemical","solar"],"mn":"태양의","hk":"solar(태양의)는 sun(태양)과 관련된 말. solar panel(태양광 패널)이 햇빛을 전기로 바꿈. digital(디지털의)·chemical(화학의)은 다른 분야.","ex":[["The roof has [[solar panels]].","그 지붕에는 [[태양광 패널]]이 있다."],["[[Solar energy]] is clean and free.","[[태양 에너지]]는 깨끗하고 공짜이다."],["The Earth is a planet in the [[solar system]].","지구는 [[태양계]]의 행성이다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"logic","a":"4","e":"④ logic: 논리, 논법","w":"① belief: 믿음, 신념\n② theory: 이론, 학설\n③ opinion: 의견, 견해","m":0,"s":"\"논리, 논법\"","c":["belief","theory","opinion","logic"],"mn":"논리, 논법","hk":"logic(논리) "book (동) 예약하다 / (명) 책","k":"나는 내일 저녁 공연의 좌석 두 개를 예약해야 한다.\n맨 위 선반에 있는 그 오래된 책은 맨손으로 만지기에는 너무 귀중했다.","m":0,"s":"I have to b______ two seats for tomorrow evening's concert.\nThe old b______ on the top shelf was too valuable to touch with bare hands.","mn":"예약하다 / 책","hk":"book(예약하다, 동사)과 book(책, 명사)은 철자가 같은 두 뜻. 좌석이나 방을 잡으면 동사 예약하다, 읽는 물건이면 명사 책.","ex":[["I want to [[book a table]] for dinner.","저녁 식사를 위해 [[테이블을 예약하고]] 싶다.","book (동) 예약하다"],["We [[booked a hotel room]] online.","우리는 온라인으로 [[호텔 방을 예약했다]].","book (동) 예약하다"],["I borrowed [[a book]] from the library.","나는 도서관에서 [[책 한 권]]을 빌렸다.","book (명) 책"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"liberty","a":"liberty","e":"liberty 자유, 해방","k":"20년의 수감 생활 후에, 그 무고한 남자는 마침내 자유를 얻었다.","m":0,"s":"After twenty years behind bars, the innocent man finally won his l______.","mn":"자유, 해방","hk":"liberty(자유)는 liberal(자유주의의)과 앞부분 liber-(자유)가 같음. 끝은 -ty(명사 꼬리)라 l-i-b-e-r-t-y 순서로 쓰기.","ex":[["The Statue of [[Liberty]] stands in New York.","[[자유]]의 여신상은 뉴욕에 서 있다."],["The prisoners longed for [[liberty]].","죄수들은 [[자유]]를 갈망했다."],["They fought for [[liberty and peace]].","그들은 [[자유와 평화]]를 위해 싸웠다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"rough","a":"3","e":"③ uneven: 평평하지 않은, 고르지 못한 (그 오래된 동굴의 바닥은 거칠어서, 어둠 속에서 걷는 것은 위험했다.) / rough(거친, 울퉁불퉁한)의 유의어.","w":"① solid: 단단한, 고체의\n② flat: 평평한\n④ smooth: 매끄러운, 부드러운","k":"그 오래된 동굴의 바닥은 거칠어서, 어둠 속에서 걷는 것은 위험했다.","m":0,"s":"The floor of the old cave was rough, so walking in the dark was dangerous.","h":"rough","c":["solid","flat","uneven","smooth"],"mn":"거친, 울퉁불퉁한","hk":"rough(거친)는 표면이 울퉁불퉁하다는 뜻이라 uneven(고르지 못한)과 같은 편. smooth(매끄러운)·flat(평평한)은 반대편이라 함정.","ex":[["We drove on a [[rough road]].","우리는 [[울퉁불퉁한 길]]을 달렸다."],["Her hands became [[rough]] from hard work.","힘든 일로 그녀의 손은 [[거칠어졌다]]."],["The boat sailed across the [[rough sea]].","배는 [[거친 바다]]를 건너 항해했다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"simple","a":"1","e":"simple (형) 단순한, 간단한 - simplify (동) 단순화하다\n① pure (형) 순수한, 깨끗한 - purify (동) 정화하다","w":"② decide (동) 결정하다 - decision (명) 결정\n③ solution (명) 해결책, 해답 - solve (동) 풀다, 해결하다\n④ creature (명) 생물, 창조물 - create (동) 창조하다, 만들다","m":0,"s":"simple - simplify","c":["pure - purify","decide - decision","solution - solve","creature - create"],"mn":"단순한, 간단한","hk":"simple(단순한)→simplify(단순화하다)는 형용사에 -ify(~하게 만들다)가 붙은 짝. 정답 pure(순수한)→purify(정화하다)도 같고, 나머지는 방향이 달라 함정.","ex":[["The rules of the game are [[very simple]].","그 게임의 규칙은 [[매우 단순하다]].","simple (형) 단순한, 간단한"],["Can you [[simplify the question]] for me?","나를 위해 [[질문을 단순하게 해]] 줄 수 있니?","simplify (동) 단순화하다"],["The river water is [[pure and clean]].","그 강물은 [[순수하고 깨끗하다]].","pure (형) 순수한, 깨끗한"],["This machine can [[purify water]].","이 기계는 [[물을 정화할]] 수 있다.","purify (동) 정화하다"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 모두 고르시오. (정답 2개)","wd":"ban","a":"2,4","e":"② let: 허락하다, 하게 하다\n④ allow: 허락하다 (그 학교는 수업 시간 동안 휴대전화를 금지하기로 결정했다.) / ban(금지하다)의 반의어.","w":"① prohibit: 금지하다\n③ forbid: 금지하다","k":"그 학교는 수업 시간 동안 휴대전화를 금지하기로 결정했다.","m":2,"s":"The school decided to ban mobile phones during class hours.","h":"ban","c":["prohibit","let","forbid","allow"],"mn":"금지하다","hk":"ban(금지하다)의 반대편은 allow(허락하다)와 let(허락하다). prohibit(금지하다)·forbid(금지하다)는 같은 편이라 함정.","ex":[["The city will [[ban cars]] in the center.","그 도시는 중심가에서 [[차를 금지할]] 것이다.","ban (동) 금지하다"],["My parents [[let me stay up late]] on weekends.","부모님은 주말에 [[내가 늦게까지 깨어 있게 해 주신다]].","let (동) 허락하다, 하게 하다"],["The school does not [[allow phones]] in class.","그 학교는 수업 중 [[휴대전화를 허락하지]] 않는다.","allow (동) 허락하다"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"exhibition","a":"3","e":"③ exhibition: (공개 행사 / 예술 작품이나 흥미로운 물건들이 방문객들에게 보여지는) 전시회","w":"① rehearsal: 리허설, 예행연습\n② contest: 대회, 시합\n④ lecture: 강의","k":"공개 행사 / 예술 작품이나 흥미로운 물건들이 방문객들에게 보여지는","m":0,"s":"\"a public event at which works of art or interesting objects are shown to visitors\"","c":["rehearsal","contest","exhibition","lecture"],"mn":"전시회","hk":"exhibition(전시회)은 작품이나 물건을 방문객에게 보여 주는 행사. rehearsal(리허설)은 연습, contest(대회)는 겨루기, lecture(강의)는 수업이라 구분.","ex":[["We went to an [[art exhibition]] on Sunday.","우리는 일요일에 [[미술 전시회]]에 갔다."],["The museum will hold [[an exhibition]] of old maps.","그 박물관은 옛 지도의 [[전시회]]를 열 것이다."],["Many visitors came to see the [[photo exhibition]].","많은 방문객이 [[사진 전시회]]를 보러 왔다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"talent","a":"talent","e":"talent 재능","k":"다섯 살의 나이에 그녀는 이미 바이올린 연주에 뛰어난 재능을 보였다.","m":0,"s":"At the age of five she already showed a remarkable t______ for playing the violin.","mn":"재능","hk":"talent(재능)는 끝이 -ant(안트)가 아니라 -ent(엔트). 대표 짝 talent for(~에 대한 재능)로 함께 기억.","ex":[["She has a great [[talent for music]].","그녀는 [[음악에 재능]]이 뛰어나다."],["The school has many students with [[special talents]].","그 학교에는 [[특별한 재능]]을 가진 학생이 많다."],["Our school will hold [[a talent show]] in May.","우리 학교는 5월에 [[장기자랑]]을 열 것이다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"reality","a":"2","e":"② dream: 꿈 (현실에서, 외국어를 배우는 것은 여러 해의 매일의 연습을 필요로 한다.) / reality(현실, 실제)의 반의어.","w":"① fact: 사실\n③ truth: 진실\n④ result: 결과","k":"현실에서, 외국어를 배우는 것은 여러 해의 매일의 연습을 필요로 한다.","m":0,"s":"In reality, learning a foreign language takes years of daily practice.","h":"reality","c":["fact","dream","truth","result"],"mn":"현실, 실제","hk":"reality(현실)의 반대편은 dream(꿈). fact(사실)·truth(진실)는 현실 쪽이라 같은 편, result(결과)는 관계없는 함정.","ex":[["[[In reality]], he is very shy.","[[실제로는]] 그는 매우 수줍음이 많다.","reality (명) 현실, 실제"],["Don't run away from [[reality]].","[[현실]]에서 도망치지 마라.","reality (명) 현실, 실제"],["My brother's [[dream]] is to become a pilot.","내 형의 [[꿈]]은 조종사가 되는 것이다.","dream (명) 꿈"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"unity","a":"3","e":"③ unity: 통합, 단결","w":"① diversity: 다양성, 차이\n② independence: 독립, 자립\n④ rivalry: 경쟁, 대결","m":0,"s":"unity","c":["다양성, 차이","독립, 자립","통합, 단결","경쟁, 대결"],"mn":"통합, 단결","hk":"unity(통합, 단결)는 uni-(하나)에서 온 말로 여럿이 하나가 됨. diversity(다양성)·rivalry(경쟁)는 하나 되기와 반대 느낌.","ex":[["The team showed great [[unity]].","그 팀은 대단한 [[단결]]을 보여 주었다."],["The leaders called for [[national unity]].","지도자들은 [[국가적 단결]]을 호소했다."],["The festival [[promotes unity]] among neighbors.","그 축제는 이웃 사이의 [[단결을 키워 준다]]."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"balance","a":"1","e":"①잔고, 잔액 / ②균형 / ③균형 / ④균형 [①번만 의미가 다름]","k":"①그의 통장 잔고는 그가 예상했던 것보다 훨씬 적었다.\n②고양이는 균형을 잃지 않고 좁은 담벼락 위를 걸을 수 있다.\n③빙판길에서 균형을 유지하는 것은 어렵다.\n④그 무용수는 균형을 잃고 무대 위로 쓰러졌다.","m":0,"c":["The balance in his bank book was much lower than he expected.","A cat can walk along a narrow wall without losing its balance.","It is hard to keep your balance on an icy road.","The dancer lost her balance and fell onto the stage."],"hc":"balance|balance|balance|balance","mn":"균형 / 잔고, 잔액","hk":"balance(균형)는 한쪽으로 기울지 않는 상태, 통장의 balance(잔고)는 남은 돈이라 ①번만 다름. 나머지는 lose(잃다)·keep(유지하다)과 짝인 균형.","ex":[["I checked my [[bank balance]] this morning.","나는 오늘 아침 [[은행 잔고]]를 확인했다.","balance (명) 잔고, 잔액"],["Cyclists must [[keep their balance]] on a bike.","자전거 타는 사람은 자전거 위에서 [[균형을 유지해야]] 한다.","balance (명) 균형"],["He [[lost his balance]] and fell on the ice.","그는 [[균형을 잃고]] 얼음 위에 넘어졌다.","balance (명) 균형"]]}]},{"day":28,"q":[{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"drive","a":"4","e":"④ drive: 운전하다, 몰다 (내 삼촌은 하루에 열 시간 넘게 배달 트럭을 운전해야 한다.)","w":"① row: 노를 젓다\n② fly: 비행하다, 조종하다\n③ sail: 항해하다","k":"내 삼촌은 하루에 열 시간 넘게 배달 트럭을 운전해야 한다.","m":0,"s":"My uncle has to ________ a delivery truck for more than ten hours a day.","c":["row","fly","sail","drive"],"mn":"운전하다, 몰다","hk":"drive(운전하다)는 자동차나 트럭을 직접 몰 때. row(노를 젓다)는 배의 노, fly(비행하다)는 하늘, sail(항해하다)은 바다와 짝이라 truck(트럭)과 안 맞음.","ex":[["My father [[drives a bus]] to work.","아버지는 일하러 [[버스를 운전하신다]]."],["She learned to [[drive a car]] last year.","그녀는 작년에 [[차를 운전하는]] 법을 배웠다."],["He likes to [[drive fast]] on empty roads.","그는 빈 도로에서 [[빨리 운전하는]] 것을 좋아한다."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"affect","a":"2,3","e":"② influence: 영향을 주다\n③ impact: 영향을 주다 (이른 봄의 폭우는 이 작물들의 성장에 심각한 영향을 미칠 수 있다.) / affect(영향을 미치다)의 유의어.","w":"① estimate: 추정하다\n④ accelerate: 가속하다","k":"이른 봄의 폭우는 이 작물들의 성장에 심각한 영향을 미칠 수 있다.","m":2,"s":"Heavy rain in early spring can seriously affect the growth of these crops.","h":"affect","c":["estimate","influence","impact","accelerate"],"mn":"영향을 미치다","hk":"affect(영향을 미치다)는 influence(영향을 주다), impact(영향을 주다)와 같은 편. estimate(추정하다)·accelerate(가속하다)는 뜻이 달라 함정.","ex":[["Weather can [[affect your mood]].","날씨는 [[기분에 영향을 미칠]] 수 있다."],["Lack of sleep [[affects your health]].","수면 부족은 [[건강에 영향을 미친다]]."],["The news did not [[affect his decision]].","그 소식은 [[그의 결정에 영향을 미치지]] 않았다."]]},{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"compliment","a":"1","e":"① compliment: 칭찬, 찬사","w":"② complaint: 불평, 불만\n③ criticism: 비판, 비난\n④ commitment: 헌신, 약속","m":0,"s":"\"칭찬, 찬사\"","c":["compliment","complaint","criticism","commitment"],"mn":"칭찬, 찬사","hk":"compliment(칭찬)는 기분 좋게 하는 말로 철자가 -pli-. complaint(불평)는 -plai-로 갈리고, commitment(헌신)와도 구분.","ex":[["She gave me a nice [[compliment]].","그녀는 내게 멋진 [[칭찬]]을 해 주었다."],["He [[paid her a compliment]] on her new dress.","그는 그녀의 새 드레스를 보고 [[칭찬을 건넸다]]."],["Thank you for the [[kind compliment]].","[[친절한 칭찬]] 고마워요."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"memory","a":"memory","e":"memory 기억, 추억","k":"그 사고 이후 그는 그날 밤 무슨 일이 있었는지에 대한 기억을 모두 잃었다.","m":0,"s":"After the accident he lost all m______ of what had happened that night.","mn":"기억, 추억","al":"memories","hk":"memory(기억)는 m으로 시작해 가운데 m이 또 나오는 m-e-m-o-r-y. 대표 짝 lose one's memory(기억을 잃다)로 외우기.","ex":[["This photo brings back a [[happy memory]].","이 사진은 [[행복한 추억]]을 떠올리게 한다."],["He [[lost his memory]] in the accident.","그는 사고로 [[기억을 잃었다]]."],["My grandfather has a [[good memory]].","할아버지는 [[기억력이 좋으시다]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"invaluable","a":"2","e":"② worthless: 가치 없는, 쓸모없는 (내가 직장 생활에서 가장 힘든 결정을 내려야 했을 때 그녀의 솔직한 조언은 매우 귀중했다.) / invaluable(매우 귀중한, 값을 매길 수 없는)의 반의어.","w":"① expensive: 값비싼\n③ priceless: 값을 매길 수 없는, 귀중한\n④ precious: 귀중한, 소중한","k":"내가 직장 생활에서 가장 힘든 결정을 내려야 했을 때 그녀의 솔직한 조언은 매우 귀중했다.","m":0,"s":"Her honest advice was invaluable when I had to make the toughest decision of my career.","h":"invaluable","c":["expensive","worthless","priceless","precious"],"mn":"매우 귀중한, 값을 매길 수 없는","hk":"invaluable(매우 귀중한)은 in-이 붙어도 '가치 없음'이 아니라 값을 매길 수 없을 만큼 귀중함. 반대편은 worthless(가치 없는), priceless(값을 매길 수 없는)는 같은 편이라 함정.","ex":[["Her advice was [[invaluable to me]].","그녀의 조언은 나에게 [[매우 귀중했다]].","invaluable (형) 매우 귀중한, 값을 매길 수 없는"],["Thank you for your [[invaluable help]].","[[매우 귀중한 도움]]에 감사드립니다.","invaluable (형) 매우 귀중한, 값을 매길 수 없는"],["The broken watch is now [[worthless]].","고장 난 시계는 이제 [[가치가 없다]].","worthless (형) 가치 없는, 쓸모없는"]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"invade","a":"3","e":"invade (동) 침략하다 - invasion (명) 침략\n③ deceive (동) 속이다 - deception (명) 속임수, 기만","w":"① capable (형) 능력 있는 - capability (명) 능력\n② cruel (형) 잔인한 - cruelty (명) 잔인함\n④ rude (형) 무례한 - rudeness (명) 무례함","m":0,"s":"invade - invasion","c":["capable - capability","cruel - cruelty","deceive - deception","rude - rudeness"],"mn":"침략하다","hk":"invade(침략하다)→invasion(침략)은 동사→명사 짝. 정답 deceive(속이다)→deception(속임수)도 같은 방향, 나머지는 capable(능력 있는) 등 형용사→명사.","ex":[["The army tried to [[invade the country]].","군대는 [[그 나라를 침략하려]] 했다.","invade (동) 침략하다"],["The [[invasion]] began at dawn.","[[침략]]은 새벽에 시작되었다.","invasion (명) 침략"],["Don't try to [[deceive your friends]].","[[친구들을 속이려고]] 하지 마라.","deceive (동) 속이다"],["The magician's trick is a kind of [[deception]].","마술사의 묘기는 일종의 [[속임수]]이다.","deception (명) 속임수, 기만"]]}, ["She always gets [[good grades]] in math.","그녀는 수학에서 항상 [[좋은 성적]]을 받는다.","grade (명) 성적, 평점"],["Studying every day can [[improve your grades]].","매일 공부하면 [[성적을 올릴]] 수 있다.","grade (명) 성적, 평점"],["My sister is in the [[sixth grade]].","내 여동생은 [[6학년]]이다.","grade (명) 학년"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"superior","a":"4","e":"④ inferior: 열등한, 더 못한 (대부분의 평론가들은 새 엔진이 그 회사가 이전에 만든 어떤 것보다도 확실히 더 우수하다는 데 동의했다.) / superior(우수한, 더 나은)의 반의어.","w":"① equivalent: 동등한\n② identical: 동일한\n③ comparable: 비슷한, 비교할 만한","k":"대부분의 평론가들은 새 엔진이 그 회사가 이전에 만든 어떤 것보다도 확실히 더 우수하다는 데 동의했다.","m":0,"s":"Most critics agreed that the new engine was clearly superior to anything the company had built before.","h":"superior","c":["equivalent","identical","comparable","inferior"],"mn":"우수한, 더 나은","hk":"superior(우수한)의 반대편은 inferior(열등한). equivalent(동등한)·identical(동일한)은 우열이 없어 함정. 비교는 superior to(~보다 우수한) 식.","ex":[["This phone is [[superior to]] that one.","이 휴대전화는 저것[[보다 우수하다]].","superior (형) 우수한, 더 나은"],["She has [[superior skills]] in chess.","그녀는 체스에서 [[우수한 실력]]을 가졌다.","superior (형) 우수한, 더 나은"],["He felt [[inferior to]] his brother.","그는 자신이 형[[보다 열등하다]]고 느꼈다.","inferior (형) 열등한, 더 못한"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"worth","a":"2","e":"② worth: ~의 가치가 있는 (이 골동품 시계는 만 달러가 넘는 가치가 있다.)","w":"① deserving: ~을 받을 자격이 있는\n③ worthy: 훌륭한, ~을 받을 만한\n④ valued: 소중히 여겨지는","k":"이 골동품 시계는 만 달러가 넘는 가치가 있다.","m":0,"s":"This antique clock is ________ more than ten thousand dollars.","c":["deserving","worth","worthy","valued"],"mn":"~의 가치가 있는","hk":"worth(~의 가치가 있는)는 바로 뒤에 금액이나 동작(-ing)이 옴. worthy(훌륭한)는 of(~의)와 함께 쓰는 단어라 형태가 달라 구분.","ex":[["This painting is [[worth a million dollars]].","이 그림은 [[백만 달러의 가치가 있다]]."],["The movie is [[worth watching]].","그 영화는 [[볼 가치가 있다]]."],["The old car is [[worth very little]].","그 낡은 차는 [[거의 가치가 없다]]."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 가장 비슷한 것을 고르시오.","wd":"personnel","a":"1","e":"① staff: 직원들 (그 항공사는 바쁜 여름 시즌을 위해 더 많은 보안 직원을 고용했다.) / personnel(직원들, 인력)의 유의어.","w":"② trainee: 수습생, 교육생\n③ applicant: 지원자\n④ inspector: 조사관, 검사관","k":"그 항공사는 바쁜 여름 시즌을 위해 더 많은 보안 직원을 고용했다.","m":0,"s":"The airline hired more security personnel for the busy summer season.","h":"personnel","c":["staff","trainee","applicant","inspector"],"mn":"직원들, 인력","hk":"personnel(직원들)은 한 조직의 사람들을 묶어 부르는 말이라 staff(직원들)와 같은 편. trainee(수습생)·applicant(지원자)는 일부만 가리켜 함정.","ex":[["All [[hospital personnel]] must wear masks.","[[병원 직원들]]은 모두 마스크를 써야 한다."],["The airport needs more [[security personnel]].","공항은 더 많은 [[보안 직원]]이 필요하다."],["[[Military personnel]] helped after the flood.","홍수 뒤에 [[군 인력]]이 도왔다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"tropical","a":"1","e":"① tropical: (세계의 덥고 습한 지역과 관련된 / 적도 가까이에 놓여 있는) 열대의","w":"② arctic: 북극의\n③ polar: 극지의\n④ temperate: 온대의, 온화한","k":"세계의 덥고 습한 지역과 관련된 / 적도 가까이에 놓여 있는","m":0,"s":"\"relating to the hot and wet parts of the world that lie near the equator\"","c":["tropical","arctic","polar","temperate"],"mn":"열대의","hk":"tropical(열대의)은 적도 가까이의 덥고 습한 곳. arctic(북극의)·polar(극지의)는 추운 곳, temperate(온대의)는 중간이라 구분.","ex":[["Bananas grow in [[tropical countries]].","바나나는 [[열대 국가]]에서 자란다."],["We saw [[tropical fish]] while diving.","우리는 잠수하다가 [[열대어]]를 보았다."],["A [[tropical storm]] is coming to the island.","[[열대 폭풍]]이 그 섬으로 오고 있다."]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"file","a":"file","e":"file 파일, 서류철","k":"우리가 나중에 쉽게 찾을 수 있도록 그 보고서를 별도의 파일에 저장해 주세요.","m":0,"s":"Please save the report in a separate f______ so that we can find it easily later.","mn":"파일, 서류철","hk":"file(파일)은 f-i-l-e. 철자 비슷한 fill(채우다)과 구분, 끝은 -e. 대표 짝 save a file(파일을 저장하다).","ex":[["Please [[save the file]] before you close it.","닫기 전에 [[파일을 저장해]] 주세요."],["She keeps old papers in a blue [[file]].","그녀는 낡은 서류를 파란 [[서류철]]에 보관한다."],["He [[opened the file]] on his computer.","그는 컴퓨터에서 [[파일을 열었다]]."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"form","a":"2","e":"①양식, 서식 / ②형태, 모습 / ③양식, 서식 / ④양식, 서식 [②번만 의미가 다름]","k":"①선생님은 각 학생에게 짧은 신청서 양식을 나누어 주셨다.\n②물은 얼음, 액체, 또는 수증기의 형태를 띨 수 있다.\n③의사를 만나기 전에 이 양식을 작성해 주세요.\n④안내 데스크에서 동의서 양식에 서명하셔야 합니다.","m":0,"c":["The teacher handed out a short application form to each student.","Water can take the form of ice, liquid, or steam.","Please fill out this form before you see the doctor.","You must sign the consent form at the front desk."],"hc":"form|form|form|form","mn":"양식, 서식 / 형태, 모습","hk":"form(양식)은 적어 내는 서류인데, ②번 form(형태, 모습)은 겉모양을 뜻해 다름. 서류냐 모양이냐로 구분.","ex":[["Please fill out this [[application form]].","이 [[신청서 양식]]을 작성해 주세요.","form (명) 양식, 서식"],["Write your name on the [[order form]].","[[주문서 양식]]에 이름을 쓰세요.","form (명) 양식, 서식"],["Clouds can take the [[form of animals]].","구름은 [[동물의 모양]]을 띨 수 있다.","form (명) 형태, 모습"]]}]},{"day":29,"q":[{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"classic","a":"3","e":"③ classic: 고전적인, 전형적인","w":"① critical: 비판적인\n② commercial: 상업적인\n④ experimental: 실험적인","m":0,"s":"classic","c":["비판적인","상업적인","고전적인, 전형적인","실험적인"],"mn":"고전적인, 전형적인","hk":"classic(고전적인)은 오래도록 인정받은 대표작 느낌. 반대 느낌인 experimental(실험적인)은 새로운 시도라 함정.","ex":[["This is a [[classic example]] of good design.","이것은 좋은 디자인의 [[전형적인 예]]이다."],["We watched a [[classic movie]].","우리는 [[고전 영화]]를 봤다."],["It is a [[classic mistake]] for beginners.","그것은 초보자들의 [[전형적인 실수]]이다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"villain","a":"1","e":"① hero: 영웅, 주인공 (그 이야기의 악당은 마지막 장에서 마침내 붙잡힌다.) / villain(악당, 악역)의 반의어.","w":"② rebel: 반역자\n③ coward: 겁쟁이\n④ traitor: 배신자","k":"그 이야기의 악당은 마지막 장에서 마침내 붙잡힌다.","m":0,"s":"The villain of the story is finally caught in the last chapter.","h":"villain","c":["hero","rebel","coward","traitor"],"mn":"악당, 악역","hk":"villain(악당)과 hero(영웅)는 이야기에서 맞서는 짝. rebel(반역자)·coward(겁쟁이)·traitor(배신자)는 짝이 아니라 함정.","ex":[["The [[villain of the movie]] was a clever thief.","[[그 영화의 악당]]은 영리한 도둑이었다.","villain (명) 악당, 악역"],["The kids were afraid of the [[evil villain]].","아이들은 그 [[사악한 악당]]을 무서워했다.","villain (명) 악당, 악역"],["The firefighter became a [[hero]] after saving the child.","그 소방관은 아이를 구한 뒤 [[영웅]]이 되었다.","hero (명) 영웅, 주인공"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"art","a":"art","e":"art 예술, 미술","k":"그 박물관은 스무 개가 넘는 나라에서 온 현대 예술 작품을 전시한다.","m":0,"s":"The museum displays works of modern a______ from more than twenty countries.","mn":"예술, 미술","hk":"art(예술)는 a-r-t로 짧아 끝의 t를 빠뜨리기 쉬움. 대표 짝 modern art(현대 미술), work of art(예술 작품)로 외우기.","ex":[["She is studying [[modern art]].","그녀는 [[현대 미술]]을 공부하고 있다."],["This painting is a [[work of art]].","이 그림은 [[예술 작품]]이다."],["I take an [[art class]] on Fridays.","나는 금요일마다 [[미술 수업]]을 듣는다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"personality","a":"4","e":"④ personality: (성질과 행동 방식의 묶음 / 한 사람을 다른 사람과 다르게 만드는) 성격, 인격","w":"① reputation: 평판, 명성\n② temper: 성질, 기질\n③ popularity: 인기","k":"성질과 행동 방식의 묶음 / 한 사람을 다른 사람과 다르게 만드는","m":0,"s":"\"the set of qualities and ways of behaving that make one person different from another\"","c":["reputation","temper","popularity","personality"],"mn":"성격, 인격","hk":"personality(성격)는 한 사람을 다른 사람과 다르게 만드는 성질과 행동의 묶음. reputation(평판)은 남의 평가, temper(성질)는 화내는 기질.","ex":[["She has a [[cheerful personality]].","그녀는 [[밝은 성격]]을 가졌다."],["He has a [[strong personality]].","그는 [[강한 성격]]을 가졌다."],["I took a [[personality test]] online.","나는 온라인에서 [[성격 검사]]를 받았다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"deliberate","a":"4","e":"deliberate (형) 의도적인, 계획적인 - deliberately (부) 의도적으로\n④ abrupt (형) 갑작스러운 - abruptly (부) 갑자기","w":"① faith (명) 믿음, 신뢰 - faithfully (부) 충실하게\n② power (명) 힘, 권력 - powerfully (부) 강력하게\n③ hope (명) 희망 - hopefully (부) 바라건대","m":0,"s":"deliberate - deliberately","c":["faith - faithfully","power - powerfully","hope - hopefully","abrupt - abruptly"],"mn":"의도적인, 계획적인","hk":"deliberate(의도적인)→deliberately(의도적으로)는 형용사+-ly(부사 꼬리) 짝. 정답 abrupt(갑작스러운)→abruptly(갑자기)가 같고, 나머지는 명사→부사.","ex":[["It was a [[deliberate choice]].","그것은 [[의도적인 선택]]이었다.","deliberate (형) 의도적인, 계획적인"],["She [[deliberately ignored]] my call.","그녀는 내 전화를 [[의도적으로 무시했다]].","deliberately (부) 의도적으로"],["There was an [[abrupt change]] in the weather.","날씨에 [[갑작스러운 변화]]가 있었다.","abrupt (형) 갑작스러운"],["The music stopped [[abruptly]].","음악이 [[갑자기]] 멈췄다.","abruptly (부) 갑자기"]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"hold","a":"4","e":"④ hold: 개최하다 (그 도시는 내년 봄에 첫 국제 영화제를 개최할 것이다.)","w":"① visit: 방문하다\n② enter: 들어가다, 참가하다\n③ tour: 둘러보다, 순회하다","k":"그 도시는 내년 봄에 첫 국제 영화제를 개최할 것이다.","m":0,"s":"The city will ________ its first international film festival next spring.","c":["visit","enter","tour","hold"],"mn":"개최하다","hk":"hold(개최하다)는 행사를 연다는 뜻으로 hold a festival(축제를 열다)이 대표 짝. visit(방문하다)·enter(들어가다)는 가는 동작이라 함정.","ex":[["The school will [[hold a meeting]] on Friday.","학교는 금요일에 [[회의를 열]] 것이다."],["The city [[holds a parade]] every year.","그 도시는 매년 [[퍼레이드를 개최한다]]."],["Our club will [[hold a contest]] in May.","우리 동아리는 5월에 [[대회를 개최할]] 것이다."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"still","a":"still","e":"still (형) 고요한, 정지한 / (부) 여전히, 아직도","k":"호수가 너무 고요해서 산이 수면에 완벽하게 비쳤다.\n그 공장은 몇 년 전에 문을 닫았지만, 녹슨 간판은 여전히 정문 위에 걸려 있다.","m":0,"s":"The lake was so s______ that the mountains were perfectly mirrored on its surface.\nEven though the factory closed years ago, its rusty sign is s______ hanging above the gate.","mn":"고요한, 정지한 / 여전히, 아직도","hk":"still(고요한, 형용사)은 움직임 없는 상태, still(여전히, 부사)은 지금도 계속되는 상태. 같은 철자에 두 품사 두 뜻.","ex":[["The pond was [[very still]] this morning.","연못은 오늘 아침 [[매우 고요했다]].","still (형) 고요한, 정지한"],["The night air was calm and [[still]].","밤공기는 잔잔하고 [[고요했다]].","still (형) 고요한, 정지한"],["He is [[still sleeping]].","그는 [[아직도 자고 ferent color]] today.","그녀는 오늘 [[다른 색]]을 입었다.","different (형) 다른"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"imaginary","a":"2","e":"② imaginary: 상상의, 가상의","w":"① feasible: 실현 가능한\n③ impressive: 인상적인\n④ creative: 창의적인","m":0,"s":"imaginary","c":["실현 가능한","상상의, 가상의","인상적인","창의적인"],"mn":"상상의, 가상의","hk":"imaginary(상상의)는 imagine(상상하다)에서 나온 형용사로 머릿속에만 있는 것. creative(창의적인)는 새로 만드는 쪽이라 함정.","ex":[["My little sister has an [[imaginary friend]].","내 여동생에게는 [[상상 속 친구]]가 있다."],["The story takes place in an [[imaginary world]].","그 이야기는 [[가상의 세계]]에서 일어난다."],["Draw an [[imaginary line]] between the two points.","두 점 사이에 [[가상의 선]]을 그어라."]]},{"t":"SYN","tn":"유의어","f":"객관식","p":"다음 밑줄 친 단어와 의미가 비슷한 것을 모두 고르시오. (정답 2개)","wd":"therapy","a":"2,3","e":"② remedy: 치료(법), 요법 (의사는 그의 뻣뻣한 무릎에 물리 치료를 권했다.) / therapy(치료, 요법)의 유의어.\n③ treatment: 치료","w":"① diagnosis: 진단\n④ prescription: 처방(전)","k":"의사는 그의 뻣뻣한 무릎에 물리 치료를 권했다.","m":2,"s":"The doctor recommended physical therapy for his stiff knee.","h":"therapy","c":["diagnosis","remedy","treatment","prescription"],"mn":"치료, 요법","hk":"therapy(치료)는 아픔을 낫게 하는 방법이라 remedy(치료법), treatment(치료)와 같은 편. diagnosis(진단)·prescription(처방전)은 다른 단계라 함정.","ex":[["She started [[physical therapy]] after the accident.","그녀는 사고 후 [[물리 치료]]를 시작했다."],["[[Music therapy]] helps patients relax.","[[음악 요법]]은 환자들이 긴장을 풀도록 돕는다."],["The [[therapy session]] lasts an hour.","[[치료 시간]]은 한 시간 걸린다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"beside","a":"1","e":"① beside: ~옆에 (그녀는 남동생 옆에 앉아서 그의 숙제를 도와주었다.)","w":"② beneath: ~바로 밑에\n③ below: ~아래에\n④ beyond: ~너머에","k":"그녀는 남동생 옆에 앉아서 그의 숙제를 도와주었다.","m":0,"s":"She sat ________ her little brother and helped him with his homework.","c":["beside","beneath","below","beyond"],"mn":"~옆에","hk":"beside(~옆에)는 바로 곁에 나란히. beneath(~바로 밑에)·below(~아래에)는 위아래 관계, beyond(~너머에)는 건너편이라 함정.","ex":[["A small dog sat [[beside the door]].","작은 개가 [[문 옆에]] 앉아 있었다."],["Come and sit [[beside me]].","와서 [[내 옆에]] 앉아라."],["The school stands [[beside the river]].","학교는 [[강 옆에]] 서 있다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"yield","a":"2","e":"② yield: (마침내 저항하기를 멈추다 / 그리고 더 강한 사람이나 것에 굴복하다) 굴복하다, 양보하다","w":"① confront: 맞서다, 직면하다\n③ defy: 반항하다, 무시하다\n④ oppose: 반대하다","k":"마침내 저항하기를 멈추다 / 그리고 더 강한 사람이나 것에 굴복하다","m":0,"s":"\"to finally stop resisting and give way to someone or something stronger\"","c":["confront","yield","defy","oppose"],"mn":"굴복하다, 양보하다","hk":"yield(굴복하다)는 저항을 멈추고 더 강한 쪽에 길을 내주는 일. confront(맞서다)·defy(반항하다)·oppose(반대하다)는 버티는 쪽이라 정반대 함정.","ex":[["He refused to [[yield to pressure]].","그는 [[압력에 굴복하기를]] 거부했다."],["Drivers must [[yield to people crossing the road]].","운전자는 [[길을 건너는 사람들에게 양보해야]] 한다."],["The army had to [[yield to the enemy]].","군대는 [[적에게 굴복해야]] 했다."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"assisted","a":"1","e":"① hinder: 방해하다 (몇몇 이웃들이 긴 구조 작업 동안 소방관들을 도왔다.) / assist(돕다, 지원하다)의 반의어.","w":"② aid: 돕다\n③ comfort: 위로하다\n④ accompany: 동행하다","k":"몇몇 이웃들이 긴 구조 작업 동안 소방관들을 도왔다.","m":0,"s":"Several neighbors assisted the firefighters during the long rescue.","h":"assisted","c":["hinder","aid","comfort","accompany"],"mn":"돕다, 지원하다","wb":"assist","hk":"assisted(도왔다)는 assist(돕다)의 과거형이라 반대편은 hinder(방해하다). aid(돕다)는 같은 편, comfort(위로하다)·accompany(동행하다)는 뜻이 달라 함정.","ex":[["Volunteers [[assisted the nurses]] at the clinic.","자원봉사자들이 병원에서 [[간호사들을 도왔다]].","assist (동) 돕다, 지원하다"],["Could you [[assist me]] with this heavy box?","이 무거운 상자 때문에 [[나를 도와]] 줄 수 있니?","assist (동) 돕다, 지원하다"],["Heavy snow can [[hinder traffic]].","폭설은 [[교통을 방해할]] 수 있다.","hinder (동) 방해하다"]]},{"t":"WRITE","tn":"주관식 빈칸","f":"주관식","p":"다음 빈칸에 들어갈 알맞은 단어를 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"ring","a":"ring","e":"ring 반지, 고리","k":"그녀는 할머니가 그녀에게 준 은반지를 결코 빼지 않는다.","m":0,"s":"She never takes off the silver r______ that her grandmother gave her.","mn":"반지, 고리","hk":"ring(반지)은 끝이 -ng로 끝나는 짧은 단어. 대표 짝 silver ring(은반지), wedding ring(결혼반지)로 외우기.","ex":[["He bought a [[diamond ring]].","그는 [[다이아몬드 반지]]를 샀다."],["She lost her [[wedding ring]].","그녀는 [[결혼반지]]를 잃어버렸다."],["I keep my keys on a [[key ring]].","나는 열쇠를 [[열쇠고리]]에 걸어 둔다."]]},{"t":"POLY","tn":"다의어","f":"객관식","p":"다음 밑줄 친 단어들 중 나머지와 다른 의미로 쓰인 것을 고르시오.","wd":"practice","a":"4","e":"①연습 / ②연습 / ③연습 / ④관행, 관습 [④번만 의미가 다름]","k":"①매일의 연습이 발음을 향상시키는 유일한 방법이다.\n②그 팀은 매주 화요일 오후에 축구 연습이 있다.\n③너는 피아노 대회 전에 더 많은 연습이 필요하다.\n④이 오래된 관행은 마침내 대부분의 나라에서 금지되었다.","m":0,"c":["Daily practice is the only way to improve your pronunciation.","The team has soccer practice every Tuesday afternoon.","You need more practice before the piano contest.","This old practice was finally banned in most countries."],"hc":"practice|practice|practice|practice","mn":"연습 / 관행, 관습","hk":"practice(연습)는 반복해서 익히는 일, ④번 practice(관행, 관습)는 사회에서 오래 이어진 방식이라 다른 뜻. 연습은 daily practice(매일의 연습) 같은 짝.","ex":[["She does [[piano practice]] every day.","그녀는 매일 [[피아노 연습]]을 한다.","practice (명) 연습"],["We have [[basketball practice]] after school.","우리는 방과 후에 [[농구 연습]]이 있다.","practice (명) 연습"],["Child labor is a harmful [[practice]].","아동 노동은 해로운 [[관행]]이다.","practice (명) 관행, 관습"]]}]},{"day":31,"q":[{"t":"M2W","tn":"뜻 → 단어","f":"객관식","p":"다음 뜻을 보고 알맞은 단어를 고르시오.","wd":"scholar","a":"2","e":"② scholar: 학자","w":"① librarian: 사서\n③ journalist: 기자\n④ principal: 교장","m":0,"s":"\"학자\"","c":["librarian","scholar","journalist","principal"],"mn":"학자","hk":"scholar(학자)는 학문을 깊이 연구하는 사람. librarian(사서)은 도서관, journalist(기자)는 기사, principal(교장)은 학교의 책임자로 구분.","ex":[["He is a [[famous scholar]] of Korean history.","그는 한국사의 [[유명한 학자]]이다."],["The [[young scholar]] wrote a book about old maps.","그 [[젊은 학자]]는 옛 지도에 관한 책을 썼다."],["[[Scholars from around the world]] visited the library.","[[전 세계의 학자들]]이 그 도서관을 방문했다."]]},{"t":"REL","tn":"두 단어 관계","f":"객관식","p":"다음 두 단어의 관계와 같은 관계를 가진 것을 고르시오. (품사 변화 기준)","wd":"enjoy","a":"2","e":"② adapt (동) 적응하다 - adaptable (형) 적응력 있는","w":"① emotion (명) 감정 - emotional (형) 감정적인\n③ fiction (명) 소설, 허구 - fictional (형) 허구의\n④ miracle (명) 기적 - miraculous (형) 기적적인","m":0,"s":"enjoy - enjoyable","c":["emotion - emotional","adapt - adaptable","fiction - fictional","miracle - miraculous"],"hk":"enjoy(즐기다)-enjoyable(즐거운)은 동사에서 형용사로 가는 관계. adapt(적응하다)-adaptable(적응력 있는)도 같은 방향, 나머지는 명사에서 형용사라 속임수.","ex":[["We [[enjoy]] swimming in the lake.","우리는 호수에서 수영하는 것을 [[즐긴다]].","enjoy (동) 즐기다"],["It was [[an enjoyable trip]] for everyone.","모두에게 [[즐거운 여행]]이었다.","enjoyable (형) 즐거운"],["Animals must [[adapt to]] cold weather.","동물들은 추운 날씨에 [[적응해야]] 한다.","adapt (동) 적응하다"],["Children are [[adaptable]] to new places.","아이들은 새로운 곳에 [[적응력이 있다]].","adaptable (형) 적응력 있는"]]},{"t":"W2M","tn":"단어 → 뜻","f":"객관식","p":"다음 단어를 보고 알맞은 뜻을 고르시오.","wd":"ingredient","a":"2","e":"② ingredient: 재료, 성분","w":"① seasoning: 양념, 조미료\n③ nutrient: 영양분\n④ recipe: 조리법","m":0,"s":"ingredient","c":["양념, 조미료","재료, 성분","영양분","조리법"],"mn":"재료, 성분","hk":"ingredient(재료, 성분)는 요리나 제품에 들어가는 재료. seasoning(양념)·nutrient(영양분)와 구분하고, recipe(조리법)는 만드는 방법.","ex":[["Flour is the [[main ingredient]] in bread.","밀가루는 빵의 [[주재료]]이다."],["Milk is the [[secret ingredient]] in this soup.","우유가 이 수프의 [[비밀 재료]]이다."],["Check the [[list of ingredients]] on the box.","상자에 있는 [[성분 목록]]을 확인해라."]]},{"t":"COMMON","tn":"공통 빈칸","f":"주관식","p":"다음 빈칸에 공통으로 들어갈 알맞은 말을 쓰시오. (전체 단어 스펠링에 맞게 쓰기)","wd":"express","a":"express","e":"express (동) 표현하다, 나타내다 / (형) 급행의","k":"그녀는 제2언어로 자신의 진짜 감정을 잘 표현할 수 없었다.\n부산행 급행열차는 가는 길에 있는 모든 작은 역들을 그냥 지나친다.","m":0,"s":"She could not e______ her true feelings well in her second language.\nThe e______ train to Busan skips every small station along the way.","mn":"표현하다, 나타내다 / 급행의","hk":"express(표현하다, 동사)와 express(급행의, 형용사)는 철자가 같은 두 뜻. express feelings(감정을 표현하다)와 express train(급행열차)을 짝으로 묶기.","ex":[["Words cannot [[express]] how happy I am.","내가 얼마나 행복한지 말로는 [[표현할]] 수 없다.","express (동) 표현하다, 나타내다"],["She used a smile to [[express thanks]].","그녀는 미소로 [[고마움을 표현했다]].","express (동) 표현하다, 나타내다"],["We took [[an express train]] to Seoul.","우리는 서울행 [[급행열차]]를 탔다.","express (형) 급행의"]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"surgery","a":"4","e":"④ surgery: (의학적 치료 / 의사가 사람의 몸을 절개하는 / 그 일부를 고치거나 제거하기 위해) 수술 (의사가 몸의 일부를 고치거나 제거하기 위해 몸을 절개하는 치료)","w":"① vaccine: 백신\n② injection: 주사\n③ bandage: 붕대","k":"의학적 치료 / 의사가 사람의 몸을 절개하는 / 그 일부를 고치거나 제거하기 위해","m":0,"s":"\"medical treatment in which a doctor cuts open a person's body to repair or remove a part of it\"","c":["vaccine","injection","bandage","surgery"],"mn":"수술 (의사가 몸의 일부를 고치거나 제거하기 위해 몸을 절개하는 치료)","hk":"surgery(수술)는 몸을 절개해 고치거나 떼어 내는 치료. vaccine(백신)·injection(주사)은 찌르는 치료, bandage(붕대)는 감는 용품.","ex":[["He needed [[heart surgery]] last year.","그는 작년에 [[심장 수술]]이 필요했다."],["The doctor will [[perform surgery]] today.","의사가 오늘 [[수술을 할]] 것이다."],["He rested for a week [[after surgery]].","그는 [[수술 후]] 일주일간 쉬었다."]]},{"t":"DEF","tn":"영영정의","f":"객관식","p":"다음 영영 정의를 보고 알맞은 단어를 고르시오.","wd":"citizen","a":"3","e":"③ citizen: (법적으로 특정한 나라에 속한 사람 / 그리고 그 나라가 주는 권리를 가진) 시민, 국민 (법적으로 특정 국가에 속하며 그 나라가 주는 권리를 가진 사람)","w":"① immigrant: 이민자\n② tourist: 관광객\n④ resident: 거주자","k":"법적으로 특정한 나라에 속한 사람 / 그리고 그 나라가 주는 권리를 가진","m":0,"s":"\"a person who legally belongs to a particular country and has the rights that it gives\"","c":["immigrant","tourist","citizen","resident"],"mn":"시민, 국민 (법적으로 특정 국가에 속하며 그 나라가 주는 권리를 가진 사람)","hk":"citizen(시민, 국민)은 그 나라에 속해 권리를 가진 사람. tourist(관광객)는 방문자, immigrant(이민자)·resident(거주자)는 사는 사람일 뿐.","ex":[["She became [[a citizen]] of Canada.","그녀는 캐나다의 [[시민]]이 되었다."],["He is [[a Korean citizen]].","그는 [[한국 국민]]이다."],["The mayor spoke to [[the citizens of the town]].","시장은 [[그 도시의 시민들]]에게 연설했다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"connection","a":"2","e":"② connection: 연결, 연관 (과학자들은 수면과 기억 사이에 밀접한 연관이 있다는 것을 발견했다.)","w":"① correction: 정정, 수정\n③ confusion: 혼란\n④ contact: 연락","k":"과학자들은 수면과 기억 사이에 밀접한 연관이 있다는 것을 발견했다.","m":0,"s":"Scientists have found a close ________ between sleep and memory.","c":["correction","connection","confusion","contact"],"mn":"연결, 연관","hk":"connection(연결, 연관)이 정답, a close connection between(사이의 밀접한 연관)이 대표 짝. correction(정정)·confusion(혼란)은 철자만 비슷한 속임수.","ex":[["There is [[a connection between]] sleep and health.","수면과 건강 사이에는 [[연관성이 있다]]."],["The internet [[connection]] is slow here.","여기는 인터넷 [[연결]]이 느리다."],["There is [[no connection]] between the two events.","두 사건 사이에는 [[아무 연관]]도 없다."]]},{"t":"BLANK","tn":"빈칸 객관식","f":"객관식","p":"다음 빈칸에 가장 알맞은 단어를 고르시오.","wd":"consult","a":"2","e":"② consult: 상담하다, 진찰을 받다 (열이 내리지 않으면 가능한 한 빨리 의사의 진찰을 받아라.)","w":"① treat: 치료하다\n③ ignore: 무시하다\n④ mention: 언급하다","k":"열이 내리지 않으면 가능한 한 빨리 의사의 진찰을 받아라.","m":0,"s":"If the fever does not go away, ________ a doctor as soon as possible.","c":["treat","consult","ignore","mention"],"mn":"상담하다, 진찰을 받다","hk":"consult(상담하다, 진찰을 받다)는 consult a doctor(의사의 진찰을 받다)가 대표 짝. treat(치료하다)는 의사가 하는 쪽, ignore(무시하다)·mention(언급하다)은 어긋남.","ex":[["You should [[consult a doctor]].","너는 [[의사와 상담해야]] 한다."],["She [[consulted her teacher]] about the test.","그녀는 시험에 대해 [[선생님과 상담했다]]."],["[[Consult a lawyer]] before you sign.","서명하기 전에 [[변호사와 상담해라]]."]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음 밑줄 친 단어와 반대되는 의미를 가진 것을 고르시오.","wd":"delete","a":"2","e":"② insert: 끼워 넣다, 삽입하다 (파일을 실수로 삭제하면 다시 되돌릴 수 없다.) / delete(삭제하다, 지우다)의 반의어.","w":"① download: 내려받다\n③ erase: 지우다\n④ upload: 올리다","k":"파일을 실수로 삭제하면 다시 되돌릴 수 없다.","m":0,"s":"If you delete the file by mistake, you cannot get it back.","h":"delete","c":["download","insert","erase","upload"],"mn":"삭제하다, 지우다","hk":"delete(삭제하다)의 반대편은 insert(끼워 넣다). erase(지우다)는 같은 편이라 오답이고, download(내려받다)·upload(올리다)는 파일을 옮기는 말.","ex":[["Please [[delete the file]] now.","지금 [[그 파일을 삭제해]] 줘.","delete (동) 삭제하다, 지우다"],["She [[deleted the photo]] from her phone.","그녀는 휴대폰에서 [[사진을 지웠다]].","delete (동) 삭제하다, 지우다"],["Please [[insert a coin]] into the machine.","기계에 [[동전을 넣어]] 주세요.","insert (동) 끼워 넣다, 삽입하다"]]},{"t":"ANT","tn":"반의어","f":"객관식","p":"다음
