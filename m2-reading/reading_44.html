<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>M2 Reading 44</title>
<style>
:root{--pri:#1f4e79;--bg:#f5f7fa;--card:#fff;--ink:#1d2733;--mut:#6b7684;--line:#dde3ea;--ok:#1a7f4b;--okbg:#e6f5ec;--bad:#c0392b;--badbg:#fdecea;--sel:#fff3bf;--selb:#e0a800}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Noto Sans KR",system-ui,sans-serif;line-height:1.6}
.wrap{max-width:760px;margin:0 auto;padding:0 16px 80px}
header{padding:22px 0 8px}h1{margin:0;font-size:20px;color:var(--pri)}.sub{color:var(--mut);font-size:14px}

.gl{font-size:13px;color:var(--mut);margin:2px 0 0 34px}.gl.kr{font-size:15px;color:#4a5563;margin-top:0}

.note.found{background:var(--okbg)}.note.lost{background:var(--badbg)}.note.fine{background:#eef3f8}
.note b{display:block;margin-bottom:2px}.fx{margin:2px 0}.arr{color:var(--mut)}.wr{color:var(--bad);font-weight:700}.rt{color:var(--ok);font-weight:700}.pt{color:#33404f}.ko{margin-top:4px;color:var(--mut)}
.bar{position:sticky;bottom:0;background:#fffffff2;backdrop-filter:blur(6px);border-top:1px solid var(--line);padding:10px 16px;display:flex;justify-content:space-between;align-items:center;gap:10px;margin:0 -16px;z-index:5}
.bar .c{font-size:14px;color:var(--mut)}.bar .c b{color:var(--pri);font-size:16px}

button.ghost{background:#fff;color:var(--pri);border:1px solid var(--pri)}button:disabled{opacity:.4;cursor:default}
.sum{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0;font-size:15px}
.memo{background:#fffdf3;border:2px solid #e0b84a;border-radius:12px;padding:14px 16px;margin:26px 0}
.memo h2{margin:0 0 4px;font-size:17px;color:#8a5a00}.memo .hint{font-size:13px;color:var(--mut);margin-bottom:10px}
.mi{border-top:1px dashed #e0c98a;padding:10px 0}.mi:first-of-type{border-top:0}
.mi .no{display:inline-block;background:#8a5a00;color:#fff;border-radius:5px;font-size:12px;padding:0 6px;margin-right:6px}
.mi .en{font-size:17px;font-weight:700}.mi ul{margin:4px 0;padding-left:20px}.mi li{margin:1px 0}.mi .k{color:var(--mut);font-size:14.5px}
.gl b{color:var(--ink)}

.stage{margin:34px 0 4px;font-size:13px;font-weight:700;color:#fff;background:var(--pri);display:inline-block;padding:3px 12px;border-radius:99px}
.dlg{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin:10px 0}
.dlg .who{font-weight:700;color:var(--pri);margin-bottom:4px}
.dlg .ln{display:flex;gap:10px;padding:3px 0}.dlg .sp{min-width:22px;font-weight:700;color:var(--mut);white-space:nowrap}
.dlg .en{font-size:17px}.dlg .k,.dlg .kr{font-size:14.5px;color:#4a5563}.dlg .kr{margin-top:6px;border-top:1px dashed var(--line);padding-top:6px}
.q{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px 14px;margin:8px 0}
.qt{font-weight:700;margin-bottom:6px}.qn{display:inline-block;min-width:24px;color:var(--pri)}
.opt{display:flex;gap:8px;padding:8px 10px;margin:4px 0;border:1px solid var(--line);border-radius:8px;cursor:pointer;font-size:16px}
.opt:hover{background:#eef3f8}.opt.on{background:var(--sel);border-color:var(--selb)}
.opt.good{background:var(--okbg);border-color:var(--ok)}.opt.bad{background:var(--badbg);border-color:var(--bad);text-decoration:line-through}
.stem{font-weight:700;margin:12px 0 4px}.st{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:9px 12px;margin:6px 0;cursor:pointer;font-size:16px}.st:hover{background:#eef3f8}.st.on{background:var(--sel);border-color:var(--selb)}.st.hit{background:var(--okbg);border-color:var(--ok)}.st.miss{background:var(--badbg);border-color:var(--bad)}.st.x{text-decoration:line-through;color:var(--mut)}.note.sn{margin:0 0 6px}.q .note{margin:10px 0 0}.opt.ox{display:inline-flex;min-width:90px;justify-content:center;margin-right:8px}.cn{color:var(--mut)}
.grp{position:relative}.sec{position:sticky;top:0;z-index:4;background:var(--bg);display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:8px 0 8px 8px}.bd{background:var(--pri);color:#fff;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700}.bd2{background:var(--sel);color:#5c4400;font-size:12px;border-radius:99px;padding:1px 10px;font-weight:700;border:1px solid var(--selb)}.relay{display:flex;gap:6px;margin:12px 0 4px}.rs{flex:1;border:1.5px solid var(--line);background:#fff;border-radius:10px;padding:8px 10px;font-size:12.5px;line-height:1.35;color:var(--mut)}.rs b{display:block;font-size:11px;letter-spacing:.04em;color:var(--pri)}.rs.now{border-color:var(--pri);background:#eef4fa;color:var(--ink)}.rs.ok{border-color:var(--ok);background:var(--okbg);color:var(--ink)}.rs.ok b{color:var(--ok)}.rs.lk{opacity:.55}.rn{text-align:center;font-size:12px;color:var(--mut);margin:0 0 4px}.bmw{text-align:center;margin:2px 0 0}.bmk{align-items:center;gap:8px;font-size:12px;color:#7a5a00;background:#fff3bf;border:1px solid #e0a800;border-radius:99px;padding:2px 4px 2px 12px}.bmk button{background:#fff;color:#7a5a00;border:1px solid #e0a800;padding:1px 10px;font-size:12px;font-weight:600;border-radius:99px}.res{border-radius:14px;padding:18px 16px;margin:12px 0;text-align:center;border:2px solid}.rp{background:#e6f5ec;border-color:#1a7f4b}.rf{background:#fdecea;border-color:#c0392b}.rt2{font-weight:700;font-size:15px}.rp .rt2{color:#1a7f4b}.rf .rt2{color:#c0392b}.rpct{font-size:54px;font-weight:700;line-height:1.1}.rpct small{font-size:18px;margin-left:2px}.rl2{font-size:13px;color:var(--mut);margin-bottom:10px}.rtb{width:100%;border-collapse:collapse;font-size:14px;text-align:left;background:#fff;border-radius:8px;margin:6px 0 12px}.rtb td{padding:7px 10px;border-top:1px solid var(--line)}.rtb tr:first-child td{border-top:0}.rtb td:last-child{text-align:right}.part{position:relative}.pane{position:sticky;top:0;z-index:6;max-height:40vh;max-height:40dvh;overflow-y:auto;-webkit-overflow-scrolling:touch;background:var(--bg,#f2f6f9);padding:2px 0 8px;box-shadow:0 10px 8px -9px rgba(18,38,58,.45)}.pane .dlg{margin:0}.pane.open{position:static;max-height:none;overflow:visible;box-shadow:none}.pp.np{margin-top:8px}.pp .k{margin-bottom:2px}.hl{display:inline-block;font-size:11px;font-weight:700;color:var(--pri);border:1px solid var(--pri);border-radius:4px;padding:0 6px;margin:6px 0 2px}.memo{transform:rotate(-.4deg);box-shadow:0 6px 14px rgba(138,90,0,.15)}.grp{position:relative}.sumbox{margin:2px 0 8px 28px;padding:8px 10px;background:#f4f7fa;border-left:3px solid var(--pri);border-radius:4px;font-size:15px;line-height:1.5}.ow{font-size:13.5px;line-height:1.55;margin:4px 0;padding:6px 9px;border-radius:7px;background:#f4f6f8;border-left:3px solid #c9d2da}.ow.g{background:#e8f6ee;border-left-color:#1a7f4b}.ow b{margin-right:4px}</style></head><body><div class="wrap">

<script>
var D=[{"n":1,"tag":null,"en":"Modern street art comes in many different form, and it makes cities colorfully and lively.","ko":"현대 거리 예술은 여러 다양한 형태로 존재하며, 도시를 다채롭고 활기차게 만듭니다.","ok":false,"foot":[],"fixes":[{"wrong":"form","right":"forms","partial":false,"at":[7],"point":"명사의 복수형: many 뒤에는 복수명사 forms 사용","topic":"명사의 복수형","memo":"many 뒤에는 복수명사 forms 사용"},{"wrong":"colorfully","right":"colorful","partial":false,"at":[12],"point":"형용사와 부사: makes cities의 보어 자리에는 형용사 colorful 사용","topic":"형용사와 부사","memo":"makes cities의 보어 자리에는 형용사 colorful 사용"}]},{"n":2,"tag":null,"en":"Today, we are going to see some well-known street artworks in London.","ko":"오늘, 우리는 런던에 있는 몇몇 유명한 거리 예술 작품들을 살펴보겠습니다.","ok":true,"foot":[],"fixes":[]},{"n":3,"tag":null,"en":"The place that we are going to visit is Shoreditch.","ko":"우리가 방문할 장소는 쇼어디치입니다.","ok":true,"foot":[],"fixes":[]},{"n":4,"tag":null,"en":"Poorly workers used to live in this area, but now it is one of the hippest area in London.","ko":"가난한 노동자들이 이 지역에 살았었지만, 지금 이곳은 런던에서 가장 힙한 지역 중 한 곳입니다.","ok":false,"foot":[],"fixes":[{"wrong":"Poorly","right":"Poor","partial":false,"at":[0],"point":"형용사와 부사: 명사 workers를 꾸미는 말은 형용사 Poor 사용","topic":"형용사와 부사","memo":"명사 workers를 꾸미는 말은 형용사 Poor 사용"},{"wrong":"area","right":"areas","partial":false,"at":[16],"point":"명사의 복수형: one of the 뒤에는 복수명사 areas 사용","topic":"명사의 복수형","memo":"one of the 뒤에는 복수명사 areas 사용"}]},{"n":5,"tag":null,"en":"We can find so much great pieces of street art here. Do you see the painting over there?","ko":"우리는 이곳에서 정말 많은 멋진 거리 예술 작품들을 볼 수 있습니다. 저쪽에 있는 그림이 보이시나요?","ok":false,"foot":[],"fixes":[{"wrong":"much","right":"many","partial":false,"at":[4],"point":"수량 형용사 many/much: 셀 수 있는 pieces에는 many 사용","topic":"수량 형용사 many/much","memo":"셀 수 있는 pieces에는 many 사용"}]},{"n":6,"tag":null,"en":"It is by the artist STIK. He is famous at using only lines and dots in him paintings of human bodies.","ko":"그것은 예술가 STIK의 작품입니다. 그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다.","ok":false,"foot":[],"fixes":[{"wrong":"at","right":"for","partial":false,"at":[9],"point":"형용사+전치사: '~로 유명한'은 famous for 사용","topic":"형용사+전치사","memo":"'~로 유명한'은 famous for 사용"},{"wrong":"him","right":"his","partial":false,"at":[16],"point":"인칭대명사의 소유격: 명사 앞에는 소유격 his 사용","topic":"인칭대명사의 소유격","memo":"명사 앞에는 소유격 his 사용"}]},{"n":7,"tag":null,"en":"According to STIK, the three figures represents the past, present, and future of Shoreditch. Which figure represents which?","ko":"STIK에 따르면 저 세 인물은 쇼어디치의 과거, 현재, 그리고 미래를 나타냅니다. 어떤 인물이 어떤 것을 나타낼까요?","ok":false,"foot":[],"fixes":[{"wrong":"represents","right":"represent","partial":false,"at":[6],"point":"수일치: 주어 figures(복수)에는 represent 사용","topic":"수일치","memo":"주어 figures(복수)에는 represent 사용"}]},{"n":8,"tag":null,"en":"Well, look closely at the eyes of the three figure. They are just dots, but they will gives you a clue.","ko":"자, 세 인물의 눈을 자세히 보세요. 그것들은 그저 점이지만, 그 점들이 여러분에게 단서를 줄 겁니다.","ok":false,"foot":[],"fixes":[{"wrong":"figure","right":"figures","partial":false,"at":[9],"point":"수 표현과 명사: three 뒤에는 복수명사 figures 사용","topic":"수 표현과 명사","memo":"three 뒤에는 복수명사 figures 사용"},{"wrong":"gives","right":"give","partial":false,"at":[17],"point":"조동사 뒤 동사원형: 조동사 will 뒤에는 동사원형: give (gives 아님)","topic":"조동사 뒤 동사원형","memo":"조동사 will 뒤에는 동사원형: give (gives 아님)"}]},{"n":9,"tag":null,"en":"We is now in Finsbury Park to see a painting by Banksy, a internationally famous street artist.","ko":"우리는 이제 국제적으로 유명한 거리 예술가 Banksy의 그림을 보기 위해 핀즈베리 공원에 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"is","right":"are","partial":false,"at":[1],"point":"be동사의 현재형: 주어 We에는 are 사용","topic":"be동사의 현재형","memo":"주어 We에는 are 사용"},{"wrong":"a","right":"an","partial":false,"at":[12],"point":"관사 a/an: 모음 소리 internationally 앞에는 an 사용","topic":"관사 a/an","memo":"모음 소리 internationally 앞에는 an 사용"}]},{"n":10,"tag":null,"en":"Banksy's artworks often carry social message, and the green tree me see over there is a good example.","ko":"Banksy의 예술 작품들은 종종 사회적 메시지를 담고 있는데, 저쪽에 보이는 초록색 나무가 좋은 예입니다.","ok":false,"foot":[],"fixes":[{"wrong":"message","right":"messages","partial":false,"at":[5],"point":"명사의 복수형: 형용사 social 뒤 복수명사 messages 사용","topic":"명사의 복수형","memo":"형용사 social 뒤 복수명사 messages 사용"},{"wrong":"me","right":"you","partial":false,"at":[10],"point":"인칭대명사의 주격: 관계절 주어 자리에는 주격 you 사용","topic":"인칭대명사의 주격","memo":"관계절 주어 자리에는 주격 you 사용"}]},{"n":11,"tag":null,"en":"As you can see, he created a green tree by spray green paint on a wall behind a leafless trees.","ko":"보시다시피 그는 잎이 없는 나무 뒤쪽 벽에 초록색 페인트를 뿌려서 초록색 나무를 만들었습니다.","ok":false,"foot":[],"fixes":[{"wrong":"spray","right":"spraying","partial":false,"at":[10],"point":"전치사 뒤 동명사: 전치사 by 뒤에는 동명사 spraying 사용","topic":"전치사 뒤 동명사","memo":"전치사 by 뒤에는 동명사 spraying 사용"},{"wrong":"trees","right":"tree","partial":false,"at":[19],"point":"명사의 단수·복수: a 뒤에는 단수명사 tree 사용","topic":"명사의 단수·복수","memo":"a 뒤에는 단수명사 tree 사용"}]},{"n":12,"tag":null,"en":"Next to the tree, there is a person who is holding a sprayer. What message does Banksy want to give us through this painting?","ko":"그 나무 옆에는 분무기를 들고 있는 사람이 한 명 있습니다. Banksy는 이 그림을 통해 우리에게 어떤 메시지를 전하고 싶은 걸까요?","ok":true,"foot":[],"fixes":[]},{"n":13,"tag":null,"en":"In many people's opinion, he is telling we that nature is having a hard time. They think he wants us to take better care of it.","ko":"많은 사람들의 의견에 따르면, 그는 자연이 힘든 시간을 보내고 있다는 것을 우리에게 말하려는 것 같습니다. 그들은 우리가 자연을 더 잘 보살피기를 Banksy가 원한다고 생각합니다.","ok":false,"foot":[],"fixes":[{"wrong":"we","right":"us","partial":false,"at":[7],"point":"인칭대명사의 목적격: 동사 telling의 목적어는 목적격 us 사용","topic":"인칭대명사의 목적격","memo":"동사 telling의 목적어는 목적격 us 사용"}]},{"n":14,"tag":null,"en":"The finally stop of our tour today is Muswell Hill. Can't see any street artworks?","ko":"오늘 우리 투어의 마지막 장소는 머스웰 힐입니다. 어떤 거리 예술 작품도 보이지 않나요?","ok":false,"foot":[],"fixes":[{"wrong":"finally","right":"final","partial":false,"at":[1],"point":"형용사와 부사: 명사 stop을 꾸미는 말은 형용사 final 사용","topic":"형용사와 부사","memo":"명사 stop을 꾸미는 말은 형용사 final 사용"}]},{"n":15,"tag":null,"en":"Well, look down and look closely. Does you see the little chewing gum paintings?","ko":"그렇다면, 아래를 내려다보고 자세히 살펴보세요. 작은 껌 그림들이 보이나요?","ok":false,"foot":[],"fixes":[{"wrong":"Does","right":"Do","partial":false,"at":[6],"point":"의문문의 조동사 do/does: 주어 you에는 Do 사용","topic":"의문문의 조동사 do/does","memo":"주어 you에는 Do 사용"}]},{"n":16,"tag":null,"en":"They are by the artist Ben Wilson. Wilson is well known for painting pictures on gum that people drops on the street.","ko":"이것들은 예술가 Ben Wilson의 작품입니다. Wilson은 사람들이 길에 버리는 껌에 그림을 그리는 것으로 잘 알려져 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"drops","right":"drop","partial":false,"at":[18],"point":"수일치: 주어 people(복수)에는 drop 사용","topic":"수일치","memo":"주어 people(복수)에는 drop 사용"}]},{"n":17,"tag":null,"en":"His gum paintings often carries personal messages from people he meets on the street.","ko":"그의 껌 그림들은 그가 길에서 만나는 사람들의 개인적인 메시지를 종종 담고 있습니다.","ok":false,"foot":[],"fixes":[{"wrong":"carries","right":"carry","partial":false,"at":[4],"point":"수일치: 주어 paintings(복수)에는 carry 사용","topic":"수일치","memo":"주어 paintings(복수)에는 carry 사용"}]},{"n":18,"tag":null,"en":"For example, the one over here is an happy birthday wish for a loved one.","ko":"예를 들어, 여기 있는 그림은 사랑하는 사람을 위한 생일 축하 메시지입니다.","ok":false,"foot":[],"fixes":[{"wrong":"an","right":"a","partial":false,"at":[7],"point":"관사 a/an: 자음 소리 happy 앞에는 a 사용","topic":"관사 a/an","memo":"자음 소리 happy 앞에는 a 사용"}]},{"n":19,"tag":null,"en":"Wilson's gum paintings are tiny, but they give great pleasure to many people.","ko":"Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다.","ok":true,"foot":[],"fixes":[]}];var PP=[["Modern street art comes in many different forms, and it makes cities colorful and lively.","현대 거리 예술은 여러 다양한 형태로 존재하며, 도시를 다채롭고 활기차게 만듭니다.",1],["Today, we are going to see some well-known street artworks in London.","오늘, 우리는 런던에 있는 몇몇 유명한 거리 예술 작품들을 살펴보겠습니다.",0],["The place that we are going to visit is Shoreditch.","우리가 방문할 장소는 쇼어디치입니다.",1],["Poor workers used to live in this area, but now it is one of the hippest areas i  gum paintings?","작은 껌 그림들이 보이나요?",0],["They are by the artist Ben Wilson.","이것들은 예술가 Ben Wilson의 작품입니다.",0],["Wilson is well known for painting pictures on gum that people drop on the street.","Wilson은 사람들이 길에 버리는 껌에 그림을 그리는 것으로 잘 알려져 있습니다.",0],["His gum paintings often carry personal messages from people he meets on the street.","그의 껌 그림들은 그가 길에서 만나는 사람들의 개인적인 메시지를 종종 담고 있습니다.",0],["For example, the one over here is a happy birthday wish for a loved one.","예를 들어, 여기 있는 그림은 사랑하는 사람을 위한 생일 축하 메시지입니다.",0],["Wilson's gum paintings are tiny, but they give great pleasure to many people.","Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다.",0]];var RNUM=44;var TITLE_EN="Street Art in London";var PASS_EN=["Street Art in London","Modern street art comes in many different forms, and it makes cities colorful and lively. Today, we are going to see some well-known street artworks in London.","The place that we are going to visit is Shoreditch. Poor workers used to live in this area, but now it is one of the hippest areas in London. We can find so many great pieces of street art here. Do you see the painting over there? It is by the artist STIK. He is famous for using only lines and dots in his paintings of human bodies. According to STIK, the three figures represent the past, present, and future of Shoreditch. Which figure represents which? Well, look closely at the eyes of the three figures. They are just dots, but they will give you a clue.","We are now in Finsbury Park to see a painting by Banksy, an internationally famous street artist. Banksy's artworks often carry social messages, and the green tree you see over there is a good example. As you can see, he created a green tree by spraying green paint on a wall behind a leafless tree. Next to the tree, there is a person who is holding a sprayer. What message does Banksy want to give us through this painting? In many people's opinion, he is telling us that nature is having a hard time. They think he wants us to take better care of it.","The final stop of our tour today is Muswell Hill. Can't see any street artworks? Well, look down and look closely. Do you see the little chewing gum paintings? They are by the artist Ben Wilson. Wilson is well known for painting pictures on gum that people drop on the street. His gum paintings often carry personal messages from people he meets on the street. For example, the one over here is a happy birthday wish for a loved one. Wilson's gum paintings are tiny, but they give great pleasure to many people."];var PASS_KO=["런던의 거리 예술","현대 거리 예술은 여러 다양한 형태로 존재하며, 도시를 다채롭고 활기차게 만듭니다. 오늘, 우리는 런던에 있는 몇몇 유명한 거리 예술 작품들을 살펴보겠습니다.","우리가 방문할 장소는 쇼어디치입니다. 가난한 노동자들이 이 지역에 살았었지만, 지금 이곳은 런던에서 가장 힙한 지역 중 한 곳입니다. 우리는 이곳에서 정말 많은 멋진 거리 예술 작품들을 볼 수 있습니다. 저쪽에 있는 그림이 보이시나요? 그것은 예술가 STIK의 작품입니다. 그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다. STIK에 따르면 저 세 인물은 쇼어디치의 과거, 현재, 그리고 미래를 나타냅니다. 어떤 인물이 어떤 것을 나타낼까요? 자, 세 인물의 눈을 자세히 보세요. 그것들은 그저 점이지만, 그 점들이 여러분에게 단서를 줄 겁니다.","우리는 이제 국제적으로 유명한 거리 예술가 Banksy의 그림을 보기 위해 핀즈베리 공원에 있습니다. Banksy의 예술 작품들은 종종 사회적 메시지를 담고 있는데, 저쪽에 보이는 초록색 나무가 좋은 예입니다. 보시다시피 그는 잎이 없는 나무 뒤쪽 벽에 초록색 페인트를 뿌려서 초록색 나무를 만들었습니다. 그 나무 옆에는 분무기를 들고 있는 사람이 한 명 있습니다. Banksy는 이 그림을 통해 우리에게 어떤 메시지를 전하고 싶은 걸까요? 많은 사람들의 의견에 따르면, 그는 자연이 힘든 시간을 보내고 있다는 것을 우리에게 말하려는 것 같습니다. 그들은 우리가 자연을 더 잘 보살피기를 Banksy가 원한다고 생각합니다.","오늘 우리 투어의 마지막 장소는 머스웰 힐입니다. 어떤 거리 예술 작품도 보이지 않나요? 그렇다면, 아래를 내려다보고 자세히 살펴보세요. 작은 껌 그림들이 보이나요? 이것들은 예술가 Ben Wilson의 작품입니다. Wilson은 사람들이 길에 버리는 껌에 그림을 그리는 것으로 잘 알려져 있습니다. 그의 껌 그림들은 그가 길에서 만나는 사람들의 개인적인 메시지를 종종 담고 있습니다. 예를 들어, 여기 있는 그림은 사랑하는 사람을 위한 생일 축하 메시지입니다. Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다."];var DG=[{"qs":[{"n":1,"q":"위 대화의 내용과 일치하지 않는 것은?","o":["Liam은 세빛 공원에 어떻게 가는지 알고 싶어 한다.","소미는 지하철을 이용하는 것을 추천한다.","Liam은 3호선을 타고 세빛역에서 하차해야 한다.","세빛역까지 가는 데 걸리는 시간은 약 40분이다.","이번 주 토요일에 세빛 공원에서 과학 박람회가 열린다."],"a":4,"ans":"이번 주 토요일에 세빛 공원에서 과학 박람회가 열린다.","evs":[["Somi, I need help. What's the best way to get to Sebit Park from here?","소미야, 도움이 필요해. 여기서 세빛 공원까지 가는 가장 좋은 방법이 뭐야?"],["Sebit Pa  subway is better.","세빛 공원? 음, 버스나 지하철로 갈 수 있는데, 지하철이 더 나아."],"ow":["오답 ✕ — 'you can get there by bus or by subway'(버스나 지하철로 갈 수 있는데)에서 두 가지 방법이 있음을 알 수 있다. 답할 수 있는 질문이다.","오답 ✕ — 'Take line 3'(3호선을 타)에서 3호선임을 알 수 있다. 답할 수 있다.","오답 ✕ — 'get off at Sebit Station'(세빛역에서 내려)에서 세빛역임을 알 수 있다. 답할 수 있다.","오답 ✕ — 'Let's meet here at 10.'(여기서 10시에 만나자.)에서 10시임을 알 수 있다. 답할 수 있다.","정답 ○ — 미술 박람회의 입장료에 대한 언급은 대화 어디에도 없다. 가장 가까운 문장은 'there is an art fair this Saturday'뿐이므로 답할 수 없다."],"memo":["박람회 입장료는 대화에 나오지 않는다.","근거: 입장료 언급 없음 (가장 가까운 문장: there is an art fair this Saturday.)","함정: 방법(버스·지하철), 호선, 역, 만나는 시간은 모두 대화에 나온다."],"why":"입장료는 대화에서 알 수 없으므로 ⑤."}],"dlg":[["B","Somi, I need help. What's the best way to get to Sebit Park from here?","소미야, 도움이 필요해. 여기서 세빛 공원까지 가는 가장 좋은 방법이 뭐야?"],["G","Sebit Park? Well, you can get there by bus or by subway, but the subway is better.","세빛 공원? 음, 버스나 지하철로 갈 수 있는데, 지하철이 더 나아."],["B","OK. Which line should I take?","알겠어. 몇 호선을 타야 해?"],["G","Take line 3, and get off at Sebit Station.","3호선을 타고 세빛역에서 내려."],["B","Line 3 and get off at Sebit Station. How long will it take?","3호선을 타고 세빛역에서 내리라고. 얼마나 걸릴까?"],["G","It'll take about 40 minutes.","40분 정도 걸릴 거야."],["B","Is it that far?","그렇게 멀어?"],["G","Yes. Anyway, why are you going to Sebit Park, Liam?","응. 그런데 세빛 공원에는 왜 가는 거야, Liam?"],["B","Oh, there is an art fair this Saturday. You can come with me if you want.","아, 이번 주 토요일에 미술 박람회가 있어. 원하면 나랑 같이 가도 돼."],["G","Really? I'm free this Saturday. Let's go together.","정말? 나 이번 주 토요일에 한가해. 같이 가자."],["B","Perfect. Let's meet here at 10.","좋아. 여기서 10시에 만나자."]]},{"qs":[{"n":3,"q":"다음 대화의 내용과 일치하지 않는 것은?","o":["The boy's destination is the National Art Museum.","The boy can go to the National Art Museum on foot.","The boy should go straight for about 500 meters and make a right turn to the museum.","The boy asks about the time that is needed to get to the museum.","The boy can arrive at the National Art Museum in about 15 minutes."],"a":2,"ans":"The boy should go straight for about 500 meters and make a right turn to the museum.","evs":[["You can walk. Go straight for about 500 meters and turn left. It'll be on your right.","걸어서 갈 수 있어요. 500미터 정도 직진한 다음 왼쪽으로 도세요. 오른쪽에 있을 거예요."]],"ev":["You can walk. Go straight for about 500 meters and turn left. It'll be on your right.","걸어서 갈 수 있어요. 500미터 정도 직진한 다음 왼쪽으로 도세요. 오른쪽에 있을 거예요."],"ow":["오답 ✕ — 소년이 'I'm going to the National Art Museum.'(제가 국립 미술관에 가려고 하는데요.)이라고 했으므로 목적지는 국립 미술관이다. 일치한다.","오답 ✕ — 소녀가 'You can walk.'(걸어서 갈 수 있어요.)라고 했으므로 걸어서 갈 수 있다. 일치한다.","정답 ○ — 소녀는 'Go straight for about 500 meters and turn left.'(500미터 정도 직진한 다음 왼쪽으로 도세요.)라고 했다. 오른쪽(right turn)이 아니라 왼쪽으로 돌아야 하므로 일치하지 않는다.","오답 ✕ — 소년이 'How long will it take?'(얼마나 걸릴까요?)라고 물으므로 걸리는 시간을 묻는다. 일치한다.","오답 ✕ — 소녀가 'Only about 15 minutes.'(15분 정도밖에 안 걸려요.)라고 했으므로 일치한다."],"memo":["오른쪽이 아니라 왼쪽으로 돌아야 한다.","근거: Go straight for about 500 meters and turn left.(500미터 정도 직진한 다음 왼쪽으로 도세요.)","함정: 'It'll be on your right'(오른쪽에 있을 거예요)는 미술관의 위치이지 도는 방향이 아니다."],"why":"500미터 직진 후 왼쪽으로 돌아야 하므로 ③이 불일치."}],"dlg":[["B","Excuse me. I'm going to the National Art Museum. What's the best way to get there?","실례합니다. 제가 국립 미술관에 가려고 하는데요. 거기에 가는 가장 좋은 방법이 뭔가요?"],["G","You can walk. Go straight for about 500 meters and turn left. It'll be on your right.","걸어서 갈 수 있어요. 500미터 정도 직진한 다음 왼쪽으로 도세요. 오른쪽에 있을 거예요."],["B","I see. How long will it take?","그렇군요. 얼마나 걸릴까요?"],["G","Only about 15 minutes.","15분 정도밖에 안 걸려요."],["B","Really? Thanks.","정말요? 고맙습니다."]]},{"qs":[{"n":4,"q":"윗글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["bus - 30","subway - 20","subway - 30","taxi - 30","bus - 20"],"a":2,"ans":"subway - 30","evs":[["You can take the subway.","지하철을 타면 돼요."],["I think it'll take about 30 minutes.","30분 정도 걸릴 것 같아요."]],"ev":["You can take the subway.","지하철을 타면 돼요."],"ow":["오답 ✕ — 걸리는 시간 30분은 맞지만 소년은 'You can take the subway.'(지하철을 타면 돼요.)라고 했으므로 버스(bus)가 아니다.","오답 ✕ — subway는 맞지만 'I think it'll take about 30 minutes.'(30분 정도 걸릴 것 같아요.)라 글의 내용과 일치하는 것은?","o":["Shoreditch used to be home to rich artists.","STIK is famous for using only lines and dots.","The three figures stand for London's past, present, and future.","The eyes of the three figures are painted in many colors.","The tour starts in Finsbury Park."],"a":1,"ans":"STIK is famous for using only lines and dots.","evs":[["Poor workers used to live in this area, but now it is one of the hippest areas in London.","가난한 노동자들이 이 지역에 살았었지만, 지금 이곳은 런던에서 가장 힙한 지역 중 한 곳입니다."],["He is famous for using only lines and dots in his paintings of human bodies.","그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다."],["According to STIK, the three figures represent the past, present, and future of Shoreditch.","STIK에 따르면 저 세 인물은 쇼어디치의 과거, 현재, 그리고 미래를 나타냅니다."],["They are just dots, but they will give you a clue.","그것들은 그저 점이지만, 그 점들이 여러분에게 단서를 줄 겁니다."]],"ev":["Poor workers used to live in this area, but now it is one of the hippest areas in London.","가난한 노동자들이 이 지역에 살았었지만, 지금 이곳은 런던에서 가장 힙한 지역 중 한 곳입니다."],"ow":["오답 ✕ — 'Poor workers used to live in this area'(가난한 노동자들이 이 지역에 살았었지만)라고 했으므로 부유한 예술가가 아니라 가난한 노동자들이 살았다.","정답 ○ — 'He is famous for using only lines and dots in his paintings of human bodies.'(그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다.)라고 했으므로 STIK은 선과 점만 사용하는 것으로 유명하다.","오답 ✕ — 'the three figures represent the past, present, and future of Shoreditch'(저 세 인물은 쇼어디치의 과거, 현재, 그리고 미래를 나타냅니다)이므로 런던 전체가 아니라 쇼어디치의 과거, 현재, 미래이다.","오답 ✕ — 'They are just dots'(그것들은 그저 점이지만)라고 했으므로 눈은 여러 색이 아니라 점으로만 되어 있다.","오답 ✕ — 'The place that we are going to visit is Shoreditch.'(우리가 방문할 장소는 쇼어디치입니다.)이므로 투어는 쇼어디치에서 시작한다. 핀즈베리 공원은 그다음 장소이다."],"memo":["STIK은 선과 점만 사용해 인체를 그리는 것으로 유명하다.","근거: He is famous for using only lines and dots in his paintings of human bodies.(그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다.)","함정: 세 인물은 '런던'이 아니라 '쇼어디치'의 과거·현재·미래를 나타낸다."],"why":"STIK은 선과 점만 사용하는 작가이다."},{"n":7,"q":"윗글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["colors - future","lines - history","lines - future","words - future","lines - garden"],"a":2,"ans":"lines - future","evs":[["He is famous for using only lines and dots in his paintings of human bodies.","그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다."],["According to STIK, the three figures represent the past, present, and future of Shoreditch.","STIK에 따르면 저 세 인물은 쇼어디치의 과거, 현재, 그리고 미래를 나타냅니다."]],"ev":["He is famous for using only lines and dots in his paintings of human bodies.","그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다."],"ow":["오답 ✕ — future는 맞지만 STIK은 'only lines and dots'(선과 점만)를 사용하므로 colors(색)가 아니다.","오답 ✕ — lines는 맞지만 세 인물은 'the past, present, and future'(과거, 현재, 그리고 미래)를 나타내므로 history가 아니다.","정답 ○ — 'using only lines and dots'(선과 점만을 사용하는)와 'the past, present, and future of Shoreditch'(쇼어디치의 과거, 현재, 그리고 미래)에서 (A) lines, (B) future이다.","오답 ✕ — 글자(words)를 쓴다는 말은 없고 선과 점만 사용한다.","오답 ✕ — lines는 맞지만 세 인물이 나타내는 것은 garden(정원)이 아니라 쇼어디치의 미래이다."],"memo":["(A) lines, (B) future","근거: the three figures represent the past, present, and future of Shoreditch(저 세 인물은 쇼어디치의 과거, 현재, 그리고 미래를 나타냅니다)","함정: STIK의 그림에는 색이 아니라 선과 점만 쓰인다."],"why":"STIK은 선과 점으로 쇼어디치의 과거·현재·미래를 그렸다.","sum":"STIK paints human bodies with only (A) and dots, and the three figures represent the past, present, and (B) of Shoreditch.","lab":"완성된 요약문 : "}],"pp":[["Modern street art comes in many different forms, and it makes cities colorful and lively.","현대 거리 예술은 여러 다양한 형태로 존재하며, 도시를 다채롭고 활기차게 만듭니다."],["Today, we are going to see some well-known street artworks in London.","오늘, 우리는 런던에 있는 몇몇 유명한 거리 예술 작품들을 살펴보겠습니다."],["The place that we are going to visit is Shoreditch.","우리가 방문할 장소는 쇼어디치입니다."],["Poor workers used to live in this area, but now it is one of the hippest areas in London.","가난한 노동자들이 이 지역에 살았었지만, 지금 이곳은 런던에서 가장 힙한 지역 중 한 곳입니다."],["We can find so many great pieces of street art here.","우리는 이곳에서 정말 많은 멋진 거리 예술 작품들을 볼 수 있습니다."],["Do you see the painting over there?","저쪽에 있는 그림이 보이시나요?"],["It is by the artist STIK.","그것은 예술가 STIK의 작품입니다."],["He is famous for using only lines and dots in his paintings of human bodies.","그는 인체를 그린 그림에서 선과 점만을 사용하는 것으로 유명합니다."],["According to STIK, the three figures represent the past, present, and future of Shoreditch.","STIK에 따르면 저 세 인물은 쇼어디치의 과거, 현재, 그리고 미래를 나타냅니다."],["Which figure represents which?","어떤 인물이 어떤 것을 나타낼까요?"],["Well, look closely at the eyes of the three figures.","자, 세 인물의 눈을 자세히 보세요."],["They are just dots, but they will give you a clue.","그것들은 그저 점이지만, 그 점들이 여러분에게 단서를 줄 겁니다."]]},{"qs":[{"n":8,"q":"윗글의 내용과 일치하는 것은?","o":["Banksy는 하얀 종이에 검은 펜으로 그림을 그렸다.","초록색 나무는 실제로 살아 있는 나무이다.","Banksy는 잎이 없는 나무 뒤 벽에 초록색 페인트를 뿌려 초록색 나무를 만들었다.","그림 속 사람은 나무에 물을 주고 있다.","모든 사람이 Banksy가 도시 개발을 비판한다고 생각한다."],"a":2,"ans":"Banksy는 잎이 없는 나무 뒤 벽에 초록색 페인트를 뿌려 초록색 나무를 만들었다.","evs":[["As you can see, he created a green tree by spraying green paint on a wall behind a leafless tree.","보시다시피 그는 잎이 없는 나무 뒤쪽 벽에 초록색 페인트를 뿌려서 초록색 나무를 만들었습니다."],["Next to the tree, there is a person who is holding a sprayer.","그 나무 옆에는 분무기를 들고 있는 사람이 한 명 있습니다."]],"ev":["As you can see, he created a green tree by spraying green paint on a wall behind a leafless tree.","보시다시피 그는 잎이 없는 나무 뒤쪽 벽에 초록색 페인트를 뿌려서 초록색 나무를 만들었습니다."],"ow":["오답 ✕ — 'spraying green paint on a wall'(벽에 초록색 페인트를 뿌려서)라고 했으므로 종이에 펜으로 그린 것이 아님.","오답 ✕ — 'a green tree by spraying green paint on a wall behind a leafless tree'(잎 없는 나무 뒤 벽에 칠해 만든 초록 나무)이므로 살아 있는 나무가 아님.","정답 ○ — 'he created a green tree by spraying green paint on a wall behind a leafless tree'(잎이 없는 나무 뒤 벽에 초록색 페인트를 뿌려 만들었다)이므로 맞음.","오답 ✕ — 'there is a person who is holding a sprayer'(분무기를 들고 있는 사람)라고 했지 물을 주고 있다는 말은 없음.","오답 ✕ — 'In many people's opinion, he is telling us that nature is having a hard time.'(자연이 힘든 시간을 보내고 있다고 말하는 것)이며 도시 개발 비판은 언급이 없음."],"memo":["정답 ③: 벽에 초록 페인트를 뿌려 초록 나무를 만들었다","근거: he created a green tree by spraying green paint on a wall behind a leafless tree.","함정: 살아 있는 나무가 아니라 벽에 뿌린 페인트"],"why":"Banksy는 잎 없는 나무 뒤 벽에 초록 페인트를 뿌려 초록 나무를 만들었다."},{"n":9,"q":"윗글의 내용을 한 문장으로 요약할 때, 빈칸 (A), (B)에 들어갈 말로 가장 알맞은 것은?","o":["art - care","nature - care","nature - fun","city - care","nature - risk"],"a":1,"ans":"nature - care","evs":[["In many people's opinion, he is telling us that nature is having a hard time.","많은 사람들의 의견에 따르면, 그는 자연이 힘든 시간을 보내고 있다는 것을 우리에게 말하려는 것 같습니다."],["They think he wants us to take better care of it.","그들은 우리가 자연을 더 잘 보살피기를 Banksy가 원한다고 생각합니다."]],"ev":["In many people's opinion, he is telling us that nature is having a hard time.","많은 사람들의 의견에 따르면, 그는 자연이 힘든 시간을 보내고 있다는 것을 우리에게 말하려는 것 같습니다."],"ow":["오답 ✕ — 'he is telling us that nature is having a hard time'(자연이 힘든 시간을 보내고 있다)고 했으므로 힘든 것은 art(예술)가 아니라 nature(자연)이다.","정답 ○ — 'nature is having a hard time'(자연이 힘든 시간을 보내고 있다)과 'He wants us to take better care of it.'(우리가 자연을 더 잘 보살피기를 원한다)에서 (A) nature, (B) care이다.","오답 ✕ — nature는 맞지만 'take better care of it'(그것을 더 잘 보살피다)이므로 fun(재미)이 아니다.","오답 ✕ — 힘든 시간을 보내는 것은 city(도시)가 아니라 nature(자연)이다.","오답 ✕ — nature는 맞지만 'take better risk'는 말이 되지 않고, 본문은 take better care이다."],"memo":["(A) nature, (B) care","근거: they think he wants us to take better care of it(그들은 우리가 자연을 더 잘 보살피기를 Banksy가 원한다고 생각합니다)","함정: 힘든 시간을 보내는 것은 도시가 아니라 자연이다."],"why":"Banksy는 자연을 더 잘 보살피라는 메시지를 전한다.","sum":"Many people think Banksy's green tree shows that (A) is having a hard time and that we should take better (B) of it.","lab":"완성된 요약문 : "}],"pp":[["We are now in Finsbury Park to see a painting by Banksy, an internationally famous street artist.","우리는 이제 국제적으로 유명한 거리 예술가 Banksy의 그림을 보기 위해 핀즈베리 공원에 있습니다."],["Banksy's artworks often carry social messages, and the green tree you see over there is a good example.","Banksy의 예술 작품들은 종종 사회적 메시지를 담고 있는데, 저쪽에 보이는 초록색 나무가 좋은 예입니다."],["As you can see, he created a green tree by spraying green paint on a wall behind a leafless tree.","보시다시피 그는 잎이 없는 나무 뒤쪽 벽에 초록색 페인트를 뿌려서 초록색 나무를 만들었습니다."],["Next to the tree, there is a person who is holding a sprayer.","그 나무 옆에는 분무기를 들고 있는 사람이 한 명 있습니다."],["What message does Banksy want to give us through this painting?","Banksy는 이 그림을 통해 우리에게 어떤 메시지를 전하고 싶은 걸까요?"],["In many people's opinion, he is telling us that nature is having a hard time.","많은 사람들의 의견에 따르면, 그는 자연이 힘든 시간을 보내고 있다는 것을 우리에게 말하려는 것 같습니다."],["They think he wants us to take better care of it.","그들은 우리가 자연을 더 잘 보살피기를 Banksy가 원한다고 생각합니다."]]},{"qs":[{"n":10,"q":"윗글의 내용과 일치하지 않는 것은?","o":["투어의 마지막 장소는 머스웰 힐이다.","껌 그림은 Ben Wilson의 작품이다.","Wilson은 사람들이 길에 버리는 껌에 그림을 그린다.","Wilson의 껌 그림에는 그가 길에서 만나는 사람들의 개인적인 메시지가 담기기도 한다.","Wilson의 껌 그림은 매우 커서 멀리서도 쉽게 눈에 띈다."],"a":4,"ans":"Wilson의 껌 그림은 매우 커서 멀리서도 쉽게 눈에 띈다.","evs":[["The final stop of our tour today is Muswell Hill.","오늘 우리 투어의 마지막 장소는 머스웰 힐입니다."],["They are by the artist Ben Wilson.","이것들은 예술가 Ben Wilson의 작품입니다."],["Wilson is well known for painting pictures on gum that people drop on the street.","Wilson은 사람들이 길에 버리는 껌에 그림을 그리는 것으로 잘 알려져 있습니다."],["His gum paintings often carry personal messages from people he meets on the street.","그의 껌 그림들은 그가 길에서 만나는 사람들의 개인적인 메시지를 종종 담고 있습니다."],["Wilson's gum paintings are tiny, but they give great pleasure to many people.","Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다."]],"ev":["The final stop of our tour today is Muswell Hill.","오늘 우리 투어의 마지막 장소는 머스웰 힐입니다."],"ow":["오답 ✕ — 'The final stop of our tour today is Muswell Hill.'(오늘 우리 투어의 마지막 장소는 머스웰 힐입니다.)이므로 일치한다.","오답 ✕ — 'They are by the artist Ben Wilson.'(이것들은 예술가 Ben Wilson의 작품입니다.)이므로 일치한다.","오답 ✕ — 'Wilson is well known for painting pictures on gum that people drop on the street.'(Wilson은 사람들이 길에 버리는 껌에 그림을 그리는 것으로 잘 알려져 있습니다.)이므로 일치한다.","오답 ✕ — 'His gum paintings often carry personal messages from people he meets on the street.'(그의 껌 그림들은 그가 길에서 만나는 사람들의 개인적인 메시지를 종종 담고 있습니다.)이므로 일치한다.","정답 ○ — 'Wilson's gum paintings are tiny'(Wilson의 껌 그림들은 아주 작지만)라고 했고 'Can't see any street artworks? Well, look down and look closely.'(어떤 거리 예술 작품도 보이지 않나요? 그렇다면, 아래를 내려다보고 자세히 살펴보세요.)라고 했으므로 크고 눈에 띈다는 말은 일치하지 않는다."],"memo":["Wilson의 껌 그림은 매우 작아서 자세히 봐야 보인다.","근거: Wilson's gum paintings are tiny, but they give great pleasure to many people.(Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다.)","함정: 작지만(tiny) 큰 기쁨을 준다는 점을 '크다'로 바꾼 보기이다."],"why":"껌 그림은 매우 작으므로 ⑤가 불일치."}],"pp":[["The final stop of our tour today is Muswell Hill.","오늘 우리 투어의 마지막 장소는 머스웰 힐입니다."],["Can't see any street artworks?","어떤 거리 예술 작품도 보이지 않나요?"],["Well, look down and look closely.","그렇다면, 아래를 내려다보고 자세히 살펴보세요."],["Do you see the little chewing gum paintings?","작은 껌 그림들이 보이나요?"],["They are by the artist Ben Wilson.","이것들은 예술가 Ben Wilson의 작품입니다."],["Wilson is well known for painting pictures on gum that people drop on the street.","Wilson은 사람들이 길에 버리는 껌에 그림을 그리는 것으로 잘 알려져 있습니다."],["His gum paintings often carry personal messages from people he meets on the street.","그의 껌 그림들은 그가 길에서 만나는 사람들의 개인적인 메시지를 종종 담고 있습니다."],["For example, the one over here is a happy birthday wish for a loved one.","예를 들어, 여기 있는 그림은 사랑하는 사람을 위한 생일 축하 메시지입니다."],["Wilson's gum paintings are tiny, but they give great pleasure to many people.","Wilson의 껌 그림들은 아주 작지만, 많은 사람들에게 큰 기쁨을 줍니다."]]}];
