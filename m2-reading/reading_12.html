aya · 무가당 식단", "en": "After an soccer game, I wanted to drink a cold soft drink.", "ko": "축구 경기를 마친 후, 차가운 탄산음료를 마시고 싶었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [1], "point": "관사 a/an: 자음 소리 soccer 앞에는 a 사용", "topic": "관사 a/an", "memo": "자음 소리 soccer 앞에는 a 사용"}]}, {"n": 8, "tag": null, "en": "But when I checked the ingredients, I realized that it have about 10 teaspoon of sugar.", "ko": "하지만 재료를 확인해 보니 탄산음료에는 약 10티스푼의 설탕이 들어 있다는 것을 알게 되었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "have", "right": "has", "partial": false, "at": [10], "point": "수일치: 주어 it(3인칭 단수)에는 has 사용", "topic": "수일치", "memo": "주어 it(3인칭 단수)에는 has 사용"}, {"wrong": "teaspoon", "right": "teaspoons", "partial": false, "at": [13], "point": "명사의 복수형: 10 뒤에는 복수명사 teaspoons 사용", "topic": "명사의 복수형", "memo": "10 뒤에는 복수명사 teaspoons 사용"}]}, {"n": 9, "tag": null, "en": "So, I decided to choose a cold herbal tea instead. It has far fewer sugar than a soft drink.", "ko": "그래서 대신 차가운 허브차를 마시기로 했어요. 허브차는 탄산음료보다 설탕이 훨씬 적어요.", "ok": false, "foot": [], "fixes": [{"wrong": "fewer", "right": "less", "partial": false, "at": [13], "point": "수량 형용사 less/fewer: sugar는 셀 수 없어 less 사용", "topic": "수량 형용사 less/fewer", "memo": "sugar는 셀 수 없어 less 사용"}]}, {"n": 10, "tag": null, "en": "I felt a lot healthy with the tea.", "ko": "차 덕분에 훨씬 건강해진 느낌이었어요.", "ok": false, "foot": [], "fixes": [{"wrong": "healthy", "right": "healthier", "partial": false, "at": [4], "point": "비교급: a lot 뒤에는 비교급 healthier 사용", "topic": "비교급", "memo": "a lot 뒤에는 비교급 healthier 사용"}]}, {"n": 11, "tag": null, "en": "↳ Wow, 10 teaspoons of sugar in an soft drink? Thanks for sharing this!", "ko": "↳ 와, 탄산음료 하나에 설탕이 10티스푼이나 들어 있다고? 공유해 줘서 고마워!", "ok": false, "foot": [], "fixes": [{"wrong": "an", "right": "a", "partial": false, "at": [7], "point": "관사 a/an: 자음 소리 soft 앞에는 a 사용", "topic": "관사 a/an", "memo": "자음 소리 soft 앞에는 a 사용"}]}, {"n": 12, "tag": null, "en": "↳ I've never try herbal tea after an exercise! I'll gives it a try next time.", "ko": "↳ 나는 운동 후에 허브차를 마셔 본 적은 없어! 다음에 한번 시도해 볼게.", "ok": false, "foot": [], "fixes": [{"wrong": "try", "right": "tried", "partial": false, "at": [3], "point": "현재완료: have never 뒤에는 과거분사 tried 사용", "topic": "현재완료", "memo": "have never 뒤에는 과거분사 tried 사용"}, {"wrong": "gives", "right": "give", "partial": false, "at": [10], "point": "조동사 뒤 동사원형: will 뒤에는 동사원형: give (gives 아님)", "topic": "조동사 뒤 동사원형", "memo": "will 뒤에는 동사원형: give (gives 아님)"}]}, {"n": 13, "tag": "은호 · 염분 체크", "en": "This afternoon, my friends and me had malatang. I thought it was a good choice because it had meat, vegetables, and noodles.", "ko": "오늘 오후, 친구들과 저는 마라탕을 먹었어요. 고기, 채소, 국수가 들어 있어서 좋은 선택인 줄 알았죠.", "ok": false, "foot": [], "fixes": [{"wrong": "me", "right": "I", "partial": false, "at": [5], "point": "인칭대명사의 주격: 주어 자리에는 주격 I 사용", "topic": "인칭대명사의 주격", "memo": "주어 자리에는 주격 I 사용"}]}, {"n": 14, "tag": null, "en": "But when I getted home, I felt really thirsty. I drank many water, but it didn't help.", "ko": "하지만 집에 가서 너무 목이 말랐어요. 물을 많이 마셨는데도 도움이 되지 않았어요.", "ok": false, "foot": [], "fixes": [{"wrong": "getted", "right": "got", "partial": false, "at": [3], "point": "불규칙 과거형: get의 과거형은 got (getted 아님)", "topic": "불규칙 과거형", "memo": "get의 과거형은 got (getted 아님)"}, {"wrong": "many", "right": "a lot of", "partial": false, "at": [11], "point": "수량 형용사 many/much: water는 셀 수 없어 a lot of/much 사용", "topic": "수량 형용사 many/much", "memo": "water는 셀 수 없어 a lot of/much 사용"}]}, {"n": 15, "tag": null, "en": "I think malatang was too salty for me. I've decided to eating less salty foods from now on.", "ko": "마라탕이 저한테는 너무 짰던 것 같아요. 이제부터 짠 음식을 덜 먹기로 결심했어요.", "ok": false, "foot": [], "fixes": [{"wrong": "eating", "right": "eat", "partial": false, "at": [11], "point": "to부정사: decide to 뒤에는 동사원형: eat (eating 아님)", "topic": "to부정사", "memo": "decide to 뒤에는 동사원형: eat (eating 아님)"}]}, {"n": 16, "tag": null, "en": "↳ You know what? Bananas can reduce the negative effects of salt in your body!", "k ody!", "↳ That's a great tip! I'll remember that!"];var PASS_KO=["식사 일기 프로젝트에 참여하세요", "안녕하세요, 우리 반 멋진 친구들!", "지난주부터 우리 학교에서 식사 일기 프로젝트를 도입했어요. 우리의 슬로건은? '저당, 저염, 저지방'이에요. 이 프로젝트에 참여하고 싶나요? 다음 단계를 따라보세요. 식사로 건강한 음식을 고르고, 사진을 찍어서 우리와 공유해 주세요. 그리고 친구들의 게시물에 따뜻한 댓글 남기는 것도 잊지 마세요.", "참여할 준비됐나요? 즐겁게 공유하세요!", "무가당_Maya", "축구 경기를 마친 후, 차가운 탄산음료를 마시고 싶었어요. 하지만 재료를 확인해 보니 탄산음료에는 약 10티스푼의 설탕이 들어 있다는 것을 알게 되었어요. 그래서 대신 차가운 허브차를 마시기로 했어요. 허브차는 탄산음료보다 설탕이 훨씬 적어요. 차 덕분에 훨씬 건강해진 느낌이었어요.", "↳ 와, 탄산음료 하나에 설탕이 10티스푼이나 들어 있다고? 공유해 줘서 고마워!", "↳ 나는 운동 후에 허브차를 마셔 본 적은 없어! 다음에 한번 시도해 볼게.", "염분 측정기_은호", "오늘 오후, 친구들과 저는 마라탕을 먹었어요. 고기, 채소, 국수가 들어 있어서 좋은 선택인 줄 알았죠. 하지만 집에 가서 너무 목이 말랐어요. 물을 많이 마셨는데도 도움이 되지 않았어요. 마라탕이 저한테는 너무 짰던 것 같아요. 이제부터 짠 음식을 덜 먹기로 결심했어요.", "↳ 그거 알아? 바나나가 체내 염분의 부정적인 영향을 줄여 준대!", "↳ 정말 좋은 팁이네! 기억할게!"];

  });

function wrongCard(q,st){
 var h='<div class="ac"><div class="ac-top"><b>오답</b><span class="ac-a">정답 '+CN[q.a]+' '+optText(q,q.a)+'</span>'+(q.ko?'<div class="ac-k">'+esc(q.ko[q.a])+'</div>':'')+'</div>';

 });

 if(tr)h+='<div class="trap"><b>함정</b> '+esc(tr.replace(/^함정\s*:\s*/,'').replace(/\s*✕/g,''))+'</div>';
 if(!st.ok){

  h+='</div>';
 } else {
