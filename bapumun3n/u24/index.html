for the exam today.\" / Greg told me that he would prepare for the exam that day.", "ko": "그레그가 내게 \"나는 오늘 시험을 준비할 거야.\"라고 말했다. / 그레그는 내게 그날 시험을 준비할 거라고 말했다.", "ok": false, "why": "said to는 told로, will은 would로, today는 that day로 알맞게 바뀌었어요."}, {"n": "③", "en": "Jim said to me, \"Do you know Bill's address?\" / Jim asked me that I knew Bill's address.", "ko": "짐이 내게 \"너는 빌의 주소를 아니?\"라고 말했다. / 짐은 내게 내가 빌의 주소를 안다고 물었다.", "ok": true, "why": "의문사 없는 질문은 that이 아니라 if나 whether로 이어야 해서 틀려요."}, {"n": "④", "en": "She said to John, \"Where are you from?\" / She asked John where he was from.", "ko": "그녀가 존에게 \"너는 어디 출신이니?\"라고 말했다. / 그녀는 존에게 어디 출신인지 물었다.", "ok": false, "why": "의문사 where로 잇고 '주어 + 동사' 순서라서 맞아요."}, {"n": "⑤", "en": "The teacher said to her, \"Don't give up your dream.\" / The teacher told her not to give up her dream.", "ko": "선생님이 그녀에게 \"네 꿈을 포기하지 마.\"라고 말했다. / 선생님은 그녀에게 꿈을 포기하지 말라고 말했다.", "ok": false, "why": "부정 명령문은 not to부정사로 바꾸니까 맞아요."}], "pencil": "의문사가 없는 질문은 간접화법에서 that이 아니라 ___로 잇는다", "pencilKey": "if[whether]", "page": 239, "sec": "s1", "k": "pick", "tr": "① 그는 \"나는 네 이름을 기억할 수 없어.\"라고 말했다. 바꾼 문장: 그는 내 이름을 기억할 수 없다고 말했다. ② Greg는 내게 \"나는 오늘 시험을 준비할 거야.\"라고 말했다. 바꾼 문장: Greg는 내게 자기가 그날 시험을 준비할 거라고 말했다. ③ Jim은 내게 \"너 Bill의 주소를 아니?\"라고 말했다. 바꾼 문장: Jim은 내게 Bill의 주소를 아는지 물었다. ④ 그녀는 John에게 \"너는 어디 출신이니?\"라고 말했다. 바꾼 문장: 그녀는 John에게 어디 출신인지 물었다. ⑤ 선생님은 그녀에게 \"네 꿈을 포기하지 마라.\"라고 말했다. 바꾼 문장: 선생님은 그녀에게 꿈을 포기하지 말라고 말씀하셨다.", "ex": ["prepare for = ~을 준비하다", "address = 주소", "give up = 포기하다"]}, {"id": "S1-09", "step": 1, "no": 9, "qtype": "유형 02 강조", "type": "write", "ans": "does worry", "concept": ["096"], "gap": "", "words": [["worry about", "~을 걱정하다"], ["health", "건강"]], "h1": "밑줄 친 worries(걱정한다)를 '정말로' 걱정한다는 뜻으로 세게 말하는 문제예요. 동사를 강조하는 방법을 떠올리세요.", "h2": "동사를 강조할 때는 동사 앞에 do, does, did 중 하나를 넣고 동사는 원형으로 써요. 주어가 3인칭 단수이고 현재 시제인지 확인하세요.", "why": "주어 Helen은 3인칭 단수이고 현재 시제라서 does를 넣고 동사는 원형 worry(걱정하다)로 써요. 그래서 does worry가 돼요.", "opts": [], "pencil": "동사를 강조할 때는 do / does / did + ___을 쓴다", "pencilKey": "동사원형", "page": 240, "sec": "s1", "k": "type", "acc": ["does worry"], "tr": "Helen은 어머니의 건강을 걱정한다. (밑줄 친 동사를 강조해 다시 쓰는 문제예요.)", "ex": ["health = 건강"]}, {"id": "S1-10", "step": 1, "no": 10, "qtype": "유형 02 강조", "type": "mc", "ans": "③", "concept": ["096-2", "096"], "gap": "", "words": [["think", "생각하다"], ["right", "옳은"], ["horror movie", "공포 영화"], ["amusement park", "놀이공원"]], "h1": "<보기>의 do는 '정말로 ~하다'라는 뜻으로 think를 강조해요. 보기 ①~⑤의 do가 어떤 역할인지 하나씩 보세요.", "h2": "do에는 '하다'라는 일반동사, 부정문·의문문을 만드는 도우미, 그리고 '정말로'라는 강조의 세 가지 쓰임이 있어요. 뒤에 동사원형이 따라오는지도 힌트예요.", "why": "③ We do love to go ...에서 do는 love(사랑하다, 좋아하다)를 '정말로' 좋아한다고 강조해요. <보기>의 do와 같아요.", "opts": [{"n": "①", "en": "It will do.", "ko": "그것이면 충분할 것이다.", "ok": false, "why": "do가 '충분하다'라는 뜻의 일반동사라서 강조의 do가 아니에요."}, {"n": "②", "en": "I do not like horror movies.", "ko": "나는 공포 영화를 좋아하지 않는다.", "ok": false, "why": "do가 부정문을 만들어 주는 도우미라서 강조의 do가 아니에요."}, {"n": "③", "en": "We do love to go to the amusement park.", "ko": "우리는 놀이공원에 가는 것을 정말 좋아한다.", "ok": true, "why": "do가 love(좋아하다)를 강조해서 <보기>와 같아요."}, {"n": "④", "en": "Do your homework first, George.", "ko": "조지, 숙제부터 해라.", "ok": false, "why": "do가 '하다'라는 일반동사라서 강조의 do가 아니에요."}, {"n": "⑤", "en": "When do you leave for Chicago?", "ko": "너는 언제 시카고로 떠나니?", "ok": false, "why": "do가 의문문을 만들어 주는 도우미라서 강조의 do가 아니에요."}], "pencil": "강조의 do는 뒤에 ___이 오고 '정말로'라는 뜻이다", "pencilKey": "동사원형", "page": 240, "sec": "s1", "k": "pick", "tr": "<보기> 나는 그녀가 옳다고 생각한다. ① 그것으로 충분할 것이다. ② 나는 공포 영화를 좋아하지 않는다. ③ 우리는 놀이공원에 가는 것을 좋아한다. ④ 숙제를 먼저 해, George. ⑤ 너는 언제 시카고로 떠나니?", "ex": ["horror movie = 공포 영화", "leave for = ~를 향해 떠나다"]}, {"id": "S1-11", "step": 1, "no": 11, "qtype": "유형 02 강조", "type": "mc", "ans": "②, ④", "concept": ["096"], "gap": "", "words": [["believe", "믿다"], ["hate", "싫어하다"], ["accident", "사고"], ["secret", "비밀"], ["spider", "거미"]], "h1": "어색한 것을 모두 고르는 문제예요. 강조의 do 바로 뒤에 어떤 모양의 동사가 오는지, 그리고 do가 주어와 맞는지 확인하세요.", "h2": "do, does, did 뒤에는 꼭 동사원형이 와요. 그리고 주어가 복수이면 does가 아니라 do를 써요.", "why": "②는 does hates에서 does 뒤라서 hates가 아니라 hate(원형 hate 싫어하다)여야 해요. ④는 주어 Mia and Chris가 복수라서 does가 아니라 do여야 해요.", "opts": [{"n": "①", "en": "I do believe you.", "ko": "나는 정말 너를 믿는다.", "ok": false, "why": "do + 동사원형이라서 맞아요."}, {"n": "②", "en": "My sister does hates spiders.", "ko": "내 여동생은 정말 거미를 싫어한다.", "ok": true, "why": "does 뒤에는 hates가 아니라 동사원형 hate가 와야 해요."}, {"n": "③", "en": "I did see the accident.", "ko": "나는 그 사고를 정말 봤다.", "ok": false, "why": "did + 동사원형이라서 맞아요."}, {"n": "④", "en": "Mia and Chris does know your secret.", "ko": "미아와 크리스는 정말 네 비밀을 안다.", "ok": true, "why": "주어가 복수라서 does가 아니라 do여야 해요."}, {"n": "⑤", "en": "You do look nice in that jacket.", "ko": "너는 그 재킷을 입으니 정말 멋져 보인다.", "ok": false, "why": "do + 동사원형이라서 맞아요."}], "pencil": "do[does / did] 바로 뒤에는 ___이 온다", "pencilKey": "동사원형", "page": 240, "sec": "s1", "k": "pick", "tr": "① 나는 너를 믿는다. ② 내 여동생은 거미를 싫어한다. ③ 나는 그 사고를 봤다. ④ Mia와 Chris는 네 비밀을 안다. ⑤ 너는 그 재킷을 입으니 멋져 보인다.", "ex": ["spider = 거미", "secret = 비밀", "accident = 사고"]}, {"id": "S1-12", "step": 1, "no": 12, "qtype": "유형 02 강조", "type": "write", "ans": "did decide", "concept": ["096"], "gap": "", "words": [["decide", "결심하다"], ["major in", "전공하다"], ["computer science", "컴퓨터 공학"]], "h1": "밑줄 친 decided(결심했다)를 세게 말하는 문제예요. 시제가 과거라는 점에 주의하세요.", "h2": "동사 강조는 do류 + 동사원형이에요. 문장의 시제가 과거이면 do는 어떤 모양이 될까요? 그리고 decide는 원형으로 써요.", "why": "과거 시제라서 did를 쓰고, 뒤의 동사는 원형 decide(결심하다)로 써요. 그래서 Martin did decide to major in ...(마틴은 정말로 전공하기로 결심했다)가 돼요.", "opts": [], "pencil": "과거의 동사 강조는 ___ + 동사원형으로 쓴다", "pencilKey": "did", "page": 240, "sec": "s1", "k": "type", "acc": ["did decide"], "tr": "Martin은 대학에서 컴퓨터 과학을 전공하기로 결심했다. (밑줄 친 동사를 강조해 다시 쓰는 문제예요.)", "ex": ["major in = ~을 전공하다", "computer science = 컴퓨터 과학"]}, {"id": "S1-13", "step": 1, "no": 13, "qtype": "유형 02 강조", "type": "write", "ans": "It was, that [which]", "concept": ["096"], "gap": "", "words": [["generosity", "관대함"], ["impact", "영향"], ["Mother Teresa", "마더 테레사"]], "h1": "밑줄 친 Her family's generosity는 문장의 주어예요. 주어를 강조하는 방법을 떠올리세요.", "h2": "강조 구문의 틀 It ___ ~ ___ ...에 들어갈 말이에요. 문장의 시제에 맞는 be동사와, 강조 뒤를 잇는 연결어를 쓰세요.", "why": "주어를 강조하려고 It was와 that 사이에 her family's generosity(그녀 가족의 관대함)를 넣어요. 과거라서 was를 쓰고, 연결어는 that[which]예요.", "opts": [], "pencil": "강조 구문은 It is[was] + 강조할 말 + ___ + 나머지", "pencilKey": "that", "page": 240, "sec": "s1", "k": "self", "acc": [], "tr": "그녀 가족의 너그러움은 어린 테레사 수녀의 삶에 큰 영향을 주었다. (밑줄 친 주어를 강조해 다시 쓰는 문제예요.)", "ex": ["generosity = 너그러움", "make an impact on = ~에 영향을 주다"]}, {"id": "S1-14", "step": 1, "no": 14, "qtype": "유형 02 강조", "type": "write", "ans": "It was the accident that[which] changed my plan.", "concept": ["096"], "gap": "", "words": [["accident", "사고"], ["change", "바꾸다"], ["plan", "계획"]], "h1": "밑줄 친 The accident는 주어예요. 이 주어를 '바로 ~이 …했다'처럼 강조하는 문장으로 바꿔 보세요.", "h2": "강조 구문의 틀 It is[was] ~ that ...을 떠올리세요. 문장이 과거(changed)라서 be동사 모양도 정해져요.", "why": "과거 시제라서 It was ~ that ...을 써요. 강조할 The accident를 사이에 넣고 changed my plan(내 계획을 바꿨다)을 이어서 It was the accident that changed my plan이 돼요.", "opts": [], "pencil": "과거의 강조 구문은 It ___ ~ that ... 으로 쓴다", "pencilKey": "was", "page": 240, "sec": "s1", "k": "self", "acc": [], "tr": "그 사고가 내 계획을 바꿨다. (밑줄 친 부분을 강조해 다시 쓰는 문제예요.)", "ex": ["accident = 사고"]}, {"id": "S1-15", "step": 1, "no": 15, "qtype": "유형 02 강조", "type": "mc", "ans": "⑤", "concept": ["096"], "gap": "", "words": [["leave for", "~로 떠나다"], ["cartoon", "만화"], ["living room", "거실"]], "h1": "밑줄 친 부분을 강조해서 다시 쓴 문장이 맞는지 하나씩 확인하세요. 강조 구문의 큰 틀은 It is[was] ~ that ...이에요.", "h2": "밑줄 친 말이 주어, 목적어, 부사구, 동사 중 무엇인지 보고, 그 종류에 맞는 강조 방법이 쓰였는지 확인하세요.", "why": "⑤는 동사 watched(원형 watch 보다)를 강조하려고 It was watched that ...이라고 써서 틀려요. 동사 강조는 Mary did watch the soccer game ...처럼 did + 동사원형으로 해요.", "opts": [{"n": "①", "en": "Sumi left for Busan yesterday. / It was yesterday that Sumi left for Busan.", "ko": "수미는 어제 부산으로 떠났다. / 수미가 부산으로 떠난 것은 바로 어제였다.", "ok": false, "why": "때를 나타내는 yesterday를 It was와 that 사이에 넣어서 맞아요."}, {"n": "②", "en": "I lost Eva's book on the bus. / It was Eva's book that I lost on the bus.", "ko": "나는 버스에서 에바의 책을 잃어버렸다. / 내가 버스에서 잃어버린 것은 바로 에바의 책이었다.", "ok": false, "why": "목적어를 It was와 that 사이에 넣어서 맞아요."}, {"n": "③", "en": "We met Dorothy in the park. / It was in the park that we met Dorothy.", "ko": "우리는 공원에서 도로시를 만났다. / 우리가 도로시를 만난 곳은 바로 공원이었다.", "ok": false, "why": "장소 말을 It was와 that 사이에 넣어서 맞아요."}, {"n": "④", "en": "Minho likes to draw cartoons. / It is Minho that likes to draw cartoons.", "ko": "민호는 만화 그리기를 좋아한다. / 만화 그리기를 좋아하는 사람은 바로 민호이다.", "ok": false, "why": "주어 Minho를 It is와 that 사이에 넣어서 맞아요."}, {"n": "⑤", "en": "Mary watched the soccer game in the living room. / It was watched that Mary did the soccer game in the living room.", "ko": "메리는 거실에서 축구 경기를 봤다. / (동사를 잘못 강조한 문장)", "ok": true, "why": "동사는 It ~ that으로 강조하지 않아요. Mary did watch ...로 써야 해서 틀려요."}], "pencil": "동사의 강조는 It ~ that이 아니라 ___ + 동사원형으로 한다", "pencilKey": "do류", "page": 240, "sec": "s1", "k": "pick", "tr": "밑줄 친 부분을 강조해 다시 쓴 문장이에요. ① Sumi는 어제 부산으로 떠났다. 바꾼 문장: Sumi가 부산으로 떠난 것은 어제였다. ② 나는 버스에서 Eva의 책을 잃어버렸다. 바꾼 문장: 내가 버스에서 잃어버린 것은 Eva의 책이었다. ③ 우리는 공원에서 Dorothy를 만났다. 바꾼 문장: 우리가 Dorothy를 만난 곳은 공원이었다. ④ 민호는 만화 그리기를 좋아한다. 바꾼 문장: 만화 그리기를 좋아하는 사람은 민호다. ⑤ Mary는 거실에서 축구 경기를 보았다. 바꾼 문장: (동사 watched를 강조하려고 쓴 문장)", "ex": ["cartoon = 만화", "living room = 거실"]}, {"id": "S1-16", "step": 1, "no": 16, "qtype": "유형 02 강조", "type": "mc", "ans": "④", "concept": ["096", "091"], "gap": "", "words": [["score a goal", "골을 넣다"], ["matter", "중요하다"], ["ceremony", "시상식"], ["take place", "열리다"]], "h1": "보기마다 It is[was]와 that 사이에 있는 말이 무엇인지 보세요. 그 말을 빼도 문장이 완전한지도 확인해 보세요.", "h2": "강조 구문은 It is[was]와 that을 빼도 문장이 남아요. 가주어 구문은 빼면 문장이 안 돼요. 보기마다 직접 빼 보세요.", "why": "④ It is important that you should do your best(네가 최선을 다하는 것이 중요하다)는 It이 가짜 주어이고 that절이 진짜 주어예요. 나머지는 모두 강조 구문이에요.", "opts": [{"n": "①", "en": "It was John that I met last Friday.", "ko": "내가 지난 금요일에 만난 사람은 바로 존이었다.", "ok": false, "why": "John을 강조한 강조 구문이에요."}, {"n": "②", "en": "It is your happi : [["never", "결코 ~않다"], ["kind", "친절한"], ["classmate", "반 친구"]], "h1": "부정어 never를 문장 맨 앞으로 보내 강조한 문장을 찾는 문제예요. 그러면 뒤의 어순은 의문문처럼 바뀌어요.", "h2": "원래 문장은 be동사 was가 있어요. 부정어가 맨 앞에 오면 be동사가 주어 앞으로 나가고, never와 not을 겹쳐 쓰지 않아요.", "why": "부정어 Never가 앞에 오면 be동사와 주어의 순서가 바뀌어서 Never was Joseph kind to his classmates(조지프는 반 친구들에게 결코 친절하지 않았다)가 돼요.", "opts": [{"n": "①", "en": "Never Joseph was kind to his classmates.", "ko": "조지프는 반 친구들에게 결코 친절하지 않았다.", "ok": false, "why": "Never가 앞에 있는데 주어와 be동사의 순서가 바뀌지 않았어요."}, {"n": "②", "en": "Never Joseph wasn't kind to his classmates.", "ko": "조지프는 반 친구들에게 결코 친절하지 않지 않았다.", "ok": false, "why": "순서도 틀리고 never와 not이 겹쳐서 부정이 두 번 나와요."}, {"n": "③", "en": "Never was Joseph kind to his classmates.", "ko": "조지프는 반 친구들에게 결코 친절하지 않았다.", "ok": true, "why": "Never 뒤에 be동사 + 주어 순서라서 맞아요."}, {"n": "④", "en": "Never wasn't Joseph kind to his classmates.", "ko": "조지프는 반 친구들에게 결코 친절하지 않지 않았다.", "ok": false, "why": "never와 not이 겹쳐서 부정이 두 번 나와요."}, {"n": "⑤", "en": "Never does Joseph be kind to his classmates.", "ko": "조지프는 반 친구들에게 결코 친절하지 않다.", "ok": false, "why": "be동사 문장에서는 does를 쓰지 않고 be동사를 앞으로 보내요."}], "pencil": "부정어가 맨 앞에 오면 be동사 + ___ 순서가 된다", "pencilKey": "주어", "page": 241, "sec": "s1", "k": "pick", "tr": "Joseph는 반 친구들에게 결코 친절하지 않았다. (밑줄 친 never를 강조해 문장 맨 앞으로 보낸 문장을 고르는 문제예요. 보기는 모두 이 뜻을 어순만 다르게 쓴 것이에요.)", "ex": ["classmate = 반 친구", "kind to = ~에게 친절한"]}, {"id": "S1-23", "step": 1, "no": 23, "qtype": "유형 03 도치", "type": "write", "ans": "Not, did we stay", "concept": ["097"], "gap": "", "words": [["single", "단 하나의"], ["stay", "머물다"], ["hotel", "호텔"]], "h1": "'not a single day'를 강조하려고 문장 맨 앞으로 보내는 문제예요. 부정어가 맨 앞에 오면 뒤의 어순이 바뀌어요.", "h2": "원래 문장의 동사 stayed는 일반동사 과거형이에요. 이 경우 do류 중 과거형을 주어 앞에 넣고, 동사는 원형으로 돌려놓아요.", "why": "부정어구 Not a single day가 앞에 오면 일반동사 문장이라서 did가 주어 앞에 오고 동사는 원형 stay(머물다)가 돼요. 그래서 Not a single day did we stay in the hotel이에요.", "opts": [], "pencil": "부정어구가 앞에 오면 일반동사 문장은 ___ 류 동사 + 주어 + 동사원형 순서가 된다", "pencilKey": "do", "page": 241, "sec": "s1", "k": "type", "acc": ["Not, did we stay"], "tr": "우리는 호텔에서 단 하루도 머물지 않았다. (밑줄 친 부분을 강조해 문장 맨 앞으로 보내는 문제예요.)", "ex": ["not a single day = 단 하루도 ~않다"]}, {"id": "S1-24", "step": 1, "no": 24, "qtype": "유형 03 도치", "type": "mc", "ans": "①", "concept": ["097"], "gap": "", "words": [["hungry", "배고픈"], ["tired", "피곤한"], ["piano", "피아노"], ["vegetable", "채소"]], "h1": "어색한 대화를 고르는 문제예요. 각 대화에서 앞 문장의 동사가 be동사인지, 조동사인지, 일반동사인지 확인하세요.", "h2": "맞장구의 동사는 앞 문장의 동사 종류에 맞춰요. be동사 문장에는 be동사, can 같은 조동사에는 그 조동사, 일반동사에는 do류로 받아요.", "why": "① I am hungry and tired에서 앞 문장 동사가 be동사 am이라서 So do I가 아니라 So am I여야 해요.", "opts": [{"n": "①", "en": "I am hungry and tired. – So do I.", "ko": "나는 배고프고 피곤해. – 나도 그래.", "ok": true, "why": "앞 문장 동사가 be동사 am이라서 do가 아니라 am이어야 해요."}, {"n": "②", "en": "I saw Brendan yesterday. – So did I.", "ko": "나는 어제 브렌던을 봤어. – 나도 봤어.", "ok": false, "why": "일반동사 과거 saw(원형 see 보다)라서 So did I가 맞아요."}, {"n": "③", "en": "Mike can play the piano. – So can I.", "ko": "마이크는 피아노를 칠 수 있어. – 나도 칠 수 있어.", "ok": false, "why": "조동사 can을 받아서 So can I가 맞아요."}, {"n": "④", "en": "I don't like vegetables. – Neither do I.", "ko": "나는 채소를 좋아하지 않아. – 나도 좋아하지 않아.", "ok": false, "why": "부정 일반동사라서 Neither do I가 맞아요."}, {"n": "⑤", "en": "I won't go there again. – Neither will I.", "ko": "나는 그곳에 다시 가지 않을 거야. – 나도 안 갈 거야.", "ok": false, "why": "조동사 will을 받아서 Neither will I가 맞아요."}], "pencil": "맞장구의 동사는 앞 문장의 동사 ___에 맞춘다", "pencilKey": "종류", "page": 241, "sec": "s1", "k": "pick", "tr": "① 나는 배고프고 피곤해. – 나도 그래. ② 나는 어제 Brendan을 봤어. – 나도 봤어. ③ Mike는 피아노를 칠 수 있어. – 나도 칠 수 있어. ④ 나는 채소를 좋아하지 않아. – 나도 안 좋아해. ⑤ 나는 거기에 다시 가지 않을 거야. – 나도 안 갈 거야.", "ex": []}, {"id": "S1-25", "step": 1, "no": 25, "qtype": "유형 03 도치", "type": "mc", "ans": "③, ⑤", "concept": ["097", "097-H1"], "gap": "", "words": [["seldom", "좀처럼 ~않다"], ["wear jewelry", "보석을 착용하다"], ["nowhere", "어디에도 ~없다"], ["hardly", "거의 ~않다"]], "h1": "밑줄 친 부분이 어색한 것을 모두 고르는 문제예요. so로 맞장구친 문장과 부정어가 앞에 온 문장을 하나씩 확인하세요.", "h2": "so로 맞장구칠 때는 앞 문장이 긍정인지 부정인지 보세요. 그리고 부정어(seldom, nowhere, hardly)가 앞에 나온 문장은 주어와 동사의 순서가 정말 바뀌었는지 확인하세요.", "why": "③은 앞 문장이 doesn't like(좋아하지 않는다)로 부정이라서 so가 아니라 neither[nor]를 써야 해요. ⑤는 Hardly 뒤에 did we talk처럼 'do류 + 주어 + 동사원형' 순서여야 해요.", "opts": [{"n": "①", "en": "Mary passed the test, and so did I.", "ko": "메리는 시험에 합격했고, 나도 그랬다.", "ok": false, "why": "긍정 일반동사 과거를 받아서 so did I가 맞아요."}, {"n": "②", "en": "Seldom does my mother wear jewelry these days.", "ko": "요즘 우리 어머니는 좀처럼 보석을 착용하지 않으신다.", "ok": false, "why": "Seldom이 앞에 오고 does + 주어 + 동사원형이라서 맞아요."}, {"n": "③", "en": "Sue doesn't like to travel alone, and so does Anne.", "ko": "수는 혼자 여행하는 것을 좋아하지 않고, 앤도 그렇다.", "ok": true, "why": "앞 문장이 부정이라서 so가 아니라 neither[nor]여야 해요."}, {"n": "④", "en": "Nowhere in the world is there a place like home.", "ko": "세상 어디에도 집 같은 곳은 없다.", "ok": false, "why": "Nowhere가 앞에 오고 be동사 + 주어(there) 순서라서 맞아요."}, {"n": "⑤", "en": "Hardly we talked to each other during those two hours.", "ko": "우리는 그 두 시간 동안 서로 거의 말하지 않았다.", "ok": true, "why": "Hardly가 앞에 오면 did we talk처럼 도치해야 해서 틀려요."}], "pencil": "부정어가 맨 앞에 오면 부정어 + ___ 동사 + 주어 + 동사원형 순서가 된다", "pencilKey": "do류", "page": 241, "sec": "s1", "k": "pick", "tr": "① Mary는 시험에 합격했고, 나도 그랬다. ② 우리 어머니는 요즘 보석을 좀처럼 착용하지 않으신다. ③ Sue는 혼자 여행하는 것을 좋아하지 않고, Anne도 그렇다. ④ 세상 어디에도 집 같은 곳은 없다. ⑤ 그 두 시간 동안 우리는 서로 거의 말을 하지 않았다.", "ex": ["jewelry = 보석(장신구)", "hardly = 거의 ~않다", "seldom = 좀처럼 ~않다"]}, {"id": "S2-01", "step": 2, "no": 1, "qtype": "화법 전환", "type": "mc", "ans": "②", "concept": ["100-2", "100", "019"], "gap": "", "words": [["caffeine", "카페인"], ["advise", "충고하다"], ["too much", "너무 많은"]], "h1": "따옴표 안이 Don't로 시작하는 명령문이에요. 빈칸 두 곳은 전달하는 동사와 명령을 전하는 모양이에요.", "h2": "명령문을 전할 때는 said to를 told, advised 같은 동사로 바꿔요. 부정이라서 not이 들어가고, to부정사 모양이 돼요. not의 위치를 잘 보세요.", "why": "충고하는 말이라서 advised(원형 advise 충고하다)를 쓰고, 부정 명령문은 not to + 동사원형이에요. 그래서 advised Mr. James not to have too much caffeine이 돼요.", "opts": [{"n": "①", "en": "said – to not have", "ko": "말했다 – 갖지 않도록", "ok": false, "why": "said 뒤에 사람을 바로 쓸 수 없고, to not이라는 순서도 틀려요. not to여야 해요."}, {"n": "②", "en": "advised – not to have", "ko": "충고했다 – 갖지 않도록", "ok": true, "why": "advised와 not to + 동사원형이라서 맞아요."}, {"n": "③", "en": "told – to not have", "ko": "말했다 – 갖지 않도록", "ok": false, "why": "not의 위치가 틀려요. not to have로 써야 해요."}, {"n": "④", "en": "said – not having", "ko": "말했다 – 갖지 않는 것", "ok": false, "why": "said 뒤에 사람을 바로 쓸 수 없고 not having은 명령을 전하는 모양이 아니에요."}, {"n": "⑤", "en": "advised – don't to have", "ko": "충고했다 – 갖지 마라 to 갖다", "ok": false, "why": "don't와 to를 함께 쓸 수 없어요."}], "pencil": "부정 명령문을 전할 때는 ___ + to부정사로 쓴다", "pencilKey": "not", "page": 242, "sec": "s2", "k": "pick", "tr": "의사는 James 씨에게 \"카페인을 너무 많이 섭취하지 마세요.\"라고 말했다. (직접 화법을 간접 화법으로 바꾸는 문제예요.)", "ex": []}, {"id": "S2-02", "step": 2, "no": 2, "qtype": "화법 전환", "type": "mc", "ans": "③", "concept": ["100", "095"], "gap": "", "words": [["luggage", "짐"], ["on my way to", "~로 가는 길에"], ["thanks a lot", "정말 고마워요"]], "h1": "밑줄 친 ①~⑤ 중 어색한 것을 찾는 글이에요. I asked her ③ that I ④ could help her의 연결어를 살펴보세요.", "h2": "글쓴이는 '도와드릴까요?'라고 물어본 거예요. Yes나 No로 답하는 질문을 전할 때 쓰는 연결어를 떠올리세요.", "why": "③ asked her that I could help에서 질문(도와드려도 될까요?)을 전할 때는 that이 아니라 if나 whether를 써야 해요.", "opts": [{"n": "①", "en": "On", "ko": "~하는 길에", "ok": false, "why": "On my way to school(학교 가는 길에)은 알맞은 표현이에요."}, {"n": "②", "en": "was carrying", "ko": "나르고 있었다", "ok": false, "why": "과거의 한 장면이라서 과거진행이 맞아요."}, {"n": "③", "en": "that", "ko": "~라는 것", "ok": true, "why": "질문을 전하는 말이라서 that이 아니라 if[whether]여야 해요."}, {"n": "④", "en": "could", "ko": "~할 수 있었다", "ok": false, "why": "주절이 asked(과거)라서 can의 과거형 could가 맞아요."}, {"n": "⑤", "en": "said", "ko": "말했다", "ok": false, "why": "과거 이야기라서 said가 맞아요."}], "pencil": "의문사 없는 질문을 전할 때는 that이 아니라 ___로 잇는다", "pencilKey": "if[whether]", "page": 242, "sec": "s2", "k": "pick", "tr": "학교에 가는 길에, 한 할머니가 무거운 짐을 나르고 계셨다. 나는 할머니께 도와드릴 수 있는지 물었다. 그녀는 웃으며 \"아, 정말 고마워요.\"라고 말했다.", "ex": ["on my way to = ~로 가는 길에", "luggage = (여행) 짐", "carry = 나르다"]}, {"id": "S2-03", "step": 2, "no": 3, "qtype": "강조", "type": "mc", "ans": "①", "concept": ["096"], "gap": "", "words": [["hope", "바라다"], ["get well", "낫다"]], "h1": "'정말로 바란다'는 우리말이 동사를 세게 말하는 문장이에요. 동사 hope(바라다)를 어떻게 강조하는지 보세요.", "h2": "동사 강조는 do류 + 동사원형이에요. 주어 Jonathan은 3인칭 단수이고 현재 시제예요. do류 중 어느 것이고, 뒤의 hope는 어떤 모양일까요?", "why": "주어가 3인칭 단수 현재라서 does를 쓰고 뒤의 동사는 원형 hope(바라다)로 써요. 그래서 does hope가 돼요.", "opts": [{"n": "①", "en": "does hope", "ko": "정말로 바란다(단수 현재)", "ok": true, "why": "3인칭 단수 현재라서 does + 동사원형이 맞아요."}, {"n": "②", "en": "does hopes", "ko": "정말로 바란다", "ok": false, "why": "does 뒤에 hopes처럼 s를 붙이면 틀려요. 동사원형 hope여야 해요."}, {"n": "③", "en": "do hope", "ko": "정말로 바란다(복수 현재)", "ok": false, "why": "주어가 3인칭 단수라서 do가 아니라 does여야 해요."}, {"n": "④", "en": "do hopes", "ko": "정말로 바란다", "ok": false, "why": "do가 틀리고 hopes도 틀려요."}, {"n": "⑤", "en": "did hopes", "ko": "정말로 바랐다", "ok": false, "why": "현재 이야기인데 과거 did를 쓰고 hopes도 틀려요."}], "pencil": "3인칭 단수 현재의 동사 강조는 ___ + 동사원형이다", "pencilKey": "does", "page": 242, "sec": "s2", "k": "pick", "tr": "우리말 문제예요. 문장의 뜻을 영어 어순으로 생각해 보세요.", "ex": ["get well = 낫다(회복하다)"]}, {"id": "S2-04", "step": 2, "no": 4, "qtype": "강조", "type": "mc", "ans": "③", "concept": ["096-2", "096"], "gap": "", "words": [["study", "공부하다"], ["in person", "직접"], ["dishes", "설거지거리"], ["agree with", "~에 동의하다"]], "h1": "모든 보기에 do나 did가 있어요. 그중 쓰임이 나머지 넷과 다른 것을 찾는 문제예요. 각 do가 '정말로'를 뜻하는지 확인하세요.", "h2": "do가 '정말로'를 뜻하면 뒤에 동사원형이 이어져요. do 자체가 '하다'라는 뜻의 동사로 쓰였다면 뒤에 명사(목적어)가 와요.", "why": "③ did the dishes(설거지를 했다)의 did는 '하다'라는 뜻의 일반동사예요. 나머지 넷은 뒤에 동사원형이 와서 동사를 강조하는 do예요.", "opts": [{"n": "①", "en": "She did study very hard.", "ko": "그녀는 정말 열심히 공부했다.", "ok": false, "why": "did가 study(공부하다)를 강조해요."}, {"n": "②", "en": "I do want to meet her in person.", "ko": "나는 그녀를 직접 정말 만나고 싶다.", "ok": false, "why": "do가 want(원하다)를 강조해요."}, {"n": "③", "en": "Jason did the dishes after dinner.", "ko": "제이슨은 저녁 식사 후에 설거지를 했다.", "ok": true, "why": "did가 '하다'라는 뜻의 일반동사라서 나머지 넷과 달라요."}, {"n": "④", "en": "We do agree with your opinion.", "ko": "우리는 네 의견에 정말 동의한다.", "ok": false, "why": "do가 agree(동의하다)를 강조해요."}, {"n": "⑤", "en": "Our family did have a good time in Sydney.", "ko": "우리 가족은 시드니에서 정말 즐거운 시간을 보냈다.", "ok": false, "why": "did가 have(보내다)를 강조해요."}], "pencil": "강조의 do 뒤에는 동사원형, 일반동사 do 뒤에는 ___이 온다", "pencilKey": "목적어", "page": 242, "sec": "s2", "k": "pick", "tr": "① 그녀는 공부를 매우 열심히 했다. ② 나는 그녀를 직접 만나고 싶다. ③ Jason은 저녁 식사 후에 설거지를 했다. ④ 우리는 네 의견에 동의한다. ⑤ 우리 가족은 시드니에서 즐거운 시간을 보냈다.", "ex": ["in person = 직접", "agree with = ~에 동의하다", "opinion = 의견"]}, {"id": "S2-05", "step": 2, "no": 5, "qtype": "강조", "type": "mc", "ans": "⑤", "concept": ["096"], "gap": "", "words": [["clothes", "옷"], ["invent", "발명하다"], ["telephone", "전화기"], ["theater", "극장"]], "h1": "밑줄 친 부분을 강조한 문장이 맞는지 하나씩 보세요. 동사를 강조했는지, 다른 부분을 강조했는지 구분하세요.", "h2": "동사 강조는 do류 + 동사원형이에요. 다른 부분은 It is[was] ~ that으로 강조하는데, 시제를 지키고 사람이면 who도 쓸 수 있어요.", "why": "⑤ It was in front of the theater that Nancy met her friends(낸시가 친구들을 만난 곳은 바로 극장 앞이었다)는 장소를 강조한 올바른 문장이에요.", "opts": [{"n": "①", "en": "My mother makes her own clothes. / My mother does makes her own clothes.", "ko": "우리 어머니는 직접 옷을 만드신다. / 우리 어머니는 정말 직접 옷을 만드신다.", "ok": false, "why": "does 뒤에는 makes가 아니라 동사원형 make(만들다)여야 해요."}, {"n": "②", "en": "I believed what you said to me. / I do believe what you said to me.", "ko": "나는 네가 내게 한 말을 믿었다. / 나는 네가 내게 한 말을 정말 믿는다.", "ok": false, "why": "과거 문장이라서 do가 아니라 did believe(원형 believe 믿다)여야 해요."}, {"n": "③", "en": "John's strong will made him succeed. / It is John's strong will that made him succeed.", "ko": "존의 강한 의지가 그를 성공하게 했다. / 그를 성공하게 한 것은 바로 존의 강한 의지였다.", "ok": false, "why": "과거 문장이라서 It is가 아니라 It was여야 해요."}, {"n": "④", "en": "Alexander Graham Bell invented the telephone. / It was the telephone who Alexander Graham Bell invented.", "ko": "알렉산더 그레이엄 벨은 전화기를 발명했다. / 벨이 발명한 것은 바로 전화기였다.", "ok": false, "why": "전화기는 사람이 아니라서 who가 아니라 that[which]여야 해요."}, {"n": "⑤", "en": "Nancy met her friends in front of the theater. / It was in front of the theater that Nancy met her friends.", "ko": "낸시는 극장 앞에서 친구들을 만났다. / 낸시가 친구들을 만난 곳은 바로 극장 앞이었다.", "ok": true, "why": "장소를 It was와 that 사이에 넣었고 시제도 맞아요."}], "pencil": "과거의 강조 구문은 It ___ ~ that ...으로 쓴다", "pencilKey": "was", "page": 242, "sec": "s2", "k": "pick", "tr": "밑줄 친 부분을 강조해 다시 쓴 문장이에요. ① 우리 어머니는 자기 옷을 직접 만드신다. ② 나는 네가 내게 한 말을 믿었다. ③ John의 강한 의지가 그를 성공하게 했다. ④ Alexander Graham Bell이 발명한 것은 전화기였다. ⑤ Nancy가 친구들을 만난 곳은 극장 앞이었다.", "ex": ["strong will = 강한 의지", "invented(원형 invent) = 발명했다", "in front of = ~ 앞에서"]}, {"id": "S2-06", "step": 2, "no": 6, "qtype": "통합형", "type": "mc", "ans": "④", "concept": ["097", "097-H1"], "gap": "", "words": [["stand", "서 있다"], ["coach", "코치"], ["realize", "깨닫다"], ["danger", "위험"], ["be good at", "~을 잘하다"]], "h1": "보기마다 문장의 종류(도치, 화법, 강조, 맞장구)를 알아보고 규칙에 맞는지 확인하세요.", "h2": "보기마다 어떤 종류의 문장인지 알아보고, 그 종류의 규칙(맞장구는 앞 문장 동사에 맞추기, 도치는 동사 + 주어 순서 등)을 지켰는지 확인하세요.", "why": "④ Jim is good at singing, and so does Mike에서 앞 문장 동사가 be동사 is라서 so does가 아니라 so is Mike여야 해요.", "opts": [{"n": "①", "en": "In front of the door stood a tall man.", "ko": "문 앞에 키 큰 남자가 서 있었다.", "ok": false, "why": "장소 부사구가 앞에 오고 동사 + 주어 순서라서 맞아요."}, {"n": "②", "en": "The coach told the players to do their best.", "ko": "코치는 선수들에게 최선을 다하라고 말했다.", "ok": false, "why": "명령을 전하는 to부정사라서 맞아요."}, {"n": "③", "en": "Little did Sophia realize the danger she was in.", "ko": "소피아는 자신이 처한 위험을 전혀 깨닫지 못했다.", "ok": false, "why": "Little이 앞에 오고 did + 주어 + 동사원형이라서 맞아요."}, {"n": "④", "en": "Jim is good at singing, and so does Mike.", "ko": "짐은 노래를 잘하고, 마이크도 그렇다.", "ok": true, "why": "앞 문장이 be동사라서 so does가 아니라 so is여야 해요."}, {"n": "⑤", "en": "It was the action movie that Edward watched with Mark.", "ko": "에드워드가 마크와 함께 본 것은 바로 그 액션 영화였다.", "ok": false, "why": "목적어를 강조한 강조 구문이라서 맞아요."}], "pencil": "맞장구의 동사는 앞 문장이 be동사이면 ___로 받는다", "pencilKey": "be동사", "page": 242, "sec": "s2", "k": "pick", "tr": "① 문 앞에 키 큰 남자가 서 있었다. ② 코치는 선수들에게 최선을 다하라고 말했다. ③ Sophia는 자신이 처한 위험을 거의 깨닫지 못했다 킹 가다"], ["tomorrow", "내일"], ["next day", "다음 날"]], "h1": "따옴표 안의 I, will, tomorrow가 각각 어떻게 바뀌는지 하나씩 바꿔 보세요.", "h2": "I는 말한 사람 Lisa를 가리키는 she로 바꿔요. will은 주절이 과거(said)라서 would로, tomorrow는 '그 다음 날'을 뜻하는 말로 바꿔요.", "why": "I는 she로, will은 would로, tomorrow는 the next[following] day로 바꿔서 Lisa said that she would go hiking the next day(리사는 다음 날 하이킹을 갈 것이라고 말했다)가 돼요.", "opts": [], "pencil": "평서문 화법 전환에서 tomorrow는 the next ___로 바꾼다", "pencilKey": "day", "page": 243, "sec": "s2", "k": "self", "acc": [], "tr": "Lisa는 \"나는 내일 하이킹을 갈 거야.\"라고 말했다. (직접 화법을 간접 화법으로 바꾸는 문제예요.)", "ex": ["go hiking = 하이킹하러 가다"]}, {"id": "S2-09", "step": 2, "no": 9, "qtype": "화법 전환", "type": "write", "ans": "(1) how she spent her holiday (2) us not to feed the animals in the zoo", "concept": ["100-2", "100", "094"], "gap": "", "words": [["spend", "보내다"], ["holiday", "휴가"], ["feed", "먹이를 주다"], ["zoo", "동물원"]], "h1": "(1)은 How로 시작하는 질문, (2)는 Don't로 시작하는 명령문이에요. 각각 어떤 방식으로 전할지 정하세요.", "h2": "(1) 의문사가 있는 질문은 '의문사 + 주어 + 동사'로 쓰고 시제도 맞춰요. (2) 부정 명령문은 told 뒤에 not + to부정사로 써요.", "why": "(1) 의문사가 있어서 how로 잇고 '주어 + 동사' 순서에 과거 spent(원형 spend 보내다)를 써요. 그래서 how she spent her holiday예요. (2) 부정 명령문이라서 us not to feed(원형 feed 먹이를 주다) ...로 써요.", "opts": [], "pencil": "의문사 질문은 의문사 + ___ + 동사 순서로 쓴다", "pencilKey": "주어", "page": 243, "sec": "s2", "k": "self", "acc": [], "tr": "(1) 나는 그녀에게 \"휴일을 어떻게 보냈니?\"라고 말했다. (2) 안내원은 우리에게 \"동물원에서 동물에게 먹이를 주지 마세요.\"라고 말했다. (직접 화법을 간접 화법으로 바꾸는 문제예요.)", "ex": ["guide = 안내원", "spend a holiday = 휴일을 보내다"]}, {"id": "S2-10", "step": 2, "no": 10, "qtype": "화법 전환", "type": "write", "ans": "if [whether] she had ever visited, she hadn’t", "concept": ["100", "095"], "gap": "", "words": [["visit", "방문하다"], ["ever", "한 번이라도"], ["Korea", "한국"]], "h1": "대화를 간접화법으로 전하는 문제예요. 첫 빈칸은 질문, 둘째 빈칸은 대답이에요. 질문에 의문사가 있는지 보세요.", "h2": "Have you ever visited Korea?는 Yes나 No로 답하는 질문이에요. 주절이 asked(과거)이니 시제를 한 단계 앞당기세요. 대답 I haven't도 같은 방식이에요.", "why": "의문사가 없으니 if[whether] + 주어 + 동사 순서로 쓰고 현재완료를 과거완료로 바꿔 if she had eve wn은 우리에게 초콜릿 케이크를 만들어 주었다. ⓑ 민호는 그 가게에서 새 자전거를 샀다. ⓒ 경찰관 한 명이 버스 정류장에 서 있었다. ⓓ John은 자신이 아이돌이 될 거라고는 거의 상상하지 못했다.", "ex": ["police officer = 경찰관", "bus stop = 버스 정류장", "idol = 아이돌(인기 가수)"]}, {"id": "S4-03", "step": 4, "no": 3, "qtype": "간접화법으로 바꿔 쓰기", "type": "write", "ans": "(1) She warned me to keep the door locked. (2) They asked him how long he had been waiting there. (3) Sally asked Jack if [whether] he could give her a ride home the next[following] day.", "concept": ["100-2", "100", "094"], "gap": "", "words": [["warn", "경고하다"], ["keep", "계속 ~한 상태로 두다"], ["lock", "잠그다"], ["give a ride", "태워 주다"]], "h1": "(1)은 명령문, (2)는 의문사 질문, (3)은 의문사 없는 질문이에요. 괄호 안 동사로 시작하고, 각각 연결 방법을 구분하세요.", "h2": "(1) told 대신 warn으로 쓰고 명령문은 to부정사로 바꿔요. (2) 의문사 how long을 그대로 쓰고 주어 + 동사 순서, 시제 한 단계 앞당김이에요. (3) if[whether]로 잇고 me를 her로, tomorrow를 the next day로 바꿔요.", "why": "(1) warned me to keep the door locked(문을 잠근 채로 두라고 경고했다). (2) asked him how long he had been waiting there로 현재완료진행을 과거완료진행으로 바꿔요. (3) asked Jack if he could give her a ride home the next day로 써요.", "opts": [], "pencil": "명령문은 warn 같은 전달동사 + 사람 + ___으로 바꾼다", "pencilKey": "to부정사", "page": 246, "sec": "s4", "k": "self", "acc": [], "tr": "(1) 그녀는 내게 \"문을 잠가 둬.\"라고 말했다. (2) 그들은 그에게 \"여기서 얼마나 오래 기다리고 있었어요?\"라고 말했다. (3) Sally는 Jack에게 \"내일 나를 집까지 태워 줄 수 있어?\"라고 말했다. (괄호 안 단어를 이용해 간접 화법으로 바꾸는 문제예요.)", "ex": ["keep ~ locked = ~을 잠가 둔 채로 두다", "give ~ a ride = ~를 태워 주다"]}, {"id": "S4-04", "step": 4, "no": 4, "qtype": "어색한 대화 모두 고르기", "type": "mc", "ans": "①, ④", "concept": ["097", "097-H1"], "gap": "", "words": [["join", "가입하다"], ["apologize", "사과하다"], ["poem", "시"], ["advise", "충고하다"], ["right hand", "오른손"]], "h1": "짝지어진 대화에서 어색한 것을 모두 고르는 문제예요. 맞장구, 강조, 부정어, 명령 전달을 하나씩 확인하세요.", "h2": "부정어나 neither가 앞에 오면 뒤는 '조동사 + 주어 + 동사' 순서가 돼요. 보기에서 이 순서가 지켜지지 않은 곳을 찾으세요.", "why": "① neither Sam will은 neither will Sam이어야 하고, ④ Hardly I can은 Hardly can I여야 해요.", "opts": [{"n": "①", "en": "A Will you join the band? / B I won't join it, and neithe
