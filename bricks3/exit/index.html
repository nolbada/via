s.)","ko":"그것은 precious했기 때문에, 화가들은 울트라마린을 그림의 중요한 부분을 위해 아껴 두었다.","opts":["흔한","오래된","귀중한","가벼운"],"word":"precious","r":{"a":"3) 귀중한","ev":"5~7번 문장","s":[[5,"It took 1 kilogram of stone to produce only 30 grams of paint.","돌 1킬로그램으로 겨우 30그램의 물감을 만들 수 있었다."],[6,"Making this small amount cost more than 40 grams of gold.","이 적은 양을 만드는 데 금 40그램보다 더 많은 비용이 들었다."],[7,"Since it was precious, artists saved ultramarine for the important parts of paintings.","그것은 귀했기 때문에, 화가들은 울트라마린을 그림의 중요한 부분을 위해 아껴 두었다."]],"w":"6번에서 금 40그램보다 더 비쌌고, 화가들은 아껴 두었어요. 그래서 precious는 '귀중한'이에요.","c":3},"h":"66e89ba059"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was cheaper but still high in quality.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 더 저렴했지만 품질은 여전히 높았다.","opts":["청금석","금","아프가니스탄의 산","울트라마린의 인공 버전"],"r":{"a":"4) 울트라마린의 인공 버전","ev":"9~10번 문장","s":[[9,"In the 1800s, a man-made version of ultramarine was created.","1800년대에, 울트라마린의 인공 버전이 만들어졌다."],[10,"It was cheaper but still high in quality.","그것은 더 저렴했지만 품질은 여전히 높았다."]],"w":"9번에서 새로 만들어진 것이 a man-made version of ultramarine(인공 울트라마린)이에요. 10번의 It은 그것이 더 싸지만 품질이 좋다는 말이에요.","c":4},"h":"1f17bd9ba3"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Today, ultramarine is no longer expensive, but its beauty still shines.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"오늘날 울트라마린은 더 이상 비싸지 않지만, 그 아름다움은 여전히 빛난다.","opts":["오늘날 울트라마린은 여전히 비싸고, 그 아름다움도 사라졌다.","오늘날 울트라마린은 더 이상 비싸지 않지만, 그 아름다움은 여전히 빛난다.","오늘날 울트라마린은 금보다 비싸고, 그 아름다움은 더욱 빛난다.","오늘날 울트라마린은 더 이상 쓰이지 않지만, 그 가격은 여전히 높다."],"r":{"a":"2) 오늘날 울트라마린은 더 이상 비싸지 않지만, 그 아름다움은 여전히 빛난다.","ev":"1, 13번 문장","s":[[1,"There was once a color worth more than gold: ultramarine.","한때 금보다 값어치가 나가는 색이 있었는데, 바로 울트라마린이다."],[13,"Today, ultramarine is no longer expensive, but its beauty still shines.","오늘날 울트라마린은 더 이상 비싸지 않지만, 그 아름다움은 여전히 빛난다."]],"w":"no longer expensive는 '더 이상 비싸지 않다'이고 but 뒤는 아름다움이 그대로라는 말이에요. 1번의 예전(금보다 값어치)과 대비돼요.","c":2},"h":"60b3cdef44"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["돌 1킬로그램으로 겨우 30그램의 물감을 만들 수 있었다.","울트라마린은 여러 나라에서 발견되었다.","고흐는 인공 울트라마린으로 인물화를 그렸다.","인공 울트라마린은 원래 것보다 더 비쌌다."],"opts":["It took 1 kilogram of lapis lazuli to make only 30 grams of paint.","Ultramarine was found in many countries.","Van Gogh used man-made ultramarine to paint a portrait.","The man-made ultramarine was more expensive than the original."],"r":{"a":"1) It took 1 kilogram of lapis lazuli to make only 30 grams of paint.","ev":"3, 5, 10, 12번 문장","s":[[3,"It was found only in the mountains of Afghanistan.","그것은 오직 아프가니스탄의 산에서만 발견되었다."],[5,"It took 1 kilogram of stone to produce only 30 grams of paint.","돌 1킬로그램으로 겨우 30그램의 물감을 만들 수 있었다."],[10,"It was cheaper but still high in quality.","그것은 더 저렴했지만 품질은 여전히 높았다."],[12,"For example, Vincent Van Gogh painted the night sky with it in his work Starry Night Over the Rhône.","예를 들어, 빈센트 반 고흐는 자신의 작품 〈론강 위의 별이 빛나는 밤〉에서 그것으로 밤하늘을 그렸다."]],"w":"5번에서 돌 1킬로그램으로 30그램의 물감을 만들었어요. 발견된 곳은 아프가니스탄뿐이고(3번), 고흐는 밤하늘을 그렸고(12번), 인공 버전은 더 저렴했어요(10번).","c":1},"h":"4e820980eb"},{"n":9,"t":"sum","q":"Ultramarine was often used for the Virgin Mary's (A), and Van Gogh painted the night (B) with it.","ko":"울트라마린은 동정녀 마리아의 (A)에 자주 사용되었고, 고흐는 그것으로 밤 (B)을(를) 그렸다.","oko":["(A) 왕관 / (B) 바다","(A) 옷 / (B) 정원","(A) 왕관 / (B) 하늘","(A) 신발 / (B) 하늘","(A) 옷 / (B) 하늘"],"opts":["(A) crown / (B) sea","(A) robes / (B) garden","(A) crown / (B) sky","(A) shoes / (B) sky","(A) robes / (B) sky"],"r":{"a":"5) (A) robes / (B) sky ((A) 옷 / (B) 하늘)","ev":"8, 12번 문장","s":[[8,"It was often used for the Virgin Mary’s robes.","그것은 동정녀 마리아의 옷에 자주 사용되었다."],[12,"For example, Vincent Van Gogh painted the night sky with it in his work Starry Night Over the Rhône.","예를 들어, 빈센트 반 고흐는 자신의 작품 〈론강 위의 별이 빛나는 밤〉에서 그것으로 밤하늘을 그렸다."]],"w":"8번에서 울트라마린은 동정녀 마리아의 옷(robes)에 자주 쓰였고, 12번에서 고흐는 그것으로 밤하늘(sky)을 그렸어요.","c":5},"h":"18b3be91ee"},{"n":10,"t":"fill","q":"Making this small [A] [B] more than 40 grams of gold.","ko":"이 적은 [A]을(를) 만드는 데 금 40그램보다 더 많은 비용이 [B].","bank":["amount","cost","mountains","artists","paintings","stones"],"bko":{"amount":"양","cost":"(비용이) 들었다","mountains":"산들","artists":"화가들","paintings":"그림들","stones":"돌들"},"r":{"a":"[A] amount (양), [B] cost ((비용이) 들었다)","ev":"6번 문장","s":[[6,"Making this small amount cost more than 40 grams of gold.","이 적은 양을 만드는 데 금 40그램보다 더 많은 비용이 들었다."]],"w":"6번에서 이 적은 양(amount)을 만드는 데 금 40그램보다 더 많은 비용이 들었다(cost)고 해요. this small 뒤에는 단수 명사가, 그 뒤에는 동사가 와야 해요.","c":null},"h":"bd2fc7a8da"}]},{"u":7,"id":"b3-07-1","no":1,"ko":"우주로 쏘아 올린 금빛 레코드, 무엇을 담았을까?","items":[{"n":1,"t":"tf","q":"Each of the two Voyager spacecraft carried a Golden Record.","ko":"두 보이저 우주선은 각각 골든 레코드를 싣고 있었다.","r":{"a":"T (본문과 맞는 내용)","w":"1번에서 우주선 두 대(보이저 1호, 2호)를 발사했고, 2번에서 Each carried the Golden Record(각각 골든 레코드를 실었다)라고 함. 본문과 같은 내용.","c":"T","ev":"1~2번 문장","s":[[1,"In 1977, NASA launched two spacecraft, Voyager 1 and Voyager 2.","1977년에 NASA는 두 대의 우주선, 보이저 1호와 보이저 2호를 발사했다."],[2,"Each carried a special item called the Golden Record.","각각은 골든 레코드라고 불리는 특별한 물건을 싣고 있었다."]]},"h":"03a41a7f7d"},{"n":2,"t":"tf","q":"The Golden Record has 55 images and greetings in 115 languages.","ko":"골든 레코드에는 이미지 55장과 115개 언어의 인사말이 들어 있다.","r":{"a":"F (숫자가 바뀐 내용)","w":"5번에서 이미지는 115장, 7번에서 인사말은 55개 언어. 숫자가 서로 바뀌어 있으므로 F.","c":"F","ev":"5번, 7번 문장","s":[[5,"The record includes 115 images of daily life on Earth.","그 레코드에는 지구의 일상생활을 담은 이미지 115장이 들어 있다."],[7,"It also has greetings in 55 languages, music from various cultures, and natural sounds like wind, rainfall, and ocean waves.","또한 55개 언어의 인사말, 다양한 문화의 음악, 그리고 바람, 빗소리, 파도 소리 같은 자연의 소리도 담겨 있다."]]},"h":"e3e0fd9a06"},{"n":3,"t":"tf","q":"The cover of the record has drawings that show where Earth is in space.","ko":"레코드의 표지에는 우주에서 지구가 어디에 있는지 보여 주는 그림이 있다.","r":{"a":"T (본문과 맞는 내용)","w":"8번에서 표지에 단순한 그림이 있고, 9번에서 그 그림이 우주에서 지구가 어디에 있는지 설명한다고 함. 본문과 같은 내용.","c":"T","ev":"8~9번 문장","s":[[8,"The cover of the record shows simple drawings.","레코드의 표지에는 단순한 그림들이 그려져 있다."],[9,"They explain how to play the record and where Earth is in space.","그 그림들은 레코드를 재생하는 방법과 우주에서 지구가 어디에 있는지를 설명한다."]]},"h":"214d30a6b4"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... music from various cultures, and natural sounds ...)","ko":"... 다양한 문화의 음악과 자연의 소리 ...","opts":["비슷한","다양한","유명한","오래된"],"word":"various","r":{"a":"2) 다양한","w":"인사말, 음악, 자연의 소리를 나열하는 7번 문장에서 various cultures는 '여러 가지 문화'. various = 다양한. 비슷한은 반대 방향의 뜻.","c":2,"ev":"7번 문장","s":[[7,"It also has greetings in 55 languages, music from various cultures, and natural sounds like wind, rainfall, and ocean waves.","또한 55개 언어의 인사말, 다양한 문화의 음악, 그리고 바람, 빗소리, 파도 소리 같은 자연의 소리도 담겨 있다."]]},"h":"421df9547e"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... people desire to connect with life beyond Earth.)","ko":"... 사람들이 지구 너머의 생명체와 연결되기를 바란다.","opts":["두려워하다","거절하다","바라다","잊다"],"word":"desire","r":{"a":"3) 바라다","w":"11번은 레코드를 보낸 노력이 '지구 밖 생명체와 연결되고 싶은 마음'을 보여 준다는 말. desire = 바라다, 원하다.","c":3,"ev":"11번 문장","s":[[11,"These efforts show that people desire to connect with life beyond Earth.","이러한 노력은 사람들이 지구 너머의 생명체와 연결되기를 바란다는 것을 보여 준다."]]},"h":"f6911a4021"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey explain how to play the record and where Earth is in space.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 레코드를 재생하는 방법과 우주에서 지구가 어디에 있는지를 설명한다.","opts":["115장의 이미지","55개 언어의 인사말","보이저 우주선 두 대","표지의 단순한 그림들"],"r":{"a":"4) 표지의 단순한 그림들","w":"8번에서 레코드 표지에 simple drawings(단순한 그림들)가 있다고 하고, 9번의 They가 그 그림들을 받아 재생 방법과 지구의 위치를 설명함.","c":4,"ev":"8~9번 문장","s":[[8,"The cover of the record shows simple drawings.","레코드의 표지에는 단순한 그림들이 그려져 있다."],[9,"They explain how to play the record and where Earth is in space.","그 그림들은 레코드를 재생하는 방법과 우주에서 지구가 어디에 있는지를 설명한다."]]},"h":"0303514bb8"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"It is like a time capsule that carries the story of Earth.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것은 지구의 이야기를 싣고 있는 타임캡슐과 같다.","opts":["그것은 지구에서 가장 오래된 물건이다.","그것은 지구로 돌아오는 시간을 알려 주는 시계이다.","그것은 지구의 이야기를 담아 두었다가 먼 훗날 전해 주는 물건과 같다.","그것은 우주 비행사를 위한 작은 집이다."],"r":{"a":"3) 그것은 지구의 이야기를 담아 두었다가 먼 훗날 전해 주는 물건과 같다.","w":"time capsule은 지금의 이야기를 담아 두었다가 먼 훗날 전해 주는 통이에요. 13번은 골든 레코드가 지구의 이야기를 싣고 있는 타임캡슐 같다는 뜻이에요.","c":3,"ev":"13번 문장","s":[[13,"It is like a time capsule that carries the story of Earth.","그것은 지구의 이야기를 싣고 있는 타임캡슐과 같다."]]},"h":"4c200ea9f7"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["골든 레코드는 너비가 약 30센티미터인 은빛 원반이다.","골든 레코드는 지구에 있는 사람들에게 메시지를 보내려고 만들어졌다.","골든 레코드는 오늘날에도 여전히 우주를 여행하고 있다.","골든 레코드는 우주를 여행한 뒤 지구로 돌아왔다."],"opts":["The Golden Record is a silver disc about 30 centimeters wide.","The Golden Record was made to send a message to people on Earth.","The Golden Record is still traveling through the universe today.","The Golden Record came back to Earth after traveling through space."],"r":{"a":"3) The Golden Record is still traveling through the universe today. (골든 레코드는 오늘날에도 여전히 우주를 여행하고 있다.)","w":"12번에서 골든 레코드는 오늘날에도 여전히 우주를 여행하고 있다고 해요. 레코드는 금빛 원반이고(3번), 메시지는 지구 너머의 생명체에게 보내려는 것이에요(4번).","c":3,"ev":"3, 12번 문장","s":[[3,"It was a gold disc about 30 centimeters wide.","그것은 너비가 약 30센티미터인 금빛 원반이었다."],[12,"The Golden Record is still traveling through the universe today.","골든 레코드는 오늘날에도 여전히 우주를 여행하고 있다."]]},"h":"070eebacc1"},{"n":9,"t":"sum","q":"The Golden Record was made to send a message to (A) life beyond Earth, and it holds images, greetings, music, and sounds that show (B) on Earth.","ko":"골든 레코드는 지구 너머의 (A) 생명체에게 메시지를 보내려고 만들어졌고, 지구의 (B)을 보여 주는 이미지, 인사말, 음악, 소리를 담고 있다.","oko":["(A) 위험한 / (B) 우주 여행","(A) 단순한 / (B) 우주 여행","(A) 위험한 / (B) 바다 생물","(A) 지적인 / (B) 우주 여행","(A) 지적인 / (B) 일상생활"],"opts":["(A) dangerous / (B) space travel","(A) simple / (B) space travel","(A) dangerous / (B) ocean life","(A) intelligent / (B) space travel","(A) intelligent / (B) daily life"],"r":{"a":"5) (A) intelligent / (B) daily life","w":"4번에서 지구 너머의 intelligent life(지적 생명체)에게 보내는 메시지이고, 5~6번에서 이미지는 daily life(일상생활)를 보여 줌. 위험한 생명체나 우주 여행 이야기는 없음.","c":5,"ev":"4~7번 문장","s":[[4,"It was created to send a message to intelligent life beyond Earth.","그것은 지구 너머의 지적 생명체에게 메시지를 보내기 위해 만들어졌다."],[5,"The record includes 115 images of daily life on Earth.","그 레코드에는 지구의 일상생활을 담은 이미지 115장이 들어 있다."],[6,"These show things like people eating, children playing, and animals in nature.","이 이미지들은 사람들이 먹는 모습, 아이들이 노는 모습, 자연 속 동물들 같은 것을 보여 준다."],[7,"It also has greetings in 55 languages, music from various cultures, and natural sounds like wind, rainfall, and ocean waves.","또한 55개 언어의 인사말, 다양한 문화의 음악, 그리고 바람, 빗소리, 파도 소리 같은 자연의 소리도 담겨 있다."]]},"h":"fcadd2f4a5"},{"n":10,"t":"fill","q":"These [A] may help other life forms [B] the message.","ko":"이러한 [A]은(는) 다른 생명체들이 메시지를 [B]하도록 도울 수도 있다.","bank":["clues","understand","wide","various","capsule","natural"],"bko":{"clues":"단서들","understand":"이해(하다)","wide":"폭이 넓은","various":"다양한","capsule":"캡슐","natural":"자연의"},"r":{"a":"[A] clues (단서들), [B] understand (이해(하다))","w":"10번에서 이 단서들(clues)은 다른 생명체들이 메시지를 이해하도록(understand) 도울 수도 있다고 해요. These 뒤에는 복수 명사가, help ... 뒤에는 동사원형이 와야 해요.","c":null,"ev":"10번 문장","s":[[10,"These clues may help other life forms understand the message.","이러한 단서들은 다른 생명체들이 메시지를 이해하도록 도울 수도 있다."]]},"h":"46c8834f82"}]},{"u":7,"id":"b3-07-2","no":2,"ko":"열도 접착제도 없이 금속이 저절로 붙는다고?","items":[{"n":1,"t":"tf","q":"Galileo’s large antenna stuck to the body of the spacecraft and would not open.","ko":"갈릴레오의 큰 안테나는 우주선 본체에 달라붙어 펴지지 않았다.","r":{"a":"T (본문과 맞는 내용)","w":"2번 문장에 Its large antenna stuck to the body of the spacecraft and wouldn’t open이라고 나옴. 본문과 같은 내용.","c":"T","ev":"2번 문장","s":[[2,"Its large antenna stuck to the body of the spacecraft and wouldn’t open.","큰 안테나가 우주선 본체에 달라붙어 펴지지 않았다."]]},"h":"d370a891de"},{"n":2,"t":"tf","q":"On Earth, the layer of air and moisture does not come back after the metal is cleaned.","ko":"지구에서 공기와 수분의 층은 금속을 닦은 뒤에는 다시 생기지 않는다.","r":{"a":"F (본문과 반대인 내용)","w":"6번에서 It forms again instantly even after cleaning이라고 함. 닦아도 곧바로 다시 생기므로 반대.","c":"F","ev":"6번 문장","s":[[6,"It forms again instantly even after cleaning.","그 층은 닦아 낸 뒤에도 곧바로 다시 생긴다."]]},"h":"850190948e"},{"n":3,"t":"tf","q":"Cold welding can happen in space because there is no air to form a surface layer.","ko":"우주에는 표면의 층을 만들 공기가 없어서 냉간 용접이 일어날 수 있다.","r":{"a":"T (본문과 맞는 내용)","w":"11번에서 우주는 진공이라 층을 만들 공기가 없고, 13~14번에서 그래서 금속이 직접 결합하는 냉간 용접이 일어난다고 함. 본문과 같은 내용.","c":"T","ev":"11~14번 문장","s":[[11,"Since space is a vacuum, there is no air to form a surface layer.","우주는 진공이어서, 표면의 층을 만들 공기가 없다."],[12,"Metal surfaces stay perfectly clean.","금속 표면은 완벽하게 깨끗한 상태로 있다."],[13,"So when two metal parts touch, their atoms meet directly and bond together.","그래서 두 금속 부품이 닿으면, 원자들이 곧바로 만나 서로 결합한다."],[14,"This is called cold welding.","이것을 냉간 용접(콜드 웰딩)이라고 한다."]]},"h":"2b34ebaf7e"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (... high heat to remove this layer and melt the metals slightly.)","ko":"... 이 층을 없애고 금속을 살짝 녹이기 위한 높은 열","opts":["완전히","빠르게","약간","영원히"],"word":"slightly","r":{"a":"3) 약간","w":"7번은 금속을 ‘살짝’ 녹여서 원자가 만나게 한다는 말. slightly = 약간, 조금. 완전히 녹이는 것은 아님.","c":3,"ev":"7번 문장","s":[[7,"To join metals on Earth, we must use high heat to remove this layer and melt the metals slightly.","지구에서 금속을 붙이려면, 이 층을 없애고 금속을 살짝 녹이기 위해 높은 열을 써야 한다."]]},"h":"afabd98e8b"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (... engineers use special coatings to prevent this and keep spacecraft safe.)","ko":"... 엔지니어들은 이를 막고 우주선을 안전하게 지키기 위해 특수 코팅을 사용한다.","opts":["막다","돕다","만들다","찾다"],"word":"prevent","r":{"a":"1) 막다","w":"17번은 금속이 달라붙는 일을 막고 우주선을 안전하게 지킨다는 문장. prevent = 막다, 예방하다.","c":1,"ev":"17번 문장","s":[[17,"Today, engineers use special coatings to prevent this and keep spacecraft safe.","오늘날 엔지니어들은 이를 막고 우주선을 안전하게 지키기 위해 특수 코팅을 사용한다."]]},"h":"91c7b8b31c"},{"n":6,"t":"ref","q":"What does the underlined \"This\" refer to?\nThis is called cold welding.","ko":"밑줄 친 This가 가리키는 것은?","sko":"이것을 냉간 용접이라고 한다.","opts":["우주가 진공 상태인 것","금속 표면에 층이 다시 생기는 것","엔지니어들이 특수 코팅을 쓰는 것","두 금속 부품이 닿아 원자들이 곧바로 만나 결합하는 것"],"r":{"a":"4) 두 금속 부품이 닿아 원자들이 곧바로 만나 결합하는 것","w":"13번에서 두 금속 부품이 닿으면 원자들이 곧바로 만나 결합한다고 하고, 14번의 This가 바로 그 일을 받아 cold welding이라고 이름 붙임.","c":4,"ev":"13~14번 문장","s":[[13,"So when two metal parts touch, their atoms meet directly and bond together.","그래서 두 금속 부품이 닿으면, 원자들이 곧바로 만나 서로 결합한다."],[14,"This is called cold welding.","이것을 냉간 용접(콜드 웰딩)이라고 한다."]]},"h":"adb9441554"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"In the vacuum of space, metal parts may have touched and stuck together.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"우주의 진공에서 금속 부품들이 서로 닿아 달라붙었을지도 모른다.","opts":["진공 속에서 금속 부품들이 반드시 서로 닿아 녹았다.","우주의 진공에서 금속 부품들이 서로 닿아 달라붙었을 수도 있다.","우주에서 금속 부품이 서로 달라붙은 적은 한 번도 없다.","금속 부품들이 공기 때문에 서로 달라붙었다."],"r":{"a":"2) 우주의 진공에서 금속 부품들이 서로 닿아 달라붙었을 수도 있다.","w":"may have touched and stuck together = 닿아서 달라붙었을지도 모른다는 추측. 반드시(확실히)라는 뜻이 아니고, 공기가 없는 진공이라 공기 때문은 아님(11번).","c":2,"ev":"16번 문장","s":[[16,"In the vacuum of space, metal parts may have touched and stuck together.","우주의 진공에서 금속 부품들이 서로 닿아 달라붙었을지도 모른다."]]},"h":"a7fbced6ce"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["지구에서는 열 없이도 금속을 붙일 수 있다.","냉간 용접은 높은 열로 금속을 녹여야 일어난다.","우주에서 금속 표면은 완벽하게 깨끗한 상태로 있다.","엔지니어들은 우주선을 안전하게 지키려고 냉간 용접을 사용했다."],"opts":["On Earth, metals can be joined without any heat.","Cold welding needs high heat to melt the metals.","In space, metal surfaces stay perfectly clean.","Engineers used cold welding to keep spacecraft safe."],"r":{"a":"3) In space, metal surfaces stay perfectly clean. (우주에서 금속 표면은 완벽하게 깨끗한 상태로 있다.)","w":"12번에서 우주의 금속 표면은 완벽하게 깨끗한 상태로 있다고 해요. 지구에서는 높은 열이 필요하고(7번), 냉간 용접은 열 없이 일어나며(13~14번), 엔지니어는 코팅으로 막아요(17번).","c":3,"ev":"12번 문장","s":[[12,"Metal surfaces stay perfectly clean.","금속 표면은 완벽하게 깨끗한 상태로 있다."]]},"h":"efa76f232e"},{"n":9,"t":"sum","q":"In 1991, NASA's Galileo spacecraft had a (A). How could metal parts stick together without any (B) or heat?","ko":"1991년, NASA의 갈릴레오 우주선에 (A)이(가) 생겼다. 금속 부품이 (B)(이)나 열 없이 어떻게 서로 달라붙을 수 있었을까?","oko":["(A) 문제 / (B) 물","(A) 상 / (B) 접착제","(A) 문제 / (B) 페인트","(A) 상 / (B) 물","(A) 문제 / (B) 접착제"],"opts":["(A) problem / (B) water","(A) prize / (B) glue","(A) problem / (B) paint","(A) prize / (B) water","(A) problem / (B) glue"],"r":{"a":"5) (A) problem / (B) glue ((A) 문제 / (B) 접착제)","w":"1번에서 갈릴레오 우주선에 문제(problem)가 생겼고, 3번에서 접착제(glue)나 열 없이 어떻게 달라붙을 수 있었는지 물어요.","c":5,"ev":"1, 3번 문장","s":[[1,"In 1991, NASA’s Galileo spacecraft had a problem.","1991년, NASA의 갈릴레오 우주선에 문제가 생겼다."],[3,"How could they stick together without any glue or heat?","접착제나 열 없이 어떻게 서로 달라붙을 수 있었을까?"]]},"h":"20dd5da155"},{"n":10,"t":"fill","q":"This allows the [A] to meet and [B] together.","ko":"이렇게 하면 [A]이(가) 서로 만나 [B] 수 있다.","bank":["atoms","mix","thin","special","high","naturally"],"bko":{"atoms":"원자들","mix":"섞이다","thin":"얇은","special":"특별한","high":"높은","naturally":"자연스럽게"},"r":{"a":"[A] atoms (원자들), [B] mix (섞이다)","w":"8번에서 높은 열을 쓰면 원자들(atoms)이 서로 만나 섞일(mix) 수 있다고 해요. the 뒤에는 명사가, and 뒤에는 meet와 같은 형태의 동사가 와야 해요.","c":null,"ev":"8번 문장","s":[[8,"This allows the atoms to meet and mix together.","이렇게 하면 원자들이 서로 만나 섞일 수 있다."]]},"h":"ae64bea5d0"}]},{"u":7,"id":"b3-07-3","no":3,"ko":"소행성에 일부러 우주선을 부딪쳐 본 이유는?","items":[{"n":1,"t":"tf","q":"Most asteroids in space are small and harmless.","ko":"우주의 대부분의 소행성은 작고 해롭지 않다.","r":{"a":"T (본문과 맞는 내용)","w":"1번 문장에 Most asteroids in space are small and harmless라고 나옴. 본문 그대로의 내용.","c":"T","ev":"1번 문장","s":[[1,"Most asteroids in space are small and harmless.","우주의 대부분의 소행성은 작고 해롭지 않다."]]},"h":"b4a4e84d27"},{"n":2,"t":"tf","q":"Scientists chose Dimorphos because it was a big threat to Earth.","ko":"과학자들은 디모르포스가 지구에 큰 위협이었기 때문에 골랐다.","r":{"a":"F (본문과 반대인 내용)","w":"8번에서 It was not a threat to Earth(지구에 위협이 되지 않는다)라고 함. 위협이 아니어서 안전하게 연구할 수 있어 골랐으므로 반대.","c":"F","ev":"7~8번 문장","s":[[7,"For the test, scientists chose a small asteroid named Dimorphos.","시험을 위해 과학자들은 디모르포스라는 이름의 작은 소행성을 골랐다."],[8,"It was not a threat to Earth, so it was safe to study.","그것은 지구에 위협이 되지 않아서 연구하기에 안전했다."]]},"h":"d9c3be2998"},{"n":3,"t":"tf","q":"The DART spacecraft hit the asteroid at a high speed.","ko":"DART 우주선은 높은 속도로 소행성에 부딪쳤다.","r":{"a":"T (본문과 맞는 내용)","w":"10번에서 The DART spacecraft traveled through space and hit the asteroid at a high speed라고 함. 본문과 같은 내용.","c":"T","ev":"10번 문장","s":[[10,"The DART spacecraft traveled through space and hit the asteroid at a high speed.","DART 우주선은 우주를 가로질러 이동해 높은 속도로 소행성에 부딪쳤다."]]},"h":"647221408f"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The impact caused a slight change in the asteroid’s path.)","ko":"그 충돌은 소행성의 경로에 약간의 변화를 일으켰다.","opts":["거대한","약간의","갑작스러운","위험한"],"word":"slight","r":{"a":"2) 약간의","w":"11번에 이어 12번에서 The change was small(변화는 작았다)이라고 함. slight = 약간의, 작은.","c":2,"ev":"11~12번 문장","s":[[11,"The impact caused a slight change in the asteroid’s path.","그 충돌은 소행성의 경로를 약간 바꾸어 놓았다."],[12,"The change was small, but it proved that humans can push an asteroid off its course.","변화는 작았지만, 그것은 인간이 소행성을 원래 경로에서 밀어낼 수 있음을 증명했다."]]},"h":"23178d4e48"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (It was not a threat to Earth, so it was safe to study.)","ko":"그것은 지구에 위협이 되지 않아서 연구하기에 안전했다.","opts":["선물","기회","위협","도구"],"word":"threat","r":{"a":"3) 위협","w":"8번은 지구에 해가 되지 않아서 안전하게 연구할 수 있다는 말. not a threat = 위협이 아니다. 2번 문장의 dangerous asteroids와도 이어지는 뜻.","c":3,"ev":"8번 문장","s":[[8,"It was not a threat to Earth, so it was safe to study.","그것은 지구에 위협이 되지 않아서 연구하기에 안전했다."]]},"h":"840f3639bc"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt was also the right size for a test.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 또한 시험하기에 알맞은 크기였다.","opts":["DART 임무","지구에 가까이 온 큰 소행성","NASA의 우주선","소행성 디모르포스"],"r":{"a":"4) 소행성 디모르포스","w":"7번에서 작은 소행성 Dimorphos를 골랐다고 하고, 8번의 It과 9번의 It이 모두 그 소행성을 받음. 시험하기에 알맞은 크기였다는 것도 디모르포스 이야기.","c":4,"ev":"7~9번 문장","s":[[7,"For the test, scientists chose a small asteroid named Dimorphos.","시험을 위해 과학자들은 디모르포스라는 이름의 작은 소행성을 골랐다."],[8,"It was not a threat to Earth, so it was safe to study.","그것은 지구에 위협이 되지 않아서 연구하기에 안전했다."],[9,"It was also the right size for a test.","그것은 또한 시험하기에 알맞은 크기였다."]]},"h":"ad776b8172"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The change was small, but it proved that humans can push an asteroid off its course.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"변화는 작았지만, 그것은 인간이 소행성을 원래 경로에서 밀어낼 수 있음을 증명했다.","opts":["변화는 작았지만, 사람이 소행성의 경로를 바꿀 수 있다는 것이 증명되었다.","변화가 아주 커서, 소행성이 지구에서 완전히 멀어졌다.","변화가 없어서, 소행성의 경로를 바꿀 수 없다는 것이 증명되었다.","변화는 작았지만, 소행성이 지구를 향해 오게 되었다."],"r":{"a":"1) 변화는 작았지만, 사람이 소행성의 경로를 바꿀 수 있다는 것이 증명되었다.","w":"11번에서 경로가 약간 바뀌었고, 12번 but 뒤에서 그래도 소행성을 밀어낼 수 있음이 증명되었다고 함. 아주 컸다거나 변화가 없었다는 말은 본문과 맞지 않음.","c":1,"ev":"11~12번 문장","s":[[11,"The impact caused a slight change in the asteroid’s path.","그 충돌은 소행성의 경로를 약간 바꾸어 놓았다."],[12,"The change was small, but it proved that humans can push an asteroid off its course.","변화는 작았지만, 그것은 인간이 소행성을 원래 경로에서 밀어낼 수 있음을 증명했다."]]},"h":"3debfd7c4e"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["DART는 지구를 위협하는 큰 소행성에 시험되었다.","DART 우주선은 소행성에 부드럽게 내려앉았다.","과학자들은 이 기술이 앞으로 지구를 지키는 데 도움이 되기를 바란다.","시험은 인간이 소행성을 움직일 수 없음을 보여 주었다."],"opts":["DART was tested on a large asteroid that threatened Earth.","The DART spacecraft landed softly on the asteroid.","Scientists hope this technology will help protect Earth in the future.","The test showed that humans cannot move an asteroid."],"r":{"a":"3) Scientists hope this technology will help protect Earth in the future. (과학자들은 이 기술이 앞으로 지구를 지키는 데 도움이 되기를 바란다.)","w":"13번에서 과학자들은 이 기술이 앞으로 지구를 지키는 중요한 방법이 되기를 바란다고 해요. 시험한 소행성은 작았고(7번), DART는 높은 속도로 부딪쳤으며(10번), 인간이 소행성을 밀어낼 수 있음을 증명했어요(12번).","c":3,"ev":"13번 문장","s":[[13,"Scientists hope this technology will become an important way to protect Earth in the future.","과학자들은 이 기술이 앞으로 지구를 지키는 중요한 방법이 되기를 바란다."]]},"h":"697d5e01b8"},{"n":9,"t":"sum","q":"A large asteroid that hits Earth can cause (A) damage, so scientists look for ways to stop dangerous asteroids from getting (B) to our planet.","ko":"지구에 부딪치는 큰 소행성은 (A) 피해를 일으킬 수 있어서, 과학자들은 위험한 소행성이 우리 행성에 (B) 오지 못하게 막을 방법을 찾는다.","oko":["(A) 약간의 / (B) 멀리","(A) 해롭지 않은 / (B) 멀리","(A) 약간의 / (B) 가까이","(A) 심각한 / (B) 멀리","(A) 심각한 / (B) 가까이"],"opts":["(A) slight / (B) far","(A) harmless / (B) far","(A) slight / (B) close","(A) serious / (B) far","(A) serious / (B) close"],"r":{"a":"5) (A) serious / (B) close","w":"2번에서 큰 소행성이 부딪치면 serious damage(심각한 피해), 3번에서 위험한 소행성이 getting close(가까이 오는 것)를 막을 방법을 찾는다고 함. slight와 harmless는 1번의 작은 소행성 쪽 설명임.","c":5,"ev":"2~3번 문장","s":[[2,"But if a large one hits Earth, it can cause serious damage.","하지만 큰 소행성이 지구에 부딪치면 심각한 피해를 일으킬 수 있다."],[3,"That is why scientists look for ways to prevent dangerous asteroids from getting close to our planet.","그래서 과학자들은 위험한 소행성이 우리 행성에 가까이 오지 못하게 막을 방법을 찾는다."]]},"h":"29572649d7"},{"n":10,"t":"fill","q":"In 2022, NASA tested one possible [A]. The [B] was called DART.","ko":"2022년에 NASA는 한 가지 가능한 [A]을(를) 시험했다. 그 [B]은(는) DART라고 불렸다.","bank":["solution","mission","asteroids","scientists","harmless","planets"],"bko":{"solution":"해결책","mission":"임무","asteroids":"소행성들","scientists":"과학자들","harmless":"해롭지 않은","planets":"행성들"},"r":{"a":"[A] solution (해결책), [B] mission (임무)","w":"4번에서 NASA가 시험한 것은 가능한 해결책(solution)이고, 5번에서 그 임무(mission)는 DART라고 불렸어요. one possible 뒤와 The 뒤에는 단수 명사가 와야 해요.","c":null,"ev":"4~5번 문장","s":[[4,"In 2022, NASA tested one possible solution.","2022년에 NASA는 한 가지 가능한 해결책을 시험했다."],[5,"The mission was called DART.","그 임무는 DART라고 불렸다."]]},"h":"5616afe249"}]},{"u":7,"id":"b3-07-4","no":4,"ko":"달은 모양이 변하는데 왜 늘 같은 면만 보일까?","items":[{"n":1,"t":"tf","q":"The Moon takes about 27.3 days to spin once on its axis.","ko":"달은 자기 축을 중심으로 한 바퀴 도는 "For a long time, people wondered what the far side of the Moon looked like.","오랫동안 사람들은 달의 뒷면이 어떻게 생겼을지 궁금해했다."]]},"h":"1bc739198c"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey got some answers in 1959, when a spaceship took the first photos.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 1959년에 우주선이 처음으로 사진을 찍었을 때 몇 가지 답을 얻었다.","opts":["달의 모양들","우주선의 사진들","사람들","달의 뒷면"],"r":{"a":"3) 사람들","w":"8번에서 달의 뒷면이 궁금했던 주어는 people(사람들). 9번의 They가 그 사람들을 받아 답을 얻었다고 함.","c":3,"ev":"8~9번 문장","s":[[8,"For a long time, people wondered what the far side of the Moon looked like.","오랫동안 사람들은 달의 뒷면이 어떻게 생겼을지 궁금해했다."],[9,"They got some answers in 1959, when a spaceship took the first photos.","그들은 1959년에 우주선이 처음으로 사진을 찍었을 때 몇 가지 답을 얻었다."]]},"h":"1a75e3d26a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"But from the Earth, we still only see one side of the Moon.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"하지만 지구에서는, 우리는 여전히 달의 한쪽 면만 본다.","opts":["지구에서는 이제 달의 양쪽 면을 모두 볼 수 있다.","사진이 많이 찍혀서 달의 뒷면이 지구에서 보인다.","지구에서는 지금도 달의 한쪽 면만 볼 수 있다.","지구에서는 달이 하나도 보이지 않는다."],"r":{"a":"3) 지구에서는 지금도 달의 한쪽 면만 볼 수 있다.","w":"only one side는 '한쪽 면만'이라는 뜻이에요. 뒷면 사진이 많이 찍힌 뒤에도(12번) 지구에서는 여전히 달의 한쪽 면만 보인다는 뜻이에요.","c":3,"ev":"13번 문장","s":[[13,"But from the Earth, we still only see one side of the Moon.","하지만 지구에서는, 우리는 여전히 달의 한쪽 면만 본다."]]},"h":"d9af37502f"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["달은 자기 축을 중심으로 한 바퀴 도는 데 약 7일이 걸린다.","우리는 지구에서 달의 뒷면을 볼 수 있다.","1959년 이후 달의 사진이 훨씬 더 많이 찍혔다.","달의 뒷면은 우리가 보는 면과 똑같이 생겼다."],"opts":["The Moon takes about 7 days to spin once on its axis.","People can see the far side of the Moon from the Earth.","Many more photos of the Moon have been taken since 1959.","The far side of the Moon looks the same as the side we see."],"r":{"a":"3) Many more photos of the Moon have been taken since 1959. (1959년 이후 달의 사진이 훨씬 더 많이 찍혔다.)","w":"12번에서 그 이후로 훨씬 더 많은 사진이 찍혔다고 해요(그 처음은 9번의 1959년). 달의 자전은 약 27.3일이 걸리 app on your phone.","목걸이는 이 데이터를 당신의 휴대폰에 있는 앱으로 보낸다."]]},"h":"1226f956b2"},{"n":2,"t":"tf","q":"The app shows only the number of steps your dog takes.","ko":"앱은 반려견이 걷는 걸음 수만 보여 준다.","r":{"a":"F (본문과 다른 내용)","w":"5번에서 걸음 수뿐 아니라 물을 얼마나 마시는지도 보여 주고, 6번에서 긁기·핥기·짖기에 쓰는 시간도 알려 줌. ‘걸음 수만’이라는 말이 틀림.","c":"F","ev":"5~6번 문장","s":[[5,"The app shows how many steps your dog takes and how much water it drinks.","앱은 반려견이 몇 걸음을 걷는지와 물을 얼마나 마시는지를 보여 준다."],[6,"It even tells you if your dog spends too much time scratching, licking, or barking.","그것은 심지어 반려견이 긁거나, 핥거나, 짖는 데 너무 많은 시간을 쓰는지도 알려 준다."]]},"h":"251d318816"},{"n":3,"t":"tf","q":"If your dog crosses the virtual fence, the app warns you right away.","ko":"반려견이 가상 울타리를 넘으면, 앱이 즉시 당신에게 경고한다.","r":{"a":"T (본문과 맞는 내용)","w":"9번에서 가상 울타리를 설정하고, 10번에서 반려견이 경계를 넘으면 앱이 immediately(즉시) 경고한다고 함. 본문과 같은 내용.","c":"T","ev":"9~10번 문장","s":[[9,"You can even set a virtual fence.","당신은 가상 울타리를 설정할 수도 있다."],[10,"If your dog crosses the boundary, the app immediately warns you.","반려견이 경계를 넘으면, 앱이 즉시 당신에게 경고한다."]]},"h":"cf48605609"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Then it alerts you if something seems unusual.)","ko":"그런 다음 무언가 이상해 보이면 당신에게 알려 준다.","opts":["평범한","이상한","친절한","안전한"],"word":"unusual","r":{"a":"2) 이상한","w":"7번에서 AI가 반려견에게 ‘정상(normal)’이 무엇인지 판단하고, 8번에서 그것과 다르면 알려 줌. unusual = 평소와 다른, 이상한. 평범한은 반대 뜻.","c":2,"ev":"7~8번 문장","s":[[7,"Its AI system analyzes these patterns to determine what’s normal for your dog.","그것의 AI 시스템은 이러한 패턴을 분석해 반려견에게 무엇이 정상인지를 판단한다."],[8,"Then it alerts you if something seems unusual.","그런 다음 무언가 이상해 보이면 당신에게 알려 준다."]]},"h":"698e761999"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If your dog crosses the boundary, the app immediately warns you.)","ko":"반려견이 경계를 넘으면, 앱이 즉시 당신에게 경고한다.","opts":["가끔","천천히","나중에","즉시"],"word":"immediately","r":{"a":"4) 즉시","w":"10번은 경계를 넘자마자 앱이 경고한다는 문장. 경고가 필요한 상황이라 immediately = 즉시, 바로.","c":4,"ev":"10번 문장","s":[[10,"If your dog crosses the boundary, the app immediately warns you.","반려견이 경계를 넘으면, 앱이 즉시 당신에게 경고한다."]]},"h":"afcb91770e"},{"n":6,"t":"ref","q":"What does the underlined \"It\" refer to?\nIt even tells you if your dog spends too much time scratching, licking, or barking.","ko":"밑줄 친 It이 가리키는 것은?","sko":"그것은 심지어 반려견이 긁거나, 핥거나, 짖는 데 너무 많은 시간을 쓰는지도 알려 준다.","opts":["센서","반려견","앱","목걸이"],"r":{"a":"3) 앱","w":"5번에서 The app shows…라고 하고, 6번의 It이 이어서 같은 앱이 알려 주는 것을 말함. 반려견이 긁는 시간을 알려 주는 것은 반려견 자신이 아님.","c":3,"ev":"5~6번 문장","s":[[5,"The app shows how many steps your dog takes and how much water it drinks.","앱은 반려견이 몇 걸음을 걷는지와 물을 얼마나 마시는지를 보여 준다."],[6,"It even tells you if your dog spends too much time scratching, licking, or barking.","그것은 심지어 반려견이 긁거나, 핥거나, 짖는 데 너무 많은 시간을 쓰는지도 알려 준다."]]},"h":"875f0f958c"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Its AI system analyzes these patterns to determine what’s normal for your dog.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그것의 AI 시스템은 이러한 패턴을 분석해 반려견에게 무엇이 정상인지를 판단한다.","opts":["AI 시스템은 반려견에게 새로운 재주를 가르친다.","AI 시스템은 이런 패턴을 살펴보고 반려견에게 평소 상태가 어떤 것인지 판단한다.","AI 시스템은 목걸이의 배터리를 대신 충전해 준다.","AI 시스템은 반려견이 먹을 사료를 골라 준다."],"r":{"a":"2) AI 시스템은 이런 패턴을 살펴보고 반려견에게 평소 상태가 어떤 것인지 판단한다.","w":"analyze는 '분석하다', determine은 '판단하다', normal은 '정상인, 평소의'라는 뜻이에요. AI가 패턴을 분석해 평소 상태를 판단한다는 내용이에요.","c":2,"ev":"7번 문장","s":[[7,"Its AI system analyzes these patterns to determine what’s normal for your dog.","그것의 AI 시스템은 이러한 패턴을 분석해 반려견에게 무엇이 정상인지를 판단한다."]]},"h":"4f51da2095"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["목걸이는 반려견이 집에 있을 때만 사용할 수 있다.","반려견이 멀리 달려가면, GPS 지도가 반려견을 빨리 찾도록 도와준다.","가상 울타리는 반려견이 혼자 도망가지 못하게 막아 준다.","앱은 반려견의 사진만 보여 준다."],"opts":["The collar can be used only when your dog is at home.","If your dog runs far away, the GPS map helps you find it quickly.","A virtual fence stops your dog from running away by itself.","The app only shows pictures of your dog."],"r":{"a":"2) If your dog runs far away, the GPS map helps you find it quickly. (반려견이 멀리 달려가면, GPS 지도가 반려견을 빨리 찾도록 도와준다.)","w":"11번에서 반려견이 더 멀리 달려가면 GPS 지도가 빨리 찾도록 도와준다고 해요. 앱은 걸음 수, 물 마시는 양 등을 보여 주고(5~6번), 가상 울타리는 경계를 넘으면 경고해 줄 뿐이에요(9~10번).","c":2,"ev":"11번 문장","s":[[11,"If your dog runs farther away, the GPS map helps you find it quickly.","반려견이 더 멀리 달려가면, GPS 지도가 반려견을 빨리 찾도록 도와준다."]]},"h":"4fa01b2f35"},{"n":9,"t":"sum","q":"A smart collar collects data through its (A) and sends it to an app that shows your dog’s (B).","ko":"스마트 목걸이는 (A)를 통해 데이터를 모으고, 반려견의 (B)을 보여 주는 앱으로 보낸다.","oko":["(A) 배터리 / (B) 장난감","(A) 카메라 / (B) 활동","(A) 센서 / (B) 장난감","(A) 배터리 / (B) 활동","(A) 센서 / (B) 활동"],"opts":["(A) batteries / (B) toys","(A) cameras / (B) activities","(A) sensors / (B) toys","(A) batteries / (B) activities","(A) sensors / (B) activities"],"r":{"a":"5) (A) sensors / (B) activities","w":"3번에서 sensors로 데이터를 모으고, 4번에서 앱으로 보내며, 5~6번에서 걸음 수·물·긁기 등 반려견의 활동을 보여 줌. 카메라나 배터리, 장난감 이야기는 없음.","c":5,"ev":"3~6번 문장","s":[[3,"When your dog wears the collar, it begins collecting data through its sensors.","반려견이 목걸이를 착용하면, 그것은 센서를 통해 데이터를 수집하기 시작한다."],[4,"The collar sends this data to an app on your phone.","목걸이는 이 데이터를 당신의 휴대폰에 있는 앱으로 보낸다."],[5,"The app shows how many steps your dog takes and how much water it drinks.","앱은 반려견이 몇 걸음을 걷는지와 물을 얼마나 마시는지를 보여 준다."],[6,"It even tells you if your dog spends too much time scratching, licking, or barking.","그것은 심지어 반려견이 긁거나, 핥거나, 짖는 데 너무 많은 시간을 쓰는지도 알려 준다."]]},"h":"c199642b5c"},{"n":10,"t":"fill","q":"You discover your [A] friend’s [B] life in real time, right from your phone.","ko":"당신은 [A] 친구의 [B] 생활을 실시간으로, 휴대폰으로 바로 알게 된다.","bank":["furry","daily","steps","water","alerts","boundary"],"bko":{"furry":"털복숭이의","daily":"하루의, 일상의","steps":"걸음들","water":"물","alerts":"알림들","boundary":"경계"},"r":{"a":"[A] furry (털복숭이의), [B] daily (하루의, 일상의)","w":"13번에서 털복숭이(furry) 친구의 하루(daily) 생활을 실시간으로 알게 된다고 해요. friend's 앞과 life 앞에는 꾸며 주는 형용사가 와야 해요.","c":null,"ev":"13번 문장","s":[[13,"You discover your furry friend’s daily life in real time, right from your phone.","당신은 휴대폰으로 바로, 실시간으로 털복숭이 친구의 하루 생활을 알게 된다."]]},"h":"185c9cb6f7"}]},{"u":8,"id":"b3-08-2","no":2,"ko":"시끄러운 곳에서 소리를 없애는 헤드폰의 비밀","items":[{"n":1,"t":"tf","q":"Sound moves in waves, and these waves have an up-and-down pattern.","ko":"소리는 파동으로 움직이고, 이 파동은 위아래로 오르내리는 패턴을 가지고 있다.","r":{"a":"T (본문과 맞는 내용)","w":"3번 문장에 Sound moves in waves, and these waves have an up-and-down pattern이라고 나옴. 본문 그대로의 내용.","c":"T","ev":"3번 문장","s":[[3,"Sound moves in waves, and these waves have an up-and-down pattern.","소리는 파동으로 움직이고, 이 파동은 위아래로 오르내리는 패턴을 가지고 있다."]]},"h":"f5e5df9090"},{"n":2,"t":"tf","q":"When the highest parts of two sound waves meet, the sound becomes quieter.","ko":"두 소리 파동의 가장 높은 부분이 만나면, 소리가 더 작아진다.","r":{"a":"F (본문과 반대인 내용)","w":"5번에서 가장 높은 부분끼리 만나면 the sound becomes louder(소리가 더 커진다)고 함. 더 작아진다는 말은 반대.","c":"F","ev":"5번 문장","s":[[5,"If the highest part of one wave meets the highest part of another wave, the sound becomes louder.","한 파동의 가장 높은 부분이 다른 파동의 가장 높은 부분과 만나면, 소리가 더 커진다."]]},"h":"314e8207d4"},{"n":3,"t":"tf","q":"ANC headphones have tiny microphones that listen for outside sounds.","ko":"ANC 헤드폰에는 바깥 소리를 듣는 아주 작은 마이크가 있다.","r":{"a":"T (본문과 맞는 내용)","w":"8번에서 They have tiny microphones that listen for outside sounds라고 함. 본문과 같은 내용.","c":"T","ev":"8번 문장","s":[[8,"They have tiny microphones that listen for outside sounds.","그것은 바깥 소리를 듣는 아주 작은 마이크를 가지고 있다."]]},"h":"7fa69b7ad7"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (When two sound waves meet, they overlap and affect each other.)","ko":"두 소리 파동이 만나면, 서로 겹쳐져 영향을 준다.","opts":["멈추다","나뉘다","겹치다","사라지다"],"word":"overlap","r":{"a":"3) 겹치다","w":"4번은 두 파동이 만나서 서로 영향을 준다는 말이고, 5~6번에서 높은 부분과 낮은 부분이 만나 커지거나 상쇄됨. 만나서 포개지는 것이므로 overlap = 겹치다.","c":3,"ev":"4~6번 문장","s":[[4,"When two sound waves meet, they overlap and affect each other.","두 소리 파동이 만나면, 서로 겹쳐져 영향을 준다."],[5,"If the highest part of one wave meets the highest part of another wave, the sound becomes louder.","한 파동의 가장 높은 부분이 다른 파동의 가장 높은 부분과 만나면, 소리가 더 커진다."],[6,"If the highest part of the wave meets the lowest part of the other wave, they cancel each other out.","파동의 가장 높은 부분이 다른 파동의 가장 낮은 부분과 만나면, 서로 상쇄된다."]]},"h":"2f400e8545"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When the microphones detect a noise, the headphones quickly make a “new” sound wave.)","ko":"마이크가 소음을 감지하면, 헤드폰은 재빨리 ‘새로운’ 소리 파동을 만든다.","opts":["끄다","섞다","만들다","감지하다"],"word":"detect","r":{"a":"4) 감지하다","w":"8번에서 마이크가 바깥 소리를 listen for(귀 기울여 듣는다)하고, 9번에서 소음을 알아채면 새 파동을 만듦. detect = 감지하다, 알아내다.","c":4,"ev":"8~9번 문장","s":[[8,"They have tiny microphones that listen for outside sounds.","그것은 바깥 소리를 듣는 아주 작은 마이크를 가지고 있다."],[9,"When the microphones detect a noise, the headphones quickly make a “new” sound wave.","마이크가 소음을 감지하면, 헤드폰은 재빨리 ‘새로운’ 소리 파동을 만든다."]]},"h":"999df312c7"},{"n":6,"t":"ref","q":"What does the underlined \"this idea\" refer to?\nANC headphones use this idea.","ko":"밑줄 친 this idea가 가리키는 것은?","sko":"ANC 헤드폰은 이 원리를 이용한다.","opts":["소리 파동이 위아래 패턴을 가진다는 것","높은 부분끼리 만나 소리가 커진다는 것","높은 부분과 낮은 부분이 만나 서로 상쇄된다는 것","마이크가 바깥 소리를 듣는다는 것"],"r":{"a":"3) 높은 부분과 낮은 부분이 만나 서로 상쇄된다는 것","w":"7번 바로 앞 6번 문장이 높은 부분과 낮은 부분이 만나 cancel each other out(상쇄)된다는 원리임. 5번의 소리가 커지는 경우는 ANC가 이용하는 것이 아니고, 마이크는 8번에 나오는 장치.","c":3,"ev":"5~7번 문장","s":[[5,"If the highest part of one wave meets the highest part of another wave, the sound becomes louder.","한 파동의 가장 높은 부분이 다른 파동의 가장 높은 부분과 만나면, 소리가 더 커진다."],[6,"If the highest part of the wave meets the lowest part of the other wave, they cancel each other out.","파동의 가장 높은 부분이 다른 파동의 가장 낮은 부분과 만나면, 서로 상쇄된다."],[7,"ANC headphones use this idea.","ANC 헤드폰은 이 원리를 이용한다."]]},"h":"ae76003dab"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"The result is near silence.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"그 결과는 거의 고요함이다.","opts":["그 결과는 소리가 아주 커진 상태이다.","그 결과는 소리가 거의 없는 조용한 상태이다.","그 결과는 새로운 음악이 만들어진 상태이다.","그 결과는 마이크가 고장 난 상태이다."],"r":{"a":"2) 그 결과는 소리가 거의 없는 조용한 상태이다.","w":"near는 '거의', silence는 '고요함'이라는 뜻이에요. 두 파동이 서로 상쇄된 결과 소리가 거의 없는 조용한 상태가 된다는 내용이에요(11~12번).","c":2,"ev":"12번 문장","s":[[12,"The result is near silence.","그 결과는 거의 고요함이다."]]},"h":"9a4157d258"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["새 소리 파동은 소음 파동과 정확히 반대 모양이다.","ANC 헤드폰은 음악을 보호하려고 소음을 더 키운다.","두 소리 파동은 서로 영향을 주지 않는다.","두 파동이 만난 결과는 아주 큰 소리이다."],"opts":["The new sound wave has the exact opposite shape of the noise’s wave.","ANC headphones make noise louder to protect music.","Two sound waves never affect each other.","The result of the two waves meeting is a very loud sound."],"r":{"a":"1) The new sound wave has the exact opposite shape of the noise’s wave.","w":"10번에서 새 파동은 소음의 파동과 정확히 반대 모양. 4번에서 두 파동은 서로 영향을 주고, 12번에서 만난 결과는 거의 고요함이라 나머지는 틀림.","c":1,"ev":"4번, 10번, 12번 문장","s":[[4,"When two sound waves meet, they overlap and affect each other.","두 소리 파동이 만나면, 서로 겹쳐져 영향을 준다."],[10,"This new wave is the exact opposite shape of the noise’s sound wave.","이 새로운 파동은 소음의 소리 파동과 정확히 반대 모양이다."],[12,"The result is near silence.","그 결과는 거의 고요함이다."]]},"h":"72dc74e2bc"},{"n":9,"t":"sum","q":"Many people use ANC headphones in (A) places. When two waves meet, they (B) each other out.","ko":"많은 사람들이 (A) 곳에서 ANC 헤드폰을 사용한다. 두 파동이 만나면 서로 (B)한다.","oko":["(A) 조용한 / (B) 반복","(A) 시끄러운 / (B) 반복","(A) 조용한 / (B) 상쇄","(A) 시끄러운 / (B) 복사","(A) 시끄러운 / (B) 상쇄"],"opts":["(A) quiet / (B) repeat","(A) noisy / (B) repeat","(A) quiet / (B) cancel","(A) noisy / (B) copy","(A) noisy / (B) cancel"],"r":{"a":"5) (A) noisy / (B) cancel ((A) 시끄러운 / (B) 상쇄)","w":"1번에서 사람들은 시끄러운(noisy) 곳에서 ANC 헤드폰을 쓰고, 11번에서 두 파동이 만나면 서로 상쇄돼요(cancel each other out).","c":5,"ev":"1, 11번 문장","s":[[1,"Many people today use Active Noise Canceling (ANC) headphones in noisy places.","오늘날 많은 사람들이 시끄러운 곳에서 능동형 소음 차단(ANC) 헤드폰을 사용한다."],[11,"When these two waves meet, they cancel each other out.","이 두 파동이 만나면, 서로 상쇄된다."]]},"h":"3c95eb4b14"},{"n":10,"t":"fill","q":"This is how ANC [A] creates a quiet [B] for your music.","ko":"이것이 ANC [A]이(가) 당신의 음악을 위한 조용한 [B]을(를) 만드는 방법이다.","bank":["technology","world","microphones","waves","headphones","noises"],"bko":{"technology":"기술","world":"세상","microphones":"마이크들","waves":"파동들","headphones":"헤드폰","noises":"소음들"},"r":{"a":"[A] technology (기술), [B] world (세상)","w":"13번에서 ANC 기술(technology)이 음악을 위한 조용한 세상(world)을 만든다고 해요. creates 앞에는 단수 주어가, a quiet 뒤에는 단수 명사가 와야 해요.","c":null,"ev":"13번 문장","s":[[13,"This is how ANC technology creates a quiet world for your music.","이것이 ANC 기술이 당신의 음악을 위한 조용한 세상을 만드는 방법이다."]]},"h":"d4c5bc5033"}]},{"u":8,"id":"b3-08-3","no":3,"ko":"전기차 vs 수소차, 어느 쪽이 더 깨끗할까?","items":[{"n":1,"t":"tf","q":"Electric cars use electricity stored in batteries.","ko":"전기 자동차는 배터리에 저장된 전기를 사용한다.","r":{"a":"T (본문과 맞는 내용)","w":"4번 문장에 Electric cars use electricity stored in batteries라고 나옴. 본문 그대로의 내용.","c":"T","ev":"4번 문장","s":[[4,"Electric cars use electricity stored in batteries.","전기 자동차는 배터리에 저장된 전기를 사용한다."]]},"h":"58b1051af6"},{"n":2,"t":"tf","q":"Hydrogen cars release only oxygen when they make electricity.","ko":"수소 자동차는 전기를 만들 때 오직 산소만 내보낸다.","r":{"a":"F (다른 것을 내보내는 내용)","w":"8번에서 수소를 산소와 결합해 전기를 만들고, 9번에서 내보내는 것은 only water(오직 물)라고 함. 산소가 아니라 물이므로 F.","c":"F","ev":"8~9번 문장","s":[[8,"Unlike electric cars, hydrogen cars make electricity by combining hydrogen with oxygen.","전기 자동차와 달리, 수소 자동차는 수소를 산소와 결합해 전기를 만든다."],[9,"In this process, they release only water.","이 과정에서 그것들은 오직 물만 내보낸다."]]},"h":"3652e19d20"},{"n":3,"t":"tf","q":"Charging an electric car takes a long time.","ko":"전기 자동차를 충전하는 데는 시간이 오래 걸린다.","r":{"a":"T (본문과 맞는 내용)","w":"6번 문장에 charging takes a long time이라고 나옴. 본문과 같은 내용.","c":"T","ev":"6번 문장","s":[[6,"While electricity is widely available, charging takes a long time.","전기는 널리 이용할 수 있지만, 충전하는 데 시간이 오래 걸린다."]]},"h":"8d899f3cb2"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (While electricity is widely available, charging takes a long time.)","ko":"전기는 널리 이용할 수 있지만, 충전하는 데 시간이 오래 걸린다.","opts":["거의 없이","널리","갑자기","조용히"],"word":"widely","r":{"a":"2) 널리","w":"6번은 전기를 쉽게 구할 수 있다는 장점을 말하고, While 뒤에서 단점(충전이 오래 걸림)이 이어짐. widely available = 널리 이용할 수 있는.","c":2,"ev":"6번 문장","s":[[6,"While electricity is widely available, charging takes a long time.","전기는 널리 이용할 수 있지만, 충전하는 데 시간이 오래 걸린다."]]},"h":"34015d6ea9"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (But hydrogen must be kept under high pressure, so stations need special equipment and strong safety rules.)","ko":"하지만 수소는 높은 압력으로 보관되어야 해서, 충전소에는 특별한 장비와 엄격한 안전 규정이 필요하다.","opts":["속도","온도","압력","무게"],"word":"pressure","r":{"a":"3) 압력","w":"11번은 수소를 꾹 눌러 보관해야 해서 특별한 장비와 안전 규정이 필요하다는 말. high pressure = 높은 압력.","c":3,"ev":"11번 문장","s":[[11,"But hydrogen must be kept under high pressure, so stations need special equipment and strong safety rules.","하지만 수소는 높은 압력으로 보관되어야 해서, 충전소에는 특별한 장비와 엄격한 안전 규정이 필요하다."]]},"h":"18a7fa97ac"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey can be refueled in minutes and travel long distances on a full tank.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그것들은 몇 분 만에 연료를 채울 수 있고 연료를 가득 채우면 먼 거리를 갈 수 있다.","opts":["전기 자동차","수소 자동차","충전소","배터리"],"r":{"a":"2) 수소 자동차","w":"몇 분 만에 연료를 채울 수 있다는 것은 8번에서 수소를 산소와 결합해 전기를 만든다고 소개된 수소 자동차 이야기예요.","c":2,"ev":"8, 10번 문장","s":[[8,"Unlike electric cars, hydrogen cars make electricity by combining hydrogen with oxygen.","전기 자동차와 달리, 수소 자동차는 수소를 산소와 결합해 전기를 만든다."],[10,"They can be refueled in minutes and travel long distances on a full tank.","그것들은 몇 분 만에 연료를 채울 수 있고 연료를 가득 채우면 먼 거리를 갈 수 있다."]],"k":"They = 수소 자동차"},"pron":"They","h":"ff61dade3b"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Unlike electric cars, hydrogen cars make electricity by combining hydrogen with oxygen.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"전기 자동차와 달리, 수소 자동차는 수소를 산소와 결합해 전기를 만든다.","opts":["수소차는 전기차와 달리 수소와 산소를 합쳐서 전기를 만든다.","수소차는 전기차처럼 배터리에 저장된 전기만 사용한다.","수소차는 수소를 태워서 엔진을 돌린다.","수소차는 전기차와 같은 방법으로 충전한다."],"r":{"a":"1) 수소차는 전기차와 달리 수소와 산소를 합쳐서 전기를 만든다.","w":"Unlike electric cars = 전기차와 달리. combining hydrogen with oxygen = 수소와 산소를 합침. 배터리 저장은 전기차의 방식(4번)이고, 엔진을 태운다는 말은 없음.","c":1,"ev":"4번, 8번 문장","s":[[4,"Electric cars use electricity stored in batteries.","전기 자동차는 배터리에 저장된 전기를 사용한다."],[8,"Unlike electric cars, hydrogen cars make electricity by combining hydrogen with oxygen.","전기 자동차와 달리, 수소 자동차는 수소를 산소와 결합해 전기를 만든다."]]},"h":"7009e2bc09"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["전기 자동차는 충전소에서만 충전할 수 있다.","수소 자동차는 연료를 채우는 데 오랜 시간이 걸린다.","대부분의 수소는 여전히 화석 연료에서 나온다.","배터리를 생산하고 재활용하는 일은 환경에 좋다."],"opts":["Electric cars can be charged only at charging stations.","Hydrogen cars take a long time to refuel.","Most hydrogen still comes from fossil fuels.","Producing and recycling batteries is good for the environment."],"r":{"a":"3) Most hydrogen still comes from fossil fuels.","w":"13번에서 대부분의 수소는 여전히 화석 연료에서 나온다고 함. 전기차는 집에서도 충전할 수 있고(5번), 수소차는 몇 분 만에 채우며(10번), 배터리 일은 환경에 해를 끼칠 수 있음(7번).","c":3,"ev":"5번, 7번, 10번, 13번 문장","s":[[5,"They can be charged at home or charging stations.","그것들은 집이나 충전소에서 충전할 수 있다."],[7,"Also, producing and recycling batteries can harm the environment.","또한 배터리를 생산하고 재활용하는 일은 환경에 해를 끼칠 수 있다."],[10,"They can be refueled in minutes and travel long distances on a full tank.","그것들은 몇 분 만에 연료를 채울 수 있고 연료를 가득 채우면 먼 거리를 갈 수 있다."],[13,"Also, most hydrogen still comes from fossil fuels, which cause pollution.","또한 대부분의 수소는 여전히 화석 연료에서 나오는데, 이는 오염을 일으킨다."]]},"h":"ea07519508"},{"n":9,"t":"sum","q":"Electric cars can be charged at (A) or charging stations, but producing and recycling batteries can (B) the environment.","ko":"전기 자동차는 (A)이나 충전소에서 충전할 수 있지만, 배터리를 생산하고 재활용하는 일은 환경에 (B)을(를) 줄 수 있다.","oko":["(A) 학교 / (B) 도움","(A) 집 / (B) 도움","(A) 학교 / (B) 해","(A) 집 / (B) 보호","(A) 집 / (B) 해"],"opts":["(A) school / (B) help","(A) home / (B) help","(A) school / (B) harm","(A) home / (B) save","(A) home / (B) harm"],"r":{"a":"5) (A) home / (B) harm ((A) 집 / (B) 해)","w":"5번에서 전기 자동차는 집(home)이나 충전소에서 충전할 수 있고, 7번에서 배터리 생산과 재활용은 환경에 해를 끼칠(harm) 수 있다고 해요.","c":5,"ev":"5, 7번 문장","s":[[5,"They can be charged at home or charging stations.","그것들은 집이나 충전소에서 충전할 수 있다."],[7,"Also, producing and recycling batteries can harm the environment.","또한 배터리를 생산하고 재활용하는 일은 환경에 해를 끼칠 수 있다."]]},"h":"e31b552079"},{"n":10,"t":"fill","q":"As technology [A], both may help drive us toward a cleaner [B].","ko":"기술이 [A], 둘 다 우리가 더 깨끗한 [B](으)로 나아가도록 도울 수 있다.","bank":["improves","future","batteries","stations","expensive","special"],"bko":{"improves":"발전한다(improve의 3인칭 현재)","future":"미래","batteries":"배터리들","stations":"충전소들","expensive":"비싼","special":"특별한"},"r":{"a":"[A] improves (발전한다(improve의 3인칭 현재)), [B] future (미래)","w":"15번에서 기술이 발전하면(improves) 둘 다 더 깨끗한 미래(future)로 나아가도록 도울 수 있다고 해요. technology 뒤에는 동사가, a cleaner 뒤에는 단수 명사가 와야 해요.","c":null,"ev":"15번 문장","s":[[15,"As technology improves, both may help drive us toward a cleaner future.","기술이 발전하면, 둘 다 우리가 더 깨끗한 미래로 나아가도록 도울 수 있다."]]},"h":"97ba5ce0d1"}]},{"u":8,"id":"b3-08-4","no":4,"ko":"AI가 그린 초상화, 진짜 예술일까?","items":[{"n":1,"t":"tf","q":"Edmond de Belamy was created by an AI system trained on historical portraits.","ko":"에드몽 드 벨라미는 역사적 초상화들로 훈련된 AI 시스템이 만들었다.","r":{"a":"T (본문과 맞는 내용)","w":"2번에서 it was created by an AI system trained on thousands of historical portraits라고 함. 본문과 같은 내용.","c":"T","ev":"2번 문장","s":[[2,"Although it looks like an old painting, it was created by an AI system trained on thousands of historical portraits.","그것은 오래된 그림처럼 보이지만, 수천 점의 역사적 초상화로 훈련된 AI 시스템이 만들었다."]]},"h":"8dfd6cefd5"},{"n":2,"t":"tf","q":"Everyone agreed that AI-generated work is real art.","ko":"모든 사람이 AI가 만든 작품이 진짜 예술이라는 데 동의했다.","r":{"a":"F (본문과 반대인 내용)","w":"3번에서 판매가 논쟁을 불러일으켰다고 하고, 7번에서 Others disagree(다른 사람들은 동의하지 않는다)고 함. 모두가 동의한 것이 아니므로 F.","c":"F","ev":"3번, 7번 문장","s":[[3,"The sale immediately sparked a debate: Should AI-generated work be considered real art?","그 판매는 즉시 논쟁을 불러일으켰다: AI가 만든 작품을 진짜 예술로 여겨야 할까?"],[7,"Others disagree.","다른 사람들은 동의하지 않는다."]]},"h":"e83ae71b0d"},{"n":3,"t":"tf","q":"Some people think the human artist still makes key choices when using AI.","ko":"어떤 사람들은 AI를 쓸 때도 인간 예술가가 여전히 핵심적인 선택을 한다고 생각한다.","r":{"a":"T (본문과 맞는 내용)","w":"5번에서 the artist still makes key choices, such as writing prompts, editing, and choosing the final image라고 함. 본문과 같은 내용.","c":"T","ev":"5번 문장","s":[[5,"From this point of view, the artist still makes key choices, such as writing prompts, editing, and choosing the final image.","이러한 관점에서, 예술가는 여전히 프롬프트 작성, 편집, 최종 이미지 선택 같은 핵심적인 선택을 한다."]]},"h":"bc2aee3a8d"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (The sale immediately sparked a debate: Should AI-generated work be considered real art?)","ko":"그 판매는 즉시 논쟁을 불러일으켰다: AI가 만든 작품을 진짜 예술로 여겨야 할까?","opts":["경기","논쟁","실수","축제"],"word":"debate","r":{"a":"2) 논쟁","w":"3번에서 콜론(:) 뒤에 Should AI-generated work be considered real art?라는 질문이 나오고, 4~9번에서 서로 다른 입장이 맞붙음. debate = 논쟁, 토론.","c":2,"ev":"3번 문장","s":[[3,"The sale immediately sparked a debate: Should AI-generated work be considered real art?","그 판매는 즉시 논쟁을 불러일으켰다: AI가 만든 작품을 진짜 예술로 여겨야 할까?"]]},"h":"a6e7fc4a4f"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (However, AI art is gradually becoming part of the art world.)","ko":"하지만 AI 예술은 점점 미술계의 일부가 되고 있다.","opts":["갑자기","절대로","점점","우연히"],"word":"gradually","r":{"a":"3) 점점","w":"11번은 ‘becoming(되어 가는 중)’이라는 말과 함께 쓰여 조금씩 변하는 모습. gradually = 점차, 서서히. 갑자기는 반대 느낌.","c":3,"ev":"11번 문장","s":[[11,"However, AI art is gradually becoming part of the art world.","하지만 AI 예술은 점점 미술계의 일부가 되고 있다."]]},"h":"ede3778ca2"},{"n":6,"t":"ref","q":"What does the underlined \"this point of view\" refer to?\nFrom this point of view, the artist still makes key choices, such as writing prompts, editing, and choosing the final image.","ko":"밑줄 친 this point of view가 가리키는 것은?","sko":"이러한 관점에서, 예술가는 여전히 프롬프트 작성, 편집, 최종 이미지 선택 같은 핵심적인 선택을 한다.","opts":["AI는 진정한 의미가 부족하다는 관점","AI 작품이 비싸게 팔렸다는 사실","AI가 스스로 작품을 판매한다는 관점","AI를 다른 소프트웨어처럼 단순한 도구로 본다는 관점"],"r":{"a":"4) AI를 다른 소프트웨어처럼 단순한 도구로 본다는 관점","w":"4번에서 어떤 사람들은 AI를 다른 소프트웨어처럼 단순한 도구로 본다고 했고, 5번의 this point of view가 그 관점을 가리켜요.","c":4,"ev":"4~5번 문장","s":[[4,"Some people see AI simply as a tool, like any other software.","어떤 사람들은 AI를 다른 소프트웨어처럼 단순한 도구로 본다."],[5,"From this point of view, the artist still makes key choices, such as writing prompts, editing, and choosing the final image.","이러한 관점에서, 예술가는 여전히 프롬프트 작성, 편집, 최종 이미지 선택 같은 핵심적인 선택을 한다."]],"k":"this point of view = AI를 다른 소프트웨어처럼 단순한 도구로 본다는 관점"},"pron":"this point of view","h":"1595e8cd17"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Since AI only follows patterns based on data, it lacks true meaning and cannot fully replace human expression.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"AI는 데이터에 기반한 패턴만 따르기 때문에, 진정한 의미가 부족하고 인간의 표현을 완전히 대신할 수 없다.","opts":["AI는 데이터 속 패턴만 따르기 때문에 진정한 의미가 없고 인간의 표현을 완전히 대신할 수 없다.","AI는 데이터를 거부하기 때문에 새로운 표현을 만들 수 있다.","AI는 인간의 감정을 이해하기 때문에 인간의 표현을 완전히 대신할 수 있다.","AI는 패턴을 따르지 않기 때문에 진정한 의미를 가진다."],"r":{"a":"1) AI는 데이터 속 패턴만 따르기 때문에 진정한 의미가 없고 인간의 표현을 완전히 대신할 수 없다.","w":"Since가 이끄는 앞부분이 이유(데이터 패턴만 따름), 쉼표 뒤가 결과(진정한 의미가 부족하고 cannot fully replace = 완전히 대신할 수 없음). 나머지는 이유나 결과가 반대로 바뀌어 있음.","c":1,"ev":"9번 문장","s":[[9,"Since AI only follows patterns based on data, it lacks true meaning and cannot fully replace human expression.","AI는 데이터에 기반한 패턴만 따르기 때문에, 진정한 의미가 부족하고 인간의 표현을 완전히 대신할 수 없다."]]},"h":"f62f7f5418"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"글의 내용과 같은 것은?","oko":["그 초상화는 4,000달러보다 적게 들었다.","AI를 도구로 보는 사람들은 창의성이 AI에서 나온다고 믿는다.","다른 사람들은 진정한 예술이 컴퓨터 데이터에서 나온다고 주장한다.","AI 예술에 대한 논쟁은 아직 끝나지 않았다."],"opts":["The portrait cost less than $4,000.","People who see AI as a tool believe creativity comes from AI.","Others argue that true art comes from computer data.","The debate about AI art is far from over."],"r":{"a":"4) The debate about AI art is far from over. (AI 예술에 대한 논쟁은 아직 끝나지 않았다.)","w":"10번에서 논쟁은 끝나려면 한참 멀었다고 해요. 초상화는 40만 달러가 넘게 팔렸고(1번), 창의성은 인간 예술가에게서 나온다고 믿으며(6번), 진정한 예술은 인간의 감정과 생각에서 나온다고 주장해요(8번).","c":4,"ev":"1, 6, 8, 10번 문장","s":[[1,"In 2018, a portrait called Edmond de Belamy shocked the art world when it sold for over $400,000.","2018년, ‘에드몽 드 벨라미’라는 초상화가 40만 달러가 넘는 가격에 팔리며 미술계를 놀라게 했다."],[6,"Therefore, people believe creativity comes from the human artist.","따라서 사람들은 창의성이 인간 예술가에게서 나온다고 믿는다."],[8,"They argue that true art comes from human feelings and thoughts.","그들은 진정한 예술은 인간의 감정과 생각에서 나온다고 주장한다."],[10,"People may have different opinions, and the debate is far from over.","사람들은 서로 다른 의견을 가질 수 있고, 논쟁은 끝나려면 한참 멀었다."]]},"h":"34e1549097"},{"n":9,"t":"sum","q":"Others argue that true art comes from human (A) and (B).","ko":"다른 사람들은 진정한 예술이 인간의 (A)과(와) (B)에서 나온다고 주장한다.","oko":["(A) 데이터 / (B) 생각","(A) 감정 / (B) 패턴","(A) 데이터 / (B) 패턴","(A) 감정 / (B) 소프트웨어","(A) 감정 / (B) 생각"],"opts":["(A) data / (B) thoughts","(A) feelings / (B) patterns","(A) data / (B) patterns","(A) feelings / (B) software","(A) feelings / (B) thoughts"],"r":{"a":"5) (A) feelings / (B) thoughts ((A) 감정 / (B) 생각)","w":"8번에서 다른 사람들은 진정한 예술이 인간의 감정(feelings)과 생각(thoughts)에서 나온다고 주장해요.","c":5,"ev":"8번 문장","s":[[8,"They argue that true art comes from human feelings and thoughts.","그들은 진정한 예술은 인간의 감정과 생각에서 나온다고 주장한다."]]},"h":"fb57ef85ea"},{"n":10,"t":"fill","q":"In 2018, a portrait called Edmond de Belamy [A] the art world when it [B] for over $400,000.","ko":"2018년, ‘에드몽 드 벨라미’라는 초상화가 40만 달러가 넘는 가격에 [B] 때 미술계를 [A].","bank":["shocked","sold","data","patterns","software","choices"],"bko":{"shocked":"놀라게 했다(shock의 과거)","sold":"팔렸다(sell의 과거)","data":"데이터","patterns":"패턴들","software":"소프트웨어","choices":"선택들"},"r":{"a":"[A] shocked (놀라게 했다(shock의 과거)), [B] sold (팔렸다(sell의 과거))","w":"1번에서 초상화가 40만 달러가 넘는 가격에 팔려서(sold) 미술계를 놀라게 했다(shocked)고 해요. 둘 다 과거 시제 동사가 와야 하므로 명사인 data, patterns, software, choices는 안 맞아요.","c":null,"ev":"1번 문장","s":[[1,"In 2018, a portrait called Edmond de Belamy shocked the art world when it sold for over $400,000.","2018년, ‘에드몽 드 벨라미’라는 초상화가 40만 달러가 넘는 가격에 팔리며 미술계를 놀라게 했다."]]},"h":"04372a283d"}]},{"u":9,"id":"b3-09-1","no":1,"ko":"개가 장애물 코스를 달리는 스포츠, 어떻게 시작됐을까?","items":[{"n":1,"t":"tf","q":"Dog agility began in 1978 as an event to entertain audiences at a dog show.","ko":"도그 어질리티는 개 쇼에서 관객을 즐겁게 하는 행사로 1978년에 시작되었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"The sport began in 1978 as an event to entertain audiences at a dog show in the U.K.","이 스포츠는 1978년 영국의 한 개 쇼에서 관객을 즐겁게 하는 행사로 시작되었다."]],"w":"3번 문장에 began in 1978 as an event to entertain audiences at a dog show가 그대로 나옴. 본문과 일치.","c":"T"},"h":"6c6ecdec0e"},{"n":2,"t":"tf","q":"Only purebred dogs can take part in dog agility.","ko":"순종견만 도그 어질리티에 참가할 수 있다.","r":{"a":"F (본문과 다른 내용)","ev":"6번 문장","s":[[6,"Any dog, including mixed breeds, can participate.","믹스견을 포함해 어떤 개든 참가할 수 있다."]],"w":"6번 문장에서 믹스견을 포함해 어떤 개든(Any dog) 참가할 수 있다고 함. 순종견만 된다는 말과 반대.","c":"F"},"h":"de4d976954"},{"n":3,"t":"tf","q":"A dog gets a penalty if it makes a mistake such as knocking over a bar.","ko":"개가 바를 쓰러뜨리는 것 같은 실수를 하면 벌점을 받는다.","r":{"a":"T (본문과 맞는 내용)","ev":"11번 문장","s":[[11,"If a dog makes a mistake, such as knocking over a bar, the team receives a penalty.","개가 바를 쓰러뜨리는 것과 같은 실수를 하면, 팀은 벌점을 받는다."]],"w":"11번 문장에 If a dog makes a mistake, such as knocking over a bar, the team receives a penalty가 있음. 본문과 일치.","c":"T"},"h":"804ba00292"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (Any dog, including mixed breeds, can participate.)","ko":"어떤 개든, 믹스견을 포함해, 참가할 수 있다.","opts":["구경하다","참가하다","훈련하다","거절하다"],"word":"participate","r":{"a":"2) 참가하다","ev":"6번 문장","s":[[6,"Any dog, including mixed breeds, can participate.","믹스견을 포함해 어떤 개든 참가할 수 있다."]],"w":"6번 문장은 믹스견을 포함해 어떤 개든 경기에 함께 나설 수 있다는 뜻이라 participate = 참가하다. 구경하다는 직접 하지 않고 보기만 하는 것이라 달라요.","c":2},"h":"ade8dfeb3c"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (If a dog makes a mistake, such as knocking over a bar, the team receives a penalty.)","ko":"개가 바를 쓰러뜨리는 것 같은 실수를 하면, 팀은 벌점을 받는다.","opts":["상품","휴식","칭찬","벌점"],"word":"penalty","r":{"a":"4) 벌점","ev":"11번 문장","s":[[11,"If a dog makes a mistake, such as knocking over a bar, the team receives a penalty.","개가 바를 쓰러뜨리는 것과 같은 실수를 하면, 팀은 벌점을 받는다."]],"w":"11번 문장은 실수를 했을 때 팀이 받는 것이라 penalty = 벌점. 바로 뒤 12번 문장의 prizes(상)와 반대되는 말.","c":4},"h":"9ac1eeb198"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey need to complete the course as fast and perfectly as possible.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 코스를 가능한 한 빠르고 완벽하게 끝내야 한다.","opts":["관객들","장애물들","개와 조련사","심판들"],"r":{"a":"3) 개와 조련사","ev":"9~10번 문장","s":[[9,"To succeed, dogs and trainers require great teamwork.","성공하려면 개와 조련사는 훌륭한 팀워크가 필요하다."],[10,"They need to complete the course as fast and perfectly as possible.","그들은 코스를 가능한 한 빠르고 완벽하게 끝내야 한다."]],"w":"9번 문장의 주어가 dogs and trainers(개와 조련사)이고, 10번 They는 바로 이 개와 조련사를 다시 가리킴. 코스를 끝내야 하는 건 팀이라 관객이나 장애물이 아님.","c":3},"h":"bbb705bf84"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Interestingly, trainers only learn the course on the day of the event.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"흥미롭게도, 조련사들은 대회 당일에야 코스를 알게 된다.","opts":["조련사들은 대회 전날 코스를 미리 연습한다.","조련사들은 대회 당일이 되어서야 코스를 알게 된다.","조련사들은 직접 코스를 만들어서 대회에 나간다.","조련사들은 대회가 끝난 뒤에 코스를 알게 된다."],"r":{"a":"2) 조련사들은 대회 당일이 되어서야 코스를 알게 된다.","ev":"8번 문장","s":[[8,"Interestingly, trainers only learn the course on the day of the event.","흥미롭게도, 조련사들은 대회 당일에야 코스를 알게 된다."]],"w":"only ... on the day of the event는 ‘대회 당일에야’라는 뜻. 전날 연습이나 끝난 뒤 알게 된다는 말은 본문에 없고 직접 만든다는 말도 없음.","c":2},"h":"41ec5bd4aa"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["도그 어질리티는 1990년에 공식 스포츠가 되었다.","어질리티 경기는 영국에서만 열린다.","코스에는 터널, 점프, 위브 폴 같은 장애물이 있다.","개가 코스를 빨리 끝내면 벌점을 받는다."],"opts":["Dog agility became an official sport in 1990.","Agility events are held only in the U.K.","A course has obstacles like tunnels, jumps, and weave poles.","A dog gets a penalty when it finishes the course quickly."],"r":{"a":"3) A course has obstacles like tunnels, jumps, and weave poles.","ev":"4, 5, 7, 11번 문장","s":[[4,"It was so popular that it became an official sport in 1980.","그것은 매우 인기가 있어서 1980년에 공식 스포츠가 되었다."],[5,"Today, agility events are held around the world.","오늘날 어질리티 경기는 전 세계에서 열린다."],[7,"A course features various obstacles such as tunnels, jumps, weave poles, and even seesaws.","코스에는 터널, 점프, 위브 폴, 심지어 시소 같은 다양한 장애물이 있다."],[11,"If a dog makes a mistake, such as knocking over a bar, the team receives a penalty.","개가 바를 쓰러뜨리는 것과 같은 실수를 하면, 팀은 벌점을 받는다."]],"w":"7번 문장에 tunnels, jumps, weave poles가 있어 ③이 정답. ①은 4번에서 1980년, ②는 5번에서 전 세계, ④는 11번에서 벌점은 실수를 했을 때라 틀림.","c":3},"h":"74aed6d721"},{"n":9,"t":"sum","q":"Dogs race through obstacle courses by following their trainer’s (A), and to succeed, they need great (B).","ko":"개들은 조련사의 (A)을(를) 따라 장애물 코스를 달리고, 성공하려면 훌륭한 (B)이(가) 필요하다.","oko":["(A) 실수 / (B) 팀워크","(A) 지시 / (B) 음식","(A) 실수 / (B) 음식","(A) 규칙 / (B) 팀워크","(A) 지시 / (B) 팀워크"],"opts":["(A) mistakes / (B) teamwork","(A) directions / (B) food","(A) mistakes / (B) food","(A) rules / (B) teamwork","(A) directions / (B) teamwork"],"r":{"a":"5) (A) directions / (B) teamwork ((A) 지시 / (B) 팀워크)","ev":"2, 9번 문장","s":[[2,"They race through obstacle courses by following their trainer’s directions.","개들은 조련사의 지시를 따라 장애물 코스를 달린다."],[9,"To succeed, dogs and trainers require great teamwork.","성공하려면 개와 조련사는 훌륭한 팀워크가 필요하다."]],"w":"2번에서 개들은 조련사의 지시(directions)를 따라 장애물 코스를 달리고, 9번에서 성공하려면 훌륭한 팀워크(teamwork)가 필요하다고 해요.","c":5},"h":"d43cfba6ac"},{"n":10,"t":"fill","q":"Dog agility is a fun way for dogs and their owners to [A] their bond, and successful teams earn [B] and titles.","ko":"도그 어질리티는 개와 주인이 유대감을 [A] 재미있는 방법이고, 성공한 팀은 [B]과(와) 타이틀을 얻는다.","bank":["strengthen","prizes","penalty","entertain","participate","require"],"bko":{"strengthen":"강화하다","prizes":"상, 상품","penalty":"벌점","entertain":"즐겁게 하다","participate":"참가하다","require":"필요로 하다"},"r":{"a":"[A] strengthen (강화하다), [B] prizes (상, 상품)","ev":"12~13번 문장","s":[[12,"Successful teams earn prizes and titles.","성공한 팀은 상과 타이틀을 얻는다."],[13,"Dog agility is a fun way for dogs and their owners to strengthen their bond.","도그 어질리티는 개와 주인이 유대감을 강화하는 재미있는 방법이다."]],"w":"13번 문장에 strengthen their bond, 12번 문장에 earn prizes and titles가 있음. penalty는 11번에서 실수했을 때 받는 것, entertain은 3번 개 쇼 관객, participate는 6번 참가, require는 9번 팀워크가 필요하다는 말이라 이 빈칸에는 맞지 않음.","c":null},"h":"8061de483f"}]},{"u":9,"id":"b3-09-2","no":2,"ko":"주사위를 굴려 땅을 사고 건물을 짓는 게임의 정체는?","items":[{"n":1,"t":"tf","q":"Monopoly teaches players how money and business work.","ko":"모노폴리는 플레이어에게 돈과 사업이 어떻게 돌아가는지 가르쳐 준다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"It teaches players how money and business work.","그것은 플레이어에게 돈과 사업이 어떻게 돌아가는지 가르쳐 준다."]],"w":"3번 문장에 It teaches players how money and business work가 그대로 나옴. 본문과 일치.","c":"T"},"h":"8fd2e01295"},{"n":2,"t":"tf","q":"Monopoly is set in a real city.","ko":"모노폴리는 실제 도시를 배경으로 한다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Monopoly is set in a fictional city.","모노폴리는 가상의 도시를 배경으로 한다."]],"w":"4번 문장에서 모노폴리는 가상의 도시(a fictional city)를 배경으로 한다고 함. 실제 도시라는 말과 반대.","c":"F"},"h":"fc696ba9ec"},{"n":3,"t":"tf","q":"A player who owns all the properties of one color can build houses or hotels.","ko":"한 가지 색깔의 땅을 모두 소유한 플레이어는 집이나 호텔을 지을 수 있다.","r":{"a":"T (본문과 맞는 내용)","ev":"10번 문장","s":[[10,"If a player owns all the properties of one color, they can build houses or hotels to increase rent.","한 플레이어가 한 가지 색깔의 땅을 모두 소유하면, 임대료를 올리기 위해 집이나 호텔을 지을 수 있다."]],"w":"10번 문장 If a player owns all the properties of one color, they can build houses or hotels와 일치.","c":"T"},"h":"e88ca780d0"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (In this city, players compete to earn money, like businesspeople.)","ko":"이 도시에서 플레이어들은 사업가처럼 돈을 벌기 위해 경쟁한다.","opts":["협력하다","포기하다","경쟁하다","설명하다"],"word":"compete","r":{"a":"3) 경쟁하다","ev":"5번 문장","s":[[5,"In this city, players compete to earn money, like businesspeople.","이 도시에서 플레이어들은 사업가처럼 돈을 벌기 위해 경쟁한다."]],"w":"5번 문장은 플레이어들이 돈을 벌려고 서로 겨루는 상황이라 compete = 경쟁하다. 협력하다는 반대 방향.","c":3},"h":"d33ecacfe3"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (When a token lands on another player’s property, the owner collects rent.)","ko":"말이 다른 플레이어의 땅에 멈추면, 주인이 임대료를 받는다.","opts":["규칙","땅, 재산","질문","시작"],"word":"property","r":{"a":"2) 땅, 재산","ev":"9번 문장","s":[[9,"When a token lands on another player’s property, the owner collects rent.","말이 다른 플레이어의 땅에 멈추면, 그 주인이 임대료를 받는다."]],"w":"9번 문장에서 말이 멈추는 곳이고 그 주인이 임대료를 받으니 property = 소유한 땅(재산). 8번에서 buy land로 산 그 땅.","c":2},"h":"8bf82c4477"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey take turns rolling two dice and moving their tokens around the board.","ko":"밑줄 친 they가 가리키는 것은?","sko":"그들은 차례대로 주사위 두 개를 굴려 보드 위에서 자신의 말을 움직인다.","opts":["플레이어들","말들","주사위 두 개","임대료"],"r":{"a":"1) 플레이어들","ev":"6~7번 문장","s":[[6,"Each player chooses a token and gets some starting money.","각 플레이어는 말을 하나 고르고 약간의 시작 자금을 받는다."],[7,"They take turns rolling two dice and moving their tokens around the board.","그들은 차례대로 주사위 두 개를 굴려 보드 위에서 자신의 말을 움직인다."]],"w":"6번에서 각 플레이어가 말을 고르고 시작 자금을 받아요. 7번의 They는 그 플레이어들이고, 차례대로 주사위를 굴려요.","c":1,"k":"They = 플레이어들"},"pron":"They","h":"ab5eb05ddb"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"Although the game seems simple, Monopoly shows how money flows and how smart decisions can lead to success.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"게임은 단순해 보이지만, 모노폴리는 돈이 어떻게 흐르는지와 현명한 결정이 어떻게 성공으로 이어질 수 있는지를 보여 준다.","opts":["게임이 너무 어려워서 현명한 결정을 내리기 힘들다는 것을 보여 준다.","게임이 단순해서 돈의 흐름과 상관없이 운만으로 성공할 수 있다.","게임은 단순해 보이지만, 돈의 흐름과 현명한 결정이 성공으로 이어지는 과정을 보여 준다.","게임이 복잡해 보이지만, 사실은 돈이 하나도 오가지 않는다."],"r":{"a":"3) 게임은 단순해 보이지만, 돈의 흐름과 현명한 결정이 성공으로 이어지는 과정을 보여 준다.","ev":"12번 문장","s":[[12,"Although the game seems simple, Monopoly shows how money flows and how smart decisions can lead to success.","게임은 단순해 보이지만, 모노폴리는 돈이 어떻게 흐르는지와 현명한 결정이 어떻게 성공으로 이어질 수 있는지를 보여 준다."]],"w":"Although = 비록 ~이지만. 단순해 보이는 겉모습과 달리 돈의 흐름과 현명한 결정이 성공으로 이어지는 것을 보여 준다는 뜻. 어렵다거나 운만으로 성공한다는 말은 없음.","c":3},"h":"6aef637bf9"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["플레이어들은 돈 없이 게임을 시작한다.","게임에 마지막까지 남은 플레이어가 승자이다.","모노폴리는 영국의 실제 도시를 배경으로 한다.","모든 플레이어가 호텔을 지으면 게임이 끝난다."],"opts":["Players start the game without any money.","The last player left in the game is the winner.","Monopoly is set in a real city in the U.K.","The game ends when every player has built a hotel."],"r":{"a":"2) The last player left in the game is the winner. (게임에 마지막까지 남은 플레이어가 승자이다.)","ev":"11번 문장","s":[[11,"The game continues until all except one player lose all their money, and the last player left is the winner.","한 명을 제외한 모든 플레이어가 돈을 전부 잃을 때까지 게임이 계속되고, 마지막에 남은 플레이어가 승자이다."]],"w":"11번에서 한 명을 빼고 모두 돈을 잃을 때까지 게임이 계속되고, 마지막에 남은 플레이어가 승자라고 해요. 시작 자금을 받고(6번), 가상의 도시가 배경이며(4번), 호텔은 임대료를 올리려고 지어요(10번).","c":2},"h":"0edd7e4dba"},{"n":9,"t":"sum","q":"Monopoly is a world-famous (A) of a board game that feels like real (B).","ko":"모노폴리는 실제 (B)처럼 느껴지는 보드게임의 세계적으로 유명한 (A)이다.","oko":["(A) 규칙 / (B) 삶","(A) 예 / (B) 일","(A) 규칙 / (B) 일","(A) 예 / (B) 꿈","(A) 예 / (B) 삶"],"opts":["(A) rule / (B) life","(A) example / (B) work","(A) rule / (B) work","(A) example / (B) dream","(A) example / (B) life"],"r":{"a":"5) (A) example / (B) life ((A) 예 / (B) 삶)","ev":"1~2번 문장","s":[[1,"Have you ever played a board game that feels like real life?","실제 삶처럼 느껴지는 보드게임을 해 본 적이 있는가?"],[2,"Monopoly is a world-famous example.","모노폴리는 세계적으로 유명한 예이다."]],"w":"1번에서 실제 삶(real life)처럼 느껴지는 보드게임을 말하고, 2번에서 모노폴리는 세계적으로 유명한 예(example)라고 해요.","c":5},"h":"97f590f747"},{"n":10,"t":"fill","q":"Players can [A] land, pay [B], and collect rent from each other.","ko":"플레이어들은 땅을 [A] 수 있고, [B]을(를) 내고, 서로에게서 임대료를 받을 수 있다.","bank":["buy","fees","smart","simple","starting","famous"],"bko":{"buy":"사다","fees":"요금","smart":"현명한","simple":"단순한","starting":"시작하는","famous":"유명한"},"r":{"a":"[A] buy (사다), [B] fees (요금)","ev":"8번 문장","s":[[8,"Players can buy land, pay fees, and collect rent from each other.","플레이어들은 땅을 사고, 요금을 내고, 서로에게서 임대료를 받을 수 있다."]],"w":"8번에서 플레이어들은 땅을 사고(buy), 요금(fees)을 내고, 서로에게서 임대료를 받을 수 있다고 해요. can 뒤에는 동사가, pay 뒤에는 명사가 와야 해요.","c":null},"h":"4de7a1fd19"}]},{"u":9,"id":"b3-09-3","no":3,"ko":"영화 앞에 나오는 ‘트레일러’, 왜 이름이 ‘뒤따르는 것’일까?","items":[{"n":1,"t":"tf","q":"Nils Granlund made a short video to promote a musical in 1913.","ko":"닐스 그랜룬드는 1913년에 뮤지컬을 홍보하기 위한 짧은 영상을 만들었다.","r":{"a":"T (본문과 맞는 내용)","ev":"3번 문장","s":[[3,"In 1913, he made a short video to promote an upcoming musical called The Pleasure Seekers and played it after another performance.","1913년에 그는 곧 있을 〈The Pleasure Seekers〉라는 뮤지컬을 홍보하기 위한 짧은 영상을 만들어 다른 공연이 끝난 후에 상영했다."]],"w":"3번 문장에 In 1913, he made a short video to promote an upcoming musical이 있음. 본문과 일치.","c":"T"},"h":"9451c2145d"},{"n":2,"t":"tf","q":"The word “trailer” comes from a word meaning “to go first.”","ko":"‘트레일러’라는 단어는 ‘먼저 가다’를 뜻하는 단어에서 왔다.","r":{"a":"F (본문과 다른 내용)","ev":"7번 문장","s":[[7,"The word comes from “trail,” which means “to follow behind.”","그 단어는 ‘뒤에서 따라가다’를 뜻하는 ‘trail’에서 왔다."]],"w":"7번 문장에서 trail은 to follow behind(뒤에서 따라가다)라는 뜻이라고 함. ‘먼저 가다’는 반대 뜻.","c":"F"},"h":"51ba78a0f0"},{"n":3,"t":"tf","q":"After the video, fewer people came to see the musical.","ko":"그 영상 이후 뮤지컬을 보러 온 사람은 줄었다.","r":{"a":"F (본문과 다른 내용)","ev":"4번 문장","s":[[4,"Thanks to the video, more people came to see the musical.","그 영상 덕분에 더 많은 사람들이 그 뮤지컬을 보러 왔다."]],"w":"4번 문장에서 영상 덕분에 더 많은 사람들이 뮤지컬을 보러 왔다고 함. 줄었다는 말과 반대.","c":"F"},"h":"2d42d452b1"},{"n":4,"t":"vocab","q":"What is the meaning of the underlined word? (...he made a short video to promote an upcoming musical...)","ko":"... 곧 있을 뮤지컬을 홍보하기 위한 짧은 영상을 만들었다.","opts":["금지하다","설명하다","예약하다","홍보하다"],"word":"promote","r":{"a":"4) 홍보하다","ev":"3번 문장","s":[[3,"In 1913, he made a short video to promote an upcoming musical called The Pleasure Seekers and played it after another performance.","1913년에 그는 곧 있을 〈The Pleasure Seekers〉라는 뮤지컬을 홍보하기 위한 짧은 영상을 만들어 다른 공연이 끝난 후에 상영했다."]],"w":"3번 문장에서 뮤지컬을 알려서 사람들이 보러 오게 하려고 영상을 만들었다는 뜻이라 promote = 홍보하다. 이 단어는 6번 promotional videos(홍보 영상)에도 이어짐.","c":4},"h":"78917d4ab6"},{"n":5,"t":"vocab","q":"What is the meaning of the underlined word? (...he was expected to find new ways to attract audiences.)","ko":"... 그는 관객을 끌어들일 새로운 방법을 찾을 것으로 기대되었다.","opts":["쫓아내다","끌어들이다","가르치다","잊다"],"word":"attract","r":{"a":"2) 끌어들이다","ev":"2번 문장","s":[[2,"As part of his job, he was expected to find new ways to attract audiences.","직무의 일부로서, 그는 관객을 끌어들일 새로운 방법을 찾을 것으로 기대되었다."]],"w":"2번 문장은 광고 담당자의 일이라 관객을 많이 오게 하는 것. attract = 끌어들이다. 4번에서 영상 덕분에 더 많은 사람이 온 것과 이어짐.","c":2},"h":"ae6b319028"},{"n":6,"t":"ref","q":"What does the underlined \"They\" refer to?\nThey kept the name “trailer,” even though it no longer played at the end.","ko":"밑줄 친 They가 가리키는 것은?","sko":"그들은 그것이 더 이상 끝에 상영되지 않는데도 ‘트레일러’라는 이름을 유지했다.","opts":["관객들","그랜룬드","극장들","뮤지컬 배우들"],"r":{"a":"3) 극장들","ev":"10~11번 문장","s":[[10,"So theaters began showing the videos before performances.","그래서 극장들은 공연 전에 영상을 보여 주기 시작했다."],[11,"They kept the name “trailer,” even though it no longer played at the end.","그것이 더 이상 끝에 상영되지 않는데도 그들은 ‘트레일러’라는 이름을 유지했다."]],"w":"10번 문장의 주어가 theaters(극장들)이고, 공연 전에 영상을 보여 주기 시작한 것도 극장들. 11번 They는 그 극장들.","c":3},"h":"ea1a425d7a"},{"n":7,"t":"sense","q":"Which is the best meaning of the sentence?\n\"By the time the trailer came on, many audience members had already left.\"","ko":"이 문장의 의미로 가장 알맞은 것은?","sko":"트레일러가 나올 때쯤이면, 많은 관객이 이미 떠난 상태였다.","opts":["트레일러가 나올 때쯤 많은 관객은 이미 자리를 떠난 뒤였다.","트레일러가 나오자 많은 관객이 다시 자리로 돌아왔다.","많은 관객이 트레일러를 보려고 일찍 도착했다.","트레일러가 끝나자 관객들이 모두 박수를 쳤다."],"r":{"a":"1) 트레일러가 나올 때쯤 많은 관객은 이미 자리를 떠난 뒤였다.","ev":"9번 문장","s":[[9,"By the time the trailer came on, many audience members had already left.","트레일러가 나올 때쯤이면, 많은 관객이 이미 떠난 상태였다."]],"w":"by the time ~는 ‘~할 때쯤에는’, had already left(leave(떠나다)의 완료형)는 ‘이미 떠난 상태’. 시간 순서상 관객이 먼저 떠나고 트레일러가 나옴. 돌아왔다거나 박수를 쳤다는 말은 없음.","c":1},"h":"653d24159b"},{"n":8,"t":"match","q":"Which is the same as the passage?","ko":"본문과 일치하는 것은?","oko":["닐스 그랜룬드는 런던의 극장에서 일했다.","첫 트레일러는 영화가 시작되기 전에 상영되었다.","트레일러는 처음부터 늘 공연 전에 상영되었다.","처음에 홍보 영상이 끝에 상영되어서 트레일러라는 이름이 붙었다."],"opts":["Nils Granlund worked at a theater in London.","The first trailer was shown before a movie began.","Trailers have always been shown before performances.","The first promotional videos were shown at the end, which is how trailers got their name."],"r":{"a":"4) The first promotional videos were shown at the end, which is how trailers got their name.","ev":"1, 3, 6, 10번 문장","s":[[1,"A man named Nils Granlund worked as an advertising manager at a theater in New York which showed live stage performances and films.","닐스 그랜룬드라는 남자는 라이브 무대 공연과 영화를 상영하는 뉴욕의 한 극장에서 광고 담당자로 일했다."],[3,"In 1913, he made a short video to promote an upcoming musical called The Pleasure Seekers and played it after another performance.","1913년에 그는 곧 있을 〈The Pleasure Seekers〉라는 뮤지컬을 홍보하기 위한 짧은 영상을 만들어 다른 공연이 끝난 후에 상영했다."],[6,"Since these promotional videos were shown at the end, they were called “trailers.”","이 홍보 영상들은 끝에 상영되었기 때문에 ‘트레일러’라고 불렸다."],[10,"So theaters began showing the videos before performances.","그래서 극장들은 공연 전에 영상을 보여 주기 시작했다."]],"w":"6번 문장에서 홍보 영상이 끝에 상영되어 trailer라고 불렸다고 해서 ④가 정답. ①은 1번에서 뉴욕, ②는 3번에서 다른 공연이 끝난 후, ③은 10번에서 나중에 앞으로 옮겼다고 해 틀림.","c":4},"h":"e1ce4d1438"},{"n":9,"t":"sum","q":"Nils Granlund worked as an (A) manager at a theater that showed live (B) performances and films.","ko":"닐스 그랜룬드는 라이브 (B) 공연과 영화를 상영하는 극장에서 (A) 담당자로 일했다.","oko":["(A) 판매 / (B) 스포츠","(A) 광고 / (B) 스포츠","(A) 판매 / (B) 무대","(A) 안전 / (B) 무대","(A) 광고 / (B) 무대"],"opts":["(A) sales / (B) sports","(A) advertising / (B) sports","(A) sal
